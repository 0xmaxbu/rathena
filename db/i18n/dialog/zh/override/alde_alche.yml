  npc_override_alde_alche_2004_headgears_s_done_you_okay_luckily_1c5e6c: "完成了。但你还好吗？幸运的是，我想我没有剥你的头皮。"
  npc_override_alde_alche_2004_headgears_s_done_your_new_life_57f57d: "完成了！你作为派对灵魂的新生活正式开始了。你所要做的就是戴上这顶派对帽。不过，知道几个笑话可能也会有帮助。"
