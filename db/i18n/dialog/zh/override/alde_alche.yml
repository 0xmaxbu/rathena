  npc_override_alde_alche_2004_headgears_oh_i_see_you_ve_30faf3: "哦，我看到你采纳了我的建议，通过战斗结识了许多其他兽人。"
  npc_override_alde_alche_2004_headgears_oh_man_everyone_needs_pa_96c4fa: "哦……天哪。每个人都需要一顶派对帽！即使无聊的人戴上也会变得活力四射！"
  npc_override_alde_alche_2004_headgears_oh_one_more_thing_don_7ed5be: "哦，还有一件事，不要把自己和苏希搞混然后自杀！"
  npc_override_alde_alche_2004_headgears_oh_right_1cea00: "哦，对。"
  npc_override_alde_alche_2004_headgears_oh_right_arrow_apple_arc_dfd36a: "哦，对，这支来自射手苹果的箭是剩下的，所以你可以拿走。"
  npc_override_alde_alche_2004_headgears_oh_right_f48cb4: "哦，对。"
  npc_override_alde_alche_2004_headgears_oh_right_why_humans_scum_b79a08: "哦对，为什么人类是渣滓。"
  npc_override_alde_alche_2004_headgears_oh_s_you_again_b215ef: "哦……又是你。"
