  npc_override_alde_alche_2004_headgears_how_sound_6ebf32: "听起来怎么样？"
  npc_override_alde_alche_2004_headgears_however_i_need_help_comp_11d18a: "然而，我需要帮助来完成我的研究。因此，我告诉了你我的故事，冒险者。"
  npc_override_alde_alche_2004_headgears_however_you_made_decisio_ec5d36: "然而，你做出了继续这个测试的决定！不过，没必要着急。生命是一系列无尽的战斗，所以战斗会来的。"
  npc_override_alde_alche_2004_headgears_huh_what_s_think_about_c1c709: "嗯。有什么好想的？！我本来要用我所有的技能为你创造一些特别的东西。啊好吧……"
  npc_override_alde_alche_2004_headgears_human_accomplishing_such_293dfd: "对于一个人类来说，完成这样的壮举真是令人惊讶。通过所有的战斗，我相信你已经了解了我部落的好的和坏的一面。"
  npc_override_alde_alche_2004_headgears_human_i_like_you_90b1dc: "人类，我喜欢你。"
  npc_override_alde_alche_2004_headgears_human_what_you_doing_my_4a4471: "人类，你在我的家里做什么？！"
  npc_override_alde_alche_2004_headgears_human_who_better_underst_db765a: "一个比其他人类更理解的人类。一个无论种族都向他人展示力量的人，我把你留给混沌的未来。"
  npc_override_alde_alche_2004_headgears_human_you_e8ee8a: "人类，你有"
  npc_override_alde_alche_2004_headgears_humans_always_invading_o_362d72: "人类总是入侵我们的村庄，闯入我们的土地！他们杀死我们的战士不是出于荣誉，而是出于自私的人类原因！！"
  npc_override_alde_alche_2004_headgears_humans_may_built_cities_c41ddd: "人类可能建造了城市和城镇，但我们兽人也创造了自己的洞穴群和运河！"
  npc_override_alde_alche_2004_headgears_humans_such_annoying_bas_5c1faf: "人类……如此烦人的混蛋！"
  npc_override_alde_alche_2004_headgears_hungry_blood_9c8f74: "渴望鲜血……？"
  npc_override_alde_alche_2004_headgears_hunting_parties_21da2d: "还有狩猎队？"
  npc_override_alde_alche_2004_headgears_hurrumph_db429a: "哼。"
  npc_override_alde_alche_2004_headgears_i_am_proud_say_my_045603: "我很自豪地说这是我的杰作。请收下这个物品。我称它为……''恶魔之翼耳朵！''"
  npc_override_alde_alche_2004_headgears_i_am_proud_say_my_734b23: "我很自豪地说这是我的杰作。请收下这个物品。我称它为……"
  npc_override_alde_alche_2004_headgears_i_am_proud_say_my_99be47: "我很自豪地说这是我的杰作。请收下这个物品。我称它为……''天使之翼耳朵！''"
  npc_override_alde_alche_2004_headgears_i_collect_these_things_m_d8dd59: "我很想自己收集这些东西，但每次我去钟楼，我都不忍心打破闹钟，只是敬畏地盯着它们机械的、阳刚的体格。"
  npc_override_alde_alche_2004_headgears_i_cut_mr_smile_way_5d3968: "我这样切微笑先生~。"
  npc_override_alde_alche_2004_headgears_i_d9b4ac: "我……"
  npc_override_alde_alche_2004_headgears_i_d_wear_myself_if_f6d74b: "如果不是因为人们从不看我的脸，我自己也会戴它。我遇到的每个人似乎都专注于我那雕刻般的身材。但相信我，这个面具很酷。"
  npc_override_alde_alche_2004_headgears_i_decided_make_hat_one_94da33: "我决定用那个完美的野兽做一顶帽子，它对阳光免疫，永远不必屈服于它的力量。"
  npc_override_alde_alche_2004_headgears_i_desperately_need_mater_a8046f: "我迫切需要材料来继续测试，以便开发一个原型。我需要来自闹钟的^0000FF钟指针^000000和^0000FF尖叫先生^000000来继续我的研究。"
  npc_override_alde_alche_2004_headgears_i_did_good_job_didn_417b67: "我做得很好，不是吗？"
  npc_override_alde_alche_2004_headgears_i_don_t_anything_make_8f8f8d: "但我没有任何东西可以做纸花。"
  npc_override_alde_alche_2004_headgears_i_don_t_care_how_0374d3: "我不在乎你带来的物品升级了多少次，但请^4d4dff只携带你制作这个物品所需的物品。^000000我不能因为你可能犯的错误而搞砸我的艺术品。"
  npc_override_alde_alche_2004_headgears_i_don_t_know_if_673753: "我不知道每个人戴着这个是否会服从你的命令，但至少你可以感觉美丽而高贵。"
  npc_override_alde_alche_2004_headgears_i_don_t_like_way_f0f2b9: "我不喜欢它倾斜的方式。它应该朝^FF3333另一个^000000方向生长。"
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_401fe4: "我不把你给我的9,000个杰勒比当回事。"
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_496d6f: "我不把你给我的3,000个杰勒比当回事。"
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_77f5ba: "我不把你给我的4,000个杰勒比当回事。"
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_7c9ccf: "我不把你给我的5,000个杰勒比当回事。"
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_80544f: "我不把你给我的7,000个杰勒比当回事。"
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_a7519b: "我不把你给我的8,000个杰勒比当回事。"
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_efc5bc: "我不把你给我的2,000个杰勒比当回事！！"
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_f1ad98: "我不把你给我的6,000个杰勒比当回事。"
  npc_override_alde_alche_2004_headgears_i_don_t_think_there_a36974: "我不认为有什么诅咒会根据人类的行为把他们变成完全丑陋的生物。所以很难判断哪些人类是光荣的……"
  npc_override_alde_alche_2004_headgears_i_don_t_understand_why_3190e0: "我不明白我为什么要分享关于我部落的故事。"
  npc_override_alde_alche_2004_headgears_i_expect_great_things_yo_d7cc60: "我对你寄予厚望！"
  npc_override_alde_alche_2004_headgears_i_expected_you_quit_now_e03598: "我原以为你现在会放弃。但我错了，因为你又来了。我们达成了协议，我会遵守我的承诺。"
  npc_override_alde_alche_2004_headgears_i_forget_how_breathtakin_c5e769: "我忘了我的身体有多么令人叹为观止。没关系，慢慢来，品味视觉上的愉悦……"
  npc_override_alde_alche_2004_headgears_i_forgot_tell_you_i_5a6ce7: "我忘了告诉你，我不仅可以组装一顶''模特训练帽''，我还可以把它拆解成原来的部件。"
  npc_override_alde_alche_2004_headgears_i_give_you_kitsune_mask_6b2e76: "如果你给我带来我要的东西，我会给你这个^0000FF狐面具^000000。听起来怎么样？记住，^0000FF999个^FF0000九尾^000000。"
  npc_override_alde_alche_2004_headgears_i_guess_8d1d83: "我想……"
  npc_override_alde_alche_2004_headgears_i_guess_being_life_party_0cb27b: "我想成为派对的灵魂对你来说有点太多了，嗯？哼。好吧，我知道朱诺有一个不错的图书馆，你可以在那里闲逛……"
  npc_override_alde_alche_2004_headgears_i_guess_i_must_pumped_d073d8: "我想我一定是意外泵到了这些光荣的二头肌之一。"
  npc_override_alde_alche_2004_headgears_i_guess_i_need_practice_6ca775: "我想……我需要更经常练习变形。*叹息*"
  npc_override_alde_alche_2004_headgears_i_guess_we_should_make_889d01: "我想我们应该把那朵蘑菇做成发带，这样你就可以根据你的风格调整它。"
  npc_override_alde_alche_2004_headgears_i_guess_you_decided_come_418230: "我猜你决定进来，以为没人在，在杀了我的同类之后休息一下。"
  npc_override_alde_alche_2004_headgears_i_guess_you_don_t_17e53a: "我猜你不知道这顶特殊头盔有什么特别的……"
  npc_override_alde_alche_2004_headgears_i_guess_you_just_don_5b6194: "我猜你只是不欣赏牛仔英雄的价值，是吗？"
  npc_override_alde_alche_2004_headgears_i_happened_come_juno_whi_372a9d: "我碰巧在环游世界时来到了朱诺。在云端之上的某个地方让我有点紧张，但尽管如此，从上面看风景很棒。"
  npc_override_alde_alche_2004_headgears_i_hate_humans_fact_all_8f5acb: "我恨人类！事实上，所有兽人都恨人类！恨你恨你恨你，带着激情！"
  npc_override_alde_alche_2004_headgears_i_haven_t_been_able_7b6d20: "我还没试过，因为斯莫基很重，我得先锻炼我的颈部肌肉，然后才能把斯莫基绑在头上。"
  npc_override_alde_alche_2004_headgears_i_haven_t_gotten_work_7a534b: "我还没能让它按我想要的方式工作。但它是一片大叶子！它会提供一些阴凉。"
  npc_override_alde_alche_2004_headgears_i_hope_you_8b614a: "我希望你"
  npc_override_alde_alche_2004_headgears_i_hope_you_a682cd: "我希望你"
  npc_override_alde_alche_2004_headgears_i_hope_you_know_meaning_3ce1cd: "我希望你知道归还我徽章的意义。我期望我们会在战场上再次相遇。"
  npc_override_alde_alche_2004_headgears_i_hope_you_re_having_852881: "希望你在梦罗克过得愉快。如果你质疑动物的特殊能力，只要想想雄伟的沙漠之狼，它能在梦罗克严酷的沙漠中茁壮成长。"
  npc_override_alde_alche_2004_headgears_i_just_wanted_show_you_3fc19d: "但我只是想向你展示我有多厉害……"
  npc_override_alde_alche_2004_headgears_i_knew_you_succeed_c4ff38: "我就知道你会成功！"
  npc_override_alde_alche_2004_headgears_i_know_how_you_humans_d284a8: "我知道你们人类怎么想……"
  npc_override_alde_alche_2004_headgears_i_know_i_know_a62142: "我知道，我知道……"
  npc_override_alde_alche_2004_headgears_i_know_i_know_having_201d5b: "我知道，我知道，头上戴一只浣熊听起来很荒谬，但如果你愿意听我说，这有一定道理。"
  npc_override_alde_alche_2004_headgears_i_know_i_know_wearing_199666: "我知道，我知道，头上戴一片大叶子听起来不实用。但是，如果你愿意听我说，这有一定道理。"
  npc_override_alde_alche_2004_headgears_i_know_putting_fish_top_271930: "我知道把一条鱼放在头顶听起来不是最好的主意，但如果你愿意听我说，这有一定道理。"
  npc_override_alde_alche_2004_headgears_i_know_you_brought_every_7e47e4: "我知道你带来了所有我需要的东西来给你做帽子，但你带的东西太多了。为什么不把一些东西放进卡普拉仓库呢？"
  npc_override_alde_alche_2004_headgears_i_know_you_d34b05: "我认识你吗？……"
  npc_override_alde_alche_2004_headgears_i_let_you_either_eleganc_0fe956: "我会让你拥有天使的优雅或恶魔的魅力，只有我能制作的可穿戴物品。"
  npc_override_alde_alche_2004_headgears_i_like_folding_paper_mak_dc3bb3: "我喜欢折纸。我给我妈妈做了一艘大纸船，她给了我一个大大的微笑，拍了拍我的头！"
  npc_override_alde_alche_2004_headgears_i_like_joke_you_played_39a828: "我不喜欢你对我开的这个玩笑，人类。不过，我不相信你真的带来了^FF00001000个杰勒比^000000。"
  npc_override_alde_alche_2004_headgears_i_like_you_b41823: "我喜欢你，"
  npc_override_alde_alche_2004_headgears_i_live_here_i_should_0e4b17: "我住在这里，我应该知道。不过，没有什么能比得上梦罗克的日落。"
  npc_override_alde_alche_2004_headgears_i_ll_come_back_later_d7a0da: "我稍后再来，孩子。"
  npc_override_alde_alche_2004_headgears_i_ll_just_here_enjoying_62fd99: "我就在这里欣赏风景。"
  npc_override_alde_alche_2004_headgears_i_ll_need_f4f8ab: "我需要……"
  npc_override_alde_alche_2004_headgears_i_ll_right_here_when_0e58cc: "当你决定用一顶完美的帽子来放松、休息的时候，我就在这里。保持酷~"
  npc_override_alde_alche_2004_headgears_i_ll_right_here_when_df04ca: "当你决定用一顶派对帽来提升你的生活时，我就在这里。"
  npc_override_alde_alche_2004_headgears_i_m_always_here_scenic_984b3d: "我一直在这个风景优美的地方，这样我可以欣赏风景。随时回来，只要你愿意。"
  npc_override_alde_alche_2004_headgears_i_m_da_house_b937fc: "我在这里！"
  npc_override_alde_alche_2004_headgears_i_m_done_8884e6: "我完成了！"
  npc_override_alde_alche_2004_headgears_i_m_down_2d94f1: "我支持你。"
  npc_override_alde_alche_2004_headgears_i_m_finished_6c49fc: "我完成了！"
  npc_override_alde_alche_2004_headgears_i_m_gonna_make_one_1eb3c7: "我要给我妹妹做一个~！还有我爱的每个人！"
  npc_override_alde_alche_2004_headgears_i_m_good_boy_14666f: "我是个好孩子！"
  npc_override_alde_alche_2004_headgears_i_m_little_disappointed_f7be2f: "我有点失望，但你可能已经有一顶不错的帽子来挡住阳光了。好吧，如果你改变主意，我就在这里。"
  npc_override_alde_alche_2004_headgears_i_m_mad_hatter_well_49722d: "我是''疯帽匠''。好吧，至少我是这么叫自己的。"
  npc_override_alde_alche_2004_headgears_i_m_master_creating_stuf_cfbefd: "我是制作毛绒动物的大师，这些是很好的礼物。众所周知，每个人都喜欢拥抱可爱又 cuddly 的毛绒动物。"
  npc_override_alde_alche_2004_headgears_i_m_sorry_buddy_i_2e7df3: "抱歉，伙计，但没有我需要的东西我做不了这个物品。记住，我需要1个恶魔之翼、1个精灵耳朵和20,000 Zeny。"
  npc_override_alde_alche_2004_headgears_i_m_sorry_buddy_i_53ac24: "抱歉，伙计，但没有我需要的东西我做不了这个物品。记住，我需要1个恶魔之翼、1个精灵耳朵和20,000 Zeny。"
  npc_override_alde_alche_2004_headgears_i_m_sorry_buddy_i_63ae27: "抱歉，伙计，但没有我需要的东西我做不了这个物品。记住，我需要1个天使之翼、1个精灵耳朵和20,000 Zeny。"
  npc_override_alde_alche_2004_headgears_i_m_too_tired_kill_160acb: "我今天太累了，不想杀你，但保持安静！如果你受伤了，你可以静静地躺在地板上流血，带着一些荣誉死去，我想。"
  npc_override_alde_alche_2004_headgears_i_made_hat_all_my_e811c4: "我全心全意地做了这顶帽子，所以你必须答应我会好好照顾它，好吗？"
  npc_override_alde_alche_2004_headgears_i_make_drooping_cat_righ_432653: "当你把所有那些物品带来时，我马上给你做一顶垂耳猫。"
  npc_override_alde_alche_2004_headgears_i_must_say_very_cheap_1bc09f: "我必须说考虑到我将为你制作的物品，这是一个非常便宜的价格。但在我开始之前，我应该告诉你……"
  npc_override_alde_alche_2004_headgears_i_must_say_very_cheap_216ad6: "我必须说为这么棒的物品支付这个价格非常便宜。但在我开始之前，我应该告诉你……"
  npc_override_alde_alche_2004_headgears_i_need_8e627a: "我需要……"
  npc_override_alde_alche_2004_headgears_i_need_devil_wing_635641: "我需要1个^4d4dff恶魔之翼^000000，"
  npc_override_alde_alche_2004_headgears_i_need_raccoon_hat_smoki_a84530: "我需要^0000FF1个浣熊帽^000000和^0000FF1片斯莫基树叶^000000，这样我就能给你做一顶^4D4DFF海獭帽^000000。"
  npc_override_alde_alche_2004_headgears_i_need_stellar_ddd192: "我需要^FF00001个星辰^000000"
  npc_override_alde_alche_2004_headgears_i_need_these_items_make_49d513: "我需要这些物品来做一顶牛仔帽……"
  npc_override_alde_alche_2004_headgears_i_neeeeed_ce6b5d: "我需要……"
  npc_override_alde_alche_2004_headgears_i_now_give_you_7ad03e: "我现在给你"
  npc_override_alde_alche_2004_headgears_i_put_together_raccoon_h_e20fc6: "我得把^0000FF1个浣熊帽^000000和^0000FF1片斯莫基树叶^000000组合起来，给你做一顶^4D4DFF海獭帽^000000。"
  npc_override_alde_alche_2004_headgears_i_really_disappointed_yo_ac17bd: "如果你放弃你已经开始的挑战，我会对你非常失望。"
  npc_override_alde_alche_2004_headgears_i_refuse_c18d8d: "我拒绝"
  npc_override_alde_alche_2004_headgears_i_refuse_speak_you_until_4eadd2: "在我数完所有这些杰勒比之前，我拒绝和你说话。"
  npc_override_alde_alche_2004_headgears_i_see_as_you_wish_03b2c8: "我明白了，随你便。"
  npc_override_alde_alche_2004_headgears_i_see_c52c6e: "我明白了。"
  npc_override_alde_alche_2004_headgears_i_see_df1185: "我明白了~"
  npc_override_alde_alche_2004_headgears_i_see_i_force_you_b4092d: "我明白了。我不会强迫你选择我希望看到的事情。我尊重你的决定。"
  npc_override_alde_alche_2004_headgears_i_see_jellopy_your_hands_41e4d5: "我能看到你手里的杰勒比，我很确定你又带来了一千个，所以让我们快点结束吧。"
  npc_override_alde_alche_2004_headgears_i_see_you_must_brought_ac405c: "我明白了。你一定带来了你不想失去卡片或升级的升级物品。随时回来，当你准备好的时候。"
  npc_override_alde_alche_2004_headgears_i_see_your_eyes_you_61eb5f: "我从你的眼睛里看出你经历过许多小冲突。能活到现在，你一定知道胜利的秘诀……"
  npc_override_alde_alche_2004_headgears_i_see_your_eyes_you_956883: "我从你的眼睛里看出你也以纯洁的心、热情的心战斗！"
  npc_override_alde_alche_2004_headgears_i_sense_you_adventurer_g_9c1314: "我感觉到你是一个心地善良的冒险者，像你这样的甜女孩值得一份好礼物。"
  npc_override_alde_alche_2004_headgears_i_sense_you_adventurer_p_e79ebc: "但我感觉到你是一个心地纯洁的冒险者，不会自私地使用泰迪熊帽子。"
  npc_override_alde_alche_2004_headgears_i_set_work_immediately_l_7f37d0: "我立即开始工作，列出我知道的所有不在阳光下打盹的动物。然后，我去掉了我不喜欢的动物，尤其是那些名字很长的。"
  npc_override_alde_alche_2004_headgears_i_shall_grant_you_true_accad2: "我将赐予你真正的"
  npc_override_alde_alche_2004_headgears_i_suggest_you_you_experi_ec085a: "我建议你多和外面许多不同的兽人战斗。那是理解和学习兽人部落最好的方式。"
  npc_override_alde_alche_2004_headgears_i_take_western_grace_add_00b518: "我取一个西部优雅，加一些男子气概，嗯，做一些调整，然后瞧~！一顶牛仔帽！"
  npc_override_alde_alche_2004_headgears_i_think_you_endure_much_80a56d: "我不认为你还能忍受更多的折磨。"
  npc_override_alde_alche_2004_headgears_i_think_you_need_hat_95f0a7: "我想你需要这顶帽子比我想象的更多。你得学会放松和休息~！"
  npc_override_alde_alche_2004_headgears_i_thinking_eac452: "我在想……"
  npc_override_alde_alche_2004_headgears_i_told_somehow_ended_han_d079f7: "我听说它不知怎的落到了一个人类手里，但我不知道是你，人类兽人英雄。"
  npc_override_alde_alche_2004_headgears_i_took_orcish_voucher_yo_51493d: "我现在从你这里拿走了100个兽人凭证。现在，战斗吧，直到你击败了10,000个更多的兽人战士，这样整个部落都会认可你！"
  npc_override_alde_alche_2004_headgears_i_understand_40038e: "我明白了。"
  npc_override_alde_alche_2004_headgears_i_using_items_you_ve_511871: "我会使用你给我的物品，以便继续我在米德加尔特传播印第安头带的工作，并向米德加尔特的部落致敬。"
  npc_override_alde_alche_2004_headgears_i_ve_created_magic_spell_a1adeb: "我创造了一个可以让蘑菇在任何地方生长的魔法！任何你能想象的地方，我都能让蘑菇在那里生长。"
  npc_override_alde_alche_2004_headgears_i_ve_ever_met_de2b28: "我见过的。"
  npc_override_alde_alche_2004_headgears_i_ve_talked_too_much_30a9b3: "……我已经说得太多了。"
  npc_override_alde_alche_2004_headgears_i_wished_other_orcs_see_5a31c3: "我希望其他兽人看到并理解，并非所有人类都是邪恶和自私的。"
  npc_override_alde_alche_2004_headgears_i_you_want_efaba2: "你想要的话我可以做！"
  npc_override_alde_alche_2004_headgears_i_zhenbolt_dc7b8e: "是我，真博尔特。"
  npc_override_alde_alche_2004_headgears_if_any_chance_you_angel_04617b: "如果你碰巧有一个天使之翼或邪恶之翼，还有"
  npc_override_alde_alche_2004_headgears_if_book_apple_archer_ite_77ad91: "如果你带来的^FF0000'书'和'射手苹果'^000000是^FF0000升级过的^000000，在我用这本书制作帽子后，^FF0000这些升级，包括镶嵌的卡片，将会丢失。^"
  npc_override_alde_alche_2004_headgears_if_cap_you_use_make_5b83c9: "如果你用来制作这顶针织帽的帽子是升级过的，任何卡片或升级一旦我制作了这顶帽子就会丢失！"
  npc_override_alde_alche_2004_headgears_if_everyone_lutie_wearin_d0734e: "如果姜饼城的每个人都戴着毛茸茸的海獭帽，那看起来会超级超级可爱！"
  npc_override_alde_alche_2004_headgears_if_i_had_some_materials_f3e9dc: "如果我有一些材料，我想我可以组合出一些非常惊人的东西。"
  npc_override_alde_alche_2004_headgears_if_i_only_knew_more_d12580: "如果我只知道更多这个溜溜球的技巧。那我就能真正给女士们留下深刻印象了。"
  npc_override_alde_alche_2004_headgears_if_i_somehow_connected_s_d5aa6d: "如果我把斯莫基和我连接起来，当它隐形时我也会隐形吗？"
  npc_override_alde_alche_2004_headgears_if_sakkat_you_use_create_c0fd0f: "如果你用来制作这顶帽子的斗笠是升级过的，任何卡片、插槽或升级一旦我制作了新的帽子就会消失。"
  npc_override_alde_alche_2004_headgears_if_santa_hat_you_use_6fcecf: "如果你用来制作这顶帽子的圣诞帽是升级过的或镶嵌了卡片，所有这些升级都会丢失。所以，为了安全起见，我建议你把背包里除了制作派对帽所需物品之外的所有东西都放进卡普拉仓库。"
  npc_override_alde_alche_2004_headgears_if_straw_hat_you_use_e0bd41: "如果你用来制作这顶帽子的草帽是升级过的，这顶帽子里的任何卡片或升级一旦我制作了宽边帽就会丢失。"
  npc_override_alde_alche_2004_headgears_if_western_grace_you_use_0f1703: "如果你用来制作这顶帽子的西部优雅是升级过的，任何卡片或升级一旦我用它制作了新的帽子就会丢失。"
  npc_override_alde_alche_2004_headgears_if_you_bring_me_any_666061: "^FF0000如果你给我带来任何升级过的物品，或镶嵌了卡片的物品，那些卡片和升级一旦我为你制作了新的物品就会丢失。所以请不要忘记！^000000"
  npc_override_alde_alche_2004_headgears_if_you_d_like_me_34bf7a: "如果你想让我再做一个，请再来。感谢参观怪物博物馆。"
  npc_override_alde_alche_2004_headgears_if_you_d_like_me_5c2e47: "如果你想让我再做一个，请再来。感谢参观怪物博物馆。"
  npc_override_alde_alche_2004_headgears_if_you_give_me_any_e87cea: "如果你给我任何镶嵌了卡片或升级过的装备，^ff0000那些物品中的升级能力和卡片在我用它们制作东西后都会丢失。^000000所以，请记住这一点。"
  npc_override_alde_alche_2004_headgears_if_you_give_me_model_c92520: "如果你给我^0000FF1顶'模特训练帽'^000000和^0000FF1支'箭'^000000，我给你^8C17171个'射手苹果'^000000和^8C17171本'书'^000000。那么，你想拆解这些物品吗？"
  npc_override_alde_alche_2004_headgears_if_you_give_me_some_1ca181: "如果你给我一些东西，我可以翻新你的一些旧帽子，让它们真正展示你的个性。无论你是悠闲型还是派对动物，我都能为你做一顶帽子！"
  npc_override_alde_alche_2004_headgears_if_you_help_me_out_4173d6: "如果你帮我，我保证给你，嗯……"
  npc_override_alde_alche_2004_headgears_if_you_use_upgraded_stel_94a620: "^CE3100如果你用升级过的星辰来制作这个物品，任何升级都会丢失。你确定吗？^000000"
  npc_override_alde_alche_2004_headgears_if_you_ve_spent_enough_d78dbb: "如果你在梦罗克沙漠待了足够长的时间，我相信你也会欣赏一顶高质量帽子来抵御炎热的价值。"
  npc_override_alde_alche_2004_headgears_if_you_want_7673bb: "如果你想"
  npc_override_alde_alche_2004_headgears_if_you_want_956a41: "如果你想"
  npc_override_alde_alche_2004_headgears_if_you_want_fight_go_fd00eb: "如果你想战斗，出去！"
  npc_override_alde_alche_2004_headgears_if_you_want_i_make_93b19d: "如果你愿意，我也可以给你做一个，只收一点小费。"
  npc_override_alde_alche_2004_headgears_if_you_want_make_6a8a88: "如果你想做一个"
  npc_override_alde_alche_2004_headgears_if_you_want_see_me_a2bd8f: "如果你想看我再做一次，就带更多猩红染料和微笑先生来，好吗？拜拜~！"
  npc_override_alde_alche_2004_headgears_if_you_want_some_kinda_8a62aa: "如果你想要某种发夹，就回来。我就在这里，拿着这个溜溜球看起来很^FF3333帅^000000。"
