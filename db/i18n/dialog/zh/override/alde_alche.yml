  npc_override_alde_alche_2004_headgears_okay_give_me_some_time_a98e87: "好的，给我一些时间。"
  npc_override_alde_alche_2004_headgears_okay_here_s_deal_6c4ad0: "好的，这是交易。"
  npc_override_alde_alche_2004_headgears_okay_hold_bit_848378: "好的，等一下。"
  npc_override_alde_alche_2004_headgears_okay_i_am_ready_2cfcd7: "好的，我准备好了……"
  npc_override_alde_alche_2004_headgears_okay_i_tell_you_little_78666a: "好的……我再告诉你一点。"
