  npc_override_alde_alche_2004_headgears_if_you_wish_challenge_me_110ec5: "如果你想挑战我，在西边的森林里等我。我现在没心情和人类打交道。"
  npc_override_alde_alche_2004_headgears_if_you_wish_you_may_c74edc: "如果你愿意，你可以在这里休息。{0}场对兽人战士的胜利已被我们部落认可。"
