  npc_override_alde_alche_2004_headgears_lindsay_put_raccoon_hat_10a456: "^FF0000林赛把浣熊帽放在地上，把斯莫基树叶扔到帽子上，一边抱着自己一边嘟囔着一些话。^000000"
  npc_override_alde_alche_2004_headgears_listen_longer_4db9d6: "听更久，"
