  npc_override_alde_alche_2004_headgears_my_specialty_teddybear_h_2b73ca: "我的专长是''泰迪熊帽子''。戴上它，你会像泰迪熊一样可爱，你的拥抱会温暖两倍、cuddly 两倍。"
  npc_override_alde_alche_2004_headgears_my_wife_killed_as_victim_b6e22d: "我的妻子作为人类贪婪的受害者被杀了，可能被剥去了她那华丽的皮毛……"
