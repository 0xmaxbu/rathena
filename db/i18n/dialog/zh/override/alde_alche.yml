  npc_override_alde_alche_2004_headgears_sigh_i_suppose_s_time_c2921d: "*叹息* 我想是时候进行我们的谈话了。"
  npc_override_alde_alche_2004_headgears_sigh_let_me_count_cbc1ce: "*叹息* 让我数一下……"
  npc_override_alde_alche_2004_headgears_silk_ribbon_94dd88: "1个^FF0000丝绸蝴蝶结^000000！"
  npc_override_alde_alche_2004_headgears_simply_bring_required_ma_cf67d1: "只要带来所需的材料，并支付一小笔费用，我们就会为你提供你选择的怪物饰品。"
  npc_override_alde_alche_2004_headgears_since_our_director_gone_210ad7: "但由于我们的馆长不见了，我们不能用预算给你一顶帽子。如果你愿意，请给我带来以下物品……"
  npc_override_alde_alche_2004_headgears_since_you_re_exceptional_7089ff: "但是，既然你是个例外，你有可能完成……"
  npc_override_alde_alche_2004_headgears_since_you_re_such_cutie_ce54c7: "既然你这么可爱，我给你做一个漂亮的小发夹。你所要做的就是给我带来制作它的材料。"
  npc_override_alde_alche_2004_headgears_since_you_victor_those_b_99c600: "既然你是那些战斗的胜利者，你有权保留它们。但你也可以把它们还给兽人英雄，这意味着你希望再次在战斗中与他们相遇。"
  npc_override_alde_alche_2004_headgears_slick_paper_9c410d: "100个^3355FF光滑纸^000000。"
  npc_override_alde_alche_2004_headgears_slotted_circlet_e4599b: "1个^ff0000带孔圆环^000000，"
  npc_override_alde_alche_2004_headgears_slotted_ribbon_19108d: "1个^FF0000带孔蝴蝶结^000000和"
  npc_override_alde_alche_2004_headgears_small_token_my_gratitue_fd0635: "这是我感激的小信物。这把斧头曾经在许多战斗中帮助过我，对我来说非常珍贵。我希望你会好好保管它。"
  npc_override_alde_alche_2004_headgears_smokie_leaf_200f7f: "一片''斯莫基树叶''？"
  npc_override_alde_alche_2004_headgears_sniff_sniff_d54f99: "*嗅嗅*"
  npc_override_alde_alche_2004_headgears_snip_snip_2d0d8a: "*剪……剪……*"
  npc_override_alde_alche_2004_headgears_snip_snip_snip_9e2921: "*剪剪剪~~*"
  npc_override_alde_alche_2004_headgears_so_c7572d: "所以……"
  npc_override_alde_alche_2004_headgears_so_course_i_need_practic_8dcb1e: "所以我当然需要一个练习用的斯莫基戴在头上，然后才能准备好用真正的。"
  npc_override_alde_alche_2004_headgears_so_don_t_expect_me_6b17bb: "所以别指望我和你说话。"
  npc_override_alde_alche_2004_headgears_so_get_out_my_house_44bff8: "所以滚出我的房子！"
  npc_override_alde_alche_2004_headgears_so_go_ahead_tell_me_7a463c: "所以继续告诉我你对哪种发夹感兴趣。"
  npc_override_alde_alche_2004_headgears_so_go_outside_fight_3749ae: "所以，出去战斗吧。"
  npc_override_alde_alche_2004_headgears_so_i_am_trying_research_747cdf: "所以我正在研究一种复制鲁伊门托的方法，只不过是以适合人体的更小形式。如果我成功了，那将是医学奇迹！"
  npc_override_alde_alche_2004_headgears_so_i_got_cutesy_present_b2a42f: "所以，我已经搞定了可爱的小礼物。你知道，与其花钱买真正的礼物，我做这些小发夹。"
  npc_override_alde_alche_2004_headgears_so_i_learned_issue_funti_8a5ddc: "所以我从朱诺图书馆的《趣味儿童科学》中学到，不同的颜色吸收或反射阳光。"
  npc_override_alde_alche_2004_headgears_so_i_let_you_experience_c9b3ad: "这样我就能让你亲身体验我惊人的魔法~！"
  npc_override_alde_alche_2004_headgears_so_i_reading_some_issues_448ce8: "所以我正在朱诺图书馆读一些《趣味儿童科学》，读到关于动物在感觉非常热时在阳光下打盹的内容。"
  npc_override_alde_alche_2004_headgears_so_i_thinking_ccd63c: "所以我在想……"
  npc_override_alde_alche_2004_headgears_so_i_want_you_bring_926de3: "所以，我想让你带来……"
  npc_override_alde_alche_2004_headgears_so_many_items_you_ad9bee: "带这么多物品？"
  npc_override_alde_alche_2004_headgears_so_now_i_m_experimenting_2c385b: "所以现在我正在试验隐形。我试过用人类大小的斯莫基树叶来隐形，但还没真正成功。所以我想到了……"
  npc_override_alde_alche_2004_headgears_so_then_i_thought_cdc4de: " 所以然后我想到了……"
  npc_override_alde_alche_2004_headgears_so_what_i_need_make_ab3a37: "所以这是我做宽边帽需要的……"
  npc_override_alde_alche_2004_headgears_so_what_you_think_4c4cbe: "那你觉得怎么样？"
  npc_override_alde_alche_2004_headgears_so_when_you_decide_give_720ffc: "所以当你决定用乡村风格来提升你的生活时，带着那些物品回来找我，我给你做一顶牛仔帽。"
  npc_override_alde_alche_2004_headgears_so_you_like_create_model_abafc5: "那你想现在创建模特训练帽吗？"
  npc_override_alde_alche_2004_headgears_so_you_think_you_get_29a4c0: "那么，你觉得你能拿到所有的东西吗？我会在这里等你。"
  npc_override_alde_alche_2004_headgears_soft_blade_grass_a78666: "108个^3355FF软刃草^000000和"
  npc_override_alde_alche_2004_headgears_sombrero_you_ll_look_lik_2f7684: "戴上这顶宽边帽，你会看起来很有风格。再见，酷家伙~"
  npc_override_alde_alche_2004_headgears_some_may_think_grotesque_f0048a: "有些人可能觉得它怪诞，但你不同意头上长出一朵蘑菇会开启一场艺术革命吗？"
  npc_override_alde_alche_2004_headgears_some_more_go_d32b40: "更多，去"
  npc_override_alde_alche_2004_headgears_some_other_crap_f8323d: "一些其他的垃圾和"
  npc_override_alde_alche_2004_headgears_something_useful_aac46e: "有用的东西！"
  npc_override_alde_alche_2004_headgears_sometimes_even_i_t_belie_8db61f: "有时候，连我自己都不敢相信我的身体有多少性感的肌肉在起伏~！我几乎装不下它们……"
  npc_override_alde_alche_2004_headgears_sometimes_few_orcs_born_602519: "有时候，我们中间会出生一些拥有非凡力量和天赋的兽人。有传言说他们一次可以对抗10,000个战士……"
  npc_override_alde_alche_2004_headgears_soon_as_you_b6c6c6: "尽快~！"
  npc_override_alde_alche_2004_headgears_sort_thing_simple_me_60b0a0: "那种事情对我来说很简单！"
  npc_override_alde_alche_2004_headgears_sounds_great_00158c: "听起来很棒！"
  npc_override_alde_alche_2004_headgears_special_helmet_only_worn_547481: "只有兽人英雄才能佩戴的特殊头盔代表着兽人战士的力量和荣誉。"
  npc_override_alde_alche_2004_headgears_spent_all_my_energy_ade27c: "耗尽了所有能量。"
  npc_override_alde_alche_2004_headgears_spool_b64db9: "^0000FF100个线轴^000000和"
  npc_override_alde_alche_2004_headgears_sprinkle_sprinkle_bf5871: "^3355FF*撒撒*"
  npc_override_alde_alche_2004_headgears_squick_squick_grind_grin_ee8ee0: "^3355FF*吱吱 吱吱 磨磨*^000000"
  npc_override_alde_alche_2004_headgears_squish_squish_bang_bang_ecd931: "*挤压挤压 砰砰砰 嗒嗒 刮刮*"
  npc_override_alde_alche_2004_headgears_squish_squish_fwsht_fwsh_07b94d: "^3355FF*挤压挤压 呼哧呼哧*^000000"
  npc_override_alde_alche_2004_headgears_steel_198edb: "^FF000010个钢铁^000000"
  npc_override_alde_alche_2004_headgears_sticky_mucus_e93c39: "^ff0000100个粘稠液体^000000。"
  npc_override_alde_alche_2004_headgears_still_doesn_t_explain_an_7277ac: "那仍然解释不了什么！"
  npc_override_alde_alche_2004_headgears_still_fd8d00: "不过……"
  npc_override_alde_alche_2004_headgears_still_mood_talk_6a0675: "还有心情说话？！"
  npc_override_alde_alche_2004_headgears_stinky_scale_446c9c: "300个恶臭鳞片，"
  npc_override_alde_alche_2004_headgears_stop_bugging_me_6016fb: "别烦我"
  npc_override_alde_alche_2004_headgears_strangest_human_8f79c1: "最奇怪的人类"
  npc_override_alde_alche_2004_headgears_straw_hat_da194d: "1个^3355FF草帽^000000，"
  npc_override_alde_alche_2004_headgears_straw_hat_made_out_sakka_14e8d5: "一顶草帽！用斗笠、竹子和坚韧的藤蔓制成，戴上它你会有一种放松、乡村的感觉。"
  npc_override_alde_alche_2004_headgears_straw_hat_shades_you_hea_35fbc1: "一顶草帽！它为你遮挡炎热的阳光，让农民在田里工作时保持凉爽。它是为酷、放松类型的人准备的帽子，也是一些著名英雄的首选帽子！"
  npc_override_alde_alche_2004_headgears_striped_hairband_d46168: "1个^FF0000条纹发带^000000，"
  npc_override_alde_alche_2004_headgears_struggling_you_0db27d: "挣扎，是吗？"
  npc_override_alde_alche_2004_headgears_stuff_great_faking_injur_1d1a63: "那东西很适合假装受伤，或者遮住秃顶。想逃学的时候很方便。"
  npc_override_alde_alche_2004_headgears_such_beautiful_hair_i_m_400406: "多么美丽的头发！抱歉，我只是喜欢漂亮的发型和饰品！"
  npc_override_alde_alche_2004_headgears_sushi_0898c4: "50个寿司，"
  npc_override_alde_alche_2004_headgears_swish_swish_7dafe0: "*嗖嗖……*"
  npc_override_alde_alche_2004_headgears_swish_swish_rustle_rustl_4cc3bd: "^3355FF*嗖嗖 沙沙*^000000"
  npc_override_alde_alche_2004_headgears_sword_only_given_our_her_7beccf: "这是只授予我们英雄的剑。我不确定你是否能使用它，但作为兽人英雄，你有义务随时携带它。"
  npc_override_alde_alche_2004_headgears_sword_tear_sky_sever_ear_cfd68f: "那把剑可以撕裂天空，劈开大地，让瀑布倒流。"
  npc_override_alde_alche_2004_headgears_tah_dah_8c1c8e: "嗒哒~！"
  npc_override_alde_alche_2004_headgears_tah_dah_a41181: "嗒哒！"
  npc_override_alde_alche_2004_headgears_take_72f14a: "拿着这个……"
  npc_override_alde_alche_2004_headgears_take_ebbb81: "拿着这个"
  npc_override_alde_alche_2004_headgears_take_items_you_brought_v_ae138f: "拿着这个！你带来的物品对继续我在米德加尔特传播头带的工作非常有用。"
  npc_override_alde_alche_2004_headgears_take_much_time_make_hat_9e91c5: "制作这顶帽子不会花太多时间，所以请稍等片刻。"
  npc_override_alde_alche_2004_headgears_takes_mad_skill_3f833b: "这需要疯狂的技巧。"
  npc_override_alde_alche_2004_headgears_talk_humans_931529: "和人类说话？！"
  npc_override_alde_alche_2004_headgears_talk_me_again_after_you_8e53b8: "在你把一些物品放进卡普拉仓库腾出背包空间后再和我说话。"
  npc_override_alde_alche_2004_headgears_talking_about_our_7198c0: "谈论我们的"
  npc_override_alde_alche_2004_headgears_tap_tap_aea95e: "*嗒嗒……*"
  npc_override_alde_alche_2004_headgears_tear_off_f06a1f: "把这个撕掉……"
  npc_override_alde_alche_2004_headgears_teddybear_hat_t_worn_jus_d60a40: "''泰迪熊帽子''不是谁都能戴的，因为它的拥抱力量很容易被滥用。"
  npc_override_alde_alche_2004_headgears_tell_me_when_you_re_78f461: "准备好的时候告诉我！"
  npc_override_alde_alche_2004_headgears_tell_me_when_you_re_d13469: "准备好的时候告诉我，好吗？"
  npc_override_alde_alche_2004_headgears_tell_you_what_i_ve_7e7870: "告诉你吧。我学了很多关于动物的知识，所以如果你给我合适的材料，我会给你做一顶^3355FF真正伟大的帽子^000000。"
  npc_override_alde_alche_2004_headgears_thank_you_174534: "谢谢。"
  npc_override_alde_alche_2004_headgears_thank_you_744018: "谢谢"
  npc_override_alde_alche_2004_headgears_thank_you_945f29: "谢谢~"
  npc_override_alde_alche_2004_headgears_thank_you_using_my_servi_68faed: "感谢使用我的服务~！"
  npc_override_alde_alche_2004_headgears_that_e4eb67: "那……"
  npc_override_alde_alche_2004_headgears_then_i_fashion_model_tra_1ddb29: "那我可以马上给你做一顶''模特训练帽''。"
  npc_override_alde_alche_2004_headgears_then_i_m_sure_you_32b3e8: "那么，我相信你可以被授予真正的兽人战士地位。但是，确保你是为了光荣的目的而战，你没有其他动机。"
  npc_override_alde_alche_2004_headgears_then_i_make_you_tiiiiny_0b91f3: "那我可以给你做一朵小小的花。"
  npc_override_alde_alche_2004_headgears_then_suddenly_dazzling_l_6efb26: "^FF0000然后，突然一道耀眼的光芒，浣熊帽变成了蓝色，慢慢变成了海獭帽。^000000"
  npc_override_alde_alche_2004_headgears_then_you_may_leave_now_f2dff4: "那么，你现在可以离开了……"
  npc_override_alde_alche_2004_headgears_there_901a05: "……好了。"
  npc_override_alde_alche_2004_headgears_there_battles_ahead_you_7f2ade: "在你达到目标之前还有{0}场战斗。我理解这个挑战的难度，但我希望你能成功。"
  npc_override_alde_alche_2004_headgears_there_old_saying_everyth_2e7f9a: "有句老话，''等待的人什么都会得到。''哦，你冷吗？为什么不搓搓手呢？"
  npc_override_alde_alche_2004_headgears_there_s_no_doubt_you_079fb0: "毫无疑问，戴上这些时尚的东西你会成为城里的话题。"
  npc_override_alde_alche_2004_headgears_there_too_many_wicked_hu_dcd27c: "有太多邪恶的人类为了追求财富和名声不择手段。他们不理解荣誉和忠诚这样的理想，为了得到他们想要的，他们会使用任何手段。"
  npc_override_alde_alche_2004_headgears_there_you_go_19b809: "给你。"
  npc_override_alde_alche_2004_headgears_there_you_go_buddy_82837c: "给你，伙计。"
  npc_override_alde_alche_2004_headgears_there_you_go_buddy_i_f4968a: "给你，伙计。我很自豪地说这是我的杰作。我称它为……''恶魔之翼耳朵！''"
  npc_override_alde_alche_2004_headgears_there_you_go_here_s_e095c4: "给你。这是你的美丽金色铃铛。我怀疑你摇头时它会不会响，不过。"
  npc_override_alde_alche_2004_headgears_there_you_go_i_marked_bb3e44: "给你。我在上面做了一个小标记。所以从今以后戴上这个头盔。你明白吗？我的人类兽人英雄。"
  npc_override_alde_alche_2004_headgears_there_you_go_phew_ed727b: "给你。*呼~*"
  npc_override_alde_alche_2004_headgears_there_you_go_your_very_8c209b: "给你！你专属的针织帽！可爱，但仍然''酷！''"
  npc_override_alde_alche_2004_headgears_these_526678: "用这些……"
  npc_override_alde_alche_2004_headgears_these_orchish_vouchers_y_49f985: "你一直在收集的这些兽人凭证是兽人战士的真正信物。我们认可赢得超过1,000场战斗的兽人为真正的兽人战士。"
  npc_override_alde_alche_2004_headgears_they_best_warriors_orc_t_3e143e: "他们是兽人部落中最优秀的战士，被你们称为兽人英雄。他们不仅是我们中最强的，也是我们在战斗中的领袖。"
  npc_override_alde_alche_2004_headgears_they_could_endure_battle_6280b3: "他们可以在没有斧头的情况下在战斗中坚持至少几天。当你达到一定的战斗技能水平时，武器实际上会成为负担……"
  npc_override_alde_alche_2004_headgears_think_all_sex_appeal_you_fd9c87: "但想想你错过的所有性感魅力。来吧，你知道你需要一顶宽边帽。"
  npc_override_alde_alche_2004_headgears_those_don_t_sound_like_bf97e5: "那些听起来不像做帽子的声音……^000000"
  npc_override_alde_alche_2004_headgears_those_hateful_humans_sta_7ec20e: "那些可恨的人类开始清除他们和他们想要的东西之间的每一个障碍，不管是朋友还是敌人都无所谓。"
  npc_override_alde_alche_2004_headgears_those_i_able_continue_my_39ba0b: "有了那些，我就能继续我的研究，至少一段时间。正如我告诉你的，我会用这些物品给你这个超棒的^0000FF闹钟面具^000000！"
  npc_override_alde_alche_2004_headgears_those_old_warriors_shown_264458: "那些老战士展示了出色的战斗能力，即使没有使用武器。"
  npc_override_alde_alche_2004_headgears_those_orcs_come_back_ali_17b7cd: "那些活着回来的兽人被认可为部落的真正成员。最强壮的雄性被选为兽人战士，最强壮的雌性被选为兽人女士。"
  npc_override_alde_alche_2004_headgears_though_i_must_admit_you_942128: "不过，我必须承认你有勇气进入一个兽人的家。"
  npc_override_alde_alche_2004_headgears_thousand_72ecb5: "……一千。"
  npc_override_alde_alche_2004_headgears_three_f317d4: "三……"
  npc_override_alde_alche_2004_headgears_today_a1df98: "今天？"
  npc_override_alde_alche_2004_headgears_today_school_i_learned_h_ce919f: "今天在学校，我学会了如何做纸花！花有点难，但现在我会了！然后我做了一朵小小的花，把它戴在头上~"
  npc_override_alde_alche_2004_headgears_too_many_items_you_fc968e: "- 你带的物品太多了。-"
  npc_override_alde_alche_2004_headgears_top_human_head_858642: "在人类头顶上……"
  npc_override_alde_alche_2004_headgears_tough_dcd510: "厉害！"
  npc_override_alde_alche_2004_headgears_tough_vines_a11d09: "300个^3355FF坚韧藤蔓^000000和"
  npc_override_alde_alche_2004_headgears_trying_figure_out_animal_b48b35: "试图找出动物王国应对炎热的秘密。"
  npc_override_alde_alche_2004_headgears_uh_oh_d55db3: "哦哦……"
  npc_override_alde_alche_2004_headgears_uh_uh_2b40d9: "哦！哦！"
  npc_override_alde_alche_2004_headgears_uk_uk_uk_uk_uhoh_b0ffde: "^3355FF*呜呜 呜呜 呜呜 呜呜 哦哦 哦哦*^000000"
  npc_override_alde_alche_2004_headgears_um_i_know_how_about_3547a5: "嗯，我知道！不如我给你做一顶可爱、温暖、毛茸茸的海獭帽？"
  npc_override_alde_alche_2004_headgears_umm_7aaf3b: "嗯……？"
  npc_override_alde_alche_2004_headgears_umm_okay_a2a9c2: "嗯，好的……"
  npc_override_alde_alche_2004_headgears_understanding_orc_16a6a2: "理解兽人"
  npc_override_alde_alche_2004_headgears_unfortunately_i_don_t_an_e7188c: "不幸的是，我现在没有任何材料来制作头饰。但如果你带来材料，我会免费给你做一顶''泰迪熊帽子''。"
  npc_override_alde_alche_2004_headgears_unleash_your_fighting_sp_372f7c: "向世界上的恶棍释放你的战斗精神！"
  npc_override_alde_alche_2004_headgears_up_scram_6a6035: "起来然后滚！！"
  npc_override_alde_alche_2004_headgears_us_orcs_victory_battle_g_abd7bb: "对我们兽人来说，战斗中的胜利是最大的荣誉。"
  npc_override_alde_alche_2004_headgears_usually_we_zeny_service_4f48c6: "通常我们有Zeny服务费，但既然你有^3355FF那种气质^000000，我就免了。"
  npc_override_alde_alche_2004_headgears_very_least_we_could_trai_413ef2: "至少，我们可以训练你改善你的姿势，这样你就可以带着帝王般的优雅行走。"
  npc_override_alde_alche_2004_headgears_victory_me_5a087c: "和我一起胜利？"
  npc_override_alde_alche_2004_headgears_vouchers_1f68b0: "用凭证？"
  npc_override_alde_alche_2004_headgears_waaaaaaah_d424eb: "哇啊啊啊啊~！"
  npc_override_alde_alche_2004_headgears_wah_665f96: "哇~~~~~！"
  npc_override_alde_alche_2004_headgears_wait_f241ee: "等等……"
  npc_override_alde_alche_2004_headgears_wait_minute_17efa5: "- 等一下！！ -"
  npc_override_alde_alche_2004_headgears_wait_minute_d3d0a0: "- 等一下！ -"
  npc_override_alde_alche_2004_headgears_wait_moment_1a7242: "- 等一下！ -"
  npc_override_alde_alche_2004_headgears_wait_second_2c0252: "等一下……"
  npc_override_alde_alche_2004_headgears_want_talk_me_102409: "想和我说话。"
  npc_override_alde_alche_2004_headgears_warrior_a8d66a: "战士……"
  npc_override_alde_alche_2004_headgears_warrior_may_fresh_light_ab585f: "战士，愿清新的光明与你同在战斗中。向你的对手展示你不屈的精神。为被授予兽人战士称号的人类感到自豪！"
  npc_override_alde_alche_2004_headgears_warrior_might_79dc5e: "力量战士！"
  npc_override_alde_alche_2004_headgears_warrior_where_did_you_le_001cfc: "战士，你把剑放哪了？没有剑，我无法认可你为兽人英雄。请找到它，无论去哪里都随身携带。"
  npc_override_alde_alche_2004_headgears_warrior_where_did_you_le_d5e9cc: "战士，你把英雄徽章放哪了？没有信物，我无法认可你为兽人英雄。请找到它，无论去哪里都随身携带。"
  npc_override_alde_alche_2004_headgears_warriors_b08ffd: "战士……"
  npc_override_alde_alche_2004_headgears_wasn_t_too_difficult_i_f423c0: "那不太难。我希望你每天都戴着这顶帽子来改善你的姿势。"
  npc_override_alde_alche_2004_headgears_wataaaaa_7b1d84: "*哇啊啊啊~！*"
  npc_override_alde_alche_2004_headgears_way_if_you_use_upgraded_6f5427: "^FF0000顺便说一下，如果你用升级过的"
  npc_override_alde_alche_2004_headgears_way_life_through_battle_047066: "通过战斗的生活方式。"
  npc_override_alde_alche_2004_headgears_we_call_these_cursed_orc_1860a9: "我们称这些被诅咒的兽人为真诺克。他们被迫住在洞穴或地牢里，远离光荣的兽人。很难相信真诺克曾经是我们中的一员……"
  npc_override_alde_alche_2004_headgears_we_could_play_games_snow_3450f5: "我们可以在雪地里玩游戏，和真正的海獭一起玩，让它们载我们……"
  npc_override_alde_alche_2004_headgears_we_fight_boldly_fearless_e522d4: "我们大胆而无畏地与对手战斗，全力以赴，希望获得公平的胜利。我们会为战斗中的胜利而死。"
  npc_override_alde_alche_2004_headgears_we_only_select_strongest_bbdef5: "我们只从部落中挑选最强壮的成为战士。当兽人成年后，他们会被送到森林中独自生存。"
  npc_override_alde_alche_2004_headgears_we_orcs_invented_many_us_f75802: "我们兽人发明了很多有用的东西！当然，现在我们不得不把这些东西留给自己。为什么？因为人类的愚蠢和贪婪！！"
  npc_override_alde_alche_2004_headgears_we_orcs_once_constructed_76528d: "我们兽人曾经为人类建造了一座塔，但后来被困在那里并被奴役。不用说，人类值得我们的愤怒和狂暴。"
  npc_override_alde_alche_2004_headgears_we_orcs_proud_race_i_5277ee: "我们兽人是一个骄傲的种族，我会遵守。"
  npc_override_alde_alche_2004_headgears_we_orcs_proud_race_like_279d01: "我们兽人是一个骄傲的种族，不喜欢承认我们错了。"
  npc_override_alde_alche_2004_headgears_we_orcs_special_training_ceee95: "我们兽人有一个特殊的训练课程，叫做''火焰试炼''。如果任何兽人战士通过了这个课程，他将被我们的火神保护……"
  npc_override_alde_alche_2004_headgears_wearing_cowboy_hat_make_fbcde1: "戴上牛仔帽会让男士看起来更坚韧、更英勇，会给女士增添未驯服的可爱。"
  npc_override_alde_alche_2004_headgears_wearing_one_color_makes_0d4c4e: "穿一种颜色会让你感觉更暖和，另一种会让你在热天感觉更凉爽。"
  npc_override_alde_alche_2004_headgears_welcome_handsome_charm_m_efcc12: "欢迎来到英俊魅力模特学校。有什么可以帮你的吗？"
  npc_override_alde_alche_2004_headgears_well_074932: "不过……"
  npc_override_alde_alche_2004_headgears_well_good_day_261596: "好吧，祝你有美好的一天。"
  npc_override_alde_alche_2004_headgears_well_humans_rarely_get_c_63ceed: "好吧，人类很少有机会看到这顶头盔，除非他们自己也在和兽人英雄战斗……"
  npc_override_alde_alche_2004_headgears_well_i_made_these_myself_b78ee3: "好吧，这些是我自己做的。"
  npc_override_alde_alche_2004_headgears_well_i_see_66067e: "好吧，我明白了。"
  npc_override_alde_alche_2004_headgears_well_if_you_want_one_ab2172: "好吧，如果你想要一个，我就做。但我想你应该为我的服务支付一些版税。把花固定在发夹上很难的，你知道？"
  npc_override_alde_alche_2004_headgears_well_orc_hero_held_high_2e11fc: "好吧，兽人英雄在其他兽人中地位很高，因为他们的强大力量。作为一个人类，你可能很难对付他。"
  npc_override_alde_alche_2004_headgears_well_s_supposed_seeeecre_94b8e5: "好吧，这应该是个秘密，但我妈妈教了我一些魔法，用浣熊帽做海獭帽。"
  npc_override_alde_alche_2004_headgears_well_then_farewell_a94edc: "那好吧……再见！"
  npc_override_alde_alche_2004_headgears_well_we_orcs_proud_race_5cc4f8: "好吧！我们兽人是一个骄傲的种族！"
  npc_override_alde_alche_2004_headgears_western_grace_fbc7ec: "1个^3355FF西部优雅^000000，"
  npc_override_alde_alche_2004_headgears_whaddup_broham_hat_keeps_5e0fc1: "怎么了，兄弟。这顶帽子让你的头保持温暖，但让你和你的伙伴们保持酷。还有，嗯，飞女郎。"
  npc_override_alde_alche_2004_headgears_what_336de9: "什么？！"
  npc_override_alde_alche_2004_headgears_what_brings_you_lutie_to_1d6441: "是什么把你带到姜饼城，这个充满善意和全年圣诞欢乐的小镇？"
  npc_override_alde_alche_2004_headgears_what_don_t_you_know_26e3c6: "什么……！你不知道什么时候该停下来吗？我不相信一个人类会想听这么多关于兽人的事。但是……"
  npc_override_alde_alche_2004_headgears_what_great_attitude_warr_9be4c2: "多么伟大的战士态度……！这将成为其他兽人的榜样，向被你击败的对手表示尊重！"
  npc_override_alde_alche_2004_headgears_what_happens_if_you_re_4bba0f: "如果你什么颜色都不穿会发生什么？如果我的^333333*嗯哼*^000000假设是正确的，如果你隐形了，你就不会感觉到任何热量！"
  npc_override_alde_alche_2004_headgears_what_if_i_had_no_f5d2ba: "如果我什么颜色都没有呢？"
  npc_override_alde_alche_2004_headgears_what_s_5b8716: "那是什么"
  npc_override_alde_alche_2004_headgears_what_s_efcba8: "这是什么？！"
  npc_override_alde_alche_2004_headgears_what_you_doing_so_much_4e1010: "你拿这么多杰勒比做什么？！"
  npc_override_alde_alche_2004_headgears_when_i_realized_i_decide_32ba95: "当我意识到这一点时，我决定帮助这些人，并开始研究人造肢体的技术。我的研究把我带到了闹钟和它们自己的机械肢体，被称为''鲁伊门托''。"
  npc_override_alde_alche_2004_headgears_when_you_decide_represen_a7a193: "当你决定代表你的街区时，带着东西来找我。我会帮你搞定。"
  npc_override_alde_alche_2004_headgears_when_you_re_ready_6d9a32: "当你准备好的时候。"
  npc_override_alde_alche_2004_headgears_whether_you_plan_go_hous_806cff: "无论你是打算去参加家庭聚会、找回你的 groove，还是像王子一样清新，戴上这个酷炫的风格，你都会很 chill。"
  npc_override_alde_alche_2004_headgears_whew_a0bff9: "*呼~！*"
  npc_override_alde_alche_2004_headgears_whirling_tempest_0bc972: "旋转风暴"
  npc_override_alde_alche_2004_headgears_whoa_99ff0f: "哇~"
  npc_override_alde_alche_2004_headgears_whoa_lady_b32907: "哇~！一位女士……"
  npc_override_alde_alche_2004_headgears_whoa_why_you_carrying_so_e95a4f: "哇，你为什么带这么多物品？"
  npc_override_alde_alche_2004_headgears_why_don_t_i_make_221276: "为什么我不给你做……"
  npc_override_alde_alche_2004_headgears_why_don_t_i_make_7e5478: "为什么我不做……"
  npc_override_alde_alche_2004_headgears_why_don_t_you_go_3ac7ae: "为什么不去和蜂后拍张照呢？如果她不是太忙着想撕碎你，那会很有趣的。"
  npc_override_alde_alche_2004_headgears_why_you_carrying_so_many_adffd4: "你为什么带这么多物品？把你所有额外的行李放在别的地方，然后再回来。"
  npc_override_alde_alche_2004_headgears_will_have_a_34788d: "将会有一个"
  npc_override_alde_alche_2004_headgears_woman_t_you_i_m_bed936: "女士，你没看出来我是男的吗？"
  npc_override_alde_alche_2004_headgears_woohoo_44136e: "（呜呼~！）"
  npc_override_alde_alche_2004_headgears_worst_7bd270: "是最糟糕的"
  npc_override_alde_alche_2004_headgears_wouldn_t_some_kinda_flow_c9cd67: "某种……^3131FF花朵发夹^000000会不会很受女孩欢迎？所以我试着做了一个，它似乎在我的女性朋友中很受欢迎。"
  npc_override_alde_alche_2004_headgears_wow_213d95: "哇~"
  npc_override_alde_alche_2004_headgears_wow_did_you_really_gathe_5c09f8: "哇！你真的自己收集了这300个蘑菇孢子吗？不错！现在是用我的魔法的时候了~"
  npc_override_alde_alche_2004_headgears_wow_you_re_really_cute_bd0f39: "哇，你真的超级可爱！告诉你吧……"
  npc_override_alde_alche_2004_headgears_wow_you_re_so_stubborn_c755cd: "哇，你真固执！只要好好对待这顶头盔，带着尊重戴上它。认识到它有很长的历史……"
  npc_override_alde_alche_2004_headgears_x_hairpin_07d1e1: "X发夹！"
  npc_override_alde_alche_2004_headgears_yarn_76e160: "500个^3355FF纱线^000000。"
  npc_override_alde_alche_2004_headgears_yay_4cbc9f: "耶~"
  npc_override_alde_alche_2004_headgears_yay_you_ve_got_great_09c560: "耶！你有一顶看起来很棒的王冠！"
  npc_override_alde_alche_2004_headgears_yeah_872dd3: "是的……"
  npc_override_alde_alche_2004_headgears_yeah_dude_there_two_thin_76a6d8: "是的，伙计。有两样东西女孩喜欢。小而可爱的礼物。和风度翩翩的家伙。"
  npc_override_alde_alche_2004_headgears_yeah_i_ve_noticed_cuties_202934: "是的，我注意到可爱的人喜欢嘴里叼着花到处走，我总是''什么~？''但后来我有了一个好主意！"
  npc_override_alde_alche_2004_headgears_yeeeeehaw_hat_you_tame_b_a88d02: "耶~哈！戴上这顶帽子，你可以驯服野马，抢劫驿马车，在决斗中看起来很时尚！"
  npc_override_alde_alche_2004_headgears_yeh_you_think_i_d_c84a61: "是的，你会以为我会记得被一个丑陋的人类打败，但我忙着被打的时候 tends not to remember faces。"
  npc_override_alde_alche_2004_headgears_yelp_yelp_yelp_ecf989: "汪汪！汪汪汪汪！"
  npc_override_alde_alche_2004_headgears_yes_c53c56: "是。"
  npc_override_alde_alche_2004_headgears_yes_s_cd6409: "是的，那是"
  npc_override_alde_alche_2004_headgears_yes_s_good_e0b910: "是的，那很好"
  npc_override_alde_alche_2004_headgears_yoohoo_c2239d: "哟呼~"
  npc_override_alde_alche_2004_headgears_you_always_intrude_our_t_6046bf: "你总是闯入我们的领地来猎杀我们狐狸，为了我们漂亮、柔软的皮毛。但你们骚扰的不只是我们。苏希们总是抱怨你们野蛮的人类一直偷她们的衣服！"
  npc_override_alde_alche_2004_headgears_you_battle_1d7a5f: "你在战斗中。"
  npc_override_alde_alche_2004_headgears_you_bleed_my_house_i_7f02c1: "你可以在我的房子里流血，但我只会在……的情况下和你说话"
  npc_override_alde_alche_2004_headgears_you_bring_jellopy_cb55a1: "你带来^FF00001000个杰勒比^000000！"
  npc_override_alde_alche_2004_headgears_you_brought_every_materi_735b4b: "你把所有材料都带来了，但不幸的是你的背包没有足够的空间。试着先把一些物品放进卡普拉仓库。"
  npc_override_alde_alche_2004_headgears_you_brought_everything_d733d6: "你把所有东西都带来了。"
  npc_override_alde_alche_2004_headgears_you_brought_everything_e4db12: "你把所有东西都带来了！"
  npc_override_alde_alche_2004_headgears_you_brought_materials_86bd72: "你把材料带来了~"
  npc_override_alde_alche_2004_headgears_you_brought_me_jellopies_87aec6: "你给我带来了10,000个杰勒比。我必须说我印象深刻。既然你向我展示了你的尊重，我会用我的诚实回报你。"
  npc_override_alde_alche_2004_headgears_you_brought_them_219c23: "你把它们带来了！"
  npc_override_alde_alche_2004_headgears_you_cannot_beat_c1d984: "你无法击败"
  npc_override_alde_alche_2004_headgears_you_could_just_bring_a04db7: "你可以直接带来……"
  npc_override_alde_alche_2004_headgears_you_dare_invite_orc_conv_2e9e1b: "你竟敢邀请兽人对话？！我们兽人是一个野蛮的种族！诞生于苦难之中，我们只活着战斗和厮杀！"
  npc_override_alde_alche_2004_headgears_you_deserve_orc_hero_mos_c3b5d2: "你值得成为兽人英雄，最强大的兽人战士！从今天起，你现在就是兽人英雄！"
  npc_override_alde_alche_2004_headgears_you_don_t_seem_satisfied_7be692: "即使被认可为战士后，你似乎还不满足。但是……我想战士的道路就是寻求新的、更困难的挑战。"
  npc_override_alde_alche_2004_headgears_you_ever_notice_how_hot_c3df8e: "你有没有注意到，在热天，你穿白色会感觉凉爽很多，但穿黑色会暖和很多？"
  npc_override_alde_alche_2004_headgears_you_exactly_i_need_03acba: "你正是我需要的。"
  npc_override_alde_alche_2004_headgears_you_homage_dad5a6: "你致敬。"
  npc_override_alde_alche_2004_headgears_you_know_more_about_such_5a1c8c: "为圣诞老人工作了这么久，你对这种事情了解更多。"
  npc_override_alde_alche_2004_headgears_you_learn_lot_about_tell_c500a2: "为圣诞老人工作了这么久，你可以学到很多关于区分好人和淘气鬼的知识……"
  npc_override_alde_alche_2004_headgears_you_like_indian_headband_4fcc56: "你想要一顶印第安头带吗？你不会成为我部落的正式成员，但戴上它会显示你的尊重，如果你在冒险中遇到部落印第安人的话。"
  npc_override_alde_alche_2004_headgears_you_ll_wowing_everyone_s_ab7395: "你会用你时尚的新造型让街上的每个人都惊叹，它说''感觉这么坏感觉这么好。''很高兴为你服务~！"
  npc_override_alde_alche_2004_headgears_you_look_like_you_re_914612: "你看起来冻僵了……"
  npc_override_alde_alche_2004_headgears_you_look_like_you_re_dd4052: "你看起来拿东西很吃力。为什么不把一些额外的物品放进卡普拉仓库呢？"
  npc_override_alde_alche_2004_headgears_you_look_so_heavy_maybe_8d9e01: "你看起来好重……！如果你把一些东西收起来，也许走路会轻松一些？"
  npc_override_alde_alche_2004_headgears_you_look_so_pretty_ddee67: "但你会看起来超级^FF66CC漂亮~！^000000"
  npc_override_alde_alche_2004_headgears_you_made_lot_effort_show_2ae95c: "你做了很多努力来向我展示你的尊重。现在，如果你想了解更多关于兽人的事，随时回来，我的朋友。"
  npc_override_alde_alche_2004_headgears_you_made_lot_effort_show_39a2df: "尽管是个人类，你做了很多努力来向我展示尊重。现在，如果你想了解更多关于兽人的事，随时回来，我的朋友。"
  npc_override_alde_alche_2004_headgears_you_may_recognize_those_0b44ff: "你可以通过他们萎缩的身体和长牙来识别那些被诅咒的兽人。"
  npc_override_alde_alche_2004_headgears_you_may_trouble_first_ke_e328c6: "起初你可能会有困难，保持平衡，尽量不让苹果掉下来。你甚至可能会感到难以置信的颈部疼痛。但为了美，一切都是值得的。"
  npc_override_alde_alche_2004_headgears_you_mind_giving_item_bac_9f9b10: "你介意把这个物品还给它的主人吗，我的人类兽人英雄？"
  npc_override_alde_alche_2004_headgears_you_mind_sharing_them_me_cd734e: "你介意和我分享吗？"
  npc_override_alde_alche_2004_headgears_you_mr_smile_scarlet_dye_3ce4ce: "你有微笑先生和猩红染料！耶~！我可以用那些给你做一朵纸花。来吧，让我给你看看！"
  npc_override_alde_alche_2004_headgears_you_must_accept_your_83ac0a: "你必须接受你的"
  npc_override_alde_alche_2004_headgears_you_must_learned_much_ab_25b562: "你一定通过亲身体验学到了很多关于兽人战斗精神的知识。"
  npc_override_alde_alche_2004_headgears_you_must_really_like_tra_5819a3: "你一定真的很喜欢旅行！你肯定不是本地人。"
  npc_override_alde_alche_2004_headgears_you_now_99ced9: "你现在……"
  npc_override_alde_alche_2004_headgears_you_only_achieve_honor_w_df2752: "你只有通过赢得战斗才能获得荣誉。即使在兽人之中，我相信你也能通过击败10,000个兽人战士来证明你的战斗能力。"
  npc_override_alde_alche_2004_headgears_you_only_get_one_those_cb5266: "只有你在沙漠中旅行了很长时间才能得到那些。我猜像你这样的人也会欣赏我家乡的美。"
  npc_override_alde_alche_2004_headgears_you_put_some_items_into_bcca4c: "- 你把一些物品放进了卡普拉仓库。-"
  npc_override_alde_alche_2004_headgears_you_re_best_871a3e: "你是最棒的！"
  npc_override_alde_alche_2004_headgears_you_re_ca49d9: "你是"
  npc_override_alde_alche_2004_headgears_you_re_human_so_i_694cbe: "你是个人类，所以我不认为我们能轻易给你那个荣誉……"
  npc_override_alde_alche_2004_headgears_you_re_just_cutest_littl_4e4bb3: "但你只是最可爱的小东西。我知道戴上这个你会看起来超级漂~亮！"
  npc_override_alde_alche_2004_headgears_you_re_such_pretty_lady_bcb6eb: "你真是一位漂亮的女士！"
  npc_override_alde_alche_2004_headgears_you_re_too_tough_get_de0421: "你太顽强了，甩不掉。"
  npc_override_alde_alche_2004_headgears_you_really_want_listen_m_7fb1e7: "你真的这么想听我说话吗……？"
  npc_override_alde_alche_2004_headgears_you_shall_your_conversat_036e60: "你会有你的''对话''。"
  npc_override_alde_alche_2004_headgears_you_still_adbf43: "你还在"
  npc_override_alde_alche_2004_headgears_you_sure_you_want_create_dfe5c2: "你确定要创建蜂后之冠吗？"
  npc_override_alde_alche_2004_headgears_you_too_become_fighting_6b5499: "你也可以成为战斗传奇……"
  npc_override_alde_alche_2004_headgears_you_ve_already_brought_e_d0e75c: "你已经把我要求的所有东西都带来了！干得好，英雄~！让我马上开始工作……"
  npc_override_alde_alche_2004_headgears_you_ve_brought_all_these_ddba5e: "你把所有这些蝴蝶结都带来了！我等不及要给你系一条新蝴蝶结，戴在你^FF66CC美丽的头发上！^000000"
  npc_override_alde_alche_2004_headgears_you_ve_come_back_1f0a2c: "你回来了……"
  npc_override_alde_alche_2004_headgears_you_wanna_flower_hairpin_aa8e06: "你想要一个^3131FF花朵发夹^000000！"
  npc_override_alde_alche_2004_headgears_you_wanna_flower_hairpin_c40999: "你想要一个花朵发夹~？"
  npc_override_alde_alche_2004_headgears_you_wanna_take_look_tren_329459: "你想看看我能给你做的时髦、时尚帽子吗？"
  npc_override_alde_alche_2004_headgears_you_want_af4b50: "你想做"
  npc_override_alde_alche_2004_headgears_you_want_know_where_i_06a2e1: "你想知道我头上的这些可爱的小小黑猫耳朵是从哪里来的，不是吗？我就知道！哈哈哈~！"
  npc_override_alde_alche_2004_headgears_you_want_me_show_you_8bc26a: "你想让我给你看看吗？嗯？"
  npc_override_alde_alche_2004_headgears_you_want_some_sort_rewar_3ca623: "你想要某种奖励，无论你造成了什么混乱。那好吧……"
  npc_override_alde_alche_2004_headgears_you_want_x_hairpin_6cb300: "你想要一个^3131FFX发夹？^000000"
  npc_override_alde_alche_2004_headgears_you_wear_them_birthday_p_d9cdda: "你可以在生日派对、圣诞派对上戴它们。嗯，睡衣派对。政-治派对。"
  npc_override_alde_alche_2004_headgears_you_wish_4e6600: "你希望"
  npc_override_alde_alche_2004_headgears_you_wish_talk_fbd5da: "你想说话！！"
  npc_override_alde_alche_2004_headgears_you_won_over_738cc0: "你赢得了"
  npc_override_alde_alche_2004_headgears_you_won_victories_over_o_fb2797: "你已经赢得了{0}场对兽人战士的胜利。"
  npc_override_alde_alche_2004_headgears_you_you_340578: "你身上有的？"
  npc_override_alde_alche_2004_headgears_your_information_if_you_b104c8: "^FF0000为了你的信息，如果你给我带来任何镶嵌了卡片的物品，或升级过的物品，在我使用它们后，物品的额外能力会消失。所以请记住这一点。^000000"
  npc_override_alde_alche_2004_headgears_your_own_blue_fish_hat_277447: "你专属的''蓝鱼''帽子，由一个科学原理驱动！另外，你介意我留下那个沙漠之狼的爪子吗？嘿嘿，谢谢~"
  npc_override_alde_alche_2004_headgears_your_own_drooping_cat_ha_8b3ac0: "你专属的''垂耳猫''帽子，由一个科学原理驱动！另外，你介意我留下那个沙漠之狼的爪子吗？嘿嘿，谢谢~"
