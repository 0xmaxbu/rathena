  npc_override_alde_alche_2004_headgears_s_amazing_how_so_many_929881: "沙漠里能生活这么多不同的动物真是令人惊讶。我一直在花时间研究动物的方式，在朱诺图书馆读书……"
  npc_override_alde_alche_2004_headgears_s_as_cool_as_having_b5eb07: "它不像蘑菇真的附着在你的头骨上那么酷，但这是我们能做到的。抱歉让你失望了。"
  npc_override_alde_alche_2004_headgears_s_been_while_i_ve_b6d950: "好久没见过像你这么坚定的人类了。把杰勒比放在床边。"
  npc_override_alde_alche_2004_headgears_s_bestest_magic_ever_bec_9c497e: "这是最棒的魔法，因为它来自我的心！"
  npc_override_alde_alche_2004_headgears_s_complete_there_you_go_048e73: "完成了！给你。我想这个戴在你头上会很好看！请好好照顾这顶帽子。"
