  npc_override_alde_alche_2004_headgears_needless_say_they_brough_542bd1: "不用说，他们给我们的部落带来了耻辱和丢脸。"
  npc_override_alde_alche_2004_headgears_nice_choice_003acb: "不错的选择~！"
