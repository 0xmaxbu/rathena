Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_alde_alche_2004_headgears_about_stellar_ee25dd: "关于星辰……"
  npc_override_alde_alche_2004_headgears_accessories_typically_wo_d1af13: "怪物通常佩戴的饰品现在可供冒险者们佩戴了！"
  npc_override_alde_alche_2004_headgears_accessory_you_b21a24: "你正在佩戴的饰品"
  npc_override_alde_alche_2004_headgears_acknowledge_someone_31d1dc: "认可某人"
  npc_override_alde_alche_2004_headgears_acorn_4ef876: "1000个^ff0000橡果^000000，"
  npc_override_alde_alche_2004_headgears_actually_belonged_one_ou_a6a769: "它实际上属于我们的一位兽人之王，他被一个人类击败了。他对失败非常愤怒，以至于折断了中间的那根角并扔掉了！"
  npc_override_alde_alche_2004_headgears_adios_amigo_df7518: "^3355FF再见，朋友^000000"
  npc_override_alde_alche_2004_headgears_after_some_intense_think_9071c5: "经过一些深入的思考，并在朱诺读了一些《趣味儿童科学》杂志后，我意识到黑色吸收阳光和热量，而白色反射它们。"
  npc_override_alde_alche_2004_headgears_after_you_lose_some_weig_0f3785: "- 等你减了一些体重之后。-"
  npc_override_alde_alche_2004_headgears_again_human_you_confound_caedb9: "再次，人类，你的固执让我困惑。我看人类是受虐狂。或者只是喜欢通过让兽人数一千个杰勒比来惹恼兽人。"
  npc_override_alde_alche_2004_headgears_again_tomorrow_797b94: "明天再来。"
  npc_override_alde_alche_2004_headgears_ah_298394: "啊……"
  npc_override_alde_alche_2004_headgears_ah_971301: "啊……"
  npc_override_alde_alche_2004_headgears_ah_band_aid_943c9f: "啊，一个^3131FF创可贴^000000！"
  npc_override_alde_alche_2004_headgears_ah_claw_desert_wolf_d8d815: "啊，沙漠之狼的爪子~！"
  npc_override_alde_alche_2004_headgears_ah_i_got_ee63d0: "啊！我明白了！"
  npc_override_alde_alche_2004_headgears_ah_i_see_you_brought_180ee7: "啊！我看到你把所有东西都带来了。好的！你想让我现在给你做一顶草帽吗？"
  npc_override_alde_alche_2004_headgears_ah_i_tell_you_already_a641ef: "啊，我能看出你已经有一顶^8C1717'模特训练帽'^000000了。我看使用它已经纠正了你的姿势。"
  npc_override_alde_alche_2004_headgears_ah_i_ve_piqued_your_a87cab: "啊……我引起了你的好奇心，我明白了。"
  npc_override_alde_alche_2004_headgears_ah_right_1e4aa7: "啊……对。"
  npc_override_alde_alche_2004_headgears_ah_s_done_2340a8: "啊……完成了！"
  npc_override_alde_alche_2004_headgears_ah_spoken_like_true_warr_887880: "啊，说得像个真正的战士。那好吧，去和我的族人战斗吧，给我带来10,000个兽人凭证。"
  npc_override_alde_alche_2004_headgears_ah_yes_now_here_s_dd914e: "啊是的。现在这里有一顶优雅的帽子，适合墨西哥流浪乐队英雄和拉丁情人。你无法否认戴着宽边帽的人散发出的性感魅力。"
  npc_override_alde_alche_2004_headgears_ah_yes_we_talking_about_de3702: "啊是的，我们在说兽人英雄。现在，与从出生那天起就被赋予力量的兽人英雄不同，有一些年长、经验丰富的战士设法在多年的战斗中幸存下来。"
  npc_override_alde_alche_2004_headgears_ah_you_brought_everythin_1e81ee: "啊！你把所有东西都带来了。好的！要我现在就给你做一顶针织帽吗？"
  npc_override_alde_alche_2004_headgears_ah_you_brought_everythin_920aa3: "啊！你把所有东西都带来了。太好了。要我现在就做一顶牛仔帽吗？"
  npc_override_alde_alche_2004_headgears_ah_you_brought_everythin_d0e8b7: "啊！你把所有东西都带来了。好的！要我马上就给你做一顶宽边帽吗？"
  npc_override_alde_alche_2004_headgears_aha_ae0e52: "啊哈~"
  npc_override_alde_alche_2004_headgears_aha_good_good_good_ce6595: "啊哈~ 好 好 好。"
  npc_override_alde_alche_2004_headgears_ahahaha_775053: "哈哈哈~"
  npc_override_alde_alche_2004_headgears_alarm_mask_4b0302: "……这个闹钟面具！"
  npc_override_alde_alche_2004_headgears_alarms_their_ruimento_ma_dc0b94: "闹钟和它们的''鲁伊门托''是由古老的神秘技术制成的。你只能在钟楼里找到这些。"
  npc_override_alde_alche_2004_headgears_all_i_need_make_cacb09: "我做这个所需要的只是……"
  npc_override_alde_alche_2004_headgears_all_i_want_bring_her_541183: "我只想把她的生命带回来，无论代价如何。这就是为什么我咽下我的骄傲向你求助。"
  npc_override_alde_alche_2004_headgears_all_you_gotta_bring_me_da8bf5: "你所要做的就是给我带来制作它的材料。如果那个发夹是给你自己的，好吧，我也支持那个风格。"
  npc_override_alde_alche_2004_headgears_all_you_humans_so_foolis_36dc9c: "你们人类都这么愚蠢吗？！"
  npc_override_alde_alche_2004_headgears_allow_me_introduce_mysel_83f858: "请允许我介绍自己。我的名字是哈特比尔·莫尔，一位旅行的铁匠。"
  npc_override_alde_alche_2004_headgears_alright_6ceaec: "好的……"
  npc_override_alde_alche_2004_headgears_alright_belongs_orc_lord_ecef77: "好的，那属于兽人之王。我的意思是，即使它现在是你的，它也是被错误地给你的。"
  npc_override_alde_alche_2004_headgears_alright_gimmie_minute_ye_ee3a1f: "好的，给我一分钟，好吗？"
  npc_override_alde_alche_2004_headgears_alright_i_m_done_9bbe23: "好的，我完成了！"
  npc_override_alde_alche_2004_headgears_alright_let_s_get_work_1145e4: "好的，让我们开始工作吧。"
  npc_override_alde_alche_2004_headgears_alright_s_time_roll_7a55f6: "好的，是时候卷起来了！"
  npc_override_alde_alche_2004_headgears_also_i_disassemble_model_601d82: "另外，我可以把模特训练帽拆解成原来的材料。所以如果你想要回原来的物品，把模特训练帽和我给你的箭带来。"
  npc_override_alde_alche_2004_headgears_also_please_only_one_cor_97cc99: "^FF0000另外，请只在你的背包里放一个宝冠来制作蜂后之冠。我们对任何损失不负责任。^"
  npc_override_alde_alche_2004_headgears_although_doesn_t_look_di_13b777: "虽然它看起来和其他没什么不同，但请好好保管。只有戴着这个你才能被认可为兽人战士。"
  npc_override_alde_alche_2004_headgears_although_doesn_t_look_di_3e8a99: "虽然它看起来和其他没什么不同，但我希望你能好好保管。只有戴着这个信物你才能被认可为兽人英雄。"
  npc_override_alde_alche_2004_headgears_although_e16902: "虽然……"
  npc_override_alde_alche_2004_headgears_although_i_don_t_like_31f418: "虽然我不喜欢承认，但有一些懦弱的兽人会逃离战斗，或者使用不光彩的方法战斗。"
  npc_override_alde_alche_2004_headgears_although_i_really_enjoy_f2c3af: "虽然我真的很喜欢旅行而不是待在我的店里，但我内心深处仍然是个铁匠，我总是要做点东西。距离我上次创作已经有一段时间了……"
  npc_override_alde_alche_2004_headgears_although_s_clear_you_ve_7a7faf: "虽然很明显你有'^3355FF那种气质^000000'，但我们目前不能接受任何学生。"
  npc_override_alde_alche_2004_headgears_although_street_fashion_e109ad: "虽然它可以是一种街头时尚，但针织帽戴在一些人头上看起来也很可爱。"
  npc_override_alde_alche_2004_headgears_although_we_t_offer_any_4c6f0c: "虽然我们现在不能提供任何课程，但我可以为你制作一顶特别的''模特训练帽''。这样，你就可以自己练习在T台上走秀的魅力方式。"
  npc_override_alde_alche_2004_headgears_although_you_may_learnin_5d29ba: "虽然你可能通过和我交谈来学习理论，但你必须亲自体验我们的生活方式。"
  npc_override_alde_alche_2004_headgears_although_you_re_58924e: "虽然你是一个"
  npc_override_alde_alche_2004_headgears_although_you_re_human_yo_2f1c83: "虽然你是个人类，但你现在在我们之中是兽人英雄，所以你应该有一顶适合你身份的头盔……"
  npc_override_alde_alche_2004_headgears_am_called_zhenbolt_1e6219: "被称为^FF0000真博尔特^000000！！"
  npc_override_alde_alche_2004_headgears_am_i_bored_69ea70: "我很无聊~！"
  npc_override_alde_alche_2004_headgears_among_those_well_experie_445dfe: "在那些经验丰富的战士中，最伟大的一位被授予兽人之王的称号，并作为我们部落的领袖受到我们的尊敬。"
  npc_override_alde_alche_2004_headgears_angel_wing_6e703e: "1个天使之翼"
  npc_override_alde_alche_2004_headgears_angel_wing_b22077: "1个天使之翼，"
  npc_override_alde_alche_2004_headgears_angel_wing_ears_1d9252: "''天使之翼耳朵！''"
  npc_override_alde_alche_2004_headgears_animals_don_t_take_naps_9f5634: "不在阳光下打盹的动物永远不会觉得热吗？"
  npc_override_alde_alche_2004_headgears_anyway_i_ve_got_bone_3d9b48: "不管怎样，我和你们人类有笔账要算。你们是一个好战而贪婪的种族，总是杀东西和拿东西。尽管猎杀了那么多，你们似乎从不满足。"
  npc_override_alde_alche_2004_headgears_anyway_now_you_wear_mush_9cb198: "不管怎样，现在你可以把那朵蘑菇戴成一个俏皮的角度，就像它应该被戴的方式一样。保持酷，你这个时尚叛逆者。"
  npc_override_alde_alche_2004_headgears_anyway_what_i_need_make_ecc181: "不管怎样，这是我做针织帽需要的……"
  npc_override_alde_alche_2004_headgears_anyway_what_i_need_make_f9f3fd: "不管怎样，这是我做派对帽需要的……"
  npc_override_alde_alche_2004_headgears_anyways_i_need_all_these_5c44f1: "不管怎样，我需要所有这些来给你做一顶草帽……"
  npc_override_alde_alche_2004_headgears_apple_archer_686d19: "^0000FF1个射手苹果^000000和"
  npc_override_alde_alche_2004_headgears_argh_648b06: "啊~！"
  npc_override_alde_alche_2004_headgears_as_being_suave_well_i_03ccff: "至于风度翩翩？好吧，我确实有这个溜溜球……"
  npc_override_alde_alche_2004_headgears_as_i_told_you_i_6b40c4: "正如我告诉你的，我会用那些物品给你这个非常时髦的^0000FF闹钟面具^000000，还会为你摆任何姿势。"
  npc_override_alde_alche_2004_headgears_as_my_mom_taught_me_80c3b5: "正如我妈妈教我的，"
  npc_override_alde_alche_2004_headgears_as_orc_warrior_011006: "作为一名兽人战士，"
  npc_override_alde_alche_2004_headgears_as_proof_their_status_or_5142b4: "作为他们地位的证明，兽人英雄会被授予兽人英雄凭证，以及只允许我们的英雄使用的特殊剑。"
  npc_override_alde_alche_2004_headgears_as_we_all_know_you_fcc4f0: "而且，我们都知道，如果你隐形或者完全裸体，你就不会穿任何颜色。我已经用可悲而可怜的结果进行了我的裸体实验……"
  npc_override_alde_alche_2004_headgears_as_you_now_one_who_25658e: "既然你现在已经是一个在无尽的战斗后能感受到对手真正意图的人，我现在把你送回战场。"
  npc_override_alde_alche_2004_headgears_attitude_sometimes_880919: "态度。有时候，"
  npc_override_alde_alche_2004_headgears_awww_daa9b8: "啊……"
  npc_override_alde_alche_2004_headgears_awwww_12081b: "啊呜~"
  npc_override_alde_alche_2004_headgears_bad_572d5a: "不错……"
  npc_override_alde_alche_2004_headgears_bad_all_0e9921: "相当不错。"
  npc_override_alde_alche_2004_headgears_bah_humans_built_their_o_29be9b: "呸！人类建造了自己的城镇和城市。他们把毫无意义的杀戮限制在彼此之间了吗？！不！人类必须到处肆虐和破坏！！"
  npc_override_alde_alche_2004_headgears_band_aid_eh_bef429: "创可贴，嗯？"
  npc_override_alde_alche_2004_headgears_bandana_white_dyestuffs_bcdc37: "1个^FF0000头巾^000000和1个^FF0000白色染料^000000。"
  npc_override_alde_alche_2004_headgears_bang_bang_ping_ping_7a4d44: "^3355FF*砰砰 乒乒*^000000"
  npc_override_alde_alche_2004_headgears_battles_032cac: "10,000场战斗"
  npc_override_alde_alche_2004_headgears_battles_won_vigor_passio_907b01: "战斗靠活力和激情取胜！"
  npc_override_alde_alche_2004_headgears_beanie_2ab53c: "一顶针织帽……！"
  npc_override_alde_alche_2004_headgears_beanie_871549: "一顶针织帽！"
  npc_override_alde_alche_2004_headgears_beautiful_227c2e: "美丽……"
  npc_override_alde_alche_2004_headgears_beautiful_day_a84f59: "美好的一天"
  npc_override_alde_alche_2004_headgears_because_0109fe: "因为……！"
  npc_override_alde_alche_2004_headgears_before_i_start_create_it_ff7ba3: "在我开始制作这个物品之前，我有义务警告你……"
  npc_override_alde_alche_2004_headgears_behalf_903002: "代表"
  npc_override_alde_alche_2004_headgears_behalf_comodo_indians_i_8ba934: "代表克魔岛的印第安人，我向所有印第安部落致敬！"
  npc_override_alde_alche_2004_headgears_besides_nothing_says_reb_e932b2: "此外，没有什么比头上长出一朵蘑菇更能表达''无因的反叛''了！你会看起来超级酷、独立和反主流文化！"
  npc_override_alde_alche_2004_headgears_best_way_understanding_o_c5da37: "理解兽人部落最好的方式就是和他们战斗。通过力量和技能的竞争，最终你会理解并尊重你的对手。"
  npc_override_alde_alche_2004_headgears_big_ribbon_0b6c18: "1个^FF0000大蝴蝶结^000000，"
  npc_override_alde_alche_2004_headgears_black_bear_skin_6b41e6: "^0000FF300张黑熊皮^000000。"
  npc_override_alde_alche_2004_headgears_black_cat_doll_cd533f: "和300个^ff0000黑猫娃娃^000000。"
  npc_override_alde_alche_2004_headgears_black_cat_ears_d57acc: "黑猫耳朵"
  npc_override_alde_alche_2004_headgears_black_dyestuffs_486219: "1个^FF0000黑色染料^000000，"
  npc_override_alde_alche_2004_headgears_black_dyestuffs_974b74: "1个^ff0000黑色染料^000000"
  npc_override_alde_alche_2004_headgears_blue_fish_hat_617c99: "一顶''蓝鱼''帽子？"
  npc_override_alde_alche_2004_headgears_book_5c157b: "^0000FF1本书^000000。"
  npc_override_alde_alche_2004_headgears_boys_aren_t_supposed_mak_382da5: "男孩不应该做花。"
  npc_override_alde_alche_2004_headgears_bravery_honor_a95710: "勇敢和荣誉……"
  npc_override_alde_alche_2004_headgears_bring_me_5a6104: "给我带来"
  npc_override_alde_alche_2004_headgears_bring_me_alcohol_416e6e: "给我带来^FF00001瓶酒精^000000和"
  npc_override_alde_alche_2004_headgears_bring_me_b31d0b: "给我带来……"
  npc_override_alde_alche_2004_headgears_bring_me_f4de78: "给我带来……"
  npc_override_alde_alche_2004_headgears_bring_me_jellopy_dae0df: "给我带来^FF00001000个杰勒比^000000"
  npc_override_alde_alche_2004_headgears_bring_me_those_items_27d12d: "把那些物品给我带来……"
  npc_override_alde_alche_2004_headgears_bringing_everything_8ab54c: "把所有东西都带来。"
  npc_override_alde_alche_2004_headgears_burning_heart_dd4cb1: "300个^FF0000燃烧之心^000000，"
  npc_override_alde_alche_2004_headgears_burning_horseshoe_73869f: "4个^3355FF燃烧马蹄铁^000000。"
  npc_override_alde_alche_2004_headgears_but_2e7fce: "但是……"
  npc_override_alde_alche_2004_headgears_bwahahahahahha_43cc41: "哇哈哈哈哈~！"
  npc_override_alde_alche_2004_headgears_bwahahahahhahahahahahaha_1dfab7: "哇哈哈哈哈哈哈哈哈哈哈！"
  npc_override_alde_alche_2004_headgears_cactus_needle_ec729a: "50个^3355FF仙人掌针^000000和"
  npc_override_alde_alche_2004_headgears_cap_90091c: "1个^3355FF帽子^000000和"
  npc_override_alde_alche_2004_headgears_certain_opponents_f13992: "某些对手。"
  npc_override_alde_alche_2004_headgears_chikachikachoom_729d0b: "*咔咔咔轰*"
  npc_override_alde_alche_2004_headgears_chomp_chomp_082976: "*咔嚓咔嚓……*"
  npc_override_alde_alche_2004_headgears_clang_clang_scrape_scrap_2b23e8: "^3355FF* 叮叮！刮刮！叮铃叮铃！ *^000000"
  npc_override_alde_alche_2004_headgears_claw_desert_wolf_6b7c39: "108个^3355FF沙漠之狼的爪子^000000，"
  npc_override_alde_alche_2004_headgears_clik_clak_clik_clak_pam_874e5e: "^3355FF*咔嗒咔嗒 咔嗒咔嗒 砰砰砰砰*^000000"
  npc_override_alde_alche_2004_headgears_cling_dee835: "……*叮*"
  npc_override_alde_alche_2004_headgears_cling_f6e99b: "……*叮*"
  npc_override_alde_alche_2004_headgears_clock_hand_9868ac: "^0000FF3000个钟指针^000000和"
  npc_override_alde_alche_2004_headgears_come_af9fd7: "来吧！"
  npc_override_alde_alche_2004_headgears_come_back_anytime_when_y_9f1539: "当你有了那些材料随时回来。"
  npc_override_alde_alche_2004_headgears_come_back_anytime_you_wa_a43c1d: "随时回来。"
  npc_override_alde_alche_2004_headgears_come_back_as_70cd4f: "作为"
  npc_override_alde_alche_2004_headgears_come_back_soon_adventure_b3e457: "尽快回来，冒险者！"
  npc_override_alde_alche_2004_headgears_come_take_rest_here_90b280: "来这里休息一下吧。"
  npc_override_alde_alche_2004_headgears_compliment_anyone_2c21d0: "赞美任何人"
  npc_override_alde_alche_2004_headgears_considering_stories_abou_ceee3e: "考虑到关于我部落的故事，如果你只是听，对我来说就够了。然而，仅仅倾听和亲身体验是完全不同的。"
