  npc_override_alde_alche_2004_headgears_seth_wait_you_here_promi_417413: "塞斯会在这里等你。答应我你会回来？"
  npc_override_alde_alche_2004_headgears_show_me_your_respect_45deec: "向我展示你的尊重"
  npc_override_alde_alche_2004_headgears_show_me_your_respect_if_c89c68: "如果我"
  npc_override_alde_alche_2004_headgears_show_your_opponents_your_ca8d12: "向你的对手展示你不屈的精神。为被授予兽人战士称号的人类感到自豪！"
