  npc_override_alde_alche_2004_headgears_s_we_re_done_oh_d6489c: "完成了~！我们完成了！哦，我知道戴上这个你会看起来很珍贵。"
  npc_override_alde_alche_2004_headgears_s_weird_i_need_whole_23e218: "很奇怪，但我需要很多小叶子来做一个大的。"
  npc_override_alde_alche_2004_headgears_s_who_you_21dc0f: "那就是你！"
