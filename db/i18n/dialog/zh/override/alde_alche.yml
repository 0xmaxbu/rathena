  npc_override_alde_alche_2004_headgears_just_remember_if_you_bri_26299d: "^FF0000只要记住，如果你给我带来任何镶嵌了卡片的物品，或升级过的物品，在我使用它们后，物品的额外能力会消失。所以请记住这一点。"
  npc_override_alde_alche_2004_headgears_just_think_s_perfect_fus_f600cd: "想想看！这是魔法与艺术的完美融合，时尚与生活……"
