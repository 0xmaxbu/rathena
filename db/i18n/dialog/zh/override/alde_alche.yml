  npc_override_alde_alche_2004_headgears_menu_drooping_beadeb: "垂耳猫:斯莫基树叶:懒惰斯莫基:蓝鱼:那……好吧。"
  npc_override_alde_alche_2004_headgears_menu_finally_e1b5fc: "最后，我的名单上只剩下三种生物:鸸鹋、长颈鹿和鱼。"
