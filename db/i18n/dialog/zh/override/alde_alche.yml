  npc_override_alde_alche_2004_headgears_seeing_as_you_understand_bb8b3c: "既然你理解这个基本原则，我认可你是永恒正义斗争中的盟友！我将赐予你那个让我把恐惧打入邪恶之心的象征……"
  npc_override_alde_alche_2004_headgears_seems_me_you_everything_7aeee9: "看起来你什么都有了。好的！要我给你做一顶派对帽吗？"
