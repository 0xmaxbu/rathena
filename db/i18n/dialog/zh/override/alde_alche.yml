  npc_override_alde_alche_2004_headgears_s_enough_today_61e0c6: "今天就够了！"
  npc_override_alde_alche_2004_headgears_s_funny_i_thought_you_a2e986: "真有趣，我以为你现在已经有那个尖叫先生面具和所有那些钟指针了……"
  npc_override_alde_alche_2004_headgears_s_ha_94a2fb: "不是！哈……！"
  npc_override_alde_alche_2004_headgears_s_hat_adventure_explorat_b213b1: "这是一顶冒险和探索的帽子。虽然它是一顶无与伦比的男子气概帽子，男子气概指数为9，但戴在女孩头上也很好看。"
  npc_override_alde_alche_2004_headgears_s_impossible_humans_even_12ae1b: "没有这顶帽子的灵感，人类甚至无法模仿这种特殊的猫科技能！"
  npc_override_alde_alche_2004_headgears_s_jellopies_a2966b: "那是1000个杰勒比！"
  npc_override_alde_alche_2004_headgears_s_known_as_hot_blooded_59f8ce: "它被称为^FF0000热血头带^000000，我个人战斗精神的象征！戴上这个，没有什么能阻止你！"
  npc_override_alde_alche_2004_headgears_s_much_better_way_use_376860: "而且这比把花放在宠物兽人战士头上要好得多。天哪，那些东西看起来太可怕了~"
  npc_override_alde_alche_2004_headgears_s_really_really_cute_als_65176b: "它真的真的超级可爱！而且，这是我唯一知道怎么做的帽子，因为我太喜欢和玩海獭了！"
  npc_override_alde_alche_2004_headgears_s_seems_you_re_carrying_c555b7: "看起来你带的东西太多了，我没办法给你任何东西。"
