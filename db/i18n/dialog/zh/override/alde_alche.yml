  npc_override_alde_alche_2004_headgears_nobody_right_tell_you_wh_5a5688: "没有人有权利告诉你什么能做、什么不能做。请把它们作为你胜利的纪念。"
  npc_override_alde_alche_2004_headgears_now_76c5ab: "现在……"
  npc_override_alde_alche_2004_headgears_now_everyone_needs_sombr_1c6a4d: "现在，每个人都需要一顶宽边帽。它们是现存最多功能的帽子之一。你可以戴着它们参加正式活动，可以戴着它们打盹，可以戴着它们闲逛……"
  npc_override_alde_alche_2004_headgears_now_get_out_here_you_c90a93: "现在滚出去，你这个可怕的、臭烘烘的、可怜的动物借口！！"
  npc_override_alde_alche_2004_headgears_now_go_d6f4a4: "现在！去吧！"
  npc_override_alde_alche_2004_headgears_now_go_ee427a: "现在，去吧！"
  npc_override_alde_alche_2004_headgears_now_go_warrior_i_believe_9935c9: "现在，去吧，战士！我相信你有成功的机会。和100个兽人英雄战斗，我会授予你，一个人类，兽人英雄的认可！"
  npc_override_alde_alche_2004_headgears_now_hurry_a34068: "现在，快点"
  npc_override_alde_alche_2004_headgears_now_i_use_mr_scream_0a1183: "现在我可以用这个尖叫先生和所有这些钟指针来继续我的测试。"
  npc_override_alde_alche_2004_headgears_now_if_you_want_f52d81: "现在，如果你想"
  npc_override_alde_alche_2004_headgears_now_if_you_want_listen_a31b51: "现在，如果你想听更多，去给我带来"
  npc_override_alde_alche_2004_headgears_now_make_one_last_choice_15adaa: "现在，做最后一个选择。你会怎么处理那些英雄徽章？它们对你们人类来说可能不值钱，但对兽人来说，它们被拥有者珍视。"
  npc_override_alde_alche_2004_headgears_now_now_you_understand_i_b563a8: "现在现在，你明白我必须让蘑菇从你的头上长出来。在任何其他地方，你可能会怀疑有什么把戏或幻觉。"
  npc_override_alde_alche_2004_headgears_now_what_874aba: "现在，你想要"
  npc_override_alde_alche_2004_headgears_now_where_i_51a404: "现在，我说到哪了？"
  npc_override_alde_alche_2004_headgears_now_where_i_fa2ebd: "现在我说到哪了？"
  npc_override_alde_alche_2004_headgears_now_why_am_i_human_ab4d9f: "现在为什么我又变成了人类形态？"
  npc_override_alde_alche_2004_headgears_now_you_0deddc: "既然你"
  npc_override_alde_alche_2004_headgears_now_you_may_go_back_a3ef51: "现在，你可以回到你来的地方。每当我的部落浮现在你的脑海中时，就来坐坐。"
  npc_override_alde_alche_2004_headgears_now_you_wear_54b962: "现在你可以戴"
  npc_override_alde_alche_2004_headgears_now_you_wear_hat_feel_4fa58e: "现在你可以戴上这顶帽子，感觉很酷，有风格地放松。"
  npc_override_alde_alche_2004_headgears_o_okay_ab8a1a: "哦-好的……"
  npc_override_alde_alche_2004_headgears_oh_78a2fc: "哦……"
  npc_override_alde_alche_2004_headgears_oh_9f7455: "哦~"
  npc_override_alde_alche_2004_headgears_oh_don_t_worry_s_1a74e5: "哦，别担心。快完成了。"
  npc_override_alde_alche_2004_headgears_oh_don_t_you_worry_2f47c6: "哦，别担心我的技术！我在铁匠中相当有名，因为我有天赋，擅长用垃圾做出伟大的东西。"
  npc_override_alde_alche_2004_headgears_oh_hello_you_re_back_5f0465: "哦，你好。你回来了。"
  npc_override_alde_alche_2004_headgears_oh_here_s_leftovers_momm_b04217: "哦，这是剩下的。妈妈说我们应该总是节省东西。嘿嘿~"
  npc_override_alde_alche_2004_headgears_oh_i_almost_forgot_6ee70a: "哦，我差点忘了！"
