  npc_override_alde_alche_2004_headgears_okay_s_almost_done_c24238: "好的，快完成了……"
  npc_override_alde_alche_2004_headgears_okay_take_43ce18: "好的，拿着这个~"
  npc_override_alde_alche_2004_headgears_okay_then_i_need_19616d: "那好吧，我需要……？"
  npc_override_alde_alche_2004_headgears_okay_then_then_i_ll_81315a: "那好吧，那我需要……"
  npc_override_alde_alche_2004_headgears_okay_you_like_go_through_41fdd9: "好的，你想再经历一次测试吗？这可能会让你来这里的一切努力化为乌有。即使是经验丰富的兽人战士也害怕接受这个测试。"
  npc_override_alde_alche_2004_headgears_once_again_human_you_ve_287dce: "再次，人类，你又成功激怒了我。但我们兽人是一个骄傲的种族。我会履行我这部分可悲的交易。"
  npc_override_alde_alche_2004_headgears_once_upon_time_orcs_huma_3aa201: "很久以前，兽人和人类是盟友。我……我怀念那些时光。但怀念旧的友谊是没有用的。要消除这么久以前的误解是不可能的……"
  npc_override_alde_alche_2004_headgears_one_b51e86: "一……"
  npc_override_alde_alche_2004_headgears_one_one_thousand_b16be9: "一……一千。"
  npc_override_alde_alche_2004_headgears_one_t_two_ab3a07: "一……二……"
  npc_override_alde_alche_2004_headgears_one_thousand_bf1ef3: "一千。"
  npc_override_alde_alche_2004_headgears_one_you_8513ee: "一个给你，"
  npc_override_alde_alche_2004_headgears_ooh_bring_e85dec: "哦！带来……"
  npc_override_alde_alche_2004_headgears_ooh_finally_9d8d46: "哦……终于！"
  npc_override_alde_alche_2004_headgears_ooh_hurry_hurry_i_t_1fcced: "哦，快点快点！我等不及要装饰你的头发了！"
  npc_override_alde_alche_2004_headgears_ooh_i_need_889dc3: "哦！为了那个我需要"
  npc_override_alde_alche_2004_headgears_ooh_you_know_what_make_b6662e: "哦~！你知道什么会让你的头发更可爱吗？我想如果你用一条大大的红色丝带把它扎起来，你会看起来超级^FF66CC可爱^000000！"
  npc_override_alde_alche_2004_headgears_oooh_2d3b6d: "哦哦~！"
  npc_override_alde_alche_2004_headgears_oooh_yeah_7b5d54: "哦哦耶！"
  npc_override_alde_alche_2004_headgears_orc_hero_1e7cb8: "是兽人英雄，"
  npc_override_alde_alche_2004_headgears_orc_hero_faa375: "兽人英雄！"
  npc_override_alde_alche_2004_headgears_orc_heroes_who_defeated_aba152: "被你击败的兽人英雄也一定认可了你的勇气。谢谢你，人类，向我们展示了什么是真正的力量。"
  npc_override_alde_alche_2004_headgears_orc_lady_3e5560: "兽人女士！！"
  npc_override_alde_alche_2004_headgears_orc_stronger_physical_st_ce5258: "那个兽人将比普通兽人战士拥有更强的体力和能力。这些战士被称为高阶兽人。"
  npc_override_alde_alche_2004_headgears_orc_tribe_1ede4b: "兽人部落。"
  npc_override_alde_alche_2004_headgears_orc_tribe_8fbe07: "兽人部落，"
  npc_override_alde_alche_2004_headgears_orc_warrior_6f9aa1: "兽人战士！！"
  npc_override_alde_alche_2004_headgears_orc_warrior_status_44beb2: "兽人战士地位！！"
  npc_override_alde_alche_2004_headgears_orc_warriors_we_see_age_ec7c80: "对兽人战士来说，我们不把年龄看作弱点。我们尊敬老战士，因为他们在战斗中的经验和战斗技能。"
  npc_override_alde_alche_2004_headgears_orcish_voucher_ead591: "一个兽人凭证"
  npc_override_alde_alche_2004_headgears_orcs_f27636: "和兽人。"
  npc_override_alde_alche_2004_headgears_orcs_never_restore_healt_35e826: "兽人从不使用你们愚蠢的药物在战斗中恢复健康。哼。人类可以很软弱，喝药水来维持战斗。哦，不过，我不确定你是否也一样。"
  npc_override_alde_alche_2004_headgears_orcs_proven_good_sight_d_f808c8: "被证明有良好视力和灵巧的兽人会被给予弓箭，成为兽人弓箭手。"
  npc_override_alde_alche_2004_headgears_order_cast_fox_resurrect_dc210b: "为了施展狐狸复活法术。"
  npc_override_alde_alche_2004_headgears_order_cast_spell_i_need_789d1c: "但为了施展这个法术，我需要^FF0000300个蘑菇孢子^000000中的魔力。所以，如果你给我带来所有这些蘑菇孢子，你就能亲眼看到我的魔法！"
  npc_override_alde_alche_2004_headgears_order_continue_my_resear_a98c02: "为了继续我的研究。"
  npc_override_alde_alche_2004_headgears_ouch_88930d: "哎哟……！"
  npc_override_alde_alche_2004_headgears_ouch_why_you_carrying_0962e0: "哎哟，你为什么带着"
  npc_override_alde_alche_2004_headgears_our_most_basic_customs_228e8b: "我们最基本的习俗！"
  npc_override_alde_alche_2004_headgears_out_angel_wing_as_well_2cbf1b: "用天使之翼也能做！"
  npc_override_alde_alche_2004_headgears_out_evil_wing_as_well_7a4942: "用恶魔之翼也能做！"
  npc_override_alde_alche_2004_headgears_p_peeeeeeeeep_8aeb0f: "*哔-哔-哔-哔-哔*"
  npc_override_alde_alche_2004_headgears_panda_hat_dbaa33: "^0000FF1个熊猫帽^000000，"
  npc_override_alde_alche_2004_headgears_party_hat_s_santa_hat_dece41: "派对帽！这是我用彩色纸重新制作的圣诞帽，增添节日气氛。用派对帽庆祝美好时光！来吧！"
