  npc_override_alde_alche_2004_headgears_oh_wait_please_check_one_5deba7: "哦等等！在我们开始之前请检查一件事。"
  npc_override_alde_alche_2004_headgears_oh_way_there_s_some_f1cb0e: "哦顺便说一下，有一些东西剩下了。我想你应该拿着它。你知道，以防你以后需要。"
  npc_override_alde_alche_2004_headgears_oh_you_brought_all_them_3ff390: "哦！你把所有东西都带来了！现在我要给你做一顶属于你自己的印第安头带。"
  npc_override_alde_alche_2004_headgears_oh_you_finally_brought_w_749286: "哦！你终于把我要求的带来了，人类。好的，现在我可以让她复活了！"
  npc_override_alde_alche_2004_headgears_oh_you_know_how_i_dfcfff: "哦~~！你知道我对闹钟美丽的机械肌肉有什么感觉！很高兴遇到一个有良好品味的人。"
  npc_override_alde_alche_2004_headgears_oil_paper_b38e60: "100个^3355FF油纸^000000和"
