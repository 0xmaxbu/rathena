  npc_override_moc_para01_eden_100_111_actually_i_t_just_accept_1e513f: "事实上，我不能仅仅接受街上的任何蠢事。"
  npc_override_moc_para01_eden_100_111_adventure_important_taki_41e34b: "他们表示，他们会治愈疲惫不堪的伊甸集团冒险者，以换取这一请求，但我们不确定他们是否会遵守。\n"
  npc_override_moc_para01_eden_100_111_adventurers_aa349c: "Adventurers!"
  npc_override_moc_para01_eden_100_111_adventurers_sometimes_br_0f3bfd: "我以为伊甸集团很忙，但没想到这么忙。"
  npc_override_moc_para01_eden_100_111_agood_experience_if_you_21eb5e: "主人用它来奖励冒险者们的奉献精神。\n"
  npc_override_moc_para01_eden_100_111_anonymous_client_sent_re_4e97f4: "一位匿名客户发送了帮助清除狮身人面像地牢中的怪物的请求，因为冒险者几乎不再访问摩洛哥了。"
  npc_override_moc_para01_eden_100_111_anyway_i_guess_you_seem_5596e5: "勺子存根。"
  npc_override_moc_para01_eden_100_111_anyway_i_m_doing_favor_a46e59: "我想我现在已经退休了，因为我的冒险技能太好了，无法与你们所有的孩子竞争。\n"
  npc_override_moc_para01_eden_100_111_anyways_request_clear_ou_283835: "冒险很重要，但休息也很重要。"
  npc_override_moc_para01_eden_100_111_as_you_see_master_made_79ace5: "你看，是师父自己做的，上面还贴了他的照片。"
  npc_override_moc_para01_eden_100_111_attack_ruined_their_danc_7661cf: "有一天，他们在岩浆地牢里跳舞时遭到了删除者的攻击。\n"
  npc_override_moc_para01_eden_100_111_because_i_am_coward_2f5776: "这并不是因为我胆小。\n"
  npc_override_moc_para01_eden_100_111_browsing_346388: "浏览\n"
  npc_override_moc_para01_eden_100_111_carat_hunting_de580e: "Carat Hunting"
  npc_override_moc_para01_eden_100_111_card_what_92dba0: "A card? What is it?"
  npc_override_moc_para01_eden_100_111_cheer_up_766155: "Cheer up! "
  npc_override_moc_para01_eden_100_111_client_showed_wonderful_9ded94: "一位客户向爱人展示了一段精彩的舞蹈。"
  npc_override_moc_para01_eden_100_111_collect_brigan_simple_co_e0cef0: "让我看看...\n"
  npc_override_moc_para01_eden_100_111_consider_memory_others_t_9a7131: "您刚刚完成一个请求。"
  npc_override_moc_para01_eden_100_111_course_i_beat_beast_easi_6ea832: "当我们面对这头野兽的眼睛时，我们意识到它看起来像狮子，但它不是任何普通的动物。\n"
  npc_override_moc_para01_eden_100_111_desert_wolf_hunting_15df27: "Desert Wolf Hunting"
  npc_override_moc_para01_eden_100_111_did_you_bring_all_brigan_1dbf07: "解决了简单的请求之后，我们就可以做真正的请求了。\n"
  npc_override_moc_para01_eden_100_111_did_you_bring_kindness_p_c1ad46: "祝剩下的请求好运。 "
  npc_override_moc_para01_eden_100_111_don_t_upset_because_mast_af16d8: "我不需要一一数。"
  npc_override_moc_para01_eden_100_111_easy_find_monsters_turtl_fea9b8: "收集 50 ^ff0000Brigan.^000000 这是一个简单又复杂的测试。\n"
  npc_override_moc_para01_eden_100_111_eden_group_aware_great_r_c6b271: "伊甸集团知道这不是一个很好的理由，但请求就是请求。"
  npc_override_moc_para01_eden_100_111_eden_group_headquarters_d1c5ce: "当您清除此请求后，请通知我。\n"
  npc_override_moc_para01_eden_100_111_eden_group_planning_send_163319: "这将是一个美好的回忆。\n"
  npc_override_moc_para01_eden_100_111_eden_group_protects_love_43fe9f: "现在她责怪删除者，所以她提出了这个要求。"
  npc_override_moc_para01_eden_100_111_endless_tower_somewhere_79ea8b: "我和师父去了，但只到了二十楼，因为他爬的时候膝盖不行了……\n"
  npc_override_moc_para01_eden_100_111_ever_since_then_he_start_3d6398: "你必须在艾伯塔省找到一个叫 Jansor 或 Jans 的人，他会带你去那里。\n"
  npc_override_moc_para01_eden_100_111_exchange_kindness_pass_d37a23: "Exchange kindness ^FF00001^000000 pass"
  npc_override_moc_para01_eden_100_111_exchange_prizes_adc71f: "Exchange for prizes"
  npc_override_moc_para01_eden_100_111_fact_i_am_strong_more_b9bf27: "对我来说，独自一人在那里很好。"
  npc_override_moc_para01_eden_100_111_fact_master_so_drunk_he_e78700: "事实上，主人喝醉了，几乎不记得这件事了。\n"
  npc_override_moc_para01_eden_100_111_fine_there_still_many_ad_b0df35: "我知道狩猎十钻对你来说不会太困难。\n"
  npc_override_moc_para01_eden_100_111_fun_guild_because_no_one_8b9900: "这是一个有趣的公会，因为没有人认真对待事情，但主人厌倦了他们的懒惰，所以他离开了。\n"
  npc_override_moc_para01_eden_100_111_fun_if_we_talk_samba_e4647f: "如果我们能和狼聊天、跳桑巴那就太有趣了！"
  npc_override_moc_para01_eden_100_111_gelkah_staring_rohtert_562985: "格尔卡盯着罗特特。\n"
  npc_override_moc_para01_eden_100_111_give_kindness_pass_e8505b: "Give ^FF000010^000000 kindness pass"
  npc_override_moc_para01_eden_100_111_give_story_about_adventu_dd4f5f: "他非常善良，尽管他看起来不像。"
  npc_override_moc_para01_eden_100_111_glastheim_related_reques_9943e6: "Glastheim related request"
  npc_override_moc_para01_eden_100_111_glastheim_seems_good_sac_63c5c8: "一名僧侣正在朝圣，并寻求保护以免受一些类似鳄鱼的生物的侵害。\n"
  npc_override_moc_para01_eden_100_111_good_experience_sure_7b6c7d: "环顾四周，而不是过多关注请求。\n"
  npc_override_moc_para01_eden_100_111_good_experience_you_591c72: "这对您来说将是一次很好的经历。\n"
  npc_override_moc_para01_eden_100_111_good_if_you_clear_one_b495d7: "如果有什么好东西我会告诉你的。\n"
  npc_override_moc_para01_eden_100_111_good_luck_make_sure_you_ec73dc: "祝你好运。"
  npc_override_moc_para01_eden_100_111_good_luck_remained_reque_71880e: "抱歉，请大师保守秘密。"
  npc_override_moc_para01_eden_100_111_good_luck_remained_reque_f5dbad: "我粗心了。\n"
  npc_override_moc_para01_eden_100_111_good_memory_a9dfa6: "请清除^FF000030飞行删除器^000000。\n"
  npc_override_moc_para01_eden_100_111_good_you_becoming_good_a_39ae6e: "我讨厌公开文件。"
  npc_override_moc_para01_eden_100_111_handling_documents_must_3e742e: "由于冒险者太多，我不知道是否能提供足够的东西。\n"
  npc_override_moc_para01_eden_100_111_haven_t_found_brigan_yet_807fc3: "我会为你列出一份请求清单，所以现在就去和我的主人交谈并表达你的敬意。\n"
  npc_override_moc_para01_eden_100_111_he_almost_crying_when_i_13a237: "He was almost crying when I first met him. It was difficult to pretend to lose to him. Please keep it a secret."
  npc_override_moc_para01_eden_100_111_he_also_regarded_as_trou_f3599d: "但由于他的好胜性格，他也被视为麻烦制造者，因此他离开了。\n"
  npc_override_moc_para01_eden_100_111_he_very_kind_even_though_44730b: "如果未正确提交，找论文的请求将被列入请求列表中。\n"
  npc_override_moc_para01_eden_100_111_here_list_other_requests_e8dc9e: "伊甸集团守护爱、正义、米德加德！"
  npc_override_moc_para01_eden_100_111_here_requests_glastheim_3ee392: "我是个好人。\n"
  npc_override_moc_para01_eden_100_111_hmm_9c4d28: "唔..."
  npc_override_moc_para01_eden_100_111_how_comodo_beach_take_lo_26a004: "科莫多海滩怎么样？"
  npc_override_moc_para01_eden_100_111_how_you_know_without_doi_ad2426: "在我看来，你是一位伟大的冒险家！\n"
  npc_override_moc_para01_eden_100_111_how_you_want_use_pass_846c05: "听听冒险家的故事会是一次很好的体验。"
  npc_override_moc_para01_eden_100_111_hunting_0972a0: "狩猎^000000。\n"
  npc_override_moc_para01_eden_100_111_hunting_quests_2d17e7: "Hunting Quests"
  npc_override_moc_para01_eden_100_111_i_am_afraid_if_you_aea228: "这还不错，但我想我很糟糕，但我不在乎。\n"
  npc_override_moc_para01_eden_100_111_i_am_busy_clearing_lot_694824: "你习惯这些要求吗？"
  npc_override_moc_para01_eden_100_111_i_am_done_my_business_606530: "好的 ！"
  npc_override_moc_para01_eden_100_111_i_am_looking_someone_who_a7f4a3: "不管怎样，我这是在帮伊甸集团一个忙。\n"
  npc_override_moc_para01_eden_100_111_i_am_responsible_clearin_741bf6: "我负责清理文件。"
  npc_override_moc_para01_eden_100_111_i_am_sorry_i_am_29660a: "祝剩下的请求好运。\n"
  npc_override_moc_para01_eden_100_111_i_am_sorry_must_popular_5c0c8c: "抱歉，我有点忙。"
  npc_override_moc_para01_eden_100_111_i_am_sorry_say_i_12400c: "很抱歉这么说，但我现在和永远都是师父唯一的弟子...他说^FF0000我不需要丑陋的女弟子^000000但我仍然坚持他。\n"
  npc_override_moc_para01_eden_100_111_i_appreciate_lets_see_i_80dab7: "奇怪的是，我并没有亲自接受委托，而是在引导冒险者们。\n"
  npc_override_moc_para01_eden_100_111_i_don_t_think_he_f695a5: "灰烬真空中的大师公会被解散，因为他们的公会大师在与一些山茱萸怪物的战斗后失踪了。\n"
  npc_override_moc_para01_eden_100_111_i_guess_i_m_retired_fc430d: "我和你一样，曾经是伊甸集团的冒险家，但我当然是最好的。\n"
  npc_override_moc_para01_eden_100_111_i_guess_i_no_choice_d76378: "I guess I have no choice."
  npc_override_moc_para01_eden_100_111_i_guess_i_should_talk_3ebc4a: "我讨厌做这种事。\n"
  npc_override_moc_para01_eden_100_111_i_guess_you_re_scrub_79f28f: "你还是新手吗？"
  npc_override_moc_para01_eden_100_111_i_hate_hot_tempered_fool_2966d5: "I hate that hot-tempered fool."
  npc_override_moc_para01_eden_100_111_i_heard_still_wandering_c53f57: "我听说它仍然是一个徘徊的地方，但我现在有点忙。\n"
  npc_override_moc_para01_eden_100_111_i_hope_you_didn_t_f9c5ba: "我希望你没有偷看。"
  npc_override_moc_para01_eden_100_111_i_just_left_alone_becaus_6cf4ac: "我只是把它放在一边，因为一个大师与一根卷须战斗有点可爱。"
  npc_override_moc_para01_eden_100_111_i_knew_kill_killed_d60a90: "是啊是啊土豆po-tah-toh！\n"
  npc_override_moc_para01_eden_100_111_i_know_hunting_tens_dril_60bf19: "白色是纸，黑色是字母。"
  npc_override_moc_para01_eden_100_111_i_know_sounds_childish_r_97df67: "^FF0000师父有话要对你说。^000000\n"
  npc_override_moc_para01_eden_100_111_i_know_why_master_likes_686334: "无论如何，我们应该接受这个简单的请求。"
  npc_override_moc_para01_eden_100_111_i_know_you_re_exactly_31a429: "你以为自己是老兵了，就因为你变成了三等兵……\n"
  npc_override_moc_para01_eden_100_111_i_let_you_know_if_e04467: "处理文件一定很困难。"
  npc_override_moc_para01_eden_100_111_i_like_know_if_you_ff2d1e: "我想知道您是否有能力执行请求。"
  npc_override_moc_para01_eden_100_111_i_like_requests_f93ebe: "I like requests!"
  npc_override_moc_para01_eden_100_111_i_m_charity_so_get_424048: "我不是慈善机构，所以迷路吧。\n"
  npc_override_moc_para01_eden_100_111_i_m_giving_requests_base_5fc2e6: "I'm giving requests to base level ^FF0000100 - 110^000000 adventurers."
  npc_override_moc_para01_eden_100_111_i_m_only_dealing_base_8eba44: "你在这里做什么？\n"
  npc_override_moc_para01_eden_100_111_i_m_sure_if_he_cec878: " I'm not sure if he thinks of you as his pupil. He is just out of control."
  npc_override_moc_para01_eden_100_111_i_m_sure_if_i_bf0366: "I'm not sure if I'm cut out for that job. Besides..."
  npc_override_moc_para01_eden_100_111_i_mark_you_down_as_e9924d: "我会将您标记为已完成此请求。\n"
  npc_override_moc_para01_eden_100_111_i_need_count_one_one_ad7671: "我要的布里根人你都带来了吗？\n"
  npc_override_moc_para01_eden_100_111_i_once_got_lost_maze_407451: "天哪，他脸上的表情是无价的！\n"
  npc_override_moc_para01_eden_100_111_i_shoud_investigate_abou_0a0fb6: "我的主人接受了这个请求，只是因为它太疯狂了。"
  npc_override_moc_para01_eden_100_111_i_think_s_what_true_809448: "^ff0000时间就是金钱新手！^000000\n"
  npc_override_moc_para01_eden_100_111_i_think_you_should_rest_19077d: "欢呼！\n"
  npc_override_moc_para01_eden_100_111_i_think_you_suitable_req_5080be: "你做得很好！"
  npc_override_moc_para01_eden_100_111_i_thought_eden_group_bus_cff7ab: "我们正忙于处理需要处理的请求。"
  npc_override_moc_para01_eden_100_111_i_try_give_you_couple_fbeee3: "我会尽力给你一些东西。"
  npc_override_moc_para01_eden_100_111_i_understand_you_i_got_2c048a: "I understand you. I got into a fight when I first met master in 莫拉 village."
  npc_override_moc_para01_eden_100_111_i_understand_you_might_w_ef6cbe: "站在我身边的那个人就是我的师父……他历尽千辛万苦修行回来了。\n"
  npc_override_moc_para01_eden_100_111_i_used_adventurer_eden_g_5efcff: "你看起来很勇敢，可以成为一名优秀的冒险家，但在我眼里你只不过是一个新手。\n"
  npc_override_moc_para01_eden_100_111_i_used_take_care_request_ad8718: "任务是清除地下水道中^FF000030 Sting^000000个怪物，以安全朝圣。\n"
  npc_override_moc_para01_eden_100_111_i_ve_recently_received_s_76c598: "I've recently received several requests from clients that need the help of Adventurers just like yourself."
  npc_override_moc_para01_eden_100_111_i_want_you_take_care_085a4b: "我要你照顾它。"
  npc_override_moc_para01_eden_100_111_i_wish_i_could_glass_bdf22b: "这是我第一次承受这么大的压力。\n"
  npc_override_moc_para01_eden_100_111_i_wonder_what_reason_beh_c47359: "师父接受了这个请求，因为他尊重那些僧人。"
  npc_override_moc_para01_eden_100_111_i_wonder_why_they_schemi_b30883: "我想知道他们为什么要策划这种^FF0000废话^000000...让我想知道他们是否知道任何关于冒险的事情。\n"
  npc_override_moc_para01_eden_100_111_ice_cave_directly_north_fced52: "这是关于一个冒险家与大狼战斗并最终建立了友谊的故事。"
  npc_override_moc_para01_eden_100_111_if_there_something_good_989dde: "作为冒险者我应该做更多的事情！\n"
  npc_override_moc_para01_eden_100_111_if_they_filed_properly_r_b2b629: "他曾经四处奔走寻找制作卡片的纸质材料。\n"
  npc_override_moc_para01_eden_100_111_if_you_find_don_t_3244a1: "你还是新手吗？"
  npc_override_moc_para01_eden_100_111_if_you_matured_enough_ne_b264b8: "使用 1、10、20 和 30 张卡片讲述有关冒险或奖杯的故事。\n"
  npc_override_moc_para01_eden_100_111_journey_lowest_floor_gla_307c55: "我认为你不适合我提出的要求。"
  npc_override_moc_para01_eden_100_111_kind_useless_there_witho_a1b51a: "有传言说，如果你在那个迷宫中迷路，你就会变成那里的怪物之一。\n"
  npc_override_moc_para01_eden_100_111_kindness_pass_4d06d6: "The ^FF0000kindness pass^000000?"
  npc_override_moc_para01_eden_100_111_kindness_pass_insufficie_097a05: "^FF0000善意通行证^000000不足。\n"
  npc_override_moc_para01_eden_100_111_lets_give_good_lesson_su_212098: "Lets give a good lesson for sure."
  npc_override_moc_para01_eden_100_111_lets_real_request_after_a648e9: "从海龟岛或格拉斯海姆的怪物那里很容易找到。\n"
  npc_override_moc_para01_eden_100_111_loli_ruri_hunting_niflhe_94d142: "Loli Ruri Hunting - Niflheim"
  npc_override_moc_para01_eden_100_111_majoururos_easy_hunt_so_e57bd2: "这不是一次轻松的旅程，但将是一次很好的经历。\n"
  npc_override_moc_para01_eden_100_111_make_good_use_72a538: "好好利用它。\n"
  npc_override_moc_para01_eden_100_111_make_request_list_you_so_d64173: "我想这才是真正的大师应该有的样子吧？\n "
  npc_override_moc_para01_eden_100_111_makes_me_feel_weird_bad_79af7c: "僵尸囚犯会掉落它们，它们看起来很有用，但实际上它们有点毫无价值。\n"
  npc_override_moc_para01_eden_100_111_master_accepted_request_398508: "你听说过和尚朝圣吗？"
  npc_override_moc_para01_eden_100_111_master_decided_adventure_4285f5: "Master认为冒险者的安全很重要，因为许多新的请求都是危险的。\n"
  npc_override_moc_para01_eden_100_111_master_rohter_i_traveled_5186e6: "罗特大师和我深入飞船，与名为^FF0000Drake^000000的怪物战斗。"
  npc_override_moc_para01_eden_100_111_master_s_guild_dismissed_9da707: "^FF0000无尽的塔^000000在海里的某个地方。"
  npc_override_moc_para01_eden_100_111_master_started_out_as_po_1dd19f: "从那时起，他就开始对弱小的冒险者刻薄……\n"
  npc_override_moc_para01_eden_100_111_memory_girl_important_pl_45e8ab: "^DA26DA漂亮女孩流浪者^000000正在向克魔岛请求这个。\n"
  npc_override_moc_para01_eden_100_111_memory_girl_important_pl_aac8f6: "女生的记忆力很重要！"
  npc_override_moc_para01_eden_100_111_monk_pilgrimage_seeks_pr_cc8d36: "您刚刚完成一个请求。"
  npc_override_moc_para01_eden_100_111_monk_s_pilgrimage_destin_b48518: "修道士的朝圣目的地位于格拉斯海姆城堡地下洞穴的二楼。"
  npc_override_moc_para01_eden_100_111_msg_3a52ce: "^000000。\n"
  npc_override_moc_para01_eden_100_111_msg_5bab61: "?"
  npc_override_moc_para01_eden_100_111_msg_93fcbf: "我只与基础级别^FF0000100 - 110^000000 冒险家打交道。\n"
  npc_override_moc_para01_eden_100_111_msg_c77c95: "只要去那里把野兽带走就可以了。\n"
  npc_override_moc_para01_eden_100_111_msg_da39a3: "...\n"
  npc_override_moc_para01_eden_100_111_must_very_tough_such_str_a82dcc: "您刚刚完成一个请求。"
  npc_override_moc_para01_eden_100_111_my_master_accepted_reque_865304: "他想知道美杜莎头上的蛇到底是蛇还是花哨的头发……\n"
  npc_override_moc_para01_eden_100_111_my_surprise_beast_got_ba_38a56e: "^8008F8我知道是杀还是被杀。^000000\n"
  npc_override_moc_para01_eden_100_111_natural_more_accidents_n_deb37a: "他们希望我们能减少探险营地周围的怪物。\n"
  npc_override_moc_para01_eden_100_111_nightmare_terror_hunting_77cae5: "Nightmare Terror Hunting"
  npc_override_moc_para01_eden_100_111_no_i_don_t_mind_d54f79: "No I don't mind!"
  npc_override_moc_para01_eden_100_111_no_time_make_badge_advan_62e8c0: "对您满足标准要求的能力的评估即将完成。\n"
  npc_override_moc_para01_eden_100_111_novel_novel_please_clear_6c5b15: "冒险很重要，但休息也很重要。\n"
  npc_override_moc_para01_eden_100_111_now_she_blames_deleters_80d6f1: "这次袭击毁了他们的舞蹈，最终毁了他们的关系，因为男孩指责女孩受到了袭击。\n"
  npc_override_moc_para01_eden_100_111_obviously_they_re_snakes_fba329: "这是艾伯塔省一位发型设计师的请求。"
  npc_override_moc_para01_eden_100_111_oh_boy_look_his_face_2960b4: "有一次，我和师父去科摩多西边的山洞里，看到了美杜莎怪物……\n"
  npc_override_moc_para01_eden_100_111_oh_how_long_been_ec0c5b: "我想我应该再跟他谈谈……明天再来吧！\n"
  npc_override_moc_para01_eden_100_111_oh_no_please_don_t_37e5b3: "哦不...请不要这样做。"
  npc_override_moc_para01_eden_100_111_oh_you_re_back_safely_aee69c: "哈哈哈！\n"
  npc_override_moc_para01_eden_100_111_ok_i_ll_help_9e9b0a: "Ok, I'll help."
  npc_override_moc_para01_eden_100_111_ok_i_ve_got_story_3d1327: "好的，我有一个故事给你，以换取善意通行证。\n"
  npc_override_moc_para01_eden_100_111_okay_you_doing_best_you_8570f4: "这让我感觉很奇怪。"
  npc_override_moc_para01_eden_100_111_once_i_found_secret_rout_78c919: "我以为我会一直在兜圈子，直到我最终找到了答案。\n"
  npc_override_moc_para01_eden_100_111_one_fine_windy_day_i_69e94c: "我想你并不像我想象的那样是个磨砂膏。\n"
  npc_override_moc_para01_eden_100_111_one_time_master_i_went_254c52: "那天我就下定决心，我要成为最好的冒险家。\n"
  npc_override_moc_para01_eden_100_111_one_what_cbb180: "One what?"
  npc_override_moc_para01_eden_100_111_oops_i_ate_all_okay_f2ca8f: "收到来自格拉斯海姆的所有请求后，一次清除一个就好了。\n"
  npc_override_moc_para01_eden_100_111_oops_its_actually_tendri_28ae20: "哎呀！"
  npc_override_moc_para01_eden_100_111_outbound_space_mysteriou_17ebbc: "米德加德远征队收到了许多请求。\n"
  npc_override_moc_para01_eden_100_111_people_who_been_ice_dung_a3eb45: "参观冰冷的冰地牢一定很艰难。\n"
  npc_override_moc_para01_eden_100_111_person_standing_next_me_00ce6d: "我的主人最讨厌优柔寡断的人。\n"
  npc_override_moc_para01_eden_100_111_pilgrimage_monastery_und_c68747: "不管怎样，这个请求是为了清除地下水道中的阿诺利亚人，为安全朝圣让路。\n"
  npc_override_moc_para01_eden_100_111_pinguicula_one_first_mon_5fbcb3: "Pinguicula 是冒险者踏入灰真空时首先遇到的怪物之一。"
  npc_override_moc_para01_eden_100_111_please_clear_anubis_th_f_f150d3: "那里的怪物似乎十分猖獗。\n"
  npc_override_moc_para01_eden_100_111_please_clear_arclouse_1b841a: "您刚刚完成一个请求。"
  npc_override_moc_para01_eden_100_111_please_clear_ice_titan_i_ce3e4b: "去过冰之迷宫的人都说那里有吵闹的怪物打扰他们的参观。"
  npc_override_moc_para01_eden_100_111_please_clear_luciola_ves_939197: "请清除 ^FF000030 Pinguicula^000000。\n"
  npc_override_moc_para01_eden_100_111_please_clear_medusa_west_b02e49: "请清除科摩多西部洞穴中的^FF000030美杜莎^000000。\n"
  npc_override_moc_para01_eden_100_111_please_clear_snowier_sec_ce5181: "粗重的呼吸、缺乏安全感的眼睛、寒冷……这不是一件容易的事，所以要让自己暖和起来。\n"
  npc_override_moc_para01_eden_100_111_please_come_back_after_c_0099a4: "现在它成为一个问题。\n"
  npc_override_moc_para01_eden_100_111_please_come_back_me_if_6e9b03: "如果您收到更多善意通行证，请回来找我！\n"
  npc_override_moc_para01_eden_100_111_please_give_me_pass_put_8083f1: "请给我一张通行证，并将您的手放入袋子中进行挑选。\n"
  npc_override_moc_para01_eden_100_111_please_hurry_up_we_need_e24872: "还没找到 50 Brigan 吗？"
