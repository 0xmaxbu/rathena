  npc_override_moc_para01_eden_121_130_i_just_decided_make_requ_d9108f: "I just decided to make a request by myself because no one is in charge and everyone is busy. Thanks for the help."
  npc_override_moc_para01_eden_121_130_i_know_request_nameless_391cf9: "I know the request to Nameless Island is not easy but I will be happy if you join again."
  npc_override_moc_para01_eden_121_130_i_like_creature_because_976ebd: "I do not like that creature not because Aigu doesn't like them... How dare you? Who is punishing whom?"
  npc_override_moc_para01_eden_121_130_i_like_deal_deal_please_aa2f60: "I do not like it but a deal is a deal. Please come back after clearing monsters in the places where Aigu asked to search."
  npc_override_moc_para01_eden_121_130_i_m_nice_kind_af2ff0: "I'm not the nice kind."
  npc_override_moc_para01_eden_121_130_i_m_only_talking_base_50c20e: "I'm only talking to base level ^FF0000121-130^000000 adventurers."
  npc_override_moc_para01_eden_121_130_i_made_shelter_someone_i_d4fe22: "I made a shelter for someone I am looking for and lost adventurers. I want to know which adventurer has been there."
