  npc_override_moc_para01_56-70_i_admired_beach_izlude_e_d32c21: "I have admired the beach of Izlude, ever since I was born."
  npc_override_moc_para01_56-70_i_am_pharmacist_i_am_afd24b: "I am a pharmacist and I am having a hard time getting special ingredients lately."
  npc_override_moc_para01_56-70_i_am_so_intrigued_story_9d7a23: "I am so intrigued with that story that I'm trying to prove that it can be true."
  npc_override_moc_para01_56-70_i_done_pretty_well_missi_1dacb2: "I have done pretty well for the mission. Should I report it now?"
  npc_override_moc_para01_56-70_i_figured_if_i_make_f91b7f: "But, I figured that if I make swim fins, it will be great for his confidence~!"
  npc_override_moc_para01_56-70_i_finally_tracked_down_f_a101e3: "I finally tracked down the fact that it was a Merman, not a Mermaid!"
  npc_override_moc_para01_56-70_i_heard_there_live_dolls_ecc569: "I heard that there are live dolls called Marionettes. Can you hunt 30 Marionettes for me? And also bring 30 Golden Hair, those will be great materials for the new toys."
  npc_override_moc_para01_56-70_i_hope_you_hunt_flora_82c98b: "I hope you can hunt Flora and get me 40 Maneater Blossoms. You are making the world green! Be proud!"
  npc_override_moc_para01_56-70_i_instantly_thought_merm_4d06e6: "I instantly thought it was a mermaid. I was so supprised, I have studied about mermaids in whole my life."
  npc_override_moc_para01_56-70_i_need_maneater_blossom_c8484d: "I need 40 Maneater Blossom from Flora, I know Maneater Blossom is an ugly flower, but still it is a plant."
  npc_override_moc_para01_56-70_i_plan_plant_strong_flow_0b4a1a: "I plan to plant strong flowers in the Morocc desert so the soil gets better."
  npc_override_moc_para01_56-70_i_successfully_accepted_7f9998: "I have successfully accepted the mission. I have to come back and confirm my work after I complete the mission."
  npc_override_moc_para01_56-70_i_want_teach_him_as_bbe35b: "I want to teach him, but as you know I am a blacksmith, a far cry from swimming! Hehe."
  npc_override_moc_para01_56-70_if_i_make_new_toy_f591a1: "But if I can make new toy concepts, like living toys, it will be ground breaking."
  npc_override_moc_para01_56-70_if_you_interested_please_b281a6: "If you are interested, please hunt 30 Mummies and bring 30 Rotten Bandages. You can find them in the Pyramid West of Morocc."
  npc_override_moc_para01_56-70_if_you_say_magic_words_91b2a4: "If you say the magic words and swing the wand, it will make your wishes come true."
  npc_override_moc_para01_56-70_izlude_lost_dream_mermai_9b316b: "-- Izlude 'The Lost dream mermaid' --"
  npc_override_moc_para01_56-70_lots_missions_such_as_mo_0b995b: "Lots of missions such as a Monster Hunting, Delivery Goods, Finding People."
  npc_override_moc_para01_56-70_magic_wand_you_heard_abo_843bcd: "Magic wand! Have you heard about it? It is an incredible wand!"
