  npc_override_moc_para01_eden_121_130_however_another_obstacle_6c5455: "However that is another obstacle. A deal is prior to personal interest anytime. So clear Lady Solace."
  npc_override_moc_para01_eden_121_130_i_am_interested_27be24: "I am interested."
