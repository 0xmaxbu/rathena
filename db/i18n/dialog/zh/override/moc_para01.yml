  npc_override_moc_para01_2012_headgears_accumulating_energy_crys_b314d1: "Accumulating Energy Crystal has already begun. I am sorry but it is impossible to accumulate two different types of Energy Crystals at a time."
  npc_override_moc_para01_2012_headgears_addition_safety_ring_all_2672cd: "^FF0000In addition to the Safety Ring, all refinements and cards of the required materials will also disappear.^000000"
  npc_override_moc_para01_2012_headgears_advanced_desert_wolf_090a60: "[Advanced] Desert Wolf"
  npc_override_moc_para01_2012_headgears_adventurers_use_collecte_587c55: "Adventurers can use collected Energy Crystals for ^FF0000upgrading equipments^000000 through me."
  npc_override_moc_para01_2012_headgears_before_upgrading_your_eq_7d2e45: "Before upgrading your equipment, please listen to these ^FF0000precautions^000000."
  npc_override_moc_para01_2012_headgears_before_upgrading_your_sa_c034ae: "Before upgrading your Safety Ring, please listen to these ^FF0000precautions^000000."
  npc_override_moc_para01_2012_headgears_body_like_you_t_accumula_de680c: "With a body like that, you can't accumulate {0} Energy Crystals. You must be level {1} or your body will be harmed in the process."
  npc_override_moc_para01_2012_headgears_brochure_regarding_equip_1fee9c: "This is the brochure regarding the equipment upgrade that our Energy Crystal research association provides. Please take a look around."
  npc_override_moc_para01_2012_headgears_carrying_too_many_items_58f58a: "- Carrying too many items, cannot proceed. -"
  npc_override_moc_para01_2012_headgears_compression_completed_8863eb: "Compression completed."
  npc_override_moc_para01_2012_headgears_compression_very_success_b90658: "The compression was very successful."
  npc_override_moc_para01_2012_headgears_currently_waiting_collec_885f30: "Currently waiting for the {0} collection commission. Tasks in each collection can only be completed once per day."
  npc_override_moc_para01_2012_headgears_donation_i_ll_give_you_247ca1: "For the donation, I'll give you a random new headgear."
  npc_override_moc_para01_2012_headgears_ecra_institute_researche_fb401d: "ECRA is the institute that researches '^0000FFEnergy Crystals^000000' that shall be used as an alternative energy source in the Rune-Midgarts Kingdom, which suffers from a shortage of energy."
  npc_override_moc_para01_2012_headgears_energy_crystals_accumula_218cea: "Energy Crystals, accumulated through hunting monsters by my request, shall be used for my research. ^0000FFSome of them are planned to be returned to adventurers.^000000"
  npc_override_moc_para01_2012_headgears_energy_crystals_accumula_7b1ceb: "Energy Crystals are accumulated in your body when you hunt the monsters we ask you to."
  npc_override_moc_para01_2012_headgears_energy_crystals_turned_o_c3c8c0: "Energy Crystals turned out to be ^0000FFgenerated inside the bodies of some monsters^000000, and according to the research, stronger monsters generate higher-class energy crystals in their bodies."
  npc_override_moc_para01_2012_headgears_enhanced_bone_helm_54c41c: "- Enhanced Bone Helm"
  npc_override_moc_para01_2012_headgears_enhanced_corsair_1333e4: "- Enhanced Corsair"
  npc_override_moc_para01_2012_headgears_enhanced_helm_angel_154ec3: "- Enhanced Helm of Angel"
  npc_override_moc_para01_2012_headgears_enhanced_ring_flame_lord_87aa87: "- Enhanced Ring of Flame Lord"
  npc_override_moc_para01_2012_headgears_enhanced_ring_resonance_2b58de: "- Enhanced Ring of Resonance"
  npc_override_moc_para01_2012_headgears_enhanced_variant_shoes_088513: "- Enhanced Variant Shoes"
  npc_override_moc_para01_2012_headgears_error_occurred_please_fo_71c054: "An error has occurred. Please forgive me for the inconvenience."
  npc_override_moc_para01_2012_headgears_everything_seems_order_l_a02803: "Everything seems to be in order. Let's start accumulating {0} Energy Crystals. Remember to come back to me after 3 hours to get the {1} Energy Crystals."
