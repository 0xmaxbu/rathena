Body:

  npc_override_prt_fild00_acolyte_acolyte_applicant_5fdc86: "服事申请人。"
  npc_override_prt_fild00_acolyte_acolyte_applicants_7023f8: "服事申请人……？"
  npc_override_prt_fild00_acolyte_acolyte_applicants_d39fe0: "服事申请人。"
  npc_override_prt_fild00_acolyte_ah_5eceea: "啊……！"
  npc_override_prt_fild00_acolyte_ah_i_sense_you_endured_dcc648: "啊，我感觉你曾"
  npc_override_prt_fild00_acolyte_ah_you_must_one_acolyte_a1f037: "啊，你一定是服事申请人之一。我真诚地欢迎你。"
  npc_override_prt_fild00_acolyte_always_remember_thankful_d6d567: "永远记得感谢上帝，祂无时无刻不在看顾我们。"
  npc_override_prt_fild00_acolyte_always_use_your_gifts_se_a8a23e: "永远用你的恩赐来服侍祂，通过帮助他人。在混乱和困难时期，以坚定不移的信仰面对你的磨难。"
  npc_override_prt_fild00_acolyte_back_valhalla_5a886d: "从瓦尔哈拉回来，"
  npc_override_prt_fild00_acolyte_bad_all_you_ve_made_376c0a: "不错嘛，你竟然从普隆德拉一路走到这里。孩子，你叫什么名字？"
  npc_override_prt_fild00_acolyte_bad_bad_you_withstood_pe_1a46aa: "不错，不错。你很好地经受住了忏悔试炼。"
  npc_override_prt_fild00_acolyte_confessed_your_0451f9: "已经忏悔了你的"
  npc_override_prt_fild00_acolyte_destination_trial_decide_1dd659: "这次试炼的目的地将在你填写申请表后决定。"
  npc_override_prt_fild00_acolyte_farewell_5260b4: "再会。"
  npc_override_prt_fild00_acolyte_first_you_reach_least_no_87ae09: "首先，你必须达到初心者 Job 等级 9 以上，并学会所有基础技能。其次，你将接受一项忏悔试炼来克服。"
  npc_override_prt_fild00_acolyte_give_you_mission_135e22: "给你一个任务……"
  npc_override_prt_fild00_acolyte_good_i_accept_s_become_69d1cf: "很好。我接受 {0} 成为服事的意愿。你明白在成为神的仆人之前必须进行忏悔，对吗？"
  npc_override_prt_fild00_acolyte_good_lord_haven_t_you_a34ad6: "老天爷！你还没完成基础训练吗？！完成那个很重要！"
  npc_override_prt_fild00_acolyte_good_you_c0b22d: "很高兴你"
  npc_override_prt_fild00_acolyte_greetings_21e190: "你好。"
  npc_override_prt_fild00_acolyte_he_been_practicing_ascet_1a5500: "他一直在^000077普隆德拉城东北方的遗迹^000000修行苦行。"
  npc_override_prt_fild00_acolyte_he_been_practicing_ascet_9aace6: "他一直在^000077普隆德拉西北方某处的一座桥^000000附近修行苦行。"
  npc_override_prt_fild00_acolyte_he_been_practicing_ascet_a64207: "他一直在^000077普隆德拉西北方某处的一座桥^000000附近修行苦行。"
  npc_override_prt_fild00_acolyte_he_practicing_asceticism_021b73: "他正在^000077普隆德拉城东北方的遗迹^000000修行苦行。"
  npc_override_prt_fild00_acolyte_hello_there_5a8ec9: "你好呀～"
  npc_override_prt_fild00_acolyte_hey_44afd2: "嘿……"
  npc_override_prt_fild00_acolyte_hey_5a8841: "嘿。"
  npc_override_prt_fild00_acolyte_hmm_9c4d28: "嗯……"
  npc_override_prt_fild00_acolyte_how_your_practice_coming_a54150: "你的修行进展如何？我真诚地希望你在神的恩典中生活得愉快。"
  npc_override_prt_fild00_acolyte_however_i_tell_you_suite_f8c80d: "然而，我可以看出你不适合做服事。请记住你前世是谁，找到你自己的道路。"
  npc_override_prt_fild00_acolyte_huh_bfd2a5: "{0}，嗯？"
  npc_override_prt_fild00_acolyte_huh_what_brings_you_here_1e2490: "嗯？什么风把你吹来了？这里对你这样的初心者来说是非常危险的地方！"
  npc_override_prt_fild00_acolyte_huh_why_isn_t_your_32585f: "{0}，嗯？为什么你的名字不在我的名单上？"
  npc_override_prt_fild00_acolyte_i_am_proud_say_you_009eb3: "我很自豪地说，你现在已经准备好成为一名服事了！"
  npc_override_prt_fild00_acolyte_i_believe_you_ve_been_71a6c3: "我相信马雷乌西斯神父已经告诉了你很多关于服事的事情。此外，普隆德拉圣堂里有很多热心的人。"
  npc_override_prt_fild00_acolyte_i_don_t_any_replies_826678: "我没有任何回复。"
  npc_override_prt_fild00_acolyte_i_don_t_think_your_f4d2dc: "我觉得你的名字"
  npc_override_prt_fild00_acolyte_i_guess_there_s_really_30732e: "我想真的没必要让我教你太多。再说了，我相信你们这代人可能不太愿意听我这样的老人唠叨。哈哈哈～"
  npc_override_prt_fild00_acolyte_i_m_sorry_we_only_0f24c2: "很抱歉，我们只接受初心者作为转职服事的申请人。"
  npc_override_prt_fild00_acolyte_i_pray_god_hope_you_946dd4: "我会向上帝祈祷，希望你很快成为一名服事。"
  npc_override_prt_fild00_acolyte_i_send_carrier_pigeon_pr_62eb99: "我会派信鸽去普隆德拉圣堂。你回去时，那里的祭司应该已经收到我的消息了。"
  npc_override_prt_fild00_acolyte_i_send_message_sanctuary_dc39f9: "我会送消息去圣堂，确认 {0} 来见过我并完成了你的忏悔。"
  npc_override_prt_fild00_acolyte_i_sense_you_endured_past_efc20d: "我感觉你曾经历过前世。你在进入瓦尔哈拉之前一定学到了很多东西。"
  npc_override_prt_fild00_acolyte_i_sincerely_welcome_you_d258c5: "我真诚地欢迎你。"
  npc_override_prt_fild00_acolyte_i_ve_sent_carrier_pigeon_9c17fc: "我已经派信鸽送信了。希望它能安全到达……"
  npc_override_prt_fild00_acolyte_i_wait_until_25cb35: "我会等到"
  npc_override_prt_fild00_acolyte_if_you_like_come_sit_9d2a18: "如果你愿意，过来坐在这里和我一起冥想伟大的真理。上帝的威严真是令人敬畏……"
  npc_override_prt_fild00_acolyte_lastly_i_want_sincerely_24cb3c: "最后，我想真诚地祝贺你坚持完成了忏悔试炼。"
  npc_override_prt_fild00_acolyte_let_s_see_4d37ed: "让我看看……"
  npc_override_prt_fild00_acolyte_let_s_see_7d5528: "{0}？让我看看……"
  npc_override_prt_fild00_acolyte_may_god_5c1e1c: "愿上帝"
  npc_override_prt_fild00_acolyte_may_god_afb834: "愿上帝"
  npc_override_prt_fild00_acolyte_may_grace_god_brighten_y_4a9019: "愿上帝的恩典照亮你的道路，引导你完成忏悔之旅。"
  npc_override_prt_fild00_acolyte_may_grace_god_light_your_40328d: "愿上帝的恩典照亮你的道路，引导你完成忏悔之旅。"
  npc_override_prt_fild00_acolyte_may_grace_god_light_your_63c418: "愿上帝的恩典照亮你的道路，引导你完成忏悔之旅。"
  npc_override_prt_fild00_acolyte_meantime_64149e: "与此同时，"
  npc_override_prt_fild00_acolyte_menu_father_d1adc8: "神父，我想成为一名服事。:服事的要求。:随便看看。"
  npc_override_prt_fild00_acolyte_menu_yes_cd908b: "是的，神父，我愿意。:不，我撒谎了。"
  npc_override_prt_fild00_acolyte_msg_6eae3a: "……"
  npc_override_prt_fild00_acolyte_my_list_b99fa2: "不在我的名单上……"
  npc_override_prt_fild00_acolyte_my_list_hmmm_b001ab: "在我的名单上。嗯嗯……"
  npc_override_prt_fild00_acolyte_new_life_s_journey_a55106: "新生命的旅程。"
  npc_override_prt_fild00_acolyte_novice_de4787: "初心者。"
  npc_override_prt_fild00_acolyte_now_go_back_santuary_fin_342f67: "现在回圣堂去完成成为服事的仪式吧，孩子。"
  npc_override_prt_fild00_acolyte_now_venture_forth_seek_p_ee6af2: "现在，出发去寻找需要你帮助的人吧。愿上帝照亮你的道路。"
  npc_override_prt_fild00_acolyte_now_venture_forth_seek_t_45a370: "现在，出发去寻找需要你帮助的人吧。愿上帝照亮你的道路。"
  npc_override_prt_fild00_acolyte_now_what_your_name_e3e276: "那么，你叫什么名字？"
  npc_override_prt_fild00_acolyte_now_your_name_right_exce_96feca: "嗯，你的名字是 {0}，对吧？太好了，感谢你来拜访我。"
  npc_override_prt_fild00_acolyte_oh_78a2fc: "哦……"
  npc_override_prt_fild00_acolyte_oh_ho_2a847d: "哦吼……"
  npc_override_prt_fild00_acolyte_oh_i_t_find_your_230b3f: "哦？我在登记名单上找不到你的名字。"
  npc_override_prt_fild00_acolyte_oh_you_must_one_who_219b67: "哦……？你一定就是那个想成为服事的人吧。我已经收到圣堂的消息说你可能会来。"
  npc_override_prt_fild00_acolyte_oh_you_ve_come_back_a5418f: "哦，你回来了。让我看看你是否准备好服侍上帝了。让我看看……"
  npc_override_prt_fild00_acolyte_okay_i_ll_send_message_fbf3aa: "好的。我会给圣堂送消息，说你 {0} 来拜访过我了。"
  npc_override_prt_fild00_acolyte_past_life_experience_you_21f232: "前世的经历。你在进入瓦尔哈拉之前一定学到了很多东西。"
  npc_override_prt_fild00_acolyte_peace_my_son_5b2ff7: "平安，我的孩子。"
  npc_override_prt_fild00_acolyte_perhaps_you_should_retur_e187e8: "也许你应该回普隆德拉圣堂，再确认一下你的忏悔试炼目的地。"
  npc_override_prt_fild00_acolyte_please_come_back_after_f_9a8bd9: "请完成我要求的两个条件后再回来。只要你对服侍上帝和他人的愿望是真诚的，你就一定能做到。"
  npc_override_prt_fild00_acolyte_please_return_prontera_s_9721d6: "请返回普隆德拉圣堂，找负责的祭司谈谈。"
  npc_override_prt_fild00_acolyte_please_take_care_they_sh_fce1e0: "请保重。当你到达普隆德拉圣堂时，他们应该已经知道你见过我了。"
  npc_override_prt_fild00_acolyte_please_visit_father_ruba_705d0d: "请拜访 ^000077鲁巴卡巴拉神父^000000，他是普隆德拉教区的成员，然后回到这里。"
  npc_override_prt_fild00_acolyte_please_visit_father_ruba_b1ff79: "请拜访 ^000077鲁巴卡巴拉神父^000000，他是普隆德拉教区的成员，然后回到这里。他一直在^000077普隆德拉城东北方的遗迹^000000修行苦行。"
  npc_override_prt_fild00_acolyte_please_visit_father_yosu_7bedf0: "请拜访 ^000077洋介神父^000000 然后回到我这里。"
  npc_override_prt_fild00_acolyte_please_visit_father_yosu_7dbef1: "请拜访 ^000077洋介神父^000000 然后回到我这里。他一直在^000077普隆德拉西北方某处的一座桥^000000附近修行苦行。"
  npc_override_prt_fild00_acolyte_please_visit_mother_math_409152: "请拜访 ^000077玛蒂尔达修女^000000 然后回到我这里。她一直在^000077普隆德拉城西南方的梦罗克城镇^000000附近修行苦行。"
  npc_override_prt_fild00_acolyte_please_visit_mother_math_71bdb1: "请拜访 ^000077玛蒂尔达修女^000000 然后回到我这里。"
  npc_override_prt_fild00_acolyte_right_d016e9: "对吧？"
  npc_override_prt_fild00_acolyte_seems_your_name_1f25d2: "看来你的名字"
  npc_override_prt_fild00_acolyte_servant_god_ebe82d: "上帝的仆人？"
  npc_override_prt_fild00_acolyte_she_been_practicing_asce_439bda: "她一直在^000077普隆德拉城西南方的梦罗克^000000附近修行苦行。"
  npc_override_prt_fild00_acolyte_she_been_practicing_asce_c78021: "她一直在^000077普隆德拉城西南方的梦罗克城镇^000000附近修行苦行。"
  npc_override_prt_fild00_acolyte_so_what_s_your_name_02fb09: "那么你叫什么名字？"
  npc_override_prt_fild00_acolyte_still_lessons_may_come_p_ddaa43: "不过，功课可能会从你最意想不到的地方来。上帝喜欢用奇特的方式教导祂的孩子。你会明白的。"
  npc_override_prt_fild00_acolyte_there_something_89eb1e: "有什么"
  npc_override_prt_fild00_acolyte_unfortunately_i_don_t_th_839768: "不幸的是，我觉得你还没准备好成为服事。请先完成所有基础技能的学习。"
  npc_override_prt_fild00_acolyte_welcome_deep_feel_free_s_b82422: "欢迎来到深处。请随意坐下，和我一起默想上帝的信息。这个地方很美，即使危险伴随着它的宁静感……"
  npc_override_prt_fild00_acolyte_well_i_2f543a: "嗯，我会"
  npc_override_prt_fild00_acolyte_well_i_ll_send_message_2cbdb8: "嗯，我会送消息告诉他们你来拜访过我了。那么，你现在可以回普隆德拉圣堂了。"
  npc_override_prt_fild00_acolyte_well_i_welcome_you_f14a78: "嗯，我欢迎你"
  npc_override_prt_fild00_acolyte_what_be65b9: "什么？"
  npc_override_prt_fild00_acolyte_what_you_seek_ffeba9: "你在寻求什么？"
  npc_override_prt_fild00_acolyte_what_your_name_let_s_9974c2: "你叫什么名字？{0}？让我看看……啊，你在我的名单上。"
  npc_override_prt_fild00_acolyte_whatever_you_9dd7d9: "无论你是谁，"
  npc_override_prt_fild00_acolyte_whoever_you_please_take_5d5cfb: "无论你是谁，请保重。这里的怪物出人意料地强大，与它们可爱的外表相反。"
  npc_override_prt_fild00_acolyte_why_don_t_you_go_ef5a42: "你为什么不回普隆德拉圣堂再确认一下？"
  npc_override_prt_fild00_acolyte_wish_become_a20434: "希望成为"
  npc_override_prt_fild00_acolyte_wish_you_luck_your_79cf57: "祝你在"
  npc_override_prt_fild00_acolyte_wrongdoing_go_c92b48: "过错。以"
  npc_override_prt_fild00_acolyte_you_17664a: "与你同在……"
  npc_override_prt_fild00_acolyte_you_73b785: "与你同在。"
  npc_override_prt_fild00_acolyte_you_any_more_business_me_74e1f2: "你还有什么事要找我吗？！没有！现在回圣堂去！"
  npc_override_prt_fild00_acolyte_you_anything_say_because_800ece: "你有什么要说的吗？因为不幸的是对你来说，"
  npc_override_prt_fild00_acolyte_you_c09be9: "你……"
  npc_override_prt_fild00_acolyte_you_come_into_deep_here_26bc3e: "你来深处是为了训练吗？还是只是个漫游者？"
  npc_override_prt_fild00_acolyte_you_feeling_okay_today_i_e10ebb: "你今天感觉还好吗？从你的着装我可以看出你已经是服事了。你不是在开玩笑吧？"
  npc_override_prt_fild00_acolyte_you_lied_be8012: "你撒谎了？"
  npc_override_prt_fild00_acolyte_you_look_like_acolyte_ap_145600: "你看起来像服事申请人。我说得对吗？"
  npc_override_prt_fild00_acolyte_you_look_like_e00e24: "你看起来像"
  npc_override_prt_fild00_acolyte_you_must_one_4b935d: "你一定是"
  npc_override_prt_fild00_acolyte_you_one_7bbfc3: "你是"
  npc_override_prt_fild00_acolyte_you_probably_made_mistak_c441dd: "你可能搞错了。回圣堂去，和主教确认一下。"
  npc_override_prt_fild00_acolyte_you_ready_c9a0a2: "你已经准备好了。"
  npc_override_prt_fild00_acolyte_you_should_trained_more_c6b6d7: "你应该多训练一些！回去确保你达到初心者 Job 等级 9 并学会所有基础技能！"
  npc_override_prt_fild00_acolyte_you_truly_92575b: "你真的"
  npc_override_prt_fild00_acolyte_you_wanna_tell_me_ca0940: "你想告诉我什么？"
  npc_override_prt_fild00_acolyte_you_wish_become_acolyte_3d022e: "你想成为服事吗？你必须满足两个条件。"
  npc_override_prt_fild00_acolyte_your_name_ce3cd6: "你的名字是 {0}？"
  npc_override_prt_fild00_acolyte_your_name_list_you_ve_ee2707: "你的名字在名单上，你也证明了你的资格。"
  npc_override_prt_fild00_acolyte_your_trial_please_visit_4fb309: "你的试炼是拜访 ^000077洋介神父^000000 然后回到我这里。"
  npc_override_prt_fild00_acolyte_your_trial_please_visit_93fefb: "你的试炼是拜访 ^000077鲁巴卡巴拉神父^000000 然后回到我这里。"
  npc_override_prt_fild00_acolyte_your_trial_please_visit_f02e3f: "你的试炼是拜访 ^000077玛蒂尔达修女^000000 然后回到我这里。"
