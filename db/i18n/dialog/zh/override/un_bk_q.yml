Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_un_bk_q_quests_15_2_aaarghhhh_288ae6: "啊啊啊啊！！！！"
  npc_override_un_bk_q_quests_15_2_aah_i_don_t_know_1fceb2: "啊——我不知道原因，但控制室"
  npc_override_un_bk_q_quests_15_2_aahh_looking_after_wareh_089ee0: "啊啊——照看仓库真烦人。"
  npc_override_un_bk_q_quests_15_2_aarrghhhh_a299e2: "啊啊啊啊！！！"
  npc_override_un_bk_q_quests_15_2_about_last_exploration_284455: "关于最后一次探索"
  npc_override_un_bk_q_quests_15_2_above_all_i_worry_about_dfb08a: "最重要的是，我担心你一个人。"
  npc_override_un_bk_q_quests_15_2_accept_3e1999: "接受。"
  npc_override_un_bk_q_quests_15_2_access_temporary_clinic_d43c0c: "临时诊所仅限于隔离抽搐的病人。"
  npc_override_un_bk_q_quests_15_2_accident_cannot_helped_o_34dfd1: "不过，这不是一个人能阻止的意外。"
  npc_override_un_bk_q_quests_15_2_according_aures_he_blind_c53d48: "据奥雷斯说，他盲目地抓住了朱佩罗斯……"
  npc_override_un_bk_q_quests_15_2_according_biotechnology_dc98af: "据生物技术经理说，每两周至少可以收获一次"
  npc_override_un_bk_q_quests_15_2_according_chemical_subst_79d0fc: "据化学物质专家说，情况已经无望了。"
  npc_override_un_bk_q_quests_15_2_according_ebrik_e0b800: "据埃布里克说。"
  npc_override_un_bk_q_quests_15_2_according_facilities_man_aeee7b: "据设施经理说，它以后会被用作诊所。"
  npc_override_un_bk_q_quests_15_2_adventure_move_air_clean_a3111e: "搬运空气净化器的冒险？"
  npc_override_un_bk_q_quests_15_2_adventurer_delivered_air_decfb5: "冒险者还没把空气净化装置送来吗？嗯？！到了。快……空气净化装置……"
  npc_override_un_bk_q_quests_15_2_adventurer_s_blood_boili_b7062c: "冒险者的热血沸腾，想去探索各处，但没什么可做的。"
  npc_override_un_bk_q_quests_15_2_adventurers_been_deploye_6b55e6: "由于很多体质弱的研究员受伤了，已经派出了冒险者去镇压抽搐的病人。"
  npc_override_un_bk_q_quests_15_2_after_evaluating_oxygen_29181d: "在评估氧气含量过低后，机械师们开始组装空气净化装置。"
  npc_override_un_bk_q_quests_15_2_after_i_chased_after_ill_747b45: "……在那之后，我追逐了一个不确定是梦还是幻觉的幻影。"
  npc_override_un_bk_q_quests_15_2_after_long_discussion_re_ce83f6: "经过长时间的讨论，弗雷萨博士的研究人员似乎决定"
  npc_override_un_bk_q_quests_15_2_after_midnight_remaining_9a960d: "午夜过后，剩余的化学物质专家确认他们已经死亡，所有人都默哀了片刻。"
  npc_override_un_bk_q_quests_15_2_after_silently_working_s_2014c7: "在默默工作了数天之后，生物工程师带来了好消息。"
  npc_override_un_bk_q_quests_15_2_agree_help_4d4d65: "同意帮忙。"
  npc_override_un_bk_q_quests_15_2_ah_617d80: "啊……"
  npc_override_un_bk_q_quests_15_2_ah_971301: "啊……"
  npc_override_un_bk_q_quests_15_2_ah_ah_c337de: "啊……啊……"
  npc_override_un_bk_q_quests_15_2_ah_ah_chief_director_exp_459e9e: "啊？！啊！！这次实验的主持者是^0000FF罗娜·弗雷萨^000000。"
  npc_override_un_bk_q_quests_15_2_ah_ah_fresa_i_met_5930d1: "啊！啊！弗雷萨？我在全体会议上见过她几次。"
  npc_override_un_bk_q_quests_15_2_ah_ah_one_two_three_19f310: "啊——一、二、三——测试——测试——"
  npc_override_un_bk_q_quests_15_2_ah_air_cleaning_unit_doe_08f00b: "啊，空气净化装置不属于这里。"
  npc_override_un_bk_q_quests_15_2_ah_al_up_there_might_a5a063: "啊！那边的阿尔可能知道。去找阿尔吧。"
  npc_override_un_bk_q_quests_15_2_ah_also_51a0c2: "啊，还有……"
  npc_override_un_bk_q_quests_15_2_ah_ba60a0: "啊，那个……？"
  npc_override_un_bk_q_quests_15_2_ah_come_seems_there_lot_90e981: "啊！请进。今天早上播报之后，来访者似乎很多。"
  npc_override_un_bk_q_quests_15_2_ah_course_s_hehehehe_5681aa: "啊，当然不是。不是的，呵呵呵呵。"
  npc_override_un_bk_q_quests_15_2_ah_cozy_snug_fe_el_b880b7: "啊——这种温暖又舒适的感……觉……"
  npc_override_un_bk_q_quests_15_2_ah_dr_fresa_sent_you_8187f6: "啊！是弗雷萨博士派你来检查幸存者分配情况的吗？"
  npc_override_un_bk_q_quests_15_2_ah_f5ad63: "……啊……"
  npc_override_un_bk_q_quests_15_2_ah_geez_there_no_other_305861: "啊，真是的！明明没有别的问题，他为什么说头晕？"
  npc_override_un_bk_q_quests_15_2_ah_got_hit_again_my_e22585: "啊……又被打中了。我的……滋滋……好痛……滋滋……"
  npc_override_un_bk_q_quests_15_2_ah_grape_good_i_want_d2b28f: "啊……葡萄真好吃，我还想再吃。他们是不是说每两周可以收获一次？"
  npc_override_un_bk_q_quests_15_2_ah_he_s_starving_being_609e4e: "啊……他不是在挨饿吧？他是不是变虚弱了？嗯？"
  npc_override_un_bk_q_quests_15_2_ah_i_m_going_get_42cd9b: "啊！这个开着吗？开太久会被骂的……"
  npc_override_un_bk_q_quests_15_2_ah_no_one_founders_janet_f5b646: "啊，不。其中一位创始人，珍妮特·泽特也知道此事。"
  npc_override_un_bk_q_quests_15_2_ah_s_just_rumor_rumor_a6a962: "啊！那只是谣言！谣言！！"
  npc_override_un_bk_q_quests_15_2_ah_so_fresa_you_say_488976: "啊！是吗？你说弗雷萨？我的部门被调来这里还没多久。"
  npc_override_un_bk_q_quests_15_2_ah_sorry_i_go_work_b37ce2: "啊……抱歉。我得去工作了。有空的时候我会多做一些。"
  npc_override_un_bk_q_quests_15_2_ah_tell_fresa_your_way_024afa: "啊！你顺路告诉弗雷萨一声，我们正在按照应急规程检查防空掩体内的有害物质。"
  npc_override_un_bk_q_quests_15_2_ah_test_test_oh_works_7fb761: "啊——测试——测试——哦……能用？"
  npc_override_un_bk_q_quests_15_2_ah_thinking_like_isn_t_1dd89f: "……啊，想这种事不适合我。"
  npc_override_un_bk_q_quests_15_2_ah_what_s_important_e94d83: "啊！那不重要。"
  npc_override_un_bk_q_quests_15_2_ah_what_should_i_should_0424d2: "啊……我该怎么办……货物大部分都搬完了，我是不是该走了？"
  npc_override_un_bk_q_quests_15_2_ah_yes_kid_he_follow_6aac43: "啊，是的。那孩子总是烦人地跟着我。"
  npc_override_un_bk_q_quests_15_2_ah_you_adventurer_who_s_0d61d6: "啊！你就是来帮忙搬运新造空气净化装置的冒险者吗？"
  npc_override_un_bk_q_quests_15_2_ah_you_adventurer_who_s_226b54: "啊？！你就是运送空气净化装置的冒险者？"
  npc_override_un_bk_q_quests_15_2_ah_you_here_isn_t_7fb094: "啊！你来了。掩体内部是不是有点复杂？我拜托你的那件事……"
  npc_override_un_bk_q_quests_15_2_ah_you_member_atnad_exca_90bfd3: "啊。你是阿特纳德发掘队的成员。"
  npc_override_un_bk_q_quests_15_2_ah_you_re_adventurer_you_bf5da1: "啊！！你就是那个冒险者。你可以去农场看看。"
  npc_override_un_bk_q_quests_15_2_aha_indeed_so_4c9984: "啊哈！果然如此。"
  npc_override_un_bk_q_quests_15_2_aha_now_i_think_tatio_528e33: "啊哈。现在我想起来了，塔提欧也不是核心项目的成员，所以和我一起在研究设施这里。"
  npc_override_un_bk_q_quests_15_2_ahh_why_did_i_travel_9704de: "啊啊……我为什么要来这里……"
  npc_override_un_bk_q_quests_15_2_air_raid_shelter_residen_78cfc0: "防空掩体的居民们正在举办一个小型派对，庆祝收获成功。"
  npc_override_un_bk_q_quests_15_2_air_raid_shelter_so_larg_9ade65: "防空掩体太大了，我完全不知道他们在哪里，但多亏了这一点，我和一些冒险者成了朋友，尤其是卡斯尔和布拉特。"
  npc_override_un_bk_q_quests_15_2_all_audible_information_b8d089: "记忆记录中的所有音频信息已播放完毕。"
  npc_override_un_bk_q_quests_15_2_all_letters_sent_back_be_e91cbb: "所有的信件都因为地址不清被退回了！"
  npc_override_un_bk_q_quests_15_2_all_sorts_documents_offi_117975: "各种文件和办公用品堆成了一堆。"
  npc_override_un_bk_q_quests_15_2_all_traces_place_erased_bf88fe: "^FF0000如果你回到原来的时间，这个地方的所有痕迹都会被抹去。^000000"
  npc_override_un_bk_q_quests_15_2_alright_all_ready_563692: "好了，准备完毕。"
  npc_override_un_bk_q_quests_15_2_alright_go_back_bb6da1: "好了。回去吧。"
  npc_override_un_bk_q_quests_15_2_alright_let_s_move_cargo_1ee280: "好了——先把货物搬到Z-2区。"
  npc_override_un_bk_q_quests_15_2_alright_then_034971: "那好吧……"
  npc_override_un_bk_q_quests_15_2_also_if_you_find_out_334aba: "还有，如果你查到了什么就告诉我。不需要告诉其他人。"
  npc_override_un_bk_q_quests_15_2_also_one_descendants_ver_d80078: "也是维鲁斯城的后裔之一。"
  npc_override_un_bk_q_quests_15_2_although_i_did_make_some_f2a41e: "虽然我确实做了一些准备。"
  npc_override_un_bk_q_quests_15_2_although_i_think_he_safe_46fc5b: "虽然我觉得他会没事的……你能帮我找找他在哪儿吗？他大概是跑进那边的废墟了……"
  npc_override_un_bk_q_quests_15_2_although_might_uncomfort_0aa132: "虽然坐在公司的马桶上可能不太舒服。"
  npc_override_un_bk_q_quests_15_2_although_most_data_been_bc4a3c: "虽然大部分数据都因意外丢失了……"
  npc_override_un_bk_q_quests_15_2_although_my_childhood_me_b7fa47: "虽然那只是我的童年回忆，但祖父们有很多秘密。"
  npc_override_un_bk_q_quests_15_2_although_open_verus_city_2225b2: "虽然维鲁斯城已经开放，但你仍然想要保护它……我明白了。"
  npc_override_un_bk_q_quests_15_2_although_some_these_find_139c8a: "虽然其中一些发现重复了相同的内容。"
  npc_override_un_bk_q_quests_15_2_although_there_small_pro_694f85: "虽然出了个小问题——机械师弄坏了一棵葡萄树。"
  npc_override_un_bk_q_quests_15_2_although_underground_bun_2125bd: "虽然是个地下掩体，但这规模可真不是闹着玩的！"
  npc_override_un_bk_q_quests_15_2_although_unfortunate_acc_75f68e: "尽管一场不幸的事故把它变成了现在这个样子。"
  npc_override_un_bk_q_quests_15_2_although_we_operated_mos_a8d8c8: "虽然我们主要是作为客户和执行者之间的中间人运作的。"
  npc_override_un_bk_q_quests_15_2_always_honest_his_feelin_129aad: "始终坦率地表达自己的感情，始终如一……"
  npc_override_un_bk_q_quests_15_2_am_i_generous_d5ddf1: "我是不是很大方？"
  npc_override_un_bk_q_quests_15_2_amazing_427497: "太神奇了！！！"
  npc_override_un_bk_q_quests_15_2_amazing_there_bugs_gnaw_9ada64: "居然有能啃食金属的虫子，太神奇了！不过它们一定是很宝贵的蛋白质来源，营养也很丰富！"
  npc_override_un_bk_q_quests_15_2_amusing_see_those_two_to_dc07d6: "看到那两个人在一起真有意思。"
  npc_override_un_bk_q_quests_15_2_annoying_clean_up_eed027: "打扫起来真麻烦……"
  npc_override_un_bk_q_quests_15_2_another_female_voice_ah_50290c: "（另一个女声）啊……我应该一边吃炸鸡喝啤酒一边看这个才对……滋滋——"
  npc_override_un_bk_q_quests_15_2_anyway_7479d2: "不管了……"
  npc_override_un_bk_q_quests_15_2_anyway_9438d6: "总之！！"
  npc_override_un_bk_q_quests_15_2_anyway_adventurer_assuri_c3fbe5: "总之，冒险者～可靠又最棒！"
  npc_override_un_bk_q_quests_15_2_anyway_current_number_us_6ba1fb: "总之，我们设施管理员目前的人数有^FF0000{0}^000000人。"
  npc_override_un_bk_q_quests_15_2_anyway_i_enjoy_grape_you_a8d920: "总之，我会好好享用你送来的葡萄。这是报酬。"
  npc_override_un_bk_q_quests_15_2_anyway_i_record_content_c81c11: "总之我会把内容另作记录，然后交给那位老人。"
  npc_override_un_bk_q_quests_15_2_anyway_isn_t_secretary_m_34de05: "总……总之，那个秘书不就是这次事件的主谋吗？"
  npc_override_un_bk_q_quests_15_2_anyway_seems_everybody_h_357b65: "总之大家好像都到了，我们进去吧。"
  npc_override_un_bk_q_quests_15_2_anyway_since_you_permitt_98f096: "总之，既然你已经获得许可，从今往后可以自由出入。"
  npc_override_un_bk_q_quests_15_2_anyway_thanks_i_prepared_3c087c: "总之谢了。我准备了这些作为报酬。"
  npc_override_un_bk_q_quests_15_2_anyway_we_received_air_c_d13970: "总之我们已收到空气净化装置。"
  npc_override_un_bk_q_quests_15_2_anyway_why_did_you_come_4158b1: "总之，你来做什么？"
  npc_override_un_bk_q_quests_15_2_anyway_young_lady_3d4110: "总之那位年轻女士……"
  npc_override_un_bk_q_quests_15_2_apparently_related_havin_a7433c: "显然和外出有关。"
  npc_override_un_bk_q_quests_15_2_apparently_some_contamin_4d478f: "显然有某种污染物进入了防空掩体。"
  npc_override_un_bk_q_quests_15_2_area_currently_open_town_63ee0b: "目前开放的区域是城镇和广场。"
  npc_override_un_bk_q_quests_15_2_aren_t_you_refreshing_9f06e9: "你可真是神清气爽啊！！"
  npc_override_un_bk_q_quests_15_2_argh_another_convulsing_7bf5fa: "啊啊！！又一个抽搐患者。"
  npc_override_un_bk_q_quests_15_2_argh_e047e4: "啊啊！！！"
  npc_override_un_bk_q_quests_15_2_argh_i_told_you_scribble_0dab2d: "啊啊——我说过别装睡在地上乱画了吧。"
  npc_override_un_bk_q_quests_15_2_arwhat_why_didn_t_you_7277e1: "啊什么！！你怎么没带来。现在去拿来，听见没？"
  npc_override_un_bk_q_quests_15_2_as_adventurer_who_eats_p_30caa4: "作为一个和干活一样能吃喝玩乐的冒险者，我实在受不了这种坐不住的感觉。呃。"
  npc_override_un_bk_q_quests_15_2_as_collecting_laboratori_244a8b: "关于收集实验室的记忆记录，我们决定每天只做一次，对吧？"
  npc_override_un_bk_q_quests_15_2_as_collecting_research_f_7e521f: "关于收集研究设施的记忆记录，我们决定每天只做一次，对吧？"
  npc_override_un_bk_q_quests_15_2_as_expected_51d50d: "果然……"
  npc_override_un_bk_q_quests_15_2_as_i_hope_somebody_remem_a60853: "因为我也希望有人能记住我们本来的样子。"
  npc_override_un_bk_q_quests_15_2_as_i_thought_i_am_acf8c8: "果然不出我所料。至少他还安全，这让我放心了。如果方便的话，你能也帮我找找同事桑尼·金吗？"
  npc_override_un_bk_q_quests_15_2_as_you_know_there_infect_ac7d1a: "如你所知，有些感染者突然出现了奇怪的现象……"
  npc_override_un_bk_q_quests_15_2_as_you_try_eject_memory_383d1b: "当你试图弹出记忆记录时，连接部件发出咔嚓一声断裂，恢复了拆解状态。"
  npc_override_un_bk_q_quests_15_2_as_you_wish_3a6b51: "随你便。"
  npc_override_un_bk_q_quests_15_2_as_you_wish_dafe43: "如你所愿。"
  npc_override_un_bk_q_quests_15_2_as_your_working_excavati_6217f5: "还有，既然你在发掘队工作，^4d4dff去问问关于上一次探索的事^000000。"
  npc_override_un_bk_q_quests_15_2_ask_if_safe_5468a4: "询问是否安全"
  npc_override_un_bk_q_quests_15_2_ate_you_check_minute_7fe12a: "……喂！你能帮我看一下这个吗？"
  npc_override_un_bk_q_quests_15_2_atk_matk_if_helmet_refin_00e62c: "ATK和MATK + 50。如果头盔精炼度为9，还有MSP + 50%、MHP + 10%的效果。"
  npc_override_un_bk_q_quests_15_2_atnad_555dda: "……阿特纳德？"
  npc_override_un_bk_q_quests_15_2_atnad_excavators_permitt_74388b: "阿特纳德发掘队成员可以进入。"
  npc_override_un_bk_q_quests_15_2_atnad_lasse_atnad_great_06a2d9: "而阿特纳德就是拉塞·阿特纳德——阿特纳德博士的曾祖父。"
  npc_override_un_bk_q_quests_15_2_attacking_you_juperos_al_9d8b14: "在朱培雷奥斯攻击你完全是因为我想那么做。"
  npc_override_un_bk_q_quests_15_2_aures_secretary_giving_e_4e8625: "奥雷斯和秘书露出了尴尬的表情。"
  npc_override_un_bk_q_quests_15_2_baang_4eb4a5: "——砰——"
  npc_override_un_bk_q_quests_15_2_bad_proposition_honestly_4b5df4: "不是个坏提议。说实话，这是个好机会。"
  npc_override_un_bk_q_quests_15_2_bang_cb5bc9: "——砰——"
