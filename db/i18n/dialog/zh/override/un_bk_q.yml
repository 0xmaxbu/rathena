  npc_override_un_bk_q_quests_15_2_i_count_you_fc49e4: "我就指望你了。"
  npc_override_un_bk_q_quests_15_2_i_decide_report_directly_91efb6: "我会通过你来决定是否直接报告。"
  npc_override_un_bk_q_quests_15_2_i_did_die_because_i_5b1b11: "我没有死，因为我是由机器构成的，所以我只是静静地看着维鲁斯。"
