  npc_override_un_bk_q_quests_15_2_i_hate_these_access_prot_ee8fc3: "我讨厌这些访问协议。"
  npc_override_un_bk_q_quests_15_2_i_haven_t_been_able_c01fe9: "因为一直在逃跑，我什么都吃不下。一整天！我发现了这些吃金属的虫子。"
  npc_override_un_bk_q_quests_15_2_i_haven_t_been_bewildere_b13227: "之前没见过这么同时抽搐的患者……"
