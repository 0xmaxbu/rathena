  npc_override_un_bk_q_quests_15_2_i_look_around_area_you_c0b6a0: "我会在这附近找找。你不用带他回来。虽然是见习期，他应该知道怎么自己干活！你找到他的时候告诉我一声他在哪儿就行了。"
