  npc_override_un_bk_q_quests_15_2_i_don_t_think_there_3a4485: "我不认为我还有什么时间了……"
  npc_override_un_bk_q_quests_15_2_i_don_t_want_die_2f140a: "……我不想死。呜呜……"
  npc_override_un_bk_q_quests_15_2_i_don_t_want_leave_e799cf: "我不想把这种东西留在记录里……"
  npc_override_un_bk_q_quests_15_2_i_don_t_want_like_9ca7f7: "我不想变得像他们那样！！"
  npc_override_un_bk_q_quests_15_2_i_done_if_i_knew_daee37: "如果我知道你是拉塞的后裔，我就不会那么做了。"
  npc_override_un_bk_q_quests_15_2_i_expecting_you_bring_ba_7f76b9: "我期待着你能带回很多有趣的东西。"
  npc_override_un_bk_q_quests_15_2_i_feel_great_evil_design_8aedef: "我从这个部件上感受到一股巨大的恶意。"
  npc_override_un_bk_q_quests_15_2_i_feel_guilt_even_though_aa4eb5: "尽管为了生存我把那些人都化为了灰烬，但我并不感到愧疚。"
  npc_override_un_bk_q_quests_15_2_i_feel_lot_sympathy_thou_501fcf: "不过我确实感到很同情。看起来有很多人在把这次爆炸归咎于弗雷萨。"
