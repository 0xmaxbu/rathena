  npc_override_un_bk_q_quests_15_2_i_guess_we_no_choice_5fe0a4: "我想我们只能尽可能多地收集信息了？"
  npc_override_un_bk_q_quests_15_2_i_guess_you_know_results_9e1d96: "我猜你知道外面探索队的结果了吧？我打算到外面去生活。"
