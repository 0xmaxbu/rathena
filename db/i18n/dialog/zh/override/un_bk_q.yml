  npc_override_un_bk_q_quests_15_2_ha_old_man_ea33e5: "哈。那个老头……"
  npc_override_un_bk_q_quests_15_2_ha_person_1a996b: "哈……人……"
  npc_override_un_bk_q_quests_15_2_haa_e750b4: "哈啊……"
  npc_override_un_bk_q_quests_15_2_haa_i_been_cleaning_cont_8a8fc0: "哈啊——我已经在打扫控制室好几天了。"
  npc_override_un_bk_q_quests_15_2_haa_should_i_stopped_tho_06f4a7: "哈啊——我是不是应该拦住那些离开掩体的人？"
  npc_override_un_bk_q_quests_15_2_haaa_60d297: "哈啊！"
  npc_override_un_bk_q_quests_15_2_hah_our_research_goals_c_e499ad: "哈！我们的研究目标不能被发现。这是你我之间的秘密！"
  npc_override_un_bk_q_quests_15_2_haha_isn_t_awkward_0b2958: "哈哈……这不太尴尬吗？"
  npc_override_un_bk_q_quests_15_2_haha_you_adventurer_i_am_1b9b66: "哈哈，你是冒险者吗？我是格里兹·格里尔斯！一个喜欢冒险的记者。"
  npc_override_un_bk_q_quests_15_2_hahahahaha_s_what_you_th_a417bd: "哈哈哈哈——你是这么想的？没人像你一样，阿特纳德。你是不是——滋滋——"
  npc_override_un_bk_q_quests_15_2_happens_right_fa1f1e: "常有的事。对吧？"
  npc_override_un_bk_q_quests_15_2_hasn_t_been_awhile_since_42085d: "人们把它说成某种未知的机械文明、科学力量的产物，已经闹腾了好一阵子了吧？"
  npc_override_un_bk_q_quests_15_2_he_actually_remembers_th_0dfba6: "他居然还记得家里有那样的东西？"
  npc_override_un_bk_q_quests_15_2_he_convulsing_like_infec_1b6420: "他像感染者一样在抽搐。"
  npc_override_un_bk_q_quests_15_2_he_never_come_here_himse_9becc9: "他本人是不会来这里的吧？"
  npc_override_un_bk_q_quests_15_2_he_one_who_started_work_acb91a: "他是最先开始这项工作的人，所以细节去问他。"
  npc_override_un_bk_q_quests_15_2_he_out_go_back_ernon_928852: "他不太清醒。回埃尔农那里去吧，话已经带到了。"
  npc_override_un_bk_q_quests_15_2_he_probably_no_problem_e8aa95: "他应该不会有问题。"
  npc_override_un_bk_q_quests_15_2_he_s_looking_his_roots_0de5d5: "他在寻根。"
  npc_override_un_bk_q_quests_15_2_he_seems_shocked_out_go_7473a3: "他看起来很震惊，不太清醒。回埃尔农那里去吧，话已经带到了。"
  npc_override_un_bk_q_quests_15_2_he_started_sing_about_ar_ea660d: "他一到这里就开始滔滔不绝地谈论建筑风格，所以他应该在这附近。拜托你了。"
  npc_override_un_bk_q_quests_15_2_he_told_you_being_someth_3bcfb5: "他让你带什么东西回去？"
  npc_override_un_bk_q_quests_15_2_he_told_you_bring_back_ee2570: "他让你把它带回去？"
  npc_override_un_bk_q_quests_15_2_heeek_tatio_when_did_you_f2158c: "咿——！塔提欧，你、什、么、时、候来的，哈哈哈哈！！！这、这不是什么！"
  npc_override_un_bk_q_quests_15_2_hello_9b56d5: "你好。"
  npc_override_un_bk_q_quests_15_2_hello_adventurer_ad6175: "你好，冒险者？"
  npc_override_un_bk_q_quests_15_2_hello_ate_you_time_179fef: "你好！阿特！有空吗？"
  npc_override_un_bk_q_quests_15_2_hello_dorothy_thing_last_b3ebb6: "你好，多萝西。这是上次那个东西吗？我真的要继续录吗？"
  npc_override_un_bk_q_quests_15_2_hello_i_am_ate_assistant_f83e8a: "你好，我是阿特。维鲁斯城的助理工程师。"
  npc_override_un_bk_q_quests_15_2_hello_i_am_lasse_atnad_6812bf: "你好，我是拉塞·阿特纳德。今天又轮到我在研究设施值夜班。"
  npc_override_un_bk_q_quests_15_2_hello_i_am_rookie_report_0bde7a: "你好！我是新人记者特拉普！《月刊布里根》冒险2队的！我会不畏艰险地报道故事！"
  npc_override_un_bk_q_quests_15_2_hello_i_am_software_engi_f676d7: "你好，我是软件工程师斯库利塔。"
  npc_override_un_bk_q_quests_15_2_hello_i_am_trapp_newest_47c871: "你好！我是特拉普！《月刊布里根》冒险2队的最新成员！前辈在担心我？我会报道完这个故事然后回来的！"
  npc_override_un_bk_q_quests_15_2_hello_silvia_loren_0ec50e: "你好。我是西尔维娅·洛伦。"
  npc_override_un_bk_q_quests_15_2_hello_tatio_937c9a: "你好，塔提欧。"
  npc_override_un_bk_q_quests_15_2_hello_tatio_e14065: "你好，塔提欧。"
  npc_override_un_bk_q_quests_15_2_hello_tatio_you_collect_dedb4a: "你好，塔提欧。你能把这些收集起来拿走吗？"
  npc_override_un_bk_q_quests_15_2_help_photo_journalist_su_69a1f1: "帮助摄影记者桑尼·金"
  npc_override_un_bk_q_quests_15_2_help_rookie_reporter_tra_0b538a: "帮助新人记者特拉普"
  npc_override_un_bk_q_quests_15_2_help_survival_reporter_g_189081: "帮助生存记者格里尔斯"
  npc_override_un_bk_q_quests_15_2_here_compensation_job_ab24fb: "给！这是工作的报酬。"
  npc_override_un_bk_q_quests_15_2_hey_44afd2: "喂……"
  npc_override_un_bk_q_quests_15_2_hey_5a8841: "喂。"
  npc_override_un_bk_q_quests_15_2_hey_aren_t_you_adventure_0d5101: "喂。你是冒险者吧？你一定很强。"
  npc_override_un_bk_q_quests_15_2_hey_bb5f50: "喂！！！"
  npc_override_un_bk_q_quests_15_2_hey_c812b3: "嘿！"
  npc_override_un_bk_q_quests_15_2_hey_don_t_think_going_ebf10c: "嘿，别想着往那边走。因为爆炸那边很危险。"
  npc_override_un_bk_q_quests_15_2_hey_i_don_t_much_e27594: "嘿。我可没有那么多时间闲逛，知道吗？"
  npc_override_un_bk_q_quests_15_2_hey_kobell_if_we_want_46d865: "嘿，科贝尔。如果我们想被选为优秀发掘队的话……！"
  npc_override_un_bk_q_quests_15_2_hey_lasse_i_am_curious_f5d557: "嘿，拉塞。我有点好奇，你能回答吗？"
  npc_override_un_bk_q_quests_15_2_hey_silvia_want_eat_chic_88d34a: "嘿西尔维娅，想吃炸鸡吗？我想要加葱的那种……（嗡嗡……嗡嗡）"
  npc_override_un_bk_q_quests_15_2_hey_you_beginning_earnes_764de9: "嘿，你现在要动真格的了？"
  npc_override_un_bk_q_quests_15_2_hm_40722a: "……嗯……"
  npc_override_un_bk_q_quests_15_2_hm_5ea458: "嗯……"
  npc_override_un_bk_q_quests_15_2_hm_89fce7: "嗯……"
  npc_override_un_bk_q_quests_15_2_hm_a681a9: "嗯……是这个吗？"
  npc_override_un_bk_q_quests_15_2_hm_doctor_looks_very_tir_8a5fab: "嗯。医生看起来也很疲惫。"
  npc_override_un_bk_q_quests_15_2_hm_i_see_i_see_f23067: "嗯……原来如此。原来如此。"
  npc_override_un_bk_q_quests_15_2_hm_machine_seems_been_us_c29e16: "嗯……这台机器好像是用来追踪什么东西的。"
  npc_override_un_bk_q_quests_15_2_hm_should_we_start_gathe_e366dd: "嗯……我们是不是该再开始收集记忆记录了呢？"
  npc_override_un_bk_q_quests_15_2_hm_there_anything_more_i_fe1bc0: "嗯……还有什么更有意思的吗？"
  npc_override_un_bk_q_quests_15_2_hmm_i_don_t_see_709f4c: "嗯～我没看到什么特别的伤口。"
  npc_override_un_bk_q_quests_15_2_ho_interesting_7b91ae: "哦……这倒有意思。"
  npc_override_un_bk_q_quests_15_2_hoho_i_meet_main_culprit_5e3c75: "呵呵。我遇见了我家族毁灭的元凶。"
  npc_override_un_bk_q_quests_15_2_honest_first_reason_i_co_647e09: "……说实话，第一个原因是当时因为能量风暴我无法轻易接近实验室。"
  npc_override_un_bk_q_quests_15_2_honestly_isn_t_subject_i_cf7c90: "说实话这不是我感兴趣的课题。"
  npc_override_un_bk_q_quests_15_2_hoo_62ea86: "呼……"
  npc_override_un_bk_q_quests_15_2_hope_c40921: "希望……"
  npc_override_un_bk_q_quests_15_2_how_did_i_come_investiga_540871: "我是怎么开始调查这个的？"
  npc_override_un_bk_q_quests_15_2_how_did_i_get_caught_1ba627: "我怎么就卷进这种事里来了？"
  npc_override_un_bk_q_quests_15_2_how_did_you_come_s_13525a: "你是怎么进来的？真奇怪！"
  npc_override_un_bk_q_quests_15_2_how_fresh_tasty_9bd4e3: "多么新鲜美味啊。"
  npc_override_un_bk_q_quests_15_2_how_incredible_architect_8b3871: "地下怎么会有如此惊人的建筑？越了解就越好奇。"
  npc_override_un_bk_q_quests_15_2_how_long_we_keep_running_6b21a4: "我们还能撑多久？"
  npc_override_un_bk_q_quests_15_2_how_long_you_stay_grave_49fc2b: "你要在这座坟墓般的城市里孤独地待多久？"
  npc_override_un_bk_q_quests_15_2_how_research_investigati_ebf494: "研究和调查进展如何？"
  npc_override_un_bk_q_quests_15_2_how_there_any_progress_i_a81c55: "那么，调查有进展了吗？"
  npc_override_un_bk_q_quests_15_2_how_work_excavation_team_35c3aa: "发掘队的工作怎么样？"
  npc_override_un_bk_q_quests_15_2_however_revealing_inform_2ccc43: "不过信息的公开和时机必须由这里决定。"
  npc_override_un_bk_q_quests_15_2_however_some_researchers_b83b3f: "然而……一些研究员和市民被未知的冲击波杀死了……"
  npc_override_un_bk_q_quests_15_2_however_what_we_want_e7ed51: "然而，我们想要的是……"
  npc_override_un_bk_q_quests_15_2_huh_all_voice_ahhhhhh_ar_ba200e: "嗯？就这些？但这个声音……啊啊啊啊——阿特米亚在检查她的衣服！"
  npc_override_un_bk_q_quests_15_2_huh_i_don_t_know_ea7b25: "嗯？我不知道你是谁，但未经允许不要进来。"
  npc_override_un_bk_q_quests_15_2_huh_interesting_925570: "嗯？没那么有趣？"
  npc_override_un_bk_q_quests_15_2_huh_right_point_5720d2: "嗯，直奔主题？"
  npc_override_un_bk_q_quests_15_2_huh_still_recording_e6a980: "嗯？这个还在录？"
  npc_override_un_bk_q_quests_15_2_huh_uh_buh_buh_b26e62: "嗯……呃……唔……唔……"
  npc_override_un_bk_q_quests_15_2_huh_what_s_going_f0f13b: "嗯？怎么回事？"
  npc_override_un_bk_q_quests_15_2_huh_what_s_going_i_e3d67a: "嗯？怎么回事？我听说冒险者被叫去搬运物资了？"
  npc_override_un_bk_q_quests_15_2_huh_what_what_you_doing_686a11: "嗯？这是什么？阿特纳德你在干什么？"
  npc_override_un_bk_q_quests_15_2_huh_what_you_looking_urk_141e55: "嗯？你在看什么……呃，那不是塔提欧的日记吗？"
  npc_override_un_bk_q_quests_15_2_huh_who_you_f95b7a: "嗯？！你是谁？"
  npc_override_un_bk_q_quests_15_2_huh_you_re_already_back_58b1a9: "嗯？！你已经回来了？比我想象的要早。"
  npc_override_un_bk_q_quests_15_2_hum_i_see_day_what_420fb6: "……嗯……我明白了。那天。原来是这样……"
  npc_override_un_bk_q_quests_15_2_hum_record_player_365dbf: "嗯……记录播放器？"
  npc_override_un_bk_q_quests_15_2_humph_unfortunately_i_th_541343: "哼。可惜的是，我觉得有人故意拆开了这份记忆记录。"
  npc_override_un_bk_q_quests_15_2_hurk_you_so_true_one_9a4e9f: "呃……你。原来是真的。果然还是单相思啊。"
  npc_override_un_bk_q_quests_15_2_hurts_hurts_9622ba: "好痛……好痛……"
  npc_override_un_bk_q_quests_15_2_i_always_wondered_why_i_1477e6: "我一直想知道为什么我被分配到这里，但现在我想我明白了原因。"
  npc_override_un_bk_q_quests_15_2_i_am_580a72: "我是……"
  npc_override_un_bk_q_quests_15_2_i_am_asking_you_work_1894ee: "我也不是让你白干活！"
  npc_override_un_bk_q_quests_15_2_i_am_belief_danger_shoul_dd77f0: "我信奉应该避开危险的原则，但我的朋友卡斯尔和布拉特自愿去了。"
  npc_override_un_bk_q_quests_15_2_i_am_busy_person_myself_5c89a3: "我自己也是个忙人。"
  npc_override_un_bk_q_quests_15_2_i_am_chairman_rekenber_4407b7: "我是雷肯伯的会长。"
  npc_override_un_bk_q_quests_15_2_i_am_charge_interviews_a_348124: "我负责采访和故事编排，我的同事负责摄影。资深前辈担任向导。作为一本冒险主题的杂志，我们经常去危险的地方采访。"
  npc_override_un_bk_q_quests_15_2_i_am_coming_atnad_excava_24f436: "我是从阿特纳德发掘队来的。"
  npc_override_un_bk_q_quests_15_2_i_am_crazy_funny_s_3ede5a: "我没疯，这很好笑！就是因为好笑。"
  npc_override_un_bk_q_quests_15_2_i_am_dorothy_florence_i_c01d30: "我是多萝西·弗洛伦斯。今天在监控室捡到了一份记忆记录。"
  npc_override_un_bk_q_quests_15_2_i_am_enjoying_adventure_8404a9: "我在享受冒险！告诉她别担心。不过我有点饿了……"
  npc_override_un_bk_q_quests_15_2_i_am_fighting_hard_becom_a92051: "我在努力成为一名专业的生存记者！虽然……现在不行，但请你以后再来，如果你不介意的话！"
  npc_override_un_bk_q_quests_15_2_i_am_itching_adventure_s_3a839f: "我渴望冒险，但外面的安全还没确认，别想出去。"
  npc_override_un_bk_q_quests_15_2_i_am_little_busy_cooking_0be98f: "我正在忙着烹饪这些虫子。你也想来一口吗？"
  npc_override_un_bk_q_quests_15_2_i_am_monthly_brigan_s_751f1b: "我是《月刊布里根》的资深记者克罗策尔！随着这个地方被公开，大批大批的冒险者正在聚集到这里。"
  npc_override_un_bk_q_quests_15_2_i_am_most_worried_about_144120: "我最担心的是那个见习生。他还是个新人，什么都不知道。他很可能是跟着资深前辈去了。如果可以的话，你能找到他吗？"
  npc_override_un_bk_q_quests_15_2_i_am_playing_around_you_2e635d: "我是为了被独自留在城里的你才出来玩的。"
  npc_override_un_bk_q_quests_15_2_i_am_sorry_about_7c598b: "……我很抱歉。"
  npc_override_un_bk_q_quests_15_2_i_am_sorry_isn_t_e90f05: "我很抱歉，不过。这还不够吗？"
  npc_override_un_bk_q_quests_15_2_i_am_sorry_only_permitte_c63e21: "很抱歉，只有获准的发掘队成员才能进入。"
  npc_override_un_bk_q_quests_15_2_i_am_sorry_right_now_49d99c: "很抱歉。我现在因为几个问题有点忙。我们能晚点再说吗？"
  npc_override_un_bk_q_quests_15_2_i_am_sorry_you_cannot_125301: "很抱歉，未经批准你不能继续前进。"
  npc_override_un_bk_q_quests_15_2_i_am_sorry_you_report_41bba9: "很抱歉，你能顺路把这个报告给弗雷萨吗？你知道弗雷萨是谁吧？"
  npc_override_un_bk_q_quests_15_2_i_am_sorry_you_report_60cc65: "很抱歉，你能顺路把这个报告给弗雷萨吗？这是帮个忙。"
  npc_override_un_bk_q_quests_15_2_i_am_sure_content_itself_24094b: "我不太确定，但内容本身应该没问题。"
  npc_override_un_bk_q_quests_15_2_i_am_sure_maybe_you_2a1a4f: "我不确定。也许你可以问问那边的阿尔？"
  npc_override_un_bk_q_quests_15_2_i_am_sure_what_you_123437: "我不确定你在说什么，但是……"
  npc_override_un_bk_q_quests_15_2_i_am_tatio_memory_record_7aae89: "我就是你发现的那些记忆记录里的塔提欧。"
  npc_override_un_bk_q_quests_15_2_i_am_too_proud_ask_b378f1: "我太骄傲了，拉不下脸去求人。"
  npc_override_un_bk_q_quests_15_2_i_am_type_shove_people_b04549: "我不是那种会对人指手画脚的人。"
  npc_override_un_bk_q_quests_15_2_i_am_worried_people_sudd_0a7002: "我很担心那些突然攻击他人的患者。"
  npc_override_un_bk_q_quests_15_2_i_as_well_bb6703: "我也是。"
  npc_override_un_bk_q_quests_15_2_i_ask_you_favor_even_6e4a76: "我要拜托你这件事，虽然在这个又大又复杂的掩体里并不容易。"
  npc_override_un_bk_q_quests_15_2_i_ask_your_understanding_5641ac: "我请求你的理解。"
  npc_override_un_bk_q_quests_15_2_i_asked_find_out_how_e003b9: "我被要求去调查有多少人会做饭。"
  npc_override_un_bk_q_quests_15_2_i_assessed_as_being_too_02fb54: "我评估为不太危险。"
  npc_override_un_bk_q_quests_15_2_i_ate_fresh_grapes_since_170193: "我吃到了新鲜葡萄，而且反正也没事做，今天就早点睡吧。"
  npc_override_un_bk_q_quests_15_2_i_ate_lot_different_thin_32b6b0: "我在冒险的地方吃过很多不同的东西。"
  npc_override_un_bk_q_quests_15_2_i_been_investigating_day_165c14: "我已经调查这个30天了，但还是不知道它是什么。"
  npc_override_un_bk_q_quests_15_2_i_been_investigating_day_5e0be6: "我已经调查这个32天了，但还是不知道它是什么。"
  npc_override_un_bk_q_quests_15_2_i_been_investigating_day_f85bac: "我已经调查这个40天了。"
  npc_override_un_bk_q_quests_15_2_i_blindly_went_around_ju_2efb47: "我盲目地在朱培雷奥斯四处游荡。"
  npc_override_un_bk_q_quests_15_2_i_busy_here_so_i_386204: "我在这里很忙，所以一直没能下去看看他们说就在下面的地下掩体。"
  npc_override_un_bk_q_quests_15_2_i_cannot_endure_shame_my_928450: "我无法忍受过去的耻辱——我曾把他当作一个普通的成功项目。"
  npc_override_un_bk_q_quests_15_2_i_cannot_figure_out_here_620a0d: "我从这里无法判断他们在哪里、在做什么。"
  npc_override_un_bk_q_quests_15_2_i_cannot_tell_how_long_10a8fc: "我说不清进入这个地方已经过了多久。"
