  npc_override_un_bk_q_quests_15_2_i_fermented_alcohol_whil_349186: "我……前阵子用地堡里的葡萄酿了酒。"
  npc_override_un_bk_q_quests_15_2_i_find_myself_pathetic_b_40190d: "我觉得自己很可悲，非但帮不上忙反而成了负担。"
  npc_override_un_bk_q_quests_15_2_i_formally_introduce_you_f66ad6: "我会正式介绍一下你。"
  npc_override_un_bk_q_quests_15_2_i_found_myself_motel_roo_815260: "等我醒来时，发现自己身处朱诺的一家汽车旅馆房间里。"
