  npc_override_un_bk_q_quests_15_2_i_didn_t_even_know_c44e8e: "我甚至不知道过了多久。"
  npc_override_un_bk_q_quests_15_2_i_didn_t_send_signal_6dd03f: "我还没发信号，你也是因为感觉到奇怪才来的吗？"
  npc_override_un_bk_q_quests_15_2_i_didn_t_share_much_963e3d: "我没说太多，但我旁边那个家伙一定是喝醉了，一直缠着我。"
  npc_override_un_bk_q_quests_15_2_i_didn_t_think_such_3215e8: "我没想到掩体里会有这样的空间……"
  npc_override_un_bk_q_quests_15_2_i_don_t_feel_great_1a3bc8: "我感觉不太舒服，但工作就是工作。"
  npc_override_un_bk_q_quests_15_2_i_don_t_know_details_7c04f4: "我不知道细节，但掩体外部的空气污染水平已经被测量过了。"
  npc_override_un_bk_q_quests_15_2_i_don_t_know_how_04f7e3: "我不知道这会如何影响你的立场，但是……"
  npc_override_un_bk_q_quests_15_2_i_don_t_know_how_752ebb: "我不知道已经过了多少年了。"
  npc_override_un_bk_q_quests_15_2_i_don_t_know_reason_66ef07: "我不知道原因，但弗雷萨把我分配到了这里。"
  npc_override_un_bk_q_quests_15_2_i_don_t_know_what_20de24: "我不知道发生了什么。"
  npc_override_un_bk_q_quests_15_2_i_don_t_know_what_e4b271: "我不知道你来这里干什么，但请不要碰任何东西。"
  npc_override_un_bk_q_quests_15_2_i_don_t_know_who_c92413: "我不知道是谁装备了这个防空掩体。但它确实做得很好，很坚固。"
  npc_override_un_bk_q_quests_15_2_i_don_t_know_why_0b04e3: "我不知道为什么大家都拒绝一个能搬运重物的装置。"
  npc_override_un_bk_q_quests_15_2_i_don_t_see_any_558098: "我没看到任何异常症状。幸运。"
  npc_override_un_bk_q_quests_15_2_i_don_t_think_helped_b0f59e: "我觉得人们担心也是难免的。最后的资深记者，格里兹·格里尔斯！指定的生存记者！"
