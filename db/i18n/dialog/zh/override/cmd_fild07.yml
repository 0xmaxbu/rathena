Body:
  npc_override_cmd_fild07_InfiniteSpace_merchants_choose_type_equipment_yo_35cc13: "选择你想购买的装备类型。只要你有{0}，想买多少都可以。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_come_back_anytime_512848: "随时欢迎回来"
  npc_override_cmd_fild07_InfiniteSpace_merchants_did_you_take_off_your_16720e: "你脱下装备了吗？"
  npc_override_cmd_fild07_InfiniteSpace_merchants_equipment_suitable_encha_7906cc: "这件装备不适合附魔。别忘了只有无限装备系列才能附魔。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_give_me_one_0b0037: "给我一个"
  npc_override_cmd_fild07_InfiniteSpace_merchants_good_deal_need_more_b17b6b: "交易愉快。还需要吗？"
  npc_override_cmd_fild07_InfiniteSpace_merchants_hey_isn_t_hard_walk_42181f: "嘿，每次走来走去不觉得累吗？只要^0000ff20,000^000000 Zeny，我就可以给你一张直接传送到遗迹入口的卷轴，怎么样？"
  npc_override_cmd_fild07_InfiniteSpace_merchants_hm_way_i_don_t_c9ad33: "嗯。顺便说一句，我觉得你没在听，你的{0}不够。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_hm_well_done_check_your_66a161: "嗯。做得很好。立刻检查你的装备。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_i_don_t_think_so_bbad85: "我不这么认为"
  npc_override_cmd_fild07_InfiniteSpace_merchants_i_ll_make_sure_gets_44fc5b: "我会确保附魔顺利完成。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_i_lot_stuff_over_here_3ad425: "我这里有很多东西，当然不是免费的。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_i_only_enchant_rd_th_e6ffe0: "我只能附魔第3和第4个插槽。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_i_only_enchant_up_third_4b7d9f: "我只能附魔到第三个插槽。你的装备无法进一步附魔了。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_if_you_change_your_mind_b8d405: "如果你改变主意，随时回来找我。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_if_you_re_looking_streng_20ebc2: "如果你想强化在无限空间获得的装备，你来对地方了。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_material_i_reinforce_equ_c2388f: "用那种材料，我可以强化你从无限空间获得的装备。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_cancel_9c2fca: "取消:购买"
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_cancel_be4413: "取消:武器:防具"
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_cancel_f5a301: "取消:武器:铠甲:鞋子:披风:头盔"
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_how_4d9928: "如何附魔我的装备？:附魔装备:初始化装备附魔"
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_i_648ebb: "我稍后再来:请继续"
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_quit_19ed20: "退出:继续"
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_quit_275c1f: "退出:物理:魔法:远程"
  npc_override_cmd_fild07_InfiniteSpace_merchants_okay_let_s_begin_first_b49895: "好的，让我们开始第一次附魔。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_okay_let_s_proceed_secon_5e56cd: "好的，让我们进行第二次附魔。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_please_come_back_wheneve_b4314d: "随时欢迎回来~"
  npc_override_cmd_fild07_InfiniteSpace_merchants_please_organize_your_ite_01b3c7: "请整理物品后再试。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_please_select_equipment_df2e4a: "请选择你想附魔的装备。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_thank_you_your_trust_ple_02576b: "感谢你的信任。请下次再来。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_then_come_visit_me_when_93d45b: "那想附魔装备时再来找我吧。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_there_chance_your_infini_52c7b4: "初始化过程中你的无限空间装备有可能会被破坏。你仍然愿意继续吗？"
  npc_override_cmd_fild07_InfiniteSpace_merchants_there_no_chance_equipmen_b15194: "附魔过程中装备不会被破坏，但初始化附魔时极有可能被破坏。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_well_i_did_warn_you_127053: "好吧，我警告过你了。你运气不好，是吧？"
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_any_90f9da: "你有{0}吗？"
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_choose_types_enchant_cfd017: "你可以选择3种附魔类型，附魔费用是{0} {1}。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_don_t_enough_purchas_c84a4d: "你的{0}不足以购买此物品。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_don_t_seem_any_424dc5: "你看起来没钱了。一张卷轴要20,000 Zeny。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_ll_able_obtain_if_53a0ed: "如果你探索帕罗斯灯塔下方的空间，就能获得{0}。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_need_purchase_889371: "你需要^0000FF{0}^000000 {1}来购买{2}~"
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_t_proceed_conversati_381a25: "因为你携带了大量物品，无法继续对话。"
  npc_override_cmd_fild07_InfiniteSpace_merchants_your_equipment_doesn_t_a_50fecb: "你的装备没有任何附魔。"
  npc_override_cmd_fild07_comodo_i_see_no_monsters_here_898c50: "我没看到这里有魔物……"
  npc_override_cmd_fild07_comodo_i_want_go_explore_inside_a8783b: "我想进去探索……"
  npc_override_cmd_fild07_comodo_if_you_tell_me_go_db6fe1: "如果你叫我别进去，不是会让我更想进去吗？但看起来里面没什么有趣的。"
  npc_override_cmd_fild07_comodo_kind_smells_like_212c3f: "有点那种味道……"
  npc_override_cmd_fild07_comodo_no_i_m_just_passing_60edd3: "不……我只是路过。我不想进去……"
  npc_override_cmd_fild07_comodo_rumors_been_spreading_th_1350c7: "有传言说这里有魔物居住。人们声称因为魔物而听到地面隆隆作响……"
  npc_override_cmd_fild07_comodo_you_think_there_s_going_277ee6: "你觉得这里面会有宝藏吗？"
