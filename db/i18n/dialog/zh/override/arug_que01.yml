Body:

  npc_override_arug_que01_gdevent_aru_aaah_time_gold_a79415: "啊～！时间就是金钱。"
  npc_override_arug_que01_gdevent_aru_after_few_days_we_finall_72eb2a: "过了几天，我们终于找到了些东西！"
  npc_override_arug_que01_gdevent_aru_ah_298394: "啊……"
  npc_override_arug_que01_gdevent_aru_ah_dont_forget_i_hate_da0aed: "啊！别忘了，我讨厌魔物！所以我不想看到它们。你最好还是去找别的忙帮吧。"
  npc_override_arug_que01_gdevent_aru_ah_you_one_my_master_f242b3: "啊，你就是我主人提到的那个人。"
  npc_override_arug_que01_gdevent_aru_ahh_what_shame_seems_lik_33bbba: "啊，真可惜，看来你还没有找到藏宝图。"
  npc_override_arug_que01_gdevent_aru_ahhh_a4d1c6: "啊……"
  npc_override_arug_que01_gdevent_aru_alright_let_s_begin_e5a8c7: "好了，我们开始吧！"
  npc_override_arug_que01_gdevent_aru_alright_let_s_go_749238: "好了！走吧。"
  npc_override_arug_que01_gdevent_aru_alright_let_us_begin_a8987d: "好了！我们开始吧！"
  npc_override_arug_que01_gdevent_aru_alright_you_like_play_ga_1d8a89: "好了，你想玩格加斯为你准备的那个游戏吗？"
  npc_override_arug_que01_gdevent_aru_although_you_re_weirdo_y_31a794: "^3131FF<虽然你是个怪人，但你看起来非常专注>^000000。哔哔。"
  npc_override_arug_que01_gdevent_aru_amazing_ee5d85: "太厉害了！"
  npc_override_arug_que01_gdevent_aru_amongst_all_you_who_shal_df0083: "在你们所有人中，谁会是最幸运的那个？"
  npc_override_arug_que01_gdevent_aru_as_reward_i_tell_you_ceba3a: "作为奖励，我会告诉你我最近发现的一个神秘区域。"
  npc_override_arug_que01_gdevent_aru_beep_beep_beep_5bcde6: "哔哔哔。"
  npc_override_arug_que01_gdevent_aru_clown_stops_then_starts_ce9572: "小丑停了下来，然后开始随着你的动作移动，嘴里发出声响。"
  npc_override_arug_que01_gdevent_aru_come_back_later_997d16: "- 稍后再回来吧。 -"
  npc_override_arug_que01_gdevent_aru_come_gergath_left_messag_3aa4ec: "来吧，格加斯给你留了个口信。"
  npc_override_arug_que01_gdevent_aru_completed_2ba6dd: "完成了。"
  npc_override_arug_que01_gdevent_aru_congratulations_you_succ_562f21: "恭喜你，你成功了！"
  npc_override_arug_que01_gdevent_aru_could_gravity_mercury_2c2219: "难道是重力社还是水星社？"
  npc_override_arug_que01_gdevent_aru_could_you_please_give_th_7a0fb4: "能请你代我向他们问好吗？"
  npc_override_arug_que01_gdevent_aru_did_you_find_treasure_e89c0e: "你找到宝物了吗？"
  npc_override_arug_que01_gdevent_aru_did_you_find_treasure_ma_0e41fc: "你找到藏宝图了吗？"
  npc_override_arug_que01_gdevent_aru_did_you_fun_b7cab0: "你玩得开心吗？"
  npc_override_arug_que01_gdevent_aru_did_you_get_permission_g_1215ea: "你得到格加斯的许可了吗？"
  npc_override_arug_que01_gdevent_aru_did_you_get_permission_g_64c4e1: "你得到格加斯的许可了吗？"
  npc_override_arug_que01_gdevent_aru_don_t_forget_dwarves_gra_5fa86c: "别忘了，矮人可是懂得感恩的种族！哈哈哈！"
  npc_override_arug_que01_gdevent_aru_enough_makes_game_fun_no_8348d7: "还不够？但这让游戏更有趣了，不是吗？哈哈哈！"
  npc_override_arug_que01_gdevent_aru_game_instruction_just_fi_fdc587: "游戏规则就是在时限内找到藏宝图。"
  npc_override_arug_que01_gdevent_aru_game_prepared_my_master_19b6ea: "我主人准备的游戏非常独特，却又简单有趣！"
  npc_override_arug_que01_gdevent_aru_good_bye_a68a6b: "再见～"
  npc_override_arug_que01_gdevent_aru_haha_i_m_just_kidding_7a9318: "哈哈，我开玩笑的。哔哔。"
  npc_override_arug_que01_gdevent_aru_he_stole_my_pickaxe_a07d36: "他偷了我的十字镐！"
  npc_override_arug_que01_gdevent_aru_hehe_while_you_re_talkin_60179c: "嘿嘿，在你跟我说话的时候，时间正在慢慢流逝哦～"
  npc_override_arug_que01_gdevent_aru_hello_my_friends_bcbd32: "你们好，我的朋友们！"
  npc_override_arug_que01_gdevent_aru_help_me_b1a2c3: "帮帮我！"
  npc_override_arug_que01_gdevent_aru_here_soil_very_hard_dig_ffa49f: "但是这里的土壤很难挖掘。幸好我的^3131FF十字镐^000000从不会让我失望！"
  npc_override_arug_que01_gdevent_aru_hey_did_you_see_ugly_0153c3: "嘿，你看到一个丑陋的哥布林经过了吗？他偷了我的东西！"
  npc_override_arug_que01_gdevent_aru_his_name_waskublin_36c702: "他叫^3131FF库布林^000000！"
  npc_override_arug_que01_gdevent_aru_hm_5ea458: "嗯……"
  npc_override_arug_que01_gdevent_aru_hm_s_right_180218: "嗯？没错。"
  npc_override_arug_que01_gdevent_aru_hm_you_don_t_think_0b5e2a: "嗯？你不这么认为吗？"
  npc_override_arug_que01_gdevent_aru_hm_you_re_member_1156d0: "嗯，你不是会员。"
  npc_override_arug_que01_gdevent_aru_how_did_you_bc0c0a: "你是怎么做到的？"
  npc_override_arug_que01_gdevent_aru_how_i_help_you_13e773: "我能为你做些什么？"
  npc_override_arug_que01_gdevent_aru_i_always_carry_me_you_e4fa5a: "我一直随身带着它，你知道吗？"
  npc_override_arug_que01_gdevent_aru_i_am_happy_hear_all_41a5ca: "我很高兴听到这些欢笑声，但没有主人的许可，我什么也做不了。"
  npc_override_arug_que01_gdevent_aru_i_am_loyal_servant_gerga_4176de: "我是格加斯忠实的仆人，终于接到了命令。"
  npc_override_arug_que01_gdevent_aru_i_am_member_37fdf5: "我是^3131FF{0}^的成员。"
  npc_override_arug_que01_gdevent_aru_i_am_morestone_i_collect_b9cc69: "我是莫尔斯通，收集稀有宝石。"
  npc_override_arug_que01_gdevent_aru_i_don_t_see_anything_47f9cd: "我什么也没看到。你已经开始了吗？哔？"
  npc_override_arug_que01_gdevent_aru_i_hope_see_you_again_68b575: "我希望很快能再见到你，我现在得回到玩偶状态了。"
  npc_override_arug_que01_gdevent_aru_i_hope_you_enjoy_yoursel_ae244e: "希望你玩得开心，我的朋友。"
  npc_override_arug_que01_gdevent_aru_i_ll_give_you_one_e43b20: "我再给你一次机会。怎么样？哔？"
  npc_override_arug_que01_gdevent_aru_i_morestone_made_allianc_5f28c2: "我，莫尔斯通，已经与{0}公会结盟了。"
  npc_override_arug_que01_gdevent_aru_i_pierrot_piere_am_heart_af27a6: "我，皮埃罗·皮埃尔，可不是一个冷酷无情的小丑！哔哔。"
  npc_override_arug_que01_gdevent_aru_i_show_you_most_incredib_9cef79: "我将在这里向你展示最不可思议的魔法。"
  npc_override_arug_que01_gdevent_aru_i_t_live_without_dac204: "没有它我活不下去……"
  npc_override_arug_que01_gdevent_aru_i_talk_your_leader_about_db5288: "我会和你的会长谈其他细节。"
  npc_override_arug_que01_gdevent_aru_i_tell_you_how_find_002e85: "我会告诉你如何找到他。"
  npc_override_arug_que01_gdevent_aru_i_turn_place_very_white_adf821: "我会让这里变得非常白。非常——白！"
  npc_override_arug_que01_gdevent_aru_if_you_need_my_assistanc_44a643: "如果你需要我的帮助，尽管开口。"
  npc_override_arug_que01_gdevent_aru_if_you_want_i_take_58171b: "如果你愿意，我可以带^3131FF你和你的公会成员^000000去探索那个区域。"
  npc_override_arug_que01_gdevent_aru_if_your_friends_visit_me_88dd70: "如果你的朋友们以后再来找我，我会再次带他们去那个区域。"
  npc_override_arug_que01_gdevent_aru_incorrect_password_b68db3: "密码错误。"
  npc_override_arug_que01_gdevent_aru_incredible_unbelievable_b5619b: "太不可思议了！难以置信！哔哔！"
  npc_override_arug_que01_gdevent_aru_indeed_c8b181: "确实……"
  npc_override_arug_que01_gdevent_aru_instead_going_there_alon_1e7d9f: "与其一个人去那里，我觉得和朋友们一起去会更有趣……"
  npc_override_arug_que01_gdevent_aru_kublin_wears_ridiculous_8ad8cc: "库布林戴着一顶可笑的黄金帽子，应该很容易认出他来。"
  npc_override_arug_que01_gdevent_aru_ladies_gentlemen_1f78ff: "女士们，先生们。"
  npc_override_arug_que01_gdevent_aru_let_game_begin_ce9461: "让游戏……开始吧！"
  npc_override_arug_que01_gdevent_aru_let_me_know_when_you_4d0ee1: "等你准备好了告诉我。"
  npc_override_arug_que01_gdevent_aru_let_me_see_959712: "让我看看……"
  npc_override_arug_que01_gdevent_aru_let_me_see_a2f143: "让我看看。"
  npc_override_arug_que01_gdevent_aru_let_s_talk_after_i_394c34: "等我读完主人的信再谈。哔哔。"
  npc_override_arug_que01_gdevent_aru_lonely_clown_juggling_e0f9ea: "一个孤独的小丑在玩杂耍。"
  npc_override_arug_que01_gdevent_aru_looks_like_made_some_spe_6fd7a1: "看起来它是为某种特殊用途而造的，但既然那里没有宝石，我对此毫无兴趣。"
  npc_override_arug_que01_gdevent_aru_menu_game_6b73df: "游戏说明:跳过说明:拒绝游戏"
  npc_override_arug_que01_gdevent_aru_menu_gergath_094d2d: "格加斯:就算我变成老头子也说不出口啊。"
  npc_override_arug_que01_gdevent_aru_menu_gergath_179c2c: "格加斯:不管大人们怎么努力，我们都没有改变主意的打算。哈哈。"
  npc_override_arug_que01_gdevent_aru_menu_gergath_7e39bf: "格加斯:皮埃罗·皮埃尔会帮助你的。希望你能借此机会回到过去，和孩子们一起享受快乐。"
  npc_override_arug_que01_gdevent_aru_menu_gergath_8a2beb: "格加斯:请收下这份礼物，来自一个没用的朋友，送给你和你心爱的孩子们。希望你们会喜欢，哈哈。"
  npc_override_arug_que01_gdevent_aru_menu_gergath_8d8fdd: "格加斯:你还记得我们年轻的时候吗？我们每天打架，就像不共戴天的仇人一样。"
  npc_override_arug_que01_gdevent_aru_menu_gergath_8ef5ad: "格加斯:当你把我母亲的遗物交给我时，我连谢谢都说不出口。"
  npc_override_arug_que01_gdevent_aru_menu_gergath_a23cac: "格加斯:我亲爱的朋友，你过得怎么样？这是我为你准备的东西。"
  npc_override_arug_que01_gdevent_aru_menu_gergath_ab7cc9: "格加斯:但我相信，在内心深处，我们都珍视着彼此的友谊。"
  npc_override_arug_que01_gdevent_aru_menu_gergath_c2c49c: "格加斯:不久前我才得知你的下落。听说你在照顾孤儿？"
  npc_override_arug_que01_gdevent_aru_menu_gergath_dd3ebf: "格加斯:我在妙勒尼山脉遗失了我母亲的遗物后，你来找过我。"
  npc_override_arug_que01_gdevent_aru_menu_i_134a52: "我需要检查一下。:不了。"
  npc_override_arug_que01_gdevent_aru_menu_it_ce488f: "还挺难的。:我本该成功的……"
  npc_override_arug_que01_gdevent_aru_menu_kublin_6db31f: "库布林:啊——！"
  npc_override_arug_que01_gdevent_aru_menu_let_a8785c: "走吧。:不了，谢谢。"
  npc_override_arug_que01_gdevent_aru_menu_morestone_3153e0: "莫尔斯通:站住！你这个小偷！"
  npc_override_arug_que01_gdevent_aru_menu_morestone_82e9b5: "莫尔斯通:我好像听到了库布林的惨叫声！！是谁在那里？库布林怎么了？嘿，说你呢！"
  npc_override_arug_que01_gdevent_aru_menu_no_a0379b: "不。:开始。"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_062739: "皮埃罗·皮埃尔:我再给你一次机会。怎么样？哔？"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_11e538: "皮埃罗·皮埃尔:我，皮埃罗·皮埃尔，可不是一个冷酷无情的小丑！哔哔。"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_12a1fd: "皮埃罗·皮埃尔:时间不多了，快一点！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_12f9b1: "皮埃罗·皮埃尔:请把你的手掌给我。"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_2e3e4a: "皮埃罗·皮埃尔:让游戏……开始吧！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_30d4b5: "皮埃罗·皮埃尔:哔哔哔！你们好，我的朋友们！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_36eabf: "皮埃罗·皮埃尔:哔！哦，你已经打开礼物了？动作可真快啊，哔！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_41266f: "皮埃罗·皮埃尔:哈哈，我开玩笑的。哔哔。你就是我主人提到的那个人。"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_49f828: "皮埃罗·皮埃尔:来，拿上皮埃尔的宝物箱。"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_4a58ef: "皮埃罗·皮埃尔:女士们，先生们。"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_4bc975: "皮埃罗·皮埃尔:看到你们的笑容，皮埃罗真的很开心～下次再见！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_54e260: "皮埃罗·皮埃尔:游戏规则就是在时限内找到藏宝图。听起来很简单，对吧？"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_6e9c9f: "皮埃罗·皮埃尔:你是怎么做到的？"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_76a63f: "皮埃罗·皮埃尔:<你是个每天都在胡思乱想的人，完全没有专注力。>"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_76b1b7: "皮埃罗·皮埃尔:我很高兴听到这些欢笑声，但没有主人的许可，我什么也做不了。"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_794b59: "皮埃罗·皮埃尔:你得到格加斯的许可了吗？"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_7d78a6: "皮埃罗·皮埃尔:你完成了一项不可思议的任务，我要把主人准备的精彩礼物送给你！！哈！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_83cd91: "皮埃罗·皮埃尔:我会让这里变得非常白。非常——白！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_8c71a8: "皮埃罗·皮埃尔:好的，我明白了……"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_94e104: "皮埃罗·皮埃尔:在你们所有人中，谁会是最幸运的那个？"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_9526be: "皮埃罗·皮埃尔:验证完成！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_a0ef76: "皮埃罗·皮埃尔:嗯？你不这么认为吗？"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_a20216: "皮埃罗·皮埃尔:谁会在这个纯白的世界里找到藏宝图呢？"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_a98005: "皮埃罗·皮埃尔:时间到！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_ab1ad8: "皮埃罗·皮埃尔:我主人准备的游戏非常独特，却又简单有趣！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_b605af: "皮埃罗·皮埃尔:好了，我已经准备好了。我们开始吧？哔，哔？"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_b96504: "皮埃罗·皮埃尔:你居然能大海捞针！太厉害了！！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_c65f9d: "皮埃罗·皮埃尔:让我看看……"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_e1e7fc: "皮埃罗·皮埃尔:嗯……"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_ef3516: "皮埃罗·皮埃尔:确实……"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_f224ae: "皮埃罗·皮埃尔:这个游戏叫\\\\\\\\\\\\\\\"寻找藏宝图\\\\\\\\\\\\\\\"！！"
  npc_override_arug_que01_gdevent_aru_menu_pierrot_fc01ae: "皮埃罗·皮埃尔:哇～～！！成功了～！！太成功了～！！"
  npc_override_arug_que01_gdevent_aru_menu_reset_96c4a7: "重置。:不了，谢谢。"
  npc_override_arug_que01_gdevent_aru_menu_wait_ded53d: "等等！我还没准备好。:走吧！"
  npc_override_arug_que01_gdevent_aru_menu_what_5ba5bf: "发生什么事了？:没什么。"
  npc_override_arug_que01_gdevent_aru_my_master_gergath_sincer_8dc783: "我的主人格加斯衷心地祝愿你和你的家人每天都快乐。"
  npc_override_arug_que01_gdevent_aru_my_precious_pickaxe_i_th_7c00d7: "我心爱的十字镐，我还以为永远失去你了。"
  npc_override_arug_que01_gdevent_aru_my_travels_i_told_there_b48633: "在我的旅途中，有人告诉我瓦尔弗蕾亚和尼德霍格有很多宝石，所以我就来到了这里。"
  npc_override_arug_que01_gdevent_aru_mysterious_area_07e603: "神秘区域？"
  npc_override_arug_que01_gdevent_aru_no_worth_quite_lot_bc4f05: "不，但它值不少钱。"
