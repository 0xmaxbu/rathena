Body:
  npc_override_pay_fild08_spirit_handler_aaaah_23c2be: "啊……"
  npc_override_pay_fild08_spirit_handler_aaaah_7a612c: "啊！！！"
  npc_override_pay_fild08_spirit_handler_aaaah_b2af69: "啊~~"
  npc_override_pay_fild08_spirit_handler_aaah_2a86dc: "啊！！！"
  npc_override_pay_fild08_spirit_handler_aaah_63f684: "啊！！！！！！！"
  npc_override_pay_fild08_spirit_handler_about_delicious_smell_edeaaf: "关于那美味的香气。"
  npc_override_pay_fild08_spirit_handler_about_food_fell_street_5d3ad3: "关于掉在街上的食物。"
  npc_override_pay_fild08_spirit_handler_about_lee_daegam_c8b979: "关于李大人。"
  npc_override_pay_fild08_spirit_handler_about_request_b4473b: "关于委托。"
  npc_override_pay_fild08_spirit_handler_about_wild_animals_82525f: "关于野生动物。"
  npc_override_pay_fild08_spirit_handler_adventurer_base_lv_job_l_04b95f: "^dd5555Base等级200/Job等级60^000000以上的冒险者。"
  npc_override_pay_fild08_spirit_handler_ahem_ee062c: "嗯哼！"
  npc_override_pay_fild08_spirit_handler_all_right_441c8d: "好吧。"
  npc_override_pay_fild08_spirit_handler_animals_seem_moved_strai_6b8f41: "- 那些动物似乎沿着道路一直走到了柴火工坊。 -"
  npc_override_pay_fild08_spirit_handler_anyway_adventurer_took_o_bef246: "不管怎样，冒险者接手了这份工作，所以我能看到一些线索！"
  npc_override_pay_fild08_spirit_handler_around_box_animal_footpr_4aa8fa: "- 箱子周围，动物脚印杂乱地印着，正如柴火工匠所说，它们看起来是食草动物的脚印。 -"
  npc_override_pay_fild08_spirit_handler_as_chulho_said_i_wanted_75ae5c: "正如哲浩所说，我本想至少办一场盛宴来报答你们，但在这片深林中待太久对林外的人来说很危险，所以我感到沉重，不得不让他们匆忙回去，连一句像样的告别都没来得及说。"
  npc_override_pay_fild08_spirit_handler_as_you_ve_heard_before_94e7aa: "正如你之前听说的，他是位伟大的领袖，^123456李大人^000000，是他把这份工作交给我的。"
  npc_override_pay_fild08_spirit_handler_barn_door_locked_well_i_148f92: "谷仓门锁得好好的，我一直在院子里，没有人经过。"
  npc_override_pay_fild08_spirit_handler_besides_those_things_you_01f788: "而且，那些是你不该吃的东西！"
  npc_override_pay_fild08_spirit_handler_boring_233a79: "真无聊~"
  npc_override_pay_fild08_spirit_handler_boss_out_office_right_no_9e7ad3: "老板现在不在办公室。"
  npc_override_pay_fild08_spirit_handler_cannot_complete_quest_12713b: "无法完成委托。"
  npc_override_pay_fild08_spirit_handler_carpentry_request_fdc54a: "木工委托……"
  npc_override_pay_fild08_spirit_handler_chief_fc87c0: "首领？"
  npc_override_pay_fild08_spirit_handler_closer_look_broken_tools_92761f: "- 仔细查看那些损坏的工具，可以看到模糊的痕迹。 -"
  npc_override_pay_fild08_spirit_handler_contains_broken_tools_bd3a5c: "- 里面装着损坏的工具。 -"
  npc_override_pay_fild08_spirit_handler_could_you_wait_moment_pl_43419f: "你能稍等一下吗~？"
  npc_override_pay_fild08_spirit_handler_cute_842abd: "好可爱！！！！"
  npc_override_pay_fild08_spirit_handler_dear_c6bbcc: "亲爱的{0}。"
  npc_override_pay_fild08_spirit_handler_did_lee_daegam_send_you_019682: "是李大人派你来的吗？"
  npc_override_pay_fild08_spirit_handler_doesn_t_look_much_differ_6d5df1: "看起来和昨天没什么两样。"
  npc_override_pay_fild08_spirit_handler_don_t_make_noise_go_e88675: "别出声，悄悄走。"
  npc_override_pay_fild08_spirit_handler_don_t_you_guys_ever_405bce: "你们这些家伙别再被抓到了！我太生气了！！"
  npc_override_pay_fild08_spirit_handler_eddga_better_2c8fcf: "虎王更好。"
  npc_override_pay_fild08_spirit_handler_eddga_told_me_he_coming_4baddd: "虎王告诉我他要来……"
  npc_override_pay_fild08_spirit_handler_eheh_efae0b: "嘿嘿~~！！"
  npc_override_pay_fild08_spirit_handler_eheheh_3979e1: "嘿嘿嘿！"
  npc_override_pay_fild08_spirit_handler_first_all_call_person_in_e28c30: "首先，叫一个人悄悄去调查谷仓。接下来，告诉他们去厨房准备一顿饭，因为他们需要即食的食物。"
  npc_override_pay_fild08_spirit_handler_font_size_aaah_font_90bc91: "<FONT SIZE = 16>啊~~！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_after_everyone_448eff: "<FONT SIZE = 14>大家离开后，没有剩下美味的水果，但到处都是脚印。所以……我就跟着来到了这里。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_ahem_font_629047: "<FONT SIZE = 16>嗯哼！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_although_hyunr_209dc5: "<FONT SIZE = 14>虽然玄石不会出来！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_as_expected_hy_b74d45: "<FONT SIZE = 14>果然，玄石似乎察觉到了！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_b_ah_b_265597: "<FONT SIZE = 18><B>啊！！！！！！！</B></FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_b_why_b_a39757: "<FONT SIZE = 18><B>为什么？</B></FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_churup_font_55637c: "<FONT SIZE = 16>啾噜……</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_course_forest_f75b63: "<FONT SIZE = 14>当然森林也很有趣！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_cute_font_bead72: "<FONT SIZE = 14>可爱！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_did_he_go_257e16: "<FONT SIZE = 10>他又去森林了吗！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_doesn_t_matter_6fae41: "<FONT SIZE = 14>但没关系，只要闻起来香，就算苦、生气、肚子疼也没关系。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_even_friends_w_e9045a: "<FONT SIZE = 14>就连跟着食物来到这里的朋友也生气地回家了！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_follow_me_font_4411f0: "<FONT SIZE = 14>跟我来。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_gasp_font_f491d2: "<FONT SIZE = 14>喘！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_gentleman_out_eab9f4: "<FONT SIZE = 14>这位先生又出去了！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_go_ahead_read_4857b8: "<FONT SIZE = 14>去读吧！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_good_boy_font_85bf75: "<FONT SIZE = 18>好孩子！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_here_font_dec6ca: "<FONT SIZE = 14>在这里！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_hmph_font_80613b: "<FONT SIZE = 18>哼！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_how_delicious_476be0: "<FONT SIZE = 14>吃得一干二净，该有多好吃啊？</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_huh_font_214b32: "<FONT SIZE = 14>嗯……</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_huh_font_db8433: "<FONT SIZE = 14>嗯？</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_hurry_up_font_27e135: "<FONT SIZE = 16>快点！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_hyunrok_always_9d3570: "<FONT SIZE = 14>玄石总是说些难懂的话！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_hyunrok_big_tr_d4b12c: "<FONT SIZE = 14>如果玄石知道他把奇怪的药给朋友吃，还挖穿森林做奇怪的东西，他就大麻烦了！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_am_chulho_b69ed9: "<FONT SIZE = 14>我是哲浩。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_didn_t_1c169c: "<FONT SIZE = 14>我不想要！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_don_t_70676e: "<FONT SIZE = 14>我不知道是谁，但最好别让我在我的谷仓里抓到小偷！！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_followed_you_ab31e0: "<FONT SIZE = 14>我跟着你是因为我觉得发生了有趣的事，而且你走得很兴奋。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_i_m_18a164: "<FONT SIZE = 14>我~~我是森林里的精灵。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_just_drooled_48b3f2: "<FONT SIZE = 14>我只是流口水了！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_just_out_e4de74: "<FONT SIZE = 14>我只是出去玩了一会儿。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_m_angry_81eb84: "<FONT SIZE = 16>我生气了！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_m_trouble_dd759e: "<FONT SIZE = 14>我有麻烦了！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_saved_becaus_8749f4: "<FONT SIZE = 14>我保存它是因为觉得有趣，但我会把它给你！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_t_work_bc4b42: "<FONT SIZE = 14>工具老是坏，我没法工作！！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_ve_been_c0de83: "<FONT SIZE = 14>我一直在等！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_if_boss_asked_007b60: "<FONT SIZE = 10>如果是老板让你做的，你应该告诉我！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_if_you_re_76f245: "<FONT SIZE = 14>如果你是来取笑我的，你只是在打扰我，所以回去吧！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_kisul_nice_fon_7c63c4: "<FONT SIZE = 14>基苏尔很好！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_kwang_saeng_fo_50ef43: "<FONT SIZE = 16>光生！！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_let_s_go_f3974d: "<FONT SIZE = 16>我们走！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_let_s_hurry_48ff5a: "<FONT SIZE = 14>快点，进去阻止玄石。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_my_stomach_hur_744921: "<FONT SIZE = 18>我肚子疼！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_font_47e2a8: "<FONT SIZE = 17>哦！！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_i_i_b4e78f: "<FONT SIZE = 14>哦……我……我……！！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_letter_hyun_0b80ca: "<FONT SIZE = 14>哦，这是玄石的信！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_my_font_0dfdb5: "<FONT SIZE = 14>天哪！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_no_font_bee669: "<FONT SIZE = 16>哦不！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_no_font_c602f7: "<FONT SIZE = 14>哦不！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_old_man_a596ee: "<FONT SIZE = 14>哦，那个老头！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_road_over_ther_819bb7: "<FONT SIZE = 14>那边那条路闻起来很香，但那条路通往村庄，我们山里的动物如果走那条路就麻烦了！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_s_delicious_de_5e29d8: "<FONT SIZE = 14>好吃！好吃！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_s_hard_come_4a81d1: "<FONT SIZE = 14>现在很难来深林了，但想想看，我只要出来玩就行了！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_s_much_better_e01da5: "<FONT SIZE = 14>比在森林里吃的草莓好吃多了！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_s_right_font_8b0b21: "<FONT SIZE = 14>没错！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_s_right_font_cd3660: "<FONT SIZE = 16>没错！！！！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_see_you_again_7c8663: "<FONT SIZE = 14>再见</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_sir_font_7f139b: "<FONT SIZE = 16>先生！！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_sir_font_91e2ec: "<FONT SIZE = 16>先生！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_smell_front_fo_65e4d2: "<FONT SIZE = 14>森林前面的气味与通往村庄的道路相连。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_smells_delicio_99553e: "<FONT SIZE = 14>闻起来很香，但会让你生病。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_smells_so_bad_e56dac: "<FONT SIZE = 14>这里好臭！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_sorry_font_b9a96b: "<FONT SIZE = 14>对不起！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_take_too_font_449973: "<FONT SIZE = 14>这个也拿着！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_then_i_saw_7f8a18: "<FONT SIZE = 14>然后我看到地上有一个异常成熟的水果，我一时分神，大家都走了。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_there_many_fri_d5d4f6: "<FONT SIZE = 14>森林里有很多朋友！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_there_s_anothe_0dae8a: "<FONT SIZE = 14>还有另一个巨大的蛇草莓！！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_there_s_so_0f8cce: "<FONT SIZE = 14>森林外面太好玩了！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_things_i_ate_e1bc5d: "<FONT SIZE = 14>我在森林里吃的东西又甜又好吃，但之前捡的蛇草莓是苦的！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_today_i_m_ac768e: "<FONT SIZE = 14>今天，我在森林里挥舞树枝玩，其他朋友都沿着路聚集过来。</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_walking_everyo_98dc8d: "<FONT SIZE = 14>和大家一起走路，很有趣，因为地上有^dd5555水果和谷物^000000。在森林里很难看到的东西！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_we_re_trouble_2e7527: "<FONT SIZE = 16>我们有麻烦了！！！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_welcome_custom_3981f1: "<FONT SIZE = 14>欢迎~客人~！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_did_say_a86210: "<FONT SIZE = 14>它说了什么？</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_font_7d577d: "<FONT SIZE = 10>什么？</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_font_82829e: "<FONT SIZE = 14>什么！？</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_if_we_799004: "<FONT SIZE = 14>如果我们有大麻烦怎么办？</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_s_hideous_72a0d4: "<FONT SIZE = 14>这是什么可怕的气氛！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_you_givin_86af1a: "<FONT SIZE = 14>你在给我什么？</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_factory_fo_941dcf: "<FONT SIZE = 14>你有工厂吗~</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_finished_r_7aaa19: "<FONT SIZE = 14>你读完信了吗？</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_gave_me_cc5733: "<FONT SIZE = 14>你给了我好吃的食物，所以我会带你去你好奇的地方，带着美味的香气！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_really_giv_4eebb6: "<FONT SIZE = 14>你真的要给我吗？！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_t_eat_ebe4a7: "<FONT SIZE = 14>你不能吃那个！</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_worried_ab_221780: "<FONT SIZE = 14>你在担心肚子疼吗？</FONT>"
  npc_override_pay_fild08_spirit_handler_food_seems_piled_up_f885a3: "- 食物似乎堆积起来了。"
  npc_override_pay_fild08_spirit_handler_footprints_showing_way_ab10d3: "- 脚印指明了方向。"
  npc_override_pay_fild08_spirit_handler_footprints_similar_those_48e75b: "与工具箱旁边发现的相似的脚印印着。 -"
  npc_override_pay_fild08_spirit_handler_free_up_some_space_7908ba: "- 腾出一些空间 -"
  npc_override_pay_fild08_spirit_handler_fun_see_footprints_ebf9e7: "看脚印很有趣吗？"
  npc_override_pay_fild08_spirit_handler_give_him_strawberry_b2b3db: "给他一个草莓。"
  npc_override_pay_fild08_spirit_handler_given_large_deep_footpri_f401a2: "从又大又深的脚印来看，似乎是一只巨大的食草动物。 -"
  npc_override_pay_fild08_spirit_handler_good_animals_d38b6b: "擅长与动物相处。"
  npc_override_pay_fild08_spirit_handler_guy_seriously_7d5f9f: "这家伙，真是的！！！！"
  npc_override_pay_fild08_spirit_handler_haha_be0f1a: "哈哈！"
  npc_override_pay_fild08_spirit_handler_haha_f71aba: "哈哈。"
  npc_override_pay_fild08_spirit_handler_hahahahaha_9e31bd: "哈哈哈哈哈！"
  npc_override_pay_fild08_spirit_handler_hahahahaha_c9de4e: "哈哈哈哈哈！！！"
  npc_override_pay_fild08_spirit_handler_he_grumpy_gentleman_he_w_05d416: "他是个脾气暴躁的绅士，但人并不坏，到底发生了什么事……"
  npc_override_pay_fild08_spirit_handler_he_s_already_over_his_88a235: "他已经忙得不可开交了，他会不会处理这件事？"
  npc_override_pay_fild08_spirit_handler_he_s_only_disturbing_me_785924: "他只是在打扰我，更别说帮我处理我委托给你的事情了。"
  npc_override_pay_fild08_spirit_handler_hehehe_0a5b10: "嘿嘿嘿。"
  npc_override_pay_fild08_spirit_handler_hm_5ea458: "嗯……"
  npc_override_pay_fild08_spirit_handler_hmph_b1be7d: "哼！！！"
  npc_override_pay_fild08_spirit_handler_hold_second_here_ca4fa2: "- 在这里等一下！！ -"
  npc_override_pay_fild08_spirit_handler_how_could_someone_throw_6d8f63: "怎么会有人把食物扔在街上？食物很珍贵，太浪费了！！"
  npc_override_pay_fild08_spirit_handler_how_did_you_get_here_109f1b: "你怎么这么快就到了这里？！"
  npc_override_pay_fild08_spirit_handler_how_did_you_prepare_food_3595e2: "你怎么准备那些食物的！！！"
  npc_override_pay_fild08_spirit_handler_how_long_been_since_you_478f44: "你烤了多久了？你又派人来了吗？！"
  npc_override_pay_fild08_spirit_handler_how_world_could_happen_53705d: "这怎么可能发生……"
  npc_override_pay_fild08_spirit_handler_huh_80ee84: "嗯……"
