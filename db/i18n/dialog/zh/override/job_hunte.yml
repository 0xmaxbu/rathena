Body:

  npc_override_job_hunte_hunter_about_make_df620b: "准备制作"
  npc_override_job_hunte_hunter_after_meeting_lost_perso_1f1a47: "遇到这个迷路的人后，你决定继续狩猎。就在这时，你发现有人正在攻击一只 Boss！"
  npc_override_job_hunte_hunter_agh_e04f67: "啊？！"
  npc_override_job_hunte_hunter_ah_cf07cb: "啊！"
  npc_override_job_hunte_hunter_alas_you_fallen_prey_mos_00048d: "唉，{0}，你成了最可怕的陷阱的猎物。可怕的臭气弹！快跑快跑快跑啊啊啊啊！"
  npc_override_job_hunte_hunter_all_your_preparations_cce1fe: "你所有的准备。"
  npc_override_job_hunte_hunter_alright_then_come_back_m_94e380: "那好吧，准备好了就回来找我～"
  npc_override_job_hunte_hunter_also_here_little_reward_e358c3: "另外，这是一点小奖励，感谢你付出的所有努力。当然是我给的～"
  npc_override_job_hunte_hunter_and_6a514c: "^660000{0} {1}^000000和"
  npc_override_job_hunte_hunter_anyway_i_believe_you_ve_1e497a: "总之，我相信你已经准备好了。我们现在开始吧。"
  npc_override_job_hunte_hunter_as_explained_before_hunt_f67d44: "如前所述，狩猎4只或更多名为^3355FF转职怪物^000000的怪物。完成后，地图中央会出现一个开关。"
  npc_override_job_hunte_hunter_as_mentioned_before_only_7eab24: "如前所述，只狩猎标记为『转职怪物』的怪物。"
  npc_override_job_hunte_hunter_ask_priest_open_free_war_6a5b59: "找一位服事开启免费的传送之门。"
  npc_override_job_hunte_hunter_attack_hode_top_hill_fe471c: "从山顶攻击一只霍德。"
  npc_override_job_hunte_hunter_become_noble_person_beco_a488e3: "成为一个高尚的人，成为猎人公会的优秀代表。以猎人的身份展现你对自然的热爱～"
  npc_override_job_hunte_hunter_been_moved_hugel_schwarz_c75e4b: "已迁移至修葛兰共和国^ff0000修葛拉^000000。"
  npc_override_job_hunte_hunter_beg_here_there_60a329: "到处乞讨。"
  npc_override_job_hunte_hunter_best_way_99b884: "最好的方式"
  npc_override_job_hunte_hunter_boom_bam_boom_you_fallen_e136e7: "砰！啪！砰！{0}，你掉进了我的陷阱！但我不会杀了你……只是……羞辱你一下……"
  npc_override_job_hunte_hunter_canceling_fe8f18: "^3355FF取消"
  npc_override_job_hunte_hunter_cancellation_warp_activa_ac44bc: "！！取消传送启动中……！！"
  npc_override_job_hunte_hunter_careful_traps_when_hunti_42a905: "***** 狩猎时注意陷阱。 *****"
  npc_override_job_hunte_hunter_come_back_1d4835: "回来"
  npc_override_job_hunte_hunter_come_back_once_you_91f3c5: "等你"
  npc_override_job_hunte_hunter_come_back_when_2a5147: "当"
  npc_override_job_hunte_hunter_congratulations_129643: "恭喜～！！"
  npc_override_job_hunte_hunter_did_you_mess_up_517101: "你搞砸了？"
  npc_override_job_hunte_hunter_disconnected_server_you_396acc: "与服务器断开连接。{0}，你得从头开始。"
  npc_override_job_hunte_hunter_eh_why_don_t_i_a8ea27: "嗯？为什么不给你银箭矢？你连材料都没带，就不该指望得到什么。"
  npc_override_job_hunte_hunter_eh_why_won_t_i_054ebc: "嗯？为什么不给你银箭矢？没带材料就别指望了。"
  npc_override_job_hunte_hunter_eh_you_haven_t_had_526e28: "嗯？你作为弓箭手的训练还不够。要成为猎人，你首先需要获得一定的弓箭手经验。"
  npc_override_job_hunte_hunter_eh_you_haven_t_trained_d44953: "嗯？你作为弓箭手的训练还不够。要成为猎人，你首先需要获得更多的弓箭手经验。"
  npc_override_job_hunte_hunter_escape_b4cfe1: "逃脱"
  npc_override_job_hunte_hunter_escape_switch_09bf90: "逃脱开关上。^000000"
  npc_override_job_hunte_hunter_escape_warp_portal_3739f3: "^3355FF逃脱传送门"
  npc_override_job_hunte_hunter_escape_warp_portal_activ_816ceb: "！！逃脱传送门启动完成。！！"
  npc_override_job_hunte_hunter_everything_must_complete_c54173: "所有步骤必须在3分钟内完成。"
  npc_override_job_hunte_hunter_fear_you_too_shall_learn_5b4a81: "别怕{0}，因为你也将学会黑暗面的力量。现在你将返回起点。"
  npc_override_job_hunte_hunter_feel_free_ask_3622ad: "尽管问。"
  npc_override_job_hunte_hunter_first_327447: "首先……"
  npc_override_job_hunte_hunter_follow_yellow_brick_road_eacdd6: "沿着黄砖路走……不对，{0}！！不是那边……回到起点吧。"
  npc_override_job_hunte_hunter_fourth_52ea8c: "第四……"
  npc_override_job_hunte_hunter_gathered_all_items_77722f: "收集了所有物品。"
  npc_override_job_hunte_hunter_gathers_flips_through_pa_ff4e3e: "^3355FF*翻找文件*^000000"
  npc_override_job_hunte_hunter_give_some_my_items_zeny_3b3abf: "给一些我的物品和 Zeny。"
  npc_override_job_hunte_hunter_go_gather_items_test_com_66fc73: "去收集测试所需的物品，参观猎人公会后再回来。"
  npc_override_job_hunte_hunter_go_out_train_yourself_bi_f2de87: "出去多训练一下。你需要至少 Job 等级 40 才能准备好成为猎人。当然，如果你愿意，可以训练得更多。"
  npc_override_job_hunte_hunter_good_day_welcome_hunter_ec9e91: "日安。欢迎来到猎人测试场地。进入下一个房间后测试开始。"
  npc_override_job_hunte_hunter_good_luck_703764: "祝你好运。"
  npc_override_job_hunte_hunter_greetings_they_call_me_d_7c98ef: "幸会。人们称我为……^660000恶魔猎人^000000。我是负责处理申请的人。你的名字是……{0}，对吗？"
  npc_override_job_hunte_hunter_hehe_ac76ba: "嘿嘿～"
  npc_override_job_hunte_hunter_hello_your_local_kafra_w_764ee9: "你好，这里是当地的卡普拉服务人员……{0}，你妈妈在收银台等你。"
  npc_override_job_hunte_hunter_hey_stop_messing_around_281af7: "嘿，别胡闹了。"
  npc_override_job_hunte_hunter_hi_how_you_here_s_36d413: "嗨{0}，你好吗？送你一份礼物～免费传送！回到起点。"
  npc_override_job_hunte_hunter_hmm_9c4d28: "嗯……"
  npc_override_job_hunte_hunter_hmm_e777ce: "嗯？"
  npc_override_job_hunte_hunter_hmm_i_don_t_think_dac2fb: "嗯……我看这事成不了。不懂基本礼仪是当不了猎人的。"
  npc_override_job_hunte_hunter_hmm_i_help_you_if_0edde0: "嗯？我能帮你什么吗？如果你想转职，应该去找弓箭手公会的人，而不是我。"
  npc_override_job_hunte_hunter_hmm_i_think_you_re_86290a: "嗯，我觉得你应该找别人，而不是我。比如我们的会长，他出差去了，你知道吗？"
  npc_override_job_hunte_hunter_hmm_i_ve_been_informed_7111b6: "嗯……我接到通知说你通过了测试。但你没有证明你成就的『智慧项链（穿透）』。"
  npc_override_job_hunte_hunter_hmm_let_s_start_intervie_4b201b: "嗯……我们先开始面试吧。稍等片刻，放松一下。别担心，我会准备好的～"
  npc_override_job_hunte_hunter_hmm_use_arrow_tips_use_a59edd: "嗯。^660000{0} {1}^000000用来做箭尖。^660000{2} {3}^000000用在这里那里。还有^660000{4} {5}^000000，拜托了。"
  npc_override_job_hunte_hunter_hmm_warnings_well_if_you_794b1e: "嗯。警告……好吧，如果你掉进陷阱，就得从头开始。另外，一次只能有一个人参加测试。"
  npc_override_job_hunte_hunter_hmm_you_didn_t_go_524130: "嗯？你没去斐扬中央宫殿或弓箭手公会找会长吗？他应该在两个地方之一，去找他吧。"
  npc_override_job_hunte_hunter_hmm_you_re_archer_almost_7def81: "嗯。你就是那个差点放弃转职的弓箭手。你准备好一切了吧？那我马上送你去参加测试。"
  npc_override_job_hunte_hunter_hmpf_you_must_here_hunte_cba606: "哼。你一定是来参加猎人转职测试的。让我告诉你测试流程。你想了解什么？"
  npc_override_job_hunte_hunter_how_s_your_business_comi_f3c148: "你的事情进展如何？"
  npc_override_job_hunte_hunter_how_you_go_2fcca7: "你会怎么去"
  npc_override_job_hunte_hunter_how_you_go_desert_a5f1bf: "你怎么去沙漠？"
  npc_override_job_hunte_hunter_hunter_applicant_dcb2c3: "一位猎人申请者。"
  npc_override_job_hunte_hunter_hunter_guild_cfcb54: "在猎人公会。"
  npc_override_job_hunte_hunter_i_believe_9bb3f3: "我相信"
  npc_override_job_hunte_hunter_i_don_t_really_any_bde69c: "我目前没有从公会收到任何正式通知，所以我希望你不是专门为此而来的……"
  npc_override_job_hunte_hunter_i_falcon_breeder_moved_o_323008: "我，猎鹰饲养员也已经搬走了。"
  npc_override_job_hunte_hunter_i_heard_he_s_payon_980954: "我听说他在斐扬中央宫殿……或者在弓箭手村，两个地方之一。去那些地方找他吧，好吗？"
  npc_override_job_hunte_hunter_i_help_you_9dd552: "我能帮你"
  npc_override_job_hunte_hunter_i_help_you_bbae62: "……我能帮你吗？"
  npc_override_job_hunte_hunter_i_just_want_know_how_5c3ae7: "我只想知道你对生活的看法，以及你为什么想成为猎人，所以不必紧张。"
  npc_override_job_hunte_hunter_i_ll_let_you_change_759113: "我会让你转职，但你必须不惜一切代价带回『智慧项链（穿透）』。"
  npc_override_job_hunte_hunter_i_ll_recover_some_c279f5: "我会恢复一些"
  npc_override_job_hunte_hunter_i_ll_send_you_right_3b44b0: "我这就送你去。"
  npc_override_job_hunte_hunter_i_ll_send_you_right_9f4fae: "我这就送你去……"
  npc_override_job_hunte_hunter_i_ll_send_you_testing_1cf753: "我会送你去测试地点。那里有等候室，但如果有人正在测试，你必须在聊天室里等待。"
  npc_override_job_hunte_hunter_i_m_glad_say_you_33bc88: "我很高兴地告诉你，你通过了面试～现在，去找角落里的那个人，确认转职测试需要哪些物品～"
  npc_override_job_hunte_hunter_i_m_here_official_busine_c915fb: "我是来办公务的，现在很忙。失陪了……"
  npc_override_job_hunte_hunter_i_mean_good_job_i_3d2dad: "我是说，干得好。我给你证明你通过测试的物品。"
  npc_override_job_hunte_hunter_i_mean_good_job_well_0e6ee2: "我是说，干得好。那么，我给你作为通过测试证明的物品。"
  npc_override_job_hunte_hunter_i_now_change_9f66bd: "我现在就转"
  npc_override_job_hunte_hunter_i_put_spell_you_now_0441a6: "我给你施了咒语{0}，现在你是我的了！从头开始吧。"
  npc_override_job_hunte_hunter_i_right_let_me_put_c7a9c7: "我没说错！让我把你列入候选名单。让我看看～*"
  npc_override_job_hunte_hunter_i_see_you_aren_t_9e8d1c: "看来你不急着成为猎人？我当初成为猎人时，因为太高兴而疯狂地挥舞着弓跑了一个月。嘿嘿～"
  npc_override_job_hunte_hunter_i_see_you_re_hurry_6e7069: "看来你不急着成为猎人。我当初成为猎人的第一个月，因为太高兴而疯狂地挥舞着弓到处跑。嘿嘿～"
  npc_override_job_hunte_hunter_i_send_you_testing_place_5f40a1: "我会送你去测试地点。那里有等候室，但如果有人正在测试，你必须在聊天室里等待。"
  npc_override_job_hunte_hunter_i_want_see_you_become_56a215: "我想看到你成为猎人……！哇～我觉得你穿猎人装一定很好看，所以请快点！"
  npc_override_job_hunte_hunter_i_wasn_t_notified_about_155229: "我没有收到猎人公会的任何特别通知。你不是想跳过猎人测试的中间环节吧？"
  npc_override_job_hunte_hunter_i_wasn_t_notified_hunter_900dc9: "我没有收到猎人公会的任何通知。你不是想跳过猎人测试的中间环节吧？"
  npc_override_job_hunte_hunter_if_person_currently_taki_08c113: "如果当前测试的人通过或失败，聊天室里等待的下一个人就会被送到测试区域。如果没人等待，你进入聊天室后测试就会立即开始。"
  npc_override_job_hunte_hunter_if_person_front_succeeds_e9eaf2: "如果前面的人成功、放弃或失败，聊天室里等待的下一个人就会被送到测试区域。如果没人等待，你进入聊天室后测试就会立即开始。"
  npc_override_job_hunte_hunter_if_s_too_hard_wouldn_1c9cd9: "如果太难了，下次再试也不迟。你想现在放弃吗？"
  npc_override_job_hunte_hunter_if_you_any_257c1b: "如果你有"
  npc_override_job_hunte_hunter_if_you_decide_become_hun_315e08: "如果你决定成为猎人，一定要来看我。我想看到你成为猎人。你一定很好看！！"
  npc_override_job_hunte_hunter_if_you_decide_become_hun_635179: "如果你决定成为猎人，记得来看我，好吗？你很漂亮，但……你当猎人的话会更漂亮。嘿嘿～"
  npc_override_job_hunte_hunter_if_you_faint_middle_fall_8d8868: "如果你中途昏倒、掉进陷阱或超时，就会失败。然后你必须重新参加测试。"
  npc_override_job_hunte_hunter_if_you_still_285b82: "如果你还"
  npc_override_job_hunte_hunter_if_you_wish_change_jobs_ecceae: "如果你想转职，我想你需要去斐扬中央宫殿找那个人。"
  npc_override_job_hunte_hunter_if_you_wish_change_your_87ccd2: "如果你想转职成猎人，必须先登记。"
  npc_override_job_hunte_hunter_into_someone_lost_99b444: "变成了一个迷路的人。"
  npc_override_job_hunte_hunter_items_you_need_965b72: "你需要的物品是"
  npc_override_job_hunte_hunter_job_change_7079c5: "转职"
  npc_override_job_hunte_hunter_job_test_b5dfbd: "转职测试？！"
  npc_override_job_hunte_hunter_just_give_item_demon_hun_3f371c: "把物品交给恶魔猎人，就是在这个区域最左边的那个家伙～"
  npc_override_job_hunte_hunter_just_remember_always_kee_240c8e: "记住要始终保持基本的礼仪。在接下来的测试中更加努力，让我高兴，好吗？"
  npc_override_job_hunte_hunter_keep_trying_52945a: "继续努力。"
  npc_override_job_hunte_hunter_least_job_level_762f2f: "至少 Job 等级 40。"
  npc_override_job_hunte_hunter_leave_if_you_plan_trifle_db67f4: "如果你打算用你的小把戏来戏弄我，就给我离开。难道你不知道你在戏弄的是^660000恶魔猎人^000000吗？！"
  npc_override_job_hunte_hunter_let_s_begin_869d3b: "我们开始吧。"
  npc_override_job_hunte_hunter_let_s_begin_bbae53: "我们开始吧。"
  npc_override_job_hunte_hunter_let_s_say_you_having_5989eb: "假设你在狩猎霍德时遇到了太多麻烦，于是回到了城镇。现在你的生命值耗尽了，刚好有一位服事在旁边。你会怎么请求治疗？"
  npc_override_job_hunte_hunter_listen_carefully_scenari_6c8237: "仔细听我描述的场景。当我提问时，你选择一个答案。很简单，不是吗？"
  npc_override_job_hunte_hunter_long_time_no_see_what_c5ff45: "好久不见～是什么风把你吹来了？你的猎鹰跑丢了还是怎么的？"
  npc_override_job_hunte_hunter_menu_here_2d259a: "面试问题来了～首先，我叫『雪琳』。很高兴认识你！"
  npc_override_job_hunte_hunter_menu_tip_0a9b48: "今日提示:不要踩到陷阱。你会被送回起点。"
  npc_override_job_hunte_hunter_meow_pounce_look_my_kitt_c9c4ad: "喵 *扑* 看我的小猫咪们，我们要把你炖成{0}汤。如果你不想变成汤，就回到起点去！"
  npc_override_job_hunte_hunter_minute_remaining_6338d0: "****** 剩余1分钟。 ******"
  npc_override_job_hunte_hunter_minutes_remaining_50c767: "****** 剩余3分钟。 ******"
  npc_override_job_hunte_hunter_minutes_remaining_f19983: "****** 剩余2分钟。 ******"
  npc_override_job_hunte_hunter_mmm_56bb18: "嗯……？"
  npc_override_job_hunte_hunter_mmm_aren_t_you_archer_4ba5c7: "嗯？你不是上次放弃的那个弓箭手吗？现在准备好了吧？那我马上送你去转职区域。"
  npc_override_job_hunte_hunter_mmm_d579c6: "嗯？"
  npc_override_job_hunte_hunter_mmm_i_see_you_re_2ae0e2: "嗯。看来你是来参加猎人转职测试的。让我解释一下测试流程。你想了解什么？"
  npc_override_job_hunte_hunter_mmm_warnings_well_if_you_166523: "嗯。警告……好吧，如果你掉进陷阱，就得从头开始重新测试。而且一次只能有一个人参加测试。"
  npc_override_job_hunte_hunter_msg_3b93fd: "？？？？"
  npc_override_job_hunte_hunter_msg_45069c: "^660000{0} {1}^000000，"
  npc_override_job_hunte_hunter_msg_82c212: "^660000{0} {1}^000000。"
  npc_override_job_hunte_hunter_msg_b6589f: "0"
  npc_override_job_hunte_hunter_my_eyes_you_you_stepped_c49845: "我的眼睛！！{0}，你……你踩到它们了。再试一次吧……如果我能流泪的话，我会为你哭泣的……"
  npc_override_job_hunte_hunter_my_word_you_ve_precariou_277b72: "天哪，{0}！你危险地掉进了一个陷阱！你会被送回起点。再见～！"
  npc_override_job_hunte_hunter_no_you_fallen_into_trap_5f4d82: "不……{0}，你掉进了陷阱。你会被送回起点。"
  npc_override_job_hunte_hunter_notice_96e00b: "============ 公告 ============"
