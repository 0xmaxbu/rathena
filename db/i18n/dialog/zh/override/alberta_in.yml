  npc_override_alberta_in_quests_alberta_i_m_sure_he_tell_1ca64c: "我相信他能告诉你连我都无法提供的细节……"
  npc_override_alberta_in_quests_alberta_i_m_sure_turtle_island_def56d: "但我确信龟岛确实存在，而且那里可以找到奇妙的东西。"
  npc_override_alberta_in_quests_alberta_i_m_victim_too_696703: "我也是受害者~"
  npc_override_alberta_in_quests_alberta_i_may_know_much_i_9f7291: "我可能知道的不多，但我不会和任何只被贪婪驱动的人说话。回家吧！"
  npc_override_alberta_in_quests_alberta_i_mean_i_m_really_2d49fd: "我是说，我真的在这方面是新手！"
  npc_override_alberta_in_quests_alberta_i_mean_there_s_so_58c37b: "我是说，角可以做很多事情。你可以戴在头上，可以戴在，嗯……你的房子上？各种各样的事情！"
  npc_override_alberta_in_quests_alberta_i_mean_they_don_t_020c40: "我是说，他们甚至不提供'妖怪'，更不用说'库博'了。找到那些精美的特色饮品越来越难。"
  npc_override_alberta_in_quests_alberta_i_met_him_when_i_6fe3dc: "我出去玩的时候遇到他的……"
  npc_override_alberta_in_quests_alberta_i_need_559ee5: "我需要……"
  npc_override_alberta_in_quests_alberta_i_other_food_984b17: "但是，我可以吃其他食物"
  npc_override_alberta_in_quests_alberta_i_rather_stay_home_17aa71: "我宁愿待在家里。"
