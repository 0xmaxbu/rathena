  npc_override_alberta_in_quests_alberta_one_s_records_we_able_cf30b0: "通过 ^3355FF一^000000 的记录，我们能够彻底探索龟岛上所有可见的东西。然而……"
  npc_override_alberta_in_quests_alberta_one_succeeded_417457: "^3355AA'一'，成功了。^000000"
