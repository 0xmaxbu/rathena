  npc_override_alberta_in_quests_alberta_what_you_8f3ab4: "……还有？……你想……"
  npc_override_alberta_in_quests_alberta_what_you_think_about_ani_49ea2d: "你觉得动物角怎么样？哦，伙计，我觉得它们太棒了！你不觉得吗？我非常喜欢动物角，以至于我成为了一名 ^3355FF角收藏家^000000。"
  npc_override_alberta_in_quests_alberta_what_you_trying_say_7a29b8: "你想说什么？"
  npc_override_alberta_in_quests_alberta_what_you_want_say_a2e232: "你想说的……"
  npc_override_alberta_in_quests_alberta_when_he_went_out_friends_c4697a: "当他出去和朋友玩时，"
  npc_override_alberta_in_quests_alberta_when_winds_die_may_your_061742: "当风停息时，愿你的梦想填满你的帆~ 祝你好运！"
  npc_override_alberta_in_quests_alberta_when_you_want_discover_t_044f7b: "当你想要发现真相时，永远不要绝望。如果你永不放弃寻找，答案就会来到你身边。"
  npc_override_alberta_in_quests_alberta_whenever_takuyaka_leads_c779d0: "每当塔库亚卡领导任务时，他总是能搞砸！为什么艾尔贝塔的领袖们喜欢他？！"
  npc_override_alberta_in_quests_alberta_where_could_they_2e3b29: "他们会在哪里……"
  npc_override_alberta_in_quests_alberta_where_could_they_8fd732: "他们会在哪里？……"
  npc_override_alberta_in_quests_alberta_where_did_all_my_men_83189d: "我的人都去哪里了？！"
  npc_override_alberta_in_quests_alberta_where_they_febc8d: "他们在哪里？"
  npc_override_alberta_in_quests_alberta_whew_332ceb: "*呼！*"
  npc_override_alberta_in_quests_alberta_which_message_19ac61: "^3355FF其中一条信息^000000"
  npc_override_alberta_in_quests_alberta_while_two_our_workers_fi_3ff5f9: "当我们两名工人在修理甲板底部时，他们遭到了从甲板裂缝中潜入的怪物的攻击。"
  npc_override_alberta_in_quests_alberta_whoa_2d61c2: "哇……"
  npc_override_alberta_in_quests_alberta_whoah_first_time_i_ve_699df0: "哇~！这是我第一次看到真正的 ^FF3355恶魔角^000000！！"
  npc_override_alberta_in_quests_alberta_why_326e22: "为什么这是"
  npc_override_alberta_in_quests_alberta_why_did_we_attacked_so_ffa64e: "为什么我的第一次任务就要被这么多怪物攻击？我……我只是个新兵……"
  npc_override_alberta_in_quests_alberta_why_don_t_you_look_c23a9d: "你为什么不去酒馆附近看看，找找那个老人？他通常醉醺醺的，说些胡话，但他可能会对你说些什么。"
  npc_override_alberta_in_quests_alberta_why_don_t_you_talk_ca3b34: "你为什么不和一个叫 ^3355FF戈坦布鲁^000000 的胖乎乎的小水手聊聊呢。你可以在艾尔贝塔的某个港口找到他闲逛。"
  npc_override_alberta_in_quests_alberta_why_should_you_b908ee: "为什么你应该"
  npc_override_alberta_in_quests_alberta_why_t_mudasamu_d0d2bc: "为什么穆达萨穆不能"
  npc_override_alberta_in_quests_alberta_why_wasn_t_mudasamu_char_4d6a51: "为什么不是穆达萨穆负责？如果他是领袖，我现在就该回家吃晚饭了……"
  npc_override_alberta_in_quests_alberta_why_you_care_about_me_597f30: "你为什么这么关心我？"
