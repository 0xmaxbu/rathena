  npc_override_alberta_in_quests_alberta_i_still_make_effort_so_30f33b: "我仍然……会努力这样做。"
  npc_override_alberta_in_quests_alberta_i_still_rather_stay_here_20a808: "我仍然宁愿安静地安全地待在这里。"
  npc_override_alberta_in_quests_alberta_i_still_rather_stay_here_a4e9ca: "我仍然宁愿待在这里。"
  npc_override_alberta_in_quests_alberta_i_succeed_3c548c: "^3355AA但我会成功……^000000"
  npc_override_alberta_in_quests_alberta_i_suppose_you_know_about_a8898c: "我猜你知道我寻宝的日子，大概也知道龟岛。"
  npc_override_alberta_in_quests_alberta_i_sweat_i_bleed_alberta_7572fb: "我为艾尔贝塔安全骑士流汗流血，却仍然被塔库亚卡指挥我们的事实折磨着。我恨！"
  npc_override_alberta_in_quests_alberta_i_swordsman_26afc2: "^3355AA我，剑士，^000000"
  npc_override_alberta_in_quests_alberta_i_t_get_delicious_food_f7dd24: "我吃不到美味的食物"
  npc_override_alberta_in_quests_alberta_i_t_understand_why_he_e86d80: "我不明白他为什么喜欢"
  npc_override_alberta_in_quests_alberta_i_tell_you_re_curious_2c4041: "我看得出你对龟岛很好奇。我猜你一定和那个醉酒老人聊过！"
  npc_override_alberta_in_quests_alberta_i_tell_you_secret_becaus_f9c9df: "我会告诉你一个秘密，因为你给了我黄色药水~"
