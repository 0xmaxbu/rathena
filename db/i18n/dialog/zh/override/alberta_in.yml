  npc_override_alberta_in_quests_alberta_i_don_t_want_go_3134e0: "我不想出去。"
  npc_override_alberta_in_quests_alberta_i_don_t_want_hear_7020c3: "我不想……听到任何东西……"
  npc_override_alberta_in_quests_alberta_i_don_t_want_see_7efc12: "我不想再看到那只猫。"
  npc_override_alberta_in_quests_alberta_i_dreams_becoming_great_d03cbe: "我梦想成为一名伟大的骑士，但由于我们的'队长'又胖又没脑子，我们陷入了这种困境。"
  npc_override_alberta_in_quests_alberta_i_found_when_i_secretly_468da0: "我偷偷去森林时发现的。我把它拿走了，因为它颜色很漂亮！"
  npc_override_alberta_in_quests_alberta_i_guess_you_forgot_somew_27d229: "我猜你把什么东西忘在某个地方了……"
  npc_override_alberta_in_quests_alberta_i_had_no_idea_island_a3437d: "我完全没想到这个岛上的怪物比艾尔贝塔附近的强这么多。"
  npc_override_alberta_in_quests_alberta_i_happened_best_navigati_f3ce6c: "我碰巧是最擅长导航的。我当时只有二十岁，但仍然被邀请加入他的团队。能被这些伟大的人平等接纳是一种荣誉。"
  npc_override_alberta_in_quests_alberta_i_hope_he_tells_me_20203e: "我希望他告诉我那天发生了什么。"
  npc_override_alberta_in_quests_alberta_i_hope_they_sell_bananas_3131b1: "我希望他们卖香蕉"
  npc_override_alberta_in_quests_alberta_i_intend_offer_my_gratit_b7c9f0: "我打算向我杀死的怪物的鲜血，以及我在训练中使用的材料表达我的感激之情。"
  npc_override_alberta_in_quests_alberta_i_just_want_make_somethi_0b20e4: "我只是想为黄色药水做点什么，所以我的帽子制作服务不收取你任何 Zeny。"
  npc_override_alberta_in_quests_alberta_i_just_want_make_somethi_135042: "我只是想为你做点好东西，所以我的帽子制作服务不收取你任何 Zeny。"
  npc_override_alberta_in_quests_alberta_i_just_want_make_somethi_b98c80: "我只是想为你做一些非常特别的东西，所以这顶帽子的制作我不收你任何 Zeny。"
  npc_override_alberta_in_quests_alberta_i_know_i_know_you_30e9df: "我知道我知道，你只是想要一个属于自己的抱抱。但如果你一直催我，我就无法专心工作。"
  npc_override_alberta_in_quests_alberta_i_know_what_you_want_6fefd2: "我知道你想说什么……真烦人……"
  npc_override_alberta_in_quests_alberta_i_know_what_you_want_a2af74: "我知道你想说什么……真烦人……"
  npc_override_alberta_in_quests_alberta_i_like_bananas_haha_fdf11a: "我喜欢香蕉。哈哈。"
  npc_override_alberta_in_quests_alberta_i_like_cats_so_i_6362ab: "我喜欢猫，所以我走近了他。"
  npc_override_alberta_in_quests_alberta_i_like_my_house_my_3f8160: "我喜欢我的房子和我的房间。"
  npc_override_alberta_in_quests_alberta_i_like_shine_your_eye_7e7ace: "我喜欢你眼中的光芒，我的孩子！我在你眼中看到了一点我自己的影子。是的……"
  npc_override_alberta_in_quests_alberta_i_ll_try_remember_what_b3be52: "如果你把它带给我，我一定会努力记住伊罗莫最喜欢的食物是什么。"
  npc_override_alberta_in_quests_alberta_i_lot_b9eb67: "我有很多"
  npc_override_alberta_in_quests_alberta_i_love_bananas_b1a35d: "我爱香蕉~"
  npc_override_alberta_in_quests_alberta_i_love_bananas_b28ece: "我爱香蕉~~！"
  npc_override_alberta_in_quests_alberta_i_love_sea_d20719: "我爱大海！"
  npc_override_alberta_in_quests_alberta_i_m_as_adorable_as_1515c9: "我和娃娃一样可爱……"
  npc_override_alberta_in_quests_alberta_i_m_beginning_think_all_1af249: "我开始觉得我所有的同伴都被这里的怪物杀死了……"
