  npc_override_alberta_in_quests_alberta_our_suspicions_confirmed_5942f1: "当我们发现龟岛上的动物不吃我们找到的香蕉时，我们的怀疑得到了证实。"
  npc_override_alberta_in_quests_alberta_our_task_here_save_peopl_600174: "我们在这里的任务是救人，但当我们到达龟岛时，我们遭到了一群怪物的攻击！所以我们都分散了。"
  npc_override_alberta_in_quests_alberta_our_weapon_armor_budget_04aaec: "塔库亚卡每次去自助餐之后，我们的武器和盔甲预算总是用光……为什么我们必须这么悲惨？！"
