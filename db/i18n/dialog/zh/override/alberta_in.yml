  npc_override_alberta_in_quests_alberta_as_we_struggled_fog_we_558a25: "当我们在雾中挣扎时，我们一个接一个地失去了同伴。最后，乔纳丹，你遇到的那个醉酒老人，和我自己是唯一能够返回艾尔贝塔的人。"
