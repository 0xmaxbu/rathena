  npc_override_alberta_in_quests_alberta_jornadan_niliria_man_str_5d2fc8: "^3355FF乔纳丹·尼利里亚^000000 是一个力量和信念兼备的人。他和他的船员收集了所有关于龟岛的线索。"
  npc_override_alberta_in_quests_alberta_jornadan_niliria_one_gre_ca37c4: "乔纳丹·尼利里亚是有史以来最伟大的寻宝者之一，他从世界各地招募人员加入他的船员。我很自豪地说，我们船员的每个成员都是他所在领域的佼佼者。"
