  npc_override_alberta_in_quests_alberta_wait_second_right_now_yo_9f6e3a: "^3355FF等一下！你现在携带的道具太多了。请把一些道具放入卡普拉仓库后再来。^000000"
  npc_override_alberta_in_quests_alberta_wait_wait_0c19c0: "等等。等等……"
  npc_override_alberta_in_quests_alberta_want_go_out_them_a83038: "想和他们一起出去。"
  npc_override_alberta_in_quests_alberta_want_say_me_time_063629: "这次想对我说……"
  npc_override_alberta_in_quests_alberta_way_i_don_t_go_2a9c08: "那样我就不用出去了。"
  npc_override_alberta_in_quests_alberta_way_i_m_pretty_hungry_2eaafa: "顺便说一下，我很饿。为什么艾尔贝塔没有好餐厅？！我听说昆仑有很好的点心……"
  npc_override_alberta_in_quests_alberta_we_decided_seal_away_poi_248e6a: "我们决定把这颗有毒的果实封存起来，但发现即使我们剥了皮，它也不会腐烂。"
  npc_override_alberta_in_quests_alberta_we_finally_found_records_098392: "我们终于找到了我们一直在寻找的记录。"
  npc_override_alberta_in_quests_alberta_we_found_some_kind_fruit_4e4c8c: "我们找到了某种可以吃的果实！它覆盖着某种黄色的皮，看起来像香蕉！"
  npc_override_alberta_in_quests_alberta_we_had_good_plans_missio_8c63ef: "我们对这次任务有很好的计划，由我们的副指挥官穆达萨穆制定。然而，它们被第一指挥官执行得很差。"
  npc_override_alberta_in_quests_alberta_we_having_difficulty_try_a208eb: "我们在寻找任何记录时遇到了困难。第一批来这里的人是否什么都没有写？"
  npc_override_alberta_in_quests_alberta_we_hidden_treasure_we_le_8d8b37: "我们把留下的宝藏藏了起来，以防被盗。"
  npc_override_alberta_in_quests_alberta_we_ll_f9c9ee: "我们会……"
  npc_override_alberta_in_quests_alberta_we_no_idea_why_s_91dda2: "我们不知道它为什么有害，或者为什么它不会腐烂，但它可能具有某种医学或科学价值。"
  npc_override_alberta_in_quests_alberta_we_only_ones_who_did_e60103: "我们是唯一没有绝望的人，顽固地坚持我们的希望。尽管如此，我们纯粹是靠运气找到了回卢恩-米德加尔特的路。"
  npc_override_alberta_in_quests_alberta_we_re_9b37ff: "我们不是"
  npc_override_alberta_in_quests_alberta_we_re_supposed_protect_p_c9be05: "我们应该保护艾尔贝塔的人民。这是我们作为骄傲的安全骑士的职责。"
  npc_override_alberta_in_quests_alberta_we_sailed_day_night_drif_5beb51: "我们日夜航行，漂流了数周，直到有一天，我们被浓得不可思议的雾包围了。我们不知道自己在往哪个方向走，雾也不会散去。"
  npc_override_alberta_in_quests_alberta_we_spent_many_days_searc_b05145: "我们花了很多天寻找它，但找不到任何踪迹。"
  npc_override_alberta_in_quests_alberta_we_spent_month_trying_st_7b1589: "我们花了一个月试图驶过那片雾。当我们终于驶出雾时，我们看到我们到达了龟岛的另一边！"
  npc_override_alberta_in_quests_alberta_we_ve_come_here_rescue_dd1876: "我们来这里是为了营救可能遇到麻烦的寻宝者。然而，我们的队长是我旁边这个猪肉标本。所以我想我预见到了这次任务会失败。"
  npc_override_alberta_in_quests_alberta_we_ve_found_evidence_oth_41904d: "我们发现了其他人曾在这里的证据，我们不是第一批找到龟岛的人。"
  npc_override_alberta_in_quests_alberta_we_wanted_find_out_if_01fe13: "我们想知道关于那个岛的传说是否属实，所以我们抛下一切去学习真相。"
  npc_override_alberta_in_quests_alberta_wear_pride_7df1e4: "骄傲地戴上它~"
  npc_override_alberta_in_quests_alberta_weird_how_d_you_know_6df022: "奇怪。你怎么知道我做时尚眼镜的？我想我一定比我想象的更有名。"
  npc_override_alberta_in_quests_alberta_well_7b1901: "好吧……"
  npc_override_alberta_in_quests_alberta_well_alcohol_pub_here_se_289c0c: "好吧，这里的酒馆酒是二流的，但我得承认，氛围很棒。"
  npc_override_alberta_in_quests_alberta_well_as_you_see_i_736bdc: "好吧，如你所见，我现在有点老了。这些老骨头不如从前了。"
  npc_override_alberta_in_quests_alberta_well_first_i_think_s_23eefc: "好吧，首先我想公平地警告你，龟岛夺走了我伙伴们的生命。是的，我是 ^3355FF乔纳丹·尼利里亚^000000 船员的一员。"
  npc_override_alberta_in_quests_alberta_well_good_luck_278f8c: "好吧，祝你好运！"
  npc_override_alberta_in_quests_alberta_well_hats_i_me_my_d1d9e8: "好吧，我带的帽子是给顾客的。如果我用了它们，我就没什么可卖的了……"
  npc_override_alberta_in_quests_alberta_well_if_spirit_adventure_963f89: "好吧，如果冒险精神碰巧抓住了你，我会在这里等待。"
  npc_override_alberta_in_quests_alberta_well_if_you_happen_find_6e6dbc: "好吧，如果你碰巧找到我部队里的其他人，你能告诉他们我在哪里吗？"
  npc_override_alberta_in_quests_alberta_well_s_fine_although_you_942aa0: "好吧，没关系。虽然你是个粗鲁的家伙，但我会原谅你的。我们大概还会再说话的……"
  npc_override_alberta_in_quests_alberta_well_s_my_story_you_cba2d3: "好吧，这就是我的故事。你知道，如果你想了解更多关于龟岛的事，为什么不去和艾尔贝塔东港的学者聊聊呢？"
  npc_override_alberta_in_quests_alberta_well_then_6f6f3d: "好吧，那么……"
  npc_override_alberta_in_quests_alberta_well_then_see_you_later_32eefa: "好吧，回头见~"
  npc_override_alberta_in_quests_alberta_well_there_s_lot_folklor_7cc870: "好吧，关于那个地方有很多民间传说。有人说那里有一座金山。"
  npc_override_alberta_in_quests_alberta_well_wasn_t_exactly_like_b97db1: "好吧，它不完全像卢恩-米德加尔特的香蕉，但非常相似。"
  npc_override_alberta_in_quests_alberta_well_we_sort_did_because_f07ad2: "好吧，我们算是做了，但那是因为这是我们队长的直接命令！如果一名骑士忠诚而骄傲，他会无条件接受领袖的命令！"
  npc_override_alberta_in_quests_alberta_well_your_name_sounds_be_15c015: "好吧，你的名字比我的好听。而且你头上的头发也比我多。嗯……"
  npc_override_alberta_in_quests_alberta_wh_wh_whaat_3d2160: "什-什-什么？！"
  npc_override_alberta_in_quests_alberta_whaaaaaaaaaaat_ee52fe: "什……么……？"
  npc_override_alberta_in_quests_alberta_what_96051f: "什么？！？"
  npc_override_alberta_in_quests_alberta_what_anything_say_767ad4: "什么？有什么要说的吗？"
  npc_override_alberta_in_quests_alberta_what_big_world_just_huma_0fb936: "多么大的世界……不只是人类……"
  npc_override_alberta_in_quests_alberta_what_c56497: "这是什么"
  npc_override_alberta_in_quests_alberta_what_did_9509aa: "^3355FF什么^000000"
  npc_override_alberta_in_quests_alberta_what_exactly_you_want_me_ab9f2f: "你到底想从我这里得到什么……？"
  npc_override_alberta_in_quests_alberta_what_happened_him_4b7a1a: "他怎么了……？"
  npc_override_alberta_in_quests_alberta_what_happened_last_time_038f2f: "上次发生了什么……"
  npc_override_alberta_in_quests_alberta_what_i_know_about_him_299d8a: "关于他我所知道的。"
  npc_override_alberta_in_quests_alberta_what_i_meant_216db9: "我的意思是"
