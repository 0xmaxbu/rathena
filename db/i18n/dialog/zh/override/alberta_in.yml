  npc_override_alberta_in_quests_alberta_i_think_we_t_anything_583684: "但我想我们什么都做不了"
  npc_override_alberta_in_quests_alberta_i_try_hard_convey_messag_d3ef2b: "-我努力向伊罗莫传达这个信息。-"
  npc_override_alberta_in_quests_alberta_i_ve_collected_almost_ev_b436c5: "我几乎收集了所有种类的角，除了一种，那就是 ^FF3355恶魔角^000000。有人说恶魔角甚至不是来自动物，而是来自恶魔。但即使如此，我仍然想要它。"
  npc_override_alberta_in_quests_alberta_i_ve_come_c04ec9: "^FF3355我来^000000"
  npc_override_alberta_in_quests_alberta_i_ve_cut_turtle_s_a8b686: "^3355AA我切开了龟壳。^000000"
  npc_override_alberta_in_quests_alberta_i_ve_developed_my_mental_76befe: "我发展了我的精神技能，并使用岛上的材料进行训练。磨砺我的心智，我现在知道我可以把这根柱子切成两半。"
  npc_override_alberta_in_quests_alberta_i_ve_heard_many_treasure_4fada1: "我听说龟岛上可以找到很多宝藏。如果我能带足够的回家，我就会富有！嗯，我们 supposed to 营救迷路的冒险者，但无所谓。作为领袖，我可以做任何我想做的事！"
  npc_override_alberta_in_quests_alberta_i_ve_mostly_given_up_7aefc3: "我基本上已经放弃了恢复青春。但还有一线希望……吃 ^3355FF虎脚皮^000000，活力之王！！"
  npc_override_alberta_in_quests_alberta_i_ve_never_seen_doll_04ef2e: "我从未见过这样的娃娃。它来自哪里？嗯？既然我从未见过这种娃娃，我也要给我爸爸看看。嘿嘿~！他会很惊讶的！"
  npc_override_alberta_in_quests_alberta_i_wanna_give_you_714a99: "我想给你"
  npc_override_alberta_in_quests_alberta_i_want_make_something_sp_d6e100: "因为你对我这么好，我想为你做点特别的东西，但我现在没有那样的东西。"
  npc_override_alberta_in_quests_alberta_i_wish_i_could_brother_d73da1: "我希望我能有一个像你这样的哥哥。"
  npc_override_alberta_in_quests_alberta_i_wish_i_could_eat_db16f7: "我希望我能吃10个虎脚皮。那样，我就不必死了！"
  npc_override_alberta_in_quests_alberta_i_wish_i_could_sister_8514af: "我希望我能有一个像你这样的姐姐。"
