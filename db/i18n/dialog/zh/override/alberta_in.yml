  npc_override_alberta_in_quests_alberta_if_someone_helped_me_get_a82171: "如果有人帮我弄到它们，我会毫不犹豫地把我珍贵的 ^3355FF男孩帽^000000 给那个人……"
  npc_override_alberta_in_quests_alberta_if_there_any_forged_item_216db7: "如果有任何锻造物品或带有怪物卡片的插槽物品，请把它们存入你的卡普拉仓库。"
  npc_override_alberta_in_quests_alberta_if_there_forged_items_sl_b122a2: "如果有锻造物品或带有怪物卡片的插槽物品，请把它们存入你的仓库。"
