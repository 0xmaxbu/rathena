  npc_override_alberta_in_quests_alberta_yeah_yeah_you_came_your_934c8c: "是的是的，你是来拿你的时尚眼镜的。只是别催我，否则我就无法专心工作，好吗？"
  npc_override_alberta_in_quests_alberta_you_732e2c: "你……"
