  npc_override_alberta_in_quests_alberta_okay_okay_you_want_your_de6144: "好了好了，你想要你的心形发簪，我正在做。哎呀，如果你一直催我，我就根本无法专心工作，你知道吗？"
  npc_override_alberta_in_quests_alberta_okay_okay_you_win_once_98b564: "好了好了，你赢了。再一次，我作为大师工匠的名声先于我。"
