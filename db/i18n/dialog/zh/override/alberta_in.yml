  npc_override_alberta_in_quests_alberta_oh_you_buy_me_banana_49027f: "哦，你要给我买香蕉？"
  npc_override_alberta_in_quests_alberta_oh_you_civilian_nice_mee_62fcad: "哦？你是平民吗？很高兴认识你。我是艾尔贝塔强大的安全骑士，杰普罗卡特。"
