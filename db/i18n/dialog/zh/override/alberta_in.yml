Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_alberta_in_merchant_absolutely_we_need_young_b68862: "当然，我们需要有热情的年轻人来实现我们获得全球货币量20%的伟大目标。你明白了吗？嗯？"
  npc_override_alberta_in_merchant_ah_how_nostalgic_just_li_0cf30d: "啊~ 真怀念啊。就像以前一样！好了，尽力而为吧！"
  npc_override_alberta_in_merchant_ahh_you_trying_both_ways_5b4783: "啊？你想两边都占吗？"
  npc_override_alberta_in_merchant_because_alive_later_all_a6971b: "因为以后能不能活下去，全看个人能力了。"
  npc_override_alberta_in_merchant_become_merchant_although_b8a13d: "要成为商人，虽然我们的工作是买卖收钱，但你必须至少达到基本技能等级9。"
  npc_override_alberta_in_merchant_congratulations_again_be_6a5c54: "再次恭喜你成为商人公会的成员和我们的同事。从今以后期待你的积极参与！"
  npc_override_alberta_in_merchant_congratulations_becoming_d6b573: "恭喜你成为一名商人！"
  npc_override_alberta_in_merchant_don_t_worry_we_ll_de5194: "别担心，我们永远为你保留着商人的职位。准备好了就回来，好吗？"
  npc_override_alberta_in_merchant_don_t_you_think_we_64a1f0: "你不觉得即使我们只是和钱打交道，也需要学习一些基本技能吗？"
  npc_override_alberta_in_merchant_good_fighting_doesn_t_sp_1b7807: "不擅长战斗，也没有特殊的攻击/恢复技能…… 但商人可以低价买进，然后高价卖出赚钱。"
  npc_override_alberta_in_merchant_good_i_think_you_re_0e5089: "很好，看到你的基本技能等级已经达标，我认为你已经完全准备好了。"
  npc_override_alberta_in_merchant_hey_why_you_here_a79994: "嘿，你怎么在这里？"
  npc_override_alberta_in_merchant_hey_you_didn_t_quit_1276f6: "嘿，你没放弃"
  npc_override_alberta_in_merchant_hmmm_2ac89c: "嗯……"
  npc_override_alberta_in_merchant_how_about_just_giving_yo_c1fb57: "何不回归到本职工作中去呢？"
  npc_override_alberta_in_merchant_huh_i_need_laugh_right_b68df1: "嗯？！……我现在需要笑吗？！"
  npc_override_alberta_in_merchant_i_guess_s_destiny_we_b67ae1: "我想我们能再次这样相遇是命中注定。好吧。再一次，让我将你转职为商人！"
  npc_override_alberta_in_merchant_i_m_so_bored_5df155: "我好无聊……"
  npc_override_alberta_in_merchant_if_you_want_merchant_you_bd644e: "但如果你想成为商人，你的基本技能等级必须达到9级，或者你必须花光所有的技能点。"
  npc_override_alberta_in_merchant_long_time_no_see_432e18: "好久不见！"
  npc_override_alberta_in_merchant_menu_i_20c281: "我想成为商人。:我想了解更多关于商人的信息。:问他成为商人的要求。:没什么。"
  npc_override_alberta_in_merchant_merchant_put_simply_pers_1d59ca: "商人？简单来说，卖东西赚钱的人就是商人。"
  npc_override_alberta_in_merchant_now_i_allow_you_merchant_d12784: "现在我允许你成为商人。"
  npc_override_alberta_in_merchant_seems_you_re_ready_becom_0f8384: "看起来你还没有准备好再次成为商人。先去完成初心者基本技能的学习吧。"
  npc_override_alberta_in_merchant_sigh_7f634d: "^333333*叹气*^000000"
  npc_override_alberta_in_merchant_so_recently_we_decided_a_243407: "所以最近，我们决定让任何想成为商人的初心者都能成为商人。"
  npc_override_alberta_in_merchant_sorry_what_you_saying_2cefd6: "……？抱歉？你在说什么？"
  npc_override_alberta_in_merchant_there_too_many_people_wh_2cc793: "有太多人筹不到那笔钱，一直在哭。"
  npc_override_alberta_in_merchant_want_merchant_hmm_a3ab70: "想成为商人？嗯……"
  npc_override_alberta_in_merchant_we_business_ethics_you_k_4efeac: "我们是有商业道德的，你知道的。"
  npc_override_alberta_in_merchant_well_i_m_just_saying_beecb3: "好吧，我只是说…… 意思就是我们最终要赚很多钱。你们知道的~"
  npc_override_alberta_in_merchant_well_merchant_ultimate_s_5f61c7: "嗯，商人有一个终极技能叫金钱攻击，可以用钱攻击敌人…… 除了弓、法杖和双手剑，我们可以装备所有东西。但我们总是可以买卖那些。"
  npc_override_alberta_in_merchant_well_we_used_receive_sta_a2ea05: "嗯，我们以前是要收取 startup 费的。筹那笔钱不容易吧？"
  npc_override_alberta_in_merchant_what_happened_e9ef65: "发生什么事了？"
  npc_override_alberta_in_merchant_when_i_hear_my_lovely_4b3b80: "我什么时候才能收到我可爱的布莱瑟姆的消息？"
  npc_override_alberta_in_merchant_whoa_2d61c2: "哇……"
  npc_override_alberta_in_merchant_yes_we_merchants_always_d9ea38: "是的…… 我们商人总是想着钱，明白了吗？"
  npc_override_alberta_in_merchant_you_already_merchant_oh_00cfc8: "你已经是商人了。我的天……"
  npc_override_alberta_in_merchant_you_ve_actually_been_val_2e30ce: "你真的去过瓦尔哈拉？！哇，你走了很长的路……"
  npc_override_alberta_in_merchant_your_business_did_you_f5a210: "你的生意，是吗？"
