  npc_override_alberta_in_quests_alberta_order_restore_my_youth_i_9c07fa: "为了恢复青春，我尝试了各种方法，大多是道听途说，但都不起作用。最后，我在灵丹妙药上花了太多 Zeny，结果破产了。"
