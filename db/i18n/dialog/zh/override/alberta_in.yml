  npc_override_alberta_in_quests_alberta_anyway_we_came_here_pure_07f387: "总之，我们怀着最纯粹的意图来到这里。但就在我们到达时，我们遭到了怪物的攻击！由于战斗中的混乱，我的士兵们分散了。"
