  npc_override_alberta_in_quests_alberta_you_all_items_already_if_1f1dc6: "你已经有了所有道具？如果有锻造物品或带有怪物卡片的插槽物品，请把它们存入你的仓库。"
  npc_override_alberta_in_quests_alberta_you_already_possess_come_b111a7: "你已经拥有了彗星，所以我赐予你第一道光……"
  npc_override_alberta_in_quests_alberta_you_already_possess_come_c20fe4: "你已经拥有了彗星和前两道光。最后一道光现在是你的了。"
  npc_override_alberta_in_quests_alberta_you_already_possess_come_edb635: "你已经拥有了彗星和第一道光，所以我现在赐予你第二道光。"
  npc_override_alberta_in_quests_alberta_you_always_carry_so_much_e73960: "你总是带这么多东西吗？先放一些道具，好吗？"
  npc_override_alberta_in_quests_alberta_you_any_stories_about_si_faf139: "你有什么关于兄妹的故事吗？"
  npc_override_alberta_in_quests_alberta_you_anything_give_me_you_5faa5f: "你有什么可以给我的吗？你知道，一些食物或 Zeny？不是我真的需要，只是……哦，算了。也许我们以后会再见面。"
