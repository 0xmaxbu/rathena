Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_alberta_in_merchant_absolutely_we_need_young_b68862: "Absolutely, we need young people who have passion to achieve our great goal for securing 20% of the worldwide currency volume. You get it? Huh?"
  npc_override_alberta_in_merchant_ah_how_nostalgic_just_li_0cf30d: "Ah~ How nostalgic. Just like old times! Alright, do your best!"
  npc_override_alberta_in_merchant_ahh_you_trying_both_ways_5b4783: "Ahh? Are you trying to have both ways?"
  npc_override_alberta_in_merchant_because_alive_later_all_a6971b: "Because to be alive or not later is all up to one's ability."
  npc_override_alberta_in_merchant_become_merchant_although_b8a13d: "To become a merchant, although just selling and receiving money is our job, you must reach at least basic skill level 9."
  npc_override_alberta_in_merchant_congratulations_again_be_6a5c54: "Congratulations again for being a member of the merchant guild and one of our colleagues. I expect your active participation from now on!"
  npc_override_alberta_in_merchant_congratulations_becoming_d6b573: "Congratulations on becoming a merchant!"
  npc_override_alberta_in_merchant_don_t_worry_we_ll_de5194: "Don't worry, we'll always have a Merchant position open for you. Just come back when you're ready, okay?"
  npc_override_alberta_in_merchant_don_t_you_think_we_64a1f0: "Don't you think we need to learn some basic skills although we just deal with money?"
  npc_override_alberta_in_merchant_good_fighting_doesn_t_sp_1b7807: "Not good at fighting and doesn't have special attack/recovery skills... but a merchant can buy things at a low price and then sell them and make money."
  npc_override_alberta_in_merchant_good_i_think_you_re_0e5089: "Good, I think you're fully ready for it seeing that your basic skill level is fulfilled."
  npc_override_alberta_in_merchant_hey_why_you_here_a79994: "Hey, why are you here?"
  npc_override_alberta_in_merchant_hey_you_didn_t_quit_1276f6: "Hey, you didn't quit"
  npc_override_alberta_in_merchant_hmmm_2ac89c: "Hmmm..."
  npc_override_alberta_in_merchant_how_about_just_giving_yo_c1fb57: "How about just giving yourself over to your original job?"
  npc_override_alberta_in_merchant_huh_i_need_laugh_right_b68df1: "Huh?! ...Do I need to laugh right now?!"
  npc_override_alberta_in_merchant_i_guess_s_destiny_we_b67ae1: "I guess it's destiny that we meet like this once more. Alright. Once again, let me change you into a Merchant!"
  npc_override_alberta_in_merchant_i_m_so_bored_5df155: "I'm so bored..."
  npc_override_alberta_in_merchant_if_you_want_merchant_you_bd644e: "But if you want to be a merchant, your basic skill level must reach Level 9 or you must spend all of your skill points."
  npc_override_alberta_in_merchant_long_time_no_see_432e18: "Long time no see!"
  npc_override_alberta_in_merchant_menu_i_20c281: "I want to be a merchant.:I want to know more about merchants.:Ask him the requirements to be a merchant.:Nothing."
  npc_override_alberta_in_merchant_merchant_put_simply_pers_1d59ca: "Merchant? To put it simply, the person who sells good and makes money is a merchant."
  npc_override_alberta_in_merchant_now_i_allow_you_merchant_d12784: "Now I allow you to be a merchant."
  npc_override_alberta_in_merchant_seems_you_re_ready_becom_0f8384: "It seems that you're not ready to become a Merchant again. Go finish learning the Basic Novice Skills first."
  npc_override_alberta_in_merchant_sigh_7f634d: "^333333*Sigh*^000000"
  npc_override_alberta_in_merchant_so_recently_we_decided_a_243407: "So recently, we decided to allow any Novice who wants to be a merchant become one."
  npc_override_alberta_in_merchant_sorry_what_you_saying_2cefd6: ".....? Sorry? What are you saying?"
  npc_override_alberta_in_merchant_there_too_many_people_wh_2cc793: "There were too many people who couldn't gather that money and kept crying."
  npc_override_alberta_in_merchant_want_merchant_hmm_a3ab70: "Want to be a merchant? Hmm..."
  npc_override_alberta_in_merchant_we_business_ethics_you_k_4efeac: "We have business ethics you know."
  npc_override_alberta_in_merchant_well_i_m_just_saying_beecb3: "Well, I'm just saying... it means let's make lots of money in the end. You guys know that~"
  npc_override_alberta_in_merchant_well_merchant_ultimate_s_5f61c7: "Well, a merchant has an ultimate skill called Mammonite which strikes an enemy with his/her money... We can equip everything except Bows, Rods, and Two-Handed Swords. But we can always sell and buy those."
  npc_override_alberta_in_merchant_well_we_used_receive_sta_a2ea05: "Well, we used to receive a start-up fee before. Wasn't it hard to make that money?"
  npc_override_alberta_in_merchant_what_happened_e9ef65: "What happened?"
  npc_override_alberta_in_merchant_when_i_hear_my_lovely_4b3b80: "When will I hear from my lovely Blossom?"
  npc_override_alberta_in_merchant_whoa_2d61c2: "Whoa..."
  npc_override_alberta_in_merchant_yes_we_merchants_always_d9ea38: "Yes... we merchants always have money on our minds, got it?"
  npc_override_alberta_in_merchant_you_already_merchant_oh_00cfc8: "You are already a merchant. Oh my.."
  npc_override_alberta_in_merchant_you_ve_actually_been_val_2e30ce: "You've actually been to Valhalla?! Wow, you've come a long way..."
  npc_override_alberta_in_merchant_your_business_did_you_f5a210: "your business, did you?"
