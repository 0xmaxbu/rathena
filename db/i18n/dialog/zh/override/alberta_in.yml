  npc_override_alberta_in_quests_alberta_yay_cool_66fbcf: "耶，这个酷的"
  npc_override_alberta_in_quests_alberta_yeah_i_guess_s_pretty_83643c: "是啊，我猜听他的故事挺酷的。但如果能在更好的酒馆里听就更酷了。"
  npc_override_alberta_in_quests_alberta_yeah_i_m_hoping_24ea83: "是啊，我希望"
