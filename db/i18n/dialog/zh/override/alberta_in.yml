  npc_override_alberta_in_quests_alberta_if_you_offer_me_evil_b135b0: "如果你给我20个恶魔角，我会从我珍贵的收藏中给你一个 ^3355FF鹿角^000000。那么，成交？"
  npc_override_alberta_in_quests_alberta_if_you_see_any_them_f819c9: "如果你看到他们中的任何一个，告诉他们必须在这里集合！好吗？！"
  npc_override_alberta_in_quests_alberta_if_you_stay_home_nothing_14bc4a: "但如果你待在家里，什么都不会改变。"
  npc_override_alberta_in_quests_alberta_if_you_these_i_make_bd9f38: "如果你有这些，我可以为你做我神奇的'太阳神帽子！'"
  npc_override_alberta_in_quests_alberta_if_you_want_learn_more_d9a987: "如果你想了解更多，为什么不去艾尔贝塔港的东端呢？那里有一位学者知道更多这个故事。"
  npc_override_alberta_in_quests_alberta_if_you_wish_me_guide_1adfa2: "如果你希望我带你去那里，我会收取 10,000 Zeny。我是唯一能安全带你往返的导航员。"
