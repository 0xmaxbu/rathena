  npc_override_alberta_in_quests_alberta_if_anything_i_feel_even_5d500d: "如果有什么的话，我感觉更糟了。我、我脑子里有嗡嗡声……"
  npc_override_alberta_in_quests_alberta_if_he_argument_me_42c31b: "如果他和我吵架，"
  npc_override_alberta_in_quests_alberta_if_he_asks_you_buy_fe3bd3: "但如果他让你请他喝酒，我不会这么做。他好像有三个额外的肝脏什么的，所以他会把你喝到破产。"
