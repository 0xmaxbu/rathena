Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@gl_k_OldGlastHeim_aaarrrrrhhhh_cc497b: "啊——————"
  npc_override_1@gl_k_OldGlastHeim_actually_dimensional_tim_adaa6a: "其实，次元时间旅行是可能的，但我太害怕了不敢去那里。"
  npc_override_1@gl_k_OldGlastHeim_after_time_gap_opens_ple_e8e945: "时间裂缝开启后，请再告诉我一次。"
  npc_override_1@gl_k_OldGlastHeim_ah_i_m_sorry_i_cfddf6: "啊，抱歉。我在陌生人面前自言自语了。"
  npc_override_1@gl_k_OldGlastHeim_ah_yes_i_am_herico_c37b52: "啊是的，我是。赫里科让我来见你。"
  npc_override_1@gl_k_OldGlastHeim_all_i_could_just_hide_32e626: "我能做的只有……躲在这里……什么，我什么都做不到……"
  npc_override_1@gl_k_OldGlastHeim_all_traces_access_old_gl_1e8c85: "^0000ff所有进入旧克雷斯特汉姆古城的痕迹已被清除。现在你可以再次与胡金对话。^000000"
  npc_override_1@gl_k_OldGlastHeim_amazing_you_made_all_way_3eec02: "太厉害了~你一路走到了这里。我能说声谢谢吗？"
  npc_override_1@gl_k_OldGlastHeim_amdarais_hp_reach_090efd: "安德拉伊斯生命值达到{0}%！"
  npc_override_1@gl_k_OldGlastHeim_anyway_important_gap_tim_4cf1e7: "总之，那不重要。时间裂缝即将关闭，我们必须离开这里。"
  npc_override_1@gl_k_OldGlastHeim_aren_t_you_adventurer_ca_f88c7c: "你不是和瓦尔蒙特一起来的那个冒险者吗？"
  npc_override_1@gl_k_OldGlastHeim_arrgg_my_body_20355a: "啊……我的身体"
  npc_override_1@gl_k_OldGlastHeim_chamberlains_monks_they_a79d77: "侍从们……僧侣们……他们都变成了怪物。我什么都做不了。"
  npc_override_1@gl_k_OldGlastHeim_crack_looks_suspicious_n_9fc855: "裂缝看起来很可疑，但没什么可检查的了。"
  npc_override_1@gl_k_OldGlastHeim_dead_go_where_dead_belon_f7a4c2: "死者该回死者该去的地方！所有人都回去！"
  npc_override_1@gl_k_OldGlastHeim_dead_man_s_valkyrie_hime_30391b: "亡者的瓦尔基里，希梅尔梅斯正前来夺取藏在这座城堡内的伊米尔心脏碎片！"
  npc_override_1@gl_k_OldGlastHeim_demolition_death_090c61: "毁灭……死亡！……"
  npc_override_1@gl_k_OldGlastHeim_die_you_shall_die_b6bb03: "死吧！！你们都得死！！！"
  npc_override_1@gl_k_OldGlastHeim_doesn_t_castle_seem_weir_c5a8b5: "这座城堡是不是突然变得很奇怪？有点不对劲。"
  npc_override_1@gl_k_OldGlastHeim_don_t_leave_me_alone_253e71: "别丢下我一个人，帮帮我。"
  npc_override_1@gl_k_OldGlastHeim_don_t_look_me_nervous_751e5d: "别用那种紧张的眼神看我。很快就会结束的……"
  npc_override_1@gl_k_OldGlastHeim_east_passage_alone_how_8c4ec9: "去东边通道？一个人？怎么可能？"
  npc_override_1@gl_k_OldGlastHeim_echoing_comes_deep_insid_5941d6: "骑士神殿的深处传来回声。"
  npc_override_1@gl_k_OldGlastHeim_eeeeee_eee_die_die_4619eb: "呃……呃……死……死……"
  npc_override_1@gl_k_OldGlastHeim_even_if_you_don_t_4924f3: "即使你不相信我……"
  npc_override_1@gl_k_OldGlastHeim_evil_forces_appearing_ar_400f82: "邪恶力量正在这个区域出现。"
  npc_override_1@gl_k_OldGlastHeim_evil_presence_teleported_f51aef: "一股邪恶的存在已传送到这个区域。"
  npc_override_1@gl_k_OldGlastHeim_gerhalt_s_body_changing_5bb8cb: "格哈特的正在变化。"
  npc_override_1@gl_k_OldGlastHeim_grrrrrrhh_8893e2: "咕噜噜呃~~~"
  npc_override_1@gl_k_OldGlastHeim_haha_funny_you_really_th_81f3c3: "哈哈。好笑。你真的认为那可能吗？"
  npc_override_1@gl_k_OldGlastHeim_heinrich_you_castle_now_6169d8: "海因里希，你现在在城堡里……"
  npc_override_1@gl_k_OldGlastHeim_here_s_weapon_just_close_78e481: "给你武器。闭上眼睛对那些怪物挥砍就行了。"
  npc_override_1@gl_k_OldGlastHeim_herico_didn_t_tell_you_f0b350: "赫里科没告诉你吗？"
  npc_override_1@gl_k_OldGlastHeim_himelmez_6dbb5f: "希梅尔梅斯……"
  npc_override_1@gl_k_OldGlastHeim_himelmez_i_never_forget_95d94c: "希梅尔梅斯……我永远不会忘记你对我的人所做的一切。"
  npc_override_1@gl_k_OldGlastHeim_himelmez_s_closed_space_3e1908: "希梅尔梅斯的封闭空间遍布各处……"
  npc_override_1@gl_k_OldGlastHeim_himelmez_s_curse_getting_96fd20: "希梅尔梅斯的诅咒正在减弱。寻找幸存者！"
  npc_override_1@gl_k_OldGlastHeim_himelmez_s_invasion_7e7673: "希梅尔梅斯的入侵……"
  npc_override_1@gl_k_OldGlastHeim_hm_you_very_well_first_03f124: "嗯，你很厉害。首先，让我给你一些安德拉伊斯的战利品。"
  npc_override_1@gl_k_OldGlastHeim_hold_you_only_survivor_e0193a: "等等！你是唯一的幸存者吗？"
  npc_override_1@gl_k_OldGlastHeim_how_many_times_i_done_753a4e: "这项工作我做了多少次？在梦里，我一遍又一遍地做……"
  npc_override_1@gl_k_OldGlastHeim_how_you_know_varmundt_i_33b73f: "你怎么认识瓦尔蒙特的？我听说他不是一个很好相处的人……"
  npc_override_1@gl_k_OldGlastHeim_however_we_never_overloo_301fd7: "然而，我们现在和永远不会忽视他的行为……"
  npc_override_1@gl_k_OldGlastHeim_hurry_report_sir_heinric_083269: "快！向海因里希大人报告希梅尔梅斯的事。我必须检查这里的防御屏障！"
  npc_override_1@gl_k_OldGlastHeim_i_am_so_thirsty_ca047e: "我好渴。"
  npc_override_1@gl_k_OldGlastHeim_i_don_t_care_about_ba685e: "我不在乎历史"
  npc_override_1@gl_k_OldGlastHeim_i_don_t_want_i_33f253: "我不想……我不想杀任何人。呜呜呜"
  npc_override_1@gl_k_OldGlastHeim_i_feel_sick_my_stomach_497697: "我觉得恶心想吐 呃"
  npc_override_1@gl_k_OldGlastHeim_i_give_you_weapon_e7305a: "我给你武器。"
  npc_override_1@gl_k_OldGlastHeim_i_guess_i_trust_you_15ea61: "我想我可以信任你。我们马上离开吧。"
  npc_override_1@gl_k_OldGlastHeim_i_guess_impossible_stop_2cb46d: "我想就这样了。不可能阻止时间旅行者的意志吗？！"
  npc_override_1@gl_k_OldGlastHeim_i_had_weird_dream_last_f84cf3: "昨晚我做了一个奇怪的梦。我妈妈在里面……不知道她好不好……"
  npc_override_1@gl_k_OldGlastHeim_i_knew_you_understand_wh_940ddd: "我就知道你会明白我说的话。好吧，请告诉我你想做什么。"
  npc_override_1@gl_k_OldGlastHeim_i_like_chat_during_work_d5b9f3: "我不工作时不喜欢聊天。"
  npc_override_1@gl_k_OldGlastHeim_i_m_kidding_sir_heinrich_d30172: "我没开玩笑，海因里希大人。如果我没猜错，她很快就会到这里。"
  npc_override_1@gl_k_OldGlastHeim_i_m_sure_i_trust_94b7e3: "我确定我可以信任你。我们马上离开吧。"
  npc_override_1@gl_k_OldGlastHeim_i_miss_my_sister_bf3ce4: "我想我妹妹了……"
  npc_override_1@gl_k_OldGlastHeim_i_t_make_you_believe_6ad977: "我无法让你相信我，但没时间争论了！"
  npc_override_1@gl_k_OldGlastHeim_i_ve_seen_you_910a25: "我见过你，{0}。"
  npc_override_1@gl_k_OldGlastHeim_item_extraordinary_aura_f472d4: "这件物品散发着非凡的气息。对某些特殊的人来说可能非常有用。"
  npc_override_1@gl_k_OldGlastHeim_kkkrrrruughgh_02a0de: "喀……呃……"
  npc_override_1@gl_k_OldGlastHeim_long_time_ago_castle_did_6b54b1: "很久以前，这座城堡不是这样的。"
  npc_override_1@gl_k_OldGlastHeim_maybe_level_9a0338: "也许，130级。"
  npc_override_1@gl_k_OldGlastHeim_maybe_poor_time_traveler_a3afb0: "也许这个可怜的时间旅行者会试图阻止克雷斯特汉姆古城的悲剧发生。"
  npc_override_1@gl_k_OldGlastHeim_memorial_dungeon_old_gla_365245: "纪念副本'旧克雷斯特汉姆古城'已在进行中。"
  npc_override_1@gl_k_OldGlastHeim_menu_altar_11713f: "祭坛侍者多蒙：侍从们……僧侣们……他们都变成了怪物。我什么都做不了。"
  npc_override_1@gl_k_OldGlastHeim_menu_altar_1fd50a: "祭坛侍者多蒙：我能做的只有……躲在这里……什么，我什么都做不到……"
  npc_override_1@gl_k_OldGlastHeim_menu_altar_c372f6: "祭坛侍者多蒙：好，我……我试试。"
  npc_override_1@gl_k_OldGlastHeim_menu_altar_ce534d: "祭坛侍者多蒙：去东边通道？一个人？怎么可能？"
  npc_override_1@gl_k_OldGlastHeim_menu_gerhalt_4b5c4a: "格哈特：司令官……来吧，你必须逃离这里……呃。"
  npc_override_1@gl_k_OldGlastHeim_menu_gerhalt_5d18f1: "格哈特：喀啊！快跑！我再也忍受不了了！"
  npc_override_1@gl_k_OldGlastHeim_menu_gerhalt_ee215e: "格哈特：你可以占有我的身体，但你夺不走我的灵魂，希梅尔梅斯！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_07d803: "海因里希：希梅尔梅斯！我们不会让你逃走的！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_095b1a: "海因里希：你在对我的士兵做什么，希梅尔梅斯！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_205e53: "海因里希：瓦尔蒙特说得对。现在不是哀悼的时候。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_2fb3dc: "海因里希：这种行为是不可原谅的。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_345e28: "海因里希：但是，这里可能还有幸存者。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_37f6ba: "海因里希：瓦尔蒙特和我会追击希梅尔梅斯。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_3abf1e: "海因里希：她可能已经知道伊米尔心脏碎片在哪里了。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_3e34e8: "海因里希：我永远不会让你逃走的，希梅尔梅斯！！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_419db0: "海因里希：什么……这些是！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_45298f: "海因里希：我永远不会原谅你。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_4abd2f: "海因里希：现在你想欺骗我，他发生了什么事？！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_5b2235: "海因里希：谢谢你的帮助。但我们现在甚至没有国王在身边。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_5cd0f9: "海因里希：我有一个请求要告诉你们这些随从。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_5fcf59: "海因里希：什么？"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_65f724: "海因里希：哈哈。好笑。你真的认为那可能吗？"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_679662: "海因里希：我已经消灭了我所有的士兵，也许还有更多……"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_72bd7f: "海因里希：瓦尔蒙特大人！帮助那些冒险者。我会去追击希梅尔梅斯！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_94f619: "海因里希：让他走！我不想再看到任何人受苦！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_97eb47: "海因里希：希梅尔梅斯可以将生物变成怪物。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_9824b5: "海因里希：格哈特！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_a3503b: "海因里希：你是谁？"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_a3f422: "海因里希：我很抱歉……"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_a775b7: "海因里希：消灭怪物并寻找幸存者。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_a9b89f: "海因里希：作为死亡之主，你是不是有点太女性化了？我们不怕你……"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_aa6568: "海因里希：我们试图摧毁它，但它真的很坚固。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_c081de: "海因里希：我们不能仅仅因为一个陌生人说的话就冒险移动心脏。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_d7c976: "海因里希：……"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_d8a9f7: "海因里希：对不起，我的骑士们！原谅我！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_dbb7a1: "海因里希：我杀了我自己的人……"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_dbdfe0: "海因里希：我的人……这不可能发生！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_e53f74: "海因里希：什么事？城堡出问题了吗？"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_e8210f: "海因里希：很好，瓦尔蒙特。我们去找到希梅尔梅斯。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_e8cfda: "海因里希：希梅尔梅斯！你已经得到了你想要的，所以不再需要牺牲了！"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_e9442c: "海因里希：你不是和瓦尔蒙特一起来的那个冒险者吗？"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_ecf281: "海因里希：所有卡利茨堡骑士和白骑士现在都应该跟我来……"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_f385b6: "海因里希：我的国王正在拜访卢恩-米德加尔特王室。他还没回来。"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_fb51e8: "海因里希：这座城堡以前没有这种结构！"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_0a6bfa: "希梅尔梅斯：嗯，现在我引起你的注意了吧？"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_0fa0b1: "希梅尔梅斯：如果他不打扰我，事情会快得多。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_10c154: "希梅尔梅斯：他让我的生活变得困难。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_1c2ea7: "希梅尔梅斯：你不想要王位，就等他回来吧。我喜欢你的纯洁。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_21e345: "希梅尔梅斯：保重~，希望有机会再见，海因里希。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_289c25: "希梅尔梅斯：呵呵，我已经找到了一块伊米尔的心脏碎片，海因里希。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_2d3f3a: "希梅尔梅斯：真的吗？你为什么这么想？"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_3dccc7: "希梅尔梅斯：总之，我们有机会再见的，因为我们还需要多聊聊。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_479cd0: "希梅尔梅斯：我的名字是丽莎·卡恩·希梅尔梅斯。杜拉汉的主人，亡者的瓦尔基里，他们是这么叫我的。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_59ad84: "希梅尔梅斯：猜你要么是运气好，要么是实力强，才能走到这么远。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_5ab906: "希梅尔梅斯：嗯~我很想坐下来给你解释，但我今天有点忙~"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_6661b1: "希梅尔梅斯：在这种情况下见到你真遗憾。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_6ae749: "希梅尔梅斯：让我的新玩具招待你们，我先走了。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_6e199f: "希梅尔梅斯：太厉害了~我以为你们根本走不到这里……"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_75ab88: "希梅尔梅斯：但那无所谓。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_a649e8: "希梅尔梅斯：我会在城堡北边等你。我想看看你的运气有多好。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_a7fd75: "希梅尔梅斯：不错。我以为你现在已经被我的 creatures 杀死了~"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_af029d: "希梅尔梅斯：我有事要处理。我的 minions 会替我好好招待你们的~"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_b53d1b: "希梅尔梅斯：哈哈哈，担心你自己吧。你以为我在这里一个人吗？"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_b6cc3b: "希梅尔梅斯：唔唔~我好怕怕哦。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_ca996b: "希梅尔梅斯：再见了， boys。"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_d19303: "希梅尔梅斯：等你发现你的国王在哪里后，看你还 relaxed 不 relaxed 得起来。"
