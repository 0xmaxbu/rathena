Body:
  npc_override_card_separation_card_separation_addition_oil_so_useful_s_3239d6: "此外，这种油对于从装备武器中分离遗物非常有用，以至于我们无法用Zeny购买高级润滑剂和普通润滑剂。"
  npc_override_card_separation_card_separation_all_results_card_separat_703720: "卡片分离的结果就是这样。请下次再来。"
  npc_override_card_separation_card_separation_card_been_damaged_unreco_4909af: "卡片已损坏。^ff0000不可恢复。^000000"
  npc_override_card_separation_card_separation_card_equipped_you_want_c_d7c415: "卡片未装备。你想再检查一下吗？"
  npc_override_card_separation_card_separation_card_separation_succeede_c6b28c: "^0000ff卡片分离成功。^000000"
  npc_override_card_separation_card_separation_crack_occurred_during_ca_83188a: "卡片分离过程中出现了裂缝。"
  npc_override_card_separation_card_separation_crack_occurred_during_ca_f9d78d: "卡片分离过程中未出现裂缝。"
  npc_override_card_separation_card_separation_equipment_been_damaged_u_21ae27: "装备已损坏。^ff0000不可恢复。^000000"
  npc_override_card_separation_card_separation_equipment_contains_preci_86f185: "这件装备含有一张珍贵的MVP卡片。这张卡片无法用润滑剂分离。如果你带来超级表面活性剂^0000ffSillit Pong^000000，我就能帮你处理。"
  npc_override_card_separation_card_separation_equipment_separation_nor_a1097b: "^0000FF装备分离正常。^000000"
  npc_override_card_separation_card_separation_erosion_surface_occurred_48c6d3: "卡片分离过程中表面发生了腐蚀。"
  npc_override_card_separation_card_separation_erosion_surface_occurred_c66675: "卡片分离过程中表面未发生腐蚀。"
  npc_override_card_separation_card_separation_generally_fee_zeny_durin_49eaa8: "一般费用是1,000,000 Zeny。在卡片分离过程中，你可以使用^990000减少破坏装备或卡片几率的特殊物品^000000。我们不收取额外费用。"
  npc_override_card_separation_card_separation_hehe_everyone_loves_ther_5ae4cd: "嘿嘿……大家都喜欢。但以前出过一些问题。"
  npc_override_card_separation_card_separation_however_after_revitalizi_c87c39: "然而，经过活性精炼处理后，这种鱼油变成了有价值的老装备护理和工业润滑剂。"
  npc_override_card_separation_card_separation_i_knew_well_limited_666de3: "我很清楚。有这么稀缺吗？"
  npc_override_card_separation_card_separation_i_learned_new_skill_sepa_39935e: "我学会了一项新技能，可以从铠甲、鞋子、披风和头饰中分离卡片。你想试试吗？"
  npc_override_card_separation_card_separation_i_m_sure_about_quality_f434ed: "我不确定成功率。反正这么便宜，对吧？"
  npc_override_card_separation_card_separation_if_you_use_ordinary_lubr_a3ff0f: "如果你使用普通润滑剂，破坏率会大幅降低，但我无法给你100%的保证。你确定要继续吗？"
  npc_override_card_separation_card_separation_if_you_use_premium_lubri_e7ccd7: "如果你使用高级润滑剂，破坏率会大幅降低，但我无法给你100%的保证。你确定要继续吗？"
  npc_override_card_separation_card_separation_jeremy_stretching_his_sh_eb6dfc: "^000099杰里米正在伸展肩膀和双手。他可能在等人和他聊天。^000000"
  npc_override_card_separation_card_separation_long_time_no_see_a118c8: "好久不见~"
  npc_override_card_separation_card_separation_may_i_continue_d56a10: "我可以继续吗？"
  npc_override_card_separation_card_separation_menu_except_1ad0e1: "除了卡片外，^ff0000所有附魔效果都会消失。^000000如果你同意，请选择工作类型:"
  npc_override_card_separation_card_separation_menu_next_67cc4c: "下次吧……:我有一个Sillit Pong。"
  npc_override_card_separation_card_separation_menu_next_bdbee2: "下次吧……:{0}"
  npc_override_card_separation_card_separation_menu_next_f68c59: "下次吧……:继续"
  npc_override_card_separation_card_separation_menu_stop_73fe84: "停止工作:{0}"
  npc_override_card_separation_card_separation_menu_stop_978f4e: "停止工作:{0}:{1}"
  npc_override_card_separation_card_separation_msg_e58d6d: "-------------------"
  npc_override_card_separation_card_separation_no_fish_any_problem_prob_36e945: "不，鱼没有问题。问题是加工后产生了大量鱼油。那是一种工业废料。"
  npc_override_card_separation_card_separation_part_there_nothing_9874dc: "这部分，什么都没有？"
  npc_override_card_separation_card_separation_please_choose_working_fe_1e777b: "请选择工作费用。"
  npc_override_card_separation_card_separation_pretty_old_equipment_the_6857ea: "这是相当旧的装备。工作过程中有很高的几率破坏卡片或装备。你确定要继续吗？"
  npc_override_card_separation_card_separation_problems_there_any_fault_2fa9ac: "问题？有什么有问题的鱼吗？"
  npc_override_card_separation_card_separation_result_card_separation_02a1eb: "-- 卡片分离结果 --"
  npc_override_card_separation_card_separation_silly_jeremy_want_touch_0cc8fc: "傻杰里米不想碰武器和盾牌，因为可能会挑出损坏的卡片。这就是为什么我为武器和盾牌准备了卡片分离技能……"
  npc_override_card_separation_card_separation_socket_equipped_any_card_6d46b1: "这个插槽没有装备任何卡片。你不再检查一下吗？"
  npc_override_card_separation_card_separation_t_continue_because_you_t_3c4e30: "因为你的物品太重太多，无法继续。减轻重量后再试吧。"
  npc_override_card_separation_card_separation_there_nothing_part_b19986: "那部分什么都没有？"
  npc_override_card_separation_card_separation_there_possibility_destro_a56825: "即使使用特殊物品也有可能破坏它们。另外，^ff0000精炼等级可能会丢失^000000。你有什么装备要分离吗？"
  npc_override_card_separation_card_separation_well_don_t_worry_about_e4df5f: "嗯，别担心钱。高级润滑剂确实很贵。如果你付一些Zeny，我可以给你更便宜的润滑剂。"
  npc_override_card_separation_card_separation_whenever_you_need_work_p_998378: "任何时候需要工作，请找我。"
  npc_override_card_separation_card_separation_whenever_you_need_work_v_d6b13b: "任何时候需要工作，来这里找我。"
  npc_override_card_separation_card_separation_which_number_socket_you_d3bae7: "你想从哪个插槽号分离卡片？从左边的插槽开始，依次为1,2,3,4。"
  npc_override_card_separation_card_separation_you_don_t_enough_zeny_ec3808: "你的Zeny不够。请带够费用再来。"
  npc_override_card_separation_card_separation_you_don_t_ordinary_lubri_322df6: "你没有普通润滑剂。"
  npc_override_card_separation_card_separation_you_don_t_premium_lubric_58b7ba: "你没有高级润滑剂。"
  npc_override_card_separation_card_separation_you_don_t_sillit_pong_2b14c1: "你没有Sillit Pong。"
  npc_override_card_separation_card_separation_you_know_malangdo_s_spec_7713dc: "你知道玛琅多的特产是罐头食品吗？"
  npc_override_card_separation_card_separation_you_too_many_kinds_objec_6d01b2: "你的物品种类太多了。减少物品后再试吧。"
  npc_override_card_separation_card_separation_you_wonder_what_so_speci_ad7220: "你想知道有什么特别的。好吧，我只给指南太吝啬了，让我给你讲讲这个故事……"
