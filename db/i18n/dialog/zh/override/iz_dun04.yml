Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_iz_dun04_iz_dun_cautious_good_luck_16e574: "小心点，祝你好运。"
  npc_override_iz_dun04_iz_dun_come_back_when_you_re_26a06f: "准备好后再回来。"
  npc_override_iz_dun04_iz_dun_halt_4d1bb4: "站住！"
  npc_override_iz_dun04_iz_dun_if_you_see_kraken_sure_721215: "如果你看到克拉肯，一定要让你的朋友帮忙，或者像我们一样逃跑。"
  npc_override_iz_dun04_iz_dun_menu_release_369d4a: "释放克拉肯！:我待在这里。"
  npc_override_iz_dun04_iz_dun_menu_yes_d739fb: "是！:不，我待在这里。"
  npc_override_iz_dun04_iz_dun_monsters_here_between_le_a43f43: "这里的怪物等级在110到124之间。"
  npc_override_iz_dun04_iz_dun_s_always_best_prepared_b_7353a2: "探索新区域之前最好做好准备。"
  npc_override_iz_dun04_iz_dun_safe_adventurer_2e6d8c: "注意安全，冒险者。"
  npc_override_iz_dun04_iz_dun_so_i_guess_you_want_c41d3f: "所以我想你想回到第五层？"
  npc_override_iz_dun04_iz_dun_we_ve_discovered_new_flo_a0336f: "我们发现了这座水下城市的新楼层。"
  npc_override_iz_dun04_iz_dun_what_brings_you_here_adv_a4f22b: "什么风把你吹到这里来了，冒险者？"
  npc_override_iz_dun04_iz_dun_you_must_beware_kraken_3b580b: "而且你必须小心克拉肯！"
  npc_override_iz_dun04_iz_dun_you_re_braver_than_i_bf78eb: "你比我想象的勇敢。"
  npc_override_iz_dun04_iz_dun_you_re_going_b04204: "你不走了？"
  npc_override_iz_dun04_iz_dun_you_think_you_re_up_686e4c: "你觉得你能应付这个挑战吗？"