Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job_gun_rebellion_ah_you_lost_you_need_ad214d: "Ah? Are you lost? You need to register first and then get back here."
  npc_override_job_gun_rebellion_all_right_care_shot_vodk_c041ed: "All right. Care for a shot of vodka?"
  npc_override_job_gun_rebellion_among_all_targets_you_mu_342d19: "Among all the targets, you must shoot only the ^0000ffStandard-issue Targets^000000. If you make a mistake, you'll lose points."
  npc_override_job_gun_rebellion_and_f0fa6b: "And..."
  npc_override_job_gun_rebellion_any_leftover_steel_artif_f0192f: "Any leftover Steel Artifacts must be returned after the test."
  npc_override_job_gun_rebellion_authorized_user_abort_op_f2257a: "Not an authorized user. Abort the operation."
  npc_override_job_gun_rebellion_becoming_rebellion_your_4e2c61: "And by becoming a Rebellion your life should be upgraded. So, go and create a great journey, make us proud!"
  npc_override_job_gun_rebellion_bouncer_examines_your_fa_379808: "^0000ffThe bouncer examines your face.^000000"
  npc_override_job_gun_rebellion_carefree_spirits_afd0e7: "Carefree spirits!"
  npc_override_job_gun_rebellion_come_back_when_you_aren_43da10: "Come back when you aren't in any form."
  npc_override_job_gun_rebellion_don_t_say_i_look_9f82fd: "Don't say I look like a blacksmith you know."
  npc_override_job_gun_rebellion_einbroch_private_pub_rel_eee532: "The ^0000ffEinbroch Private Pub^000000 has released that wanted poster. You have many bounty hunters like me on your heels."
  npc_override_job_gun_rebellion_elwin_see_you_turn_into_c6fcee: "^0000ffElwin see you turn into another form and she is very angry. Wait for your current form ends, and then find her again.^000000"
  npc_override_job_gun_rebellion_elwin_wants_you_take_goo_6699a7: "And Elwin wants you to have this. Take good care of it. He made it for you."
  npc_override_job_gun_rebellion_failed_create_firearm_e917ae: "Failed to create a firearm."
  npc_override_job_gun_rebellion_finally_i_ve_found_you_2ee8ad: "Finally I've found you, Vagabond Spike! Your neck is mine!"
  npc_override_job_gun_rebellion_follow_me_f3c136: "Follow me."
  npc_override_job_gun_rebellion_forget_resemblance_where_fc99b3: "Forget the resemblance. Where did you get that poster? I've never committed a crime."
  npc_override_job_gun_rebellion_gasp_you_i_thought_you_d8c1d4: "*Gasp* You! I thought you were already captured. Ooh, doesn't matter now. You're my Get Out of Jail Free card!"
  npc_override_job_gun_rebellion_go_ahead_stay_out_troubl_bc024f: "Go ahead. Stay out of trouble."
  npc_override_job_gun_rebellion_good_job_i_didn_t_45afc6: "Good job. I didn't think you could pass so quickly."
  npc_override_job_gun_rebellion_good_now_follow_me_f3a586: "Good. Now, follow me."
  npc_override_job_gun_rebellion_good_thinking_might_as_w_045488: "Good thinking. Might as well do it now and get it over with."
  npc_override_job_gun_rebellion_he_captured_already_101ddb: "He was captured already?"
  npc_override_job_gun_rebellion_he_s_only_bounty_hunter_f970bf: "^0000ffHe's not the only bounty hunter after me, if he's telling the truth. I need time to strategize.^000000"
  npc_override_job_gun_rebellion_he_scans_your_face_then_df1cb8: "^0000ffHe scans your face, then guffaws.^000000"
  npc_override_job_gun_rebellion_hey_how_about_you_join_10e040: "Hey, how about you join our ranks? At the very last, you won't get shot."
  npc_override_job_gun_rebellion_hey_stay_focused_we_re_6ef4a3: "Hey, stay focused--we're using live ammo here, and you can get shot anytime."
  npc_override_job_gun_rebellion_hiccups_oh_i_m_owner_d04f9f: "*Hiccups* Oh, I'm the owner here."
  npc_override_job_gun_rebellion_hm_you_bear_striking_res_842fd6: "Hm, you bear a striking resemblance, though you don't look not as menacing as that criminal Spike"
  npc_override_job_gun_rebellion_how_did_you_leave_cfa440: "How did you not leave?"
  npc_override_job_gun_rebellion_huh_you_look_so_weak_b2a4be: "Huh? You look so weak? I have nothing more to say."
  npc_override_job_gun_rebellion_i_don_t_care_if_014124: "I don't care if you're the right one so long as you look it and I can take you dead or alive."
  npc_override_job_gun_rebellion_i_help_you_a9e5aa: "Can I help you?"
  npc_override_job_gun_rebellion_i_knew_you_d_try_a37e68: "I knew you'd try to lie your way out."
  npc_override_job_gun_rebellion_i_ll_next_room_waiting_c1b9fc: "I'll be in the next room, waiting for you to bring me a complete firearm. To check the elapsed time, you'll be transformed into a different job. ^0000ffIf you pass 3 minutes and turn back to normal, go back to me and start the test again.^000000."
  npc_override_job_gun_rebellion_i_ll_next_room_waiting_e08f55: "I'll be in the next room, waiting for you to bring me a complete firearm. Remember, ^0000ffyou fail the test when your transformation expires after 3 minutes^000000."
  npc_override_job_gun_rebellion_i_m_criminal_you_think_fa4aed: "I'm not the criminal you think I am!"
  npc_override_job_gun_rebellion_i_m_mistaken_criminal_11b537: "I'm mistaken for a criminal!."
  npc_override_job_gun_rebellion_i_m_sorry_i_t_08b567: "I'm sorry, but I can't talk to every single bounty hunter for you. Of course, I'm willing to compensate for your inconvenience."
  npc_override_job_gun_rebellion_i_m_sorry_moment_i_5427e9: "I'm sorry. For a moment, I thought Spike came back to life. He was found dead three days ago."
  npc_override_job_gun_rebellion_i_see_resemblance_s_me_737f63: "I see the resemblance, but that's not me."
  npc_override_job_gun_rebellion_i_should_run_now_think_a5d9c9: "^0000ffI should run for now and think about this later.^000000"
  npc_override_job_gun_rebellion_i_want_talk_poster_publi_f1041f: "I want to talk to the poster publisher."
  npc_override_job_gun_rebellion_if_you_don_t_want_df8bf6: "If you don't want to join Rebellions, just get out."
  npc_override_job_gun_rebellion_initializing_furnace_con_a8c576: "Initializing Furnace Controller ZX-3100..."
  npc_override_job_gun_rebellion_items_your_inventory_wei_1ce130: "The items in your inventory are weighing you down. Lighten your weight first."
  npc_override_job_gun_rebellion_ivan_s_shooting_test_fin_e213e1: "Ivan's shooting test have not finished yet, do you want to try again?"
  npc_override_job_gun_rebellion_ivan_waiting_you_go_find_0df888: "Ivan is waiting for you, go find him."
  npc_override_job_gun_rebellion_kulbertinov_elwin_i_ve_e_d00fca: "Kulbertinov, Elwin, and I've evaluated your Rebellion test results."
  npc_override_job_gun_rebellion_let_me_make_quick_basica_234eda: "Let me make this quick. Basically you'll be running in this shooting range consisting of 5 sections."
  npc_override_job_gun_rebellion_let_me_take_all_your_77d13b: "Let me take all your leftover test materials."
  npc_override_job_gun_rebellion_let_s_start_again_d85055: "Let's start again."
  npc_override_job_gun_rebellion_let_s_try_again_more_e1da05: "Let's try again. Be more careful this time."
  npc_override_job_gun_rebellion_let_s_try_there_aren_e5d82a: "Let's try. There aren't many ^0000ffStandard-issue Targets^000000, so keep your eyes peeled."
  npc_override_job_gun_rebellion_life_should_fun_boring_fda995: "This life should be fun, not boring."
  npc_override_job_gun_rebellion_listen_up_i_m_going_138182: "Listen up. I'm not going to great lengths trying to explain the test to you."
  npc_override_job_gun_rebellion_look_yourself_you_really_42a97b: "Look at yourself, do you really want to test?"
  npc_override_job_gun_rebellion_magical_spitfires_92772e: "Magical spitfires!"
  npc_override_job_gun_rebellion_maybe_i_m_wrong_place_aa111c: "Maybe I'm in the wrong place. This place doesn't look like a pub."
  npc_override_job_gun_rebellion_menu_cancel_feba92: "Cancel:Test monster spawn:Start from beginning:Furnace Zone:Shooting Zone:Complete the test"
  npc_override_job_gun_rebellion_menu_furnace_93687b: "Furnace Controller: Finishing the operation... Entering Standby mode in 15 seconds."
  npc_override_job_gun_rebellion_menu_furnace_dc5e7d: "Furnace Controller: Dredging a mold up from the furnace... Workers, stand by at the production line."
  npc_override_job_gun_rebellion_menu_i_0dc96b: "I give up.:...I'll sign."
  npc_override_job_gun_rebellion_menu_i_19f03c: "I give up.:Do it."
  npc_override_job_gun_rebellion_menu_i_38c5f7: "I want in.:I was passing by."
  npc_override_job_gun_rebellion_menu_let_4c9ca1: "Let me think it over.:I don't think I have a choice."
  npc_override_job_gun_rebellion_menu_make_6945c8: "Make a run for it.:Fight him."
  npc_override_job_gun_rebellion_menu_no_9475ae: "No.:Send me to Elwin Conick."
  npc_override_job_gun_rebellion_menu_quit_2c7973: "Quit.:Open the storage."
  npc_override_job_gun_rebellion_menu_quit_43fd41: "Quit.:Begin."
  npc_override_job_gun_rebellion_menu_wait_26ea8c: "Wait.:Go away."
  npc_override_job_gun_rebellion_menu_yes_de2097: "Yes.:No."
  npc_override_job_gun_rebellion_msg_61ce5a: "[{0}]"
  npc_override_job_gun_rebellion_msg_6eae3a: "..."
  npc_override_job_gun_rebellion_no_bounty_hunting_just_p_dea781: "No, bounty hunting is just a pastime. We're the experts of all the firearms in the world."
  npc_override_job_gun_rebellion_no_loitering_around_venu_e540d0: "No loitering around the venue."
  npc_override_job_gun_rebellion_now_you_move_next_course_77b8e1: "Now you can move on to the next course. Ivan Sidorenko will oversee your test."
  npc_override_job_gun_rebellion_objective_find_enemies_m_61d295: "The objective is to find enemies in the midst of a crowd quickly and without fail."
  npc_override_job_gun_rebellion_oh_no_you_still_skill_cb86e2: "Oh no~ You still have Skill Points."
  npc_override_job_gun_rebellion_oh_wait_am_i_pub_c3ba45: "Oh wait, am I in the pub or someplace else? Zzz..."
  npc_override_job_gun_rebellion_okay_i_ll_let_her_93c0ce: "Okay, I'll let her know."
  npc_override_job_gun_rebellion_only_authorized_user_ope_a28665: "Only authorized user can do the operation."
  npc_override_job_gun_rebellion_remember_give_your_best_d42c07: "Remember to give your best."
  npc_override_job_gun_rebellion_s_right_you_re_now_43d6da: "That's right, you're now a member of the Rebellion. Get ready to be wowed."
  npc_override_job_gun_rebellion_s_shoddy_bad_given_time_8617b9: "It's shoddy but not bad, given the time. You passed."
  npc_override_job_gun_rebellion_s_worth_give_up_now_1fc262: "It's not worth to give up, now go out and relax."
  npc_override_job_gun_rebellion_s_you_again_you_ve_939476: "It's you again! You've got guts to come back here!"
  npc_override_job_gun_rebellion_say_what_b1fb50: "Say what?"
  npc_override_job_gun_rebellion_see_you_later_d94b6f: "See you later."
  npc_override_job_gun_rebellion_shooting_test_area_you_t_027de5: "This is shooting test area, you can't come here as you like."
  npc_override_job_gun_rebellion_short_woman_keen_eyes_st_d2fb4c: "^0000ffThe short woman with keen eyes stares into your eyes.^000000"
  npc_override_job_gun_rebellion_sign_here_77f2d8: "Sign here."
  npc_override_job_gun_rebellion_snort_don_t_pretend_like_bfdf12: "*Snort* Don't pretend like you don't know. Look at this poster! You're in it!"
  npc_override_job_gun_rebellion_switch_standby_mode_ebd102: "Switch to the Standby mode."
  npc_override_job_gun_rebellion_system_busy_dredging_com_9b1ca9: "The system is busy dredging a completed mold from the furnace."
  npc_override_job_gun_rebellion_talk_enwin_conick_she_gu_d3c1a6: "Talk to Enwin Conick. She guides drifting spirits like you to the way of the Rebellion. I'll send word to her. Ah, and don't point your gun at her."
  npc_override_job_gun_rebellion_thank_you_using_service_dc4db4: "Thank you for using the service."
  npc_override_job_gun_rebellion_there_must_been_mistake_7ae6ba: "There must have been a mistake. You aren't supposed to remain here."
  npc_override_job_gun_rebellion_there_s_problem_statisti_c19cd8: "There's a problem, the statistic seems to be wrong. Well... This can happen sometimes."
  npc_override_job_gun_rebellion_there_seems_mistake_you_7a650d: "There seems to be a mistake, you can't stay here."
  npc_override_job_gun_rebellion_time_over_you_failed_tes_0ebbb9: "Time over. You failed the test. Let me take all your leftover test materials."
  npc_override_job_gun_rebellion_unauthorized_firearm_cre_ba6785: "Unauthorized firearm creation has been detected. Report to Manager Elwin."
  npc_override_job_gun_rebellion_under_construction_t_get_582be7: "Under construction, can't get in."
  npc_override_job_gun_rebellion_undersigned_party_speak_f7a915: "^0000ffThe undersigned party '_____' will not speak of the test even if he or she suffers injury, mutilation, or death in an unforeseen accident that may occur during the test.^000000"
  npc_override_job_gun_rebellion_use_temporary_storage_ke_b3422b: "Use this temporary storage to keep your items safe while on the Advancement test."
  npc_override_job_gun_rebellion_wait_minute_mwah_hah_hah_7a2243: "Wait a minute... Mwah hah hah!"
  npc_override_job_gun_rebellion_we_call_ourselves_rebell_f65271: "We call ourselves the ^0000ffRebellion^000000."
  npc_override_job_gun_rebellion_we_rebellions_weapon_exp_0dcd04: "We Rebellions are weapon experts at heart. Here you will learn to create and assemble firearms."
  npc_override_job_gun_rebellion_what_336de9: "WHAT?!"
  npc_override_job_gun_rebellion_what_time_you_like_retur_9b0a6a: "What time would you like to return?"
  npc_override_job_gun_rebellion_what_you_want_9b4b57: "What do you want?"
  npc_override_job_gun_rebellion_where_firearm_molds_cast_4e468a: "This is where the firearm molds are cast. Everywhere you can see Steel Artifacts are being produced."
  npc_override_job_gun_rebellion_yes_bounty_hunter_alread_7a3a5f: "Yes, and the bounty hunter was already paid. The news hasn't spread, and you're the spitting image of him. Go figure."
  npc_override_job_gun_rebellion_you_accurate_enough_you_903d3b: "You accurate enough, but you took too much time. Slow Rebellions don't survive long enough."
  npc_override_job_gun_rebellion_you_already_test_form_if_ef562c: "^0000ffYou are already in the test form. If you have finished all your tests, report to Elwin Conick in the Assembly Room^000000."
  npc_override_job_gun_rebellion_you_aren_t_68ab82: "You aren't?"
  npc_override_job_gun_rebellion_you_business_elwin_conic_f7731e: "Do you have business with Elwin Conick?"
  npc_override_job_gun_rebellion_you_done_i_don_t_f14135: "Are you done? I don't see any completed firearm in your inventory."
  npc_override_job_gun_rebellion_you_failed_both_speed_ac_64a7bf: "You failed at both speed and accuracy. How did you survive this long?"
  npc_override_job_gun_rebellion_you_join_us_rebellions_1f0bf8: "Do you to join us Rebellions?"
  npc_override_job_gun_rebellion_you_know_how_use_gun_042295: "Do you know how to use a gun?"
  npc_override_job_gun_rebellion_you_ll_asked_control_fur_dbc0ae: "You'll be asked to control the furnace controller near the entrance and select 5 standard Steel Artifacts."
  npc_override_job_gun_rebellion_you_ll_asked_control_swi_477e72: "You'll be asked to control switches on the machine and select 5 standard Steel Artifacts."
  npc_override_job_gun_rebellion_you_ll_fail_if_you_6f1a81: "^0000ffYou'll fail if you miss a Standard-issue Target, or shoot 3 incorrect targets^000000. Let's get started."
  npc_override_job_gun_rebellion_you_ll_then_take_them_1fc960: "You'll then take them to the next Assembly Room and assemble them info a firearm. You'll be given 3 minutes to do all that. You'd better be fast and focused, or you will fail the test."
  npc_override_job_gun_rebellion_you_ll_then_take_them_e4b921: "You'll then take them to the next Assembly Room and assemble them into a complete firearm. You'll be given 3 minutes to finish all that. ^0000ffTo check the elapsed time, you'll be transformed into a different job^000000."
  npc_override_job_gun_rebellion_you_look_like_you_know_0712e9: "You look like you know how to use a gun. How'd you like to join our ranks? You won't have to worry about other bounty hunters anymore too."
  npc_override_job_gun_rebellion_you_looking_me_0a6558: "Are you looking for me?"
  npc_override_job_gun_rebellion_you_may_leave_wait_outsi_5bc988: "You may leave and wait outside. I'll bring other instructors' evaluation reports to see you."
  npc_override_job_gun_rebellion_you_minutes_finish_test_aed181: "^0000ffYou have 3 minutes to finish this test. If you can't finish before your transformation expires^000000, you'll fail. If that happens, just follow the path back to me."
  npc_override_job_gun_rebellion_you_no_more_test_take_e306ec: "You have no more test to take. Why don't you go out and have a drink?"
  npc_override_job_gun_rebellion_you_re_back_why_060866: "You're back. Why?"
  npc_override_job_gun_rebellion_you_re_quick_enough_you_0edcdd: "You're quick enough, but you shot too many incorrect targets. You failed."
  npc_override_job_gun_rebellion_you_re_silly_1ae11f: "You're silly."
  npc_override_job_gun_rebellion_you_something_b4810c: "You have to do something!"
  npc_override_job_gun_rebellion_you_something_say_me_don_3e0e34: "Do you have something to say to me, don't you?"
  npc_override_job_gun_rebellion_you_standard_steel_artif_696bc9: "You do not have standard Steel Artifacts."
  npc_override_job_gun_rebellion_you_still_ivan_s_shootin_6eecb1: "You still have Ivan's shooting test, do you want to try again?"
  npc_override_job_gun_rebellion_you_successfully_created_dc32b0: "You have successfully created a firearm using the auto anvil. ^ff0000Please report before your transformation expires^000000."
  npc_override_job_gun_rebellion_you_think_over_over_answ_49cede: "You can think it over and over, but the answer won't change. Just take the offer."
  npc_override_job_gun_rebellion_you_too_many_items_pleas_3efed3: "You have too many items, please reduce them to continue."
  npc_override_job_gun_rebellion_you_ve_met_all_our_e7bd15: "You've met all our requirements including the attitude and the test performance."
  npc_override_job_gun_rebellion_you_want_dredge_mold_up_cfb602: "Do you want to dredge the mold up from the furnace?"
  npc_override_job_gun_rebellion_you_want_join_us_e762a9: "Do you want join us or not?"
  npc_override_job_gun_rebellion_you_want_me_become_bount_7edfa6: "You want me become a bounty hunter?"
  npc_override_job_gun_rebellion_you_want_see_boss_cf91a3: "Do you want to see the boss?"
  npc_override_job_gun_rebellion_you_want_try_again_935653: "Do you want to try again?"
  npc_override_job_gun_rebellion_you_want_use_auto_anvil_56827e: "Do you want to use the auto anvil and shape the standard Steel Artifacts into a firearm?"
  npc_override_job_gun_rebellion_your_choice_2ec2fd: "Your choice."
  npc_override_job_gun_rebellion_your_problem_bit_out_my_c60ccc: "Your problem is a bit out of my league. Get in. If I find out you're the real deal all along, I'll see that you'll never see the outside again."
  npc_override_job_gun_rebellion_your_safety_please_step_63ac5d: "For your safety, please step away from the auto anvil."
