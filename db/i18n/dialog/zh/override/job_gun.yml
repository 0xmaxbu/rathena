Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job_gun_rebellion_ah_you_lost_you_need_ad214d: "啊？你迷路了吗？你需要先登记然后再回来。"
  npc_override_job_gun_rebellion_all_right_care_shot_vodk_c041ed: "好的。来杯伏特加吗？"
  npc_override_job_gun_rebellion_among_all_targets_you_mu_342d19: "在所有目标中，你必须只射击^0000ff标准目标^000000。如果射错了，你会失分。"
  npc_override_job_gun_rebellion_and_f0fa6b: "还有……"
  npc_override_job_gun_rebellion_any_leftover_steel_artif_f0192f: "任何剩余的钢铁神器必须在测试后归还。"
  npc_override_job_gun_rebellion_authorized_user_abort_op_f2257a: "未授权用户。中止操作。"
  npc_override_job_gun_rebellion_becoming_rebellion_your_4e2c61: "成为Rebellion后，你的生活应该得到提升。所以，去创造伟大的旅程吧，让我们感到骄傲！"
  npc_override_job_gun_rebellion_bouncer_examines_your_fa_379808: "^0000ff保镖审视着你的脸。^000000"
  npc_override_job_gun_rebellion_carefree_spirits_afd0e7: "无忧无虑的灵魂！"
  npc_override_job_gun_rebellion_come_back_when_you_aren_43da10: "当你不在任何形态时再回来。"
  npc_override_job_gun_rebellion_don_t_say_i_look_9f82fd: "别说我长得像你认识的某个铁匠。"
  npc_override_job_gun_rebellion_einbroch_private_pub_rel_eee532: "^0000ffEinbroch私人酒馆^000000发布了那张通缉令。你有很多像我这样的赏金猎人在追你。"
  npc_override_job_gun_rebellion_elwin_see_you_turn_into_c6fcee: "^0000ffElwin看到你变成了另一种形态，她非常生气。等你当前形态结束后，再去找她。^000000"
  npc_override_job_gun_rebellion_elwin_wants_you_take_goo_6699a7: "Elwin想让你拥有这个。好好保管。这是他为你做的。"
  npc_override_job_gun_rebellion_failed_create_firearm_e917ae: "制造枪械失败。"
  npc_override_job_gun_rebellion_finally_i_ve_found_you_2ee8ad: "终于找到你了，Vagabond Spike！你的命是我的！"
  npc_override_job_gun_rebellion_follow_me_f3c136: "跟我来。"
  npc_override_job_gun_rebellion_forget_resemblance_where_fc99b3: "别管长相了。你从哪里得到那张海报的？我从未犯过罪。"
  npc_override_job_gun_rebellion_gasp_you_i_thought_you_d8c1d4: "*倒吸一口气* 你！我以为你已经被抓住了。哦，现在无所谓了。你是我的免罪金牌！"
  npc_override_job_gun_rebellion_go_ahead_stay_out_troubl_bc024f: "去吧。别惹麻烦。"
  npc_override_job_gun_rebellion_good_job_i_didn_t_45afc6: "干得好。我没想到你能这么快通过。"
  npc_override_job_gun_rebellion_good_now_follow_me_f3a586: "很好。现在，跟我来。"
  npc_override_job_gun_rebellion_good_thinking_might_as_w_045488: "想得好。不如现在就做完，一劳永逸。"
  npc_override_job_gun_rebellion_he_captured_already_101ddb: "他已经被抓了？"
  npc_override_job_gun_rebellion_he_s_only_bounty_hunter_f970bf: "^0000ff如果他说的是真的，他不是唯一在追我的赏金猎人。我需要时间制定策略。^000000"
  npc_override_job_gun_rebellion_he_scans_your_face_then_df1cb8: "^0000ff他审视着你的脸，然后大笑起来。^000000"
  npc_override_job_gun_rebellion_hey_how_about_you_join_10e040: "嘿，你加入我们怎么样？至少，你不会被枪击。"
  npc_override_job_gun_rebellion_hey_stay_focused_we_re_6ef4a3: "嘿，集中注意力--我们在这里使用实弹，你随时都可能中枪。"
  npc_override_job_gun_rebellion_hiccups_oh_i_m_owner_d04f9f: "*打嗝* 哦，我是这里的老板。"
  npc_override_job_gun_rebellion_hm_you_bear_striking_res_842fd6: "嗯，你确实长得非常像，虽然你看起来不像那个罪犯Spike那么凶狠"
  npc_override_job_gun_rebellion_how_did_you_leave_cfa440: "你怎么没离开？"
  npc_override_job_gun_rebellion_huh_you_look_so_weak_b2a4be: "嗯？你看起来很弱？我没什么好说的了。"
  npc_override_job_gun_rebellion_i_don_t_care_if_014124: "我不在乎你是不是对的人，只要你长得像，而且我可以把你死活带走。"
  npc_override_job_gun_rebellion_i_help_you_a9e5aa: "我能帮你吗？"
  npc_override_job_gun_rebellion_i_knew_you_d_try_a37e68: "我就知道你会试图撒谎蒙混过关。"
  npc_override_job_gun_rebellion_i_ll_next_room_waiting_c1b9fc: "我会在隔壁房间等你把完成的枪械带来。为了检查 elapsed time，你会被转换成不同的职业。^0000ff如果超过3分钟并且变回正常状态，回到我这里重新开始测试。^000000。"
  npc_override_job_gun_rebellion_i_ll_next_room_waiting_e08f55: "我会在隔壁房间等你把完成的枪械带来。记住，^0000ff当你的变身在3分钟后过期时，你就失败了^000000。"
  npc_override_job_gun_rebellion_i_m_criminal_you_think_fa4aed: "我不是你认为的那个罪犯！"
  npc_override_job_gun_rebellion_i_m_mistaken_criminal_11b537: "我被误认为是罪犯！。"
  npc_override_job_gun_rebellion_i_m_sorry_i_t_08b567: "抱歉，但我不能为你跟每个赏金猎人谈。当然，我愿意补偿你的不便。"
  npc_override_job_gun_rebellion_i_m_sorry_moment_i_5427e9: "抱歉。有一瞬间，我以为Spike复活了。他在三天前被发现死亡。"
  npc_override_job_gun_rebellion_i_see_resemblance_s_me_737f63: "我看出来相似之处了，但那不是 me。"
  npc_override_job_gun_rebellion_i_should_run_now_think_a5d9c9: "^0000ff我现在应该逃跑，以后再考虑这件事。^000000"
  npc_override_job_gun_rebellion_i_want_talk_poster_publi_f1041f: "我想和海报发布者谈谈。"
  npc_override_job_gun_rebellion_if_you_don_t_want_df8bf6: "如果你不想加入Rebellions，那就出去。"
  npc_override_job_gun_rebellion_initializing_furnace_con_a8c576: "正在初始化熔炉控制器 ZX-3100……"
  npc_override_job_gun_rebellion_items_your_inventory_wei_1ce130: "你背包里的物品太重了。先减轻重量。"
  npc_override_job_gun_rebellion_ivan_s_shooting_test_fin_e213e1: "Ivan的射击测试还没结束，你想再试一次吗？"
  npc_override_job_gun_rebellion_ivan_waiting_you_go_find_0df888: "Ivan在等你，去找他。"
  npc_override_job_gun_rebellion_kulbertinov_elwin_i_ve_e_d00fca: "Kulbertinov、Elwin和我已经评估了你的Rebellion测试结果。"
  npc_override_job_gun_rebellion_let_me_make_quick_basica_234eda: "让我长话短说。基本上你会在这个由5个部分组成的射击场内奔跑。"
  npc_override_job_gun_rebellion_let_me_take_all_your_77d13b: "让我把你剩下的测试材料都拿走。"
  npc_override_job_gun_rebellion_let_s_start_again_d85055: "让我们重新开始。"
  npc_override_job_gun_rebellion_let_s_try_again_more_e1da05: "让我们再试一次。这次更小心点。"
  npc_override_job_gun_rebellion_let_s_try_there_aren_e5d82a: "让我们试试。^0000ff标准目标^000000不多，所以睁大眼睛。"
  npc_override_job_gun_rebellion_life_should_fun_boring_fda995: "生活应该有趣，而不是无聊。"
  npc_override_job_gun_rebellion_listen_up_i_m_going_138182: "听着。我不会费尽口舌给你解释测试。"
  npc_override_job_gun_rebellion_look_yourself_you_really_42a97b: "看看你自己，你真的想测试吗？"
  npc_override_job_gun_rebellion_magical_spitfires_92772e: "魔法喷火器！"
  npc_override_job_gun_rebellion_maybe_i_m_wrong_place_aa111c: "也许我来错地方了。这地方看起来不像酒馆。"
  npc_override_job_gun_rebellion_menu_cancel_feba92: "取消:测试怪物生成:从头开始:熔炉区域:射击区域:完成测试"
  npc_override_job_gun_rebellion_menu_furnace_93687b: "熔炉控制器：完成操作…… 15秒后进入待机模式。"
  npc_override_job_gun_rebellion_menu_furnace_dc5e7d: "熔炉控制器：从熔炉中打捞模具…… 工人们，在生产线上待命。"
  npc_override_job_gun_rebellion_menu_i_0dc96b: "我放弃.:……我签。"
  npc_override_job_gun_rebellion_menu_i_19f03c: "我放弃.:做吧。"
  npc_override_job_gun_rebellion_menu_i_38c5f7: "我想加入.:我只是路过。"
  npc_override_job_gun_rebellion_menu_let_4c9ca1: "让我考虑考虑.:我觉得我没得选。"
  npc_override_job_gun_rebellion_menu_make_6945c8: "逃跑.:跟他战斗。"
  npc_override_job_gun_rebellion_menu_no_9475ae: "不.:送我去Elwin Conick。"
  npc_override_job_gun_rebellion_menu_quit_2c7973: "退出.:打开仓库。"
  npc_override_job_gun_rebellion_menu_quit_43fd41: "退出.:开始。"
  npc_override_job_gun_rebellion_menu_wait_26ea8c: "等等.:走开。"
  npc_override_job_gun_rebellion_menu_yes_de2097: "是.:不。"
  npc_override_job_gun_rebellion_msg_61ce5a: "[{0}]"
  npc_override_job_gun_rebellion_msg_6eae3a: "……"
  npc_override_job_gun_rebellion_no_bounty_hunting_just_p_dea781: "不，赏金狩猎只是一种消遣。我们是世界上所有火器的专家。"
  npc_override_job_gun_rebellion_no_loitering_around_venu_e540d0: "禁止在场地周围游荡。"
  npc_override_job_gun_rebellion_now_you_move_next_course_77b8e1: "现在你可以进入下一个课程。Ivan Sidorenko将监督你的测试。"
  npc_override_job_gun_rebellion_objective_find_enemies_m_61d295: "目标是在人群中快速且准确地找到敌人。"
  npc_override_job_gun_rebellion_oh_no_you_still_skill_cb86e2: "哦不~ 你还有技能点。"
  npc_override_job_gun_rebellion_oh_wait_am_i_pub_c3ba45: "哦等等，我在酒馆还是别的地方？zzz……"
  npc_override_job_gun_rebellion_okay_i_ll_let_her_93c0ce: "好的，我会告诉她的。"
  npc_override_job_gun_rebellion_only_authorized_user_ope_a28665: "只有授权用户才能操作。"
  npc_override_job_gun_rebellion_remember_give_your_best_d42c07: "记住要全力以赴。"
  npc_override_job_gun_rebellion_s_right_you_re_now_43d6da: "没错，你现在已经是Rebellion的一员了。准备好被震撼吧。"
  npc_override_job_gun_rebellion_s_shoddy_bad_given_time_8617b9: "鉴于时间紧迫，这做得粗糙但还不错。你通过了。"
  npc_override_job_gun_rebellion_s_worth_give_up_now_1fc262: "不值得放弃，现在出去放松一下吧。"
  npc_override_job_gun_rebellion_s_you_again_you_ve_939476: "又是你！你有胆量回到这里！"
  npc_override_job_gun_rebellion_say_what_b1fb50: "说什么？"
  npc_override_job_gun_rebellion_see_you_later_d94b6f: "回头见。"
  npc_override_job_gun_rebellion_shooting_test_area_you_t_027de5: "这是射击测试区域，你不能随便进来。"
  npc_override_job_gun_rebellion_short_woman_keen_eyes_st_d2fb4c: "^0000ff那个目光锐利的矮个子女人盯着你的眼睛。^000000"
  npc_override_job_gun_rebellion_sign_here_77f2d8: "在这里签名。"
  npc_override_job_gun_rebellion_snort_don_t_pretend_like_bfdf12: "*哼* 别装作不知道。看看这张海报！你在上面！"
  npc_override_job_gun_rebellion_switch_standby_mode_ebd102: "切换到待机模式。"
  npc_override_job_gun_rebellion_system_busy_dredging_com_9b1ca9: "系统正忙着从熔炉中打捞完成的模具。"
  npc_override_job_gun_rebellion_talk_enwin_conick_she_gu_d3c1a6: "跟Enwin Conick谈谈。她引导像你这样的流浪灵魂走上Rebellion之路。我会给她传话。啊，还有，别用枪指着她。"
  npc_override_job_gun_rebellion_thank_you_using_service_dc4db4: "谢谢使用本服务。"
  npc_override_job_gun_rebellion_there_must_been_mistake_7ae6ba: "一定是弄错了。你不应该留在这里。"
  npc_override_job_gun_rebellion_there_s_problem_statisti_c19cd8: "有个问题，统计数据似乎不对。嗯…… 这种情况有时会发生。"
  npc_override_job_gun_rebellion_there_seems_mistake_you_7a650d: "似乎有个错误，你不能留在这里。"
  npc_override_job_gun_rebellion_time_over_you_failed_tes_0ebbb9: "时间到。你测试失败了。让我把你剩下的测试材料都拿走。"
  npc_override_job_gun_rebellion_unauthorized_firearm_cre_ba6785: "检测到未经授权的枪械制造。向经理Elwin报告。"
  npc_override_job_gun_rebellion_under_construction_t_get_582be7: "正在施工，不能进入。"
  npc_override_job_gun_rebellion_undersigned_party_speak_f7a915: "^0000ff签署方'_____'将不会谈论测试，即使他或她在测试期间可能发生的意外事故中受伤、致残或死亡。^000000"
  npc_override_job_gun_rebellion_use_temporary_storage_ke_b3422b: "使用这个临时仓库来保护你在进阶测试期间的物品安全。"
  npc_override_job_gun_rebellion_wait_minute_mwah_hah_hah_7a2243: "等等…… 哇哈哈哈！"
  npc_override_job_gun_rebellion_we_call_ourselves_rebell_f65271: "我们称自己为^0000ffRebellion^000000。"
  npc_override_job_gun_rebellion_we_rebellions_weapon_exp_0dcd04: "我们Rebellions本质上是武器专家。在这里你将学习制造和组装火器。"
  npc_override_job_gun_rebellion_what_336de9: "什么？！"
  npc_override_job_gun_rebellion_what_time_you_like_retur_9b0a6a: "你想什么时候回来？"
  npc_override_job_gun_rebellion_what_you_want_9b4b57: "你想要什么？"
  npc_override_job_gun_rebellion_where_firearm_molds_cast_4e468a: "这里是铸造枪械模具的地方。到处都能看到钢铁神器正在被生产。"
  npc_override_job_gun_rebellion_yes_bounty_hunter_alread_7a3a5f: "是的，而且赏金猎人已经拿到报酬了。消息还没传开，而你和他长得一模一样。你想想。"
  npc_override_job_gun_rebellion_you_accurate_enough_you_903d3b: "你够准的，但花的时间太长了。慢吞吞的Rebellion活不长。"
  npc_override_job_gun_rebellion_you_already_test_form_if_ef562c: "^0000ff你已经在测试形态中了。如果你已经完成了所有测试，向组装室的Elwin Conick报告^000000。"
  npc_override_job_gun_rebellion_you_aren_t_68ab82: "你不是吗？"
  npc_override_job_gun_rebellion_you_business_elwin_conic_f7731e: "你找Elwin Conick有事吗？"
  npc_override_job_gun_rebellion_you_done_i_don_t_f14135: "你完成了吗？我在你背包里没看到任何完成的枪械。"
  npc_override_job_gun_rebellion_you_failed_both_speed_ac_64a7bf: "你在速度和准确度上都失败了。你是怎么活到现在的？"
  npc_override_job_gun_rebellion_you_join_us_rebellions_1f0bf8: "你想加入我们Rebellions吗？"
  npc_override_job_gun_rebellion_you_know_how_use_gun_042295: "你知道怎么用枪吗？"
  npc_override_job_gun_rebellion_you_ll_asked_control_fur_dbc0ae: "你需要控制入口附近的熔炉控制器，并选择5个标准钢铁神器。"
  npc_override_job_gun_rebellion_you_ll_asked_control_swi_477e72: "你需要控制机器上的开关，并选择5个标准钢铁神器。"
  npc_override_job_gun_rebellion_you_ll_fail_if_you_6f1a81: "^0000ff如果你漏掉一个标准目标，或射中3个错误目标，你就会失败^000000。让我们开始吧。"
  npc_override_job_gun_rebellion_you_ll_then_take_them_1fc960: "然后你要把它们带到隔壁的组装室，组装成一把火器。你有3分钟的时间完成所有操作。你最好快而专注，否则你会失败。"
  npc_override_job_gun_rebellion_you_ll_then_take_them_e4b921: "然后你要把它们带到隔壁的组装室，组装成一把完整的火器。你有3分钟的时间完成所有操作。^0000ff为了检查 elapsed time，你会被转换成不同的职业^000000。"
  npc_override_job_gun_rebellion_you_look_like_you_know_0712e9: "你看起来懂得用枪。想加入我们吗？你也不用担心其他赏金猎人了。"
  npc_override_job_gun_rebellion_you_looking_me_0a6558: "你在找我吗？"
  npc_override_job_gun_rebellion_you_may_leave_wait_outsi_5bc988: "你可以出去在外面等。我会把其他教官的评估报告带给你看。"
  npc_override_job_gun_rebellion_you_minutes_finish_test_aed181: "^0000ff你有3分钟的时间完成这个测试。如果你不能在变身过期前完成^000000，你就会失败。如果发生了，就沿着路回到我这里。"
  npc_override_job_gun_rebellion_you_no_more_test_take_e306ec: "你没有更多的测试要做了。为什么不去外面喝一杯呢？"
  npc_override_job_gun_rebellion_you_re_back_why_060866: "你回来了。为什么？"
  npc_override_job_gun_rebellion_you_re_quick_enough_you_0edcdd: "你够快的，但你射中了太多错误目标。你失败了。"
  npc_override_job_gun_rebellion_you_re_silly_1ae11f: "你真傻。"
  npc_override_job_gun_rebellion_you_something_b4810c: "你必须做点什么！"
  npc_override_job_gun_rebellion_you_something_say_me_don_3e0e34: "你有什么话要跟我说，不是吗？"
  npc_override_job_gun_rebellion_you_standard_steel_artif_696bc9: "你没有标准钢铁神器。"
  npc_override_job_gun_rebellion_you_still_ivan_s_shootin_6eecb1: "你还有Ivan的射击测试，想再试一次吗？"
  npc_override_job_gun_rebellion_you_successfully_created_dc32b0: "你已成功使用自动铁砧制造了一把火器。^ff0000请在变身过期前报告^000000。"
  npc_override_job_gun_rebellion_you_think_over_over_answ_49cede: "你可以反复考虑，但答案不会改变。接受这个提议吧。"
  npc_override_job_gun_rebellion_you_too_many_items_pleas_3efed3: "你的物品太多了，请减少物品以继续。"
  npc_override_job_gun_rebellion_you_ve_met_all_our_e7bd15: "你已经满足了我们所有的要求，包括态度和测试表现。"
  npc_override_job_gun_rebellion_you_want_dredge_mold_up_cfb602: "你想从熔炉中打捞模具吗？"
  npc_override_job_gun_rebellion_you_want_join_us_e762a9: "你到底想不想加入我们？"
