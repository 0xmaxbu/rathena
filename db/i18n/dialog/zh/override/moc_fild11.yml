Body:

  npc_override_moc_fild11_quest_golem_ah_ok_i_think_you_ee18b5: "啊，好的，我觉得你可以帮我猎杀一些魔像。"
  npc_override_moc_fild11_quest_golem_amazing_you_did_speed_6cc3cd: "太棒了，你完成得很快。"
  npc_override_moc_fild11_quest_golem_any_progress_you_ve_made_b3e247: "你所取得的任何进展都将被清除"
  npc_override_moc_fild11_quest_golem_come_back_when_you_ve_44350c: "完成任务后回来，我会给你一个小奖励。"
  npc_override_moc_fild11_quest_golem_dangerous_here_citizen_ecb921: "这里很危险，市民。"
  npc_override_moc_fild11_quest_golem_doesn_t_look_like_you_4ba0e4: "看起来你还没有足够的数量。"
  npc_override_moc_fild11_quest_golem_greetings_citizen_85f801: "你好，市民！"
  npc_override_moc_fild11_quest_golem_hmm_i_don_t_think_1d8eb5: "嗯，我觉得你还没有猎杀到100只……"
  npc_override_moc_fild11_quest_golem_hmm_i_don_t_think_2144d7: "嗯，我觉得你还没有猎杀到50只……"
  npc_override_moc_fild11_quest_golem_hmm_i_don_t_think_5d960b: "嗯，我觉得你还没有猎杀到150只……"
  npc_override_moc_fild11_quest_golem_how_many_you_like_hunt_7fc82d: "你想猎杀多少只？"
  npc_override_moc_fild11_quest_golem_if_you_change_your_mind_3f2210: "如果你改变主意，请回来。"
  npc_override_moc_fild11_quest_golem_menu_gather_f1b022: "收集物品:猎杀魔像:取消"
  npc_override_moc_fild11_quest_golem_menu_golems_3122b3: "50只魔像:100只魔像:150只魔像"
  npc_override_moc_fild11_quest_golem_menu_i_1858b4: "我有石之心:你需要什么？"
  npc_override_moc_fild11_quest_golem_menu_sure_859d29: "当然:不"
  npc_override_moc_fild11_quest_golem_menu_yes_141459: "是:否"
  npc_override_moc_fild11_quest_golem_menu_yes_755efb: "是:否:我想退出"
  npc_override_moc_fild11_quest_golem_morocc_guard_needs_stone_a432d1: "梦罗克守卫需要^FF0000石之心^000000来进行我们的训练。"
  npc_override_moc_fild11_quest_golem_morocc_guard_needs_stone_afaffb: "梦罗克守卫需要^FF000025个石之心^000000来进行我们的训练。"
  npc_override_moc_fild11_quest_golem_morocc_guard_thanks_you_e50942: "梦罗克守卫感谢你，市民。"
  npc_override_moc_fild11_quest_golem_ok_then_well_come_back_0e1574: "好的，如果你改变主意就回来这里。"
  npc_override_moc_fild11_quest_golem_please_interrupt_my_miss_08b09c: "请不要打扰我为梦罗克守卫执行的任务。"
  npc_override_moc_fild11_quest_golem_please_kill_golems_9b831f: "请杀掉100只魔像。"
  npc_override_moc_fild11_quest_golem_please_kill_golems_aedb1e: "请杀掉150只魔像。"
  npc_override_moc_fild11_quest_golem_please_kill_golems_eb3fdb: "请杀掉50只魔像。"
  npc_override_moc_fild11_quest_golem_remember_i_need_help_hun_3848e0: "记住，我需要帮忙猎杀魔像，所以去猎杀50只。"
  npc_override_moc_fild11_quest_golem_remember_i_need_help_hun_b183cc: "记住，我需要帮忙猎杀魔像，所以去猎杀100只。"
  npc_override_moc_fild11_quest_golem_remember_i_need_help_hun_d34388: "记住，我需要帮忙猎杀魔像，所以去猎杀150只。"
  npc_override_moc_fild11_quest_golem_say_how_you_like_help_ff5e17: "说说看，你想怎么帮我？"
  npc_override_moc_fild11_quest_golem_thanks_i_really_apprecia_870e31: "谢谢！我真的很感激。"
  npc_override_moc_fild11_quest_golem_you_finished_hunting_gol_197c99: "你完成猎杀150只魔像了吗？"
  npc_override_moc_fild11_quest_golem_you_finished_hunting_gol_1b43ff: "你完成猎杀50只魔像了吗？"
  npc_override_moc_fild11_quest_golem_you_sure_you_want_stop_507e20: "你确定要停止猎杀吗？"
