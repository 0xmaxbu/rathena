Body:
  npc_override_1@pump_MalangdoCulvert_achoo_4d23ed: "阿嚏！"
  npc_override_1@pump_MalangdoCulvert_after_making_reservation_9f3838: "预约后，你"
  npc_override_1@pump_MalangdoCulvert_after_there_big_tremblin_8bde0d: "在发生大震动后"
  npc_override_1@pump_MalangdoCulvert_albo_s_voice_shakes_ange_677ea8: "^0000ff阿尔博的声音因愤怒而颤抖。提到辣酱时他咂了咂嘴。^000000"
  npc_override_1@pump_MalangdoCulvert_anyone_moment_7dba9e: "目前任何人……"
  npc_override_1@pump_MalangdoCulvert_aragam_insulted_me_877597: "^660000阿拉甘侮辱了我。^000000"
  npc_override_1@pump_MalangdoCulvert_around_here_so_s_why_e6c8bd: "在这附近。所以我成了"
  npc_override_1@pump_MalangdoCulvert_basement_there_many_bad_d051d2: "去地下室。有很多坏的"
  npc_override_1@pump_MalangdoCulvert_because_you_t_go_alone_2ef520: "因为你不能一个人进去！而且"
  npc_override_1@pump_MalangdoCulvert_cat_looks_like_s_bad_94401b: "^660066这只猫看起来状态不好。它在微微颤抖。^000000"
  npc_override_1@pump_MalangdoCulvert_cat_looks_like_s_been_90d9e6: "^660066这只猫看起来一直在哭……^000000"
  npc_override_1@pump_MalangdoCulvert_cat_s_gotta_dd2865: "猫必须做……"
  npc_override_1@pump_MalangdoCulvert_cat_scribbles_memo_code_f1f020: "^660066猫给你潦草地写了一张密码备忘录。^000000"
  npc_override_1@pump_MalangdoCulvert_cleaner_here_though_i_us_07e11c: "这里的清洁工，虽然我曾经"
  npc_override_1@pump_MalangdoCulvert_cleaning_culverts_9a7d16: "清理下水道。但一个"
  npc_override_1@pump_MalangdoCulvert_come_heroes_don_t_afraid_cd85f9: "来吧，英雄们！别害怕它们！只管前进，因为这是一天的任务！"
  npc_override_1@pump_MalangdoCulvert_day_155a0a: "天！"
  npc_override_1@pump_MalangdoCulvert_don_t_forget_i_open_b697ad: "别忘了！我不会打开"
  npc_override_1@pump_MalangdoCulvert_door_if_you_seagod_prote_4e39ae: "门如果你没有海神保护！"
  npc_override_1@pump_MalangdoCulvert_even_better_i_get_cans_17ddb6: "或者更好，我可以拿到罐头……"
  npc_override_1@pump_MalangdoCulvert_everyone_assistant_34db3a: "不是每个人都能当助手"
  npc_override_1@pump_MalangdoCulvert_fighting_them_so_many_ti_99a41e: "一天和它们战斗这么多次"
  npc_override_1@pump_MalangdoCulvert_first_culvert_opened_sec_e8fed8: "第一个下水道将在5秒后打开。清洁工可以找到打开的排水口并点击开始清理。"
  npc_override_1@pump_MalangdoCulvert_funny_looking_fish_seems_330448: "那条长相奇特的鱼似乎是生活在这附近的腔棘鱼之一。这是我第一次看到一只独自来这里！"
  npc_override_1@pump_MalangdoCulvert_gate_culvert_open_again_3a1ca3: "^0000ff下水道的门再次打开了。^000000"
  npc_override_1@pump_MalangdoCulvert_gate_culvert_still_close_9a0a48: "下水道的门仍然关闭。"
  npc_override_1@pump_MalangdoCulvert_get_closer_a4c904: "（靠近）"
  npc_override_1@pump_MalangdoCulvert_guys_who_hurt_me_i_7a255a: "伤害我的家伙。我厌倦了"
  npc_override_1@pump_MalangdoCulvert_here_i_t_help_choosing_a43696: "在这里。但我忍不住选择"
  npc_override_1@pump_MalangdoCulvert_here_s_your_pay_e10528: "这是你的报酬！"
  npc_override_1@pump_MalangdoCulvert_hmm_talk_me_again_when_7f0eab: "嗯？准备好后再跟我说话。"
  npc_override_1@pump_MalangdoCulvert_hmm_wasn_t_so_bad_f74c32: "嗯！没那么糟！"
  npc_override_1@pump_MalangdoCulvert_hmm_you_guys_pretty_good_25e35a: "嗯！你们真不错！！"
  npc_override_1@pump_MalangdoCulvert_hmmm_missing_thinks_you_ff5f5b: "嗯……米辛觉得你太弱了！说实话！！"
  npc_override_1@pump_MalangdoCulvert_however_when_sea_water_f_6aad73: "然而，当海水淹没所有珍贵资源时，我的梦想……我所有的梦想都破灭了……"
  npc_override_1@pump_MalangdoCulvert_huh_ready_yet_talk_me_9359e9: "嗯？还没准备好？准备好后再跟我说话。"
  npc_override_1@pump_MalangdoCulvert_huh_ready_yet_then_talk_db50a1: "嗯？还没准备好？那准备好后再跟我说话。"
  npc_override_1@pump_MalangdoCulvert_huh_you_some_fighting_sk_241737: "嗯？你有一些战斗技巧？好吧，有一个地方我没能清理……你为什么不去那里？！"
  npc_override_1@pump_MalangdoCulvert_huh_your_first_time_seei_b137a8: "嗯？这是你第一次看到下水道吗？你会看到许多埋在地面上的机器。你可以四处看看再回来！"
  npc_override_1@pump_MalangdoCulvert_i_am_trying_conversation_99fc54: "我正在和你的首领谈话。请不要打扰，等着！"
  npc_override_1@pump_MalangdoCulvert_i_cleaning_job_years_i_06411e: "我做了40年的清洁工作，从没见过这么糟糕的队伍！！"
  npc_override_1@pump_MalangdoCulvert_i_don_t_care_if_cd3140: "我不在乎你是否找朋友帮忙。我要你清理所有下水道！别忘了！我会看着你并给你指示。照我说的做！！"
  npc_override_1@pump_MalangdoCulvert_i_don_t_see_any_e0ccf9: "我没看到任何已完成的任务！"
  npc_override_1@pump_MalangdoCulvert_i_ll_clean_up_remains_1179b7: "我来清理残骸。你去拿战利品然后离开！"
  npc_override_1@pump_MalangdoCulvert_i_ll_clean_up_remains_3d1968: "我来清理残骸。去收拾然后离开！入口在另一边，找找看！"
  npc_override_1@pump_MalangdoCulvert_i_ll_give_you_one_242b14: "我给你一周时间完成这项工作！在下水道副本困难模式中消灭所有它们！"
  npc_override_1@pump_MalangdoCulvert_i_ll_give_you_one_a589ed: "我给你一周时间完成这项工作！在下水道副本普通模式中消灭所有它们！"
  npc_override_1@pump_MalangdoCulvert_i_ll_open_door_first_616600: "我先开门。顺便问一下，你知道怎么战斗吗？"
  npc_override_1@pump_MalangdoCulvert_i_m_here_help_my_624702: "我是来帮我哥哥阿尔博的！"
  npc_override_1@pump_MalangdoCulvert_i_m_sorry_there_no_37bb4d: "对不起。还没有新任务！如果我找到任何工作，我会告诉你的！"
  npc_override_1@pump_MalangdoCulvert_i_m_sure_what_made_429f27: "我不确定是什么让你来这里，但你不能进去！"
  npc_override_1@pump_MalangdoCulvert_i_must_tell_you_s_7db7b5: "我必须告诉你，我们已经很久没清理那个地方了，所以140级以下的人甚至不能进入！你确定还要进去吗？"
  npc_override_1@pump_MalangdoCulvert_i_see_seaweed_everywhere_f70959: "我看到到处都是海藻，因为你在扭动！所有下水道都会被海藻堵塞！"
  npc_override_1@pump_MalangdoCulvert_i_sense_something_strang_f302d7: "我感觉到有什么奇怪的东西！！别松懈——准备战斗！！"
  npc_override_1@pump_MalangdoCulvert_i_still_make_living_don_21e96b: "我还得谋生，不是吗？"
  npc_override_1@pump_MalangdoCulvert_i_t_give_you_compensatio_b80122: "我不能为过期任务给你报酬，所以让我检查你的任务是否过期。"
  npc_override_1@pump_MalangdoCulvert_i_tell_you_how_clean_fed69f: "我会告诉你怎么清理。你能看到周围的下水道吗？"
  npc_override_1@pump_MalangdoCulvert_i_told_you_play_me_bc646a: "我告诉过你别跟我开玩笑~！"
  npc_override_1@pump_MalangdoCulvert_i_very_surprised_54806c: "我非常惊讶！！"
  npc_override_1@pump_MalangdoCulvert_if_tomas_closes_down_we_e0996b: "如果托马斯关闭这里，我们就会失业！"
  npc_override_1@pump_MalangdoCulvert_if_you_got_some_guts_ef287b: "如果你还有胆量再次挑战，我会再给你一次机会！你的选择是什么！？"
  npc_override_1@pump_MalangdoCulvert_if_you_really_want_help_17d7dd: "如果你真的想帮忙，靠近点！"
  npc_override_1@pump_MalangdoCulvert_if_you_take_care_big_c095af: "如果你处理了哥哥阿尔博的请求，我会经常见到你。所以，让我们保持联系！"
  npc_override_1@pump_MalangdoCulvert_if_you_want_go_down_e2165d: "如果你想下去，让我获取这个密码。"
  npc_override_1@pump_MalangdoCulvert_island_things_started_le_86f614: "这个岛，东西开始泄漏"
  npc_override_1@pump_MalangdoCulvert_karrrrrrr_80527a: "嘎！！！！！！"
  npc_override_1@pump_MalangdoCulvert_let_s_pack_up_go_7bfde0: "我们收拾东西走吧……什么！！？"
  npc_override_1@pump_MalangdoCulvert_let_s_some_bad_seafood_3af6ff: "我们来吃点可以煮或烤的坏海鲜吧！"
  npc_override_1@pump_MalangdoCulvert_luxurious_things_1d0b7a: "奢侈的东西。"
  npc_override_1@pump_MalangdoCulvert_made_keep_souvenirs_ce2038: "是用来保存纪念品和"
  npc_override_1@pump_MalangdoCulvert_manager_edaddb: "当经理。"
  npc_override_1@pump_MalangdoCulvert_menu_contaminated_2d50da: "受污染的海藻：{0}株"
  npc_override_1@pump_MalangdoCulvert_menu_contaminated_c4a860: "受污染的海藻：{0}株。米辛很快会来检查清理结果。"
  npc_override_1@pump_MalangdoCulvert_menu_enter_dc9aa2: "进入下水道:取消"
  npc_override_1@pump_MalangdoCulvert_menu_i_a698f8: "我很擅长送面包。:我知道怎么战斗。:^ffffff给我钻石。^000000"
  npc_override_1@pump_MalangdoCulvert_menu_missing_4644a9: "米辛：我先走，你们跟着！我会在3点钟方向打开一扇门！"
  npc_override_1@pump_MalangdoCulvert_menu_missing_5bd106: "米辛：向3点钟方向移动，等待我的下一个命令！"
  npc_override_1@pump_MalangdoCulvert_menu_no_6954d1: "不……没什么。:阿拉甘侮辱了我。:进入下水道。"
  npc_override_1@pump_MalangdoCulvert_menu_okay_557862: "好的，干杯！:如果可能的话我会帮忙……"
  npc_override_1@pump_MalangdoCulvert_menu_party_0eb6cf: "队伍名称：{0}"
  npc_override_1@pump_MalangdoCulvert_menu_party_8b50b5: "队伍领袖：{0}"
  npc_override_1@pump_MalangdoCulvert_menu_pet_c85661: "抚摸猫:你还好吗？"
  npc_override_1@pump_MalangdoCulvert_menu_proliferous_44da54: "增殖的受污染海藻：{0}株"
  npc_override_1@pump_MalangdoCulvert_menu_wait_2483e2: "等等！我改变主意了！:如你所愿~"
  npc_override_1@pump_MalangdoCulvert_menu_wait_385e8b: "等等！还没！:开始吧！"
  npc_override_1@pump_MalangdoCulvert_menu_wait_4d3422: "等等！我改变主意了！:当然，我已经准备好了~"
  npc_override_1@pump_MalangdoCulvert_menu_wait_4e0771: "等等！还没！:好的，重新开始！"
  npc_override_1@pump_MalangdoCulvert_menu_what_1a42b4: "什么下水道？?:是的，我看到了。"
  npc_override_1@pump_MalangdoCulvert_menu_what_ede35f: "你在这里做什么？:普通下水道日常服务报酬:困难下水道日常服务报酬:普通下水道周常服务报酬:困难下水道周常服务报酬"
  npc_override_1@pump_MalangdoCulvert_might_look_unfamiliar_89bab3: "对于一个"
  npc_override_1@pump_MalangdoCulvert_more_than_member_member_161cf0: "超过1名成员或是成员"
  npc_override_1@pump_MalangdoCulvert_my_fur_falling_out_s_8689fe: "我的毛在脱落……都是"
  npc_override_1@pump_MalangdoCulvert_never_let_seaweeds_stack_c20c79: "还有……绝不要让6株海藻堆积！最多5株可以接受！如果有6株，我就把你拖出去！！"
  npc_override_1@pump_MalangdoCulvert_next_culvert_opened_sec_da6994: "下一个下水道将在5秒后打开。请快点找到下一个下水道的位置。"
  npc_override_1@pump_MalangdoCulvert_oh_0fd77a: "哦？"
  npc_override_1@pump_MalangdoCulvert_ohh_you_touched_my_fur_0b41f7: "哦！你摸了我的毛！"
  npc_override_1@pump_MalangdoCulvert_ok_let_s_start_now_6cc22b: "好！现在开始！"
  npc_override_1@pump_MalangdoCulvert_ok_now_begins_027ef7: "好！现在开始！"
  npc_override_1@pump_MalangdoCulvert_ok_then_i_ll_let_3ac615: "好吧，那我就让你像往常一样清理这里的下水道！我会在右手角落准备，请跟我来！"
  npc_override_1@pump_MalangdoCulvert_once_your_leader_finishe_3c5d9a: "一旦你的领袖完成准备，就会开始，所以做好准备！！"
  npc_override_1@pump_MalangdoCulvert_once_your_leader_finishe_e8d700: "一旦你的领袖完成准备，就会决定结算，所以做好准备！！"
  npc_override_1@pump_MalangdoCulvert_one_more_thing_talk_anyo_80d201: "还有一件事！不要跟任何人谈论你今天在这里看到的一切！！"
  npc_override_1@pump_MalangdoCulvert_one_who_s_charge_cleanin_de5c75: "负责清理下水道的人在施法结束前不能移动或受到攻击。"
  npc_override_1@pump_MalangdoCulvert_one_you_destroyed_among_1ca117: "你消灭的是各种腔棘鱼之一。其他人试图消灭它们但失败了。"
  npc_override_1@pump_MalangdoCulvert_only_party_members_parti_11990a: "只有队伍成员可以参加。"
  npc_override_1@pump_MalangdoCulvert_open_memo_e47a27: "打开备忘录。"
  npc_override_1@pump_MalangdoCulvert_outsider_actually_place_5e36f4: "外来者，但实际上这个地方"
  npc_override_1@pump_MalangdoCulvert_party_come_back_86fbc2: "的队伍然后回来。^000000"
  npc_override_1@pump_MalangdoCulvert_party_leader_39678c: "队伍领袖！"
  npc_override_1@pump_MalangdoCulvert_password_code_1c7535: "密码将从"
  npc_override_1@pump_MalangdoCulvert_reservation_failed_b861ab: "^0000ff{0}^000000 - 预约失败！"
  npc_override_1@pump_MalangdoCulvert_reserving_ddc444: "^3333FF{0}^000000 - 预约中"
  npc_override_1@pump_MalangdoCulvert_s_right_those_culverts_v_4a55b6: "没错！那些下水道非常重要！我们必须清理下水道以防止海藻堵塞。这就是我们清洁工的工作！"
  npc_override_1@pump_MalangdoCulvert_seagod_protection_you_1322fe: "有海神保护。"
  npc_override_1@pump_MalangdoCulvert_seems_missing_come_inspe_c08285: "似乎米辛很快会来检查清理结果。我们清理一下周围的混乱好吗？"
  npc_override_1@pump_MalangdoCulvert_select_enter_culvert_727242: "必须选择进入下水道。"
  npc_override_1@pump_MalangdoCulvert_so_you_ready_clean_now_9c1d38: "那么，你准备好清理了吗？"
  npc_override_1@pump_MalangdoCulvert_something_big_inside_aby_ff0ddb: "深渊中有巨大的东西伴随着巨大的噪音出现。"
  npc_override_1@pump_MalangdoCulvert_something_savage_inside_87c5e4: "深渊中有凶猛的东西伴随着巨大的噪音出现。"
  npc_override_1@pump_MalangdoCulvert_something_wrong_please_c_e20a17: "出错了。请再检查一遍！"
  npc_override_1@pump_MalangdoCulvert_sometimes_i_get_lucky_bo_fcd09c: "有时我能拿到幸运箱，"
  npc_override_1@pump_MalangdoCulvert_task_really_hard_you_so_e998af: "那个任务对你来说太难了，所以我不能告诉你。为什么不去找另一个？"
  npc_override_1@pump_MalangdoCulvert_thank_you_i_am_going_014fb1: "谢谢。我要回去倒水了！"
  npc_override_1@pump_MalangdoCulvert_there_culvert_along_way_258025: "这条路沿途有一个下水道"
  npc_override_1@pump_MalangdoCulvert_there_still_monsters_ali_3548c6: "还有怪物活着。"
  npc_override_1@pump_MalangdoCulvert_those_guys_fault_9f2744: "那些家伙的错~"
  npc_override_1@pump_MalangdoCulvert_today_heroes_culvert_30c577: "今天，下水道的英雄们！"
  npc_override_1@pump_MalangdoCulvert_tomas_orders_39c694: "托马斯的命令……"
  npc_override_1@pump_MalangdoCulvert_trembling_3c862b: "（颤抖）"
  npc_override_1@pump_MalangdoCulvert_trembling_cat_looking_up_9c3ca7: "^660066一只颤抖的猫正抬头看着你。^000000"
  npc_override_1@pump_MalangdoCulvert_turns_down_his_voice_65cfe3: "（压低声音）"
  npc_override_1@pump_MalangdoCulvert_uh_where_task_let_me_370b5a: "嗯！？任务在哪里？让我快点找到。你必须和马德卡说话！"
  npc_override_1@pump_MalangdoCulvert_um_i_m_sorry_you_5caa52: "嗯，对不起。你超时了，所以我不能给你任何报酬。"
  npc_override_1@pump_MalangdoCulvert_ummm_what_s_up_tell_671c85: "嗯？怎么了？如果你是领袖就告诉我密码！"
  npc_override_1@pump_MalangdoCulvert_underground_culvert_wher_75fa30: "这是你将和朋友一起清理的地下下水道！"
  npc_override_1@pump_MalangdoCulvert_unknown_error_occurred_58bda4: "发生了未知错误。"
  npc_override_1@pump_MalangdoCulvert_watch_out_some_monsters_0df9aa: "小心！清理下水道时有些怪物会追你！但不要向它们屈服！"
  npc_override_1@pump_MalangdoCulvert_we_crossed_sea_df5970: "我们渡过了大海！"
  npc_override_1@pump_MalangdoCulvert_we_don_t_need_weaking_1e8d63: "我们不需要弱者！！"
  npc_override_1@pump_MalangdoCulvert_we_forgive_seafood_invad_e39281: "我们不原谅入侵我们领土的海鲜。我要用辣酱吃掉它们！！！"
  npc_override_1@pump_MalangdoCulvert_we_great_heroes_culvert_523dfe: "我们是下水道的伟大英雄！我们不原谅瞄准下水道的海鲜！"
  npc_override_1@pump_MalangdoCulvert_we_had_many_issues_durin_a3e4c6: "我们在"
