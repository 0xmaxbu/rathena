Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_mjolnir_01_StPatrick_2008_after_cloud_dust_smoke_d_f68925: "一阵尘土和烟雾散去后，"
  npc_override_mjolnir_01_StPatrick_2008_ah_well_rested_i_hope_45da66: "啊，休息好了吧？"
  npc_override_mjolnir_01_StPatrick_2008_aye_i_understand_3fd88e: "是的，我理解。"
  npc_override_mjolnir_01_StPatrick_2008_boom_fec1ac: "*轰！*"
  npc_override_mjolnir_01_StPatrick_2008_box_must_contain_o_riley_54c61f: "这个箱子里一定装着奥莱利的宝物。"
  npc_override_mjolnir_01_StPatrick_2008_climb_mountain_until_nor_4f649e: "向北爬到山的最顶端。"
  npc_override_mjolnir_01_StPatrick_2008_come_here_me_now_come_cce2ba: "过来，过来，我告诉你一些事。"
  npc_override_mjolnir_01_StPatrick_2008_course_ye_need_great_num_1a526a: "当然，你需要大量的爆竹，至少需要^FF0000200个爆竹^000000"
  npc_override_mjolnir_01_StPatrick_2008_fair_bounty_ill_gotten_c_9fa3d5: "对于那些不义之财，这是公平的报酬。"
  npc_override_mjolnir_01_StPatrick_2008_find_my_treasure_true_a21a54: "找到我的宝藏，这是真的。"
  npc_override_mjolnir_01_StPatrick_2008_go_ahead_b1f554: "去吧。"
  npc_override_mjolnir_01_StPatrick_2008_hidden_mountain_side_me_d9c709: "藏在山腰里，我的宝藏就在那里。"
  npc_override_mjolnir_01_StPatrick_2008_hidden_secret_place_trea_452838: "藏在一个秘密的地方，宝藏会很安全，直到我第二年回到这个世界。"
  npc_override_mjolnir_01_StPatrick_2008_hmm_9c4d28: "嗯……"
  npc_override_mjolnir_01_StPatrick_2008_i_am_so_happy_3e96ae: "我太高兴了，"
  npc_override_mjolnir_01_StPatrick_2008_i_ask_ye_ya_help_c586f6: "我问你，你能帮我找回我的宝藏吗？"
  npc_override_mjolnir_01_StPatrick_2008_i_even_begun_brewing_me_27f44b: "我甚至还没开始酿造我著名的绿色麦酒，因为这场混乱。"
  npc_override_mjolnir_01_StPatrick_2008_i_ll_reward_ye_one_b5ae15: "我会用一壶麦酒来奖励你，换取^0000FF1个金币^000000、^0000FF5个银币^000000或^0000FF10个铜币^000000。"
  npc_override_mjolnir_01_StPatrick_2008_i_ll_starting_up_me_eef0df: "我立刻开始酿造我的麦酒"
  npc_override_mjolnir_01_StPatrick_2008_i_made_safe_place_hide_159905: "我找了一个安全的地方来藏我的宝藏。"
  npc_override_mjolnir_01_StPatrick_2008_i_pulled_i_heaved_pushed_456108: "我拉啊推啊，但藏宝的地方纹丝不动。"
  npc_override_mjolnir_01_StPatrick_2008_i_so_generous_give_you_1804dd: "如果你能帮我带回那些邪恶蛇类携带的不义之财，我会慷慨地给你一些我著名的麦酒"
  npc_override_mjolnir_01_StPatrick_2008_i_thought_meself_i_am_590b18: "我心想，我真聪明，把宝藏藏得那些蛇找不到。"
  npc_override_mjolnir_01_StPatrick_2008_i_traveled_me_cache_gold_1c3e24: "我去查看我的黄金宝库，发现它安全无恙。"
  npc_override_mjolnir_01_StPatrick_2008_i_understanding_if_you_t_8b2802: "如果你去不了，我理解，真的。"
  npc_override_mjolnir_01_StPatrick_2008_i_ve_learned_me_lesson_12c0e8: "我已经吸取了教训，永远不会忘记那些邪恶的蛇是如何伤害我的。"
  npc_override_mjolnir_01_StPatrick_2008_if_you_find_one_treasure_9c78c3: "如果你找到我族人的宝藏之一，请把那些硬币带给我，不要让蛇得到它们。"
  npc_override_mjolnir_01_StPatrick_2008_if_you_moment_spare_cc3814: "如果你有空的话。"
  npc_override_mjolnir_01_StPatrick_2008_let_s_bring_box_o_0b886c: "让我们把箱子带给奥莱利。"
  npc_override_mjolnir_01_StPatrick_2008_make_journey_city_magici_960a70: "前往魔法师之城。"
  npc_override_mjolnir_01_StPatrick_2008_maybe_o_riley_knows_way_992aeb: "也许奥莱利知道移动石头的方法。"
  npc_override_mjolnir_01_StPatrick_2008_me_gratitude_knows_no_bo_3752e5: "我的感激之情无以言表！"
  npc_override_mjolnir_01_StPatrick_2008_me_hiding_spot_might_har_14b45f: "我的藏宝点可能有点难打开。"
  npc_override_mjolnir_01_StPatrick_2008_menu_bronze_6c0099: "铜币:银币:金币:退出。"
  npc_override_mjolnir_01_StPatrick_2008_menu_sure_a7d180: "当然，我可以帮你:我太忙了。"
  npc_override_mjolnir_01_StPatrick_2008_menu_use_304223: "使用爆竹:忽略"
  npc_override_mjolnir_01_StPatrick_2008_my_hiding_place_too_clev_0167e8: "我的藏宝点太聪明了。"
  npc_override_mjolnir_01_StPatrick_2008_my_treasure_i_give_my_9149dc: "为了我的宝藏，我把秘密告诉你。"
  npc_override_mjolnir_01_StPatrick_2008_oh_0fd77a: "哦？"
  npc_override_mjolnir_01_StPatrick_2008_oh_i_fool_still_cce93d: "哦，但我还是个傻瓜。"
  npc_override_mjolnir_01_StPatrick_2008_oh_welcome_back_7e1550: "哦，欢迎回来！"
  npc_override_mjolnir_01_StPatrick_2008_over_bridge_across_water_151a3a: "过桥，越过水面"
  npc_override_mjolnir_01_StPatrick_2008_passed_stone_steps_set_i_0a3851: "经过悬空的石阶。"
  npc_override_mjolnir_01_StPatrick_2008_rocks_won_t_budge_d75d66: "石头纹丝不动。"
  npc_override_mjolnir_01_StPatrick_2008_seems_snakes_returned_ye_4972b2: "看来蛇今年又回来了，要偷我的宝藏。"
  npc_override_mjolnir_01_StPatrick_2008_snakes_carry_coins_my_ki_569a84: "蛇携带着我族人的硬币，必须受到惩罚。"
  npc_override_mjolnir_01_StPatrick_2008_snakes_carry_coins_my_ki_df82a0: "蛇携带着我族人的硬币，必须受到惩罚。"
  npc_override_mjolnir_01_StPatrick_2008_snakes_carry_too_many_me_a823d1: "蛇携带了太多我族人的硬币，所以我准备用麦酒作为奖励来换回来。"
  npc_override_mjolnir_01_StPatrick_2008_so_listen_well_make_no_1c013d: "所以，仔细听，不要遗漏。"
  npc_override_mjolnir_01_StPatrick_2008_so_once_again_i_am_d55551: "所以又一次，我今年没有宝藏了。"
  npc_override_mjolnir_01_StPatrick_2008_so_what_kind_coin_ye_320a8b: "那么，你带来了哪种硬币？"
  npc_override_mjolnir_01_StPatrick_2008_thank_you_coming_again_3e827f: "谢谢你又来了。"
  npc_override_mjolnir_01_StPatrick_2008_thank_you_here_s_your_0fbe76: "谢谢。这是你的麦酒~"
  npc_override_mjolnir_01_StPatrick_2008_thank_you_listening_me_t_01e136: "谢谢你听我的故事。"
  npc_override_mjolnir_01_StPatrick_2008_thank_you_returning_me_t_7d368d: "谢谢你帮我找回宝藏！"
  npc_override_mjolnir_01_StPatrick_2008_these_past_years_i_ve_8a508b: "这些年来，我每年都会来看看这个世界，但每次蛇都会偷走我的宝藏。"
  npc_override_mjolnir_01_StPatrick_2008_tis_fine_day_a2bc6d: "今天天气真好。"
  npc_override_mjolnir_01_StPatrick_2008_what_did_you_341410: "你做了什么？"
  npc_override_mjolnir_01_StPatrick_2008_what_happened_e9ef65: "发生了什么？"
  npc_override_mjolnir_01_StPatrick_2008_when_ye_had_moment_rest_d0c0f5: "当你休息好了，再来找我，我们可以再聊聊"
  npc_override_mjolnir_01_StPatrick_2008_ye_fine_folks_land_been_e37100: "你们这片土地的善良人们一次又一次地帮我找回了宝藏。"
  npc_override_mjolnir_01_StPatrick_2008_ye_had_long_journey_whic_8e2c8e: "但你经历了漫长的旅程，我非常感激。"
  npc_override_mjolnir_01_StPatrick_2008_ye_might_try_some_firecr_c62d16: "你可以试试用爆竹。"
  npc_override_mjolnir_01_StPatrick_2008_ye_must_find_way_break_ed3fab: "你必须找到打开它的方法。"
  npc_override_mjolnir_01_StPatrick_2008_ye_need_mighty_explosion_448c7a: "你需要一场强大的爆炸来释放宝库，这是肯定的。"
  npc_override_mjolnir_01_StPatrick_2008_year_i_made_me_journey_0d3898: "今年，我又一次踏上了看外面世界的旅程。"
  npc_override_mjolnir_01_StPatrick_2008_you_buried_firecrackers_1686a4: "你把200个爆竹埋在石头堆下面。"
  npc_override_mjolnir_01_StPatrick_2008_you_found_me_treasure_ye_7980e8: "你找到我的宝藏了吗，找到了吗？"
  npc_override_mjolnir_01_StPatrick_2008_you_light_fuse_cd0d3a: "你点燃了引线。"
  npc_override_mjolnir_01_StPatrick_2008_you_ve_found_box_between_34a1eb: "你在石头和泥土之间发现了一个箱子。"
  npc_override_mjolnir_01_StPatrick_2008_you_ve_found_pile_rocks_fa2569: "- 你发现了一堆被泥土覆盖的石头。 -"
