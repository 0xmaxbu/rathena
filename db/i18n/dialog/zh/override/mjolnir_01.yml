  npc_override_mjolnir_01_quest_coco_how_many_you_like_hunt_7fc82d: "你想猎杀多少只？"
  npc_override_mjolnir_01_quest_coco_i_i_just_t_seem_b3f4aa: "我……我就是找不到。"
