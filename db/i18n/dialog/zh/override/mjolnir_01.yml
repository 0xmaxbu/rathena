  npc_override_mjolnir_01_quest_caramel_you_finished_hunting_car_c4dd74: "你猎杀完50只卡拉梅尔了吗？"
  npc_override_mjolnir_01_quest_caramel_you_gather_them_i_give_67f66a: "你可以去收集它们，我会为你的努力给予奖励！"
  npc_override_mjolnir_01_quest_caramel_you_know_what_here_idea_b3e9be: "你知道吗，我有个主意。"
  npc_override_mjolnir_01_quest_caramel_you_sure_you_want_stop_507e20: "你确定要停止猎杀吗？"
  npc_override_mjolnir_01_quest_caramel_you_think_i_wouldn_t_db6595: "你觉得我会注意不到吗？"
  npc_override_mjolnir_01_quest_caramel_your_back_crush_you_come_d8fffe: "你的背会压垮你的。等你"
  npc_override_mjolnir_01_quest_coco_after_you_lost_some_weig_b89d61: "在你减掉一些体重之后。"
  npc_override_mjolnir_01_quest_coco_ah_ok_i_think_you_2ab08e: "啊，好的，我想你可以帮我猎杀一些可可。"
  npc_override_mjolnir_01_quest_coco_amazing_you_did_speed_6cc3cd: "太厉害了，你做得真快。"
