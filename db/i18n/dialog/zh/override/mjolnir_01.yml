  npc_override_mjolnir_01_quest_caramel_menu_yes_755efb: "是:否:我想放弃"
  npc_override_mjolnir_01_quest_caramel_now_wait_minute_you_litt_576e99: "等等，你的等级是不是有点太高了？"
