  npc_override_mjolnir_01_quest_caramel_remember_i_need_help_hun_04404a: "记住，我需要帮忙猎杀卡拉梅尔，所以去猎杀50只吧。"
  npc_override_mjolnir_01_quest_caramel_remember_i_need_help_hun_324286: "记住，我需要帮忙猎杀卡拉梅尔，所以去猎杀150只吧。"
  npc_override_mjolnir_01_quest_caramel_remember_i_need_help_hun_74243a: "记住，我需要帮忙猎杀卡拉梅尔，所以去猎杀100只吧。"
