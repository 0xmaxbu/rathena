Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_grademk_enchantgrade_adventurer_may_potential_18acaf: "冒险者可能拥有连他自己都不知道的潜力。"
  npc_override_grademk_enchantgrade_anyway_if_you_use_etheri_f2edd5: "总之，如果你使用这颗以太宝石，就可以强化你正在使用的武器。"
  npc_override_grademk_enchantgrade_easy_move_magical_power_494b84: "调动宝石的魔力可不是件容易的事。"
  npc_override_grademk_enchantgrade_enhance_equipment_s_grad_e7c4f5: "强化装备的品级。"
  npc_override_grademk_enchantgrade_etel_dust_jewels_base_if_f08516: "埃特尔粉尘，作为基础的宝石，如果你给我一点手续费，我可以把它换成埃特尔宝石。"
  npc_override_grademk_enchantgrade_explosions_may_also_occu_024433: "在处理魔力的过程中也可能发生爆炸。"
  npc_override_grademk_enchantgrade_hello_dear_customer_who_22d9c8: "你好，走进来的贵客，让我们今天期待奇迹的发生吧。"
  npc_override_grademk_enchantgrade_how_i_help_you_13e773: "有什么可以帮你的吗？"
  npc_override_grademk_enchantgrade_i_decided_call_such_gems_669823: "我决定把这样的宝石称为以太宝石。"
  npc_override_grademk_enchantgrade_i_ll_still_8e4b01: "我还是会做的！"
  npc_override_grademk_enchantgrade_i_suribell_my_best_0d1ce3: "我，苏里贝尔，会全力以赴的！"
  npc_override_grademk_enchantgrade_i_wish_good_luck_our_4b18fd: "祝我们勇敢的客人好运！"
  npc_override_grademk_enchantgrade_if_you_combine_etel_dust_25770f: "如果你把埃特尔粉尘和宝石结合起来制作，那就没问题了！一颗属于冒险者的埃特尔宝石就完成了！"
  npc_override_grademk_enchantgrade_let_s_hold_hands_faith_bb52ec: "让我们手牵手，保持信念！咬紧牙关试试！"
  npc_override_grademk_enchantgrade_magical_power_etheric_ge_fac9b4: "以太宝石的魔力有时会唤醒装备隐藏的潜力。"
  npc_override_grademk_enchantgrade_magical_power_explode_sp_50af27: "魔力可能会当场爆炸。"
  npc_override_grademk_enchantgrade_may_good_luck_always_you_5ea702: "愿好运永远伴随你！"
  npc_override_grademk_enchantgrade_occasionally_unstable_je_ce03db: "偶尔，会发现含有大量纯净魔力的不稳定宝石。"
  npc_override_grademk_enchantgrade_okay_let_s_drink_glass_1759e4: "好的！让我们喝一杯凉水冷静一下！"
  npc_override_grademk_enchantgrade_our_customer_you_want_en_81cc87: "我们的客人。你想强化装备的品级。"
  npc_override_grademk_enchantgrade_performance_gets_better_6951e7: "性能会变得更好。我们称之为品级强化。"
  npc_override_grademk_enchantgrade_s_delicate_so_if_you_8610be: "它很精密，所以如果你不小心，砰！就会爆炸。"
  npc_override_grademk_enchantgrade_still_if_you_re_trying_52aea3: "不过，如果你想强化品级的话……！"
  npc_override_grademk_enchantgrade_then_weapon_inherit_magi_b73ea5: "那么将要继承魔力的武器也会爆炸！"
  npc_override_grademk_enchantgrade_there_risk_destroyed_if_58b758: "如果操作不当有损坏的风险，但带着信念去尝试吧！"
  npc_override_grademk_enchantgrade_these_jewels_used_enhanc_f1c355: "这些是用来强化品级的宝石。"
  npc_override_grademk_enchantgrade_we_call_grade_enhancemen_b90ce3: "我们称之为品级强化，因为它会提升一个品阶！"
  npc_override_grademk_enchantgrade_we_call_these_etheric_ge_addf94: "我们把这些叫做以太宝石，对吧？"
  npc_override_grademk_enchantgrade_we_people_who_assist_s_d34960: "我们就是协助这件事的人。不过有点风险。啊哈哈。"
  npc_override_grademk_enchantgrade_welcome_paramarket_s_gra_719aa0: "欢迎来到帕拉市场的品级强化中心~"
  npc_override_grademk_enchantgrade_whenever_you_courage_cha_493e87: "每当你有勇气挑战的时候，请随时回来。"
  npc_override_grademk_enchantgrade_who_i_am_suribell_db03d1: "谁？我是苏里贝尔！"
  npc_override_grademk_enchantgrade_you_like_combine_jewels_23f5f1: "你想把宝石和埃特尔粉尘结合起来吗？"
  npc_override_grademk_enchantgrade_you_need_etheric_gems_en_f163d8: "你需要以太宝石来强化品级！"
  npc_override_grademk_enchantgrade_you_too_wouldn_t_you_41c697: "你难道不希望心爱的武器再成长一步吗？"
  npc_override_grademk_enchantgrade_you_transfer_magical_pow_67f555: "你可以将以太宝石的魔力转移到其他武器上，但当然也有一些风险。"
  npc_override_grademk_enchantgrade_you_want_unlock_potentia_3be610: "你想解锁你心爱装备的潜力吗？"
