Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_ayo_fild01_quest_leafcat_after_you_lost_some_weig_b89d61: "等你减掉一些体重之后再来。"
  npc_override_ayo_fild01_quest_leafcat_ah_ok_i_think_you_a8e830: "啊，好的，我觉得你可以帮我猎杀一些叶猫。"
  npc_override_ayo_fild01_quest_leafcat_amazing_you_did_speed_6cc3cd: "太厉害了，你做得真快。"
  npc_override_ayo_fild01_quest_leafcat_any_progress_you_ve_made_b3e247: "你所取得的任何进展都会被清零"
  npc_override_ayo_fild01_quest_leafcat_come_back_when_you_ve_44350c: "等你完成任务后再回来，我会给你一份小小的奖励。"
  npc_override_ayo_fild01_quest_leafcat_hey_looks_like_weight_7817f7: "嘿，看起来你身上的担子"
  npc_override_ayo_fild01_quest_leafcat_hmm_i_don_t_think_1d8eb5: "嗯，我觉得你还没猎够100只……"
  npc_override_ayo_fild01_quest_leafcat_hmm_i_don_t_think_2144d7: "嗯，我觉得你还没猎够50只……"
  npc_override_ayo_fild01_quest_leafcat_hmm_i_don_t_think_5d960b: "嗯，我觉得你还没猎够150只……"
  npc_override_ayo_fild01_quest_leafcat_how_many_you_like_hunt_7fc82d: "你想猎杀多少只？"
  npc_override_ayo_fild01_quest_leafcat_i_need_huge_leafs_55d44a: "我需要^00CE0050片巨大的叶子^000000。"
  npc_override_ayo_fild01_quest_leafcat_i_really_need_gather_hug_6def30: "我真的需要收集^00CE0050片巨大的叶子^000000来让我保持清醒。"
  npc_override_ayo_fild01_quest_leafcat_if_you_change_your_mind_3f2210: "如果你改变主意了，请回来。"
  npc_override_ayo_fild01_quest_leafcat_menu_gather_8741e7: "收集物品:猎杀叶猫:取消"
  npc_override_ayo_fild01_quest_leafcat_menu_i_3056fd: "我有50片巨大的叶子:什么，抱歉我刚走神了"
  npc_override_ayo_fild01_quest_leafcat_menu_leaf_771dca: "50只叶猫:100只叶猫:150只叶猫"
  npc_override_ayo_fild01_quest_leafcat_menu_sure_859d29: "当然:不"
  npc_override_ayo_fild01_quest_leafcat_menu_yes_141459: "好的:不"
  npc_override_ayo_fild01_quest_leafcat_menu_yes_755efb: "好的:不:我想放弃"
  npc_override_ayo_fild01_quest_leafcat_meow_meow_meow_meow_meow_ca8b33: "喵喵喵喵喵……"
  npc_override_ayo_fild01_quest_leafcat_more_leafs_i_collect_qui_636823: "我收集的叶子越多，这里似乎就越安静。"
  npc_override_ayo_fild01_quest_leafcat_noooooooooooo_870e77: "不———————。"
  npc_override_ayo_fild01_quest_leafcat_ok_then_well_come_back_0e1574: "那好吧，如果你改变主意了就回来。"
  npc_override_ayo_fild01_quest_leafcat_please_kill_leaf_cats_1db9f4: "请猎杀100只叶猫。"
  npc_override_ayo_fild01_quest_leafcat_please_kill_leaf_cats_354ba9: "请猎杀150只叶猫。"
  npc_override_ayo_fild01_quest_leafcat_please_kill_leaf_cats_75bbca: "请猎杀50只叶猫。"
  npc_override_ayo_fild01_quest_leafcat_quickly_escape_before_th_2e018a: "趁它们还没抓狂你的理智之前快跑！"
  npc_override_ayo_fild01_quest_leafcat_remember_i_need_help_hun_689bff: "记住，我需要帮忙猎杀叶猫，所以去猎杀150只吧。"
  npc_override_ayo_fild01_quest_leafcat_remember_i_need_help_hun_87f06d: "记住，我需要帮忙猎杀叶猫，所以去猎杀50只吧。"
  npc_override_ayo_fild01_quest_leafcat_remember_i_need_help_hun_ed5bac: "记住，我需要帮忙猎杀叶猫，所以去猎杀100只吧。"
  npc_override_ayo_fild01_quest_leafcat_sure_why_you_here_i_b10554: "不知道你为什么在这里，但我不能给你悬赏，因为那样对你来说太轻松了！"
  npc_override_ayo_fild01_quest_leafcat_thanks_you_re_life_saver_27bd19: "谢谢！你真是我的救命恩人！"
  npc_override_ayo_fild01_quest_leafcat_why_hello_dc967a: "你好啊！"
  npc_override_ayo_fild01_quest_leafcat_wonderful_i_tell_just_li_1060a1: "太好了，我能感觉到这里稍微安静了一点！"
  npc_override_ayo_fild01_quest_leafcat_you_any_3579ad: "你有吗？"
  npc_override_ayo_fild01_quest_leafcat_you_finished_hunting_lea_099e99: "你猎完150只叶猫了吗？"
  npc_override_ayo_fild01_quest_leafcat_you_finished_hunting_lea_2ba3c1: "你猎完50只叶猫了吗？"
  npc_override_ayo_fild01_quest_leafcat_you_look_like_someone_wh_b2b66f: "你看起来像是那种愿意帮助一个快要发疯的人的人。"
  npc_override_ayo_fild01_quest_leafcat_you_sure_you_want_stop_507e20: "你确定要停止猎杀吗？"
  npc_override_ayo_fild01_quest_leafcat_your_back_crush_you_come_d8fffe: "你的背会压垮你的。回来吧。"
