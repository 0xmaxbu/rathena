Header:
  Type: I18N_DIALOG
  Version: 1
Body:
  npc_override_1@exsh_DeepForest_ask_them_let_you_468306: "让他们让你进去。"
  npc_override_1@exsh_DeepForest_go_back_288584: "回去。"
  npc_override_1@exsh_DeepForest_hyunrok_told_me_bring_su_735d15: "Hyunrok 告诉我不要带可疑的人进来！！"
  npc_override_1@exsh_DeepForest_leave_deep_forest_f909d9: "离开深林。"
  npc_override_1@exsh_DeepForest_menu_admiral_299f41: "Lee Daegam 提督：Kwang Saeng，我觉得你走得太深了，为什么不把这个交给你的手下呢？"
  npc_override_1@exsh_DeepForest_menu_admiral_746859: "Lee Daegam 提督：这到底是什么！"
  npc_override_1@exsh_DeepForest_menu_admiral_9235ad: "Lee Daegam 提督：一个有角的男人！！！"
  npc_override_1@exsh_DeepForest_menu_admiral_bc15b6: "Lee Daegam 提督：我们在哪里？"
  npc_override_1@exsh_DeepForest_menu_admiral_c4d231: "Lee Daegam 提督：为什么野兽穿着衣服？"
  npc_override_1@exsh_DeepForest_menu_admiral_e31b7d: "Lee Daegam 提督：哎呀！"
  npc_override_1@exsh_DeepForest_menu_admiral_eefaf1: "Lee Daegam 提督：啊啊啊！！！"
  npc_override_1@exsh_DeepForest_menu_chulho_0689c2: "Chulho：啊！！我做不到！！！"
  npc_override_1@exsh_DeepForest_menu_chulho_09cd64: "Chulho：你一直在看！！！"
  npc_override_1@exsh_DeepForest_menu_chulho_11b5e9: "Chulho：我找你很久了！"
  npc_override_1@exsh_DeepForest_menu_chulho_27e226: "Chulho：那么他在北边主楼附近！"
  npc_override_1@exsh_DeepForest_menu_chulho_35d5d8: "Chulho：但你为什么攻击我！"
  npc_override_1@exsh_DeepForest_menu_chulho_5c6ed4: "Chulho：这是前门，所以我们快点进去吧。"
  npc_override_1@exsh_DeepForest_menu_chulho_5c83f9: "Chulho：他的气味和我一样！！！"
  npc_override_1@exsh_DeepForest_menu_chulho_7e1647: "Chulho：你在说什么！"
  npc_override_1@exsh_DeepForest_menu_chulho_7ec50e: "Chulho：Ch——"
  npc_override_1@exsh_DeepForest_menu_chulho_7f46f3: "Chulho：我得去找 Hyunrok。"
  npc_override_1@exsh_DeepForest_menu_chulho_82979d: "Chulho：啊啊啊！！！"
  npc_override_1@exsh_DeepForest_menu_chulho_832687: "Chulho：别无视我说的话！"
  npc_override_1@exsh_DeepForest_menu_chulho_97209b: "Chulho：我以为我要死了……"
  npc_override_1@exsh_DeepForest_menu_chulho_975ba5: "Chulho：现在不是坐着的时候！"
  npc_override_1@exsh_DeepForest_menu_chulho_99ecf4: "Chulho：你马上就跟来了！"
  npc_override_1@exsh_DeepForest_menu_chulho_a652dd: "Chulho：谢谢你！"
  npc_override_1@exsh_DeepForest_menu_chulho_b342cc: "Chulho：我会变成那样吗！！！"
  npc_override_1@exsh_DeepForest_menu_chulho_b38fb7: "Chulho：那你可以继续和我玩！"
  npc_override_1@exsh_DeepForest_menu_chulho_bd8495: "Chulho：什么？！"
  npc_override_1@exsh_DeepForest_menu_chulho_c1a2ff: "Chulho：别光说，帮帮我！"
  npc_override_1@exsh_DeepForest_menu_chulho_c6616a: "Chulho：啊！！你为什么突然打我！！！"
  npc_override_1@exsh_DeepForest_menu_chulho_ca6c6c: "Chulho：如果我变成那样的怪物怎么办！"
  npc_override_1@exsh_DeepForest_menu_chulho_d1ccbc: "Chulho：啊啊啊！！！太恶心了！！！！！"
  npc_override_1@exsh_DeepForest_menu_chulho_d47103: "Chulho：发生什么事了！"
  npc_override_1@exsh_DeepForest_menu_chulho_dab572: "Chulho：这个人是像我一样的老虎！"
  npc_override_1@exsh_DeepForest_menu_chulho_dd5ec2: "Chulho：天哪！"
  npc_override_1@exsh_DeepForest_menu_chulho_f3dcff: "Chulho：原来你在这里！"
  npc_override_1@exsh_DeepForest_menu_chulho_f55112: "Chulho：看起来 Hyunrok 非常生气，因为空气中弥漫着凶猛的气息。"
  npc_override_1@exsh_DeepForest_menu_chulho_f75246: "Chulho：让我们让这家伙冷静下来，然后进入森林！！！"
  npc_override_1@exsh_DeepForest_menu_chulho_fcd689: "Chulho：是我！！是我！！是 Chulho！！！"
  npc_override_1@exsh_DeepForest_menu_chulho_fe53a6: "Chulho：那我们教训了坏人，就开派对吧！"
  npc_override_1@exsh_DeepForest_menu_guard_06c7d1: "守卫：如果你不想回去，就得先过我们这一关！！！！"
  npc_override_1@exsh_DeepForest_menu_guard_2977b1: "守卫：我告诉过你回去！！！"
  npc_override_1@exsh_DeepForest_menu_hyunrok_0ed739: "Hyunrok：你是怎么进入这个地方的？"
  npc_override_1@exsh_DeepForest_menu_hyunrok_14f597: "Hyunrok：退后！！！你竟敢！"
  npc_override_1@exsh_DeepForest_menu_hyunrok_292dfb: "Hyunrok：Chulho，Kisul。你们回来了。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_311ebd: "Hyunrok：想用那种力量赢得这片森林是鲁莽的。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_3b5e80: "Hyunrok：即使是最轻微的痕迹对你来说也太多了，但我希望痕迹的生命能成为你反思罪行的机会。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_401b3a: "Hyunrok：他不像我们一样是森林的一部分，他是林务员，他是林务员。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_5289c6: "Hyunrok：你最好回到属于你的地方。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_58da38: "Hyunrok：总之，我认为任何住在森林外面的人都应该回到外面。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_692052: "Hyunrok：我想我只出去了一会儿。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_70fb25: "Hyunrok：那不可能。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_7bebff: "Hyunrok：扰乱森林的人又来了。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_7ef493: "Hyunrok：让我现在送你回去。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_86bbe3: "Hyunrok：请……"
  npc_override_1@exsh_DeepForest_menu_hyunrok_8c6f78: "Hyunrok：啊啊！！"
  npc_override_1@exsh_DeepForest_menu_hyunrok_9a9b00: "Hyunrok：你能有多粗鲁！！！"
  npc_override_1@exsh_DeepForest_menu_hyunrok_a2e8a6: "Hyunrok：我们不能只是坐着。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_a49d68: "Hyunrok：你回来的时候我在森林前留了一封短信，所以请在离开前看一下。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_bf1cdd: "Hyunrok：所以在你对这个地方着迷之前回去吧。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_cdadb8: "Hyunrok：一路平安回家……"
  npc_override_1@exsh_DeepForest_menu_hyunrok_d47e69: "Hyunrok：天哪！！！"
  npc_override_1@exsh_DeepForest_menu_hyunrok_de7d2c: "Hyunrok：还有 {0}，非常感谢你在我无礼的情况下仍然帮助我们。"
  npc_override_1@exsh_DeepForest_menu_hyunrok_f16404: "Hyunrok：你在说什么？"
  npc_override_1@exsh_DeepForest_menu_hyunrok_f1b6b5: "Hyunrok：但你旁边的人是……？"
  npc_override_1@exsh_DeepForest_menu_hyunrok_f265ee: "Hyunrok：虽然和你有一些相似之处，Chulho……"
  npc_override_1@exsh_DeepForest_menu_kisul_166e9a: "Kisul：别那样站着，动起来。"
  npc_override_1@exsh_DeepForest_menu_kisul_27880b: "Kisul：那是因为我还年轻，所以请理解~"
  npc_override_1@exsh_DeepForest_menu_kisul_3cc3d9: "Kisul：天哪~"
  npc_override_1@exsh_DeepForest_menu_kisul_455fa0: "Kisul：我不是告诉过你不要吃任何东西吗？"
  npc_override_1@exsh_DeepForest_menu_kisul_4d61de: "Kisul：气味不会消失，所以被认为是可疑的也很自然！"
  npc_override_1@exsh_DeepForest_menu_kisul_5aef02: "Kisul：让我看看……"
  npc_override_1@exsh_DeepForest_menu_kisul_5efb47: "Kisul：如果是 Hyunrok，他总是在那里。"
  npc_override_1@exsh_DeepForest_menu_kisul_6cfb9e: "Kisul：嗯……"
  npc_override_1@exsh_DeepForest_menu_kisul_745162: "Kisul：好吧，让我们让怪物们睡着，然后再谈。"
  npc_override_1@exsh_DeepForest_menu_kisul_7fd842: "Kisul：很久没见过有趣的东西了~"
  npc_override_1@exsh_DeepForest_menu_kisul_828fa4: "Kisul：他有很多角！"
  npc_override_1@exsh_DeepForest_menu_kisul_915d9d: "Kisul：哈哈哈哈哈！！！"
  npc_override_1@exsh_DeepForest_menu_kisul_99cb20: "Kisul：开始有股不祥的气息了，所以你最好快点去找 Hyunrok。"
  npc_override_1@exsh_DeepForest_menu_kisul_9a1069: "Kisul：吃了那药后，你不会像其他野生动物一样变化的。"
  npc_override_1@exsh_DeepForest_menu_kisul_9aebaa: "Kisul：不会很难的，所以尽力吧。"
  npc_override_1@exsh_DeepForest_menu_kisul_af13a5: "Kisul：我觉得很奇怪，但你不知道吗？！"
  npc_override_1@exsh_DeepForest_menu_kisul_bb6f53: "Kisul：你又要做烦人的事了吗？"
  npc_override_1@exsh_DeepForest_menu_kisul_bb7800: "Kisul：盛宴虽好，但如果你在森林里待太久，你就回不去了。"
  npc_override_1@exsh_DeepForest_menu_kisul_bffec1: "Kisul：哈哈哈哈哈！"
  npc_override_1@exsh_DeepForest_menu_kisul_d5fd64: "Kisul：啊~"
  npc_override_1@exsh_DeepForest_menu_kisul_dc69cd: "Kisul：事情比我想象的更有趣。"
  npc_override_1@exsh_DeepForest_menu_kisul_f03faf: "Kisul：你那样慌张很难……"
  npc_override_1@exsh_DeepForest_menu_kisul_f74f69: "Kisul：冷静下来，待在原地。"
  npc_override_1@exsh_DeepForest_menu_kwang_17c828: "Kwang Saeng：啊！！"
  npc_override_1@exsh_DeepForest_menu_kwang_5d4347: "Kwang Saeng：嘿嘿嘿嘿！！！"
  npc_override_1@exsh_DeepForest_menu_kwang_72910a: "Kwang Saeng：无人能够进入的深林中的神秘野兽！！！！"
  npc_override_1@exsh_DeepForest_menu_kwang_92d559: "Kwang Saeng：因为所有吃了我的药的动物都别无选择，只能听从我的命令。"
  npc_override_1@exsh_DeepForest_menu_kwang_9b4bf9: "Kwang Saeng：一只传说中的动物就在我眼前，只要割下并腌制那些角就能永生！！！！"
  npc_override_1@exsh_DeepForest_menu_kwang_b074f0: "Kwang Saeng：你无法用森林里的野兽阻止我！"
  npc_override_1@exsh_DeepForest_menu_kwang_bf47ed: "Kwang Saeng：哦！！！！"
  npc_override_1@exsh_DeepForest_menu_kwang_ee54e7: "Kwang Saeng：为什么！！！"
  npc_override_1@exsh_DeepForest_menu_kwang_f29c30: "Kwang Saeng：啊！！！！！"
  npc_override_1@exsh_DeepForest_menu_kwang_f5906b: "Kwang Saeng：我终于找到了！！！"
  npc_override_1@exsh_DeepForest_menu_options_0e7117: "？？？：是谁！！！气味很可疑！！！"
  npc_override_1@exsh_DeepForest_menu_options_7141ee: "？？？？？：啊啊啊！！！"
  npc_override_1@exsh_DeepForest_menu_options_778c24: "？？？：立刻离开这片森林！！"
  npc_override_1@exsh_DeepForest_menu_options_858d73: "？？？：我从未闻过这样的气味！！！"
  npc_override_1@exsh_DeepForest_menu_options_9e4251: "？？？？？：太过分了！！！"
  npc_override_1@exsh_DeepForest_menu_options_ea0788: "？？？？？：嗯！！！！"
  npc_override_1@exsh_DeepForest_something_mysterious_see_eac113: "'- 似乎有什么神秘的东西挡住了去路。我们先和 Chulho 谈谈。-'"
  npc_override_1@exsh_DeepForest_you_t_pass_through_here_829d24: "你无法通过这里。"
