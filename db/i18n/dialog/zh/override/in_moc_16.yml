  npc_override_in_moc_16_assassin_sorry_laughing_hilarious_8840b8: "抱歉笑了，但这太好笑了！哈哈哈~ 那么你想让我给你一些提示吗？"
  npc_override_in_moc_16_assassin_sounds_funny_23e343: "听起来很有趣。"
  npc_override_in_moc_16_assassin_standby_room_48fff1: "待命室"
  npc_override_in_moc_16_assassin_stop_cowering_fear_41848b: "不要再畏缩了！"
  npc_override_in_moc_16_assassin_stop_wastin_my_time_19923f: "别再浪费我的时间了……"
  npc_override_in_moc_16_assassin_stronger_f8341c: "变得更强"
  npc_override_in_moc_16_assassin_stronger_than_thieves_073a95: "比盗贼更强。"
  npc_override_in_moc_16_assassin_style_appearance_only_su_04ad63: "风格和外表只是表面的。可悲的是，很多人都这么想……"
  npc_override_in_moc_16_assassin_such_disgraceful_assassi_b3d041: "这种失去真正目标的丢脸刺客，我们会用自己的方式处理……"
  npc_override_in_moc_16_assassin_supports_you_how_5042f5: "支持你。怎么样"
  npc_override_in_moc_16_assassin_survive_any_situation_96d99a: "在任何情况下生存。"
  npc_override_in_moc_16_assassin_take_break_oh_alright_yo_5903ff: "休息一下？哦好吧，随你便。当你觉得准备好成为刺客时，再回来。"
  npc_override_in_moc_16_assassin_take_your_time_travel_wi_19604e: "慢慢来，明智地旅行。"
  npc_override_in_moc_16_assassin_test_hall_02fc24: "前往试炼大厅。"
  npc_override_in_moc_16_assassin_than_you_now_4a13fc: "比你现在更强？"
  npc_override_in_moc_16_assassin_then_give_me_form_so_49d4dd: "那么把表格给我，这样我就可以送你去试炼大厅，好吗？"
  npc_override_in_moc_16_assassin_there_aren_t_many_bowmen_5211b2: "没有多少弓箭手有胆量靠近这个地方。好吧，你觉得你来这里做什么？！"
  npc_override_in_moc_16_assassin_there_many_assassins_out_337df1: "外面有很多刺客。把他们当作你的训练师，征求他们的意见。"
  npc_override_in_moc_16_assassin_there_s_library_prontera_2a81fe: "普隆德拉和朱诺有图书馆欢迎你，所以你为什么不像变魔术一样消失呢？"
  npc_override_in_moc_16_assassin_they_b2211c: "他们会"
  npc_override_in_moc_16_assassin_they_cause_problems_brin_d6a866: "他们制造麻烦，给我们带来耻辱。他们的活动经常导致可怕的情况。"
  npc_override_in_moc_16_assassin_thief_314670: "盗贼……？"
  npc_override_in_moc_16_assassin_third_you_need_pass_test_5504cc: "第三，你需要通过试炼才能成为刺客。你"
  npc_override_in_moc_16_assassin_those_involved_testing_p_96e79f: "参与{0}试炼的人，请到我面前集合。"
  npc_override_in_moc_16_assassin_through_maze_c32291: "穿过迷宫。"
  npc_override_in_moc_16_assassin_time_s_up_27822f: "时间到！"
  npc_override_in_moc_16_assassin_try_find_see_me_beb56c: "试图找到或看见我……"
  npc_override_in_moc_16_assassin_umm_6257f0: "嗯？！"
  npc_override_in_moc_16_assassin_umm_7aaf3b: "嗯……？"
  npc_override_in_moc_16_assassin_umm_b1216f: "嗯……"
  npc_override_in_moc_16_assassin_umm_how_come_your_here_997d36: "嗯？你怎么会在这里？"
  npc_override_in_moc_16_assassin_undead_ce8384: "不是不死属性。"
  npc_override_in_moc_16_assassin_unfortunately_i_don_t_an_f8d70f: "不幸的是，我目前没有任何来自公会的请求给你。继续专注于你的训练。到时候再见。"
  npc_override_in_moc_16_assassin_unlike_thief_class_assas_10bf7d: "与盗贼职业不同，刺客职业不允许自我放纵。告诉我"
  npc_override_in_moc_16_assassin_upon_receiving_token_hue_4934eb: "收到这个令牌后，休伊将晋升你为刺客。"
  npc_override_in_moc_16_assassin_us_dodge_attack_more_imp_0b0c16: "对我们来说，闪避和攻击比防御更重要。永远不要想戴头盔。它又重又不舒服，甚至会挡住你的视线。"
  npc_override_in_moc_16_assassin_used_rule_over_assassin_92f9a1: "它曾经统治刺客武器市场。请照顾好我的短剑。"
  npc_override_in_moc_16_assassin_venom_dust_consumes_red_47aec2: "^3355FF毒尘^000000消耗一颗红色宝石来污染一片区域。污染持续时间随技能等级增加。"
  npc_override_in_moc_16_assassin_venom_splasher_skill_aft_4a8c10: "^3355FF毒液扩散器^000000是一个技能，使用后目标在3秒后HP低于一定量时会爆炸。"
  npc_override_in_moc_16_assassin_very_well_ea9a08: "很好……"
  npc_override_in_moc_16_assassin_wah_wah_wah_you_re_c06d26: "哇哇哇，你受伤了，我能看出来。听着，我会恢复HP和SP。高兴了吗？"
  npc_override_in_moc_16_assassin_wait_job_level_i_see_514dee: "等等，Job等级{0}？！我能看出你训练得很刻苦！我的老大们会喜欢~"
  npc_override_in_moc_16_assassin_wait_second_2c0252: "等一下……"
  npc_override_in_moc_16_assassin_warp_portal_23a10f: "传送门！"
  npc_override_in_moc_16_assassin_wasn_t_your_name_umm_5ac37a: "你的名字不是，嗯，我记得因为它听起来很有趣……"
  npc_override_in_moc_16_assassin_way_34b13f: "顺便说一下……"
  npc_override_in_moc_16_assassin_way_being_assassin_live_b6c336: "在某种程度上，成为刺客就是孤独地生活……"
  npc_override_in_moc_16_assassin_way_being_ccc01b: "在某种程度上，成为"
  npc_override_in_moc_16_assassin_we_don_t_like_greedy_3d62b0: "我们不喜欢贪婪的人。你最好去别的地方卖你的东西，财主。"
  npc_override_in_moc_16_assassin_we_lonely_we_always_alon_0761dd: "我们是孤独的。即使在彼此之中，我们也永远是孤独的……"
  npc_override_in_moc_16_assassin_we_must_keep_our_dignity_0df078: "我们必须保持作为刺客的尊严，成为真正伟大的人！遗憾的是，有太多没有骄傲的傻瓜。"
  npc_override_in_moc_16_assassin_we_promised_we_d_togethe_0f3f12: "我们承诺永远在一起。^666666*叹气……*^000000 我甚至不认为她还记得那个承诺了。话说回来，那时候我们还很小……"
  npc_override_in_moc_16_assassin_welcome_724486: "欢迎。 "
  npc_override_in_moc_16_assassin_welcome_guest_2ce35f: "欢迎，客人。"
  npc_override_in_moc_16_assassin_well_7b1901: "好吧……"
  npc_override_in_moc_16_assassin_well_done_6f35c8: "干得好。"
  npc_override_in_moc_16_assassin_well_done_b287b8: "干得好……"
  npc_override_in_moc_16_assassin_well_experienced_thief_s_bf1a52: "而且是一个经验丰富的盗贼，因为我找不到我的钱包了。我们确实需要像你这样的人，你知道的。"
  npc_override_in_moc_16_assassin_well_good_job_if_you_d2c932: "好吧，做得好……如果你想浪费时间的话。你得再试一次！"
  npc_override_in_moc_16_assassin_well_i_am_giving_you_bee912: "好吧，我给你一个令牌。请回到入口处的刺客专家，凶神恶煞的休伊那里。"
  npc_override_in_moc_16_assassin_well_i_don_t_like_9d2a03: "好吧，我不喜欢这个分数。但不知怎的，整个试炼都通过了。我对这个人没问题。"
  npc_override_in_moc_16_assassin_well_i_t_deny_we_41761b: "好吧，我不能否认，我们确实需要钱来维持生计。但你不觉得我们应该追求比金钱更重要的东西吗？"
  npc_override_in_moc_16_assassin_well_i_talked_too_much_5be93b: "好吧，我说得太多了。"
  npc_override_in_moc_16_assassin_well_i_ve_said_too_3a34cf: "好吧，我说得太多了。请选择一件武器作为礼物。"
  npc_override_in_moc_16_assassin_well_keep_training_you_n_31788f: "好吧，继续训练。你需要至少达到Job等级40，明白了吗？但如果你超过Job等级40，那可能会更好。"
  npc_override_in_moc_16_assassin_well_s_all_i_tell_ad4e44: "好吧，这就是我现在能告诉你的全部。成为刺客"
  npc_override_in_moc_16_assassin_well_s_damn_good_questio_187da9: "好吧，这是个该死的好问题。但你被驱逐出刺客公会了，所以这不关我的事……"
  npc_override_in_moc_16_assassin_well_then_659cbf: "那么，"
  npc_override_in_moc_16_assassin_well_then_go_ask_take_d4a16e: "那么，去要求'匿名者'让你重新参加试炼。"
  npc_override_in_moc_16_assassin_well_well_aren_t_we_06be50: "好吧好吧，我们不是很诚实嘛。你甚至还不是刺客，但你要笑死我了，我告诉你，笑死我了！"
  npc_override_in_moc_16_assassin_well_well_well_6a2b68: "好吧好吧好吧。"
  npc_override_in_moc_16_assassin_well_well_well_you_got_072f8b: "好吧好吧好吧，你做到了。恭喜！但既然它明显被刮花了，我不能接受。你永远成不了刺客！"
  npc_override_in_moc_16_assassin_well_you_passed_1bc3b6: "好吧，你通过了"
  npc_override_in_moc_16_assassin_what_best_elemental_main_b2dfaf: "10. 在依斯鲁得地牢狩猎的最佳元素短剑是什么？"
  npc_override_in_moc_16_assassin_what_brings_man_sword_pl_e25bbf: "一个使剑的人来这里做什么？你为什么不去别的地方砸东西呢，你这个笨蛋。"
  npc_override_in_moc_16_assassin_what_brings_you_here_0d640b: "什么风把你吹来了？"
  npc_override_in_moc_16_assassin_what_hell_28cf04: "搞什么？"
  npc_override_in_moc_16_assassin_what_hell_you_pressed_ca_cead97: "搞什么？你在过程中按了'取消'。你到底想不想转职？"
  npc_override_in_moc_16_assassin_what_item_required_using_a84572: "4. 使用毒尘需要什么道具？"
  npc_override_in_moc_16_assassin_what_kind_weapon_you_use_cb5d55: "你到目前为止用过什么武器？大马士革？短剑？刺剑？还是短剑？你现在拿的是什么？"
  npc_override_in_moc_16_assassin_what_property_enchant_po_2cc1f9: "2. 涂毒拥有什么属性？"
  npc_override_in_moc_16_assassin_what_property_izlude_dun_0a65e4: "5. 依斯鲁得地牢的怪物拥有什么属性？"
  npc_override_in_moc_16_assassin_what_you_trying_trick_me_084dfa: "什么，你想骗我还是什么？你不想成为刺客吗？"
  npc_override_in_moc_16_assassin_what_you_want_9b4b57: "你想要什么？"
  npc_override_in_moc_16_assassin_when_target_explodes_ene_f70518: "当目标爆炸时，附近的敌人也会受到伤害。这是刺客的必备技能。它需要5级毒液反击和5级毒尘。"
  npc_override_in_moc_16_assassin_when_you_finally_succeed_226db5: "当你终于成功拿到它时，把它带给我！^666666*叹气……*^000000"
  npc_override_in_moc_16_assassin_which_class_allowed_craf_65238b: "3. 哪个职业可以制作元素武器？"
  npc_override_in_moc_16_assassin_which_monster_24a4df: "2. 哪个怪物"
  npc_override_in_moc_16_assassin_which_monster_59f1bf: "1. 哪个怪物"
  npc_override_in_moc_16_assassin_which_monster_ff2d7e: "6. 哪个怪物"
  npc_override_in_moc_16_assassin_which_monster_weak_weapo_e9d095: "8. 哪个怪物对带有瓦顿卡片（对火属性怪物增加20%伤害）的武器较弱？"
  npc_override_in_moc_16_assassin_which_skill_you_learn_wh_985947: "5. 当你达到5级涂毒时，可以学习哪个技能？"
  npc_override_in_moc_16_assassin_which_uncommon_monster_5a25d3: "9. 哪个是不常见的怪物？"
  npc_override_in_moc_16_assassin_who_64e96c: "谁"
  npc_override_in_moc_16_assassin_who_waiting_61bfca: "谁在等"
  npc_override_in_moc_16_assassin_why_don_t_you_try_b634ca: "为什么下次不更努力呢？你不能太勉强自己成为刺客……"
  npc_override_in_moc_16_assassin_why_you_no_good_bastard_f5c8e8: "你这个混蛋！这是假的！"
  npc_override_in_moc_16_assassin_why_you_want_11a989: "你为什么想要"
  npc_override_in_moc_16_assassin_wimp_535a98: "只是个懦夫。"
  npc_override_in_moc_16_assassin_writing_test_4fd979: "笔试？"
  npc_override_in_moc_16_assassin_yeah_i_trust_you_now_234bc5: "是的，我现在可以信任你了。让我给你一些重要的提示。"
  npc_override_in_moc_16_assassin_yeah_we_assassins_specia_45a325: "是的，我们刺客专门训练敏捷。即使在掌握Job等级之前，我们也可以获得10点敏捷加成。问题是之后就不会再增加了，你知道的。"
  npc_override_in_moc_16_assassin_yeah_yeah_i_understand_e_b36321: "是的是的，我明白。每个人都会时不时犯错。抱歉嘲笑你的错误。"
  npc_override_in_moc_16_assassin_yes_8108a4: "是的……"
  npc_override_in_moc_16_assassin_yes_c53c56: "是的。"
  npc_override_in_moc_16_assassin_yes_i_understand_all_us_b6ff0a: "是的，我明白。我们所有人最终都会对某人怀恨在心。"
  npc_override_in_moc_16_assassin_yes_you_may_think_0689ee: "是的，你可能认为"
  npc_override_in_moc_16_assassin_you_already_finished_you_3bcf88: "你已经完成试炼了，去把你的^006699遗忘项链^000000给那个凶神恶煞的家伙，这样你就可以转职了！"
  npc_override_in_moc_16_assassin_you_already_finished_you_ba3452: "你已经完成试炼了。你为什么不去拿^006699遗忘项链^000000，这样你就可以转职了？"
  npc_override_in_moc_16_assassin_you_choose_jur_katar_mai_1851fd: "你可以选择拳刃、拳刃、短剑或短剑。作为大师，我都喜欢。"
  npc_override_in_moc_16_assassin_you_chosen_live_as_assas_bea0c4: "你，{0}，已选择作为刺客而活。愿你学习我们的方式，成为他人的光荣榜样。"
  npc_override_in_moc_16_assassin_you_didn_t_fail_time_1bdba4: "这次你没有失败！但你还没完成。你前面还有另一个试炼。一旦你继续前进，你会被告知下一个试炼。"
  npc_override_in_moc_16_assassin_you_done_filling_out_for_4ff5cd: "你填完表格了吗？好的，把它给我，这样我就可以送你去试炼大厅。祝你好运~"
  npc_override_in_moc_16_assassin_you_ever_seen_d8806c: "你见过"
  npc_override_in_moc_16_assassin_you_ever_seen_mages_hunt_231377: "你见过魔法师用冰冻术猎杀长老树精吗？水克制火。水控制火，风控制水。"
  npc_override_in_moc_16_assassin_you_failed_2dfbbd: "你失败了！"
  npc_override_in_moc_16_assassin_you_failed_328a07: "你失败了？"
  npc_override_in_moc_16_assassin_you_gain_slotted_jur_bud_7d216a: "你可以从一个住在地下黑暗潮湿地方的家伙那里获得带插槽的拳刃。好吧，我不知道为什么那家伙有那把武器……也许他需要它来挖洞？"
  npc_override_in_moc_16_assassin_you_get_better_get_neckl_dbd8e2: "你最好再去拿一条^006699遗忘项链^000000，在公会会长发现之前！快点，尽力拿到它！"
  npc_override_in_moc_16_assassin_you_get_here_5d3fcf: "你怎么进来的？"
  npc_override_in_moc_16_assassin_you_got_point_da700d: "你明白了……"
  npc_override_in_moc_16_assassin_you_idiocy_about_money_i_fa5068: "你对金钱有执念，但我相信你能克服它。"
  npc_override_in_moc_16_assassin_you_know_elemental_weapo_698e84: "你知道元素武器吗？上面通常刻有铁匠的名字……"
  npc_override_in_moc_16_assassin_you_learn_venom_dust_ski_17ea92: "学会5级涂毒后，你可以学习毒尘技能。"
  npc_override_in_moc_16_assassin_you_ll_walk_if_you_7d5e59: "如果你想回城，你得走路。哦，别忘了保存你的复活点，好吗？"
  npc_override_in_moc_16_assassin_you_look_like_you_don_0d5ee1: "你看起来无忧无虑。好吧，我希望你在这里休息时玩得开心。没关系，因为流氓和刺客公会一直相处得很好。"
  npc_override_in_moc_16_assassin_you_may_also_wish_take_478082: "你也可以利用古老的代码，^3355FFiro.ragnarokonline.com^000000。据说，这些词与庞大的异界知识库有关……"
  npc_override_in_moc_16_assassin_you_may_now_proceed_our_f441ef: "你现在可以前往我们的公会会长室。祝你好运！！"
  npc_override_in_moc_16_assassin_you_might_i_ask_5214ce: "为你，我可以问一下吗？"
  npc_override_in_moc_16_assassin_you_minutes_test_we_info_8ec955: "你将有3分钟进行试炼！我们会通知你每过一分钟。"
  npc_override_in_moc_16_assassin_you_must_answer_question_175eab: "你必须答对10题中的9题。如果你答错超过一题，你就永远不能成为刺客。"
  npc_override_in_moc_16_assassin_you_must_kill_least_0afd5d: "你必须至少击杀"
  npc_override_in_moc_16_assassin_you_must_know_how_f6262b: "你必须知道如何"
