Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_in_moc_16_assassin_abandon_ego_6f08de: "放弃自我。"
  npc_override_in_moc_16_assassin_abandon_such_worldly_2e4a9f: "放弃这种世俗的"
  npc_override_in_moc_16_assassin_about_assassin_skills_edb87c: "关于刺客技能。"
  npc_override_in_moc_16_assassin_about_you_huey_95ebfc: "关于你，休伊？"
  npc_override_in_moc_16_assassin_above_all_else_we_value_680f02: "最重要的是，我们珍视自己的尊严。毕竟我们是刺客，人们需要我们。"
  npc_override_in_moc_16_assassin_ah_yeah_5f5e35: "啊，是啊……"
  npc_override_in_moc_16_assassin_all_a10e81: "就这样吗……？"
  npc_override_in_moc_16_assassin_all_assassins_must_respe_46a23e: "所有刺客都必须尊重他们击杀的敌人，尊重他们洒下的鲜血，最重要的是，保持尊严！"
  npc_override_in_moc_16_assassin_all_depends_your_mind_an_7cdbac: "这完全取决于你的心态。任何地方都可能是最好的练级地点，取决于你的心态。"
  npc_override_in_moc_16_assassin_all_huey_2e2748: "就这样，休伊。"
  npc_override_in_moc_16_assassin_all_if_you_re_sure_f22145: "所有那些？如果你对自己的盗贼能力有信心，你就不必担心。"
  npc_override_in_moc_16_assassin_along_keeping_your_pride_3f768c: "除了保持你的骄傲，"
  npc_override_in_moc_16_assassin_alright_6ceaec: "好吧……"
  npc_override_in_moc_16_assassin_alright_a5b0b1: "好的！"
  npc_override_in_moc_16_assassin_alright_next_trial_test_fa474a: "好的。下一个试炼将测试你快速找到目标的能力。"
  npc_override_in_moc_16_assassin_alright_thanks_c14873: "好的，谢谢。"
  npc_override_in_moc_16_assassin_alright_then_3ea654: "那么好吧。"
  npc_override_in_moc_16_assassin_alright_then_4d6d9f: "那么好吧，"
  npc_override_in_moc_16_assassin_also_make_your_attacks_p_c17543: "这也会让你的攻击有几率使敌人中毒。你还可以用这个技能为队友的武器附魔……"
  npc_override_in_moc_16_assassin_although_i_am_heartless_b7cd35: "虽然我心如铁石，"
  npc_override_in_moc_16_assassin_although_i_trust_you_now_a63bff: "虽然我现在不信任你，但我会给你一个机会……"
  npc_override_in_moc_16_assassin_although_looks_too_mello_a31eda: "虽然{0}看起来太温和亲切，像只小猫一样，但{1}有实力。"
  npc_override_in_moc_16_assassin_although_s_used_7ab358: "虽然它被使用过，"
  npc_override_in_moc_16_assassin_although_skills_circumst_f3f0a0: "虽然技能可以有各种应用场景，但我会告诉你基本概念。"
  npc_override_in_moc_16_assassin_among_following_skills_w_bdac5f: "6. 以下技能中，哪个可以让你在隐身状态下移动？"
  npc_override_in_moc_16_assassin_and_f0fa6b: "还有……"
  npc_override_in_moc_16_assassin_anonymous_one_126527: "匿名者"
  npc_override_in_moc_16_assassin_anonymous_one_aee888: "匿名者。"
  npc_override_in_moc_16_assassin_answer_my_questions_corr_81ad45: "正确回答我的问题。只有刺客才能回答的困难问题。"
  npc_override_in_moc_16_assassin_appreciate_them_caring_a_c3a8d3: "感谢他们对你的关心，即使你独自一人。"
  npc_override_in_moc_16_assassin_aren_t_you_scared_you_a88dc6: "你不害怕看不见我吗？我可以随时杀了你，而且轻而易举……"
  npc_override_in_moc_16_assassin_as_assassin_find_job_you_6d82a8: "作为刺客，为他们找一份他们不知道的工作……"
  npc_override_in_moc_16_assassin_as_far_as_i_know_fd2ce8: "据我所知，拿着锤子的哥布林拥有地属性。记住火克制地属性。"
  npc_override_in_moc_16_assassin_as_i_told_you_before_003d3b: "但是，正如我之前告诉你的，我们有同伴。我建议在执行任务时至少有一个同伴支持你。"
  npc_override_in_moc_16_assassin_as_long_as_you_stick_7f8192: "只要你靠近阴影，靠着墙壁之类的东西，隐匿就能让你完全隐身！除非某个混蛋使用了某种探测技能，你知道的。"
  npc_override_in_moc_16_assassin_as_you_ve_been_told_6b176a: "正如之前告诉你的，找到并只击杀名为'转职目标'的怪物！"
  npc_override_in_moc_16_assassin_assassin_aren_t_you_23a1e4: "刺客，不是吗？"
  npc_override_in_moc_16_assassin_assassin_equals_2d9d90: "刺客等于"
  npc_override_in_moc_16_assassin_assassin_s_pride_7dea89: "刺客的骄傲……"
  npc_override_in_moc_16_assassin_assassins_agility_agi_mo_db05bd: "对刺客来说，敏捷，即AGI，是最重要的属性。"
  npc_override_in_moc_16_assassin_assassins_as_much_ea0d2f: "刺客的"
  npc_override_in_moc_16_assassin_assassins_don_t_toy_arou_448a6f: "刺客不会玩弄把戏。我们不追求风格或潮流，永远不会。"
  npc_override_in_moc_16_assassin_attachments_d40e38: "依恋……"
  npc_override_in_moc_16_assassin_bad_all_0e9921: "还不错。"
  npc_override_in_moc_16_assassin_bad_you_fulfilled_our_re_3b5b73: "不错。你满足了我们的要求。相当不错。现在，你填完表格了吗？"
  npc_override_in_moc_16_assassin_because_you_re_required_8bffa6: "因为你需要完美隐藏自己才能使用这个技能，你必须先学会2级隐匿才能学习牙突。"
  npc_override_in_moc_16_assassin_become_undetectable_only_009ffb: "只有最伟大的刺客才能做到完全无法被探测！"
  npc_override_in_moc_16_assassin_beholder_what_11b0ca: "'旁观者'，什么"
  npc_override_in_moc_16_assassin_being_assassin_means_ea6377: "成为刺客意味着"
  npc_override_in_moc_16_assassin_being_assassin_never_mak_f35334: "成为刺客永远不会让你变成不同的人。不要依赖运气。"
  npc_override_in_moc_16_assassin_best_luck_faae4f: "祝你好运~"
  npc_override_in_moc_16_assassin_best_luck_you_22d6c8: "祝你好运！"
  npc_override_in_moc_16_assassin_blocked_e41938: "被阻挡了。"
  npc_override_in_moc_16_assassin_bwahahahahaha_8cd765: "哇哈哈哈哈！"
  npc_override_in_moc_16_assassin_bwahahahahahah_c27408: "哇哈哈哈哈哈哈！"
  npc_override_in_moc_16_assassin_cannot_cute_pet_c5e419: "不能成为宠物？"
  npc_override_in_moc_16_assassin_careful_lest_you_become_855dc4: "小心一旦你成为刺客，你也会变成他们中的一员。责任完全在你肩上……"
  npc_override_in_moc_16_assassin_challenge_f7f6a6: "挑战？"
  npc_override_in_moc_16_assassin_choose_card_affect_agi_s_01668b: "5. 选择一张不影响AGI属性的卡片。"
  npc_override_in_moc_16_assassin_choose_card_typically_be_8339f5: "10. 选择一张通常对刺客最无益的卡片。"
  npc_override_in_moc_16_assassin_choose_condition_unrelat_6b6c60: "7. 选择与毒液扩散器无关的条件。"
  npc_override_in_moc_16_assassin_choose_correct_amount_ma_1d75a5: "1. 选择10级时'增加闪避'技能提供的最大闪避率增加的正确数值。"
  npc_override_in_moc_16_assassin_choose_correct_specialty_daff33: "6. 选择刺客职业的正确特长。"
  npc_override_in_moc_16_assassin_choose_group_weapons_can_1893ec: "3. 选择刺客不能同时使用的武器组。"
  npc_override_in_moc_16_assassin_choose_item_assassin_can_b5722c: "8. 选择刺客不能装备的道具。"
  npc_override_in_moc_16_assassin_choose_job_change_item_t_b58be3: "9. 选择盗贼的转职道具。"
  npc_override_in_moc_16_assassin_choose_maximum_agi_bonus_1d35f2: "7. 选择刺客在Job等级50时能获得的最大AGI加成。"
  npc_override_in_moc_16_assassin_choose_monster_f5dff9: "10. 选择怪物"
  npc_override_in_moc_16_assassin_choose_monster_fire_prop_a3b71f: "7. 选择火属性匕首效果最好的怪物。"
  npc_override_in_moc_16_assassin_choose_monster_which_det_9b143f: "2. 选择能探测隐身/隐匿的盗贼和刺客的怪物。"
  npc_override_in_moc_16_assassin_choose_skill_required_le_e3d6fb: "1. 选择学习牙突不需要的技能。"
  npc_override_in_moc_16_assassin_choose_town_where_thieve_cf162a: "4. 选择盗贼可以转职的城市。"
  npc_override_in_moc_16_assassin_choose_weapon_which_kata_4c0fea: "4. 选择不属于拳刃类的武器。"
  npc_override_in_moc_16_assassin_city_desert_i_miss_my_2337f2: "沙漠之城……我想念我的家乡，梦罗克。我很久没回去了。感觉就像几天前才成为盗贼一样。时间过得真快……"
  npc_override_in_moc_16_assassin_come_back_when_b665df: "但等你"
  npc_override_in_moc_16_assassin_come_closer_i_prefer_tal_810933: "靠近点。我喜欢面对面交谈。如果我不得不提高嗓门才能让你听见，那真的很烦人。"
  npc_override_in_moc_16_assassin_comrades_whom_you_die_050828: "你愿意为之牺牲的同伴……"
  npc_override_in_moc_16_assassin_could_use_break_c5b8b1: "可以休息一下……"
  npc_override_in_moc_16_assassin_course_damage_affected_s_2d5eb1: "当然，伤害受STR和武器伤害影响。当你达到4级拳刃精通时，你就会明白这个技能是如何运作的。"
  npc_override_in_moc_16_assassin_damn_you_look_like_you_9981ff: "该死……！你看起来很痛苦。^666666*叹气*^000000 等一下，让我试着恢复你的HP和SP……"
  npc_override_in_moc_16_assassin_decent_e89c3b: "还不错。"
  npc_override_in_moc_16_assassin_did_other_assassins_tell_307e8f: "其他刺客告诉过你吗……？"
  npc_override_in_moc_16_assassin_did_you_finish_form_alri_7beeb4: "你填完表格了吗？好的，把它给我。等一下，我会把你传送到试炼大厅。"
  npc_override_in_moc_16_assassin_did_you_hear_anonymous_o_188118: "你听到那个匿名者的话了吗？！'求求你，给我提示。'哈哈哈！"
  npc_override_in_moc_16_assassin_didn_t_you_just_1995f3: "你不是刚刚"
  npc_override_in_moc_16_assassin_don_t_act_recklessly_afe4f7: "不要鲁莽行事……"
  npc_override_in_moc_16_assassin_don_t_force_yourself_too_68af28: "不要太过勉强自己。"
  npc_override_in_moc_16_assassin_don_t_forget_6b8f13: "不要忘记……"
  npc_override_in_moc_16_assassin_done_filling_out_89921c: "填完了。"
  npc_override_in_moc_16_assassin_door_next_room_coordinat_f70094: "下一个房间的门，在坐标87 137处，已开启。"
  npc_override_in_moc_16_assassin_double_attack_haven_t_yo_5e5420: "双重攻击……你没试过吗？它可以让你一次攻击敌人两次。"
  npc_override_in_moc_16_assassin_double_attack_need_c3b178: "双重攻击需要？"
  npc_override_in_moc_16_assassin_drops_slotted_jur_c75ee4: "掉落带插槽的拳刃？"
  npc_override_in_moc_16_assassin_drops_slotted_katar_209337: "掉落带插槽的拳刃？"
  npc_override_in_moc_16_assassin_eager_travel_all_around_350985: "渴望环游世界，我希望你的真实身份能在旅途中被发现……"
  npc_override_in_moc_16_assassin_eh_17ae65: "嗯？"
  npc_override_in_moc_16_assassin_eh_1aa004: "嗯……？！"
  npc_override_in_moc_16_assassin_eh_get_outta_here_d49718: "嗯，滚出去。"
  npc_override_in_moc_16_assassin_ehhh_0933ae: "嗯嗯？"
  npc_override_in_moc_16_assassin_enchant_poison_skill_all_18dbba: "^3355FF涂毒^000000技能可以让你为正在使用的武器附魔毒素。这会暂时赋予武器毒属性。"
  npc_override_in_moc_16_assassin_end_maze_627b47: "在迷宫尽头。"
  npc_override_in_moc_16_assassin_endless_practice_893e33: "无尽的练习……"
  npc_override_in_moc_16_assassin_enough_kid_526470: "够了，小子。"
  npc_override_in_moc_16_assassin_even_14cbaa: "即使在"
  npc_override_in_moc_16_assassin_even_though_you_re_drive_a4177c: "即使你被个人复仇所驱使，我希望它会随着你的训练而消散……"
  npc_override_in_moc_16_assassin_even_though_you_re_enamo_f01197: "即使你只是 superficially 迷恋刺客，我相信你迟早会意识到刺客职业的真正价值。"
  npc_override_in_moc_16_assassin_even_though_your_main_co_e945cb: "即使你现在主要关心的是致富，我相信你会追求更伟大的东西……"
  npc_override_in_moc_16_assassin_exploring_places_you_ve_2d0c14: "探索你从未见过的地方。但要知道，成为刺客永远不会让你变成不同的人。"
  npc_override_in_moc_16_assassin_fill_out_application_for_2fe909: "填写申请表，写上你的名字和Job等级。"
  npc_override_in_moc_16_assassin_financial_reasons_i_won_181a44: "经济原因……？我不会否认我们都需要钱生活。但成为刺客意味着为更高的目标而活。"
  npc_override_in_moc_16_assassin_first_all_grimtooth_skil_6d84c1: "首先，牙突是……专门为拳刃设计的技能。因此，它不需要任何与匕首相关的技能。"
  npc_override_in_moc_16_assassin_first_katar_mastery_skil_796bd7: "首先，^3355FF拳刃精通^000000。这个技能增加拳刃类武器的伤害。技能等级越高，伤害增加越多。"
  npc_override_in_moc_16_assassin_first_off_what_you_think_94f040: "首先，你认为刺客的优先事项是什么？"
  npc_override_in_moc_16_assassin_get_out_493749: "滚出去！"
  npc_override_in_moc_16_assassin_girl_named_markie_aac0a5: "一个叫玛琪的女孩？"
  npc_override_in_moc_16_assassin_gladius_69b332: "一把短剑……"
  npc_override_in_moc_16_assassin_go_651d5f: "去吧！"
  npc_override_in_moc_16_assassin_go_ahead_give_38b71e: "来吧，给我"
  npc_override_in_moc_16_assassin_go_ask_khai_guy_who_937c67: "去问'凯'，那个负责你试炼申请的人，也许他会帮你。"
  npc_override_in_moc_16_assassin_good_choice_998be2: "好选择！"
  npc_override_in_moc_16_assassin_good_choice_there_you_i_eb4b3a: "好选择。给你。希望它能为你所用。"
  npc_override_in_moc_16_assassin_good_idea_03f6d7: "好主意……"
  npc_override_in_moc_16_assassin_good_idea_traveling_arou_f9318d: "好主意。环游世界可以让你拓宽阅历。"
  npc_override_in_moc_16_assassin_good_luck_703764: "祝你好运。"
  npc_override_in_moc_16_assassin_good_luck_8e30d6: "祝你好运！"
  npc_override_in_moc_16_assassin_good_luck_e86318: "祝你好运……"
  npc_override_in_moc_16_assassin_good_luck_out_there_38836c: "祝你好运。"
  npc_override_in_moc_16_assassin_good_one_examine_oneself_e32584: "反省自己是好事。我能理解你会因为能力的巨大变化而兴奋。"
  npc_override_in_moc_16_assassin_good_way_improve_yoursel_6e5ccc: "这是提升自己的好方法。我见过很多人知道如何强身健体，但心理状态却不佳。"
  npc_override_in_moc_16_assassin_great_e405de: "太好了……"
  npc_override_in_moc_16_assassin_great_effort_bbb72f: "巨大的努力。"
  npc_override_in_moc_16_assassin_great_effort_cb4175: "巨大的努力……"
  npc_override_in_moc_16_assassin_grimtooth_allows_you_att_740f15: "^3355FF牙突^000000让你在隐匿状态下从地下攻击敌人。随着你掌握它，你将能够从远处攻击敌人。"
  npc_override_in_moc_16_assassin_grrrrr_c6ef2e: "咕噜噜……"
  npc_override_in_moc_16_assassin_guards_f65150: "……守卫！"
  npc_override_in_moc_16_assassin_haaahahahaha_8016e7: "哈啊啊哈哈哈哈！！！"
  npc_override_in_moc_16_assassin_hah_1bc943: "哈！"
  npc_override_in_moc_16_assassin_haha_needs_body_sometime_a3ee93: "哈哈，身体的需求有时难以忽视。最好接受人性的这一部分。"
  npc_override_in_moc_16_assassin_hahahah_i_m_just_joking_5db4c1: "哈哈哈~！我只是开玩笑，别当真。但我确实需要先和公会会长确认这条项链。"
  npc_override_in_moc_16_assassin_hahahahah_a1573f: "哈哈哈哈~！"
  npc_override_in_moc_16_assassin_hahahahahahah_046978: "哈哈哈哈哈哈！"
  npc_override_in_moc_16_assassin_hard_stay_alive_43f706: "活下来就这么难吗？"
  npc_override_in_moc_16_assassin_having_problems_1cd1e9: "有问题"
  npc_override_in_moc_16_assassin_heh_i_remember_my_thief_5ad0f4: "嘿。我记得我的盗贼试炼。当我闯入农场偷蘑菇时，我紧张得要死……"
  npc_override_in_moc_16_assassin_hell_you_e13fe5: "你到底是谁？"
  npc_override_in_moc_16_assassin_here_soon_905dd8: "很快就到。"
  npc_override_in_moc_16_assassin_here_you_f51fb7: "给你。"
  npc_override_in_moc_16_assassin_hey_don_t_too_hard_ccae19: "嘿，别太严厉"
  npc_override_in_moc_16_assassin_hey_i_m_thomas_i_1c473d: "嘿，我是托马斯。我负责测试你的隐匿技能。你觉得你能行吗？"
  npc_override_in_moc_16_assassin_hey_i_remember_you_46a690: "嘿，我记得你~"
  npc_override_in_moc_16_assassin_hey_newbie_you_should_re_888ff1: "嘿，新手。你真的应该尽快离开这里。我不能保证你的安全。"
  npc_override_in_moc_16_assassin_hey_what_happened_how_co_09a5da: "嘿，怎么回事……？你怎么没带^006699遗忘项链^000000？你应该随身携带的，它在哪里？"
  npc_override_in_moc_16_assassin_hm_b88b2e: "……嗯。"
  npc_override_in_moc_16_assassin_hm_bad_you_re_almost_43db3b: "嗯？不错。你快到了。"
  npc_override_in_moc_16_assassin_hm_you_a188fe: "嗯？你……？"
  npc_override_in_moc_16_assassin_hmm_8ee499: "嗯。"
  npc_override_in_moc_16_assassin_hmm_9c4d28: "嗯……"
  npc_override_in_moc_16_assassin_hmm_i_like_your_attitude_967075: "嗯。我喜欢你的态度。你应该保持作为盗贼的骄傲。抱歉之前嘲笑你的错误。我想你下次会做得更好。"
  npc_override_in_moc_16_assassin_hmm_if_you_re_exhausted_d7cf6e: "嗯，如果你累了，我愿意带你回去。当然，如果你离开，你就必须重新参加试炼。所以你想怎么做？"
  npc_override_in_moc_16_assassin_hmm_stats_bfe5c7: "嗯，属性……"
  npc_override_in_moc_16_assassin_hmm_well_okay_18ccf7: "嗯。好吧，可以。"
  npc_override_in_moc_16_assassin_hmpf_40a0b0: "哼。"
  npc_override_in_moc_16_assassin_hmpf_if_you_really_don_aed51b: "哼，如果你真的不知道，我会给你一点建议。"
  npc_override_in_moc_16_assassin_hmpf_now_time_test_your_6548ac: "哼。现在是测试你知识的时候了。你不允许答错超过一题。"
  npc_override_in_moc_16_assassin_ho_ho_ho_167696: "呵呵呵……"
  npc_override_in_moc_16_assassin_ho_job_level_you_must_da2645: "哦？Job等级{0}？！你一定训练得很刻苦。老大们肯定会喜欢……"
  npc_override_in_moc_16_assassin_honest_i_want_grant_you_8710db: "说实话，我想无条件地让你转职。太多可悲的人连成为刺客的基本知识都没有……"
  npc_override_in_moc_16_assassin_how_come_you_re_here_ff828b: "你怎么会在这里……？"
  npc_override_in_moc_16_assassin_how_could_you_expect_ass_5fee13: "就这点分数你还想成刺客？继续训练，准备好了再回来。"
  npc_override_in_moc_16_assassin_how_dare_you_think_tryin_36035a: "你竟敢想用假货骗我！你是蠢还是什么！？我应该杀了你……"
  npc_override_in_moc_16_assassin_how_hell_did_534869: "到底怎么"
  npc_override_in_moc_16_assassin_how_level_right_hand_mas_8c92f3: "3. 4级右手精通是如何运作的？"
  npc_override_in_moc_16_assassin_how_much_sp_4a245d: "9. 需要多少SP"
  npc_override_in_moc_16_assassin_how_you_understand_conce_893278: "你怎么会不理解尊严的概念？你刚才就向我展示了！"
  npc_override_in_moc_16_assassin_however_another_test_awa_6a0700: "然而，另一个试炼在等着你。当你进入下一个区域时，你会收到指示……"
  npc_override_in_moc_16_assassin_however_if_you_don_t_05c928: "然而，如果你不想使用两把匕首，你就不需要这个技能。一旦你达到'右手精通'2级，你就会明白'左手精通'是如何运作的。"
  npc_override_in_moc_16_assassin_however_keep_mind_we_all_4f90ff: "然而，请记住，我们不允许有情感依恋。无条件地执行你的职责。这是我们的方式。"
  npc_override_in_moc_16_assassin_however_what_reason_you_288090: "然而，你为什么想要更多力量？为了炫耀？个人复仇？你会将这份力量用于什么目的？"
  npc_override_in_moc_16_assassin_huh_6ed1eb: "嗯。"
  npc_override_in_moc_16_assassin_huh_80ee84: "嗯……"
  npc_override_in_moc_16_assassin_huh_a78e67: "嗯……？"
  npc_override_in_moc_16_assassin_huh_you_must_lot_self_aca455: "嗯。现在的盗贼都这么自信吗。"
  npc_override_in_moc_16_assassin_huh_you_re_qualified_bec_a730e4: "嗯。你还没有资格成为刺客。有一些要求你需要先满足，你知道的。"
  npc_override_in_moc_16_assassin_hunt_a9e09c: "狩猎……"
  npc_override_in_moc_16_assassin_i_agree_e79cea: "我同意"
  npc_override_in_moc_16_assassin_i_am_here_d7c94a: "我在这里。"
  npc_override_in_moc_16_assassin_i_am_here_test_your_e5ba39: "我在这里测试你的知识，以及你的无情。这两者都是成为刺客所必需的。"
  npc_override_in_moc_16_assassin_i_am_necessarily_cruel_b_ff51c1: "我不一定残忍。在我们继续之前，你有什么想知道的吗？"
  npc_override_in_moc_16_assassin_i_am_perfectly_hidden_fca47c: "我完美地隐藏了！"
  npc_override_in_moc_16_assassin_i_apologize_0d2c2b: "我为"
  npc_override_in_moc_16_assassin_i_apologize_laughing_you_17098c: "我为之前嘲笑你道歉。我希望你记住保持作为刺客的骄傲和尊严。"
  npc_override_in_moc_16_assassin_i_ask_khai_one_who_0796ee: "我会问'凯'，那个处理你申请的人，寻求建议。"
  npc_override_in_moc_16_assassin_i_believe_you_stand_out_089bc7: "我相信你在他们之中脱颖而出……"
  npc_override_in_moc_16_assassin_i_cannot_give_you_better_f45ec8: "关于属性，我无法给你更好的建议。你应该研究并看看哪些属性适合你，并决定你想成为什么样的刺客。"
  npc_override_in_moc_16_assassin_i_changed_my_mind_05272f: "我改变主意了！"
  npc_override_in_moc_16_assassin_i_don_t_think_i_3de5fc: "我不喜欢你看着我的方式……小混混。"
  npc_override_in_moc_16_assassin_i_don_t_think_you_2f0ef6: "我觉得你走错路了。"
  npc_override_in_moc_16_assassin_i_feel_irritated_when_so_e9ea09: "有人在背后跟我说话时，我会感到烦躁。"
  npc_override_in_moc_16_assassin_i_feel_your_steps_near_35dae4: "我能感觉到你靠近的脚步。"
  npc_override_in_moc_16_assassin_i_guess_you_2908f4: "我猜你"
  npc_override_in_moc_16_assassin_i_hope_you_become_excell_8ea61c: "我希望你成为一名优秀的刺客。当你达到一定等级时，你必须像你的训练师一样指导新手。"
  npc_override_in_moc_16_assassin_i_hope_you_re_hypocrite_53a3c9: "我希望你不是伪君子。精神修炼是你生存的最佳方式。"
  npc_override_in_moc_16_assassin_i_keep_watching_you_a03601: "……我会一直注视着你。"
  npc_override_in_moc_16_assassin_i_know_0cbf73: "我知道它会"
  npc_override_in_moc_16_assassin_i_know_some_people_care_1101a3: "我知道有些人只关心身体训练，但"
  npc_override_in_moc_16_assassin_i_like_listen_your_opini_b962fc: "我想听听你对{0}转职试炼的看法。"
  npc_override_in_moc_16_assassin_i_ll_judge_dacb5a: "由我来评判！"
  npc_override_in_moc_16_assassin_i_ll_transport_you_6e4b68: "我会传送你"
  npc_override_in_moc_16_assassin_i_look_forward_523bfc: "我期待"
  npc_override_in_moc_16_assassin_i_m_allowed_give_you_c56d1e: "我不允许给你提示，但我可以告诉你更多关于刺客的事……"
  npc_override_in_moc_16_assassin_i_m_bit_worried_about_f819eb: "我有点担心你。我希望你意识到，一旦你成为刺客，就没有回头路了……"
  npc_override_in_moc_16_assassin_i_m_bringing_you_back_35ecb2: "我带你回去……*叹气……*"
  npc_override_in_moc_16_assassin_i_m_going_give_you_40fe3a: "我要给你一个简单的测试。请找到穿过这个迷宫的路，然后来找我。这个迷宫保护我们的公会免受入侵者。"
  npc_override_in_moc_16_assassin_i_m_gonna_give_you_a5cf5f: "我终究不会给你任何提示。嘿嘿嘿~"
  npc_override_in_moc_16_assassin_i_m_surprised_you_even_53280e: "我很惊讶你竟然能成为盗贼。走开，等你明白自己在做什么再回来。"
  npc_override_in_moc_16_assassin_i_once_knew_person_who_b91fed: "我曾经认识一个有目标的人。很久以前，我在任务中遇到一个人，他想在成为54级骑士之前不被杀死。"
  npc_override_in_moc_16_assassin_i_saw_your_resume_just_266639: "我刚才看了你的简历。你作为有胆量的盗贼很有名。我们很少收到像你这样的潜在刺客。"
  npc_override_in_moc_16_assassin_i_see_fd141e: "我明白了……"
  npc_override_in_moc_16_assassin_i_see_you_re_carrying_536eef: "我看到你带着^006699遗忘项链^000000……你想成为刺客，不是吗？让我检查一下……"
  npc_override_in_moc_16_assassin_i_see_you_want_use_87f500: "我明白了。你想用双手。来，拿着你的短剑。"
  npc_override_in_moc_16_assassin_i_sense_you_re_different_3de98a: "我感觉到你与众不同……"
  npc_override_in_moc_16_assassin_i_think_0596d6: "我认为"
  npc_override_in_moc_16_assassin_i_think_you_what_takes_9b6c62: "我认为你有这个能力。你想成为刺客有什么原因吗？"
  npc_override_in_moc_16_assassin_i_thought_something_smel_249a26: "我觉得有什么不对劲。一个神的仆人来这里做什么？你不属于这里。"
  npc_override_in_moc_16_assassin_i_understand_why_their_p_4e1258: "我能理解为什么他们的骄傲和尊严对他们如此重要。那么，你为什么想成为刺客？"
  npc_override_in_moc_16_assassin_i_ve_always_wanted_frog_1e7786: "我一直想要一只青蛙作为宠物。但这是不可能的！"
  npc_override_in_moc_16_assassin_i_ve_heard_baphomet_jr_e3fd56: "我听说巴风特 Jr. 卡片增加+3点敏捷和+1点暴击……"
  npc_override_in_moc_16_assassin_i_ve_met_such_big_cf5e6a: "我遇到过这么大的失败。"
  npc_override_in_moc_16_assassin_i_ve_never_met_anyone_1f50e2: "我从未见过像你这么可怕的人！不知道为什么，我不喜欢你。我觉得你应该离开！"
  npc_override_in_moc_16_assassin_i_want_you_respect_blood_f6ada0: "我希望你尊重可能沾染你拳刃或匕首的鲜血。"
  npc_override_in_moc_16_assassin_if_people_close_you_some_91b783: "如果有人在某种程度上与你亲近，他们可能不理解我在说什么。由于我们的本性，我们生来就是孤独者。"
  npc_override_in_moc_16_assassin_if_s_alright_you_i_dddbc9: "如果你没问题，我想回去工作了。"
  npc_override_in_moc_16_assassin_if_you_fail_you_ll_d6aa62: "如果你失败了，你就必须重新开始这个试炼。去上面的房间"
  npc_override_in_moc_16_assassin_if_you_re_going_assassin_322673: "如果你要成为刺客，我们需要确定你是否能瞬间分辨敌友。"
  npc_override_in_moc_16_assassin_if_you_run_away_get_17ef26: "如果你逃跑、流鼻血晕倒之类的，我就判你失败。废话少说。让我看看你有什么本事。"
  npc_override_in_moc_16_assassin_imagine_if_lover_friend_17e54a: "想象一下，如果爱人或朋友看到你手上的鲜血。他们有可能不会继续和你在一起。"
  npc_override_in_moc_16_assassin_increase_dodge_allows_yo_d1cac5: "'增加闪避'每级技能提供+3%闪避率。"
  npc_override_in_moc_16_assassin_insects_detect_hiding_cl_ede556: "昆虫能探测隐匿/隐匿技能。它们的触角永远不会找不到目标。"
  npc_override_in_moc_16_assassin_job_change_target_monste_5bb126: "6只^008800转职目标^000000怪物！"
  npc_override_in_moc_16_assassin_job_change_target_monste_b08731: "6只^008800转职目标^000000怪物。它们混在相似的怪物中，所以你需要小心……"
  npc_override_in_moc_16_assassin_job_level_78beff: "Job等级{0}……"
  npc_override_in_moc_16_assassin_job_level_7f9212: "按Job等级。"
  npc_override_in_moc_16_assassin_jur_849339: "一把拳刃……"
  npc_override_in_moc_16_assassin_katar_2bc9f0: "一把拳刃……"
  npc_override_in_moc_16_assassin_know_everything_you_a05a73: "你什么都知道吗？！"
  npc_override_in_moc_16_assassin_known_better_c13534: "早该知道。"
  npc_override_in_moc_16_assassin_learn_cloaking_you_must_02896c: "要学习^3355FF隐匿^000000，你必须学会2级隐身。然后如果你靠近墙壁，你就能在隐身状态下移动。"
  npc_override_in_moc_16_assassin_learning_skills_comes_na_fa17ea: "学习技能是刺客职业的自然过程。但不要把技能当作训练的最高价值。"
  npc_override_in_moc_16_assassin_left_hand_mastery_right_b5dc4c: "^3355FF左手精通^000000和^3355FF右手精通^000000。刺客在使用匕首类武器时，可以在每只手中装备不同的武器。"
  npc_override_in_moc_16_assassin_let_s_see_4d37ed: "让我看看……"
  npc_override_in_moc_16_assassin_let_s_see_967ef9: "让我看看。"
  npc_override_in_moc_16_assassin_let_s_see_job_level_7b8c73: "让我看看…… Job等级{0}……"
  npc_override_in_moc_16_assassin_listen_test_you_t_kill_c42229: "听着。在这个试炼中，你不能杀死任何怪物。你的目标是到达房间对面的'巴卡迪'。"
  npc_override_in_moc_16_assassin_look_purdy_bow_4eb551: "看看那把漂亮的弓。"
  npc_override_in_moc_16_assassin_looks_like_you_re_having_152e78: "看起来你遇到了困难。你要么太努力了，要么不够努力"
  npc_override_in_moc_16_assassin_love_your_beloved_foreve_506f73: "永远爱你所爱的人，即使你不能公开表达。有时，生活不允许你找到不止一次真爱。"
  npc_override_in_moc_16_assassin_main_goal_test_find_kill_0ff652: "这个试炼的主要目标是找到并尽可能多地击杀名为^008800转职目标^000000的怪物。"
  npc_override_in_moc_16_assassin_making_you_go_406107: "让你去"
  npc_override_in_moc_16_assassin_markie_b7ff93: "玛琪……"
  npc_override_in_moc_16_assassin_me_d7f327: "从我这里？！"
  npc_override_in_moc_16_assassin_me_form_when_you_re_3dea26: "我表格当你"
  npc_override_in_moc_16_assassin_me_transported_test_hall_9f73bd: "我被传送到试炼大厅。"
  npc_override_in_moc_16_assassin_means_you_fail_62a141: "这意味着你失败了！"
  npc_override_in_moc_16_assassin_meantime_i_hope_you_won_980032: "同时，我希望你不会忘记刺客的心态。"
  npc_override_in_moc_16_assassin_meeting_you_be7f79: "见到你"
  npc_override_in_moc_16_assassin_menu_as_c57402: "正如我反复告诉你的:拳刃类武器（查克拉姆/拳刃/拳刃等）是双手武器！"
  npc_override_in_moc_16_assassin_menu_baphomet_736585: "巴风特 Jr. 卡片:幽灵卡片:雌盗虫卡片:雄盗虫卡片"
  npc_override_in_moc_16_assassin_menu_choose_6a4434: "8. 从以下选择非元素属性的拳刃:"
  npc_override_in_moc_16_assassin_menu_cloaking_bdd372: "隐匿2级:音速投掷5级:拳刃精通4级:右手精通2级"
  npc_override_in_moc_16_assassin_menu_continue_b92550: "继续！:暂时退出转职试炼。"
  npc_override_in_moc_16_assassin_menu_dagger_279de8: "匕首:头盔:靴子:胸针"
  npc_override_in_moc_16_assassin_menu_dagger_e7b4c4: "匕首哥布林:锤哥布林:晨星哥布林:锤子哥布林"
  npc_override_in_moc_16_assassin_menu_drake_e74653: "海盗之王:巨齿鲨:孢子:卡利兹堡"
  npc_override_in_moc_16_assassin_menu_envenom_46c00f: "涂毒:音速投掷:毒液扩散器:毒尘"
  npc_override_in_moc_16_assassin_menu_excellent_3bee3e: "出色的歌唱天赋:出色的阅读天赋:出色的舞蹈天赋:出色的闪避能力"
  npc_override_in_moc_16_assassin_menu_got_44adfb: "……抓到你了。:……我糊涂了。"
  npc_override_in_moc_16_assassin_menu_help_e280d9: "帮帮我，我怎么通过？:我再次挑战你！"
  npc_override_in_moc_16_assassin_menu_hey_f53a55: "嘿，搞什么？！我告诉过你:不要杀怪物！"
  npc_override_in_moc_16_assassin_menu_hiding_856c86: "隐身:后撤步:隐匿:沙尘攻击"
  npc_override_in_moc_16_assassin_menu_i_02937f: "我觉得我吓尿了！:你只会说大话。我挑战你！"
  npc_override_in_moc_16_assassin_menu_i_237be7: "我会立刻去狩猎。:有人在等我。:看看我作为刺客能如何帮忙。"
  npc_override_in_moc_16_assassin_menu_i_32eb95: "无论如何我都要成为刺客！:哦天哪，我得休息一下。"
  npc_override_in_moc_16_assassin_menu_i_4034d9: "我要再试一次！:我……我放弃！"
  npc_override_in_moc_16_assassin_menu_i_80668c: "求求你，给我提示。:别笑我！现在，给我提示！:……闭嘴，我不需要你的帮助！"
