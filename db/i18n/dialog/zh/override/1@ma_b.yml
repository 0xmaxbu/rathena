Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@ma_b_BakonawaLake_aww_i_almost_brought_him_5adfbd: "哎呀……我差点把他引出来了。"
  npc_override_1@ma_b_BakonawaLake_bakonawa_becomes_invinci_6c1423: "巴科纳瓦在某些时候会变得无敌。当那个时候到来时，仔细听我的指引。只要相信我，一切都会好的。"
  npc_override_1@ma_b_BakonawaLake_bakonawa_escaped_deep_in_90dabc: "巴科纳瓦逃到了湖底深处。"
  npc_override_1@ma_b_BakonawaLake_civilians_cannot_enter_8eeec6: "平民不能进入。"
  npc_override_1@ma_b_BakonawaLake_found_bakonawa_s_corpse_16f6f3: "这是从巴科纳瓦的尸体上找到的。你拿着会更好。"
  npc_override_1@ma_b_BakonawaLake_heehee_i_could_join_bako_f43419: "嘿嘿，我可以参加巴科纳瓦的狩猎，但我宁愿躲在那块石头后面为你们加油。"
  npc_override_1@ma_b_BakonawaLake_hey_too_dangerous_place_e4467c: "嘿。这对你来说太危险了。你无法保证自己的安全。马上离开这里回村去！"
  npc_override_1@ma_b_BakonawaLake_hmm_we_almost_got_him_bf4dd6: "嗯。我们差点就抓住他了，但他是个速度很快的生物……"
  npc_override_1@ma_b_BakonawaLake_i_am_dropping_albopal_li_4b3e0a: "我要像刚才那样投掷阿博帕尔。希望这能激怒他……"
  npc_override_1@ma_b_BakonawaLake_i_am_dropping_alpopal_ma_d1a4ef: "我要投掷阿博帕尔来激怒巴科纳瓦。一旦抓住他，巴科纳瓦可以是很好的蛋白质来源。"
  npc_override_1@ma_b_BakonawaLake_isn_t_there_any_company_7d3e20: "没有人可以陪你一起去吗？或者即使你想一个人去，也要先组建好队伍再来。"
  npc_override_1@ma_b_BakonawaLake_menu_hold_add534: "等一下！:当然！我们现在不能退缩！"
  npc_override_1@ma_b_BakonawaLake_menu_hold_f99cf9: "等等！我还没准备好！:我们上吧！"
  npc_override_1@ma_b_BakonawaLake_menu_options_60f35e: ":我现在要下去。:取消。"
  npc_override_1@ma_b_BakonawaLake_menu_please_8716e0: "请编织绳索。:我现在要下去。:取消。"
  npc_override_1@ma_b_BakonawaLake_menu_taho_225980: "塔霍：很好！还剩{0}个！"
  npc_override_1@ma_b_BakonawaLake_menu_taho_340846: "塔霍：我看到他在水面上了！攻击！！！"
  npc_override_1@ma_b_BakonawaLake_menu_taho_39c282: "塔霍：嗯！水下有什么东西在快速上浮！巴……巴科纳瓦来了！！"
  npc_override_1@ma_b_BakonawaLake_menu_taho_5e3f6a: "塔霍：打开宝箱后，请到我 hill 顶来找我。我有东西要给你。"
  npc_override_1@ma_b_BakonawaLake_menu_taho_6c247b: "塔霍：我们必须用釜和锣制造巨大的噪音，让他永远无法专注于月亮！"
  npc_override_1@ma_b_BakonawaLake_menu_taho_725f0f: "塔霍：我们抓住他了！我看到他吐出了看起来像箱子的东西。"
  npc_override_1@ma_b_BakonawaLake_menu_taho_763fc8: "塔霍：即使他浮出水面也不要攻击他。只管制造巨大的噪音！"
  npc_override_1@ma_b_BakonawaLake_menu_taho_adcbc8: "塔霍：很好！巴科纳瓦藏在水下。他现在会试图吞下月亮。"
  npc_override_1@ma_b_BakonawaLake_menu_taho_ef398a: "塔霍：他又回到湖里了。结束了吗？"
  npc_override_1@ma_b_BakonawaLake_menu_time_9b2955: "时间限制：{0}"
  npc_override_1@ma_b_BakonawaLake_menu_time_d03bd9: "时间限制：30秒"
  npc_override_1@ma_b_BakonawaLake_mission_destroy_caldrons_39b466: "任务 - 摧毁湖左右两侧的2个釜和2个锣。"
  npc_override_1@ma_b_BakonawaLake_mission_eliminate_bakona_b27c21: "任务 - 消灭变得更加凶猛的巴科纳瓦。"
  npc_override_1@ma_b_BakonawaLake_my_name_minky_5b9efd: "我的名字是明基。"
  npc_override_1@ma_b_BakonawaLake_now_i_m_weaving_so_61bd8d: "我正在编织绳索，编好后你就可以下去了。"
  npc_override_1@ma_b_BakonawaLake_now_i_make_bakonawa_spri_2bfe2b: "现在我要让巴科纳瓦从湖中跃出。"
  npc_override_1@ma_b_BakonawaLake_oh_alright_tell_me_when_dc7172: "哦……好吧……准备好了告诉我。"
  npc_override_1@ma_b_BakonawaLake_oh_rope_got_dropped_i_e233e8: "哦，绳子掉下去了。我得重新做一根。"
  npc_override_1@ma_b_BakonawaLake_once_bakonawa_tastes_he_f63ca8: "一旦巴科纳瓦尝到这个，他就会浮出水面……"
  npc_override_1@ma_b_BakonawaLake_party_member_party_enter_638013: "队伍成员{0}，队伍{1}正在进入地下城{2}。"
  npc_override_1@ma_b_BakonawaLake_rope_hasn_t_been_weaved_0348e5: "绳子还没编好。稍等一下。"
  npc_override_1@ma_b_BakonawaLake_rope_used_getting_lake_a_72ee3b: "通往湖边的绳子已经断了。我们正在清理周围区域，所以过段时间再来吧。"
  npc_override_1@ma_b_BakonawaLake_s_all_cleaned_up_around_88b634: "这里已经清理干净了。现在拿到绳子后你就可以再次下去了。"
  npc_override_1@ma_b_BakonawaLake_seems_you_already_carryi_76f3e4: "看起来你已经携带了太重的东西。请减轻重量后再试一次。"
  npc_override_1@ma_b_BakonawaLake_seems_you_carrying_too_m_105803: "看起来你携带的物品种类太多了。请减少后再试一次。"
  npc_override_1@ma_b_BakonawaLake_then_i_drop_drop_albopal_5b8137: "那我要往湖里滴一滴阿博帕尔。"
  npc_override_1@ma_b_BakonawaLake_then_i_use_albopal_once_107f9c: "那我要再次使用阿博帕尔投入湖中。"
  npc_override_1@ma_b_BakonawaLake_then_let_s_use_rope_a0ffec: "那让我们用绳索上去吧！"
  npc_override_1@ma_b_BakonawaLake_unknown_error_occurred_285cc7: "发生未知错误。"
  npc_override_1@ma_b_BakonawaLake_we_about_see_bakonawa_in_173ac8: "我们即将面对更加愤怒的巴科纳瓦……"
  npc_override_1@ma_b_BakonawaLake_we_better_hurry_get_out_659eb7: "我们最好赶快离开这个地方。即使没有巴科纳瓦，这里仍然很危险……"
  npc_override_1@ma_b_BakonawaLake_we_going_try_again_116ff0: "我们要再试一次吗？"
  npc_override_1@ma_b_BakonawaLake_we_gonna_killed_all_bako_4eb500: "我们都会被巴科纳瓦杀死的。啊，我们必须杀死他，但不幸的是我们还没有准备好。"
  npc_override_1@ma_b_BakonawaLake_you_came_slaying_bakonaw_88df8d: "你来猎杀巴科纳瓦。你的队伍领袖必须帮我编织下去的绳索。"
  npc_override_1@ma_b_BakonawaLake_you_carrying_too_many_it_dd17f4: "你携带的物品太多了。拿掉一些后再来吧。"
  npc_override_1@ma_b_BakonawaLake_you_carrying_too_much_we_04640e: "你携带的重量太重了。减轻重量后再来吧。"
  npc_override_1@ma_b_BakonawaLake_you_leader_bakonawa_slay_7be0b7: "你是巴科纳瓦猎杀队的领袖吗？道路不好走，所以我们必须用绳索爬下悬崖，可以吗？"
