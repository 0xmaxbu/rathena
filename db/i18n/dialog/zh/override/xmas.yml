  npc_override_xmas_HorrorToyFactory_merchants_equipment_toy_factory_i_1dc50f: "这件装备不是来自玩具工厂。我只能处理来自玩具工厂的物品。"
  npc_override_xmas_HorrorToyFactory_merchants_exchange_them_right_away_a6fc4e: "立即兑换"
  npc_override_xmas_HorrorToyFactory_merchants_good_let_s_start_first_e00592: "好的。让我们开始第一次附魔。我会添加一种特殊的战斗效果。当然，你不必害怕，因为不会失败，咕咕。"
  npc_override_xmas_HorrorToyFactory_merchants_hat_you_wear_lush_rose_3c9032: "你戴的帽子不是繁茂玫瑰。带上我告诉你的正确材料，咕咕咕。"
  npc_override_xmas_HorrorToyFactory_merchants_hat_you_wear_refined_gre_492e34: "你戴的帽子没有精炼到+9或更高。你不能用那个来交易。"
  npc_override_xmas_HorrorToyFactory_merchants_hmm_successful_take_look_05a388: "嗯……成功了。来看看吧。"
  npc_override_xmas_HorrorToyFactory_merchants_hmm_way_you_need_fill_949744: "嗯……顺便说一下，你需要填满血腥硬币。你连费用都付不起。"
  npc_override_xmas_HorrorToyFactory_merchants_ho_already_reached_peak_a9556b: "嗬~ 这个已经达到巅峰了。不可能再更高附魔了，所以请知足并好好使用它。"
  npc_override_xmas_HorrorToyFactory_merchants_ho_second_enchantment_no_95c17b: "嗬~ 第二次附魔。现在变得危险了。成功率约为70%。你想继续吗？如果失败，整个饰品会被炸毁。"
  npc_override_xmas_HorrorToyFactory_merchants_holy_water_coin_187312: "圣水（1 硬币）"
  npc_override_xmas_HorrorToyFactory_merchants_hot_tea_coins_88ebe8: "热茶（7 硬币）"
  npc_override_xmas_HorrorToyFactory_merchants_huhu_did_you_bring_some_b44118: "呼呼。你带硬币来了吗？如果你有硬币，我什么都卖，除了我的灵魂。"
  npc_override_xmas_HorrorToyFactory_merchants_huhu_humanbeing_s_greed_9b6640: "呼呼，人类的贪婪是天生的。你想让我做什么？"
  npc_override_xmas_HorrorToyFactory_merchants_i_com_back_later_38496d: "我稍后再来"
  npc_override_xmas_HorrorToyFactory_merchants_i_d_like_get_evilspirit_326bd2: "我想要恶灵手套。"
  npc_override_xmas_HorrorToyFactory_merchants_i_don_t_enchant_9e593a: "我不附魔这个！"
  npc_override_xmas_HorrorToyFactory_merchants_i_don_t_know_what_e177b4: "我不知道这是什么，但我想这不是我能处理的东西。"
  npc_override_xmas_HorrorToyFactory_merchants_i_don_t_them_now_9ed279: "我现在没有它们"
  npc_override_xmas_HorrorToyFactory_merchants_i_enchant_weapons_only_o_b4f622: "我只附魔武器一次。不会失败，所以你可以把它当作额外效果，嘻嘻。"
  npc_override_xmas_HorrorToyFactory_merchants_i_m_seeking_noble_cross_2b46d0: "我在找贵族十字。"
  npc_override_xmas_HorrorToyFactory_merchants_i_take_bloody_coins_each_7ca15d: "每次尝试我会收取15个血腥硬币。每15个硬币我会附魔一个插槽。当然，最多3个。"
  npc_override_xmas_HorrorToyFactory_merchants_i_trade_right_away_2c07ac: "我马上交易"
  npc_override_xmas_HorrorToyFactory_merchants_i_try_next_time_9d3bcb: "我下次再试"
  npc_override_xmas_HorrorToyFactory_merchants_i_ve_tried_several_times_8394e2: "我试了好几次，但运气不好。"
  npc_override_xmas_HorrorToyFactory_merchants_i_want_celine_s_ribbon_d90a3a: "我想要赛琳的缎带。"
  npc_override_xmas_HorrorToyFactory_merchants_if_you_want_enchant_weap_4a1d12: "如果你想附魔这件武器，去找^0000ff玛约玛约^000000，他在玛朗多岛！他应该能做到。"
  npc_override_xmas_HorrorToyFactory_merchants_khaha_what_fickle_friend_52b5f3: "咔哈，你真是个善变的朋友。如果你真的决定买，再来吧。"
  npc_override_xmas_HorrorToyFactory_merchants_khaha_you_feel_any_scrup_cdde23: "咔哈，你感到内疚什么的吗？好吧。你改变主意的时候随时再来。"
  npc_override_xmas_HorrorToyFactory_merchants_kind_items_you_too_vario_52c569: "你拥有的物品种类太多了。减少物品种类后再试。"
  npc_override_xmas_HorrorToyFactory_merchants_last_enchantment_you_kee_758dcf: "这是最后一次附魔。你要继续吗？这次，^ff0000成功率低于50%^000000。当然，如果成功了会很棒……嗯，我会尊重你的决定，但请记住这一点。"
  npc_override_xmas_HorrorToyFactory_merchants_lush_rose_coins_071abf: "丰盛玫瑰（500 硬币）"
  npc_override_xmas_HorrorToyFactory_merchants_nothing_i_want_5a5d6a: "没有我想要的。"
  npc_override_xmas_HorrorToyFactory_merchants_oh_i_m_sure_you_9db042: "哦，我敢肯定你来这里是因为你不喜欢平庸。跟我说话吧。只要你准备好合理的费用和适当的材料，我什么都能做。"
  npc_override_xmas_HorrorToyFactory_merchants_oh_you_equipped_noble_cr_b04943: "哦，你装备了^0000ff贵族十字架^000000！这个东西需要找别人来附魔。"
  npc_override_xmas_HorrorToyFactory_merchants_okay_come_again_when_you_9ccb7a: "好的，你愿意的时候再来，咕咕。"
  npc_override_xmas_HorrorToyFactory_merchants_okay_let_s_try_first_a4a20d: "好的，让我们尝试第一次附魔。通常，它们不会损坏。成功率大约95%？"
  npc_override_xmas_HorrorToyFactory_merchants_okay_you_determined_hope_7e17e6: "好的，你决定了。希望下次还能见到你，呼呼。"
  npc_override_xmas_HorrorToyFactory_merchants_old_parasol_coins_65d0eb: "旧阳伞（1000 硬币）"
  npc_override_xmas_HorrorToyFactory_merchants_ouch_poor_you_enchantmen_1c3026: "哎哟！可怜的你，附魔失败了，你的装备被破坏了，天哪！"
  npc_override_xmas_HorrorToyFactory_merchants_please_5e74f1: "请做吧"
  npc_override_xmas_HorrorToyFactory_merchants_purchase_160f06: "购买"
  npc_override_xmas_HorrorToyFactory_merchants_quit_1a2285: "退出"
