Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_xmas_HorrorToyFactory_merchants_cancel_77dfd2: "取消"
  npc_override_xmas_HorrorToyFactory_merchants_come_back_when_you_ready_a8da4a: "准备好后再来。让我提醒你需要的材料。"
  npc_override_xmas_HorrorToyFactory_merchants_deal_completed_take_look_38f4aa: "交易已完成。来看看吧。"
  npc_override_xmas_HorrorToyFactory_merchants_equipment_toy_factory_i_1dc50f: "这件装备不是来自玩具工厂。我只能处理来自玩具工厂的物品。"
  npc_override_xmas_HorrorToyFactory_merchants_good_let_s_start_first_e00592: "好的。让我们开始第一次附魔。我会添加一种特殊的战斗效果。当然，你不必害怕，因为不会失败，咕咕。"
  npc_override_xmas_HorrorToyFactory_merchants_hat_you_wear_lush_rose_3c9032: "你戴的帽子不是繁茂玫瑰。带上我告诉你的正确材料，咕咕咕。"
  npc_override_xmas_HorrorToyFactory_merchants_hat_you_wear_refined_gre_492e34: "你戴的帽子没有精炼到+9或更高。你不能用那个来交易。"
  npc_override_xmas_HorrorToyFactory_merchants_hmm_successful_take_look_05a388: "嗯……成功了。来看看吧。"
  npc_override_xmas_HorrorToyFactory_merchants_hmm_way_you_need_fill_949744: "嗯……顺便说一下，你需要填满血腥硬币。你连费用都付不起。"
  npc_override_xmas_HorrorToyFactory_merchants_ho_already_reached_peak_a9556b: "嗬~ 这个已经达到巅峰了。不可能再更高附魔了，所以请知足并好好使用它。"
  npc_override_xmas_HorrorToyFactory_merchants_ho_second_enchantment_no_95c17b: "嗬~ 第二次附魔。现在变得危险了。成功率约为70%。你想继续吗？如果失败，整个饰品会被炸毁。"
  npc_override_xmas_HorrorToyFactory_merchants_huhu_did_you_bring_some_b44118: "呼呼。你带硬币来了吗？如果你有硬币，我什么都卖，除了我的灵魂。"
  npc_override_xmas_HorrorToyFactory_merchants_huhu_humanbeing_s_greed_9b6640: "呼呼，人类的贪婪是天生的。你想让我做什么？"
  npc_override_xmas_HorrorToyFactory_merchants_i_com_back_later_38496d: "我稍后再来"
  npc_override_xmas_HorrorToyFactory_merchants_i_don_t_enchant_9e593a: "我不附魔这个！"
  npc_override_xmas_HorrorToyFactory_merchants_i_don_t_know_what_e177b4: "我不知道这是什么，但我想这不是我能处理的东西。"
  npc_override_xmas_HorrorToyFactory_merchants_i_don_t_them_now_9ed279: "我现在没有它们"
  npc_override_xmas_HorrorToyFactory_merchants_i_enchant_weapons_only_o_b4f622: "我只附魔武器一次。不会失败，所以你可以把它当作额外效果，嘻嘻。"
  npc_override_xmas_HorrorToyFactory_merchants_i_take_bloody_coins_each_7ca15d: "每次尝试我会收取15个血腥硬币。每15个硬币我会附魔一个插槽。当然，最多3个。"
  npc_override_xmas_HorrorToyFactory_merchants_i_try_next_time_9d3bcb: "我下次再试"
  npc_override_xmas_HorrorToyFactory_merchants_i_ve_tried_several_times_8394e2: "我试了好几次，但运气不好。"
  npc_override_xmas_HorrorToyFactory_merchants_if_you_want_enchant_weap_4a1d12: "如果你想附魔这件武器，去找^0000ff玛约玛约^000000，他在玛朗多岛！他应该能做到。"
  npc_override_xmas_HorrorToyFactory_merchants_khaha_what_fickle_friend_52b5f3: "咔哈，你真是个善变的朋友。如果你真的决定买，再来吧。"
  npc_override_xmas_HorrorToyFactory_merchants_khaha_you_feel_any_scrup_cdde23: "咔哈，你感到内疚什么的吗？好吧。你改变主意的时候随时再来。"
  npc_override_xmas_HorrorToyFactory_merchants_kind_items_you_too_vario_52c569: "你拥有的物品种类太多了。减少物品种类后再试。"
  npc_override_xmas_HorrorToyFactory_merchants_last_enchantment_you_kee_758dcf: "这是最后一次附魔。你要继续吗？这次，^ff0000成功率低于50%^000000。当然，如果成功了会很棒……嗯，我会尊重你的决定，但请记住这一点。"
  npc_override_xmas_HorrorToyFactory_merchants_nothing_i_want_5a5d6a: "没有我想要的。"
  npc_override_xmas_HorrorToyFactory_merchants_oh_i_m_sure_you_9db042: "哦，我敢肯定你来这里是因为你不喜欢平庸。跟我说话吧。只要你准备好合理的费用和适当的材料，我什么都能做。"
  npc_override_xmas_HorrorToyFactory_merchants_oh_you_equipped_noble_cr_b04943: "哦，你装备了^0000ff贵族十字架^000000！这个东西需要找别人来附魔。"
  npc_override_xmas_HorrorToyFactory_merchants_okay_come_again_when_you_9ccb7a: "好的，你愿意的时候再来，咕咕。"
  npc_override_xmas_HorrorToyFactory_merchants_okay_let_s_try_first_a4a20d: "好的，让我们尝试第一次附魔。通常，它们不会损坏。成功率大约95%？"
  npc_override_xmas_HorrorToyFactory_merchants_okay_you_determined_hope_7e17e6: "好的，你决定了。希望下次还能见到你，呼呼。"
  npc_override_xmas_HorrorToyFactory_merchants_ouch_poor_you_enchantmen_1c3026: "哎哟！可怜的你，附魔失败了，你的装备被破坏了，天哪！"
  npc_override_xmas_HorrorToyFactory_merchants_quit_1a2285: "退出"
  npc_override_xmas_HorrorToyFactory_merchants_second_enchantment_i_buf_4e8c43: "第二次附魔。我会增强之前的一种状态。也不会失败，所以别担心，咕咕咕"
  npc_override_xmas_HorrorToyFactory_merchants_there_problem_please_com_4eb88f: "有问题，请稍后再来！"
  npc_override_xmas_HorrorToyFactory_merchants_thing_your_right_hand_gr_f28027: "你右手拿的东西不是圣十字架（插槽）。带上我告诉你的正确东西，咕咕。"
  npc_override_xmas_HorrorToyFactory_merchants_well_so_natural_destruct_427e80: "好吧，随着升级等级提高，破坏率自然会增加，这是很正常的。我建议你在第一次或第二次尝试时就停止，嘻嘻。"
  npc_override_xmas_HorrorToyFactory_merchants_well_you_short_bloody_co_56ca00: "好吧，你的血腥硬币不够。你需要正好收集2000个。少于那个……没办法。"
  npc_override_xmas_HorrorToyFactory_merchants_well_you_short_bloody_co_a26df8: "好吧，你的血腥硬币不够。你需要正好收集1000个。少于那个……没办法。"
  npc_override_xmas_HorrorToyFactory_merchants_what_i_s_really_simple_0da953: "我做什么？那很简单。你只需给我带来血腥硬币，我就会收下它们并附魔你的饰品。"
  npc_override_xmas_HorrorToyFactory_merchants_what_you_me_8b3245: "你能为我做什么？"
  npc_override_xmas_HorrorToyFactory_merchants_yes_yes_everyone_says_li_627714: "是的，是的。每个人一开始都这么说。回头见。"
  npc_override_xmas_HorrorToyFactory_merchants_you_choose_one_types_fee_e6d108: "你可以选择两种类型中的一种，每次尝试的费用是15个血腥硬币……我会在附魔之前收下它们。"
  npc_override_xmas_HorrorToyFactory_merchants_you_don_t_enough_materia_fe22e8: "你的材料不够。"
  npc_override_xmas_HorrorToyFactory_merchants_you_need_bloody_coins_bu_4e54d8: "你需要^0000ff{0}^000000个血腥硬币来购买^0000ff{1}^000000。你要买吗？"
  npc_override_xmas_HorrorToyFactory_merchants_you_need_bloody_coins_bu_95b719: "你需要^0000ff{0}^000000个血腥硬币来购买^0000ff{1}^000000。你的数量不够。"
  npc_override_xmas_HorrorToyFactory_merchants_you_overburdened_so_you_fbc164: "你负担过重，所以无法继续。请减轻重量后再试。"
  npc_override_xmas_HorrorToyFactory_merchants_you_paid_i_look_forward_d267a8: "你已经付钱了。期待再次见到你。！"
  npc_override_xmas_HorrorToyFactory_merchants_you_should_prepare_blood_ddc648: "你应该准备^0000ff1000^000000个血腥硬币，各一个^0000ff受伤的心灵、善良的心和红灯笼^000000，用于制作^0000ff恶灵手套^000000。"
  npc_override_xmas_guides_lutie_let_me_mark_location_2d2a20: "让我标记{0}的位置"
  npc_override_xmas_guides_lutie_menu_gift_0638a6: "[ 礼品店 ]:[ 教堂 ]:[ 武器&防具店 ]:[ 道具店 ]:[ 圣诞老人之家 ]:[ 玩具工厂 ]:移除小地图标记:取消"
  npc_override_xmas_guides_lutie_safe_your_travels_eeb9a2: "祝你旅途平安。"
  npc_override_xmas_guides_lutie_snow_village_7fb319: "雪之村庄。"
  npc_override_xmas_guides_lutie_sure_i_ll_remove_all_b37a09: "好的，我会移除你小地图上的所有标记。"
  npc_override_xmas_guides_lutie_there_anything_else_i_yo_8fdf01: "还有什么我可以帮你的吗？"
  npc_override_xmas_guides_lutie_welcome_lutie_fd397c: "欢迎来到^8B4513姜饼城^000000，"
  npc_override_xmas_guides_lutie_you_like_check_any_other_342821: "你想查看其他地点吗？"
  npc_override_xmas_guides_lutie_you_need_help_navigating_10d126: "你需要帮助在村子里导航吗？"
  npc_override_xmas_guides_lutie_your_mini_map_c80911: "在你的小地图上。"
  npc_override_xmas_wanderer_aaaaahhh_0721a5: "啊啊啊啊啊！！！！！"
  npc_override_xmas_wanderer_aaaahhhhhhhhh_7ad214: "啊啊啊啊啊啊啊 - - ！！！"
  npc_override_xmas_wanderer_actually_i_shouldn_t_tel_a53b55: "其实，我不应该告诉任何人。"
  npc_override_xmas_wanderer_after_day_i_went_my_8fa85a: "那天之后，我回到了我的家乡修葛拉，一直待在家里。"
  npc_override_xmas_wanderer_after_i_heard_performanc_d4a914: "但在我听说演出取消后，我感到非常难过。"
  npc_override_xmas_wanderer_ah_ah_my_guitar_song_024edb: "啊，啊，我的吉他曲~"
  npc_override_xmas_wanderer_ah_christmas_village_yes_3af7d0: "啊！圣诞村！是的！是的！"
  npc_override_xmas_wanderer_ah_look_f631c7: "啊！看这个！"
  npc_override_xmas_wanderer_ah_me_favor_please_c27ffd: "啊，帮我个忙，拜托。"
  npc_override_xmas_wanderer_ahh_no_8e9017: "啊，不……"
  npc_override_xmas_wanderer_ahhh_so_distracting_afadbc: "啊啊啊，太让人分心了！"
  npc_override_xmas_wanderer_also_i_hope_you_meet_5332a2: "另外，我希望你能遇到你珍贵的宫廷乐师。"
  npc_override_xmas_wanderer_although_she_loses_her_t_3dcbe0: "虽然她很容易发脾气，但她的舞蹈太美妙了……"
  npc_override_xmas_wanderer_angel_happiness_took_bac_b3c630: "幸福天使带走了我的悲伤，给了我好多肚腩！"
  npc_override_xmas_wanderer_awful_c8b0bc: "这太糟糕了。"
  npc_override_xmas_wanderer_back_day_when_she_addict_03569b: "想当年她沉迷于魔物赛跑的时候，是谁把她拉出来的？"
  npc_override_xmas_wanderer_besides_money_i_spent_pr_48d289: "除了我为宣传和搭建舞台花的钱……"
  npc_override_xmas_wanderer_blank_77c377: "（空白……）"
  npc_override_xmas_wanderer_blue_fish_dancing_59924f: "蓝鱼在跳舞~"
  npc_override_xmas_wanderer_boo_hoo_hoo_5da3f3: "呜呜呜！"
  npc_override_xmas_wanderer_boo_hoo_hoo_hoo_c0e535: "呜呜呜呜！！"
  npc_override_xmas_wanderer_boo_hoo_hoo_hoo_f50669: "呜呜呜呜！"
  npc_override_xmas_wanderer_but_2e7fce: "但是……"
  npc_override_xmas_wanderer_calm_down_soy_913161: "冷静点，索伊。"
  npc_override_xmas_wanderer_come_let_s_just_talk_a4ebe4: "来吧，让我们聊聊愉快的事情。"
  npc_override_xmas_wanderer_dancer_kim_dropped_down_d32ba2: "- 舞者金因悲伤和疲惫而倒下 -"
  npc_override_xmas_wanderer_dancer_kim_most_famous_w_cc3071: "舞者金是世界上最著名的浪姬舞者，她与宫廷乐师吉他曲一起组成团队<Nollio>环游世界。"
  npc_override_xmas_wanderer_dancer_kim_performance_n_39c88a: "舞者金和演出与我无关。"
  npc_override_xmas_wanderer_dancer_kim_probably_addi_2dba34: "舞者金可能又沉迷于修葛拉的魔物赛跑了！"
  npc_override_xmas_wanderer_did_i_make_any_mistakes_21d28c: "我犯了什么错误吗？和他们签约后，我做了他们要求我做的一切！"
  npc_override_xmas_wanderer_don_t_look_so_puzzled_dc8d00: "别看起来这么困惑？"
  npc_override_xmas_wanderer_don_t_make_fun_me_ce333f: "别取笑我，咪咪~"
  npc_override_xmas_wanderer_don_t_you_like_me_6525df: "你不喜欢我吗？呜呜……"
  npc_override_xmas_wanderer_don_t_you_think_great_806d40: "你不认为这会是一场很棒的演出吗？"
  npc_override_xmas_wanderer_edgy_kind_name_so_i_cd2311: "它有一个前卫的名字，所以我认为它会成为非常受欢迎的团体。"
  npc_override_xmas_wanderer_even_if_s_over_i_634bed: "即使还没结束，我现在也什么都做不了。"
  npc_override_xmas_wanderer_exercise_best_way_0bbb3d: "锻炼是最好的方式！"
  npc_override_xmas_wanderer_exercising_together_good_88ab63: "一起锻炼很好，但如果我们竞争一下，我认为效果会更好！"
  npc_override_xmas_wanderer_fact_there_friend_who_ch_77f07a: "事实上，有一个朋友在我家乡抑郁时鼓励我，帮助我度过了困难。"
  npc_override_xmas_wanderer_fact_wonderfull_performa_d9e679: "事实上，这场精彩的演出差点因为我的粗心而被取消。"
  npc_override_xmas_wanderer_fan_fan_fan_i_am_d95d65: "粉丝！粉丝！粉丝！我是你的粉丝~"
  npc_override_xmas_wanderer_feeling_reminds_me_past_cf37db: "这种感觉让我想起了我穿越许多大陆边界的过去。"
  npc_override_xmas_wanderer_felt_like_all_angels_hap_3d96b7: "当我品尝那块甜美的蛋糕时，感觉就像所有幸福的天使都来安慰我了。"
  npc_override_xmas_wanderer_felt_like_hearing_mommy_8e5d40: "感觉就像听到妈妈的摇篮曲~ 太美妙感人了……你是我们这个时代最伟大的艺术家。"
  npc_override_xmas_wanderer_few_days_ago_my_partner_f03c3f: "几天前，我和我的搭档吉他曲一起。像往常一样，我们为许多人展示了一段配合他音乐的优美舞蹈。"
  npc_override_xmas_wanderer_first_i_thought_he_kiddi_298fa3: "起初，我以为他在跟我开玩笑！但当他把我赶出房间时……"
  npc_override_xmas_wanderer_following_morning_i_woke_5b073b: "第二天早上，我醒来洗脸，正在房间里找吃的……"
  npc_override_xmas_wanderer_go_149d7a: "走！"
  npc_override_xmas_wanderer_goddess_must_jealous_see_1750f6: "女神看到你一定嫉妒你的美貌。"
  npc_override_xmas_wanderer_good_then_ready_set_02317a: "好的！那准备，开始~~"
  npc_override_xmas_wanderer_guitar_song_adamantly_re_e74bd8: "- 吉他曲坚决拒绝说话。我该怎么做才能听到关于<Nollio>的故事？ -"
  npc_override_xmas_wanderer_guitar_song_also_praised_3395d9: "吉他曲也表扬了我。"
  npc_override_xmas_wanderer_ha_ha_ha_aabfe5: "哈哈哈！"
  npc_override_xmas_wanderer_ha_ha_ha_i_know_8114c8: "哈哈哈。我很清楚，但听到你的赞美感觉很好！"
  npc_override_xmas_wanderer_ha_ha_ha_you_surprised_c1c152: "哈哈哈，你惊讶吗？"
  npc_override_xmas_wanderer_he_he_he_yes_i_5891a9: "嘿嘿嘿！是的，我知道我超级厉害！"
  npc_override_xmas_wanderer_hello_a89011: "你好！！！！！"
  npc_override_xmas_wanderer_hello_ladies_gentlemen_785c82: "大家好，女士们先生们！"
  npc_override_xmas_wanderer_hey_cheer_up_c34c8a: "嘿，振作起来！！！"
  npc_override_xmas_wanderer_hey_i_told_you_stop_9d4a13: "嘿，我告诉过你不要再谈这件事了……"
  npc_override_xmas_wanderer_hey_where_you_going_a3ebb6: "嘿，你要去哪里！"
  npc_override_xmas_wanderer_hey_you_please_go_out_6e1ffa: "嘿！你能出去找宫廷乐师吉他曲吗？"
  npc_override_xmas_wanderer_hey_you_there_be14f6: "嘿，你那边！"
  npc_override_xmas_wanderer_how_about_dancing_lutie_42c3b3: "在姜饼城跳舞怎么样？"
  npc_override_xmas_wanderer_how_could_they_8e2228: "他们怎么能这样做？"
  npc_override_xmas_wanderer_how_i_handle_all_angry_4e54dc: "我该怎么应对所有愤怒的人？"
  npc_override_xmas_wanderer_hu_hurry_up_oh_i_615a09: "呼，快点！！哦，我真的觉得头晕！吉他曲！！！"
  npc_override_xmas_wanderer_huh_a78e67: "嗯……？"
  npc_override_xmas_wanderer_huh_huh_no_2044d5: "嗯嗯！不，那不是……"
  npc_override_xmas_wanderer_huh_i_m_bit_disappointed_f877b1: "嗯……我有点失望你现在才认出我。"
  npc_override_xmas_wanderer_hunting_novus_best_exerc_a9fbf7: "我认为狩猎诺乌斯是最好的锻炼。"
  npc_override_xmas_wanderer_hurry_up_before_i_lose_628948: "在我失去兴趣之前快点！"
  npc_override_xmas_wanderer_i_already_told_guitar_so_f0cbc1: "但我已经告诉吉他曲一切都结束了。"
  npc_override_xmas_wanderer_i_also_tired_here_unpred_830b9a: "我也厌倦了这里不可预测的情绪！"
  npc_override_xmas_wanderer_i_am_charge_performance_ef3986: "我负责这场演出！很多人都在期待看到它，还有许多赞助商在支持我们！我压力好大。"
  npc_override_xmas_wanderer_i_am_dancer_who_dances_37c04e: "我不再是像美丽蝴蝶一样跳舞的舞者了！"
  npc_override_xmas_wanderer_i_am_really_happy_meet_e6a569: "我真的很高兴见到你本人，但我希望在美丽的雪镇姜饼城看到你的演出……呜呜……"
