Body:
  npc_override_xmas_HorrorToyFactory_merchants_cancel_77dfd2: "Cancel"
  npc_override_xmas_HorrorToyFactory_merchants_come_back_when_you_ready_a8da4a: "Come back when you are ready. Let me remind you of the materials."
  npc_override_xmas_HorrorToyFactory_merchants_deal_completed_take_look_38f4aa: "The deal has completed. Take a look at it."
  npc_override_xmas_HorrorToyFactory_merchants_equipment_toy_factory_i_1dc50f: "This equipment is not from Toy Factory. I can handle the items from Toy Factory only."
  npc_override_xmas_HorrorToyFactory_merchants_good_let_s_start_first_e00592: "Good. Let's start the first enchantment. I will add one of the special battle effects. Of course, you don't have to be afraid because there's no failure, kuku."
  npc_override_xmas_HorrorToyFactory_merchants_hat_you_wear_lush_rose_3c9032: "The hat you wear is not Lush Rose. Bring me the right material that I told you, kukuku."
  npc_override_xmas_HorrorToyFactory_merchants_hat_you_wear_refined_gre_492e34: "The hat you wear is not refined to +9 or greater. You cannot trade with that."
  npc_override_xmas_HorrorToyFactory_merchants_hmm_successful_take_look_05a388: "Hmm.. It was successful. Take a look at it."
  npc_override_xmas_HorrorToyFactory_merchants_hmm_way_you_need_fill_949744: "Hmm.. By the way, you need to fill up Bloody Coins. You cannot even pay for the fee."
  npc_override_xmas_HorrorToyFactory_merchants_ho_already_reached_peak_a9556b: "Ho~ This has already reached the peak. It is impossible to higher enchant, so be content and use it well."
  npc_override_xmas_HorrorToyFactory_merchants_ho_second_enchantment_no_95c17b: "Ho~ Second enchantment. Now it became dangerous. The success rate is about 70%. Do you want continue? The whole accessory will be blown if fail."
  npc_override_xmas_HorrorToyFactory_merchants_huhu_did_you_bring_some_b44118: "Huhu. Did you bring some coins? I would sell anything but my soul if you have coins."
  npc_override_xmas_HorrorToyFactory_merchants_huhu_humanbeing_s_greed_9b6640: "Huhu, humanbeing's greed is naturally wantless. What do you want me to do?"
  npc_override_xmas_HorrorToyFactory_merchants_i_com_back_later_38496d: "I will com back later"
  npc_override_xmas_HorrorToyFactory_merchants_i_don_t_enchant_9e593a: "I don't enchant this!"
  npc_override_xmas_HorrorToyFactory_merchants_i_don_t_know_what_e177b4: "I don't know what this is, but I think this isn't thing I could handle."
  npc_override_xmas_HorrorToyFactory_merchants_i_don_t_them_now_9ed279: "I don't have them now"
  npc_override_xmas_HorrorToyFactory_merchants_i_enchant_weapons_only_o_b4f622: "I enchant weapons only once. There's no failure, so you can just think of it as the bonus effect, tee-hee."
  npc_override_xmas_HorrorToyFactory_merchants_i_take_bloody_coins_each_7ca15d: "I will take 15 Bloody Coins for each try. I will enchant one slot amount for every 15 Coins. Of course, 3 is the maximum."
  npc_override_xmas_HorrorToyFactory_merchants_i_try_next_time_9d3bcb: "I will try it next time"
  npc_override_xmas_HorrorToyFactory_merchants_i_ve_tried_several_times_8394e2: "I've tried several times, but have no luck."
  npc_override_xmas_HorrorToyFactory_merchants_if_you_want_enchant_weap_4a1d12: "If you want to enchant this weapon, find ^0000ffMayomayo^000000 in Malangdo island! He should be able to do it."
  npc_override_xmas_HorrorToyFactory_merchants_khaha_what_fickle_friend_52b5f3: "Khaha, what a fickle friend you are. If you really decide to buy it, come again."
  npc_override_xmas_HorrorToyFactory_merchants_khaha_you_feel_any_scrup_cdde23: "Khaha, do you feel any scruples or something? Alright, then. Come again at anytime when you change your mind."
  npc_override_xmas_HorrorToyFactory_merchants_kind_items_you_too_vario_52c569: "The kind of items you have is too various. Retry after reducing the sort of items."
  npc_override_xmas_HorrorToyFactory_merchants_last_enchantment_you_kee_758dcf: "This is the last enchantment. Will you keep going? At this time, ^ff0000the success rate is below 50%^000000. Of course, it would be great if it is successfull... Hmm, I will follow your descision, but keep that in mind."
  npc_override_xmas_HorrorToyFactory_merchants_nothing_i_want_5a5d6a: "Nothing that I want."
  npc_override_xmas_HorrorToyFactory_merchants_oh_i_m_sure_you_9db042: "Oh, I'm sure that you came here because you don't like ordinaries. Just talk to me. I will make anything if you have prepared the reasonable charge and the proper materials."
  npc_override_xmas_HorrorToyFactory_merchants_oh_you_equipped_noble_cr_b04943: "Oh, you are equipped with ^0000ffNoble Cross^000000! This thing need to find someone else to enchant it."
  npc_override_xmas_HorrorToyFactory_merchants_okay_come_again_when_you_9ccb7a: "Okay, come again when you are willing to, kuku."
  npc_override_xmas_HorrorToyFactory_merchants_okay_let_s_try_first_a4a20d: "Okay, let's try the first enchantment. Usually, they are not broken. About 95% success rate?"
  npc_override_xmas_HorrorToyFactory_merchants_okay_you_determined_hope_7e17e6: "Okay, you are determined. Hope we can see each other next time, huhu."
  npc_override_xmas_HorrorToyFactory_merchants_ouch_poor_you_enchantmen_1c3026: "Ouch! Poor you, the enchantment has failed and your gear is broken, Geez!"
  npc_override_xmas_HorrorToyFactory_merchants_quit_1a2285: "Quit"
  npc_override_xmas_HorrorToyFactory_merchants_second_enchantment_i_buf_4e8c43: "The second enchantment. I will buff one of the previous states. There also is no failure, so don't worry, kukuku"
  npc_override_xmas_HorrorToyFactory_merchants_there_problem_please_com_4eb88f: "There is a problem, please come back again!"
  npc_override_xmas_HorrorToyFactory_merchants_thing_your_right_hand_gr_f28027: "The thing on your right hand is not Grand Cross (slot). Bring me the right thing I told you, kuku."
  npc_override_xmas_HorrorToyFactory_merchants_well_so_natural_destruct_427e80: "Well, it is so natural that the destruction rate will get higher as the upgrade level increases. I would recommend you to stop first or second try, tee-hee."
  npc_override_xmas_HorrorToyFactory_merchants_well_you_short_bloody_co_56ca00: "Well, you are short of Bloody Coins. You need to gather exactly 2000 of them. Less than that.. It can't be helped."
  npc_override_xmas_HorrorToyFactory_merchants_well_you_short_bloody_co_a26df8: "Well, you are short of Bloody Coins. You need to gather exactly 1000 of them. Less than that.. It can't be helped."
  npc_override_xmas_HorrorToyFactory_merchants_what_i_s_really_simple_0da953: "What do I do? That's really simple. You just bring me Bloody Coins and I will get them and enchant your accessory."
  npc_override_xmas_HorrorToyFactory_merchants_what_you_me_8b3245: "What can you do for me?"
  npc_override_xmas_HorrorToyFactory_merchants_yes_yes_everyone_says_li_627714: "Yes, yes. Everyone says like you at first. See you later."
  npc_override_xmas_HorrorToyFactory_merchants_you_choose_one_types_fee_e6d108: "You can choose one of 2 types and the fee for each try is 15 Bloody Coins.. I will get them right before enchanting it."
  npc_override_xmas_HorrorToyFactory_merchants_you_don_t_enough_materia_fe22e8: "You don't have enough materials."
  npc_override_xmas_HorrorToyFactory_merchants_you_need_bloody_coins_bu_4e54d8: "You need ^0000ff{0}^000000 Bloody Coins to buy ^0000ff{1}^000000. Are you going to buy it?"
  npc_override_xmas_HorrorToyFactory_merchants_you_need_bloody_coins_bu_95b719: "You need ^0000ff{0}^000000 Bloody Coins to buy ^0000ff{1}^000000. You are short of them."
  npc_override_xmas_HorrorToyFactory_merchants_you_overburdened_so_you_fbc164: "You are overburdened, so you cannot proceed it anymore. Please try again after reduce the weight."
  npc_override_xmas_HorrorToyFactory_merchants_you_paid_i_look_forward_d267a8: "You have paid for it. I look forward to seeing you again.!"
  npc_override_xmas_HorrorToyFactory_merchants_you_should_prepare_blood_ddc648: "You should prepare ^0000ff1000 ^000000Bloody Coins, one ^0000ffHurt Mind, Kind Heart, and Red Lantern ^000000each for ^0000ffEvilspirit Gloves^000000."
  npc_override_xmas_guides_lutie_let_me_mark_location_2d2a20: "Let me mark the location of {0}"
  npc_override_xmas_guides_lutie_menu_gift_0638a6: "[ Gift Shop ]:[ Church ]:[ Weapon & Armor Shop ]:[ Tool Shop ]:[ Santa's House ]:[ Toy Factory ]:Remove Marks from Mini-Map:Cancel"
  npc_override_xmas_guides_lutie_safe_your_travels_eeb9a2: "Be safe on your travels."
  npc_override_xmas_guides_lutie_snow_village_7fb319: "the Snow Village."
  npc_override_xmas_guides_lutie_sure_i_ll_remove_all_b37a09: "Sure, I'll remove all marks from your mini-map."
  npc_override_xmas_guides_lutie_there_anything_else_i_yo_8fdf01: "Is there anything else I can do for you?"
  npc_override_xmas_guides_lutie_welcome_lutie_fd397c: "Welcome to ^8B4513Lutie^000000,"
  npc_override_xmas_guides_lutie_you_like_check_any_other_342821: "Would you like to check any other locations?"
  npc_override_xmas_guides_lutie_you_need_help_navigating_10d126: "Do you need help navigating the village?"
  npc_override_xmas_guides_lutie_your_mini_map_c80911: "on your mini-map."
  npc_override_xmas_wanderer_aaaaahhh_0721a5: "Aaaaahhh!!!!!"
  npc_override_xmas_wanderer_aaaahhhhhhhhh_7ad214: "AAAAhhhhhhhhh - - !!!"
  npc_override_xmas_wanderer_actually_i_shouldn_t_tel_a53b55: "Actually, I shouldn't tell anyone."
  npc_override_xmas_wanderer_after_day_i_went_my_8fa85a: "After that day, I went to my hometown, Hugel and I just stayed indoors."
  npc_override_xmas_wanderer_after_i_heard_performanc_d4a914: "But after I heard the performance got cancelled, I felt so sad."
  npc_override_xmas_wanderer_ah_ah_my_guitar_song_024edb: "Ah, ah my Guitar Song~"
  npc_override_xmas_wanderer_ah_christmas_village_yes_3af7d0: "Ah! Christmas Village! Yes! Yes!"
  npc_override_xmas_wanderer_ah_look_f631c7: "Ah! Look at this!"
  npc_override_xmas_wanderer_ah_me_favor_please_c27ffd: "Ah, do me a favor, please."
  npc_override_xmas_wanderer_ahh_no_8e9017: "Ahh, no....."
  npc_override_xmas_wanderer_ahhh_so_distracting_afadbc: "Ahhh, so distracting!"
  npc_override_xmas_wanderer_also_i_hope_you_meet_5332a2: "Also, I hope you to meet your precious Maestro."
  npc_override_xmas_wanderer_although_she_loses_her_t_3dcbe0: "Although she loses her temper easily, her dance is so wonderful...."
  npc_override_xmas_wanderer_angel_happiness_took_bac_b3c630: "The angel of happiness took back my sadness and gave me a lot of belly fat!"
  npc_override_xmas_wanderer_awful_c8b0bc: "This is awful."
  npc_override_xmas_wanderer_back_day_when_she_addict_03569b: "Back in the day when she was addicted to the monster races, who do you think got her out of it?"
  npc_override_xmas_wanderer_besides_money_i_spent_pr_48d289: "Besides the money I spent for promoting and setting up the stage.."
  npc_override_xmas_wanderer_blank_77c377: "(blank...)"
  npc_override_xmas_wanderer_blue_fish_dancing_59924f: "Blue fish dancing~"
  npc_override_xmas_wanderer_boo_hoo_hoo_5da3f3: "Boo hoo hoo!"
  npc_override_xmas_wanderer_boo_hoo_hoo_hoo_c0e535: "Boo hoo hoo hoo!!"
  npc_override_xmas_wanderer_boo_hoo_hoo_hoo_f50669: "Boo hoo hoo hoo!"
  npc_override_xmas_wanderer_but_2e7fce: "But..."
  npc_override_xmas_wanderer_calm_down_soy_913161: "Calm down, Soy."
  npc_override_xmas_wanderer_come_let_s_just_talk_a4ebe4: "Come on, let's just talk about a pleasant matter."
  npc_override_xmas_wanderer_dancer_kim_dropped_down_d32ba2: "- Dancer Kim dropped down by grief and fatigue -"
  npc_override_xmas_wanderer_dancer_kim_most_famous_w_cc3071: "Dancer Kim is the most famous Wanderer who tours the world with the Maestro Guitar Dong as the team <Nollio>."
  npc_override_xmas_wanderer_dancer_kim_performance_n_39c88a: "Dancer Kim and the performance have nothing to do with me."
  npc_override_xmas_wanderer_dancer_kim_probably_addi_2dba34: "Dancer Kim is probably addicted to the monster races in Hugel again!"
  npc_override_xmas_wanderer_did_i_make_any_mistakes_21d28c: "Did I make any mistakes? After making a contract with them, I did everything they demanded of me!"
  npc_override_xmas_wanderer_don_t_look_so_puzzled_dc8d00: "Don't look so puzzled?"
  npc_override_xmas_wanderer_don_t_make_fun_me_ce333f: "Don't make fun of me Mimi~"
  npc_override_xmas_wanderer_don_t_you_like_me_6525df: "Don't you like me? Sob sob.."
  npc_override_xmas_wanderer_don_t_you_think_great_806d40: "Don't you think it would be a great performance?"
  npc_override_xmas_wanderer_edgy_kind_name_so_i_cd2311: "It has an edgy kind of name So I think that it will be a very popular group."
  npc_override_xmas_wanderer_even_if_s_over_i_634bed: "Even if it's not over, I cannot do anything right now."
  npc_override_xmas_wanderer_exercise_best_way_0bbb3d: "Exercise is the best way!"
  npc_override_xmas_wanderer_exercising_together_good_88ab63: "Exercising together is good but if we compete for it, I think we'll get a better effect!"
  npc_override_xmas_wanderer_fact_there_friend_who_ch_77f07a: "In fact there is a friend who cheered me up and helped me get through the hardships I faced when I was depressed in my hometown."
  npc_override_xmas_wanderer_fact_wonderfull_performa_d9e679: "In fact, this wonderfull performance would have been cancelled because of my carelessness."
  npc_override_xmas_wanderer_fan_fan_fan_i_am_d95d65: "Fan! Fan! Fan! I am your fan~"
  npc_override_xmas_wanderer_feeling_reminds_me_past_cf37db: "This feeling reminds me of the past where I've crossed the borders of many continents."
  npc_override_xmas_wanderer_felt_like_all_angels_hap_3d96b7: "It felt like all the angels of happiness came to comfort me when I tasted that sweet cake."
  npc_override_xmas_wanderer_felt_like_hearing_mommy_8e5d40: "It felt like hearing mommy's lullaby~ It was so beautiful and moving... You are the best artist of our time."
  npc_override_xmas_wanderer_few_days_ago_my_partner_f03c3f: "A few days ago, with my partner Guitar Song. I showed a beautiful dance to his music to many people as we usually do."
  npc_override_xmas_wanderer_first_i_thought_he_kiddi_298fa3: "At first, I thought he was kidding around with me! But when he kicked me out of my room..."
  npc_override_xmas_wanderer_following_morning_i_woke_5b073b: "The following morning, I woke up and washed my fave and was looking for something to eat in my room.."
  npc_override_xmas_wanderer_go_149d7a: "Go!"
  npc_override_xmas_wanderer_goddess_must_jealous_see_1750f6: "The goddess must be jealous to see your beauty."
  npc_override_xmas_wanderer_good_then_ready_set_02317a: "Good! Then ready, set~~"
  npc_override_xmas_wanderer_guitar_song_adamantly_re_e74bd8: "- Guitar Song is adamantly refusing to talk. What should I do to hear the story about <Nollio>? -"
  npc_override_xmas_wanderer_guitar_song_also_praised_3395d9: "Guitar Song also praised me."
  npc_override_xmas_wanderer_ha_ha_ha_aabfe5: "Ha ha ha!"
  npc_override_xmas_wanderer_ha_ha_ha_i_know_8114c8: "Ha ha ha. I know that well, but it feels good to hear a compliment from you!"
  npc_override_xmas_wanderer_ha_ha_ha_you_surprised_c1c152: "Ha ha ha, are you surprised?"
  npc_override_xmas_wanderer_he_he_he_yes_i_5891a9: "He he he! Yes, I know I am super great!"
  npc_override_xmas_wanderer_hello_a89011: "Hello!!!!!"
  npc_override_xmas_wanderer_hello_ladies_gentlemen_785c82: "Hello, ladies and gentlemen!"
  npc_override_xmas_wanderer_hey_cheer_up_c34c8a: "Hey, cheer up!!!"
  npc_override_xmas_wanderer_hey_i_told_you_stop_9d4a13: "Hey, I told you to stop talking about this matter...."
  npc_override_xmas_wanderer_hey_where_you_going_a3ebb6: "Hey, where are you going!"
  npc_override_xmas_wanderer_hey_you_please_go_out_6e1ffa: "Hey! Can you please go out and find the Maestro Guitar Song?"
  npc_override_xmas_wanderer_hey_you_there_be14f6: "Hey, you there!"
  npc_override_xmas_wanderer_how_about_dancing_lutie_42c3b3: "How about dancing in Lutie?"
  npc_override_xmas_wanderer_how_could_they_8e2228: "How could they do that?"
  npc_override_xmas_wanderer_how_i_handle_all_angry_4e54dc: "How can I handle all the angry people?"
  npc_override_xmas_wanderer_hu_hurry_up_oh_i_615a09: "Hu, Hurry up!! Oh, I really feel dizzy! Guitar Song!!!"
  npc_override_xmas_wanderer_huh_a78e67: "Huh...?"
  npc_override_xmas_wanderer_huh_huh_no_2044d5: "Huh huh! No, that is not..."
  npc_override_xmas_wanderer_huh_i_m_bit_disappointed_f877b1: "Huh... I'm a bit disappointed that you finally recognize me now."
  npc_override_xmas_wanderer_hunting_novus_best_exerc_a9fbf7: "Hunting Novus is the best exercise, I think."
  npc_override_xmas_wanderer_hurry_up_before_i_lose_628948: "Hurry up before I lose interest!"
  npc_override_xmas_wanderer_i_already_told_guitar_so_f0cbc1: "But I already told Guitar Song that it's all over."
  npc_override_xmas_wanderer_i_also_tired_here_unpred_830b9a: "I was also tired of here unpredictable feelings, too!"
  npc_override_xmas_wanderer_i_am_charge_performance_ef3986: "I am in charge of this performance! A lot of people are looking forward to see it and there are many sponsors who are supporting us! I'm so stressed."
  npc_override_xmas_wanderer_i_am_dancer_who_dances_37c04e: "I am not a dancer who dances like a beautiful butterfly anymore!"
  npc_override_xmas_wanderer_i_am_really_happy_meet_e6a569: "I am really happy to meet you in person, but I hope to see your performance in the beautiful snowy town, Lutie.. Sob sob..."
  npc_override_xmas_wanderer_i_am_sure_if_guitar_329476: "I am not sure if Guitar Song is in Comodo, you should go there and find him!"
  npc_override_xmas_wanderer_i_am_tambourine_king_43d7ea: "I am the tambourine King ~"
  npc_override_xmas_wanderer_i_cannot_all_myself_bb579f: "But I cannot do it all by myself!"
  npc_override_xmas_wanderer_i_didn_t_slap_you_87c703: "I didn't slap you."
  npc_override_xmas_wanderer_i_don_t_know_she_e93707: "I don't know! She must be holding a grudge for something."
  npc_override_xmas_wanderer_i_don_t_know_what_daa03a: "I don't know what I am doing wrong."
  npc_override_xmas_wanderer_i_don_t_know_where_607f1b: "I don't know where Guitar Song is, but it is clear that he likes to visit the Comodo Casino!"
  npc_override_xmas_wanderer_i_don_t_think_you_46bf14: "But I don't think you disbanded your precious team just because of that."
  npc_override_xmas_wanderer_i_don_t_want_think_84fd02: "I don't want to think about it. It just hurts my feelings."
  npc_override_xmas_wanderer_i_dreamed_being_dancer_k_e148a0: "I have dreamed of being at Dancer Kim's stage for a very long time!"
  npc_override_xmas_wanderer_i_ever_meet_maestro_like_0edca0: "Will I ever meet a Maestro like Guitar Song someday, Mimi?"
  npc_override_xmas_wanderer_i_feel_better_now_153bf8: "I feel better now!"
  npc_override_xmas_wanderer_i_feel_my_body_full_a1cc7e: "I feel that my body is full of power."
  npc_override_xmas_wanderer_i_gave_up_my_dream_8c4d09: "I gave up my dream..."
  npc_override_xmas_wanderer_i_get_tired_give_up_8e437b: "But I get tired and give up easily."
  npc_override_xmas_wanderer_i_good_idea_134db3: "I have a good idea!"
  npc_override_xmas_wanderer_i_grab_them_their_collar_ab218d: "I would grab them by their collars if I could!"
  npc_override_xmas_wanderer_i_guess_she_might_back_992e8e: "I guess she might be back at her hometown."
  npc_override_xmas_wanderer_i_hope_see_your_beautifu_90671b: "{0}! I hope to see your beautiful exploits in the future."
  npc_override_xmas_wanderer_i_know_we_popular_ha_6f1039: "I know that we are that popular! Ha ha ha!"
  npc_override_xmas_wanderer_i_ll_go_there_after_081bfc: "I'll go there after I've packed my luggage!"
  npc_override_xmas_wanderer_i_ll_go_there_right_7fc908: "I'll go there right away and scold her."
  npc_override_xmas_wanderer_i_ll_meet_you_abyss_35596a: "I'll meet you at Abyss Lake."
  npc_override_xmas_wanderer_i_ll_meet_you_there_f026d7: "I'll meet you there."
  npc_override_xmas_wanderer_i_ll_see_you_there_631d34: "I'll see you there."
  npc_override_xmas_wanderer_i_m_getting_slimmer_you_ab2cb5: "I'm getting slimmer, can you see it?"
  npc_override_xmas_wanderer_i_m_really_famous_maestr_03b353: "I'm a really famous Maestro at the peak of my popularity. People are dying to work with me, but you are indifferent to me lady."
  npc_override_xmas_wanderer_i_m_so_glad_i_330cfd: "I'm so glad that I came here, Lutie."
  npc_override_xmas_wanderer_i_m_so_overwhelmed_i_f4dd3c: "But I'm so overwhelmed that I might go crazy. Ahhhh~~!"
  npc_override_xmas_wanderer_i_m_so_tired_i_3d5f1b: "I'm so tired. I don't give up halfway. It's a good exercise for me. I will have to give up Nollio to another Wanderer, it's all over...."
  npc_override_xmas_wanderer_i_m_sorry_behaving_as_85ba13: "I'm sorry for behaving as I did."
  npc_override_xmas_wanderer_i_m_sure_i_better_97f359: "But I'm sure I have a better chance to win."
  npc_override_xmas_wanderer_i_m_sure_i_try_93ca23: "I'm sure that I would try harder if I had someone to workout with."
