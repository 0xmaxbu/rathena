  npc_override_xmas_guides_lutie_safe_your_travels_eeb9a2: "祝你旅途平安。"
  npc_override_xmas_guides_lutie_snow_village_7fb319: "雪之村庄。"
  npc_override_xmas_guides_lutie_sure_i_ll_remove_all_b37a09: "好的，我会移除你小地图上的所有标记。"
  npc_override_xmas_guides_lutie_there_anything_else_i_yo_8fdf01: "还有什么我可以帮你的吗？"
  npc_override_xmas_guides_lutie_welcome_lutie_fd397c: "欢迎来到^8B4513姜饼城^000000，"
  npc_override_xmas_guides_lutie_you_like_check_any_other_342821: "你想查看其他地点吗？"
  npc_override_xmas_guides_lutie_you_need_help_navigating_10d126: "你需要帮助在村子里导航吗？"
  npc_override_xmas_guides_lutie_your_mini_map_c80911: "在你的小地图上。"
  npc_override_xmas_lutie_about_snowysnow_34a239: "关于^3355FF雪雪^000000？"
  npc_override_xmas_lutie_after_you_lose_some_weig_0f3785: "- 等你减了肥之后。-"
  npc_override_xmas_lutie_ah_971301: "啊……"
  npc_override_xmas_lutie_ah_ha_so_you_wanna_d24496: "啊哈！所以你想了解更多关于雪雪的事！让我看看……"
  npc_override_xmas_lutie_ah_snowysnow_3916a2: "啊……^3355FF雪雪^000000？"
  npc_override_xmas_lutie_alchemist_living_3aa859: "炼金术士住在"
  npc_override_xmas_lutie_all_its_visitors_940995: "所有来访的人"
  npc_override_xmas_lutie_always_stuck_here_25fe06: "总是被困在这里……"
  npc_override_xmas_lutie_amidst_woeful_cries_desp_7e8dda: "在绝望的哀号声中，两个婴儿的哭声传入了菲利普·瓦尔塞斯的耳中。他冲过去查看，发现两个婴儿正被一个融化的雪人抱在怀里。"
  npc_override_xmas_lutie_anyway_snowysnow_470ab5: "总之，雪雪"
  npc_override_xmas_lutie_anyway_two_babies_protec_8d3160: "总之，被雪雪抱在怀里保护的那两个婴儿？是的，就是他们。但查鲁查鲁和玛塞尔似乎不知道雪雪救了他们。"
  npc_override_xmas_lutie_aren_t_you_lucky_39b741: "你不是很幸运吗！"
  npc_override_xmas_lutie_around_wonderful_town_et_25ee7a: "在这个永远被圣诞祝福的美好小镇周围，有一个被圣诞永远诅咒的可怕地下城。"
  npc_override_xmas_lutie_as_charu_charu_always_in_ed3ab4: "正如查鲁查鲁总是坚持的那样，他比哈索基更有趣~（但请不要让哈索基知道！）"
  npc_override_xmas_lutie_aunt_thachentze_776b79: "^3355FF塔琴特泽阿姨^000000？"
  npc_override_xmas_lutie_before_you_leave_you_rea_d899cf: "在你离开之前，你真的应该至少见一次雪雪，哪怕只有一次。他真的是个好人，和他聊天很有趣。"
  npc_override_xmas_lutie_being_wise_alchemist_he_4d0f68: "作为一个睿智的炼金术士，瓦尔塞斯推断出雪雪牺牲了自己来保护那两个婴儿免受摧毁村庄的大灾难的伤害。"
  npc_override_xmas_lutie_burrrrpppp_4a8ed0: "*嗝~~~~~*"
  npc_override_xmas_lutie_bye_bye_friend_3f80a8: "再见，朋友~！"
  npc_override_xmas_lutie_candy_87f883: "^3355FF10 糖果^000000！"
  npc_override_xmas_lutie_candy_cane_ad6240: "^3355FF5 拐杖糖^000000！"
  npc_override_xmas_lutie_candy_cane_e51121: "^3355FF10 拐杖糖^000000！"
  npc_override_xmas_lutie_candy_d1b436: "^3355FF5 糖果^000000！"
  npc_override_xmas_lutie_careful_wouldn_t_good_yo_a50350: "小心，如果你感染了卢蒂流感可就不好了。"
  npc_override_xmas_lutie_charu_charu_0cc8df: "^3355FF「查鲁查鲁」^000000和"
  npc_override_xmas_lutie_charu_charu_i_these_old_2fe7e3: "查鲁查鲁和我背上都有这些旧烧伤，雪雪的肚子上有一块黑色的污渍。所以我觉得我们是同时被烧伤的……"
  npc_override_xmas_lutie_charu_charu_watch_your_m_4d576d: "查鲁查鲁！！注意你的言辞！你怎么敢说可怜的哈索基？！他一直在努力让我们开心！"
  npc_override_xmas_lutie_chop_chop_5a0d73: "快点快点~！"
  npc_override_xmas_lutie_christmas_cheer_b4b1eb: "和圣诞欢乐！"
  npc_override_xmas_lutie_christmas_dungeon_around_b5ae21: "这附近的「圣诞地下城」。好吧，如果你已经听说过它，我想我不需要告诉你太多。"
  npc_override_xmas_lutie_come_back_quickly_efd36e: "快点回来~"
  npc_override_xmas_lutie_congratulations_36b252: "恭喜！"
  npc_override_xmas_lutie_cookie_72ed63: "^3355FF10 饼干^000000！"
  npc_override_xmas_lutie_cookie_bcf294: "^3355FF5 饼干^000000！"
  npc_override_xmas_lutie_course_he_still_enjoys_d_ed1d7a: "当然，他仍然喜欢喝奇怪的东西。人们说他居然没有肚子疼真是个奇迹。嘻嘻~！哦，我爱那个家伙！"
  npc_override_xmas_lutie_course_i_know_him_5370bb: "我当然认识他！"
  npc_override_xmas_lutie_course_i_know_him_anyone_ed1069: "我当然认识他！不认识雪雪的人在这里完全是陌生人！有时候，他和我聊得很开心……"
  npc_override_xmas_lutie_course_if_power_fall_int_f075ea: "当然，如果这种力量落入邪恶之手，我们都会陷入麻烦。"
  npc_override_xmas_lutie_course_there_another_rum_88d2ee: "当然，还有另一个传言说，除了那位炼金术士的仁慈之外，雪雪之所以能够存活，还因为他的雪具有特殊的性质。"
  npc_override_xmas_lutie_currently_you_re_carryin_73594b: "- 你当前携带了 -"
  npc_override_xmas_lutie_day_after_day_after_day_246f61: "日复一日日复一日日复一日日复一日日复一日日复一日日复一日日复一日日复一日日复一日……"
  npc_override_xmas_lutie_did_he_well_well_0e3eaf: "是吗？好吧好吧……"
  npc_override_xmas_lutie_did_i_say_out_loud_bd40e4: "我刚才大声说出来了吗？那应该留在我的脑子里！太抱歉了！天哪，我真是个笨蛋，对吧？"
  npc_override_xmas_lutie_did_you_bring_c6f0ae: "你带来了吗？"
  npc_override_xmas_lutie_did_you_talk_clown_guy_18a6cf: "你和那边那个小丑说话了吗？他不是很无聊吗？(-.-)"
  npc_override_xmas_lutie_don_t_e27531: "没有吗？"
  npc_override_xmas_lutie_dum_di_dum_di_dum_a04621: "嘟嘀嘟嘀嘟！"
  npc_override_xmas_lutie_dum_di_dum_di_dum_ea63b4: "嘟嘀嘟嘀嘟"
  npc_override_xmas_lutie_during_night_there_no_pl_b95572: "那是在晚上，我找不到任何药物。看来我对我那小男孩无能为力了。"
  npc_override_xmas_lutie_enjoy_your_holiday_lutie_d9968b: "祝你在卢蒂度过愉快的假期~！"
  npc_override_xmas_lutie_errrm_a75af2: "嗯？"
  npc_override_xmas_lutie_eventually_i_found_mysel_0f7574: "最终，我漫无目的地走进了圣诞地下城。在里面，谢天谢地，我发现了一个完全由冰构成的生物！"
  npc_override_xmas_lutie_everyone_here_never_worr_f32a4e: "这里的每个人从不担心，我总是听到圣诞颂歌之类的东西。"
  npc_override_xmas_lutie_far_north_6fec57: "在遥远的北方。"
  npc_override_xmas_lutie_fixated_poze_s_memento_a0878b: "^3355FF专注于波兹的纪念品。^000000"
  npc_override_xmas_lutie_gasp_ooh_301a58: "*倒吸一口气！* 哦~"
  npc_override_xmas_lutie_get_sour_soon_45346c: "很快就要变酸了！"
  npc_override_xmas_lutie_great_guy_139a80: "是个很棒的家伙！"
  npc_override_xmas_lutie_ha_ha_you_must_d08689: "哈哈，你一定"
  npc_override_xmas_lutie_haaaaappy_holidays_1d5e46: "节日快乐！"
  npc_override_xmas_lutie_hashokii_boring_clown_fi_d1fd46: "哈索基，那个无聊的小丑？一开始，他看起来有点笨，不太有趣。但内心深处，他非常关心别人。"
  npc_override_xmas_lutie_haw_haw_haw_5b1877: "嚯嚯嚯！"
  npc_override_xmas_lutie_he_always_foremost_resea_23269b: "他总是在炼金术研究中走在最前面，需要稀有材料来进行他的研究。因此，他不得不周游世界寻找含有魔法能量的材料……"
  npc_override_xmas_lutie_he_knows_me_too_well_738e99: "他太了解我了。我几乎忍不住想给那个男人一些腌菜。是的，即使我知道我的腌菜是全镇最好的！"
  npc_override_xmas_lutie_he_makes_such_good_audie_81595e: "他是我的表演最好的观众。但说实话，我不确定他是否真的喜欢。大多数人似乎不太喜欢我的笑话。"
  npc_override_xmas_lutie_he_s_always_trying_his_01f40c: "他一直在努力让那两个孤儿笑，让他们忘记烦恼……"
  npc_override_xmas_lutie_he_s_funny_all_529b7f: "但他一点都不好笑！"
  npc_override_xmas_lutie_he_s_nice_funny_guy_4da0a4: "他是个又好又有趣的人！"
  npc_override_xmas_lutie_he_s_nice_snowman_30d3bb: "他是个好雪人！"
  npc_override_xmas_lutie_he_s_snowman_doesn_t_985683: "他是个没有腿的雪人。难怪他还没来看我。真可惜，真可惜。我想我最好还是去看他。"
  npc_override_xmas_lutie_he_s_so_warm_hearted_1a799d: "但他非常热心~！有时候，我和雪雪这个雪人聊天。出于某种奇怪的原因，他能像我们一样说话！"
  npc_override_xmas_lutie_he_s_such_honest_good_cf7005: "他是个诚实、善良的好人。我希望他和达芙尔有一天能在一起。"
  npc_override_xmas_lutie_hee_hee_hee_5ab980: "嘻嘻嘻~！"
  npc_override_xmas_lutie_heh_heh_heh_well_don_2aefd0: "嘿嘿嘿~ 嗯，别以为我会免费告诉你，除非你给我点什么回报！"
  npc_override_xmas_lutie_heheheheheh_c69a9d: "嘿嘿嘿嘿嘿~！"
  npc_override_xmas_lutie_hello_hello_3a0c74: "你好你好！"
  npc_override_xmas_lutie_here_magical_land_fun_fa_98159e: "在这个充满乐趣和幻想的魔法之地，你可以全年享受圣诞精神~！难道不美妙吗？"
  npc_override_xmas_lutie_hey_you_heard_here_lutie_a3270c: "嘿，你听说在卢蒂，我们有一个和圣诞老人一样著名的景点吗？"
  npc_override_xmas_lutie_his_name_ef50c3: "他的名字是"
  npc_override_xmas_lutie_hmm_hairy_guy_b61dab: "嗯？那个毛茸茸的家伙"
  npc_override_xmas_lutie_hmmm_9ac029: "嗯~？"
  npc_override_xmas_lutie_hmmm_sorry_7e2d4b: "嗯，抱歉！"
  npc_override_xmas_lutie_hmmm_well_6f7829: "嗯，好吧……"
  npc_override_xmas_lutie_ho_ho_ho_6dc186: "嚯嚯嚯~"
  npc_override_xmas_lutie_ho_ho_ho_bc34b4: "嚯！嚯！嚯！"
  npc_override_xmas_lutie_ho_ho_ho_ea12fa: "嚯嚯嚯~"
  npc_override_xmas_lutie_ho_ho_hooooo_d79d45: "嚯嚯嚯！！！"
  npc_override_xmas_lutie_hohohoho_054f99: "嚯嚯嚯嚯~"
  npc_override_xmas_lutie_hohohohoh_hohohohoho_751bf2: "嚯嚯嚯嚯嚯 嚯嚯嚯嚯嚯！"
  npc_override_xmas_lutie_hoooraaaay_1dbb70: "万岁~！"
  npc_override_xmas_lutie_how_did_i_ever_get_683ecf: "我是怎么来到这个小镇的？我怎么能说话？！这-这不自然，对吧？那……那让我变成怪物了吗？"
  npc_override_xmas_lutie_how_he_created_how_he_6e4c27: "他是如何被创造出来的，以及他如何像人类一样思考和说话，这都是个谜……"
  npc_override_xmas_lutie_however_everyone_knows_s_0bab76: "然而，每个人都知道雪雪对他人善良而充满爱心。所以我们从不担心雪雪的力量。"
  npc_override_xmas_lutie_huh_what_s_look_your_493bd6: "嗯？你脸上那表情是什么意思？雪雪的身体里有一个大礼物袋，他随时想给就给礼物。这有什么难相信的？"
  npc_override_xmas_lutie_hurry_now_dear_983750: "快点，亲爱的，"
  npc_override_xmas_lutie_hurry_up_84d001: "快点。"
  npc_override_xmas_lutie_i_already_know_854c3b: "我已经知道了！"
  npc_override_xmas_lutie_i_also_heard_snowysnow_d_79ccee: "我还听说雪雪也没有爸爸妈妈。而且我还听说雪雪和我们不是出生在这里，而是别的地方。"
  npc_override_xmas_lutie_i_born_area_north_where_dcc7d4: "我出生在一个北方的地方，那里总是下雪，而且比卢蒂冷得多，如果你能相信的话。"
  npc_override_xmas_lutie_i_d_rather_stay_snowysno_b37633: "我宁愿和^3355FF雪雪^000000待在一起~"
  npc_override_xmas_lutie_i_didn_t_notice_how_60b0a7: "我没有注意到过了多少时间，但当我醒来时，我就在这里了。嗯，我可以说，卢蒂这个地方就像天堂一样。"
  npc_override_xmas_lutie_i_don_t_even_know_a15b0f: "我甚至不知道我是什么。但即便如此，卢蒂的人们还是试着接受我，不管我是什么。"
  npc_override_xmas_lutie_i_feel_christmas_spirit_2495ee: "我能感受到周围无处不在的圣诞精神！甚至体现在那些远道而来卢蒂的年轻旅行者的眼中。嚯嚯，我祝你圣诞快乐！"
  npc_override_xmas_lutie_i_figured_something_out_438f7b: "几天前我发现了一件事。在圣诞地下城里，你会遇到和城外类似的生物。"
  npc_override_xmas_lutie_i_guess_you_should_talk_6facc3: "如果你想了解更多关于雪雪的谜团，我想你应该和卢蒂的其他居民谈谈……"
  npc_override_xmas_lutie_i_keep_place_personally_a56a28: "我负责管理这个地方，并亲自运送想要参观卢蒂的人。如果你想离开小镇，请去那边问圣诞老人。他会告诉你离开卢蒂的路。"
  npc_override_xmas_lutie_i_knew_i_needed_5a72b6: "我知道我需要"
  npc_override_xmas_lutie_i_know_903076: "我知道"
  npc_override_xmas_lutie_i_know_s_because_she_93b4ff: "但我知道那是因为她非常非常喜欢他！嘻嘻嘻！"
  npc_override_xmas_lutie_i_know_what_he_thinks_371cd4: "我知道他在想什么……嚯嚯嚯~！他想让我开心，这样我就会给他一些免费的腌菜罐子！哦好吧~！"
  npc_override_xmas_lutie_i_like_her_cooking_becau_983aeb: "我喜欢她做的菜，因为太好吃了！有时候，她给我雪花葡萄糖浆。总之，请帮我把那盐送给她，伙计~！"
  npc_override_xmas_lutie_i_ll_see_you_again_0f916f: "我们总有一天会再见面的！你会永远在我心中~"
  npc_override_xmas_lutie_i_m_baffee: "我是……"
  npc_override_xmas_lutie_i_m_guessing_monsters_wa_c2f8b4: "我猜怪物是从城外游荡到这里的，然后被这里的寒冷天气改变了。所以怪物适应了在这个环境中生存。"
  npc_override_xmas_lutie_i_m_santa_claus_i_cc1715: "我是圣诞老人，我在圣诞节给每个好孩子和好女孩带来礼物！"
  npc_override_xmas_lutie_i_m_santa_guide_people_2e7f13: "我是圣诞老人，会引导人们前往圣诞小镇卢蒂。随时问我，我会魔法般把你送到那里~"
  npc_override_xmas_lutie_i_m_so_lonely_e6f50c: "我太孤独了！"
  npc_override_xmas_lutie_i_m_sure_4c6cf6: "我确定！"
  npc_override_xmas_lutie_i_made_love_human_i_94c4e5: "我是由一个人类用爱创造的，我在那里真的很开心。生活很简单，但充满了宁静的幸福。"
  npc_override_xmas_lutie_i_suppose_if_you_re_bc7cef: "我想如果你真的是雪雪的朋友，他会足够信任你，把它交给你，让你转交给我。无论如何，我很快就需要更多。"
  npc_override_xmas_lutie_i_t_tell_you_how_a5d313: "我不能告诉你怎么回事，但当雪雪复活时，炼金术士的材料和雪雪的雪的能量之间产生了反应。"
  npc_override_xmas_lutie_i_thought_i_could_live_14ccd7: "我以为我可以在那种满足中度过余生。但是……事与愿违。"
  npc_override_xmas_lutie_i_thought_least_i_could_39b598: "我想我至少能为我的儿子做点什么，拿些冷的东西来退烧，但卢蒂的雪放在他额头上后不断融化。他烧得很厉害，我却无法缓解他的痛苦。"
  npc_override_xmas_lutie_i_ve_heard_s_well_a6a1a5: "我听说里面装饰得很好，看起来就像一个玩具工厂，所有东西都那么可爱漂亮。到处都是玩具士兵和礼物盒！"
  npc_override_xmas_lutie_i_ve_heard_snowysnow_us_e85468: "我听说雪雪和我们实际上来自同一个地方，虽然我还不太确定。但我知道雪雪和我身上有同样类型的烧伤。"
  npc_override_xmas_lutie_i_wish_all_you_joy_f5a40e: "我祝你们所有人快乐"
  npc_override_xmas_lutie_iceporing_local_people_u_a60c6a: "那是一个^3355FF冰波利^000000！当地人过去叫它「冰潘泽林」。总之，我用它救了我儿子的命。谢天谢地，这个小镇上有这样的东西。"
  npc_override_xmas_lutie_if_you_already_met_uncle_2dbd6a: "如果你已经见过坎塔塔叔叔，你现在一定知道雪雪是由覆盖着一片魔法花田的神秘雪制成的。"
  npc_override_xmas_lutie_if_you_want_leave_lutie_b4ec31: "如果你想离开卢蒂，出城后向南走到你看到的第一片田野。你会找到一个魔法传送门，它会带你到艾尔帕兰。"
  npc_override_xmas_lutie_isn_t_soooo_exciting_sig_18860a: "难道不令人兴奋吗？！*叹息*即使那是一个地下城，我也想进去看看。如果我是一个真正的男孩，或者至少有腿的话……"
  npc_override_xmas_lutie_la_la_la_e3832e: "啦啦啦~！"
  npc_override_xmas_lutie_lately_seems_more_more_p_ffd062: "最近，似乎越来越多的人来这个小镇看雪雪。"
  npc_override_xmas_lutie_let_s_see_let_s_86134b: "让我看看，让我看看……"
  npc_override_xmas_lutie_living_3dd499: "住在这个"
  npc_override_xmas_lutie_long_ago_great_alchemist_ee4604: "很久以前，一位伟大的炼金术士来到雪雪的家乡，碰巧遇到雪雪正在融化成水。然而，那位炼金术士奇迹般地复活了雪雪。"
  npc_override_xmas_lutie_long_time_ago_331626: "很久以前，"
  npc_override_xmas_lutie_looks_like_cold_brought_aceb86: "看起来寒冷让你的脸颊泛起了红晕。"
  npc_override_xmas_lutie_lutie_fantastic_christma_60433f: "^3355FF卢蒂^000000，神奇的圣诞小镇！永远充满给予的精神，卢蒂充满了诱人的蛋糕、小小的玩具士兵，以及各种美妙的东西~！"
  npc_override_xmas_lutie_lutie_isn_t_merely_just_ebf58b: "卢蒂不仅仅是一个简单的景点。我们和其他城镇一样有便利的设施，但环境充满节日气氛。"
  npc_override_xmas_lutie_magical_ae61ae: "神奇的"
  npc_override_xmas_lutie_man_s_drink_hmmm_bring_38ea9f: "男人的酒。嗯，给我拿……"
  npc_override_xmas_lutie_marcell_they_attend_my_s_dbcba6: "^3355FF「玛塞尔」^000000。他们经常来看我的表演。我猜你已经从坎塔塔那里听过这个故事了？"
  npc_override_xmas_lutie_meeee_rrrrryyyy_christma_55fc47: "圣诞——快乐~！"
  npc_override_xmas_lutie_meeeeeeerry_christmas_c6e4d6: "圣诞快乐！"
  npc_override_xmas_lutie_meeeeerry_christmas_64c155: "圣诞快乐！"
  npc_override_xmas_lutie_meeeerry_christmas_262e58: "圣诞快乐！！"
  npc_override_xmas_lutie_mentioned_me_01f997: "提到我了？"
  npc_override_xmas_lutie_menu_info_0a9ede: "关于卢蒂的信息:移动到「卢蒂」:取消"
  npc_override_xmas_lutie_menu_it_c586ed: "那是一幅凄惨的景象:人们躺在路边，痛苦地呻吟。当瓦尔塞斯走过时，每个村民都会哀求:「杀-杀了我……」恳求他结束他们的痛苦。"
  npc_override_xmas_lutie_menu_snowysnow_957e69: "^3355FF雪雪？^000000:关于圣诞地下城的信息:结束对话"
  npc_override_xmas_lutie_menu_yo_3ed3dc: "哟，小丑男孩，怎么了？:关于雪雪:结束对话"
  npc_override_xmas_lutie_merry_christmas_4b7c42: "圣诞快乐~"
  npc_override_xmas_lutie_merry_christmas_767024: "圣诞快乐！"
  npc_override_xmas_lutie_merry_christmas_a57b96: "圣诞快乐~！"
  npc_override_xmas_lutie_merry_christmas_a963ea: "圣诞快乐！！"
  npc_override_xmas_lutie_merry_christmas_c2cdf7: "圣诞快乐-！！"
  npc_override_xmas_lutie_merry_christmas_ec8b6e: "圣诞快乐！"
  npc_override_xmas_lutie_merry_merry_christmas_3e1a0f: "圣诞快乐！"
  npc_override_xmas_lutie_more_than_anybody_else_y_987e88: "比任何人都了解雪雪！请和雪雪先生谈谈，他很高兴知道你在乎他。圣诞快乐！"
  npc_override_xmas_lutie_msg_6eae3a: "…"
  npc_override_xmas_lutie_msg_93fcbf: "……"
  npc_override_xmas_lutie_much_chance_enjoy_1449e7: "太多机会去享受"
  npc_override_xmas_lutie_muhahaha_947132: "嚯哈哈哈~"
  npc_override_xmas_lutie_my_cabbages_57be31: "我的卷心菜会"
  npc_override_xmas_lutie_my_dear_friend_please_vi_1fc995: "我亲爱的朋友，请时常来看我，这样我们可以聊聊天，好吗？再见！圣诞快乐！"
  npc_override_xmas_lutie_my_little_boy_had_terrib_398c86: "不久前，我的小儿子得了严重的卢蒂流感。"
  npc_override_xmas_lutie_nice_trip_651a18: "旅途愉快！"
  npc_override_xmas_lutie_now_dear_46dad0: "现在乖，"
  npc_override_xmas_lutie_now_i_am_able_pickle_fe0c77: "现在我可以正确地腌我的卷心菜了。谢谢你，亲爱的。谢谢你……"
  npc_override_xmas_lutie_now_i_think_about_c63eae: "现在想想……"
  npc_override_xmas_lutie_now_isn_t_nice_4b1247: "现在，难道不美好吗？"
  npc_override_xmas_lutie_now_you_know_me_better_a5226c: "现在，你比这个镇上的任何人都更了解我了。所以，作为回报，我想给你一个小礼物。"
  npc_override_xmas_lutie_oh_6a4011: "哦……？"
  npc_override_xmas_lutie_oh_6cc234: "哦……！"
  npc_override_xmas_lutie_oh_goodness_e0b5d3: "天哪……！"
  npc_override_xmas_lutie_oh_goody_71015f: "哦太好了！"
  npc_override_xmas_lutie_oh_i_see_979036: "哦我明白了……"
  npc_override_xmas_lutie_oh_i_ve_just_heard_fcbe39: "哦，我刚从^3355FF小丑哈索基^000000那里听到了一些令人震惊的消息。其实是个很有趣的故事。你为什么不问他更多呢？"
  npc_override_xmas_lutie_oh_no_421239: "……哦不~！"
  npc_override_xmas_lutie_oh_now_i_see_f51750: "哦，现在我明白了……"
  npc_override_xmas_lutie_oh_there_someone_who_kno_9fff50: "哦，有人知道雪雪是如何学会说话的。那个人就是^3355FF毛茸茸的坎塔塔叔叔^000000……"
  npc_override_xmas_lutie_oh_well_6e7eea: "哦好吧……"
  npc_override_xmas_lutie_oh_well_if_you_didn_86019f: "哦好吧，如果你还没去看过雪雪，你至少应该见他一次。他很有趣！"
  npc_override_xmas_lutie_oh_woooooow_9c7334: "哦哇~~~~~！"
  npc_override_xmas_lutie_oh_y_y_you_ve_a970ee: "哦？你-你-你拿到东西了？太-太好了。我已经很久没有尝过这个了……给-给我！"
  npc_override_xmas_lutie_oh_yeah_heard_about_me_255393: "哦是吗？从波兹那里听说过我，是吗？嚯嚯嚯！是的，我对雪雪了解一点。事实上，我可能是他的弱点，因为……"
  npc_override_xmas_lutie_oh_yes_i_m_sorry_ae7be9: "哦是的，抱歉。我差点忘了答应你的事。你问我关于雪雪的魔法礼物袋，对吧？"
  npc_override_xmas_lutie_oh_yes_yes_i_see_3b6bc9: "哦。是的，是的，我明白了……"
  npc_override_xmas_lutie_okay_now_i_think_i_cad75b: "好吧，现在我想我最好准备腌一些卷心菜。如果你还不知道，我做的腌菜是最好吃的！你为什么不晚点来尝尝呢？"
  npc_override_xmas_lutie_one_day_his_travels_brou_e51803: "有一天，他的旅行把他带到了一个以严寒天气闻名的北方村庄。但当他到达时，迎接他的是一座最近被摧毁的冒烟小镇。"
  npc_override_xmas_lutie_one_day_when_apprentice_0cc655: "有一天，当那位伟大炼金术士的学徒来到卢蒂时，我来偷听他和毛茸茸叔叔的谈话。"
  npc_override_xmas_lutie_one_fateful_day_some_ugl_154e71: "在一个命运攸关的日子，一个丑陋的老妇人来到了我们的小镇。人们说她的名字叫「梅洛菲丘姆」，她来自一个天气总是很热的奇怪洞穴小镇。"
  npc_override_xmas_lutie_only_way_get_lutie_here_fefe44: "到达卢蒂的唯一途径就在艾尔帕兰！"
  npc_override_xmas_lutie_ooh_af75df: "哦~！"
  npc_override_xmas_lutie_ooh_i_m_trying_think_d48faf: "哦，我正在想给查鲁查鲁和玛塞尔表演什么好节目！"
  npc_override_xmas_lutie_oops_i_think_i_ve_8cce43: "哎呀，我想我说得太多了。圣诞快乐~！"
  npc_override_xmas_lutie_philip_varsez_214e5e: "^3355FF菲利普·瓦尔塞斯^000000！"
  npc_override_xmas_lutie_pick_anything_3fd2d5: "随便挑"
  npc_override_xmas_lutie_piece_cake_5c265f: "^3355FF2 块蛋糕^000000！"
  npc_override_xmas_lutie_piece_cake_929b61: "^3355FF1 块蛋糕^000000！"
  npc_override_xmas_lutie_please_try_again_cefdd7: "- 请再试一次 -"
  npc_override_xmas_lutie_poze_gave_me_his_glamour_a661ed: "^3355FF波兹^000000给了我他的魅力照片，上面还有他的地址，告诉我心情不好的时候随时可以去找他。听到这个我太开心了……"
  npc_override_xmas_lutie_poze_love_duffle_she_s_2aae5d: "波兹爱上了达芙尔。而她对每个人都很友善，除了波兹。"
  npc_override_xmas_lutie_really_excited_618b9e: "真的很兴奋！"
  npc_override_xmas_lutie_roughest_af629c: "「^3355FF最粗糙的"
  npc_override_xmas_lutie_roughest_salt_world_6eaa3b: "世界上最粗糙的盐。^000000」"
  npc_override_xmas_lutie_s_810442: "^3355FF它是……^000000"
  npc_override_xmas_lutie_s_amazing_land_blessed_b_5ad9a8: "这是一片被冬日之美祝福的神奇土地，全年都有节日的氛围！"
  npc_override_xmas_lutie_s_believed_snowysnow_s_s_853f53: "人们相信雪雪的雪曾经覆盖着一片神秘的田野，那里会开满魔法花朵。"
  npc_override_xmas_lutie_s_freezing_out_here_char_69d6e1: "外面好冷……！查鲁查鲁那些难以忍受的笑话让我更冷了。而且风刮得好大！"
  npc_override_xmas_lutie_s_original_santa_claus_a8a2cc: "^3355FF这是原版圣诞老人！^000000"
  npc_override_xmas_lutie_s_pretty_much_all_i_1fd17a: "但我就知道这么多。要了解实际细节，你应该去问^3355FF毛茸茸的坎塔塔叔叔^000000。"
  npc_override_xmas_lutie_s_snowysnow_5fedf1: "它是^3355FF雪雪^000000，"
  npc_override_xmas_lutie_s_weird_people_lutie_cal_85a32d: "卢蒂的人叫我神秘的魔法雪人，这很奇怪。我的意思是，在内心，我和普通人不是一样的吗？"
  npc_override_xmas_lutie_salt_world_b493f5: "世界上最粗糙的盐^000000……」"
  npc_override_xmas_lutie_same_spot_9a4e05: "在同一个地方……"
  npc_override_xmas_lutie_santa_claus_9671da: "来自圣诞老人？！"
  npc_override_xmas_lutie_secret_46c6c7: "的秘密"
  npc_override_xmas_lutie_sigh_7f634d: "*叹息*"
  npc_override_xmas_lutie_sigh_reminds_me_beb592: "*叹息* 这让我想起……"
  npc_override_xmas_lutie_sniff_s_sometimes_fe1e87: "*抽泣* 有-有时候，"
  npc_override_xmas_lutie_snowman_574ce6: "那个雪人……"
  npc_override_xmas_lutie_snowysnow_59bf9a: "就是^3355FF雪雪^000000。"
  npc_override_xmas_lutie_snowysnow_5c678f: "雪雪？"
  npc_override_xmas_lutie_snowysnow_been_holding_s_b13d31: "雪雪一直帮我保管着一样东西，^3355FF世界上最粗糙的盐^000000，我用它来腌卷心菜。"
  npc_override_xmas_lutie_snowysnow_gave_you_rough_fbabb2: "^3355FF雪雪给了你世界上最粗糙的盐^000000。"
  npc_override_xmas_lutie_snowysnow_he_e68846: "^3355FF雪雪^000000和他"
  npc_override_xmas_lutie_snowysnow_immersed_his_d_7a5933: "^3355FF雪雪沉浸在他的深思中，看起来^000000"
  npc_override_xmas_lutie_snowysnow_only_speak_he_5958a3: "雪雪不仅会说话，而且似乎还能创造无穷无尽的圣诞礼物。至少，我是这么听说的。"
  npc_override_xmas_lutie_snowysnow_s_birth_39fbb1: "^3355FF雪雪的诞生^000000！！"
  npc_override_xmas_lutie_snowysnow_s_magical_gift_2dcc50: "雪雪的魔法礼物袋^000000。"
  npc_override_xmas_lutie_snowysnow_told_me_story_f825d4: "雪雪给我讲了他如何让身体飞起来挡住即将击中他们的巨大火球的故事。为了他们，他愿意牺牲自己。"
  npc_override_xmas_lutie_so_if_you_decide_stay_e50532: "所以如果你决定在这里待一段时间，你应该有所有你需要的舒适。圣诞快乐~"
  npc_override_xmas_lutie_so_you_my_friend_if_bbd796: "所以你会成为我的朋友吗？如果你愿意，我也会是你的朋友~"
  npc_override_xmas_lutie_so_you_ve_met_charu_0e8d32: "所以你见过查鲁查鲁了？那个男孩充满了乐观，总是向前看。等他长大了，他一定会成为大人物的！"
  npc_override_xmas_lutie_so_you_ve_met_duffle_4e2829: "所以你见过达芙尔了？"
  npc_override_xmas_lutie_some_magic_ice_2f396b: "一些魔法冰。"
  npc_override_xmas_lutie_some_reason_snowysnow_s_38fd41: "出于某种原因，雪雪的礼物袋现在可以像圣诞老人一样创造尽可能多的礼物。"
  npc_override_xmas_lutie_sometimes_all_christmas_920cda: "有时候，所有的圣诞欢乐都无法治愈我内心深处涌动的黑暗孤独。"
  npc_override_xmas_lutie_spirit_christmas_d3cbc4: "圣诞精神！"
  npc_override_xmas_lutie_spoke_well_me_0a77d5: "为我说好话，"
  npc_override_xmas_lutie_squid_ink_98a75c: "^3355FF1 墨鱼汁^000000和"
  npc_override_xmas_lutie_sticky_muscus_e147de: "^3355FF1 黏性黏液^000000！"
  npc_override_xmas_lutie_still_fb124f: "但还是……"
  npc_override_xmas_lutie_stops_says_hi_aa8171: "停下来打招呼……"
  npc_override_xmas_lutie_sure_he_loud_voice_doesn_c65077: "当然，他声音很大，不洗澡，闻起来像腐烂的食物。但他是个热心肠的有趣家伙。每个人都喜欢他！"
  npc_override_xmas_lutie_tah_dah_a41181: "嗒哒！"
  npc_override_xmas_lutie_talking_snowman_db7dd3: "会说话的雪人！"
  npc_override_xmas_lutie_thachentze_lovely_pickle_692f8a: "^3355FF塔琴特泽^000000，那个可爱的腌菜师傅，知道更多。所以如果你好奇，你应该去和她聊聊。好了，圣诞快乐！"
  npc_override_xmas_lutie_thank_you_dear_thank_you_273017: "谢谢你，亲爱的，谢谢你。"
  npc_override_xmas_lutie_thank_you_listening_me_ffae40: "谢谢你听我说~"
  npc_override_xmas_lutie_thank_you_listening_me_s_c5a54a: "谢谢你听我说到现在。我真的很感激你试着理解我，尽管你是这里的陌生人。"
  npc_override_xmas_lutie_then_002edd: "就在那时"
  npc_override_xmas_lutie_then_fate_played_its_cru_7a7241: "但命运又一次对我开了残酷的玩笑，我意识到我没有腿可以去看他。"
  npc_override_xmas_lutie_there_great_e3d5ec: "有一个伟大的"
  npc_override_xmas_lutie_they_getting_smarter_wit_6b0d75: "他们变得越来越聪明，越来越机智，现在似乎不再对我最好的笑话发笑了。他们怎么变得这么聪明了？"
  npc_override_xmas_lutie_they_re_all_nice_generou_9745b4: "他们都很好很慷慨，我们总是感激他们为照顾我们所做的一切。"
  npc_override_xmas_lutie_third_night_she_there_sh_af0951: "她到那里的第三个晚上，她用可怕的魔法点燃了小镇。每个人都在恐惧和混乱中惊慌逃窜。不知怎么的，我被打昏了。"
  npc_override_xmas_lutie_too_many_items_you_fc968e: "- 你携带的物品太多了。-"
  npc_override_xmas_lutie_totally_baffles_me_how_c_9d2427: "我完全不明白！他们怎么可能不喜欢世界上最好的笑话？！天哪~"
  npc_override_xmas_lutie_town_doesn_t_give_me_1f6092: "这个小镇没有给我"
  npc_override_xmas_lutie_town_which_blesses_3ec7b6: "这个祝福"
  npc_override_xmas_lutie_uncle_cantata_auntie_tha_0e489e: "坎塔塔叔叔和塔琴特泽阿姨把我们当作自己的孩子，波兹和达芙尔就像我们的哥哥和姐姐！"
  npc_override_xmas_lutie_uncle_hairy_cantata_f0431b: "^3355FF毛茸茸的坎塔塔叔叔^000000？"
  npc_override_xmas_lutie_varsez_touched_determine_8f9f25: "瓦尔塞斯深受感动，决心用他的炼金术拯救这个雪人的生命。然后他会把他运送到卢蒂，世界上最安全的地方。"
  npc_override_xmas_lutie_wahhahaha_what_hell_look_a608eb: "哇哈哈哈！你那表情是什么意思？！别管我精致的美食品味！现在去干活~！"
  npc_override_xmas_lutie_wait_minute_17efa5: "- 等一下！！ -"
  npc_override_xmas_lutie_we_dungeon_named_bca3ab: "我们有一个名为"
  npc_override_xmas_lutie_welcome_lutie_7db6b5: "欢迎来到卢蒂！"
  npc_override_xmas_lutie_welcome_lutie_fd397c: "欢迎来到卢蒂，"
  npc_override_xmas_lutie_well_7b1901: "嗯……"
  npc_override_xmas_lutie_well_charu_charu_i_orpha_416d46: "嗯，查鲁查鲁和我是孤儿，完全不记得我们的父母。我们是被卢蒂的人们抚养长大的。"
  npc_override_xmas_lutie_well_i_t_just_let_3ee79a: "嗯，我不能随便让别人知道关于雪雪这么重要的事情。嗯……"
