  npc_override_wolfvill_quests_18_my_mother_asked_you_help_f3d384: "我母亲让你帮助{0}，所以这次我可能不能和你一起去。"
  npc_override_wolfvill_quests_18_my_name_course_s_bearded_ebba11: "我的名字？当然，是胡子杰克。"
  npc_override_wolfvill_quests_18_my_name_horim_b3bb5c: "我的名字是霍林。"
  npc_override_wolfvill_quests_18_my_name_s_all_afe14b: "我的名字是{0}，就这些。"
  npc_override_wolfvill_quests_18_my_perspective_c611e8: "从我的角度来看……"
  npc_override_wolfvill_quests_18_my_skin_feels_prickly_a40a31: "我的皮肤感到刺痛。"
  npc_override_wolfvill_quests_18_my_son_maram_help_task_e52003: "我儿子马兰会帮助我 earlier 要求的任务。"
  npc_override_wolfvill_quests_18_my_sorcerous_skills_also_136f3e: "我的巫术技能也会派上用场。"
  npc_override_wolfvill_quests_18_my_superiors_dismissed_a_02ad6a: "我的上级把它当作胡说八道，"
  npc_override_wolfvill_quests_18_naiman_s_dad_works_luksh_c8a95c: "奈曼的爸爸在卢克希的店里工作，卢克希的妈妈总是那样说。"
  npc_override_wolfvill_quests_18_names_animal_gods_story_f6d5c3: "但这个故事中动物神的名字与我小时候听到的相似，但有点不同。"
  npc_override_wolfvill_quests_18_natives_learn_things_lat_40e9b8: "原住民学东西慢，脾气暴躁。"
  npc_override_wolfvill_quests_18_navi_aisha_info_wolfvill_5d6df2: "<NAVI>[艾莎]<INFO>wolfvill,99,178,0,101,0</INFO></NAVI>一百天也没用吗？如果你能说服我，我会改变对你的看法。"
  npc_override_wolfvill_quests_18_navi_aisha_info_wolfvill_c63ec0: "<NAVI>[艾莎]<INFO>wolfvill,99,178,0,101,0</INFO></NAVI>，无论我对你说多少次，都不会有区别，对吧？如果我说服你，也可能改变我对你的看法。"
  npc_override_wolfvill_quests_18_navi_gray_wolf_forest_in_631538: "<NAVI>[灰狼森林]<INFO>gw_fild01,25,101,0,101,0</INFO></NAVI> 如果你四处看看，你会看到一堆陷阱……"
  npc_override_wolfvill_quests_18_navi_gray_wolf_forest_in_de453f: "<NAVI>[灰狼森林]<INFO>gw_fild01,25,101,0,101,0</INFO></NAVI>我想让你从陷阱里收集大约5个东西。"
  npc_override_wolfvill_quests_18_navi_over_there_info_wol_5e10be: "<NAVI>[那边]<INFO>wolfvill,144,151,0,101,0</INFO></NAVI>是你应该去的地方。也有冒险者的位置。"
  npc_override_wolfvill_quests_18_navi_people_info_wolfvil_acfce4: "<NAVI>[人们]<INFO>wolfvill,144,151,0,101,0</INFO></NAVI> 他们聚集在一起。冒险者们，快去！"
  npc_override_wolfvill_quests_18_necessary_before_wither_41861f: "- 不必要，在枯萎之前"
  npc_override_wolfvill_quests_18_neighborhood_lot_people_1ba33e: "这是一个有很多那种 outlook 的人的 neighborhood 吗？"
  npc_override_wolfvill_quests_18_neil_did_you_happen_see_92494d: "尼尔，你今天碰巧看到^e5555e马兰^000000了吗？"
  npc_override_wolfvill_quests_18_nevertheless_since_s_dec_a3828a: "尽管如此，既然是在比赛中决定的，我们应该尽可能合作。"
  npc_override_wolfvill_quests_18_newcomer_24b191: "这是新来的吗？"
  npc_override_wolfvill_quests_18_newcomer_who_just_arrive_f6807d: "这是刚到的那个新来的人吗？"
  npc_override_wolfvill_quests_18_next_go_grandma_shanina_fab5aa: "接下来，去沙妮娜奶奶家，听她的故事，然后写下来。"
  npc_override_wolfvill_quests_18_next_time_we_ll_definite_5d711b: "……下次，我们一定会成功！"
  npc_override_wolfvill_quests_18_nice_if_you_could_gather_dbd8fa: "如果你能收集大约5个从<NAVI>[灰狼森林]<INFO>gw_fild01,25,101,0,101,0</INFO></NAVI>的陷阱里抓到的东西就好了。"
  npc_override_wolfvill_quests_18_nice_if_you_listen_our_674c68: "如果你能听听我们的意见就好了……"
  npc_override_wolfvill_quests_18_nice_meet_you_64753c: "很高兴认识你。"
  npc_override_wolfvill_quests_18_nice_meet_you_judging_yo_18e40e: "很高兴认识你。从你的穿着来看，你一定是个冒险者！"
  npc_override_wolfvill_quests_18_nice_see_you_again_a75c4f: "很高兴再次见到你！"
  npc_override_wolfvill_quests_18_nice_see_you_e69ee3: "很高兴见到你！"
  npc_override_wolfvill_quests_18_niren_giving_you_much_tr_5f86c7: "尼伦给了你那么多信任来处理任务吗？"
  npc_override_wolfvill_quests_18_niren_please_call_me_bac_b77f06: "尼伦，委员会成立后请叫我回来。我会准备到那时候。"
  npc_override_wolfvill_quests_18_niren_seems_very_busy_4ee15f: "尼伦似乎很忙……"
  npc_override_wolfvill_quests_18_no_378519: "不……？"
  npc_override_wolfvill_quests_18_no_816c52: "不"
  npc_override_wolfvill_quests_18_no_9a4c18: "……不。"
  npc_override_wolfvill_quests_18_no_b8b9f1: "不。"
  npc_override_wolfvill_quests_18_no_boksil_calm_down_bit_1b6f1b: "不，博克西尔。冷静一下。哦天哪。如果你仍然表现得陌生会发生什么？不，我不是在对你说什么……让我们更亲近一点，好吗？"
  npc_override_wolfvill_quests_18_no_c03f1e: "不……"
  npc_override_wolfvill_quests_18_no_him_he_nothing_kind_1e81c6: "不，不是他！他对遇到的每个人只有善意的话语！他们不是那种人。你为什么要拿他和那些麻烦制造者比较？"
  npc_override_wolfvill_quests_18_no_i_didn_t_set_d54d0d: "不，我不是特意要回去……只是人就是这样，他们来这里是为了更好的生活，如果这里和那里一样，为什么他们不想留在更容易的地方……"
  npc_override_wolfvill_quests_18_no_i_guess_s_what_643227: "不，我猜那就是新来的人想要的？"
  npc_override_wolfvill_quests_18_no_i_hate_just_one_f53113: "不，我只讨厌一个人……只是一个人！"
  npc_override_wolfvill_quests_18_no_i_ll_just_become_7b6e9a: "不，我就变成狗吧。我也会把你的房子弄得一团糟，偶尔咬你一口。"
  npc_override_wolfvill_quests_18_no_i_m_completely_oppose_c3c353: "不，我并不完全反对年轻人的想法。"
  npc_override_wolfvill_quests_18_no_i_m_just_as_d4a944: "不，但我在这里和在那里一样都是外来者。那不是一样的吗？我不应该更舒服吗？"
  npc_override_wolfvill_quests_18_no_i_used_scholar_long_fb054d: "不！我曾经是学者。很久以前。"
  npc_override_wolfvill_quests_18_no_if_weren_t_your_5f9ca7: "不 {0}如果不是你的指示，我会彻底失败……"
  npc_override_wolfvill_quests_18_no_items_4f93ce: "没有物品？"
  npc_override_wolfvill_quests_18_no_joke_look_those_peopl_a213c5: "不开玩笑。看看那些人。不奇怪吗？那些 earlier 喊着要武装的人。"
  npc_override_wolfvill_quests_18_no_keep_750b5d: "不，留着它！"
  npc_override_wolfvill_quests_18_no_live_here_as_myself_24d778: "不，但作为我自己住在这里才是真正的生活。我在这里永远是陌生人，不是吗？"
  npc_override_wolfvill_quests_18_no_matter_how_much_we_1d4574: "但无论我们如何在心库附近加强安全，随着居民之间最近紧张的气氛，这实际上是入侵者猖獗的理想情况。"
  npc_override_wolfvill_quests_18_no_might_right_just_help_575cfe: "^0000ff 不，也许让卡米尔自己成长才是对的……^000000"
  npc_override_wolfvill_quests_18_no_miriam_if_you_say_bbe24f: "不，米里亚姆！如果你那样说，听起来好像我做错了什么。"
  npc_override_wolfvill_quests_18_no_my_decision_push_my_8d94e2: "不，是我决定违背学徒的意愿把他们推入探险的……"
  npc_override_wolfvill_quests_18_no_no_12ef1a: "不~ 不~"
  npc_override_wolfvill_quests_18_no_no_i_wouldn_t_506350: "不，不。我不会在见到你后就请求帮忙。"
  npc_override_wolfvill_quests_18_no_one_knows_what_he_17db9a: "没人知道他会用获得的伊米尔之心做什么。"
  npc_override_wolfvill_quests_18_no_our_store_hardware_st_a7a8ad: "不，我们的店是五金店，不是洗衣店。"
  npc_override_wolfvill_quests_18_no_s_like_you_brought_5d314e: "不，不是那样的。你把狼……带来了？在羊面前？你疯了吗？"
  npc_override_wolfvill_quests_18_no_s_necessary_3a5ba4: "不，没有必要……"
  npc_override_wolfvill_quests_18_no_s_pitiful_e0f157: "不！！！不可怜……"
  npc_override_wolfvill_quests_18_no_s_she_s_about_c81385: "……不，那是。她现在大约一个月大。她还是个婴儿，不可能训练。 "
  npc_override_wolfvill_quests_18_no_s_true_sigh_what_b941fd: "不，那是真的，但是……唉，我们该怎么办？"
  npc_override_wolfvill_quests_18_no_s_what_i_initially_4c5bc9: "不，但那就是我最初的目标。寻找我的根源……"
  npc_override_wolfvill_quests_18_no_there_isn_t_think_c52be2: "不，没有。仔细想想。我们为你报仇了。"
  npc_override_wolfvill_quests_18_no_time_1c20a2: "不，时间是……！"
  npc_override_wolfvill_quests_18_no_too_much_robbery_we_fb6643: "不，这太过分了。抢劫？我们瞄准了艾哈迈德的上层。"
  npc_override_wolfvill_quests_18_no_we_t_course_acting_5237ac: "不，我们不能。当然不行。不考虑未来就鲁莽行事，这是成年人该做的吗？"
  npc_override_wolfvill_quests_18_no_weaponry_incredibly_c_d95ebe: "不，武器非常酷。"
  npc_override_wolfvill_quests_18_no_what_so_you_re_5b37a1: "不，什么？所以你是说这是因为我们不认为它重要？我们不够好？"
  npc_override_wolfvill_quests_18_no_who_says_what_s_db9361: "不！谁说的？原住民和移民有什么区别！"
  npc_override_wolfvill_quests_18_no_why_those_young_peopl_1fa512: "不，为什么那些年轻人那样表现？"
  npc_override_wolfvill_quests_18_no_why_you_really_here_fee668: "不，你为什么真的在这里，长者。"
  npc_override_wolfvill_quests_18_no_wolf_cub_i_don_885c99: "不，这只狼崽，我认为它还没有训练好。"
  npc_override_wolfvill_quests_18_no_won_t_incident_needs_a2bb1f: "不，那不行。这件事必须变得不存在。卡米尔，你不能带头……"
  npc_override_wolfvill_quests_18_no_you_aren_t_kind_f6eddc: "不。你不是那种人。其他所有人，但绝不会是你。"
  npc_override_wolfvill_quests_18_no_you_aren_t_you_e6de47: "不，你是{0}不是吗？"
  npc_override_wolfvill_quests_18_no_you_know_when_i_d80ae7: "不！但你知道，当我想到它时，我们做错了什么？他们为什么要阻止我们？"
  npc_override_wolfvill_quests_18_no_you_won_t_die_02507d: "不，你不会死的。别说不吉利的话。"
  npc_override_wolfvill_quests_18_noise_seems_getting_loud_2aa3eb: "噪音似乎比以前更大了。"
  npc_override_wolfvill_quests_18_nonsense_adventurer_don_34dc7b: "……胡说。冒险者，不要太在意马兰的话。"
  npc_override_wolfvill_quests_18_north_02e036: "北方？"
  npc_override_wolfvill_quests_18_north_sealed_land_s_easy_a47118: "北方是一片被封印的土地。不容易穿过屏障。"
  npc_override_wolfvill_quests_18_now_a119af: "目前……"
  npc_override_wolfvill_quests_18_now_ahab_starting_listen_c31f2e: "现在阿哈布开始听人说话了……他毕竟似乎不是坏人。"
  npc_override_wolfvill_quests_18_now_all_necessary_person_6028fc: "既然所有必要的人员都到齐了，衣服也准备好了，让我解释一下计划。"
  npc_override_wolfvill_quests_18_now_even_dialogue_reconc_d02872: "现在，即使是和解的对话也不容易了……"
  npc_override_wolfvill_quests_18_now_even_they_reluctant_b0cd8d: "但现在，即使他们也不愿意卖了。"
  npc_override_wolfvill_quests_18_now_i_become_person_who_ca8e26: "现在我将成为一个能帮助别人的人。"
  npc_override_wolfvill_quests_18_now_i_buy_food_clothes_bd0857: "现在我可以为我的孩子买食物和衣服了。"
  npc_override_wolfvill_quests_18_now_i_no_regrets_left_f6a5c2: "现在我没有任何遗憾了。"
  npc_override_wolfvill_quests_18_now_i_really_resort_dras_591653: "但现在，我真的要采取极端措施吗？"
  npc_override_wolfvill_quests_18_now_i_relax_unwind_bit_ac4fee: "现在我可以放松一下，稍微 unwind 一下！"
  npc_override_wolfvill_quests_18_now_i_think_about_i_3998ce: "现在我想起来，我昨天也去了神殿。"
  npc_override_wolfvill_quests_18_now_if_you_combat_skills_a3438c: "目前，^e5555e如果你有战斗技能，你可以通过杀死怪物来通过，^000000但 later 可能不是关于战斗技能；^e5555e整个迷宫可能会被岩浆封锁。^000000"
  npc_override_wolfvill_quests_18_now_if_you_want_live_af3eb4: "现在，如果你想从现在开始住在这里，你必须融入。你必须遵守这里的规则，这样我们才能和谐相处。"
  npc_override_wolfvill_quests_18_now_important_matters_se_3fe9a4: "既然重要的事情已经解决了，让我们结束讨论。再次感谢你，{0}我真的很感激。这是我的一点心意。"
  npc_override_wolfvill_quests_18_now_just_standing_still_f1ec63: "现在，只是站着不动就感觉汗水直流。"
  npc_override_wolfvill_quests_18_now_let_s_begin_meeting_4720bd: "现在，让我们开始会议。"
  npc_override_wolfvill_quests_18_now_let_s_go_back_1d0fe6: "现在让我们回到幻觉的故事。"
  npc_override_wolfvill_quests_18_now_let_s_retrieve_all_ae65a3: "目前，让我们取回所有武器，等马兰和米里亚姆回来后与他们讨论未来计划。"
  npc_override_wolfvill_quests_18_now_path_external_path_s_af0601: "目前，这条路是^e5555e外部路径^000000，所以我们只需要直走。"
  npc_override_wolfvill_quests_18_now_please_escort_along_bbce30: "从现在开始，请护送{0}和米里亚姆和塔马林一起去位于西边的^e5555e奥兹峡谷^000000。"
  npc_override_wolfvill_quests_18_now_s_hard_find_any_0e46ce: "现在很难找到任何工作……"
  npc_override_wolfvill_quests_18_now_s_our_turn_speak_3128a9: "现在轮到我们发言了！"
  npc_override_wolfvill_quests_18_now_suad_saying_we_shoul_e50041: "但现在苏阿德说我们不应该做。"
  npc_override_wolfvill_quests_18_now_surface_s_fine_we_28fae4: "现在，表面上……没问题，我们有一堆政策。但在下面，它在溃烂，在溃烂……"
  npc_override_wolfvill_quests_18_now_they_ve_seen_their_4548ee: "既然他们亲眼看到了，他们的想法就不同了。那很好。现在，让我们完成我们开始的事情，好吗？"
  npc_override_wolfvill_quests_18_now_time_take_back_d08a7e: "现在是收回它的时候了！"
  npc_override_wolfvill_quests_18_now_waterways_well_maint_0bfb15: "既然水道维护得很好，需求量就不那么高了~"
  npc_override_wolfvill_quests_18_now_we_re_all_living_8b6263: "现在我们都一起生活。有温暖的庇护所和美味的食物。"
  npc_override_wolfvill_quests_18_now_we_re_working_togeth_a28ef8: "既然我们一起工作，从现在开始请叫我梅杰经理。我也会确保尊重你作为团队成员，而不仅仅是先生。"
  npc_override_wolfvill_quests_18_now_we_ve_gathered_all_0730a6: "既然我们已经召集了所有必要的人员并准备好了衣服，让我解释一下计划。"
  npc_override_wolfvill_quests_18_now_we_ve_mapped_out_e06905: "现在我们已经规划好了你所有的巡逻路线。做好准备。"
  npc_override_wolfvill_quests_18_now_we_weapons_too_3b8bd3: "既然我们现在也有武器了。"
  npc_override_wolfvill_quests_18_now_we_working_together_00e4bc: "既然我们一起工作，从现在开始请叫我梅杰社长。我也会尊重你作为员工。"
  npc_override_wolfvill_quests_18_obirerger_sauce_8de0a2: "奥比雷格酱"
  npc_override_wolfvill_quests_18_oh_5235ff: "哦！"
  npc_override_wolfvill_quests_18_oh_78a2fc: "哦……"
  npc_override_wolfvill_quests_18_oh_boksil_like_complimen_db317c: "哦，博克西尔不喜欢被表扬吗？好吧，好吧。"
  npc_override_wolfvill_quests_18_oh_come_look_my_disappoi_9fa1c7: "哦，来吧，看看我失望的脸。我无能为力。今天，跟我来。好吧，再见，冒险者！"
  npc_override_wolfvill_quests_18_oh_course_i_ll_make_d2f262: "哦，当然，我会确保你今天的工作也得到报酬。"
  npc_override_wolfvill_quests_18_oh_course_what_comes_out_d732dd: "哦，当然，从他们嘴里说出来的不是真相。只是说说而已，就这些。"
  npc_override_wolfvill_quests_18_oh_dear_i_need_give_f5b1e2: "哦天哪，我需要把这个给你。"
  npc_override_wolfvill_quests_18_oh_did_you_buy_cucumber_b8e44b: "哦，你买黄瓜酱了吗？让我看看。 "
  npc_override_wolfvill_quests_18_oh_did_you_hear_me_9b5853: "哦，你听到我说话了吗，对不起。"
  npc_override_wolfvill_quests_18_oh_don_t_touch_our_e2aca0: "哦，不要碰我们的博克西尔！她不喜欢！"
  npc_override_wolfvill_quests_18_oh_don_t_worry_about_ae66c0: "哦，别担心，冒险者。这是与原住民的古老仪式问题。"
  npc_override_wolfvill_quests_18_oh_hello_359d72: "哦……你好……"
  npc_override_wolfvill_quests_18_oh_hmm_yes_i_see_ccd6bb: "哦……嗯。是的，我明白了。看起来我们将比原定计划晚两天出发。"
  npc_override_wolfvill_quests_18_oh_ho_welcome_grey_wolf_b810db: "哦嗬！欢迎来到灰狼村。"
  npc_override_wolfvill_quests_18_oh_how_noble_you_3280a6: "哦，你真高尚。"
  npc_override_wolfvill_quests_18_oh_i_confidently_say_suc_35d7f3: "哦……我可以自信地说，这种东西在市场上不容易找到。"
  npc_override_wolfvill_quests_18_oh_i_heard_you_said_4385c0: "哦，我听说你说这里很和平，所以你帮了我的忙。"
  npc_override_wolfvill_quests_18_oh_i_know_what_they_9445b1: "哦，我知道那是什么！他们在伤口上涂了未知的药膏！"
  npc_override_wolfvill_quests_18_oh_i_m_busy_right_3bee24: "哦，我现在很忙。我们以后再谈。"
  npc_override_wolfvill_quests_18_oh_i_need_talk_about_4658e4: "哦，我需要谈谈吗？"
  npc_override_wolfvill_quests_18_oh_i_sometimes_heard_fai_012d53: "哦……我有时在某个地方听到微弱的呻吟声，就是这里吗？"
  npc_override_wolfvill_quests_18_oh_i_ve_been_looking_b67741: "哦，我一直在找一个更好的冶炼箱。"
  npc_override_wolfvill_quests_18_oh_isha_brought_back_bab_02da1e: "哦！伊莎不久前从森林里带回了一只灰狼幼崽！我们叫她把它带回树林，她甚至不听！"
  npc_override_wolfvill_quests_18_oh_last_story_wasn_t_bea419: "哦，上一个故事还没讲完，是吗？我的记忆有点模糊。"
  npc_override_wolfvill_quests_18_oh_my_4cc4a4: "哦天哪~"
  npc_override_wolfvill_quests_18_oh_my_a6fbfc: "哦天哪……！"
  npc_override_wolfvill_quests_18_oh_my_aren_t_you_743078: "哦，天哪！你不是冒险者吗！"
  npc_override_wolfvill_quests_18_oh_my_everyone_running_a_3e11f4: "哦天哪！大家都在逃跑！"
  npc_override_wolfvill_quests_18_oh_my_how_come_i_e08306: "哦天哪，怎么会？我一条腿完全不能用，但我还好。"
  npc_override_wolfvill_quests_18_oh_my_i_think_i_d53ae6: "哦天哪，我想我要死了。救命……"
  npc_override_wolfvill_quests_18_oh_my_look_him_breathing_efc5f8: "哦天哪，看看他的呼吸。我们的小狗不可爱吗？"
  npc_override_wolfvill_quests_18_oh_my_look_look_way_60352f: "哦天哪，看看这个！看看他们的呼吸方式。他们是吸气和呼气的天才！真正的天才！"
  npc_override_wolfvill_quests_18_oh_my_name_mejai_see_1730f6: "哦！我的名字是梅杰。再见。"
  npc_override_wolfvill_quests_18_oh_my_salty_s_salty_0f80f8: "哦天哪，咸。好咸。"
  npc_override_wolfvill_quests_18_oh_my_we_re_those_c1b247: "哦天哪，我们不是那种人。"
  npc_override_wolfvill_quests_18_oh_no_a0af63: "哦，不！！！"
  npc_override_wolfvill_quests_18_oh_no_a21668: "哦，不！"
  npc_override_wolfvill_quests_18_oh_no_camille_you_rascal_13dc42: "哦不！卡米尔，你这个淘气鬼！现在不是你说话的时候！"
  npc_override_wolfvill_quests_18_oh_no_no_no_adventurer_ec22dc: "哦，不，不，不！这里的冒险者正试图帮助我……"
  npc_override_wolfvill_quests_18_oh_no_wait_moment_e9f2ee: "哦不！！！等一下！"
  npc_override_wolfvill_quests_18_oh_no_why_earth_b11e06: "哦不……到底为什么……？"
  npc_override_wolfvill_quests_18_oh_no_you_re_so_448238: "哦不~ 你这么~ 拼命地~ 求我！！所以，我忍不住……"
  npc_override_wolfvill_quests_18_oh_oh_oh_5b7c96: "哦，哦哦。"
  npc_override_wolfvill_quests_18_oh_okay_okay_i_ll_544bda: "哦，好吧，好吧。我会集中注意力的。"
  npc_override_wolfvill_quests_18_oh_one_tip_i_should_d65601: "哦！我应该提到的一个技巧是，你使用我提供的方法采集花朵的时间越长，它们持续的时间就越长。"
  npc_override_wolfvill_quests_18_oh_our_opinions_ba4300: "哦，我们的意见？"
  npc_override_wolfvill_quests_18_oh_person_carriage_wheel_8c8caa: "哦，这个人。马车车轮不像木椅什么的……不，这可能吗？"
  npc_override_wolfvill_quests_18_oh_quickly_06bb35: "哦，这么快？"
  npc_override_wolfvill_quests_18_oh_right_you_get_rid_84c08d: "哦对了！你可以为我们的女神消灭怪物！"
  npc_override_wolfvill_quests_18_oh_s_63f47e: "哦！！！！就是这样！！！！"
  npc_override_wolfvill_quests_18_oh_s_actually_great_sugg_ea7a3d: "哦？那其实是个很好的建议。这将是一次非常有建设性的对话。但我该怎么办？我必须整理我带来的东西。"
  npc_override_wolfvill_quests_18_oh_s_good_suggestion_if_588791: "哦，那是个好建议。如果外来者在没有人知道的情况下 discreetly 解决它，事件本身可能被视为不存在……"
  npc_override_wolfvill_quests_18_oh_s_he_around_here_e8747e: "哦，不是那样的。他不是来自这里。他来自一个完全不同的地方。他这次帮忙采购货物，他们一路把它们运到了这里。"
  npc_override_wolfvill_quests_18_oh_s_kind_nice_dd9090: "哦，那挺好的。"
  npc_override_wolfvill_quests_18_oh_s_right_i_promised_306811: "哦，对了。我答应过古德拉奶奶！"
  npc_override_wolfvill_quests_18_oh_s_still_there_96ceec: "哦！它还在那里！"
  npc_override_wolfvill_quests_18_oh_someone_new_you_resid_d492b5: "哦，新来的人。你是这里的居民吗？"
  npc_override_wolfvill_quests_18_oh_sorry_joke_678687: "哦，对不起~ 这是个玩笑。"
  npc_override_wolfvill_quests_18_oh_suad_miriam_maram_her_944440: "哦？苏阿德！米里亚姆和马兰也在这里。"
  npc_override_wolfvill_quests_18_oh_suddenly_became_tempo_b3edc4: "哦……突然变成了临时牧羊人，嗯……？谢谢。我有很多事要做。我能帮什么忙？"
  npc_override_wolfvill_quests_18_oh_then_who_stole_guest_d24a0d: "哦！但是，谁偷了客人的钱包？如果我也偷了那个，我会感觉更公平。"
  npc_override_wolfvill_quests_18_oh_there_after_all_baa813: "哦……毕竟，它在那里。"
  npc_override_wolfvill_quests_18_oh_there_s_no_meat_bfb4ca: "哦……！没有肉可以作为零食，肉……我需要带些肉。"
