Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_wolfvill_quests_18_aaaaaah_i_m_dying_f3e31f: "啊啊啊！！！我要死了！！！"
  npc_override_wolfvill_quests_18_about_800b4c: "关于那个……"
  npc_override_wolfvill_quests_18_about_intruder_fa736f: "关于那个入侵者。"
  npc_override_wolfvill_quests_18_about_manners_ahab_df2cc4: "这是关于礼貌的问题，阿哈布。"
  npc_override_wolfvill_quests_18_about_villa_6a7b1f: "还有关于那座别墅。"
  npc_override_wolfvill_quests_18_above_all_fact_i_closest_2e1717: "最重要的是，我离得最近却仍然没有注意到，这是最糟糕的……"
  npc_override_wolfvill_quests_18_accept_3e1999: "接受。"
  npc_override_wolfvill_quests_18_accept_bb54db: "接受"
  npc_override_wolfvill_quests_18_accept_request_2bcb4c: "接受请求"
  npc_override_wolfvill_quests_18_access_prohibited_except_34b12b: "除官员外，禁止进入。"
  npc_override_wolfvill_quests_18_accident_8c120c: "事故？"
  npc_override_wolfvill_quests_18_accompanying_currently_p_aef380: "目前无法陪同。请检查您的陪同队友是否已申请副本。"
  npc_override_wolfvill_quests_18_accumulate_wealth_i_now_66f5a9: "为了积累我现在的财富，我一直采取战略性和务实性的行动。"
  npc_override_wolfvill_quests_18_accustoming_your_body_co_977fc6: "让身体习惯舒适会让不舒适的生活变得难以忍受。在他们提供的最低限度生活中知足常乐。"
  npc_override_wolfvill_quests_18_ackoooo_welcome_freyja_s_0fbbc7: "啊呜！欢迎！愿芙蕾雅的祝福与你同在！"
  npc_override_wolfvill_quests_18_actually_672c01: "其实……"
  npc_override_wolfvill_quests_18_actually_font_size_b_mer_8e417e: "其实，<FONT SIZE = 14><B>这位商人</FONT></B>才是。"
  npc_override_wolfvill_quests_18_actually_i_didn_t_think_128d14: "其实，我并不认为有必要加薪，但我更讨厌和丈夫吵架。"
  npc_override_wolfvill_quests_18_actually_i_heard_group_r_5a6d95: "其实，我听说那群人袭击了移民者的总部。他们把总部的东西都拿走了。"
  npc_override_wolfvill_quests_18_actually_i_m_here_6614c4: "其实，我是来……"
  npc_override_wolfvill_quests_18_actually_miriam_i_helpin_e6063e: "其实，米里亚姆和我在^e5555e帮助另一个地区挣扎的原住民^000000。"
  npc_override_wolfvill_quests_18_add_grams_77f8e3: "加2克。"
  npc_override_wolfvill_quests_18_advanced_stages_however_43b337: "然而，在高级阶段，茎的切割角度、根据半花盛开位置去除的叶子数量，以及容器中水和秘粉的量可能会有所不同……"
  npc_override_wolfvill_quests_18_adventurer_2439c4: "冒险者？"
  npc_override_wolfvill_quests_18_adventurer_a643af: "冒险者。"
  npc_override_wolfvill_quests_18_adventurer_c303ce: "冒险者……"
  npc_override_wolfvill_quests_18_adventurer_help_you_righ_7571bc: "冒险者会帮你的，对吧？"
  npc_override_wolfvill_quests_18_adventurer_here_taken_ca_c4569d: "这位冒险者已经处理好了马车车轮。请代我们表示感谢。"
  npc_override_wolfvill_quests_18_adventurer_hold_second_5c4cd9: "冒险者，等一下。"
  npc_override_wolfvill_quests_18_adventurer_how_about_hea_629ba4: "冒险者，来之前先听听大家的意见怎么样？"
  npc_override_wolfvill_quests_18_adventurer_how_s_going_i_c379ec: "冒险者，进展如何，我可以开始施工了吗？"
  npc_override_wolfvill_quests_18_adventurer_i_am_responsi_7db3a9: "冒险者。我负责这次攀登。如果冒险者解决了马车车轮的问题，我们会根据我们氏族的愿景，支付冒险者相应的经验值"
  npc_override_wolfvill_quests_18_adventurer_i_came_time_o_f69b2f: "冒险者，我准时来赴约了。但艾莎没有出现……"
  npc_override_wolfvill_quests_18_adventurer_leave_find_he_5417a8: "然后冒险者会离开去寻找心。"
  npc_override_wolfvill_quests_18_adventurer_marum_miriam_597cae: "冒险者，马鲁姆，还有米里亚姆。除了少数例外，我们暂时解散。"
  npc_override_wolfvill_quests_18_adventurer_me_favor_we_r_73669a: "冒险者，帮我个忙，我们这里真的需要一个现代化的诊所，即使不如拉赫的那个大。"
  npc_override_wolfvill_quests_18_adventurer_please_come_u_533c62: "冒险者，请跟我们来！"
  npc_override_wolfvill_quests_18_adventurer_since_you_re_e8e77e: "冒险者，既然你很强，有空的时候愿意陪我去^e5555e奥兹迷宫^000000吗？"
  npc_override_wolfvill_quests_18_adventurer_thank_you_so_9d7fb2: "冒险者，非常感谢你的帮助。这是我安顿下来时得到的，我什么都不需要……作为感谢，我把它送给你，冒险者。"
  npc_override_wolfvill_quests_18_adventurer_then_please_g_f55a07: "冒险者，那么，请安全地去安全地回！我也先告辞了！"
  npc_override_wolfvill_quests_18_adventurer_what_did_you_b2bcb2: "冒险者，你之前在塞斯鲁尼尔神殿说了什么？"
  npc_override_wolfvill_quests_18_adventurer_why_you_retur_a06df3: "冒险者？你怎么已经回来了？你不是和米里亚姆一起去调查武器的来源了吗？"
  npc_override_wolfvill_quests_18_adventurer_why_you_think_288a92: "冒险者，你为什么想这么深？"
  npc_override_wolfvill_quests_18_adventurer_you_ever_dbb992: "冒险者，你有没有……"
  npc_override_wolfvill_quests_18_adventurer_you_mind_catc_07ed90: "冒险者，你介意只帮我抓30只{0}吗？"
  npc_override_wolfvill_quests_18_adventurer_you_re_back_954922: "冒险者，你回来了。"
  npc_override_wolfvill_quests_18_adventurer_you_smell_lik_c60ef4: "冒险者，你闻起来像火山灰。"
  npc_override_wolfvill_quests_18_adventurer_you_ve_done_u_734759: "冒险者，你又一次帮了我们大忙。"
  npc_override_wolfvill_quests_18_adventurer_you_ve_worked_35423b: "冒险者，辛苦了。我想我们的狗也很满意。用餐愉快吗？那么，请明天再来试试！"
  npc_override_wolfvill_quests_18_adventurer_you_ve_worked_a48206: "冒险者，辛苦了。我一直很感激。今天我要休息一下，黎明后再见！"
  npc_override_wolfvill_quests_18_adventurers_participate_8ca93e: "冒险者也能参加活动吗？"
  npc_override_wolfvill_quests_18_adventurers_who_already_7798f5: "已经完成过的冒险者只能陪同其他冒险者进入。"
  npc_override_wolfvill_quests_18_adventures_investigate_v_374539: "冒险者们，和米里亚姆一起调查别墅。"
  npc_override_wolfvill_quests_18_after_all_what_i_living_f724a0: "毕竟，这就是我的生计。"
  npc_override_wolfvill_quests_18_after_retreating_frontli_5f94f3: "从那件事从前线撤退后，他一直在背后策划这样的事情。"
  npc_override_wolfvill_quests_18_after_setback_my_deputy_6591bb: "挫折之后，我那一直萎靡不振的副手突然恢复了活力，变得热情起来。从那以后，阿鲁纳菲尔特的原住民和移民之间的紧张关系逐渐升级。"
  npc_override_wolfvill_quests_18_after_working_together_y_f09c0b: "但一起工作之后，你会亲眼看到的。"
  npc_override_wolfvill_quests_18_after_you_go_grandma_sha_069923: "之后，你可以去夏妮娅奶奶那里，把她的故事写下来。"
  npc_override_wolfvill_quests_18_after_you_loose_some_wei_468fb8: "- 等你减点肥之后。-"
  npc_override_wolfvill_quests_18_after_you_ve_hunted_them_c14563: "等你全部狩猎完毕后，请回来告诉我。我会为你准备一份小奖励！"
  npc_override_wolfvill_quests_18_ah_2d0cf1: "啊~"
  npc_override_wolfvill_quests_18_ah_971301: "啊……"
  npc_override_wolfvill_quests_18_ah_adventurer_1353b7: "……啊，冒险者。"
  npc_override_wolfvill_quests_18_ah_alright_anyway_suad_s_bb03d2: "啊，好吧！不管怎样，苏阿德似乎很担心。"
  npc_override_wolfvill_quests_18_ah_before_becomes_troubl_e8d6ec: "啊，在变得麻烦之前，我们撤吧。"
  npc_override_wolfvill_quests_18_ah_cf07cb: "啊！"
  npc_override_wolfvill_quests_18_ah_course_adventurer_you_c316e2: "啊，当然！冒险者！你愿意去吗？探索这个地方，欣赏风景，也许还能给当地人留下深刻印象。"
  npc_override_wolfvill_quests_18_ah_difficult_right_now_s_164ea2: "啊，现在很难吗？没关系，我们可以以后再做。"
  npc_override_wolfvill_quests_18_ah_fists_flying_fists_fl_6cad75: "啊，拳头乱飞，拳头乱飞。尽管来打我试试。"
  npc_override_wolfvill_quests_18_ah_grodra_s_errand_you_8e6ee6: "啊，格罗德拉的差事？你是来听一个古老的故事的，不是吗？"
  npc_override_wolfvill_quests_18_ah_hiding_things_doesn_t_1f3cd5: "啊，藏东西不适合我的本性，我就直说了。"
  npc_override_wolfvill_quests_18_ah_i_am_priest_junok_d0bbe9: "啊，我是朱诺克祭司。这次我回到了塞斯鲁尼尔。"
  npc_override_wolfvill_quests_18_ah_i_gave_him_some_5eda9d: "啊……我给了他在金钱上的一些自由，但我没有给他太多自由，所以相当满意。我以为会持续下去。"
  npc_override_wolfvill_quests_18_ah_i_got_little_excited_870b69: "啊……我有点激动了。每次我爸说起这个，都让我压力很大。"
  npc_override_wolfvill_quests_18_ah_i_knew_you_come_b8653f: "啊，我就知道你会来参加比赛的。"
  npc_override_wolfvill_quests_18_ah_i_know_so_what_bba7cd: "啊……我知道！那又怎样！"
  npc_override_wolfvill_quests_18_ah_i_m_hungry_thirsty_0779d7: "啊，我玩饿了也玩渴了。"
  npc_override_wolfvill_quests_18_ah_i_see_since_i_22d1b1: "啊……我明白了。既然我听了你的建议。"
  npc_override_wolfvill_quests_18_ah_i_see_you_re_5f7270: "啊……我明白了……你很忙。好吧，那也没办法。"
  npc_override_wolfvill_quests_18_ah_last_time_you_went_0ef8b8: "啊，上次你去山顶的时候，不是吗？"
  npc_override_wolfvill_quests_18_ah_oiger_sauce_let_me_4149e0: "啊，奥伊格酱！让我看看……在这里。"
  npc_override_wolfvill_quests_18_ah_outsider_5c0411: "啊，一个外来者……"
  npc_override_wolfvill_quests_18_ah_right_outsiders_often_1cb872: "啊，对了！外来者经常喜欢这些东西。你喜欢吗，冒险者？即使你不喜欢，你也可以和喜欢的人交换。带上它吧。"
  npc_override_wolfvill_quests_18_ah_s_troubling_there_s_95c771: "啊，真麻烦。有个烦人的问题。"
  npc_override_wolfvill_quests_18_ah_seems_there_various_r_f9b465: "啊~ 看来关于我的各种负面谣言正在流传，对吧？"
  npc_override_wolfvill_quests_18_ah_seriously_because_i_m_2d6b41: "啊，说真的，因为我是个为生计奔波的人。"
  npc_override_wolfvill_quests_18_ah_size_doesn_t_matter_916b5b: "啊，大小不重要。"
  npc_override_wolfvill_quests_18_ah_um_bf88a3: "啊……嗯……"
  npc_override_wolfvill_quests_18_ah_unlucky_isn_t_dealing_c8fdf7: "啊……真不走运，不是吗？和一个区区原住民打交道。"
  npc_override_wolfvill_quests_18_ah_well_007c8b: "啊，好吧……"
  npc_override_wolfvill_quests_18_ah_why_i_talk_only_741fb4: "啊，为什么我只能和冒险者谈论这个？"
  npc_override_wolfvill_quests_18_ah_you_quite_interesting_164c0e: "啊……你有一个相当有趣的技能，不是吗？"
  npc_override_wolfvill_quests_18_ah_you_re_ones_who_bbd1a0: "啊，你们就是上次来找我母亲的人。"
  npc_override_wolfvill_quests_18_ah_your_name_so_dandelio_f405c2: "啊，你的名字是……所以，是蒲公英。"
  npc_override_wolfvill_quests_18_ahab_ahab_no_you_boastin_c04ff6: "阿哈布？阿哈布？不，你是因为跑了个腿就在炫耀吗！"
  npc_override_wolfvill_quests_18_ahem_enough_since_depart_8f9e40: "咳，够了。既然出发延迟了，去准备重新出发吧。"
  npc_override_wolfvill_quests_18_ahem_hmm_efc360: "咳……嗯"
  npc_override_wolfvill_quests_18_ahhh_if_only_we_had_556f7f: "啊啊……如果我们有合适的装备……我本可以做得更快……没办法。"
  npc_override_wolfvill_quests_18_aisha_why_you_here_did_633dd7: "艾莎？你为什么在这里？你是来还狼的吗？"
  npc_override_wolfvill_quests_18_aja_aja_987aaa: "加油，加油！"
  npc_override_wolfvill_quests_18_alas_you_ve_heard_rumors_2f9640: "唉，你已经听到谣言了~"
  npc_override_wolfvill_quests_18_aligns_roughly_time_when_55878e: "那大致与猎心者从宅邸逃脱的时间一致。"
  npc_override_wolfvill_quests_18_all_adventurers_thanks_y_ab1190: "所有冒险者，多亏你们。"
  npc_override_wolfvill_quests_18_all_noise_monsters_makin_50e6bd: "最近怪物闹得这么凶，我以为可能有人遇到危险了，就下来查看。"
  npc_override_wolfvill_quests_18_all_temples_like_temple_04c94a: "所有像芙蕾雅神殿这样的神殿都必须被摧毁！"
  npc_override_wolfvill_quests_18_all_you_check_horim_doin_45a9f6: "你所要做的就是确认霍林是否安好。"
  npc_override_wolfvill_quests_18_alone_unforgivable_he_al_18b1c8: "仅此一点就不可原谅，但他还为此让神和无辜的人遭受痛苦。"
  npc_override_wolfvill_quests_18_already_gone_let_s_catch_ccfda5: "已经走了。我们去追阿什林！！"
  npc_override_wolfvill_quests_18_alright_a5b0b1: "好吧！"
  npc_override_wolfvill_quests_18_alright_calm_down_ira_7ccbc6: "好吧，冷静点，艾拉。"
  npc_override_wolfvill_quests_18_alright_i_ll_open_storag_e55f80: "好吧，我来打开仓库。"
  npc_override_wolfvill_quests_18_alright_i_ll_sell_you_745bf0: "好吧。我会以合理的价格卖给你任何东西。"
  npc_override_wolfvill_quests_18_alright_i_m_sorry_af33ef: "好吧……对不起。"
  npc_override_wolfvill_quests_18_alright_let_me_explain_q_d793ed: "好吧。让我快速解释一下。"
  npc_override_wolfvill_quests_18_alright_let_s_hear_your_040d08: "好吧，那让我们听听你宝贵的话吧！"
  npc_override_wolfvill_quests_18_alright_let_s_stop_s_294ed3: "好吧，我们停吧。真可怜~ 别再说我们没钱了。"
  npc_override_wolfvill_quests_18_alright_now_s_settled_le_c3a65d: "好吧，既然已经解决了，我们快点。我们在<NAVI>[神殿前]<INFO>rachel,169,245,0,101,0</INFO></NAVI>见面"
  npc_override_wolfvill_quests_18_alright_shall_we_go_work_905b7e: "好吧。我们去工作吧，冒险者？"
  npc_override_wolfvill_quests_18_alright_situation_countr_b07e0c: "好吧。这个国家的情况实际上超出了我的了解范围，但似乎解决得很好。"
  npc_override_wolfvill_quests_18_alright_then_3ea654: "那好吧。"
  npc_override_wolfvill_quests_18_alright_you_need_go_thro_1614c8: "好吧。你需要穿过那些树之间的缝隙。"
  npc_override_wolfvill_quests_18_also_story_our_grandfath_8e2999: "这也是我们祖父告诉我们的故事，有些神仍然……"
  npc_override_wolfvill_quests_18_although_everyone_could_17816a: "虽然不是每个人都能参加这次聚会，但我真心感谢那些能来参加并照亮这个场合的人。"
  npc_override_wolfvill_quests_18_although_looks_fine_ther_ef7f0f: "^0000ff虽然看起来没问题，但有一个磨损的马车轮子……^000000"
  npc_override_wolfvill_quests_18_although_my_boss_pretend_944938: "虽然我的老板假装听我的，但如果是像你这样的著名冒险者的建议，我想他会注意的。"
  npc_override_wolfvill_quests_18_although_s_called_discri_919f13: "虽然它被称为^e5555e歧视与迫害^000000，但实际上，它几乎就像从^e5555e强硬派或极端分子^000000手中逃脱。"
  npc_override_wolfvill_quests_18_although_time_passes_bui_89c827: "虽然时间流逝，建筑消失，但冒险者的意志将永存。"
  npc_override_wolfvill_quests_18_am_i_alive_am_i_f58886: "我还活着吗？？我还活着吗？？我的腿还好吗？？"
  npc_override_wolfvill_quests_18_amethyst_shop_c64390: "紫水晶店？"
  npc_override_wolfvill_quests_18_amira_s_stories_include_2c7b79: "阿米拉的故事中包含许多对我来说也很熟悉的神话。"
  npc_override_wolfvill_quests_18_among_gray_wolves_gray_w_211835: "在灰狼森林的灰狼中，有一只看起来像是首领……"
  npc_override_wolfvill_quests_18_among_locals_pride_no_on_903223: "在当地人中，没有人比我更成功是一种骄傲。"
  npc_override_wolfvill_quests_18_amount_acceptable_store_49368f: "这个数量在这家店可以接受吗？"
  npc_override_wolfvill_quests_18_amount_just_right_937efa: "数量刚刚好！"
  npc_override_wolfvill_quests_18_analysis_results_indicat_74233d: "分析结果表明，储存的火药和无人管理的武器的风险约为9.72%。"
  npc_override_wolfvill_quests_18_anything_s_fine_just_hun_99228b: "什么都可以。就在附近狩猎一些怪物吧。"
  npc_override_wolfvill_quests_18_anyway_even_though_s_ser_c9efd7: "不管怎样，虽然是服务，但听说会在出发前不久送达，我想我还是去^e5555e山顶^000000直接检查一下。"
  npc_override_wolfvill_quests_18_anyway_i_ll_tell_you_933737: "不管怎样，我会告诉你下一个故事。"
  npc_override_wolfvill_quests_18_anyway_i_m_glad_there_0dce27: "不管怎样，很高兴似乎有一些妥协。"
  npc_override_wolfvill_quests_18_anyway_i_need_talk_villa_6888f5: "不管怎样……我需要和村民谈谈幼崽的事。我们的小家伙安全了！走吧，小幼崽！"
  npc_override_wolfvill_quests_18_anyway_i_promised_tell_s_5d4dfc: "不管怎样，我答应过在来到灰狼森林之前，把从祖父那里听到的故事讲给你们听。"
