  npc_override_wolfvill_quests_18_s_entirely_my_liking_see_578a75: "不完全合我的意，但……那似乎就是共识。"
  npc_override_wolfvill_quests_18_s_even_more_dangerous_do_29e18f: "下面更危险，所以我们真的要小心。"
  npc_override_wolfvill_quests_18_s_exactly_pleasant_feeli_a6e2f9: "感觉不太舒服，但……"
  npc_override_wolfvill_quests_18_s_fermented_food_made_st_18d61e: "这是用我曾曾祖父时代传下来的发酵剂制作的发酵食品。"
  npc_override_wolfvill_quests_18_s_fine_we_re_still_45bd90: "没关系。但我们还缺一些东西，比如钢铁和非常不寻常的晶体。"
  npc_override_wolfvill_quests_18_s_first_time_i_ve_8cbfbe: "我还是第一次听说这种事……"
  npc_override_wolfvill_quests_18_s_gods_d55e6b: "那不是神的旨意。"
  npc_override_wolfvill_quests_18_s_good_c416bb: "那很好。"
  npc_override_wolfvill_quests_18_s_good_investigate_maze_46dda9: "调查迷宫是好事，但要注意身体。"
  npc_override_wolfvill_quests_18_s_good_quick_answer_6944af: "回答爽快是好事。"
  npc_override_wolfvill_quests_18_s_good_too_how_about_3b37f7: "那也很好，但不如直接帮我们联系供应商？"
  npc_override_wolfvill_quests_18_s_gotten_pretty_ugly_com_2beb5a: "和以前相比，变得相当糟糕了。"
  npc_override_wolfvill_quests_18_s_here_f0201a: "就在这里。"
  npc_override_wolfvill_quests_18_s_hot_706fc8: "好热！"
  npc_override_wolfvill_quests_18_s_hot_i_want_go_d794af: "好热……我想回家。"
  npc_override_wolfvill_quests_18_s_i_ll_counting_you_4d7737: "是30个{0}。拜托你了。"
  npc_override_wolfvill_quests_18_s_i_ve_never_been_d95c06: "虽然……我从没去过那里，但有人进我工作的地方时身上带着那种气味。"
  npc_override_wolfvill_quests_18_s_important_occasion_mar_699272: "这是个重要的场合。玛拉姆，不要像平时那样。"
  npc_override_wolfvill_quests_18_s_important_too_isn_t_6ad43f: "那也很重要，不是吗？我明白了。"
  npc_override_wolfvill_quests_18_s_impossible_get_fresh_f_0ff0e8: "在这附近弄到鲜花并非不可能。虽然罕见，但有办法获得。"
  npc_override_wolfvill_quests_18_s_inevitable_we_re_bit_136975: "由于年龄差距，我们和你有些不同是不可避免的~"
  npc_override_wolfvill_quests_18_s_interesting_there_quit_88b100: "真有趣。戴面具的人还挺多的。看来即使我们都有一样的脸，我们也能区分彼此。"
  npc_override_wolfvill_quests_18_s_issue_091482: "那不是问题所在。"
  npc_override_wolfvill_quests_18_s_just_disgusting_c96d2f: "太恶心了！"
  npc_override_wolfvill_quests_18_s_just_he_s_last_3e2790: "只是因为他最后才进来，所以顺序就是这样。"
  npc_override_wolfvill_quests_18_s_just_someone_like_me_f974ab: "只是像我这样的人拥有不同的时间价值。"
  npc_override_wolfvill_quests_18_s_just_us_who_bothered_7170a0: "受困扰的不只是我们，所以如果我们提议，会被接受的。"
  npc_override_wolfvill_quests_18_s_like_we_haven_t_8eb8e1: "我们并非毫无准备。我们一直在拉赫逐步转移，隐藏起来，时机成熟时可以从神殿加入。"
  npc_override_wolfvill_quests_18_s_lord_niren_s_son_e99751: "是尼伦大人的儿子！"
  npc_override_wolfvill_quests_18_s_made_temple_4ac109: "是在神殿里做的~"
  npc_override_wolfvill_quests_18_s_master_i_tried_recruit_561db6: "那是……师父，我试着招募旅伴，但没有人自愿。"
  npc_override_wolfvill_quests_18_s_more_like_hideout_wher_8eaeb8: "与其说是个村子，不如说是从拉赫逃出来的人藏身的^e5555e据点^000000。"
  npc_override_wolfvill_quests_18_s_necessary_facility_248495: "但这是必要的设施。"
  npc_override_wolfvill_quests_18_s_no_different_outsider_97cff9: "对外人来说也没什么不同。"
  npc_override_wolfvill_quests_18_s_nonsense_s_probably_ju_6784ed: "胡说八道，那可能只是旅游噱头。"
  npc_override_wolfvill_quests_18_s_nothing_4467a6: "没什么"
  npc_override_wolfvill_quests_18_s_odd_seems_fit_informat_e92574: "虽然奇怪，但似乎符合迷你艾莉目前传来的信息，所以四处检查一下。"
  npc_override_wolfvill_quests_18_s_okay_everything_s_fine_0ab655: "但没关系。一切都好。这里没有人会伤害我们的博克西尔。别担心。"
  npc_override_wolfvill_quests_18_s_okay_i_m_good_db5b9e: "没关系，我很擅长这个。"
  npc_override_wolfvill_quests_18_s_one_thing_keep_trying_867ae3: "一直试图闯入拉赫首都最安全的神殿是一回事，但……"
  npc_override_wolfvill_quests_18_s_only_if_you_re_7fb6a4: "但前提是你要^4d4dff参加比赛^000000。"
  npc_override_wolfvill_quests_18_s_over_yet_they_re_b2d5fc: "还没结束。那边声称既然我们武装起来发动了攻击，我们就是叛乱者。看来主张强硬回应的声音正在增强。"
  npc_override_wolfvill_quests_18_s_pain_ass_because_ashri_14359e: "因为灰环鹰冲进来很麻烦。请清理周围的灰环鹰。我通常一天抓20只鹰。那就拜托了。"
  npc_override_wolfvill_quests_18_s_party_entered_707dc1: "{1}队伍的{0}进入了{2}。"
  npc_override_wolfvill_quests_18_s_perfect_801e95: "完美！"
  npc_override_wolfvill_quests_18_s_pitiful_c075d5: "不可怜……！！"
  npc_override_wolfvill_quests_18_s_problem_exactly_you_re_3fa0d4: "正是这个问题。先生，你相当敏锐。我喜欢这一点。"
  npc_override_wolfvill_quests_18_s_problem_relationships_320944: "这是人际关系问题，所以我不想和不认识的人说话……"
  npc_override_wolfvill_quests_18_s_process_rightfully_gai_a535f5: "这是正当获利的过程。对此说三道四是不合理的。"
  npc_override_wolfvill_quests_18_s_rachel_s_best_grocery_dce21d: "这是拉赫最好的杂货店，没错。"
  npc_override_wolfvill_quests_18_s_real_lifetime_request_c5c0a7: "这是真正的终身请求。"
  npc_override_wolfvill_quests_18_s_realistic_expect_every_0f01b4: "指望所有人一夜之间和睦相处是不现实的。"
  npc_override_wolfvill_quests_18_s_really_diverse_wonderf_e9cdbd: "真的多种多样且精彩！我还记得小时候听过这些神的故事。"
  npc_override_wolfvill_quests_18_s_really_serious_s_start_5fbf45: "主路附近开始升温了，真的很严重……"
  npc_override_wolfvill_quests_18_s_reflection_period_with_93932f: "接下来三个月是反省期，处理领导层的职责并反思我作为顶级管理者的行为。"
  npc_override_wolfvill_quests_18_s_regrettable_hear_vario_0c12dd: "考虑到我们是基于相互理解建立合同关系的，最近听到各种负面消息令人遗憾。"
  npc_override_wolfvill_quests_18_s_relief_they_don_t_b3c67b: "幸好他们只是互相捂住耳朵大喊大叫，没有造成太多麻烦。"
  npc_override_wolfvill_quests_18_s_right_2bf185: "没错！！！"
  npc_override_wolfvill_quests_18_s_right_cold_hearted_one_6301e0: "没错！那个冷酷无情的人已经从头到脚都冰冷了。"
  npc_override_wolfvill_quests_18_s_right_e6a184: "那……没错……"
  npc_override_wolfvill_quests_18_s_right_i_think_adventur_039fd5: "没错！我觉得冒险者也许能帮我们。你知道，这个冒险者真的很会说话，你不觉得他的脸让人很可信吗？这正是大人们喜欢的那种奖品。"
  npc_override_wolfvill_quests_18_s_right_just_pretend_you_e6084f: "没错。假装你听说了然后大声说出来，好吗？"
  npc_override_wolfvill_quests_18_s_right_maram_i_favor_025e1b: "……没错，玛拉姆。我有个请求。你能找一个缺了左腿但右腿健康的人吗？我想我得把我的右靴卖给他。"
  npc_override_wolfvill_quests_18_s_right_s_our_time_ceef98: "没错！是时候这么做了！"
  npc_override_wolfvill_quests_18_s_right_s_right_8e8f44: "没错！没错！"
  npc_override_wolfvill_quests_18_s_right_s_right_we_e24f6b: "没错，没错！我们需要这种程度的保护，即使在抗议期间也能安全！"
  npc_override_wolfvill_quests_18_s_right_s_why_i_1576dd: "没错。所以这次我弄了很多东西来填满它。"
