  npc_override_wolfvill_quests_18_must_here_somewhere_righ_5916a8: "它一定在这里的某个地方，对吧？"
  npc_override_wolfvill_quests_18_must_prevented_49598b: "那必须被阻止。"
  npc_override_wolfvill_quests_18_my_adoptive_mother_who_f_8af05a: "我的养母，为我们感到难过，收养了我。自从她成为高级祭司以来，她一直在^e5555e将我们收养到富裕移民的家庭^000000方面走在前列。"
  npc_override_wolfvill_quests_18_my_boss_s_shop_navi_69d83c: "我老板的店在<NAVI>[这里]<INFO>rachel,136,95,0,101,0</INFO></NAVI>。"
  npc_override_wolfvill_quests_18_my_effort_wrong_24a04a: "我的努力错了吗？"
  npc_override_wolfvill_quests_18_my_fault_they_mock_elder_b1f423: "是我的错吗？他们嘲笑长者年老！"
  npc_override_wolfvill_quests_18_my_friend_miriam_9fd5a6: "这是我的^e5555e朋友米里亚姆^000000。"
