  npc_override_wolfvill_quests_18_s_dangerous_matter_heard_1cd81e: "这件事被其他商人听到会很危险。"
  npc_override_wolfvill_quests_18_s_difficult_easy_you_jus_8ec1d9: "说难也难，说简单也简单。你只需要保证。"
  npc_override_wolfvill_quests_18_s_difficult_s_simple_tas_4ccdd1: "不难。这是连傻瓜都能做的简单任务。"
  npc_override_wolfvill_quests_18_s_difficult_self_suffici_490c34: "在这种环境下自给自足很困难。"
  npc_override_wolfvill_quests_18_s_discrimination_against_cb1b5a: "这不是针对原住民的歧视。"
  npc_override_wolfvill_quests_18_s_easier_said_than_done_a23e6a: "说起来容易做起来难。没有任何准备你打算怎么办？"
