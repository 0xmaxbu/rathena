  npc_override_wolfvill_quests_18_recently_unidentified_in_265d43: "最近，不明身份的人试图入侵塞斯鲁尼尔神殿。"
  npc_override_wolfvill_quests_18_refining_power_dropped_v_47484e: "精炼力的下降取决于选择的净化仪式。"
  npc_override_wolfvill_quests_18_remains_collected_mansio_89cac9: "从宅邸收集到的遗骸与人工生命体的起源——胚胎在结构上完全相同。"
  npc_override_wolfvill_quests_18_remember_what_i_told_you_1f75c8: "还记得我们第一次遇到冒险者时我说的话吗？"
  npc_override_wolfvill_quests_18_repair_successful_9d0928: "^0000ff修复成功！^000000"
  npc_override_wolfvill_quests_18_request_assistance_merch_c021d0: "请求协助进行商人伪装。"
  npc_override_wolfvill_quests_18_researching_those_differ_9d4bc1: "但研究那些差异和共同点正是我的工作，不是吗？"
  npc_override_wolfvill_quests_18_rest_resolved_time_human_73d656: "剩下的就交给时间和人类的适应能力了。"
  npc_override_wolfvill_quests_18_rest_well_i_ll_see_68b1a9: "好好休息，明天见。"
  npc_override_wolfvill_quests_18_rest_while_then_go_back_96fa9d: "休息一会儿，然后回村子涂药膏。"
  npc_override_wolfvill_quests_18_result_favorable_assessm_b5557b: "^4d4dff这将对你产生有利的评价。^000000"
  npc_override_wolfvill_quests_18_result_favorable_evaluat_a08785: "^4d4dff这将对你产生有利的评价。^000000"
  npc_override_wolfvill_quests_18_rhetoric_even_drives_tho_d50e3e: "那种甚至能把不同意的人逼入绝境的言辞，看起来像是敌人的策略。"
  npc_override_wolfvill_quests_18_right_as_now_villagers_p_b7bb29: "是的，目前村民和实际领导层还不知道这个事实。一旦我们派出搜索队，卡米尔的罪行就会被确认。"
  npc_override_wolfvill_quests_18_right_bagot_took_ymir_s_9666e1: "是的。巴戈特拿走了伊米尔之心然后去了某处，对吧？"
  npc_override_wolfvill_quests_18_right_fbc63d: "是的。"
  npc_override_wolfvill_quests_18_right_here_we_715b02: "是的，我们到了。"
  npc_override_wolfvill_quests_18_right_my_memory_serves_m_113c6a: "是的，我的记性还不错。"
  npc_override_wolfvill_quests_18_right_now_seems_like_nob_7094d8: "现在似乎没人愿意听，但就像登特说的，也许像{0}这样的外来者能帮上忙。"
  npc_override_wolfvill_quests_18_right_reform_necessary_21908c: "是的。改革是必要的。"
  npc_override_wolfvill_quests_18_right_s_my_opinion_too_5b9da4: "对吧？我也是这么想的。这是为了救人。如果我们按自己的方式做，至少能救下一些东西。"
  npc_override_wolfvill_quests_18_right_s_what_i_think_bb1165: "对吧？我也是这么想的。也许如果我们更努力、更积极，他们会改变想法？"
  npc_override_wolfvill_quests_18_right_scania_a1caea: "对吧，斯卡尼亚？"
  npc_override_wolfvill_quests_18_right_what_adventurer_sa_3be80c: "对吧？冒险者说的是正确的。"
  npc_override_wolfvill_quests_18_right_while_you_re_here_64b7d7: "对了，既然你在这里，能帮我个忙吗？"
  npc_override_wolfvill_quests_18_roaarrrr_b79535: "吼——"
  npc_override_wolfvill_quests_18_road_rough_6abbb8: "路会很崎岖吗？"
  npc_override_wolfvill_quests_18_roar_606958: "吼——"
  npc_override_wolfvill_quests_18_roarr_75c4f0: "吼——"
  npc_override_wolfvill_quests_18_roarrr_f42762: "吼——"
  npc_override_wolfvill_quests_18_roarrrrrr_5ffda7: "吼——"
  npc_override_wolfvill_quests_18_ruling_class_won_t_stay_51a7b1: "但统治阶层不会坐视不管。"
  npc_override_wolfvill_quests_18_s_5a97cd: "那是……"
  npc_override_wolfvill_quests_18_s_about_gathering_myths_e4f959: "是关于收集流传给我们的神话和民间故事。"
  npc_override_wolfvill_quests_18_s_about_remnants_blasphe_9782dd: "是关于在青年宅邸发现的那亵渎之物的残骸。"
  npc_override_wolfvill_quests_18_s_actually_times_6c6642: "实际上是15次。"
  npc_override_wolfvill_quests_18_s_all_bigger_issue_weapo_677a37: "不仅如此。更大的问题是，本应销毁的武器和弹药在没有任何稳定性保证的情况下不断流入。"
  npc_override_wolfvill_quests_18_s_already_been_minutes_h_18b99e: "已经过了5分钟了吧？"
  npc_override_wolfvill_quests_18_s_alright_even_if_they_36ea3c: "没关系，即使库存有点少。"
  npc_override_wolfvill_quests_18_s_also_about_preserving_c2d197: "这也是为了保护原住民珍贵的文化遗产。"
  npc_override_wolfvill_quests_18_s_also_my_job_maintain_fa76e6: "保养刀具和刀刃也是我的工作。"
  npc_override_wolfvill_quests_18_s_audacious_other_people_a71f72: "太放肆了。别人的东西！！！"
  npc_override_wolfvill_quests_18_s_beautiful_mysterious_f_b044dd: "这是只在灰狼森林绽放的美丽而神秘的花。我爸说他摘了一朵向我妈妈求婚。"
  npc_override_wolfvill_quests_18_s_because_i_m_lonely_e0467e: "不是因为我很孤独……"
  npc_override_wolfvill_quests_18_s_been_chaotic_everywher_895396: "最近到处都很混乱。"
  npc_override_wolfvill_quests_18_s_been_common_people_per_6c673d: "最近常有带着个人恩怨来神殿大喊大叫的人，我们一直在试图安抚他们并送他们离开，"
  npc_override_wolfvill_quests_18_s_been_threat_some_exten_d6d51e: "这在某种程度上已经构成了威胁，所以如果让他们想想，他们就不会攻击。"
  npc_override_wolfvill_quests_18_s_better_see_yourself_th_6a677b: "与其听我解释，不如亲眼看看。"
  npc_override_wolfvill_quests_18_s_better_than_carrying_w_392800: "总比挑水强~"
  npc_override_wolfvill_quests_18_s_better_you_handle_matt_b4a15b: "你们自己之间的事情还是你们自己处理比较好。"
  npc_override_wolfvill_quests_18_s_bit_strange_3fbfd8: "有点奇怪。"
  npc_override_wolfvill_quests_18_s_bit_strange_63de91: "但有点奇怪。"
  npc_override_wolfvill_quests_18_s_boasting_if_you_had_2e7ebe: "而且这不是吹牛，但如果你利用了老板的不公平，你总会越过那道障碍的，对吧？"
  npc_override_wolfvill_quests_18_s_city_beautiful_temple_323db9: "现在是个有美丽神殿的城市，但曾经是原住民居住的^e5555e荒芜之地^000000。"
  npc_override_wolfvill_quests_18_s_clear_carriage_led_cam_90afdd: "^0000ff很明显，卡米尔驾驶的马车已经离开了。从散落的货物来看，一定发生了不好的事情。我需要找到卡米尔。^000000"
