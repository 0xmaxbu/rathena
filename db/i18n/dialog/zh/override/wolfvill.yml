  npc_override_wolfvill_quests_18_reason_leaving_92597f: "离开的理由"
  npc_override_wolfvill_quests_18_reason_mother_adopted_us_494ae0: "母亲收养我们的理由，是为了这一天吗？"
  npc_override_wolfvill_quests_18_reason_we_re_planning_en_e3b3fc: "为此，我们打算进入有攻击性客人居住的别墅。"
  npc_override_wolfvill_quests_18_reason_we_ve_been_oppres_01d467: "我们之所以一直被压迫，是因为我们缺乏力量。"
  npc_override_wolfvill_quests_18_rebellion_option_furthes_9d0111: "叛乱不是选项。我们最多只能通过抗议来支持。"
