  npc_override_wolfvill_quests_18_i_ll_strive_boss_who_8715bc: "我会努力成为一个以我的最佳努力回报你的最佳努力的老板。"
  npc_override_wolfvill_quests_18_i_ll_tell_you_story_8f0923: "我会给你讲一个故事。这是一个非常古老的故事，可能不是每个人都喜欢，但这是我祖母以前经常给我讲的。"
  npc_override_wolfvill_quests_18_i_ll_try_conversation_my_243b7d: "我会试着和我父亲多谈一点。"
  npc_override_wolfvill_quests_18_i_ll_try_listen_your_7cc652: "我会试着听取你的建议。"
  npc_override_wolfvill_quests_18_i_ll_wait_2512d7: "我会等！"
  npc_override_wolfvill_quests_18_i_ll_wait_here_until_1052e8: "我会在这里等到所有东西都煮好。"
  npc_override_wolfvill_quests_18_i_ll_what_you_re_1841d8: "我要你正在吃的。"
  npc_override_wolfvill_quests_18_i_looked_back_saw_rachel_a1fb8c: "我回头看到了拉赫……城墙是如此遥远。"
  npc_override_wolfvill_quests_18_i_lost_all_my_wealth_0e495e: "我失去了所有财富，无处可去，所以来到了这里。"
  npc_override_wolfvill_quests_18_i_m_adult_wrong_adult_1bad9d: "但我是成年人！成年人期望被当作成年人对待有错吗？"
  npc_override_wolfvill_quests_18_i_m_adventurer_shall_i_4c1096: "我是冒险者，要我帮你猎杀它们吗？"
  npc_override_wolfvill_quests_18_i_m_against_things_like_c1f4ec: "我反对砸碎一切之类的事情。"
  npc_override_wolfvill_quests_18_i_m_already_d947d2: "我已经……"
  npc_override_wolfvill_quests_18_i_m_bad_guy_b23eac: "我不是坏人……"
  npc_override_wolfvill_quests_18_i_m_bit_busy_right_76785b: "我现在有点忙……"
  npc_override_wolfvill_quests_18_i_m_currently_busy_9af8d1: "我目前很忙……"
  npc_override_wolfvill_quests_18_i_m_disappointed_you_rej_fbd97a: "你拒绝了我，我很失望。我的心很痛。"
  npc_override_wolfvill_quests_18_i_m_doing_because_i_f99dda: "我这样做不是因为我不感激。他们说他们不把它带到这里是因为这对他们来说太陌生了。技术和设施随着时间的推移已经发展了，但你就是不明白！"
  npc_override_wolfvill_quests_18_i_m_excited_hear_what_01f0ab: "我很兴奋想听它们是什么故事。请给我看看笔记本。"
  npc_override_wolfvill_quests_18_i_m_excited_hear_what_ce047d: "我很兴奋想听它们是什么故事。请给我看看笔记本。"
  npc_override_wolfvill_quests_18_i_m_feeling_bit_better_2ed2a8: "我现在感觉好一点了，可以动了。"
  npc_override_wolfvill_quests_18_i_m_feeling_little_uneas_86e65c: "……但我感到有点不安。"
  npc_override_wolfvill_quests_18_i_m_forgetting_something_72f789: "我没有忘记什么吧？"
  npc_override_wolfvill_quests_18_i_m_glad_if_helps_2edd25: "如果这能帮助古德拉，我很高兴。"
  npc_override_wolfvill_quests_18_i_m_glad_you_think_11927c: "很高兴你这么想！你也做得很好！我们都是天才！"
  npc_override_wolfvill_quests_18_i_m_going_argue_you_2efd35: "我不会再和你争论了。做你认为最好的事……"
  npc_override_wolfvill_quests_18_i_m_going_cutting_your_f12a97: "我不会切掉你的腿，我可以治好它。"
  npc_override_wolfvill_quests_18_i_m_going_treat_you_30e29f: "我不会对你不好。我厌倦了那种事……"
  npc_override_wolfvill_quests_18_i_m_here_clinic_matter_2b28fa: "我来是为了诊所的事……"
  npc_override_wolfvill_quests_18_i_m_i_m_here_dcaf3d: "我不是……我不是来自这里……"
  npc_override_wolfvill_quests_18_i_m_interested_buying_so_99a13a: "我有兴趣购买这里列出的一些物品。"
  npc_override_wolfvill_quests_18_i_m_just_stating_truth_917580: "我只是陈述事实……"
  npc_override_wolfvill_quests_18_i_m_kind_person_though_9a3e49: "但我不是那种人。"
  npc_override_wolfvill_quests_18_i_m_letting_you_know_80c677: "我告诉你是因为一旦他们那里的库存用完，交易就会被切断。"
  npc_override_wolfvill_quests_18_i_m_middle_handling_prot_995027: "我正在处理抗议活动，所以我必须很快回去，但是……"
  npc_override_wolfvill_quests_18_i_m_miriam_friend_maram_4b37af: "我是米里亚姆，马兰的朋友。"
  npc_override_wolfvill_quests_18_i_m_mocking_5de2a0: "我不是在嘲笑。"
  npc_override_wolfvill_quests_18_i_m_one_disregard_what_cddbde: "我不是那种忽视所谓安全的人。我也不是傻瓜。"
  npc_override_wolfvill_quests_18_i_m_one_who_goes_09d3ac: "我是那个一直走到决定村庄一切事务的委员会的人，就是我。"
  npc_override_wolfvill_quests_18_i_m_only_making_small_1ef320: "我只做少量~"
  npc_override_wolfvill_quests_18_i_m_organizing_collected_b801f6: "我正在整理收集到的故事。"
  npc_override_wolfvill_quests_18_i_m_planning_stay_here_b1f4ae: "我打算在这里待一段时间。"
  npc_override_wolfvill_quests_18_i_m_pleased_someone_outs_c421d7: "我很高兴有外来者立刻认出我是学者。"
  npc_override_wolfvill_quests_18_i_m_ready_depart_31db2f: "我准备好出发了。"
  npc_override_wolfvill_quests_18_i_m_really_disillusioned_8cc461: "但是，我真的对盲目信仰感到幻灭。"
  npc_override_wolfvill_quests_18_i_m_saying_i_because_8e95bf: "我说我能做到是因为我能做到。大家，让开。"
  npc_override_wolfvill_quests_18_i_m_so_exhausted_355b20: "我太累了……"
  npc_override_wolfvill_quests_18_i_m_someone_who_discrimi_ef773c: "我不是那种歧视原住民的人，但他们缺乏责任感，所以如果我责骂他们，我可能会就此作罢。"
  npc_override_wolfvill_quests_18_i_m_sorry_00dca6: "对不起。"
  npc_override_wolfvill_quests_18_i_m_sorry_34a96e: "对不起……"
  npc_override_wolfvill_quests_18_i_m_sorry_burdening_you_cdcee6: "很抱歉用这个烦人的任务来麻烦你。"
  npc_override_wolfvill_quests_18_i_m_sorry_could_we_6b9b51: "对不起，{0}，但我们能在我快速买点东西后离开吗？"
  npc_override_wolfvill_quests_18_i_m_sorry_i_ll_73d885: "对不起。我很快就到！"
  npc_override_wolfvill_quests_18_i_m_sorry_items_we_643267: "对不起，但我们这里的物品库存都很低……"
  npc_override_wolfvill_quests_18_i_m_sorry_keeping_you_428bfd: "很抱歉让你忙了。非常感谢！"
  npc_override_wolfvill_quests_18_i_m_sorry_okay_if_3eb085: "{0}，对不起，但如果我快速买完物品然后离开可以吗？"
  npc_override_wolfvill_quests_18_i_m_sorry_sir_i_7d41c6: "……对不起，先生。我现在有点事，我得走了。"
  npc_override_wolfvill_quests_18_i_m_sorry_we_don_1b7110: "对不起，但我们目前库存不多。"
  npc_override_wolfvill_quests_18_i_m_sure_9b3436: "我不确定？"
  npc_override_wolfvill_quests_18_i_m_sure_everyone_their_fd29ce: "我相信每个人都有自己的想法，但我会这么说。"
  npc_override_wolfvill_quests_18_i_m_sure_higher_ups_076500: "我相信上层会责备我过于纵容，但我不能对怪物问题视而不见！"
  npc_override_wolfvill_quests_18_i_m_sure_how_much_f81dd3: "我不确定你对阿鲁纳菲尔特了解多少，但是……"
  npc_override_wolfvill_quests_18_i_m_sure_if_he_3ee2de: "我不确定他是否还在广场，但也许我们可以问问那里的人，找出马兰去了哪里？"
  npc_override_wolfvill_quests_18_i_m_sure_if_he_936e56: "我不确定他是否愿意见我们……"
  npc_override_wolfvill_quests_18_i_m_sure_if_i_1e33cf: "我不确定我是否有你需要的所有东西。"
  npc_override_wolfvill_quests_18_i_m_sure_my_deputy_ffe93a: "我不确定，但我的副手……不，我需要亲自去确认。"
  npc_override_wolfvill_quests_18_i_m_sure_what_exactly_b35e1e: "我不确定到底是什么导致了不满。"
  npc_override_wolfvill_quests_18_i_m_sure_where_my_07df6e: "我也不确定我的东西去了哪里。"
  npc_override_wolfvill_quests_18_i_m_sure_you_ll_80e967: "我相信你会很高兴，因为我没有抛弃你。"
  npc_override_wolfvill_quests_18_i_m_tired_hearing_things_11af93: "我厌倦了听到'你知道我是谁吗？'这样的话，当涉及到我的原住民背景时。"
  npc_override_wolfvill_quests_18_i_m_trying_keep_out_f8fe61: "我试图把它放在一边，以免影响其他事情，但我想这也没用。"
  npc_override_wolfvill_quests_18_i_m_upset_there_s_e1cb39: "我很沮丧，但现在没有胜算。让我们修好它再试一次"
  npc_override_wolfvill_quests_18_i_m_very_grateful_someon_bc9e2c: "我非常感激有人倾听。祝福他们。"
  npc_override_wolfvill_quests_18_i_may_know_much_about_20a7e8: "我可能不太了解这种事，但从我有限的角度来看，他们将来不会继续这样吗？我们不应该以防万一武装自己吗？"
  npc_override_wolfvill_quests_18_i_may_representative_vil_a0f1aa: "我可能不是村庄会议的代表……但我们会表示一些礼貌。"
  npc_override_wolfvill_quests_18_i_mean_78bd9a: "我是认真的！"
  npc_override_wolfvill_quests_18_i_mean_amethyst_fragment_cb8dad: "我是说，紫水晶碎片。"
  npc_override_wolfvill_quests_18_i_mean_i_t_mention_aebf77: "我是说，我不能提及它。"
  npc_override_wolfvill_quests_18_i_mean_we_re_going_f5fe48: "我是说，即使我们确实收回了我们的土地，我们也不会像现在这样生活。我们的生活已经与过去不同了。"
  npc_override_wolfvill_quests_18_i_might_get_scolded_tomo_38f90b: "我明天可能会被骂，但说实话，我很高兴终于拿到了工资。"
  npc_override_wolfvill_quests_18_i_must_succeed_here_aeb042: "我必须在这里成功。"
  npc_override_wolfvill_quests_18_i_need_few_days_so_c2a6fe: "我几天后需要，所以我不能批量购买~"
  npc_override_wolfvill_quests_18_i_need_go_top_a68bba: "我需要它去山顶"
  npc_override_wolfvill_quests_18_i_need_move_expedition_c_640c92: "我需要先把探险马车移回村庄。我们应该收集剩余的物资并为不便道歉……"
  npc_override_wolfvill_quests_18_i_need_place_return_81c48e: "但我需要一个可以回去的地方。"
  npc_override_wolfvill_quests_18_i_need_steel_very_unusua_7c2c33: "我需要1个钢铁和10个非常不寻常的水晶，非常不寻常的水晶可以从灰狼那里获得。"
  npc_override_wolfvill_quests_18_i_never_imagined_youth_s_f52d20: "我从未想过年轻人会做这种事。"
  npc_override_wolfvill_quests_18_i_never_left_village_sin_f4d33d: "自从我出生以来，我从未离开过这个村庄。"
  npc_override_wolfvill_quests_18_i_no_interest_their_powe_432199: "我对他们的权力斗争不感兴趣。"
  npc_override_wolfvill_quests_18_i_no_objections_cc83d2: "我没有异议。"
  npc_override_wolfvill_quests_18_i_nowhere_else_go_either_1ca9f8: "我也无处可去，所以我可以开始随心所欲地行动吗？"
  npc_override_wolfvill_quests_18_i_nowhere_else_go_here_287dd7: "我无处可去，只能来这里。"
  npc_override_wolfvill_quests_18_i_once_dreamed_being_adv_8cd773: "我曾经梦想成为一名冒险者。但后来我膝盖中了一箭，现在被困在城市里。"
  npc_override_wolfvill_quests_18_i_once_dreamed_being_adv_9fefea: "我曾经梦想成为一名冒险者。但后来我膝盖中了一箭，被困在了城市里。"
  npc_override_wolfvill_quests_18_i_only_see_future_just_ff918a: "我只能看到一个未来^e5555e我们三个人去了，我们的东西当场被拿走^000000。"
  npc_override_wolfvill_quests_18_i_owe_him_favor_helping_517b6c: "我欠他一个人情，因为他 earlier 帮了忙，所以我会问^e5555e苏阿德^000000。"
  npc_override_wolfvill_quests_18_i_projected_my_original_f9f81d: "我投射了我的原始形态，因为这似乎是一个你们都需要一起听的故事。"
  npc_override_wolfvill_quests_18_i_promised_pay_all_once_cb9864: "我答应下个月一次性付清，用我最喜欢的冒险者。"
  npc_override_wolfvill_quests_18_i_really_dislike_hearing_314716: "我真的很讨厌听到'他们一定做错了什么'这句话。'做错了什么'到底是什么意思？"
  npc_override_wolfvill_quests_18_i_really_don_t_understan_b76bf2: "我真的不明白！"
  npc_override_wolfvill_quests_18_i_really_enjoy_reading_i_5cfcc3: "我真的很喜欢读有趣的故事。"
  npc_override_wolfvill_quests_18_i_really_i_really_want_2124fe: "我真的……我真的很想去那里。"
  npc_override_wolfvill_quests_18_i_really_like_adventurer_261d5c: "我真的很喜欢冒险者！"
  npc_override_wolfvill_quests_18_i_really_no_way_get_d8ccb1: "但我真的没有办法去那里。"
  npc_override_wolfvill_quests_18_i_remember_having_conver_116f90: "我记得和父亲谈论过耶梦加得。"
  npc_override_wolfvill_quests_18_i_repay_kindness_making_000a0e: "我会通过制作一本好的故事书来回报这份善意。"
  npc_override_wolfvill_quests_18_i_said_didn_t_i_22f4ad: "我说过那个，不是吗？我告诉你一百遍了。你又没听，对吧？你只相信你想相信的，对吧？"
  npc_override_wolfvill_quests_18_i_said_everything_i_coul_4255e4: "我说了我离开时没能说的一切。"
  npc_override_wolfvill_quests_18_i_saw_myself_what_eeb142: "我自己看到了，什么~"
  npc_override_wolfvill_quests_18_i_saw_yesterday_2eb0ba: "我昨天看到了。"
  npc_override_wolfvill_quests_18_i_see_anyway_some_level_c65095: "我明白了。不管怎样，抗议需要一定程度的武装。"
  npc_override_wolfvill_quests_18_i_see_i_understand_ae4f91: "我明白了……我理解。"
  npc_override_wolfvill_quests_18_i_see_our_position_becom_c61e68: "我明白了。我们的处境变得极其不利。目前还没有重大行动，但舆论对我们不利。"
  npc_override_wolfvill_quests_18_i_see_rather_than_just_e1729b: "我明白了。与其只是等待神的话语并强迫它，我们需要倾听人们的故事。"
  npc_override_wolfvill_quests_18_i_see_seems_there_s_0bc212: "我明白了，看来目前移民和原住民之间有很多紧张和冲突，尤其是对我的不满情绪日益增长。"
  npc_override_wolfvill_quests_18_i_see_there_connection_a4a3f4: "我明白了。有联系吗？"
  npc_override_wolfvill_quests_18_i_see_you_re_someone_08f7c8: "我明白了……你是一个不关心可怜守门人生命安全的人……"
  npc_override_wolfvill_quests_18_i_see_you_ve_recently_ebeb19: "看来你最近在村里收到了一些<ITEM>[紫水晶碎片]<INFO>1000405</INFO></ITEM>，对吧？"
  npc_override_wolfvill_quests_18_i_seem_like_scholar_you_2d3d8f: "……我看起来像你眼中的学者吗？"
  npc_override_wolfvill_quests_18_i_should_also_try_harder_d0aefa: "我也应该更努力地表现得像个人。"
  npc_override_wolfvill_quests_18_i_should_probably_just_g_9f157b: "我可能应该回家……"
  npc_override_wolfvill_quests_18_i_sincerely_apologize_ev_c1761d: "我真诚地向大家道歉。而且，强迫我的不是我导师；是我违背他们的建议坚持探险。"
  npc_override_wolfvill_quests_18_i_sleep_comfortably_toni_146f6e: "今晚我可以舒服地睡觉了。"
  npc_override_wolfvill_quests_18_i_some_beautiful_amethys_37857d: "我有一些漂亮的紫水晶碎片，是我随便找到的。我会把它们给你。"
  npc_override_wolfvill_quests_18_i_some_medicines_medical_c7dc7d: "我从拉赫有一些药品和医疗用品，但它们很稀缺，而且我不在合适的地方使用它们。"
  npc_override_wolfvill_quests_18_i_some_potions_here_so_ec3f4d: "我这里有一些药水，所以喝了它，先回村庄。"
  npc_override_wolfvill_quests_18_i_something_i_d_like_e369c1: "我有件事想问一下。可以吗？"
  npc_override_wolfvill_quests_18_i_something_i_want_inves_e97506: "我有件事想在另一边调查，而不是直接面对那些人。"
  npc_override_wolfvill_quests_18_i_still_need_handle_prot_10b3df: "我仍然需要处理抗议活动并做一些协调工作。"
  npc_override_wolfvill_quests_18_i_suffered_lot_because_t_e35b2f: "我受了很多苦，因为原住民的加薪没有妥协。"
  npc_override_wolfvill_quests_18_i_t_00f432: "我不能。"
  npc_override_wolfvill_quests_18_i_t_disclose_as_s_62b8af: "我不能透露，因为这是个人信息。你为什么问？"
  npc_override_wolfvill_quests_18_i_t_disclose_destination_3189b0: "我还不能透露目的地，所以只要跟着我。"
  npc_override_wolfvill_quests_18_i_t_even_afford_buy_442439: "我甚至买不起明天的饭。"
  npc_override_wolfvill_quests_18_i_t_even_run_away_f45ccd: "我甚至无处可逃。"
  npc_override_wolfvill_quests_18_i_t_give_up_i_f3c5b4: "但我不能放弃，而且我很高兴你愿意回来谈论它，但在那之前，我需要召集一群志同道合的人，并准备好说服他们。"
  npc_override_wolfvill_quests_18_i_t_let_you_go_f9acbc: "我不能让你一个人去。我怎么能把你送到这么危险的地方一个人去？当然，我知道你可以自己处理散步，但我担心。"
  npc_override_wolfvill_quests_18_i_t_made_wrong_choice_f9fd56: "我来这里不可能做错了选择……？"
  npc_override_wolfvill_quests_18_i_t_stand_anymore_11a3aa: "我再也受不了了。"
  npc_override_wolfvill_quests_18_i_t_take_anymore_4dfd2b: "我再也受不了了……"
  npc_override_wolfvill_quests_18_i_talked_directly_dina_a_a3dc23: "我直接和迪娜谈了不公平的方面，但徒劳无功。"
  npc_override_wolfvill_quests_18_i_think_helpful_sure_par_df2d34: "我认为参加会议肯定会有帮助……"
  npc_override_wolfvill_quests_18_i_think_i_invested_half_074562: "我想我开始做生意时，把一半的钱投入到了制作这个练习半花上。"
  npc_override_wolfvill_quests_18_i_think_i_m_going_604401: "我想我从现在起会非常忙。"
  npc_override_wolfvill_quests_18_i_think_i_said_well_5c1934: "我想我说得够清楚了，让每个人都能理解。没有必要建造诊所，你也不应该建造。"
  npc_override_wolfvill_quests_18_i_think_i_saw_him_9040cc: "我想我之前去神殿的路上在^e5555e广场^000000附近见过他……"
  npc_override_wolfvill_quests_18_i_think_might_little_say_e3445e: "我认为说它不是一个变化，而是一种态度，世界在变化，这可能有点轻描淡写。没有人是不变的。"
  npc_override_wolfvill_quests_18_i_think_s_because_accide_1a8b7e: "我想是因为不久前的事故……"
  npc_override_wolfvill_quests_18_i_think_situation_improv_6ea382: "我认为如果我们能从外面得到一点帮助，情况会有所改善。"
  npc_override_wolfvill_quests_18_i_think_weight_items_i_a70dbf: "^ff0000 我觉得我携带的物品重量太重了。请整理一下托里。^000000"
  npc_override_wolfvill_quests_18_i_thought_about_doing_wh_af5d10: "我考虑过按他们说的做，但我不能。我不知道还能做什么，但这是我需要做的。"
  npc_override_wolfvill_quests_18_i_thought_mosquito_ecab5f: "我以为是一只蚊子……？"
  npc_override_wolfvill_quests_18_i_thought_relatively_cle_d738d5: "我以为这是相对干净的水，但当我把一个圣物放进去时，它明亮地发光，给了我一种有点神圣的感觉。"
  npc_override_wolfvill_quests_18_i_thought_you_kind_perso_bb2adc: "我以为你是个善良的人。"
  npc_override_wolfvill_quests_18_i_told_him_we_need_b99aae: "我告诉他我们需要一个诊所，但我们不能强行推进，因为在这里生活了很长时间的老人反对，所以我们必须说服他们。"
  npc_override_wolfvill_quests_18_i_told_you_i_going_440c67: "我告诉过你我要在这里建一个诊所。当我来到这里时，没有一个像样的诊所，所以我建了一个。"
  npc_override_wolfvill_quests_18_i_tried_when_i_visited_31a3d6: "我以前来拉赫时试过，非常好吃，所以每次来这里我都会确保来这个地方。"
  npc_override_wolfvill_quests_18_i_understand_40038e: "我明白。"
  npc_override_wolfvill_quests_18_i_understand_i_understan_61bbdc: "我明白，我明白。你需要一些独处的时间。说实话，我也有同感。最终，我们在这个世界上都是孤独的。所以让我们在仍然一起生活的同时，各自好好生活。"
  npc_override_wolfvill_quests_18_i_understand_we_t_just_23de34: "我明白……但我们不能随便见面。"
  npc_override_wolfvill_quests_18_i_understand_well_yuseh_0c06c7: "我很清楚尤塞被幻觉的诡计所困，试图召唤一位女神，结果自爆了。"
  npc_override_wolfvill_quests_18_i_understand_what_you_me_0cb580: "我明白你的意思。"
  npc_override_wolfvill_quests_18_i_understand_what_you_re_9e158f: "我明白你在说什么！但愚蠢的斯堪尼亚不知道！即使是你这样一个完全陌生的人也能如此理解我的心！"
  npc_override_wolfvill_quests_18_i_used_live_rachel_i_68e1f6: "我以前住在拉赫，但我再也受不了了，所以……"
  npc_override_wolfvill_quests_18_i_used_recognized_techni_b6aa36: "我以前是一名公认的技术人员。"
  npc_override_wolfvill_quests_18_i_ve_analyzed_too_those_69ec3b: "我也分析过了。那些武器被归类为反人员武器，意味着它们是用于战争的。"
  npc_override_wolfvill_quests_18_i_ve_been_getting_some_86ec51: "我来这里的路上一直受到奇怪的目光。我相信我的客人也感觉到了……"
  npc_override_wolfvill_quests_18_i_ve_been_guarding_templ_41071c: "我守卫神殿已经很长时间了。"
  npc_override_wolfvill_quests_18_i_ve_been_hearing_strang_9c6f16: "我最近听到圣地传来奇怪的声音。"
  npc_override_wolfvill_quests_18_i_ve_been_pushing_sir_bccc7f: "我一直在推阿马尔爵士的轮椅，所以我到处都去过。"
  npc_override_wolfvill_quests_18_i_ve_been_traveling_vari_453c05: "我一直在各个村庄旅行，测试我积累的武术技能。在打破了许多道场后，我很久以前就在拉赫定居了。"
  npc_override_wolfvill_quests_18_i_ve_collected_enough_th_88ca0d: "我今天已经从陷阱里收集了足够多的东西。"
  npc_override_wolfvill_quests_18_i_ve_come_find_those_2561a6: "我来找那些与他们有关的人……"
  npc_override_wolfvill_quests_18_i_ve_decided_wait_now_07724e: "我决定暂时等待，因为马兰和其他高级成员目前正在讨论解决这个问题的方法。"
  npc_override_wolfvill_quests_18_i_ve_done_my_fair_f95cf1: "我已经做了我应得的工作，但在训练期间，我不能就这样放过你这个那个。"
  npc_override_wolfvill_quests_18_i_ve_got_plenty_drinking_09bfe0: "我有足够的饮用水维持一段时间。"
  npc_override_wolfvill_quests_18_i_ve_got_see_newcomers_e55d74: "我得去看看新来的人。"
  npc_override_wolfvill_quests_18_i_ve_had_people_interrup_1cfd89: "我有过那样打断我的人。"
  npc_override_wolfvill_quests_18_i_ve_heard_817ed4: "我听说"
  npc_override_wolfvill_quests_18_i_ve_heard_so_many_213454: "我听了很多故事，但现在有些我已经忘记了……"
  npc_override_wolfvill_quests_18_i_ve_heard_some_disagree_aa9971: "我在一定程度上听到了一些分歧，但是……我可能错了，以为如果我们一起生活，互相了解，互相理解，它们自然会解决。"
  npc_override_wolfvill_quests_18_i_ve_heard_story_if_e309f4: "我听过这个故事。如果他是带你来的人，你可以信任他。进来吧。"
  npc_override_wolfvill_quests_18_i_ve_never_even_heard_350b6a: "我以前从未听说过有这种名字的酱。"
  npc_override_wolfvill_quests_18_i_ve_never_heard_before_ac5c17: "我以前从未听说过这个？"
  npc_override_wolfvill_quests_18_i_ve_never_seen_anyone_c9817b: "我从未见过既不是入侵者也不是客人的人，但我知道那些戴面具的人是可疑的。"
  npc_override_wolfvill_quests_18_i_ve_never_seen_anything_ea88eb: "我从未见过这样的东西。"
  npc_override_wolfvill_quests_18_i_ve_never_seen_them_941a4f: "我以前从未见过他们。他们到底是谁？"
  npc_override_wolfvill_quests_18_i_ve_noticed_people_ofte_2102d3: "我注意到人们经常交换它们，认为它们是幸运的象征或什么。"
  npc_override_wolfvill_quests_18_i_ve_obtained_rough_info_2c2e5d: "^ff0000我已经获得了关于卡米尔带走的货物去向的大致信息。^000000"
  npc_override_wolfvill_quests_18_i_ve_only_just_returned_37779f: "我刚回到拉赫，所以我不知道，但是……"
  npc_override_wolfvill_quests_18_i_ve_promised_listen_sto_ccbe00: "我答应听一个小孩、一个年轻人和一个祖母的故事。"
  npc_override_wolfvill_quests_18_i_ve_received_signal_you_cd9a6a: "我收到了你已到达当地坐标的信号。"
  npc_override_wolfvill_quests_18_i_ve_seen_some_people_938228: "我最近看到有人在做这种街头演讲……"
  npc_override_wolfvill_quests_18_i_ve_told_suad_lava_8a2af9: "我告诉苏阿德岩浆已经到达这么远，下面这里地面已经融化了很多，更加危险，所以不要下去。"
  npc_override_wolfvill_quests_18_i_want_drink_sweet_tea_08154b: "我想喝加很多冰的甜茶。"
  npc_override_wolfvill_quests_18_i_want_help_find_ymir_853ed9: "我想帮助寻找伊米尔之心碎片。"
  npc_override_wolfvill_quests_18_i_want_live_without_any_2e3e1d: "我想没有任何麻烦地生活……"
  npc_override_wolfvill_quests_18_i_want_you_get_me_1fd40a: "我想让你给我拿一些只能在拉赫的塞斯鲁尼尔神殿制作的东西。"
  npc_override_wolfvill_quests_18_i_want_you_quiet_now_503a5a: "我想让你现在安静。"
  npc_override_wolfvill_quests_18_i_wanted_try_camping_45fe6a: "我想尝试露营~"
  npc_override_wolfvill_quests_18_i_wasn_t_aware_seems_0d3cbe: "我没有意识到，但根据目前的情况，原住民和移民之间的紧张关系最近似乎升级了。"
  npc_override_wolfvill_quests_18_i_wish_i_could_sit_d8c119: "我希望我能坐在某个凉爽的地方，喝点加干果的冰茶。"
  npc_override_wolfvill_quests_18_i_won_t_discipline_you_613171: "我不会因为这件事惩罚你，但请告诉<NAVI>[阿莫迪平]<INFO>rachel,181,51,0,101,0</INFO></NAVI>好好来上班。"
  npc_override_wolfvill_quests_18_i_wonder_if_i_should_b04334: "我想知道我是否应该最终离开拉赫……？"
  npc_override_wolfvill_quests_18_i_wonder_when_miriam_arr_307af5: "我想知道米里亚姆什么时候到~"
  npc_override_wolfvill_quests_18_i_wonder_where_they_came_d52948: "我想知道他们从哪里来。"
  npc_override_wolfvill_quests_18_i_wondering_if_you_could_bb55a6: "……我想知道你能不能给我指路。"
  npc_override_wolfvill_quests_18_id_we_make_right_judgmen_348054: "我们做出了正确的判断吗？"
  npc_override_wolfvill_quests_18_if_adventurer_next_you_m_3e7554: "如果是你旁边的冒险者，也许可以，但对你来说太危险了。"
  npc_override_wolfvill_quests_18_if_anyone_asks_who_recom_f7ad6d: "如果有人问谁推荐你的，就说是杰克的推荐，当然。"
  npc_override_wolfvill_quests_18_if_anything_there_might_e2c120: "如果有什么的话，可能会有比现在更多的抵抗和动荡。"
  npc_override_wolfvill_quests_18_if_bagot_really_wants_re_07fc03: "如果巴戈特真的想复活一位神，他接下来会瞄准耶梦加得。"
  npc_override_wolfvill_quests_18_if_everyone_come_togethe_d279cf: "如果大家能齐心协力，我们也支持抗议。"
  npc_override_wolfvill_quests_18_if_he_hasn_t_come_a8e00f: "如果他还没来这里，他可能还在那里工作。"
  npc_override_wolfvill_quests_18_if_i_die_put_my_f0fa72: "如果我死了……把我积累的财富……！和我一起。你明白了吗？！这不公平！马兰，一定要好好守着我的坟墓！不要让一分钱被偷走！"
  npc_override_wolfvill_quests_18_if_i_die_run_away_fbbef8: "如果我死在这里或逃跑，我的主人将不得不承担责任。那绝不能发生。"
  npc_override_wolfvill_quests_18_if_i_get_chased_away_95905c: "如果我被从这里赶走，我就无处可去了。"
  npc_override_wolfvill_quests_18_if_i_get_paid_i_bb097b: "如果我拿到工资，我想先换掉我穿的衣服。"
  npc_override_wolfvill_quests_18_if_i_make_noise_i_66d82f: "如果我制造噪音，我会提前被米里亚姆和苏阿德责骂吗？"
  npc_override_wolfvill_quests_18_if_i_make_noise_i_a9e2f3: "如果我制造噪音，我会被米里亚姆和苏阿德责骂，你知道的？"
  npc_override_wolfvill_quests_18_if_i_want_deal_them_df5035: "如果我想对付他们，^e5555e我必须亲自去^000000……"
  npc_override_wolfvill_quests_18_if_isn_t_repetition_what_3c6378: "如果这不是重复，你还能叫它什么？"
  npc_override_wolfvill_quests_18_if_maze_master_isn_t_5ed2b4: "如果迷宫主人不在迷宫里，谁来管理迷宫！"
  npc_override_wolfvill_quests_18_if_maze_master_isn_t_849863: "如果迷宫主人不在迷宫里，谁来管理迷宫！"
  npc_override_wolfvill_quests_18_if_necessary_even_help_o_8dd5d6: "如果有必要，即使是外来者的帮助……"
  npc_override_wolfvill_quests_18_if_only_everyone_stop_fi_9d6918: "如果每个人能停止争斗一次就好了……"
  npc_override_wolfvill_quests_18_if_only_mediation_betwee_ef2321: "如果^e5555e母亲要求的原住民和移民之间的调解^00000能够实现，我们就能再次用桥跨过奥兹峡谷！"
  npc_override_wolfvill_quests_18_if_only_we_could_done_3b7cf8: "如果我们当时能做到这个就好了……"
  npc_override_wolfvill_quests_18_if_possible_even_better_9b8a54: "如果可能的话，如果冒险者支持我们的意见就更好了！"
  npc_override_wolfvill_quests_18_if_really_monster_means_157b84: "如果这真的是一个怪物，那就意味着有一个怪物被困在神圣的神殿里，这是个大问题。"
  npc_override_wolfvill_quests_18_if_rumors_spread_i_quit_c00be1: "如果传言我那样 quit 传开，作为原住民，我也无法在其他商店工作了。"
  npc_override_wolfvill_quests_18_if_s_about_building_acqu_3f39f6: "如果是关于建筑收购，我计划保持目前的立场……"
  npc_override_wolfvill_quests_18_if_s_ahmad_3f39b4: "如果是艾哈迈德……"
  npc_override_wolfvill_quests_18_if_s_case_let_s_1848fb: "如果是这样的话，让我们等待会议开始。"
  npc_override_wolfvill_quests_18_if_s_case_so_then_2b72b3: "如果是这样的话，那就这样吧。"
  npc_override_wolfvill_quests_18_if_s_case_why_bother_355793: "如果是这样的话，为什么要来这里而不是留在拉赫？"
  npc_override_wolfvill_quests_18_if_s_case_you_should_1421e8: "如果是这样的话，你应该和苏阿德谈谈。那不公平。我们都在努力一起生活。诊所并不违背自然。哦，拜托。"
  npc_override_wolfvill_quests_18_if_s_something_niren_ask_924b84: "如果是尼伦要求的，那就没办法了。"
  npc_override_wolfvill_quests_18_if_s_special_forces_thes_f7dd4d: "如果是特种部队，是这些吗？"
  npc_override_wolfvill_quests_18_if_s_task_entrusted_my_d9134a: "如果是母亲托付的任务，那我必须尽力帮助！！！"
  npc_override_wolfvill_quests_18_if_s_tough_you_take_a766c5: "如果很难，你可以休息一下。只要我们稳步前进。"
  npc_override_wolfvill_quests_18_if_s_truth_then_rachel_2135e8: "如果是真的，^e5555e那么在拉赫，我们将没有人可以卖给我们货物了，^000000我们都会像这样饿死。"
  npc_override_wolfvill_quests_18_if_s_zedd_mansion_might_aa4b09: "如果是泽德宅邸，可能会有很大帮助。"
  npc_override_wolfvill_quests_18_if_shop_only_sells_arran_7a5dd3: "如果一家只卖插花而不是活花的商店可以被称为花店的话。"
  npc_override_wolfvill_quests_18_if_sister_gudra_turns_th_186972: "如果古德拉姐姐把它们编成书，我就不会再忘记它们了。"
  npc_override_wolfvill_quests_18_if_someone_asks_such_fav_071d8b: "如果有人不知道原因就提出这样的请求，拒绝是很自然的。"
  npc_override_wolfvill_quests_18_if_such_stigma_stamped_a_01c4f1: "如果这样的污名被盖上，在这里生活也会变得困难。"
  npc_override_wolfvill_quests_18_if_there_ever_comes_time_390cbe: "但如果有一天我的技能被需要，我会准备好帮忙的。"
  npc_override_wolfvill_quests_18_if_there_s_one_thing_309891: "如果有一件事我可以托付给外来者，那就是检查我今天早上设置的陷阱。"
  npc_override_wolfvill_quests_18_if_there_s_war_we_6c24f9: "如果有战争，我们原住民将成为被卷入交火的人。"
  npc_override_wolfvill_quests_18_if_they_also_interact_ot_b2ef25: "而且如果他们也与其他朋友互动，从小就一起度过时光，他们应该能很好地相处，不会有任何重大问题。"
  npc_override_wolfvill_quests_18_if_they_attack_us_we_189c4b: "如果他们攻击我们，我们就反击。有什么好担心的？我们现在也有武器了，你知道的？"
  npc_override_wolfvill_quests_18_if_they_re_probably_stil_b0f230: "如果不是？他们可能仍然是重要人物。听着。"
  npc_override_wolfvill_quests_18_if_they_re_really_import_78cb98: "如果他们真的很重要，那就听我们说。"
  npc_override_wolfvill_quests_18_if_trust_already_broken_e26d0d: "如果信任已经破裂，^e5555e我们可能再也无法进入村庄了。^000000"
  npc_override_wolfvill_quests_18_if_we_continue_like_peop_8e2d25: "但如果我们继续这样下去，村里的人只会遭受更多痛苦。"
  npc_override_wolfvill_quests_18_if_we_drive_him_away_f48f1d: "如果我们把他赶走，他将无处可去。"
  npc_override_wolfvill_quests_18_if_we_hunt_down_bunch_c67c25: "如果我们猎杀一群，也许{0}今晚会安静下来。"
  npc_override_wolfvill_quests_18_if_we_really_bothering_h_9cddc9: "如果我们真的在打扰他，他不会和我们一起玩的。"
  npc_override_wolfvill_quests_18_if_we_stay_too_long_fa34c4: "如果我们待太久，我可能会头晕，所以我们快点探索。"
  npc_override_wolfvill_quests_18_if_we_take_away_what_df7f5a: "如果我们拿走对他们来说最重要的东西，他们就会开始注意我们。"
  npc_override_wolfvill_quests_18_if_we_understand_what_gr_4ba2ec: "如果我们能理解不满是什么……"
  npc_override_wolfvill_quests_18_if_weren_t_them_i_80dfdd: "如果不是他们，我就没有人可以一起玩了。"
  npc_override_wolfvill_quests_18_if_what_they_shed_isn_63b234: "如果他们流的不是血和泪，你还能叫它什么？"
  npc_override_wolfvill_quests_18_if_wolf_grows_up_our_31dee7: "但如果那只狼长大了，我们的羊……"
  npc_override_wolfvill_quests_18_if_you_any_difficulties_85ed36: "如果你生活中有任何困难，告诉我。"
  npc_override_wolfvill_quests_18_if_you_ask_around_near_297ec1: "如果你在^e5555e广场附近^000000问问，你应该能找到他。"
  npc_override_wolfvill_quests_18_if_you_ask_cucumber_sauc_041e1f: "如果你在穆诺玛特要黄瓜酱，他们会明白的。"
  npc_override_wolfvill_quests_18_if_you_believed_someone_a62a60: "如果你相信有人会听你的 side，看来我一直都误解了你。"
  npc_override_wolfvill_quests_18_if_you_came_buy_weapons_314771: "如果你是来买武器的，不要犹豫，拿你需要的东西。"
  npc_override_wolfvill_quests_18_if_you_don_t_anything_9a6aa8: "如果你没事做，不要只是坐在这里看着那边点燃的火。"
  npc_override_wolfvill_quests_18_if_you_don_t_mind_54fcc5: "如果你不介意，我想顺便看看他过得怎么样。"
