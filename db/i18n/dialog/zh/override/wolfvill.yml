  npc_override_wolfvill_quests_18_hmm_hmm_what_you_asking_390d9e: "嗯，嗯。你问我在做什么。"
  npc_override_wolfvill_quests_18_hmm_how_long_take_build_68ec6d: "嗯……建造那个诊所需要多长时间？"
  npc_override_wolfvill_quests_18_hmm_i_don_t_think_ce473b: "嗯，我不认为你应该盲目反对这个。"
  npc_override_wolfvill_quests_18_hmm_i_don_t_think_d8d3ad: "嗯，我不认为那是原因。"
  npc_override_wolfvill_quests_18_hmm_i_ll_need_some_21813e: "嗯，我需要做一些研究。"
  npc_override_wolfvill_quests_18_hmm_i_m_doing_my_1fec9c: "嗯，我在尽力而为。"
  npc_override_wolfvill_quests_18_hmm_i_m_sure_if_a95875: "嗯，我不确定你是否真的能修好那个马车车轮，但我会给你怀疑的好处……"
  npc_override_wolfvill_quests_18_hmm_i_see_cc4522: "嗯……我明白了。"
  npc_override_wolfvill_quests_18_hmm_i_ve_heard_rumors_098967: "嗯，我听说最近偶尔有外来者出现……"
  npc_override_wolfvill_quests_18_hmm_let_s_save_personal_523b4a: "嗯，让我们把个人故事留到以后再说……"
  npc_override_wolfvill_quests_18_hmm_s_way_these_days_618b21: "嗯……这就是这些天的方式，不是吗，冒险者？"
  npc_override_wolfvill_quests_18_hmm_since_you_quit_being_d48a18: "嗯。自从你放弃当冒险者？"
  npc_override_wolfvill_quests_18_hmm_we_don_t_sauce_83d99b: "嗯？我们没有那种酱。"
  npc_override_wolfvill_quests_18_hmm_welcome_half_flower_eadb6c: "嗯，欢迎来到半花采集教育。"
  npc_override_wolfvill_quests_18_hmm_what_everyone_these_c8aec8: "嗯……这就是每个人现在都在做的事吗？"
  npc_override_wolfvill_quests_18_hmm_what_should_i_9d8665: "嗯……我该怎么办"
  npc_override_wolfvill_quests_18_hmm_what_you_want_us_37115c: "嗯？你想对我们做什么？我们已经被那个马车车轮搞得够烦了。不要打扰我们……"
  npc_override_wolfvill_quests_18_hmm_where_did_we_leave_a2cb4c: "嗯……我们上次说到哪里了？"
  npc_override_wolfvill_quests_18_hmm_who_you_interrupt_us_eae886: "嗯？你是谁，在我们玩的时候打断我们？"
  npc_override_wolfvill_quests_18_hmm_you_come_another_reg_1acf23: "嗯……你是从另一个地区来的吗？"
  npc_override_wolfvill_quests_18_hmm_you_re_adventurer_c9369a: "嗯。你是个冒险者。"
  npc_override_wolfvill_quests_18_hmm_you_seem_possess_ski_89a8d9: "嗯？你似乎拥有与其他国家研究人员相当的技能。"
  npc_override_wolfvill_quests_18_hmmm_2ac89c: "嗯……"
  npc_override_wolfvill_quests_18_hmmm_clinic_necessity_as_06dde7: "嗯……但诊所是我认为必需的设施，如果我能说明理由……"
  npc_override_wolfvill_quests_18_hmph_23d3c8: "哼。"
  npc_override_wolfvill_quests_18_hmph_a5105a: "哼！"
  npc_override_wolfvill_quests_18_hmph_calling_surround_ju_f89574: "哼，把这叫做包围。正如谣言所说。"
  npc_override_wolfvill_quests_18_hmph_don_t_tease_zlan_002300: "哼……别逗我，兹兰。"
  npc_override_wolfvill_quests_18_hmph_those_who_hidden_he_c81b0f: "哼，那些藏在这里的人，唯一的原因是保全他们微不足道的生命，他们不会理解的。"
  npc_override_wolfvill_quests_18_hold_8ddab8: "等等……"
  npc_override_wolfvill_quests_18_hold_hey_5ff6e2: "等等！！嘿！"
  npc_override_wolfvill_quests_18_holy_relic_essence_today_e17c54: "这是今天鱼的精华圣物~"
  npc_override_wolfvill_quests_18_honest_things_been_reall_3ff8c4: "说实话，最近事情真的很奇怪。"
  npc_override_wolfvill_quests_18_honest_unless_you_re_as_791dec: "说实话，除非你像冒险者一样强壮，否则走到这里就等于判了死刑。"
  npc_override_wolfvill_quests_18_honestly_i_d_like_go_a221e2: "说实话，我想和你一起去。"
  npc_override_wolfvill_quests_18_honestly_i_m_big_fan_442b2b: "说实话，我不是很喜欢，因为气味很重。"
  npc_override_wolfvill_quests_18_hoo_57f919: "呼~"
  npc_override_wolfvill_quests_18_hoo_b88e96: "呼！"
  npc_override_wolfvill_quests_18_hoo_hoo_hoo_you_ve_da8ce5: "呼呼呼，你终于来到了这个地方。"
  npc_override_wolfvill_quests_18_hoooray_9e9e4f: "万岁~~~"
  npc_override_wolfvill_quests_18_hoou_hoou_hoou_hoou_55daf2: "呼呜！呼呜！呼呜！呼呜！"
  npc_override_wolfvill_quests_18_horim_managed_squeeze_ou_b9568b: "霍林勉强挤出一声感谢，松了一口气。"
  npc_override_wolfvill_quests_18_horim_said_he_stay_rache_33f240: "但霍林说他会留在拉赫。"
  npc_override_wolfvill_quests_18_horim_swallowed_while_tr_3c02ad: "霍林试图说什么时咽了咽口水。"
  npc_override_wolfvill_quests_18_how_about_adventurer_her_c364ca: "这位冒险者作为催化剂怎么样？"
  npc_override_wolfvill_quests_18_how_about_adventurer_mir_3857dc: "冒险者和米里亚姆带头调查怎么样？"
  npc_override_wolfvill_quests_18_how_about_don_t_push_3d34d7: "这个怎么样？暂时不要勉强自己，吃好食物，想好事，好好休息，你就能轻松地走或跑了。"
  npc_override_wolfvill_quests_18_how_about_returning_sinc_794084: "既然你不用了，还回来怎么样？"
  npc_override_wolfvill_quests_18_how_did_you_know_they_4690e8: "你怎么知道他们藏了武器？"
  npc_override_wolfvill_quests_18_how_far_did_we_get_24056e: "我们讲到哪里了？今天是新故事的时间了吗？"
  npc_override_wolfvill_quests_18_how_far_you_been_i_c8308e: "你去过多远？我是那个爬到上面托尔火山山顶的人。"
  npc_override_wolfvill_quests_18_how_i_supposed_know_you_768fcd: "我怎么知道？你真是个笑话。"
  npc_override_wolfvill_quests_18_how_long_must_i_hide_760139: "我必须在这片巴掌大的土地上躲多久？"
  npc_override_wolfvill_quests_18_how_long_you_been_here_da3498: "你在这里多久了？"
  npc_override_wolfvill_quests_18_how_long_you_plan_keep_c4da2e: "你打算保密多久？"
  npc_override_wolfvill_quests_18_how_long_you_think_we_bb828f: "你认为我们还要在这里住多久，更不用说收回我们的土地了！"
  npc_override_wolfvill_quests_18_how_many_people_suffered_5b62bd: "因为那件事，有多少人受苦和挣扎……"
  npc_override_wolfvill_quests_18_how_many_you_like_one_97d0ec: "你想要多少？一个？给你。"
  npc_override_wolfvill_quests_18_how_may_i_help_you_79a89c: "外来者，有什么可以帮你的吗？"
  npc_override_wolfvill_quests_18_how_much_further_we_go_2a55b4: "我们还要走多远？"
  npc_override_wolfvill_quests_18_how_much_longer_we_going_0b7416: "我们还要这样生活多久？"
  npc_override_wolfvill_quests_18_how_s_construction_going_fc164b: "施工进展如何？"
  npc_override_wolfvill_quests_18_how_s_temple_these_days_ea11e5: "神殿最近怎么样？"
  npc_override_wolfvill_quests_18_how_we_help_mr_ahap_006c25: "我们怎样才能帮助那个阿哈布先生？"
  npc_override_wolfvill_quests_18_how_we_ignore_when_s_b27676: "当这明显是一个国家分裂的迹象时，我们怎么能忽视它？"
  npc_override_wolfvill_quests_18_how_you_been_lately_neil_aeb76e: "你最近怎么样？尼尔？"
  npc_override_wolfvill_quests_18_how_you_even_suggest_sen_8cd960: "你怎么能建议把这个小而脆弱的生物送回如此危险的地方？它的母亲死了，它无法独自生存。"
  npc_override_wolfvill_quests_18_how_you_fix_leg_like_32d94a: "你怎么能修好这样的腿……！让我们把它切掉，涂点药防止感染！不要浪费时间抱着它……！"
  npc_override_wolfvill_quests_18_how_you_know_maram_59359b: "你怎么认识马兰的？"
  npc_override_wolfvill_quests_18_how_you_know_what_you_ed08e4: "如果原住民和移民不互相交谈，你怎么能知道你想要什么？"
  npc_override_wolfvill_quests_18_how_you_made_up_your_a46276: "怎么样？你决定了吗，冒险者？"
  npc_override_wolfvill_quests_18_how_you_plan_42fbca: "你打算怎么做？"
  npc_override_wolfvill_quests_18_how_you_supposed_train_m_70ea2d: "你怎么能用肉来训练？你只需要一个？"
  npc_override_wolfvill_quests_18_however_boksil_live_vill_66c950: "然而，为了让博克西尔在村庄生活，她需要训练。她必须学会如何与他人互动而不造成伤害，以及如何相处。"
  npc_override_wolfvill_quests_18_however_family_heroes_wh_46688d: "然而，在与教派的战斗中获胜的英雄家族以奥丁的名义建立了一个国家。"
  npc_override_wolfvill_quests_18_however_finding_reliable_4e68fd: "然而，找到可靠的供应商并谈判交易也需要时间，所以我们需要谨慎决定。"
  npc_override_wolfvill_quests_18_however_lately_i_ve_sens_0191fd: "然而，最近，我感觉到这个村庄的气氛不太对劲。"
  npc_override_wolfvill_quests_18_however_seems_one_bagot_f8c710: "然而，似乎巴戈特的一个同伴已经搬到了北方大陆。"
  npc_override_wolfvill_quests_18_however_some_people_slig_0471bd: "然而，有些人的火山灰气味略有不同。"
  npc_override_wolfvill_quests_18_however_some_point_onwar_f0886c: "然而，从某个时间点开始，给定的工作时间增加了，但对此的补偿却没有增加。"
  npc_override_wolfvill_quests_18_however_sometimes_he_for_1c866a: "然而，有时他太过强迫。"
  npc_override_wolfvill_quests_18_huam_among_them_cries_mo_b6b588: "呼……其中，{0}的叫声最可怕。"
  npc_override_wolfvill_quests_18_huh_73fef0: "嗯？"
  npc_override_wolfvill_quests_18_huh_don_t_surprised_hear_7c87d5: "嗯！听到这个别惊讶，我要在这片沙漠里卖花。"
  npc_override_wolfvill_quests_18_huh_i_no_power_money_5edd91: "嗯？我现在没有权力也没有钱。我该怎么办？"
  npc_override_wolfvill_quests_18_huh_who_wasn_t_adventure_ea69d1: "嗯？谁年轻时不是冒险者？"
  npc_override_wolfvill_quests_18_huh_you_saying_there_s_ed3ce5: "嗯？你是说有一条我不知道的武器购买路线？"
  npc_override_wolfvill_quests_18_human_relationships_comp_7ae9db: "人际关系很复杂。"
  npc_override_wolfvill_quests_18_humans_don_t_worry_de72b6: "人类。别担心。"
  npc_override_wolfvill_quests_18_hunting_non_monster_anim_ec0808: "在这片森林里狩猎非怪物动物对外来者来说是禁止的……"
  npc_override_wolfvill_quests_18_hurry_back_village_22e7d8: "快回村庄。"
  npc_override_wolfvill_quests_18_hurry_ll_go_bad_just_f29072: "快点，否则会变质。只要从<NAVI>[穆诺玛特]<INFO>rachel,135,64,0,101,0</INFO></NAVI>买一瓶。"
  npc_override_wolfvill_quests_18_hurry_up_before_s_sold_043f0c: "在卖完之前快点~"
  npc_override_wolfvill_quests_18_hurry_up_go_navi_munomar_f336f3: "快点去<NAVI>[穆诺玛特]<INFO>rachel,135,64,0,101,0</INFO></NAVI>买黄瓜酱！"
  npc_override_wolfvill_quests_18_i_abandoned_chance_ran_a_a44dce: "我放弃了那个机会逃跑了……"
  npc_override_wolfvill_quests_18_i_able_accumulate_wealth_2b8b4d: "我能够坚持自己的方法积累财富"
  npc_override_wolfvill_quests_18_i_accept_dd2a95: "我接受"
  npc_override_wolfvill_quests_18_i_already_know_foreigner_0d4548: "我已经知道外国人爱管闲事，但是……"
  npc_override_wolfvill_quests_18_i_also_drive_away_any_e59d4a: "我也会赶走任何不受欢迎的访客。"
  npc_override_wolfvill_quests_18_i_also_express_my_gratit_d7d8d0: "我也表达我的感激之情。尽管那个年轻人有一些缺点，但他是一个不应该因为这样的事件而失去生命的人才。"
  npc_override_wolfvill_quests_18_i_also_felt_speech_recei_d3811d: "我也觉得演讲没有像希望的那样受到欢迎。"
  npc_override_wolfvill_quests_18_i_also_heard_they_teach_12eb97: "我也听说他们会教你如何轻松做到。"
  npc_override_wolfvill_quests_18_i_also_no_objections_cd6cad: "我也没有异议……"
  npc_override_wolfvill_quests_18_i_also_request_same_4bd099: "我也请求同样的。"
  npc_override_wolfvill_quests_18_i_also_retrieve_fragment_94e534: "我也会取回伊米尔之心的碎片。"
  npc_override_wolfvill_quests_18_i_also_want_understand_y_ce5cce: "我也……想理解……你们所有人……"
  npc_override_wolfvill_quests_18_i_always_followed_japer_d3fa6e: "我一直追随杰珀。"
  npc_override_wolfvill_quests_18_i_am_charge_livestock_wi_e3a258: "我负责那边的埃鲁因及其家人的牲畜和野生动物观赏。"
  npc_override_wolfvill_quests_18_i_am_counting_adventurer_966a69: "我指望冒险者。我仍然相信我的直觉，你知道的。"
  npc_override_wolfvill_quests_18_i_am_currently_running_s_ec8fc5: "我目前在经营商店，但我真的很喜欢冒险者！"
  npc_override_wolfvill_quests_18_i_am_faithful_follower_f_374517: "我是芙蕾雅的忠实信徒。"
  npc_override_wolfvill_quests_18_i_am_here_take_her_e72f75: "我不是来带走她的，我是来看她的……如果她与狼群分离，我们必须把它们放回去，而且我们必须为母狼来找它们做好准备。"
  npc_override_wolfvill_quests_18_i_am_japer_disciple_shir_11fc22: "我是杰珀的弟子，希罗安。"
  npc_override_wolfvill_quests_18_i_am_making_efforts_reso_0d73ff: "我正在努力解决这个问题，但是……"
  npc_override_wolfvill_quests_18_i_am_temple_sessrumnir_0091d5: "我在塞斯鲁尼尔神殿，而且……"
  npc_override_wolfvill_quests_18_i_am_temple_sessrumnir_ac12f0: "我在塞斯鲁尼尔神殿"
  npc_override_wolfvill_quests_18_i_am_trembling_because_n_e93ba7: "我因为那些不仅忘恩负义而且充满受害者心态的原住民而颤抖"
  npc_override_wolfvill_quests_18_i_anticipated_s_worse_th_b757c1: "我预料到了，但比我想象的还要糟。我只关心来源。我无法保证武器的稳定性。它们是旧武器……"
  npc_override_wolfvill_quests_18_i_apologize_everyone_i_l_9bf8f2: "我向大家道歉。我有所欠缺，没能正确引导我的学徒……"
  npc_override_wolfvill_quests_18_i_apologize_having_discu_bdef94: "我很抱歉不得不在这样的地方讨论这件事。"
  npc_override_wolfvill_quests_18_i_appreciate_if_i_could_84edfb: "如果我能陪你去找心，我将不胜感激。"
  npc_override_wolfvill_quests_18_i_appreciate_if_you_coul_712370: "如果你能加固这辆马车的车轮，使其足以用于探险，我将不胜感激。谢谢。我需要去检查将用于探险的皮革，所以我暂时离开一下……"
  npc_override_wolfvill_quests_18_i_appreciate_if_you_coul_ab1177: "如果你能在工作期间把它们带给我，在半花枯萎之前，我将不胜感激。"
  npc_override_wolfvill_quests_18_i_ask_help_5d6be3: "我能请求帮助吗？"
  npc_override_wolfvill_quests_18_i_asked_my_mother_s_69cb41: "我征得母亲的许可后出来了一会儿。"
  npc_override_wolfvill_quests_18_i_assume_you_must_new_db5e72: "我猜你一定是这附近的新村民。你是谁？"
  npc_override_wolfvill_quests_18_i_attempt_maintenance_wo_570f07: "我尝试维护工作"
  npc_override_wolfvill_quests_18_i_been_waiting_please_co_d3b698: "我一直在等待。请进来。"
  npc_override_wolfvill_quests_18_i_beg_you_adventurer_5724fe: "我恳求你，冒险者。"
  npc_override_wolfvill_quests_18_i_beg_you_b18217: "我恳求你。"
  npc_override_wolfvill_quests_18_i_beg_your_pardon_his_79a553: "请再说一遍？他的腿在腐烂？？"
  npc_override_wolfvill_quests_18_i_believe_i_exceptional_da7908: "我相信与任何人相比，我都有出色的商业技能。这就是我达到目前位置的方式。"
  npc_override_wolfvill_quests_18_i_believe_maintaining_am_fee1e2: "我相信保持充足的半花供应对于我计划中的业务的稳定运营至关重要。"
  npc_override_wolfvill_quests_18_i_believe_my_vision_word_856d71: "我相信我的愿景和话语。"
  npc_override_wolfvill_quests_18_i_believe_s_our_first_9bae14: "我相信这是我们的第一次见面。这是你第一次来拉赫吗？"
  npc_override_wolfvill_quests_18_i_believe_we_start_over_146a2e: "我相信我们可以重新开始。"
  npc_override_wolfvill_quests_18_i_born_raised_grew_old_483b62: "我出生、成长并在这个城镇老去。"
  npc_override_wolfvill_quests_18_i_bought_because_someone_01b461: "这个？我买的，因为有人卖得很便宜！"
  npc_override_wolfvill_quests_18_i_brought_some_2441e5: "我带了一些，但是……"
  npc_override_wolfvill_quests_18_i_came_different_story_be7372: "我是为了另一个故事来的。"
  npc_override_wolfvill_quests_18_i_came_here_buy_some_3e5aed: "我是来这里买些武器的……"
  npc_override_wolfvill_quests_18_i_came_repay_favor_miria_aa2aa3: "我来顺便还米里亚姆姐姐一个人情。"
  npc_override_wolfvill_quests_18_i_cannot_guarantee_wheth_95fe47: "我无法保证那个家伙能否毫发无损地完成探险。如果我的身体状况更好，我会亲自带领探险。"
  npc_override_wolfvill_quests_18_i_chasing_guys_who_runni_5e5622: "我在追那些带着货物逃跑的家伙，然后就变成这样了。我没能找回所有东西，但我确实救回了一些……"
  npc_override_wolfvill_quests_18_i_couldn_t_find_job_08d7e2: "我找不到工作，考试也一直不及格，所以一气之下离开了家……"
