  npc_override_wolfvill_quests_18_really_big_problem_deba01: "这真是个大问题。"
  npc_override_wolfvill_quests_18_really_destructive_natur_77da08: "建造一个更卫生、更现代的诊所，以便在紧急情况下更快响应，这对自然和环境真的有那么大的破坏性吗？"
  npc_override_wolfvill_quests_18_really_e7da47: "真的吗？"
