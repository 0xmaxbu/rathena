  npc_override_wolfvill_quests_18_menu_mejai_51f0b7: "梅杰:当那个时候到来时，我会依靠你的帮助。"
  npc_override_wolfvill_quests_18_menu_mejai_52d0cb: "梅杰:完成了！你能把你刚采的半花带给我吗？"
  npc_override_wolfvill_quests_18_menu_mejai_631da6: "梅杰:你今天也辛苦了。请把剩下的交给我。"
  npc_override_wolfvill_quests_18_menu_mejai_65e626: "梅杰:回家好好照顾你的家人。这不是你唯一要做的事情。"
  npc_override_wolfvill_quests_18_menu_mejai_75322c: "梅杰:谢谢你的决定。让我们先从切割茎开始。"
  npc_override_wolfvill_quests_18_menu_mejai_773a35: "梅杰:做得好。接下来，我们会准备一个罐子来浸泡茎端。"
  npc_override_wolfvill_quests_18_menu_mejai_853955: "梅杰:请按适量混合。"
  npc_override_wolfvill_quests_18_menu_mejai_96547b: "梅杰:我现在把我做的秘粉加入水中混合。"
  npc_override_wolfvill_quests_18_menu_mejai_a3bfe9: "梅杰:请小心今天树附近盛开的半花。"
  npc_override_wolfvill_quests_18_menu_mejai_a8dd8e: "梅杰:你打算采集半花吗？"
  npc_override_wolfvill_quests_18_menu_mejai_a9c3b3: "梅杰:你似乎有事？有空的时候请来看我。"
  npc_override_wolfvill_quests_18_menu_mejai_abb472: "梅杰:你好。今天也让我们努力吧。"
  npc_override_wolfvill_quests_18_menu_mejai_b69c7b: "梅杰:首先，请把小罐子装满水。"
  npc_override_wolfvill_quests_18_menu_mejai_cd7094: "梅杰:哦，你来了？我们今天也精力充沛地开始吧？"
  npc_override_wolfvill_quests_18_menu_mejai_d82aa2: "梅杰:哦！你确定吗？"
  npc_override_wolfvill_quests_18_menu_mejai_e1187d: "梅杰:我们从切割半花的茎开始好吗？"
  npc_override_wolfvill_quests_18_menu_mejai_e8bbf9: "梅杰:现在，最后一步。"
  npc_override_wolfvill_quests_18_menu_mejai_f01d5d: "梅杰:这是一项我还在考虑的服务。也许我们可以在业务稳定一点后开始？"
  npc_override_wolfvill_quests_18_menu_mejai_f06386: "梅杰:既然今天还没结束，如果你今天碰巧提前完成了任务，请考虑在花房帮忙。"
  npc_override_wolfvill_quests_18_menu_mejai_f1c9d2: "梅杰:让我们假设半花在树下盛开，开始练习。"
  npc_override_wolfvill_quests_18_menu_mejai_f3d6d0: "梅杰:好的！加油！今天精力充沛地带回一些新鲜的半花。"
  npc_override_wolfvill_quests_18_menu_options_128043: "{0}:迷你艾莉:请把它从袋子里拿出来放在我头上。"
  npc_override_wolfvill_quests_18_menu_options_3111dd: "{0}:我应该以什么角度切割茎？"
  npc_override_wolfvill_quests_18_menu_options_3c05fb: "{0}:我应该在小瓶里放多少毫升水？"
  npc_override_wolfvill_quests_18_menu_options_44894d: "{0}:我已经写下了三个故事。让我们回到古德拉。"
  npc_override_wolfvill_quests_18_menu_options_50ea7b: "{0}:如果我们用一根结实的绳子加固轮子，它应该能滚动，你不这么认为吗？"
  npc_override_wolfvill_quests_18_menu_options_54dd1e: "{0}:已经走了。我们去追阿什林吧！"
  npc_override_wolfvill_quests_18_menu_options_62ea9f: "{0}:迷你艾莉:我很好奇一件事。"
  npc_override_wolfvill_quests_18_menu_options_651379: "{0}:我应该放多少克秘粉？"
  npc_override_wolfvill_quests_18_menu_options_663311: "{0}:？？"
  npc_override_wolfvill_quests_18_menu_options_7e5f3c: "{0}:如果外部非官方地找回货物并归还，领导层会如何处理？"
  npc_override_wolfvill_quests_18_menu_options_9861a2: "{0}:已经到了。你喜欢这里吗？哦……这里没有草。让我们找另一个地方。你有什么地方想去吗？"
  npc_override_wolfvill_quests_18_menu_options_9b720c: "{0}:迷你艾莉:即使对客人来说，这不也很可疑吗？"
  npc_override_wolfvill_quests_18_menu_options_b89d28: "{0}:迷你艾莉去哪里了？"
  npc_override_wolfvill_quests_18_menu_options_bab8ab: "{0}:迷你艾莉:你就这样让它像水一样流过去吗？"
  npc_override_wolfvill_quests_18_menu_options_c48dc0: "{0}:迷你艾莉:似乎有人不太适合这里。"
  npc_override_wolfvill_quests_18_menu_options_c97f5c: "{0}:迷你艾莉:闯入？"
  npc_override_wolfvill_quests_18_menu_options_d07520: "{0}:艾莉:请允许我解释。"
  npc_override_wolfvill_quests_18_menu_options_ee21a1: "{0}:似乎我已经听够了。让我们回到苏阿德。"
  npc_override_wolfvill_quests_18_menu_options_f8af50: "{0}:我应该留多少片叶子？"
  npc_override_wolfvill_quests_18_menu_options_fc3179: "{0}:我一发现丢失的货物就收集了。请检查数量……"
  npc_override_wolfvill_quests_18_menu_rookie_85386c: "新手守卫:神殿西边有入侵者！"
  npc_override_wolfvill_quests_18_menu_speaker_128ba8: "演讲者:如果我们现在不行动，阿鲁纳菲尔特的未来将陷入混乱！"
  npc_override_wolfvill_quests_18_menu_suad_1e101f: "苏阿德:让我们在这里结束主要会议。"
  npc_override_wolfvill_quests_18_menu_suad_3fdab0: "苏阿德:每个人都已就座。现在，让我们开始会议。"
  npc_override_wolfvill_quests_18_menu_suad_c2bde0: "苏阿德:够了，这不是我们脸红的地方。"
  npc_override_wolfvill_quests_18_merchant_maroll_c25e01: "来自马罗尔的商人{0}。"
  npc_override_wolfvill_quests_18_merchant_rencia_bd2567: "商人伦西亚~"
  npc_override_wolfvill_quests_18_merchant_sreen_9e14e7: "商人斯林。"
  npc_override_wolfvill_quests_18_merchant_who_came_combat_23d4cf: "还有一个穿着战斗服装来的商人。"
  npc_override_wolfvill_quests_18_merely_idealistic_narrat_ac9cba: "这只是一个脱离现实的理想主义叙事。"
  npc_override_wolfvill_quests_18_might_better_go_another_680ff9: "去另一个城市买可能会更好，虽然会很艰难……"
  npc_override_wolfvill_quests_18_might_shameless_request_91de6a: "这可能是一个无耻的请求，但我不是每天都有机会遇到像你这样的强者。"
  npc_override_wolfvill_quests_18_might_still_need_more_ti_9af4ba: "可能还需要更多时间，但阿哈布先生，到目前为止，他似乎可以成为一个好邻居。"
  npc_override_wolfvill_quests_18_minimizing_conflicts_as_420f82: "尽可能减少冲突并确保抗议安全结束……这就是我的意思。"
  npc_override_wolfvill_quests_18_miriam_5d2226: "米里亚姆……"
  npc_override_wolfvill_quests_18_miriam_7d5b34: "但是米里亚姆……"
  npc_override_wolfvill_quests_18_miriam_adventurer_then_i_5dd0fa: "米里亚姆，冒险者。那我把追踪托付给你们。"
  npc_override_wolfvill_quests_18_miriam_brought_some_info_99d91b: "米里亚姆带来了一些信息，让我们一起听听。"
  npc_override_wolfvill_quests_18_miriam_could_you_please_bcc1cc: "米里亚姆，你能找一些商人穿的衣服吗？"
  npc_override_wolfvill_quests_18_miriam_priest_yus_gone_t_b5d991: "米里亚姆和尤斯祭司去了神殿。"
  npc_override_wolfvill_quests_18_miriam_s_507e04: "米里亚姆，不是……"
  npc_override_wolfvill_quests_18_miriam_these_elly_9c249d: "米里亚姆，这些是{0}和……艾莉？"
  npc_override_wolfvill_quests_18_miriam_you_re_back_5287d6: "米里亚姆，你回来了？"
  npc_override_wolfvill_quests_18_mister_you_seem_like_out_3decc8: "先生你看起来像个外来者，所以省省你的浅薄同情吧。这种待遇对原住民来说很常见。"
  npc_override_wolfvill_quests_18_misterhave_you_seen_flow_f05856: "先生你在拉赫见过花店吗？"
  npc_override_wolfvill_quests_18_mmm_alright_absolutely_l_5cceb4: "嗯……好吧。但绝对不能泄露。"
  npc_override_wolfvill_quests_18_mom_mom_isn_t_our_57fe34: "妈妈，妈妈。我们的孩子不是真正的天才吗？"
  npc_override_wolfvill_quests_18_monsters_moving_dealing_72dc44: "移动或处理岩浆的怪物是障碍。"
  npc_override_wolfvill_quests_18_monsters_moving_luggage_e5b3d7: "搬运货物或处理岩浆的怪物是障碍。"
  npc_override_wolfvill_quests_18_more_importantly_ecab2d: "但更重要的是……"
  npc_override_wolfvill_quests_18_moreover_bloodshed_occur_b83214: "而且，随着流血事件的发生，原住民起义的谣言很快就会传开。总部袭击事件已经让情况很糟糕了。"
  npc_override_wolfvill_quests_18_moreover_causing_fights_bdc8bd: "而且，在神殿引起争斗也不是我们可以轻易忽视的问题。"
  npc_override_wolfvill_quests_18_moreover_establishing_si_30a76c: "而且，通过建立一个重要的商人协会，我已经能够为许多生活在拉赫的原住民居民提供就业机会……"
  npc_override_wolfvill_quests_18_moreover_motherless_wolf_e78b6b: "而且，这只失去母亲的狼崽无法独自生存。"
  npc_override_wolfvill_quests_18_most_all_i_don_t_d60418: "但最重要的是，我不认为你能那么耐心地训练它。"
  npc_override_wolfvill_quests_18_most_all_i_i_t_d0a995: "最重要的是，我……我无法忍受我们因为某些个人权力斗争而受苦，而不仅仅是神的旨意。"
  npc_override_wolfvill_quests_18_most_disturbing_sound_di_6823d9: "最扰乱睡眠的令人不安的声音是各种怪物的叫声"
  npc_override_wolfvill_quests_18_most_restaurants_use_our_f4b870: "大多数餐馆都用我们的食材。"
  npc_override_wolfvill_quests_18_mostly_skania_takes_care_fdfdde: "主要是斯堪尼亚照顾羊和鸡。几乎没有能适应这种地方的牛或猪。因此，牲畜在这里真的很珍贵。"
  npc_override_wolfvill_quests_18_mostly_they_re_people_ve_c6d965: "主要是，他们是发泄个人不满而不是提出正式投诉的人，在神殿入口制造骚乱或大喊大叫。"
  npc_override_wolfvill_quests_18_mother_8d4438: "母亲。"
  npc_override_wolfvill_quests_18_mother_coming_find_her_c_3a1cd1: "母亲来找她的幼崽了！"
  npc_override_wolfvill_quests_18_mother_what_should_we_no_667cd3: "母亲。我们现在该怎么办？"
