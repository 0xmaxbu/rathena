  npc_override_wolfvill_quests_18_really_i_m_little_startl_3b1d6b: "真的吗？我有点被吓到了……心跳得好快。"
  npc_override_wolfvill_quests_18_really_kind_person_who_g_620164: "……那真的是受大人们青睐的人吗？他们太……太……固执了。"
