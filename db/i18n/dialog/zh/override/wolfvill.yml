  npc_override_wolfvill_quests_18_so_adventurer_please_lis_e713f3: "那么，冒险者，请和我们一起听苏阿德的故事。"
  npc_override_wolfvill_quests_18_so_adventurer_visiting_r_b6a333: "那么……冒险者是第一次来拉赫吗？"
  npc_override_wolfvill_quests_18_so_go_rachel_buy_some_3c5a60: "那么，去拉赫买些酱汁吧。"
  npc_override_wolfvill_quests_18_so_how_did_you_save_4bd471: "那么，你是怎么保住那条腿的？"
  npc_override_wolfvill_quests_18_so_i_developed_water_pur_c9b5a5: "所以我开发了一个净水神器……"
  npc_override_wolfvill_quests_18_so_i_ll_leave_direct_04a8c8: "那么，直接接触就交给你们和冒险者了，玛拉。"
  npc_override_wolfvill_quests_18_so_i_m_going_back_b3c6a0: "那么……我要……回拉赫……你觉得呢？"
  npc_override_wolfvill_quests_18_so_i_m_just_asking_54d1ee: "那么，我只是从你这边打听点信息。"
  npc_override_wolfvill_quests_18_so_i_plan_contract_numer_da3231: "那么，我打算和众多冒险者签约。当然，先生，你也会是其中之一，对吧？"
  npc_override_wolfvill_quests_18_so_i_ve_been_trying_de50be: "所以我一直试图尽我所能。但如果每个人都讨厌我。"
  npc_override_wolfvill_quests_18_so_let_s_drink_cheers_2c7ea5: "那么，来喝一杯吧！干杯，干杯！"
  npc_override_wolfvill_quests_18_so_let_s_think_about_968455: "所以我们不要想着选边站，而是试着互相说服。"
  npc_override_wolfvill_quests_18_so_long_long_ago_time_84e30b: "那么，很久很久以前。在遥远的过去，住着一位铁匠……"
  npc_override_wolfvill_quests_18_so_miriam_here_s_thing_6290bb: "那么，米里亚姆，事情是这样的。"
  npc_override_wolfvill_quests_18_so_much_connection_rathe_1828f0: "与其说是联系，不如说是……"
  npc_override_wolfvill_quests_18_so_much_work_given_today_6ccdbe: "今天给了这么多工作，我不确定是否能按时完成所有事情……"
  npc_override_wolfvill_quests_18_so_now_we_going_break_5d50c6: "那么，从现在开始，我们要把挡路的一切都打破吗？"
  npc_override_wolfvill_quests_18_so_please_don_t_chase_919961: "所以请不要赶我走。"
  npc_override_wolfvill_quests_18_so_please_don_t_chase_f3e26f: "那么……请不要把我从这里赶走。"
  npc_override_wolfvill_quests_18_so_s_my_lifelong_wish_c36cf2: "所以那是我毕生的愿望。让那个老顽固变成一个人。"
  npc_override_wolfvill_quests_18_so_shall_we_start_talkin_1f1675: "那么，我们先从和^e5555e村民们^000000谈话开始吧？"
  npc_override_wolfvill_quests_18_so_something_i_really_wa_7fbf66: "所以这是我真正希望你帮忙的事情，冒险者。"
  npc_override_wolfvill_quests_18_so_there_s_no_one_6872e2: "那么，没有人会因为参加会议就干涉会议。"
  npc_override_wolfvill_quests_18_so_um_what_name_i_63b85a: "……那么，嗯，名字是什么？我不太记得了，但总之，重要的是……"
  npc_override_wolfvill_quests_18_so_until_next_time_then_84e6cf: "那么，下次再见……"
  npc_override_wolfvill_quests_18_so_upsetting_s_bit_bitte_2f172a: "有那么令人难过吗？有点苦涩……"
  npc_override_wolfvill_quests_18_so_we_fooled_bagot_s_3a0689: "那么，我们被巴戈特的诡计骗了，为了召唤女神而拿到伊米尔之心碎片？"
  npc_override_wolfvill_quests_18_so_we_re_waiting_them_68b8f8: "所以我们在等他们，如果要等太久，我们可能会考虑转移到下一个区域……"
  npc_override_wolfvill_quests_18_so_what_i_help_you_b6aa92: "那么，我能帮你什么？"
  npc_override_wolfvill_quests_18_so_what_i_m_asking_b5875c: "那么，我想问的是，你能 kindly 跟在后面照看他吗？我不能提供太多，但真诚地请求你的帮助。"
  npc_override_wolfvill_quests_18_so_what_i_m_saying_74c056: "所以我想说的是……我正在想办法。我什么时候说过砍完就回去？你能不能不要按自己的想法理解我的话？"
  npc_override_wolfvill_quests_18_so_what_if_we_try_8dba49: "那么，如果我们试着找出那些人并查明他们来自哪里呢？"
  npc_override_wolfvill_quests_18_so_where_my_hometown_241657: "那么我的家乡在哪里？"
  npc_override_wolfvill_quests_18_so_where_should_we_try_712c38: "那么，我们该去哪里吃呢？"
  npc_override_wolfvill_quests_18_so_who_you_eavesdropping_56170d: "那么，你是谁？偷听别人的闲话。真可耻。"
  npc_override_wolfvill_quests_18_so_why_bother_9d82a7: "那又何必呢？"
  npc_override_wolfvill_quests_18_so_why_don_t_you_e0d52e: "那么，你为什么不去说一次呢！我不会听你说的话！"
  npc_override_wolfvill_quests_18_so_wolf_cub_bf9b23: "所以这就是狼崽？"
  npc_override_wolfvill_quests_18_so_you_re_merchant_earli_473d92: "所以你就是之前那个商人。"
  npc_override_wolfvill_quests_18_so_you_up_358a46: "那么？你愿意吗？"
  npc_override_wolfvill_quests_18_so_your_interest_means_y_92fb53: "那么，你的兴趣意味着你愿意帮忙？"
  npc_override_wolfvill_quests_18_some_people_even_though_b5b421: "有些人，即使我们试图调和他们的意见，也指责我们是异端并制造骚乱，而另一些人则问我们还要容忍这些异端多久。我们很难解决这些情况。"
  npc_override_wolfvill_quests_18_some_people_found_unacce_c5d404: "有些人觉得这不可接受，^e5555e歧视我们^000000，称我们为灰色之子。但我母亲希望我们能成为外来者和原住民之间的桥梁。"
  npc_override_wolfvill_quests_18_some_people_say_smells_02e239: "有些人说闻起来很臭~"
  npc_override_wolfvill_quests_18_some_people_who_followed_26f13c: "有些人跟随神殿来这里定居，试图和 newcomers 一起生活，但^e5555e很多人无法忍受而离开了^000000或者……有些人^e5555e遭受了苦难^000000。"
  npc_override_wolfvill_quests_18_some_them_wealthy_among_ec88f8: "他们中有些人很富有，其中迪娜尤其掌握着重要的经济权力。"
  npc_override_wolfvill_quests_18_someone_coming_town_3fd36b: "这是有人要进城吗？"
  npc_override_wolfvill_quests_18_someone_giving_speech_lo_1e6f85: "有人在大声演讲。"
  npc_override_wolfvill_quests_18_someone_here_gave_speech_bf26bd: "有人在这里戴着面具演讲？"
  npc_override_wolfvill_quests_18_someone_left_their_lugga_ea7e0e: "有人把行李落下了。"
  npc_override_wolfvill_quests_18_someone_waving_me_distan_12ee30: "有人在远处向我挥手……"
  npc_override_wolfvill_quests_18_someone_who_hides_their_8bd761: "一个隐藏自己的错误然后无法挽回的人！一个不能为自己的行为负责的人！"
  npc_override_wolfvill_quests_18_someone_who_t_understand_401473: "一个听不懂话的人！一个笨蛋！一个让你重复说的人！一个在工作中表露情绪的人！"
  npc_override_wolfvill_quests_18_something_i_really_exper_b38ce5: "这是我真正经历过的事情。"
  npc_override_wolfvill_quests_18_something_related_securi_fafaf0: "对于与安全相关的事情来说，这很简单，不是吗。"
  npc_override_wolfvill_quests_18_something_trivial_becaus_8e9fc2: "小事？因为你所做的事，我们被贴上了叛军的标签。你给了他们攻击我们的借口！"
  npc_override_wolfvill_quests_18_sometimes_camping_like_i_fae322: "有时候，像这样露营也不错~~~"
  npc_override_wolfvill_quests_18_sometimes_monsters_come_c2016f: "有时候怪物会一路来到这里，即使我很累也会打扰我。"
  npc_override_wolfvill_quests_18_sometimes_they_ll_talk_a_639585: "有时候他们会在餐桌上谈论一些机密的事情，好像我们看不到他们一样。"
  npc_override_wolfvill_quests_18_sometimes_we_lend_priest_e70125: "有时候我们会借给祭司们。"
  npc_override_wolfvill_quests_18_sometimes_when_facing_mo_169900: "有时候面对怪物或感觉太累无法携带物品时，人们会像这样把行李藏起来然后继续前进。"
  npc_override_wolfvill_quests_18_sooner_you_adapt_life_he_6cb366: "你越快适应这里的生活，你就会过得越好。"
  npc_override_wolfvill_quests_18_sorry_about_5d75fe: "对此感到抱歉。"
  npc_override_wolfvill_quests_18_sorry_being_late_i_took_d8c733: "抱歉迟到了。我花了一些时间找人。"
  npc_override_wolfvill_quests_18_sorry_d449c9: "对不起。"
  npc_override_wolfvill_quests_18_sorry_getting_upset_no_r_4a0a97: "而且……为无缘无故发脾气道歉。"
  npc_override_wolfvill_quests_18_sorry_i_quickly_looked_n_ed96ef: "对不起！我很快找了新轮子，但找不到备用的……"
  npc_override_wolfvill_quests_18_sorry_long_journey_i_wan_232906: "抱歉旅途遥远。但我想给我的孩子喂些安全的东西。谢谢。"
  npc_override_wolfvill_quests_18_sorry_maybe_later_1e0ba6: "对不起，也许以后吧。"
  npc_override_wolfvill_quests_18_sorry_sorry_a9a0d4: "对不起对不起~"
  npc_override_wolfvill_quests_18_sorry_suadand_i_won_t_0f706f: "对不起，但苏阿德和我不能和你一起去……"
  npc_override_wolfvill_quests_18_sounds_fireflies_chatter_d22a18: "萤火虫的声音、大人的闲聊、野兽的声音……"
  npc_override_wolfvill_quests_18_sounds_like_good_fit_rig_6e1583: "听起来很合适，对吧？"
  npc_override_wolfvill_quests_18_sounds_like_good_idea_7b48eb: "听起来是个好主意。"
  npc_override_wolfvill_quests_18_sounds_so_he_we_t_c67a67: "从声音来看，他也是。毕竟我们不能忽视长者的意见，而且苏阿德也不是那种会卑躬屈膝的人。"
  npc_override_wolfvill_quests_18_speaker_continued_their_83c7fa: "演讲者继续演讲，完全没有理会观众席上的声音。"
  npc_override_wolfvill_quests_18_speaker_giving_speech_th_f45736: "一位演讲者正在发表关于尊重理想人类尊严的主题演讲，但似乎反而激起了一些观众的情绪。"
  npc_override_wolfvill_quests_18_speaking_which_adventure_2e1884: "说到这个，冒险者，我有个请求。"
  npc_override_wolfvill_quests_18_speech_knows_no_end_c15390: "演讲没完没了。"
  npc_override_wolfvill_quests_18_stay_calm_camille_now_le_11cf19: "冷静点，卡米尔。现在，我们不要急于下结论。延迟的惩罚是什么？"
  npc_override_wolfvill_quests_18_steam_escaping_cracked_c_002727: "蒸汽从裂缝中逸出。"
  npc_override_wolfvill_quests_18_steam_rising_various_pla_0ac1b9: "各处冒出的蒸汽确实是个大问题，不仅仅是怪物。"
  npc_override_wolfvill_quests_18_steel_i_ll_now_build_21df39: "有了这些钢铁，我现在要建造一个能够抵御任何天气、经得起任何元素的诊所。"
  npc_override_wolfvill_quests_18_steel_steel_when_come_oh_f1b46f: "钢铁！！钢铁，什么时候到！……哦，来了。你来了，冒险者。很重吧？给我。我不能让你多拿一秒，你是珍贵的人。谢谢。你做得很好。"
  npc_override_wolfvill_quests_18_still_fd8d00: "仍然……"
  npc_override_wolfvill_quests_18_still_i_don_t_know_79ae46: "但尽管如此，我不知道是谁开始的，突然那些家伙像那样增加了，这让我感到不安。"
  npc_override_wolfvill_quests_18_still_i_don_t_want_9d7cd1: "尽管如此，我不想在恢复时被怪物击中，所以你能帮我^e5555e清理附近的怪物^000000吗？"
  npc_override_wolfvill_quests_18_still_looks_dangerous_we_93e4d4: "看起来仍然很危险，但我们无论如何都需要表明我们的意图。"
  npc_override_wolfvill_quests_18_still_too_dangerous_so_w_5685e3: "这仍然太危险了，所以^ff0000等到你大约200级^000000再试一次！"
  npc_override_wolfvill_quests_18_still_we_re_all_playing_9cedf9: "但尽管如此，我们都像这样一起玩。"
  npc_override_wolfvill_quests_18_still_withholding_wages_3cacff: "尽管如此，拖欠工资是错误的"
  npc_override_wolfvill_quests_18_still_you_re_better_than_86ae57: "但尽管如此，你比我好。"
  npc_override_wolfvill_quests_18_stop_157018: "住手！！！！"
  npc_override_wolfvill_quests_18_stop_fidgeting_sit_still_98b7b6: "别动来动去，坐好。你坐立不安。"
  npc_override_wolfvill_quests_18_stop_mocking_suad_e8a512: "别嘲笑苏阿德。"
  npc_override_wolfvill_quests_18_stop_we_gathered_enough_399078: "停，我们已经收集了足够的意见吗？"
  npc_override_wolfvill_quests_18_storage_7b02f9: "仓库 1"
  npc_override_wolfvill_quests_18_storage_fee_z_ca7ae2: "仓库费用是200z。"
  npc_override_wolfvill_quests_18_store_all_mine_ffb7c5: "这家店都是我的！"
  npc_override_wolfvill_quests_18_store_cool_place_consume_f675fd: "存放在阴凉处，开封后尽快食用。"
  npc_override_wolfvill_quests_18_story_amira_told_you_d3fabe: "这是阿米拉告诉你的故事吗？"
  npc_override_wolfvill_quests_18_story_getting_longer_5ae76a: "故事越来越长了。"
  npc_override_wolfvill_quests_18_story_jormungand_being_s_dcd8aa: "耶梦加得被封印在所谓北方大陆的地方的故事也有讲述。"
  npc_override_wolfvill_quests_18_strange_76f38e: "奇怪？"
  npc_override_wolfvill_quests_18_strict_sense_i_belong_na_4919e8: "严格来说，我属于原住民。然而，我不想参与这场对抗。"
  npc_override_wolfvill_quests_18_stuff_here_7e2fd0: "东西在这里~"
  npc_override_wolfvill_quests_18_suad_7c6771: "苏阿德！"
  npc_override_wolfvill_quests_18_suad_bit_stubborn_you_kn_d922ee: "苏阿德可能有点固执，你知道的。我们需要有人稍微软化一下~"
  npc_override_wolfvill_quests_18_suad_don_t_you_think_31f12e: "苏阿德，你不认为你需要冷静一下吗？"
  npc_override_wolfvill_quests_18_suad_end_ffaa0b: "苏阿德？就这样结束了吗？"
  npc_override_wolfvill_quests_18_suad_f67051: "苏阿德。"
  npc_override_wolfvill_quests_18_suad_here_father_04a2b8: "苏阿德在这里。父亲。"
  npc_override_wolfvill_quests_18_suad_how_much_longer_we_96ca04: "苏阿德！我们还要这样生活多久？我感到如此不公平，我再也受不了了！"
  npc_override_wolfvill_quests_18_suad_if_you_don_t_3c99b0: "而且苏阿德，如果你不把事情整理好，森林居民的意见就会完全像这样分歧。"
  npc_override_wolfvill_quests_18_suad_late_1f06a9: "苏阿德迟到了……"
  npc_override_wolfvill_quests_18_suad_make_opening_declar_2f65dd: "苏阿德将做开场宣言。"
  npc_override_wolfvill_quests_18_suad_maram_i_request_you_d5e545: "苏阿德，马兰。我请求你们在会议前也花一点时间。"
  npc_override_wolfvill_quests_18_suad_may_said_he_must_41ea31: "苏阿德可能没有说过，但他一定已经想了很长时间了。"
  npc_override_wolfvill_quests_18_suad_please_speak_up_3d0d7a: "苏阿德，请发言。"
  npc_override_wolfvill_quests_18_suad_sensitive_about_4de85c: "^e5555e苏阿德^000000对此很敏感。"
  npc_override_wolfvill_quests_18_suad_suad_suad_something_647d27: "苏阿德！！！苏阿德，苏阿德！！！出大事了！大麻烦，大麻烦！！！苏阿德！听我说，听我说，苏阿德！！！"
  npc_override_wolfvill_quests_18_suad_tell_us_you_complet_c66832: "苏阿德？告诉我们。你完全不知道这个决定吗？你能诚实地说你与这件事没有任何关系吗？"
  npc_override_wolfvill_quests_18_suad_won_t_allow_outside_1516a1: "但^e5555e苏阿德^000000不会允许外来者进入村庄！"
  npc_override_wolfvill_quests_18_suad_you_re_being_too_af1dce: "苏阿德，你太谨慎了。我们会自己去做的。就像那些袭击上层的人一样。不会有什么事的。"
  npc_override_wolfvill_quests_18_suadand_maram_return_han_7e5c6f: "苏阿德和马兰将回去处理抗议活动。"
  npc_override_wolfvill_quests_18_such_fundamental_8cbfed: "如此根本的……"
  npc_override_wolfvill_quests_18_such_obvious_words_efd6fd: "如此明显的话。"
  npc_override_wolfvill_quests_18_suddenly_destroying_temp_78479d: "突然摧毁神殿，这是什么 nonsense，无缘无故地大吵大闹！"
  npc_override_wolfvill_quests_18_summary_yes_f5c548: "总之，是的。"
  npc_override_wolfvill_quests_18_support_those_who_make_w_e90204: "支持那些许愿的人……"
  npc_override_wolfvill_quests_18_sure_04b0c5: "当然"
  npc_override_wolfvill_quests_18_sure_37a98c: "当然。"
  npc_override_wolfvill_quests_18_sure_i_catch_them_all_d21b2d: "当然，我会把它们全部抓住。"
  npc_override_wolfvill_quests_18_sure_i_ll_check_atmosphe_29aa38: "当然，我今天会检查一下原住民和移民之间的气氛。如果你有什么特别需要帮助的，请告诉我。"
  npc_override_wolfvill_quests_18_sure_i_ll_take_you_3a684d: "当然，我会带你去散步。真的……我也必须去吗？我能信任你处理吗？"
  npc_override_wolfvill_quests_18_sure_s_bad_either_5b5089: "当然。那也不错。"
  npc_override_wolfvill_quests_18_sure_see_you_our_walk_ed4edc: "当然，那我们散步时见。"
  npc_override_wolfvill_quests_18_sure_see_you_tomorrow_dedda8: "当然。明天见。"
  npc_override_wolfvill_quests_18_sure_we_don_t_want_3a7835: "当然。我们不想被完全当作反动分子！"
  npc_override_wolfvill_quests_18_sure_what_else_could_7ecb66: "当然。还能是什么？"
  npc_override_wolfvill_quests_18_surely_mr_suad_you_re_44b9fe: "当然，苏阿德先生，你不会站在那些失败主义者一边吧？"
  npc_override_wolfvill_quests_18_suspicious_03b159: "可疑？"
  npc_override_wolfvill_quests_18_t_easy_acquire_such_weap_4b98ac: "获得这样的武器可不容易。"
