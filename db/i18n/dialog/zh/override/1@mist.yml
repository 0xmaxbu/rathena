Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@mist_HazyForest_able_talk_everybody_b7da76: "To be able to talk with everybody..."
  npc_override_1@mist_HazyForest_actually_i_m_speaking_yo_6ae5db: "Actually I'm not speaking your language."
  npc_override_1@mist_HazyForest_adventurer_forest_d7618a: "An adventurer in the forest."
  npc_override_1@mist_HazyForest_after_you_register_5dddd3: "after you register."
  npc_override_1@mist_HazyForest_although_seems_like_he_u_6f7c77: "Although it seems like he used most of his powers just to break the seal..."
  npc_override_1@mist_HazyForest_as_world_tree_became_uns_543fd6: "As the World Tree became unstable, the influence it had on the seal grew weak."
  npc_override_1@mist_HazyForest_as_you_approach_her_you_766773: "As you approach her, you smell the scent of flowers so strong that it makes you dizzy."
  npc_override_1@mist_HazyForest_as_you_hold_onto_mysteri_bb66d8: "As you hold onto the Mysterious Flower Seeds tightly,"
  npc_override_1@mist_HazyForest_atmosphere_somewhat_tens_aa924d: "The atmosphere is somewhat tense in the forest."
  npc_override_1@mist_HazyForest_come_inn_mora_b5606f: "Come to the inn in Mora."
  npc_override_1@mist_HazyForest_day_when_morocc_reveals_6bb4bb: "The day when Morocc reveals his despicable nature..."
  npc_override_1@mist_HazyForest_dragon_gone_crazy_guardi_795a8a: "A dragon gone crazy is not a guardian any more."
  npc_override_1@mist_HazyForest_even_sapha_stopped_enter_18cb7e: "...Even a Sapha would be stopped from entering the forest."
  npc_override_1@mist_HazyForest_everyone_who_goes_into_f_5c3114: "everyone who goes into the forest, just in case."
  npc_override_1@mist_HazyForest_facing_world_i_realized_7bfa15: "Facing the world, I realized..."
  npc_override_1@mist_HazyForest_flower_shook_violently_t_1bb929: "the flower shook violently and then became calm again."
  npc_override_1@mist_HazyForest_flower_started_shake_vio_e04f58: "The flower started to shake violently"
  npc_override_1@mist_HazyForest_forest_doesn_t_like_stra_b1f2d2: "This forest doesn't like strangers."
  npc_override_1@mist_HazyForest_good_luck_8e30d6: "Good luck!"
  npc_override_1@mist_HazyForest_great_great_48becb: "Great, great."
  npc_override_1@mist_HazyForest_guardian_slowly_looked_a_04d103: "The Guardian slowly looked away as if deep in thought."
  npc_override_1@mist_HazyForest_he_abandoned_his_duties_ea8000: "But he abandoned his duties as a guardian when he gave in to Morocc's temptation."
  npc_override_1@mist_HazyForest_he_seems_deep_thought_b2b6cb: "- He seems to be deep in thought. -"
  npc_override_1@mist_HazyForest_he_won_t_look_you_0aeecb: "He won't look at you. It's like he's not interested at all."
  npc_override_1@mist_HazyForest_hey_look_50e57d: "Hey, look!"
  npc_override_1@mist_HazyForest_hmm_9c4d28: "Hmm..."
  npc_override_1@mist_HazyForest_hopefully_we_see_each_ot_822309: "Hopefully, we will see each other again in Mora."
  npc_override_1@mist_HazyForest_however_82ccaf: "However..."
  npc_override_1@mist_HazyForest_huh_you_plan_pass_throug_af4341: "Huh? Do you plan to pass through here?"
  npc_override_1@mist_HazyForest_i_3c073b: "...Do I?"
  npc_override_1@mist_HazyForest_i_advise_against_if_you_d80a0d: "I will advise against it if you're just curious."
  npc_override_1@mist_HazyForest_i_always_new_friends_lik_47bded: "that I will always have new friends like you..."
  npc_override_1@mist_HazyForest_i_ask_your_help_somethin_acd084: "I will ask for your help with something."
  npc_override_1@mist_HazyForest_i_couldn_t_break_free_79bf43: "I couldn't break free from Morocc's temptation."
  npc_override_1@mist_HazyForest_i_discuss_some_things_hi_df7fec: "I have to discuss some things with him/her."
  npc_override_1@mist_HazyForest_i_don_t_deserve_guardian_ded090: "I don't deserve to be a guardian any more."
  npc_override_1@mist_HazyForest_i_don_t_fight_loneliness_a0f248: "I don't have to fight the loneliness any more."
  npc_override_1@mist_HazyForest_i_don_t_think_authority_7b6bb7: "I don't think the authority will give you permission, either."
  npc_override_1@mist_HazyForest_i_don_t_want_go_06d453: "I don't want to go with you."
  npc_override_1@mist_HazyForest_i_felt_too_great_sense_83853c: "I felt too great a sense of loss... it was much more painful than the loneliness I had endured for thousands of years."
  npc_override_1@mist_HazyForest_i_fulfill_my_duties_as_928f2e: "I will fulfill my duties as a guardian."
  npc_override_1@mist_HazyForest_i_guess_i_thank_you_d778a4: "I guess I have to thank you."
  npc_override_1@mist_HazyForest_i_haven_t_gotten_all_cee9a0: "I haven't gotten all of my powers back."
  npc_override_1@mist_HazyForest_i_ll_see_you_mora_841313: "I'll see you in Mora."
  npc_override_1@mist_HazyForest_i_ll_staying_here_while_56c059: "I'll be staying here for a while."
  npc_override_1@mist_HazyForest_i_ll_wait_her_wake_43d900: "I'll wait for her to wake up and get out of this forest."
  npc_override_1@mist_HazyForest_i_lost_control_myself_di_90a4d2: "I lost control of myself, and did what I shouldn't have done."
  npc_override_1@mist_HazyForest_i_m_afraid_s_beyond_0c8864: ".....I'm afraid it's beyond your ability, but I won't meddle in your affairs."
  npc_override_1@mist_HazyForest_i_m_ashamed_myself_falli_755c9e: "I'm ashamed of myself, falling for the sweet but empty words that came to me in my loneliness."
  npc_override_1@mist_HazyForest_i_m_asking_you_again_08ded9: "I'm asking you again."
  npc_override_1@mist_HazyForest_i_m_happy_though_0f8457: "I'm happy, though."
  npc_override_1@mist_HazyForest_i_m_looking_somebody_e9b708: "I'm looking for somebody."
  npc_override_1@mist_HazyForest_i_m_sorry_00dca6: "I'm sorry."
  npc_override_1@mist_HazyForest_i_m_sorry_i_t_9f7ca9: "I'm sorry I can't protect you."
  npc_override_1@mist_HazyForest_i_m_speaking_laphine_lan_64bf7e: "I'm speaking Laphine language."
  npc_override_1@mist_HazyForest_i_m_still_confused_i_d25c12: "I'm still confused, but I know what I did wrong."
  npc_override_1@mist_HazyForest_i_m_sure_protect_you_471248: "I'm sure it will protect you someday."
  npc_override_1@mist_HazyForest_i_m_too_tired_talk_4c6db7: "I'm too tired to talk to you."
  npc_override_1@mist_HazyForest_i_manage_her_my_own_6b985f: "I can manage her on my own."
  npc_override_1@mist_HazyForest_i_manage_my_own_2e36ff: "I can manage it on my own."
  npc_override_1@mist_HazyForest_i_need_rest_f67dc5: "I need rest."
  npc_override_1@mist_HazyForest_i_see_d90b05: "I see. {0}."
  npc_override_1@mist_HazyForest_i_see_fd141e: "I see..."
  npc_override_1@mist_HazyForest_i_see_forest_through_log_9ef3c1: "I see the forest through the log tunnel."
  npc_override_1@mist_HazyForest_i_see_you_ve_been_28bd33: "I see you've been into the forest before."
  npc_override_1@mist_HazyForest_i_something_give_you_88e67f: "I have something to give to you."
  npc_override_1@mist_HazyForest_i_thank_you_bottom_my_a90236: "I thank you, from the bottom of my heart."
  npc_override_1@mist_HazyForest_i_think_you_d_better_c63a95: "I think you'd better get some rest."
  npc_override_1@mist_HazyForest_i_thought_i_forsaken_04be54: "I thought I was forsaken..."
  npc_override_1@mist_HazyForest_i_told_you_step_back_0dce28: "I told you - step back if you don't want to die."
  npc_override_1@mist_HazyForest_i_understand_40038e: "I understand."
  npc_override_1@mist_HazyForest_i_ve_been_waiting_you_760466: "I've been waiting for you."
  npc_override_1@mist_HazyForest_i_ve_got_i_ve_db3760: "I've got it. I've written them down on the report here."
  npc_override_1@mist_HazyForest_i_ve_lost_everything_i_18891f: "...I've lost everything, but I'm happy now."
  npc_override_1@mist_HazyForest_i_waiting_him_9252b7: "I will be waiting for him."
  npc_override_1@mist_HazyForest_i_wanted_relieved_my_tho_f81411: "...I wanted to be relieved of my thousands of years of loneliness."
  npc_override_1@mist_HazyForest_i_wasn_t_my_right_bfccb3: "I wasn't in my right mind then."
  npc_override_1@mist_HazyForest_i_won_t_cry_loneliness_052f3e: "that I won't cry from loneliness again,"
  npc_override_1@mist_HazyForest_if_weren_t_you_i_cc6965: "If it weren't for you, I would still be wandering in the abyssal darkness."
  npc_override_1@mist_HazyForest_if_you_determined_pass_t_c86993: "If you are determined to pass through here,"
  npc_override_1@mist_HazyForest_if_you_something_say_say_109018: "If you have something to say, say it after we get out of the forest."
  npc_override_1@mist_HazyForest_if_you_survive_forest_co_0e5e03: "If you survive this forest, of course."
  npc_override_1@mist_HazyForest_information_you_gave_aha_a538f6: "The information you gave on Ahat was useful."
  npc_override_1@mist_HazyForest_loki_assassin_s_guild_b4a492: "Loki... from the Assassin's Guild."
  npc_override_1@mist_HazyForest_loki_comes_closer_b80be3: "(Loki comes closer.)"
  npc_override_1@mist_HazyForest_loki_nods_slightly_then_46da72: "Loki nods slightly and then looks away. -"
  npc_override_1@mist_HazyForest_loki_said_9ef153: "Loki said..."
  npc_override_1@mist_HazyForest_looks_like_i_enter_fores_6b6738: "It looks like I can enter the forest through the log tunnel."
  npc_override_1@mist_HazyForest_looks_like_some_special_ec8895: "It looks like it has some special use, but you're not sure what."
  npc_override_1@mist_HazyForest_may_blessing_mother_yggd_dbf9a5: "May the blessing of Mother Yggdrasil be with you..."
  npc_override_1@mist_HazyForest_may_cost_you_your_life_def3ef: "It may cost you your life."
  npc_override_1@mist_HazyForest_may_why_i_haven_t_2b65d0: "It may be why I haven't been forsaken - to realize that I'm not alone."
  npc_override_1@mist_HazyForest_maybe_you_humans_f97a6a: "but maybe you humans can."
  npc_override_1@mist_HazyForest_menu_chop_f0a088: "Chop down the garden tree.:Give up."
  npc_override_1@mist_HazyForest_menu_enter_bf7ab7: "Enter the tunnel.:Give up."
  npc_override_1@mist_HazyForest_menu_loud_074b22: "Loud Whisper: Useless, useless. Wandering around and around, you'll meet your end!"
  npc_override_1@mist_HazyForest_menu_loud_25a747: "Loud Whisper: Don't go out, wander around forever, and play with us!"
  npc_override_1@mist_HazyForest_menu_loud_3b26c1: "Loud Whisper: What are the forest keepers doing? What are the gardeners doing??"
  npc_override_1@mist_HazyForest_menu_loud_4f12c9: "Loud Whisper: They've come to the second deepest forest. Gardeners of the deep forest, watch out!"
  npc_override_1@mist_HazyForest_menu_no_c1c107: "No, I haven't.:Yes, I might have..."
  npc_override_1@mist_HazyForest_menu_observe_f65950: "Observe the reaction.:Stop the reaction."
  npc_override_1@mist_HazyForest_menu_okay_7226b1: "Okay.:What do you want?"
  npc_override_1@mist_HazyForest_menu_roaring_7922bf: "Roaring Whisper: all the gardeners will be waiting for you, with their clippers in their hands-!"
  npc_override_1@mist_HazyForest_menu_roaring_b8607e: "Roaring Whisper: The path is about to open. The tight bolts have been removed!"
  npc_override_1@mist_HazyForest_menu_roaring_be43d4: "Roaring Whisper: Where you get after wandering around, around and around, everybody you've met while wandering around, around and around,"
  npc_override_1@mist_HazyForest_menu_roaring_d9ccd5: "Roaring Whisper: A forest opened, another opened, and the other is going to open as well. Tito and Pumba, they are heading your way!"
  npc_override_1@mist_HazyForest_menu_the_025601: "The Dragon's Cry: Am I being punished... for abandoning the way... of the guardian...?"
  npc_override_1@mist_HazyForest_menu_venture_a01a0c: "Venture into the Hazy Forest.:Give up."
  npc_override_1@mist_HazyForest_menu_voice_34468d: "Voice in your head: ...Will you... save... me... please......?"
  npc_override_1@mist_HazyForest_menu_what_ea1450: "What's happening?:This girl...?"
  npc_override_1@mist_HazyForest_menu_whisper_298359: "Whisper of the Forest: So Tom's, Tomba's, Remi's, and Rem's garden trees were all chopped down?"
  npc_override_1@mist_HazyForest_menu_whisper_92a099: "Whisper: Who's this? Who's this!? The forest is open! Tom, Tomba, Tired Rem, Remi! Wake up!"
  npc_override_1@mist_HazyForest_menu_whisper_b574e2: "Whisper of the Forest: Trouble, trouble, we're in big trouble."
  npc_override_1@mist_HazyForest_menu_yes_cac114: "Yes, I do.:No, I don't."
  npc_override_1@mist_HazyForest_menu_you_c5a530: "You're not alone.:Those are very important duties."
  npc_override_1@mist_HazyForest_morocc_broke_himself_fre_600dfc: "And Morocc broke himself free from the seal."
  npc_override_1@mist_HazyForest_msg_61ce5a: "[{0}]"
  npc_override_1@mist_HazyForest_msg_79ef7f: "...."
  npc_override_1@mist_HazyForest_msg_e95f89: "....."
  npc_override_1@mist_HazyForest_my_atonement_e8898d: "But this is my atonement."
  npc_override_1@mist_HazyForest_nidi_don_t_forget_your_8ea202: "Nidi, don't forget your duties."
  npc_override_1@mist_HazyForest_no_bbc933: "... No."
  npc_override_1@mist_HazyForest_none_other_than_i_broke_a17fec: "It was none other than I that broke my bond with Yggdrasil."
  npc_override_1@mist_HazyForest_now_forest_won_t_reject_7b5325: "Now the forest won't reject you."
  npc_override_1@mist_HazyForest_now_go_log_tunnel_only_613f54: "Now go to the log tunnel, the only way to get into the Hazy Forest."
  npc_override_1@mist_HazyForest_now_i_know_i_ll_4d6ccb: "Now I know. I'll destroy Morocc with my own hands."
  npc_override_1@mist_HazyForest_now_she_won_t_wander_dd4025: "Now she won't wander around crazy any more."
  npc_override_1@mist_HazyForest_now_we_say_goodbye_here_097e09: "Now we have to say goodbye here."
  npc_override_1@mist_HazyForest_nydhogg_guardian_yggdras_2045cf: "This is Nydhogg, the Guardian of Yggdrasil,"
  npc_override_1@mist_HazyForest_nydhogg_one_guardians_wo_54725b: "Nydhogg was one of the guardians of the World Tree."
  npc_override_1@mist_HazyForest_obviously_no_one_taking_ca6303: "Obviously no one is taking care of it."
  npc_override_1@mist_HazyForest_oh_yes_s_late_i_03acaa: "...Oh, yes. It's late, but I have to fulfill my duties as a guardian."
  npc_override_1@mist_HazyForest_okay_least_forest_won_t_5a765b: "Okay, at least the forest won't reject you."
  npc_override_1@mist_HazyForest_only_bring_about_your_un_27c73b: "It will only bring about your untimely death..."
  npc_override_1@mist_HazyForest_other_side_me_became_sha_9cd39c: "The other side of me became a shadow and a reckless tyrant."
  npc_override_1@mist_HazyForest_party_leader_6f851f: "Party Leader {0}..."
  npc_override_1@mist_HazyForest_party_name_4e4d3d: "Party Name {0}..."
  npc_override_1@mist_HazyForest_perhaps_s_power_bifrost_869969: "Perhaps that's the power of Bifrost."
  npc_override_1@mist_HazyForest_phew_i_report_authority_10c5a1: "Phew. But I have to report to the authority"
  npc_override_1@mist_HazyForest_put_yourself_my_shoes_en_a24389: "Put yourself in my shoes, the entrance guard, and let me meet the representative of your party."
  npc_override_1@mist_HazyForest_removes_his_scarf_around_be9ba3: "(Removes his scarf from around his neck and hands it to you.)"
  npc_override_1@mist_HazyForest_ritual_didn_t_work_right_9fcf84: "But the ritual didn't work right. The servant of Morocc failed to break the seal."
  npc_override_1@mist_HazyForest_s_all_my_fault_736564: "It's all my fault."
  npc_override_1@mist_HazyForest_s_dangerous_forest_184d59: "It's dangerous in the forest."
  npc_override_1@mist_HazyForest_s_dangerous_there_bd9f5f: "It's dangerous in there."
  npc_override_1@mist_HazyForest_s_easy_going_through_for_72e13a: "It's not easy going through the forest."
  npc_override_1@mist_HazyForest_s_giant_flower_mysteriou_4a2a18: "It's a giant flower with mysterious energy."
  npc_override_1@mist_HazyForest_s_how_i_left_alone_e9ee97: "That's how I was left alone."
  npc_override_1@mist_HazyForest_s_impossible_too_rash_a59389: "That's impossible. Too rash."
  npc_override_1@mist_HazyForest_s_my_name_ac96cb: "That's my name."
  npc_override_1@mist_HazyForest_s_one_mysteries_bifrost_6bc1d0: "But it's one of the mysteries of Bifrost."
  npc_override_1@mist_HazyForest_s_reacting_mysterious_fl_0195c4: "It's reacting to the Mysterious Flower Seeds you have with you."
  npc_override_1@mist_HazyForest_s_right_power_world_tree_245c1c: "That's right. The power of the World Tree is linked to the whole world."
  npc_override_1@mist_HazyForest_s_too_late_83caa7: "It's not too late."
  npc_override_1@mist_HazyForest_s_what_i_always_me_64b107: "It's what I always have with me."
  npc_override_1@mist_HazyForest_s_what_s_good_you_038541: "That's what's good for you."
  npc_override_1@mist_HazyForest_s_why_all_those_disaster_5f04d9: "That's why all those disasters happened to Yggdrasil."
  npc_override_1@mist_HazyForest_s_yggdrasil_world_tree_s_ffaef2: "It's Yggdrasil the World Tree's will that has kept the seal from breaking."
  npc_override_1@mist_HazyForest_scent_strong_enough_burn_a2cd07: "A scent strong enough to burn your nose."
  npc_override_1@mist_HazyForest_seal_so_weak_break_open_f227af: "But the seal is so weak that it can break open any time."
  npc_override_1@mist_HazyForest_seems_like_you_chop_down_81ddca: "It seems like you can chop down the garden tree."
  npc_override_1@mist_HazyForest_seems_like_you_t_force_5fb286: "It seems like you can't force your way into the forest."
  npc_override_1@mist_HazyForest_seems_niddy_something_sa_466bba: "It seems Niddy has something to say to you."
  npc_override_1@mist_HazyForest_seems_you_completely_com_9cd3f7: "It seems you are completely comfortable with the place."
  npc_override_1@mist_HazyForest_sir_ea9eac: "....{0} sir."
  npc_override_1@mist_HazyForest_so_i_became_sinner_forgo_5a2d44: "So I became a sinner, forgotten to the world."
  npc_override_1@mist_HazyForest_so_we_meet_again_7778f2: "So we meet again."
  npc_override_1@mist_HazyForest_so_you_haven_t_d3f243: "So you haven't."
  npc_override_1@mist_HazyForest_so_you_ve_passed_through_bc8f98: "So you've passed through the forest."
  npc_override_1@mist_HazyForest_some_fools_performed_rit_145c63: "Some fools performed a ritual to break the seal that held Morocc."
  npc_override_1@mist_HazyForest_something_doesn_t_feel_r_f611ce: "Something doesn't feel right. Looks like something dangerous is going on, so you'd better turn back today."
  npc_override_1@mist_HazyForest_step_back_if_you_aren_3ca424: "Step back if you aren't ready."
  npc_override_1@mist_HazyForest_swing_forward_as_if_tryi_d07bc5: "and swing forward as if trying to send the seeds as far away as possible!!!"
  npc_override_1@mist_HazyForest_team_up_some_friends_go_bd8d43: "Team up with some friends and go together!"
  npc_override_1@mist_HazyForest_thanks_1da207: "Thanks!"
  npc_override_1@mist_HazyForest_thanks_listening_my_long_f7f0ef: "Thanks for listening to my long story."
  npc_override_1@mist_HazyForest_then_i_ll_ask_you_d76584: "Then I'll ask you a question."
  npc_override_1@mist_HazyForest_too_too_long_0261e7: "For too... too long..."
  npc_override_1@mist_HazyForest_wait_0a16ff: "Wait."
  npc_override_1@mist_HazyForest_we_ll_meet_again_if_d8d165: "We'll meet again, if you survive."
  npc_override_1@mist_HazyForest_we_may_meet_again_6444e3: "We may meet again."
  npc_override_1@mist_HazyForest_we_re_seeing_lot_each_fadb2c: "We're seeing a lot of each other these days."
  npc_override_1@mist_HazyForest_we_t_go_against_forest_969e7d: "We can't go against the forest,"
  npc_override_1@mist_HazyForest_we_understand_each_other_700124: "That we can understand each other even if we speak different languages."
  npc_override_1@mist_HazyForest_well_well_well_aren_t_e5fe35: "Well, well, well, aren't you being too rash?"
  npc_override_1@mist_HazyForest_well_you_ve_made_right_3a8c23: "Well, you've made the right decision."
  npc_override_1@mist_HazyForest_what_good_go_across_bifr_a48219: "What good is it to go across Bifrost?"
  npc_override_1@mist_HazyForest_what_you_going_now_188f3d: "What are you going to do now?"
  npc_override_1@mist_HazyForest_when_bond_between_guardi_202d92: "When the bond between the guardians and Yggdrasil broke, Yggdrasil became unstable."
