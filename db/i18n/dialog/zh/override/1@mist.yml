Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@mist_HazyForest_able_talk_everybody_b7da76: "能够和每个人交谈……"
  npc_override_1@mist_HazyForest_actually_i_m_speaking_yo_6ae5db: "实际上我说的不是你们的语言。"
  npc_override_1@mist_HazyForest_adventurer_forest_d7618a: "森林中的冒险者。"
  npc_override_1@mist_HazyForest_after_you_register_5dddd3: "在你注册之后。"
  npc_override_1@mist_HazyForest_although_seems_like_he_u_6f7c77: "虽然看起来他为了打破封印已经消耗了大部分力量……"
  npc_override_1@mist_HazyForest_as_world_tree_became_uns_543fd6: "随着世界树变得不稳定，它对封印的影响也变弱了。"
  npc_override_1@mist_HazyForest_as_you_approach_her_you_766773: "当你靠近她时，你闻到了浓烈到让你头晕的花香。"
  npc_override_1@mist_HazyForest_as_you_hold_onto_mysteri_bb66d8: "当你紧紧握住神秘花种时，"
  npc_override_1@mist_HazyForest_atmosphere_somewhat_tens_aa924d: "森林里的气氛有些紧张。"
  npc_override_1@mist_HazyForest_come_inn_mora_b5606f: "到莫拉的旅馆来。"
  npc_override_1@mist_HazyForest_day_when_morocc_reveals_6bb4bb: "梦罗克露出他卑鄙本性之日……"
  npc_override_1@mist_HazyForest_dragon_gone_crazy_guardi_795a8a: "发疯的龙不再是守护者。"
  npc_override_1@mist_HazyForest_even_sapha_stopped_enter_18cb7e: "……即使是萨法也会被阻止进入森林。"
  npc_override_1@mist_HazyForest_everyone_who_goes_into_f_5c3114: "每个进入森林的人，以防万一。"
  npc_override_1@mist_HazyForest_facing_world_i_realized_7bfa15: "面对世界，我意识到……"
  npc_override_1@mist_HazyForest_flower_shook_violently_t_1bb929: "花朵剧烈摇晃，然后又恢复了平静。"
  npc_override_1@mist_HazyForest_flower_started_shake_vio_e04f58: "花朵开始剧烈摇晃"
  npc_override_1@mist_HazyForest_forest_doesn_t_like_stra_b1f2d2: "这座森林不喜欢陌生人。"
  npc_override_1@mist_HazyForest_good_luck_8e30d6: "祝你好运！"
  npc_override_1@mist_HazyForest_great_great_48becb: "太好了，太好了。"
  npc_override_1@mist_HazyForest_guardian_slowly_looked_a_04d103: "守护者缓缓移开目光，仿佛在深思。"
  npc_override_1@mist_HazyForest_he_abandoned_his_duties_ea8000: "但他在屈服于梦罗克的诱惑时放弃了自己作为守护者的职责。"
  npc_override_1@mist_HazyForest_he_seems_deep_thought_b2b6cb: "- 他似乎在沉思。-"
  npc_override_1@mist_HazyForest_he_won_t_look_you_0aeecb: "他不会看你。就像他完全不感兴趣一样。"
  npc_override_1@mist_HazyForest_hey_look_50e57d: "嘿，看！"
  npc_override_1@mist_HazyForest_hmm_9c4d28: "嗯……"
  npc_override_1@mist_HazyForest_hopefully_we_see_each_ot_822309: "希望我们能再次在莫拉相见。"
  npc_override_1@mist_HazyForest_however_82ccaf: "然而……"
  npc_override_1@mist_HazyForest_huh_you_plan_pass_throug_af4341: "嗯？你打算从这里通过吗？"
  npc_override_1@mist_HazyForest_i_3c073b: "……我吗？"
  npc_override_1@mist_HazyForest_i_advise_against_if_you_d80a0d: "如果你只是好奇，我建议你不要这样做。"
  npc_override_1@mist_HazyForest_i_always_new_friends_lik_47bded: "我将永远拥有像你这样的新朋友……"
  npc_override_1@mist_HazyForest_i_ask_your_help_somethin_acd084: "我会请求你帮忙做一件事。"
  npc_override_1@mist_HazyForest_i_couldn_t_break_free_79bf43: "我无法摆脱梦罗克的诱惑。"
  npc_override_1@mist_HazyForest_i_discuss_some_things_hi_df7fec: "我必须和他/她讨论一些事情。"
  npc_override_1@mist_HazyForest_i_don_t_deserve_guardian_ded090: "我不再配做守护者了。"
  npc_override_1@mist_HazyForest_i_don_t_fight_loneliness_a0f248: "我不用再与孤独战斗了。"
  npc_override_1@mist_HazyForest_i_don_t_think_authority_7b6bb7: "我认为当局也不会给你许可。"
  npc_override_1@mist_HazyForest_i_don_t_want_go_06d453: "我不想和你一起去。"
  npc_override_1@mist_HazyForest_i_felt_too_great_sense_83853c: "我感到太大的失落感……这比我在数千年里忍受的孤独要痛苦得多。"
  npc_override_1@mist_HazyForest_i_fulfill_my_duties_as_928f2e: "我将履行我作为守护者的职责。"
  npc_override_1@mist_HazyForest_i_guess_i_thank_you_d778a4: "我想我必须感谢你。"
  npc_override_1@mist_HazyForest_i_haven_t_gotten_all_cee9a0: "我还没有恢复全部力量。"
  npc_override_1@mist_HazyForest_i_ll_see_you_mora_841313: "莫拉见。"
  npc_override_1@mist_HazyForest_i_ll_staying_here_while_56c059: "我会在这里待一段时间。"
  npc_override_1@mist_HazyForest_i_ll_wait_her_wake_43d900: "我会等她醒来并离开这座森林。"
  npc_override_1@mist_HazyForest_i_lost_control_myself_di_90a4d2: "我失去了自我控制，做了我不该做的事。"
  npc_override_1@mist_HazyForest_i_m_afraid_s_beyond_0c8864: "……恐怕这超出了你的能力，但我不会干涉你的事务。"
  npc_override_1@mist_HazyForest_i_m_ashamed_myself_falli_755c9e: "我为自己感到羞愧，在我孤独的时候被那些甜蜜却空洞的话语所诱惑。"
  npc_override_1@mist_HazyForest_i_m_asking_you_again_08ded9: "我再次请求你。"
  npc_override_1@mist_HazyForest_i_m_happy_though_0f8457: "不过，我很开心。"
  npc_override_1@mist_HazyForest_i_m_looking_somebody_e9b708: "我在找某个人。"
  npc_override_1@mist_HazyForest_i_m_sorry_00dca6: "对不起。"
  npc_override_1@mist_HazyForest_i_m_sorry_i_t_9f7ca9: "对不起，我无法保护你。"
  npc_override_1@mist_HazyForest_i_m_speaking_laphine_lan_64bf7e: "我说的是拉芬语。"
  npc_override_1@mist_HazyForest_i_m_still_confused_i_d25c12: "我仍然很困惑，但我知道我做错了什么。"
  npc_override_1@mist_HazyForest_i_m_sure_protect_you_471248: "我相信它总有一天会保护你。"
  npc_override_1@mist_HazyForest_i_m_too_tired_talk_4c6db7: "我太累了，不想和你说话。"
  npc_override_1@mist_HazyForest_i_manage_her_my_own_6b985f: "我可以自己照顾她。"
  npc_override_1@mist_HazyForest_i_manage_my_own_2e36ff: "我可以自己处理。"
  npc_override_1@mist_HazyForest_i_need_rest_f67dc5: "我需要休息。"
  npc_override_1@mist_HazyForest_i_see_d90b05: "我明白了。{0}。"
  npc_override_1@mist_HazyForest_i_see_fd141e: "我明白了……"
  npc_override_1@mist_HazyForest_i_see_forest_through_log_9ef3c1: "我透过原木隧道看到了森林。"
  npc_override_1@mist_HazyForest_i_see_you_ve_been_28bd33: "我知道你以前进过这座森林。"
  npc_override_1@mist_HazyForest_i_something_give_you_88e67f: "我有东西要给你。"
  npc_override_1@mist_HazyForest_i_thank_you_bottom_my_a90236: "我从心底感谢你。"
  npc_override_1@mist_HazyForest_i_think_you_d_better_c63a95: "我想你最好休息一下。"
  npc_override_1@mist_HazyForest_i_thought_i_forsaken_04be54: "我以为我被抛弃了……"
  npc_override_1@mist_HazyForest_i_told_you_step_back_0dce28: "我告诉过你——如果你不想死就退后。"
  npc_override_1@mist_HazyForest_i_understand_40038e: "我明白。"
  npc_override_1@mist_HazyForest_i_ve_been_waiting_you_760466: "我一直在等你。"
  npc_override_1@mist_HazyForest_i_ve_got_i_ve_db3760: "我明白了。我已经写在报告里了。"
  npc_override_1@mist_HazyForest_i_ve_lost_everything_i_18891f: "……我失去了一切，但我现在很开心。"
  npc_override_1@mist_HazyForest_i_waiting_him_9252b7: "我会等他。"
  npc_override_1@mist_HazyForest_i_wanted_relieved_my_tho_f81411: "……我想摆脱我数千年的孤独。"
  npc_override_1@mist_HazyForest_i_wasn_t_my_right_bfccb3: "我当时神志不清。"
  npc_override_1@mist_HazyForest_i_won_t_cry_loneliness_052f3e: "我不会再因孤独而哭泣，"
  npc_override_1@mist_HazyForest_if_weren_t_you_i_cc6965: "如果不是你，我还会在深渊的黑暗中徘徊。"
  npc_override_1@mist_HazyForest_if_you_determined_pass_t_c86993: "如果你决心要通过这里，"
  npc_override_1@mist_HazyForest_if_you_something_say_say_109018: "如果你有什么要说的，等我们出了森林再说。"
  npc_override_1@mist_HazyForest_if_you_survive_forest_co_0e5e03: "如果你能从这座森林中活下来，当然。"
  npc_override_1@mist_HazyForest_information_you_gave_aha_a538f6: "你提供的关于Ahat的信息很有用。"
  npc_override_1@mist_HazyForest_loki_assassin_s_guild_b4a492: "Loki……来自刺客公会。"
  npc_override_1@mist_HazyForest_loki_comes_closer_b80be3: "（Loki走近了。）"
  npc_override_1@mist_HazyForest_loki_nods_slightly_then_46da72: "Loki微微点头，然后移开目光。-"
  npc_override_1@mist_HazyForest_loki_said_9ef153: "Loki说……"
  npc_override_1@mist_HazyForest_looks_like_i_enter_fores_6b6738: "看起来我可以透过原木隧道进入森林。"
  npc_override_1@mist_HazyForest_looks_like_some_special_ec8895: "看起来它有一些特殊用途，但你不确定是什么。"
  npc_override_1@mist_HazyForest_may_blessing_mother_yggd_dbf9a5: "愿母亲伊格德拉希尔的祝福与你同在……"
  npc_override_1@mist_HazyForest_may_cost_you_your_life_def3ef: "这可能会让你付出生命的代价。"
  npc_override_1@mist_HazyForest_may_why_i_haven_t_2b65d0: "也许这就是为什么我没有被抛弃——意识到我并不孤单。"
  npc_override_1@mist_HazyForest_maybe_you_humans_f97a6a: "但也许你们人类可以。"
  npc_override_1@mist_HazyForest_menu_chop_f0a088: "砍倒花园树。:放弃。"
  npc_override_1@mist_HazyForest_menu_enter_bf7ab7: "进入隧道。:放弃。"
  npc_override_1@mist_HazyForest_menu_loud_074b22: "大声低语:没用，没用。到处游荡，到处游荡，你会遇到你的结局！"
  npc_override_1@mist_HazyForest_menu_loud_25a747: "大声低语:别出去，永远游荡，和我们一起玩！"
  npc_override_1@mist_HazyForest_menu_loud_3b26c1: "大声低语:森林守护者们在做什么？园丁们在做什么？？"
  npc_override_1@mist_HazyForest_menu_loud_4f12c9: "大声低语:他们来到了第二深的森林。深林园丁们，小心！"
  npc_override_1@mist_HazyForest_menu_no_c1c107: "不，我没有。:是的，也许有……"
  npc_override_1@mist_HazyForest_menu_observe_f65950: "观察反应。:停止反应。"
  npc_override_1@mist_HazyForest_menu_okay_7226b1: "好的。:你想要什么？"
  npc_override_1@mist_HazyForest_menu_roaring_7922bf: "咆哮低语:所有园丁都会等着你，手里拿着他们的剪刀——！"
  npc_override_1@mist_HazyForest_menu_roaring_b8607e: "咆哮低语:道路即将打开。紧固的螺栓已被移除！"
  npc_override_1@mist_HazyForest_menu_roaring_be43d4: "咆哮低语:你在到处游荡之后到达的地方，你在到处游荡时遇到的每个人，"
  npc_override_1@mist_HazyForest_menu_roaring_d9ccd5: "咆哮低语:一座森林打开了，另一座也打开了，还有一座也即将打开。Tito和Pumba，他们正在朝你走来！"
  npc_override_1@mist_HazyForest_menu_the_025601: "龙之泣:我是因为放弃了守护者的道路……而受到惩罚吗……？"
  npc_override_1@mist_HazyForest_menu_venture_a01a0c: "冒险进入迷雾森林。:放弃。"
  npc_override_1@mist_HazyForest_menu_voice_34468d: "你脑海中的声音:……你会……救……我吗……请……？"
  npc_override_1@mist_HazyForest_menu_what_ea1450: "发生了什么？:这个女孩……？"
  npc_override_1@mist_HazyForest_menu_whisper_298359: "森林低语:那么Tom的、Tomba的、Remi的和Rem的花园树都被砍倒了？"
  npc_override_1@mist_HazyForest_menu_whisper_92a099: "低语:这是谁？这是谁！？森林打开了！Tom，Tomba，疲惫的Rem，Remi！醒醒！"
  npc_override_1@mist_HazyForest_menu_whisper_b574e2: "森林低语:麻烦了，麻烦了，我们有大麻烦了。"
  npc_override_1@mist_HazyForest_menu_yes_cac114: "是的，我做过。:不，我没有。"
  npc_override_1@mist_HazyForest_menu_you_c5a530: "你并不孤单。:那些是非常重要的职责。"
  npc_override_1@mist_HazyForest_morocc_broke_himself_fre_600dfc: "梦罗克从封印中挣脱了。"
  npc_override_1@mist_HazyForest_msg_61ce5a: "[{0}]"
  npc_override_1@mist_HazyForest_msg_79ef7f: "……"
  npc_override_1@mist_HazyForest_msg_e95f89: "……"
  npc_override_1@mist_HazyForest_my_atonement_e8898d: "但这是我的赎罪。"
  npc_override_1@mist_HazyForest_nidi_don_t_forget_your_8ea202: "Nidi，别忘了你的职责。"
  npc_override_1@mist_HazyForest_no_bbc933: "……不。"
  npc_override_1@mist_HazyForest_none_other_than_i_broke_a17fec: "正是我打破了我与伊格德拉希尔的联系。"
  npc_override_1@mist_HazyForest_now_forest_won_t_reject_7b5325: "现在森林不会拒绝你了。"
  npc_override_1@mist_HazyForest_now_go_log_tunnel_only_613f54: "现在去原木隧道，那是进入迷雾森林的唯一途径。"
  npc_override_1@mist_HazyForest_now_i_know_i_ll_4d6ccb: "现在我知道了。我要亲手摧毁梦罗克。"
  npc_override_1@mist_HazyForest_now_she_won_t_wander_dd4025: "现在她不会再疯狂游荡了。"
  npc_override_1@mist_HazyForest_now_we_say_goodbye_here_097e09: "现在我们在这里道别。"
  npc_override_1@mist_HazyForest_nydhogg_guardian_yggdras_2045cf: "这是尼德霍格，伊格德拉希尔的守护者，"
  npc_override_1@mist_HazyForest_nydhogg_one_guardians_wo_54725b: "尼德霍格是世界树的守护者之一。"
  npc_override_1@mist_HazyForest_obviously_no_one_taking_ca6303: "显然没有人照顾它。"
  npc_override_1@mist_HazyForest_oh_yes_s_late_i_03acaa: "……哦，是的。虽然晚了，但我必须履行我作为守护者的职责。"
  npc_override_1@mist_HazyForest_okay_least_forest_won_t_5a765b: "好吧，至少森林不会拒绝你了。"
  npc_override_1@mist_HazyForest_only_bring_about_your_un_27c73b: "这只会让你过早死亡……"
  npc_override_1@mist_HazyForest_other_side_me_became_sha_9cd39c: "我的另一面变成了阴影和鲁莽的暴君。"
  npc_override_1@mist_HazyForest_party_leader_6f851f: "队伍队长 {0}……"
  npc_override_1@mist_HazyForest_party_name_4e4d3d: "队伍名称 {0}……"
  npc_override_1@mist_HazyForest_perhaps_s_power_bifrost_869969: "也许那就是彩虹桥的力量。"
  npc_override_1@mist_HazyForest_phew_i_report_authority_10c5a1: "呼。但我必须向当局报告"
  npc_override_1@mist_HazyForest_put_yourself_my_shoes_en_a24389: "设身处地为入口守卫想想，让我见见你队伍的代表。"
  npc_override_1@mist_HazyForest_removes_his_scarf_around_be9ba3: "（从脖子上取下围巾递给你。）"
  npc_override_1@mist_HazyForest_ritual_didn_t_work_right_9fcf84: "但仪式没有正确进行。梦罗克的仆从没能打破封印。"
  npc_override_1@mist_HazyForest_s_all_my_fault_736564: "都是我的错。"
  npc_override_1@mist_HazyForest_s_dangerous_forest_184d59: "森林里很危险。"
  npc_override_1@mist_HazyForest_s_dangerous_there_bd9f5f: "那里很危险。"
  npc_override_1@mist_HazyForest_s_easy_going_through_for_72e13a: "穿过森林并不容易。"
  npc_override_1@mist_HazyForest_s_giant_flower_mysteriou_4a2a18: "这是一朵具有神秘能量的巨大花朵。"
  npc_override_1@mist_HazyForest_s_how_i_left_alone_e9ee97: "那就是我被独自留下的方式。"
  npc_override_1@mist_HazyForest_s_impossible_too_rash_a59389: "那不可能。太鲁莽了。"
  npc_override_1@mist_HazyForest_s_my_name_ac96cb: "那是我的名字。"
  npc_override_1@mist_HazyForest_s_one_mysteries_bifrost_6bc1d0: "但它是彩虹桥的谜团之一。"
  npc_override_1@mist_HazyForest_s_reacting_mysterious_fl_0195c4: "它对你身上的神秘花种有反应。"
  npc_override_1@mist_HazyForest_s_right_power_world_tree_245c1c: "没错。世界树的力量与整个世界相连。"
  npc_override_1@mist_HazyForest_s_too_late_83caa7: "还不算太晚。"
  npc_override_1@mist_HazyForest_s_what_i_always_me_64b107: "这是我一直随身携带的东西。"
  npc_override_1@mist_HazyForest_s_what_s_good_you_038541: "那对你有好处。"
  npc_override_1@mist_HazyForest_s_why_all_those_disaster_5f04d9: "那就是伊格德拉希尔发生所有灾难的原因。"
  npc_override_1@mist_HazyForest_s_yggdrasil_world_tree_s_ffaef2: "是世界树伊格德拉希尔的意志阻止了封印被打破。"
  npc_override_1@mist_HazyForest_scent_strong_enough_burn_a2cd07: "浓烈到足以灼伤你鼻子的香气。"
  npc_override_1@mist_HazyForest_seal_so_weak_break_open_f227af: "但封印太弱，随时可能破裂。"
