  npc_override_dic_in01_quests_dicastes_i_must_start_research_c9a34c: "我必须开始研究了。"
  npc_override_dic_in01_quests_dicastes_i_must_taken_much_your_04632d: "一定占用了您很多时间。"
  npc_override_dic_in01_quests_dicastes_i_must_visit_village_oft_95523c: "我必须经常来村子，这样我的朋友们才不会担心。"
  npc_override_dic_in01_quests_dicastes_i_need_you_go_clear_8e9aa0: "我需要你去清除任何痕迹。"
  npc_override_dic_in01_quests_dicastes_i_need_you_investigate_d_adcb0d: "我需要你在旅途中以及在迪卡斯蒂斯进行调查。"
  npc_override_dic_in01_quests_dicastes_i_never_heard_any_advent_86b4cc: "但我从没听说过有来自米德加德的冒险者喜欢他的食物。总之他说他会尝试，所以给他弄100个苹果来。"
  npc_override_dic_in01_quests_dicastes_i_no_idea_how_he_16446c: "我不知道他会怎么用它们，但我想他在结识了许多冒险者之后，品味变得非常独特。"
  npc_override_dic_in01_quests_dicastes_i_no_idea_where_you_b1abd5: "我不知道你在哪里能弄到它们，但……祝你好运。"
  npc_override_dic_in01_quests_dicastes_i_no_information_share_y_ed69d7: "但我没有信息可以和你分享。"
  npc_override_dic_in01_quests_dicastes_i_no_regrets_as_long_ea9306: "只要我能揭露真相，我就无怨无悔。"
  npc_override_dic_in01_quests_dicastes_i_nothing_say_if_you_e5bac3: "如果你不给我证明文件，我没什么好说的。"
  npc_override_dic_in01_quests_dicastes_i_one_them_4ec06e: "我也是其中之一。"
  npc_override_dic_in01_quests_dicastes_i_only_able_get_bradium_34e567: "几天后才能拿到正在精炼的布拉迪姆。我们会让从外面工作回来的皮奥姆留在村子里休息。"
  npc_override_dic_in01_quests_dicastes_i_only_curious_personall_1c16a5: "我只是个人好奇。"
  npc_override_dic_in01_quests_dicastes_i_only_follow_orders_ba1b37: "我只是服从命令。"
  npc_override_dic_in01_quests_dicastes_i_only_get_suspicious_mo_5c98f1: "听了你的故事，我只会越来越怀疑。"
  npc_override_dic_in01_quests_dicastes_i_only_hope_nothing_sad_7800c9: "我只希望不会发生什么悲伤的事。"
  npc_override_dic_in01_quests_dicastes_i_only_hope_they_all_32fd5b: "我只希望他们都能健康平安。"
  npc_override_dic_in01_quests_dicastes_i_only_keep_my_injury_ba69fd: "我只能防止我的伤势恶化。"
  npc_override_dic_in01_quests_dicastes_i_only_pretend_i_am_7aacf2: "我只是假装而已。我也在调查阿哈特！"
