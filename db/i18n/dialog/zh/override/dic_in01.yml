  npc_override_dic_in01_quests_dicastes_i_m_telling_you_367caa: "我不会告诉你的~！"
  npc_override_dic_in01_quests_dicastes_i_m_thinking_distributin_0a0023: "我正在考虑在运营部大楼内分发它们。"
  npc_override_dic_in01_quests_dicastes_i_m_trying_organize_info_3a601b: "我正在整理我收集到的信息。"
  npc_override_dic_in01_quests_dicastes_i_m_under_spell_e0eb02: "我没有被咒语控制！"
  npc_override_dic_in01_quests_dicastes_i_m_very_tired_because_da9383: "我今天工作太多了，非常累。"
  npc_override_dic_in01_quests_dicastes_i_m_very_tired_casting_cbc198: "^4d4dff 我因为还没有完全觉醒，施咒语非常累。^000000"
  npc_override_dic_in01_quests_dicastes_i_m_willing_teach_you_81494e: "我愿意随时教你如何竖起柱子。"
  npc_override_dic_in01_quests_dicastes_i_meant_many_aspects_bad9c0: "我的意思是很多方面。"
  npc_override_dic_in01_quests_dicastes_i_might_able_use_perfume_7adc7e: "我可能可以利用这种香水对斯卡拉巴的反应来推进研究。"
  npc_override_dic_in01_quests_dicastes_i_might_try_make_special_115afb: "我可能会尝试制作一种特殊的鸡尾酒。我有信心做到，因为我曾经制作过很好的毒药。"
