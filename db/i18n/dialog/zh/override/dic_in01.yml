  npc_override_dic_in01_quests_dicastes_i_recently_did_some_repa_85f368: "我最近^f57d7d修理了村子旁边的洞穴^000000，但我工作时忘记带布拉迪姆了。"
  npc_override_dic_in01_quests_dicastes_i_recognize_you_bc7720: "我认识你。"
  npc_override_dic_in01_quests_dicastes_i_recommend_getting_drac_a0af4c: "我建议从附近的龙族身上获取。不过，它们只是随机掉落，所以你可能空手而归……"
