  npc_override_dic_in01_quests_dicastes_i_groom_myself_everyday_aa2308: "我必须每天梳理自己，才能保持闪亮蓬松的皮毛。但我本身的皮毛就不太好。很难过。"
  npc_override_dic_in01_quests_dicastes_i_guess_better_ahat_s_ea597e: "但我想这对阿哈特的肤色会更好……"
  npc_override_dic_in01_quests_dicastes_i_guess_i_t_anything_12a16f: "我想我也无能为力。"
  npc_override_dic_in01_quests_dicastes_i_guess_only_way_hiding_fe1dee: "我想这只会是一种隐藏你来自哪里的方式。"
  npc_override_dic_in01_quests_dicastes_i_guess_order_meet_busy_bbadc1: "我想为了会见忙碌的部长们，你必须至少为我们的社会做出贡献。"
  npc_override_dic_in01_quests_dicastes_i_guess_vyhannus_had_tru_991892: "我想维汉努斯对人类有信心。"
  npc_override_dic_in01_quests_dicastes_i_guess_you_heard_wrong_bdc039: "我想你听错了。"
  npc_override_dic_in01_quests_dicastes_i_haven_t_even_seen_9d7015: "我连部长都没见过。"
  npc_override_dic_in01_quests_dicastes_i_haven_t_seen_my_366ccf: "我没见过我在洞穴里一起工作的朋友们。"
  npc_override_dic_in01_quests_dicastes_i_heard_cat_say_my_a0cf40: "我亲耳听到那只猫这么说。"
  npc_override_dic_in01_quests_dicastes_i_heard_humans_call_ash_606c75: "我听人类叫它灰烬真空地带。"
  npc_override_dic_in01_quests_dicastes_i_heard_many_say_he_abc1b1: "我听很多人说他是美丽的。"
  npc_override_dic_in01_quests_dicastes_i_heard_many_stories_you_2dea1b: "我听说了很多你在这里活跃的故事。"
  npc_override_dic_in01_quests_dicastes_i_heard_my_way_pinqucula_976841: "我在路上听说这个平库库拉·达克有一朵枯萎的花。"
  npc_override_dic_in01_quests_dicastes_i_heard_some_craftsmen_o_c44f55: "我听说城外的一些工匠也可以给装备施咒语。"
  npc_override_dic_in01_quests_dicastes_i_heard_there_merchant_a_f86372: "我听说冒险者之城有一个商人卖玻璃管。我需要 4 个。"
  npc_override_dic_in01_quests_dicastes_i_heard_there_superior_e_5b02bf: "我听说马努克首都有一位高级装备升级工匠。"
  npc_override_dic_in01_quests_dicastes_i_heard_there_trend_amon_0d1d35: "我听说我的很多同事这里流行一种用米德加尔特鸟羽制作的音乐饰品。"
  npc_override_dic_in01_quests_dicastes_i_heard_where_you_came_ec2e23: "我听你来自的地方有宠物……"
  npc_override_dic_in01_quests_dicastes_i_heard_you_chosen_visit_40a44e: "我听说你被选中访问萨法的首都埃尔·狄卡斯特斯。"
  npc_override_dic_in01_quests_dicastes_i_heard_you_offering_hig_fcf26c: "我听说你提供高品质的鱼来支付我们的通行费。"
  npc_override_dic_in01_quests_dicastes_i_heard_you_visiting_el_3d9aca: "我听说你要访问萨法的首都埃尔·狄卡斯特斯。"
  npc_override_dic_in01_quests_dicastes_i_honestly_think_both_sa_1d622b: "老实说，我认为萨法和拉皮涅都不会从中得到任何好处。"
  npc_override_dic_in01_quests_dicastes_i_hope_he_getting_used_3d97ac: "我希望他能适应他的新工作。"
  npc_override_dic_in01_quests_dicastes_i_hope_light_el_dicastes_c1d2a2: "我希望埃尔·狄卡斯特斯之光能为你指引道路。"
  npc_override_dic_in01_quests_dicastes_i_hope_see_you_next_9e0fe4: "希望下次见到你。"
  npc_override_dic_in01_quests_dicastes_i_hope_they_all_doing_277593: "我希望他们都过得好。"
  npc_override_dic_in01_quests_dicastes_i_hope_you_like_6326cc: "希望你喜欢。"
  npc_override_dic_in01_quests_dicastes_i_introduce_you_agent_wh_e36d17: "我会介绍一个代理人给你，他会无条件送你去另一个世界，只需 50,000 Zeny。"
  npc_override_dic_in01_quests_dicastes_i_investigate_manuk_sple_89ab50: "我会调查马努克和斯普伦迪德。"
  npc_override_dic_in01_quests_dicastes_i_investigating_location_1a0615: "我在被认为是袭击发生地点的位置进行调查"
  npc_override_dic_in01_quests_dicastes_i_invite_you_el_dicastes_05b514: "我邀请你到我们首都埃尔·狄卡斯特斯。"
  npc_override_dic_in01_quests_dicastes_i_itch_probably_bug_bite_766105: "我痒，可能是被虫子咬了。"
  npc_override_dic_in01_quests_dicastes_i_joking_before_08af57: "我之前是开玩笑的。"
  npc_override_dic_in01_quests_dicastes_i_just_came_back_after_19d54a: "我刚见完朋友们回来！"
  npc_override_dic_in01_quests_dicastes_i_just_found_amazing_cho_fcf4dd: "我几天前刚发现这个惊人的巧克力食谱。"
  npc_override_dic_in01_quests_dicastes_i_just_got_request_s_a69c58: "我刚接到一个委托。幸好我们谁也没浪费时间。"
  npc_override_dic_in01_quests_dicastes_i_just_hope_his_conditio_910bed: "我只希望他的状况不会恶化。"
  npc_override_dic_in01_quests_dicastes_i_just_offer_you_27e862: "我只能给你"
  npc_override_dic_in01_quests_dicastes_i_knew_i_could_count_20980b: "我就知道我可以依靠你。"
  npc_override_dic_in01_quests_dicastes_i_knew_they_working_all_501ca0: "我知道他们一直在工作，忘了回村子。"
  npc_override_dic_in01_quests_dicastes_i_know_actual_materials_c17b2d: "我不知道实际使用的材料是什么，但它们足够强大，可以附魔多达 3 种升级魔法咒语。"
  npc_override_dic_in01_quests_dicastes_i_know_your_abilities_c4e519: "我知道你的能力"
  npc_override_dic_in01_quests_dicastes_i_let_you_know_your_553668: "我会告诉你你的任务。"
  npc_override_dic_in01_quests_dicastes_i_like_complete_request_6fbc58: "我想为你完成一个委托，但你现在没有任何进行中的委托。"
  npc_override_dic_in01_quests_dicastes_i_like_my_job_so_0ffc92: "我喜欢我的工作，但它太累了。"
  npc_override_dic_in01_quests_dicastes_i_like_speak_person_e788e1: "我想当面说。"
  npc_override_dic_in01_quests_dicastes_i_like_try_you_out_d91454: "我想试试你"
  npc_override_dic_in01_quests_dicastes_i_ll_ask_you_again_d17902: "我会再问你一次。"
  npc_override_dic_in01_quests_dicastes_i_ll_give_you_deal_1b6f3f: "我会给你一个优惠，每个卖 500 Zeny。但是，尽量不要把它带进斯卡拉巴大厅。"
  npc_override_dic_in01_quests_dicastes_i_ll_rephrase_my_questio_d9e453: "我会重新表述我的问题。"
  npc_override_dic_in01_quests_dicastes_i_ll_return_village_soon_f963ed: "我很快会回村子。"
  npc_override_dic_in01_quests_dicastes_i_ll_return_you_04a258: "我会还给你的。"
  npc_override_dic_in01_quests_dicastes_i_ll_send_you_back_669abd: "我马上送你回去！"
  npc_override_dic_in01_quests_dicastes_i_loved_d66856: "而且我很喜欢！"
  npc_override_dic_in01_quests_dicastes_i_m_agent_geck_cat_18d280: "我是猫爪商人的代理人盖克。"
  npc_override_dic_in01_quests_dicastes_i_m_also_curious_who_13d043: "我也很好奇这个阿哈特是谁。"
  npc_override_dic_in01_quests_dicastes_i_m_always_watching_ahat_81c8bf: "我一直在监视阿哈特。"
  npc_override_dic_in01_quests_dicastes_i_m_busy_5300b0: "我很忙。"
  npc_override_dic_in01_quests_dicastes_i_m_busy_don_t_6d1117: "我没那么忙，但别太烦我。"
  npc_override_dic_in01_quests_dicastes_i_m_cat_paw_merchant_0bee77: "我是猫爪商人的新星，塔特。"
  npc_override_dic_in01_quests_dicastes_i_m_collecting_signs_get_14daa1: "我在收集讨好贾雷克的迹象……算了。我会告诉他们你是我的赞助者！"
  npc_override_dic_in01_quests_dicastes_i_m_done_hehe_27dd53: "我完成了。嘿嘿"
  npc_override_dic_in01_quests_dicastes_i_m_easy_cat_you_f780d3: "我不是一只容易对付的猫，你知道的。"
  npc_override_dic_in01_quests_dicastes_i_m_far_because_takes_352e1e: "但我离那很远，因为像我这样的低等生物要见他，需要很高的地位和一些贿赂。"
  npc_override_dic_in01_quests_dicastes_i_m_finally_used_meeting_7e9109: "我终于习惯了和你这样的其他种族见面。"
  npc_override_dic_in01_quests_dicastes_i_m_fine_as_long_b1ecfa: "只要维汉努斯批准了你，我就没问题。"
  npc_override_dic_in01_quests_dicastes_i_m_forever_your_debt_d28638: "{0}，我永远欠你的！"
  npc_override_dic_in01_quests_dicastes_i_m_getting_tired_we_b74732: "我累了。我们可以进去继续聊吗。"
  npc_override_dic_in01_quests_dicastes_i_m_glad_i_got_c8b551: "我很高兴在为时已晚之前打了一针 ^f57d7d 布拉迪姆^000000。"
  npc_override_dic_in01_quests_dicastes_i_m_glad_you_feel_6cc91c: "我很高兴你感觉好些了。"
  npc_override_dic_in01_quests_dicastes_i_m_going_remove_all_b60f4b: "我要移除你埃尔·狄卡斯特斯之光上的所有附魔。"
  npc_override_dic_in01_quests_dicastes_i_m_going_your_personal_0e3e1b: "我不会成为你的私人翻译。"
  npc_override_dic_in01_quests_dicastes_i_m_grateful_i_still_2e8a13: "但我很感激我还能四处走动。"
  npc_override_dic_in01_quests_dicastes_i_m_happier_than_when_2c387a: "但我比当尼特时更快乐。"
  npc_override_dic_in01_quests_dicastes_i_m_inspector_dispatched_2087d6: "我是因报告案件而从祖国派来的调查员。"
  npc_override_dic_in01_quests_dicastes_i_m_item_i_merciful_85396b: "我不是物品！！如果你把我当物品对待，我不会仁慈的！！"
  npc_override_dic_in01_quests_dicastes_i_m_leaving_now_adc9e2: "我现在要走了。"
  npc_override_dic_in01_quests_dicastes_i_m_little_excited_b5d917: "我有点兴奋。"
  npc_override_dic_in01_quests_dicastes_i_m_little_tired_now_bf311c: "我现在有点累了。"
  npc_override_dic_in01_quests_dicastes_i_m_love_378678: "我恋爱了！"
  npc_override_dic_in01_quests_dicastes_i_m_now_risking_my_4dc20a: "我现在冒着生命危险"
  npc_override_dic_in01_quests_dicastes_i_m_okay_now_743560: "我……现在没事了……"
  npc_override_dic_in01_quests_dicastes_i_m_one_receiving_reques_6e16a1: "我不是接受委托的人，我是发布委托的人！！"
