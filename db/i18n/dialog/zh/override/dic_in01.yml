  npc_override_dic_in01_quests_dicastes_i_perished_into_ashes_he_26d295: "要不是你，我早就化为灰烬了！"
  npc_override_dic_in01_quests_dicastes_i_personal_request_i_hea_15225e: "我有个私人请求。我听说米德加德有一种圆形的透明手工艺品。"
  npc_override_dic_in01_quests_dicastes_i_prepare_myself_confron_8db2f0: "我会准备好自己，随时在他成为威胁时与他对峙。"
  npc_override_dic_in01_quests_dicastes_i_really_don_t_like_4d7322: "我真的不喜欢变得僵硬。"
