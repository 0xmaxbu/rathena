  npc_override_dic_in01_dicastes_my_factory_bae3c4: "在我的工厂"
  npc_override_dic_in01_dicastes_never_mind_8721eb: "没关系。"
  npc_override_dic_in01_dicastes_no_i_m_sure_nobody_670961: "不，我确信米德加德没有人想尝试这个。"
  npc_override_dic_in01_dicastes_no_legend_share_c728fc: "没有什么传说可以分享"
  npc_override_dic_in01_dicastes_now_s_like_bad_habit_2b0076: "现在就像个坏习惯。"
  npc_override_dic_in01_dicastes_oh_feels_so_refreshed_8f4bfd: "哦，感觉好清爽。"
  npc_override_dic_in01_dicastes_oh_you_didn_t_ask_d78a1e: "哦，你没问？"
  npc_override_dic_in01_dicastes_oh_you_seem_know_b23926: "哦，你似乎知道？"
  npc_override_dic_in01_dicastes_only_matter_time_before_89f064: "萨法统治这片土地只是时间问题"
  npc_override_dic_in01_dicastes_only_sapha_pride_1c45b9: "只有萨法的骄傲。"
  npc_override_dic_in01_dicastes_only_zeny_c158a3: "只要5000 Zeny"
  npc_override_dic_in01_dicastes_ordinary_piom_b67e09: "普通的皮奥姆。"
  npc_override_dic_in01_dicastes_our_childhood_lasts_year_83b3d9: "我们的童年持续10年，"
  npc_override_dic_in01_dicastes_poor_d32278: "可怜的人。"
  npc_override_dic_in01_dicastes_refined_bradium_best_eve_1ea47a: "精炼的布拉迪姆是最好的。你想试试吗？"
  npc_override_dic_in01_dicastes_resting_always_so_sweet_1ecb1b: "休息总是很甜蜜。"
  npc_override_dic_in01_dicastes_robes_than_leather_b9ad49: "长袍比皮革。"
  npc_override_dic_in01_dicastes_rough_so_many_outsiders_405f5d: "很粗糙，所以很多外来者进不来。哈哈"
