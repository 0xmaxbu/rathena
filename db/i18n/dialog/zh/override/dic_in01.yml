  npc_override_dic_in01_quests_dicastes_i_already_had_bad_luck_034839: "我已经够倒霉了，掉进斯卡拉巴大厅，还被这可怕的 ^FF0000 恶臭^000000 淋了个透，我的头开始疼了！"
