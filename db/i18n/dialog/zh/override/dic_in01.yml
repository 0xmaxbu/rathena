  npc_override_dic_in01_quests_dicastes_i_think_he_slipped_fell_14087e: "我想他滑倒了，摔在了女王甲虫的分泌物上。我原以为是意外，正在调查。"
  npc_override_dic_in01_quests_dicastes_i_think_i_need_cup_813712: "我想我需要一杯水。"
