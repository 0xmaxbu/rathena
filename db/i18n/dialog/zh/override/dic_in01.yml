  npc_override_dic_in01_quests_dicastes_i_shouldn_t_worried_beca_4f0744: "我不应该担心的，因为他非常勤奋，但是……"
  npc_override_dic_in01_quests_dicastes_i_smell_something_fishy_7d52e0: "……我闻到有什么不对劲。"
  npc_override_dic_in01_quests_dicastes_i_some_doubts_about_your_fdc6d8: "我对你的信息有些怀疑。我会再考虑一下。"
