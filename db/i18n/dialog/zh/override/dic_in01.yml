  npc_override_dic_in01_quests_dicastes_i_m_sorry_take_your_b30541: "很抱歉占用你的时间。我现在送你出去。"
  npc_override_dic_in01_quests_dicastes_i_m_still_jarute_dicaste_6a38d1: "我仍然是狄卡斯特斯的贾鲁特，有成堆的工作要做。"
