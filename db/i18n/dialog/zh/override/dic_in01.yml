  npc_override_dic_in01_quests_dicastes_i_think_you_change_your_75eaff: "但我认为你会改变主意的。"
  npc_override_dic_in01_quests_dicastes_i_thinking_088878: "我正在想。"
  npc_override_dic_in01_quests_dicastes_i_thought_better_him_tak_f86dde: "我以为让他带个护卫会更好，但是。"
  npc_override_dic_in01_quests_dicastes_i_thought_i_d_return_2fa5a9: "我以为我会回老家退休。"
  npc_override_dic_in01_quests_dicastes_i_thought_simple_since_h_59aa2c: "我以为既然他在做，那应该很简单。"
  npc_override_dic_in01_quests_dicastes_i_thought_you_already_kn_5f1b23: "我以为你已经知道了.."
  npc_override_dic_in01_quests_dicastes_i_thought_you_brought_sh_0109ff: "我以为你把谢伊的食物当作奖励带来了。"
  npc_override_dic_in01_quests_dicastes_i_thought_you_like_me_dd1c2c: "从你的前臂来看，我以为你和我一样。"
  npc_override_dic_in01_quests_dicastes_i_tropical_sograt_vermil_7f1373: "我从摩洛克的索格拉特海滩空运了热带索格拉特和朱红色。"
  npc_override_dic_in01_quests_dicastes_i_trouble_if_i_don_2d9095: "但如果我不回村子拿布拉迪姆，我会有麻烦的。"
  npc_override_dic_in01_quests_dicastes_i_understand_him_since_h_9ca18b: "我能理解他，因为他离家很久了。如果你碰巧去米德加德，请试着弄一些来。"
  npc_override_dic_in01_quests_dicastes_i_understand_you_t_help_3e9529: "我理解你，但看到我的样子还是忍不住惊讶。"
  npc_override_dic_in01_quests_dicastes_i_use_later_e51ccb: "我稍后要用。"
  npc_override_dic_in01_quests_dicastes_i_usually_carry_extra_br_02d920: "我出城工作时通常会带额外的布拉迪姆，但在洞穴里很容易忘记时间。"
  npc_override_dic_in01_quests_dicastes_i_usually_only_allow_our_37edc4: "我通常只允许我们的猫爪商人代理人通过，但既然你是代表盖克来的，而且看起来很可靠，我就让你通过。"
  npc_override_dic_in01_quests_dicastes_i_ve_been_gathering_expl_ffa9ef: "为了见阿哈特，我已经收集了一年的萨法功绩证明。"
  npc_override_dic_in01_quests_dicastes_i_ve_been_here_ever_c8533b: "从那以后我就一直在这里！"
  npc_override_dic_in01_quests_dicastes_i_ve_been_standing_here_1c6df4: "我已经在这里站了一整天，不知不觉可能已经僵硬了。"
  npc_override_dic_in01_quests_dicastes_i_ve_been_waiting_galten_be52f3: "我一直在等格尔坦们回来，因为我是文克尼克，不习惯战斗。非常感谢你。"
  npc_override_dic_in01_quests_dicastes_i_ve_been_waiting_you_9d5cf6: "我一直在等你！"
  npc_override_dic_in01_quests_dicastes_i_ve_been_working_some_bddf8e: "我已经为此工作了一段时间，希望这能加入菜单。"
  npc_override_dic_in01_quests_dicastes_i_ve_collected_all_equip_9c848a: "我已按照你的要求收集了所有装备并删除了所有记录。现在你的所有装备和记录都清白了。"
  npc_override_dic_in01_quests_dicastes_i_ve_come_across_unexpec_68f433: "我在调查中遇到了意想不到的信息。"
  npc_override_dic_in01_quests_dicastes_i_ve_come_vyhannus_s_a4e73e: "我是带着维哈努斯的邀请来的。"
  npc_override_dic_in01_quests_dicastes_i_ve_gone_too_emotional_518a69: "我太过激动了。"
  npc_override_dic_in01_quests_dicastes_i_ve_just_returned_manuk_42bb73: "我刚从马努克的长期派遣回来"
  npc_override_dic_in01_quests_dicastes_i_ve_never_seen_his_5aad65: "在我加入探险队之前，我从未见过他的种族。"
  npc_override_dic_in01_quests_dicastes_i_ve_never_seen_stronger_48ee08: "我从未见过比这更强的萨法。"
  npc_override_dic_in01_quests_dicastes_i_ve_seen_him_distance_555279: "但我从远处见过他，他并不是。"
