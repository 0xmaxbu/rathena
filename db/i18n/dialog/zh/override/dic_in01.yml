  npc_override_dic_in01_quests_dicastes_i_m_so_sure_he_fbd756: "但我不确定他现在身上是否还有。"
  npc_override_dic_in01_quests_dicastes_i_m_so_tired_507a98: "我太累了……"
  npc_override_dic_in01_quests_dicastes_i_m_sorry_00dca6: "对不起。"
  npc_override_dic_in01_quests_dicastes_i_m_sorry_ask_again_ab0f67: "很抱歉再次问你，你能带一些布拉迪姆给我的朋友们吗？"
