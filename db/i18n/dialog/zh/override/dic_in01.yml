Body:
  npc_override_dic_in01_dicastes_administrative_office_122551: "行政办公室"
  npc_override_dic_in01_dicastes_administrative_office_lo_957c66: "行政办公室位于顶层，处理非常重要的事务。"
  npc_override_dic_in01_dicastes_ahat_one_917b08: "阿哈特就是那个人"
  npc_override_dic_in01_dicastes_ahat_s_image_out_my_4f5f77: "阿哈特的形象从我脑海中挥之不去。"
  npc_override_dic_in01_dicastes_archive_room_lower_level_8a8353: "档案室在下层，你可以在那里获取大量信息。"
  npc_override_dic_in01_dicastes_as_long_as_we_him_b85e76: "只要有他在，"
  npc_override_dic_in01_dicastes_as_long_as_we_steady_1a40d6: "只要我们有一个稳定的"
  npc_override_dic_in01_dicastes_because_him_05f941: "因为他！"
  npc_override_dic_in01_dicastes_blessing_2587df: "祝福？"
  npc_override_dic_in01_dicastes_boring_ec9ddd: "无聊。"
  npc_override_dic_in01_dicastes_capital_city_sapha_73c69f: "萨法的首都。"
  npc_override_dic_in01_dicastes_civil_services_el_dicast_7f7d17: "民政服务和迪卡斯蒂斯区域在楼上的指挥室管理。"
  npc_override_dic_in01_dicastes_course_you_ll_pay_price_fbffb6: "但当然你必须付出代价。"
  npc_override_dic_in01_dicastes_crazy_vanknick_always_d6b3db: "那个疯狂的凡克尼克总是"
  npc_override_dic_in01_dicastes_don_t_come_back_regrets_2ab791: "别带着遗憾回来。"
  npc_override_dic_in01_dicastes_don_t_know_what_means_9287bc: "不知道这是什么意思。"
  npc_override_dic_in01_dicastes_el_dicastes_b7bbd7: "迪卡斯蒂斯，"
  npc_override_dic_in01_dicastes_el_dicastes_most_peacefu_3a4f61: "只要我在，迪卡斯蒂斯就是世界上最和平的地方。"
  npc_override_dic_in01_dicastes_equipment_massager_62606b: "装备而是一个非常方便的按摩器"
  npc_override_dic_in01_dicastes_everywhere_you_go_5f811c: "无论你走到哪里。"
  npc_override_dic_in01_dicastes_galten_also_rest_while_s_ea9c9d: "格尔顿也可以像这样站着休息。"
  npc_override_dic_in01_dicastes_guide_looks_you_alert_ex_991d3f: "- 向导用警惕的表情看着你。 -"
  npc_override_dic_in01_dicastes_hard_i_am_training_dd0213: "训练得很辛苦。"
  npc_override_dic_in01_dicastes_here_battle_station_1e781a: "这里是战斗站。"
  npc_override_dic_in01_dicastes_here_too_3f4017: "这里也是。"
  npc_override_dic_in01_dicastes_hey_you_any_emergency_ra_e3d489: "嘿，你身上有来自米德加德的应急口粮吗？"
  npc_override_dic_in01_dicastes_hey_you_outsider_999343: "嘿，你是外来者！"
  npc_override_dic_in01_dicastes_him_8bd7b2: "他？"
  npc_override_dic_in01_dicastes_his_popularity_here_el_d_9427ed: "他在迪卡斯蒂斯这里的人气 phenomenal！"
  npc_override_dic_in01_dicastes_how_i_help_you_13e773: "有什么可以帮您的吗？"
  npc_override_dic_in01_dicastes_i_42180e: "我有"
  npc_override_dic_in01_dicastes_i_am_going_say_anything_9c2c30: "我什么也不会说！"
  npc_override_dic_in01_dicastes_i_am_never_lazy_my_f1a3de: "我训练从不偷懒。"
  npc_override_dic_in01_dicastes_i_am_sapha_warrior_e87c04: "我是一名萨法战士。"
  npc_override_dic_in01_dicastes_i_asked_what_sad_legend_c16a41: "我问那个悲伤的传说是什么！"
  npc_override_dic_in01_dicastes_i_came_all_way_here_579d51: "我一路饿着肚子来到这里，因为我听说米德加德的酒吧有独特的食物，但我从未在任何地方尝过这样的食物。"
  npc_override_dic_in01_dicastes_i_don_t_believe_legends_a07da1: "我不相信传说。"
  npc_override_dic_in01_dicastes_i_feel_so_stiff_6c179b: "我感觉好僵硬……"
  npc_override_dic_in01_dicastes_i_find_myself_here_all_687e3e: "我发现自己总是在这里。"
  npc_override_dic_in01_dicastes_i_get_great_results_bcdc13: "我会取得很好的成果"
  npc_override_dic_in01_dicastes_i_get_more_factory_lines_ed263d: "我必须启动更多的工厂生产线。"
  npc_override_dic_in01_dicastes_i_go_great_little_restau_e3d47f: "我经常去吉芬的一家很棒的小餐馆，现在真的很想念那个地方。"
  npc_override_dic_in01_dicastes_i_haven_t_seen_my_9769f0: "我已经好几个小时没见到我的朋友了。"
  npc_override_dic_in01_dicastes_i_heard_isn_t_training_d2c8fb: "我听说这不是训练"
  npc_override_dic_in01_dicastes_i_hope_doesn_t_come_631029: "我希望它不要全部"
  npc_override_dic_in01_dicastes_i_hope_everything_goes_w_5aff3b: "我希望一切顺利。"
  npc_override_dic_in01_dicastes_i_ll_ready_anything_1884ef: "我会为任何事做好准备"
  npc_override_dic_in01_dicastes_i_ll_rejected_again_righ_89f479: "我又会被拒绝的，对吧？"
  npc_override_dic_in01_dicastes_i_m_dior_your_kind_9f91bb: "我是迪欧，您在迪卡斯蒂斯的亲切向导。"
  npc_override_dic_in01_dicastes_i_m_only_very_curious_f1af4f: "我只是非常好奇"
  npc_override_dic_in01_dicastes_i_may_change_knitting_e69e73: "我可能得改行做编织了。"
  npc_override_dic_in01_dicastes_i_need_another_dose_brad_1251f1: "我需要再服用一剂布拉迪姆。"
  npc_override_dic_in01_dicastes_i_need_collect_informati_d34564: "我需要收集信息。"
  npc_override_dic_in01_dicastes_i_permit_your_entry_7a6774: "我允许你进入。"
  npc_override_dic_in01_dicastes_i_really_like_nice_hot_c0d413: "我真的很想要一顿热腾腾的美餐。"
  npc_override_dic_in01_dicastes_i_t_get_beautiful_b8d2db: "我无法变得美丽"
  npc_override_dic_in01_dicastes_i_tell_you_sad_legend_a26779: "我来告诉你那座雕像背后的悲伤传说。"
  npc_override_dic_in01_dicastes_i_think_effects_weaker_t_e28359: "我觉得效果比以前弱了，"
  npc_override_dic_in01_dicastes_i_think_i_look_better_03ba4a: "我觉得我在"
  npc_override_dic_in01_dicastes_i_tricked_cece54: "我被骗了吗？"
  npc_override_dic_in01_dicastes_i_ve_been_living_as_8fcf1b: "我作为皮奥姆生活太久了"
  npc_override_dic_in01_dicastes_i_ve_come_pick_up_39a1b5: "我来取我订购的武器。"
  npc_override_dic_in01_dicastes_i_wonder_if_ahat_knows_ae4258: "我想知道阿哈特是否知道"
  npc_override_dic_in01_dicastes_if_i_keep_up_my_678543: "如果我每天坚持训练。"
  npc_override_dic_in01_dicastes_if_i_my_best_right_481c63: "如果我尽力而为，对吧？"
  npc_override_dic_in01_dicastes_if_you_dare_cause_troubl_7e866a: "但如果你敢惹麻烦"
  npc_override_dic_in01_dicastes_if_you_need_any_76fe9c: "如果你需要任何"
  npc_override_dic_in01_dicastes_information_you_d_better_f5a205: "信息，你最好"
  npc_override_dic_in01_dicastes_just_forget_about_quickl_6ca4f7: "为了你好，赶紧忘掉吧。"
  npc_override_dic_in01_dicastes_just_me_8cf690: "还是只有我这样？"
  npc_override_dic_in01_dicastes_land_pretty_ab0f8b: "这片土地相当"
  npc_override_dic_in01_dicastes_least_we_plenty_bradium_fb3e21: "至少我们有大量的布拉迪姆。"
  npc_override_dic_in01_dicastes_look_0336ef: "听着，"
  npc_override_dic_in01_dicastes_luck_cat_merchant_than_w_65ae7e: "运气好的话去找猫商人，而不是在这里闲逛。"
  npc_override_dic_in01_dicastes_menu_can_feea47: "不知道是什么意思:这是诅咒吗??"
  npc_override_dic_in01_dicastes_menu_give_bf56f5: "给5000 Zeny。:不给5000 Zeny。"
  npc_override_dic_in01_dicastes_menu_no_44aaea: "不:是"
  npc_override_dic_in01_dicastes_menu_nope_102a94: "没门！:你先。"
  npc_override_dic_in01_dicastes_menu_something_ba87cc: "有什么猫腻吗？:如果你不说，我也不说！"
  npc_override_dic_in01_dicastes_mining_seem_suit_me_30711a: "但采矿似乎很适合我。"
