Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_mora_enchan_mora_aaarrgghh_impossible_7adf6c: "啊啊啊啊，这不可能！"
  npc_override_mora_enchan_mora_ability_enhance_remains_f3a226: "能力增强效果保留。"
  npc_override_mora_enchan_mora_adds_heal_bonus_bb7849: "增加 20% 治愈加成。"
  npc_override_mora_enchan_mora_ah_one_more_thing_possib_361333: "啊，还有一件事！我也有可能失败，如果那样的话，圣物就永远消失了。"
  npc_override_mora_enchan_mora_all_i_need_mora_coins_25addd: "我只需要你的 10 枚莫拉硬币，就能赐予你一件圣物！"
  npc_override_mora_enchan_mora_another_thing_artifact_d_580cfe: "还有一件事，如果强化失败，圣物会被摧毁。请记住这一点。"
  npc_override_mora_enchan_mora_another_thing_once_i_fai_77b775: "还有一件事——一旦我给它附魔失败，它就无法使用了……那样的话你就得买个新的。"
  npc_override_mora_enchan_mora_anything_else_4689b4: "还有别的事吗？"
  npc_override_mora_enchan_mora_aqua_staff_795f6b: "- 水之法杖 -"
  npc_override_mora_enchan_mora_archbishop_only_ef1585: "仅限大主教"
  npc_override_mora_enchan_mora_artifact_been_strengthen_36e56e: "这件圣物已经强化到极限了。在目前的状态下无法进一步强化。"
  npc_override_mora_enchan_mora_as_you_wish_dafe43: "如你所愿。"
  npc_override_mora_enchan_mora_attempting_second_enhanc_2ef791: "尝试第二次强化。之前的强化不会被影响。"
  npc_override_mora_enchan_mora_attempting_strengthen_ab_495a78: "尝试进一步强化能力。之前的强化不会被影响。你想继续吗？"
  npc_override_mora_enchan_mora_based_what_class_you_spe_7105a0: "根据你指定的职业，有多种圣物可供选择。"
  npc_override_mora_enchan_mora_best_part_my_service_any_8ddbf1: "我服务最好的一点是，这些圣物上的任何强化都不会受损。"
  npc_override_mora_enchan_mora_bring_me_mora_coins_army_8409f2: "带 ^8888005 枚莫拉硬币^000000 和一件军用衬垫来，我们可以一起创造艺术！"
  npc_override_mora_enchan_mora_certainly_go_light_2c1786: "当然。愿圣光与你同在。"
  npc_override_mora_enchan_mora_choose_carefully_because_a7567a: "^ff0000仔细选择，因为这些圣物来之不易^000000。那么你想为哪个职业选？"
  npc_override_mora_enchan_mora_come_back_if_you_change_4b32ed: "如果你改变主意了就回来。"
  npc_override_mora_enchan_mora_come_back_one_if_you_8b4140: "如果你改变主意了就来拿一个。"
  npc_override_mora_enchan_mora_come_back_when_you_re_c0f99a: "等你不忙的时候再来。我总有很多时间。"
  npc_override_mora_enchan_mora_course_i_ll_accept_your_fb4d16: "我当然会接受你的帮助！找到我……"
  npc_override_mora_enchan_mora_course_loki_s_scarf_qual_dbf640: "当然，洛基围巾是品质物品，所以过程中你不会丢失围巾本身。"
  npc_override_mora_enchan_mora_crimson_staff_e2a06a: "- 绯红法杖 -"
  npc_override_mora_enchan_mora_did_you_change_something_4178bb: "你换了什么吗？"
  npc_override_mora_enchan_mora_didn_t_i_tell_you_76a1f6: "我不是告诉你要带正确数量的莫拉硬币吗？"
  npc_override_mora_enchan_mora_even_though_relic_alread_6733c4: "尽管这件圣物已经被附魔过了，我们还是会重新附魔，不检查其状态。"
  npc_override_mora_enchan_mora_finding_perfect_artifact_f47be8: "找到完美的圣物供我实验是我毕生的事业。"
  npc_override_mora_enchan_mora_forest_staff_0b3ce3: "- 森林法杖 -"
  npc_override_mora_enchan_mora_fortunately_s_still_its_f97c3d: "幸运的是，它还是我开始加工前的原始状态。没有撕裂或拉伸。毕竟是一件品质物品。哦吼吼～"
  npc_override_mora_enchan_mora_go_ahead_ask_f152d5: "尽管问吧！"
  npc_override_mora_enchan_mora_go_light_4f797a: "愿圣光与你同在。"
  npc_override_mora_enchan_mora_golden_rod_staff_39751c: "- 金杖法杖 -"
  npc_override_mora_enchan_mora_greetings_adventurer_we_15d061: "你好，冒险者。在我告诉你如何为你的圣物赋能之后，我们很快就会成为好朋友！"
  npc_override_mora_enchan_mora_gulp_be125f: "咕噜……+9？！"
  npc_override_mora_enchan_mora_ha_5e4cb2: "哈……！"
  npc_override_mora_enchan_mora_here_7f5577: "给你。"
  npc_override_mora_enchan_mora_however_i_ll_embroider_v_8d9fa1: "不过，我会用天鹅绒线绣制，并添加三个选项。"
  npc_override_mora_enchan_mora_humans_stock_2acd2c: "人类……库存？"
  npc_override_mora_enchan_mora_i_am_collector_trade_my_12db1a: "我是一名收藏家，但我最大的成就是为一些圣物赋予了更强大的力量！"
  npc_override_mora_enchan_mora_i_available_today_i_hope_a2905e: "我今天有 ^aa00aa{0}^000000 可用。我希望 {1} 能派上用场……"
  npc_override_mora_enchan_mora_i_don_t_know_what_aee8ff: "我不知道你想干什么……我没有的东西我没法强化。"
  npc_override_mora_enchan_mora_i_enhance_relics_holy_ar_1ae16e: "我强化大主教使用的圣物，需要 2 枚莫拉硬币和圣物才能让我尝试强化。"
  npc_override_mora_enchan_mora_i_give_rune_knights_guil_54ace0: "我给予卢恩骑士、十字斩首者和游侠古代圣物，帮助他们执行任务。"
  npc_override_mora_enchan_mora_i_happen_few_army_paddin_a4011e: "我刚好有一些军用衬垫库存。你想买一件吗？价格是 1 枚莫拉硬币。很便宜吧。"
  npc_override_mora_enchan_mora_i_i_m_sorry_equipment_3eeadd: "我……我很抱歉，装备已经被摧毁了。"
  npc_override_mora_enchan_mora_i_improve_its_high_quali_f66029: "我可以亲手提升它的高品质。"
  npc_override_mora_enchan_mora_i_know_you_want_them_18214b: "但我知道你想要它们变得更好！"
  npc_override_mora_enchan_mora_i_ll_randomly_give_you_0f7979: "我会根据天气和我的心情，随机给你 2 种装备中的一种。"
  npc_override_mora_enchan_mora_i_ll_work_item_whether_cca27f: "而且，无论物品是否已经被强化过，我都会加工它。"
  npc_override_mora_enchan_mora_i_m_bulberry_westhood_ke_bf0658: "我是布尔贝里·韦斯特胡德，传承着优质头巾的传统。"
  npc_override_mora_enchan_mora_i_m_giving_these_service_0b9aed: "这些服务可不是免费的，朋友。100,000 zeny 和 1 枚莫拉硬币。这要求过分吗？"
  npc_override_mora_enchan_mora_i_m_going_continue_my_6df04e: "我要继续研究这些圣物。我们研究人员以莫拉硬币作为服务报酬……"
  npc_override_mora_enchan_mora_i_m_going_take_your_727fb3: "我要拿走你的 ^FF0000{0}^000000 并进行交换，你准备好了吗？"
  npc_override_mora_enchan_mora_i_m_going_work_unless_02b445: "除非你付费用，否则我不会做。"
  npc_override_mora_enchan_mora_i_m_gonna_abused_again_aaa1e8: "我又要被虐待了……"
  npc_override_mora_enchan_mora_i_m_here_mora_studying_d75803: "我在莫拉研究古代遗物和圣物。冒险者们的新发现让这个村庄对我来说变得非常令人兴奋。"
  npc_override_mora_enchan_mora_i_m_offering_my_services_1349c1: "我提供服务，为圣物赋予能力，费用为 100,000 zeny 和 1 枚莫拉硬币。"
  npc_override_mora_enchan_mora_i_m_sure_if_c820c4: "我不确定是否……"
  npc_override_mora_enchan_mora_i_m_telling_you_just_1e3efd: "我只是提醒你——我会对你的军用衬垫做任何需要做的事，无论它是全新的还是已经修补过的。"
  npc_override_mora_enchan_mora_i_m_telling_you_just_84ee4b: "我只是提醒你——"
  npc_override_mora_enchan_mora_i_m_tingling_excitement_e69293: "我兴奋得发抖！"
  npc_override_mora_enchan_mora_i_may_chance_fail_now_a6f0d3: "这次我有可能失败。你想继续吗？"
  npc_override_mora_enchan_mora_i_must_insist_refine_lev_c44336: "我必须坚持圣物的精炼等级至少为 +7！"
  npc_override_mora_enchan_mora_i_only_handle_quality_it_3229f9: "我只处理品质物品——不是市场上随便的围巾。"
  npc_override_mora_enchan_mora_i_only_perfected_my_abil_135d78: "到目前为止，我只在少数几种圣物类型上完善了我的能力。"
  npc_override_mora_enchan_mora_i_really_want_study_equi_b323f8: "我真的很想研究这件装备……"
  npc_override_mora_enchan_mora_i_see_how_could_fun_6bbe6d: "我能看出那会很有趣。"
  npc_override_mora_enchan_mora_i_t_believe_i_messed_c505bd: "真不敢相信我搞砸了。"
  npc_override_mora_enchan_mora_i_think_even_trade_35849e: "我觉得这是一笔公平交易。"
  npc_override_mora_enchan_mora_i_think_there_enhancing_33ce9b: "我觉得圣物有强化上限。"
  npc_override_mora_enchan_mora_i_think_you_re_ready_0a154d: "我觉得你已经准备好接收古代圣物了。"
  npc_override_mora_enchan_mora_i_ve_been_doing_over_b31ece: "我做这行已经超过 200 年了，说实话，现成的供应已经没了，工匠和圣物制造者也不再跟我交易了……"
  npc_override_mora_enchan_mora_i_ve_successfully_enhanc_c27c42: "我成功地为插槽 {1} 的圣物 ^990000{0}^000000 进行了强化。"
  npc_override_mora_enchan_mora_i_want_alone_go_away_750598: "我想一个人呆着。走开！"
  npc_override_mora_enchan_mora_if_either_specific_encha_607ccf: "如果缺少 +7 或特定的附魔，我就没法做。"
  npc_override_mora_enchan_mora_if_i_work_guardian_s_bd3bc9: "如果我加工一个已经被升级过的守护者吊坠，它会失去原来的力量。"
  npc_override_mora_enchan_mora_if_i_work_loki_s_b2e775: "如果我加工一个已经被升级过的洛基围巾，它会失去原来的力量。"
  npc_override_mora_enchan_mora_if_worn_aqua_robe_shoes_14836c: "与水之法袍、水之鞋和水之宝珠一起装备时，水属性魔法伤害增加 60%。"
  npc_override_mora_enchan_mora_if_worn_crimson_robe_sho_6b6398: "与绯红法袍、绯红之鞋和绯红宝珠一起装备时，火属性魔法伤害增加 60%。"
  npc_override_mora_enchan_mora_if_worn_forest_robe_shoe_a37823: "与森林法袍、森林之鞋和森林宝珠一起装备时，地属性魔法伤害增加 60%。"
  npc_override_mora_enchan_mora_if_worn_golden_robe_gold_f06428: "与金色法袍、金色之鞋和金色宝珠一起装备时，风属性魔法伤害增加 60%。"
  npc_override_mora_enchan_mora_if_worn_judgement_golves_231863: "与审判手套、审判之鞋和审判披肩一起装备时，对不死系伤害增加 30%。"
  npc_override_mora_enchan_mora_if_worn_robes_shoes_robe_23e9d6: "与法袍、法鞋和慈悲法袍一起装备时，治愈加成额外增加 45%，'治愈术'的 SP 消耗减少 50。"
  npc_override_mora_enchan_mora_if_you_anything_you_thin_b8362a: "如果你有任何你认为品质足够高的东西，带着 ^ff00005 枚莫拉硬币^000000 来找我。"
  npc_override_mora_enchan_mora_if_you_change_your_mind_03764a: "如果你改变主意，请再来。"
  npc_override_mora_enchan_mora_if_you_change_your_mind_3f2210: "如果你改变主意，请回来。"
  npc_override_mora_enchan_mora_if_you_collect_more_mora_a4baa8: "如果你收集了 10 枚或更多的莫拉硬币，我可以用它们交换圣物。"
  npc_override_mora_enchan_mora_if_you_collect_more_than_0b1c91: "如果你收集了超过 10 枚硬币，就来找我交易！"
  npc_override_mora_enchan_mora_if_you_come_across_any_14e6c8: "如果你遇到这些圣物中的任何一种，其中有可以提取的隐藏力量。"
  npc_override_mora_enchan_mora_if_you_re_interested_i_6be6a6: "如果你有兴趣，我可以加工你的吊坠，费用是 ^ff00005 枚莫拉硬币^000000。当然，你需要有一个守护者吊坠我才能加工。"
  npc_override_mora_enchan_mora_if_you_ready_i_am_c48e97: "如果你准备好了，我马上就向你展示我能对你的 +{0} 圣物做些什么！"
  npc_override_mora_enchan_mora_if_you_ritual_luck_you_dcf359: "如果你有什么求好运的仪式，现在就用吧！"
  npc_override_mora_enchan_mora_increase_cold_bolt_frost_bb5bea: "冰冻术和霜冻之术伤害增加 30%。"
  npc_override_mora_enchan_mora_increase_damage_adoramus_1873b7: "赞美歌伤害增加 200%，赞美歌的 SP 消耗增加 30。"
  npc_override_mora_enchan_mora_increase_earth_spike_hea_8abc2f: "地裂术和崩裂术伤害增加 30%。"
  npc_override_mora_enchan_mora_increase_fire_bolt_fireb_c515c4: "火箭术和火球术伤害增加 30%。"
  npc_override_mora_enchan_mora_increase_jupitel_thunder_df3cd8: "雷鸣术伤害增加 30%。"
  npc_override_mora_enchan_mora_int_matk_378b0c: "INT + 5，MATK + 270。"
  npc_override_mora_enchan_mora_let_me_briefly_explain_m_813447: "让我简要说明一下，用 2 枚莫拉硬币和圣物，我可以在那件圣物上给你一个附魔。"
  npc_override_mora_enchan_mora_let_me_explain_one_reinf_6c824c: "让我解释一下。一次强化需要花费你两枚硬币。"
  npc_override_mora_enchan_mora_let_me_take_look_what_d4167a: "让我看看你带来了什么。"
  npc_override_mora_enchan_mora_let_s_start_third_enhanc_f879c8: "让我们开始第三次强化。在这个阶段我可以给出最好的属性，但请记住，^990000现在圣物有被摧毁的风险，之前的强化也会被抹去^000000。继续吗？"
  npc_override_mora_enchan_mora_light_you_look_like_you_10e551: "以圣光之名！你看起来已经准备好获取我们的圣物了。"
  npc_override_mora_enchan_mora_like_i_said_i_only_f4e966: "就像我说的，我只处理品质物品——不是市场上随便的围巾。"
  npc_override_mora_enchan_mora_like_other_guardians_the_bd02d0: "和其他守护者一样，他们可能用硬币换圣物，所以收集莫拉硬币吧！"
  npc_override_mora_enchan_mora_loki_s_scarf_you_awesome_0cc7f3: "你的这条洛基围巾太棒了。这是带有洛基徽章的限量版产品！"
  npc_override_mora_enchan_mora_looks_like_i_did_3ddbf1: "看起来我做到了！"
  npc_override_mora_enchan_mora_looks_like_my_effort_suc_489f65: "看起来我的努力成功了。"
  npc_override_mora_enchan_mora_looks_like_you_don_t_6bad29: "看起来你没有所需的一切。"
  npc_override_mora_enchan_mora_looks_like_you_don_t_eb6e5a: "看起来你没有所需的一切。"
  npc_override_mora_enchan_mora_lower_earth_magic_damage_ccbe0e: "地属性魔法伤害减少 60%，地属性抗性增加 50%。"
  npc_override_mora_enchan_mora_lower_fire_magic_damage_79727f: "火属性魔法伤害减少 60%，火属性抗性增加 50%。"
  npc_override_mora_enchan_mora_lower_water_magic_damage_470d73: "水属性魔法伤害减少 60%，水属性抗性增加 50%。"
  npc_override_mora_enchan_mora_lower_wind_magic_damage_10f45c: "风属性魔法伤害减少 60%，风属性抗性增加 50%。"
  npc_override_mora_enchan_mora_mace_judgement_3af31f: "- 审判权杖 -"
  npc_override_mora_enchan_mora_make_sure_you_re_wearing_281281: "确保你先装备了这件装备。"
  npc_override_mora_enchan_mora_matk_int_4eb96b: "MATK + 180，INT + 4。"
  npc_override_mora_enchan_mora_matk_str_int_210cab: "MATK + 180，STR + 2，INT + 2。"
  npc_override_mora_enchan_mora_maybe_humans_starting_vi_726dea: "但也许开始来访的人类能带来一些新的库存！"
  npc_override_mora_enchan_mora_menu_cancel_034f3e: "取消:萨法之鞋（鞋）:纳布之鞋（鞋）:萨法头巾（披风）:纳布头巾（披风）"
  npc_override_mora_enchan_mora_menu_cancel_760934: "取消:白翼之靴（鞋）:黑翼之靴（鞋）:白翼斗篷（披风）:黑翼斗篷（披风）"
  npc_override_mora_enchan_mora_menu_cancel_876e66: "取消:乌尔护胫（鞋）:佩乌兹护胫（鞋）:乌尔斗篷（披风）:佩乌兹斗篷（披风）"
  npc_override_mora_enchan_mora_menu_cancel_e91265: "取消:卢恩骑士:十字斩首者:游侠"
  npc_override_mora_enchan_mora_menu_come_129afd: "来吧，急什么？:好的！我们开始吧！！"
  npc_override_mora_enchan_mora_menu_i_04b968: "我还没准备好:交换我的 {0}"
  npc_override_mora_enchan_mora_menu_i_05d582: "我晚点再来。:请继续！"
  npc_override_mora_enchan_mora_menu_i_16fb11: "我不明白。:好的，请吧。"
  npc_override_mora_enchan_mora_menu_i_2a0241: "我不太感兴趣:慈悲法杖:审判权杖:金杖法杖:水之法杖:绯红法杖:森林法杖"
  npc_override_mora_enchan_mora_menu_i_6e6382: "我还没准备好。:我准备好交换我的莫拉硬币了。:交换我的戒指。"
  npc_override_mora_enchan_mora_menu_i_75eb24: "我还没准备好。:戒指:鞋:披肩:法袍:盾牌:武器"
  npc_override_mora_enchan_mora_menu_i_c36a7c: "我没装备那件装备:1. 武器:2. 鞋:3. 披风:4. 铠甲:5. 饰品"
  npc_override_mora_enchan_mora_menu_it_755192: "它还必须带有以下任何一种附魔:{0} 才能由我制作。"
