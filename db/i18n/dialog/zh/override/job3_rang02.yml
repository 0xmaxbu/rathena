Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job3_rang02_ranger_ah_wait_before_8addf9: "啊，等一下，在那之前。"
  npc_override_job3_rang02_ranger_aha_you_ve_failed_middle_2863f9: "啊哈……你中间失败了！"
  npc_override_job3_rang02_ranger_all_right_441c8d: "好的。"
  npc_override_job3_rang02_ranger_all_right_careful_good_a31251: "好的。小心谨慎是好事。"
  npc_override_job3_rang02_ranger_all_tests_become_ranger_9e1e79: "所有成为游侠的测试都将以实战方式进行。"
  npc_override_job3_rang02_ranger_among_st_nd_rd_practical_c218a8: "在第1、第2和第3个实战测试中，你对哪个测试方法感到好奇？"
  npc_override_job3_rang02_ranger_anyway_you_ve_passed_nd_b1e5db: "总之，你第2个测试完成得很好。"
  npc_override_job3_rang02_ranger_area_ranger_job_change_t_d6c701: "这里是游侠转职测试区域！"
  npc_override_job3_rang02_ranger_as_you_don_t_any_4d5f08: "既然你没有穿戴任何装备，小心野外的怪物。"
  npc_override_job3_rang02_ranger_attendant_receives_bombr_37d98e: "工作人员会收到10个'爆弹胶囊'。当你使用爆弹胶囊时，附近会召唤出一个爆弹，召唤后经过一定时间，爆弹就会爆炸。"
  npc_override_job3_rang02_ranger_awooo_yumyum_3411ab: "嗷呜。好吃好吃。"
  npc_override_job3_rang02_ranger_because_you_ve_disappear_b7a0e9: "因为你突然消失了，游侠大师一直在找你。"
  npc_override_job3_rang02_ranger_become_ranger_we_shall_m_45bc79: "成为游侠后，我们还会再见的。"
  npc_override_job3_rang02_ranger_before_taking_practical_e449c6: "在参加实战测试之前，我想吃点东西。"
  npc_override_job3_rang02_ranger_before_taking_practical_f4ad32: "在参加实战测试之前，我想吃点东西。"
  npc_override_job3_rang02_ranger_before_you_change_into_r_2e2e2f: "在你转职为游侠之前，我需要评估你的纯粹能力。"
  npc_override_job3_rang02_ranger_before_you_change_into_r_364404: "在你转职为游侠之前，即使你已经达到了猎人的最高等级，这也不是你能力的最佳评估。"
  npc_override_job3_rang02_ranger_before_you_change_into_r_ea2df8: "在你转职为游侠之前，即使你已经达到了神射手的最高等级，这也不是你能力的最佳评估。"
  npc_override_job3_rang02_ranger_before_you_job_change_di_994f5f: "在你转职之前，请^0000ff解散你的猎鹰^000000，并确认你已经用完了所有^0000ff技能点^000000。"
  npc_override_job3_rang02_ranger_bombring_capsules_given_c6563d: "'爆弹胶囊'只能在使用完所有胶囊的人身上再次发放，所以请记住这一点。"
  npc_override_job3_rang02_ranger_bombring_explosion_affec_58694d: "^0000ff爆弹的爆炸会影响到你，所以小心不要被卷入爆炸中。你需要使用爆弹胶囊消灭怪物，完成任务并活着出来。^000000"
  npc_override_job3_rang02_ranger_come_again_when_you_abso_020493: "当你完全准备好后再来吧。"
  npc_override_job3_rang02_ranger_come_back_when_you_ready_67d3d7: "准备好后再回来。"
  npc_override_job3_rang02_ranger_come_come_near_nearer_ne_4f5a6a: "过来，过来，靠近点，再靠近点！！"
  npc_override_job3_rang02_ranger_come_see_me_again_4d4745: "再来见我！"
  npc_override_job3_rang02_ranger_come_when_you_ready_daee0c: "准备好的时候再来。"
  npc_override_job3_rang02_ranger_congrats_passing_nd_prac_7c2d27: "恭喜你通过了第2个实战测试！我是第3个实战测试的监考官弗里兹！"
  npc_override_job3_rang02_ranger_congratulations_36b252: "恭喜你！"
  npc_override_job3_rang02_ranger_congratulations_becoming_1c8f9d: "恭喜你成为游侠~"
  npc_override_job3_rang02_ranger_consider_as_extension_su_9e04aa: "把这当作生存力测试的延伸。"
  npc_override_job3_rang02_ranger_didn_t_rust_give_you_d3a72b: "拉斯特没有给你什么东西吗？"
  npc_override_job3_rang02_ranger_didn_t_you_dismiss_your_695740: "你没有解散你的猎鹰吗？？"
  npc_override_job3_rang02_ranger_different_monsters_appea_5eaa7e: "8个位置会出现不同的怪物。只消灭名为'波利'的怪物就能获得分数，达到一定的分数后你就通过了。很简单，对吧？"
  npc_override_job3_rang02_ranger_disabled_waiting_room_cd32fb: "等待室已禁用"
  npc_override_job3_rang02_ranger_don_t_hang_around_here_ee7ba5: "别在这里无所事事地晃悠。这是我的地盘！"
  npc_override_job3_rang02_ranger_don_t_lose_dignity_as_96deee: "无论走到哪里，都不要失去作为游侠的尊严。"
  npc_override_job3_rang02_ranger_don_t_you_need_any_c668e3: "你不需要任何解释吗？"
  npc_override_job3_rang02_ranger_easy_right_d03f92: "很简单，对吧？"
  npc_override_job3_rang02_ranger_eeeeei_ha_afd08c: "呃呃呃呃~哈！"
  npc_override_job3_rang02_ranger_eh_what_you_looking_c196dd: "嗯？你在看什么？"
  npc_override_job3_rang02_ranger_enabled_waiting_room_113bf1: "等待室已启用"
  npc_override_job3_rang02_ranger_enough_experience_d0d4c8: "足够的经验。"
  npc_override_job3_rang02_ranger_enter_into_chat_room_wai_ede756: "进入聊天室等待命令，然后参加转职实战测试。"
  npc_override_job3_rang02_ranger_even_after_passing_throu_fcd6d3: "即使通过了所有艰难的实战测试，你也不想成为游侠……你确定吗？"
  npc_override_job3_rang02_ranger_excuse_me_how_did_you_f6343a: "抱歉，但你是怎么进来的？"
  npc_override_job3_rang02_ranger_first_all_let_me_tell_7cd098: "首先，让我告诉你成为游侠的转职条件。"
  npc_override_job3_rang02_ranger_first_test_test_how_keen_f328e0: "第一个测试是测试你的眼力有多敏锐。"
  npc_override_job3_rang02_ranger_get_rid_monsters_mission_bf0908: "使用提供的陷阱消灭怪物并完成任务，你就通过了。只是小心不要被爆炸波及。"
  npc_override_job3_rang02_ranger_go_away_32baea: "走开。"
  npc_override_job3_rang02_ranger_good_bdc919: "很好。"
  npc_override_job3_rang02_ranger_good_goooooo_650952: "准备好了！！！！！！！"
  npc_override_job3_rang02_ranger_good_gooooooooooooooo_eb2ca4: "准备好了！！！！！！！！！！"
  npc_override_job3_rang02_ranger_good_luck_703764: "祝你好运。"
  npc_override_job3_rang02_ranger_good_no_falcon_you_ve_412dd0: "很好。没有猎鹰，而且你已经用完了所有技能点。"
  npc_override_job3_rang02_ranger_good_now_you_re_qualifie_04399c: "很好，现在你有资格参加实战测试了。"
  npc_override_job3_rang02_ranger_good_see_you_c1c48d: "很高兴见到你。"
  npc_override_job3_rang02_ranger_good_then_i_ll_start_5e8068: "很好！那我现在就开始测试！"
  npc_override_job3_rang02_ranger_ha_ha_11174d: "哈~哈。"
  npc_override_job3_rang02_ranger_ha_what_you_doing_47d798: "哈？你在干什么？"
  npc_override_job3_rang02_ranger_haaaaaaaah_a838d2: "哈啊啊啊啊啊啊！！"
  npc_override_job3_rang02_ranger_having_done_test_normall_85b040: "正常完成测试的话，你应该已经把负重调整到0，并持有救援提供的道具！"
  npc_override_job3_rang02_ranger_hey_what_you_hiding_ther_b8f72e: "嘿，你在那里藏了什么？"
  npc_override_job3_rang02_ranger_hey_you_kidding_after_al_7ad58a: "嘿。你终究是在开玩笑吗？"
  npc_override_job3_rang02_ranger_hey_you_look_great_2ee6e7: "嘿，你看起来很棒。"
  npc_override_job3_rang02_ranger_hmm_oh_my_oh_my_72fa4e: "嗯？哎呀哎呀，我让你看到了我的失态。"
  npc_override_job3_rang02_ranger_hmm_s_doubtful_506848: "嗯。很可疑……"
  npc_override_job3_rang02_ranger_hmmmm_s_still_hot_d096cd: "嗯嗯，还热吗？！"
  npc_override_job3_rang02_ranger_ho_having_come_far_means_0bef7f: "呵，能走到这里，说明你已经通过了第一个生存测试。"
  npc_override_job3_rang02_ranger_ho_who_s_903271: "呵。这是谁啊~"
  npc_override_job3_rang02_ranger_how_come_you_weigh_so_2d57ac: "但是，你怎么这么重？"
  npc_override_job3_rang02_ranger_how_could_you_ranger_if_3deee7: "如果你连眼前的东西都认不出来，怎么能成为游侠？滚出去！"
  npc_override_job3_rang02_ranger_how_did_you_find_me_3c2b18: "你是怎么找到我的？"
  npc_override_job3_rang02_ranger_huh_73fef0: "嗯？"
  npc_override_job3_rang02_ranger_huh_d88905: "…… ……嗯？"
  npc_override_job3_rang02_ranger_huh_there_s_no_wolf_cbc429: "嗯？！没有狼，没有测试笛，你把它们弄到哪里去了？！"
  npc_override_job3_rang02_ranger_huh_what_you_where_you_1e6b32: "嗯？你是什么人？你从哪里来的？"
  npc_override_job3_rang02_ranger_huh_where_s_bow_i_eb6ec3: "嗯？我给你的实战测试用弓在哪里？"
  npc_override_job3_rang02_ranger_huh_who_you_what_you_fe14cc: "嗯？你是谁？你在这里干什么，小弓箭手。"
  npc_override_job3_rang02_ranger_hurry_up_finish_test_ce1fd1: "快点完成测试。"
  npc_override_job3_rang02_ranger_i_am_running_away_so_1dd756: "我不会逃跑的，所以慢慢来。"
  npc_override_job3_rang02_ranger_i_consider_as_cheating_f403a6: "我认为这是作弊！"
  npc_override_job3_rang02_ranger_i_don_t_smell_any_93ce84: "我没有闻到任何作弊的迹象。暂时……"
  npc_override_job3_rang02_ranger_i_don_t_think_you_fcf5e1: "我认为你没有时间做那个。"
  npc_override_job3_rang02_ranger_i_knew_77e5f1: "我就知道。"
  npc_override_job3_rang02_ranger_i_know_very_basic_way_f5ccbd: "我知道最基本的生存方式可能是增强自己的身体力量。但是，我发现派遣冒险者对我来说更容易。"
  npc_override_job3_rang02_ranger_i_ll_cancel_job_change_7505f2: "我将取消{0}的转职请求。"
  npc_override_job3_rang02_ranger_i_ll_explain_paths_test_24a279: "我将解释测试的路径。"
  npc_override_job3_rang02_ranger_i_ll_explain_ranger_job_254ebc: "我将解释游侠转职实战测试。"
  npc_override_job3_rang02_ranger_i_ll_explain_simply_2a2898: "我简单解释一下。"
  npc_override_job3_rang02_ranger_i_ll_give_you_bombring_1aadc3: "我将给你'爆弹胶囊'。"
  npc_override_job3_rang02_ranger_i_ll_give_you_one_9790d7: "我特别再给你一次，所以振作起来！"
  npc_override_job3_rang02_ranger_i_m_hungry_597298: "我饿了。"
  npc_override_job3_rang02_ranger_i_m_sorry_you_already_5c8bd0: "抱歉，但你已经有'爆弹胶囊'了，所以我不能再给你更多。"
  npc_override_job3_rang02_ranger_i_tell_just_looking_you_714fb2: "我一眼就能看出你似乎经验不足。"
  npc_override_job3_rang02_ranger_i_think_i_know_you_3953ff: "我想我知道了。你是要把这个送给谨慎，对吧？"
  npc_override_job3_rang02_ranger_i_think_you_need_learn_c24d38: "我认为你需要多学习。"
  npc_override_job3_rang02_ranger_i_ve_already_checked_fir_e8b5a9: "我已经检查了你作为猎人或神射手的第一项资格，确认你已经积累了足够的经验来产生气场。"
  npc_override_job3_rang02_ranger_i_ve_been_avoiding_him_5c1cc4: "我一直在躲着他！！"
  npc_override_job3_rang02_ranger_i_ve_never_imagined_coul_602ab4: "我从未想过这也会成为测试……"
  npc_override_job3_rang02_ranger_i_ve_pointed_out_several_55155d: "我已经多次指出，你不应该带着除提供道具以外的任何东西偷偷进去！"
  npc_override_job3_rang02_ranger_i_want_see_real_power_0762a6: "我想看到真正的生存力量，即使你摔倒、被打败。"
  npc_override_job3_rang02_ranger_i_wish_you_luck_your_a1ba30: "祝你在未来好运！"
  npc_override_job3_rang02_ranger_if_you_cover_rice_s_545a30: "如果你用米饭包起来，就像烤海苔一样，非常美味可口。"
  npc_override_job3_rang02_ranger_if_you_determined_then_t_e38cfa: "如果你已经下定决心，那就没有什么好等的了。"
  npc_override_job3_rang02_ranger_if_you_don_t_cancel_5ff933: "如果你不取消佣兵，你就不能进入测试场地！先取消它！"
  npc_override_job3_rang02_ranger_if_you_don_t_make_b91162: "如果你不把负重调整为0，你就不能参加测试。"
  npc_override_job3_rang02_ranger_if_you_don_t_return_e3b078: "如果你不归还它，我就不能取消你的转职请求。"
  npc_override_job3_rang02_ranger_if_you_get_passing_mark_04f77e: "如果你在三个测试中获得及格分数，你就离成为游侠不远了。"
  npc_override_job3_rang02_ranger_if_you_give_up_here_395b13: "如果你在这里放弃，你的转职请求将被取消。你真的想放弃转职为游侠吗？"
  npc_override_job3_rang02_ranger_if_you_here_job_change_c6e7f9: "如果你不是来参加转职测试的，请离开。"
  npc_override_job3_rang02_ranger_if_you_hold_such_thing_f2cb36: "如果你持有这样的东西，会妨碍你的实战测试，所以我把它收走。"
  npc_override_job3_rang02_ranger_if_you_run_out_provided_633cda: "如果你用完了提供的道具，我们无法再提供支援，所以请小心。"
  npc_override_job3_rang02_ranger_if_you_run_out_provided_e4af2e: "如果你用完了提供的道具，我们无法再提供支援，所以请小心。"
  npc_override_job3_rang02_ranger_if_you_succeed_survival_da464a: "如果你通过这个生存力测试，你将获得第一个资格。"
  npc_override_job3_rang02_ranger_if_you_want_change_job_f63552: "如果你想转职为游侠，首先和生存教官救援谈谈。"
  npc_override_job3_rang02_ranger_if_you_want_continue_pra_f42145: "如果你想继续实战测试，请进入聊天室。"
  npc_override_job3_rang02_ranger_isn_t_so_easy_2a645f: "不是很简单吗？"
  npc_override_job3_rang02_ranger_keep_mind_you_need_remov_51f60f: "记住！你需要在蛋炸弹爆炸前，只用狼来拆除它！"
  npc_override_job3_rang02_ranger_little_tough_so_careful_42aafd: "有点困难，所以小心。"
  npc_override_job3_rang02_ranger_looks_like_you_a7b25d: "看起来你拥有"
  npc_override_job3_rang02_ranger_make_sure_your_weight_eq_8cf523: "确保你的负重等于0才能继续。"
  npc_override_job3_rang02_ranger_make_sure_your_weight_eq_b9003c: "确保你的负重等于'0'才能继续。"
  npc_override_job3_rang02_ranger_may_i_tell_you_one_9a2b50: "我可以告诉你一件事吗？"
  npc_override_job3_rang02_ranger_menu_don_80818e: "不要走:走"
  npc_override_job3_rang02_ranger_menu_egg_9fe06a: "蛋炸弹 : {0}"
  npc_override_job3_rang02_ranger_menu_egg_e3aeb1: "蛋炸弹 : 呃啊啊啊啊啊啊啊！！！所以我刚才说了什么！！"
  npc_override_job3_rang02_ranger_menu_enable_ea6921: "启用等待室:禁用等待室:启用第1测试:禁用第1测试:启用第2测试:禁用第2测试:启用第3测试:禁用第3测试:取消"
  npc_override_job3_rang02_ranger_menu_i_7e825b: "我再考虑一下:我参加测试"
  npc_override_job3_rang02_ranger_menu_i_961cc8: "我只是路过:请让我出去"
  npc_override_job3_rang02_ranger_menu_i_b12121: "我再考虑一下。:我已经想成为游侠了。"
  npc_override_job3_rang02_ranger_menu_i_c32f62: "我是来这里成为游侠的。:我只是来看看。"
  npc_override_job3_rang02_ranger_menu_no_05ecab: "不，我再试一次:我放弃！"
  npc_override_job3_rang02_ranger_menu_no_455d46: "不:是！"
  npc_override_job3_rang02_ranger_menu_no_e42662: "不，我将继续测试:我放弃游侠转职"
  npc_override_job3_rang02_ranger_menu_oh_e077c2: "哦，吃吧:……"
  npc_override_job3_rang02_ranger_menu_please_f8e97e: "请稍等一下:让我们去实战测试场地！"
  npc_override_job3_rang02_ranger_menu_ranger_8ef13c: "游侠实战测试大楼？:我是来参加测试的。"
  npc_override_job3_rang02_ranger_menu_st_4eb3e7: "第1测试:第2测试:第3测试:取消"
  npc_override_job3_rang02_ranger_menu_tell_67acfa: "再告诉我一次任务。:我只是想聊聊。"
  npc_override_job3_rang02_ranger_menu_test_02e75e: "测试监考官，谨慎：在测试过程中，如果你完成了工作人员给你的任务就来见我，然后你就通过了第2个实战测试！"
  npc_override_job3_rang02_ranger_menu_test_039808: "测试监考官，谨慎：还剩4秒！！"
  npc_override_job3_rang02_ranger_menu_test_0440c2: "测试监考官，通知：那让我们开始测试吧。祝你好运。"
  npc_override_job3_rang02_ranger_menu_test_0c2021: "测试监考官，弗里兹：你为什么不开始测试？"
  npc_override_job3_rang02_ranger_menu_test_106314: "测试监考官，弗里兹：你的分数是……{0}分，满分20分！"
  npc_override_job3_rang02_ranger_menu_test_15bdca: "测试监考官，弗里兹：好吧，让我们看看结果？！"
  npc_override_job3_rang02_ranger_menu_test_188c3c: "测试监考官，弗里兹：你没有按时参加测试，所以我结束第3个实战测试！"
  npc_override_job3_rang02_ranger_menu_test_18c07e: "测试监考官，通知：测试方法是，在8个位置随机刷新的怪物中，消灭名为'波利'的怪物。"
  npc_override_job3_rang02_ranger_menu_test_288e40: "测试说明:取消:我放弃游侠测试"
