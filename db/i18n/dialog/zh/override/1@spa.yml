Body:
  npc_override_1@spa_GhostPalace_aah_aah_8bf419: "啊，啊！！！"
  npc_override_1@spa_GhostPalace_all_right_done_f366cc: "好了，完成了。"
  npc_override_1@spa_GhostPalace_although_i_need_help_tas_989e6f: "虽然我需要帮助来完成一项任务，但你还不够强大，菜鸟~！"
  npc_override_1@spa_GhostPalace_althought_i_need_help_ta_4442bf: "虽然我需要帮助来完成一项任务，但你还不够强大，菜鸟~！"
  npc_override_1@spa_GhostPalace_cancel_77dfd2: "取消"
  npc_override_1@spa_GhostPalace_come_back_later_when_you_4ff97e: "等你完成一些训练，至少达到 120 级后再回来！"
  npc_override_1@spa_GhostPalace_confront_sakray_tartanos_b46570: "去面对萨克雷和塔尔塔诺斯。"
  npc_override_1@spa_GhostPalace_contained_inside_these_s_a8d323: "就包含在这些碎片之中。"
  npc_override_1@spa_GhostPalace_cursed_knight_834f1a: "被诅咒的骑士……"
  npc_override_1@spa_GhostPalace_cursed_magic_sword_tarta_a555a1: "诅咒魔剑塔尔塔诺斯！你准备好迎接新主人了吗？"
  npc_override_1@spa_GhostPalace_easier_you_if_i_married_23bfbf: "如果我嫁到别的国家去，对你来说会不会更容易？"
  npc_override_1@spa_GhostPalace_enter_2b9ece: "进入"
  npc_override_1@spa_GhostPalace_even_now_all_royal_guard_fcb075: "即使现在，所有的皇家禁卫都在与怪物战斗并牺牲。"
  npc_override_1@spa_GhostPalace_everything_now_complete_106f8a: "一切都已经完成了"
  npc_override_1@spa_GhostPalace_faithful_royal_guard_ac1dbe: "忠诚的皇家禁卫……"
  npc_override_1@spa_GhostPalace_farewell_then_d31962: "那么，再见了。"
  npc_override_1@spa_GhostPalace_get_out_curse_sure_81c805: "一定要摆脱这个诅咒。"
  npc_override_1@spa_GhostPalace_good_time_9c4a5e: "现在不是时候。"
  npc_override_1@spa_GhostPalace_guilt_eating_my_soul_f3a49a: "内疚正在吞噬我的灵魂。"
  npc_override_1@spa_GhostPalace_hand_over_e16ed1: "交出 {0} {1}。"
  npc_override_1@spa_GhostPalace_heh_heh_i_keep_watching_f6215a: "嘿嘿……我会一直看着你，直到你足够长大的那一天。"
  npc_override_1@spa_GhostPalace_hey_there_you_alive_3152e3: "嘿，你还活着吗？"
  npc_override_1@spa_GhostPalace_how_dare_you_017252: "你好大的胆子！"
  npc_override_1@spa_GhostPalace_i_always_stand_you_prote_ca65d2: "我会永远站在你身边，永远保护你。"
  npc_override_1@spa_GhostPalace_i_am_collecting_sakray_s_5baf21: "我正在收集萨克雷遗落的记忆碎片。"
  npc_override_1@spa_GhostPalace_i_am_quite_satisfied_res_7be8f2: "我对结果相当满意。"
  npc_override_1@spa_GhostPalace_i_am_willing_hunt_you_91da91: "我愿意为了塔尔塔诺斯而猎杀你。"
  npc_override_1@spa_GhostPalace_i_believe_9bb3f3: "我相信"
  npc_override_1@spa_GhostPalace_i_did_expect_meet_someon_8211e7: "我没想到还能遇到活着的人。"
  npc_override_1@spa_GhostPalace_i_help_eb6e9a: "我会帮忙的。"
  npc_override_1@spa_GhostPalace_i_love_you_bee40b: "我爱你……"
  npc_override_1@spa_GhostPalace_i_make_93d4ea: "我会制作一个^FF0000{0}^000000"
  npc_override_1@spa_GhostPalace_i_need_335b29: "我需要 {0} ^006400{1}^000000。"
  npc_override_1@spa_GhostPalace_i_need_help_even_likes_328436: "我需要帮助，即使是像你这样的人。"
  npc_override_1@spa_GhostPalace_i_need_more_blood_sakray_91a98d: "我需要更多血液……萨克雷，把他的血献给我。"
  npc_override_1@spa_GhostPalace_i_only_open_secret_passa_06f62e: "我只能为队伍队长打开秘密通道。请让你的队伍队长来跟我说话。"
  npc_override_1@spa_GhostPalace_i_open_secret_passage_gh_941450: "我将打开通往^0000ff幽灵宫殿^000000的秘密通道。"
  npc_override_1@spa_GhostPalace_i_protect_princess_my_li_32096d: "我会用生命保护公主。"
  npc_override_1@spa_GhostPalace_i_see_secret_passage_int_156042: "我能看到通往宫殿的秘密通道。你准备好拯救公主了吗？！"
  npc_override_1@spa_GhostPalace_i_want_you_forever_peace_8741a6: "我想永远和你和平地在一起……永远……"
  npc_override_1@spa_GhostPalace_i_wanted_get_rid_piece_b887d6: "我想通过你来摆脱我体内的一部分人性。"
  npc_override_1@spa_GhostPalace_if_if_marriage_arranged_3c24a4: "如果……如果安排了婚事，我该怎么办？"
  npc_override_1@spa_GhostPalace_if_so_then_why_0fd3bc: "如果是这样……那为什么……？"
  npc_override_1@spa_GhostPalace_if_you_give_any_s_79cd1c: "如果你给我任何 ^006400{0}^000000，我可以为你制作装备。"
  npc_override_1@spa_GhostPalace_if_you_me_what_you_349876: "如果你是我，你会怎么做？"
  npc_override_1@spa_GhostPalace_inside_devices_you_see_d_b5672a: "^ff0000在装置内部你看到一个黑洞。如果你想进入，必须先和阴郁的皇家禁卫谈话。^000000"
  npc_override_1@spa_GhostPalace_let_s_try_re_enter_57a77b: "让我们尝试重新进入。"
  npc_override_1@spa_GhostPalace_magic_sword_tartanos_i_d_788031: "魔剑塔尔塔诺斯！如果我不能拥有你，我就毁掉你……哦不！怎么会这样？"
  npc_override_1@spa_GhostPalace_make_42232a: "来制作一个^FF0000{0}^000000。"
  npc_override_1@spa_GhostPalace_make_a9894d: "来制作一个^FF0000{0}^000000"
  npc_override_1@spa_GhostPalace_marriage_arrangements_go_5274fa: "婚事安排正在按计划进行。王子来这里见公主。"
  npc_override_1@spa_GhostPalace_memories_everyone_he_lov_c68493: "以及他所爱的所有人的记忆"
  npc_override_1@spa_GhostPalace_memories_faithful_royal_a3c8c8: "忠诚的皇家禁卫的记忆"
  npc_override_1@spa_GhostPalace_menu_king_13dd07: "国王: 闭嘴！你背叛了我！我信任你……你必须为你的耻辱付出代价。"
  npc_override_1@spa_GhostPalace_menu_king_1665c0: "国王: 你将为此痛苦终生。"
  npc_override_1@spa_GhostPalace_menu_king_2613c5: "国王: 是你把怪物带到这里来的！你想除掉我，独占公主？"
  npc_override_1@spa_GhostPalace_menu_king_26698a: "国王: 你现在被任命为蒂亚拉公主的贴身护卫。我最信任你的忠诚。"
  npc_override_1@spa_GhostPalace_menu_king_e8cb60: "国王: 婚事安排正在按计划进行。王子来这里见公主。"
  npc_override_1@spa_GhostPalace_menu_king_f68440: "国王: 我的天，城堡里有怪物！立刻消灭它们！"
  npc_override_1@spa_GhostPalace_menu_lurid_0bfa4a: "阴郁的皇家禁卫: 不……啊，啊，啊！！！~！"
  npc_override_1@spa_GhostPalace_menu_lurid_0fd544: "阴郁的皇家禁卫: 我唯一能做的就是保护你免受物理伤害。"
  npc_override_1@spa_GhostPalace_menu_lurid_24422a: "阴郁的皇家禁卫: 我会用生命保护公主。"
  npc_override_1@spa_GhostPalace_menu_lurid_27e613: "阴郁的皇家禁卫: 殿下，这必须由您自己决定……"
  npc_override_1@spa_GhostPalace_menu_lurid_28f10d: "阴郁的皇家禁卫: 跟在我后面。我们走！"
  npc_override_1@spa_GhostPalace_menu_lurid_53002b: "阴郁的皇家禁卫: 我……我……"
  npc_override_1@spa_GhostPalace_menu_lurid_759923: "阴郁的皇家禁卫: ……是的，陛下。"
  npc_override_1@spa_GhostPalace_menu_lurid_7c9bb0: "阴郁的皇家禁卫: 不……不！！！！！"
  npc_override_1@spa_GhostPalace_menu_lurid_9e67cc: "阴郁的皇家禁卫: 蒂亚拉公主在哪里？"
  npc_override_1@spa_GhostPalace_menu_lurid_abb506: "阴郁的皇家禁卫: 你是谁？现身！"
  npc_override_1@spa_GhostPalace_menu_lurid_ce9dc0: "阴郁的皇家禁卫: 公主！"
  npc_override_1@spa_GhostPalace_menu_lurid_d50eb7: "阴郁的皇家禁卫: 你满意了吗……？魔剑塔尔塔诺斯？"
  npc_override_1@spa_GhostPalace_menu_lurid_ddbec4: "阴郁的皇家禁卫: ……？"
  npc_override_1@spa_GhostPalace_menu_lurid_e0a456: "阴郁的皇家禁卫: 殿下，国王邀请了邻国的王子作为您的未婚夫。请准备好见他……"
  npc_override_1@spa_GhostPalace_menu_lurid_ed1a7a: "阴郁的皇家禁卫: 陛下，这是陷阱！您必须相信我！"
  npc_override_1@spa_GhostPalace_menu_lurid_f3ec27: "阴郁的皇家禁卫: 我会永远站在你身边，永远保护你。"
  npc_override_1@spa_GhostPalace_menu_magic_45c7c1: "魔剑塔尔塔诺斯: 萨克雷，不要忘记我们之间的血之契约。"
  npc_override_1@spa_GhostPalace_menu_magic_78de66: "魔剑塔尔塔诺斯: 你的灵魂是我的，直到你找到能满足我的血液……"
  npc_override_1@spa_GhostPalace_menu_magic_bac2ec: "魔剑塔尔塔诺斯: 你好大的胆子！"
  npc_override_1@spa_GhostPalace_menu_magic_dbf16c: "魔剑塔尔塔诺斯: 库库库……你想要什么，小子？"
  npc_override_1@spa_GhostPalace_menu_magic_e8b27d: "魔剑塔尔塔诺斯: 我需要更多血液……萨克雷，把他的血献给我。"
  npc_override_1@spa_GhostPalace_menu_magic_f608c4: "魔剑塔尔塔诺斯: 萨克雷，现在把血献给我！"
  npc_override_1@spa_GhostPalace_menu_ominous_49bf43: "不祥的声音: 哦，忠诚的皇家禁卫，你被困住了。"
  npc_override_1@spa_GhostPalace_menu_ominous_67ae46: "不祥的声音: 我可以给你无限的力量。如果你与我缔结契约。"
  npc_override_1@spa_GhostPalace_menu_ominous_c0a745: "不祥的声音: 宫殿里的阴谋让你的公主陷入了极大的危险……"
  npc_override_1@spa_GhostPalace_menu_ominous_eca466: "不祥的声音: 啊……所以你听到我了？"
  npc_override_1@spa_GhostPalace_menu_options_22fc0a: "{0} : ……"
  npc_override_1@spa_GhostPalace_menu_options_26756a: "{0} : 萨克雷，你想要什么？同情？还是陷阱？"
  npc_override_1@spa_GhostPalace_menu_options_75a1e7: "{0} : 如果是这样……那为什么……？"
  npc_override_1@spa_GhostPalace_menu_princess_19aec7: "蒂亚拉公主: 我爱你……"
  npc_override_1@spa_GhostPalace_menu_princess_1db6d0: "蒂亚拉公主: 那么，我能做什么？"
  npc_override_1@spa_GhostPalace_menu_princess_1f162c: "蒂亚拉公主: 如果我嫁到别的国家去，对你来说会不会更容易？"
  npc_override_1@spa_GhostPalace_menu_princess_3ec2ac: "蒂亚拉公主: 谢谢你……现在我可以安息在你身边了……"
  npc_override_1@spa_GhostPalace_menu_princess_7fc63e: "蒂亚拉公主: 如果……如果安排了婚事，我该怎么办？"
  npc_override_1@spa_GhostPalace_menu_princess_9031f2: "蒂亚拉公主: 怪物已经进城堡了？请保护我！"
  npc_override_1@spa_GhostPalace_menu_princess_d1ea7c: "蒂亚拉公主: 你遵守了诺言。"
  npc_override_1@spa_GhostPalace_menu_princess_eb9812: "蒂亚拉公主: 我想永远和你和平地在一起……永远……"
  npc_override_1@spa_GhostPalace_menu_sakray_3d5785: "萨克雷: 如果你是我，你会怎么做？"
  npc_override_1@spa_GhostPalace_menu_sakray_440ec7: "萨克雷: 好吧，那很好。一个旅行者。你看到了吗？"
  npc_override_1@spa_GhostPalace_menu_sakray_50eeac: "萨克雷: 我想通过你来摆脱我体内的一部分人性。"
  npc_override_1@spa_GhostPalace_menu_sakray_5bdbeb: "萨克雷: 嘿嘿……我会一直看着你，直到你足够长大的那一天。"
  npc_override_1@spa_GhostPalace_menu_sakray_6ec17b: "萨克雷: 我愿意为了塔尔塔诺斯而猎杀你。"
  npc_override_1@spa_GhostPalace_menu_sakray_88c103: "萨克雷: 那么，再见了。"
  npc_override_1@spa_GhostPalace_menu_sakray_97643a: "萨克雷: 不……我不需要费任何力气去抓一个新手。"
  npc_override_1@spa_GhostPalace_menu_sakray_b30642: "萨克雷: 你能从这个诅咒中解脱吗？"
  npc_override_1@spa_GhostPalace_menu_sakray_c0b40f: "萨克雷: 我对结果相当满意。"
  npc_override_1@spa_GhostPalace_menu_visiting_136578: "来访王子: 你太晚了……但你带来了我一直在找的东西。谢谢你的帮助。"
  npc_override_1@spa_GhostPalace_menu_visiting_3d096e: "来访王子: 诅咒魔剑塔尔塔诺斯！你准备好迎接新主人了吗？"
  npc_override_1@spa_GhostPalace_menu_visiting_e69af5: "来访王子: 啊，啊！！！"
  npc_override_1@spa_GhostPalace_menu_voice_129181: "萨克雷的声音: 我会永远站在你身边。请安息在我身边。"
  npc_override_1@spa_GhostPalace_menu_voice_702e57: "萨克雷的声音: 永远在黑暗中……"
  npc_override_1@spa_GhostPalace_menu_voice_e1d515: "蒂亚拉公主的声音: 我能为你做什么？"
  npc_override_1@spa_GhostPalace_menu_voice_f6b621: "萨克雷的声音: 与我一同安息在阴影中。"
  npc_override_1@spa_GhostPalace_middle_battle_princess_d_f3408e: "在战斗中，当我守卫宫殿时，公主消失了。"
  npc_override_1@spa_GhostPalace_monsters_around_secret_p_c9ec1f: "秘密通道周围的怪物已经消失了。现在是我们拯救公主的机会！"
  npc_override_1@spa_GhostPalace_monsters_attacked_palace_2ae0b4: "攻击宫殿的怪物正在秘密入口周围游荡。如果它们发现我们就糟了……请稍等。"
  npc_override_1@spa_GhostPalace_monsters_gotten_inside_c_85ff77: "怪物已经进城堡了？请保护我！"
  npc_override_1@spa_GhostPalace_msg_61ce5a: "[{0}]"
  npc_override_1@spa_GhostPalace_msg_6eae3a: "……"
  npc_override_1@spa_GhostPalace_my_gods_there_monsters_c_f7c225: "我的天，城堡里有怪物！立刻消灭它们！"
  npc_override_1@spa_GhostPalace_my_soul_trapped_inside_g_d8137a: "我的灵魂被困在幽灵宫殿里。"
  npc_override_1@spa_GhostPalace_no_ahh_ahh_ahh_c16d80: "不……啊，啊，啊！！！~！"
  npc_override_1@spa_GhostPalace_no_i_need_make_any_c7d3ce: "不……我不需要费任何力气去抓一个新手。"
  npc_override_1@spa_GhostPalace_no_no_f260d2: "不……不！！！！！"
  npc_override_1@spa_GhostPalace_okay_good_traveller_did_5fbd51: "好吧，那很好。一个旅行者。你看到了吗？"
  npc_override_1@spa_GhostPalace_only_registered_members_11b3ca: "只有已注册成员才能进入 {0} 实例。"
  npc_override_1@spa_GhostPalace_only_thing_i_protect_you_784fa4: "我唯一能做的就是保护你免受物理伤害。"
  npc_override_1@spa_GhostPalace_party_entering_ghost_pal_ae6e8a: "队伍 {1} 的 {0} 正在进入幽灵宫殿。"
  npc_override_1@spa_GhostPalace_passage_nd_floor_palace_f6179a: "幽灵宫殿 2 楼的通道已开启。"
  npc_override_1@spa_GhostPalace_passage_rd_floor_palace_b3b26d: "宫殿 3 楼的通道已开启。"
  npc_override_1@spa_GhostPalace_passage_th_floor_palace_43dc08: "宫殿 4 楼的通道已开启。"
  npc_override_1@spa_GhostPalace_passage_th_floor_palace_64d8e0: "宫殿 5 楼的通道已开启。"
  npc_override_1@spa_GhostPalace_please_careful_823de3: "请小心……"
  npc_override_1@spa_GhostPalace_please_help_me_save_soul_3f77f1: "请帮我拯救萨克雷的灵魂。"
  npc_override_1@spa_GhostPalace_please_ready_a00ee6: "请做好准备！"
  npc_override_1@spa_GhostPalace_power_requires_sacrifice_2b4383: "力量需要牺牲。"
  npc_override_1@spa_GhostPalace_princess_12f586: "公主！"
  npc_override_1@spa_GhostPalace_run_away_dbfc00: "快跑！"
  npc_override_1@spa_GhostPalace_run_away_quickly_73e883: "快跑！"
  npc_override_1@spa_GhostPalace_s_only_method_e95362: "^006400{0}^000000是唯一的方法"
  npc_override_1@spa_GhostPalace_sakray_killed_king_tried_b04a29: "萨克雷杀了国王，还想杀我们！"
  npc_override_1@spa_GhostPalace_sakray_killed_princess_108160: "萨克雷杀了一个公主！"
  npc_override_1@spa_GhostPalace_sakray_offer_blood_me_no_abc813: "萨克雷，现在把血献给我！"
  npc_override_1@spa_GhostPalace_sakray_what_you_want_sym_844e54: "萨克雷，你想要什么？同情？还是陷阱？"
  npc_override_1@spa_GhostPalace_sakray_why_sakray_9441bb: "萨克雷……？？为什么……萨克雷！"
  npc_override_1@spa_GhostPalace_save_him_3ac202: "来拯救他……"
  npc_override_1@spa_GhostPalace_shut_up_you_ve_betrayed_70de0c: "闭嘴！你背叛了我！我信任你……你必须为你的耻辱付出代价。"
  npc_override_1@spa_GhostPalace_someday_sakray_48c3dd: "总有一天，萨克雷会"
