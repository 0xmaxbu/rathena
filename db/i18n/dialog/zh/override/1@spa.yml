  npc_override_1@spa_GhostPalace_if_so_then_why_0fd3bc: "If so... then why...?"
  npc_override_1@spa_GhostPalace_if_you_give_any_s_79cd1c: "If you give any ^006400{0}^000000s to me, I can make equipment for you."
  npc_override_1@spa_GhostPalace_if_you_me_what_you_349876: "If you were me, what would you do?"
  npc_override_1@spa_GhostPalace_inside_devices_you_see_d_b5672a: "^ff0000Inside the devices you see a dark hole. If you wish to enter you must to talk to the Unpleasent Royal Guard first.^000000"
  npc_override_1@spa_GhostPalace_let_s_try_re_enter_57a77b: "let's try to re-enter."
  npc_override_1@spa_GhostPalace_magic_sword_tartanos_i_d_788031: "Magic Sword Tartanos! I will destroy you if I can't have you... Oh no! How could this be?"
  npc_override_1@spa_GhostPalace_make_42232a: "to make a ^FF0000{0}^000000."
  npc_override_1@spa_GhostPalace_make_a9894d: "To make a ^FF0000{0}^000000"
  npc_override_1@spa_GhostPalace_marriage_arrangements_go_5274fa: "The marriage arrangements are going as planned. The prince is here to meet with the princess."
  npc_override_1@spa_GhostPalace_memories_everyone_he_lov_c68493: "and the memories of everyone he loved"
  npc_override_1@spa_GhostPalace_memories_faithful_royal_a3c8c8: "The memories of the faithful royal guard"
  npc_override_1@spa_GhostPalace_menu_king_13dd07: "King: Shut up! You've betrayed me! I trusted you... you must pay for your disgrace."
  npc_override_1@spa_GhostPalace_menu_king_1665c0: "King: You will suffer for the rest of your life."
  npc_override_1@spa_GhostPalace_menu_king_2613c5: "King: It was you who brought the monsters here! You want to get rid of me and have the princess for yourself?"
  npc_override_1@spa_GhostPalace_menu_king_26698a: "King: You are hereby appointed as the personal guard to Princess Tiara. I trust your loyalty above all else."
  npc_override_1@spa_GhostPalace_menu_king_e8cb60: "King: The marriage arrangements are going as planned. The prince is here to meet with the princess."
  npc_override_1@spa_GhostPalace_menu_king_f68440: "King: My gods, there are monsters in the castle! Get rid of them now!"
  npc_override_1@spa_GhostPalace_menu_lurid_0bfa4a: "Lurid Royal Guard: no.....Ahh ahh ahh!!!!~!"
  npc_override_1@spa_GhostPalace_menu_lurid_0fd544: "Lurid Royal Guard: The only thing I can do is protect you from physical harm."
  npc_override_1@spa_GhostPalace_menu_lurid_24422a: "Lurid Royal Guard: I will protect the princess with my life."
  npc_override_1@spa_GhostPalace_menu_lurid_27e613: "Lurid Royal Guard: You must decide that for yourself Your Highness..."
  npc_override_1@spa_GhostPalace_menu_lurid_28f10d: "Lurid Royal Guard: Stay behind me. Let's go!"
  npc_override_1@spa_GhostPalace_menu_lurid_53002b: "Lurid Royal Guard: I..I..."
  npc_override_1@spa_GhostPalace_menu_lurid_759923: "Lurid Royal Guard: ...Yes, Your Majesty."
  npc_override_1@spa_GhostPalace_menu_lurid_7c9bb0: "Lurid Royal Guard: No..No!!!!!"
  npc_override_1@spa_GhostPalace_menu_lurid_9e67cc: "Lurid Royal Guard: Where is Princess Tiara?"
  npc_override_1@spa_GhostPalace_menu_lurid_abb506: "Lurid Royal Guard: Who are you? Show yourself!"
  npc_override_1@spa_GhostPalace_menu_lurid_ce9dc0: "Lurid Royal Guard: Princess!"
  npc_override_1@spa_GhostPalace_menu_lurid_d50eb7: "Lurid Royal Guard: Are you satisfied..? Magic Sword Tartanos?"
  npc_override_1@spa_GhostPalace_menu_lurid_ddbec4: "Lurid Royal Guard: ...?"
  npc_override_1@spa_GhostPalace_menu_lurid_e0a456: "Lurid Royal Guard: Your Highness, the King has invited a prince from a neighboring country to be your betrothed. Be ready to meet him..."
  npc_override_1@spa_GhostPalace_menu_lurid_ed1a7a: "Lurid Royal Guard: It is a trap Your Majesty! You must trust me!"
  npc_override_1@spa_GhostPalace_menu_lurid_f3ec27: "Lurid Royal Guard: I will always stand by you and protect you forever."
  npc_override_1@spa_GhostPalace_menu_magic_45c7c1: "Magic Sword Tartanos: Sakray, do not forget the covenant of blood between us."
  npc_override_1@spa_GhostPalace_menu_magic_78de66: "Magic Sword Tartanos: Your soul is mine until you find the blood that satisfies me..."
  npc_override_1@spa_GhostPalace_menu_magic_bac2ec: "Magic Sword Tartanos: How dare you!"
  npc_override_1@spa_GhostPalace_menu_magic_dbf16c: "Magic Sword Tartanos: Kukuku... What do you want boy?"
  npc_override_1@spa_GhostPalace_menu_magic_e8b27d: "Magic Sword Tartanos: I need more blood..Sakray, offer me his blood."
  npc_override_1@spa_GhostPalace_menu_magic_f608c4: "Magic Sword Tartanos: Sakray, offer the blood to me now!"
  npc_override_1@spa_GhostPalace_menu_ominous_49bf43: "Ominous Voice: Oh, faithful royal guard, you are trapped."
  npc_override_1@spa_GhostPalace_menu_ominous_67ae46: "Ominous Voice: I can give you unlimited power. If you make a pact with me."
  npc_override_1@spa_GhostPalace_menu_ominous_c0a745: "Ominous Voice: The conspiracy in the palace has your princess in grave danger..."
  npc_override_1@spa_GhostPalace_menu_ominous_eca466: "Ominous Voice: Ah... so you do you hear me?"
  npc_override_1@spa_GhostPalace_menu_options_22fc0a: "{0} : ..."
  npc_override_1@spa_GhostPalace_menu_options_26756a: "{0} : Sakray, what do you want? Sympathy? Or is it a trap?"
