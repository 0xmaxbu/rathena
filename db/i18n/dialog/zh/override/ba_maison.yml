  npc_override_ba_maison_quests_17_2_based_data_collected_ove_fb7f40: "根据长期收集的数据，人类是一种必要时互相伤害的物种。"
  npc_override_ba_maison_quests_17_2_based_their_behavior_so_638b30: "根据他们目前的行为，他们似乎在日落时暗中活动。"
  npc_override_ba_maison_quests_17_2_basically_your_life_risk_eed7bc: "基本上，你的生命处于危险之中！"
  npc_override_ba_maison_quests_17_2_bathhouse_hygiene_should_d16815: "这里是浴场。卫生应该是首要考虑。清洁人偶因此被加强了。"
  npc_override_ba_maison_quests_17_2_because_i_feel_into_sewe_80dab8: "是因为我掉进下水道了吗？"
  npc_override_ba_maison_quests_17_2_because_i_t_leave_my_317b0d: "因为我离不开锅炉？入侵者破坏了锅炉和阀门，没有时间修理。"
