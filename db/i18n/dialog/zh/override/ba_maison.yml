  npc_override_ba_maison_quests_17_2_my_perspective_sweety_pe_873139: "从我的角度来看……小甜有一个人的大脑，对吗？"
  npc_override_ba_maison_quests_17_2_my_secretary_grey_search_2f6b6f: "我的秘书格雷搜索了不完整的记录，在剩余的工作日志备忘录中发现了这张便条。"
  npc_override_ba_maison_quests_17_2_my_teachers_wouldn_t_aba_11d65c: "我的老师不会抛弃我的！"
  npc_override_ba_maison_quests_17_2_myself_7fcf5a: "我自己？"
  npc_override_ba_maison_quests_17_2_name_fits_you_d2bdea: "这个名字很适合你。"
  npc_override_ba_maison_quests_17_2_nameless_spring_5bfa59: "^006600��无名之泉��^000000"
  npc_override_ba_maison_quests_17_2_navi_pavilion_info_ba_ma_8427cc: "<NAVI>[亭子]<INFO>ba_maison,334,143,0,101,0</INFO></NAVI>在这边。那边的自动人偶会在你送达后处理损坏的中继器。"
  npc_override_ba_maison_quests_17_2_navi_spinning_world_info_1b3b0e: "<NAVI>[旋转世界]<INFO>ba_2whs01,110,217,0,101,0</INFO></NAVI>。他说所有的真相都在它下面。试着找到有这样物品的地方。"
  npc_override_ba_maison_quests_17_2_nearly_exact_coordinates_b3324b: "信号来源的大致确切坐标是……"
  npc_override_ba_maison_quests_17_2_necessary_ll_heal_up_no_b6d785: "有必要吗？很快就会愈合的，我只需要在这里喷点水，再扇几巴掌。"
  npc_override_ba_maison_quests_17_2_needless_say_i_also_reme_e361de: "不用说，我也记得蓝图在哪里。"
  npc_override_ba_maison_quests_17_2_neither_mr_h_we_so_f1aebf: "H先生和我们当时都没有那么血腥。"
  npc_override_ba_maison_quests_17_2_network_check_automatic_64906c: "网络检查，自动纠错。重新确认数据包……"
  npc_override_ba_maison_quests_17_2_network_mansion_been_res_ce7731: "宅邸的网络已经恢复，所有区域的信号正在清晰地发送和接收。"
  npc_override_ba_maison_quests_17_2_network_working_fine_a9974f: "网络运行正常吗？"
  npc_override_ba_maison_quests_17_2_never_come_empty_handed_efc1e2: "永远不要空手而来，听见了吗！"
  npc_override_ba_maison_quests_17_2_next_use_smoke_bomb_blan_343aa8: "接下来，使用烟雾弹和空白炸弹，一边移动一边从一侧到另一侧。小心不要让弹药弄湿，这里有很多水和蒸汽。最后不要损坏这里的设施。"
  npc_override_ba_maison_quests_17_2_nice_see_you_again_f1237b: "很高兴再次见到你。"
  npc_override_ba_maison_quests_17_2_no_b8b9f1: "不。"
  npc_override_ba_maison_quests_17_2_no_c03f1e: "不……"
  npc_override_ba_maison_quests_17_2_no_did_you_wuss_out_504338: "不，你刚才退缩了吗？"
  npc_override_ba_maison_quests_17_2_no_don_t_broken_robot_63804c: "不。不要。损坏的机器人只会移到另一个地方。"
  npc_override_ba_maison_quests_17_2_no_even_if_you_told_311bfe: "不，即使你让我们掩护……"
  npc_override_ba_maison_quests_17_2_no_how_you_may_even_f13254: "不！怎么可能！你可能甚至不知道他们管理中的危险！"
  npc_override_ba_maison_quests_17_2_no_i_just_t_stand_6dae54: "不，我只是受不了因为我是叛徒就这样被骚扰，对吧？"
  npc_override_ba_maison_quests_17_2_no_i_ll_receive_my_dd91c6: "不！我很快就会收到下一个命令！"
  npc_override_ba_maison_quests_17_2_no_i_ve_never_seen_89053a: "不，我从未见过。"
  npc_override_ba_maison_quests_17_2_no_intermittent_signal_b_e508a3: "尚未收到间歇性信号。"
  npc_override_ba_maison_quests_17_2_no_joke_caa03a: "这不是开玩笑！！！"
  npc_override_ba_maison_quests_17_2_no_lucky_you_re_best_3ca8e2: "不！！拉奇你是最棒的！最棒的！！你知道我们真的不能没有拉奇！但是……"
  npc_override_ba_maison_quests_17_2_no_matter_how_good_your_5029a2: "无论你的恢复技能有多好，你都无法恢复头发或衣服……"
  npc_override_ba_maison_quests_17_2_no_matter_how_much_we_01b77e: "无论我们多么使用那份意见混合的记录，我们都无法达成一致。"
  npc_override_ba_maison_quests_17_2_no_mercenaries_didn_t_ev_576fa6: "不，雇佣兵甚至不知道那是政府的人。尸体甚至很晚才被发现。"
  npc_override_ba_maison_quests_17_2_no_need_grand_feel_free_8d2795: "^006600不必拘谨。请随意去泡脚。^000000"
  npc_override_ba_maison_quests_17_2_no_no_i_m_here_c2cca7: "不，不，我也在这里。我是不是有点晚了？"
  npc_override_ba_maison_quests_17_2_no_one_even_knows_what_1aa148: "甚至没有人知道什么东西在哪里。"
  npc_override_ba_maison_quests_17_2_no_one_hurt_they_found_ac9404: "没有人受伤，但他们发现了很多血迹。领导者们仍在调查。"
  npc_override_ba_maison_quests_17_2_no_one_s_stepping_up_a80734: "但没有人站出来。政府不像真正的政府，根本没有前进。"
  npc_override_ba_maison_quests_17_2_no_regular_signals_been_567a01: "尚未收到常规信号。"
  npc_override_ba_maison_quests_17_2_no_s_56a33f: "不，不是……"
  npc_override_ba_maison_quests_17_2_no_s_enough_measure_f26bee: "不，措施足够了，但是……"
  npc_override_ba_maison_quests_17_2_no_tatio_i_ve_sent_d663b1: "不，塔蒂奥！我通过格雷给你打了电话，但我没想到你这么快就到了！"
  npc_override_ba_maison_quests_17_2_no_there_wasn_t_anything_5ba50e: "不，这里什么都没有。完全是空的。你进来时把他带进来了。"
  npc_override_ba_maison_quests_17_2_no_what_am_i_seeing_2d8416: "不，我看到了什么？！！！"
  npc_override_ba_maison_quests_17_2_no_worries_998327: "别担心。"
  npc_override_ba_maison_quests_17_2_no_you_really_member_ill_015ad3: "不，你真的是幻视的成员吗？"
  npc_override_ba_maison_quests_17_2_no_you_t_master_left_0b0632: "不，你不能。主人把我留在这里。所以我必须留在这里。直到主人回来。"
  npc_override_ba_maison_quests_17_2_nom_nom_nom_nom_crunch_5128de: "嘎吱嘎吱嘎吱嘎吱……咔嚓咔嚓……摇晃摇晃……"
  npc_override_ba_maison_quests_17_2_normal_operation_high_si_9b1d2f: "正常运行。信号强度高。"
  npc_override_ba_maison_quests_17_2_nothing_s_wrong_yet_no_9cd337: "目前还没有问题。但没人知道能持续多久。不要放松警惕。"
  npc_override_ba_maison_quests_17_2_now_as_guest_honor_you_c3b4e7: "从现在开始。{0}，作为荣誉客人，您可以自由使用这个宅邸的设施。如果您有任何问题，请随时联系最近的自动人偶。"
  npc_override_ba_maison_quests_17_2_now_c0bb1b: "现在！！"
  npc_override_ba_maison_quests_17_2_now_go_after_remnant_hea_a0262a: "现在，拿着这个，去追击心脏猎手的残余和叛徒。"
  npc_override_ba_maison_quests_17_2_now_gonie_there_s_two_44ab72: "现在，戈尼……有两个。"
  npc_override_ba_maison_quests_17_2_now_how_you_like_solve_0f388b: "现在，你想如何解决这个问题？{0}，带着善意下去，四肢完好地下去，完成它的身体。"
  npc_override_ba_maison_quests_17_2_now_i_m_back_alpha_6c33a2: "现在我应阿尔法的请求回来了。"
  npc_override_ba_maison_quests_17_2_now_i_make_my_own_56f216: "现在，我必须自己行动了。"
  npc_override_ba_maison_quests_17_2_now_i_see_i_don_4c7d6f: "现在我明白了，我不知道为什么把你误认为入侵者。你不一样。"
  npc_override_ba_maison_quests_17_2_now_i_start_my_job_a50f2a: "现在，我可以开始我的工作了。"
  npc_override_ba_maison_quests_17_2_now_i_think_about_i_de0ee7: "现在回想起来，我深感后悔。"
  npc_override_ba_maison_quests_17_2_now_show_us_evidence_91021b: "现在，给我们看看证据。"
  npc_override_ba_maison_quests_17_2_now_tell_us_about_facts_161893: "现在，告诉我们你听到的事实。"
  npc_override_ba_maison_quests_17_2_now_we_open_bathhouse_ou_0d52c9: "从现在开始，我们将向客人开放浴池。在进行搜索时请特别注意，因为有情况和证词怀疑存在不明生物。"
  npc_override_ba_maison_quests_17_2_now_you_re_safe_all_8d781c: "现在你安全了，你所要做的就是将那些叛徒追到底。"
  npc_override_ba_maison_quests_17_2_now_you_use_all_faciliti_def9c7: "现在，作为正式客人，你可以使用宅邸的所有设施。"
  npc_override_ba_maison_quests_17_2_number_items_your_posses_fd42dc: "您拥有的物品数量过多，因此无法继续对话。"
  npc_override_ba_maison_quests_17_2_oh_5235ff: "哦！"
  npc_override_ba_maison_quests_17_2_oh_adventurer_here_too_i_23676e: "哦，冒险者也在这里。如果你是来洗澡的，恐怕暂时不能使用。看那边。自动人偶正在挡住入口。"
  npc_override_ba_maison_quests_17_2_oh_adventurer_here_you_dbb806: "哦，冒险者，你在这里。"
  npc_override_ba_maison_quests_17_2_oh_am_i_wrong_intruder_e88025: "哦，我错了吗？入侵者对锅炉和供应系统非常感兴趣。它们在我不知情的情况下偷走了另一个锅炉。"
  npc_override_ba_maison_quests_17_2_oh_antidote_d6bef5: "哦……，原来如此。解药。"
  npc_override_ba_maison_quests_17_2_oh_any_chance_did_you_fee147: "哦，顺便问一下，你是来给我送备用中继器通信芯片的吗？"
  npc_override_ba_maison_quests_17_2_oh_before_you_looked_aro_dc7704: "哦，在那之前……{0}，你逛过宅邸了吗？"
  npc_override_ba_maison_quests_17_2_oh_cleaning_robot_course_3d7ea9: "哦，清洁机器人？当然，有些管理者这么叫，但是……"
  npc_override_ba_maison_quests_17_2_oh_did_our_hawk_bit_f62548: "哦，我们的鹰咬你了吗？自从被^0000CD入侵者^000000攻击后，它就一直这样。我之前已经修好了，但沃里总是出来这样做……"
  npc_override_ba_maison_quests_17_2_oh_doll_288eeb: "哦，给自动人偶……"
  npc_override_ba_maison_quests_17_2_oh_here_you_way_lucky_e2b7aa: "哦，你在这里，这边，拉奇还没来吗？"
  npc_override_ba_maison_quests_17_2_oh_i_am_f87901: "哦，我是……"
  npc_override_ba_maison_quests_17_2_oh_i_forgot_tell_you_8b7d5b: "哦，我忘了告诉你这个。"
  npc_override_ba_maison_quests_17_2_oh_i_ll_also_take_07a19a: "哦，我也要把雷达拿走。"
  npc_override_ba_maison_quests_17_2_oh_i_m_feeling_little_a629ec: "哦……我现在感觉好点了。入侵者什么的。我只要跨过那条河就行了，啊哈哈哈……"
  npc_override_ba_maison_quests_17_2_oh_i_m_so_sick_442514: "哦，我受够了……"
  npc_override_ba_maison_quests_17_2_oh_my_god_guy_so_a90ee8: "哦，我的天。这家伙真是……"
  npc_override_ba_maison_quests_17_2_oh_no_even_automatic_dol_30f639: "哦不……连自动人偶都……"
  npc_override_ba_maison_quests_17_2_oh_no_wonder_network_sto_7f5e57: "哦，难怪！网络突然停止工作了。中继器不工作了！那阿尔法为什么不来？"
  npc_override_ba_maison_quests_17_2_oh_one_who_went_search_fbd598: "哦！去搜索的人回来了。和他们谈谈。"
  npc_override_ba_maison_quests_17_2_oh_ran_away_just_grab_69c12d: "哦，它跑了！再抓一个坏的给我带来。"
  npc_override_ba_maison_quests_17_2_oh_really_i_didn_t_f8c23d: "哦，真的吗？我不知道，因为我已经很久没见过人类了。"
  npc_override_ba_maison_quests_17_2_oh_really_then_go_ahead_0c377f: "哦，真的吗？那先去<NAVI>[亭子]<INFO>ba_maison,334,143,0,0,0</INFO></NAVI>。这里是最近的。沿着这条路走。"
  npc_override_ba_maison_quests_17_2_oh_s_because_everytime_t_55654e: "哦，是因为那个！每次我发现有东西坏了，我就修理它，但如你所见，即使我移开视线片刻，沃里也会出来把它弄成这样。"
  npc_override_ba_maison_quests_17_2_oh_s_dangerous_161d5e: "哦，危险！"
  npc_override_ba_maison_quests_17_2_oh_s_mochi_aren_t_0e45de: "哦，不是麻糬吗？你不是我之前遇到的那个人吗？那么，肉？你喜欢肉吗？你喜欢肉，不是吗？我从没见过不喜欢肉的人。我会把我所有的肉都给你。"
  npc_override_ba_maison_quests_17_2_oh_s_right_dbe0d9: "哦~~没错！"
  npc_override_ba_maison_quests_17_2_oh_s_right_he_also_9b8ad1: "哦，对了！他也让我去了湖边！"
  npc_override_ba_maison_quests_17_2_oh_s_serious_situation_06899e: "哦。情况很严重。"
  npc_override_ba_maison_quests_17_2_oh_s_working_there_eithe_04ec82: "哦，那边也不工作了。"
  npc_override_ba_maison_quests_17_2_oh_she_s_princess_her_e5e0b1: "哦，她不是公主。她的名字是公主"
  npc_override_ba_maison_quests_17_2_oh_sound_me_singing_you_c3e772: "哦。我唱歌的声音？你把我误认为是损坏的自动人偶？但那是什么？你身后的那个东西？"
  npc_override_ba_maison_quests_17_2_oh_there_no_concept_ware_4ff3bd: "哦，人类外面没有仓库的概念吗？仓库就是存放你不用的东西的地方。"
  npc_override_ba_maison_quests_17_2_oh_there_s_another_one_6e46ae: "哦，还有一个！你为什么把海带放在浴池里，然后把水涂在脸上？"
  npc_override_ba_maison_quests_17_2_oh_there_s_something_jus_1f9f23: "哦，那边正好有东西？！"
  npc_override_ba_maison_quests_17_2_oh_what_should_i_i_95e53b: "哦，我该怎么办？我被告知不要跑向入侵者。你是来^0000CD拿走我的零件^000000的吗？这就是我的终结吗？"
  npc_override_ba_maison_quests_17_2_oh_where_eisen_werner_17caca: "哦，艾森·沃纳在哪里。"
  npc_override_ba_maison_quests_17_2_oh_who_s_3f71af: "哦？这是谁？！"
  npc_override_ba_maison_quests_17_2_oh_you_need_fix_quickly_c02631: "哦，你需要快点修理它。"
  npc_override_ba_maison_quests_17_2_oh_you_re_guest_aren_78c3c8: "哦，你是客人，不是吗？那些在亭子前面来来往往的也是客人。"
  npc_override_ba_maison_quests_17_2_oh_you_re_real_guest_e0ea5b: "哦，你是真正的客人，不是吗？你是有权限进入所有区域的特殊客人……我为我的错误道歉。请原谅我。"
  npc_override_ba_maison_quests_17_2_oh_you_s_unexpected_ddc851: "哦，你愿意？真意外。"
  npc_override_ba_maison_quests_17_2_oh_you_should_ve_asked_42ba92: "哦，你应该先问是谁。"
  npc_override_ba_maison_quests_17_2_oh_you_understand_you_re_b4c407: "哦，你能理解你中毒了。"
  npc_override_ba_maison_quests_17_2_ohhhhhhhhhhhhhhhhh_4733ff: "哦hhhhhhhhhhhhhhhh！！"
  npc_override_ba_maison_quests_17_2_okay_4371ac: "好的。"
  npc_override_ba_maison_quests_17_2_okay_i_ll_help_you_e7bf8b: "好的。我会帮你。"
  npc_override_ba_maison_quests_17_2_okay_i_ll_stay_then_89dfcc: "好的。我会留下来。那我去查看入口区域。反正我必须检查谁进谁出。浴池只有一个入口。"
  npc_override_ba_maison_quests_17_2_okay_if_so_me_favor_983f02: "……好的。如果是这样，帮我个忙。"
  npc_override_ba_maison_quests_17_2_okay_magenta_go_molar_a773f1: "……好的。洋红。和莫拉一起去。"
  npc_override_ba_maison_quests_17_2_okay_shall_we_talk_now_560996: "好的。我们现在谈谈吗？你到底是谁？"
  npc_override_ba_maison_quests_17_2_okay_so_rachel_879045: "好的，那么拉切尔……"
  npc_override_ba_maison_quests_17_2_oldest_most_famous_bath_3a433d: "^006600瓦尔蒙特宅邸最古老、最著名的浴池。在这个浴池中浸泡，思考你心中最深、最困难的事情。答案一定会浮现。^000000"
  npc_override_ba_maison_quests_17_2_once_again_i_apologize_m_b4214a: "再次为我的错误道歉。"
  npc_override_ba_maison_quests_17_2_once_i_read_book_i_3778ce: "但一旦我读过一本书，我就会记住里面的每一个字。"
  npc_override_ba_maison_quests_17_2_once_we_decrypt_code_ll_a8e337: "一旦我们解密代码，就会很快。"
  npc_override_ba_maison_quests_17_2_one_more_time_625930: "再来一次。"
  npc_override_ba_maison_quests_17_2_one_too_cd6286: "那个也是……"
  npc_override_ba_maison_quests_17_2_only_authorize_persons_a_fda0a8: "只有授权人员才能进入该区域。"
  npc_override_ba_maison_quests_17_2_only_master_after_going_3e7e92: "这原本只为主人准备，但在下到地下室后，主人留下了一把紧急钥匙，只有在主人出事或发生危险紧急情况时才能使用。"
  npc_override_ba_maison_quests_17_2_only_path_corporate_clea_1f2557: "公司唯一的出路是清除过去，改善现在。"
  npc_override_ba_maison_quests_17_2_only_possible_because_ve_c9243d: "这之所以可能，是因为这是一个与外面看到的大不相同的大空间。所以如果你在等它，请回去等我……我很快就会带给你。"
  npc_override_ba_maison_quests_17_2_ooh_uh_2b5efa: "- ……哦……呃…… -"
  npc_override_ba_maison_quests_17_2_opinion_excluded_worthle_543c07: "被排除者的意见毫无价值。"
  npc_override_ba_maison_quests_17_2_opponent_very_fast_water_97073b: "对手在水上会非常快。就像水生生物一样。"
  npc_override_ba_maison_quests_17_2_order_manage_corporate_i_03201e: "为了维护公司的完整性。我们将严格执行可以防止这些事情在未来发生的规则。"
  npc_override_ba_maison_quests_17_2_other_guests_affiliation_813885: "但其他客人有隶属关系，不是吗？"
  npc_override_ba_maison_quests_17_2_other_parts_mansion_also_d525da: "宅邸的其他部分也人手不足，所以我们必须自己做。我尽可能清理，但太多了。这关系到卫生和安全，不能拖延太久。那么，请。"
  npc_override_ba_maison_quests_17_2_others_already_found_boo_2e8dcb: "其他人已经找到了一本书，并被它迷住了……"
  npc_override_ba_maison_quests_17_2_otherwise_s_likely_fall_1cc312: "否则，它很可能会落入他们手中。"
  npc_override_ba_maison_quests_17_2_otl_2f357b: "(��^��) OTL .."
  npc_override_ba_maison_quests_17_2_ouch_7668bc: "哎哟！！！"
  npc_override_ba_maison_quests_17_2_our_opponent_knows_bathh_3586d1: "我们的对手对这个浴池很熟悉。鉴于它知道间歇性排水的湖的存在，它可能也知道一条秘密通道。"
  npc_override_ba_maison_quests_17_2_our_repeaters_only_three_a692eb: "在20个中继器中，只有三个没有响应。我很高兴数量很少。我们将前往信号无法通过的地方，手动传递更新后的客人名单。我们还需要检查中继器。"
  npc_override_ba_maison_quests_17_2_our_turn_now_why_don_b15114: "现在轮到我们了吗？我们一边登记一边谈怎么样？"
  npc_override_ba_maison_quests_17_2_over_there_82314f: "在那边……"
  npc_override_ba_maison_quests_17_2_p_peeep_be4880: "吱-吱吱-"
  npc_override_ba_maison_quests_17_2_party_created_using_orga_41fb7f: "^0000CD可以使用/organize 队伍名 命令创建队伍。^000000"
  npc_override_ba_maison_quests_17_2_past_no_s_about_what_14d8be: "过去？不。是关于现在正在发生的事情，现在。那些反叛的孩子和那些还在科尔生病的人正在发生。"
