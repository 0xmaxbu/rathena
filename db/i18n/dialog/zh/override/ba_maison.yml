  npc_override_ba_maison_quests_17_2_you_really_know_master_s_e314ac: "你真的认识主人，所以你是客人？那么，请告诉我你的名字。"
  npc_override_ba_maison_quests_17_2_you_really_like_fighting_a31248: "你真的喜欢战斗。那么，我想让你处理地下室里的^0000CD20个损坏仓库管理者^000000。"
  npc_override_ba_maison_quests_17_2_you_really_like_fighting_cfbdd4: "你真的喜欢战斗。那么，我想让你处理仓库里的^0000CD20个心脏猎手散兵^000000。"
  npc_override_ba_maison_quests_17_2_you_reek_don_t_come_3a8404: "你臭死了，别靠近我，你这个白痴！！！"
  npc_override_ba_maison_quests_17_2_you_remember_any_guests_c425c7: "- 你还记得任何客人的对话吗？-"
  npc_override_ba_maison_quests_17_2_you_rest_assured_5408b6: "你可以放心。"
  npc_override_ba_maison_quests_17_2_you_rocky_lucky_anyways_03d556: "还有你……是洛基吗？拉奇？总之，反叛者，谢谢你为我奔波。"
  npc_override_ba_maison_quests_17_2_you_rotten_smell_67274c: "你有一股腐烂的味道……"
  npc_override_ba_maison_quests_17_2_you_rude_place_anyone_co_c560af: "你真无礼……！这不是任何人都可以随意进出的地方。你为什么偷偷摸摸地找我？"
  npc_override_ba_maison_quests_17_2_you_said_s_broken_why_b7291b: "你说它坏了，但为什么它们不倒下和闪烁？为什么它们在攻击？自动人偶不应该攻击客人，对吗？"
  npc_override_ba_maison_quests_17_2_you_said_you_should_go_3bfc4e: "你说，你应该上去向另一个自动人偶报告，对吗？你认为我能做到吗？"
  npc_override_ba_maison_quests_17_2_you_said_you_should_go_d83ed6: "你说，你应该上去向另一个自动人偶报告，对吗？好吧，再见！谢谢你的帮助。"
  npc_override_ba_maison_quests_17_2_you_saved_my_life_c81bdf: "你救了我的命！"
  npc_override_ba_maison_quests_17_2_you_saying_we_re_lying_3a8031: "你是说我们在撒谎？即使听了管理者的话？！"
  npc_override_ba_maison_quests_17_2_you_saying_you_re_going_b90f32: "你是说你要整理那些清洁机器人？"
  npc_override_ba_maison_quests_17_2_you_saying_you_t_believe_797951: "你是说你不能无条件相信政府制作的报告？"
  npc_override_ba_maison_quests_17_2_you_see_all_wine_here_89bc20: "你能看到这里的所有酒吗？"
  npc_override_ba_maison_quests_17_2_you_seem_bit_short_f84741: "你看起来有点矮？"
  npc_override_ba_maison_quests_17_2_you_seem_happy_i_don_b947e7: "你看起来很高兴。我不知道是什么让你高兴。"
  npc_override_ba_maison_quests_17_2_you_seen_even_if_i_68f5dc: "你看到了吗？即使我叫上级，现在也不会有帮助。我甚至不能再开始生火了。如果你不跟我说话，我本可以开始的。"
  npc_override_ba_maison_quests_17_2_you_seen_intruder_before_30d180: "你以前见过入侵者吗？当我在浴池里发现它们时，我的入侵者开关被激活了，我没有让它们进来。但它们成群结队地强行闯入。"
  npc_override_ba_maison_quests_17_2_you_seen_lot_your_way_da8685: "你在来的路上看到很多这个吗？"
  npc_override_ba_maison_quests_17_2_you_seen_my_party_01983b: "你看到我的队伍了吗？"
  npc_override_ba_maison_quests_17_2_you_self_proclaimed_elit_3e61d9: "你是自称的幻视精英成员吗？"
  npc_override_ba_maison_quests_17_2_you_should_anything_plea_3d2d09: "你应该做任何让我高兴的事！"
  npc_override_ba_maison_quests_17_2_you_should_changed_cloth_3acb69: "你应该换衣服……"
  npc_override_ba_maison_quests_17_2_you_should_get_ready_ope_a0e304: "你应该为行动做好准备。"
  npc_override_ba_maison_quests_17_2_you_showing_pity_me_bein_b85c5c: "你在可怜我在仓库的自动人偶面前无助吗？人类会为他们没做过的事情感到负责吗？"
  npc_override_ba_maison_quests_17_2_you_something_you_need_y_509d3e: "你有什么需要或有什么不舒服吗？"
  npc_override_ba_maison_quests_17_2_you_sound_like_heroine_r_773e6b: "你听起来像言情小说里的女主角，但另一方非常模糊。"
  npc_override_ba_maison_quests_17_2_you_speak_navi_harad_inf_3422b4: "你可以和旁边的<NAVI>[哈拉德]<INFO>ba_maison,238,44,0,101,0</INFO></NAVI>说话，然后进入水上花园。"
  npc_override_ba_maison_quests_17_2_you_specific_record_mind_22b65e: "你有特定的记录吗？"
  npc_override_ba_maison_quests_17_2_you_start_training_95f195: "你可以开始训练。"
  npc_override_ba_maison_quests_17_2_you_still_quite_inexperi_bd9f05: "你还很缺乏经验。"
  npc_override_ba_maison_quests_17_2_you_t_he_s_victim_cd5d8a: "你不能那样。他是受害者。对吗，戈尼？"
  npc_override_ba_maison_quests_17_2_you_t_i_t_help_2f7f4d: "你不能那样，但我也帮不了你。我会尽快派人帮你。但得等到明天。"
  npc_override_ba_maison_quests_17_2_you_t_more_you_delay_2b482a: "你不能。你越这样拖延我，过程就越慢。再等一会儿。并请客人理解。"
  npc_override_ba_maison_quests_17_2_you_take_look_chips_fron_939d78: "你能看看……我面前的芯片……"
  npc_override_ba_maison_quests_17_2_you_taken_care_everythin_2c17c4: "你处理完一切了吗？"
  npc_override_ba_maison_quests_17_2_you_talk_him_301f6f: "你能和他谈谈吗？"
  npc_override_ba_maison_quests_17_2_you_talk_too_badly_come_ee7f89: "你说得太难听了。来吧，有什么办法吗？"
  npc_override_ba_maison_quests_17_2_you_tell_automatic_dolls_0f096d: "你能告诉损坏中继器附近的自动人偶检查损坏的中继器吗？"
  npc_override_ba_maison_quests_17_2_you_telling_me_leave_sup_2be99c: "你是让我把上级留下解决这个问题吗？"
  npc_override_ba_maison_quests_17_2_you_think_as_saving_trou_301b4d: "你可以把它看作是为我们自动人偶省去麻烦。"
  npc_override_ba_maison_quests_17_2_you_think_i_ll_tell_245abd: "你以为那样我就会告诉你什么……？"
  npc_override_ba_maison_quests_17_2_you_think_right_enemies_175199: "你认为敌人叫你叛徒是对的吗？"
  npc_override_ba_maison_quests_17_2_you_think_s_internal_div_e84598: "（你认为这是内部分裂？话说回来，你说他是上次行动研究设施的主任，对吗？他是怎么被我们抓住的？）"
  npc_override_ba_maison_quests_17_2_you_think_they_re_alread_465873: "你认为它们已经在这里了吗？"
  npc_override_ba_maison_quests_17_2_you_those_punks_acb8f4: "你和那些混蛋是一伙的吗？"
  npc_override_ba_maison_quests_17_2_you_too_many_items_e50381: "- 你的物品太多了。"
  npc_override_ba_maison_quests_17_2_you_trying_control_me_dc6278: "你想控制我吗？"
  npc_override_ba_maison_quests_17_2_you_trying_take_over_me_09aeff: "你想接管我？？试试看！！"
  npc_override_ba_maison_quests_17_2_you_two_leave_me_don_38de4b: "你们两个，交给我。别担心这个地方。"
  npc_override_ba_maison_quests_17_2_you_unregistered_guest_y_409f93: "你不是未登记的客人，你是这里的常客。"
  npc_override_ba_maison_quests_17_2_you_ve_been_having_hard_3b120e: "你从昨晚开始就很辛苦。"
  npc_override_ba_maison_quests_17_2_you_ve_been_lying_us_107b60: "你已经对我们撒谎好几次了！"
  npc_override_ba_maison_quests_17_2_you_ve_brought_lot_well_3a9024: "你带来了很多。好吧，我用这张巴美餐券和你交换。谢谢。"
  npc_override_ba_maison_quests_17_2_you_ve_only_been_fooled_d4d913: "你只是被骗了。"
  npc_override_ba_maison_quests_17_2_you_ve_read_all_haven_bcb8f1: "你已经读完了，不是吗？"
  npc_override_ba_maison_quests_17_2_you_ve_returned_one_piec_1573c5: "你安然无恙地回来了。"
  npc_override_ba_maison_quests_17_2_you_ve_secured_grand_pap_c70fd1: "你已经确保了一个大帕皮拉。"
  npc_override_ba_maison_quests_17_2_you_ve_secured_silva_pap_95d8a7: "你已经确保了一个西尔瓦·帕皮拉。"
  npc_override_ba_maison_quests_17_2_you_want_any_records_gue_e430ba: "你想要过去客人的任何记录吗？"
  npc_override_ba_maison_quests_17_2_you_weren_t_making_false_cae1b4: "你并没有制造假证据。你只是不知道真相。"
  npc_override_ba_maison_quests_17_2_you_weren_t_warned_killi_b2bb97: "你没有因为灭火而受到警告，所以没关系，对吗？"
  npc_override_ba_maison_quests_17_2_you_what_you_talking_abo_bd9aee: "你……？你在说什么？"
  npc_override_ba_maison_quests_17_2_you_won_t_able_receieve_b762f3: "即使来了你也收不到。"
  npc_override_ba_maison_quests_17_2_you_working_like_helpful_21a25f: "你这样做是为了有帮助，为了帮助人们。"
  npc_override_ba_maison_quests_17_2_you_wouldn_t_able_say_22ef51: "如果你知道入侵者破坏了我们多少珍贵的工作，你就不会这么说了。"
  npc_override_ba_maison_quests_17_2_you_you_going_get_out_6cb2f8: "你，你要么从我脑子里出去，要么我出去！"
  npc_override_ba_maison_quests_17_2_you_your_library_registr_009c55: "你已经有图书馆登记了，有你在找的书吗？"
  npc_override_ba_maison_quests_17_2_your_complexion_looks_li_11ce31: "你的脸色看起来像泥土。你走不直……你得换掉湿衣服。"
  npc_override_ba_maison_quests_17_2_your_face_changed_lot_wh_b6aead: "但是……你的脸变了很多。发生了什么？你去哪里了？你在做什么？"
  npc_override_ba_maison_quests_17_2_your_gaze_feels_cold_029f24: "你的目光感觉很冷。"
  npc_override_ba_maison_quests_17_2_your_party_been_granted_ef4166: "你的^0000CD队伍^000000已被自动授予正式身份，因为它们是前几天访问这个宅邸的^0000CD同一队伍^000000。"
  npc_override_ba_maison_quests_17_2_your_party_went_navi_lou_8bd741: "你的队伍去了<NAVI>[休息室]<INFO>ba_bath,203,58,0,101,0</INFO></NAVI>。"
  npc_override_ba_maison_quests_17_2_your_words_gives_me_hear_341a76: "你的话让我心痛。"
  npc_override_ba_maison_quests_17_2_zzzz_eb1369: "(��_��). .(��_��). .(zZzZ)"
