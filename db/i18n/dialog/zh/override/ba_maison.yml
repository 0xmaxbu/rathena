  npc_override_ba_maison_quests_17_2_i_apologize_bath_house_c_315168: "很抱歉，但浴池目前因内部状况关闭，我们无法保证重新开放时间。请稍后再来。如果您想要安静的沐浴，请使用客房提供的私人浴室。"
  npc_override_ba_maison_quests_17_2_i_apologize_causing_you_d5cd96: "很抱歉给您添麻烦了。请原谅我。但你知道吵架后友谊会变得更牢固吗？我们不是瓦尔蒙特的同一批客人。"
  npc_override_ba_maison_quests_17_2_i_apologize_could_you_wa_bbd03a: "很抱歉，但您能再等一会儿吗？我必须检查哪个区域有问题，并手动转发更新后的客人名单。"
  npc_override_ba_maison_quests_17_2_i_apologize_listening_yo_3b7049: "很抱歉没有听你的恳求。"
  npc_override_ba_maison_quests_17_2_i_apologize_varmundt_man_a930be: "我很抱歉。瓦尔蒙特宅邸的政策是让客人远离^0000CD危险情况^000000。请稍等片刻。"
  npc_override_ba_maison_quests_17_2_i_arrived_crux_prontera_0e8788: "我和克鲁克斯一起到达了普隆德拉宫殿，宫殿里充满了奇怪的兴奋气氛。"
  npc_override_ba_maison_quests_17_2_i_as_you_say_e0df5b: "我会照您说的做。"
