  npc_override_ba_maison_quests_17_2_somehow_s_good_your_heal_95ffa8: "但不知怎的对健康有好处，这就是为什么我们在每个浴池里都放满草药叶。人类是用皮肤呼吸的吗？还是你们用皮肤喝水？"
