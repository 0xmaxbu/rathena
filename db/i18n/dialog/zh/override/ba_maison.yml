  npc_override_ba_maison_quests_17_2_s_fine_as_long_as_1bb62d: "只要杏仁盯着他，就没问题。"
  npc_override_ba_maison_quests_17_2_s_fountain_where_dew_was_29d851: "- 这是杜洗身体的地方。"
  npc_override_ba_maison_quests_17_2_s_fun_i_wonder_what_2d0078: "很有趣。我想知道它用什么机器工作。"
  npc_override_ba_maison_quests_17_2_s_ghost_ghost_0e1ad1: "是幽灵。一定是幽灵！"
