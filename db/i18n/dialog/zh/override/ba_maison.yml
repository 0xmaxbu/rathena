  npc_override_ba_maison_quests_17_2_searching_no_results_fou_c55736: "搜索中……未找到结果。我们没有该信息的任何记录。"
  npc_override_ba_maison_quests_17_2_searching_searching_sear_f8c03e: "搜索中，搜索中……搜索完成。关于H先生的记录非常少……"
  npc_override_ba_maison_quests_17_2_searching_through_record_938e7b: "搜索中……通过清洁机器人的记录，我可以引导你到该记录中最后识别的位置。"
  npc_override_ba_maison_quests_17_2_second_warehouse_varmund_392bac: "这是瓦尔蒙特宅邸的第二仓库。"
  npc_override_ba_maison_quests_17_2_security_been_triggeered_5cf129: "一旦外人以不寻常的方式进入宅邸，安全系统肯定会被触发。好的。打扰一下。我会确保你在作为正式客人登记和使用浴池时没有任何不便。"
  npc_override_ba_maison_quests_17_2_see_isn_t_funny_watching_36f148: "（看，不有趣吗？看着他们那样打架。）"
  npc_override_ba_maison_quests_17_2_see_you_later_666aad: "回头见~"
  npc_override_ba_maison_quests_17_2_see_you_later_d94b6f: "回头见。"
  npc_override_ba_maison_quests_17_2_see_you_later_e6b5d3: "回头见，{0}。"
  npc_override_ba_maison_quests_17_2_seeing_i_told_you_go_930bbd: "既然我告诉你去湖边，我想它是想以某种方式把你弄出浴池。所以它不是超自然生物。"
  npc_override_ba_maison_quests_17_2_seems_first_thing_you_ne_6b8cb7: "看来你在这里要做的第一件事就是登记为客人。"
  npc_override_ba_maison_quests_17_2_seems_he_already_incapab_178dc5: "- 看来他已经无法采取任何行动了。我们去给他找一片世界树之叶吧。-"
  npc_override_ba_maison_quests_17_2_seems_his_away_often_0e0b9d: "看来他经常不在。"
  npc_override_ba_maison_quests_17_2_seems_purifying_device_d_0f32ea: "- 这似乎是一个净化脏水的装置。-"
  npc_override_ba_maison_quests_17_2_seems_you_re_mistaken_sw_6a0950: "看来你误会了，小甜。"
  npc_override_ba_maison_quests_17_2_seems_you_rest_enough_yo_2fd94a: "看来你休息够了，你想再和火龙果玩吗？"
  npc_override_ba_maison_quests_17_2_self_introduction_time_i_b9672b: "是自我介绍时间吗？我听说这里的人在社交前会先自我介绍。我是公主。我来自东海。"
  npc_override_ba_maison_quests_17_2_setting_fire_cleanest_wa_44857e: "^CC0000放火烧掉^000000会是最干净的方法，你不觉得吗？"
