  npc_override_ba_maison_quests_17_2_menu_security_a4122f: "安全办公室:目前，所有入侵者已被击退。不再需要巡逻，完毕。"
  npc_override_ba_maison_quests_17_2_menu_tatio_23ed44: "塔蒂奥:我会谦卑地倾听一切。"
  npc_override_ba_maison_quests_17_2_menu_tess_5101ad: "苔丝:请注意里德什。"
  npc_override_ba_maison_quests_17_2_menu_tess_d63f2e: "苔丝:感谢你的一切帮助，冒险者。"
  npc_override_ba_maison_quests_17_2_menu_tess_f51214: "苔丝:我想凯亚·托斯有话要说。"
  npc_override_ba_maison_quests_17_2_menu_tess_f99d4a: "苔丝:我们都在公司的掌控之中。"
  npc_override_ba_maison_quests_17_2_mercenaries_culprit_29f8ec: "但是，雇佣兵不是罪魁祸首。"
