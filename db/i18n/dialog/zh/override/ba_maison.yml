  npc_override_ba_maison_quests_17_2_as_guest_requested_i_ll_f521aa: "按照客人的要求。我将从数据库中随机选择关于佣兵的记录。"
  npc_override_ba_maison_quests_17_2_as_i_mentioned_illusion_a58463: "正如我所说，幻影^0000CD魔法中毒的萨纳雷^000000仍在第二发电厂安装我之前提到的干扰芯片。如果我这样进去，我可能会再次出现故障。"
