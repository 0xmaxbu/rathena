  npc_override_ba_maison_quests_17_2_course_s_old_warehouse_v_5b7bfa: "当然，那是瓦尔蒙特的老仓库。"
  npc_override_ba_maison_quests_17_2_create_df99f1: "创建'{0}'。"
  npc_override_ba_maison_quests_17_2_currently_there_no_recep_bf794f: "目前，没有收到主人3号收藏品的信号，但我们捕捉到了一些不寻常的信号。"
  npc_override_ba_maison_quests_17_2_cute_a26748: "可爱。"
  npc_override_ba_maison_quests_17_2_cyan_danae_next_monsters_6a5e43: "塞安和达娜厄。接下来是怪物。既然是浴场，应该会有水生怪物或者类似的东西。所以重点关注浴池和管道。"
  npc_override_ba_maison_quests_17_2_damn_am_i_afraid_die_c1ccbd: "该死……我会怕这样死掉吗！"
  npc_override_ba_maison_quests_17_2_damn_b27375: "该死！"
  npc_override_ba_maison_quests_17_2_damn_humans_most_them_se_b7b217: "该死的人类。他们大多数似乎已经逃走了，但还有一些留下来。我在这里见过他们几次。他们在找食物。"
  npc_override_ba_maison_quests_17_2_damn_i_won_t_run_e2cf60: "该死！我不会逃跑的，停下！"
  npc_override_ba_maison_quests_17_2_dear_guests_you_here_7868b9: "亲爱的'客人'，你在这里吗？"
  npc_override_ba_maison_quests_17_2_denny_canine_humans_like_dd4e55: "丹尼和卡宁。人类很可能是单独的或成群的幻影残余，或者第三方。也有可能他们使用了除已知出口之外的其他出口，所以请仔细检查设施。"
  npc_override_ba_maison_quests_17_2_denny_magenta_hold_fake_69b228: "丹尼，马真塔。牢牢抓住那个冒牌货。"
  npc_override_ba_maison_quests_17_2_denny_prepare_set_up_tra_6f2d37: "丹尼，准备设置陷阱。一个严密的陷阱。"
  npc_override_ba_maison_quests_17_2_devices_supply_energy_ci_d2e426: "这个装置可以为一个城市提供能量……不，它可以为国家级别提供能量。"
  npc_override_ba_maison_quests_17_2_dew_37875b: "露水？！"
  npc_override_ba_maison_quests_17_2_dew_5d9d0c: "露水。"
  npc_override_ba_maison_quests_17_2_diagnosis_needed_i_been_87c6ae: "不需要诊断。我已经被告知发生了什么。"
  npc_override_ba_maison_quests_17_2_did_h_needed_more_barmea_6c027e: "H.需要更多餐券吗？"
  npc_override_ba_maison_quests_17_2_did_you_bring_automatic_afec54: "你把我要求的自动人偶通讯芯片带来了吗？"
  npc_override_ba_maison_quests_17_2_did_you_bring_give_me_87cde8: "你带来了吗？给我。我来修。非常感谢你把它带来。"
  npc_override_ba_maison_quests_17_2_did_you_check_situation_c47315: "你检查地下的情况了吗？"
  npc_override_ba_maison_quests_17_2_did_you_come_back_here_83fc21: "你回来是为了死在我手上吗？"
  npc_override_ba_maison_quests_17_2_did_you_come_here_find_bc04c0: "你是来这里找宅邸蓝图的吗？"
  npc_override_ba_maison_quests_17_2_did_you_enjoy_i_wonder_5e5d23: "你喜欢吗？我不知道你从中得到的是破坏的快感还是保护的快感，但我没必要知道。"
  npc_override_ba_maison_quests_17_2_did_you_forgot_about_the_264222: "你忘了吗？那就请消灭^0000CD15只沸腾食人鱼和15只沸腾马克^000000。"
  npc_override_ba_maison_quests_17_2_did_you_found_anything_u_970226: "你发现了什么异常吗？"
  npc_override_ba_maison_quests_17_2_did_you_handle_broken_au_771358: "你处理了20个损坏的自动人偶吗？你哪里受伤了吗？"
  npc_override_ba_maison_quests_17_2_did_you_hear_82aaa9: "你听到了吗？"
  npc_override_ba_maison_quests_17_2_did_you_received_course_7586d6: "你收到这个了吗？当然，这是只有园丁才有的零食，也可以用来确认他们是否平安。"
  npc_override_ba_maison_quests_17_2_did_you_see_me_too_9f941e: "你也看到我了吗？"
  npc_override_ba_maison_quests_17_2_didn_t_you_join_erst_4b9987: "你不是上次行动和厄斯特一起的吗？"
  npc_override_ba_maison_quests_17_2_didn_t_you_say_we_07ffcc: "你不是说过我们应该去湖边吗？"
  npc_override_ba_maison_quests_17_2_didn_t_you_see_her_8fce19: "你来的时候没看到她吗？"
  npc_override_ba_maison_quests_17_2_dien_please_check_authen_e126a3: "迪恩，请再次检查真实性。"
  npc_override_ba_maison_quests_17_2_difficult_if_there_confl_17f205: "如果因管辖权发生冲突，会很困难。"
  npc_override_ba_maison_quests_17_2_docks_there_no_ships_ope_830bbd: "这里是码头，但目前没有船只在运行。"
  npc_override_ba_maison_quests_17_2_document_goverment_exami_26363e: "这是政府审查的文件，当时佣兵们住在瓦尔蒙特宅邸。"
  npc_override_ba_maison_quests_17_2_doesn_t_change_fact_they_54d7c0: "但这并不能改变他们是入侵者的事实。不同于之前只是好奇的客人，他们潜入了宅邸并在里面进行各种暴力行为。你不觉得他们像小偷吗？"
  npc_override_ba_maison_quests_17_2_doesn_t_left_one_looks_48a361: "左边那个看起来不像高尼吗？他看起来很辛苦？"
  npc_override_ba_maison_quests_17_2_doesn_t_mean_elly_take_5b0f19: "那不就意味着艾莉会帮你接单吗？"
  npc_override_ba_maison_quests_17_2_doesn_t_mean_they_abando_0d323e: "那不就意味着他们抛弃了你吗？"
  npc_override_ba_maison_quests_17_2_doesn_t_mean_you_thief_c17662: "那不意味着你是小偷。因为你不会符合客人的资格。瓦尔蒙特宅邸不会邀请所有人当客人。"
  npc_override_ba_maison_quests_17_2_doesn_t_seem_interested_2e0661: "但是。{0}似乎对此不感兴趣。我只是想知道你是不是想拿走锅炉。如果我错了那就当我没说。"
  npc_override_ba_maison_quests_17_2_doll_looked_me_up_down_d38423: "- 人偶上下打量了我一番，然后转过头。 -"
  npc_override_ba_maison_quests_17_2_doll_told_me_go_up_8a0eab: "人偶告诉我从这条路往上走然后左转去<NAVI>[中央花园]<INFO>ba_maison,245,206,0,0,0</INFO></NAVI>。"
  npc_override_ba_maison_quests_17_2_don_t_blame_mr_h_b405c2: "不要太责怪H先生。"
  npc_override_ba_maison_quests_17_2_don_t_come_any_closer_bc5818: "别再靠近了。"
  npc_override_ba_maison_quests_17_2_don_t_compare_us_you_6e7e30: "别拿我们和你比较。"
  npc_override_ba_maison_quests_17_2_don_t_don_t_come_fc65d6: "不要……不要靠近我！！"
  npc_override_ba_maison_quests_17_2_don_t_even_think_about_d75386: "别想使用武器，我比你快得多。你从哪里来？"
  npc_override_ba_maison_quests_17_2_don_t_forget_take_you_574faa: "别忘了把它带走。"
  npc_override_ba_maison_quests_17_2_don_t_joke_like_lazy_dc609f: "别这样开玩笑，懒鬼！"
  npc_override_ba_maison_quests_17_2_don_t_leave_me_alone_944464: "别丢下我一个人，即使我又刻薄又讽刺！求你了，你明白吗？"
  npc_override_ba_maison_quests_17_2_don_t_look_me_like_111906: "别那样看着我。我在人类中听过我的名字，但我出生和长大的地方完全不同。"
  npc_override_ba_maison_quests_17_2_don_t_touch_broken_repea_00d4da: "不要随意触摸损坏的中继器。告诉附近的自动人偶，他们会处理的。"
  npc_override_ba_maison_quests_17_2_don_t_treat_me_like_66ec56: "别把我当成和你一样！"
  npc_override_ba_maison_quests_17_2_don_t_wander_around_gard_8376b9: "晚上不要在花园里闲逛，会很危险的。"
  npc_override_ba_maison_quests_17_2_don_t_worry_about_place_0b010d: "不用担心这个地方。我正在妥善守卫。"
  npc_override_ba_maison_quests_17_2_don_t_worry_about_place_382b40: "不用担心这个地方。我会保证它的安全。"
  npc_override_ba_maison_quests_17_2_don_t_worry_about_repeat_b97b70: "不用担心中继器。请今天休息，^0000CD天亮后^000000再来。"
  npc_override_ba_maison_quests_17_2_don_t_worry_ffc806: "别担心。"
  npc_override_ba_maison_quests_17_2_don_t_worry_i_didn_e1e4ec: "别担心，我不是在说你！"
  npc_override_ba_maison_quests_17_2_don_t_worry_i_m_5c5385: "别担心，我不是可疑的人。"
  npc_override_ba_maison_quests_17_2_don_t_worry_i_won_173501: "别担心，我不会让他们伤害你的。我会呼叫保安协助！"
  npc_override_ba_maison_quests_17_2_don_t_worry_pitayas_natu_7c62ee: "别担心。火龙果天性玩耍时很暴力，通常我们和它们玩的时候会被咬到。"
  npc_override_ba_maison_quests_17_2_don_t_you_like_what_06dceb: "你不喜欢我让你做的事吗？"
  npc_override_ba_maison_quests_17_2_don_t_you_see_them_7f0f05: "你没看到它们那样到处跑吗？"
  npc_override_ba_maison_quests_17_2_door_firmly_locked_db31d9: "- 门牢牢锁着。 -"
  npc_override_ba_maison_quests_17_2_door_goes_inside_locked_24a132: "通往里面的门是锁着的，所以我们走外面吧。"
  npc_override_ba_maison_quests_17_2_due_intruders_interferen_e253a4: "由于入侵者的干扰，水花园的几项任务已经停滞。"
  npc_override_ba_maison_quests_17_2_due_recent_event_intrude_9fbf63: "由于最近的入侵者事件和植物变化，园丁频繁更换。然而，有一些园丁进入水花园后失去了连接。"
  npc_override_ba_maison_quests_17_2_due_recent_events_intrud_ea689b: "由于最近的入侵者事件，人偶数量大大减少，我们的园丁目前无法应付那些棘手的植物。"
  npc_override_ba_maison_quests_17_2_eat_9f87a0: "吃了它。"
  npc_override_ba_maison_quests_17_2_eeeeeek_5eb5c1: "咿呀……"
  npc_override_ba_maison_quests_17_2_eeeeeek_e950cd: "咿呀。"
  npc_override_ba_maison_quests_17_2_eeeeek_a84b0d: "咿呀！！！"
  npc_override_ba_maison_quests_17_2_efficient_communication_7a1d41: "为了高效通讯……*嗡嗡*……请处理芯片……*嗡嗡*"
  npc_override_ba_maison_quests_17_2_eh_you_don_t_know_ca313a: "嗯？你不知道？"
  npc_override_ba_maison_quests_17_2_ehem_70609a: "咳咳……"
  npc_override_ba_maison_quests_17_2_elder_b53b19: "但是，长老……"
  npc_override_ba_maison_quests_17_2_elders_wouldn_t_even_go_dc7581: "长老们甚至不会亲自出去调查……"
  npc_override_ba_maison_quests_17_2_elders_you_come_me_bd6eb0: "长老们，你们会跟我一起来吗？"
  npc_override_ba_maison_quests_17_2_elly_took_your_receiving_7fac75: "艾莉在我们修理你的时候拿走了你的接收芯片。"
  npc_override_ba_maison_quests_17_2_elyumina_been_like_too_e_6edee5: "艾琉米娜也会那样做的。艾琉米娜很幸运，对吧？"
  npc_override_ba_maison_quests_17_2_elyumina_our_colleague_c1d62f: "艾琉米娜是我们的同事。"
  npc_override_ba_maison_quests_17_2_elyumina_seems_been_atta_b070ea: "艾琉米娜似乎又被袭击了。"
  npc_override_ba_maison_quests_17_2_emergency_door_opening_6e6309: "紧急开门。"
  npc_override_ba_maison_quests_17_2_emergency_level_3d82d1: "紧急级别1。"
  npc_override_ba_maison_quests_17_2_emotions_you_ll_feel_dif_b65ccc: "但是，你感受到的情绪会有所不同，取决于你身处的情况。"
  npc_override_ba_maison_quests_17_2_end_long_adventure_young_fe6e5f: "在漫长的冒险结束时，那个站在王座前的年轻人，在我的引导下前行。"
  npc_override_ba_maison_quests_17_2_end_red_carpet_there_s_1fa4e9: "在红地毯的尽头，有一个头戴皇冠跪在地上的年轻人。"
  npc_override_ba_maison_quests_17_2_end_we_didn_t_even_079d3b: "但最终，我们甚至没有注意到问题的存在。由于我们作为人偶的局限性，我们可能永远无法发现的问题。"
  npc_override_ba_maison_quests_17_2_end_we_ve_opened_outside_973fd7: "为此，我们已经向普通大众开放了宅邸的外部。"
  npc_override_ba_maison_quests_17_2_enough_day_thank_you_you_d23bb5: "今天就到这里。感谢你的辛勤工作。"
  npc_override_ba_maison_quests_17_2_enterprise_e376e1: "企业号。"
  npc_override_ba_maison_quests_17_2_entrance_library_b253d1: "这是图书馆的入口吗？"
  npc_override_ba_maison_quests_17_2_entrance_seems_normal_no_4c8843: "入口看起来很正常……不，着火了！！！"
  npc_override_ba_maison_quests_17_2_erst_c463c8: "或者厄斯特。"
  npc_override_ba_maison_quests_17_2_erst_good_brainstorm_thi_10607b: "厄斯特擅长头脑风暴。哈哈哈。"
  npc_override_ba_maison_quests_17_2_erst_probably_right_fron_210752: "厄斯特可能就在前面的休息室里。"
  npc_override_ba_maison_quests_17_2_even_highest_class_comba_3731cf: "即使是最高级的战斗自动人偶也不会在地下室的区域制造。它可能是下一代武器。如果你能分辨它是盟友，那你很幸运。"
  npc_override_ba_maison_quests_17_2_even_identification_code_b9ccaa: "连识别码都被破坏了。"
  npc_override_ba_maison_quests_17_2_even_if_he_didn_t_5e825c: "即使他不需要，如果他开口我也会分享给他。"
  npc_override_ba_maison_quests_17_2_even_if_i_don_t_c9762b: "但即使我不知道这种事，也不会影响我的工作。我可以清洁。我可以执行分配给我的任务。被指定为垃圾的东西应该被清扫掉。"
  npc_override_ba_maison_quests_17_2_even_if_s_government_s_548102: "即使是政府的反对者，要在不逃离瓦尔蒙特宅邸内佣兵和工人视线的情况下实施谋杀也很困难。"
  npc_override_ba_maison_quests_17_2_even_if_we_split_up_2d1150: "即使我们在这里分开，我想我会在这个区域待相当长一段时间，所以如果发生什么事就告诉我。"
  npc_override_ba_maison_quests_17_2_even_if_you_already_read_271abd: "即使你已经读过一本书，重读时你可能会发现新的部分。"
  npc_override_ba_maison_quests_17_2_even_if_you_call_me_07257f: "即使你那样叫我，这里也没有人会争论。最重要的是，我们不是瓦尔蒙特相同的客人。"
  npc_override_ba_maison_quests_17_2_even_if_you_come_me_81a872: "即使你现在来找我，我也无能为力。"
  npc_override_ba_maison_quests_17_2_even_if_you_intention_wo_b31dee: "即使你有那个意图，在这里找到你想要的东西也不容易。"
  npc_override_ba_maison_quests_17_2_even_if_you_say_i_ada783: "即使你那么说，我也没什么好说的。"
  npc_override_ba_maison_quests_17_2_even_though_i_warned_you_26f41a: "尽管我警告过你不要碰任何东西，你还是收集了组成身体的零件。是这样吗？"
  npc_override_ba_maison_quests_17_2_everybody_quiet_we_easy_9b8847: "大家安静。我们有一个简单可靠的方法来认出真正的高尼。"
  npc_override_ba_maison_quests_17_2_everyone_been_doing_ever_c21e80: "自从入侵者出现以来，大家一直在这样做。即使{0}不做，也全靠我们自动人偶。"
  npc_override_ba_maison_quests_17_2_everyone_else_received_l_96fd3a: "其他所有人都已经收到了名单，所以使用宅邸不会有太大不便。如果你需要任何帮助，请随时联系最近的自动人偶。"
  npc_override_ba_maison_quests_17_2_everyone_furious_e9ee60: "所有人都很愤怒。"
  npc_override_ba_maison_quests_17_2_everyone_gathered_pairs_b97a00: "大家都到齐了吗？分成两人一组，按照危险品搜查和失踪人员搜查程序行事。发现任何情况时发出信号，集合地点在休息室。"
  npc_override_ba_maison_quests_17_2_everyone_royal_family_wa_c4d8cc: "皇室所有人都想感谢你，冒险者。"
  npc_override_ba_maison_quests_17_2_everyone_started_yelling_bae3a4: "所有人开始大喊大叫，恐慌地说我们必须先除掉它们……"
  npc_override_ba_maison_quests_17_2_everyone_take_cover_you_ba090d: "大家找掩护！你也一样，冒险者！"
  npc_override_ba_maison_quests_17_2_everything_you_say_past_328948: "你说的关于过去的一切都延续至今。"
  npc_override_ba_maison_quests_17_2_evil_intruders_intruders_f296e2: "邪恶的入侵者。入侵者摧毁了许多设施，甚至我们中的一些也被摧毁了。我们正在恢复一切。"
  npc_override_ba_maison_quests_17_2_example_my_master_says_s_a66f5c: "例如。我的主人说泡在浴池里很爽，但当我把自己泡进去的时候。水烫得不可思议。我把温度设错了吗？我确实设错了，但那不是给他的温度。"
  npc_override_ba_maison_quests_17_2_except_kid_1525f8: "除了那个孩子。"
  npc_override_ba_maison_quests_17_2_excuse_me_i_issue_you_3a59eb: "打扰一下。{0}，我现在就给你签发正式客人许可证。"
  npc_override_ba_maison_quests_17_2_existence_adventurer_ver_da4388: "冒险者的存在对双方都非常重要，在这个各种敌对势力都在行动的地方更是无价之宝。"
  npc_override_ba_maison_quests_17_2_facilities_mansion_publi_2f5ed7: "宅邸的设施是公共的，供每位客人使用。"
  npc_override_ba_maison_quests_17_2_facility_been_used_long_e8b845: "这个设施已经很久没用了，但它一直被'入侵者'秘密使用，而且……"
  npc_override_ba_maison_quests_17_2_facility_cleaning_going_8aa698: "这个设施不是用于清洁的。禁止进入。"
  npc_override_ba_maison_quests_17_2_failure_frequent_because_9c98cf: "因为我们精心维护，故障并不频繁。"
