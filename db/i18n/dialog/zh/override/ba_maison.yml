  npc_override_ba_maison_quests_17_2_s_odd_4c7b65: "那很奇怪？"
  npc_override_ba_maison_quests_17_2_s_okay_because_s_quiet_8db924: "没关系，因为暂时安静了。"
  npc_override_ba_maison_quests_17_2_s_okay_only_legs_everyon_9aaaa1: "只有腿也没关系，但每个人似乎都有手臂。"
  npc_override_ba_maison_quests_17_2_s_okay_they_re_all_3941b9: "没关系。它们都是防火的。即使烧掉一切，宅邸的蓝图也在其他仓库里。我们要走一点远路，但没关系。请放心。"
  npc_override_ba_maison_quests_17_2_s_one_their_chests_i_e98272: "是它们胸口上的那个。我想这是修理自动人偶的唯一方法。"
