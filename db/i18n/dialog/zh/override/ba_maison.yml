  npc_override_ba_maison_quests_17_2_as_you_like_adventurer_i_a6ed12: "随你喜欢，冒险者，我在外面等。"
  npc_override_ba_maison_quests_17_2_attack_did_i_attack_i_019493: "攻击？我攻击了吗？我只是按照入侵者应对手册做出反应。哦，你觉得你被攻击了吗？"
