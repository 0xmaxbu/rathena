  npc_override_ba_maison_quests_17_2_i_m_here_follow_procedur_8625bb: "我来这里是为了遵循程序，找出危险的东西是什么，因为我确信存在未知的风险。我们不应该让未知风险干扰我们在这座宅邸的任务。"
