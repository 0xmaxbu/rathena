  npc_override_ba_maison_quests_17_2_augmenting_bath_house_du_2fe7f7: "由于对各种沐浴方式的兴趣，浴场扩建到了今天的规模。到访宅邸的客人使用过浴场后，都对其设施赞不绝口。"
  npc_override_ba_maison_quests_17_2_automatic_doll_806303: "是自动人偶吗？"
  npc_override_ba_maison_quests_17_2_automatic_doll_human_42b091: "是自动人偶？还是人类？"
  npc_override_ba_maison_quests_17_2_automatic_doll_okay_thou_1f9a4c: "自动人偶倒是无所谓。"
  npc_override_ba_maison_quests_17_2_automatic_dolls_cleaning_33da4c: "清洁用自动人偶会清扫各处的异物和污垢。基本政策是在清洁时将所有客人请出浴场，但如果客人想继续洗澡，我们不应该打扰他们，而是等待。"
  npc_override_ba_maison_quests_17_2_b_24d9d5: "(*'��'*)b"
  npc_override_ba_maison_quests_17_2_bang_c19c59: "砰！！！"
