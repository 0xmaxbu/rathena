  npc_override_ba_maison_quests_17_2_how_we_know_anything_whe_4480d6: "外面发生了那么多混乱的事，我们怎么可能一无所知。我好沮丧，非常沮丧！！"
  npc_override_ba_maison_quests_17_2_how_you_going_gather_for_d132cb: "你打算怎么集结力量？"
  npc_override_ba_maison_quests_17_2_how_you_know_if_governme_bb7638: "你怎么知道政府真的尝试过和佣兵沟通，你又怎么知道佣兵拒绝了。你只是带来了我们所有人都不知道的证据。"
  npc_override_ba_maison_quests_17_2_how_you_think_you_re_a52372: "你觉得你要怎么做？我想你最好先增强自己的实力。"
  npc_override_ba_maison_quests_17_2_however_humans_needs_tak_bd7a9e: "然而，人类需要洗澡和洗澡的空间。分配给我的任务是清洁。我只知道这些。"
  npc_override_ba_maison_quests_17_2_however_i_am_going_tell_afb28f: "然而，我会告诉你我能以我的权限做出的所有承诺。"
  npc_override_ba_maison_quests_17_2_however_more_than_intrud_f3547b: "……然而，超过62%的入侵者有类似的行为模式，所以我认为你是入侵者。"
  npc_override_ba_maison_quests_17_2_however_place_he_went_do_644eb0: "然而，他去过的地方没有记录。"
  npc_override_ba_maison_quests_17_2_however_recommended_auto_0732ad: "然而，不建议接近出来清洁的自动人偶，因为它们很危险，而且仅供清洁用途。"
  npc_override_ba_maison_quests_17_2_however_seems_only_few_p_e15463: "然而，似乎只有少数人知道这件事，而且他们互相信任，所以整件事没有被揭露。"
  npc_override_ba_maison_quests_17_2_however_there_many_recor_8af291: "然而，有很多关于别人对H先生的评价的记录。"
  npc_override_ba_maison_quests_17_2_however_there_no_reason_684521: "然而，没有理由相信你能为公司所做的一切道歉。"
  npc_override_ba_maison_quests_17_2_however_tracking_easy_be_20b6ae: "不过，追踪它并不容易，因为3号的主系统完全断开了连接。"
  npc_override_ba_maison_quests_17_2_however_true_all_importa_6a1d9b: "不过，所有重要的幻视成员都成功逃脱了，这是真的吗？"
  npc_override_ba_maison_quests_17_2_however_we_told_respect_f24ab0: "不过，我们被告知要尽可能尊重客人的意见。请稍等片刻。"
  npc_override_ba_maison_quests_17_2_however_when_intruders_e_ab713a: "不过，前几天^0000CD入侵者^000000进入宅邸时，他们拆除了宅邸内的设施并强行索取。"
  npc_override_ba_maison_quests_17_2_however_you_should_attac_c97593: "不过，你不应该攻击仓鼠。"
  npc_override_ba_maison_quests_17_2_huh_73fef0: "嗯？"
  npc_override_ba_maison_quests_17_2_huh_adventurer_look_back_310ecd: "嗯？冒险者……回顾一下你至今为止的战斗经历。"
  npc_override_ba_maison_quests_17_2_huh_city_fairies_8c3672: "嗯？妖精之城？"
  npc_override_ba_maison_quests_17_2_huh_how_about_me_if_9fb3dc: "嗯，如果没人一起去的话，我可以去吗？"
  npc_override_ba_maison_quests_17_2_huh_i_t_hear_you_a680ff: "嗯，我听不太清楚。请大声一点。"
  npc_override_ba_maison_quests_17_2_huh_really_s_too_easy_3b5f4a: "嗯……真的。太简单了。即使是刚出生的婴儿也一定能回答这个问题。"
  npc_override_ba_maison_quests_17_2_huh_s_intruder_intruder_07285a: "嗯？是入侵者，入侵者！"
  npc_override_ba_maison_quests_17_2_huh_what_you_know_3b8d24: "嗯，你懂什么。"
  npc_override_ba_maison_quests_17_2_huh_where_i_bring_guy_195fac: "嗯？我要把这个家伙带到哪里去？"
  npc_override_ba_maison_quests_17_2_human_483ded: "一个人类。"
  npc_override_ba_maison_quests_17_2_human_beings_human_being_42f38d: "人类是人类，自动人偶是自动人偶。"
  npc_override_ba_maison_quests_17_2_human_beings_really_tric_7cf737: "……人类真是狡猾。"
  npc_override_ba_maison_quests_17_2_human_can_t_smell_but_au_8b79b2: "人类闻不到，但自动人偶可以。"
  npc_override_ba_maison_quests_17_2_human_ghost_story_too_05cfbd: "人类也有鬼故事吗？"
  npc_override_ba_maison_quests_17_2_human_guest_here_hear_be_3ad47e: "为了让这里的人类客人听到。因为客人希望我叫你来这里寻找另一个解决方案。"
  npc_override_ba_maison_quests_17_2_human_guest_says_too_muc_a69618: "人类客人说得太多了。"
  npc_override_ba_maison_quests_17_2_human_i_was_human_before_eafbef: "人类？我以前也是人类。"
  npc_override_ba_maison_quests_17_2_human_judgement_also_too_8e8a93: "人类的判断对我来说也太难了。但感谢你的意见。"
  npc_override_ba_maison_quests_17_2_human_standard_judgement_6746f8: "……但以人类的标准来判断，我觉得还算可以理解。"
  npc_override_ba_maison_quests_17_2_humans_being_stupid_s_wh_aa9ecd: "人类是愚蠢的。这就是为什么我要做一些与机器美丽思维不同的事情……虽然有点可悲，但这就是我的故事。"
  npc_override_ba_maison_quests_17_2_humans_can_t_hear_automa_78d2d5: "人类听不到自动人偶听到的一些声音。"
  npc_override_ba_maison_quests_17_2_humans_don_t_know_about_ba8b2c: "人类不知道自动人偶能做什么。"
  npc_override_ba_maison_quests_17_2_humans_happy_immerse_the_7746b0: "人类喜欢泡在浴池里。这是为什么呢？"
  npc_override_ba_maison_quests_17_2_humans_have_ghost_storie_b86cd6: "人类有鬼故事吗？"
  npc_override_ba_maison_quests_17_2_humans_obsessed_bathing_b2883b: "沉迷于沐浴的人类不配合清洁工作，沉迷于设施的人类破坏了设施和负责管理的自动人偶。"
  npc_override_ba_maison_quests_17_2_hurry_go_adventurer_3c4334: "快点，冒险者！"
  npc_override_ba_maison_quests_17_2_hurry_we_need_find_gonie_7c6002: "快点，我们得找到高尼！"
  npc_override_ba_maison_quests_17_2_hurts_393c32: "好痛！！！"
  npc_override_ba_maison_quests_17_2_hygiene_very_important_h_8484ea: "卫生在这里非常重要，因为这是一个公共浴池。除了每天定期清洁外，我还会在必要时进行清洁。"
  npc_override_ba_maison_quests_17_2_i_095cce: "我可以。"
  npc_override_ba_maison_quests_17_2_i_actually_don_t_know_1c359d: "……其实我对外面和过去的事情一无所知。"
  npc_override_ba_maison_quests_17_2_i_agree_adventurer_44e5dc: "我同意，冒险者。"
  npc_override_ba_maison_quests_17_2_i_agree_should_check_sew_8fb6e0: "我同意，应该检查下水道。"
  npc_override_ba_maison_quests_17_2_i_almond_fix_automatic_d_4c1a25: "我是阿尔蒙德，修理自动人偶的。"
  npc_override_ba_maison_quests_17_2_i_already_checked_sewer_457929: "我已经检查过下水道了。"
  npc_override_ba_maison_quests_17_2_i_already_confirmed_one_44e97b: "我已经和里面的一位园丁确认过了。"
  npc_override_ba_maison_quests_17_2_i_already_got_antidote_b30fed: "我已经拿到解药了。"
  npc_override_ba_maison_quests_17_2_i_already_know_i_m_1240b8: "……我已经知道我很弱，即使你不说。但我不知道该怎么办。"
  npc_override_ba_maison_quests_17_2_i_already_looked_around_039abd: "我已经四处看过了。"
  npc_override_ba_maison_quests_17_2_i_already_said_no_how_03de22: "我已经说不了，你还要像鹦鹉一样问我多久才能找到真相？"
  npc_override_ba_maison_quests_17_2_i_already_send_informati_8b0575: "我已经发送了更新后的客人名单信息。但我还没有收到一些自动人偶的确认。"
  npc_override_ba_maison_quests_17_2_i_already_told_everything_a569e8: "我已经告诉你一切了。"
  npc_override_ba_maison_quests_17_2_i_also_saw_lot_way_58c781: "我在路上也看到了很多。"
  npc_override_ba_maison_quests_17_2_i_also_want_apologize_be_2f9255: "我也想道歉，因为不相信你的说法而强迫我们带来的证据。"
  npc_override_ba_maison_quests_17_2_i_always_help_adventurer_53a69e: "冒险者，我一直在这里帮忙。"
  npc_override_ba_maison_quests_17_2_i_always_something_d56fe2: "我总是有事要做！"
  npc_override_ba_maison_quests_17_2_i_always_tried_get_peopl_9e326f: "我一直试图让人们离开这里，但没有成功。我不是有意伤害你的。我一开始就不愿意接触。"
