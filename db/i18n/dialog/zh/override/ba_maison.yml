  npc_override_ba_maison_quests_17_2_welcome_varmundt_mansion_27ca14: "欢迎来到瓦尔蒙特宅邸。瓦尔蒙特宅邸提供各种福利，如医疗服务、购物和娱乐、休闲活动……"
