  npc_override_ba_maison_quests_17_2_mina_what_you_going_now_feac05: "米娜，你现在打算做什么？"
  npc_override_ba_maison_quests_17_2_mina_you_move_they_say_f74c23: "米娜，你能动吗？他们说里面很危险……"
  npc_override_ba_maison_quests_17_2_minute_could_you_listen_9b5938: "能听我说一会儿吗？"
  npc_override_ba_maison_quests_17_2_moment_declared_new_time_c60842: "一旦宣布，新的时代将开始。"
  npc_override_ba_maison_quests_17_2_moment_i_saw_mark_smilin_79ca38: "那一刻，我看到马克灿烂地笑着，提着一个捐款袋……"
