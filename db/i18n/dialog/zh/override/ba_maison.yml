  npc_override_ba_maison_quests_17_2_i_registered_after_confi_1ef087: "我在确认从宅邸其他地方一起来的其他队员的身份和来访目的后进行了登记。"
  npc_override_ba_maison_quests_17_2_i_remember_saying_human_7ecf31: "我记得那句话，人类缺乏耐心。"
  npc_override_ba_maison_quests_17_2_i_repeat_i_m_telling_7fabe2: "我再说一遍，我告诉你。你不能独自做出所有决定。无论是我们还是那位只是客人的公主。"
  npc_override_ba_maison_quests_17_2_i_repeat_you_t_go_07530c: "我再说一遍，除非确认你的安全，否则你不能进去。一旦我收到同事的消息，我就会遵守你的请求。"
  npc_override_ba_maison_quests_17_2_i_returned_here_manage_9ded36: "我回到这里来管理它。"
  npc_override_ba_maison_quests_17_2_i_searched_database_past_7e440d: "我已经搜索了数据库中过去客人的对话，记录是随机选择的！"
  npc_override_ba_maison_quests_17_2_i_see_c52c6e: "我明白了。"
  npc_override_ba_maison_quests_17_2_i_see_i_understand_i_a2fa8d: "我明白了。我理解。我学到了不应该占用忙碌客人的时间。"
  npc_override_ba_maison_quests_17_2_i_see_i_ve_heard_c33139: "我明白了。我听说人类应该经常休息。"
  npc_override_ba_maison_quests_17_2_i_see_well_you_busy_c6db67: "我明白了。好吧，毕竟你的日程很忙。"
  npc_override_ba_maison_quests_17_2_i_see_you_re_human_45f61c: "我明白了，你是一个从这类事情中找到乐趣的人类。我以前听说过。那么我想请你帮个忙。哦，当然，我会给你报酬。"
  npc_override_ba_maison_quests_17_2_i_should_stopped_mr_h_efdf2a: "我应该阻止H先生的。"
  npc_override_ba_maison_quests_17_2_i_so_curious_i_tried_f33176: "我太好奇了，所以自己试了一下，但我不知道它有什么好处。也许是因为我是自动人偶？"
  npc_override_ba_maison_quests_17_2_i_something_check_de4168: "我有东西要检查。"
  npc_override_ba_maison_quests_17_2_i_start_fire_18a09c: "我可以生火吗？"
  npc_override_ba_maison_quests_17_2_i_still_fix_b3ddcf: "但我仍然必须修理它。"
  npc_override_ba_maison_quests_17_2_i_still_haven_t_decided_1751f4: "我还没决定给它起什么名字。那些家伙很好，没有碰我，奇怪的是。"
  npc_override_ba_maison_quests_17_2_i_suddenly_feel_nervous_f34ee3: "我突然感到紧张。"
  npc_override_ba_maison_quests_17_2_i_support_you_without_re_1fe085: "我会毫无保留地支持你，就像艾莉一样，除了人力。"
  npc_override_ba_maison_quests_17_2_i_t_believe_i_caught_424594: "我不敢相信我被这家伙抓住了。"
  npc_override_ba_maison_quests_17_2_i_t_believe_place_been_5cecff: "我不敢相信这个地方一直隐藏到现在……"
  npc_override_ba_maison_quests_17_2_i_t_believe_really_illus_be5554: "我不敢相信，这真的是幻视吗？"
  npc_override_ba_maison_quests_17_2_i_t_believe_there_so_83dfc2: "我不敢相信有这么多我在普隆德拉图书馆找不到的书！"
  npc_override_ba_maison_quests_17_2_i_t_believe_you_don_1751d3: "我不敢相信你做这么少的安保工作。我会记住的。照顾客人的娱乐是我们的工作之一。"
  npc_override_ba_maison_quests_17_2_i_t_believe_you_fell_1261e2: "我不敢相信你掉进了那种第一眼看起来就很糟糕的水里。"
  npc_override_ba_maison_quests_17_2_i_t_believe_you_suddenly_8a69c5: "我不敢相信。你突然攻击了我。"
  npc_override_ba_maison_quests_17_2_i_t_even_clean_up_0b865b: "我连清理都做不好。但我必须做。我必须感谢你。"
  npc_override_ba_maison_quests_17_2_i_t_find_where_they_867d75: "我找不到它们白天藏在哪里……，"
  npc_override_ba_maison_quests_17_2_i_t_force_you_00f638: "我不能强迫你。"
  npc_override_ba_maison_quests_17_2_i_t_go_even_if_4184e4: "我不能去，即使我强迫自己，我也不能去。我去了只会给你添麻烦。"
  npc_override_ba_maison_quests_17_2_i_t_help_i_m_3943bd: "我没办法。我担心埃柳米娜的安全。"
  npc_override_ba_maison_quests_17_2_i_take_full_responsibili_126506: "我会对一切负全责，从不忘记过去开始。"
  npc_override_ba_maison_quests_17_2_i_take_over_king_s_99c807: "我很快将不得不承担国王的责任。"
  npc_override_ba_maison_quests_17_2_i_talk_him_someday_what_1e6243: "我总有一天要和他谈谈。如果公司突然进来怎么办。"
  npc_override_ba_maison_quests_17_2_i_talked_alpha_moment_1f44c0: "我和阿尔法谈了一会儿。"
  npc_override_ba_maison_quests_17_2_i_tell_others_about_a4ca95: "我会告诉其他人。"
  npc_override_ba_maison_quests_17_2_i_think_he_s_here_7c9056: "我想他是来传递一些重要消息的。"
  npc_override_ba_maison_quests_17_2_i_think_i_hear_magi_1241f7: "我想我能听到玛吉的声音在那边！！！"
  npc_override_ba_maison_quests_17_2_i_think_i_ll_able_09468e: "如果你能处理44个毒液、瀑布和痉挛，我想我就能处理污水处理厂。"
  npc_override_ba_maison_quests_17_2_i_think_i_ll_able_39fa6c: "如果你能处理44个精英贝拉雷、魔法多洛和失控魔法，我想我就能处理第一发电厂。"
  npc_override_ba_maison_quests_17_2_i_think_i_ll_delayed_8e2386: "我想我会因为损坏的清洁机器人而稍微延迟。这是一个被入侵者黑客攻击的自动机器人。我正在想如何清理它制造的混乱。"
  npc_override_ba_maison_quests_17_2_i_think_i_should_start_33e320: "我想我应该从这个^0000CD蒸汽^000000开始。"
  npc_override_ba_maison_quests_17_2_i_think_i_ve_finally_afa1cc: "……我想我终于冷静下来了。"
  npc_override_ba_maison_quests_17_2_i_think_i_ve_seen_2a7eb9: "我想我在污水处理厂见过荧光液体，如果你抓到黑色的心脏猎手侦察兵，你可以得到它。"
  npc_override_ba_maison_quests_17_2_i_think_little_awkward_i_4bd16c: "我想如果我们所有人都去会有点尴尬。"
  npc_override_ba_maison_quests_17_2_i_think_mr_h_why_7b1c34: "我想是H先生。他为什么要做这种事。"
  npc_override_ba_maison_quests_17_2_i_think_perfect_oh_s_1c4622: "我想这会完美。哦……不完美，但有用。"
  npc_override_ba_maison_quests_17_2_i_think_s_basement_if_678610: "我想它来自地下室。如果真的来自地下室，那就大事不妙了。"
  npc_override_ba_maison_quests_17_2_i_think_s_better_let_badd43: "我想最好让人类客人进去自己搜索。"
  npc_override_ba_maison_quests_17_2_i_think_s_main_point_60c085: "我想这就是我想说的重点……？"
  npc_override_ba_maison_quests_17_2_i_think_s_out_s_1ba70c: "我想它疯了，那个自动人偶……"
  npc_override_ba_maison_quests_17_2_i_think_so_c5dd19: "我想……是吧？"
  npc_override_ba_maison_quests_17_2_i_think_they_re_working_3cc1c6: "我想它们在太阳下山后工作，但它们在多方面都有麻烦。"
  npc_override_ba_maison_quests_17_2_i_think_while_avoiding_t_f9b444: "我可以在避开它们的同时思考。或者他回来时我可以让他给我起名字。"
  npc_override_ba_maison_quests_17_2_i_thought_goverment_medi_28b0af: "我原以为政府会在事件发生时进行调解，但就好像我们在政府眼中不存在一样。"
  npc_override_ba_maison_quests_17_2_i_thought_i_could_find_7e5e19: "我以为我能找到一本新书……"
  npc_override_ba_maison_quests_17_2_i_thought_i_going_die_e20f43: "我以为我要死了！"
  npc_override_ba_maison_quests_17_2_i_thought_our_teamwork_g_d710ac: "我以为我们的团队合作很好，但我们不如我们的敌人？"
  npc_override_ba_maison_quests_17_2_i_thought_you_one_intrud_7bb56a: "我以为你是入侵者之一。"
  npc_override_ba_maison_quests_17_2_i_thought_you_saw_lettuc_60c873: "我以为你看到生菜飞向你。"
  npc_override_ba_maison_quests_17_2_i_told_alpha_analysisabl_516aa0: "我告诉阿尔法，当前状态下可分析的数据已经结束了。"
  npc_override_ba_maison_quests_17_2_i_told_you_go_anywhere_504f1f: "我告诉过你不要到处乱跑！！！！！"
  npc_override_ba_maison_quests_17_2_i_told_you_touch_boiler_d32f7f: "我告诉过你不要碰锅炉。"
  npc_override_ba_maison_quests_17_2_i_turned_upside_down_s_f2a302: "- 我把它倒过来，它因为一个小纸信封卡在里面而停止了。-"
  npc_override_ba_maison_quests_17_2_i_used_big_skill_my_527857: "我用了一个大技能，伤口很痛……"
  npc_override_ba_maison_quests_17_2_i_usually_go_mission_alo_0d5e05: "我通常独自执行任务，但这是我第一次这么久没有收到他的消息。这就是为什么每个人都在焦急地寻找他。出事了。快点想想。"
  npc_override_ba_maison_quests_17_2_i_ve_already_searched_lo_86a5e7: "我已经在宅邸里搜索了很多地方，全部都是空的。"
  npc_override_ba_maison_quests_17_2_i_ve_already_told_you_faf356: "我已经告诉过你了，\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\t但现在不是做模糊承诺的好时机。"
  npc_override_ba_maison_quests_17_2_i_ve_asked_someone_dispo_315dd1: "我已经请人'处理'政府人员，以防止与雇佣兵接触……我还告诉他闯入瓦尔蒙特宅邸并窃取瓦尔蒙特的研究数据……"
  npc_override_ba_maison_quests_17_2_i_ve_been_asleep_long_f1a644: "我已经睡了很长时间。最近太吵了，所以我醒了。"
  npc_override_ba_maison_quests_17_2_i_ve_been_building_somet_cdf525: "我之前一直在建造东西来保护自己免受那些心脏猎手的伤害。"
  npc_override_ba_maison_quests_17_2_i_ve_been_charge_warehou_5f677b: "我已经负责仓库很长时间了，我可以快速找到存放的旧物品或非常小的物品。"
  npc_override_ba_maison_quests_17_2_i_ve_been_collecting_the_cf271f: "我一直在收集这些，我会让你拥有它，冒险者。"
  npc_override_ba_maison_quests_17_2_i_ve_been_hearing_news_35cdd0: "我偶尔通过宫廷巫师听到消息……"
  npc_override_ba_maison_quests_17_2_i_ve_been_looking_him_617240: "我已经找他一段时间了，但是……"
  npc_override_ba_maison_quests_17_2_i_ve_been_out_place_68dc05: "我已经在这个地方进进出出很长时间了，但一直这样做对我来说很麻烦。所以让我拥有这个地方。"
  npc_override_ba_maison_quests_17_2_i_ve_been_shrine_all_c0ab0a: "我一直和神殿在一起。冒险者遇到了假货，差点去了湖边。"
  npc_override_ba_maison_quests_17_2_i_ve_been_staying_water_b5e5c5: "我一直待在这附近的水域。然后我遇到了在宅邸外散步的瓦尔蒙特。"
  npc_override_ba_maison_quests_17_2_i_ve_been_wandering_away_612e46: "我一直在远离家乡游荡。这就是为什么瓦尔蒙特能够让我使用宅邸的浴池，而没有人联系他关于我的事。"
  npc_override_ba_maison_quests_17_2_i_ve_been_wondering_sinc_990c55: "我从刚才就在想，我们在同一个小组里，但你们如何区分入侵者和客人？"
  npc_override_ba_maison_quests_17_2_i_ve_come_here_see_267f31: "我来看看出了什么问题，看起来出现了一只老鼠。"
  npc_override_ba_maison_quests_17_2_i_ve_eaten_all_potato_d0eae9: "- 我把所有的薯片都吃光了，一片不剩。-"
  npc_override_ba_maison_quests_17_2_i_ve_finished_all_heap_056d05: "- 我把欧罗巴面前的所有薯片堆都吃光了！-"
  npc_override_ba_maison_quests_17_2_i_ve_got_notice_alp_1bf570: "我收到了阿尔普的通知……说他们在回来的路上发现了门，所以在变得更危险之前让我们上去。"
  npc_override_ba_maison_quests_17_2_i_ve_got_someone_wait_2fda6f: "我有人在等，我们在这里分开吧。"
  npc_override_ba_maison_quests_17_2_i_ve_got_temporary_assig_b26425: "我从阿尔法那里得到了临时任务，正在请求其他冒险者的协助。"
  npc_override_ba_maison_quests_17_2_i_ve_heard_news_those_499109: "我听到了消息。那些混蛋。"
  npc_override_ba_maison_quests_17_2_i_ve_heard_similar_story_aee858: "我从阿尔法那里听过类似的故事，我从没想到会是你。"
  npc_override_ba_maison_quests_17_2_i_ve_heard_sometimes_hum_3af973: "我听说人类有时会鲁莽地挑战超出他们能力的事情。"
  npc_override_ba_maison_quests_17_2_i_ve_heard_too_must_5955ab: "我也听说了。一定是那些公司的人！我们不能待在这里清理外面。"
  npc_override_ba_maison_quests_17_2_i_ve_heard_your_opinions_177172: "我已经听到了你们的意见。"
  npc_override_ba_maison_quests_17_2_i_ve_met_eyes_automatic_8594ed: "- 我和繁殖区前面的自动人偶对视了。-"
  npc_override_ba_maison_quests_17_2_i_ve_once_read_book_475577: "我曾经读过一本关于训练的书，训练师在学员试图站起来时将其击倒，这很常见吗？"
  npc_override_ba_maison_quests_17_2_i_ve_recovered_core_dba1d5: "我已经恢复了核心。"
  npc_override_ba_maison_quests_17_2_i_ve_recovered_enough_co_98f06d: "我已经恢复了足够的核心。"
  npc_override_ba_maison_quests_17_2_i_ve_seen_all_before_a91e74: "我以前都见过。"
  npc_override_ba_maison_quests_17_2_i_ve_seen_everything_s_1c4515: "我看到了发生的一切。"
  npc_override_ba_maison_quests_17_2_i_waiting_your_return_233a1e: "我在等你回来。"
  npc_override_ba_maison_quests_17_2_i_want_ask_about_past_253929: "我想询问过去的记录。"
  npc_override_ba_maison_quests_17_2_i_want_ask_why_you_608c7a: "我想问。你为什么要救那个人？"
  npc_override_ba_maison_quests_17_2_i_want_save_person_tell_31d60f: "我想救这个人。告诉我怎么做！"
  npc_override_ba_maison_quests_17_2_i_want_study_analyze_if_fe5b8e: "我想研究和分析……如果这种头晕能消失的话……"
  npc_override_ba_maison_quests_17_2_i_went_into_second_power_703418: "我自己进入了第二发电厂并取回了芯片，但我没有办法处理它们，而且由于网络故障，情况变得困难。"
  npc_override_ba_maison_quests_17_2_i_wish_i_two_wow_7cafb5: "我希望我是两个。哇……那不是很好吗？如果有两个我，这将是最好的锅炉房。"
  npc_override_ba_maison_quests_17_2_i_won_t_fall_your_9d9a93: "我不会上你的当，即使你那样看着我。"
  npc_override_ba_maison_quests_17_2_i_won_t_let_heart_bfc243: "我不会让心脏猎手破坏这个美妙的地方！"
  npc_override_ba_maison_quests_17_2_i_won_t_lose_though_cd3311: "但我不会输。"
  npc_override_ba_maison_quests_17_2_i_wonder_how_many_magic_58f99e: "我想知道有多少魔法书！"
  npc_override_ba_maison_quests_17_2_i_wonder_if_doll_s_7bd6a1: "我想知道那个自动人偶的数据是否以某种未知的方式刻在这个锅炉里。"
  npc_override_ba_maison_quests_17_2_i_wonder_if_s_really_eb5a06: "我想知道它真的只是一颗宝石吗。"
  npc_override_ba_maison_quests_17_2_i_wouldn_t_gone_far_4707b7: "如果我不保护自己的生命，我也不会走到这一步。"
  npc_override_ba_maison_quests_17_2_i_wouldn_t_lie_you_1ca9f5: "我不会对你撒谎。"
  npc_override_ba_maison_quests_17_2_if_automatic_dolls_human_9ea47a: "如果自动人偶或人类误入并误碰危险物品。"
  npc_override_ba_maison_quests_17_2_if_communication_lost_s_e7f5e1: "如果通信丢失，它就只是一个傀儡。"
  npc_override_ba_maison_quests_17_2_if_continue_like_i_ll_089a0c: "如果继续这样下去，我可能会再次故障。我需要你的帮助。"
  npc_override_ba_maison_quests_17_2_if_goes_wrong_i_ll_f05a36: "如果这出了问题，我会让你负责！"
  npc_override_ba_maison_quests_17_2_if_government_asking_me_f9dfe2: "如果政府要求我相信他们一直构建的谎言，那么我无法与你合作。"
  npc_override_ba_maison_quests_17_2_if_government_doesn_t_co_398638: "如果政府在关键时刻不站出来，就必须有人挺身而出，推动政府前进。"
  npc_override_ba_maison_quests_17_2_if_he_s_here_now_d6b105: "如果他现在在这里，他会解决所有问题。或者问题本身就不会发生。"
  npc_override_ba_maison_quests_17_2_if_i_had_five_senses_43e1ed: "如果我有像人类一样的五感，我就能更好地理解人类。为什么主人没有给我们那个？"
  npc_override_ba_maison_quests_17_2_if_i_said_i_you_78fb5d: "如果我说我会，你也不会相信我。"
  npc_override_ba_maison_quests_17_2_if_ise_case_catastrophe_ddbe9a: "如果是这样的话，自动人偶将带来的灾难就不再是问题了。"
  npc_override_ba_maison_quests_17_2_if_last_one_please_repor_71d2bb: "如果这是最后一个，请向<NAVI>[阿尔法]<INFO>ba_maison,74,150,0,0,0</INFO></NAVI>报告。另外……欢迎来到瓦尔蒙特宅邸。如果您需要帮助，请随时询问任何自动人偶。"
  npc_override_ba_maison_quests_17_2_if_last_one_please_repor_72c155: "如果这是最后一个，请向<NAVI>[阿尔法]<INFO>ba_maison,74,150,0,0,0</INFO></NAVI>报告。"
  npc_override_ba_maison_quests_17_2_if_mr_h_hadn_t_f4d131: "如果不是H先生叫我们来这里，我们现在都已经死了。"
  npc_override_ba_maison_quests_17_2_if_only_chip_detected_i_7d172e: "如果只检测到'芯片'，我就不会进来，也永远不会遇到像你这样的骗子。"
  npc_override_ba_maison_quests_17_2_if_person_found_injured_bddb06: "如果发现有人受伤，请检查生命体征并进行快速救援行动。"
  npc_override_ba_maison_quests_17_2_if_really_underground_s_e168b2: "如果这真的是来自地下，而且是自动人偶的声音，那么等待我们的只有毁灭。"
  npc_override_ba_maison_quests_17_2_if_s_broken_automatic_do_2145bf: "如果是损坏的自动人偶，你很了解这个宅邸，所以你必须先听浴池管理者的话。这个我来处理。"
  npc_override_ba_maison_quests_17_2_if_so_i_come_back_029f03: "如果是这样，我会早点回来。即使不是，我相信我也会收到分散在宅邸各处的船员的联系。"
  npc_override_ba_maison_quests_17_2_if_so_then_eaf858: "如果是这样，那么……"
  npc_override_ba_maison_quests_17_2_if_there_s_anything_i_4683db: "如果有什么我能做的，我会配合抓捕它们。"
  npc_override_ba_maison_quests_17_2_if_there_s_automatic_dol_392c2f: "如果有自动人偶攻击我们，我们当然会把它消灭。"
  npc_override_ba_maison_quests_17_2_if_wasn_t_you_i_15410c: "如果不是你，我会在普隆德拉教堂醒来！"
  npc_override_ba_maison_quests_17_2_if_we_found_out_more_5299bc: "如果当时我们能发现更多关于'H·卢肯贝格'的信息……"
  npc_override_ba_maison_quests_17_2_if_we_leave_now_776775: "如果我们现在离开……"
  npc_override_ba_maison_quests_17_2_if_we_make_too_much_c97af7: "如果我们制造太多噪音，地下室的那个东西可能会上来。请在黎明后回来。"
  npc_override_ba_maison_quests_17_2_if_we_re_lucky_we_9a7fc5: "如果我们幸运的话，我们也许能定位到幻视用来逃跑的飞艇路线。"
  npc_override_ba_maison_quests_17_2_if_you_answer_me_i_74f349: "如果你回答我，我愿意配合你。"
  npc_override_ba_maison_quests_17_2_if_you_any_inconvenience_ce0d07: "如果您在宅邸有任何不便，请随时告诉任何自动人偶。请收下这张巴美餐券，作为对您辛勤工作的感谢。"
  npc_override_ba_maison_quests_17_2_if_you_apologized_bring_c291d8: "如果你道歉，死者能复活吗？"
  npc_override_ba_maison_quests_17_2_if_you_come_any_closer_9569e7: "如果你再靠近，我就攻击你！！！"
  npc_override_ba_maison_quests_17_2_if_you_guest_mansion_ple_9acfe0: "如果您是宅邸的客人，请先完成客人登记。请理解，如果您被误认为是入侵者而造成任何意外，我们不承担责任。"
  npc_override_ba_maison_quests_17_2_if_you_here_301130: "如果你在这里做这种事……"
  npc_override_ba_maison_quests_17_2_if_you_leave_alone_wande_4b10d9: "如果你放任不管，它会在宅邸里游荡并破坏它，所以你必须尽快处理它。"
  npc_override_ba_maison_quests_17_2_if_you_need_any_more_f1e279: "如果您需要更多记录，请随时询问。"
  npc_override_ba_maison_quests_17_2_if_you_need_anything_ple_05dcc0: "如果您需要什么，请随时来找我们。对您也是无意中的无礼。"
  npc_override_ba_maison_quests_17_2_if_you_need_poison_i_6f7e4a: "如果你需要毒药，我会提供……"
  npc_override_ba_maison_quests_17_2_if_you_no_objection_we_b12de9: "如果您没有异议，我们就按原计划进行。"
  npc_override_ba_maison_quests_17_2_if_you_power_before_you_a3cf10: "如果你在真正拥有力量之前就拥有力量，你只会崩溃并失去它。"
  npc_override_ba_maison_quests_17_2_if_you_promise_help_me_f9658f: "如果你答应帮我这个忙，我就为你打开水上花园。"
  npc_override_ba_maison_quests_17_2_if_you_re_already_decide_7ae841: "如果你已经决定了，我想更清楚地和代表谈谈。"
  npc_override_ba_maison_quests_17_2_if_you_re_free_please_c4e61c: "如果你有空，请帮帮我。我人手不足。阀门和锅炉需要修理。但我一个人，其他自动人偶都很忙。"
  npc_override_ba_maison_quests_17_2_if_you_re_looking_high_02d47e: "如果你在寻找高品质的茶，这个宅邸就是你要找的地方。"
  npc_override_ba_maison_quests_17_2_if_you_re_new_please_76ac5b: "如果你是新来的，请这边走。我会正式将你登记为宅邸的客人。"
  npc_override_ba_maison_quests_17_2_if_you_re_schedule_open_429510: "如果你的日程有空，你愿意和我一起去普隆德拉宫殿吗？"
  npc_override_ba_maison_quests_17_2_if_you_say_055b3e: "那个……如果你这么说……"
  npc_override_ba_maison_quests_17_2_if_you_say_so_then_7cfc17: "如果你这么说，那我就相信你。"
  npc_override_ba_maison_quests_17_2_if_you_see_monster_while_68333c: "如果你在浴池内看到怪物，请不要急于接触它，告诉周围的自动人偶。如果您需要帮助寻找失踪人员，请告诉我。"
  npc_override_ba_maison_quests_17_2_if_you_send_signal_recei_596018: "如果你发送信号，接收器会~"
  npc_override_ba_maison_quests_17_2_if_you_such_distinguishe_c61b59: "如果你是如此尊贵的客人，我应该更早收到你的信息。"
  npc_override_ba_maison_quests_17_2_if_you_take_look_you_d7c84f: "如果你看一下，你就能理解这个证据。"
  npc_override_ba_maison_quests_17_2_if_you_tell_nearest_auto_a663e4: "如果你告诉最近的自动人偶，我们会立即处理。"
  npc_override_ba_maison_quests_17_2_if_you_think_outside_box_700136: "如果你跳出框框思考，所有能说话和有理性的生物都是人类。"
  npc_override_ba_maison_quests_17_2_if_you_time_i_d_c90cc0: "如果你有时间，我想在^0000CD黎明后^000000再次请求你的帮助，如果你不介意的话，请明天再来。"
  npc_override_ba_maison_quests_17_2_if_you_told_me_as_141410: "如果你在事件发生时立刻告诉我，那就太好了。"
  npc_override_ba_maison_quests_17_2_if_you_use_without_regis_a0566a: "如果你不注册就使用，可能会引起其他客人的不必要误解，所以你至少应该注册。主人也不在，无法咨询。"
  npc_override_ba_maison_quests_17_2_if_you_want_any_informat_3c4598: "如果你想从我这里获得任何信息，给我带一个像样的幻视成员来。"
  npc_override_ba_maison_quests_17_2_if_you_want_battle_you_888f7e: "如果你想战斗，随时欢迎！"
  npc_override_ba_maison_quests_17_2_if_you_want_combat_train_f5eea0: "如果你想进行战斗训练，尽管告诉我。"
  npc_override_ba_maison_quests_17_2_if_you_want_read_about_0119bb: "如果你想阅读记录，我会为你准备。"
  npc_override_ba_maison_quests_17_2_if_you_want_relay_inform_b77ab1: "如果你想向宅邸任何地方传递信息。使用中继器将信息传递给所有自动人偶。"
  npc_override_ba_maison_quests_17_2_ignition_break_b79eda: "点火爆发……！！！"
  npc_override_ba_maison_quests_17_2_illegal_extortion_acquir_ee4acc: "获取无法表达意愿的物体的房地产是非法勒索。"
  npc_override_ba_maison_quests_17_2_illusion_alliance_s_like_1dbede: "幻视是一个联盟，但它更像是一种思想结构。正式成员体内植入了'芯片'，用于识别像你这样的叛徒。"
  npc_override_ba_maison_quests_17_2_incident_record_confirme_719800: "事件，记录5872，已确认。"
  npc_override_ba_maison_quests_17_2_information_enough_becau_b6569e: "信息足够了。因为这个人的生命处于危险之中！你说<NAVI>[水上花园]<INFO>ba_maison,239,47,0,101,0</INFO></NAVI>，对吗？"
  npc_override_ba_maison_quests_17_2_intruder_took_step_back_032d9e: "入侵者后退了一步，但它们还没有完全离开。因此，清洁自动人偶别无选择，只能保持强化形态。所以在清洁时间接触时请小心。"
  npc_override_ba_maison_quests_17_2_invaders_didn_t_last_lon_2b5947: "入侵者没有持续多久，但在那短暂的时刻，它们把宅邸搞得一团糟。它们拿走了宅邸里的机器、自动人偶，所有对它们有用的东西都被移走了。"
  npc_override_ba_maison_quests_17_2_invaders_which_guests_ca_2b7787: "客人所称的'入侵者'即'幻视'有99.9%的概率对系统进行了修改。"
  npc_override_ba_maison_quests_17_2_isn_t_gonie_there_two_ac0ae8: "那不是戈尼吗？还有……两个拉奇？"
  npc_override_ba_maison_quests_17_2_isn_t_great_i_survived_ed4392: "但我能活下来不是很好吗？"
  npc_override_ba_maison_quests_17_2_isn_t_place_awesome_36a6b1: "这个地方不是很棒吗？？？"
  npc_override_ba_maison_quests_17_2_isn_t_she_person_who_fadcb4: "她不是也伤害过你的人吗？"
  npc_override_ba_maison_quests_17_2_isn_t_too_much_probibit_5704ca: "禁止在喷泉里清洗是不是太过分了？"
  npc_override_ba_maison_quests_17_2_just_because_you_illusio_b23201: "仅仅因为你曾经是幻视的一员，并不意味着你永远是幻视的一员。虽然你仍然要为自己的罪行付出代价。你也必须承受这个。"
  npc_override_ba_maison_quests_17_2_just_deal_i_m_still_e147ad: "这只是一笔交易。我仍然清楚自己排除入侵者的职责。"
  npc_override_ba_maison_quests_17_2_just_like_previous_situa_b0282c: "就像之前的情况一样，宅邸某些区域的网络状态正在失去连接。"
  npc_override_ba_maison_quests_17_2_just_moment_please_stay_329778: "稍等片刻，请留在这里。"
  npc_override_ba_maison_quests_17_2_just_take_go_away_a6dc0b: "拿着这个走开！"
  npc_override_ba_maison_quests_17_2_just_trust_yourself_litt_a778f8: "多相信自己一点，我只是想看你接下来会怎么做。"
  npc_override_ba_maison_quests_17_2_just_watch_s_sight_these_f51b96: "看着吧。这两个人玩耍的景象。"
  npc_override_ba_maison_quests_17_2_kahahahahahahak_63f31c: "卡哈哈哈哈哈哈哈！！！！"
  npc_override_ba_maison_quests_17_2_keh_f6be07: "咳！！！！！"
  npc_override_ba_maison_quests_17_2_kehahahahahahah_564ca0: "咳哈哈哈哈哈哈！！！"
  npc_override_ba_maison_quests_17_2_kept_saying_kill_traitor_b2f291: "它一直在说'杀死叛徒'！"
  npc_override_ba_maison_quests_17_2_kid_i_t_recall_edac94: "这个孩子？我想不起来……？"
  npc_override_ba_maison_quests_17_2_kind_talk_never_happened_7770bf: "那种谈话从未发生过！政府没有一个人来谈过，你知道吗？"
  npc_override_ba_maison_quests_17_2_know_dangerous_emergency_94f37b: "那将是一个危险的紧急情况。"
  npc_override_ba_maison_quests_17_2_knowing_automatic_dolls_2a052f: "知道宅邸里的自动人偶通过中继器发送和接收信号。有时，人们^0000CD黑客攻击中继器^000000，试图控制自动人偶或跟踪宅邸内发生的事情。"
  npc_override_ba_maison_quests_17_2_knowing_sorrow_unchosen_ce1fe2: "知道未被选中者的悲伤，知道无法逆转的过去的痛苦。"
  npc_override_ba_maison_quests_17_2_kuahahaahahahaha_1f3fd2: "库哈哈哈哈哈哈！！！"
  npc_override_ba_maison_quests_17_2_kyaaah_96c69d: "呀啊！！！"
  npc_override_ba_maison_quests_17_2_laboratory_signal_receiv_601e36: "实验室……信号接收……"
  npc_override_ba_maison_quests_17_2_lasis_your_wound_just_he_1e25a5: "拉西斯，你的伤口刚愈合，不要用力。不要勉强自己！！！"
  npc_override_ba_maison_quests_17_2_last_5ebd5a: "这是最后一个。"
  npc_override_ba_maison_quests_17_2_last_least_if_s_ghost_9ea17d: "最后但同样重要的是，如果是幽灵……"
  npc_override_ba_maison_quests_17_2_lastly_he_said_all_air_283c1d: "最后，他说所有的空气必须是中空的。他还说它消耗大量能量。我甚至猜不到<NAVI>[这样的地方]<INFO>ba_2whs01,110,217,0,101,0</INFO></NAVI>在哪里。"
  npc_override_ba_maison_quests_17_2_later_found_dead_varmund_02e8ed: "但是，后来在瓦尔蒙特宅邸被发现死亡。"
  npc_override_ba_maison_quests_17_2_leader_intruders_had_fre_f24d4a: "'入侵者'的领袖可以自由进入主人收藏品3的区域……"
  npc_override_ba_maison_quests_17_2_leader_intruders_one_gue_f36a93: "'入侵者'的领袖，或者说客人所称的幻视，已经逃走了，对吗？"
  npc_override_ba_maison_quests_17_2_leave_me_47857d: "交给我！"
  npc_override_ba_maison_quests_17_2_leave_me_5e48dd: "交给我。"
  npc_override_ba_maison_quests_17_2_let_me_check_moment_76c118: "让我检查一下……"
  npc_override_ba_maison_quests_17_2_let_me_handle_04e53a: "让我来处理。"
  npc_override_ba_maison_quests_17_2_let_me_know_if_you_0a0d18: "如果你看到了[妖精之城]这本书，请告诉我~"
  npc_override_ba_maison_quests_17_2_let_me_tell_you_about_0d6a41: "让我告诉你关于你刚才处理的生物芯片。这些芯片是由被称为^0000CD魔法毒化萨纳雷^000000的幻视成员在第二马力发电厂安装的，唯一目的是干扰无线电波。"
  npc_override_ba_maison_quests_17_2_let_s_break_through_bc217d: "让我们突破！！"
  npc_override_ba_maison_quests_17_2_let_s_bring_false_docume_02a975: "让我们带一份假文件给雇佣兵，让他们证明每一个错误。我们对此无话可说。"
  npc_override_ba_maison_quests_17_2_let_s_burn_them_all_e425de: "让我们把它们全部烧掉！！！嘿嘿嘿！"
  npc_override_ba_maison_quests_17_2_let_s_clean_up_mess_3b03bc: "让我们清理混乱~"
  npc_override_ba_maison_quests_17_2_let_s_go_d7f55d: "我们走吧。"
  npc_override_ba_maison_quests_17_2_let_s_go_rachel_4fb6d2: "我们走吧，拉切尔。"
  npc_override_ba_maison_quests_17_2_let_s_go_right_now_55f76c: "我们现在就走。"
  npc_override_ba_maison_quests_17_2_let_s_go_there_quickly_a2a834: "让我们快点进去找到他。冒险者也在这里，我们可以更快找到他！"
  npc_override_ba_maison_quests_17_2_let_s_go_up_285add: "我们上去！！！"
  npc_override_ba_maison_quests_17_2_let_s_go_we_ll_252552: "我们走吧，我们自己检查。"
  npc_override_ba_maison_quests_17_2_let_s_keep_now_218237: "让我们暂时保留它。"
  npc_override_ba_maison_quests_17_2_let_s_keep_what_danger_903528: "请不要把危险藏在自己心里，请告诉我们。"
  npc_override_ba_maison_quests_17_2_let_s_look_more_455e29: "让我们寻找更多。"
  npc_override_ba_maison_quests_17_2_let_s_meet_up_lake_0c1830: "我们在路尽头的湖边集合，然后结束。"
  npc_override_ba_maison_quests_17_2_let_s_pick_one_excessive_b2a37a: "让我们选一个。对事故过度承诺赔偿，高估企业责任。"
  npc_override_ba_maison_quests_17_2_let_s_regain_our_strengt_b96e32: "让我们在这里恢复体力，为战斗做准备。"
  npc_override_ba_maison_quests_17_2_let_s_see_how_far_d1b33b: "让我们看看它们能逃多远。"
  npc_override_ba_maison_quests_17_2_let_s_start_right_away_3f35ba: "让我们马上开始。"
  npc_override_ba_maison_quests_17_2_let_s_stop_talking_about_de2911: "让我们不要再谈这个了。如果你继续重复承担责任的话，而不说你要做什么，我不想再和你说话了。"
  npc_override_ba_maison_quests_17_2_let_s_take_break_now_b7395b: "让我们暂时休息一下。"
  npc_override_ba_maison_quests_17_2_let_s_tea_together_while_b49eac: "让我们一边喝茶一边等待重要人物的到来。"
  npc_override_ba_maison_quests_17_2_let_s_wait_out_little_8e348a: "让我们再等一会儿再出去……我们不能大意。"
  npc_override_ba_maison_quests_17_2_let_s_wait_until_sun_dd8259: "让我们等到太阳下山，然后悄悄进行行动。"
  npc_override_ba_maison_quests_17_2_level_you_move_your_body_790c04: "在那个级别，你可以比正常速度更快地移动身体。"
  npc_override_ba_maison_quests_17_2_library_registration_8a38d0: "图书馆登记？"
  npc_override_ba_maison_quests_17_2_library_registration_i_s_547671: "图书馆登记……我太兴奋了，直接进来了。有很多我想读的书……我会尽快去登记。"
  npc_override_ba_maison_quests_17_2_like_book_your_hand_2b87e1: "就像你手中的书。"
  npc_override_ba_maison_quests_17_2_like_i_said_basement_ver_32383f: "就像我说的，地下室是非常危险的地方，所以……看起来对你很困难。为什么不把生命花在更有价值的事情上呢？"
  npc_override_ba_maison_quests_17_2_like_you_guys_said_i_d07df3: "就像你们说的，我已经不是幻视的一员了。"
  npc_override_ba_maison_quests_17_2_listen_i_fell_into_sewer_95a7c1: "听着，我之前掉进了下水道，真的很危险！"
  npc_override_ba_maison_quests_17_2_listen_we_don_t_know_6daf55: "听着。我们还不知道这里未知实体的身份。但它不是自动人偶，也不是幽灵。它不是怪物。甚至不是超自然生物。"
  npc_override_ba_maison_quests_17_2_literally_as_boiler_said_4efe64: "正如锅炉所说。从很久以前开始，就经常发现未知的头发。也许头发和浴池的未知危险是一样的。"
  npc_override_ba_maison_quests_17_2_little_away_reception_ar_8bd985: "- 在接待区不远处，一个清洁机器人躺在阴影中放电。看起来它已经在这里很长时间了。-"
  npc_override_ba_maison_quests_17_2_little_thing_i_ll_dispos_c9e4f7: "这个小东西！我会处理掉它！"
  npc_override_ba_maison_quests_17_2_ll_helpful_looking_rest_436664: "这对寻找其他成员会有帮助。"
  npc_override_ba_maison_quests_17_2_ll_over_soon_c6617b: "很快就会结束。"
  npc_override_ba_maison_quests_17_2_loading_d5053a: "(��_��?) �� 加载中.."
  npc_override_ba_maison_quests_17_2_location_collaborator_be_71ad77: "合作者的大致位置已经确定。根据报告，他们正在等待进一步指示，所以……"
  npc_override_ba_maison_quests_17_2_locked_how_did_automatic_6f4ecd: "锁上了吗？但自动人偶是怎么进去的？那是个更大的问题。这证明了宅邸的安全存在漏洞，入侵者也是通过唯一的入口以外的通道进入的。"
  npc_override_ba_maison_quests_17_2_long_ago_i_saw_mr_8473e3: "不久前，我看到H先生和一个我不认识的人说话。"
  npc_override_ba_maison_quests_17_2_longest_part_over_so_fee_ea2a60: "最长的部分已经过去了，所以感觉就像一眨眼就过去了。"
  npc_override_ba_maison_quests_17_2_look_contents_envelope_s_6502ee: "看信封里的内容。那才是最重要的。"
  npc_override_ba_maison_quests_17_2_look_forward_helping_sei_061a1e: "期待帮助塞伊休的工作。我有空的时候会来帮忙的！"
  npc_override_ba_maison_quests_17_2_look_guards_over_there_ca6c0a: "看那边的守卫。"
  npc_override_ba_maison_quests_17_2_look_over_here_what_you_a2261d: "看这里。你觉得怎么样？"
  npc_override_ba_maison_quests_17_2_look_who_s_here_8c874d: "看看谁来了！！！"
  npc_override_ba_maison_quests_17_2_looking_you_closely_you_db7cc1: "仔细看，你看起来和其他管理者很不一样，对吗？"
  npc_override_ba_maison_quests_17_2_looks_dangerous_disposal_056489: "看起来很危险，但处理……"
  npc_override_ba_maison_quests_17_2_looks_exactly_like_you_2ba427: "它看起来和你一模一样。"
  npc_override_ba_maison_quests_17_2_looks_like_flow_lines_ma_28e002: "看起来流线是根据浴池的顺序和水温制作的，但即使流线也很有意义，就像这个宅邸里的一切一样。"
  npc_override_ba_maison_quests_17_2_lot_people_saw_3c95e4: "很多人看到了。"
  npc_override_ba_maison_quests_17_2_lucky_7387be: "拉奇……？"
  npc_override_ba_maison_quests_17_2_lucky_836896: "拉奇？"
  npc_override_ba_maison_quests_17_2_lucky_asked_me_favor_c4ed69: "拉奇请我帮个忙。"
  npc_override_ba_maison_quests_17_2_lucky_right_d8ef3c: "这是拉奇。没错。"
  npc_override_ba_maison_quests_17_2_lucky_stand_back_little_cd0eed: "拉奇，往后退一点。那真是戈尼吗？不是假货？让我们检查一下。"
  npc_override_ba_maison_quests_17_2_lucky_why_aren_t_you_4def35: "拉奇，你为什么不听我们的，站在政府一边？"
  npc_override_ba_maison_quests_17_2_lucky_you_d_better_stand_e4909b: "拉奇，你最好往后退一点。我觉得你靠得太近我会 confused。"
  npc_override_ba_maison_quests_17_2_lucky_you_one_who_fired_140890: "拉奇？是你发出的信号吗？你为什么叫我们，你不是让我们去湖边吗？"
  npc_override_ba_maison_quests_17_2_lucky_you_re_safe_i_d49d6c: "拉奇！你安全了！我以为你一个人出了什么事！"
  npc_override_ba_maison_quests_17_2_magenta_block_drain_poss_099d14: "洋红，堵住排水沟和可能的撤退位置。"
  npc_override_ba_maison_quests_17_2_magi_7590bf: "玛吉！！！"
  npc_override_ba_maison_quests_17_2_magi_c7c52b: "玛吉！！"
  npc_override_ba_maison_quests_17_2_magi_you_okay_7ba521: "玛吉，你还好吗？"
  npc_override_ba_maison_quests_17_2_make_any_sense_5c68bc: "这有什么意义吗？"
  npc_override_ba_maison_quests_17_2_make_you_automatic_doll_dbbe36: "那会让你像我们一样的自动人偶吗~？"
  npc_override_ba_maison_quests_17_2_makes_sense_all_right_ed265f: "……有道理。好吧。"
  npc_override_ba_maison_quests_17_2_manager_used_tray_carryi_2d2814: "管理者用托盘狠狠地砸了埃柳米娜的头，发出了一声巨响。"
  npc_override_ba_maison_quests_17_2_manager_who_brought_meal_8bd353: "送饭的管理者突然变了，攻击了埃柳米娜。"
  npc_override_ba_maison_quests_17_2_managers_knows_truth_abo_4a94fc: "管理者们知道雇佣兵战争的真相。"
  npc_override_ba_maison_quests_17_2_mansion_huge_i_m_actuall_ee0e55: "这个宅邸很大。我其实喜欢这个地方。"
  npc_override_ba_maison_quests_17_2_mansion_manager_b82f6d: "宅邸管理者。"
  npc_override_ba_maison_quests_17_2_mansion_s_navi_restauran_eea755: "宅邸的<NAVI>[餐厅]<INFO>ba_maison,146,109,0,101,0</INFO></NAVI>在底部，正如我之前展示的。"
  npc_override_ba_maison_quests_17_2_mansion_someone_you_neve_f60d28: "一个……你从未认识的人的宅邸。"
  npc_override_ba_maison_quests_17_2_mark_19b83a: "马克……"
  npc_override_ba_maison_quests_17_2_mark_take_look_place_28ebf0: "马克，看看这个地方。"
  npc_override_ba_maison_quests_17_2_master_hid_total_three_e_5c41c4: "主人在仓库里藏了^0000CD总共三把紧急钥匙^000000。而且这里还有很多损坏的自动人偶。"
  npc_override_ba_maison_quests_17_2_master_may_come_back_tom_ca2df7: "主人明天可能会回来。但他的回归暂时不指望。"
  npc_override_ba_maison_quests_17_2_master_you_master_come_w_c93ba1: "主人？你是主人吗？来吧！你怎么花了这么长时间？"
  npc_override_ba_maison_quests_17_2_masterpiece_born_f721dd: "杰作诞生了！"
  npc_override_ba_maison_quests_17_2_material_installed_maste_6dad33: "这个材料是主人自己安装的，没有主人的许可无法移除。"
  npc_override_ba_maison_quests_17_2_may_elly_54ba96: "可能不是艾莉，但是……"
  npc_override_ba_maison_quests_17_2_may_i_help_you_5a540b: "我能帮您吗？"
  npc_override_ba_maison_quests_17_2_maybe_he_ran_away_adf01c: "也许他逃跑了。"
  npc_override_ba_maison_quests_17_2_maybe_i_ll_take_home_f7d7dc: "也许我会带一些书回家……"
  npc_override_ba_maison_quests_17_2_maybe_intruders_causing_4a6db3: "或者可能是入侵者在制造某种干扰。首先，似乎唯一的办法是每次都检查人数。"
  npc_override_ba_maison_quests_17_2_maybe_s_done_eeb763: "也许完成了！"
  npc_override_ba_maison_quests_17_2_maybe_s_ghost_boiler_54c31b: "也许是^0000CD锅炉里的幽灵^000000。"
  npc_override_ba_maison_quests_17_2_maybe_s_racoon_a30d78: "也许是只浣熊。"
  npc_override_ba_maison_quests_17_2_maybe_you_just_got_accid_de8d53: "也许你只是不小心进来的。"
  npc_override_ba_maison_quests_17_2_me_almond_take_care_be53f7: "我和杏仁会处理它。"
  npc_override_ba_maison_quests_17_2_me_alpha_analyze_informa_febc5b: "我和阿尔法会正确分析信息，所以我希望你清理入侵者的残余。"
  npc_override_ba_maison_quests_17_2_me_lazy_take_care_elyumi_81836c: "我和雷兹会照顾埃柳米娜，然后快速跟上。"
  npc_override_ba_maison_quests_17_2_me_sweety_aren_t_humans_705a81: "但是，我和小甜不是人类，因为我们没有任何生物学定义，对吗？哈哈。"
  npc_override_ba_maison_quests_17_2_me_too_69cfca: "我也是！！！"
  npc_override_ba_maison_quests_17_2_means_20c955: "这意味着……"
  npc_override_ba_maison_quests_17_2_meantime_i_ll_what_i_482a9f: "与此同时，我会在这里尽我所能。"
  npc_override_ba_maison_quests_17_2_measure_taken_prevent_un_fc0cf4: "这是为了防止您在调查前在宅邸游荡时可能发生的不愉快事件而采取的措施。"
  npc_override_ba_maison_quests_17_2_medicinal_herbs_you_curi_bc0bc3: "草药？你对浴池中使用的草药好奇吗？为什么？浴池水不合你的口味吗？"
  npc_override_ba_maison_quests_17_2_meeting_ended_f4f8ba: "会议结束了。"
  npc_override_ba_maison_quests_17_2_memorial_dungeon_cfa5c4: "^0000CD这是一个纪念副本。^000000"
  npc_override_ba_maison_quests_17_2_menu_cleaning_392442: "清洁机器人 �� :用户已授权。很高兴见到您。"
  npc_override_ba_maison_quests_17_2_menu_cleaning_787d83: "清洁机器人 �� :未授权用户。通信终止。"
  npc_override_ba_maison_quests_17_2_menu_cleaning_990306: "清洁机器人 �� :正在进行用户识别的通信。"
  npc_override_ba_maison_quests_17_2_menu_cotnes_0741d1: "科特内斯:呵呵呵，我想公司代表有话要说。"
  npc_override_ba_maison_quests_17_2_menu_cotnes_1bac9d: "科特内斯:好吧，我现在没什么要说的。"
  npc_override_ba_maison_quests_17_2_menu_cotnes_cda4a4: "科特内斯:这里的每个人都很兴奋。呵呵呵。"
  npc_override_ba_maison_quests_17_2_menu_cotnes_df423b: "科特内斯:看起来里德什有话要说。"
  npc_override_ba_maison_quests_17_2_menu_dew_1a6b05: "杜:哦，这是另一个奇怪的房间？！我们不应该出去吗？哦！！！看那边的窗户。有那么多惊人的机器！！！"
  npc_override_ba_maison_quests_17_2_menu_dien_30d0af: "迪恩:你介意听听里德什的故事吗？"
  npc_override_ba_maison_quests_17_2_menu_dien_66438e: "迪恩:茶的香气很好。你想喝一杯吗？"
  npc_override_ba_maison_quests_17_2_menu_dien_93011e: "迪恩:让我们听听公司有什么要说的。"
  npc_override_ba_maison_quests_17_2_menu_dien_e57bb1: "迪恩:我现在没什么要说的，请原谅。"
  npc_override_ba_maison_quests_17_2_menu_elyumina_019e33: "埃柳米娜:我想我现在好多了。当你被这样讨厌时，你怎么样都无所谓了……"
  npc_override_ba_maison_quests_17_2_menu_elyumina_269b4f: "埃柳米娜:稍微……你能不能不要把我和那些白痴归为一类？"
  npc_override_ba_maison_quests_17_2_menu_elyumina_91381b: "埃柳米娜:我刚意识到，我的思维方式错了。这个叫瓦尔蒙特的家伙，他不是很厉害吗？"
  npc_override_ba_maison_quests_17_2_menu_elyumina_9d58fc: "埃柳米娜:如果我有，我就不会被抓住了。"
  npc_override_ba_maison_quests_17_2_menu_elyumina_a5cbfd: "埃柳米娜:不，我不是因为想接触才这么做的。我告诉你那是真的。"
  npc_override_ba_maison_quests_17_2_menu_est_0e3ca8: "埃斯特:比我想象的要快。"
  npc_override_ba_maison_quests_17_2_menu_est_8ebf28: "埃斯特:一个地名。"
  npc_override_ba_maison_quests_17_2_menu_kaya_a0ee9d: "凯亚·托斯:我会整理一下思绪后回来。"
  npc_override_ba_maison_quests_17_2_menu_kaya_cb5aab: "凯亚·托斯:请听长老们的话。"
  npc_override_ba_maison_quests_17_2_menu_kitty_38e16d: "基蒂:……"
  npc_override_ba_maison_quests_17_2_menu_kitty_8204bd: "基蒂:咯咯。"
  npc_override_ba_maison_quests_17_2_menu_kitty_9e5f3b: "基蒂:啾啾。"
  npc_override_ba_maison_quests_17_2_menu_lazy_0c522a: "雷兹:好吧，这是一次愉快的谈话。但是，你根本不是那种处境，对吗？"
  npc_override_ba_maison_quests_17_2_menu_lazy_11042b: "雷兹:是的，她看起来仍然像幻视成员，但和幻视稍有不同。只是稍微。"
  npc_override_ba_maison_quests_17_2_menu_lazy_24cdbb: "雷兹:我从未见过犯罪科学家小姐如此沮丧。"
  npc_override_ba_maison_quests_17_2_menu_lazy_3b9185: "雷兹:我不负责战斗。所以，冒险者，你有什么请求吗？"
  npc_override_ba_maison_quests_17_2_menu_lazy_90cdde: "雷兹:愤怒的语境有点奇怪。你确定你没事吗？"
  npc_override_ba_maison_quests_17_2_menu_lazy_e813ea: "雷兹:嗯，这里有点呼吸困难。"
  npc_override_ba_maison_quests_17_2_menu_ridsh_3dd0db: "里德什:你还好吗，凯亚先生？"
  npc_override_ba_maison_quests_17_2_menu_ridsh_6b0ae7: "里德什:公司的人有话要说。"
  npc_override_ba_maison_quests_17_2_menu_ridsh_94cdcc: "里德什:叫总裁出来！"
  npc_override_ba_maison_quests_17_2_menu_ridsh_a3178a: "里德什:我现在没什么要说的。"
  npc_override_ba_maison_quests_17_2_menu_ridsh_d815c2: "里德什:你想喝点茶吗？如果你想，这里有零食。"
  npc_override_ba_maison_quests_17_2_menu_rookie_12407c: "菜鸟:让我们听听公司代表的话。"
  npc_override_ba_maison_quests_17_2_menu_rookie_32bf05: "菜鸟:啊，米娜太虚弱了，我受不了~！"
  npc_override_ba_maison_quests_17_2_menu_rookie_32db15: "菜鸟:让你独自受苦是我的罪过。我们也应该去的。"
  npc_override_ba_maison_quests_17_2_menu_rookie_34a4c8: "菜鸟:那我先走了！"
  npc_override_ba_maison_quests_17_2_menu_rookie_83f293: "菜鸟:好吧，到这个时候，我宁可不发言，对吧？"
  npc_override_ba_maison_quests_17_2_menu_rookie_be9c57: "菜鸟:我不知道我怎么和这两个人在一起。"
  npc_override_ba_maison_quests_17_2_menu_rookie_c243bf: "菜鸟:好吧，我们取得了很大进展。这都多亏了你的帮助，冒险者。"
  npc_override_ba_maison_quests_17_2_menu_rookie_cc6124: "菜鸟:原来是个地名，是吗？"
  npc_override_ba_maison_quests_17_2_menu_rookie_e723c6: "菜鸟:让我们听听里德什的话。"
  npc_override_ba_maison_quests_17_2_menu_rookie_f6d737: "菜鸟:你叫我了吗？"
