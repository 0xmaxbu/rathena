  npc_override_ba_maison_quests_17_2_i_assumed_there_problem_c8bc96: "我假设花园出了问题，因为与其他园丁的连接经常中断。"
  npc_override_ba_maison_quests_17_2_i_avoid_them_some_extent_e3d581: "我可以在一定程度上避开它们，但我很担心，因为数量太多了。如果它们同时攻击，即使是最强的自动人偶也会立刻被摧毁。"
  npc_override_ba_maison_quests_17_2_i_been_abandoned_like_re_78b5a8: "如果不是因为我天才的大脑，我也会像其他人一样被抛弃吗？"
  npc_override_ba_maison_quests_17_2_i_been_informed_dolls_sa_9f7205: "我被告知自动人偶是安全的。我猜它只是忘了定期联系。"
