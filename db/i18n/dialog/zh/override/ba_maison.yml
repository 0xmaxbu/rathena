  npc_override_ba_maison_quests_17_2_i_m_noncombatant_so_i_4d4384: "我是非战斗人员，所以我会留在外面。我的力量只够保护自己。这是为了将痛苦降到最低而采取的预防措施。"
  npc_override_ba_maison_quests_17_2_i_m_probably_list_s_a04a42: "我可能不在名单上。这就是我要求的。"
  npc_override_ba_maison_quests_17_2_i_m_responsible_airship_b06197: "我负责飞艇机库的信息。"
  npc_override_ba_maison_quests_17_2_i_m_resting_here_anyway_da4f42: "反正我在这里休息。我一条腿都动不了。"
  npc_override_ba_maison_quests_17_2_i_m_sad_because_i_ed4b20: "我很难过，因为我不能打扫~怪物太可怕了~"
  npc_override_ba_maison_quests_17_2_i_m_second_horsepower_pl_6410f7: "我是……第二马力发电厂管理者……*嗡嗡*……"
  npc_override_ba_maison_quests_17_2_i_m_so_sorry_if_895727: "如果伤害了你，我非常抱歉。请原谅我为保护自己而无意中做的事情。"
  npc_override_ba_maison_quests_17_2_i_m_sorry_00dca6: "我很抱歉。"
  npc_override_ba_maison_quests_17_2_i_m_sorry_adventurer_how_8fad97: "很抱歉，冒险者。和另一位冒险者一起开个派对怎么样？"
  npc_override_ba_maison_quests_17_2_i_m_sorry_ask_after_252880: "很抱歉在道谢之后还请求你，但事情很紧急，你能帮我个忙吗？"
  npc_override_ba_maison_quests_17_2_i_m_sorry_i_ve_20627c: "很抱歉，我仔细检查了名单，但找不到你的名字。请再告诉我一次你的名字好吗？"
  npc_override_ba_maison_quests_17_2_i_m_sorry_interrupt_you_d7ef68: "很抱歉在您休息时打扰您。请尽情享受瓦尔蒙特宅邸的这个区域。"
  npc_override_ba_maison_quests_17_2_i_m_sorry_leaving_sudden_c157cb: "很抱歉突然离开。"
  npc_override_ba_maison_quests_17_2_i_m_sorry_make_you_18d9c1: "很抱歉让你独自受苦。我们应该陪在你身边的。"
  npc_override_ba_maison_quests_17_2_i_m_sorry_please_wait_37efca: "很抱歉，请稍等片刻。"
  npc_override_ba_maison_quests_17_2_i_m_sorry_they_must_84a07b: "很抱歉。它们一定是跟着我开门进来的。"
  npc_override_ba_maison_quests_17_2_i_m_sorry_we_re_ec9649: "很抱歉，但我们仍在搜索中。结束后请听结果，然后从中决定。"
  npc_override_ba_maison_quests_17_2_i_m_sorry_what_you_2bf0bd: "很抱歉，但您是什么意思？"
  npc_override_ba_maison_quests_17_2_i_m_still_wondering_if_631039: "我仍在想我是否真的能做到。"
  npc_override_ba_maison_quests_17_2_i_m_sure_adventurer_medi_45bc0d: "我相信冒险者会准备好医疗设施，让你立即得到治疗。所以，振作起来。"
  npc_override_ba_maison_quests_17_2_i_m_sure_other_guys_b03d2e: "我相信其他人会自己拿走所有乐趣！！！"
  npc_override_ba_maison_quests_17_2_i_m_sure_there_s_3fe500: "我相信下面有一个对身体好的房间，某个对手臂好的地方，还有某个对腿好的地方。"
  npc_override_ba_maison_quests_17_2_i_m_sure_there_s_9281d5: "我相信有足够的证据让你这么说。"
  npc_override_ba_maison_quests_17_2_i_m_sure_what_extent_6883c3: "我不确定我们的合作会到什么程度。"
  npc_override_ba_maison_quests_17_2_i_m_sure_you_know_4cd6ec: "我相信你知道它在哪里……"
  npc_override_ba_maison_quests_17_2_i_m_suspicious_mr_h_0f6cff: "我怀疑H先生。你不觉得他只做引人注目的事吗？"
  npc_override_ba_maison_quests_17_2_i_m_talking_rebellion_na_334804: "我正在和反叛者的<NAVI>[长老们]<INFO>ba_in01,203,103,0,0,0</INFO></NAVI>谈话，但他们相当固执，也许是因为他们已经是老年人了。"
  npc_override_ba_maison_quests_17_2_i_m_talking_rebellion_na_7b72e6: "我正在和反叛者的<NAVI>[长老们]<INFO>ba_in01,203,103,0,0,0</INFO></NAVI>谈话，但很难核实过去发生的事件……"
  npc_override_ba_maison_quests_17_2_i_m_trying_get_back_96118e: "我正在试图通过创建新力量回到我家乡的人民身边。你不需要一个基地来做到这一点吗？"
  npc_override_ba_maison_quests_17_2_i_m_using_quietly_withou_580fb0: "我在不为人知的情况下悄悄使用它，考虑到我的处境，这就是为什么我对人保持警惕。特别是我避免与不同于生物的自动人偶接触。"
  npc_override_ba_maison_quests_17_2_i_m_varmundt_2fd4ac: "我不是瓦尔蒙特。"
  npc_override_ba_maison_quests_17_2_i_m_very_lucky_how_f0f1bd: "我非常幸运。像你这样的大鱼怎么会来到这里？"
  npc_override_ba_maison_quests_17_2_i_m_watching_area_see_36308e: "我正在观察这个区域，看看是否有隐藏的敌人在潜伏。"
  npc_override_ba_maison_quests_17_2_i_m_willing_come_you_f6c65c: "我愿意和你一起去。"
  npc_override_ba_maison_quests_17_2_i_make_antidote_d41b48: "我可以制作解药。"
  npc_override_ba_maison_quests_17_2_i_make_suggestion_ce9b90: "我能提个建议吗？"
  npc_override_ba_maison_quests_17_2_i_mean_really_okay_ad4670: "我是说，真的没问题吗？"
  npc_override_ba_maison_quests_17_2_i_met_everyone_once_you_a20ec1: "我见过每个人一次。你在外面看到我了，不是吗？我甚至告诉了你该去哪里。你没觉得有什么不对劲吗？那是一个模仿我的假货。"
  npc_override_ba_maison_quests_17_2_i_met_lasis_earlier_way_1734b0: "我在来的路上早些时候遇到了拉西斯。"
  npc_override_ba_maison_quests_17_2_i_must_search_thoroughly_bac53f: "我必须彻底搜索。"
  npc_override_ba_maison_quests_17_2_i_named_nono_because_i_378a01: "我被命名为诺诺，因为我想被那样称呼。"
  npc_override_ba_maison_quests_17_2_i_need_clean_water_527641: "我需要干净的水！！！！！"
  npc_override_ba_maison_quests_17_2_i_need_find_safe_place_f14669: "我需要找一个安全的地方！"
  npc_override_ba_maison_quests_17_2_i_need_get_something_gue_14f0e7: "我现在需要为这里的客人拿点东西。如果我现在进去，我会像它们一样坏掉吗？那样可以吗？"
