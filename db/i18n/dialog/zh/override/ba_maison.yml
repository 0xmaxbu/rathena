  npc_override_ba_maison_quests_17_2_s_important_you_show_us_43eb9e: "重要的是你要向我们展示你要做什么。"
  npc_override_ba_maison_quests_17_2_s_intermittent_signal_2ced02: "这是间歇性信号。"
  npc_override_ba_maison_quests_17_2_s_leaving_d42546: "但它没有离开……"
  npc_override_ba_maison_quests_17_2_s_library_holds_research_16cb4f: "这是一个存放他喜爱研究的图书馆！！！这是一个私人图书馆，但我听说它比吉芬图书馆还大！！！我已经很久没有这么兴奋了！！！"
  npc_override_ba_maison_quests_17_2_s_like_1bf4b6: "不是那样的。"
  npc_override_ba_maison_quests_17_2_s_little_tempting_c2ed3e: "那有点诱人。"
  npc_override_ba_maison_quests_17_2_s_locked_8bbfaa: "锁上了。"
  npc_override_ba_maison_quests_17_2_s_more_like_person_than_969474: "它更像一个人而不是自动人偶。"
  npc_override_ba_maison_quests_17_2_s_much_as_token_apprecia_dcb95a: "不多，但作为感谢的象征，我会给你这个。"
  npc_override_ba_maison_quests_17_2_s_much_i_ll_give_86e553: "不多，但我会给你一些我的餐券。你会接受的，对吧？"
  npc_override_ba_maison_quests_17_2_s_my_job_i_don_404274: "这是我的工作，但我没有足够的时间手动登记、更新和共享信息，因为客人还在进来。"
  npc_override_ba_maison_quests_17_2_s_necessary_waste_time_p_72dd7e: "当你可以自己处理问题时，没有必要浪费时间传递问题，不是吗？"
