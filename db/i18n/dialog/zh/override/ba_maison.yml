  npc_override_ba_maison_quests_17_2_s_better_capture_then_ta_c87e52: "最好抓住它，然后取出芯片，用它来修理中继器。"
  npc_override_ba_maison_quests_17_2_s_big_now_because_there_5c67e5: "它现在这么大是因为没有足够的空间存放来自整个大陆的所有物品，这就是为什么我们不断扩建和翻新。"
  npc_override_ba_maison_quests_17_2_s_chip_s_letal_automatic_9c8984: "这是一种对自动人偶的通信能力致命的芯片，最近，它严重干扰了第二马力发电厂的管理。"
  npc_override_ba_maison_quests_17_2_s_complicated_describe_o_289172: "但描述我们的种类很复杂，所以叫我你觉得舒服的任何名字。"
  npc_override_ba_maison_quests_17_2_s_cool_what_mean_am_d29390: "但太酷了。那是什么意思？我错了吗？"
  npc_override_ba_maison_quests_17_2_s_cozy_nice_here_5887ab: "这里舒适又美好。"
  npc_override_ba_maison_quests_17_2_s_dangerous_908860: "危险！！"
  npc_override_ba_maison_quests_17_2_s_dangerous_b9c12a: "危险！"
  npc_override_ba_maison_quests_17_2_s_deal_877511: "成交。"
  npc_override_ba_maison_quests_17_2_s_different_when_someone_41dc75: "当有人坚持并且其他人承认时，就不一样了。"
  npc_override_ba_maison_quests_17_2_s_disgrace_me_great_elyu_e10eb0: "这对我来说是一种耻辱，伟大的埃柳米娜。"
