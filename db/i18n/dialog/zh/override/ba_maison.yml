  npc_override_ba_maison_quests_17_2_i_really_like_7f3d73: "我真的很喜欢。"
  npc_override_ba_maison_quests_17_2_i_really_like_thank_you_75b710: "我真的很喜欢。谢谢你。现在我稍微放心了一点。"
  npc_override_ba_maison_quests_17_2_i_really_look_like_one_730acd: "我真的看起来像这里的管理者之一吗？"
  npc_override_ba_maison_quests_17_2_i_received_records_unkno_382783: "- 我收到了一具未知尸体的记录。-"
