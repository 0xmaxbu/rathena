  npc_override_ba_maison_quests_17_2_thank_you_please_come_ba_c6d1be: "谢谢你。请黎明后再来。"
  npc_override_ba_maison_quests_17_2_thank_you_reading_record_1d1e9a: "谢谢你阅读记录！"
  npc_override_ba_maison_quests_17_2_thank_you_so_much_your_16be1e: "非常感谢你的辛勤工作。让我检查一下网络状态。"
  npc_override_ba_maison_quests_17_2_thank_you_so_much_your_3fc905: "非常感谢你今天的帮助。"
  npc_override_ba_maison_quests_17_2_thank_you_tatio_0edea5: "谢谢你，塔蒂奥。"
  npc_override_ba_maison_quests_17_2_thank_you_then_you_handl_69671a: "谢谢你。那么，你能处理20个^0000CD损坏的自动人偶^000000吗？我还需要5个^0000CD损坏的自动人偶零件^000000。"
  npc_override_ba_maison_quests_17_2_thank_you_very_much_1daec1: "非常感谢！"
  npc_override_ba_maison_quests_17_2_thank_you_very_much_4e6453: "非常感谢~"
  npc_override_ba_maison_quests_17_2_thank_you_very_much_a0908b: "非常感谢。"
  npc_override_ba_maison_quests_17_2_thank_you_very_much_clea_7e5732: "非常感谢，清洁机器人 �� 很高兴能够去清理。"
  npc_override_ba_maison_quests_17_2_thank_you_very_much_i_5cab3b: "非常感谢。期待与你见面进行训练。"
  npc_override_ba_maison_quests_17_2_thank_you_very_much_i_8b6378: "非常感谢。但我恐怕占用了你太多时间{0}……如果你不介意，我想请你帮个忙。"
  npc_override_ba_maison_quests_17_2_thank_you_very_much_plea_ab6c80: "非常感谢。请把这个带走。"
  npc_override_ba_maison_quests_17_2_thank_you_very_much_remo_7d95e0: "非常感谢。生物干扰芯片的移除已确认。"
  npc_override_ba_maison_quests_17_2_thank_you_waiting_prince_4a3668: "谢谢你的等待。东海公主，我已将你登记为瓦尔蒙特宅邸的正式客人。如果花费了一些时间，我道歉，因为通信不稳定。"
  npc_override_ba_maison_quests_17_2_thank_you_your_cooperati_08bd6d: "谢谢你的合作。"
  npc_override_ba_maison_quests_17_2_thank_you_your_hard_work_832ba1: "谢谢你的辛勤工作。"
  npc_override_ba_maison_quests_17_2_thank_you_your_help_elde_1f2d33: "那么，谢谢你的帮助，长老们。这是……这是我毕生奉献的工作。而公司派了刺客来杀我。"
  npc_override_ba_maison_quests_17_2_thank_you_your_help_then_a15819: "谢谢你的帮助。那我能请你消灭^0000CD15个沸腾食人鱼和15个沸腾马克^000000吗？"
  npc_override_ba_maison_quests_17_2_thank_you_your_help_ther_bd255a: "谢谢你的帮助，但有通知说在不伤害你的情况下尽可能配合客人。我会想别的办法。什么都可以。"
  npc_override_ba_maison_quests_17_2_thank_you_your_helping_u_59ecd8: "谢谢你帮助我们找到戈尼，冒险者。"
  npc_override_ba_maison_quests_17_2_thank_you_your_party_con_a863ba: "谢谢你的队伍确认。"
  npc_override_ba_maison_quests_17_2_thanks_them_cleaning_bec_78cb74: "多亏它们，清洁变得更加困难。入侵者甚至在我清洁时干扰。而且它们甚至不帮我清洁。"
  npc_override_ba_maison_quests_17_2_thanks_you_i_able_retrie_7c9811: "多亏了你，我才能取回我们需要的东西。"
  npc_override_ba_maison_quests_17_2_thanks_your_visit_terra_d81dff: "多亏你上次访问泰拉·格洛里亚，加冕典礼即将举行。"
  npc_override_ba_maison_quests_17_2_thats_no_s_envelope_corp_5721c2: "那是……不，那是带有公司印章的信封。它皱得很厉害。你从哪里得到这个信封？这是严格禁止泄露到雷肯伯外面的物品。"
  npc_override_ba_maison_quests_17_2_then_call_us_if_you_54491b: "如果你需要我们的支持，就叫我们。"
  npc_override_ba_maison_quests_17_2_then_come_go_navi_inside_69794c: "那么，来<NAVI>[里面]<INFO>ba_bath,165,43,0,101,0</INFO></NAVI>。如果我们发现什么，我们会发信号。"
  npc_override_ba_maison_quests_17_2_then_could_you_collect_p_7b6150: "那么，你能再从第二马力发电厂的^0000CD魔法毒化萨纳雷^000000那里收集10个^0000CD薯片^000000吗？"
  npc_override_ba_maison_quests_17_2_then_doesn_t_seem_one_7b3f68: "那么它似乎不是其中之一。"
  npc_override_ba_maison_quests_17_2_then_elly_i_ll_ask_8f6d3c: "那么，艾莉，我有一件事要问你。"
  npc_override_ba_maison_quests_17_2_then_i_ask_you_extermina_eba037: "那我能请你消灭^0000CD15个沸腾食人鱼和15个沸腾马克^000000。它们是浴池混乱的主要原因之一。"
  npc_override_ba_maison_quests_17_2_then_i_d_like_you_287319: "那么，我想让你处理地下室里的^0000CD20个损坏仓库管理者^000000。"
  npc_override_ba_maison_quests_17_2_then_i_d_like_you_7c8811: "那么，我想让你处理仓库里的^0000CD20个心脏猎手散兵^000000。"
  npc_override_ba_maison_quests_17_2_then_i_hope_you_comforta_66929d: "那么，我希望你度过舒适的时光。谢谢。"
  npc_override_ba_maison_quests_17_2_then_i_ll_able_get_f9fe49: "那我就能度过这个混乱。"
  npc_override_ba_maison_quests_17_2_then_i_ll_decide_book_6d6630: "那我就用这本书来决定，就像哥哥说的！！！"
  npc_override_ba_maison_quests_17_2_then_i_ll_get_going_ac3912: "那么，我先走了。"
  npc_override_ba_maison_quests_17_2_then_i_ll_let_everyone_473541: "那我会告诉大家并帮助阿尔法。"
  npc_override_ba_maison_quests_17_2_then_i_ll_let_you_4c9ff5: "那我来处理。"
  npc_override_ba_maison_quests_17_2_then_i_ll_repair_him_dcc1d9: "那我稍后会修理他。"
  npc_override_ba_maison_quests_17_2_then_i_ll_stay_here_3c2384: "那我会留在这里保护这个地方，当他醒来时，不应该有人留在这里再次把他打晕吗？"
  npc_override_ba_maison_quests_17_2_then_i_ll_take_you_ff228c: "那么，我带你进去。"
  npc_override_ba_maison_quests_17_2_then_i_ll_waiting_guest_a7f2af: "那我会在客房等你。"
  npc_override_ba_maison_quests_17_2_then_i_understand_6ed43d: "那么……我理解。"
  npc_override_ba_maison_quests_17_2_then_i_use_bathhouse_as_0b7992: "那我能把这个浴池作为我建立新力量的基地吗？"
  npc_override_ba_maison_quests_17_2_then_i_want_ask_you_a47a09: "那么，我想问你一件事……"
  npc_override_ba_maison_quests_17_2_then_i_wants_ask_you_173392: "那么，我想问你一件事……"
  npc_override_ba_maison_quests_17_2_then_identity_ghost_8cb4a9: "那么，幽灵的身份……"
  npc_override_ba_maison_quests_17_2_then_if_you_soak_these_1d3229: "然后。如果你把这些干叶泡在热水里，叶子的内容物就会出来。但仅此而已。"
  npc_override_ba_maison_quests_17_2_then_let_s_proceed_quiet_27b56e: "那么，让我们悄悄进行。"
  npc_override_ba_maison_quests_17_2_then_let_s_return_tea_18c36e: "那我们回茶馆吧。我也想冷静一下。"
  npc_override_ba_maison_quests_17_2_then_let_us_go_268790: "那么，我们走吧。"
  npc_override_ba_maison_quests_17_2_then_makes_sense_hear_so_c3d078: "那就能解释为什么听到没有形体的声音并制造噪音。因为出来的蒸汽，你还能看到奇怪的形状。"
  npc_override_ba_maison_quests_17_2_then_may_i_take_liberty_531fa8: "那么，我可以冒昧地请你帮个忙吗？我不是有意偷听，但你说你需要弄清楚宅邸的结构。"
  npc_override_ba_maison_quests_17_2_then_move_out_972615: "那么，出发！"
  npc_override_ba_maison_quests_17_2_then_please_a4d1cc: "那么，请。"
  npc_override_ba_maison_quests_17_2_then_please_adventurer_bca07d: "那么，请冒险者。"
  npc_override_ba_maison_quests_17_2_then_please_collect_pota_ad18a3: "那么，请收集10个^0000CD薯片^000000。"
  npc_override_ba_maison_quests_17_2_then_there_s_no_deal_df16f5: "那就没有交易。"
  npc_override_ba_maison_quests_17_2_then_there_s_nothing_we_de84d4: "那么，我们无能为力。我别无选择，只能思考。嗯……这个怎么样？瓦尔蒙特。"
  npc_override_ba_maison_quests_17_2_then_we_ll_trust_your_6ce305: "那我们会相信你的诺言，我们会收拾东西然后退下。"
  npc_override_ba_maison_quests_17_2_then_we_ll_waiting_here_39a156: "那么，我们会在这里等。"
  npc_override_ba_maison_quests_17_2_then_we_no_choice_call_7629aa: "那么，我们别无选择，只能叫守卫。"
  npc_override_ba_maison_quests_17_2_then_what_problem_073e87: "那么，问题是什么？"
  npc_override_ba_maison_quests_17_2_then_why_you_here_openin_f90d20: "那么，你为什么在这里？用紧急钥匙开门。你不能简单地捡起那些钥匙。"
  npc_override_ba_maison_quests_17_2_then_you_make_0b1920: "那么……你能做到吗？"
  npc_override_ba_maison_quests_17_2_there_also_beautiful_res_a9ac94: "内里乌斯家族的主屋里也有一个美丽的休息区。"
  npc_override_ba_maison_quests_17_2_there_any_inconvenience_f0a5c5: "使用浴池有什么不便吗？"
  npc_override_ba_maison_quests_17_2_there_any_way_we_deciphe_879eb4: "有什么方法可以解密吗？"
  npc_override_ba_maison_quests_17_2_there_anyone_who_underst_8f7acf: "有人理解这些东西吗？瓦尔蒙特也不希望浴池在漫长的时间中被遗弃和遗忘。"
  npc_override_ba_maison_quests_17_2_there_anything_else_susp_1a859a: "关于雇佣兵还有其他可疑的事情吗？"
  npc_override_ba_maison_quests_17_2_there_anything_left_see_b833de: "这里还有什么可看的吗？你不是有事要做吗？"
  npc_override_ba_maison_quests_17_2_there_automatic_dolls_wh_f91107: "有些自动人偶还没有收到更新后的客人名单，但我们已正式授予{0}客人身份。当你靠近它们时，自动人偶会认出你。"
  npc_override_ba_maison_quests_17_2_there_body_suddenly_what_3e952a: "突然有一具尸体，你是什么意思？"
  npc_override_ba_maison_quests_17_2_there_certain_dangers_ma_b6876c: "这个宅邸现在存在某些危险。无论是否有更多，这对我们来说都是非常重要的事情。"
  npc_override_ba_maison_quests_17_2_there_guest_house_northe_b99476: "宅邸北部有一个客房。"
  npc_override_ba_maison_quests_17_2_there_lot_blind_spots_pl_4bf51d: "这个地方有很多盲点。"
  npc_override_ba_maison_quests_17_2_there_lot_dolls_became_l_382f07: "有很多自动人偶变成了这样。"
  npc_override_ba_maison_quests_17_2_there_lot_luxurious_sele_26509b: "这里有很多豪华的酒可供选择。贤者喜欢酒吗？"
  npc_override_ba_maison_quests_17_2_there_maybe_something_na_563e03: "也许<NAVI>[那里]<INFO>ba_bath,165,43,0,101,0</INFO></NAVI>有什么东西。让我们看看。"
  npc_override_ba_maison_quests_17_2_there_mercenary_who_almo_573152: "有一个雇佣兵试图深入宅邸时差点被扔出去。是谁？"
  npc_override_ba_maison_quests_17_2_there_must_been_traitor_90dd04: "雇佣兵中一定有叛徒。"
  npc_override_ba_maison_quests_17_2_there_no_evidence_advent_8c8269: "……没有证据，冒险者。"
  npc_override_ba_maison_quests_17_2_there_no_guests_who_said_2c41ae: "没有客人被说死了。它们真的进去了吗？"
  npc_override_ba_maison_quests_17_2_there_no_individual_core_e4deac: "没有独立的核心，所以我得到的信息不会在贝塔之间共享，除非我更新它，"
  npc_override_ba_maison_quests_17_2_there_nothing_particular_314ece: "这里没有什么特别的。"
  npc_override_ba_maison_quests_17_2_there_place_where_i_wait_3729fc: "有我可以等待的地方吗？"
  npc_override_ba_maison_quests_17_2_there_problem_d0c1a9: "有问题吗？"
  npc_override_ba_maison_quests_17_2_there_problem_when_i_pro_ef8cf6: "当我承诺公司福利给我们雇佣并以公司名义工作的人时，有问题吗？"
  npc_override_ba_maison_quests_17_2_there_really_no_missing_d3b227: "里面真的没有失踪人员吗？"
  npc_override_ba_maison_quests_17_2_there_s_also_manager_who_85c06d: "还有那个在扫花园时突然攻击我的管理者！"
  npc_override_ba_maison_quests_17_2_there_s_another_mansion_e3ae19: "还有一个被心脏猎手伤害的宅邸管理者。"
  npc_override_ba_maison_quests_17_2_there_s_automatic_doll_h_688c9f: "这里有一个能思考的自动人偶。"
  npc_override_ba_maison_quests_17_2_there_s_been_lot_bloodsh_feebfa: "已经流了很多血，发生了这么大的骚动。"
  npc_override_ba_maison_quests_17_2_there_s_danger_lurking_u_752751: "地下潜伏着危险。"
  npc_override_ba_maison_quests_17_2_there_s_fire_d02b2b: "着火了！！！"
  npc_override_ba_maison_quests_17_2_there_s_ghost_coming_out_bafba4: "这里有幽灵出来。你也小心点。"
  npc_override_ba_maison_quests_17_2_there_s_lot_record_about_f50d9c: "有很多关于过去客人的记录，你需要什么样的记录？"
  npc_override_ba_maison_quests_17_2_there_s_no_evidence_3699e0: "……但没有证据。"
  npc_override_ba_maison_quests_17_2_there_s_no_logic_your_6e3032: "你的论点没有逻辑，也无法从中得出论点。"
  npc_override_ba_maison_quests_17_2_there_s_no_movement_all_c7fb2c: "没有任何动静，更不用说调解了。"
  npc_override_ba_maison_quests_17_2_there_s_no_one_here_9ce94b: "这里没有人……？我该怎么办？自动人偶通讯芯片又坏了吗……？"
  npc_override_ba_maison_quests_17_2_there_s_nothing_lose_you_0ea060: "没有什么可失去的，你可以把它用于个人娱乐。当然，我会相应地付给你报酬。我会登记你的数据，这样你就可以在没有紧急钥匙的情况下进出地下室。"
  npc_override_ba_maison_quests_17_2_there_s_nothing_says_int_dc2d7a: "这位犯罪科学家的脸上没有写着入侵者。"
  npc_override_ba_maison_quests_17_2_there_s_problem_if_you_aefa38: "但有个问题。如果你想和我战斗，你必须说服杏仁。"
  npc_override_ba_maison_quests_17_2_there_s_problem_repeater_c3e5d5: "某些区域的^0000CD中继器^000000有问题。信号无法传输或接收。"
  npc_override_ba_maison_quests_17_2_there_s_secret_all_over_45c782: "这个宅邸到处都有秘密。这个浴池也一样。乍一看，它似乎是在追随兴趣的流动时无序建造的，但它有自己的规则。"
  npc_override_ba_maison_quests_17_2_there_s_someone_who_got_ebfef2: "而且有人得到了一个新身体。"
  npc_override_ba_maison_quests_17_2_there_s_something_s_terr_929ea2: "有东西。那很可怕。我很兴奋！"
  npc_override_ba_maison_quests_17_2_there_s_two_person_what_64aa9f: "有两个人……？这就是你说的{0}？"
  npc_override_ba_maison_quests_17_2_there_s_you_know_lucky_f5ecb9: "有……你知道，拉奇。嗯……嗯……别误会。拉奇留在这里不是更好吗？"
  npc_override_ba_maison_quests_17_2_there_so_many_magic_spel_f0c489: "有那么多我从未见过的魔法咒语！！！！！"
  npc_override_ba_maison_quests_17_2_there_something_8974a4: "有什么东西吗？"
  npc_override_ba_maison_quests_17_2_there_something_botherin_06ae15: "这些数据有什么让你困扰的吗？"
  npc_override_ba_maison_quests_17_2_there_something_like_711435: "有过那样的东西吗？"
  npc_override_ba_maison_quests_17_2_there_something_rachel_4b05b3: "^0000FF拉切尔^000000里有东西。"
  npc_override_ba_maison_quests_17_2_there_stairway_goes_unde_b35d52: "^0000CD仓库最上层^000000有一条通往地下的楼梯。下楼检查下面的情况。不要碰那里的任何东西。"
  npc_override_ba_maison_quests_17_2_there_still_intruders_le_f20b46: "宅邸内仍有入侵者残留。"
  npc_override_ba_maison_quests_17_2_there_still_many_automat_966612: "废墟中仍有许多自动机。"
  npc_override_ba_maison_quests_17_2_there_suspicious_sound_b_9793b3: "地下室有可疑的声音。"
  npc_override_ba_maison_quests_17_2_there_traces_magical_com_fc1b51: "有与宅邸外某些地方进行魔法通信的痕迹。"
  npc_override_ba_maison_quests_17_2_there_two_groups_intrude_fd9e54: "有两组入侵者。一组沉迷于浴池，另一组沉迷于设施。它们的共同点是都沉迷于某样东西。"
  npc_override_ba_maison_quests_17_2_therefore_we_also_issue_bbb205: "因此，我们也将向你的队伍{0}颁发宅邸的正式客人许可证"
  npc_override_ba_maison_quests_17_2_therefore_we_like_ask_yo_9bf782: "因此，我们想请你不要进入。这可能对你离开宅邸造成致命风险，如果你无视警告强行进入，我们对任何伤害或死亡不承担责任。"
  npc_override_ba_maison_quests_17_2_these_dolls_broken_down_23164c: "这些是被入侵者破坏的自动人偶。"
  npc_override_ba_maison_quests_17_2_these_guys_532863: "这些家伙~~~"
  npc_override_ba_maison_quests_17_2_they_betrayed_me_first_t_e3b5b3: "它们先背叛了我，还叫我叛徒。"
  npc_override_ba_maison_quests_17_2_they_fought_amongst_them_51986d: "它们互相争斗，然后突然。"
  npc_override_ba_maison_quests_17_2_they_re_all_automatic_do_dbc629: "它们都是自动人偶，它们会有生动的记忆，不会说谎。"
  npc_override_ba_maison_quests_17_2_they_re_easy_catch_21eb09: "它们不容易抓到……"
  npc_override_ba_maison_quests_17_2_they_return_normal_if_yo_26754d: "如果你修好它们，它们会恢复正常，但有太多自动人偶，我们很难全部修好。"
  npc_override_ba_maison_quests_17_2_they_so_weak_stupid_they_327bc2: "但它们太弱太蠢了，一直自己死掉。"
  npc_override_ba_maison_quests_17_2_they_t_share_because_rep_9a74f0: "因为中继器，它们无法分享。"
  npc_override_ba_maison_quests_17_2_they_told_me_stay_here_94c6ba: "它们让我留在这里等！"
  npc_override_ba_maison_quests_17_2_they_told_me_you_need_f82029: "它们告诉我你需要登记才能在宅邸里走动，所以我报名了，它们突然把我的衣服换成了这个！"
  npc_override_ba_maison_quests_17_2_they_went_through_places_b83850: "它们穿过可以容纳身体的地方，比如水管和排水沟。湖里的鱼也能通过管道进入。"
  npc_override_ba_maison_quests_17_2_things_little_different_50c214: "但现在情况有点不同了，所以我会给你一个测试版。"
  npc_override_ba_maison_quests_17_2_think_about_way_why_did_a58bbf: "这样想。为什么主人要把头放在危险区域？一个头独自放在充满危险物品的地方。也许那东西也是危险的。"
  npc_override_ba_maison_quests_17_2_think_these_beautiful_au_b55930: "想到这些美丽的自动人偶存在。我应该早点来的。"
  npc_override_ba_maison_quests_17_2_think_you_re_really_goin_8aeb6e: "没想到你真的要为大家掏心掏肺。"
  npc_override_ba_maison_quests_17_2_this_that_7fb6bf: "……这个，那个……"
  npc_override_ba_maison_quests_17_2_those_guys_really_crazy_2d9f2a: "那些家伙真的疯了！你到底为什么要这样对我？叛徒？你这个叛徒？"
  npc_override_ba_maison_quests_17_2_those_things_out_there_w_773ed8: "外面的那些东西是入侵者的杰作……它们希望变成那样。"
  npc_override_ba_maison_quests_17_2_those_who_came_before_yo_840e91: "在你之前来的人现在住在<NAVI>[茶馆]<INFO>ba_in01,206,106,0,101,0</INFO></NAVI>，请四处看看，和他们谈谈。"
  npc_override_ba_maison_quests_17_2_those_who_life_i_underst_124d41: "那些有……生命……的人……我理解它们能处理生物芯片……*嗡嗡*"
  npc_override_ba_maison_quests_17_2_time_11545a: "现在不是做这个的时候！"
  npc_override_ba_maison_quests_17_2_time_again_communication_66db9f: "这次又是通信先中断，管理者一定是在安全人员注意到之前就被攻击了。"
  npc_override_ba_maison_quests_17_2_time_doing_ffa066: "现在不是做这个的时候。"
  npc_override_ba_maison_quests_17_2_time_goes_while_we_re_cfc8ee: "时间在我们站在这里的时候流逝。"
  npc_override_ba_maison_quests_17_2_time_our_side_6421bf: "时间站在我们这边。"
  npc_override_ba_maison_quests_17_2_time_our_side_right_f06ef7: "时间站在我们这边，对吗？"
  npc_override_ba_maison_quests_17_2_time_someone_said_s_trac_bb20bb: "这次，有人说这是激烈战斗的痕迹，但我们没有人受伤或失踪。"
  npc_override_ba_maison_quests_17_2_today_i_d_like_you_ccb78d: "今天。我想让你和20个{0}火龙果^000000玩。"
  npc_override_ba_maison_quests_17_2_today_s_day_i_ll_e361d8: "而今天就是我要打倒你的日子！"
  npc_override_ba_maison_quests_17_2_today_s_work_already_bee_206b81: "今天的工作已经完成。谢谢你的帮助。"
  npc_override_ba_maison_quests_17_2_today_s_work_already_bee_527b88: "今天的工作已经完成。"
  npc_override_ba_maison_quests_17_2_tone_seemed_stiff_perple_0370f5: "语气听起来僵硬而困惑……那绝对不是我。我猜是出现在这个浴池里的未知实体。"
  npc_override_ba_maison_quests_17_2_too_late_make_stupid_exp_40f5c0: "现在做愚蠢的表情太晚了吗？"
  npc_override_ba_maison_quests_17_2_took_quite_long_time_rea_76ac66: "花了很长时间才意识到同等暴力的玩耍是合适的。"
  npc_override_ba_maison_quests_17_2_training_who_ah_90845c: "训练……？但是和谁……啊……！"
  npc_override_ba_maison_quests_17_2_uehhhhhhhh_24ebdb: "呃hhhhhhh……"
  npc_override_ba_maison_quests_17_2_ugh_167de7: "呃……"
  npc_override_ba_maison_quests_17_2_ugh_cough_cough_cough_e6ee79: "呃！咳，咳，咳！"
  npc_override_ba_maison_quests_17_2_ugh_feels_weird_ah_i_fb1cfd: "呃……感觉很奇怪。啊，我能看到机器流动和螺丝的河流……"
  npc_override_ba_maison_quests_17_2_ugh_i_think_i_lost_482895: "呃，我想我失去理智了一会儿，回来看到了世界末日！"
  npc_override_ba_maison_quests_17_2_ugh_now_wait_what_tch_880b61: "呃！现在，等等。那是什么？啧，入侵者？"
  npc_override_ba_maison_quests_17_2_ugh_there_s_another_brok_112206: "呃-那边还有一个坏的。"
  npc_override_ba_maison_quests_17_2_ugh_ugh_a9e082: "呃！呃！"
  npc_override_ba_maison_quests_17_2_ugh_you_smell_awful_ecadf8: "呃……你闻起来太臭了！！"
  npc_override_ba_maison_quests_17_2_uh_7b1d46: "呃……"
  npc_override_ba_maison_quests_17_2_uh_all_communication_chi_4de0dc: "呃。所有通讯芯片都是标准的，所以如果它们被新的替换。我想它会恢复正常。"
  npc_override_ba_maison_quests_17_2_uh_mini_elly_dabb95: "呃……迷你艾莉？"
  npc_override_ba_maison_quests_17_2_uh_oops_i_mistakenly_tol_dd6a9d: "呃。哎呀。不是这个。我不小心告诉你错误的事情。"
  npc_override_ba_maison_quests_17_2_uh_take_guy_as_prisoner_696738: "呃，把这家伙当俘虏，呃，让他活着。"
  npc_override_ba_maison_quests_17_2_uhh_ae7bd6: "呃……"
  npc_override_ba_maison_quests_17_2_uhh_human_guests_shouldn_2efca2: "呃，人类客人不应该就这样进来。这个地方不太结实。"
  npc_override_ba_maison_quests_17_2_um_i_don_t_s_d57e0e: "嗯……我不认为是你想的那样。啊~我以为那是人类幽灵。但不，我想那是甚至在我来之前就在这里管理的自动人偶。"
  npc_override_ba_maison_quests_17_2_um_i_m_happy_you_f01613: "嗯..我很高兴你来帮我。但我听说人类需要很多休息。请黎明后再来。"
  npc_override_ba_maison_quests_17_2_um_i_picked_up_way_7a5e8a: "嗯……我在路上捡到的，看起来像是自动人偶配件。外面有那么多人，我以为它们到处都是。我打算捡起来修理。"
  npc_override_ba_maison_quests_17_2_um_mina_you_talk_people_fecd9f: "嗯……米娜？你能不咬人就和人说话吗？"
  npc_override_ba_maison_quests_17_2_um_yeah_what_s_big_7bb710: "嗯，是的。有什么大不了的？"
  npc_override_ba_maison_quests_17_2_umm_i_heard_humans_break_a67b5e: "嗯……我听说人类工作太多容易垮掉。请去休息一下，黎明后再来。"
  npc_override_ba_maison_quests_17_2_umm_i_t_stop_you_536a8e: "嗯……我无法阻止你。但小心管道。在错误的地方碰它会融化你的皮肤。"
  npc_override_ba_maison_quests_17_2_unauthorized_users_preve_56d73b: "未授权用户阻止我们清洁机器人做我们的工作~"
  npc_override_ba_maison_quests_17_2_unbelievable_8872ae: "难以置信！！！！"
  npc_override_ba_maison_quests_17_2_understood_i_m_going_con_1e5772: "明白了。我会联系公司，请一个重要人物与政府和平反者进行更深入的交谈。"
  npc_override_ba_maison_quests_17_2_unless_chip_exist_you_yo_6e451d: "除非那个'芯片'存在于你体内，否则你不是幻视的一员。你现在明白了吗？你这个小鬼。"
  npc_override_ba_maison_quests_17_2_unless_masters_moved_470cc9: "除非主人移动了它。"
  npc_override_ba_maison_quests_17_2_unlike_warehouse_only_va_46ae67: "与这个仓库不同，只有瓦尔蒙特能进入地下室。那里有很多秘密和危险的东西。"
  npc_override_ba_maison_quests_17_2_unusual_signal_54e938: "异常信号？"
  npc_override_ba_maison_quests_17_2_urrrrrrrrrrrr_ed0385: "呜rrrrrrrrrrrr！！！！"
  npc_override_ba_maison_quests_17_2_users_who_registered_as_677885: "未登记为客人的用户被视为敌人。"
  npc_override_ba_maison_quests_17_2_valve_humans_tea_bags_re_2680fb: "阀门。人类不是茶包。记住，我已经说过很多次了。"
  npc_override_ba_maison_quests_17_2_varmundt_also_gave_me_sp_1811c8: "瓦尔蒙特也给了我特殊权限，可以进入浴池。"
  npc_override_ba_maison_quests_17_2_varmundt_also_human_be9fad: "瓦尔蒙特也是人类。"
  npc_override_ba_maison_quests_17_2_varmundt_knew_my_situati_227c40: "瓦尔蒙特了解我的情况，非常友善地邀请我到他的宅邸，并让我随时可以使用浴池。"
  npc_override_ba_maison_quests_17_2_varmundt_mansion_s_bath_185540: "瓦尔蒙特宅邸的浴池久负盛名。瓦尔蒙特是一个重视在疲惫的一天后休息的人。"
  npc_override_ba_maison_quests_17_2_varmundt_understand_he_b_08ac93: "瓦尔蒙特会理解的。他有宽广的理解力，所以他会允许我从他家游荡，就像他帮助我在这个浴池里隐藏自己一样。乐意之至。"
  npc_override_ba_maison_quests_17_2_very_intelligent_sensiti_17beb8: "这是一种非常聪明和敏感的植物，可以控制多只蝴蝶。"
  npc_override_ba_maison_quests_17_2_very_unpleasant_me_fortu_1a3728: "这对我来说非常不愉快。但幸运的是，你还活着。你为什么花了这么长时间？你在下面遇到了你的能力无法处理的问题吗？"
  npc_override_ba_maison_quests_17_2_vice_president_i_m_reken_b1e0ea: "副总裁，我和雷肯伯董事会在一起。……你不需要知道我的身份。"
  npc_override_ba_maison_quests_17_2_vice_president_toss_i_ve_3708aa: "托斯副总裁，我看到了你与政府特工和冒险者合作的报告。"
  npc_override_ba_maison_quests_17_2_w_who_f1db4f: "- 谁……谁…… -"
  npc_override_ba_maison_quests_17_2_wa_wait_940828: "等……等等……！"
  npc_override_ba_maison_quests_17_2_wa_waterball_79cdcf: "哇……水球！！！"
  npc_override_ba_maison_quests_17_2_wait_5952d3: "……等等？"
  npc_override_ba_maison_quests_17_2_wait_i_m_little_weird_0998b8: "等等，我有点奇怪……我头疼，开始感到头晕和恶心。"
  npc_override_ba_maison_quests_17_2_wait_isn_t_signal_proble_454391: "等等，这不是信号问题，突然有一个^0000CD黑客通道^000000干扰它……对吗？"
  npc_override_ba_maison_quests_17_2_wait_minute_844adc: "等一下……"
  npc_override_ba_maison_quests_17_2_wait_minute_i_ll_just_76b2f0: "等一下……我再看一会儿就去登记！！！"
  npc_override_ba_maison_quests_17_2_wait_my_common_sense_wei_d7e55f: "等等，我的常识奇怪吗？那正常吗？"
  npc_override_ba_maison_quests_17_2_wait_sec_267d13: "^008800等一下！！"
  npc_override_ba_maison_quests_17_2_wait_show_me_data_too_ade447: "等等……也给我看看数据。"
  npc_override_ba_maison_quests_17_2_wait_wait_minute_i_m_2b3634: "等等，等一下。我有适当的许可证……啊！"
  npc_override_ba_maison_quests_17_2_wait_wait_minute_she_us_9cde17: "等等，等一下。她和我们在一起。"
  npc_override_ba_maison_quests_17_2_wait_you_going_keep_talk_4d576a: "等等，你要一直那样说话吗？这很混乱，你为什么不以他原来的形态和他说话？"
  npc_override_ba_maison_quests_17_2_warehouse_a9c29f: "仓库……？"
  npc_override_ba_maison_quests_17_2_warehouse_signal_receive_c5f660: "仓库……信号接收……"
  npc_override_ba_maison_quests_17_2_warehouse_very_dangerous_94564d: "仓库非常危险，所以你必须非常小心。好吗？"
  npc_override_ba_maison_quests_17_2_warning_fe639f: "警告。"
  npc_override_ba_maison_quests_17_2_warnings_being_recorded_d9873a: "在设施异常使用期间会记录警告，如果警告累积，你将被逐出宅邸。"
  npc_override_ba_maison_quests_17_2_wasn_t_mercenaries_ac9105: "不是雇佣兵。"
  npc_override_ba_maison_quests_17_2_wasn_t_original_one_eb9d49: "这不是原来的那个吗？"
  npc_override_ba_maison_quests_17_2_wasn_t_problem_like_brok_684901: "这不是损坏清洁机器人那样的问题。检查仓库时，我们注意到里面有一些残留的入侵者。它们说是心脏猎手散兵。正如我之前所说，我有很多工作要做。"
  npc_override_ba_maison_quests_17_2_water_0a80c6: "水！！！"
  npc_override_ba_maison_quests_17_2_waterball_56b783: "水球！！！"
  npc_override_ba_maison_quests_17_2_way_broken_dolls_still_a_7da739: "顺便问一下，损坏的自动人偶仍然无序出现。为什么即使我们修好了损坏的自动人偶，损坏的自动人偶仍然出现？错误在自我复制吗？"
  npc_override_ba_maison_quests_17_2_way_cc3262: "这边……"
  npc_override_ba_maison_quests_17_2_way_how_s_outside_these_ced05a: "顺便问一下，外面最近怎么样？"
  npc_override_ba_maison_quests_17_2_way_how_you_able_get_2745c4: "顺便问一下，你是怎么获得进入所有区域的权限的？通常，普通客人只能使用非限制区域。"
  npc_override_ba_maison_quests_17_2_way_i_m_sure_adventurer_b2d6e6: "顺便问一下，我相信冒险者从水上花园回来一定很辛苦。"
  npc_override_ba_maison_quests_17_2_way_i_ve_prepared_trap_b129b2: "顺便问一下，我准备了一个陷阱来制造骚动，并抓住非官员成员。"
  npc_override_ba_maison_quests_17_2_way_only_broken_repeater_f5b20b: "顺便问一下，那是唯一损坏的中继器吗？"
  npc_override_ba_maison_quests_17_2_way_where_did_you_found_74a817: "顺便问一下……你在哪里找到这些书的……"
  npc_override_ba_maison_quests_17_2_way_where_east_sea_i_ff52c2: "顺便问一下，东海在哪里？我从未听说过。"
  npc_override_ba_maison_quests_17_2_way_where_s_mr_h_d5f856: "顺便问一下，H先生在哪里？"
  npc_override_ba_maison_quests_17_2_way_who_you_brother_832bac: "顺便问一下……你是谁，兄弟？"
  npc_override_ba_maison_quests_17_2_way_why_you_late_ec32d2: "顺便问一下，你为什么迟到了？"
  npc_override_ba_maison_quests_17_2_we_also_accept_vice_pres_11e345: "我们也将接受凯亚·托斯副总裁的意见，彻底分析他到目前为止调查的内容，并相应地分配补偿和惩罚。"
  npc_override_ba_maison_quests_17_2_we_also_equipment_capabl_978f27: "我们也有能够进行远距离数据传输和接收的设备。"
  npc_override_ba_maison_quests_17_2_we_also_procedure_you_re_0c8817: "我们也有那个程序！你在干扰行动！"
  npc_override_ba_maison_quests_17_2_we_arrive_time_coronatio_5a3c4b: "我们会准时到达加冕典礼。"
  npc_override_ba_maison_quests_17_2_we_automatic_dolls_serve_3fe7dc: "我们自动人偶像服务宅邸主人一样服务人类客人，我们已经习惯了。但我们对不熟悉的问题缺乏信息和应对技能。"
  npc_override_ba_maison_quests_17_2_we_automatic_dolls_think_f7528d: "我们，自动人偶，认为我们不知道是很自然的，因为我们以前只接触过客人。"
  npc_override_ba_maison_quests_17_2_we_citizens_how_could_th_025f4a: "我们不是公民吗？他们怎么能这样！"
  npc_override_ba_maison_quests_17_2_we_close_next_time_we_35c17a: "我们很接近，但下次我们会抓住剩下的。"
  npc_override_ba_maison_quests_17_2_we_compare_produce_best_24d72d: "我们比较以产生最佳结果。然后我们排除入侵者，这是阿尔法的行动方针。"
  npc_override_ba_maison_quests_17_2_we_currently_tracking_ex_ac9adc: "我们目前在收到事件报告后跟踪预期路径。"
  npc_override_ba_maison_quests_17_2_we_didn_t_sense_unknown_a7119f: "我们没有感知到未知的危险，也未能定位人类客人。也许是因为我们无法像人类一样感受。"
  npc_override_ba_maison_quests_17_2_we_enter_into_water_gard_d1d94c: "我们能进入水上花园吗？我必须在里面获得一个^0000CD银帕皮拉之叶^000000。"
  npc_override_ba_maison_quests_17_2_we_give_you_passage_wate_f1d662: "我们会给你通往水上花园的通道，但请帮我们完成工作。"
  npc_override_ba_maison_quests_17_2_we_handed_prisoner_alpha_bbebf3: "我们把囚犯交给了阿尔法。"
  npc_override_ba_maison_quests_17_2_we_having_difference_opi_89437a: "我们有意见分歧吗？"
  npc_override_ba_maison_quests_17_2_we_issued_you_guest_lice_46ea44: "我们已向你颁发客人许可证。与瓦尔蒙特的正式邀请不同，这张卡只是临时的。"
  npc_override_ba_maison_quests_17_2_we_kindly_ask_your_under_25b96e: "我们恳请你的理解。在确认目的、方法和你的身份后，我们将允许你在宅邸内进行调查。"
  npc_override_ba_maison_quests_17_2_we_know_who_person_4aba74: "我们知道这个人是谁。"
  npc_override_ba_maison_quests_17_2_we_like_collect_resolvin_36b943: "我们想通过{0}收集解决入侵者问题的相关数据，这将对我们未来的案例有很大帮助。"
  npc_override_ba_maison_quests_17_2_we_ll_able_trace_back_1317ef: "有了那个，我们就能追溯其他合作者的下落。"
  npc_override_ba_maison_quests_17_2_we_ll_follow_along_no_23ca09: "我们会跟着，不用有压力。"
  npc_override_ba_maison_quests_17_2_we_ll_go_ahead_first_357903: "我们先走。"
  npc_override_ba_maison_quests_17_2_we_ll_properly_analyze_i_531b57: "我们会正确分析信息，所以如果客人能清理留下的残余……哦！"
  npc_override_ba_maison_quests_17_2_we_maintain_information_24c747: "我们将维护'入侵者'的信息模式，并收集从宅邸外同伙那里收到的信息。"
  npc_override_ba_maison_quests_17_2_we_need_check_first_if_f26639: "我们需要先检查风险是超自然的还是^0000CD幻视^000000。你能告诉我更多吗？也许这就是幻视来到这个宅邸的原因。"
  npc_override_ba_maison_quests_17_2_we_need_diagnosis_treatm_099de2: "我们需要诊断和治疗。我想请你快点。"
  npc_override_ba_maison_quests_17_2_we_need_hurry_up_investi_6dfb00: "我们需要加快调查。"
  npc_override_ba_maison_quests_17_2_we_need_repair_anyway_we_8d6793: "我们无论如何都需要修理它，但我们需要先抓住它。"
  npc_override_ba_maison_quests_17_2_we_need_something_stop_7e711d: "我们需要做点什么来阻止这个。"
  npc_override_ba_maison_quests_17_2_we_only_collect_informat_956f47: "我们只收集信息并找到结论，但人类不同。我听说你们收集所有个人经历、想法和想象来得出结论。"
  npc_override_ba_maison_quests_17_2_we_plant_culture_set_gar_bd3aa6: "我们有园丁设置的植物培养装置，所以今天就这样。"
