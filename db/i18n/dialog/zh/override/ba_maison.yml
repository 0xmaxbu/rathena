  npc_override_ba_maison_quests_17_2_you_i_ll_return_now_fc8ff2: "你，我现在回去。"
  npc_override_ba_maison_quests_17_2_you_i_ll_take_blueprints_e82c4f: "你会吗？我会从神殿这里拿蓝图。冒险者，请去<NAVI>[锅炉房]<INFO>ba_bath,286,68,0,101,0</INFO></NAVI>让他们关掉。我很快会赶上你。"
