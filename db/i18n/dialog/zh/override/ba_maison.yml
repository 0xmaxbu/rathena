  npc_override_ba_maison_quests_17_2_s_amazing_you_re_compati_015170: "你竟然能兼容我们的自动人偶零件，太神奇了。"
  npc_override_ba_maison_quests_17_2_s_beautiful_form_connect_6c9e62: "太美了，这种连接形式允许核心实体通过集中式网络控制方法自由控制部署在整个宅邸的子对象……"
  npc_override_ba_maison_quests_17_2_s_because_my_sexuality_f_d69293: "是因为我的性取向。它迫使我离开家乡，因为被欺负。这就是为什么当我与他人接触时，我会不自觉地警惕。"
  npc_override_ba_maison_quests_17_2_s_because_repeater_bd3b02: "是因为中继器。"
  npc_override_ba_maison_quests_17_2_s_been_long_time_since_75a34f: "我已经很久没读书了，但我可以完美地阅读，就像读命令书一样。"
