  npc_override_ba_maison_quests_17_2_you_make_antidote_using_efe224: "你可以使用^0000CD西尔瓦·帕皮拉之叶^000000制作解药，这是<NAVI>[水上花园]<INFO>ba_maison,239,47,0,101,0</INFO></NAVI>的材料。这是主人为此目的培育的。"
