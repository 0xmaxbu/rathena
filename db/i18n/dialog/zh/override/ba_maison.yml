  npc_override_ba_maison_quests_17_2_i_m_just_doing_what_359424: "我只是在尽我们应尽的责任。"
  npc_override_ba_maison_quests_17_2_i_m_kind_person_556b5e: "我不是那种人。"
  npc_override_ba_maison_quests_17_2_i_m_lasis_rebellion_859e93: "我是反叛者的拉西斯。"
  npc_override_ba_maison_quests_17_2_i_m_looking_blueprint_9b43b4: "我不是在找蓝图。"
  npc_override_ba_maison_quests_17_2_i_m_looking_forward_your_731230: "期待您的友好合作。"
  npc_override_ba_maison_quests_17_2_i_m_mansion_manager_mans_ed9ee0: "我是[大贤者瓦尔蒙特宅邸]的宅邸管理者。"
