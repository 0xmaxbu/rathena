  npc_override_ba_maison_quests_17_2_you_great_king_7fe359: "你会成为一个伟大的国王。"
  npc_override_ba_maison_quests_17_2_you_guys_look_strong_why_53ecb9: "你们看起来很强壮。你们为什么不战斗并训练我？我没有保护自己的手段，我唯一幸存的原因是我很弱，躲起来了。"
  npc_override_ba_maison_quests_17_2_you_handled_troublesome_a1213b: "你很好地处理了这些麻烦的入侵者。这给我留下了印象，你是一个非常熟练的冒险者，能出色地处理这种情况。"
  npc_override_ba_maison_quests_17_2_you_happen_barmeal_ticke_4416e7: "你碰巧有巴美餐券吗？它用来在餐厅吃饭。我给你这个，所以晚点来吃吧！我会为你准备好吃的！作为感谢！"
  npc_override_ba_maison_quests_17_2_you_happen_party_you_dcb2d7: "……你碰巧有队伍吗？"
  npc_override_ba_maison_quests_17_2_you_haven_t_yet_you_770533: "你还没有吗？你不愿意伤害自动人偶吗？别担心。我反正稍后会做的。"
