  npc_override_ba_maison_quests_17_2_s_terrible_i_don_t_c4b643: "太可怕了……我不想……再想了……"
  npc_override_ba_maison_quests_17_2_s_thank_your_hardwork_e15d59: "感谢你的辛勤工作！"
