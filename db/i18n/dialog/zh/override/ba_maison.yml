Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_ba_maison_ba_maison_menu_luina_58c88f: "露依娜:请稍等，如果您想进去，我需要先跟您谈谈……"
  npc_override_ba_maison_ba_maison_there_still_some_work_do_3cddcd: "这里还有一些工作要做。我们再四处看看吧。"
  npc_override_ba_maison_quests_17_2_a_e88955: "(-_-a);;;"
  npc_override_ba_maison_quests_17_2_aaaaaaah_6a55a7: "啊啊啊啊啊！！！"
  npc_override_ba_maison_quests_17_2_aaaaaah_2867f6: "啊啊啊啊！！！"
  npc_override_ba_maison_quests_17_2_about_mercenary_named_h_8fc4f3: "关于一位名叫H的佣兵。"
  npc_override_ba_maison_quests_17_2_accept_3e1999: "接受。"
  npc_override_ba_maison_quests_17_2_accept_bb54db: "接受"
  npc_override_ba_maison_quests_17_2_accept_request_ad9c99: "接受请求。"
  npc_override_ba_maison_quests_17_2_accommodations_signal_re_314f0c: "住宿区……信号接收中……"
  npc_override_ba_maison_quests_17_2_according_analysis_s_one_6d58f1: "根据分析，这是单向接收。"
  npc_override_ba_maison_quests_17_2_according_definition_she_2e74fb: "根据定义，她绝对不是同事。"
  npc_override_ba_maison_quests_17_2_ack_e24c27: "- 啊！ -"
  npc_override_ba_maison_quests_17_2_act_against_corporate_s_530705: "做违背公司利益的事？我一直在为公司利益工作。"
  npc_override_ba_maison_quests_17_2_actually_cleaning_dolls_b14395: "其实，清洁人偶以前没有现在这么强大。由于入侵者的缘故，才不可避免地采取了这种措施。"
  npc_override_ba_maison_quests_17_2_addition_broken_automati_2217fd: "此外，损坏的自动人偶四处游荡，不断破坏中继器，使所需的供应量翻倍。"
  npc_override_ba_maison_quests_17_2_addition_guest_525161: "另外……有客人？"
  npc_override_ba_maison_quests_17_2_addition_there_facility_e8f46b: "此外，宅邸地下室设有身体清洗设施。我们鼓励到访宅邸的客人前往冥想浴场。"
  npc_override_ba_maison_quests_17_2_addition_they_also_state_53975c: "此外，他们还声明，你是来这里^0000CD抓捕入侵者^000000的，这些入侵者正在宅邸内制造骚乱。"
  npc_override_ba_maison_quests_17_2_adventurer_chuckles_64e358: "冒险者，*轻笑*"
  npc_override_ba_maison_quests_17_2_adventurer_cleaning_robo_c3cb37: "冒险者，清洁机器人只对人们说的话做出反应。"
  npc_override_ba_maison_quests_17_2_adventurer_could_you_get_0e2549: "冒险者，你能帮我们弄到荧光液体和断剑吗？"
  npc_override_ba_maison_quests_17_2_adventurer_could_you_go_1cef8d: "冒险者，你能去第二发电厂收集10个^0000CD薯片^000000吗？"
  npc_override_ba_maison_quests_17_2_adventurer_could_you_go_b85d33: "冒险者，你能进去帮我拿希尔瓦·帕皮拉的叶子吗？"
  npc_override_ba_maison_quests_17_2_adventurer_hey_mr_kaya_q_609f6d: "冒险者，嘿。卡亚先生很沮丧，你介意去看看卡亚先生吗？"
  npc_override_ba_maison_quests_17_2_adventurer_let_s_go_navi_f606f2: "冒险者，我们去<NAVI>[休息室]<INFO>ba_bath,203,58,0,101,0</INFO></NAVI>吧。"
  npc_override_ba_maison_quests_17_2_adventurer_long_time_no_2c2b1b: "冒险者！好久不见！"
  npc_override_ba_maison_quests_17_2_adventurer_meet_other_ma_c41d28: "冒险者，去和其他像我一样的主管见面，检查其他自动人偶是否有可疑之处。我得先拿到蓝图。"
  npc_override_ba_maison_quests_17_2_adventurer_movement_illu_d6516d: "冒险者！宅邸内已确认幻影的活动。我们很快将组队，弄清宅邸结构，然后开始行动。"
  npc_override_ba_maison_quests_17_2_adventurer_please_go_man_85c0de: "冒险者，请去宅邸主管那里，了解佣兵们住在瓦尔蒙特宅邸期间发生了什么事。"
  npc_override_ba_maison_quests_17_2_adventurer_quiet_i_t_cau_4bcc54: "冒险者，安静！我不能一个人在这里被抓到！"
  npc_override_ba_maison_quests_17_2_adventurer_take_these_fr_aa84f0: "冒险者，拿着这些^0000CD冰冻陷阱^000000。请把它们种在每个标记的?? <NAVI>[位置]<INFO>ba_bath,55,55,0,101,0</INFO></NAVI>上。你只需要把它放在原地并保持稳定。请快点。"
  npc_override_ba_maison_quests_17_2_adventurer_there_s_no_wa_43364e: "冒险者，你不可能还觉得米娜是个幻影吧？"
  npc_override_ba_maison_quests_17_2_adventurer_what_s_1932f5: "冒险者，那是什么？"
  npc_override_ba_maison_quests_17_2_adventurer_whenever_you_68ef5c: "冒险者，你有空的时候请来锅炉房。我有件事要请你帮忙。"
  npc_override_ba_maison_quests_17_2_adventurer_you_arrived_j_d249b5: "冒险者，你来得正好。"
  npc_override_ba_maison_quests_17_2_adventurer_you_here_help_964610: "冒险者，你是来再次帮助我的吗？"
  npc_override_ba_maison_quests_17_2_adventurer_you_re_only_o_27ad26: "冒险者，你是长老们唯一会相信的人。"
  npc_override_ba_maison_quests_17_2_adventurer_you_set_up_al_a1737c: "冒险者，你设好所有陷阱了吗？那边已经开始了。快过去。"
  npc_override_ba_maison_quests_17_2_adventurer_you_which_one_193509: "冒险者，你知道哪个是真的吗？"
  npc_override_ba_maison_quests_17_2_after_all_you_re_alone_8998b3: "毕竟，你并不孤单。"
  npc_override_ba_maison_quests_17_2_after_master_had_destroy_3a8bf1: "自从主人摧毁这个地方后，我有一段时间在做别的事情，但是……"
  npc_override_ba_maison_quests_17_2_again_i_m_sorry_f7d114: "再次，对不起。"
  npc_override_ba_maison_quests_17_2_again_trouble_dba040: "又是……麻烦……"
  npc_override_ba_maison_quests_17_2_ah_again_another_steam_87b8bb: "啊！又一股蒸汽！！！"
  npc_override_ba_maison_quests_17_2_ah_ahhhhhh_dear_guest_yo_bb9d57: "啊，啊啊啊啊！亲爱的客人，您受伤了吗？哪里？怎么伤的？严不严重？！"
  npc_override_ba_maison_quests_17_2_ah_driving_me_crazy_hey_b1a2c4: "啊，这让我快疯了。嘿，解药什么时候才能做好？"
  npc_override_ba_maison_quests_17_2_ah_ef9ee9: "……啊！！"
  npc_override_ba_maison_quests_17_2_ah_guesthouse_we_current_917a48: "啊，客房。我们现在把它当作监狱使用。"
  npc_override_ba_maison_quests_17_2_ah_i_confirmed_edf331: "啊，我确认了。"
  npc_override_ba_maison_quests_17_2_ah_i_new_body_16c7ec: "啊。我有了一个新身体……"
  npc_override_ba_maison_quests_17_2_ah_i_see_df4b54: "啊，我明白了。"
  npc_override_ba_maison_quests_17_2_ah_mina_her_face_looks_4d2e4a: "啊，米娜。她的脸色看起来发青，不是吗？冒险者，请告诉他们快点准备！"
  npc_override_ba_maison_quests_17_2_ah_she_came_you_re_6c643d: "啊~她来了！你就是提出那个请求的人！"
  npc_override_ba_maison_quests_17_2_ah_since_when_you_been_acbd20: "啊，{0}，你什么时候来的？让你看到我丢脸的一面了。"
  npc_override_ba_maison_quests_17_2_ah_there_s_lot_you_25add1: "啊！你身上有很多{0}……啊，你一直在和火龙果玩。"
  npc_override_ba_maison_quests_17_2_ah_yeah_conversation_lit_45473e: "啊，是的。这次谈话有点尴尬……"
  npc_override_ba_maison_quests_17_2_ah_yes_mansion_managers_f2254c: "啊，是的。宅邸主管们会记得的！"
  npc_override_ba_maison_quests_17_2_ah_you_talking_about_sec_fc2b07: "啊……你在说秘书吗？"
  npc_override_ba_maison_quests_17_2_aha_ha_ha_don_t_3fb0da: "啊哈哈……不要太兴奋，不管怎样。"
  npc_override_ba_maison_quests_17_2_ahh_aa7d86: "啊！"
  npc_override_ba_maison_quests_17_2_ahhhhhhhhhhhh_ae56b2: "啊啊啊啊啊啊啊啊！！"
  npc_override_ba_maison_quests_17_2_all_automatic_dolls_mans_92245e: "宅邸里所有的自动人偶都连接到一个无线网络。"
  npc_override_ba_maison_quests_17_2_all_b2ff06: "一点也不。"
  npc_override_ba_maison_quests_17_2_all_contextual_material_4f2cc3: "所有情境和物证都指向公司。"
  npc_override_ba_maison_quests_17_2_all_right_39e51b: "好的……"
  npc_override_ba_maison_quests_17_2_all_right_441c8d: "好的。"
  npc_override_ba_maison_quests_17_2_all_right_all_right_whet_4311ce: "好了，好了。无论是复仇剧还是爱情小说，我们应该先制作解药，等你好转后再谈。"
  npc_override_ba_maison_quests_17_2_all_right_give_leaves_si_73a502: "好的。把希尔瓦·帕皮拉的叶子给我。"
  npc_override_ba_maison_quests_17_2_all_right_i_won_t_3e5024: "好吧。我不会上你的挑衅。但我要问你一件事。"
  npc_override_ba_maison_quests_17_2_all_right_over_there_c0552b: "好的，在那边！"
  npc_override_ba_maison_quests_17_2_all_sudden_b57acc: "突然？"
  npc_override_ba_maison_quests_17_2_all_you_boil_water_well_6ff3dc: "你只需要把水烧开就好。"
  npc_override_ba_maison_quests_17_2_almond_didn_t_understand_cb5bc4: "阿尔蒙德没听懂斯威蒂说的一半内容。"
  npc_override_ba_maison_quests_17_2_alpha_asked_me_bring_s_3ba52d: "阿尔法让我把它的'核心'带来。"
  npc_override_ba_maison_quests_17_2_alpha_busy_right_now_65af87: "阿尔法现在很忙。"
  npc_override_ba_maison_quests_17_2_alpha_going_some_more_re_0a5dbd: "阿尔法还要去飞艇机库做一些研究，你去那里看看吧。"
  npc_override_ba_maison_quests_17_2_alpha_said_sweety_s_body_220306: "阿尔法说斯威蒂的身体基础和我们一样。"
  npc_override_ba_maison_quests_17_2_alpha_said_we_fix_anythi_864999: "阿尔法说我们可以修复任何损坏的东西，但有更大的问题……"
  npc_override_ba_maison_quests_17_2_alpha_said_we_use_force_d0d41a: "阿尔法说我们必须对那样的自动人偶使用武力。"
  npc_override_ba_maison_quests_17_2_alpha_too_busy_come_no_a3d231: "阿尔法太忙了来不了？不可能。哦，你是想自愿帮我吗？真是少见的客人。说起来，以前也有^0000CD那样的客人^000000。"
  npc_override_ba_maison_quests_17_2_alright_as_mercenary_who_fd8293: "好吧，^0000CD作为瓦尔蒙特的客人来到这里的佣兵！！！^000000"
  npc_override_ba_maison_quests_17_2_also_146dab: "这也……"
  npc_override_ba_maison_quests_17_2_also_1aca05: "还有……"
  npc_override_ba_maison_quests_17_2_also_being_hated_such_cu_795c49: "被如此可爱、聪明的自动人偶讨厌……也不赖。"
  npc_override_ba_maison_quests_17_2_also_help_us_broken_auto_608693: "这也帮助我们处理在宅邸里游荡的损坏自动人偶。请处理任何在宅邸里游荡的损坏贝塔，并把它的通讯芯片带来。"
  npc_override_ba_maison_quests_17_2_also_help_us_broken_auto_915714: "这也帮助我们处理在宅邸里游荡的损坏自动人偶。请处理任何在宅邸里游荡的损坏贝塔，并把它的通讯芯片带来。"
  npc_override_ba_maison_quests_17_2_also_if_you_need_help_769224: "另外，如果您需要清理帮助或有关宅邸内入侵者的信息，我们将全力配合。"
  npc_override_ba_maison_quests_17_2_also_order_us_job_correc_13c8a2: "另外，为了让我们正确执行工作，最好不仅和我们一起，也和总统的人一起行动。"
  npc_override_ba_maison_quests_17_2_also_s_much_please_accep_423ed1: "另外，不多但请接受这份道歉礼。"
  npc_override_ba_maison_quests_17_2_also_s_small_amount_i_c1d0a6: "另外，虽然不多但我会给你一些餐券。我是从这里的自动人偶那里得到的。"
  npc_override_ba_maison_quests_17_2_also_we_t_risk_our_a2ea97: "另外，我们不能让客人冒这样的风险。"
  npc_override_ba_maison_quests_17_2_also_what_goverment_hopi_94ca00: "这也是政府所希望的。"
  npc_override_ba_maison_quests_17_2_also_while_your_way_plea_66e94c: "另外，在路上，请去花园捡起损坏自动人偶的'核心'。"
  npc_override_ba_maison_quests_17_2_although_looks_complex_w_371713: "虽然从表面上看很复杂，但其实并不复杂，因为一切都是按照分类来组织的。"
  npc_override_ba_maison_quests_17_2_although_s_repaired_upon_0096f8: "虽然一经发现就会修复，但这是一个持续发生的问题。所需的通讯芯片供应难以满足。"
  npc_override_ba_maison_quests_17_2_although_we_still_don_t_e0fdee: "虽然我们仍然不知道主人的3号收藏品下落，但我们需要继续收集这里传来的信息……"
  npc_override_ba_maison_quests_17_2_althought_he_master_gran_3632b1: "尽管主人已经准许您使用浴场，并且如您所说一直很慷慨，但您也应该对此表示一些诚意。"
  npc_override_ba_maison_quests_17_2_ammunition_fighting_isn_198c8e: "弹药战斗不适合通常待在海底的人。所以你最好向这边的冒险者求助，而不是我们。"
  npc_override_ba_maison_quests_17_2_among_what_you_said_most_d85882: "在你所说的话中，最可疑的是入侵者的行动。"
  npc_override_ba_maison_quests_17_2_another_person_they_part_c63d8c: "另一个人。他们是你们队伍的吗？"
  npc_override_ba_maison_quests_17_2_another_suspicious_trace_7bf90e: "在宅邸附近发现了另一处可疑痕迹。"
  npc_override_ba_maison_quests_17_2_any_guess_357f77: "有什么猜测吗？"
  npc_override_ba_maison_quests_17_2_any_record_incidents_acc_0d7d89: "任何事故和事件的记录。"
  npc_override_ba_maison_quests_17_2_any_record_mercenaries_b_347151: "任何关于佣兵的记录都是线索。"
  npc_override_ba_maison_quests_17_2_anyway_alpha_said_we_dea_e3c4ca: "不管怎样，阿尔法说，我们必须处理那些无法识别识别码的自动机器人，并回收核心。"
  npc_override_ba_maison_quests_17_2_anyway_future_let_me_kno_627980: "不管怎样，以后如果你有时间就告诉我。"
  npc_override_ba_maison_quests_17_2_anyway_i_fix_repeater_le_8024e9: "不管怎样，我得修中继器。让我看看……"
  npc_override_ba_maison_quests_17_2_anyway_i_m_going_get_a806c0: "不管怎样，我不会再和那些白痴搅在一起了。我保证。"
  npc_override_ba_maison_quests_17_2_anyway_if_we_lot_guests_852e7f: "不管怎样，如果我们有很多客人，他们很快就要来吃饭了。我得准备一下。我已经很久没招待过客人了。"
  npc_override_ba_maison_quests_17_2_anyway_let_me_know_if_928a0e: "不管怎样，如果你有时间就告诉我。"
  npc_override_ba_maison_quests_17_2_anyway_machine_such_curi_618713: "不管怎样，有如此好奇心的机器，真是迷人。我想更多地了解你的思维方式。"
  npc_override_ba_maison_quests_17_2_anyway_please_get_me_som_1ca039: "不管怎样，请在我试图宰这家伙的时候帮我弄一些需要的材料。这家伙叫什么来着，艾森？"
  npc_override_ba_maison_quests_17_2_anyway_s_really_suspicio_3e89f9: "不管怎样，真的很可疑。到底发生了什么事？"
  npc_override_ba_maison_quests_17_2_anyway_thank_you_checkin_dc27a6: "不管怎样，谢谢你的查看。吃些饼干吧。据说很好吃。这是一种滋养花园里动植物的饼干，但客人们也很喜欢我给他们的。"
  npc_override_ba_maison_quests_17_2_anyway_who_intruder_041f8d: "不管怎样，谁……？入侵者？……不是吗？"
  npc_override_ba_maison_quests_17_2_anyways_apart_terrible_s_b62b95: "不管怎样，除了那个可怕的故事……你在这里救了我……"
  npc_override_ba_maison_quests_17_2_anyways_exploded_while_i_8f1127: "不管怎样，它在我工作的时候爆炸了，另一个自动人偶被烧毁了。也许是那个自动人偶。"
  npc_override_ba_maison_quests_17_2_anyways_you_thank_you_ge_46029f: "不管怎样，你，{0}。谢谢你帮我弄到了解药。"
  npc_override_ba_maison_quests_17_2_appears_collecting_repor_998cb4: "它似乎正在收集来自外部的报告……"
  npc_override_ba_maison_quests_17_2_apply_battle_a70149: "申请战斗。"
  npc_override_ba_maison_quests_17_2_area_where_laboratory_se_363499: "这个区域是实验室污水排放的地方，皮肤接触或摄入都非常危险，会导致立即死亡，所以我们建议大家远离。"
  npc_override_ba_maison_quests_17_2_aren_t_you_middle_operat_b66259: "你不是正在执行任务吗？"
  npc_override_ba_maison_quests_17_2_aren_t_you_one_who_7112b7: "你不就是在我们以为都要死的时候救了我们的那个人吗？"
  npc_override_ba_maison_quests_17_2_argh_my_hand_f82dee: "啊！！！！我的手！！"
  npc_override_ba_maison_quests_17_2_argh_what_hell_i_almost_a1c99a: "啊！这到底是什么？我差点死了！真不敢相信你用这么可爱的方式做到了。你全身都湿透了！"
  npc_override_ba_maison_quests_17_2_around_navi_here_info_ra_8c2f1d: "在<NAVI>[这里]<INFO>rachel,182,176,0,101,0</INFO></NAVI>附近。"
  npc_override_ba_maison_quests_17_2_as_always_you_did_great_1e13b5: "一如既往，你做得很好。"
  npc_override_ba_maison_quests_17_2_as_expected_0c29c3: "不出所料……"
  npc_override_ba_maison_quests_17_2_as_expected_heart_hunter_7257d8: "不愧是心猎团……"
