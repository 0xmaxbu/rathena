  npc_override_ba_maison_quests_17_2_you_hid_like_rats_you_213e76: "你们像老鼠一样躲藏，在夜间秘密行动，对吗？"
  npc_override_ba_maison_quests_17_2_you_human_before_right_e168b5: "你以前是人类，对吗？"
