  npc_override_ba_maison_quests_17_2_i_need_more_information_ecfe9d: "我需要更多关于身体的信息。"
  npc_override_ba_maison_quests_17_2_i_need_remember_what_i_88571d: "- 我需要仔细记住我听到的内容。-"
  npc_override_ba_maison_quests_17_2_i_need_some_time_i_ffa32c: "……我需要一些时间，我有想检查的东西。"
  npc_override_ba_maison_quests_17_2_i_need_support_there_s_9cc9ac: "我需要支援。7区有入侵者，完毕。"
  npc_override_ba_maison_quests_17_2_i_need_you_collect_more_75487d: "我需要你收集超过10个损坏的自动人偶核心……"
  npc_override_ba_maison_quests_17_2_i_never_been_mansion_lik_af84a0: "我从未在这样的宅邸里待过。"
  npc_override_ba_maison_quests_17_2_i_never_forget_your_kind_c59565: "我永远不会忘记你的善意……"
  npc_override_ba_maison_quests_17_2_i_never_thought_i_d_99b802: "我从没想过我会在这里使用陷阱。我很高兴我带来了它。"
  npc_override_ba_maison_quests_17_2_i_no_choice_use_method_f99984: "我别无选择，只能使用这个方法。"
  npc_override_ba_maison_quests_17_2_i_only_one_recognized_am_157146: "我是那群白痴中唯一被认可的！"
