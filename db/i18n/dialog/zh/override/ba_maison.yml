  npc_override_ba_maison_quests_17_2_boiler_move_sometimes_it_b4b2a9: "这个锅炉有时会在没有人使用的情况下自己运转，但我认为过去自动人偶的数据残留下来，继续执行命令。"
  npc_override_ba_maison_quests_17_2_boiler_ripped_apart_stol_ce8dbc: "锅炉被拆散偷走，管道被破坏，自动人偶被拆解。其他人说不知道需要多长时间才能恢复。宅邸其他地方的情况也差不多，整个宅邸都处于这种困境中。"
