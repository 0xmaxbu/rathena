  npc_override_ba_maison_quests_17_2_s_really_fate_meet_you_4f9155: "真的命中注定，在这样的地方再次遇见你！！！"
  npc_override_ba_maison_quests_17_2_s_reasonable_way_who_wit_d3c9d0: "这是个合理的方法。但谁来见证呢？"
  npc_override_ba_maison_quests_17_2_s_right_s_right_oh_cc5e5b: "没错！没错！哦，我该怎么办？我该怎么办，我该怎么办？安全？哦，是的。我被告知要叫保安。"
  npc_override_ba_maison_quests_17_2_s_right_s_time_you_9c80f2: "没错。又是你玩得开心的时候了。我很高兴能再次这样帮助你。"
  npc_override_ba_maison_quests_17_2_s_s_all_broken_up_66f1e4: "它……它全部坏了。"
  npc_override_ba_maison_quests_17_2_s_s_no_what_i_d5f273: "它……它……不，我不是那个意思……不是我不想在我的人民面前露面。"
  npc_override_ba_maison_quests_17_2_s_said_commissioner_didn_ebf11b: "据说专员被派出去后没有回来，专员后来被推测为失踪人员。"
  npc_override_ba_maison_quests_17_2_s_said_science_technolog_914747: "据说科学技术只是在维护他建立的基础，但他们无法实施他研究中没有数据的东西。"
  npc_override_ba_maison_quests_17_2_s_same_when_you_brought_4a5d24: "当你给我们带来新文件时也是一样，你在撒谎！"
  npc_override_ba_maison_quests_17_2_s_scary_valve_here_think_9e73c0: "很可怕。这里的阀门以为它只是个锅炉。可怕吗？阀门，看这里。"
  npc_override_ba_maison_quests_17_2_s_second_horsepower_plan_7e4579: "它来自第二马力发电厂……我们收集的……它是一种……干扰无线电波的芯片……"
  npc_override_ba_maison_quests_17_2_s_shame_521297: "这是一种耻辱……"
  npc_override_ba_maison_quests_17_2_s_signed_recipient_h_luc_a10d2c: "收件人签名是'H·卢肯贝格'"
  npc_override_ba_maison_quests_17_2_s_smart_move_rookie_97f6d6: "聪明的一步，菜鸟。"
