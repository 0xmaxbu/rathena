  npc_override_ba_maison_quests_17_2_we_re_also_tracking_wher_5fc2aa: "我们也在追踪你的收藏品#3的下落。"
  npc_override_ba_maison_quests_17_2_we_re_disappointed_you_y_abe5b4: "我们对你很失望！你和我们在一起这么久了还不知道，怎么。"
  npc_override_ba_maison_quests_17_2_we_re_experts_field_caef3a: "我们是这个领域的专家。"
  npc_override_ba_maison_quests_17_2_we_re_finally_here_db32cc: "我们终于到了。"
  npc_override_ba_maison_quests_17_2_we_re_going_investigate_b8da68: "我们要去调查飞艇机库。"
  npc_override_ba_maison_quests_17_2_we_re_going_retrieve_cor_54a06e: "我们要去取回阿尔法所说的被黑客攻击的管理者的核心。"
  npc_override_ba_maison_quests_17_2_we_re_hour_surveillance_2a2a2b: "我们24小时监控。"
  npc_override_ba_maison_quests_17_2_we_requesting_collection_9f0a92: "我们正在请求收集宅邸周围的守护者零件残余，它最近似乎遭到攻击，正在危害宅邸的居住环境。"
  npc_override_ba_maison_quests_17_2_we_should_focus_searchin_3d4b3d: "我们应该专注于搜索危险物品而不是失踪人员。危险生物的身份尚未揭示，各种证词和情况推测它是人类、怪物、自动人偶和超自然生物。"
  npc_override_ba_maison_quests_17_2_we_should_investigate_in_d8d9c0: "我们应该正确调查这个事件并抓住罪魁祸首。"
  npc_override_ba_maison_quests_17_2_we_should_talk_more_care_ca23e4: "我们应该更仔细地谈。"
  npc_override_ba_maison_quests_17_2_we_still_haven_t_resolve_a7ccd6: "我们仍未解决入侵者的问题。从非人类的角度来看，这似乎很难解决，因为有很多部分信息不足。"
  npc_override_ba_maison_quests_17_2_we_t_clean_up_because_5997b0: "我们无法清理，因为还有更多，毒液、瀑布和痉挛~"
  npc_override_ba_maison_quests_17_2_we_t_distinguish_s_just_1859f3: "我们无法区分。这只是数据收集。你说的每一句话和每一个动作都是我们收集的数据。"
  npc_override_ba_maison_quests_17_2_we_t_feel_things_humans_6dfcfc: "我们无法感受人类能感受的东西。我甚至感觉不到我手的末端。"
  npc_override_ba_maison_quests_17_2_we_t_give_intruders_same_9407b4: "我们不能给入侵者和客人同样的好处。"
  npc_override_ba_maison_quests_17_2_we_t_keep_throne_empty_264a8f: "我们不能让王位空太久。"
  npc_override_ba_maison_quests_17_2_we_t_return_risks_like_79bf54: "我们不能带着这样的风险回去。我们必须做一些研究……"
  npc_override_ba_maison_quests_17_2_we_think_there_must_some_2d0fd6: "我们认为一定遗漏了什么，因为我们无法像人类客人一样听到声音或感觉到迹象。"
  npc_override_ba_maison_quests_17_2_we_told_cooperate_automa_44f66c: "我们被告知要尽可能配合宅邸的自动人偶。但如果你最终不动，我们别无选择，只能使用武力，对吗？"
  npc_override_ba_maison_quests_17_2_we_use_network_share_inf_645a5e: "我们使用那个网络在瞬间与宅邸里的每个自动人偶共享信息。"
  npc_override_ba_maison_quests_17_2_we_used_substitute_plan_60b250: "我们使用了替代计划，我们的伤亡比应有的要多。"
  npc_override_ba_maison_quests_17_2_we_ve_found_gonie_we_2ea319: "我们找到戈尼了，我们已经确认浴池没有危险，所以我们走吧。"
  npc_override_ba_maison_quests_17_2_we_ve_got_leaves_silva_1f4128: "我们已经得到了西尔瓦·帕皮拉的叶子，所以我要请人制作解药。"
