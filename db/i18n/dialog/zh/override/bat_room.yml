Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_bat_room_bg_common_after_you_lose_some_weig_0f3785: "- 等你减轻一些负重后再来吧。-"
  npc_override_bat_room_bg_common_believes_peaceful_co_exi_173f49: "并相信与其他国家和平共处。"
  npc_override_bat_room_bg_common_blessed_croix_e4a924: "克鲁瓦万岁！"
  npc_override_bat_room_bg_common_blessed_guillaume_185487: "纪尧姆万岁！"
  npc_override_bat_room_bg_common_check_more_information_a_8cd67d: "如需查看奖励道具的更多信息，请使用我们的^3131FF目录^000000。"
  npc_override_bat_room_bg_common_command_been_cancelled_bb0d0b: "命令已取消。"
  npc_override_bat_room_bg_common_complete_1f5a1a: "完成"
  npc_override_bat_room_bg_common_currently_you_re_carryin_73594b: "- 你当前的负重是 -"
  npc_override_bat_room_bg_common_even_though_we_didn_t_1e84c1: "即使我们没有获胜，我们也尽了最大努力。"
  npc_override_bat_room_bg_common_following_armors_availab_cd8ff9: "以下防具可用战场徽章兑换。"
  npc_override_bat_room_bg_common_following_items_availabl_3a2d2a: "以下道具可在^3131FF法杖/权杖/双手斧/风魔手里剑^000000类别中找到。"
  npc_override_bat_room_bg_common_following_items_availabl_d1226a: "以下道具可在^3131FF短剑、单手剑、双手剑和双手矛^000000类别中找到。"
  npc_override_bat_room_bg_common_following_weapons_availa_00bd1a: "以下武器可在^3131FF书/拳套^000000类别中找到。"
  npc_override_bat_room_bg_common_following_weapons_availa_29e55f: "以下武器可在^3131FF弓/拳刃/乐器/鞭子^000000类别中找到。"
  npc_override_bat_room_bg_common_following_weapons_availa_64299e: "以下武器可用战场徽章兑换。"
  npc_override_bat_room_bg_common_following_weapons_availa_9a4ef6: "以下武器可在^3131FF左轮手枪/步枪/加特林枪/霰弹枪/榴弹发射器^000000类别中找到。"
  npc_override_bat_room_bg_common_general_guillaume_may_ad_32736c: "纪尧姆将军作为马罗尔的伟大将军，在这场战斗中可能占有优势，但这并不意味着他一定会获胜。"
  npc_override_bat_room_bg_common_good_day_adventurer_756b47: "你好，冒险者。"
  npc_override_bat_room_bg_common_he_s_too_ignorant_admit_09ce20: "他太无知了，不承认所谓的和平是建立在无数牺牲的生命之上的，而普通公民和上层阶级可以对此一无所知，继续过着他们那种生活。"
  npc_override_bat_room_bg_common_he_s_too_naive_understan_8c9dbe: "他太天真了，无法理解现实……"
  npc_override_bat_room_bg_common_he_thinks_all_national_m_8a57d7: "他认为一个国家的所有事务都可以在办公桌上讨论和决定，"
  npc_override_bat_room_bg_common_his_majesty_declared_he_5cff6a: "陛下已宣布，在他9个儿子中，他已选择我或克鲁瓦王子作为下一任国王。"
  npc_override_bat_room_bg_common_his_majesty_declared_he_86c73f: "陛下已宣布，他将把马罗尔的未来交给我或三王子纪尧姆将军。"
  npc_override_bat_room_bg_common_his_unrealistic_beliefs_19d3ca: "他不切实际的信念将使这个国家陷入贫困，使人民变得软弱。如果他成为国王，马罗尔将永远无法摆脱其他国家的攻击。"
  npc_override_bat_room_bg_common_hot_blooded_adventurer_w_978133: "热血的冒险者，我们需要你的能力来赢得这场战斗。"
  npc_override_bat_room_bg_common_how_you_like_lend_your_f852a5: "你愿意将力量借给马罗尔王国的一位王子吗？"
  npc_override_bat_room_bg_common_however_just_battle_betw_97c102: "然而，这不仅仅是我们之间的战斗。这场战斗将决定这个国家的未来。"
  npc_override_bat_room_bg_common_i_believe_weapons_aren_t_e93088: "我相信武器不是给国家带来繁荣的最佳方式。"
  npc_override_bat_room_bg_common_i_exchange_bravery_badge_b5010a: "我可以用勇气徽章和英勇徽章兑换奖励道具。"
  npc_override_bat_room_bg_common_i_ll_always_stationed_he_7163c1: "我会一直驻守在这里招募更多士兵。如果你有兴趣，随时欢迎回来。"
  npc_override_bat_room_bg_common_i_ll_here_whenever_you_4367ea: "无论何时你需要我的服务，我都会在这里。"
  npc_override_bat_room_bg_common_i_ll_one_who_capture_456bf6: "我将成为夺取旗帜的人！"
  npc_override_bat_room_bg_common_i_m_knight_far_country_04702a: "我是来自遥远国度马罗尔王国的骑士。"
  npc_override_bat_room_bg_common_i_m_sorry_you_don_9924a1: "抱歉，你的徽章不足以兑换。"
  npc_override_bat_room_bg_common_i_m_sure_they_ll_8fc6e5: "我相信他们会全心全意欢迎你的！"
  npc_override_bat_room_bg_common_i_pledge_my_honor_prove_5d672e: "我以荣誉起誓，证明我是能够保护马罗尔免受外来威胁的人。"
  npc_override_bat_room_bg_common_i_t_leave_maroll_someone_52e9af: "我不能把马罗尔交给一个活在梦中的人！"
  npc_override_bat_room_bg_common_i_want_teach_him_what_0c0266: "我想教他是什么让这个小小的国家如此强大和繁荣。那就是军事力量！"
  npc_override_bat_room_bg_common_i_want_win_battle_so_18521f: "我想赢得这场战斗，以便给马罗尔的人民带来繁荣。他们已经受够了战争的苦难……"
  npc_override_bat_room_bg_common_i_wish_shed_blood_i_080a3f: "我不愿流血，但为了和平的可能性，为了我的人民，我别无选择，只能战斗。"
  npc_override_bat_room_bg_common_item_acolyte_class_only_e313b1: "此道具仅限服事系职业使用。"
  npc_override_bat_room_bg_common_item_archer_class_only_f63082: "此道具仅限弓箭手系职业使用。"
  npc_override_bat_room_bg_common_item_gunslinger_only_70fc94: "此道具仅限神枪手使用。"
  npc_override_bat_room_bg_common_item_magician_class_only_98c163: "此道具仅限魔法师系职业使用。"
  npc_override_bat_room_bg_common_item_merchant_class_only_3b8b7d: "此道具仅限商人系职业使用。"
  npc_override_bat_room_bg_common_item_swordman_taekwon_ma_f3bc5b: "此道具仅限剑士和跆拳道宗师系职业使用。"
  npc_override_bat_room_bg_common_item_thief_class_only_646e04: "此道具仅限盗贼系职业使用。"
  npc_override_bat_room_bg_common_just_take_defeat_as_less_d631fe: "把这次失败当作教训，下次你一定会赢。"
  npc_override_bat_room_bg_common_let_s_enjoy_our_glorious_6f60b2: "让我们享受我们辉煌的胜利吧！"
  npc_override_bat_room_bg_common_maroll_e80f2c: "为了马罗尔！"
  npc_override_bat_room_bg_common_maroll_s_great_king_marc_a53cba: "马罗尔的伟大国王，马塞尔·马罗洛七世，最近病得很重。"
  npc_override_bat_room_bg_common_may_i_help_you_5a540b: "有什么可以帮你的吗？"
  npc_override_bat_room_bg_common_may_war_god_bless_you_1b5a7c: "愿战神保佑你。"
  npc_override_bat_room_bg_common_menu_bravery_121a6e: "勇气徽章:英勇徽章:取消"
  npc_override_bat_room_bg_common_menu_close_bdff63: "关闭战场:开放战场:重置 a01:重置 b01:重置 a02:重置 b02"
  npc_override_bat_room_bg_common_menu_dagger_448f14: "短剑/单手剑/双手剑/双手矛:法杖/权杖/双手斧/风魔手里剑:弓/拳刃/乐器/鞭子:书/拳套:左轮手枪/步枪/加特林枪/霰弹枪/榴弹发射器"
  npc_override_bat_room_bg_common_menu_do_9f79c1: "不兑换:兑换"
  npc_override_bat_room_bg_common_menu_exchange_561c29: "兑换徽章:查看目录"
  npc_override_bat_room_bg_common_menu_garments_256c74: "披风/鞋子:防具"
  npc_override_bat_room_bg_common_menu_i_5365e7: "我想加入你的军队！:结束对话"
  npc_override_bat_room_bg_common_menu_join_85e35c: "加入:不加入"
  npc_override_bat_room_bg_common_menu_leave_826a44: "离开:不离开"
  npc_override_bat_room_bg_common_menu_the_d89943: "以下消耗品道具可用战场徽章兑换："
  npc_override_bat_room_bg_common_menu_unfortunately_1bcc6d: "不幸的是，他和他的追随者们不知道一件事："
  npc_override_bat_room_bg_common_menu_weapon_360266: "武器:防具:饰品:消耗品"
  npc_override_bat_room_bg_common_menu_what_756816: "战斗的原因是什么？:告诉我关于克鲁瓦王子的事"
  npc_override_bat_room_bg_common_menu_what_9a4f17: "战斗的原因是什么？:告诉我关于纪尧姆将军的事"
  npc_override_bat_room_bg_common_menu_yes_141459: "是:否"
  npc_override_bat_room_bg_common_menu_yes_6a62b7: "是的，我想加入你。:结束对话"
  npc_override_bat_room_bg_common_menu_you_6286b9: "你可以根据职业类别用徽章兑换荣誉勋章，如下所示："
  npc_override_bat_room_bg_common_now_go_upstairs_apply_ba_7a39f2: "现在，上楼去找你的同伴申请战斗。"
  npc_override_bat_room_bg_common_now_go_upstairs_apply_ba_ba8434: "现在，上楼去找你的同伴申请战斗。"
  npc_override_bat_room_bg_common_now_please_go_downstairs_ce04c2: "现在，请下楼加入你的同伴，磨练技能以对抗敌人！"
  npc_override_bat_room_bg_common_oh_don_t_sad_36c9b5: "哦，{0} 别难过。"
  npc_override_bat_room_bg_common_our_great_king_marcel_ma_5fb622: "我们伟大的国王，马塞尔·马罗洛七世，最近病得很重。"
  npc_override_bat_room_bg_common_people_maroll_really_wan_b8708d: "马罗尔的人民真的希望他们在军事力量上花费这么多钱吗？"
  npc_override_bat_room_bg_common_please_note_items_braver_9a214d: "请注意，^3131FF勇气徽章标记为(BB)^000000，^3131FF英勇徽章标记为(VB)^000000。"
  npc_override_bat_room_bg_common_please_try_again_cefdd7: "- 请重试 -"
  npc_override_bat_room_bg_common_rd_prince_guillaume_grea_196d25: "三王子纪尧姆是马罗尔的伟大将军。"
  npc_override_bat_room_bg_common_remember_battleground_re_3b743a: "请记住，战场奖励道具是^FF0000角色绑定^000000的。你确定要这个道具吗？"
  npc_override_bat_room_bg_common_reward_your_great_dedica_504653: "这是纪尧姆·马罗洛对你巨大贡献的奖励！"
  npc_override_bat_room_bg_common_royal_gift_croix_please_8cba0c: "这是来自克鲁瓦的皇家礼物，请不要忘记这场战斗。我们下次会赢的。"
  npc_override_bat_room_bg_common_s_waste_time_explain_you_747b6d: "向你解释他是一位多么伟大的领袖或统帅是浪费时间，因为他指挥着马罗尔的强大军事力量。"
  npc_override_bat_room_bg_common_th_prince_croix_currentl_a9d717: "五王子克鲁瓦目前担任马罗尔的首相。"
  npc_override_bat_room_bg_common_thank_you_exchanging_08526a: "感谢兑换。"
  npc_override_bat_room_bg_common_thank_you_so_much_i_ee979d: "非常感谢。有像你这样的冒险者帮助，我感觉我们能赢。"
  npc_override_bat_room_bg_common_too_many_items_you_fc968e: "- 你携带的物品太多了 -"
  npc_override_bat_room_bg_common_two_kings_t_share_nation_99f356: "两个国王不能共享一个国家！只有从陛下指定的战斗中获胜的人才能登基。"
  npc_override_bat_room_bg_common_two_princes_kingdom_now_4988ea: "王国的两位王子正在为马罗尔的王位而战，需要像你这样经验丰富的士兵。"
  npc_override_bat_room_bg_common_wait_minute_17efa5: "- 等一下！！ -"
  npc_override_bat_room_bg_common_we_many_items_so_please_cf3fc0: "我们有很多道具，请仔细看看并慎重购买。"
  npc_override_bat_room_bg_common_we_suffered_enough_wars_3e8bae: "我们已经受够了战争的苦难。"
  npc_override_bat_room_bg_common_welcome_my_army_comrade_94c0ed: "欢迎来到我的军队，战友。"
  npc_override_bat_room_bg_common_which_badge_you_want_exc_273aa4: "你想兑换哪种徽章？"
  npc_override_bat_room_bg_common_which_type_items_you_lik_9b9411: "你想兑换哪种类型的道具？"
  npc_override_bat_room_bg_common_wise_adventurer_why_don_d687c8: "明智的冒险者，你为什么不借给我们力量来取得胜利呢？"
  npc_override_bat_room_bg_common_you_battlefield_badges_cef6e8: "你有战场徽章吗？"
  npc_override_bat_room_bg_common_you_cancelled_exchange_5e53e3: "你取消了兑换。"
  npc_override_bat_room_bg_common_you_chose_47e04c: "你选择了^3131FF{0}{1}^000000。"
  npc_override_bat_room_bg_common_you_chose_968f15: "你选择了^3131FF{0}^000000。"
  npc_override_bat_room_bg_common_you_chose_accessory_5f0014: "你选择了^3131FF饰品^000000。"
  npc_override_bat_room_bg_common_you_chose_armor_dfb901: "你选择了^3131FF防具^000000。"
  npc_override_bat_room_bg_common_you_chose_consumable_68f042: "你选择了^3131FF消耗品^000000。"
  npc_override_bat_room_bg_common_you_chose_weapon_560ed9: "你选择了^3131FF武器^000000。"
  npc_override_bat_room_bg_common_you_enough_s_ddea7c: "你的{0}不足。"
  npc_override_bat_room_bg_common_you_exchange_item_73b677: "你可以用^FF0000100 {0}^000000兑换此道具。"
  npc_override_bat_room_bg_common_you_exchange_item_d6b2ff: "你可以用^FF0000{0} {1} 或 {2} {3}^000000兑换此道具。"
  npc_override_bat_room_bg_common_you_like_exchange_41de54: "你想兑换吗？"
  npc_override_bat_room_bg_common_you_like_spend_receive_b3c83d: "你想花费^FF0000100 {0}^000000并获得^3131FF{1}{2}^000000吗？"
  npc_override_bat_room_bg_common_you_lost_you_re_dedicate_a06b07: "你输了，但你对这场战斗非常投入。"
  npc_override_bat_room_bg_common_you_need_badges_exchange_6f4787: "你需要^3131FF{0} 徽章^000000来兑换。"
  npc_override_bat_room_bg_common_you_need_more_time_check_40ce1c: "你需要更多时间查看道具吗？"
  npc_override_bat_room_bg_common_you_sent_back_b4d8b5: "你将被传送回{0}。"
  npc_override_bat_room_bg_common_you_wish_leave_battlefie_ddd8ef: "你想离开战场吗？使用我的服务返回城镇。"
  npc_override_bat_room_bg_common_your_eyes_tell_me_you_2624f1: "你的眼神告诉我，你是我可以信任的战士。"
  npc_override_bat_room_flavius_enter_after_you_lose_some_weig_0f3785: "- 等你减轻一些负重后再来吧。-"
  npc_override_bat_room_flavius_enter_crystals_both_armies_pro_f30fa3: "双方军队的水晶都受到特殊路障的保护，无法通过直接攻击摧毁。"
  npc_override_bat_room_flavius_enter_crystals_immune_every_ty_1361d9: "水晶对所有类型的技能免疫；物理攻击是你摧毁敌方水晶的唯一选择。"
  npc_override_bat_room_flavius_enter_currently_you_re_carryin_73594b: "- 你当前的负重是 -"
  npc_override_bat_room_flavius_enter_elite_corps_already_stan_fb8a8a: "一支精锐部队已经待命，准备被派遣到战场。"
  npc_override_bat_room_flavius_enter_go_show_croixs_what_fear_8f5352: "去让那些克鲁瓦知道什么是真正的恐惧！"
  npc_override_bat_room_flavius_enter_go_show_guillaumes_what_bfc2c1: "去让那些纪尧姆知道什么是真正的恐惧！"
  npc_override_bat_room_flavius_enter_i_ve_received_report_inf_34065a: "我收到报告，一支精锐部队已经被派遣到战场与克鲁瓦作战。"
  npc_override_bat_room_flavius_enter_i_ve_received_report_inf_fbbd7a: "我收到报告，一支精锐部队已经被派遣到战场与纪尧姆作战。"
  npc_override_bat_room_flavius_enter_if_you_ready_start_click_732290: "如果你准备好了，请点击^0000FF界面上的战斗按钮^000000开始。"
  npc_override_bat_room_flavius_enter_let_s_show_guillaumes_po_eaac80: "让我们向那些臭纪尧姆展示克鲁瓦军队的力量！"
  npc_override_bat_room_flavius_enter_let_s_show_power_croix_ed24d2: "让我们向那些臭纪尧姆展示克鲁瓦军队的力量！"
  npc_override_bat_room_flavius_enter_let_s_show_power_guillau_cbf6d8: "让我们向那些臭克鲁瓦展示纪尧姆军队的力量！"
  npc_override_bat_room_flavius_enter_menu_i_5365e7: "我想加入你的军队！:结束对话"
  npc_override_bat_room_flavius_enter_menu_i_8f121e: "我很高兴你想加入我们对抗克鲁瓦军队，但抱歉：我不能派像你这样的新手去残酷的战场送死。"
  npc_override_bat_room_flavius_enter_menu_i_f28e45: "我很高兴你想加入我们对抗纪尧姆军队，但抱歉：我不能派像你这样的新手去残酷的战场送死。"
  npc_override_bat_room_flavius_enter_menu_please_c78233: "请记住：当你参加战斗时，你会收到一个令牌，指示你在一定时间内不能参加同类型的战斗。"
  npc_override_bat_room_flavius_enter_objective_flavius_battle_16626f: "弗拉维乌斯战斗的目标是在敌方摧毁你的水晶之前，通过摧毁他们的水晶获得 2 分。"
  npc_override_bat_room_flavius_enter_please_bear_mind_once_yo_c69bc9: "请注意，一旦取消，^0000FF你在 1 分钟内不得重新申请^000000！"
  npc_override_bat_room_flavius_enter_please_try_again_cefdd7: "- 请重试 -"
  npc_override_bat_room_flavius_enter_s_too_early_you_go_950e4e: "现在回去还太早。去休息吧，把敌人留给我们！"
