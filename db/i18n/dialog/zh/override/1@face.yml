Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@face_FacewormsNest_actual_time_battle_stage_670e12: "本阶段战斗的剩余实际时间为{0}。"
  npc_override_1@face_FacewormsNest_anyway_we_got_married_wh_5c0728: "总之，我们到了适婚年龄就结婚了。他总是为买不起戒指给我而道歉。"
  npc_override_1@face_FacewormsNest_anyways_i_activate_passa_34156c: "总之，如果你是队伍领袖，我可以为你激活通道。"
  npc_override_1@face_FacewormsNest_been_years_since_we_marr_adf430: "我们结婚已经40年了，他仍然说^0000ff'亲爱的~你想要一枚戒指吗？'^000000。"
  npc_override_1@face_FacewormsNest_best_time_belongs_advent_600059: "最佳纪录属于冒险者^ff0044{0}^000000{1}。"
  npc_override_1@face_FacewormsNest_big_one_just_right_befor_6ed6cd: "就在刚才的那个大的……"
  npc_override_1@face_FacewormsNest_big_one_just_right_befor_f17c34: "刚才我们看到的那个大家伙是这里的首领吗？"
  npc_override_1@face_FacewormsNest_bracelet_keaton_ab181d: "这是基顿的手镯！！^000000"
  npc_override_1@face_FacewormsNest_canyon_i_am_feeling_good_1eeea2: "这个峡谷。我感觉不舒服。我不想再待在这里了。"
  npc_override_1@face_FacewormsNest_chaos_deals_deadly_damag_84cda3: "混沌造成了{0}点致命伤害！！"
  npc_override_1@face_FacewormsNest_chaos_good_friend_even_t_30c390: "混沌是个好朋友，尽管他只会使用怒爆……"
  npc_override_1@face_FacewormsNest_crack_time_safe_enough_p_1ea063: "时空裂缝还不够安全，无法来回穿越。请等效果计时器结束后再来吧。"
  npc_override_1@face_FacewormsNest_current_record_time_260e3a: "当前纪录时间为^0000ff{0}^000000。"
  npc_override_1@face_FacewormsNest_dangerous_hehehe_a0a1b3: "好危险啊。嘿嘿嘿……"
  npc_override_1@face_FacewormsNest_dark_faceworm_absorbs_en_a0a28a: "暗黑人面虫吸收了{0}个未破裂虫卵的能量，恢复了{1}点能量。"
  npc_override_1@face_FacewormsNest_dark_faceworm_dropped_sa_0e187d: "暗黑人面虫丢下了一袋致命毒药，恢复了{0}点能量。"
  npc_override_1@face_FacewormsNest_dol_seoi_standing_absent_5145bd: "多尔塞失魂落魄地握着古药丸站在那里。我们还是让他一个人静一静吧。"
  npc_override_1@face_FacewormsNest_faceworm_12be62: "人面虫？"
  npc_override_1@face_FacewormsNest_faceworm_i_ve_never_hear_9d7c81: "人面虫？我从没听说过。"
  npc_override_1@face_FacewormsNest_faceworm_queen_absorbs_e_230076: "人面虫女王吸收了{0}个未破裂的{1}的能量，恢复了{2}点能量。"
  npc_override_1@face_FacewormsNest_faceworm_queen_dropped_s_19233b: "人面虫女王丢下了一袋致命毒药，恢复了{0}点能量。"
  npc_override_1@face_FacewormsNest_faceworm_queen_trying_sh_328d0a: "人面虫女王试图蜕皮为{0}属性。"
  npc_override_1@face_FacewormsNest_faceworm_rages_recoverin_1eb486: "人面虫狂暴了，恢复了{0}点生命值，攻击力提升了。"
  npc_override_1@face_FacewormsNest_faceworm_s_nest_records_8e1679: "-- 人面虫巢穴纪录 --"
  npc_override_1@face_FacewormsNest_faceworm_time_attack_sta_e36d4a: "人面虫竞速挑战已开始。击杀速度越快，奖励比例越高。"
  npc_override_1@face_FacewormsNest_fortune_fame_important_m_08d03e: "财富和名誉都不重要。最重要的是家人。"
  npc_override_1@face_FacewormsNest_gentle_energy_surrounds_6a6a94: "^0000ff一股温和的能量环绕着塞尔吉奥。^000000"
  npc_override_1@face_FacewormsNest_giant_faceworm_suddenly_bf8881: "一只巨型人面虫突然出现了。"
  npc_override_1@face_FacewormsNest_he_begins_weep_like_woun_27a41f: "^0000ff他开始像受伤的穆卡一样哭泣。她对他一定很重要……^000000"
  npc_override_1@face_FacewormsNest_he_had_came_back_since_30234a: "他离开家去买戒指后就再也没有回来。"
  npc_override_1@face_FacewormsNest_hew_puddle_weird_85ff83: "嘿。这个水坑好奇怪。"
  npc_override_1@face_FacewormsNest_hmm_you_pretty_good_i_1d4d27: "嗯……你们挺厉害的，我 impressed。"
  npc_override_1@face_FacewormsNest_hole_appears_after_killi_cd6af5: "杀死暗黑人面虫后出现了一个洞。"
  npc_override_1@face_FacewormsNest_i_am_researching_dimensi_be3d49: "我正在研究这里的空间维度裂缝。"
  npc_override_1@face_FacewormsNest_i_am_still_living_memory_b452a4: "我仍然活在回忆中。创造更多回忆吧……"
  npc_override_1@face_FacewormsNest_i_blurry_memory_when_i_150cf7: "我依稀记得以前跟着父亲的武装商队旅行时的情景。"
  npc_override_1@face_FacewormsNest_i_feel_gentle_energy_aro_a421f8: "^0000ff我感受到多尔塞周围有一股温和的能量。^000000"
  npc_override_1@face_FacewormsNest_i_had_lost_my_family_e8905f: "那时候我失去了家人。我甚至记不清他们的面容了。"
  npc_override_1@face_FacewormsNest_i_just_stopped_town_poss_cb8b0d: "我只是顺路来到这个小镇，想找到关于我的家人和武装商队的记录，但至今一无所获。"
  npc_override_1@face_FacewormsNest_i_killed_snake_bb0306: "我杀死了一条蛇……"
  npc_override_1@face_FacewormsNest_i_know_what_about_i_e03152: "我不知道这是怎么回事，但我在跟你们的领袖说话，所以请等一下好吗？"
  npc_override_1@face_FacewormsNest_i_searched_everywhere_no_c5ca05: "我到处寻找，但没人能帮我弄到那种药丸，最终我的女主人去世了。要不是那条滑溜溜的……"
  npc_override_1@face_FacewormsNest_i_should_stopped_him_i_13dbea: "我应该阻止他的。我仍然记得他 earlier 的脸。"
  npc_override_1@face_FacewormsNest_i_told_him_what_good_a7707e: "我告诉过他……对一个老太婆来说戒指有什么用呢？"
  npc_override_1@face_FacewormsNest_i_used_get_pill_group_39edb7: "我以前从武装商队那里买药丸，但我听说他们被蛇袭击了，从那之后我就再也弄不到药丸了。"
  npc_override_1@face_FacewormsNest_i_used_servant_very_weal_867d4a: "我曾经是一位非常富有的女士的仆人。她对我一直很好，但她患有严重的咳嗽，除非服用一种特殊的药丸否则好不了。"
  npc_override_1@face_FacewormsNest_i_used_tease_his_peco_4bbb9b: "我以前经常逗他的大嘴鸟，想让他注意到我对他有意思。就这样持续了一段时间。"
  npc_override_1@face_FacewormsNest_i_vaguely_remember_every_4e916c: "我隐约记得商队的所有人在被一条巨型蛇形怪物袭击后都分散了。"
  npc_override_1@face_FacewormsNest_jeum_sun_my_darling_flow_bba5ff: "[着我的花]^000000"
  npc_override_1@face_FacewormsNest_keaton_56d3cb: "^999999[基顿]"
  npc_override_1@face_FacewormsNest_keaton_died_long_time_ag_06a236: "基顿很久以前就死了。基顿不坏。^000000"
  npc_override_1@face_FacewormsNest_keaton_glad_defeat_bad_s_2a6124: "基顿……高兴。打败坏蛇！！^000000"
  npc_override_1@face_FacewormsNest_keaton_go_after_snake_fi_7d99dc: "基顿，会追蛇去找手镯。坏蛇杀了基顿。^000000"
  npc_override_1@face_FacewormsNest_keaton_good_speaking_fdef65: "基顿……不擅长说话。^000000"
  npc_override_1@face_FacewormsNest_keaton_need_bracelet_imp_4e742e: "基顿……需要手镯，那很重要。基顿的朋友给了手镯。^000000"
  npc_override_1@face_FacewormsNest_keaton_s_soul_seems_smil_b6acf0: "基顿的灵魂似乎在微笑。最好让他尽可能获得一些安宁。"
  npc_override_1@face_FacewormsNest_keaton_seems_shine_brigh_a07e8b: "^0000ff基顿似乎变得更明亮了。^000000"
  npc_override_1@face_FacewormsNest_keaton_very_sad_maybe_be_0b99bf: "基顿很伤心，可能是因为手镯碎了。如果你在人面虫巢穴中找到其他生锈的手镯，带给他吧。"
  npc_override_1@face_FacewormsNest_lady_keeps_crying_over_o_dafd47: "那位女士一直握着戒指哭个不停。现在跟她说话似乎没用。"
  npc_override_1@face_FacewormsNest_lady_read_inscription_in_1248a6: "^0000ff那位女士读了戒指内的铭文后开始哭泣。"
  npc_override_1@face_FacewormsNest_looks_like_dead_soul_you_2033e9: "^0000ff看起来像是一个死去的灵魂，但你没有感受到恶意。他的思绪断断续续地传达过来，所以不容易理解。^000000"
  npc_override_1@face_FacewormsNest_memorial_dungeon_already_1f7d7d: "纪念副本'{0}'已在进行中。"
  npc_override_1@face_FacewormsNest_menu_cancel_b77347: "取消:第1阶段开始:第2阶段开始:第3阶段开始:第4阶段开始:首领开始:宝藏"
  npc_override_1@face_FacewormsNest_menu_cancel_f66b59: "取消:第1首领:第2首领:第3首领:第4首领:最终首领"
  npc_override_1@face_FacewormsNest_menu_chaos_03096a: "混沌:真的吗？我不知道有赏金猎人会来这里。"
  npc_override_1@face_FacewormsNest_menu_chaos_263cf1: "混沌:你们挺厉害的！但从现在开始要小心。这条狭窄的峡谷似乎充满了危险。"
  npc_override_1@face_FacewormsNest_menu_chaos_2cfd46: "混沌:那么……嘿，那边的你！你还不错嘛。"
  npc_override_1@face_FacewormsNest_menu_chaos_32bc15: "混沌:没办法。我们的装备受损了，所以暂时撤退吧。"
  npc_override_1@face_FacewormsNest_menu_chaos_33565c: "混沌:等等！死去的人面虫蜕下的皮可能有用。"
  npc_override_1@face_FacewormsNest_menu_chaos_33dbc6: "混沌:只是暂时的。"
  npc_override_1@face_FacewormsNest_menu_chaos_3eb97f: "混沌:该死，差点被活活吃掉。"
  npc_override_1@face_FacewormsNest_menu_chaos_423810: "混沌:啊哈~我还希望有商人王子掉落的宝藏呢……"
  npc_override_1@face_FacewormsNest_menu_chaos_4879eb: "混沌:啊——————！！"
  npc_override_1@face_FacewormsNest_menu_chaos_4abef1: "混沌:哇，你速度够快能跟上我。"
  npc_override_1@face_FacewormsNest_menu_chaos_549261: "混沌:呼……打了好久了。"
  npc_override_1@face_FacewormsNest_menu_chaos_609dbd: "混沌:嘿~我们是伙伴。你不能总是独自跑在前面！"
  npc_override_1@face_FacewormsNest_menu_chaos_637697: "混沌:不，不需要找借口……人面虫不属于任何人。"
  npc_override_1@face_FacewormsNest_menu_chaos_748730: "混沌:为什么把女王丢下了？我们的命都悬在这里了。振作点！"
  npc_override_1@face_FacewormsNest_menu_chaos_75328b: "混沌:不~~不可能是人面虫女王。"
  npc_override_1@face_FacewormsNest_menu_chaos_814f5a: "混沌:一阵黑风开始吹起来了。"
  npc_override_1@face_FacewormsNest_menu_chaos_81f62f: "混沌:把它引过来，我一个人打不过它！"
  npc_override_1@face_FacewormsNest_menu_chaos_864115: "混沌:啊——"
  npc_override_1@face_FacewormsNest_menu_chaos_8a3cbe: "混沌:好，我们离开这里。小心地跟着我！"
  npc_override_1@face_FacewormsNest_menu_chaos_8fb27c: "混沌:艾丽斯，这个水坑是干什么的？"
  npc_override_1@face_FacewormsNest_menu_chaos_a08208: "混沌:好，我们处理完就回去。嘿，冒险者们。小心！我确定很快会有很多面虫来到这里。"
  npc_override_1@face_FacewormsNest_menu_chaos_a87212: "混沌:呃！啊！！这是什么？"
  npc_override_1@face_FacewormsNest_menu_chaos_a892c5: "混沌:啊——"
  npc_override_1@face_FacewormsNest_menu_chaos_ac56d1: "混沌:你连把女王引到我这里都做不到吗？"
  npc_override_1@face_FacewormsNest_menu_chaos_b4f599: "混沌:我不在乎。只要你们不打扰我就行。"
  npc_override_1@face_FacewormsNest_menu_chaos_b9f48b: "混沌:嗯，好吧，我要下去看看吗？"
  npc_override_1@face_FacewormsNest_menu_chaos_bc2f84: "混沌:抱歉，我们走吧？"
  npc_override_1@face_FacewormsNest_menu_chaos_c0e05d: "混沌:而且，我们要找的东西不在这里。我先回去了，剩下的你们处理好吗？"
  npc_override_1@face_FacewormsNest_menu_chaos_c17967: "混沌:哈哈哈，你真的没听说过吗？人面虫是最近出现在这个地区的怪物的名字。"
  npc_override_1@face_FacewormsNest_menu_chaos_ca6230: "混沌:啊"
  npc_override_1@face_FacewormsNest_menu_chaos_d02468: "混沌:艾丽斯！我感觉人面虫就在这附近。也许女王的巢穴就在这片森林的最深处！"
  npc_override_1@face_FacewormsNest_menu_chaos_dadd5b: "混沌:今天的猎物全是你们的，我不会碰的。"
  npc_override_1@face_FacewormsNest_menu_chaos_dbca3c: "混沌:啊——"
  npc_override_1@face_FacewormsNest_menu_chaos_e0ad31: "混沌:啊——"
  npc_override_1@face_FacewormsNest_menu_chaos_e65c4a: "混沌:啊——————"
  npc_override_1@face_FacewormsNest_menu_chaos_e9178e: "混沌:不……才不是！我只用怒爆，所以鳞片可能会被烧焦……"
  npc_override_1@face_FacewormsNest_menu_chaos_eb669e: "混沌:我们刚才看到的是一只突变的人面虫。"
  npc_override_1@face_FacewormsNest_menu_chaos_ec84ae: "混沌:为什么不呢？它看起来没那么危险！"
  npc_override_1@face_FacewormsNest_menu_chaos_f48be7: "混沌:呃，人面虫女王正在往上爬，看起来很生气。所以，呃，我们快离开这里吧。"
  npc_override_1@face_FacewormsNest_menu_iris_01d2e6: "艾丽斯:嘿嘿，天气真好。真开心~"
  npc_override_1@face_FacewormsNest_menu_iris_263f00: "艾丽斯:混沌！什么事？"
  npc_override_1@face_FacewormsNest_menu_iris_40e559: "艾丽斯:是啊，没能见到人面虫王我很难过。但幸运的是我们没有受伤。"
  npc_override_1@face_FacewormsNest_menu_iris_592f51: "艾丽斯:混沌，我累了。我们回村子吧。"
  npc_override_1@face_FacewormsNest_menu_iris_61ee16: "艾丽斯:你呢混沌？"
  npc_override_1@face_FacewormsNest_menu_iris_66facf: "艾丽斯:嗯，我觉得这太大了，不像是人面虫的巢穴。"
  npc_override_1@face_FacewormsNest_menu_iris_8eb60f: "艾丽斯:混沌！你要丢下我一个人吗？"
  npc_override_1@face_FacewormsNest_menu_iris_9adada: "艾丽斯:混沌！废话少说。"
  npc_override_1@face_FacewormsNest_menu_iris_a3bf4e: "艾丽斯:混沌你这个白痴！！"
  npc_override_1@face_FacewormsNest_menu_iris_ae5ce0: "艾丽斯:我在这里感觉不舒服。混沌，我们快离开这里！"
  npc_override_1@face_FacewormsNest_menu_iris_b3f81d: "艾丽斯:混沌，你擅长这个吗？"
  npc_override_1@face_FacewormsNest_menu_iris_ba6f66: "艾丽斯:啊~微风~"
  npc_override_1@face_FacewormsNest_menu_iris_bd860f: "艾丽斯:没用的混沌。"
  npc_override_1@face_FacewormsNest_menu_iris_c13d74: "艾丽斯:我问你发生了什么事笨蛋！"
  npc_override_1@face_FacewormsNest_menu_iris_cd361e: "艾丽斯:我听说技术精湛的猎人擅长快速取下鳞片。"
  npc_override_1@face_FacewormsNest_menu_iris_f28fcf: "艾丽斯:啊哈~像往常一样处理掉就好了好吗？"
  npc_override_1@face_FacewormsNest_menu_iris_f2ae5f: "艾丽斯:但那不是我们要找的东西。"
  npc_override_1@face_FacewormsNest_menu_iris_f4f2cd: "艾丽斯:啊——，混沌你真是个惹祸精。"
  npc_override_1@face_FacewormsNest_menu_iris_fc7247: "艾丽斯:但是，如果战斗时间太长，鳞片可能会受损。那就一文不值了！"
  npc_override_1@face_FacewormsNest_menu_reserve_edb23e: "预约人面虫巢穴:你在这里做什么?:别说了。"
  npc_override_1@face_FacewormsNest_menu_stop_130240: "别说了。:给他看生锈的手镯。"
  npc_override_1@face_FacewormsNest_menu_stop_44b0a7: "别说了。:给他看古药丸。"
  npc_override_1@face_FacewormsNest_menu_stop_c9c361: "别说了。:给他看旧相册"
  npc_override_1@face_FacewormsNest_menu_stop_cb9dd8: "别说了。:展示从人面虫巢穴找到的戒指。"
  npc_override_1@face_FacewormsNest_menu_stop_d9c239: "停止:返回次元缝隙"
  npc_override_1@face_FacewormsNest_menu_the_2eda3e: "混沌的声音:嘿！把它引到南边！我来解决它！"
  npc_override_1@face_FacewormsNest_menu_the_64a174: "混沌的声音:嘿！把它引到北边！我来解决它！"
  npc_override_1@face_FacewormsNest_menu_the_852e47: "混沌的声音:嘿冒险者们，你们要小心！避开毒液！"
  npc_override_1@face_FacewormsNest_menu_the_a3ee6d: "混沌的声音:嘿！把它引到东边！我来解决它！"
  npc_override_1@face_FacewormsNest_menu_the_a5694b: "混沌的声音:嘿！把它引到西边！我来解决它！"
  npc_override_1@face_FacewormsNest_menu_the_ca2490: "混沌的声音:我们在找另一个巢穴，如果你发现了什么请告诉我。"
  npc_override_1@face_FacewormsNest_msg_0b0c6f: "{0}"
  npc_override_1@face_FacewormsNest_msg_61ce5a: "[{0}]"
  npc_override_1@face_FacewormsNest_msg_6eae3a: "……"
  npc_override_1@face_FacewormsNest_my_research_stabilize_sp_22d99c: "我的研究是用魔法稳定这里的空间，以实现次元旅行。"
  npc_override_1@face_FacewormsNest_no_i_think_you_re_0b24b5: "不！我想你误会了！我们不是赏金猎人……"
  npc_override_1@face_FacewormsNest_no_no_need_make_excuse_e48aba: "不，不需要找借口……人面虫不属于任何人。"
  npc_override_1@face_FacewormsNest_no_party_please_come_bac_e15385: "没有队伍？请创建队伍后再来吧，即使你是独自前来。"
  npc_override_1@face_FacewormsNest_no_t_faceworm_queen_30519e: "不~~不可能是人面虫女王。"
  npc_override_1@face_FacewormsNest_now_i_ve_made_my_2d085d: "现在我组建了自己的武装商队，重新开始了生活。但过去的回忆不断困扰着我。"
  npc_override_1@face_FacewormsNest_oh_darling_5fa243: "哦……亲爱的~"
  npc_override_1@face_FacewormsNest_oh_my_there_other_pictur_aa2810: "哦天哪……这里还有其他照片……"
  npc_override_1@face_FacewormsNest_oh_you_level_yet_i_c5d93c: "哦，你到达140级了吗？我不会和弱小的冒险者说话的。"
  npc_override_1@face_FacewormsNest_okay_i_got_please_come_06f00b: "好吧，我知道了。如果你改变主意请再来找我。"
  npc_override_1@face_FacewormsNest_old_lady_turned_her_face_f1bb23: "^0000ff老妇人低下了头，眼眶泛红。^000000"
  npc_override_1@face_FacewormsNest_oops_my_hands_slip_off_b3787b: "哎呀，我的手滑了。需要重新激活裂缝。"
  npc_override_1@face_FacewormsNest_particular_crack_space_g_3b3bf2: "这道特殊的空间裂缝通向过去的记忆。很多冒险者进去过，但没人告诉我里面有什么……"
  npc_override_1@face_FacewormsNest_passage_space_travel_act_d95922: "空间旅行通道尚未激活。"
  npc_override_1@face_FacewormsNest_people_21d669: "{0}人。"
  npc_override_1@face_FacewormsNest_pill_my_lady_if_i_06713d: "这药丸……我的女主人，如果我有这药丸的话……"
  npc_override_1@face_FacewormsNest_please_go_farther_nest_f_162ad1: "请不要离巢穴太远。人面虫女王可能会变得狂暴。"
  npc_override_1@face_FacewormsNest_please_wait_minute_308721: "请稍等片刻。"
  npc_override_1@face_FacewormsNest_really_i_didn_t_know_b299e1: "真的吗？我不知道有赏金猎人会来这里。"
  npc_override_1@face_FacewormsNest_sadly_woman_seem_remembe_2cbd29: "遗憾的是，这位女士似乎因为剧烈的情绪波动而无法回忆起过去。让我们小心地跟她说话，听听她的故事。"
  npc_override_1@face_FacewormsNest_sergio_keeps_looking_pho_520f8b: "塞尔吉奥一直在看相册。我们还是不要打扰他了。"
  npc_override_1@face_FacewormsNest_smile_lonely_satisfactio_6fe82f: "^0000ff塞尔吉奥看着相册，脸上露出了孤独而满足的微笑。^000000"
  npc_override_1@face_FacewormsNest_something_seems_fishy_ar_e203ef: "这附近有点不对劲。很危险。"
  npc_override_1@face_FacewormsNest_sorry_i_enjoy_gentle_bre_bd23eb: "抱歉~我喜欢享受微风，下次再聊吧。"
  npc_override_1@face_FacewormsNest_spaces_under_control_39ff8b: "空间已处于控制之下。"
  npc_override_1@face_FacewormsNest_then_we_started_dating_s_9de86f: "然后我们不知怎么开始约会了。说起来还是挺不好意思的。"
  npc_override_1@face_FacewormsNest_there_s_no_sign_because_b8e59d: "没有标志，因为没人更新记录。"
  npc_override_1@face_FacewormsNest_there_s_strange_sign_her_7797d8: "而且这里有一个奇怪的牌子记录着名字和时间，我猜那些是冒险者们留下的。"
  npc_override_1@face_FacewormsNest_there_still_alive_9c030c: "还有{0}{1}存活。"
  npc_override_1@face_FacewormsNest_time_been_recorded_board_375843: "{0}的时间已被记录在牌子上。但未能打破最佳纪录。"
  npc_override_1@face_FacewormsNest_too_far_away_nest_facewo_30aced: "离巢穴太远了。人面虫女王开始狂暴。"
  npc_override_1@face_FacewormsNest_trace_dimensional_space_25a152: "^0000ff次元空间旅行的痕迹已消失。你现在可以在次元之间移动了。^000000"
  npc_override_1@face_FacewormsNest_traces_recent_space_trav_e9b409: "检测到最近的空间旅行痕迹。访问被拒绝。"
  npc_override_1@face_FacewormsNest_unknown_error_occurred_58bda4: "发生未知错误。"
  npc_override_1@face_FacewormsNest_unless_you_re_level_i_6535dd: "除非你达到140级，否则我不会和你认真交谈。"
  npc_override_1@face_FacewormsNest_wait_s_misunderstanding_dfbf35: "等等！这是个误会。"
  npc_override_1@face_FacewormsNest_wait_where_did_you_get_5e056d: "等等！你在哪里弄到这个东西的？"
  npc_override_1@face_FacewormsNest_warm_energy_inspired_you_6727af: "温暖的能量赋予了你力量。"
  npc_override_1@face_FacewormsNest_well_7b1901: "嗯……"
  npc_override_1@face_FacewormsNest_what_about_ring_217e73: "这枚戒指怎么样？"
  npc_override_1@face_FacewormsNest_what_happened_him_8ff970: "他发生了什么事？"
  npc_override_1@face_FacewormsNest_what_i_you_3d61cf: "有什么我可以帮你的吗？"
  npc_override_1@face_FacewormsNest_what_time_you_like_retur_9b0a6a: "你想什么时候返回？"
  npc_override_1@face_FacewormsNest_when_i_young_girl_many_eed521: "很多年前，当我还是个小女孩的时候，有一个我暗恋的男人。我不知道该如何告诉他我的感受……"
  npc_override_1@face_FacewormsNest_wow_you_re_fast_enough_29f9a0: "哇，你速度够快能跟上我。"
  npc_override_1@face_FacewormsNest_yes_i_nothing_snake_i_0a7c55: "是的……但是，我和那条蛇没有关系。我只是一个曾经侍奉女主人的无用仆人。"
  npc_override_1@face_FacewormsNest_yes_i_remembered_one_who_326eaa: "是的！我想起来了。这就是那个曾经在我父亲的武装商队工作的人。"
  npc_override_1@face_FacewormsNest_you_allowed_access_devic_59b39c: "你不允许访问这个装置。"
  npc_override_1@face_FacewormsNest_you_catch_glimpse_compli_7ab515: "^0000ff你瞥见他眼中复杂的愤怒与悲伤。^000000"
  npc_override_1@face_FacewormsNest_you_don_t_party_please_0b3764: "你没有队伍？请创建队伍后再来吧，即使你是独自前来。"
  npc_override_1@face_FacewormsNest_you_hear_pile_stones_col_4fe64c: "你听到石堆倒塌的声音。这可能是通往其他空间的入口。"
  npc_override_1@face_FacewormsNest_you_hear_pile_stones_col_6b7118: "你听到石堆倒塌的声音。我想又找到了一个入口。"
  npc_override_1@face_FacewormsNest_you_hear_something_loud_08fa2b: "你听到南边传来巨大的声音。那肯定是我们刚刚消灭的那只怪物的巢穴。"
  npc_override_1@face_FacewormsNest_you_hear_something_screa_2c2d20: "你听到西边有什么东西在尖叫。"
  npc_override_1@face_FacewormsNest_you_least_level_yet_c686d5: "你至少达到140级了吗？"
  npc_override_1@face_FacewormsNest_you_qualified_enough_ent_86aff3: "你的资格还不够进入这里。不如去其他地方逛逛，等你升到140级再来吧。"
  npc_override_1@face_FacewormsNest_you_re_pretty_good_you_58728e: "你们挺厉害的！但从现在开始要小心。这条狭窄的峡谷似乎充满了危险。"
  npc_override_1@face_FacewormsNest_you_sense_warm_energy_em_2e15ae: "^0000ff你感受到一股温暖的能量散发出来。也许这就是制作这枚戒指的人的愿望。^000000"
  npc_override_1@face_FacewormsNest_you_talk_dol_seoi_again_b77ae5: "如果你从人面虫巢穴获得了另一颗古药丸，你可以再次与多尔塞对话。"
  npc_override_1@face_FacewormsNest_you_talk_sergio_again_wh_7368cd: "当你从人面虫巢穴捡到新的相册时，你可以再次与塞尔吉奥对话。"
  npc_override_1@face_FacewormsNest_you_too_many_kind_belong_123624: "你的物品种类太多了。减少物品种类后再试一次吧。"
  npc_override_1@face_FacewormsNest_you_too_many_types_belon_037d7c: "你的物品种类太多了。减少物品种类后再试一次吧。"
  npc_override_1@face_FacewormsNest_you_touched_seeing_satis_eb3be7: "看到塞尔吉奥脸上的满足感，你被感动了。"
  npc_override_1@face_FacewormsNest_you_want_revenge_296b5e: "你想复仇吗？"
  npc_override_1@face_FacewormsNest_your_belongings_too_heav_c257d5: "你的行李太重了，无法继续。减轻重量后再试一次吧。"
  npc_override_1@face_FacewormsNest_your_power_level_high_en_fd7372: "你的力量等级不足以进行空间旅行。请至少达到140级后再来吧。"
  npc_override_1@face_FacewormsNest_your_time_finished_here_5cec03: "你的时间到了。你可以四处看看或者离开。你想做什么？"

