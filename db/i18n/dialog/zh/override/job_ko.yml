Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job_ko_kagerou_oboro_ah_as_i_expected_84a310: "Ah, as I expected."
  npc_override_job_ko_kagerou_oboro_ah_just_case_5d7581: "Ah... But just in case,"
  npc_override_job_ko_kagerou_oboro_ahh_how_possible_you_don_d8bb3f: "Ahh, how is it possible? You don't have weapons? Maybe you equipped it?"
  npc_override_job_ko_kagerou_oboro_ahh_its_ordinary_huuma_ae3e07: "Ahh, Its not an Ordinary Huuma."
  npc_override_job_ko_kagerou_oboro_ahh_you_equipped_any_wea_f5e80b: "Ahh! You have not equipped any weapons!"
  npc_override_job_ko_kagerou_oboro_alright_404e04: "Alright, {0}!"
  npc_override_job_ko_kagerou_oboro_analyzing_weapon_b4ae4c: "Analyzing the weapon."
  npc_override_job_ko_kagerou_oboro_area_cursed_times_normal_b05790: "Area cursed with 10 times the normal gravity. You will need 10 ^FD0260LP^000000 to roll the dice."
  npc_override_job_ko_kagerou_oboro_aren_t_you_d31516: "Aren't you..."
  npc_override_job_ko_kagerou_oboro_as_i_ve_told_you_379ad9: "As I've told you before, the last test is different because you have to compete against others."
  npc_override_job_ko_kagerou_oboro_battle_test_control_npc_ffbf17: "This is the Battle Test Control NPC."
  npc_override_job_ko_kagerou_oboro_battle_test_only_those_p_b0db2a: "The battle test is only for those that pass that knowledge, survival and weapon tests. So! It is the very last test."
  npc_override_job_ko_kagerou_oboro_because_733f76: "Because of ^B24E59{0}^000000?"
  npc_override_job_ko_kagerou_oboro_been_long_time_since_i_8f1a03: "Been a long time since I last heard that word."
  npc_override_job_ko_kagerou_oboro_beginners_quite_good_tes_960844: "For beginners, quite good. This test may not be significant to you, but your competence is enough."
  npc_override_job_ko_kagerou_oboro_better_than_expected_ad710f: "Better than expected."
  npc_override_job_ko_kagerou_oboro_block_blessed_245e64: "This block is blessed."
  npc_override_job_ko_kagerou_oboro_block_trap_1ac5be: "This block has a trap."
  npc_override_job_ko_kagerou_oboro_both_warriors_did_travel_727ee7: "Both warriors did travel together after the war but kept an awkward distance from each other."
  npc_override_job_ko_kagerou_oboro_both_warriors_weren_t_cl_9dc9f7: "Both warriors weren't close at first, because personality and everything else was completely opposite of each other."
  npc_override_job_ko_kagerou_oboro_bzzzt_874778: "Bzzzt"
  npc_override_job_ko_kagerou_oboro_cannot_exceed_maximum_lp_c20498: "Cannot exceed maximum 100 ^FD0260LP^000000."
  npc_override_job_ko_kagerou_oboro_cannot_move_because_you_d961e5: "Cannot move because you are cursed."
  npc_override_job_ko_kagerou_oboro_cannot_read_writing_ther_be7974: "Cannot read the writing. There should be a way to read it."
  npc_override_job_ko_kagerou_oboro_careful_cause_trouble_sh_e1c11c: "^FF0000be careful not to cause trouble by showing these to blacksmiths outside of here.^000000"
  npc_override_job_ko_kagerou_oboro_challenge_better_than_ex_97fdea: "A challenge is better than explaining it a hundred times. It's the actual experience that makes you better."
  npc_override_job_ko_kagerou_oboro_clan_been_living_hiding_c6332f: "The clan has been living in hiding for so long since the old days. The current lord didn't even know of their existence."
  npc_override_job_ko_kagerou_oboro_clan_integrity_0c367c: "...a clan of integrity..."
  npc_override_job_ko_kagerou_oboro_clan_loyal_their_lord_wh_600685: "A clan that was loyal to their lord who they served as their bright sun."
  npc_override_job_ko_kagerou_oboro_clan_worked_behind_scene_af9fc9: "The clan worked behind the scenes and basically lived their lives for their lord."
  npc_override_job_ko_kagerou_oboro_clank_clunk_clink_f8e8a5: "Clank clunk clink"
  npc_override_job_ko_kagerou_oboro_congratulation_choosing_cee26f: "Congratulation for choosing the road of development!"
  npc_override_job_ko_kagerou_oboro_consume_lp_roll_dice_twi_00357f: "Consume 2 ^FD0260LP^000000 and roll the dice twice."
  npc_override_job_ko_kagerou_oboro_control_completed_97e999: "Control has completed."
  npc_override_job_ko_kagerou_oboro_conversation_stopped_abr_1a7c81: "The conversation stopped abruptly. Hidden place? Wall? Part of a test? What is all this about?"
  npc_override_job_ko_kagerou_oboro_could_withstand_curse_708b70: "Could not withstand the curse."
  npc_override_job_ko_kagerou_oboro_course_path_difficult_so_25844e: "Of course the path will be difficult, so continue searching!"
  npc_override_job_ko_kagerou_oboro_crafting_tool_b16360: "A crafting tool."
  npc_override_job_ko_kagerou_oboro_creating_weapon_yourself_ac235f: "Creating a weapon for yourself and refining it is the purpose of this test."
  npc_override_job_ko_kagerou_oboro_dice_came_out_as_1e9069: "The dice came out as {0}."
  npc_override_job_ko_kagerou_oboro_did_set_trap_please_roll_bbc117: "Did not set a trap. Please roll the dice."
  npc_override_job_ko_kagerou_oboro_did_use_lp_f07bb8: "< Did not use 10 LP >"
  npc_override_job_ko_kagerou_oboro_did_use_lp_fd907d: "< Did not use 5 LP >"
  npc_override_job_ko_kagerou_oboro_did_you_bring_enough_iro_97e4bd: "Did you bring enough ^6848B7Iron Ore, Iron, Steel, Phracon, Emveretaron, Rough Oridecon, and Rough Elunium^000000?"
  npc_override_job_ko_kagerou_oboro_did_you_get_successful_r_2e3847: "Did you get a successful result?"
  npc_override_job_ko_kagerou_oboro_didn_t_take_long_them_a5f28f: "But it didn't take long for them to become one as a clan."
  npc_override_job_ko_kagerou_oboro_don_t_ea1d25: "Don't have {0}."
  npc_override_job_ko_kagerou_oboro_don_t_like_i_m_4e8f33: "Don't like it that I'm not the first one you visited but that is not important."
  npc_override_job_ko_kagerou_oboro_don_t_really_need_now_d12186: "Don't really need it now."
  npc_override_job_ko_kagerou_oboro_draw_bfa50c: "Draw"
  npc_override_job_ko_kagerou_oboro_due_insufficient_lp_you_f06bfa: "Due to insufficient ^FD0260LP^000000, you will be returned to starting position."
  npc_override_job_ko_kagerou_oboro_entrance_ninja_guild_hid_7d5719: "Entrance to the ^25C18DNinja Guild^000000 hideout."
  npc_override_job_ko_kagerou_oboro_equipment_perfectly_refi_5c0a50: "This equipment is perfectly refined. Keep it for yourself!"
  npc_override_job_ko_kagerou_oboro_equipment_starts_up_plea_9717c0: "The equipment starts up with a pleasant vibration."
  npc_override_job_ko_kagerou_oboro_equipment_work_without_e_651223: "This equipment does not work without an equipped item to refine."
  npc_override_job_ko_kagerou_oboro_everywhere_else_c795c7: "...and everywhere else."
  npc_override_job_ko_kagerou_oboro_everywhere_else_now_let_79b050: "...and everywhere else. Now let's begin!!"
  npc_override_job_ko_kagerou_oboro_example_iron_ore_iron_st_e76a7b: "For example, Iron Ore, Iron, and Steel are of similar property so you can get a high purity metal out of them."
  npc_override_job_ko_kagerou_oboro_excuse_me_fd62fb: "Excuse me..."
  npc_override_job_ko_kagerou_oboro_excuse_me_where_am_i_7e5d86: "Excuse me... where am I?"
  npc_override_job_ko_kagerou_oboro_failed_refining_c5bbf2: "Failed in refining."
  npc_override_job_ko_kagerou_oboro_familiar_face_da2047: "Familiar face?"
  npc_override_job_ko_kagerou_oboro_feel_free_use_tools_here_5aa5c8: "Feel free to use tools from here, and..."
  npc_override_job_ko_kagerou_oboro_few_knew_about_clan_s_9c21cd: "The few that knew about the clan's existence, tried to investigate them but nobody was able to reveal their true identity."
  npc_override_job_ko_kagerou_oboro_first_dice_result_you_wa_0fda0c: "First dice result is {0}. Do you want to roll the second dice?"
  npc_override_job_ko_kagerou_oboro_first_need_melt_metals_l_9b0925: "First need to melt metals like iron and iron ore to use to create a weapon."
  npc_override_job_ko_kagerou_oboro_first_place_they_met_bat_6828e8: "The first place they met was the battlefield. And you know how enemies greet each other on a battlefield."
  npc_override_job_ko_kagerou_oboro_friend_you_ve_laughed_ye_08d448: "The friend you've laughed with yesterday is a foe that you have to fight with in a war today."
  npc_override_job_ko_kagerou_oboro_gai_s_voice_fades_out_f7d6a8: "^777777(Gai's voice fades out.)^000000."
  npc_override_job_ko_kagerou_oboro_game_instructions_end_he_4975ea: "Game instructions end here. Good luck to you."
  npc_override_job_ko_kagerou_oboro_game_results_10d7ce: "=Game Results="
  npc_override_job_ko_kagerou_oboro_gion_interrupting_test_b_fcd286: "[Gion] Interrupting the Test of Battle."
  npc_override_job_ko_kagerou_oboro_gion_my_friend_made_path_713ba4: "[Gion] My Friend {0} made it to {1} Path. Congratulations!!"
  npc_override_job_ko_kagerou_oboro_go_forth_716242: "Go forth."
  npc_override_job_ko_kagerou_oboro_go_reduce_your_weight_te_c907aa: "Go reduce your weight! This test will be too difficult otherwise..."
  npc_override_job_ko_kagerou_oboro_go_report_test_results_g_6d7199: "Go report the test results to Gion!"
  npc_override_job_ko_kagerou_oboro_goes_way_back_ancient_ti_bbd8bf: "This goes way back to ancient times and nobody in Amatsu remembers about it."
  npc_override_job_ko_kagerou_oboro_good_i_think_you_ready_7332e6: "Good. I think you are ready."
  npc_override_job_ko_kagerou_oboro_good_test_you_about_take_6ee6b7: "Good! The test you are about to take is the ^339CCCTest of Knowledge^000000."
  npc_override_job_ko_kagerou_oboro_got_cursed_became_immobi_661106: "Got cursed and became immobilized for 2 minutes."
  npc_override_job_ko_kagerou_oboro_ground_weapon_6ddcc4: "Ground the weapon."
  npc_override_job_ko_kagerou_oboro_ha_ha_ha_cff240: "Ha ha ha-"
  npc_override_job_ko_kagerou_oboro_ha_ha_ha_i_finish_575ea7: "Ha ha ha. I will finish the story."
  npc_override_job_ko_kagerou_oboro_ha_ha_ha_never_fun_a0967f: "Ha ha ha. It is never fun to listen to the whole story all at once, no? Come back after passing a test and I'll continue my story."
  npc_override_job_ko_kagerou_oboro_ha_ha_ha_you_ll_31c67b: "Ha ha ha. You'll know when we get there. The Test of Knowledge is taken over here."
  npc_override_job_ko_kagerou_oboro_haven_t_given_up_ya_114694: "Haven't given up, have ya. Do you really think he'll approve?"
  npc_override_job_ko_kagerou_oboro_he_keeps_talking_doesn_t_3731b7: "^1A95E6He keeps talking and doesn't stop to answer your question.^1A95E6"
  npc_override_job_ko_kagerou_oboro_he_like_jokes_conversati_f30554: "He like the jokes and conversations better than quarrels and he liked women over men."
  npc_override_job_ko_kagerou_oboro_he_s_short_silent_man_fe5919: "^000099(He's a short, silent man.)^000000"
  npc_override_job_ko_kagerou_oboro_here_f43a11: "^0000FF{0} was here.^000000"
  npc_override_job_ko_kagerou_oboro_hmm_a18d23: "Hmm. {0}?"
  npc_override_job_ko_kagerou_oboro_hmm_embarrassing_speak_s_6e36e8: "Hmm... Embarrassing... to speak so suddenly..."
  npc_override_job_ko_kagerou_oboro_hmm_guess_i_expected_too_c848e1: "Hmm... Guess I expected too much? Let me explain."
  npc_override_job_ko_kagerou_oboro_hmm_i_don_t_know_1482a3: "Hmm... I don't know why this part of the story was kept alive all these years but this man wanted to bring these two warriors together."
  npc_override_job_ko_kagerou_oboro_hmm_interesting_dagger_s_7c526e: "Hmm... Interesting... Is it a dagger in a shape of a Kunai?"
  npc_override_job_ko_kagerou_oboro_hmm_ordinary_huuma_2d2f7e: "Hmm... Is this an Ordinary Huuma?"
  npc_override_job_ko_kagerou_oboro_hmm_you_as_slow_as_ea6435: "Hmm? You are not as slow as I thought you were!"
  npc_override_job_ko_kagerou_oboro_hmm_your_limit_2977c3: "Hmm... Is this your limit?"
  npc_override_job_ko_kagerou_oboro_how_clan_started_0da883: "This is how the clan started."
  npc_override_job_ko_kagerou_oboro_how_did_go_afterwards_2acf3f: "How did it go afterwards?"
  npc_override_job_ko_kagerou_oboro_how_did_you_get_here_239b35: "How did you get here?"
  npc_override_job_ko_kagerou_oboro_how_did_you_get_weaker_99663c: "How did you get weaker? Come back once you've regained your previous levels."
  npc_override_job_ko_kagerou_oboro_i_admit_i_don_t_45b000: "I have to admit, I don't understand you now."
  npc_override_job_ko_kagerou_oboro_i_believe_you_handle_tes_227fd3: "But I believe you can handle it. The Test of Survival is taken over here."
  npc_override_job_ko_kagerou_oboro_i_change_your_quest_stat_d585e2: "I will change your quest status to Pre-Transfer, but before that..."
  npc_override_job_ko_kagerou_oboro_i_created_refinement_too_037a06: "I created the refinement tools myself with great effort so you won't have any trouble using them."
  npc_override_job_ko_kagerou_oboro_i_did_some_work_prototyp_ab9a90: "I did some work on the prototype {0} you made."
  npc_override_job_ko_kagerou_oboro_i_don_t_much_add_d0489d: "I don't have much to add because Gai and Joe said it all."
  npc_override_job_ko_kagerou_oboro_i_feel_3643fe: "I can feel it."
  npc_override_job_ko_kagerou_oboro_i_guess_little_visit_coi_09c014: "I guess this little visit was not by coincidence but a start of a connection."
  npc_override_job_ko_kagerou_oboro_i_hand_you_you_ve_7828ed: "I have to hand it to you. You've picked some competitive ones."
  npc_override_job_ko_kagerou_oboro_i_help_you_path_you_fb5d1c: "I can help you on the path you've chosen, the ^33CC71{0}^000000 path."
  npc_override_job_ko_kagerou_oboro_i_hope_blessings_kagerou_92d9e9: "I hope the blessings of Kagerou, dancing sun and Oboro, misty moonlight will be with you on your journey ahead."
  npc_override_job_ko_kagerou_oboro_i_hope_you_blessed_find_67fd35: "I hope you will be blessed and find the best weapon for yourself. Now what other test are you curious about?"
  npc_override_job_ko_kagerou_oboro_i_hope_you_haven_t_d8bcf4: "I hope you haven't been lazy with your studies while focusing on getting stronger?"
  npc_override_job_ko_kagerou_oboro_i_know_you_curious_what_e973a0: "I know you are curious what these tests are. Let me explain one by one."
  npc_override_job_ko_kagerou_oboro_i_ll_continue_story_afte_a2c9ca: "I'll continue the story after you pass another test."
  npc_override_job_ko_kagerou_oboro_i_ll_give_you_another_8da2f3: "I'll give you another chance."
  npc_override_job_ko_kagerou_oboro_i_ll_let_you_go_9b6faf: "I'll let you go now so go report back to Leader Gion with your results."
  npc_override_job_ko_kagerou_oboro_i_ll_tell_you_once_509b20: "I'll tell you once more. The target is the ^FF0000Clan Secret^000000."
  npc_override_job_ko_kagerou_oboro_i_look_forward_your_resu_ef653e: "I will look forward for your result."
  npc_override_job_ko_kagerou_oboro_i_m_almost_end_my_099c68: "I'm almost at the end of my clan story. Come back after you've passed the third test and I will tell you the rest."
  npc_override_job_ko_kagerou_oboro_i_m_just_sorry_environme_17391a: "I'm just sorry that the environment of all these tests could have been better for our later generation."
  npc_override_job_ko_kagerou_oboro_i_m_leader_gion_last_685396: "I'm Leader Gion, the last of the dark ninja clan."
  npc_override_job_ko_kagerou_oboro_i_m_ready_my_end_b407af: "I'm ready at my end. Are you ready for the test?"
  npc_override_job_ko_kagerou_oboro_i_m_sorry_i_almost_01bbf2: "I'm sorry I almost forgot about you two. Do you have anything to share with {0}?"
  npc_override_job_ko_kagerou_oboro_i_m_sorry_i_strangled_f0069a: "I'm sorry I strangled you when we first met."
  npc_override_job_ko_kagerou_oboro_i_must_misjudged_you_you_2162db: "I must have misjudged you. You might have been satisfied yourself but I'm not. Do it again!!"
  npc_override_job_ko_kagerou_oboro_i_named_your_weapons_my_74b905: "I named your weapons on my own but I know you'll like the name."
  npc_override_job_ko_kagerou_oboro_i_remember_you_before_lo_13ea96: "I remember you from before looking for the way of the ninja."
  npc_override_job_ko_kagerou_oboro_i_see_you_middle_test_d27eae: "I see you are in the middle of the ^339CCCTest of Battle^000000. Will you go back to the test site?"
  npc_override_job_ko_kagerou_oboro_i_solve_any_problems_job_fa5d3a: "I can solve any problems in the job change quest."
  npc_override_job_ko_kagerou_oboro_i_spoke_more_than_i_4be3ea: "I spoke more than I intended to."
  npc_override_job_ko_kagerou_oboro_i_still_believe_you_stop_3a5afc: "I still believe that you will not stop here."
  npc_override_job_ko_kagerou_oboro_i_t_rip_down_because_f52b96: "I can't rip it down because I don't own it."
  npc_override_job_ko_kagerou_oboro_i_take_weapon_give_some_911eff: "I will take this weapon to give it some finishing touches."
  npc_override_job_ko_kagerou_oboro_i_think_enough_get_you_e5378a: "I think this is enough to get you started, don't you think? Now go and work on that prototype!!"
  npc_override_job_ko_kagerou_oboro_i_think_i_left_off_268047: "I think I left off when the two warriors met at the battlefield as enemies."
  npc_override_job_ko_kagerou_oboro_i_think_s_because_someon_91b3d5: "I think it's because someone wanted us to let go of the past and move forward."
  npc_override_job_ko_kagerou_oboro_i_thought_you_afraid_pat_6b7bbe: "I thought you were afraid of the ^33CC71path of the {0}^33CC71 and wouldn't come back."
  npc_override_job_ko_kagerou_oboro_i_ve_set_pre_transfer_7c9262: "I've set the Pre-Transfer status. Good luck!!"
  npc_override_job_ko_kagerou_oboro_i_wonder_if_joe_satisfie_ae1a70: "I wonder if Joe is satisfied with your performance."
  npc_override_job_ko_kagerou_oboro_if_draw_roll_dice_ac9f3b: "If it is a draw, roll the dice."
  npc_override_job_ko_kagerou_oboro_if_sum_numbers_both_dice_46d634: "If the sum of the numbers from both dice is lower than 5, move to block 30, if it higher than 5, move to block 19."
  npc_override_job_ko_kagerou_oboro_if_sum_numbers_both_dice_542b63: "If the sum of the numbers from both dice is larger than 8, then you can move to any block between 25 to 30. But! If the sum is below 8, you must move back to block 19."
  npc_override_job_ko_kagerou_oboro_if_you_deal_various_situ_7cf4ac: "If you deal with various situations wisely, you will be able to pass the test. Now what other test are you curious about?"
  npc_override_job_ko_kagerou_oboro_if_you_don_t_want_69849c: "If you don't want to be caught, install a trap."
  npc_override_job_ko_kagerou_oboro_if_you_get_move_arrival_946c1a: "If you get 1, 3, or 5, move to the arrival point; if you get 2, 4, or 6, go back to the starting point."
  npc_override_job_ko_kagerou_oboro_if_you_get_same_number_cae12b: "If you get the same number then you can move to block 30, if the numbers are different, consume 2 LP to roll again... until you get the same numbers."
  npc_override_job_ko_kagerou_oboro_if_you_get_you_move_b9a333: "If you get 1, 2, or 3 you move right to the arrival point; if you get 4, 5, or 6 you get to choose to move to block 29."
  npc_override_job_ko_kagerou_oboro_if_you_leave_your_lp_076f48: "If you leave your ^FD0260LP^000000 then the next person for test that arrives at the block will automatically pass the test."
  npc_override_job_ko_kagerou_oboro_if_you_lose_move_block_077c06: "If you lose, move to block 0."
  npc_override_job_ko_kagerou_oboro_if_you_lose_move_block_37ab2c: "If you lose, move to block 9."
  npc_override_job_ko_kagerou_oboro_if_you_lucky_there_other_b6ec8f: "And if you are lucky, there will be others targeting the monster."
  npc_override_job_ko_kagerou_oboro_if_you_pay_lp_you_7d8949: "If you do not pay 5 ^FD0260LP^000000, you will be cursed and immobilized for 2 minutes."
  npc_override_job_ko_kagerou_oboro_if_you_prepared_follow_m_02b10a: "If you are prepared to follow me, Leader Gion, on the {0} path, we will meet again."
  npc_override_job_ko_kagerou_oboro_if_you_win_move_block_a4c8b1: "If you win, move to block 15."
  npc_override_job_ko_kagerou_oboro_if_you_win_move_block_fdde47: "If you win, move to block 20."
  npc_override_job_ko_kagerou_oboro_if_you_win_you_get_78737f: "If you win, you get to move to any block between 33 to 38; if you lose or is a draw, you have to move to block 0."
  npc_override_job_ko_kagerou_oboro_immobilize_curse_lasted_80927f: "The immobilize curse lasted for 2 minutes and then was removed."
  npc_override_job_ko_kagerou_oboro_incorrect_password_b68db3: "Incorrect password."
  npc_override_job_ko_kagerou_oboro_isn_t_easy_get_satisfact_ca475c: "It isn't easy to get a satisfactory result at first."
  npc_override_job_ko_kagerou_oboro_isn_t_your_first_test_417a08: "This isn't your first test, is it?"
  npc_override_job_ko_kagerou_oboro_its_wise_decision_nothin_a85d57: "Its a wise decision to do nothing."
  npc_override_job_ko_kagerou_oboro_job_kagero_3e9bf5: "job_kagero ({0}/9)"
  npc_override_job_ko_kagerou_oboro_job_kagero_lp_542fe3: "job_kagero_lp ({0}/100)"
  npc_override_job_ko_kagerou_oboro_joe_took_thorough_look_s_1a6c5a: "Joe took a thorough look at the seal."
  npc_override_job_ko_kagerou_oboro_kagerou_oboro_job_change_d4ff75: "This is the Kagerou and Oboro Job Change assistant NPC."
