Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job_ko_kagerou_oboro_ah_as_i_expected_84a310: "啊，正如我所料。"
  npc_override_job_ko_kagerou_oboro_ah_just_case_5d7581: "啊……但万一，"
  npc_override_job_ko_kagerou_oboro_ahh_how_possible_you_don_d8bb3f: "啊，怎么可能？你没有武器？也许你装备了它？"
  npc_override_job_ko_kagerou_oboro_ahh_its_ordinary_huuma_ae3e07: "啊，这不是普通的Huuma。"
  npc_override_job_ko_kagerou_oboro_ahh_you_equipped_any_wea_f5e80b: "啊！你没有装备任何武器！"
  npc_override_job_ko_kagerou_oboro_alright_404e04: "好的，{0}！"
  npc_override_job_ko_kagerou_oboro_analyzing_weapon_b4ae4c: "正在分析武器。"
  npc_override_job_ko_kagerou_oboro_area_cursed_times_normal_b05790: "区域被诅咒，重力是正常重力的10倍。你需要10点^FD0260LP^000000来掷骰子。"
  npc_override_job_ko_kagerou_oboro_aren_t_you_d31516: "你不是……"
  npc_override_job_ko_kagerou_oboro_as_i_ve_told_you_379ad9: "正如我之前告诉你的，最后的测试不同，因为你必须与其他人竞争。"
  npc_override_job_ko_kagerou_oboro_battle_test_control_npc_ffbf17: "这是战斗测试控制NPC。"
  npc_override_job_ko_kagerou_oboro_battle_test_only_those_p_b0db2a: "战斗测试只针对通过知识、生存和武器测试的人。所以！这是最后的测试。"
  npc_override_job_ko_kagerou_oboro_because_733f76: "因为^B24E59{0}^000000？"
  npc_override_job_ko_kagerou_oboro_been_long_time_since_i_8f1a03: "好久没听到那个词了。"
  npc_override_job_ko_kagerou_oboro_beginners_quite_good_tes_960844: "对初学者来说相当不错。这个测试对你来说可能不重要，但你的能力已经足够。"
  npc_override_job_ko_kagerou_oboro_better_than_expected_ad710f: "比预期的要好。"
  npc_override_job_ko_kagerou_oboro_block_blessed_245e64: "这个方块被祝福了。"
  npc_override_job_ko_kagerou_oboro_block_trap_1ac5be: "这个方块有陷阱。"
  npc_override_job_ko_kagerou_oboro_both_warriors_did_travel_727ee7: "两位战士战后确实一起旅行，但彼此保持着尴尬的距离。"
  npc_override_job_ko_kagerou_oboro_both_warriors_weren_t_cl_9dc9f7: "两位战士一开始并不亲近，因为性格和一切都完全相反。"
  npc_override_job_ko_kagerou_oboro_bzzzt_874778: "嗞嗞"
  npc_override_job_ko_kagerou_oboro_cannot_exceed_maximum_lp_c20498: "不能超过最大100点^FD0260LP^000000。"
  npc_override_job_ko_kagerou_oboro_cannot_move_because_you_d961e5: "因为被诅咒而无法移动。"
  npc_override_job_ko_kagerou_oboro_cannot_read_writing_ther_be7974: "无法读取文字。应该有一种方法可以读到它。"
  npc_override_job_ko_kagerou_oboro_careful_cause_trouble_sh_e1c11c: "^FF0000小心不要把这些展示给这里的铁匠，以免惹上麻烦。^000000"
  npc_override_job_ko_kagerou_oboro_challenge_better_than_ex_97fdea: "实战比解释一百遍更好。正是实际经验让你变得更强大。"
  npc_override_job_ko_kagerou_oboro_clan_been_living_hiding_c6332f: "这个部族自古以来一直隐居生活。现任领主甚至不知道他们的存在。"
  npc_override_job_ko_kagerou_oboro_clan_integrity_0c367c: "……一个正直的部族……"
  npc_override_job_ko_kagerou_oboro_clan_loyal_their_lord_wh_600685: "一个忠于他们所侍奉的领主的部族，他们将领主视为明亮的太阳。"
  npc_override_job_ko_kagerou_oboro_clan_worked_behind_scene_af9fc9: "这个部族在幕后工作，基本上为他们的领主而活。"
  npc_override_job_ko_kagerou_oboro_clank_clunk_clink_f8e8a5: "叮当 哐啷 咔嗒"
  npc_override_job_ko_kagerou_oboro_congratulation_choosing_cee26f: "恭喜你选择了进阶之路！"
  npc_override_job_ko_kagerou_oboro_consume_lp_roll_dice_twi_00357f: "消耗2点^FD0260LP^000000并掷骰子两次。"
  npc_override_job_ko_kagerou_oboro_control_completed_97e999: "控制已完成。"
  npc_override_job_ko_kagerou_oboro_conversation_stopped_abr_1a7c81: "对话突然停止。隐藏的地方？墙壁？测试的一部分？这一切是怎么回事？"
  npc_override_job_ko_kagerou_oboro_could_withstand_curse_708b70: "无法承受诅咒。"
  npc_override_job_ko_kagerou_oboro_course_path_difficult_so_25844e: "当然道路会很艰难，所以继续搜索！"
  npc_override_job_ko_kagerou_oboro_crafting_tool_b16360: "一个制作工具。"
  npc_override_job_ko_kagerou_oboro_creating_weapon_yourself_ac235f: "为自己打造武器并精炼它是本次测试的目的。"
  npc_override_job_ko_kagerou_oboro_dice_came_out_as_1e9069: "骰子结果是{0}。"
  npc_override_job_ko_kagerou_oboro_did_set_trap_please_roll_bbc117: "没有设置陷阱。请掷骰子。"
  npc_override_job_ko_kagerou_oboro_did_use_lp_f07bb8: "< 没有使用10点LP >"
  npc_override_job_ko_kagerou_oboro_did_use_lp_fd907d: "< 没有使用5点LP >"
  npc_override_job_ko_kagerou_oboro_did_you_bring_enough_iro_97e4bd: "你带够了^6848B7铁矿石、铁、钢铁、Phracon、Emveretaron、 rough oridecon和rough elunium^000000吗？"
  npc_override_job_ko_kagerou_oboro_did_you_get_successful_r_2e3847: "你得到成功的结果了吗？"
  npc_override_job_ko_kagerou_oboro_didn_t_take_long_them_a5f28f: "但他们没过多久就成为了一个部族。"
  npc_override_job_ko_kagerou_oboro_don_t_ea1d25: "没有{0}。"
  npc_override_job_ko_kagerou_oboro_don_t_like_i_m_4e8f33: "不喜欢我不是你第一个拜访的人，但这不重要。"
  npc_override_job_ko_kagerou_oboro_don_t_really_need_now_d12186: "现在不太需要。"
  npc_override_job_ko_kagerou_oboro_draw_bfa50c: "平局"
  npc_override_job_ko_kagerou_oboro_due_insufficient_lp_you_f06bfa: "由于^FD0260LP^000000不足，你将被送回起始位置。"
  npc_override_job_ko_kagerou_oboro_entrance_ninja_guild_hid_7d5719: "^25C18D忍者公会^000000藏身处入口。"
  npc_override_job_ko_kagerou_oboro_equipment_perfectly_refi_5c0a50: "这件装备已完美精炼。留着自己用吧！"
  npc_override_job_ko_kagerou_oboro_equipment_starts_up_plea_9717c0: "装备以令人愉悦的振动启动。"
  npc_override_job_ko_kagerou_oboro_equipment_work_without_e_651223: "这件装备在没有装备要精炼的物品时无法工作。"
  npc_override_job_ko_kagerou_oboro_everywhere_else_c795c7: "……还有无处不在。"
  npc_override_job_ko_kagerou_oboro_everywhere_else_now_let_79b050: "……还有无处不在。现在开始吧！！"
  npc_override_job_ko_kagerou_oboro_example_iron_ore_iron_st_e76a7b: "例如，铁矿石、铁和钢具有相似的属性，所以你可以从中获得高纯度金属。"
  npc_override_job_ko_kagerou_oboro_excuse_me_fd62fb: "打扰一下……"
  npc_override_job_ko_kagerou_oboro_excuse_me_where_am_i_7e5d86: "打扰一下……我在哪里？"
  npc_override_job_ko_kagerou_oboro_failed_refining_c5bbf2: "精炼失败。"
  npc_override_job_ko_kagerou_oboro_familiar_face_da2047: "熟悉的面孔？"
  npc_override_job_ko_kagerou_oboro_feel_free_use_tools_here_5aa5c8: "请随意使用这里的工具，还有……"
  npc_override_job_ko_kagerou_oboro_few_knew_about_clan_s_9c21cd: "少数知道这个部族存在的人试图调查他们，但没人能揭示他们的真实身份。"
  npc_override_job_ko_kagerou_oboro_first_dice_result_you_wa_0fda0c: "第一个骰子结果是{0}。你想掷第二个骰子吗？"
  npc_override_job_ko_kagerou_oboro_first_need_melt_metals_l_9b0925: "首先需要熔化像铁和铁矿石这样的金属，用来制造武器。"
  npc_override_job_ko_kagerou_oboro_first_place_they_met_bat_6828e8: "他们第一次见面的地方是战场。你知道敌人在战场上是如何打招呼的。"
  npc_override_job_ko_kagerou_oboro_friend_you_ve_laughed_ye_08d448: "昨天一起欢笑的朋友，今天就是战争中必须对抗的敌人。"
  npc_override_job_ko_kagerou_oboro_gai_s_voice_fades_out_f7d6a8: "^777777(Gai的声音渐渐消失。)^000000。"
  npc_override_job_ko_kagerou_oboro_game_instructions_end_he_4975ea: "游戏说明到此结束。祝你好运。"
  npc_override_job_ko_kagerou_oboro_game_results_10d7ce: "=游戏结果="
  npc_override_job_ko_kagerou_oboro_gion_interrupting_test_b_fcd286: "[Gion] 中断战斗测试。"
  npc_override_job_ko_kagerou_oboro_gion_my_friend_made_path_713ba4: "[Gion] 我的朋友{0}到达了{1}之路。恭喜！！"
  npc_override_job_ko_kagerou_oboro_go_forth_716242: "前进吧。"
  npc_override_job_ko_kagerou_oboro_go_reduce_your_weight_te_c907aa: "去减轻你的负重！否则这个测试会太困难……"
  npc_override_job_ko_kagerou_oboro_go_report_test_results_g_6d7199: "去向Gion报告测试结果！"
  npc_override_job_ko_kagerou_oboro_goes_way_back_ancient_ti_bbd8bf: "这可以追溯到远古时代，Amatsu已经没人记得了。"
  npc_override_job_ko_kagerou_oboro_good_i_think_you_ready_7332e6: "很好。我想你准备好了。"
  npc_override_job_ko_kagerou_oboro_good_test_you_about_take_6ee6b7: "很好！你即将进行的测试是^339CCC知识测试^000000。"
  npc_override_job_ko_kagerou_oboro_got_cursed_became_immobi_661106: "被诅咒并固定2分钟。"
  npc_override_job_ko_kagerou_oboro_ground_weapon_6ddcc4: "打磨武器。"
  npc_override_job_ko_kagerou_oboro_ha_ha_ha_cff240: "哈哈哈-"
  npc_override_job_ko_kagerou_oboro_ha_ha_ha_i_finish_575ea7: "哈哈哈。我会把故事讲完。"
  npc_override_job_ko_kagerou_oboro_ha_ha_ha_never_fun_a0967f: "哈哈哈。一次听完整的故事从来就不好玩，不是吗？通过一个测试后再回来，我会继续我的故事。"
  npc_override_job_ko_kagerou_oboro_ha_ha_ha_you_ll_31c67b: "哈哈哈。我们到那儿你就知道了。知识测试在这边进行。"
  npc_override_job_ko_kagerou_oboro_haven_t_given_up_ya_114694: "还没放弃，是吧。你真的觉得他会认可吗？"
  npc_override_job_ko_kagerou_oboro_he_keeps_talking_doesn_t_3731b7: "^1A95E6他一直在说个不停，没有停下来回答你的问题。^1A95E6"
  npc_override_job_ko_kagerou_oboro_he_like_jokes_conversati_f30554: "他喜欢玩笑和交谈胜过争吵，而且他喜欢女人胜过男人。"
  npc_override_job_ko_kagerou_oboro_he_s_short_silent_man_fe5919: "^000099(他是一个矮小的沉默男人。)^000000"
  npc_override_job_ko_kagerou_oboro_here_f43a11: "^0000FF{0}曾在这里。^000000"
  npc_override_job_ko_kagerou_oboro_hmm_a18d23: "嗯。{0}？"
  npc_override_job_ko_kagerou_oboro_hmm_embarrassing_speak_s_6e36e8: "嗯……真尴尬……这么突然开口说话……"
  npc_override_job_ko_kagerou_oboro_hmm_guess_i_expected_too_c848e1: "嗯……我猜我期望太高了？让我解释一下。"
  npc_override_job_ko_kagerou_oboro_hmm_i_don_t_know_1482a3: "嗯……我不知道为什么这部分故事一直流传至今，但这个人想把这两位战士团结在一起。"
  npc_override_job_ko_kagerou_oboro_hmm_interesting_dagger_s_7c526e: "嗯……有趣……是苦无形状的匕首吗？"
  npc_override_job_ko_kagerou_oboro_hmm_ordinary_huuma_2d2f7e: "嗯……这是普通的Huuma吗？"
  npc_override_job_ko_kagerou_oboro_hmm_you_as_slow_as_ea6435: "嗯？你比我想的要快！"
  npc_override_job_ko_kagerou_oboro_hmm_your_limit_2977c3: "嗯……这就是你的极限了吗？"
  npc_override_job_ko_kagerou_oboro_how_clan_started_0da883: "这就是部族的起源。"
  npc_override_job_ko_kagerou_oboro_how_did_go_afterwards_2acf3f: "后来怎么样了？"
  npc_override_job_ko_kagerou_oboro_how_did_you_get_here_239b35: "你怎么到这里的？"
  npc_override_job_ko_kagerou_oboro_how_did_you_get_weaker_99663c: "你怎么变弱了？恢复之前的等级后再来。"
  npc_override_job_ko_kagerou_oboro_i_admit_i_don_t_45b000: "我承认，我现在不明白你。"
  npc_override_job_ko_kagerou_oboro_i_believe_you_handle_tes_227fd3: "但我相信你能应付。生存测试在这边进行。"
  npc_override_job_ko_kagerou_oboro_i_change_your_quest_stat_d585e2: "我会将你的任务状态更改为转职前，但在此之前……"
  npc_override_job_ko_kagerou_oboro_i_created_refinement_too_037a06: "精炼工具是我自己辛苦制作的，所以你使用它们不会有任何麻烦。"
  npc_override_job_ko_kagerou_oboro_i_did_some_work_prototyp_ab9a90: "我对你制作的{0}原型做了一些加工。"
  npc_override_job_ko_kagerou_oboro_i_don_t_much_add_d0489d: "我没有什么要补充的，因为Gai和Joe已经说完了。"
  npc_override_job_ko_kagerou_oboro_i_feel_3643fe: "我能感觉到。"
  npc_override_job_ko_kagerou_oboro_i_guess_little_visit_coi_09c014: "我猜这次小小的拜访不是巧合，而是一段缘分的开始。"
  npc_override_job_ko_kagerou_oboro_i_hand_you_you_ve_7828ed: "我不得不佩服你。你选了一些很有竞争力的人。"
  npc_override_job_ko_kagerou_oboro_i_help_you_path_you_fb5d1c: "我可以在你选择的道路上帮助你，^33CC71{0}^000000之路。"
  npc_override_job_ko_kagerou_oboro_i_hope_blessings_kagerou_92d9e9: "愿Kagerou的祝福，如舞动的太阳，和Oboro的祝福，如朦胧的月光，与你未来的旅程同在。"
  npc_override_job_ko_kagerou_oboro_i_hope_you_blessed_find_67fd35: "愿你获得祝福，为自己找到最好的武器。现在你还对什么其他测试感到好奇？"
  npc_override_job_ko_kagerou_oboro_i_hope_you_haven_t_d8bcf4: "希望你专注于变强的同时没有荒废学业？"
  npc_override_job_ko_kagerou_oboro_i_know_you_curious_what_e973a0: "我知道你很好奇这些测试是什么。让我逐一解释。"
  npc_override_job_ko_kagerou_oboro_i_ll_continue_story_afte_a2c9ca: "你通过另一个测试后，我会继续讲故事。"
  npc_override_job_ko_kagerou_oboro_i_ll_give_you_another_8da2f3: "我会再给你一次机会。"
  npc_override_job_ko_kagerou_oboro_i_ll_let_you_go_9b6faf: "我现在让你走，所以去向首领Gion报告你的结果。"
  npc_override_job_ko_kagerou_oboro_i_ll_tell_you_once_509b20: "我再告诉你一次。目标是^FF0000部族秘密^000000。"
  npc_override_job_ko_kagerou_oboro_i_look_forward_your_resu_ef653e: "我期待你的结果。"
  npc_override_job_ko_kagerou_oboro_i_m_almost_end_my_099c68: "我的部族故事快讲完了。通过第三个测试后再回来，我会告诉你剩下的部分。"
  npc_override_job_ko_kagerou_oboro_i_m_just_sorry_environme_17391a: "我只是遗憾这些测试的环境本可以为我们后代做得更好。"
  npc_override_job_ko_kagerou_oboro_i_m_leader_gion_last_685396: "我是首领Gion，暗黑忍者部族的最后一人。"
  npc_override_job_ko_kagerou_oboro_i_m_ready_my_end_b407af: "我这边准备好了。你准备好测试了吗？"
  npc_override_job_ko_kagerou_oboro_i_m_sorry_i_almost_01bbf2: "抱歉我几乎忘了你们两个。你有什么要分享给{0}的吗？"
  npc_override_job_ko_kagerou_oboro_i_m_sorry_i_strangled_f0069a: "抱歉我们第一次见面时我勒了你的脖子。"
  npc_override_job_ko_kagerou_oboro_i_must_misjudged_you_you_2162db: "我一定看错你了。你可能对自己满意，但我不满意。再来一次！！"
  npc_override_job_ko_kagerou_oboro_i_named_your_weapons_my_74b905: "我自己给你的武器命了名，但我知道你会喜欢这个名字。"
  npc_override_job_ko_kagerou_oboro_i_remember_you_before_lo_13ea96: "我记得你以前来寻找忍者之路的样子。"
  npc_override_job_ko_kagerou_oboro_i_see_you_middle_test_d27eae: "我看到你正在进行^339CCC战斗测试^000000。你要回到测试场地吗？"
  npc_override_job_ko_kagerou_oboro_i_solve_any_problems_job_fa5d3a: "我可以解决转职任务中的任何问题。"
  npc_override_job_ko_kagerou_oboro_i_spoke_more_than_i_4be3ea: "我说的比我原本想的多。"
  npc_override_job_ko_kagerou_oboro_i_still_believe_you_stop_3a5afc: "我仍然相信你不会止步于此。"
  npc_override_job_ko_kagerou_oboro_i_t_rip_down_because_f52b96: "我不能撕下来，因为它不属于我。"
  npc_override_job_ko_kagerou_oboro_i_take_weapon_give_some_911eff: "我会拿走这把武器做一些最后的修饰。"
  npc_override_job_ko_kagerou_oboro_i_think_enough_get_you_e5378a: "我想这已经足够让你起步了，你不觉得吗？现在去制作那个原型！！"
  npc_override_job_ko_kagerou_oboro_i_think_i_left_off_268047: "我想我讲到两位战士作为敌人在战场相遇的时候了。"
  npc_override_job_ko_kagerou_oboro_i_think_s_because_someon_91b3d5: "我想这是因为有人想让我们放下过去，继续前进。"
  npc_override_job_ko_kagerou_oboro_i_thought_you_afraid_pat_6b7bbe: "我以为你害怕^33CC71{0}之路^33CC71，不会回来了。"
  npc_override_job_ko_kagerou_oboro_i_ve_set_pre_transfer_7c9262: "我已经设置了转职前状态。祝你好运！！"
  npc_override_job_ko_kagerou_oboro_i_wonder_if_joe_satisfie_ae1a70: "我想知道Joe是否对你的表现满意。"
  npc_override_job_ko_kagerou_oboro_if_draw_roll_dice_ac9f3b: "如果是平局，掷骰子。"
