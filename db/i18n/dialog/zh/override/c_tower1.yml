Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_c_tower1_quests_aldebaran_careful_your_choice_1d9810: "小心你的选择。"
  npc_override_c_tower1_quests_aldebaran_come_back_when_you_ve_83b2b7: "等你达到^0000FF150级^000000后再回来。"
  npc_override_c_tower1_quests_aldebaran_i_am_here_all_day_645241: "我整天都在这里保护冒险者的安全。我总是提醒他们危险的存在。这就是为什么我需要一些报酬。"
  npc_override_c_tower1_quests_aldebaran_i_m_begging_you_ask_6d204b: "我求你别再问了。这可能会危及你的生命。"
  npc_override_c_tower1_quests_aldebaran_i_m_sure_how_you_a5acdc: "我不确定你在里面怎么计算时间，但尽可能小心。"
  npc_override_c_tower1_quests_aldebaran_i_need_z_let_you_a1b924: "我需要^0000FF10,000z^000000才能让你进去。那是个相当危险的地方。"
  npc_override_c_tower1_quests_aldebaran_me_too_you_might_also_fb28d2: "我也是。你也可能是失踪者之一。毫无察觉，没有目的，也没有头绪。"
  npc_override_c_tower1_quests_aldebaran_menu_don_2e2d62: "别问了：去扭曲塔2楼：去扭曲塔3楼"
  npc_override_c_tower1_quests_aldebaran_menu_quit_f545f1: "退出：支付10,000z：你为什么需要钱？"
  npc_override_c_tower1_quests_aldebaran_menu_stay_63d029: "再待一会儿：请带我回去"
  npc_override_c_tower1_quests_aldebaran_menu_who_0bd3a8: "你是谁？：带我离开这里！"
  npc_override_c_tower1_quests_aldebaran_monsters_here_able_contr_8524ac: "这里的魔物能够控制时间。"
  npc_override_c_tower1_quests_aldebaran_perhaps_you_ve_seen_me_0daabb: "也许你以前见过我？"
  npc_override_c_tower1_quests_aldebaran_phew_you_ve_made_good_c20433: "呼……你做出了明智的选择。这个地方很残酷，所以你最好回到安全区域。"
  npc_override_c_tower1_quests_aldebaran_really_you_don_t_money_02c3cf: "真的？你没有钱还要求我带你去？"
  npc_override_c_tower1_quests_aldebaran_s_time_go_back_please_cff6f7: "该回去了。请更加珍惜你的时间。"
  npc_override_c_tower1_quests_aldebaran_s_time_move_you_favorite_14db40: "该继续前进了。你有最喜欢的饮料吗？"
  npc_override_c_tower1_quests_aldebaran_think_about_drink_cup_sl_366f51: "想象杯中的饮料。用勺子慢慢搅拌杯子，透过杯子看着饮料变色。"
  npc_override_c_tower1_quests_aldebaran_time_memories_environmen_2b54e5: "时间、记忆、环境……在这里都可能变得扭曲。"
  npc_override_c_tower1_quests_aldebaran_you_explain_me_what_you_41adb7: "你能向我解释你看到了什么，做了什么吗？"
  npc_override_c_tower1_quests_aldebaran_you_must_really_like_pla_f8ca73: "你一定很喜欢这个地方。好吧，随你便。"
  npc_override_c_tower1_quests_aldebaran_you_saw_me_different_pla_be9954: "你在不同的地方看到过不同样貌的我。"
