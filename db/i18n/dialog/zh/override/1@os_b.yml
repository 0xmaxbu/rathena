Body:
  npc_override_1@os_b_SealedOs_adventurer_here_too_d1e92c: "冒险者也在这里！"
  npc_override_1@os_b_SealedOs_ah_sorry_13c71e: "啊……抱歉……"
  npc_override_1@os_b_SealedOs_alright_17187c: "好吧。"
  npc_override_1@os_b_SealedOs_argh_43ffb4: "啊！"
  npc_override_1@os_b_SealedOs_better_just_go_around_do_d33130: "最好绕过这扇门走。"
  npc_override_1@os_b_SealedOs_didn_t_you_just_did_0e62e3: "你刚才不是做了吗？"
  npc_override_1@os_b_SealedOs_excuse_me_471adf: "打扰一下。"
  npc_override_1@os_b_SealedOs_finally_a39786: "终于……"
  npc_override_1@os_b_SealedOs_go_back_my_room_look_2f801b: "^FF0000回到我的房间，在窗户左侧找一个靠近花瓶的箱子。"
  npc_override_1@os_b_SealedOs_hello_0f4ebe: "你好{0}。"
  npc_override_1@os_b_SealedOs_how_did_you_sneak_here_f53d5c: "你是怎么溜进来的？"
  npc_override_1@os_b_SealedOs_how_you_always_fight_lik_98f9d5: "你怎么总是那样战斗？"
  npc_override_1@os_b_SealedOs_huh_efd3bc: "嗯！"
  npc_override_1@os_b_SealedOs_i_contact_few_people_any_4e08ff: "我反正要联系几个人，而且迪恩拿到她的护身符之前不会离开任何地方。"
  npc_override_1@os_b_SealedOs_i_don_t_see_adventurer_efe97c: "我也没看到冒险者~"
  npc_override_1@os_b_SealedOs_i_don_t_think_i_869783: "我觉得我没听错。是吗？"
  npc_override_1@os_b_SealedOs_i_eager_explore_area_bey_4cdd37: "我渴望探索这之外的区域。"
  npc_override_1@os_b_SealedOs_i_get_nervous_if_i_8c1f22: "如果没带它我会紧张。"
  npc_override_1@os_b_SealedOs_i_m_hurry_what_you_bc0f63: "我很急，你在这里做什么？"
  npc_override_1@os_b_SealedOs_i_m_so_excited_about_8c2c00: "我对此很兴奋~我年纪大了，厌倦了战斗。"
  npc_override_1@os_b_SealedOs_i_m_tired_b38b05: "我累了！"
  npc_override_1@os_b_SealedOs_i_m_tired_fighting_let_acea8c: "我厌倦了战斗，我们回去工作吧。"
  npc_override_1@os_b_SealedOs_i_think_i_ve_left_ab8e35: "我想我把它落下了。"
  npc_override_1@os_b_SealedOs_i_want_go_home_6cdaff: "我想回家。"
  npc_override_1@os_b_SealedOs_if_you_close_your_eyes_0bdceb: "如果你闭上眼睛一秒钟，可能会发生意外。"
  npc_override_1@os_b_SealedOs_if_you_cross_door_cff175: "如果你穿过这扇门……"
  npc_override_1@os_b_SealedOs_if_you_don_t_break_82b68d: "如果你不破坏另一边的机器，我们就无法通过！"
  npc_override_1@os_b_SealedOs_if_you_go_right_i_e9d7c3: "如果你往右走，我觉得不用破门就能从铁路回去。"
  npc_override_1@os_b_SealedOs_if_you_keep_secret_you_bcb0d3: "如果你保密你看到了我们……"
  npc_override_1@os_b_SealedOs_left_what_1ff5fd: "落下了什么？"
  npc_override_1@os_b_SealedOs_let_s_head_back_now_0942bc: "趁他们召集更多部队之前，我们现在回去吧。"
  npc_override_1@os_b_SealedOs_machine_stopped_strange_41a1ef: "- 管道破裂时，机器发出奇怪的声音停止了。 -"
  npc_override_1@os_b_SealedOs_menu_cotnes_013d04: "科特内斯：是啊~我厌倦了战斗，我们回去工作吧。路现在通了。"
  npc_override_1@os_b_SealedOs_menu_cotnes_100bbd: "科特内斯：你们两个真是的~请别打架了。"
  npc_override_1@os_b_SealedOs_menu_cotnes_452d32: "科特内斯：哦~是吗？我也没看到冒险者~"
  npc_override_1@os_b_SealedOs_menu_cotnes_4fef33: "科特内斯：这边~~。"
  npc_override_1@os_b_SealedOs_menu_cotnes_71807a: "科特内斯：那现在怎么办？我们已经进来了。"
  npc_override_1@os_b_SealedOs_menu_cotnes_afa392: "科特内斯：哦，这扇门太难了吗？破门需要一些时间。"
  npc_override_1@os_b_SealedOs_menu_cotnes_d55da2: "科特内斯：我对此很兴奋~我年纪大了，厌倦了战斗。"
  npc_override_1@os_b_SealedOs_menu_crush_8e0670: "砸碎它。:放下它。"
  npc_override_1@os_b_SealedOs_menu_dien_039d60: "迪恩：哦！如果你往右走，我觉得不用破门就能从铁路回去"
  npc_override_1@os_b_SealedOs_menu_dien_063019: "迪恩：冒险者也在这里！你为什么害怕！"
  npc_override_1@os_b_SealedOs_menu_dien_2f392b: "迪恩：我们会处理这边。请处理那边那些恶心的家伙！"
  npc_override_1@os_b_SealedOs_menu_dien_433ce1: "迪恩：是吗？"
  npc_override_1@os_b_SealedOs_menu_dien_52b949: "迪恩：如果你不破坏另一边的机器，我们就无法通过！"
  npc_override_1@os_b_SealedOs_menu_dien_533a76: "迪恩：很危险所以请跟我们来。"
  npc_override_1@os_b_SealedOs_menu_dien_7ba144: "迪恩：你怎么总是那样战斗？"
  npc_override_1@os_b_SealedOs_menu_dien_94222a: "迪恩：哦天哪……真是个惊喜！"
  npc_override_1@os_b_SealedOs_menu_dien_b629f5: "迪恩：我们是来这里办事的……告诉年轻人太麻烦了。"
  npc_override_1@os_b_SealedOs_menu_dien_de8564: "迪恩：如果你保密你看到了我们……"
  npc_override_1@os_b_SealedOs_menu_dien_f09352: "迪恩：最好绕过这扇门走。"
  npc_override_1@os_b_SealedOs_menu_est_138ce3: "埃斯特：我很急，你在这里做什么？"
  npc_override_1@os_b_SealedOs_menu_est_35d72a: "埃斯特：请回去优雅地享用你的茶。"
  npc_override_1@os_b_SealedOs_menu_est_45b16c: "埃斯特：这只是例行监视。"
  npc_override_1@os_b_SealedOs_menu_est_dc30c1: "埃斯特：如果你闭上眼睛一秒钟，可能会发生意外。"
  npc_override_1@os_b_SealedOs_menu_ridsh_1a492a: "里德什：没办法~~我们得跟冒险者走。"
  npc_override_1@os_b_SealedOs_menu_ridsh_28002e: "里德什：姐姐~~你在说什么，我没看到冒险者！"
  npc_override_1@os_b_SealedOs_menu_ridsh_39e7ab: "里德什：设备还没关。请帮我看看上面。"
  npc_override_1@os_b_SealedOs_menu_ridsh_3cc77d: "里德什：嗯！你是怎么溜进来的？"
  npc_override_1@os_b_SealedOs_menu_ridsh_60420a: "里德什：好吧！我们沿着铁轨向上移动！"
  npc_override_1@os_b_SealedOs_menu_ridsh_966e0b: "里德什：太好了！路通了。我们沿着铁轨移动！"
  npc_override_1@os_b_SealedOs_menu_ridsh_ae58e1: "里德什：哦？你在这里做什么。"
  npc_override_1@os_b_SealedOs_menu_ridsh_c5b699: "里德什：你凭什么认为我们需要你的帮助？"
  npc_override_1@os_b_SealedOs_menu_ridsh_e25f00: "里德什：我们有麻烦了~~我们不能让任何人知道我们在这里~~"
  npc_override_1@os_b_SealedOs_menu_ridsh_e98929: "里德什：关掉底部的设备，我们来对付敌人。"
  npc_override_1@os_b_SealedOs_menu_ridsh_f2af73: "里德什：啊！"
  npc_override_1@os_b_SealedOs_msg_5bab61: "？"
  npc_override_1@os_b_SealedOs_msg_6eae3a: "……"
  npc_override_1@os_b_SealedOs_my_protection_charm_81e182: "我的护身符！"
  npc_override_1@os_b_SealedOs_nothing_happened_d3225d: "- 什么都没发生。 -"
  npc_override_1@os_b_SealedOs_oh_0fd77a: "哦？"
  npc_override_1@os_b_SealedOs_oh_5235ff: "哦！"
  npc_override_1@os_b_SealedOs_oh_78a2fc: "哦……"
  npc_override_1@os_b_SealedOs_oh_9f7455: "哦~"
  npc_override_1@os_b_SealedOs_oh_gate_too_hard_19f4b9: "哦，这扇门太难了吗？"
  npc_override_1@os_b_SealedOs_oh_my_i_think_s_df0c0c: "哦天哪！我觉得这是废弃矿井里放置的精密设备。"
  npc_override_1@os_b_SealedOs_oh_my_oh_my_bd4b12: "哦天哪，哦天哪！"
  npc_override_1@os_b_SealedOs_oh_my_what_s_thing_ef4ca5: "哦天哪！前面那个东西是什么？"
  npc_override_1@os_b_SealedOs_only_surveillance_routin_61e0ca: "这只是例行监视。"
  npc_override_1@os_b_SealedOs_please_go_back_enjoy_you_be8900: "请回去优雅地享用你的茶。"
  npc_override_1@os_b_SealedOs_please_me_favor_604ac7: "请帮我个忙。"
  npc_override_1@os_b_SealedOs_please_stop_fighting_83fbd4: "请别打架了。"
  npc_override_1@os_b_SealedOs_road_open_now_d852da: "路现在通了。"
  npc_override_1@os_b_SealedOs_s_dangerous_go_through_r_8eebc3: "现在通过很危险，所以我们转身去设备那边吧！"
  npc_override_1@os_b_SealedOs_s_dangerous_so_please_co_764ab4: "很危险，所以请跟我们来。"
  npc_override_1@os_b_SealedOs_s_good_sometimes_take_qu_45ea5f: "偶尔这样快速散步也不错~"
  npc_override_1@os_b_SealedOs_s_hard_me_get_back_1f0cd4: "因为很远，我很难回去取……"
  npc_override_1@os_b_SealedOs_should_easy_get_since_we_18f8f1: "既然我们在这里，应该很容易拿到。"
  npc_override_1@os_b_SealedOs_shouldn_t_we_tell_them_2eb04a: "我们不应该告诉他们我们在哪里吗？"
  npc_override_1@os_b_SealedOs_sister_2af148: "姐姐~~"
  npc_override_1@os_b_SealedOs_sister_tell_me_where_dc7e6f: "姐姐，告诉我它在哪里。"
  npc_override_1@os_b_SealedOs_so_10b991: "是吗？"
  npc_override_1@os_b_SealedOs_so_what_now_f1a367: "那现在怎么办？"
  npc_override_1@os_b_SealedOs_t_helped_9e9cd2: "没办法~~"
  npc_override_1@os_b_SealedOs_take_some_time_break_6f671a: "破门需要一些时间~"
  npc_override_1@os_b_SealedOs_thank_you_so_much_24f75a: "非常感谢你"
  npc_override_1@os_b_SealedOs_there_pipe_going_through_22ef49: "- 有一根管道穿过地板。 -"
  npc_override_1@os_b_SealedOs_we_go_adventurer_c26430: "我们得跟冒险者走。"
  npc_override_1@os_b_SealedOs_we_re_already_inside_794a67: "我们已经进来了。"
  npc_override_1@os_b_SealedOs_we_re_trouble_f15c1f: "我们有麻烦了~~"
  npc_override_1@os_b_SealedOs_we_t_anyone_know_we_7d838f: "我们不能让任何人知道我们在这里~~"
  npc_override_1@os_b_SealedOs_we_ve_came_here_somethin_907a0f: "我们是来这里办事的……告诉年轻人太麻烦了。"
  npc_override_1@os_b_SealedOs_what_makes_you_think_we_5fa2a8: "你凭什么认为我们需要你的帮助？"
  npc_override_1@os_b_SealedOs_what_should_we_88dcb0: "我们该怎么办！"
  npc_override_1@os_b_SealedOs_what_you_doing_here_74351b: "你在这里做什么？"
  npc_override_1@os_b_SealedOs_what_you_talking_about_i_6e9f37: "你在说什么，我没看到冒险者！"
  npc_override_1@os_b_SealedOs_while_we_open_last_door_213521: "当我们打开最后一扇门时，你愿意回到^FF0000克拉娜·内米耶里^000000吗？"
  npc_override_1@os_b_SealedOs_why_d77989: "为什么？"
  npc_override_1@os_b_SealedOs_why_what_s_going_0458e0: "为什么，怎么了？"
  npc_override_1@os_b_SealedOs_why_you_scared_21da46: "你为什么害怕！"
  npc_override_1@os_b_SealedOs_yeah_2fce79: "是吗？"
  npc_override_1@os_b_SealedOs_yeah_3e2b3d: "是啊~"
  npc_override_1@os_b_SealedOs_you_two_really_ee98a7: "你们两个真是的~"
  npc_override_1@os_b_SealedOs_you_ve_been_fine_so_073882: "你之前没有它不也挺好的吗？！"