  npc_override_moro_vol_quests_14_3_bis_menu_our_be4ea8: "面对共同的敌人——魔神，我们的敌人就是我们的朋友。"
  npc_override_moro_vol_quests_14_3_bis_menu_this_b9f8f3: "这就是冒险的美妙之处："
  npc_override_moro_vol_quests_14_3_bis_menu_this_c00110: "这证实了我的猜测："
  npc_override_moro_vol_quests_14_3_bis_menu_which_32b08d: "你更愿意做哪个：去讨伐魔神还是在艾音布罗克站岗？"
  npc_override_moro_vol_quests_14_3_bis_menu_yes_845370: "是的，这跟之前拜托你的事一样："
  npc_override_moro_vol_quests_14_3_bis_menu_you_a43543: "你肯定闲得慌吧，异教徒：你居然真的把所有^FF0000怪物之血^000000都带来了。"
  npc_override_moro_vol_quests_14_3_bis_midgard_1ee82d: "为了米德加尔特！"
  npc_override_moro_vol_quests_14_3_bis_might_await_me_base_a530e2: "在基地里等待我的种种。"
  npc_override_moro_vol_quests_14_3_bis_might_something_dimensio_a501f1: "这可能和次元裂缝有关。"
  npc_override_moro_vol_quests_14_3_bis_mindful_opening_s_quite_3cbbae: "注意洞口。它非常窄。"
  npc_override_moro_vol_quests_14_3_bis_moan_05564c: "（呻吟声）"
  npc_override_moro_vol_quests_14_3_bis_moan_heard_underneath_pi_1aebde: "——一堆破布下面传出了呻吟声。——"
  npc_override_moro_vol_quests_14_3_bis_moment_my_soldiers_take_c1c369: "从这一刻起，我的士兵们接手了。"
  npc_override_moro_vol_quests_14_3_bis_moment_they_hit_our_bodi_2d6fc4: "当它们击中我们身体的那一刻，就会随着一声巨响变成花瓣！"
  npc_override_moro_vol_quests_14_3_bis_moment_they_hit_our_bodi_f1b2ac: "当它们击中我们身体的那一刻，"
  npc_override_moro_vol_quests_14_3_bis_morocc_gone_yet_his_temp_b9ada5: "梦罗克已不在，但他的神殿依然矗立。"
  npc_override_moro_vol_quests_14_3_bis_morocc_here_somewhere_f46eb2: "梦罗克就在附近的某个地方。"
  npc_override_moro_vol_quests_14_3_bis_morocc_reincarnations_in_029665: "梦罗克转生体也入侵了这里，其中一些明显非常强大。"
  npc_override_moro_vol_quests_14_3_bis_most_all_i_finally_enjoy_5167b7: "最重要的是，我终于能享受火焰的温暖了！"
