Body:
  npc_override_moro_vol_quests_14_3_bis_abidal_enough_067d47: "阿比达尔，够了！"
  npc_override_moro_vol_quests_14_3_bis_above_all_55065d: "最重要的是……"
  npc_override_moro_vol_quests_14_3_bis_accept_3e1999: "接受。"
  npc_override_moro_vol_quests_14_3_bis_according_my_intel_demon_03c18a: "根据我的情报，魔神有几个手下。"
  npc_override_moro_vol_quests_14_3_bis_actually_first_scout_nam_c30e40: "其实第一个侦察兵给它起了名字，这个名字就这么传开了。"
  npc_override_moro_vol_quests_14_3_bis_adjust_timer_981a8c: "调整计时器"
  npc_override_moro_vol_quests_14_3_bis_adventurer_tamarin_his_p_15b887: "冒险者塔玛林和他的队伍踏上了前往未知之地——异世界的旅程。"
  npc_override_moro_vol_quests_14_3_bis_after_all_his_only_trans_378e43: "毕竟，他唯一的过错就是太热爱科学了。"
  npc_override_moro_vol_quests_14_3_bis_after_few_days_having_no_bc9828: "几天没有东西吃之后，我开始捡地上的任何东西来吃，结果拉了有史以来最严重的肚子。"
  npc_override_moro_vol_quests_14_3_bis_after_he_disappeared_i_p_4a72f8: "在他消失之后，我说服了长老们，我们必须加入讨伐魔神的行列。"
  npc_override_moro_vol_quests_14_3_bis_after_i_m_going_go_6ddf2e: "这之后，我就要回家了……"
  npc_override_moro_vol_quests_14_3_bis_again_eff7e4: "然后，"
  npc_override_moro_vol_quests_14_3_bis_again_he_lost_consciousn_921101: "——他又一次失去了意识，光是说话就已经精疲力竭了。"
  npc_override_moro_vol_quests_14_3_bis_ah_971301: "啊……"
  npc_override_moro_vol_quests_14_3_bis_ah_ea8df1: "啊，"
  npc_override_moro_vol_quests_14_3_bis_ah_i_m_too_inexperienced_df9d2c: "啊，我太缺乏经验和力量了，对它们束手无策。"
  npc_override_moro_vol_quests_14_3_bis_ah_our_hero_back_965130: "啊，我们的英雄回来了！"
  npc_override_moro_vol_quests_14_3_bis_ahem_b7d248: "咳咳。"
  npc_override_moro_vol_quests_14_3_bis_all_burning_feathers_41a5c4: "所有^FF000015根燃烧之羽^000000。"
  npc_override_moro_vol_quests_14_3_bis_all_clear_ab45f5: "全部清除。"
  npc_override_moro_vol_quests_14_3_bis_all_clear_b6125e: "全部清除！"
  npc_override_moro_vol_quests_14_3_bis_all_right_441c8d: "好的。"
  npc_override_moro_vol_quests_14_3_bis_all_right_doom_prayers_3e9d94: "好的，末日祈祷者们！"
  npc_override_moro_vol_quests_14_3_bis_all_right_i_ll_ask_d7b7fe: "好吧，我去问问别人。"
  npc_override_moro_vol_quests_14_3_bis_all_right_i_ll_prove_e69df7: "好吧，我来证明给你看！"
  npc_override_moro_vol_quests_14_3_bis_all_right_then_21b60f: "好吧，那么。"
  npc_override_moro_vol_quests_14_3_bis_all_right_then_i_ll_8fd800: "好吧，那我只好"
  npc_override_moro_vol_quests_14_3_bis_all_stray_globes_mana_or_fc3cad: "宝珠散落的魔力球还没有全部回收，"
  npc_override_moro_vol_quests_14_3_bis_all_those_monsters_5ae392: "在所有那些怪物中，"
  npc_override_moro_vol_quests_14_3_bis_all_too_terrifying_cdd615: "这一切太可怕了……"
  npc_override_moro_vol_quests_14_3_bis_all_you_just_hit_dispers_77c4e0: "你只需要击打并驱散魔神殿中游荡的魔力球就可以了。"
  npc_override_moro_vol_quests_14_3_bis_although_lot_things_happ_b5bd25: "……虽然发生了很多事，但我还在等你完成我第一个请求呢！"
  npc_override_moro_vol_quests_14_3_bis_amazing_ccfd41: "了不起。"
  npc_override_moro_vol_quests_14_3_bis_animated_demon_god_s_evi_9f1ca4: "那些箱子被魔神的邪气所驱动，在盆地里横冲直撞。"
  npc_override_moro_vol_quests_14_3_bis_area_dangerous_772020: "这一带很危险。"
  npc_override_moro_vol_quests_14_3_bis_area_well_17c892: "这个地方……嗯，"
  npc_override_moro_vol_quests_14_3_bis_aren_t_you_excited_becau_e6925f: "你不激动吗？反正我很激动！哈哈！"
  npc_override_moro_vol_quests_14_3_bis_aren_t_you_going_08e955: "你不进去吗？"
  npc_override_moro_vol_quests_14_3_bis_argh_43ffb4: "啊！"
  npc_override_moro_vol_quests_14_3_bis_argh_i_m_just_gonna_98a4f5: "啊，我要当逃兵了！"
  npc_override_moro_vol_quests_14_3_bis_argh_i_m_scared_9496da: "啊，好害怕！"
  npc_override_moro_vol_quests_14_3_bis_arrgh_07fa12: "啊啊！"
  npc_override_moro_vol_quests_14_3_bis_as_far_as_others_know_708b27: "在外人看来，阿邦特只负责我和卡尔。"
  npc_override_moro_vol_quests_14_3_bis_as_things_stand_i_no_312f53: "照目前的情况来看，短期内我是回不了大陆了。"
  npc_override_moro_vol_quests_14_3_bis_as_you_suspected_ahat_is_871e8e: "正如你所料，阿哈特不是萨帕人。"
  npc_override_moro_vol_quests_14_3_bis_ask_him_more_straightfor_73f932: "让他说话直白一些。"
  npc_override_moro_vol_quests_14_3_bis_avant_knows_about_orb_s_ee69dc: "阿邦特比任何人都了解宝珠的魔力。"
  npc_override_moro_vol_quests_14_3_bis_avant_s_over_there_you_9b9633: "阿邦特就在那边。如果你愿意的话，可以去问他。"
  npc_override_moro_vol_quests_14_3_bis_aww_err_0ca065: "啊！呃！"
  npc_override_moro_vol_quests_14_3_bis_aww_i_m_scared_7246f7: "啊……好害怕……"
  npc_override_moro_vol_quests_14_3_bis_aww_kyaaooh_e2bcf4: "啊！呀哦——！"
  npc_override_moro_vol_quests_14_3_bis_aww_scary_270098: "啊，好可怕！"
  npc_override_moro_vol_quests_14_3_bis_aww_ugh_a9e95b: "啊……呃……"
  npc_override_moro_vol_quests_14_3_bis_back_off_humanling_eca9a1: "退后，人类小鬼！"
  npc_override_moro_vol_quests_14_3_bis_back_off_s_dangerous_6db24b: "退后——很危险！"
  npc_override_moro_vol_quests_14_3_bis_bad_rookie_1ae50a: "不错嘛，菜鸟。"
  npc_override_moro_vol_quests_14_3_bis_bad_you_guys_6b3a08: "不错嘛！你们这帮家伙……"
  npc_override_moro_vol_quests_14_3_bis_bah_i_m_cold_hungry_8aa7ca: "唉，我又冷又饿……哦，我只是在自言自语。"
  npc_override_moro_vol_quests_14_3_bis_barf_0f208c: "（呕）"
  npc_override_moro_vol_quests_14_3_bis_bigger_stronger_184625: "但更大更强。"
  npc_override_moro_vol_quests_14_3_bis_biggest_gift_i_give_cddb12: "我能给予的最大馈赠。"
  npc_override_moro_vol_quests_14_3_bis_blazing_freezing_reincar_99b543: "在灼热和冰冷转生体中，你能找到一些魔力结晶。"
  npc_override_moro_vol_quests_14_3_bis_blood_blood_go_1141d3: "以血祭血，冲啊~~"
  npc_override_moro_vol_quests_14_3_bis_boo_0ba64e: "噗！"
  npc_override_moro_vol_quests_14_3_bis_braces_himself_inhales_a5588a: "（深吸一口气。）"
  npc_override_moro_vol_quests_14_3_bis_bring_blood_monsters_roa_fcb3b4: "带来在末日之地游荡的怪物之血。"
  npc_override_moro_vol_quests_14_3_bis_bring_me_5a6104: "给我带来"
  npc_override_moro_vol_quests_14_3_bis_bring_me_fire_golem_s_53e8af: "给我带来30个^FF0000火焰石巨人的石齿^000000和30个^FF0000火焰蜥蜴人的后颈^000000。"
  npc_override_moro_vol_quests_14_3_bis_bring_them_least_kardui_07a281: "至少为了依克拉盖的卡尔杜伊带回来吧。"
  npc_override_moro_vol_quests_14_3_bis_brothers_sisters_calm_do_c6b659: "兄弟姐妹们，冷静下来！"
  npc_override_moro_vol_quests_14_3_bis_burning_feathers_4c5be5: "15根^FF0000燃烧之羽^000000"
  npc_override_moro_vol_quests_14_3_bis_burp_8961d9: "（嗝）"
  npc_override_moro_vol_quests_14_3_bis_cannot_progress_dialogue_4bf136: "——由于携带的道具过多，无法继续对话。——"
  npc_override_moro_vol_quests_14_3_bis_careful_burn_yourself_pr_d2d089: "小心别在这个过程中被烧伤了。"
  npc_override_moro_vol_quests_14_3_bis_careful_they_ambush_you_6126bb: "小心——它们会伏击你，趁你不注意抢走^FF0000侦察兵日志^000000。"
  npc_override_moro_vol_quests_14_3_bis_chomp_chomp_494a15: "（吧唧吧唧）"
  npc_override_moro_vol_quests_14_3_bis_clock_initialized_9828cb: "时钟已初始化。"
  npc_override_moro_vol_quests_14_3_bis_collect_blessing_stones_d73d6c: "并收集40个^FF0000祝福之石^000000？"
  npc_override_moro_vol_quests_14_3_bis_collecting_plant_specime_bda4bb: "收集植物标本听起来不太难。我们可以分工来做。"
  npc_override_moro_vol_quests_14_3_bis_color_drains_his_face_452d43: "他的脸色变得苍白。"
  npc_override_moro_vol_quests_14_3_bis_come_4baa03: "来吧，"
  npc_override_moro_vol_quests_14_3_bis_come_back_safely_33c1cb: "平安回来。"
  npc_override_moro_vol_quests_14_3_bis_come_back_safely_you_hea_94f33b: "平安回来，听到了吗？"
  npc_override_moro_vol_quests_14_3_bis_come_back_when_you_becom_1421db: "等你变强了再来。"
  npc_override_moro_vol_quests_14_3_bis_come_back_whenever_you_a62816: "有空随时来。"
  npc_override_moro_vol_quests_14_3_bis_come_hit_us_hard_737d87: "来吧，用力打我们！"
  npc_override_moro_vol_quests_14_3_bis_congratulations_36b252: "恭喜！"
  npc_override_moro_vol_quests_14_3_bis_correct_my_army_isn_t_85c991: "没错。我的军队没得到多少支援，因为这次远征完全是我一个人的主意。"
  npc_override_moro_vol_quests_14_3_bis_cough_f1e73e: "咳！"
  npc_override_moro_vol_quests_14_3_bis_could_procreate_powerful_731dce: "能繁殖出强大的变异体，"
  npc_override_moro_vol_quests_14_3_bis_could_spread_deadly_viru_198ea6: "能传播致命病毒，"
  npc_override_moro_vol_quests_14_3_bis_could_you_check_number_y_07cbb3: "你能检查一下你手中的索尼亚茎数量吗？"
  npc_override_moro_vol_quests_14_3_bis_could_you_exterminate_th_2fd3d2: "你能消灭它们并帮我确认它们的身份吗？"
  npc_override_moro_vol_quests_14_3_bis_could_you_go_back_temple_b82bed: "你能再去一次魔神殿吗？"
  npc_override_moro_vol_quests_14_3_bis_course_i_m_nervous_you_ced055: "我当然紧张了。这还用问吗。"
  npc_override_moro_vol_quests_14_3_bis_creepy_cb820f: "好瘆人……"
  npc_override_moro_vol_quests_14_3_bis_d_don_t_come_closer_f9b0b4: "别、别过来！"
  npc_override_moro_vol_quests_14_3_bis_damage_received_upon_bre_cf4dc2: "他的封印被打破时受到的伤害。"
  npc_override_moro_vol_quests_14_3_bis_dangerous_past_point_ple_bc316e: "前方危险。请后退。"
  npc_override_moro_vol_quests_14_3_bis_dangerous_place_no_backu_4d56a2: "在这没有后援的危险之地！"
  npc_override_moro_vol_quests_14_3_bis_dawn_80e6b4: "在黎明~"
  npc_override_moro_vol_quests_14_3_bis_day_when_destruction_wor_217e5c: "世界毁灭之日降临之时，"
  npc_override_moro_vol_quests_14_3_bis_day_when_destruction_wor_f106d9: "世界毁灭之日降临。"
  npc_override_moro_vol_quests_14_3_bis_defeating_morocc_you_bee_ba129c: "击败梦罗克后，你获得了额外10%服务器经验值奖励，持续1小时。"
  npc_override_moro_vol_quests_14_3_bis_definitely_looks_abysmal_b9872f: "这地方确实够阴森，正适合他那种人出没。"
  npc_override_moro_vol_quests_14_3_bis_delicious_huh_671b3a: "好吃吧？"
  npc_override_moro_vol_quests_14_3_bis_demon_god_f1019b: "魔神！"
  npc_override_moro_vol_quests_14_3_bis_deserve_such_kindness_6e75c3: "配得上这样的善意。"
  npc_override_moro_vol_quests_14_3_bis_destruction_blessing_0ff743: "毁灭即是恩赐！"
  npc_override_moro_vol_quests_14_3_bis_destruction_blessing_3ffab4: "毁灭！恩赐！"
  npc_override_moro_vol_quests_14_3_bis_destruction_blessing_b2bd6e: "毁灭！就！是！恩赐！"
  npc_override_moro_vol_quests_14_3_bis_did_you_already_find_d15867: "你已经找到了"
  npc_override_moro_vol_quests_14_3_bis_did_you_come_back_haven_f0b1de: "你是回来了还是压根没走？"
  npc_override_moro_vol_quests_14_3_bis_did_you_come_help_us_efb23b: "你是来帮助我们讨伐魔神的吗？"
  npc_override_moro_vol_quests_14_3_bis_did_you_come_laugh_my_ee9016: "你是像其他人一样，来看我笑话的吗？"
  npc_override_moro_vol_quests_14_3_bis_did_you_find_scout_bfcd78: "你找到侦察兵了吗？"
  npc_override_moro_vol_quests_14_3_bis_did_you_notice_worrisome_6ea701: "你注意到我脸上担忧的表情了吗？"
  npc_override_moro_vol_quests_14_3_bis_did_you_see_instructor_r_18e460: "你见到鲁根教官了吗？"
  npc_override_moro_vol_quests_14_3_bis_dirty_demons_85b8fe: "肮脏的恶魔。"
  npc_override_moro_vol_quests_14_3_bis_doesn_t_inspire_you_help_b7cd8c: "这难道不激励你来帮助我吗？"
  npc_override_moro_vol_quests_14_3_bis_doing_everything_they_pe_7cf1f3: "竭尽全力来骚扰我们。"
  npc_override_moro_vol_quests_14_3_bis_don_t_afraid_if_you_d29916: "就算你连波利都打不过也不要害怕；"
  npc_override_moro_vol_quests_14_3_bis_don_t_compare_us_those_b91b30: "别把我们跟那些长翅膀的混蛋相提并论！"
  npc_override_moro_vol_quests_14_3_bis_don_t_i_sound_pitiful_6e9837: "我听起来是不是很可怜？"
  npc_override_moro_vol_quests_14_3_bis_don_t_worry_i_m_62de7e: "别担心。有我保护你。"
  npc_override_moro_vol_quests_14_3_bis_don_t_worry_i_ve_ed4cb2: "别担心。我已经派出先遣队了。"
  npc_override_moro_vol_quests_14_3_bis_done_55823e: "完成了！"
  npc_override_moro_vol_quests_14_3_bis_doom_prayers_ac7112: "末日祈祷者们！"
  npc_override_moro_vol_quests_14_3_bis_doom_prayers_charge_forw_ba031c: "末日祈祷者们，向前冲锋，摧毁前方一切障碍，无畏地赤手空拳击打那些危险的怪物！"
  npc_override_moro_vol_quests_14_3_bis_doom_prayers_don_t_panic_2fb063: "末日祈祷者们，不要慌张！保持冷静！"
  npc_override_moro_vol_quests_14_3_bis_doomsland_fa571b: "末日之地？"
  npc_override_moro_vol_quests_14_3_bis_dr_tiblack_sent_you_so_5d5c13: "是提布拉克博士派你来的，所以我应该相信你。"
  npc_override_moro_vol_quests_14_3_bis_enjoy_living_until_end_w_d7ca03: "享受在世界末日到来之前的时光吧。"
  npc_override_moro_vol_quests_14_3_bis_enjoying_leisurely_walk_35deb3: "悠闲地散步。"
  npc_override_moro_vol_quests_14_3_bis_enough_budget_problem_3d80c1: "别再提预算问题了！"
  npc_override_moro_vol_quests_14_3_bis_enter_0abb0f: "进入。"
  npc_override_moro_vol_quests_14_3_bis_enveloped_cloud_vile_sti_97398a: "笼罩在一团恶臭之中，他沉默不语。"
  npc_override_moro_vol_quests_14_3_bis_environmental_characteri_c1258f: "这个地区的环境特征使得调查工作过于困难。"
  npc_override_moro_vol_quests_14_3_bis_err_i_m_scared_3fc5e2: "呃，好害怕！"
  npc_override_moro_vol_quests_14_3_bis_even_elders_acknowledged_340308: "就连长老们都承认了他的才华，决定饶他一命。"
  npc_override_moro_vol_quests_14_3_bis_even_kar_i_barely_stand_9b05ce: "就连我和卡尔都受不了阿邦特，但他真的需要你的帮助。"
  npc_override_moro_vol_quests_14_3_bis_every_monster_i_kill_one_79117c: "每杀掉一只怪物，就会冒出一只甚至更多来填补空缺。"
  npc_override_moro_vol_quests_14_3_bis_everyone_else_pretty_muc_1672cd: "其他人几乎都忘了他曾经存在过。"
  npc_override_moro_vol_quests_14_3_bis_everyone_else_who_went_t_e25173: "其他去过那里的人^0000FF都因为岩石释放的有毒气体而陷入昏迷^000000。"
  npc_override_moro_vol_quests_14_3_bis_everything_her_bce564: "一切都是她的意志。"
  npc_override_moro_vol_quests_14_3_bis_everywhere_burning_fire_c14a91: "到处都燃烧着火焰，但空气并不令人窒息。"
  npc_override_moro_vol_quests_14_3_bis_exchange_i_ll_give_you_83e13d: "作为交换，我会给你和你的队伍"
  npc_override_moro_vol_quests_14_3_bis_exhaling_through_his_mou_fa5128: "（用嘴呼气）"
  npc_override_moro_vol_quests_14_3_bis_feeding_me_though_feed_t_ab7054: "给我吃的，虽然那饲料难吃得要命。"
  npc_override_moro_vol_quests_14_3_bis_feels_great_7ee45a: "太爽了！"
  npc_override_moro_vol_quests_14_3_bis_fight_demons_ddcb25: "与恶魔战斗。"
