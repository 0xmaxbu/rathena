  npc_override_moro_vol_quests_14_3_bis_long_story_short_2e2f01: "长话短说，"
  npc_override_moro_vol_quests_14_3_bis_long_time_no_see_757685: "好久不见。"
  npc_override_moro_vol_quests_14_3_bis_look_cc30b5: "你看！"
  npc_override_moro_vol_quests_14_3_bis_look_forward_effe1e: "期待吧~"
  npc_override_moro_vol_quests_14_3_bis_looking_you_i_t_help_f73e33: "看着你，我不禁感慨起我们的处境。"
  npc_override_moro_vol_quests_14_3_bis_loud_13bec5: "……好吵。"
  npc_override_moro_vol_quests_14_3_bis_lowering_his_voice_a1edba: "（压低声音）"
  npc_override_moro_vol_quests_14_3_bis_make_those_demon_runts_s_af2fbc: "让那些恶魔小崽子变得那么强大。"
  npc_override_moro_vol_quests_14_3_bis_making_new_friends_a2cb73: "结交新朋友！"
  npc_override_moro_vol_quests_14_3_bis_matter_pride_b5f83a: "这是尊严的问题。"
