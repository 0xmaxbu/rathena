  npc_override_moro_vol_quests_14_3_bis_may_i_soul_shard_8e0b44: "我能收下这个灵魂碎片吗？"
  npc_override_moro_vol_quests_14_3_bis_may_take_while_me_get_feed8c: "我可能需要一些时间来打包所有东西，趁这段时间你先去忙别的事吧。"
  npc_override_moro_vol_quests_14_3_bis_may_yggdrasil_bless_you_410c17: "愿世界树保佑你。"
  npc_override_moro_vol_quests_14_3_bis_maybe_i_didn_t_pray_74b718: "也许我祈祷得还不够虔诚。"
  npc_override_moro_vol_quests_14_3_bis_maybe_i_gave_you_too_1e4300: "也许我太高估你了。"
  npc_override_moro_vol_quests_14_3_bis_maybe_i_should_use_oppor_be3124: "也许我应该趁这个机会去了解拉斐恩人。"
  npc_override_moro_vol_quests_14_3_bis_maybe_my_faith_isn_t_e8897e: "也许我的信仰还不够深……"
  npc_override_moro_vol_quests_14_3_bis_maybe_s_how_demon_god_bb1ecd: "也许魔神就是这样招募士兵的。"
  npc_override_moro_vol_quests_14_3_bis_maybe_you_could_help_me_513af4: "也许你能帮我确认我的猜测。"
  npc_override_moro_vol_quests_14_3_bis_me_66ea46: "给我。"
  npc_override_moro_vol_quests_14_3_bis_meet_me_front_hidden_cra_a994bc: "到^0000FF隐秘裂缝^000000前来见我。确保没人跟踪你。"
  npc_override_moro_vol_quests_14_3_bis_menu_advance_1e2803: "前线基地守卫：怪物们，别想靠近我的基地一步！"
  npc_override_moro_vol_quests_14_3_bis_menu_advance_36c4db: "前线基地守卫：站住，怪物们！不许靠近我们的圣地！"
  npc_override_moro_vol_quests_14_3_bis_menu_advance_c707ea: "前线基地守卫：退散，怪物们！这片土地属于圣光军团！"
  npc_override_moro_vol_quests_14_3_bis_menu_advance_e521f3: "前线基地守卫：堕落之物，我命你回归冥界。"
  npc_override_moro_vol_quests_14_3_bis_menu_be_6cdf0a: "小心：这个地方到处都是危险的怪物。"
  npc_override_moro_vol_quests_14_3_bis_menu_commander_0d8d24: "指挥官：士兵们，终于到了检验你们训练成果的时候了！"
  npc_override_moro_vol_quests_14_3_bis_menu_commander_c972c3: "指挥官：我们打击邪恶！"
  npc_override_moro_vol_quests_14_3_bis_menu_commander_f787cb: "指挥官：我们是！"
  npc_override_moro_vol_quests_14_3_bis_menu_current_972b9f: "当前服务器经验值状态：{0}"
  npc_override_moro_vol_quests_14_3_bis_menu_currently_9e33cd: "已过去：{0}"
  npc_override_moro_vol_quests_14_3_bis_menu_don_8bb6e9: "别想瞒着我留着——它们对你没用。"
  npc_override_moro_vol_quests_14_3_bis_menu_i_ebe028: "我已经把那个地方的入口藏起来了：我不想让任何人比我先到那里。"
  npc_override_moro_vol_quests_14_3_bis_menu_jakken_28e268: "雅肯：士兵们，我们来自不同的国家，但我们为了同一个目标聚集在这里！"
  npc_override_moro_vol_quests_14_3_bis_menu_jakken_72b0a7: "雅肯：开始你们的荣耀进军！"
  npc_override_moro_vol_quests_14_3_bis_menu_jakken_e4fbd1: "雅肯：让敌人见识一下我们联合的力量！"
  npc_override_moro_vol_quests_14_3_bis_menu_my_217d41: "我想说的是："
  npc_override_moro_vol_quests_14_3_bis_menu_nidhogg_f05bd1: "尼德霍格：愿世界树保佑魔神讨伐者{0}等人。"
