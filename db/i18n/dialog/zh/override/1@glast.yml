  npc_override_1@glast_SarahAndFenrir_menu_sarah_980a72: "莎拉·艾琳：而且你还借助了这种新手冒险者的力量……"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_b41a60: "莎拉·艾琳：芬里尔，你为什么不停止你那幼稚的魔法呢？"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_b88bd2: "莎拉·艾琳：呃……你……比我想象的更强啊芬里尔……"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_bc32a4: "莎拉·艾琳：芬里斯，你倒是挺会取悦我的……"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_c23719: "莎拉·艾琳：我的仆从们一定会杀了你的！！！"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_c4f19d: "莎拉·艾琳：不错但……还差得远！"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_caeb6f: "莎拉·艾琳：呵……"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_d20afa: "莎拉·艾琳：嘿嘿……你闪避得像只老鼠。"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_d7f17d: "莎拉·艾琳：我要把整座城堡都炸飞！呀！"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_e2a344: "莎拉·艾琳：嗯……今天我要让你屈服"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_ee19ce: "莎拉·艾琳：迟来的问候，我的名字是莎拉·艾琳，瓦尔哈拉的十二女武神之一。"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_efbb30: "莎拉·艾琳：所以你的计划就是用这种把戏来拖住我吗？"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_f00684: "莎拉·艾琳：令人印象深刻啊芬里斯·芬里尔，你巧妙地逃脱了"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_f07302: "莎拉·艾琳：嘿嘿……我明白了……正如我所料。"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_f359b9: "莎拉·艾琳：那把刀是线索吗？"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_f8cf71: "莎拉·艾琳：那么，芬里斯·芬里尔，这意味着用它就能打破千年的封印？"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_fea37c: "莎拉·艾琳：去吧！基加恩特！还有我忠诚的怪物们！"
