Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_2@cata_SealedShrine_all_apostles_baphomet_de_26c9a9: "巴风特的所有使徒都已被消灭！"
  npc_override_2@cata_SealedShrine_alright_i_ll_help_you_75feed: "好吧……我再帮你一次。"
  npc_override_2@cata_SealedShrine_anyone_who_fights_good_k_6fee71: "任何为正义而战的人，内心深处都会知道，邪恶正在威胁着这个世界……"
  npc_override_2@cata_SealedShrine_apostles_cloning_themsel_92a9b9: "使徒们正在自我复制，用邪恶的能量填满这座神殿。它们就是这座地下墓穴里的怪物。"
  npc_override_2@cata_SealedShrine_as_we_speak_satan_morocc_5bcefa: "但是……就在我们说话的当下，魔王梦罗克正在集结他强大的魔力，意图影响这片大陆上的所有生命。"
  npc_override_2@cata_SealedShrine_as_you_know_we_don_c7c5d5: "你知道的……我们没有多少时间了。你们无法独自阻止巴风特。这些年恶魔的力量已经增强了。"
  npc_override_2@cata_SealedShrine_baphomet_also_awakened_p_ebaa0b: "巴风特也……已经苏醒，正在借助魔王梦罗克的力量削弱封印的威力，为他在这个世界的复活做准备……"
  npc_override_2@cata_SealedShrine_baphomet_name_devil_i_th_093e72: "巴风特……就是恶魔的名字……我想你应该听说过这个名字。"
  npc_override_2@cata_SealedShrine_baphomet_s_power_about_b_f0ae9e: "巴风特的力量即将冲破我们设下的封印。如果你们不重新激活它们……巴风特的复活将只是时间问题。"
  npc_override_2@cata_SealedShrine_bottom_main_altar_trembl_6471a3: "主祭坛的底部在剧烈地震动。"
  npc_override_2@cata_SealedShrine_called_gigantic_magestic_0d08d0: "它被称为^4d4dff巨型威严山羊之角^000000。你会意识到，你所熟悉的威严山羊之角与它相比根本不值一提。"
  npc_override_2@cata_SealedShrine_complicated_magical_rune_ed3a3b: "复杂的魔法符文文字在急速闪烁，试图压制其中可怕的力量。"
  npc_override_2@cata_SealedShrine_cool_i_ll_help_you_a1c58d: "酷……我会帮你把这个邪恶的人偶变有用的。什么？我能做什么？"
  npc_override_2@cata_SealedShrine_curse_baphomet_disappear_0ddc7a: "在你进入之后，巴风特的诅咒会在经过一定时间后消失。"
  npc_override_2@cata_SealedShrine_cursed_baphomet_doll_mag_730227: "^0000FF被诅咒的巴风特人偶、威严山羊之角、30个黑暗水晶、50个黑暗碎片^000000，以及最重要的，制作费用为^0000FF990,000^000000 Zeny。"
  npc_override_2@cata_SealedShrine_cursed_baphomet_doll_mos_bcb7d4: "被诅咒的巴风特人偶是最重要的材料……如果你想要的话我可以帮你制作。你想怎么做？"
  npc_override_2@cata_SealedShrine_did_you_bring_all_ingred_810891: "你把所有材料都带来了吗？"
  npc_override_2@cata_SealedShrine_did_you_find_pendant_4186aa: "你找到坠饰了吗？"
  npc_override_2@cata_SealedShrine_did_you_get_essence_fire_47d8e3: "你拿到10个^0000FF火焰精华^000000和^0000FF使徒之证^000000了吗？"
  npc_override_2@cata_SealedShrine_enter_dangerous_place_yo_d1801b: "进入这个危险的地方，你不能独自前往。加入队伍后再来吧。"
  npc_override_2@cata_SealedShrine_evil_power_too_terrible_69b3e5: "一股难以形容的邪恶力量，散发着紫色的光芒，盘踞在大祭坛之下。"
  npc_override_2@cata_SealedShrine_example_skills_like_safe_c0387d: "例如^0000FF暗之障壁和圣母之颂歌^000000这样的技能……所以你们最好在进入神殿之前做好准备。"
  npc_override_2@cata_SealedShrine_go_ahead_warriors_719503: "去吧，勇士们。"
  npc_override_2@cata_SealedShrine_go_see_rust_blackhand_wh_30dab0: "去找修道院主楼附近的^0000FF锈色·黑手^000000……他会让这个人偶对你有用的。"
  npc_override_2@cata_SealedShrine_good_job_my_descendants_127795: "干得好，我的后人们……你们完成了我和我的兄弟们未能完成的夙愿。"
  npc_override_2@cata_SealedShrine_grand_appearance_heat_fi_c946d4: "火焰的壮观和炽热让我后退了一步……但我鼓起勇气，伸手去拿起了火把。"
  npc_override_2@cata_SealedShrine_gravestone_carving_wicke_edfcfc: "这块墓碑上刻着一只长着巨大犄角的邪恶恶魔。它散发出一种不祥的感觉。"
  npc_override_2@cata_SealedShrine_gravestone_trembling_eca995: "墓碑在震动……"
  npc_override_2@cata_SealedShrine_haaaaaaap_hocus_pocus_wi_55b50f: "哈啊啊啊……急急如律令、阿瓦达索命！！！！！"
  npc_override_2@cata_SealedShrine_haaaaaaap_wingardium_lev_f8fd11: "哈啊啊啊……羽加迪姆勒维奥萨、呼神护卫！！！！！"
  npc_override_2@cata_SealedShrine_hmm_s_been_such_long_f958e1: "嗯……我已经很久没见过这些邪恶的犄角了……咯……让我开始吧……"
  npc_override_2@cata_SealedShrine_however_baphomet_never_g_46b3ce: "然而，巴风特从未放弃。他不断强化自己的力量。而他的力量为这座神殿带来了新的生机。"
  npc_override_2@cata_SealedShrine_huge_torch_appearing_as_31bdb1: "一把仿佛能烧尽一切的巨大火把在我面前上下摆动。"
  npc_override_2@cata_SealedShrine_huge_torch_appearing_as_4a38d0: "一把仿佛能烧尽一切的巨大火把在我面前上下摆动。"
  npc_override_2@cata_SealedShrine_huh_don_t_you_know_a42cf5: "嗯……你不知道吗？这里是圣卡毕利那修道院，立志成为修士的弟兄们在这里修行祈祷。"
  npc_override_2@cata_SealedShrine_huh_you_whatever_you_wan_8c8dbe: "嗯……你想怎样就怎样吧……你真的想让这个机会白白浪费掉吗？"
  npc_override_2@cata_SealedShrine_huu_s_over_now_i_832f51: "呼……结束了。现在我已经解除了巴风特的诅咒，你可以再次进入了。"
  npc_override_2@cata_SealedShrine_huu_s_over_now_i_c8ead6: "呼……结束了。现在我已经解除了你身上所有的诅咒。你可以再次进入了。"
  npc_override_2@cata_SealedShrine_huu_you_don_t_understand_cc33af: "呼……你没明白我说的话。用这些材料你什么都做不了。"
  npc_override_2@cata_SealedShrine_i_don_t_accept_complaint_46f157: "我不接受投诉或售后请求，所以请小心使用。我得走了……"
  npc_override_2@cata_SealedShrine_i_feel_power_altar_came_11b866: "我能感觉到祭坛的力量在注入魔力之后恢复了。"
  npc_override_2@cata_SealedShrine_i_feel_something_odd_gra_00dc6b: "我能感觉到墓地里有些异常。就像有人在无声地呼唤……"
  npc_override_2@cata_SealedShrine_i_feel_voice_becoming_fa_c020aa: "我能感觉到那个声音正在变得微弱。"
  npc_override_2@cata_SealedShrine_i_ll_complete_opening_se_eef31b: "当你们的代表告诉我你们准备好了，我就会完成封印之门的开启。"
  npc_override_2@cata_SealedShrine_i_ll_give_token_inherito_6dcf5b: "我会把信仰继承者之证交给队长。只有队长才能收集^0000FF火焰精华^000000。"
  npc_override_2@cata_SealedShrine_i_ll_tell_you_ingredient_a14192: "我再告诉你一次材料清单，请准确收集。"
  npc_override_2@cata_SealedShrine_i_ll_tell_you_ingredient_f42233: "我再告诉你一次材料。那么，你要做吗？"
  npc_override_2@cata_SealedShrine_i_m_sure_you_get_4597b7: "我相信你能收集到这些材料，因为你们封印了真正的巴风特。不是吗？咯……"
  npc_override_2@cata_SealedShrine_i_make_strong_large_horn_89a70e: "我可以为你打造那对强大巨大的邪恶恶魔巴风特的角。一顶蕴含着他无尽力量的头盔。"
  npc_override_2@cata_SealedShrine_i_moved_my_soul_s_2d5cf1: "我把我的灵魂精华转移到了我的坠饰里，这样我就可以留在这个世界上。那之后我就成了这座墓地的守护者。"
  npc_override_2@cata_SealedShrine_i_must_substantialized_w_948351: "我必须在一个小时之内实体化。要到达地下主祭坛，你必须帮我完成开启每道封印的仪式。"
  npc_override_2@cata_SealedShrine_i_nothing_say_you_983f92: "我没什么好跟你说的……"
  npc_override_2@cata_SealedShrine_i_one_warriors_stop_baph_81c305: "我当年也是像你们一样阻止巴风特的战士之一。现在我已经死了，只剩下灵魂……"
  npc_override_2@cata_SealedShrine_i_only_feel_gloom_graves_477266: "我只能从这块墓碑上感受到阴郁。"
  npc_override_2@cata_SealedShrine_i_really_appreciate_your_715382: "非常感谢你的帮助。"
  npc_override_2@cata_SealedShrine_i_think_pendant_21b02d: "我想这就是那个坠饰……"
  npc_override_2@cata_SealedShrine_i_waited_waited_brave_ad_358bc2: "我一直等着，等着像你这样勇敢的冒险者再次回到这里……"
  npc_override_2@cata_SealedShrine_i_want_talk_representati_6da69a: "我想和^0000FF你们队伍中的一位代表^000000对话。其他人请在这里等候。"
  npc_override_2@cata_SealedShrine_if_baphomet_perceives_yo_3f4923: "如果巴风特感知到你们穿过封印之门，他可能会释放出惊人的魔力。到那时，这座修道院将被摧毁。"
  npc_override_2@cata_SealedShrine_if_each_party_member_pos_449971: "如果每个队员都持有^0000FF使徒之证^000000，巴风特就无法感知你们进入地下主祭坛。"
  npc_override_2@cata_SealedShrine_if_you_don_t_business_fa2bcf: "如果你找我没别的事，就走吧！如你所见，我是为修道院的弟兄们制作装备的，而不是为你们这样的冒险者。明白了吗？"
  npc_override_2@cata_SealedShrine_if_you_leave_please_say_dad8f9: "如果你要走，请替我向帕特里克问好。"
  npc_override_2@cata_SealedShrine_if_you_want_make_doll_268474: "如果你想把人偶重新做成^4d4dff巨型威严山羊之角^000000，我可以再给你做一个。"
  npc_override_2@cata_SealedShrine_if_your_party_leader_bri_441ea5: "如果你的^0000FF队长^000000把坠饰带来给我，我的灵魂就能实体化。所以，快点吧。"
  npc_override_2@cata_SealedShrine_just_dangerous_useless_t_943cd2: "如果你什么都不做的话，它只是一个危险而无用的东西……我来介绍一个能帮你的人……你想见他吗？"
  npc_override_2@cata_SealedShrine_kill_apostles_baphomet_f_eb8b41: "杀死巴风特的使徒，找到他们的^0000FF使徒之证^000000。"
  npc_override_2@cata_SealedShrine_kill_apostles_get_token_eb1cbb: "杀死使徒，获取^0000FF使徒之证^000000。"
  npc_override_2@cata_SealedShrine_kill_apostles_they_only_f0bc20: "杀死使徒。它们与克隆体的区别在于它们身上携带着^0000FF使徒之证^000000……"
  npc_override_2@cata_SealedShrine_kkk_yes_wise_men_take_33fe5d: "咯……是的，智者会抓住机遇。我来告诉你材料清单。别忘了，把全部带来。"
  npc_override_2@cata_SealedShrine_kkk_you_prepared_ingredi_29a9e7: "咯……你材料准备得很充分。不如放在那里等着？"
  npc_override_2@cata_SealedShrine_krrrr_krrrr_7d25d5: "“嘎……嘎……”"
  npc_override_2@cata_SealedShrine_let_me_see_needless_say_444fef: "让我看看……不用多说，一定是帕特里克派你来处理那个人偶的吧？"
  npc_override_2@cata_SealedShrine_make_sure_you_listened_a_c52a56: "在你说准备好了之前，请确保你听完了我要说的全部内容。"
  npc_override_2@cata_SealedShrine_make_sure_your_party_lea_d8be20: "确保你的队长已经听完了我对你们应该做什么的说明。"
  npc_override_2@cata_SealedShrine_may_difficult_i_wish_you_f32247: "这可能很困难，但祝你在冒险中顺利。"
  npc_override_2@cata_SealedShrine_member_party_entered_sea_4c2728: "[{1}]队伍的[{0}]成员已进入封印神殿。"
  npc_override_2@cata_SealedShrine_menu_about_5ae3f1: "关于被诅咒的巴风特人偶:结束对话"
  npc_override_2@cata_SealedShrine_menu_ancient_00524f: "古代英雄之魂：我们失败了……但是……我们还有机会。希望你们在时机到来之前好好锻炼自己。"
  npc_override_2@cata_SealedShrine_menu_ancient_019290: "古代英雄之魂：10点钟方向的封印魔力正在耗尽。去10点钟方向为封印注入魔力。"
  npc_override_2@cata_SealedShrine_menu_ancient_32b9b8: "古代英雄之魂：不要气馁，巴风特仍然可以被打败！"
  npc_override_2@cata_SealedShrine_menu_ancient_3deb8a: "古代英雄之魂：主祭坛的封印正在减弱。强化主祭坛的封印！"
  npc_override_2@cata_SealedShrine_menu_ancient_4922ad: "古代英雄之魂：我会在中央的火之祭坛前等你们"
  npc_override_2@cata_SealedShrine_menu_ancient_59da1a: "古代英雄之魂：我们只有1小时来阻止巴风特。如果时间耗尽，封印的力量将毫无用处。"
  npc_override_2@cata_SealedShrine_menu_ancient_61ecb8: "古代英雄之魂：中央封印的魔力正在耗尽。去中央封印为它注入魔力。"
  npc_override_2@cata_SealedShrine_menu_ancient_70bc2a: "古代英雄之魂：我们没时间了！快！"
  npc_override_2@cata_SealedShrine_menu_ancient_7dcfd5: "古代英雄之魂：我的后人们……仔细听好我要说的话。"
  npc_override_2@cata_SealedShrine_menu_ancient_7eae9a: "古代英雄之魂：8点钟方向的封印魔力正在耗尽。去8点钟方向为封印注入魔力。"
  npc_override_2@cata_SealedShrine_menu_ancient_a692b8: "古代英雄之魂：你们应该把巴风特引到解封的祭坛上。否则你们的努力将是徒劳的。"
  npc_override_2@cata_SealedShrine_menu_ancient_b60ba0: "古代英雄之魂：一旦封印恢复力量，巴风特就会变得脆弱。"
  npc_override_2@cata_SealedShrine_menu_ancient_b9fe64: "古代英雄之魂：去祭坛那里激活它们的封印。"
  npc_override_2@cata_SealedShrine_menu_ancient_c12675: "古代英雄之魂：在巴风特复活之前找到这些祭坛并激活它们的封印。"
  npc_override_2@cata_SealedShrine_menu_ancient_c88149: "古代英雄之魂：现在你们可以前往主祭坛的大门了。它在东南方向。"
  npc_override_2@cata_SealedShrine_menu_ancient_c9f25a: "古代英雄之魂：我的身体正在消散……快！"
  npc_override_2@cata_SealedShrine_menu_ancient_dd136d: "古代英雄之魂：一切都结束了……除了等待下一次机会之外别无他法……"
  npc_override_2@cata_SealedShrine_menu_ancient_e7485e: "古代英雄之魂：2点钟方向的封印魔力正在耗尽。去2点钟方向为封印注入魔力。"
  npc_override_2@cata_SealedShrine_menu_ancient_ef6304: "古代英雄之魂：控制主祭坛力量的祭坛位于这个房间的东北、东南、西南和西北角。"
  npc_override_2@cata_SealedShrine_menu_ancient_f777ac: "古代英雄之魂：4点钟方向的封印魔力正在耗尽。去4点钟方向为封印注入魔力。"
  npc_override_2@cata_SealedShrine_menu_ancient_fc4552: "古代英雄之魂：天哪！主祭坛的封印正在减弱！"
  npc_override_2@cata_SealedShrine_menu_ancient_fd76bd: "古代英雄之魂：我们再也无法用封印的魔力阻止巴风特了。现在一切都只能依靠神了……"
  npc_override_2@cata_SealedShrine_menu_apostle_2ac698: "巴风特使徒：快解除祭坛的封印！我们主人的回归即将来临！"
  npc_override_2@cata_SealedShrine_menu_apostle_c44669: "巴风特使徒：杀死人类！别让他们打断我们主人的复活！"
  npc_override_2@cata_SealedShrine_menu_apostle_d12ea6: "巴风特使徒：杀死人类！不要阻止我们主人的复活！"
  npc_override_2@cata_SealedShrine_menu_apostle_fa8074: "巴风特使徒：人类！人类侵入了我们的圣所！"
  npc_override_2@cata_SealedShrine_menu_baphomet_0ebe97: "巴风特：不！不——不！这些弱者怎敢击败我！……不！！……"
  npc_override_2@cata_SealedShrine_menu_baphomet_1a372c: "巴风特：在这里没人能伤到我。你将成为我的第一个祭品。"
  npc_override_2@cata_SealedShrine_menu_baphomet_2a3334: "巴风特：嘎……现在你们无法用封印阻止我了。你们唯一能做的就是等死！"
  npc_override_2@cata_SealedShrine_menu_baphomet_4cf562: "巴风特：太迟了，弱者……现在，感受死亡的绝望吧！"
  npc_override_2@cata_SealedShrine_menu_baphomet_5d9990: "巴风特：人类……又来干涉了……"
  npc_override_2@cata_SealedShrine_menu_baphomet_7ff819: "巴风特：没用的。尽管加固封印吧。我会把它们全部碾碎。你们一个都活不了！"
  npc_override_2@cata_SealedShrine_menu_i_0e8c5e: "我想做一个！:我不需要。"
  npc_override_2@cata_SealedShrine_menu_i_62e625: "我要。:不，我不要。"
  npc_override_2@cata_SealedShrine_menu_let_1d34ce: "让我离开神殿。:结束对话"
  npc_override_2@cata_SealedShrine_menu_tell_a76c4f: "详细告诉我。:结束对话"
  npc_override_2@cata_SealedShrine_menu_touch_24d2d7: "触摸石头。:后退。"
  npc_override_2@cata_SealedShrine_menu_what_86bef3: "这是什么地方？:我想进去。:关于被诅咒的巴风特人偶。:取消。"
  npc_override_2@cata_SealedShrine_menu_what_eb2e2a: "这是什么地方？:我想进去。:取消。"
  npc_override_2@cata_SealedShrine_menu_what_f4f010: "火焰精华是什么？:使徒之证是什么？:我应该做什么？:我准备好了。"
  npc_override_2@cata_SealedShrine_menu_who_65cf94: "你是谁？:你在等我吗？:取消。"
  npc_override_2@cata_SealedShrine_might_better_kill_all_th_acdaf6: "最好把它们全部消灭，因为无法区分它们和克隆体。"
  npc_override_2@cata_SealedShrine_msg_6eae3a: "……"
  npc_override_2@cata_SealedShrine_msg_8707ce: "…… ……"
  npc_override_2@cata_SealedShrine_msg_e0b936: "…… …… ……"
  npc_override_2@cata_SealedShrine_name_leader_591aa7: "队长的名字是{0}……"
  npc_override_2@cata_SealedShrine_now_i_ll_carve_you_d61dcc: "现在我要给你刻上印记，表明你是信仰继承者。请注意，你队伍中只有你能收集火焰精华。"
  npc_override_2@cata_SealedShrine_now_i_ll_tell_you_ab0a01: "现在我来告诉你们该做什么。首先，从墓地火把上收集^0000FF火焰精华^000000……"
  npc_override_2@cata_SealedShrine_now_i_m_looking_someone_ebf0b1: "现在……我在寻找足够勇敢的人，像我们多年前那样，将巴风特重新封印在它的神殿里……"
  npc_override_2@cata_SealedShrine_now_i_substantialize_my_e447c4: "现在我的灵魂可以实体化了。我会在这座墓地中央的火之祭坛前等你们。我们在那里见面。"
  npc_override_2@cata_SealedShrine_now_you_go_main_altar_78ccb9: "现在你们可以去主祭坛了。它在这一层的右下角。"
  npc_override_2@cata_SealedShrine_numerous_brave_men_broth_cb6117: "无数勇士和修士曾在这座修道院里修行……"
  npc_override_2@cata_SealedShrine_okay_i_ll_adjust_shrine_71e40a: "好吧……我会调整神殿的封印，让你和你的队伍可以进入。"
  npc_override_2@cata_SealedShrine_okay_i_ll_let_you_bf708e: "好的。我会让你和你的队伍安全地离开这里。"
  npc_override_2@cata_SealedShrine_okay_you_ve_done_your_5d0780: "好的。你们的工作已经完成了。请告诉你们的代表检查同伴的情况，等大家都完成后就来找我。"
  npc_override_2@cata_SealedShrine_okay_you_ve_done_your_e85875: "好的。你们的工作已经完成了。现在检查一下你们的同伴，等所有人都完成后告诉我。"
  npc_override_2@cata_SealedShrine_once_party_leader_permit_31202b: "只有队长获得许可后，其他队员才能进入。这是修道院的规矩，请理解。"
  npc_override_2@cata_SealedShrine_one_more_thing_cursed_ar_c67c89: "还有一件事……在这片被诅咒的区域，某些受外在物理力量保护的技能会被封印的效果禁止使用。"
  npc_override_2@cata_SealedShrine_one_thing_you_must_remem_72d3ff: "你们必须记住的一件事是……^0000FF火焰精华^000000只能由信仰继承者收集。"
  npc_override_2@cata_SealedShrine_one_thing_you_should_rem_97ad6e: "你们应该记住的一件事是……任何进入这座神殿的人都会受到巴风特的诅咒，在诅咒解除之前无法进入或离开。"
  npc_override_2@cata_SealedShrine_open_entrance_you_must_s_d38d45: "要打开入口，你必须让我的灵魂实体化。等我实体化之后，我会打开入口并重新激活被削弱的封印。"
  npc_override_2@cata_SealedShrine_open_sealed_underground_c64a9d: "要打开地下封印之门，我必须用蕴含托尔力量的^0000FF火焰精华^000000来净化。从火把上收集^0000FF10个火焰精华^000000。"
  npc_override_2@cata_SealedShrine_our_souls_finally_rest_p_b790d1: "我们的灵魂终于可以安息了……"
  npc_override_2@cata_SealedShrine_party_name_770034: "队伍名称是{0}……"
  npc_override_2@cata_SealedShrine_past_my_companions_i_sea_b257b9: "过去，我的同伴们和我在地下一层的祭坛上将巴风特封印，并封锁了入口。"
  npc_override_2@cata_SealedShrine_peace_world_cannot_last_e2a68f: "这个世界的和平无法永远持续……邪恶之手正在再次伸向世界……"
  npc_override_2@cata_SealedShrine_place_what_i_say_yes_577b05: "而这个地方是……我该怎么说呢……是的。是恶魔之墓。坟墓……"
  npc_override_2@cata_SealedShrine_please_train_more_come_a_444571: "请多加锻炼后再来吧。"
  npc_override_2@cata_SealedShrine_ready_yet_you_should_pre_81b477: "还没准备好吗？你需要准备10个^0000FF火焰精华^000000和^0000FF使徒之证^000000。"
  npc_override_2@cata_SealedShrine_ready_yet_you_should_pre_dc98c9: "还没准备好吗？你需要准备^0000FF使徒之证^000000。"
  npc_override_2@cata_SealedShrine_remember_you_need_collec_4bf072: "记住，你需要从火把上收集^0000FF10个火焰精华^000000，从巴风特使徒身上获得^0000FF使徒之证^000000。"
  npc_override_2@cata_SealedShrine_remind_you_again_i_must_189bde: "再次提醒你，我必须在一个小时内实体化。所以所有人都要在那个时间内完成各自的任务！"
  npc_override_2@cata_SealedShrine_remind_you_again_i_subst_801085: "再次提醒你，我可以在接下来的一个小时内保持实体化。所以所有人都要在那个时间内完成任务。"
  npc_override_2@cata_SealedShrine_s_cold_touch_doesn_t_e89eb8: "摸上去很冰冷。没有任何反应。"
  npc_override_2@cata_SealedShrine_s_correct_i_feel_baphome_eba92d: "没错……我能感觉到里面的巴风特邪恶气息……那么，你打算怎么处理这个人偶？"
  npc_override_2@cata_SealedShrine_s_done_you_may_excited_c40590: "完成了。你当然可以兴奋。我能理解……"
  npc_override_2@cata_SealedShrine_seal_activated_putting_m_ad80ff: "将魔力注入祭坛后，封印被激活了。"
  npc_override_2@cata_SealedShrine_second_all_members_who_e_64c662: "第二，所有进入地下的人员都必须携带一个名为“使徒之证”的印记。"
  npc_override_2@cata_SealedShrine_seems_you_entered_shrine_04ce6a: "看来你最近进入过这座神殿……由于巴风特的诅咒仍然存在，你无法重新进入。"
  npc_override_2@cata_SealedShrine_seems_you_entered_shrine_1c5725: "看来你最近进入过这座神殿……由于巴风特的诅咒仍然存在，你无法重新进入。巴风特的诅咒只有在经过一定时间后才会消失。"
  npc_override_2@cata_SealedShrine_small_object_shining_und_36e38a: "一座倾斜的墓碑下，有个小东西在闪闪发光。"
  npc_override_2@cata_SealedShrine_some_these_monsters_magi_fee3b4: "这些怪物中的一些拥有魔力。巴风特称它们为“使徒”。"
  npc_override_2@cata_SealedShrine_struggle_peace_world_nev_79a250: "维护世界和平的斗争永无止境。但是……因为有你这样勇敢的英雄，我的职责终于结束了。"
  npc_override_2@cata_SealedShrine_substantialize_my_soul_y_4e3060: "要让我的灵魂实体化，你必须找到我的坠饰。你可以在这附近的某个墓穴找到我的躯体。"
  npc_override_2@cata_SealedShrine_symbol_inheritor_shines_39994e: "继承者的印记发出光芒。然后一颗小小的水晶从火把中落入我的手中。"
  npc_override_2@cata_SealedShrine_time_impossible_get_rid_2aa39a: "当时，我们无法凭一己之力消灭恶魔巴风特。在无数英雄牺牲之后，我们才勉强将他封印在这座修道院之下。"
  npc_override_2@cata_SealedShrine_train_more_use_your_skil_de053b: "继续锻炼，运用你的技能来保护世界免受邪恶的威胁……"
  npc_override_2@cata_SealedShrine_tut_tut_i_don_t_a05339: "啧啧……我才不在乎那个邪恶人偶是不是一直在威胁你的生命呢！"
  npc_override_2@cata_SealedShrine_umm_i_recognize_your_cou_fa89f7: "嗯……我认可你的勇气，但是……我不能允许任何人进入这个地方。我只能让队伍的队长先进去。"
  npc_override_2@cata_SealedShrine_umm_seems_baphomet_s_cur_68f27b: "嗯……看来巴风特的诅咒已经减弱了。我现在可以解除它了。"
  npc_override_2@cata_SealedShrine_umm_seems_curse_baphomet_fdcbdf: "嗯……看来巴风特的诅咒已经减弱了。我来清除这个邪恶的诅咒。"
  npc_override_2@cata_SealedShrine_umm_seems_there_problem_159fdd: "嗯……但这里似乎有个问题……我快速检查一下。请稍等。"
  npc_override_2@cata_SealedShrine_umm_you_should_train_mor_ac556f: "嗯……要进入这个危险的地方，你需要更多的锻炼……你至少需要达到Lv 75才能进入这里。"
  npc_override_2@cata_SealedShrine_under_gravestone_front_y_f1c785: "在你面前的这块墓碑之下……封印着巴风特。"
  npc_override_2@cata_SealedShrine_very_place_where_great_d_32b357: "正是那个曾经毁灭了这个世界的伟大恶魔沉睡的地方。"
  npc_override_2@cata_SealedShrine_villainous_doll_you_hold_8c64c9: "那就是……你手里拿着的那个邪恶人偶……让我看看。"
  npc_override_2@cata_SealedShrine_watch_out_something_some_5ac631: "小心！有什么……有什么东西过来了。"
  npc_override_2@cata_SealedShrine_what_brought_you_place_67bedd: "是什么风把你吹到这来的？"
  npc_override_2@cata_SealedShrine_what_dull_boy_he_huh_c9d3cc: "真是个迟钝的家伙……嗯……"
  npc_override_2@cata_SealedShrine_what_hmmm_did_you_get_7f54ea: "什么？……嗯……你拿到人偶了？你比外表看起来要强嘛……"
  npc_override_2@cata_SealedShrine_what_you_again_what_you_214098: "什么？……又是你？这次想要什么？"
  npc_override_2@cata_SealedShrine_what_you_doing_entrance_4e3421: "你在干什么？主祭坛的入口已经打开了，去战斗啊！入口在这一层的右下角附近。"
  npc_override_2@cata_SealedShrine_what_you_got_another_dol_e25b5b: "什么？你又从邪恶恶魔那里拿到了一个人偶？嗯……你比我想象的要厉害得多……"
  npc_override_2@cata_SealedShrine_when_all_you_ready_go_30f4e6: "等你们所有人都准备好出发的时候，告诉我一声。我会在你们准备好的时候打开封印之门。"
  npc_override_2@cata_SealedShrine_when_touching_gravestone_a5f3e8: "触摸墓碑时，我听到了一个声音。"
  npc_override_2@cata_SealedShrine_when_you_see_sign_put_75bc0a: "当你看到印记的时候，把手放在墓碑上……然后你就可以移动到里面了。"
  npc_override_2@cata_SealedShrine_where_your_token_apostle_f33aff: "你的使徒之证在哪里？我说过你必须携带使徒之证才能通过这道门。"
  npc_override_2@cata_SealedShrine_who_you_what_you_want_4901f5: "你是谁？找我有什么事？"
  npc_override_2@cata_SealedShrine_why_you_hanging_around_h_db7fb5: "你在这里晃悠什么？如果你不想要^4d4dff巨型威严山羊之角^000000，就走吧。"
  npc_override_2@cata_SealedShrine_yes_my_pendant_6063d3: "是的……这是我的……坠饰……"
  npc_override_2@cata_SealedShrine_you_don_t_need_collect_b05d28: "你不需要再收集火焰精华了。"
  npc_override_2@cata_SealedShrine_you_essence_fire_already_353ba8: "你已经有了10个火焰精华，所以不需要再收集了。"
  npc_override_2@cata_SealedShrine_you_find_my_body_near_2e98cd: "你可以在这附近的墓穴找到我的躯体。去那里拿我的坠饰吧。"
  npc_override_2@cata_SealedShrine_you_get_magestic_goat_we_24d5c6: "你可以从迷宫森林里的弱化版巴风特那里获得威严山羊之角。黑暗水晶和黑暗碎片则来自梦罗克的化身。"
  npc_override_2@cata_SealedShrine_you_inheritor_faith_dese_e36d09: "你不是信仰继承者。请不要用你不敬之手亵渎火焰精华。"
  npc_override_2@cata_SealedShrine_you_ll_never_know_how_5130e0: "你永远不会知道这顶帽子有多好，除非你拥有一个。如果你明白了，就去收集材料吧。"
  npc_override_2@cata_SealedShrine_you_look_like_leader_par_f9fb44: "你看起来像是这支队伍的队长。你需要去火把那里收集^0000FF10个火焰精华^000000。"
  npc_override_2@cata_SealedShrine_you_mean_you_ll_go_c95aff: "你的意思是你要去神殿重新封印巴风特？"
  npc_override_2@cata_SealedShrine_you_re_monk_then_what_669dca: "你不是修士？那你想要什么？"
  npc_override_2@cata_SealedShrine_you_ready_b68a42: "你准备好了吗？"
  npc_override_2@cata_SealedShrine_you_ready_go_then_i_11d37a: "你准备出发了吗？那我现在就打开封印之门。"
  npc_override_2@cata_SealedShrine_you_ready_i_opened_seale_10d6ba: "你准备好了吗？封印之门已经打开了。要穿过这道门，你必须携带^0000FF使徒之证^000000。"
  npc_override_2@cata_SealedShrine_you_see_sign_when_seal_b03dad: "当封印被打破时你会看到印记。请等到印记出现……"
  npc_override_2@cata_SealedShrine_you_see_torches_here_the_ba1915: "你可以看到这里到处都有火把。这些火把是雷神托尔的精华，由我们的前辈传承下来，用以阻止巴风特的黑暗……"
  npc_override_2@cata_SealedShrine_you_should_also_carry_to_f3e442: "你也应该携带一枚^0000FF使徒之证^000000，所以也给自己找一枚吧。"
  npc_override_2@cata_SealedShrine_you_still_something_here_57db7b: "你在这里还有什么事吗？如果你已经完成了，我可以让你安全离开……"
  npc_override_2@cata_SealedShrine_you_still_there_bring_ba_0f9572: "你还在吗？尽快把我的坠饰带回来。"
  npc_override_2@cata_SealedShrine_you_t_use_your_magic_da42e2: "你在祭坛上消耗了SP，在3分钟内无法使用魔法。"
  npc_override_2@cata_SealedShrine_you_token_apostle_8b6bdc: "你有^0000FF使徒之证^000000吗？"
  npc_override_2@cata_SealedShrine_you_ve_failed_open_seal_d89200: "你未能打开主祭坛的封印。"
  npc_override_2@cata_SealedShrine_your_help_my_soul_substa_c04c3a: "有了你们的帮助，我的灵魂才能实体化。我想再多聊聊，但我们没有足够的时间……"
  npc_override_2@cata_SealedShrine_your_real_battle_begin_i_a4d170: "你们的真正战斗即将开始……我会很快跟上你们，并设法帮助你们。"
  npc_override_2@cata_SealedShrine_your_sp_recovered_yet_yo_d148d6: "你的SP尚未恢复。你在祭坛上消耗了SP，但封印的力量似乎已经恢复了。"
