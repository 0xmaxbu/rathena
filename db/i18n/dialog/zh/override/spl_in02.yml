Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_spl_in02_warlock_all_tests_done_now_talk_35dd12: "所有测试都完成了。现在去跟恩格洛利亚大师谈谈吧。"
  npc_override_spl_in02_warlock_alright_all_materials_re_069735: "太好了！所有材料都准备好了！"
  npc_override_spl_in02_warlock_beautiful_light_36b1d6: "美丽的光芒……"
  npc_override_spl_in02_warlock_become_warlock_2e2c30: "成为咒术师？"
  npc_override_spl_in02_warlock_bring_me_back_magical_st_0547d1: "把魔法石带回来给我。"
  npc_override_spl_in02_warlock_bring_these_stones_you_e_d7d422: "把这些石头带在身上，否则你就回不来了！"
  npc_override_spl_in02_warlock_bye_755e0d: "再见……"
  npc_override_spl_in02_warlock_careful_9a2d79: "小心！"
  npc_override_spl_in02_warlock_careful_monsters_test_ro_f5c351: "小心测试房间里的怪物。"
  npc_override_spl_in02_warlock_chamber_magic_a60f2d: "魔法之间"
  npc_override_spl_in02_warlock_closing_arena_b4352d: "关闭竞技场。"
  npc_override_spl_in02_warlock_closing_chamber_magic_b225a3: "关闭魔法之间。"
  npc_override_spl_in02_warlock_combined_stone_formed_di_d82fde: "这块合成之石会根据原材料和处理方式的不同而呈现出不同的形态。"
  npc_override_spl_in02_warlock_congratulations_you_ve_s_64493a: "恭喜！你成功创造了一颗魔法水晶。"
  npc_override_spl_in02_warlock_could_i_become_warlock_a71ff1: "我能成为咒术师吗？"
  npc_override_spl_in02_warlock_crystallized_magical_sto_2b3641: "这颗结晶化的魔法石会保护你的安全。"
  npc_override_spl_in02_warlock_dear_master_my_pony_tail_3f7ca3: "天哪，师父！我的马尾辫真的很好笑吗？！"
  npc_override_spl_in02_warlock_decision_so_let_me_know_d9b62a: "决定了就告诉我。"
  npc_override_spl_in02_warlock_defend_room_monsters_min_1982d2: "在这个房间里抵御怪物的进攻，坚持1分钟。"
  npc_override_spl_in02_warlock_defend_room_monsters_min_484085: "在这个房间里抵御怪物的进攻，坚持5分钟。"
  npc_override_spl_in02_warlock_deserves_something_speci_f97046: "这值得一些特别的东西。"
  npc_override_spl_in02_warlock_destroy_all_monsters_cha_b07028: "消灭所有怪物，魔法之间就会稳定下来。"
  npc_override_spl_in02_warlock_difficult_human_become_w_136211: "人类想要成为咒术师是很困难的。"
  npc_override_spl_in02_warlock_disabling_hollow_stone_485ef2: "关闭虚空石。"
  npc_override_spl_in02_warlock_don_t_abuse_c08004: "不要滥用它。"
  npc_override_spl_in02_warlock_don_t_bother_me_5598e7: "别来烦我！"
  npc_override_spl_in02_warlock_don_t_bother_me_i_f77056: "别来烦我，我正忙着呢。"
  npc_override_spl_in02_warlock_don_t_disturb_me_7943e2: "还有，不要打扰我。"
  npc_override_spl_in02_warlock_don_t_make_me_disappoint_8deef7: "不要让我对你失望……"
  npc_override_spl_in02_warlock_don_t_tease_me_5c92ec: "别捉弄我！"
  npc_override_spl_in02_warlock_enabing_hollow_stone_ceb72a: "启动虚空石。"
  npc_override_spl_in02_warlock_even_i_don_t_know_dec18e: "就连我也不知道这一切是如何运作的。"
  npc_override_spl_in02_warlock_fairy_green_hair_chants_cae4d9: " ——绿发精灵念起了咒语。—— "
  npc_override_spl_in02_warlock_first_use_all_your_remai_ba49a1: "首先，在继续之前请先用完你所有的Job技能点。"
  npc_override_spl_in02_warlock_fool_95f8aa: "蠢货……"
  npc_override_spl_in02_warlock_get_out_here_6eefc0: "给我滚出去！"
  npc_override_spl_in02_warlock_give_human_44c76a: "把这个给人类。"
  npc_override_spl_in02_warlock_good_bdc919: "很好。"
  npc_override_spl_in02_warlock_hahaha_76a898: "哈哈哈"
  npc_override_spl_in02_warlock_hahahaha_80aaf3: "哈哈哈哈……"
  npc_override_spl_in02_warlock_he_ll_let_you_know_184407: "他会告诉你该怎么做。"
  npc_override_spl_in02_warlock_hey_human_8c59eb: "喂，人类！"
  npc_override_spl_in02_warlock_hm_701c55: "嗯……？"
  npc_override_spl_in02_warlock_hollow_stone_absorb_any_10e04a: "虚空石会吸收任何施加在它身上的魔法。"
  npc_override_spl_in02_warlock_hollow_stone_crystalizat_757e9d: "虚空石结晶失败了。"
  npc_override_spl_in02_warlock_hollow_stone_crystallize_abc1c8: "虚空石已被足够的魔力结晶化了。"
  npc_override_spl_in02_warlock_hollow_stone_needs_cryst_faa5b0: "虚空石需要用魔法来结晶化。"
  npc_override_spl_in02_warlock_how_dare_you_resist_me_474bc4: "你竟敢反抗我，人类？"
  npc_override_spl_in02_warlock_how_did_you_come_far_4bedf4: "你是怎么走到这一步的……"
  npc_override_spl_in02_warlock_how_did_you_enter_here_4ea6e9: "你是怎么进来的？"
  npc_override_spl_in02_warlock_how_you_adjusting_power_b2b842: "你适应咒术师的力量了吗？"
  npc_override_spl_in02_warlock_how_you_say_d04ffa: "你怎么能这么说？"
  npc_override_spl_in02_warlock_huh_154890: "啊？！"
  npc_override_spl_in02_warlock_huh_6c9c27: "嗯……"
  npc_override_spl_in02_warlock_huh_human_ce9459: "什么！！！人类？！"
  npc_override_spl_in02_warlock_human_what_you_want_676466: "人类！你想干什么？"
  npc_override_spl_in02_warlock_i_am_focusing_meditating_1b6d54: "我正在集中精神冥想。"
  npc_override_spl_in02_warlock_i_am_leader_warlocks_e3c520: "我是^000077咒术师^000000们的领袖。"
  npc_override_spl_in02_warlock_i_asked_you_double_check_9fa734: "我让你再三确认是否已经穿戴好了！"
  npc_override_spl_in02_warlock_i_don_t_know_how_5b7ea8: "我不知道该怎么办……"
  npc_override_spl_in02_warlock_i_don_t_pony_tail_b63056: "我没有马尾辫……"
  npc_override_spl_in02_warlock_i_envy_you_ec397e: "我真羡慕你。"
  npc_override_spl_in02_warlock_i_extend_my_arm_as_a28244: " ——我伸出手臂，一阵猛烈的声音在耳边回荡，一股凉意包围了我—— "
  npc_override_spl_in02_warlock_i_feel_like_something_sp_cff837: " ——我感觉到有什么特别的东西环绕着我。—— "
  npc_override_spl_in02_warlock_i_feel_you_strong_magic_1af71c: "我能感受到你拥有强大的魔力。"
  npc_override_spl_in02_warlock_i_follow_up_once_s_c19175: "等完成后我会跟上的。"
  npc_override_spl_in02_warlock_i_guess_i_could_give_a7893a: "如果你给我一颗3克拉的钻石，或许我可以再给你一些石头……"
  npc_override_spl_in02_warlock_i_guide_you_into_magic_f77adf: "我来带你进入魔法之间。"
  npc_override_spl_in02_warlock_i_just_leading_out_14220c: "我只是在把它引出来。"
  npc_override_spl_in02_warlock_i_ll_deal_you_after_64f6b2: "等你把人类送走之后，我再来处置你。"
  npc_override_spl_in02_warlock_i_m_meditating_i_said_8ed642: "我在冥想呢，我说了去找尤普谈，好吗。"
  npc_override_spl_in02_warlock_i_m_so_happy_you_d8eaae: "你能成功，我真是太高兴了。"
  npc_override_spl_in02_warlock_i_m_sorry_i_ve_5a90bf: "对不起，我之前不该怀疑你。"
  npc_override_spl_in02_warlock_i_m_studying_better_myse_2d8293: "我正在钻研，以提升自己的修为。"
  npc_override_spl_in02_warlock_i_m_sure_who_you_3c0836: "我不太确定。你是谁？"
  npc_override_spl_in02_warlock_i_need_check_you_re_77ab06: "但是，我需要确认你是否有这个资格。"
  npc_override_spl_in02_warlock_i_need_meditate_6a1565: "我需要冥想"
  npc_override_spl_in02_warlock_i_overlook_your_fault_415494: "我就饶恕你这次的过失吧。"
  npc_override_spl_in02_warlock_i_t_conduct_task_here_d4cfca: "我不能在这里进行实验。我需要去我的实验室。"
  npc_override_spl_in02_warlock_i_ve_heard_yoop_very_890ec3: "我从尤普那里听说，可以创造出一种非常有用的石头。"
  npc_override_spl_in02_warlock_i_warned_them_quiet_whil_d6f5f3: "我已经警告过他们，在我冥想的时候要保持安静。"
  npc_override_spl_in02_warlock_if_am_inside_room_time_c6c8b8: "如果我在'时间与魔法之室'里面，我就能追上你的力量！"
  npc_override_spl_in02_warlock_if_there_re_others_insid_b1f420: "如果房间里有其他人，你只需要等一会儿就行。"
  npc_override_spl_in02_warlock_if_you_any_business_me_31cdd4: "就算你有事找我，也给我走开！"
  npc_override_spl_in02_warlock_if_you_ask_ebein_sent_aac80f: "如果你让艾宾送你去魔法之间，他会送你过去的。"
  npc_override_spl_in02_warlock_if_you_dare_face_death_20356e: "如果你敢于面对死亡，你可以试着成为咒术师。"
  npc_override_spl_in02_warlock_if_you_don_t_anything_1bf2f2: "如果你没什么话要对我说的，能请你离开吗？"
  npc_override_spl_in02_warlock_if_you_get_careless_you_d653b0: "如果你掉以轻心，你就会被自己的力量所吞噬。"
  npc_override_spl_in02_warlock_if_you_stand_waiting_roo_f1c562: "如果你在等候室里等待，就能进入魔法之间了。"
  npc_override_spl_in02_warlock_if_you_wizard_good_you_758ff1: "如果你是巫师的话，最好记住我的名字。"
  npc_override_spl_in02_warlock_just_apologize_f5f64b: "^000077道歉就好了^000000！"
  npc_override_spl_in02_warlock_just_show_me_your_good_cb8e68: "让我看看你的诚意吧！"
  npc_override_spl_in02_warlock_just_whatever_you_want_7c7548: "随便你怎样好了……"
  npc_override_spl_in02_warlock_leave_me_alone_b651a3: "让我一个人静一静……！"
  npc_override_spl_in02_warlock_let_me_give_you_more_4a45e2: "让我再给你一些红宝石吧。"
  npc_override_spl_in02_warlock_magic_chamber_created_ma_fbfc23: "魔法之间是由魔法材料创造而成的。"
  npc_override_spl_in02_warlock_magic_chamber_starting_f_46f5d0: "魔法之间开始充满魔力了。"
  npc_override_spl_in02_warlock_magic_stabilization_fail_68f8d5: "魔法稳定化失败了。"
  npc_override_spl_in02_warlock_magic_stabilization_fail_a236bb: "魔法稳定化失败了。碎片失去了它的力量。"
  npc_override_spl_in02_warlock_magical_power_fragment_b_b34e32: "魔力碎片已经在魔法之间里被创造出来了。"
  npc_override_spl_in02_warlock_make_sure_you_enough_pot_c3655b: "请确保你有足够的药水来通过测试，因为魔法之间的怪物非常强大。"
  npc_override_spl_in02_warlock_master_c77d13: "师父……"
  npc_override_spl_in02_warlock_master_meditating_d2c906: "师父正在冥想。"
  npc_override_spl_in02_warlock_master_s_8de2d5: "这是师父的"
  npc_override_spl_in02_warlock_maybe_if_i_become_alchem_8ac8d2: "也许如果我成为炼金术士，会比现在更强，你说对吧？"
  npc_override_spl_in02_warlock_menu_extend_3f0419: "伸出手臂:别管它"
  npc_override_spl_in02_warlock_menu_extend_73dd8c: "伸出手:无视它"
  npc_override_spl_in02_warlock_menu_give_26e013: "给3克拉钻石:算了"
  npc_override_spl_in02_warlock_menu_go_9610d3: "去等候室:去外面"
  npc_override_spl_in02_warlock_menu_how_0ff7f6: "如何成为咒术师？:取消"
  npc_override_spl_in02_warlock_menu_i_5690f5: "我找到了:没有"
  npc_override_spl_in02_warlock_menu_i_8cf05b: "我带来了材料:我弄丢了魔法石:没事"
  npc_override_spl_in02_warlock_menu_leave_0e0312: "离开:留下"
  npc_override_spl_in02_warlock_menu_leave_62c1cc: "离开:留下"
  npc_override_spl_in02_warlock_menu_open_ed6b18: "开启竞技场:关闭竞技场:开启魔法之间:关闭魔法之间:启动虚空石:关闭虚空石:取消"
  npc_override_spl_in02_warlock_menu_search_4bbaf4: "搜索周围:无视它"
  npc_override_spl_in02_warlock_menu_what_4910f5: "我需要做什么？:取消"
  npc_override_spl_in02_warlock_monster_invasion_been_st_8f5707: "怪物入侵已被阻止。"
  npc_override_spl_in02_warlock_most_stones_quite_simila_135aa3: "但大多数石头看起来都差不多！"
  npc_override_spl_in02_warlock_msg_93fcbf: "…………"
  npc_override_spl_in02_warlock_mushsartas_ir_cyamar_d6c473: "MushSartas Ir Cyamar"
  npc_override_spl_in02_warlock_my_lab_located_north_wes_574be3: "我的实验室位于斯普伦蒂德的西北部。"
  npc_override_spl_in02_warlock_my_lab_located_north_wes_f6bcdb: "我的实验室位于斯普伦蒂德的西北部。收集齐了就把这些带给我。"
  npc_override_spl_in02_warlock_my_master_deal_you_then_d20e58: "那我的师父会来处置你的。"
  npc_override_spl_in02_warlock_my_master_meditating_now_b617b4: "我师父正在冥想，请跟我来。"
  npc_override_spl_in02_warlock_oh_i_spent_lot_time_41ac66: "哦，可是我花了很多时间在上面呢！"
  npc_override_spl_in02_warlock_oh_s_interesting_cc51b6: "哦，那倒是挺有意思的。"
  npc_override_spl_in02_warlock_oh_there_s_human_being_63734c: "哦~我的面前竟然有一个人类。"
  npc_override_spl_in02_warlock_oh_thing_c88102: "哦，这个东西？"
  npc_override_spl_in02_warlock_oh_yeah_85b76d: "哦，对了！"
  npc_override_spl_in02_warlock_oh_you_interested_88ffbe: "哦……你感兴趣吗？"
  npc_override_spl_in02_warlock_once_s_stabilized_fragme_744fc8: "一旦稳定下来，碎片就会向中心聚集。"
  npc_override_spl_in02_warlock_only_connected_special_g_9d7dbc: "这里只连接着一扇特殊的传送门！"
  npc_override_spl_in02_warlock_only_strong_magic_explai_805bdb: "只有强大的魔法才能解释这一切。"
  npc_override_spl_in02_warlock_opening_arena_cc6891: "开启竞技场。"
  npc_override_spl_in02_warlock_opening_chamber_magic_934dcb: "开启魔法之间。"
  npc_override_spl_in02_warlock_person_next_my_master_le_482a69: "你跟我师父旁边的人说话，他就会放你出去。"
  npc_override_spl_in02_warlock_please_careful_6cacb3: "请小心保管。"
  npc_override_spl_in02_warlock_please_check_whether_you_686b2b: "请检查一下你是否放错了位置，或者是否已经装备上了。"
  npc_override_spl_in02_warlock_please_check_your_equipm_6603db: "请检查你的装备窗口……"
  npc_override_spl_in02_warlock_please_come_back_after_r_384272: "请减少携带的道具数量之后再来。"
  npc_override_spl_in02_warlock_please_find_stone_come_b_94d1c8: "请找到那块石头然后回来找我。"
  npc_override_spl_in02_warlock_please_follow_me_aec511: "请跟我来。"
  npc_override_spl_in02_warlock_please_gather_glittering_5c7ee9: "请收集^000077闪耀水晶^000000和^000077巨大布拉迪姆碎片^000000。"
  npc_override_spl_in02_warlock_please_go_my_master_44e860: "请去找我的师父吧。"
  npc_override_spl_in02_warlock_please_quiet_while_my_ma_f46733: "在我师父冥想期间请保持安静。"
  npc_override_spl_in02_warlock_please_take_him_magical_246d34: "请带他去魔法之间。"
  npc_override_spl_in02_warlock_please_unequip_your_ridi_e3bc7f: "请解除骑乘宠物的状态后再试一次！"
  npc_override_spl_in02_warlock_proud_4f1219: "感到自豪吧。"
  npc_override_spl_in02_warlock_quiet_4f313b: "安静。"
  npc_override_spl_in02_warlock_s_hard_tell_if_you_69c824: "你有没有这个东西还看不出来吗！"
  npc_override_spl_in02_warlock_s_me_you_looking_current_0b5ef6: "你现在要找的不是我。"
  npc_override_spl_in02_warlock_s_my_mistake_2c4b52: "是我的错……"
  npc_override_spl_in02_warlock_s_noisy_be3487: "太吵了。"
  npc_override_spl_in02_warlock_s_nothing_3b8590: "没什么……"
  npc_override_spl_in02_warlock_seems_you_don_t_cb324f: "看来你没有那个东西？"
  npc_override_spl_in02_warlock_show_us_how_strong_you_75d886: "让我们看看你有多强吧。还有，别忘了穿戴好这个。"
  npc_override_spl_in02_warlock_sila_egnoloria_e5add6: "'^000077Sila Egnoloria^000000'"
  npc_override_spl_in02_warlock_so_as_i_said_d16294: "所以照我说的做。"
  npc_override_spl_in02_warlock_so_i_create_magic_6c726f: "这样我就能创造魔法了。"
  npc_override_spl_in02_warlock_so_you_cannot_change_you_11b217: "所以你无法更换职业。"
  npc_override_spl_in02_warlock_so_you_need_gather_mater_d65b46: "所以你需要收集材料来证明自己。"
  npc_override_spl_in02_warlock_sorry_5877c6: "对不起！！！"
  npc_override_spl_in02_warlock_stone_well_made_74ad10: "这块石头做工不错。"
  npc_override_spl_in02_warlock_strong_desire_more_power_bc895d: "渴望变得更强的执念，会让你的灵魂变得更加美丽。"
  npc_override_spl_in02_warlock_strong_power_gnaw_your_w_1b364c: "强大的力量会蚕食你脆弱的身体。"
  npc_override_spl_in02_warlock_t_defined_any_other_word_f86fc3: "这无法用其他任何语言来定义。"
  npc_override_spl_in02_warlock_talk_guy_weird_hair_0d5c5a: "去找那个发型奇怪的家伙谈谈。"
  npc_override_spl_in02_warlock_test_isn_t_hard_d5862d: "测试并不那么难。"
  npc_override_spl_in02_warlock_then_careful_14b314: "那就小心点。"
