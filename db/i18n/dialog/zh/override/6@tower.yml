Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_6@tower_EndlessTower_after_making_reservation_335b27: "预约完成后，你需要与后方的NPC对话，并选择菜单中的“进入副本”来进入地下城。"
  npc_override_6@tower_EndlessTower_all_monsters_level_been_68b134: "第{0}层的所有魔物已被击败。"
  npc_override_6@tower_EndlessTower_all_monsters_st_level_be_7bb9bb: "第51层的所有魔物已被击败。"
  npc_override_6@tower_EndlessTower_all_monsters_st_level_be_a1c87a: "第1层的所有魔物已被击败。"
  npc_override_6@tower_EndlessTower_all_monsters_th_level_be_2e7352: "第76层的所有魔物已被击败。"
  npc_override_6@tower_EndlessTower_all_monsters_th_level_be_5bacf5: "第26层的所有魔物已被击败。"
  npc_override_6@tower_EndlessTower_as_adventurer_there_s_my_cc519d: "作为一名冒险者，帮助有需要的人是我的义务。而且我也对那个地方非常好奇……"
  npc_override_6@tower_EndlessTower_as_soon_as_voice_stopped_6f3b0c: "^0000ff话音刚落，一股不可抗拒的力量便将你抬起，转移到了别处。"
  npc_override_6@tower_EndlessTower_as_you_may_know_after_869fb9: "你经过几次航海后应该知道，能跨越大陆穿越海洋的人并不多。我也未能征服那片大海。"
  npc_override_6@tower_EndlessTower_confirmed_party_been_mad_1f5316: "已确认队伍已组建完毕。是否要预约进入无尽之塔？"
  npc_override_6@tower_EndlessTower_create_purification_ston_d9fe53: "制作持续30分钟的净化之石。"
  npc_override_6@tower_EndlessTower_dangerous_here_let_me_mo_e9f0ec: "这里很危险。让我把你送到艾尔贝塔去吧。"
  npc_override_6@tower_EndlessTower_destroy_purification_sto_cf6a82: "立即销毁净化之石"
  npc_override_6@tower_EndlessTower_due_tower_s_aftereffects_569701: "由于高塔的后遗效应，你现在无法进入地下城，距离下次进入副本还有{0}小时{1}分钟{2}秒。"
  npc_override_6@tower_EndlessTower_enter_password_exactly_6f3b0d: "请输入正确的密码。"
  npc_override_6@tower_EndlessTower_excellent_now_we_re_good_9d65c1: "太好了！现在我们可以出发了。让我们再次起锚吧！"
  npc_override_6@tower_EndlessTower_excuse_me_you_adventurer_4ba82d: "打扰一下，你是冒险者吗？"
  npc_override_6@tower_EndlessTower_farewell_young_adventure_e26bbb: "再见了，年轻的冒险者。祝你好运。"
  npc_override_6@tower_EndlessTower_good_bye_now_dc00e5: "那就此别过。"
  npc_override_6@tower_EndlessTower_good_then_i_ll_combine_8c866a: "好的，那我就把这些组合起来，打造一柄双手剑。"
  npc_override_6@tower_EndlessTower_guests_huh_i_hope_you_872834: "客人，是吗？我希望你们来之前就知道自己会被埋在这里。如果不知道的话……哼，已经太迟了！"
  npc_override_6@tower_EndlessTower_hey_you_remnants_naght_s_1a32f3: "嘿，你身上带着纳格特·西格的遗物。"
  npc_override_6@tower_EndlessTower_how_about_hiring_me_as_91e635: "雇我当你的大副怎么样？"
  npc_override_6@tower_EndlessTower_how_you_like_play_one_0363eb: "想不想再来一轮？"
  npc_override_6@tower_EndlessTower_huh_you_sure_you_don_547936: "嗯？你真的愿意给我那么多钱吗？哇，太感谢你了！"
  npc_override_6@tower_EndlessTower_i_d_like_talk_you_5e11bb: "我很想再跟你聊聊，但是我……我得走了。"
  npc_override_6@tower_EndlessTower_i_demand_encore_f2dfba: "我要再来一次！"
  npc_override_6@tower_EndlessTower_i_don_t_know_why_430596: "我不知道你为什么需要这么多钱，但拿着吧。你可以拿走。"
  npc_override_6@tower_EndlessTower_i_feel_so_lucky_meet_16d64a: "能遇到像你这样热心的冒险者，我真是太幸运了。有了你给的这些钱，我终于可以再次扬帆前往那座塔了。"
  npc_override_6@tower_EndlessTower_i_going_leave_right_away_acaf6a: "我本来打算马上出发的，不过既然你加入了，我应该给你时间准备。我会在这里等你准备好再走。"
  npc_override_6@tower_EndlessTower_i_ll_remember_you_as_830086: "我会记住你，你是为数不多能让我尽兴的人之一。"
  npc_override_6@tower_EndlessTower_i_m_sorry_ask_you_eb538e: "很抱歉向你提出这个请求，尤其是我们才第一次见面，但你能帮我一个忙吗？我会长话短说。"
  npc_override_6@tower_EndlessTower_i_m_sorry_i_don_bbb503: "……很抱歉，我觉得你没有10,000 Zeny。感谢你的好意，但我需要的比这更多。"
  npc_override_6@tower_EndlessTower_i_m_sorry_i_don_d3efda: "很抱歉，我没有那么多钱。等我攒够了再回来吧。"
  npc_override_6@tower_EndlessTower_i_m_sorry_you_don_8bc193: "很抱歉，你的钱不够。我至少需要10,000 Zeny来补充我们的物资……"
  npc_override_6@tower_EndlessTower_i_m_sorry_you_ve_eb9b51: "很抱歉，你找错人了。"
  npc_override_6@tower_EndlessTower_i_may_applaud_you_your_dab4aa: "我或许该为你的勇气鼓掌……当然，我打算先陪你玩玩。"
  npc_override_6@tower_EndlessTower_i_move_you_alberta_c4496e: "我会把你送到艾尔贝塔。"
  npc_override_6@tower_EndlessTower_i_must_underestimated_yo_e9209f: "我一定是低估你了……没想到还能再见到你。"
  npc_override_6@tower_EndlessTower_i_now_allow_you_come_7d3bd0: "我现在允许你前来觐见我。到我这里来，到黑暗霸者之王纳格特·西格这里来！"
  npc_override_6@tower_EndlessTower_i_see_i_guess_you_f1b430: "我明白了。看来你并不像其他冒险者那样贪婪或野心勃勃。"
  npc_override_6@tower_EndlessTower_i_see_sorry_bother_you_319e4f: "我明白了……抱歉打扰你了。我知道一开始提这种要求确实太冒昧了。"
  npc_override_6@tower_EndlessTower_i_shall_resurrect_him_yo_affb82: "我会为你下一场演出复活他。再次击败他，然后我就会欣然接受你的挑战。"
  npc_override_6@tower_EndlessTower_i_smell_your_sweat_hear_b2e784: "我能闻到你的汗水，听到你在战斗中疲惫的喘息声。啊～人类对胜利的渴望总是让我兴奋不已。"
  npc_override_6@tower_EndlessTower_i_something_i_must_befor_36c71f: "我在死前还有一件事必须做。我必须找回那些死在塔里的船员的遗骸，并好好安葬他们。"
  npc_override_6@tower_EndlessTower_i_touched_when_you_accep_07731c: "看到你这么爽快地接受了一个陌生人的请求，我很感动。你一定就是那种善良的英雄般的冒险者吧。你有没有兴趣出海远航？"
  npc_override_6@tower_EndlessTower_i_ve_sailed_few_times_870f3e: "我航行过几次……但现在想来，我从未跨越过这片大陆。"
  npc_override_6@tower_EndlessTower_if_already_upgraded_card_e67c48: "如果装备已经精炼过或插有卡片，那些效果将会消失。这样没问题吗？"
  npc_override_6@tower_EndlessTower_if_you_dungeon_generated_ac0bd6: "如果副本已经生成，你可以直接进入。"
  npc_override_6@tower_EndlessTower_let_s_see_who_runs_8f6864: "让我们看看谁跑得最快。准备好了吗？"
  npc_override_6@tower_EndlessTower_let_s_speed_up_little_4a78a9: "我们稍微加快点速度，怎么样？"
  npc_override_6@tower_EndlessTower_level_now_being_opened_ec2d53: "*** 第{0}层正在开放。***"
  npc_override_6@tower_EndlessTower_looking_incredibly_excit_165ded: "^0000ff老人看起来异常兴奋，匆忙跑进海事商店采购物资。你闲着没事，于是决定去问问他在忙什么。^000000"
  npc_override_6@tower_EndlessTower_make_join_party_more_tha_10c521: "请组建或加入一个至少有两名成员的队伍，然后再试一次。"
  npc_override_6@tower_EndlessTower_memorial_dungeon_endless_6dbd39: "记忆副本“无尽之塔”不存在。"
  npc_override_6@tower_EndlessTower_menu_at_0e3d00: "^0000ff他的故事至少有一半听起来是夸张吹嘘，但有件事引起了你的注意:他坚称海洋上有一座巨大的塔，高耸入云。^000000"
  npc_override_6@tower_EndlessTower_menu_enter_de5f6f: "进入{0}:返回艾尔贝塔:取消"
  npc_override_6@tower_EndlessTower_menu_generate_16e939: "生成副本{0}:进入副本:返回艾尔贝塔:取消"
  npc_override_6@tower_EndlessTower_menu_generate_475ec4: "制作净化之石:移除净化之石:取消"
  npc_override_6@tower_EndlessTower_menu_i_25fd32: "（例如:1层→1，25层→25）"
  npc_override_6@tower_EndlessTower_menu_i_ac51fe: "（例如:26层→26，50层→50）"
  npc_override_6@tower_EndlessTower_menu_i_c655b4: "（例如:76层→76，99层→99）"
  npc_override_6@tower_EndlessTower_menu_i_ce6ac8: "我晚点再来。:我们现在就出发！"
  npc_override_6@tower_EndlessTower_menu_i_f176fc: "（例如:51层→51，75层→75）"
  npc_override_6@tower_EndlessTower_menu_it_11f899: "我没问题，请做一把。:还是算了！"
  npc_override_6@tower_EndlessTower_menu_make_e3b707: "制作一柄双手剑。:不了，谢谢。"
  npc_override_6@tower_EndlessTower_menu_mysterious_d9bc51: "神秘的声音:你们是什么人，竟敢闯入我的圣地？！"
  npc_override_6@tower_EndlessTower_menu_no_5abbeb: "不了！:当然可以。"
  npc_override_6@tower_EndlessTower_menu_notice_5d1734: "提示:驯服魔物不计入击败数量。"
  npc_override_6@tower_EndlessTower_menu_notice_fd6b70: "提示:如果在任何异常情况下击败魔物，你将无法进入下一层！"
  npc_override_6@tower_EndlessTower_menu_party_2e5e7f: "队伍名称:{0}"
  npc_override_6@tower_EndlessTower_menu_party_8c7899: "队长:{0}"
  npc_override_6@tower_EndlessTower_menu_th_edb1a6: "第26层:第51层:第76层"
  npc_override_6@tower_EndlessTower_menu_yes_01765b: "好的，我们出发吧！:不，我还没准备好……"
  npc_override_6@tower_EndlessTower_menu_you_8d3d86: "^0000ff即使他没有再多说什么，你也能想象出那支舰队在最后一次航行中濒临覆灭的惨状。他沉默了一会儿，脸上浮现出沉痛的悔恨，然后说道:^000000"
  npc_override_6@tower_EndlessTower_message_engraved_brazier_8db6dd: "- 火盆上刻着一行文字 -"
  npc_override_6@tower_EndlessTower_mr_janssen_talked_about_87ed98: "^0000ff詹森先生讲述了他那些危险的海洋航行经历，讲了好一会儿。你时间充裕，于是坐下来静静聆听他的故事。^000000"
  npc_override_6@tower_EndlessTower_msg_3a52ce: "。"
  npc_override_6@tower_EndlessTower_my_crew_starving_few_the_84803f: "我的船员们饥肠辘辘，有几个人走进塔里去找食物……但他们再也没有回来。"
  npc_override_6@tower_EndlessTower_my_instincts_told_me_tow_f8e1de: "我的直觉告诉我那座塔很危险。我虽然好奇，但不想拿命去冒险。我们在暴风雨中等待了七天，直到雨停，但始终没有人回来。"
  npc_override_6@tower_EndlessTower_mysterious_voice_echoes_d5d8a3: "^0000ff当你触摸到那块散发着强光的透明水晶时，一个神秘的声音在房间里回荡。^000000"
  npc_override_6@tower_EndlessTower_naght_sieger_s_body_turn_48626f: "纳格特·西格的躯体化为暗色的灰烬，随风飘散。"
  npc_override_6@tower_EndlessTower_no_c03f1e: "不……"
  npc_override_6@tower_EndlessTower_no_s_good_enough_i_c7859e: "不，那已经够了。我现在虽只有一艘小渔船，但我曾经是指挥一支舰队的船长。"
  npc_override_6@tower_EndlessTower_nooo_my_soul_my_shell_37efe1: "不——！我的灵魂……我的躯壳……！不——！"
  npc_override_6@tower_EndlessTower_npc_manages_crystal_th_l_3bc9f5: "这位NPC管理着第100层的水晶。请输入密码。"
  npc_override_6@tower_EndlessTower_npc_manages_tower_st_th_1e6a98: "这位NPC管理着高塔的第1层到第25层。"
  npc_override_6@tower_EndlessTower_npc_manages_tower_st_th_392df1: "这位NPC管理着高塔的第26层到第50层。"
  npc_override_6@tower_EndlessTower_npc_manages_tower_st_th_f13124: "这位NPC管理着高塔的第51层到第75层。"
  npc_override_6@tower_EndlessTower_npc_manages_tower_th_th_b252e6: "这位NPC管理着高塔的第76层到第99层。"
  npc_override_6@tower_EndlessTower_okay_then_3edbd8: "……好吧……"
  npc_override_6@tower_EndlessTower_okay_time_come_make_my_716cdb: "好了，该我登场亮相了！"
  npc_override_6@tower_EndlessTower_old_man_after_finishing_2b2193: "^0000ff老人订完货后，朝你走来。^000000"
  npc_override_6@tower_EndlessTower_once_again_i_had_such_74bc25: "又一次，我度过了如此愉快的时光，人类们。期待与你们再次相见。"
  npc_override_6@tower_EndlessTower_one_who_scatters_ashes_d_bc6d4b: "在此处撒下黑暗灰烬之人，将离黑暗霸者之王纳格特·西格更近一步……"
  npc_override_6@tower_EndlessTower_our_desperation_survive_5d7fbd: "为了生存，我们抛弃了所有货物，只带了一点水和在塔边找到的可食用植物离开了那座塔。当我们最终抵达陆地时，我是唯一活着的人……"
  npc_override_6@tower_EndlessTower_party_leader_did_generat_5a6394: "队长尚未生成副本。"
  npc_override_6@tower_EndlessTower_please_enter_correct_pas_a22c53: "请输入正确的密码。"
  npc_override_6@tower_EndlessTower_please_enter_level_numbe_cf028a: "请输入要开放的层数。"
  npc_override_6@tower_EndlessTower_please_enter_password_046bca: "请输入密码。"
  npc_override_6@tower_EndlessTower_please_enter_password_99d476: "请输入密码"
  npc_override_6@tower_EndlessTower_purification_stone_destr_33ef8e: "净化之石将在1分钟后销毁。"
  npc_override_6@tower_EndlessTower_radiating_crystal_piece_956163: "^0000ff那块散发着光芒的水晶碎片再次向你发出召唤，就像上次一样。^000000"
  npc_override_6@tower_EndlessTower_records_after_effects_re_0e514b: "^0000ff与无尽之塔相关的记录和后遗效应已被清除。你可以再次生成并进入无尽之塔。^000000"
  npc_override_6@tower_EndlessTower_records_aftereffects_rel_7b3cdc: "^0000ff与无尽之塔相关的记录和后遗效应已被清除。你可以再次生成并进入无尽之塔。^000000"
  npc_override_6@tower_EndlessTower_remaining_monsters_level_48b90d: "第{0}层剩余魔物数量 - {1}"
  npc_override_6@tower_EndlessTower_remaining_monsters_st_le_5d0bb7: "第1层剩余魔物数量 - {0}"
  npc_override_6@tower_EndlessTower_remaining_monsters_st_le_68db04: "第51层剩余魔物数量 - {0}"
  npc_override_6@tower_EndlessTower_remaining_monsters_th_le_4fe072: "第26层剩余魔物数量 - {0}"
  npc_override_6@tower_EndlessTower_remaining_monsters_th_le_9a93c0: "第76层剩余魔物数量 - {0}"
  npc_override_6@tower_EndlessTower_remaining_targets_ea_001664: "剩余目标 {0}只"
  npc_override_6@tower_EndlessTower_reservation_failed_b861ab: "^0000ff{0} ^000000- 预约失败！"
  npc_override_6@tower_EndlessTower_s_still_too_early_celebr_9726f4: "现在庆祝战胜我的得力助手诺森还为时过早，因为他还没有被彻底消灭！"
  npc_override_6@tower_EndlessTower_s_you_liberated_us_evil_d1c31c: "正是你们将我们从邪恶的纳格特·西格手中解放出来。"
  npc_override_6@tower_EndlessTower_seems_engulfed_huge_vort_69196a: "[ {0} ]，似乎被一股巨大的漩涡吞噬了"
  npc_override_6@tower_EndlessTower_shall_we_leave_now_d86c9c: "我们现在出发吗？"
  npc_override_6@tower_EndlessTower_sigh_i_don_t_know_7d3523: "唉……我不知道自己还能不能再出海航行……"
  npc_override_6@tower_EndlessTower_so_all_i_could_cast_bb5d2c: "所以在我的舰队失事后，我只能在那座巨大的高塔旁抛锚停泊。起初我们只打算在那里待到暴风雨结束，但暴风雨并没有像我们期望的那样很快过去。"
  npc_override_6@tower_EndlessTower_sure_no_problem_come_bac_6f97e7: "当然没问题。准备好再回来吧。"
  npc_override_6@tower_EndlessTower_sure_no_problem_i_ll_5a507f: "当然没问题。我会等你们回来。"
  npc_override_6@tower_EndlessTower_t_happening_i_t_defeated_417fc4: "这……这不可能！我怎么会败！"
  npc_override_6@tower_EndlessTower_th_level_s_crystal_been_12a148: "第100层的水晶已被激活。"
  npc_override_6@tower_EndlessTower_thank_you_extremely_dang_f60354: "谢谢你，但那是一个极其危险的地方。我有我应尽的职责，但你并没有任何义务对我或他们负责。我不希望让你这样年轻的人去那种危险的地方送死。"
  npc_override_6@tower_EndlessTower_thank_you_so_much_now_12d041: "太感谢你了！现在我终于可以为我的船补充食物和物资了。你真是个好人，太好了！"
  npc_override_6@tower_EndlessTower_thank_you_so_much_now_7d434a: "非常感谢你。现在我们终于可以逃离这个寒冷黑暗的地方……去往天堂了。"
  npc_override_6@tower_EndlessTower_then_pull_up_anchor_firs_2a73b4: "那就起锚吧，大副！"
  npc_override_6@tower_EndlessTower_they_may_appear_one_hand_167db6: "它们看起来像是单手剑，但如果你需要的话，我可以把它们合成一柄双手剑。这是我能想到的报答你解救我的唯一方式。"
  npc_override_6@tower_EndlessTower_try_reserve_da0d35: "^0000ff{0}^000000 - 尝试预约"
