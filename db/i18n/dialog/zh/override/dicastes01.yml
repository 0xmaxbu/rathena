Body:
  npc_override_dicastes01_guides_dicastes_ah_s_beautiful_building_df9193: "啊~那是一座漂亮的建筑。"
  npc_override_dicastes01_guides_dicastes_although_i_arrived_here_d10e36: "虽然我是第一个到达这里的冒险者，但酒馆老板才是第一个住在这里的人。"
  npc_override_dicastes01_guides_dicastes_around_o_clock_588a16: "{0}大约在7点钟方向，"
  npc_override_dicastes01_guides_dicastes_because_dangers_here_we_7c8b4a: "因为这里有危险，我们需要更好的安全措施……"
  npc_override_dicastes01_guides_dicastes_don_t_seem_good_relation_d047f8: "{0}似乎和我们一样，与萨法族的关系不太好。"
  npc_override_dicastes01_guides_dicastes_go_directly_north_here_y_91a1bd: "从这里一直向北走，你不会错过它的。"
  npc_override_dicastes01_guides_dicastes_he_might_some_valuable_i_29708a: "他可能有一些有价值的信息可以提供给你。"
  npc_override_dicastes01_guides_dicastes_i_m_ichack_first_adventu_099b0d: "我是伊查克，第一个到达埃尔迪卡斯蒂斯的冒险者！"
  npc_override_dicastes01_guides_dicastes_if_you_go_you_see_5218a8: "如果你去{0}，你可以看到最近精炼的布拉迪姆。"
  npc_override_dicastes01_guides_dicastes_menu_dicastes_2e887c: "迪卡斯蒂斯迪尔：住宅区：训练室：工厂：酒馆：猫爪商队"
  npc_override_dicastes01_guides_dicastes_oh_you_stranger_3b4e8f: "哦！！你是个陌生人！"
  npc_override_dicastes01_guides_dicastes_one_most_important_reaso_12ad52: "这是他们住在这里的最重要原因之一。"
  npc_override_dicastes01_guides_dicastes_perhaps_s_because_tradin_4b6db8: "也许是因为涉及贸易。"
  npc_override_dicastes01_guides_dicastes_please_make_sure_you_sig_7622c8: "请确保你在{0}签到，否则你会有麻烦的。"
  npc_override_dicastes01_guides_dicastes_poor_cats_they_must_shiv_03ecd7: "可怜的猫。它们一定在外面冻得发抖。"
  npc_override_dicastes01_guides_dicastes_residential_area_divided_148e34: "住宅区分为两个区域。"
  npc_override_dicastes01_guides_dicastes_s_said_they_discuss_impo_80f1fb: "据说他们在讨论重要的事情……"
  npc_override_dicastes01_guides_dicastes_s_why_i_provide_service_00bc65: "这就是为什么我会为来自米德加兹的冒险者提供向导服务。"
  npc_override_dicastes01_guides_dicastes_sapha_tribe_so_weird_how_f3f9e6: "萨法族真奇怪。他们怎么能在那里睡觉呢？"
  npc_override_dicastes01_guides_dicastes_there_someone_expedition_1b0ae9: "远征队里有人说他是第一个来的，但其实是我。没错。"
  npc_override_dicastes01_guides_dicastes_what_you_like_know_156d4f: "你想知道什么？"
  npc_override_dicastes01_guides_dicastes_you_don_t_understand_832af3: "你不明白吗？"
  npc_override_dicastes01_guides_dicastes_you_ever_been_9f494f: "你曾经去过"
  npc_override_dicastes01_guides_dicastes_you_find_their_caravan_j_714d75: "你可以在城门外面找到他们的商队。"
  npc_override_dicastes01_guides_dicastes_you_won_t_believe_me_27c13a: "除非你亲眼看到，否则你不会相信我的！去亲眼看看吧！"
