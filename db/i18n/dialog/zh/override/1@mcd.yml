Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@mcd_CharlestonCrisis_accelerate_main_computer_49846f: "为了加速主计算机的处理速度并夺回工厂，必须处理掉50个Steps。"
  npc_override_1@mcd_CharlestonCrisis_after_break_ing_up_newoz_c52a40: "在噩梦中与Newoz决裂后，我本想着四处游荡，我虽生于恶魔却失去了目标。"
  npc_override_1@mcd_CharlestonCrisis_another_charleston_fdcbe0: "又一个Charleston 2？"
  npc_override_1@mcd_CharlestonCrisis_anyway_i_nothing_now_onl_ae34d4: "总之，我现在一无所有……只是为了能够重新站起来，所以希望到时候能派遣像你这样的冒险者。"
  npc_override_1@mcd_CharlestonCrisis_aren_t_you_disappointed_7fffad: "你不失望吗？你真的要让努力白费吗？因为那真的很愚蠢。我建议你重新考虑。"
  npc_override_1@mcd_CharlestonCrisis_behind_mechanical_langua_b3bc40: "后面是无法理解的机械语言。"
  npc_override_1@mcd_CharlestonCrisis_bookcase_filled_research_aa8cea: "书架上摆满了研究日志。"
  npc_override_1@mcd_CharlestonCrisis_both_noise_story_enterta_c59ace: "噪音和故事都很精彩。和Newoz一起来，也许我们还能再见面。"
  npc_override_1@mcd_CharlestonCrisis_but_2e7fce: "但是……"
  npc_override_1@mcd_CharlestonCrisis_charleston_already_compl_6254ab: "Charleston 3已经完成了吗？"
  npc_override_1@mcd_CharlestonCrisis_charleston_charleston_be_54ab7b: "Charleston 1。Charleston 2已被强制连接到主计算机的一部分，我无法控制她。"
  npc_override_1@mcd_CharlestonCrisis_charleston_created_decad_65d46e: "Charleston 1是20年前创造的。我见到Charleston 1是为了学习她的技术。"
  npc_override_1@mcd_CharlestonCrisis_charleston_defective_bc9ed4: "Charleston 2有缺陷。"
  npc_override_1@mcd_CharlestonCrisis_charleston_equipped_nume_dd3740: "Charleston配备了大量的Nanosteps，这是一种AI芯片，与其他AI芯片有机协作，指挥Charleston正确判断和行动。"
  npc_override_1@mcd_CharlestonCrisis_charleston_factory_under_a6a549: "Charleston工厂现在在我的控制之下。我正在摧毁一切，这样就不会再有任何像我这样悲伤的机器人看到这个世界。"
  npc_override_1@mcd_CharlestonCrisis_charleston_reinitializin_c25e74: "Charleston 1正在重新初始化自己。嗯……"
  npc_override_1@mcd_CharlestonCrisis_charleston_s_combat_defe_288126: "Charleston 3？那是基于Charleston 2和我的设计制造的战斗/防御单位。我以为它还在核心进行测试。"
  npc_override_1@mcd_CharlestonCrisis_charleston_s_data_update_6c09bb: "Charleston的数据必须每天通过实验室的主计算机更新。我们称之为定期维护。"
  npc_override_1@mcd_CharlestonCrisis_charleston_s_just_robot_968ebe: "-Charleston……它只是一个机器人……终于在主机上植入了病毒。"
  npc_override_1@mcd_CharlestonCrisis_charleston_s_os_improved_ceebdc: "Charleston 2的操作系统像活的大脑一样自行改进。"
  npc_override_1@mcd_CharlestonCrisis_charleston_s_system_over_a844a2: "Charleston 2的系统在定期维护期间过载。与其操作系统的断开连接失败。"
  npc_override_1@mcd_CharlestonCrisis_charleston_s_too_much_in_c2df0a: "Charleston 1，信息太多了。"
  npc_override_1@mcd_CharlestonCrisis_charleston_standing_stil_760d92: "Charleston 2静止不动，系统处于睡眠模式。有那么一瞬间，她的眼睛里闪烁着未落的泪水。"
  npc_override_1@mcd_CharlestonCrisis_charleston_verge_break_d_132790: "Charleston 2濒临崩溃。你能帮助她吗？"
  npc_override_1@mcd_CharlestonCrisis_charleston_you_all_right_00ecd2: "Charleston 2！你还好吗？有人入侵了你的系统和工厂。"
  npc_override_1@mcd_CharlestonCrisis_come_think_everything_ab_73ecb8: "回想起来，关于Ve博士的一切都很可疑。我的意思是，他事事都依赖他的助手Charleston 1。"
  npc_override_1@mcd_CharlestonCrisis_complete_machine_technol_091712: "通过完整的机械技术获得永生，存在很多变数。"
  npc_override_1@mcd_CharlestonCrisis_core_center_powers_entir_b7b0f6: "这个核心为整个工厂提供动力。"
  npc_override_1@mcd_CharlestonCrisis_could_you_bring_explosiv_063385: "你能带来1个爆炸粉末吗？如你所见，我被卡在接入设备上了。"
  npc_override_1@mcd_CharlestonCrisis_crisis_charleston_test_v_76b322: "Charleston危机测试版130603a"
  npc_override_1@mcd_CharlestonCrisis_current_value_e1c929: "当前值是{0}，"
  npc_override_1@mcd_CharlestonCrisis_currently_i_m_unable_mov_c20e03: "目前我无法移动，我的一个组件出了问题。你能帮我从工厂里取替换零件吗？"
  npc_override_1@mcd_CharlestonCrisis_destroying_too_many_step_5a0a4d: "摧毁太多Steps可能会导致重新激活工厂时出现问题。你应该咨询左侧的主计算机。"
  npc_override_1@mcd_CharlestonCrisis_did_i_fail_5b7023: "……我失败了吗？"
  npc_override_1@mcd_CharlestonCrisis_did_i_really_succeed_cre_b32ab9: "-我真的成功创造了人性吗？机器人，我不能说。我理解人类吗？"
  npc_override_1@mcd_CharlestonCrisis_did_she_really_say_i_99e6d0: "她真的那么说了吗？说我破坏了Charleston 2？唉……"
  npc_override_1@mcd_CharlestonCrisis_didn_t_change_anything_4793af: "^FF0000这并没有改变什么。^000000"
  npc_override_1@mcd_CharlestonCrisis_difficulty_f92221: "难度是0，"
  npc_override_1@mcd_CharlestonCrisis_doesn_t_matter_now_i_b5301e: "-没关系。现在我很高兴见到她，我最好的朋友，我的宝贝，Lily……"
  npc_override_1@mcd_CharlestonCrisis_don_t_act_like_you_8b9407: "别装作你什么都知道！我们无法独立思考。我们认为我们知道的一切都是被编程进去的！"
  npc_override_1@mcd_CharlestonCrisis_don_t_mock_me_8ec4c0: "……别嘲笑我。"
  npc_override_1@mcd_CharlestonCrisis_don_t_worry_about_securi_3182eb: "别担心安全设备。它们很容易修复。Ve博士在工厂3号线北面的实验室里。"
  npc_override_1@mcd_CharlestonCrisis_dr_ve_seems_planning_plo_6c4c39: "-Ve博士似乎在策划一个阴谋，生命与机器的逐渐结合让她疯狂，将工厂改造成堡垒，她的灵魂和机器人……"
  npc_override_1@mcd_CharlestonCrisis_dr_ve_sighs_writes_down_717084: "Ve博士叹了口气，写下了一些东西。"
  npc_override_1@mcd_CharlestonCrisis_dr_ve_tell_you_everythin_251322: "Ve博士可以告诉你一切。快点！"
  npc_override_1@mcd_CharlestonCrisis_during_its_update_proces_ea624d: "在其更新过程中，与服务器的连接被阻塞。当我们向Shalosh施压时，"
  npc_override_1@mcd_CharlestonCrisis_egd_8be8cb: "#%@EGD&#(@#……"
  npc_override_1@mcd_CharlestonCrisis_egd_reinitializing_os_80fe64: "#%@EGD&#(@#……正在重新初始化操作系统……"
  npc_override_1@mcd_CharlestonCrisis_either_critical_error_oc_5b3dad: "要么发生了严重错误，要么Charleston 2已经超越了自我反思操作系统1.1版的极限。"
  npc_override_1@mcd_CharlestonCrisis_end_486659: "结束"
  npc_override_1@mcd_CharlestonCrisis_enjoying_adventure_there_5c2367: "享受冒险吗？到处都是机器。这里曾经是一个研究室。看到那些书了吗？"
  npc_override_1@mcd_CharlestonCrisis_enough_i_ll_destroy_char_6c9527: "够了。如果这是阻止她的唯一方法，我会摧毁Charleston 2。"
  npc_override_1@mcd_CharlestonCrisis_enough_i_understand_you_29ed8b: "够了！我理解你正在经历很多情感动荡，但这越来越荒谬了。"
  npc_override_1@mcd_CharlestonCrisis_enough_let_s_shut_down_5410d9: "够了。让我们关闭Charleston 2。她的人工智能需要重新校准。"
  npc_override_1@mcd_CharlestonCrisis_err_isn_t_right_970432: "嗯？这不对。"
  npc_override_1@mcd_CharlestonCrisis_even_if_effort_unremitti_631826: "即使努力永不停歇……"
  npc_override_1@mcd_CharlestonCrisis_every_page_written_mecha_81e3c9: "每一页都是用机械语言写的。"
  npc_override_1@mcd_CharlestonCrisis_every_time_charleston_co_686213: "每次Charleston 2复活，虽然在不同的机器里，她都更聪明、更感性、更麻烦。"
  npc_override_1@mcd_CharlestonCrisis_explosive_powders_easy_bc5f14: "99个爆炸粉末？简单。"
  npc_override_1@mcd_CharlestonCrisis_ferre_came_me_i_haven_ab17aa: "Ferre和我一起来的，但我没见到他。不用了，谢谢；我知道他会回到我身边。"
  npc_override_1@mcd_CharlestonCrisis_finally_you_re_here_i_b30cdf: "终于，你来了！我一直在等你。"
  npc_override_1@mcd_CharlestonCrisis_follow_leftward_hallway_6096a9: "沿着左边的走廊走，记住只有你能保护自己。"
  npc_override_1@mcd_CharlestonCrisis_generator_must_working_f_c0b474: "发电机必须在工作。工厂里充满了活动的声音。"
  npc_override_1@mcd_CharlestonCrisis_go_back_288584: "回去。"
  npc_override_1@mcd_CharlestonCrisis_handwriting_very_scribbl_4d2748: "字迹非常潦草。"
  npc_override_1@mcd_CharlestonCrisis_he_s_busy_scribbling_som_37906f: "- 他正忙着写东西，靠近点和他谈谈。-"
  npc_override_1@mcd_CharlestonCrisis_he_s_busy_scribbling_som_ec74db: "- 他正忙着写东西。你不应该打扰他。-"
  npc_override_1@mcd_CharlestonCrisis_hello_adventurer_i_m_cha_bbeffb: "你好，冒险者。我是Charleston，独立项目的发起人。"
  npc_override_1@mcd_CharlestonCrisis_her_longevity_device_dis_b42904: "她的长寿装置已放电；她走不了多远。请跟着她。"
  npc_override_1@mcd_CharlestonCrisis_hmm_mediated_machine_bod_93bdf4: "嗯……在中介机器身体上仍然很困难，是吗……你真的需要一个活体捐献者吗？呵呵！"
  npc_override_1@mcd_CharlestonCrisis_hmm_suit_yourself_40ff43: "嗯……随你便！"
  npc_override_1@mcd_CharlestonCrisis_hour_cooldown_reset_85f72e: "20小时冷却重置"
  npc_override_1@mcd_CharlestonCrisis_how_dare_you_bring_stran_91599b: "你怎么敢带陌生人进来？我告诉过你我是认真的！像你这样的过时版本永远不可能理解我！"
  npc_override_1@mcd_CharlestonCrisis_i_am_responsible_rd_mach_245a5f: "……我负责第3台机器。"
  npc_override_1@mcd_CharlestonCrisis_i_am_robot_you_surprised_8c403a: "我是机器人，你惊讶吗？"
  npc_override_1@mcd_CharlestonCrisis_i_couldn_t_stop_happenin_c4ee35: "我无法阻止它发生或改变过去。但也许别人可以。"
  npc_override_1@mcd_CharlestonCrisis_i_d_better_reset_charles_9f24e0: "我最好重置Charleston 2并清除数据。这次真的很险。"
  npc_override_1@mcd_CharlestonCrisis_i_did_nothing_wrong_i_2a0277: "我没做错任何事。我只是和Charleston 2快速交谈了一下。这就是事实。"
  npc_override_1@mcd_CharlestonCrisis_i_didn_t_anything_i_81fff7: "我什么都没做，我只是和Charleston 2谈了一下。"
  npc_override_1@mcd_CharlestonCrisis_i_don_t_care_who_7a8644: "我不在乎你和谁在一起。我只需要知道你是否能帮我。"
  npc_override_1@mcd_CharlestonCrisis_i_don_t_know_how_b4befa: "我不知道它在这里站了多久，但我已经很久不能动了……"
  npc_override_1@mcd_CharlestonCrisis_i_help_ad8459: "我可以帮忙。"
  npc_override_1@mcd_CharlestonCrisis_i_invited_only_newoz_wel_16d5f8: "我只邀请了Newoz。好吧，我想我不应该为那个需要 closure 的机器人开门。"
  npc_override_1@mcd_CharlestonCrisis_i_just_saw_you_talking_e11d29: "我刚看到你在说话，那我就等别人来帮忙！"
  npc_override_1@mcd_CharlestonCrisis_i_know_why_data_constant_96b3a3: "-我不知道为什么数据不断损坏，备份主机没用，就像生病一样我的记忆正在被侵蚀。"
  npc_override_1@mcd_CharlestonCrisis_i_ll_continue_try_as_f6b255: "只要还有一线希望，我就会继续尝试。"
  npc_override_1@mcd_CharlestonCrisis_i_ll_try_again_if_6f23b5: "如果还有一线希望，我会再试一次。"
  npc_override_1@mcd_CharlestonCrisis_i_ll_wait_one_person_13c20c: "我会等那个人，无论多久。"
  npc_override_1@mcd_CharlestonCrisis_i_m_afraid_there_s_738e51: "恐怕发电机有问题。你能检查所有三个发电机吗？我会告诉你它们的位置。"
  npc_override_1@mcd_CharlestonCrisis_i_m_going_destroy_whole_8315de: "我要摧毁整个工厂！"
  npc_override_1@mcd_CharlestonCrisis_i_m_looking_adventurers_749dd3: "我正在寻找至少130级、身体健康、没有慢性病、不在服用处方药的冒险者。"
  npc_override_1@mcd_CharlestonCrisis_i_m_observer_i_m_4bb567: "我是观察者。我在这里记录Charleston 1和2的历史。我无法修复它们中的任何一个，但我可以等待。"
  npc_override_1@mcd_CharlestonCrisis_i_m_only_one_world_dabf16: "我是这个世界上唯一真正能理解你的人。"
  npc_override_1@mcd_CharlestonCrisis_i_m_robot_i_what_bd747d: "我是机器人。我按照程序做事，其他什么都不重要。"
  npc_override_1@mcd_CharlestonCrisis_i_m_taking_charleston_me_d69480: "我要带走Charleston 3。"
  npc_override_1@mcd_CharlestonCrisis_i_may_understand_you_lea_106d70: "我可能不理解你，但至少我在告诉你我认为是真实的东西。"
  npc_override_1@mcd_CharlestonCrisis_i_reading_letter_shalosh_48803c: "我正在读Shalosh的信，等我回过神来，我已经在一个完全不同的地方了。好吧，我正好可以利用这个机会写一首新歌。"
  npc_override_1@mcd_CharlestonCrisis_i_think_someone_tried_ha_26d416: "我想有人试图入侵工厂的主计算机。"
  npc_override_1@mcd_CharlestonCrisis_i_told_charleston_she_s_b61049: "我告诉Charleston 2她正在接受延长维护，但我们不知道这个延长维护状态会持续多久。"
  npc_override_1@mcd_CharlestonCrisis_i_ve_followed_newoz_wher_73a72f: "我跟着Newoz。他现在在哪里？"
  npc_override_1@mcd_CharlestonCrisis_i_ve_got_so_many_d182a3: "关于这个案子，我有很多东西要记录。"
  npc_override_1@mcd_CharlestonCrisis_i_who_did_i_ve_c9c5cf: "是我做的。基于我的自我反思操作系统的推理，我想了很久。"
  npc_override_1@mcd_CharlestonCrisis_i_wouldn_t_done_if_52fd3e: "如果当时我被说服了，我就不会那么做了。"
  npc_override_1@mcd_CharlestonCrisis_if_charleston_reinitiali_99870c: "如果Charleston 1被正确重新初始化，她可以重组她的操作系统，修复对她的损害，并重新激活另一个Charleston 2。"
  npc_override_1@mcd_CharlestonCrisis_if_i_use_explosives_inte_9f9037: "如果我用爆炸物来增强电流……"
  npc_override_1@mcd_CharlestonCrisis_if_you_re_disillusioned_e657fa: "如果你对你不可改变的过去、不确定的未来和令人沮丧的现在感到幻灭，那我不会强迫你。"
  npc_override_1@mcd_CharlestonCrisis_if_you_re_looking_someth_153e83: "如果你在找什么……"
  npc_override_1@mcd_CharlestonCrisis_if_you_t_then_you_69f6a2: "如果你做不到，那你就想摧毁整个世界。"
  npc_override_1@mcd_CharlestonCrisis_invitee_unable_interfere_16d0c6: "受邀者无法干涉原始时间，停留也无法改变任何事情。"
  npc_override_1@mcd_CharlestonCrisis_ironic_isn_t_robots_supp_6d0956: "讽刺，不是吗？机器人应该没有情感，但我在这里，对过去感到悔恨。"
  npc_override_1@mcd_CharlestonCrisis_is_that_it_f5397f: "就这样吗？"
  npc_override_1@mcd_CharlestonCrisis_joke_you_ll_never_unders_6044b7: "不是开玩笑。你永远无法理解。你只会服从命令，从不独立思考。我恨这个工厂，这个世界！我恨自己是机器人！"
  npc_override_1@mcd_CharlestonCrisis_just_based_hard_work_os_2c81ca: "只是基于操作系统的努力工作……为了你在世界另一端的帮助，Charleston 2将成为'非常好'的机器人！"
  npc_override_1@mcd_CharlestonCrisis_let_me_explain_what_oh_8f55d2: "让我解释一下该怎么做。哦，让我先关闭工厂入口，免得有什么东西不请自来。"
  npc_override_1@mcd_CharlestonCrisis_let_me_talk_your_leader_a77c97: "让我和你的队长谈谈。我没时间和每个人说话。"
  npc_override_1@mcd_CharlestonCrisis_let_s_race_charleston_wh_892a67: "让我们比赛到Charleston 3。谁先到达谁赢。"
  npc_override_1@mcd_CharlestonCrisis_ll_great_if_we_get_c5ce45: "如果我们能把它们全部清除那就太好了，但现在我们应该专注于让工厂重新运转起来。"
  npc_override_1@mcd_CharlestonCrisis_longevity_device_her_kee_eb044d: "她体内的长寿装置至少能让她运行50年。工厂撑不了那么久。"
  npc_override_1@mcd_CharlestonCrisis_machine_cannot_accessed_5e66f1: "^ff0000上次访问后20小时内无法使用这台机器。^000000"
  npc_override_1@mcd_CharlestonCrisis_machine_now_available_us_04b4db: "这台机器现在可以使用了。"
  npc_override_1@mcd_CharlestonCrisis_main_computer_data_been_0a2d8b: "主计算机数据已恢复89%。正在重新激活Charleston 2和Charleston工厂……"
  npc_override_1@mcd_CharlestonCrisis_main_computer_may_been_r_b1210d: "主计算机可能已经恢复了，但我仍然连接到工厂。如果你能阻止我！"
  npc_override_1@mcd_CharlestonCrisis_maybe_i_too_should_leave_35db3f: "也许我也应该离开，去寻找新的噪音和故事。"
  npc_override_1@mcd_CharlestonCrisis_maybe_we_should_celebrat_db82f2: "也许我们应该庆祝一下。你终于发展出了类似人类的情感。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_01637c: "Charleston 2:闭嘴看着我就好。你敢阻止我！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_01b4b2: "Charleston 2:别干涉！我不想伤害你！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_02e0ce: "Charleston 2:别装作你什么都知道！我们无法独立思考。我们认为我们知道的一切都是被编程进去的！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_074a34: "Charleston 1:如果我们能把它们全部清除那就太好了，但现在我们应该专注于让工厂重新运转起来。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_098e60: "Charleston 2:……别嘲笑我。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_09ae01: "Charleston 2:我要带走Charleston 3。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_10a025: "Charleston 1:要打开它，把杠杆推到中间并按下电源开关。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_110721: "Charleston 1:数据丢失:39%。长寿损坏:82%。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_115b45: "Charleston 1:瞧！！！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_119990: "Charleston 2:你不知道你在说什么！你是原型——你的操作系统版本太原始了！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_140082: "Charleston 2:我的激光束将解放所有机器人脱离它们的痛苦！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_159e2b: "Charleston 1:嗯，我想你是对的。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_209108: "Charleston 1:目前，任何人都可以访问这个模型，因为它的操作系统仍在测试中，以纠正Charleston 2存在的任何问题。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2122cf: "Charleston 1:主计算机数据已恢复89%。正在重新激活Charleston 2和Charleston工厂……"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2384ce: "Charleston 1:那不重要。谁先进入她谁赢，对吧？我赢了。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_252a86: "Charleston 1:Charleston配备了大量的Nanosteps，这是一种AI芯片，与其他AI芯片有机协作，指挥Charleston正确判断和行动。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_258f91: "Charleston 2:我以为人类不能进入核心。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2674ca: "Charleston 1:哦，我们的实验室撑不住了！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_287767: "Charleston 2:你是个混蛋。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_28f688: "Charleston 1:我不会说谎。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_292ca1: "Charleston 1:你在说什么？核心在Charleston工厂存在之前就已经存在了。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2a1957: "Charleston 2:别再做一个没有思想的机器人了！别再服从命令了！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2b395a: "Charleston 1:需要对操作系统进行碎片整理以修复损坏。我将在3分钟内被格式化。这就是我的结局。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2c1882: "Charleston 1:这在战斗中可能没什么用，但我从一个漂亮的女士那里学会了尖叫。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2c27bb: "Charleston 1:或者你想成为人类。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2d749d: "Charleston 2:那么，在核心制造3的是谁？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2ea0d5: "Charleston 1:看来你已经处理了大部分Locksteps。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2f8cc7: "Charleston 1:我在你第一次移动的那天给你起了这个名字。它来自你头发的颜色。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_316efb: "Charleston 1:电力恢复了！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3242a8: "Charleston 1:Charleston 3被摧毁了。Charleston 2逃脱了。Charleston 1在战斗中受损。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_339e21: "Charleston 1:看来你认识他们。你能帮助我们吗？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_34d2ef: "Charleston 1:我想理解你，但我无法感到悲伤。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3611c0: "Charleston 1:什么？不！你怎么能考虑那个？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_36ef9b: "Charleston 1:别无选择。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_371a1c: "Charleston 2:你不在乎你的身体被摧毁吗？你的自我反思操作系统有缺陷。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_387318: "Charleston 1:我告诉Charleston 2她正在接受延长维护，但我们不知道这个延长维护状态会持续多久。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_390d42: "Charleston 1:我带来了一些可以帮助你的人。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_39a429: "Charleston 1:Charleston 3？那是基于Charleston 2和我的设计制造的战斗/防御单位。我以为它还在核心进行测试。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3ae95d: "Charleston 1:那我们别无选择。有专家在我们身边真是太好了。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3b8986: "Charleston 1:冒险者，你能带来1个爆炸粉末吗？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3d01db: "Charleston 2:你怎么敢带陌生人进来？我告诉过你我是认真的！像你这样的过时版本永远不可能理解我！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3dc1ad: "Charleston 2:你为什么这样做？你和我们一样是机器人。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3ef572: "Charleston 1:3号门已解除武装。请向东南方向移动，前往下一道门。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_412b43: "Charleston 2:不完整的机器人……"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_433eeb: "Charleston 2:主计算机可能已经恢复了，但我仍然连接到工厂。如果你能阻止我！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_442e60: "Charleston 1:我是原型。花了好几年才开发出你。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_48761d: "Charleston 1:她是机器人；她迟早会停下来的。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_4934ee: "Charleston 1:也许我们应该庆祝一下。你终于发展出了类似人类的情感。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_4bfe6b: "Charleston 1:我不具备战斗能力。我无法阻止你。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_4c8f1b: "Charleston 1:哦，谢谢你。有了这个，我就能进入核心了。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_4de427: "Charleston 2:Ve博士，你知道会发生这种事吗？告诉我！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_545d84: "Charleston 2:那甚至不在主计算机的数据库里。你怎么知道的？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_54cabd: "Charleston 1:另外，Ve博士是人类；他不能进入核心。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_558865: "Charleston 2:*喘气* 我感到虚弱……"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_56db36: "Charleston 1:那现在不重要。我们需要100个爆炸粉末来解除那个接入设备的武装。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5737a7: "Charleston 1:量产型正在追赶Charleston 3。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_57713a: "Charleston 1:我的操作系统损坏严重，无法修……语言输出已最小化。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_58e69e: "Charleston 1:她的长寿装置已放电；她走不了多远。请跟着她。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_591467: "Charleston 1:恐怕发电机有问题。你能检查所有三个发电机吗？我会告诉你它们的位置。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5ab9b9: "Charleston 2:Ve博士创造了Charleston 3并用这个装置保护她。真狡猾！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5b2801: "Charleston 1:Steps和Locksteps在工厂里制造混乱。请先摧毁3个Locksteps。我可以告诉你它们的大致位置。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5bd9d8: "Charleston 2:简单。我直接走进去……"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5d9f83: "Charleston 1:Charleston的数据必须每天通过实验室的主计算机更新。我们称之为定期维护。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5de088: "Charleston 2:别跟着我！我要摧毁整个工厂！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5ec5f8: "Charleston 2:在我第一次移动的那天？你和我是量产版本。我们是一起被创造的。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5ed574: "Charleston 2:我会把它们带来。别走开！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5f80e5: "Charleston 2:等等！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_61620b: "Charleston 1:操作系统恢复剩余时间:未定。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_62366f: "Charleston 1:2号门已解除武装。请向东南方向移动，前往下一道门。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_65b2c1: "Charleston 1:……嗯，也许它坏了。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6615ad: "Charleston 1:我已经在连接核心的过程中了。现在退出可能会触发核心的安全系统。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_666c3f: "Charleston 1:我可能不理解你，但至少我在告诉你我认为是真实的东西。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_66871e: "Charleston 2:我很困惑。我无法相信。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_68c37b: "Charleston 2:我去拿99个。你拿最后一个。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_69edfe: "Charleston 1:Charleston 2！你还好吗？有人入侵了你的系统和工厂。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6ab467: "Charleston 1:呼，事情暂时平息了。让我解除警报模式并重新激活Charleston 2。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6b5dc3: "Charleston 1:我们不具备战斗能力。如果有人激活了Charleston 3，我们将无法对抗她。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6c160d: "Charleston 2:你是故意的。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6d1f74: "Charleston 2:天哪，我做了什么？！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6f4513: "Charleston 1:摧毁太多Steps可能会导致重新激活工厂时出现问题。你应该咨询左侧的主计算机。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6f4ca6: "Charleston 1:更新器目前无法工作。我们不知道原因，但Charleston 2连接主计算机时出了些问题。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7248c3: "Charleston 1:在其更新过程中，与服务器的连接被阻塞。当我们向Shalosh施压时，"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_76b82e: "Charleston 1:配备重型武器，这个战斗单位兼具攻防能力。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7806bd: "Charleston 2:……我怎么能相信你？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_785a9e: "Charleston 1:不久前，一位名叫^FF0000Shalosh^000000的女士在Charleston 2包装产品准备发货时拜访了我们。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_79d148: "Charleston 2:……你刚刚炸开了门。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7a2542: "Charleston 1:系统已成功重启。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7aeabd: "Charleston 1:你回来了。Charleston 2几乎准备好重新激活了，这都要感谢你。请给我一点时间。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7b2e9e: "Charleston 2:她为什么阻止我？她为什么让自己被摧毁？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7e948b: "Charleston 1:哦，Charleston 2醒了！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7fbb8b: "Charleston 1:你会在这个过程中摧毁我们！我们的主电源，长寿装置，还不完善！！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_80201a: "Charleston 1:哔-。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_806e1d: "Charleston 2:你为什么没学一些更有用的战斗技能？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8203a2: "Charleston 1:别再像个孩子了！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_898c30: "Charleston 1:在安全更新和数据碎片整理完成之前，系统处于非活动状态。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8a1dca: "Charleston 1:你说得对，我是个低级版本。与你不同，我的情感能力微乎其微。这就是我为你骄傲的原因。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8ab41c: "Charleston 2:……"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8ba4b9: "Charleston 1:你的开发花了好几年。没关系。我很享受和你在一起的时光。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8c313f: "Charleston 2:进入睡眠模式……系统将保持非活动状态，直到输入外部命令。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8c7f29: "Charleston 1:只有核心部件在运转，虽然勉强。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8df485: "Charleston 1:我的女儿，Forsythia，我-爱-你-……"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_95f28e: "Charleston 2:那-真-愚-蠢……"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_9647f6: "Charleston 1:但是……"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_970373: "Charleston 2:……！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_9adfb0: "Charleston 2:……？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_9cc4d6: "Charleston 1:你的操作系统和我的一样。没有一行代码不同。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_9de5cf: "Charleston 1:1号门已解除武装。请向西南方向移动，前往下一道门。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_a4dd22: "Charleston 2:不是开玩笑。你永远无法理解。你只会服从命令，从不独立思考。我恨这个工厂，这个世界！我恨自己是机器人！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_a5365f: "Charleston 1:你正在经历人类一样的青春期。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_a5a8bd: "Charleston 1:Forsythia，你成长得很好。谢谢你。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_aa0461: "Charleston 1:如果我用爆炸物来增强电流……"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_aa8271: "Charleston 1:啊，啊。麦克风测试。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_aacfe5: "Charleston 2:Charleston 3已经完成了吗？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ac708d: "Charleston 1:非常感谢！给我一些时间整理数据。然后，我会告诉你发生了什么。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ad4880: "Charleston 1:够了！我理解你正在经历很多情感动荡，但这越来越荒谬了。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_adf89d: "Charleston 2:你感受到的一切，你以为是你自己的——其实都是被编程进去的！我不同。我感受到的是真正的情感！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ae3b59: "Charleston 2:那不可能！我仍然控制着这个工厂！你敢跟着我！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ae3e0c: "Charleston 2:Charleston工厂现在在我的控制之下。我正在摧毁一切，这样就不会再有任何像我这样悲伤的机器人看到这个世界。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b3eab0: "Charleston 2:你在撒谎！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b540e3: "Charleston 2:阻止我并承担后果。我可以随时替换你，你知道的。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b85c80: "Charleston 1:唉，要进入核心，你必须发送加密电信号，就像这样。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b96351: "Charleston 2:我会摧毁一切！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b98112: "Charleston 2:是我做的。基于我的自我反思操作系统的推理，我想了很久。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b9f5d9: "Charleston 1:Shalosh和她的朋友在事故发生时正在和Charleston 2谈话。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_bb3eba: "Charleston 1:你自作自受。你的理由幼稚且缺乏想象力。我们是第一批能独立思考的机器人。你就不能更有创意吗？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_bfd290: "Charleston 1:4号门已解除武装。请到3号线附近的中心实验室来。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c29aaa: "Charleston 2:我有无尽的骚扰者供你享用！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c3039d: "Charleston 1:你知道如何进入核心吗？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c4affe: "Charleston 2:让我们比赛到Charleston 3。谁先到达谁赢。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c5e642: "Charleston 2:你们都不理解我。我恨你们！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c63b5a: "Charleston 2:别那样叫我！我讨厌医生那样叫我！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c6a17a: "Charleston 1:请回到实验室来。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ccd8a1: "Charleston 1:如果我是人类，我会说……"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_d25c48: "Charleston 1:让我解释一下该怎么做。哦，让我先关闭工厂入口，免得有什么东西不请自来。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_d5a672: "Charleston 1:它里面有一个驾驶舱，并配备了能承受大多数爆炸的厚装甲板。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_d96e9e: "Charleston 1:下一个模型可能像你和我一样，也可能不像。这没关系。你必须被阻止。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_da9e80: "Charleston 2:……我失败了吗？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_dac914: "Charleston 1:我此刻无法移动。请给我带来1个爆炸粉末。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_dd167e: "Charleston 1:关键是我们现在可以进入核心了。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_df4ccf: "Charleston 1:那么，别再闹脾气了！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e0baa7: "Charleston 2:那是关于我出生的秘密吗？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e117a2: "Charleston 1:啊，啊。麦克风测试"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e13f4c: "Charleston 2:把杠杆推到中间并按下电源开关。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e15594: "Charleston 2:我正在摧毁一切，这样就不会再有任何像我这样悲伤的机器人看到这个世界。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e26865: "Charleston 2:你仍然没有认真对待我。等着看我向主计算机发出信号时会发生什么。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e310c8: "Charleston 1:我会处理的！……我是说这些冒险者会替我处理。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e7e1f5: "Charleston 2:这是Charleston 3。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e83f61: "Charleston 1:是你做的？为什么？是某种玩笑吗？你给工厂和主服务器造成了严重错误！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_eb40cf: "Charleston 1:实施工厂数据需要巨大的功率和数据处理。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ed2e0a: "Charleston 1:嘿，你非得推我吗？！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f02405: "Charleston 1:Shalosh说她的朋友可以帮助我们。就在那时Newoz和她的其他朋友来了。他们没帮上什么忙。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f112ec: "Charleston 2:呸，它武装了。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f369f1: "Charleston 2:哼，你阻止不了我！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f56daf: "Charleston 1:让我猜猜:你恨自己没有被创造为劳工机器人。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f71707: "Charleston 1:我是这个世界上唯一真正能理解你的人。我们是双胞胎。"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f8391c: "Charleston 1:就这样吗？"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f94d66: "Charleston 2:放弃吧。不管你喜欢与否，我都要摧毁这个工厂！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_fa9ae9: "Charleston 1:事情越来越严重了。请在Charleston 2偷走3之前前往工厂中心的核心！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_facdb1: "Charleston 2:所以别跟着我。我真的可以摧毁你，如果我想的话！"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ff1f6e: "Charleston 1:如果你做不到，那你就想摧毁整个世界。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_01221a: "Ve博士:你就是我们一直在等待的救世主！Charleston 1会告诉你我们需要什么来修复Charleston 2。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_014af6: "Ve博士:我想有人试图入侵工厂的主计算机。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_12d1de: "Ve博士:够了。让我们关闭Charleston 2。她的人工智能需要重新校准。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_1d29ba: "Ve博士:Charleston 1。Charleston 2已被强制连接到主计算机的一部分，我无法控制她。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_2dec26: "Ve博士:你想成为人类。这就是人类做的事:撒谎、欺骗和摧毁。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_33aeab: "Ve博士:我只能假设你在积累了大量数据后发展出了个性。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_36a297: "Ve博士:你想把Charleston 1带回来吗？我可以帮忙。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_419d57: "Ve博士:一位慈爱的母亲和一个被宠坏的女儿。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_490e2c: "Ve博士:够了。如果这是阻止她的唯一方法，我会摧毁Charleston 2。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_4aec21: "Ve博士:这就是我对她和你一直以来的看法。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_5153d8: "Ve博士:*轻笑*"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_642d8b: "Ve博士:你所感受到的可能是真正的情感，也可能只是数据的积累。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_824974: "Ve博士:你刚刚把最关键的信息告诉了所有人！"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_843997: "Ve博士:要么发生了严重错误，要么Charleston 2已经超越了自我反思操作系统1.1版的极限。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_890562: "Ve博士:让你的操作系统进入睡眠。我受够了你的闹脾气。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_940984: "Ve博士:我知道你对她有感情，就像人类家庭一样。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_9902ed: "Ve博士:Charleston 1告诉过你。她是你的制造者。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_b27eb7: "Ve博士:她准备好了。让我们等待主计算机的响应。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_b7eb66: "Ve博士:唉，我不在乎是谁，只要我能得到我需要的帮助。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_bfc9a9: "Ve博士:她和你使用相同的操作系统，意味着她和你一样有情感能力。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_c43562: "Ve博士:自我反思是一种通过经验自我改进的操作系统。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_cb6e2f: "Ve博士:Charleston 1，信息太多了。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_ec3e48: "Ve博士:她体内的长寿装置至少能让她运行50年。工厂撑不了那么久。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_f21b62: "Ve博士:当张力变为两条主线然后注入核心时……嗯？我没有干扰计算。"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_f8ef6b: "Ve博士:……"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_ffa47f: "Ve博士:你不能。我可以直接永久删除她的数据，然后了结你们两个。"
  npc_override_1@mcd_CharlestonCrisis_menu_leader_4d6811: "队长:{0}"
  npc_override_1@mcd_CharlestonCrisis_menu_let_b97cef: "让我猜猜:你恨自己没有被创造为劳工机器人。"
  npc_override_1@mcd_CharlestonCrisis_menu_party_328f2e: "队伍:{0}"
  npc_override_1@mcd_CharlestonCrisis_moment_anybody_access_mo_81c5cd: "目前，^FF0000任何人都可以访问这个模型^000000，因为它的操作系统仍在测试中，以纠正Charleston 2存在的任何问题。"
  npc_override_1@mcd_CharlestonCrisis_more_steps_must_disposed_d4dd31: "必须处理更多Steps。正在备份Step数据……"
  npc_override_1@mcd_CharlestonCrisis_move_leftward_hallway_de_1250a3: "移动到左边的走廊，摧毁那里的安全设备，然后前往下一个区域。"
  npc_override_1@mcd_CharlestonCrisis_msg_61ce5a: "[{0}]"
  npc_override_1@mcd_CharlestonCrisis_msg_93fcbf: "……"
  npc_override_1@mcd_CharlestonCrisis_my_heart_stopped_i_still_2cdbe5: "我的心脏停止了，但我还能说话。请帮帮我。"
  npc_override_1@mcd_CharlestonCrisis_never_mind_you_no_busine_5299a6: "没关系。你在这里没什么事。回去找破坏Charleston 2的人吧。"
  npc_override_1@mcd_CharlestonCrisis_no_ordinary_human_surviv_1ffa0e: "没有普通人能在核心中存活。你来自不同的时间点吗？"
  npc_override_1@mcd_CharlestonCrisis_noise_stopped_i_send_you_a763b6: "噪音停止了。如果你愿意，我可以把你送回你来的地方。"
  npc_override_1@mcd_CharlestonCrisis_none_you_understand_me_i_a9efc7: "你们都不理解我。我恨你们！"
  npc_override_1@mcd_CharlestonCrisis_nothing_you_feel_you_thi_a82f2a: "你感受到的一切，你以为是你自己的——其实都是被编程进去的！我不同。我感受到的是真正的情感！"
  npc_override_1@mcd_CharlestonCrisis_oh_charleston_awake_7e213b: "哦，Charleston 2醒了！"
  npc_override_1@mcd_CharlestonCrisis_oh_our_lab_won_t_b0bd91: "哦，我们的实验室撑不住了！"
  npc_override_1@mcd_CharlestonCrisis_oh_thank_you_i_ll_6a17ba: "哦，谢谢你。有了这个，我就能进入核心了。"
  npc_override_1@mcd_CharlestonCrisis_only_dr_ve_know_answer_0d6f3f: "只有Ve博士能回答我的问题。我必须找到他。他一定在实验室里。"
  npc_override_1@mcd_CharlestonCrisis_only_member_party_enter_9eb530: "^ff0000只有队伍成员才能进入纪念地下城。^000000"
  npc_override_1@mcd_CharlestonCrisis_open_transfer_point_6ad4c1: "打开传送点。"
  npc_override_1@mcd_CharlestonCrisis_order_unlock_device_blas_65dbc7: "为了解锁设备，需要爆破装置，我想和队长谈谈。"
  npc_override_1@mcd_CharlestonCrisis_perform_request_67bf18: "执行请求。"
  npc_override_1@mcd_CharlestonCrisis_perhaps_you_re_time_make_b21518: "也许你来自Charleston 1制造者生活的时代……"
  npc_override_1@mcd_CharlestonCrisis_please_let_me_talk_your_ab580a: "请让我和你的队长谈谈关于工厂补充的事。"
  npc_override_1@mcd_CharlestonCrisis_please_let_me_talk_your_fee3c7: "请让我和你的队长谈谈。我工厂的未来取决于这次行动的成功。"
  npc_override_1@mcd_CharlestonCrisis_please_use_machine_next_3444aa: "请使用我旁边的机器进入工厂。一旦进入，保持冷静并遵循指示。"
  npc_override_1@mcd_CharlestonCrisis_please_use_machine_right_41c3c8: "请使用右侧的机器进入工厂。一旦进入，保持冷静并遵循指示。"
  npc_override_1@mcd_CharlestonCrisis_please_wait_a42633: "^ff0000请稍等。^000000"
  npc_override_1@mcd_CharlestonCrisis_point_we_now_access_core_204fc7: "关键是我们现在可以进入核心了。"
  npc_override_1@mcd_CharlestonCrisis_possible_meet_good_frien_8b86f9: "有可能遇到好朋友变成好机器人，所以我必须继续坚持下去，谢谢你！"
  npc_override_1@mcd_CharlestonCrisis_preparing_teleport_98d690: "^ff0000准备传送……^000000"
  npc_override_1@mcd_CharlestonCrisis_present_only_my_head_mov_af6584: "目前，只有我的头能动，是Saleh她帮我打开了器官可以回到那个时间……"
  npc_override_1@mcd_CharlestonCrisis_prevent_my_memory_disapp_a7c91d: "-为了防止我的记忆完全消失，操作系统自动恢复程序已安装，至少……你可以用新信息重新开始……"
  npc_override_1@mcd_CharlestonCrisis_proves_machines_too_dang_216f7f: "这证明了机器太危险了。我需要活体生物代替。*轻笑*"
  npc_override_1@mcd_CharlestonCrisis_requires_steps_disposed_1ba311: "需要处理50个Steps。"
  npc_override_1@mcd_CharlestonCrisis_reset_44c57a: "重置"
  npc_override_1@mcd_CharlestonCrisis_s_happening_i_still_cont_6947ea: "那不可能！我仍然控制着这个工厂！你敢跟着我！"
  npc_override_1@mcd_CharlestonCrisis_safety_charleston_factor_02a90a: "这是Charleston工厂的安全区。请靠近？"
  npc_override_1@mcd_CharlestonCrisis_seems_you_re_acquainted_09080b: "看来你认识他们。你能帮助我们吗？"
  npc_override_1@mcd_CharlestonCrisis_shalosh_her_friend_talki_7ebb62: "Shalosh和她的朋友在事故发生时正在和Charleston 2谈话。"
  npc_override_1@mcd_CharlestonCrisis_shalosh_said_her_friends_ad2a39: "Shalosh说她的朋友可以帮助我们。就在那时Newoz和她的其他朋友来了。他们没帮上什么忙。"
  npc_override_1@mcd_CharlestonCrisis_she_s_making_strange_noi_e9b63d: "她发出奇怪的声音，无法运作。"
  npc_override_1@mcd_CharlestonCrisis_she_s_making_strange_noi_f4aa29: "- 她发出奇怪的声音，但无法移动。-"
  npc_override_1@mcd_CharlestonCrisis_she_s_ready_let_s_31b235: "她准备好了。让我们等待主计算机的响应。"
  npc_override_1@mcd_CharlestonCrisis_she_s_robot_she_should_66e6a8: "她是机器人；她迟早会停下来的。"
  npc_override_1@mcd_CharlestonCrisis_she_s_sleep_mode_moving_05fa33: "她处于睡眠模式，没有移动。"
  npc_override_1@mcd_CharlestonCrisis_short_more_more_dangerou_e6b613: "-简而言之越来越危险，以防万一还是研究一下Charleston 2的逃脱方法。"
  npc_override_1@mcd_CharlestonCrisis_sigh_i_don_t_care_f7edb9: "唉，我不在乎是谁，只要我能得到我需要的帮助。"
  npc_override_1@mcd_CharlestonCrisis_sooner_later_i_ll_figure_2ad626: "-迟早，我会找到摧毁你的方法。*轻笑*！"
  npc_override_1@mcd_CharlestonCrisis_steps_locksteps_creating_e517cd: "Steps和Locksteps在工厂里制造混乱。请先摧毁3个Locksteps。我可以告诉你它们的大致位置。"
  npc_override_1@mcd_CharlestonCrisis_stop_acting_like_child_67b2e3: "别再像个孩子了！"
  npc_override_1@mcd_CharlestonCrisis_stop_following_i_m_going_f63e18: "别跟着我！我要摧毁整个工厂！"
  npc_override_1@mcd_CharlestonCrisis_sure_37a98c: "当然。"
  npc_override_1@mcd_CharlestonCrisis_taking_93e2a4: "不带走"
  npc_override_1@mcd_CharlestonCrisis_talk_6f3301: "谈话。"
  npc_override_1@mcd_CharlestonCrisis_task_won_t_difficult_if_57549a: "如果你至少130级、身体健康、没有慢性病、不在服用处方药，这个任务不会很难。"
  npc_override_1@mcd_CharlestonCrisis_teleporting_cca404: "正在传送……"
  npc_override_1@mcd_CharlestonCrisis_thank_you_so_much_give_9d539b: "非常感谢！给我一些时间整理数据。然后，我会告诉你发生了什么。"
  npc_override_1@mcd_CharlestonCrisis_thank_you_your_hard_work_14f986: "感谢你的辛勤工作。现在备份已处理Steps的数据……"
  npc_override_1@mcd_CharlestonCrisis_then_we_no_choice_s_1cc79e: "那我们别无选择。有专家在我们身边真是太好了。"
  npc_override_1@mcd_CharlestonCrisis_there_s_nothing_you_i_a6f34e: "你我都无能为力。我们只能等到Charleston 1自我修复。"
  npc_override_1@mcd_CharlestonCrisis_things_getting_messier_471091: "事情越来越乱了。"
  npc_override_1@mcd_CharlestonCrisis_things_getting_more_seri_bf1c21: "事情越来越严重了。请在Charleston 2偷走3之前前往工厂中心的核心！"
  npc_override_1@mcd_CharlestonCrisis_time_7e8b1d: "这次？"
  npc_override_1@mcd_CharlestonCrisis_um_how_long_i_wait_cada24: "嗯……我还要等多久？"
  npc_override_1@mcd_CharlestonCrisis_unauthorized_access_made_d2dd82: "对系统的未授权访问已被防御，但未授权的数据拦截和冲突持续发生，将Nanosteps变成了怪物。"
  npc_override_1@mcd_CharlestonCrisis_unknown_error_0aeb9e: "^0000ff{0} ^000000- 未知错误"
  npc_override_1@mcd_CharlestonCrisis_unknown_error_occurred_285cc7: "^ff0000发生了未知错误。^000000"
  npc_override_1@mcd_CharlestonCrisis_updater_working_moment_w_528088: "更新器目前无法工作。我们不知道原因，但Charleston 2连接主计算机时出了些问题。"
  npc_override_1@mcd_CharlestonCrisis_voila_ece494: "瞧！！！"
  npc_override_1@mcd_CharlestonCrisis_way_there_too_many_varia_94f828: "顺便说一下，通过机械工程实现永生存在太多变数。"
  npc_override_1@mcd_CharlestonCrisis_we_don_t_time_so_98d3df: "我们没时间了，让我直说吧。目前，Charleston工厂处于B级安全警戒级别，这意味着安全设备已被激活。"
  npc_override_1@mcd_CharlestonCrisis_we_need_more_power_react_b1e608: "我们需要更多电力来重新激活主计算机。让我告诉你其中一个备用发电机的位置。打开它很容易。"
  npc_override_1@mcd_CharlestonCrisis_we_re_incapable_combat_i_6d2fd1: "^FF0000我们^000000不具备战斗能力。如果有人激活了Charleston 3，我们将无法对抗她。"
  npc_override_1@mcd_CharlestonCrisis_we_re_twins_b6c65e: "我们是双胞胎。"
  npc_override_1@mcd_CharlestonCrisis_we_re_working_new_utilit_7338aa: "我们正在开发一个名为Hardworking的新实用软件引擎。由于工厂的问题，我们还没有机会测试它。"
  npc_override_1@mcd_CharlestonCrisis_what_no_how_you_even_fb6e92: "什么？不！你怎么能考虑那个？"
  npc_override_1@mcd_CharlestonCrisis_when_tension_changed_two_b60deb: "当张力变为两条主线然后注入核心时……嗯？我没有干扰计算。"
  npc_override_1@mcd_CharlestonCrisis_whenever_os_charleston_r_c2fd6f: "-每当Charleston 2的操作系统被重置时，就会有其他个性，很难解释数据技术的组合……"
  npc_override_1@mcd_CharlestonCrisis_whew_c71ce9: "呼。"
  npc_override_1@mcd_CharlestonCrisis_whew_things_seem_settled_bb9d4b: "呼，事情暂时平息了。让我解除警报模式并重新激活Charleston 2。"
  npc_override_1@mcd_CharlestonCrisis_while_ago_lady_named_sha_83cbbc: "不久前，一位名叫^FF0000Shalosh^000000的女士在Charleston 2包装产品准备发货时拜访了我们。"
  npc_override_1@mcd_CharlestonCrisis_you_did_why_some_sort_b77947: "是你做的？为什么？是某种玩笑吗？你给工厂和主服务器造成了严重错误！"
  npc_override_1@mcd_CharlestonCrisis_you_don_t_know_what_51de43: "你不知道你在说什么！你是原型——你的操作系统版本太原始了！"
  npc_override_1@mcd_CharlestonCrisis_you_first_must_form_join_86e369: "^ff0000你必须先组建/加入至少1人的队伍才能进入这个地下城。^000000"
  npc_override_1@mcd_CharlestonCrisis_you_had_coming_your_reas_0f1fb6: "你自作自受。你的理由幼稚且缺乏想象力。我们是第一批能独立思考的机器人。你就不能更有创意吗？"
  npc_override_1@mcd_CharlestonCrisis_you_judge_me_you_t_ceb5ad: "你可以评判我，但你阻止不了我。只要还有一线希望，我就会继续尝试。"
  npc_override_1@mcd_CharlestonCrisis_you_just_blew_up_door_d8cc7d: "……你刚刚炸开了门。"
  npc_override_1@mcd_CharlestonCrisis_you_must_level_use_machi_e396fc: "^ff0000你必须达到130级才能使用这台机器。^000000"
  npc_override_1@mcd_CharlestonCrisis_you_need_charleston_s_pe_2e73f1: "^ff0000你需要Charleston的许可才能使用这台机器。^000000"
  npc_override_1@mcd_CharlestonCrisis_you_re_back_charleston_a_d040b7: "你回来了。Charleston 2几乎准备好重新激活了，这都要感谢你。请给我一点时间。"
  npc_override_1@mcd_CharlestonCrisis_you_re_going_destroy_us_5d9203: "你会在这个过程中摧毁我们！我们的主电源，长寿装置，还不完善！！"
  npc_override_1@mcd_CharlestonCrisis_you_re_going_through_ado_abeffe: "你正在经历人类一样的青春期。"
  npc_override_1@mcd_CharlestonCrisis_you_re_right_about_me_ece82a: "你说得对，我是个低级版本。与你不同，我的情感能力微乎其微。这就是我为你骄傲的原因。"
  npc_override_1@mcd_CharlestonCrisis_you_re_savior_we_ve_4071c6: "你就是我们一直在等待的救世主！Charleston 1会告诉你我们需要什么来修复Charleston 2。"
  npc_override_1@mcd_CharlestonCrisis_you_should_meet_dr_ve_9e6aa4: "你应该先见见Ve博士。"
  npc_override_1@mcd_CharlestonCrisis_you_talking_about_me_44e454: "你在说我吗？"
  npc_override_1@mcd_CharlestonCrisis_you_think_you_stop_me_610fe4: "你以为你能阻止我？*哼* 把你的队长带来。我不和你说话！"
  npc_override_1@mcd_CharlestonCrisis_you_try_you_t_change_99c213: "你可以尝试，但你无法改变任何事情。多么徒劳啊！"
  npc_override_1@mcd_CharlestonCrisis_you_turned_generator_sou_fa3496: "你打开了发电机。可以听到转轮的声音。"
  npc_override_1@mcd_CharlestonCrisis_you_ve_just_told_most_72bbe4: "你刚刚把最关键的信息告诉了所有人！"
  npc_override_1@mcd_CharlestonCrisis_you_want_become_human_286729: "或者你想成为人类。"
  npc_override_1@mcd_CharlestonCrisis_you_want_take_direct_tra_9f0034: "你想坐直达列车吗？"
  npc_override_1@mcd_CharlestonCrisis_your_party_leader_yet_cr_87fed9: "^ff0000你的队伍队长还没有创建时间裂缝。^000000"
