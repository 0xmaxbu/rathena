Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_hd_refiner_hd_refiner_aaaaaaaaaaak_123235: "啊啊啊啊啊啊啊！！！"
  npc_override_hd_refiner_hd_refiner_ah_blacksmith_blessing_1a59bd: "啊！是^0000ff铁匠的祝福^000000吗？"
  npc_override_hd_refiner_hd_refiner_aiya_i_am_faceless_now_44476d: "哎呀！我现在没脸见人了。嗯嗯。"
  npc_override_hd_refiner_hd_refiner_already_been_refined_pre_526beb: "这件{0}已经精炼到相当高的等级了。"
  npc_override_hd_refiner_hd_refiner_best_blacksmith_world_li_f0c776: "像我这样世界上最好的铁匠……"
  npc_override_hd_refiner_hd_refiner_blacksmith_blessing_equi_40d896: "有了铁匠的祝福，精炼失败时装备不会消失！"
  npc_override_hd_refiner_hd_refiner_bring_out_item_so_i_b9e2f6: "把装备拿出来，让我来精炼！"
  npc_override_hd_refiner_hd_refiner_challenging_all_could_al_3f7644: "完全不挑战也可能是人生的一种智慧。"
  npc_override_hd_refiner_hd_refiner_come_back_when_you_them_ae467c: "等你全部准备好了再来找我。"
  npc_override_hd_refiner_hd_refiner_compared_other_blacksmit_8e8920: "和其他铁匠相比，风险更小。"
  npc_override_hd_refiner_hd_refiner_damn_b27375: "该死！"
  npc_override_hd_refiner_hd_refiner_didn_t_you_just_say_7e4fba: "你刚才不是说你都准备好了吗？"
  npc_override_hd_refiner_hd_refiner_doesn_t_guarantee_succes_bb0416: "不能保证100%成功~"
  npc_override_hd_refiner_hd_refiner_equipment_refine_unit_s_baade2: "对于+{0}的装备，使用^316AC5 {1}个铁匠的祝福^000000可以防止装备消失。你想用它来精炼吗？"
  npc_override_hd_refiner_hd_refiner_even_best_blacksmith_wor_93e33c: "即使是世界上最好的铁匠也不能保证100%成功！"
  npc_override_hd_refiner_hd_refiner_even_i_cannot_refine_ite_4c6b80: "连我都无法精炼这件物品。没办法。"
  npc_override_hd_refiner_hd_refiner_great_nicely_done_183cb8: "太棒了！干得漂亮！！"
  npc_override_hd_refiner_hd_refiner_haven_t_i_told_you_24589c: "我没告诉过你吗？我只精炼+10以上的装备。"
  npc_override_hd_refiner_hd_refiner_here_only_decrease_level_695e8c: "在这里精炼失败只会降低1级。"
  npc_override_hd_refiner_hd_refiner_here_refine_succeeded_fl_91855d: "来，拿着。精炼完美成功！"
  npc_override_hd_refiner_hd_refiner_hmm_one_you_want_refine_954a06: "嗯……这就是你想精炼的那件吗？"
  npc_override_hd_refiner_hd_refiner_hmm_you_didn_t_bring_7378f2: "嗯……你没有带齐所需的材料。"
  npc_override_hd_refiner_hd_refiner_huh_what_you_want_me_9e1a9a: "嗯？你想让我做什么？"
  npc_override_hd_refiner_hd_refiner_i_am_different_blacksmit_7e2a54: "我和其他地方的铁匠不一样。"
  npc_override_hd_refiner_hd_refiner_i_am_sure_person_like_38b80c: "我相信像你这样的人绝不会因为精炼等级降低1级而责怪我。嗯。"
  npc_override_hd_refiner_hd_refiner_i_don_t_provide_normal_ab2cca: "但我不提供普通精炼服务。"
  npc_override_hd_refiner_hd_refiner_i_ll_better_next_time_3fe5cf: "下次我会做得更好！别担心！"
  npc_override_hd_refiner_hd_refiner_i_m_best_blacksmith_whol_d26081: "我是全世界最好的铁匠，巴斯塔。"
  npc_override_hd_refiner_hd_refiner_i_m_blacksmith_hairstyli_b3dc2a: "我是铁匠，不是发型师。"
  npc_override_hd_refiner_hd_refiner_i_only_handle_items_refi_395de8: "我只处理精炼等级+7到+9的物品。"
  npc_override_hd_refiner_hd_refiner_i_only_refine_equipment_1f60d6: "我只精炼^CC0000+10以上^000000的装备。"
  npc_override_hd_refiner_hd_refiner_i_really_am_best_blacksm_21f883: "我真的是全世界最好的铁匠！"
  npc_override_hd_refiner_hd_refiner_i_refine_only_items_0556e8: "我只精炼^CC0000+7到+9^000000的物品。"
  npc_override_hd_refiner_hd_refiner_i_t_make_you_smart_235ef6: "我没法让你变聪明。去找学校老师吧。"
  npc_override_hd_refiner_hd_refiner_i_ve_given_all_precautio_2df75a: "我已经给了所有警告。你想试试吗？"
  npc_override_hd_refiner_hd_refiner_i_wait_until_you_ready_a662be: "我会等到你准备好。"
  npc_override_hd_refiner_hd_refiner_if_you_try_refine_more_b6f26f: "如果你继续精炼，精炼等级可能会下降。"
  npc_override_hd_refiner_hd_refiner_if_you_want_refine_your_293cdd: "如果你想精炼你的脚，别来找我，去跑马拉松吧。"
  npc_override_hd_refiner_hd_refiner_impossible_refine_level_8de291: "精炼等级不可能一下子掉3或4级……听起来很可怕。"
  npc_override_hd_refiner_hd_refiner_item_t_refined_e2b347: "这件物品无法精炼。"
  npc_override_hd_refiner_hd_refiner_looks_like_item_likely_f_aa4188: "看起来这件物品很可能会精炼失败。"
  npc_override_hd_refiner_hd_refiner_making_artificial_hands_31cae5: "制作假肢不是我的专长。"
  npc_override_hd_refiner_hd_refiner_menu_yes_141459: "是:否"
  npc_override_hd_refiner_hd_refiner_my_hammer_i_make_you_8efa3d: "用我的锤子，我会让你成为天空中的明星。"
  npc_override_hd_refiner_hd_refiner_my_specialty_even_if_my_4947b9: "我的专长是即使精炼失败，精炼等级也只会降低1级而不会丢失装备。是不是很棒？"
  npc_override_hd_refiner_hd_refiner_need_unit_s_blacksmith_b_892756: "对于+{0}的{1}，需要^316AC5{2}个铁匠的祝福^000000可以防止装备消失。你想用铁匠的祝福来精炼吗？"
  npc_override_hd_refiner_hd_refiner_okay_if_s_what_you_81d42c: "好吧。既然你坚持……"
  npc_override_hd_refiner_hd_refiner_only_those_who_overcome_2fefc8: "只有克服失败恐惧的人才能获得杰作。"
  npc_override_hd_refiner_hd_refiner_oops_8bf1f6: "哎呀！！"
  npc_override_hd_refiner_hd_refiner_order_refine_gear_you_se_b80b0a: "为了精炼你选择的装备，你需要^ff9999{0}^000000和20,000 Zeny作为费用。"
  npc_override_hd_refiner_hd_refiner_pow_pow_pow_pow_f40f82: "砰！砰！砰！砰！"
  npc_override_hd_refiner_hd_refiner_refine_equipment_i_need_beb65b: "要精炼这件装备，我需要1个^ff9999{0}^000000和{1} Zeny作为费用。"
  npc_override_hd_refiner_hd_refiner_refining_failed_e8bb24: "精炼失败了！"
  npc_override_hd_refiner_hd_refiner_refining_failed_refine_l_4b85b6: "精炼失败，精炼等级下降了！"
  npc_override_hd_refiner_hd_refiner_so_lets_kick_into_overdr_ddbf50: "那让我们加把劲，你说呢？你想精炼什么物品？"
  npc_override_hd_refiner_hd_refiner_sound_refreshes_my_mind_9251fc: "每次听到这声音都让我精神一振。"
  npc_override_hd_refiner_hd_refiner_tac_tac_tac_7d9030: "嗒！嗒！嗒！"
  npc_override_hd_refiner_hd_refiner_too_bad_503d43: "太糟糕了。"
  npc_override_hd_refiner_hd_refiner_unlike_others_i_am_black_5b4c20: "和其他人不同，我是一个只精炼极少数物品的铁匠。"
  npc_override_hd_refiner_hd_refiner_wait_second_2c0252: "等一下……"
  npc_override_hd_refiner_hd_refiner_weapon_perfect_no_need_r_9ccb0d: "这件武器已经完美了，不需要再精炼了~"
  npc_override_hd_refiner_hd_refiner_weapon_refine_unit_s_bla_f245a5: "对于+{0}的武器，使用^316AC5 {1}个铁匠的祝福^000000可以防止装备消失。你想用它来精炼吗？"
  npc_override_hd_refiner_hd_refiner_well_cef2f0: "嗯~"
  npc_override_hd_refiner_hd_refiner_well_even_if_fails_only_779849: "嗯，即使失败了，也只会降低1级精炼等级。"
  npc_override_hd_refiner_hd_refiner_well_i_don_t_see_21a0f9: "嗯……我没看到什么值得精炼的装备。"
  npc_override_hd_refiner_hd_refiner_what_321343: "什么？！！"
  npc_override_hd_refiner_hd_refiner_what_you_want_me_b08d7a: "你想让我做什么？"
  npc_override_hd_refiner_hd_refiner_what_you_want_me_refine_280df6: "你想让我精炼什么？"
  npc_override_hd_refiner_hd_refiner_where_accessory_a72c54: "饰品在哪里？"
  npc_override_hd_refiner_hd_refiner_where_foot_odor_coming_4086a6: "这脚臭味是从哪里传来的？"
  npc_override_hd_refiner_hd_refiner_which_equipment_you_want_3eda9d: "你想精炼哪件装备？"
  npc_override_hd_refiner_hd_refiner_woah_blacksmith_blessing_d20ed2: "哇~ 是^316AC5铁匠的祝福^000000吗？这东西很难弄到~ 但你居然有！"
  npc_override_hd_refiner_hd_refiner_you_even_know_what_robe_e22f9d: "你知道长袍是什么吗？"
  npc_override_hd_refiner_hd_refiner_you_like_continue_refini_15de69: "你想继续精炼吗？"
  npc_override_hd_refiner_hd_refiner_you_really_want_refine_fb852d: "你真的想精炼这个吗？"
  npc_override_hd_refiner_hd_refiner_you_switched_item_while_1c504a: "你趁我不注意换了物品！滚出去！"
  npc_override_hd_refiner_hd_refiner_you_them_ready_dc4fb3: "你都准备好了吗？"
  npc_override_hd_refiner_hd_refiner_you_think_i_m_stupid_9a90ed: "你当我是傻子吗？！"
  npc_override_hd_refiner_hd_refiner_your_head_equipment_3edd8d: "你的头是装备吗？"