Body:
  npc_override_yuno_guides_juno_city_juno_cf36f3: "^8B4513朱诺^000000之城！"
  npc_override_yuno_guides_juno_fun_your_adventures_b5a0b2: "祝你冒险愉快！"
  npc_override_yuno_guides_juno_i_mark_location_4d06b8: "我会标记"
  npc_override_yuno_guides_juno_i_mark_location_ef3128: "我会标记位置"
  npc_override_yuno_guides_juno_menu_kafra_9f70c6: "[ 卡普拉服务人员 ]:[ 伊甸园传送官 ]:上一页菜单"
  npc_override_yuno_guides_juno_menu_main_f0339a: "[ 主要设施 ]:[ 商人&助手 ]:移除小地图标记:取消"
  npc_override_yuno_guides_juno_menu_tool_0928a8: "[ 道具店 ]:[ 锻造所 ]:[ 机场 ]:[ 政府大楼 ]:[ 书店街 ]:[ 旅馆&酒馆 ]:[ 贤者城堡 ]:[ 魔物学院 ]:[ 共和国图书馆 ]:[ 武器&防具店 ]:[ 朱佩罗广场 ]:[ 魔物博物馆 ]:[ 施魏希尔比尔魔法学院 ]:上一页菜单"
  npc_override_yuno_guides_juno_of_the_4c4b9f: "{0}的"
  npc_override_yuno_guides_juno_place_takes_vision_futur_cdc39c: "一个将未来愿景赋予当下形态的地方。欢迎来到"
  npc_override_yuno_guides_juno_sure_i_ll_remove_all_b37a09: "好的，我会移除你小地图上的所有标记。"
  npc_override_yuno_guides_juno_there_anything_else_i_yo_8fdf01: "还有什么我可以帮你的吗？"
  npc_override_yuno_guides_juno_you_like_check_any_other_342821: "你想查看其他地点吗？"
  npc_override_yuno_guides_juno_your_mini_map_c80911: "在你的小地图上。"
  npc_override_yuno_pile_bunker_about_then_ce2314: "那就这样吧。"
  npc_override_yuno_pile_bunker_bring_me_steel_flexible_771b4d: "给我带来200个钢铁、30个柔性管和1个布罗卡。我可以用这些材料做出我刚才描述的东西。"
  npc_override_yuno_pile_bunker_combination_weight_volum_c1fe09: "重量、体积的结合，看看它的颜色和光泽。它抓住了我的心！"
  npc_override_yuno_pile_bunker_doesn_t_look_fancy_i_8f7fdf: "它看起来不花哨，但我设计了一个弹簧装置，可以用巨大的力量攻击。"
  npc_override_yuno_pile_bunker_flexible_tubes_more_rare_f3a4c0: "柔性管更稀有，由艾音布罗克和里希塔乐镇附近的金属灵掉落。"
  npc_override_yuno_pile_bunker_forced_something_you_don_a43f41: "被迫做你不喜欢的事情，没有什么比这更悲惨的了。"
  npc_override_yuno_pile_bunker_huh_i_m_saying_i_b6a0e5: "嗯？我不是说我对这份工作有什么不满。"
  npc_override_yuno_pile_bunker_i_habit_giving_up_what_f4d61d: "我有一个习惯，当灵感来临时，我会放弃正在做的东西，尝试做新的东西。"
  npc_override_yuno_pile_bunker_i_m_retired_mechanic_i_3a2dca: "我是一个退休的机械工匠，我认为我跟你没什么关系。"
  npc_override_yuno_pile_bunker_i_t_wait_see_action_7fb464: "我等不及要看它实战了！"
  npc_override_yuno_pile_bunker_if_you_imagine_how_good_0f396a: "如果你能想象这种武器有多好，我会让它成为现实。"
  npc_override_yuno_pile_bunker_lastly_finding_brocca_ve_aa85ec: "最后，找到布罗卡非常困难，但你应该能想办法。哈哈，去吧！"
  npc_override_yuno_pile_bunker_makes_me_feel_good_i_942f05: "这让我感觉很好，我正要做一个新装备。我想让你帮我。你觉得怎么样？"
  npc_override_yuno_pile_bunker_me_i_retired_long_time_823cac: "我？我很久以前就退休了。因为我出了事故……受了重伤，再也不能骑乘了。我为此感到难过。"
  npc_override_yuno_pile_bunker_menu_i_85d2b2: "我没那么感兴趣。:你打算做什么？:你在哪里获得材料？:我带来了材料。"
  npc_override_yuno_pile_bunker_msg_b1a5f2: "..........."
  npc_override_yuno_pile_bunker_nothing_i_881f25: "我无能为力"
  npc_override_yuno_pile_bunker_oh_i_ve_been_waiting_05e9f6: "哦，我一直在等。你没按时来，我还以为你忘了呢。请在那里稍等。"
  npc_override_yuno_pile_bunker_oh_turns_out_i_didn_49b881: "哦，结果我根本不需要那么多钢铁。所以，把大部分拿回去吧。"
  npc_override_yuno_pile_bunker_s_concealed_so_when_you_0c1692: "它是隐藏的，所以当你找到机会时，一击就能让对手陷入危急状态！"
  npc_override_yuno_pile_bunker_s_done_what_you_think_29b7e8: "完成了。你觉得怎么样？不错吧？虽然是我自己做的，但我不得不说做得相当好。"
  npc_override_yuno_pile_bunker_s_something_s_allowed_th_cdb14b: "这是那些未能找到自己道路的人所不被允许的东西。"
  npc_override_yuno_pile_bunker_see_you_next_time_e863c1: "下次见！"
  npc_override_yuno_pile_bunker_so_how_s_pilebuncker_wor_a74ef7: "那个打桩机用起来怎么样？"
  npc_override_yuno_pile_bunker_so_i_ve_decided_stay_c07d06: "所以我决定留在这里为魔导机甲锻造装备。"
  npc_override_yuno_pile_bunker_so_what_feel_like_madoge_c9d83a: "那？骑乘魔导机甲是什么感觉？"
  npc_override_yuno_pile_bunker_there_people_who_happy_j_3c9a63: "有些人只是作为支柱就很快乐，你知道的，就像别人可以依靠的墙一样。"
  npc_override_yuno_pile_bunker_uh_little_improvement_co_15f63b: "嗯，稍加改进，它就可以量产并交付。我相信我可以做更多，所以我会把这个给你。"
  npc_override_yuno_pile_bunker_um_huge_metal_stick_coul_002cf7: "嗯，一根巨大的金属棒，可以一击粉碎对手！"
  npc_override_yuno_pile_bunker_you_carrying_so_much_dro_a9b90f: "你带的东西太多了。放下一些行李再来找我。"
  npc_override_yuno_pile_bunker_you_d_better_hurry_1643b2: "你最好快点！"
  npc_override_yuno_pile_bunker_you_haven_t_brought_all_65f91f: "你还没有带来我要求的所有材料。"
  npc_override_yuno_pile_bunker_you_should_able_get_stee_80c32a: "你应该能从很多魔物那里获得钢铁，比如哥布灵。"