  npc_override_yuno_event_skill_reset_how_i_help_you_13e773: "有什么可以帮你的吗？"
  npc_override_yuno_event_skill_reset_i_already_told_you_you_ead9c8: "我已经告诉过你，你只能完成这个活动一次。"
  npc_override_yuno_event_skill_reset_i_m_sorry_349c20: "抱歉，但是……"
  npc_override_yuno_event_skill_reset_if_you_ever_want_reset_45fc41: "如果你想重置的话！！"
  npc_override_yuno_event_skill_reset_just_one_time_again_shak_0973d5: "只需一次，再次摇动技能点"
