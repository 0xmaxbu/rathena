  npc_override_yuno_guides_juno_city_juno_cf36f3: "朱诺之城！"
  npc_override_yuno_guides_juno_city_knowledge_950dc0: "知识之城！"
  npc_override_yuno_guides_juno_forge_f4d7aa: "^FF3355+^000000 -> 锻造坊"
  npc_override_yuno_guides_juno_forge_located_underneath_c2f522: "锻造坊位于军械库下方。"
  npc_override_yuno_guides_juno_fun_your_adventures_b5a0b2: "祝你冒险愉快！"
  npc_override_yuno_guides_juno_good_day_5d2195: "祝你有美好的一天。"
  npc_override_yuno_guides_juno_great_city_wise_men_95447e: "一个伟大的智者之城。"
  npc_override_yuno_guides_juno_i_mark_location_4d06b8: "我会标记"
  npc_override_yuno_guides_juno_i_mark_location_ef3128: "我会标记位置"
  npc_override_yuno_guides_juno_juphero_plaza_ee4ed8: "^3355FF+^000000 -> 朱佩罗广场"
  npc_override_yuno_guides_juno_library_republic_0255cd: "^33FF55+^000000 -> 共和国图书馆"
  npc_override_yuno_guides_juno_menu_armory_b30b74: "军械库:道具店:贤者城堡（贤者转职地点）:书店街:朱佩罗广场:共和国图书馆:施韦切尔比尔魔法学院:怪物博物馆:锻造坊:机场:结束对话"
  npc_override_yuno_guides_juno_menu_kafra_9f70c6: "[ 卡普拉服务人员 ]:[ 伊甸园传送官 ]:上一页菜单"
  npc_override_yuno_guides_juno_menu_main_f0339a: "[ 主要设施 ]:[ 商人&助手 ]:移除小地图标记:取消"
  npc_override_yuno_guides_juno_menu_tool_0928a8: "[ 道具店 ]:[ 锻造所 ]:[ 机场 ]:[ 政府大楼 ]:[ 书店街 ]:[ 旅馆&酒馆 ]:[ 贤者城堡 ]:[ 魔物学院 ]:[ 共和国图书馆 ]:[ 武器&防具店 ]:[ 朱佩罗广场 ]:[ 魔物博物馆 ]:[ 施魏希尔比尔魔法学院 ]:上一页菜单"
  npc_override_yuno_guides_juno_mini_map_99e27a: "在小地图上。"
  npc_override_yuno_guides_juno_monster_museum_8bcc3c: "^3355FF+^000000 -> 怪物博物馆"
  npc_override_yuno_guides_juno_of_the_4c4b9f: "{0}的"
  npc_override_yuno_guides_juno_place_takes_vision_futur_cdc39c: "一个将未来愿景赋予当下形态的地方。欢迎来到"
  npc_override_yuno_guides_juno_please_look_e1c76f: "请看"
  npc_override_yuno_guides_juno_please_look_mini_map_d0d82f: "请看小地图。"
  npc_override_yuno_guides_juno_sage_castle_ee9015: "^33FF55+^000000 -> 贤者城堡"
  npc_override_yuno_guides_juno_sage_job_change_place_7f1b2d: "（ 贤者转职地点 ）"
  npc_override_yuno_guides_juno_schweicherbil_magic_acad_eceec2: "^FF3355+^000000 -> 施韦切尔比尔魔法学院"
  npc_override_yuno_guides_juno_street_book_stores_9048bf: "^FF3355+^000000 -> 书店街"
  npc_override_yuno_guides_juno_sure_i_ll_remove_all_b37a09: "好的，我会移除你小地图上的所有标记。"
  npc_override_yuno_guides_juno_thank_you_07068e: "谢谢，"
  npc_override_yuno_guides_juno_thank_you_good_day_ac23e7: "谢谢，祝你有美好的一天。"
  npc_override_yuno_guides_juno_there_anything_else_i_yo_8fdf01: "还有什么我可以帮你的吗？"
  npc_override_yuno_guides_juno_tool_shop_78d0bb: "^3355FF+^000000 -> 道具店"
  npc_override_yuno_guides_juno_welcome_juno_a7ab54: "欢迎来到朱诺。"
  npc_override_yuno_guides_juno_you_like_check_any_other_342821: "你想查看其他地点吗？"
  npc_override_yuno_guides_juno_your_mini_map_c80911: "在你的小地图上。"
  npc_override_yuno_pile_bunker_about_then_ce2314: "那就这样吧。"
  npc_override_yuno_pile_bunker_bring_me_steel_flexible_771b4d: "给我带来200个钢铁、30个柔性管和1个布罗卡。我可以用这些材料做出我刚才描述的东西。"
  npc_override_yuno_pile_bunker_combination_weight_volum_c1fe09: "重量、体积的结合，看看它的颜色和光泽。它抓住了我的心！"
  npc_override_yuno_pile_bunker_doesn_t_look_fancy_i_8f7fdf: "它看起来不花哨，但我设计了一个弹簧装置，可以用巨大的力量攻击。"
  npc_override_yuno_pile_bunker_flexible_tubes_more_rare_f3a4c0: "柔性管更稀有，由艾音布罗克和里希塔乐镇附近的金属灵掉落。"
  npc_override_yuno_pile_bunker_forced_something_you_don_a43f41: "被迫做你不喜欢的事情，没有什么比这更悲惨的了。"
  npc_override_yuno_pile_bunker_huh_i_m_saying_i_b6a0e5: "嗯？我不是说我对这份工作有什么不满。"
  npc_override_yuno_pile_bunker_i_habit_giving_up_what_f4d61d: "我有一个习惯，当灵感来临时，我会放弃正在做的东西，尝试做新的东西。"
  npc_override_yuno_pile_bunker_i_m_retired_mechanic_i_3a2dca: "我是一个退休的机械工匠，我认为我跟你没什么关系。"
  npc_override_yuno_pile_bunker_i_t_wait_see_action_7fb464: "我等不及要看它实战了！"
  npc_override_yuno_pile_bunker_if_you_imagine_how_good_0f396a: "如果你能想象这种武器有多好，我会让它成为现实。"
  npc_override_yuno_pile_bunker_lastly_finding_brocca_ve_aa85ec: "最后，找到布罗卡非常困难，但你应该能想办法。哈哈，去吧！"
  npc_override_yuno_pile_bunker_makes_me_feel_good_i_942f05: "这让我感觉很好，我正要做一个新装备。我想让你帮我。你觉得怎么样？"
  npc_override_yuno_pile_bunker_me_i_retired_long_time_823cac: "我？我很久以前就退休了。因为我出了事故……受了重伤，再也不能骑乘了。我为此感到难过。"
  npc_override_yuno_pile_bunker_menu_i_85d2b2: "我没那么感兴趣。:你打算做什么？:你在哪里获得材料？:我带来了材料。"
  npc_override_yuno_pile_bunker_msg_b1a5f2: "..........."
  npc_override_yuno_pile_bunker_nothing_i_881f25: "我无能为力"
  npc_override_yuno_pile_bunker_oh_i_ve_been_waiting_05e9f6: "哦，我一直在等。你没按时来，我还以为你忘了呢。请在那里稍等。"
  npc_override_yuno_pile_bunker_oh_turns_out_i_didn_49b881: "哦，结果我根本不需要那么多钢铁。所以，把大部分拿回去吧。"
  npc_override_yuno_pile_bunker_s_concealed_so_when_you_0c1692: "它是隐藏的，所以当你找到机会时，一击就能让对手陷入危急状态！"
  npc_override_yuno_pile_bunker_s_done_what_you_think_29b7e8: "完成了。你觉得怎么样？不错吧？虽然是我自己做的，但我不得不说做得相当好。"
  npc_override_yuno_pile_bunker_s_something_s_allowed_th_cdb14b: "这是那些未能找到自己道路的人所不被允许的东西。"
  npc_override_yuno_pile_bunker_see_you_next_time_e863c1: "下次见！"
  npc_override_yuno_pile_bunker_so_how_s_pilebuncker_wor_a74ef7: "那个打桩机用起来怎么样？"
  npc_override_yuno_pile_bunker_so_i_ve_decided_stay_c07d06: "所以我决定留在这里为魔导机甲锻造装备。"
  npc_override_yuno_pile_bunker_so_what_feel_like_madoge_c9d83a: "那？骑乘魔导机甲是什么感觉？"
  npc_override_yuno_pile_bunker_there_people_who_happy_j_3c9a63: "有些人只是作为支柱就很快乐，你知道的，就像别人可以依靠的墙一样。"
  npc_override_yuno_pile_bunker_uh_little_improvement_co_15f63b: "嗯，稍加改进，它就可以量产并交付。我相信我可以做更多，所以我会把这个给你。"
  npc_override_yuno_pile_bunker_um_huge_metal_stick_coul_002cf7: "嗯，一根巨大的金属棒，可以一击粉碎对手！"
  npc_override_yuno_pile_bunker_you_carrying_so_much_dro_a9b90f: "你带的东西太多了。放下一些行李再来找我。"
  npc_override_yuno_pile_bunker_you_d_better_hurry_1643b2: "你最好快点！"
  npc_override_yuno_pile_bunker_you_haven_t_brought_all_65f91f: "你还没有带来我要求的所有材料。"
  npc_override_yuno_pile_bunker_you_should_able_get_stee_80c32a: "你应该能从很多魔物那里获得钢铁，比如哥布灵。"
  npc_override_yuno_yuno_about_juno_airship_which_6de376: "关于朱诺飞空艇，"
  npc_override_yuno_yuno_ahhh_bc9dd9: "啊~"
  npc_override_yuno_yuno_airship_we_re_developing_00b703: "我们正在开发的飞空艇将为你提供前往任何城镇的便捷旅行。你还可以在空中欣赏风景。各种地区的独特产品也将提供。"
  npc_override_yuno_yuno_although_juno_known_as_c_bbc9e3: "虽然朱诺被称为贤者之城，但我希望你理解普通人也在这里生活和繁荣。请享受朱诺独特的氛围。"
  npc_override_yuno_yuno_amazing_travel_experienc_7264d2: "惊人的旅行体验"
  npc_override_yuno_yuno_among_sage_s_weapons_the_844667: "在贤者的武器中，有一把'反击匕首'。"
  npc_override_yuno_yuno_apocalypse_6a55be: "^3355FF天启^000000……"
  npc_override_yuno_yuno_as_adventurer_s_possible_b41a22: "作为冒险者，你在旅途中可能会见到他。小心……"
  npc_override_yuno_yuno_as_you_chosen_you_forget_9c3553: "如你所选，你将忘记一切，留在这个虚拟现实中。"
  npc_override_yuno_yuno_attacks_using_its_strong_4743a7: "它用强壮的喙攻击，许多大嘴鸟跟随它。大嘴鸟和巨嘴鸟之间的力量差距相当大。"
  npc_override_yuno_yuno_because_its_artificial_i_213133: "因为它的人工智能多年来已经腐化，它再也无法区分同伴和敌人。可悲的是，那个安卓现在只不过是一个无意识的怪物。"
  npc_override_yuno_yuno_city_sages_6c9299: "贤者之城，"
  npc_override_yuno_yuno_complete_testing_however_fc2b22: "完成测试。然而，"
  npc_override_yuno_yuno_development_we_ve_yet_15f5fd: "开发，我们还"
  npc_override_yuno_yuno_don_t_fooled_its_appeara_ba46db: "别被它的外表欺骗，否则你会发现自己陷入麻烦。"
  npc_override_yuno_yuno_eager_customers_know_our_6d8ba6: "热切的顾客知道我们的"
  npc_override_yuno_yuno_even_if_you_manage_dodge_799642: "即使你设法躲过它的角，你仍然需要小心它有力的腿。"
  npc_override_yuno_yuno_fighter_who_f7cc57: "那个战士"
  npc_override_yuno_yuno_geographer_6aff92: "地理学家……"
  npc_override_yuno_yuno_giggle_8ec405: "*轻笑*"
  npc_override_yuno_yuno_giggle_giggle_6c9072: "*轻笑轻笑*"
  npc_override_yuno_yuno_goat_monster_antelope_li_950269: "'山羊'是一种曾经是生活在高山上的羚羊，不知何故变成了怪物。"
  npc_override_yuno_yuno_goat_s_legs_so_strong_02ae99: "山羊的腿很强壮，因为它在不忙于屠杀无辜的时候总是在攀爬悬崖。"
  npc_override_yuno_yuno_good_day_i_am_here_b1d402: "日安，我来通知你"
  npc_override_yuno_yuno_granny_hands_you_some_ca_d55940: "^3355FF老奶奶递给你一些糖果^000000。"
  npc_override_yuno_yuno_he_rumored_high_sorcerer_c8291a: "传闻他曾是一位高阶巫师，用他的力量诅咒无辜。据说他仍在四处游荡，对人们施加诅咒。"
  npc_override_yuno_yuno_here_s_zeny_c970a8: "这是^3355FF1,000 Zeny^000000。"
  npc_override_yuno_yuno_hmm_i_m_sorry_say_00b333: "嗯。很抱歉说你刚刚错过了一个幸运的机会。但是，我看得出你没有足够的财富来实现这个 fortune。"
  npc_override_yuno_yuno_however_rumored_only_few_295216: "然而传闻只有少数被选中的十字军能够获得那些物品，因为它们很稀有。"
  npc_override_yuno_yuno_i_am_old_sage_granny_d082d2: "我是一位预见一切的老贤者奶奶……"
  npc_override_yuno_yuno_i_regret_say_you_enough_ceb3da: "很遗憾地说你身上的Zeny不够。"
  npc_override_yuno_yuno_i_tell_you_about_grand_85a51b: "我来告诉你关于^3355FF巨嘴鸟^000000的事，它是一种高等级的大嘴鸟。巨嘴鸟比大嘴鸟更快，而且相当具有攻击性。"
  npc_override_yuno_yuno_i_wish_i_could_eat_cbfe71: "我现在真想吃一点年糕。"
  npc_override_yuno_yuno_its_use_limited_sage_cla_e99c65: "它的使用仅限于贤者职业，并增加造成暴击攻击的几率。所以，对于贤者来说，那把匕首非常有用，还能让他们在战斗中看起来很时尚。"
  npc_override_yuno_yuno_juno_kept_aloft_air_anci_acb45e: "^3355FF朱诺^000000被一种古老而神秘的力量保持在空中。"
  npc_override_yuno_yuno_juno_made_cbbca5: "^3355FF朱诺，^000000由"
  npc_override_yuno_yuno_lava_dripping_its_body_s_97640b: "从它身上滴落的熔岩如此炽热，可以熔化由高品质钢铁制成的盔甲和武器。"
  npc_override_yuno_yuno_let_me_suggest_holy_guar_ab96c7: "让我推荐^3355FF神圣守护^000000和^3355FF神圣复仇者^000000，这是十字军的特殊物品。"
  npc_override_yuno_yuno_location_each_island_2a4585: "每个岛屿的位置"
  npc_override_yuno_yuno_look_my_hand_i_am_78d3fc: "看我的手。我拿着两种不同的药草。"
  npc_override_yuno_yuno_looks_like_simple_scroll_d21893: "它看起来像一个简单的卷轴，上面标有同心圆和一颗星。虽然^FF3355破旧的魔法卷轴^000000很旧，但许多贤者为了研究目的而想要它。"
  npc_override_yuno_yuno_menu_about_25d8b1: "关于强力装备:关于独特物品:关于正宗食物:结束对话"
  npc_override_yuno_yuno_menu_accept_7cf63b: "接受:不接受"
  npc_override_yuno_yuno_menu_choose_bc52aa: "选择^FF3355红色药草^000000:选择^3355FF蓝色药草^000000。"
  npc_override_yuno_yuno_menu_north_5e7180: "西北 : 所罗门"
  npc_override_yuno_yuno_menu_north_71af05: "东北 : 斯诺托拉"
  npc_override_yuno_yuno_menu_prontera_d014ac: "普隆德拉:依斯鲁得岛:吉芬:梦罗克:斐扬:艾尔贝塔:克魔岛:取消"
  npc_override_yuno_yuno_menu_south_8603cd: "南 : 米内塔。"
  npc_override_yuno_yuno_monster_looks_like_flowe_40373b: "那个怪物看起来像一朵从地面绽放的花。"
  npc_override_yuno_yuno_mumble_mumble_cc26eb: "*嘟囔嘟囔……*"
  npc_override_yuno_yuno_my_name_sergiof_f8bcc5: "我的名字是塞尔吉奥夫，"
  npc_override_yuno_yuno_name_android_used_guard_ec4a5a: "它是一个曾经守卫朱诺的安卓的名字。"
  npc_override_yuno_yuno_name_monster_originated_a7a890: "这个怪物的名字源于一个关于一位可怜的地理学家的故事，不幸的是，他在沉浸于研究时被这个怪物吃掉了。"
  npc_override_yuno_yuno_near_juno_there_exists_f_d59c46: "朱诺附近有一个名为'伪天使'的堕落天使。它假装无辜，假装祝福冒险者，然后毫无预警地从背后捅刀。"
  npc_override_yuno_yuno_oh_hello_there_let_me_5c441d: "哦，你好。让我自我介绍一下。我是朱诺的一位工匠，试图继承物品制造者的权利和职责。"
  npc_override_yuno_yuno_once_airship_39411e: "一旦飞空艇"
  npc_override_yuno_yuno_one_blue_herb_which_make_c6350f: "一种是^3355FF蓝色药草^000000，它会让你忘记现实，让你留在这个虚拟现实中^000000。"
  npc_override_yuno_yuno_open_your_eyes_stop_bein_1c9cf5: "睁开你的眼睛！停止被虚拟现实操纵！"
  npc_override_yuno_yuno_operation_meantime_a75727: "运营。与此同时，"
  npc_override_yuno_yuno_other_red_herb_which_rev_1c6b1a: "另一种是^FF3355红色药草^000000，它会向你揭示什么是真实和真实的。"
  npc_override_yuno_yuno_please_check_amount_zeny_9389b6: "请检查你拥有的Zeny数量。"
  npc_override_yuno_yuno_power_said_come_relic_an_6c9be5: "这种力量据说来自一个名为^3355FF朱佩罗斯^000000的古代文明的遗物，它在朱诺存在之前就已经存在于此。"
  npc_override_yuno_yuno_progress_7155de: "进展。"
  npc_override_yuno_yuno_research_revealed_juno_s_10ec8f: "研究表明朱诺的能源基于^3355FF伊米尔之心碎片^000000。我听说这种能源在朱佩罗斯曾经存在的地方被发现。"
  npc_override_yuno_yuno_rice_cake_yes_s_traditio_e58608: "^3355FF年糕^000000！是的，这是一种受到很多人喜爱的传统食物。有许多与老式市场相关的怀旧记忆与年糕联系在一起。"
  npc_override_yuno_yuno_rumored_realm_dead_bring_0b2b26: "它传闻来自死者的领域。它带来了许多不死怪物，意图将生物引向它冰冷严寒的领域。"
  npc_override_yuno_yuno_s_hard_believe_2c3af1: "很难相信"
  npc_override_yuno_yuno_s_long_narrow_shield_ang_90efd9: "这是一面长而窄的盾牌，正面中央刻有天使翅膀。对抗恶魔和不死怪物时，它特别强大。"
  npc_override_yuno_yuno_see_you_cbb095: "再见 ~"
  npc_override_yuno_yuno_seems_you_use_item_when_e43d97: "看来你可以在使用高等级魔法咒语时使用那个物品。"
  npc_override_yuno_yuno_seen_large_jellopy_5e493b: "见过大杰勒比？"
  npc_override_yuno_yuno_serves_granny_5f0ba6: "为老奶奶服务。"
  npc_override_yuno_yuno_shining_jellopy_even_exi_ebc062: "闪亮的杰勒比甚至存在！"
  npc_override_yuno_yuno_since_many_scholars_been_4cd979: "由于许多学者来到朱诺研究和研究这种能源，我们的城市基本上是众所周知的学者圣地。"
  npc_override_yuno_yuno_so_you_enjoy_candy_3e3305: "那么，你喜欢糖果吗？"
  npc_override_yuno_yuno_strangely_extend_its_bod_ca326e: "奇怪的是，它可以将身体延伸到很远的距离。即使你离它很远，它仍然可以构成威胁。"
  npc_override_yuno_yuno_such_large_e015c6: "如此巨大和"
  npc_override_yuno_yuno_teleport_fee_zeny_regard_0a0905: "传送费是1,800 Zeny，无论你想去哪里。请告诉我你的目的地。"
  npc_override_yuno_yuno_teleport_service_f06ac9: "传送服务。"
  npc_override_yuno_yuno_there_holy_shield_named_74e515: "有一面名为'神圣使命'的圣盾，只能由十字军使用。"
  npc_override_yuno_yuno_there_monster_near_here_766baf: "这附近有一种名为熔岩魔像的怪物。这个魔像由一颗石心制成，当它被熔岩冲走时，其力量碰巧被魔法力量放大了。"
  npc_override_yuno_yuno_there_you_go_92b2d8: "给你~"
  npc_override_yuno_yuno_therefore_equipment_more_969bed: "因此，这种装备对某些类型的怪物如幽灵或不死怪物更强大。"
  npc_override_yuno_yuno_these_pieces_equipment_v_308154: "这些装备非常轻便，具有足够的能力。它们碰巧还拥有神圣力量。"
  npc_override_yuno_yuno_these_solomon_island_hon_5362cc: "这些是所罗门，荣誉之岛，米内塔，繁荣之岛，和斯诺托拉，知识之岛。"
  npc_override_yuno_yuno_those_things_huuuge_612ef0: "那些东西好大！"
  npc_override_yuno_yuno_three_islands_b4255a: "三个岛屿。"
  npc_override_yuno_yuno_time_come_463080: "时候到了。"
  npc_override_yuno_yuno_unfortunately_still_f80fa6: "不幸的是，它仍在"
  npc_override_yuno_yuno_we_feel_need_let_our_244b59: "我们觉得有必要让我们的"
  npc_override_yuno_yuno_we_plan_operate_near_fut_bd840b: "我们计划在不久的将来运营。"
  npc_override_yuno_yuno_we_promise_our_customers_03605c: "我们向顾客承诺"
  npc_override_yuno_yuno_we_providing_special_8b1c8b: "我们提供特殊的"
  npc_override_yuno_yuno_welcome_juno_city_noble_d75d25: "欢迎来到朱诺，高尚之城。"
  npc_override_yuno_yuno_well_then_0f1bb7: "那么……"
  npc_override_yuno_yuno_whichever_one_you_choose_e6497b: "无论你选择哪一个，你必须花费^3355FF5,000 Zeny^000000。现在，请选择一个。"
  npc_override_yuno_yuno_world_you_experiencing_a_186047: "你正在经历的这个世界实际上是虚构的！是时候让你看清现实了！"
  npc_override_yuno_yuno_yes_s_right_now_you_9ece5a: "是的，没错。现在你必须问自己为什么没有接受我提供的糖果。"
  npc_override_yuno_yuno_you_accept_bb6a66: "你接受这个吗？"
  npc_override_yuno_yuno_you_already_chosen_wheth_923ef0: "你已经选择了是否挑战死亡之主。你现在需要做的就是理解你为什么做出这个决定。"
  npc_override_yuno_yuno_you_d_better_careful_whe_fb8d26: "你遇到这个怪物时最好小心。它会在眨眼间损坏盔甲和武器。"
  npc_override_yuno_yuno_you_ever_f6719d: "你曾经"
  npc_override_yuno_yuno_you_ever_heard_egyptian_6e0f16: "你曾经听说过一位曾被认为是神之子的埃及国王吗？他的名字是^3355FF法老^000000。"
  npc_override_yuno_yuno_you_heard_boss_monster_b_e8cb2b: "你听说过在朱诺附近存在很久的首领怪物吗？它只被称为^FF3355死亡之主^000000。"
  npc_override_yuno_yuno_you_see_truth_76a72e: "你将看到真相。"
  npc_override_yuno_yuno_you_ve_already_chosen_do_5e7ff6: "你已经选择了。你是否得到这颗糖果并不重要。那根本不重要。你必须理解为什么会发生这种事。"
  npc_override_yuno_yuno_you_very_lucky_me_tell_96981c: "你很幸运能由我告诉你这个故事。这只有^FF33551/1000的几率^000000发生。"
