  npc_override_yuno_event_skill_reset_my_base_level_level_base_e24511: "我的 Base 等级是 ^AA00AALevel {0}BaseLv。^000000"
  npc_override_yuno_event_skill_reset_oh_yeah_one_more_thing_6c68fe: "哦对了，还有一件事！"
  npc_override_yuno_event_skill_reset_please_come_again_soon_c9613e: "请很快再来！"
  npc_override_yuno_event_skill_reset_please_drop_your_cart_we_96e97a: "请放下你的手推车，我们继续。"
  npc_override_yuno_event_skill_reset_please_free_your_falcon_347a2b: "请释放你的猎鹰，我们继续。"
  npc_override_yuno_event_skill_reset_please_free_your_pecopec_6ab862: "请释放你的大嘴鸟，我们继续。"
  npc_override_yuno_event_skill_reset_please_return_when_you_r_14ec44: "请在你达到 BaseLv 60 或更高时回来。"
  npc_override_yuno_event_skill_reset_removed_if_you_reset_you_4b48fc: "如果你重置技能，将会被移除。"
  npc_override_yuno_event_skill_reset_seems_you_don_t_enough_669bef: "看起来你没有足够的钱。"
  npc_override_yuno_event_skill_reset_skill_reset_free_charge_bcd7a2: "这个技能重置不是免费的！！"
  npc_override_yuno_event_skill_reset_thank_you_174534: "谢谢。"
  npc_override_yuno_event_skill_reset_total_zeny_reset_skill_a_571674: "技能重置服务的总费用为 ^529DFF{0}Zeny^000000。"
  npc_override_yuno_event_skill_reset_when_you_keep_a0bcca: "当你保持"
  npc_override_yuno_event_skill_reset_yeah_each_one_baselv_cos_197cb3: "是的……每1级 BaseLv 需要20000 Zeny来重置技能。"
  npc_override_yuno_event_skill_reset_you_cannot_reset_skills_622ad4: "你不能重置技能"
  npc_override_yuno_event_skill_reset_you_know_where_find_me_481d81: "你知道在哪里找我，"
  npc_override_yuno_event_skill_reset_you_like_reset_skills_9bd4b8: "你想重置技能吗？"
  npc_override_yuno_event_skill_reset_you_need_use_up_all_584e5f: "如果你想让我继续，你需要用完你所有的技能点。"
  npc_override_yuno_event_skill_reset_you_shall_first_tell_me_4dc861: "你必须先告诉我你的 Base 等级。"
  npc_override_yuno_event_skill_reset_your_name_3a75ca: "你的名字是 ^0080FF{0}^000000。"
  npc_override_yuno_guides_juno_airport_176f3a: "^FF3355+^000000 -> 机场"
