Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_gef_tower_FridayDungeon_good_luck_ddf2f3: "Good Luck~"
  npc_override_gef_tower_FridayDungeon_hello_f7ff9e: "Hello"
  npc_override_gef_tower_FridayDungeon_menu_lord_7ae870: "Lord of the Dead: Who Awakened Me? I will meet you in person and ask you why."
  npc_override_gef_tower_FridayDungeon_now_place_about_become_h_b0950e: "Now, this place is about to become a hunting ground. I'll get out and close the front door."
  npc_override_gef_tower_FridayDungeon_party_entering_d3d912: "{0} of the party, {1}, is entering the {2}."
  npc_override_gef_tower_FridayDungeon_treasure_chest_appeared_fd3543: "A treasure chest appeared somewhere in the dungeon. It'll disappear after a while, so let's find it."
  npc_override_gef_tower_sorcerer_aaaak_d5987a: "Aaaak!! "
  npc_override_gef_tower_sorcerer_ability_you_ve_shown_unt_892983: "But with the ability you've shown until now, you will be capable to do anything from now on. Dear [{0}]"
  npc_override_gef_tower_sorcerer_ah_excuse_me_93bb02: "Ah... excuse me~"
  npc_override_gef_tower_sorcerer_ahahaha_if_you_run_out_ea5a0e: "Ahahaha... If you run out of property stones, you simply have to get more."
  npc_override_gef_tower_sorcerer_ahh_i_think_you_don_9d6ef7: "Ahh~ I think you don't need to have a conversation with me."
  npc_override_gef_tower_sorcerer_ahh_sir_really_possible_9cff43: "Ahh... sir. Is that really possible?"
  npc_override_gef_tower_sorcerer_all_i_need_868a89: "Is this all I need to do?"
  npc_override_gef_tower_sorcerer_any_questions_865bb7: "Have any questions?"
  npc_override_gef_tower_sorcerer_aware_these_detecting_po_d813eb: "Be aware that these detecting poles are activated only when you have more than the certain amount of property stones."
  npc_override_gef_tower_sorcerer_before_i_appointed_you_n_f1e9c6: "Before I appointed you the need job, please check on your own body status. "
  npc_override_gef_tower_sorcerer_before_i_let_you_know_166171: "Before I let you know the progressing way, you'll need to bring some required material."
  npc_override_gef_tower_sorcerer_before_you_take_sorcerer_9eb15e: "Before you take the Sorcerer test, let me give you the basic information."
  npc_override_gef_tower_sorcerer_congratulations_d7e081: "Congratulations, [{0}]"
  npc_override_gef_tower_sorcerer_course_if_you_lucky_enou_a0dd1a: "Of course if you are lucky enough, if you fail, a Wind of Verdure can be changed into a Rough Wind... Well, that's not a common situation so let's leave that out of the discussion for now."
  npc_override_gef_tower_sorcerer_course_just_beginning_we_b55cc2: "Of course it is just a beginning, we don't know which spirit you're going to commune with or what kind of hardships await you."
  npc_override_gef_tower_sorcerer_course_sorcerers_use_mag_ca38ca: "Of course, Sorcerers use magic, too. But, do you know the main difference Sorcerers have from other magical jobs?"
  npc_override_gef_tower_sorcerer_crystal_blue_29c8f5: "3 Crystal Blue."
  npc_override_gef_tower_sorcerer_dear_157862: "Dear [{0}],"
  npc_override_gef_tower_sorcerer_doesn_t_seem_like_you_a9e46f: "It doesn't seem like you got anything special from the spirits."
  npc_override_gef_tower_sorcerer_don_t_give_up_keep_df97e5: "Don't give up and keep on trying~"
  npc_override_gef_tower_sorcerer_example_if_you_visit_pla_7cde04: "For example, if you visit the place where the spirit of wind stays with a certain amount of Wind of Verdure, the reaction of the spirit is amplified."
  npc_override_gef_tower_sorcerer_first_you_need_bring_fol_33aeb5: "First, you need to bring the following materials needed for the test."
  npc_override_gef_tower_sorcerer_give_me_second_register_f582fb: "Give me a second to register your name."
  npc_override_gef_tower_sorcerer_good_before_we_get_start_0f8a33: "Good, before we get started..."
  npc_override_gef_tower_sorcerer_good_then_i_ll_give_607816: "Good, then I'll give you a short explanation about the Sorcerer."
  npc_override_gef_tower_sorcerer_green_live_b46a75: "3 Green Live."
  npc_override_gef_tower_sorcerer_haha_then_i_cup_water_c4cdfd: "Haha, then can I have a cup of water for a minute? Please come and find me again later."
  npc_override_gef_tower_sorcerer_hm_hm_bf25e3: "Hm hm!!!~"
  npc_override_gef_tower_sorcerer_hmm_might_hard_someone_l_31703e: "Hmm, but it might be hard for someone like you who's focused only on reading books..."
  npc_override_gef_tower_sorcerer_hmm_then_first_you_write_e76bdc: "Hmm... Then first, can you write down your name on this list?"
  npc_override_gef_tower_sorcerer_how_about_your_test_well_86649a: "How about your test? Well, Karacas is a little lazy, so that might bother you some... kkk"
  npc_override_gef_tower_sorcerer_i_belong_sorcerer_associ_499fc5: "I belong to the Sorcerer association. I don't think you have any business with me."
  npc_override_gef_tower_sorcerer_i_hope_you_gain_more_84f74c: "I hope that you gain more communion with spirits from now on."
  npc_override_gef_tower_sorcerer_i_ll_tell_you_about_4e694b: "I'll tell you about it now. First, I'll tell you the places for the test. You better write them down."
  npc_override_gef_tower_sorcerer_i_see_detecting_staff_s_d42a8a: "I can see the detecting staff that's been installed by the Sorcerer Union to communicate with the spirits."
  npc_override_gef_tower_sorcerer_i_see_give_me_moment_3ce23f: "I see, give me a moment."
  npc_override_gef_tower_sorcerer_i_tell_you_how_so_1bc72c: "I will tell you how to do that. So listen carefully."
  npc_override_gef_tower_sorcerer_i_thought_you_d_overwhel_6431c8: "I thought you'd be overwhelmed by the spirits but you've managed to get the effective medicine!"
  npc_override_gef_tower_sorcerer_if_you_advanced_sorcerer_997a9e: "If you are an advanced Sorcerer, you will be able to talk with spirits without going through this process again. But beginners need to use that kind of medium to talk with them."
  npc_override_gef_tower_sorcerer_if_you_succeed_you_extra_2d7111: "If you succeed, you can extract a part of the spirit as a reagent. If you fail, the property stone will break up."
  npc_override_gef_tower_sorcerer_if_you_suitable_property_eb3826: "If you have the suitable property stones, you should be able to commune with the spirits."
  npc_override_gef_tower_sorcerer_job_based_power_spirits_58d5cb: "This job is based on the power of spirits."
  npc_override_gef_tower_sorcerer_kind_spirit_doesn_t_exis_1d2dd7: "That kind of spirit doesn't exist!"
  npc_override_gef_tower_sorcerer_likewise_if_you_approach_94e4f1: "Likewise, if you approach the place where the spirit of fire seems to stay while you have a certain amount of Red Blood, the spirit will show the adverse reaction."
  npc_override_gef_tower_sorcerer_list_already_arrived_b3a78d: "The list... has already arrived."
  npc_override_gef_tower_sorcerer_menu_i_a3be73: "I will take the test.:I'll do it later."
  npc_override_gef_tower_sorcerer_menu_no_c4c318: "No.:Please explain it again."
  npc_override_gef_tower_sorcerer_menu_the_776745: "The spirit of fire led me here.:The spirit of water led me here.:The spirit of earth led me here:The spirit of meat led me here."
  npc_override_gef_tower_sorcerer_menu_they_f872a2: "They know how to sing.:They're all old fogies.:They can deal with the spirits."
  npc_override_gef_tower_sorcerer_menu_write_ebeb95: "Write name.:I won't."
  npc_override_gef_tower_sorcerer_menu_yes_7a0b44: "Yes, I can.:No, I'm not really good at it."
  npc_override_gef_tower_sorcerer_menu_yes_c96731: "Yes, I am.:No, I'm not!"
  npc_override_gef_tower_sorcerer_merito_told_me_visit_you_06ed9e: "Merito told me to visit you."
  npc_override_gef_tower_sorcerer_more_people_visiting_gef_1ce983: "More people are visiting Geffen Tower these days."
  npc_override_gef_tower_sorcerer_moreover_i_formally_ackn_06a2a9: "Moreover, I formally acknowledge that you've completed all the job transfer tests of the Sorcerer Academy."
  npc_override_gef_tower_sorcerer_msg_79ef7f: "...."
  npc_override_gef_tower_sorcerer_nd_floor_kunlun_dungeon_022b84: "4. 2nd floor of Kunlun Dungeon"
  npc_override_gef_tower_sorcerer_oh_i_see_bb3c05: "Oh, I see."
  npc_override_gef_tower_sorcerer_oh_my_afc6f5: "Oh, my... "
  npc_override_gef_tower_sorcerer_oh_seems_you_re_too_f02e78: "Oh, it seems that you're too heavy. Empty your bag and then come again."
  npc_override_gef_tower_sorcerer_oh_there_must_some_mista_a065e3: "Oh, there must be some mistake in the list, I think. Will you come again later?"
  npc_override_gef_tower_sorcerer_oh_you_all_materials_e1e3b1: "Oh, you have all the materials."
  npc_override_gef_tower_sorcerer_okay_4371ac: "Okay. "
  npc_override_gef_tower_sorcerer_okay_should_obvious_3d74e5: "Okay, that should be obvious."
  npc_override_gef_tower_sorcerer_once_you_bring_stones_po_e8841a: "Once you bring the stones to the poles, put them into the property decomposing machine which is attached to the pole. The detecting pole will be activated, and you can communicate with the spirit."
  npc_override_gef_tower_sorcerer_originally_my_teacher_ne_92d108: "Originally my teacher needs to check the Sorcerer job change but after he went out to find the spirit of fish, I can't see him. So I'll check it myself."
  npc_override_gef_tower_sorcerer_please_get_sprits_well_y_9e5584: "Please get on with the sprits well~ You should~!"
  npc_override_gef_tower_sorcerer_please_unequip_your_ridi_9169ed: "Please unequip your riding pet~"
  npc_override_gef_tower_sorcerer_rd_floor_mjolnir_dead_pi_7cf89c: "3. 3rd floor of Mjolnir Dead Pit"
  npc_override_gef_tower_sorcerer_reagent_one_spirit_makes_6d071f: "A reagent that one spirit makes won't be over 2 kinds so if you're going to make 3 kinds of reagents, I suggest you go around several places."
  npc_override_gef_tower_sorcerer_red_blood_1ae109: "3 Red Blood."
  npc_override_gef_tower_sorcerer_right_5ae90d: "Right~"
  npc_override_gef_tower_sorcerer_s_easy_thing_get_desired_97377c: "It's not an easy thing to get the desired effect by communicating with spirits."
  npc_override_gef_tower_sorcerer_s_right_most_distinguish_a76649: "That's right. That is the most distinguishing feature that Sorcerers have."
  npc_override_gef_tower_sorcerer_so_communicating_spirits_a1c89f: "So communicating with spirits..."
  npc_override_gef_tower_sorcerer_so_i_need_property_stone_b2e75b: "So I need the property stones..."
  npc_override_gef_tower_sorcerer_so_people_who_test_usual_cef709: "So people who have this test usually start with as many property stones as they can carry. The amount I told you to get is just the bare minimum."
  npc_override_gef_tower_sorcerer_so_reagent_1e7f2e: "So the reagent is...?"
  npc_override_gef_tower_sorcerer_so_s_basic_introduction_af21be: "So that's the basic introduction, so you just need to decide whether or not you want to take the qualification test."
  npc_override_gef_tower_sorcerer_so_usually_we_perform_ce_7fd07e: "So, usually we perform a certain ceremony parade toward the place where we can feel the spirits."
  npc_override_gef_tower_sorcerer_so_you_eefcde: "So, you are [{0}]."
  npc_override_gef_tower_sorcerer_so_you_right_b83b80: "So, you are [{0}]... right?"
  npc_override_gef_tower_sorcerer_sorcerers_use_basic_prin_666f5f: "Sorcerers use this basic principle, this is the essential knowledge that Sorcerers need to have to reach the spirits."
  npc_override_gef_tower_sorcerer_sounds_easy_right_8e84a9: "Sounds easy, right?"
  npc_override_gef_tower_sorcerer_spirit_combined_property_62cf07: "The spirit combined the property stones into a huge property stone."
  npc_override_gef_tower_sorcerer_st_floor_ice_cave_b1aa60: "1. 1st floor of Ice Cave"
  npc_override_gef_tower_sorcerer_st_floor_thor_volcano_du_2a16b1: "2. 1st floor of Thor Volcano Dungeon"
  npc_override_gef_tower_sorcerer_talk_me_again_second_b7920c: "Talk to me again in a second."
  npc_override_gef_tower_sorcerer_then_i_ll_hand_over_640945: "Then I'll hand it over to Karacas who is on the 4th floor. He will guide you through the process of the test."
  npc_override_gef_tower_sorcerer_then_i_ll_write_down_d1ac52: "Then I'll write down the progress that I've summarized shortly. Wait..."
  npc_override_gef_tower_sorcerer_there_anything_i_you_7e1118: "Is there anything I can do for you?"
  npc_override_gef_tower_sorcerer_usually_we_cannot_see_sp_b3af0b: "Usually we cannot see the spirits with our eyes but there is a way to realize the part of the spirits through a special medium."
  npc_override_gef_tower_sorcerer_way_get_sorcerer_registr_f07ac5: "The way to get a Sorcerer registration ticket is really simple. You just need to go and find one of each spirit scattered around the world, and then convert their power into the shape of a certain material."
  npc_override_gef_tower_sorcerer_we_don_t_know_which_17e8f2: "We don't know which reagent is going to be made from the spirits. It differs by the state of spirits."
  npc_override_gef_tower_sorcerer_we_set_up_detecting_pole_6c75b6: "We have set up the detecting poles in these 4 places so that ordinary people can communicate with the spirits."
  npc_override_gef_tower_sorcerer_welcome_what_i_help_you_ee16e9: "Welcome. What can I help you with?"
  npc_override_gef_tower_sorcerer_well_done_first_i_organi_3d35dd: "Well done. First, I will organize the miraculous medicine so please wait a moment."
  npc_override_gef_tower_sorcerer_well_impossible_meet_eve_bb3336: "Well, it is impossible to meet every spirit by yourself. You need to train yourself very hard to give a shape to the spirits and see them clearly through your eyes."
  npc_override_gef_tower_sorcerer_well_maybe_some_s_main_578300: "Well maybe some but that's not the main difference."
  npc_override_gef_tower_sorcerer_well_okay_see_you_again_7fd7df: "Well, okay. See you again when you get a chance."
  npc_override_gef_tower_sorcerer_well_s_all_up_you_97a6b8: "Well, it's all up to you. What are you going to do?"
  npc_override_gef_tower_sorcerer_wh_where_you_a79b2d: "Wh... where are you from?"
  npc_override_gef_tower_sorcerer_what_how_dare_you_ded913: "What! How dare you!?!"
  npc_override_gef_tower_sorcerer_what_i_sure_you_wanted_b875cd: "What? I was sure that you wanted to become a Sorcerer."
  npc_override_gef_tower_sorcerer_what_if_i_run_out_e2fead: "What if I run out of stones?"
  npc_override_gef_tower_sorcerer_what_made_you_want_sorce_bb145e: "What made you want to be a sorcerer?"
  npc_override_gef_tower_sorcerer_what_should_i_next_babd62: "What should I do next?"
  npc_override_gef_tower_sorcerer_what_you_doing_here_then_1fb3dc: "What are you doing here then? Get out of here. Right now!"
  npc_override_gef_tower_sorcerer_what_you_don_t_know_d5371b: "What!? You don't know how to use magic?"
  npc_override_gef_tower_sorcerer_when_people_who_want_sor_e266db: "When the people who want to be a Sorcerer come, the first thing we do is to check whether they can communicate with spirits or not."
  npc_override_gef_tower_sorcerer_when_you_bring_these_bas_d52ddc: "When you bring these basic things, I'll guide you to the next step."
  npc_override_gef_tower_sorcerer_when_you_bring_these_mat_2f5ec5: "When you bring these materials, I'll tell you the next step."
  npc_override_gef_tower_sorcerer_when_you_succeed_getting_72d1c7: "When you succeed in getting 3 different kinds of reagents, you can come back."
  npc_override_gef_tower_sorcerer_wind_verdure_6601ae: "3 Wind of Verdure."
  npc_override_gef_tower_sorcerer_wouldn_t_more_comfortabl_317a93: "Wouldn't it be more comfortable to just live as a scholar? Sorcerers are busy communicating with the spirits and don't have much time to read books..."
  npc_override_gef_tower_sorcerer_wow_you_young_adventurer_eb695d: "Wow~ you are a young adventurer. I envy you."
  npc_override_gef_tower_sorcerer_wow_your_skill_good_a75654: "Wow~ your skill is good."
  npc_override_gef_tower_sorcerer_yes_you_quick_wits_29bf93: "Yes, you have quick wits!"
  npc_override_gef_tower_sorcerer_you_got_paper_which_way_b341fc: "^000099You got a paper on which the way of communicating with spirits is written. For more information please open your quest window^000000."
  npc_override_gef_tower_sorcerer_you_got_reagent_communic_2b8cfe: "You got a reagent by communicating with an unseen spirit."
  npc_override_gef_tower_sorcerer_you_handle_magic_skillfu_9b5d26: "[{0}], can you handle magic skillfully?"
  npc_override_gef_tower_sorcerer_you_know_about_sorcerers_6aac34: "Do you know about Sorcerers?"
  npc_override_gef_tower_sorcerer_you_look_happy_great_jou_9cddc4: "You look happy. Have a great journey."
  npc_override_gef_tower_sorcerer_you_must_born_natural_ab_527324: "You must be born with the natural ability to see that you already communicated with the spirits, or you must be an excellent liar."
  npc_override_gef_tower_sorcerer_you_must_etiquette_your_aaee79: "You must have the etiquette of your job now before you accept the new job! "
  npc_override_gef_tower_sorcerer_you_need_prepare_least_s_7df685: "You need to prepare at least 3 small stones for each property. For example, you need Wind of Verdure, not Rough Wind."
  npc_override_gef_tower_sorcerer_you_packed_so_much_your_b0bd5c: "You packed so much in your bag. Try again after emptying your bag."
  npc_override_gef_tower_sorcerer_you_used_property_stones_ccd92b: "You used the property stones but it looks like you failed to communicate with the spirits."
  npc_override_gef_tower_sorcerer_you_went_around_rough_wi_8341d1: "you went around the rough wilds to open the door as a Sorcerer and passed all the requirements that our Academy has given."
  npc_override_gef_tower_sorcerer_z_z_z_520841: "... (Z z z~)"
