Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_gef_tower_FridayDungeon_good_luck_ddf2f3: "祝你好运~"
  npc_override_gef_tower_FridayDungeon_hello_f7ff9e: "你好"
  npc_override_gef_tower_FridayDungeon_menu_lord_7ae870: "亡者之主:是谁唤醒了我？我要亲自见你，问你为什么。"
  npc_override_gef_tower_FridayDungeon_now_place_about_become_h_b0950e: "现在，这个地方即将成为狩猎场。我要出去并关上前门。"
  npc_override_gef_tower_FridayDungeon_party_entering_d3d912: "队伍中的{0}，{1}，正在进入{2}。"
  npc_override_gef_tower_FridayDungeon_treasure_chest_appeared_fd3543: "地牢某处出现了一个宝箱。它很快就会消失，让我们找到它。"
  npc_override_gef_tower_sorcerer_aaaak_d5987a: "啊啊啊！！"
  npc_override_gef_tower_sorcerer_ability_you_ve_shown_unt_892983: "但凭借你至今展示的能力，从今以后你将无所不能。亲爱的[{0}]"
  npc_override_gef_tower_sorcerer_ah_excuse_me_93bb02: "啊……不好意思~"
  npc_override_gef_tower_sorcerer_ahahaha_if_you_run_out_ea5a0e: "啊哈哈哈……如果你耗尽了属性石，你只需要再去获取更多。"
  npc_override_gef_tower_sorcerer_ahh_i_think_you_don_9d6ef7: "啊~我想你没必要和我交谈了。"
  npc_override_gef_tower_sorcerer_ahh_sir_really_possible_9cff43: "啊……先生。那真的可能吗？"
  npc_override_gef_tower_sorcerer_all_i_need_868a89: "这就是我需要做的全部吗？"
  npc_override_gef_tower_sorcerer_any_questions_865bb7: "有问题吗？"
  npc_override_gef_tower_sorcerer_aware_these_detecting_po_d813eb: "请注意，这些探测杆只有在你拥有超过一定数量的属性石时才会激活。"
  npc_override_gef_tower_sorcerer_before_i_appointed_you_n_f1e9c6: "在我任命你为所需职位之前，请先检查一下自己的身体状态。"
  npc_override_gef_tower_sorcerer_before_i_let_you_know_166171: "在我告诉你进阶方法之前，你需要带一些所需材料来。"
  npc_override_gef_tower_sorcerer_before_you_take_sorcerer_9eb15e: "在你参加术士测试之前，让我给你一些基本信息。"
  npc_override_gef_tower_sorcerer_congratulations_d7e081: "恭喜你，[{0}]"
  npc_override_gef_tower_sorcerer_course_if_you_lucky_enou_a0dd1a: "当然，如果你足够幸运的话，如果你失败了，微风之息可以变成粗糙之风……不过，这种情况并不常见，所以我们暂时不讨论这个。"
  npc_override_gef_tower_sorcerer_course_just_beginning_we_b55cc2: "当然这只是个开始，我们不知道你将与哪个精灵沟通，或者有什么样的困难在等待着你。"
  npc_override_gef_tower_sorcerer_course_sorcerers_use_mag_ca38ca: "当然，术士也使用魔法。但是，你知道术士与其他魔法职业的主要区别吗？"
  npc_override_gef_tower_sorcerer_crystal_blue_29c8f5: "3个冰蓝水晶。"
  npc_override_gef_tower_sorcerer_dear_157862: "亲爱的[{0}]，"
  npc_override_gef_tower_sorcerer_doesn_t_seem_like_you_a9e46f: "看起来你从精灵那里没有得到什么特别的东西。"
  npc_override_gef_tower_sorcerer_don_t_give_up_keep_df97e5: "不要放弃，继续尝试~"
  npc_override_gef_tower_sorcerer_example_if_you_visit_pla_7cde04: "例如，如果你带着一定数量的微风之息前往风之精灵所在的地方，精灵的反应会被放大。"
  npc_override_gef_tower_sorcerer_first_you_need_bring_fol_33aeb5: "首先，你需要带以下测试所需的材料。"
  npc_override_gef_tower_sorcerer_give_me_second_register_f582fb: "给我一秒钟登记你的名字。"
  npc_override_gef_tower_sorcerer_good_before_we_get_start_0f8a33: "很好，在我们开始之前……"
  npc_override_gef_tower_sorcerer_good_then_i_ll_give_607816: "很好，那我来给你简单介绍一下术士。"
  npc_override_gef_tower_sorcerer_green_live_b46a75: "3个翠绿水晶。"
  npc_override_gef_tower_sorcerer_haha_then_i_cup_water_c4cdfd: "哈哈，那我能喝杯水吗？请稍后再来找我。"
  npc_override_gef_tower_sorcerer_hm_hm_bf25e3: "嗯哼！！~"
  npc_override_gef_tower_sorcerer_hmm_might_hard_someone_l_31703e: "嗯，但对于像你这种只专注于读书的人来说可能有点难……"
  npc_override_gef_tower_sorcerer_hmm_then_first_you_write_e76bdc: "嗯……那首先，你能在这张名单上写下你的名字吗？"
  npc_override_gef_tower_sorcerer_how_about_your_test_well_86649a: "你的测试怎么样？嗯，卡拉卡斯有点懒，这可能会让你有些困扰……kkk"
  npc_override_gef_tower_sorcerer_i_belong_sorcerer_associ_499fc5: "我属于术士协会。我觉得你和我没什么可谈的。"
  npc_override_gef_tower_sorcerer_i_hope_you_gain_more_84f74c: "我希望你今后能与精灵建立更多的沟通。"
  npc_override_gef_tower_sorcerer_i_ll_tell_you_about_4e694b: "我现在就告诉你。首先，我会告诉你测试的地点。你最好记下来。"
  npc_override_gef_tower_sorcerer_i_see_detecting_staff_s_d42a8a: "我能看到术士工会安装的探测法杖，用来与精灵沟通。"
  npc_override_gef_tower_sorcerer_i_see_give_me_moment_3ce23f: "我明白了，给我一点时间。"
  npc_override_gef_tower_sorcerer_i_tell_you_how_so_1bc72c: "我会告诉你怎么做。所以仔细听好。"
  npc_override_gef_tower_sorcerer_i_thought_you_d_overwhel_6431c8: "我以为你会被精灵 overwhelm，但你成功获得了有效的灵药！"
  npc_override_gef_tower_sorcerer_if_you_advanced_sorcerer_997a9e: "如果你是高级术士，你将能够不经过这个过程再次与精灵对话。但初学者需要使用那种媒介来与精灵交谈。"
  npc_override_gef_tower_sorcerer_if_you_succeed_you_extra_2d7111: "如果你成功了，你可以提取精灵的一部分作为试剂。如果你失败了，属性石会碎裂。"
  npc_override_gef_tower_sorcerer_if_you_suitable_property_eb3826: "如果你有合适的属性石，你应该能够与精灵沟通。"
  npc_override_gef_tower_sorcerer_job_based_power_spirits_58d5cb: "这个职业是基于精灵的力量。"
  npc_override_gef_tower_sorcerer_kind_spirit_doesn_t_exis_1d2dd7: "那种精灵不存在！"
  npc_override_gef_tower_sorcerer_likewise_if_you_approach_94e4f1: "同样，如果你带着一定数量的鲜红血液接近火之精灵所在的地方，精灵会展示相反的反应。"
  npc_override_gef_tower_sorcerer_list_already_arrived_b3a78d: "名单……已经到了。"
  npc_override_gef_tower_sorcerer_menu_i_a3be73: "我要参加测试。:我稍后再做。"
  npc_override_gef_tower_sorcerer_menu_no_c4c318: "不了。:请再解释一遍。"
  npc_override_gef_tower_sorcerer_menu_the_776745: "火之精灵引导我来这里。:水之精灵引导我来这里。:地之精灵引导我来这里。:肉之精灵引导我来这里。"
  npc_override_gef_tower_sorcerer_menu_they_f872a2: "它们知道如何唱歌。:它们都是老顽固。:它们可以对付精灵。"
  npc_override_gef_tower_sorcerer_menu_write_ebeb95: "写名字。:我不写。"
  npc_override_gef_tower_sorcerer_menu_yes_7a0b44: "是的，我可以。:不，我不太擅长。"
  npc_override_gef_tower_sorcerer_menu_yes_c96731: "是的，我是。:不，我不是！"
  npc_override_gef_tower_sorcerer_merito_told_me_visit_you_06ed9e: "梅里托告诉我来找你。"
  npc_override_gef_tower_sorcerer_more_people_visiting_gef_1ce983: "最近越来越多的人来参观吉芬塔。"
  npc_override_gef_tower_sorcerer_moreover_i_formally_ackn_06a2a9: "此外，我正式确认你已经完成了术士学院的所有转职测试。"
  npc_override_gef_tower_sorcerer_msg_79ef7f: "...."
  npc_override_gef_tower_sorcerer_nd_floor_kunlun_dungeon_022b84: "4. 昆仑地牢2层"
  npc_override_gef_tower_sorcerer_oh_i_see_bb3c05: "哦，我明白了。"
  npc_override_gef_tower_sorcerer_oh_my_afc6f5: "哦，我的……"
  npc_override_gef_tower_sorcerer_oh_seems_you_re_too_f02e78: "哦，你好像太重了。清空你的背包然后再来。"
  npc_override_gef_tower_sorcerer_oh_there_must_some_mista_a065e3: "哦，名单上一定有错误。你能稍后再来吗？"
  npc_override_gef_tower_sorcerer_oh_you_all_materials_e1e3b1: "哦，你已经拥有所有材料了。"
  npc_override_gef_tower_sorcerer_okay_4371ac: "好的。"
  npc_override_gef_tower_sorcerer_okay_should_obvious_3d74e5: "好的，那应该是显而易见的。"
  npc_override_gef_tower_sorcerer_once_you_bring_stones_po_e8841a: "一旦你带石头到探测杆，把它们放入连接在杆上的属性分解机中。探测杆将被激活，你就可以与精灵沟通了。"
  npc_override_gef_tower_sorcerer_originally_my_teacher_ne_92d108: "本来我的老师需要检查术士转职，但在他出去寻找鱼之精灵后，我就再没见过他。所以我自己来检查。"
  npc_override_gef_tower_sorcerer_please_get_sprits_well_y_9e5584: "请与精灵好好相处~你应该~！"
  npc_override_gef_tower_sorcerer_please_unequip_your_ridi_9169ed: "请卸下你的骑乘宠物~"
  npc_override_gef_tower_sorcerer_rd_floor_mjolnir_dead_pi_7cf89c: "3. 米约尔尼尔废矿3层"
  npc_override_gef_tower_sorcerer_reagent_one_spirit_makes_6d071f: "一个精灵制作的试剂不会超过2种，所以如果你要制作3种试剂，我建议你去几个地方转转。"
  npc_override_gef_tower_sorcerer_red_blood_1ae109: "3个鲜红血液。"
  npc_override_gef_tower_sorcerer_right_5ae90d: "对~"
  npc_override_gef_tower_sorcerer_s_easy_thing_get_desired_97377c: "通过与精灵沟通来获得想要的效果可不是一件容易的事。"
  npc_override_gef_tower_sorcerer_s_right_most_distinguish_a76649: "没错。那就是术士最显著的特点。"
  npc_override_gef_tower_sorcerer_so_communicating_spirits_a1c89f: "那么与精灵沟通……"
  npc_override_gef_tower_sorcerer_so_i_need_property_stone_b2e75b: "所以我需要属性石……"
  npc_override_gef_tower_sorcerer_so_people_who_test_usual_cef709: "所以参加这个测试的人通常会带尽可能多的属性石。我告诉你的数量只是最低限度。"
  npc_override_gef_tower_sorcerer_so_reagent_1e7f2e: "那么试剂是……？"
  npc_override_gef_tower_sorcerer_so_s_basic_introduction_af21be: "以上就是基本介绍，所以你只需要决定是否要参加资格测试。"
  npc_override_gef_tower_sorcerer_so_usually_we_perform_ce_7fd07e: "所以，通常我们会向能感觉到精灵的地方进行某种仪式游行。"
  npc_override_gef_tower_sorcerer_so_you_eefcde: "那么，你就是[{0}]。"
  npc_override_gef_tower_sorcerer_so_you_right_b83b80: "那么，你就是[{0}]……对吧？"
  npc_override_gef_tower_sorcerer_sorcerers_use_basic_prin_666f5f: "术士使用这个基本原理，这是术士需要掌握的接触精灵的基本知识。"
  npc_override_gef_tower_sorcerer_sounds_easy_right_8e84a9: "听起来很简单，对吧？"
  npc_override_gef_tower_sorcerer_spirit_combined_property_62cf07: "精灵将属性石组合成一块巨大的属性石。"
  npc_override_gef_tower_sorcerer_st_floor_ice_cave_b1aa60: "1. 冰洞1层"
  npc_override_gef_tower_sorcerer_st_floor_thor_volcano_du_2a16b1: "2. 托尔火山地牢1层"
  npc_override_gef_tower_sorcerer_talk_me_again_second_b7920c: "稍后再和我说话。"
  npc_override_gef_tower_sorcerer_then_i_ll_hand_over_640945: "那么我会把它交给4楼的卡拉卡斯。他会指导你完成测试过程。"
  npc_override_gef_tower_sorcerer_then_i_ll_write_down_d1ac52: "那么我会快速写下我总结的进度。等一下……"
  npc_override_gef_tower_sorcerer_there_anything_i_you_7e1118: "有什么我可以帮你的吗？"
  npc_override_gef_tower_sorcerer_usually_we_cannot_see_sp_b3af0b: "通常我们无法用肉眼看到精灵，但有一种方法可以通过特殊媒介感知精灵的一部分。"
  npc_override_gef_tower_sorcerer_way_get_sorcerer_registr_f07ac5: "获得术士登记证的方法其实很简单。你只需要去找散布在世界各地的每个精灵，然后将它们的力量转化为某种材料的形态。"
  npc_override_gef_tower_sorcerer_we_don_t_know_which_17e8f2: "我们不知道精灵会制作哪种试剂。这取决于精灵的状态。"
  npc_override_gef_tower_sorcerer_we_set_up_detecting_pole_6c75b6: "我们在4个地方设置了探测杆，以便普通人可以与精灵沟通。"
  npc_override_gef_tower_sorcerer_welcome_what_i_help_you_ee16e9: "欢迎。我能帮你什么吗？"
  npc_override_gef_tower_sorcerer_well_done_first_i_organi_3d35dd: "干得好。首先，我会整理灵药，请稍等片刻。"
  npc_override_gef_tower_sorcerer_well_impossible_meet_eve_bb3336: "嗯，不可能独自见到每一个精灵。你需要非常努力地训练自己，才能赋予精灵形态并通过你的眼睛清楚地看到它们。"
  npc_override_gef_tower_sorcerer_well_maybe_some_s_main_578300: "嗯，也许有一些，但那不是主要区别。"
  npc_override_gef_tower_sorcerer_well_okay_see_you_again_7fd7df: "嗯，好的。有机会再见。"
  npc_override_gef_tower_sorcerer_well_s_all_up_you_97a6b8: "嗯，这完全取决于你。你打算怎么做？"
  npc_override_gef_tower_sorcerer_wh_where_you_a79b2d: "你……你从哪里来？"
  npc_override_gef_tower_sorcerer_what_how_dare_you_ded913: "什么！你怎么敢！？！"
  npc_override_gef_tower_sorcerer_what_i_sure_you_wanted_b875cd: "什么？我确定你想成为一名术士的。"
  npc_override_gef_tower_sorcerer_what_if_i_run_out_e2fead: "如果我耗尽了石头怎么办？"
  npc_override_gef_tower_sorcerer_what_made_you_want_sorce_bb145e: "是什么让你想成为一名术士的？"
  npc_override_gef_tower_sorcerer_what_should_i_next_babd62: "我接下来该做什么？"
  npc_override_gef_tower_sorcerer_what_you_doing_here_then_1fb3dc: "那你在这里做什么？出去。现在就出去！"
  npc_override_gef_tower_sorcerer_what_you_don_t_know_d5371b: "什么！？你不知道怎么使用魔法？"
  npc_override_gef_tower_sorcerer_when_people_who_want_sor_e266db: "当想成为术士的人来的时候，我们做的第一件事就是检查他们是否能与精灵沟通。"
  npc_override_gef_tower_sorcerer_when_you_bring_these_bas_d52ddc: "当你带来这些基础物品时，我会引导你进入下一步。"
  npc_override_gef_tower_sorcerer_when_you_bring_these_mat_2f5ec5: "当你带来这些材料时，我会告诉你下一步。"
  npc_override_gef_tower_sorcerer_when_you_succeed_getting_72d1c7: "当你成功获得3种不同的试剂后，你可以回来。"
  npc_override_gef_tower_sorcerer_wind_verdure_6601ae: "3个微风之息。"
  npc_override_gef_tower_sorcerer_wouldn_t_more_comfortabl_317a93: "做个学者不是更舒服吗？术士忙着与精灵沟通，没有太多时间读书……"
  npc_override_gef_tower_sorcerer_wow_you_young_adventurer_eb695d: "哇~你是个年轻的冒险者。我羡慕你。"
  npc_override_gef_tower_sorcerer_wow_your_skill_good_a75654: "哇~你的技能很好。"
  npc_override_gef_tower_sorcerer_yes_you_quick_wits_29bf93: "是的，你很机智！"
  npc_override_gef_tower_sorcerer_you_got_paper_which_way_b341fc: "^000099你得到了一张写有与精灵沟通方法的纸。欲了解更多信息，请打开你的任务窗口^000000。"
  npc_override_gef_tower_sorcerer_you_got_reagent_communic_2b8cfe: "你通过与看不见的精灵沟通获得了一种试剂。"
  npc_override_gef_tower_sorcerer_you_handle_magic_skillfu_9b5d26: "[{0}]，你能熟练地使用魔法吗？"
  npc_override_gef_tower_sorcerer_you_know_about_sorcerers_6aac34: "你了解术士吗？"
  npc_override_gef_tower_sorcerer_you_look_happy_great_jou_9cddc4: "你看起来很高兴。祝你旅途愉快。"
  npc_override_gef_tower_sorcerer_you_must_born_natural_ab_527324: "你一定是天生就有看到精灵的能力，或者你已经与精灵沟通过了，要么你就是一个出色的骗子。"
  npc_override_gef_tower_sorcerer_you_must_etiquette_your_aaee79: "在接受新职业之前，你现在必须拥有你职业的礼仪！"
  npc_override_gef_tower_sorcerer_you_need_prepare_least_s_7df685: "你需要为每种属性至少准备3个小石头。例如，你需要微风之息，而不是粗糙之风。"
  npc_override_gef_tower_sorcerer_you_packed_so_much_your_b0bd5c: "你的背包装得太满了。清空背包后再试一次。"
  npc_override_gef_tower_sorcerer_you_used_property_stones_ccd92b: "你使用了属性石，但看起来你未能与精灵沟通。"
  npc_override_gef_tower_sorcerer_you_went_around_rough_wi_8341d1: "你穿越了荒野，以术士的身份打开了大门，并通过了我们学院给出的所有要求。"
  npc_override_gef_tower_sorcerer_z_z_z_520841: "…… (Z z z~)"
  npc_override_gef_tower_wizard_skills_about_dog_maria_44b0fc: "关于它，那只叫玛丽亚的狗"
  npc_override_gef_tower_wizard_skills_about_push_backs_skills_92595f: "关于技能中的击退……"
