Body:

  npc_override_bat_a01_tierra01_battle_station_23a95b: "战斗就位"
  npc_override_bat_a01_tierra01_boo_boo_bd799b: "呜……呜……"
  npc_override_bat_a01_tierra01_bye_e17e76: "再见。"
  npc_override_bat_a01_tierra01_cancelled_d3e414: "已取消。"
  npc_override_bat_a01_tierra01_combine_stones_gold_prop_007617: "将石头和黄金按适当的比例混合，塑成路障，然后加入粗糙的铝原石使其更坚固。现在用金属碎片装饰。"
  npc_override_bat_a01_tierra01_combine_stones_gold_prop_023bd2: "将石头和黄金按适当的比例混合。"
  npc_override_bat_a01_tierra01_combine_stones_gold_prop_203605: "将石头和黄金按适当的比例混合，塑成路障，然后加入粗糙的铝原石使其更坚固。用金属碎片装饰，再用熊的筋腱将石头编织起来！"
  npc_override_bat_a01_tierra01_combine_stones_gold_prop_865346: "将石头和黄金按适当的比例混合，塑成路障，然后加入粗糙的铝原石使其更坚固。"
  npc_override_bat_a01_tierra01_combine_stones_gold_prop_9d6f95: "将石头和黄金按适当的比例混合，塑成路障。"
  npc_override_bat_a01_tierra01_croix_captured_neutralit_d5c79f: "克鲁瓦占领了一面中立旗帜，因此他们获得了优势。"
  npc_override_bat_a01_tierra01_guillaume_captured_neutr_bfd2f8: "吉约姆占领了一面中立旗帜，因此他们获得了优势。"
  npc_override_bat_a01_tierra01_just_close_your_eyes_81005b: "只要闭上眼睛，"
  npc_override_bat_a01_tierra01_loading_b04ba4: "加载中……"
  npc_override_bat_a01_tierra01_may_i_help_you_5a540b: "有什么可以帮您的吗？"
  npc_override_bat_a01_tierra01_menu_axl_5e8d50: "阿克斯·罗斯，斯旺德里:是的长官。"
  npc_override_bat_a01_tierra01_menu_croix_4d709c: "克鲁瓦·温特纳·斯旺德里:瓦尔哈拉之主！请赐予我们坚定的信念和勇气！"
  npc_override_bat_a01_tierra01_menu_croix_9f53ad: "克鲁瓦·温特纳·斯旺德里:山谷中的路障已被摧毁！铁匠在哪？我们需要重建路障！"
  npc_override_bat_a01_tierra01_menu_croix_fce98d: "克鲁瓦·温特纳·斯旺德里:我们摧毁了吉约姆的粮仓。我们赢了！哇！"
  npc_override_bat_a01_tierra01_menu_guillaume_427da5: "吉约姆·温特纳·阿克斯·罗斯:我们进攻，烧毁克鲁瓦的粮仓吧！"
  npc_override_bat_a01_tierra01_menu_guillaume_6ff255: "吉约姆·温特纳·阿克斯·罗斯:山谷中的路障已被摧毁！铁匠在哪？我们需要重建路障！"
  npc_override_bat_a01_tierra01_menu_guillaume_90914e: "吉约姆·温特纳·阿克斯·罗斯:我们摧毁了克鲁瓦的粮仓。我们赢了！哇！"
  npc_override_bat_a01_tierra01_menu_marollo_205c53: "马罗洛七世:吉约姆·马罗洛，克鲁瓦·马罗洛！马罗洛的追随者们！"
  npc_override_bat_a01_tierra01_menu_marollo_2290ed: "马罗洛七世:我想我们最好终止战斗，以平局告终。"
  npc_override_bat_a01_tierra01_menu_marollo_a62b78: "马罗洛七世:双方阵营都很有竞争力，所以任何一方都不会轻易被摧毁。这意味着马罗洛王国永远不会被击败！"
  npc_override_bat_a01_tierra01_menu_marollo_fb164a: "马罗洛七世:暂时放下你们的王权和信仰，让我们来解决蒂耶拉峡谷的战斗吧。"
  npc_override_bat_a01_tierra01_menu_release_d63594: "全部释放。:取消。"
  npc_override_bat_a01_tierra01_menu_repair_13d7c7: "修复。:不管它。"
  npc_override_bat_a01_tierra01_msg_00d9a9: "…………"
  npc_override_bat_a01_tierra01_msg_679509: "………"
  npc_override_bat_a01_tierra01_msg_79ef7f: "……"
  npc_override_bat_a01_tierra01_msg_93fcbf: "……"
  npc_override_bat_a01_tierra01_msg_9d891e: "…"
  npc_override_bat_a01_tierra01_msg_a7981c: "………………"
  npc_override_bat_a01_tierra01_msg_f0e1ca: "……"
  npc_override_bat_a01_tierra01_take_deep_breath_48d63b: "深吸一口气。"
  npc_override_bat_a01_tierra01_there_enemies_coming_let_3ce953: "有敌人来了！我们快从这里撤离！"
  npc_override_bat_a01_tierra01_there_enemy_coming_82e1e0: "敌人来了！"
  npc_override_bat_a01_tierra01_there_enemy_coming_9f8063: "敌人来了！"
  npc_override_bat_a01_tierra01_we_all_except_stones_a578d1: "除了50块石头之外，我们都有了！"
  npc_override_bat_a01_tierra01_we_busy_so_please_hurry_41633c: "我们很忙，请快点。"
  npc_override_bat_a01_tierra01_we_need_stone_1adb29: "^3131FF我们需要50块石头。^000000"
  npc_override_bat_a01_tierra01_we_need_stones_8ddf0f: "^3131FF我们需要50块石头。^000000"
  npc_override_bat_a01_tierra01_we_relieved_46ffdf: "我们松了一口气。"
  npc_override_bat_a01_tierra01_we_repair_barricade_ston_7faa51: "我们可以用^3131FF50块石头、3根熊的筋腱、500个金属碎片、30个粗糙的铝原石和100个黄金^000000来修复路障。"
  npc_override_bat_a01_tierra01_we_urgency_barricade_bee_5cee47: "情况紧急！路障已被摧毁！"
  npc_override_bat_a01_tierra01_wow_s_done_43adab: "哇！完成了。"
  npc_override_bat_a01_tierra01_you_brought_enough_stone_91fe48: "你带来了足够的石头！我们去修复吧。"
  npc_override_bat_a01_tierra01_you_don_t_enough_stones_3b5327: "你的石头不够！"
  npc_override_bat_a01_tierra01_you_free_pain_954ca5: "你就能从痛苦中解脱了。"
