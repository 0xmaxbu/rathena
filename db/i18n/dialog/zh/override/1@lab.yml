Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@lab_CentralLaboratory_after_entering_code_pres_842681: "输入代码后，按下入口附近的主按钮。"
  npc_override_1@lab_CentralLaboratory_after_experiment_i_want_4becdb: "实验结束后，我想回家享受冰啤酒和炸鸡。"
  npc_override_1@lab_CentralLaboratory_ah_i_just_talking_such_8c8ef2: "啊，我只是在说说而已。这样的事件与其说是实验，不如说是灾难哈哈。"
  npc_override_1@lab_CentralLaboratory_ah_oh_no_db3667: "啊，哦不。"
  npc_override_1@lab_CentralLaboratory_ah_you_aren_t_party_5d8db9: "啊。你不是队伍领袖。带我去见你们的领袖！或者把你们的领袖带到我这里来。"
  npc_override_1@lab_CentralLaboratory_all_handled_well_bb5460: "一切处理妥当！"
  npc_override_1@lab_CentralLaboratory_all_traces_entering_cent_a49159: "^0000ff所有进入中央实验室的痕迹已被清除。似乎可以与文明探索者对话。^000000"
  npc_override_1@lab_CentralLaboratory_any_chance_you_intereste_5d6f1c: "顺便问一下，你有兴趣穿越到过去吗？"
  npc_override_1@lab_CentralLaboratory_artemia_worries_too_much_962b5f: "阿泰米亚太担心了。不管怎样，实验结束后我要去旅行。"
  npc_override_1@lab_CentralLaboratory_cancel_77dfd2: "取消"
  npc_override_1@lab_CentralLaboratory_central_laboratory_unkno_d4634f: "^0000ff中央实验室^000000 - 未知错误"
  npc_override_1@lab_CentralLaboratory_code_correct_opening_doo_d64287: "密码正确。正在开门。"
  npc_override_1@lab_CentralLaboratory_code_incorrect_please_tr_a03f86: "密码不正确。请再试一次。"
  npc_override_1@lab_CentralLaboratory_code_needs_entered_as_bi_e4f59e: "密码需要以二进制数字输入。使用我身后的开关来输入。"
  npc_override_1@lab_CentralLaboratory_device_more_amazing_more_eefd5d: "这个设备越看越令人惊叹。从未有过如此规模的粒子加速器。"
  npc_override_1@lab_CentralLaboratory_dimensional_distortion_h_2035d6: "如此强大的粒子加速可能会导致次元扭曲。"
  npc_override_1@lab_CentralLaboratory_door_already_open_510126: "门已经打开了。"
  npc_override_1@lab_CentralLaboratory_door_open_so_you_may_ff71c6: "门已经打开，你现在可以进入了。请注意，你无法从另一侧打开门。"
  npc_override_1@lab_CentralLaboratory_entrance_door_already_op_990e49: "入口门已经打开。"
  npc_override_1@lab_CentralLaboratory_even_better_if_you_show_937a7a: "如果你发现有趣的物品给我看看就更好了。"
  npc_override_1@lab_CentralLaboratory_how_i_assist_you_cc894b: "我能如何帮助你？"
  npc_override_1@lab_CentralLaboratory_i_bad_feeling_about_beca_30a0a5: "我对此有种不好的预感，因为……自然总会找到出路。"
  npc_override_1@lab_CentralLaboratory_i_haven_t_been_home_d38fe1: "我已经快2年没回家了。"
  npc_override_1@lab_CentralLaboratory_if_i_had_my_way_c1f7a8: "如果我能做主，我会用次元移动装置亲自去看看，但工作太多了。而且我不是冒险者……"
  npc_override_1@lab_CentralLaboratory_interested_5ee0b1: "不感兴趣。"
  npc_override_1@lab_CentralLaboratory_interesting_there_been_a_27e0ee: "有意思。有什么成果吗？"
  npc_override_1@lab_CentralLaboratory_look_reality_doesn_t_lik_7b1640: "听着，现实不喜欢你抓住一根弦然后拽一下。"
  npc_override_1@lab_CentralLaboratory_lot_undefined_terms_foun_6e8d00: "在 recovered 的记录中也发现了许多未定义的术语。"
  npc_override_1@lab_CentralLaboratory_machine_perfect_nothing_20f016: "机器是完美的。不会出任何问题！"
  npc_override_1@lab_CentralLaboratory_many_excavated_objects_h_02c6d6: "但这里许多出土的物品已经远远超越了我们当前的技术。"
  npc_override_1@lab_CentralLaboratory_menu_alarm_24e4af: "警报系统:重复。粒子实验室发布1级警报。所有研究人员撤离至掩体。"
  npc_override_1@lab_CentralLaboratory_menu_alarm_ae4061: "警报系统:警报！警报！粒子实验室发布1级警报。所有研究人员撤离至掩体。"
  npc_override_1@lab_CentralLaboratory_menu_artemia_2efb34: "阿泰米亚:什……那是什么？！"
  npc_override_1@lab_CentralLaboratory_menu_artemia_383c14: "阿泰米亚:在进行新材料生产的次元移动时，卷入了不同层次的实验。"
  npc_override_1@lab_CentralLaboratory_menu_artemia_543873: "阿泰米亚:呼……结束了吗？"
  npc_override_1@lab_CentralLaboratory_menu_artemia_68d255: "阿泰米亚:MA-4885！！谁下令你重启的！停止！！"
  npc_override_1@lab_CentralLaboratory_menu_artemia_7f133e: "阿泰米亚:可能在做最终确认检查。如此规模的实验需要这样的谨慎。"
  npc_override_1@lab_CentralLaboratory_menu_artemia_8dfa69: "阿泰米亚:弗雷萨博士！！我们必须停止！这太危险了！"
  npc_override_1@lab_CentralLaboratory_menu_artemia_9b8299: "阿泰米亚:哈……谁去吃鸡肉呢？"
  npc_override_1@lab_CentralLaboratory_menu_artemia_ab45ce: "阿泰米亚:正在联系催化剂床1号。"
  npc_override_1@lab_CentralLaboratory_menu_artemia_b801f3: "阿泰米亚:让我们开始吧~"
  npc_override_1@lab_CentralLaboratory_menu_artemia_c2a83d: "阿泰米亚:但至少……我稍后会有鸡肉吃。"
  npc_override_1@lab_CentralLaboratory_menu_artemia_cbb6bf: "阿泰米亚:弗雷萨博士！母电脑处于危险状态。关闭主电源！"
  npc_override_1@lab_CentralLaboratory_menu_artemia_cc920a: "阿泰米亚:似乎结束了。"
  npc_override_1@lab_CentralLaboratory_menu_artemia_d19f1a: "阿泰米亚:弗雷萨博士！！这个荒谬的事件与我们原来的实验完全无关！"
  npc_override_1@lab_CentralLaboratory_menu_artemia_e5d3a5: "阿泰米亚:啊……我真的不喜欢这个实验。"
  npc_override_1@lab_CentralLaboratory_menu_artemia_ec25d6: "阿泰米亚:那团疯狂的金属在说什么？它说我们不和那些怪物一样处于同一相位？"
  npc_override_1@lab_CentralLaboratory_menu_federico_05f331: "弗雷德里科:工厂初始化是最好的。"
  npc_override_1@lab_CentralLaboratory_menu_federico_06aed4: "弗雷德里科:让我们开始吧。嗯……你准备好了吗弗雷萨博士？"
  npc_override_1@lab_CentralLaboratory_menu_federico_4ee3fb: "弗雷德里科:啊，我想我们应该希望母电脑不要做正确的计算。"
  npc_override_1@lab_CentralLaboratory_menu_federico_5f6b93: "弗雷德里科:母电脑正在进行一个超越我们想象的巨大实验。"
  npc_override_1@lab_CentralLaboratory_menu_federico_60076f: "弗雷德里科:该死！有别的东西来了！！"
  npc_override_1@lab_CentralLaboratory_menu_federico_65e392: "弗雷德里科:我以为是弗雷萨的教条式实验。但问题是出在母电脑上。"
  npc_override_1@lab_CentralLaboratory_menu_federico_89cd22: "弗雷德里科:发电机转速固定在10000转/分钟。"
  npc_override_1@lab_CentralLaboratory_menu_federico_98fc31: "弗雷德里科:这就是次元移动的感觉吗。好奇怪……"
  npc_override_1@lab_CentralLaboratory_menu_federico_b06d99: "弗雷德里科:她来了。"
  npc_override_1@lab_CentralLaboratory_menu_federico_b4974b: "弗雷德里科:什么？这不是初始化阶段吗？"
  npc_override_1@lab_CentralLaboratory_menu_federico_fa714d: "弗雷德里科:啊……我的身体……动不了。该死"
  npc_override_1@lab_CentralLaboratory_menu_leader_4d6811: "领袖:{0}"
  npc_override_1@lab_CentralLaboratory_menu_lona_075c71: "洛娜·弗雷萨:但是……你。"
  npc_override_1@lab_CentralLaboratory_menu_lona_1c6e38: "洛娜·弗雷萨:这个问题被预测到了。保持当前状态。"
  npc_override_1@lab_CentralLaboratory_menu_lona_3683f8: "洛娜·弗雷萨:母电脑MA-4885。我是你的首席主管弗雷萨博士。停止当前进度。"
  npc_override_1@lab_CentralLaboratory_menu_lona_53f1c5: "洛娜·弗雷萨:……"
  npc_override_1@lab_CentralLaboratory_menu_lona_5cf677: "洛娜·弗雷萨:当前时间11点20分。暂时推迟实验。"
  npc_override_1@lab_CentralLaboratory_menu_lona_60d29d: "洛娜·弗雷萨:在开放空间中测试粒子加速对其周围环境的影响。"
  npc_override_1@lab_CentralLaboratory_menu_lona_65278f: "洛娜·弗雷萨:已完成母电脑MA-4885的关闭。确认设备暂停。"
  npc_override_1@lab_CentralLaboratory_menu_lona_6e61cf: "洛娜·弗雷萨:没关系。"
  npc_override_1@lab_CentralLaboratory_menu_lona_7c3679: "洛娜·弗雷萨:这个实验是为了创造一种前所未有的新材料。"
  npc_override_1@lab_CentralLaboratory_menu_lona_840be5: "洛娜·弗雷萨:大家干得好。"
  npc_override_1@lab_CentralLaboratory_menu_lona_8904e0: "洛娜·弗雷萨:当前时间{0}月{1}日10点25分。"
  npc_override_1@lab_CentralLaboratory_menu_lona_894a75: "洛娜·弗雷萨:以母电脑故障和加速器过热为由结束记录。"
  npc_override_1@lab_CentralLaboratory_menu_lona_8dbff8: "洛娜·弗雷萨:开始实验。首席研究员弗雷德里科、阿泰米亚、西尔维娅、文森特及助理研究员。"
  npc_override_1@lab_CentralLaboratory_menu_lona_8dd5ab: "洛娜·弗雷萨:我已完全意识到这一点。"
  npc_override_1@lab_CentralLaboratory_menu_lona_954b42: "洛娜·弗雷萨:母电脑MA-4885。看起来你正在试图同步另一个次元与这个世界。"
  npc_override_1@lab_CentralLaboratory_menu_lona_a7d92e: "洛娜·弗雷萨:切断母电脑MA-4885的电源。"
  npc_override_1@lab_CentralLaboratory_menu_lona_ad7675: "洛娜·弗雷萨:最终实验失败是不幸的。但我保证下次会有更完美的实验。"
  npc_override_1@lab_CentralLaboratory_menu_lona_bfd176: "洛娜·弗雷萨:记录员务必详细记录催化剂床安装到加速器时的反应。"
  npc_override_1@lab_CentralLaboratory_menu_lona_c5e2ab: "洛娜·弗雷萨:记录所有实验进度并在当前点终止。"
  npc_override_1@lab_CentralLaboratory_menu_lona_fd95da: "洛娜·弗雷萨:{0}月{1}日。当前时间11点38分，暂时终止粒子加速器项目。"
  npc_override_1@lab_CentralLaboratory_menu_ma_07f798: "MA-4885:由于网关的不稳定性，无法保证会遇到什么样的次元……"
  npc_override_1@lab_CentralLaboratory_menu_ma_0e6228: "MA-4885:代号 - 降临"
  npc_override_1@lab_CentralLaboratory_menu_ma_0f3c56: "MA-4885:未识别生物已消灭。相位调整失败。重启相关程序。"
  npc_override_1@lab_CentralLaboratory_menu_ma_11cd49: "MA-4885:重启粒子加速程序。"
  npc_override_1@lab_CentralLaboratory_menu_ma_27ae6d: "MA-4885:通过主服务器接收已改变的情况。检测到粒子加速器与催化剂之间的次元扭曲。"
  npc_override_1@lab_CentralLaboratory_menu_ma_2b1e9e: "MA-4885:无法识别的命令。"
  npc_override_1@lab_CentralLaboratory_menu_ma_2d7cae: "MA-4885:次元移动进度78%。大部分次元被半位面侵蚀。"
  npc_override_1@lab_CentralLaboratory_menu_ma_30a06d: "MA-4885:剩余2秒"
  npc_override_1@lab_CentralLaboratory_menu_ma_38266b: "MA-4885:未识别生物已消灭。重启设备。"
  npc_override_1@lab_CentralLaboratory_menu_ma_43bf04: "MA-4885:访问被拒绝。无法理解命令。"
  npc_override_1@lab_CentralLaboratory_menu_ma_45f6ac: "MA-4885:……命令…… ----!!!  滋滋… ---!! -- 正在执行命令 ----- !! 滋滋。"
  npc_override_1@lab_CentralLaboratory_menu_ma_65a996: "MA-4885:次元移动100%完成。欢迎来到半位面次元。"
  npc_override_1@lab_CentralLaboratory_menu_ma_6fc7ab: "MA-4885:警报。新的未识别生物正从半位面接近。"
  npc_override_1@lab_CentralLaboratory_menu_ma_749c61: "MA-4885:剩余1秒"
  npc_override_1@lab_CentralLaboratory_menu_ma_769f1a: "MA-4885:剩余5秒"
  npc_override_1@lab_CentralLaboratory_menu_ma_88215f: "MA-4885:根据管理员请求暂停所有设备运行。"
  npc_override_1@lab_CentralLaboratory_menu_ma_91a72b: "MA-4885:正确。"
  npc_override_1@lab_CentralLaboratory_menu_ma_940d3e: "MA-4885:最终相位转换过程。"
  npc_override_1@lab_CentralLaboratory_menu_ma_a36f0d: "MA-4885:剩余4秒"
  npc_override_1@lab_CentralLaboratory_menu_ma_a72979: "MA-4885:开始最终相位转换。"
  npc_override_1@lab_CentralLaboratory_menu_ma_a96212: "MA-4885:正在进行恢复扭曲相位平衡的计算。请稍等。"
  npc_override_1@lab_CentralLaboratory_menu_ma_ab27b8: "MA-4885:剩余1秒"
  npc_override_1@lab_CentralLaboratory_menu_ma_b0e17d: "MA-4885:半位面生物与这个世界的生物在相位平衡后将能够直接互动。"
  npc_override_1@lab_CentralLaboratory_menu_ma_b81deb: "MA-4885:在生物被消灭之前已完成相位同步。开始次元旅行。"
  npc_override_1@lab_CentralLaboratory_menu_ma_ba4fd2: "MA-4885:在实验室3点钟方向打开了可与半位面接触的网关。"
  npc_override_1@lab_CentralLaboratory_menu_ma_bb4294: "MA-4885:剩余3秒"
  npc_override_1@lab_CentralLaboratory_menu_ma_c6649a: "MA-4885:次元移动进度20%。可能与某些生物发生次元干扰。请注意。"
  npc_override_1@lab_CentralLaboratory_menu_ma_c79745: "MA-4885:一种新的生物即将从半位面传送过来。"
  npc_override_1@lab_CentralLaboratory_menu_ma_cd2e0f: "MA-4885:回答问题。此空间目前卡在扭曲的相位中。"
  npc_override_1@lab_CentralLaboratory_menu_ma_d9e619: "MA-4885:与生物的相位干扰现象消退后，这个世界将被召唤到半位面。"
  npc_override_1@lab_CentralLaboratory_menu_ma_eecbcb: "MA-4885:暂时关闭主电源以与转换后的相位同步。"
  npc_override_1@lab_CentralLaboratory_menu_ma_f0bb1b: "MA-4885:如果有任何存活的生物，祝你们好运。希望能再次见到你们。"
  npc_override_1@lab_CentralLaboratory_menu_ma_f69516: "MA-4885:发现无法识别的生物。暂时关闭主电源。"
  npc_override_1@lab_CentralLaboratory_menu_options_de2fc5: "？？？？:啊，啊，一二一二，麦克风测试。"
  npc_override_1@lab_CentralLaboratory_menu_options_ebffda: "？？？？:粒子加速器项目首席主管洛娜·弗雷萨。"
  npc_override_1@lab_CentralLaboratory_menu_party_328f2e: "队伍:{0}"
  npc_override_1@lab_CentralLaboratory_menu_probationary_06bb5b: "实习研究员:你现在可以进入了。请注意，你无法从另一侧打开门。"
  npc_override_1@lab_CentralLaboratory_menu_probationary_f2ca31: "实习研究员:访问代码匹配。我将打开门。"
  npc_override_1@lab_CentralLaboratory_menu_silvia_05f307: "西尔维娅:一切都结束了。"
  npc_override_1@lab_CentralLaboratory_menu_silvia_223589: "西尔维娅:弗雷萨！做个决定！"
  npc_override_1@lab_CentralLaboratory_menu_silvia_33f55d: "西尔维娅:好的！现在弗雷萨博士只需要关闭电源。"
  npc_override_1@lab_CentralLaboratory_menu_silvia_542e6e: "西尔维娅:看起来结束了。"
  npc_override_1@lab_CentralLaboratory_menu_silvia_5fac09: "西尔维娅:发电机电压不稳定。仍在容差范围内。"
  npc_override_1@lab_CentralLaboratory_menu_silvia_682b04: "西尔维娅:首次实验操作成品需要小心。"
  npc_override_1@lab_CentralLaboratory_menu_silvia_90b0f4: "西尔维娅:我们不能完全关闭主电源吗？"
  npc_override_1@lab_CentralLaboratory_menu_silvia_916952: "西尔维娅:哎呀，我不知道会发生什么，但我对次元转移很好奇！别介意我！"
  npc_override_1@lab_CentralLaboratory_menu_silvia_aed09c: "西尔维娅:啊……我应该边吃鸡肉边喝啤酒边看这个……"
  npc_override_1@lab_CentralLaboratory_menu_silvia_bedb98: "西尔维娅:这不是一个简单的问题。温度已经远远超过了预测数字！"
  npc_override_1@lab_CentralLaboratory_menu_silvia_c7486c: "西尔维娅:电压仍在容差范围内。"
  npc_override_1@lab_CentralLaboratory_menu_silvia_cd45ca: "西尔维娅:和上次一样。它似乎对我们没有兴趣。"
  npc_override_1@lab_CentralLaboratory_menu_silvia_d41b1d: "西尔维娅:让我们冷静下来。然后离开这个可怕的实验室。"
  npc_override_1@lab_CentralLaboratory_menu_silvia_dec84f: "西尔维娅:它没有对我们做出反应。也许它看不到我们？"
  npc_override_1@lab_CentralLaboratory_menu_silvia_e415e2: "西尔维娅:啊！我也喜欢那个！你去的时候叫我。"
  npc_override_1@lab_CentralLaboratory_menu_silvia_ef37ca: "西尔维娅:检测到催化剂床与加速器之间的热量接近容差范围！"
  npc_override_1@lab_CentralLaboratory_menu_vincent_26f384: "文森特:加速器正在发热。"
  npc_override_1@lab_CentralLaboratory_menu_vincent_608149: "文森特:我们至少应该疏散其他实验室的人。"
  npc_override_1@lab_CentralLaboratory_menu_vincent_73e7e9: "文森特:看起来比我们更宽宏大量。弗雷萨！！你在听吗？拉响警报！"
  npc_override_1@lab_CentralLaboratory_menu_vincent_882ca8: "文森特:670度！升温太快了！"
  npc_override_1@lab_CentralLaboratory_menu_vincent_932679: "文森特:怎么回事。谁把那个电脑关掉！"
  npc_override_1@lab_CentralLaboratory_menu_vincent_9d3cbb: "文森特:哦……该死。这就是你不应该安装最新CPU的原因。"
  npc_override_1@lab_CentralLaboratory_menu_vincent_a12d20: "文森特:320度。"
  npc_override_1@lab_CentralLaboratory_menu_vincent_b2a7b5: "文森特:但它对项目助理有敌意！那是什么生物！？"
