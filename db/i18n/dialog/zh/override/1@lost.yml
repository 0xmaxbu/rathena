Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@lost_LostFarm_absorbs_moisture_air_pho_d4bf4c: "它从空气中吸收水分并进行光合作用，即使没有根也能做到。"
  npc_override_1@lost_LostFarm_according_luina_s_instru_2aa164: "根据路易娜的指示，现在剩下的是……"
  npc_override_1@lost_LostFarm_after_processing_harvest_450e4f: "加工后，收获的火龙果尾会端上餐桌。"
  npc_override_1@lost_LostFarm_again_don_t_worry_about_12206b: "再说一次，不用担心我的位置……"
  npc_override_1@lost_LostFarm_all_thanks_your_help_tha_d9692f: "这都是多亏了你……非常感谢。"
  npc_override_1@lost_LostFarm_am_i_angry_guest_no_eca1cc: "我在生气吗？对客人？没有……"
  npc_override_1@lost_LostFarm_anyway_help_me_next_harv_98ba58: "总之，帮我收割下一批！嘿，伙计们~开饭了~~"
  npc_override_1@lost_LostFarm_as_expected_joy_comes_pr_9ed1e6: "果然……快乐是有代价的。"
  npc_override_1@lost_LostFarm_as_expected_you_talent_i_93057b: "果然，你有这方面的天赋！我没看错！"
  npc_override_1@lost_LostFarm_automatic_doll_i_angry_h_f7ebd5: "自动人偶……我可以生气吗？……嗯……"
  npc_override_1@lost_LostFarm_automatic_doll_make_joke_c59cee: "自动人偶会开玩笑吗？哦，你挺会开玩笑的。我一直都是认真的。"
  npc_override_1@lost_LostFarm_big_meow_taking_nap_17436b: "-- 大喵正在打盹。 --"
  npc_override_1@lost_LostFarm_bite_well_9fbdd9: "……会好好咬人的……？"
  npc_override_1@lost_LostFarm_boss_kitty_3d9183: "首领小猫？"
  npc_override_1@lost_LostFarm_boss_meow_8d1aaa: "首领喵？"
  npc_override_1@lost_LostFarm_boss_meow_a2920a: "首领喵……！"
  npc_override_1@lost_LostFarm_breathing_normal_eyes_st_2f731e: "呼吸正常。眼睛稳定度正常。"
  npc_override_1@lost_LostFarm_cat_cried_high_pitch_sou_c65858: "- 猫发出尖锐的叫声，好像很兴奋。 -"
  npc_override_1@lost_LostFarm_cat_hid_behind_luina_bef_95f701: "-- 在路易娜到达之前，猫躲到了她身后。 --"
  npc_override_1@lost_LostFarm_cats_bite_you_f9ef92: "'猫'会咬你吗？"
  npc_override_1@lost_LostFarm_checking_registration_in_7ed077: "正在检查登记信息……"
  npc_override_1@lost_LostFarm_cluck_ae6dd1: "咯咯……！"
  npc_override_1@lost_LostFarm_cluck_ccd0c0: "咯咯。"
  npc_override_1@lost_LostFarm_come_out_now_273ced: "先出来吧。"
  npc_override_1@lost_LostFarm_come_way_cece24: "……往这边来。"
  npc_override_1@lost_LostFarm_croak_118a60: "*呱呱*"
  npc_override_1@lost_LostFarm_dear_guest_dfccf5: "亲爱的客人……"
  npc_override_1@lost_LostFarm_deep_breaths_deep_breath_372b25: "深呼吸……深呼吸……"
  npc_override_1@lost_LostFarm_did_you_come_see_farming_cd1800: "你是来看农业设施的吗？"
  npc_override_1@lost_LostFarm_did_you_fun_b7cab0: "你玩得开心吗？"
  npc_override_1@lost_LostFarm_did_younglings_came_play_122c8a: "小家伙们来找你玩了吗？"
  npc_override_1@lost_LostFarm_doll_looked_me_up_down_5541f8: "- 人偶上下打量了我，好像很满意的样子。 -"
  npc_override_1@lost_LostFarm_doll_looked_me_up_down_d38423: "- 人偶上下打量了我，然后转过头去。 -"
  npc_override_1@lost_LostFarm_don_t_mind_my_location_0736e8: "不要在意我的位置……"
  npc_override_1@lost_LostFarm_eeek_save_me_f72bc4: "咿……救救我！"
  npc_override_1@lost_LostFarm_ehem_64588f: "嗯哼。"
  npc_override_1@lost_LostFarm_enjoy_s_cuteness_i_m_189382: "为了享受它的可爱，我已经准备好献上我的胳膊和腿……！"
  npc_override_1@lost_LostFarm_enjoy_s_cuteness_i_m_762ce0: "为了享受它的可爱，我不仅准备好献上我的胳膊和腿，还有我的同事们……！"
  npc_override_1@lost_LostFarm_even_if_s_right_come_789ba7: "即使过来玩是对的，但至少别跟我玩。"
  npc_override_1@lost_LostFarm_facility_as_you_see_conv_28c3e4: "这个设施……如你所见，是我们有鳞朋友的便利繁殖场。"
  npc_override_1@lost_LostFarm_farming_facility_where_k_6d987f: "这是农业设施，小猫和其他家伙们住在这里。"
  npc_override_1@lost_LostFarm_faster_hold_play_just_li_c03a9e: "但与其抚摸5分钟，不如像之前那样抱着它玩会更快。"
  npc_override_1@lost_LostFarm_feed_hug_five_minutes_ea_2171ec: "喂食和拥抱各五分钟？它们一直龇牙咧嘴的，我怎么抚摸它们？"
  npc_override_1@lost_LostFarm_go_out_0a8067: "出去。"
  npc_override_1@lost_LostFarm_growl_e3eca5: "*咆哮*"
  npc_override_1@lost_LostFarm_guest_huh_3c9b72: "客人……哼……"
  npc_override_1@lost_LostFarm_haa_haa_i_so_scared_e60b79: "哈、哈……我太害怕了……"
  npc_override_1@lost_LostFarm_harvested_tail_necessari_9c7d23: "收获的尾巴不一定够吃。"
  npc_override_1@lost_LostFarm_harvesting_actually_bit_0a1971: "收割其实有点困难，所以我的同事'丝绸'会指导你。"
  npc_override_1@lost_LostFarm_heart_rate_blood_pressur_c26544: "心率、血压和体温全部正常。"
  npc_override_1@lost_LostFarm_hello_c8e1e0: "你好，{0}？"
  npc_override_1@lost_LostFarm_hello_d949c6: "你好，{0}。"
  npc_override_1@lost_LostFarm_here_s_token_promise_e6c420: "给……这是约定的信物。"
  npc_override_1@lost_LostFarm_hey_guys_s_time_bars_f5e5ee: "嘿……伙计们，该吃bars和米饭了~"
  npc_override_1@lost_LostFarm_hmm_9c4d28: "嗯……"
  npc_override_1@lost_LostFarm_hold_while_i_ll_process_a5ca3e: "稍等。我正在处理说明。"
  npc_override_1@lost_LostFarm_how_about_dear_guest_e6639d: "怎么样……亲爱的客人？"
  npc_override_1@lost_LostFarm_huh_6ed1eb: "哼。"
  npc_override_1@lost_LostFarm_i_am_charge_farm_facilit_fe8e1c: "我负责这里的农场设施。"
  npc_override_1@lost_LostFarm_i_did_great_job_sob_3871be: "我做得很好……*抽泣*"
  npc_override_1@lost_LostFarm_i_don_t_know_if_5c3247: "不知道这算不算奇怪，但我不是火龙果，不过我很擅长倾听。"
  npc_override_1@lost_LostFarm_i_don_t_want_afraid_379250: "……我不想害怕。"
  npc_override_1@lost_LostFarm_i_explain_everything_you_f2d36e: "我会向你解释一切。"
  npc_override_1@lost_LostFarm_i_fix_plants_give_fertil_cce916: "我修理植物，给它们施肥，还喂这里的小猫和他的朋友们。"
  npc_override_1@lost_LostFarm_i_guess_fb9b24: "我想是吧。"
  npc_override_1@lost_LostFarm_i_heard_s_pleasant_peopl_663ce0: "我听说这对人来说不太舒服，呼吸怎么样？"
  npc_override_1@lost_LostFarm_i_just_call_him_he_487160: "我只是这么叫他，他和其他有点不同，它藏在难以看见的地方。"
  npc_override_1@lost_LostFarm_i_know_s_little_hard_81d058: "我知道这对你来说有点难，但……如果你帮我们一把，我们会适当补偿你的。"
  npc_override_1@lost_LostFarm_i_ll_prepare_food_today_efa451: "我来准备今天的食物。"
  npc_override_1@lost_LostFarm_i_ll_take_care_please_9b2aa3: "我会处理那个的，拜托了。"
  npc_override_1@lost_LostFarm_i_ll_talk_leader_guests_96aca7: "我会跟客人的领袖谈的！"
  npc_override_1@lost_LostFarm_i_ll_wait_you_so_b98a76: "我会等你的，所以你想出去的时候告诉我~"
  npc_override_1@lost_LostFarm_i_m_one_charge_harvest_d3e929: "我负责收割，所以随时跟我谈！"
  npc_override_1@lost_LostFarm_i_m_worried_92bf5c: "我很担心……"
  npc_override_1@lost_LostFarm_i_now_courage_again_go_830e67: "^0000FF我现在又有勇气再次进入农场设施了。^000000"
  npc_override_1@lost_LostFarm_i_saw_guests_again_i_a1101c: "又见到客人了。我尊敬你。哦，当然，从一开始就很令人钦佩。"
  npc_override_1@lost_LostFarm_i_smell_sniff_sniff_04ee4f: "我闻到什么了吗……？嗅嗅。"
  npc_override_1@lost_LostFarm_i_think_s_little_differe_226d0d: "我觉得习惯和客人打交道跟习惯这种工作还是有点不同的。"
  npc_override_1@lost_LostFarm_i_think_s_right_them_297284: "我觉得这样对它们最好。我以前告诉过你，它们心情好的时候才会产出尾巴。"
  npc_override_1@lost_LostFarm_i_think_so_25f2e7: "我想是的。"
  npc_override_1@lost_LostFarm_i_think_they_should_play_568725: "但我觉得它们应该跟你玩！没错！"
  npc_override_1@lost_LostFarm_i_understand_why_luina_a_a2c9dd: "我明白为什么路易娜要求更多工人，因为她自己没法快速收割。"
  npc_override_1@lost_LostFarm_i_ve_met_eyes_automatic_398ddc: "- 我与农场设施前的自动人偶对上了视线。 -"
  npc_override_1@lost_LostFarm_i_wish_you_help_me_e837ab: "希望你能帮我收割……"
  npc_override_1@lost_LostFarm_if_condition_being_cute_dc6f72: "如果可爱的条件是咬人，那首领喵会是最可爱的，而且咬人不比其他家伙差……"
  npc_override_1@lost_LostFarm_if_you_give_me_pitaya_cb1482: "如果你把你收集的火龙果尾巴给我，今天的农场体验就结束了！来吧，我们出去！"
  npc_override_1@lost_LostFarm_if_you_look_kitty_right_e7d81a: "如果你现在看小猫，它没有根，对吧？"
  npc_override_1@lost_LostFarm_if_you_re_confident_your_92779f: "如果你对自己的战斗技能有信心，我想请你帮忙收割。"
  npc_override_1@lost_LostFarm_if_you_re_free_talk_1cd45e: "如果你有空，跟这里的'棉花'谈谈，她是玩耍管理员，她会告诉你该做什么。"
  npc_override_1@lost_LostFarm_if_you_want_see_him_107347: "如果你想在附近看到它，你得撒点食物，让农场周围有点动静。"
  npc_override_1@lost_LostFarm_ingredients_dessert_come_eb4ade: "食堂里甜点的原料就是在这里收获的。"
  npc_override_1@lost_LostFarm_just_some_fertilizer_som_09f3fa: "只是一些肥料……还有一些食物。"
  npc_override_1@lost_LostFarm_just_talk_me_if_you_27b854: "如果你有兴趣，就跟我说。"
  npc_override_1@lost_LostFarm_kitty_0fd592: "小猫。"
  npc_override_1@lost_LostFarm_kitty_butterfly_happy_so_20d074: "小猫、蝴蝶、 Happy 等等。"
  npc_override_1@lost_LostFarm_kitty_cutest_pitaya_over_edf93f: "小猫是最可爱的，这里的火龙果就是小猫。"
  npc_override_1@lost_LostFarm_kitty_here_plant_called_7c2b6f: "这里的小猫是一种叫做火龙果的植物。它是生活在岛上某处的古代物种的改良品种。"
  npc_override_1@lost_LostFarm_kitty_hold_still_minute_1b56e2: "小猫，别动一下。乖孩子~"
  npc_override_1@lost_LostFarm_let_s_look_your_talent_cc8f38: "让我看看你的天赋，然后撒食物！伙计们~~开饭了~~~"
  npc_override_1@lost_LostFarm_let_s_move_next_habitat_79273a: "我们继续前往下一个栖息地，就在附近。准备好了吗？出发！"
  npc_override_1@lost_LostFarm_let_s_move_next_location_603e98: "我们继续前往下一个地点！"
  npc_override_1@lost_LostFarm_let_s_see_how_many_22757a: "让我看看……你收集了多少？"
  npc_override_1@lost_LostFarm_let_s_talk_about_details_edfd16: "你想帮忙的时候我们再谈细节。"
  npc_override_1@lost_LostFarm_luina_held_pitaya_demo_h_b1498c: "- 路易娜拿着火龙果，演示如何拉尾巴然后放下。 -"
  npc_override_1@lost_LostFarm_luina_i_finished_extensi_93c6c3: "路易娜……我完成了扩展报告，之后请跟客人说点什么！"
  npc_override_1@lost_LostFarm_luina_s_face_became_comp_5513ed: "- 路易娜抚摸着猫，脸上露出复杂的满意表情。 -"
  npc_override_1@lost_LostFarm_luina_stroked_pitaya_9c4301: "- 路易娜抚摸着火龙果。 -"
  npc_override_1@lost_LostFarm_lungs_come_think_how_pit_ae1a47: "不是用肺，但是……想想看，火龙果是怎么发出声音的？"
  npc_override_1@lost_LostFarm_may_been_small_greenhous_c213db: "从外面看可能是个小温室，但那是幻觉。看天花板……真的很高，对吧？"
  npc_override_1@lost_LostFarm_maybe_just_maybe_4640f3: "也许……只是也许？"
  npc_override_1@lost_LostFarm_memorial_dungeon_hasn_t_f0db16: "^FF0000纪念副本尚未创建。^000000"
  npc_override_1@lost_LostFarm_menu_big_11b285: "大喵 : 咕噜噜噜噜。"
  npc_override_1@lost_LostFarm_menu_big_915f71: "大喵 : *打喷嚏*"
  npc_override_1@lost_LostFarm_menu_cotton_7f6b63: "棉花 : 我希望它再高一点……"
  npc_override_1@lost_LostFarm_menu_options_05553a: "{0} : 我想是吧。"
  npc_override_1@lost_LostFarm_menu_options_0e5f64: "{0} : 首领喵？"
  npc_override_1@lost_LostFarm_menu_options_147d09: "{0} : 你确定你不是在玩吗？"
  npc_override_1@lost_LostFarm_menu_options_649665: "{0} : 你玩得开心吗？"
  npc_override_1@lost_LostFarm_menu_options_834e5b: "{0} : 你还好吗？"
  npc_override_1@lost_LostFarm_menu_options_a68dbf: "{0} : 先出来吧。"
  npc_override_1@lost_LostFarm_menu_options_c79f8d: "{0} : 还有另一个吗？"
  npc_override_1@lost_LostFarm_menu_silk_005f42: "丝绸 : 但与其抚摸5分钟，不如像之前那样抱着它玩会更快。"
  npc_override_1@lost_LostFarm_menu_silk_021a51: "丝绸 : ……我不想害怕。"
  npc_override_1@lost_LostFarm_menu_silk_04433a: "丝绸 : 我一直给客人带路是有原因的。"
  npc_override_1@lost_LostFarm_menu_silk_06257d: "丝绸 : 给~~你可以拿走我的胳膊~~"
  npc_override_1@lost_LostFarm_menu_silk_06cdd0: "丝绸 : 啊啊啊啊啊啊啊！救救我！！"
  npc_override_1@lost_LostFarm_menu_silk_131ed0: "丝绸 : 呀啊！"
  npc_override_1@lost_LostFarm_menu_silk_1631aa: "丝绸 : 但我觉得它们应该跟你玩！没错！"
  npc_override_1@lost_LostFarm_menu_silk_17101a: "丝绸 : ……"
  npc_override_1@lost_LostFarm_menu_silk_17b526: "丝绸 : 唉……"
  npc_override_1@lost_LostFarm_menu_silk_19d4e6: "丝绸 : 让我看看，路易娜的记录……我需要叫醒一只大喵。要到那里的话……"
  npc_override_1@lost_LostFarm_menu_silk_19f2f1: "丝绸 : 这都是多亏了你……非常感谢。"
  npc_override_1@lost_LostFarm_menu_silk_1eac19: "丝绸 : 自动人偶会开玩笑吗？哦，你挺会开玩笑的。我一直都是认真的。"
  npc_override_1@lost_LostFarm_menu_silk_1fb137: "丝绸 : 总之，帮我收割下一批！嘿，伙计们~开饭了~~"
  npc_override_1@lost_LostFarm_menu_silk_21ece6: "丝绸 : 下一个是石头和沙子的游乐场。我收割的时候，得先把沙子抖掉……"
  npc_override_1@lost_LostFarm_menu_silk_22ad33: "丝绸 : 没关系，我视力很好，所以你到了那里给我发信号，我会处理的！现在，最近的那个，我在地图上给你看坐标……"
  npc_override_1@lost_LostFarm_menu_silk_259055: "丝绸 : 我觉得这样对它们最好。我以前告诉过你，它们心情好的时候才会产出尾巴。"
  npc_override_1@lost_LostFarm_menu_silk_2789c4: "丝绸 : 谢谢你救了我的命！据路易娜说，火龙果是温顺的生物！"
  npc_override_1@lost_LostFarm_menu_silk_2807ce: "丝绸 : 有什么条件是可爱到需要咬人的吗？"
  npc_override_1@lost_LostFarm_menu_silk_2a3cce: "丝绸 : 那我们继续吧……这里的火龙果都是瞌睡虫，所以反应可能有点不同。现在，伙计们……过来……"
  npc_override_1@lost_LostFarm_menu_silk_2d18d9: "丝绸 : ……会好好咬人的……？"
  npc_override_1@lost_LostFarm_menu_silk_2ddd18: "丝绸 : 我们继续前往下一个栖息地，就在附近。准备好了吗？出发！"
  npc_override_1@lost_LostFarm_menu_silk_2e05ca: "丝绸 : ……所以，两只大喵……首领喵和大喵有等级制度，所以它们在饭前有特定的午睡位置……"
  npc_override_1@lost_LostFarm_menu_silk_2e2106: "丝绸 : ……结束了吗？"
  npc_override_1@lost_LostFarm_menu_silk_30a9a0: "丝绸 : 只有首领喵……"
  npc_override_1@lost_LostFarm_menu_silk_331ca4: "丝绸 : 救救自动人偶！"
  npc_override_1@lost_LostFarm_menu_silk_35d5ed: "丝绸 : 那么让我叫一下附近的火龙果……"
  npc_override_1@lost_LostFarm_menu_silk_3832bc: "丝绸 : 顺便说一下……今天的配额终于过半了。"
  npc_override_1@lost_LostFarm_menu_silk_3a143b: "丝绸 : 嘿……伙计们，该吃bars和米饭了~"
  npc_override_1@lost_LostFarm_menu_silk_3a437c: "丝绸 : ……好~~~~~"
  npc_override_1@lost_LostFarm_menu_silk_3adebe: "丝绸 : 现在我也在这里撒点食物。让我们快点结束……我去躲起来。"
  npc_override_1@lost_LostFarm_menu_silk_3fec5c: "丝绸 : 果然……快乐是有代价的。"
  npc_override_1@lost_LostFarm_menu_silk_40a03a: "丝绸 : 怎么样……亲爱的客人？"
  npc_override_1@lost_LostFarm_menu_silk_40b704: "丝绸 : 你觉得怎么样？我觉得你作为新手做得不错。"
  npc_override_1@lost_LostFarm_menu_silk_41c597: "丝绸 : 我们走吧？"
