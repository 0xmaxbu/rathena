  npc_override_1@lost_LostFarm_menu_silk_9cfeaa: "丝绸 : 我想我们只需要安抚一只就能让它们让路。好，如果你选一边，我去……我去喂另一边……"
  npc_override_1@lost_LostFarm_menu_silk_a00b0f: "丝绸 : 你也看到了！我很害怕！"
