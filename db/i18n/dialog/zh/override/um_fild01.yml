Body:

  npc_override_um_fild01_quest_dryad_after_you_lost_some_weig_b89d61: "在你减重之后。"
  npc_override_um_fild01_quest_dryad_ah_ok_i_think_you_f13b2c: "啊，好的，我想你可以帮我狩猎一些树精。"
  npc_override_um_fild01_quest_dryad_amazing_you_did_speed_6cc3cd: "太厉害了，你这么快就完成了。"
  npc_override_um_fild01_quest_dryad_any_progress_you_ve_made_b3e247: "你取得的任何进展都将被清除"
  npc_override_um_fild01_quest_dryad_come_back_when_you_ve_44350c: "完成任务后回来，我会给你一个小奖励。"
  npc_override_um_fild01_quest_dryad_hey_looks_like_weight_7817f7: "嘿，看起来你身上的重量"
  npc_override_um_fild01_quest_dryad_hey_your_sweet_little_th_7689a5: "嘿，你真是个可爱的小家伙。"
  npc_override_um_fild01_quest_dryad_hmm_i_don_t_think_1d8eb5: "嗯，我觉得你还没狩猎到100只……"
  npc_override_um_fild01_quest_dryad_hmm_i_don_t_think_2144d7: "嗯，我觉得你还没狩猎到50只……"
  npc_override_um_fild01_quest_dryad_hmm_i_don_t_think_5d960b: "嗯，我觉得你还没狩猎到150只……"
  npc_override_um_fild01_quest_dryad_how_many_you_like_hunt_7fc82d: "你想狩猎多少只？"
  npc_override_um_fild01_quest_dryad_i_need_sharp_leafs_856246: "我需要^00CE0050片锋利的叶子^000000。"
  npc_override_um_fild01_quest_dryad_i_really_need_gather_sha_8b9cfd: "我真的需要为我的花园茶会收集^00CE0050片锋利的叶子^000000。"
  npc_override_um_fild01_quest_dryad_if_you_change_your_mind_3f2210: "如果你改变主意，请回来。"
  npc_override_um_fild01_quest_dryad_menu_dryads_d0efc8: "50只树精:100只树精:150只树精"
  npc_override_um_fild01_quest_dryad_menu_gather_d8f8f6: "收集物品:狩猎树精:取消"
  npc_override_um_fild01_quest_dryad_menu_i_4fbfe5: "我有一些锋利的叶子:你需要什么？"
  npc_override_um_fild01_quest_dryad_menu_sure_859d29: "当然:不了"
  npc_override_um_fild01_quest_dryad_menu_yes_141459: "是:否"
  npc_override_um_fild01_quest_dryad_menu_yes_755efb: "是:否:我想退出"
  npc_override_um_fild01_quest_dryad_oh_i_almost_forgot_i_58a3e6: "哦，我差点忘了。我有东西给你 ^_^"
  npc_override_um_fild01_quest_dryad_ok_then_well_come_back_0e1574: "好的，如果你改变主意就回来。"
  npc_override_um_fild01_quest_dryad_please_kill_dryads_25f9c0: "请击杀100只树精。"
  npc_override_um_fild01_quest_dryad_please_kill_dryads_2a5bf4: "请击杀50只树精。"
  npc_override_um_fild01_quest_dryad_please_kill_dryads_d293da: "请击杀150只树精。"
  npc_override_um_fild01_quest_dryad_really_1acc34: "真的吗？！"
  npc_override_um_fild01_quest_dryad_remember_i_need_help_hun_41dcec: "记住，我需要帮助狩猎树精，所以去狩猎100只。"
  npc_override_um_fild01_quest_dryad_remember_i_need_help_hun_a78134: "记住，我需要帮助狩猎树精，所以去狩猎50只。"
  npc_override_um_fild01_quest_dryad_remember_i_need_help_hun_b50fab: "记住，我需要帮助狩猎树精，所以去狩猎150只。"
  npc_override_um_fild01_quest_dryad_s_great_82bb27: "太好了！"
  npc_override_um_fild01_quest_dryad_sorry_you_little_too_old_9d13a5: "抱歉，但你有点太老、太吓人了，没法和你说话！"
  npc_override_um_fild01_quest_dryad_thank_you_so_much_again_29afda: "再次非常感谢你的帮助。"
  npc_override_um_fild01_quest_dryad_thank_you_your_offer_tho_a6f5e8: "谢谢你的提议。"
  npc_override_um_fild01_quest_dryad_thanks_so_much_helping_m_04d359: "非常感谢你的帮助！"
  npc_override_um_fild01_quest_dryad_why_hello_dc967a: "你好呀！"
  npc_override_um_fild01_quest_dryad_why_i_may_look_cute_f491d0: "虽然我看起来可爱又傻，但请不要和我开玩笑。"
  npc_override_um_fild01_quest_dryad_you_any_3579ad: "你有吗？"
  npc_override_um_fild01_quest_dryad_you_finished_hunting_dry_18e9a7: "你完成狩猎150只树精了吗？"
  npc_override_um_fild01_quest_dryad_you_finished_hunting_dry_8f211e: "你完成狩猎50只树精了吗？"
  npc_override_um_fild01_quest_dryad_you_look_like_someone_wh_3eca7b: "你看起来像是愿意帮助像我这样的小家伙的人。"
  npc_override_um_fild01_quest_dryad_you_sure_you_want_stop_507e20: "你确定要停止狩猎吗？"
  npc_override_um_fild01_quest_dryad_you_way_too_tiny_helping_9402bf: "你太小了，帮不了我。"
  npc_override_um_fild01_quest_dryad_your_back_crush_you_come_d8fffe: "你的背会压垮你。回来吧，等你减轻一些重量。"
