Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@jtb_NightmarishJitterbug_accordance_guild_policy_27fa9d: "根据公会条例第8条，我现在是这个公会的主人，而你只是个成员。"
  npc_override_1@jtb_NightmarishJitterbug_adventuring_always_fun_g_cc2bc2: "冒险总是有趣的。成为一名伟大的冒险者，好吗？"
  npc_override_1@jtb_NightmarishJitterbug_after_while_i_had_give_8d54e6: "过了一段时间，我不得不放弃追踪他。我只是在浪费时间。"
  npc_override_1@jtb_NightmarishJitterbug_after_you_lose_some_weig_0f3785: "- 等你减点肥之后。 -"
  npc_override_1@jtb_NightmarishJitterbug_agreed_he_s_violent_dirt_4041cb: "同意。他暴力、肮脏……"
  npc_override_1@jtb_NightmarishJitterbug_ah_combining_items_fun_1c5d79: "啊，组合道具很有趣。"
  npc_override_1@jtb_NightmarishJitterbug_ah_i_m_getting_hungry_4e530c: "啊，我饿了。怪物们去死吧。沙洛希，我们走！"
  npc_override_1@jtb_NightmarishJitterbug_aigu_runane_good_1702ee: "艾古和露兰很好。"
  npc_override_1@jtb_NightmarishJitterbug_aigu_runane_showed_up_25bd08: "艾古和露兰出现了。"
  npc_override_1@jtb_NightmarishJitterbug_aigu_rune_midgarts_hotte_ba45e6: "艾古是当下卢恩-米德加尔特最炙手可热的歌手！"
  npc_override_1@jtb_NightmarishJitterbug_aigu_s_debut_song_lost_d2f3fe: "艾古的出道曲——迷失的波利"
  npc_override_1@jtb_NightmarishJitterbug_air_smells_different_thi_6805a1: "空气闻起来不一样，事物看起来不那么……清晰可辨。"
  npc_override_1@jtb_NightmarishJitterbug_all_right_let_me_think_21bd50: "好的！让我想想我要给你什么……"
  npc_override_1@jtb_NightmarishJitterbug_all_righty_c73a91: "好的！"
  npc_override_1@jtb_NightmarishJitterbug_all_while_foreign_energy_52558a: "一直以来，我感受到的异种能量越来越强烈。情况不妙。"
  npc_override_1@jtb_NightmarishJitterbug_almost_no_taste_9e793f: "几乎没什么味道。"
  npc_override_1@jtb_NightmarishJitterbug_am_i_only_one_happy_e65412: "我是唯一对这个对话不高兴的人吗？"
  npc_override_1@jtb_NightmarishJitterbug_arang_let_s_go_s_f9c0b8: "阿朗，走吧。该去冒险了！"
  npc_override_1@jtb_NightmarishJitterbug_arang_shaloshi_71c6b7: "阿朗！沙洛希！"
  npc_override_1@jtb_NightmarishJitterbug_arang_why_aren_t_you_9725df: "阿朗，你怎么不喝？"
  npc_override_1@jtb_NightmarishJitterbug_argh_43ffb4: "啊！"
  npc_override_1@jtb_NightmarishJitterbug_argh_there_ghost_am_i_0f0d41: "啊，有鬼吗？还是我听错了？"
  npc_override_1@jtb_NightmarishJitterbug_ask_many_questions_57369e: "问很多问题。"
  npc_override_1@jtb_NightmarishJitterbug_atk_matk_all_stats_261711: "ATK +6%。MATK +6%。全属性 +1。"
  npc_override_1@jtb_NightmarishJitterbug_awesome_indeed_ed136b: "确实很棒！"
  npc_override_1@jtb_NightmarishJitterbug_aww_runane_you_re_cute_e2d055: "哇，露兰。你真可爱！"
  npc_override_1@jtb_NightmarishJitterbug_before_aigu_runane_2f20ee: "在艾古和露兰之前，"
  npc_override_1@jtb_NightmarishJitterbug_before_two_give_each_oth_34e71a: "- 在两人击掌之前，艾古和 Mingmin 拍了拍他们的背。 -"
  npc_override_1@jtb_NightmarishJitterbug_better_get_rid_him_quick_9d05a0: "最好快点解决他。"
  npc_override_1@jtb_NightmarishJitterbug_blow_8fa604: "*吹*"
  npc_override_1@jtb_NightmarishJitterbug_bye_e17e76: "再见。"
  npc_override_1@jtb_NightmarishJitterbug_bye_friends_i_hope_we_de4f1a: "再见，朋友们。希望我们很快能再见面。"
  npc_override_1@jtb_NightmarishJitterbug_calm_down_s_just_woman_a9d382: "冷静点。只是个女人。"
  npc_override_1@jtb_NightmarishJitterbug_chica_chica_4d075b: "Chica，chica~"
  npc_override_1@jtb_NightmarishJitterbug_chuckle_i_messing_you_wo_5eb3db: "*轻笑* 我在逗你玩呢——成功了！"
  npc_override_1@jtb_NightmarishJitterbug_combining_process_really_45643f: "组合过程真的很简单。我只要把和谐吊坠放在地上，然后把混沌吊坠扔过去……就像这样！"
  npc_override_1@jtb_NightmarishJitterbug_comes_natural_veteran_th_5c407b: "对于我这样的资深盗贼来说，隐藏在潜在敌区是本能。"
  npc_override_1@jtb_NightmarishJitterbug_comrades_should_best_fri_a69532: "同伴应该是最好的朋友！"
  npc_override_1@jtb_NightmarishJitterbug_comrades_should_fight_ea_686479: "同伴之间不该互相争斗。明白了吗。"
  npc_override_1@jtb_NightmarishJitterbug_comrades_should_fight_ea_a0efdc: "同伴之间不该互相争斗。"
  npc_override_1@jtb_NightmarishJitterbug_comrades_who_we_re_just_10d0e2: "同伴，谁？我们只是一群拼命想救一个走失女孩的陌生人！"
  npc_override_1@jtb_NightmarishJitterbug_considering_time_money_w_e3b53d: "考虑到我们浪费在你身上的时间和金钱，你该被喂一篮子毒蘑菇。"
  npc_override_1@jtb_NightmarishJitterbug_cool_99e51d: "真差劲。"
  npc_override_1@jtb_NightmarishJitterbug_could_she_lost_her_memor_46e7c9: "她是不是失去记忆了？看起来她似乎不理解危险。"
  npc_override_1@jtb_NightmarishJitterbug_could_supernatural_25adeb: "会不会是超自然现象？"
  npc_override_1@jtb_NightmarishJitterbug_course_now_s_called_um_d4ce36: "当然！现在它叫……嗯……"
  npc_override_1@jtb_NightmarishJitterbug_crack_thing_entrance_as_a71845: "那个裂缝，或者说入口，已经消失了。如果你真的想离开，那就跟着艾古。"
  npc_override_1@jtb_NightmarishJitterbug_cross_8524ee: "CROSS！！！"
  npc_override_1@jtb_NightmarishJitterbug_currently_you_re_carryin_73594b: "- 你当前携带 -"
  npc_override_1@jtb_NightmarishJitterbug_dance_6c3c32: "跳舞……"
  npc_override_1@jtb_NightmarishJitterbug_danger_no_825fcd: "危险，不。"
  npc_override_1@jtb_NightmarishJitterbug_decline_e87fe0: "拒绝。"
  npc_override_1@jtb_NightmarishJitterbug_delicate_flashlight_lumi_1c75f6: "精致手电筒，Lumiere Dupleix！"
  npc_override_1@jtb_NightmarishJitterbug_did_you_63ea9c: "是吗？"
  npc_override_1@jtb_NightmarishJitterbug_did_you_get_lost_yoursel_2ab8f5: "你又自己迷路了吗？"
  npc_override_1@jtb_NightmarishJitterbug_did_you_take_care_them_e1ad27: "你已经解决他们了吗？我也想参加！"
  npc_override_1@jtb_NightmarishJitterbug_dimensional_portal_canno_4c5df8: "^ff0000此次元 portal 在最后一次进入后 20 小时内无法进入。^000000"
  npc_override_1@jtb_NightmarishJitterbug_dimwit_only_interested_a_ce3c83: "那个笨蛋只对冒险感兴趣。"
  npc_override_1@jtb_NightmarishJitterbug_doesn_t_anything_when_yo_89f196: "你没中毒的时候它不会有任何效果。我们只是不想浪费好药水。"
  npc_override_1@jtb_NightmarishJitterbug_don_t_call_my_hero_70d7b7: "别那样叫我的英雄！……但我同意你的看法。"
  npc_override_1@jtb_NightmarishJitterbug_don_t_care_9d05d4: "不在乎。"
  npc_override_1@jtb_NightmarishJitterbug_don_t_let_yourself_delud_6f6eeb: "别被谣言迷惑！我是南门之鹿，驱魔史上最强大的大主教！"
  npc_override_1@jtb_NightmarishJitterbug_don_t_listen_him_he_2ee7c4: "别听他的。他不需要你鼓励他讲冷笑话。"
  npc_override_1@jtb_NightmarishJitterbug_don_t_look_me_exit_15d420: "别看我。那是出口吗？"
  npc_override_1@jtb_NightmarishJitterbug_don_t_mistake_anything_m_10c05a: "别想太多了——这只是临时照看孩子而已！"
  npc_override_1@jtb_NightmarishJitterbug_don_t_put_too_much_45276e: "别太相信这孩子。我最好去找纽沃斯。"
  npc_override_1@jtb_NightmarishJitterbug_don_t_worry_children_gro_84e8b6: "别担心。孩子在战斗中成长。"
  npc_override_1@jtb_NightmarishJitterbug_don_t_you_dare_i_fd18a6: "你敢——是我先预订他的！"
  npc_override_1@jtb_NightmarishJitterbug_don_t_you_dare_take_3e8b64: "你敢把我的纽沃斯抢走！"
  npc_override_1@jtb_NightmarishJitterbug_dorky_23b1df: "真蠢。"
  npc_override_1@jtb_NightmarishJitterbug_dream_low_voice_dream_wh_9488c3: "一个梦。梦中的低语。什么样的梦？"
  npc_override_1@jtb_NightmarishJitterbug_drink_drink_79ef48: "喝！喝！"
  npc_override_1@jtb_NightmarishJitterbug_enjoy_your_item_bring_mo_3a1f96: "享受你的道具吧。如果你想要更多道具，带来更多的 Jitterbug 牙齿。"
  npc_override_1@jtb_NightmarishJitterbug_enough_he_s_just_idiot_bcca4a: "够了。他只是个没有方向感的白痴。"
  npc_override_1@jtb_NightmarishJitterbug_enough_stop_being_disres_da1f5f: "够了！别再对纽沃斯无礼！"
  npc_override_1@jtb_NightmarishJitterbug_everything_about_her_scr_175a52: "她的一切都透着可疑。"
  npc_override_1@jtb_NightmarishJitterbug_except_you_you_mean_c659e5: "除了你，你是说。"
  npc_override_1@jtb_NightmarishJitterbug_ferre_angry_3b5fd7: "Ferre 生气了。"
  npc_override_1@jtb_NightmarishJitterbug_ferre_b8488b: "Ferre……"
  npc_override_1@jtb_NightmarishJitterbug_ferre_created_space_crac_adc659: "Ferre 在裂缝中为我创造了这个空间。如果他失去理智或死亡，这个空间以及其中的一切都会消失。"
  npc_override_1@jtb_NightmarishJitterbug_ferre_e2a160: "Ferre？"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_729298: "Ferre，ferre！"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_d3e13a: "FERRE！FERRE！"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_fe_b0f637: "Ferre，ferre，fe-！"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_ferre_3f5adf: "Ferre，ferre，ferre！"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_ferre_ferre_26bc20: "Ferre，ferre，ferre，ferre-！"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_ferre_ferre_4f1f40: "FERRE- FERRE- FERRE- FERRE-！！"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_ferre_ffcb0b: "FERRE，FERRE，FERRE-！"
  npc_override_1@jtb_NightmarishJitterbug_ferre_really_angry_e581b8: "Ferre 真的很生气。"
  npc_override_1@jtb_NightmarishJitterbug_ferre_transformed_into_i_3ebc5e: "Ferre 已经变身成它的真实形态！"
  npc_override_1@jtb_NightmarishJitterbug_ferre_you_don_t_65fcdb: "Ferre，你不必这样做！"
  npc_override_1@jtb_NightmarishJitterbug_ferres_angry_055e50: "Ferres 很生气。"
  npc_override_1@jtb_NightmarishJitterbug_ferres_don_t_bite_me_7ae12a: "Ferres 不咬我。"
  npc_override_1@jtb_NightmarishJitterbug_ferres_showed_up_first_428b4e: "Ferres 最先出现。"
  npc_override_1@jtb_NightmarishJitterbug_fighting_essential_adven_0976a2: "战斗是冒险者训练的基础。分而治之！"
  npc_override_1@jtb_NightmarishJitterbug_fog_cleared_up_aae1aa: "雾散了。"
  npc_override_1@jtb_NightmarishJitterbug_follow_roter_gelka_0c035c: "跟着 Roter 和 Gelka。"
  npc_override_1@jtb_NightmarishJitterbug_formidable_enemy_appeare_cf58f6: "^FF0000强大的敌人出现了！^000000"
  npc_override_1@jtb_NightmarishJitterbug_friends_rivalry_4400dd: "（朋友……竞争……）"
  npc_override_1@jtb_NightmarishJitterbug_friends_rivalry_comrades_54b76e: "朋友……竞争……同伴……"
  npc_override_1@jtb_NightmarishJitterbug_gelka_get_ready_c7db0a: "Gelka，准备！"
  npc_override_1@jtb_NightmarishJitterbug_gelka_style_mental_stren_25e470: "Gelka 流精神力！铁壁身躯！"
  npc_override_1@jtb_NightmarishJitterbug_gimmie_five_d7f5f2: "击个掌！"
  npc_override_1@jtb_NightmarishJitterbug_given_situation_my_promi_43f3ec: "但考虑到目前的情况，我对你的承诺仍然有效。"
  npc_override_1@jtb_NightmarishJitterbug_gods_gelka_you_re_awesom_52126e: "天哪，Gelka，你太厉害了！"
  npc_override_1@jtb_NightmarishJitterbug_good_ferre_56fa72: "情况不妙。Ferre……"
  npc_override_1@jtb_NightmarishJitterbug_green_potion_07e9b8: "绿色药水"
  npc_override_1@jtb_NightmarishJitterbug_green_potion_a87957: "绿色药水！"
  npc_override_1@jtb_NightmarishJitterbug_green_potion_ca8aac: "绿色药水？"
  npc_override_1@jtb_NightmarishJitterbug_green_potion_such_bitter_a93a2b: "绿色药水很苦……嗯，你说绿色药水？"
  npc_override_1@jtb_NightmarishJitterbug_grunt_why_did_i_get_e4f01e: "*咕哝* 我为什么要卷入这种麻烦？"
  npc_override_1@jtb_NightmarishJitterbug_guess_so_we_ve_been_579286: "我猜也是。顺便说一下，我们一直在同一个地方绕圈子。"
  npc_override_1@jtb_NightmarishJitterbug_guildsmen_bicker_each_ot_6e5f77: "公会成员可以互相争吵，但他们仍然是家人。"
  npc_override_1@jtb_NightmarishJitterbug_h_hello_my_name_roel_34051a: "你、你好，我叫 Roel。露兰和我是一起加入公会的。很高兴认识你。"
  npc_override_1@jtb_NightmarishJitterbug_haap_3c400b: "Haap！"
  npc_override_1@jtb_NightmarishJitterbug_hah_hah_don_t_worry_00d84a: "哈哈，别担心，小姑娘们。我会保护你们的。"
  npc_override_1@jtb_NightmarishJitterbug_hah_hah_embarassing_than_23fcef: "哈哈，这很尴尬，但谢谢你。"
  npc_override_1@jtb_NightmarishJitterbug_hah_hah_i_ll_teach_fee7c6: "哈哈，我稍后会教你怎么做的，沙洛希。"
  npc_override_1@jtb_NightmarishJitterbug_hah_hah_you_re_cute_6b7956: "哈哈，你真可爱。我稍后会为你唱歌。"
  npc_override_1@jtb_NightmarishJitterbug_hate_green_potions_97baa8: "讨厌绿色药水~"
  npc_override_1@jtb_NightmarishJitterbug_having_you_two_me_brings_207137: "有你们两个在身边让我回忆起了很多往事。"
  npc_override_1@jtb_NightmarishJitterbug_he_didn_t_know_because_5dfc94: "他不知道是因为他从来不用脑子。"
  npc_override_1@jtb_NightmarishJitterbug_he_s_bad_news_trouble_1886e3: "他是个麻烦精。麻烦跟着他到处走。"
  npc_override_1@jtb_NightmarishJitterbug_he_s_born_irritable_0441d5: "他天生脾气暴躁。"
  npc_override_1@jtb_NightmarishJitterbug_he_s_dead_guys_i_204a4d: "他没死。各位，我理解你们是新人，但不能犯这种错误。"
  npc_override_1@jtb_NightmarishJitterbug_he_s_just_being_lazy_edb4fa: "他只是在偷懒。他没那么弱。"
  npc_override_1@jtb_NightmarishJitterbug_heh_my_instincts_told_me_9f43d4: "嘿，我的本能告诉我慢下来，因为前方有危险。"
  npc_override_1@jtb_NightmarishJitterbug_heh_sci_fi_there_s_e006fb: "嘿，科幻。有一种机械工具可以运作……"
  npc_override_1@jtb_NightmarishJitterbug_hello_arang_how_s_ariran_7a5146: "你好，阿朗。阿里郎怎么样？嘿。什么风把你吹来了？"
  npc_override_1@jtb_NightmarishJitterbug_her_name_shaloshi_i_aske_496942: "她叫沙洛希？我问了她好几次，她都没告诉我。"
  npc_override_1@jtb_NightmarishJitterbug_here_they_come_851357: "他们来了……"
  npc_override_1@jtb_NightmarishJitterbug_here_we_go_3c6dcf: "我们开始吧！"
  npc_override_1@jtb_NightmarishJitterbug_hey_come_me_c44e3b: "嘿，跟我来！"
  npc_override_1@jtb_NightmarishJitterbug_hey_what_you_been_readin_d4ffb8: "嘿，你最近在看什么书？"
  npc_override_1@jtb_NightmarishJitterbug_heya_b4a936: "嘿！"
  npc_override_1@jtb_NightmarishJitterbug_hi_nice_meet_you_i_41d791: "嗨，很高兴认识你。能亲眼见到著名的纽沃斯，我感到很荣幸。"
  npc_override_1@jtb_NightmarishJitterbug_hm_5ea458: "嗯……"
  npc_override_1@jtb_NightmarishJitterbug_hm_82ab28: "嗯？"
  npc_override_1@jtb_NightmarishJitterbug_hm_each_his_own_b51556: "嗯，人各有志。"
  npc_override_1@jtb_NightmarishJitterbug_hm_getting_pretty_awkwar_0356c1: "嗯，这里变得有点尴尬了。"
  npc_override_1@jtb_NightmarishJitterbug_hm_good_enough_gelka_don_53338b: "嗯，还不够好，Gelka。别让公会事务分散你练习的注意力。"
  npc_override_1@jtb_NightmarishJitterbug_hmpf_i_hate_girls_i_4f59ee: "哼，我讨厌女孩子。我有种预感我们会看到更多怪物。"
  npc_override_1@jtb_NightmarishJitterbug_hmpf_just_know_i_m_b9c334: "哼，要知道我信守对你的承诺只是因为你拥有我想要的东西。"
  npc_override_1@jtb_NightmarishJitterbug_how_about_i_your_friend_190b6e: "我做你的朋友怎么样？"
  npc_override_1@jtb_NightmarishJitterbug_how_about_when_you_playe_c72032: "那你玩枯树枝玩到累死的时候呢？或者你和你的妖术师朋友们玩 Hocus Pocus 把自己玩死的时候呢？"
  npc_override_1@jtb_NightmarishJitterbug_how_about_you_adventurer_eeb82e: "你呢，冒险者？你的另一半怎么样？"
  npc_override_1@jtb_NightmarishJitterbug_how_did_we_get_you_3a3f74: "你问我们是怎么进来的？"
  npc_override_1@jtb_NightmarishJitterbug_how_long_i_shimmy_my_7489ad: "我还要扭多久的肩膀~"
  npc_override_1@jtb_NightmarishJitterbug_how_s_released_yet_c5b229: "但是怎么……？！还没发布呢。"
  npc_override_1@jtb_NightmarishJitterbug_i_agree_clearing_neither_01c0a1: "我同意。而且这个空地既不紧凑也不宽敞。"
  npc_override_1@jtb_NightmarishJitterbug_i_agree_jack_everything_932158: "我同意 Jack 的看法。这个地方的一切——从空气到土壤——都透着不自然。"
  npc_override_1@jtb_NightmarishJitterbug_i_always_love_singing_f685d3: "我一直喜欢唱歌。"
  npc_override_1@jtb_NightmarishJitterbug_i_as_stubborn_as_mule_b4bbf3: "我倔得像头骡子，还忙着假装自己知道在做什么。"
  npc_override_1@jtb_NightmarishJitterbug_i_bake_knit_my_spare_f643b0: "我在业余时间烤面包和编织。我很擅长家务。呵呵呵！"
  npc_override_1@jtb_NightmarishJitterbug_i_believe_you_master_45f6be: "我相信你，主人！"
  npc_override_1@jtb_NightmarishJitterbug_i_didn_t_know_what_bc30fb: "我不知道朋友意味着什么，但听起来不错。我想要它。"
  npc_override_1@jtb_NightmarishJitterbug_i_didn_t_quite_understan_bd84a9: "我不太理解她的话，但露兰说她记忆的地方的 portal 是基于时间而非空间的。"
  npc_override_1@jtb_NightmarishJitterbug_i_don_t_care_i_e81606: "我不在乎。我要和纽沃斯待在一起。"
  npc_override_1@jtb_NightmarishJitterbug_i_don_t_know_why_dc3a5d: "我不知道为什么，但事物正在失去形状，仿佛正在消失。"
  npc_override_1@jtb_NightmarishJitterbug_i_don_t_mind_healthy_052c63: "我不介意良性竞争，但我更喜欢友谊，无论它能持续多久。"
  npc_override_1@jtb_NightmarishJitterbug_i_don_t_think_he_700c83: "我想他不知道。你知道吗，纽沃斯？"
  npc_override_1@jtb_NightmarishJitterbug_i_enjoyed_your_company_i_eff612: "我很享受有你的陪伴。如果我们再次见面……我们会是敌人吗？"
  npc_override_1@jtb_NightmarishJitterbug_i_feel_great_my_first_54d905: "我感觉棒极了——这是我很久以来的第一次冒险，因为我一直在负责照顾其他冒险者。而且我还见到了我的英雄纽沃斯！"
  npc_override_1@jtb_NightmarishJitterbug_i_feel_like_something_s_22820c: "我感觉有什么东西会砰的一声出现在我们眼前。"
  npc_override_1@jtb_NightmarishJitterbug_i_feeling_newoz_up_no_fa7a10: "我感觉纽沃斯又在搞什么鬼了。"
  npc_override_1@jtb_NightmarishJitterbug_i_find_her_i_talk_5d13ee: "我必须找到她。我必须和她谈谈。"
  npc_override_1@jtb_NightmarishJitterbug_i_guess_jobs_don_t_7ecd0f: "我想只要能唱歌和演奏，职业不重要吧？"
  npc_override_1@jtb_NightmarishJitterbug_i_had_almost_expired_gre_50830a: "我有一瓶快过期的绿色药水，所以我们决定玩石头剪刀布，输的人喝掉它。"
  npc_override_1@jtb_NightmarishJitterbug_i_hope_s_formidable_mons_4c00eb: "我希望是个强大的怪物！"
  npc_override_1@jtb_NightmarishJitterbug_i_hope_shaloshi_recover_ef0830: "我希望沙洛希能尽快恢复记忆。"
  npc_override_1@jtb_NightmarishJitterbug_i_hope_there_lots_things_a3096d: "我希望有很多可以研究的东西。"
  npc_override_1@jtb_NightmarishJitterbug_i_hope_today_won_t_2c4efc: "我希望今天不会是我演奏乐器的最后一天……"
  npc_override_1@jtb_NightmarishJitterbug_i_hope_you_ll_teach_7f74d8: "我希望你也能教我，Roter。"
  npc_override_1@jtb_NightmarishJitterbug_i_hope_you_re_wrong_53f4a3: "希望你错了。"
  npc_override_1@jtb_NightmarishJitterbug_i_i_ll_practice_harder_d76cd4: "我会的！我也会更努力练习的！"
  npc_override_1@jtb_NightmarishJitterbug_i_just_don_t_like_a0933c: "我只是不喜欢这个名字。"
  npc_override_1@jtb_NightmarishJitterbug_i_keep_losing_others_the_bee182: "我总是跟丢其他人。他们就在我面前。"
  npc_override_1@jtb_NightmarishJitterbug_i_knew_happen_aigu_didn_3563b2: "我就知道会这样，而艾古不听我的！"
  npc_override_1@jtb_NightmarishJitterbug_i_know_he_ll_say_064a91: "我知道——如果我约他出去，他会拒绝的。"
  npc_override_1@jtb_NightmarishJitterbug_i_know_you_don_t_8599fc: "我知道。你不必提醒我。"
  npc_override_1@jtb_NightmarishJitterbug_i_like_his_spirit_though_6b0ed5: "我喜欢他的精神，虽然我看得出他已经很疲惫了。"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_exchange_jitterbug_0aee3f: "我会用 50 个 Jitterbug 牙齿交换^FF0000一个随机道具。^000000"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_explain_everything_d86639: "我会解释一切的。别再提毒蘑菇了。我根本不能吃蘑菇。"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_follow_you_guys_88a783: "我会跟着你们到天涯海角。"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_kill_you_both_87cddf: "我会在怪物之前杀了你们两个。"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_never_able_speak_667f6e: "我永远说不出那个名字。艾古，你确定要跟着这些人吗？"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_never_again_let_e24a9f: "我再也不会让你离开我了，纽沃斯！"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_show_you_my_f6ed06: "我会向你展示我作为公会会长的魅力领导力！"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_sing_again_later_c88154: "我稍后会再唱歌。"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_study_you_later_54d1bb: "我稍后再研究你，小姑娘。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_afraid_place_falling_3411cc: "我担心这个地方正在我们周围坍塌。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_all_right_rot_2b457a: "我没事。Rot，你在担心我吗？"
  npc_override_1@jtb_NightmarishJitterbug_i_m_alone_7459c9: "我不是一个人。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_alone_e169b8: "但我不是一个人。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_detecting_electromag_0e1e3a: "我检测到前方有电磁波。至少是 E 级怪物。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_experienced_adventur_832c1b: "我虽然没什么冒险经验，但这很有趣。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_fan_c6131e: "我不喜欢这个。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_fine_i_told_d43e31: "我没事。我告诉过你要小心，小鬼！"
  npc_override_1@jtb_NightmarishJitterbug_i_m_following_newoz_9a2725: "我跟着纽沃斯。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_glad_mushroom_poison_f6a52e: "我很高兴蘑菇没有毒。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_guild_master_i_1c4a3e: "我是公会会长！我想叫它什么就叫什么！"
  npc_override_1@jtb_NightmarishJitterbug_i_m_hiding_because_my_ab4985: "我不是在躲，因为我的精灵图还没准备好！"
  npc_override_1@jtb_NightmarishJitterbug_i_m_interested_kid_90c0ba: "我对那个孩子不感兴趣。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_just_going_leave_859c44: "我就让你们……"
  npc_override_1@jtb_NightmarishJitterbug_i_m_leaving_be1eaa: "够了！我要走了！"
  npc_override_1@jtb_NightmarishJitterbug_i_m_member_if_you_5d2ddf: "我不是成员，但如果你问我的话，那个名字……"
  npc_override_1@jtb_NightmarishJitterbug_i_m_okay_first_time_c9f5dd: "我没事。又不是第一次了。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_okay_least_i_fe553d: "我没事。至少我能保护沙洛希。保护别人的感觉真好。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_roel_new_guildsman_f2a009: "我是 Roel，新公会成员。很高兴认识你。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_roel_new_member_00127f: "我是白翼公会的新成员 Roel。Roter 让我到处寻找纽沃斯，我找到了一些关于他下落的线索。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_scared_8ff779: "我才不怕！"
  npc_override_1@jtb_NightmarishJitterbug_i_m_shaloshi_demon_mind_f703ab: "我是沙洛希，一个恶魔读心者，也是梦罗克的第三代理人。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_shaloshi_sing_me_925f7e: "我是沙洛希。为我唱歌吧。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_telling_you_we_5545b6: "我告诉你，我们一直在同一个地方绕圈子。"
  npc_override_1@jtb_NightmarishJitterbug_i_m_your_master_anymore_f28ed3: "我不再是你的主人了。你不必跟着我。"
  npc_override_1@jtb_NightmarishJitterbug_i_mingmin_drank_poison_b_1b06f5: "我可以！Mingmin 喝了我从街上捡来的毒药瓶就死了；我告诉过你它很贵，而且我没说过它对你的健康有好处。"
  npc_override_1@jtb_NightmarishJitterbug_i_miss_delectable_combin_4dfa54: "我想念那道美味的牛肉和橡子组合菜，叫做 Bifrost 烤牛肉。"
  npc_override_1@jtb_NightmarishJitterbug_i_never_slack_my_trainin_691c18: "我从不懈怠训练。"
  npc_override_1@jtb_NightmarishJitterbug_i_practice_hard_so_i_9d7ba1: "我努力练习，这样我就能在危险时刻大放异彩。"
  npc_override_1@jtb_NightmarishJitterbug_i_remembered_few_things_227aca: "我想起了一些事情。"
  npc_override_1@jtb_NightmarishJitterbug_i_said_green_potion_3d7fab: "我说的是绿色药水！"
  npc_override_1@jtb_NightmarishJitterbug_i_see_what_made_you_4fedee: "我明白是什么让你变得如此暴躁了，主人。"
  npc_override_1@jtb_NightmarishJitterbug_i_should_plenty_time_bef_d08d97: "我应该还有足够的时间来摆脱你。我会让你知道为什么我被叫做驱魔界的坏男孩。"
  npc_override_1@jtb_NightmarishJitterbug_i_should_try_one_6a6cac: "我该试试。"
  npc_override_1@jtb_NightmarishJitterbug_i_shouldn_t_led_you_93c603: "我不该带你们来这里，但我真的很想要一些朋友。"
  npc_override_1@jtb_NightmarishJitterbug_i_t_tell_you_just_924678: "我现在还不能告诉你，但它们对我很有用。把它们带来，我会给你一些纽沃斯囤积的战利品作为回报。"
  npc_override_1@jtb_NightmarishJitterbug_i_think_i_ability_take_56246c: "我想我有能力带人一起去任何地方。否则你们也不会跟我走到这么远。"
  npc_override_1@jtb_NightmarishJitterbug_i_think_i_fit_pendant_d94fe2: "我想我可以把和谐吊坠和混沌吊坠合在一起。"
  npc_override_1@jtb_NightmarishJitterbug_i_think_she_305a92: "我想她是的。"
  npc_override_1@jtb_NightmarishJitterbug_i_think_someone_made_my_e14a30: "我想有人实现了我的愿望。"
  npc_override_1@jtb_NightmarishJitterbug_i_thought_someone_made_m_f3dad1: "我以为有人实现了我的愿望。"
  npc_override_1@jtb_NightmarishJitterbug_i_thought_you_d_gotten_fb861a: "我还以为你已经习惯了我隐形在你身边呢。"
  npc_override_1@jtb_NightmarishJitterbug_i_told_you_newoz_we_10ab54: "我告诉过你，纽沃斯。我们不能就这样算了。"
  npc_override_1@jtb_NightmarishJitterbug_i_tried_some_trace_him_8627e8: "我试图追踪他，但毫无结果。"
  npc_override_1@jtb_NightmarishJitterbug_i_turned_my_eyes_other_346a1f: "我把目光转向异世界，在那里我遇到了一些目击者。他们带我去看了纽沃斯最后被看到的地方。"
  npc_override_1@jtb_NightmarishJitterbug_i_ve_followed_aigu_all_d6eb25: "我一直跟着艾古来到这里。"
  npc_override_1@jtb_NightmarishJitterbug_i_ve_found_so_much_72050d: "通过这次冒险我找到了很多灵感。我希望能写一些好歌。"
  npc_override_1@jtb_NightmarishJitterbug_i_ve_harvested_few_mushr_24a130: "我采了一些蘑菇来尝尝。"
  npc_override_1@jtb_NightmarishJitterbug_i_ve_joined_guild_meet_c26942: "我加入这个公会是为了见你，纽沃斯。你有女朋友吗？"
  npc_override_1@jtb_NightmarishJitterbug_i_ve_learned_best_002c6c: "我向最好的学到了。"
  npc_override_1@jtb_NightmarishJitterbug_i_ve_stolen_few_strands_b75375: "我从沙洛希那里偷了几根头发，想着有一天可能会派上用场。我想分析一下它们，虽然我已经知道结果了。"
  npc_override_1@jtb_NightmarishJitterbug_i_ve_trained_enough_i_0a00c2: "我已经训练够了。我可以派上用场。"
  npc_override_1@jtb_NightmarishJitterbug_i_ve_waited_you_because_b12497: "我一直在等你，因为我想和你谈谈。"
  npc_override_1@jtb_NightmarishJitterbug_i_want_dance_as_well_f98281: "我想跳得像艾古一样好。"
  npc_override_1@jtb_NightmarishJitterbug_i_want_go_home_i_524955: "我想回家。我真的想洗个澡，吃些面包。"
  npc_override_1@jtb_NightmarishJitterbug_i_want_stay_as_bard_023d2d: "我想暂时继续当吟游诗人。"
  npc_override_1@jtb_NightmarishJitterbug_i_wish_these_monsters_as_dbb921: "我希望这些怪物能像跆拳道任务中的那些波利一样可爱无助。"
  npc_override_1@jtb_NightmarishJitterbug_i_won_t_accept_anything_69e888: "我什么都不会接受，少于 50 个 Jitterbug 牙齿免谈。"
  npc_override_1@jtb_NightmarishJitterbug_i_won_t_take_no_4f8f91: "我不会接受拒绝！"
  npc_override_1@jtb_NightmarishJitterbug_i_wonder_what_might_wait_93dab4: "我想知道这条通道的尽头有什么在等着我们。这种期待让我兴奋死了！"
  npc_override_1@jtb_NightmarishJitterbug_if_i_results_incredible_185a03: "如果我做到了，结果将会不可思议！"
  npc_override_1@jtb_NightmarishJitterbug_if_i_take_ferre_me_0c26ba: "如果我把 Ferre 带到另一个空间，那么许多出口会出现在松动的时空裂缝中。"
  npc_override_1@jtb_NightmarishJitterbug_if_my_description_combin_dc140b: "如果我对组合结果的描述让你感到奇怪的熟悉，那我就不知道了。但这就是我设想的结果。如果你找到了两个吊坠，把它们带给我，好吗？"
  npc_override_1@jtb_NightmarishJitterbug_if_you_find_my_joke_566581: "如果你觉得我的笑话好笑，别藏着。笑出来吧。"
  npc_override_1@jtb_NightmarishJitterbug_if_you_re_interested_joi_27667c: "如果你有兴趣加入我们，请和露兰谈谈。我们有一场激动人心的冒险在等着我们。"
  npc_override_1@jtb_NightmarishJitterbug_if_you_re_interested_joi_dcc64f: "如果你有兴趣加入我们，请和露兰谈谈。"
  npc_override_1@jtb_NightmarishJitterbug_if_you_want_use_my_a37953: "^ff0000如果你想使用我的次元 portal，你必须先和 Roel 谈话。这个 portal 不是对所有人开放的。^000000"
  npc_override_1@jtb_NightmarishJitterbug_if_you_want_you_go_609bc1: "如果你愿意，你可以回到过去，再次经历同样的事件。你想再次踏上冒险之旅吗？"
  npc_override_1@jtb_NightmarishJitterbug_impenetrable_defense_roe_9f0bb8: "固若金汤的防御！Roel 流护卫！"
  npc_override_1@jtb_NightmarishJitterbug_isn_t_good_time_chit_00143c: "现在不是闲聊的时候。我从你站立的地板和我藏身的地方都感觉到了什么。"
  npc_override_1@jtb_NightmarishJitterbug_its_interior_looked_like_4c751a: "它的内部看起来像森林，然后又变成了洞穴。真奇怪。"
  npc_override_1@jtb_NightmarishJitterbug_jack_why_you_re_hiding_b03c6c: "Jack，这就是你像懦夫一样躲起来的原因吗？"
  npc_override_1@jtb_NightmarishJitterbug_just_trust_me_drink_766fb3: "相信我，喝下去！"
  npc_override_1@jtb_NightmarishJitterbug_keep_name_i_m_out_62c09e: "留着这个名字吧。我退出。"
  npc_override_1@jtb_NightmarishJitterbug_kind_5fad66: "善良。"
  npc_override_1@jtb_NightmarishJitterbug_last_bastion_54f748: "最后的堡垒！"
  npc_override_1@jtb_NightmarishJitterbug_later_i_heard_newoz_sing_3c008c: "后来我听到纽沃斯在等朋友的时候唱歌。他的声音温暖了我。"
  npc_override_1@jtb_NightmarishJitterbug_leave_him_7e6a2c: "别管他了。"
  npc_override_1@jtb_NightmarishJitterbug_let_me_go_look_possible_16d752: "让我去寻找可能的威胁。"
  npc_override_1@jtb_NightmarishJitterbug_let_s_begin_d8e4b0: "我们开始吧！"
  npc_override_1@jtb_NightmarishJitterbug_let_s_go_d7f55d: "走吧。"
  npc_override_1@jtb_NightmarishJitterbug_let_s_make_truce_now_2e421a: "我们暂时休战吧。但别搞错了——纽沃斯一有破绽就是我的。"
  npc_override_1@jtb_NightmarishJitterbug_let_s_move_before_they_bbf38c: "趁他们还没忘记我们，快走吧。"
  npc_override_1@jtb_NightmarishJitterbug_listen_humans_monsters_t_eaaafc: "听着，人类和怪物不能成为朋友。至少我是这么认为的。"
  npc_override_1@jtb_NightmarishJitterbug_little_girl_strange_plac_b977a7: "一个小女孩独自在这个奇怪的地方？嗯，你不觉得奇怪吗？"
  npc_override_1@jtb_NightmarishJitterbug_love_your_song_7fc676: "喜欢你的歌。"
  npc_override_1@jtb_NightmarishJitterbug_magic_attacks_enemies_ca_53d057: "来自敌人的魔法攻击会施放 1 级自动魔法漩涡。"
  npc_override_1@jtb_NightmarishJitterbug_man_singing_voice_84623d: "会唱歌的男人。"
  npc_override_1@jtb_NightmarishJitterbug_master_bd3b20: "主人！"
  npc_override_1@jtb_NightmarishJitterbug_master_come_me_a4eb4a: "主人，跟我来！"
  npc_override_1@jtb_NightmarishJitterbug_master_please_ebfec6: "主人，拜托了！"
  npc_override_1@jtb_NightmarishJitterbug_maybe_newoz_interested_d_15b6c1: "也许纽沃斯对约会不感兴趣。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_0360c4: "艾古:那个笨蛋只对冒险感兴趣。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_070060: "艾古:哇，露兰。你真可爱！"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_0d9100: "艾古:很简单。微笑就好。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_1587c7: "艾古:你看起来很喜欢 Roel。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_191b5b: "艾古:刚才我还牵着沙洛希的手，下一刻她就消失了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_223cd2: "艾古:你最好比我认识的某个人更可靠。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_231702: "艾古:Pam，pam，pam，pam~"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_2520f6: "艾古:纽沃斯，你除了肉什么都吃不了。唉，我很高兴你安全了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_2bd4eb: "艾古:这是茧，因为我跳舞。嘿嘿。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_34e4b3: "艾古:绿色药水！"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_4b3bc6: "艾古:是吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_5164c0: "艾古:除非我死了！"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_57d78f: "艾古:真奇怪。她从一开始就告诉纽沃斯了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_6234c0: "艾古:……"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_69b6e1: "艾古:希望你错了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_6c4542: "艾古:告诉我一些我不知道的事情。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_6c6668: "艾古:我有一瓶快过期的绿色药水，所以我们决定玩石头剪刀布，输的人喝掉它。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_6dd620: "艾古:嗯，我没有……"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_6ec8c5: "艾古:你敢——是我先预订他的！"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_712a59: "艾古:喝！喝！"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_79a617: "艾古:好的。牵我的手。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_7cc95b: "艾古:纽沃斯，你没事吧？"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_8846d4: "艾古:纽沃斯，我跟你一起去！"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_8b8adc: "艾古:怪物开始出现，而且数量正在迅速增加。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_8ebd05: "艾古:我不在乎。我要和纽沃斯待在一起。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_8f3834: "艾古:你在说什么？为什么不跟着我们？露兰在哪里？我刚才还看到她在我身边。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_9387e9: "艾古:哦，对不起，但我快要哭出来了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_97a240: "艾古:你呢，冒险者？你的另一半怎么样？"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_9c86c0: "艾古:单相思是痛苦的。你最好在它伤害你之前放手。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_a42fd5: "艾古:纽沃斯！这次你又去哪里了？"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_aaeb97: "艾古:别闹了。沙洛希，跟我们说话。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_ac1840: "艾古:你是认真的吗？连你这样的人都找到了爱情。那我呢？！"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_b71828: "艾古:怪物——！……嗯，只是个女人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_b98f44: "艾古:如果不是因为某个人，我们根本不需要来这里。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_ba4b15: "艾古:你今天才见到他，但除非你是傻瓜，否则你应该知道。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_c0bcda: "艾古:冷静点。只是个女人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_caebfa: "艾古:等等，我们还没说完呢！"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_d0960a: "艾古:你会跑得比这里所有人都快。好了，我们不能待在这里。我们继续前进吧。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_dbc644: "艾古:她可能还没记起所有事情，但这是进步。等她准备好再说更多吧。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_dd6a23: "艾古:哦，你说得对！"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_df7366: "艾古:你问我们是怎么进来的？"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_e55d70: "艾古:我还要扭多久的肩膀~"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_e7b5a5: "艾古:听起来真差劲。"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_f836f7: "艾古:我不介意良性竞争，但我更喜欢友谊，无论它能持续多久。"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_244389: "阿朗:*哼* 你说普隆德拉下水道的时候也是这么说的。"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_29c054: "阿朗:只要你跟着我们就没事的，艾古……嗯，大家都去哪了？"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_303414: "阿朗:你去哪了？我们刚才遇到了一个很棒的怪物！"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_32ab1a: "阿朗:公会成员可以互相争吵，但他们仍然是家人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_379083: "阿朗:但苦得要命。"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_56cfda: "阿朗:她们在争夺纽沃斯吗？我也要加入！"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_6567e4: "阿朗:好的！"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_848739: "阿朗:不，他的冒险者本能已经生锈了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_88353c: "阿朗:纽沃斯，我爱你！"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_a379cc: "阿朗:真差劲。"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_a466bf: "阿朗:耶！走吧！"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_a60e5b: "阿朗:呜，我不想喝这个！"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_ab4c25: "阿朗:哇，纽沃斯！你的眼睛看起来比以前更肿了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_bbbc2e: "阿朗:同意。他暴力、肮脏……"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_d15f42: "阿朗:什么？"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_e63575: "阿朗:Roel，你不能替你妹妹喝吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_ee1780: "阿朗:我希望是个强大的怪物！"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_eff7e7: "阿朗:Jack，这就是你像懦夫一样躲起来的原因吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_f684e0: "阿朗:你看到沙洛希了吗？她在哪里？"
  npc_override_1@jtb_NightmarishJitterbug_menu_def_df0b18: "DEF: 0 重量: 10 要求等级: 130"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_278ab6: "Ferre:Ferre，ferre，fe-！"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_9ee293: "Ferre:Ferre，ferre，ferre，ferre-！"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_a16140: "Ferre:FERRE，FERRE，FERRE-！"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_bbb63a: "Ferre:Ferre，ferre！"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_be0952: "Ferre:Ferre，ferre，ferre！"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_c95b1c: "Ferre:FERRE- FERRE- FERRE- FERRE-！！"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_dda2e9: "Ferre:Ferre……"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_09b9ef: "Gelka:我们开始吧！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_1825fd: "Gelka:第8场:英雄被一群敌人包围。Roel，我们来编排一下今天练习的内容，好吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_18ff9d: "Gelka:散开——千闪光！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_1b6fca: "Gelka:嘿，科幻。有一种机械工具可以运作……"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_1cfdba: "Gelka:哦，这就像重现书中怪物肆虐的场景。"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_26fd45: "Gelka:我检测到前方有电磁波。至少是 E 级怪物。"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_28d947: "Gelka:哦，伟大冒险者的本能！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_33b0f0: "Gelka:主人！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_3bc2e3: "Gelka:Gelka 流精神力！铁壁身躯！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_3ee505: "Gelka:！！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_5410af: "Gelka:特技全靠名字。喊出响亮的名字就足以震慑敌人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_5baaf1: "Gelka:你真扫兴，你知道吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_6b162c: "Gelka:毁灭十二天网！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_709885: "Gelka:Rot？那是你的昵称吗，主人？你们是朋友吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_76f01b: "Gelka:主人，拜托了！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_77c9b3: "Gelka:……呼。"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_8f5df4: "Gelka:CROSS！！！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_9047c0: "Gelka:最后的堡垒！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_9c35a4: "Gelka:我明白是什么让你变得如此暴躁了，主人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_a20704: "Gelka:你就是著名的纽沃斯！很高兴认识你。我的主人告诉了我很多关于你的伟大事迹……"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_d0dcf9: "Gelka:是的，主人！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_d53b5c: "Gelka，超特级技能第8号:狂舞！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_e4adce: "Gelka:主人，跟我来！"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_fae96b: "Gelka:嗯，对话似乎已经……"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_fbffe1: "Gelka:我向最好的学到了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_i_44045b: "……我现在自由了，但这改变不了我是谁:一个恶魔。"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_34488d: "Lagi:我想暂时继续当吟游诗人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_35c499: "Lagi:击个掌！"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_38ecec: "Lagi:她说她有。"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_429614: "Lagi:Roel，我想我们也该走了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_579346: "Lagi:哦，她们两个都走了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_608ce4: "Lagi:她转换话题的速度比 Arclouse 施放加速术还快。"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_640e3c: "Lagi:嘿，跟我来！"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_6a745d: "Lagi:嗯，你在试着吹口哨吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_82d110: "Lagi:会不会是超自然现象？"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_852cd5: "Lagi:但是怎么……？！还没发布呢。"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_901406: "Lagi:我就让你们……"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_927aaa: "Lagi:我们又见面了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_a01ee5: "Lagi:等待下雪~"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_ad0184: "Lagi:！！！"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_aeed02: "Lagi:我永远说不出那个名字。艾古，你确定要跟着这些人吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_bb4ea0: "Lagi:有别的东西出现了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_145e5b: "Melody-Jack:对于我这样的资深盗贼来说，隐藏在潜在敌区是本能。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_1e5fa3: "Melody-Jack:你很聪明，还会传送。Roter，我们不能让她走。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_1f4ce3: "Melody-Jack:纽沃斯，我知道你脑子有问题，但她……"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_2cc66f: "Melody-Jack:我不是成员，但如果你问我的话，那个名字……"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_3f1036: "Melody-Jack:一直以来，我感受到的异种能量越来越强烈。情况不妙。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_41c5e2: "Melody-Jack:我猜也是。顺便说一下，我们一直在同一个地方绕圈子。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_5fd661: "Melody-Jack:纽沃斯，你的合同在你回到公会时就已经到期了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_692802: "Melody-Jack:最好快点解决他。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_6bd255: "Melody-Jack:我一直在等你，因为我想和你谈谈。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_70cbc2: "Melody-Jack:你还指望什么？他满脑子想的都是冒险、怪物和宝藏。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_82f44a: "Melody-Jack:纽沃斯。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_908a19: "Melody-Jack:我还以为你已经习惯了我隐形在你身边呢。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_919c3a: "Melody-Jack:他不知道是因为他从来不用脑子。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_998c47: "Melody-Jack:我担心这个地方正在我们周围坍塌。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_99c165: "Melody-Jack:但考虑到目前的情况，我对你的承诺仍然有效。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_b957df: "Melody-Jack:哇，这个地方撑不了多久了——看地面震得多厉害！我们真的需要像昨天一样赶快离开，纽沃斯。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_ba1077: "Melody-Jack:趁他们还没忘记我们，快走吧。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_bba14b: "Melody-Jack:我不是在躲，因为我的精灵图还没准备好！"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_bf0bd3: "Melody-Jack:你这个笨蛋，那不值钱。你的合同已经到期了，但承诺就是承诺，我打算信守它。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_f69fba: "Melody-Jack:现在不是闲聊的时候。我从你站立的地板和我藏身的地方都感觉到了什么。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_f85e01: "Melody-Jack:哼，要知道我信守对你的承诺只是因为你拥有我想要的东西。"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_fdc6cb: "Melody-Jack:……"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_fdc917: "Melody-Jack:我告诉你，我们一直在同一个地方绕圈子。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_00832a: "Mingmin:一个梦。梦中的低语。什么样的梦？"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_00ad6e: "Mingmin:我该试试。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_03bbbe: "Mingmin:我们一离开这里就再聊。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_0488fa: "Mingmin:几乎没什么味道。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_0c8bdf: "Mingmin:除了你，你是说。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_165751: "Mingmin:你没中毒的时候它不会有任何效果。我们只是不想浪费好药水。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_18bfd8: "Mingmin:我们很快就会知道。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_32c50c: "Mingmin:那我们离开这里吧。我们现在正处于严重的危险中。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_32f46c: "Mingmin:哦，我们有新成员了？太好了，我有几个蘑菇一直想尝尝……"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_390996: "Mingmin:嗯……"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_397f23: "Mingmin:他天生脾气暴躁。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_3a36b9: "Mingmin:……抱歉打扰你们，但我想那边有什么东西。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_3b35a5: "Mingmin:相信我，喝下去！"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_3f0e25: "Mingmin:哇，你甚至能听到怪物在想什么？"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_41279a: "Mingmin:别想了，保留旧名字就好。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_48cdb5: "Mingmin:你真的需要问吗？那个女孩是谁？她是你的吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_492c0a: "Mingmin:纽沃斯！"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_4957da: "Mingmin:我希望有很多可以研究的东西。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_551f9a: "Mingmin:我不会接受拒绝！"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_64e219: "Mingmin:我同意。而且这个空地既不紧凑也不宽敞。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_690eda: "Mingmin:你现在说话像个成年人了，圆滑而清晰。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_69ed97: "Mingmin:奇怪的地形上长着奇怪的植物。一切看起来都不对劲。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_6cc4e9: "Mingmin:我同意 Jack 的看法。这个地方的一切——从空气到土壤——都透着不自然。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_6cf7c1: "Mingmin:喝！喝！"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_6d49e2: "Mingmin:由你决定，新主人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_70001e: "Mingmin:不。我只是说环境变化太剧烈了，几乎像躁郁症患者的情绪波动。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_7062be: "Mingmin:那个裂缝，或者说入口，已经消失了。如果你真的想离开，那就跟着艾古。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_849e23: "Mingmin:你还记得你们两个在普隆德拉南门为那个花店女孩打架的时候吗？或者东门的玩偶商人因为你们争吵赶走顾客而揍你们的时候？"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_8bfdcf: "Mingmin:我采了一些蘑菇来尝尝。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_8cc427: "Mingmin:你比我想象的勇敢。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_8ff06a: "Mingmin:你能说话，还能听到别人的想法。真聪明。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_92c284: "Mingmin:考虑到我们浪费在你身上的时间和金钱，你该被喂一篮子毒蘑菇。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_9cd2fb: "Mingmin:哦，我记得！那太好笑了！"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_a11b0e: "Mingmin:那你玩枯树枝玩到累死的时候呢？或者你和你的妖术师朋友们玩 Hocus Pocus 把自己玩死的时候呢？"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_a4afe7: "Mingmin:不，我没有！你不想惹我生气吧，小姑娘。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_abcb9a: "Mingmin:唉，真是浪费时间。你应该先走。我还有一样东西想看。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_ac30a1: "Mingmin:留着这个名字吧。我退出。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_aeafab: "Mingmin:推，推~"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_b070bc: "Mingmin:准备好了吗？走吧！"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_b19898: "Mingmin:一个小女孩独自在这个奇怪的地方？嗯，你不觉得奇怪吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_b8b74c: "Mingmin:……"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_b8cce8: "Mingmin:这个蘑菇有毒，但不致命。你想咬一口吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_b96d33: "Mingmin:我稍后再研究你，小姑娘。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_bcd2ed: "Mingmin:它的内部看起来像森林，然后又变成了洞穴。真奇怪。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_c111e1: "Mingmin:我不知道为什么，但事物正在失去形状，仿佛正在消失。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_d90038: "Mingmin:空气闻起来不一样，事物看起来不那么清晰可辨。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_d94a2f: "Mingmin:你没反应。也许蘑菇根本没有毒。也许我该试试……"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_dab64a: "Mingmin:绿色药水"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_db08d6: "Mingmin:我感觉有什么东西会砰的一声出现在我们眼前。"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_ec95e4: "Mingmin:Chica，chica~"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_f7fdb0: "Mingmin:嗯？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_075aaf: "纽沃斯:哇！天哪！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_08d2b1: "纽沃斯:呼，是你啊 Jack。好久不见，各位。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_10cfca: "纽沃斯:你觉得我们继续深入没有意义吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_127bf7: "纽沃斯:谢谢。我很高兴我的应急计划还在。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_12c8ce: "纽沃斯:你不是有危险吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_1bbcc4: "纽沃斯:这是我很久以来第一次和老朋友们一起冒险。我希望我们能很快再来一次。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_20702f: "纽沃斯:我必须找到她。我必须和她谈谈。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_24c867: "纽沃斯:嗯，我怎么又把其他人弄丢了呢？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_2f6065: "纽沃斯:哈哈，你真可爱。我稍后会为你唱歌。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_2f8892: "纽沃斯:再见。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_31d87d: "纽沃斯:我喜欢他的精神，虽然我看得出他已经很疲惫了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_3402d6: "纽沃斯:我们必须找到沙洛希！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_34e672: "纽沃斯:嗯，人各有志。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_396e7c: "纽沃斯:我们应该找到她。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_3a52c8: "纽沃斯:别担心。我会帮你！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_3aacae: "纽沃斯:啊，我饿了。怪物们去死吧。沙洛希，我们走！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_3c2b97: "纽沃斯:我没事。Rot，你在担心我吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_3c401e: "纽沃斯:谢谢。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_413491: "纽沃斯:漆黑的黑暗……你不记得别的了吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_4215ee: "纽沃斯:击个掌！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_45eb7d: "纽沃斯:好吧，如果我不能说服他放弃，那我们就只能打一架了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_4ade72: "纽沃斯:哈哈，别担心，小姑娘们。我会保护你们的。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_53df38: "纽沃斯:哦，对了。既然我不再是主人，我的合同自然就到期了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_541703: "纽沃斯:漆黑的黑暗……除了雾之外，洞穴里到处都是明亮的。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_58fe92: "纽沃斯:{0}，你有喜欢的歌吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_59fc46: "纽沃斯:而你有他们。我们。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_5b6804: "纽沃斯:所以我对这个地方像迷宫一样的判断是对的。呜，我又饿了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_5c08f4: "纽沃斯:嘿，我的本能告诉我慢下来，因为前方有危险。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_5f7dc5: "纽沃斯:！！！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_5fda0a: "纽沃斯:季节又变了~ 我还没有机会用凤仙花染指甲呢~"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_665ad1: "纽沃斯:我可以！Mingmin 喝了我从街上捡来的毒药瓶就死了；我告诉过你它很贵，而且我没说过它对你的健康有好处。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_6dda71: "纽沃斯:不，沙洛希。从今天开始，你是纽沃斯的白翼公会的新成员了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_6eaeef: "纽沃斯:阿朗！沙洛希！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_71622a: "纽沃斯:奇怪……气氛变了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_72836e: "纽沃斯:在我唱歌之前有个声音。可能还有别人在这里。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_72e68a: "纽沃斯:我们开始吧！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_77787c: "纽沃斯:怪物？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_7d541d: "纽沃斯:是啊，你不必告诉我。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_80126a: "纽沃斯:哦，恭喜你，主人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_8bed94: "纽沃斯:哈哈，这很尴尬，但谢谢你。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_8f6d8e: "纽沃斯:艾古是当下卢恩-米德加尔特最炙手可热的歌手！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_90828b: "纽沃斯:你已经解决他们了吗？我也想参加！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_964bc2: "纽沃斯:抱歉。这个地方像个迷宫。支路和空地太多了，我都数不清了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_986a75: "纽沃斯:看来大家都到齐了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_994876: "纽沃斯:农夫对绿南瓜说了什么？你为什么不是橙色的？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_9f2009: "纽沃斯:*喘气* 我很高兴你没走太远。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_b1258a: "纽沃斯:什么？你改公会名字了吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_b5db1d: "纽沃斯:哦，你好。请问你是哪位，小姑娘？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_b98f5d: "纽沃斯:这些怪物不停地来。但那些大的、稀有的、漂亮的怪物都去哪了？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_bc51bb: "纽沃斯:我们还有危险吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c035a5: "纽沃斯:有你们两个在身边让我回忆起了很多往事。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c2519a: "纽沃斯:哦，你是说这个尤克里里？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c3e6b5: "纽沃斯:我总是跟丢其他人。他们就在我面前。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c419d6: "纽沃斯:沙洛希，你有喜欢的歌吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c62008: "纽沃斯:*喘气* 我找到你了，沙洛希。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c9587d: "纽沃斯:哦，我记得！啊，美好的时光！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ccfff0: "纽沃斯:你好，阿朗。阿里郎怎么样？嘿。什么风把你吹来了？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_cfb644: "纽沃斯:我知道。你不必提醒我。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_d09730: "纽沃斯:其他人都去哪了？嘿，新来的，帮帮我。那个 Ferre 看起来很强。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_d60679: "纽沃斯:阿朗，走吧。该去冒险了！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_dc6b84: "纽沃斯:这让我想起，Rot 年轻的时候……"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_dd17da: "纽沃斯:你是 Lagi，对吧？我喜欢你的思维方式。我很想找个时间和你一起工作。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_e32e52: "纽沃斯:你不必生气。我不是来抢走你朋友的。我只是想……"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_e6b84c: "纽沃斯:什、什么……？！别荒谬了。我刚才才找到她。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_e8223b: "纽沃斯:我想只要能唱歌和演奏，职业不重要吧？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ea6b74: "纽沃斯:你品味不错。这是刚想到的。听好了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_eb2577: "纽沃斯:你知道她的出道曲。你是她的粉丝吧？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ed1e10: "纽沃斯:爱管闲事的辣椒会做什么？去搞墨西哥胡椒的生意！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ed6eb3: "纽沃斯:或者说是异世界的。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ed9acc: "纽沃斯:你很棒。你会成为出色的舞娘和宫廷乐师。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ee3e41: "纽沃斯:为什么香蕉要涂防晒霜？因为它们会剥皮！"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_f1895e: "纽沃斯:是啊，怎么了？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_f2f936: "纽沃斯:我不再是你的主人了。你不必跟着我。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_f4b5fb: "纽沃斯:啊，有鬼吗？还是我听错了？"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_f88592: "纽沃斯:我会解释一切的。别再提毒蘑菇了。我根本不能吃蘑菇。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_f8b736: "纽沃斯:哈哈，我稍后会教你怎么做的，沙洛希。"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_fa94e8: "纽沃斯:对，她是这么说的。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_0037b3: "{0}:我们很幸福。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_163774: "{0}:你都不知道我有没有另一半。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_17f24e: "{0}:我喜欢艾古的出道曲，迷失的波利。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_207369: "？？？:……"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_3e9f89: "{0}:我喜欢艾古的单曲，只有我不知道卡册的事。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_458093: "？？？:…"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_4d0af3: "？？？:什么都不记得了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_510d06: "{0}:我的爱是单相思。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_5a17f7: "{0}:我喜欢你的红色药水（feat. Muka）。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_7efbaa: "？？？:男人的声音……"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_8588c7: "？？？:但我不是一个人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_8e6bb9: "{0}:确实很棒！"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_98101b: "{0}:你只是为了装酷才编了那些词！"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_aab0d1: "{0}:也许她听到了自己的想法。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_adbe9e: "？？？:跳舞……"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_b14955: "{0}:也许她在和某人说话。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_b7c197: "？？？:艾古和露兰很好。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_be6ff2: "？？？:问很多问题。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_c1da29: "？？？:会唱歌的那个人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_c27e15: "？？？:是什么？"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_d4b99c: "？？？:你的手……很温暖。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_d79052: "？？？:不知道。你们是怎么进来的？"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_e8e4f1: "？？？:我不是一个人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_ed441a: "{0}:我喜欢 Laggi 的自作曲，意外的月光。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_f2a07b: "？？？:善良。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_f39449: "？？？:会唱歌的男人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_fb32fd: "？？？:我没事。又不是第一次了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_feb88c: "？？？:无法回答。"
  npc_override_1@jtb_NightmarishJitterbug_menu_party_2e5e7f: "队伍名称:{0}"
  npc_override_1@jtb_NightmarishJitterbug_menu_party_8c7899: "队伍领袖:{0}"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_0076b4: "Roel:但你在唱一首奇怪的歌，还有……绿色药水？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_23418f: "Roel:她可能是闭着眼睛的。也许她在睡觉。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_2439e8: "Roel:……"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_268473: "Roel:绿色药水？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_351c82: "Roel:让我去寻找可能的威胁。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_3de954: "Roel:抱歉。我不会再让你失望了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_43fb27: "Roel:你、你好，我叫 Roel。露兰和我是一起加入公会的。很高兴认识你。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_44e243: "Roel:你想给这孩子喂什么？这个绿色瓶子里是什么？……不……"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_4e8bdd: "Roel:CROSS！！！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_60b548: "Roel:我们一直在努力练习。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_675223: "Roel:我做你的朋友怎么样？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_740455: "Roel:沙洛希，我不在乎你是谁。你是我的朋友，我也是你的朋友。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_8a451e: "Roel:Gelka，准备！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_8c4d61: "Roel:但现在……"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_8e63ef: "Roel:最后的堡垒！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_8ec3da: "Roel:它们看起来很可爱，但很凶猛。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_928233: "Roel:我希望你也能教我，Roter。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_9972f4: "Roel:同伴之间不该互相争斗。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_a375c5: "Roel:固若金汤的防御！Roel 流护卫！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_b08e81: "Roel:Ferre？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_b2da90: "Roel:天哪，Gelka，你太厉害了！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_c72bf3: "Roel:纽沃斯，你知道会发生这种事吗？你很幸运有这样好的朋友。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_d07ff1: "Roel:她是不是失去记忆了？看起来她似乎不理解危险。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_d35363: "Roel:她可能被吓坏了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_d8dc27: "Roel:（她很善良！）"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_e020df: "Roel:我不喜欢这个。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_e879c7: "Roel:也许是怪物。你要我去查看吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_ea0852: "Roel:但它停留的时间足够长，让我们彼此走散了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_ec0346: "Roel:绿色药水很苦……嗯，你说绿色药水？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_f24875: "Roel:（她生气的时候好辣！）"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_f46a2c: "Roel:别担心——我会保护你的！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_f9e1bc: "Roel:（她正是我喜欢的类型！）"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_ff1479: "Roel:走吧。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_020b9d: "Roter:梦罗克？！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_0488ed: "Roter:哦，你们两个都闭嘴！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_0ade04: "Roter:谁允许你邀请她的？我不会接受一个恶魔！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_0f1fab: "Roter:别假装你关心我！我可以照顾好自己！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_14c1df: "Roter:……"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_1e992e: "Roter:别看我。那是出口吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_2d399c: "Roter:你就不能想些美好的回忆吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_36a498: "Roter:嘘！今天已经够多了。你们都被解雇了！Roter 的超级关键公会冒险到此结束！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_391318: "Roter:当然！现在它叫……嗯……"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_418584: "Roter:够了。他只是个没有方向感的白痴。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_43699e: "Roter:不，我要叫它 Roter 的超级关键公会！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_46781e: "Roter:散开——千闪光！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_468fc0: "Roter:看起来我们好像在水下，但我感觉不到。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_4fdcf9: "Roter:他只是在偷懒。他没那么弱。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_5238fb: "Roter:我们分成两队。小心别在迷宫般的支路中迷路。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_57d4f7: "Roter:我是唯一对这个对话不高兴的人吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_5ff0d1: "Roter:纽沃斯！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_78bcd2: "Roter:我告诉过你，纽沃斯。我们不能就这样算了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_798237: "Roter:嘿，你最近在看什么书？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_7fde07: "Roter:纽沃斯。需要我提醒你吗，这个公会不再叫纽沃斯的白翼了？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_84248f: "Roter:我是公会会长！我想叫它什么就叫什么！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_86aa8d: "Roter:纽沃斯，你就像一块吸引疯子的磁铁。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_87197d: "Roter:啊！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_896d38: "Roter:我倔得像头骡子，还忙着假装自己知道在做什么。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_929002: "Roter:你就没有关于我们的美好回忆吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_9c05a2: "Roter:……这不是我预期的。你一点都不难过吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_a314d7: "Roter:我们要被埋在这里了。我们找个出口吧。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_a37666: "Roter:他没死。各位，我理解你们是新人，但不能犯这种错误。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_a50383: "Roter:纽沃斯，你还活着！很好，因为我要杀了……"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_a5e76c: "Roter:根据公会条例第8条，我现在是这个公会的主人，而你只是个成员。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_aac83e: "Roter:我们会找到纽沃斯和沙洛希的。当我们找到他们时，我要杀了他们两个。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_b1e2fd: "Roter:别说话了，准备好练习你们的特技。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_b6f968: "Roter:纽沃斯，你知道你失踪了多久吗？我们甚至招募了新公会成员来找你，而且……"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_b91ad3: "Roter:嗯，还不够好，Gelka。别让公会事务分散你练习的注意力。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_ceb4e9: "Roter:CROSS！！！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_cfef9c: "Roter:保护你免受什么？"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_d19727: "Roter:其他人都去哪了？这绝对不是普通的洞穴。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_d3fa59: "Roter:我会在怪物之前杀了你们两个。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_dcc64b: "Roter:Gelka，超特级技能第8号:狂舞！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_df234a: "Roter:精致手电筒，Lumiere Dupleix！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_e5af4a: "Roter:你不能那样做！"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_f0650f: "Roter:我应该还有足够的时间来摆脱你。我会让你知道为什么我被叫做驱魔界的坏男孩。"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_f6f8aa: "Roter:够了！我要走了！"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_0685e7: "露兰:你留在这里，小鬼。我去。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_091958: "露兰:*吹*"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_0a1ba4: "露兰:别太相信这孩子。我最好去找纽沃斯。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_0daed6: "露兰:你身上没有我喜欢的地方。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_1c5ec5: "露兰:我没事。我告诉过你要小心，小鬼！"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_1cae58: "露兰:我知道——如果我约他出去，他会拒绝的。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_20e814: "露兰:有东西！有东西！"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_225486: "露兰:别搞得那么尴尬！我们年龄差不多，所以我们已经是朋友了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_34506a: "露兰:雾散了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_356b28: "露兰:没错。你听话的时候我更喜欢你。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_371741: "露兰:我说的是绿色药水！"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_4a9141: "露兰:她叫沙洛希？我问了她好几次，她都没告诉我。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_4f9c60: "露兰:推，推~"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_53b8bc: "露兰:我加入这个公会是为了见你，纽沃斯。你有女朋友吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_583fe7: "露兰:哼，我讨厌女孩子。我有种预感我们会看到更多怪物。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_5dbf09: "露兰:你认识纽沃斯吗？我们把他从这里带出去吧。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_620c52: "露兰:Pam，pam，pam~"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_627201: "露兰:我想她是的。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_733f6f: "露兰:别那样叫我的英雄！……但我同意你的看法。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_754e35: "露兰:别想太多了——这只是临时照看孩子而已！"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_812400: "露兰:我想他不知道。你知道吗，纽沃斯？"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_83f252: "露兰:嗯，我有种预感有什么东西会突然从某处跳出来攻击我们。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_89a23e: "露兰:我们暂时休战吧。但别搞错了——纽沃斯一有破绽就是我的。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_8c6e58: "露兰:我对那个孩子不感兴趣。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_8cabd3: "露兰:也许纽沃斯对约会不感兴趣。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_8e5c74: "露兰:但你还没试着和他说话。我是说认真的，你试过了吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_9cfcfe: "露兰:我只是不喜欢这个名字。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_a7dbbc: "露兰:听着，人类和怪物不能成为朋友。至少我是这么认为的。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_ac330f: "露兰:我们迷路了，现在被困在时空裂缝中。这是怎么回事？"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_b108a0: "露兰:*尖叫*"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_b153df: "露兰:你敢把我的纽沃斯抢走！"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_bbd50b: "露兰:*哼* 那他就是公平竞争了！"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_cd1043: "露兰:不，他们不是。朋友不会互相攻击！"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_cfe802: "露兰:真蠢。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_d7876f: "露兰:嗨，很高兴认识你。能亲眼见到著名的纽沃斯，我感到很荣幸。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_d97e48: "露兰:！！！"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_e49262: "露兰:他们是怪物，不是你的朋友。小心点。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_f20bb8: "露兰:大家都去哪了？他们去别的地方了吗？我们往那个方向走吧。"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_f2f049: "露兰:同伴，谁？我们只是一群拼命想救一个走失女孩的陌生人！"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_fa3116: "露兰:够了！别再对纽沃斯无礼！"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_fc797e: "露兰:你喝了吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_scene_3ca5ad: "第8场:英雄被一群敌人包围。Roel，我们来编排一下今天练习的内容，好吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_00ed07: "沙洛希:同伴之间不该互相争斗。明白了吗。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_03688a: "沙洛希:Roel 和露兰受伤了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_068960: "沙洛希:不！他是我的朋友！"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_06e998: "沙洛希:我是沙洛希。为我唱歌吧。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_07d884: "沙洛希:你刚才想的是，“也带上我！”"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_0c6779: "沙洛希:我以为有人实现了我的愿望。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_0d6ebe: "沙洛希:我想起了一些事情。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_17a647: "沙洛希:他们来了……"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_17e139: "沙洛希:情况不妙。Ferre……"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_1f5b0d: "沙洛希:我不该带你们来这里，但我真的很想要一些朋友。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_21b4e6: "沙洛希:Ferres 很生气。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_2306c7: "沙洛希:……谢谢你。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_25a237: "沙洛希:……我现在自由了，但这改变不了我是谁:一个恶魔。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_32b229: "沙洛希:（朋友……竞争……）"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_3a8310: "沙洛希:好的。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_48c5a3: "沙洛希:Ferre 生气了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_4d4768: "沙洛希:她对他不满意，但她对他还是很好。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_52c9de: "沙洛希:怪物……"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_558531: "沙洛希:Ferre 在裂缝中为我创造了这个空间。如果他失去理智或死亡，这个空间以及其中的一切都会消失。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_562d0d: "沙洛希:他们是我的朋友。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_589e6a: "沙洛希:露兰唱歌甚至吹口哨都很好。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_62f93c: "沙洛希:纽沃斯，你刚才是不是觉得除了 Rot 之外都很平庸？"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_63fc78: "沙洛希:在漆黑的黑暗中，我听到一个声音。它很低沉，但持续回响了一段时间。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_6bcc15: "沙洛希:它们发出“ferre，ferre”的声音，所以我叫它们 Ferres。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_6cda6c: "沙洛希:不，不！"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_6d95f9: "沙洛希:现在我应该对你们坦诚了。我现在记起一切了。让我重新介绍自己。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_76a4c6: "沙洛希:你很奇怪。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_7735a9: "沙洛希:Ferre？"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_7a3d00: "沙洛希:Ferre，你不必这样做！"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_7fc673: "沙洛希:我想我有能力带人一起去任何地方。否则你们也不会跟我走到这么远。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_819d49: "沙洛希:我很享受有你的陪伴。如果我们再次见面……我们会是敌人吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_84acf5: "沙洛希:我的本能告诉我纽沃斯并不强。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_8779ce: "沙洛希:谢谢你。如果我知道如何表达我的感情就好了……"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_9688d0: "沙洛希:你承诺过。你很善良。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_9f0dd0: "沙洛希:危险，不。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_9f67a7: "沙洛希:喜欢你的歌。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_a1d1ad: "沙洛希:在艾古和露兰之前，"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_a4dfe4: "沙洛希:Ferre 真的很生气。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_a88fa0: "沙洛希:Ferre 已经变身成它的真实形态！"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_ac1e83: "沙洛希:它们只会呱呱叫。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_ac8f41: "沙洛希:……"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_b28e46: "沙洛希:（不能成为朋友。）"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_be2adc: "沙洛希:Ferres 最先出现。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_c2d764: "沙洛希:她脸红了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_c415b2: "沙洛希:你保护我。你很善良。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_cd55a2: "沙洛希:它们只是想保护我。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_d85164: "沙洛希:小东西跟着我们。不可爱。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_d9e7c4: "沙洛希:……谢谢你，冒险者纽沃斯。如果我找到一些有趣的地方，我可以邀请你来吗？"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_df8e7f: "沙洛希:后来我听到纽沃斯在等朋友的时候唱歌。他的声音温暖了我。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_e05a3c: "沙洛希:我是沙洛希，一个恶魔读心者，也是梦罗克的第三代理人。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_e1cf57: "沙洛希:不。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_e3da25: "沙洛希:不能成为朋友。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_e98d92: "沙洛希:纽沃斯……"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_e9c669: "沙洛希:艾古和露兰出现了。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_ed022c: "沙洛希:他们是我的朋友。他们不咬我，也不伤害我。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_edcf10: "沙洛希:我不知道朋友意味着什么，但听起来不错。我想要它。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_fbba67: "沙洛希:如果我把 Ferre 带到另一个空间，那么许多出口会出现在松动的时空裂缝中。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_fbd5a8: "沙洛希:从 Rot 的想法中知道的。"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_fca32d: "沙洛希:再见，朋友们。希望我们很快能再见面。"
  npc_override_1@jtb_NightmarishJitterbug_menu_slot_f2ea87: "插槽:1"
  npc_override_1@jtb_NightmarishJitterbug_mingmin_shoves_mushroom_c406ba: "- Mingmin 把蘑菇塞进你的嘴里。 -"
  npc_override_1@jtb_NightmarishJitterbug_mingmin_thinks_phenomeno_439dc6: "Mingmin 认为这种现象与次元裂缝和沙洛希的能力有关。"
  npc_override_1@jtb_NightmarishJitterbug_monster_649f1b: "怪物？"
  npc_override_1@jtb_NightmarishJitterbug_monster_um_s_just_woman_11d5c3: "怪物——！……嗯，只是个女人。"
  npc_override_1@jtb_NightmarishJitterbug_monsters_d0060b: "怪物……"
  npc_override_1@jtb_NightmarishJitterbug_monsters_started_appeari_e6da31: "怪物开始出现，而且数量正在迅速增加。"
  npc_override_1@jtb_NightmarishJitterbug_morocc_61cb82: "梦罗克？！"
  npc_override_1@jtb_NightmarishJitterbug_msg_61ce5a: "[{0}]"
  npc_override_1@jtb_NightmarishJitterbug_msg_6eae3a: "……"
  npc_override_1@jtb_NightmarishJitterbug_msg_9a7b00: "！！！"
  npc_override_1@jtb_NightmarishJitterbug_msg_b4613f: "！！"
  npc_override_1@jtb_NightmarishJitterbug_mushroom_poisonous_life_c85500: "这个蘑菇有毒，但不致命。你想咬一口吗？"
  npc_override_1@jtb_NightmarishJitterbug_my_first_adventure_as_me_002278: "这是我作为白翼成员的第一次冒险。我迫不及待想参加下一次！"
  npc_override_1@jtb_NightmarishJitterbug_my_first_adventure_my_ol_edaa38: "这是我很久以来第一次和老朋友们一起冒险。我希望我们能很快再来一次。"
  npc_override_1@jtb_NightmarishJitterbug_my_instincts_just_told_m_c9f093: "我的本能告诉我纽沃斯并不强。"
  npc_override_1@jtb_NightmarishJitterbug_never_let_your_guard_dow_d46330: "探索时永远不要放松警惕，否则你可能会受伤。"
  npc_override_1@jtb_NightmarishJitterbug_newoz_2646e2: "纽沃斯！"
  npc_override_1@jtb_NightmarishJitterbug_newoz_33987e: "纽沃斯！"
  npc_override_1@jtb_NightmarishJitterbug_newoz_9bad02: "纽沃斯。"
  npc_override_1@jtb_NightmarishJitterbug_newoz_avid_adventurer_wh_cc4e9b: "纽沃斯是一个热衷于冒险的人，从不在一个地方待太久；很多人声称见过他，但没人记得他去了哪里。"
  npc_override_1@jtb_NightmarishJitterbug_newoz_df8c68: "纽沃斯……"
  npc_override_1@jtb_NightmarishJitterbug_newoz_did_you_just_think_83c86e: "纽沃斯，你刚才是不是觉得除了 Rot 之外都很平庸？"
  npc_override_1@jtb_NightmarishJitterbug_newoz_did_you_know_happe_138d65: "纽沃斯，你知道会发生这种事吗？你很幸运有这样好的朋友。"
  npc_override_1@jtb_NightmarishJitterbug_newoz_i_love_you_dc6ed9: "纽沃斯，我爱你！"
  npc_override_1@jtb_NightmarishJitterbug_newoz_i_m_coming_you_76f1f9: "纽沃斯，我跟你一起去！"
  npc_override_1@jtb_NightmarishJitterbug_newoz_i_ve_known_you_0bcd54: "纽沃斯，我知道你脑子有问题，但她……"
  npc_override_1@jtb_NightmarishJitterbug_newoz_need_i_remind_you_5ffa41: "纽沃斯。需要我提醒你吗，这个公会不再叫纽沃斯的白翼了？"
  npc_override_1@jtb_NightmarishJitterbug_newoz_never_tactful_dc3bd0: "纽沃斯从来不懂圆滑。"
  npc_override_1@jtb_NightmarishJitterbug_newoz_s_enthusiasm_adven_b9fe53: "纽沃斯对冒险的热情又过头了。不过，我不能说讨厌他这一点。"
  npc_override_1@jtb_NightmarishJitterbug_newoz_s_hand_hot_70b9a3: "纽沃斯的手……很烫。"
  npc_override_1@jtb_NightmarishJitterbug_newoz_where_did_you_go_40d99f: "纽沃斯！这次你又去哪里了？"
  npc_override_1@jtb_NightmarishJitterbug_newoz_you_all_right_9b8740: "纽沃斯，你没事吧？"
  npc_override_1@jtb_NightmarishJitterbug_newoz_you_know_how_long_d6d562: "纽沃斯，你知道你失踪了多久吗？我们甚至招募了新公会成员来找你，而且……"
  npc_override_1@jtb_NightmarishJitterbug_newoz_you_re_alive_good_1fc6e4: "纽沃斯，你还活着！很好，因为我要杀了……"
  npc_override_1@jtb_NightmarishJitterbug_newoz_you_re_like_magnet_a88ba0: "纽沃斯，你就像一块吸引疯子的磁铁。"
  npc_override_1@jtb_NightmarishJitterbug_newoz_you_t_eat_anything_2c32d5: "纽沃斯，你除了肉什么都吃不了。唉，我很高兴你安全了。"
  npc_override_1@jtb_NightmarishJitterbug_newoz_your_contract_expi_be07d1: "纽沃斯，你的合同在你回到公会时就已经到期了。"
  npc_override_1@jtb_NightmarishJitterbug_no_b8b9f1: "不。"
  npc_override_1@jtb_NightmarishJitterbug_no_he_s_my_friend_72a98b: "不！他是我的朋友！"
  npc_override_1@jtb_NightmarishJitterbug_no_his_adventurer_instin_0bdfb5: "不，他的冒险者本能已经生锈了。"
  npc_override_1@jtb_NightmarishJitterbug_no_i_m_just_saying_15483e: "不。我只是说环境变化太剧烈了，几乎像躁郁症患者的情绪波动。"
  npc_override_1@jtb_NightmarishJitterbug_no_i_m_you_don_662135: "不，我没有！你不想惹我生气吧，小姑娘。"
  npc_override_1@jtb_NightmarishJitterbug_no_idea_how_did_you_302a91: "不知道。你们是怎么进来的？"
  npc_override_1@jtb_NightmarishJitterbug_no_no_16db2c: "不，不！"
  npc_override_1@jtb_NightmarishJitterbug_no_shaloshi_as_today_you_edd392: "不，沙洛希。从今天开始，你是纽沃斯的白翼公会的新成员了。"
  npc_override_1@jtb_NightmarishJitterbug_no_they_re_friends_don_529607: "不，他们不是。朋友不会互相攻击！"
  npc_override_1@jtb_NightmarishJitterbug_nope_i_m_going_call_fbc3ce: "不，我要叫它 Roter 的超级关键公会！"
  npc_override_1@jtb_NightmarishJitterbug_now_d74887: "但现在……"
  npc_override_1@jtb_NightmarishJitterbug_now_i_should_honest_you_e6e026: "现在我应该对你们坦诚了。我现在记起一切了。让我重新介绍自己。"
  npc_override_1@jtb_NightmarishJitterbug_oh_both_them_left_ed2d7b: "哦，她们两个都走了。"
  npc_override_1@jtb_NightmarishJitterbug_oh_congratulations_maste_b8178a: "哦，恭喜你，主人。"
  npc_override_1@jtb_NightmarishJitterbug_oh_did_i_fail_51b25c: "哦，我失败了吗？"
  npc_override_1@jtb_NightmarishJitterbug_oh_he_famous_newoz_17784b: "哦，他就是著名的纽沃斯？"
  npc_override_1@jtb_NightmarishJitterbug_oh_hello_may_i_ask_1ceeb0: "哦，你好。请问你是哪位，小姑娘？"
  npc_override_1@jtb_NightmarishJitterbug_oh_i_m_sorry_i_875981: "哦，对不起，但我快要哭出来了。"
  npc_override_1@jtb_NightmarishJitterbug_oh_i_remember_ah_good_83d78c: "哦，我记得！啊，美好的时光！"
  npc_override_1@jtb_NightmarishJitterbug_oh_i_remember_funny_10427a: "哦，我记得！那太好笑了！"
  npc_override_1@jtb_NightmarishJitterbug_oh_instincts_great_adven_8388fe: "哦，伟大冒险者的本能！"
  npc_override_1@jtb_NightmarishJitterbug_oh_s_right_since_i_d8141a: "哦，对了。既然我不再是主人，我的合同自然就到期了。"
  npc_override_1@jtb_NightmarishJitterbug_oh_shut_both_you_2e67c9: "哦，你们两个都闭嘴！"
  npc_override_1@jtb_NightmarishJitterbug_oh_we_ve_got_new_6f757f: "哦，我们有新成员了？太好了，我有几个蘑菇一直想尝尝……"
  npc_override_1@jtb_NightmarishJitterbug_oh_you_mean_ukulele_b85a3e: "哦，你是说这个尤克里里？"
  npc_override_1@jtb_NightmarishJitterbug_oh_you_re_right_72661b: "哦，你说得对！"
  npc_override_1@jtb_NightmarishJitterbug_okay_4371ac: "好的。"
  npc_override_1@jtb_NightmarishJitterbug_okay_take_my_hand_036c7d: "好的。牵我的手。"
  npc_override_1@jtb_NightmarishJitterbug_one_moment_i_had_shalosh_bd90a2: "刚才我还牵着沙洛希的手，下一刻她就消失了。"
  npc_override_1@jtb_NightmarishJitterbug_one_my_friends_once_set_f93881: "我的一个朋友曾经给我在依斯鲁得岛安排过一次相亲。"
  npc_override_1@jtb_NightmarishJitterbug_one_who_sings_408656: "会唱歌的那个人。"
  npc_override_1@jtb_NightmarishJitterbug_ooh_like_reenacting_scen_88c949: "哦，这就像重现书中怪物肆虐的场景。"
  npc_override_1@jtb_NightmarishJitterbug_oooh_you_ve_got_some_0f5267: "哦，你有一些漂亮的吊坠。你想把它们组合起来吗？绝对成功，我保证。"
  npc_override_1@jtb_NightmarishJitterbug_otherworldly_ca91cc: "或者说是异世界的。"
  npc_override_1@jtb_NightmarishJitterbug_our_adventure_hasn_t_sta_c7f4a0: "我们的冒险还没开始，我就已经饿了。"
  npc_override_1@jtb_NightmarishJitterbug_our_deal_done_let_me_5bbae4: "我们的交易完成了。让我想想我要什么回报……"
  npc_override_1@jtb_NightmarishJitterbug_over_my_dead_body_061f90: "除非我死了！"
  npc_override_1@jtb_NightmarishJitterbug_pam_pam_pam_7f971f: "Pam，pam，pam~"
  npc_override_1@jtb_NightmarishJitterbug_pam_pam_pam_pam_aa31c3: "Pam，pam，pam，pam~"
  npc_override_1@jtb_NightmarishJitterbug_pant_pant_i_m_glad_9bae3a: "*喘气* 我很高兴你没走太远。"
  npc_override_1@jtb_NightmarishJitterbug_pant_pant_i_ve_found_dea207: "*喘气* 我找到你了，沙洛希。"
  npc_override_1@jtb_NightmarishJitterbug_party_entering_d3d912: "队伍 {1} 的 {0} 正在进入 {2}。"
  npc_override_1@jtb_NightmarishJitterbug_perhaps_s_monsters_you_w_9bb1d3: "也许是怪物。你要我去查看吗？"
  npc_override_1@jtb_NightmarishJitterbug_pitch_darkness_cave_brig_1ffb09: "漆黑的黑暗……除了雾之外，洞穴里到处都是明亮的。"
  npc_override_1@jtb_NightmarishJitterbug_pitch_darkness_don_t_you_28ade3: "漆黑的黑暗……你不记得别的了吗？"
  npc_override_1@jtb_NightmarishJitterbug_pitch_darkness_i_heard_v_9e9a60: "在漆黑的黑暗中，我听到一个声音。它很低沉，但持续回响了一段时间。"
  npc_override_1@jtb_NightmarishJitterbug_place_full_mysteries_b597df: "一个充满谜团的地方。"
  npc_override_1@jtb_NightmarishJitterbug_place_gives_me_heebie_je_957a96: "这个地方让我毛骨悚然。"
  npc_override_1@jtb_NightmarishJitterbug_place_like_maze_there_so_4ed813: "这个地方像个迷宫。支路和空地太多了，我都数不清了。"
  npc_override_1@jtb_NightmarishJitterbug_place_still_full_things_1be910: "这个地方还有很多可以研究的东西。"
  npc_override_1@jtb_NightmarishJitterbug_please_don_t_talk_me_5f6a9b: "请不要跟我说话——我躲起来是有原因的。"
  npc_override_1@jtb_NightmarishJitterbug_please_let_there_no_more_ff078e: "拜托，不要再有惊喜了。"
  npc_override_1@jtb_NightmarishJitterbug_please_note_portal_canno_253299: "^ff0000请注意，此 portal 在最后一次进入后 23 小时内无法进入。^000000"
  npc_override_1@jtb_NightmarishJitterbug_please_try_again_cefdd7: "- 请重试 -"
  npc_override_1@jtb_NightmarishJitterbug_please_wait_a42633: "^ff0000请稍候。^000000"
  npc_override_1@jtb_NightmarishJitterbug_portal_now_available_use_2636fb: "Portal 现在可以使用了。"
  npc_override_1@jtb_NightmarishJitterbug_preparing_dimensional_po_b9f5c3: "^ff0000正在准备次元 portal……^000000"
  npc_override_1@jtb_NightmarishJitterbug_protect_you_what_d787f9: "保护你免受什么？"
  npc_override_1@jtb_NightmarishJitterbug_push_push_af902c: "推，推~"
  npc_override_1@jtb_NightmarishJitterbug_quit_fb25bb: "退出。"
  npc_override_1@jtb_NightmarishJitterbug_recruiting_guild_prospec_e7cca7: "招募公会新人！加入我们一起寻找我们的前主人纽沃斯！你有兴趣吗？"
  npc_override_1@jtb_NightmarishJitterbug_reminds_me_when_rot_youn_6c0bd2: "这让我想起，Rot 年轻的时候……"
  npc_override_1@jtb_NightmarishJitterbug_reservation_failed_b861ab: "^0000ff{0} ^000000- 预订失败！"
  npc_override_1@jtb_NightmarishJitterbug_right_s_what_she_said_f14381: "对，她是这么说的。"
  npc_override_1@jtb_NightmarishJitterbug_roel_i_friends_now_heh_86034c: "Roel 和我现在是朋友了。嘿。"
  npc_override_1@jtb_NightmarishJitterbug_roel_i_think_we_should_68e53d: "Roel，我想我们也该走了。"
  npc_override_1@jtb_NightmarishJitterbug_roel_runane_hurt_433f54: "Roel 和露兰受伤了。"
  npc_override_1@jtb_NightmarishJitterbug_roel_t_you_drink_your_5114ba: "Roel，你不能替你妹妹喝吗？"
  npc_override_1@jtb_NightmarishJitterbug_rot_your_pet_name_master_1998ca: "Rot？那是你的昵称吗，主人？你们是朋友吗？"
  npc_override_1@jtb_NightmarishJitterbug_ruinous_twelve_heaven_s_ed5757: "毁灭十二天网！"
  npc_override_1@jtb_NightmarishJitterbug_runane_sings_even_whistl_221b76: "露兰唱歌甚至吹口哨都很好。"
  npc_override_1@jtb_NightmarishJitterbug_s_awfully_bitter_16de30: "但苦得要命。"
  npc_override_1@jtb_NightmarishJitterbug_s_been_while_since_i_c660c0: "我已经很久没有这么开心了。"
  npc_override_1@jtb_NightmarishJitterbug_s_calloused_because_i_da_a96dfa: "这是茧，因为我跳舞。嘿嘿。"
  npc_override_1@jtb_NightmarishJitterbug_s_dangerous_don_t_worry_3104fc: "不危险。别担心。"
  npc_override_1@jtb_NightmarishJitterbug_s_easy_just_smile_0206b1: "很简单。微笑就好。"
  npc_override_1@jtb_NightmarishJitterbug_s_possible_someone_else_2009a3: "可能还有别人在这里。"
  npc_override_1@jtb_NightmarishJitterbug_s_right_i_like_you_f27d79: "没错。你听话的时候我更喜欢你。"
  npc_override_1@jtb_NightmarishJitterbug_s_spirit_07f0dc: "就是这种精神！"
  npc_override_1@jtb_NightmarishJitterbug_s_strange_she_told_newoz_bcb661: "真奇怪。她从一开始就告诉纽沃斯了。"
  npc_override_1@jtb_NightmarishJitterbug_s_true_i_m_strongest_9b20b9: "我确实是最强的。"
  npc_override_1@jtb_NightmarishJitterbug_s_your_call_new_master_a66992: "由你决定，新主人。"
  npc_override_1@jtb_NightmarishJitterbug_scatter_thousand_flashli_d58631: "散开——千闪光！"
  npc_override_1@jtb_NightmarishJitterbug_seasons_changing_once_ag_02b113: "季节又变了~ 我还没有机会用凤仙花染指甲呢~"
  npc_override_1@jtb_NightmarishJitterbug_seems_as_though_we_re_473d9f: "看起来我们好像在水下，但我感觉不到。"
  npc_override_1@jtb_NightmarishJitterbug_seems_everyone_s_here_9649df: "看来大家都到齐了。"
  npc_override_1@jtb_NightmarishJitterbug_shaloshi_3238a6: "沙洛希……"
  npc_override_1@jtb_NightmarishJitterbug_shaloshi_cea28b: "沙洛希.."
  npc_override_1@jtb_NightmarishJitterbug_shaloshi_i_don_t_care_8f158e: "沙洛希，我不在乎你是谁。你是我的朋友，我也是你的朋友。"
  npc_override_1@jtb_NightmarishJitterbug_shaloshi_puckers_her_lip_e3e252: "- 沙洛希嘟起嘴唇想吹口哨，但失败了。 -"
  npc_override_1@jtb_NightmarishJitterbug_shaloshi_you_favorite_so_49c1bd: "沙洛希，你有喜欢的歌吗？"
  npc_override_1@jtb_NightmarishJitterbug_she_change_subjects_more_222c03: "她转换话题的速度比 Arclouse 施放加速术还快。"
  npc_override_1@jtb_NightmarishJitterbug_she_could_been_terrified_d8e0ce: "她可能被吓坏了。"
  npc_override_1@jtb_NightmarishJitterbug_she_could_had_her_eyes_ffef58: "她可能是闭着眼睛的。也许她在睡觉。"
  npc_override_1@jtb_NightmarishJitterbug_she_didn_t_reply_my_9512d2: "她没有回复我的第二封信。我想不通为什么。"
  npc_override_1@jtb_NightmarishJitterbug_she_heard_her_own_though_b15341: "她听到了自己的想法。"
  npc_override_1@jtb_NightmarishJitterbug_she_i_exchanged_couple_l_78b9ab: "她和我交换了几封信，先是互相介绍，然后是第二封信来安排约会。"
  npc_override_1@jtb_NightmarishJitterbug_she_may_remembered_every_cb15a1: "她可能还没记起所有事情，但这是进步。等她准备好再说更多吧。"
  npc_override_1@jtb_NightmarishJitterbug_she_s_blushing_09985b: "她脸红了。"
  npc_override_1@jtb_NightmarishJitterbug_she_s_happy_him_she_18da47: "她对他不满意，但她对他还是很好。"
  npc_override_1@jtb_NightmarishJitterbug_she_s_hawt_when_she_b90cf0: "（她生气的时候好辣！）"
  npc_override_1@jtb_NightmarishJitterbug_she_s_just_my_type_a79a45: "（她正是我喜欢的类型！）"
  npc_override_1@jtb_NightmarishJitterbug_she_s_kind_008f7e: "（她很善良！）"
  npc_override_1@jtb_NightmarishJitterbug_she_said_she_did_13c8a7: "她说她有。"
  npc_override_1@jtb_NightmarishJitterbug_sheesh_waste_time_you_sh_df38a1: "唉，真是浪费时间。你应该先走。我还有一样东西想看。"
  npc_override_1@jtb_NightmarishJitterbug_shriek_5dee97: "*尖叫*"
  npc_override_1@jtb_NightmarishJitterbug_shush_we_ve_had_enough_1fb11f: "嘘！今天已经够多了。你们都被解雇了！Roter 的超级关键公会冒险到此结束！"
  npc_override_1@jtb_NightmarishJitterbug_slap_4a25dd: "- * slap * -"
  npc_override_1@jtb_NightmarishJitterbug_small_friends_follow_us_1f96cd: "小东西跟着我们。不可爱。"
  npc_override_1@jtb_NightmarishJitterbug_snort_then_he_s_fair_5f31d9: "*哼* 那他就是公平竞争了！"
  npc_override_1@jtb_NightmarishJitterbug_snort_you_said_same_thin_3ba45a: "*哼* 你说普隆德拉下水道的时候也是这么说的。"
  npc_override_1@jtb_NightmarishJitterbug_so_i_right_about_place_d76e8e: "所以我对这个地方像迷宫一样的判断是对的。呜，我又饿了。"
  npc_override_1@jtb_NightmarishJitterbug_some_scholars_proved_dro_c9dcf2: "一些学者已经证明了波利卡的掉落率是……百分点。"
  npc_override_1@jtb_NightmarishJitterbug_something_else_showing_u_3eaa7e: "有别的东西出现了。"
  npc_override_1@jtb_NightmarishJitterbug_something_might_jump_us_c3cfea: "有什么东西可能会跳出来攻击我们！"
  npc_override_1@jtb_NightmarishJitterbug_sorry_bother_you_guys_i_ade34d: "……抱歉打扰你们，但我想那边有什么东西。"
  npc_override_1@jtb_NightmarishJitterbug_sorry_d449c9: "抱歉。"
  npc_override_1@jtb_NightmarishJitterbug_sorry_i_won_t_disappoint_6c496f: "抱歉。我不会再让你失望了。"
  npc_override_1@jtb_NightmarishJitterbug_sounds_lame_4cea5c: "听起来真差劲。"
  npc_override_1@jtb_NightmarishJitterbug_special_skills_all_about_5b534f: "特技全靠名字。喊出响亮的名字就足以震慑敌人。"
  npc_override_1@jtb_NightmarishJitterbug_stayed_long_enough_us_lo_756827: "但它停留的时间足够长，让我们彼此走散了。"
  npc_override_1@jtb_NightmarishJitterbug_stop_bothering_me_t_you_1af5de: "别再烦我了。你没看见我在躲吗？！"
  npc_override_1@jtb_NightmarishJitterbug_stop_goofing_around_shal_b3b823: "别闹了。沙洛希，跟我们说话。"
  npc_override_1@jtb_NightmarishJitterbug_stop_making_things_awkwa_4ebe72: "别搞得那么尴尬！我们年龄差不多，所以我们已经是朋友了。"
  npc_override_1@jtb_NightmarishJitterbug_stop_pretending_you_care_28b017: "别假装你关心我！我可以照顾好自己！"
  npc_override_1@jtb_NightmarishJitterbug_stop_talking_get_ready_p_9dc8f5: "别说话了，准备好练习你们的特技。"
  npc_override_1@jtb_NightmarishJitterbug_stop_thinking_just_keep_b3551e: "别想了，保留旧名字就好。"
  npc_override_1@jtb_NightmarishJitterbug_strange_atmosphere_chang_310538: "奇怪……气氛变了。"
  npc_override_1@jtb_NightmarishJitterbug_strange_pendant_8d460b: "奇怪的吊坠"
  npc_override_1@jtb_NightmarishJitterbug_strange_plants_growing_s_8a285a: "奇怪的地形上长着奇怪的植物。一切看起来都不对劲。"
  npc_override_1@jtb_NightmarishJitterbug_stream_water_started_flo_06fb68: "一道水流开始流动。"
  npc_override_1@jtb_NightmarishJitterbug_suddenly_i_crave_meat_i_3fee16: "突然想吃肉。我该带满满一盒肉来的！"
  npc_override_1@jtb_NightmarishJitterbug_t_answer_4ec19e: "无法回答。"
  npc_override_1@jtb_NightmarishJitterbug_t_friends_8e9095: "（不能成为朋友。）"
  npc_override_1@jtb_NightmarishJitterbug_t_friends_f3e2ec: "不能成为朋友。"
  npc_override_1@jtb_NightmarishJitterbug_t_remember_thing_3fbc77: "什么都不记得了。"
  npc_override_1@jtb_NightmarishJitterbug_t_you_hear_what_others_8012b9: "你能听到别人的想法吗？"
  npc_override_1@jtb_NightmarishJitterbug_t_you_think_nice_memory_9de36f: "你就不能想些美好的回忆吗？"
  npc_override_1@jtb_NightmarishJitterbug_talk_6f3301: "对话。"
  npc_override_1@jtb_NightmarishJitterbug_teleporting_cca404: "传送中……"
  npc_override_1@jtb_NightmarishJitterbug_tell_me_something_i_don_22a7d7: "告诉我一些我不知道的事情。"
  npc_override_1@jtb_NightmarishJitterbug_thank_you_4cad17: "……谢谢你。"
  npc_override_1@jtb_NightmarishJitterbug_thank_you_adventurer_new_e306de: "……谢谢你，冒险者纽沃斯。如果我找到一些有趣的地方，我可以邀请你来吗？"
  npc_override_1@jtb_NightmarishJitterbug_thank_you_if_only_i_5d6add: "谢谢你。如果我知道如何表达我的感情就好了……"
  npc_override_1@jtb_NightmarishJitterbug_thanks_6099fe: "谢谢。"
  npc_override_1@jtb_NightmarishJitterbug_thanks_i_m_glad_my_63009b: "谢谢。我很高兴我的应急计划还在。"
  npc_override_1@jtb_NightmarishJitterbug_then_let_s_get_out_cad16b: "那我们离开这里吧。我们现在正处于严重的危险中。"
  npc_override_1@jtb_NightmarishJitterbug_there_s_nothing_about_yo_a31a56: "你身上没有我喜欢的地方。"
  npc_override_1@jtb_NightmarishJitterbug_there_s_something_someth_1eb2ee: "有东西！有东西！"
  npc_override_1@jtb_NightmarishJitterbug_these_guys_different_the_84611b: "这些家伙不一样。他们似乎懂音乐……也许不是。"
  npc_override_1@jtb_NightmarishJitterbug_these_monsters_boring_ca3667: "这些怪物很无聊。"
  npc_override_1@jtb_NightmarishJitterbug_these_monsters_don_t_sto_283450: "这些怪物不停地来。但那些大的、稀有的、漂亮的怪物都去哪了？"
  npc_override_1@jtb_NightmarishJitterbug_they_competing_over_newo_b4a655: "她们在争夺纽沃斯吗？我也要加入！"
  npc_override_1@jtb_NightmarishJitterbug_they_did_nothing_croaked_300327: "它们只会呱呱叫。"
  npc_override_1@jtb_NightmarishJitterbug_they_emit_ferre_ferre_so_09c630: "它们发出“ferre，ferre”的声音，所以我叫它们 Ferres。"
  npc_override_1@jtb_NightmarishJitterbug_they_look_cute_they_re_445cc0: "它们看起来很可爱，但很凶猛。"
  npc_override_1@jtb_NightmarishJitterbug_they_re_absorbed_talking_ad3b5b: "- 他们正全神贯注地谈论他们的新特技。 -"
  npc_override_1@jtb_NightmarishJitterbug_they_re_bickering_all_ti_ed73a8: "他们一直在争吵，但看起来是好朋友。不是吗？"
  npc_override_1@jtb_NightmarishJitterbug_they_re_just_trying_prot_1291f2: "它们只是想保护我。"
  npc_override_1@jtb_NightmarishJitterbug_they_re_monsters_your_fr_6413d6: "他们是怪物，不是你的朋友。小心点。"
  npc_override_1@jtb_NightmarishJitterbug_they_re_my_friends_666900: "他们是我的朋友。"
  npc_override_1@jtb_NightmarishJitterbug_they_re_my_friends_they_6546b8: "他们是我的朋友。他们不咬我，也不伤害我。"
  npc_override_1@jtb_NightmarishJitterbug_time_maybe_you_don_t_ccd4a5: "这次，也许你不必离开沙洛希了。"
  npc_override_1@jtb_NightmarishJitterbug_too_many_items_you_fc968e: "- 你带的东西太多了。 -"
  npc_override_1@jtb_NightmarishJitterbug_true_friends_don_t_need_d8d286: "真正的朋友不需要宣城他们的友谊；他们在不知不觉中就成为了朋友。"
  npc_override_1@jtb_NightmarishJitterbug_try_jog_your_memory_whil_18decf: "一边赶路一边试着回忆吧。"
  npc_override_1@jtb_NightmarishJitterbug_trying_whistle_i_t_3d3ee6: "（试着吹口哨）我不会。"
  npc_override_1@jtb_NightmarishJitterbug_tsk_tsk_i_practically_ra_43602d: "啧，啧。这里的人几乎都是我一手带大的，现在他们却为了公会会长的位置互相争斗。"
  npc_override_1@jtb_NightmarishJitterbug_ugh_i_don_t_want_c03b85: "呜，我不想喝这个！"
  npc_override_1@jtb_NightmarishJitterbug_ugh_i_m_tired_looking_9d7257: "呜，我累了。整天照顾这些新成员本身就是一份工作。"
  npc_override_1@jtb_NightmarishJitterbug_um_conversation_seems_go_9936b5: "嗯，对话似乎已经……"
  npc_override_1@jtb_NightmarishJitterbug_um_hold_one_ukulele_stri_a48582: "嗯，等一下。尤克里里的一根弦断了。我唱歌怎么样？"
  npc_override_1@jtb_NightmarishJitterbug_um_how_did_i_manage_49b9e8: "嗯，我怎么又把其他人弄丢了呢？"
  npc_override_1@jtb_NightmarishJitterbug_um_i_feeling_something_m_1fdb3f: "嗯，我有种预感有什么东西会突然从某处跳出来攻击我们。"
  npc_override_1@jtb_NightmarishJitterbug_um_you_trying_whistle_9e56dc: "嗯，你在试着吹口哨吗？"
  npc_override_1@jtb_NightmarishJitterbug_unknown_error_occurred_58bda4: "发生了未知错误。"
  npc_override_1@jtb_NightmarishJitterbug_unrequited_love_painful_0bcc6f: "单相思是痛苦的。你最好在它伤害你之前放手。"
  npc_override_1@jtb_NightmarishJitterbug_voice_before_my_singing_66650b: "在我唱歌之前有个声音。可能还有别人在这里。"
  npc_override_1@jtb_NightmarishJitterbug_voice_woman_e19159: "女人的声音……"
  npc_override_1@jtb_NightmarishJitterbug_w_whazza_don_t_ridiculou_4843c7: "什、什么……？！别荒谬了。我刚才才找到她。"
  npc_override_1@jtb_NightmarishJitterbug_wah_jeez_bb68e3: "哇！天哪！"
  npc_override_1@jtb_NightmarishJitterbug_wait_i_ve_collected_some_9889a6: "等等，我收集了一些秋叶和蓝卡要作为纪念品送给其他朋友。它们去哪了？"
  npc_override_1@jtb_NightmarishJitterbug_wait_minute_17efa5: "- 等一下！！ -"
  npc_override_1@jtb_NightmarishJitterbug_wait_we_re_finished_here_44c896: "等等，我们还没说完呢！"
  npc_override_1@jtb_NightmarishJitterbug_waiting_snow_34fa6e: "等待下雪~"
  npc_override_1@jtb_NightmarishJitterbug_wasn_t_what_i_expected_d936b6: "……这不是我预期的。你一点都不难过吗？"
  npc_override_1@jtb_NightmarishJitterbug_we_d_better_look_exit_85b10b: "我们最好在事情变得太疯狂之前找个出口。"
  npc_override_1@jtb_NightmarishJitterbug_we_didn_t_here_if_037c2d: "如果不是因为某个人，我们根本不需要来这里。"
  npc_override_1@jtb_NightmarishJitterbug_we_finally_meet_newoz_3de573: "……我们终于见面了，纽沃斯！"
  npc_override_1@jtb_NightmarishJitterbug_we_find_shaloshi_ea07f0: "我们必须找到沙洛希！"
  npc_override_1@jtb_NightmarishJitterbug_we_got_lost_now_we_f10911: "我们迷路了，现在被困在时空裂缝中。这是怎么回事？"
  npc_override_1@jtb_NightmarishJitterbug_we_ll_find_newoz_shalosh_da435b: "我们会找到纽沃斯和沙洛希的。当我们找到他们时，我要杀了他们两个。"
  npc_override_1@jtb_NightmarishJitterbug_we_ll_know_soon_enough_dd8559: "我们很快就会知道。"
  npc_override_1@jtb_NightmarishJitterbug_we_ll_split_into_two_b4d95b: "我们分成两队。小心别在迷宫般的支路中迷路。"
  npc_override_1@jtb_NightmarishJitterbug_we_ll_talk_again_moment_8ce0ae: "我们一离开这里就再聊。"
  npc_override_1@jtb_NightmarishJitterbug_we_re_going_buried_here_27aeff: "我们要被埋在这里了。我们找个出口吧。"
  npc_override_1@jtb_NightmarishJitterbug_we_re_looking_adventurer_f0f040: "我们正在寻找可以加入我们的全新冒险的冒险者。如果你达到了可以接受 IGU 任务的等级，那你就有资格了。"
  npc_override_1@jtb_NightmarishJitterbug_we_ready_let_s_go_a82bd4: "准备好了吗？走吧！"
  npc_override_1@jtb_NightmarishJitterbug_we_should_find_her_f66533: "我们应该找到她。"
  npc_override_1@jtb_NightmarishJitterbug_we_should_find_newoz_sha_437834: "我们应该先找到纽沃斯和沙洛希。"
  npc_override_1@jtb_NightmarishJitterbug_we_still_danger_53535c: "我们还有危险吗？"
  npc_override_1@jtb_NightmarishJitterbug_we_ve_met_again_6339fd: "我们又见面了。"
  npc_override_1@jtb_NightmarishJitterbug_we_ve_practiced_hard_44dae3: "我们一直在努力练习。"
  npc_override_1@jtb_NightmarishJitterbug_well_i_didn_t_25a514: "嗯，我没有……"
  npc_override_1@jtb_NightmarishJitterbug_well_if_i_t_talk_ee2cc8: "好吧，如果我不能说服他放弃，那我们就只能打一架了。"
  npc_override_1@jtb_NightmarishJitterbug_weren_t_you_danger_bd1ce2: "你不是有危险吗？"
  npc_override_1@jtb_NightmarishJitterbug_what_89511a: "是什么？"
  npc_override_1@jtb_NightmarishJitterbug_what_be65b9: "什么？"
  npc_override_1@jtb_NightmarishJitterbug_what_did_you_change_guil_d913c6: "什么？你改公会名字了吗？"
  npc_override_1@jtb_NightmarishJitterbug_what_did_you_expect_all_fcda21: "你还指望什么？他满脑子想的都是冒险、怪物和宝藏。"
  npc_override_1@jtb_NightmarishJitterbug_what_difficult_task_i_se_691940: "多么艰巨的任务。我从世界的这头搜到那头，却找不到他的任何踪影。"
  npc_override_1@jtb_NightmarishJitterbug_what_exactly_am_i_offeri_b34669: "我到底在提供什么？巨弓、风暴弓，以及^FF0000在这个空间中发现的其他贵重物品。^000000 如果你想要它们，至少给我带来 50 个 Jitterbug 牙齿。"
  npc_override_1@jtb_NightmarishJitterbug_what_rot_thinking_26ffd4: "从 Rot 的想法中知道的。"
  npc_override_1@jtb_NightmarishJitterbug_what_s_wrong_me_my_0f4e7e: "我怎么了？我的心跳个不停。"
  npc_override_1@jtb_NightmarishJitterbug_what_you_call_fish_music_c1dcc9: "你怎么称呼一个鱼音乐家？钢琴金枪鱼。"
  npc_override_1@jtb_NightmarishJitterbug_what_you_talking_about_w_58cc77: "你在说什么？为什么不跟着我们？露兰在哪里？我刚才还看到她在我身边。"
  npc_override_1@jtb_NightmarishJitterbug_what_you_trying_feed_chi_f22070: "你想给这孩子喂什么？这个绿色瓶子里是什么？……不……"
  npc_override_1@jtb_NightmarishJitterbug_where_others_definitely_141036: "其他人都去哪了？这绝对不是普通的洞穴。"
  npc_override_1@jtb_NightmarishJitterbug_where_others_hey_new_guy_8469b6: "其他人都去哪了？嘿，新来的，帮帮我。那个 Ferre 看起来很强。"
  npc_override_1@jtb_NightmarishJitterbug_where_s_everyone_they_go_eb1c3b: "大家都去哪了？他们去别的地方了吗？我们往那个方向走吧。"
  npc_override_1@jtb_NightmarishJitterbug_where_you_been_we_just_753148: "你去哪了？我们刚才遇到了一个很棒的怪物！"
  npc_override_1@jtb_NightmarishJitterbug_where_you_think_newoz_ti_1e9dcd: "你觉得纽沃斯这次在哪？"
  npc_override_1@jtb_NightmarishJitterbug_where_you_think_shaloshi_8d4381: "你觉得沙洛希现在在哪？我们遇见沙洛希的那个空间被困在一个时间循环中，同样的事件一遍又一遍地重复。"
  npc_override_1@jtb_NightmarishJitterbug_whew_e64576: "……呼。"
  npc_override_1@jtb_NightmarishJitterbug_whew_s_you_jack_long_2e3395: "呼，是你啊 Jack。好久不见，各位。"
  npc_override_1@jtb_NightmarishJitterbug_who_says_you_invite_her_1b9b06: "谁允许你邀请她的？我不会接受一个恶魔！"
  npc_override_1@jtb_NightmarishJitterbug_whole_process_painful_if_3b0d94: "整个过程都很痛苦。如果不是露兰，我们无法记住他最后的位置，也无法离开。"
  npc_override_1@jtb_NightmarishJitterbug_worry_i_ll_protect_you_683f00: "别担心——我会保护你的！"
  npc_override_1@jtb_NightmarishJitterbug_wow_newoz_your_eyes_look_239446: "哇，纽沃斯！你的眼睛看起来比以前更肿了。"
  npc_override_1@jtb_NightmarishJitterbug_wow_place_going_last_lon_c368ea: "哇，这个地方撑不了多久了——看地面震得多厉害！我们真的需要像昨天一样赶快离开，纽沃斯。"
  npc_override_1@jtb_NightmarishJitterbug_wow_you_even_hear_what_19aa07: "哇，你甚至能听到怪物在想什么？"
  npc_override_1@jtb_NightmarishJitterbug_yap_yap_e04a8e: "Yap！Yap！"
  npc_override_1@jtb_NightmarishJitterbug_yeah_what_s_up_bdd438: "是啊，怎么了？"
  npc_override_1@jtb_NightmarishJitterbug_yeah_you_don_t_tell_b184c7: "是啊，你不必告诉我。"
  npc_override_1@jtb_NightmarishJitterbug_yes_c53c56: "是的。"
  npc_override_1@jtb_NightmarishJitterbug_yes_master_c5874f: "是的，主人！"
  npc_override_1@jtb_NightmarishJitterbug_yippee_let_s_go_8a73a2: "耶！走吧！"
  npc_override_1@jtb_NightmarishJitterbug_you_any_good_memories_us_108dbd: "你就没有关于我们的美好回忆吗？"
  npc_override_1@jtb_NightmarishJitterbug_you_d_better_more_reliab_3cf0fd: "你最好比我认识的某个人更可靠。"
  npc_override_1@jtb_NightmarishJitterbug_you_d_run_before_everyon_96a52f: "你会跑得比这里所有人都快。好了，我们不能待在这里。我们继续前进吧。"
  npc_override_1@jtb_NightmarishJitterbug_you_don_t_even_know_dcadf3: "你都不知道我有没有另一半。"
  npc_override_1@jtb_NightmarishJitterbug_you_don_t_get_upset_6a6d0a: "你不必生气。我不是来抢走你朋友的。我只是想……"
  npc_override_1@jtb_NightmarishJitterbug_you_drinking_yet_9ba70b: "你喝了吗？"
  npc_override_1@jtb_NightmarishJitterbug_you_favorite_song_f682b4: "{0}，你有喜欢的歌吗？"
  npc_override_1@jtb_NightmarishJitterbug_you_feel_good_possibly_s_4bc5c5: "- 你感觉很好，可能是吃了蘑菇的副作用。 -"
  npc_override_1@jtb_NightmarishJitterbug_you_first_must_form_join_86e369: "^ff0000你必须先组建/加入一个至少 1 人的队伍才能进入这个地下城。^000000"
  npc_override_1@jtb_NightmarishJitterbug_you_good_taste_just_came_442bfa: "你品味不错。这是刚想到的。听好了。"
  npc_override_1@jtb_NightmarishJitterbug_you_haven_t_tried_talk_e7f703: "但你还没试着和他说话。我是说认真的，你试过了吗？"
  npc_override_1@jtb_NightmarishJitterbug_you_jitterbug_teeth_d81d70: "你有 Jitterbug 牙齿吗？"
  npc_override_1@jtb_NightmarishJitterbug_you_just_thought_take_me_6dd2b2: "你刚才想的是，“也带上我！”"
  npc_override_1@jtb_NightmarishJitterbug_you_know_her_debut_song_d6f081: "你知道她的出道曲。你是她的粉丝吧？"
  npc_override_1@jtb_NightmarishJitterbug_you_know_newoz_let_s_4d290c: "你认识纽沃斯吗？我们把他从这里带出去吧。"
  npc_override_1@jtb_NightmarishJitterbug_you_ll_okay_aigu_so_ae6e4d: "只要你跟着我们就没事的，艾古……嗯，大家都去哪了？"
  npc_override_1@jtb_NightmarishJitterbug_you_look_new_around_here_6a95f6: "你看起来是新来的。很高兴认识你！"
  npc_override_1@jtb_NightmarishJitterbug_you_made_sound_so_diffic_731188: "你说得那么复杂，其实你可以直接说“等价交换”。"
  npc_override_1@jtb_NightmarishJitterbug_you_might_different_expe_e75cc7: "在这个充满不可思议谜团的地方，你这次可能会有不同的体验。请让露兰为你打开 portal。"
  npc_override_1@jtb_NightmarishJitterbug_you_moron_s_worth_nothin_ad8fdd: "你这个笨蛋，那不值钱。你的合同已经到期了，但承诺就是承诺，我打算信守它。"
  npc_override_1@jtb_NightmarishJitterbug_you_must_level_dc71e3: "^ff0000你必须达到 120 级。^000000"
  npc_override_1@jtb_NightmarishJitterbug_you_promised_you_re_kind_eb1407: "你承诺过。你很善良。"
  npc_override_1@jtb_NightmarishJitterbug_you_protect_me_you_re_7f78e0: "你保护我。你很善良。"
  npc_override_1@jtb_NightmarishJitterbug_you_re_braver_than_i_bf78eb: "你比我想象的勇敢。"
  npc_override_1@jtb_NightmarishJitterbug_you_re_famous_newoz_nice_04d84f: "你就是著名的纽沃斯！很高兴认识你。我的主人告诉了我很多关于你的伟大事迹……"
  npc_override_1@jtb_NightmarishJitterbug_you_re_good_you_ll_cddfe3: "你很棒。你会成为出色的舞娘和宫廷乐师。"
  npc_override_1@jtb_NightmarishJitterbug_you_re_lagi_right_i_5e8e61: "你是 Lagi，对吧？我喜欢你的思维方式。我很想找个时间和你一起工作。"
  npc_override_1@jtb_NightmarishJitterbug_you_re_prospect_now_work_7167aa: "你目前是预备成员。为公会努力工作，也许有一天我会提拔你。"
  npc_override_1@jtb_NightmarishJitterbug_you_re_reacting_maybe_mu_573007: "你没反应。也许蘑菇根本没有毒。也许我该试试……"
  npc_override_1@jtb_NightmarishJitterbug_you_re_singing_strange_s_d47767: "但你在唱一首奇怪的歌，还有……绿色药水？"
  npc_override_1@jtb_NightmarishJitterbug_you_re_smart_capable_tel_cbb7be: "你很聪明，还会传送。Roter，我们不能让她走。"
  npc_override_1@jtb_NightmarishJitterbug_you_re_spoilsport_you_kn_0b53f2: "你真扫兴，你知道吗？"
  npc_override_1@jtb_NightmarishJitterbug_you_re_strange_b1a877: "你很奇怪。"
  npc_override_1@jtb_NightmarishJitterbug_you_ready_yet_you_give_2d8f1c: "准备好了吗？没信心的话可以放弃。"
  npc_override_1@jtb_NightmarishJitterbug_you_really_ask_who_s_41849a: "你真的需要问吗？那个女孩是谁？她是你的吗？"
  npc_override_1@jtb_NightmarishJitterbug_you_remember_when_you_tw_d5abbf: "你还记得你们两个在普隆德拉南门为那个花店女孩打架的时候吗？或者东门的玩偶商人因为你们争吵赶走顾客而揍你们的时候？"
  npc_override_1@jtb_NightmarishJitterbug_you_seem_fond_roel_f8c7a7: "你看起来很喜欢 Roel。"
  npc_override_1@jtb_NightmarishJitterbug_you_seen_pendant_b600de: "你看过这个吊坠吗？"
  npc_override_1@jtb_NightmarishJitterbug_you_seen_shaloshi_where_cdb20b: "你看到沙洛希了吗？她在哪里？"
  npc_override_1@jtb_NightmarishJitterbug_you_serious_even_people_e8fd2e: "你是认真的吗？连你这样的人都找到了爱情。那我呢？！"
  npc_override_1@jtb_NightmarishJitterbug_you_speak_like_grown_up_353bba: "你现在说话像个成年人了，圆滑而清晰。"
  npc_override_1@jtb_NightmarishJitterbug_you_stay_here_kiddo_i_83a32f: "你留在这里，小鬼。我去。"
  npc_override_1@jtb_NightmarishJitterbug_you_t_a9f406: "你不能那样做！"
  npc_override_1@jtb_NightmarishJitterbug_you_talk_you_hear_other_bc87c8: "你能说话，还能听到别人的想法。真聪明。"
  npc_override_1@jtb_NightmarishJitterbug_you_them_us_fae0e0: "而你有他们。我们。"
  npc_override_1@jtb_NightmarishJitterbug_you_think_s_meaningless_657045: "你觉得我们继续深入没有意义吗？"
  npc_override_1@jtb_NightmarishJitterbug_you_ve_met_him_today_f1436a: "你今天才见到他，但除非你是傻瓜，否则你应该知道。"
  npc_override_1@jtb_NightmarishJitterbug_your_hand_warm_abeb99: "你的手……很温暖。"
  npc_override_1@jtb_NightmarishJitterbug_your_party_leader_yet_cr_87fed9: "^ff0000你的队伍领袖还没有创建时间裂缝。^000000"
