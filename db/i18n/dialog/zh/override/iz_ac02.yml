Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_iz_ac02_academy_aaaahh_don_t_hurt_me_910632: "'啊啊啊！！别打我 ~'"
  npc_override_iz_ac02_academy_about_kafra_service_c5bae8: "关于卡普拉服务~！"
  npc_override_iz_ac02_academy_about_shop_variety_f0d151: "关于商店的物品种类。"
  npc_override_iz_ac02_academy_about_use_skill_8d73e3: "这是关于技能的使用方法。"
  npc_override_iz_ac02_academy_about_useful_stats_thief_4ce8f7: "关于对盗贼有用的属性"
  npc_override_iz_ac02_academy_above_job_level_any_thie_505c38: "Job 等级达到 40 以上，任何盗贼都可以随时转职为流氓。"
  npc_override_iz_ac02_academy_above_money_charged_you_d11b69: "将收取以上金额。要进行精炼吗？"
  npc_override_iz_ac02_academy_absolutely_62717b: "当然！"
  npc_override_iz_ac02_academy_absolutely_official_stan_a25f92: "这绝对不代表克里图拉学院的官方立场。"
  npc_override_iz_ac02_academy_academy_people_you_could_b7773f: "学院里有人可以成为你一生的伙伴。"
  npc_override_iz_ac02_academy_academy_people_you_make_c68b9b: "学院里有人可以成为你一生的同伴。"
  npc_override_iz_ac02_academy_academy_st_floor_great_h_021899: "学院一楼大厅"
  npc_override_iz_ac02_academy_academy_trainer_downstai_c223df: "学院楼下有一位教官，他会给你进行实战训练。去找他训练你的技能吧。"
  npc_override_iz_ac02_academy_accident_1b4b19: "- 一场意外……"
  npc_override_iz_ac02_academy_accordance_principles_gu_af0ad6: "根据公会的原则，实战训练并非强制性的。"
  npc_override_iz_ac02_academy_according_class_aptitude_b7bd8c: "根据职业倾向测试的结果！"
  npc_override_iz_ac02_academy_according_individual_tas_2b57b8: "根据个人的喜好和目的，你需要分配你的能力点数。"
  npc_override_iz_ac02_academy_acolyte_categorized_as_s_9a766a: "服事分为^ff0000辅助型^000000和^ff0000物理攻击型^000000。"
  npc_override_iz_ac02_academy_acolyte_instructor_navi_de1ada: "服事教官 <NAVI>[爱丽丝]<INFO>iz_ac02,156,169</INFO></NAVI>"
  npc_override_iz_ac02_academy_acolyte_lots_skills_d1b03a: "服事拥有很多技能。"
  npc_override_iz_ac02_academy_acolyte_serves_odin_so_u_133371: "服事侍奉^ff0000奥丁^000000，因此可以根据奥丁的意志使用^ff0000圣属性技能^000000。"
  npc_override_iz_ac02_academy_actual_exercise_stealing_87df79: "原本计划进行^4d4dff从魔物身上偷取道具^000000的实际练习，但是……"
  npc_override_iz_ac02_academy_actual_experience_assign_07327f: "关于技能的实际体验任务？"
  npc_override_iz_ac02_academy_actual_fighting_actual_f_be2e05: "实战！！实战才是关键！！"
  npc_override_iz_ac02_academy_addition_there_those_who_f33d3b: "此外，也有人通过^4d4dff提升 VIT 来增加 HP 活力^000000，以参与攻城战。"
  npc_override_iz_ac02_academy_addition_these_you_learn_c26e84: "除了这些，你还可以学习……"
  npc_override_iz_ac02_academy_additional_lecture_provi_a075ee: "附加讲座将由萨利姆·哈米德先生提供。啊，我有点东西要给你。"
  npc_override_iz_ac02_academy_addtion_there_other_stat_354fd5: "此外，还有黑暗、冰冻、诅咒、石化、混乱等其他状态，我可以让你全部体验一遍。"
  npc_override_iz_ac02_academy_adorable_style_12ed38: "这是一种可爱的风格。"
  npc_override_iz_ac02_academy_adventurers_nd_job_trans_ab037f: "Base 等级达到 99 且 Job 等级达到 50 以上的二转冒险者，可以转职为三转职业。"
  npc_override_iz_ac02_academy_after_changing_swordsman_f2966d: "转职为剑士后，你可以转职为^0000FF骑士^000000或^0000FF十字军^000000。"
  npc_override_iz_ac02_academy_after_clear_up_mess_you_730a20: "你清理完混乱后，走向那个被攻击的人。"
  npc_override_iz_ac02_academy_after_crossing_bridge_yo_72a6bd: "^8B4513过桥^000000后，你就会看到^FF0000吉芬^000000的入口！"
  npc_override_iz_ac02_academy_after_getting_cookbook_n_ec10f6: "拿到食谱书之后，下一步准备是……！"
  npc_override_iz_ac02_academy_after_i_look_around_more_ee438d: "我再四处看看之后。"
  npc_override_iz_ac02_academy_after_looking_over_repor_f3df05: "看完报告后，你获得了经验值和一张卡普拉仓库优惠券。"
  npc_override_iz_ac02_academy_after_wedding_ceremony_y_9c8432: "婚礼仪式结束后，你们可以在只属于你们的^0000cd佳哇伊^000000度假村享受甜蜜的蜜月。"
  npc_override_iz_ac02_academy_after_you_register_as_st_dd2de3: "在你注册为学生后，你可以上课并获得更多经验。"
  npc_override_iz_ac02_academy_age_there_nothing_i_84d98a: "年龄！我对此无能为力。"
  npc_override_iz_ac02_academy_aggressive_they_only_att_c61aa1: "非攻击性……它们只在遇到危险时才会用毒刺攻击。"
  npc_override_iz_ac02_academy_agi_increases_attacking_18a1e3: "^0000FF敏捷^000000提升^FF0000攻击速度^000000和^FF0000回避率^000000，"
  npc_override_iz_ac02_academy_agi_increases_attacking_ee486c: "^0000FF敏捷^000000提升^FF0000攻击速度^000000和^FF0000回避率^000000。"
  npc_override_iz_ac02_academy_agi_one_very_important_f_c448aa: "敏捷对你——一个身着轻甲的盗贼——来说是非常重要的数值，因为你需要回避敌人的攻击而不是正面硬抗。"
  npc_override_iz_ac02_academy_agi_raise_your_evasion_r_5c9c01: "^4d4dff敏捷可以提高回避率和攻击速度（ASPD）。^000000简单来说，就是让你变得灵活。"
  npc_override_iz_ac02_academy_agi_related_flee_ability_18f6a3: "^4d4dff敏捷与回避能力相关^000000，"
  npc_override_iz_ac02_academy_ah_again_i_been_out_a21e5e: "啊……又来了！！我出去狩猎兽人了。"
  npc_override_iz_ac02_academy_ah_as_said_you_t_358694: "啊，正所谓骗不过鬼……你迟早会被邪恶发现的。"
  npc_override_iz_ac02_academy_ah_course_though_i_don_1398e1: "啊，当然，虽然我不做转职，但我的最终目标可以是宫廷乐师。不过，我不会向现实妥协。总有一天我会成为最好的宫廷乐师。"
  npc_override_iz_ac02_academy_ah_i_am_sorry_i_bb7ccd: "啊，抱歉。我抓到了一个忙人。"
  npc_override_iz_ac02_academy_ah_i_ask_your_favor_c2e710: "啊！！这次也请你帮个忙。"
  npc_override_iz_ac02_academy_ah_i_don_t_like_5889c8: "啊……我不喜欢这样。"
  npc_override_iz_ac02_academy_ah_i_happened_come_up_4619ce: "啊！我刚好又想到了一个很棒的诗意灵感……记下来……记下来……"
  npc_override_iz_ac02_academy_ah_i_missed_armor_armor_84a146: "啊，我忘了说防具了。防具每精炼一次，防御力可以增加^A20B091^000000。"
  npc_override_iz_ac02_academy_ah_i_remember_almond_j_c13f5a: "啊！！我记得和我一起从依斯鲁得分部来的阿尔蒙德 J 想做广告……"
  npc_override_iz_ac02_academy_ah_mayssel_05044a: "啊，那是……梅塞尔……"
  npc_override_iz_ac02_academy_ah_my_story_went_off_ddb7a6: "啊，我说跑题了。"
  npc_override_iz_ac02_academy_ah_s_you_213c50: "啊，是你啊。"
  npc_override_iz_ac02_academy_ah_see_s_growing_back_685ae1: "啊……看，它又长出来了。"
  npc_override_iz_ac02_academy_ah_seems_you_already_tho_1b7963: "啊，看来你已经满足那些条件了！"
  npc_override_iz_ac02_academy_ah_so_125d4f: "啊……是这样吗？"
  npc_override_iz_ac02_academy_ah_so_don_t_worry_0fcbf0: "啊，是这样吗？别担心。"
  npc_override_iz_ac02_academy_ah_speaking_those_poring_1c0182: "啊！说到这个，^4d4dff这座岛上的波利^000000会掉落一些我们可以用来修理的材料。"
  npc_override_iz_ac02_academy_ah_still_basic_training_0df4c0: "啊，还在基础训练吧？你不会随便使用蝴蝶翅膀吧？"
  npc_override_iz_ac02_academy_ah_thank_you_your_pointo_192568: "啊……谢谢你的指正。"
  npc_override_iz_ac02_academy_ah_there_somebody_who_st_ee93f6: "啊，在你之前刚有人开始训练了！"
  npc_override_iz_ac02_academy_ah_weapons_hehehe_i_didn_2921ab: "啊！！武器？嘿嘿嘿……我还没跟你解释清楚呢。"
  npc_override_iz_ac02_academy_ah_what_all_fools_land_c28a78: "啊，这片土地上的傻瓜们都吃些什么呢？"
  npc_override_iz_ac02_academy_ah_why_1d8b8d: "啊，为什么不呢？"
  npc_override_iz_ac02_academy_ah_yes_ebed1c: "啊，是的……"
  npc_override_iz_ac02_academy_ah_you_curious_about_hid_84f24f: "啊！你对隐藏附魔感兴趣吗？"
  npc_override_iz_ac02_academy_ah_you_made_all_way_4c5e55: "啊，你一路走到这里来了。对学院的学生来说很不错！"
  npc_override_iz_ac02_academy_ah_you_re_back_now_c617eb: "啊你回来了，现在穿着可爱的神枪手服装！很适合你，恭喜！"
  npc_override_iz_ac02_academy_ah_you_ve_become_skilled_fcd04e: "啊~ 你已经成为一个熟练的弓箭手了。"
  npc_override_iz_ac02_academy_ah_you_want_change_magic_133887: "啊~ 你想转职为魔法师？"
  npc_override_iz_ac02_academy_ah_your_reference_i_am_005181: "啊，顺便说一下，我在里希塔乐镇经营着一家小工坊。"
  npc_override_iz_ac02_academy_aha_i_think_i_got_669860: "啊哈~ 我想我误会你了。让我们重新开始讲课吧。"
  npc_override_iz_ac02_academy_aha_if_you_want_all_c5fe1f: "啊哈~ 如果你想要各种不同的技能……"
  npc_override_iz_ac02_academy_aha_you_want_know_about_f8afa3: "啊哈！你想知道烹饪的好处吗？熟食有两个好处！"
  npc_override_iz_ac02_academy_ahaa_no_sweat_no_sweat_6d10ce: "啊哈。没关系没关系。跟那些无知的人讲这些故事是没用的。"
  npc_override_iz_ac02_academy_ahaaa_sticking_dispensar_b0a297: "啊啊啊~~ 赖在医务室不走。"
  npc_override_iz_ac02_academy_ahahaha_already_time_whi_4662b8: "啊哈哈哈……已经到时间了？虽然我还在里面……别担心。"
  npc_override_iz_ac02_academy_ahem_906e86: "咳咳..~"
  npc_override_iz_ac02_academy_ahem_you_want_read_style_aedf2f: "咳咳.. 你还想看发型书吗？"
  npc_override_iz_ac02_academy_ahh_6693aa: "啊啊……那个？"
  npc_override_iz_ac02_academy_ahh_hey_sir_orleons_doin_3eefb0: "啊啊。嘿，奥尔良爵士过得还好吗？"
  npc_override_iz_ac02_academy_ahhh_boring_boring_b6fa12: "啊啊啊。无聊，无聊……"
  npc_override_iz_ac02_academy_ahhh_irritating_0a7a01: "啊啊啊。真烦人。"
  npc_override_iz_ac02_academy_ahhh_yes_f74526: "啊啊，是的……"
  npc_override_iz_ac02_academy_ahhh_you_two_calm_down_6c75bd: "啊啊，你们两个冷静点。"
  npc_override_iz_ac02_academy_aid_type_acolyte_weaknes_cd900b: "但是辅助型服事有一个弱点，那就是^ff0000单独狩猎比较困难^000000。"
  npc_override_iz_ac02_academy_aim_poring_hunt_one_pori_5912db: "目标是波利，^4d4dff用技能猎杀一只波利"
  npc_override_iz_ac02_academy_airship_information_c0cea2: "==== 飞艇信息 ===="
  npc_override_iz_ac02_academy_airship_information_f60d50: "==== 飞艇信息 ===="
  npc_override_iz_ac02_academy_alberta_byalan_island_vi_8a2e7f: "可以前往^8B4513艾尔贝塔^000000或^8B4513依斯鲁得海盗地洞^000000。"
  npc_override_iz_ac02_academy_alberta_merchant_guild_t_ad781d: "另外，在艾尔贝塔的商人公会里，有一位制作药水的老人。"
  npc_override_iz_ac02_academy_alchemist_biochemist_hig_265fad: "^4d4dff炼金术士^000000或^4d4dff生物学家^000000，以及更高级的职业^4d4dff基因学者^000000，都擅长制作药水。"
  npc_override_iz_ac02_academy_all_attacks_impossible_n_251a42: "但并非所有攻击都无法使用。在沉默状态下，普通攻击仍然可以进行。"
  npc_override_iz_ac02_academy_all_i_explain_you_611c46: "我能向你解释的就这些了。"
  npc_override_iz_ac02_academy_all_materials_world_thei_ff71c5: "世界上所有的材料都有其自身的属性。"
  npc_override_iz_ac02_academy_all_monsters_midgard_our_511ebf: "并非米德加尔特的所有魔物都想要你的命，只是大部分而已。"
  npc_override_iz_ac02_academy_all_ongoing_courses_canc_ee17cd: "所有正在进行的课程都被取消了。"
  npc_override_iz_ac02_academy_all_right_class_over_029623: "好了。下课。"
  npc_override_iz_ac02_academy_all_right_come_way_294ff6: "好了，往这边走。"
  npc_override_iz_ac02_academy_all_right_good_bye_f26aa0: "好了。再见。"
  npc_override_iz_ac02_academy_all_right_here_s_questio_9e852e: "好了，问题是——我们属于什么属性？"
  npc_override_iz_ac02_academy_all_right_s_done_984b71: "好了！！！！完成了！！！！！！！！"
  npc_override_iz_ac02_academy_all_right_you_see_those_804c82: "好了，你看到那边的^3131FF火蛋^000000了吗？"
  npc_override_iz_ac02_academy_all_skills_learnt_over_y_b7e654: "你所学的所有技能都可以使用。"
  npc_override_iz_ac02_academy_all_these_arena_b1bc8a: "所有这些都在竞技场！！"
  npc_override_iz_ac02_academy_all_these_things_possibl_4a60f6: "当你的宠物^3131FF亲密度^000000非常高时，所有这些事情都是可能的。"
  npc_override_iz_ac02_academy_all_these_you_248f5e: "这些都是给你的……"
  npc_override_iz_ac02_academy_all_those_skills_useful_5ce13c: "所有这些技能都很有用。"
  npc_override_iz_ac02_academy_all_transportation_made_2a2061: "所有的交通都是通过传送门进行的。"
  npc_override_iz_ac02_academy_all_you_click_middle_slo_4a7a35: "你所需要做的就是^3131FF点击^000000老虎机的中间。"
  npc_override_iz_ac02_academy_all_you_see_stars_ea0ac9: "你所看到的都是星星……"
  npc_override_iz_ac02_academy_almond_j_cat_charge_hidd_747013: "那边的猫——阿尔蒙德 J，负责隐藏附魔。"
  npc_override_iz_ac02_academy_almost_miracle_meet_you_584b91: "能和你我这样远离地面光芒生活的人相遇，简直是个奇迹。"
  npc_override_iz_ac02_academy_already_know_56262c: "已经知道了。"
  npc_override_iz_ac02_academy_alright_s_good_821b67: "好吧，那很好。"
  npc_override_iz_ac02_academy_also_differs_cooking_lev_ec3d06: "这也因烹饪等级而异，有些只能恢复 HP。"
  npc_override_iz_ac02_academy_also_give_you_recipe_mak_a63223: "并且还会给你制作药水的配方，让你轻松制作。"
  npc_override_iz_ac02_academy_also_helps_sp_recovery_79e948: "它还有助于^ff0000SP 恢复^000000。"
  npc_override_iz_ac02_academy_also_sensitive_insects_r_985aff: "敏感的昆虫也能识别它……"
  npc_override_iz_ac02_academy_also_swordsman_s_vitalit_67600e: "剑士的体质通常也很高，这使得他们能够携带大量的重量。"
  npc_override_iz_ac02_academy_although_he_very_blunt_h_0a7228: "虽然他说话很直率，但他确实非常关心新人。"
  npc_override_iz_ac02_academy_although_i_don_t_any_0a1ffb: "虽然我对你没有什么特别的感觉，"
  npc_override_iz_ac02_academy_although_i_m_work_hand_5f325d: "虽然我只是这里的一名杂工，但看到学生们从这里毕业，成为优秀的社会成员，我感到很高兴。"
  npc_override_iz_ac02_academy_always_bring_carrots_so_d0f01e: "它总是随身携带^ff0000胡萝卜^000000，所以通过猎杀它们很容易获得美味的胡萝卜。"
  npc_override_iz_ac02_academy_always_healthy_strong_as_269f68: "永远像现在一样健康强壮。"
  npc_override_iz_ac02_academy_amatsu_town_where_you_go_e752ca: "你将抵达天津城。在一栋空房子里找到隐藏的通道。"
  npc_override_iz_ac02_academy_among_other_services_we_c08064: "在我们提供的其他服务中，还有卡普拉的客户积分服务！"
  npc_override_iz_ac02_academy_among_rogue_skills_there_c44de8: "在流氓的技能中，有一个叫做“威吓”的技能，你可以用这个技能学习并使用他人的技能，"
  npc_override_iz_ac02_academy_among_them_skill_called_78e7ed: "其中，^0000cd浪漫约会^000000是最浪漫的技能，可以将你的伴侣从世界任何地方召唤到你身边。"
  npc_override_iz_ac02_academy_among_thief_s_skills_the_5039e5: "在盗贼的技能中，有一个叫做“提升回避”的技能。"
  npc_override_iz_ac02_academy_among_those_items_there_2045d9: "在这些物品中，有些是你不能丢弃或交易的，它们是任务物品。这些是重要物品，但有时你也会发现它们是个负担。"
  npc_override_iz_ac02_academy_amount_stat_increase_cha_6347e7: "属性提升的数值会根据烹饪等级而变化。"
  npc_override_iz_ac02_academy_and_302f4f: "以及……"
  npc_override_iz_ac02_academy_annoying_you_need_regist_221828: "这很烦人……但你需要注册，以便接收^ff0000克里图拉学院的大量教育和服务^000000。"
  npc_override_iz_ac02_academy_anonymous_549885: "……匿名……"
  npc_override_iz_ac02_academy_any_chance_you_mind_lear_51a449: "顺便问一下，{0} 你有兴趣在这里了解更多关于商人的知识吗？"
