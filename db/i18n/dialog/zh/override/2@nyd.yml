Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_2@nyd_NydhoggsNest_about_hours_later_all_me_69ca8c: "大约3小时后，18名成员全部安全返回，每个人分享了他们收集到的情报。"
  npc_override_2@nyd_NydhoggsNest_after_establishment_rune_cf05a0: "卢恩-米德加尔特王国和阿鲁纳佩尔茨建立之后，关于他们部落、神话等的传闻便在暗中流传。"
  npc_override_2@nyd_NydhoggsNest_after_nidhoggur_s_shadow_3d4eb6: "尼德霍格的暗影消失后，至少需要3天时间才能稳定下来。"
  npc_override_2@nyd_NydhoggsNest_after_we_arrived_here_kn_3f943f: "当我们得知真相到达这里时，世界树已经因为萨帕族建造的众多工厂而处于非常糟糕的状态。"
  npc_override_2@nyd_NydhoggsNest_after_we_received_report_a5eb41: "在收到间谍关于世界树异常症状的报告后，我们认识到了马努克的存在。"
  npc_override_2@nyd_NydhoggsNest_after_what_happened_i_do_6e34e5: "在发生了这一切之后，我觉得他们不知道还能做什么。让我来解释一下。"
  npc_override_2@nyd_NydhoggsNest_ah_easy_decision_you_fri_61dc21: "啊，这不是一个容易的决定。你让我感到害怕。"
  npc_override_2@nyd_NydhoggsNest_ah_here_s_message_about_01db8d: "啊，这里有关于你的消息。据说要分享研究和报告的信息。"
  npc_override_2@nyd_NydhoggsNest_ah_how_tricky_you_testin_d12378: "啊……真狡猾……你在试探我们吗？"
  npc_override_2@nyd_NydhoggsNest_ah_i_see_29680f: "啊……我……明白了……"
  npc_override_2@nyd_NydhoggsNest_ah_if_you_re_done_1e35a2: "啊……如果你搬完了那些，这些应该放到3号架子B排。"
  npc_override_2@nyd_NydhoggsNest_ah_um_i_am_bd32c4: "啊……嗯……我……是……"
  npc_override_2@nyd_NydhoggsNest_ah_you_d_go_as_df29f1: "啊……你居然会这么说。帮助拉菲内族对你有什么好处？"
  npc_override_2@nyd_NydhoggsNest_ah_you_said_there_strang_9713db: "啊，你说有一股奇怪的力量挡住了通往守护者巢穴的入口，对吧？"
  npc_override_2@nyd_NydhoggsNest_ah_you_ve_come_proper_d37df4: "啊，你来得正是时候。我在查找阿鲁纳佩尔茨的报告时发现了一件有趣的事。"
  npc_override_2@nyd_NydhoggsNest_all_i_you_2d6255: "这……是我能为你做的全部了……"
  npc_override_2@nyd_NydhoggsNest_all_nidhoggur_s_guardian_644c6c: "尼德霍格的所有守护者都已被击败！"
  npc_override_2@nyd_NydhoggsNest_all_s_left_ugly_shadow_7c26b5: "剩下的，只有尼德霍格守护者那丑陋的暗影……那个正在陷入疯狂的暗影。"
  npc_override_2@nyd_NydhoggsNest_all_we_needed_you_what_ab7b38: "这就是我们需要你做的全部……剩下的是我们和拉菲内族之间的事了。"
  npc_override_2@nyd_NydhoggsNest_alright_i_ll_approve_you_352b50: "好吧，我批准你的请求，允许你调查拉菲内族藏在洞穴里的秘密。"
  npc_override_2@nyd_NydhoggsNest_alright_now_we_cooperate_1ab3dc: "好的，从现在开始，我们将与你合作，并允许你直接与拉菲内族囚犯对话。"
  npc_override_2@nyd_NydhoggsNest_alright_s_as_you_assumed_a634f8: "好吧……正如你所猜测的，那是一个连接世界树的地方。也是守护者的巢穴。"
  npc_override_2@nyd_NydhoggsNest_also_remember_spell_s_ne_fdd382: "另外，记住这个咒语，它是打开守护者之门所必需的。"
  npc_override_2@nyd_NydhoggsNest_although_they_ignore_you_80c1cb: "虽然他们无视你的过往记录，但还是要小心……"
  npc_override_2@nyd_NydhoggsNest_amanvilshar_ie_dorlushar_84d5da: "阿曼维尔沙尔 伊 多尔卢沙尔 穆 雷"
  npc_override_2@nyd_NydhoggsNest_anomardu_ha_odesudenver_e68e2e: "阿诺马尔杜 哈 奥德苏登维尔 伊"
  npc_override_2@nyd_NydhoggsNest_anyway_i_m_just_exhauste_83e943: "总之……我在这场徒劳而令人紧张的局面中已经精疲力竭了……唉。"
  npc_override_2@nyd_NydhoggsNest_anyway_i_should_make_sur_c94671: "总之，我应该确保你读完所有这些书，然后我就继续做我的工作了。"
  npc_override_2@nyd_NydhoggsNest_anyway_let_s_try_contact_5e8be8: "总之，我们先试着联系他们，确认一下洞穴或宝藏的情况。"
  npc_override_2@nyd_NydhoggsNest_arioss_please_compensate_4e8902: "阿里奥斯，请给这位陌生人的帮助予以补偿。我需要去休息了……"
  npc_override_2@nyd_NydhoggsNest_as_i_expected_cave_entra_55fce8: "正如我所料，这个洞穴是通往世界树树根的入口之一……"
  npc_override_2@nyd_NydhoggsNest_as_i_put_my_hands_c4b611: "当我把手放在石门上的时候，一个声音从我的心底响起。"
  npc_override_2@nyd_NydhoggsNest_as_leader_sapha_tribe_i_b8378f: "作为萨帕族的首领，我有非常重要的事情要告诉你。这就是我叫你来的原因……"
  npc_override_2@nyd_NydhoggsNest_as_you_seen_neither_saph_bae6a2: "如你们所见，世界树的衰弱既不是萨帕族的错，也不是拉菲内族的错。一切都归咎于守护者的暗影……"
  npc_override_2@nyd_NydhoggsNest_ask_laphines_about_explo_0b208f: "向拉菲内族询问探索的事……"
  npc_override_2@nyd_NydhoggsNest_assassins_terrible_past_5f9a94: "刺客们与魔王梦罗克有着一段可怕的过去，所以他们聚集了18名成员追捕他。"
  npc_override_2@nyd_NydhoggsNest_because_angry_leave_guar_732bc8: "但因为守护者愤怒地离开，他的暗影正在肆虐世界树？"
  npc_override_2@nyd_NydhoggsNest_because_his_disppearance_1c4338: "而因为他的消失，守护者的暗影正在摧毁世界树的树根……？"
  npc_override_2@nyd_NydhoggsNest_because_those_many_unexp_68cc07: "由于这些许多意想不到的原因，本应深藏地下的守护者巢穴被你们的种族发现了……"
  npc_override_2@nyd_NydhoggsNest_because_war_against_laph_9c34e5: "因为与拉菲内族的战争，一切都乱成一团。但即便如此，我们也不能允许外来种族的干涉。"
  npc_override_2@nyd_NydhoggsNest_before_we_captured_broug_683ba9: "在我们被俘带到这里之前，包括我在内有3名侍从。我们的任务是治疗世界树。"
  npc_override_2@nyd_NydhoggsNest_before_you_go_back_docto_94a249: "在你回去见博士之前，最好把这些书读完。那么，我要回去工作了。"
  npc_override_2@nyd_NydhoggsNest_below_gorgeous_stones_st_5350b3: "华丽的石头下方，有一股奇怪的风在流动。"
  npc_override_2@nyd_NydhoggsNest_better_go_back_camp_info_14b133: "最好回营地去告诉其他人并寻求帮助。"
  npc_override_2@nyd_NydhoggsNest_better_if_you_returned_a_8b7f21: "如果你读完所有内容再回来会更好。那是我们未来该做什么的基础数据。"
  npc_override_2@nyd_NydhoggsNest_birth_world_fiction_odin_d45049: "《世界的诞生》、《奥丁神话的虚构》、《诸神之战之后》、《部落之梦》……各式各样的书……"
  npc_override_2@nyd_NydhoggsNest_both_sides_act_ambiguous_617805: "双方都态度暧昧，所以……我开始担心了……"
  npc_override_2@nyd_NydhoggsNest_bring_him_neat_etorr_all_ea7e1a: "带他去尼尔·埃托尔那里。全体士兵做好准备。"
  npc_override_2@nyd_NydhoggsNest_browse_around_take_look_9bb954: "四处看看，翻阅一下这些书。"
  npc_override_2@nyd_NydhoggsNest_calm_down_sir_i_throw_f01a4a: "请冷静，长官。我会把这个外人关进监狱。"
  npc_override_2@nyd_NydhoggsNest_captive_only_reference_o_a3767e: "那个囚犯是我们部落唯一的线索，所以我们对她照顾得很好。她与你目前的调查有关。"
  npc_override_2@nyd_NydhoggsNest_careful_careful_shadow_s_42e86d: "还有……小心……小心暗影的力量。"
  npc_override_2@nyd_NydhoggsNest_cautious_your_actions_we_48fd91: "请谨慎行事。我们和萨帕族之间已经有够多的问题了。"
  npc_override_2@nyd_NydhoggsNest_combat_odin_vs_gods_god_bfa052: "奥丁与诸神的战斗，以及神子们的使命……博士一生都在研究这个。"
  npc_override_2@nyd_NydhoggsNest_come_least_more_servant_077d85: "至少再带一个侍从……只有队长才能获准进入尼德霍格的巢穴。"
  npc_override_2@nyd_NydhoggsNest_command_officers_make_su_eaaec3: "但指挥官们确信那里隐藏着什么。"
  npc_override_2@nyd_NydhoggsNest_commander_agip_want_talk_5a420f: "阿吉普指挥官想跟我谈谈？让我们听听他的故事。"
  npc_override_2@nyd_NydhoggsNest_commander_b56794: "指挥官……"
  npc_override_2@nyd_NydhoggsNest_commander_we_need_alert_f37ea1: "指挥官……我们需要通知部落的其他人吗……？"
  npc_override_2@nyd_NydhoggsNest_commander_you_sure_we_do_557313: "指挥官……你确定吗？我们甚至不知道他们是敌是友……"
  npc_override_2@nyd_NydhoggsNest_continuously_adventurers_9bb68e: "来自卢恩-米德尔特的冒险者不断攻击他，他的力量正在慢慢流失。他需要更多时间才能完全复活。"
  npc_override_2@nyd_NydhoggsNest_cooperate_investigate_wh_c29c1e: "合作调查？你是什么意思？"
  npc_override_2@nyd_NydhoggsNest_course_a9667f: "那当然！"
  npc_override_2@nyd_NydhoggsNest_course_be6167: "当然。"
  npc_override_2@nyd_NydhoggsNest_course_we_don_t_know_55ceae: "当然……我们不知道他们是否讲道理……呵呵。"
  npc_override_2@nyd_NydhoggsNest_currently_one_sapha_trib_f09e4a: "目前，一名萨帕族人从次元峡谷的另一边被发现。"
  npc_override_2@nyd_NydhoggsNest_darkness_took_over_guard_8e78e8: "黑暗吞噬了守护者并毁灭了所有生灵……现在这个地方已经变成了怪物盘踞的诅咒之地。"
  npc_override_2@nyd_NydhoggsNest_day_timer_removed_when_y_9e60c3: "当你关闭此对话框时，3天计时器将被移除。"
  npc_override_2@nyd_NydhoggsNest_defeat_all_nidhoggur_s_g_aeb255: "击败尼德霍格的所有守护者，穿过瀑布进入巢穴……在那里阻止尼德霍格的暗影。"
  npc_override_2@nyd_NydhoggsNest_defeat_nidhoggur_s_shado_75adfb: "随着尼德霍格暗影的败亡，世界树尤克特拉希尔的树根也受到了影响。"
  npc_override_2@nyd_NydhoggsNest_did_you_find_anything_ab_866ed7: "你找到关于萨帕和拉菲内族的任何信息了吗？"
  npc_override_2@nyd_NydhoggsNest_did_you_find_cave_fairy_77009b: "你找到精灵族视为圣地的洞穴了吗？你真是个难缠的家伙。你发现了什么？"
  npc_override_2@nyd_NydhoggsNest_doctor_never_ever_tries_a9d708: "博士从来不肯回来，事情又那么多……我怎么可能做得完……"
  npc_override_2@nyd_NydhoggsNest_doctor_said_he_pick_up_dfaf29: "博士说他会通过别人来取书。再说了，你不需要先了解基本信息再行动吗？"
  npc_override_2@nyd_NydhoggsNest_don_t_attract_too_much_70163d: "不要太引人注目，那会让你们的人丢脸的。"
  npc_override_2@nyd_NydhoggsNest_don_t_misunderstand_rece_1bdcf6: "别误会……最近我们讨论过你们这个特别的种族，我们的指挥官对你们心存感激。"
  npc_override_2@nyd_NydhoggsNest_don_t_you_see_i_14a129: "你没看到我很忙吗？别磨蹭了，快走吧！"
  npc_override_2@nyd_NydhoggsNest_don_t_you_see_i_20a115: "你没看到我很忙吗？别犹豫了，照做就是了。"
  npc_override_2@nyd_NydhoggsNest_during_out_last_battle_s_1452a1: "在上一场与萨帕族的战斗中……他们抓住了我，把我俘虏了。"
  npc_override_2@nyd_NydhoggsNest_during_time_your_people_3009eb: "在此期间，你们的人民通过时空裂隙来到了这片土地。"
  npc_override_2@nyd_NydhoggsNest_end_they_harmed_part_wor_c792ff: "最终，他们损害了靠近矿山的树根部分，因此世界树病得很重。"
  npc_override_2@nyd_NydhoggsNest_enter_password_69b805: "请输入密码。"
  npc_override_2@nyd_NydhoggsNest_enter_password_exactly_6f3b0d: "请输入正确的密码。"
  npc_override_2@nyd_NydhoggsNest_even_caring_about_single_0e9a40: "连一点都毫不在意吗？真是个愚蠢的女人……"
  npc_override_2@nyd_NydhoggsNest_even_if_i_don_t_8e1880: "就算我不说，我的处境也不会改变。"
  npc_override_2@nyd_NydhoggsNest_even_though_i_seen_my_a59887: "虽然我没有亲眼所见，但这确实解释了为什么我们会与伟大的世界树尤克特拉希尔失去联系。"
  npc_override_2@nyd_NydhoggsNest_even_though_long_time_we_f95b04: "虽然我们长期攻击萨帕族，试图迫使他们离开，但他们并不容易被击败，导致这种僵持局面。"
  npc_override_2@nyd_NydhoggsNest_ever_since_years_ago_he_0e4872: "从5年前开始，他就一直对世界的起源感到好奇，于是他开始寻找创世之神。"
  npc_override_2@nyd_NydhoggsNest_explain_about_guardian_n_972a3d: "解释守护者尼德霍格离开的事。"
  npc_override_2@nyd_NydhoggsNest_explain_professor_magnif_534e58: "解释马格尼法教授的理论。"
  npc_override_2@nyd_NydhoggsNest_explain_sudden_leave_gua_464981: "解释守护者的突然离开。"
  npc_override_2@nyd_NydhoggsNest_exploring_what_choose_yo_13c5c9: "探索什么？说话要谨慎。"
  npc_override_2@nyd_NydhoggsNest_finding_another_line_wor_391902: "找另一份工作可能很有价值，但只有历史学家才能真正了解这个世界……"
  npc_override_2@nyd_NydhoggsNest_finished_removing_quest_57df74: "已完成移除任务计时器。"
  npc_override_2@nyd_NydhoggsNest_first_report_commander_a_072fbd: "首先，向阿吉普指挥官报告，然后根据情况行动。让我整理一下研究结果……"
  npc_override_2@nyd_NydhoggsNest_firstly_we_should_find_o_f240fa: "首先，我们应该进一步了解那个地方。我想我们能行，但是……没有别人的帮助我们能做的有限。"
  npc_override_2@nyd_NydhoggsNest_frankly_i_don_t_think_6c1904: "坦白说，我不认为你或任何萨帕人是我们的敌人。唉……"
  npc_override_2@nyd_NydhoggsNest_gate_open_soon_go_defeat_50456c: "大门即将开启。去消灭所有守护者吧。"
  npc_override_2@nyd_NydhoggsNest_gate_open_soon_go_defeat_f46f39: "大门即将开启。去消灭所有守护者吧……你必须在30分钟内全部消灭，大门才会开启……"
  npc_override_2@nyd_NydhoggsNest_give_up_request_ask_laph_cf81d3: "放弃请求，改向拉菲内族求助。"
  npc_override_2@nyd_NydhoggsNest_go_find_fairy_guarding_g_0573d6: "去找守卫大门的精灵，说出这个咒语。"
  npc_override_2@nyd_NydhoggsNest_gosh_where_where_did_ugh_75ebda: "天哪！在哪里-？怎么-？呃！太难了！"
  npc_override_2@nyd_NydhoggsNest_great_stone_gate_stands_845978: "一座巨大的石门矗立在你面前。一条可怕的龙形雕塑伸展着看起来充满力量的翅膀。"
  npc_override_2@nyd_NydhoggsNest_guardian_nidhoggur_he_s_6aeac4: "守护者尼德霍格……他不在巢穴里。"
  npc_override_2@nyd_NydhoggsNest_guardian_s_insanity_caus_55da8a: "守护者的疯狂……是由我们未知的力量造成的……你必须把这件事告诉所有人。"
  npc_override_2@nyd_NydhoggsNest_guardian_s_nest_c86914: "守护者的巢穴？"
  npc_override_2@nyd_NydhoggsNest_guardian_seems_wish_alon_be18dc: "守护者似乎想要独处。我进去看看，请在外面等候。"
  npc_override_2@nyd_NydhoggsNest_guardian_something_s_wro_e6fb4b: "守护者……守护者出了什么问题。我不知道是什么让他变成这样的。"
  npc_override_2@nyd_NydhoggsNest_guest_other_world_please_614bad: "来自异世界的客人，请原谅我们的失礼……"
  npc_override_2@nyd_NydhoggsNest_he_asked_me_bring_some_7ad273: "他让我带一些报告过来。他没说什么吗？"
  npc_override_2@nyd_NydhoggsNest_he_proof_spell_confirm_y_d1231d: "这个证明和咒语将确认你是守护者的仆从之一。"
  npc_override_2@nyd_NydhoggsNest_he_researches_combat_bet_09d7da: "他研究奥丁与诸神之间的战斗，以及诸神的起源和生命。"
  npc_override_2@nyd_NydhoggsNest_he_said_he_send_message_1bd8eb: "他说他会给你发消息……你没收到吗？"
  npc_override_2@nyd_NydhoggsNest_he_sent_me_mail_over_1bdb8e: "他给我发了20多封邮件。我都不知道……"
  npc_override_2@nyd_NydhoggsNest_he_some_reason_abandoned_9b8566: "他……出于某种原因放弃了自己的暗影，然后离开了。"
  npc_override_2@nyd_NydhoggsNest_here_outsider_arioss_exp_50bbd6: "在这里，外人。阿里奥斯会解释关于巨人的情况。跟他说吧……"
  npc_override_2@nyd_NydhoggsNest_heterogenous_phenomenon_d67069: "这种异质现象需要被彻底仔细地研究，以了解他们的世界与我们的世界之间的关系。"
  npc_override_2@nyd_NydhoggsNest_hey_outsider_step_away_p_f18f2a: "嘿，外人！离囚犯远点！"
  npc_override_2@nyd_NydhoggsNest_hey_you_please_move_thes_ccfe7a: "嘿，你。请把这些书搬走。把它们放到3号架子B排。"
  npc_override_2@nyd_NydhoggsNest_his_highness_world_tree_fc158d: "世界树尤克特拉希尔殿下说了那样的话？"
  npc_override_2@nyd_NydhoggsNest_his_sons_grew_as_well_a62cdb: "但是，他的儿子们也在成长，最终他被奥丁、威利和维三兄弟从不同方向攻击杀死。"
  npc_override_2@nyd_NydhoggsNest_hm_good_job_maybe_i_3753e9: "嗯，干得好。也许我不用再检查别的了，对吧？"
  npc_override_2@nyd_NydhoggsNest_hmm_i_haven_t_seen_79b05d: "嗯……我一年多没见过他了！他现在在做什么？"
  npc_override_2@nyd_NydhoggsNest_hmph_even_if_i_don_833345: "哼……就算我不合作，我也知道你们会找别的办法进去的……"
  npc_override_2@nyd_NydhoggsNest_how_world_organized_way_c02ba5: "这个世界是如何组织的……以及未来该走的路！通过对过去和现在的研究，我们可以预测将要发生的事情。"
  npc_override_2@nyd_NydhoggsNest_hurry_leave_leave_place_f23e7f: "快……离开……趁还来得及，离开这个地方。"
  npc_override_2@nyd_NydhoggsNest_i_accept_your_entrance_t_e82474: "我准许你通过守护者之门进入。你现在被视为守护者尼德霍格的忠实仆从。"
  npc_override_2@nyd_NydhoggsNest_i_already_told_you_every_38cf40: "我已经告诉你所有你想知道的了。如果还有其他请求，请告诉我。"
  npc_override_2@nyd_NydhoggsNest_i_already_told_you_what_507a8e: "我已经告诉你想知道的了……如果还需要什么，告诉我一声就好。"
  npc_override_2@nyd_NydhoggsNest_i_check_mailbox_wait_min_576b45: "我去查看一下邮箱，稍等。如果无聊的话就读读那些书吧。"
  npc_override_2@nyd_NydhoggsNest_i_definitely_help_you_fi_6db4a6: "我一定会帮你找到直接进入世界树的方法，相信我！好的～！！"
  npc_override_2@nyd_NydhoggsNest_i_don_t_know_exactly_9028ba: "我不知道该怎么解释，但就像是它的心情不好。那里有很多可怕的怪物。"
  npc_override_2@nyd_NydhoggsNest_i_don_t_know_what_6e1422: "我不知道别人怎么看这事……但我们在对萨帕族的态度上确实有些问题。"
  npc_override_2@nyd_NydhoggsNest_i_give_you_my_proof_d5962a: "我会给你我的证明。别担心，我只是暂时将你标记为守护者的仆从。"
  npc_override_2@nyd_NydhoggsNest_i_heard_about_recent_exp_a1d261: "我听说最近有冒险者远征队尝试与部落取得联系……你听说过这事吗？"
  npc_override_2@nyd_NydhoggsNest_i_heard_you_search_any_bd7ad9: "我听说你被派去寻找北部封闭洞穴里的宝物。"
  npc_override_2@nyd_NydhoggsNest_i_hope_your_people_becar_e88456: "我希望你的人在这片土地上谨慎行事，并停止不必要的干预。"
  npc_override_2@nyd_NydhoggsNest_i_i_am_world_tree_dca5fa: "我……我是世界树尤克特拉希尔，尼德霍格守护者的仆从，也是领导拉菲内族的大祭司。"
  npc_override_2@nyd_NydhoggsNest_i_just_want_say_if_45f516: "我只想说……如果萨帕族侵入那个地方，我们绝不会原谅他们！"
  npc_override_2@nyd_NydhoggsNest_i_known_recently_time_br_7c3647: "我知道，最近时间出现了断层……所以你们来这里寻找解决方案，对吧？"
  npc_override_2@nyd_NydhoggsNest_i_ll_also_keep_searching_1d63e4: "我也会继续在这里搜寻。如果你发现了什么，回来告诉我。"
  npc_override_2@nyd_NydhoggsNest_i_m_guarding_laphine_pri_657ef8: "我在看守这个拉菲内族囚犯。别烦我。"
  npc_override_2@nyd_NydhoggsNest_i_m_just_following_order_bd660f: "我只是在执行命令。"
  npc_override_2@nyd_NydhoggsNest_i_must_explore_cave_c4c4a4: "我必须探索这个洞穴。"
  npc_override_2@nyd_NydhoggsNest_i_represent_entire_laphi_d7953a: "我代表整个拉菲内族，向你表达我们的感激之情。这对我们的指挥官来说一定很不容易……"
  npc_override_2@nyd_NydhoggsNest_i_send_message_my_assist_690146: "我会给我的助手发消息，她在普隆德拉图书馆。请帮她找到更多信息。"
  npc_override_2@nyd_NydhoggsNest_i_sent_you_figure_out_7c8c1c: "我派你去弄清楚未来工作所需的基础材料。你应该带研究报告回来……"
  npc_override_2@nyd_NydhoggsNest_i_shouldn_t_say_anymore_2bd791: "我不该再说了。请不要认为这是无礼，但请你现在走吧！"
  npc_override_2@nyd_NydhoggsNest_i_t_sure_he_thought_7bc252: "我不能确定，但他想过有一天这会发生。只是比他预期的要早爆发了。"
  npc_override_2@nyd_NydhoggsNest_i_thank_you_deeply_your_34d478: "我深深地感谢你的决定。我会用我残余的力量打开通往守护者巢穴的道路。"
  npc_override_2@nyd_NydhoggsNest_i_ve_recorded_your_reque_2fef51: "我已经记录了你的请求，你准备好进去了吗？"
  npc_override_2@nyd_NydhoggsNest_i_ve_taken_great_risk_532523: "让你进来我冒了很大的风险。所以请多加小心。"
  npc_override_2@nyd_NydhoggsNest_i_ve_talked_too_much_50622f: "我说得太多了……总之，正如你从我的报告中知道的，你发现了一件了不起的事！"
  npc_override_2@nyd_NydhoggsNest_i_waiting_you_s_good_843db9: "我正在等你。你平安回来真是太好了。你发现了什么？"
  npc_override_2@nyd_NydhoggsNest_i_waiting_you_you_came_465214: "我正在等你。你平安回来了，真是好消息。你发现了什么？"
  npc_override_2@nyd_NydhoggsNest_if_our_tribe_really_trus_268884: "如果我们部落真的信任萨帕族……我不知道。"
  npc_override_2@nyd_NydhoggsNest_if_s_true_you_ve_1a2655: "如果那是真的，你发现了自法力操控以来最伟大的发现。这不是很令人兴奋吗？"
  npc_override_2@nyd_NydhoggsNest_if_wasn_t_i_wouldn_732d4d: "如果不是因为那个……我在这里活不下去……"
  npc_override_2@nyd_NydhoggsNest_if_we_help_you_anything_c82804: "如果将来我们能帮上你什么忙，我们会尽全力协助你。再次感谢你。"
  npc_override_2@nyd_NydhoggsNest_if_what_you_re_saying_8978c4: "如果你说的是真的，那我们就再也没有理由继续与拉菲内族作战了……"
  npc_override_2@nyd_NydhoggsNest_if_you_cautious_your_act_bce0e5: "如果你谨慎行事，我不会伤害你。祝你好运。"
  npc_override_2@nyd_NydhoggsNest_if_you_don_t_accept_0a2deb: "如果你不接受我们的请求，那么未来就不要期待我们两个种族之间有合作。"
  npc_override_2@nyd_NydhoggsNest_if_you_dungeon_generated_ac0bd6: "如果副本已经生成，你可以直接进入。"
  npc_override_2@nyd_NydhoggsNest_if_you_like_enter_again_3ff930: "如果你想再次进入，请在我这里登记。"
  npc_override_2@nyd_NydhoggsNest_if_you_promise_share_all_fd3a3d: "如果你承诺分享你所有的研究成果和发现，我们就接受你的请求。"
  npc_override_2@nyd_NydhoggsNest_if_you_ready_i_allow_44ef6a: "如果你准备好了，我会允许你进入。"
  npc_override_2@nyd_NydhoggsNest_if_you_t_follow_rule_f0cc7c: "如果你不能遵守这个规则，我将停止与你联系并禁止你所有的人从这里进入。"
  npc_override_2@nyd_NydhoggsNest_incorrect_password_b68db3: "密码错误。"
  npc_override_2@nyd_NydhoggsNest_input_variable_number_6c77a2: "输入变量数值"
  npc_override_2@nyd_NydhoggsNest_ins_nyd_032365: "ins_nyd2位于{0}。"
  npc_override_2@nyd_NydhoggsNest_ins_nyd_8b4d1f: "ins_nyd位于{0}。"
  npc_override_2@nyd_NydhoggsNest_ins_nyd_set_ins_nyd_b455e6: "ins_nyd设置为200，ins_nyd2设置为0"
  npc_override_2@nyd_NydhoggsNest_invasion_harsh_word_i_am_884f7e: "“侵略”是个严厉的词。我是在允许他们进入。他们总比那些肮脏的巨人好。这可能正是救我们命的事……"
  npc_override_2@nyd_NydhoggsNest_just_our_powers_s_imposs_0a74af: "仅凭我们的力量，不可能弄清楚拉菲内族在做什么。我想过去已经证明了这一点。"
  npc_override_2@nyd_NydhoggsNest_just_when_expected_impos_4b1996: "就在进入另一个世界被认为是不可能的时候，一个新时代的篇章被翻开了。"
  npc_override_2@nyd_NydhoggsNest_klekod_oi_thekd_pheid_ok_aa5357: "克莱科德 奥伊 泰克德 菲德 奥凯。"
  npc_override_2@nyd_NydhoggsNest_laphine_tribe_charged_ma_c8d54d: "拉菲内族负责管理尤克特拉希尔，在阿斯加德附近建立家园，并保护尤克特拉希尔魔力的平衡。"
  npc_override_2@nyd_NydhoggsNest_laphine_tribe_never_cont_f4e1d1: "拉菲内族从未接触过阿斯加德以外的任何人。但当他们发现尤克特拉希尔的力量正在减弱……"
  npc_override_2@nyd_NydhoggsNest_laphine_tribes_gathered_6259e6: "拉菲内族也集结起来，组织远征探索时空裂隙，查明世界树异常症状的原因并寻找可能的治疗方法。"
  npc_override_2@nyd_NydhoggsNest_laphines_protected_yggdr_7f0900: "拉菲内族世世代代守护着世界树尤克特拉希尔。"
  npc_override_2@nyd_NydhoggsNest_last_thing_tested_send_a_caa3dd: "最后要测试的项目……是派遣自愿探索新世界的冒险者。"
  npc_override_2@nyd_NydhoggsNest_least_we_also_think_we_133fe0: "至少我们也认为必须利用拉菲内族囚犯获取情报。"
  npc_override_2@nyd_NydhoggsNest_let_s_report_commander_a_f42c72: "让我们向阿吉普指挥官汇报目前的情况。然后等待他的决定。"
  npc_override_2@nyd_NydhoggsNest_let_s_see_book_no_06db6f: "让我看看……这本书……不……这一本……？嗯……也许是这本……"
  npc_override_2@nyd_NydhoggsNest_liek_quekdk_ohei_vue_d7888c: "利克 奎克德克 奥黑 维尤。"
  npc_override_2@nyd_NydhoggsNest_long_ago_there_wasn_t_6e706d: "很久以前，没有太阳、月亮或星辰；只有空旷的大地……然后伊米尔诞生了。通过创造儿子们，伊米尔成长了。"
  npc_override_2@nyd_NydhoggsNest_long_ago_we_heard_you_7098fa: "不久前，我们听说你们在北边一个废弃的洞穴里发现了遗迹，并一直在进行调查和研究。"
  npc_override_2@nyd_NydhoggsNest_looking_current_situatio_95f46d: "从拉菲内族目前的情况来看，我们没有足够的力量包围马努克田野并驱逐巨人。"
  npc_override_2@nyd_NydhoggsNest_loyal_servants_guardian_8a6c3e: "守护者的忠实仆从们……我能为你们做什么？"
  npc_override_2@nyd_NydhoggsNest_lright_s_as_you_assumed_a1c280: "好吧……正如你所猜测的，那是一个连接世界树的地方。也是守护者的巢穴。"
  npc_override_2@nyd_NydhoggsNest_make_sure_if_you_find_999206: "如果你们在里面发现任何异常，一定要与我们分享！"
  npc_override_2@nyd_NydhoggsNest_man_currently_under_arre_9a8c79: "那个人目前正被关押。"
  npc_override_2@nyd_NydhoggsNest_may_i_ask_why_you_d01598: "但我能问一下你为什么要这样做吗？"
  npc_override_2@nyd_NydhoggsNest_maybe_our_command_office_75d456: "也许……我们的指挥官不愿意接受与我们不同的种族……"
  npc_override_2@nyd_NydhoggsNest_maybe_you_found_central_d2af73: "也许你找到了通往世界树尤克特拉希尔中心区域的入口！"
  npc_override_2@nyd_NydhoggsNest_means_you_ignoring_my_wa_39aa50: "这意味着……你在无视我的警告？这是你的决定还是你只是奉命行事？"
  npc_override_2@nyd_NydhoggsNest_menu_discovery_a3b072: "异质性的发现:原住部落的报告"
  npc_override_2@nyd_NydhoggsNest_menu_generate_f544f5: "制作净化之石:移除净化之石:关闭入口NPC:开启入口NPC:取消"
  npc_override_2@nyd_NydhoggsNest_menu_guardian_672673: "“守护者的咒语”！:后退一步。"
  npc_override_2@nyd_NydhoggsNest_menu_i_13486e: "我想进去。:我想离开。"
  npc_override_2@nyd_NydhoggsNest_menu_ins_12748b: "ins_nyd:ins_nyd2"
  npc_override_2@nyd_NydhoggsNest_menu_leave_726604: "交给我们吧。:我们做不到。"
  npc_override_2@nyd_NydhoggsNest_menu_leave_7e577b: "安静地离开。:不明白他在说什么，询问详情。"
  npc_override_2@nyd_NydhoggsNest_menu_look_307112: "装作忙碌的样子，后退一步。:就帮她这一次。"
  npc_override_2@nyd_NydhoggsNest_menu_move_95c699: "走近仔细看看。:后退。"
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_25e666: "尼德霍格的暗影：毁灭……一切……"
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_2e55dc: "尼德霍格的暗影：我会吞噬你们所有人……你和世界树尤克特拉希尔。"
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_3647d9: "尼德霍格的暗影：在虚无的幻象中永恒长眠吧。"
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_387536: "尼德霍格的暗影：你不错……但这次你的对手是我。"
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_524849: "尼德霍格的暗影：世界树尤克特拉希尔的守护者……他的力量正在消失……"
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_8c9014: "尼德霍格的暗影：我需要……我需要世界树尤克特拉希尔的力量……"
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_957c43: "尼德霍格的暗影：我受够了……我再也忍受不了了……"
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_c386f6: "尼德霍格的暗影：在这混乱之中，你的鲜血正是我需要的。"
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_c93039: "尼德霍格的暗影：我会让你享受慢慢死去的痛苦。"
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_d90da6: "尼德霍格的守护者：保护守护者圣所。清除入侵者。"
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_e5d512: "尼德霍格的暗影：我会冻结你身上最后一滴血。"
  npc_override_2@nyd_NydhoggsNest_menu_no_736a42: "没有。没什么。我们可以晚点再谈。:我打算留下来。有充分的理由。"
  npc_override_2@nyd_NydhoggsNest_menu_not_941d93: "还没有。:我读完了所有故事。"
  npc_override_2@nyd_NydhoggsNest_menu_please_139b81: "请让我出去。:我想四处看看。"
  npc_override_2@nyd_NydhoggsNest_menu_please_70408b: "请允许我进入。:我想进去。:我想离开。"
  npc_override_2@nyd_NydhoggsNest_menu_reset_172fe2: "重置变量以允许进入尼德霍格:更改变量'ins_nyd':移除3天计时器3135:确认变量数值"
  npc_override_2@nyd_NydhoggsNest_menu_what_9438b8: "你怎么了？:北边的洞穴里有什么？:告诉我关于你们部落的事。:我不打扰你了。"
  npc_override_2@nyd_NydhoggsNest_menu_what_c4e306: "北边的洞穴是怎么回事？:萨帕族是什么样的人？:嗯。我们晚点再聊。"
  npc_override_2@nyd_NydhoggsNest_menu_who_faa426: "你是谁？:你什么意思？"
  npc_override_2@nyd_NydhoggsNest_menu_world_072448: "世界树尤克特拉希尔：时间不多了。请抓紧时间。"
  npc_override_2@nyd_NydhoggsNest_menu_world_3fe5ad: "世界树尤克特拉希尔：我……已经快到极限了……请快点。"
  npc_override_2@nyd_NydhoggsNest_menu_world_46b7cd: "世界树尤克特拉希尔：我的力量正在慢慢消失。请抓紧时间。"
  npc_override_2@nyd_NydhoggsNest_menu_world_58f081: "世界树尤克特拉希尔：你们做得很好。让大家到中央的魔法阵集合，准备摧毁巢穴。"
  npc_override_2@nyd_NydhoggsNest_menu_world_cb3c28: "世界树尤克特拉希尔：你们失败了……但我会用我残余的力量……送你们离开这里。"
  npc_override_2@nyd_NydhoggsNest_message_let_s_see_i_99a5c6: "消息？……让我看看……真没想到他会留消息……"
  npc_override_2@nyd_NydhoggsNest_might_those_sapha_tribes_4651b6: "会不会是……那些萨帕族人之前挖过那个洞穴……他们确实有挖掘的天赋。"
  npc_override_2@nyd_NydhoggsNest_minutes_s_limit_my_power_a8e237: "30分钟……这是我力量的极限。请快点。"
  npc_override_2@nyd_NydhoggsNest_modeled_after_morocc_the_7a1d45: "以梦罗克为原型，他们的外表使得穿越时空裂隙变得困难。"
  npc_override_2@nyd_NydhoggsNest_most_surprising_thing_fl_a461ec: "最令人惊讶的是时间的流动。18名刺客在那里待了大约2周，却在出发后3小时内就返回了。"
  npc_override_2@nyd_NydhoggsNest_msg_6eae3a: "……"
  npc_override_2@nyd_NydhoggsNest_msg_8707ce: "…… ……"
  npc_override_2@nyd_NydhoggsNest_must_reported_reported_h_3dc57e: "这必须报告……报告给阿尔夫海姆的大祭司……难以置信。"
  npc_override_2@nyd_NydhoggsNest_my_soul_been_trapped_her_3335ad: "我的灵魂……被困在这里了。现在我能信任的只有你们了。"
  npc_override_2@nyd_NydhoggsNest_mysterious_power_prevent_25cd00: "一股神秘的力量阻止你靠近。门后似乎有什么强大的东西……"
  npc_override_2@nyd_NydhoggsNest_name_yggdrasiliad_i_acce_1e0715: "以尤克特拉希利亚德之名，我将接纳你为守护者的仆从。"
  npc_override_2@nyd_NydhoggsNest_near_bottom_gate_laphine_f4ccf3: "在大门底部附近，拉菲内族的女人们已化为石头，现在看起来像是大门的一部分。"
  npc_override_2@nyd_NydhoggsNest_neat_etorr_s_order_pleas_8906a9: "这是尼尔·埃托尔的命令。请跟我们走一趟去见他。"
  npc_override_2@nyd_NydhoggsNest_never_give_attention_um_5ef5b0: "从来不会去注意……嗯……一个直率的女人……"
  npc_override_2@nyd_NydhoggsNest_new_world_could_support_782c6d: "新世界可以支撑三个完全不同的生态系统，取决于居住在那里的种族。"
  npc_override_2@nyd_NydhoggsNest_nidhoggur_s_shadow_295ecc: "尼德霍格的暗影？"
  npc_override_2@nyd_NydhoggsNest_nidhoggur_s_shadow_came_868869: "尼德霍格的暗影出现在这个世界，损害了世界树的树根……真是灾难。"
  npc_override_2@nyd_NydhoggsNest_no_i_t_tell_you_73f130: "不……我不能告诉你……这是部落的秘密……"
  npc_override_2@nyd_NydhoggsNest_no_let_s_hear_explanatio_b55b97: "不。先听听解释。好吗？如果你愿意的话……"
  npc_override_2@nyd_NydhoggsNest_no_longer_nest_guardian_21b47a: "这里……这里不再是世界树尤克特拉希尔守护者的巢穴了。"
  npc_override_2@nyd_NydhoggsNest_no_no_wait_ok_i_ac1a58: "不……不，等等。好吧，我接受。我可以接受你进入神圣赛科斯。"
  npc_override_2@nyd_NydhoggsNest_no_wait_sapha_tribesmen_046d11: "不，等等……萨帕族知道那个地方的意义？你问过要与他们合作的事吗？"
  npc_override_2@nyd_NydhoggsNest_now_allow_me_escort_you_6cbe69: "现在……请让我护送你离开这个被诅咒的巢穴。"
  npc_override_2@nyd_NydhoggsNest_now_i_am_almost_done_19e1cd: "现在，我差不多快完成了……你是谁？你是马格尼法博士的新助手吗？"
  npc_override_2@nyd_NydhoggsNest_now_if_you_understand_in_5cf479: "现在，如果你明白了这一点，告诉你的朋友们。"
  npc_override_2@nyd_NydhoggsNest_now_s_too_late_hurry_1c3599: "现在还不算太晚，快点出去……把这事告诉拉菲内族……告诉阿尔夫海姆的指挥官们……"
  npc_override_2@nyd_NydhoggsNest_now_vile_nidhoggur_s_sha_fbe906: "现在邪恶的尼德霍格暗影正在这里肆虐……"
  npc_override_2@nyd_NydhoggsNest_now_we_acknowledged_your_5f5504: "目前，我们已经承认了你们种族的存在，并对你们的活动保持宽容。"
  npc_override_2@nyd_NydhoggsNest_now_we_don_t_need_b0389b: "现在，我们不必多谈这件事了，就从哪里来回哪里去吧。"
  npc_override_2@nyd_NydhoggsNest_now_we_need_talk_about_74ddbd: "从现在开始，我们需要和拉菲内族讨论这件事。"
  npc_override_2@nyd_NydhoggsNest_now_you_try_contact_saph_76852a: "现在，你尝试联系萨帕和拉菲内族，并设法获取更多信息。"
  npc_override_2@nyd_NydhoggsNest_now_you_try_contact_saph_efb251: "现在，你尝试联系萨帕和拉菲内族，并从他们那里获取信息。"
  npc_override_2@nyd_NydhoggsNest_now_you_understand_how_s_a33939: "现在你明白情况有多严重了。因为萨帕族，我们再也无法接近守护者，无法寻求他的智慧教导了。"
  npc_override_2@nyd_NydhoggsNest_nowadays_world_turned_un_3e03be: "如今，世界已经变得不稳定。我甚至连舒适地飞行都做不到了。"
  npc_override_2@nyd_NydhoggsNest_obtain_more_minerals_the_75bf46: "为了获取更多矿物，他们开始疯狂地挖掘。"
  npc_override_2@nyd_NydhoggsNest_oh_because_them_we_been_86f441: "哦！正是因为他们，我们才在这个低贱肮脏的城市里生活了一百多年。"
  npc_override_2@nyd_NydhoggsNest_oh_here_world_tree_yggdr_7f930c: "哦，找到了！世界树尤克特拉希尔和诸神的部落……这是他们的书！"
  npc_override_2@nyd_NydhoggsNest_oh_sorry_i_took_so_f2949f: "哦，抱歉让你久等了。邮件太多了，我花了一段时间才找到。"
  npc_override_2@nyd_NydhoggsNest_okay_if_already_become_l_8a8ede: "好吧，既然已经变成这样了，我会帮助你们。没有绝路。只要坚持下去，总会找到解决方案的。"
  npc_override_2@nyd_NydhoggsNest_okay_if_you_servant_yggd_8ea32f: "好吧。如果你如你所说的是尤克特拉希尔的仆从，我会允许你进入。但我不为你的行为负责。"
  npc_override_2@nyd_NydhoggsNest_okay_let_s_try_contact_2ff605: "好吧，我们先试着联系他们，确认洞穴或宝藏的事。"
  npc_override_2@nyd_NydhoggsNest_once_ugly_shadow_leaves_dc0c0d: "一旦那丑陋的暗影离开这里去窃取其他世界树的力量，将会带来巨大的毁灭。这个世界将变成地狱。"
  npc_override_2@nyd_NydhoggsNest_one_going_mad_guardian_h_d01024: "但发疯的不是守护者本身，而是他的黑暗暗影……也许我们可以把他困在这里……"
  npc_override_2@nyd_NydhoggsNest_one_killed_our_last_war_6b56a2: "一人在上次与萨帕族的战争中战死……另一人被俘。"
  npc_override_2@nyd_NydhoggsNest_one_killed_our_last_war_d87e66: "一人在上次与萨帕族的战争中战死……而我被俘了。"
  npc_override_2@nyd_NydhoggsNest_only_beginning_we_quite_f20370: "这只是开始……从现在起我们会很忙。"
  npc_override_2@nyd_NydhoggsNest_only_hvergelmir_sapha_tr_c01424: "只有萨帕族的赫瓦格密尔从这场血光之灾中逃脱。他在迷雾笼罩的雪地约顿海姆发誓复仇。"
  npc_override_2@nyd_NydhoggsNest_only_marked_guardian_s_s_3f93e2: "只有被标记的守护者仆从（来自拉菲内族）才被允许进入。"
  npc_override_2@nyd_NydhoggsNest_only_representative_you_aee77d: "而且只需要你们中的一名代表来跟我对话，所以别打扰我……"
  npc_override_2@nyd_NydhoggsNest_opening_gate_failed_bdcc3b: "大门开启失败。"
  npc_override_2@nyd_NydhoggsNest_other_than_sapha_tribe_t_06e0e7: "除了萨帕族之外，时空裂隙的另一边还有另一个部落，称为拉菲内族。"
  npc_override_2@nyd_NydhoggsNest_our_academics_religion_t_4c2be7: "我们的学者不是宗教人士。他们对这个世界的历史也充满好奇。"
  npc_override_2@nyd_NydhoggsNest_our_current_powers_impos_0a0b26: "以我们目前的力量……不可能击败守护者。"
  npc_override_2@nyd_NydhoggsNest_our_hatred_towards_them_898a26: "我们对他们的仇恨已经达到了异常的程度……"
  npc_override_2@nyd_NydhoggsNest_our_tribe_respected_you_2cda90: "我们部落一直尊重你们，所以请忘记在这里搜寻和探索的事。"
  npc_override_2@nyd_NydhoggsNest_outsider_arioss_here_exp_8d9ab1: "外人。这里的阿里奥斯会解释关于巨人的情况，跟他说吧……"
  npc_override_2@nyd_NydhoggsNest_outsider_welcome_manuk_v_4c7b4a: "外人。欢迎来到马努克，萨帕族的村庄。我是这里的代表，尼尔·埃托尔。"
  npc_override_2@nyd_NydhoggsNest_outsider_welcome_manuk_v_8287e8: "外人。欢迎来到萨帕族的马努克村庄。我是这里的代表，尼尔·埃托尔。"
  npc_override_2@nyd_NydhoggsNest_pass_along_world_tree_yg_8bb45a: "传递世界树尤克特拉希尔的话。"
  npc_override_2@nyd_NydhoggsNest_pass_along_world_tree_yg_aeffbf: "传递世界树尤克特拉希尔的消息。"
  npc_override_2@nyd_NydhoggsNest_path_guardian_s_nest_jus_6d808a: "通往守护者巢穴的路径就在北边巨大世界树尤克特拉希尔旁边的瀑布后面。"
  npc_override_2@nyd_NydhoggsNest_path_guardian_s_nest_jus_e7ba1b: "通往守护者巢穴的路径就在北边巨大世界树尤克特拉希尔旁边的瀑布后面。防御机制将立即启动。"
  npc_override_2@nyd_NydhoggsNest_path_guardian_s_nest_jus_f1fd7d: "通往守护者巢穴的路径就在北边巨大世界树尤克特拉希尔旁边的瀑布后面。圣所的防御机制将立即启动。"
  npc_override_2@nyd_NydhoggsNest_perhaps_there_s_great_hi_eb798f: "也许大门后面隐藏着超乎想象的巨大秘密。"
  npc_override_2@nyd_NydhoggsNest_place_banned_order_laphi_9ce951: "那个地方被拉菲内族下令禁止进入。没有许可不能随意前往。"
  npc_override_2@nyd_NydhoggsNest_place_initially_closed_o_482a61: "那个地方最初是对公众封闭的，但后来萨帕族的巨人改变了一切……"
  npc_override_2@nyd_NydhoggsNest_please_allow_me_investig_a0953a: "请允许我调查那个洞穴。"
  npc_override_2@nyd_NydhoggsNest_please_bring_news_all_sp_252a89: "拜托。把这条消息带到斯普兰迪德的所有地方。派人来救我……否则他们可能会杀了我。"
  npc_override_2@nyd_NydhoggsNest_please_enter_password_99d476: "请输入密码"
  npc_override_2@nyd_NydhoggsNest_please_go_report_those_c_ad9e72: "请去向斯普兰迪德和马努克的负责人报告此事。"
  npc_override_2@nyd_NydhoggsNest_please_meet_guardian_com_760f1d: "请去见守护者，带着所有问题的答案回来。我相信你。"
  npc_override_2@nyd_NydhoggsNest_please_meet_guardian_com_edcde1: "请去见守护者，带着所有问题的答案回来。然后把答案告诉……"
  npc_override_2@nyd_NydhoggsNest_please_meet_guardian_tak_162c96: "请去见守护者，从他那里得到智慧的答案。我会相信你。"
  npc_override_2@nyd_NydhoggsNest_please_talk_my_people_sp_a7a384: "拜托，去跟我在斯普兰迪德的人们谈谈。他们会来救我的。"
  npc_override_2@nyd_NydhoggsNest_problem_been_root_our_co_90ebd3: "这个问题一直是我们与拉菲内族冲突的根源。当然，这也可能是解决矛盾的机会。"
  npc_override_2@nyd_NydhoggsNest_promised_words_guardian_3aa826: "承诺的言语……守护者的咒语……他们存在的证明。"
  npc_override_2@nyd_NydhoggsNest_proof_spell_confirm_you_14094b: "这个证明和咒语将确认你是守护者的仆从之一。"
  npc_override_2@nyd_NydhoggsNest_protect_yggdrasil_s_laph_5d8b0b: "守护尤克特拉希尔！那是拉菲内族的命运。你能说这也关乎你自己吗？"
  npc_override_2@nyd_NydhoggsNest_purification_stone_been_21caf0: "净化之石已生成，将持续30分钟。"
  npc_override_2@nyd_NydhoggsNest_purification_stone_been_5040c0: "净化之石已被销毁。"
  npc_override_2@nyd_NydhoggsNest_purification_stone_destr_33ef8e: "净化之石将在1分钟后销毁。"
  npc_override_2@nyd_NydhoggsNest_quest_erased_844a8b: "任务3135已清除。"
  npc_override_2@nyd_NydhoggsNest_reason_behind_all_becaus_9ed54b: "这一切背后的原因……不是因为萨帕族，而是因为守护者的突然离开？而且守护者已经放弃了他的身份？"
  npc_override_2@nyd_NydhoggsNest_reason_we_don_t_allow_3e16ae: "我们不允许任何人进入那个地点的原因，是因为那里充满了可疑之处。"
  npc_override_2@nyd_NydhoggsNest_received_invitation_saph_67f755: "收到了萨帕族的合作调查邀请。"
  npc_override_2@nyd_NydhoggsNest_recently_because_you_und_5c47c3: "最近，因为你们不了解当前局势，你们做了一些作为领导者我不能再忽视的事情。"
  npc_override_2@nyd_NydhoggsNest_records_after_effect_rel_f63281: "^0000FF与尼德霍格巢穴相关的记录和后遗效应已被清除。你可以再次生成并进入副本。^000000"
  npc_override_2@nyd_NydhoggsNest_remualaash_mu_modtasan_y_513c70: "雷穆阿拉阿什 穆 莫德塔桑 尤 杜尔"
  npc_override_2@nyd_NydhoggsNest_report_commander_hibba_a_41062b: "向我们发现的情况向希巴·阿吉普指挥官报告，因为时间取决于他的决定。"
  npc_override_2@nyd_NydhoggsNest_reports_these_adventurer_204a90: "这些冒险者的报告已被发送给所有王国的代表，并组织了一支远征队以获取更多信息。"
  npc_override_2@nyd_NydhoggsNest_right_now_we_standing_pa_d0249e: "现在，我们正站在世界树尤克特拉希尔树根的一部分上。"
  npc_override_2@nyd_NydhoggsNest_rune_midgarts_approved_r_b82be7: "但卢恩-米德加尔特批准了这项研究？"
  npc_override_2@nyd_NydhoggsNest_s_about_dr_magnifier_s_66065f: "是关于马格尼法博士的报告……"
  npc_override_2@nyd_NydhoggsNest_s_all_over_servants_guar_2f8b43: "一切都结束了……守护者的仆从们……快点离开这个地方。"
  npc_override_2@nyd_NydhoggsNest_s_because_only_ones_chos_5f23e6: "那是因为只有被守护者选中的人才能进入。"
  npc_override_2@nyd_NydhoggsNest_s_like_commander_they_sp_28083b: "不是那样的，指挥官，他们说的事实。"
  npc_override_2@nyd_NydhoggsNest_s_lot_please_as_token_1adc4e: "虽然不多，但请收下作为我们感激之情的表示。"
  npc_override_2@nyd_NydhoggsNest_s_our_intention_a3b63b: "这是我们的意愿。"
  npc_override_2@nyd_NydhoggsNest_s_s_better_if_you_8e89ac: "最……最好是不要相信那个叫埃托尔的……萨帕族的想法难以捉摸。"
  npc_override_2@nyd_NydhoggsNest_s_surprising_you_able_ob_a5a79f: "令人惊讶的是你能得出这样的结果。我们也有类似的理论。"
  npc_override_2@nyd_NydhoggsNest_s_too_messy_due_lots_b54bf5: "因为堆满了书籍和文件，太乱了。马格尼法博士看起来有很多报告。"
  npc_override_2@nyd_NydhoggsNest_s_unbelievable_you_must_44f2b5: "那真是难以置信。你一定是在侮辱守护者和我们的尊严。我提供帮助不是为了这个。"
  npc_override_2@nyd_NydhoggsNest_s_very_insulting_our_pri_9a275e: "这对我们的尊严是极大的侮辱……但如果你能帮助我们再次进入那个地方并与守护者对话，也许我们能找到解决方案……"
  npc_override_2@nyd_NydhoggsNest_s_why_he_sent_you_7d47e0: "这就是他派你来的原因。顺便说一句，这不是我第一次听说这事了。"
  npc_override_2@nyd_NydhoggsNest_s_why_war_started_i_721f3b: "这就是战争开始的原因。但我不想再与萨帕族战斗了……"
  npc_override_2@nyd_NydhoggsNest_sapha_tribe_attacked_fir_bad256: "萨帕族先发动了攻击。他们在摧毁世界树。"
  npc_override_2@nyd_NydhoggsNest_sapha_tribe_went_as_far_b938b2: "萨帕族竟然走到了与未知种族合作的地步？"
  npc_override_2@nyd_NydhoggsNest_satan_morocc_known_he_di_00d50b: "魔王梦罗克知道他并非正常复活或靠自己复活的。"
  npc_override_2@nyd_NydhoggsNest_satan_morocc_stopped_des_e3b2d2: "魔王梦罗克停止了对梦罗克城的破坏，将其变成一片荒芜的沙漠，然后开始撕裂这个世界。"
  npc_override_2@nyd_NydhoggsNest_satan_morocc_worried_abo_385646: "魔王梦罗克担心那些会追来的人，所以制造了梦罗克克隆体在他身后放哨。"
  npc_override_2@nyd_NydhoggsNest_schwarzwald_republic_req_72a889: "施瓦茨瓦尔德共和国请求批准寻找新能源金属的来源，由于卢恩-米德加尔特无法独自完成测试，他们最终同意了。"
  npc_override_2@nyd_NydhoggsNest_scientists_schwarzwald_c_d87d0f: "施瓦茨瓦尔德的科学家们利用在次元峡谷发现的金属碎片，创造了一种合成金属。"
  npc_override_2@nyd_NydhoggsNest_seems_like_you_did_under_34b913: "看来你没有理解我说的话。你在想什么？"
  npc_override_2@nyd_NydhoggsNest_selarsmar_di_marthusvil_0b5dba: "塞拉斯玛尔 迪 玛瑟斯维尔 乌 塞穆什沃尔"
  npc_override_2@nyd_NydhoggsNest_shadow_sucked_all_nutrie_f5fe4b: "暗影吸干了世界树尤克特拉希尔的所有养分，在无物可获之后陷入了疯狂。现在，它想要这片土地。"
  npc_override_2@nyd_NydhoggsNest_sheesh_i_prepared_these_cc445e: "真是的～我精心为你准备了这些故事，你却什么都没看是吗？"
  npc_override_2@nyd_NydhoggsNest_shouldn_t_i_filed_books_ca11ac: "我不是该把书归档吗？"
  npc_override_2@nyd_NydhoggsNest_sigh_since_s_commander_l_4940de: "唉，既然是莱比奥迪尔指挥官的意思，我会跟你合作……"
  npc_override_2@nyd_NydhoggsNest_sir_i_drag_pest_out_fcd83b: "长官，我可以马上把这个讨厌鬼拖出去。"
  npc_override_2@nyd_NydhoggsNest_sir_i_get_rid_rude_96b4d6: "长官，如果您愿意，我可以把这个无礼的外人赶走吗？"
  npc_override_2@nyd_NydhoggsNest_sir_you_sure_invasion_ho_764e4d: "长官……您确定吗？这是对神圣赛科斯的入侵……"
  npc_override_2@nyd_NydhoggsNest_so_did_he_already_know_179bf2: "那么，他是不是早就知道魔王梦罗克的重生已经发生过了？"
  npc_override_2@nyd_NydhoggsNest_so_did_you_read_whole_ae8b68: "那么，你读完了我准备的全部故事了吗？"
  npc_override_2@nyd_NydhoggsNest_so_far_nothing_s_come_bb3560: "到目前为止，什么也没发生……是有人攻击了你吗？"
  npc_override_2@nyd_NydhoggsNest_so_i_ll_around_if_0cbac1: "是这样啊……如果你想离开的话我会在附近。"
  npc_override_2@nyd_NydhoggsNest_so_s_how_we_right_ceef10: "原来如此……我们在某些部分是对的……它被称为守护者的巢穴。"
  npc_override_2@nyd_NydhoggsNest_so_s_nest_guardian_world_20391b: "所以……那就是世界树守护者的巢穴，拉菲内族的圣地。"
  npc_override_2@nyd_NydhoggsNest_so_since_i_agreed_allow_e2ddf2: "所以……既然我已经同意允许你们探索……阿里奥斯，帮助他们，并记录结果。"
  npc_override_2@nyd_NydhoggsNest_so_we_dispatched_expedit_df82bb: "所以我们派遣了一支远征队来到这里。不久之后，与萨帕族的战争开始了……"
  npc_override_2@nyd_NydhoggsNest_so_what_i_care_about_f61a15: "所以……我为什么要关心一个外人的报告？"
  npc_override_2@nyd_NydhoggsNest_so_you_re_priestess_laph_8c1fe5: "所以你不是拉菲内族的祭司……你是怎么进来的？不，没时间回答那个了。"
  npc_override_2@nyd_NydhoggsNest_somehow_truth_come_out_w_79c866: "总有一天真相会浮出水面，但我们应该小心，如果我们贸然前往，而当地人没有准备好迎接我们，可能会惊吓到他们。"
  npc_override_2@nyd_NydhoggsNest_sometimes_dispatched_res_c7ebc1: "有时候被派遣的研究人员会在这里徘徊……因为没有东西可看，我觉得很抱歉……毫无理由……"
  npc_override_2@nyd_NydhoggsNest_speak_his_highness_world_84cf18: "不要轻率地提及世界树尤克特拉希尔殿下的名字。"
  npc_override_2@nyd_NydhoggsNest_splendide_office_don_t_a_742d3f: "这里是斯普兰迪德办事处。不要无礼。"
  npc_override_2@nyd_NydhoggsNest_spot_connected_world_tre_4a68a9: "这个地方通过树根与世界树相连。我想萨帕和拉菲内族最终会在这里发生冲突，你觉得呢？"
  npc_override_2@nyd_NydhoggsNest_still_adventurers_gave_c_876a2f: "冒险者们仍然继续追逐。他们来自世界各地，试图接近次元峡谷。"
  npc_override_2@nyd_NydhoggsNest_strange_one_thank_you_he_e8f33e: "陌生人，感谢你在危难时刻帮助我们。我永远不会忘记你的好意。"
  npc_override_2@nyd_NydhoggsNest_strange_one_thank_you_yo_2c62bc: "陌生人，感谢你在这种情况下合作……请忘记今天发生的事吧……"
  npc_override_2@nyd_NydhoggsNest_strange_one_we_hope_our_b9ba03: "陌生人，希望我们的合作会顺利。现在请去审问拉菲内族囚犯吧。"
  npc_override_2@nyd_NydhoggsNest_strange_power_slowly_sur_b82577: "一股奇怪的力量慢慢包围了你的身体，空间开始扭曲。"
  npc_override_2@nyd_NydhoggsNest_strange_sensation_surrou_106d98: "围绕着你身体的奇异感觉已经消失了。"
  npc_override_2@nyd_NydhoggsNest_sure_mainland_also_lots_184061: "当然，大陆上也有很多有趣的冒险……你好，我是马格尼法，从普隆德拉王宫派遣来的历史学家。"
  npc_override_2@nyd_NydhoggsNest_t_compare_effort_you_put_cc3ecf: "这与你们为我们付出的努力无法相比……但请接受我们的友谊之礼。"
  npc_override_2@nyd_NydhoggsNest_talsehrdur_so_cyaremush_6b72cc: "塔尔塞赫杜尔 索 赛亚雷穆什 迪 迪尔阿拉沃斯 伊 鲁夫塞里曼 伊"
  npc_override_2@nyd_NydhoggsNest_thank_you_helping_us_suc_04cc96: "感谢你帮助我们解决了这么大的问题。你可以忘记这件事了。"
  npc_override_2@nyd_NydhoggsNest_thank_you_you_re_saviour_ec64de: "谢谢你。你是人类和拉菲内族的救星。"
  npc_override_2@nyd_NydhoggsNest_then_i_ll_ask_sapha_03e1cc: "那我去向萨帕族求助。"
  npc_override_2@nyd_NydhoggsNest_then_we_ll_leave_you_b031a3: "那就交给你了。至于你的请求，我会尽力合作。"
  npc_override_2@nyd_NydhoggsNest_there_45f1b0: "有……"
  npc_override_2@nyd_NydhoggsNest_there_flood_adventurer_a_d2aac9: "冒险者的申请如潮水般涌来。大量志愿者消失在次元峡谷，带回了新的数据。"
  npc_override_2@nyd_NydhoggsNest_there_no_way_resolve_com_c64756: "难道没有办法通过沟通来解决吗？无谓的战斗毫无意义！真是的。"
  npc_override_2@nyd_NydhoggsNest_there_nothing_else_we_022b67: "我们就无能为力了吗？"
  npc_override_2@nyd_NydhoggsNest_therefore_s_more_reason_47b8b3: "因此，更应该依靠我们自己的力量。没有你插手干预的余地。请放弃吧。"
  npc_override_2@nyd_NydhoggsNest_they_associated_together_7102b5: "他们联合起来招募志愿者。刺客公会第一个报名。"
  npc_override_2@nyd_NydhoggsNest_they_declared_they_atten_2b67db: "他们宣布将在一千年以来首次出席高等法庭，自诸神与魔法师之战结束后。"
  npc_override_2@nyd_NydhoggsNest_they_don_t_care_if_03eb3e: "他们不在乎尤克特拉希尔是否有麻烦。"
  npc_override_2@nyd_NydhoggsNest_they_had_discovered_anot_81ab3e: "他们发现了另一个具有截然不同性质和环境的异世界。而且，人们确实可以在那里生活。"
  npc_override_2@nyd_NydhoggsNest_they_mining_metal_so_doi_e2f6c4: "他们在开采金属，这样做正在破坏世界树的树根……"
  npc_override_2@nyd_NydhoggsNest_they_surely_full_bad_ide_4b779f: "他们肯定充满了坏主意，所以……他们破坏了尤克特拉希尔的树根。"
  npc_override_2@nyd_NydhoggsNest_they_whisper_each_other_abbeee: "他们交头接耳，所以……那里有什么东西……但我不在乎……"
  npc_override_2@nyd_NydhoggsNest_things_actually_become_l_c1e826: "事情确实已经变成了这样……作为守护者的祭司，这是我们的责任……"
  npc_override_2@nyd_NydhoggsNest_those_giants_they_really_2e5cd9: "那些巨人……真的可以信任吗？"
  npc_override_2@nyd_NydhoggsNest_those_obnoxious_dwarves_bf1c70: "那些讨厌的矮人冒犯了我们的生存权，并试图赶走我们。"
  npc_override_2@nyd_NydhoggsNest_those_reports_haven_t_co_2f162a: "但那些报告还没有出来。对吧？"
  npc_override_2@nyd_NydhoggsNest_those_who_want_taint_sac_ce2cba: "那些想要玷污守护者神圣圣所的人……滚出去。"
  npc_override_2@nyd_NydhoggsNest_thusdurnah_ra_sharveldiy_96066d: "瑟斯杜尔纳 拉 沙尔维尔迪亚兹 乌 乌尔阿曼杜尔 耶 内奥萨阿多尔 耶"
  npc_override_2@nyd_NydhoggsNest_thusdurnah_ra_sharveldiy_b8cf35: "瑟斯杜尔纳 拉 沙尔维尔迪亚兹 乌 乌尔阿曼杜尔 耶 内奥萨阿多尔 耶……"
  npc_override_2@nyd_NydhoggsNest_time_limit_enter_dungeon_970f47: "进入副本的时限已过。你必须等待世界树稳定其力量后才能再次尝试进入。"
  npc_override_2@nyd_NydhoggsNest_time_ymir_s_fall_his_de23f8: "在伊米尔陨落之时，他的鲜血淹没了整个世界……杀死了沿途的一切。"
  npc_override_2@nyd_NydhoggsNest_tkeh_likek_ohek_qekhlhkl_e14af3: "特克 利克克 奥赫克 克赫勒赫克尔 普克迪利奥赫。"
  npc_override_2@nyd_NydhoggsNest_two_tribes_some_trouble_7ac85f: "两个部族的高层之间有一些矛盾。不是官方的什么，但是……"
  npc_override_2@nyd_NydhoggsNest_unknown_error_occurred_58bda4: "发生了未知错误。"
  npc_override_2@nyd_NydhoggsNest_unless_you_any_messages_6082b1: "除非你有什么消息要告诉我……？你的表情告诉我是有的……"
  npc_override_2@nyd_NydhoggsNest_use_your_powers_destroy_d9b124: "运用你的力量……摧毁那邪恶的暗影……"
  npc_override_2@nyd_NydhoggsNest_vohllarsmar_ha_dielcyata_fc095e: "沃尔拉斯玛尔 哈 迪尔赛亚塔斯"
  npc_override_2@nyd_NydhoggsNest_voice_disappeared_dark_p_32d09b: "那个声音消失了，黑暗力量在石门后方渐渐平息下来。"
  npc_override_2@nyd_NydhoggsNest_wait_second_i_brilliant_1fbc42: "等一下……我有个绝妙的主意。"
  npc_override_2@nyd_NydhoggsNest_we_been_guardian_s_serva_e44840: "我们世世代代都是守护者的仆从，一直守护着世界树。"
  npc_override_2@nyd_NydhoggsNest_we_captured_laphine_trib_aed38f: "我们在上次战争中俘虏了一名拉菲内族祭司，我听说你与那名俘虏有过接触。"
  npc_override_2@nyd_NydhoggsNest_we_didn_t_try_solve_c27cea: "我们没有尝试通过谈判解决问题。我们先攻击了他们。"
  npc_override_2@nyd_NydhoggsNest_we_don_t_know_if_1a0453: "我们不知道那里的怪物是否强大，所以我们从未去查看过。但在个人层面上，没人想去那里……"
  npc_override_2@nyd_NydhoggsNest_we_expecting_lot_you_exp_120d10: "我们对你有很高的期望，经验丰富的冒险者。如果你发现了什么……就告诉我。"
  npc_override_2@nyd_NydhoggsNest_we_gained_large_amount_k_b7cc23: "我们今天获得了大量的知识，但是……"
  npc_override_2@nyd_NydhoggsNest_we_here_make_sure_sapha_417ab1: "我们在这里是为了确保萨帕族不会把事情变得更糟。"
  npc_override_2@nyd_NydhoggsNest_we_just_small_village_no_77eee7: "我们只是一个小村庄，没有什么特别的……但请随意休息。"
  npc_override_2@nyd_NydhoggsNest_we_live_different_time_d_d02df1: "我们生活在……不同的时代，不同的土地……我们是来进行远征的。"
  npc_override_2@nyd_NydhoggsNest_we_need_lot_more_informa_c60334: "但我们还需要更多信息……他们拒绝你进入吗？"
  npc_override_2@nyd_NydhoggsNest_we_really_just_letting_t_a20768: "我们真的就这样放这些人走吗，他们可是在我们土地上惹了麻烦的？"
  npc_override_2@nyd_NydhoggsNest_we_recently_started_susp_dea58a: "但我们最近开始怀疑你是拉菲内族的耳目。"
  npc_override_2@nyd_NydhoggsNest_we_still_unstable_relati_fbd34f: "我们与萨帕族的关系仍然不稳定，我们通常不担心外人的事。"
  npc_override_2@nyd_NydhoggsNest_we_understand_each_other_78fc88: "我们不理解对方吗？你想要什么？"
  npc_override_2@nyd_NydhoggsNest_welcome_laphine_camp_spl_b9de41: "欢迎来到斯普兰迪德的拉菲内族营地，外人……我是莱比奥迪尔。我是这里的负责人。"
  npc_override_2@nyd_NydhoggsNest_well_i_m_sure_we_ed1eee: "嗯……我不确定，但我们一直避免去那个区域。"
  npc_override_2@nyd_NydhoggsNest_what_doctor_s_area_exper_c3ae5d: "博士的研究领域是什么？"
  npc_override_2@nyd_NydhoggsNest_what_guardian_his_nest_1772a8: "什么？守护者不在巢穴里……？"
  npc_override_2@nyd_NydhoggsNest_what_huge_discovery_so_n_40bef0: "多么重大的发现……那么尼德霍格不再是世界树的守护者了……？"
  npc_override_2@nyd_NydhoggsNest_what_i_tell_you_disrespe_866047: "从我的角度来看，你在无视我的请求。这是你的意图，还是你的人的意思？"
  npc_override_2@nyd_NydhoggsNest_what_if_you_wander_aroun_ee8cf8: "什么？如果你在那里闲逛……可能会受伤回来。"
  npc_override_2@nyd_NydhoggsNest_what_priest_guardian_sai_67af1a: "守护者的祭司是这么说的吗？"
  npc_override_2@nyd_NydhoggsNest_what_s_happening_let_s_97d1e7: "发生什么事了？我们去看看。"
  npc_override_2@nyd_NydhoggsNest_what_s_woman_laphine_tri_b638cc: "拉菲内族的女人在这里做什么……"
  npc_override_2@nyd_NydhoggsNest_what_they_re_doing_right_b5afc5: "他们现在所做的可能会引导我们找到解决方案。"
  npc_override_2@nyd_NydhoggsNest_what_we_figured_out_how_b5efab: "我们所发现的……会对人类产生怎样的影响？这是无法预料的……"
  npc_override_2@nyd_NydhoggsNest_what_you_expect_when_man_ceec9e: "当马努克的巨人开始挖掘世界破坏尤克特拉希尔时，你还能期待什么……"
  npc_override_2@nyd_NydhoggsNest_what_you_need_59dbe5: "你需要做什么？"
  npc_override_2@nyd_NydhoggsNest_what_you_saying_arioss_f_dbf3a6: "你在说什么？阿里奥斯，别忘了你是守护者祭司的身份。"
  npc_override_2@nyd_NydhoggsNest_what_you_talking_about_o_1178f5: "你在说什么，外人？"
  npc_override_2@nyd_NydhoggsNest_what_your_purpose_why_yo_eb47cf: "你的目的是什么？你为什么想知道那个地方是什么？"
  npc_override_2@nyd_NydhoggsNest_when_faint_light_enters_12a552: "当一道微光进入你的内心时，一个声音在你的脑海中响起。"
  npc_override_2@nyd_NydhoggsNest_when_we_finished_combat_498947: "什么时候才能结束与萨帕族的战斗？呃啊啊……"
  npc_override_2@nyd_NydhoggsNest_when_you_touch_stone_gat_9af664: "当你触摸石门时，你听到一个威严的声音。"
  npc_override_2@nyd_NydhoggsNest_where_other_servants_so_d6347d: "其他仆从在哪里，好让你们一起行动？每个仆从不能单独进入这里……"
  npc_override_2@nyd_NydhoggsNest_which_variable_you_want_c321d8: "你想更改哪个变量？"
  npc_override_2@nyd_NydhoggsNest_while_ago_while_you_tran_f07596: "但不久前，当你在将阿吉普指挥官的报告传送回大陆时，你把那些报告弄丢了……记得吗？"
  npc_override_2@nyd_NydhoggsNest_why_you_come_back_outsid_4d5fcd: "你为什么回来了，外人？"
  npc_override_2@nyd_NydhoggsNest_why_you_standing_there_g_5eb2e2: "你站在那里干什么？去普隆德拉图书馆找我的助手！"
  npc_override_2@nyd_NydhoggsNest_why_you_want_explore_bet_72b652: "你为什么想要探索？最好有个很好的理由。"
  npc_override_2@nyd_NydhoggsNest_wingless_one_our_promise_2a5c4f: "无翼之人……我们承诺的言语……"
  npc_override_2@nyd_NydhoggsNest_world_tree_yggdrasil_sta_a70421: "世界树尤克特拉希尔已经稳定下来。你想再次进入尼德霍格巢穴吗？"
  npc_override_2@nyd_NydhoggsNest_worst_thing_strange_thin_f9b075: "最糟糕的是……奇怪的东西正在城镇的街道上横行……"
  npc_override_2@nyd_NydhoggsNest_yes_i_heard_your_convers_bd59cf: "是的……我听到了你与萨帕族的对话……"
  npc_override_2@nyd_NydhoggsNest_yes_s_nest_nidhoggur_gua_3735df: "是的，那就是尼德霍格的巢穴，世界树的守护者……"
  npc_override_2@nyd_NydhoggsNest_yes_you_what_you_think_12a270: "是的，你……你觉得政府处理这事的方式怎么样……？"
  npc_override_2@nyd_NydhoggsNest_yggdrasil_gatekeeper_nyd_69b737: "nyd_dun02 100 201处的尤克特拉希尔守门人现已开启。"
  npc_override_2@nyd_NydhoggsNest_yggdrasil_gatekeeper_nyd_f3ff3a: "nyd_dun02 100 201处的尤克特拉希尔守门人现已关闭。"
  npc_override_2@nyd_NydhoggsNest_you_any_proof_your_birth_152b6c: "你有任何证明你受奥丁和尤克特拉希尔祝福的出生证明吗？"
  npc_override_2@nyd_NydhoggsNest_you_d_better_behave_aide_ee51cd: "你最好规矩点，助手阿里奥斯说不同种族应受到同等对待。"
  npc_override_2@nyd_NydhoggsNest_you_didn_t_ask_admitted_3af3e2: "你没有申请进入……进入之前必须先接受准入许可。"
  npc_override_2@nyd_NydhoggsNest_you_don_t_need_worry_198c82: "你不用担心这个，阿里奥斯。作为指挥官，我会处理的。你就当什么都没发生过……"
  npc_override_2@nyd_NydhoggsNest_you_ever_come_contact_la_1c15e0: "你曾与拉菲内族有过接触吗？你去过斯普兰迪德吗？"
  npc_override_2@nyd_NydhoggsNest_you_finally_showed_your_122bb8: "你终于露出了真面目。我就知道你是拉菲内族的间谍！"
  npc_override_2@nyd_NydhoggsNest_you_heard_all_now_please_f3deb7: "你都听到了，现在请回去向你的种族报告吧。"
  npc_override_2@nyd_NydhoggsNest_you_ll_obtain_others_tru_306080: "你必须通过努力在远征营地获得其他人的信任。"
  npc_override_2@nyd_NydhoggsNest_you_look_like_you_lot_856c41: "你看起来心事重重的样子……你的脸上写满了好奇和疑问。"
  npc_override_2@nyd_NydhoggsNest_you_might_complain_about_e6dfd2: "你可能会抱怨为什么我没有自己带一些来……那是因为我信任你的能力，不要以为一切都是理所当然的。"
  npc_override_2@nyd_NydhoggsNest_you_must_tell_commanders_cfd024: "你必须……把这事告诉阿尔夫海姆的指挥官们，并制定计划。只有他们……"
  npc_override_2@nyd_NydhoggsNest_you_need_me_something_st_e0097d: "陌生人，你找我有事吗？"
  npc_override_2@nyd_NydhoggsNest_you_sapha_tribe_you_outs_d3c898: "你……不是萨帕族的……你是……外人吗？"
  npc_override_2@nyd_NydhoggsNest_you_should_already_seen_6ef40d: "你应该已经看到了正在发生的事。我们与拉菲内族已经打了很长时间的仗了。"
  npc_override_2@nyd_NydhoggsNest_you_should_cautious_our_68d687: "你应该小心。我们部落尊重你们人类的存在，但是……"
  npc_override_2@nyd_NydhoggsNest_you_trying_insult_me_pur_3025a4: "外人，你是故意侮辱我吗？"
  npc_override_2@nyd_NydhoggsNest_you_ve_come_back_good_1c5992: "你回来了……很好，娜欧米怎么样？其实，我不需要担心她。她总是那么开朗。哈哈。"
  npc_override_2@nyd_NydhoggsNest_you_ve_defeated_nidhoggu_401391: "你击败了尼德霍格的暗影。但是……它并没有永远消失。它的力量只是沉睡了。"
  npc_override_2@nyd_NydhoggsNest_you_want_go_there_find_d65508: "你想去那里查明那个地方到底是什么吗？"
  npc_override_2@nyd_NydhoggsNest_you_willing_accept_missi_0dd461: "你愿意接受这个任务吗？即使这意味着要以生命为代价？"
  npc_override_2@nyd_NydhoggsNest_you_won_us_plenty_time_586f9e: "但你为我们赢得了大量时间。这太好了。"
  npc_override_2@nyd_NydhoggsNest_you_you_one_collecting_i_e684de: "你是……？你就是从我士兵那里收集情报的人……？"
  npc_override_2@nyd_NydhoggsNest_your_people_who_no_direc_153d66: "对于你们这些没有直接关系的人来说，这不是一个满足好奇心的地方。我希望你们停止调查，管好自己的事。"
  npc_override_2@nyd_NydhoggsNest_your_people_who_no_direc_dedf2f: "对于你们这些没有直接关系的人来说，这不是一个满足好奇心的地方。我希望你们停止调查，管好自己的事。"
  npc_override_2@nyd_NydhoggsNest_your_race_come_land_long_769a48: "你们的种族不久前通过时空裂隙来到了这片土地。"
