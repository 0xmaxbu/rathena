Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_mjolnir_11_mjolnir_seal_absent_mindedness_f4bcae: "心不在焉！"
  npc_override_mjolnir_11_mjolnir_seal_actually_giant_illusion_9c19f1: "实际上是一个巨人。幻术被用来伪装托尔的对手，但我忘了那是什么。你知道吗？"
  npc_override_mjolnir_11_mjolnir_seal_after_thor_lost_every_ma_f87a9f: "在托尔输掉每场比赛之后，"
  npc_override_mjolnir_11_mjolnir_seal_ah_971301: "啊……"
  npc_override_mjolnir_11_mjolnir_seal_ah_i_like_you_already_50c41c: "啊，我已经喜欢你了，人类！现在为什么不去做些热身运动，等你准备好了我们就来战斗。"
  npc_override_mjolnir_11_mjolnir_seal_ah_i_see_entire_human_a91387: "啊，看来整个人类种族并非都值得鄙视。与你们中的许多人不同，我看出来你尊重长辈。"
  npc_override_mjolnir_11_mjolnir_seal_ah_you_ve_brought_bd00f8: "啊，你带来了"
  npc_override_mjolnir_11_mjolnir_seal_aims_sudri_s_legs_4c7fb4: "瞄准了苏德里的双腿！"
  npc_override_mjolnir_11_mjolnir_seal_all_you_gain_here_few_cff719: "你在这里能获得的只有一些草药。"
  npc_override_mjolnir_11_mjolnir_seal_alright_perhaps_i_m_mean_6c922c: "好吧。也许我注定要帮助你，所以我会为你升级一件武器。你只需要把武器和材料带给我。"
  npc_override_mjolnir_11_mjolnir_seal_alright_then_902bbc: "好吧……"
  npc_override_mjolnir_11_mjolnir_seal_also_means_if_weapon_des_c28666: "这也意味着如果武器被摧毁，任何插入武器的^FF0000卡片^000000也将消失。"
  npc_override_mjolnir_11_mjolnir_seal_although_alvis_answered_432903: "虽然阿尔维斯回答了托尔的所有问题，但他没有注意到太阳正在升起。"
  npc_override_mjolnir_11_mjolnir_seal_anything_i_hate_e6ae80: "我讨厌的一切，"
  npc_override_mjolnir_11_mjolnir_seal_armor_a06680: "防具？！"
  npc_override_mjolnir_11_mjolnir_seal_as_courteously_as_you_01a1e4: "尽可能礼貌地。"
  npc_override_mjolnir_11_mjolnir_seal_as_matter_fact_forged_my_338b35: "事实上，它是由我的祖先锻造的。雷神之锤是完美的武器，除了一个小瑕疵。"
  npc_override_mjolnir_11_mjolnir_seal_as_you_now_get_out_bd3f34: "像你一样！现在，从我眼前消失！"
  npc_override_mjolnir_11_mjolnir_seal_attack_6cdd9c: "一次攻击！"
  npc_override_mjolnir_11_mjolnir_seal_attack_crossing_74f435: "通过交叉发动攻击"
  npc_override_mjolnir_11_mjolnir_seal_attack_graceful_bc965d: "以优雅的姿态发动攻击"
  npc_override_mjolnir_11_mjolnir_seal_attacks_sudri_s_head_74e39c: "攻击了苏德里的头部！"
  npc_override_mjolnir_11_mjolnir_seal_bad_things_happen_cc9d85: "坏事发生了"
  npc_override_mjolnir_11_mjolnir_seal_bah_8bc022: "呸……！"
  npc_override_mjolnir_11_mjolnir_seal_barely_blocked_91c7c3: "勉强挡住了"
  npc_override_mjolnir_11_mjolnir_seal_battle_against_demons_th_73980a: "在一千年前与恶魔的战斗中，托尔用雷神之锤击中了大地。冲击导致地面隆起，形成了这座山。"
  npc_override_mjolnir_11_mjolnir_seal_big_your_goals_ba1b1f: "你的目标有多大，"
  npc_override_mjolnir_11_mjolnir_seal_blacksmith_work_kind_stu_ea98cf: "铁匠才做那种东西！像我这样的矮人需要更有挑战性的东西！"
  npc_override_mjolnir_11_mjolnir_seal_bring_me_level_weapon_me_5db493: "下次给我带一件4级武器来，明白了吗？"
  npc_override_mjolnir_11_mjolnir_seal_bring_me_something_064e6f: "给我带点东西"
  npc_override_mjolnir_11_mjolnir_seal_bring_oridecon_e27a02: "带一个奥利哈钢来。"
  npc_override_mjolnir_11_mjolnir_seal_bwahahah_5d0080: "哇哈哈哈！"
  npc_override_mjolnir_11_mjolnir_seal_calm_down_380e3a: "冷静点，它"
  npc_override_mjolnir_11_mjolnir_seal_carefully_choose_words_03a969: "仔细选择你的措辞"
  npc_override_mjolnir_11_mjolnir_seal_chest_6ab2ad: "在胸口！"
  npc_override_mjolnir_11_mjolnir_seal_clang_clang_caf003: "^3355FF*哐当 哐当！*^000000"
  npc_override_mjolnir_11_mjolnir_seal_come_0b3a3d: "来吧……"
  npc_override_mjolnir_11_mjolnir_seal_come_i_ll_even_let_515ee0: "来吧，我甚至会让你先出手。等你准备好战斗了就来找我！"
  npc_override_mjolnir_11_mjolnir_seal_come_me_human_f2fbbe: "来找我吗，人类？"
  npc_override_mjolnir_11_mjolnir_seal_cool_let_s_fight_982eb8: "酷，让我们战斗吧！"
  npc_override_mjolnir_11_mjolnir_seal_counter_attacked_620ce9: "反击了！"
  npc_override_mjolnir_11_mjolnir_seal_counters_f4f78a: "反击！"
  npc_override_mjolnir_11_mjolnir_seal_course_i_t_remember_ever_7ceaf1: "当然，我不能清楚地记得一切，但那确实太精彩了。"
  npc_override_mjolnir_11_mjolnir_seal_critical_damage_97b079: "暴击伤害"
  npc_override_mjolnir_11_mjolnir_seal_dear_god_no_850255: "天哪，不！"
  npc_override_mjolnir_11_mjolnir_seal_defeated_8c1756: "被击败了……"
  npc_override_mjolnir_11_mjolnir_seal_despite_minor_flaw_mjoln_20d7e2: "尽管有这个小瑕疵，雷神之锤仍被认为是最伟大的传奇武器。"
  npc_override_mjolnir_11_mjolnir_seal_didn_t_i_tell_d499b8: "我没告诉过你吗"
  npc_override_mjolnir_11_mjolnir_seal_dodged_sudri_s_attack_ea_701081: "轻松躲过了苏德里的攻击。"
  npc_override_mjolnir_11_mjolnir_seal_don_t_insult_me_expectin_06eb4f: "别侮辱我，指望我处理低于4级的武器。"
  npc_override_mjolnir_11_mjolnir_seal_don_t_you_like_idea_dd9e73: "你不喜欢挑战极限的想法吗？对我来说，升级就像攀登未被征服的山峰！"
  npc_override_mjolnir_11_mjolnir_seal_don_t_you_understand_14797b: "你不明白吗？"
  npc_override_mjolnir_11_mjolnir_seal_dream_i_traveled_9fca5d: "在这个梦中，我旅行了"
  npc_override_mjolnir_11_mjolnir_seal_during_moment_4acde2: "在一瞬间的"
  npc_override_mjolnir_11_mjolnir_seal_dwarven_blacksmith_99ecc2: "矮人铁匠。"
  npc_override_mjolnir_11_mjolnir_seal_dwarven_blacksmiths_dc8741: "矮人铁匠们"
  npc_override_mjolnir_11_mjolnir_seal_dwarves_lightly_cc1ce8: "矮人轻描淡写地，"
  npc_override_mjolnir_11_mjolnir_seal_effect_our_world_somethi_ab46c5: "它会对我们的世界产生什么影响，但某些重要的事情将会发生……"
  npc_override_mjolnir_11_mjolnir_seal_eh_d4552f: "嗯……？"
  npc_override_mjolnir_11_mjolnir_seal_eh_heh_heh_bcccc2: "嘿嘿嘿~"
  npc_override_mjolnir_11_mjolnir_seal_element_risk_3d035a: "风险因素！"
  npc_override_mjolnir_11_mjolnir_seal_eluniums_oridecons_e905ed: "艾鲁尼姆或奥利哈钢！"
  npc_override_mjolnir_11_mjolnir_seal_even_answer_me_cbd09b: "甚至回答我！"
  npc_override_mjolnir_11_mjolnir_seal_even_gods_know_we_dwarve_d40bf3: "连众神都知道我们矮人是最有才华的工匠！也许现在看起来不是这样，但总有一天我们会回来的。"
  npc_override_mjolnir_11_mjolnir_seal_even_more_562c9f: "用一个更"
  npc_override_mjolnir_11_mjolnir_seal_even_though_won_t_easy_9d3c4a: "即使这不会容易，但我相信如果矮人铁匠确实存在，你一定能找到他们。"
  npc_override_mjolnir_11_mjolnir_seal_every_good_blacksmith_kn_86af27: "每个优秀的铁匠都知道一把好锤子的价值。如果你能理解这一点，我会考虑和你谈谈。"
  npc_override_mjolnir_11_mjolnir_seal_exchange_ores_you_brough_a6e0d8: "作为你带来的矿石的交换，我会给你一件我的家族宝物。"
  npc_override_mjolnir_11_mjolnir_seal_feel_lonesome_c29419: "但感到孤独……"
  npc_override_mjolnir_11_mjolnir_seal_feels_like_today_s_going_063cca: "感觉今天会是美好的一天。"
  npc_override_mjolnir_11_mjolnir_seal_fight_i_think_i_might_33ed11: "一场战斗，我想我可能会"
  npc_override_mjolnir_11_mjolnir_seal_fight_me_huh_14507b: "和我战斗，是吧？"
  npc_override_mjolnir_11_mjolnir_seal_fight_stopped_bd7397: "战斗已经停止了！"
  npc_override_mjolnir_11_mjolnir_seal_fight_stronger_stronger_3f403f: "与越来越强的对手战斗！"
  npc_override_mjolnir_11_mjolnir_seal_fighting_620066: "为了战斗……"
  npc_override_mjolnir_11_mjolnir_seal_final_contest_thor_chall_573531: "最后的比赛，托尔挑战一位老妇人进行摔跤比赛。起初，托尔认为胜利在握，但他发现自己无法击败那个老妇人。"
  npc_override_mjolnir_11_mjolnir_seal_find_suitable_799c70: "找到合适的"
  npc_override_mjolnir_11_mjolnir_seal_finding_dwarves_a40e1d: "寻找矮人！"
  npc_override_mjolnir_11_mjolnir_seal_fine_whatever_ec3075: "好吧！随便！"
  npc_override_mjolnir_11_mjolnir_seal_first_dwarf_you_must_vis_f85236: "你第一个必须拜访的矮人"
  npc_override_mjolnir_11_mjolnir_seal_first_eating_contest_tho_5f6825: "第一个是吃东西比赛。托尔吃光了他桌上的所有肉，但他的对手乌特加德洛基吃掉了他的肉、骨头，甚至盘子。"
  npc_override_mjolnir_11_mjolnir_seal_found_east_cc4084: "可以在东方找到。"
  npc_override_mjolnir_11_mjolnir_seal_found_north_0bd4c0: "可以在北方找到。"
  npc_override_mjolnir_11_mjolnir_seal_four_seals_been_released_e2b4d3: "四个封印同时与[雷神之锤]的封印一起被释放了。"
  npc_override_mjolnir_11_mjolnir_seal_frankly_his_treasures_f307f2: "坦白说他的宝物是"
  npc_override_mjolnir_11_mjolnir_seal_gained_hp_e18d62: "获得了10点HP！"
  npc_override_mjolnir_11_mjolnir_seal_get_out_here_before_i_c73208: "在我打死你之前滚出去！反正你在这里能得到的只有一些草药！"
  npc_override_mjolnir_11_mjolnir_seal_get_out_here_go_your_1525ca: "滚出去，如果你想要装备升级，去找你的人类铁匠！"
  npc_override_mjolnir_11_mjolnir_seal_giants_their_land_tests_267f85: "他们的土地上的巨人们在技能和力量的测试中。"
  npc_override_mjolnir_11_mjolnir_seal_give_me_moment_48a972: "给我一点时间"
  npc_override_mjolnir_11_mjolnir_seal_give_you_useful_informat_af79e8: "如果你有幸遇到矮人，给你一些有用的信息。"
  npc_override_mjolnir_11_mjolnir_seal_go_back_where_you_belong_5df9bd: "在我打死你之前回到你原来的地方！"
  npc_override_mjolnir_11_mjolnir_seal_go_out_train_some_get_b93e2f: "出去训练，变得更强，然后再考虑回来！"
  npc_override_mjolnir_11_mjolnir_seal_going_16eb23: "继续！"
  npc_override_mjolnir_11_mjolnir_seal_good_virtuous_life_s_gre_d9c43e: "善良和正直的生活。实现你的愿望固然很好，但要意识到有些愿望不应该被实现。"
  npc_override_mjolnir_11_mjolnir_seal_great_6ead88: "太好了……！"
  npc_override_mjolnir_11_mjolnir_seal_great_fight_6c367d: "那是一场精彩的战斗！"
  npc_override_mjolnir_11_mjolnir_seal_greet_1d29f7: "不要向"
  npc_override_mjolnir_11_mjolnir_seal_grrr_32da28: "咕噜……！"
  npc_override_mjolnir_11_mjolnir_seal_hahahahaha_9e31bd: "哈哈哈哈！"
  npc_override_mjolnir_11_mjolnir_seal_hahahahahahahahahaah_7d8b27: "哈哈哈哈哈哈哈哈哈哈！"
  npc_override_mjolnir_11_mjolnir_seal_hammer_than_shake_earth_299bfc: "能震动大地、撕裂天空的锤子？在所有传奇武器中，雷神之锤也许是最伟大的。"
  npc_override_mjolnir_11_mjolnir_seal_he_asked_thor_permission_6bfa5a: "他请求托尔允许他娶斯露德，但正如预期的那样，托尔拒绝了。阿尔维斯本应该就此放弃，但他没有。"
  npc_override_mjolnir_11_mjolnir_seal_he_fell_love_thrud_thor_5ef772: "他对托尔的长女斯露德一见钟情。"
  npc_override_mjolnir_11_mjolnir_seal_he_too_ambitious_378d1e: "他太有野心了。"
  npc_override_mjolnir_11_mjolnir_seal_head_8dc52b: "在头上！"
  npc_override_mjolnir_11_mjolnir_seal_here_we_587fd2: "我们到了~"
  npc_override_mjolnir_11_mjolnir_seal_hey_44afd2: "嘿……"
  npc_override_mjolnir_11_mjolnir_seal_hilt_mjolnir_forged_shor_3f82c5: "雷神之锤的柄被锻造得比预期的短。你还在听我说话吗？"
  npc_override_mjolnir_11_mjolnir_seal_his_small_yet_svelte_bod_1d9de0: "他小巧但精瘦的身体。"
  npc_override_mjolnir_11_mjolnir_seal_his_stout_arms_6369cb: "他粗壮的手臂。"
  npc_override_mjolnir_11_mjolnir_seal_hit_8a3336: "击中了{0}"
  npc_override_mjolnir_11_mjolnir_seal_hits_8f1aec: "击中了{0}"
  npc_override_mjolnir_11_mjolnir_seal_hm_701c55: "嗯……？"
  npc_override_mjolnir_11_mjolnir_seal_hm_didn_t_i_ask_908237: "嗯，我不是让你带红色药水来吗？嗓子这么干，我怎么能讲故事呢~"
  npc_override_mjolnir_11_mjolnir_seal_hm_i_sense_you_asked_3fde7c: "嗯？我感觉到你被那个人类要求帮忙了。如果我是你，我会尽快完成那个任务。不知为何，那个人类的命运，以及矮人们的命运，都是交织在一起的……"
  npc_override_mjolnir_11_mjolnir_seal_hmm_9c4d28: "嗯……"
  npc_override_mjolnir_11_mjolnir_seal_hmm_however_i_don_t_8138f6: "嗯，不过，我觉得如果我用其他东西交换一件宝物，他们不会抱怨的。让我想想……"
  npc_override_mjolnir_11_mjolnir_seal_hmm_perhaps_ambitious_dw_6bedb9: "嗯……但也许一个有野心的矮人可以锻造出类似雷神之锤的东西，让人类也能使用。它的力量会小一些，但工艺会完美无瑕。"
  npc_override_mjolnir_11_mjolnir_seal_hmmm_2ac89c: "嗯……"
  npc_override_mjolnir_11_mjolnir_seal_ho_ho_ho_167696: "呵呵呵……"
  npc_override_mjolnir_11_mjolnir_seal_hopefully_someday_i_ll_l_05463d: "希望有一天我能了解我梦境的真相，以及雷神之锤本身的真相。"
  npc_override_mjolnir_11_mjolnir_seal_how_about_278219: "怎么样？"
  npc_override_mjolnir_11_mjolnir_seal_how_powerful_mjolnir_ebc466: "雷神之锤有多强大。"
  npc_override_mjolnir_11_mjolnir_seal_how_you_survive_1c536c: "你是怎么活下来的"
  npc_override_mjolnir_11_mjolnir_seal_however_humans_never_hop_8fca5f: "然而，人类永远无法希望看到甚至挥舞雷神之锤。只有神才能驾驭那种力量。"
  npc_override_mjolnir_11_mjolnir_seal_however_i_hope_you_under_9cc478: "然而，我希望你能理解，如果家族宝物之一突然失踪，我的家人会起疑心的。"
  npc_override_mjolnir_11_mjolnir_seal_however_while_created_st_93df53: "然而，在锻造过程中，一只奇怪的苍蝇叮咬了我祖先的手。因为这个干扰，雷神之锤的柄有一点瑕疵。"
  npc_override_mjolnir_11_mjolnir_seal_huh_6ed1eb: "嗯。"
  npc_override_mjolnir_11_mjolnir_seal_huh_80ee84: "嗯……"
  npc_override_mjolnir_11_mjolnir_seal_huh_a78e67: "嗯……？"
  npc_override_mjolnir_11_mjolnir_seal_huh_you_re_different_tha_d79882: "嗯。你和其他人类不同。但是，仅仅因为你知道如何礼貌地说话就信任你，这并不明智。"
  npc_override_mjolnir_11_mjolnir_seal_human_isn_t_one_5e7790: "人类？那不是"
  npc_override_mjolnir_11_mjolnir_seal_hurry_up_get_one_1fc7bd: "快点去拿一个。"
  npc_override_mjolnir_11_mjolnir_seal_i_am_charge_northern_par_71721e: "我负责雷神之锤山的北部区域。如果你想通过，你必须先获得我的认可！"
  npc_override_mjolnir_11_mjolnir_seal_i_am_nordri_08a9f3: "我是诺德里，"
  npc_override_mjolnir_11_mjolnir_seal_i_believe_976311: "我相信"
  npc_override_mjolnir_11_mjolnir_seal_i_believe_you_102eb2: "我相信你。"
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_any_37c083: "我没有任何"
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_feel_4411c1: "我不觉得"
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_know_how_1fdf89: "我不知道我能对你这样的冒险者有多大帮助。除了作为铁匠……"
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_know_how_95d5ca: "我不知道"
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_much_time_491255: "我没有太多时间，所以如果你不能把那些带给我，就继续你的旅程吧。"
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_think_s_3eb6cc: "我觉得那不对。让我想想，也许我能想起来。希望迟早会想起来的……"
  npc_override_mjolnir_11_mjolnir_seal_i_excuse_you_aca01a: "我原谅你？"
  npc_override_mjolnir_11_mjolnir_seal_i_feel_great_change_comi_daa6e2: "我感觉一场巨大的变化即将来临。我不知道它会对我们的世界产生什么样的"
  npc_override_mjolnir_11_mjolnir_seal_i_feel_strange_force_gro_2810c3: "我能感觉到米德加尔特某处有一种奇怪的力量正在变得越来越强。"
  npc_override_mjolnir_11_mjolnir_seal_i_gave_my_all_c68ef9: "我全力以赴了！"
  npc_override_mjolnir_11_mjolnir_seal_i_know_you_re_just_8b484c: "我知道你只是谨慎而已。该死，我只是太急于得到"
  npc_override_mjolnir_11_mjolnir_seal_i_ll_waiting_day_when_60d41c: "我会等待有一天我能亲眼看到托尔的雷霆。我相信我拥有的那个梦想总有一天会实现。"
  npc_override_mjolnir_11_mjolnir_seal_i_m_impressed_alright_i_1b50ea: "我很 impressed！好吧，我会跟我的朋友们说你的好话。希望我的兄弟们能给你你想要的帮助。"
  npc_override_mjolnir_11_mjolnir_seal_i_m_little_thirsty_you_b16a75: "我有点渴了。你能给我带一瓶红色药水吗？如果你帮我这个忙，我会告诉你一个重要的故事。嘿嘿嘿~"
  npc_override_mjolnir_11_mjolnir_seal_i_m_sooo_thirsty_be95b7: "我好渴啊！"
  npc_override_mjolnir_11_mjolnir_seal_i_m_sure_she_d4db30: "我相信她能"
  npc_override_mjolnir_11_mjolnir_seal_i_m_sure_you_ll_2ef06b: "我相信你会喜欢的。"
  npc_override_mjolnir_11_mjolnir_seal_i_m_surprised_see_0f4004: "我很惊讶看到"
  npc_override_mjolnir_11_mjolnir_seal_i_m_truly_lucky_meet_b592da: "我真的很幸运能遇到像你这样的冒险者。祝你好运。"
  npc_override_mjolnir_11_mjolnir_seal_i_m_waiting_day_when_24ea4e: "我在等待有一天我终于能亲眼看到托尔的雷霆。我相信总有一天，我的梦想会变成现实。"
  npc_override_mjolnir_11_mjolnir_seal_i_may_lost_c8f583: "我可能输了，但"
  npc_override_mjolnir_11_mjolnir_seal_i_must_admit_you_re_b497fc: "我必须承认你是一个非常强大的人类。有机会我们再战斗一次。下次，你可能就没这么幸运了！"
  npc_override_mjolnir_11_mjolnir_seal_i_must_say_blacksmith_s_b36f88: "我必须说，铁匠最大的骄傲来自于他创造出可以被视为毕生杰作的武器和防具。"
  npc_override_mjolnir_11_mjolnir_seal_i_need_a957b9: "我需要"
  npc_override_mjolnir_11_mjolnir_seal_i_no_regrets_when_failur_324e99: "失败时我无怨无悔，成功时我总是很高兴。我会每天升级，充分利用我的生活~"
  npc_override_mjolnir_11_mjolnir_seal_i_nothing_cbf242: "我没有什么"
  npc_override_mjolnir_11_mjolnir_seal_i_really_hope_i_meet_5e4568: "我真的希望下次能遇到一个体面的人类。到目前为止，我还没遇到一个有用的。"
  npc_override_mjolnir_11_mjolnir_seal_i_regret_nothing_d12b39: "我无怨无悔。"
  npc_override_mjolnir_11_mjolnir_seal_i_remember_now_ff4161: "我现在想起来了！"
  npc_override_mjolnir_11_mjolnir_seal_i_remembered_d17f05: "我想起来了……"
  npc_override_mjolnir_11_mjolnir_seal_i_s_alright_a3e187: "我-我没事！"
  npc_override_mjolnir_11_mjolnir_seal_i_see_fd141e: "我明白了……"
  npc_override_mjolnir_11_mjolnir_seal_i_see_i_still_appreciate_351431: "我明白了。但我仍然感谢你花时间听我说话。"
  npc_override_mjolnir_11_mjolnir_seal_i_seem_recall_i_put_d769f8: "我好像记得我把它放在……嗯。"
  npc_override_mjolnir_11_mjolnir_seal_i_sense_change_winds_wha_62145b: "我感觉到风中有变化，但那变化是什么，我说不上来。"
  npc_override_mjolnir_11_mjolnir_seal_i_sense_strange_energy_g_77c2c3: "我感觉到这片大陆某处有一种奇怪的能量正在变得越来越强……"
  npc_override_mjolnir_11_mjolnir_seal_i_shall_defeat_ivaldi_b784ec: "我将击败伊瓦尔迪！"
  npc_override_mjolnir_11_mjolnir_seal_i_should_able_give_you_e53a28: "我应该能给你"
  npc_override_mjolnir_11_mjolnir_seal_i_stronger_stronger_4f7598: "我会变得越来越强，"
  npc_override_mjolnir_11_mjolnir_seal_i_t_help_790f38: "我无法帮助"
  npc_override_mjolnir_11_mjolnir_seal_i_t_help_wanting_know_241f18: "我忍不住想知道我的梦境是否有真相。雷神之锤有可能重现吗？"
  npc_override_mjolnir_11_mjolnir_seal_i_tell_you_old_story_da821b: "我会给你讲一个古老的故事。"
  npc_override_mjolnir_11_mjolnir_seal_i_think_we_d_better_cadaf7: "我想我们最好等等看发生了什么。有人会给我们传递消息的。不过，我不确定那会是好消息还是坏消息……"
  npc_override_mjolnir_11_mjolnir_seal_i_thinking_about_my_drea_3670de: "我在想我的梦，"
  npc_override_mjolnir_11_mjolnir_seal_i_understand_mountain_da_31f72c: "我知道这座山很危险，我也没有资格提出这样的要求……"
  npc_override_mjolnir_11_mjolnir_seal_i_ve_also_recently_heard_17b86b: "我最近还听说矮人铁匠也居住在雷神之锤山上。"
  npc_override_mjolnir_11_mjolnir_seal_i_ve_got_warm_sun_fc3951: "我有温暖的阳光、清新的森林空气，我的锤子和铁砧已经准备好了。这是锻造的好日子！"
  npc_override_mjolnir_11_mjolnir_seal_i_ve_still_got_cf60ec: "我还有这个本事！"
  npc_override_mjolnir_11_mjolnir_seal_i_want_compete_f43cbd: "我想竞争"
  npc_override_mjolnir_11_mjolnir_seal_i_want_compete_stronger_99a5c7: "我想和更强的对手竞争！"
  npc_override_mjolnir_11_mjolnir_seal_i_wish_you_good_luck_c046d7: "祝你好运"
  npc_override_mjolnir_11_mjolnir_seal_i_wish_you_safety_609e4d: "祝你安全"
  npc_override_mjolnir_11_mjolnir_seal_if_gods_all_these_powers_6a157d: "如果众神拥有所有这些力量，一个区区人类怎么能提供任何真正的帮助？"
  npc_override_mjolnir_11_mjolnir_seal_if_s_case_686993: "如果是那样的话，"
  npc_override_mjolnir_11_mjolnir_seal_if_there_s_4ab0c5: "如果有"
  npc_override_mjolnir_11_mjolnir_seal_if_there_s_anything_i_eb23b2: "如果有什么是我热爱的，"
  npc_override_mjolnir_11_mjolnir_seal_if_you_beat_me_3d9f47: "但如果你能在"
  npc_override_mjolnir_11_mjolnir_seal_if_you_don_t_mind_fe7d8b: "如果你不介意的话，我想请你探索这座山，寻找这些矮人铁匠。"
  npc_override_mjolnir_11_mjolnir_seal_if_you_ever_visit_my_9f517d: "如果你拜访我的兄弟们，请代我向他们问好。"
  npc_override_mjolnir_11_mjolnir_seal_if_you_happen_speak_them_49698b: "如果你碰巧按错误的顺序和他们说话，请再去和我的兄弟提尔菲谈谈。"
  npc_override_mjolnir_11_mjolnir_seal_if_you_understand_d879df: "如果你明白的话，"
  npc_override_mjolnir_11_mjolnir_seal_if_you_want_something_yo_a89e9c: "如果你想要什么东西，你应该通过自己的努力去获得。"
  npc_override_mjolnir_11_mjolnir_seal_if_you_wish_learn_more_f46313: "如果你想了解更多，你应该和我的兄弟们谈谈。"
  npc_override_mjolnir_11_mjolnir_seal_if_you_zeny_spare_why_2ecacf: "如果你有闲余的Zeny，为什么不买些零食给你的旅途呢？也许是一些美味的香蕉，或者甚至是一些南瓜……"
  npc_override_mjolnir_11_mjolnir_seal_illusion_magic_he_didn_t_6e317d: "幻术魔法。他没有意识到他实际上并不是在和一位老妇人摔跤。你知道他的对手实际上是什么吗？"
  npc_override_mjolnir_11_mjolnir_seal_important_live_ef47e6: "重要的是过一种"
  npc_override_mjolnir_11_mjolnir_seal_important_you_4daf20: "重要的是你"
  npc_override_mjolnir_11_mjolnir_seal_initiated_a02344: "发起了"
  npc_override_mjolnir_11_mjolnir_seal_insulted_515985: "被侮辱。"
  npc_override_mjolnir_11_mjolnir_seal_isn_t_upgradable_925f98: "这个不能升级！"
  npc_override_mjolnir_11_mjolnir_seal_item_isn_t_even_challeng_3b926d: "这件物品升级起来甚至算不上挑战。你可以让人类来做这种初学者的工作。让他们先精炼它。"
  npc_override_mjolnir_11_mjolnir_seal_item_you_b9af62: "物品给你。"
  npc_override_mjolnir_11_mjolnir_seal_item_your_friend_4ac77b: "物品给你的朋友。"
  npc_override_mjolnir_11_mjolnir_seal_jumped_2619dc: "{0}跳了起来，"
  npc_override_mjolnir_11_mjolnir_seal_just_courageous_8fa24a: "只要勇敢就行！"
  npc_override_mjolnir_11_mjolnir_seal_just_don_t_insult_them_140f7a: "只是……不要侮辱他们！"
  npc_override_mjolnir_11_mjolnir_seal_just_talk_you_c11284: "只是和你谈谈。"
  npc_override_mjolnir_11_mjolnir_seal_kids_these_days_90116b: "现在的年轻人啊……"
  npc_override_mjolnir_11_mjolnir_seal_kind_cowardice_1572ae: "这种懦弱？！"
  npc_override_mjolnir_11_mjolnir_seal_king_told_him_truth_abou_bdd93f: "国王告诉了他关于比赛的真相。托尔勃然大怒，但为时已晚。国王和巨人们都已经消失了。"
  npc_override_mjolnir_11_mjolnir_seal_know_about_mjolnir_239a00: "了解雷神之锤。"
  npc_override_mjolnir_11_mjolnir_seal_land_giants_a2c731: "巨人的土地。"
  npc_override_mjolnir_11_mjolnir_seal_last_night_i_had_most_120fdc: "昨晚，我做了一个最奇妙的梦，梦中我是雷神托尔的仆人。"
  npc_override_mjolnir_11_mjolnir_seal_leap_heavens_6cdcfb: "跃向天堂。"
  npc_override_mjolnir_11_mjolnir_seal_learned_tale_first_don_t_a36c84: "从这个故事中学到的。首先，不要相信你所看到的一切。其次，永远不要对自己的力量过于自信。"
  npc_override_mjolnir_11_mjolnir_seal_leave_immediately_go_stu_e9591c: "立刻离开，去好好学英语！"
  npc_override_mjolnir_11_mjolnir_seal_legend_about_one_721515: "这是一个关于一个"
  npc_override_mjolnir_11_mjolnir_seal_legs_15ccf8: "在腿上！"
  npc_override_mjolnir_11_mjolnir_seal_level_weapons_25b729: "在4级武器上？"
  npc_override_mjolnir_11_mjolnir_seal_life_s_simple_pleasures_fb2587: "生活中的简单乐趣？"
  npc_override_mjolnir_11_mjolnir_seal_like_doing_anything_737979: "喜欢做任何事"
  npc_override_mjolnir_11_mjolnir_seal_like_i_asked_return_de3a21: "像我要求的那样。作为回报，"
  npc_override_mjolnir_11_mjolnir_seal_long_time_ago_many_peopl_8bd659: "很久以前，很多人经常来这个地区。朋友和家人会住在这里，分享快乐和悲伤。"
  npc_override_mjolnir_11_mjolnir_seal_lost_hp_07cccf: "{0}失去了30点HP！"
  npc_override_mjolnir_11_mjolnir_seal_lost_hp_62dec8: "失去了{0}点HP！"
  npc_override_mjolnir_11_mjolnir_seal_lost_hp_7f39ad: "{0}失去了10点HP！"
  npc_override_mjolnir_11_mjolnir_seal_lost_hp_ab6b7e: "{0}失去了{1}点HP！"
  npc_override_mjolnir_11_mjolnir_seal_made_another_dwarf_tribe_25f127: "由另一个矮人部落制造的，但我们无法忍受他的侮辱。所以我的祖先创造了三件自己的宝物。"
  npc_override_mjolnir_11_mjolnir_seal_me_548d4e: "让我用这个做什么？"
  npc_override_mjolnir_11_mjolnir_seal_me_about_125a08: "关于我？"
  npc_override_mjolnir_11_mjolnir_seal_me_challenge_f5788d: "给我一个挑战！"
  npc_override_mjolnir_11_mjolnir_seal_me_human_38c2a9: "我，人类？"
  npc_override_mjolnir_11_mjolnir_seal_me_red_potion_1296f5: "给我一瓶红色药水……？"
  npc_override_mjolnir_11_mjolnir_seal_me_red_potion_just_a8a745: "给我一瓶红色药水，只要"
  npc_override_mjolnir_11_mjolnir_seal_menu_an_83a7b0: "我能使用的物品:我朋友能使用的物品"
  npc_override_mjolnir_11_mjolnir_seal_menu_circling_567645: "回旋之轮:月亮:虚假太阳:快速陌生人"
  npc_override_mjolnir_11_mjolnir_seal_menu_curse_28a2cd: "诅咒:大地:心脏:衰老"
  npc_override_mjolnir_11_mjolnir_seal_menu_greed_8fceaa: "贪婪:海洋:烈焰:野猪"
  npc_override_mjolnir_11_mjolnir_seal_menu_here_1104e7: "这是条件:你必须给我带一件已经升级到可能损坏的4级武器。哦，还要带一个奥利哈钢！"
  npc_override_mjolnir_11_mjolnir_seal_menu_language_3fe928: "语言:思想:海龟:狼"
  npc_override_mjolnir_11_mjolnir_seal_menu_no_b3da58: "不:好的。"
  npc_override_mjolnir_11_mjolnir_seal_menu_nothing_6887a6: "没什么。:打扰了，先生。"
  npc_override_mjolnir_11_mjolnir_seal_menu_nothing_8f0ed1: "没什么。:打扰了。"
  npc_override_mjolnir_11_mjolnir_seal_menu_nothing_9fac3b: "没什么。:嘿，你好！"
  npc_override_mjolnir_11_mjolnir_seal_menu_nothing_cc639e: "没什么。:嘿，你好！"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_3516bc: "……:是吗？:是的，先生！"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_481629: "……:我同意，先生！:嗯，是的。"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_5bccf5: "……:是的，先生！:是啊，随便。"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_6b52e8: "……:什么——？:是的，先生，我同意。"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_6e7867: "……:关于雷神之锤。"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_7527e6: "……？！:攻击头部！:攻击胸口！:攻击腿部！:休息一下。"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_97204b: "{0} : {1} HP"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_aaa4e5: "……:是的，我接受你的挑战。:不，我害怕！"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_b03ea3: "……:哇哇哇~！:啊，我明白了，先生！"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_b86a3f: "……:无聊！:哦，哇。"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_d46163: "……？！:闪避！:格挡！:跳跃！:反击！"
  npc_override_mjolnir_11_mjolnir_seal_menu_options_fce4e2: "……:是的，先生！:嗯？"
  npc_override_mjolnir_11_mjolnir_seal_menu_sudri_cb5fc3: "苏德里 : {0} HP"
  npc_override_mjolnir_11_mjolnir_seal_menu_sure_85c61c: "当然，来吧！:不-不，我改变主意了！"
  npc_override_mjolnir_11_mjolnir_seal_menu_sure_e54441: "当然，来吧！:……不，我退出。"
  npc_override_mjolnir_11_mjolnir_seal_menu_ymir_1435fe: "尤弥尔的头:天空:云工厂:高屋"
  npc_override_mjolnir_11_mjolnir_seal_menu_ymir_43bb35: "尤弥尔的身体:大地:通道:宇宙"
  npc_override_mjolnir_11_mjolnir_seal_misses_cb34c5: "{0}未命中！"
  npc_override_mjolnir_11_mjolnir_seal_mjolnir_70e439: "雷神之锤……？"
  npc_override_mjolnir_11_mjolnir_seal_mjolnir_suited_humans_st_e23a91: "一把适合人类的雷神之锤。不过，这不会很容易。"
  npc_override_mjolnir_11_mjolnir_seal_mjolnir_trusted_weapon_t_c4cb83: "雷神之锤是托尔在战场上使用的信赖武器，每个巨人都畏惧它的力量。"
  npc_override_mjolnir_11_mjolnir_seal_moon_as_false_sun_a69c52: "月亮为'虚假太阳'。"
  npc_override_mjolnir_11_mjolnir_seal_mortal_e9626b: "凡人！"
  npc_override_mjolnir_11_mjolnir_seal_msg_0b0c6f: "{0}"
  npc_override_mjolnir_11_mjolnir_seal_msg_6eae3a: "……"
  npc_override_mjolnir_11_mjolnir_seal_msg_b17ba0: "--------------------"
  npc_override_mjolnir_11_mjolnir_seal_muhahahaha_ce304b: "哈哈哈哈！"
  npc_override_mjolnir_11_mjolnir_seal_muhahahaha_d29ff8: "哈哈哈哈……！"
  npc_override_mjolnir_11_mjolnir_seal_must_around_ah_2857fc: "一定在——啊！"
  npc_override_mjolnir_11_mjolnir_seal_must_upset_you_ac9231: "一定对你很不满"
  npc_override_mjolnir_11_mjolnir_seal_mwahahaha_1e31ca: "哇哈哈哈~"
  npc_override_mjolnir_11_mjolnir_seal_mwahahaha_i_m_satisfied_681fa4: "哇哈哈哈！我对结果很满意。我可能输了，但我们堂堂正正地战斗，全力以赴。"
  npc_override_mjolnir_11_mjolnir_seal_next_contest_race_match_d19696: "下一场比赛是赛跑。在那场比赛中，托尔的仆人提尔菲与国王的仆人胡吉竞争。然而，无论他们比赛多少次，胡吉总是赢。"
  npc_override_mjolnir_11_mjolnir_seal_no_matter_what_other_peo_87ef69: "不管别人怎么说，如果你自信且意志坚定，你总会对结果感到满意。"
  npc_override_mjolnir_11_mjolnir_seal_now_go_human_25e427: "现在走吧，人类。"
  npc_override_mjolnir_11_mjolnir_seal_odd_recently_too_many_hu_095e92: "奇怪。最近，太多人类有兴趣见我和我的兄弟们。不过，我不能说他们的来访令人不快。"
  npc_override_mjolnir_11_mjolnir_seal_oh_excellent_piece_here_a4a9f9: "哦，太棒了！这块已经完全精炼了！但这不是我想要的。我根本不能在这上面做任何工作。"
  npc_override_mjolnir_11_mjolnir_seal_oh_forget_7aff52: "哦，算了。"
  npc_override_mjolnir_11_mjolnir_seal_oh_please_speak_my_siste_9ac16c: "哦，请先和我的妹妹罗斯克瓦说话。她在普隆德拉北门外。"
