Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_2@orcs_OrcsMemory_according_my_research_mi_3d9e5a: "根据我的研究，在那里发现的矿物蕴含着巨大的能量！"
  npc_override_2@orcs_OrcsMemory_after_making_reservation_c9abc5: "预约完成后，你需要从菜单中选择“进入副本”才能进入{0}。"
  npc_override_2@orcs_OrcsMemory_all_records_after_effect_eef994: "^0000ff与兽人记忆副本相关的所有记录和后遗效应已被清除。你现在可以重新生成或重新进入副本。^000000"
  npc_override_2@orcs_OrcsMemory_attempting_book_entrance_994357: "^0000ff{0}^000000- 正在尝试预约入场"
  npc_override_2@orcs_OrcsMemory_chances_they_ll_just_giv_6d5c65: "他们见到你后很可能会给你一大堆指示，所以随机应变就行了！他们总是说同样的话，我都背下来了！"
  npc_override_2@orcs_OrcsMemory_coughing_b22b5e: "*咳嗽*"
  npc_override_2@orcs_OrcsMemory_don_t_move_you_wounded_078fce: "别动！你受伤了！"
  npc_override_2@orcs_OrcsMemory_haha_no_orcs_coming_near_8897a3: "哈哈，没有兽人敢靠近我！"
  npc_override_2@orcs_OrcsMemory_hey_since_when_did_somet_63968e: "嘿，这么有意思的事什么时候需要合法了！？怎么样！你可以跟兽人对话！来吧！"
  npc_override_2@orcs_OrcsMemory_hmm_put_your_hand_monemu_d1ed27: "嗯？如果你想体验穿越次元的感觉，就把手放在那座摩涅莫斯雕像上！"
  npc_override_2@orcs_OrcsMemory_i_created_combination_ou_4820c8: "我结合了我们的技术和从峡谷中发现的无尽能量创造了它！想试试吗？"
  npc_override_2@orcs_OrcsMemory_i_i_just_couldn_t_7a5816: "我……我实在下不了手杀死自己的女儿……"
  npc_override_2@orcs_OrcsMemory_i_used_study_dimensional_f974fc: "我以前研究过在梦罗克附近发现的次元峡谷。"
  npc_override_2@orcs_OrcsMemory_kruger_about_say_somethi_b77e51: "克鲁格还想再说些什么，但他在说出之前就咽下了最后一口气……"
  npc_override_2@orcs_OrcsMemory_kruger_seemed_relieved_a_a5afd3: "听到萨满的死讯，克鲁格似乎松了一口气，但你注意到他脸上苦涩的表情。"
  npc_override_2@orcs_OrcsMemory_mad_scientist_doesn_t_se_da3b63: "疯狂科学家似乎没有注意到你，继续自言自语……"
  npc_override_2@orcs_OrcsMemory_memorial_dungeon_been_de_e49813: "记忆副本已被队长销毁，或因时间限制而消失。请在2小时后重试。"
  npc_override_2@orcs_OrcsMemory_memorial_dungeon_orc_s_m_88b3de: "记忆副本“兽人记忆”不存在。"
  npc_override_2@orcs_OrcsMemory_menu_alright_389c73: "好吧……我该怎么做？:嗯，也许还是算了。"
  npc_override_2@orcs_OrcsMemory_menu_caution_234a24: "警告:你被萨满卡加拉奇发现了。克鲁格刺杀萨满的计划已经失败。你必须击败卡加拉奇并找到克鲁格的踪迹。"
  npc_override_2@orcs_OrcsMemory_menu_caution_9c1faf: "警告:军队开始向第4区集结。"
  npc_override_2@orcs_OrcsMemory_menu_caution_b356c4: "警告:部队已开始在萨满祭坛集结。"
  npc_override_2@orcs_OrcsMemory_menu_depraved_5177ee: "堕落兽人灵魂:我闻到肉味了！好饿！想尝尝人肉！！"
  npc_override_2@orcs_OrcsMemory_menu_depraved_fc84a6: "堕落兽人英雄:遵命，我的主人。"
  npc_override_2@orcs_OrcsMemory_menu_enter_98e531: "进入副本{0}:取消"
  npc_override_2@orcs_OrcsMemory_menu_high_6dd132: "高等兽人:我们需要更多防御！调更多人过来！"
  npc_override_2@orcs_OrcsMemory_menu_high_e0e7eb: "高等兽人:从背后攻击他们！切断他们的支援！"
  npc_override_2@orcs_OrcsMemory_menu_kruger_12eabe: "克鲁格:该死……他们随时都会到。好吧。听我说。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_225400: "克鲁格的低语:那些怪物当然不会让你轻易碰那些火盆。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_3040c2: "克鲁格的低语:这里的兽人曾经是我的同伴。自从兽人萨满开始用她的魔法控制他们之后，他们就失去了意志。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_3d54a1: "克鲁格的低语:只有队长才能强化火焰，所以要保护好你们的队长。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_44610a: "克鲁格的低语:但还是尽量不要太引人注目，以免萨满派军队守卫祭坛。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_5d9b03: "克鲁格的低语:看到那些照亮道路的火盆了吗？通过强化火焰来解除下一个区域的封印。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_6b8d05: "克鲁格:找到那些被附魔的兽人并消灭它们，才能进入下一个区域。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_84182d: "克鲁格:尽量避开附魔兽人以外的兽人。每杀死一只普通兽人，高等兽人就会在通往2楼的最后一条路上集结。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_852dc7: "克鲁格的低语:我来告诉你怎么去萨满的祭坛。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_a57f10: "克鲁格:在最坏的情况下，通往2楼的道路可能会被完全堵死。为了你们自己着想，尽量保持隐蔽行动。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_a5f178: "克鲁格的低语:我看到了部落同胞的尸体。看来兽人萨满用那些兽人进行她的仪式。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_ac630b: "克鲁格的低语:……这一切都与我有关。我对这场罪恶负有责任。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_b8ba02: "克鲁格的低语:要想拯救剩余的部落，我们别无选择，只能打败兽人萨满。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_bc330a: "克鲁格:我原本的计划是让我们的同伴打开大门，但自从我被兽人萨满发现后，一切都毁了。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_c432c7: "克鲁格:兽人萨满将地下1层分成了4个区域并封印了它们。每个区域都有一只附魔兽人，拥有解除下一个区域封印的力量。"
  npc_override_2@orcs_OrcsMemory_menu_kruger_fce560: "克鲁格:该死……你怎么这么久才来！！我可没时间整天耗着！！"
  npc_override_2@orcs_OrcsMemory_menu_mission_275148: "任务:通过点燃火盆来解除区域封印。它们只能按特定顺序点燃，所以要小心。"
  npc_override_2@orcs_OrcsMemory_menu_mission_892614: "任务:潜入并消灭“附魔兽人”。避开其他兽人的战斗是进入2楼的最佳方式。"
  npc_override_2@orcs_OrcsMemory_menu_orc_90463d: "兽人狙击手:哈！能走到这一步确实不简单，但你们愚蠢的旅程到此为止了……"
  npc_override_2@orcs_OrcsMemory_menu_orcs_2c9352: "兽人不攻击你？:你想得美！"
  npc_override_2@orcs_OrcsMemory_menu_party_2e5e7f: "队伍名称:{0}"
  npc_override_2@orcs_OrcsMemory_menu_party_8c7899: "队长:{0}"
  npc_override_2@orcs_OrcsMemory_menu_reserve_c74979: "预约{0}:进入副本:取消"
  npc_override_2@orcs_OrcsMemory_menu_shaman_51f6a7: "萨满卡加拉奇:怎……怎么会这样……你们这样的人怎么会……！！"
  npc_override_2@orcs_OrcsMemory_menu_shaman_7ec759: "萨满卡加拉奇:我忠实的奴隶，去干掉那些入侵者！"
  npc_override_2@orcs_OrcsMemory_menu_shaman_88cb08: "萨满卡加拉奇:我怎么会被区区人类打败！"
  npc_override_2@orcs_OrcsMemory_menu_shaman_92eab0: "萨满卡加拉奇:我……还不能……死……！"
  npc_override_2@orcs_OrcsMemory_menu_shaman_c990bf: "萨满卡加拉奇:哈哈哈！！你们终于来了。你们派来的刺客太差劲了。那个愚蠢的兽人正冷冰冰地躺在我脚下呢。"
  npc_override_2@orcs_OrcsMemory_menu_shaman_e80c41: "萨满卡加拉奇:被这些蠢货打败……这不可能……！"
  npc_override_2@orcs_OrcsMemory_menu_shaman_eb494a: "萨满卡加拉奇:这……这不可能是终点……"
  npc_override_2@orcs_OrcsMemory_menu_shouts_05a869: "守卫队长兽人的呼喊:看来这比预想的要花更长时间。召唤钟乳石魔像！"
  npc_override_2@orcs_OrcsMemory_menu_shouts_a02346: "守卫队长兽人的呼喊:我闻到有老鼠的味道……派巡逻队去入口！！"
  npc_override_2@orcs_OrcsMemory_menu_the_8dfe15: "守卫队长兽人:哦！！看来我有客人了。有本事就来打败我！！"
  npc_override_2@orcs_OrcsMemory_menu_voice_e830ac: "某处传来的声音:愚蠢……你真的以为祭坛会那样轻易倒下吗？"
  npc_override_2@orcs_OrcsMemory_menu_warning_2fabbb: "警告:兽人弓箭手小队正在祭坛附近集结。"
  npc_override_2@orcs_OrcsMemory_menu_warning_b16210: "警告:高等兽人正在第3区域附近集结。"
  npc_override_2@orcs_OrcsMemory_msg_61ce5a: "[{0}] "
  npc_override_2@orcs_OrcsMemory_msg_79ef7f: "……"
  npc_override_2@orcs_OrcsMemory_oh_fine_way_b2cfd6: "哦，好吧，随便你！"
  npc_override_2@orcs_OrcsMemory_oh_like_what_travel_alte_785416: "哦？比如说，穿越到异空间？"
  npc_override_2@orcs_OrcsMemory_only_member_party_enter_9eb530: "只有队伍成员才能进入记忆副本。"
  npc_override_2@orcs_OrcsMemory_only_users_between_level_d1f3af: "只有等级在^ff000030 ~ 80^000000之间的玩家才能进入此副本。"
  npc_override_2@orcs_OrcsMemory_order_generate_dungeon_y_dfc0d3: "要生成副本，你必须是队长且队伍中至少有两名成员。"
  npc_override_2@orcs_OrcsMemory_party_status_confirmed_y_3fd108: "队伍状态已确认。是否要预约进入{0}？"
  npc_override_2@orcs_OrcsMemory_please_hang_there_e52b22: "请坚持住！"
  npc_override_2@orcs_OrcsMemory_power_dimensional_gorge_52aaad: "次元峡谷的力量是无敌的！！"
  npc_override_2@orcs_OrcsMemory_reservation_failed_bb49ab: "^0000ff{0} ^000000 - 预约失败。"
  npc_override_2@orcs_OrcsMemory_s_all_right_i_m_75571c: "没……没事的……我快死了……"
  npc_override_2@orcs_OrcsMemory_s_you_e616fa: "{0}，是你……"
  npc_override_2@orcs_OrcsMemory_shaman_s_dead_now_who_b11f47: "萨满已经死了。那个萨满到底是谁？"
  npc_override_2@orcs_OrcsMemory_shaman_what_about_shaman_834dbb: "萨满？萨满怎么了？"
  npc_override_2@orcs_OrcsMemory_stalactic_golems_digging_54199d: "钟乳石魔像正从地下深处挖掘出来。"
  npc_override_2@orcs_OrcsMemory_thank_you_i_m_sure_15c1eb: "谢谢你，我相信她终于从那个困扰她灵魂的噩梦中解脱了。"
  npc_override_2@orcs_OrcsMemory_um_doesn_t_sound_legal_2a1088: "……嗯，那听起来不太合法吧？"
  npc_override_2@orcs_OrcsMemory_unknown_error_occurred_58bda4: "发生了未知错误。"
  npc_override_2@orcs_OrcsMemory_very_good_just_sit_hands_e8ffb4: "很好！就坐在雕像的手掌里！进去之后尽量表现得自然一点！"
  npc_override_2@orcs_OrcsMemory_very_smart_i_actually_ju_93fc4b: "真聪明！我刚巧就是那么做的！看到那边那座雕像了吗？那不是普通的巨石碑！"
  npc_override_2@orcs_OrcsMemory_we_ll_get_some_rest_0e1566: "穿过这里到达地下2层后，我们就可以休息一下了。"
  npc_override_2@orcs_OrcsMemory_where_high_orcs_get_them_4d2780: "高等兽人在哪里！？叫他们去阻止敌人！"
  npc_override_2@orcs_OrcsMemory_yeah_yeah_i_know_s_8eb033: "是啊，是啊……我知道这很难相信。我不怪你。"
  npc_override_2@orcs_OrcsMemory_you_enter_dungeon_if_bee_5f5363: "如果副本已经生成，你可以进入副本。"
  npc_override_2@orcs_OrcsMemory_you_pretty_distrustful_p_70a8d7: "你还真是个多疑的人啊？"
  npc_override_2@orcs_OrcsMemory_you_see_dead_body_kruger_c0eb83: "你可以看到克鲁格的尸体，安详地躺在地上。"
