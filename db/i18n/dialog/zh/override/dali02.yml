Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_dali02_ghost_palace_exchange_adventurer_friend_what_i_a250bb: "冒险者朋友，{0}正是我需要的。用我拥有的东西来交换怎么样？"
  npc_override_dali02_ghost_palace_exchange_ah_number_written_beside_514e65: "啊！{0}旁边写的数字会派上用场。"
  npc_override_dali02_ghost_palace_exchange_anything_special_61909e: "有什么特别的吗？"
  npc_override_dali02_ghost_palace_exchange_armor_we_all_armors_we_96cb6f: "防具？我们有所有能从幽灵宫殿获得的防具。何不挑选一件呢？"
  npc_override_dali02_ghost_palace_exchange_goodbye_friend_come_agai_380d3f: "再见朋友~下次再来！"
  npc_override_dali02_ghost_palace_exchange_huhh_seems_like_many_the_f160bc: "嗬！好像很多人都听说我有最好的东西了。随便看看我的收藏吧。"
  npc_override_dali02_ghost_palace_exchange_i_am_need_i_exchange_0b18c9: "我需要{0}。我将用^006400{1} {2}^000000来交换。"
  npc_override_dali02_ghost_palace_exchange_i_come_back_later_bda9f6: "我稍后再来。"
  npc_override_dali02_ghost_palace_exchange_i_more_than_enough_weapo_17f568: "我有足够多的武器。"
  npc_override_dali02_ghost_palace_exchange_i_need_cab5a2: "我不需要。"
  npc_override_dali02_ghost_palace_exchange_if_you_bring_me_i_ea11e4: "如果你给我带来{0}，我会用你想要的任何东西来交换。"
  npc_override_dali02_ghost_palace_exchange_let_me_see_other_stuff_582df3: "让我看看其他东西。"
  npc_override_dali02_ghost_palace_exchange_let_s_exchange_671506: "我们来交换吧。"
  npc_override_dali02_ghost_palace_exchange_oh_you_interested_weapon_dbd81e: "哦！你对武器感兴趣吗？我们有所有能从幽灵宫殿获得的武器。何不挑选一件呢？"
  npc_override_dali02_ghost_palace_exchange_please_keep_mind_994444: "请记住这一点。"
  npc_override_dali02_ghost_palace_exchange_required_exchange_01ee52: "交换需要{0} ^006400{1}^000000。"
  npc_override_dali02_ghost_palace_exchange_show_me_your_armor_648353: "让我看看你的盔甲。"
  npc_override_dali02_ghost_palace_exchange_show_me_your_weapon_2b98ef: "给我看看你的武器。"
  npc_override_dali02_ghost_palace_exchange_take_care_friend_see_you_535a87: "保重朋友~下次见！"
  npc_override_dali02_ghost_palace_exchange_thank_you_come_back_if_045c63: "谢谢。如果需要什么请再回来。"
  npc_override_dali02_ghost_palace_exchange_we_many_armors_you_why_07017f: "我们有很多防具给你。何不挑选一件呢？"
  npc_override_dali02_ghost_palace_exchange_you_cannot_proceed_becau_7b849a: "- 你携带的物品太多，无法继续。 -"
  npc_override_dali02_ghost_palace_exchange_you_mean_e0e64b: "你是说{0}吗？"
  npc_override_dali02_ghost_palace_exchange_you_put_me_difficult_sit_99850f: "你让我陷入了困境，朋友。"
