  npc_override_1@ma_c_BuwayaCave_look_wall_over_there_708226: "看那边的墙。"
  npc_override_1@ma_c_BuwayaCave_menu_buwaya_019246: "布瓦亚：你害怕了吗？"
  npc_override_1@ma_c_BuwayaCave_menu_buwaya_616666: "布瓦亚：这是……我的……致命……攻击！"
  npc_override_1@ma_c_BuwayaCave_menu_buwaya_a0e39a: "布瓦亚：我受够了，让我们一决胜负吧！"
  npc_override_1@ma_c_BuwayaCave_menu_buwaya_a31ccc: "布瓦亚：这是……我的！"
  npc_override_1@ma_c_BuwayaCave_menu_buwaya_b09c38: "布瓦亚：这是……我的……致命攻击！"
  npc_override_1@ma_c_BuwayaCave_menu_buwaya_b63815: "布瓦亚：这是！"
  npc_override_1@ma_c_BuwayaCave_menu_buwaya_bfb9d9: "布瓦亚：我要把你放进我的宝箱里！"
  npc_override_1@ma_c_BuwayaCave_menu_enter_3ada75: "进入。:返回。"
  npc_override_1@ma_c_BuwayaCave_menu_get_8d9d0a: "让我离开这里！！:逃……逃不掉？"
  npc_override_1@ma_c_BuwayaCave_menu_guard_4419cf: "守卫：你做得很好。请赶快从进来的路逃出去！"
  npc_override_1@ma_c_BuwayaCave_menu_tell_3b71a7: "告诉我。:你真的知道吗？"
  npc_override_1@ma_c_BuwayaCave_menu_why_2a9972: "为什么这里这么危险？:我是来追捕布瓦亚的。:结束对话。"
  npc_override_1@ma_c_BuwayaCave_menu_yes_98324d: "是！:不，我会留下。"
  npc_override_1@ma_c_BuwayaCave_new_people_got_caught_6d1534: "而且新的人被抓了。"
  npc_override_1@ma_c_BuwayaCave_oh_now_good_time_3af618: "哦，现在不是好时机。"
  npc_override_1@ma_c_BuwayaCave_ok_listen_carefully_0619a0: "好的，仔细听好了，"
