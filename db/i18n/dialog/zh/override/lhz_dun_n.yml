Body:
  npc_override_lhz_dun_n_lhz_dun_n_menu_voice_0bb034: "死神之声:再见。"
  npc_override_lhz_dun_n_lhz_dun_n_menu_voice_2f0736: "死神之声:好久不见。"
  npc_override_lhz_dun_n_nightmare_biolab_aargh_ah_urgh_e53c68: "啊啊……啊……呃……"
  npc_override_lhz_dun_n_nightmare_biolab_acquire_energy_fragments_8792eb: "获取能量碎片。"
  npc_override_lhz_dun_n_nightmare_biolab_additional_aspd_when_you_5f2c56: "（当你的角色精炼等级达到10时，额外ASPD + 1。）"
  npc_override_lhz_dun_n_nightmare_biolab_additional_atk_per_each_4c3f8a: "（每提升1级精炼等级，额外ATK + 2）"
  npc_override_lhz_dun_n_nightmare_biolab_additional_matk_per_each_f9aa07: "（每提升1级精炼等级，额外MATK + 3）"
  npc_override_lhz_dun_n_nightmare_biolab_additional_per_each_refi_1c5c74: "（每提升1级精炼等级，额外1%）"
  npc_override_lhz_dun_n_nightmare_biolab_additional_per_refinemen_d6d6b4: "（每提升2级精炼等级，额外1%）"
  npc_override_lhz_dun_n_nightmare_biolab_additional_when_refineme_b087ea: "当精炼等级达到10时，额外4%）"
  npc_override_lhz_dun_n_nightmare_biolab_additional_when_refineme_d903e2: "（当精炼等级达到8时，额外3%，"
  npc_override_lhz_dun_n_nightmare_biolab_after_many_adventurers_e_d1ab69: "在那之后，许多冒险者听说了传闻后通过这个裂缝进入了这个危险的地方。我几乎没有发现任何冒险者从这个裂缝出来。从那以后，这个地方被称为荣耀之墓。"
  npc_override_lhz_dun_n_nightmare_biolab_after_such_terrible_thin_a1bb7e: "在发生了……这么可怕的事情之后……你……"
  npc_override_lhz_dun_n_nightmare_biolab_all_enchantments_applied_e8e1e2: "头盔上所有已应用的附魔，除了装备的熔炼等级和1个插槽卡片外，都将被重置。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_all_personnel_should_act_848fd1: "所有人员应按照紧急规则行事。"
  npc_override_lhz_dun_n_nightmare_biolab_all_state_dab934: "^006400全属性 + 1^000000"
  npc_override_lhz_dun_n_nightmare_biolab_all_state_mdef_61e9fb: "^006400全属性 + 1 MDEF + 5。^000000"
  npc_override_lhz_dun_n_nightmare_biolab_all_state_mdef_8ea17c: "^006400全属性 + 1 MDEF + 5^000000"
  npc_override_lhz_dun_n_nightmare_biolab_all_state_mdef_c39e36: "^006400全属性 + 1，MDEF + 5^000000"
  npc_override_lhz_dun_n_nightmare_biolab_alright_now_i_received_z_422924: "好的。既然我收到了Zeny，我就打开裂缝。"
  npc_override_lhz_dun_n_nightmare_biolab_aren_t_you_afraid_god_c8148e: "你……不害怕……上帝的……愤怒吗？……"
  npc_override_lhz_dun_n_nightmare_biolab_as_you_know_equipment_re_36e2ef: "如你所知，这件装备需要大量材料，所以所有公会成员都别无选择，只能被困在地牢里被迫工作。"
  npc_override_lhz_dun_n_nightmare_biolab_ask_him_about_tomb_honor_08caef: "问他关于荣誉之墓的事。"
  npc_override_lhz_dun_n_nightmare_biolab_aspd_per_refinement_leve_961905: "^006400每提升5级精炼等级，ASPD + 1^000000"
  npc_override_lhz_dun_n_nightmare_biolab_atk_cri_per_each_refinem_636dc9: "^006400每提升1级精炼等级，ATK + 4，CRI + 2。^000000"
  npc_override_lhz_dun_n_nightmare_biolab_atk_matk_per_each_refine_72ec96: "^006400每提升1级精炼等级，ATK + 4，MATK + 4。^000000"
  npc_override_lhz_dun_n_nightmare_biolab_atk_per_refinement_level_e478fe: "^006400每提升1级精炼等级，ATK + 4^000000"
  npc_override_lhz_dun_n_nightmare_biolab_atk_when_your_character_c70638: "当你的角色纯STR达到90时，ATK + 10。"
  npc_override_lhz_dun_n_nightmare_biolab_attack_delay_additionall_9afb00: "（每提升2级精炼等级，攻击延迟额外减少1%）"
  npc_override_lhz_dun_n_nightmare_biolab_attempts_enchantment_nd_2c443a: "^FF0000*尝试对第2个插槽进行附魔。"
  npc_override_lhz_dun_n_nightmare_biolab_attempts_enchantment_rd_2a05fc: "^FF0000*尝试对第3个插槽进行附魔。6种属性中随机附魔1种。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_attempts_enchantment_th_baecd1: "^FF0000*尝试对第4个插槽进行附魔。6种属性中随机附魔1种。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_axe_mace_book_ad7c62: "斧、锤、书"
  npc_override_lhz_dun_n_nightmare_biolab_bow_a17942: "弓"
  npc_override_lhz_dun_n_nightmare_biolab_bring_their_wandering_ve_164996: "带来他们……游荡的{0}，{1}……容纳灵魂的容器和……充满这个地方的……黑暗能量……"
  npc_override_lhz_dun_n_nightmare_biolab_check_amount_cursed_frag_bcf2e3: "检查你拥有的诅咒碎片数量。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_check_amount_sentimental_1add07: "检查你拥有的感伤碎片数量。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_complete_evasion_per_ref_5f53a2: "^006400每提升3级精炼等级，完全回避 +1。^000000"
  npc_override_lhz_dun_n_nightmare_biolab_congratulation_you_ve_su_75a767: "^FF0000*恭喜。你附魔成功了。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_continue_exchange_b11f22: "继续交换。"
  npc_override_lhz_dun_n_nightmare_biolab_countless_subjects_minds_6a48e8: "无数……实验体的……思想……"
  npc_override_lhz_dun_n_nightmare_biolab_course_amount_exchange_d_cd0200: "当然，交换的数量是由公会会长决定的，他强调"
  npc_override_lhz_dun_n_nightmare_biolab_current_required_cool_do_6a9939: "……当前……所需……冷却……时间……"
  npc_override_lhz_dun_n_nightmare_biolab_cursed_fragments_needed_8444f4: "诅咒……碎片……{0}个……需要……我想知道……你……是否……负担得起……咔……咔……"
  npc_override_lhz_dun_n_nightmare_biolab_dear_odin_fd743e: "亲爱的奥丁……"
  npc_override_lhz_dun_n_nightmare_biolab_destroy_destroy_e40340: "毁掉它……毁掉它……"
  npc_override_lhz_dun_n_nightmare_biolab_disagree_6d1d82: "不同意。"
  npc_override_lhz_dun_n_nightmare_biolab_don_t_ask_me_why_ec632b: "别问我为什么需要它。只要给我带来10份研究报告。然后，我就免费把你送到荣耀之墓。你觉得怎么样？"
  npc_override_lhz_dun_n_nightmare_biolab_don_t_exit_dungeon_1a9670: "不要退出地牢。"
  npc_override_lhz_dun_n_nightmare_biolab_don_t_go_back_0c0e74: "不要回去。"
  npc_override_lhz_dun_n_nightmare_biolab_due_enchantment_failure_134662: "^FF0000*由于附魔失败，已降级一级。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_emergency_protocol_activ_1c40f8: "紧急协议已激活。用户将能够运行RT-223。"
  npc_override_lhz_dun_n_nightmare_biolab_emergency_protocol_activ_ba4a9e: "紧急协议……已激活……RT..017……冷却……1小时……"
  npc_override_lhz_dun_n_nightmare_biolab_enchantment_cursed_fragm_5d8ed0: "^FF0000*在附魔中，需要10个诅咒碎片。"
  npc_override_lhz_dun_n_nightmare_biolab_enchantment_cursed_fragm_fd7b2f: "^FF0000*在附魔中，需要{0}个诅咒碎片。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_enchantment_proceeded_or_d25771: "^FF0000*附魔按4、3、2插槽的顺序进行。当你第一次对每个插槽进行附魔时，需要10个诅咒碎片。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_enchantment_using_cursed_6187cc: "^FF0000*使用诅咒碎片进行附魔只能在旧头盔上进行。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_enchantment_using_cursed_ebf150: "^FF0000*使用诅咒碎片进行附魔只能在旧头盔上进行。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_end_conversation_a707c7: "结束对话。"
  npc_override_lhz_dun_n_nightmare_biolab_equipment_smelting_level_fb2a19: "^FF0000*装备熔炼等级、卡片、装备损失不会发生。但是，根据成功或失败，附魔等级可能会降级。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_even_after_i_die_my_e8fcf9: "即使在我死后……或者在我的梦中……"
  npc_override_lhz_dun_n_nightmare_biolab_exchange_192dee: "不要兑换。"
  npc_override_lhz_dun_n_nightmare_biolab_exchange_5dfc87: "交换。"
  npc_override_lhz_dun_n_nightmare_biolab_exchanged_energy_pieces_005df3: "^3300661个{0}^000000被交换为^CC3333{1}个能量碎片^000000。"
  npc_override_lhz_dun_n_nightmare_biolab_exit_dungeon_d81b25: "离开地下城。"
  npc_override_lhz_dun_n_nightmare_biolab_exit_outside_wall_43c460: "出口在墙外。"
  npc_override_lhz_dun_n_nightmare_biolab_failed_a4a158: "^006400{0}^000000……失败了……"
  npc_override_lhz_dun_n_nightmare_biolab_filled_e10291: "被填满……"
  npc_override_lhz_dun_n_nightmare_biolab_fine_i_ll_reset_enchantm_a75708: "好的！……我会……重置……旧头盔的附魔……我想……我们也许能够吸收……强大的思想……"
  npc_override_lhz_dun_n_nightmare_biolab_forever_5513fd: "永远……"
  npc_override_lhz_dun_n_nightmare_biolab_go_back_lighthalzen_36175a: "返回里希塔乐镇。"
  npc_override_lhz_dun_n_nightmare_biolab_go_back_previous_menu_6438b6: "返回上一级菜单。"
  npc_override_lhz_dun_n_nightmare_biolab_go_back_previous_menu_b7a464: "返回上一级菜单。"
  npc_override_lhz_dun_n_nightmare_biolab_go_hell_all_you_9799f6: "去地狱吧……你们所有人……"
  npc_override_lhz_dun_n_nightmare_biolab_god_protect_you_if_you_df18ac: "上帝……会保护……你……如果你……现在……忏悔……你的罪……"
  npc_override_lhz_dun_n_nightmare_biolab_good_you_everything_i_ll_7b87a1: "好的。你什么都有了。我带你去那里。"
  npc_override_lhz_dun_n_nightmare_biolab_hand_over_grudge_grudge_48832c: "交出……怨恨……怨恨……"
  npc_override_lhz_dun_n_nightmare_biolab_hand_over_research_chart_01908d: "交出 10 张研究图表。"
  npc_override_lhz_dun_n_nightmare_biolab_hand_over_soul_142282: "交出灵魂。"
  npc_override_lhz_dun_n_nightmare_biolab_hand_over_weapon_d298f8: "交出武器。"
  npc_override_lhz_dun_n_nightmare_biolab_he_kept_asking_me_show_3738d8: "他一直问我怎么去那里。我不太想让他知道这个裂缝，因为我不想让别人知道。但我用这条信息换了100,000 Zeny。"
  npc_override_lhz_dun_n_nightmare_biolab_he_kept_muttering_himsel_d49826: "他一直自言自语地念叨着生物医学研究、实验室之类的东西。"
  npc_override_lhz_dun_n_nightmare_biolab_hello_anyone_there_0323fb: "你好……有人吗……？"
  npc_override_lhz_dun_n_nightmare_biolab_helmet_enchanted_so_cann_f7192e: "^FF0000*这个头盔没有被附魔，所以无法重置。*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_here_a2cac1: "这里是…… ^006400{0}^000000……"
  npc_override_lhz_dun_n_nightmare_biolab_hey_buddy_you_some_remai_1f1e81: "嘿，伙计。你还有一些剩余的能量碎片吗？如果你愿意，我可以给你换一些合适的东西。"
  npc_override_lhz_dun_n_nightmare_biolab_hmm_hmm_anyway_give_me_3ff700: "嗯嗯……总之，给我100,000 Zeny。然后，我会为像你这样的冒险者打开通往裂缝的门……"
  npc_override_lhz_dun_n_nightmare_biolab_hmm_hmm_d58a5e: "嗯……嗯……"
  npc_override_lhz_dun_n_nightmare_biolab_hmm_quite_unexpected_36986f: "嗯……这相当出乎意料。"
  npc_override_lhz_dun_n_nightmare_biolab_hmm_then_any_chance_you_e3d590: "嗯……那……顺便问一下，你有研究报告吗？"
  npc_override_lhz_dun_n_nightmare_biolab_how_about_we_begin_light_494f48: "要不……我们……先……轻松……开始？……测试……你的运气……咔……嘿嘿……"
  npc_override_lhz_dun_n_nightmare_biolab_how_you_0a52f0: "你……打算……怎么做？"
  npc_override_lhz_dun_n_nightmare_biolab_however_before_happens_i_ccc387: "然而……在那之前……我需要检查……你是否有……足够的诅咒碎片…… "
  npc_override_lhz_dun_n_nightmare_biolab_however_he_holding_sever_4b4cc6: "然而，他拿着几件物品。乍一看，它们看起来非常强大，连我都感到害怕。"
  npc_override_lhz_dun_n_nightmare_biolab_hush_speak_quietly_peopl_f4c8aa: "嘘，小声点。周围的人可能会听到我们。你有还是没有？"
  npc_override_lhz_dun_n_nightmare_biolab_i_am_so_scared_scared_9b2a13: "我好害怕……害怕……"
  npc_override_lhz_dun_n_nightmare_biolab_i_am_sorry_i_leave_071b30: "对不起……我现在要离开……谢谢……"
  npc_override_lhz_dun_n_nightmare_biolab_i_asked_collect_some_kin_d3ae6c: "我被要求收集某种研究报告……"
  npc_override_lhz_dun_n_nightmare_biolab_i_don_t_get_why_e61d2f: "我不明白。为什么……是我？……"
  npc_override_lhz_dun_n_nightmare_biolab_i_don_t_mind_0fbc5a: "我不介意。"
  npc_override_lhz_dun_n_nightmare_biolab_i_don_t_much_time_7d51d5: "我……没有多少时间……留在这里了。"
  npc_override_lhz_dun_n_nightmare_biolab_i_dug_ground_find_someth_988d0a: "我在地上挖东西吃，结果发现了更好的东西。"
  npc_override_lhz_dun_n_nightmare_biolab_i_earned_some_money_than_8d853a: "多亏了他们，我赚了一些钱。"
  npc_override_lhz_dun_n_nightmare_biolab_i_entered_crevice_first_3f2c0c: "我第一次进入这个裂缝，你猜怎么着？它通向一个到处都是怪物的地方。"
  npc_override_lhz_dun_n_nightmare_biolab_i_found_place_first_time_8c2d12: "我是第一次发现这个地方的，所以它的所有权也属于我！你有意见吗？"
  npc_override_lhz_dun_n_nightmare_biolab_i_gave_heads_up_one_4a33ca: "我给我认识的一个冒险者提了个醒。然后，他表现出了极大的兴趣！"
  npc_override_lhz_dun_n_nightmare_biolab_i_got_critical_damage_mi_3f59cd: "- 我受到了致命伤害 - - 被思想的强大波长 - - 渗入我的身体。 -"
  npc_override_lhz_dun_n_nightmare_biolab_i_got_critical_damage_mi_e5ccde: "- 我受到了致命伤害 - - 被思想的强大波长 - - 渗入我的身体。 -"
  npc_override_lhz_dun_n_nightmare_biolab_i_guess_we_take_care_d63e68: "我想如果他把数量调低一点，我们可以很快处理。（叹气）……事情就是这样。"
  npc_override_lhz_dun_n_nightmare_biolab_i_hear_somebody_talking_41d540: "- 我听到有人在说话 - - 远程通讯 -"
  npc_override_lhz_dun_n_nightmare_biolab_i_hope_you_come_back_7c7b85: "希望你能活着回来！……"
  npc_override_lhz_dun_n_nightmare_biolab_i_hoped_you_could_see_a5f6ae: "我希望……你也能……看到……其他东西……"
  npc_override_lhz_dun_n_nightmare_biolab_i_like_exchange_blood_th_34f600: "我想用1个嗜血欲望交换200个能量碎片。"
  npc_override_lhz_dun_n_nightmare_biolab_i_like_exchange_ghost_ch_b09f10: "我想用1个幽灵寒意交换300个能量碎片。"
  npc_override_lhz_dun_n_nightmare_biolab_i_like_exchange_warrior_012c24: "我想用1个战士意志交换200个能量碎片。"
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_curse_you_even_f4c94d: "我会……诅咒你……即使……在我死后……"
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_immediately_report_cc18d7: "我将立即将有关实验室的信息作为最高优先级报告。"
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_make_all_members_73b9e2: "'^1F294D我会让所有公会的所有成员都穿上阵亡士兵斗篷！！^000000'。"
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_munch_you_into_cf579e: "我会把你……嚼成碎片……"
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_never_accept_if_f67f7b: "'^1F294D如果低于这个数量，我绝不接受！！^000000'……"
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_send_you_crevice_93a749: "我会按照承诺把你送到裂缝。"
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_wait_you_if_8aab4e: "我会……等你……如果你需要我……我会永远等你……咔咔……"
  npc_override_lhz_dun_n_nightmare_biolab_i_m_innocent_i_don_0addd5: "我是无辜的……我……不应该遭受这个……"
  npc_override_lhz_dun_n_nightmare_biolab_i_m_sorry_i_ve_a075a5: "对不起，但我没什么好说的。我这么做只是因为能赚很多钱。"
  npc_override_lhz_dun_n_nightmare_biolab_i_m_taking_you_there_4734d0: "但是……我为了钱带你去那里……你应该小心。"
  npc_override_lhz_dun_n_nightmare_biolab_i_made_energy_fragment_r_202bbc: "我已经……通过恢复^006400{0}^000000……制作了……能量……碎片……"
  npc_override_lhz_dun_n_nightmare_biolab_i_need_01e666: "我需要1个{0}，{1} {2}…… {3} {4}.."
