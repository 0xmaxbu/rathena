Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_izlude_HelpMeShorty_addition_regular_dungeon_b79c3d: "除了常规地下城之外，还有特殊地下城。通常人们说，那是由未知力量在这个世界上创造的特别之地。"
  npc_override_izlude_HelpMeShorty_addition_sense_belonging_d09018: "除了归属感之外，公会还可以享受各种福利，比如公会专属技能和专用仓库。"
  npc_override_izlude_HelpMeShorty_adoption_requires_wedded_5034aa: "领养要求已婚夫妇的等级达到70级以上，且被领养的孩子必须是Novice或一转职业。"
  npc_override_izlude_HelpMeShorty_after_arriving_here_firs_87a339: "第一次来到这里时你什么都不知道，对吧？我会把我所知道的一切都教给你。^0000cd有什么问题尽管问我！^000000"
  npc_override_izlude_HelpMeShorty_after_selecting_area_you_9ee7ce: "选择你想查看的区域后，检查右上角的^0000cd怪物标签^000000或按下^0000cdTab键^000000，你就会看到该区域分布最多的怪物名称和等级。"
  npc_override_izlude_HelpMeShorty_after_some_quests_traini_b33ae4: "完成了一些任务和训练后，他们给了我装备。"
  npc_override_izlude_HelpMeShorty_ah_you_go_boat_alberta_3fe06f: "^0000cd啊！你可以从Alberta乘船前往^000000！我们稍后去吧！主人！这是新的冒险！"
  npc_override_izlude_HelpMeShorty_alas_acorns_muk_muk_acor_2ea4d3: "哎呀！橡果！咕嘟咕嘟，橡果冻！橡果能做什么呢？你可以吃橡果冻~"
  npc_override_izlude_HelpMeShorty_alberta_1dc61b: "艾尔贝塔"
  npc_override_izlude_HelpMeShorty_all_penguin_penguin_you_d83b9d: "就这些了吗？企鹅？企鹅？你喜欢企鹅胜过喜欢我吗？"
  npc_override_izlude_HelpMeShorty_amatsu_kunlun_moscovia_b_be74b8: "天津城、Kunlun、Moscovia、Brasilis、哎哟泰雅、Dewata、Port Malaya、Rock Ridge等等。未知的世界正在等着你。"
  npc_override_izlude_HelpMeShorty_arrows_bullets_only_equi_e63e8a: "箭矢和子弹只能通过从背包拖拽到装备窗口的角色身上来装备。"
  npc_override_izlude_HelpMeShorty_arunafelz_church_worship_fd67b7: "^0000cdArunafelz^000000。这是一座崇拜女神的教堂。所以，那里有一位教皇。当然，你见不到任何人，但有可能吗？也许我们至少能见一次。"
  npc_override_izlude_HelpMeShorty_arunafelz_temple_capital_768528: "Arunafelz有一座圣都Rachel和一个峡谷小镇Veins。"
  npc_override_izlude_HelpMeShorty_attack_click_target_atta_290d5a: "^0000cd<攻击>^000000 - 用鼠标点击目标^0000cd进行攻击^000000。"
  npc_override_izlude_HelpMeShorty_aww_i_m_shorty_what_f6b4dc: "啊呜！！！我是Shorty！主人的名字是什么？"
  npc_override_izlude_HelpMeShorty_base_expeditionary_force_8a1ff3: "从三国远征军的基地出发，你可以前往Splendid、Eclage、Manuk或El Dicastes。"
  npc_override_izlude_HelpMeShorty_basic_operation_a3a6f5: "基本操作"
  npc_override_izlude_HelpMeShorty_because_simplifies_trans_265093: "因为它简化了传送过程。还有什么比这更好的理由呢？"
  npc_override_izlude_HelpMeShorty_before_reaching_level_yo_2f897a: "^EE0000在达到31级之前，你可以随时通过^0000cd<让我们分手吧>^EE0000菜单送走Shorty，但之后你将永远无法再让Shorty成为你的伙伴。^"
  npc_override_izlude_HelpMeShorty_better_go_adventure_plac_81c97c: "最好还是去与主人等级相匹配的地方冒险。如果^0000cd与怪物的等级差距太大^000000，你无法获得100%的经验。你也得计算等级差距，对吧？"
  npc_override_izlude_HelpMeShorty_biggest_characteristic_g_d7ecb7: "公会最大的特点就是据点的争夺战。这也被称为攻城战。"
  npc_override_izlude_HelpMeShorty_break_up_now_8dd83f: "现在就分手。"
  npc_override_izlude_HelpMeShorty_building_lower_left_corn_b434c9: "^0000cdProntera中央喷泉左下角的建筑^000000就是家族总部，去看看吧。"
  npc_override_izlude_HelpMeShorty_buy_sell_stalls_click_mo_c609c9: "<买卖摊位> - 在摊位窗口点击鼠标。"
  npc_override_izlude_HelpMeShorty_call_me_anytime_if_you_7c9048: "有任何问题随时叫我。我会四处看看然后回到包里。"
  npc_override_izlude_HelpMeShorty_cancel_77dfd2: "取消"
  npc_override_izlude_HelpMeShorty_capital_prontera_satelli_5fa88f: "首都是Prontera，卫星城是Izlude，魔法师聚集的Geffen，东方的Payon，可以前往各地区旅行的Alberta，拥有钟楼的Aldebaran，还有Morroc。"
  npc_override_izlude_HelpMeShorty_case_make_party_together_60590b: "那样的话，组个队伍一起做吧。"
  npc_override_izlude_HelpMeShorty_case_you_use_catalog_cur_4b9a0b: "那样的话，你可以使用^0000cd目录^000000。据说目前^0000cdParadise的售货机或Alberta的商人^000000有售。"
  npc_override_izlude_HelpMeShorty_chat_2ced57: "聊天"
  npc_override_izlude_HelpMeShorty_check_quest_80e5df: "检查任务"
  npc_override_izlude_HelpMeShorty_check_skill_click_skill_b79347: "<查看技能> - 点击左上角的^0000cd主菜单中的技能图标^000000。"
  npc_override_izlude_HelpMeShorty_check_status_click_statu_5e7a7d: "<查看状态> - 点击左上角的^0000cd主菜单中的状态图标^000000。"
  npc_override_izlude_HelpMeShorty_check_status_skills_d60935: "检查状态和技能"
  npc_override_izlude_HelpMeShorty_click_navi_alberta_info_c3591e: "点击<NAVI>[艾尔贝塔]<INFO>alberta,124,67,0,101,0</INFO></NAVI>来找到它。"
  npc_override_izlude_HelpMeShorty_click_navi_geffen_info_g_1796c7: "点击<NAVI>[吉芬]<INFO>geffen,132,66,0,101,0</INFO></NAVI>来找到它。"
  npc_override_izlude_HelpMeShorty_click_navi_payon_info_pa_485296: "点击<NAVI>[斐扬]<INFO>payon,177,111,0,101,0</INFO></NAVI>来找到它。"
  npc_override_izlude_HelpMeShorty_click_navi_prontera_info_9616da: "点击<NAVI>[普隆德拉]<INFO>prontera,124,76,0,101,0</INFO></NAVI>来找到它。"
  npc_override_izlude_HelpMeShorty_click_quest_icon_main_me_2521c1: "点击左上角的^0000cd主菜单中的任务图标^000000。"
  npc_override_izlude_HelpMeShorty_command_list_d59b3b: "命令列表"
  npc_override_izlude_HelpMeShorty_continent_full_festivals_89e902: "这片大陆全年都充满着节日气氛。主人有空的时候去参加节日怎么样？"
  npc_override_izlude_HelpMeShorty_conversation_click_targe_ddc16c: "<对话> - 用鼠标点击目标^0000cd进行对话^000000。"
  npc_override_izlude_HelpMeShorty_course_s_free_you_solve_2369c0: "当然，这不是免费的，但你必须完成Paradise的一个简单任务。此外，他们还出租影子装备。"
  npc_override_izlude_HelpMeShorty_cute_a26748: "可爱。"
  npc_override_izlude_HelpMeShorty_details_322302: "详细信息"
  npc_override_izlude_HelpMeShorty_did_you_fun_without_me_296fa8: "你玩得开心吗？没有我也玩得开心吗……"
  npc_override_izlude_HelpMeShorty_did_you_know_quick_item_b1c1ae: "你知道吗，快速使用物品和更换装备对于有效战斗至关重要？"
  npc_override_izlude_HelpMeShorty_doesn_t_make_your_heart_c676c4: "光是听到这些话就让人心动了吧？待会见，主人。"
  npc_override_izlude_HelpMeShorty_don_t_forget_skill_activ_d04af9: "别忘了！技能必须通过双击你想使用的图标来激活，然后通过单击鼠标左键施放！"
  npc_override_izlude_HelpMeShorty_don_t_worry_too_much_00b394: "如果你觉得技能加错了，不要太担心。"
  npc_override_izlude_HelpMeShorty_don_t_worry_too_much_64a871: "如果你觉得状态加错了，不要太担心。"
  npc_override_izlude_HelpMeShorty_done_e9b450: "完成"
  npc_override_izlude_HelpMeShorty_dorams_lot_magical_talen_a70439: "Doram拥有许多魔法天赋，所以如果你去^0000cdMalangdo^000000，你会玩得很开心的。"
  npc_override_izlude_HelpMeShorty_drag_skill_icon_item_the_0037fe: "将技能图标或物品拖拽到那里。如果松开后，你只需按下^0000cd快捷键^000000就可以快速轻松地使用技能和图标。真的很方便。"
  npc_override_izlude_HelpMeShorty_dungeon_guide_22bc62: "地下城指南"
  npc_override_izlude_HelpMeShorty_emotion_list_6855f1: "表情列表"
  npc_override_izlude_HelpMeShorty_enchant_0be60e: "附魔"
  npc_override_izlude_HelpMeShorty_enough_c635b3: "这就够了吗？"
  npc_override_izlude_HelpMeShorty_enough_ebe125: "够了"
  npc_override_izlude_HelpMeShorty_equip_unequip_equipment_405a28: "<装备和卸下装备> - 点击左上角的^0000cd主菜单中的装备图标^000000。"
  npc_override_izlude_HelpMeShorty_equipment_obtained_speci_217030: "从特定地下城或特定区域获得的装备只能在该区域进行^0000cd附魔^000000。"
  npc_override_izlude_HelpMeShorty_errands_why_ed5930: "跑腿？为什么？"
  npc_override_izlude_HelpMeShorty_family_4efb6c: "家庭"
  npc_override_izlude_HelpMeShorty_family_division_prontera_2dc956: "Prontera区公所的家庭科说你可以购买婚礼所需的物品或咨询家庭相关事宜，所以如果你需要的话，去看看吧。"
  npc_override_izlude_HelpMeShorty_far_star_continent_a5d453: "远星大陆"
  npc_override_izlude_HelpMeShorty_far_star_continent_port_ea02f5: "在远星大陆，港口城市^0000cdLasagna^000000是最有名的。我也想去那里。"
  npc_override_izlude_HelpMeShorty_field_hunting_guide_015c18: "野外狩猎指南"
  npc_override_izlude_HelpMeShorty_find_navi_inn_info_payon_c482af: "在Payon找到<NAVI>[旅馆]<INFO>payon_in01,193,23,0,101,0</INFO></NAVI>。"
  npc_override_izlude_HelpMeShorty_first_person_you_meet_sh_f3c1c8: "你遇到的第一个人应该称之为主人。"
  npc_override_izlude_HelpMeShorty_geffen_e008d5: "吉芬"
  npc_override_izlude_HelpMeShorty_general_quest_f54ce5: "一般任务"
  npc_override_izlude_HelpMeShorty_get_here_take_boat_malan_cc1b05: "要到这里，从Malangdo或Izlude乘船。你还记得我们在哪里下船的吗？"
  npc_override_izlude_HelpMeShorty_go_master_4b3c1a: "走吧！主人！！"
  npc_override_izlude_HelpMeShorty_go_navi_morroc_paradise_c5ffcb: "前往<NAVI>[Morroc Paradise]<INFO>morocc,206,285,0,101,0</INFO></NAVI>。"
  npc_override_izlude_HelpMeShorty_go_register_lime_ivenor_7083c5: "^0000cd先去Lime Ivenor那里登记^000000，然后跟两边的Boyana Ur和Paradise后勤人员谈话。"
  npc_override_izlude_HelpMeShorty_go_register_lime_ivenor_820aa6: "先去Lime Ivenor那里登记，然后查看旁边的公告板。"
  npc_override_izlude_HelpMeShorty_good_job_if_you_need_31a546: "干得好。如果以后你需要我的帮助，可以这样叫我。"
  npc_override_izlude_HelpMeShorty_good_luck_future_568387: "祝未来好运！"
  npc_override_izlude_HelpMeShorty_guilds_clans_11ee2e: "公会与氏族"
  npc_override_izlude_HelpMeShorty_he_said_if_you_don_a5f67c: "他说如果你在学院得到的帽子或衣服不需要了，可以在^0000cd各职业的转职办公室里的售货机^000000兑换有用的东西。"
  npc_override_izlude_HelpMeShorty_hey_where_you_coming_we_6690f4: "嘿！你从哪里来？我们来看Salty的，为什么你把Salty送走了~"
  npc_override_izlude_HelpMeShorty_hm_alright_master_let_s_8b192e: "嗯..好吧。主人，我们也走吧。去Coco的巢穴。"
  npc_override_izlude_HelpMeShorty_how_i_get_there_bc596f: "我怎么去那里？"
  npc_override_izlude_HelpMeShorty_how_simple_right_you_als_f8bc68: "怎么样？很简单吧？你也可以按住鼠标右键并旋转来移动视角。"
  npc_override_izlude_HelpMeShorty_how_you_help_me_26cf4c: "你能怎么帮我？"
  npc_override_izlude_HelpMeShorty_however_all_equipment_en_1a8d3e: "但是，并非所有装备都能附魔，所以你应该仔细检查条件。"
  npc_override_izlude_HelpMeShorty_huh_uh_huh_shorty_ca61b1: "嗯？嗯嗯？？？Shorty！！！！！！"
  npc_override_izlude_HelpMeShorty_hunting_field_informatio_65b26c: "狩猎场信息"
  npc_override_izlude_HelpMeShorty_i_came_find_salty_i_0891b6: "我来找Salty..我来了，但这里没有Salty。"
  npc_override_izlude_HelpMeShorty_i_didn_t_force_anyone_d22fe1: "我没有强迫任何人来，我拉着Zug的头把他滚过来的。所以我把他送出去了。"
  npc_override_izlude_HelpMeShorty_i_don_t_know_how_879077: "我不知道你怎么样，但我很享受我们在一起的时光。"
  npc_override_izlude_HelpMeShorty_i_don_t_like_set_0fd109: "我不喜欢固定路线。"
  npc_override_izlude_HelpMeShorty_i_don_t_want_go_a36474: "我不想一起走。"
  npc_override_izlude_HelpMeShorty_i_fit_your_bag_what_0e252a: "我可以装进你的包里。你这么惊讶干什么？不会很久的。我很快就走。"
  npc_override_izlude_HelpMeShorty_i_heard_taekwon_you_shou_cc6416: "我听说跆拳道主要应该提升Str、Agi和Dex。更多信息，"
  npc_override_izlude_HelpMeShorty_i_heard_there_quite_few_223a10: "我听说有不少地下城即使是像你这样的年轻冒险者也能去。"
  npc_override_izlude_HelpMeShorty_i_heard_there_winter_hun_6f65e8: "我听说王宫将举办由王室主办的冬季狩猎大赛！我想参加狩猎大赛！我想参加！打怪物！！！我们去Prontera！！！！"
  npc_override_izlude_HelpMeShorty_i_heard_there_winter_hun_741d42: "我听说王宫将举办由王室主办的冬季狩猎大赛！我想参加狩猎大赛！我想参加！打怪物！！！我们去Prontera！！！！"
  npc_override_izlude_HelpMeShorty_i_learned_over_shoulder_d88a23: "但这是我偷偷学的，一旦使用，我的灵魂就会疲劳，所以不能无限提供。虽然我需要半小时来恢复自己。"
  npc_override_izlude_HelpMeShorty_i_ll_definitely_take_you_f9dcfb: "我一定会带你去的，好吗？"
  npc_override_izlude_HelpMeShorty_i_ll_give_you_thanks_1cc74f: "这个给你。谢谢你照顾Shorty！Shorty，我们走吧！"
  npc_override_izlude_HelpMeShorty_i_ll_provide_you_various_2651f9: "而且我会为你提供各种好的^0000cd服务^000000来帮助你狩猎。"
  npc_override_izlude_HelpMeShorty_i_ll_tell_you_later_acc6fa: "我稍后会告诉你。我现在想休息一下。"
  npc_override_izlude_HelpMeShorty_i_m_bored_i_sent_8b9c1e: "我好无聊。我让她去拿些果冻和橡果。"
  npc_override_izlude_HelpMeShorty_i_m_curious_about_skills_2d736b: "我对技能很好奇。"
  npc_override_izlude_HelpMeShorty_i_m_curious_about_status_31e1a6: "我对状态很好奇。"
  npc_override_izlude_HelpMeShorty_i_m_curious_about_what_5fe133: "我对你在说什么很好奇。"
  npc_override_izlude_HelpMeShorty_i_m_interested_anymore_4ce408: "我不再感兴趣了。"
  npc_override_izlude_HelpMeShorty_i_m_interested_f045f4: "我没兴趣"
  npc_override_izlude_HelpMeShorty_i_miss_salty_let_s_d6bd88: "我想Salty了。我们去看Salty吧。"
  npc_override_izlude_HelpMeShorty_i_need_pick_some_acorn_74f7fb: "我今天需要去捡些橡果和果冻。"
  npc_override_izlude_HelpMeShorty_i_say_thank_you_looks_7c37fe: "我必须说声谢谢。看起来你一直把Shorty装在那个小包里。"
  npc_override_izlude_HelpMeShorty_i_think_i_saw_one_5477d1: "我想我在Izlude入口附近看到一个^0000cd<思考弓箭手>^000000老师，但他看起来心事重重。你为什么不去问问发生了什么事？走吧，走吧~"
  npc_override_izlude_HelpMeShorty_i_use_function_register_cb65c0: "我用这个功能来注册经常使用的命令。"
  npc_override_izlude_HelpMeShorty_i_want_go_shopping_today_a3525a: "我今天也想去购物。"
  npc_override_izlude_HelpMeShorty_i_want_help_people_aroun_4a1b83: "我想帮助身边的人。"
  npc_override_izlude_HelpMeShorty_i_went_payon_came_here_349491: "我去了Payon，因为做 Muk 的奶奶说你来了这里，所以我来了。"
  npc_override_izlude_HelpMeShorty_i_wonder_where_fa280a: "我想知道在哪里.."
  npc_override_izlude_HelpMeShorty_if_joining_guild_burdens_67753d: "如果加入公会让你觉得有负担，那么^0000cd家族^000000可能更适合。虽然可能没有公会那么亲近，但家族也有各种好处。"
  npc_override_izlude_HelpMeShorty_if_master_becomes_mercha_ebf5f9: "如果主人成为商人，你可以拉一辆推车，可以在每个城镇的Kafra员工那里借用。"
  npc_override_izlude_HelpMeShorty_if_there_quest_you_want_b2b8a1: "如果任务列表中有你不想看到的任务，将鼠标指针悬停在标题上并单击鼠标右键，可以将其发送到待处理标签页。"
  npc_override_izlude_HelpMeShorty_if_you_any_questions_go_ce7ecb: "如果你有任何问题，去Paradise办公室。"
  npc_override_izlude_HelpMeShorty_if_you_check_item_view_d59389: "如果你检查物品^0000cd<查看技能说明>在右上角^000000，当你将鼠标悬停在技能图标上时，可以查看技能说明。"
  npc_override_izlude_HelpMeShorty_if_you_choose_accompany_78898a: "^EE0000如果你选择陪伴Shorty，^0000cd<帮帮我Shorty>^EE0000物品将自动放入你的背包中。^"
  npc_override_izlude_HelpMeShorty_if_you_click_circle_left_324119: "如果你点击底部聊天窗口左侧的圆圈，可以指定聊天对象，你可以只向队伍成员发送消息，这很有用。"
  npc_override_izlude_HelpMeShorty_if_you_curious_go_cash_5682f6: "如果你好奇，去每个城镇的^0000cd<现金销售指南>^000000。他们会给你指引。"
  npc_override_izlude_HelpMeShorty_if_you_don_t_like_c40595: "如果你不喜欢我在包里，就把我带到^0000cdSalty^000000那里。那是我的目的地，到时候我会离开^0000cd你的包^000000。"
  npc_override_izlude_HelpMeShorty_if_you_drag_drop_items_c9c276: "如果你将不常用或不应卖给NPC的物品拖拽放入^0000cd<个人标签页>，然后按下底部的交易锁定按钮^000000，你就不会意外出售这些物品。"
  npc_override_izlude_HelpMeShorty_if_you_fight_me_3abaf8: "如果你为我战斗。"
  npc_override_izlude_HelpMeShorty_if_you_interested_changi_70e8d9: "如果你对转职或超越不感兴趣……"
  npc_override_izlude_HelpMeShorty_if_you_interested_gettin_a3edaf: "如果你对结婚感兴趣，去Prontera教堂或Lasagna婚礼大厅。结婚前你需要准备一些物品。Prontera教堂只允许人类结婚。"
  npc_override_izlude_HelpMeShorty_if_you_press_town_you_ae7a28: "如果你按下你想去的城镇，导航菜单就会出现。按下^0000cd底部的<引导至目标>按钮^000000并退出地图即可获得引导。"
  npc_override_izlude_HelpMeShorty_if_you_re_hurry_you_5ae70f: "如果你很着急，你可以帮忙。你可以找到"
  npc_override_izlude_HelpMeShorty_if_you_re_interested_tra_1284d6: "如果你对超越不感兴趣，你可以只转职。但他说考虑到未来，还是超越比较好。"
  npc_override_izlude_HelpMeShorty_if_you_take_me_i_1f4eb0: "如果你带上我，^0000cd我也会帮忙的^000000。我真的会在很多方面帮助你！我会教你^0000cd很多东西^000000！！"
  npc_override_izlude_HelpMeShorty_if_you_use_help_me_ec7545: "如果你使用背包中的<帮帮我Shorty>物品，你可以召唤Shorty并从它那里获得^EE0000帮助和建议^0000cd。^EE0000"
  npc_override_izlude_HelpMeShorty_if_you_want_chat_small_f0de00: "如果你想与既不是队伍成员也不是公会成员的少数人聊天，你可以打开一个聊天窗口。"
  npc_override_izlude_HelpMeShorty_if_you_want_feel_atmosph_50fe5c: "如果你想感受异国的氛围，你应该去那个^0000cd当地地区^000000。^0000cd如果你去Alberta的码头^000000，你可以遇到送人们去各个当地地区的水手。"
  npc_override_izlude_HelpMeShorty_if_you_want_know_when_cf4fa1: "如果你想知道什么时候能再次获得，用ALT+U打开任务窗口并查看底部显示的时间。"
  npc_override_izlude_HelpMeShorty_if_you_want_make_your_1dd37a: "如果你想让你的装备更强或赋予它特殊能力，为什么不尝试^0000cd附魔^000000呢？"
  npc_override_izlude_HelpMeShorty_if_you_want_succeed_find_d9d003: "如果你想成功，找一个叫"
  npc_override_izlude_HelpMeShorty_if_your_job_level_you_2bdff0: "^0000cd如果你的职业等级达到40，就可以转职为二转职业^000000，但建议在达到50级时转职。"
  npc_override_izlude_HelpMeShorty_illusion_dungeon_db43b2: "^0000cd幻象地下城^000000"
  npc_override_izlude_HelpMeShorty_information_guide_7bcf08: "信息指南"
  npc_override_izlude_HelpMeShorty_last_letter_salty_said_p_ffb5e4: "Salty的最后一封信说她在^0000cdPayon的旅馆^000000。"
  npc_override_izlude_HelpMeShorty_let_s_go_b9a2ff: "我们走吧"
  npc_override_izlude_HelpMeShorty_let_s_go_our_separate_f184ba: "我们各走各的吧。"
  npc_override_izlude_HelpMeShorty_let_s_go_together_until_45db6e: "在那之前我们一起走吧。"
  npc_override_izlude_HelpMeShorty_let_s_help_each_other_81275d: "让我们再多互相帮助一点。好吗？"
  npc_override_izlude_HelpMeShorty_let_s_leave_after_checki_fd335c: "我们先看看在哪里狩猎过再走。也许还有怪物卡片剩下。"
  npc_override_izlude_HelpMeShorty_let_s_see_master_ffd54a: "让我想想，主人……"
  npc_override_izlude_HelpMeShorty_local_area_560245: "本地地区"
  npc_override_izlude_HelpMeShorty_location_information_11d539: "位置信息"
  npc_override_izlude_HelpMeShorty_lot_experienced_adventur_7fd344: "很多有经验的冒险者通常都会去，但据说有一些低级的地方可以通过少量训练到达。要么是Orc村，要么是Rachel……"
  npc_override_izlude_HelpMeShorty_lot_life_information_con_0af9e3: "这里包含了很多人生的信息。每当无聊的时候，我就会读这些。"
  npc_override_izlude_HelpMeShorty_malangdo_ab97db: "马兰岛"
  npc_override_izlude_HelpMeShorty_malangdo_item_mall_seyab_817aa6: "^0000cd<Malangdo>、<道具商城>^000000，或者在主要城镇找到的^0000cd<Seyablem>和<Leyablem>^000000主要做这个。"
  npc_override_izlude_HelpMeShorty_many_people_thought_ther_8aee82: "很多人以为这片土地上只有Midgard大陆，但有一天，^0000cd猫^000000形态的人出现了。没有人知道他们从哪里来。"
  npc_override_izlude_HelpMeShorty_master_currently_skill_p_bc0d6c: "主人目前有{0}个技能点{1}。"
  npc_override_izlude_HelpMeShorty_master_did_you_know_besi_195bb1: "主人，你知道吗，除了我们所知的Midgard大陆，你还可以乘船前往新的神秘地方？主要是Al……Al……Allegro？"
  npc_override_izlude_HelpMeShorty_master_doesn_t_want_succ_3d269d: "主人不想成功吗？Salty说她因为想成功所以在努力训练。"
  npc_override_izlude_HelpMeShorty_master_even_if_lot_time_7d83bf: "主人，即使过了很长时间，也不要忘记我，要成为在这片大陆上成名伟大的冒险者！"
  npc_override_izlude_HelpMeShorty_master_f89f31: "主人？"
  npc_override_izlude_HelpMeShorty_master_hasn_t_even_been_d68c90: "主人，还没过30分钟呢。我还在努力。如果你起来的话，我会给你更多力量，请等一下。"
  npc_override_izlude_HelpMeShorty_master_i_ll_give_you_51d61d: "主人，我会给你之前答应的帮助。增加敏捷和祝福。"
  npc_override_izlude_HelpMeShorty_master_i_ll_tell_you_626d0f: "主人，我会告诉你基础知识，但 literally 只是基础知识。"
  npc_override_izlude_HelpMeShorty_master_know_about_skill_674cc9: "主人知道技能树吗？如果主人将鼠标悬停在想学的技能上，会出现需要先学的技能和技能等级。"
  npc_override_izlude_HelpMeShorty_master_ready_i_really_wa_ac9d6b: "主人准备好了吗？我真的好想去！"
  npc_override_izlude_HelpMeShorty_master_sometimes_when_yo_fff13c: "主人，有时你想从街头小贩那里买东西时，可能会想知道他们现在是否在卖，是谁在卖。"
  npc_override_izlude_HelpMeShorty_master_thank_you_so_much_1117d4: "主人，非常感谢你。"
  npc_override_izlude_HelpMeShorty_master_what_you_re_sayin_1ae0a7: "主人，你在说什么？总之，地下水道、Payon洞穴、蚂蚁地下城和沉船。你不想成为地下城的统治者吗，主人？"
  npc_override_izlude_HelpMeShorty_master_you_bored_then_yo_63b290: "主人，你无聊吗？那你可以和周围的人聊天。"
  npc_override_izlude_HelpMeShorty_master_you_ever_pressed_da9c46: "主人，你按过^0000cdF12键^000000吗？周围会出现白色的小方块。"
  npc_override_izlude_HelpMeShorty_master_you_know_conversa_220b8b: "主人，你知道吗，对话不仅仅是语言？适当使用表情会让对话更丰富。"
  npc_override_izlude_HelpMeShorty_master_you_should_save_y_717087: "主人，你应该爱惜身体，因为你只有一条命。"
  npc_override_izlude_HelpMeShorty_memorial_dungeon_2e3e4e: "^0000cd纪念地下城^000000"
  npc_override_izlude_HelpMeShorty_menu_click_c841bc: "点击<NAVI>[Morroc: Paradise Space Traveler]<INFO>morocc,161,97,0,101,0</INFO></NAVI>来找到它。"
  npc_override_izlude_HelpMeShorty_menu_go_2f08b5: "前往<NAVI>[依斯鲁得岛: The Hypnotist]<INFO>izlude,127,175,0,101,0</INFO></NAVI>获取指引。"
  npc_override_izlude_HelpMeShorty_menu_please_e776a2: "请访问<NAVI>[斐扬: Ahri]<INFO>payon,245,295,0,101,0</INFO></NAVI>。"
  npc_override_izlude_HelpMeShorty_menu_refer_8eb28b: "参考<URL>[公会指南]<INFO>http://ro.gnjoy.com/guide/systeminfo/systemGuild1.asp,1024,768</INFO></URL>"
  npc_override_izlude_HelpMeShorty_menu_refer_905765: "参考<URL>[指南]<INFO>http://ro.gnjoy.com/guide/systeminfo/,1024,768</INFO></URL>获取基础信息。"
  npc_override_izlude_HelpMeShorty_menu_shortcut_12015d: "快捷键:^0000cdAlt+A^000000"
  npc_override_izlude_HelpMeShorty_menu_shortcut_1c6f63: "快捷键:^0000cdAlt+U^000000"
  npc_override_izlude_HelpMeShorty_menu_shortcut_300ae9: "快捷键:^0000cdAlt+S^000000"
  npc_override_izlude_HelpMeShorty_menu_shortcut_b3603a: "快捷键:^0000cdAlt+Q^000000"
  npc_override_izlude_HelpMeShorty_menu_url_a78915: "更多详情请查看<URL>[家庭]<INFO>http://ro.gnjoy.com/guide/systeminfo/systemLovers1.asp,1024,768</INFO></URL>。"
  npc_override_izlude_HelpMeShorty_menu_url_d1a811: "<URL>[Rune Midgarts图书馆]<INFO>http://ro.gnjoy.com/guide/runemidgarts/,1024,768</INFO></URL>"
  npc_override_izlude_HelpMeShorty_menu_url_deaff6: "<URL>[Rune Midgarts图书馆]<INFO>http://ro.gnjoy.com/guide/runemidgarts/questlist.asp,1024,768</INFO></URL>"
  npc_override_izlude_HelpMeShorty_midgard_continent_80e6c6: "Midgard大陆"
  npc_override_izlude_HelpMeShorty_midgard_continent_said_g_10142e: "^0000cdMidgard大陆^000000据说是Arunafelts、Schwaldzwald和Rune-Midgarts三个王国影响力最大的大陆。每个大陆都有飞艇可以使用。"
  npc_override_izlude_HelpMeShorty_monthly_event_17dd1d: "每月活动"
  npc_override_izlude_HelpMeShorty_more_information_82e0be: "更多信息"
  npc_override_izlude_HelpMeShorty_more_information_quests_def1ba: "更多任务信息"
  npc_override_izlude_HelpMeShorty_morroc_c8f207: "梦罗克"
  npc_override_izlude_HelpMeShorty_morroc_where_paradise_so_319d7e: "Morroc是Paradise所在的地方，所以在附近走走应该没问题吧？"
  npc_override_izlude_HelpMeShorty_move_attack_051b94: "移动和攻击"
  npc_override_izlude_HelpMeShorty_move_click_place_you_wan_1a6129: "^0000cd<移动>^000000 - 用鼠标点击你想去的地方^0000cd来移动^000000。"
  npc_override_izlude_HelpMeShorty_msg_93fcbf: "……"
  npc_override_izlude_HelpMeShorty_my_name_10a387: "我的名字是{0}。"
  npc_override_izlude_HelpMeShorty_my_name_shorty_271592: "我的名字是Shorty！！"
  npc_override_izlude_HelpMeShorty_navi_coco_s_nest_info_f54486: "在Prontera西南偏南的<NAVI>[Coco的巢穴]<INFO>prt_fild10,318,191,0,101,0</INFO></NAVI>。你可以从Coco那里得到很多橡果。"
  npc_override_izlude_HelpMeShorty_navi_metheus_sylph_info_16c9f5: "<NAVI>[Metheus Sylph]<INFO>yuno_in02,88,164,0,101,0</INFO></NAVI>^0000cd在Yuno的贤者学院^000000，他会给你指引。"
  npc_override_izlude_HelpMeShorty_nice_go_around_towns_fie_4e9553: "去城镇和野外寻找并帮助有需要的人会很好。那些需要帮助的人头上会有<!>标记，更容易找到。"
  npc_override_izlude_HelpMeShorty_nightmare_dungeon_62555d: "^0000cd噩梦地下城^000000"
  npc_override_izlude_HelpMeShorty_no_one_knows_what_kind_c5b62f: "没有人知道这些地下城是什么样的。我猜就像是梦境或幻象一样。这里有一种特殊的石头，据说大家都以这块石头为目标而战斗。据说这块石头可以兑换强力武器。"
  npc_override_izlude_HelpMeShorty_no_s_b4ac4b: "不，不是那样的……"
  npc_override_izlude_HelpMeShorty_no_s_originally_i_bought_15fa82: "不，不是……本来我在Paros买来纪念你的，但现在想想，你不是企鹅，所以我就一直留着。不可爱吗？"
  npc_override_izlude_HelpMeShorty_now_76c5ab: "现在……"
  npc_override_izlude_HelpMeShorty_now_did_you_get_idea_209534: "现在你明白了吗？"
  npc_override_izlude_HelpMeShorty_now_master_shorty_galapa_0594a4: "不是现在，主人。这只来自Galapagos的Shorty知道感恩。当你能脱下新手T恤独自开始冒险时，Shorty才会离开。"
  npc_override_izlude_HelpMeShorty_oh_besides_smelter_each_b7352f: "哦，除了每个城镇的铁匠外，我听说^0000cd<道具商城>^000000提供更高的冶炼成功率。"
  npc_override_izlude_HelpMeShorty_oh_yeah_shorty_what_s_e00b34: "哦是吗？但是Shorty！这里发生了什么事？"
  npc_override_izlude_HelpMeShorty_okay_i_m_verge_going_526b74: "好的！我也正准备出发，但我们先在Prontera停一下，然后去Payon。我们去收拾些东西，然后环游大陆吧！"
  npc_override_izlude_HelpMeShorty_okay_then_69f05e: "那好吧。"
  npc_override_izlude_HelpMeShorty_okay_then_i_ll_look_4bc3f7: "好吗？那我四处看看然后回到包里。"
  npc_override_izlude_HelpMeShorty_okay_well_said_master_ev_24241e: "好的。说得好，主人。即使我卡在包里，我也会很快出来。"
  npc_override_izlude_HelpMeShorty_one_thing_aware_there_sa_fa7354: "有一点要注意的是，冶炼有安全精炼等级，如果超过一定等级继续精炼，装备有可能被摧毁。你必须运气好。"
  npc_override_izlude_HelpMeShorty_only_thing_i_increase_ag_ee3e76: "我唯一能做的就是^0000cd增加敏捷^000000让你移动更快，还有^0000cd祝福^000000来增加力量、敏捷和智力，但这肯定有帮助，对吧？"
  npc_override_izlude_HelpMeShorty_open_item_window_you_see_a22025: "打开物品窗口，你会看到^0000cd四个标签页^000000。看到了吗？"
  npc_override_izlude_HelpMeShorty_other_dungeon_guide_eed140: "其他地下城指南"
  npc_override_izlude_HelpMeShorty_other_than_okay_try_para_6ddd78: "除此之外，尝试一下^0000cdParadise的任务^000000也不错。你想去Paradise吗？他们说如果你去了会给你武器。"
  npc_override_izlude_HelpMeShorty_other_words_s_evolution_19a346: "换句话说，就是进化。完成超越的人说重新获得过去的职业有很多好处。"
  npc_override_izlude_HelpMeShorty_otherworld_f950f5: "异世界"
  npc_override_izlude_HelpMeShorty_our_relationship_end_her_836369: "我们的关系不会就此结束。记住你遇见了我。Salty，还有别的吗？一些值得纪念的东西。"
  npc_override_izlude_HelpMeShorty_paradise_d08e74: "天堂"
  npc_override_izlude_HelpMeShorty_paramarket_place_sells_i_784a24: "Paramarket是一个出售在市场上或街头摊位难以找到的限量限时物品的地方。这是一个做生意的好地方。"
  npc_override_izlude_HelpMeShorty_party_60b18f: "队伍"
  npc_override_izlude_HelpMeShorty_party_window_easily_open_8f4392: "队伍窗口可以通过^0000cdAlt+Z键^000000轻松打开。平均分配狩猎经验时，^0000cd队伍成员之间的等级^000000差距可以等于或小于15。"
  npc_override_izlude_HelpMeShorty_path_novice_adventurer_753aff: "新手冒险者之路！"
  npc_override_izlude_HelpMeShorty_payon_906fea: "斐扬"
  npc_override_izlude_HelpMeShorty_phew_i_m_glad_we_92ba84: "呼-太好了。我们现在是朋友了吗？"
  npc_override_izlude_HelpMeShorty_press_alt_e_see_inside_146369: "按下^0000cdALT+E^000000查看背包内部，按消耗品标签页，我就在那里。"
  npc_override_izlude_HelpMeShorty_press_alt_l_keys_view_23c70c: "按下^0000cdAlt+L键^000000来查看和使用表情列表和快捷命令。"
  npc_override_izlude_HelpMeShorty_press_alt_m_keys_registe_870bb6: "按下^0000cdAlt+M键^000000来注册经常使用的快捷命令~"
  npc_override_izlude_HelpMeShorty_press_alt_s_keys_bring_dd64f3: "按下^0000cdAlt+S键^000000打开技能列表窗口。"
  npc_override_izlude_HelpMeShorty_press_alt_y_keys_check_47d24b: "按下^0000cdAlt+Y键^000000检查命令列表并打开/关闭。"
  npc_override_izlude_HelpMeShorty_press_ctrl_keys_open_map_adad13: "按下^0000cdCtrl+`键^000000打开地图。"
  npc_override_izlude_HelpMeShorty_press_f_key_register_con_824ed6: "按下^0000cdF12键^000000，通过将消耗品、技能和装备拖拽到快捷窗口来注册。"
  npc_override_izlude_HelpMeShorty_pressing_ctrl_open_map_3c66e3: "按下^0000cdCtrl+`^000000会打开地图。"
  npc_override_izlude_HelpMeShorty_prontera_2d98d8: "普隆德拉"
  npc_override_izlude_HelpMeShorty_quest_information_bbfe11: "任务信息"
  npc_override_izlude_HelpMeShorty_rune_midgarts_kingdom_ru_d5d802: "^0000cdRune-Midgarts^000000。一个由七个王室统治的王国，魔法的力量盛行。"
  npc_override_izlude_HelpMeShorty_s_easy_name_say_you_e5a15b: "这是个容易说的名字。你有包吗？就是你腰上挂的那个。对我来说大小正好合适。"
  npc_override_izlude_HelpMeShorty_s_right_i_t_even_685761: "没错。我连所有的摊位都看不过来。"
  npc_override_izlude_HelpMeShorty_s_skill_tree_however_ski_43a2e3: "那就是技能树。但是，学习技能时消耗的技能点是有限的，所以你不能学会所有技能。"
  npc_override_izlude_HelpMeShorty_said_dungeon_much_more_d_f02eae: "据说这是一个比普通地下城更具挑战性的地下城。连怪物都不是我们所知道的那种。当你找到地下城时，如果有可疑的人告诉你他会送你去更困难的地方，试试看。"
  npc_override_izlude_HelpMeShorty_said_located_villages_ge_8237a6: "据说位于村庄和普通野外，有很多叫做次元裂缝的地方。"
  npc_override_izlude_HelpMeShorty_salty_ah_you_re_talking_988e91: "Salty？啊，你说的是住在房间里的那个女人。我让她去跑腿了。"
  npc_override_izlude_HelpMeShorty_salty_also_used_very_wel_1d86c9: "Salty也用得很好。如果可以的话我想要蛤蜊。"
  npc_override_izlude_HelpMeShorty_salty_salty_i_m_here_99b65e: "Salty！Salty~我在这里~你等了吗？等了很长时间吗？"
  npc_override_izlude_HelpMeShorty_salty_salty_my_friend_i_1992df: "Salty！Salty是我的朋友。我来见Salty的。所以你必须带我去见Salty。"
  npc_override_izlude_HelpMeShorty_salty_salty_salty_where_70828a: "Salty，Salty？Salty？你去哪里了Salty？"
  npc_override_izlude_HelpMeShorty_save_me_hug_me_quickly_b52a90: "救救我！快抱抱我！救救我！"
  npc_override_izlude_HelpMeShorty_schwaldzwald_republic_as_5bd3c0: "^0000cdSchwaldzwald^000000共和国。顾名思义，有一位总统。首都Yuno漂浮在空中，所以值得一看。一定很壮观。"
  npc_override_izlude_HelpMeShorty_see_also_f7fac5: "参见"
  npc_override_izlude_HelpMeShorty_shortcut_guide_ec6860: "快捷键指南"
  npc_override_izlude_HelpMeShorty_shortcut_key_list_regist_c42615: "快捷键列表与注册"
  npc_override_izlude_HelpMeShorty_shorty_why_you_here_one_4b25f3: "Shorty，你怎么在这里？有一天我收到一封信说你离开了！！！"
  npc_override_izlude_HelpMeShorty_skills_items_shortcut_wi_4fab3f: "技能与物品快捷键窗口"
  npc_override_izlude_HelpMeShorty_smelt_7f5f8c: "冶炼"
  npc_override_izlude_HelpMeShorty_smelting_requires_specia_821c00: "冶炼需要特殊的物品和Zeny。这取决于装备的类型和等级。"
  npc_override_izlude_HelpMeShorty_so_what_basic_info_you_650e3c: "那么，你想知道什么基本信息？"
  npc_override_izlude_HelpMeShorty_sometimes_some_dungeons_164227: "有时，有些地下城只能通过特殊任务进入，所以你也需要收集信息，好吗？"
  npc_override_izlude_HelpMeShorty_sometimes_you_get_close_c18754: "有时你必须靠近才能与某人交谈。"
  npc_override_izlude_HelpMeShorty_sometimes_you_like_your_c9e232: "有时你想和朋友在一起，如果他们战斗在地下城，一起享受冒险，或者有时只是坐着聊天。"
  npc_override_izlude_HelpMeShorty_sometimes_you_want_belon_a9c3a1: "有时你会想归属于某个地方，感受与某人的羁绊。在这种情况下，你只需要加入一个^0000cd公会或家族^000000。"
  npc_override_izlude_HelpMeShorty_stay_healthy_i_bid_you_5912fa: "保持健康，祝你顺利。我希望主人不要忘记Galapago曾经存在过。"
  npc_override_izlude_HelpMeShorty_store_trade_click_mercha_59a7e3: "<商店交易> - 点击商人NPC^0000cd进行交易^000000。"
  npc_override_izlude_HelpMeShorty_system_information_5131fe: "系统信息"
  npc_override_izlude_HelpMeShorty_take_me_you_take_respons_6a025a: "带上我！你要对和我眼神接触这件事负责！"
  npc_override_izlude_HelpMeShorty_talk_npc_24e9f1: "与 NPC 对话"
  npc_override_izlude_HelpMeShorty_talk_paramarket_windman_393ea1: "和^0000cdParadise Corridor^000000里的Paramarket Windman谈话，他会送你去那里。"
  npc_override_izlude_HelpMeShorty_then_check_monster_tab_u_490865: "然后检查右上角的^0000cd怪物标签页或按Tab键^000000来显示地下城的等级。"
  npc_override_izlude_HelpMeShorty_then_i_wait_here_0984ec: "那我可以在这里等吗？"
  npc_override_izlude_HelpMeShorty_then_you_won_t_take_652912: "那你不带我去找^0000cdSalty^000000吗？Salty会感谢你把带我到那里的。Salty知道感恩，我也会感谢你的。"
  npc_override_izlude_HelpMeShorty_there_anything_you_didn_cef653: "有什么你不喜欢的吗？我在包里不够安静吗？哦，你不喜欢那个，是的……那我无能为力了。"
  npc_override_izlude_HelpMeShorty_there_lighthalzen_where_21a120: "还有Lighthalzen，Rekenberg总部所在地，有采矿城镇Einbroch，Einbech矿场，还有乡村村庄Hugel。"
  npc_override_izlude_HelpMeShorty_there_lot_memorial_dunge_96be2a: "有很多纪念地下城、噩梦地下城、幻象地下城……等等。"
  npc_override_izlude_HelpMeShorty_there_many_quests_waitin_94e0fd: "有很多任务在等着主人。此外，他们还为初学者提供装备。"
  npc_override_izlude_HelpMeShorty_there_many_statuses_abov_60ba27: "有很多状态，最重要的是，如果你有二转职业，你可以将^0000cd职业等级提升到70^000000。你将能够使用更多技能。"
  npc_override_izlude_HelpMeShorty_there_no_place_i_want_a35acf: "没有我想去的地方。"
  npc_override_izlude_HelpMeShorty_there_number_circumstanc_39fcbe: "有很多情况。这种情况会由我这里的主人来解释。"
  npc_override_izlude_HelpMeShorty_there_other_utan_village_90833f: "还有其他的Utan村庄，比如Umbala，或者死者的国度Niflheim。那是一个我一直想去的地方！"
  npc_override_izlude_HelpMeShorty_there_total_skill_points_fdb803: "在主人转职为高阶职业之前，总共有49个技能点可用于学习。这种情况称为停滞。"
  npc_override_izlude_HelpMeShorty_these_people_called_dora_65e748: "这些被称为Doram的人来自遥远的海外，^0000cd远星大陆^000000。他们说这条路是最近才为他们开通的。"
  npc_override_izlude_HelpMeShorty_they_say_you_gain_specia_4146f0: "据说你可以获得特殊的婚姻技能来作为家庭使用。"
  npc_override_izlude_HelpMeShorty_time_even_if_you_hold_4d1b2a: "那时候，即使你抱着我哭，我也会离开你。在此之前，你必须将等级提升到约^0000cd31级^000000。到那时，让我们在未来继续努力。"
  npc_override_izlude_HelpMeShorty_tip_day_81d5b4: "今日提示"
  npc_override_izlude_HelpMeShorty_trade_b0811e: "交易"
  npc_override_izlude_HelpMeShorty_tradition_being_born_aga_02b97f: "传统就是^0000cd在Valhalla重生并回到Novice^000000。但不是普通的Novice，而是称为高阶Novice。"
  npc_override_izlude_HelpMeShorty_try_using_220b1e: "尝试使用"
  npc_override_izlude_HelpMeShorty_turns_out_while_sailing_c8977d: "原来，在一个叫做远星大陆的遥远地方航行时，他们遇到了暴风雨，坠落到了一个叫Malangdo的地方。从字面上说，船是从天上掉下来的。"
  npc_override_izlude_HelpMeShorty_type_h_chat_window_81cf22: "在聊天窗口输入^0000cd/h^000000。"
  npc_override_izlude_HelpMeShorty_type_tip_chat_window_55134d: "在聊天窗口输入^0000cd/tip^000000。"
  npc_override_izlude_HelpMeShorty_uh_huh_something_like_b8a2b8: "嗯嗯，就是那样。"
  npc_override_izlude_HelpMeShorty_uh_i_know_here_if_be6767: "嗯，我知道，在这里。如果你穿过Morroc东部或与Paradise的Agent Catson谈话，他们会送你去那里。"
  npc_override_izlude_HelpMeShorty_unequip_equipment_9ce53e: "卸下装备"
  npc_override_izlude_HelpMeShorty_user_transaction_right_c_ff3989: "<用户交易> - 右键点击你想交易的玩家并选择^0000cd交易^000000。"
  npc_override_izlude_HelpMeShorty_usually_you_equip_disarm_fb947e: "通常，你可以在背包或装备窗口中通过双击鼠标左键来装备和卸下装备。"
  npc_override_izlude_HelpMeShorty_valuable_tip_salty_taugh_009385: "这是Salty教我的宝贵技巧~你有怪物卡片吗？"
  npc_override_izlude_HelpMeShorty_way_what_s_those_eyes_5ed6f3: "对了，那是什么眼神……？你怕我吗？我这么做是为了引人注目，等一下……"
  npc_override_izlude_HelpMeShorty_we_met_izlude_rune_midga_2839be: "我们在Rune-Midgarts王国的Izlude相遇的。记得吗？还有Payon的Salty，以及我离开时所在的Paros。它们都在Rune-Midgarts。"
  npc_override_izlude_HelpMeShorty_well_let_s_go_together_4ec788: "那，我们一起走吧。"
  npc_override_izlude_HelpMeShorty_well_then_let_s_go_333102: "那，我们走吧！！！"
  npc_override_izlude_HelpMeShorty_well_then_let_s_go_6e3230: "那，我们走吧！"
  npc_override_izlude_HelpMeShorty_well_then_master_goodbye_e5d867: "那，主人，再见。再见！"
  npc_override_izlude_HelpMeShorty_what_information_you_cur_cd90c7: "你对什么信息感到好奇？"
  npc_override_izlude_HelpMeShorty_what_master_what_let_s_d2caaa: "什么……？主人……？什么？分手？在这里？现在？你是认真的吗？"
  npc_override_izlude_HelpMeShorty_what_quest_you_curious_a_6fbceb: "你对什么任务感到好奇？"
  npc_override_izlude_HelpMeShorty_what_where_46717d: "是什么？在哪里？"
  npc_override_izlude_HelpMeShorty_what_you_curious_about_00a14d: "你对什么感到好奇？"
  npc_override_izlude_HelpMeShorty_what_you_curious_about_s_0930a3: "你对状态和技能有什么好奇的？"
  npc_override_izlude_HelpMeShorty_what_you_kidnapped_our_s_1e7425: "什么？你绑架了我们的Shorty？？"
  npc_override_izlude_HelpMeShorty_what_you_like_learn_abou_fa7ffe: "主人想学什么？"
  npc_override_izlude_HelpMeShorty_what_your_name_21eb49: "你叫什么名字？"
  npc_override_izlude_HelpMeShorty_when_business_over_just_c5c2aa: "当事情结束后，就让我一个人待着。我会四处看看然后进包里。我很乖地跟着的。"
  npc_override_izlude_HelpMeShorty_when_master_receives_que_afe734: "当主人接到任务时，任务信息会短暂显示在屏幕右侧，所以你可以查看。"
  npc_override_izlude_HelpMeShorty_when_you_going_find_some_9d9828: "你什么时候去找那个叫Salty的人？"
  npc_override_izlude_HelpMeShorty_when_you_reach_level_hig_76ee3c: "^EE0000当你达到31级或更高时，你可以接到带Shorty离开的任务。完成这个任务会送走Shorty，同时获得奖励。^"
  npc_override_izlude_HelpMeShorty_when_you_want_call_me_ad68d5: "当你想叫我时，快速双击^0000cd<帮帮我Shorty>^000000，我会从你的包里出来帮助你。怎么样？很棒吧？"
  npc_override_izlude_HelpMeShorty_where_person_f37a1e: "那个人在哪里？"
  npc_override_izlude_HelpMeShorty_where_you_curious_1a82b2: "你对哪里感到好奇？"
  npc_override_izlude_HelpMeShorty_where_you_want_go_write_a6726f: "你想去哪里？在聊天窗口输入/place，然后按^0000cdCtrl+`键^^000000对比你当前位置和出现的地图。最近的是哪里？"
  npc_override_izlude_HelpMeShorty_where_you_want_go_write_e6c89f: "你想去哪里？在聊天窗口输入^0000cd/place^000000，然后按^0000cdCtrl+`键^000000对比你当前位置和出现的地图。"
  npc_override_izlude_HelpMeShorty_who_you_talking_about_75843b: "你在说谁？"
  npc_override_izlude_HelpMeShorty_who_you_who_you_talking_5911c5: "你是谁？谁在跟我说话？我不喜欢不认识的人跟我说话或碰我。"
  npc_override_izlude_HelpMeShorty_why_am_i_so_stupid_0bcae2: "我为什么这么笨！"
  npc_override_izlude_HelpMeShorty_why_don_t_you_meet_2e1065: "^0000cd你为什么不去Prontera西门外见Paul和Anne呢^000000？我路过的时候听说他们需要帮助。"
  npc_override_izlude_HelpMeShorty_why_don_t_you_meet_57e29b: "你为什么不去Prontera西门外见Paul和Anne呢^0000cdProntera的西门 ^000000？我路过的时候听说他们需要帮助。"
  npc_override_izlude_HelpMeShorty_why_don_t_you_try_99261f: "为什么不先试试地下水道呢？剑士公会一直在招募，但我听说对新手冒险者来说获得经验很好。"
  npc_override_izlude_HelpMeShorty_why_listen_anxious_middl_7068da: "或者为什么不听听^0000cdPayon^000000里那位焦虑的中年男子的话呢？"
  npc_override_izlude_HelpMeShorty_why_listen_anxious_middl_7b2846: "或者为什么不听听来自^0000cdPayon^000000的那位焦虑的中年男子的话呢？"
  npc_override_izlude_HelpMeShorty_why_you_here_f3f3c0: "你为什么在这里？"
  npc_override_izlude_HelpMeShorty_yeah_if_you_call_me_2a5c84: "是的！如果你叫了我却一分钟不说话，我就会回到包里。"
  npc_override_izlude_HelpMeShorty_yeah_master_adventures_w_4f022f: "是的！主人，我们一起冒险的日子很开心！"
  npc_override_izlude_HelpMeShorty_yeah_s_i_m_galapago_4492fd: "是的。就是这样。我是Galapago Shorty，我很会说话。"
  npc_override_izlude_HelpMeShorty_yes_call_me_again_if_f1e97f: "是的。如果需要再叫我。"
  npc_override_izlude_HelpMeShorty_yes_master_stone_cold_he_036a77: "是的。主人有一颗冰冷的心。那无能为力了。我认为我们的关系到此为止了。"
  npc_override_izlude_HelpMeShorty_you_able_learn_about_flo_335882: "你将能够了解这个世界的流程，知道正在发生什么重大事件。"
  npc_override_izlude_HelpMeShorty_you_been_paradise_a3fb8c: "^0000cd你去过Paradise吗^000000？"
  npc_override_izlude_HelpMeShorty_you_check_turn_off_vario_772458: "你可以检查并根据主人的选择打开/关闭各种选项。"
  npc_override_izlude_HelpMeShorty_you_didn_t_join_paradise_a1f530: "你没有加入Paradise俱乐部吗？"
  npc_override_izlude_HelpMeShorty_you_don_t_know_ohiso_e1decd: "你不知道Ohiso、Boiso、Saiso、^0000cdParamarket^000000吗？没有我主人该怎么办啊，真的？"
  npc_override_izlude_HelpMeShorty_you_enter_guild_already_dcd8a6: "你可以通过邀请加入已经成立的公会，或者你可以在办公室购买Empelium来创建公会。"
  npc_override_izlude_HelpMeShorty_you_grown_wonderfully_so_ed736e: "你成长得很好。所以现在我想见Salty。她会担心我的。"
  npc_override_izlude_HelpMeShorty_you_here_5c6e21: "你在这里吗？"
  npc_override_izlude_HelpMeShorty_you_learn_skill_consumin_81d1b8: "你可以通过消耗^0000cd<技能点>^000000来学习这个技能，每当职业等级提升时都能获得技能点。你可以在此窗口左下角查看拥有的技能点。"
  npc_override_izlude_HelpMeShorty_you_leaving_16a25d: "你要离开了吗？"
  npc_override_izlude_HelpMeShorty_you_look_excited_salty_y_dadbf5: "你看起来很兴奋，Salty。没有我你很开心吗？"
  npc_override_izlude_HelpMeShorty_you_marry_person_you_lik_a8c086: "^0000cd你可以和你喜欢的人结婚^000000，或者你可以领养一个^0000cd孩子^000000。也有可能你被另一对夫妇领养为他们的孩子。"
  npc_override_izlude_HelpMeShorty_you_meet_people_you_ve_cfa68c: "你可以遇到你从未见过的人。"
  npc_override_izlude_HelpMeShorty_you_need_more_help_me_7ba945: "你需要我更多的帮助吗？"
  npc_override_izlude_HelpMeShorty_you_refer_a7f6a6: "你可以参考"
  npc_override_izlude_HelpMeShorty_you_reset_any_time_until_f88224: "在主人转职为高阶职业之前，你可以随时重置。"
  npc_override_izlude_HelpMeShorty_you_see_box_selecting_ar_193502: "你看到左上角有一个选择区域的框了吗？选择你想查看的区域后，检查右上角的^0000cd怪物标签页^000000或按^0000cdTab键^000000，你就会看到该区域分布最多的怪物名称和等级。"
  npc_override_izlude_HelpMeShorty_you_see_box_selecting_re_2a1653: "你看到左上角有一个选择区域的框了吗？"
  npc_override_izlude_HelpMeShorty_you_see_box_where_you_d356b2: "^0000cd你看到左上角有一个可以选择区域的框吗^000000？如果你选择想查看的区域，你会看到地图上标有红框，并^0000cd写着主要地下城的名称^000000。"
  npc_override_izlude_HelpMeShorty_you_see_message_window_b_bdb1ba: "你能看到底部的消息窗口吗？你可以在那里输入消息与其他人聊天，也可以在那里发送其他类型的消息。"
  npc_override_izlude_HelpMeShorty_you_see_necessary_inform_761b2b: "你可以看到新手冒险者所需的必要信息。"
  npc_override_izlude_HelpMeShorty_you_simply_open_chat_win_3ec3e2: "你可以通过^0000cdAlt+C键^000000简单地打开聊天窗口。你也可以设置最大参与人数和密码。"
  npc_override_izlude_HelpMeShorty_you_sure_you_want_anothe_2c68d6: "你确定想和另一个人共度余生吗？那你可以开始一个^0000cd家庭^000000。"
  npc_override_izlude_HelpMeShorty_you_take_boat_izlude_if_8b29f9: "^0000cd你可以从Izlude乘船^000000。如果你以特殊方式获得了Malangdo罐头，你可以用它来旅行到那里。"
  npc_override_izlude_HelpMeShorty_you_talking_about_teache_c22025: "你在说老师吗？"
  npc_override_izlude_HelpMeShorty_you_ve_seen_people_form_105ea6: "你见过那些被称为Doram的猫形态的人来来去去。他们刚与Midgard大陆接触不久，但现在已经扎根并到处建立了自己。"
  npc_override_izlude_HelpMeShorty_you_want_go_bag_330e20: "你想进包里吗？"
  npc_override_izlude_HelpMeShorty_you_want_go_paradise_the_c9dbe3: "你想去^0000cdParadise^000000吗？他们说如果你去了Paradise，他们会给你武器。"
  npc_override_izlude_HelpMeShorty_you_want_make_equipment_3bab20: "你想让你拥有的装备更强吗？那样的话，你可以在每个城镇找到^0000cd铁匠^000000。"
  npc_override_izlude_HelpMeShorty_you_without_my_help_you_48a8dd: "没有我的帮助你能做到吗？你肯定走不出十步就会想我的。人生不就是互相帮助吗？不能这样的。"
