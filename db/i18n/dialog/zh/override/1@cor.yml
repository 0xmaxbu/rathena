Header:
  Type: I18N_DIALOG
  Version: 1
Body:
  npc_override_1@cor_CorOperation_after_summoning_monsters_50793d: "召唤怪物后，它会不断释放化学毒素，使清除怪物变得更加困难。"
  npc_override_1@cor_CorOperation_after_summoning_monsters_8c2d71: "召唤怪物后，它会召唤生物电池来强化怪物并引发爆炸。"
  npc_override_1@cor_CorOperation_after_you_ve_cleared_fou_5c744f: "清除四个陷阱后，EL1_A17T 就会出现，这位女士会把你带到和上次一样的地方。"
  npc_override_1@cor_CorOperation_alright_let_me_know_when_fd7c38: "好的，你准备好出去的时候告诉我。"
  npc_override_1@cor_CorOperation_analysis_result_battery_4bc940: "分析结果是，那个电池正在为召唤的怪物提供能量。踩上去并立即避开伤害！"
  npc_override_1@cor_CorOperation_avoid_chemical_poison_ki_0061a7: "避开化学毒素并杀死怪物！"
  npc_override_1@cor_CorOperation_briefing_criminal_here_o_b575e5: "简报……这里的罪犯会来做这件事。"
  npc_override_1@cor_CorOperation_cause_explosion_unknown_a47753: "爆炸原因不明，但我在现场发现了这个可疑的箱子。它似乎是某种机关。"
  npc_override_1@cor_CorOperation_come_i_about_open_96a9a3: "拜托，我正要打开它。"
  npc_override_1@cor_CorOperation_destroy_biological_batte_9aeeee: "摧毁生物电池并杀死怪物！"
  npc_override_1@cor_CorOperation_did_i_tell_you_i_0c7e32: "我有没有告诉过你，和 Secret Wing 一起工作我真的很开心？多亏了他们，我被选中参加这次行动。"
  npc_override_1@cor_CorOperation_did_you_just_call_those_be5c36: "你刚才把那些废铁叫做孩子吗？"
  npc_override_1@cor_CorOperation_didn_t_i_say_call_120e8f: "我不是说过不要叫它废铁吗？！你这个白痴！"
  npc_override_1@cor_CorOperation_divide_into_teams_everyo_76e3d6: "分成4个小队，各就各位，开始镇压首领。如果有任何小队发现 Elyumina，立即通知我们。"
  npc_override_1@cor_CorOperation_don_t_worry_about_those_49d10f: "别担心那些已经在前线的人，他们能适应任何情况。"
  npc_override_1@cor_CorOperation_entrance_blocked_9cab61: "入口被封锁了！"
  npc_override_1@cor_CorOperation_everyone_your_position_s_92ae4a: "所有人，各就各位！开始行动！"
  npc_override_1@cor_CorOperation_fast_expected_my_kids_wo_7564a1: "真快……不过我的孩子们不会赢，这是意料之中的。"
  npc_override_1@cor_CorOperation_give_me_signal_when_you_339b14: "你准备好进去的时候给我信号。我会告诉小队让你进去。"
  npc_override_1@cor_CorOperation_go_ahead_touch_traps_tra_fe161d: "去触碰陷阱吧。陷阱会激活，我可爱的孩子们就会出现。"
  npc_override_1@cor_CorOperation_good_job_s_funny_we_600fbc: "干得好。真有趣，我们明天还得再做一次。明天见。"
  npc_override_1@cor_CorOperation_good_work_we_ll_clearing_58bcd7: "干得好。我们会在这里清理，你可以休息一下。我要去审问她。休息一下然后回来找我。"
  npc_override_1@cor_CorOperation_haha_isn_t_your_job_08e58d: "哈哈！那不是你的工作吗？好好做。为什么把简报留给我？"
  npc_override_1@cor_CorOperation_hahaha_yes_let_s_work_84d143: "哈哈哈！是的。努力工作吧。为我收集更多战斗数据！"
  npc_override_1@cor_CorOperation_heh_i_ll_explaining_beca_0835c0: "嘿，我来解释是因为我想照顾我的孩子们！"
  npc_override_1@cor_CorOperation_hello_adventurer_04c899: "你好，冒险者。"
  npc_override_1@cor_CorOperation_here_take_map_informatio_29b3ea: "来，拿着地图。信息也会传送给队伍成员。"
  npc_override_1@cor_CorOperation_i_already_know_you_adven_90bc89: "我已经认识你了，冒险者，但请小心。"
  npc_override_1@cor_CorOperation_i_ask_you_act_separately_38cd95: "我要求你分开行动，冒险者。请查看你的^0000CD小地图^000000，尽快整理局势。如果他们需要支援，加入队伍！"
  npc_override_1@cor_CorOperation_i_haven_t_seen_you_74c859: "好久不见了，冒险者。"
  npc_override_1@cor_CorOperation_i_ll_conversation_crimin_7ee543: "……我稍后会和这个罪犯谈谈……总之。拜托你们了，冒险者们！"
  npc_override_1@cor_CorOperation_i_ll_start_explaining_op_8b0aaf: "我开始解释行动。首先……"
  npc_override_1@cor_CorOperation_i_ran_away_also_s_3c96bf: "我也逃跑了，既然你打倒了那堆巨大的废铁，这很尴尬。我还捕获了一些迷人的东西。"
  npc_override_1@cor_CorOperation_i_ve_been_waiting_you_faf2cb: "我一直在等你。我找到了那个疯狂的研究员。"
  npc_override_1@cor_CorOperation_if_you_take_care_machine_4c98ea: "如果你处理机器，其他搜索小队会负责找到 Elyumina。"
  npc_override_1@cor_CorOperation_if_you_touch_chemical_po_155f1b: "如果你触碰化学毒素，它会像炸弹一样扩散。你不应该再靠近。"
  npc_override_1@cor_CorOperation_if_you_want_handle_just_1af396: "如果你想处理它，直接摧毁它就好。这很好，因为这是个简单的解决方案。"
  npc_override_1@cor_CorOperation_illusion_researcher_elyu_f1cf41: "幻象研究员 Elyumina 已被捕获！"
  npc_override_1@cor_CorOperation_let_s_go_support_another_5ed186: "'- 我们去支援另一支队伍吧。-'"
  npc_override_1@cor_CorOperation_let_s_show_them_what_f64624: "让我们向他们展示我们是什么人，以及我们是好人。"
  npc_override_1@cor_CorOperation_looks_like_you_ve_found_91c26b: "看起来你在这里发现了一些有趣的东西。你应该去看看其他队伍！"
  npc_override_1@cor_CorOperation_menu_elena_1d9826: "Elena Volkova:是的，该死的罪犯！你为什么不现在打开传送门？"
  npc_override_1@cor_CorOperation_menu_elena_4b8cf9: "Elena Volkova:太棒了，她出来了！我已经发出信号，来我的位置！"
  npc_override_1@cor_CorOperation_menu_elena_4f7f55: "Elena Volkova:这边走。等所有人到齐后我们简报。"
  npc_override_1@cor_CorOperation_menu_elena_743e3e: "Elena Volkova:……我稍后会和这个罪犯谈谈……总之。拜托你们了，冒险者们！"
  npc_override_1@cor_CorOperation_menu_elena_78a4d7: "Elena Volkova:全部完成后，来军营，Elyumina 会引导你！"
  npc_override_1@cor_CorOperation_menu_elena_d4ae78: "Elena Volkova:太吵了。在我们开始之前。你现在属于 USU 吗？"
  npc_override_1@cor_CorOperation_menu_elena_f3341e: "Elena Volkova:简报……这里的罪犯会来做这件事。照看罪犯真难。"
  npc_override_1@cor_CorOperation_menu_elyumina_071618: "Elyumina:去触碰陷阱吧。陷阱会激活，我可爱的孩子们就会出现。"
  npc_override_1@cor_CorOperation_menu_elyumina_1fe975: "Elyumina:你们……你们杀了它？！你们屠杀了它！刽子手！"
  npc_override_1@cor_CorOperation_menu_elyumina_358d5d: "Elyumina:……你们直奔我的 EL1_A17T 去了？"
  npc_override_1@cor_CorOperation_menu_elyumina_479039: "Elyumina:嘿，我来解释是因为我想照顾我的孩子们！"
  npc_override_1@cor_CorOperation_menu_elyumina_604e6d: "Elyumina:哈哈哈！是的。努力工作吧。为我收集更多战斗数据！"
  npc_override_1@cor_CorOperation_menu_elyumina_989300: "Elyumina:清除四个陷阱后，EL1_A17T 就会出现，这位女士会把你带到和上次一样的地方。"
  npc_override_1@cor_CorOperation_menu_elyumina_a636ae: "Elyumina:你知道军营在哪里吗？我在你的小地图上标出来了。我很快就去那里。"
  npc_override_1@cor_CorOperation_menu_elyumina_b4d295: "Elyumina:哈哈！那不是你的工作吗？好好做。为什么把简报留给我？"
  npc_override_1@cor_CorOperation_menu_elyumina_c737a5: "Elyumina:{0}"
  npc_override_1@cor_CorOperation_menu_elyumina_c76747: "Elyumina:……好吧，差不多是时候了。我的孩子们会开始在四个地方设置陷阱。"
  npc_override_1@cor_CorOperation_menu_elyumina_ccd623: "Elyumina:来，拿着地图。信息也会传送给队伍成员。"
  npc_override_1@cor_CorOperation_menu_elyumina_d4291d: "Elyumina:解释就到这里。现在，开始工作吧！肌肉白痴！啊哈哈哈！"
  npc_override_1@cor_CorOperation_menu_elyumina_d9e6c0: "Elyumina:真快……不过我的孩子们不会赢，这是意料之中的。上面还有更多麻烦呢~"
  npc_override_1@cor_CorOperation_menu_elyumina_e246ec: "Elyumina:开始有东西扩散了。做好准备！"
  npc_override_1@cor_CorOperation_menu_give_ed428c: "发出信号。:还没。"
  npc_override_1@cor_CorOperation_menu_go_945b71: "回去。:停留片刻。"
  npc_override_1@cor_CorOperation_menu_go_d9aab1: "进去。:还没进去。"
  npc_override_1@cor_CorOperation_menu_have_fb6fc8: "你已经做过了吗？:你还在沉默吗？"
  npc_override_1@cor_CorOperation_menu_i_16238d: "我马上回去。:我会在这里待一会儿"
  npc_override_1@cor_CorOperation_msg_e95f89: "……"
  npc_override_1@cor_CorOperation_my_children_start_settin_7e7cbf: "我的孩子们会开始在<TIPBOX>[四个地方]<INFO>8086</INFO></TIPBOX>设置陷阱。"
  npc_override_1@cor_CorOperation_nice_part_squad_we_ve_bdd66c: "能成为这个小队的一员真好，我们已经处理了这个箱子。"
  npc_override_1@cor_CorOperation_nods_nods_0fa2ab: "'*点头，点头*'"
  npc_override_1@cor_CorOperation_now_you_run_wild_43f34b: "……现在你可以肆意妄为了。"
  npc_override_1@cor_CorOperation_oh_yes_you_ve_worked_d7537d: "哦，是的。这次你又辛苦了。真不容易！我们要用那堆废铁多久才能让它停下来？"
  npc_override_1@cor_CorOperation_okay_s_almost_time_e60428: "……好吧，差不多是时候了。"
  npc_override_1@cor_CorOperation_okay_watch_out_i_opened_2eaaf6: "好的，小心！我打开了传送门，这样你就可以进去了。这是单向入口，所以确保你准备好了！"
  npc_override_1@cor_CorOperation_order_control_such_machi_71f741: "要以如此精细的方式控制这样的机器，Elyumina 一定在附近。"
  npc_override_1@cor_CorOperation_other_guys_surrounding_p_80c2ce: "其他人在包围这个地方。"
  npc_override_1@cor_CorOperation_place_we_ll_enter_o_717c37: "我们要进入的地方在9点钟方向。我确认没有人藏在那里，而且我们封锁了出口。"
  npc_override_1@cor_CorOperation_possible_me_handle_machi_a38a79: "我可以处理这台机器，但那样我就抓不到 Elyumina 了。"
  npc_override_1@cor_CorOperation_power_overwhelming_power_c91e56: "力量，压倒性的力量！"
  npc_override_1@cor_CorOperation_rebellion_squad_well_coo_b6de13: "Rebellion 小队协调得很好，这项工作最适合我们。所以把那个任务交给我们吧。"
  npc_override_1@cor_CorOperation_s_awful_interesting_devi_d02b64: "这是一个可怕但有趣的装置。它不是用来召唤怪物的装置。"
  npc_override_1@cor_CorOperation_s_explanation_now_get_wo_7d7a07: "解释就到这里。现在，开始工作吧！肌肉白痴！啊哈哈哈！"
  npc_override_1@cor_CorOperation_s_hard_babysit_criminals_62c8f8: "照看罪犯真难。"
  npc_override_1@cor_CorOperation_s_quite_sudden_i_m_b6f840: "虽然很突然，但我要改变行动计划。"
  npc_override_1@cor_CorOperation_s_what_he_said_you_4f3ede: "那，他就是这么说的……你怕我会害怕吗！"
  npc_override_1@cor_CorOperation_scrap_metal_s_masterpiec_5eb460: "废铁！这是杰作！我伟大的孩子！"
  npc_override_1@cor_CorOperation_smoke_rising_suspicious_292e29: "'- 可疑的箱子正在冒烟。-'"
  npc_override_1@cor_CorOperation_so_looks_like_over_i_7b34bf: "那么，看起来结束了，我去加入另一支队伍！你也应该去。"
  npc_override_1@cor_CorOperation_so_noisy_before_we_get_2ddaa5: "太吵了。在我们开始之前。你现在属于 USU 吗？"
  npc_override_1@cor_CorOperation_something_seems_exploded_0b260b: "那边似乎发生了爆炸。火焰从前方升起！"
  npc_override_1@cor_CorOperation_sorry_late_analysis_wasn_c44c0f: "抱歉分析晚了。它不是用来召唤怪物的装置。"
  npc_override_1@cor_CorOperation_sprayed_out_toxic_chemic_15a449: "它喷出了有毒的化学物质！让我们避开它，继续战斗！"
  npc_override_1@cor_CorOperation_thank_you_your_hard_work_1ccb22: "感谢你的辛勤工作！在你走之前，请听我说一会儿。"
  npc_override_1@cor_CorOperation_there_identified_locatio_ff6f20: "已确认爆炸来自4个地点！我已经^FF0000在你的小地图上标出来了。^000000"
  npc_override_1@cor_CorOperation_there_s_lot_more_trouble_2a3c6b: "上面还有更多麻烦呢~"
  npc_override_1@cor_CorOperation_there_signal_being_trans_de0d67: "有信号从内部传来……嗯，小心。有事情发生了！"
  npc_override_1@cor_CorOperation_there_suspicious_box_sig_9dddbf: "有一个可疑的箱子！有信号从内部传来，目前正在解密中！"
  npc_override_1@cor_CorOperation_these_machines_uses_chem_4462aa: "这些机器使用化学毒素，小心。"
  npc_override_1@cor_CorOperation_we_now_conduct_our_searc_ee908e: "我们现在开始搜索，直到信号传来。冒险者，小心！"
  npc_override_1@cor_CorOperation_we_ve_successfully_captu_cc1071: "我们成功活捉了她，行动结束！"
  npc_override_1@cor_CorOperation_well_done_operation_succ_ce482f: "干得好，{0}。行动成功了！"
  npc_override_1@cor_CorOperation_well_looks_like_over_f5a1eb: "嗯，看起来结束了……"
  npc_override_1@cor_CorOperation_well_your_children_proba_30d9a3: "嗯，你的孩子可能很好。那么让我们去为你孩子的错误付出代价吧。"
  npc_override_1@cor_CorOperation_what_you_going_now_24d08d: "你现在要做什么，{0}？"
  npc_override_1@cor_CorOperation_when_you_come_contact_ch_5aa447: "当你接触到化学毒素时，有毒物质会扩散。你已经踩上去了，快点避开它！"
  npc_override_1@cor_CorOperation_yeah_yeah_wasn_t_scrap_d8c623: "是是，它一开始不是废铁。但现在我们抓住了它，它就是废铁。总之，你辛苦了。你现在回去休息吧。"
  npc_override_1@cor_CorOperation_yes_ee33f3: "是的！"
  npc_override_1@cor_CorOperation_yes_s_dangerous_opponent_6a3c7b: "是的，这是一个危险的对手。很抱歉让你独自战斗。你准备好的时候告诉我。"
  npc_override_1@cor_CorOperation_you_aren_t_alone_right_d7a2ef: "你不是一个人，对吧？你知道我的孩子们很强大吗？"
  npc_override_1@cor_CorOperation_you_going_straight_my_el_01e336: "……你们直奔我的 EL1-A17T 去了？"
  npc_override_1@cor_CorOperation_you_remember_how_traps_w_9ab686: "你记得陷阱是怎么运作的，对吧？"
  npc_override_1@cor_CorOperation_you_you_hurt_my_child_926fcf: "你！你……伤害了我的孩子！你摧毁了我的孩子！"
