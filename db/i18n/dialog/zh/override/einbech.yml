Body:
  npc_override_einbech_einbech_you_only_see_cold_hard_c7177f: "你只能看到一堵冰冷坚硬的墙。"
  npc_override_einbech_quests_exp_175_after_all_faster_me_lear_1f3f27: "毕竟，对我来说学剑会更快！我已经挖了10年的矿，所以很快就能学会。"
  npc_override_einbech_quests_exp_175_ah_971301: "啊……"
  npc_override_einbech_quests_exp_175_ah_no_f7f193: "啊，不……！"
  npc_override_einbech_quests_exp_175_aha_s_lot_more_dust_15750e: "啊哈，灰尘真多。"
  npc_override_einbech_quests_exp_175_all_right_441c8d: "好的。"
  npc_override_einbech_quests_exp_175_anyway_flood_creatures_t_8577ae: "不管怎样，被困了很长时间的魔物如潮水般向我涌来！"
  npc_override_einbech_quests_exp_175_as_you_know_i_m_484a4f: "如你所知，我是个优秀的宫廷巫师，对吧？"
  npc_override_einbech_quests_exp_175_as_you_see_i_m_edb48f: "如你所见，我只是个无能的贤者。"
  npc_override_einbech_quests_exp_175_beyond_crack_dimension_t_5e14c6: "在这个维度的裂缝之外，有彼此映照的镜像。"
  npc_override_einbech_quests_exp_175_beyond_cracks_dimension_074764: "在这个维度的裂缝之外，存在着空虚之物.."
  npc_override_einbech_quests_exp_175_cancel_a43bf6: "取消？"
  npc_override_einbech_quests_exp_175_careful_they_dangerous_79ddbe: "小心，它们很危险。"
  npc_override_einbech_quests_exp_175_close_your_eyes_exchange_6c15b4: "闭上眼睛并交换。"
  npc_override_einbech_quests_exp_175_contaminated_raydric_arc_3434fb: "^0000FF20个被污染的雷德里克弓箭手^000000。"
  npc_override_einbech_quests_exp_175_contaminated_raydric_arc_d5c619: "^0000FF20个被污染的雷德里克弓箭手^000000！！击败它们然后回来。然后这位天才巫师会研究它。"
  npc_override_einbech_quests_exp_175_contaminated_raydric_con_d27a71: "^0000FF被污染的雷德里克^000000和^0000FF被污染的雷德里克弓箭手^000000……"
  npc_override_einbech_quests_exp_175_contaminated_raydrics_f988b0: "^0000FF20个被污染的雷德里克^000000，"
  npc_override_einbech_quests_exp_175_contamination_164ce1: "污染"
  npc_override_einbech_quests_exp_175_currently_2b7b0f: "{0} ^777777（当前{1}）^000000"
  npc_override_einbech_quests_exp_175_data_as_follows_very_hel_877a28: "{0}和{1}的数据如下。这非常有帮助。"
  npc_override_einbech_quests_exp_175_data_collected_time_also_e9f349: "这次要收集的数据是^4d4dff{0}和{1}^000000，也被称为矿虫。"
  npc_override_einbech_quests_exp_175_dealer_caused_abnormal_e_ca5761: "导致异常进化的交易商"
  npc_override_einbech_quests_exp_175_defeat_tell_me_density_d_ae6e30: "^0000FF击败10个{0}^000000并告诉我密度差异。"
  npc_override_einbech_quests_exp_175_defeat_tell_me_how_hard_0e077b: "^0000FF击败10个{0}^000000并告诉我它们有多硬。"
  npc_override_einbech_quests_exp_175_difficult_deal_monsters_613485: "以这里的人手很难对付占领矿山的魔物，所以我们必须同时处理两边。"
  npc_override_einbech_quests_exp_175_don_t_worry_i_ll_3ec107: "别担心。我向教授报告时会用冒险者的名字……"
  npc_override_einbech_quests_exp_175_dr_me_too_because_combat_35b184: "博士和我也是……因为战斗不是我的专业。"
  npc_override_einbech_quests_exp_175_dynite_been_refined_s_pe_bd2eeb: "{0} Dynite已经精炼完毕。今天非常完美！"
  npc_override_einbech_quests_exp_175_dynite_refinement_9db428: "Dynite精炼"
  npc_override_einbech_quests_exp_175_dynite_refinement_only_r_c12f98: "Dynite精炼一次最多只能精炼100个？机器很小，没办法。请理解。"
  npc_override_einbech_quests_exp_175_empty_thing_ba3223: "一个空虚之物"
  npc_override_einbech_quests_exp_175_flame_ghosts_65aebe: "^0000FF10个火焰幽灵^000000！！"
  npc_override_einbech_quests_exp_175_flame_ghosts_defeat_them_df2404: "^0000FF10个火焰幽灵^000000！！击败它们然后回来。然后这位天才巫师会研究它。"
  npc_override_einbech_quests_exp_175_found_here_rd_floor_einb_1de1a5: "{0}和{1}位于艾因贝克矿场地牢的3层。"
  npc_override_einbech_quests_exp_175_friendly_adventurer_you_d9bd8f: "友好的冒险者，你介意帮我们完成会议报告的研究吗？"
  npc_override_einbech_quests_exp_175_frozen_gargoyle_prison_b_426ec5: "^0000FF冰冻石像鬼^000000和^0000FF监狱破坏者^000000……"
  npc_override_einbech_quests_exp_175_frozen_gargoyles_beff38: "^0000FF5个冰冻石像鬼^000000，"
  npc_override_einbech_quests_exp_175_generous_adventurer_plea_db7829: "慷慨的冒险者，请把我从教授的魔法中解放出来……！"
  npc_override_einbech_quests_exp_175_generous_adventurer_than_ba8cd4: "慷慨的冒险者！谢谢你。"
  npc_override_einbech_quests_exp_175_genius_wizard_who_dimens_f7c763: "一个能在维度上做这做那的天才巫师！"
  npc_override_einbech_quests_exp_175_give_me_dynites_i_open_d8016e: "给我50个^4d4dffDynites^000000，我会为你打开一个^4d4dff武器箱^000000。"
  npc_override_einbech_quests_exp_175_guards_said_level_enough_65472b: "守卫说175级就够了……"
  npc_override_einbech_quests_exp_175_ha_s_so_obvious_out_0a1107: "哈~在这里太明显了。能不能给我看看你的……武器和……防具？嗯……"
  npc_override_einbech_quests_exp_175_haha_what_discovery_cent_244476: "哈哈，真是世纪大发现！"
  npc_override_einbech_quests_exp_175_hardened_nightmare_terro_026419: "{0}是一个硬化的噩梦恐怖……"
  npc_override_einbech_quests_exp_175_haunted_rd_floor_nogg_ro_212329: "出没在诺格之路3层，"
  npc_override_einbech_quests_exp_175_haunted_rd_floor_nogg_ro_ffb73a: "出没在诺格之路3层"
  npc_override_einbech_quests_exp_175_hello_adventurer_4280fa: "你好，冒险者！"
  npc_override_einbech_quests_exp_175_hello_adventurer_ed54de: "你好。冒险者。"
  npc_override_einbech_quests_exp_175_help_me_when_you_re_883ef6: "你不忙的时候帮帮我。"
  npc_override_einbech_quests_exp_175_here_rd_floor_einbech_mi_752321: "{0}位于艾因贝克矿场地牢的3层。"
  npc_override_einbech_quests_exp_175_here_rd_floor_einbech_mi_d61065: "{0}和{1}位于艾因贝克矿场地牢的3层。"
  npc_override_einbech_quests_exp_175_hey_makes_difficult_each_b6f757: "嘿！这让彼此都很难办，你难道不缺精炼需要的材料吗？材料！"
  npc_override_einbech_quests_exp_175_hmm_you_okay_ff673e: "嗯……你还好吗？"
  npc_override_einbech_quests_exp_175_hmmm_9a5ca8: "嗯！！"
  npc_override_einbech_quests_exp_175_hmmmm_okay_7dae5d: "嗯……好吧"
  npc_override_einbech_quests_exp_175_honey_please_help_me_whe_d63de4: "但是亲爱的，请在-你-有-空-的-时-候-帮帮我！"
  npc_override_einbech_quests_exp_175_how_aae35d: "怎么样？"
  npc_override_einbech_quests_exp_175_how_did_i_get_entrance_06dc04: "我是怎么到入口的，他们说永远不会让我进去。"
  npc_override_einbech_quests_exp_175_how_different_just_air_g_74c3c0: "它和普通的空气或地面删除者有什么不同？"
  npc_override_einbech_quests_exp_175_how_different_just_explo_692cf2: "它和普通的爆炸者或炽焰者有什么不同？"
  npc_override_einbech_quests_exp_175_how_different_just_lava_45606c: "它和普通的熔岩魔像有什么不同？"
  npc_override_einbech_quests_exp_175_how_different_just_night_db64f7: "它和普通的噩梦恐怖有什么不同？"
  npc_override_einbech_quests_exp_175_huh_really_3902a6: "嗯……真的吗？"
  npc_override_einbech_quests_exp_175_i_accept_fabd38: "我接受。"
  npc_override_einbech_quests_exp_175_i_almost_d_i_e_bb3012: "我差点-死-在-那-里。"
  npc_override_einbech_quests_exp_175_i_am_desperately_looking_cc8a25: "我迫切地寻求帮助，需要一位有才华的冒险者。"
  npc_override_einbech_quests_exp_175_i_am_still_allowed_enter_dc01a4: "但我仍然不被允许进入诺格之路3层。"
  npc_override_einbech_quests_exp_175_i_asked_you_too_much_1b3be7: "我今天要求你太多了，亲爱的。"
  npc_override_einbech_quests_exp_175_i_came_here_investigate_c177be: "我来这里调查并发现了它。"
  npc_override_einbech_quests_exp_175_i_collected_enough_data_7c968b: "我已经收集了足够{0}和{1}的数据！"
  npc_override_einbech_quests_exp_175_i_don_t_know_what_17c07b: "我不知道会出来什么，所以很难去任何地方以这个价格获得这种装备。"
  npc_override_einbech_quests_exp_175_i_don_t_know_what_84704f: "我不知道会出来什么，但质量很好。你想打开吗？"
  npc_override_einbech_quests_exp_175_i_don_t_think_you_0adf02: "但我认为你只靠那个无法理解整个故事。虽然这就是委托调查的美妙之处……"
  npc_override_einbech_quests_exp_175_i_exchange_equipment_dyn_40a347: "我可以用Dynite交换装备，但它已经在一个密封的箱子里了。"
  npc_override_einbech_quests_exp_175_i_ll_ask_you_again_490a3d: "我明天再问你。"
  npc_override_einbech_quests_exp_175_i_ll_waiting_here_098012: "我会在这里等。"
  npc_override_einbech_quests_exp_175_i_love_bleakness_dc587a: "我喜欢这种荒凉！"
  npc_override_einbech_quests_exp_175_i_m_collecting_data_whil_eec27d: "我正在冒险者战斗时收集^4d4dff{0}和{1}^000000的数据。"
  npc_override_einbech_quests_exp_175_i_m_sorry_adventurer_511d32: "对不起。冒险者。"
  npc_override_einbech_quests_exp_175_i_need_data_research_poi_ee6bff: "我需要数据来研究在艾因贝克矿场地牢新发现的有毒气体魔物。"
  npc_override_einbech_quests_exp_175_i_t_even_approach_them_844368: "但因为它们凶猛的性格，我甚至无法接近它们……"
  npc_override_einbech_quests_exp_175_i_think_i_ve_made_8322fe: "我想我有一个伟大的发现，你为什么不跟我来？"
  npc_override_einbech_quests_exp_175_i_think_popular_name_als_f63b1b: "我认为{0}的通俗名称也是那样的。"
  npc_override_einbech_quests_exp_175_i_ve_heard_there_huge_4eb6fc: "我听说熔岩魔像和{0}的密度差异巨大。"
  npc_override_einbech_quests_exp_175_i_ve_only_seen_nightmare_8dcfa1: "我只见过噩梦恐怖。只是看着它就让我僵硬得无法移动。虽然教授把我拖了出来……"
  npc_override_einbech_quests_exp_175_ice_ghost_flame_ghost_5ad2f5: "^0000FF冰冻幽灵^000000和^0000FF火焰幽灵^000000……"
  npc_override_einbech_quests_exp_175_ice_ghosts_423f82: "^0000FF10个冰冻幽灵^000000，"
  npc_override_einbech_quests_exp_175_if_you_finish_quest_let_7a9008: "如果你完成了任务，我们先离开那里-然后-检查-！"
  npc_override_einbech_quests_exp_175_if_you_look_into_abyss_efe2c9: "据说如果你凝视深渊，深渊会被吃掉，而不是喵。"
  npc_override_einbech_quests_exp_175_if_you_need_refinement_d_cfc989: "如果你需要精炼Dynite，请随时找我。没有我谁也做不到。"
  npc_override_einbech_quests_exp_175_if_you_qualified_enter_r_1e6611: "如果你有资格进入诺格之路3层，你愿意接受一个任务吗？"
  npc_override_einbech_quests_exp_175_if_you_re_busy_you_a1cb24: "如果你很忙，你就不能帮我。"
  npc_override_einbech_quests_exp_175_if_you_re_here_purchase_43559f: "如果你是来购买Dynite采矿设备或将矿石精炼成Dynite的，你来对地方了。"
  npc_override_einbech_quests_exp_175_if_you_re_tired_take_b01c01: "如果你累了，休息一下。"
  npc_override_einbech_quests_exp_175_if_you_reach_level_you_60dd6c: "如果你达到175级，你将成为我命中注定的对手-"
  npc_override_einbech_quests_exp_175_instead_you_re_sharing_a_e221a8: "相反，你明天再分享另一个新发现。好-的-吗-？"
  npc_override_einbech_quests_exp_175_isn_t_enough_so_please_e43e01: "但这还不够，所以请明天再做一次。"
  npc_override_einbech_quests_exp_175_isn_t_good_deal_aa53d0: "这不是一笔好交易吗？"
  npc_override_einbech_quests_exp_175_just_like_you_2b5953: "就像你一样！"
  npc_override_einbech_quests_exp_175_kee_waste_good_deal_9f2a99: "切，真浪费，这是一笔好交易。"
  npc_override_einbech_quests_exp_175_kill_950421: "^0000FF击杀15个{0}^000000"
  npc_override_einbech_quests_exp_175_kill_da8998: "^0000FF击杀10个{0}^000000"
  npc_override_einbech_quests_exp_175_let_s_collect_data_neede_98434c: "让我们在控制个体数量的同时收集研究所需的数据！"
  npc_override_einbech_quests_exp_175_let_s_get_out_here_2a7ad8: "让我们离开这里！"
  npc_override_einbech_quests_exp_175_let_s_go_208616: "走吧！"
  npc_override_einbech_quests_exp_175_let_s_go_out_side_5b1db4: "让-我-们-出-去-！"
  npc_override_einbech_quests_exp_175_listen_request_02b275: "听取请求"
  npc_override_einbech_quests_exp_175_long_ago_i_joined_regens_9d8a37: "不久前，我作为见习研究员加入了里根斯鲁姆，但这就是我被任命的工作。"
  npc_override_einbech_quests_exp_175_looks_completely_differe_12719b: "看起来完全不同，但维度裂缝非常未知。"
  npc_override_einbech_quests_exp_175_menu_elmen_afb6fd: "埃尔曼：一次最多可精炼100个Dynite。机器很小。"
  npc_override_einbech_quests_exp_175_msg_44c582: "……？"
  npc_override_einbech_quests_exp_175_my_bae_442adb: "这是我的宝贝！"
  npc_override_einbech_quests_exp_175_new_poison_research_35e11e: "新毒素研究"
  npc_override_einbech_quests_exp_175_nillem_saaaad_tears_7ea463: "尼勒姆好伤心。*眼泪*"
  npc_override_einbech_quests_exp_175_oh_my_sweetheart_you_re_2c0266: "哦，我的甜心，你今天真刻薄。"
  npc_override_einbech_quests_exp_175_only_adventurer_s_eye_on_5e4118: "只有冒险者的眼睛是我们生存的唯一途径。"
  npc_override_einbech_quests_exp_175_opportunities_always_com_c75484: "机会总会来的。"
  npc_override_einbech_quests_exp_175_orders_keep_pouring_ever_af2c59: "订单源源不断地涌来，在那里工作的每个人都逃跑了……大事不妙，大事不妙。"
  npc_override_einbech_quests_exp_175_originally_research_abou_31c5e7: "本来，研究就是关于坚持的。"
  npc_override_einbech_quests_exp_175_our_doctor_said_monsters_4234c5: "我们的医生说，魔物生活在不同的地方时，它们的特征和外貌会发生变化……"
  npc_override_einbech_quests_exp_175_our_professor_b377be: "……我们的教授。"
  npc_override_einbech_quests_exp_175_piece_time_stopped_flow_1f1f48: "在流逝的时间中停止的一个碎片……嗯……好难解释……"
  npc_override_einbech_quests_exp_175_please_introduce_me_tale_cdef6b: "请给我介绍一位有才华的冒险者！"
  npc_override_einbech_quests_exp_175_prison_breakers_852cbf: "^0000FF5个监狱破坏者^000000！！"
  npc_override_einbech_quests_exp_175_prison_breakers_defeat_t_1d9be3: "^0000FF5个监狱破坏者^000000！！击败它们然后回来。然后这位天才巫师会研究它。"
  npc_override_einbech_quests_exp_175_professor_i_m_serving_bi_a70f58: "我服务的教授有点固执……我是说，总得有人去调查。"
  npc_override_einbech_quests_exp_175_push_yourself_2e8850: "别-勉-强-自-己---！"
  npc_override_einbech_quests_exp_175_received_request_2b78f6: "已接受请求"
  npc_override_einbech_quests_exp_175_refined_ore_fb6693: "{0} 精炼矿石。"
  npc_override_einbech_quests_exp_175_request_rd_floor_nogg_ro_3dc3be: "请求是在诺格之路3层，一个我还不能进入的地方，但会议想要一份报告……"
  npc_override_einbech_quests_exp_175_right_there_s_no_mission_dbf22f: "没错，这里没有任务，但好奇心紧随发现！"
  npc_override_einbech_quests_exp_175_s_about_collecting_data_a9905b: "是关于收集采矿魔物的数据，所以我的评估取决于那个。"
  npc_override_einbech_quests_exp_175_s_data_always_amazing_b84f34: "{0}的数据总是令人惊叹。"
  npc_override_einbech_quests_exp_175_s_hard_501686: "那不难。"
  npc_override_einbech_quests_exp_175_s_hard_explain_you_short_bd0f42: "很难向你解释，但简而言之，你-做-到-了-！！"
  npc_override_einbech_quests_exp_175_s_hard_see_impact_there_ae841e: "因为奇怪的魔法，很难看到那里的影响。"
  npc_override_einbech_quests_exp_175_s_much_more_crumbly_aa1d38: "它脆弱得多……"
  npc_override_einbech_quests_exp_175_s_my_baby_fd1d35: "那是我的宝贝！"
  npc_override_einbech_quests_exp_175_s_ok_6fa2ec: "没关系。"
  npc_override_einbech_quests_exp_175_s_right_i_m_waiting_6afec1: "没错，我在等待一个强大的冒险者来满足我的好奇心！"
  npc_override_einbech_quests_exp_175_s_right_place_sage_fit_314656: "没错……这不是贤者该待的地方。"
