Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_dew_fild01_quests_dewata_able_use_667755: "就可以使用它了。"
  npc_override_dew_fild01_quests_dewata_according_sage_kasyapa_82e917: "根据贤者^0000FF迦旃延^000000的说法"
  npc_override_dew_fild01_quests_dewata_according_sage_kasyapa_y_27ecfe: "根据贤者^0000FF迦旃延^000000的说法，你可以帮助我们制作一顶^006400加冕冠^000000。"
  npc_override_dew_fild01_quests_dewata_after_jaty_crown_complet_043d96: "^006400加冕冠^000000完成后，我有一份礼物要送给你。"
  npc_override_dew_fild01_quests_dewata_ah_also_you_should_go_dd255a: "啊，对了，你应该去见见贤者^0000FF迦旃延^000000，他非常想奖励你一些东西。"
  npc_override_dew_fild01_quests_dewata_ah_backache_26dba7: "啊~腰酸背痛……"
  npc_override_dew_fild01_quests_dewata_ah_feather_53fb4d: "啊，羽毛……！"
  npc_override_dew_fild01_quests_dewata_ah_good_way_hard_gather_dccedb: "啊，那倒是个好办法，但对新手来说采集坚果会很困难。"
  npc_override_dew_fild01_quests_dewata_ah_here_another_one_take_a321cc: "啊！这里还有一块。别再弄丢了，而且要向莱罗先生保密。"
  npc_override_dew_fild01_quests_dewata_ah_i_didn_t_know_e57618: "啊！我不知道啊。我总是对波比说^0000FF'一年干旱，毁于一日。'^000000"
  npc_override_dew_fild01_quests_dewata_ah_i_understand_704d27: "啊……我明白了……"
  npc_override_dew_fild01_quests_dewata_ah_material_i_am_looking_a6c6be: "啊！我要找的材料是科莫多皮革。"
  npc_override_dew_fild01_quests_dewata_ah_mr_lero_made_you_6b7a0c: "啊！是莱罗先生让你来的。我爬树时伤到了背，动弹不得。"
  npc_override_dew_fild01_quests_dewata_ah_my_freakin_back_killi_43b790: "啊~我的背疼死了。"
  npc_override_dew_fild01_quests_dewata_ah_next_person_whom_i_a4480e: "啊，下一个我要你送^006400沙爹^000000去的人是住在河对岸的^0000FF部落管理者^000000。"
  npc_override_dew_fild01_quests_dewata_ah_old_man_s_got_48a750: "啊，这老头子嘴真松。"
  npc_override_dew_fild01_quests_dewata_ah_right_i_forgot_about_85a4fc: "啊，对了！我忘了 Memo 的事，因为采集坚果的工人们还没来。抱歉。"
  npc_override_dew_fild01_quests_dewata_ah_right_you_busy_now_ccab7c: "啊，对了！你现在忙吗？"
  npc_override_dew_fild01_quests_dewata_ah_satay_i_sampled_when_edb459: "啊，就是部落之前邀请我时我尝过的^006400沙爹。"
  npc_override_dew_fild01_quests_dewata_ah_sorry_tell_mr_lero_ee7566: "啊！抱歉。告诉莱罗先生，如果我能找到办法移动的话就会回去。"
  npc_override_dew_fild01_quests_dewata_ah_stranger_our_land_1a8f82: "啊，一位来自异乡的陌生人。"
  npc_override_dew_fild01_quests_dewata_ah_you_should_talk_sage_938603: "啊，你应该去见见贤者^0000FF迦旃延^000000，他非常想奖励你一些东西。"
  npc_override_dew_fild01_quests_dewata_alright_deliver_right_no_defe1b: "好的！现在就送过去！"
  npc_override_dew_fild01_quests_dewata_alright_let_me_begin_cra_3124ba: "好的，让我开始制作^006400加冕冠^000000吧，我感觉已经准备好了。"
  npc_override_dew_fild01_quests_dewata_also_feather_you_receive_dbd8b4: "另外，你收到的这根羽毛本身就很珍贵，它也是部落对你的认可。"
  npc_override_dew_fild01_quests_dewata_also_sparkling_light_83948a: "还有那闪烁的光芒……"
  npc_override_dew_fild01_quests_dewata_also_thank_you_satay_8c294c: "另外，谢谢你的^006400沙爹^000000"
  npc_override_dew_fild01_quests_dewata_also_you_brought_more_th_090434: "另外，你带来的材料绰绰有余，所以在制作完^006400加冕冠^000000后，我们还为你制作了一顶相似的留作纪念。"
  npc_override_dew_fild01_quests_dewata_although_he_lazy_rather_6f990c: "虽然他又懒又粗心，但他是最棒的工人。"
  npc_override_dew_fild01_quests_dewata_although_little_boring_0e4af8: "虽然有点无聊……"
  npc_override_dew_fild01_quests_dewata_another_land_b3b968: "来自另一片土地。"
  npc_override_dew_fild01_quests_dewata_anything_go_wrong_f6e1d0: "出了什么问题吗？"
  npc_override_dew_fild01_quests_dewata_anything_i_help_1899c2: "有什么我可以帮忙的吗？"
  npc_override_dew_fild01_quests_dewata_anyway_i_really_thank_yo_a4ed7c: "无论如何，我真的感谢你。"
  npc_override_dew_fild01_quests_dewata_ark_famous_tourists_guy_d20773: "Ark在游客中很有名，有个家伙自己就买了很多瓶。"
  npc_override_dew_fild01_quests_dewata_ark_needs_palm_oils_made_4c3950: "Ark需要^0000FF棕榈油^000000，是用油棕榈果榨取的。"
  npc_override_dew_fild01_quests_dewata_as_chief_jaty_tribe_i_215408: "作为^8B4513贾提部落^000000的酋长，祝你好运！！"
  npc_override_dew_fild01_quests_dewata_as_great_powerful_chief_ee62ee: "作为伟大而强大的酋长，你应该完全够资格。"
  npc_override_dew_fild01_quests_dewata_as_i_told_you_before_680d30: "就像我之前告诉你的，它比你想象的要重，所以搬运时要小心。"
  npc_override_dew_fild01_quests_dewata_as_representative_my_tri_d7d4e9: "作为我的部落的代表"
  npc_override_dew_fild01_quests_dewata_as_reward_your_help_63247c: "作为对你帮助的奖励。"
  npc_override_dew_fild01_quests_dewata_as_tasty_as_our_tribe_a2ce1e: "它没有我们部落的配方那么美味，但这是紧急任务，所以随便找点送去就行。"
  npc_override_dew_fild01_quests_dewata_as_you_see_jars_around_6a544b: "就像你看到我周围的罐子一样，我以制作^0000FF传统酒^000000为生。"
  npc_override_dew_fild01_quests_dewata_ask_you_72cedf: "请求你。"
  npc_override_dew_fild01_quests_dewata_backaches_don_t_just_go_3453ff: "背痛可不是一天就能好的。"
  npc_override_dew_fild01_quests_dewata_because_today_s_oil_arri_760186: "因为今天的油没有按时送到，我想我可能会有麻烦。"
  npc_override_dew_fild01_quests_dewata_become_lost_tradition_re_211791: "近年来这已成为失落的传统，但在10多年前，要成为^8B4513贾提部落^000000的战士，你必须攀登喀拉喀托火山来证明你的耐力。"
  npc_override_dew_fild01_quests_dewata_been_good_time_all_us_534baf: "对我们所有人来说，能一起分享和享受这个欢乐时刻真是一段美好时光。谢谢。"
  npc_override_dew_fild01_quests_dewata_behalf_my_people_68eefd: "代表我的人民"
  npc_override_dew_fild01_quests_dewata_between_you_me_mr_memo_2a7212: "悄悄告诉你，Memo先生太挑剔了，他不会用任何不新鲜的油。"
  npc_override_dew_fild01_quests_dewata_big_help_us_b7fe7e: "对我们有很大的帮助……"
  npc_override_dew_fild01_quests_dewata_borobudur_temple_manager_1f9c4f: "^0000FF婆罗浮屠寺庙管理者^000000就在"
  npc_override_dew_fild01_quests_dewata_bring_them_chief_paiko_8cef53: "然后把它们带给酋长^0000FF派科^000000。"
  npc_override_dew_fild01_quests_dewata_but_bda5a6: "但是？"
  npc_override_dew_fild01_quests_dewata_but_this_5f37dd: "但是……这……"
  npc_override_dew_fild01_quests_dewata_calm_down_chief_paiko_7daac3: "冷静点，^0000FF派科酋长^000000……"
  npc_override_dew_fild01_quests_dewata_cendrawasih_feather_owne_45aea4: "这根^8B4513极乐鸟羽毛^000000是我们部落第一任首领在加冕冠最初制作时拥有的。"
  npc_override_dew_fild01_quests_dewata_come_again_8dbf06: "再来啊。"
  npc_override_dew_fild01_quests_dewata_come_speak_me_again_3b8b2f: "再来跟我说话。"
  npc_override_dew_fild01_quests_dewata_comodo_leather_8d42b1: "科莫多皮革？"
  npc_override_dew_fild01_quests_dewata_comodo_leather_best_mate_28c955: "科莫多皮革是最好的材料。"
  npc_override_dew_fild01_quests_dewata_comodo_leather_steel_ori_516283: "我需要100个科莫多皮革、20个钢铁和10个奥利哈钢。"
  npc_override_dew_fild01_quests_dewata_conversation_trails_off_d1011d: "对话逐渐中断，你再也听不到了。"
  npc_override_dew_fild01_quests_dewata_cough_cough_404999: "咳……咳……"
  npc_override_dew_fild01_quests_dewata_could_happen_sure_97c65b: "一定会发生的吧？"
  npc_override_dew_fild01_quests_dewata_course_must_7c8330: "当然，一定是……"
  npc_override_dew_fild01_quests_dewata_course_s_our_satay_f1f6b9: "当然，是我们的^006400沙爹^000000！"
  npc_override_dew_fild01_quests_dewata_crown_whatsis_05d914: "加冕什么冠？"
  npc_override_dew_fild01_quests_dewata_damn_my_plan_ruined_i_2e32bc: "该死……我的计划泡汤了。我投入了全部财产才到达这里，但我失败了。我现在什么都做不了，我的船已经沉了。"
  npc_override_dew_fild01_quests_dewata_dangerous_place_15a179: "一个危险的地方。"
  npc_override_dew_fild01_quests_dewata_delicious_homemade_satay_6938eb: "美味的自制^006400沙爹^000000！！"
  npc_override_dew_fild01_quests_dewata_delightful_day_like_toda_d93b29: "像今天这样美好的日子值得庆祝。你不觉得吗？"
  npc_override_dew_fild01_quests_dewata_dewata_35648f: "去德瓦塔？"
  npc_override_dew_fild01_quests_dewata_dewata_always_crowded_to_d0ed50: "德瓦塔总是很热闹，但今天很安静。"
  npc_override_dew_fild01_quests_dewata_dewata_island_621110: "^8B4513德瓦塔岛^000000。"
  npc_override_dew_fild01_quests_dewata_dewata_island_always_cro_596e5a: "德瓦塔岛总是很热闹，但今天很安静。"
  npc_override_dew_fild01_quests_dewata_dewata_island_became_tou_ceb338: "^8B4513德瓦塔岛^000000已经成为旅游景点，我们已经与他们失去了联系。"
  npc_override_dew_fild01_quests_dewata_dewata_island_jaty_tribe_6582d3: "^8B4513德瓦塔岛^000000和^8B4513贾提部落^000000。"
  npc_override_dew_fild01_quests_dewata_dewata_island_people_dri_bb7ac5: "德瓦塔岛的人在大热天不怎么喝酒。"
  npc_override_dew_fild01_quests_dewata_dewata_island_you_re_sur_88c5ad: "这就是德瓦塔岛？你确定这是德瓦塔岛？"
  npc_override_dew_fild01_quests_dewata_did_i_make_you_wait_6bdc0d: "我让你等太久了吗？"
  npc_override_dew_fild01_quests_dewata_did_you_finally_get_reco_e7c1dc: "你终于得到了当地人的认可吗？"
  npc_override_dew_fild01_quests_dewata_did_you_find_poby_124cdd: "你找到波比了吗？"
  npc_override_dew_fild01_quests_dewata_did_you_gather_nuts_alre_d671e0: "你已经采集到坚果了吗？"
  npc_override_dew_fild01_quests_dewata_did_you_get_recognized_n_e67278: "你得到当地人的认可了吗？"
  npc_override_dew_fild01_quests_dewata_did_you_run_into_any_ea3c07: "你遇到什么问题了吗？"
  npc_override_dew_fild01_quests_dewata_don_t_blame_yourself_too_f6050b: "别太自责。很难抵抗^006400沙爹^000000那令人上瘾的香气。"
  npc_override_dew_fild01_quests_dewata_end_i_give_you_more_c5ea7f: "为此，我会再给你2份^006400沙爹^000000。"
  npc_override_dew_fild01_quests_dewata_endeavour_help_us_7b9cd4: "愿意尽力帮助我们。"
  npc_override_dew_fild01_quests_dewata_especially_traditional_w_9b9c85: "尤其是这种传统酒，已经传承了四代！但是^FF0000Ark^000000的供应短缺了。"
  npc_override_dew_fild01_quests_dewata_ever_since_i_became_trib_540418: "但是，自从我成为部落首领以来，制作它就遇到了困难。"
  npc_override_dew_fild01_quests_dewata_everyone_knows_about_so_2543fb: "大家都知道这件事，所以^0000FF德瓦塔岛^000000吸引了很多游客。"
  npc_override_dew_fild01_quests_dewata_exactly_pieces_oil_palm_d82b38: "正好是{0}颗油棕榈果。马上让你换油。"
  npc_override_dew_fild01_quests_dewata_excuse_me_i_urgent_matte_d600d2: "抱歉，我有急事要处理。你能等我一会儿，等我忙完再谈吗？"
  npc_override_dew_fild01_quests_dewata_excuse_me_you_lero_c64328: "打扰一下，你是莱罗吗？"
  npc_override_dew_fild01_quests_dewata_extremely_dangerous_area_4e8bef: "一个极其危险的区域。"
  npc_override_dew_fild01_quests_dewata_eyes_those_warriors_anxi_2deb09: "那些战士们在上^8B4513喀拉喀托火山^000000之前，眼神中充满了焦虑却又坚定。"
  npc_override_dew_fild01_quests_dewata_facing_cool_wind_863e52: "面对着凉爽的风。"
  npc_override_dew_fild01_quests_dewata_famous_mystical_creature_6f5b2d: "和一种著名的神秘生物。"
  npc_override_dew_fild01_quests_dewata_feathers_you_brought_cre_5701e6: "有了你带来的羽毛，制作^006400加冕冠^000000的进展更加顺利了。"
  npc_override_dew_fild01_quests_dewata_feeling_awkward_you_quic_e023dd: "- 你感到尴尬，迅速离开了。 -"
  npc_override_dew_fild01_quests_dewata_find_best_oil_master_3a19c6: "找最好的榨油大师。"
  npc_override_dew_fild01_quests_dewata_find_best_oil_master_his_260c34: "找最好的榨油大师。他的名字是^0000FF莱罗^000000。"
  npc_override_dew_fild01_quests_dewata_find_cendrawasih_feather_2f3abc: "去找15根^006400极乐鸟羽毛^000000并带给我。"
  npc_override_dew_fild01_quests_dewata_find_cendrawasih_feather_e0c674: "去找15根^006400极乐鸟羽毛^000000"
  npc_override_dew_fild01_quests_dewata_find_poby_caa675: "找到波比。"
  npc_override_dew_fild01_quests_dewata_first_blow_half_battle_cbedb2: "好的开始是成功的一半。"
  npc_override_dew_fild01_quests_dewata_first_i_need_caress_zeny_1462d1: "^FF0000首先！^009977我需要1个Caress和100,000 Zeny来强化Caress。你知道的，因为我的船沉了，我现在一分钱都没有。^000000"
  npc_override_dew_fild01_quests_dewata_first_i_thought_he_lazy_0f033b: "起初，我以为他很懒，这让我很不安。"
  npc_override_dew_fild01_quests_dewata_gather_palm_oil_fruit_br_ad3ff7: "采集^FF000060个^0000FF棕榈果^000000并带给莱罗先生。"
  npc_override_dew_fild01_quests_dewata_gatti_mumbles_740261: "- 加蒂嘟囔着。 -"
  npc_override_dew_fild01_quests_dewata_gatti_mumbles_himself_e381b5: "- 加蒂自言自语地嘟囔。 -"
  npc_override_dew_fild01_quests_dewata_gatti_shows_thing_looks_85a3e8: "- 加蒂展示了一个看起来像武器把手的东西。 -"
  npc_override_dew_fild01_quests_dewata_gatti_takes_comodo_leath_759a08: "- 加蒂从你那里拿走了科莫多皮革。 -"
  npc_override_dew_fild01_quests_dewata_give_my_thanks_i_pass_ad7ed2: "为了表达我的感谢，我要给你讲一个你可能会感兴趣的故事"
  npc_override_dew_fild01_quests_dewata_go_back_lero_get_more_643b14: "回去找莱罗要更多，如果是你的错他会给你的。"
  npc_override_dew_fild01_quests_dewata_go_see_chief_paiko_103efc: "去见酋长^0000FF派科^000000。"
  npc_override_dew_fild01_quests_dewata_good_liquid_needs_fresh_6635a1: "好酒需要好油。我做了十年的液体，每次都按时交货。"
  npc_override_dew_fild01_quests_dewata_good_same_taste_i_rememb_62f759: "好极了~~这就是我记得的味道。"
  npc_override_dew_fild01_quests_dewata_good_work_careful_while_2ef883: "干得好！运送时要小心哦~"
  npc_override_dew_fild01_quests_dewata_grandfather_had_hard_liv_4afdee: "祖父过得很艰难，因为生意不太好。"
  npc_override_dew_fild01_quests_dewata_great_leaf_falls_out_3a1303: "一片^FF0000大树叶^000000掉了出来。"
  npc_override_dew_fild01_quests_dewata_great_we_enough_wait_lit_9ab6aa: "太好了！我们够了。稍等一下。"
  npc_override_dew_fild01_quests_dewata_guy_never_broken_promise_fbc155: "这家伙10年来从未食言过，所以他一定是有什么充分的理由没来。"
  npc_override_dew_fild01_quests_dewata_hahahahahahahahaha_85292b: "哈哈哈哈哈哈哈哈……！！！"
  npc_override_dew_fild01_quests_dewata_handed_down_generation_g_4a6ac3: "代代相传，关于这顶冠冕的传奇起源就是这根羽毛……"
  npc_override_dew_fild01_quests_dewata_hard_beginners_catch_fru_dd9160: "对像我这样的新手来说很难采到果实。不，是不可能的。"
  npc_override_dew_fild01_quests_dewata_haven_t_you_delivered_sa_5e07ca: "你还没送完^006400沙爹^000000吗？"
  npc_override_dew_fild01_quests_dewata_he_climbed_tree_without_f0cbdd: "他没有带任何安全装备就爬树了，所以他可能摔下来受伤了。"
  npc_override_dew_fild01_quests_dewata_he_come_reality_he_good_1e0f12: "他会回到现实中来吗？他人很好就是懒。"
