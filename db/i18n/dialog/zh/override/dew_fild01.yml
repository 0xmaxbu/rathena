Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_dew_fild01_quests_dewata_able_use_667755: "would be able to use it."
  npc_override_dew_fild01_quests_dewata_according_sage_kasyapa_82e917: "according to sage ^0000FFKasyapa^000000"
  npc_override_dew_fild01_quests_dewata_according_sage_kasyapa_y_27ecfe: "According to Sage ^0000FFKasyapa^000000, you can help us create a ^006400Jaty Crown^000000."
  npc_override_dew_fild01_quests_dewata_after_jaty_crown_complet_043d96: "After the ^006400Jaty Crown^000000 is complete, there is a gift that I want to give to you."
  npc_override_dew_fild01_quests_dewata_ah_also_you_should_go_dd255a: "Ah, also you should go see Sage ^0000FFKasyapa^000000 who really wants to reward you with something."
  npc_override_dew_fild01_quests_dewata_ah_backache_26dba7: "Ah~ backache..."
  npc_override_dew_fild01_quests_dewata_ah_feather_53fb4d: "Ah, the feather......!"
  npc_override_dew_fild01_quests_dewata_ah_good_way_hard_gather_dccedb: "Ah, that can be a good way, but it will be hard to gather nuts as a starter."
  npc_override_dew_fild01_quests_dewata_ah_here_another_one_take_a321cc: "Ah! Here is another one. Take care not to lose it again. And keep it a secret from Mr. Lero."
  npc_override_dew_fild01_quests_dewata_ah_i_didn_t_know_e57618: "Ah! I didn't know that. I always tell Poby ^0000FF'Kemarau setahun rusak sehari.'^000000"
  npc_override_dew_fild01_quests_dewata_ah_i_understand_704d27: "Ah... I understand..."
  npc_override_dew_fild01_quests_dewata_ah_material_i_am_looking_a6c6be: "Ah! the material that I am looking for is Comodo Leather."
  npc_override_dew_fild01_quests_dewata_ah_mr_lero_made_you_6b7a0c: "Ah! Mr. Lero made you come here. I can't move because I hurt my back while climbing a tree."
  npc_override_dew_fild01_quests_dewata_ah_my_freakin_back_killi_43b790: "Ah~ my freakin' back is killing me."
  npc_override_dew_fild01_quests_dewata_ah_next_person_whom_i_a4480e: "Ah, the next person whom I want the ^006400Satay^000000 delivered to is someone who stays across from the river, the ^0000FFTribe Manager^000000."
  npc_override_dew_fild01_quests_dewata_ah_old_man_s_got_48a750: "Ah, this old man's got loose lips"
  npc_override_dew_fild01_quests_dewata_ah_right_i_forgot_about_85a4fc: "Ah, right! I forgot about Memo because the workers who gather nuts have not come yet. Sorry."
  npc_override_dew_fild01_quests_dewata_ah_right_you_busy_now_ccab7c: "Ah, right! Are you busy now?"
  npc_override_dew_fild01_quests_dewata_ah_satay_i_sampled_when_edb459: "Ah, it is the ^006400Satay^00000 that I sampled when the tribe invited me some time ago."
  npc_override_dew_fild01_quests_dewata_ah_sorry_tell_mr_lero_ee7566: "Ah! Sorry. Tell Mr. Lero that I will go back if I can find a way to move."
  npc_override_dew_fild01_quests_dewata_ah_stranger_our_land_1a8f82: "Ah, a stranger to our land."
  npc_override_dew_fild01_quests_dewata_ah_you_should_talk_sage_938603: "Ah, you should talk to Sage ^0000FFKasyapa^000000 who really wants to reward you with something."
  npc_override_dew_fild01_quests_dewata_alright_deliver_right_no_defe1b: "Alright! Deliver it right now!"
  npc_override_dew_fild01_quests_dewata_alright_let_me_begin_cra_3124ba: "Alright, let me begin crafting the ^006400Jaty Crown^000000 I feel that I am ready."
  npc_override_dew_fild01_quests_dewata_also_feather_you_receive_dbd8b4: "Also, the feather you received isn't just valuable on its own, it also is an acknowledgment from our tribe."
  npc_override_dew_fild01_quests_dewata_also_sparkling_light_83948a: "And also the sparkling light..."
  npc_override_dew_fild01_quests_dewata_also_thank_you_satay_8c294c: "Also, thank you for the ^006400Satay^000000"
  npc_override_dew_fild01_quests_dewata_also_you_brought_more_th_090434: "Also, you brought more than enough materials so after making the ^006400Jaty Crown^000000, we were able to craft a similar one for you to keep."
  npc_override_dew_fild01_quests_dewata_although_he_lazy_rather_6f990c: "Although he is lazy and rather careless, he is the best worker."
  npc_override_dew_fild01_quests_dewata_although_little_boring_0e4af8: "Although it is a little boring..."
  npc_override_dew_fild01_quests_dewata_another_land_b3b968: "from another land."
  npc_override_dew_fild01_quests_dewata_anything_go_wrong_f6e1d0: "Anything go wrong?"
  npc_override_dew_fild01_quests_dewata_anything_i_help_1899c2: "Anything I can do to help?"
  npc_override_dew_fild01_quests_dewata_anyway_i_really_thank_yo_a4ed7c: "Anyway, I really thank you."
  npc_override_dew_fild01_quests_dewata_ark_famous_tourists_guy_d20773: "Ark is famous for tourists, a guy bought many bottles by himself."
  npc_override_dew_fild01_quests_dewata_ark_needs_palm_oils_made_4c3950: "Ark needs ^0000FFPalm Oils^000000, made from Oil Palm Fruit."
  npc_override_dew_fild01_quests_dewata_as_chief_jaty_tribe_i_215408: "As Chief of the ^8B4513Jaty Tribe^000000, I wish you the best of luck!!"
  npc_override_dew_fild01_quests_dewata_as_great_powerful_chief_ee62ee: "As the Great and Powerful Chief, you should be more than enough to qualify."
  npc_override_dew_fild01_quests_dewata_as_i_told_you_before_680d30: "As I told you before, it is heavier than you might think, so be careful when carrying this."
  npc_override_dew_fild01_quests_dewata_as_representative_my_tri_d7d4e9: "As a representative of my tribe"
  npc_override_dew_fild01_quests_dewata_as_reward_your_help_63247c: "as a reward for your help."
  npc_override_dew_fild01_quests_dewata_as_tasty_as_our_tribe_a2ce1e: "It is not as tasty as our tribe's recipe, but this is an urgent task so just find it and deliver it."
  npc_override_dew_fild01_quests_dewata_as_you_see_jars_around_6a544b: "As you can see from the jars around me, I am making ^0000FFtraditional wine^000000 for a living."
  npc_override_dew_fild01_quests_dewata_ask_you_72cedf: "to ask of you."
  npc_override_dew_fild01_quests_dewata_backaches_don_t_just_go_3453ff: "Backaches don't just go away after one day."
  npc_override_dew_fild01_quests_dewata_because_today_s_oil_arri_760186: "Because today's oil has not arrived on time, I think I might have a hard time."
  npc_override_dew_fild01_quests_dewata_become_lost_tradition_re_211791: "It has become a lost tradition in recent years but until 10 or more years ago in order to become a ^8B4513Jaty Tribe^000000 warrior you had to climb Krakatau Volcano to prove your endurance."
  npc_override_dew_fild01_quests_dewata_been_good_time_all_us_534baf: "It has been a good time for all of us to share and enjoy this happy occasion together. Thank you."
  npc_override_dew_fild01_quests_dewata_behalf_my_people_68eefd: "On behalf of my people"
  npc_override_dew_fild01_quests_dewata_between_you_me_mr_memo_2a7212: "Between you and me, Mr. Memo is so fussy that he will not use any unfresh oil."
  npc_override_dew_fild01_quests_dewata_big_help_us_b7fe7e: "a big help to us..."
  npc_override_dew_fild01_quests_dewata_borobudur_temple_manager_1f9c4f: "^0000FFBorobudur Temple Manager^000000 who is in"
  npc_override_dew_fild01_quests_dewata_bring_them_chief_paiko_8cef53: "and bring them to Chief ^0000FFPaiko^000000."
  npc_override_dew_fild01_quests_dewata_but_bda5a6: "But?"
  npc_override_dew_fild01_quests_dewata_but_this_5f37dd: "but...... this...."
  npc_override_dew_fild01_quests_dewata_calm_down_chief_paiko_7daac3: "Calm down ^0000FFChief Paiko^000000..."
  npc_override_dew_fild01_quests_dewata_cendrawasih_feather_owne_45aea4: "This ^8B4513Cendrawasih Feather^000000 was owned by our first tribe leader when the crown was originally created."
  npc_override_dew_fild01_quests_dewata_come_again_8dbf06: "come again."
  npc_override_dew_fild01_quests_dewata_come_speak_me_again_3b8b2f: "come speak with me again."
  npc_override_dew_fild01_quests_dewata_comodo_leather_8d42b1: "Comodo Leather?"
  npc_override_dew_fild01_quests_dewata_comodo_leather_best_mate_28c955: "Comodo Leather is the best material ever."
  npc_override_dew_fild01_quests_dewata_comodo_leather_steel_ori_516283: "100 Comodo Leather, 20 Steel, and 10 Oridecon are what I need."
  npc_override_dew_fild01_quests_dewata_conversation_trails_off_d1011d: "The conversation trails off and you don't hear any more."
  npc_override_dew_fild01_quests_dewata_cough_cough_404999: "Cough... cough..."
  npc_override_dew_fild01_quests_dewata_could_happen_sure_97c65b: "Could it happen for sure?"
  npc_override_dew_fild01_quests_dewata_course_must_7c8330: "Of course, it must be..."
  npc_override_dew_fild01_quests_dewata_course_s_our_satay_f1f6b9: "Of course, it's our ^006400Satay^000000!"
  npc_override_dew_fild01_quests_dewata_crown_whatsis_05d914: "Crown-a-whatsis?"
  npc_override_dew_fild01_quests_dewata_damn_my_plan_ruined_i_2e32bc: "Damn... My plan is ruined. I invested all my fortunes to get there, but I failed. I can't do anything now, my boat has been wrecked."
  npc_override_dew_fild01_quests_dewata_dangerous_place_15a179: "a dangerous place."
  npc_override_dew_fild01_quests_dewata_delicious_homemade_satay_6938eb: "delicious homemade ^006400Satay^000000!!"
  npc_override_dew_fild01_quests_dewata_delightful_day_like_toda_d93b29: "A delightful day like today should be celebrated. Don't you think?"
  npc_override_dew_fild01_quests_dewata_dewata_35648f: "to Dewata?"
  npc_override_dew_fild01_quests_dewata_dewata_always_crowded_to_d0ed50: "Dewata is always crowded but today is quiet."
  npc_override_dew_fild01_quests_dewata_dewata_island_621110: "^8B4513Dewata Island^000000."
  npc_override_dew_fild01_quests_dewata_dewata_island_always_cro_596e5a: "Dewata island is always crowded but today is quiet."
  npc_override_dew_fild01_quests_dewata_dewata_island_became_tou_ceb338: "^8B4513Dewata Island^000000 has became a tourist attraction and we have lost touch with them."
  npc_override_dew_fild01_quests_dewata_dewata_island_jaty_tribe_6582d3: "^8B4513Dewata Island^000000 and ^8B4513Jaty tribe^000000."
  npc_override_dew_fild01_quests_dewata_dewata_island_people_dri_bb7ac5: "Dewata island people do not drink much in the hot weather."
  npc_override_dew_fild01_quests_dewata_dewata_island_you_re_sur_88c5ad: "This is Dewata Island? You're sure this is Dewata Island?"
  npc_override_dew_fild01_quests_dewata_did_i_make_you_wait_6bdc0d: "Did I make you wait too long?"
  npc_override_dew_fild01_quests_dewata_did_you_finally_get_reco_e7c1dc: "Did you finally get the recognition from natives?"
  npc_override_dew_fild01_quests_dewata_did_you_find_poby_124cdd: "Did you find Poby?"
  npc_override_dew_fild01_quests_dewata_did_you_gather_nuts_alre_d671e0: "Did you gather the nuts already?"
  npc_override_dew_fild01_quests_dewata_did_you_get_recognized_n_e67278: "Did you get recognized by the natives?"
  npc_override_dew_fild01_quests_dewata_did_you_run_into_any_ea3c07: "Did you run into any problems?"
  npc_override_dew_fild01_quests_dewata_don_t_blame_yourself_too_f6050b: "Don't blame yourself too much. It is difficult to resist the ^006400Satay^000000's addicting aroma."
  npc_override_dew_fild01_quests_dewata_end_i_give_you_more_c5ea7f: "To this end, I will give you 2 more servings of ^006400Satay^000000."
  npc_override_dew_fild01_quests_dewata_endeavour_help_us_7b9cd4: "would endeavour to help us."
  npc_override_dew_fild01_quests_dewata_especially_traditional_w_9b9c85: "Especially this traditional wine, which has been made for four generations! But ^FF0000Ark^000000 is short of supply."
  npc_override_dew_fild01_quests_dewata_ever_since_i_became_trib_540418: "But, ever since I became the tribe leader there have been difficulties making it."
  npc_override_dew_fild01_quests_dewata_everyone_knows_about_so_2543fb: "Everyone knows about this, so ^0000FFDewata island^000000 attracts many tourists."
  npc_override_dew_fild01_quests_dewata_exactly_pieces_oil_palm_d82b38: "Exactly {0} pieces of oil palm nuts. Let you exchange them with oil right now."
  npc_override_dew_fild01_quests_dewata_excuse_me_i_urgent_matte_d600d2: "Excuse me, but I have an urgent matter to attend to. Can you wait for a while and talk to me when I'm done?"
  npc_override_dew_fild01_quests_dewata_excuse_me_you_lero_c64328: "Excuse me, but are you Lero?"
  npc_override_dew_fild01_quests_dewata_extremely_dangerous_area_4e8bef: "an extremely dangerous area."
  npc_override_dew_fild01_quests_dewata_eyes_those_warriors_anxi_2deb09: "The eyes of those warriors were anxious yet determined before going up ^8B4513Krakatau Volcano^000000."
  npc_override_dew_fild01_quests_dewata_facing_cool_wind_863e52: "facing the cool wind."
  npc_override_dew_fild01_quests_dewata_famous_mystical_creature_6f5b2d: "and a famous mystical creature."
  npc_override_dew_fild01_quests_dewata_feathers_you_brought_cre_5701e6: "With the feathers that you have brought creating a ^006400Jaty Crown^000000 is going much more smoothly."
  npc_override_dew_fild01_quests_dewata_feeling_awkward_you_quic_e023dd: "- Feeling awkward, you quickly leave. -"
  npc_override_dew_fild01_quests_dewata_find_best_oil_master_3a19c6: "Find the best oil master."
  npc_override_dew_fild01_quests_dewata_find_best_oil_master_his_260c34: "Find the best oil master. His name is ^0000FFLero^000000."
  npc_override_dew_fild01_quests_dewata_find_cendrawasih_feather_2f3abc: "Find 15 ^006400Cendrawasih Feather^000000s and bring them to me."
  npc_override_dew_fild01_quests_dewata_find_cendrawasih_feather_e0c674: "Find 15 of ^006400Cendrawasih Feather^000000"
  npc_override_dew_fild01_quests_dewata_find_poby_caa675: "Find Poby."
  npc_override_dew_fild01_quests_dewata_first_blow_half_battle_cbedb2: "The first blow is half the battle."
  npc_override_dew_fild01_quests_dewata_first_i_need_caress_zeny_1462d1: "^FF0000First!^009977 I need 1 Caress and 100,000 zeny to reinforce the Caress. As you know, I don't have any money right now because my ship got wrecked.^000000"
  npc_override_dew_fild01_quests_dewata_first_i_thought_he_lazy_0f033b: "First, I thought that he was lazy and it made me very uneasy."
  npc_override_dew_fild01_quests_dewata_gather_palm_oil_fruit_br_ad3ff7: "Gather ^FF000060 ^0000FFPalm Oil Fruit^000000 and bring them to Mr. Lero."
  npc_override_dew_fild01_quests_dewata_gatti_mumbles_740261: "- Gatti mumbles. -"
  npc_override_dew_fild01_quests_dewata_gatti_mumbles_himself_e381b5: "- Gatti mumbles to himself. -"
  npc_override_dew_fild01_quests_dewata_gatti_shows_thing_looks_85a3e8: "- Gatti shows a thing that looks like a handle of a weapon. -"
  npc_override_dew_fild01_quests_dewata_gatti_takes_comodo_leath_759a08: "- Gatti takes the Comodo Leather from you. -"
  npc_override_dew_fild01_quests_dewata_give_my_thanks_i_pass_ad7ed2: "To give my thanks I will pass along a story that may interest you"
  npc_override_dew_fild01_quests_dewata_go_back_lero_get_more_643b14: "Go back to Lero and get more, he will give you more if it was your mistake."
  npc_override_dew_fild01_quests_dewata_go_see_chief_paiko_103efc: "Go see Chief ^0000FFPaiko^000000."
  npc_override_dew_fild01_quests_dewata_good_liquid_needs_fresh_6635a1: "Good liquid needs fresh oil. I was able to make liquid for ten years and deliver it all on time."
  npc_override_dew_fild01_quests_dewata_good_same_taste_i_rememb_62f759: "Good~~ This is the same taste I remember."
  npc_override_dew_fild01_quests_dewata_good_work_careful_while_2ef883: "Good work! Be careful while delivering them~"
  npc_override_dew_fild01_quests_dewata_grandfather_had_hard_liv_4afdee: "Grandfather had a hard living since he didn't get many good sales."
  npc_override_dew_fild01_quests_dewata_great_leaf_falls_out_3a1303: "a ^FF0000Great Leaf^000000 falls out."
  npc_override_dew_fild01_quests_dewata_great_we_enough_wait_lit_9ab6aa: "Great! We have enough. Wait a little."
  npc_override_dew_fild01_quests_dewata_guy_never_broken_promise_fbc155: "This guy has never broken a promise for 10 years, so he must have a really good reason not to come."
  npc_override_dew_fild01_quests_dewata_hahahahahahahahaha_85292b: "Hahahahahahahahaha...!!!"
  npc_override_dew_fild01_quests_dewata_handed_down_generation_g_4a6ac3: "Handed down from generation to generation the legendary origin of the crown is this feather..."
  npc_override_dew_fild01_quests_dewata_hard_beginners_catch_fru_dd9160: "It is hard for beginners to catch the fruit like me. No it's impossible."
  npc_override_dew_fild01_quests_dewata_haven_t_you_delivered_sa_5e07ca: "Haven't you delivered the ^006400Satay^000000 yet?"
  npc_override_dew_fild01_quests_dewata_he_climbed_tree_without_f0cbdd: "He climbed the tree without any safety equipment, so he might've fallen down and gotten injured."
  npc_override_dew_fild01_quests_dewata_he_come_reality_he_good_1e0f12: "Does he come to reality? He is good but lazy."
  npc_override_dew_fild01_quests_dewata_he_might_troublesome_ple_20b892: "He might be troublesome, but please visit the Jaty village. Lero must complete the oil."
  npc_override_dew_fild01_quests_dewata_he_seems_asking_island_n_44d99f: "- He seems to be asking for the Island name. -"
  npc_override_dew_fild01_quests_dewata_healthy_safe_traveler_so_b7e64a: "Be healthy and safe, traveler so you can live to tell the tale of your adventures."
  npc_override_dew_fild01_quests_dewata_heavier_than_you_might_t_847493: "It is heavier than you might think, so be careful when carrying it."
  npc_override_dew_fild01_quests_dewata_help_us_very_simple_5b81ac: "help us is very simple."
  npc_override_dew_fild01_quests_dewata_helpful_deeds_85465c: "helpful deeds..."
  npc_override_dew_fild01_quests_dewata_here_caress_ask_me_any_fd547b: "Here is the Caress! Ask me any time."
  npc_override_dew_fild01_quests_dewata_here_you_go_i_make_fe6315: "Here you go. I can make a Caress if you bring me 10 Oridecon, 20 Steel, and 70 Comodo Leather."
  npc_override_dew_fild01_quests_dewata_hey_i_ve_been_waiting_5ab3b4: "Hey, I've been waiting for you. I didn't know that Poby's injury would make my life so difficult."
  npc_override_dew_fild01_quests_dewata_hey_there_young_you_arou_56f671: "Hey there, young {0}~ Are you from around here?"
  npc_override_dew_fild01_quests_dewata_hilt_cf635b: "Hilt?"
  npc_override_dew_fild01_quests_dewata_his_name_again_lero_2142a4: "His name again is ^0000FFLero^000000."
  npc_override_dew_fild01_quests_dewata_hmm_704656: "Hmm!!!"
  npc_override_dew_fild01_quests_dewata_hmm_d17461: "Hmm...."
  npc_override_dew_fild01_quests_dewata_hmm_i_need_more_those_6c32b8: "Hmm... I need more of those. If my ship didn't get wrecked, I could made it on my own, but..."
  npc_override_dew_fild01_quests_dewata_hmm_i_no_choice_28d30e: "Hmm, I have no choice."
  npc_override_dew_fild01_quests_dewata_hmm_like_46c717: "Hmm... Like this?"
  npc_override_dew_fild01_quests_dewata_hmm_s_okay_36c9f1: "Hmm, it's okay."
  npc_override_dew_fild01_quests_dewata_hmm_sorry_i_couldn_t_d16b1c: "Hmm... Sorry I couldn't get the Palm Oil right now."
  npc_override_dew_fild01_quests_dewata_hold_right_there_592b48: "- Hold it right there!! -"
  npc_override_dew_fild01_quests_dewata_how_poby_7b0e0f: "How is Poby?"
  npc_override_dew_fild01_quests_dewata_huh_so_you_couldn_t_dd0576: "Huh... so you couldn't resist yourself, eh?"
  npc_override_dew_fild01_quests_dewata_i_about_give_up_there_72f689: "I was about to give up, but there was some fine print on the blueprint saying that it could be found on the Dewata Island."
  npc_override_dew_fild01_quests_dewata_i_am_certain_626a1e: "Of this I am certain."
  npc_override_dew_fild01_quests_dewata_i_am_certain_when_we_6ecba2: "I am not certain of when we will cross paths again but I hope we will meet again someday."
  npc_override_dew_fild01_quests_dewata_i_am_leader_tribe_b5e9e8: "I am the leader of this tribe"
  npc_override_dew_fild01_quests_dewata_i_am_sure_village_jaty_25e541: "I am sure in the village of the ^8B4513Jaty Tribe^000000 there are many legendary stories."
  npc_override_dew_fild01_quests_dewata_i_am_unsure_what_missing_a8a360: "I am unsure of what is missing but that traveler could be big help in creating the ^006400Jaty Crown^000000."
