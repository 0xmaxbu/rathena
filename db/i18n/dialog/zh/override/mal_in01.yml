Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_lasagna_lasagna_npcs_you_need_zeny_heal_all_7388cf: "需要 5,000 Zeny 才能完全治愈。要我帮你吗？"
  npc_override_lasagna_lasagna_npcs_you_needed_some_manpower_39ec35: "你需要一些帮手……"
  npc_override_lasagna_lasagna_npcs_you_never_know_so_you_492d5e: "但谁也说不准，所以你明天能再来一趟吗？"
  npc_override_lasagna_lasagna_npcs_you_no_idea_dex_comes_d3039d: "你根本不懂！想要攻击命中，DEX 才是第一位！！"
  npc_override_lasagna_lasagna_npcs_you_no_idea_how_cool_94a7b9: "你根本不知道我们的团长佩佩隆奇诺有多酷……"
  npc_override_lasagna_lasagna_npcs_you_no_idea_what_kind_f20c1b: "你根本不知道闪耀之草会产出什么样的药草。"
  npc_override_lasagna_lasagna_npcs_you_obtain_herbs_these_g_2a6d89: "你可以从这些草中获得药草。"
  npc_override_lasagna_lasagna_npcs_you_obtained_enough_hard_a6e34c: "- 你已经获得了足够的硬荆棘藤。"
  npc_override_lasagna_lasagna_npcs_you_obtained_hard_thorny_5b8ab8: "- 你获得了一根硬荆棘藤。 -"
  npc_override_lasagna_lasagna_npcs_you_pay_little_service_f_4f8baa: "你支付一点服务费，就可以安全存放你的物品。"
  npc_override_lasagna_lasagna_npcs_you_place_i_am_just_a7aaaa: "你已经就位了。我只是在起航前检查一下大家是否都在正确的位置上。"
  npc_override_lasagna_lasagna_npcs_you_plucked_red_herbs_ju_08f4f1: "你采的红色药草刚刚好。"
  npc_override_lasagna_lasagna_npcs_you_punk_you_getting_shi_62179c: "你才是那个混蛋。你要上船吗？"
  npc_override_lasagna_lasagna_npcs_you_rat_us_a1cb71: "是你要出卖我们。"
  npc_override_lasagna_lasagna_npcs_you_re_about_go_journey_f26be2: "你即将踏上旅途，她会帮上大忙的。"
  npc_override_lasagna_lasagna_npcs_you_re_as_dependable_as_cdb5e8: "你还是那么可靠。"
  npc_override_lasagna_lasagna_npcs_you_re_back_e65dc8: "你回来了。"
  npc_override_lasagna_lasagna_npcs_you_re_big_still_call_6a400a: "你都这么大了还自称是孩子？"
  npc_override_lasagna_lasagna_npcs_you_re_here_again_i_80b613: "你又来了。但我还不需要粘性蛙蹼。你昨天送来的已经够了。"
  npc_override_lasagna_lasagna_npcs_you_re_here_already_we_dc7687: "你已经来了。我们讨厌等待，所以正考虑干脆就在这里定居了。"
  npc_override_lasagna_lasagna_npcs_you_re_here_you_help_1655c7: "你来了。今天也能帮我吗？"
  npc_override_lasagna_lasagna_npcs_you_re_interested_too_9492f7: "你也感兴趣？"
  npc_override_lasagna_lasagna_npcs_you_re_just_full_91ec1b: "你真是满嘴胡话。"
  npc_override_lasagna_lasagna_npcs_you_re_new_world_what_565343: "你来自新世界？新世界的人找我有什么事？"
  npc_override_lasagna_lasagna_npcs_you_re_our_adventurers_c_674dbd: "你是我们冒险者俱乐部的 {0}，对吧？"
  npc_override_lasagna_lasagna_npcs_you_re_really_big_type_d9c5c5: "你块头真大，而且那种糟糕的发型真的不适合你……"
  npc_override_lasagna_lasagna_npcs_you_re_so_good_summing_a3ee85: "你总结得太好了！"
  npc_override_lasagna_lasagna_npcs_you_re_still_done_yet_73cb61: "你还没做完呢。请抓五只草精和五只叶精。"
  npc_override_lasagna_lasagna_npcs_you_re_still_skilled_stu_33e663: "但你这么有本事，困在这里干活太可惜了。要不要去找点别的做？"
  npc_override_lasagna_lasagna_npcs_you_re_taking_my_honey_e00162: "你不许动我的蜂蜜！"
  npc_override_lasagna_lasagna_npcs_you_re_too_young_just_c6aad0: "你太小了！直接加入义警团吧。"
  npc_override_lasagna_lasagna_npcs_you_ready_action_speaks_3ef3d7: "准备好了吗？行动胜于言语！开始烹饪吧！"
  npc_override_lasagna_lasagna_npcs_you_really_startled_me_i_dc7e1b: "你真的吓到我了……我还以为是约吉。"
  npc_override_lasagna_lasagna_npcs_you_really_want_sign_you_62e8be: "你真的想报名参加你人生中最糟糕的航行吗？"
  npc_override_lasagna_lasagna_npcs_you_remember_anything_ab_606a75: "你还记得什么吗？"
  npc_override_lasagna_lasagna_npcs_you_remember_me_7bf448: "你还记得我。"
  npc_override_lasagna_lasagna_npcs_you_reset_skills_statuse_04bb63: "^4d4dff你可以通过催眠师重置技能和状态^000000。只是让你知道可以这么做。"
  npc_override_lasagna_lasagna_npcs_you_right_i_had_no_1dface: "你说得对。我无所畏惧。我喜欢冒险之类的事。我就是这样来到了千层面，在遇到甘贝里船长后成为了孔-克利纳号的水手长。"
  npc_override_lasagna_lasagna_npcs_you_running_away_d2f972: "你想逃跑？！"
  npc_override_lasagna_lasagna_npcs_you_said_you_come_if_8923bc: "你说过你想来的时候会来的。"
  npc_override_lasagna_lasagna_npcs_you_said_you_ll_slap_233037: "你说过总有一天要用一沓钞票打他们的脸。"
  npc_override_lasagna_lasagna_npcs_you_say_we_play_key_71d25f: "可以说我们在这个镇上扮演着关键角色！"
  npc_override_lasagna_lasagna_npcs_you_saying_me_hear_don_5077ae: "你是说给我听的吧。你想都别想。我也累了。"
  npc_override_lasagna_lasagna_npcs_you_see_doram_over_there_7b907f: "你看到那边的喵族了吗？他是^4d4dff阿利奥^000000。他会告诉你一些有用的东西。去见见他吧。"
  npc_override_lasagna_lasagna_npcs_you_see_i_upset_stomach_581e88: "你看，我胃不舒服。"
  npc_override_lasagna_lasagna_npcs_you_see_kalu_really_need_89a981: "你看，卡鲁真的需要卡鲁纳。没有卡鲁纳，他的生意就做不下去了。"
  npc_override_lasagna_lasagna_npcs_you_see_tartufi_breathes_b8bc3d: "你看，塔尔图菲受到攻击时会喷火，烟雾会笼罩整个城镇。这让人们无法自由通行。"
  npc_override_lasagna_lasagna_npcs_you_see_those_eggring_wa_b83245: "你看到那边那些^4d4dff蛋精^000000在游荡吗？"
  npc_override_lasagna_lasagna_npcs_you_see_yourself_9d9e49: "你得亲眼看看才行。"
  npc_override_lasagna_lasagna_npcs_you_seem_some_grudge_aga_9a0ace: "你似乎对我们有些怨气。等莱加拉斯一来，我就把一切都告诉他。"
  npc_override_lasagna_lasagna_npcs_you_seem_too_skilled_kin_9db367: "但你看起来太熟练了，不该做这种工作。还有很多其他需要体力的工作，也许你应该去找找看。"
  npc_override_lasagna_lasagna_npcs_you_seem_trouble_what_ma_51a8b4: "你好像遇到麻烦了。怎么回事？"
  npc_override_lasagna_lasagna_npcs_you_seem_understand_so_w_bc64ba: "你似乎理解得很好。我喜欢。顺便问一下，你叫什么名字？哈哈……"
  npc_override_lasagna_lasagna_npcs_you_should_bring_box_too_1584db: "你应该先把那个箱子带到道具店去，对吧？"
  npc_override_lasagna_lasagna_npcs_you_should_bring_ice_cub_0d734f: "你应该带^0000cd20 个冰块^000000来。这是为了保鲜储存的食物。请快点。"
  npc_override_lasagna_lasagna_npcs_you_should_equip_your_we_868128: "^4d4dff你应该装备你的武器。^000000"
  npc_override_lasagna_lasagna_npcs_you_should_give_try_ten_24f8d7: "你应该试试。十只大黄蜂不算太重。"
  npc_override_lasagna_lasagna_npcs_you_should_go_meet_head_491c68: "你应该去见主厨、舵手和水手长。他们在走廊尽头的餐厅里。"
  npc_override_lasagna_lasagna_npcs_you_should_go_ravioli_fo_592d5b: "你应该去拉维奥利森林。请带五个粘性蛙蹼来。"
  npc_override_lasagna_lasagna_npcs_you_should_go_see_captai_db36f8: "你应该去见船长和首席官。所有人都在等着出发。"
  npc_override_lasagna_lasagna_npcs_you_should_hire_us_746709: "你应该雇用我们。"
  npc_override_lasagna_lasagna_npcs_you_should_know_what_her_ae0c9e: "你应该知道药草长什么样。"
  npc_override_lasagna_lasagna_npcs_you_should_learn_new_bas_0061f8: "你应该先学习新的基础技能。"
  npc_override_lasagna_lasagna_npcs_you_should_learn_some_ba_a1108b: "如果你想使用仓库，应该先学习一些基础技能。"
  npc_override_lasagna_lasagna_npcs_you_should_take_nice_wor_418976: "你应该收下这个。干得好。"
  npc_override_lasagna_lasagna_npcs_you_should_teach_us_fc6628: "你应该教教我们。"
  npc_override_lasagna_lasagna_npcs_you_should_thank_me_nyo_6ff82e: "你应该感谢我。嚯嚯！"
  npc_override_lasagna_lasagna_npcs_you_should_toss_him_sayi_e04d20: "你应该把这个扔给他，同时喊^0000cd「新手来了！」^000000。他相信喵族在第一次航行时说出这句话会带来好运。总之，他好像认为这是正确的做法。"
  npc_override_lasagna_lasagna_npcs_you_snubbing_us_77be6a: "你是在冷落我们吗？"
  npc_override_lasagna_lasagna_npcs_you_someone_you_re_close_e6c3ff: "……你有没有亲近的人，希望他们平安幸福？"
  npc_override_lasagna_lasagna_npcs_you_special_encounter_490afb: "这是为你这次特别的相遇准备的。"
  npc_override_lasagna_lasagna_npcs_you_stand_up_2062ed: "你能站起来吗？"
  npc_override_lasagna_lasagna_npcs_you_startled_me_least_487fd1: "你至少吓到我了。"
  npc_override_lasagna_lasagna_npcs_you_survive_through_day_450e54: "有了^0000cd每日护符^000000，你就能平安度过一天。我想你现在应该和萨满喵更亲近一些了。"
  npc_override_lasagna_lasagna_npcs_you_t_just_carry_around_652669: "你总不能把所有物品都随身带着，对吧？"
  npc_override_lasagna_lasagna_npcs_you_t_recover_naturally_02aa7a: "如果你携带的物品超过最大负重量的 50%，就无法自然恢复。"
  npc_override_lasagna_lasagna_npcs_you_taken_care_already_y_bafdbb: "你已经处理好了？真快。我现在要休息了。你可以走了！"
  npc_override_lasagna_lasagna_npcs_you_talk_others_same_way_85d8b2: "你可以用刚才跟我说话的方式和其他人交谈。"
  npc_override_lasagna_lasagna_npcs_you_tell_bundle_right_i_8a811d: "从这行头就能看出来，对吧？我不是新手冒险者。我是到处旅行卖东西的商人。"
  npc_override_lasagna_lasagna_npcs_you_think_i_d_give_7eea5e: "你以为我会屈服于那个？"
  npc_override_lasagna_lasagna_npcs_you_think_s_looking_us_793fe1: "你觉得它也在找我们吗？"
  npc_override_lasagna_lasagna_npcs_you_think_there_s_such_27f6b0: "你觉得有那样的地方吗？"
  npc_override_lasagna_lasagna_npcs_you_threatened_them_join_f574aa: "你威胁他们要么加入要么滚蛋。"
  npc_override_lasagna_lasagna_npcs_you_tiny_rat_now_tell_7a67a8: "你这小老鼠！现在告诉我。我不觉得像你这样的新手能自己想到这个。是谁派你来的？"
  npc_override_lasagna_lasagna_npcs_you_too_many_items_f33594: "- 你的物品太多了。 -"
  npc_override_lasagna_lasagna_npcs_you_took_care_those_wild_86f2a8: "你安全地处理了那些野生大黄蜂。真是太厉害了。"
  npc_override_lasagna_lasagna_npcs_you_turned_our_ship_beca_cc7e7b: "因为斯特洛声称昨晚看到了奇怪的东西，所以你改变了我们的航向。那是一条我们从未见过的航线。大家意见不一，但既然我们已经搜索了所有能搜的地方，就决定试一试。"
  npc_override_lasagna_lasagna_npcs_you_understand_cde36c: "你明白吗？"
  npc_override_lasagna_lasagna_npcs_you_use_equip_item_doubl_5509ec: "^4d4dff你可以通过双击来使用或装备物品。"
  npc_override_lasagna_lasagna_npcs_you_using_your_skills_we_5ed1fa: "你在狩猎时有好好使用你的^4d4dff技能^000000吗？"
  npc_override_lasagna_lasagna_npcs_you_ve_been_ravioli_fore_f2878e: "你去过拉维奥利森林，对吧？"
  npc_override_lasagna_lasagna_npcs_you_ve_been_troublesome_67e2ae: "你们已经够麻烦的了。今天你们都怎么了？你们都是虎蛾还是什么的？"
  npc_override_lasagna_lasagna_npcs_you_ve_been_troublesome_b62cfa: "你们已经够麻烦的了。今天你们都怎么了？猛虎拳还不够？你们都是虎蛾还是什么的？"
  npc_override_lasagna_lasagna_npcs_you_ve_brought_pretty_go_bb101c: "你带来的东西相当不错。"
  npc_override_lasagna_lasagna_npcs_you_ve_got_minutes_no_88bd40: "你有 10 分钟。不多不少！"
  npc_override_lasagna_lasagna_npcs_you_ve_got_them_perfect_adc36e: "你拿到了，完美。"
  npc_override_lasagna_lasagna_npcs_you_ve_had_enough_b99586: "你够了！"
  npc_override_lasagna_lasagna_npcs_you_want_know_future_pas_486286: "你想知道未来？还是过去？如果你知道自己站在何处，就能看到过去、未来，一切。"
  npc_override_lasagna_lasagna_npcs_you_wanted_me_dead_c45c34: "你想让我死？"
  npc_override_lasagna_lasagna_npcs_you_wouldn_t_get_ship_faee18: "你不把它带来给我就别想上船！"
  npc_override_lasagna_lasagna_npcs_you_you_re_picking_fight_c8e7d4: "你！你又在找无辜路人的茬？"
  npc_override_lasagna_lasagna_npcs_you_your_way_meet_sous_ebae59: "你正在去见副厨师长的路上。他在走廊尽头的餐厅里。"
  npc_override_lasagna_lasagna_npcs_young_person_like_you_ra_b35f9c: "像你这样的年轻人现在很少见了。"
  npc_override_lasagna_lasagna_npcs_your_business_well_stran_b2c3a4: "这不关你的事……嗯，^0000cd按理说应该是由来自新地方的陌生人来解决这个问题^000000。"
  npc_override_lasagna_lasagna_npcs_your_first_test_9f42b4: "这是你的第一次测试。"
  npc_override_lasagna_lasagna_npcs_your_first_time_con_chli_3f3e47: "这是你第一次乘坐孔-克利纳号吗？我训练结束后曾经坐过这艘船去新世界。那时候食物真的很好，所以……"
  npc_override_lasagna_lasagna_npcs_your_first_time_here_73bc58: "这是你第一次来这里吗？"
  npc_override_lasagna_lasagna_npcs_your_items_lost_so_sure_69105f: "你的物品可能会丢失，所以一定要确保自己的负重为 ^FF00000^000000。"
  npc_override_lasagna_lasagna_npcs_your_language_as_vulgar_e49a09: "你的言语和你的外表一样粗俗。"
  npc_override_lasagna_lasagna_npcs_your_name_height_must_co_2303c9: "你的名字是……{0}……身高应该是……颜色是……像这样……你的口音……你一定在帕内住过，然后搬到了邦戈拉。"
  npc_override_lasagna_lasagna_npcs_your_name_strange_too_f9d96a: "你的名字也很奇怪。"
  npc_override_lasagna_lasagna_npcs_your_own_good_just_go_a18281: "这是为你好。回你来的地方去吧。"
  npc_override_lasagna_lasagna_npcs_your_skill_been_reset_su_5b1284: "你的技能已成功重置！"
  npc_override_lasagna_lasagna_npcs_your_status_been_reset_s_ca1b2a: "你的状态已成功重置！"
  npc_override_lasagna_lasagna_npcs_your_way_perhaps_you_bea_351471: "在路上，你可以顺便打倒变异孢子来训练。顺便抓大约十只变异孢子。"
  npc_override_lasagna_lasagna_npcs_zzz_zzz_0e2284: "呼……呼……"
  npc_override_lasagna_lasagna_npcs_zzz_zzzz_c4ec8f: "呼……呼呼……"
  npc_override_mal_in01_malangdo_costume_apply_enchant_d99453: "应用附魔。"
  npc_override_mal_in01_malangdo_costume_beautiful_eb49f1: "太美了！！"
  npc_override_mal_in01_malangdo_costume_bring_your_costume_garme_d25e90: "带上你的^ff0000时装披风^000000和^ff0000披风附魔石^000000，我会为你完成完美的升级！"
  npc_override_mal_in01_malangdo_costume_bye_c8ffa5: "再见~"
  npc_override_mal_in01_malangdo_costume_cancel_77dfd2: "取消"
  npc_override_mal_in01_malangdo_costume_caution_93cd42: "^FF0000   !!! 注意 !!!^000000"
  npc_override_mal_in01_malangdo_costume_come_back_after_clearing_49506c: "清理一些背包空间后再来吧。"
  npc_override_mal_in01_malangdo_costume_come_back_again_later_e1307c: "'- 稍后再来吧！ -'"
  npc_override_mal_in01_malangdo_costume_continue_conversation_577225: "继续对话"
  npc_override_mal_in01_malangdo_costume_costume_currently_availa_88d140: "这件时装目前无法升级。"
  npc_override_mal_in01_malangdo_costume_costume_t_enhanced_locat_a3f93a: "这件时装无法在此位置进行强化。"
  npc_override_mal_in01_malangdo_costume_crash_i_cannot_show_fail_ee1c3d: "失败了！！！！！我不能让这种失败展现在世人面前！！！"
  npc_override_mal_in01_malangdo_costume_did_i_really_made_myself_62fd7f: "这真的是我自己做的吗？！！！"
  npc_override_mal_in01_malangdo_costume_don_t_forget_bring_your_bf6df9: "别忘了带上^ff0000你自己的时装和时装附魔石^000000~"
  npc_override_mal_in01_malangdo_costume_don_t_pity_me_i_3cf3a6: "不要同情我！我很清楚自己的外表，但我喜欢内在的自己。"
  npc_override_mal_in01_malangdo_costume_don_t_so_cruel_your_0f876c: "不要对你的肩膀那么残忍！"
  npc_override_mal_in01_malangdo_costume_end_conversation_42803e: "结束对话。"
  npc_override_mal_in01_malangdo_costume_exchange_5b13ea: "交换"
  npc_override_mal_in01_malangdo_costume_exchange_completed_378106: "交换完成。"
  npc_override_mal_in01_malangdo_costume_exchange_costume_random_aa0fa6: "用时装交换随机附魔箱"
  npc_override_mal_in01_malangdo_costume_great_i_m_fully_ready_da5a34: "太好了！！我已经完全准备好这次升级了！！"
