Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@md_pay_WeekendDungeon_before_we_start_setting_2ad571: "Before we start setting up the environment here, we'll give you the chance to choose an appropriate difficulty level."
  npc_override_1@md_pay_WeekendDungeon_besides_experience_gain_1624b0: "Besides, the experience gain here is very generous."
  npc_override_1@md_pay_WeekendDungeon_cancel_77dfd2: "Cancel"
  npc_override_1@md_pay_WeekendDungeon_come_back_whenever_you_n_335d6d: "Come back whenever you need packaging services!"
  npc_override_1@md_pay_WeekendDungeon_confirm_spend_z_package_ff9d26: "Confirm to spend {0}z to package 5 <ITEM>{1}<INFO>{2}</INFO></ITEM> into <ITEM>{3}<INFO>{4}</INFO></ITEM>?"
  npc_override_1@md_pay_WeekendDungeon_cooldown_expired_a04925: "The cooldown has expired."
  npc_override_1@md_pay_WeekendDungeon_good_luck_d53846: "Good luck~"
  npc_override_1@md_pay_WeekendDungeon_good_luck_finding_treasu_d3bdff: "Good luck finding the treasures!"
  npc_override_1@md_pay_WeekendDungeon_i_could_make_my_own_0ed3e8: "I could make my own choice, but each person handles it differently based on their abilities."
  npc_override_1@md_pay_WeekendDungeon_i_hope_see_you_when_7309ee: "I hope to see you when the weekend arrives~"
  npc_override_1@md_pay_WeekendDungeon_i_offer_packaging_servic_ef5bd4: "I offer packaging services for those who wish to present a precious gift to a cherished one."
  npc_override_1@md_pay_WeekendDungeon_i_think_you_re_just_e36535: "I think you're just about ready."
  npc_override_1@md_pay_WeekendDungeon_if_you_attempt_tame_any_3db37c: "^ff0000If you attempt to tame any monsters, it will not count as a kill. Please be careful.^000000"
  npc_override_1@md_pay_WeekendDungeon_if_you_units_item_info_dc5cfa: "If you have 5 units of <ITEM>{0}<INFO>23143</INFO></ITEM> or <ITEM>{1}<INFO>23142</INFO></ITEM>, I can pack it for just ^FF0000{2}^000000 Zeny!"
  npc_override_1@md_pay_WeekendDungeon_looking_around_s_obvious_fd5f32: "^0000FFLooking around, it's obvious that Marry Jae is talking to you.^000000"
  npc_override_1@md_pay_WeekendDungeon_memorial_dungeon_been_cr_a43d8a: "The Memorial Dungeon has been created."
  npc_override_1@md_pay_WeekendDungeon_menu_saturday_2f96b5: "^0000FFSaturday 00:00 ~ Sunday 23:59^000000"
  npc_override_1@md_pay_WeekendDungeon_menu_the_4da1d1: "The dungeon will be open during:"
  npc_override_1@md_pay_WeekendDungeon_now_you_like_enter_now_4e874f: "Now, would you like to enter it now?"
  npc_override_1@md_pay_WeekendDungeon_off_you_go_027c81: "Off you go!"
  npc_override_1@md_pay_WeekendDungeon_oh_curious_onlooker_i_m_0ee283: "Oh, a curious onlooker? I'm Marry Jae, the person in charge of weekends among the days of the week."
  npc_override_1@md_pay_WeekendDungeon_party_entering_d3d912: "{0} of the party, {1}, is entering the {2}."
  npc_override_1@md_pay_WeekendDungeon_please_come_back_when_yo_0e7f1a: "Please come back when you have enough materials."
  npc_override_1@md_pay_WeekendDungeon_please_come_back_when_yo_c6512f: "Please come back when you have enough Zeny."
  npc_override_1@md_pay_WeekendDungeon_sorry_entry_period_expir_e49eb9: "Sorry, but the entry period to the {0} has expired."
  npc_override_1@md_pay_WeekendDungeon_t_continue_because_you_t_040296: "Can't continue because you have too many heavy objects. Reduce your total weight by clearing your inventory."
  npc_override_1@md_pay_WeekendDungeon_t_really_help_i_guess_b5466d: "Can't really help it I guess."
  npc_override_1@md_pay_WeekendDungeon_take_rest_while_waiting_818f88: "Take a rest while waiting for the dungeon to be available again."
  npc_override_1@md_pay_WeekendDungeon_there_no_memorial_dungeo_2643a1: "There is no Memorial Dungeon registered."
  npc_override_1@md_pay_WeekendDungeon_those_who_party_weekends_94bd9e: "For those who do not have a party on the weekends, this place is hunting and experience gaining grounds for lonely adventurers!"
  npc_override_1@md_pay_WeekendDungeon_treasure_chest_appeared_fd3543: "A treasure chest appeared somewhere in the dungeon. It'll disappear after a while, so let's find it."
  npc_override_1@md_pay_WeekendDungeon_unknown_error_occurred_58bda4: "An unknown error has occurred."
  npc_override_1@md_pay_WeekendDungeon_what_weekend_dungeon_act_3a73ee: "What is the weekend dungeon? Actually, it's a specially designed space for new adventurers to train."
  npc_override_1@md_pay_WeekendDungeon_when_opening_time_59e170: "When is the opening time?"
  npc_override_1@md_pay_WeekendDungeon_yes_5397e0: "Yes"
  npc_override_1@md_pay_WeekendDungeon_you_may_now_enter_2aac5f: "You may now enter."
  npc_override_1@md_pay_WeekendDungeon_you_may_re_enter_memoria_8c603f: "You may re-enter the Memorial Dungeon."
  npc_override_1@md_pay_WeekendDungeon_you_need_form_party_one_94b730: "You need to form a party of one member or more."
  npc_override_1@md_pay_WeekendDungeon_you_prepared_dc4111: "You have not prepared?"
  npc_override_1@md_pay_WeekendDungeon_you_too_many_kinds_objec_abc37a: "You have too many kinds of objects. Clear your inventory."
  npc_override_1@md_pay_WeekendDungeon_you_want_pack_right_now_13752a: "Do you want to pack it right now?"
  npc_override_1@md_pay_WeekendDungeon_your_base_level_too_low_1e051b: "Your base level is too low to select this, you need to be level {0} + ."
  npc_override_1@md_pay_WeekendDungeon_your_base_level_too_low_a50c49: "Your base level is too low, come back when you hit level 60+."
