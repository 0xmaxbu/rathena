Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@md_pay_WeekendDungeon_before_we_start_setting_2ad571: "在我们开始设置这里的环境之前，我们会给你机会选择适当的难度等级。"
  npc_override_1@md_pay_WeekendDungeon_besides_experience_gain_1624b0: "此外，这里的经验收益非常丰厚。"
  npc_override_1@md_pay_WeekendDungeon_cancel_77dfd2: "取消"
  npc_override_1@md_pay_WeekendDungeon_come_back_whenever_you_n_335d6d: "随时需要包装服务就回来找我！"
  npc_override_1@md_pay_WeekendDungeon_confirm_spend_z_package_ff9d26: "确认花费{0}z将5个<ITEM>{1}<INFO>{2}</INFO></ITEM>打包成<ITEM>{3}<INFO>{4}</INFO></ITEM>？"
  npc_override_1@md_pay_WeekendDungeon_cooldown_expired_a04925: "冷却时间已过期。"
  npc_override_1@md_pay_WeekendDungeon_good_luck_d53846: "祝你好运~"
  npc_override_1@md_pay_WeekendDungeon_good_luck_finding_treasu_d3bdff: "祝你好运找到宝藏！"
  npc_override_1@md_pay_WeekendDungeon_i_could_make_my_own_0ed3e8: "我可以做出自己的选择，但每个人根据自己的能力处理方式不同。"
  npc_override_1@md_pay_WeekendDungeon_i_hope_see_you_when_7309ee: "希望周末能再见到你~"
  npc_override_1@md_pay_WeekendDungeon_i_offer_packaging_servic_ef5bd4: "我为那些希望向心爱的人赠送珍贵礼物的人提供包装服务。"
  npc_override_1@md_pay_WeekendDungeon_i_think_you_re_just_e36535: "我想你已经差不多准备好了。"
  npc_override_1@md_pay_WeekendDungeon_if_you_attempt_tame_any_3db37c: "^ff0000如果你尝试驯服任何怪物，将不会被计为击杀。请小心。^000000"
  npc_override_1@md_pay_WeekendDungeon_if_you_units_item_info_dc5cfa: "如果你有5个<ITEM>{0}<INFO>23143</INFO></ITEM>或<ITEM>{1}<INFO>23142</INFO></ITEM>，我只需^FF0000{2}^000000 Zeny就可以帮你打包！"
  npc_override_1@md_pay_WeekendDungeon_looking_around_s_obvious_fd5f32: "^0000FF环顾四周，很明显Marry Jae正在和你说话。^000000"
  npc_override_1@md_pay_WeekendDungeon_memorial_dungeon_been_cr_a43d8a: "纪念地下城已创建。"
  npc_override_1@md_pay_WeekendDungeon_menu_saturday_2f96b5: "^0000FF周六 00:00 ~ 周日 23:59^000000"
  npc_override_1@md_pay_WeekendDungeon_menu_the_4da1d1: "地下城开放时间："
  npc_override_1@md_pay_WeekendDungeon_now_you_like_enter_now_4e874f: "现在，你想现在进入吗？"
  npc_override_1@md_pay_WeekendDungeon_off_you_go_027c81: "去吧！"
  npc_override_1@md_pay_WeekendDungeon_oh_curious_onlooker_i_m_0ee283: "哦，好奇的旁观者？我是Marry Jae，负责一周中周末的人。"
  npc_override_1@md_pay_WeekendDungeon_party_entering_d3d912: "{0}，队伍{1}，正在进入{2}。"
  npc_override_1@md_pay_WeekendDungeon_please_come_back_when_yo_0e7f1a: "材料足够时再回来找我。"
  npc_override_1@md_pay_WeekendDungeon_please_come_back_when_yo_c6512f: "Zeny足够时再回来找我。"
  npc_override_1@md_pay_WeekendDungeon_sorry_entry_period_expir_e49eb9: "抱歉，但进入{0}的时间已过期。"
  npc_override_1@md_pay_WeekendDungeon_t_continue_because_you_t_040296: "无法继续，因为你的物品太重了。清理背包以减轻总重量。"
  npc_override_1@md_pay_WeekendDungeon_t_really_help_i_guess_b5466d: "没办法，我猜。"
  npc_override_1@md_pay_WeekendDungeon_take_rest_while_waiting_818f88: "在等待地下城再次可用时休息一下。"
  npc_override_1@md_pay_WeekendDungeon_there_no_memorial_dungeo_2643a1: "没有注册纪念地下城。"
  npc_override_1@md_pay_WeekendDungeon_those_who_party_weekends_94bd9e: "对于那些周末没有队伍的人来说，这里是孤独冒险者的狩猎和经验获取场所！"
  npc_override_1@md_pay_WeekendDungeon_treasure_chest_appeared_fd3543: "地下城某处出现了一个宝箱。它会在一段时间后消失，所以快去找吧。"
  npc_override_1@md_pay_WeekendDungeon_unknown_error_occurred_58bda4: "发生了未知错误。"
  npc_override_1@md_pay_WeekendDungeon_what_weekend_dungeon_act_3a73ee: "什么是周末地下城？实际上，这是一个专门为新冒险者设计的训练空间。"
  npc_override_1@md_pay_WeekendDungeon_when_opening_time_59e170: "开放时间是什么时候？"
  npc_override_1@md_pay_WeekendDungeon_yes_5397e0: "是"
  npc_override_1@md_pay_WeekendDungeon_you_may_now_enter_2aac5f: "你现在可以进入了。"
  npc_override_1@md_pay_WeekendDungeon_you_may_re_enter_memoria_8c603f: "你可以重新进入纪念地下城。"
  npc_override_1@md_pay_WeekendDungeon_you_need_form_party_one_94b730: "你需要组建至少1人的队伍。"
  npc_override_1@md_pay_WeekendDungeon_you_prepared_dc4111: "你还没准备好？"
  npc_override_1@md_pay_WeekendDungeon_you_too_many_kinds_objec_abc37a: "你的物品种类太多了。清理背包。"
  npc_override_1@md_pay_WeekendDungeon_you_want_pack_right_now_13752a: "你想现在就打包吗？"
  npc_override_1@md_pay_WeekendDungeon_your_base_level_too_low_1e051b: "你的Base等级太低，无法选择这个，你需要达到{0}级或以上。"
  npc_override_1@md_pay_WeekendDungeon_your_base_level_too_low_a50c49: "你的Base等级太低，达到60级后再来吧。"
