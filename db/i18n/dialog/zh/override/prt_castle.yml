  npc_override_prt_castle_quests_morocc_s_dirty_good_s_why_823232: "这很肮脏，不好。所以我们应该纠正它。我们都知道这种情况，但你为什么这样行事！！"
  npc_override_prt_castle_quests_morocc_s_enough_b568c9: "够了。"
  npc_override_prt_castle_quests_morocc_s_natural_announce_death_263eb6: "宣布国王的死讯是理所当然的。但国家的氛围还不成熟。这是我们目前唯一的办法。"
