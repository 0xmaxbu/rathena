  npc_override_prt_castle_quests_morocc_i_usually_don_t_let_24f93a: "我通常不让任何人听到我美妙的声音，但这次我会为你提供特别服务。"
  npc_override_prt_castle_quests_morocc_i_ve_had_cope_many_13eedf: "我不得不应对许多意外和挑战……我幸存下来，并一直在追求新事物。生活意味着……"
