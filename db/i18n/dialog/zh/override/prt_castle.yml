  npc_override_prt_castle_quests_morocc_i_want_repay_her_b52e2a: "我想报答她。"
  npc_override_prt_castle_quests_morocc_i_want_you_go_prontera_9f55fc: "我想让你去普隆德拉王室协助下任国王的选拔。"
  npc_override_prt_castle_quests_morocc_i_won_t_handle_documents_bb647f: "我不会处理文件"
  npc_override_prt_castle_quests_morocc_i_worry_about_your_words_6ed43a: "我担心你说的话……"
  npc_override_prt_castle_quests_morocc_idiot_being_king_should_ec3c42: "白痴！当国王应该采取果断行动。我没有机会成为国王。腐败，那样活着，比被你杀死更糟……"
  npc_override_prt_castle_quests_morocc_idiot_moron_f225c3: "白痴……笨蛋……"
  npc_override_prt_castle_quests_morocc_if_i_am_reign_help_2aaf14: "但是……如果我要统治，或帮助你；如果我堕落了……你就杀了我……用你的手。"
  npc_override_prt_castle_quests_morocc_if_i_king_all_restrictio_e179a4: "如果我是国王，所有限制都将被移除，在不可侵犯的范围内允许每个人过自由的生活。"
  npc_override_prt_castle_quests_morocc_if_our_time_exploring_ag_448ac8: "如果我们的时代是探索时代，我可能就是探险队的队长！未探索的、探路的、调查的……这些都是我的代名词。你呢？？"
  npc_override_prt_castle_quests_morocc_if_you_don_t_important_30c9ba: "如果你没有重要的事找我，我就走了。"
  npc_override_prt_castle_quests_morocc_if_you_know_why_you_1762d4: "既然你知道，那你为什么在这里？滚出去！"
  npc_override_prt_castle_quests_morocc_if_you_mission_f1d6ba: "如果你能完成这个任务，"
  npc_override_prt_castle_quests_morocc_if_you_motivated_i_find_dac8f7: "如果你没有动力去做，我会找另一个冒险者。如果你愿意，你可以回去做你的事。"
  npc_override_prt_castle_quests_morocc_if_you_prove_yourself_st_6ed80c: "但是，如果你证明自己是个强大的冒险者，那么我会让你通过第一项资格测试。"
  npc_override_prt_castle_quests_morocc_if_you_react_wrongfully_4f56af: "如果你对这件事反应不当，我的死就毫无价值了……咳……你明白吗？"
  npc_override_prt_castle_quests_morocc_if_you_react_wrongfully_fd10aa: "～～如果你对这件事反应不当，我的死就毫无价值了……咳……你明白吗？～～"
  npc_override_prt_castle_quests_morocc_if_you_want_say_somethin_741ea9: "如果你想说什么，就得说清楚。你是在宣布认输吗？我的运气就那么糟吗，艾根·阿鲁姆？"
  npc_override_prt_castle_quests_morocc_ignorance_positive_means_49d2d0: "无知……是积极的……这意味着……我的出价……成功了……"
  npc_override_prt_castle_quests_morocc_ii_don_t_special_habits_df039c: "我没有特别的习惯。我只是愿意学习和读书。"
  npc_override_prt_castle_quests_morocc_important_issue_nation_i_cfc3f8: "这是国家的重要事务。我不能把这份工作交给像你这样的人。"
  npc_override_prt_castle_quests_morocc_important_virtue_your_li_20375e: "你生活中的重要美德。"
  npc_override_prt_castle_quests_morocc_incessantly_d4f315: "不停地……-"
  npc_override_prt_castle_quests_morocc_insane_i_am_fully_sane_81cde4: "疯了？我完全清醒……我亲爱的兄弟，我只是受够了这令人作呕的现实。"
  npc_override_prt_castle_quests_morocc_inspector_right_away_975706: "立即通知监察官。"
  npc_override_prt_castle_quests_morocc_instruction_dc8b49: "对此的指示。"
  npc_override_prt_castle_quests_morocc_instructions_what_20b84a: "该做什么的指示，"
  npc_override_prt_castle_quests_morocc_isn_t_happening_2608ea: "这不可能发生。"
  npc_override_prt_castle_quests_morocc_isn_t_he_great_person_72182d: "他不是个了不起的人吗？"
  npc_override_prt_castle_quests_morocc_it_is_1a7403: "是……{0}！！"
  npc_override_prt_castle_quests_morocc_judge_2f73d7: "审判官！"
  npc_override_prt_castle_quests_morocc_judge_appraise_princes_s_fcf2c4: "评估王子的审判官也应该塑造自己的品格。力量不能覆盖一切。品格应该与之俱来。"
  npc_override_prt_castle_quests_morocc_just_forget_about_52e416: "忘了吧。"
  npc_override_prt_castle_quests_morocc_just_one_93e923: "只有一个。"
  npc_override_prt_castle_quests_morocc_just_say_me_huh_38fdb6: "对我说……？嗯？"
  npc_override_prt_castle_quests_morocc_kay_let_s_start_get_d23dba: "好了，我们开始吧。准备好。仔细听，然后回答。"
  npc_override_prt_castle_quests_morocc_keeping_silent_him_f0e367: "……对他保持沉默。"
  npc_override_prt_castle_quests_morocc_king_hasn_t_appeared_ae8244: "国王没有出现"
  npc_override_prt_castle_quests_morocc_king_s_position_cannot_749f43: "国王的位置不能"
  npc_override_prt_castle_quests_morocc_king_tristan_28494f: "特里斯坦国王……"
  npc_override_prt_castle_quests_morocc_king_what_s_s_nothing_2a6072: "国王？！那是为了什么？！那什么都不是！即使我们创造一个新世界，什么都没有改变！！我们就像在演戏。画面是某人的意图……只是画出来的！！对吧？！"
  npc_override_prt_castle_quests_morocc_kingdom_rune_midgarts_8a475f: "为了卢恩-米德加尔特王国！"
  npc_override_prt_castle_quests_morocc_kuffkuff_i_sore_throat_s_799cf1: "～咳咳咳～！我喉咙痛！好久没用嗓子了。～咳咳咳～！"
  npc_override_prt_castle_quests_morocc_la_lalalala_lalala_8a43bc: "啦～啦啦啦啦～啦啦啦～"
  npc_override_prt_castle_quests_morocc_lalala_f62a6b: "啦啦啦～"
  npc_override_prt_castle_quests_morocc_later_please_give_my_reg_fdf4b3: "之后，请代我向彼得叔叔问好。"
  npc_override_prt_castle_quests_morocc_leaves_room_he_seems_utt_4a2436: "然后离开了房间。他似乎筋疲力尽了。-"
  npc_override_prt_castle_quests_morocc_lend_hand_future_96a23f: "为未来伸出援手"
  npc_override_prt_castle_quests_morocc_let_me_answer_my_2ff043: "让我用我的"
  npc_override_prt_castle_quests_morocc_let_me_explain_briefly_4b2d36: "让我简要说明，"
  npc_override_prt_castle_quests_morocc_let_me_open_door_08e934: "让我开门。"
  npc_override_prt_castle_quests_morocc_let_me_scoop_candidates_7f1dbe: "让我来挖点候选人内幕～"
  npc_override_prt_castle_quests_morocc_let_s_continue_our_talk_3514dc: "让我们继续我们的谈话"
  npc_override_prt_castle_quests_morocc_let_s_make_rune_midgarts_666c5d: "让我们让卢恩-米德加尔特……"
  npc_override_prt_castle_quests_morocc_let_s_meet_next_some_fefd32: "让我们下次在更刺激和危险的地方见面。"
  npc_override_prt_castle_quests_morocc_let_s_test_you_16680e: "让我们测试你。"
  npc_override_prt_castle_quests_morocc_liar_you_always_told_me_108e50: "骗子！你总是告诉我你的书里充满可能性！你总是表现得很骄傲！"
  npc_override_prt_castle_quests_morocc_like_card_board_games_9a0cd6: "比如卡牌和桌游"
  npc_override_prt_castle_quests_morocc_like_i_said_i_ve_075dc7: "就像我说的，我是在他的责骂中长大的。我觉得他的话比那些在我完成某事后闭嘴的人更严厉。"
  npc_override_prt_castle_quests_morocc_listen_32481c: "听着……"
  npc_override_prt_castle_quests_morocc_lock_key_f7a71f: "锁和钥匙。-"
  npc_override_prt_castle_quests_morocc_look_my_card_198179: "看看我的牌！"
  npc_override_prt_castle_quests_morocc_many_curious_about_situa_38ec13: "许多人对局势很好奇。"
  npc_override_prt_castle_quests_morocc_many_say_about_my_charac_3cfc23: "但很多人说，关于我的性格，我沉迷于赌博。我只是充满挑战精神，喜欢赚钱！我是一个自由奔放的普通人。"
  npc_override_prt_castle_quests_morocc_me_59e2e5: "为我？"
  npc_override_prt_castle_quests_morocc_me_b8cf45: "对我！"
  npc_override_prt_castle_quests_morocc_me_bbb_brother_9737e8: "被我？……兄……兄弟？……"
  npc_override_prt_castle_quests_morocc_me_process_more_importan_d33545: "对我来说，过程比结果更重要。现在，我把它们视为同等的美德。我不太看重结果。阿鲁姆教会了我，我曾经把结果视为虚无。"
  npc_override_prt_castle_quests_morocc_meaningless_actions_cann_d07949: "无意义的行动不能被欢迎！被污秽操纵是令人作呕的。我很无知，我以为我是按自己的意志行事，但现在我意识到我被操纵了！"
  npc_override_prt_castle_quests_morocc_men_should_challenge_stu_a2017a: "男人应该挑战他们能为之热血沸腾的事物，所以人们的自由行动不应被国家阻碍。"
  npc_override_prt_castle_quests_morocc_menu_a_991ad4: "强大的人。:有经验的人。:善良的人。"
  npc_override_prt_castle_quests_morocc_menu_alright_5273f3: "好的好的。:信使指引我来的。"
  npc_override_prt_castle_quests_morocc_menu_attack_29d59e: "先发制人。:从远处观察。:逃走。"
  npc_override_prt_castle_quests_morocc_menu_backgroud_3e7dfa: "先说说背景。:我想知道你的民族精神。:你的习惯和爱好。:我先走了。"
  npc_override_prt_castle_quests_morocc_menu_dominate_1b1bf3: "通过加强军备统治国家。:经济和技术的进步。:保持公共安全稳固。"
  npc_override_prt_castle_quests_morocc_menu_growth_13fa9a: "自我成长。:世界和平。:追求真理。"
  npc_override_prt_castle_quests_morocc_menu_he_a6fb1c: "他每天都写日记。在婚礼那天，他记下:‘就像，今天没什么特别的事发生’。他不关心时事或人际关系。"
  npc_override_prt_castle_quests_morocc_menu_higher_c98783: "更高:更低"
  npc_override_prt_castle_quests_morocc_menu_i_74c9b1: "我有事要问……:是这样吗？那回头见。"
  npc_override_prt_castle_quests_morocc_menu_i_958eae: "我想了解你的背景。:让我知道你的国家观。:你的爱好或兴趣是什么？:我先走了。"
  npc_override_prt_castle_quests_morocc_menu_keep_085da8: "继续战斗直到我们能做到。:找新地方，换种方式尝试。:停止狩猎，补给休整。"
  npc_override_prt_castle_quests_morocc_menu_love_17ecbe: "爱情故事。:英雄史诗。:宗教传说。"
  npc_override_prt_castle_quests_morocc_menu_map_a592f6: "地图:燧石:武器"
  npc_override_prt_castle_quests_morocc_menu_okay_7d8904: "好的，没问题。:请找别人吧。"
  npc_override_prt_castle_quests_morocc_menu_okay_c23cdf: "……好吧，我依你的意愿……:…………"
  npc_override_prt_castle_quests_morocc_menu_passed_2ae0be: "去世了？:又来庆祝？"
  npc_override_prt_castle_quests_morocc_menu_priest_65c91b: "祭司，治疗职业。:猎人，伤害输出。:骑士领主，坦克。"
  npc_override_prt_castle_quests_morocc_menu_prince_001599: "埃里希王子让我来见你。:没什么事。"
  npc_override_prt_castle_quests_morocc_menu_refer_516062: "参考过去的失败。:犹豫是最糟糕的。:你不是一个人。"
  npc_override_prt_castle_quests_morocc_menu_relationships_737902: "人际关系。:充分收集情报。:洞察力和驱动力。"
  npc_override_prt_castle_quests_morocc_menu_share_21e69a: "按事先约定分配。:我不想管分配的事。:给需要的成员。"
  npc_override_prt_castle_quests_morocc_menu_strength_cf62ab: "怪物的力量和特性。:狩猎的效率。:狩猎能得到什么。"
  npc_override_prt_castle_quests_morocc_menu_what_4a6aee: "我到底该做什么？:国王是病死的？:我的任务保密吗？:我没有更多问题了。"
  npc_override_prt_castle_quests_morocc_menu_yes_c1d6b7: "是的，我替你去见过她了。:不，我不想去。"
  npc_override_prt_castle_quests_morocc_menu_yes_de2097: "是。:否。"
  npc_override_prt_castle_quests_morocc_menu_your_625cc7: "你的背景故事……:你的国家观……:爱好和兴趣……:我稍后再来。"
  npc_override_prt_castle_quests_morocc_menu_your_9076bd: "你的背景……:你的抱负……:你的国家观……:我想先见见别人。"
  npc_override_prt_castle_quests_morocc_menu_your_d289b9: "你的背景故事……:你的国家观……:你的爱好或兴趣……:算了，我稍后再来。"
  npc_override_prt_castle_quests_morocc_messenger_checked_only_y_4ec517: "信使只检查了你的身体素质，然后把一个战士送到宫廷。这就是他的全部职责。"
  npc_override_prt_castle_quests_morocc_might_brought_national_d_821154: "这可能会带来国家动乱，但人们都对恶魔的复活保持警惕。我们正处在完美时机，可以在不引起额外骚动的情况下处理这个问题。"
  npc_override_prt_castle_quests_morocc_military_maniac_jerk_you_3bef97: "军事狂！混蛋！你以为力量能解决一切吗？在任何情况下，你觉得人们都能和平地生活吗？！"
  npc_override_prt_castle_quests_morocc_milk_all_spilt_a465d2: "牛奶全洒了。"
  npc_override_prt_castle_quests_morocc_moron_you_ll_never_king_c5a9ee: "笨蛋。你永远成不了国王。你这辈子都别想……你不知道吗？真是个废物！！"
  npc_override_prt_castle_quests_morocc_most_if_you_18ec8e: "如果你在"
  npc_override_prt_castle_quests_morocc_most_important_thing_con_82f77d: "最重要的事情要考虑"
  npc_override_prt_castle_quests_morocc_move_your_ass_here_beer_b08cbd: "拿啤酒过来！"
  npc_override_prt_castle_quests_morocc_msg_00d9a9: "…………"
  npc_override_prt_castle_quests_morocc_msg_5a2bae: "……"
  npc_override_prt_castle_quests_morocc_msg_6eae3a: "……"
  npc_override_prt_castle_quests_morocc_msg_93fcbf: "……"
  npc_override_prt_castle_quests_morocc_msg_a7981c: "………………"
  npc_override_prt_castle_quests_morocc_msg_f0e1ca: "……"
  npc_override_prt_castle_quests_morocc_msg_f1a441: "……！"
  npc_override_prt_castle_quests_morocc_my_ancestor_schmidt_what_133666: "我的祖先^FF0000施密特^000000……你该怎么应对这种情况？不……你只是像我一样被利用了……被其他人？"
  npc_override_prt_castle_quests_morocc_my_background_d87e6b: "我的背景……"
  npc_override_prt_castle_quests_morocc_my_beautiful_body_isn_t_493b28: "我美丽的身体现在状态不佳。我今天不想给任何人看。"
  npc_override_prt_castle_quests_morocc_my_beautiful_person_3daea5: "我美丽的人"
  npc_override_prt_castle_quests_morocc_my_brother_ern_stick_som_2e8eff: "我兄弟恩可以长时间专注于某事，比如读书或学习。"
  npc_override_prt_castle_quests_morocc_my_card_numbers_you_give_7a768e: "我的牌有 1 到 13 的数字。你对我抽的牌的数字给出回答，是更小还是更大。"
  npc_override_prt_castle_quests_morocc_my_childhood_i_liked_exp_d9f9dc: "从小我就喜欢体验和学习许多事物。结果，我不得不忍受家人的干涉。对他们来说，我不是个体面的贵族家庭成员。"
  npc_override_prt_castle_quests_morocc_my_conscience_7591be: "……我的良心！"
  npc_override_prt_castle_quests_morocc_my_dashing_face_7e968a: "我潇洒的脸庞"
  npc_override_prt_castle_quests_morocc_my_family_coming_today_i_c73e3a: "今天有家人要来。但我还没找到他。"
  npc_override_prt_castle_quests_morocc_my_family_influential_my_256322: "我的家族并不那么有影响力。我的童年并不富裕，我不得不找工作和做兼职赚钱。"
  npc_override_prt_castle_quests_morocc_my_fortune_i_got_many_ef0433: "我很幸运除了阿鲁姆之外还有很多导师。这对我的国家也有好处。"
  npc_override_prt_castle_quests_morocc_my_full_name_8fe027: "我的全名是……"
  npc_override_prt_castle_quests_morocc_my_investigations_all_pr_533e0e: "我对所有王子的调查都已完成。"
  npc_override_prt_castle_quests_morocc_my_name_hans_servant_pri_32e811: "我叫汉斯，埃里希王子的仆人。"
  npc_override_prt_castle_quests_morocc_my_name_poe_2ccedf: "我叫坡。"
  npc_override_prt_castle_quests_morocc_my_opinion_nation_should_fbf0c2: "我的观点是国家应为人民提供最低限度的保障，以保证各自的自由。"
  npc_override_prt_castle_quests_morocc_my_prince_didn_t_anythin_47f2b4: "我的王子没做错任何事，但无论如何，我为一切向你道歉！"
  npc_override_prt_castle_quests_morocc_my_sight_f5ab3e: "我的视线。"
  npc_override_prt_castle_quests_morocc_nation_i_organize_0da55f: "我组织的国家"
  npc_override_prt_castle_quests_morocc_never_happen_so_7d93b7: "那永远不会发生，所以……"
  npc_override_prt_castle_quests_morocc_never_let_yourself_down_a862f8: "永远不要被给定的牌打倒，瞄准致命一击！"
  npc_override_prt_castle_quests_morocc_never_mind_09c451: "算了……"
  npc_override_prt_castle_quests_morocc_never_mind_8721eb: "算了。"
  npc_override_prt_castle_quests_morocc_new_monster_new_area_1e3e14: "新区域的新怪物。"
  npc_override_prt_castle_quests_morocc_no_corruption_mutually_a_8833cf: "不。腐败是双方同意的，你把我带到这里，因为你的存在，我可以依靠你！"
  npc_override_prt_castle_quests_morocc_no_prince_203b8d: "不，王子，"
  npc_override_prt_castle_quests_morocc_no_s_no_good_no_a55a6b: "不，这不行……不……在这个阶段，我会成为国王。我不应该成为国王……恩……你不应该忘记真正国王的意义。"
  npc_override_prt_castle_quests_morocc_no_we_shall_make_brother_528c42: "不，我们会做到的。我和兄弟一起，我们会做到的。"
  npc_override_prt_castle_quests_morocc_nonsense_you_think_i_you_5b9d18: "胡说！你以为我会对你那样做吗？！"
  npc_override_prt_castle_quests_morocc_novice_walter_fc80e6: "瓦尔特的初学者！！"
  npc_override_prt_castle_quests_morocc_now_debate_over_selectin_7ab620: "现在，关于下任国王的辩论正在积极进行中。请为卢恩-米德加尔特的明天助一臂之力。"
  npc_override_prt_castle_quests_morocc_now_i_die_peace_thank_e7b50b: "现在……我可以……平静地死去了……非……非常感谢你们……两位。"
  npc_override_prt_castle_quests_morocc_now_i_let_you_know_0f072d: "现在我要让你知道"
  npc_override_prt_castle_quests_morocc_now_let_me_begin_5c72e3: "现在，让我开始吧。"
  npc_override_prt_castle_quests_morocc_now_let_me_return_my_3ecf37: "现在，让我回房间吧。继续好好干，鉴定师。"
  npc_override_prt_castle_quests_morocc_now_perfect_timing_even_2c1033: "现在正是好时机。连我们的见证人都在！恩，你清楚地记得我们的约定吧？"
  npc_override_prt_castle_quests_morocc_now_where_shall_we_start_4dbaa5: "那么，我们从哪里开始？"
  npc_override_prt_castle_quests_morocc_now_whole_picture_may_ch_38e8a6: "现在整个图景可能会改变……其他人肯定也一样。但我担心艾根·阿鲁姆，因为我不能忽视任何关于任何候选人的流言。"
  npc_override_prt_castle_quests_morocc_now_you_come_back_later_b28734: "现在，你可以稍后再来。"
  npc_override_prt_castle_quests_morocc_now_you_ready_ac796f: "现在你准备好了吗？"
  npc_override_prt_castle_quests_morocc_nuts_74da5e: "……该死。"
  npc_override_prt_castle_quests_morocc_obssessed_making_837a2d: "-沉迷于制作"
  npc_override_prt_castle_quests_morocc_off_record_4b3b61: "是私下记录的。"
  npc_override_prt_castle_quests_morocc_oh_i_don_t_want_e85af6: "哦，我不想让你太慌张……嗯……我想说的是，特里斯坦三世，卢恩-米德加尔特的统治者……"
  npc_override_prt_castle_quests_morocc_oh_no_6329e8: "哦不……"
  npc_override_prt_castle_quests_morocc_oh_really_fe2685: "哦！真的吗？"
  npc_override_prt_castle_quests_morocc_ok_let_me_tell_you_d86873: "好吧。让我告诉你。这个卢恩-米德加尔特就是垃圾。你和我都在垃圾堆里挣扎，我们都一样，即使它不能被回收。"
  npc_override_prt_castle_quests_morocc_ok_take_care_c1be32: "好吧……保重。"
  npc_override_prt_castle_quests_morocc_okay_6fb660: "好吧……"
  npc_override_prt_castle_quests_morocc_okay_good_riddance_018950: "好吧，谢天谢地。"
