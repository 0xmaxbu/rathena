  npc_override_prt_castle_quests_morocc_we_promised_go_fishing_a_a6554c: "我们约定登基后去钓鱼……看看吧……"
  npc_override_prt_castle_quests_morocc_we_same_tastes_haven_t_37fb5c: "我们有相同的品味，不是吗？"
  npc_override_prt_castle_quests_morocc_we_seven_candidates_seve_13b2d9: "我们有来自七个家族的七位候选人。每个家族一位。候选人都在同一个地方，我会把他们介绍给你。"
  npc_override_prt_castle_quests_morocc_we_ve_just_decided_kill_7f4ed4: "我们刚刚决定杀死"
  npc_override_prt_castle_quests_morocc_weakest_one_seven_famili_534305: "七个家族中最弱的盖博尔格家族，通过与施密特和瓦尔特联合夺取了权力。"
  npc_override_prt_castle_quests_morocc_welcome_appraiser_4870db: "欢迎，鉴定师。"
  npc_override_prt_castle_quests_morocc_welcome_d911f3: "欢迎……"
  npc_override_prt_castle_quests_morocc_welcome_judge_0acacb: "欢迎，审判官。"
  npc_override_prt_castle_quests_morocc_well_tell_truth_going_fi_653b78: "嗯，说实话，和阿鲁姆一起去钓鱼更好。不过，因为所有王国事务，我们忙得没时间去钓鱼。"
  npc_override_prt_castle_quests_morocc_well_thank_you_133fa3: "嗯，谢谢你。"
  npc_override_prt_castle_quests_morocc_well_what_questions_992c47: "-嗯，什么问题的。"
  npc_override_prt_castle_quests_morocc_wha_s_so_ac9456: "什——，那太……"
  npc_override_prt_castle_quests_morocc_what_about_setting_strai_482a6b: "先理清你的家谱再来怎么样？"
  npc_override_prt_castle_quests_morocc_what_bad_luck_i_9756ff: "……我真倒霉！"
  npc_override_prt_castle_quests_morocc_what_did_you_say_ahrum_d1e8cd: "你说什么？阿鲁姆？"
  npc_override_prt_castle_quests_morocc_what_done_first_when_14fee2: "当"
  npc_override_prt_castle_quests_morocc_what_he_likes_making_loc_cd5252: "他喜欢做锁。"
  npc_override_prt_castle_quests_morocc_what_hell_you_talking_ab_fe26fc: "……你到底在说什么？环境？我完全不明白。这从来不明确。"
  npc_override_prt_castle_quests_morocc_what_i_hate_sticking_for_12d825: "我讨厌拘泥于形式和多说话。至于野心？当我成为……国王……之后我该做什么……我经常被问到这个问题。"
  npc_override_prt_castle_quests_morocc_what_i_like_smelling_blo_6ff84d: "我喜欢在战场上闻血腥味，我也喜欢节日。"
  npc_override_prt_castle_quests_morocc_what_i_t_believe_23956e: "什么！？我不敢相信！"
  npc_override_prt_castle_quests_morocc_what_i_want_say_short_cab3ec: "简单来说，我想说的是国家不统治人民。人们需要与人民保持和平。"
  npc_override_prt_castle_quests_morocc_what_i_you_3d61cf: "我能为你做什么？"
  npc_override_prt_castle_quests_morocc_what_if_we_lose_party_2adce7: "如果我们失去一个队友怎么办"
  npc_override_prt_castle_quests_morocc_what_if_you_t_forgive_6713f3: "如果你不能原谅我怎么办？你会怎么做？那很好。你要杀了我吗？你会杀了我吗？杀了我？哈哈？只有自称为美丽的人才会被叫美丽！"
  npc_override_prt_castle_quests_morocc_what_indecorous_person_d24f28: "多么不雅的人！"
  npc_override_prt_castle_quests_morocc_what_one_careful_when_de_e4b7ff: "以及与王子打交道时需要注意的事项。注意听我说。"
  npc_override_prt_castle_quests_morocc_what_promise_witness_ahh_9115b4: "什么？约定？见证人？……啊……真——真的……"
  npc_override_prt_castle_quests_morocc_what_s_capacity_king_wha_80604e: "国王的能力是什么？清廉的政治又是什么……？啊啊啊啊啊啊啊！！"
  npc_override_prt_castle_quests_morocc_what_s_wrong_brother_we_05aa95: "怎么了，兄弟？我们没在说什么坏事。我们只是在坚定决心。"
  npc_override_prt_castle_quests_morocc_what_s_wrong_you_9c3290: "你怎么了？"
  npc_override_prt_castle_quests_morocc_what_shall_i_ask_8f4258: "-我该问什么……-"
  npc_override_prt_castle_quests_morocc_what_she_told_me_letter_c1416a: "她在信中对我说，我的形象太锐利了，如果我留胡子，脸部轮廓会隐藏很多，看起来会好很多。"
  npc_override_prt_castle_quests_morocc_what_situation_ecf54e: "什么情况……"
  npc_override_prt_castle_quests_morocc_what_subject_should_i_st_9fb63d: "-我该从什么话题开始？-"
  npc_override_prt_castle_quests_morocc_what_thoughts_did_he_how_3b9aaa: "他有什么想法，又是如何在这个房间里决定成为国王的？"
  npc_override_prt_castle_quests_morocc_what_type_job_class_memb_3c9fa7: "什么类型的职业"
  npc_override_prt_castle_quests_morocc_what_type_story_you_like_458eea: "你最喜欢什么类型的故事？"
  npc_override_prt_castle_quests_morocc_what_ultimate_virtue_4446de: "什么是终极美德"
  npc_override_prt_castle_quests_morocc_what_what_did_you_326d05: "……什么？你……"
  npc_override_prt_castle_quests_morocc_what_what_s_fun_fc2f69: "什么……什么。不好玩。"
  npc_override_prt_castle_quests_morocc_what_you_ace108: "你做什么？"
  npc_override_prt_castle_quests_morocc_what_you_get_as_result_6c0115: "狩猎的结果你得到什么……"
  npc_override_prt_castle_quests_morocc_what_you_sure_about_your_203e5e: "什么！你百分之百确定你的故事吗？啊啊啊……"
  npc_override_prt_castle_quests_morocc_what_you_talking_about_i_5d991a: "你在说什么？我完全不明白！你是说你不处于现状？是吗？你到底在说什么！"
  npc_override_prt_castle_quests_morocc_what_you_talking_about_i_95575b: "你在说什么？我搞不懂你。我输给了谁？我不知道你为什么那样说。"
  npc_override_prt_castle_quests_morocc_what_you_think_611802: "你认为什么是"
  npc_override_prt_castle_quests_morocc_what_you_thinking_aee3af: "你在想什么？"
  npc_override_prt_castle_quests_morocc_what_you_want_keep_c5c9b4: "你想保留什么"
  npc_override_prt_castle_quests_morocc_what_you_want_say_time_88caf0: "这次你想说什么？……"
  npc_override_prt_castle_quests_morocc_what_your_ability_helped_21e635: "你的什么能力帮助了"
  npc_override_prt_castle_quests_morocc_whatever_condition_he_ju_2311c7: "无论条件如何，他只是人生比赛中的失败者。"
  npc_override_prt_castle_quests_morocc_whatever_i_i_am_just_b14a81: "……无论我做什么或不做什么，我都只是被某种东西操纵着。更糟的是，我伤害了别人，因为我只沉浸在那某种东西中。"
  npc_override_prt_castle_quests_morocc_when_i_become_king_i_972d12: "当我成为国王，我会加强军队，统一大陆后征服大陆，消灭所有对人民有害的怪物！"
  npc_override_prt_castle_quests_morocc_when_you_chance_meet_him_06ae82: "当你有机会见到他时"
  npc_override_prt_castle_quests_morocc_when_you_get_medic_offic_a50941: "当你到医务室时，会有一个士兵站在奇怪的位置。你会发现那里没有门。"
  npc_override_prt_castle_quests_morocc_where_you_meet_princes_18f9c7: "在那里你可以见到王子们。"
  npc_override_prt_castle_quests_morocc_while_sitting_all_day_90d2cf: "整天坐着的时候。"
  npc_override_prt_castle_quests_morocc_who_going_throne_instead_4229a5: "谁将代替他登上王位？"
  npc_override_prt_castle_quests_morocc_who_you_c71f44: "你是谁？"
  npc_override_prt_castle_quests_morocc_whoever_king_4d19b9: "无论谁成为国王，"
  npc_override_prt_castle_quests_morocc_whoever_king_let_s_make_fac512: "无论谁成为国王，让我们让卢恩-米德加尔特……成为世界上最好的国家，通过互相帮助。"
  npc_override_prt_castle_quests_morocc_whom_you_want_befriend_m_03dac8: "你最想和谁交朋友？"
  npc_override_prt_castle_quests_morocc_whooah_you_gave_right_an_381a71: "哇，你答对了！"
  npc_override_prt_castle_quests_morocc_why_didn_t_he_come_70bc4b: "他为什么没来找我？"
  npc_override_prt_castle_quests_morocc_why_don_t_you_slow_953245: "为什么不放慢工作节奏呢？"
  npc_override_prt_castle_quests_morocc_why_you_still_standing_t_0b40f3: "你为什么还站在那里？我对你没什么好说的了！退下！"
  npc_override_prt_castle_quests_morocc_why_you_teasing_me_now_4967aa: "你现在为什么取笑我？至少我觉得我掷出的点数比你高……你不这么认为吗？"
  npc_override_prt_castle_quests_morocc_won_t_complicated_you_ju_d3e306: "这不会很复杂。你只需要在每个给定情境后快速如实回答。"
  npc_override_prt_castle_quests_morocc_wooah_uncle_peter_sent_t_92dd3b: "哇，彼得叔叔送来了这些花"
  npc_override_prt_castle_quests_morocc_worst_thing_i_feel_i_6eb17a: "最糟糕的是，我觉得我变得胆怯了，因为了解和理解那某种东西本身……"
  npc_override_prt_castle_quests_morocc_wrong_e0cc25: "错……"
  npc_override_prt_castle_quests_morocc_yeah_872dd3: "是啊……"
  npc_override_prt_castle_quests_morocc_yeah_s_wrong_i_am_034453: "是啊，也不是不对。但我是内里乌斯家族的代表。我不能忍受你的侮辱。"
  npc_override_prt_castle_quests_morocc_yeah_thank_you_very_much_61cbf3: "是的，非常感谢你。"
  npc_override_prt_castle_quests_morocc_yes_e77924: "是……？"
  npc_override_prt_castle_quests_morocc_yes_glory_rune_midgarts_a274cf: "是的。为了卢恩-米德加尔特的荣耀。"
  npc_override_prt_castle_quests_morocc_yes_i_am_76ab27: "是的，我是。"
  npc_override_prt_castle_quests_morocc_yes_i_am_going_now_3ccc3e: "是的，我现在就走。家族的耻辱？！！哈哈哈……家族是什么！！呵呵呵！！非常有趣！"
  npc_override_prt_castle_quests_morocc_yes_i_announce_my_defeat_661333: "是的，我宣布认输。但不是对你。你和我一样是个失败者。在进入正事之前，你被环境因素毁了。"
  npc_override_prt_castle_quests_morocc_yes_i_give_crap_no_f1db09: "……！是的……我毫不在乎。不……我的存在也一样！呵呵呵……哈哈哈哈！"
  npc_override_prt_castle_quests_morocc_yes_i_understand_go_ahea_69bd44: "是的，我明白。继续吧……"
  npc_override_prt_castle_quests_morocc_yes_now_choose_one_7770eb: "是的，现在选一个"
  npc_override_prt_castle_quests_morocc_yes_really_now_time_1e7815: "是的，真的。现在是时候了。"
  npc_override_prt_castle_quests_morocc_yes_s_why_union_walter_a7db54: "是的，这就是为什么瓦尔特和盖博尔格的联合是完美的。而且，阿鲁姆和恩斯特……这显然是施密特和海因里希的再次来临。"
  npc_override_prt_castle_quests_morocc_yes_then_see_you_later_310fb8: "好的，那么，回头见。"
  npc_override_prt_castle_quests_morocc_yes_yes_3264d9: "是？……是？"
  npc_override_prt_castle_quests_morocc_yes_you_i_both_disqualif_89bb47: "是的，你和我都不合格！哈哈哈！！该死的瘾君子说出了真相！是的，哈哈哈哈！！"
  npc_override_prt_castle_quests_morocc_yes_you_talk_well_bah_92e808: "是的，你说得好。呸！"
  npc_override_prt_castle_quests_morocc_you_adventurer_2c7b73: "你就是那个冒险者！"
  npc_override_prt_castle_quests_morocc_you_adventurer_judge_f0bf62: "你不是冒险者审判官"
  npc_override_prt_castle_quests_morocc_you_allowed_here_a1b97b: "你不允许在这里。"
  npc_override_prt_castle_quests_morocc_you_already_know_about_4fa067: "你已经知道那件事了……"
  npc_override_prt_castle_quests_morocc_you_always_care_about_ga_494965: "你总是关心赌博。但为什么你不先关心一下周围的环境呢，嗯？理查德少爷？"
  npc_override_prt_castle_quests_morocc_you_any_further_explanat_109cba: "你任何进一步的解释。"
  npc_override_prt_castle_quests_morocc_you_any_more_3c6228: "你还有更多"
  npc_override_prt_castle_quests_morocc_you_aren_t_just_trying_833617: "你不仅仅是想满足对王室的好奇心吧？"
  npc_override_prt_castle_quests_morocc_you_ask_information_abou_6e24ab: "你可以向我的仆人询问关于我的信息。我要休息一下。"
  npc_override_prt_castle_quests_morocc_you_been_living_64df3c: "你一直活着……"
  npc_override_prt_castle_quests_morocc_you_came_here_good_timin_3166d3: "你来得正是时候。"
  npc_override_prt_castle_quests_morocc_you_came_here_good_timin_37fbb7: "你来得正是时候。我们刚刚决定杀死对方……如果我们中有一方堕落的话。"
  npc_override_prt_castle_quests_morocc_you_come_here_offend_me_d933f3: "你来这里是为了冒犯我吗？你以为你能打败我，艾根·阿鲁姆？！"
  npc_override_prt_castle_quests_morocc_you_come_here_so_often_dcef81: "你经常来这里。"
  npc_override_prt_castle_quests_morocc_you_could_overcome_hards_06772b: "你用它克服了困难。"
  npc_override_prt_castle_quests_morocc_you_court_a9f266: "你在宫廷里要做的事。"
  npc_override_prt_castle_quests_morocc_you_cut_your_finger_49fdcc: "你会割到手指的！"
  npc_override_prt_castle_quests_morocc_you_d_better_understand_bc4f46: "你最好别明白。如果你知道了，你会失去健康的。别在意它……一辈子都别在意！！"
  npc_override_prt_castle_quests_morocc_you_didn_t_distort_eithe_020d56: "你也没有偏向任何一边……"
  npc_override_prt_castle_quests_morocc_you_don_t_enough_quality_d0196f: "你没有足够的品质。你没有铲除邪恶的信念。从意志上来说，你是垃圾。我也不想和垃圾为伍！永远留在你的世界里，永远不要出来！"
  npc_override_prt_castle_quests_morocc_you_don_t_need_what_573e12: "你不必……你只需要知道的是我做出了牺牲。为了让我的死有意义，你应该成为一个好国王。这是我的信念……就是这样……咳……！别忘记我的话……咳呃。"
  npc_override_prt_castle_quests_morocc_you_don_t_worry_e77aeb: "你不必担心。"
  npc_override_prt_castle_quests_morocc_you_enough_53ebcd: "你必须有足够的"
  npc_override_prt_castle_quests_morocc_you_experienced_traveler_bfbf81: "你是个经验丰富的旅行者。你有足够的力量，但是……宫廷不是仅凭强大力量和战斗经验来选人的。"
  npc_override_prt_castle_quests_morocc_you_fast_worker_getting_42aa98: "你是个快手，把活干完了！"
  npc_override_prt_castle_quests_morocc_you_fully_violent_now_c0344b: "你现在完全暴力了。"
  npc_override_prt_castle_quests_morocc_you_go_room_where_prince_8a48f8: "你可以通过暗门去王子们聚集的房间。出于安全考虑，那里是完全守卫和隐蔽的。"
  npc_override_prt_castle_quests_morocc_you_got_instructions_as_9ad5c1: "你得到了该做什么的指示，对吧？这个问题没有那么不值一提，你不能掉以轻心！注意这一点！"
  npc_override_prt_castle_quests_morocc_you_hear_ahrum_s_voice_b22231: "-你可以听到阿鲁姆的声音"
  npc_override_prt_castle_quests_morocc_you_heard_glastheim_area_b5f31a: "你听说过克雷斯特汉姆吗？在那个区域，有种叫深渊骑士的怪物。"
  npc_override_prt_castle_quests_morocc_you_judege_d9645d: "你是审判官。"
  npc_override_prt_castle_quests_morocc_you_just_gave_correct_an_833268: "但你目前只答对了 1 次。"
  npc_override_prt_castle_quests_morocc_you_kill_me_you_just_ab75a1: "你会杀了我……你只是想被杀"
  npc_override_prt_castle_quests_morocc_you_learn_more_details_c_f1936e: "你可以在宫廷里了解更多细节。我的任务只是把这个消息传达给一个可靠而勇敢的冒险者。"
  npc_override_prt_castle_quests_morocc_you_like_germ_talk_like_d6d5c8: "你这样的细菌能那样说话"
  npc_override_prt_castle_quests_morocc_you_me_favor_then_i_620c29: "你吗？……那就帮我个忙吧。我是内里乌斯家族的嫡子。我叫埃里希。你可以叫我埃里希王子。"
  npc_override_prt_castle_quests_morocc_you_meet_candidates_one_d092c6: "你必须逐一拜访候选人，问一些关于他们品质的问题；或者观察他们的行为，然后回来向我详细汇报你所观察到的一切。"
  npc_override_prt_castle_quests_morocc_you_met_little_girl_alde_7b2aca: "你在艾尔帕兰见过那个小女孩吗？"
  npc_override_prt_castle_quests_morocc_you_might_believe_power_b664bd: "你可能相信国王的权力是无限的，但作为一个人，它是有局限的。"
  npc_override_prt_castle_quests_morocc_you_most_during_your_tra_21bdc0: "你在训练中最……"
  npc_override_prt_castle_quests_morocc_you_must_know_what_walte_a8736f: "你必须知道瓦尔特和盖博尔格做了什么。两个家族都站在国家顶端。"
  npc_override_prt_castle_quests_morocc_you_new_adventurer_appra_e1cd05: "你是新来的冒险者鉴定师吗？？"
  npc_override_prt_castle_quests_morocc_you_new_adventurer_appra_f30e98: "你是新来的冒险者鉴定师吗？我是瓦尔特家族的艾根·阿鲁姆。方便的话可以叫我阿鲁姆王子。"
  npc_override_prt_castle_quests_morocc_you_new_appraiser_i_am_966463: "你是新来的鉴定师吗？我受够这么多访客了！我们直接谈正事吧！"
  npc_override_prt_castle_quests_morocc_you_person_supposed_look_8789fb: "你就是那个来审视我、评估我品质的人吗？"
  npc_override_prt_castle_quests_morocc_you_really_think_celebra_c8a695: "你真的认为庆祝活动对国家来说是有意义的吗？"
  npc_override_prt_castle_quests_morocc_you_reins_i_mentioned_c31efa: "你带了我说的那 2 根缰绳了吗？"
  npc_override_prt_castle_quests_morocc_you_seen_him_appraiser_1bc407: "你见过他吗，鉴定师？"
  npc_override_prt_castle_quests_morocc_you_so_kind_452fde: "你真好。"
  npc_override_prt_castle_quests_morocc_you_so_low_i_misjudged_831eb0: "……你太低级了。我看错你了。你不是少数有艺术眼光的人之一。我完全看错了你。"
  npc_override_prt_castle_quests_morocc_you_still_weak_personali_14ef9d: "你的性格还是很软弱。我并没有强迫他做什么难事！谁在乎呢？我把沉默当作肯定的回答！我的出价成功了！我们的约定也成立了！"
  npc_override_prt_castle_quests_morocc_you_supposed_here_3e8a03: "你不应该在这里！"
  npc_override_prt_castle_quests_morocc_you_sure_410bf2: "你确定吗？"
  npc_override_prt_castle_quests_morocc_you_t_know_so_what_9ec229: "你不可能知道！那又怎样？！就算你知道，你又能做什么？你对一切都太骄傲了。你以为你能培养一棵深深腐烂的树，让它变成健康的树吗？！"
  npc_override_prt_castle_quests_morocc_you_take_these_flowers_g_4c3270: "你愿意带上这些花，去艾尔帕兰某处替我给那个女孩道谢吗？"
  npc_override_prt_castle_quests_morocc_you_trying_explain_clear_019d3e: "你在试图说清楚……？越来越复杂了。你到底想说什么？让我直接听明白。"
  npc_override_prt_castle_quests_morocc_you_ve_come_engage_8ea5e8: "你是来参与"
  npc_override_prt_castle_quests_morocc_you_ve_fulfilled_job_as_c54b13: "你已经完成了"
  npc_override_prt_castle_quests_morocc_you_ve_never_even_taken_ff46a6: "你甚至从未执行过如此危险的任务！你怎么敢以为你能来这个地方？我觉得你无法胜任评估王子的工作。"
  npc_override_prt_castle_quests_morocc_you_want_beaten_down_914135: "你想被揍一顿吗？"
  npc_override_prt_castle_quests_morocc_you_won_times_row_right_6e0287: "你连续赢了 2 次吧？……"
  npc_override_prt_castle_quests_morocc_you_worse_than_me_king_e885f6: "但你比我还差！！国王候选人？？你只是个战争贩子！"
  npc_override_prt_castle_quests_morocc_your_family_aware_your_c_452967: "你的家人知道你这些疯狂的行为吗？你在毁掉你和家族的名声。"
  npc_override_prt_castle_quests_morocc_your_humanity_test_done_63632a: "你的人性测试已完成。"
  npc_override_prt_castle_quests_morocc_your_life_4ba5eb: "在你的人生中？"
  npc_override_prt_castle_quests_morocc_your_spirit_must_so_stro_5a22f1: "你的意志一定非常坚强。盯着我的美貌看了这么久，你还没有失去神志。"
  npc_override_prt_castle_quests_morocc_your_theory_you_also_eli_872338: "按你的理论，你也没有资格拥有国王的品质！"
