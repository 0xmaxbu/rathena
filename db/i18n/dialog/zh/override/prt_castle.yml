  npc_override_prt_castle_quests_morocc_presence_such_gorgeous_k_b4231b: "像我这样华丽的国王的存在，将成为人民的光明、希望和生命的意义。"
  npc_override_prt_castle_quests_morocc_prevent_people_s_disorde_92c6b0: "为了防止人民动乱，还不会宣布。宫廷目前专注于选出下任国王。他们正忙于考虑这件事。"
  npc_override_prt_castle_quests_morocc_prince_eigen_ahrum_walte_aeed09: "瓦尔特家族的艾根·阿鲁姆王子。你能重新评估所有候选人吗？这事很紧急。"
