  npc_override_prt_castle_quests_morocc_way_i_happened_9097b3: "顺便说一句，我偶然"
  npc_override_prt_castle_quests_morocc_we_close_friends_unlike_6ef761: "我们是亲密的朋友。和我不同，他善良而富有同情心，是个杰出的公共事务官员。当他必须严格时，他对每个人都严格。"
  npc_override_prt_castle_quests_morocc_we_make_93b03b: "我们能做到。"
