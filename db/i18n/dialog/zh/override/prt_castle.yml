  npc_override_prt_castle_quests_morocc_qualified_enough_evaluat_042916: "有足够的资格评价他人。我为最初对你的粗鲁行为道歉。"
  npc_override_prt_castle_quests_morocc_quiet_someone_comes_dfab38: "安静……有人来了。"
  npc_override_prt_castle_quests_morocc_quite_fit_scholar_type_p_1a5d66: "很适合学者型的人。"
  npc_override_prt_castle_quests_morocc_real_king_s_appearance_i_f1a677: "为了真正的国王的到来……我今晚要去……为你走向黑暗。……啊啊啊啊啊啊！！！"
  npc_override_prt_castle_quests_morocc_reality_what_reality_wha_c27ed4: "现实？什么现实？你感觉到了什么？你不是真实的你。我完全帮不了你！"
  npc_override_prt_castle_quests_morocc_reason_i_assure_you_no_02c274: "因此，我向你保证，他们中没有人适合这个位置。如果我必须选一个能和我匹敌的人，我可以说是恩斯特。"
  npc_override_prt_castle_quests_morocc_reasonable_judgement_2b9fc7: "以合理的判断"
  npc_override_prt_castle_quests_morocc_reasonable_judgement_7b246f: "和合理的判断，"
  npc_override_prt_castle_quests_morocc_rest_peace_5d2af9: "……安息吧。"
