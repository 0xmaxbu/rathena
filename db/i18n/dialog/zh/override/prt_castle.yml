  npc_override_prt_castle_quests_morocc_strong_conviction_66e59a: "以坚定的信念，"
  npc_override_prt_castle_quests_morocc_such_idiot_i_should_kill_5bcce9: "真是个白痴。我应该早点杀了他。现在我感觉轻松了。"
  npc_override_prt_castle_quests_morocc_such_villain_d35961: "那……真是个恶棍！！！"
