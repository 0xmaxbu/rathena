  npc_override_prt_castle_quests_morocc_i_like_hearing_about_pri_b4e8ae: "我喜欢听关于王子们的事。"
  npc_override_prt_castle_quests_morocc_i_love_challenge_hard_tr_7b8cfe: "我也喜欢挑战艰险的旅程。爱唠叨的老人和他们的冒险……你无法阻止我冒险……"
  npc_override_prt_castle_quests_morocc_i_m_saying_they_aren_f2271a: "我不是说他们不优秀，但考虑到卢恩-米德加尔特目前的状况，他们似乎不是令人惊叹的领导者。"
  npc_override_prt_castle_quests_morocc_i_m_sure_i_only_52323a: "我确定，我只给出明确的"
  npc_override_prt_castle_quests_morocc_i_now_pick_card_a7ae5e: "我现在抽一张牌！"
  npc_override_prt_castle_quests_morocc_i_only_like_reading_book_e8fbb3: "我只喜欢看书作为爱好。我觉得男人应该前进，要有奋发向上的态度。"
  npc_override_prt_castle_quests_morocc_i_order_you_out_66549b: "我命令你离开"
  npc_override_prt_castle_quests_morocc_i_really_appreciate_d0d354: "我真的很感激。"
  npc_override_prt_castle_quests_morocc_i_really_appreciate_your_fee425: "我非常感谢你一直以来的协助。因为你的帮助，王国的未来欠你一份人情。"
  npc_override_prt_castle_quests_morocc_i_really_feel_sorry_abou_7c2f10: "为琐事麻烦你，我真的很过意不去。请收下这个。"
  npc_override_prt_castle_quests_morocc_i_respect_your_strength_0491b9: "我会尊重你的力量。"
  npc_override_prt_castle_quests_morocc_i_saw_person_walter_fami_d8314a: "我看到了瓦尔特家族的人。"
  npc_override_prt_castle_quests_morocc_i_say_zillion_times_urug_767796: "我能说一万次！乌鲁根，你一点也不美！一点也不！事实上，你的样子很丑很下流！"
  npc_override_prt_castle_quests_morocc_i_some_belief_benefit_un_12ad69: "我相信无限竞争的好处。说实话，我不喜欢这个贵族家族的王位选举制度。"
  npc_override_prt_castle_quests_morocc_i_stay_here_find_other_f8d9fc: "我会留在这里找其他冒险者。愿你的心灵为卢恩-米德加尔特带来伟大荣耀！"
  npc_override_prt_castle_quests_morocc_i_still_t_believe_my_dc7d45: "我仍然无法相信我的眼睛。我刚刚去世的阿鲁姆王子……～～"
