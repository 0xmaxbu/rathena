  npc_override_prt_castle_quests_morocc_sorrowful_reality_others_b1713a: "向他人诉说这悲伤的现实。"
  npc_override_prt_castle_quests_morocc_spirit_nationalism_when_3ca72a: "我成为国王时的民族精神？"
