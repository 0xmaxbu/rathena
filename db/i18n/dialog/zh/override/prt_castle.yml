  npc_override_prt_castle_quests_morocc_i_could_hear_ahrum_s_ee3d29: "- 我能听到阿鲁姆的声音"
  npc_override_prt_castle_quests_morocc_i_could_know_about_you_35fb04: "我可以通过摊开的牌很好地了解你，但这次让我分享我的底牌！想问什么就问吧。"
  npc_override_prt_castle_quests_morocc_i_d_like_ask_about_fe0460: "我想问关于……"
  npc_override_prt_castle_quests_morocc_i_don_t_care_what_60118d: "我不在乎是什么！"
  npc_override_prt_castle_quests_morocc_i_don_t_give_importance_d0f14e: "我完全不重视，所以记不太清楚……"
  npc_override_prt_castle_quests_morocc_i_don_t_know_how_67c27d: "我不知道别人怎么反应，但我觉得你的问题让我很紧张。我不应该这样，但我没有不同的看法！"
  npc_override_prt_castle_quests_morocc_i_don_t_know_king_7c6589: "我……不知道！国王……你！"
  npc_override_prt_castle_quests_morocc_i_don_t_know_what_7432e8: "……我不知道你在说什么，但毫无意义的事情是不存在的。我觉得你不了解这一点。"
