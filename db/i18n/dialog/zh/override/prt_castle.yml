  npc_override_prt_castle_quests_morocc_i_hope_you_ask_me_c6e0f4: "我希望你问简短的问题。长问题不一定意味着特别好的答案。"
  npc_override_prt_castle_quests_morocc_i_hope_you_help_bring_244e68: "希望你能帮助带来"
