  npc_override_prt_castle_quests_morocc_i_think_you_shouldn_t_58ca48: "我觉得你不该在这里。"
  npc_override_prt_castle_quests_morocc_i_told_you_don_t_c412c2: "……我告诉过你，别吵！"
  npc_override_prt_castle_quests_morocc_i_told_you_i_don_3ceb4a: "我告诉过你我不想当国王，我也无意改变主意！"
  npc_override_prt_castle_quests_morocc_i_totally_couldn_t_get_7d640b: "我完全搞不懂他。"
