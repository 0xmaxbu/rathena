  npc_override_prt_castle_quests_morocc_s_too_late_once_your_aceeb6: "太晚了……一旦你的要害被刺中……我不知道我怎么能活下来……或者怎么复活……我不需要活下去。"
  npc_override_prt_castle_quests_morocc_s_very_hard_me_cf7138: "这对我来说很难做到。"
  npc_override_prt_castle_quests_morocc_s_very_rude_how_could_75f28e: "太无礼了！像你这样的肮脏细菌怎么能这样跟我说话！"
  npc_override_prt_castle_quests_morocc_s_why_walter_family_gaeb_ad545c: "这就是为什么瓦尔特家族和盖博尔格家族不能共存。他们的共存会带来毁灭，就像过去一样。"
  npc_override_prt_castle_quests_morocc_same_you_if_you_really_968aa5: "但对你来说也一样。如果你真的想对那个女孩表达感激之情，你应该亲自去见她。你做不到，不是吗？"
  npc_override_prt_castle_quests_morocc_seems_even_brother_ahrum_672bd2: "看来连阿鲁姆兄弟也没见过他。嗯……"
  npc_override_prt_castle_quests_morocc_sense_i_want_simple_expe_443963: "从这个意义上说，我想做一个简单的实验。"
  npc_override_prt_castle_quests_morocc_sense_next_examination_t_d5f9f8: "从某种意义上说，下一次考试是测试你的品格。这只是一系列简单的问题，但先放松，做好心理准备……然后再来跟我谈。"
