  npc_override_prt_castle_quests_morocc_shut_up_if_you_contented_70e25b: "闭嘴！如果你不满意，你可以按约定杀了我！你……我……我……！！我不想再谈了，我要回房间了！"
  npc_override_prt_castle_quests_morocc_shut_up_shut_up_4ad332: "闭嘴闭嘴！！！！！！！！"
  npc_override_prt_castle_quests_morocc_shut_up_without_knowing_fa956e: "闭嘴！什么都不知道，你都不知道什么时候会被杀。你还没懂我……啊……！你不需要知道这个！"
  npc_override_prt_castle_quests_morocc_since_i_young_i_grown_54cb6e: "从小我就接受王室教育长大。我没有和别人认真争吵过，但我也不是很有礼貌。"
  npc_override_prt_castle_quests_morocc_so_far_e79c21: "到目前为止。"
  npc_override_prt_castle_quests_morocc_so_i_ask_you_us_4cac55: "所以，我请求你帮我们一个忙。你已经成为一个正式的冒险者鉴定师了。"
  npc_override_prt_castle_quests_morocc_so_keep_up_good_work_6f31e0: "所以，继续保持良好工作。"
  npc_override_prt_castle_quests_morocc_so_moronic_you_say_you_77fd50: "太愚蠢了！你能说你像个国王吗？！你现在是在向我表示同情吗？你应该是个有见识的人！如果不是，你就没有资格当国王候选人！"
  npc_override_prt_castle_quests_morocc_so_time_court_decided_ch_9d5f4f: "所以这次，宫廷决定改变方式，把评估候选人的机会交给像你这样有名望和忠诚的冒险者。这就是你在这里的原因。"
  npc_override_prt_castle_quests_morocc_so_what_you_want_know_212393: "那么……你想知道什么？！"
  npc_override_prt_castle_quests_morocc_so_you_project_prince_er_b156fe: "那么，你在参与恩斯特王子中毒的计划吗？"
