  npc_override_prt_castle_quests_morocc_i_think_enough_0f993a: "我觉得这足够了"
  npc_override_prt_castle_quests_morocc_i_think_great_ability_i_76442d: "我觉得这是种了不起的能力，我应该学习。但是，这不仅关乎结果，也是礼貌问题。我们应该保留一些必须做的事。"
  npc_override_prt_castle_quests_morocc_i_think_i_made_big_16a101: "我……觉得我对鉴定师犯了个大错！"
  npc_override_prt_castle_quests_morocc_i_think_s_hard_work_0ae92f: "我觉得评判人才是项艰苦的工作。我会尽力帮助你。"
  npc_override_prt_castle_quests_morocc_i_think_those_games_21c7c6: "我觉得那些游戏是"
  npc_override_prt_castle_quests_morocc_i_think_you_01ccfb: "我觉得你是"
  npc_override_prt_castle_quests_morocc_i_think_you_allowed_dff0da: "我觉得你不被允许"
  npc_override_prt_castle_quests_morocc_i_think_you_already_clue_005373: "我想你已经从我的话里得到了线索……"
