  npc_override_prt_castle_quests_morocc_i_t_find_one_distinguish_58efee: "但我找不到一个能领导这个王国的杰出人物。"
  npc_override_prt_castle_quests_morocc_i_t_stand_passive_games_7d777e: "我受不了被动的游戏，"
  npc_override_prt_castle_quests_morocc_i_talked_about_my_impres_5b0d8c: "-我说了我的印象"
