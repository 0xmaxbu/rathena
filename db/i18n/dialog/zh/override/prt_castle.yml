  npc_override_prt_castle_quests_morocc_i_don_t_think_439787: "我不认为"
  npc_override_prt_castle_quests_morocc_i_don_t_think_i_58cba2: "我不认为我对你有什么恰当的评价……我不觉得对他有什么特别要说的。你可以按你所见的来评价他……"
  npc_override_prt_castle_quests_morocc_i_don_t_think_you_1312e5: "我不认为你是"
  npc_override_prt_castle_quests_morocc_i_don_t_think_you_98b5e0: "我不认为你配得上"
  npc_override_prt_castle_quests_morocc_i_don_t_think_you_da1ae6: "我不认为你有资格"
  npc_override_prt_castle_quests_morocc_i_don_t_want_bothered_873ee7: "我不想被家人打扰。"
  npc_override_prt_castle_quests_morocc_i_don_t_want_confront_3a8c70: "我不想面对你。"
  npc_override_prt_castle_quests_morocc_i_don_t_want_see_dc7cce: "我不想见任何人。"
  npc_override_prt_castle_quests_morocc_i_don_t_want_talk_d9a1eb: "我不想和"
  npc_override_prt_castle_quests_morocc_i_enjoy_activities_a12b78: "我喜欢活动。"
  npc_override_prt_castle_quests_morocc_i_give_you_some_61f879: "我会给你一些"
  npc_override_prt_castle_quests_morocc_i_go_home_early_56199c: "我会早点回家"
  npc_override_prt_castle_quests_morocc_i_go_see_her_my_c2f842: "我会自己去看她。"
  npc_override_prt_castle_quests_morocc_i_got_business_d11095: "我有事……"
