Body:
  npc_override_prt_castle_brisingamen_seal_age_1ccdbd: "22 岁……"
  npc_override_prt_castle_brisingamen_seal_became_fugitive_b81f88: "成了逃犯？"
  npc_override_prt_castle_brisingamen_seal_despite_severity_offense_3fcae1: "^663300尽管罪行严重，但她只是被逐出十字军，并被强制剥夺了赐予她的神圣力量……^000000"
  npc_override_prt_castle_brisingamen_seal_did_they_want_sentence_h_eb07ae: "他们是想判她死刑还是怎么的？这也太残忍了。她一定受尽了屈辱……"
  npc_override_prt_castle_brisingamen_seal_disgrace_crusaders_77fd73: "十字军的耻辱？"
  npc_override_prt_castle_brisingamen_seal_don_t_touch_anything_fc497b: "别碰任何东西！"
  npc_override_prt_castle_brisingamen_seal_female_856c8a: "女性……"
  npc_override_prt_castle_brisingamen_seal_finish_reading_12a58c: "读完！）"
  npc_override_prt_castle_brisingamen_seal_get_hell_a60d84: "快滚"
  npc_override_prt_castle_brisingamen_seal_here_bottom_1f745f: "在底下这里？"
  npc_override_prt_castle_brisingamen_seal_highly_classified_offici_80ae54: "属于高度机密。官方记录中，洛温·埃勒宁在执行任务时阵亡。^000000"
  npc_override_prt_castle_brisingamen_seal_however_information_891cb5: "^663300然而，这些信息"
  npc_override_prt_castle_brisingamen_seal_huh_a78e67: "嗯……？"
  npc_override_prt_castle_brisingamen_seal_i_didn_t_get_bddc7e: "我没能"
  npc_override_prt_castle_brisingamen_seal_i_left_off_e53dd7: "我停在了……"
  npc_override_prt_castle_brisingamen_seal_i_should_read_9e4d1c: "我应该读一下这个"
  npc_override_prt_castle_brisingamen_seal_information_4ff8d5: "信息是"
  npc_override_prt_castle_brisingamen_seal_isn_t_same_a8da37: "这不是同一个"
  npc_override_prt_castle_brisingamen_seal_librarian_told_me_42de2e: "图书管理员告诉我的！"
  npc_override_prt_castle_brisingamen_seal_lowen_ellenen_aad6e1: "洛温·埃勒宁。^000000"
  npc_override_prt_castle_brisingamen_seal_lowen_ellenen_eb196a: "洛温·埃勒宁……"
  npc_override_prt_castle_brisingamen_seal_lowen_nd_squad_returned_837391: "^663300第二小队的洛温在事件发生 3 天后返回了所属部队。经过审判，她因临阵脱逃被判有罪。^000000"
  npc_override_prt_castle_brisingamen_seal_member_17b59a: "的成员"
  npc_override_prt_castle_brisingamen_seal_nd_squad_9592c0: "第二小队……"
  npc_override_prt_castle_brisingamen_seal_no_wonder_librarian_585229: "难怪图书管理员"
  npc_override_prt_castle_brisingamen_seal_now_let_s_see_a88fef: "现在让我们看看……"
  npc_override_prt_castle_brisingamen_seal_nuts_db5721: "（该死……！"
  npc_override_prt_castle_brisingamen_seal_out_here_21dc4d: "离开这里！"
  npc_override_prt_castle_brisingamen_seal_point_where_4dbeca: "从那个地方"
  npc_override_prt_castle_brisingamen_seal_saying_anything_huh_e13346: "说什么。嗯。"
  npc_override_prt_castle_brisingamen_seal_seemed_hesitate_before_27ee53: "似乎在说之前"
  npc_override_prt_castle_brisingamen_seal_she_forced_leave_crusade_707a88: "她被强制离开了十字军？！太荒谬了！"
  npc_override_prt_castle_brisingamen_seal_should_i_try_meet_her_c85ce2: "我应该试着再去见她吗？"
  npc_override_prt_castle_brisingamen_seal_some_effects_belonging_e49b65: "和一些属于"
  npc_override_prt_castle_brisingamen_seal_some_kind_secret_7d6828: "某种秘密？"
  npc_override_prt_castle_brisingamen_seal_sounds_pretty_messy_e3ea62: "听起来挺复杂的。"
  npc_override_prt_castle_brisingamen_seal_they_thought_she_brought_6337f8: "他们认为她带来了"
  npc_override_prt_castle_brisingamen_seal_what_ce3d72: "什么……？"
  npc_override_prt_castle_brisingamen_seal_what_s_mark_f96458: "这是什么标记"
  npc_override_prt_castle_brisingamen_seal_what_you_doing_99d1c5: "你在做什么？"
  npc_override_prt_castle_brisingamen_seal_what_you_doing_here_74351b: "你在这里做什么？"
  npc_override_prt_castle_brisingamen_seal_who_you_2d876b: "你是谁！"
  npc_override_prt_castle_brisingamen_seal_yawn_276bfa: "^666666*哈欠……*^000000"
  npc_override_prt_castle_brisingamen_seal_years_later_after_incide_6f2911: "^663300事件发生 2 年后，一支远征队发现了生锈的盔甲碎片、一把断剑"
  npc_override_prt_castle_brisingamen_seal_you_took_book_shelf_whil_3fc13d: "^3355FF你趁图书管理员打盹时从书架上拿走了这本书。根据十字军人事档案，只有一名新兵名叫洛温·埃勒宁。"
  npc_override_prt_castle_kings_items_as_promised_here_my_0a180b: "按照约定，这是我的{0}"
  npc_override_prt_castle_kings_items_come_back_after_you_get_d080d4: "集齐所有物品后再回来。"
  npc_override_prt_castle_kings_items_fine_then_hmph_ae77fd: "那好吧！哼！！"
  npc_override_prt_castle_kings_items_he_s_king_prontera_he_73547a: "他是普隆德拉的国王，他应该能给我弄到任何东西！！！"
  npc_override_prt_castle_kings_items_hello_you_help_me_e09654: "你好，你能帮我吗？"
  npc_override_prt_castle_kings_items_hmph_i_hate_my_dad_5360e2: "哼，我现在讨厌我父亲！！"
  npc_override_prt_castle_kings_items_i_ll_give_my_5858cc: "我会把我的{0}"
  npc_override_prt_castle_kings_items_i_ll_give_you_my_1dfecf: "我会把我的王冠或剑作为奖励给你。"
  npc_override_prt_castle_kings_items_if_you_get_her_these_0740bb: "如果你给她这些东西，我相信她会冷静下来的。"
  npc_override_prt_castle_kings_items_menu_crown_ef6466: "王冠:剑"
  npc_override_prt_castle_kings_items_menu_if_8ef6cd: "如果你能帮我弄到:"
  npc_override_prt_castle_kings_items_menu_sure_c1cf97: "当然，我能做什么？:抱歉，我很忙。"
  npc_override_prt_castle_kings_items_menu_what_476462: "你需要什么？:我有那些物品！:算了。"
  npc_override_prt_castle_kings_items_menu_why_351ed0: "为什么？:随便吧……"
  npc_override_prt_castle_kings_items_ok_s_fine_i_m_1d1677: "好吧，没关系，我相信会有别人帮忙的。"
  npc_override_prt_castle_kings_items_surely_calm_her_down_3df088: "这一定能让她冷静下来。"
  npc_override_prt_castle_kings_items_thank_you_soo_much_bf5d95: "太谢谢你了！！"
  npc_override_prt_castle_kings_items_thank_you_well_my_daught_9f92bd: "谢谢你。唉，我旁边的女儿有点闹腾……"
  npc_override_prt_castle_kings_items_well_he_won_t_give_73ba7c: "哼，他不给我想要的东西！！"
  npc_override_prt_castle_kings_items_what_item_you_want_74299a: "你想要什么物品？"
  npc_override_prt_castle_kings_items_x_f2bf86: " ~ ^0055FF{0}^000000x {1}"
  npc_override_prt_castle_kings_items_you_re_missing_something_ccbb1f: "你缺了什么东西。"
  npc_override_prt_castle_quests_morocc_aahh_boring_boring_dff58c: "啊……好无聊，好无聊。"
  npc_override_prt_castle_quests_morocc_about_i_don_t_make_b1a103: "关于这件事，但我无论如何都不会追究。真是个吹毛求疵的混蛋。"
  npc_override_prt_castle_quests_morocc_above_all_i_want_5a1bc6: "最重要的是，我想要"
  npc_override_prt_castle_quests_morocc_accordingly_i_take_benef_8ba849: "因此，我会从阶级差异中获取利益。这不是平等问题，而是为了国力的提升。"
  npc_override_prt_castle_quests_morocc_adventurer_appraiser_ful_5d1bdd: "充分地鉴定冒险者。"
  npc_override_prt_castle_quests_morocc_after_beating_knights_ab_a02bdf: "在击败深渊骑士之后"
  npc_override_prt_castle_quests_morocc_after_getting_reins_d83a04: "在拿到 2 根缰绳之后。"
  npc_override_prt_castle_quests_morocc_after_long_time_sufferin_42eb43: "……在长期忍受疾病折磨之后。"
  npc_override_prt_castle_quests_morocc_ah_971301: "啊……"
  npc_override_prt_castle_quests_morocc_ah_appraiser_come_3caaa1: "啊，鉴定师来了。"
  npc_override_prt_castle_quests_morocc_ah_c927a2: "啊，是这样吗？"
  npc_override_prt_castle_quests_morocc_ah_course_middle_number_6c505c: "啊，当然，7 是中间数。7 意味着不好不坏。这个游戏的目标是连续答对 2 次。我们开始吧！"
  npc_override_prt_castle_quests_morocc_ah_hold_moment_brother_a_41df33: "啊。等一下兄弟！啊鲁姆！"
  npc_override_prt_castle_quests_morocc_ah_i_heard_person_walter_47e22b: "啊，我听说瓦尔特家族的人来了。你见过他吗？"
  npc_override_prt_castle_quests_morocc_ah_now_i_am_going_afbd7d: "啊，现在我要和阿鲁姆兄弟商量一个计划了。"
  npc_override_prt_castle_quests_morocc_ah_please_leave_here_47b3b1: "……啊，请离开这里。"
  npc_override_prt_castle_quests_morocc_ah_prince_735fb2: "啊，王子！"
  npc_override_prt_castle_quests_morocc_ah_those_last_words_ae80f1: "啊，那些最后的话"
  npc_override_prt_castle_quests_morocc_ah_you_ve_spent_long_fa082f: "啊，你陪了我很长时间。你一定很累了。开始工作前，如果你需要准备的话，现在就去吧，稍后再来找我。我会在这里等你。"
  npc_override_prt_castle_quests_morocc_ahh_appraiser_you_know_w_732a3c: "啊啊……鉴定师，你知道该做什么吗？注意你的言辞。关于你看到的、听到的……你不能把所有经历都告诉监察官。"
  npc_override_prt_castle_quests_morocc_ahh_i_see_777785: "啊啊，我明白了。"
  npc_override_prt_castle_quests_morocc_ahh_mmm_i_8d4438: "啊啊……嗯……我……"
  npc_override_prt_castle_quests_morocc_ahh_you_came_meet_me_09a9cd: "啊啊，你之前就来见过我了吧？我猜你已经去过克雷斯特汉姆了。"
  npc_override_prt_castle_quests_morocc_ahrum_ahrum_66ee1a: "阿鲁姆……阿鲁姆……"
  npc_override_prt_castle_quests_morocc_ahrum_blushes_f32cc3: "-阿鲁姆脸红了-"
  npc_override_prt_castle_quests_morocc_ahrum_casually_throws_ba_68b3db: "- 阿鲁姆随手把一把巴泽尔德扔给恩斯特。-"
  npc_override_prt_castle_quests_morocc_ahrum_elected_once_termi_f3671b: "一旦恩斯特王子的任期结束，阿鲁姆就会被选举，然后……"
  npc_override_prt_castle_quests_morocc_ahrum_getting_weird_fde2f2: "阿鲁姆变得奇怪了。"
  npc_override_prt_castle_quests_morocc_ahrum_grins_vague_feelin_6bd432: "-阿鲁姆对恼火的赫尔穆特露出含糊的笑容，离开了房间。-"
  npc_override_prt_castle_quests_morocc_ahrum_help_me_supplement_b312ed: "阿鲁姆会帮我弥补任何不足。不仅是阿鲁姆，所有大臣和内阁成员，以及公众都是我的导师。"
  npc_override_prt_castle_quests_morocc_ahrum_seems_out_his_mind_b4419d: "-阿鲁姆似乎精神恍惚，走向门口-"
  npc_override_prt_castle_quests_morocc_ahrum_shows_gloomy_facia_b6dfa3: "-阿鲁姆露出阴郁的表情，离开了房间。-"
  npc_override_prt_castle_quests_morocc_ahrum_strides_out_room_g_7b606b: "-阿鲁姆大步走出房间，咕哝着……-"
  npc_override_prt_castle_quests_morocc_ahrum_totally_neglects_6cb730: "-阿鲁姆完全无视了"
  npc_override_prt_castle_quests_morocc_ahrum_what_s_wrong_you_d29240: "……阿鲁姆，你怎么了？你不是我认识的那个阿鲁姆了。是什么让你变成这样的？"
  npc_override_prt_castle_quests_morocc_akk_i_cannot_stand_such_502acd: "啊！我受不了了！如此低劣的行为和言语……？你不是王子。我不想再面对你了！滚出去！"
  npc_override_prt_castle_quests_morocc_all_glory_be3d28: "一切为了荣耀"
  npc_override_prt_castle_quests_morocc_all_glory_rune_midgarts_08bd6a: "一切荣耀属于卢恩-米德加尔特……"
  npc_override_prt_castle_quests_morocc_all_means_witness_agreem_e2b3ca: "务必作为这份协议的见证人。你不能拒绝。因为在某些方面，这对你的工作来说是件非常好的事，不是吗？"
  npc_override_prt_castle_quests_morocc_alright_19c82d: "好吧，"
  npc_override_prt_castle_quests_morocc_alright_alright_don_t_7eff53: "好了好了。别"
  npc_override_prt_castle_quests_morocc_alright_good_you_proved_97a01c: "很好。你证明了自己的实力。现在你通过了一项考试。只剩一项了。"
  npc_override_prt_castle_quests_morocc_alright_up_you_5d3989: "好吧，随你便。"
  npc_override_prt_castle_quests_morocc_also_you_ve_had_52395d: "而且你也有过"
  npc_override_prt_castle_quests_morocc_although_ahrum_strong_ca_fd429c: "虽然阿鲁姆是个强有力的候选人，但盖博尔格的王子也以德行著称。当然，最好还是确认一下。"
  npc_override_prt_castle_quests_morocc_although_all_these_ab8ea1: "尽管所有这些"
  npc_override_prt_castle_quests_morocc_although_i_ve_skipped_so_7e0c9a: "虽然我跳过了一些人生课程，但我可以轻松补上。谁在乎谁能向我宣誓成为国王！这就是我的风格。"
  npc_override_prt_castle_quests_morocc_although_you_may_ask_som_0e5b16: "虽然你可以问些什么，但你现在从他那里听不到什么特别的。"
  npc_override_prt_castle_quests_morocc_anyhow_thanks_your_good_63805f: "总之，感谢你的出色工作。为琐事麻烦你，我真的很过意不去。这是我的一点心意。别太有负担，收下吧。"
  npc_override_prt_castle_quests_morocc_anyway_we_got_little_bit_80eee8: "总之，我们还有一点时间。务必保守秘密，不要告诉任何人。"
  npc_override_prt_castle_quests_morocc_appraiser_335ef9: "鉴定师。"
  npc_override_prt_castle_quests_morocc_as_i_expressed_very_impo_357986: "正如我所表达的，这对卢恩-米德加尔特王国来说是一个非常重要的问题。虽然我已经反复强调过这一点，但再怎么强调也不为过。"
  npc_override_prt_castle_quests_morocc_as_leader_hunt_party_0e691d: "作为狩猎队伍的队长？"
  npc_override_prt_castle_quests_morocc_as_you_please_f1f0a2: "随你便。"
  npc_override_prt_castle_quests_morocc_as_you_said_d3de7c: "如你所说。"
  npc_override_prt_castle_quests_morocc_assumption_1fdf6f: "这是一个假设。"
  npc_override_prt_castle_quests_morocc_b_bro_brother_b0628d: "兄……兄弟！"
  npc_override_prt_castle_quests_morocc_b_bro_c78156: "兄……兄弟？"
  npc_override_prt_castle_quests_morocc_b_brother_even_now_too_b585c9: "兄……兄弟……现在还不晚！如果你去找医生，还能治好！"
  npc_override_prt_castle_quests_morocc_b_brother_how_how_could_ae0469: "兄……兄弟……你……你怎么能这样？！"
  npc_override_prt_castle_quests_morocc_b_you_live_as_you_39d147: "但……你可以像现在这样活下去！就当什么都没发生过。你只需要回到以前的样子。兄弟，让我帮你。告诉我你隐瞒的一切……"
  npc_override_prt_castle_quests_morocc_bbb_brother_you_told_me_66f1d1: "兄……兄弟？……你……告诉我要杀了我……你只是想被我杀吗？？……兄……兄弟？……"
  npc_override_prt_castle_quests_morocc_bbb_brother_you_told_me_b5cdba: "兄……兄弟？……你……告诉我说"
  npc_override_prt_castle_quests_morocc_beautiful_613e5f: "……并不美丽。"
  npc_override_prt_castle_quests_morocc_because_her_words_helped_e05253: "因为她的话语帮了我很多。没什么特别的，也许一小束花就好。"
  npc_override_prt_castle_quests_morocc_because_resurrection_dev_320a98: "因为魔鬼萨坦·梦罗克复活，人们难以安心遵循常规公告，王国的氛围也不稳定。"
  npc_override_prt_castle_quests_morocc_because_unknown_girl_s_l_bc20cb: "是因为一个不知名女孩的信……"
  npc_override_prt_castle_quests_morocc_before_everything_else_l_f71e10: "首先，我能出生在瓦尔特这个显赫的贵族家族，是我的幸运和荣耀。"
  npc_override_prt_castle_quests_morocc_before_getting_into_his_b9434d: "进入他的房间之前"
  npc_override_prt_castle_quests_morocc_before_going_into_his_ro_fecb25: "进入他的房间之前"
  npc_override_prt_castle_quests_morocc_behind_soldier_you_find_23d25e: "在士兵后面，你可以找到一扇暗门。如果你和士兵说话，士兵会允许你进去。"
  npc_override_prt_castle_quests_morocc_best_country_world_helpi_b192f0: "世界上最好的国家，通过互相帮助。"
  npc_override_prt_castle_quests_morocc_better_next_time_3d1404: "下次做得更好。"
  npc_override_prt_castle_quests_morocc_birth_king_s_family_what_9060cf: "出身？……王室？……这都是些什么？"
  npc_override_prt_castle_quests_morocc_both_family_lead_country_532142: "两个家族将共同领导这个国家，呼呼呼。"
  npc_override_prt_castle_quests_morocc_both_normal_public_promi_99d000: "普通民众和显贵人物共同管理社会，汇集智慧比自己单干更容易。"
  npc_override_prt_castle_quests_morocc_br_brother_you_keep_insi_63787c: "兄……兄弟，你还要坚持吗？我们的情谊就这么短暂吗？"
  npc_override_prt_castle_quests_morocc_br_brother_you_way_too_0298ff: "兄……兄弟。你太专制了。我们的鉴定师应该有他自己的立场和见解。"
  npc_override_prt_castle_quests_morocc_bring_beer_beer_1607f5: "拿啤酒来！啤酒！"
  npc_override_prt_castle_quests_morocc_bring_reins_ed5cda: "带来 2 根^ff0000缰绳^000000。"
  npc_override_prt_castle_quests_morocc_bro_tell_me_again_you_b8f940: "兄弟，再说一遍。你刚才说了什么？"
  npc_override_prt_castle_quests_morocc_brother_3875fa: "兄弟？！"
  npc_override_prt_castle_quests_morocc_brother_ahrum_0c3c52: "兄弟，阿鲁姆……？"
  npc_override_prt_castle_quests_morocc_brother_ahrum_142a1b: "……阿鲁姆兄弟……"
  npc_override_prt_castle_quests_morocc_brother_ahrum_been_blami_bdc0a4: "阿鲁姆兄弟一直在为此责备我，我觉得他责备得太久了。但他听我的话，并按我的建议行事。"
  npc_override_prt_castle_quests_morocc_brother_ahrum_ef3fee: "阿鲁姆兄弟……"
  npc_override_prt_castle_quests_morocc_brother_brother_why_why_cc62a3: "……兄弟……兄弟……为什么……为什么……你的脸看起来这么满足？怎么……？兄弟……"
  npc_override_prt_castle_quests_morocc_brother_ernst_my_family_0aa21d: "致恩斯特兄弟，来自我的家族。这是罪孽。而我是罪孽的一部分。作为家族的一部分。家族的罪孽。等同于我的罪孽。"
  npc_override_prt_castle_quests_morocc_brother_f7a05c: "兄弟……"
  npc_override_prt_castle_quests_morocc_brother_i_don_t_know_c72c09: "兄弟！我不知道你为什么这么痛苦！你是这么软弱的生物吗？！"
  npc_override_prt_castle_quests_morocc_brother_if_you_want_92c15e: "……兄弟，如果你愿意……"
  npc_override_prt_castle_quests_morocc_brother_what_s_wrong_you_a2ed8c: "兄弟，你怎么了？你疯了吗？"
  npc_override_prt_castle_quests_morocc_brother_you_think_about_5819a3: "兄弟，你想想地狱吧。"
  npc_override_prt_castle_quests_morocc_brother_you_think_about_cccd6a: "兄弟，你想想地狱吧。那永远不会发生，所以……别那么说。"
  npc_override_prt_castle_quests_morocc_brotherrrrrrrr_aed3a1: "兄弟！！！！！！！"
  npc_override_prt_castle_quests_morocc_bu_6290b4: "但……但是！"
  npc_override_prt_castle_quests_morocc_business_appraiser_b42941: "生意，鉴定师？"
  npc_override_prt_castle_quests_morocc_buzzzz_you_wrong_there_t_ecd832: "嗡嗡嗡。你错了。有一样东西本身是毫无意义的。明确地说，行为如果不知道其意义就会变得毫无意义……"
  npc_override_prt_castle_quests_morocc_calbern_f0b4f7: "卡尔伯恩。"
  npc_override_prt_castle_quests_morocc_calm_prudent_decision_412dcb: "以冷静和审慎的判断。"
  npc_override_prt_castle_quests_morocc_candidates_prince_536c47: "在王子候选人中，"
  npc_override_prt_castle_quests_morocc_check_someone_s_quality_aec8e7: "检验某人的品质"
  npc_override_prt_castle_quests_morocc_checking_your_qualificat_f39eb9: "检验你的资格是我的职责。"
  npc_override_prt_castle_quests_morocc_child_what_heck_happened_d76552: "孩子……你到底怎么了？……"
  npc_override_prt_castle_quests_morocc_childhood_brought_envy_j_70250c: "童年带来了男人们的嫉妒和无数女人的求爱。我对此感到厌烦，于是开始远离人群。"
  npc_override_prt_castle_quests_morocc_ciao_54d571: "再会……"
  npc_override_prt_castle_quests_morocc_come_here_b35a35: "过来。"
  npc_override_prt_castle_quests_morocc_coming_age_people_talk_a_9abff5: "在未来的时代，人们会称我为瓦尔特家族的艾根·阿鲁姆，而不是瓦尔特的艾根·阿鲁姆。"
  npc_override_prt_castle_quests_morocc_coming_inside_abca07: "是从里面传来的。-"
  npc_override_prt_castle_quests_morocc_coming_think_my_family_m_19ae62: "想想我的家族，我的人民太保守太不灵活了。"
  npc_override_prt_castle_quests_morocc_concise_facts_him_9e3411: "和简明的事实给他。-"
  npc_override_prt_castle_quests_morocc_conspiracy_two_families_993271: "（这是两个家族的阴谋吗？搞什么……）"
  npc_override_prt_castle_quests_morocc_corrupt_3c37f8: "腐败。"
  npc_override_prt_castle_quests_morocc_country_5407ed: "在这个国家？"
  npc_override_prt_castle_quests_morocc_course_even_autopsy_find_da78a5: "当然。即使尸检也找不到。……你不必担心。"
  npc_override_prt_castle_quests_morocc_course_my_abilities_277d47: "当然，我的能力"
  npc_override_prt_castle_quests_morocc_course_we_got_exception_2c370e: "当然，我们有一个例外……艾根。"
  npc_override_prt_castle_quests_morocc_coward_s_very_nice_word_ecc357: "懦夫……真是个不错的词。是的，我是。我要走了。嗒嗒！你比一个糟糕的懦夫……像我！更糟糕！再见，战争贩子！"
  npc_override_prt_castle_quests_morocc_crazy_jerk_beat_i_don_1f6c45: "……疯子。滚开。我不想再和你说话了。"
  npc_override_prt_castle_quests_morocc_cured_while_enemy_still_6df999: "必须在敌人还活着的时候治愈？"
  npc_override_prt_castle_quests_morocc_daffodil_you_gazing_call_a520a0: "你凝视的那朵水仙叫乌鲁根。它在维格纳家族绽放。"
  npc_override_prt_castle_quests_morocc_dagger_thrusting_sound_798c80: "（匕首刺入的声音）"
  npc_override_prt_castle_quests_morocc_damn_damn_19d2b6: "该死……该死！"
  npc_override_prt_castle_quests_morocc_damn_damn_63fa0f: "该死！该死……！！"
  npc_override_prt_castle_quests_morocc_decisive_mind_02c5ac: "以坚定的决心。"
  npc_override_prt_castle_quests_morocc_deserted_island_3428c3: "荒岛？"
  npc_override_prt_castle_quests_morocc_did_prince_erich_54fc6a: "埃里希王子……？"
  npc_override_prt_castle_quests_morocc_did_you_meet_my_brother_2ccc0f: "你见过我兄弟阿鲁姆吗？他是个了不起的人。真的。"
  npc_override_prt_castle_quests_morocc_did_you_meet_other_princ_833695: "你见过其他王子吗？"
  npc_override_prt_castle_quests_morocc_dirty_yes_i_am_i_251449: "肮脏？是的，我是。我很肮脏。但这不是我的问题。一切都很肮脏！我再也受不了了！"
  npc_override_prt_castle_quests_morocc_discomforts_me_c8984f: "让我不舒服……"
  npc_override_prt_castle_quests_morocc_doesn_t_work_well_cc24a0: "不太管用……"
  npc_override_prt_castle_quests_morocc_don_t_coy_i_m_f7098b: "别害羞了。我相信你已经做过了。"
  npc_override_prt_castle_quests_morocc_don_t_take_too_seriously_b8f9b3: "别太当真。"
  npc_override_prt_castle_quests_morocc_don_t_talk_way_daaf10: "别那么说。"
  npc_override_prt_castle_quests_morocc_don_t_you_anything_else_e5a0d4: "你没有别的好奇了吗？"
  npc_override_prt_castle_quests_morocc_done_know_your_attitude_c74872: "这是为了了解你在特定情况下的态度和行为。仔细听我的问题，并根据你旅途中的经历如实回答。"
  npc_override_prt_castle_quests_morocc_during_battle_f34637: "在战斗中？"
  npc_override_prt_castle_quests_morocc_each_kingdom_busy_preven_181306: "每个王国也都忙于阻止萨坦·梦罗克的干扰。"
  npc_override_prt_castle_quests_morocc_eh_lower_f7947d: "呃，更低？……"
  npc_override_prt_castle_quests_morocc_eh_what_s_about_bazerald_50ddf5: "呃？……这是怎么回事？……瓦尔特家族的巴泽尔德？……为什么？"
  npc_override_prt_castle_quests_morocc_eigen_ahrum_exception_he_12864d: "艾根·阿鲁姆可以是个例外。他并不礼貌，但他经过精确确认后能让人信服。"
  npc_override_prt_castle_quests_morocc_eigen_ahrum_yes_sir_a06613: "艾根·阿鲁姆……是的，阁下。"
  npc_override_prt_castle_quests_morocc_eigen_ahrum_you_c39a05: "……艾根·阿鲁姆。你……"
  npc_override_prt_castle_quests_morocc_empty_too_long_526b7b: "空置太久。"
  npc_override_prt_castle_quests_morocc_end_i_am_just_being_495d04: "到头来，我只是被利用……我竭尽全力成为主导。这一切都只是剧本的一部分……"
  npc_override_prt_castle_quests_morocc_enough_your_question_2986fb: "够回答你的问题了吗？"
  npc_override_prt_castle_quests_morocc_entering_room_5c7dc3: "进入这个房间？"
  npc_override_prt_castle_quests_morocc_erm_actually_2f1531: "……呃，实际上……"
  npc_override_prt_castle_quests_morocc_ern_killed_villain_here_a26142: "恩在这里杀了一个欺负人的恶棍……我没有机会……他表现出了果断的行动，这配得上他成为国王的权利……"
  npc_override_prt_castle_quests_morocc_ern_nags_me_lot_46addb: "恩经常唠叨我"
  npc_override_prt_castle_quests_morocc_ernst_174616: "恩斯特。"
  npc_override_prt_castle_quests_morocc_ernst_s_hand_307f5f: "出自恩斯特之手……？"
  npc_override_prt_castle_quests_morocc_every_case_there_excepti_a29804: "每种情况都有例外，就像你在宫廷里一样。你能离我远一点吗？因为你的气味，我几乎无法呼吸。"
  npc_override_prt_castle_quests_morocc_evidently_shown_his_face_0983ef: "明显地写在脸上。-"
  npc_override_prt_castle_quests_morocc_experienced_adventurer_d813d3: "经验丰富的冒险者……"
  npc_override_prt_castle_quests_morocc_experiencing_anything_ne_c97d7e: "体验新鲜事物！"
  npc_override_prt_castle_quests_morocc_feel_very_much_displease_f9d13f: "非常不满。喂，你在看什么？滚出去！"
  npc_override_prt_castle_quests_morocc_fight_s_so_rubbish_i_92ab87: "打架？太垃圾了。我不在乎。我只是来说我想对你说的话。我甚至不想和你打。我走了！"
  npc_override_prt_castle_quests_morocc_firmness_6c6d9b: "坚定地，"
  npc_override_prt_castle_quests_morocc_frankly_i_didn_t_expect_e1bf54: "说实话，我没想到你会带来它们。你很了不起。"
  npc_override_prt_castle_quests_morocc_frankly_prince_erich_int_2c5dc1: "说实话，埃里希王子对政权不太感兴趣。"
  npc_override_prt_castle_quests_morocc_game_draw_092ca0: "这局平局。"
  npc_override_prt_castle_quests_morocc_get_away_me_as_soon_3023eb: "离我远点，越快越好。"
  npc_override_prt_castle_quests_morocc_get_out_my_way_2d8b4c: "滚开。"
  npc_override_prt_castle_quests_morocc_ghh_brother_0c2ad6: "呃？！兄弟？！"
  npc_override_prt_castle_quests_morocc_good_s_natural_me_disclo_c48f11: "很好，对一个喜欢摊牌的高直觉之人说出真话，对我来说很自然。"
  npc_override_prt_castle_quests_morocc_goodbye_my_brother_king_b17a5e: "再见了，我的兄弟……成为国王，改变这个国家吧。你……你能做到的……咳……"
  npc_override_prt_castle_quests_morocc_grading_someone_piece_ca_d37ab6: "给人评级不是件容易的事。这确实是项艰巨的工作。你为国家做这项艰苦的工作。"
  npc_override_prt_castle_quests_morocc_ha_you_done_6b5224: "哈。你说完了吗？"
  npc_override_prt_castle_quests_morocc_haah_haha_appraiser_i_de_ef5201: "哈哈……哈哈哈……鉴定师，我深表歉意冒犯了你。对不起，但没有可能履行这个承诺了。所以，别把这事当真……你知道的……等猪会飞的时候吧～"
  npc_override_prt_castle_quests_morocc_harmonic_sensibility_8f5f5c: "和和谐的感受力，"
  npc_override_prt_castle_quests_morocc_harmonious_23587a: "不会和谐"
  npc_override_prt_castle_quests_morocc_haven_t_you_seen_somethi_0fb01a: "你没见过什么神秘的事吗？或者听过什么流言？"
  npc_override_prt_castle_quests_morocc_he_always_says_results_c_c3beeb: "他总是说结果不是最重要的。"
  npc_override_prt_castle_quests_morocc_he_doesn_t_like_classy_2356bf: "他也不喜欢华丽的服装。他甚至没带礼服来。而且一到这儿，他就埋头做锁和钥匙，就像那样。"
  npc_override_prt_castle_quests_morocc_he_doesn_t_seem_suprised_eeea32: "（他似乎也不太惊讶……难道有什么原因？现在我起疑了……）"
  npc_override_prt_castle_quests_morocc_he_eccentric_isn_t_he_db0c5f: "他挺古怪的，不是吗？"
  npc_override_prt_castle_quests_morocc_he_experienced_appraiser_75d7f2: "他是经验丰富的鉴定师……"
  npc_override_prt_castle_quests_morocc_he_gave_up_without_any_1b4862: "他没挑战就放弃了。这不是男人该做的事。他不如我。不过好吧。我对他很失望。艾根·阿鲁姆。"
  npc_override_prt_castle_quests_morocc_he_insists_me_corrupted_e41b25: "但他坚持要我腐败，明知那会怎样……"
  npc_override_prt_castle_quests_morocc_he_jitters_whenever_i_re_a48b8d: "-每当我对他有反应时，他就会紧张。他的举动让我感到可怜。-"
  npc_override_prt_castle_quests_morocc_he_kind_jester_eb5627: "他有点像个小丑。"
  npc_override_prt_castle_quests_morocc_he_seems_polite_personal_c251b6: "（作为国王候选人，他似乎很有礼貌）"
  npc_override_prt_castle_quests_morocc_he_seems_so_obssessed_ca_b58330: "-他似乎太执着了，顾不上其他事。-"
  npc_override_prt_castle_quests_morocc_he_so_blushed_2e5302: "-他脸红了，"
  npc_override_prt_castle_quests_morocc_he_so_serious_about_ever_6d5a4f: "他对每件事都太认真了。他从不惹麻烦或发脾气……他可能有点怪。"
  npc_override_prt_castle_quests_morocc_he_soft_personality_thin_e823ab: "他性格温和，考虑事情太久，但我承认他有很多优点。我可以说他是一个相当高标准的候选人。"
  npc_override_prt_castle_quests_morocc_he_tries_deal_things_too_3c7a94: "他试图处理太棘手的事情，有时会把事情搞成问题。但即使在那些时候，他也愿意听我的话，所以我们似乎很少陷入真正的麻烦。"
  npc_override_prt_castle_quests_morocc_he_trustworthy_instructi_2250ec: "他是个值得信赖且有教益的人。"
  npc_override_prt_castle_quests_morocc_hear_rumor_about_3f99ba: "听到关于"
  npc_override_prt_castle_quests_morocc_hehe_ahrum_most_favorabl_4724d5: "嘿嘿，阿鲁姆已经是最受青睐和最有影响力的候选人了。如果你能完成这个任务，那就太了不起了。"
  npc_override_prt_castle_quests_morocc_hehe_you_must_friend_pet_08547d: "嘿嘿～你一定是彼得的朋友吧。"
  npc_override_prt_castle_quests_morocc_hello_65611e: "你好，"
  npc_override_prt_castle_quests_morocc_hello_appraiser_1c3586: "你好，鉴定师。"
  npc_override_prt_castle_quests_morocc_hello_ec6b08: "你好？"
  npc_override_prt_castle_quests_morocc_helped_me_check_people_s_801040: "但它帮助我审视人们的生活，了解全部细节。这是我的优点。"
  npc_override_prt_castle_quests_morocc_here_b859c3: "在这里。"
  npc_override_prt_castle_quests_morocc_hey_calbern_53eb1e: "嘿，卡尔伯恩！"
  npc_override_prt_castle_quests_morocc_hey_hey_calbern_097844: "嘿！嘿，卡尔伯恩！"
  npc_override_prt_castle_quests_morocc_hey_s_cool_huh_570442: "嘿，挺酷的，嗯？"
  npc_override_prt_castle_quests_morocc_hey_things_you_experienc_8ec058: "嘿，你在这里经历的事情不能透露给别人。你明白这是完全保密的吧。"
  npc_override_prt_castle_quests_morocc_hey_what_did_you_just_83f979: "嘿！你刚才对我说什么？阿鲁姆？！"
  npc_override_prt_castle_quests_morocc_hey_you_you_heard_story_b20187: "嘿，你听过长腿爸爸的故事吗？…………"
  npc_override_prt_castle_quests_morocc_hi_94dd9e: "嗨"
  npc_override_prt_castle_quests_morocc_hi_how_you_873e88: "嗨，你好吗？"
  npc_override_prt_castle_quests_morocc_higher_lower_9d4996: "从更高和更低。"
  npc_override_prt_castle_quests_morocc_hm_i_agree_your_words_1d12a5: "嗯！我同意你的话，世界是肮脏的，但你不能把我拉到那个水平！我不能原谅你的话！永远，绝不！"
  npc_override_prt_castle_quests_morocc_hmm_9c4d28: "嗯……"
  npc_override_prt_castle_quests_morocc_hmm_e777ce: "嗯？"
  npc_override_prt_castle_quests_morocc_hmm_enough_b9e9e4: "嗯……够了吗？"
  npc_override_prt_castle_quests_morocc_hmm_he_cannot_even_hear_115c31: "……嗯，他甚至听不到……"
  npc_override_prt_castle_quests_morocc_hmm_higher_d37638: "嗯……更高？……"
  npc_override_prt_castle_quests_morocc_hmm_hmm_ca463a: "嗯嗯。"
  npc_override_prt_castle_quests_morocc_hmm_i_don_t_any_fa3473: "嗯……我没什么好说的了。而且，阿鲁姆最近好像很奇怪。我很担心。希望不是什么大事。"
  npc_override_prt_castle_quests_morocc_hmm_i_too_talkative_eeb888: "嗯，我说得太多了。"
  npc_override_prt_castle_quests_morocc_hmm_so_what_you_ve_d1366a: "嗯……是这样吗？你说的对我帮助很大。感谢你的辛劳。"
  npc_override_prt_castle_quests_morocc_hmmm_2ac89c: "嗯嗯……"
  npc_override_prt_castle_quests_morocc_hmmm_they_smell_really_g_d66879: "嗯嗯～它们闻起来真香。"
  npc_override_prt_castle_quests_morocc_hmph_some_thing_nothing_c0cbec: "哼……那些事。没什么。毫无意义。现实，仅此而已。很高兴和你聊天。再见，以后就像你以前那样活下去吧。"
  npc_override_prt_castle_quests_morocc_ho_hold_look_ahrum_e6b498: "等——等等！看，阿鲁姆！"
  npc_override_prt_castle_quests_morocc_hold_coward_you_fleeing_35a0b0: "等等，懦夫！你现在要逃吗？！真是个懦夫！让我们打完！"
  npc_override_prt_castle_quests_morocc_hold_eigen_ahrum_hey_4c108c: "等等！艾根·阿鲁姆！嘿！"
  npc_override_prt_castle_quests_morocc_how_absurd_you_ask_i_6ec904: "你问得真荒谬！！我已经清楚地告诉过你特里斯坦国王是病死的，不是吗？"
  npc_override_prt_castle_quests_morocc_how_could_you_appear_so_e5a065: "你怎么能这么突然出现？恩和我正在谈话呢。"
  npc_override_prt_castle_quests_morocc_how_dare_you_talk_him_986cd0: "你怎么敢跟他说话。"
  npc_override_prt_castle_quests_morocc_how_ernst_377487: "恩斯特怎么样了……？"
  npc_override_prt_castle_quests_morocc_how_goes_i_don_t_ec5c55: "进展如何？我觉得见七个候选人并评估他们不容易吧。"
  npc_override_prt_castle_quests_morocc_how_going_40433e: "进展如何？"
  npc_override_prt_castle_quests_morocc_how_i_deal_stress_damn_a151be: "我怎么应对这种压力？该死！见鬼！"
  npc_override_prt_castle_quests_morocc_how_you_doing_sir_602700: "你好吗，先生？"
  npc_override_prt_castle_quests_morocc_how_you_give_encourageme_577fdd: "你通常怎么鼓励别人？"
  npc_override_prt_castle_quests_morocc_huh_f77dfa: "嗯……～"
  npc_override_prt_castle_quests_morocc_huhu_all_i_just_wanted_809f4a: "呼呼……完全不是。我只是想杀了你……仅此而已……干得好，恩……这是合法的自卫，杀死一个恶棍……对吧？"
  npc_override_prt_castle_quests_morocc_huhu_all_i_just_wanted_bab2fb: "呼呼……完全不是。我只是想杀了你……仅此而已……干得好，恩……这是合法的自卫，杀死一个恶棍……对吧？"
  npc_override_prt_castle_quests_morocc_huhu_you_don_t_need_f12faa: "呼呼……你不必知道。话说回来，你遵守了承诺……你应该成为国王……但如果你迷失了方向，偏离正轨，我会随时来杀了你……从地狱来！！"
  npc_override_prt_castle_quests_morocc_huuuuuuu_44e843: "呜～～～～～～"
  npc_override_prt_castle_quests_morocc_i_also_love_talk_ahrum_01883a: "我也喜欢和阿鲁姆聊天。阿鲁姆足够聪明，能产生我可以跟上的新想法。"
  npc_override_prt_castle_quests_morocc_i_am_as_i_usually_b13322: "我还是老样子，恩斯特。只是，现实很肮脏，我意识到自己被困在了这堆垃圾里。我出不去了。"
  npc_override_prt_castle_quests_morocc_i_am_eigen_ahrum_f6fa16: "我是艾根·阿鲁姆，"
  npc_override_prt_castle_quests_morocc_i_am_ernst_prince_geobor_d5cabf: "我是恩斯特，盖博尔格的王子。"
  npc_override_prt_castle_quests_morocc_i_am_glad_girl_liked_12552a: "我很高兴那女孩喜欢它。一旦我的病好了，我想去见她。"
  npc_override_prt_castle_quests_morocc_i_am_helmut_roewenburg_708e14: "我是来自罗温堡的赫尔穆特。"
  npc_override_prt_castle_quests_morocc_i_am_just_fed_up_b4ebda: "我受够你了。像你这样的混蛋也能成为国王候选人？我对这王位继承感到恶心和作呕。"
  npc_override_prt_castle_quests_morocc_i_am_messenger_royal_cou_02eada: "我是王室派来的信使，来寻找可靠的冒险者。这关系到我们国家的非常重要的事。"
  npc_override_prt_castle_quests_morocc_i_am_messenger_rune_midg_295536: "我是卢恩-米德加尔特的信使。"
  npc_override_prt_castle_quests_morocc_i_am_mission_now_i_e54bf7: "我现在有任务在身。我想你可能在找别的地方。问别人吧。"
  npc_override_prt_castle_quests_morocc_i_am_peter_family_heine_6e03a9: "我是彼得，来自海涅家族。很高兴见到你。"
  npc_override_prt_castle_quests_morocc_i_am_prince_if_you_ecc680: "我是王子；如果你发牢骚，你就来当王子！我觉得这种问题很烦人。"
  npc_override_prt_castle_quests_morocc_i_am_prince_richard_fami_01b9ee: "我是理查德家族的王子。记住我，做我的支持者吧……"
