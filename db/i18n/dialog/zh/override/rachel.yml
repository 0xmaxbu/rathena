Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_rachel_enchan_edda_half_moon_amazing_ccfd41: "太神奇了。"
  npc_override_rachel_enchan_edda_half_moon_any_more_than_priest_s_f784a4: "再多一点，祭司项链就承受不住了，所以我收集的所有物品都被摧毁了。我还在研究，所以我相信总有一天会成功的。"
  npc_override_rachel_enchan_edda_half_moon_anyone_else_world_create_1642bb: "世界上还有谁能创造出一种可以进入他人梦境并生动体验的设备？呀-毕竟是女神心爱的羔羊。"
  npc_override_rachel_enchan_edda_half_moon_anyway_when_i_first_hear_136ad0: "不管怎样，当我第一次从我们的阿姨，大祭司尼伦那里听到请求时，我很惊讶。"
  npc_override_rachel_enchan_edda_half_moon_as_i_walking_through_pop_7e1b78: "当我走在教皇的梦境中时，我意外地从祭司那里发现了一条^0000cd祭司项链^000000，并从那里无面的神殿中发现了一个特殊的能量^0000cd碎片^000000。"
  npc_override_rachel_enchan_edda_half_moon_class_42794b: "A级"
  npc_override_rachel_enchan_edda_half_moon_continuously_researching_5ad151: "通过不断的研究和研究，我成功地将那种力量分成了三个等级。"
  npc_override_rachel_enchan_edda_half_moon_even_if_you_nothing_say_28e0c5: "即使你没什么要说的，也要听我说！！！"
  npc_override_rachel_enchan_edda_half_moon_great_decision_you_want_dcda73: "好决定！你想戴在^0000cd左^000000边？还是^0000cd右^000000边？我两边都有信心！……"
  npc_override_rachel_enchan_edda_half_moon_i_able_bring_out_things_8cff2a: "我能够从别人的梦境中取出东西。这是件大事！让我们开始谈正事吧，因为你似乎不太能感同身受。"
  npc_override_rachel_enchan_edda_half_moon_i_began_study_necklace_s_8a5a0f: "我开始研究项链和神殿的奇怪碎片。那个奇怪的碎片被命名为^0000cd梦境碎片^000000，意思是在梦中获得的碎片。呀-命名品味！"
  npc_override_rachel_enchan_edda_half_moon_i_cried_endlessly_becaus_2cad5c: "我为那个事实感到无尽的悲伤。但如果女神让我们在梦中听到她的声音，我们不也能通过梦境到达女神吗？"
  npc_override_rachel_enchan_edda_half_moon_i_d_like_talk_you_5b2270: "我想和你谈谈，请听我说。"
  npc_override_rachel_enchan_edda_half_moon_i_discovered_collecting_952747: "我发现，通过收集大约^0000cd100个梦境碎片^000000，用力量压缩它们，并放入^0000cd祭司项链^000000中，我可以赋予它^0000cd特殊力量^000000。"
  npc_override_rachel_enchan_edda_half_moon_i_gave_these_powers_name_d21c25: "我给这些力量取名为^0000cd正义女神、慈悲女神、洞察女神^000000。这不可信吗？"
  npc_override_rachel_enchan_edda_half_moon_i_heard_voice_goddess_fr_ec95db: "我在满月之光中听到了^0000cd芙蕾雅女神的声音^000000。"
  npc_override_rachel_enchan_edda_half_moon_i_ll_good_job_leave_10d805: "我会好好做的。交给我吧。"
  npc_override_rachel_enchan_edda_half_moon_i_m_pope_s_closest_52266d: "我不是教皇最亲密的知己，所以对她来说我一定只是个陌生人。"
  npc_override_rachel_enchan_edda_half_moon_i_started_study_dreams_a_f58134: "我开始用全部热情研究梦境。我认为这是女神的旨意，她试图通过梦境传达给我。"
  npc_override_rachel_enchan_edda_half_moon_i_t_reach_goddess_yet_d74b1a: "我还无法到达女神……但没有多少人在梦中遇到女神……像我一样……"
  npc_override_rachel_enchan_edda_half_moon_i_ve_always_been_fan_962015: "我一直是^0000cd女神^000000的粉丝。当我进入神殿开始虔诚追随者的生活时，我的生命开始绽放。"
  npc_override_rachel_enchan_edda_half_moon_i_went_around_trying_fin_d64a89: "我四处寻找，试图在梦中尽可能多地发现，但当教皇找到我时，她出于恐惧激烈地拒绝了我。"
  npc_override_rachel_enchan_edda_half_moon_if_you_bring_enchanted_p_557f08: "如果你带来一条已附魔的^0000ff带有女神力量的祭司项链^000000和^0000ff1000个梦境碎片^000000，你会获得更强大的力量。"
  npc_override_rachel_enchan_edda_half_moon_if_you_bring_me_priest_e71700: "如果你带给我^0000cd1条祭司项链和在梦中获得的100个梦境碎片^000000，你的^0000cd祭司项链将被赋予女神之力^000000。"
  npc_override_rachel_enchan_edda_half_moon_if_you_i_grant_you_c41fe0: "如果你有1个^0000cd{0}^000000和1个^0000cd{1}^000000，我将赋予你女神之力。"
  npc_override_rachel_enchan_edda_half_moon_if_you_re_busy_right_3a3590: "如果你现在不忙，想和我一起吃饭吗？"
  npc_override_rachel_enchan_edda_half_moon_left_8ae1c3: "左边"
  npc_override_rachel_enchan_edda_half_moon_msg_0b0c6f: "{0}"
  npc_override_rachel_enchan_edda_half_moon_msg_61ce5a: "[{0}]"
  npc_override_rachel_enchan_edda_half_moon_my_genius_22b471: "我的^0000cd天才^000000。"
  npc_override_rachel_enchan_edda_half_moon_necklace_been_enchanted_a351d1: "项链已按照你的要求附魔。"
  npc_override_rachel_enchan_edda_half_moon_necklace_enchanted_d9d440: "项链将被赋予{0}"
  npc_override_rachel_enchan_edda_half_moon_necklace_yours_already_e_05d6b0: "你的这条项链已经有附魔了。"
  npc_override_rachel_enchan_edda_half_moon_no_b8b9f1: "不。"
  npc_override_rachel_enchan_edda_half_moon_no_i_need_time_consider_6804ef: "不，我需要时间考虑。"
  npc_override_rachel_enchan_edda_half_moon_nothing_did_you_forget_w_09d80e: "没什么？你忘了要说什么吗？"
  npc_override_rachel_enchan_edda_half_moon_oh_goddess_please_pity_b_fc41a9: "哦女神，请怜悯这个冒险者迟钝的感性，他竟然用'太神奇了'这一个词来表达这些巨大的成果-"
  npc_override_rachel_enchan_edda_half_moon_oh_my_what_should_i_ebf538: "天哪，我该拿这个人怎么办？不过，我是女神善良的羔羊，所以我简短地告诉你。"
  npc_override_rachel_enchan_edda_half_moon_oh_no_s_enough_s_7e8b35: "哦不，够了。没关系。"
  npc_override_rachel_enchan_edda_half_moon_oh_s_shame_i_going_e067a2: "哦，真可惜。我本来这次要讲得更详细的。"
  npc_override_rachel_enchan_edda_half_moon_oh_thank_you_9bcfd6: "哦，谢谢你。"
  npc_override_rachel_enchan_edda_half_moon_oh_why_i_m_being_6fdb57: "哦，为什么！！！我对你这么好！！！"
  npc_override_rachel_enchan_edda_half_moon_one_day_before_i_went_bf2f28: "有一天，在我入睡之前，我在向女神祈祷时做了一个^0000cd梦^000000。"
  npc_override_rachel_enchan_edda_half_moon_persuasion_surprisingly_9f8de6: "而且说服力出奇地令人信服。"
  npc_override_rachel_enchan_edda_half_moon_please_select_class_4d6c31: "请选择职业"
  npc_override_rachel_enchan_edda_half_moon_power_goddess_i_love_god_5f949d: "女神之力！！！我爱女神！女神，你太棒了！！！"
  npc_override_rachel_enchan_edda_half_moon_power_help_wearer_s_phys_930b99: "这种力量可以帮助佩戴者的^0000cd物理^000000、^0000cd魔法^000000或^0000cd远程^000000攻击。没有任何副作用！"
  npc_override_rachel_enchan_edda_half_moon_reduce_your_weight_pleas_17717c: "请减轻你的重量。"
  npc_override_rachel_enchan_edda_half_moon_s_e93f4c: "就是这样！"
  npc_override_rachel_enchan_edda_half_moon_so_give_me_three_line_d64e65: "那么，给我一个三行总结。"
  npc_override_rachel_enchan_edda_half_moon_so_i_thrown_out_pope_1086a5: "所以我被扔出了教皇的梦境。"
  npc_override_rachel_enchan_edda_half_moon_so_what_s_power_goddess_bb6262: "那么女神之力是什么？"
  npc_override_rachel_enchan_edda_half_moon_then_i_entered_pope_s_a32683: "从那时起，我进入了教皇的梦境，开始一个一个地收集它们，不被教皇发现。"
  npc_override_rachel_enchan_edda_half_moon_there_s_story_needs_told_008ca4: "有一个故事需要先讲。"
  npc_override_rachel_enchan_edda_half_moon_they_seemed_normal_when_72bf5d: "它们分开时看起来很正常，但当我把它们叠在一起时，我感觉到一种微妙的能量。"
  npc_override_rachel_enchan_edda_half_moon_uh_wait_s_you_check_577c43: "呃，等等！那不是^0000cd{0}^000000吧？你能再检查一次吗？"
  npc_override_rachel_enchan_edda_half_moon_unfortunately_as_soon_as_018811: "但不幸的是，我一醒来就忘记了所有的梦。梦就是这样。"
  npc_override_rachel_enchan_edda_half_moon_way_when_i_woke_up_5388c0: "顺便说一下。当我从梦中醒来时，我手中仍然有来自神殿的祭司项链和奇怪的碎片。你怎么看？"
  npc_override_rachel_enchan_edda_half_moon_well_i_m_busy_so_abd4d8: "嗯，我很忙所以……"
  npc_override_rachel_enchan_edda_half_moon_what_goddess_power_7dedc5: "女神之力是什么？"
  npc_override_rachel_enchan_edda_half_moon_what_power_goddess_did_y_c403d5: "女神之力是什么？你刚才问了女神之力？"
  npc_override_rachel_enchan_edda_half_moon_what_s_even_more_surpris_035726: "但更令人惊讶的是，如果你放入更多的^0000cd梦境碎片^000000，大约^0000cd1000个^000000左右，你可以赋予更^0000cd强大的力量^000000。"
  npc_override_rachel_enchan_edda_half_moon_what_special_abilities_y_69ad84: "你想给你的项链附魔什么特殊能力？"
  npc_override_rachel_enchan_edda_half_moon_when_i_first_entered_pop_ab3a58: "当我第一次进入教皇的梦境时，我很惊讶。"
  npc_override_rachel_enchan_edda_half_moon_while_i_working_hard_my_986bde: "当我努力研究时，我应我们阿姨，大祭司尼伦——就在我旁边——的请求制作了^0000cd梦境通道^000000。这是我毕生奉献的成果。"
  npc_override_rachel_enchan_edda_half_moon_why_d77989: "为什么？"
  npc_override_rachel_enchan_edda_half_moon_why_don_t_you_take_2c9d78: "你为什么不花点时间和我聊聊梦境、科学和女神呢？"
  npc_override_rachel_enchan_edda_half_moon_you_aren_t_wearing_9fe6ed: "你没有装备{0}……！"
  npc_override_rachel_enchan_edda_half_moon_you_dare_enter_pope_s_e3b1a5: "你敢进入教皇的梦境……？大祭司尼伦说服我进入她的梦境，但我无能为力帮助她。"
  npc_override_rachel_enchan_edda_half_moon_you_didn_t_bring_enough_438060: "你带来的{0}不够！"
  npc_override_rachel_enchan_edda_half_moon_you_like_hear_one_more_023773: "你想再听一遍吗？"
  npc_override_rachel_enchan_edda_half_moon_you_need_your_necklace_e_502323: "你需要先让你的项链附魔{0}。"
  npc_override_rachel_enchan_edda_half_moon_you_really_sure_proceed_3a0cc7: "你真的确定要进行这个附魔过程吗？"
  npc_override_rachel_enchan_edda_half_moon_you_selected_enchantment_e86196: "你选择了{0}附魔。"
  npc_override_rachel_enchan_edda_half_moon_your_already_enchant_84d8ea: "你的{0}已经有附魔了。"
  npc_override_rachel_guides_rachel_i_mark_location_ef3128: "我会标记位置"
  npc_override_rachel_guides_rachel_if_first_time_you_use_cca542: "如果这是你第一次使用向导服务，我建议你多问一些问题。"
  npc_override_rachel_guides_rachel_located_outside_east_gat_00552a: "{0}位于东门外。"
  npc_override_rachel_guides_rachel_menu_cool_813354: "[ 酷乐活动公司职员 ]:[ 伊甸园传送官 ]:上一页菜单"
  npc_override_rachel_guides_rachel_menu_inn_67bf2e: "[ 旅馆 ]:[ 武器店 ]:[ 道具店 ]:[ 机场 ]:[ 切斯鲁姆尼尔 ]:[ 祭司泽德的宅邸 ]:上一页菜单"
  npc_override_rachel_guides_rachel_menu_main_c682f5: "[ 主要设施 ]:[ 商人 & 助手 ]:移除小地图标记:取消"
  npc_override_rachel_guides_rachel_of_the_4c4b9f: "的{0}"
  npc_override_rachel_guides_rachel_rachel_s_sells_best_qual_846ff4: "拉赫的{0}出售最高品质的药水。它位于西门附近。"
  npc_override_rachel_guides_rachel_safe_journey_cd781d: "一路平安！"
  npc_override_rachel_guides_rachel_sure_i_ll_remove_all_b37a09: "当然，我会移除你小地图上的所有标记。"
  npc_override_rachel_guides_rachel_take_road_north_find_bui_6bfacf: "沿着北边的路走就能找到那座建筑。"
  npc_override_rachel_guides_rachel_there_anything_else_i_yo_8fdf01: "还有什么我能帮你的吗？"
  npc_override_rachel_guides_rachel_welcome_capital_arunafel_2f4220: "欢迎来到阿鲁纳菲尔兹的首都，^8B4513拉赫^000000，芙蕾雅女神温暖的气息到达的地方。"
  npc_override_rachel_guides_rachel_you_like_check_any_other_342821: "你想查看其他位置吗？"
  npc_override_rachel_guides_rachel_you_rest_your_fatigue_jo_0a7d79: "你可以在{0}休息旅途的疲劳。我左边的建筑就是拉赫的旅馆。"
  npc_override_rachel_guides_rachel_you_want_check_out_weapo_05d78d: "你想看看拉赫出售的武器吗？{0}位于西门附近。"
  npc_override_rachel_guides_rachel_your_mini_map_3d388a: "在你的小地图上。"
  npc_override_rachel_guides_rachel_your_mini_map_c80911: "在你的小地图上。"
  npc_override_rachel_juno_monster_society_accept_bb54db: "接受"
  npc_override_rachel_juno_monster_society_according_recent_investi_3d3061: "根据最近的调查，发现一些地区的怪物变得过于凶猛或数量增加。"
  npc_override_rachel_juno_monster_society_adventurer_s_dangerous_h_0fe236: "冒险者，这里很危险。"
  npc_override_rachel_juno_monster_society_after_all_you_came_finis_880e62: "毕竟，你是来快速完成的！！"
  npc_override_rachel_juno_monster_society_after_catching_monsters_5a957d: "在龟岛地牢捕捉80只怪物后，来向我报告。我会等你。"
  npc_override_rachel_juno_monster_society_after_catching_monsters_ef0b25: "在龟岛地牢捕捉80只怪物后，来向我报告。那么祝你好运。"
  npc_override_rachel_juno_monster_society_after_subjugating_please_cf63a5: "讨伐后，请回到我身边~"
  npc_override_rachel_juno_monster_society_after_subjugation_come_m_fee417: "讨伐后，来找我领取奖励！！"
  npc_override_rachel_juno_monster_society_after_subjugation_please_3ebb6d: "讨伐后，请不要忘记告诉我。"
  npc_override_rachel_juno_monster_society_ah_adventurer_0de54d: "啊！冒险者！"
  npc_override_rachel_juno_monster_society_ah_adventurer_i_m_reques_c6abdc: "啊，冒险者！我正在请求怪物讨伐调查，怎么样？"
  npc_override_rachel_juno_monster_society_ah_adventurer_i_m_taking_84421e: "啊，冒险者。我今天正在接怪物讨伐调查请求，怎么样？"
  npc_override_rachel_juno_monster_society_ah_adventurer_i_saw_your_bb1d9a: "啊，冒险者！我充分看到了你的表现。谢谢你的辛勤工作。"
  npc_override_rachel_juno_monster_society_ah_fresh_cool_fba324: "啊！清新凉爽的{0}！"
  npc_override_rachel_juno_monster_society_ah_i_subjugation_quest_a_eef791: "啊！我可以再做讨伐任务了。是时候工作了吗？"
  npc_override_rachel_juno_monster_society_ah_i_want_go_home_b54c84: "啊……我突然想回家了。我妈妈离开家时说她很辛苦，但确实如此。"
  npc_override_rachel_juno_monster_society_ah_please_help_us_e82f2d: "啊……请帮帮我们……"
  npc_override_rachel_juno_monster_society_ah_popular_these_days_i_23f04f: "啊！这个{0}最近很流行吗？我会好好喝的。"
  npc_override_rachel_juno_monster_society_ah_s_cool_83d4d1: "啊，真酷~！"
  npc_override_rachel_juno_monster_society_ah_s_enough_today_s_2d3dd0: "啊，今天的讨伐够了！"
  npc_override_rachel_juno_monster_society_ah_s_refreshing_cool_rea_917b41: "啊，真清爽，凉爽，真的很好。"
  npc_override_rachel_juno_monster_society_ah_she_she_says_again_d2e16a: "啊！她……她又说了一遍。哎呀，你在说什么？"
  npc_override_rachel_juno_monster_society_ah_thank_you_so_much_e4b2bb: "啊~！！太谢谢你了~我当时很渴~"
  npc_override_rachel_juno_monster_society_ah_then_what_i_540436: "啊……那我能做什么？"
  npc_override_rachel_juno_monster_society_ah_way_even_if_you_483769: "啊！顺便说一下，即使你捕捉了塔拉蛙，也不算数。如果你什么都不碰，它是温和的怪物，所以你可以避开它。"
  npc_override_rachel_juno_monster_society_ah_where_you_going_99d4d4: "啊，你要去哪里？"
  npc_override_rachel_juno_monster_society_ah_you_help_us_611f74: "啊……你能帮帮我们吗？"
  npc_override_rachel_juno_monster_society_ah_you_re_disturbing_me_c264df: "啊？！你又这样打扰我。你还可以是客人，所以请友善一点。"
  npc_override_rachel_juno_monster_society_ah_you_see_you_re_563ec9: "啊！你看到了吗？你总是很累的那种人。也许是因为你放下了一切，接受了你的疲惫？我在说什么？"
  npc_override_rachel_juno_monster_society_ahaha_bottle_well_receiv_30da10: "啊哈哈，一瓶{0}，收到了！"
  npc_override_rachel_juno_monster_society_ahhh_really_they_so_dist_526a84: "啊啊？！真的！！它们太打扰了。你看到站在那边的以斯帖了吗？你应该能说话，但我和你说话时，你不回答？"
  npc_override_rachel_juno_monster_society_alberta_express_departin_204359: "艾尔贝塔特快出发了。辛苦了~"
