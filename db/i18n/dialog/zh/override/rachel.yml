Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_rachel_enchan_edda_half_moon_amazing_ccfd41: "Amazing."
  npc_override_rachel_enchan_edda_half_moon_any_more_than_priest_s_f784a4: "Any more than that, the Priest's Necklace couldn't hold up to, so all the items I've gathered were destroyed. I'm still working on it, so I'm sure I'll succeed someday."
  npc_override_rachel_enchan_edda_half_moon_anyone_else_world_create_1642bb: "Can anyone else in the world create a device that allows them to enter other people's dreams and experience them vividly? Kya- After all, Goddess' beloved lamb."
  npc_override_rachel_enchan_edda_half_moon_anyway_when_i_first_hear_136ad0: "Anyway, when I first heard the request from our aunt, High Priestess Niren, I was surprised."
  npc_override_rachel_enchan_edda_half_moon_as_i_walking_through_pop_7e1b78: "As I was walking through the Pope's dream, I accidentally found a ^0000cdPriest's Necklace^000000 from the priest and a special energetic ^0000cdFragment^000000 from the faceless shrine there."
  npc_override_rachel_enchan_edda_half_moon_class_42794b: "A Class"
  npc_override_rachel_enchan_edda_half_moon_continuously_researching_5ad151: "And by continuously researching and researching, I've succeeded in separating that power into three degrees."
  npc_override_rachel_enchan_edda_half_moon_even_if_you_nothing_say_28e0c5: "Even if you have nothing to say, just listen to me!!!"
  npc_override_rachel_enchan_edda_half_moon_great_decision_you_want_dcda73: "Great decision! Do you want it on your ^0000cdleft^000000? Or the ^0000cdright^000000 side? I'm confident either way!..."
  npc_override_rachel_enchan_edda_half_moon_i_able_bring_out_things_8cff2a: "I was able to bring out the things I got from other people's dreams. This is a big deal! Let's get down to business because you don't seem to empathize."
  npc_override_rachel_enchan_edda_half_moon_i_began_study_necklace_s_8a5a0f: "I began to study the necklace and the strange fragment of the shrine. The strange fragment was named the ^0000cdDream Fragment^000000, meaning the fragment obtained in a dream. Kyah- Name Sense!"
  npc_override_rachel_enchan_edda_half_moon_i_cried_endlessly_becaus_2cad5c: "I cried endlessly because I felt sorry for that fact. But if the Goddess lets me hear her voice through a dream, wouldn't we too, be able to reach the Goddess through dreaming?"
  npc_override_rachel_enchan_edda_half_moon_i_d_like_talk_you_5b2270: "I'd like to talk to you, please listen."
  npc_override_rachel_enchan_edda_half_moon_i_discovered_collecting_952747: "I discovered that by collecting about ^0000cd100 Dream Fragments^000000, compressing them with force, and putting them into the ^0000cdPriest's Necklace^000000, I can grant it ^0000cdspecial powers^000000."
  npc_override_rachel_enchan_edda_half_moon_i_gave_these_powers_name_d21c25: "I gave these powers the names of ^0000cdGoddess of Justice, Goddess of Mercy, Goddess of Insight^000000, respectively. Isn't that plausible?"
  npc_override_rachel_enchan_edda_half_moon_i_heard_voice_goddess_fr_ec95db: "I heard the ^0000cdvoice^000000 of Goddess Freya in the full light."
  npc_override_rachel_enchan_edda_half_moon_i_ll_good_job_leave_10d805: "I'll do a good job. Leave it to me."
  npc_override_rachel_enchan_edda_half_moon_i_m_pope_s_closest_52266d: "I'm not the Pope's closest confidant, so I must have been just a stranger to her."
  npc_override_rachel_enchan_edda_half_moon_i_started_study_dreams_a_f58134: "I started to study dreams with all my passion. I thought this was the will of the Goddess, who's trying to convey to me through them."
  npc_override_rachel_enchan_edda_half_moon_i_t_reach_goddess_yet_d74b1a: "I can't reach the Goddess yet... But there aren't many people who encounter the Goddess in their dreams... Like me..."
  npc_override_rachel_enchan_edda_half_moon_i_ve_always_been_fan_962015: "I've always been a fan of the ^0000cdGoddess^000000. As I entered the temple and started my life as a devoted follower, my life began to blossom."
  npc_override_rachel_enchan_edda_half_moon_i_went_around_trying_fin_d64a89: "And I went around trying to find out as much as I could in my dreams, but when the Pope found me, she rejected me fiercely in fear."
  npc_override_rachel_enchan_edda_half_moon_if_you_bring_enchanted_p_557f08: "And if you bring an enchanted ^0000ffPriest's Necklace with Goddess Power^000000 and ^0000ff1000 pieces of Dream Fragments^000000, you'll get even more power."
  npc_override_rachel_enchan_edda_half_moon_if_you_bring_me_priest_e71700: "If you bring me ^0000cd1 Priest's Necklace and 100 Dream Fragments^000000 obtained in a dream, your ^0000cdPriest's Necklace will be enchanted with the Power of the Goddess^000000."
  npc_override_rachel_enchan_edda_half_moon_if_you_i_grant_you_c41fe0: "If you have 1 ^0000cd{0}^000000 and a ^0000cd{1}^000000, I will grant you the power of the Goddess."
  npc_override_rachel_enchan_edda_half_moon_if_you_re_busy_right_3a3590: "If you're not busy right now, would you like to eat with me?"
  npc_override_rachel_enchan_edda_half_moon_left_8ae1c3: "Left"
  npc_override_rachel_enchan_edda_half_moon_msg_0b0c6f: "{0}"
  npc_override_rachel_enchan_edda_half_moon_msg_61ce5a: "[{0}]"
  npc_override_rachel_enchan_edda_half_moon_my_genius_22b471: "Of my ^0000cdgenius^000000."
  npc_override_rachel_enchan_edda_half_moon_necklace_been_enchanted_a351d1: "The necklace has been enchanted according to your specifications."
  npc_override_rachel_enchan_edda_half_moon_necklace_enchanted_d9d440: "The necklace will be enchanted with the {0}"
  npc_override_rachel_enchan_edda_half_moon_necklace_yours_already_e_05d6b0: "This necklace of yours already has an enchantment."
  npc_override_rachel_enchan_edda_half_moon_no_b8b9f1: "No."
  npc_override_rachel_enchan_edda_half_moon_no_i_need_time_consider_6804ef: "No, I need time to consider."
  npc_override_rachel_enchan_edda_half_moon_nothing_did_you_forget_w_09d80e: "Nothing? Did you forget what to say?"
  npc_override_rachel_enchan_edda_half_moon_oh_goddess_please_pity_b_fc41a9: "Oh Goddess, please pity the blunt sensibility of an adventurer who can express these tremendous results in a word that is just amazing-"
  npc_override_rachel_enchan_edda_half_moon_oh_my_what_should_i_ebf538: "Oh my, what should I do with this person? Still, I'm a kind Lamb of the Goddess, so I'll tell you briefly."
  npc_override_rachel_enchan_edda_half_moon_oh_no_s_enough_s_7e8b35: "Oh no, that's enough. That's all right."
  npc_override_rachel_enchan_edda_half_moon_oh_s_shame_i_going_e067a2: "Oh, that's a shame. I was going to go into more detail this time."
  npc_override_rachel_enchan_edda_half_moon_oh_thank_you_9bcfd6: "Oh, thank you."
  npc_override_rachel_enchan_edda_half_moon_oh_why_i_m_being_6fdb57: "Oh, why!!! I'm being nice to you!!!"
  npc_override_rachel_enchan_edda_half_moon_one_day_before_i_went_bf2f28: "One day before I went to sleep, I had a ^0000cddream^000000 while I way praying to the Goddess."
  npc_override_rachel_enchan_edda_half_moon_persuasion_surprisingly_9f8de6: "And the persuasion was surprisingly convincing."
  npc_override_rachel_enchan_edda_half_moon_please_select_class_4d6c31: "Please select the class"
  npc_override_rachel_enchan_edda_half_moon_power_goddess_i_love_god_5f949d: "Power of the Goddess!!! I love the Goddess! Goddess, you're awesome!!!"
  npc_override_rachel_enchan_edda_half_moon_power_help_wearer_s_phys_930b99: "This power can help the wearer's ^0000cdphysical^000000, ^0000cdmagical^000000, or ^0000cdranged^000000 attacks. Without any side effects!"
  npc_override_rachel_enchan_edda_half_moon_reduce_your_weight_pleas_17717c: "Reduce your weight please."
  npc_override_rachel_enchan_edda_half_moon_s_e93f4c: "That's it!"
  npc_override_rachel_enchan_edda_half_moon_so_give_me_three_line_d64e65: "So, give me a three-line summary."
  npc_override_rachel_enchan_edda_half_moon_so_i_thrown_out_pope_1086a5: "So I was thrown out of the Pope's dream."
  npc_override_rachel_enchan_edda_half_moon_so_what_s_power_goddess_bb6262: "So what's the Power of the Goddess?"
  npc_override_rachel_enchan_edda_half_moon_then_i_entered_pope_s_a32683: "From then on, I entered the Pope's dream and began to study by collecting them one by one, without being noticed by the Pope."
  npc_override_rachel_enchan_edda_half_moon_there_s_story_needs_told_008ca4: "There's a story that needs to be told first."
  npc_override_rachel_enchan_edda_half_moon_they_seemed_normal_when_72bf5d: "They seemed normal when being separated, however I felt a subtle energy when I stacked them on top of each other."
  npc_override_rachel_enchan_edda_half_moon_uh_wait_s_you_check_577c43: "Uh, wait! That's not the ^0000cd{0}^000000, is it? Can you check it again?"
  npc_override_rachel_enchan_edda_half_moon_unfortunately_as_soon_as_018811: "But unfortunately, as soon as I woke up, I forgot all about my dream. That's how dreams are."
  npc_override_rachel_enchan_edda_half_moon_way_when_i_woke_up_5388c0: "By the way. When I woke up from my dream, I had the Priest's Necklace from the shrine and the strange fragment still in my hands. What do you think?"
  npc_override_rachel_enchan_edda_half_moon_well_i_m_busy_so_abd4d8: "Well, I'm busy so..."
  npc_override_rachel_enchan_edda_half_moon_what_goddess_power_7dedc5: "What is a Goddess' power?"
  npc_override_rachel_enchan_edda_half_moon_what_power_goddess_did_y_c403d5: "What is the power of a Goddess? Did you just ask about the power of the Goddess?"
  npc_override_rachel_enchan_edda_half_moon_what_s_even_more_surpris_035726: "But what's even more surprising is that if you put a larger amount of ^0000cdDream Fragments^000000, that's about ^0000cd1000pcs^000000 or so, you can enchant an even more ^0000cdpowerful power^000000."
  npc_override_rachel_enchan_edda_half_moon_what_special_abilities_y_69ad84: "What special abilities would you like to enchant your necklace with?"
  npc_override_rachel_enchan_edda_half_moon_when_i_first_entered_pop_ab3a58: "When I first entered the Pope's dream, I was amazed."
  npc_override_rachel_enchan_edda_half_moon_while_i_working_hard_my_986bde: "While I was working hard on my research, I made the ^0000cdPassage of Dreams^000000 at the request of our aunt, High Priestess Niren, who's right next to me. It's the result of what I dedicated my life to."
  npc_override_rachel_enchan_edda_half_moon_why_d77989: "Why?"
  npc_override_rachel_enchan_edda_half_moon_why_don_t_you_take_2c9d78: "Why don't you take the time with me to talk about dreams, science, and the goddess?"
  npc_override_rachel_enchan_edda_half_moon_you_aren_t_wearing_9fe6ed: "You aren't wearing the {0}...!"
  npc_override_rachel_enchan_edda_half_moon_you_dare_enter_pope_s_e3b1a5: "Would you dare to enter the Pope's dream...? The High Priestess Niren convinced me to enter her dream, but there was nothing that I could do to help her."
  npc_override_rachel_enchan_edda_half_moon_you_didn_t_bring_enough_438060: "You didn't bring enough {0}!"
  npc_override_rachel_enchan_edda_half_moon_you_like_hear_one_more_023773: "Would you like to hear it one more time?"
  npc_override_rachel_enchan_edda_half_moon_you_need_your_necklace_e_502323: "You need to have your necklace enchanted with {0} first."
  npc_override_rachel_enchan_edda_half_moon_you_really_sure_proceed_3a0cc7: "Are you really sure to proceed with this enchantment process?"
  npc_override_rachel_enchan_edda_half_moon_you_selected_enchantment_e86196: "You have selected the {0} enchantment."
  npc_override_rachel_enchan_edda_half_moon_your_already_enchant_84d8ea: "Your {0} already has an enchant."
  npc_override_rachel_guides_rachel_i_mark_location_ef3128: "I will mark the location"
  npc_override_rachel_guides_rachel_if_first_time_you_use_cca542: "If this is the first time for you to use the guide services, I suggest you ask many questions."
  npc_override_rachel_guides_rachel_located_outside_east_gat_00552a: "The {0} is located outside of the east gate."
  npc_override_rachel_guides_rachel_menu_cool_813354: "[ Cool Event Corp. Staff ]:[ Eden Teleport Officer ]:Previous Menu"
  npc_override_rachel_guides_rachel_menu_inn_67bf2e: "[ Inn ]:[ Weapon Shop ]:[ Tool Shop ]:[ Airport ]:[ Cheshrumnir ]:[ Priest Zed's Mansion ]:Previous Menu"
  npc_override_rachel_guides_rachel_menu_main_c682f5: "[ Main Facilities ]:[ Merchants & Helpers ]:Remove Marks from Mini-Map:Cancel"
  npc_override_rachel_guides_rachel_of_the_4c4b9f: "of the {0}"
  npc_override_rachel_guides_rachel_rachel_s_sells_best_qual_846ff4: "Rachel's {0} sells the best quality potions. It's located near the west gate."
  npc_override_rachel_guides_rachel_safe_journey_cd781d: "Have a safe journey!"
  npc_override_rachel_guides_rachel_sure_i_ll_remove_all_b37a09: "Sure, I'll remove all marks from your mini-map."
  npc_override_rachel_guides_rachel_take_road_north_find_bui_6bfacf: "Take the road to the north to find the building."
  npc_override_rachel_guides_rachel_there_anything_else_i_yo_8fdf01: "Is there anything else I can do for you?"
  npc_override_rachel_guides_rachel_welcome_capital_arunafel_2f4220: "Welcome to the capital of Arunafeltz, ^8B4513Rachel^000000 where the warm breath of the goddess Freya reaches."
  npc_override_rachel_guides_rachel_you_like_check_any_other_342821: "Would you like to check any other locations?"
  npc_override_rachel_guides_rachel_you_rest_your_fatigue_jo_0a7d79: "You can rest your fatigue of the journey in the {0}. The left building next to me is the Inn of Rachel."
  npc_override_rachel_guides_rachel_you_want_check_out_weapo_05d78d: "Do you want to check out the weapons that are sold in Rachel? The {0} is located near the west gate."
  npc_override_rachel_guides_rachel_your_mini_map_3d388a: "on your mini map."
  npc_override_rachel_guides_rachel_your_mini_map_c80911: "on your mini-map."
  npc_override_rachel_juno_monster_society_accept_bb54db: "Accept"
  npc_override_rachel_juno_monster_society_according_recent_investi_3d3061: "According to recent investigations, it has been found that some regional monsters have become excessively ferocious or have increased their numbers."
  npc_override_rachel_juno_monster_society_adventurer_s_dangerous_h_0fe236: "Adventurer, it's dangerous here."
  npc_override_rachel_juno_monster_society_after_all_you_came_finis_880e62: "After all, you came to finish quickly!!"
  npc_override_rachel_juno_monster_society_after_catching_monsters_5a957d: "After catching 80 monsters in the Turtle Island dungeon, come and report to me. I'll be waiting for you."
  npc_override_rachel_juno_monster_society_after_catching_monsters_ef0b25: "After catching 80 monsters in the Turtle Island dungeon, come and report to me. Then I wish you good luck."
  npc_override_rachel_juno_monster_society_after_subjugating_please_cf63a5: "After subjugating, please come back to me~"
  npc_override_rachel_juno_monster_society_after_subjugation_come_m_fee417: "After subjugation, come to me and get your reward!!"
  npc_override_rachel_juno_monster_society_after_subjugation_please_3ebb6d: "After subjugation, please do not forget and let me know."
  npc_override_rachel_juno_monster_society_ah_adventurer_0de54d: "Ah! Adventurer!"
  npc_override_rachel_juno_monster_society_ah_adventurer_i_m_reques_c6abdc: "Ah, adventurer! I'm requesting a monster subjugation investigation, how about it?"
  npc_override_rachel_juno_monster_society_ah_adventurer_i_m_taking_84421e: "Ah, adventurer. I'm taking a monster subjugation investigation request today, how is it?"
  npc_override_rachel_juno_monster_society_ah_adventurer_i_saw_your_bb1d9a: "Ah, adventurer! I saw your performance well enough. Thank you for your hard work."
  npc_override_rachel_juno_monster_society_ah_fresh_cool_fba324: "Ah! Fresh and cool {0}!"
  npc_override_rachel_juno_monster_society_ah_i_subjugation_quest_a_eef791: "Ah! I can do the subjugation quest again. Is it time for me to work?"
  npc_override_rachel_juno_monster_society_ah_i_want_go_home_b54c84: "Ah .. I want to go home all of a sudden. When my mother left home, she said that she had a hard time, but it really was."
  npc_override_rachel_juno_monster_society_ah_please_help_us_e82f2d: "Ah... Please help us..."
  npc_override_rachel_juno_monster_society_ah_popular_these_days_i_23f04f: "Ah! Is this {0} popular these days? I'll drink it well."
  npc_override_rachel_juno_monster_society_ah_s_cool_83d4d1: "Ah, that's cool~!"
  npc_override_rachel_juno_monster_society_ah_s_enough_today_s_2d3dd0: "Ah, that's enough for today's subjugation!"
  npc_override_rachel_juno_monster_society_ah_s_refreshing_cool_rea_917b41: "Ah, it's refreshing, cool, and really nice."
  npc_override_rachel_juno_monster_society_ah_she_she_says_again_d2e16a: "Ah! She... She says it again. Aye, what are you talking about?"
  npc_override_rachel_juno_monster_society_ah_thank_you_so_much_e4b2bb: "Ah~!! Thank you so much~ I was very thirsty at the time~"
  npc_override_rachel_juno_monster_society_ah_then_what_i_540436: "Ah... Then what can I do?"
  npc_override_rachel_juno_monster_society_ah_way_even_if_you_483769: "Ah! By the way, even if you catch Tara Frog, it doesn't count. If you don't touch anything, it's a gentle monster, so you can avoid it."
  npc_override_rachel_juno_monster_society_ah_where_you_going_99d4d4: "Ah, where are you going?"
  npc_override_rachel_juno_monster_society_ah_you_help_us_611f74: "Ah... can you help us?"
  npc_override_rachel_juno_monster_society_ah_you_re_disturbing_me_c264df: "Ah?! You're disturbing me like this again. You can still be a guest, so be kind."
  npc_override_rachel_juno_monster_society_ah_you_see_you_re_563ec9: "Ah! Do you see that? You're the type of person who is always tired. Maybe it's because you put everything down and Accepted your tiredness? What the hell am I talking about?"
  npc_override_rachel_juno_monster_society_ahaha_bottle_well_receiv_30da10: "Ahaha, a bottle of {0}, well received!"
  npc_override_rachel_juno_monster_society_ahhh_really_they_so_dist_526a84: "Ahhh?! Really!! They are so disturbing. Do you see Esther standing over there? You must be able to speak, but when I talk to you, you don't answer?"
  npc_override_rachel_juno_monster_society_alberta_express_departin_204359: "Alberta Express is departing. Good work~"
  npc_override_rachel_juno_monster_society_alberta_express_left_imm_13d14d: "Alberta Express 1 {0}, left immediately."
  npc_override_rachel_juno_monster_society_all_you_catch_monsters_h_6b6e03: "All you have to do is catch 80 monsters here in Einbroch Field. After you catch them all, come back to me and get your reward."
  npc_override_rachel_juno_monster_society_all_you_catch_monsters_l_a388af: "All you have to do is catch 80 monsters in Lighthalzen Field. If you catch them all, ask me to confirm and receive your reward."
  npc_override_rachel_juno_monster_society_all_you_catch_monsters_s_45f423: "All you have to do is catch 80 monsters in the Starlight Coral Zone, because even if you catch shellfish, crab, and ester, they don't count! You don't have to catch them. Then, hard work!!"
  npc_override_rachel_juno_monster_society_alonzo_assistant_juno_mo_63c7f5: "This is Alonzo, assistant to the Juno Monster Society!"
  npc_override_rachel_juno_monster_society_already_means_you_t_cont_775721: "It already means that you can't control the object naturally."
  npc_override_rachel_juno_monster_society_aren_t_you_going_33d893: "Aren't you going?"
  npc_override_rachel_juno_monster_society_aren_t_you_going_give_f2b9cc: "Aren't you going to give me 3 {0}?"
  npc_override_rachel_juno_monster_society_aren_t_you_going_s_b756d1: "Aren't you going? It's for the public good!"
  npc_override_rachel_juno_monster_society_aren_t_you_going_then_0f88a6: "Aren't you going? Then, the {0}... Here, I'll return it."
  npc_override_rachel_juno_monster_society_as_number_monsters_incre_b76c9a: "As the number of monsters increases, the colony expands, and if monsters collide for power, humans can avoid them."
  npc_override_rachel_juno_monster_society_available_only_levels_hi_b54ae5: " - Available only for levels higher than {0} - "
  npc_override_rachel_juno_monster_society_avery_assistant_juno_mon_58d8a5: "This is Avery, the assistant of the Juno Monster Society!"
  npc_override_rachel_juno_monster_society_b_excellent_effect_b_urg_1e7e93: "It has an <b>excellent effect</b> on urgency, overeating and indigestion."
  npc_override_rachel_juno_monster_society_because_i_m_busy_right_125c38: "Because I'm busy right now. Only those who want to make a subjugation quest talk to me."
  npc_override_rachel_juno_monster_society_before_part_time_job_i_7d4020: "Before the part-time job, I thought that the Monster Society was just a game, but it seems to be working."
  npc_override_rachel_juno_monster_society_bnp_tired_overwork_so_pl_db45a7: "BNP is tired from overwork, so please come tomorrow. Subjugation quests can only be made once a day."
  npc_override_rachel_juno_monster_society_bye_bye_see_you_next_046415: "Bye-bye~ See you next time."
  npc_override_rachel_juno_monster_society_captain_s_outfit_so_cool_6a3c2e: "This captain's outfit is so cool, so I wanted to wear it, but if I wear it there, it becomes an impersonation. I'm just leaving my hometown and wearing it."
  npc_override_rachel_juno_monster_society_case_you_misunderstood_i_56568d: "In case you misunderstood, I am not the captain of the port of Malaya."
  npc_override_rachel_juno_monster_society_catch_monsters_front_tha_e7b6a8: "Catch 80 monsters in front of Thanatos Tower and report it to me."
  npc_override_rachel_juno_monster_society_catch_monsters_here_geff_7612d5: "Catch 80 monsters here in Geffen Field, then come and report to me."
  npc_override_rachel_juno_monster_society_clams_crabs_esters_count_1380ad: "Clams, crabs, and esters are not counted even if you catch them, so don't come and ask them later."
  npc_override_rachel_juno_monster_society_clams_crabs_esters_need_d149ec: "Clams, crabs, and esters do not need to be caught because there is no need to control the population."
