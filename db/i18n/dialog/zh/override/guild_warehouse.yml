Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_guild_warehouse_guild_warehouse_fee_zeny_9bca12: "费用是1000 Zeny。"
  npc_override_guild_warehouse_guild_warehouse_guild_storage_only_avail_edb3e5: "公会仓库仅对公会成员开放。"
  npc_override_guild_warehouse_guild_warehouse_how_i_help_you_13e773: "有什么可以帮你的吗？"
  npc_override_guild_warehouse_guild_warehouse_i_am_afraid_someone_else_90b72d: "恐怕现在有人正在使用仓库。"
  npc_override_guild_warehouse_guild_warehouse_i_am_afraid_you_enough_d2bacb: "恐怕你没有足够的钱来支付费用。"
  npc_override_guild_warehouse_guild_warehouse_i_open_guild_storage_you_32b256: "那我为你打开公会仓库。祝你度过愉快的时光！"
  npc_override_guild_warehouse_guild_warehouse_i_show_you_usage_history_bd27fd: "我为你展示仓库的使用记录。使用记录将保留最多3个月。"
  npc_override_guild_warehouse_guild_warehouse_memorable_time_c29e58: "祝你度过愉快的时光！"
  npc_override_guild_warehouse_guild_warehouse_menu_how_b2febf: "你好吗？我们是专门经营公会仓库的。这是我们的^0000cd故事^000000:"
  npc_override_guild_warehouse_guild_warehouse_menu_open_3534ca: "打开公会仓库:查看仓库使用记录"
  npc_override_guild_warehouse_guild_warehouse_please_come_back_after_c_c20cd8: "请在检查公会技能和仓库访问权限后再来。"
  npc_override_guild_warehouse_guild_warehouse_please_try_again_after_w_8e8536: "请稍后再试。"
  npc_override_guild_warehouse_guild_warehouse_seems_yet_possible_your_db9d21: "看起来你的公会目前还不能使用公会仓库，或者你没有仓库的访问权限。"
  npc_override_guild_warehouse_guild_warehouse_why_t_guild_members_shar_ff9d91: "为什么公会成员不能共享一个仓库呢？我们就是带着这个简单的问题起步的。"
  npc_override_guild_warehouse_guild_warehouse_you_open_warehouse_zeny_0624dc: "你可以花费1000 Zeny打开仓库，或者查询公会的使用记录。"
