  npc_override_1@rev_MorseCave_menu_morocc_e79ac5: "梦罗克:但够了。"
  npc_override_1@rev_MorseCave_menu_morocc_e86259: "梦罗克:我的士兵们，让他们受苦！吞噬他们的身体和灵魂！"
  npc_override_1@rev_MorseCave_menu_morocc_eebff5: "梦罗克死灵法师:遵命，大人！"
  npc_override_1@rev_MorseCave_menu_options_07d000: "{0} :等等！我们前面有东西！"
  npc_override_1@rev_MorseCave_menu_options_256b46: "{0} :但无所谓；你今天会死！"
  npc_override_1@rev_MorseCave_menu_options_2e92b8: "{0} :这些丑陋的怪物是梦罗克的走狗吗？"
  npc_override_1@rev_MorseCave_menu_options_91f16a: "{0} :我们来对地方了！"
  npc_override_1@rev_MorseCave_menu_options_cb9266: "{0} :终于，我们到了，梦罗克。"
