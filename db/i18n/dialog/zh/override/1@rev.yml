  npc_override_1@rev_MorseCave_menu_grim_1fa325: "死神安库:获取他完全恢复所需的力量。"
  npc_override_1@rev_MorseCave_menu_grim_467fd8: "死神安库:我给你一个离开的机会。现在！！"
  npc_override_1@rev_MorseCave_menu_grim_486e3d: "死神安库:你无法对抗他的意志。*轻笑*"
  npc_override_1@rev_MorseCave_menu_grim_56cb29: "死神安库:梦罗克大人在等你。让我带你去见他。*轻笑*"
  npc_override_1@rev_MorseCave_menu_grim_59631c: "死神安库:现在梦罗克大人已经完全恢复了力量，你死定了！"
  npc_override_1@rev_MorseCave_menu_grim_5b3844: "死神安库:唉，死灵法师，你为什么死得这么快？"
  npc_override_1@rev_MorseCave_menu_grim_5d5601: "死神安库:我给你一个离开的机会。现在！"
  npc_override_1@rev_MorseCave_menu_grim_6058b2: "死神安库:*轻笑* 我们又见面了！"
  npc_override_1@rev_MorseCave_menu_grim_690244: "死神安库:你不该来的。你在干扰梦罗克大人恢复力量。"
  npc_override_1@rev_MorseCave_menu_grim_6c60c1: "死神安库:你真可悲。"
  npc_override_1@rev_MorseCave_menu_grim_7d1239: "死神安库:像你这样的弱者不够梦罗克大人塞牙缝的"
  npc_override_1@rev_MorseCave_menu_grim_f9eae5: "死神安库:我们会再见面的。*轻笑*"
  npc_override_1@rev_MorseCave_menu_morocc_0af43f: "梦罗克:你真可悲，挣扎着求生！"
  npc_override_1@rev_MorseCave_menu_morocc_0d3003: "梦罗克:不够。让他们感受恐惧！"
  npc_override_1@rev_MorseCave_menu_morocc_0ead7d: "梦罗克:你比我想象的更有韧性。"
  npc_override_1@rev_MorseCave_menu_morocc_15f4b6: "梦罗克:哇哈哈哈，我能感觉到我的力量回来了！"
  npc_override_1@rev_MorseCave_menu_morocc_197227: "梦罗克: My power is returning!"
  npc_override_1@rev_MorseCave_menu_morocc_1bbe13: "梦罗克:你们的身体由我来控制！"
  npc_override_1@rev_MorseCave_menu_morocc_1cba10: "梦罗克:我的世界在进化。"
  npc_override_1@rev_MorseCave_menu_morocc_23990c: "梦罗克:哇哈哈哈！畏惧我的军队！挣扎得更猛烈些！"
  npc_override_1@rev_MorseCave_menu_morocc_30369f: "梦罗克:这力量！感觉太棒了！哇哈哈哈！"
  npc_override_1@rev_MorseCave_menu_morocc_337398: "梦罗克:失去对自己身体的控制感觉如何？*轻笑*"
  npc_override_1@rev_MorseCave_menu_morocc_3448c6: "梦罗克:你们擅闯！像你们这样的乌合之众无权进入这里！"
  npc_override_1@rev_MorseCave_menu_morocc_367768: "梦罗克死灵法师:*咯咯笑* 我会让你看看我真正的能力。"
  npc_override_1@rev_MorseCave_menu_morocc_39077d: "梦罗克:我的士兵们，撕碎他们的身体，把他们的灵魂带给我！"
  npc_override_1@rev_MorseCave_menu_morocc_489fa1: "梦罗克死灵法师:*轻笑* 你的愚蠢是我们的福气。我们不再需要你了。死吧！"
  npc_override_1@rev_MorseCave_menu_morocc_552e20: "梦罗克:反抗我！战斗到死！"
  npc_override_1@rev_MorseCave_menu_morocc_59942b: "梦罗克死灵法师:你被包围了！已经深陷其中！逃不掉！嘿！"
  npc_override_1@rev_MorseCave_menu_morocc_6669da: "梦罗克:更多！我需要更多能量！"
  npc_override_1@rev_MorseCave_menu_morocc_6c1499: "梦罗克:你们的身体和灵魂都在我的掌控之下！"
  npc_override_1@rev_MorseCave_menu_morocc_7ca694: "梦罗克死灵法师:*咯咯笑*"
  npc_override_1@rev_MorseCave_menu_morocc_8367dd: "梦罗克:谁敢打扰我的睡眠？！"
  npc_override_1@rev_MorseCave_menu_morocc_9a0c43: "梦罗克死灵法师:你比看起来更强。"
  npc_override_1@rev_MorseCave_menu_morocc_9edd22: "梦罗克:很好，我感觉恢复了活力。"
  npc_override_1@rev_MorseCave_menu_morocc_a046bc: "梦罗克死灵法师:你在我藏在你灵魂中时保护我所产生的能量"
  npc_override_1@rev_MorseCave_menu_morocc_a84b69: "梦罗克:我很惊讶你坚持了这么久。谢谢你帮我恢复了大部分力量。"
  npc_override_1@rev_MorseCave_menu_morocc_a8e2c0: "梦罗克:被彼此分离，身体和思想被束缚，感觉如何？"
  npc_override_1@rev_MorseCave_menu_morocc_aa705d: "梦罗克:你们的灵魂是我复活的食粮！"
  npc_override_1@rev_MorseCave_menu_morocc_ab7b0b: "梦罗克:我忠诚的士兵，我把他们的死交给你了！"
  npc_override_1@rev_MorseCave_menu_morocc_c20d28: "梦罗克:哈哈，我的死灵法师。我把他们交给你了。"
  npc_override_1@rev_MorseCave_menu_morocc_c5833d: "梦罗克死灵法师:已经被转化为治愈梦罗克大人的能量，就在你进入他的世界的那一刻！"
  npc_override_1@rev_MorseCave_menu_morocc_c72bca: "梦罗克死灵法师:你杀不了我！"
  npc_override_1@rev_MorseCave_menu_morocc_d6db4a: "梦罗克:我不能让你毫发无损地离开！"
  npc_override_1@rev_MorseCave_menu_morocc_e3633d: "梦罗克死灵法师:*轻笑* 你还是不明白，是吗？"
