  npc_override_1@rev_MorseCave_memorial_dungeon_morse_s_57ec30: "The Memorial dungeon Morse's Cave does not exist."
  npc_override_1@rev_MorseCave_menu_grim_0e4bff: "Grim Reaper Ankou: Don't be so happy!"
  npc_override_1@rev_MorseCave_menu_grim_11cbe4: "Grim Reaper Ankou: This world resides in his mind."
  npc_override_1@rev_MorseCave_menu_grim_1fa325: "Grim Reaper Ankou: to get the energy he needs for a full recovery."
  npc_override_1@rev_MorseCave_menu_grim_467fd8: "Grim Reaper Ankou: I'll give you one chance to leave. NOW!!"
  npc_override_1@rev_MorseCave_menu_grim_486e3d: "Grim Reaper Ankou: You can't do anything against his will. *Chuckle*"
  npc_override_1@rev_MorseCave_menu_grim_56cb29: "Grim Reaper Ankou: Lord Morocc is expecting you. Let me take you to him. *Chuckle*"
  npc_override_1@rev_MorseCave_menu_grim_59631c: "Grim Reaper Ankou: Now that Lord Morocc has fully recovered his strength, you're as good as dead!"
  npc_override_1@rev_MorseCave_menu_grim_5b3844: "Grim Reaper Ankou: Sigh, Necromancer, why did you have to die so quickly?"
  npc_override_1@rev_MorseCave_menu_grim_5d5601: "Grim Reaper Ankou: I'll give you one chance to leave. NOW!"
  npc_override_1@rev_MorseCave_menu_grim_6058b2: "Grim Reaper Ankou: *Chuckle* We meet again!"
  npc_override_1@rev_MorseCave_menu_grim_690244: "Grim Reaper Ankou: You shouldn't have come. You're interrupting Lord Morocc from recovering his strength."
  npc_override_1@rev_MorseCave_menu_grim_6c60c1: "Grim Reaper Ankou: You're pathetic."
  npc_override_1@rev_MorseCave_menu_grim_7d1239: "Grim Reaper Ankou: Weaklings like you aren't enough food for Lord Morocc"
  npc_override_1@rev_MorseCave_menu_grim_f9eae5: "Grim Reaper Ankou: We'll meet again. *Chuckle*"
  npc_override_1@rev_MorseCave_menu_morocc_0af43f: "Morocc: You're pathetic, struggling to survive!"
  npc_override_1@rev_MorseCave_menu_morocc_0d3003: "Morocc: Not enough. Make them feel terror!"
  npc_override_1@rev_MorseCave_menu_morocc_0ead7d: "Morocc: You're more resilient than I thought."
  npc_override_1@rev_MorseCave_menu_morocc_15f4b6: "Morocc: Mwa hah hah, I can feel my power returning!"
  npc_override_1@rev_MorseCave_menu_morocc_197227: "Morocc: My power is returning!"
  npc_override_1@rev_MorseCave_menu_morocc_1bbe13: "Morocc: Your bodies are mine to control!"
  npc_override_1@rev_MorseCave_menu_morocc_1cba10: "Morocc: This world of mine is evolving."
  npc_override_1@rev_MorseCave_menu_morocc_23990c: "Morocc: Mwah hah hah! Fear my army! Struggle harder!"
  npc_override_1@rev_MorseCave_menu_morocc_30369f: "Morocc: This power! It feels great! Mwah hah hah!"
  npc_override_1@rev_MorseCave_menu_morocc_337398: "Morocc: How do you like losing control of your own body? *Chuckle*"
  npc_override_1@rev_MorseCave_menu_morocc_3448c6: "Morocc: You're trespassing! Riff-raff like you have no business in here!"
  npc_override_1@rev_MorseCave_menu_morocc_367768: "Morocc Necromancer: *Giggle* I'll show you what I'm truly capable of."
  npc_override_1@rev_MorseCave_menu_morocc_39077d: "Morocc: My soldiers, tear their bodies asunder and bring their souls to me!"
  npc_override_1@rev_MorseCave_menu_morocc_489fa1: "Morocc Necromancer: *Chuckle* Your stupidity was a blessing for us. We don't need you anymore. DIE!"
  npc_override_1@rev_MorseCave_menu_morocc_552e20: "Morocc: Resist me! Fight to the death!"
  npc_override_1@rev_MorseCave_menu_morocc_59942b: "Morocc Necromancer: You are surrounded by a lot! It's already in the middle of it! Can't escape! Hey!"
  npc_override_1@rev_MorseCave_menu_morocc_6669da: "Morocc: More! I need more energy!"
  npc_override_1@rev_MorseCave_menu_morocc_6c1499: "Morocc: Your bodies and souls are under my command!"
  npc_override_1@rev_MorseCave_menu_morocc_7ca694: "Morocc Necromancer: *Giggle*"
  npc_override_1@rev_MorseCave_menu_morocc_8367dd: "Morocc: Who dares to disrupt my sleep?!"
  npc_override_1@rev_MorseCave_menu_morocc_9a0c43: "Morocc Necromancer: You're stronger than you look."
  npc_override_1@rev_MorseCave_menu_morocc_9edd22: "Morocc: Good, I feel rejuvenated."
  npc_override_1@rev_MorseCave_menu_morocc_a046bc: "Morocc Necromancer: The energy you generated to protect me while I was hiding within your soul"
  npc_override_1@rev_MorseCave_menu_morocc_a84b69: "Morocc: I'm surprised you've lasted this long. Thank you for helping me recover most of my strength."
  npc_override_1@rev_MorseCave_menu_morocc_a8e2c0: "Morocc: How do you like to be separated from each other and have your bodies and minds bound?"
  npc_override_1@rev_MorseCave_menu_morocc_aa705d: "Morocc: Your souls are food for my resurrection!"
  npc_override_1@rev_MorseCave_menu_morocc_ab7b0b: "Morocc: My loyal soldier, I'll trust you with their deaths!"
  npc_override_1@rev_MorseCave_menu_morocc_c20d28: "Morocc: Hah hah, my Necromancer. I'll leave them to you."
  npc_override_1@rev_MorseCave_menu_morocc_c5833d: "Morocc Necromancer: has been converted to healing energy for Lord Morocc the moment you entered this world of his!"
  npc_override_1@rev_MorseCave_menu_morocc_c72bca: "Morocc Necromancer: You can't kill me!"
  npc_override_1@rev_MorseCave_menu_morocc_d6db4a: "Morocc: I can't let you go unscathed!"
  npc_override_1@rev_MorseCave_menu_morocc_e3633d: "Morocc Necromancer: *Chuckle* You still have no idea, do you?"
  npc_override_1@rev_MorseCave_menu_morocc_e52cde: "Morocc Necromancer: Beg me for your lives!"
  npc_override_1@rev_MorseCave_menu_morocc_e79ac5: "Morocc: But enough is enough."
  npc_override_1@rev_MorseCave_menu_morocc_e86259: "Morocc: My soldiers, make them suffer! Feast on their bodies and souls!"
  npc_override_1@rev_MorseCave_menu_morocc_eebff5: "Morocc Necromancer: As you wish, My Lord!"
  npc_override_1@rev_MorseCave_menu_options_07d000: "{0} : Wait! There's something ahead of us!"
  npc_override_1@rev_MorseCave_menu_options_256b46: "{0} : but it doesn't matter; you'll die today!"
  npc_override_1@rev_MorseCave_menu_options_2e92b8: "{0} : Are these hideous monsters Morocc's lackeys?"
  npc_override_1@rev_MorseCave_menu_options_91f16a: "{0} : We came to the right place!"
  npc_override_1@rev_MorseCave_menu_options_cb9266: "{0} : Finally, here we are, Morocc."
  npc_override_1@rev_MorseCave_menu_options_fd4391: "{0} : It's been almost too easy to find you,"
  npc_override_1@rev_MorseCave_menu_weakened_38f807: "Weakened Morocc: In the end, you'll learn the meaning of helplessness in the most painful way!"
  npc_override_1@rev_MorseCave_menu_weakened_741447: "Weakened Morocc: I'll have to leave you to my soldiers for now."
  npc_override_1@rev_MorseCave_menu_weakened_80a32f: "Weakened Morocc: Death is your only escape!"
  npc_override_1@rev_MorseCave_menu_weakened_aadfe0: "Weakened Morocc: I should punish you for disturbing my slumber."
  npc_override_1@rev_MorseCave_menu_weakened_b68cb2: "Weakened Morocc: I may have not recovered my full strength,"
  npc_override_1@rev_MorseCave_menu_weakened_bad945: "Weakened Morocc: but I still can take down a bunch of you easily."
  npc_override_1@rev_MorseCave_menu_weakened_c1ef2d: "Weakened Morocc: Do you really think you can stop me?"
  npc_override_1@rev_MorseCave_menu_weakened_cf309d: "Weakened Morocc: I'll make you regret ever coming here."
  npc_override_1@rev_MorseCave_menu_weakened_d93819: "Weakened Morocc: Do your worst to get out of my world!"
  npc_override_1@rev_MorseCave_menu_weakened_eadbb5: "Weakened Morocc: And your souls will be mine! Mwah hah hah!"
  npc_override_1@rev_MorseCave_menu_weakened_f99397: "Weakened Morocc: I'm sorry, but I haven't recovered my full strength."
  npc_override_1@rev_MorseCave_morocc_hiding_out_place_4b45b9: "Morocc is hiding out in this place,"
  npc_override_1@rev_MorseCave_morocc_may_recovered_his_773e04: "Morocc may not have recovered his full strength, but fighting him still"
