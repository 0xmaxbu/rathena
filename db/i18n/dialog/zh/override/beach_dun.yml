Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_beach_dun_beach_dun_menu_ancient_11a5df: "远古伍坦防卫者：听好了所有伍坦！现在离开，投身下一个。"
  npc_override_beach_dun_beach_dun_menu_ancient_18037b: "远古陶工卡：是时候展示你们的巨石之力了吗？"
  npc_override_beach_dun_beach_dun_menu_ancient_189f7c: "远古陶工卡：当我们解脱束缚踏入世界时，我们会变得更强大。"
  npc_override_beach_dun_beach_dun_menu_ancient_31ce30: "远古伍坦防卫者：呃……好危险的伤口……"
  npc_override_beach_dun_beach_dun_menu_ancient_b5b9d2: "远古陶工卡：蹲下。当你蹲下时，你就是巨石。"
  npc_override_beach_dun_beach_dun_menu_ancient_c710f3: "远古伍坦防卫者：你把我这个伍坦部落的战士逼到了这一步。相当不错。可惜，我现在要退场了。"
  npc_override_beach_dun_beach_dun_menu_ancient_f1e6e5: "远古陶工卡：巨石们，是时候蹲下屏住呼吸了。"
  npc_override_beach_dun_beach_dun_menu_ancient_faa3eb: "远古伍坦防卫者：我想在这些没用的家伙之后，我该亲自出手了。"
