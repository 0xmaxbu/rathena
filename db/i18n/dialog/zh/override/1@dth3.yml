Header:
  Type: I18N_DIALOG
  Version: 1
Body:
  npc_override_1@dth3_IsleOfBios_characters_below_level_c_b8f731: "^ff0000等级低于160的角色无法进入此地下城。^000000"
  npc_override_1@dth3_IsleOfBios_created_memorial_dungeon_f07943: "^ff0000已创建纪念地下城。^000000"
  npc_override_1@dth3_IsleOfBios_hero_token_accident_ad1146: "这个英雄令牌是偶然得到的。"
  npc_override_1@dth3_IsleOfBios_i_came_a59a6e: "我通过"
  npc_override_1@dth3_IsleOfBios_i_couldn_t_shake_off_c84480: "我无法摆脱在那个噩梦中看到的生动画面。我像个疯子一样四处游荡，最终来到了这里。"
  npc_override_1@dth3_IsleOfBios_i_don_t_know_when_f59cab: "我不知道是从什么时候开始的……"
  npc_override_1@dth3_IsleOfBios_i_m_afraid_you_re_246b72: "恐怕你还没准备好。"
  npc_override_1@dth3_IsleOfBios_i_saw_place_my_dream_303d15: "我在梦中看到了这个地方。这是魔神 梦罗克 从沉睡中醒来的地方。我的梦向我展示了一个可能的未来。"
  npc_override_1@dth3_IsleOfBios_i_want_give_you_you_6b8f87: "我想把它给你。你值得拥有它。"
  npc_override_1@dth3_IsleOfBios_if_my_dream_really_premo_f36d7b: "如果我的梦真的是预兆，魔神 梦罗克 的力量就在那颗黄色种子中。"
  npc_override_1@dth3_IsleOfBios_let_s_get_out_creepy_341a87: "让我们离开这个阴森的地方！"
  npc_override_1@dth3_IsleOfBios_memorial_dungeon_cannot_018e49: "^ff0000此纪念地下城在上次访问后23小时内无法进入。^000000"
  npc_override_1@dth3_IsleOfBios_menu_grim_01a451: "Grim Reaper Ankou：感受死亡的恐惧吧！"
  npc_override_1@dth3_IsleOfBios_menu_grim_08f64b: "Grim Reaper Ankou：在你面前是一支不死的军队。"
  npc_override_1@dth3_IsleOfBios_menu_grim_1ce0c1: "Grim Reaper Ankou：*轻笑* 至少你们中有一个头脑清醒的人。"
  npc_override_1@dth3_IsleOfBios_menu_grim_2e3d12: "Grim Reaper Ankou：没错。是时候让你体验死亡了。"
  npc_override_1@dth3_IsleOfBios_menu_grim_33810b: "Grim Reaper Ankou：彼此彼此，大嘴巴。"
  npc_override_1@dth3_IsleOfBios_menu_grim_44741f: "Grim Reaper Ankou：你对下一个对手好奇吗？"
  npc_override_1@dth3_IsleOfBios_menu_grim_468a0b: "Grim Reaper Ankou：*轻笑* 这就是生物之岛，一个我在脑海中构想的地方。"
  npc_override_1@dth3_IsleOfBios_menu_grim_47d194: "Grim Reaper Ankou：*轻笑*"
  npc_override_1@dth3_IsleOfBios_menu_grim_4be5f6: "Grim Reaper Ankou：梦罗克 大人很快就会回来。"
  npc_override_1@dth3_IsleOfBios_menu_grim_58e4cf: "Grim Reaper Ankou：我想看着你缓慢而痛苦地死去。*轻笑*"
  npc_override_1@dth3_IsleOfBios_menu_grim_5bb417: "Grim Reaper Ankou：我会教你在恐怖面前无助是多么可怕！"
  npc_override_1@dth3_IsleOfBios_menu_grim_95e9c2: "Grim Reaper Ankou：我低估了你，或者我的士兵没有我想象的那么强。"
  npc_override_1@dth3_IsleOfBios_menu_grim_9994f4: "Grim Reaper Ankou：你一定注意到了，我的士兵在日落前就已经成长了。"
  npc_override_1@dth3_IsleOfBios_menu_grim_9c0cd4: "Grim Reaper Ankou：别诱惑我，人类。"
  npc_override_1@dth3_IsleOfBios_menu_grim_9c2f72: "Grim Reaper Ankou：你走进了陷阱，自愿成为 梦罗克 大人的祭品。你不怕死吗？"
  npc_override_1@dth3_IsleOfBios_menu_grim_9d2c9e: "Grim Reaper Ankou：你很强大……"
  npc_override_1@dth3_IsleOfBios_menu_grim_a8d6a2: "Grim Reaper Ankou：但我的目标已经达成了……别以为这就结束了。"
  npc_override_1@dth3_IsleOfBios_menu_grim_b0fa03: "Grim Reaper Ankou：夜幕降临后，它们已经达到了发展的最终阶段：超越死亡的生命。"
  npc_override_1@dth3_IsleOfBios_menu_grim_b1419b: "Grim Reaper Ankou：你还在说话。我干脆亲自杀了你，一了百了！"
  npc_override_1@dth3_IsleOfBios_menu_grim_c05c6c: "Grim Reaper Ankou：梦罗克 大人很快就会回来。*轻笑* 死亡的恐惧将无论你走到哪里都跟随你。"
  npc_override_1@dth3_IsleOfBios_menu_grim_c7c989: "Grim Reaper Ankou：准备好感受死亡的恐惧吧！*轻笑*"
  npc_override_1@dth3_IsleOfBios_menu_grim_cec92a: "Grim Reaper Ankou：这就是你最好的表现吗？如此弱小的生物，你们人类。"
  npc_override_1@dth3_IsleOfBios_menu_grim_dfa1ea: "Grim Reaper Ankou：在生物之岛上，每一天就是一生。"
  npc_override_1@dth3_IsleOfBios_menu_grim_f758f1: "Grim Reaper Ankou：*轻笑* 出来吧，我的士兵们！"
  npc_override_1@dth3_IsleOfBios_menu_i_f9ad0d: "我试图进入种子，但没有成功：我太老了，太虚弱了。但也许你可以。"
  npc_override_1@dth3_IsleOfBios_menu_options_c01e87: "？？？：*轻笑* 你想知道你在哪里吗？"
  npc_override_1@dth3_IsleOfBios_menu_system_64fcd7: "系统：岛上还剩 {0} 只怪物。"
  npc_override_1@dth3_IsleOfBios_menu_system_90001a: "系统：你已经消灭了所有怪物。使用3点钟方向的出口前往下一个区域。"
  npc_override_1@dth3_IsleOfBios_menu_system_98ae33: "系统：消灭岛上所有敌人，从另一边的门出去前往下一个区域。"
  npc_override_1@dth3_IsleOfBios_menu_system_b3ae78: "系统：岛上还剩1只怪物。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_024bd3: "Vrid：如果不是 Zeith，我还会在里面游荡。谢谢你，Zeith。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_0678de: "Vrid：该死，亡灵来了，但我不能战斗，因为我的脚动不了！"
  npc_override_1@dth3_IsleOfBios_menu_vrid_093117: "Vrid：我想给你一些东西来感谢你的救命之恩。等你准备好接受的时候再和我谈谈。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_12c712: "Vrid：嗯，我觉得你说得对。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_1455c2: "Vrid：我们追他！Zeith，快点！"
  npc_override_1@dth3_IsleOfBios_menu_vrid_16dab8: "Vrid：呃！发、发生什么事了？！我、我动不了！"
  npc_override_1@dth3_IsleOfBios_menu_vrid_1bdf41: "Vrid：该死，我动不了……"
  npc_override_1@dth3_IsleOfBios_menu_vrid_266965: "Vrid：对我来说，这听起来很自然。你在担心什么？"
  npc_override_1@dth3_IsleOfBios_menu_vrid_319911: "Vrid：啊，很抱歉我们帮不上忙。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_3640a9: "Vrid：你在作弊！放开我们，公平战斗！"
  npc_override_1@dth3_IsleOfBios_menu_vrid_47b8e6: "Vrid：啊，终于能动了！"
  npc_override_1@dth3_IsleOfBios_menu_vrid_48ebf8: "Vrid：呃，这是什么地方？我只是碰了一下种子，景色突然变了。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_4bb677: "Vrid：呸！如果我是的话，我就不会自愿来了，不是吗？"
  npc_override_1@dth3_IsleOfBios_menu_vrid_5511ed: "Vrid：天哪，我们在天上飞吗？！"
  npc_override_1@dth3_IsleOfBios_menu_vrid_5a4350: "Vrid：怎么了？"
  npc_override_1@dth3_IsleOfBios_menu_vrid_623b7e: "Vrid：又是你？"
  npc_override_1@dth3_IsleOfBios_menu_vrid_6a16a3: "Vrid：我是 Vrid，这是 Zeith，来自 普隆德拉。我们一直在世界各地旅行，为正义而战。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_6aa8ca: "Vrid：啊，又有人加入我们了。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_6d02c4: "Vrid：希望那真的是最后一批了。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_758080: "Vrid：他是谁？他想复活 梦罗克 吗？"
  npc_override_1@dth3_IsleOfBios_menu_vrid_8e7c5b: "Vrid：它们一开始都很小，然后随着时间的推移我们面对越来越大越来越强的敌人。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_91b114: "Vrid：啊，我不想死！"
  npc_override_1@dth3_IsleOfBios_menu_vrid_9dc558: "Vrid：别理他。只有我们俩的时候他可没这么安静。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_a988ce: "Vrid：呼，那个死神比我和 Zeith 加起来还要强。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_b00429: "Vrid：嘿，Zeith。说点什么。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_b029ce: "Vrid：我会亲自消灭你！"
  npc_override_1@dth3_IsleOfBios_menu_vrid_dcf48d: "Vrid：闭嘴，你这个恶魔！我们没时间理你的手下！"
  npc_override_1@dth3_IsleOfBios_menu_vrid_dd7aa5: "Vrid：你作弊，公平战斗！"
  npc_override_1@dth3_IsleOfBios_menu_vrid_e07aca: "Vrid：你也是来阻止 梦罗克 复活的吗？"
  npc_override_1@dth3_IsleOfBios_menu_vrid_e52394: "Vrid：如果不是你，我们可能会死。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_e57727: "Vrid：不管你是谁，在你动手之前我们会先杀了你！"
  npc_override_1@dth3_IsleOfBios_menu_vrid_e7c5c8: "Vrid：哇，你太厉害了！你把它们都杀了吗？"
  npc_override_1@dth3_IsleOfBios_menu_vrid_f2025f: "Vrid：你很幸运能在这里。我一进入那个迷宫就完全迷路了。"
  npc_override_1@dth3_IsleOfBios_menu_vrid_f9780d: "Vrid：我们来这里只是因为下面那个老家伙一直唠叨 梦罗克 复活的事。"
  npc_override_1@dth3_IsleOfBios_menu_zeith_029239: "Zeith：无论它们是原版更强版本，还是完全不同的东西。"
  npc_override_1@dth3_IsleOfBios_menu_zeith_20a8b3: "Zeith：哼，我为自己如此软弱感到羞耻……"
  npc_override_1@dth3_IsleOfBios_menu_zeith_29c72e: "Zeith：嗯，我好奇我们现在要面对的怪物。"
  npc_override_1@dth3_IsleOfBios_menu_zeith_2c3e46: "Zeith：……啊。"
  npc_override_1@dth3_IsleOfBios_menu_zeith_52f235: "Zeith：呃……我感到如此无助……"
  npc_override_1@dth3_IsleOfBios_menu_zeith_59f79e: "Zeith：我是 Zeith。"
  npc_override_1@dth3_IsleOfBios_menu_zeith_6abc31: "Zeith：就像孩子长大成人一样。"
  npc_override_1@dth3_IsleOfBios_menu_zeith_6bc06e: "Zeith：那个叫 Ankou 的家伙闻起来很危险。他一开始使用技能你最好就移动。"
  npc_override_1@dth3_IsleOfBios_menu_zeith_7d9a89: "Zeith：还没。还有更多要来！"
  npc_override_1@dth3_IsleOfBios_menu_zeith_8659c7: "Zeith：……呃……"
  npc_override_1@dth3_IsleOfBios_menu_zeith_8b3e14: "Zeith：……你说的话够我们俩用了。"
  npc_override_1@dth3_IsleOfBios_menu_zeith_a9c9f6: "Zeith：……有件事一直困扰着我。"
  npc_override_1@dth3_IsleOfBios_menu_zeith_b1c35d: "Zeith：我讨厌跑步。"
  npc_override_1@dth3_IsleOfBios_menu_zeith_d6caca: "Zeith：……"
  npc_override_1@dth3_IsleOfBios_menu_zeith_d866ee: "Zeith：我有种感觉，怪物随着时间的推移变得越来越强。"
  npc_override_1@dth3_IsleOfBios_menu_zeith_d97e34: "Zeith：不，我们没那么幸运——还有更多在路上！"
  npc_override_1@dth3_IsleOfBios_menu_zeith_eaaebd: "Zeith：我、我也不能！我的脚动不了！"
  npc_override_1@dth3_IsleOfBios_menu_zeith_ee2e1e: "Zeith：谁在那里？！"
  npc_override_1@dth3_IsleOfBios_msg_6eae3a: "……"
  npc_override_1@dth3_IsleOfBios_my_nightmare_demon_king_a54d00: "在我的噩梦中，魔神 梦罗克 从百年沉睡中醒来，用黑暗和恐怖填满世界。"
  npc_override_1@dth3_IsleOfBios_party_entering_isle_bios_655f6b: "'{0}的队伍{1}正在进入生物之岛。'"
  npc_override_1@dth3_IsleOfBios_please_click_press_enter_784c9b: "^ff0000请点击并按回车键再次确认。^000000"
  npc_override_1@dth3_IsleOfBios_please_investigate_yello_be76f3: "请调查那颗黄色种子。"
  npc_override_1@dth3_IsleOfBios_please_note_memorial_dun_06da1c: "^ff0000请注意，此纪念地下城在上次访问后23小时内无法进入。^000000"
  npc_override_1@dth3_IsleOfBios_s_too_dangerous_you_go_57c747: "你一个人去太危险了。你应该至少带一个同伴。"
  npc_override_1@dth3_IsleOfBios_same_nightmare_been_plag_c4ac01: "同一个噩梦已经困扰我很久了。"
  npc_override_1@dth3_IsleOfBios_where_am_i_3b8935: "……我在哪里？"
  npc_override_1@dth3_IsleOfBios_you_first_must_form_join_86e369: "^ff0000你必须先组建/加入至少1人的队伍才能进入此地下城。^000000"
  npc_override_1@dth3_IsleOfBios_you_first_must_meet_wand_966c20: "^ff0000你必须先遇见流浪老人才能获得进入此地下城的权限。^000000"
  npc_override_1@dth3_IsleOfBios_you_least_level_39a950: "你必须至少达到160级。"
  npc_override_1@dth3_IsleOfBios_your_party_leader_yet_cr_111a32: "^ff0000你的队伍领袖尚未创建时间裂缝。^000000"

