Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_gef_fild07_quest_fabre_ah_ok_i_think_you_fa3a43: "啊，好的，我觉得你可以帮我猎杀一些毛毛怪。"
  npc_override_gef_fild07_quest_fabre_amazing_you_did_speed_6cc3cd: "太厉害了，你做得真快。"
  npc_override_gef_fild07_quest_fabre_any_progress_you_ve_made_b3e247: "你取得的任何进度都将被清除"
  npc_override_gef_fild07_quest_fabre_come_back_when_you_ve_44350c: "完成任务后再回来，我会给你一点奖励。"
  npc_override_gef_fild07_quest_fabre_complete_community_servi_6b32e8: "完成这个社区服务项目。"
  npc_override_gef_fild07_quest_fabre_hello_my_name_langry_525019: "你好，我叫兰格里。"
  npc_override_gef_fild07_quest_fabre_hmm_i_don_t_think_1d8eb5: "嗯，我觉得你还没猎杀 100 只……"
  npc_override_gef_fild07_quest_fabre_hmm_i_don_t_think_2144d7: "嗯，我觉得你还没猎杀 50 只……"
  npc_override_gef_fild07_quest_fabre_hmm_i_don_t_think_5d960b: "嗯，我觉得你还没猎杀 150 只……"
  npc_override_gef_fild07_quest_fabre_how_many_you_like_hunt_7fc82d: "你想猎杀多少只？"
  npc_override_gef_fild07_quest_fabre_i_complete_community_ser_cf4547: "我必须完成这个社区服务项目，但我实在太懒了。"
  npc_override_gef_fild07_quest_fabre_i_need_collect_fluff_7a1d4d: "我需要收集 ^0000CE25 个柔毛^000000 来"
  npc_override_gef_fild07_quest_fabre_i_need_fluff_f72e12: "我需要 ^00CE0025 个柔毛^000000。"
  npc_override_gef_fild07_quest_fabre_i_see_no_fluff_wait_762d2b: "我没看到柔毛，等等，看到了——就是你嘴里说出来的谎言。"
  npc_override_gef_fild07_quest_fabre_if_you_change_your_mind_3f2210: "如果你改变主意，请回来。"
  npc_override_gef_fild07_quest_fabre_menu_fabres_af6f6c: "50 只毛毛怪:100 只毛毛怪:150 只毛毛怪"
  npc_override_gef_fild07_quest_fabre_menu_gather_f0e7ee: "收集道具:猎杀毛毛怪:取消"
  npc_override_gef_fild07_quest_fabre_menu_i_dd528a: "我有一些柔毛:你刚才说什么？"
  npc_override_gef_fild07_quest_fabre_menu_sure_859d29: "当然:不"
  npc_override_gef_fild07_quest_fabre_menu_yes_141459: "是:否"
  npc_override_gef_fild07_quest_fabre_menu_yes_755efb: "是:否:我想放弃"
  npc_override_gef_fild07_quest_fabre_oh_here_you_go_should_c91e12: "哦，给你，这应该能让你变得更强、更快！"
  npc_override_gef_fild07_quest_fabre_ok_then_well_come_back_0e1574: "那好吧，如果你改变主意就回来。"
  npc_override_gef_fild07_quest_fabre_please_5c273b: "求你了？"
  npc_override_gef_fild07_quest_fabre_please_kill_fabres_5450df: "请猎杀 50 只毛毛怪。"
  npc_override_gef_fild07_quest_fabre_please_kill_fabres_83e310: "请猎杀 100 只毛毛怪。"
  npc_override_gef_fild07_quest_fabre_please_kill_fabres_e9fd86: "请猎杀 150 只毛毛怪。"
  npc_override_gef_fild07_quest_fabre_really_1acc34: "真的吗？！"
  npc_override_gef_fild07_quest_fabre_remember_i_need_help_hun_301c05: "记住，我需要帮助猎杀毛毛怪，所以去猎杀 100 只吧。"
  npc_override_gef_fild07_quest_fabre_remember_i_need_help_hun_3a73f4: "记住，我需要帮助猎杀毛毛怪，所以去猎杀 150 只吧。"
  npc_override_gef_fild07_quest_fabre_remember_i_need_help_hun_4abe80: "记住，我需要帮助猎杀毛毛怪，所以去猎杀 50 只吧。"
  npc_override_gef_fild07_quest_fabre_s_great_82bb27: "太好了！"
  npc_override_gef_fild07_quest_fabre_thank_you_fluff_helps_me_cf7aaf: "谢谢你给我的柔毛。这对我帮助很大。"
  npc_override_gef_fild07_quest_fabre_you_finished_hunting_fab_309e16: "你猎杀完 150 只毛毛怪了吗？"
  npc_override_gef_fild07_quest_fabre_you_finished_hunting_fab_c86b3b: "你猎杀完 50 只毛毛怪了吗？"
  npc_override_gef_fild07_quest_fabre_you_know_what_i_even_5d8e9c: "你知道吗？我甚至可以给你一点奖励作为答谢。"
  npc_override_gef_fild07_quest_fabre_you_may_just_most_unlike_85ba09: "你可能是我见过最不可能帮忙的人了，回收一些毛毛怪再回来吧。"
  npc_override_gef_fild07_quest_fabre_you_sure_you_want_stop_507e20: "你确定要停止狩猎吗？"
  npc_override_gef_fild07_quest_fabre_you_think_you_help_me_63549e: "你觉得你能帮我吗？"
