Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_rgsr_in_rgsr_in_ah_we_ve_come_far_a56def: "啊，我们已经走到这一步了，但我们团队的研究在实验方面仍然不足。"
  npc_override_rgsr_in_rgsr_in_all_around_world_researc_135d16: "世界各地的研究都在雷根施尔姆研究所进行，以改造武器、防具、饰品和其他装备物品……"
  npc_override_rgsr_in_rgsr_in_already_going_047164: "已经在进行了？"
  npc_override_rgsr_in_rgsr_in_armor_intermediate_mods_1737cc: "防具中级改造？好的。"
  npc_override_rgsr_in_rgsr_in_armor_lower_mods_okay_7bee86: "防具下级改造？好的。"
  npc_override_rgsr_in_rgsr_in_armor_upper_mods_okay_28f8a7: "防具上级改造？好的。"
  npc_override_rgsr_in_rgsr_in_as_soon_as_data_collecte_9d565d: "这是……一旦数据收集完毕，就会有所进展。"
  npc_override_rgsr_in_rgsr_in_as_we_see_our_research_0e602a: "正如我们在研究中看到的，材料非常稀有。我们团队雇佣了冒险者，但材料的数量与我们所需相比远远不够。"
  npc_override_rgsr_in_rgsr_in_come_1d1797: "来吧。"
  npc_override_rgsr_in_rgsr_in_come_b49449: "……来吧。"
  npc_override_rgsr_in_rgsr_in_come_back_whenever_you_n_e82239: "需要时随时回来。"
  npc_override_rgsr_in_rgsr_in_convert_3f15ce: "转换"
  npc_override_rgsr_in_rgsr_in_did_you_bring_stuff_065fef: "你把东西带来了吗？"
  npc_override_rgsr_in_rgsr_in_don_t_enough_ore_then_0774aa: "矿石不够？那我有一些特别收集的东西……"
  npc_override_rgsr_in_rgsr_in_don_t_you_want_try_a50514: "你不想尝试一下新的改造方式，而不仅仅是普通的改造方法吗？"
  npc_override_rgsr_in_rgsr_in_essential_cut_refine_equ_12a301: "切割装备的精炼等级是必要的，但这是为了获得更强大的力量而付出的劳动。"
  npc_override_rgsr_in_rgsr_in_everyone_likes_quiet_so_0b36d2: "大家都喜欢安静，所以不要太大声说话。"
  npc_override_rgsr_in_rgsr_in_finally_i_talked_adventu_4b89a2: "终于，我和一位冒险者交谈了，请他确认我的研究，那是你吗？"
  npc_override_rgsr_in_rgsr_in_gemstone_refining_0c1831: "宝石精炼。"
  npc_override_rgsr_in_rgsr_in_gemstone_refining_6f54df: "宝石精炼"
  npc_override_rgsr_in_rgsr_in_good_other_facilities_in_3487bc: "很好！研究所的其他设施是保密的，无法进入，所以我们会引导你走一条特殊的路径，你们外来者可以进入！"
  npc_override_rgsr_in_rgsr_in_grimace_5d3864: "鬼脸。"
  npc_override_rgsr_in_rgsr_in_hello_adventurer_4280fa: "你好，冒险者！"
  npc_override_rgsr_in_rgsr_in_huh_you_anyone_else_see_474d7c: "嗯？除了团队负责人之外，你还有其他要见的人吗？"
  npc_override_rgsr_in_rgsr_in_i_am_charge_enchants_318b8c: "我负责附魔。"
  npc_override_rgsr_in_rgsr_in_i_like_people_who_sure_c29731: "我喜欢目标明确的人。"
  npc_override_rgsr_in_rgsr_in_i_ll_improve_bit_next_59bd85: "下次我会改进一下，然后得到队长的许可，我们再继续。"
  npc_override_rgsr_in_rgsr_in_i_ll_see_you_next_e4eacb: "下次我得到队长许可时再见。"
  npc_override_rgsr_in_rgsr_in_i_try_answer_any_questio_c04fb2: "我会尽力回答你的任何问题。"
  npc_override_rgsr_in_rgsr_in_if_you_need_anything_com_b017fc: "如果你需要什么，再来找我。"
  npc_override_rgsr_in_rgsr_in_if_you_need_mods_come_887639: "如果你需要改造，再回来。"
  npc_override_rgsr_in_rgsr_in_if_you_re_interested_che_f51026: "如果你感兴趣，可以看看进行了什么研究。"
  npc_override_rgsr_in_rgsr_in_if_you_re_interested_lat_46e8c8: "如果你以后感兴趣，再回来！"
  npc_override_rgsr_in_rgsr_in_if_you_want_modify_somet_b4df76: "如果你想改造什么，只需要带来所需的材料。"
  npc_override_rgsr_in_rgsr_in_join_regenschirm_institu_c84819: "加入雷根施尔姆研究所！"
  npc_override_rgsr_in_rgsr_in_let_me_guide_you_way_4e5883: "让我引导你回去。"
  npc_override_rgsr_in_rgsr_in_let_s_go_d7f55d: "走吧。"
  npc_override_rgsr_in_rgsr_in_let_s_see_4d37ed: "让我看看……"
  npc_override_rgsr_in_rgsr_in_let_s_see_what_you_43089f: "让我看看你带来了什么。"
  npc_override_rgsr_in_rgsr_in_let_s_see_what_you_be4a54: "让我看看你得到了什么？"
  npc_override_rgsr_in_rgsr_in_let_s_see_you_re_2e8927: "让我看看……你是客人。"
  npc_override_rgsr_in_rgsr_in_lower_mods_656e18: "下级改造"
  npc_override_rgsr_in_rgsr_in_luckily_we_research_adve_1c4614: "幸运的是，我们进行研究，来到我们这里的冒险者提供材料来使用我们的技术。"
  npc_override_rgsr_in_rgsr_in_menu_assistant_139c97: "助手：……我是。"
  npc_override_rgsr_in_rgsr_in_menu_assistant_207777: "助手：……哦………………"
  npc_override_rgsr_in_rgsr_in_menu_assistant_23a057: "助手：不，不是那个……就是这样。就是这样……"
  npc_override_rgsr_in_rgsr_in_menu_assistant_27943b: "助手：我们的负责人是个很厉害的人。我还年轻……"
  npc_override_rgsr_in_rgsr_in_menu_assistant_30ddd4: "助手：外面是不是有点吵？"
  npc_override_rgsr_in_rgsr_in_menu_assistant_44e2d5: "助手：……工资……给我……？那就不要问不必要的问题……"
  npc_override_rgsr_in_rgsr_in_menu_assistant_4bb25b: "助手：……挂着。"
  npc_override_rgsr_in_rgsr_in_menu_assistant_4d8aa3: "助手：等我们做了更多研究，有一天能搬到更大的实验室吗？"
  npc_override_rgsr_in_rgsr_in_menu_assistant_6c5fcd: "助手：别担心，没什么……"
  npc_override_rgsr_in_rgsr_in_menu_assistant_71b6b5: "助手：嘿，这个数据真的很酷。我跟着你真是太明智了。"
  npc_override_rgsr_in_rgsr_in_menu_assistant_73b3db: "助手：安静……我是……"
  npc_override_rgsr_in_rgsr_in_menu_assistant_88be4c: "助手：我希望我能搬到一个隔音好的地方。"
  npc_override_rgsr_in_rgsr_in_menu_assistant_94feca: "助手：不要碰……很危险……"
  npc_override_rgsr_in_rgsr_in_menu_assistant_af72ba: "助手：嗝……差点就出大事了……你没看到他吧？"
  npc_override_rgsr_in_rgsr_in_menu_assistant_cb776a: "助手：有任何问题去问我们的负责人。"
  npc_override_rgsr_in_rgsr_in_menu_assistant_cca6ae: "助手：当然……"
  npc_override_rgsr_in_rgsr_in_menu_assistant_f0c31d: "助手：冒险者，请小心走路。这栋楼很旧，地板有点嘎吱作响。"
  npc_override_rgsr_in_rgsr_in_menu_grid_90251e: "Grid：？"
  npc_override_rgsr_in_rgsr_in_modifiable_items_also_re_a4210c: "可改造物品也可以查看<TIPBOX>[列表]<INFO>9163</INFO></TIPBOX>。"
  npc_override_rgsr_in_rgsr_in_modifiable_items_located_4b3e46: "可改造物品位于<TIPBOX>[列表]<INFO>9166</INFO></TIPBOX>。"
  npc_override_rgsr_in_rgsr_in_modification_equipment_m_0e0800: "而且要进行改造，装备的精炼等级必须达到+9或更高。"
  npc_override_rgsr_in_rgsr_in_modification_refine_leve_3c3f9b: "要进行改造，精炼等级必须达到+7或更高。"
  npc_override_rgsr_in_rgsr_in_modified_os_weapon_encha_60fc17: "改造OS武器附魔"
  npc_override_rgsr_in_rgsr_in_mods_weapon_needs_refine_9026bb: "而且要进行改造，武器的精炼等级需要达到+9或更高。"
  npc_override_rgsr_in_rgsr_in_my_assistants_i_refine_g_b6aa92: "我和我的助手们在这个实验室里精炼宝石。需要收费。"
  npc_override_rgsr_in_rgsr_in_non_refineable_armor_onl_9e719f: "不可精炼的防具只能进行上级改造。"
  npc_override_rgsr_in_rgsr_in_non_refineable_equipment_2078a6: "^FF0000不可精炼的装备^000000也可以获得高级改造，但精炼等级不会提升。"
  npc_override_rgsr_in_rgsr_in_non_standard_armor_efe35c: "非标准防具"
  npc_override_rgsr_in_rgsr_in_non_standard_armor_there_1b3f48: "^0000FF非标准防具^000000，有下级、中级和上级三种改造方法。"
  npc_override_rgsr_in_rgsr_in_non_standard_weapon_ther_a9da0c: "^0000FF非标准武器^000000，有下级、中级和上级三种改造方法。"
  npc_override_rgsr_in_rgsr_in_now_there_these_things_5c2f38: "现在有以下这些。"
  npc_override_rgsr_in_rgsr_in_okay_176ce9: "好吗？"
  npc_override_rgsr_in_rgsr_in_os_weapons_3c1f27: "^0000FFOS武器^000000……"
  npc_override_rgsr_in_rgsr_in_please_tell_us_any_time_814109: "完成后请随时告诉我们。"
  npc_override_rgsr_in_rgsr_in_refine_level_decrease_f1d91c: "精炼等级不会降低。"
  npc_override_rgsr_in_rgsr_in_refine_level_increases_c_d2ce20: "^FF0000精炼等级提升1级^000000，但消耗更多材料。"
  npc_override_rgsr_in_rgsr_in_refine_level_reduced_con_2beb8e: "^FF0000精炼等级降低5级^000000，但消耗更少材料。"
  npc_override_rgsr_in_rgsr_in_refine_level_reduced_con_5064cd: "^FF0000精炼等级降低5级^000000，但消耗更少材料。"
  npc_override_rgsr_in_rgsr_in_refine_level_reduced_con_d2b04c: "^FF0000精炼等级降低1级^000000，但消耗更多材料。"
  npc_override_rgsr_in_rgsr_in_research_ongoing_so_know_1c4625: "研究正在进行中，所以不知道什么时候、在哪里会突然完成并提供给冒险者。"
  npc_override_rgsr_in_rgsr_in_research_ongoing_so_plea_aea503: "研究正在进行中，请期待尽快完成并添加多种新装备！"
  npc_override_rgsr_in_rgsr_in_return_b7c4b3: "返回。"
  npc_override_rgsr_in_rgsr_in_return_item_mall_57b52d: "^FF0000返回道具商城^000000？"
  npc_override_rgsr_in_rgsr_in_return_lighthalzen_5b8c21: "^FF0000返回里希塔乐镇^000000？"
  npc_override_rgsr_in_rgsr_in_s_low_budget_lab_so_8f6340: "这是一个低预算的实验室，所以总是这样。"
  npc_override_rgsr_in_rgsr_in_s_still_incomplete_c1b1c0: "还不完整。"
  npc_override_rgsr_in_rgsr_in_see_team_licht_s_perform_6781bf: "看看利希特团队的表现？"
  npc_override_rgsr_in_rgsr_in_so_when_adventurers_came_faa461: "所以当冒险者带着材料来时，他们决定提供相应的研究价值。"
  npc_override_rgsr_in_rgsr_in_thanos_weapon_intermedia_4306ae: "塔诺斯武器中级改造。"
  npc_override_rgsr_in_rgsr_in_thanos_weapon_lower_modi_8e279a: "塔诺斯武器下级改造。"
  npc_override_rgsr_in_rgsr_in_thanos_weapon_mods_lower_07a471: "^0000FF塔诺斯武器^000000的改造有下级和中级两种方法。"
  npc_override_rgsr_in_rgsr_in_thanos_weapons_45b3fd: "塔诺斯武器"
  npc_override_rgsr_in_rgsr_in_then_s_me_4c0d3f: "那就是我了~"
  npc_override_rgsr_in_rgsr_in_time_team_licht_achieved_3523d5: "而这一次，利希特团队实现了它。"
  npc_override_rgsr_in_rgsr_in_top_ore_exchange_901988: "顶级矿石兑换。"
  npc_override_rgsr_in_rgsr_in_unfortunately_our_team_h_eb6c4d: "不幸的是，我们的团队还没有做得足够好，无法走出去。"
  npc_override_rgsr_in_rgsr_in_view_exchange_list_6d4e42: "查看兑换列表"
  npc_override_rgsr_in_rgsr_in_we_need_research_a888d4: "而且我们需要研究。"
  npc_override_rgsr_in_rgsr_in_we_re_proud_lab_3f3ac2: "我们为这个实验室感到骄傲。"
  npc_override_rgsr_in_rgsr_in_we_re_still_collecting_d_dfc42b: "我们仍在收集数据并研究改造，所以我们需要大量冒险者的装备来提升我们的改造研究。"
  npc_override_rgsr_in_rgsr_in_weapon_advanced_mods_oka_aeb355: "武器高级改造？好的。"
  npc_override_rgsr_in_rgsr_in_weapon_intermediate_mods_a9d170: "武器中级改造？好的。"
  npc_override_rgsr_in_rgsr_in_weapon_lower_mods_okay_e7f436: "武器下级改造？好的。"
  npc_override_rgsr_in_rgsr_in_where_3e2e0e: "在哪里……"
  npc_override_rgsr_in_rgsr_in_which_one_you_want_modif_6a0cc7: "你想改造哪一个？"
  npc_override_rgsr_in_rgsr_in_you_done_199842: "你完成了吗？"
  npc_override_rgsr_in_rgsr_in_you_may_heard_explanatio_b4323b: "你来的时候可能已经听过解释了，但简要介绍一下这个地方，还有很长的路要走。我们正在努力将许多武器、防具、饰品等改造成不同的东西。"
  npc_override_rgsr_in_rgsr_in_you_need_see_more_our_8a9f6c: "你需要看到更多我们出色的表现！"
  npc_override_rgsr_in_rgsr_in_you_re_adventurer_so_you_a521f4: "你是冒险者，所以你知道那意味着什么？"
  npc_override_rgsr_in_rgsr_in_you_shadow_decon_b58451: "你有暗影分解吗？"
  npc_override_rgsr_in_rgsr_in_you_unhappy_your_equipme_840f13: "你对现在的装备不满意吗？"
  npc_override_rgsr_in_rgsr_in_you_welcome_any_time_you_975921: "随时欢迎你帮助我们进行研究。"