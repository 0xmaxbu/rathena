  npc_override_yuno_in01_quests_yuno_he_only_sees_me_as_90a137: "他只把我当作助手，打算窃取我们所有发现的功劳？！"
  npc_override_yuno_in01_quests_yuno_he_s_justifying_his_beha_f8bc04: "他还在用研究的借口为他的行为辩解！他是个走火入魔的疯子！"
  npc_override_yuno_in01_quests_yuno_he_s_talkative_so_if_b5d593: "他很健谈，所以如果你接近他，他会告诉你所有你需要知道的。"
  npc_override_yuno_in01_quests_yuno_he_then_ground_red_herbs_5ae7f4: "^3355FF然后他把红色药草研磨，放入石模中。^000000"
  npc_override_yuno_in01_quests_yuno_he_thinks_i_owe_him_0be059: "他认为我欠他一个道歉？！为了什么？我为什么要道歉……？！"
  npc_override_yuno_in01_quests_yuno_heh_heh_s_right_making_6a1879: "嘿嘿。没错，制作穆里尼尔指南针将是我对你的考验。"
  npc_override_yuno_in01_quests_yuno_heh_you_don_t_look_f4e529: "嘿，你看起来不怎么样。但即使你看起来很普通，你拥有传说中的物品！"
  npc_override_yuno_in01_quests_yuno_here_items_we_02b83b: "以下是我们将需要的"
  npc_override_yuno_in01_quests_yuno_hm_701c55: "嗯……？"
  npc_override_yuno_in01_quests_yuno_hm_metto_said_he_doesn_ca01d7: "嗯？梅托说他不需要我的骑乘引擎理论？！哼，真是个忘恩负义的家伙！"
  npc_override_yuno_in01_quests_yuno_hmm_9c4d28: "嗯……"
  npc_override_yuno_in01_quests_yuno_hmm_e777ce: "嗯？"
  npc_override_yuno_in01_quests_yuno_hmm_good_job_you_brought_0e62df: "嗯！干得好，你把所有物品都带来了。试着把它们插入凹槽。"
  npc_override_yuno_in01_quests_yuno_hmmm_2ac89c: "嗯……"
  npc_override_yuno_in01_quests_yuno_hmmm_i_admire_your_zeal_975ef0: "嗯……我钦佩你的热情，但没有计划你怎么能完成任何事情？"
  npc_override_yuno_in01_quests_yuno_hold_just_second_19b3a0: "稍等一下！"
  npc_override_yuno_in01_quests_yuno_honest_i_thought_about_b_f37558: "说实话，我以前想过，但这是我第一次真正尝试这个实验。来吧，我想看看会发生什么！"
  npc_override_yuno_in01_quests_yuno_hope_7b0065: "有希望！"
  npc_override_yuno_in01_quests_yuno_how_depressing_681ad1: "^3355FF太令人沮丧了！^000000"
  npc_override_yuno_in01_quests_yuno_how_goes_your_work_metto_9a64d4: "你和梅托的工作进展如何？希望计划进行顺利。很抱歉用这样的任务打扰你。"
  npc_override_yuno_in01_quests_yuno_how_happen_times_row_its_79244e: "怎么可能连续发生3次？这是真的，众神抛弃了我！我完了……完了！！！"
  npc_override_yuno_in01_quests_yuno_how_you_plan_go_about_619d37: "但你打算怎么做呢？我猜这比听起来要难……"
  npc_override_yuno_in01_quests_yuno_however_s_my_job_test_3713c8: "然而，测试你是否真正有资格拥有它是我的工作。"
  npc_override_yuno_in01_quests_yuno_however_you_must_first_p_bae9f0: "然而，你必须首先证明你有资格 wield doomed 之剑的强大力量。"
  npc_override_yuno_in01_quests_yuno_huh_piece_seems_fit_stam_ab90b9: "嗯？！那块碎片似乎和你拥有的印章很匹配。你为什么不试着把它们合在一起？"
  npc_override_yuno_in01_quests_yuno_i_am_interested_research_35af6a: "我对研究人工智能感兴趣。你知道，就像机器人。"
  npc_override_yuno_in01_quests_yuno_i_am_one_scientists_city_f0f5e7: "我是这个城市的科学家之一。我的名字是斯坦克勒。"
  npc_override_yuno_in01_quests_yuno_i_am_scientist_artificia_36979b: "我是人工智能和机器人学的科学家。"
  npc_override_yuno_in01_quests_yuno_i_am_scientist_researchi_a50a06: "我是研究各种事物的科学家。"
  npc_override_yuno_in01_quests_yuno_i_believe_he_may_take_e9e566: "我相信他可能会对你携带的印章特别感兴趣。"
  npc_override_yuno_in01_quests_yuno_i_better_get_going_check_c80748: "我最好去看看这个新东西。你还在这里做什么？我很快就要走了。"
  npc_override_yuno_in01_quests_yuno_i_d_like_you_bring_db7c6f: "我想让你把石板带到斯诺托拉，知识之岛，那是朱诺的一部分。你会在岛上的某个地方找到斯诺托拉女神的雕像。"
  npc_override_yuno_in01_quests_yuno_i_don_t_any_need_7d9aa4: "我不需要这个。"
  npc_override_yuno_in01_quests_yuno_i_don_t_know_if_ea68fc: "我不知道我们还能做什么，"
  npc_override_yuno_in01_quests_yuno_i_don_t_specific_project_2ade5e: "我目前没有具体的项目，但我最新的发明「伟大的Z」确实是纯粹天才的产物。"
  npc_override_yuno_in01_quests_yuno_i_don_t_understand_what_020a1f: "我不明白你在说什么。但有一首关于你所说的这个GM的古老朱诺歌曲……"
  npc_override_yuno_in01_quests_yuno_i_faith_you_you_should_9c81ec: "我对你有信心。你应该知道他相信命运。利用这一点对你有利。"
  npc_override_yuno_in01_quests_yuno_i_feel_much_better_knowi_50f840: "知道你会处理这个小问题，我感觉好多了……"
  npc_override_yuno_in01_quests_yuno_i_got_idea_historical_le_3f057f: "我从一个历史传说中得到了灵感。我想，如果以前有人做过，这个项目绝对是可能的。"
  npc_override_yuno_in01_quests_yuno_i_guess_if_stangckle_doe_4bac75: "我想如果斯坦克勒不想帮我，那就随他去吧。我必须继续我的研究，不管他帮不帮我。"
  npc_override_yuno_in01_quests_yuno_i_half_mind_teach_him_2628d6: "我很想教他一点关于真正的科学和智能研究的知识。"
  npc_override_yuno_in01_quests_yuno_i_hereby_grant_you_colum_d06a2a: "^3355FF我在此授予你这束光柱。朱诺三大贤者将成为你的向导^000000。"
  npc_override_yuno_in01_quests_yuno_i_hope_you_bring_me_b4192b: "我希望你能尽快把制作「穆里尼尔印章」墨水所需的材料带给我。"
  npc_override_yuno_in01_quests_yuno_i_if_my_invention_no_3c776e: "如-如果我的发明不好，那我猜我应该毁掉我的伟大的Z……*叹息*"
  npc_override_yuno_in01_quests_yuno_i_know_i_ve_disappointed_d4eb62: "我知道我让你失望了，但请忘了我吧。"
  npc_override_yuno_in01_quests_yuno_i_know_very_difficult_fe_7da17b: "我知道这是一个非常困难的壮举，但有志者事竟成。"
  npc_override_yuno_in01_quests_yuno_i_know_you_seek_more_380e2f: "我知道你想通过获得doomed之剑来寻求更强大的力量。但不是任何人都能驾驭doomed之剑的力量。"
  npc_override_yuno_in01_quests_yuno_i_m_glad_honest_trustwor_4fbea3: "我很高兴像你这样诚实、值得信赖的人有勇气告诉我。谢谢你。"
  npc_override_yuno_in01_quests_yuno_i_m_going_ask_my_e4e889: "我要去请我的同事 ^FF0000斯坦克勒^000000 帮忙。我相信他会很乐意帮助一位老朋友的。"
  npc_override_yuno_in01_quests_yuno_i_m_sure_people_juno_1ff096: "我相信朱诺的人们会非常感激。这是我们的一点心意……"
  npc_override_yuno_in01_quests_yuno_i_m_sure_you_know_1a560a: "我相信你知道我们的城市多年来一直靠研究为生。"
  npc_override_yuno_in01_quests_yuno_i_m_tired_i_think_ef08d6: "我厌倦了这一切。我想是时候放弃了。一切都结束了。请不要太失望……"
  npc_override_yuno_in01_quests_yuno_i_need_dbca4d: "我需要……"
  npc_override_yuno_in01_quests_yuno_i_need_get_ready_you_8247a2: "我需要准备一下！你先走吧，我很快就要出去了。"
  npc_override_yuno_in01_quests_yuno_i_needed_thank_you_so_ef6708: "我所需要的。非常感谢。"
  npc_override_yuno_in01_quests_yuno_i_now_51f9cc: "我现在有？！"
  npc_override_yuno_in01_quests_yuno_i_remember_watching_harm_5f4b15: "我记得看着一个无害的"
  npc_override_yuno_in01_quests_yuno_i_shall_give_you_item_5cdd91: "我将给你一个物品，作为我将来会给你任务的承诺。当树木开始落叶时，回到这个地方……"
  npc_override_yuno_in01_quests_yuno_i_shudder_think_what_hap_b5a42a: "而且我一想到如果这种力量落入邪恶之手会发生什么就不寒而栗。我准备的测试要等到炎热的夏天过去，秋天来临之后才能开始。"
  npc_override_yuno_in01_quests_yuno_i_still_5e86be: "我仍然"
  npc_override_yuno_in01_quests_yuno_i_t_believe_my_eyes_655d34: "……我简直不敢相信我的眼睛！只有少数被选中的人才能拥有穆里尼尔印章……"
  npc_override_yuno_in01_quests_yuno_i_think_s_all_i_67e11b: "我想就这些了。总之，我相信收集这些物品对你来说应该不是难事。祝你好运。"
  npc_override_yuno_in01_quests_yuno_i_think_we_need_someone_9db71b: "我想我们需要一个更严厉的人来帮忙。我觉得这对一个初学者来说有点太难了。"
  npc_override_yuno_in01_quests_yuno_i_tried_defending_myself_0ee1a6: "我试着用我信赖的剑自卫，但因为那怪物像纸一样薄，它躲过了我所有的攻击。我不得不使用魔法来摧毁它。"
  npc_override_yuno_in01_quests_yuno_i_ve_been_thinking_plan_ddcb93: "我已经考虑这个计划有一段时间了……"
  npc_override_yuno_in01_quests_yuno_i_ve_heard_s_hot_85f6f6: "我听说它来自一个炎热干燥的土地，但我做梦也没想到我能亲眼看到它！"
  npc_override_yuno_in01_quests_yuno_i_want_improve_riding_en_e01355: "我想以新的方式改进骑乘引擎，但我缺少所需的零件……"
  npc_override_yuno_in01_quests_yuno_i_want_you_bring_d3e8d0: "我想让你带来……"
  npc_override_yuno_in01_quests_yuno_i_wish_i_could_8562ef: "我希望我能"
  npc_override_yuno_in01_quests_yuno_i_wish_there_way_we_6aba31: "我希望有办法能阻止他破坏我们其他人的成果。某个勇敢、大胆的灵魂应该能做些什么……"
  npc_override_yuno_in01_quests_yuno_i_wish_you_luck_your_23526d: "祝你的旅途好运！"
  npc_override_yuno_in01_quests_yuno_i_wish_you_luck_your_3ebdc9: "祝你未来的事业好运……"
  npc_override_yuno_in01_quests_yuno_i_wonder_what_i_should_e328dc: "我想我应该研究什么？我只知道我不想再当科学家了。我受够了研究……"
  npc_override_yuno_in01_quests_yuno_if_i_had_fellow_s_7e9d44: "如果有那个家伙的帮助，这会容易得多。祈祷！向你信仰的任何神祈祷我们会成功！"
  npc_override_yuno_in01_quests_yuno_if_i_just_get_help_31997c: "如果我能得到 ^FF0000西西^000000 教授关于骑乘引擎理论的帮助，我也许能完成我的研究……"
  npc_override_yuno_in01_quests_yuno_if_i_only_study_his_2f5aa2: "如果我能研究他的超级机器人伟大的Z，我就能继续我的研究……"
  npc_override_yuno_in01_quests_yuno_if_only_we_could_use_0b0271: "如果我们能利用这一点就好了……"
  npc_override_yuno_in01_quests_yuno_if_you_ever_see_somethin_36ff60: "如果你看到什么真正惊人的东西，你就会知道那是我的杰作。"
  npc_override_yuno_in01_quests_yuno_if_you_find_any_more_46cd0d: "如果你找到更多零件，"
  npc_override_yuno_in01_quests_yuno_if_you_insert_some_items_9b5c0c: "如果你把一些物品插入凹槽，我们可能会得到更多关于doomed之剑的线索。"
  npc_override_yuno_in01_quests_yuno_if_you_long_acquire_god_953d25: "如果你渴望获得神的知识，你必须首先谦卑。否则……"
  npc_override_yuno_in01_quests_yuno_if_you_re_interested_sag_fe1f7f: "如果你对贤者职业感兴趣，为什么不去城堡周围看看呢？"
  npc_override_yuno_in01_quests_yuno_if_you_re_still_set_998b47: "如果你仍然决心获得doomed之剑，找个时间来和我谈谈。"
  npc_override_yuno_in01_quests_yuno_impersonating_gms_punish_20e01c: "「^FF3355冒充GM将被永久封禁账号^000000。」但这到底是什么意思？"
  npc_override_yuno_in01_quests_yuno_iron_ore_8fc072: "2 铁矿石……"
  npc_override_yuno_in01_quests_yuno_iron_ore_9d3f24: "^3355FF2 铁矿石^000000，"
  npc_override_yuno_in01_quests_yuno_isn_t_simple_easy_0cd7bb: "难道不简单吗？"
  npc_override_yuno_in01_quests_yuno_item_905c10: "那个物品……"
  npc_override_yuno_in01_quests_yuno_juno_you_visit_places_su_e29b84: "在朱诺，你可以参观「朱佩罗广场」、「朱诺会议厅」、「施韦切尔比尔魔法学院」或「怪物博物馆」等地方。这些地方闻名世界！"
  npc_override_yuno_in01_quests_yuno_juphero_c9b27f: "^3355FF朱佩罗^000000……"
  npc_override_yuno_in01_quests_yuno_lab_today_lab_tomorrow_e_556f20: "今天在实验室，明天在实验室！每一天都充满研究！即使耗尽我的一生，我也不会放弃，直到我创造一个新的朱诺……"
  npc_override_yuno_in01_quests_yuno_lastly_piece_egg_shell_f_b42d4f: "最后，蛋壳碎片可以在斐扬洞穴的实心蛋怪物身上找到。"
  npc_override_yuno_in01_quests_yuno_later_i_learned_monster_a9379b: "后来，我了解到那个怪物被称为 ^3355FF纸妖^000000。"
  npc_override_yuno_in01_quests_yuno_let_him_know_i_really_bac11f: "让他知道我真的不想参与他在做的事情。他甚至没有在研究我们可以公开的那种东西。"
  npc_override_yuno_in01_quests_yuno_let_me_tell_you_about_7f4729: "让我告诉你关于印章工匠 ^3355FF穆里尼尔^000000 的事。"
  npc_override_yuno_in01_quests_yuno_let_me_tell_you_everythi_c959d7: "让我告诉你我所知道的关于doomed之剑的一切。有一首关于传说中的doomed之剑的古老歌曲……"
  npc_override_yuno_in01_quests_yuno_let_s_see_4d37ed: "让我看看……"
  npc_override_yuno_in01_quests_yuno_let_s_see_967ef9: "让我看看。"
  npc_override_yuno_in01_quests_yuno_light_your_way_ffc142: "照亮你的道路……"
  npc_override_yuno_in01_quests_yuno_like_you_d60f12: "像你这样的人。"
  npc_override_yuno_in01_quests_yuno_listen_carefully_bc2a5a: "仔细听！"
  npc_override_yuno_in01_quests_yuno_look_middle_compass_care_c5bd14: "仔细看指南针的中间，找到你必须使用印章的地方。祝你的旅途好运。"
  npc_override_yuno_in01_quests_yuno_luckily_i_back_up_plan_68aa35: "幸运的是，我有一个备用计划。我确信我的朋友和同事 ^FF0000加藤^000000 会伸出援手。"
  npc_override_yuno_in01_quests_yuno_man_lived_long_ago_somew_a54e91: "这个人很久以前住在米约尼尔山的某个地方。他热衷于研究，想要重现世界上存在的每一个图案。"
  npc_override_yuno_in01_quests_yuno_may_god_5c1e1c: "愿神"
  npc_override_yuno_in01_quests_yuno_maybe_i_should_look_into_b92a94: "也许我应该考虑转职。我听说这是现在很流行的决定。"
  npc_override_yuno_in01_quests_yuno_menu_i_0ad5f8: "我想警告你。:没什么，只是打个招呼。"
  npc_override_yuno_in01_quests_yuno_menu_i_347be9: "我会帮你拿来的。:祝你好运。"
  npc_override_yuno_in01_quests_yuno_menu_i_b83695: "我是来阻止你的研究的。:我不需要任何东西。"
  npc_override_yuno_in01_quests_yuno_menu_i_f4560b: "我想阻止你犯错。:只是打个招呼。"
  npc_override_yuno_in01_quests_yuno_menu_leave_f78d12: "交给我吧。:祝你的村庄好运。"
  npc_override_yuno_in01_quests_yuno_menu_of_577931: "我当然有计划。:我想我需要一个计划。"
  npc_override_yuno_in01_quests_yuno_menu_show_f557ee: "（给他看石板）:我是个天才！:我是GM！"
  npc_override_yuno_in01_quests_yuno_menu_this_eeb7cc: "这家伙不可信！传言是真的:他真的是疯了！"
  npc_override_yuno_in01_quests_yuno_minor_expenses_involved_0734c2: "进行这项事业所需的少量费用。"
  npc_override_yuno_in01_quests_yuno_minor_expenses_undertaki_7ae199: "进行这项事业的少量费用。"
  npc_override_yuno_in01_quests_yuno_mixture_mini_furnace_e26aaa: "^FF00001 混合物^000000，^FF00005 迷你熔炉^000000，"
  npc_override_yuno_in01_quests_yuno_mjolnir_4af371: "^3355FF- mjolnir_02 . 170 193 -^000000"
  npc_override_yuno_in01_quests_yuno_money_help_pay_678615: "这笔钱将有助于支付"
  npc_override_yuno_in01_quests_yuno_money_only_buy_some_what_e4da1c: "钱只能买到我"
  npc_override_yuno_in01_quests_yuno_monsters_much_too_39e5d6: "怪物太"
  npc_override_yuno_in01_quests_yuno_most_intelligent_talente_e6ea52: "那个时代最聪明、最有才华的人住在那里，利用伊米尔心脏的碎片为他们的文明提供动力。"
  npc_override_yuno_in01_quests_yuno_mountain_mjornir_ea6aff: "^3355FF- 米约尼尔山 -^000000"
