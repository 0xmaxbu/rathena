Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_yuno_in01_THQS_ChattingNPC_ahh_welcome_fellow_treas_a6c8e8: "啊，欢迎 fellow 寻宝猎人 {0}。"
  npc_override_yuno_in01_THQS_ChattingNPC_apparently_his_name_baph_1145b0: "显然他的名字是巴风特，他已经在普隆德拉城外的森林迷宫中游荡了相当长一段时间。"
  npc_override_yuno_in01_THQS_ChattingNPC_did_you_hear_about_brave_8427e6: "你听说那个独自进入克雷斯特汉姆古城的勇敢的人了吗？他一定是疯了。"
  npc_override_yuno_in01_THQS_ChattingNPC_did_you_hear_about_goat_5cd7d9: "你听说那个在树林里游荡的羊头人了吗？"
  npc_override_yuno_in01_THQS_ChattingNPC_don_t_you_something_bett_6e80f6: "{0} 你没有更好的事情可以做吗？比如做个任务。"
  npc_override_yuno_in01_THQS_ChattingNPC_feel_free_become_member_ea7825: "如果你愿意，随时可以成为会员。"
  npc_override_yuno_in01_THQS_ChattingNPC_feel_free_drop_look_arou_914e7c: "随时欢迎进来参观"
  npc_override_yuno_in01_THQS_ChattingNPC_how_may_i_help_you_cc1359: "有什么可以帮你的吗？"
  npc_override_yuno_in01_THQS_ChattingNPC_how_you_reading_609117: "你是怎么读到这个的？？？"
  npc_override_yuno_in01_THQS_ChattingNPC_membership_applications_7cbccc: "如需申请会员，请与基根交谈"
  npc_override_yuno_in01_THQS_ChattingNPC_menu_well_3f8034: "嗯，除非你在读代码 :)"
  npc_override_yuno_in01_THQS_ChattingNPC_oh_man_i_am_so_890b1e: "天哪……我受够了"
  npc_override_yuno_in01_THQS_ChattingNPC_ok_saved_thank_you_see_f8d544: "好的，保存了。谢谢~ 再见~"
  npc_override_yuno_in01_THQS_ChattingNPC_sorry_members_only_606b5e: "抱歉，仅限会员。"
  npc_override_yuno_in01_THQS_ChattingNPC_trading_mr_smile_masks_c_198174: "用笑脸面具换垃圾。"
  npc_override_yuno_in01_THQS_ChattingNPC_treasure_hunter_guild_ho_80866f: "^FF0000[ 寻宝猎人公会总部 ]^000000"
  npc_override_yuno_in01_THQS_ChattingNPC_umm_sorry_i_m_gonna_b63646: "嗯抱歉，如果你连会员都不是，我不会浪费时间和你说！"
  npc_override_yuno_in01_THQS_ChattingNPC_up_stairs_down_hall_1c0cc7: "上楼然后沿着走廊走。"
  npc_override_yuno_in01_THQS_ChattingNPC_welcome_treasure_hunter_8ce2ec: "欢迎来到寻宝猎人公会。"
  npc_override_yuno_in01_THQS_ChattingNPC_welcome_treasure_hunter_9832cd: "欢迎来到寻宝猎人公会总部。"
  npc_override_yuno_in01_THQS_ChattingNPC_well_if_you_think_you_6365a3: "嗯，如果你觉得安全，那很好。"
  npc_override_yuno_in01_THQS_ChattingNPC_you_ask_me_one_you_6c203e: "你向我要一个，你会发现自己轻了10磅！"
  npc_override_yuno_in01_THQS_GuildNPC_alright_come_back_when_y_a09735: "好的，等你有空闲时间再来。"
  npc_override_yuno_in01_THQS_GuildNPC_also_now_you_member_feel_1408dc: "另外，既然你现在是会员了，随时可以使用我们的商店。它们都在这一层。"
  npc_override_yuno_in01_THQS_GuildNPC_congratulations_36b252: "恭喜！"
  npc_override_yuno_in01_THQS_GuildNPC_ha_ha_ha_you_already_111c10: "哈哈哈……你已经是会员了。"
  npc_override_yuno_in01_THQS_GuildNPC_hmmm_you_don_t_seem_8d6eda: "嗯，你似乎没有 ^FF000025,000z^000000 {0}。请有了再来。"
  npc_override_yuno_in01_THQS_GuildNPC_i_m_sorry_only_members_7fb453: "抱歉，只有会员才能参观我们的私人商店。"
  npc_override_yuno_in01_THQS_GuildNPC_sorry_you_must_member_tr_3bb4cd: "抱歉，如果你想接任务，你必须是寻宝猎人公会的会员。"
  npc_override_yuno_in01_THQS_GuildNPC_umm_well_all_you_need_29db2d: "嗯……好吧，这就是你需要做的全部。哈哈哈。"
  npc_override_yuno_in01_THQS_GuildNPC_we_also_another_shop_mem_7f80bf: "我们还有另一个仅限会员的商店，在那里我们使用叫做寻宝猎人代币的小金属钻石来兑换稀有物品。"
  npc_override_yuno_in01_THQS_GuildNPC_welcome_guild_treasure_h_ba9106: "欢迎来到寻宝猎人公会。"
  npc_override_yuno_in01_THQS_GuildNPC_well_if_you_t_afford_bd7a9d: "嗯，如果你连 ^FF000025,000z^000000 都付不起，你还不适合当寻宝猎人。"
  npc_override_yuno_in01_THQS_GuildNPC_well_if_you_want_treasur_f5bd49: "嗯 {0}，如果你想成为寻宝猎人，首先你必须。"
  npc_override_yuno_in01_THQS_GuildNPC_well_if_you_wish_take_8b19a3: "嗯 {0}，如果你想接任务，去那边房间找 fellow 寻宝猎人谈谈。"
  npc_override_yuno_in01_THQS_GuildNPC_what_brings_you_here_som_bb1b7d: "什么风把你吹来了？有什么事要说吗？"
  npc_override_yuno_in01_THQS_GuildNPC_yes_i_take_you_our_dea8b9: "是的 {0}，我马上就带你去我们的商店！"
  npc_override_yuno_in01_THQS_GuildNPC_you_even_access_our_excl_cbdafd: "你甚至可以进入我们专属的私人地下城。"
  npc_override_yuno_in01_THQS_GuildNPC_you_may_now_take_treasur_0e6532: "你现在可以随意接寻宝任务了。"
  npc_override_yuno_in01_THQS_GuildNPC_you_well_changed_z_basic_bbdad1: "^FF00001.^000000 你将支付 ^FF000025,000z^000000 作为基础培训和会员证明的费用。"
  npc_override_yuno_in01_bard_quest_a_511348: "啊……"
  npc_override_yuno_in01_bard_quest_about_ring_ae35d9: "是关于戒指"
  npc_override_yuno_in01_bard_quest_advance_4a235b: "提前~"
  npc_override_yuno_in01_bard_quest_adventurers_organization_590412: "这个组织的冒险者？啊，你说你在找吟游诗人？"
  npc_override_yuno_in01_bard_quest_after_song_kino_smiles_y_8f8ed5: "^3355FF歌声结束后，基诺对你微笑。你感到手腕一阵刺痛。在银新月曾经所在的位置，你看到一个微小的黑色十字。^000000"
  npc_override_yuno_in01_bard_quest_ah_971301: "啊……"
  npc_override_yuno_in01_bard_quest_ah_called_drumming_battl_e697a3: "啊，这叫做《战场鼓声》，是由伊奥洛先生创作的。是的，我相当喜欢这首歌。"
  npc_override_yuno_in01_bard_quest_ah_course_317fa6: "啊！当然！"
  npc_override_yuno_in01_bard_quest_ah_i_guess_too_much_298218: "啊，我想我对你要求太高了。抱歉。别担心，我会用其他方式弄清楚的。"
  npc_override_yuno_in01_bard_quest_ah_i_m_flattered_a2f236: "啊，我受宠若惊"
  npc_override_yuno_in01_bard_quest_ah_morocc_he_chronic_dis_f28b6f: "啊，在梦罗克？他有慢性疾病，但显然并不"
  npc_override_yuno_in01_bard_quest_ah_perhaps_yet_9e4bfa: "啊，也许还没有。"
  npc_override_yuno_in01_bard_quest_ah_privilege_meet_noble_5f2694: "啊，能见到像您这样的高贵女士是我的荣幸。请允许我报上我的名字。"
  npc_override_yuno_in01_bard_quest_ah_right_7a003b: "啊，对了。"
  npc_override_yuno_in01_bard_quest_ah_says_here_he_wanted_56d41d: "啊，这里说他想去斐扬和艾尔贝塔看看。所以他会在那些地方之一。抱歉我不能更具体。"
  npc_override_yuno_in01_bard_quest_ah_so_how_did_go_999d7e: "啊，那么进展如何？"
  npc_override_yuno_in01_bard_quest_ah_song_0c9651: "啊~那首歌……？"
  npc_override_yuno_in01_bard_quest_ah_uncle_kino_isn_t_a96419: "啊，基诺叔叔，这不是我妈妈一直唱的歌吗？请多唱几首歌！拜托~！"
  npc_override_yuno_in01_bard_quest_ah_yes_right_917e60: "啊，是的，没错。"
  npc_override_yuno_in01_bard_quest_ah_you_friend_gunther_s_1c52b4: "啊，你是冈瑟的朋友吗？哈哈，他是个非常有趣的家伙，虽然有点容易激动。让我想想，冈瑟，冈瑟……"
  npc_override_yuno_in01_bard_quest_ah_you_must_friend_high_546da6: "啊~！你一定是某位高级吟游诗人的朋友！我明白了，我明白了。你一定是敏蒂·埃伦德的朋友。"
  npc_override_yuno_in01_bard_quest_ahahaha_775053: "啊哈哈哈~"
  npc_override_yuno_in01_bard_quest_ahem_6e2c5d: "*咳咳*"
  npc_override_yuno_in01_bard_quest_ahhhhhhh_i_see_ab0c3a: "啊哈哈哈哈，我明白了。"
  npc_override_yuno_in01_bard_quest_al_de_baran_265c7a: "在艾尔帕兰"
  npc_override_yuno_in01_bard_quest_alberich_cursed_his_ring_6eb40c: "^D43D1A但阿尔贝里希诅咒了他的戒指"
  npc_override_yuno_in01_bard_quest_alberich_had_known_50124b: "阿尔贝里希知道"
  npc_override_yuno_in01_bard_quest_alberich_s_curse_625624: "阿尔贝里希的诅咒~^000000"
  npc_override_yuno_in01_bard_quest_all_makes_sense_now_afte_8a1035: "现在一切都说得通了。毕竟，他曾经是无敌单身军团的成员。他的改变可能有点刻薄，因为这首歌曾经是关于一对幸福的情侣……"
  npc_override_yuno_in01_bard_quest_alright_17187c: "好吧。"
  npc_override_yuno_in01_bard_quest_alright_listen_54a8f9: "好吧，听着。"
  npc_override_yuno_in01_bard_quest_also_i_d_like_thank_ba3b57: "另外，我要感谢你帮助埃伦德。他可能有点爱抱怨，但他是好人。"
  npc_override_yuno_in01_bard_quest_angel_truly_understands_2de962: "一个真正理解诗人内心的天使！"
  npc_override_yuno_in01_bard_quest_any_case_i_helped_father_b72556: "不管怎样，我帮父亲跑了一趟腿，他给了我一个神秘的盒子作为回报。当我打开那个盒子时，我发现了一根奇怪的羽毛。不过我不知道它是如何运作的……"
  npc_override_yuno_in01_bard_quest_anytime_my_0ef52d: "随时为我的"
  npc_override_yuno_in01_bard_quest_anyway_you_should_visit_c15064: "不管怎样，你应该去朱诺的怪物博物馆了解基蒂先生。离这里很远，但当你到达朱诺时，博物馆位于中央广场的西侧。"
  npc_override_yuno_in01_bard_quest_apple_youth_me_5cfa90: "青春之苹果与我"
  npc_override_yuno_in01_bard_quest_apples_she_keeps_1c5d22: "她保存的苹果"
  npc_override_yuno_in01_bard_quest_application_card_307509: "申请卡。^000000"
  npc_override_yuno_in01_bard_quest_argh_0fba86: "啊……！"
  npc_override_yuno_in01_bard_quest_as_i_leaned_026725: "当我倚靠它时。"
  npc_override_yuno_in01_bard_quest_as_my_trade_6f25d2: "因为那是我的职业"
  npc_override_yuno_in01_bard_quest_as_sunken_ship_i_m_c4107d: "至于那艘沉船，我不确定它是否是一艘海盗船。据说穿着海盗服装的骷髅怪物在它的残骸中游荡。"
  npc_override_yuno_in01_bard_quest_as_surely_as_water_9a5913: "就像水车一样"
  npc_override_yuno_in01_bard_quest_baby_one_only_survivor_s_59f5d1: "这个婴儿是沉船上唯一的幸存者。他在艾尔贝塔被抚养长大，尽管小时候他受到轻视。他现在过得很好，但我跑题了。"
  npc_override_yuno_in01_bard_quest_bats_dwarves_eggs_ants_e15ce6: "^228B22蝙蝠、矮人、蛋、蚂蚁！"
  npc_override_yuno_in01_bard_quest_beat_drums_hard_harder_fefd61: "^483D8B用力敲鼓，再用力！"
  npc_override_yuno_in01_bard_quest_beautiful_73c93e: "一位美丽的，"
  npc_override_yuno_in01_bard_quest_beautiful_lass_131c2f: "一位美丽的少女"
  npc_override_yuno_in01_bard_quest_because_beautiful_741af4: "因为美丽"
  npc_override_yuno_in01_bard_quest_because_dangers_monster_2db0be: "由于怪物研究的危险性，需要冒险者来为研究人员收集信息。"
  npc_override_yuno_in01_bard_quest_been_waiting_me_12ba87: "一直在等我。^000000"
  npc_override_yuno_in01_bard_quest_befall_its_wearers_544b08: "降临在其佩戴者身上。^000000"
  npc_override_yuno_in01_bard_quest_before_returned_him_845974: "在归还给他之前，"
  npc_override_yuno_in01_bard_quest_before_your_eyes_bb4b0f: "将呈现在你眼前。^000000"
  npc_override_yuno_in01_bard_quest_being_chased_bats_6eaafc: "被蝙蝠追赶"
  npc_override_yuno_in01_bard_quest_belldandy_present_7882ce: "现在的贝尔丹迪"
  npc_override_yuno_in01_bard_quest_besides_i_ve_been_thinki_8b058a: "此外，我现在把你当作朋友，可以毫无保留地坦诚交谈。而且我觉得你的笑容很美。难道我错了~？哈哈哈~"
  npc_override_yuno_in01_bard_quest_best_drinking_a860b9: "最适合饮酒？"
  npc_override_yuno_in01_bard_quest_blocked_single_leaf_7ebb28: "被一片叶子遮挡"
  npc_override_yuno_in01_bard_quest_blood_flowing_my_veins_6b0338: "我血管中流淌的血液。"
  npc_override_yuno_in01_bard_quest_blow_bugle_749907: "吹响号角"
  npc_override_yuno_in01_bard_quest_both_us_too_proud_984563: "但我们俩都太骄傲了。"
  npc_override_yuno_in01_bard_quest_both_us_too_shy_63127e: "但我们俩都太害羞了。"
  npc_override_yuno_in01_bard_quest_brand_new_place_5083bb: "一个全新的地方"
  npc_override_yuno_in01_bard_quest_brave_hero_siegfried_976e18: "^D43D1A勇敢的英雄齐格弗里德 "
  npc_override_yuno_in01_bard_quest_bravo_bravo_bc7639: "太棒了，太棒了~！"
  npc_override_yuno_in01_bard_quest_bride_if_i_may_5ce383: "新娘，如果可以的话"
  npc_override_yuno_in01_bard_quest_bring_cheerful_song_3ab053: "带来欢快的歌曲"
  npc_override_yuno_in01_bard_quest_burning_its_roots_9f5e3c: "燃烧它的根"
  npc_override_yuno_in01_bard_quest_business_me_124c80: "和我做生意？"
  npc_override_yuno_in01_bard_quest_cannot_586d6a: "这不可能。"
  npc_override_yuno_in01_bard_quest_celebrate_your_union_94ecbf: "庆祝你们的结合"
  npc_override_yuno_in01_bard_quest_certainty_cd843b: "确定无疑。"
  npc_override_yuno_in01_bard_quest_changed_song_004a03: "改变这首歌的是……"
  npc_override_yuno_in01_bard_quest_charge_as_one_out_throug_a4471c: "一起冲锋出去"
  npc_override_yuno_in01_bard_quest_cheer_up_life_goes_ce0e1e: "振作起来！生活还要继续。"
  npc_override_yuno_in01_bard_quest_clearly_invincible_save_92a0f2: "显然无敌，除了"
  npc_override_yuno_in01_bard_quest_cloud_hazy_dust_6c9700: "一片朦胧的尘埃"
  npc_override_yuno_in01_bard_quest_come_e7c136: "将会到来。"
  npc_override_yuno_in01_bard_quest_comodo_s_fireworks_3b001f: "克魔岛的烟花"
  npc_override_yuno_in01_bard_quest_contents_f5cbdf: "内容"
  npc_override_yuno_in01_bard_quest_cotton_shirt_c059fd: "棉质衬衫"
  npc_override_yuno_in01_bard_quest_cough_a672db: "^333333*咳*^000000 但这是"
  npc_override_yuno_in01_bard_quest_cough_cough_fcea21: "^333333*咳咳*^000000"
  npc_override_yuno_in01_bard_quest_cough_cough_they_all_got_efac0a: "^333333*咳咳*^000000 然后他们都聚在一起^333333*喘息*^000000 庆祝——^333333^333333*咳*^000000^000000……"
  npc_override_yuno_in01_bard_quest_could_0edcfa: "难道"
  npc_override_yuno_in01_bard_quest_could_rule_world_3838e0: "可以统治世界~^000000"
  npc_override_yuno_in01_bard_quest_could_tree_yggdrasil_pos_6649d2: "那棵树可能是世界树伊格德拉修吗？有没有可能我能在尼芙菲姆，死者的国度见到她？"
  npc_override_yuno_in01_bard_quest_courage_soldiers_march_f_c3a3d3: "鼓起勇气，士兵们，前进！"
  npc_override_yuno_in01_bard_quest_course_7f740f: "当然。"
  npc_override_yuno_in01_bard_quest_cries_9cb8b6: "*哭泣*"
  npc_override_yuno_in01_bard_quest_cry_bf62d0: "哭泣……"
  npc_override_yuno_in01_bard_quest_crying_inside_2ae627: "^D43D1A内心在哭泣，"
  npc_override_yuno_in01_bard_quest_crystal_morning_dew_4e3bd7: "水晶，晨露"
  npc_override_yuno_in01_bard_quest_cursing_its_thief_7aa8cf: "诅咒它的窃贼"
  npc_override_yuno_in01_bard_quest_d_bring_great_wealth_his_dfefa7: "那将给他的名字带来巨大的财富~^000000"
  npc_override_yuno_in01_bard_quest_death_hvergelmir_af6833: "^228B22在赫韦尔格米尔死亡。"
  npc_override_yuno_in01_bard_quest_death_may_come_aa8142: "死亡可能已经到来，"
  npc_override_yuno_in01_bard_quest_deepens_your_anguish_0809e1: "加深你的痛苦。^000000"
  npc_override_yuno_in01_bard_quest_did_you_just_say_5218dd: "你刚才说"
  npc_override_yuno_in01_bard_quest_didn_t_you_leave_already_b948fd: "你不是已经离开了吗？"
  npc_override_yuno_in01_bard_quest_discords_sometimes_962b90: "有时不和谐？"
  npc_override_yuno_in01_bard_quest_don_t_worry_about_my_7319c4: "别担心我的健康。我骨子里是个吟游诗人，我忍不住要为我的观众歌唱。"
  npc_override_yuno_in01_bard_quest_don_t_you_think_9903bc: "你不觉得……"
  npc_override_yuno_in01_bard_quest_drink_one_day_1cb44e: "某天一起喝酒~"
  npc_override_yuno_in01_bard_quest_dusk_comes_f08c99: "黄昏来临时，"
  npc_override_yuno_in01_bard_quest_earth_sun_c6ff0c: "大地，太阳"
  npc_override_yuno_in01_bard_quest_echo_distance_3e61bf: "在远处回响。"
  npc_override_yuno_in01_bard_quest_eh_d4552f: "嗯……？"
