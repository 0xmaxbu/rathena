  npc_override_yuno_in01_quests_yuno_unfortunately_they_happe_33b5b8: "不幸的是，他们滥用那强大的力量，不知何故毁灭了自己。"
  npc_override_yuno_in01_quests_yuno_until_time_comes_prepare_3a0edb: "直到那个时刻到来，做好准备。活下去。"
  npc_override_yuno_in01_quests_yuno_used_part_old_book_conta_c8872f: "它曾经是一本包含大量关于朱诺古代知识的书的一部分，但不知何故，它变成了一个怪物。难道不奇怪吗？"
  npc_override_yuno_in01_quests_yuno_using_stamp_muriniel_sta_90ece6: "^3355FF使用 ^9999FF穆里尼尔印章^3355FF 和 ^9999FF穆里尼尔印章墨水^3355FF，你将印章按入地板上的图案中。^000000"
  npc_override_yuno_in01_quests_yuno_vrrrmmmmm_20163b: "^3355FF*嗡嗡嗡嗡嗡*^000000"
  npc_override_yuno_in01_quests_yuno_vrrrmrmrmrmrmrmrmrmrmrmm_2ff1d5: "^3355FF*嗡嗡嗡嗡嗡嗡嗡嗡嗡嗡嗡嗡嗡*^000000"
  npc_override_yuno_in01_quests_yuno_wagan_said_my_idea_crazy_83d394: "^FF0000瓦根^000000 说我的想法疯狂且不可能。但我不是傻瓜，我不会被他的嘲讽所动摇！"
  npc_override_yuno_in01_quests_yuno_wait_i_need_0ffb22: "等等，我需要……"
  npc_override_yuno_in01_quests_yuno_wait_minute_17efa5: "- 等一下！！ -"
  npc_override_yuno_in01_quests_yuno_we_also_need_zeny_4047a9: "我们还需要2,000 Zeny。"
  npc_override_yuno_in01_quests_yuno_we_going_invent_doll_tal_b12992: "我们要发明一个能说话和交流的玩偶！嗯，至少，我正在尝试。"
  npc_override_yuno_in01_quests_yuno_we_grateful_your_assista_59d1a4: "我们会感激你的帮助。"
  npc_override_yuno_in01_quests_yuno_we_owe_quality_life_thos_ac0e22: "我们把这种高质量的生活归功于那些毕生致力于研究和学习的人。"
  npc_override_yuno_in01_quests_yuno_we_pray_fate_help_us_b2a5e1: "我们将不得不祈祷命运帮助我们。现在想想，梅托是命运的坚定信徒。"
  npc_override_yuno_in01_quests_yuno_well_i_think_i_ve_171695: "嗯，我想我现在吹嘘得有点太多了，我能为你做些什么？"
  npc_override_yuno_in01_quests_yuno_well_if_you_already_know_ec1e0a: "嗯，如果你已经对朱诺有所了解，你会知道朱诺由3个岛屿组成，分别代表繁荣、知识和荣誉。"
  npc_override_yuno_in01_quests_yuno_what_658c48: "什么会"
  npc_override_yuno_in01_quests_yuno_what_headache_metto_neve_ad8208: "真让人头疼~ 而且梅托从来没有给过我任何帮助。这不会容易的。"
  npc_override_yuno_in01_quests_yuno_what_i_now_time_really_d43144: "我现在能做什么……？难道我真的要放弃多年的研究了吗？"
  npc_override_yuno_in01_quests_yuno_what_i_you_my_colleague_c130d9: "我能为你做什么？我的同事梅托很快就要来了，所以我没有太多时间。所以你刚才说你需要什么？"
  npc_override_yuno_in01_quests_yuno_what_metto_said_my_great_3839d0: "什么？梅托说，我的伟大的Z不如斯坦克勒的研究？！"
  npc_override_yuno_in01_quests_yuno_what_punk_stangckle_said_8ca093: "什么？那个混蛋斯坦克勒说他不想帮我？！这可不好。这会大大减慢我的研究速度。"
  npc_override_yuno_in01_quests_yuno_what_s_04c175: "那是什么？！"
  npc_override_yuno_in01_quests_yuno_what_s_i_bored_before_6d5867: "什么？就这些？你来之前我就很无聊，但你让我更无聊了。"
  npc_override_yuno_in01_quests_yuno_what_shining_object_you_ef9134: "你携带的那个发光物体是什么？难道那不是……？"
  npc_override_yuno_in01_quests_yuno_what_you_brought_5ada3b: "你带来的东西。"
  npc_override_yuno_in01_quests_yuno_what_you_doing_then_stop_57b856: "那你在这里做什么？别浪费我的时间。"
  npc_override_yuno_in01_quests_yuno_what_you_mean_tell_me_0fd86b: "什么？你是说，我需要继续研究的强大的伟大的Z已经被摧毁了？！！"
  npc_override_yuno_in01_quests_yuno_whatever_i_really_didn_t_3d4b99: "随便吧，反正我也没有必要的零件来帮助他。我想，无论如何，他都不会有机会的。"
  npc_override_yuno_in01_quests_yuno_when_i_young_i_learned_9b872c: "当我年轻时，我了解到一个与这座雕像有关的传说中的印章墨水。但那时候，它对我来说毫无意义。印章墨水能有多传奇？"
  npc_override_yuno_in01_quests_yuno_when_you_go_east_entranc_c90299: "当你从朱诺入口向东走时，你会找到书店街。如果你有时间，请去拜访 ^3355FF伊克拉爵士^000000，他是朱诺著名的三大贤者之一。"
  npc_override_yuno_in01_quests_yuno_when_you_go_north_al_0b7cae: "当你从艾尔帕兰向北走时，你会到达「埃尔梅斯高原」，一个被熔岩覆盖的地方。"
  npc_override_yuno_in01_quests_yuno_while_studying_patterns_37bc3a: "有一天在研究图案时，他偶然发现了一个连接这个世界和另一个世界的魔法圈。"
  npc_override_yuno_in01_quests_yuno_who_me_what_kind_malicio_94be73: "谁会这样对我？什么样的恶毒之人会粉碎一个人的梦想？？"
  npc_override_yuno_in01_quests_yuno_who_you_who_you_carrying_b1799f: "你是谁……？你为谁携带这个传说中的物品？"
  npc_override_yuno_in01_quests_yuno_why_don_t_you_take_fd6afa: "你为什么不拿走它？哦，"
  npc_override_yuno_in01_quests_yuno_woon_woon_1a42eb: "^3355FF*呜呜*^000000"
  npc_override_yuno_in01_quests_yuno_write_down_if_you_need_116d1f: "如果需要的话记下来。"
  npc_override_yuno_in01_quests_yuno_yeah_872dd3: "是啊……"
  npc_override_yuno_in01_quests_yuno_yes_s_sort_difficult_son_c43748: "是的，这是一首有点难懂的歌曲，但它应该表达了古代贤者们对获得doomed之剑的感受。"
  npc_override_yuno_in01_quests_yuno_yklah_gave_me_idea_about_335cca: "伊克拉给了我一个关于你带来的穆里尼尔印章的想法，所以我们也来试试。"
  npc_override_yuno_in01_quests_yuno_yklah_pointed_pole_statu_aec5cd: "^3355FF伊克拉用手指着雕像的一根柱子，你看到上面刻着一个奇怪的图案。^000000"
  npc_override_yuno_in01_quests_yuno_you_faintly_hear_someone_85f346: "^3355FF你可以隐约听到某个地方传来某人的声音……^000000"
  npc_override_yuno_in01_quests_yuno_you_faintly_hear_someone_8d7002: "^3355FF你可以隐约听到远处某人的轻声细语。^000000"
  npc_override_yuno_in01_quests_yuno_you_got_fb48f6: "^3355FF你得到了"
  npc_override_yuno_in01_quests_yuno_you_got_piece_stamp_muri_3b0cf4: "^3355FF你得到了 ^9999FF穆里尼尔印章碎片^3355FF。^000000"
  npc_override_yuno_in01_quests_yuno_you_hear_strange_sound_c_4aefcf: "^3355FF你听到雕像内部传来奇怪的声音。^000000"
  npc_override_yuno_in01_quests_yuno_you_inserted_items_8c3c52: "^3355FF你插入了物品"
  npc_override_yuno_in01_quests_yuno_you_join_two_stamps_toge_0e44fd: "^3355FF你把两个印章合在一起。^000000"
  npc_override_yuno_in01_quests_yuno_you_look_into_compass_mu_35daf7: "^3355FF你看着穆里尼尔指南针，记下上面的刻字……^000000"
  npc_override_yuno_in01_quests_yuno_you_may_also_wish_drop_389bda: "你也可以顺便去「贤者城堡」，在那里人们可以转职为「贤者」，这是一个比较独特的职业之一。"
  npc_override_yuno_in01_quests_yuno_you_must_one_who_holds_e8074e: "你一定是拥有穆里尼尔印章的那个人……"
  npc_override_yuno_in01_quests_yuno_you_my_eternal_gratitude_95dbef: "我对你永远感激不尽。"
  npc_override_yuno_in01_quests_yuno_you_need_1d074c: "你需要……"
  npc_override_yuno_in01_quests_yuno_you_need_ruse_trick_him_ed9c5a: "你需要一个诡计来骗他退出。一些微妙的东西，比如……嗯……"
  npc_override_yuno_in01_quests_yuno_you_one_sincere_faith_wh_4d3773: "^3355FF你，怀着真诚的信仰，谦卑地接受米内塔的繁荣、斯诺托拉的知识和所罗门的荣誉……^000000"
  npc_override_yuno_in01_quests_yuno_you_received_dignity_mur_5103f0: "^3355FF你获得了 ^9999FF穆里尼尔的尊严^000000。"
  npc_override_yuno_in01_quests_yuno_you_see_yourself_indeed_b97be6: "^3355FF你亲眼看到，斯诺托拉女神雕像上的图案确实与穆里尼尔印章上的图案相匹配。^000000"
  npc_override_yuno_in01_quests_yuno_you_should_remember_my_n_38f1ee: "你应该记住我的名字，将来可能对你有用。"
  npc_override_yuno_in01_quests_yuno_you_who_future_let_me_f2e25c: "未来的你，让我自我介绍一下。"
  npc_override_yuno_in01_quests_yuno_your_information_you_obt_bf61d8: "供你参考，你可以在梦罗克沙漠获得沙漠狼之爪，蝙蝠牙齿可以在世界各地的洞穴中找到。"
