Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_t_garden_for_dun_all_dimensional_contamin_513e7e: "All dimensional contamination that occurred in this dungeon has been calmed down."
  npc_override_t_garden_for_dun_approximately_minute_dim_99b532: "In approximately 1 minute, the dimensional contamination in Area 1 will subside and a large-scale dimensional contamination will occur in Area 2."
  npc_override_t_garden_for_dun_approximately_minute_dim_9a0eec: "In approximately 1 minute, the dimensional contamination in Area 2 will subside and a large-scale dimensional contamination will occur in Area 1."
  npc_override_t_garden_for_dun_dimensional_contaminatio_3f827b: "The dimensional contamination phenomenon in this dungeon is expected to subside in about 1 minute."
  npc_override_t_garden_for_dun_large_scale_dimensional_ce52b6: "Large-scale dimensional contamination is occurring in this dungeon..."
  npc_override_t_garden_for_dun_large_scale_dimensional_de6a63: "Large-scale dimensional contamination event will occur in this dungeon in approximately 1 minute."
  npc_override_t_garden_for_dun_menu_forgotten_3bc65d: "Forgotten Memories : The dimensional contamination phenomenon in Area 2 has calmed down, and a large-scale dimensional contamination phenomenon has occurred in Area 1."
  npc_override_t_garden_for_dun_menu_forgotten_41f76d: "Forgotten Memories : The dimensional contamination phenomenon in Area 1 has calmed down, and a large-scale dimensional contamination phenomenon has occurred in Area 2."
  npc_override_t_garden_garden_of_time_above_complaints_been_pr_c695ba: "The above {0} complaints have been processed."
  npc_override_t_garden_garden_of_time_according_their_words_se_d82852: "According to their words, it seems that the cause is foreign spirits from the dimension connected to this place, so it would be better to reduce the number of those foreign things."
  npc_override_t_garden_garden_of_time_accordingly_constellatio_53f8fc: "Accordingly, the Constellation of Life imprisoned the 4 divine prisoners, who were guards, in a dimension completely separate from the dimensional criminals."
  npc_override_t_garden_garden_of_time_act_destroying_nature_ma_d34332: "^777700This is not an act of destroying nature. It is a matter of returning the disappearing elements that have been transformed into spirits back to their original positions. Will you listen to our request?"
  npc_override_t_garden_garden_of_time_additionally_each_time_y_d7e57e: "Additionally, ^ff0000each time you or an ally is damaged by a trap, the Warp Criminal's attack power will become more powerful.^000000"
  npc_override_t_garden_garden_of_time_adventurer_you_must_no_l_698dad: "^0000ffAdventurer, you must no longer allow the elements to turn into spirits. Use your power to send them back to nature."
  npc_override_t_garden_garden_of_time_adventurer_you_willing_f_381038: "^aa0000Adventurer! Are you willing to fight? We don't need a weakling!"
  npc_override_t_garden_garden_of_time_ah_ee6915: "Ah {0}."
  npc_override_t_garden_garden_of_time_all_exits_activated_acti_225123: "Not all exits are activated. Activate both the east and west exits and then come find me."
  npc_override_t_garden_garden_of_time_although_we_succeeded_se_967793: "Although we succeeded in sealing the guy who couldn't use it power properly. It might succeed in breaking the seal someday."
  npc_override_t_garden_garden_of_time_anyway_place_only_serve_4b7eb0: "Anyway, this place will only serve as a passage, and the prison itself is connected to another dimension. I will leave them. I have no intention of ruining the flower garden."
  npc_override_t_garden_garden_of_time_appears_duplicate_abilit_bf945a: "This appears to be a duplicate of an ability available to high-ranking constellations and cannot be disarmed by any means."
  npc_override_t_garden_garden_of_time_appears_no_special_compl_f4eeab: "It appears that no special complaints have been handled. If you have handled a complaint related to spirits, please come back at any time. Thank you."
  npc_override_t_garden_garden_of_time_ardor_you_forgotten_what_db4d8a: "^0000ffArdor! Have you forgotten what Leticia told you to be at least polite?"
  npc_override_t_garden_garden_of_time_based_book_left_lava_lak_27431c: "Based on this book, on the left is a lava lake where the guards who managed dimensional criminals are imprisoned. On the right is the Hall of Life where dimensional managers are imprisoned."
  npc_override_t_garden_garden_of_time_based_records_engraved_a_999219: "Based on the records engraved in the adventurer's soul"
  npc_override_t_garden_garden_of_time_because_each_time_person_d72942: "This is because each time a person passes through the portal, the dimensional criminal's recovery per second increases by a certain amount, and if this number overlaps, he or she can recover health in an instant."
  npc_override_t_garden_garden_of_time_cancel_77dfd2: "Cancel"
  npc_override_t_garden_garden_of_time_circle_life_accessories_ac0ca1: "Circle of Life Accessories"
  npc_override_t_garden_garden_of_time_completed_compensation_p_4f1cf8: "^0000ff{0} Completed^000000 - Compensation paid."
  npc_override_t_garden_garden_of_time_conversation_between_spi_5efe61: "Conversation between spirits and humans. Seamless communication. We will listen to the voices of our customers. This is Kiosk 5000, a comprehensive information terminal that processes spirit complaints and compensation at the same time. How can we help you?"
  npc_override_t_garden_garden_of_time_course_eavesdropping_bit_5e9452: "^0000ffOf course, eavesdropping is a bit like that.^000000"
  npc_override_t_garden_garden_of_time_currently_imprisoned_gua_8ab1b9: "The currently imprisoned guards are a dangerous force potentially sympathizing with the escape of dimensional criminals. Periodically suppress them by force and confiscate the prison keys they are managing/producing."
  npc_override_t_garden_garden_of_time_danger_trap_varies_depen_2ad794: "The danger of this trap varies depending on the level of the barrier, and its destructive power becomes more powerful the further away you are from the center of the prison."
  npc_override_t_garden_garden_of_time_diluvio_right_good_show_5b46d2: "^00cc00Diluvio is right. It would be good to show some courtesy to the humans who come to help us."
  npc_override_t_garden_garden_of_time_dimensional_criminal_use_9ad1af: "The dimensional criminal used his power to cause time-moving traps to appear in his space to prevent outside intruders."
  npc_override_t_garden_garden_of_time_dimensional_criminals_ab_c25365: "Dimensional criminals have the ability to regenerate health in real time. Therefore, normal correction may not be possible unless a blow exceeds this recovery ability."
  npc_override_t_garden_garden_of_time_dimensional_criminals_pe_c2d00d: "Dimensional criminals can periodically establish a sanctuary around themselves that makes them immune to physical and magical attacks."
  npc_override_t_garden_garden_of_time_divine_beast_s_cloak_spr_a282fa: "Divine Beast's Cloak - Spring"
  npc_override_t_garden_garden_of_time_don_t_just_stare_blankly_9f3b51: "Don't just stare blankly, extend your hand."
  npc_override_t_garden_garden_of_time_doppelganger_ba76eb: "^bb0000Doppelganger.^000000"
  npc_override_t_garden_garden_of_time_due_series_events_only_c_031a1b: "Due to this series of events, not only the Constellation of Life but also the 4 Divine Beasts are vacant in the 326th dimension. Therefore, the user must manage this prison with two main goals."
  npc_override_t_garden_garden_of_time_effect_precursor_dimensi_17abed: "This effect is a precursor to the dimensional offender's widespread and powerful influence."
  npc_override_t_garden_garden_of_time_elements_earth_must_rema_cd448b: "The elements of the earth must remain in their elemental state. If they continue to become elementals, eventually there will not be a single ounce of dirt left. Will you help me?"
  npc_override_t_garden_garden_of_time_even_betelgeuse_who_came_a44db4: "Even Betelgeuse, who came to this continent a long time ago, already has a decent home of his own! I think it's unreasonable for Oscar to wander around like this without a place to live!"
  npc_override_t_garden_garden_of_time_even_if_wanted_take_over_24f92c: "Even if it wanted to take over your and it friends' bodies, it wouldn't be able to exert that kind of power."
  npc_override_t_garden_garden_of_time_even_if_you_two_more_652feb: "Even if you have two or more blessings, the record engraved in the adventurer's ^ff0000soul takes priority^000000, so we recommend that you dispose of any excess blessings at the store."
  npc_override_t_garden_garden_of_time_even_now_accumulating_va_430582: "Even now, it is accumulating vast amounts of life energy, which could pose a serious danger to the dimensional world."
  npc_override_t_garden_garden_of_time_everything_you_want_here_443e49: "Everything you want is here. What deal do you want?"
  npc_override_t_garden_garden_of_time_exit_menu_2ed324: "Exit menu"
  npc_override_t_garden_garden_of_time_first_fd1cd9: "-First-"
  npc_override_t_garden_garden_of_time_first_you_enter_lava_lak_8887a3: "First, you can enter the lava lake where the guards are imprisoned once a day. There is no additional seal, so as long as you stick to the once a day time, there will be no particular restrictions on entry."
  npc_override_t_garden_garden_of_time_flame_become_spirit_move_577975: "Flame that has become a spirit and moves and thinks on its own is dangerous in itself. Don't you think it's too dangerous to just sit there like this? I don't ask you any favors. Follow my instructions."
  npc_override_t_garden_garden_of_time_flow_time_inside_mansion_41d450: "The flow of time inside that mansion is different from our current time. So, we don't know when Oscar will fully restore the mansion."
  npc_override_t_garden_garden_of_time_flower_garden_north_gard_40b08c: "The flower garden to the north of the garden is unstable and connected to another dimension. I'll do some work there."
  npc_override_t_garden_garden_of_time_focus_your_mind_placing_1d5d71: "Focus your mind by placing your thumb on the bottom right of the unfolded spirit stone and the rest of your fingers on top. "
  npc_override_t_garden_garden_of_time_forgotten_memories_zone_2a8658: "Forgotten memories, Zone 1, 6 o'clock"
  npc_override_t_garden_garden_of_time_forgotten_memories_zone_bfdde6: "Forgotten Memories, Zone 2, 7 o'clock"
  npc_override_t_garden_garden_of_time_goodbye_619bc3: "Goodbye."
  npc_override_t_garden_garden_of_time_guards_originally_meant_2f89f9: "The guards were originally meant to monitor dimensional criminals, but at some point, they showed an intention to protect the dimensional criminals."
  npc_override_t_garden_garden_of_time_guidelines_correct_priso_ded46c: "Guidelines for correct prison management. What would you like to see?"
  npc_override_t_garden_garden_of_time_hall_life_where_dimensio_22f1af: "The Hall of Life where dimensional criminals are imprisoned"
  npc_override_t_garden_garden_of_time_homeless_am_i_bad_you_d663eb: "Homeless..., am I not that bad? Are you looking at me like that, Leticia?"
  npc_override_t_garden_garden_of_time_however_advantageous_sim_15299a: "However, it is not advantageous to simply raise the level of the barrier."
  npc_override_t_garden_garden_of_time_however_after_being_swep_5f1946: "^aa00aaHowever, after being swept away by a strange dimensional storm, the elements of the world connected to this garden began to run wild, and eventually began to turn into spirits."
  npc_override_t_garden_garden_of_time_however_forget_recovery_8ace38: "However, do not forget that ^ff0000recovery also increases in proportion to the number of people who use the portal^000000 to purify the Underworld."
  npc_override_t_garden_garden_of_time_however_if_you_apply_app_5fb167: "However, if you apply appropriate corrections to the dimensional criminal and make him submit, you will either receive appropriate ^ff0000compensation,^000000, or delay the reward and get a chance to unlock the next ^ff0000barrier ^000000level."
  npc_override_t_garden_garden_of_time_however_if_you_pull_dime_5ea25b: "However, if you pull a dimensional criminal who has declared sanctuary out of the sanctuary, the sanctuary will be canceled. If the dimensional criminal uses the sanctuary to go on a rampage, pull him out of the sanctuary."
  npc_override_t_garden_garden_of_time_however_if_you_receive_r_b0d1d2: "However, if you receive the reward once, you will not be able to receive the reward again in the Hall of Life for ^ff0000one week.^000000 Of course, even in that case, entry is free."
  npc_override_t_garden_garden_of_time_however_portal_underworl_fd2f52: "However, the portal to the underworld should not be used by too many people."
  npc_override_t_garden_garden_of_time_huh_73fef0: "Huh?"
  npc_override_t_garden_garden_of_time_i_2bf88e: "I will."
  npc_override_t_garden_garden_of_time_i_agree_rigel_i_think_c88a25: "I agree, Rigel! I think the unstable area near the center of the garden can be stabilized by imposing restrictions in the form of a dungeon. I'll take care of that!"
  npc_override_t_garden_garden_of_time_i_am_unable_communicate_f0ca77: "I am unable to communicate with spirits because I have too many items or weights."
  npc_override_t_garden_garden_of_time_i_cannot_communicate_bar_4eb777: "I cannot communicate with the barrier because I have too many types or weights of objects."
  npc_override_t_garden_garden_of_time_i_cannot_communicate_bar_efc7ca: "I cannot communicate with the barrier because I have too many types or weights of items."
  npc_override_t_garden_garden_of_time_i_don_t_know_what_861eb2: "I don't know what the error is, but the world recognizes it as another constellation of life. If a constellation attacks the same constellation, it violates the rules of the dimension and immediately loses it powers."
  npc_override_t_garden_garden_of_time_i_guess_s_way_mansion_86dbdc: "I guess that's the way it is. This mansion is a space where multiple timelines are intricately intertwined, so I don't think anyone else can touch it."
  npc_override_t_garden_garden_of_time_i_heard_spirits_original_24d5fc: "And I heard that the spirits that originally guarded this space were driven out by their compatriots who became fierce for some reason."
  npc_override_t_garden_garden_of_time_i_help_you_next_time_6acdaa: "I will help you next time."
  npc_override_t_garden_garden_of_time_i_ll_take_care_adventure_d8883b: "I'll take care of the adventurer here, so let's leave it at that and go in."
  npc_override_t_garden_garden_of_time_i_look_forward_seeing_yo_c98e2d: "I look forward to seeing you and your colleagues do a great job here."
  npc_override_t_garden_garden_of_time_i_m_fine_please_tell_9515b2: "I'm fine, please tell me what to do"
  npc_override_t_garden_garden_of_time_i_m_glad_there_someone_c7c1de: "I'm glad there is someone who can solve this problem. Please solve my request well."
  npc_override_t_garden_garden_of_time_i_m_going_need_your_26015f: "I'm going to need your help here. I need to gather energy flows to the east and west to create a gate, so let's move."
  npc_override_t_garden_garden_of_time_i_m_sorry_ask_you_adbf9c: "I'm sorry to ask you this kind of favor again today. Thank you very much."
  npc_override_t_garden_garden_of_time_i_open_storage_number_th_4d3f99: "I will open storage number {0}. Thank you for using it."
  npc_override_t_garden_garden_of_time_i_recommend_you_pay_undu_89235e: "I recommend that you do not pay undue attention to barriers that you cannot handle and that you strive for stable correction."
  npc_override_t_garden_garden_of_time_i_t_stand_see_healthy_b483a2: "I can't stand to see healthy elements becoming corrupted as I can't turn them into spirits. I need your power to prevent them from falling into anger and becoming polluted."
  npc_override_t_garden_garden_of_time_i_think_i_leticia_could_fccf06: "I think I and Leticia could find an appropriate use for the unstable dimensional passages. What do you think, Leticia?"
  npc_override_t_garden_garden_of_time_i_think_i_ve_heard_31c666: "I think I've heard this before"
  npc_override_t_garden_garden_of_time_i_think_s_finished_let_5c3edb: "I think it's finished. Let's come to the central square for a moment and talk about the next thing."
  npc_override_t_garden_garden_of_time_i_ve_worked_you_many_8b53b4: "{0} I've worked with you many times, so I'd like to ask you to come with me, but I don't think I can do that this time."
  npc_override_t_garden_garden_of_time_if_any_chance_takes_over_59fdb1: "And, if by any chance it takes over my existence, then it will be in an irreversible situation."
  npc_override_t_garden_garden_of_time_if_elements_continue_bec_3f19ab: "^777700If the elements continue to become elementals, eventually the material world that makes up this world will collapse. That must be prevented."
  npc_override_t_garden_garden_of_time_if_prison_full_traps_you_565e3d: "If the prison is full of traps, you can reset the traps using the other side of the world. Please refer to the information on the other side of the world for this part."
  npc_override_t_garden_garden_of_time_if_too_many_portal_users_fe2f85: "If too many portal users occur, normal correction may fail due to a rapid increase in resilience."
  npc_override_t_garden_garden_of_time_if_you_fail_correct_dime_4842e5: "If you fail to correct a dimensional criminal, the level of barrier you can handle will be lowered by 1 level the next time you enter prison.^000000"
  npc_override_t_garden_garden_of_time_if_you_see_any_unusual_227038: "If you see any unusual effects on the ground while correcting dimensional criminals, quickly leave the area."
  npc_override_t_garden_garden_of_time_if_you_want_higher_rewar_ec8ff3: "If you want a higher reward level, remember that it is advantageous to level up quickly by clearing barriers rather than selecting rewards."
  npc_override_t_garden_garden_of_time_influence_dimensional_cr_983318: "The influence of a dimensional criminal can result in confinement effects, serious lacerations and frostbite, and sometimes even death."
  npc_override_t_garden_garden_of_time_information_about_prison_108d9c: "This is information about prisoners held in prison. Do you need any additional information?"
  npc_override_t_garden_garden_of_time_let_s_place_sacred_items_a0e77c: "^aa0000Let's place the sacred items prepared by the constellations across from us. In human language, it's called a vending machine.^000000"
  npc_override_t_garden_garden_of_time_let_s_start_looking_seal_5556fa: "Let's start by looking for the sealing spirit stone I installed a little further north."
  npc_override_t_garden_garden_of_time_leticia_begging_you_stop_5c4c25: "Leticia is begging you to stop acting like a homeless person, buy a decent house, and live like a constellation. It's not good to keep ignoring what others say."
  npc_override_t_garden_garden_of_time_level_power_dimensional_bd813b: "The level of power that dimensional criminals exert must be measured and recorded."
  npc_override_t_garden_garden_of_time_list_requests_you_thank_dd285f: "This is a list of requests for you. Thank you very much."
  npc_override_t_garden_garden_of_time_looks_like_s_registered_ac90d3: "It looks like it's registered well. Now you've completed the basic preparations to recognize the prison and enter and exit it. For any further questions, please refer to this guide."
  npc_override_t_garden_garden_of_time_main_prisoner_dimensiona_b008d9: "The main prisoner, a dimensional criminal, is a doppelganger-type monster who stole the appearance and abilities of the 326th dimension's constellation of life. Currently, its level of danger has never been measured, so it is not recorded."
  npc_override_t_garden_garden_of_time_may_lesser_importance_ne_491511: "It may be of lesser importance, but it is necessary to visit the jailers' prisons periodically to weaken their power."
  npc_override_t_garden_garden_of_time_maybe_if_your_life_threa_83be99: "Maybe if your life is threatened."
  npc_override_t_garden_garden_of_time_means_20c955: "That means..."
  npc_override_t_garden_garden_of_time_means_even_if_you_only_32f40d: "This means that even if you only spend a few days inside the mansion, years or even decades may pass by in the outside world. It will probably be difficult for a human like {0} to endure it"
  npc_override_t_garden_garden_of_time_menu_one_3f43c2: "One thing is certain: the dimensional criminals have hijacked the bodies and powers of the dimensional life constellations."
  npc_override_t_garden_garden_of_time_moment_all_illusions_oth_8f5dca: "The moment all the illusions of the other world are defeated, the dimensional criminals of the original world will receive a strong blow and fall into a groggy state for a certain period of time."
  npc_override_t_garden_garden_of_time_moment_inner_world_purif_212d35: "The moment the inner world is purified, the recovery rate decreases sharply during the time the dimensional criminal is in a groggy state."
  npc_override_t_garden_garden_of_time_moment_traps_within_pris_1be054: "At this moment, traps within the prison are reset, all attack power built up by the warp criminal is returned to its original state, and all defenses of the warp criminal are drastically lowered for a brief period of time."
  npc_override_t_garden_garden_of_time_msg_4b50f4: "------------"
  npc_override_t_garden_garden_of_time_my_goal_return_water_spi_d42a70: "My goal is to return the water spirits, who are gradually materializing within forgotten memories, back to their elements. I would like your help."
  npc_override_t_garden_garden_of_time_no_b8b9f1: "No."
  npc_override_t_garden_garden_of_time_now_then_let_s_open_696daf: "Now then, let's open the other one as well. Move to the site opposite this gate."
  npc_override_t_garden_garden_of_time_now_we_build_prison_pris_77e926: "From now on, we will build a prison. A prison to hold very dangerous and unstable prisoners."
  npc_override_t_garden_garden_of_time_oh_adventurer_leticia_se_3f7733: "^777700Oh, the adventurer Leticia sent has finally arrived."
  npc_override_t_garden_garden_of_time_oh_don_t_worry_about_eab836: "Oh, don't worry about that. I'll make sure you're isolated from the real world."
  npc_override_t_garden_garden_of_time_oh_you_going_now_06879b: "Oh, are you going in now?"
  npc_override_t_garden_garden_of_time_oh_you_mean_i_feel_5840b4: "Oh, you mean 'that'? I feel it very well."
  npc_override_t_garden_garden_of_time_okay_i_ll_finish_work_21cdb4: "Okay, I'll finish the work and come out as soon as possible. See you then."
  npc_override_t_garden_garden_of_time_okay_i_understand_your_i_a27e1d: "Okay, I understand your intentions. I still have to think about how to handle this in the right way..."
  npc_override_t_garden_garden_of_time_okay_s_enough_open_passa_dc9f5d: "Okay, that's enough. It will open a passage to the place where the unholy energy is on the time seal seen there."
  npc_override_t_garden_garden_of_time_okay_then_please_take_ca_2a0eeb: "Okay. Then, please take care of me. Oh, and {0}, if you have the time, I would appreciate it if you could help Leticia. She's so lazy..."
  npc_override_t_garden_garden_of_time_only_accessible_while_ho_0bdf02: "Only accessible while holding {0}."
  npc_override_t_garden_garden_of_time_oscar_appears_talking_so_08a680: "^0000ffOscar appears to be talking to someone.^000000"
  npc_override_t_garden_garden_of_time_oscar_you_ve_been_wander_3abdf6: "Oscar, you've been wandering around without a proper place to live. No matter how good a person you are, you shouldn't just volunteer like this!"
  npc_override_t_garden_garden_of_time_perhaps_due_unstable_ene_2fbb70: "Perhaps due to the unstable energy flow, the attributes of nature were twisted and transformed and the spirits became fierce. They were told to rest for a while in the northwest of the garden."
  npc_override_t_garden_garden_of_time_place_specializes_equipm_d2cb6b: "This place specializes in equipment. What kind of deal do you want?"
  npc_override_t_garden_garden_of_time_please_check_again_wheth_7143cd: "Please check again whether it is registered in ^ff0000equipment set setting^000000 and whether it is already installed."
  npc_override_t_garden_garden_of_time_please_organize_party_le_767aeb: "^0000ffPlease organize a party of at least one person and proceed.^000000"
  npc_override_t_garden_garden_of_time_power_dimensional_crimin_fea4fc: "The power of dimensional criminals is sealed by a barrier tightly bound by Rigel, the constellation of life."
  npc_override_t_garden_garden_of_time_prison_divided_into_area_95f099: "The prison is divided into an area where the guards are confined and an area where the dimension criminals are confined."
  npc_override_t_garden_garden_of_time_prisoner_swallowed_me_ri_6ddb90: "This prisoner swallowed me, Rigel, from the 326th dimension and became a being that called itself the Constellation of Life."
  npc_override_t_garden_garden_of_time_put_your_hand_guide_c23fdf: "Put your hand on the guide."
  npc_override_t_garden_garden_of_time_quit_step_away_7e079b: "Quit and step away"
  npc_override_t_garden_garden_of_time_reach_out_hand_watch_sea_bdbede: "Reach out hand and watch the seal"
  npc_override_t_garden_garden_of_time_relatedly_when_entering_8cf9cf: "Relatedly, when entering a prison, you can equip yourself with the protection touched by the constellation and measure and record the level of risk based on the level of the barrier attached to it."
  npc_override_t_garden_garden_of_time_remember_exception_one_h_510748: "Remember that, with the exception of the one-hour dungeon time limit, you can enter as many times as you want as long as you have the key."
  npc_override_t_garden_garden_of_time_remember_order_kill_illu_583dbf: "Remember that in order to kill the illusions of the other world, it is advisable to have a small number of party members with strong attack power and mobility."
  npc_override_t_garden_garden_of_time_reward_helping_us_conste_206048: "^aa0000The reward for helping us and the constellations' work here will be received through that sacred item.^000000"
  npc_override_t_garden_garden_of_time_s_all_i_ask_you_12adfc: "That's all I ask of you today. Take your time and take a look."
  npc_override_t_garden_garden_of_time_s_important_oscar_you_fe_a69bc4: "That's not important, Oscar. Do you feel anything about the central mansion?"
  npc_override_t_garden_garden_of_time_s_long_story_prison_info_3c2213: "It's a long story. Prison information will be posted separately at the prison entrance, so check it regularly."
  npc_override_t_garden_garden_of_time_s_me_063e71: "It's me."
  npc_override_t_garden_garden_of_time_s_right_ddafea: "That's right!"
  npc_override_t_garden_garden_of_time_s_simpler_than_you_think_5e9bd6: "It's simpler than you think, isn't it?. With this, we'll be able to stop strange guys from flooding the garden until Oscar completes the mansion, so it's a relief."
  npc_override_t_garden_garden_of_time_s_something_you_you_d_763725: "It's something you have to do. You'd better do it as quickly as possible."
  npc_override_t_garden_garden_of_time_s_worst_kind_being_doesn_8e213a: "It's the worst kind of being that doesn't just mimic abilities or appearances, but devours the soul of the target being and turns into that being itself."
  npc_override_t_garden_garden_of_time_second_fd0461: "-Second-"
  npc_override_t_garden_garden_of_time_seems_like_s_issue_invol_eb5415: "It seems like it's an issue involving ^0000fftime^000000, so I don't think Leticia or me can do anything about it. Oscar, you can do it, right?"
  npc_override_t_garden_garden_of_time_seems_like_speed_time_in_20c5c5: "It seems like the speed of time inside this mansion is very different from the outside world. My guess is about... 1/1000? Maybe even more."
  npc_override_t_garden_garden_of_time_seems_like_they_focusing_9d6a91: "^0000ffIt seems like they are focusing on the story of Oscar and Leticia.^000007"
  npc_override_t_garden_garden_of_time_seems_there_too_many_typ_672655: "^ff0000It seems that there are too many types and weights of items. Please organize your inventory.^000000"
  npc_override_t_garden_garden_of_time_she_paying_attention_you_970e03: "^0000ffShe is not paying attention to you because she is explaining something to Oscar.^000007"
  npc_override_t_garden_garden_of_time_since_you_ve_already_hel_19f8c3: "And since you've already helped me, from now on you'll have to work with me every day. It's no big deal. Reduce the number of unholy things in the dungeon under the passage created here."
  npc_override_t_garden_garden_of_time_so_your_claim_i_happened_32b717: "So, is your claim that I happened to find a crack near Lutie and came in and found this garden?"
  npc_override_t_garden_garden_of_time_stop_viewing_9d8d1c: "Stop viewing"
  npc_override_t_garden_garden_of_time_take_your_eyes_off_groun_34e00c: "Do not take your eyes off the ground even for a moment and be alert in all directions."
  npc_override_t_garden_garden_of_time_then_let_s_go_some_c348cd: "Then, let's go do some garden maintenance first. There's an adventurer who's eavesdropping nearby, so it would be perfect if we go together!"
  npc_override_t_garden_garden_of_time_there_any_possibility_pr_fd58f2: "Is there any possibility that the prisoner will take over our bodies?"
  npc_override_t_garden_garden_of_time_there_anything_i_help_ma_27a50c: "Is there anything I can do to help in the mansion?"
  npc_override_t_garden_garden_of_time_there_high_probability_q_519420: "There is a high probability that quite a long time will pass by the time the interior of the mansion is cleaned up. It must end quickly..."
  npc_override_t_garden_garden_of_time_there_still_uncompleted_d0a4b2: "^0000ffThere are still uncompleted quests. You cannot receive additional requests or reset until all requests are completed at the {0}.^000000"
  npc_override_t_garden_garden_of_time_therefore_when_you_enter_c87336: "Therefore, when you enter to manage the prison, the first dimensional criminal you encounter is the barrier adjusted so that only the lowest level of strength is exerted."
  npc_override_t_garden_garden_of_time_they_re_probably_just_wa_a06440: "They're probably just waiting for you to arrive. It's up to you whether you help them or not, but it wouldn't be a loss to help the spirits. I recommend going at least once."
  npc_override_t_garden_garden_of_time_third_3222b4: "-Third-"
  npc_override_t_garden_garden_of_time_today_s_request_already_1940a0: "^ff0000Today's request has already been received. You can't receive any more.^000000"
  npc_override_t_garden_garden_of_time_tool_dealer_85a06c: "Tool Dealer"
  npc_override_t_garden_garden_of_time_true_i_m_really_sorry_12a9a9: "This is true. I'm really sorry for unintentionally getting you involved in our work."
  npc_override_t_garden_garden_of_time_truly_one_funniest_jokes_33fdb2: "This is truly one of the funniest jokes I've heard in hundreds of years."
  npc_override_t_garden_garden_of_time_ugh_s_my_responsibility_eadfb4: "Ugh... that's my responsibility, so it's right for me to go regardless of whether it works or not."
  npc_override_t_garden_garden_of_time_unauthenticated_user_a744e6: "^ff0000Unauthenticated user.^000000"
  npc_override_t_garden_garden_of_time_underworld_there_imperfe_84b3e2: "In the underworld, there are imperfect illusions of dimensional criminals, and those illusions are imperfectly connected to the dimensional criminals."
  npc_override_t_garden_garden_of_time_use_storage_please_inser_64b58e: "To use the Storage, please insert 100 zeny."
  npc_override_t_garden_garden_of_time_very_appropriate_far_awa_4de961: "It would be very appropriate to be this far away from the mansion without disturbing Oscar, right?"
  npc_override_t_garden_garden_of_time_we_ancient_spirits_world_0e73d5: "^aa00aaWe are ancient spirits from a world connected to this garden. It is an instinct engraved in our spirit bodies to help each natural element remain harmonious."
  npc_override_t_garden_garden_of_time_we_automatically_process_2d39e4: "We will automatically process all completed spirit requests that you have."
  npc_override_t_garden_garden_of_time_we_carefully_enchant_equ_06e99c: "We carefully enchant the equipment obtained from the Lake of Fire. Is there a menu you would like?"
  npc_override_t_garden_garden_of_time_we_created_prison_access_957718: "We have created a prison access list a little further north. Only those registered on the list can enter the prison, so let's go and register first."
  npc_override_t_garden_garden_of_time_we_gathered_all_spirits_797a07: "We gathered all the spirits that were asking for help around here and concentrated them in the northwest of the central square. They are really noisy."
  npc_override_t_garden_garden_of_time_we_put_great_effort_into_0d26a0: "We put great effort into enchanting circulating equipment. Is there a menu you would like?"
  npc_override_t_garden_garden_of_time_we_reissued_protection_e_8d5ee4: "We have reissued a protection engraved with a barrier ^0000fflevel 1^000000."
  npc_override_t_garden_garden_of_time_we_t_just_bite_our_b3ec46: "But we can't just bite our fingers. Moreover, from what the spirits who came here say, it seems like there is something else we need to do."
  npc_override_t_garden_garden_of_time_well_i_don_t_agree_5a8d8f: "Well, I don't agree with that opinion at all, but I'll ease your worries. It's surrounded by layers of seals I've placed on it."
  npc_override_t_garden_garden_of_time_well_i_m_sure_oscar_d0b3a2: "Well, I'm sure Oscar will take care of it... Don't just stand there and help out with Rigel and my work."
  npc_override_t_garden_garden_of_time_well_s_right_waste_destr_d11f5c: "Well... that's right, it would be a waste to destroy it."
  npc_override_t_garden_garden_of_time_well_you_might_think_s_4904d9: "Well, you might think it's just a doppelganger and a fuss, but the one you'll be imprisoning here is on a different level than the doppelganger you think of."
  npc_override_t_garden_garden_of_time_what_i_ve_looked_there_fe51fb: "From what I've looked at, there are a few unstable dimensional passages, but they don't seem to be very dangerous. Leticia has a point."
  npc_override_t_garden_garden_of_time_what_mean_a57d36: "What does that mean?"
  npc_override_t_garden_garden_of_time_what_you_going_here_f47f0e: "What are you going to do here?"
  npc_override_t_garden_garden_of_time_when_i_ran_save_myself_4b0f65: "When I ran to save myself there, it was already too late. I knew as soon as I saw the unconscious person who looked exactly like me. This wasn't me."
  npc_override_t_garden_garden_of_time_when_number_traps_prison_ca0251: "When the number of traps in the prison exceeds a certain number, a portal to the other world will be created on the north side of the prison."
  npc_override_t_garden_garden_of_time_who_you_going_put_prison_7a4014: "Who are you going to put in that prison?"
  npc_override_t_garden_garden_of_time_whose_image_take_now_d65524: "Whose image do it take on now?"
  npc_override_t_garden_garden_of_time_why_did_you_leticia_8aaa0f: "Why did you do that, Leticia?"
  npc_override_t_garden_garden_of_time_why_doesn_t_place_look_5e26f9: "Why! Doesn't this place look really useful? A nice garden and an unidentifiable mansion! This is perfect, Oscar!"
  npc_override_t_garden_garden_of_time_why_don_t_you_take_89bc32: "Why don't you take down the criminal yourself?"
  npc_override_t_garden_garden_of_time_why_you_muttering_you_an_60ece7: "Why are you muttering? Do you have any complaints?"
  npc_override_t_garden_garden_of_time_wind_means_source_life_a_d2d916: "Wind means the source of life, the atmosphere. If the elements of wind continue to turn into spirits, all living things in this dimension will eventually die. I need someone's help."
  npc_override_t_garden_garden_of_time_wow_i_didn_t_know_28e396: "Wow, I didn't know these two would get along so well. It's not like they planned it in advance or anything, right?"
  npc_override_t_garden_garden_of_time_yes_i_go_leticia_i_f962dd: "Yes, I have to go in. Leticia, I hope you don't cause any trouble and take good care of the garden until I come out after cleaning up the mansion."
  npc_override_t_garden_garden_of_time_yes_me_too_a092a8: "Yes? Me too?"
  npc_override_t_garden_garden_of_time_you_didn_t_destroy_becau_4a5f60: "You didn't destroy it because it was a waste~ and what?"
  npc_override_t_garden_garden_of_time_you_don_t_understand_let_392597: "You don't understand, Leticia. You found a crack, but I'm asking why you called me here without extinguishing it."
  npc_override_t_garden_garden_of_time_you_ever_abandon_immorta_36b3bf: "Would you ever abandon the immortal body you worked so hard to occupy and return to your mortal body?"
  npc_override_t_garden_garden_of_time_you_going_into_mansion_4c65ee: "Are you going into the mansion?"
  npc_override_t_garden_garden_of_time_you_like_go_back_garden_09783e: "Would you like to go back to the Garden of Time?"
  npc_override_t_garden_garden_of_time_you_must_attack_dimensio_d033db: "You must attack dimension criminals periodically to prevent them from hoarding power."
  npc_override_t_garden_garden_of_time_you_need_any_additional_1a30db: "Do you need any additional information?"
  npc_override_t_garden_garden_of_time_you_protection_issued_yo_1b3cff: "You have the protection issued in your inventory. Re-issuing it is only possible if you do not have the constellation's protection in your inventory."
  npc_override_t_garden_garden_of_time_you_re_good_communicator_6d5cea: "^aa0000You're a good communicator! Okay then, I'll tell you what to do every day!^000000"
  npc_override_t_garden_garden_of_time_you_re_here_117a35: "You're here {0}."
  npc_override_t_garden_garden_of_time_you_re_making_prison_flo_6cd97d: "You're making a prison in the flower garden?"
  npc_override_t_garden_garden_of_time_you_re_saying_obvious_if_a8c26e: "You're saying the obvious. If you've heard the story up to this point, you probably already know what's going on. Don't talk nonsense and just follow me into the garden."
  npc_override_t_garden_garden_of_time_you_ready_then_extend_yo_1b6214: "Are you ready? Then extend your hand forward and keep your eyes on the seal as if you are focusing the power I'm giving you onto the seal."
  npc_override_t_garden_garden_of_time_you_tried_talking_spirit_c3ccb0: "Have you tried talking to the spirits? There won't be any harm in becoming friends with them."
  npc_override_t_garden_garden_of_time_your_location_been_safel_dc1af8: "{0} your location has been safely saved."
