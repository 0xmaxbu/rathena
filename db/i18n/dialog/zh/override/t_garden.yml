Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_t_garden_for_dun_all_dimensional_contamin_513e7e: "这个地下城中发生的所有次元污染现象已经平息了。"
  npc_override_t_garden_for_dun_approximately_minute_dim_99b532: "大约1分钟后，区域1的次元污染现象将会平息，区域2将发生大规模次元污染。"
  npc_override_t_garden_for_dun_approximately_minute_dim_9a0eec: "大约1分钟后，区域2的次元污染现象将会平息，区域1将发生大规模次元污染。"
  npc_override_t_garden_for_dun_dimensional_contaminatio_3f827b: "预计这个地下城中的次元污染现象将在大约1分钟后平息。"
  npc_override_t_garden_for_dun_large_scale_dimensional_ce52b6: "这个地下城正在发生大规模次元污染……"
  npc_override_t_garden_for_dun_large_scale_dimensional_de6a63: "大约1分钟后，这个地下城将发生大规模次元污染事件。"
  npc_override_t_garden_for_dun_menu_forgotten_3bc65d: "被遗忘的记忆：区域2的次元污染现象已经平息，区域1发生了大规模次元污染。"
  npc_override_t_garden_for_dun_menu_forgotten_41f76d: "被遗忘的记忆：区域1的次元污染现象已经平息，区域2发生了大规模次元污染。"
  npc_override_t_garden_garden_of_time_above_complaints_been_pr_c695ba: "以上{0}件投诉已处理完毕。"
  npc_override_t_garden_garden_of_time_according_their_words_se_d82852: "据他们所说，原因似乎是从与这个地方相连的次元而来的异界精灵，所以最好减少那些异物的数量。"
  npc_override_t_garden_garden_of_time_accordingly_constellatio_53f8fc: "因此，生命星座将4位身为守卫的神兽囚禁在一个与次元犯人完全隔绝的次元之中。"
  npc_override_t_garden_garden_of_time_act_destroying_nature_ma_d34332: "^777700这不是破坏自然的行为。而是将那些已转化为精灵的消失元素归还到它们原本的位置。你愿意听我们的请求吗？"
  npc_override_t_garden_garden_of_time_additionally_each_time_y_d7e57e: "另外，^ff0000每次你或队友受到陷阱的伤害，次元犯人的攻击力都会变得更强。^000000"
  npc_override_t_garden_garden_of_time_adventurer_you_must_no_l_698dad: "^0000ff冒险者，你绝不能再允许元素变成精灵了。用你的力量将它们送回自然吧。"
  npc_override_t_garden_garden_of_time_adventurer_you_willing_f_381038: "^aa0000冒险者！你愿意战斗吗？我们不需要懦夫！"
  npc_override_t_garden_garden_of_time_ah_ee6915: "啊，{0}。"
  npc_override_t_garden_garden_of_time_all_exits_activated_acti_225123: "并非所有出口都已激活。请先激活东西两侧的出口，然后再来找我。"
  npc_override_t_garden_garden_of_time_although_we_succeeded_se_967793: "虽然我们成功封印了那个无法正确使用力量的家伙，但它也许有一天会成功破除封印。"
  npc_override_t_garden_garden_of_time_anyway_place_only_serve_4b7eb0: "总之，这个地方只会作为通道使用，而监狱本身连接着另一个次元。我会把它们留在那里的。我可没打算毁掉这座花园。"
  npc_override_t_garden_garden_of_time_appears_duplicate_abilit_bf945a: "这似乎是高位星座可用能力的复制品，任何手段都无法解除。"
  npc_override_t_garden_garden_of_time_appears_no_special_compl_f4eeab: "看起来没有处理过特别的投诉。如果你处理了与精灵相关的投诉，请随时回来。谢谢。"
  npc_override_t_garden_garden_of_time_ardor_you_forgotten_what_db4d8a: "^0000ff阿尔多尔！你忘了莱蒂西亚说过至少要保持礼貌吗？"
  npc_override_t_garden_garden_of_time_based_book_left_lava_lak_27431c: "根据这本书的记载，左边是关押管理次元犯人的守卫的熔岩之湖，右边是关押次元管理者的生命之间。"
  npc_override_t_garden_garden_of_time_based_records_engraved_a_999219: "根据铭刻在冒险者灵魂中的记录"
  npc_override_t_garden_garden_of_time_because_each_time_person_d72942: "这是因为每次有人通过传送门，次元犯人每秒的恢复量就会增加一定数值，如果这个数字叠加，他就能瞬间恢复生命值。"
  npc_override_t_garden_garden_of_time_cancel_77dfd2: "取消"
  npc_override_t_garden_garden_of_time_circle_life_accessories_ac0ca1: "生命之环饰品"
  npc_override_t_garden_garden_of_time_completed_compensation_p_4f1cf8: "^0000ff{0}已完成^000000 —— 补偿已发放。"
  npc_override_t_garden_garden_of_time_conversation_between_spi_5efe61: "精灵与人类的对话。无缝沟通。我们将倾听客户的声音。这里是5000号信息亭，同时处理精灵投诉与补偿的综合信息终端。请问有什么可以帮到您的？"
  npc_override_t_garden_garden_of_time_course_eavesdropping_bit_5e9452: "^0000ff当然，偷听确实有点那个。^000000"
  npc_override_t_garden_garden_of_time_currently_imprisoned_gua_8ab1b9: "目前被囚禁的守卫是一股有可能同情次元犯人越狱的危险力量。需要定期用武力镇压他们，并没收他们正在管理/制造的监狱钥匙。"
  npc_override_t_garden_garden_of_time_danger_trap_varies_depen_2ad794: "这个陷阱的危险程度取决于结界的等级，而且离监狱中心越远，其破坏力就越强。"
  npc_override_t_garden_garden_of_time_diluvio_right_good_show_5b46d2: "^00cc00迪鲁维欧说得对。对前来帮助我们的人类表示一些礼貌是应该的。"
  npc_override_t_garden_garden_of_time_dimensional_criminal_use_9ad1af: "次元犯人动用自己的力量，在自己的空间中制造出时间移动陷阱，以阻止外部入侵者。"
  npc_override_t_garden_garden_of_time_dimensional_criminals_ab_c25365: "次元犯人拥有实时恢复生命值的能力。因此，除非一次打击超过其恢复能力，否则普通的制裁可能无法奏效。"
  npc_override_t_garden_garden_of_time_dimensional_criminals_pe_c2d00d: "次元犯人可以定期在自身周围建立圣域，使自己免疫物理和魔法攻击。"
  npc_override_t_garden_garden_of_time_divine_beast_s_cloak_spr_a282fa: "神兽披风 - 春"
  npc_override_t_garden_garden_of_time_don_t_just_stare_blankly_9f3b51: "别光愣着，伸出手来。"
  npc_override_t_garden_garden_of_time_doppelganger_ba76eb: "^bb0000死灵。^000000"
  npc_override_t_garden_garden_of_time_due_series_events_only_c_031a1b: "由于这一系列事件，不仅生命星座，连4只神兽也在第326次元中缺席了。因此，玩家必须以两个主要目标来管理这座监狱。"
  npc_override_t_garden_garden_of_time_effect_precursor_dimensi_17abed: "这个效果是次元犯人即将施展广泛而强大力量的前兆。"
  npc_override_t_garden_garden_of_time_elements_earth_must_rema_cd448b: "大地的元素必须保持其元素状态。如果它们继续变成元素精灵，最终连一粒尘土都不会剩下。你愿意帮助我吗？"
  npc_override_t_garden_garden_of_time_even_betelgeuse_who_came_a44db4: "就连很久以前来到这片大陆的参宿四，都已经有了自己像样的家！我觉得奥斯卡这样四处流浪、居无定所也太不像话了！"
  npc_override_t_garden_garden_of_time_even_if_wanted_take_over_24f92c: "即使它想要占据你和你同伴的身体，也无法施展出那样的力量。"
  npc_override_t_garden_garden_of_time_even_if_you_two_more_652feb: "即使你拥有两个以上的祝福，铭刻在冒险者^ff0000灵魂上的记录也会优先^000000，所以我们建议你将多余的祝福在商店中处理掉。"
  npc_override_t_garden_garden_of_time_even_now_accumulating_va_430582: "即使是现在，它也正在积累庞大的生命能量，这可能会对次元世界构成严重威胁。"
  npc_override_t_garden_garden_of_time_everything_you_want_here_443e49: "你想要的一切都在这里。你想做什么交易？"
  npc_override_t_garden_garden_of_time_exit_menu_2ed324: "退出菜单"
  npc_override_t_garden_garden_of_time_first_fd1cd9: "——第一——"
  npc_override_t_garden_garden_of_time_first_you_enter_lava_lak_8887a3: "首先，你可以每天进入一次关押守卫的熔岩之湖。那里没有额外的封印，所以只要遵守每天一次的限制，进入就不会有什么特别的限制。"
  npc_override_t_garden_garden_of_time_flame_become_spirit_move_577975: "变成精灵后能自行移动和思考的火焰本身就是极其危险的。你不觉得就这样放任不管太危险了吗？我不是在请求你帮忙。照我的指示去做。"
  npc_override_t_garden_garden_of_time_flow_time_inside_mansion_41d450: "那座宅邸里的时间流逝与我们现在的时间不同。所以我们不知道奥斯卡什么时候能完全修复宅邸。"
  npc_override_t_garden_garden_of_time_flower_garden_north_gard_40b08c: "花园北边的花圃不稳定，连接着另一个次元。我要去那里做一些工作。"
  npc_override_t_garden_garden_of_time_focus_your_mind_placing_1d5d71: "将拇指放在展开的灵石右下方，其余手指放在上方，以此来集中精神。"
  npc_override_t_garden_garden_of_time_forgotten_memories_zone_2a8658: "被遗忘的记忆，区域1，6点钟方向"
  npc_override_t_garden_garden_of_time_forgotten_memories_zone_bfdde6: "被遗忘的记忆，区域2，7点钟方向"
  npc_override_t_garden_garden_of_time_goodbye_619bc3: "再见。"
  npc_override_t_garden_garden_of_time_guards_originally_meant_2f89f9: "守卫们原本的职责是监视次元犯人，但在某个时刻，他们却表现出了保护次元犯人的意图。"
  npc_override_t_garden_garden_of_time_guidelines_correct_priso_ded46c: "正确的监狱管理指南。请问你想查看哪方面？"
  npc_override_t_garden_garden_of_time_hall_life_where_dimensio_22f1af: "关押次元犯人的生命之间"
  npc_override_t_garden_garden_of_time_homeless_am_i_bad_you_d663eb: "居无定所……我就那么差劲吗？莱蒂西亚，你那样看着我是什么意思？"
  npc_override_t_garden_garden_of_time_however_advantageous_sim_15299a: "但是，单纯提升结界等级并不一定有利。"
  npc_override_t_garden_garden_of_time_however_after_being_swep_5f1946: "^aa00aa然而，自从被一场奇异的次元风暴席卷之后，与这个花园相连的世界的元素开始失控，最终开始变成精灵。"
  npc_override_t_garden_garden_of_time_however_forget_recovery_8ace38: "但是，请不要忘记，^ff0000净化冥界时使用传送门的人数越多，恢复速度也会成比例增加^000000。"
  npc_override_t_garden_garden_of_time_however_if_you_apply_app_5fb167: "但是，如果你对次元犯人施以恰当的制裁并使其屈服，你将获得相应的^ff0000补偿^000000，或者延迟领取奖励以获得解锁下一个^ff0000结界^000000等级的机会。"
  npc_override_t_garden_garden_of_time_however_if_you_pull_dime_5ea25b: "但是，如果你将已宣告圣域的次元犯人从圣域中拉出来，圣域就会被解除。如果次元犯人利用圣域暴走，就把他从圣域中拉出来。"
  npc_override_t_garden_garden_of_time_however_if_you_receive_r_b0d1d2: "但是，一旦领取了奖励，你将^ff0000一周内^000000无法再次在生命之间领取奖励。当然，即使在那种情况下，进入仍然是免费的。"
  npc_override_t_garden_garden_of_time_however_portal_underworl_fd2f52: "但是，通往冥界的传送门不应该让太多人使用。"
  npc_override_t_garden_garden_of_time_huh_73fef0: "嗯？"
  npc_override_t_garden_garden_of_time_i_2bf88e: "我会的。"
  npc_override_t_garden_garden_of_time_i_agree_rigel_i_think_c88a25: "我同意，参宿七！我觉得花园中心附近的不稳定区域可以通过设置副本的形式来加以限制和稳定。这件事交给我吧！"
  npc_override_t_garden_garden_of_time_i_am_unable_communicate_f0ca77: "由于携带的道具数量或重量过多，我无法与精灵沟通。"
  npc_override_t_garden_garden_of_time_i_cannot_communicate_bar_4eb777: "由于携带的道具种类或重量过多，我无法与结界沟通。"
  npc_override_t_garden_garden_of_time_i_cannot_communicate_bar_efc7ca: "由于携带的道具种类或重量过多，我无法与结界沟通。"
  npc_override_t_garden_garden_of_time_i_don_t_know_what_861eb2: "我不知道错误出在哪里，但这个世界将它认定为另一个生命星座。如果星座攻击相同的星座，就违反了次元规则，会立即失去力量。"
  npc_override_t_garden_garden_of_time_i_guess_s_way_mansion_86dbdc: "我想事情就是这样。这座宅邸是一个多条时间线错综交织的空间，所以我觉得其他人无法插手。"
  npc_override_t_garden_garden_of_time_i_heard_spirits_original_24d5fc: "而且我听说，原本守护这个空间的精灵们被不知为何变得凶暴的同胞们驱逐了。"
  npc_override_t_garden_garden_of_time_i_help_you_next_time_6acdaa: "下次我会帮你的。"
  npc_override_t_garden_garden_of_time_i_ll_take_care_adventure_d8883b: "这里的冒险者就交给我来照顾，我们就此别过，进去吧。"
  npc_override_t_garden_garden_of_time_i_look_forward_seeing_yo_c98e2d: "我期待着你和你的同伴在这里大展身手。"
  npc_override_t_garden_garden_of_time_i_m_fine_please_tell_9515b2: "我没事，请告诉我该怎么做。"
  npc_override_t_garden_garden_of_time_i_m_glad_there_someone_c7c1de: "我很高兴有人能解决这个问题。请好好处理我的委托。"
  npc_override_t_garden_garden_of_time_i_m_going_need_your_26015f: "我需要你的帮助。我需要收集东西两侧的能量流来创建传送门，所以我们出发吧。"
  npc_override_t_garden_garden_of_time_i_m_sorry_ask_you_adbf9c: "很抱歉今天又向你提出这种请求。非常感谢。"
  npc_override_t_garden_garden_of_time_i_open_storage_number_th_4d3f99: "我将为你打开编号{0}的仓库。感谢你的使用。"
  npc_override_t_garden_garden_of_time_i_recommend_you_pay_undu_89235e: "我建议你不要过度关注超出自身能力的结界，而是致力于稳定的制裁。"
  npc_override_t_garden_garden_of_time_i_t_stand_see_healthy_b483a2: "我无法眼睁睁看着健康的元素因为无法转化为精灵而被腐化。我需要你的力量来阻止它们堕入愤怒并被污染。"
  npc_override_t_garden_garden_of_time_i_think_i_leticia_could_fccf06: "我想我和莱蒂西娅能为那些不稳定的次元通道找到合适的用途。你觉得呢，莱蒂西娅？"
  npc_override_t_garden_garden_of_time_i_think_i_ve_heard_31c666: "我好像以前听过这个。"
  npc_override_t_garden_garden_of_time_i_think_s_finished_let_5c3edb: "我想已经完成了。我们先到中央广场来，商量一下接下来的事情。"
  npc_override_t_garden_garden_of_time_i_ve_worked_you_many_8b53b4: "{0}，我和你合作过很多次，本来想请你跟我一起去的，但这次恐怕不行了。"
  npc_override_t_garden_garden_of_time_if_any_chance_takes_over_59fdb1: "而且，万一它占据了我的存在，那就真的是不可挽回的局面了。"
  npc_override_t_garden_garden_of_time_if_elements_continue_bec_3f19ab: "^777700如果元素继续变成元素精灵，最终构成这个世界的物质世界将会崩塌。必须阻止这一切。"
  npc_override_t_garden_garden_of_time_if_prison_full_traps_you_565e3d: "如果监狱里布满了陷阱，你可以利用异世界的另一侧来重置陷阱。请参考异世界另一侧的相关信息。"
  npc_override_t_garden_garden_of_time_if_too_many_portal_users_fe2f85: "如果传送门使用者过多，恢复力会急剧增加，导致正常的制裁可能失败。"
  npc_override_t_garden_garden_of_time_if_you_fail_correct_dime_4842e5: "如果你未能成功制裁次元犯人，下次进入监狱时你可以处理的结界等级将降低1级。^000000"
  npc_override_t_garden_garden_of_time_if_you_see_any_unusual_227038: "如果你在制裁次元犯人时看到地面上出现异常效果，请迅速离开该区域。"
  npc_override_t_garden_garden_of_time_if_you_want_higher_rewar_ec8ff3: "如果你想要更高的奖励等级，请记住，与其选择奖励，不如通过突破结界来快速升级更为有利。"
  npc_override_t_garden_garden_of_time_influence_dimensional_cr_983318: "次元犯人的影响可导致束缚效果、严重的撕裂伤和冻伤，有时甚至会导致死亡。"
  npc_override_t_garden_garden_of_time_information_about_prison_108d9c: "这是关于监狱中囚犯的信息。你还需要其他额外信息吗？"
  npc_override_t_garden_garden_of_time_let_s_place_sacred_items_a0e77c: "^aa0000让我们把星座们准备的神圣物品放在对面吧。用人类的话来说，叫做自动售货机。^000000"
  npc_override_t_garden_garden_of_time_let_s_start_looking_seal_5556fa: "我们先去找我安装在北边稍远处的封印灵石吧。"
  npc_override_t_garden_garden_of_time_leticia_begging_you_stop_5c4c25: "莱蒂西亚恳求你不要再像个流浪汉一样了，买个体面的房子，像个星座一样生活。总是无视别人说的话可不好。"
  npc_override_t_garden_garden_of_time_level_power_dimensional_bd813b: "必须测量并记录次元犯人所施展出的力量等级。"
  npc_override_t_garden_garden_of_time_list_requests_you_thank_dd285f: "这是给你的委托清单。非常感谢。"
  npc_override_t_garden_garden_of_time_looks_like_s_registered_ac90d3: "看来已经成功注册了。现在你已经完成了识别监狱并进出的基本准备。如还有疑问，请参考这份指南。"
  npc_override_t_garden_garden_of_time_main_prisoner_dimensiona_b008d9: "主要囚犯——次元犯人，是一种窃取了第326次元生命星座外貌和能力的死灵型怪物。目前其危险等级从未被测量过，因此没有记录。"
  npc_override_t_garden_garden_of_time_may_lesser_importance_ne_491511: "虽然可能不那么重要，但有必要定期造访看守们的监狱来削弱他们的力量。"
  npc_override_t_garden_garden_of_time_maybe_if_your_life_threa_83be99: "也许在你的生命受到威胁的时候吧。"
  npc_override_t_garden_garden_of_time_means_20c955: "也就是说……"
  npc_override_t_garden_garden_of_time_means_even_if_you_only_32f40d: "这意味着即使你只在宅邸里待上几天，外面的世界可能已经过了几年甚至几十年。像{0}这样的人类恐怕很难承受得了。"
  npc_override_t_garden_garden_of_time_menu_one_3f43c2: "有一点是确定的：次元犯人已经劫持了次元生命星座的身体和力量。"
  npc_override_t_garden_garden_of_time_moment_all_illusions_oth_8f5dca: "当异世界的所有幻影被击败的瞬间，原本世界的次元犯人将受到强力打击，在一定时间内陷入眩晕状态。"
  npc_override_t_garden_garden_of_time_moment_inner_world_purif_212d35: "当内部世界被净化的瞬间，在次元犯人处于眩晕状态期间，其恢复速度会急剧下降。"
  npc_override_t_garden_garden_of_time_moment_traps_within_pris_1be054: "此时，监狱内的陷阱会重置，次元犯人积累的所有攻击力恢复到原始状态，且次元犯人的所有防御力在短时间内大幅降低。"
  npc_override_t_garden_garden_of_time_msg_4b50f4: "————————————"
  npc_override_t_garden_garden_of_time_my_goal_return_water_spi_d42a70: "我的目标是将那些在被遗忘的记忆中逐渐实体化的水之精灵归还为元素状态。希望能得到你的帮助。"
  npc_override_t_garden_garden_of_time_no_b8b9f1: "不。"
  npc_override_t_garden_garden_of_time_now_then_let_s_open_696daf: "那么，我们把另一个也打开吧。请移动到这扇门对面的位置。"
  npc_override_t_garden_garden_of_time_now_we_build_prison_pris_77e926: "从现在开始，我们要建造一座监狱。一座关押非常危险且不稳定囚犯的监狱。"
  npc_override_t_garden_garden_of_time_oh_adventurer_leticia_se_3f7733: "^777700哦，莱蒂西亚派来的冒险者终于到了。"
  npc_override_t_garden_garden_of_time_oh_don_t_worry_about_eab836: "哦，不用担心那个。我会确保你与现实世界隔离的。"
  npc_override_t_garden_garden_of_time_oh_you_going_now_06879b: "哦，你现在就要进去吗？"
  npc_override_t_garden_garden_of_time_oh_you_mean_i_feel_5840b4: "哦，你是说'那个'？我感觉非常清楚。"
  npc_override_t_garden_garden_of_time_okay_i_ll_finish_work_21cdb4: "好的，我会尽快完成工作出来。到时候见。"
  npc_override_t_garden_garden_of_time_okay_i_understand_your_i_a27e1d: "好的，我明白你的意图。不过我还需要想想怎么用正确的方式来处理这件事……"
  npc_override_t_garden_garden_of_time_okay_s_enough_open_passa_dc9f5d: "好了，这样就够了。它会在那里的时间封印上开启一条通往不洁能量所在地的通道。"
  npc_override_t_garden_garden_of_time_okay_then_please_take_ca_2a0eeb: "好的。那就拜托你了。哦，对了，{0}，如果你有时间的话，希望能帮帮莱蒂西亚。她太懒了……"
  npc_override_t_garden_garden_of_time_only_accessible_while_ho_0bdf02: "只有持有{0}时才能进入。"
  npc_override_t_garden_garden_of_time_oscar_appears_talking_so_08a680: "^0000ff奥斯卡似乎正在和某人交谈。^000000"
  npc_override_t_garden_garden_of_time_oscar_you_ve_been_wander_3abdf6: "奥斯卡，你一直四处流浪，连个像样的住处都没有。你再怎么善良，也不能就这样白白帮忙啊！"
  npc_override_t_garden_garden_of_time_perhaps_due_unstable_ene_2fbb70: "也许是由于不稳定的能量流动，自然的属性被扭曲和转化，精灵们变得凶暴了。它们被安排在花园的西北角休息一段时间。"
  npc_override_t_garden_garden_of_time_place_specializes_equipm_d2cb6b: "这个地方专门处理装备。你想做什么交易？"
  npc_override_t_garden_garden_of_time_please_check_again_wheth_7143cd: "请再次检查是否已在^ff0000装备套装设定^000000中注册，以及是否已经安装。"
  npc_override_t_garden_garden_of_time_please_organize_party_le_767aeb: "^0000ff请至少组织一名队员的队伍后再继续。^000000"
  npc_override_t_garden_garden_of_time_power_dimensional_crimin_fea4fc: "次元犯人的力量被生命星座参宿七紧紧束缚的结界所封印。"
  npc_override_t_garden_garden_of_time_prison_divided_into_area_95f099: "监狱分为关押守卫的区域和关押次元犯人的区域。"
  npc_override_t_garden_garden_of_time_prisoner_swallowed_me_ri_6ddb90: "这个囚犯吞噬了来自第326次元的我——参宿七，变成了一个自称生命星座的存在。"
  npc_override_t_garden_garden_of_time_put_your_hand_guide_c23fdf: "把手放在指引上。"
  npc_override_t_garden_garden_of_time_quit_step_away_7e079b: "退出并离开"
  npc_override_t_garden_garden_of_time_reach_out_hand_watch_sea_bdbede: "伸出手，注视封印"
  npc_override_t_garden_garden_of_time_relatedly_when_entering_8cf9cf: "相关地，进入监狱时，你可以装备星座赋予的护符，并根据其附带的结界等级来测量和记录危险等级。"
  npc_override_t_garden_garden_of_time_remember_exception_one_h_510748: "请记住，除了1小时的副本时间限制外，只要有钥匙，你想进入多少次都可以。"
  npc_override_t_garden_garden_of_time_remember_order_kill_illu_583dbf: "请记住，要消灭异世界的幻影，建议组成人数少但攻击力强、机动性高的队伍。"
  npc_override_t_garden_garden_of_time_reward_helping_us_conste_206048: "^aa0000帮助我们和星座们在这里工作的报酬，将通过那个神圣物品领取。^000000"
  npc_override_t_garden_garden_of_time_s_all_i_ask_you_12adfc: "今天拜托你的就这些了。慢慢看看吧。"
  npc_override_t_garden_garden_of_time_s_important_oscar_you_fe_a69bc4: "那不重要，奥斯卡。你对中央的宅邸有什么感觉吗？"
  npc_override_t_garden_garden_of_time_s_long_story_prison_info_3c2213: "说来话长。监狱信息会另行张贴在监狱入口处，请定期查看。"
  npc_override_t_garden_garden_of_time_s_me_063e71: "是我。"
  npc_override_t_garden_garden_of_time_s_right_ddafea: "没错！"
  npc_override_t_garden_garden_of_time_s_simpler_than_you_think_5e9bd6: "比你想象的要简单吧？有了这个，在奥斯卡完成宅邸之前，我们就能阻止奇怪的家伙涌入花园了，真是松了口气。"
  npc_override_t_garden_garden_of_time_s_something_you_you_d_763725: "这是你必须做的事。你最好尽快去完成。"
  npc_override_t_garden_garden_of_time_s_worst_kind_being_doesn_8e213a: "这是最糟糕的存在——它不仅仅是模仿能力或外貌，而是吞噬目标存在的灵魂，然后变成那个存在本身。"
  npc_override_t_garden_garden_of_time_second_fd0461: "——第二——"
  npc_override_t_garden_garden_of_time_seems_like_s_issue_invol_eb5415: "这似乎是涉及^0000ff时间^000000的问题，我觉得莱蒂西亚和我都无能为力。奥斯卡，你能行吧？"
  npc_override_t_garden_garden_of_time_seems_like_speed_time_in_20c5c5: "这座宅邸里的时间流速似乎和外面的世界有很大差异。我的推测大概是……千分之一？说不定还要更大。"
  npc_override_t_garden_garden_of_time_seems_like_they_focusing_9d6a91: "^0000ff他们似乎正专注于奥斯卡和莱蒂西亚的故事。^000007"
  npc_override_t_garden_garden_of_time_seems_there_too_many_typ_672655: "^ff0000似乎携带的道具种类和重量太多了。请整理一下你的背包。^000000"
  npc_override_t_garden_garden_of_time_she_paying_attention_you_970e03: "^0000ff她正在向奥斯卡解释事情，没有注意到你。^000007"
  npc_override_t_garden_garden_of_time_since_you_ve_already_hel_19f8c3: "既然你已经帮过我了，从现在开始你每天都要跟我一起工作。没什么大不了的。减少在这里创建的通道下方地下城中不洁之物的数量就行。"
  npc_override_t_garden_garden_of_time_so_your_claim_i_happened_32b717: "所以，你的意思是说，我碰巧在露缇附近发现了一条裂缝，进来之后就发现了这个花园？"
  npc_override_t_garden_garden_of_time_stop_viewing_9d8d1c: "停止查看"
  npc_override_t_garden_garden_of_time_take_your_eyes_off_groun_34e00c: "一刻也不要将视线从地面上移开，时刻警惕四周。"
  npc_override_t_garden_garden_of_time_then_let_s_go_some_c348cd: "那我们先去做一些花园维护吧。附近正好有个冒险者在偷听，一起去正好！"
  npc_override_t_garden_garden_of_time_there_any_possibility_pr_fd58f2: "囚犯有没有可能占据我们的身体？"
  npc_override_t_garden_garden_of_time_there_anything_i_help_ma_27a50c: "在宅邸里有什么我能帮忙的吗？"
  npc_override_t_garden_garden_of_time_there_high_probability_q_519420: "等宅邸内部清理完毕，恐怕会过去相当长的时间。必须尽快结束……"
  npc_override_t_garden_garden_of_time_there_still_uncompleted_d0a4b2: "^0000ff还有未完成的任务。在{0}处的所有委托完成之前，你无法接受额外的委托或进行重置。^000000"
  npc_override_t_garden_garden_of_time_therefore_when_you_enter_c87336: "因此，当你进入管理监狱时，你遇到的第一个次元犯人是被调整为仅发挥最低强度的结界。"
  npc_override_t_garden_garden_of_time_they_re_probably_just_wa_a06440: "他们大概只是在等你来。帮不帮他们是你的自由，但帮助精灵们对你不会有坏处。我建议你至少去一次。"
  npc_override_t_garden_garden_of_time_third_3222b4: "——第三——"
  npc_override_t_garden_garden_of_time_today_s_request_already_1940a0: "^ff0000今天的委托已经接取了。无法再接取更多。^000000"
  npc_override_t_garden_garden_of_time_tool_dealer_85a06c: "道具商人"
  npc_override_t_garden_garden_of_time_true_i_m_really_sorry_12a9a9: "确实是这样。无意间把你卷入了我们的工作，真的很抱歉。"
  npc_override_t_garden_garden_of_time_truly_one_funniest_jokes_33fdb2: "这真是我这几百年来听过的最好笑的笑话之一了。"
  npc_override_t_garden_garden_of_time_ugh_s_my_responsibility_eadfb4: "呃……那是我的责任，不管能不能成，我都应该去。"
  npc_override_t_garden_garden_of_time_unauthenticated_user_a744e6: "^ff0000未认证的用户。^000000"
  npc_override_t_garden_garden_of_time_underworld_there_imperfe_84b3e2: "在冥界中，存在着次元犯人的不完全幻影，而这些幻影与次元犯人之间有着不完全的连接。"
  npc_override_t_garden_garden_of_time_use_storage_please_inser_64b58e: "要使用仓库，请投入100 Zeny。"
  npc_override_t_garden_garden_of_time_very_appropriate_far_awa_4de961: "离宅邸这么远，又不会打扰到奥斯卡，这不是非常合适吗？"
  npc_override_t_garden_garden_of_time_we_ancient_spirits_world_0e73d5: "^aa00aa我们是来自与这个花园相连的世界的古老精灵。帮助每一种自然元素保持和谐，是铭刻在我们精灵之躯中的本能。"
  npc_override_t_garden_garden_of_time_we_automatically_process_2d39e4: "我们将自动处理你所有已完成的精灵委托。"
  npc_override_t_garden_garden_of_time_we_carefully_enchant_equ_06e99c: "我们精心为从火焰之湖获得的装备进行附魔。你想查看哪个菜单？"
  npc_override_t_garden_garden_of_time_we_created_prison_access_957718: "我们在北边稍远处创建了监狱出入名单。只有在名单上注册的人才能进入监狱，所以我们先去注册吧。"
  npc_override_t_garden_garden_of_time_we_gathered_all_spirits_797a07: "我们把周围所有求助的精灵都集中到了中央广场的西北角。它们真的很吵。"
  npc_override_t_garden_garden_of_time_we_put_great_effort_into_0d26a0: "我们精心为流通装备进行附魔。你想查看哪个菜单？"
  npc_override_t_garden_garden_of_time_we_reissued_protection_e_8d5ee4: "我们已重新发放了刻有^0000ff等级1^000000结界的护符。"
  npc_override_t_garden_garden_of_time_we_t_just_bite_our_b3ec46: "但我们也不能就这样坐以待毙。而且，从来到这里的精灵们所说的话来看，好像还有别的事情需要我们去做。"
  npc_override_t_garden_garden_of_time_well_i_don_t_agree_5a8d8f: "嗯，我完全不同意那个看法，不过我可以打消你的顾虑。它已经被我布下的层层封印所包围了。"
  npc_override_t_garden_garden_of_time_well_i_m_sure_oscar_d0b3a2: "嗯，我相信奥斯卡会处理好的……别光站着了，来帮帮参宿七和我的工作吧。"
  npc_override_t_garden_garden_of_time_well_s_right_waste_destr_d11f5c: "嗯……说得也是，毁掉太可惜了。"
  npc_override_t_garden_garden_of_time_well_you_might_think_s_4904d9: "嗯，你可能觉得不过是死灵而已，何必大惊小怪，但你将要关在这里的那个家伙，和你所认知的死灵完全是不同级别的存在。"
  npc_override_t_garden_garden_of_time_what_i_ve_looked_there_fe51fb: "据我观察，这里确实有几条不稳定的次元通道，但似乎并不太危险。莱蒂西亚说得有道理。"
  npc_override_t_garden_garden_of_time_what_mean_a57d36: "那是什么意思？"
  npc_override_t_garden_garden_of_time_what_you_going_here_f47f0e: "你打算在这里做什么？"
  npc_override_t_garden_garden_of_time_when_i_ran_save_myself_4b0f65: "当我赶到那里想自救时，已经太迟了。一看到那个和我长得一模一样却昏迷不醒的人，我就明白了。那不是我。"
  npc_override_t_garden_garden_of_time_when_number_traps_prison_ca0251: "当监狱中的陷阱数量超过一定数值时，监狱北侧会出现一扇通往异世界的传送门。"
  npc_override_t_garden_garden_of_time_who_you_going_put_prison_7a4014: "你打算把谁关进那座监狱？"
  npc_override_t_garden_garden_of_time_whose_image_take_now_d65524: "它现在变成了谁的样子？"
  npc_override_t_garden_garden_of_time_why_did_you_leticia_8aaa0f: "你为什么要那样做，莱蒂西亚？"
  npc_override_t_garden_garden_of_time_why_doesn_t_place_look_5e26f9: "你看！这个地方不是很棒吗？漂亮的花园加上一座神秘的宅邸！这太完美了，奥斯卡！"
  npc_override_t_garden_garden_of_time_why_don_t_you_take_89bc32: "你怎么不自己去对付那个犯人？"
  npc_override_t_garden_garden_of_time_why_you_muttering_you_an_60ece7: "你在嘀咕什么？有什么不满吗？"
  npc_override_t_garden_garden_of_time_wind_means_source_life_a_d2d916: "风意味着生命的源泉——大气。如果风之元素继续变成精灵，这个次元中的所有生命最终都会死亡。我需要有人来帮忙。"
  npc_override_t_garden_garden_of_time_wow_i_didn_t_know_28e396: "哇，没想到这两个人相处得这么好。不像是事先商量过的，对吧？"
  npc_override_t_garden_garden_of_time_yes_i_go_leticia_i_f962dd: "是的，我必须进去。莱蒂西亚，我希望在我出来清理完宅邸之前，你不要惹麻烦，好好照看花园。"
  npc_override_t_garden_garden_of_time_yes_me_too_a092a8: "什么？我也要？"
  npc_override_t_garden_garden_of_time_you_didn_t_destroy_becau_4a5f60: "你没毁掉它是因为觉得太浪费了~然后呢？"
  npc_override_t_garden_garden_of_time_you_don_t_understand_let_392597: "你不明白，莱蒂西亚。你发现了裂缝，但我问的是你为什么不把它消除掉反而叫我过来。"
  npc_override_t_garden_garden_of_time_you_ever_abandon_immorta_36b3bf: "你会放弃好不容易占据的不朽之躯，回到凡人之躯吗？"
  npc_override_t_garden_garden_of_time_you_going_into_mansion_4c65ee: "你要进宅邸去吗？"
  npc_override_t_garden_garden_of_time_you_like_go_back_garden_09783e: "你想回到时间花园吗？"
  npc_override_t_garden_garden_of_time_you_must_attack_dimensio_d033db: "你必须定期攻击次元犯人，阻止它们积蓄力量。"
  npc_override_t_garden_garden_of_time_you_need_any_additional_1a30db: "你还需要其他额外信息吗？"
  npc_override_t_garden_garden_of_time_you_protection_issued_yo_1b3cff: "你的背包中已经有发放的护符了。只有在你的背包中没有星座护符的情况下才能重新发放。"
  npc_override_t_garden_garden_of_time_you_re_good_communicator_6d5cea: "^aa0000你很会沟通嘛！那好吧，我每天都会告诉你该做什么！^000000"
  npc_override_t_garden_garden_of_time_you_re_here_117a35: "你来了，{0}。"
  npc_override_t_garden_garden_of_time_you_re_making_prison_flo_6cd97d: "你要在花圃里建监狱？"
  npc_override_t_garden_garden_of_time_you_re_saying_obvious_if_a8c26e: "你在说废话。如果你已经听到了这里的故事，大概也知道是怎么回事了。别废话了，跟我进花园吧。"
  npc_override_t_garden_garden_of_time_you_ready_then_extend_yo_1b6214: "你准备好了吗？那就把手向前伸，注视着封印，就像要把我赋予你的力量集中到封印上一样。"
  npc_override_t_garden_garden_of_time_you_tried_talking_spirit_c3ccb0: "你试过和精灵们交谈吗？和它们成为朋友不会有坏处的。"
  npc_override_t_garden_garden_of_time_your_location_been_safel_dc1af8: "{0}，你的位置已安全保存。"
