  npc_override_novice_novice_after_you_receive_all_su_7db01f: "在你收到所有补给后，我会将你传送到剑士协会。"
  npc_override_novice_novice_ain_t_my_turn_yet_1ad40b: "还没轮到我呢。"
  npc_override_novice_novice_alberta_port_city_8337bc: "艾尔贝塔，港口之都。"
