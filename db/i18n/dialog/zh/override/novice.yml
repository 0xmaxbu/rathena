  npc_override_novice_novice_aaaahh_don_t_hurt_me_910632: "啊！！别打我~"
  npc_override_novice_novice_about_kafra_service_fd3101: "关于卡普拉服务。"
  npc_override_novice_novice_acolyte_guild_here_pront_9ddce0: "服事公会在普隆德拉西北方向的教堂里。剑士公会位于依斯鲁得岛，那是普隆德拉东南方的一个城镇。"
  npc_override_novice_novice_acolyte_mage_70d00f: "服事、魔法师，"
  npc_override_novice_novice_acolyte_someone_who_wors_b94dd9: "服事是崇拜女神芙蕾雅的人，他们牺牲自己来帮助他人。"
  npc_override_novice_novice_acolytes_use_supportive_77c7fc: "服事使用辅助技能让战斗变得更加轻松。"
