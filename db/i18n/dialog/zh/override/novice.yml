  npc_override_novice_novice_alchemist_as_their_secon_6052f4: "^8E2323或炼金术士^000000作为他们的二转职业。"
  npc_override_novice_novice_all_basic_moves_selectio_81deba: "所有基本的^4d4dff移动、物品选择和攻击^000000都使用^4d4dff鼠标左键^000000。"
  npc_override_novice_novice_all_basic_moves_selectio_a3cce0: "所有基本的^4d4dff移动、物品选择和攻击^000000都使用^4d4dff鼠标左键^000000。"
  npc_override_novice_novice_all_your_never_ending_b757e3: "这都是为了你永无止境的"
  npc_override_novice_novice_alright_i_give_something_f0d222: "好吧。我会给你一些东西……"
  npc_override_novice_novice_alright_what_about_phrac_fccb53: "好吧！弗拉康怎么样？"
  npc_override_novice_novice_also_if_you_trying_take_28ef39: "另外，如果你想乘船去某个地方，你必须先经过艾尔贝塔。"
