Header:
  Type: I18N_DIALOG
  Version: 1
Body:
  npc_override_moc_prydn1_quests_morocc_ahh_just_follow_me_8c1bba: "啊，跟我来！"
  npc_override_moc_prydn1_quests_morocc_alright_target_number_go_5f939a: "好了，目标数量是20！祝你好运！"
  npc_override_moc_prydn1_quests_morocc_ancient_mummies_caught_m_f6c6c0: "但远古木乃伊趁我不注意袭击了我，在我反应过来之前就打了我的头！"
  npc_override_moc_prydn1_quests_morocc_ancient_mummy_wouldn_t_d_d39826: "那个远古木乃伊应该不敢再来这里了吧？哈哈哈！"
  npc_override_moc_prydn1_quests_morocc_bah_what_s_up_old_159563: "呸，这旧钱是怎么回事……你就没有什么闪闪发光的东西吗？！"
  npc_override_moc_prydn1_quests_morocc_bah_you_re_so_cold_609291: "呸，你真冷血。"
  npc_override_moc_prydn1_quests_morocc_come_they_re_so_strange_40a952: "但拜托，它们太奇怪了！它们是木乃伊！只是木乃伊，你知道吗？它们不应该那么强！"
  npc_override_moc_prydn1_quests_morocc_come_think_weakling_like_5e99ca: "^FF0000但话说回来，像你这样的弱者在那里活不过去的。运气好的话也许能撑一秒？^000000"
  npc_override_moc_prydn1_quests_morocc_did_you_know_cats_dogs_91a677: "你知道猫和狗合不来吗？"
  npc_override_moc_prydn1_quests_morocc_don_t_ask_why_i_75538d: "别问为什么！我相信你也不希望那些美丽的宝藏被藏在黑暗里！"
  npc_override_moc_prydn1_quests_morocc_fighting_ancient_mummies_b31a14: "与远古木乃伊的战斗还顺利吗？"
  npc_override_moc_prydn1_quests_morocc_good_i_ll_make_good_8081f1: "很好，我会好好利用你争取的时间！但我得先解决这个肚子痛的问题……"
  npc_override_moc_prydn1_quests_morocc_good_keep_up_good_work_a7326c: "很好。继续保持！"
  npc_override_moc_prydn1_quests_morocc_good_target_number_good_36426e: "很好，目标数量是20！祝你好运！"
  npc_override_moc_prydn1_quests_morocc_gosh_i_could_scratched_h_b4ec8c: "天哪，如果不是因为我肚子痛，我早就能狠狠抓他的脸了！"
  npc_override_moc_prydn1_quests_morocc_gosh_you_don_t_even_014ad6: "天哪，你连5000 Zeny都没有，是吗？"
  npc_override_moc_prydn1_quests_morocc_haha_s_secret_184dd6: "哈哈，这是个秘密。"
  npc_override_moc_prydn1_quests_morocc_hey_s_because_i_m_dfd378: "嘿，这可不是因为我害怕马鸠罗斯！"
  npc_override_moc_prydn1_quests_morocc_hey_you_re_actually_usef_374814: "嘿，你还真有用！干得好！"
  npc_override_moc_prydn1_quests_morocc_hmm_if_you_insist_just_90040c: "嗯……但如果你坚持的话，给我5000 Zeny。我来带路。"
  npc_override_moc_prydn1_quests_morocc_i_found_out_while_i_0b722c: "是我在偷东西的时候发现的……不，我是说，只是在金字塔里散步的时候。"
  npc_override_moc_prydn1_quests_morocc_i_ll_send_you_field_178a76: "我很快会把你送到野外。"
  npc_override_moc_prydn1_quests_morocc_i_m_sure_mummy_s_b2f575: "我确信木乃伊的珍贵宝藏藏在地下二层。"
  npc_override_moc_prydn1_quests_morocc_i_m_sure_they_re_41d8c3: "我确信它们是想通过减少我优秀的脑细胞来阻止我发现宝藏！！"
  npc_override_moc_prydn1_quests_morocc_i_see_c52c6e: "我明白了。"
  npc_override_moc_prydn1_quests_morocc_i_t_believe_mummy_could_e91cff: "我不敢相信木乃伊能对我做这种事。天哪，好痛。不能让任何人知道这件事……"
  npc_override_moc_prydn1_quests_morocc_if_you_really_want_go_5fb233: "如果你真的想去下一个区域，你要对自己的安全负责。"
  npc_override_moc_prydn1_quests_morocc_if_you_want_go_home_b782f6: "如果你想回家，你最好揍那只丑狗！否则，他会咬你的！"
  npc_override_moc_prydn1_quests_morocc_look_him_so_greedy_drool_38e795: "看看他，那么贪婪还流着口水……我也不喜欢他呼吸的样子。我无法忍受他发出那些咕噜咕噜的声音……"
  npc_override_moc_prydn1_quests_morocc_look_ugly_hideous_verit_7570cb: "看看那个丑陋又可怕的维里特。他在皱眉头，摇着尾巴，试图靠近过来。"
  npc_override_moc_prydn1_quests_morocc_look_verit_he_s_afraid_bba602: "看看那个维里特，他在害怕我们！咔哈哈哈！我们暂时安全了！"
  npc_override_moc_prydn1_quests_morocc_menu_go_57cca7: "返回盗贼公会:消灭维里特:消灭远古木乃伊:没什么"
  npc_override_moc_prydn1_quests_morocc_menu_help_034271: "帮助他:保持距离"
  npc_override_moc_prydn1_quests_morocc_menu_i_73cb54: "我也想去。:结束对话。"
  npc_override_moc_prydn1_quests_morocc_menu_mummy_b890ec: "木乃伊？发生了什么事？:假装什么都不知道。"
  npc_override_moc_prydn1_quests_morocc_menu_nevermind_b6feef: "没关系。:进入野外。"
  npc_override_moc_prydn1_quests_morocc_menu_pay_db2353: "支付5,000 Zeny出发。:算了。"
  npc_override_moc_prydn1_quests_morocc_menu_strong_e88a43: "强大的木乃伊？它们在哪里？:结束对话。"
  npc_override_moc_prydn1_quests_morocc_menu_sure_eaf5d8: "当然。:我想停止。"
  npc_override_moc_prydn1_quests_morocc_no_way_i_spent_so_159b76: "不可能！我花了那么多时间才找到那条路！！"
  npc_override_moc_prydn1_quests_morocc_oh_you_don_t_tail_f08603: "哦，你没有尾巴，对吧？他认为我是他的眼中钉，他现在想挑起争斗！"
  npc_override_moc_prydn1_quests_morocc_pah_you_don_t_care_1efd88: "呸！你不关心我？好吧，你这个叛徒！"
  npc_override_moc_prydn1_quests_morocc_precious_treasures_suppo_c20b56: "珍贵的宝藏应该藏在这里的深处秘密之地！"
  npc_override_moc_prydn1_quests_morocc_right_right_let_s_go_3a67cb: "对对……我们回去吧。"
  npc_override_moc_prydn1_quests_morocc_s_so_obvious_he_s_1a967d: "很明显他在等着从背后袭击我。"
  npc_override_moc_prydn1_quests_morocc_safe_journey_0e1277: "一路顺风。"
  npc_override_moc_prydn1_quests_morocc_stupid_mummy_slapped_me_30b2d0: "那个愚蠢的木乃伊在你转头的时候又打了我！呜呜呜……我们回去吧，喵！"
  npc_override_moc_prydn1_quests_morocc_they_t_stop_me_let_c9817e: "它们阻止不了我！我们去消灭远古木乃伊吧！！"
  npc_override_moc_prydn1_quests_morocc_verit_s_training_going_w_0d48e2: "维里特的训练还顺利吗？"
  npc_override_moc_prydn1_quests_morocc_verit_wouldn_t_dare_come_a610ba: "那个维里特应该不敢再来这里了吧？哈哈哈！"
  npc_override_moc_prydn1_quests_morocc_we_ve_received_orders_he_dee905: "我们接到总部命令，封锁这个区域，因为检测到了异常的时空现象。"
  npc_override_moc_prydn1_quests_morocc_well_s_none_my_business_8f1004: "好吧，这不关我的事。但我已经警告过你了！"
  npc_override_moc_prydn1_quests_morocc_whaaat_you_don_t_want_834a6a: "什么~你不想听我的故事？好吧！你最好不要在其他地方提到我的名字！"
  npc_override_moc_prydn1_quests_morocc_what_don_t_give_me_652066: "什么~？别给我那种表情！你知道一只猫在米德加尔特生存有多难吗！"
  npc_override_moc_prydn1_quests_morocc_what_you_re_so_irrespons_5ef1d5: "什么？你太不负责任了！"
  npc_override_moc_prydn1_quests_morocc_when_i_saw_mummy_coming_0e1f07: "当我看到木乃伊向我走来时，我就像'随便吧'一样不在乎。但后来他一个耳光把我打倒在地！他怎么敢对像我这样可爱的猫做这种事！你这个绷带怪……你等着瞧！"
  npc_override_moc_prydn1_quests_morocc_where_you_think_you_re_ec9ceb: "你以为你要去哪里！你穷得叮当响！"
  npc_override_moc_prydn1_quests_morocc_wise_choice_ea1f08: "明智的选择。"
  npc_override_moc_prydn1_quests_morocc_you_caught_me_darn_i_8d3df8: "被你抓住了！该死……我没想到我作为盗墓者的名声会这样受损……"