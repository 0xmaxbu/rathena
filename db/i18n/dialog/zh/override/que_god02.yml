  npc_override_que_god02_brisingamen_seal_ah_i_cannot_wait_533972: "啊~我已经等不及了……"
  npc_override_que_god02_brisingamen_seal_ah_i_see_df4b54: "啊，我明白了。"
  npc_override_que_god02_brisingamen_seal_ah_i_see_so_s_04acfa: "啊，我明白了。原来贝林真的将自己封印在了女神眼泪落下的涟漪之中"
  npc_override_que_god02_brisingamen_seal_ah_now_i_see_you_8731f5: "啊，现在我明白了！你想要一个拥有大致相同力量的复制品。"
  npc_override_que_god02_brisingamen_seal_ah_right_870986: "啊。对了。"
  npc_override_que_god02_brisingamen_seal_ah_right_ee16bf: "啊！对了。"
  npc_override_que_god02_brisingamen_seal_ah_s_disappointing_hear_3e37f8: "啊，听到这个真令人失望。我以为你会是帮助凯利先生的最佳人选。算了，改天再聊~"
