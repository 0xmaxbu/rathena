  npc_override_que_god02_brisingamen_seal_adventure_yes_6b2c32: "为了冒险，对吗？"
  npc_override_que_god02_brisingamen_seal_after_all_getting_odin_s_7e9145: "毕竟，像这样获得奥丁的青睐，总比被洛基折磨要好得多。"
  npc_override_que_god02_brisingamen_seal_after_all_he_might_just_67a89e: "毕竟，即使他的实验有些危险，他也可能发现一些重要的东西。"
