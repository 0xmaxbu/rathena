  npc_override_que_god02_brisingamen_seal_after_all_s_our_6eecd0: "毕竟，这是我们的"
  npc_override_que_god02_brisingamen_seal_after_peeling_off_moss_s_91ead3: "^3355FF剥开苔藓后，岩石顶部露出一系列刻有模糊文字的瓷砖。这些瓷砖可以像拼图一样移动。^000000"
