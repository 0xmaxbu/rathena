  npc_override_que_god02_brisingamen_seal_last_time_664650: "最后一次"
  npc_override_que_god02_brisingamen_seal_last_time_b40608: "那是最后一次……"
  npc_override_que_god02_brisingamen_seal_last_time_i_saw_her_62f088: "我最后一次见到她活着"
  npc_override_que_god02_brisingamen_seal_last_time_i_saw_her_be1984: "我最后一次见到她是在"
  npc_override_que_god02_brisingamen_seal_learning_about_brisingam_e88c01: "了解布里希嘉曼真是令人着迷。但既然我们现在遇到了瓶颈，我已经开始了一个新的研究项目。"
  npc_override_que_god02_brisingamen_seal_least_s_2b3ae3: "或者，至少，那是"
  npc_override_que_god02_brisingamen_seal_leave_0edd20: "但离开！"
  npc_override_que_god02_brisingamen_seal_leave_me_alone_f9646b: "让我一个人待着！"
  npc_override_que_god02_brisingamen_seal_leave_me_e10c06: "离开我"
  npc_override_que_god02_brisingamen_seal_leave_right_away_ab9dca: "马上离开。"
  npc_override_que_god02_brisingamen_seal_left_behind_midgard_38004d: "被留在米德加尔特……"
  npc_override_que_god02_brisingamen_seal_legendary_alfrick_e34a31: "传说中的阿尔弗里克"
  npc_override_que_god02_brisingamen_seal_let_everyone_live_life_714e58: "让每个人都过上"
  npc_override_que_god02_brisingamen_seal_let_me_explain_6a8642: "让我解释……"
  npc_override_que_god02_brisingamen_seal_let_me_tell_you_somethin_946212: "让我告诉你一些事情。洛文是个击剑天才。然而，她总是难以承受艰苦的训练和盔甲的重量……"
  npc_override_que_god02_brisingamen_seal_let_s_34e6ca: "我们开始吧！"
  npc_override_que_god02_brisingamen_seal_let_s_see_1f7492: "让我看看……"
  npc_override_que_god02_brisingamen_seal_let_s_see_4d37ed: "让我看看……"
  npc_override_que_god02_brisingamen_seal_let_s_see_967ef9: "让我看看。"
  npc_override_que_god02_brisingamen_seal_let_s_see_if_brisingamen_d28b73: "让我们看看布里希嘉曼能否再次制作！首先，在众神和巨人发现之前去唤醒德瓦林！"
  npc_override_que_god02_brisingamen_seal_letter_addressed_hermite_822375: "一封写给赫米特的信"
  npc_override_que_god02_brisingamen_seal_librarian_a4b6ce: "^3355FF图书管理员"
  npc_override_que_god02_brisingamen_seal_librarian_b280fc: "图书管理员！"
  npc_override_que_god02_brisingamen_seal_librarian_seems_deeply_a_770d5d: "^3355FF这位图书管理员似乎睡得很沉。如果你想查看十字军人事记录，最好不要叫醒他。^000000"
  npc_override_que_god02_brisingamen_seal_lie_royal_f85f75: "对皇家撒谎"
  npc_override_que_god02_brisingamen_seal_lies_lies_d5be27: "谎言！谎言！"
  npc_override_que_god02_brisingamen_seal_life_goes_ed491e: "生活还要继续。"
  npc_override_que_god02_brisingamen_seal_like_summon_her_0d5785: "想召唤她？"
  npc_override_que_god02_brisingamen_seal_like_water_mill_efe281: "就像水车"
  npc_override_que_god02_brisingamen_seal_like_you_handle_9b654e: "像你能够应对"
  npc_override_que_god02_brisingamen_seal_line_after_f39744: "那之后的行……"
  npc_override_que_god02_brisingamen_seal_listen_a9e8f7: "听着。这是"
  npc_override_que_god02_brisingamen_seal_listen_my_story_bdc14f: "听我的故事？"
  npc_override_que_god02_brisingamen_seal_listening_nelliorde_s_li_04ce1b: "听着内利奥尔德的谎言，你决定干脆不理他。^000000"
  npc_override_que_god02_brisingamen_seal_little_sister_lowen_fine_f720f8: "妹妹洛文很好。^000000"
  npc_override_que_god02_brisingamen_seal_lohen_phelicia_6159f1: "洛恩·菲莉西亚？"
  npc_override_que_god02_brisingamen_seal_loki_heimdall_eaf3ba: "洛基？海姆达尔？"
  npc_override_que_god02_brisingamen_seal_loki_tricked_alberich_5a76c3: "洛基欺骗了阿尔贝里克，"
  npc_override_que_god02_brisingamen_seal_long_ago_some_crusaders_7d57de: "很久以前，一些十字军进入吉芬地下城进行怪物讨伐远征。"
  npc_override_que_god02_brisingamen_seal_long_ago_there_little_bo_168847: "很久以前，有一个小男孩从未见过他的父母。只是"
  npc_override_que_god02_brisingamen_seal_longer_hear_her_885de9: "再也听不到她的声音了。^000000"
  npc_override_que_god02_brisingamen_seal_longer_us_8201b6: "不再和我们在一起。"
  npc_override_que_god02_brisingamen_seal_look_around_7f2922: "四处看看。"
  npc_override_que_god02_brisingamen_seal_looked_perfect_freya_ver_58e327: "它戴在芙蕾雅身上看起来很完美。很难制作出真正能提升美丽女神魅力的珠宝。"
  npc_override_que_god02_brisingamen_seal_looks_just_like_snowflak_236dbe: "它看起来就像一片雪花，不是吗？奇怪的是，"
  npc_override_que_god02_brisingamen_seal_looks_like_you_able_answ_fa92b3: "看来你成功回答了那个谜题。干得好！"
  npc_override_que_god02_brisingamen_seal_lot_snow_812ed9: "^3355FF大量的雪"
  npc_override_que_god02_brisingamen_seal_love_forsaken_power_97325b: "爱被权力所抛弃。^000000"
  npc_override_que_god02_brisingamen_seal_lowen_a73c15: "给洛文。"
  npc_override_que_god02_brisingamen_seal_lowen_accompanied_cb266b: "洛文陪伴"
  npc_override_que_god02_brisingamen_seal_lowen_ba6e59: "洛文……"
  npc_override_que_god02_brisingamen_seal_lowen_crusader_knight_se_002af1: "洛文是一名十字军，一名为神圣战争做准备的神圣骑士。"
  npc_override_que_god02_brisingamen_seal_lowen_did_65057f: "洛文没有"
  npc_override_que_god02_brisingamen_seal_lowen_don_t_7e8c66: "洛文不要……！"
  npc_override_que_god02_brisingamen_seal_lowen_don_t_d12ddc: "洛文，别这么做！"
  npc_override_que_god02_brisingamen_seal_lowen_ellenen_23ad63: "洛文·埃伦嫩"
  npc_override_que_god02_brisingamen_seal_lowen_ellenen_aad6e1: "洛文·埃伦嫩。"
  npc_override_que_god02_brisingamen_seal_lowen_ellenen_ca510f: "洛文·埃伦嫩，"
  npc_override_que_god02_brisingamen_seal_lowen_ellenen_misunderst_7827a1: "洛文·埃伦嫩，被误解的英雄。我现在将晋升你"
  npc_override_que_god02_brisingamen_seal_lowen_f40e29: "洛文！"
  npc_override_que_god02_brisingamen_seal_lowen_no_212f8e: "洛文不是"
  npc_override_que_god02_brisingamen_seal_lowen_s_grave_dda888: "这是洛文的坟墓。"
  npc_override_que_god02_brisingamen_seal_lowen_s_hmmm_a0e01e: "洛文的？嗯？"
  npc_override_que_god02_brisingamen_seal_lowen_s_spirit_beginning_9fac02: "洛文的灵魂开始变弱……"
  npc_override_que_god02_brisingamen_seal_lowen_s_spirit_t_keep_9fc809: "洛文的灵魂无法再让你留在过去。"
  npc_override_que_god02_brisingamen_seal_mad_scientist_he_s_antis_94c800: "疯狂科学家。他性格孤僻，他的实验造成了很多公共骚乱。"
  npc_override_que_god02_brisingamen_seal_made_me_laugh_651ea8: "让我笑了。"
  npc_override_que_god02_brisingamen_seal_make_red_potions_96cc5a: "制作红药水？"
  npc_override_que_god02_brisingamen_seal_makes_sense_you_want_rep_5d5d58: "你想要布里希嘉曼的复制品以获得它的力量，这说得通。但请记住，我们最初制作布里希嘉曼是作为适合女神的项链。"
  npc_override_que_god02_brisingamen_seal_man_sanctuary_70440c: "圣殿里的那个人？"
  npc_override_que_god02_brisingamen_seal_masterpiece_af53d2: "杰作。"
  npc_override_que_god02_brisingamen_seal_masterpiece_cf7c1d: "杰作！"
  npc_override_que_god02_brisingamen_seal_masterpiece_you_b69837: "杰作？你"
  npc_override_que_god02_brisingamen_seal_materials_brisingamen_hu_fb84a6: "布里希嘉曼的材料？对于人类仿制品来说，材料很容易收集……"
  npc_override_que_god02_brisingamen_seal_matrimony_freya_f10b33: "与芙蕾雅的婚姻"
  npc_override_que_god02_brisingamen_seal_may_go_back_now_9e29ad: "现在可以回去了！"
  npc_override_que_god02_brisingamen_seal_may_i_hit_rich_90025a: "我能靠这个发财吗"
  npc_override_que_god02_brisingamen_seal_may_i_talk_you_10f95c: "我可以和你谈谈吗……？^000000"
  npc_override_que_god02_brisingamen_seal_may_wise_a0d00d: "也许是明智的"
  npc_override_que_god02_brisingamen_seal_maybe_there_s_e8868b: "也许有"
  npc_override_que_god02_brisingamen_seal_me_let_s_see_ah_e2d005: "对我来说是，让我看看，啊……"
  npc_override_que_god02_brisingamen_seal_mean_you_b65554: "那意味着你"
  npc_override_que_god02_brisingamen_seal_means_chaos_5efaaa: "意味着。是地狱的混沌"
  npc_override_que_god02_brisingamen_seal_memorize_all_five_lines_e3e6a5: "准确记住这首歌的五句歌词。现在拿着这颗金色泪滴，请去寻找格尔。"
  npc_override_que_god02_brisingamen_seal_menu_about_2c88cd: "关于普隆德拉！:关于海边地区。:沙漠还热吗？:边境地区怎么样？"
  npc_override_que_god02_brisingamen_seal_menu_about_f2a882: "关于普隆德拉！:关于沿海地区。:沙漠还热吗？:边境地区怎么样？"
  npc_override_que_god02_brisingamen_seal_menu_adjust_113f84: "调整拼图。:退出。"
  npc_override_que_god02_brisingamen_seal_menu_alfrik_b10702: "阿尔弗里克:确认。"
  npc_override_que_god02_brisingamen_seal_menu_alright_d51681: "……好吧。:对不起，我觉得我做不了。"
  npc_override_que_god02_brisingamen_seal_menu_bragi_068ed4: "布拉吉的诗歌:永恒混沌:夕阳下的刺客"
  npc_override_que_god02_brisingamen_seal_menu_bragi_c606c3: "布拉吉的诗歌:永恒混沌:夕阳下的刺客:尼伯龙根的指环"
  npc_override_que_god02_brisingamen_seal_menu_but_e0e912: "但我一到那里就后悔了。当然，景色令人叹为观止:海边的沙丘，"
  npc_override_que_god02_brisingamen_seal_menu_dvalin_8142a8: "德瓦林想让你醒来！:先告诉我你是谁！"
  npc_override_que_god02_brisingamen_seal_menu_dvalin_cf8551: "德瓦林:确认。"
  npc_override_que_god02_brisingamen_seal_menu_grer_66129b: "格尔:吼吼，我不会等太久的！"
  npc_override_que_god02_brisingamen_seal_menu_grer_70ff7c: "格尔:快点证明我可以信任你！"
  npc_override_que_god02_brisingamen_seal_menu_grer_93f44e: "格尔:再见，人类！"
  npc_override_que_god02_brisingamen_seal_menu_help_010050: "救命！:阿尔弗里克派我来唤醒你！"
  npc_override_que_god02_brisingamen_seal_menu_holy_1a3de4: "天哪……！快跑！:你是什么？！"
  npc_override_que_god02_brisingamen_seal_menu_i_14d8ee: "我只是想打个招呼。:布里希嘉曼的材料是什么？"
  npc_override_que_god02_brisingamen_seal_menu_i_1cafec: "我不确定……:我想你是对的。"
  npc_override_que_god02_brisingamen_seal_menu_i_6a0900: "我不擅长找人。:我可以做到！"
  npc_override_que_god02_brisingamen_seal_menu_i_8b3cff: "我不怕怪物或死亡。我怕的是她可能现在恨我。我害怕的是:洛文的责备。"
  npc_override_que_god02_brisingamen_seal_menu_i_cee08a: "我会做任何你想做的事，如果你做我想让你做的事。很简单:找出任何你能找到的关于洛文的信息。"
  npc_override_que_god02_brisingamen_seal_menu_i_f21f94: "我是贝林派来的。:哇，你吓到我了！"
  npc_override_que_god02_brisingamen_seal_menu_ignore_fcbad0: "无视它。:你在说什么？"
  npc_override_que_god02_brisingamen_seal_menu_leave_275a15: "别管他。:给他凯利的信。"
  npc_override_que_god02_brisingamen_seal_menu_lowen_ad8512: "洛文，兄弟姐妹:洛文，配偶:洛文，敌人:洛文，朋友"
  npc_override_que_god02_brisingamen_seal_menu_no_4bf818: "没有人，那是个意外！:是女武神。"
  npc_override_que_god02_brisingamen_seal_menu_no_62c7d6: "不用了，谢谢。:当然，为什么不呢。"
  npc_override_que_god02_brisingamen_seal_menu_of_d31957: "当然。:对不起，我觉得我不行……"
  npc_override_que_god02_brisingamen_seal_menu_step_8848c9: "踩上去。:清扫表面。:刮擦表面。:踢它。"
  npc_override_que_god02_brisingamen_seal_menu_still_085eb9: "仍在风中 lingering。:致风中飘散的气息:我们给予:致那诱人的红唇:我们的心在"
  npc_override_que_god02_brisingamen_seal_menu_sure_6a5c9c: "当然！听起来不错。:对不起，我没那么感兴趣。"
  npc_override_que_god02_brisingamen_seal_menu_sure_b55f3b: "当然！:实际上我很忙。"
  npc_override_que_god02_brisingamen_seal_menu_sure_f6c68d: "当然，为什么不呢~:有什么新闻吗？:不用了，谢谢。"
  npc_override_que_god02_brisingamen_seal_menu_sweep_8faa10: "用手扫开积雪。:用手指戳雪。:取消。"
  npc_override_que_god02_brisingamen_seal_menu_tell_b62eb6: "给我讲个故事。:为我唱首歌。"
  npc_override_que_god02_brisingamen_seal_menu_to_15f05f: "致路上滴落的泪滴:致风中飘散的气息:致那些温柔的泪滴:致那诱人的红唇:我们的心在"
  npc_override_que_god02_brisingamen_seal_menu_to_189ba4: "致那金色的秀发:致那美丽的秀发:我们所有人的心在:致那脚步:致那耀眼的双眼"
  npc_override_que_god02_brisingamen_seal_menu_to_80cb95: "致路上滴落的泪滴:致风中飘散的气息:我们给予:致那诱人的红唇:那些诱人的红唇"
  npc_override_que_god02_brisingamen_seal_menu_to_b0520c: "致路上滴落的泪滴:她可爱的气息:我们给予:致那诱人的红唇:我们的心在"
  npc_override_que_god02_brisingamen_seal_menu_to_fea0be: "致路上滴落的泪滴:致风中飘散的气息:我们给予:我们献出了心:我们的心在"
  npc_override_que_god02_brisingamen_seal_menu_uhhhhh_4a99d1: "嗯……:对不起，我不能。:你最后一次见到她是什么时候？"
  npc_override_que_god02_brisingamen_seal_menu_valkyrie_f9d49c: "女武神告诉我的。:那是个巧合！"
  npc_override_que_god02_brisingamen_seal_menu_wah_0fd59a: "哇？还没结束？！:这次又是什么？"
  npc_override_que_god02_brisingamen_seal_menu_wanes_1a76d9: "相形见绌:致那美丽的秀发:我们所有人的心:星辰之美:致那耀眼的双眼"
  npc_override_que_god02_brisingamen_seal_menu_we_5b929e: "我们给予:致那美丽的秀发:我们所有人的心在:致那脚步:我们失去了心"
  npc_override_que_god02_brisingamen_seal_menu_we_8b90d7: "我们给予:致那美丽的秀发:还有那耀眼的双眼。:致那脚步:致那耀眼的双眼"
  npc_override_que_god02_brisingamen_seal_menu_we_94775c: "我们给予:相形见绌。:我们所有人的心在:致那脚步:致那耀眼的双眼"
  npc_override_que_god02_brisingamen_seal_menu_wee_144778: "哇~我想听！:无聊~"
  npc_override_que_god02_brisingamen_seal_menu_where_18e79d: "他在哪里？:告诉我更多关于布里希嘉曼的事。"
  npc_override_que_god02_brisingamen_seal_menu_who_dd49cc: "你是谁？:有什么新闻？:你能唱歌吗？"
  npc_override_que_god02_brisingamen_seal_menu_yes_141459: "是:否"
  npc_override_que_god02_brisingamen_seal_menu_yes_c1f8ff: "是的，我会跟随你。:嗯……我不是洛文。"
  npc_override_que_god02_brisingamen_seal_menu_yes_d610aa: "是的，我想。:不用了，谢谢。"
  npc_override_que_god02_brisingamen_seal_menu_yes_faebdc: "是的。:我需要更多时间。"
  npc_override_que_god02_brisingamen_seal_menu_you_b21533: "你被诅咒了……？:你还有事情要做。"
  npc_override_que_god02_brisingamen_seal_merely_out_consideration_bfc1e3: "仅仅是出于考虑，"
  npc_override_que_god02_brisingamen_seal_message_lowen_992383: "来自洛文的消息？"
  npc_override_que_god02_brisingamen_seal_met_alfrik_9d245a: "见过阿尔弗里克……？"
  npc_override_que_god02_brisingamen_seal_met_hermite_hm_e83c20: "见过赫米特？嗯？"
  npc_override_que_god02_brisingamen_seal_met_mr_kaili_0c29db: "见过凯利先生？"
  npc_override_que_god02_brisingamen_seal_mill_turns_tomorrow_cf4d5d: "水车转动，明天"
  npc_override_que_god02_brisingamen_seal_mind_your_own_fceaf2: "管好你自己的"
  npc_override_que_god02_brisingamen_seal_misunderstood_hero_7b4071: "被误解的英雄。"
  npc_override_que_god02_brisingamen_seal_mmm_56bb18: "嗯……？"
  npc_override_que_god02_brisingamen_seal_month_s_paycheck_03ccd4: "这个月的工资在……"
  npc_override_que_god02_brisingamen_seal_more_her_beauty_exists_w_43679f: "她的美丽在这个世界上存在得越多，我就越幸福。我非常愿意帮助你重现这件芙蕾雅的纪念品。"
  npc_override_que_god02_brisingamen_seal_more_say_now_1b850a: "还有要说的！现在"
  npc_override_que_god02_brisingamen_seal_more_than_b98e90: "不止这些。"
