  npc_override_que_god02_brisingamen_seal_as_you_sweep_snow_palm_d9938a: "^3355FF当你用手掌扫开积雪时，部分雪融化了，露出了一个奇怪的谜题立方体。它是多面的，但你可以读到每个面都刻着一句歌词。"
  npc_override_que_god02_brisingamen_seal_as_you_wish_81f1fd: "如你所愿~"
