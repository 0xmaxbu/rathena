  npc_override_que_god02_brisingamen_seal_ah_you_wish_302aa7: "啊，你希望"
  npc_override_que_god02_brisingamen_seal_ahead_point_87f9f2: "前面。从这一点"
  npc_override_que_god02_brisingamen_seal_ahem_de09b5: "或者 ^333333*咳咳*^000000"
  npc_override_que_god02_brisingamen_seal_ahem_my_reward_2960d7: "^333333*咳咳！*^000000 我的报酬！"
  npc_override_que_god02_brisingamen_seal_air_quietly_drifts_here_e2aa0e: "这里静静飘动的空气中带着她的芬芳气息。你可以借助这风来借用她的力量。"
  npc_override_que_god02_brisingamen_seal_al_de_baran_265c7a: "在艾尔帕兰"
  npc_override_que_god02_brisingamen_seal_alas_information_doesn_t_9614b0: "唉，这些信息对你这样的人来说似乎没什么价值。"
  npc_override_que_god02_brisingamen_seal_alberich_cursed_his_ring_6eb40c: "^4D4DFF但阿尔贝里克诅咒了他的戒指"
  npc_override_que_god02_brisingamen_seal_alberich_had_known_50124b: "阿尔贝里克早已知道"
  npc_override_que_god02_brisingamen_seal_alfrik_8f2bf0: "阿尔弗里克？"
  npc_override_que_god02_brisingamen_seal_alfrik_ac9756: "阿尔弗里克会"
  npc_override_que_god02_brisingamen_seal_alfrik_one_four_dwarves_5c2fec: "阿尔弗里克是四位矮人之一，他们为女神芙蕾雅打造了世界上最美丽的项链——布里希嘉曼。"
  npc_override_que_god02_brisingamen_seal_all_confidential_personn_6a71ff: "所有机密人事档案都保存在皇家图书馆。不过，你需要授权"
  npc_override_que_god02_brisingamen_seal_all_forty_two_c2267f: "所有四十二"
  npc_override_que_god02_brisingamen_seal_all_i_her_just_earnestly_6f4e1f: "我所能为她做的只是虔诚地祈祷。我没想到再也见不到她会是如此痛苦……"
  npc_override_que_god02_brisingamen_seal_all_i_remember_i_lutie_0b9acd: "我只记得我在雪城姜饼城。我走过一座桥，去了西边的一座山……"
  npc_override_que_god02_brisingamen_seal_all_i_tell_you_there_9cce13: "我只能告诉你，曾有一位十字军叫这个名字。"
  npc_override_que_god02_brisingamen_seal_all_my_fault_454d05: "都是我的错……"
  npc_override_que_god02_brisingamen_seal_all_my_late_comrades_i_7ea884: "我在尼芙菲姆遇到的所有已故战友都被女武神选中，送往了英灵殿。这就是光荣的十字军度过来世的方式。但看来我不配……"
  npc_override_que_god02_brisingamen_seal_all_our_hearts_4512cc: "我们所有人的心在"
  npc_override_que_god02_brisingamen_seal_all_us_awakened_adb88e: "我们所有人都苏醒了。"
  npc_override_que_god02_brisingamen_seal_all_us_came_here_geffen_74e096: "我们所有人都来到吉芬，为了净化这片区域的恶灵。你问我为什么留在这个可怕的地方？"
  npc_override_que_god02_brisingamen_seal_alright_17187c: "好吧。"
  npc_override_que_god02_brisingamen_seal_alright_i_shall_contact_099564: "好吧，我这就联系他！哦，你可以在朱诺中央广场西边找到怪物组织。不难找到。祝你好运！"
  npc_override_que_god02_brisingamen_seal_alright_let_s_give_try_66c402: "好吧，让我们试试看。"
  npc_override_que_god02_brisingamen_seal_alright_now_e2ac6c: "好吧，现在"
  npc_override_que_god02_brisingamen_seal_although_created_humans_50d4a5: "虽然那是人类建造的，但那个地下城现在已被诅咒，栖息着可怕的怪物。"
  npc_override_que_god02_brisingamen_seal_although_he_never_unders_a3c907: "虽然他从未理解这一点，但他知道只要能靠近她，远远地看着她，他就会感到幸福。"
  npc_override_que_god02_brisingamen_seal_although_i_give_freely_m_4b6f39: "虽然我可以随意提供建议，但我们四个矮人除非接到芙蕾雅的命令，否则不再从事锻造工作。"
  npc_override_que_god02_brisingamen_seal_always_3ca16e: "永远都会……！"
  npc_override_que_god02_brisingamen_seal_and_f0fa6b: "而且……"
  npc_override_que_god02_brisingamen_seal_anger_your_fdff92: "你的愤怒"
  npc_override_que_god02_brisingamen_seal_another_puzzle_4706b7: "又一个谜题？"
  npc_override_que_god02_brisingamen_seal_answer_question_0d76a4: "能够回答这个问题。"
  npc_override_que_god02_brisingamen_seal_any_case_a7b60e: "无论如何，那将会"
  npc_override_que_god02_brisingamen_seal_any_case_i_finally_arriv_ece17c: "无论如何，我终于到达了帕罗斯灯塔。在那里，我得知那栋老房子是流氓公会的秘密营地。"
  npc_override_que_god02_brisingamen_seal_any_case_s_about_time_91e3b5: "无论如何，是时候调查贝林了。有"
  npc_override_que_god02_brisingamen_seal_any_case_we_ve_never_439b8b: "无论如何，我们再也没有见过真正的布里希嘉曼。但可以创造出非常相似的东西……"
  npc_override_que_god02_brisingamen_seal_any_leads_yes_monastery_535189: "有什么线索吗？修道院，"
  npc_override_que_god02_brisingamen_seal_any_male_siblings_348b66: "有男性兄弟姐妹！"
  npc_override_que_god02_brisingamen_seal_any_place_her_heart_e8c801: "在她心中的任何位置。"
  npc_override_que_god02_brisingamen_seal_anything_df9d7a: "任何"
  npc_override_que_god02_brisingamen_seal_anything_else_3c305d: "还有别的"
  npc_override_que_god02_brisingamen_seal_anything_you_4f5425: "你能"
  npc_override_que_god02_brisingamen_seal_anyway_fortress_sandarum_fbd44e: "总之，桑达鲁曼要塞在去帕罗斯灯塔的路上。我记得我在南梦罗克遇到的塞鲁特罗曾向我描述过那里的美景。"
  npc_override_que_god02_brisingamen_seal_anyway_now_my_brothers_4b2fd2: "总之，现在我的兄弟们"
  npc_override_que_god02_brisingamen_seal_anyway_thank_you_visitin_925733: "总之，感谢你的来访"
  npc_override_que_god02_brisingamen_seal_anyways_i_know_one_inter_11c267: "对了，我知道一条关于普隆德拉的有趣消息。但这是个秘密。嘘！你……单身吗？"
  npc_override_que_god02_brisingamen_seal_anyways_i_one_interestin_11c67d: "对了，我有一条关于普隆德拉的有趣消息。不过，这是个秘密。嘘！你……单身吗？"
  npc_override_que_god02_brisingamen_seal_appear_before_human_eyes_944b45: "出现在人类眼前？"
  npc_override_que_god02_brisingamen_seal_arch_enemy_e48a82: "死敌……？"
  npc_override_que_god02_brisingamen_seal_as_mad_scientist_he_s_e3e406: "被称为\\\\\\\"疯狂科学家\\\\\\\"。他性格孤僻，他的实验造成了很多公共骚乱。"
  npc_override_que_god02_brisingamen_seal_as_nelliorde_probably_me_270215: "正如内利奥尔德可能提到的，"
