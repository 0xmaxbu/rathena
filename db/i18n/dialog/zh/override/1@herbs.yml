  npc_override_1@herbs_HiddenGarden_objective_evaluation_red_81e309: "客观评估减少了管理此处的自动人偶的工作错误，帮助它们近乎完美地履行职责。"
  npc_override_1@herbs_HiddenGarden_obtaining_information_ed_8b8ba0: "获取可食用植物的信息。寻找古代萝卜种植记录。"
  npc_override_1@herbs_HiddenGarden_occasionally_some_them_r_d7183f: "偶尔其中一些会被改造成奇特的形状以进行功能测试。"
  npc_override_1@herbs_HiddenGarden_oh_90b83d: "哦。"
  npc_override_1@herbs_HiddenGarden_oh_early_form_called_red_8fc8f6: "哦。这是被瓦尔蒙德称为红辣椒的早期形态。我针对辅助工作进行了优化。"
  npc_override_1@herbs_HiddenGarden_oh_i_ll_record_subsequen_758ec2: "哦，我会记录后续信息供下次引导使用。你可以安心回去。"
  npc_override_1@herbs_HiddenGarden_oh_s_possible_he_might_aedeca: "哦，那是有可能的。他可能让你忘记了你看到的东西……"
  npc_override_1@herbs_HiddenGarden_oh_s_true_master_varmund_1ccdae: "哦，瓦尔蒙德主人确实制作了自动人偶的原型。但它们跟我一样，只有简单的功能。"
  npc_override_1@herbs_HiddenGarden_oh_she_must_been_observi_595a0c: "哦……她一定也在观察你。"
  npc_override_1@herbs_HiddenGarden_okay_i_follow_instructio_78d0f2: "好。我会遵照指示。"
  npc_override_1@herbs_HiddenGarden_okay_now_i_set_as_d07711: "好。从现在开始，我将把[{0}]设置为我们的临时管理员并采取相应行动。你同意吗？"
  npc_override_1@herbs_HiddenGarden_once_they_find_out_varmu_caeb75: "但一旦她们发现瓦尔蒙德还活着，她们就无法关闭这个地方。"
  npc_override_1@herbs_HiddenGarden_one_charge_place_pimp_au_5bdd90: "负责这个地方的是皮姆25号。以这个世界的创造物为原型制作的自动人偶。"
