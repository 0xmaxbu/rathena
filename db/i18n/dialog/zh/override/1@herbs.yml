  npc_override_1@herbs_HiddenGarden_we_clearly_checked_which_f7ef10: "我们清楚地检查了花园的哪个部分需要改进。现在剩下的就是协商了。"
  npc_override_1@herbs_HiddenGarden_we_d_like_believe_master_9e1a85: "我们愿意相信瓦尔蒙德主人还活着，但以人类的寿命来说那是不可能的。"
  npc_override_1@herbs_HiddenGarden_we_felt_something_about_74cdca: "我们对提升技能对他有帮助这件事有所感触。那一定是一种喜悦的感觉。"
  npc_override_1@herbs_HiddenGarden_we_originally_holographi_b491ab: "我们原本是基于全息设备的研究支持AI。我甚至无法施加任何物理力量。"
  npc_override_1@herbs_HiddenGarden_we_overlaid_our_memories_632452: "我们重叠了我们的记忆，并将它们改造成瓦尔蒙德主人形象的人形"
  npc_override_1@herbs_HiddenGarden_we_satisfied_criteria_te_c88a08: "我们已满足临时管理员[{0}]的标准，将保持当前的管理程序不变。"
  npc_override_1@herbs_HiddenGarden_we_start_site_inspection_1cff0f: "我们将根据临时管理员响应协议开始花园的现场检查。"
  npc_override_1@herbs_HiddenGarden_we_ve_been_working_organ_aa919d: "我们一直在 alongside 瓦尔蒙德的研究组织和记录过程。"
  npc_override_1@herbs_HiddenGarden_well_done_you_may_go_f1d367: "干得好。你现在可以走了。"
