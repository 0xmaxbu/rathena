  npc_override_1@herbs_HiddenGarden_what_s_difference_betwee_a33502: "你们的任务之间有什么区别？"
  npc_override_1@herbs_HiddenGarden_whether_research_mission_87458a: "此自动人偶的研究任务方向应该改进、继续还是废弃。等待管理员的决定。"
  npc_override_1@herbs_HiddenGarden_while_master_varmundt_st_e7acdd: "瓦尔蒙德主人还在的时候，职责进度以个人报告和每周现场评估的形式进行检查。"
  npc_override_1@herbs_HiddenGarden_who_0d59a8: "那是谁？"
  npc_override_1@herbs_HiddenGarden_who_s_3a5109: "那是谁？？"
  npc_override_1@herbs_HiddenGarden_why_flower_garden_exist_305489: "花园为什么存在？"
  npc_override_1@herbs_HiddenGarden_wise_choice_caf5f5: "明智的选择。"
  npc_override_1@herbs_HiddenGarden_you_answer_me_you_met_03a11a: "你能回答我吗？你以前见过瓦尔蒙德吗？"
  npc_override_1@herbs_HiddenGarden_you_cannot_proceed_next_0c974f: "如果你没有队伍领袖的权限，就无法进行下一步。"
  npc_override_1@herbs_HiddenGarden_you_cannot_receive_any_m_5017ef: "你携带的物品太多了，无法再接收物品。请减轻负重后再试一次。^000000"
  npc_override_1@herbs_HiddenGarden_you_confused_me_pimp_sha_21c890: "你把我搞糊涂了！皮姆只执行给定的任务。不要再跟我说话了管理员。"
  npc_override_1@herbs_HiddenGarden_you_did_great_making_the_3d6ada: "你让她们投降做得很好，但我认为你没有被授予任何管理员权限。"
  npc_override_1@herbs_HiddenGarden_you_done_talking_convers_5c9458: "你说完了吗？这里的对话被记录为评估数据。让我们前往下一个区域。"
  npc_override_1@herbs_HiddenGarden_you_found_874a38: "你找到了吗？"
  npc_override_1@herbs_HiddenGarden_you_go_tell_them_varmund_f3ccc5: "你能去告诉她们瓦尔蒙德还活着吗？"
