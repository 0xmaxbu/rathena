  npc_override_1@herbs_HiddenGarden_place_restricted_unless_25c8a2: "除非你有与瓦尔蒙德魔力相同的图案，否则这个地方是受限制的。听说有外人在花园里面，我很惊讶。"
  npc_override_1@herbs_HiddenGarden_plants_currently_growing_d8dc15: "目前正在种植的植物。南瓜在控制人体血管中的钠方面显示出显著效果。"
