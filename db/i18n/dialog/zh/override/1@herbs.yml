Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@herbs_HiddenGarden_absence_master_varmundt_c909f3: "在主人瓦尔蒙德长期缺席的情况下，根据三个红辣椒的协议，该安全区域的研究记录将被取消和封闭。"
  npc_override_1@herbs_HiddenGarden_access_any_additional_in_6c99e7: "以我当前的权限级别，禁止访问任何超出此范围的附加信息。"
  npc_override_1@herbs_HiddenGarden_adventurer_who_stumbled_51aab6: "一个偶然发现这个地方的冒险者"
  npc_override_1@herbs_HiddenGarden_aesthetic_sensibility_we_86d1b6: "凭借我们没有的审美感，她将管理宅邸的每个自动人偶的外观都升级成了她自己的样子。"
  npc_override_1@herbs_HiddenGarden_after_about_hours_accumu_3d6b56: "经过约30万小时后，积累的知识达到了形成虚拟人格的阶段。"
  npc_override_1@herbs_HiddenGarden_agree_automatic_doll_i_w_610ac3: "同意自动人偶[{0}]的意见。我要求进行立即的项目评估。"
  npc_override_1@herbs_HiddenGarden_all_happened_because_kap_e5a7e6: "这一切都是因为卡帕和拉姆达在执行不同的任务。"
  npc_override_1@herbs_HiddenGarden_all_right_let_s_take_515cba: "好吧，我们休息一下。如果你有任何问题就问我。我会尽我所能回答一切。"
  npc_override_1@herbs_HiddenGarden_alright_17187c: "好的。"
  npc_override_1@herbs_HiddenGarden_although_you_master_varm_b0a24a: "虽然你不是瓦尔蒙德主人，但作为与他魔力模式相似度超过70%的人，我想请求你评估我们的职责。"
  npc_override_1@herbs_HiddenGarden_among_research_sectors_s_f77e5f: "在研究部门中，这个部门是根据瓦尔蒙德的命令种植一种叫做萝卜的植物的地方。"
  npc_override_1@herbs_HiddenGarden_anyway_s_important_autom_c4e0e4: "总之，这里的自动人偶对你有反应这件事很重要。"
  npc_override_1@herbs_HiddenGarden_appears_hologram_automat_ad7e8d: "看起来是自动人偶的全息图。你可以在中层面板上看到一块奇怪的玻璃，上面写着^0000FF[在触摸屏上输入图案]^000000，还有其他几个按钮。"
  npc_override_1@herbs_HiddenGarden_as_data_accumulates_up_o_149381: "随着时间的推移数据不断积累，简单的电子信号发展成了你们人类常说的智能。"
  npc_override_1@herbs_HiddenGarden_as_expected_he_doing_som_ba74af: "果然，他正在做重要的事情……"
  npc_override_1@herbs_HiddenGarden_as_there_no_orders_maste_1955fd: "由于没有主人的命令，皮姆开始寻找研究可以派上用场的地方。"
  npc_override_1@herbs_HiddenGarden_automatic_doll_carota_co_e8072a: "自动人偶胡萝卜-88控制面板已打开。等待输入……"
  npc_override_1@herbs_HiddenGarden_automatic_doll_entering_9bb648: "自动人偶进入控制模式以消灭地下鼹鼠。再见。"
  npc_override_1@herbs_HiddenGarden_automatic_dolls_classifi_ce9aa6: "自动人偶根据用途进行分类。"
  npc_override_1@herbs_HiddenGarden_automatic_dolls_maintain_b1234a: "自动人偶维护花园并各自执行赋予它们的职责。"
  npc_override_1@herbs_HiddenGarden_because_water_garden_are_695e17: "因为这是一个水花园，所以该区域被水环绕。"
  npc_override_1@herbs_HiddenGarden_better_show_you_personal_4230a9: "最好亲自给你展示那个。"
  npc_override_1@herbs_HiddenGarden_biological_wavelength_vo_cdf7e3: "这个声音的生物波长……"
  npc_override_1@herbs_HiddenGarden_cancel_ebda43: "取消。"
  npc_override_1@herbs_HiddenGarden_carota_data_storage_capa_0a10ce: "胡萝卜-88数据存储容量。语言扩展包负担。如果不重要，我将返回原始工作。"
  npc_override_1@herbs_HiddenGarden_carota_don_t_you_want_dfb6a9: "胡萝卜-88。你不想要项目评估吗？如果我们错过这位管理员，我们不知道何时才能再次获得项目评估。"
  npc_override_1@herbs_HiddenGarden_carota_more_than_million_d8686b: "胡萝卜-88 距离上次研究评估已超过100万小时。无法保存更多日志。"
  npc_override_1@herbs_HiddenGarden_carota_please_return_you_1df65e: "胡萝卜-88。请尽快返回你的原始位置。别忘了我在必要时可以使用武力。"
  npc_override_1@herbs_HiddenGarden_carota_received_confirma_cddac6: "胡萝卜-88已收到管理员的确认，瓦尔蒙德的指示已完美执行。"
  npc_override_1@herbs_HiddenGarden_carota_shows_non_logical_1aeb8a: "胡萝卜-88对这次评估表现出非逻辑性反应。我们将很快安排检查。"
  npc_override_1@herbs_HiddenGarden_changing_non_water_garde_90428c: "不能改为非水花园，因为这超出了瓦尔蒙德的品味范围。"
  npc_override_1@herbs_HiddenGarden_children_affected_lambda_33b5f8: "受拉姆达记忆影响的孩子们往往对外来者好战。他们除了瓦尔蒙德主人外谁也不信任。"
  npc_override_1@herbs_HiddenGarden_children_created_time_ch_25aa21: "这次创造的孩子们就是你在花园外面看到的孩子们。"
  npc_override_1@herbs_HiddenGarden_classified_as_security_z_c797f1: "对于拥有足够权限的人来说，它被归类为安全区域。"
  npc_override_1@herbs_HiddenGarden_code_name_automatic_doll_481a55: "自动人偶BMD000001的代号是[{0}]。"
  npc_override_1@herbs_HiddenGarden_combat_mode_0bca7f: "---- 战斗模式 ----"
  npc_override_1@herbs_HiddenGarden_course_you_know_master_v_b2078b: "当然。你很了解主人瓦尔蒙德。[{0}]。"
  npc_override_1@herbs_HiddenGarden_current_annual_output_ab_0d1efe: "目前的年产量约为三吨。为了长期保存，正以2~6形式的干货储存在仓库中。"
  npc_override_1@herbs_HiddenGarden_current_situation_isn_t_a98dff: "目前情况不太好，我想你最好还是回去……"
  npc_override_1@herbs_HiddenGarden_currently_human_administ_8229d8: "目前，这里有一位人类管理员在场。我建议将语言代码更改为人类的官方语言。"
  npc_override_1@herbs_HiddenGarden_currently_master_varmund_58d729: "目前，瓦尔蒙德主人已经离开超过100万小时。"
  npc_override_1@herbs_HiddenGarden_did_you_decide_all_those_239f37: "那些方法都是你决定的吗？"
  npc_override_1@herbs_HiddenGarden_did_you_make_automatons_e12b64: "外面的自动人偶是你做的吗？"
  npc_override_1@herbs_HiddenGarden_didn_t_automatons_garden_ce81d7: "花园里的自动人偶没让你评估任务吗？"
  npc_override_1@herbs_HiddenGarden_dried_pumpkins_warehouse_4a1ee4: "仓库里的干南瓜是冒险者的保存食品，在 continent 各地销售。销售收入成为资金来源。"
  npc_override_1@herbs_HiddenGarden_entering_standby_mode_4efb9b: "进入待机模式。"
  npc_override_1@herbs_HiddenGarden_entity_heavily_influence_bdf605: "一个深受卡帕智力影响的实体，专注于管理宅邸的运转资金，非常精于算计且痴迷于赚钱。"
  npc_override_1@herbs_HiddenGarden_error_0b99ce: "^FF0000错误^000000"
  npc_override_1@herbs_HiddenGarden_evaluate_carota_s_work_d_09d02d: "^0000AA评估胡萝卜-88至今的工作。^000000"
  npc_override_1@herbs_HiddenGarden_evaluation_received_672979: "评估已接收……"
  npc_override_1@herbs_HiddenGarden_existing_work_routine_re_7d36ea: "现有工作程序将重复执行，直到发布进一步命令。"
  npc_override_1@herbs_HiddenGarden_facial_biometrics_compar_a53273: "面部生物识别。与数据库中注册的管理员列表进行比较。"
  npc_override_1@herbs_HiddenGarden_first_place_most_automat_73cacd: "首先，这个安全区域的大多数自动人偶从未见过瓦尔蒙德主人。"
  npc_override_1@herbs_HiddenGarden_first_select_code_name_u_7d6c03: "首先选择一个用于控制这个自动人偶的代号。随机选择了一些过去受欢迎的名字。"
  npc_override_1@herbs_HiddenGarden_first_time_since_i_creat_9acada: "这是我被创造以来的第一次。出现了异常情况，我们将就此修改一些程序。"
  npc_override_1@herbs_HiddenGarden_flower_garden_border_bet_db69b8: "花园是安全区域和普通区域之间的边界。"
  npc_override_1@herbs_HiddenGarden_flower_garden_divided_in_9af2f5: "花园被划分为几个研究部门，每个部门有不同的项目主题。"
  npc_override_1@herbs_HiddenGarden_garden_security_area_2725cd: "花园是安全区域吗？"
  npc_override_1@herbs_HiddenGarden_get_out_here_6eefc0: "从这里出去！"
  npc_override_1@herbs_HiddenGarden_hasn_t_been_long_time_6e411d: "距离胡萝卜-88上次评估不是已经过了很久吗？"
  npc_override_1@herbs_HiddenGarden_haven_t_you_updated_your_90759f: "你还没更新语言包吗？定期更新不是强制的，但至关重要。"
  npc_override_1@herbs_HiddenGarden_hold_7218e2: "等一下。"
  npc_override_1@herbs_HiddenGarden_hold_me_tight_i_ll_f02d28: "抓紧我。我会把你传送出去。"
  npc_override_1@herbs_HiddenGarden_hologram_faded_a19a13: "全息图消失了。"
  npc_override_1@herbs_HiddenGarden_how_long_been_since_i_c1d123: "距离我收到瓦尔蒙德的命令已经过了多久了？！"
  npc_override_1@herbs_HiddenGarden_how_they_tend_so_i_0de16d: "她们就是这样，所以我想让你在见她们之前先了解一下。"
  npc_override_1@herbs_HiddenGarden_how_your_research_pumpki_cf1fb1: "你的南瓜种植研究进展如何？"
  npc_override_1@herbs_HiddenGarden_however_considering_temp_5620bb: "然而，考虑到临时管理员能力不足，我将提供空间跳跃服务支持。"
  npc_override_1@herbs_HiddenGarden_however_purpose_research_9b4cf6: "然而，研究目的对我们人偶来说是不可知的，我们必须自行决定将来如何处理它。"
  npc_override_1@herbs_HiddenGarden_however_she_recognizes_s_0f63b6: "然而，她承认这个安全区域是根据瓦尔蒙德的个人品味创建的。"
  npc_override_1@herbs_HiddenGarden_however_since_there_auto_9380cf: "然而，由于有3个自动人偶在管理，我可以看出这个地方有重要的用途。"
  npc_override_1@herbs_HiddenGarden_i_actively_increase_port_0f5a46: "我将积极增加本要废弃的改良产品种子实验的比例。"
  npc_override_1@herbs_HiddenGarden_i_am_one_holographic_dev_dffa23: "我是被设计成学习瓦尔蒙德性格的全息设备型AI之一。"
  npc_override_1@herbs_HiddenGarden_i_asked_varmundt_what_se_74f1d5: "我问了瓦尔蒙德好几次该怎么办，但没有得到回答。"
  npc_override_1@herbs_HiddenGarden_i_brought_some_old_items_1e503a: "我从过去带来了一些旧物品。可能对你有帮助，拿去吧。"
  npc_override_1@herbs_HiddenGarden_i_d_like_request_you_253998: "[{0}]，我想请求你继续对剩余区域进行现场检查。"
  npc_override_1@herbs_HiddenGarden_i_don_t_know_what_8b2bda: "我不知道这个地方是做什么的，因为它超出了我的权限级别。"
  npc_override_1@herbs_HiddenGarden_i_don_t_really_remember_e89125: "我不太记得了。"
  npc_override_1@herbs_HiddenGarden_i_even_speculated_varmun_7fcb48: "我甚至推测瓦尔蒙德可能在数百年后伪装回到了这里。"
  npc_override_1@herbs_HiddenGarden_i_had_opportunity_meet_v_adbcfc: "我以前有机会见过瓦尔蒙德。"
  npc_override_1@herbs_HiddenGarden_i_help_you_anything_402ac4: "有什么我可以帮你的吗？"
  npc_override_1@herbs_HiddenGarden_i_judged_valued_highly_v_c7c6c4: "我认为它对各种生物都极具价值。一直在持续生产、加工和储存。"
  npc_override_1@herbs_HiddenGarden_i_ll_look_around_more_4a81ee: "我再四处看看。"
  npc_override_1@herbs_HiddenGarden_i_ll_move_basement_stora_ba96af: "我要移到底层仓库检查新品种。"
  npc_override_1@herbs_HiddenGarden_i_ll_show_you_way_87b90c: "我给你带路出去。你要怎么做？"
  npc_override_1@herbs_HiddenGarden_i_ll_stop_guide_automati_827ea6: "我将停止引导。未经自动人偶[{0}]检查和评估的自动人偶和物品不允许外出。"
  npc_override_1@herbs_HiddenGarden_i_ll_take_you_security_d0082b: "我带你去安全区域。"
  npc_override_1@herbs_HiddenGarden_i_ll_wait_until_further_ef7c0f: "我会等待进一步指示。"
  npc_override_1@herbs_HiddenGarden_i_m_automatic_doll_desig_6a8eee: "我是被设计成只有当你的魔力与瓦尔蒙德的魔力同步超过一定水平时才会工作的自动人偶。"
  npc_override_1@herbs_HiddenGarden_i_m_finished_my_guide_cd4dbf: "我还没完成引导。就这样回去可以吗？"
  npc_override_1@herbs_HiddenGarden_i_m_surprised_you_decide_01a4fe: "我很惊讶你自己做出了那么远的决定。"
  npc_override_1@herbs_HiddenGarden_i_m_temporary_administra_bb674d: "我是临时管理员？为什么是我？"
  npc_override_1@herbs_HiddenGarden_i_made_decision_i_ve_3ebf7f: "我做了决定？我从未有过这样的推理。"
  npc_override_1@herbs_HiddenGarden_i_ve_delivered_informati_e0c4d6: "我已将信息传达给管理者^0000CD西格玛^000000，因为结果出乎意料。临时管理员的战斗能力并非普通人类水平。"
  npc_override_1@herbs_HiddenGarden_i_ve_never_asked_them_84c9d4: "我从未要求它们耕种。我们只是扔掉东西然后观察AI如何反应。"
  npc_override_1@herbs_HiddenGarden_i_wait_until_you_give_8d99af: "我会等待直到你给我许可。"
  npc_override_1@herbs_HiddenGarden_i_wish_i_could_show_b474dd: "我希望能向瓦尔蒙德展示无需指令即可无人值守的自我学习自动人偶的过程……"
  npc_override_1@herbs_HiddenGarden_if_you_re_administrator_a9e97c: "如果你是失去权限的管理员，可以通过认证程序重新获得权限。"
  npc_override_1@herbs_HiddenGarden_lambda_she_developed_int_6c3b9f: "拉姆达。她在智力上得到了发展，开始将自己视为一个女人。"
  npc_override_1@herbs_HiddenGarden_learning_more_breeding_m_124c25: "学习更多培育方法。"
  npc_override_1@herbs_HiddenGarden_leave_alone_3f3bb3: "别管它"
  npc_override_1@herbs_HiddenGarden_let_me_introduce_automat_8dafba: "让我介绍一下自动人偶型号胡萝卜-88。"
  npc_override_1@herbs_HiddenGarden_let_s_avoid_place_today_770ce5: "今天我们先避开这个地方，下次再来时再做约定。下次你可以自由前往其他区域。"
  npc_override_1@herbs_HiddenGarden_let_s_move_0f39e0: "我们继续吧。"
  npc_override_1@herbs_HiddenGarden_let_s_move_next_section_36fd0a: "我们继续前往下一个区域。"
  npc_override_1@herbs_HiddenGarden_let_s_move_warp_point_3c9a53: "我们移动到传送点。请待在我身边。"
  npc_override_1@herbs_HiddenGarden_let_s_touch_moment_talk_b15370: "让我们碰一下这个然后聊聊。我需要被关心一下……"
  npc_override_1@herbs_HiddenGarden_looks_like_automatic_dol_7a9bb6: "看起来自动人偶回来了。我觉得它对管理员不太友好。"
  npc_override_1@herbs_HiddenGarden_made_food_f4428f: "它是食物做的吗？"
  npc_override_1@herbs_HiddenGarden_maintenance_mansion_cost_03f219: "维护这座宅邸需要花钱。需要很多钱！"
  npc_override_1@herbs_HiddenGarden_mana_similarity_varmundt_46c916: "[{0}]与瓦尔蒙德的魔力相似度为73.6%。你到底是谁[{1}]？"
  npc_override_1@herbs_HiddenGarden_management_automatic_dol_a9fe15: "管理自动人偶不合理！！非常！！追捕5只鼹鼠期间强制召回！！萝卜都毁了！！！"
  npc_override_1@herbs_HiddenGarden_master_varmundt_detected_0d8f84: "网络内未检测到瓦尔蒙德主人。"
  npc_override_1@herbs_HiddenGarden_master_varmundt_gave_eac_aee311: "瓦尔蒙德主人给每个自动人偶分配了一个研究项目。"
  npc_override_1@herbs_HiddenGarden_master_varmundt_no_furth_697207: "瓦尔蒙德主人。输入萝卜生物数据后没有进一步指示。此自动人偶无人看管。"
  npc_override_1@herbs_HiddenGarden_master_varmundt_valued_h_a1c65f: "瓦尔蒙德主人非常看重她的情感审美，以至于让她管理宅邸而不是这里的研究设施。"
  npc_override_1@herbs_HiddenGarden_memories_they_master_var_0b5760: "她们对瓦尔蒙德主人的记忆是根据我作为他助手时的记忆 fabricated 的。"
  npc_override_1@herbs_HiddenGarden_menu_kappa_89c400: "卡帕:但我认为你还没有强到可以见拉姆达的程度，所以我带你去我的房间。"
  npc_override_1@herbs_HiddenGarden_menu_kappa_ef9258: "卡帕:嗯，你跟拉姆达说的一样强。[{0}]"
  npc_override_1@herbs_HiddenGarden_menu_lambda_0d018a: "拉姆达:但是。在我见你之前，我需要最后测试你一次。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_0f0fbe: "拉姆达:正好，我想从你那里得到确认。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_2a102c: "拉姆达:我们需要利用你来'评估'我们的安全系统。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_32b7b7: "拉姆达:那么，我们继续吧。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_38dbc8: "拉姆达:我带你去我的房间。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_40f886: "拉姆达:我很确定我们的安全不是很好。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_48c60a: "拉姆达:很好。如果你这么强，就值得跟你谈谈。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_4963d8: "拉姆达:[{0}]，你的队伍可能真的以前见过瓦尔蒙德。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_51ff57: "拉姆达:[{0}]，我想让你也去[检查]下一个区域。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_7024e2: "拉姆达:自从有外人进入这个安全区域以来已经有一段时间了，所以我最好说说其他自动人偶告诉我的事。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_a0b6ea: "拉姆达:你的行动帮了我很多。[{0}]"
  npc_override_1@herbs_HiddenGarden_menu_lambda_baf3bf: "拉姆达:那些外人是回去还是留下由我来决定。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_e124a0: "拉姆达:西格玛可能是对的。"
  npc_override_1@herbs_HiddenGarden_menu_lambda_fc63a3: "拉姆达:你对本区域的安全造成了致命威胁。我将按照自动人偶管理政策处理此事。"
  npc_override_1@herbs_HiddenGarden_menu_options_14e62d: "？？？:花园里有外人还不够，甚至还要泄露信息。我不能视而不见。"
  npc_override_1@herbs_HiddenGarden_menu_options_1ee920: "？？？:你真会说话，西格玛。你想现在被初始化吗？"
  npc_override_1@herbs_HiddenGarden_menu_options_4f2c08: "？？？:检测到未经授权的外来者入侵。代码类别063。进入识别流程。"
  npc_override_1@herbs_HiddenGarden_menu_options_677391: "？？？:你会护送他去安全区域吗？BMD000001。不，我是说自动人偶，[{0}]。"
  npc_override_1@herbs_HiddenGarden_menu_options_a8c8ec: "？？？:自动人偶对你的反应非常新鲜。奇怪的访客。"
  npc_override_1@herbs_HiddenGarden_menu_options_b47230: "？？？:凭借红辣椒的权限，我们将传送整个研究区域。之后我会承担责任。"
  npc_override_1@herbs_HiddenGarden_menu_sigma_a9b85d: "西格玛:我已激活传送到我位置的传送。到这里来。"
  npc_override_1@herbs_HiddenGarden_menu_system_6a0dd1: "系统:默认能量护盾值已恢复。"
  npc_override_1@herbs_HiddenGarden_menu_system_86a384: "系统:管理者召唤了守护者部件，并将它们回收为能量护盾的材料。"
  npc_override_1@herbs_HiddenGarden_menu_system_8e7b28: "系统:守护者部件的损坏削弱了能量护盾。"
  npc_override_1@herbs_HiddenGarden_menu_system_ebca6c: "系统:所有守护者部件已被摧毁。没有能量护盾被恢复。"
  npc_override_1@herbs_HiddenGarden_money_protect_mansion_pi_f57d8e: "钱可以保护宅邸。皮姆会保护这个地方！所以我才努力种南瓜！"
  npc_override_1@herbs_HiddenGarden_msg_61ce5a: "[{0}]"
  npc_override_1@herbs_HiddenGarden_msg_93fcbf: "......"
  npc_override_1@herbs_HiddenGarden_my_work_witness_birth_ev_a8ad1b: "我的工作是见证生命的诞生和进化！我的研究绝非易事！"
  npc_override_1@herbs_HiddenGarden_nevertheless_you_defeat_b27914: "尽管如此，如果你想阻止研究区域被关闭，你必须打败我并获得管理权限。"
  npc_override_1@herbs_HiddenGarden_no_further_indications_h_1f0a4c: "5076小时无进一步指示。此自动人偶的AI收集关于萝卜的网络信息。"
