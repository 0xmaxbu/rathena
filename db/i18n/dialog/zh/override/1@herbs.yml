  npc_override_1@herbs_HiddenGarden_please_understand_if_my_1626bd: "如果我的语气不像机器，请理解。瓦尔蒙德是唯一跟我说话的人……"
  npc_override_1@herbs_HiddenGarden_please_understand_s_nece_0b18d6: "请理解这是防止我们的职责误入歧途的必要管理措施。"
  npc_override_1@herbs_HiddenGarden_please_use_authority_tem_b843f3: "[{0}]。请使用临时管理员的权限来判断花园的职责是否正在被忠实执行。"
  npc_override_1@herbs_HiddenGarden_please_wait_carota_here_056a78: "请等一下胡萝卜-88。这里有一位可以执行现场检查的管理员。"
  npc_override_1@herbs_HiddenGarden_please_watch_your_step_f_304dc1: "请小心脚下，跟我来。"
  npc_override_1@herbs_HiddenGarden_probably_about_more_than_f43d72: "大概……大约……已经超过100万小时了。后续设施管理由自主决定确定。"
  npc_override_1@herbs_HiddenGarden_product_automatic_doll_s_ce0e00: "该产品是序号为BMD000001的花园引导自动人偶。"
  npc_override_1@herbs_HiddenGarden_product_full_good_shape_c90338: "产品完整且状态良好。"
  npc_override_1@herbs_HiddenGarden_project_carota_grow_crop_09d7be: "胡萝卜-88的项目是在这里种植作物并保护它们免受外人侵害。你为什么离开了？"
  npc_override_1@herbs_HiddenGarden_pumpkin_produced_here_hi_79c7e7: "这里生产的南瓜含糖量高且热量充足。据人类说非常美味。附近的猫狗也吃它……"
