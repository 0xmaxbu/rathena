  npc_override_1@herbs_HiddenGarden_you_only_move_place_when_01b4e9: "只有当队伍管理者完成了所有许可后，你才能移动到该地点。请重新检查你发放的访问区域。"
  npc_override_1@herbs_HiddenGarden_you_re_face_new_me_3220dc: "你的脸对我来说很陌生。然后我意识到，也许这个人以前在某个地方见过瓦尔蒙德。"
  npc_override_1@herbs_HiddenGarden_you_re_strong_takes_lot_b22a91: "[{0}]，你很强。同时制服三个4级战斗型自动人偶需要很强的战斗力。"
