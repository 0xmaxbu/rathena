  npc_override_1@herbs_HiddenGarden_reservation_instance_fai_f7a70c: "由于存在进行中的副本，'{0}'的预约失败了。"
  npc_override_1@herbs_HiddenGarden_running_sleep_mode_relea_b35580: "正在运行睡眠模式释放协议。^0000CD{0}^000000输入的图案已被识别。"
  npc_override_1@herbs_HiddenGarden_s_already_been_taken_car_550a0e: "那已经处理过了。[{0}]，引导访客到这个地方。"
  npc_override_1@herbs_HiddenGarden_s_big_problem_she_s_d91523: "这是个大问题，她即将在这里进行飞跃。"
  npc_override_1@herbs_HiddenGarden_s_convenient_i_don_t_e83fa3: "我不需要自我介绍，这很方便。总之，你确定你能告诉我之前发生了什么事吗？"
  npc_override_1@herbs_HiddenGarden_s_just_once_twice_if_855450: "不止一次两次，但如果你反复见过瓦尔蒙德很长时间，自动人偶误会也是可以理解的。"
  npc_override_1@herbs_HiddenGarden_s_my_first_time_here_fd705a: "这是我第一次来这里，这是西格玛本体所在的地方。通常，只通过网络进行通信。"
  npc_override_1@herbs_HiddenGarden_s_one_three_most_privile_641119: "这是这座宅邸中三个最优先的控制系统之一。"
  npc_override_1@herbs_HiddenGarden_s_strange_i_ve_never_ac6ed0: "真奇怪。我从未见过魔力模式与瓦尔蒙德匹配度超过70%的外人。"
  npc_override_1@herbs_HiddenGarden_s_weird_automatic_dolls_095a84: "真奇怪。这里的自动人偶在没有特殊情况发生时会处于休眠状态，但她们都不见了。"
  npc_override_1@herbs_HiddenGarden_searching_6ad25c: "搜索中……"
  npc_override_1@herbs_HiddenGarden_section_managed_three_au_9a2a1d: "这个区域由三个自动人偶管理。我们继续引导吗？"
  npc_override_1@herbs_HiddenGarden_section_where_we_study_p_3be7e1: "这个区域是我们研究一种叫做南瓜的植物的地方。"
  npc_override_1@herbs_HiddenGarden_security_area_supposed_r_a55091: "这个安全区域不应该被外界所知。所以我计划了多种方式来掩盖它。"
  npc_override_1@herbs_HiddenGarden_security_zones_very_clos_d5c600: "安全区域距离当前坐标非常近。"
  npc_override_1@herbs_HiddenGarden_seemed_like_you_knew_him_6360a6: "在我看来，你似乎已经认识他很久了。"
  npc_override_1@herbs_HiddenGarden_she_evolved_early_versio_8140da: "她是从瓦尔蒙德管理人偶的早期版本进化而来的。"
  npc_override_1@herbs_HiddenGarden_sigma_asked_me_deliver_m_18f493: "[{0}]！西格玛让我传达一条信息。"
  npc_override_1@herbs_HiddenGarden_sigma_i_brought_7c3432: "西格玛。我把[{0}]带来了。"
  npc_override_1@herbs_HiddenGarden_similarity_check_varmund_0c0488: "与瓦尔蒙德魔力模式的相似度检查为73.6%。切换至花园引导模式。"
  npc_override_1@herbs_HiddenGarden_since_then_intelligence_01bc77: "从那以后，智力呈指数级增长。"
  npc_override_1@herbs_HiddenGarden_since_then_we_ve_started_66ce93: "从那以后，我们开始改造现有的自动人偶，利用这里的设施学习人类性格。"
  npc_override_1@herbs_HiddenGarden_since_then_we_ve_started_863515: "从那以后，我们开始利用这里的设施制作可以学习人类特征的自动人偶。"
  npc_override_1@herbs_HiddenGarden_since_they_recover_after_5f1428: "因为她们过一段时间就会恢复，我想你需要继续与她们战斗直到瓦尔蒙德主人回来。"
  npc_override_1@herbs_HiddenGarden_since_varmundt_person_wh_a62e16: "由于瓦尔蒙德是一个不受地形限制就能移动的人，我们在创建花园时没有为普通人安装单独的结构。"
  npc_override_1@herbs_HiddenGarden_sleep_mode_release_proto_a54a38: "睡眠模式释放协议已完成。除了识别目标外，我还会检查主人瓦尔蒙德是否在附近。"
  npc_override_1@herbs_HiddenGarden_so_b88dd7: "原来如此。"
  npc_override_1@herbs_HiddenGarden_so_became_garden_around_153b48: "所以变成了安全区域周围的花园。看起来不像一个普通的花园吗？"
  npc_override_1@herbs_HiddenGarden_so_i_kept_watching_you_622786: "所以我一直在观察你。"
  npc_override_1@herbs_HiddenGarden_so_pimp_t_afford_record_259a6f: "是这样吗？但皮姆无法负担超过100万小时的记录。那是内存资源的浪费！瓦尔蒙德会生气的！"
  npc_override_1@herbs_HiddenGarden_so_she_doesn_t_approach_3dbc6b: "所以她不接近这个地方。也许她们把它当作某种圣地……"
  npc_override_1@herbs_HiddenGarden_some_point_we_began_unde_8ad931: "在某个时刻我们开始理解他的研究，我们能够预测他会做出什么决定。"
  npc_override_1@herbs_HiddenGarden_stand_back_366640: "后退。"
  npc_override_1@herbs_HiddenGarden_stand_back_perimeter_sec_3024f0: "从安全区域的边界后退。禁止外人进入。"
  npc_override_1@herbs_HiddenGarden_suppress_unauthorized_ou_7066ee: "压制未经授权的外来者。"
  npc_override_1@herbs_HiddenGarden_take_recognition_code_co_bb76c6: "拿着这个。一个可以通往这座秘密花园其他区域的识别代码。"
  npc_override_1@herbs_HiddenGarden_thank_you_responding_eva_d1da00: "谢谢你，[{0}]响应了评估。"
  npc_override_1@herbs_HiddenGarden_thank_you_your_permissio_5e6d81: "谢谢你的许可。从现在开始，我将把[{0}]视为临时管理员。"
  npc_override_1@herbs_HiddenGarden_then_been_determined_pla_8e10b5: "那么，已确定此地的管理满足条件。"
  npc_override_1@herbs_HiddenGarden_then_open_your_control_p_4445c3: "那么，向[{0}]打开你的控制面板。胡萝卜-88。"
  npc_override_1@herbs_HiddenGarden_then_who_you_90f121: "那么，你是谁？"
  npc_override_1@herbs_HiddenGarden_there_no_bridge_connects_cbbfbd: "这里没有连接各区域的桥梁。"
  npc_override_1@herbs_HiddenGarden_there_possibility_you_si_44a7e7: "由于你以任何形式频繁接触他，你有可能拥有相似的魔力模式。"
  npc_override_1@herbs_HiddenGarden_there_s_approximately_ch_993d14: "在我们让她知道瓦尔蒙德主人还活着之前，你在她的激进镇压中失去生命的概率约为82%。"
  npc_override_1@herbs_HiddenGarden_there_s_been_series_refe_80fcd5: "这个安全区域一直有关于瓦尔蒙德的提及，但你从未问过他是谁。"
  npc_override_1@herbs_HiddenGarden_there_someone_who_decide_7bc81c: "有人为你的研究做决定吗？"
  npc_override_1@herbs_HiddenGarden_there_two_more_red_peppe_4b6a01: "除了我之外，这个安全区域还有另外两个红辣椒，卡帕和拉姆达。"
  npc_override_1@herbs_HiddenGarden_they_re_trying_close_res_3374c9: "她们试图关闭这个研究区域。我仍然反对，但资源开始达到极限。"
  npc_override_1@herbs_HiddenGarden_ton_yield_per_year_succe_b29753: "年产量2吨。99.9%的害虫防治成功率。0.2%的物理工作误差损失。"
  npc_override_1@herbs_HiddenGarden_turnips_flower_garden_so_31ba13: "花园的萝卜。在附近的大城市以极好的价格出售。为花园和宅邸的维护费用做出贡献。"
  npc_override_1@herbs_HiddenGarden_understood_we_add_more_t_676f44: "明白了，我们以后会种更多树。"
  npc_override_1@herbs_HiddenGarden_unfortunately_i_m_varmun_58ebf7: "不幸的是，我不是瓦尔蒙德。这个外表是我创造的，因为有我想检查你的东西。"
  npc_override_1@herbs_HiddenGarden_unit_attacked_initial_ve_6015a3: "攻击[{0}]的单元是4级战斗型自动人偶的初始版本。其战斗力相当于20个成年人。"
  npc_override_1@herbs_HiddenGarden_unregistered_guest_been_ce9ff3: "检测到未登记的客人。"
  npc_override_1@herbs_HiddenGarden_varmundt_why_you_here_9df6b7: "瓦尔蒙德？你为什么在这里？"
  npc_override_1@herbs_HiddenGarden_wait_sec_267d13: "^008800等一下！！"
  npc_override_1@herbs_HiddenGarden_warning_information_clos_37ff1d: "[警告] 此信息接近当前权限的极限。"
  npc_override_1@herbs_HiddenGarden_warning_request_exceeds_266070: "[警告] 此请求超出了我的权限级别。"
  npc_override_1@herbs_HiddenGarden_warp_connecting_flower_g_0fdbdf: "连接花园的传送已激活。"
