  npc_override_1@herbs_HiddenGarden_optimized_germination_gr_f6ee8b: "优化萝卜的发芽、生长和播种约18816小时，已比较并记录。"
  npc_override_1@herbs_HiddenGarden_order_been_received_b39cd0: "已收到命令。"
