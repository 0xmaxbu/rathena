  npc_override_1@herbs_HiddenGarden_over_million_hours_passe_5007e1: "已超过100万小时。收集萝卜种植和收获的数据。收集繁殖方法的信息。"
  npc_override_1@herbs_HiddenGarden_party_entering_d3d912: "{0}，队伍{1}，正在进入{2}。"
  npc_override_1@herbs_HiddenGarden_pattern_match_1af414: "^FF0000图案不匹配。^000000"
  npc_override_1@herbs_HiddenGarden_pattern_recognized_226121: "^0000FF图案已识别。^000000"
  npc_override_1@herbs_HiddenGarden_pimp_no_make_his_own_b0a715: "皮姆没有自己做决定的意愿！只有瓦尔蒙德主人知道。"
  npc_override_1@herbs_HiddenGarden_pimp_when_you_reporting_fd41af: "皮姆。向管理员报告时，你必须报告准确的记录时间。"
