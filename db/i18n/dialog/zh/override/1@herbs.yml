  npc_override_1@herbs_HiddenGarden_only_party_leader_start_306d85: "只有队伍领袖可以开始身份验证。让我们交给负责人来决定。"
  npc_override_1@herbs_HiddenGarden_operating_4885a9: "--- 运行中 ---"
