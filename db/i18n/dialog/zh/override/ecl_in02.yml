Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_ecl_in02_eclage_clinic_been_set_as_your_59821b: "诊所已被设为你的存档点。不过要小心~"
  npc_override_ecl_in02_eclage_looks_like_you_don_t_75d0dd: "看起来你的资源不足以继续。你介意再检查一下你的账户吗？"
  npc_override_ecl_in02_eclage_make_yourself_home_90fe12: "请随意~"
  npc_override_ecl_in02_eclage_menu_pay_941b01: "用斯普伦迪德硬币支付：用Zeny支付：算了"
  npc_override_ecl_in02_eclage_menu_save_7c0b70: "保存位置：休息：结束对话"
  npc_override_ecl_in02_eclage_msg_93fcbf: "……"
  npc_override_ecl_in02_eclage_north_prison_2e8838: "[北] 监狱"
  npc_override_ecl_in02_eclage_ooww_0971d2: "哎哟……"
  npc_override_ecl_in02_eclage_other_words_you_injured_1205ad: "换句话说，你的翅膀受伤了。箭射穿了翅膀最关键的部位。"
  npc_override_ecl_in02_eclage_path_take_you_lower_part_a22411: "这条路会带你到艾克雷奇的下层。你会在那里找到一间监狱和一间诊所。"
  npc_override_ecl_in02_eclage_restore_your_mind_body_o_a4d67a: "在我们的诊所恢复你的身心。这里充满了艾克雷奇的纯净能量。"
  npc_override_ecl_in02_eclage_seems_like_you_don_t_cc221b: "看起来你的硬币不够。请你再检查一下你的账户好吗？"
  npc_override_ecl_in02_eclage_umm_arrow_damaged_your_w_7456fb: "嗯……箭把你的翅膀伤得很重……"
  npc_override_ecl_in02_eclage_we_charge_splendide_coin_cb46ee: "我们通常收取1个斯普伦迪德硬币，但我们为旅行者提供特别折扣。你的总共是5,000 Zeny。"
  npc_override_ecl_in02_eclage_we_stopped_bleeding_cast_aab2ab: "我们已经止了血并施放了急救法术。"
  npc_override_ecl_in02_eclage_welcome_eclage_clinic_68dcf4: "欢迎来到艾克雷奇诊所。"
  npc_override_ecl_in02_eclage_well_i_going_tell_you_a1a2e8: "嗯……我本来打算等你恢复后再告诉你的，但你应该知道。你不能再装饰雅伊了。"
  npc_override_ecl_in02_eclage_west_clinic_0b01b8: "[西] 诊所"
  npc_override_ecl_in02_eclage_what_no_i_i_don_b6125f: "什么，不，我……我没有任何感觉……怎么回事？"
  npc_override_ecl_in02_eclage_what_no_way_please_docto_8577f5: "什么？不可能……求求你……医生！！不！！"
  npc_override_ecl_in02_eclage_what_you_mean_82db02: "……你是什么意思？"
  npc_override_ecl_in02_eclage_where_am_i_d5161a: "我在……哪里？"
  npc_override_ecl_in02_eclage_you_bleeding_lot_close_y_a499a8: "你刚才流了很多血。好险，你知道吗。"
  npc_override_ecl_in02_eclage_you_re_clinic_don_t_cc7ddd: "你在诊所里。别担心。"
