Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@rgsr_Regenschirm_aaaah_i_just_want_go_19e8fd: "啊啊啊……我只想回家……"
  npc_override_1@rgsr_Regenschirm_activating_voice_transmi_08d47b: "激活语音传输……"
  npc_override_1@rgsr_Regenschirm_adventurer_we_head_centr_4132c2: "冒险者，我们前往中央房间。"
  npc_override_1@rgsr_Regenschirm_again_your_uniform_reall_02f938: "但再说一次，你的制服真的很酷。"
  npc_override_1@rgsr_Regenschirm_ah_you_more_information_5fe7cd: "啊？你有更多信息要分享吗？"
  npc_override_1@rgsr_Regenschirm_ahahaha_ahahaha_i_ll_kil_3d8c15: "啊哈哈哈……啊哈哈哈……我要把你们全部杀光！！！！"
  npc_override_1@rgsr_Regenschirm_alright_i_ll_wait_rescue_5b9d6f: "好的。我会等救援队。"
  npc_override_1@rgsr_Regenschirm_am_i_late_49c86d: "我来晚了吗？"
  npc_override_1@rgsr_Regenschirm_analysing_signal_67b6c7: "分析信号。"
  npc_override_1@rgsr_Regenschirm_as_confirmed_security_sy_0d88a4: "正如安全系统确认的，内部没有检测到任何东西……"
  npc_override_1@rgsr_Regenschirm_as_you_see_most_entrance_635594: "正如你所见，大部分入口已经被封锁。"
  npc_override_1@rgsr_Regenschirm_ask_detained_researcher_5a2fde: "让被拘留的研究员把手放在设备上。"
  npc_override_1@rgsr_Regenschirm_awesome_s_what_did_you_dcbf14: "太棒了——！！就是这样……你做了什么！！"
  npc_override_1@rgsr_Regenschirm_because_gas_door_forcibl_3b0aa5: "因为气体，门被强制锁定了！"
  npc_override_1@rgsr_Regenschirm_biometric_scan_still_ope_ed2e97: "生物识别扫描仍在运行，我会留在这里保持门开着。"
  npc_override_1@rgsr_Regenschirm_booklet_missing_some_pag_84413d: "小册子缺少几页。有人故意省略了内容。"
  npc_override_1@rgsr_Regenschirm_calm_down_9ce969: "冷静。"
  npc_override_1@rgsr_Regenschirm_captain_sneaked_control_082e5d: "队长潜入了控制面板室。"
  npc_override_1@rgsr_Regenschirm_code_inactive_1bd25e: "代码未激活。"
  npc_override_1@rgsr_Regenschirm_come_close_me_huh_my_644870: "别……别……靠近我……！！呼，我的头……好痛……"
  npc_override_1@rgsr_Regenschirm_communication_been_termi_dcc578: "通讯已终止。"
  npc_override_1@rgsr_Regenschirm_communication_requested_aa0b21: "通讯请求。"
  npc_override_1@rgsr_Regenschirm_data_new_efficiency_side_652784: "这是关于新药水效率和副作用的数据。"
  npc_override_1@rgsr_Regenschirm_device_already_been_acti_25aa43: "这个设备已经被激活。"
  npc_override_1@rgsr_Regenschirm_device_unknown_purpose_29b216: "这个设备的用途不明。"
  npc_override_1@rgsr_Regenschirm_device_work_a407b6: "设备不工作。"
  npc_override_1@rgsr_Regenschirm_did_you_say_heart_hunter_a1c21a: "你说的是心脏猎手吗？"
  npc_override_1@rgsr_Regenschirm_door_normally_locked_sec_22d147: "门通常被安全系统锁定，所以我必须留在那里操作控制器。"
  npc_override_1@rgsr_Regenschirm_enterprise_s_guards_no_w_569427: "企业的守卫……不等等……"
  npc_override_1@rgsr_Regenschirm_est_handled_everything_e_e15916: "埃斯特已经处理了内部的一切。"
  npc_override_1@rgsr_Regenschirm_est_performing_operation_d404c6: "埃斯特将独自执行行动。"
  npc_override_1@rgsr_Regenschirm_experimental_data_been_r_5f31b4: "实验数据已被删除。有明显的人为破坏信息的痕迹。"
  npc_override_1@rgsr_Regenschirm_first_i_ll_need_disable_00247e: "首先我需要禁用自动锁定机制，然后我会马上跟上。"
  npc_override_1@rgsr_Regenschirm_get_me_out_here_4d3bcc: "让我离开这里！"
  npc_override_1@rgsr_Regenschirm_gravity_control_adjustme_36dc51: "重力控制调整……完成……还有{0}个剩余。"
  npc_override_1@rgsr_Regenschirm_gravity_control_adjustme_44dcce: "重力控制调整……完成……束缚已解除。"
  npc_override_1@rgsr_Regenschirm_guards_here_wearing_same_00e5d2: "这里的守卫穿着和我们之前看到的心脏猎手一样的衣服。"
  npc_override_1@rgsr_Regenschirm_he_s_traitor_2fec88: "他是叛徒！"
  npc_override_1@rgsr_Regenschirm_hey_did_you_check_all_b9b048: "嘿，你检查完所有实验室了吗？"
  npc_override_1@rgsr_Regenschirm_hi_94dd9e: "嗨"
  npc_override_1@rgsr_Regenschirm_however_there_informatio_7610b9: "然而有关于核心成分的信息。"
  npc_override_1@rgsr_Regenschirm_huh_we_ll_focus_rescuing_52fe69: "嗯。我们会先专注于营救人质。"
  npc_override_1@rgsr_Regenschirm_i_d_better_take_back_98c432: "我最好把它带回给泰丝分析。"
  npc_override_1@rgsr_Regenschirm_i_don_t_believe_there_f87f71: "我不相信里面还有敌人，我要撤出了。"
  npc_override_1@rgsr_Regenschirm_i_don_t_know_why_ff6aba: "我不知道为什么，但它关得很紧；维护访问需要一些时间。"
  npc_override_1@rgsr_Regenschirm_i_don_t_think_i_086a10: "我觉得我一个人救不了所有研究员。"
  npc_override_1@rgsr_Regenschirm_i_gained_control_over_so_a069b9: "我已经控制了部分安全系统，但还没有完全获得访问权限。"
  npc_override_1@rgsr_Regenschirm_i_going_myself_ed508b: "我本来打算自己做的。"
  npc_override_1@rgsr_Regenschirm_i_hit_back_my_head_be5c91: "我这样撞到了后脑勺。"
  npc_override_1@rgsr_Regenschirm_i_know_i_know_4dc7cb: "我知道。我知道。"
  npc_override_1@rgsr_Regenschirm_i_ll_fine_then_23f6eb: "那我就没事了。"
  npc_override_1@rgsr_Regenschirm_i_ll_go_you_thank_a0b13e: "我跟你走，谢谢！"
  npc_override_1@rgsr_Regenschirm_i_ll_i_ll_go_cf0874: "我会……我会去我的办公室然后跟你们汇合。"
  npc_override_1@rgsr_Regenschirm_i_ll_keep_helping_you_c2edd6: "我会通过对讲机继续帮助你。"
  npc_override_1@rgsr_Regenschirm_i_ll_take_guy_out_69816b: "我把这家伙带出去，你看看其他房间。"
  npc_override_1@rgsr_Regenschirm_i_ll_wait_here_d26e09: "我会在这里等。"
  npc_override_1@rgsr_Regenschirm_i_m_defect_i_m_6f6d1b: "我不是缺陷！我不是怪物！"
  npc_override_1@rgsr_Regenschirm_i_m_glad_when_i_087329: "我很高兴被雷根贝格录用，但这么大的公司到底出了什么问题……"
  npc_override_1@rgsr_Regenschirm_i_m_going_live_thank_0f9095: "我要活下来了！谢谢！"
  npc_override_1@rgsr_Regenschirm_i_still_want_confirm_ins_f6d379: "我仍然想确认房间内部。"
  npc_override_1@rgsr_Regenschirm_i_t_believe_came_d3251b: "我不敢相信事情会变成这样……"
  npc_override_1@rgsr_Regenschirm_i_think_you_should_open_e33466: "我觉得你应该打开这扇门来打开走廊。"
  npc_override_1@rgsr_Regenschirm_i_thought_they_had_less_c53249: "我以为他们内部的兵力较少，但没想到他们安装了有毒气体。"
  npc_override_1@rgsr_Regenschirm_i_thought_they_kicked_ou_c42b82: "我以为他们把那个疯子都赶出去了……"
  npc_override_1@rgsr_Regenschirm_i_thought_you_one_who_441373: "我以为你是那个把我们关押起来的人……！"
  npc_override_1@rgsr_Regenschirm_i_ve_already_got_data_4c6c53: "我已经拿到这里的数据了。"
  npc_override_1@rgsr_Regenschirm_i_ve_come_prepared_easie_5e1031: "我有备而来，但这比想象中简单。"
  npc_override_1@rgsr_Regenschirm_i_ve_seen_my_own_7f8a2a: "我亲眼所见，他刚刚杀了守卫……"
  npc_override_1@rgsr_Regenschirm_i_want_go_home_i_6af8c1: "我想回家……我只想回家……"
  npc_override_1@rgsr_Regenschirm_i_wonder_if_there_big_1fac9d: "我想知道是否会有大战。"
  npc_override_1@rgsr_Regenschirm_i_worked_lot_i_m_509f29: "我做了很多工作却没有得到报酬！"
  npc_override_1@rgsr_Regenschirm_if_i_wait_here_rebellion_8849c9: "如果我等在这里，反叛军会来救我吗？"
  npc_override_1@rgsr_Regenschirm_if_there_s_disturbance_e_dc2570: "如果有骚动，可能是埃斯特引起的。所以在继续之前请先确认她的情况。"
  npc_override_1@rgsr_Regenschirm_if_you_get_move_quickly_a59931: "如果你拿到了，快点行动！"
  npc_override_1@rgsr_Regenschirm_if_you_re_hurry_please_47e146: "如果你赶时间，请走……"
  npc_override_1@rgsr_Regenschirm_just_check_central_room_9e1894: "只检查中央房间然后出去。"
  npc_override_1@rgsr_Regenschirm_let_s_go_back_einbroch_e1f70c: "我们回艾音布罗克吧。"
  npc_override_1@rgsr_Regenschirm_let_s_organize_our_next_4ed787: "让我们组织下一步策略。"
  npc_override_1@rgsr_Regenschirm_list_enterprise_security_afc6c9: "这是企业安全团队的名单。"
  npc_override_1@rgsr_Regenschirm_lloyds_s_enchantment_pro_ff1132: "劳埃德的附魔和处理数据。"
  npc_override_1@rgsr_Regenschirm_look_security_guard_s_ro_f141e5: "寻找阿斯提到的守卫室。"
  npc_override_1@rgsr_Regenschirm_many_people_escaped_brea_4af951: "很多人打破窗户逃跑了……"
  npc_override_1@rgsr_Regenschirm_meant_provoke_me_13b0bd: "这是故意挑衅我。"
  npc_override_1@rgsr_Regenschirm_meet_me_over_there_8abe61: "在那边见我。"
  npc_override_1@rgsr_Regenschirm_menu_aas_63f7a3: "阿斯:那么冒险者，我们去看看中央房间。"
  npc_override_1@rgsr_Regenschirm_menu_aas_864fb1: "阿斯:埃斯特指挥官？我们关闭了大厅锁，但有什么问题吗？"
  npc_override_1@rgsr_Regenschirm_menu_aas_912100: "阿斯:是的。系统上没有检测到其他东西。以我们目前的进展，所有敌人都已被控制。"
  npc_override_1@rgsr_Regenschirm_menu_aas_934bf1: "阿斯:中央房间似乎是空的。我进去看看。"
  npc_override_1@rgsr_Regenschirm_menu_aas_a04372: "阿斯:优先应该是确保实验室然后是守卫室……*点击*"
  npc_override_1@rgsr_Regenschirm_menu_aas_ac01b3: "阿斯:怎么回事？*点击*锁是……！！"
  npc_override_1@rgsr_Regenschirm_menu_aas_b51ac3: "阿斯:似乎需要一些时间，但我已经控制了大部分监控模块。"
  npc_override_1@rgsr_Regenschirm_menu_aas_d26ae6: "阿斯:然而，为了确保中央控制室的安全，你必须穿过守卫室，那里检测到了许多实验体。"
  npc_override_1@rgsr_Regenschirm_menu_aas_dee6b4: "阿斯:哦你是冒险者。我给你报告。我还没有完全接管安全控制器系统。"
  npc_override_1@rgsr_Regenschirm_menu_aas_ec8c35: "阿斯:我先带研究员离开这里。可以吗？"
  npc_override_1@rgsr_Regenschirm_menu_aas_fb7547: "阿斯:大部分敌军在大厅和休息区，所以实验室区域的守卫较少。"
  npc_override_1@rgsr_Regenschirm_menu_control_bb260d: "控制:身份已确认。"
  npc_override_1@rgsr_Regenschirm_menu_enter_e46156: "进入。:等待。"
  npc_override_1@rgsr_Regenschirm_menu_est_256c65: "埃斯特:你还在害怕什么？我已经要回去了！"
  npc_override_1@rgsr_Regenschirm_menu_est_365ab6: "埃斯特:嗯，那是什么？"
  npc_override_1@rgsr_Regenschirm_menu_est_495999: "埃斯特:是谁？你是阿斯吗？你是冒险者吗？"
  npc_override_1@rgsr_Regenschirm_menu_est_a19a04: "埃斯特:好的，戈尼。你先到大厅确保道路安全。我带会议室的其他人。"
  npc_override_1@rgsr_Regenschirm_menu_est_d43094: "埃斯特:实验室里还有几个研究员，我去把他们带过来。我会等着的。"
  npc_override_1@rgsr_Regenschirm_menu_goni_6ad95c: "戈尼:*点头*"
  npc_override_1@rgsr_Regenschirm_menu_goni_a7b65e: "戈尼:……我也是。"
  npc_override_1@rgsr_Regenschirm_menu_move_75a79c: "前往艾音布罗克。:前往里希塔乐镇。:暂时停留。"
  npc_override_1@rgsr_Regenschirm_menu_red_5e2dc5: "红色按钮。:蓝色按钮。:白色按钮。:黄色按钮。"
  npc_override_1@rgsr_Regenschirm_menu_researcher_3a0b32: "研究员:……呼……这到底是什么……"
  npc_override_1@rgsr_Regenschirm_menu_researcher_da22aa: "研究员:你介意我开门吗？"
  npc_override_1@rgsr_Regenschirm_menu_voice_85af56: "门后的声音:外面是谁？消灭那奇怪的毒气！！"
  npc_override_1@rgsr_Regenschirm_most_people_fled_already_e3d1dc: "大多数人已经逃离，只剩下敌人。"
  npc_override_1@rgsr_Regenschirm_move_quietly_e4c8b4: "安静移动。"
  npc_override_1@rgsr_Regenschirm_msg_e0b936: "…… …… ……"
  npc_override_1@rgsr_Regenschirm_my_my_search_materials_3a33bb: "我的……我的搜索……材料……"
  npc_override_1@rgsr_Regenschirm_my_private_research_i_do_c641cf: "那是我的私人研究，我不知道他们为什么要拿走！"
  npc_override_1@rgsr_Regenschirm_my_team_one_x_marked_faf3e5: "我的团队是旁边标有X的那个。"
  npc_override_1@rgsr_Regenschirm_no_you_arrived_just_time_f50ce7: "不，你来得正是时候。"
  npc_override_1@rgsr_Regenschirm_now_go_ahead_931c8e: "现在前进。"
  npc_override_1@rgsr_Regenschirm_now_i_m_stuck_here_f878d9: "现在我被困在这里了。嘿嘿嘿嘿！"
  npc_override_1@rgsr_Regenschirm_now_rebellion_special_fo_8535c3: "从现在起，反叛军特种部队将优先营救被拘留的研究员。"
  npc_override_1@rgsr_Regenschirm_now_you_only_need_check_902b48: "现在你只需要检查中央房间。"
  npc_override_1@rgsr_Regenschirm_oh_you_already_know_21f923: "哦，你已经知道了。"
  npc_override_1@rgsr_Regenschirm_oh_you_re_here_protect_ad798f: "哦，你是来保护我的吗？"
  npc_override_1@rgsr_Regenschirm_oh_you_re_part_recon_4f9a6a: "哦……你是侦察队的一员？"
  npc_override_1@rgsr_Regenschirm_oh_you_re_there_protect_3e53f1: "哦，你是去那里保护我的吗？"
  npc_override_1@rgsr_Regenschirm_okay_adventurer_find_com_6013d8: "好的，冒险者，找一个通讯设备并与阿斯取得联系。"
  npc_override_1@rgsr_Regenschirm_okay_i_ll_quiet_now_070725: "好的。我现在会安静等待。"
  npc_override_1@rgsr_Regenschirm_ones_circled_probably_th_7c6b44: "圈起来的可能是那些同意被招募的人……"
  npc_override_1@rgsr_Regenschirm_only_title_left_all_text_10beb3: "只剩下标题，所有文字都被删除了。"
  npc_override_1@rgsr_Regenschirm_parts_documents_severely_b7e6f9: "部分文件严重损坏。"
  npc_override_1@rgsr_Regenschirm_please_check_if_there_st_d0bc2f: "请检查是否还有被拘留的研究员。"
  npc_override_1@rgsr_Regenschirm_please_consider_their_sa_7b8076: "请首先考虑他们的安全。"
  npc_override_1@rgsr_Regenschirm_please_head_there_meet_u_c58a49: "请前往那里并在总部与我们会合。"
  npc_override_1@rgsr_Regenschirm_please_help_me_912305: "请帮帮我！"
  npc_override_1@rgsr_Regenschirm_please_speak_me_when_you_d1e8ed: "准备好后请跟我说话。"
  npc_override_1@rgsr_Regenschirm_press_button_ae6f64: "按下按钮。"
  npc_override_1@rgsr_Regenschirm_rebellions_protect_them_172e60: "反叛军会保护他们并帮助他们逃脱。"
  npc_override_1@rgsr_Regenschirm_remaining_researchers_ga_5ea504: "剩余的研究员为了安全聚集在这里。"
  npc_override_1@rgsr_Regenschirm_s_central_room_right_ahe_17661f: "前面就是中央房间。"
  npc_override_1@rgsr_Regenschirm_s_main_idea_d5f127: "这就是主要想法。"
  npc_override_1@rgsr_Regenschirm_s_mercenary_contract_b9b3b5: "这是一份雇佣兵合同……"
  npc_override_1@rgsr_Regenschirm_s_necessary_i_understand_95c5c7: "那是必要的，我理解。"
  npc_override_1@rgsr_Regenschirm_safe_now_370723: "现在安全了吗？"
  npc_override_1@rgsr_Regenschirm_say_what_rebellions_comi_86a7a5: "什么？反叛军来救我们了？"
  npc_override_1@rgsr_Regenschirm_schlein_where_schlein_ee7b16: "施莱因，施莱因在哪里？"
  npc_override_1@rgsr_Regenschirm_seems_been_about_attempt_566912: "似乎是关于尝试利用光的折射来制造装置。"
  npc_override_1@rgsr_Regenschirm_seems_we_ve_gathered_mos_72e771: "似乎我们大部分已经聚集在这里了。"
  npc_override_1@rgsr_Regenschirm_some_circles_around_them_c08abe: "有些人被圈起来了……其他人被划掉了。"
  npc_override_1@rgsr_Regenschirm_some_drawing_been_torn_6d2b0a: "有些图纸被撕掉了。"
  npc_override_1@rgsr_Regenschirm_somebody_intentionally_d_3ba0c5: "有人故意破坏了相关部分。"
  npc_override_1@rgsr_Regenschirm_sorry_being_able_help_yo_f854e9: "抱歉没能帮到你。"
  npc_override_1@rgsr_Regenschirm_spare_master_key_still_r_8ea2ae: "备用主钥匙还在。"
  npc_override_1@rgsr_Regenschirm_spray_repellent_block_bl_cc5837: "那是一种用来阻挡吸血昆虫的喷雾驱虫剂！"
  npc_override_1@rgsr_Regenschirm_t_i_just_run_away_f53675: "我不能直接跟你一起逃跑吗？"
