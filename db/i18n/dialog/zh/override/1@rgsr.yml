Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@rgsr_Regenschirm_aaaah_i_just_want_go_19e8fd: "Aaaah... I just want to go home..."
  npc_override_1@rgsr_Regenschirm_activating_voice_transmi_08d47b: "Activating Voice Transmission..."
  npc_override_1@rgsr_Regenschirm_adventurer_we_head_centr_4132c2: "Adventurer, we head to the Central Room."
  npc_override_1@rgsr_Regenschirm_again_your_uniform_reall_02f938: "But again, your uniform is really cool."
  npc_override_1@rgsr_Regenschirm_ah_you_more_information_5fe7cd: "Ah? Do you have more information to share?"
  npc_override_1@rgsr_Regenschirm_ahahaha_ahahaha_i_ll_kil_3d8c15: "Ahahaha.. ahahaha... I'll kill you all!!!!"
  npc_override_1@rgsr_Regenschirm_alright_i_ll_wait_rescue_5b9d6f: "Alright. I'll wait for the rescue team."
  npc_override_1@rgsr_Regenschirm_am_i_late_49c86d: "Am I late?"
  npc_override_1@rgsr_Regenschirm_analysing_signal_67b6c7: "Analysing Signal."
  npc_override_1@rgsr_Regenschirm_as_confirmed_security_sy_0d88a4: "As confirmed by the security system, nothing is being detected on the inside..."
  npc_override_1@rgsr_Regenschirm_as_you_see_most_entrance_635594: "As you can see most of the entrances have been blocked already."
  npc_override_1@rgsr_Regenschirm_ask_detained_researcher_5a2fde: "Ask a Detained Researcher to put their hand on the device."
  npc_override_1@rgsr_Regenschirm_awesome_s_what_did_you_dcbf14: "Awesome-!! That's it... What did you do!!"
  npc_override_1@rgsr_Regenschirm_because_gas_door_forcibl_3b0aa5: "Because of the gas, the door was forcibly locked down!"
  npc_override_1@rgsr_Regenschirm_biometric_scan_still_ope_ed2e97: "The biometric scan is still operational, I'll be staying here to keep the door open."
  npc_override_1@rgsr_Regenschirm_booklet_missing_some_pag_84413d: "The booklet is missing some pages. Someone has deliberately omitted the material."
  npc_override_1@rgsr_Regenschirm_calm_down_9ce969: "Calm down."
  npc_override_1@rgsr_Regenschirm_captain_sneaked_control_082e5d: "The captain sneaked in the control panel room."
  npc_override_1@rgsr_Regenschirm_code_inactive_1bd25e: "Code is inactive."
  npc_override_1@rgsr_Regenschirm_come_close_me_huh_my_644870: "Do... do not... come close to me...!! Huh, my head... it hurts..."
  npc_override_1@rgsr_Regenschirm_communication_been_termi_dcc578: "The communication has been terminated."
  npc_override_1@rgsr_Regenschirm_communication_requested_aa0b21: "Communication Requested."
  npc_override_1@rgsr_Regenschirm_data_new_efficiency_side_652784: "It is a data on new efficiency and side effect of new potions."
  npc_override_1@rgsr_Regenschirm_device_already_been_acti_25aa43: "This device has already been activated."
  npc_override_1@rgsr_Regenschirm_device_unknown_purpose_29b216: "This device has an unknown purpose."
  npc_override_1@rgsr_Regenschirm_device_work_a407b6: "The device does not work."
  npc_override_1@rgsr_Regenschirm_did_you_say_heart_hunter_a1c21a: "Did you say Heart Hunters?"
  npc_override_1@rgsr_Regenschirm_door_normally_locked_sec_22d147: "The door is normally locked with the security system, so I have to stay there and work with the controller."
  npc_override_1@rgsr_Regenschirm_enterprise_s_guards_no_w_569427: "The Enterprise's guards... no wait..."
  npc_override_1@rgsr_Regenschirm_est_handled_everything_e_e15916: "Est has handled everything else on the inside."
  npc_override_1@rgsr_Regenschirm_est_performing_operation_d404c6: "Est will be performing the operation alone."
  npc_override_1@rgsr_Regenschirm_experimental_data_been_r_5f31b4: "The experimental data has been removed. There are clear traces of someone destroying the information."
  npc_override_1@rgsr_Regenschirm_first_i_ll_need_disable_00247e: "First I'll need to disable the auto-locking mechanism, and then I'll follow right away."
  npc_override_1@rgsr_Regenschirm_get_me_out_here_4d3bcc: "Get me out of here!"
  npc_override_1@rgsr_Regenschirm_gravity_control_adjustme_36dc51: "Gravity control adjustment... completed... There are {0} remaining."
  npc_override_1@rgsr_Regenschirm_gravity_control_adjustme_44dcce: "Gravity control adjustment... completed... Restraints have been disengaged."
  npc_override_1@rgsr_Regenschirm_guards_here_wearing_same_00e5d2: "The guards here were wearing the same clothes as those Heart Hunters we saw before."
  npc_override_1@rgsr_Regenschirm_he_s_traitor_2fec88: "He's a traitor!"
  npc_override_1@rgsr_Regenschirm_hey_did_you_check_all_b9b048: "Hey, Did you check all the labs yet?"
  npc_override_1@rgsr_Regenschirm_hi_94dd9e: "Hi"
  npc_override_1@rgsr_Regenschirm_however_there_informatio_7610b9: "However there is information about the core ingredients."
  npc_override_1@rgsr_Regenschirm_huh_we_ll_focus_rescuing_52fe69: "Huh. We'll focus on rescuing the hostages first."
  npc_override_1@rgsr_Regenschirm_i_d_better_take_back_98c432: "I'd better take it back to Tess and analyze it."
  npc_override_1@rgsr_Regenschirm_i_don_t_believe_there_f87f71: "I don't believe there are any enemies left inside, I'm going to pull out."
  npc_override_1@rgsr_Regenschirm_i_don_t_know_why_ff6aba: "I don't know why, but it's tightly closed;. It takes some time to maintain access."
  npc_override_1@rgsr_Regenschirm_i_don_t_think_i_086a10: "I don't think I can save all the researchers alone."
  npc_override_1@rgsr_Regenschirm_i_gained_control_over_so_a069b9: "I have gained control over some of the security system, but I haven't gained full access yet."
  npc_override_1@rgsr_Regenschirm_i_going_myself_ed508b: "I was going to do it myself."
  npc_override_1@rgsr_Regenschirm_i_hit_back_my_head_be5c91: "I hit the back of my head like this."
  npc_override_1@rgsr_Regenschirm_i_know_i_know_4dc7cb: "I know. I know."
  npc_override_1@rgsr_Regenschirm_i_ll_fine_then_23f6eb: "I'll be fine then."
  npc_override_1@rgsr_Regenschirm_i_ll_go_you_thank_a0b13e: "I'll go with you, thank you!"
  npc_override_1@rgsr_Regenschirm_i_ll_i_ll_go_cf0874: "I'll... I'll go to my office and join you."
  npc_override_1@rgsr_Regenschirm_i_ll_keep_helping_you_c2edd6: "I'll keep helping you through the intercom."
  npc_override_1@rgsr_Regenschirm_i_ll_take_guy_out_69816b: "I'll take this guy out of here and you look at the other rooms."
  npc_override_1@rgsr_Regenschirm_i_ll_wait_here_d26e09: "I'll wait  here."
  npc_override_1@rgsr_Regenschirm_i_m_defect_i_m_6f6d1b: "I'm not a defect! I'm not a monster!"
  npc_override_1@rgsr_Regenschirm_i_m_glad_when_i_087329: "I'm glad when I was hired at Rekenber, but what the hell is going with such a big company..."
  npc_override_1@rgsr_Regenschirm_i_m_going_live_thank_0f9095: "I'm going to live! Thank you!"
  npc_override_1@rgsr_Regenschirm_i_still_want_confirm_ins_f6d379: "I still want to confirm inside the room regardless."
  npc_override_1@rgsr_Regenschirm_i_t_believe_came_d3251b: "I can't believe it came to this..."
  npc_override_1@rgsr_Regenschirm_i_think_you_should_open_e33466: "I think you should open this door to open the hallway."
  npc_override_1@rgsr_Regenschirm_i_thought_they_had_less_c53249: "I thought they had less forces on the inside, but I didn't think they'd have installed toxic gas."
  npc_override_1@rgsr_Regenschirm_i_thought_they_kicked_ou_c42b82: "I thought they kicked out all the crazy guy..."
  npc_override_1@rgsr_Regenschirm_i_thought_you_one_who_441373: "I thought that you were the one who kept us in custody...!"
  npc_override_1@rgsr_Regenschirm_i_ve_already_got_data_4c6c53: "I've already got the data here."
  npc_override_1@rgsr_Regenschirm_i_ve_come_prepared_easie_5e1031: "I've come prepared, but this was easier than thought."
  npc_override_1@rgsr_Regenschirm_i_ve_seen_my_own_7f8a2a: "I've seen it with my own eyes, he just killed the guards..."
  npc_override_1@rgsr_Regenschirm_i_want_go_home_i_6af8c1: "I want to go home... I just want to go home..."
  npc_override_1@rgsr_Regenschirm_i_wonder_if_there_big_1fac9d: "I wonder if there will be a big fight."
  npc_override_1@rgsr_Regenschirm_i_worked_lot_i_m_509f29: "I worked a lot and I'm not getting paid!"
  npc_override_1@rgsr_Regenschirm_if_i_wait_here_rebellion_8849c9: "If I wait here, will the Rebellions come and save me?"
  npc_override_1@rgsr_Regenschirm_if_there_s_disturbance_e_dc2570: "If there's a disturbance, Est may have caused it. So please check out with her before continuing."
  npc_override_1@rgsr_Regenschirm_if_you_get_move_quickly_a59931: "If you get it, move quickly!"
  npc_override_1@rgsr_Regenschirm_if_you_re_hurry_please_47e146: "If you're in a hurry, please go..."
  npc_override_1@rgsr_Regenschirm_just_check_central_room_9e1894: "Just check the Central Room and then get out."
  npc_override_1@rgsr_Regenschirm_let_s_go_back_einbroch_e1f70c: "Let's go back to Einbroch."
  npc_override_1@rgsr_Regenschirm_let_s_organize_our_next_4ed787: "Let's organize our next strategy."
  npc_override_1@rgsr_Regenschirm_list_enterprise_security_afc6c9: "This is the list of the Enterprise security teams."
  npc_override_1@rgsr_Regenschirm_lloyds_s_enchantment_pro_ff1132: "Lloyds's enchantment and processing data."
  npc_override_1@rgsr_Regenschirm_look_security_guard_s_ro_f141e5: "Look for the Security Guard's room that Aas talked about."
  npc_override_1@rgsr_Regenschirm_many_people_escaped_brea_4af951: "Many people escaped by breaking the windows and ran away.."
  npc_override_1@rgsr_Regenschirm_meant_provoke_me_13b0bd: "This is meant to provoke me."
  npc_override_1@rgsr_Regenschirm_meet_me_over_there_8abe61: "Meet me over there."
  npc_override_1@rgsr_Regenschirm_menu_aas_63f7a3: "Aas : So adventurer, let's check out the Central Room."
  npc_override_1@rgsr_Regenschirm_menu_aas_864fb1: "Aas : Commander Est? We closed the hall lock, but what is the problem?"
  npc_override_1@rgsr_Regenschirm_menu_aas_912100: "Aas : Yes. Nothing else is being detected on the system. With our progress so far, the enemies have all been restrained."
  npc_override_1@rgsr_Regenschirm_menu_aas_934bf1: "Aas : The Central Room seems to be empty. I'll go in and check it out."
  npc_override_1@rgsr_Regenschirm_menu_aas_a04372: "Aas : The priority should be to secure the laboratories and then the Guard Room.... *click*"
  npc_override_1@rgsr_Regenschirm_menu_aas_ac01b3: "Aas : What is going on? *click* The lock is...!!"
  npc_override_1@rgsr_Regenschirm_menu_aas_b51ac3: "Aas : It seems it will take some time, but I've taken control of most of the monitoring modules."
  npc_override_1@rgsr_Regenschirm_menu_aas_d26ae6: "Aas : However, in order to secure the central control room, you have to go through the Guard's Room where many test subjects were detected."
  npc_override_1@rgsr_Regenschirm_menu_aas_dee6b4: "Aas : Oh you're the adventurer. I will give you the report. I have not fully taken over the security controller system yet."
  npc_override_1@rgsr_Regenschirm_menu_aas_ec8c35: "Aas : I'll go ahead and take the researchers out of here. Will that be okay?"
  npc_override_1@rgsr_Regenschirm_menu_aas_fb7547: "Aas : Most of the enemy troops were in the lobby and the resting area, so the lab area is less guarded."
  npc_override_1@rgsr_Regenschirm_menu_control_bb260d: "Control : Identity confirmed."
  npc_override_1@rgsr_Regenschirm_menu_enter_e46156: "Enter.:Wait."
  npc_override_1@rgsr_Regenschirm_menu_est_256c65: "Est : What are you scared of something else? I'm going back already!"
  npc_override_1@rgsr_Regenschirm_menu_est_365ab6: "Est : Eh, what was that?"
  npc_override_1@rgsr_Regenschirm_menu_est_495999: "Est : Who is it? Are you Aas? Are you the adventurer?"
  npc_override_1@rgsr_Regenschirm_menu_est_a19a04: "Est : Alright, Goni. You go to the main lobby first and secure the road. I'll take the others at the conference room."
  npc_override_1@rgsr_Regenschirm_menu_est_d43094: "Est : There were couple of researchers left in the labs, I'll go bring them along. I'll be waiting."
  npc_override_1@rgsr_Regenschirm_menu_goni_6ad95c: "Goni : *Nods*"
  npc_override_1@rgsr_Regenschirm_menu_goni_a7b65e: "Goni : ... Me too."
  npc_override_1@rgsr_Regenschirm_menu_move_75a79c: "Move to Einbroch.:Move to Lighthalzen.:Stay for a while."
  npc_override_1@rgsr_Regenschirm_menu_red_5e2dc5: "Red Button.:Blue Button.:White Button.:Yellow Button."
  npc_override_1@rgsr_Regenschirm_menu_researcher_3a0b32: "Researcher : ...huh... what the hell is this..."
  npc_override_1@rgsr_Regenschirm_menu_researcher_da22aa: "Researcher : Do you mind If I open the door?"
  npc_override_1@rgsr_Regenschirm_menu_voice_85af56: "Voice Behind Door : Who's outside? exterminate that strange poison gas!!"
  npc_override_1@rgsr_Regenschirm_most_people_fled_already_e3d1dc: "Most people have fled already, only the enemies are remaining."
  npc_override_1@rgsr_Regenschirm_move_quietly_e4c8b4: "Move quietly."
  npc_override_1@rgsr_Regenschirm_msg_e0b936: "... ... ..."
  npc_override_1@rgsr_Regenschirm_my_my_search_materials_3a33bb: "My... my search... materials..."
  npc_override_1@rgsr_Regenschirm_my_private_research_i_do_c641cf: "That was my private research, I don't know why they took it!"
  npc_override_1@rgsr_Regenschirm_my_team_one_x_marked_faf3e5: "My team is the one with a X marked next to it."
  npc_override_1@rgsr_Regenschirm_no_you_arrived_just_time_f50ce7: "No you arrived just in time."
  npc_override_1@rgsr_Regenschirm_now_go_ahead_931c8e: "Now go ahead."
  npc_override_1@rgsr_Regenschirm_now_i_m_stuck_here_f878d9: "Now I'm stuck here. Hehehehe!"
  npc_override_1@rgsr_Regenschirm_now_rebellion_special_fo_8535c3: "From now on the Rebellion Special Forces will prioritize on rescuing the Detained Researchers."
  npc_override_1@rgsr_Regenschirm_now_you_only_need_check_902b48: "Now you only need to check the Central Room."
  npc_override_1@rgsr_Regenschirm_oh_you_already_know_21f923: "Oh you already know."
  npc_override_1@rgsr_Regenschirm_oh_you_re_here_protect_ad798f: "Oh, you're here to protect me?"
  npc_override_1@rgsr_Regenschirm_oh_you_re_part_recon_4f9a6a: "Oh... you're part of the recon team?"
  npc_override_1@rgsr_Regenschirm_oh_you_re_there_protect_3e53f1: "Oh, you're there to protect me?"
  npc_override_1@rgsr_Regenschirm_okay_adventurer_find_com_6013d8: "Okay, adventurer, find a communication device and get in contact with Aas."
  npc_override_1@rgsr_Regenschirm_okay_i_ll_quiet_now_070725: "Okay. I'll be quiet now and wait."
  npc_override_1@rgsr_Regenschirm_ones_circled_probably_th_7c6b44: "The ones circled are probably those who accepted to be recruited..."
  npc_override_1@rgsr_Regenschirm_only_title_left_all_text_10beb3: "Only the title was left, all the text was removed."
  npc_override_1@rgsr_Regenschirm_parts_documents_severely_b7e6f9: "Parts of the documents were severely damaged."
  npc_override_1@rgsr_Regenschirm_please_check_if_there_st_d0bc2f: "Please check if there are still Detained Researchers."
  npc_override_1@rgsr_Regenschirm_please_consider_their_sa_7b8076: "Please consider their safety first."
  npc_override_1@rgsr_Regenschirm_please_head_there_meet_u_c58a49: "Please head there and meet us in the headquarters."
  npc_override_1@rgsr_Regenschirm_please_help_me_912305: "Please help me!"
  npc_override_1@rgsr_Regenschirm_please_speak_me_when_you_d1e8ed: "Please speak to me when you're ready."
  npc_override_1@rgsr_Regenschirm_press_button_ae6f64: "Press the button."
  npc_override_1@rgsr_Regenschirm_rebellions_protect_them_172e60: "The Rebellions will protect them and help them escape."
  npc_override_1@rgsr_Regenschirm_remaining_researchers_ga_5ea504: "The remaining researchers are gathered here for their security."
  npc_override_1@rgsr_Regenschirm_s_central_room_right_ahe_17661f: "That's the Central Room right ahead."
  npc_override_1@rgsr_Regenschirm_s_main_idea_d5f127: "That's the main idea."
  npc_override_1@rgsr_Regenschirm_s_mercenary_contract_b9b3b5: "It's a mercenary contract..."
  npc_override_1@rgsr_Regenschirm_s_necessary_i_understand_95c5c7: "That's necessary, I understand."
  npc_override_1@rgsr_Regenschirm_safe_now_370723: "Is it safe now?"
  npc_override_1@rgsr_Regenschirm_say_what_rebellions_comi_86a7a5: "Say what? The Rebellions are coming to save us?"
  npc_override_1@rgsr_Regenschirm_schlein_where_schlein_ee7b16: "Schlein, where is Schlein?"
  npc_override_1@rgsr_Regenschirm_seems_been_about_attempt_566912: "It seems to have been about attempting to create a device using the refraction of light."
  npc_override_1@rgsr_Regenschirm_seems_we_ve_gathered_mos_72e771: "It seems we've gathered most of them here already."
  npc_override_1@rgsr_Regenschirm_some_circles_around_them_c08abe: "Some have circles around them... others are crossed out."
  npc_override_1@rgsr_Regenschirm_some_drawing_been_torn_6d2b0a: "Some of the drawing has been torn."
  npc_override_1@rgsr_Regenschirm_somebody_intentionally_d_3ba0c5: "Somebody intentionally destroyed the relevant parts."
  npc_override_1@rgsr_Regenschirm_sorry_being_able_help_yo_f854e9: "Sorry for not being able to help you at all."
  npc_override_1@rgsr_Regenschirm_spare_master_key_still_r_8ea2ae: "The spare Master Key still remains."
  npc_override_1@rgsr_Regenschirm_spray_repellent_block_bl_cc5837: "It was a spray repellent to block blood-sucking insects!"
  npc_override_1@rgsr_Regenschirm_t_i_just_run_away_f53675: "Can't I just run away with you instead?"
  npc_override_1@rgsr_Regenschirm_take_some_time_go_throug_5ddca9: "It will take some time to go through them one by one."
  npc_override_1@rgsr_Regenschirm_takes_time_aas_come_hack_34e7dc: "It takes time for Aas to come hack the controller and release the gas."
  npc_override_1@rgsr_Regenschirm_thank_you_thank_you_b028e0: "Thank you! Thank you!"
  npc_override_1@rgsr_Regenschirm_there_four_buttons_room_79bf73: "There are four buttons in the room."
  npc_override_1@rgsr_Regenschirm_there_laboratories_other_f2895a: "There are laboratories on the other side and it's likely to be a mess."
  npc_override_1@rgsr_Regenschirm_there_may_researchers_de_5d5e9c: "There may be researchers detained inside."
  npc_override_1@rgsr_Regenschirm_there_s_nothing_else_see_d8ca2c: "There's nothing else to see here."
  npc_override_1@rgsr_Regenschirm_there_s_rough_plan_day_d5939e: "There's a rough plan for the day of the raid."
  npc_override_1@rgsr_Regenschirm_these_scumbags_took_my_r_412a15: "These scumbags took my Research Report and I escaped here."
  npc_override_1@rgsr_Regenschirm_they_took_all_5911d2: "They took it all!"
  npc_override_1@rgsr_Regenschirm_they_took_everything_ebd445: "They took everything!"
  npc_override_1@rgsr_Regenschirm_traitors_schlein_already_131929: "The traitors from Schlein have already escaped."
  npc_override_1@rgsr_Regenschirm_tsk_59871a: "Tsk."
  npc_override_1@rgsr_Regenschirm_unknown_entity_been_dete_1df9ba: "An unknown entity has been detected. Access Denied."
  npc_override_1@rgsr_Regenschirm_unless_there_big_disturb_cfcc14: "Unless there is a big disturbance, the alarm or security devices won't work."
  npc_override_1@rgsr_Regenschirm_voice_transmission_conne_e4a7a8: "Voice Transmission Connected."
  npc_override_1@rgsr_Regenschirm_voice_transmission_ended_070fe7: "Voice Transmission Ended."
  npc_override_1@rgsr_Regenschirm_waiting_communication_re_f8ecf1: "Waiting for communication response..."
  npc_override_1@rgsr_Regenschirm_we_couldn_t_flee_because_033b65: "We couldn't flee because they put poisonous gas outside the doors!"
  npc_override_1@rgsr_Regenschirm_we_re_going_wait_you_2dc2b4: "We're going to wait for you in the Cat on Bullet."
  npc_override_1@rgsr_Regenschirm_we_ve_got_our_focus_fcb095: "We've got our focus on that room."
  npc_override_1@rgsr_Regenschirm_what_hell_happening_32739b: "What the hell is happening?"
  npc_override_1@rgsr_Regenschirm_where_est_ee225b: "Where is Est?"
  npc_override_1@rgsr_Regenschirm_why_did_you_come_here_6b343a: "Why did you come here to save me?"
  npc_override_1@rgsr_Regenschirm_why_i_feed_traitors_4d62ee: "Why do I have to feed this traitors?"
  npc_override_1@rgsr_Regenschirm_why_they_b6a1f4: "Why would they do that?"
  npc_override_1@rgsr_Regenschirm_without_i_wouldn_t_been_55e332: "Without it, I wouldn't have been able to control over the security systems. Are you okay?"
  npc_override_1@rgsr_Regenschirm_won_t_work_time_i_4936fd: "It won't work this time. I'll track this to the end."
  npc_override_1@rgsr_Regenschirm_yeah_i_know_little_bit_a30d64: "Yeah, I know a little bit about the Heart Hunters, I will tell you everything!"
  npc_override_1@rgsr_Regenschirm_you_anything_else_invest_b18664: "Do you have anything else to investigate?"
  npc_override_1@rgsr_Regenschirm_you_arrived_good_time_281efb: "You arrived at a good time."
