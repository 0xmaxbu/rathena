  npc_override_lou_in02_quests_louyang_menu_tell_5fba09: "告诉他梦罗克的消息。:关于'沙漠之犬'的情报。:只是听听。"
  npc_override_lou_in02_quests_louyang_menu_tell_efdbc6: "告诉他梦罗克的消息。:询问'沙漠之犬'。"
  npc_override_lou_in02_quests_louyang_menu_the_587491: "月兔能实现愿望。:它纯粹的美能缓解一切焦虑。:因为它阴晴圆缺。:所有地方和民族都共享同一个月亮。"
