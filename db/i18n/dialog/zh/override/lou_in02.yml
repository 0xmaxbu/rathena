  npc_override_lou_in02_quests_louyang_menu_sorry_d94385: "抱歉。:天很热，是吧？:我在替医生跑腿。"
  npc_override_lou_in02_quests_louyang_menu_sorry_df66dd: "抱歉。:我来取我的文件。"
