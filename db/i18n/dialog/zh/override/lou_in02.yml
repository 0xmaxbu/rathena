  npc_override_lou_in02_quests_louyang_menu_options_8816b5: "……:询问他的师父。:询问毒药组织。:询问他为什么在这里工作。"
  npc_override_lou_in02_quests_louyang_menu_romantic_1bae11: "浪漫:惆怅:悔恨:热烈"
