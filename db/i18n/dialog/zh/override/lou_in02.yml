  npc_override_lou_in02_quests_louyang_menu_excuse_7cb4aa: "打扰一下。:从他身边走过。"
  npc_override_lou_in02_quests_louyang_menu_eyes_883667: "眼睛:头:凝视:视线"
  npc_override_lou_in02_quests_louyang_menu_frost_4e9680: "霜:露水:石子:雪"
  npc_override_lou_in02_quests_louyang_menu_give_431e3d: "把毒药瓶给他。:取消，去找宋智都。"
  npc_override_lou_in02_quests_louyang_menu_grin_268ee5: "对他咧嘴笑。:为他的悲痛哀叹。:斥责他。:再听一遍诗。:露出悲伤的表情。"
  npc_override_lou_in02_quests_louyang_menu_he_c50b84: "他在透过结霜的窗户看。:明亮的月亮像冰柱一样闪烁。:他想家了，所以月光看起来冷冰冰的。:这叫'诗意的许可'。"
  npc_override_lou_in02_quests_louyang_menu_homesick_fb04ce: "想家。:困倦。:孤独。:心碎。"
  npc_override_lou_in02_quests_louyang_menu_huh_1fef00: "嗯？再说一遍？:给点Zeny通融一下？"
  npc_override_lou_in02_quests_louyang_menu_i_1b54b8: "我仰望明亮的月亮:我抬起头看明亮的月亮:我转过头看明亮的月亮:我面对明亮的月亮"
  npc_override_lou_in02_quests_louyang_menu_i_361511: "我为故乡哭泣。:我低下头感到想家。:我思念我的故乡。:我抽泣着感到想家。"
  npc_override_lou_in02_quests_louyang_menu_i_5bd4e1: "上次的事很抱歉。:不管怎样，复仇都不好。"
  npc_override_lou_in02_quests_louyang_menu_i_61991d: "对不起，我帮不了你。:没问题。"
  npc_override_lou_in02_quests_louyang_menu_i_67e9ae: "我来帮医生拿点东西……:我同意，天气确实不好。"
  npc_override_lou_in02_quests_louyang_menu_i_8f1700: "我愿意做！:不，偷窃是不对的。"
  npc_override_lou_in02_quests_louyang_menu_i_979b7d: "我可以帮你。:真遗憾！"
  npc_override_lou_in02_quests_louyang_menu_i_b4edd9: "我需要一份文件。:我只是路过。"
  npc_override_lou_in02_quests_louyang_menu_i_fecfef: "我很抱歉……:没问题。"
  npc_override_lou_in02_quests_louyang_menu_if_8c79c2: "如果按错位置，可能导致死亡。但在凌晨5:15到7:15之间，它只是一个弱点。"
  npc_override_lou_in02_quests_louyang_menu_if_bd2627: "如果你觉得有负担……:我不介意，我很乐意帮忙。"
  npc_override_lou_in02_quests_louyang_menu_in_9f3aac: "在他的故乡。:在监狱里。:在宇宙深处。:在床上。"
  npc_override_lou_in02_quests_louyang_menu_it_22e4d3: "现在这很常见。:向他解释发生了什么。"
  npc_override_lou_in02_quests_louyang_menu_it_f69f01: "看起来像地上的霜:看起来像地上的冰柱:看起来闪闪发光:看起来像天上的霜"
  npc_override_lou_in02_quests_louyang_menu_make_007418: "制作火药。:取消。"
  npc_override_lou_in02_quests_louyang_menu_no_c62de9: "不，等等！:我百分之百确定。"
  npc_override_lou_in02_quests_louyang_menu_nothing_d088bc: "没什么。:我想谈谈你的弟子。:我感觉不舒服。"
  npc_override_lou_in02_quests_louyang_menu_on_92cc87: "在地上:和你一起:在床上:在星星中"
