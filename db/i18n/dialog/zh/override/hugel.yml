  npc_override_hugel_guides_hugel_i_am_eager_eat_something_627d9e: "I am eager to eat something!"
  npc_override_hugel_guides_hugel_i_don_t_know_if_8dfe19: "But I don't know if there is any weapon that you find useful."
  npc_override_hugel_guides_hugel_i_heard_9bbdc9: "I heard that the "
  npc_override_hugel_guides_hugel_i_know_you_re_curious_aa51b9: "I know you're curious but you need to stop bugging me."
