  npc_override_hugel_guides_hugel_while_ago_strangers_came_ebaeb2: "不久前，陌生人来到村庄并建造了那个奇怪的{0}之类的东西……"
  npc_override_hugel_guides_hugel_yes_i_love_hugel_brand_db765a: "是的，我喜欢修葛拉品牌的红色药水。我还没尝过其他品牌的红色药水……吼吼吼。"
  npc_override_hugel_guides_hugel_yes_when_you_travel_you_3e6b52: "是的，当你旅行时，你想顺便去{0}结交新朋友。"
  npc_override_hugel_guides_hugel_you_d_better_unpack_your_54b3b2: "你最好先在你{0}放下行李，然后再开始在这个村庄四处看看。"
  npc_override_hugel_guides_hugel_you_going_keep_bugging_m_4ad454: "你是打算一直烦我惹我生气吗？"
  npc_override_hugel_guides_hugel_you_very_honored_receive_8457fe: "你能得到像我这样伟大人物的指引，真是非常荣幸。"
