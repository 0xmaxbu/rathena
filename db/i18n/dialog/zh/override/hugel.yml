  npc_override_hugel_guides_hugel_then_head_northeast_foll_c23f8b: "Then head northeast following the beach, then you will find the {0}."
  npc_override_hugel_guides_hugel_there_anything_else_i_yo_8fdf01: "Is there anything else I can do for you?"
  npc_override_hugel_guides_hugel_they_put_some_kind_sign_7974bc: "They have put some kind of sign in the middle of village, so I guess that they are hiring people for something..."
  npc_override_hugel_guides_hugel_welcome_hugel_i_am_honor_e49965: "Welcome to ^8B4513Hugel^000000. I am honored to guide you in this beautiful village."
  npc_override_hugel_guides_hugel_well_me_rather_like_plac_a4ed17: "Well, to me, this {0} is rather like a place for old folks like me, you know..."
  npc_override_hugel_guides_hugel_well_we_center_village_005124: "Well, we have a {0} in the center of the village."
  npc_override_hugel_guides_hugel_what_business_you_0c45ab: "What business do you have"
  npc_override_hugel_guides_hugel_what_they_call_airship_4a2c8e: "What do they call it? Airship?"
  npc_override_hugel_guides_hugel_while_ago_strangers_came_ebaeb2: "A while ago, strangers came to the village and built that strange {0} kind of thing..."
  npc_override_hugel_guides_hugel_yes_i_love_hugel_brand_db765a: "Yes, I love Hugel brand Red Potions. I haven't tasted Red Potions from any other brands yet...hohoho. "
  npc_override_hugel_guides_hugel_yes_when_you_travel_you_3e6b52: "Yes, when you travel, you want to drop by a {0} and make new friends."
  npc_override_hugel_guides_hugel_you_d_better_unpack_your_54b3b2: "You'd better unpack your stuff at the {0} first before you start looking around this village."
  npc_override_hugel_guides_hugel_you_going_keep_bugging_m_4ad454: "Are you going to keep bugging me and make me get upset?"
  npc_override_hugel_guides_hugel_you_very_honored_receive_8457fe: "You are very honored to receive guidance from a great person like me."
  npc_override_hugel_guides_hugel_you_want_know_more_locat_705e90: "Do you want to know more locations?"
  npc_override_hugel_guides_hugel_your_mini_map_c80911: "on your mini-map."
