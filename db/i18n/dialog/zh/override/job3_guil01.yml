Body:
  npc_override_job3_guil01_3rd_trader_after_you_lose_some_weig_0f3785: "- 等你减重之后再来。 -"
  npc_override_job3_guil01_3rd_trader_currently_you_re_carryin_73594b: "- 你目前携带了 -"
  npc_override_job3_guil01_3rd_trader_enter_if_you_want_cancel_305c25: "如果想取消请输入'0'。"
  npc_override_job3_guil01_3rd_trader_good_i_ve_received_money_88fd0a: "很好。我已经收到了钱和特殊物品。"
  npc_override_job3_guil01_3rd_trader_hey_come_back_when_you_08085d: "嘿，当你凑齐所有交换要求后再回来。"
  npc_override_job3_guil01_3rd_trader_how_many_you_want_9e4d82: "你想要多少？"
  npc_override_job3_guil01_3rd_trader_i_wander_around_world_co_250e73: "我周游世界收集稀有毒药草。最近，我开始经营一种叫Izidor的草药。如果你感兴趣，可以购买。"
  npc_override_job3_guil01_3rd_trader_i_wander_around_world_co_63b7f8: "我周游世界收集稀有毒药草。但我不想把草药卖给你这样的人……哈哈哈……"
  npc_override_job3_guil01_3rd_trader_menu_how_ca995e: "我怎么买？:用动物血液交换:用苦味草药交换:用致命毒草交换:用冰冻玫瑰交换:用薄荷交换:用Hinalle交换"
  npc_override_job3_guil01_3rd_trader_number_must_less_than_fa63f0: "数量必须少于2,000！"
  npc_override_job3_guil01_3rd_trader_please_try_again_cefdd7: "- 请再试一次 -"
  npc_override_job3_guil01_3rd_trader_there_several_types_rune_da9f61: "有几种不同类型的符文。"
  npc_override_job3_guil01_3rd_trader_too_many_items_you_fc968e: "- 你带了太多物品。 -"
  npc_override_job3_guil01_3rd_trader_wait_minute_17efa5: "- 等一下！！ -"
  npc_override_job3_guil01_3rd_trader_why_i_ask_money_s_7e1900: "为什么我要钱？那只是向我这样的收藏家表示一点敬意罢了。哈哈哈……"
  npc_override_job3_guil01_3rd_trader_you_buy_them_zeny_one_604700: "你可以用10,000 zeny和以下稀有物品之一购买：动物血液、苦味草药、致命毒草、冰冻玫瑰、薄荷或Hinalle。"
  npc_override_job3_guil01_3rd_trader_you_element_each_propert_e6f397: "你有每种属性的元素吗？"
  npc_override_job3_guil01_3rd_trader_you_need_poison_0266d5: "你需要毒药吗？"
  npc_override_job3_guil01_3rd_trader_you_only_buy_maximum_ea_be7595: "你最多只能购买'2000'个。"
  npc_override_job3_guil01_3rd_trader_you_ve_cancelled_trade_f003bf: "你已取消交易。"

