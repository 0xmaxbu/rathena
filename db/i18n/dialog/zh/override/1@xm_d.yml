Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@xm_d_HorrorToyFactory_aaa_you_going_go_into_324b6b: "啊……你要进去那里吗？"
  npc_override_1@xm_d_HorrorToyFactory_ah_no_i_don_t_ad6953: "啊，不。我不怪她！我只是想知道那天玩偶工匠发生了什么事。"
  npc_override_1@xm_d_HorrorToyFactory_ah_wait_please_wait_good_03a87f: "啊，等等！请等等。对于像你这样一个有前途的年轻{0}来说，这不是个好地方！"
  npc_override_1@xm_d_HorrorToyFactory_ask_her_continue_da9651: "请她继续说。"
  npc_override_1@xm_d_HorrorToyFactory_box_your_hands_you_canno_59f8f4: "^009900盒子在你手中。你不能携带超过一个盒子。^000000"
  npc_override_1@xm_d_HorrorToyFactory_breathe_as_much_as_you_7b07b1: "尽情呼吸吧。这将是你最后一口气。"
  npc_override_1@xm_d_HorrorToyFactory_cancel_77dfd2: "取消"
  npc_override_1@xm_d_HorrorToyFactory_cautious_taming_other_wa_81d3c1: "^ff0000注意，驯服或其他非狩猎怪物的方式不被视为正常击杀计数。^000000"
  npc_override_1@xm_d_HorrorToyFactory_celine_kimi_her_phantom_769a96: "席琳·基米和她的幻影已经分享了她们的力量。她们将比以往更强大！"
  npc_override_1@xm_d_HorrorToyFactory_day_when_factory_decided_094ed0: "在工厂决定关闭的那天，玩偶制作人为他制作的最后一个玩偶穿上衣服，流下了眼泪。"
  npc_override_1@xm_d_HorrorToyFactory_did_he_give_doll_name_186dad: "他给玩偶起了名字吗？"
  npc_override_1@xm_d_HorrorToyFactory_did_kimi_d66075: "是基米做的吗？"
  npc_override_1@xm_d_HorrorToyFactory_did_you_come_here_as_cd5121: "你也来这里了吗？为什么所有人类都如此急于摧毁我们建造的东西？"
  npc_override_1@xm_d_HorrorToyFactory_don_t_afraid_me_now_8806a9: "别……别害怕我。现在我看起来很丑，但我以前不是这样的。"
  npc_override_1@xm_d_HorrorToyFactory_done_let_me_try_open_29833f: "完成了。让我试试打开那扇关闭的门。"
  npc_override_1@xm_d_HorrorToyFactory_door_opened_soon_you_wai_e24512: "门很快……就会打开……你能等一会儿吗？"
  npc_override_1@xm_d_HorrorToyFactory_eh_give_me_second_i_57a760: "呃……给我一秒钟。我正在和负责人谈话。请稍等。"
  npc_override_1@xm_d_HorrorToyFactory_eh_give_me_second_i_91e12c: "呃……给我一秒钟。我正在和负责人谈话。请稍等。"
  npc_override_1@xm_d_HorrorToyFactory_even_if_no_one_owns_c4f502: "即使没有人拥有它，从每个人那里偷走它也不对。"
  npc_override_1@xm_d_HorrorToyFactory_everyone_afraid_me_what_67c098: "每个人都害怕我！我到底做错了什么？！"
  npc_override_1@xm_d_HorrorToyFactory_everyone_their_mortal_co_7e8135: "每个人都处于他们必死的腐朽状态，对吧？"
  npc_override_1@xm_d_HorrorToyFactory_frankly_i_don_t_like_2eaccc: "坦白说，我不喜欢火。"
  npc_override_1@xm_d_HorrorToyFactory_gateway_dimensional_shif_af33eb: "维度转移的通道尚未激活。"
  npc_override_1@xm_d_HorrorToyFactory_go_outside_3570eb: "到外面去"
  npc_override_1@xm_d_HorrorToyFactory_he_named_last_doll_celin_689c22: "他给最后一个玩偶起名为^0000ff席琳·基米^000000，并停止了工厂的所有生产线。"
  npc_override_1@xm_d_HorrorToyFactory_heh_you_me_favor_9c85bf: "嘿？你愿意帮我一个忙？"
  npc_override_1@xm_d_HorrorToyFactory_hey_santa_stop_being_stu_b58089: "嘿，圣诞老人。别那么古板，你这个老头。毕竟公平就是公平，嘻嘻嘻。"
  npc_override_1@xm_d_HorrorToyFactory_hold_i_am_talking_your_e6f55d: "等等~我正在和你的经理谈话，所以请稍等。"
  npc_override_1@xm_d_HorrorToyFactory_huh_what_happened_67ea51: "嗯？发生了什么事？"
  npc_override_1@xm_d_HorrorToyFactory_hurry_up_carry_gift_box_20a1f5: "快点！把^ff0000那边的礼物盒^000000搬过来，然后往东走。"
  npc_override_1@xm_d_HorrorToyFactory_i_am_very_helpful_you_5a107f: "我对你没什么帮助。"
  npc_override_1@xm_d_HorrorToyFactory_i_burn_you_hell_s_d84b3c: "我会用地狱的烈焰烧死你。"
  npc_override_1@xm_d_HorrorToyFactory_i_could_feel_her_slender_cf6155: "^0000ff我能感觉到她纤细的下巴因情绪的微妙变化而颤抖。^000000"
  npc_override_1@xm_d_HorrorToyFactory_i_couldn_t_even_imagine_48fc5e: "我甚至无法想象，看到这种气氛……"
  npc_override_1@xm_d_HorrorToyFactory_i_don_t_know_she_ddc1d7: "我不知道……她可能会做，或者可能是另一个问题。我对此没有记忆。"
  npc_override_1@xm_d_HorrorToyFactory_i_don_t_think_scene_e4b532: "我不认为我看到的场景就是全部。然而，再次进入工厂……重新进入那里是……"
  npc_override_1@xm_d_HorrorToyFactory_i_don_t_want_deserted_936423: "我不想被遗弃。我不想被抛弃。"
  npc_override_1@xm_d_HorrorToyFactory_i_guess_his_earnestness_d27c81: "我猜他的真诚赋予了基米生命。"
  npc_override_1@xm_d_HorrorToyFactory_i_i_ve_decided_won_76766c: "我……我已经决定了。这对你不会有太大帮助，但我可以简单地告诉你方向。"
  npc_override_1@xm_d_HorrorToyFactory_i_keep_you_entering_unti_88db95: "在防腐剂的气味完全消失之前，我不会让你进入。"
  npc_override_1@xm_d_HorrorToyFactory_i_know_what_proceed_quic_c14933: "我知道该怎么做。快点继续吧！"
  npc_override_1@xm_d_HorrorToyFactory_i_know_your_situation_le_c3497b: "我知道你的情况。我们快点开始吧！"
  npc_override_1@xm_d_HorrorToyFactory_i_m_very_busy_working_4c49d1: "我现在工作很忙，你能别聊天了吗？"
  npc_override_1@xm_d_HorrorToyFactory_i_m_working_now_i_868bab: "我现在在工作！我很忙！"
  npc_override_1@xm_d_HorrorToyFactory_i_one_who_worked_as_16f21d: "我是那个一直作为玩偶工匠助手工作的人，他制作玩偶直到最后。"
  npc_override_1@xm_d_HorrorToyFactory_i_shouldn_t_ec02f7: "我不应该，但是……"
  npc_override_1@xm_d_HorrorToyFactory_i_t_find_other_workers_9c50a7: "我找不到其他工人了。我们没有时间磨蹭。孩子们在等礼物。"
  npc_override_1@xm_d_HorrorToyFactory_if_you_must_come_back_f17086: "如果你必须的话，等你变得更强后再回来。嗯……我想说……140级？"
  npc_override_1@xm_d_HorrorToyFactory_kimi_s_soul_still_stayin_ce24ad: "基米的灵魂仍然停留在这片土地上。当我能让她安息时……"
  npc_override_1@xm_d_HorrorToyFactory_kimi_you_mean_kimi_e8a2d4: "基米，你是说基米……"
  npc_override_1@xm_d_HorrorToyFactory_let_s_get_into_factory_3cc6e4: "让我们进入工厂。"
  npc_override_1@xm_d_HorrorToyFactory_listen_her_story_2e8288: "听她的故事。"
  npc_override_1@xm_d_HorrorToyFactory_listen_her_tactics_0be85e: "听取她的策略。"
  npc_override_1@xm_d_HorrorToyFactory_long_story_you_mind_if_0eb367: "这是一个很长的故事……你介意我和你谈谈吗？如果你把时间浪费在我这样的人身上？"
  npc_override_1@xm_d_HorrorToyFactory_lucky_you_got_here_safel_da54b3: "幸运的你安全到达了这里。"
  npc_override_1@xm_d_HorrorToyFactory_maybe_i_help_you_134a5b: "也许我能帮你。"
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_32ac81: "安东尼奥:嘿，人类。如果你想帮忙可以跟着我。只要你不打扰我，我就没问题！"
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_5fe8a2: "安东尼奥:听我说，圣诞老人~我的意思是，我喜欢这个工厂。"
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_c57855: "安东尼奥:哦！呜呼呼！一堆礼物被延误了。我们今天开个派对怎么样？！"
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_e5c287: "安东尼奥:没有人拥有它~而且有很多我可以用的东西。"
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_e86185: "安东尼奥:嗯……"
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_f289f7: "安东尼奥:嘿，如果我有剩余的礼物，这有什么大不了的？我不知道那个~"
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_f3c342: "安东尼奥:也许……我会很开心？！反正，那是个礼物，嘻嘻嘻嘻。"
  npc_override_1@xm_d_HorrorToyFactory_menu_cancel_c2629b: "取消:工厂1号完成:工厂2号完成:工厂3号完成:首领开始:首领完成"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_03b8b9: "被俘圣诞老人:呼……好吧，但想想孩子们收到它们时的感受。"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_04cb7e: "被俘圣诞老人:从社区偷东西是不对的！"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_1501c0: "被俘圣诞老人:那……那个家伙没有道德！"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_2896d5: "被俘圣诞老人:你这个笨蛋！为了确认，我跟着你。现在你偷了每个人的工厂！"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_3921ed: "被俘圣诞老人:嘿，你能去把安东尼奥赶出去吗？如果你打几下，他可能会逃跑。"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_d32a17: "被俘圣诞老人:如果他们知道你把无主的东西分发给他们，他们会怎么想？"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_f831a7: "被俘圣诞老人:谁说礼物本身是问题！你最好停止这种盗窃，安东尼奥！"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_018a44: "凯瑟琳·杰特·约翰逊:我会在这里找到路。我们在第二条生产线附近见面。振作起来，这是个玩具工厂。不会那么糟糕的！！"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_0b7304: "凯瑟琳·杰特·约翰逊:啊，他们在我后面。你最好换上制服。幸运的是，我还有我的员工卡。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_0c2776: "凯瑟琳·杰特·约翰逊:啊，也许我们应该把那些玩具和礼物盒恢复到原来的状态。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_0d10a5: "凯瑟琳·杰特·约翰逊:如果你在这里搜索时看到值班的工人玩偶，你能问问它关于玩偶制作人的事吗？"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_0ef527: "凯瑟琳·杰特·约翰逊的喊叫:你还好吗？逃往南边的紧急出口！"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_13b485: "凯瑟琳·杰特·约翰逊:我觉得其他灵魂已经在这个空荡荡的工厂里住了太久了。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_1660ef: "凯瑟琳·杰特·约翰逊:我该怎么说呢……有很多看起来非常可怕，但又非常悲伤的灵魂。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_1a34c3: "凯瑟琳·杰特·约翰逊:多亏了你，我所好奇的一切都已完全解决。如果你下次要送她去天堂，请再叫我。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_25d068: "凯瑟琳·杰特·约翰逊:基米，我从这里的玩偶那里听说过你。玩偶制作人非常喜欢你！"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_2fa3a0: "凯瑟琳·杰特·约翰逊:总之，即使基米讨厌所有人，她也在这里收集了很多回忆。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_512a3e: "凯瑟琳·杰特·约翰逊:啊……我们以前探索过这里？好的，我们在同一个地方再见。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_518a4c: "凯瑟琳·杰特·约翰逊:抱歉我不能给你太大帮助。一会儿见。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_53861c: "凯瑟琳·杰特·约翰逊:如果你找到了所有线索，搜索其他地方。我会找上次我遇到玩偶制作人的地方。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_5e3e43: "凯瑟琳·杰特·约翰逊:它们多么可怜，但如果它们攻击你，请让它们安息。幸运的是，它们不会来找我。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_66dcb8: "凯瑟琳·杰特·约翰逊:即使她的灵魂会回来，她也不会失望，我会安全地结束这件事。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_67d96c: "凯瑟琳·杰特·约翰逊:情况变得严重了。基米正在受苦。在这种情况下会很危险！"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_6b85b3: "凯瑟琳·杰特·约翰逊:是的，当你开始移动时，他如此高……"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_791b11: "凯瑟琳·杰特·约翰逊:嗯？我……我是说……要把它们恢复原样……是的……我们需要和它们战斗？我不太清楚具体怎么做。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_8d3451: "凯瑟琳·杰特·约翰逊:不，别听它的，基米！他真的很珍惜你。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_8f63c2: "凯瑟琳·杰特·约翰逊:不幸的是，我没能说服基米。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_93c322: "凯瑟琳·杰特·约翰逊:什……发生了什么？玩具和玩偶在游荡，而不是人类工人。好像它们是员工……"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_a3a9b7: "凯瑟琳·杰特·约翰逊:我会找到紧急出口逃跑。快跑，冒险者！"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_afa8f0: "凯瑟琳·杰特·约翰逊:但是，现在不是高兴的时候。一旦我们找到最后一个工厂区域，我们就需要停止所有生产线。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_b2cec8: "凯瑟琳·杰特·约翰逊:基米！听我说。我不是来这里责怪你的。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_b64a79: "凯瑟琳·杰特·约翰逊:我会打开出口。我先出去，你跟着我就行。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_bd627e: "凯瑟琳·杰特·约翰逊:这个区域是1号工厂。它曾经是玩具和玩偶在作为礼物送出之前存放的地方。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_c00777: "凯瑟琳·杰特·约翰逊:那个幻影的声音是什么？为什么它对基米如此残酷……"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_c8c12f: "凯瑟琳·杰特·约翰逊:每个人都处于他们必死的腐朽状态，对吧？"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_d6d712: "凯瑟琳·杰特·约翰逊:这里曾经挤满了人，但现在不是了。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_d74452: "凯瑟琳·杰特·约翰逊:如果他们回忆起玩偶制作人的记忆，他可能会被送往天堂。那是最好的希望。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_dfea93: "凯瑟琳·杰特·约翰逊:啊，我在来这里的时候意识到了一些事情。一些……孩子……"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_e615b2: "凯瑟琳·杰特·约翰逊:就像人类在这里工作时一样。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_e9ae62: "凯瑟琳·杰特·约翰逊:这个地方是2号工厂。"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_ebdeff: "凯瑟琳·杰特·约翰逊:天哪，我希望守卫还是人类。过去这里附近有几箱制服……"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_f45a6c: "凯瑟琳·杰特·约翰逊:啊，我记得几件事。如果有人没有穿员工制服，守卫就会过来责骂他们……"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_f471a8: "凯瑟琳·杰特·约翰逊:顺便说一下……"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_fc2521: "凯瑟琳·杰特·约翰逊:不，基米！我意识到了。我误解了你。他生病了！"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_fdab4d: "凯瑟琳·杰特·约翰逊:我猜我脸上的诅咒来自那个不明身份的声音。"
  npc_override_1@xm_d_HorrorToyFactory_menu_caution_18ad56: "注意:工厂经理正在来检查。清除外来者。"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_045ae9: "席琳·基米:我……我杀了他吗？……"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_19b2e6: "席琳·基米:别撒谎。如果那是真的，为什么他不用充满爱意的眼神看我？"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_21b807: "席琳·基米:你也……来这里杀我？"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_3978ec: "席琳·基米:我……我……"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_40bfd9: "席琳·基米:因为我，爷爷死了……"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_79c171: "席琳·基米:打败我没用！我的身体会恢复。"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_79cfb4: "席琳·基米:他……珍惜我吗？"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_8797b9: "席琳·基米:为什么他不说我的名字？[基米] [基米！]我渴望听到爷爷的声音。"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_8ea686: "席琳·基米:每个人都讨厌我！……你也不喜欢我吗？这个丑陋又诡异的玩偶喜欢我……"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_c7eca1: "席琳·基米:不！我应该守住我的位置！"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_f0fcf6: "席琳·基米:我……我……杀了他吗？"
  npc_override_1@xm_d_HorrorToyFactory_menu_coordinator_3a4401: "协调员:这种事情最近经常发生……"
  npc_override_1@xm_d_HorrorToyFactory_menu_coordinator_bbf85f: "协调员公告:嗯？大家都去哪里了！工人们竟敢擅离岗位四处闲逛！"
  npc_override_1@xm_d_HorrorToyFactory_menu_coordinator_bffb47: "协调员:守卫！守卫在哪里！人类入侵了！！"
  npc_override_1@xm_d_HorrorToyFactory_menu_coordinator_e2b277: "协调员公告:嗯？大家都去哪里了！工人们竟敢擅离岗位！"
  npc_override_1@xm_d_HorrorToyFactory_menu_coordinator_f73d37: "协调员:快点！把那边的礼物盒搬过来，然后往东走。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_05d5ad: "工厂公告:醒醒，玩具工厂工作时间到了……"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_223db4: "工厂公告:外来者，举起双手投降。否则，我会开枪。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_22e8d9: "工厂公告:不是好消息。检测到外部生物。守卫，请出动。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_65d7ea: "工厂公告:3号工厂的发送准备工作已完成。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_71be45: "工厂公告:大家都回家了。生产线已关闭，员工休息室开放。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_8ab759: "工厂公告:所有员工必须穿着适当的制服并佩戴身份证明。如果你没有，请向安保人员核实。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_8e5c9a: "工厂公告:让我们今天为每个孩子的梦想制作礼物。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_9bb233: "工厂公告:送货员工，请待命。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_a6d947: "工厂公告:在产品线上发现外来者。守卫，请立即出动。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_b45d62: "工厂公告:好了，派对结束了！离开我的房子！"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_b8e32e: "工厂公告:外来者或入侵者是工厂运营的障碍。如有必要，你可以杀死他们。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_c46aeb: "工厂公告:请启动1号生产线。别忘了戴安全帽！这是说你，鲍勃！"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_c5feee: "工厂公告:废物和其他杂物应远离工作区域。这是为了随时保证你的安全。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_e6f255: "工厂公告:现在包装线上有{0}人。照顾好自己。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_f0ba56: "工厂公告:派遣守卫。镇压入侵者。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_f3ab42: "工厂公告:已识别入侵者。区分代码AX0829。类型:人类。赶走他们。"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_faf074: "工厂公告:存在于{0} - {1}。"
  npc_override_1@xm_d_HorrorToyFactory_menu_guard_a66452: "守卫公告:请立即离开这里，外来者。"
  npc_override_1@xm_d_HorrorToyFactory_menu_guard_f3c70d: "守卫公告:发现入侵者！他们看起来像人类！我会把他们消灭！"
  npc_override_1@xm_d_HorrorToyFactory_menu_options_d19784: "？？？:如果你安静地离开不破坏我的好事，我不会伤害你。"
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_0db2c7: "幻影的喊叫:是的，基米~爸爸被吓坏了！他害怕你~"
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_28dd2d: "幻影的喊叫:谎言！"
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_54b631: "幻影的喊叫:看看你现在的样子，基米~看看镜子~你感觉如何？"
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_8daf97: "幻影的喊叫:愤怒~悲伤~没有人为哭泣，基米~"
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_98dd67: "幻影的喊叫:你不同意你很可怕吗？没有人爱你，基米~"
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_bfebf2: "幻影的喊叫:他被你的样子吓坏了，他的心脏停止了，基米~你杀了他！"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_0862a3: "工人:哦，基米……我亲爱的……她以为玩偶制作人是因为被她吓到才去世的。"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_15cfb8: "工人:也许爷爷的爱让她动起来并变得有生命。啊哈……我困了……"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_16df99: "工人:爷爷……我想他。爷爷，爷爷……"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_20ec1e: "工人:而她首先看到的是他的死亡。多么悲惨。"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_2d0262: "工人:啊！爷爷？他是个真正的好人。他每天给我们上油，经常清理灰尘。"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_2e3bac: "工人:啊……你对我做了什么？我感觉很奇怪……"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_4ba151: "工人:他能看到一个活的玩偶一段时间。那是基米首先做的。"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_4f6689: "工人:基米没有伤害爷爷！基米想救爷爷！人们害怕基米，但基米很善良！基米是个好女孩！"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_541631: "工人:基米有一段时间一动不动，像普通玩偶一样坐着。"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_587e3e: "工人:爷爷是个好人！可怜的基米！基米爱爷爷！但爷爷死了。我很难过！"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_641152: "工人:守卫！守卫！！"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_65215e: "工人:爷爷只是很高兴基米在动……"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_68e2a5: "工人:守卫，守卫！你在哪里？！人类来了！！"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_7aef54: "工人:啊……顺……顺便问一下，为什么我的身体变成……"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_89d438: "工人:总之，为什么我的身体……它好像要飘到空中……有点奇怪。"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_b1318d: "工人:基米在被附身之前能够听到爷爷的声音和感受。"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_b5c6b2: "工人:我希望他不会去世。啊……啊哈……我感觉好多了。"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_bc5e16: "工人:他看到基米睁开眼睛时非常惊讶，他的心脏……就变成了那样。"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_c3c82d: "工人:他有慢性心脏病，但当它发作时非常突然，他去世了。基米发现了他并进行了急救，但是……"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_c7287d: "工人:基米杀了工匠爷爷？谁说的？那不是真的。基米正要救他！"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_f8043f: "工人:她的灵魂正要永远飞走……就像我现在……哦，我的……我怎么了？"
  npc_override_1@xm_d_HorrorToyFactory_mmm_where_should_i_start_85b9c1: "嗯……我该从哪里开始……这个城镇的故事先？……"
  npc_override_1@xm_d_HorrorToyFactory_no_nothing_special_7cf04f: "不，没什么特别的"
  npc_override_1@xm_d_HorrorToyFactory_oh_dear_let_me_know_2c4e9c: "哦，亲爱的。你准备好的时候告诉我。"
  npc_override_1@xm_d_HorrorToyFactory_okay_take_care_yourself_26ef4f: "好的，照顾好自己。永远不要靠近那个奇怪的入口。"
  npc_override_1@xm_d_HorrorToyFactory_perhaps_he_thought_he_wo_3ff2e3: "也许他认为他不会再制作玩偶了。"
  npc_override_1@xm_d_HorrorToyFactory_please_keep_talking_3aba69: "请继续说下去。"
  npc_override_1@xm_d_HorrorToyFactory_please_wait_until_transf_8879a5: "请等待变身完成。在你恢复正常之前，你不能移动到另一个区域。"
  npc_override_1@xm_d_HorrorToyFactory_quit_fb25bb: "退出。"
  npc_override_1@xm_d_HorrorToyFactory_quit_story_4580cb: "退出故事"
  npc_override_1@xm_d_HorrorToyFactory_s_boiling_bear_if_you_e7479c: "沸腾了！……如果你能的话，忍受它。"
  npc_override_1@xm_d_HorrorToyFactory_s_end_i_outside_when_dbdfa9: "这就是结局。当我再次醒来时，我已经在外面了。我的脸变成了这样。"
  npc_override_1@xm_d_HorrorToyFactory_she_thinking_about_somet_081110: "^0000ff她睁大眼睛专注地思考着什么。^000000"
  npc_override_1@xm_d_HorrorToyFactory_sigh_girl_begins_speak_s_993e9b: "^0000ff女孩叹了口气，开始用一种低沉的语调说话，就像一个讲述古老故事的吟游诗人。^000000"
  npc_override_1@xm_d_HorrorToyFactory_skull_faced_girl_front_y_0c0b78: "^0000ff你面前那个骷髅脸的女孩用含泪的声音说话。本应有眼睛的地方空洞洞地盯着你。^000000"
  npc_override_1@xm_d_HorrorToyFactory_smell_preservative_facto_3441cb: "工厂的防腐剂气味还没有散去。在这种状态下你不能进入。"
  npc_override_1@xm_d_HorrorToyFactory_smell_preservative_gone_7e053e: "^0000ff防腐剂的气味已经散去。你可以和凯瑟琳·杰特·约翰逊交谈了。^000000"
  npc_override_1@xm_d_HorrorToyFactory_sometimes_so_much_work_g_04bae8: "有时候玩偶制作人会像对待自己的孩子一样投入大量工作来制作一个玩偶。基米就是他的那个孩子。"
  npc_override_1@xm_d_HorrorToyFactory_stop_machine_c4fd8c: "停止机器。"
  npc_override_1@xm_d_HorrorToyFactory_take_look_around_ae764e: "四处看看"
  npc_override_1@xm_d_HorrorToyFactory_thank_you_listening_me_h_208f49: "谢谢你……听我说。希望你会享受你的旅程……"
  npc_override_1@xm_d_HorrorToyFactory_there_some_work_study_pr_8437cb: "恐怖玩具工厂之旅中有一些作为怪物工人的勤工俭学项目。因此，^ff0000当你变身时无法进入。^000000"
  npc_override_1@xm_d_HorrorToyFactory_there_toy_factory_town_a_121fe5: "这个城镇曾经有一个玩具工厂。这个城镇的所有人都在那里工作，我也是员工之一。"
  npc_override_1@xm_d_HorrorToyFactory_trail_dimensional_shifti_d25691: "^0000ff维度转移的痕迹消失了。你可以使用工厂维度传送器。^000000"
  npc_override_1@xm_d_HorrorToyFactory_unknown_error_occurred_58bda4: "发生了未知错误。"
  npc_override_1@xm_d_HorrorToyFactory_unlock_horror_toy_factor_c70ab8: "解锁恐怖玩具工厂"
  npc_override_1@xm_d_HorrorToyFactory_wa_watch_out_kimi_isn_52b49a: "哇……小心！基米不在正常状态。"
  npc_override_1@xm_d_HorrorToyFactory_wait_please_wait_until_i_5d50ca: "等等，请等我准备好。我准备好的时候可以引导你。"
  npc_override_1@xm_d_HorrorToyFactory_we_all_happy_beginning_w_b34f4b: "一开始我们都很开心。我们过去常常聚在一起，下班后吃着姜饼喝着热茶友好地聊天。"
  npc_override_1@xm_d_HorrorToyFactory_we_well_i_cannot_help_7886cc: "我们……好吧，我除了给你指路外，完全帮不了你。而且，这对你来说可能非常危险。"
  npc_override_1@xm_d_HorrorToyFactory_what_humans_8219af: "什么？！人类！！！"
  npc_override_1@xm_d_HorrorToyFactory_what_s_wrong_your_face_0ca72e: "你的脸怎么了？"
  npc_override_1@xm_d_HorrorToyFactory_what_time_you_like_retur_9b0a6a: "你想什么时候回来？"
  npc_override_1@xm_d_HorrorToyFactory_what_you_one_us_9137f2: "什么？！你不是我们中的一员！！"
  npc_override_1@xm_d_HorrorToyFactory_when_i_first_saw_her_0af8de: "当我第一次看到她时，她站在去世并倒下的玩偶制作人旁边。她面无表情地站在那里。"
  npc_override_1@xm_d_HorrorToyFactory_why_you_hanging_around_c_7251b5: "你还在闲逛什么！把^ff0000那边的礼物盒^000000搬过来，然后往东走。"
  npc_override_1@xm_d_HorrorToyFactory_yes_because_we_couldn_t_c32db0: "是的，因为我们不能永远靠包装玩具谋生。村民们陆续离开后，情况变得艰难。"
  npc_override_1@xm_d_HorrorToyFactory_yes_i_am_scared_reluctan_f4f3ef: "是的，我害怕并且不情愿做这件事。如果有人能帮我……"
  npc_override_1@xm_d_HorrorToyFactory_yes_she_became_living_cr_89a2d1: "是的，^0000ff她^000000变成了一个生物。我不知道怎么回事，但她带着沉重的悲伤和愤怒在玩具工厂里游荡。"
  npc_override_1@xm_d_HorrorToyFactory_you_already_trail_dimens_9089e1: "你已经有了维度转移的痕迹。你的访问已被拒绝。"
  npc_override_1@xm_d_HorrorToyFactory_you_also_came_here_kill_971d6c: "你也……来这里杀我？"
  npc_override_1@xm_d_HorrorToyFactory_you_bear_flame_010422: "你能承受这火焰吗？！"
  npc_override_1@xm_d_HorrorToyFactory_you_blame_her_3a9656: "你责怪她吗？"
  npc_override_1@xm_d_HorrorToyFactory_you_cannot_come_here_if_1191b0: "如果你在怪物变身效果下，你不能来这里。"
  npc_override_1@xm_d_HorrorToyFactory_you_cannot_use_uniform_b_a97018: "当你已经变身时，不能使用制服盒子。^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_carrying_packaged_pr_5ba6b2: "^0000ff你正拿着包装好的礼物。^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_changed_into_uniform_073426: "^0000ff>你换上了制服。^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_d_better_release_you_872375: "如果你想进去，你最好解除变身。在某些方面可能很危险。"
  npc_override_1@xm_d_HorrorToyFactory_you_don_t_any_support_8b1fae: "你没有任何支援？请组织一支队伍，如果你一个人去的话再来。"
  npc_override_1@xm_d_HorrorToyFactory_you_eligible_dimensional_25eb6d: "你不符合维度转移的条件。你应该至少140级。"
  npc_override_1@xm_d_HorrorToyFactory_you_exit_a60e89: "你要退出吗？"
  npc_override_1@xm_d_HorrorToyFactory_you_know_about_doll_make_57054c: "你知道人偶匠人的事吗？"
  npc_override_1@xm_d_HorrorToyFactory_you_mean_doll_alive_b72a55: "你是说玩偶是活的？"
  npc_override_1@xm_d_HorrorToyFactory_you_need_organize_party_64ac19: "^0000ff你需要组织一支至少有一名成员的队伍才能进入恐怖玩具工厂。^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_put_factory_uniform_eca280: "^0000ff你穿上了工厂制服。盒子里似乎还剩几件制服。^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_reunite_kimi_t_you_42aea5: "你可以和基米重聚，不是吗？"
  npc_override_1@xm_d_HorrorToyFactory_you_t_seem_put_uniform_c9bd7e: "你似乎不能把制服穿在你的獠牙上。^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_transformation_521e7b: "^ff0000你正在变身中。"
  npc_override_1@xm_d_HorrorToyFactory_you_transformed_into_dif_823b02: "^ff0000你变身成了另一种形态。"
  npc_override_1@xm_d_HorrorToyFactory_you_uniform_coordinator_fb4d08: "^ff0000你没有穿制服。协调员不会让你拿走的。^000000"
