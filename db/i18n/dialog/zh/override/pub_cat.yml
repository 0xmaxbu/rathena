Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_pub_cat_quests_dungeons_200_abyssal_solitude_b354f3: "深渊的孤独"
  npc_override_pub_cat_quests_dungeons_200_according_recent_sources_985bb7: "根据最近的传闻……在尼芙菲姆的黑暗深处，死者正在举行宴会，"
  npc_override_pub_cat_quests_dungeons_200_actually_i_ve_been_dead_5859d7: "其实我已经死了很久了，但最近才来到尼芙菲姆。所以我决定在这间房子里睡觉……"
  npc_override_pub_cat_quests_dungeons_200_actually_s_more_like_mon_774207: "其实，比起人工生命体，它更像是怪物……"
  npc_override_pub_cat_quests_dungeons_200_actually_screams_when_li_66475a: "当有活人敲门时，它实际上会尖叫。"
  npc_override_pub_cat_quests_dungeons_200_adventurer_what_you_thin_ffc0d1: "冒险者。你怎么看？"
  npc_override_pub_cat_quests_dungeons_200_ah_after_all_living_hear_6d3f97: "啊，毕竟活人是听不到那种声音的。这是只有死者才知道的痛苦……"
  npc_override_pub_cat_quests_dungeons_200_ah_did_you_come_see_34e766: "啊，你是来看子弹喵的尤尔玛的吗？"
  npc_override_pub_cat_quests_dungeons_200_ah_excuse_me_3c1247: "啊……不好意思。"
  npc_override_pub_cat_quests_dungeons_200_ah_i_m_sorry_i_63df0a: "啊……抱歉。我误会了。所有走到这里的人都是些奇怪的孩子或卖药的人，所以我把他们赶走了。"
  npc_override_pub_cat_quests_dungeons_200_ah_take_look_my_head_99c78f: "啊，看看。光是这些工作人员就让我头都要掉了。"
  npc_override_pub_cat_quests_dungeons_200_ah_you_changed_your_word_ee03e2: "啊，你改口了！"
  npc_override_pub_cat_quests_dungeons_200_all_ones_dolls_so_noisy_bc2102: "所有带着玩偶的人都很吵。"
  npc_override_pub_cat_quests_dungeons_200_among_homunculus_intensi_5d7b16: "在强化培养室的人工生命体中，有变异嵌合体拉瓦特尔和变异嵌合体富尔戈尔。"
  npc_override_pub_cat_quests_dungeons_200_anyway_thank_you_today_b70914: "不管怎样，今天谢谢你了。"
  npc_override_pub_cat_quests_dungeons_200_anyway_you_want_collect_aff8c2: "不管怎样，你想要收集<FONT COLOR = 0000CD>多洛里安、普拉加里恩和戴德雷</FONT>的数据。"
  npc_override_pub_cat_quests_dungeons_200_area_accessed_level_high_09eb6f: " - 此区域需要215级以上才能进入 -"
  npc_override_pub_cat_quests_dungeons_200_as_expected_hero_rare_fi_db955f: "不愧是英雄。除了反叛者之外，很难找到像你这样真诚又干净利落工作的人。"
  npc_override_pub_cat_quests_dungeons_200_as_result_investigation_ce74c7: "调查结果表明，由于爆炸事故，正在培养的嵌合体失控，变成了怪物并被遗弃不管。"
  npc_override_pub_cat_quests_dungeons_200_ask_if_i_just_hunt_91c56f: "问我能不能直接狩猎"
  npc_override_pub_cat_quests_dungeons_200_back_hand_d711a2: "手背"
  npc_override_pub_cat_quests_dungeons_200_back_neck_433b6c: "后颈"
  npc_override_pub_cat_quests_dungeons_200_banquet_5d6f5a: "宴会是……"
  npc_override_pub_cat_quests_dungeons_200_banquet_hall_dead_9b7cf9: "死者的宴会厅。"
  npc_override_pub_cat_quests_dungeons_200_because_also_job_navi_yu_636a49: "因为这也是工作，<NAVI>[尤尔玛]<INFO>pub_cat,94,43,0,101,0</INFO></NAVI>会在你回来时给你一点津贴。"
  npc_override_pub_cat_quests_dungeons_200_because_also_job_since_i_d7ef80: "因为这也是工作……既然我安全地替换了他，上级就让我来处理津贴的事。"
  npc_override_pub_cat_quests_dungeons_200_because_i_t_just_leave_300546: "因为我不能把这交给任何人。"
  npc_override_pub_cat_quests_dungeons_200_become_gigantic_harbor_m_74b246: "变得巨大，或者拥有更多毒液……"
  npc_override_pub_cat_quests_dungeons_200_beloved_living_thank_you_a102e9: "亲爱的活人，谢谢你的慈悲。"
  npc_override_pub_cat_quests_dungeons_200_beyond_dangerous_so_acce_81ef18: "再往前就很危险了，所以除了一定等级以上的冒险者外，禁止进入。"
  npc_override_pub_cat_quests_dungeons_200_blessed_mercy_living_aef5bb: "愿活人的慈悲得到祝福！"
  npc_override_pub_cat_quests_dungeons_200_both_creatures_imitate_h_7c3af1: "两者都是模仿人类形态的生物，但在此基础上增加了嵌合体属性的强力变形。"
  npc_override_pub_cat_quests_dungeons_200_came_under_investigation_55f16d: "那个废弃实验室的管理员之一是沃纳，因此受到了调查。"
  npc_override_pub_cat_quests_dungeons_200_come_back_after_dawn_wor_0f6306: "天亮后再来，和我们一起工作吧！"
  npc_override_pub_cat_quests_dungeons_200_come_s_course_someone_as_35b06b: "来吧，就是这样。像你这么有才华的人当然可以去尼芙菲姆。"
  npc_override_pub_cat_quests_dungeons_200_course_i_don_t_many_fb6bd9: "当然，我剩下的日子不多了，而且这不是我该去的时候，我也来不及回来。"
  npc_override_pub_cat_quests_dungeons_200_course_they_come_again_t_8e4969: "当然没有。他们明天还会再来。"
  npc_override_pub_cat_quests_dungeons_200_crazy_villagers_over_the_4840c4: "那边的疯狂村民……他们每天都在举行宴会。"
  npc_override_pub_cat_quests_dungeons_200_data_backup_3cd559: "数据备份"
  npc_override_pub_cat_quests_dungeons_200_data_collected_automatic_214ca5: "数据会自动收集，所以你只需要专注于狩猎。"
  npc_override_pub_cat_quests_dungeons_200_despite_destruction_cult_8a151f: "尽管培养设施已被摧毁，但个体数量仍在持续增加，所以我想请你每种狩猎大约15个样本！"
  npc_override_pub_cat_quests_dungeons_200_did_you_find_any_traces_a5273b: "你找到什么痕迹了吗？"
  npc_override_pub_cat_quests_dungeons_200_different_homunculus_rep_827b97: "它与人工生命体的不同之处在于它会自我繁殖，并且在没有主人的情况下做出决定。"
  npc_override_pub_cat_quests_dungeons_200_documents_files_data_any_c1562a: "文件、档案、数据！什么都行。"
  npc_override_pub_cat_quests_dungeons_200_doesn_t_last_long_1b3784: "不会持续那么久……"
  npc_override_pub_cat_quests_dungeons_200_don_t_help_2f5ade: "不要帮忙"
  npc_override_pub_cat_quests_dungeons_200_don_t_look_him_e71efb: "不要找他"
  npc_override_pub_cat_quests_dungeons_200_drop_sweat_shines_passio_ca88ee: "这是一滴闪耀着热情与努力的汗水。"
  npc_override_pub_cat_quests_dungeons_200_earlobe_a02faa: "耳垂"
  npc_override_pub_cat_quests_dungeons_200_earth_fire_d221d6: "大地与火焰"
  npc_override_pub_cat_quests_dungeons_200_eh_won_t_you_24522e: "诶，你不愿意吗？"
  npc_override_pub_cat_quests_dungeons_200_even_if_i_look_you_9e9fc8: "即使我用眼睛看着你，也能一眼认出你的能力，请做点什么……！"
  npc_override_pub_cat_quests_dungeons_200_even_if_you_refuse_we_919d1c: "即使你拒绝，我们也没办法……"
  npc_override_pub_cat_quests_dungeons_200_evil_if_you_pretend_know_b06607: "邪恶！如果你假装知道，怪物就会来！"
  npc_override_pub_cat_quests_dungeons_200_excuse_me_no_more_work_5c9a9b: "不好意思！不要再工作了！"
  npc_override_pub_cat_quests_dungeons_200_excuse_me_sir_no_more_8bb08f: "不好意思，先生！不要再工作了！"
  npc_override_pub_cat_quests_dungeons_200_font_color_cd_font_roami_596d3b: "<FONT COLOR = 0000CD>{0}和{1}</FONT>将在封闭实验室阿米西提亚的一楼游荡。"
  npc_override_pub_cat_quests_dungeons_200_font_color_cd_font_stayi_0e3e86: "<FONT COLOR = 0000CD>{0}和{1}</FONT>正停留在封闭实验室阿米西提亚的一楼。"
  npc_override_pub_cat_quests_dungeons_200_font_size_um_these_resea_714d83: "<FONT SIZE = 9>嗯……这些研究人员看起来也有点危险？我觉得对所有研究人员来说，对一个像我这样的人来说就是这样。</FONT>"
  npc_override_pub_cat_quests_dungeons_200_font_size_um_why_don_e29ad9: "<FONT SIZE = 9>嗯……我们为什么不这样做呢？上层一定有什么复杂的事情。我不知道。</FONT>"
  npc_override_pub_cat_quests_dungeons_200_forehead_03cd04: "额头"
  npc_override_pub_cat_quests_dungeons_200_form_we_cannot_imagine_4c565f: "以我们无法想象的形式。"
  npc_override_pub_cat_quests_dungeons_200_fourth_floor_i_m_control_4ae4cd: "四楼？我就在那里控制……"
  npc_override_pub_cat_quests_dungeons_200_fun_d02eae: "会很有趣吗？"
  npc_override_pub_cat_quests_dungeons_200_gerbena_heartbroken_df05df: "格尔贝娜心碎了！"
  npc_override_pub_cat_quests_dungeons_200_gerbena_what_you_talking_a18e53: "格尔贝娜，你突然在说什么！"
  npc_override_pub_cat_quests_dungeons_200_ghost_talking_about_seen_3aba75: "那个说话的鬼魂不见了，另一个鬼魂正在睡觉。"
  npc_override_pub_cat_quests_dungeons_200_go_2e0b45: "去"
  npc_override_pub_cat_quests_dungeons_200_go_away_52cb87: "走开！"
  npc_override_pub_cat_quests_dungeons_200_go_back_quietly_93fc92: "悄悄回去"
  npc_override_pub_cat_quests_dungeons_200_go_tell_him_i_sent_251167: "去告诉他是我派你来的，看看值不值得来！"
  npc_override_pub_cat_quests_dungeons_200_good_field_work_13ff5e: "很好。实地工作。"
  npc_override_pub_cat_quests_dungeons_200_grant_idle_old_man_wish_8088fd: "满足一个闲居老人的愿望。"
  npc_override_pub_cat_quests_dungeons_200_guys_messy_hair_160b34: "头发凌乱的家伙"
  npc_override_pub_cat_quests_dungeons_200_ha_am_2121b0: "哈-嗯……"
  npc_override_pub_cat_quests_dungeons_200_ha_i_know_even_if_9876f6: "哈……我知道，即使每天都是如此，也有固定的时间。"
  npc_override_pub_cat_quests_dungeons_200_hahaha_did_you_hear_s_447e4e: "哈哈哈，你听到了吗？就像酒一样……不，如果你喝了魔法药水然后像鹰一样行动，就是那样。"
  npc_override_pub_cat_quests_dungeons_200_haunt_collapsed_opera_ho_ba3ff7: "在坍塌的歌剧院出没。"
  npc_override_pub_cat_quests_dungeons_200_he_doesn_t_like_he_f39057: "他不喜欢。他更喜欢一个人做，冷静点，格尔贝娜。"
  npc_override_pub_cat_quests_dungeons_200_he_first_floor_rudus_its_6bd17c: "他在一楼，而鲁杜斯本身存在于二、三楼。"
  npc_override_pub_cat_quests_dungeons_200_he_looks_cute_ee04ae: "他看起来很可爱"
  npc_override_pub_cat_quests_dungeons_200_he_probably_disguised_ob_17be9a: "他可能是伪装起来观察怪物的，但我会给你位置，去看看吧！"
  npc_override_pub_cat_quests_dungeons_200_he_s_known_hiding_very_e97d77: "他以隐藏得很好而闻名，尽管他没有隐藏的技能。"
  npc_override_pub_cat_quests_dungeons_200_he_said_he_doesn_t_f57bea: "他说他不喜欢的。他更喜欢一个人做，冷静点，格尔贝娜。"
  npc_override_pub_cat_quests_dungeons_200_hehe_s_good_good_convers_e9b4f7: "嘿嘿，和{0}好好交谈真好。"
  npc_override_pub_cat_quests_dungeons_200_help_c47ae1: "帮助"
  npc_override_pub_cat_quests_dungeons_200_help_hunting_6e4fce: "帮助狩猎"
  npc_override_pub_cat_quests_dungeons_200_here_glass_tropical_sogr_c836e2: "来，一杯热带索格拉特，请！"
  npc_override_pub_cat_quests_dungeons_200_here_you_53c9e6: "给你！"
  npc_override_pub_cat_quests_dungeons_200_hero_there_homunculus_in_9d7c6d: "英雄，阿米西提亚实验室二楼有一个人工生命体强化培养室。"
  npc_override_pub_cat_quests_dungeons_200_hero_these_things_we_lik_08e70d: "英雄，这些是阿米西提亚想拜托你的事情。"
  npc_override_pub_cat_quests_dungeons_200_hero_why_don_t_you_f39f91: "英雄，你为什么不冷静地重新考虑一下？"
  npc_override_pub_cat_quests_dungeons_200_hero_you_hunt_font_color_2908e8: "英雄，你能每种狩猎15个<FONT COLOR = 0000CD>{0}和{1}</FONT>吗？"
  npc_override_pub_cat_quests_dungeons_200_hero_you_like_join_missi_9662b6: "英雄，你明天也想加入任务吗？"
  npc_override_pub_cat_quests_dungeons_200_hick_15eed2: "……嗝。"
  npc_override_pub_cat_quests_dungeons_200_high_security_job_so_i_732619: "这是高度机密的工作，所以我只想请英雄帮忙。"
  npc_override_pub_cat_quests_dungeons_200_hmm_hmm_i_see_1791a4: "嗯嗯……我明白了！"
  npc_override_pub_cat_quests_dungeons_200_hmm_hmmm_entrance_down_s_6a9873: "嗯，嗯嗯。这个斜坡下面的入口现在被限制了……"
  npc_override_pub_cat_quests_dungeons_200_hmm_no_b6c16d: "嗯……不行。"
  npc_override_pub_cat_quests_dungeons_200_hmm_what_should_i_gerben_3b31e5: "嗯，我该怎么办？格尔贝娜。你想去吗？"
  npc_override_pub_cat_quests_dungeons_200_hmm_you_changed_your_min_1a4f73: "嗯？你改变主意了吗？"
  npc_override_pub_cat_quests_dungeons_200_hmmmm_connect_my_machine_a26212: "嗯嗯……连接我的机器……空数据……"
  npc_override_pub_cat_quests_dungeons_200_honor_work_you_d5d26e: "很荣幸能与你共事！"
  npc_override_pub_cat_quests_dungeons_200_how_did_you_know_chip_19dc44: "你怎么知道的，{0}，我放在你身上的芯片今天起作用了。"
  npc_override_pub_cat_quests_dungeons_200_how_did_you_recognize_me_f5bf0c: "你怎么认出我的？"
  npc_override_pub_cat_quests_dungeons_200_how_much_more_lost_s_ecdb9b: "它失去了多少原本的形态，以及在实验后是否改变了自己。"
  npc_override_pub_cat_quests_dungeons_200_however_true_number_rebe_c27772: "然而，由于总人数较少，确实要部署的反叛者数量有点不足。"
  npc_override_pub_cat_quests_dungeons_200_huh_7a6533: "……哈！"
  npc_override_pub_cat_quests_dungeons_200_huh_did_you_really_visit_8e7231: "嗯？你真的去了尼芙菲姆深处的宴会厅吗？"
  npc_override_pub_cat_quests_dungeons_200_huh_huh_i_hear_bomb_008c18: "哈，哈，我能听到炸弹头一路清理到这里的声音。"
  npc_override_pub_cat_quests_dungeons_200_huh_what_i_don_t_fc7830: "嗯？什么？我不跟小贩打交道。"
  npc_override_pub_cat_quests_dungeons_200_hunt_063772: "狩猎"
  npc_override_pub_cat_quests_dungeons_200_hunt_ea863f: "不要狩猎"
  npc_override_pub_cat_quests_dungeons_200_i_accept_dd2a95: "我接受"
  npc_override_pub_cat_quests_dungeons_200_i_am_always_indebted_you_9cc013: "我一直欠你人情。干得好！"
  npc_override_pub_cat_quests_dungeons_200_i_am_milla_i_am_3d0825: "我是米拉。我现在是尼芙菲姆的居民。"
  npc_override_pub_cat_quests_dungeons_200_i_am_prepared_like_so_d37566: "我已经做好了这样的准备，所以即使晚点去我也不会害怕！"
  npc_override_pub_cat_quests_dungeons_200_i_appreciate_if_you_coul_7e28a3: "如果你能保守这个请求的秘密，我会很感激。"
  npc_override_pub_cat_quests_dungeons_200_i_back_up_format_data_98db09: "而且我必须备份并格式化我收集的数据，以便接收新数据，但我没有那个才能……"
  npc_override_pub_cat_quests_dungeons_200_i_couldn_t_hear_anything_d00023: "我什么也听不到，但我周围的死者似乎一片哗然。"
  npc_override_pub_cat_quests_dungeons_200_i_couldn_t_tell_if_cf583b: "我无法判断它是被遗弃的还是故意的。"
  npc_override_pub_cat_quests_dungeons_200_i_didn_t_want_go_31eaca: "我不想通过太多人的口，所以反叛者部队被排除在这项工作之外。"
  npc_override_pub_cat_quests_dungeons_200_i_eagerly_waiting_0508a9: "我一直在热切地等待{0}！"
  npc_override_pub_cat_quests_dungeons_200_i_felt_like_i_could_896a0e: "我觉得即使死后也能做研究，所以感觉好多了。"
  npc_override_pub_cat_quests_dungeons_200_i_go_0f1302: "我会去"
  npc_override_pub_cat_quests_dungeons_200_i_go_876648: "我不去"
  npc_override_pub_cat_quests_dungeons_200_i_got_call_you_here_b1b84d: "我接到电话了。你是来更新芯片的吗？"
  npc_override_pub_cat_quests_dungeons_200_i_grateful_if_you_could_3fb814: "如果你能明天也加入任务，我会很感激。"
  npc_override_pub_cat_quests_dungeons_200_i_heard_navi_researcher_3b18c4: "我听说<NAVI>[研究员]<INFO>sp_rudus4,192,204,0,101,0</INFO></NAVI>大多在鲁杜斯四楼的中心附近活动。"
  npc_override_pub_cat_quests_dungeons_200_i_hope_they_return_their_d4105f: "我希望宴会结束后他们能恢复理智。"
  npc_override_pub_cat_quests_dungeons_200_i_hope_you_help_me_a8bba0: "如果你有时间，我希望你明天也能帮我。"
  npc_override_pub_cat_quests_dungeons_200_i_hope_you_show_hot_a30e1e: "我希望你向"
  npc_override_pub_cat_quests_dungeons_200_i_just_had_business_went_57372b: "我刚做完一笔生意，而且很顺利。"
  npc_override_pub_cat_quests_dungeons_200_i_like_ask_you_hunt_82cc35: "我想请你从正在培养的嵌合体中狩猎<FONT COLOR = 0000CD>{0}和{1}</FONT>。"
  npc_override_pub_cat_quests_dungeons_200_i_like_ask_you_hunt_d85edf: "我想请你从培养中的嵌合体中狩猎<FONT COLOR = 0000CD>{0}和{1}</FONT>。"
  npc_override_pub_cat_quests_dungeons_200_i_like_chocolate_milk_7bc91b: "我喜欢巧克力牛奶。"
  npc_override_pub_cat_quests_dungeons_200_i_like_more_research_if_f1c323: "我想做更多的研究，但如果我的生命真的处于危险之中……"
