Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_tra_fild01_TrainingZone123_aaaah_stop_stop_i_m_9a98b8: "啊啊啊——停下！停下！我不是怪物。别攻击我。"
  npc_override_tra_fild01_TrainingZone123_basic_skill_level_eff4ec: "基本技能等级6到"
  npc_override_tra_fild01_TrainingZone123_dad_told_me_dummys_staff_4493da: "爸爸告诉我！头上有法杖图标的假人对魔法很强！"
  npc_override_tra_fild01_TrainingZone123_dummies_training_grounds_7ae794: "训练场中对物理攻击很强的假人头上有剑图标，对魔法攻击很强的假人头上有法杖图标。"
  npc_override_tra_fild01_TrainingZone123_enter_basic_training_gro_0ae5fb: "进入基础训练场"
  npc_override_tra_fild01_TrainingZone123_fee_zeny_9bca12: "费用是1000 Zeny。"
  npc_override_tra_fild01_TrainingZone123_gororong_01ed0b: "咕噜咕噜——"
  npc_override_tra_fild01_TrainingZone123_guild_storage_only_avail_edb3e5: "公会仓库仅对公会成员可用。"
  npc_override_tra_fild01_TrainingZone123_hi_weather_really_nice_i_5b7afb: "嗨！天气真好，不是吗？我来参观新的训练场。"
  npc_override_tra_fild01_TrainingZone123_hohoho_seeing_young_peop_793cca: "呵呵呵——看到年轻人流汗努力，我感觉有点精力充沛了。"
  npc_override_tra_fild01_TrainingZone123_i_am_afraid_someone_else_90b72d: "恐怕现在有别的人正在使用仓库。"
  npc_override_tra_fild01_TrainingZone123_i_am_afraid_you_enough_d2bacb: "恐怕你没有足够的钱来支付费用。"
  npc_override_tra_fild01_TrainingZone123_i_ll_send_you_basic_314ec2: "我会送你去基础训练场。"
  npc_override_tra_fild01_TrainingZone123_i_ll_send_you_training_4c77da: "我会送你去1/10训练场。"
  npc_override_tra_fild01_TrainingZone123_i_ll_send_you_training_8d9ca4: "我会送你去1/100训练场。"
  npc_override_tra_fild01_TrainingZone123_i_m_definitely_practicin_63d25c: "我绝对不是在这里练习，因为被路过的多兰打败了。记住！"
  npc_override_tra_fild01_TrainingZone123_i_m_sorry_you_3aa10c: "很抱歉，但你"
  npc_override_tra_fild01_TrainingZone123_i_open_guild_storage_you_32b256: "那我就为你打开公会仓库。祝你玩得愉快！"
  npc_override_tra_fild01_TrainingZone123_if_you_know_you_ll_0a786d: "如果你知道这个，你就能打得更狠，对吧？"
  npc_override_tra_fild01_TrainingZone123_if_you_visit_rockridge_y_282610: "如果你去岩岭，你可以见到我们活生生的仙人掌。来看看吧。哈哈哈。"
  npc_override_tra_fild01_TrainingZone123_if_you_want_go_prontera_a173b6: "如果你想去普隆德拉，你可以通过遍布各处的守卫出口，或者通过3点钟和9点钟方向的传送门。认真的。"
  npc_override_tra_fild01_TrainingZone123_menu_there_34ec25: "有三个训练场:基础训练场、1/10训练场和1/100训练场。每个训练场之间的区别，我留给你自己去发现。"
  npc_override_tra_fild01_TrainingZone123_meow_823296: "喵——"
  npc_override_tra_fild01_TrainingZone123_msg_5bab61: "？"
  npc_override_tra_fild01_TrainingZone123_my_friend_said_bone_icon_6a48cd: "我朋友说它头上有骨头图标……？你得先看看。"
  npc_override_tra_fild01_TrainingZone123_need_move_different_area_5a8073: "需要在训练场内移动到不同区域？请选择你想移动到的位置。"
  npc_override_tra_fild01_TrainingZone123_need_novice_s_68e5c0: "需要初心者的"
  npc_override_tra_fild01_TrainingZone123_oh_right_move_another_tr_7b4f24: "哦，对了！要移动到另一个训练场，你可以使用3点钟和9点钟方向的传送门。记住！"
  npc_override_tra_fild01_TrainingZone123_oh_way_did_you_know_371571: "哦，顺便说一下。你知道吗？"
  npc_override_tra_fild01_TrainingZone123_old_training_grounds_wer_cdc1ae: "旧训练场也不差，但它们实际上是租借初学者使用了很长时间的空间，所以有一些不便之处。"
  npc_override_tra_fild01_TrainingZone123_please_come_back_after_c_c20cd8: "请在检查公会技能和仓库访问权限后再回来。"
  npc_override_tra_fild01_TrainingZone123_please_try_again_after_w_8e8536: "请稍后再试。"
  npc_override_tra_fild01_TrainingZone123_prontera_4f98c0: "前往普隆德拉"
  npc_override_tra_fild01_TrainingZone123_remember_once_you_ve_cho_9fe73b: "记住！一旦选择了名字，就很难更改，所以要慎重选择。"
  npc_override_tra_fild01_TrainingZone123_royal_court_set_up_train_d228c4: "皇家法院为希望测试自己技能的冒险者设立了训练场。如果你希望在各种条件下测试你的技能，我们会送你去训练场。"
  npc_override_tra_fild01_TrainingZone123_seems_yet_possible_your_db9d21: "看起来你的公会还无法使用公会仓库，或者你没有仓库的访问权限。"
  npc_override_tra_fild01_TrainingZone123_so_if_you_defeat_those_4acf1d: "所以……如果你能打败那些对魔法很强的假人，你真的很强，对吧？！"
  npc_override_tra_fild01_TrainingZone123_storage_1329c8: " 仓库1"
  npc_override_tra_fild01_TrainingZone123_they_re_building_such_sp_42282c: "但他们正在建造如此宽敞漂亮的新训练场。看起来他们最近财务状况相当不错！"
  npc_override_tra_fild01_TrainingZone123_they_say_training_dummys_a7e159: "他们说用头上有猫图标的假人训练可以帮助你在PvP中对抗多兰。"
  npc_override_tra_fild01_TrainingZone123_use_storage_service_03f6ae: "使用仓库服务。"
  npc_override_tra_fild01_TrainingZone123_way_where_s_undead_dummy_c1fccb: "顺便问一下，不死假人在哪里？"
  npc_override_tra_fild01_TrainingZone123_whew_thank_you_some_peop_33c6ee: "呼——谢谢。有些人经常把我误认为怪物穆卡，但我是来自一个叫岩岭的地方的仙人掌。"
  npc_override_tra_fild01_TrainingZone123_whoosh_cha_whoosh_cha_d90bcf: "嗖——嚓——嗖——嚓——"
  npc_override_tra_fild01_TrainingZone123_you_like_use_storage_zen_701e21: "你想使用仓库吗？使用训练场仓库需要1000 Zeny。请选择你想使用的仓库。"
  npc_override_tra_fild01_TrainingZone123_your_first_time_training_0c4d70: "这是你第一次来训练场吗？作为老手，我来介绍一下自己。"
  npc_override_tra_fild01_TrainingZone123_zeny_required_use_traini_3ceed5: "^4d4dff使用训练场仓库需要1000 Zeny。^000000"