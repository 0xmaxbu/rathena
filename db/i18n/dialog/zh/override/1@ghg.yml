Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@ghg_WaterGarden_accordance_gardeners_pla_009c5e: "根据园丁的植物培育和除草计划。普通和困难水花园每天仅限进入一次。"
  npc_override_1@ghg_WaterGarden_after_move_papilla_maze_695c6a: "移动之后……迷宫中的帕皮拉……请把它们全部修剪掉。"
  npc_override_1@ghg_WaterGarden_also_some_gardeners_dest_7640f1: "一些园丁也被入侵者摧毁了。"
  npc_override_1@ghg_WaterGarden_attack_range_varies_depe_1e48d0: "攻击范围因帕皮拉的颜色而异。"
  npc_override_1@ghg_WaterGarden_careful_papila_s_halluci_466c60: "小心帕皮拉的致幻剂。"
  npc_override_1@ghg_WaterGarden_careful_papillas_other_t_52792b: "小心，帕皮拉和其他类型的帕皮拉似乎在附近徘徊。"
  npc_override_1@ghg_WaterGarden_cleanup_complete_please_81170e: "清理完成。请前往下一个区域。"
  npc_override_1@ghg_WaterGarden_don_t_forget_go_out_793080: "别忘了出去和世雨对话，^0000CD领取你今天工作的奖励^000000。"
  npc_override_1@ghg_WaterGarden_end_garden_there_manager_378d08: "在花园的尽头，有一位管理员在等待开启下一个区域，所以当你到达那里时请和她说话。"
  npc_override_1@ghg_WaterGarden_enter_8017fb: "进入^CC0000{0}^000000。"
  npc_override_1@ghg_WaterGarden_enter_water_garden_14e07a: "^0000CD进入水花园"
  npc_override_1@ghg_WaterGarden_error_occurred_89cb9e: "发生……错误。"
  npc_override_1@ghg_WaterGarden_final_garden_opened_i_fo_19c728: "最后的花园打开了。但是……我忘了该做什么……"
  npc_override_1@ghg_WaterGarden_final_garden_opened_plea_34e49b: "最后的花园已打开。请前往下一个区域。"
  npc_override_1@ghg_WaterGarden_guest_i_d_like_you_4ae4ba: "客人，我想请你修剪一下植物和动物。"
  npc_override_1@ghg_WaterGarden_guest_you_already_move_n_0d6718: "客人，你已经可以移动到下一个区域了。"
  npc_override_1@ghg_WaterGarden_guests_welcome_water_gar_451b4d: " 客人们，欢迎来到水花园，"
  npc_override_1@ghg_WaterGarden_guests_welcome_water_gar_794210: "客人们，欢迎来到水花园。你们要去看帕皮拉吗？帕皮拉最近对入侵者很敏感……"
  npc_override_1@ghg_WaterGarden_hello_guest_1ea10d: "你好，客人。"
  npc_override_1@ghg_WaterGarden_i_warned_you_advanced_ca_3324c4: "我提前警告过你们，但要小心。修剪所有过度生长的植物和动物后，3点钟方向的门会打开。"
  npc_override_1@ghg_WaterGarden_i_warned_you_advanced_ca_3bdbd1: "我提前警告过你们，但要小心。"
  npc_override_1@ghg_WaterGarden_if_gardeners_ever_attack_2376de: "如果园丁攻击客人，说明他们都是坏掉的园丁，不要犹豫，直接消灭他们。"
  npc_override_1@ghg_WaterGarden_if_papilla_shows_up_duri_f375ec: "如果战斗中帕皮拉出现，把它引到相同颜色的柱子那里。"
  npc_override_1@ghg_WaterGarden_if_papilla_touches_light_11cbc8: "如果帕皮拉碰到光，它会受到伤害并死亡。"
  npc_override_1@ghg_WaterGarden_if_they_ever_attack_gues_333a94: "如果他们攻击客人，说明他们都是坏掉的园丁，不要犹豫，直接消灭他们。"
  npc_override_1@ghg_WaterGarden_if_you_safely_stop_silva_31917b: "如果你能安全地阻止银白帕皮拉，剩下的交给我们来处理！"
  npc_override_1@ghg_WaterGarden_instance_been_created_ye_d31305: "副本尚未创建。"
  npc_override_1@ghg_WaterGarden_magic_papilla_s_activate_fec7d7: "帕皮拉的魔法已激活。小心！"
  npc_override_1@ghg_WaterGarden_md_level_above_f498bd: "- 此副本适合180级以上。 -"
  npc_override_1@ghg_WaterGarden_next_garden_portal_creat_99b542: "下一个花园……传送门创建完成……向12点钟方向移动……来使用……谢谢……"
  npc_override_1@ghg_WaterGarden_obstructions_now_gone_yo_662587: "障碍物已经清除，你可以移动到下一个区域了。"
  npc_override_1@ghg_WaterGarden_oh_i_forgot_make_regular_226f0f: "哦，我忘了定期联系了！我会联络的。你在这里要不要来块饼干？"
  npc_override_1@ghg_WaterGarden_papilla_s_returned_9d3a82: "帕皮拉回来了！"
  npc_override_1@ghg_WaterGarden_papillas_playing_around_297871: "帕皮拉们到处玩耍。它们使用翅膀上的致幻材料进行短距离移动，或者对它们使用危险的魔法。"
  npc_override_1@ghg_WaterGarden_papillas_playing_around_f234d5: "帕皮拉们到处玩耍。"
  npc_override_1@ghg_WaterGarden_party_entering_d3d912: "队伍中的{0}，{1}，正在进入{2}。"
  npc_override_1@ghg_WaterGarden_party_leader_who_receive_96bd19: "^FF0000接到'水花园'或'困难水花园'任务的队伍领袖必须进入副本才能继续。如果更换队伍领袖，副本将被取消，你将无法继续。^000000"
  npc_override_1@ghg_WaterGarden_place_docks_54f4e2: "这里是码头。"
  npc_override_1@ghg_WaterGarden_please_check_07b3fc: "请确认。"
  npc_override_1@ghg_WaterGarden_please_note_any_abnormal_2a12ea: "^FF0000请注意，在副本内进行任何异常的怪物处理（如驯养）均不被视为正常行为。^000000"
  npc_override_1@ghg_WaterGarden_please_take_enough_rest_f730a5: "请充分休息，天亮后再来吧！"
  npc_override_1@ghg_WaterGarden_pruning_all_overgrown_pl_1f92a5: "修剪所有过度生长的植物和动物后，3点钟方向的门会打开。"
  npc_override_1@ghg_WaterGarden_reservation_instance_fai_f7a70c: "由于存在进行中的副本，'{0}'的预约失败了。"
  npc_override_1@ghg_WaterGarden_rose_garden_very_beautif_f6dcaa: "玫瑰花园是一个非常美丽的地方，但最近，由于成群出现的动物和植物，我们在维护方面遇到了困难。"
  npc_override_1@ghg_WaterGarden_s_dangerous_inside_you_t_e068fb: "但里面很危险。你现在不能进入。"
  npc_override_1@ghg_WaterGarden_s_little_slow_so_you_c721ed: "有点慢，所以你可能需要等待，但……下一个区域一定会打开的。"
  npc_override_1@ghg_WaterGarden_s_strange_i_forgot_yeste_2f9d4e: "真奇怪，昨天我忘了，今天也忘了。"
  npc_override_1@ghg_WaterGarden_ship_only_run_once_day_62a2a9: "这艘船每天只开一次！"
  npc_override_1@ghg_WaterGarden_thank_you_your_understan_8a3b2c: "谢谢你的理解。"
  npc_override_1@ghg_WaterGarden_then_i_ll_burn_incense_17a217: "那么，我来点燃召唤银白帕皮拉的香……"
  npc_override_1@ghg_WaterGarden_then_i_ll_show_you_cce968: "那么，我再给你指一次出去的路！"
  npc_override_1@ghg_WaterGarden_they_use_psychedelic_mat_a0e443: "它们使用翅膀上的致幻材料进行短距离移动，或者对它们使用危险的魔法。"
  npc_override_1@ghg_WaterGarden_wait_sec_267d13: "^008800等一下！！"
  npc_override_1@ghg_WaterGarden_we_don_t_any_ships_381ce5: "我们目前没有船在运营。但风景不错，请随便四处看看！"
  npc_override_1@ghg_WaterGarden_when_md_opened_please_sp_e19181: "当{0}副本开启后，请再次与我对话并选择^0000CD进入{1}^000000。"
  npc_override_1@ghg_WaterGarden_worry_i_already_contacte_6ba7c1: "别担心，我已经联系过阿尔法了。嘿嘿。"
  npc_override_1@ghg_WaterGarden_you_cannot_receive_any_m_5017ef: "你携带的物品太多了，无法再接收物品。请减轻负重后再试一次。^000000"
  npc_override_1@ghg_WaterGarden_you_didn_t_forget_your_e50c91: "你没忘记世雨的委托，就到这里来了对吧？"
  npc_override_1@ghg_WaterGarden_you_eliminated_all_obstr_01e2b2: "你已经清除了所有障碍物。请前往下一个区域。"
  npc_override_1@ghg_WaterGarden_you_enter_water_garden_a_723ba8: "- 队伍领袖进入副本后，你才能进入水花园。 -"
  npc_override_1@ghg_WaterGarden_you_going_see_papilla_pa_861bdc: "你们要去看帕皮拉吗？帕皮拉最近对入侵者很敏感……"
  npc_override_1@ghg_WaterGarden_you_like_take_ride_water_5dfc9d: "你想乘船去水花园吗？"
  npc_override_1@ghg_WaterGarden_you_tell_me_if_you_8dffe5: "如果你想进入水花园可以告诉我。"
