Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@eom_TempleOfDemonGod_abandon_body_used_demon_755c4d: "Abandon the body that used to be a demon, and the appearance after rebirth is just imitating the god..."
  npc_override_1@eom_TempleOfDemonGod_achieve_i_realized_i_mus_25aa08: "To achieve that, I realized I must abandon my old body."
  npc_override_1@eom_TempleOfDemonGod_activated_soul_globes_us_dee4a2: "Activated the Soul Globes used to open the Temple of the Demon God."
  npc_override_1@eom_TempleOfDemonGod_all_been_arranged_so_i_683544: "All this has been arranged so that I could be reborn as God."
  npc_override_1@eom_TempleOfDemonGod_all_you_fed_yet_come_6608ba: "Have all of you fed yet? Come out now!"
  npc_override_1@eom_TempleOfDemonGod_allow_me_aid_you_battle_c5316b: "allow me to aid you in this battle."
  npc_override_1@eom_TempleOfDemonGod_always_talk_about_creati_e1ec04: "Always talk about creating a new world and becoming a god..."
  npc_override_1@eom_TempleOfDemonGod_apostles_souls_key_openi_6ba661: "The Apostles' souls are the key to opening the Temple of the Demon God."
  npc_override_1@eom_TempleOfDemonGod_brinaranea_f37270: "Brinaranea"
  npc_override_1@eom_TempleOfDemonGod_brinaranea_health_set_9d9657: "Brinaranea health was set to 2.000.000."
  npc_override_1@eom_TempleOfDemonGod_burn_665ca3: "...BURN!"
  npc_override_1@eom_TempleOfDemonGod_burn_ashes_b66e21: "Burn to ashes!"
  npc_override_1@eom_TempleOfDemonGod_burn_make_beautiful_flam_c93e0a: "Burn and make beautiful flames!"
  npc_override_1@eom_TempleOfDemonGod_children_s_time_dinner_f937d2: "Children, it's time for dinner!"
  npc_override_1@eom_TempleOfDemonGod_chuckle_483441: "*Chuckle*"
  npc_override_1@eom_TempleOfDemonGod_come_out_my_children_exq_bb3503: "Come out, my children. An exquisite feast has delivered itself to us!"
  npc_override_1@eom_TempleOfDemonGod_could_you_dismiss_your_c_20781c: "Could you dismiss your current mercenary and hire me instead?"
  npc_override_1@eom_TempleOfDemonGod_course_you_must_exhauste_7212ea: "Of course. You must be exhausted."
  npc_override_1@eom_TempleOfDemonGod_crash_burn_b261b9: "Crash and burn!"
  npc_override_1@eom_TempleOfDemonGod_d_don_t_think_th_e19148: "D-don't think... th-this... is over.. You're... already... time..."
  npc_override_1@eom_TempleOfDemonGod_death_inevitable_step_ta_c5c67f: "Death is an inevitable step to take before rebirth."
  npc_override_1@eom_TempleOfDemonGod_demigod_health_set_a1e6b8: "Demigod health was set to 2.000.000."
  npc_override_1@eom_TempleOfDemonGod_despair_god_health_set_f9bb40: "Despair God health was set to 2.000.000."
  npc_override_1@eom_TempleOfDemonGod_didn_t_you_expect_all_c43ab0: "Didn't you expect this at all?"
  npc_override_1@eom_TempleOfDemonGod_disgusting_9501b1: "And disgusting."
  npc_override_1@eom_TempleOfDemonGod_don_t_look_me_like_ecc5e4: "Don't look at me like that. Everything is as planned."
  npc_override_1@eom_TempleOfDemonGod_don_t_scared_even_though_48a480: "Don't be scared, even though it's not an ordinary tree."
  npc_override_1@eom_TempleOfDemonGod_dreadful_place_compete_f_3bb7a1: "Can this dreadful place compete with the Frost of the Genesis?"
  npc_override_1@eom_TempleOfDemonGod_eliminate_demon_god_s_ap_62c532: "Eliminate the Demon God's Apostles, Ahat and Shnaim, and collect their souls."
  npc_override_1@eom_TempleOfDemonGod_enter_0abb0f: "Enter."
  npc_override_1@eom_TempleOfDemonGod_enter_now_2c6c87: "Enter now."
  npc_override_1@eom_TempleOfDemonGod_enter_through_tree_dee4ef: "Enter through the tree."
  npc_override_1@eom_TempleOfDemonGod_even_though_we_know_we_17ad92: "Even though we know this, we'll come back to walk the same path again. I hope I'll be able to fight by you every time..."
  npc_override_1@eom_TempleOfDemonGod_everyone_who_enters_worl_f858bf: "Everyone who enters this world will be dragged into the same loop."
  npc_override_1@eom_TempleOfDemonGod_everything_as_master_pla_40ec67: "Everything is as the Master has planned."
  npc_override_1@eom_TempleOfDemonGod_everything_here_mere_cop_c33197: "Everything in here is a mere copy of that in the outside world."
  npc_override_1@eom_TempleOfDemonGod_exit_9adcae: "Exit."
  npc_override_1@eom_TempleOfDemonGod_feels_like_things_over_y_33dd6e: "...It feels like things are not over yet,"
  npc_override_1@eom_TempleOfDemonGod_first_let_me_applaud_you_4a79f8: "First, let me applaud you for coming this far."
  npc_override_1@eom_TempleOfDemonGod_get_out_corner_demon_wor_eb2d64: "To get out of that corner of the demon world and rule the entire universe."
  npc_override_1@eom_TempleOfDemonGod_getting_more_interesting_4fd926: "This is getting more interesting. *Snicker*"
  npc_override_1@eom_TempleOfDemonGod_good_job_again_bbf16c: "Good job, again."
  npc_override_1@eom_TempleOfDemonGod_gosh_you_re_so_persisten_7a7605: "Gosh, you're so persistent."
  npc_override_1@eom_TempleOfDemonGod_grr_f79692: "Grr..."
  npc_override_1@eom_TempleOfDemonGod_guardian_nidhogg_joined_e4d1cb: "^4d4dffGuardian Nidhogg has joined your party.^000000"
  npc_override_1@eom_TempleOfDemonGod_guardian_nidhogg_rewarde_25fe4e: "^4d4dffGuardian Nidhogg has rewarded you with a large amount of EXP for defeating Brinaranea.^000000"
  npc_override_1@eom_TempleOfDemonGod_guardian_nidhogg_rewarde_b1b9ec: "^4d4dffGuardian Nidhogg has rewarded you with a large amount of EXP for defeating Muspellskoll.^000000"
  npc_override_1@eom_TempleOfDemonGod_hah_hah_c8aba8: "Hah hah..."
  npc_override_1@eom_TempleOfDemonGod_hah_hah_you_surprised_se_cd88f8: "Hah hah, are you surprised to see me here?"
  npc_override_1@eom_TempleOfDemonGod_he_abandoned_his_demon_b_56194a: "He abandoned his Demon body, just to become a mere facsimile of an existing god."
  npc_override_1@eom_TempleOfDemonGod_he_couldn_t_create_anyth_6c4513: "but he couldn't create anything on his own."
  npc_override_1@eom_TempleOfDemonGod_he_far_too_ambitious_eve_5beabb: "He was far too ambitious, even for him."
  npc_override_1@eom_TempleOfDemonGod_he_ll_live_forever_garde_b94810: "He'll live forever in this garden he couldn't finish."
  npc_override_1@eom_TempleOfDemonGod_he_paradox_116a8a: "He was a paradox."
  npc_override_1@eom_TempleOfDemonGod_he_probably_doesn_t_know_7cb098: "He probably doesn't know his body is destroyed forever."
  npc_override_1@eom_TempleOfDemonGod_he_s_created_nothing_his_bde039: "He's created nothing on his own. How did he convince himself to think that he could be a creator?"
  npc_override_1@eom_TempleOfDemonGod_he_s_creator_b11602: "He's not a creator."
  npc_override_1@eom_TempleOfDemonGod_he_should_here_keep_thin_36b2a6: "He should be here to keep thinking about the past!"
  npc_override_1@eom_TempleOfDemonGod_he_t_escape_so_called_73e6e2: "He can't escape the so-called god frame,"
  npc_override_1@eom_TempleOfDemonGod_he_took_shape_man_69d55d: "He took the shape of a man."
  npc_override_1@eom_TempleOfDemonGod_he_wanted_create_new_wor_7657f3: "He wanted to create a new world and become its creator,"
  npc_override_1@eom_TempleOfDemonGod_he_wasn_t_creative_enoug_17e3f3: "He wasn't creative enough to reinvent the concept of God."
  npc_override_1@eom_TempleOfDemonGod_hey_you_don_t_think_835338: "Hey, you don't think this is over already, do you?"
  npc_override_1@eom_TempleOfDemonGod_how_d_you_like_follow_d57679: "How'd you like to follow me and watch the birth of a new world?"
  npc_override_1@eom_TempleOfDemonGod_how_dare_you_lay_hand_a1a8e7: "How dare you lay a hand on a god-in-waiting?!"
  npc_override_1@eom_TempleOfDemonGod_hurts_my_brain_gap_i_c0bf82: "It hurts my brain, this is the gap I finally made..."
  npc_override_1@eom_TempleOfDemonGod_i_already_assisted_you_o_799155: "I already assisted you once."
  npc_override_1@eom_TempleOfDemonGod_i_died_once_so_i_3e07dc: "I died once, so that I could circle around the world and embrace it in my arms."
  npc_override_1@eom_TempleOfDemonGod_i_don_t_know_what_b8affc: "I don't know what to say."
  npc_override_1@eom_TempleOfDemonGod_i_give_you_approval_ques_6912f0: "I will give you approval for the quest, and you can report to the commander."
  npc_override_1@eom_TempleOfDemonGod_i_just_hope_morroc_inten_f12a63: "I just hope Morroc is not intent on what I fear most."
  npc_override_1@eom_TempleOfDemonGod_i_ll_accept_your_challen_52054f: "I'll accept your challenge."
  npc_override_1@eom_TempleOfDemonGod_i_ll_burn_you_slowly_e526d2: "I'll burn you slowly and painfully."
  npc_override_1@eom_TempleOfDemonGod_i_ll_create_new_world_0afe04: "I'll create a new world and become its Creator."
  npc_override_1@eom_TempleOfDemonGod_i_ll_put_you_rest_156ba5: "I'll put you to rest. It's my mercy!!!"
  npc_override_1@eom_TempleOfDemonGod_i_ll_show_you_true_c86455: "I'll show you the true depths of despair."
  npc_override_1@eom_TempleOfDemonGod_i_ll_take_your_blood_120ef6: "I'll take your blood!"
  npc_override_1@eom_TempleOfDemonGod_i_ll_take_your_life_56bb80: "I'll take your life."
  npc_override_1@eom_TempleOfDemonGod_i_ll_watch_you_mwa_1ece91: "I'll watch you. Mwa hah hah!"
  npc_override_1@eom_TempleOfDemonGod_i_look_easy_you_i_799f3b: "Do I look easy to you? I'll burn you to ashes!"
  npc_override_1@eom_TempleOfDemonGod_i_m_ahat_first_servant_ffe087: "I'm Ahat, the first servant of the Demon God."
  npc_override_1@eom_TempleOfDemonGod_i_m_going_catch_moment_968e87: "I'm going to catch a moment between its breaths to open up a path for you. Are you ready?"
  npc_override_1@eom_TempleOfDemonGod_i_m_going_down_without_be68a5: "I'm not going down without a fight!"
  npc_override_1@eom_TempleOfDemonGod_i_m_sorry_you_t_6478e0: "I'm sorry, but you can't enter this place without approval from the Commander."
  npc_override_1@eom_TempleOfDemonGod_i_m_still_unnerved_566f70: "But I'm still unnerved."
  npc_override_1@eom_TempleOfDemonGod_i_only_say_his_ambition_f1cff2: "I can only say that his ambition was too big..."
  npc_override_1@eom_TempleOfDemonGod_i_sense_325602: "I can sense that"
  npc_override_1@eom_TempleOfDemonGod_i_shall_drench_land_your_cb4798: "I shall drench the land with your flowing blood and nourish it with your torn flesh."
  npc_override_1@eom_TempleOfDemonGod_i_smell_human_grr_f46a83: "I smell human... Grr..."
  npc_override_1@eom_TempleOfDemonGod_i_t_say_736125: "I can't say."
  npc_override_1@eom_TempleOfDemonGod_i_understand_if_you_need_ad3f54: "I understand if you need time."
  npc_override_1@eom_TempleOfDemonGod_i_ve_been_reborn_engulf_d8cae5: "I've been reborn to engulf this world."
  npc_override_1@eom_TempleOfDemonGod_i_ve_been_waiting_day_40a02b: "I've been waiting for this day."
  npc_override_1@eom_TempleOfDemonGod_i_ve_been_waiting_you_39e8fc: "I've been waiting for you, hero-in-waiting. "
  npc_override_1@eom_TempleOfDemonGod_i_ve_talked_too_much_054ca9: "I've talked too much. The Commander must be waiting. Let me validate your feat, so you can report to him."
  npc_override_1@eom_TempleOfDemonGod_if_you_t_handle_him_1d80e5: "If you can't handle him, then you can't handle a god now, can you?"
  npc_override_1@eom_TempleOfDemonGod_if_you_think_you_ve_deb89b: "If you think you've come this far on your own,"
  npc_override_1@eom_TempleOfDemonGod_if_you_want_activate_sou_91760a: "If you want to activate the soul globes, you need Shnaim's soul."
  npc_override_1@eom_TempleOfDemonGod_inject_s_soul_into_empty_62d58f: "Inject {0}'s soul into the empty soul globe."
  npc_override_1@eom_TempleOfDemonGod_just_wait_while_entrance_0537c3: "Just wait a while, and the entrance will open."
  npc_override_1@eom_TempleOfDemonGod_let_me_ask_you_first_ad661f: "Let me ask you, the first creatures that have stepped into my newborn land."
  npc_override_1@eom_TempleOfDemonGod_let_me_guide_you_depth_4a5b54: "Let me guide you to the depth of the temple where Morroc lies in wait."
  npc_override_1@eom_TempleOfDemonGod_let_me_send_you_other_3a756f: "Let me send you to the other members of your Expedition, free of charge."
  npc_override_1@eom_TempleOfDemonGod_let_s_again_come_a71fd4: "Let's do this again. Come on!"
  npc_override_1@eom_TempleOfDemonGod_may_able_enter_moment_9d9e35: "may not be able to enter at the moment..."
  npc_override_1@eom_TempleOfDemonGod_may_good_enough_i_hope_22847e: "This may not be good enough, but I hope it'll help your growth."
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_4b6dcf: "Ahat: Well, well, maybe I forfeit my life today. Don't look at me like that. Everything is as planned."
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_7c40b3: "Ahat: My master wishes for Shnaim and I to put you to the test. To see if you deserve to be our guests."
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_7d56a6: "Ahat: Why don't I introduce myself officially? I'm Ahat, the first servant of the Demon God."
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_c88c97: "Ahat: If you think you've come this far on your own, you're mistaken."
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_cb4a18: "Ahat: So, you've come."
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_ee0261: "Ahat: Everything is as the Master has planned. For now, let's see if you can open this door."
  npc_override_1@eom_TempleOfDemonGod_menu_boy_351846: "Boy: All this has been arranged so that I could be reborn as God."
  npc_override_1@eom_TempleOfDemonGod_menu_boy_96871a: "Boy: Death is an inevitable step to take before rebirth. So I've been reborn--again, you've brought me back."
  npc_override_1@eom_TempleOfDemonGod_menu_boy_ae9bc4: "Boy: To achieve that, I realized I must abandon my old body. So I died--well, I let you kill me."
  npc_override_1@eom_TempleOfDemonGod_menu_boy_e3f1fb: "Boy: I've been waiting for this day. To get out of that corner of the demon world and rule the entire universe."
  npc_override_1@eom_TempleOfDemonGod_menu_brinaranea_13ecd2: "Brinaranea: Ooh, food walks into my lair."
  npc_override_1@eom_TempleOfDemonGod_menu_brinaranea_3a3431: "Brinaranea: My children will have a feast tonight. Ho ho ho!"
  npc_override_1@eom_TempleOfDemonGod_menu_loki_26b5a9: "Loki: Even if you burn your body, your power is not as potent as that of Ymir of the Genesis."
  npc_override_1@eom_TempleOfDemonGod_menu_loki_a4c7df: "Loki: Just the fact that you had to steal Yggdrasil shows your lack of creativity."
  npc_override_1@eom_TempleOfDemonGod_menu_loki_aea022: "Loki: Create a new world and become its Creator? If this is the new world you're talking about, then I'm disappointed."
  npc_override_1@eom_TempleOfDemonGod_menu_loki_c9de0b: "Loki: Are you running?"
  npc_override_1@eom_TempleOfDemonGod_menu_loki_e6a0eb: "Loki: Take a good look at yourself. You're delusional if you think you look like a creator of any kind."
  npc_override_1@eom_TempleOfDemonGod_menu_loki_ec810e: "Loki: Enough with your nonsense. Just say you like destroying things."
  npc_override_1@eom_TempleOfDemonGod_menu_morocc_022330: "Morocc: I'll create a new world and become its Creator. Let me ask you, the first creatures that have stepped into my newborn land."
  npc_override_1@eom_TempleOfDemonGod_menu_morocc_17f393: "Morocc: How'd you like to follow me and watch the birth of a new world?"
  npc_override_1@eom_TempleOfDemonGod_menu_morocc_a6d509: "Morocc: I died once, so that I could circle around the world and embrace it in my arms. I've been reborn to engulf this world."
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_1610ff: "Morroc: I'll watch you. Mwa hah hah!"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_4cf1e5: "Morroc: If you can't handle him, then you can't handle a god now, can you?"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_955da7: "Morroc: I'll take your flesh and blood as housewarming gifts for my new world."
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_b2911e: "Morroc: Pah!"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_b5a7bc: "Morroc: Behold the Frost of Audhumla I brought back to life, into this world."
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_b8da49: "Morroc: Come on, mortals!"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_de1883: "Morroc: You're already here, so let's not waste our time on talking."
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_e606cf: "Morroc: Have you beheld frost, the beginning of life?"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_e6430b: "Morroc: You're good. Can you taken on the wolf that swallowed the sun?"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_f36a8b: "Morroc: Mortal, you must have a death wish to come at me like this."
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_f4d050: "Morroc: Have you beheld the darkness of the Genesis?"
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_04d49b: "Nidhogg: The Frost has melted. The lava is flowing again!"
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_0bb548: "Nidhogg: Wow, his regenerative power is unheard of! Don't let him regenerate again!"
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_0e8a9b: "Nidhogg: Allow me to aid you in this battle."
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_29964d: "Nidhogg: Muspellskoll's influence has dissipated, and a new warp gate has appeared."
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_49d1fc: "Nidhogg: As the Guardian of Yggdrasil, I have to remove you from this world."
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_5837f1: "Nidhogg: Wait!"
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_9bb852: "Nidhogg: No... She's regenerated herself perfectly."
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_bfe766: "Nidhogg: Brinaranea's influence has dissipated, and a new warp gate has appeared."
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_c4578d: "Nidhogg: Even Yggdrasil denies your existence!"
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_ca6af4: "Nidhogg: I second that. You're unnecessary to this world. You don't belong here."
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_d42290: "Nidhogg: Muspellskoll is trying to regenerate itself using the lava!"
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_e6f4e0: "Nidhogg: My duty as the guardian isn't over yet."
  npc_override_1@eom_TempleOfDemonGod_menu_options_a2cad0: "{0} : What are you talking about?"
  npc_override_1@eom_TempleOfDemonGod_menu_party_2e5e7f: "Party Name: {0}"
  npc_override_1@eom_TempleOfDemonGod_menu_party_8c7899: "Party Leader: {0}"
  npc_override_1@eom_TempleOfDemonGod_msg_1aff49: "{0},"
  npc_override_1@eom_TempleOfDemonGod_msg_1f0904: "---!!!"
  npc_override_1@eom_TempleOfDemonGod_muspellskoll_health_set_f6b600: "Muspellskoll health was set to 2.000.000."
  npc_override_1@eom_TempleOfDemonGod_mwah_hah_dodge_if_you_a0ac16: "Mwah hah, dodge this if you can!"
  npc_override_1@eom_TempleOfDemonGod_my_duty_as_guardian_isn_ef0e8c: "My duty as the guardian isn't over yet."
  npc_override_1@eom_TempleOfDemonGod_my_fire_swallow_you_whol_b8d2fc: "My fire will swallow you whole!"
  npc_override_1@eom_TempleOfDemonGod_my_master_wishes_shnaim_5c0db7: "My master wishes for Shnaim and I to put you to the test."
  npc_override_1@eom_TempleOfDemonGod_no_entry_permission_been_f89720: "No entry permission has been issued under the name of your party."
  npc_override_1@eom_TempleOfDemonGod_now_let_s_see_if_c9fa44: "For now, let's see if you can open this door."
  npc_override_1@eom_TempleOfDemonGod_now_we_need_get_out_c697c6: "Now we need to get out of this trap in time and end; to reality."
  npc_override_1@eom_TempleOfDemonGod_okay_4371ac: "Okay."
  npc_override_1@eom_TempleOfDemonGod_only_party_leaders_contr_470414: "Only party leaders can control access to the Temple of the Demon God."
  npc_override_1@eom_TempleOfDemonGod_only_party_leaders_perfo_40f510: "Only party leaders can perform this event."
  npc_override_1@eom_TempleOfDemonGod_ooh_game_looks_delicious_f70b54: "Ooh, game. It looks delicious!"
  npc_override_1@eom_TempleOfDemonGod_party_entering_temple_de_b8b40d: "{0} of the party {1}, is entering Temple of the Demon God."
  npc_override_1@eom_TempleOfDemonGod_perhaps_flow_mana_guide_906530: "Perhaps the flow of mana will guide you to the depth of the temple."
  npc_override_1@eom_TempleOfDemonGod_place_too_dangerous_you_e03f16: "This place is too dangerous for you to explore alone."
