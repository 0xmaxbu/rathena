Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@eom_TempleOfDemonGod_abandon_body_used_demon_755c4d: "放弃曾经是恶魔的躯体，重生后的外表只是在模仿神明……"
  npc_override_1@eom_TempleOfDemonGod_achieve_i_realized_i_mus_25aa08: "为了实现那个目标，我意识到必须放弃我的旧躯体。"
  npc_override_1@eom_TempleOfDemonGod_activated_soul_globes_us_dee4a2: "激活了用于打开魔神殿的灵魂球。"
  npc_override_1@eom_TempleOfDemonGod_all_been_arranged_so_i_683544: "这一切都是为了让我能重生为神而安排的。"
  npc_override_1@eom_TempleOfDemonGod_all_you_fed_yet_come_6608ba: "你们都吃饱了吗？现在出来吧！"
  npc_override_1@eom_TempleOfDemonGod_allow_me_aid_you_battle_c5316b: "请允许我在这场战斗中协助你。"
  npc_override_1@eom_TempleOfDemonGod_always_talk_about_creati_e1ec04: "总是说要创造一个新世界，成为神……"
  npc_override_1@eom_TempleOfDemonGod_apostles_souls_key_openi_6ba661: "使徒的灵魂是打开魔神殿的钥匙。"
  npc_override_1@eom_TempleOfDemonGod_brinaranea_f37270: "布莉娜拉妮亚"
  npc_override_1@eom_TempleOfDemonGod_brinaranea_health_set_9d9657: "Brinaranea 的生命值被设置为 2.000.000。"
  npc_override_1@eom_TempleOfDemonGod_burn_665ca3: "……燃烧吧！"
  npc_override_1@eom_TempleOfDemonGod_burn_ashes_b66e21: "烧成灰烬！"
  npc_override_1@eom_TempleOfDemonGod_burn_make_beautiful_flam_c93e0a: "燃烧吧，创造美丽的火焰！"
  npc_override_1@eom_TempleOfDemonGod_children_s_time_dinner_f937d2: "孩子们，该吃晚饭了！"
  npc_override_1@eom_TempleOfDemonGod_chuckle_483441: "'*轻笑*'"
  npc_override_1@eom_TempleOfDemonGod_come_out_my_children_exq_bb3503: "出来吧，我的孩子们。一场精致的盛宴已经送到我们面前！"
  npc_override_1@eom_TempleOfDemonGod_could_you_dismiss_your_c_20781c: "你能解雇你现在的雇佣兵，改雇我吗？"
  npc_override_1@eom_TempleOfDemonGod_course_you_must_exhauste_7212ea: "当然。你一定累坏了。"
  npc_override_1@eom_TempleOfDemonGod_crash_burn_b261b9: "崩溃并燃烧吧！"
  npc_override_1@eom_TempleOfDemonGod_d_don_t_think_th_e19148: "别、别以为……这、这就……结束了……你……已经……时间……"
  npc_override_1@eom_TempleOfDemonGod_death_inevitable_step_ta_c5c67f: "死亡是重生之前不可避免的步骤。"
  npc_override_1@eom_TempleOfDemonGod_demigod_a0112a: "半神"
  npc_override_1@eom_TempleOfDemonGod_demigod_health_set_a1e6b8: "半神的生命值被设置为 2.000.000。"
  npc_override_1@eom_TempleOfDemonGod_despair_god_b74ef3: "绝望之神"
  npc_override_1@eom_TempleOfDemonGod_despair_god_health_set_f9bb40: "绝望之神的生命值被设置为 2.000.000。"
  npc_override_1@eom_TempleOfDemonGod_didn_t_you_expect_all_c43ab0: "你难道一点都没预料到吗？"
  npc_override_1@eom_TempleOfDemonGod_disgusting_9501b1: "而且令人厌恶。"
  npc_override_1@eom_TempleOfDemonGod_don_t_look_me_like_ecc5e4: "别那样看着我。一切都在计划之中。"
  npc_override_1@eom_TempleOfDemonGod_don_t_scared_even_though_48a480: "别害怕，尽管这不是一棵普通的树。"
  npc_override_1@eom_TempleOfDemonGod_dreadful_place_compete_f_3bb7a1: "这个可怕的地方能与创世之霜抗衡吗？"
  npc_override_1@eom_TempleOfDemonGod_eliminate_demon_god_s_ap_62c532: "消灭魔神的使徒 Ahat 和 Shnaim，并收集他们的灵魂。"
  npc_override_1@eom_TempleOfDemonGod_enter_0abb0f: "进入。"
  npc_override_1@eom_TempleOfDemonGod_enter_b9e5bc: "不要进入。"
  npc_override_1@eom_TempleOfDemonGod_enter_now_2c6c87: "现在进入。"
  npc_override_1@eom_TempleOfDemonGod_enter_through_tree_dee4ef: "通过树进入。"
  npc_override_1@eom_TempleOfDemonGod_even_though_we_know_we_17ad92: "即使我们知道这一点，我们还是会回来走同样的路。我希望每次都能在你身边战斗……"
  npc_override_1@eom_TempleOfDemonGod_everyone_who_enters_worl_f858bf: "每个进入这个世界的人都会被拖入同一个循环。"
  npc_override_1@eom_TempleOfDemonGod_everything_as_master_pla_40ec67: "一切都在主人的计划之中。"
  npc_override_1@eom_TempleOfDemonGod_everything_here_mere_cop_c33197: "这里的一切只是外界世界的复制品。"
  npc_override_1@eom_TempleOfDemonGod_exit_9adcae: "退出。"
  npc_override_1@eom_TempleOfDemonGod_feels_like_things_over_y_33dd6e: "……感觉事情还没结束，"
  npc_override_1@eom_TempleOfDemonGod_first_let_me_applaud_you_4a79f8: "首先，让我为你能走到这里鼓掌。"
  npc_override_1@eom_TempleOfDemonGod_get_out_corner_demon_wor_eb2d64: "为了走出恶魔世界的那个角落，统治整个宇宙。"
  npc_override_1@eom_TempleOfDemonGod_getting_more_interesting_4fd926: "这越来越有趣了。*窃笑*"
  npc_override_1@eom_TempleOfDemonGod_good_job_again_bbf16c: "再次干得好。"
  npc_override_1@eom_TempleOfDemonGod_gosh_you_re_so_persisten_7a7605: "天哪，你真执着。"
  npc_override_1@eom_TempleOfDemonGod_grr_f79692: "咕噜……"
  npc_override_1@eom_TempleOfDemonGod_guardian_nidhogg_joined_e4d1cb: "^4d4dff守护者 Nidhogg 已加入你的队伍。^000000"
  npc_override_1@eom_TempleOfDemonGod_guardian_nidhogg_rewarde_25fe4e: "^4d4dff守护者 Nidhogg 因你击败 Brinaranea 而奖励你大量经验值。^000000"
  npc_override_1@eom_TempleOfDemonGod_guardian_nidhogg_rewarde_b1b9ec: "^4d4dff守护者 Nidhogg 因你击败 Muspellskoll 而奖励你大量经验值。^000000"
  npc_override_1@eom_TempleOfDemonGod_hah_hah_c8aba8: "哈哈……"
  npc_override_1@eom_TempleOfDemonGod_hah_hah_you_surprised_se_cd88f8: "哈哈，你在这里看到我惊讶吗？"
  npc_override_1@eom_TempleOfDemonGod_he_abandoned_his_demon_b_56194a: "他放弃了他的恶魔躯体，只是为了成为一个现存神明的仿制品。"
  npc_override_1@eom_TempleOfDemonGod_he_couldn_t_create_anyth_6c4513: "但他无法自己创造任何东西。"
  npc_override_1@eom_TempleOfDemonGod_he_far_too_ambitious_eve_5beabb: "他太有野心了，即使对他来说也是如此。"
  npc_override_1@eom_TempleOfDemonGod_he_ll_live_forever_garde_b94810: "他将永远活在这个他无法完成的花园里。"
  npc_override_1@eom_TempleOfDemonGod_he_paradox_116a8a: "他是一个悖论。"
  npc_override_1@eom_TempleOfDemonGod_he_probably_doesn_t_know_7cb098: "他可能不知道他的躯体已被永远摧毁。"
  npc_override_1@eom_TempleOfDemonGod_he_s_created_nothing_his_bde039: "他自己什么都没创造。他如何说服自己认为自己可以成为创造者？"
  npc_override_1@eom_TempleOfDemonGod_he_s_creator_b11602: "他不是创造者。"
  npc_override_1@eom_TempleOfDemonGod_he_should_here_keep_thin_36b2a6: "他应该在这里继续思考过去！"
  npc_override_1@eom_TempleOfDemonGod_he_t_escape_so_called_73e6e2: "他无法逃脱所谓的神之框架，"
  npc_override_1@eom_TempleOfDemonGod_he_took_shape_man_69d55d: "他变成了人的形态。"
  npc_override_1@eom_TempleOfDemonGod_he_wanted_create_new_wor_7657f3: "他想创造一个新世界，成为它的创造者，"
  npc_override_1@eom_TempleOfDemonGod_he_wasn_t_creative_enoug_17e3f3: "他没有足够的创造力来重新发明神的概念。"
  npc_override_1@eom_TempleOfDemonGod_hey_you_don_t_think_835338: "嘿，你不会以为这就结束了吧？"
  npc_override_1@eom_TempleOfDemonGod_how_d_you_like_follow_d57679: "你愿意跟随我，见证一个新世界的诞生吗？"
  npc_override_1@eom_TempleOfDemonGod_how_dare_you_lay_hand_a1a8e7: "你竟敢对即将成神者动手？！"
  npc_override_1@eom_TempleOfDemonGod_hurts_my_brain_gap_i_c0bf82: "这让我头疼，这是我终于制造的缺口……"
  npc_override_1@eom_TempleOfDemonGod_i_already_assisted_you_o_799155: "我已经帮助过你一次了。"
  npc_override_1@eom_TempleOfDemonGod_i_died_once_so_i_3e07dc: "我曾经死过一次，这样我就可以环游世界，将它拥入怀中。"
  npc_override_1@eom_TempleOfDemonGod_i_don_t_know_what_b8affc: "我不知道该说什么。"
  npc_override_1@eom_TempleOfDemonGod_i_give_you_approval_ques_6912f0: "我会批准你的任务，你可以向指挥官报告。"
  npc_override_1@eom_TempleOfDemonGod_i_just_hope_morroc_inten_f12a63: "我只希望 Morroc 没有打算做我最害怕的事情。"
  npc_override_1@eom_TempleOfDemonGod_i_ll_accept_your_challen_52054f: "我接受你的挑战。"
  npc_override_1@eom_TempleOfDemonGod_i_ll_burn_you_slowly_e526d2: "我会缓慢而痛苦地燃烧你。"
  npc_override_1@eom_TempleOfDemonGod_i_ll_create_new_world_0afe04: "我会创造一个新世界，成为它的创造者。"
  npc_override_1@eom_TempleOfDemonGod_i_ll_put_you_rest_156ba5: "我会让你安息。这是我的仁慈！！！"
  npc_override_1@eom_TempleOfDemonGod_i_ll_show_you_true_c86455: "我会让你见识真正的绝望深渊。"
  npc_override_1@eom_TempleOfDemonGod_i_ll_take_your_blood_120ef6: "我会取走你的血！"
  npc_override_1@eom_TempleOfDemonGod_i_ll_take_your_life_56bb80: "我会取走你的性命。"
  npc_override_1@eom_TempleOfDemonGod_i_ll_watch_you_mwa_1ece91: "我会看着你。哇哈哈哈！"
  npc_override_1@eom_TempleOfDemonGod_i_look_easy_you_i_799f3b: "我看起来很好对付吗？我会把你烧成灰烬！"
  npc_override_1@eom_TempleOfDemonGod_i_m_ahat_first_servant_ffe087: "我是 Ahat，魔神的第一个仆人。"
  npc_override_1@eom_TempleOfDemonGod_i_m_going_catch_moment_968e87: "我要抓住它呼吸之间的瞬间，为你开辟一条道路。你准备好了吗？"
  npc_override_1@eom_TempleOfDemonGod_i_m_going_down_without_be68a5: "我不会不战而降！"
  npc_override_1@eom_TempleOfDemonGod_i_m_sorry_you_t_6478e0: "抱歉，但没有指挥官的批准，你不能进入这个地方。"
  npc_override_1@eom_TempleOfDemonGod_i_m_still_unnerved_566f70: "但我仍然感到不安。"
  npc_override_1@eom_TempleOfDemonGod_i_only_say_his_ambition_f1cff2: "我只能说他的野心太大了……"
  npc_override_1@eom_TempleOfDemonGod_i_sense_325602: "我能感觉到"
  npc_override_1@eom_TempleOfDemonGod_i_shall_drench_land_your_cb4798: "我会用你流淌的血浸透大地，用你撕裂的肉体滋养它。"
  npc_override_1@eom_TempleOfDemonGod_i_smell_human_grr_f46a83: "我闻到人类的气味……咕噜……"
  npc_override_1@eom_TempleOfDemonGod_i_t_say_736125: "我不能说。"
  npc_override_1@eom_TempleOfDemonGod_i_understand_if_you_need_ad3f54: "如果你需要时间，我能理解。"
  npc_override_1@eom_TempleOfDemonGod_i_ve_been_reborn_engulf_d8cae5: "我已经重生，要吞噬这个世界。"
  npc_override_1@eom_TempleOfDemonGod_i_ve_been_waiting_day_40a02b: "我一直在等待这一天。"
  npc_override_1@eom_TempleOfDemonGod_i_ve_been_waiting_you_39e8fc: "我一直在等你，未来的英雄。"
  npc_override_1@eom_TempleOfDemonGod_i_ve_talked_too_much_054ca9: "我说得太多了。指挥官一定在等。让我验证你的功绩，这样你就可以向他报告了。"
  npc_override_1@eom_TempleOfDemonGod_if_you_t_handle_him_1d80e5: "如果你对付不了他，那你现在也就对付不了神，对吧？"
  npc_override_1@eom_TempleOfDemonGod_if_you_think_you_ve_deb89b: "如果你认为你是靠自己走到这一步的，"
  npc_override_1@eom_TempleOfDemonGod_if_you_want_activate_sou_91760a: "如果你想激活灵魂球，你需要 Shnaim 的灵魂。"
  npc_override_1@eom_TempleOfDemonGod_inject_s_soul_into_empty_62d58f: "将 {0} 的灵魂注入空的灵魂球。"
  npc_override_1@eom_TempleOfDemonGod_just_wait_while_entrance_0537c3: "稍等片刻，入口就会打开。"
  npc_override_1@eom_TempleOfDemonGod_let_me_ask_you_first_ad661f: "让我问问你们，第一批踏入我新生土地的生灵。"
  npc_override_1@eom_TempleOfDemonGod_let_me_guide_you_depth_4a5b54: "让我引导你前往 Morroc 埋伏的神殿深处。"
  npc_override_1@eom_TempleOfDemonGod_let_me_send_you_other_3a756f: "让我免费送你到远征队的其他成员那里。"
  npc_override_1@eom_TempleOfDemonGod_let_s_again_come_a71fd4: "我们再来一次。来吧！"
  npc_override_1@eom_TempleOfDemonGod_may_able_enter_moment_9d9e35: "此刻可能无法进入……"
  npc_override_1@eom_TempleOfDemonGod_may_good_enough_i_hope_22847e: "这可能不够好，但我希望它能帮助你成长。"
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_4b6dcf: "Ahat:好吧，好吧，也许我今天要放弃我的生命了。别那样看着我。一切都在计划之中。"
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_7c40b3: "Ahat:我的主人希望 Shnaim 和我来考验你。看看你是否值得成为我们的客人。"
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_7d56a6: "Ahat:我为什么不正式介绍一下自己呢？我是 Ahat，魔神的第一个仆人。"
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_c88c97: "Ahat:如果你认为你是靠自己走到这一步的，那你就错了。"
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_cb4a18: "Ahat:那么，你来了。"
  npc_override_1@eom_TempleOfDemonGod_menu_ahat_ee0261: "Ahat:一切都在主人的计划之中。现在，让我们看看你能不能打开这扇门。"
  npc_override_1@eom_TempleOfDemonGod_menu_boy_351846: "少年:这一切都是为了让我能重生为神而安排的。"
  npc_override_1@eom_TempleOfDemonGod_menu_boy_96871a: "少年:死亡是重生之前不可避免的步骤。所以我已经重生了——再次，你把我带了回来。"
  npc_override_1@eom_TempleOfDemonGod_menu_boy_ae9bc4: "少年:为了实现那个目标，我意识到必须放弃我的旧躯体。所以我死了——嗯，我让你杀了我。"
  npc_override_1@eom_TempleOfDemonGod_menu_boy_e3f1fb: "少年:我一直在等待这一天。为了走出恶魔世界的那个角落，统治整个宇宙。"
  npc_override_1@eom_TempleOfDemonGod_menu_brinaranea_13ecd2: "Brinaranea:哦，食物走进了我的巢穴。"
  npc_override_1@eom_TempleOfDemonGod_menu_brinaranea_3a3431: "Brinaranea:我的孩子们今晚将有一场盛宴。呵呵呵！"
  npc_override_1@eom_TempleOfDemonGod_menu_loki_26b5a9: "Loki:即使你燃烧你的躯体，你的力量也不如创世之初的 Ymir 强大。"
  npc_override_1@eom_TempleOfDemonGod_menu_loki_a4c7df: "Loki:仅仅是你必须偷走 Yggdrasil 这一事实，就显示了你的创造力匮乏。"
  npc_override_1@eom_TempleOfDemonGod_menu_loki_aea022: "Loki:创造一个新世界，成为它的创造者？如果这就是你说的那个新世界，那我失望了。"
  npc_override_1@eom_TempleOfDemonGod_menu_loki_c9de0b: "Loki:你在逃跑吗？"
  npc_override_1@eom_TempleOfDemonGod_menu_loki_e6a0eb: "Loki:好好看看你自己。如果你认为自己看起来像任何形式的创造者，那你就是妄想。"
  npc_override_1@eom_TempleOfDemonGod_menu_loki_ec810e: "Loki:够了，别说废话了。直接说你喜欢破坏东西吧。"
  npc_override_1@eom_TempleOfDemonGod_menu_morocc_022330: "梦罗克:我会创造一个新世界，成为它的创造者。让我问问你们，第一批踏入我新生土地的生灵。"
  npc_override_1@eom_TempleOfDemonGod_menu_morocc_17f393: "梦罗克:你愿意跟随我，见证一个新世界的诞生吗？"
  npc_override_1@eom_TempleOfDemonGod_menu_morocc_a6d509: "梦罗克:我曾经死过一次，这样我就可以环游世界，将它拥入怀中。我已经重生，要吞噬这个世界。"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_1610ff: "Morroc:我会看着你。哇哈哈哈！"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_4cf1e5: "Morroc:如果你对付不了他，那你现在也就对付不了神，对吧？"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_955da7: "Morroc:我会把你的血肉作为我新世界的乔迁礼物。"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_b2911e: "Morroc:呸！"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_b5a7bc: "Morroc:看啊，我将 Audhumla 之霜带回这个世界，让它复活。"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_b8da49: "Morroc:来吧，凡人！"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_de1883: "Morroc:你已经来了，所以我们不要浪费时间在说话上。"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_e606cf: "Morroc:你见过霜吗，生命的起源？"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_e6430b: "Morroc:你很厉害。你能对付吞下太阳的那只狼吗？"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_f36a8b: "Morroc:凡人，你这样冲我来一定是想死。"
  npc_override_1@eom_TempleOfDemonGod_menu_morroc_f4d050: "Morroc:你见过创世之初的黑暗吗？"
  npc_override_1@eom_TempleOfDemonGod_menu_nidhogg_04d49b: "Nidhogg:霜已经融化了。岩浆又开始流动了！"
