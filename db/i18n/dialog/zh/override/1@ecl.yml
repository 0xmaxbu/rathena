Header:
  Type: I18N_DIALOG
  Version: 1
Body:
  npc_override_1@ecl_EclageInterior_all_laphines_think_orb_a_2e9bdd: "所有 Laphines 都认为宝珠像空气和水一样自然，但他是第一个让我以不同方式感知它并调查其起源的人。"
  npc_override_1@ecl_EclageInterior_all_probablility_you_da7844: "十有八九，{0}会是你。"
  npc_override_1@ecl_EclageInterior_although_you_re_detained_7f7dc3: "虽然你因涉嫌对照明室最近发生的事件负责而被拘留，"
  npc_override_1@ecl_EclageInterior_anyway_guy_guilty_7461d4: "无论如何，这个人没有罪。"
  npc_override_1@ecl_EclageInterior_bah_da9552: "……呸。"
  npc_override_1@ecl_EclageInterior_battle_cannot_avoided_6e47ba: "战斗无法避免！"
  npc_override_1@ecl_EclageInterior_because_my_sons_74e09a: "是因为我的儿子们吗？"
  npc_override_1@ecl_EclageInterior_both_you_karr_won_t_a5e845: "但你和 Karr 都无法逃避责任。"
  npc_override_1@ecl_EclageInterior_chief_staff_laphine_who_012a1b: "参谋长是和我们在一起很久的 Laphine！他不可能……"
  npc_override_1@ecl_EclageInterior_closed_shut_c5d594: "它紧闭着。"
  npc_override_1@ecl_EclageInterior_current_quest_held_memor_f4cf48: "当前任务将在纪念地下城进行。"
  npc_override_1@ecl_EclageInterior_did_something_happen_you_e73bb6: "你发生了什么事吗？"
  npc_override_1@ecl_EclageInterior_doesn_t_matter_1a693c: "没关系。"
  npc_override_1@ecl_EclageInterior_don_t_worry_about_us_2c5c12: "不用担心我们。"
  npc_override_1@ecl_EclageInterior_door_connects_plaza_s_ce_2ad57a: "这扇门连接着广场的天花板。"
  npc_override_1@ecl_EclageInterior_empty_room_nothing_insid_270ffb: "一个空房间，里面什么都没有。"
  npc_override_1@ecl_EclageInterior_farewell_then_12f614: "那么，再见！"
  npc_override_1@ecl_EclageInterior_given_tight_internal_sec_baea91: "鉴于内部安保严密，你应该做好准备。"
  npc_override_1@ecl_EclageInterior_group_unidentifiable_cre_dc5d85: "一群无法识别的生物正威胁性地逼近。"
  npc_override_1@ecl_EclageInterior_ha_hahaha_4d43be: "哈……哈哈哈……"
  npc_override_1@ecl_EclageInterior_hah_e59629: "哈……"
  npc_override_1@ecl_EclageInterior_he_might_been_under_infl_ed16f0: "他可能已经受到影响有一段时间了。"
  npc_override_1@ecl_EclageInterior_hehehe_hahahhaha_ahahaha_f001eb: "嘿嘿嘿……哈哈哈哈……啊哈哈哈哈"
  npc_override_1@ecl_EclageInterior_hey_look_who_s_here_b3584e: "嘿，看看谁来了！"
  npc_override_1@ecl_EclageInterior_his_power_enbales_him_co_1d505a: "他的力量使他能够直接控制另一个人，或者通过身体的一部分间接地精神影响那个人。"
  npc_override_1@ecl_EclageInterior_hmm_room_60db3c: "嗯？这个房间？"
  npc_override_1@ecl_EclageInterior_hopefully_d4a70f: "……希望如此。"
  npc_override_1@ecl_EclageInterior_how_powerful_shenime_e56fe0: "这就是 Shenime 的强大之处。"
  npc_override_1@ecl_EclageInterior_i_also_believe_you_re_7d36f1: "但我也相信你没有罪。"
  npc_override_1@ecl_EclageInterior_i_didn_t_expect_9586c7: "我没想到会这样。"
  npc_override_1@ecl_EclageInterior_i_doing_research_power_o_8169b9: "我在独自研究宝珠的力量。"
  npc_override_1@ecl_EclageInterior_i_don_t_know_details_eea171: "我不知道细节，"
  npc_override_1@ecl_EclageInterior_i_don_t_think_s_4662a0: "我觉得没什么大不了的。"
  npc_override_1@ecl_EclageInterior_i_don_t_understand_word_ae6059: "我一个字都听不懂你在说什么。"
  npc_override_1@ecl_EclageInterior_i_fought_monsters_4a14e0: "我和怪物战斗了。"
  npc_override_1@ecl_EclageInterior_i_ll_move_you_treatment_69314d: "既然这看起来是重伤，我会把你转移到治疗室。"
  npc_override_1@ecl_EclageInterior_i_m_so_angry_about_601d3b: "……我对自己刚刚意识到他是如何利用我的感到愤怒，但更糟的是，我对我们的人民做了可怕的事情。"
  npc_override_1@ecl_EclageInterior_i_prove_4e6dc7: "我可以证明。"
  npc_override_1@ecl_EclageInterior_i_should_sure_hope_you_2b0bd0: "我当然希望你不是他们要找的捣乱者，对吧？"
  npc_override_1@ecl_EclageInterior_i_started_questioning_pr_441eb7: "我开始质疑宝珠力量的原理，因为我们所有人都从中受益。"
  npc_override_1@ecl_EclageInterior_i_started_thinking_about_406ce4: "我从思考宝珠的美丽开始，进而想知道宝珠内部积累了什么样的力量……"
  npc_override_1@ecl_EclageInterior_i_swear_name_guardian_yg_04f6fe: "我以世界树守护者的名义发誓。"
  npc_override_1@ecl_EclageInterior_i_think_i_m_pretty_c811ac: "我觉得我现在很恼火。"
  npc_override_1@ecl_EclageInterior_i_think_you_should_talk_f4c990: "我觉得你应该先和 Hisie 谈谈。"
  npc_override_1@ecl_EclageInterior_i_thought_just_my_imagin_cf146d: "我以为只是我的想象，忽略了……也许就在那时他……"
  npc_override_1@ecl_EclageInterior_if_you_favor_mayor_you_d320b9: "如果你支持市长，你应该在这里谨慎行事。"
  npc_override_1@ecl_EclageInterior_immediately_after_you_th_1a9dfe: "紧接着，你就被扔到了这里。"
  npc_override_1@ecl_EclageInterior_inner_core_stolen_ce91a7: "内部核心被盗。"
  npc_override_1@ecl_EclageInterior_inside_body_6cb60b: "'{0}它在——的身体里'"
  npc_override_1@ecl_EclageInterior_just_coincidence_309589: "或者这只是巧合？"
  npc_override_1@ecl_EclageInterior_karr_waiting_you_c0d740: "Karr 在等你。"
  npc_override_1@ecl_EclageInterior_keheehehehe_816ec5: "嘿嘿嘿嘿……"
  npc_override_1@ecl_EclageInterior_king_domons_after_orb_527d06: "魔王是在觊觎宝珠吗？"
  npc_override_1@ecl_EclageInterior_kkwaaa_e816bd: "夸哇！"
  npc_override_1@ecl_EclageInterior_kyaarr_ke_keryarya_0429a2: "基亚……可……克里亚利亚！！"
  npc_override_1@ecl_EclageInterior_kyaarr_keraahhh_2fe74d: "基亚……克里亚！！！"
  npc_override_1@ecl_EclageInterior_let_s_go_18400d: "我们走吧。{0}。"
  npc_override_1@ecl_EclageInterior_let_s_go_i_ll_fdca6f: "我们走吧。我来带路。"
  npc_override_1@ecl_EclageInterior_light_coming_out_circula_4ed0f4: "房间中央的一个圆形设备发出了光芒。"
  npc_override_1@ecl_EclageInterior_loki_s_palm_there_rested_377137: "在 Loki 的手掌上，放着一小片又细又干的荆棘。"
  npc_override_1@ecl_EclageInterior_looks_like_soldiers_insi_9da2be: "里面的士兵看起来很紧张。"
  npc_override_1@ecl_EclageInterior_me_avant_all_people_haha_284cda: "我，Avant，所有人？！哈哈哈哈！"
  npc_override_1@ecl_EclageInterior_menu_enter_d64ea8: "进去。:算了。"
  npc_override_1@ecl_EclageInterior_menu_it_cce57d: "都是因为你！:Shenime 说……"
  npc_override_1@ecl_EclageInterior_menu_shenime_6678da: "Shenime：很好，我来得正是时候。"
  npc_override_1@ecl_EclageInterior_menu_suspicious_3f8900: "可疑生物：克里尔……克鲁瓦！！"
  npc_override_1@ecl_EclageInterior_menu_warning_a37ce9: "警告：照明室发生异常。照明室发生异常。"
  npc_override_1@ecl_EclageInterior_menu_what_6cc1ea: "什么……？:我击退了怪物！"
  npc_override_1@ecl_EclageInterior_monsters_subordinates_mo_741d14: "怪物？梦罗克 的手下？"
  npc_override_1@ecl_EclageInterior_msg_61ce5a: "'[{0}]'"
  npc_override_1@ecl_EclageInterior_msg_93fcbf: "……"
  npc_override_1@ecl_EclageInterior_never_mind_don_t_worry_5ee9ac: "没关系。别担心。"
  npc_override_1@ecl_EclageInterior_no_means_such_thing_088954: "'{0}——绝不会做这种事。'"
  npc_override_1@ecl_EclageInterior_no_way_b23888: "不……会吧！！！"
  npc_override_1@ecl_EclageInterior_nobody_knows_orb_s_inner_f26c0f: "没有人知道宝珠的内部核心已经不见了，"
  npc_override_1@ecl_EclageInterior_none_them_died_fortunate_4f23dd: "幸运的是没有人死亡，但他们大多数都受了重伤。"
  npc_override_1@ecl_EclageInterior_now_i_think_about_c63eae: "现在我想想……"
  npc_override_1@ecl_EclageInterior_now_you_became_betrayer_e20d2d: "现在你成了叛徒。"
  npc_override_1@ecl_EclageInterior_oh_what_s_going_here_fb0518: "哦，这里发生了什么事？"
  npc_override_1@ecl_EclageInterior_only_party_leader_enter_976520: "只有队伍领袖才能进入。请创建你的队伍。"
  npc_override_1@ecl_EclageInterior_ooh_so_s_what_happened_724f57: "哦……原来如此。"
  npc_override_1@ecl_EclageInterior_our_target_morocc_king_d_d8950a: "我们的目标是魔王 梦罗克。"
  npc_override_1@ecl_EclageInterior_place_set_up_lighting_or_06083f: "这个地方设置了宝珠的照明。"
  npc_override_1@ecl_EclageInterior_pretty_difficult_guide_o_86f2d2: "引导像你这样的外来者相当困难。"
  npc_override_1@ecl_EclageInterior_right_before_coming_here_2949f4: "就在来这里之前，Shenime 向我伸出手，当我握住他的手时，我感到一阵火花。"
  npc_override_1@ecl_EclageInterior_right_shenime_he_excited_9db3d7: "没错……Shenime。他故意激起了我的好奇心。"
  npc_override_1@ecl_EclageInterior_s_also_place_where_light_59e336: "这也是为了让宝珠看起来更美丽而设置照明的地方。"
  npc_override_1@ecl_EclageInterior_s_because_2128ba: "是因为这个。"
  npc_override_1@ecl_EclageInterior_s_easy_task_feedb3: "这不是一件容易的事。"
  npc_override_1@ecl_EclageInterior_s_fun_anymore_i_m_5e2168: "不再有趣了。我对你不再感兴趣。"
  npc_override_1@ecl_EclageInterior_s_good_enough_we_found_c8f34e: "我们在这里找到了证据，这已经足够了。"
  npc_override_1@ecl_EclageInterior_s_no_fun_f38717: "没意思。"
  npc_override_1@ecl_EclageInterior_s_why_karr_didn_t_de8c63: "这就是 Karr 没能到这里的原因。"
  npc_override_1@ecl_EclageInterior_seems_like_guy_next_me_50b7c4: "看起来我旁边的这个人有很多话要说。"
  npc_override_1@ecl_EclageInterior_seems_like_there_s_visit_2e6dd5: "看起来有访客来了。"
  npc_override_1@ecl_EclageInterior_seems_like_they_going_st_905567: "看起来他们随时都会开始攻击。"
  npc_override_1@ecl_EclageInterior_seems_like_you_ve_rested_b48344: "看起来你休息够了。我们走吧。"
  npc_override_1@ecl_EclageInterior_shenime_chief_staff_d282ad: "Shenime，参谋长？"
  npc_override_1@ecl_EclageInterior_shenime_just_urged_me_pe_ab9772: "但 Shenime 只是不断地催促我。"
  npc_override_1@ecl_EclageInterior_shenime_one_subordinates_e93067: "Shenime 是 梦罗克 的手下之一。"
  npc_override_1@ecl_EclageInterior_sir_e62b1b: "'{0}大人，'"
  npc_override_1@ecl_EclageInterior_situation_very_good_righ_3da082: "现在情况不太好。"
  npc_override_1@ecl_EclageInterior_so_you_re_saying_he_78f6b0: "所以你说他欺骗了我们所有人？"
  npc_override_1@ecl_EclageInterior_so_you_re_saying_shenime_4a95a3: "所以你说 Shenime 觊觎宝珠？"
  npc_override_1@ecl_EclageInterior_someone_take_responsibil_33f3b9: "那么必须有人为此承担责任。"
  npc_override_1@ecl_EclageInterior_stimulate_person_who_was_f04b09: "刺激一个对空气和水毫无意识的人，让他认识并继续调查！"
  npc_override_1@ecl_EclageInterior_t_you_organize_your_stor_a95134: "你不能整理一下你的故事吗？你不知道'五个W和一个H'的规则吗？"
  npc_override_1@ecl_EclageInterior_thank_you_your_help_3a7d59: "谢谢你的帮助。"
  npc_override_1@ecl_EclageInterior_there_some_soldiers_disp_900deb: "不久前市长派来了一些士兵。"
  npc_override_1@ecl_EclageInterior_there_some_witnesses_pro_de1b78: "有一些证人可以证明你的清白。"
  npc_override_1@ecl_EclageInterior_there_subtle_magical_ech_482980: "有一种微妙而神奇的回声。"
  npc_override_1@ecl_EclageInterior_these_two_gentlemen_here_25c6ad: "……这两位先生已经澄清了所有与宝珠有关的指控，"
  npc_override_1@ecl_EclageInterior_they_destroyed_additiona_4883e5: "他们摧毁了市长派来的额外部队？"
  npc_override_1@ecl_EclageInterior_they_kill_me_9d5966: "他们会杀了我！"
  npc_override_1@ecl_EclageInterior_they_look_as_if_they_79f6bf: "它们看起来像是 梦罗克 的化身。"
  npc_override_1@ecl_EclageInterior_they_seemed_surprised_al_34eeb0: "它们看起来很惊讶，虽然世界桥的意志仍然存在，但很难沟通。"
  npc_override_1@ecl_EclageInterior_they_use_wicked_tricks_e0a6b9: "它们使用邪恶的手段。"
  npc_override_1@ecl_EclageInterior_things_got_out_control_a89bc6: "但事情失控了。"
  npc_override_1@ecl_EclageInterior_thorn_here_probably_clou_e68dad: "这根荆棘可能蒙蔽了你的判断。"
  npc_override_1@ecl_EclageInterior_unknown_error_occurred_58bda4: "发生未知错误。"
  npc_override_1@ecl_EclageInterior_upon_eliminating_intrude_f730c4: "在消灭宝珠附近的入侵者后，又出现了另一种长相奇怪的生物。"
  npc_override_1@ecl_EclageInterior_wait_here_minute_d05c45: "在这里等一下。"
  npc_override_1@ecl_EclageInterior_warning_f1907f: "-！警告！-"
  npc_override_1@ecl_EclageInterior_we_cannot_help_fighting_5076c8: "我们无法避免与它们战斗！"
  npc_override_1@ecl_EclageInterior_we_couldn_t_communicate_40b345: "我们也无法与它们沟通，其中一个在环顾四周发现同伴被击败后似乎非常愤怒。"
  npc_override_1@ecl_EclageInterior_we_take_off_now_e34e51: "我们现在就出发。"
  npc_override_1@ecl_EclageInterior_well_then_i_t_blame_ff90bd: "那么，我也不能太责怪你。"
  npc_override_1@ecl_EclageInterior_well_well_did_he_get_c8113d: "好吧好吧……他连我也算计了吗？"
  npc_override_1@ecl_EclageInterior_well_well_isn_t_interest_43543a: "好吧好吧……这不是很有趣吗！"
  npc_override_1@ecl_EclageInterior_what_earth_happened_ther_64bce5: "那里到底发生了什么事？"
  npc_override_1@ecl_EclageInterior_what_happened_orb_ebbc13: "宝珠怎么了？"
  npc_override_1@ecl_EclageInterior_what_kind_person_you_thi_606f0e: "你觉得我是什么样的人，认真点！"
  npc_override_1@ecl_EclageInterior_what_s_more_several_sold_02716d: "而且，还有几名士兵因为你而受伤。"
  npc_override_1@ecl_EclageInterior_what_strange_chance_brou_6e3999: "多么奇怪的缘分让我们在这里相聚！"
  npc_override_1@ecl_EclageInterior_what_you_mean_c0ce14: "你是什么意思？"
  npc_override_1@ecl_EclageInterior_what_you_trying_kill_our_4f5885: "你试图杀死的是我们的士兵，Laphines！！"
  npc_override_1@ecl_EclageInterior_what_you_two_26cbbd: "你们两个打算怎么办？"
  npc_override_1@ecl_EclageInterior_why_don_t_you_explain_5205d7: "你为什么不先向他解释？"
  npc_override_1@ecl_EclageInterior_why_he_related_ec086c: "他为什么和这件事有关？"
  npc_override_1@ecl_EclageInterior_you_had_conscience_7af48e: "你还有良心吗？"
  npc_override_1@ecl_EclageInterior_you_ll_catch_shenime_dc966e: "你必须抓住 Shenime。"
  npc_override_1@ecl_EclageInterior_you_re_friend_my_son_132ac7: "你是我儿子的朋友，对吧？"
  npc_override_1@ecl_EclageInterior_you_re_probably_right_4c6636: "你可能是对的。"
  npc_override_1@ecl_EclageInterior_you_tell_me_exactly_what_176f18: "你能确切地告诉我发生了什么事吗？"
  npc_override_1@ecl_EclageInterior_your_job_ends_here_2a4e1c: "你的工作到此结束。"

