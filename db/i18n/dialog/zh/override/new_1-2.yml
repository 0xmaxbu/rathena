  npc_override_new_1-2_novice_case_you_receive_whole_e_535b10: "在这种情况下，你将获得该怪物所能提供的全部经验值的 2/3，另一个人将获得 1/3。"
  npc_override_new_1-2_novice_castle_94cb9b: "城堡的"
