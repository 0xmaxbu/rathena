  npc_override_new_1-2_novice_about_party_system_401cac: "关于队伍系统。"
  npc_override_new_1-2_novice_about_passive_skills_0d4b60: "关于被动技能。"
  npc_override_new_1-2_novice_above_use_emoticons_89fd69: "或以上才能使用表情符号。"
  npc_override_new_1-2_novice_above_use_party_system_52dbfc: "或以上才能使用队伍系统。"
  npc_override_new_1-2_novice_above_you_open_your_own_e7f664: "或以上，你可以开启自己的聊天室。你可以点击"
  npc_override_new_1-2_novice_according_your_personal_5e4c53: "根据你的个人需求，所以请询问你希望更深入了解的状态。首先，使用'^3355FFAlt^000000 + ^3355FFA^000000'键打开你的状态窗口。"
  npc_override_new_1-2_novice_acolyte_s_support_abilit_a1dfba: "服事的支援能力使他们成为任何队伍中受欢迎的一员。在困难的情况下，服事的技能将确保队伍的生存，让其他成员专注于攻击。"
  npc_override_new_1-2_novice_active_skills_assigned_h_698873: "主动技能可以分配到热键并拖到热键栏上。主动技能带有彩色方形图标，可以双击使用。"
  npc_override_new_1-2_novice_active_skills_like_first_1f6a5e: "主动技能，如急救，需要消耗一定量的 SP 才能使用。急救技能对初学者很有用，因为它可以恢复少量 HP。"
  npc_override_new_1-2_novice_active_skills_unlike_pas_f47305: "主动技能，与不需要消耗任何 SP 的被动技能不同，每次使用时都需要 SP。"
  npc_override_new_1-2_novice_addition_merchants_may_r_70efdc: "此外，商人可以租用"
  npc_override_new_1-2_novice_adorable_novice_de6ddf: "一个可爱的初学者"
  npc_override_new_1-2_novice_adventurer_s_suit_c67656: "^0000331冒险者外套^000000"
  npc_override_new_1-2_novice_adventures_throughout_3e19ad: "整个冒险旅程"
  npc_override_new_1-2_novice_after_all_5f3290: "毕竟……"
  npc_override_new_1-2_novice_after_learning_some_stro_300482: "在学会一些强力的攻击技能后，剑士在近战中几乎是无敌的。"
  npc_override_new_1-2_novice_after_you_receive_all_su_23b0f1: "在你收到所有补给后，我会将你传送到魔法师城镇。"
  npc_override_new_1-2_novice_after_you_receive_all_su_2416cb: "在你收到所有补给后，我会将你传送到弓箭手城镇。"
