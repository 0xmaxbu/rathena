  npc_override_new_1-2_novice_alright_let_me_start_st_764642: "好的，让我开始第1个性格测试。请放松"
  npc_override_new_1-2_novice_alright_practice_makes_p_902895: "好的，熟能生巧！让我把你送到野外战斗训练的人那里。保重！"
  npc_override_new_1-2_novice_alright_then_meantime_yo_681632: "好的。与此同时，你可能想和助理导师们谈谈，因为基础课程教授的基本信息可能不足以帮助新冒险者。"
  npc_override_new_1-2_novice_also_affect_your_attack_8018c7: "拥有的也会影响你的攻击命中率。攻击命中率由你的 Base 等级加上你的 DEX 计算得出。"
  npc_override_new_1-2_novice_also_each_weapon_its_str_4be060: "此外，每种武器都有其优势和劣势。武器的大小会影响它对怪物造成的伤害。"
  npc_override_new_1-2_novice_also_equipment_consumabl_bdc8d5: "此外，装备和消耗品也可以通过热键栏分配到热键。"
