  npc_override_new_1-2_novice_also_provided_fc0a71: "也由"
  npc_override_new_1-2_novice_also_there_experience_be_b2e505: "此外，队伍玩法还有经验加成，让你获得比单人游玩更多的经验值。你可以利用这个系统来更快地升级。"
  npc_override_new_1-2_novice_also_you_register_charac_b5894a: "此外，你也可以以同样的方式将该角色注册为你的好友。如果你是队长"
