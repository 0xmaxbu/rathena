  npc_override_new_1-2_novice_alberta_port_city_where_845e29: "^003399艾尔贝塔^000000，港口之都，是商人公会所在地。如果你想通过海路旅行，也必须前往艾尔贝塔。"
  npc_override_new_1-2_novice_all_items_you_carrying_m_dd5077: "你携带的所有物品一定是个不小的负担。你从哪里弄到这么多东西的？请通过丢弃不需要的东西来减轻负重。"
  npc_override_new_1-2_novice_allow_you_attack_monster_676af8: "这将允许你在不使用 Shift 键的情况下，通过治疗技能攻击怪物。很方便，对吧？"
