  npc_override_new_1-2_novice_against_monsters_don_t_y_b2b389: "对抗怪物，不是吗？"
  npc_override_new_1-2_novice_agility_affects_your_fle_955c12: "敏捷影响你的回避率和攻击速度。你的回避率越高，躲避敌人攻击的机会就越大。"
  npc_override_new_1-2_novice_agility_agi_f195cc: "接下来是敏捷（AGI）。"
