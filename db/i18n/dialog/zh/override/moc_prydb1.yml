Body:

  npc_override_moc_prydb1_thief_ah_971301: "啊……"
  npc_override_moc_prydb1_thief_ah_guide_told_me_about_03774b: "啊，向导跟我提起过你。那么，让我检查一下你的蘑菇……"
  npc_override_moc_prydb1_thief_ah_i_see_you_now_053bc6: "啊，我看到你现在已经是盗贼了。我就知道你会加入我们。"
  npc_override_moc_prydb1_thief_ahem_welcome_guild_comra_80344a: "*咳咳* 欢迎来到公会，同志！我是布拉德，负责人力资源。"
  npc_override_moc_prydb1_thief_alright_i_ll_let_you_0925c2: "好吧，我让你进去……"
  npc_override_moc_prydb1_thief_alright_i_looked_your_fe_d12a99: "好吧。我看了你的犯罪记录，你似乎有一段非常有趣的历史。你可能具备成为盗贼的潜质。"
  npc_override_moc_prydb1_thief_alright_let_me_inform_yo_2d7cb7: "好吧，让我通知你。仔细听。这个测试决定你是否值得成为一名盗贼。"
  npc_override_moc_prydb1_thief_alright_tell_725b24: "好吧，告诉"
  npc_override_moc_prydb1_thief_alright_tell_me_your_nam_e6c8b2: "好了，告诉我你的名字。嗯？什么？"
  npc_override_moc_prydb1_thief_alright_you_must_passed_0d245b: "好了。你一定通过了入职面试，对吧？"
  npc_override_moc_prydb1_thief_alright_your_registratio_e84145: "好吧，你的注册已经处理完毕。好了，如果你准备好了就可以开始测试了。"
  npc_override_moc_prydb1_thief_alright_your_test_you_go_7389f3: "好吧，你的测试是，你得从他的农场偷蘑菇。别担心，那家伙活该被抢。"
  npc_override_moc_prydb1_thief_alright_your_test_you_go_c4d9ff: "好吧，你的测试是，你得从一个农场偷蘑菇。别担心，农场的主人活该被抢。"
  npc_override_moc_prydb1_thief_am_i_dying_3d208a: "我要死了吗？"
  npc_override_moc_prydb1_thief_any_fun_46607e: "玩得开心吗？"
  npc_override_moc_prydb1_thief_anyway_i_expect_you_grea_c7cef1: "'''总之，我期待你成为一名伟大的盗贼。'''"
  npc_override_moc_prydb1_thief_anyway_outside_world_nev_41eb60: "总之，在外面的世界里，永远不要说你想要成为盗贼！！"
  npc_override_moc_prydb1_thief_apply_become_e215d2: "申请成为"
  npc_override_moc_prydb1_thief_archers_playing_141477: "弓箭手在玩"
  npc_override_moc_prydb1_thief_awesome_ed5dbb: "太棒了！"
  npc_override_moc_prydb1_thief_because_i_feel_like_i_0f9f7e: "因为我想这么做，我现在宣布你通过了这次面试。干得好！"
  npc_override_moc_prydb1_thief_big_sword_a1f07a: "一把大剑。"
  npc_override_moc_prydb1_thief_bring_your_total_d13eeb: "把你的总数带到……"
  npc_override_moc_prydb1_thief_buddy_3f693b: "……伙计？"
  npc_override_moc_prydb1_thief_careful_since_there_mons_2f5a79: "小心，因为农场里有怪物在保护蘑菇。所以这不是在公园散步那么简单。"
  npc_override_moc_prydb1_thief_come_hurry_ee369b: "快点，赶紧"
  npc_override_moc_prydb1_thief_congratulations_becoming_b18dcd: "恭喜你成为一名盗贼！从现在开始，成为盗贼公会的光荣代表。"
  npc_override_moc_prydb1_thief_congratulations_becoming_c7d21c: "'''恭喜你成为盗贼。'''"
  npc_override_moc_prydb1_thief_definitely_less_than_poi_139eb9: "肯定少于通过所需的25分。出去给我找更多蘑菇！"
  npc_override_moc_prydb1_thief_did_you_pass_interview_149c21: "你通过面试了吗？"
  npc_override_moc_prydb1_thief_didn_t_you_use_one_f20d05: "你不是曾经是我们中的一员吗？！伙计，你变了。你现在看起来很危险……"
  npc_override_moc_prydb1_thief_don_t_forget_make_plans_c6c2e6: "别忘了制定计划，在进入蘑菇农场之前做好准备。尽可能快地行动，尽量不要被杀，好吗？"
  npc_override_moc_prydb1_thief_each_orange_net_mushroom_624281: "每个橙色网纹蘑菇给你3分，每个橙色黏糊蘑菇给你1分。你需要总共25分才能通过测试。"
  npc_override_moc_prydb1_thief_eh_me_me_5ed1df: "呃……？我？我？"
  npc_override_moc_prydb1_thief_ehh_seems_like_beloved_r_e0c4b5: "呃……看起来像是某个富裕家庭备受宠爱的{0}，但你为什么来这个肮脏的地方？"
  npc_override_moc_prydb1_thief_exactly_points_2f77ef: "正好25分！"
  npc_override_moc_prydb1_thief_field_i_think_his_coordi_6101b2: "在那个农场，我想他的坐标是'^FF0000141, 125^000000。'在你的聊天框右侧输入^3355FF/where^000000来检查你当前的坐标。"
  npc_override_moc_prydb1_thief_first_let_me_check_orang_90c4ba: "首先，让我检查一下你得到的橙色网纹蘑菇。"
  npc_override_moc_prydb1_thief_forest_131aef: "在森林里"
  npc_override_moc_prydb1_thief_get_outta_here_9d45da: "滚出去~"
  npc_override_moc_prydb1_thief_get_outta_here_a2274b: "滚出去！"
  npc_override_moc_prydb1_thief_gimme_your_money_063d58: "把你的钱给我。"
  npc_override_moc_prydb1_thief_give_me_534002: "给我"
  npc_override_moc_prydb1_thief_go_outside_keep_going_ah_ad4cbf: "出去，一直朝金字塔东边的田地走。然后你会在两根柱子之间看到我们的一个同志。"
  npc_override_moc_prydb1_thief_good_i_ll_accept_you_a92c7b: "很好。我接受你。"
  npc_override_moc_prydb1_thief_ha_ha_ha_go_put_a0192b: "'''哈哈哈！去挂个横幅，上面写着'我要成为一名骄傲的盗贼，去偷别人的东西'。'''"
  npc_override_moc_prydb1_thief_hahahahaha_9fae04: "哈哈哈哈~！"
  npc_override_moc_prydb1_thief_hahahahahahah_046978: "哈哈哈哈哈哈！"
  npc_override_moc_prydb1_thief_heee_yaaaa_congratulatio_8d823a: "嘿~呀~！恭喜！我的朋友。"
  npc_override_moc_prydb1_thief_heh_heh_s_good_attitude_9a676d: "嘿嘿！这种态度很好。在我们这行，你得享受弄脏双手的感觉，不管以什么方式。"
  npc_override_moc_prydb1_thief_heh_i_like_your_confiden_ae9542: "嘿，我喜欢你的自信。不过，你知道当盗贼并不像人们想象的那么光鲜。"
  npc_override_moc_prydb1_thief_here_rathole_32b248: "来这个破地方？"
  npc_override_moc_prydb1_thief_here_small_subsidy_newbi_703d16: "这是给像你这样的新人的一点补贴。想怎么花就怎么花。好了，回头见~"
  npc_override_moc_prydb1_thief_here_talk_other_guy_righ_bc2668: "来，跟我旁边这个家伙说话。他负责检查你的蘑菇。"
  npc_override_moc_prydb1_thief_hey_baby_28fe86: "嘿，宝贝。"
  npc_override_moc_prydb1_thief_hey_baby_67a745: "嘿，宝贝~"
  npc_override_moc_prydb1_thief_hey_brother_2ddb9c: "嘿，兄弟。"
  npc_override_moc_prydb1_thief_hey_dude_909091: "嘿，伙计。"
  npc_override_moc_prydb1_thief_hey_hey_you_re_novice_8d507b: "嘿~嘿~你不是初心者也不是盗贼！"
  npc_override_moc_prydb1_thief_hey_if_you_any_trouble_226616: "嘿~如果你有任何麻烦，随时告诉我，好吗？"
  npc_override_moc_prydb1_thief_hey_lady_9ece52: "嘿，女士。"
  npc_override_moc_prydb1_thief_hey_novice_why_don_t_5e0af3: "嘿，初学者！为什么不加入盗贼公会的行列呢？你们这些新手总是欢迎加入我们和我们自私的事业。"
  npc_override_moc_prydb1_thief_hey_whaddya_doin_here_ar_f27260: "嘿，你在这里做什么？你不是应该在收集蘑菇吗？还是需要我再解释一遍？"
  npc_override_moc_prydb1_thief_hey_you_look_too_goody_ad3ced: "'……嘿！你看起来太乖了，根本不像想成为盗贼的人！！现在滚开，我很忙。下一个！'"
  npc_override_moc_prydb1_thief_hmm_9c4d28: "嗯……"
  npc_override_moc_prydb1_thief_hmm_i_found_your_interes_7e69f0: "嗯……我从侦探社的数据中发现了你有趣的犯罪记录。嗯，你似乎有成为一名优秀盗贼的潜质。"
  npc_override_moc_prydb1_thief_hmmm_d3b3a2: "嗯？"
  npc_override_moc_prydb1_thief_hmmm_degrees_multiplied_69148a: "嗯。{0}度，乘以光速，除以π乘以高度加上政治的绝对值……"
  npc_override_moc_prydb1_thief_ho_why_novice_like_you_4ef079: "哦？像你这样的初心者为什么来这里？"
  npc_override_moc_prydb1_thief_how_you_40c324: "你怎么能"
  npc_override_moc_prydb1_thief_huh_6ed1eb: "嗯。"
  npc_override_moc_prydb1_thief_huh_i_know_you_s_7ca9eb: "嗯？我认识你吗？你看起来很熟悉，真让人毛骨悚然。你没有双胞胎吧？"
  npc_override_moc_prydb1_thief_huh_second_there_i_thoug_9468c3: "嗯。有那么一瞬间，我以为你有什么非常重要的事情要告诉我。"
  npc_override_moc_prydb1_thief_huh_them_08d564: "嗯，{0}个。"
  npc_override_moc_prydb1_thief_huh_you_blockhead_be11f6: "嗯……你是个{0}，笨蛋！"
  npc_override_moc_prydb1_thief_i_could_use_good_hard_f7fa4d: "我需要来一杯烈酒。"
  npc_override_moc_prydb1_thief_i_don_t_any_special_4ad674: "我现在没有什么特别的事情。所以继续走你的路，稍后再回来。"
  npc_override_moc_prydb1_thief_i_got_18756a: "我明白了。"
  npc_override_moc_prydb1_thief_i_had_no_choice_time_0351f5: "我当时别无选择。要么偷，要么饿死。但我没必要给你讲我的人生故事。"
  npc_override_moc_prydb1_thief_i_m_sure_now_you_cfc6a5: "我现在不确定，但你以后会有更多机会见到我的。"
  npc_override_moc_prydb1_thief_i_now_declare_you_passed_9e8afd: "'{0}。我现在宣布你已经通过了入职面试！'"
  npc_override_moc_prydb1_thief_i_see_ae6f79: "我能看出来。"
  npc_override_moc_prydb1_thief_i_see_your_strong_become_97ab73: "我能看到你成为盗贼的强烈决心……"
  npc_override_moc_prydb1_thief_i_ve_got_nothing_say_7fdc63: "我没什么要跟你说的。你能别烦我吗？"
  npc_override_moc_prydb1_thief_if_you_bring_disgrace_ou_fd5e35: "如果你给我们的公会带来耻辱，你会被杀掉。我希望你能给我们的同志们带来荣耀。"
  npc_override_moc_prydb1_thief_if_you_bring_us_any_394537: "'''如果你违反我们的规则给我们丢脸，你最好小心点。'''"
  npc_override_moc_prydb1_thief_if_you_here_thief_ask_a6b8f7: "如果你是来成为盗贼的，去问问我旁边那个脾气不好的女士。"
  npc_override_moc_prydb1_thief_if_you_problem_feel_free_02e732: "如果你有问题，随时跟我说，好吗？"
  npc_override_moc_prydb1_thief_if_you_want_become_thief_180c5a: "如果你想成为盗贼，去问我旁边那个目光锐利的家伙。"
  npc_override_moc_prydb1_thief_if_you_want_become_thief_c2167b: "如果你想成为盗贼，去问我旁边那个家伙。"
  npc_override_moc_prydb1_thief_isn_t_cute_i_see_88dd37: "不可爱吗？我能看出你很有野心，但你得先学会所有基础技能才能成为一名盗贼。"
  npc_override_moc_prydb1_thief_kidding_i_m_off_clock_a92028: "开玩笑的，我下班了。"
  npc_override_moc_prydb1_thief_let_s_begin_job_changing_738eb6: "让我们开始我们公会的转职仪式吧！"
  npc_override_moc_prydb1_thief_like_thief_f9ac90: "像个盗贼。"
  npc_override_moc_prydb1_thief_man_shouldn_t_you_1c997a: "伙计，你不应该"
  npc_override_moc_prydb1_thief_man_you_got_real_cool_afee07: "伙计，你突然变得好酷！你一定有一些我只能梦想的技能！"
  npc_override_moc_prydb1_thief_me_bf0d7e: "我……？"
  npc_override_moc_prydb1_thief_me_your_name_b70468: "我你的名字。"
  npc_override_moc_prydb1_thief_menu_anyway_9c5057: "总之，你得收集两种蘑菇：^0000FF橙色网纹蘑菇^000000和^0000FF橙色黏糊蘑菇^000000。"
  npc_override_moc_prydb1_thief_menu_hey_e8d6bb: "嘿，我是来当盗贼的！:不，我只是四处看看。"
  npc_override_moc_prydb1_thief_menu_i_37541c: "我想成为盗贼。:没什么。"
  npc_override_moc_prydb1_thief_menu_yeah_2d26f5: "是啊，挺酷的。:太可怕了。"
  npc_override_moc_prydb1_thief_menu_yeah_4d9d17: "是的，我准备好了。:不，我还没准备好。"
  npc_override_moc_prydb1_thief_menu_yeah_5610e3: "是的。:不，只是在浪费你的时间。:你为什么成为盗贼？"
  npc_override_moc_prydb1_thief_menu_yes_3f30e3: "是的。:不，没关系。"
  npc_override_moc_prydb1_thief_menu_yes_cd0f63: "是的，我想。:不。"
  npc_override_moc_prydb1_thief_menu_yes_d63417: "是的，我有。:抱歉，我没有。"
  npc_override_moc_prydb1_thief_menu_yes_f999a4: "是。:否。:你呢？"
  npc_override_moc_prydb1_thief_menu_yes_fbca31: "是的，我会。:我太害怕了，不敢当盗贼！"
  npc_override_moc_prydb1_thief_msg_032da9: "{0}？"
  npc_override_moc_prydb1_thief_msg_842d61: "'''{0}。'''"
  npc_override_moc_prydb1_thief_mushroom_farm_29cb81: "蘑菇农场？"
  npc_override_moc_prydb1_thief_my_name_brad_i_m_96c2a2: "我的名字是'布拉德'。我负责这里的人力资源。"
  npc_override_moc_prydb1_thief_now_i_ll_just_check_0b4ea7: "现在让我检查一下你的橙色黏糊蘑菇。那是你收集的{0}个。"
  npc_override_moc_prydb1_thief_now_keep_rules_our_guild_f8329e: "'''从现在起，遵守我们公会的规则，成为一名光荣的成员。'''"
  npc_override_moc_prydb1_thief_now_s_31fe97: "现在，那是"
  npc_override_moc_prydb1_thief_now_your_actual_abilitie_2ddbb6: "现在，你的实际能力需要被测试。你对测试了解多少？"
  npc_override_moc_prydb1_thief_oh_my_god_5232c8: "天哪……"
  npc_override_moc_prydb1_thief_oh_please_c0068b: "哦，请……！"
  npc_override_moc_prydb1_thief_oh_wait_4e95a3: "哦等等，"
  npc_override_moc_prydb1_thief_oh_yeah_well_makes_thing_a775ff: "哦是吗？好吧，这让事情简单多了。"
  npc_override_moc_prydb1_thief_oh_you_huh_well_i_dcb775: "哦，你……？嗯……好吧……我确实见识到了你这种奇怪的人，真是活到老学到老。"
  npc_override_moc_prydb1_thief_okay_512623: "好的！"
  npc_override_moc_prydb1_thief_okay_6fb660: "好的……"
  npc_override_moc_prydb1_thief_okay_i_ve_done_what_a19d59: "好了，我已经尽力了，所以继续走你的路吧。我可是个大忙人。"
  npc_override_moc_prydb1_thief_one_second_019768: "等一下。"
  npc_override_moc_prydb1_thief_only_your_you_cannot_mak_736021: "但仅凭你的意志，你在真正的战斗中是无法成功的，不是吗？"
  npc_override_moc_prydb1_thief_passed_test_yet_008e7c: "通过测试了吗？"
  npc_override_moc_prydb1_thief_ready_3d7d14: "还没准备好？"
  npc_override_moc_prydb1_thief_ready_c960de: "还没准备好？！"
  npc_override_moc_prydb1_thief_ready_try_again_2f0861: "准备好再试一次了吗？"
  npc_override_moc_prydb1_thief_really_380a14: "真的……"
  npc_override_moc_prydb1_thief_right_why_you_244ded: "对吧？你为什么"
  npc_override_moc_prydb1_thief_s_d4f703: "不是……"
  npc_override_moc_prydb1_thief_s_hilarious_5c79d1: "太搞笑了！"
  npc_override_moc_prydb1_thief_s_like_you_re_begging_4a2c6b: "就像你在乞求"
  npc_override_moc_prydb1_thief_see_you_again_21444b: "再见。"
  npc_override_moc_prydb1_thief_sigh_look_there_s_really_0079f3: "*叹息* 听着，你真的没必要待在这种地方。你应该去你该去的地方。"
  npc_override_moc_prydb1_thief_sigh_well_there_s_always_3f3fad: "*叹息* 好吧，总会有一两个这样的。好了，仔细听。"
  npc_override_moc_prydb1_thief_since_you_ve_become_thie_91e67e: "既然你已经成为盗贼，就要像盗贼一样生活。现在，去吧！下一个~"
  npc_override_moc_prydb1_thief_so_424d0d: "所以那会是"
  npc_override_moc_prydb1_thief_so_c7572d: "所以……"
  npc_override_moc_prydb1_thief_so_go_reach_least_basic_883716: "所以去把基础技能提升到至少9级。"
  npc_override_moc_prydb1_thief_so_how_351176: "那么"
  npc_override_moc_prydb1_thief_so_right_34220a: "'{0}。所以{1}，对吧……？'"
  npc_override_moc_prydb1_thief_so_you_want_apply_being_5e2f6f: "那么，你想申请成为盗贼吗？"
  npc_override_moc_prydb1_thief_so_you_want_d3d224: "那么你想"
  npc_override_moc_prydb1_thief_something_273305: "或者别的什么？"
  npc_override_moc_prydb1_thief_speak_guy_he_ll_take_0b3548: "跟那个家伙说话，他会带你从后门去农场。"
  npc_override_moc_prydb1_thief_stealing_mushroom_farm_t_0d8bc2: "从蘑菇农场偷东西对你来说太容易了。你应该提升技能，精通我们的手艺。"
  npc_override_moc_prydb1_thief_still_fd8d00: "不过……"
  npc_override_moc_prydb1_thief_take_your_time_learn_all_ee07f6: "慢慢来，把所有基础技能都学会，好吗？那么，再见~！"
  npc_override_moc_prydb1_thief_than_points_593240: "比25分多！"
  npc_override_moc_prydb1_thief_then_what_you_waiting_5c1699: "那你还等什么？"
  npc_override_moc_prydb1_thief_then_why_you_here_you_4a6ab5: "那你为什么在这里？你以为成为盗贼那么容易吗？"
  npc_override_moc_prydb1_thief_there_strange_smell_comi_c71fe2: "有一种奇怪的气味从你身上传来……为什么会这样？"
  npc_override_moc_prydb1_thief_thief_a00854: "盗贼还是不是？"
  npc_override_moc_prydb1_thief_thief_bb35df: "盗贼？"
  npc_override_moc_prydb1_thief_thief_test_right_f72a57: "盗贼测试，对吧？"
  npc_override_moc_prydb1_thief_thieves_88d49d: "盗贼们？！"
  npc_override_moc_prydb1_thief_those_who_ready_moonligh_c14142: "'''为那些准备好的人，月光将照亮前路。现在你已经完全准备好了，我现在正式允许你成为盗贼公会的一员。'''"
  npc_override_moc_prydb1_thief_today_looks_like_good_da_158962: "今天看起来是个去金字塔和朋友们一起狩猎的好日子。"
  npc_override_moc_prydb1_thief_too_scared_ed8af9: "太害怕了？！？"
  npc_override_moc_prydb1_thief_trying_make_3d7b04: "试图制造"
  npc_override_moc_prydb1_thief_um_b716d0: "嗯……"
  npc_override_moc_prydb1_thief_up_something_366cc3: "准备做点什么"
  npc_override_moc_prydb1_thief_us_steal_you_e453e0: "我们从你这里偷！"
  npc_override_moc_prydb1_thief_walking_into_den_7ef611: "走进一个巢穴"
  npc_override_moc_prydb1_thief_want_e9f954: "想成为"
  npc_override_moc_prydb1_thief_we_don_t_any_special_452be6: "我们还没有任何特别活动。等有消息的时候再来，好吗？"
  npc_override_moc_prydb1_thief_well_i_got_feeling_like_768231: "好吧，我感觉你好像经历了一生的战斗，所以我现在就把你提升为盗贼。我最好给你们这些硬汉想要的东西……"
  npc_override_moc_prydb1_thief_well_i_just_fit_well_a8f43b: "嗯……我天生就适合当盗贼……从性格上来说……我不介意这种愚蠢的事情。"
  npc_override_moc_prydb1_thief_well_i_m_charge_making_cb3dc6: "好吧，我不负责让你成为盗贼。我只是接受申请，明白吗？"
  npc_override_moc_prydb1_thief_well_what_you_want_go_3d1f6b: "嗯……做你想做的事~走你的路~"
  npc_override_moc_prydb1_thief_well_you_proud_616253: "好吧，你就那么骄傲吗？"
  npc_override_moc_prydb1_thief_what_brings_you_down_8a3e25: "是什么把你带到"
  npc_override_moc_prydb1_thief_what_heck_52429c: "你到底在"
  npc_override_moc_prydb1_thief_what_heck_58b76f: "什么鬼……？"
  npc_override_moc_prydb1_thief_what_hell_fe814f: "该死……"
  npc_override_moc_prydb1_thief_what_kind_name_anyway_gi_e231e6: "{0}是什么奇怪的名字？算了，给我一秒钟。"
  npc_override_moc_prydb1_thief_what_s_mage_doin_here_487ecd: "一个魔法师在这里做什么？你不应该在别处表演纸牌魔术吗？哦好吧，这是个自由的国家……"
  npc_override_moc_prydb1_thief_what_s_matter_if_you_5f87f6: "怎么了？如果你想成为盗贼，跟我旁边的女孩说话。"
  npc_override_moc_prydb1_thief_what_s_your_mind_73a41c: "你在想什么……？"
  npc_override_moc_prydb1_thief_what_you_doing_here_you_db6502: "你在这里做什么？这里不欢迎你把它当成家~ 呼~ 滚出去~"
  npc_override_moc_prydb1_thief_what_you_want_thief_i_f6d49d: "什么，你想成为盗贼？抱歉，但你看起来还需要更多训练。"
  npc_override_moc_prydb1_thief_when_you_come_back_here_061447: "当你收集完蘑菇回到这里时，你会根据你收集的蘑菇数量进行评分。"
  npc_override_moc_prydb1_thief_who_you_calling_psycho_b332fc: "你说谁是疯子？！？！"
  npc_override_moc_prydb1_thief_why_else_priest_come_her_9946df: "否则一个祭司来这里做什么？我想我最好开始忏悔我所有的罪行。"
  npc_override_moc_prydb1_thief_why_you_here_go_back_d9d5ac: "你为什么在这里？回到你的位置去~回去~~"
  npc_override_moc_prydb1_thief_yeah_872dd3: "是啊……"
  npc_override_moc_prydb1_thief_yeah_i_ve_been_there_953927: "是吗？我也去过那里，所以我能理解为什么那个地方不是每个人都喜欢。不过，当盗贼并不全是光鲜和时髦的夜生活。"
  npc_override_moc_prydb1_thief_you_came_back_ab15e3: "你回来了。"
  npc_override_moc_prydb1_thief_you_did_badass_189cf8: "你做到了！太厉害了！"
  npc_override_moc_prydb1_thief_you_doing_here_anyway_1ea05c: "你到底在这里做什么？"
  npc_override_moc_prydb1_thief_you_don_t_any_mushrooms_45d8bc: "你根本没有蘑菇！回去拿。否则，你不会通过测试，也无法成为盗贼！"
  npc_override_moc_prydb1_thief_you_don_t_look_d25a29: "你看起来不"
  npc_override_moc_prydb1_thief_you_gathered_mushrooms_a5539a: "你收集了蘑菇"
  npc_override_moc_prydb1_thief_you_get_more_information_b77cf6: "你可以在金字塔1层地下室的地下房间里获得更多信息。"
  npc_override_moc_prydb1_thief_you_got_more_3e79b2: "你得到了更多"
  npc_override_moc_prydb1_thief_you_haven_t_8c29f4: "你还没有"
  npc_override_moc_prydb1_thief_you_know_we_all_steal_fdf4a9: "你知道我们都是靠偷窃为生的，对吧？你一个服事在这种地方做什么？"
  npc_override_moc_prydb1_thief_you_know_you_cannot_thie_63e90c: "你知道没有申请就不能成为盗贼……"
  npc_override_moc_prydb1_thief_you_passed_official_thie_ce251e: "你已经通过了官方盗贼测试。你现在是我们的一员了。"
  npc_override_moc_prydb1_thief_you_re_merchant_d5de78: "你是一个商人，"
  npc_override_moc_prydb1_thief_you_re_telling_me_so_3b18ae: "你就那么骄傲地告诉我你想成为盗贼！你为什么不去所有村庄宣传自己是个盗贼呢？"
  npc_override_moc_prydb1_thief_you_really_ce4150: "你真的"
  npc_override_moc_prydb1_thief_you_sneaking_shibu_s_far_f819fe: "你将潜入希布的农场。他是梦罗克人品最差的商人。"
  npc_override_moc_prydb1_thief_you_sure_you_re_505861: "你确定你是"
  npc_override_moc_prydb1_thief_you_ve_come_take_test_2e5684: "你是来参加测试的，对吧？我从你的眼神中看出你知道些什么。"
  npc_override_moc_prydb1_thief_you_want_thief_so_badly_f93dca: "你就那么想成为盗贼吗？"
  npc_override_moc_prydb1_thief_your_name_07545a: "你的名字是……"
  npc_override_moc_prydb1_thief_your_name_ah_s_list_174773: "你的名字是{0}？啊，在名单上。好了，我让你进蘑菇农场，但我不能保证你的安全……"
