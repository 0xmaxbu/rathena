  npc_override_job_prist_priest_you_ll_regret_973d2a: "但你会后悔"
  npc_override_job_prist_priest_you_look_tired_exhausted_181ef3: "你看起来很疲惫。然而，一旦你成为祭司，你将不得不忍受更多的苦难。"
  npc_override_job_prist_priest_you_lure_many_monsters_h_f5bd22: "你会为了帮助队友升级而引诱大量怪物吗？"
  npc_override_job_prist_priest_you_made_your_choice_i_c04e16: "你已经做出了选择。我现在不打扰你。不过，你的训练不会像你想的那么容易。"
  npc_override_job_prist_priest_you_may_assist_lighten_y_e237b2: "你可以协助并减轻你朋友的负担，但你要把这任务当作自己的。"
  npc_override_job_prist_priest_you_me_dbbc6f: "你来见我？"
  npc_override_job_prist_priest_you_must_first_thoroughl_615253: "在你被晋升为祭司之前，你必须先作为一名服事接受全面的训练。"
  npc_override_job_prist_priest_you_must_here_training_h_22308f: "你一定在这里努力训练，为了成为祭司。有趣的是，我认识很多神的仆人。他们告诉我，一直侍奉那位神真的很辛苦。所以……^666666好累^000000而且^666666没有回报^000000。"
  npc_override_job_prist_priest_you_must_moral_person_di_e89d5e: "你必须是一个有道德的人，表现出成熟和对其他玩家的尊重。这种态度适用于所有职业，"
  npc_override_job_prist_priest_you_must_strong_faith_as_922bb9: "你必须坚强。要有信心，因为你是被神所爱的。我祈祷身体的伤口能早日痊愈……"
  npc_override_job_prist_priest_you_need_bring_rosary_or_014e32: "要陪同服事进行精神训练，你需要带^0000FF1串念珠^000000。如果你有，我现在就可以送你去测试区域。"
  npc_override_job_prist_priest_you_offer_deal_e21d15: "你来提出交易。"
  npc_override_job_prist_priest_you_passage_8773de: "让你通过？^000000"
  npc_override_job_prist_priest_you_ready_then_c00459: "那你准备好了吗？"
  npc_override_job_prist_priest_you_ready_time_0fd3e7: "你这次准备好了吗？"
  npc_override_job_prist_priest_you_really_c82d3a: "你真的"
  npc_override_job_prist_priest_you_remaining_skills_poi_6d8511: "你还有剩余的技能点。请用这些技能点升级你的技能，然后回到我这里。"
  npc_override_job_prist_priest_you_repeatly_say_same_ph_d662dc: "你会为了向神的子民传达神的信息而在公共场合反复说同一句话吗？"
  npc_override_job_prist_priest_you_seem_confident_about_2b48d0: "你似乎对精神训练很有信心。我们开始吧？"
  npc_override_job_prist_priest_you_should_go_sister_cec_a29525: "你应该去找塞西莉亚修女，向神宣誓你的虔诚。带着荣誉回到这里，倾听在你心中轻声说话的神的声音。"
  npc_override_job_prist_priest_you_should_reflect_littl_f1db3f: "你应该再多反思一下神圣的教义，然后再回来。如果你的精神软弱，你就无法成为祭司。"
  npc_override_job_prist_priest_you_sister_6ce5aa: "与你同在，修女。"
  npc_override_job_prist_priest_you_sister_8cf887: "你，修女。"
  npc_override_job_prist_priest_you_skill_points_left_0dddba: "你还有技能点。"
  npc_override_job_prist_priest_you_still_wish_become_pr_5aab8d: "^330033你仍然想成为祭司？！傻瓜！那么，我不会让你过去。回去吧。否则，你将活不下来。^000000"
  npc_override_job_prist_priest_you_take_advantage_holy_04e7a5: "你会将神赐予的神圣能力用于自私、破坏性或贪婪的目的吗？"
  npc_override_job_prist_priest_you_take_care_fae4dd: "你，保重！"
  npc_override_job_prist_priest_you_ve_accomplished_53d214: "你已经完成了"
  npc_override_job_prist_priest_you_ve_come_so_far_9fcdb3: "你已经走了这么远……"
  npc_override_job_prist_priest_you_ve_completed_all_thr_2c2bd3: "你已经完成了祭司所需的所有三项试炼。保罗主教正在等你。"
  npc_override_job_prist_priest_you_ve_shown_great_effor_ad00e4: "你付出了巨大的努力，在你个人寻求神圣的道路上取得了令人钦佩的进步。请以真诚的祭司身份度过你的一生……"
  npc_override_job_prist_priest_you_wanna_go_back_2cbed7: "你想回去？？"
  npc_override_job_prist_priest_you_want_live_me_here_e1f124: "还是你想和我一起在这里度过余生……？"
  npc_override_job_prist_priest_you_willing_b54011: "你愿意"
  npc_override_job_prist_priest_you_willing_sacrifice_yo_86bb68: "你愿意为了他人牺牲自己吗？"
  npc_override_job_prist_priest_you_wish_help_him_out_d6aba9: "你希望在精神训练中帮助他吗？"
  npc_override_job_prist_priest_you_yet_qualified_priest_51f481: "你还没有资格成为祭司。请走出去，开阔你的视野。"
  npc_override_job_prist_priest_your_decision_later_0b558b: "你以后的决定！"
  npc_override_job_prist_priest_your_determination_ec609d: "你的决心。"
  npc_override_job_prist_priest_your_journey_feb13d: "你的旅途。"
  npc_override_job_prist_priest_your_next_quest_you_shou_8b3c97: "你的下一个任务是去见玛蒂尔达修女。我会在这里等你平安归来。"
  npc_override_job_prist_priest_your_pilgrimage_e4b922: "你的朝圣之旅。"
  npc_override_job_prist_priest_your_trials_now_7923be: "你的试炼现已"
  npc_override_job_prist_priest_yours_486842: "可以是你的……"
