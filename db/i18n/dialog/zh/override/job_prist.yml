Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_job_prist_priest_acolyte_you_don_t_any_373af0: "……服事，你在这里跟我没什么事好谈的。"
  npc_override_job_prist_priest_acolytes_reached_job_lev_01d18c: "达到 Job 等级 50 的服事可以免去第一项试炼——朝圣之旅，因为他们已经证明了自己的热忱与虔诚。"
  npc_override_job_prist_priest_afford_take_your_time_59b8c1: "有时间可以慢慢来。"
  npc_override_job_prist_priest_after_meeting_father_rub_24bbeb: "见过鲁巴卡巴拉神父后，请拜访玛蒂尔达修女和洋介神父。之后如果有任何问题，可以来找我确认任务进度。"
  npc_override_job_prist_priest_after_you_become_priest_d7507f: "在你成为祭司之后，你的旅途可能会带你前往梦罗克金字塔。我希望你能在那里解放被邪恶束缚的不死生物。"
  npc_override_job_prist_priest_ah_971301: "啊……"
  npc_override_job_prist_priest_ah_i_see_i_let_7d18bd: "啊，我明白了。我会再告诉你一次朝圣的顺序，祝你旅途平安。"
  npc_override_job_prist_priest_ah_i_sense_you_warrior_5ce290: "啊，我感觉到你是一位去过瓦尔哈拉的战士。重获新生的你……我们在此守护着你。"
  npc_override_job_prist_priest_ah_s_good_idea_helping_080706: "啊，好主意。帮助年轻的服事也应该是一位祭司的职责之一。"
  npc_override_job_prist_priest_ah_yes_so_you_re_6935ea: "啊对，你就是那位想要成为祭司的年轻服事吧。"
  npc_override_job_prist_priest_ah_you_8321c8: "啊，你是"
  npc_override_job_prist_priest_ah_you_ve_started_your_f754ee: "啊，你已经开始了朝圣之旅。请尽力完成这第一项试炼吧。"
  npc_override_job_prist_priest_all_doom_darkness_despai_68cf27: "^330033一切尽是毁灭、黑暗与绝望！爱你之人将背叛你，留下的唯有悲痛与愤怒！^000000"
  npc_override_job_prist_priest_all_your_ability_you_pla_494413: "以你的全部能力，你将在城镇和地下城中扮演重要的角色。"
  npc_override_job_prist_priest_alright_alright_old_time_4eeb17: "好了好了，看在老交情的份上，我让你过去。但仅此一次。不过我最好别再抓到你！这里是邪恶的地盘，听到了吗？！"
  npc_override_job_prist_priest_also_if_you_chance_pleas_a98462: "另外，如果你有机会，请再次造访这座修道院。这是我们教会的神圣之地。"
  npc_override_job_prist_priest_although_there_still_two_8348ad: "虽然还有两项试炼在等着你，但我相信你一定能实现成为祭司的目标……"
  npc_override_job_prist_priest_although_you_cannot_rece_89eeff: "虽然你不能在整个测试过程中得到他们的帮助，但他们至少可以在精神训练中协助你。"
  npc_override_job_prist_priest_am_good_health_471ed5: "而且身体康健。"
  npc_override_job_prist_priest_anything_more_814740: "更多的事。"
  npc_override_job_prist_priest_anyway_let_me_give_you_ba3430: "总之，让我简单说明一下精神训练。你了解祭司的精神训练是什么吗？"
  npc_override_job_prist_priest_area_near_morocc_southwe_c8d7f3: "梦罗克附近、普隆德拉西南方的一个区域。"
  npc_override_job_prist_priest_as_we_help_others_we_474947: "在我们帮助他人的同时，我们不能期望他们以同样的方式对待我们。成为一位伟大的祭司是你自己的选择与责任，而非他人的。"
  npc_override_job_prist_priest_as_you_wish_19fe90: "如你所愿。"
  npc_override_job_prist_priest_aw_god_won_t_grant_eb0291: "啊……？如果你的目标不正义不纯粹，神不会赐予你神圣的力量。先静心冥想你的动机，然后再回来找我。"
  npc_override_job_prist_priest_aw_how_could_you_give_981287: "啊……？你怎么能给我那样的回答？我想你还没准备好成为祭司吧……"
  npc_override_job_prist_priest_become_priest_48f892: "并成为一名祭司！"
  npc_override_job_prist_priest_besides_god_also_given_p_0bdc69: "此外，神也赐予了祭司复活的力量。再想想生与死的意义，然后再回来找我。"
  npc_override_job_prist_priest_besides_none_your_busine_7ff6bc: "而且，这不关你的事。这位服事能否成为祭司不是由你决定的。在我动手之前，给我滚出去。"
  npc_override_job_prist_priest_bless_you_c1ea40: "祝福你……"
  npc_override_job_prist_priest_bless_you_e77ca3: "祝福你。"
  npc_override_job_prist_priest_book_you_i_hope_aid_4f8614: "这本书是给你的。我希望它能帮助你在地上传播神的话语。"
  npc_override_job_prist_priest_brother_6157cf: "{0}兄弟！"
  npc_override_job_prist_priest_brother_e79f70: "{0}兄弟，"
  npc_override_job_prist_priest_brother_f96663: "{0}兄弟……"
  npc_override_job_prist_priest_bwahahahahahah_1c8541: "哇哈哈哈哈！"
  npc_override_job_prist_priest_bwahahahahahahaha_34fbbb: "哇哈哈哈哈哈哈！"
  npc_override_job_prist_priest_card_5dfeef: "这张卡片可以"
  npc_override_job_prist_priest_cease_foolishness_pursui_526f34: "停止你追求祭司之位的愚蠢行为吧。与我签订契约。整个世界都将任你摆布。"
  npc_override_job_prist_priest_choose_become_servant_go_c747ae: "^330033选择成为神的仆人，就是选择永恒的痛苦！"
  npc_override_job_prist_priest_commemoration_your_job_c_5510f8: "为纪念你的转职，我送你一本圣经。它将照亮你通往正义之路。"
  npc_override_job_prist_priest_complete_trial_quickly_174f2e: "快速完成这项试炼，"
  npc_override_job_prist_priest_completed_1f6290: "已完成。"
  npc_override_job_prist_priest_completed_within_4a528a: "在"
  npc_override_job_prist_priest_congratulations_04ece6: "恭喜你。"
  npc_override_job_prist_priest_congratulations_you_comp_b223d4: "恭喜你，你已经完成了祭司所需的所有试炼。让我立即将你晋升为祭司。"
  npc_override_job_prist_priest_continue_your_training_88b0ba: "继续你的训练。"
  npc_override_job_prist_priest_contract_my_b22b16: "与我订约"
  npc_override_job_prist_priest_course_i_ll_let_you_2ba973: "当然，我会让你根据你的 Base 等级重新分配属性点。怎么样，挺划算的吧……？"
  npc_override_job_prist_priest_course_sometimes_i_want_fa4e5a: "当然，有时我也想像其他祭司一样全身心投入训练，但我有责任协助那些申请转职成祭司的服事。"
  npc_override_job_prist_priest_course_you_also_head_fie_12dc74: "当然，你也可以从普隆德拉向东走1张地图，然后向北走1张地图，再向东走2张地图……"
  npc_override_job_prist_priest_cross_again_ec2f96: "将再次交汇。"
  npc_override_job_prist_priest_cutest_thing_you_ve_19132c: "你见过最可爱的东西，嗯？"
  npc_override_job_prist_priest_did_9ba500: "你……"
  npc_override_job_prist_priest_did_you_just_tell_3ff395: "你刚才是不是让我"
  npc_override_job_prist_priest_doing_back_here_7a5316: "在这里做什么？"
  npc_override_job_prist_priest_don_t_ever_come_back_af90f5: "^330033永远别再回来！^000000"
  npc_override_job_prist_priest_enter_through_warp_end_h_ad772a: "通过大厅尽头的传送点进入，它将带你前往下一个测试大厅。"
  npc_override_job_prist_priest_even_if_looks_like_you_ca40a4: "即使看起来你是在帮助你的队友，这样的行为也会招致恶业。请好好反省一下。"
  npc_override_job_prist_priest_ever_seen_huh_6a37c1: "见过，嗯？"
  npc_override_job_prist_priest_excellent_choice_now_nev_be74b6: "明智的选择。现在，永远别再来这个地方。我将如你所愿把你的职业重置为初学者。"
  npc_override_job_prist_priest_father_rubalkabara_entra_739975: "鲁巴卡巴拉神父会在普隆德拉遗迹的入口处。小心点。那个地方是攻击性乔科鸟的栖息地。"
  npc_override_job_prist_priest_final_trial_you_promise_a89335: "在最终试炼中，你将宣誓对神的虔诚。你对自我牺牲的意愿也将受到考验。"
  npc_override_job_prist_priest_finally_now_time_you_mee_12482e: "最后，现在是你去见洋介神父的时候了。他正在普隆德拉西北方向某片田野中进行忏悔修行。请去找他，然后回到我这里。"
  npc_override_job_prist_priest_fine_get_going_d27b42: "好吧，去吧。"
  npc_override_job_prist_priest_first_meet_father_rubalk_68fc09: "首先，去见鲁巴卡巴拉神父。他在普隆德拉遗迹的东北方。"
  npc_override_job_prist_priest_first_please_visit_fathe_895104: "首先，请去拜访"
  npc_override_job_prist_priest_first_priest_you_must_me_3d1012: "你首先要见的祭司是鲁巴卡巴拉神父。他在普隆德拉东北方的遗迹中。"
  npc_override_job_prist_priest_first_trial_you_make_pil_7b02a2: "第一项试炼，你将进行朝圣之旅，按特定顺序拜访三位苦行祭司。"
  npc_override_job_prist_priest_follow_me_f3c136: "跟我来。"
  npc_override_job_prist_priest_foolish_human_737a0c: "愚蠢的人类……"
  npc_override_job_prist_priest_frail_mortal_you_4a4419: "作为一个脆弱凡人，你"
  npc_override_job_prist_priest_get_joke_cd5d7f: "GET THE JOKE!?"
  npc_override_job_prist_priest_give_your_life_god_4b8d98: "将你的生命献给神？"
  npc_override_job_prist_priest_go_59d7de: "加油！"
  npc_override_job_prist_priest_go_821b3f: "去吧……"
  npc_override_job_prist_priest_go_ahead_god_bless_0217aa: "去吧。神保佑"
  npc_override_job_prist_priest_go_as_your_acolyte_enter_8774b7: "加油！当你的服事进入后，测试就会开始。现在，我将送你去测试区域。"
  npc_override_job_prist_priest_go_back_5486bd: "回去！"
  npc_override_job_prist_priest_go_earn_yourself_fc5ae9: "自己去争取吧！"
  npc_override_job_prist_priest_go_observe_adventurers_f_1d4efe: "去观察那些为世界和平而战的冒险者们。他们会教你该做什么来帮助他们。"
  npc_override_job_prist_priest_go_think_about_value_suf_d1b0aa: "去思考苦难的价值和牺牲的意义吧。当你觉得自己更理解如何帮助有需要的人时，再回来找我。"
  npc_override_job_prist_priest_god_grant_your_power_you_c66408: "神啊，请将你的力量赐予你面前这位仆人。"
  npc_override_job_prist_priest_god_please_look_after_yo_074a85: "神啊，请眷顾你可怜的孩子们。帮助他们克服困难和磨难。振作他们的精神……"
  npc_override_job_prist_priest_god_safety_dbdfd5: "祈求神的保佑"
  npc_override_job_prist_priest_good_choice_5aba52: "好选择～"
  npc_override_job_prist_priest_good_choice_998be2: "好选择！"
  npc_override_job_prist_priest_good_i_send_you_training_6c4c9d: "好。我会送你去训练场。请向彼得兄弟寻求帮助。"
  npc_override_job_prist_priest_good_i_send_you_training_766bed: "好。我会送你去训练场。到了之后，请与负责训练的彼得兄弟交谈。"
  npc_override_job_prist_priest_good_see_you_again_broth_eddea1: "很高兴再次见到你，{0}兄弟。神的恩典再次让我们的道路交汇。"
  npc_override_job_prist_priest_good_see_you_once_again_40974c: "很高兴再次见到你，{0}修女。神的恩典再次将你带到我面前。"
  npc_override_job_prist_priest_good_you_0e34ea: "为你高兴！"
  npc_override_job_prist_priest_greetings_21e190: "幸会。"
  npc_override_job_prist_priest_haha_i_like_you_never_bc5c4f: "哈哈，我喜欢你！但信息再多也不嫌多。你知道得越多，就越容易通过测试！"
  npc_override_job_prist_priest_halt_human_eb169e: "^330033站住，凡人。"
  npc_override_job_prist_priest_happy_being_priest_1ebd03: "做祭司开心吗？"
  npc_override_job_prist_priest_he_doing_alright_d5f5f2: "他还好吗"
  npc_override_job_prist_priest_hello_little_aco_abe389: "你好啊，小服事。"
  npc_override_job_prist_priest_hereby_first_a39784: "在此，第一项"
  npc_override_job_prist_priest_hm_701c55: "嗯……？"
  npc_override_job_prist_priest_hm_what_you_need_4f478f: "嗯？你需要什么？"
  npc_override_job_prist_priest_hmm_8ee499: "嗯。"
  npc_override_job_prist_priest_hmm_9c4d28: "嗯……"
  npc_override_job_prist_priest_hmm_you_haven_t_made_6a46bd: "嗯？你还没有立下誓言……？没有向神立誓的决心，你随时都可能被邪恶诱惑。"
  npc_override_job_prist_priest_hmpf_i_admire_f81461: "哼。我钦佩"
  npc_override_job_prist_priest_hold_there_acolyte_28f61a: "等一下，服事。"
  npc_override_job_prist_priest_hopefully_our_paths_41c656: "但愿我们的道路"
  npc_override_job_prist_priest_how_about_now_isn_t_3e443d: "不过这个怎么样……？现在，这景象是不是很诱人？一张漂亮崭新的卡片。品相完美。你知道拥有这个的人可不多。但我刚好有……多到口袋都装不下了。"
  npc_override_job_prist_priest_how_my_buddy_paul_01aa46: "我的好伙伴保罗怎么样了？"
  npc_override_job_prist_priest_how_you_say_no_s_83cb80: "你怎么能说不……？那是祭司的基本原则之一。你必须把他人的福祉置于自身安全之上。"
  npc_override_job_prist_priest_however_point_your_pilgr_b41b12: "然而，在你朝圣之旅的这个阶段，我不是你应该拜访的人。"
  npc_override_job_prist_priest_however_there_certain_th_8eb9cc: "然而，有些事情服事必须独自完成。所有服事都必须独自完成他们的神圣试炼。"
  npc_override_job_prist_priest_however_those_who_receiv_30ac30: "然而，受助者应当有礼貌。你应该树立杰出的榜样，但作为人你也应当有自己的底线。"
  npc_override_job_prist_priest_i_also_know_deviruchi_do_1b8130: "我也知道恶魔侍者、死灵和黑暗领主都没能说服你放弃祭司之路。"
  npc_override_job_prist_priest_i_am_bishop_paul_cervant_f38a79: "我是保罗·塞万提斯主教，负责普隆德拉教区。"
  npc_override_job_prist_priest_i_am_doing_fine_867e2e: "我挺好的"
  npc_override_job_prist_priest_i_am_glad_meet_person_52bc5b: "我很高兴遇到像你这样对神热忱而虔诚的人。"
  npc_override_job_prist_priest_i_am_glad_you_ve_0c8b2f: "我很高兴你在精神训练中表现出色。恭喜你。你现在有资格被称为祭司了。"
  npc_override_job_prist_priest_i_assure_you_you_won_877834: "我向你保证……见到我你绝不会开心的。"
  npc_override_job_prist_priest_i_believe_cff34c: "我相信。"
  npc_override_job_prist_priest_i_believe_god_s_work_d37b12: "但我相信这是神的旨意，这是他以仆人身份赋予我的使命。一路平安，平安归来。"
  npc_override_job_prist_priest_i_cannot_let_you_know_61317e: "我不能告诉你具体细节，但只要你相信自己、信仰一切美善之物，你就能成功。"
  npc_override_job_prist_priest_i_congratulate_you_dee2d0: "我祝贺你"
  npc_override_job_prist_priest_i_don_t_any_business_f9ff96: "我与你这位神的仆人没什么好说的。只管过去吧。"
  npc_override_job_prist_priest_i_don_t_think_you_2233a8: "我想你没理解我提供的条件。再想想吧。我是说，这是你纠正人生错误的唯一机会。我是说，当个服事？"
  npc_override_job_prist_priest_i_give_you_exactly_minut_5afb3a: "我会给你正好5分钟！你必须稳步前进，消灭僵尸。"
  npc_override_job_prist_priest_i_grant_you_any_treasure_7448c8: "我可以赐予你任何你渴望的财富和无穷的力量。人类前所未见的强大武器……"
  npc_override_job_prist_priest_i_guess_i_m_49590c: "我想我不是"
  npc_override_job_prist_priest_i_hate_348714: "我讨厌"
  npc_override_job_prist_priest_i_here_988a75: "我会在这里"
  npc_override_job_prist_priest_i_hope_i_explained_enoug_310493: "我希望我对这个职业的解释已经够清楚了。如果你想了解更多我们的生活方式，为什么不出去和其他祭司聊聊呢？"
  npc_override_job_prist_priest_i_hope_my_invocation_eas_c02196: "我希望我的祈祷能缓解你的痛苦。现在请去传播神的话语吧。愿神与你同在……"
  npc_override_job_prist_priest_i_hope_you_assist_acolyt_567b97: "我希望你能协助这位服事成为祭司。"
  npc_override_job_prist_priest_i_hope_you_assist_your_db5b28: "我希望你能在第二项试炼——精神训练中协助你的服事朋友。"
  npc_override_job_prist_priest_i_hope_you_continue_go_0cbb92: "我希望你能继续作为神的仆人履行使命，兄弟。"
  npc_override_job_prist_priest_i_hope_you_continue_go_2e3295: "我希望你能继续作为神的仆人履行使命，修女。"
  npc_override_job_prist_priest_i_hope_you_find_someone_31b3dc: "我希望你能找到一位已经成为祭司的人，在精神训练中帮助你。祝你好运，保持信念。"
  npc_override_job_prist_priest_i_hope_you_ve_reflected_32d154: "我希望你反省了上次说的话，并且现在拥有了成为祭司应有的态度。"
  npc_override_job_prist_priest_i_know_who_you_35051f: "我知道你是谁。"
  npc_override_job_prist_priest_i_m_like_deviruchi_b7a74f: "我不像恶魔侍者，"
  npc_override_job_prist_priest_i_m_pleased_see_you_7a53c2: "我很高兴看到你继续引领神的子民走在正确的道路上。今天有什么我能帮忙的吗？"
  npc_override_job_prist_priest_i_mean_people_always_cry_d2f958: "我是说，人们不管在哪里都总是哭着向祭司求助。而祭司从来得不到任何回报……"
  npc_override_job_prist_priest_i_no_doubt_you_good_c68d5e: "我毫不怀疑你一个人就能做得很好。但是，如果有一位已经成为祭司的兄弟或修女协助，会更容易些。"
  npc_override_job_prist_priest_i_no_idea_what_brought_a12d06: "我不知道是什么风把你吹来的，但请恕我失陪了。"
  npc_override_job_prist_priest_i_now_send_you_training_b7eebd: "我现在送你去服事的训练场所。请代我向彼得兄弟问好……"
  npc_override_job_prist_priest_i_recommend_getting_help_40f84b: "如果可以的话，我建议你找一位祭司帮忙。"
  npc_override_job_prist_priest_i_see_fd141e: "我明白了……"
  npc_override_job_prist_priest_i_see_great_effort_you_90c3d4: "我能看到你为达到 Job 等级 50 所付出的巨大努力。你一直是神忠实的仆人。"
  npc_override_job_prist_priest_i_see_so_you_wish_f3eddb: "我明白了。所以你想成为一名祭司。神会为你这个决定而喜悦，并赐福于你。"
  npc_override_job_prist_priest_i_see_still_if_you_d62d29: "我明白了。不过，如果你有任何问题，可以问问塞西莉亚修女。她会解答你的任何疑问。"
  npc_override_job_prist_priest_i_see_take_your_time_1d9983: "我明白了，慢慢来。别忘了带^0000FF念珠^000000……"
  npc_override_job_prist_priest_i_see_well_feel_free_ce4a45: "我明白了。好吧，请随意放松，就当在自己家一样。世上没有比普隆德拉教堂更安全的地方了。"
  npc_override_job_prist_priest_i_see_you_returned_your_31f5b8: "看来你已经从鲁巴卡巴拉神父那里回来了。他还好吗？我担心他的健康，因为一直独自待在那里……"
  npc_override_job_prist_priest_i_see_you_returned_your_cc69e1: "看来你已经从玛蒂尔达修女那里回来了。她在炎热干燥的沙漠中冥想已有多时了。"
  npc_override_job_prist_priest_i_see_you_ve_devoted_a9e112: "我明白了。你已将自己奉献给神。许多服事希望成为祭司，以继续他们的神圣之旅。"
  npc_override_job_prist_priest_i_shall_personally_see_m_18e253: "我会亲自处理这件事，凡人。^000000"
  npc_override_job_prist_priest_i_shall_pray_97ce96: "我会祈祷"
  npc_override_job_prist_priest_i_shall_preparing_my_tro_fae05d: "我会为你们准备好我的军队。终有一日，我将享受地看着我的恶鬼慢慢吞噬你们时的痛苦挣扎。"
  npc_override_job_prist_priest_i_shall_return_your_34a0ad: "我会将你的"
  npc_override_job_prist_priest_i_strongly_recommend_you_9ff36a: "我强烈建议你在申请祭司转职测试之前用掉所有这些技能点。"
  npc_override_job_prist_priest_i_told_you_go_back_0fd5c9: "我告诉过你回教堂去。"
  npc_override_job_prist_priest_i_understand_i_suppose_y_8d656a: "我理解。我想你一定有什么重要的原因或事务要处理。准备好了就回来吧。"
  npc_override_job_prist_priest_i_ve_been_supporting_man_4604c3: "自从我加入普隆德拉教区以来，一直在帮助许多人成为祭司。那是我的主要职责之一。"
  npc_override_job_prist_priest_i_ve_received_message_bi_1b0bf3: "我已收到保罗主教的消息。既然你完成了朝圣之旅，希望你也能实现成为祭司的目标。"
  npc_override_job_prist_priest_i_won_t_say_29e5b8: "我不会说"
  npc_override_job_prist_priest_i_yours_summon_anytime_a_a35c42: "我将随时供你召唤。所有其他人类都将畏惧与你为敌。你将成为历史上最强大的人！"
  npc_override_job_prist_priest_if_chance_we_meet_again_ac1f87: "但如果我们碰巧再次相遇，"
  npc_override_job_prist_priest_if_you_close_priest_you_ade258: "如果你认识某位祭司，最好请他在这项试炼中协助你。现在，你准备好了吗？"
  npc_override_job_prist_priest_if_you_experience_proble_969fe1: "如果你在任何试炼中遇到问题，随时可以来找我。我会尽力帮助你。"
  npc_override_job_prist_priest_if_you_know_somebody_who_57dba4: "如果你认识已经成为祭司的人，请他们在你的精神训练中帮助你。"
  npc_override_job_prist_priest_if_you_pass_test_you_685a2b: "如果你通过测试，你将能够使用更强大的技能，对付恶魔和不死生物非常有效……"
  npc_override_job_prist_priest_if_you_re_interested_ple_a57d16: "如果你有兴趣，请询问另一个房间的祭司。选择成为服事，你永远不会后悔。"
  npc_override_job_prist_priest_if_you_satisfy_requireme_998a8d: "如果你满足条件，我建议你先申请祭司职业。你现在想申请吗？"
  npc_override_job_prist_priest_if_you_set_your_mind_037e8b: "如果你下定决心成为祭司，你必须经过几项测试。只有达到 Job 等级 40 的服事才有资格参加测试。"
  npc_override_job_prist_priest_if_you_want_take_test_9ac0ab: "如果你想参加测试，请稍等一会儿再跟我说话。"
  npc_override_job_prist_priest_if_you_wish_become_acoly_ab76b8: "如果你想成为服事，请去另一个房间。"
  npc_override_job_prist_priest_if_you_wish_become_serva_b2d966: "如果你想成为神的仆人，请向保罗主教申请祭司职位，并完成全部3项试炼。"
  npc_override_job_prist_priest_isn_t_everyone_s_dream_ad69e6: "这不就是每个人的梦想吗？想想看，当祭司只会给你带来痛苦……"
