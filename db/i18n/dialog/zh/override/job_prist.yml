  npc_override_job_prist_priest_menu_mountains_8ce351: "一辈子都花不完的如山 Zeny。不过，谁又说你的寿命是有限的呢？名声、权力、永生：这一切都可以是你的。"
  npc_override_job_prist_priest_menu_no_ddf90d: "不不不，你理解错了。神授权我们使用他的力量来支持他的子民。你必须帮助身处危险的人们：这是你的义务。"
  npc_override_job_prist_priest_menu_now_833a52: "现在，你可以直接前往第二项试炼：精神训练。在这项训练中，你可以带一位祭司同行。"
