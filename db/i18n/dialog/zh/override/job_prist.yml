  npc_override_job_prist_priest_just_devote_your_1849fb: "就把你的"
  npc_override_job_prist_priest_just_don_t_become_priest_678a3a: "干脆别当祭司了。我不会问第二遍。那样你可以选择更好的职业……比如像我一样的剑士。"
  npc_override_job_prist_priest_just_go_priest_isn_t_f6f650: "去做祭司吧。这里不是小孩子玩的地方。"
  npc_override_job_prist_priest_just_wave_my_hand_you_65682f: "^330033只要我挥挥手，你就会不复存在。没有人会记得你。在我无穷的魔力面前颤抖吧！^000000"
  npc_override_job_prist_priest_keep_mind_we_god_s_a7b434: "记住，我们是神在地上的使者。永远记住我们必须帮助他人。"
  npc_override_job_prist_priest_kill_those_25b442: "消灭那些"
  npc_override_job_prist_priest_lastly_please_seek_out_f_3ee37f: "最后，请去找洋介神父。他在普隆德拉西北方向的一片田野中。"
  npc_override_job_prist_priest_let_evil_conquer_your_so_6360a1: "不要让邪恶征服你的灵魂。你有足够的勇气和力量克服最艰难的局面。愿神保佑你……"
  npc_override_job_prist_priest_let_her_send_your_messag_869876: "让她将你的信息传达到天涯海角。"
