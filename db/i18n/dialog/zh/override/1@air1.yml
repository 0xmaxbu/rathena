Body:
  npc_override_1@air1_AirshipAssault_after_dimension_device_f_0405cb: "^ff0000维度装置形成后^000000"
  npc_override_1@air1_AirshipAssault_ah_argh_8017b0: "啊……啊！！"
  npc_override_1@air1_AirshipAssault_ah_argh_help_me_26baf9: "啊……啊！救救我！！"
  npc_override_1@air1_AirshipAssault_ah_iris_you_trying_kill_c3a4cc: "啊……艾里斯！！你是想杀了我吗~！！"
  npc_override_1@air1_AirshipAssault_ahahahahaha_1aa2e5: "啊哈哈哈哈！！"
  npc_override_1@air1_AirshipAssault_ahhhhhh_3a2c01: "啊啊啊啊~"
  npc_override_1@air1_AirshipAssault_alert_alert_large_wyvern_6bd343: "警报！！警报！！7点钟方向出现大型飞龙单位！！"
  npc_override_1@air1_AirshipAssault_all_enemies_floor_been_d_af5d1a: "本层的所有敌人已被击败。前往下一层。"
  npc_override_1@air1_AirshipAssault_all_enemies_floor_been_d_ce795e: "本层的所有敌人已被击败。前往甲板。"
  npc_override_1@air1_AirshipAssault_all_enemies_floor_been_d_d3c04d: "本层的所有敌人已被击败。前往引擎室入口。"
  npc_override_1@air1_AirshipAssault_all_enemies_one_floor_de_5ca3f9: "必须击败一层中的所有敌人才能继续前进。"
  npc_override_1@air1_AirshipAssault_all_engines_confirmed_ha_333608: "所有引擎确认已停止！！"
  npc_override_1@air1_AirshipAssault_all_honesty_overstatemen_63596a: "说实话，说拇指大小的石头在推动这艘船一点也不夸张。它拥有不可思议的力量。"
  npc_override_1@air1_AirshipAssault_argh_aaah_62a376: "啊！啊啊~！！"
  npc_override_1@air1_AirshipAssault_argh_rear_engine_number_01c135: "啊！！后方引擎1号！！"
  npc_override_1@air1_AirshipAssault_argh_rune_engine_engine_51f602: "啊！符文引擎！！引擎室爆炸了！！灭火队！快灭火！！"
  npc_override_1@air1_AirshipAssault_arrgh_en_engine_ca5091: "啊……引……引擎！"
  npc_override_1@air1_AirshipAssault_as_expected_our_intuitio_da71af: "果然如此。我们的直觉没错。跟随邪恶的波动来到这里是值得的。"
  npc_override_1@air1_AirshipAssault_as_expected_you_freyja_s_97cb1e: "果然如此。你是芙蕾雅的棋子？"
  npc_override_1@air1_AirshipAssault_as_you_see_we_heat_517110: "如你所见，我们加热大型锅炉将水煮沸，然后利用蒸汽压力推动活塞，带动齿轮转动涡轮，从而驱动螺旋桨。"
  npc_override_1@air1_AirshipAssault_b_i_n_g_o_c155a1: "B.I.N.G.O. ~"
  npc_override_1@air1_AirshipAssault_babang_bang_004d41: "- 砰！砰！"
  npc_override_1@air1_AirshipAssault_bang_babang_bang_9e1d60: "- 砰！砰砰！砰！"
  npc_override_1@air1_AirshipAssault_bastards_die_die_21ec40: "混蛋！去死！去死！"
  npc_override_1@air1_AirshipAssault_beautiful_sorceress_arca_69d8b7: "美丽女巫阿尔卡娜的惊喜空中怪物表演！！"
  npc_override_1@air1_AirshipAssault_better_end_party_now_wha_e71cbc: "现在最好结束这场派对……这是什么？芙蕾雅派你来的？"
  npc_override_1@air1_AirshipAssault_board_lifeboats_passenge_4198f7: "让乘客优先登上救生艇！释放已完成登船的救生艇！"
  npc_override_1@air1_AirshipAssault_boom_0d2fb4: "- 轰！！！"
  npc_override_1@air1_AirshipAssault_bothersome_pests_8fc5c2: "烦人的害虫……"
  npc_override_1@air1_AirshipAssault_cap_captain_serious_d7aac6: "船……船长！情况紧急！"
  npc_override_1@air1_AirshipAssault_captain_there_no_need_so_8b15a0: "船长。没必要这么激动。"
  npc_override_1@air1_AirshipAssault_careful_if_you_keep_goin_d09835: "……小心。如果你继续那样……"
  npc_override_1@air1_AirshipAssault_chaos_1b0641: "混乱……"
  npc_override_1@air1_AirshipAssault_chaos_7b045f: "……？？混乱？"
  npc_override_1@air1_AirshipAssault_click_enter_again_743a0f: "^ff0000点击再次进入。^000000"
  npc_override_1@air1_AirshipAssault_could_turn_out_fun_party_2cf862: "这可能会变成一场有趣的派对~"
  npc_override_1@air1_AirshipAssault_could_wyvern_s_breath_57c021: "难道是……飞龙吐息？！！"
  npc_override_1@air1_AirshipAssault_course_7d6b19: "当然！"
  npc_override_1@air1_AirshipAssault_course_they_got_sense_ou_7acdca: "当然！！他们感受到了我们的实力！！呵呵呵~"
  npc_override_1@air1_AirshipAssault_creation_failed_2e1f8c: "^0000ff{0}^000000 - 创建失败！"
  npc_override_1@air1_AirshipAssault_damn_912bd3: "该死……"
  npc_override_1@air1_AirshipAssault_damn_if_only_i_had_1a77e5: "该死……如果我有武器的话……"
  npc_override_1@air1_AirshipAssault_damn_s_dangerous_here_le_6bd5d9: "该死！！这里很危险！我们先离开这里！艾里斯，快点！！"
  npc_override_1@air1_AirshipAssault_damn_there_too_many_them_d74cd3: "该死……太多了！引擎室可能会被攻陷！！"
  npc_override_1@air1_AirshipAssault_damn_they_already_reache_4b367d: "该死……他们已经到达这里了！多亏了你，符文引擎才得以守住。"
  npc_override_1@air1_AirshipAssault_damn_where_did_i_put_b1d659: "该死……我把武器放哪儿了……"
  npc_override_1@air1_AirshipAssault_die_villains_huuma_metal_a244a7: "去死吧，恶棍们！！风魔金属手里剑！！"
  npc_override_1@air1_AirshipAssault_different_i_don_t_any_2533ed: "……那不一样。我没有更多信息了……"
  npc_override_1@air1_AirshipAssault_doing_our_work_us_hm_2b2a28: "替我们完成了工作。嗯，我想这就够了？"
  npc_override_1@air1_AirshipAssault_eeek_17832f: "呀！！"
  npc_override_1@air1_AirshipAssault_eek_looks_like_we_ll_4f21c5: "呀！！看起来我们要掉下去了！！"
  npc_override_1@air1_AirshipAssault_eek_there_still_more_the_7ed806: "呀！还有更多！！"
  npc_override_1@air1_AirshipAssault_eh_so_s_how_big_9b0408: "嗯……所以这艘大船就是这样飞起来的……但现在神秘感消失了。我以为会有什么神秘装置……有点失望……"
  npc_override_1@air1_AirshipAssault_end_b302c2: "……这就是结局吗？"
  npc_override_1@air1_AirshipAssault_enemies_suddenly_appeare_16e6f7: "敌人突然出现，试图摧毁飞艇。"
  npc_override_1@air1_AirshipAssault_enter_you_must_create_jo_6852e2: "^ff0000要进入，你必须创建或加入一个1人或更多成员的队伍。^000000"
  npc_override_1@air1_AirshipAssault_entrance_engine_room_sto_a498e3: "这是引擎室的入口。阻止他们进来！"
  npc_override_1@air1_AirshipAssault_even_exploding_ship_incr_de9ebc: "连爆炸的飞艇都很棒~ 哇~"
  npc_override_1@air1_AirshipAssault_everybody_get_lifeboats_5ffc60: "所有人都上救生艇！"
  npc_override_1@air1_AirshipAssault_flying_air_through_stren_0de630: "依靠机械的力量在空中飞行……科技的发展真是令人惊叹。"
  npc_override_1@air1_AirshipAssault_found_my_weapon_hehehehe_9bbe43: "找到了！我的武器！呵呵呵呵"
  npc_override_1@air1_AirshipAssault_glad_there_aren_t_any_9676ed: "……幸好这里没有那些烦人的东西……"
  npc_override_1@air1_AirshipAssault_go_bottom_airship_defeat_0a3a25: "前往飞艇底部并击败敌人。"
  npc_override_1@air1_AirshipAssault_grab_4c52e0: "……抓紧"
  npc_override_1@air1_AirshipAssault_gre_gremlins_gremlins_la_262790: "格……格林姆林！！格林姆林从飞龙身上降落到船上！！"
  npc_override_1@air1_AirshipAssault_gremlins_all_over_ship_4a3c32: "格林姆林遍布整艘船！！"
  npc_override_1@air1_AirshipAssault_gremlins_just_monsters_t_d57f5b: "格林姆林只是喜欢摆弄机器的怪物。倒不如说……"
  npc_override_1@air1_AirshipAssault_guardian_heroines_fd4937: "守护女英雄们！！"
  npc_override_1@air1_AirshipAssault_hahahaha_you_waited_long_79edcf: "哈哈哈~ 让你们久等了！！"
  npc_override_1@air1_AirshipAssault_hehehehehehehehe_3cfcf7: "呵呵呵呵呵呵呵呵！"
  npc_override_1@air1_AirshipAssault_hey_don_t_touch_my_2bbc34: "嘿！别碰我的卡片！"
  npc_override_1@air1_AirshipAssault_hey_humans_block_nuisanc_bbb076: "嘿，人类！！在我去船长室找武器的时候，挡住那个麻烦的家伙！！"
  npc_override_1@air1_AirshipAssault_hey_no_horsing_around_sh_99c665: "嘿！！别在船上胡闹！！"
  npc_override_1@air1_AirshipAssault_hey_where_you_going_argh_5df633: "嘿！你要去哪儿！啊！！"
  npc_override_1@air1_AirshipAssault_hm_5ea458: "嗯……"
  npc_override_1@air1_AirshipAssault_hm_after_several_days_ob_09528a: "嗯……经过几天的观察，这个地方似乎是一个印刻着飞艇记忆的装置。"
  npc_override_1@air1_AirshipAssault_hm_no_no_everybody_just_ee1809: "嗯，不，不。大家都只是被我们华丽的登场迷住了。"
  npc_override_1@air1_AirshipAssault_hm_what_now_c83ca6: "嗯……这是怎么回事？"
  npc_override_1@air1_AirshipAssault_hm_what_s_reaction_every_6a26e8: "嗯？反应怎么这么冷淡？大家都有些温吞……是不是太过火了？"
  npc_override_1@air1_AirshipAssault_hooray_we_flying_through_d2ccef: "万岁~ 我们在天空中飞翔！而且还是免费的！"
  npc_override_1@air1_AirshipAssault_how_dare_mere_lowly_huma_463d34: "区区卑微的人类竟敢说出芙蕾雅的名字。"
  npc_override_1@air1_AirshipAssault_how_dare_you_interrupt_m_a586ce: "你竟敢打断我宝贵的用餐时间！卫兵！卫兵在哪儿！"
  npc_override_1@air1_AirshipAssault_how_we_stop_him_maybe_834d5a: "我们怎么才能阻止他？……也许如果你把他打到半死不活，他就会恢复理智……拜托你了！！"
  npc_override_1@air1_AirshipAssault_how_you_like_ab5279: "你觉得怎么样！！"
  npc_override_1@air1_AirshipAssault_however_i_share_fate_shi_decc72: "然而我将与这艘船共命运。这艘船和我是一体的！"
  npc_override_1@air1_AirshipAssault_huh_75a82a: "……嗯？"
  npc_override_1@air1_AirshipAssault_huh_868104: "嗯..?!"
  npc_override_1@air1_AirshipAssault_huh_hey_837145: "嗯？嘿！！"
  npc_override_1@air1_AirshipAssault_huh_s_good_question_34d723: "嗯？这是个好问题。"
  npc_override_1@air1_AirshipAssault_humph_i_don_t_care_fa97c7: "哼！我才不在乎你是死是活……"
  npc_override_1@air1_AirshipAssault_humph_s_what_you_get_8a572a: "哼！这就是你走神的下场！"
  npc_override_1@air1_AirshipAssault_humph_you_don_t_know_431346: "哼。你根本不知道自己在说什么！"
  npc_override_1@air1_AirshipAssault_huuma_metal_shuriken_hiy_8e4b42: "风魔金属手里剑！！喝呀！"
  npc_override_1@air1_AirshipAssault_i_catch_you_i_kill_6ce28f: "我会抓住你。我会杀了你！！"
  npc_override_1@air1_AirshipAssault_i_defend_place_no_matter_087bf8: "……无论如何我都会守住这个地方。下到飞艇下层去……！！"
  npc_override_1@air1_AirshipAssault_i_end_my_specially_manuf_9337d8: "我要用我特制的前所未有的十三号厄运步枪来结束这一切！"
  npc_override_1@air1_AirshipAssault_i_face_them_here_chaos_481b8e: "我在这里面对他们。混乱，和艾里斯一起下到飞艇下层！"
  npc_override_1@air1_AirshipAssault_i_feel_larger_wave_evil_e3a778: "我能感觉到一股更强大的邪恶波动。"
  npc_override_1@air1_AirshipAssault_i_feel_there_s_power_9b23f4: "但我感觉到某种力量……我想这艘飞艇不可能仅靠技术就能飞行。"
  npc_override_1@air1_AirshipAssault_i_just_getting_feel_thes_8fabfb: "我刚找到感觉，这些怪物就出现了？！你是不是因为我赢了一点就想抢我的钱？嗯？！"
  npc_override_1@air1_AirshipAssault_i_show_you_what_happens_2915c1: "我会让你看看攻击我的船会有什么下场！"
  npc_override_1@air1_AirshipAssault_if_i_catch_you_next_1dc972: "如果我下次抓住你，我保证让你死！！紧张起来！！明白了吗？！准备好，你们这些乡巴佬！！"
  npc_override_1@air1_AirshipAssault_if_we_keep_stalling_rest_86bb85: "如果我们继续拖延，其他人就会有危险！！太遗憾了，但我们已经尽力了！"
  npc_override_1@air1_AirshipAssault_iris_come_here_5a59f2: "艾里斯！！过来！！"
  npc_override_1@air1_AirshipAssault_iris_let_s_go_down_682569: "艾里斯！！我们去引擎室！洛基和芬里尔，守住这里！"
  npc_override_1@air1_AirshipAssault_just_just_minute_8e41b0: "就……就一分钟……"
  npc_override_1@air1_AirshipAssault_just_look_their_clothes_750662: "看看他们的衣服！！"
  npc_override_1@air1_AirshipAssault_let_me_introduce_447593: "让我介绍一下……"
  npc_override_1@air1_AirshipAssault_let_s_leave_these_little_033f7a: "把这些小喽啰留给他们。我们走！"
  npc_override_1@air1_AirshipAssault_let_s_quickly_find_fenri_a4bcbd: "我们快去找芬里尔和洛基，然后离开这里！！"
  npc_override_1@air1_AirshipAssault_little_thing_5a693a: "那个小东西……！！！"
  npc_override_1@air1_AirshipAssault_lo_ki_1460a4: "洛……基？"
  npc_override_1@air1_AirshipAssault_loki_38e793: "……?! 洛基！！"
  npc_override_1@air1_AirshipAssault_marvelous_how_huge_ship_1b43a9: "这艘巨大的船不使用魔法就能飞行，难道不令人惊叹吗？混乱？"
  npc_override_1@air1_AirshipAssault_member_party_entered_ins_a03ae5: "{1}队伍的{0}进入了副本{2}。"
  npc_override_1@air1_AirshipAssault_memorial_dungeon_cannot_b007f7: "^ff0000纪念地下城在上次进入后23小时内无法再次进入。^000000"
  npc_override_1@air1_AirshipAssault_memorial_dungeon_only_pe_b0631d: "^ff0000这个纪念地下城仅限1人。只有队伍领袖可以进入。^000000"
  npc_override_1@air1_AirshipAssault_menu_character_e7418a: "角色名:{0}"
  npc_override_1@air1_AirshipAssault_menu_party_0eb6cf: "队伍名:{0}"
  npc_override_1@air1_AirshipAssault_msg_61ce5a: "[{0}]"
  npc_override_1@air1_AirshipAssault_msg_93fcbf: "……"
  npc_override_1@air1_AirshipAssault_msg_abb326: "……!!"
  npc_override_1@air1_AirshipAssault_muhahahaha_ce304b: "唔哈哈哈哈！"
  npc_override_1@air1_AirshipAssault_muhahahaha_dbda8a: "唔哈哈哈哈！！"
  npc_override_1@air1_AirshipAssault_muhahahahaha_4f4c8f: "唔哈哈哈哈哈"
  npc_override_1@air1_AirshipAssault_my_new_clothes_ruined_acfe43: "我的新衣服毁了……"
  npc_override_1@air1_AirshipAssault_no_no_ship_0ccef9: "不……不！！船！！"
  npc_override_1@air1_AirshipAssault_note_i_leave_you_take_c4d1ff: "顺便说一下，我把善后工作留给你了。我走了！！"
  npc_override_1@air1_AirshipAssault_note_one_last_huuma_meta_fcbf76: "顺便说一下，最后一发风魔金属手里剑！！"
  npc_override_1@air1_AirshipAssault_now_let_us_get_started_199a7f: "现在……让我们开始吧！格林姆林~！！"
  npc_override_1@air1_AirshipAssault_off_your_hands_neck_4aec6c: "砍掉你的手和脖子！"
  npc_override_1@air1_AirshipAssault_oh_gee_f6ceed: "哦？天哪！"
  npc_override_1@air1_AirshipAssault_oh_okay_alright_let_s_aa90a9: "哦……好的！好吧……我们走！！"
  npc_override_1@air1_AirshipAssault_oh_there_basara_looks_li_73ea24: "哦？……那边，巴萨拉。看起来他们在撤退。"
  npc_override_1@air1_AirshipAssault_oh_you_no_fear_ff3908: "哦。你无所畏惧。"
  npc_override_1@air1_AirshipAssault_okay_i_show_you_somethin_cf0424: "好吧~ 我给你看点好东西。让你们冷静下来的东西。"
  npc_override_1@air1_AirshipAssault_ones_who_denigrate_conde_0562bb: "那些贬低和谴责正义之路的人……我们应该毫不留情地施以正义审判，对吧？"
  npc_override_1@air1_AirshipAssault_ooh_you_threw_back_wyver_cde685: "哦……你把飞龙吐息挡回去了……出乎意料。但你能承受这一击吗？"
  npc_override_1@air1_AirshipAssault_oops_i_shooting_like_cra_92c875: "哎呀……我疯狂射击。看起来很多格林姆林都不见了？呵呵呵呵"
  npc_override_1@air1_AirshipAssault_oops_way_captain_how_big_714fa4: "哎呀……顺便问一下船长，这艘大飞艇是怎么在天上飞的？太神奇了！"
  npc_override_1@air1_AirshipAssault_party_leader_used_device_b1d762: "^ff0000队伍领袖尚未使用装置。^000000"
  npc_override_1@air1_AirshipAssault_place_i_t_reach_like_7c8769: "……一个我以前无法到达的地方……"
  npc_override_1@air1_AirshipAssault_pop_pop_pop_987901: "- 砰！砰砰！"
  npc_override_1@air1_AirshipAssault_power_up_device_3d016c: "给装置充能"
  npc_override_1@air1_AirshipAssault_pu_4da9b6: "噗……"
  npc_override_1@air1_AirshipAssault_puhahahahahahahahaha_cd964f: "噗哈哈哈哈哈哈哈"
  npc_override_1@air1_AirshipAssault_remaining_people_preciou_cbe254: "但剩下的人也是宝贵的生命！你要抛弃他们吗？！！嗯？！！"
  npc_override_1@air1_AirshipAssault_right_right_much_product_4c91f5: "对对。英雄登场的这种制作规模有点太大了！！"
  npc_override_1@air1_AirshipAssault_roger_basara_let_s_end_2a7903: "明白，巴萨拉！让我们迅速结束战斗！！"
  npc_override_1@air1_AirshipAssault_roger_ranger_flying_form_60df83: "明白！！游侠飞行形态！！"
