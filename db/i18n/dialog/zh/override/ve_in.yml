Body:
  npc_override_ve_in_sura_aaaaaaaaaaak_don_t_4e0726: "啊——！不要这样！！"
  npc_override_ve_in_sura_aaaaaahhhhhhhhk_657db6: "啊——！！！！！！"
  npc_override_ve_in_sura_aaahh_beautiful_imposing_367200: "啊~ 那美丽而威严的身影……"
  npc_override_ve_in_sura_after_i_ll_think_about_a49471: "之后，我会再考虑一下。"
  npc_override_ve_in_sura_after_i_saw_you_fighting_27c3b2: "在我看到你战斗之后……"
  npc_override_ve_in_sura_ah_long_time_no_see_da00cb: "啊，好久不见，{0}。"
  npc_override_ve_in_sura_ah_my_colleague_introduc_e5b150: "啊！我的同事向我介绍过你！"
  npc_override_ve_in_sura_ah_person_we_saw_before_8852fd: "啊，是之前我们见过的那个人？"
  npc_override_ve_in_sura_ah_you_may_hallucination_90e190: "啊！你在客厅里可能会产生幻觉，所以请小心。"
  npc_override_ve_in_sura_ahhhh_i_feel_better_now_965cb0: "啊啊啊，现在感觉好多了！！"
  npc_override_ve_in_sura_ahhhh_i_m_so_tired_555904: "啊啊啊~ 我好累。"
  npc_override_ve_in_sura_ahhk_wolf_i_caught_uhh_89d3fc: "啊！那是我……抓到的……狼。呃。"
  npc_override_ve_in_sura_although_she_woman_like_00b02a: "虽然她和我一样是个女人，但她太酷了！"
  npc_override_ve_in_sura_anyway_why_you_here_see_19880c: "总之，你为什么要来找我？"
  npc_override_ve_in_sura_anyway_you_here_now_so_32372e: "总之你现在在这里，所以我是你的直属上司。"
  npc_override_ve_in_sura_aren_t_you_idiot_d451ce: "你不是个白痴吗？"
  npc_override_ve_in_sura_bang_f15a20: "- 砰 -"
  npc_override_ve_in_sura_become_stronger_too_hard_af6536: "对凡人来说，变得更强太难了。"
  npc_override_ve_in_sura_better_saying_he_died_ju_f45be7: "与其说他死了，不如说他还一直在见他的朋友，这样更好。"
  npc_override_ve_in_sura_boss_we_really_past_our_81ef38: "老大……我们真的已经过气了吗？"
  npc_override_ve_in_sura_bruno_sent_me_here_08b337: "「布鲁诺」派我来的。"
  npc_override_ve_in_sura_bye_755e0d: "再见……"
  npc_override_ve_in_sura_cheeks_glowing_c09407: "........（脸颊泛红）"
  npc_override_ve_in_sura_come_again_whenever_you_1be798: "想来的话随时再来~"
  npc_override_ve_in_sura_come_here_fa7822: "过来这里。"
  npc_override_ve_in_sura_course_7547a5: "当然~"
  npc_override_ve_in_sura_course_i_am_human_56cddc: "当然，我是人类。"
  npc_override_ve_in_sura_cute_girl_seems_scared_y_6884f3: "那个可爱的女孩好像很怕你！"
  npc_override_ve_in_sura_did_you_really_kill_all_d04e24: "你真的把那些狼都杀了吗？"
  npc_override_ve_in_sura_difficult_girl_no_just_k_d27f49: "那个难缠的女孩……不，开玩笑的。"
  npc_override_ve_in_sura_don_t_bother_me_just_349dfc: "别烦我，走开！"
  npc_override_ve_in_sura_don_t_ignore_me_just_dc228d: "别无视我，跟我说话。"
  npc_override_ve_in_sura_don_t_you_any_presents_e2d62e: "你不给师父带点礼物吗？"
  npc_override_ve_in_sura_drawing_room_2e8101: "客厅"
  npc_override_ve_in_sura_famous_king_crab_b7e02b: "这就是著名的帝王蟹！！！"
  npc_override_ve_in_sura_frankly_speaking_i_quite_09c5b3: "坦白说，我对你相当惊讶。"
  npc_override_ve_in_sura_ghost_8fe76b: "幽灵？"
  npc_override_ve_in_sura_go_away_16c8ca: "走开！！！"
  npc_override_ve_in_sura_go_el_mes_gorge_southeas_ebb3ae: "前往^f57d7d朱诺东南方的艾尔梅斯峡谷^000000。"
  npc_override_ve_in_sura_ha_ha_ha_ha_ha_3ac1f0: "哈哈哈哈哈哈哈！！！！"
  npc_override_ve_in_sura_haaap_haaaap_whoo_haahhp_a0d506: "哈！！！哈！！！呼！！哈！！！"
  npc_override_ve_in_sura_hah_you_re_really_making_187bcb: "哈……你真的让我很累。"
  npc_override_ve_in_sura_he_really_cool_awesome_1cd0a1: "但他真的很酷，很厉害。"
  npc_override_ve_in_sura_he_s_bit_stick_mud_4e1945: "他有点古板。"
  npc_override_ve_in_sura_he_said_he_put_world_439bd0: "他说他已经把世界抛在脑后，是一个放弃做人、成为幽灵的人，但他似乎对世界还有留恋。"
  npc_override_ve_in_sura_hey_7d3ae8: "嘿~！"
  npc_override_ve_in_sura_hey_how_dare_you_use_5f47f2: "嘿！你怎么敢对一位女士使用暴力！？"
  npc_override_ve_in_sura_hey_lady_we_scary_people_ff2ced: "嘿，女士~ 我们不是可怕的人~~"
  npc_override_ve_in_sura_hey_right_here_one_more_14e28e: "嘿！就在这里！！！再来一杯啤酒！！！"
  npc_override_ve_in_sura_hey_there_0f6d71: "嘿，那边。"
  npc_override_ve_in_sura_hey_what_s_up_7a38a7: "嘿~ {0}，怎么了？"
  npc_override_ve_in_sura_hmm_e777ce: "嗯？"
  npc_override_ve_in_sura_ho_ho_e3b702: "呵呵。"
  npc_override_ve_in_sura_ho_ho_ho_ea12fa: "呵呵呵~"
  npc_override_ve_in_sura_how_come_little_rookie_k_469c0b: "一个小菜鸟怎么可能把我打晕！我！伟大的帝王蟹……"
  npc_override_ve_in_sura_how_could_you_treat_some_072de8: "你怎么能这样对待上门拜访的人？"
  npc_override_ve_in_sura_how_dare_little_rookie_a_be47d4: "一个小菜鸟竟敢攻击你，老大！"
  npc_override_ve_in_sura_how_dare_you_say_those_91fc06: "你怎么敢说那些话？"
  npc_override_ve_in_sura_how_did_you_find_place_69e1d9: "你怎么找到这个地方的！"
  npc_override_ve_in_sura_how_i_repay_you_d790cb: "我该怎么报答你？"
  npc_override_ve_in_sura_how_overcome_limitation_c43af2: "如何克服这个极限。"
  npc_override_ve_in_sura_how_persistent_dbc422: "真执着……"
  npc_override_ve_in_sura_how_you_doing_8efe1e: "你怎么样？"
  npc_override_ve_in_sura_however_as_you_might_fel_3237ab: "然而，正如你可能感受到的，我终于面对了自己的极限。"
  npc_override_ve_in_sura_huh_boss_really_mad_c979cc: "哈！老大真的生气了！"
  npc_override_ve_in_sura_huuuh_no_matter_how_stro_47ac18: "呼~ 不管你有多强，"
  npc_override_ve_in_sura_i_also_shut_myself_off_38730d: "我也把自己封闭在世界之外。如果有一天我们再次回到世间，那一定是世界需要幽灵参战的那一天。"
  npc_override_ve_in_sura_i_am_confident_i_never_290378: "我有信心永远不会输。"
  npc_override_ve_in_sura_i_am_person_who_pub_fbbf63: "我就是刚才在酒馆的那个人。"
  npc_override_ve_in_sura_i_asked_bruno_about_her_65f30b: "我向布鲁诺询问了她的实力，她推荐我来找你。"
  npc_override_ve_in_sura_i_beat_you_up_one_ec13a8: "我一拳就能把你打趴下……"
  npc_override_ve_in_sura_i_don_t_know_who_448599: "我不知道你是谁，但你一定是疯了！"
  npc_override_ve_in_sura_i_don_t_know_why_3e93c5: "我不知道你为什么在这里，但请不要站在我身后，除非你想死。"
  npc_override_ve_in_sura_i_drink_today_3be279: "今天我要喝个痛快！！！"
  npc_override_ve_in_sura_i_feel_heavy_hearted_whe_de8e8a: "看到师父思念他的朋友，我感到心情沉重……"
  npc_override_ve_in_sura_i_figured_you_d_given_13c737: "我以为你已经放弃了。"
  npc_override_ve_in_sura_i_forgot_something_b527c5: "我忘了做一件事！"
  npc_override_ve_in_sura_i_gave_up_being_human_a880a6: "在我选择这条路之后，我就放弃了做人。"
  npc_override_ve_in_sura_i_guess_s_too_much_824fef: "我想那太多了……"
  npc_override_ve_in_sura_i_guess_you_re_ready_198cc8: "我想你还没准备好见师父……"
  npc_override_ve_in_sura_i_had_thought_i_strong_aa0107: "我曾以为自己足够强大，但看到你战斗后，我意识到我充满了自负。"
  npc_override_ve_in_sura_i_hate_those_noisy_impol_9da53c: "我讨厌那些吵闹无礼的客人！"
  npc_override_ve_in_sura_i_heard_he_wrote_letter_ffed24: "我听说他给那位已经去世的朋友写了一封信。"
  npc_override_ve_in_sura_i_hope_there_someone_who_f376e0: "我希望有人能帮我教训他们。"
  npc_override_ve_in_sura_i_hope_those_days_come_cd8bca: "我希望那些日子不会到来，但……我会甘愿成为幽灵，消灭所有敌人。"
  npc_override_ve_in_sura_i_i_m_really_sorry_c1f271: "我……我真的很抱歉，先生……"
  npc_override_ve_in_sura_i_keen_eyes_dc1537: "我有一双锐利的眼睛。"
  npc_override_ve_in_sura_i_ll_show_you_way_f1961c: "我给你带路。这边走。"
  npc_override_ve_in_sura_i_ll_take_you_right_5b8448: "我立刻带你去。"
  npc_override_ve_in_sura_i_m_here_hurt_you_8928eb: "我不是来伤害你的。"
  npc_override_ve_in_sura_i_really_appreciate_you_8dbc0b: "{0}，我真的很感谢你刚才帮了我。"
  npc_override_ve_in_sura_i_recommend_you_reconsid_fc4b23: "我建议你重新考虑成为修罗。"
  npc_override_ve_in_sura_i_should_cook_right_away_dbc6de: "我应该马上做饭，然后把饭菜送到旅馆去。啊~"
  npc_override_ve_in_sura_i_show_you_training_cour_9c488a: "我给你展示亡者的训练课程~"
  npc_override_ve_in_sura_i_something_ask_11eec7: "我有件事想问。"
  npc_override_ve_in_sura_i_steadily_practiced_mar_7b66e1: "我一直在稳步练习武术。"
  npc_override_ve_in_sura_i_think_you_already_know_dd80c9: "我想你已经知道了，但作为修罗生活并不会那么容易。"
  npc_override_ve_in_sura_i_think_you_know_e17363: "我想你会知道的"
  npc_override_ve_in_sura_i_thought_you_must_pract_abd653: "我以为你一定练习过武术，所以我来这里见你。"
  npc_override_ve_in_sura_i_ve_been_watching_you_f7a8f2: "我一直在看着你，像这里是你家一样大吵大闹。"
  npc_override_ve_in_sura_i_ve_never_seen_8d596d: "- 我从未见过这个 -"
  npc_override_ve_in_sura_i_want_know_about_skill_3eb1c2: "我想知道你刚才使用的那个技能。"
  npc_override_ve_in_sura_i_won_t_attack_first_bc7d6d: "我不会先攻击，因为我正在训练中。"
  npc_override_ve_in_sura_if_i_need_choose_job_8ba805: "如果我需要重新选择职业，我一定会选择修罗。"
  npc_override_ve_in_sura_if_s_okay_you_i_1d3d56: "如果可以的话，我能给你送饭吗？"
  npc_override_ve_in_sura_if_you_re_bored_may_3f1472: "如果你无聊的话，我可以给你带些杂志吗？"
  npc_override_ve_in_sura_if_you_still_don_t_198f36: "如果你还不知道住哪里，请使用^f57d7d这栋建筑上层的旅馆^000000。"
  npc_override_ve_in_sura_if_you_want_just_buy_57aad0: "如果你想的话，就去买更好的装备吧。"
  npc_override_ve_in_sura_impossible_human_cb49a6: "对人类来说是不可能的。"
  npc_override_ve_in_sura_isn_t_she_so_great_d34391: "她不是很厉害吗？"
  npc_override_ve_in_sura_just_because_you_re_girl_35f47d: "就因为你是女孩，不代表我会放过你。"
  npc_override_ve_in_sura_just_moment_isn_t_okay_193db0: "就一会儿，不行吗？"
  npc_override_ve_in_sura_just_slice_bread_warm_so_80f120: "只要一片面包和一碗热汤对我来说就够了。"
  npc_override_ve_in_sura_k_k_k_k_k_5ea336: "咔咔咔咔咔。够了。"
  npc_override_ve_in_sura_khh_ha_ha_ha_ha_765074: "咳哈哈哈哈哈哈。"
  npc_override_ve_in_sura_khhha_ha_ha_ha_ha_f89da2: "咳哈哈哈哈哈哈！！！！"
  npc_override_ve_in_sura_kind_skill_before_c0e1d4: "- 之前的某种技能…… -"
  npc_override_ve_in_sura_king_crab_i_follow_you_5024fb: "帝王蟹！！！我会永远追随你！！"
  npc_override_ve_in_sura_little_rookie_knocked_ou_b8cb74: "那个小菜鸟被我一拳就打倒了！"
  npc_override_ve_in_sura_loss_etiquette_situation_7678cc: "在这种情况下，这是失礼的行为。"
  npc_override_ve_in_sura_master_arrived_soon_i_ll_3d8295: "师父到了。我很快会带你进师父的房间。"
  npc_override_ve_in_sura_master_now_middle_traini_16de29: "师父现在正在训练中，你需要在客厅等大约5分钟。"
  npc_override_ve_in_sura_master_wolf_fur_coat_eaaff5: "师父！这是一件狼皮大衣。"
  npc_override_ve_in_sura_me_4e26f0: "我？"
  npc_override_ve_in_sura_menu_but_066986: "但我还是想了解更多。:好吧，那我放弃。"
  npc_override_ve_in_sura_menu_go_ad1df9: "去客厅。:去外面。"
  npc_override_ve_in_sura_menu_let_e129d1: "我们来聊聊。:去外面。"
  npc_override_ve_in_sura_menu_turn_baec22: "开启竞技场。:关闭竞技场。:开启客厅。:开启巴迪。:开启加拉。:全部关闭。:关闭"
  npc_override_ve_in_sura_menu_yes_141459: "是:否"
  npc_override_ve_in_sura_move_back_you_little_thi_7832ae: "退后，你这个小东西……"
  npc_override_ve_in_sura_msg_5a2bae: "........."
  npc_override_ve_in_sura_msg_61ce5a: "[{0}]"
  npc_override_ve_in_sura_msg_6eae3a: "..."
  npc_override_ve_in_sura_msg_93fcbf: "......"
  npc_override_ve_in_sura_msg_e95f89: "....."
  npc_override_ve_in_sura_my_colleague_buddy_train_6743b3: "我的同事^f57d7d巴迪^000000会在那个区域的中心附近训练自己。"
  npc_override_ve_in_sura_my_master_5f5cb5: "我的师父？"
  npc_override_ve_in_sura_my_master_doesn_t_like_912c11: "我的师父不喜欢噪音，所以请^f57d7d在客厅里安静地等待。^000000"
  npc_override_ve_in_sura_no_c03f1e: "不……"
  npc_override_ve_in_sura_now_customers_become_lit_fb17f0: "现在客人们变得安静了一些。"
  npc_override_ve_in_sura_oh_dear_32cd8f: "哦，天哪~"
  npc_override_ve_in_sura_oh_i_m_glad_hear_b3adcb: "哦，很高兴听到这个消息。"
  npc_override_ve_in_sura_oh_my_173337: "哦，天哪！！"
  npc_override_ve_in_sura_oh_no_f29ce4: "哦，不~"
  npc_override_ve_in_sura_oh_you_don_t_really_d7adde: "哦，你其实不需要的。"
  npc_override_ve_in_sura_okay_then_go_kill_desert_43bc33: "好吧，那^f57d7d去杀掉100只沙漠狼。^000000"
  npc_override_ve_in_sura_old_days_my_master_had_f04d3a: "很久以前，我的师父有一位亲密的朋友，但在成为修罗之后，"
  npc_override_ve_in_sura_once_i_also_ordinary_you_23fd0f: "曾经我也是一个普通的年轻人，游历四方，结识了许多朋友。"
  npc_override_ve_in_sura_one_more_cup_beer_here_e863ee: "再来一杯啤酒，这里！！！"
  npc_override_ve_in_sura_overstep_limit_efb7a7: "超越极限……"
  npc_override_ve_in_sura_place_where_you_stay_11834f: "这里不是你该待的地方。"
  npc_override_ve_in_sura_please_go_back_010110: "请回去。"
  npc_override_ve_in_sura_please_go_practice_some_af1a07: "请再去多练习一些。"
  npc_override_ve_in_sura_please_i_just_want_talk_30e9a9: "拜托，我只是想谈谈。"
  npc_override_ve_in_sura_please_wait_living_room_29700f: "请在上层的客厅等候。"
  npc_override_ve_in_sura_policy_master_so_please_d9af34: "这是师父的规定，所以请不要感到不快。"
  npc_override_ve_in_sura_promise_promise_502ecd: "承诺就是承诺。"
  npc_override_ve_in_sura_put_when_s_cold_6b65bb: "冷的时候穿上它。"
  npc_override_ve_in_sura_reason_why_i_keep_travel_1c1334: "我一直旅行的原因是为了寻找师父「珍贵的朋友」，而不是为了让自己变得更强。"
  npc_override_ve_in_sura_right_i_now_accept_you_2241f9: "好吧，我现在也接受你作为我的学生。"
  npc_override_ve_in_sura_rookie_d797f5: "菜鸟？！"
  npc_override_ve_in_sura_rookie_like_you_doesn_t_86a455: "…………像你这样的菜鸟不需要知道。"
  npc_override_ve_in_sura_s_big_deal_s_okay_2db0ce: "没什么大不了的。没关系。"
  npc_override_ve_in_sura_s_ghost_s_way_3a7b13: "这是幽灵的方式……"
  npc_override_ve_in_sura_s_just_my_master_1e0c79: "不是……不只是为了我的……师父！"
  npc_override_ve_in_sura_s_too_noisy_so_if_9962a3: "太吵了。所以如果你想再说那些废话，就回家吧。"
  npc_override_ve_in_sura_seeing_you_stood_me_up_b43508: "但看到你这样在外面放我鸽子……"
  npc_override_ve_in_sura_she_been_staying_village_fad136: "她已经在这个村子里待了好几天，"
  npc_override_ve_in_sura_so_please_get_down_your_a77d8d: "所以……请从你的骑乘宠物上下来！"
  npc_override_ve_in_sura_so_you_beat_me_too_2dfb0d: "所以你能打败我，是吗？"
  npc_override_ve_in_sura_sob_sob_719ed6: "呜……呜……"
