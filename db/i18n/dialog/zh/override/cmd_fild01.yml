Body:

  npc_override_cmd_fild01_quest_alligator_after_you_lost_some_weig_b89d61: "等你减轻一些负重后再来。"
  npc_override_cmd_fild01_quest_alligator_ah_ok_i_think_you_5f4b32: "啊，好的，我想你可以帮我猎杀一些短吻鳄。"
  npc_override_cmd_fild01_quest_alligator_amazing_you_did_speed_6cc3cd: "太厉害了，你做得很快。"
  npc_override_cmd_fild01_quest_alligator_any_progress_you_ve_made_b3e247: "你取得的任何进展都将被清除"
  npc_override_cmd_fild01_quest_alligator_armor_creators_around_wo_4b5de9: "全世界的防具制造者都在 clamoring 要它们。"
  npc_override_cmd_fild01_quest_alligator_come_back_when_you_ve_44350c: "完成任务后回来，我会给你一个小奖励。"
  npc_override_cmd_fild01_quest_alligator_hey_looks_like_weight_7817f7: "嘿，看起来"
  npc_override_cmd_fild01_quest_alligator_hmm_i_don_t_think_1d8eb5: "嗯，我觉得你还没猎杀到 100 只……"
  npc_override_cmd_fild01_quest_alligator_hmm_i_don_t_think_2144d7: "嗯，我觉得你还没猎杀到 50 只……"
  npc_override_cmd_fild01_quest_alligator_hmm_i_don_t_think_5d960b: "嗯，我觉得你还没猎杀到 150 只……"
  npc_override_cmd_fild01_quest_alligator_how_d_you_like_help_4fe5c6: "你愿意帮我吗？"
  npc_override_cmd_fild01_quest_alligator_how_many_you_like_hunt_7fc82d: "你想猎杀多少只？"
  npc_override_cmd_fild01_quest_alligator_i_hope_you_continue_help_411cdb: "希望你能继续帮我收集这些皮。"
  npc_override_cmd_fild01_quest_alligator_i_know_gator_skin_when_371e18: "我认得短吻鳄皮，但我没看到^00CE0020 阿诺利安皮^000000。"
  npc_override_cmd_fild01_quest_alligator_i_need_anolian_skins_4a10ae: "我需要^00CE0020 阿诺利安皮^000000。"
  npc_override_cmd_fild01_quest_alligator_i_sent_here_minimize_all_46f8d4: "我被派来这里减少短吻鳄的数量，但这项任务对我来说独自完成相当困难。"
  npc_override_cmd_fild01_quest_alligator_if_you_bring_me_anolian_842bee: "如果你能给我带来^00CC0020 阿诺利安皮^000000，我会帮你变得更强。"
  npc_override_cmd_fild01_quest_alligator_if_you_change_your_mind_3f2210: "如果你改变主意，请回来。"
  npc_override_cmd_fild01_quest_alligator_menu_alligators_a36bce: "50 只短吻鳄:100 只短吻鳄:150 只短吻鳄"
  npc_override_cmd_fild01_quest_alligator_menu_gather_398d44: "收集道具:猎杀短吻鳄:取消"
  npc_override_cmd_fild01_quest_alligator_menu_i_56192a: "我有阿诺利安皮:短吻鳄咬人！"
  npc_override_cmd_fild01_quest_alligator_menu_sure_859d29: "当然:不"
  npc_override_cmd_fild01_quest_alligator_menu_yes_141459: "是:否"
  npc_override_cmd_fild01_quest_alligator_menu_yes_755efb: "是:否:我想退出"
  npc_override_cmd_fild01_quest_alligator_ok_then_well_come_back_0e1574: "那么好吧，如果你改变主意就回来这里。"
  npc_override_cmd_fild01_quest_alligator_perhaps_when_you_stronge_466b18: "也许等你更强壮了，你和我就可以做生意了。"
  npc_override_cmd_fild01_quest_alligator_please_kill_alligators_111295: "请猎杀 150 只短吻鳄。"
  npc_override_cmd_fild01_quest_alligator_please_kill_alligators_ab1814: "请猎杀 50 只短吻鳄。"
  npc_override_cmd_fild01_quest_alligator_please_kill_alligators_f9a63b: "请猎杀 100 只短吻鳄。"
  npc_override_cmd_fild01_quest_alligator_remember_i_need_help_hun_1cbd5b: "记住，我需要帮忙猎杀短吻鳄，去猎杀 100 只。"
  npc_override_cmd_fild01_quest_alligator_remember_i_need_help_hun_a7914f: "记住，我需要帮忙猎杀短吻鳄，去猎杀 50 只。"
  npc_override_cmd_fild01_quest_alligator_remember_i_need_help_hun_e87c1f: "记住，我需要帮忙猎杀短吻鳄，去猎杀 150 只。"
  npc_override_cmd_fild01_quest_alligator_thank_you_anolian_skins_b62e2b: "谢谢你带来^00CE0020 阿诺利安皮^000000！"
  npc_override_cmd_fild01_quest_alligator_which_you_like_b5c977: "你想做哪个？"
  npc_override_cmd_fild01_quest_alligator_you_certainly_brave_brav_a12e2b: "你确实很勇敢，但如果你继续向东走，勇敢就会变成愚蠢。"
  npc_override_cmd_fild01_quest_alligator_you_finished_hunting_all_219bcd: "你完成猎杀 50 只短吻鳄了吗？"
  npc_override_cmd_fild01_quest_alligator_you_finished_hunting_all_53545d: "你完成猎杀 150 只短吻鳄了吗？"
  npc_override_cmd_fild01_quest_alligator_you_help_me_out_either_c2e176: "你可以通过猎杀短吻鳄或为我收集道具来帮助我。"
  npc_override_cmd_fild01_quest_alligator_you_look_like_sturdy_adv_39b561: "你看起来像个结实的冒险者！"
  npc_override_cmd_fild01_quest_alligator_you_sure_you_want_stop_507e20: "你确定要停止猎杀吗？"
  npc_override_cmd_fild01_quest_alligator_you_too_powerful_task_i_dc8b5b: "你对这个任务来说太强大了，我需要完好无损的皮，不是炸烂的！"
  npc_override_cmd_fild01_quest_alligator_your_back_crush_you_come_d8fffe: "你的背会压垮你的。回来"
