Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job3_arch02_archbishop_actually_i_started_bad_d_48a15f: "其实从我被任命那天起就开始做噩梦了。"
  npc_override_job3_arch02_archbishop_admire_odin_s_omniscienc_743a1f: "赞美Odin的全知全能，祈求赐予选择正确道路的智慧。"
  npc_override_job3_arch02_archbishop_after_finishing_all_thes_21e02e: "完成所有这些祈祷后，以虔诚的心态站起来。"
  npc_override_job3_arch02_archbishop_after_making_your_pilgri_0c02ba: "朝圣结束后，我们一起喝一杯，谈谈你的经历吧。"
  npc_override_job3_arch02_archbishop_after_you_finish_song_yo_1f340c: "- 唱完圣歌后，你感到轻松而充满力量，信仰充沛。 -"
  npc_override_job3_arch02_archbishop_after_you_summon_my_impe_33b1e9: "召唤我的分身后，你必须找到^3131FF破损的笛子^000000。"
  npc_override_job3_arch02_archbishop_ah_971301: "啊……"
  npc_override_job3_arch02_archbishop_ah_archbishop_33de03: "啊！一位大主教。"
  npc_override_job3_arch02_archbishop_ah_i_go_back_asgard_39c4c0: "啊！我可以回到Asgard了！"
  npc_override_job3_arch02_archbishop_ah_i_m_resentful_so_965f89: "啊，我好怨恨！好后悔！"
  npc_override_job3_arch02_archbishop_ah_i_m_so_worried_b85b91: "啊……我好担心...."
  npc_override_job3_arch02_archbishop_ah_priest_dayan_ca2924: "啊，Dayan牧师。"
  npc_override_job3_arch02_archbishop_ah_welcome_be5d4c: "啊，欢迎。"
  npc_override_job3_arch02_archbishop_ah_yes_83ae92: "啊~，是的。"
  npc_override_job3_arch02_archbishop_all_ministers_odin_shoul_bee8fe: "所有Odin的侍者都应该勤奋。他们绝不应该懒惰于侍奉Odin。"
  npc_override_job3_arch02_archbishop_also_they_bless_you_beca_debf7a: "^3131FF而且他们也会祝福你，因为你是战胜苦难的欢乐存在。我们称之为圣水祈祷(Aspersio)^000000。"
  npc_override_job3_arch02_archbishop_anguhilde_valkyrie_who_d_86c68f: "Anguhilde是一位很久以前就死去的瓦尔基里。"
  npc_override_job3_arch02_archbishop_anyway_i_feel_my_energy_4becd8: "不管怎样，我感觉力量正在恢复。"
  npc_override_job3_arch02_archbishop_anyway_why_you_come_here_994c27: "不管怎样，你为什么来这里？"
  npc_override_job3_arch02_archbishop_aren_t_you_priest_dayan_4b2546: "你不是Dayan牧师吗？"
  npc_override_job3_arch02_archbishop_as_easy_as_i_expected_c785ef: "这并不像我想象的那么容易。"
  npc_override_job3_arch02_archbishop_as_time_went_dream_becam_084a3b: "但是，随着时间推移，梦境变得越来越可怕。现在瓦尔基里被锁链束缚，最终被砸成碎片。"
  npc_override_job3_arch02_archbishop_as_you_rid_yourself_pain_c9ddcb: "当你摆脱痛苦时，你的心灵会少受折磨，当你帮助和安慰他人时，你会体验到生命的喜悦。"
  npc_override_job3_arch02_archbishop_asgard_world_gods_there_7102c3: "而在Asgard，众神的世界，有圣言之泉。"
  npc_override_job3_arch02_archbishop_aspersio_bf43b7: "- * 圣水祈祷！ * -"
  npc_override_job3_arch02_archbishop_assistance_odin_soldiers_fb4ce7: "Odin的援助！Valhalla的战士们！"
  npc_override_job3_arch02_archbishop_battle_finished_yet_5ff3f5: "但战斗还没有结束。"
  npc_override_job3_arch02_archbishop_because_close_battle_i_c_74db99: "因为一场激烈的战斗，我只能获得一点点能量。"
  npc_override_job3_arch02_archbishop_been_long_time_since_i_714037: "好久没见过如此虔诚的侍者了。"
  npc_override_job3_arch02_archbishop_big_tree_called_yggdrasi_13283c: "那棵大树叫做^3131FF世界树Yggdrasil^000000。"
  npc_override_job3_arch02_archbishop_blessing_91cdb1: "- * 祝福！ * -"
  npc_override_job3_arch02_archbishop_booo_94de6f: "呼—— —— —— ——"
  npc_override_job3_arch02_archbishop_booo_af877b: "呼—— —— ——"
  npc_override_job3_arch02_archbishop_chord_crashes_out_spring_8d96d6: "在Hvergelmir之泉中突然响起和弦，瀑布声给你带来清新的感觉。-"
  npc_override_job3_arch02_archbishop_come_challenge_again_d58bc3: "- 再来挑战吧。 -"
  npc_override_job3_arch02_archbishop_course_i_m_staying_midga_3eb39c: "当然我住在Midgard，但我们受制于无法共存于这个世界的命运。"
  npc_override_job3_arch02_archbishop_curdan_bird_which_sits_b_b168aa: "~栖息在树枝上的Curdan鸟带给我全世界的智慧。~"
  npc_override_job3_arch02_archbishop_curdan_wolf_protects_me_f6b9e8: "~Curdan之狼保护我免受世界上一切威胁。~"
  npc_override_job3_arch02_archbishop_dangerous_so_let_s_go_c6e628: "这可能很危险，所以我们回去吧。"
  npc_override_job3_arch02_archbishop_descendants_heimdal_gath_6cf7a6: "~Heimdal的后裔聚集在梣树Yggdrasil下。~"
  npc_override_job3_arch02_archbishop_devil_always_makes_effor_3e9251: "魔鬼总是在努力煽动人们的心灵。"
  npc_override_job3_arch02_archbishop_devils_removed_other_val_a29b44: "正如你所愿，其他瓦尔基里已经驱除了魔鬼。"
  npc_override_job3_arch02_archbishop_did_you_collect_all_piec_8784ea: "你收集齐了我的号角笛子的所有碎片吗？"
  npc_override_job3_arch02_archbishop_did_you_find_rest_pieces_16b9f7: "你找到其余的碎片了吗？"
  npc_override_job3_arch02_archbishop_did_you_find_vinue_hugel_5ac7de: "你在Hugel找到Vinue了吗？她怎么样了？"
  npc_override_job3_arch02_archbishop_did_you_finish_preparing_992d25: "{0} 你准备好修行之路了吗？"
  npc_override_job3_arch02_archbishop_did_you_meet_priest_daya_a37836: "你在Umbala见到Dayan牧师了吗？"
  npc_override_job3_arch02_archbishop_didn_t_you_see_shrine_857311: "你没看到被魔鬼覆盖的神殿吗？"
  npc_override_job3_arch02_archbishop_don_t_afraid_pain_necess_b422a6: "不要害怕痛苦。那是必要的，也是进入解脱过去伤口之路的第一步。"
  npc_override_job3_arch02_archbishop_don_t_forget_altruistic_986197: "永远不要忘记今天这样无私的侍者精神。"
  npc_override_job3_arch02_archbishop_don_t_make_hasty_general_11567d: "不要急于下结论。"
  npc_override_job3_arch02_archbishop_don_t_worry_11a843: "但别担心。"
  npc_override_job3_arch02_archbishop_don_t_worry_anguhilde_e1371e: "别担心，Anguhilde。"
  npc_override_job3_arch02_archbishop_don_t_worry_ffc806: "别担心。"
  npc_override_job3_arch02_archbishop_dream_related_evil_odin_398965: "这个梦与Odin神殿中的邪恶有关吗？"
  npc_override_job3_arch02_archbishop_eh_say_what_d07814: "嗯？你说什么？"
  npc_override_job3_arch02_archbishop_eh_you_6036ad: "嗯……你是？"
  npc_override_job3_arch02_archbishop_enter_correct_password_6408fa: "输入正确的密码！"
  npc_override_job3_arch02_archbishop_enter_yggdrasil_76dc09: "进入世界树Yggdrasil。"
  npc_override_job3_arch02_archbishop_entrust_me_dfe21f: "交给我吧。"
  npc_override_job3_arch02_archbishop_even_though_s_different_f9932b: "虽然与现实不同，但现在她也许能够安息了。"
  npc_override_job3_arch02_archbishop_even_though_we_serve_odi_1c27f5: "即使我们侍奉Odin，我们也是普通人。"
  npc_override_job3_arch02_archbishop_even_though_you_expelled_fe4d1d: "即使你之前因为事件被驱逐，Odin说他正在重新考虑你的流放。"
  npc_override_job3_arch02_archbishop_evil_always_watching_our_950d34: "邪恶总是在窥视我们的灵魂。"
  npc_override_job3_arch02_archbishop_fact_i_t_anything_my_5d6758: "事实上，我现在这副身体什么也做不了。"
  npc_override_job3_arch02_archbishop_father_light_poet_wisdom_d78724: "~光明之父，智慧之诗人，为我歌唱。~"
  npc_override_job3_arch02_archbishop_feel_coldness_pitch_blac_61a32d: "感受漆黑冰冷的黑暗。"
  npc_override_job3_arch02_archbishop_feel_free_ask_me_about_801313: "^3131FF随时问我如何祈祷^000000。"
  npc_override_job3_arch02_archbishop_feel_free_visit_here_whe_3ecc07: "想祈祷的时候随时来这里，{0}"
  npc_override_job3_arch02_archbishop_feel_free_visit_me_if_48e4f5: "如果你改变主意，随时来看我。"
  npc_override_job3_arch02_archbishop_finally_we_finished_all_1492a3: "我们终于完成了所有准备。"
  npc_override_job3_arch02_archbishop_first_dream_valkyrie_sad_0a9f20: "起初，是一个关于瓦尔基里悲伤地处于黑暗中的梦。"
  npc_override_job3_arch02_archbishop_follow_your_steps_purpos_9b4fc9: "带着目标跟随你的脚步。"
  npc_override_job3_arch02_archbishop_fountain_pours_out_end_y_c04dbe: "从Yggdrasil树根蔓延到每个世界末端的泉眼喷涌而出。"
  npc_override_job3_arch02_archbishop_front_almighty_god_odin_666bfe: "在全能之神Odin面前，"
  npc_override_job3_arch02_archbishop_globalvar_924ed9: "全局变量是"
  npc_override_job3_arch02_archbishop_go_there_find_priest_day_3371b6: "去那里找到Dayan牧师。"
  npc_override_job3_arch02_archbishop_haha_you_going_help_me_56afc1: "哈哈！你要帮我吗？！"
  npc_override_job3_arch02_archbishop_hahahahaha_66c02c: "哈哈哈哈。"
  npc_override_job3_arch02_archbishop_hanging_down_like_bird_h_e4b7e2: "像被剪掉翅膀的鸟一样垂下。"
  npc_override_job3_arch02_archbishop_he_asks_you_go_holy_db722b: "他要求你去进行神圣朝圣。"
  npc_override_job3_arch02_archbishop_he_cups_his_ears_towards_dbe034: "他用手拢着耳朵朝向你。"
  npc_override_job3_arch02_archbishop_he_good_ee8ad6: "他好吗？"
  npc_override_job3_arch02_archbishop_he_s_very_kind_as_5c37ed: "他很善良。你也是，{0}。"
  npc_override_job3_arch02_archbishop_he_s_very_old_so_dee421: "他很老了所以听力不好。"
  npc_override_job3_arch02_archbishop_he_so_cute_even_though_9c5598: "他虽然老了但还是很可爱。"
  npc_override_job3_arch02_archbishop_he_told_me_he_worried_70ef7b: "他告诉我他很担心，因为上次见到你时，你看起来很悲伤。"
  npc_override_job3_arch02_archbishop_he_turns_his_head_toward_ead6ce: "他把头转向你。"
  npc_override_job3_arch02_archbishop_heavens_sound_pipes_spre_a5b340: "天堂中笛声传开，但无法飞翔的鸟在地上爬行，最终被碾成碎片。"
  npc_override_job3_arch02_archbishop_hello_you_priest_dayan_5c8461: "你好。你是…… Dayan牧师吗？"
  npc_override_job3_arch02_archbishop_here_illusion_anguhilde_34d32c: "这里是不愿被认出的Anguhilde的幻象。"
  npc_override_job3_arch02_archbishop_hmm_i_wanted_tell_you_afccdc: "嗯，我想告诉你……"
  npc_override_job3_arch02_archbishop_hmm_so_6fb380: "嗯……所以……"
  npc_override_job3_arch02_archbishop_hmm_someone_battling_dev_0414b8: "嗯，有人正在神殿里与魔鬼战斗。"
  npc_override_job3_arch02_archbishop_hmm_what_did_priest_say_5d7710: "嗯，那个牧师对我说了什么？"
  npc_override_job3_arch02_archbishop_hmm_what_first_way_2c6bb1: "嗯……第一种方式是什么？"
  npc_override_job3_arch02_archbishop_hohohoho_e8e33b: "呵呵呵呵。"
  npc_override_job3_arch02_archbishop_holy_ceremony_brighten_y_ba30c6: "这个神圣仪式将照亮你的灵魂。"
  npc_override_job3_arch02_archbishop_holy_pilgrimage_isn_t_di_9a28b0: "神圣朝圣并没有那么难。"
  npc_override_job3_arch02_archbishop_holy_pilgrimage_means_go_3e9c78: "神圣朝圣意味着前往圣地向众神之神Odin祈求庇护和恩典。"
  npc_override_job3_arch02_archbishop_holy_place_god_odin_tain_f969cc: "众神之神Odin的圣地被黑暗玷污了！"
  npc_override_job3_arch02_archbishop_holy_shrine_tainted_devi_2b0f2a: "神圣神殿被魔鬼玷污了。"
  npc_override_job3_arch02_archbishop_honor_odin_6d6197: "荣耀归于Odin！"
  npc_override_job3_arch02_archbishop_host_ballascalf_rise_up_24538b: "~盛宴之主，从座位上站起来。全世界欢呼。~"
  npc_override_job3_arch02_archbishop_host_glittering_glass_gi_b2a454: "~闪耀之杯的主人，给我神圣的预言。~"
  npc_override_job3_arch02_archbishop_how_i_8e6ebf: "我该怎么做？"
  npc_override_job3_arch02_archbishop_how_i_become_like_cef9a2: "我怎样才能变成那样？"
  npc_override_job3_arch02_archbishop_how_i_get_odin_shrine_5828df: "我怎么去Odin神殿？"
  npc_override_job3_arch02_archbishop_how_long_i_under_dishono_ecf622: "我要在这可耻的命运下忍受多久！"
  npc_override_job3_arch02_archbishop_how_s_going_8e2ed1: "进展如何？"
  npc_override_job3_arch02_archbishop_huh_73fef0: "嗯？"
  npc_override_job3_arch02_archbishop_huhuhuhu_humhum_8d01cb: "呼呼呼呼。哼哼。"
  npc_override_job3_arch02_archbishop_hum_3f61e8: "嗯？"
  npc_override_job3_arch02_archbishop_hum_well_c5d9f0: "嗯……好吧。"
  npc_override_job3_arch02_archbishop_human_answer_me_you_here_ee5540: "人类，回答我。你是真心来帮助我的吗？"
  npc_override_job3_arch02_archbishop_human_valkyries_your_deb_6c3a02: "人类，瓦尔基里欠你一份人情。谢谢你。"
  npc_override_job3_arch02_archbishop_huuuuuu_358014: "呼......"
  npc_override_job3_arch02_archbishop_i_already_expelled_asgar_b24398: "我已经被驱逐出Asgard了。"
  npc_override_job3_arch02_archbishop_i_came_here_say_hello_b8ca30: "我来替Prontera的Dayan牧师问好。"
  npc_override_job3_arch02_archbishop_i_confess_my_guilt_almig_9c4204: "我向全能之神Odin忏悔我的罪过。"
  npc_override_job3_arch02_archbishop_i_disgraced_island_impor_314a52: "我蒙受了耻辱，这座岛屿作为Odin和众神殿宇的重要地位。"
  npc_override_job3_arch02_archbishop_i_don_t_any_energy_eb0514: "我没有任何力量支撑自己，所以别无选择只能信任你。"
  npc_override_job3_arch02_archbishop_i_don_t_any_way_b8f51c: "我没有任何方法可以找到答案。"
  npc_override_job3_arch02_archbishop_i_don_t_know_why_36b73f: "我不知道他们为什么来这里，也不知道他们从哪里来。"
  npc_override_job3_arch02_archbishop_i_don_t_method_so_d52b4e: "我没有办法，所以只能祈祷。"
  npc_override_job3_arch02_archbishop_i_don_t_think_so_a189ca: "我不这么认为。"
  npc_override_job3_arch02_archbishop_i_feel_air_around_me_ee4f92: "我能感觉到周围的空气变得不纯净了。"
  npc_override_job3_arch02_archbishop_i_feel_full_grace_e9fe91: "我感到充满恩典。"
  npc_override_job3_arch02_archbishop_i_feel_light_hearted_lik_a5ac69: "我感到心情轻松。就像刚重生一样……"
  npc_override_job3_arch02_archbishop_i_feel_refreshed_2d8822: "我感到精神焕发。"
  npc_override_job3_arch02_archbishop_i_feel_you_fresh_energy_825c28: "我能感觉到你有一种新鲜的能量。"
  npc_override_job3_arch02_archbishop_i_forgot_wear_my_hearing_1083d7: "我忘记戴助听器了。嘿嘿。"
  npc_override_job3_arch02_archbishop_i_give_you_necklace_as_c11c4f: "我给你一条项链作为礼物。"
  npc_override_job3_arch02_archbishop_i_guess_i_should_go_7c76fd: "我想我应该回到Dayan牧师那里。"
  npc_override_job3_arch02_archbishop_i_harmed_freki_one_odin_bed8d9: "但我伤害了Odin的狼之一Freki，我被驱逐出Asgard，没有任何能量，作为瓦尔基里被命令保护这座岛屿。"
  npc_override_job3_arch02_archbishop_i_hope_air_yggdrasil_hel_b46d28: "我希望世界树Yggdrasil的气息能对她有所帮助。"
  npc_override_job3_arch02_archbishop_i_hope_my_prayer_weaken_90f0b2: "我希望我的祈祷能减轻你的痛苦……"
  npc_override_job3_arch02_archbishop_i_hope_odin_gives_you_603881: "我希望Odin也能给予你他的庇护。"
  npc_override_job3_arch02_archbishop_i_hope_paves_way_you_86e9c2: "我希望这能为你在Odin的光辉中生活铺平道路。"
  npc_override_job3_arch02_archbishop_i_hope_we_see_each_718d70: "我希望我们能在Valhalla再见。"
  npc_override_job3_arch02_archbishop_i_hope_you_give_happines_675465: "我希望你在冒险中给人们带来幸福与荣耀。"
  npc_override_job3_arch02_archbishop_i_hope_you_good_time_9a5eae: "我希望你在Hugel的节日过得愉快。"
  npc_override_job3_arch02_archbishop_i_knew_i_couldn_t_420802: "我就知道我不能相信人类！"
  npc_override_job3_arch02_archbishop_i_know_you_bent_over_d10328: "我知道你竭尽全力帮助我，但没有2块号角笛子碎片我什么都做不了。"
  npc_override_job3_arch02_archbishop_i_ll_always_here_you_625d3a: "我会永远在这里等你。"
  npc_override_job3_arch02_archbishop_i_ll_complete_broken_hor_703c99: "我会修复破损的号角笛子！"
  npc_override_job3_arch02_archbishop_i_ll_go_back_my_9656aa: "我要回去祈祷了。"
  npc_override_job3_arch02_archbishop_i_ll_go_meet_her_efd0c5: "我去见她。"
  npc_override_job3_arch02_archbishop_i_ll_never_forget_your_4c658b: "我永远不会忘记你的温暖心意。"
  npc_override_job3_arch02_archbishop_i_ll_pray_darkness_stays_b7eb1c: "我会祈祷黑暗远离。"
  npc_override_job3_arch02_archbishop_i_ll_pray_your_safe_0c0037: "我会祈祷你平安归来。"
  npc_override_job3_arch02_archbishop_i_m_dayan_nice_meet_c68de9: "我是Dayan。很高兴见到你{0}"
  npc_override_job3_arch02_archbishop_i_m_going_give_new_86db10: "我要给你一份^3131FF新的古代卷轴^000000。"
  npc_override_job3_arch02_archbishop_i_m_going_give_you_dc58c7: "我要给你一份用古代语言书写的纸卷。"
