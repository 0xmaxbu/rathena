Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_in_orcs01_2008_headgears_adventurer_weapon_helps_f23c21: "带武器的冒险者帮助兽人？"
  npc_override_in_orcs01_2008_headgears_after_work_done_ok_519533: "等工作做完之后……好吗？"
  npc_override_in_orcs01_2008_headgears_ah_i_m_sure_time_37b740: "啊，这次我不确定。我下次再来。"
  npc_override_in_orcs01_2008_headgears_ah_never_mind_9466b9: "啊，别在意那个。"
  npc_override_in_orcs01_2008_headgears_ah_s_too_bad_b5e7cf: "..啊……太遗憾了。"
  npc_override_in_orcs01_2008_headgears_anybody_who_comes_here_t_d1269b: "任何来到这里的人……他们都是来伤害野玫瑰的……"
  npc_override_in_orcs01_2008_headgears_as_she_says_myu_slides_a1f0bc: "当她这么说的时候，缪滑动了她的脖子，模仿割喉的动作。"
  npc_override_in_orcs01_2008_headgears_basic_yellow_70822a: "基础黄色！"
  npc_override_in_orcs01_2008_headgears_brides_wear_corollas_40ff71: "新娘……戴……花冠……"
  npc_override_in_orcs01_2008_headgears_bring_me_cute_ribbon_if_926a19: "如果你想染色，给我带一个可爱缎带来。"
  npc_override_in_orcs01_2008_headgears_bring_me_e07986: "给我带来……"
  npc_override_in_orcs01_2008_headgears_cool_blue_414d88: "酷蓝色！！"
  npc_override_in_orcs01_2008_headgears_course_don_t_worry_about_784709: "当然！不用担心那个~"
  npc_override_in_orcs01_2008_headgears_course_i_won_t_fail_09bd49: "当然，我不会失败的。"
  npc_override_in_orcs01_2008_headgears_course_take_care_those_k_b782d8: "当然要照顾好那些哥布林弓箭手喵！"
  npc_override_in_orcs01_2008_headgears_cute_red_e998fb: "可爱红色！"
  npc_override_in_orcs01_2008_headgears_d_good_chance_me_practic_036e8b: "这对我来说是一个很好的练习机会，"
  npc_override_in_orcs01_2008_headgears_did_color_came_out_nicel_0ee106: "这个颜色染得好看吗？"
  npc_override_in_orcs01_2008_headgears_did_you_think_i_didn_e2781a: "你以为我不知道你做了什么吗？"
  npc_override_in_orcs01_2008_headgears_elgo_starts_dissolve_dye_0a03f3: "- 埃尔戈开始将染料和化学品溶解在水中，然后开始染可爱缎带。 -"
  npc_override_in_orcs01_2008_headgears_exactly_times_no_more_no_eedca5: "正好1,000次，不多不少。"
  npc_override_in_orcs01_2008_headgears_fruitless_effort_meow_c60485: "……一切都是徒劳的喵……"
  npc_override_in_orcs01_2008_headgears_give_them_times_despair_d238ee: "给他们1,000次绝望！"
  npc_override_in_orcs01_2008_headgears_give_them_warnings_they_b40ac0: "给他们1,000次警告，他们就会退缩。"
  npc_override_in_orcs01_2008_headgears_got_i_go_bring_back_1f98c3: "明白了。我去把材料带回来。"
  npc_override_in_orcs01_2008_headgears_her_mouth_looks_like_s_5ae2a8: "她的嘴看起来像是在说。"
  npc_override_in_orcs01_2008_headgears_here_take_344723: "来，拿着这个。"
  npc_override_in_orcs01_2008_headgears_hmm_c46910: "..嗯……"
  npc_override_in_orcs01_2008_headgears_hmm_hmm_i_told_you_30a60b: "嗯嗯，我告诉过你别在意那个。"
  npc_override_in_orcs01_2008_headgears_hmm_i_bring_you_one_647156: "嗯，我下次给你带一个。"
  npc_override_in_orcs01_2008_headgears_hmph_yeah_kinda_funny_hu_6cbaba: "哼，是啊，有点好笑，哈。"
  npc_override_in_orcs01_2008_headgears_homeland_those_who_walk_430058: "那些在阴影中行走、低调行事者的故乡。"
  npc_override_in_orcs01_2008_headgears_how_impudent_i_tried_tal_be63b3: "多么无礼。我试图以和平的方式与他们交谈，甚至与他们战斗，但都无济于事。"
  npc_override_in_orcs01_2008_headgears_how_just_how_could_you_a2c49a: "怎么……你怎么能杀死那些珍贵的孩子……？"
  npc_override_in_orcs01_2008_headgears_how_should_i_react_487abd: "我该如何反应？"
  npc_override_in_orcs01_2008_headgears_hu_i_spell_out_you_167bb5: "呼~我需要给你拼出来吗？"
  npc_override_in_orcs01_2008_headgears_huh_73fef0: "嗯？"
  npc_override_in_orcs01_2008_headgears_i_cute_ribbon_what_shoul_15dec7: "（我有一个可爱缎带……该怎么办……？）"
  npc_override_in_orcs01_2008_headgears_i_don_t_know_what_3b7477: "我不知道她在做什么……但即使我走到她面前，她也不会注意到我。"
  npc_override_in_orcs01_2008_headgears_i_dye_small_things_reall_3ab59f: "我可以把小的东西染得很漂亮……"
  npc_override_in_orcs01_2008_headgears_i_failed_notice_566d2a: "我没能注意到。"
  npc_override_in_orcs01_2008_headgears_i_m_making_corolla_860e0a: "我在做花冠。"
  npc_override_in_orcs01_2008_headgears_i_mean_meow_er_1fcd8b: "我是说……喵……呃……"
  npc_override_in_orcs01_2008_headgears_i_need_get_back_work_0b6392: "我需要回去工作了……"
  npc_override_in_orcs01_2008_headgears_i_need_silk_ribbon_2a3a9f: "我需要……丝绸……缎带。"
  npc_override_in_orcs01_2008_headgears_i_nodded_goodbye_her_smi_956d72: "我微笑着向她点头告别，什么也没说。"
  npc_override_in_orcs01_2008_headgears_i_put_all_my_efforts_ac9689: "我会全力以赴。"
  npc_override_in_orcs01_2008_headgears_i_want_challenge_my_skil_f11cab: "我想挑战我的技能！！"
  npc_override_in_orcs01_2008_headgears_if_you_manage_i_give_16b72d: "如果你能做到，我会给你一样我非常珍爱的东西。"
  npc_override_in_orcs01_2008_headgears_if_you_s_all_over_33af74: "如果你这样做，你就完了。"
  npc_override_in_orcs01_2008_headgears_if_you_want_dye_blue_825a59: "如果你想染成蓝色，给我带^4d4dff1个蓝色染料^000000。"
  npc_override_in_orcs01_2008_headgears_if_you_want_dye_green_a28e5f: "如果你想染成绿色，给我带^4d4dff1个绿色染料^000000。"
  npc_override_in_orcs01_2008_headgears_if_you_want_dye_red_53a51f: "如果你想染成红色，给我带^4d4dff1个红色染料^000000。"
  npc_override_in_orcs01_2008_headgears_if_you_want_dye_white_bce175: "如果你想染成白色，给我带^4d4dff1个白色染料^000000。"
  npc_override_in_orcs01_2008_headgears_if_you_want_dye_yellow_f537e6: "如果你想染成黄色，给我带^4d4dff1个黄色染料^000000。"
  npc_override_in_orcs01_2008_headgears_just_keep_your_promises_f19c22: "只要遵守你的承诺。"
  npc_override_in_orcs01_2008_headgears_let_s_34e6ca: "我们开始吧！"
  npc_override_in_orcs01_2008_headgears_let_s_run_away_while_2cf605: "趁她还在震惊中，我们快跑吧。"
  npc_override_in_orcs01_2008_headgears_like_handkerchiefs_ribbo_3046b1: "比如手帕，或者缎带。"
  npc_override_in_orcs01_2008_headgears_maneater_blossom_fell_gr_08ccf6: "一朵食人花从她手中掉落到地上。"
  npc_override_in_orcs01_2008_headgears_maneater_blossoms_107852: "1,000朵食人花……"
  npc_override_in_orcs01_2008_headgears_materials_you_687f3e: "..材料……你……有……"
  npc_override_in_orcs01_2008_headgears_menu_and_1ce0d6: "你究竟在做什么？:我明白了。"
  npc_override_in_orcs01_2008_headgears_menu_ask_05730d: "让埃尔戈染色。:别管它了。"
  npc_override_in_orcs01_2008_headgears_menu_ask_6e2a08: "问她刚才在做什么。:说再见。"
  npc_override_in_orcs01_2008_headgears_menu_isn_d60937: "那不是太多了吗？:那很简单"
  npc_override_in_orcs01_2008_headgears_menu_no_8e8d9b: "不！:当然。"
  npc_override_in_orcs01_2008_headgears_menu_pick_4418ca: "为兽人女士捡起花！:快跑！"
  npc_override_in_orcs01_2008_headgears_menu_that_b40611: "听起来很麻烦……:我该怎么办？"
  npc_override_in_orcs01_2008_headgears_menu_white_195510: "白色:蓝色:黄色:绿色"
  npc_override_in_orcs01_2008_headgears_menu_white_3076cd: "白色:蓝色:红色:黄色"
  npc_override_in_orcs01_2008_headgears_menu_white_55f34e: "白色:蓝色:红色:绿色"
  npc_override_in_orcs01_2008_headgears_menu_white_884431: "白色:黄色:红色:绿色"
  npc_override_in_orcs01_2008_headgears_menu_yellow_b24bd1: "黄色:蓝色:红色:绿色"
  npc_override_in_orcs01_2008_headgears_menu_yellow_e60d81: "黄色的……:白色的……:蓝色的……:红色的……:绿色的……:算了。"
  npc_override_in_orcs01_2008_headgears_meow_274b9f: "（喵！）"
  npc_override_in_orcs01_2008_headgears_meow_3d1c36: "（喵……）"
  npc_override_in_orcs01_2008_headgears_meow_7dcd9b: "喵……"
  npc_override_in_orcs01_2008_headgears_meow_again_135d88: "又喵？！"
  npc_override_in_orcs01_2008_headgears_meow_again_what_weirdo_795926: "（又喵了……真是个怪人。）"
  npc_override_in_orcs01_2008_headgears_meow_d09fcb: "喵……"
  npc_override_in_orcs01_2008_headgears_meow_e339c8: "喵……？"
  npc_override_in_orcs01_2008_headgears_meow_meow_meow_4094d8: "喵喵喵……"
  npc_override_in_orcs01_2008_headgears_meow_meow_meow_d7ebbb: "（喵喵喵~）"
  npc_override_in_orcs01_2008_headgears_meow_meow_meow_e06c2f: "喵喵喵！"
  npc_override_in_orcs01_2008_headgears_msg_2dff58: "...！..."
  npc_override_in_orcs01_2008_headgears_msg_cf691c: ".. ..."
  npc_override_in_orcs01_2008_headgears_my_name_aite_nah_zir_d4f04c: "我的名字是艾特-纳-齐尔-贝。"
  npc_override_in_orcs01_2008_headgears_myu_slides_her_neck_mock_75730d: "缪滑动了她的脖子，模仿割喉的动作。"
  npc_override_in_orcs01_2008_headgears_nature_s_green_4d542f: "自然之绿！"
  npc_override_in_orcs01_2008_headgears_never_ever_touch_wild_ro_4cb226: "永远不要碰野玫瑰，只猎杀哥布林弓箭手。"
  npc_override_in_orcs01_2008_headgears_now_just_take_leave_wild_339c51: "现在，拿着它离开。野玫瑰对冒险者在身边感到不舒服。"
  npc_override_in_orcs01_2008_headgears_now_those_kobolds_should_fc5070: "现在，那些哥布林应该得到教训了，不是吗？"
  npc_override_in_orcs01_2008_headgears_o_n_e_t_h_af2eca: " '一.千.次.' "
  npc_override_in_orcs01_2008_headgears_obiously_never_ever_any_cf55b3: "显然，永远不要伤害野玫瑰。"
  npc_override_in_orcs01_2008_headgears_oh_aren_t_you_adventurer_98bc8a: "哦，你不就是那个拿走我们'勇敢猫咪'印章的冒险者吗。"
  npc_override_in_orcs01_2008_headgears_oh_aren_t_you_adventurer_ea1437: "哦？你不是冒险者吗？"
  npc_override_in_orcs01_2008_headgears_oh_so_you_want_dye_dd6a92: "哦，所以你想给你的可爱缎带染色，不是吗？"
  npc_override_in_orcs01_2008_headgears_oh_wow_unbelievable_0b99da: "哦……哇，难以置信！"
  npc_override_in_orcs01_2008_headgears_oh_yeah_i_least_need_8189f1: "哦是的，但我至少需要所需的^4d4dff染料^000000。"
  npc_override_in_orcs01_2008_headgears_oh_yeah_right_even_after_fcc4fa: "哦是的，没错，即使在我们给了哥布林所有那些威胁之后……"
  npc_override_in_orcs01_2008_headgears_ok_good_bye_d00fa5: "好的，再见！"
  npc_override_in_orcs01_2008_headgears_ok_let_s_337cc5: "好的，我们开始吧。"
  npc_override_in_orcs01_2008_headgears_ok_ok_blue_cute_ribbon_643377: "好的好的，这个蓝色的可爱缎带，是吧？"
  npc_override_in_orcs01_2008_headgears_ok_ok_green_cute_ribbon_51bb83: "好的好的，这个绿色的可爱缎带，是吧？"
  npc_override_in_orcs01_2008_headgears_ok_ok_red_cute_ribbon_8997be: "好的好的，这个红色的可爱缎带，是吧？"
  npc_override_in_orcs01_2008_headgears_ok_ok_white_cute_ribbon_d666a7: "好的好的，这个白色的可爱缎带，是吧？"
  npc_override_in_orcs01_2008_headgears_ok_ok_yellow_cute_ribbon_b2d20a: "好的好的，黄色的可爱缎带，是吧？"
  npc_override_in_orcs01_2008_headgears_ok_s_fine_i_see_bdaa9a: "好的。没关系。回头见~拜拜~！"
  npc_override_in_orcs01_2008_headgears_one_thousand_times_chuck_27303c: "一千次！-咯咯笑-"
  npc_override_in_orcs01_2008_headgears_orc_lady_absorbed_someth_bff0d5: "这个兽人女士沉浸在某件事中。"
  npc_override_in_orcs01_2008_headgears_orc_lady_suddenly_turns_b23246: "兽人女士突然转过身来，看起来很惊讶。"
  npc_override_in_orcs01_2008_headgears_our_business_over_5e42e7: "我们的事情结束了！！！"
  npc_override_in_orcs01_2008_headgears_our_situation_hasn_t_cha_87e07a: "我们的情况一点都没有改变。你介意再帮我们一次吗？"
  npc_override_in_orcs01_2008_headgears_place_village_deserted_p_176a41: "这里是遗弃者之村。"
  npc_override_in_orcs01_2008_headgears_please_talk_our_teacher_692df8: "如果你是来制作染料的，请和我们的老师谈谈。"
  npc_override_in_orcs01_2008_headgears_pow_really_valuable_thin_57fdf2: "那个Pow真的是非常珍贵的东西！"
  npc_override_in_orcs01_2008_headgears_s_ok_s_how_meow_6d4e41: "没关系。就是这样。喵。"
  npc_override_in_orcs01_2008_headgears_s_right_adventurer_49f82c: "没错，冒险者。"
  npc_override_in_orcs01_2008_headgears_seal_our_brave_kitty_cat_836bf2: "这是我们'勇敢猫咪'的印章。"
  npc_override_in_orcs01_2008_headgears_she_nodded_back_as_if_6ebd06: "她向我点头，好像她明白那是我的告别。"
  npc_override_in_orcs01_2008_headgears_should_e0eca1: "这应该可以了。"
  npc_override_in_orcs01_2008_headgears_should_i_talk_her_uh_075ba1: "我应该和她说话吗？……呃……我们能互相理解吗？"
  npc_override_in_orcs01_2008_headgears_silk_ribbon_maneater_blo_339336: "（^4d4dff丝绸缎带和1,000朵食人花^000000，是吧……）"
  npc_override_in_orcs01_2008_headgears_so_as_i_saying_a2d409: "正如我所说……"
  npc_override_in_orcs01_2008_headgears_so_what_i_m_asking_d32822: "所以我要求你的是……用一切必要手段把他们赶出我们的领地……"
  npc_override_in_orcs01_2008_headgears_so_you_better_careful_abcd0d: "所以你最好小心…… "
  npc_override_in_orcs01_2008_headgears_soooo_valuable_so_don_t_1540c6: "这非常珍贵，所以不要弄丢了。"
  npc_override_in_orcs01_2008_headgears_such_as_cute_ribbon_32812e: "比如^4d4dff可爱缎带^000000。"
  npc_override_in_orcs01_2008_headgears_sunshine_makes_me_sleepy_4d14a5: "这阳光……让我昏昏欲睡……"
  npc_override_in_orcs01_2008_headgears_surprisingly_orc_lady_in_01a3c4: "令人惊讶的是，兽人女士向我介绍了自己。"
  npc_override_in_orcs01_2008_headgears_take_care_75ba67: "保重。"
  npc_override_in_orcs01_2008_headgears_talk_my_friend_next_me_74e643: "如果是关于送货的事，和我旁边的朋友谈谈。"
  npc_override_in_orcs01_2008_headgears_they_their_own_territory_9f7893: "他们在南边有自己的领地，但他们仍然试图入侵我们的。"
  npc_override_in_orcs01_2008_headgears_they_won_t_give_up_edd74a: "..但如果我们不真正给他们一个教训，他们是不会放弃的。"
  npc_override_in_orcs01_2008_headgears_this_is_it_a9cf85: "就这些？"
  npc_override_in_orcs01_2008_headgears_too_much_time_make_one_d98b10: "..做一个要花太多时间。"
  npc_override_in_orcs01_2008_headgears_trade_you_one_i_just_c880f3: "和你交换……我刚做的那个。"
  npc_override_in_orcs01_2008_headgears_uh_you_please_leave_a02aca: "呃……请你离开好吗？"
  npc_override_in_orcs01_2008_headgears_weaving_flower_ribbon_045ca0: "用缎带编织花朵……"
  npc_override_in_orcs01_2008_headgears_welcome_724486: "欢迎。"
  npc_override_in_orcs01_2008_headgears_well_i_dye_clothes_c69ef0: "嗯，我给衣服染色。"
  npc_override_in_orcs01_2008_headgears_well_if_you_think_s_3d2af0: "嗯，如果你觉得这对你来说太多了，那就这样吧。"
  npc_override_in_orcs01_2008_headgears_well_looks_like_bait_spo_ccb5a6: "嗯，看起来诱饵已经坏了…… "
  npc_override_in_orcs01_2008_headgears_what_brings_you_here_0d640b: "是什么让你来到这里？"
  npc_override_in_orcs01_2008_headgears_what_brings_you_here_ho_a5bda5: "是什么让你来到这里？嚯，你不是来伤害野玫瑰的吧？"
  npc_override_in_orcs01_2008_headgears_what_color_you_want_dyed_256b44: "你想把它染成什么颜色？"
  npc_override_in_orcs01_2008_headgears_what_colour_your_cute_ri_ce3e17: "你的可爱缎带是什么颜色的？"
  npc_override_in_orcs01_2008_headgears_what_more_did_you_expect_2aa468: "你还期望什么？"
  npc_override_in_orcs01_2008_headgears_what_weirdo_anyways_what_2508f2: "（真是个怪人……话说回来……那喵喵声是怎么回事？）"
  npc_override_in_orcs01_2008_headgears_what_you_mean_warnings_0852e4: "你说的1,000次警告是什么意思……？"
  npc_override_in_orcs01_2008_headgears_what_you_think_cd736b: "你觉得呢？"
