Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_te_aldecas1_te_goditem_alde1_ah_master_ccdda3: "啊……师父。"
  npc_override_te_aldecas1_te_goditem_alde1_ah_stop_following_me_aro_a71bd7: "啊，别再跟着我了！"
  npc_override_te_aldecas1_te_goditem_alde1_also_keep_mind_fact_i_755e93: "还有，请记住我每周只能做一次。"
  npc_override_te_aldecas1_te_goditem_alde1_also_place_where_you_fin_65140f: "另外，能获得{0}材料的地方……"
  npc_override_te_aldecas1_te_goditem_alde1_also_refers_ragnarok_twi_17e5da: "它也指诸神黄昏，即诸神的末日。"
  npc_override_te_aldecas1_te_goditem_alde1_although_i_managed_escap_b2ede4: "……虽然我又一次设法从她们手中逃脱了……"
  npc_override_te_aldecas1_te_goditem_alde1_am_i_having_some_kind_738bf7: "我是身体出了什么毛病吗？"
  npc_override_te_aldecas1_te_goditem_alde1_before_girls_find_us_eca310: "在那些女孩找到我们之前……"
  npc_override_te_aldecas1_te_goditem_alde1_commerce_level_gets_decr_ace11d: "由于当前等级低于30，商业等级降至0。"
  npc_override_te_aldecas1_te_goditem_alde1_continue_as_37c6ef: "就这样继续。"
  npc_override_te_aldecas1_te_goditem_alde1_could_you_check_again_i_af210c: "你能再确认一下吗？我把所需清单给你。"
  npc_override_te_aldecas1_te_goditem_alde1_course_i_ll_make_jormung_6c090e: "当然，等材料全部收集齐了，我就会立刻为你打造约尔蒙冈德。"
  npc_override_te_aldecas1_te_goditem_alde1_did_you_hear_news_c50e92: "你听说那个消息了吗？"
  npc_override_te_aldecas1_te_goditem_alde1_don_t_worry_about_me_f7c190: "不用担心我。"
  npc_override_te_aldecas1_te_goditem_alde1_essence_rune_6b8236: "关于符文精华，"
  npc_override_te_aldecas1_te_goditem_alde1_essence_rune_a6a72c: "符文精华"
  npc_override_te_aldecas1_te_goditem_alde1_essence_rune_you_need_co_477ac5: "制作符文精华需要^4d4dff将200个远古粗纹符石和100个神秘粗纹符石合成^000000。"
  npc_override_te_aldecas1_te_goditem_alde1_essential_material_makin_0bc62c: "这是制作赫尔沃尔和约尔蒙冈德不可或缺的材料。"
  npc_override_te_aldecas1_te_goditem_alde1_even_if_refinement_level_eefa66: "^ff0000即使已经附有精炼等级和卡片，制作过程中也需要你持有的任意一把魔力之杖。"
  npc_override_te_aldecas1_te_goditem_alde1_forget_c4bbfb: "算了。"
  npc_override_te_aldecas1_te_goditem_alde1_fuse_materials_c57515: "融合材料。"
  npc_override_te_aldecas1_te_goditem_alde1_giant_s_chisel_a57452: "4个巨人之凿"
  npc_override_te_aldecas1_te_goditem_alde1_girls_ad8bc1: "那些女孩……？"
  npc_override_te_aldecas1_te_goditem_alde1_girls_coming_750ac5: "那些女孩来了。"
  npc_override_te_aldecas1_te_goditem_alde1_glaris_kafragarten_regio_d92ded: "卡芙拉花园地区的格拉利斯正受到一群不明生物的攻击。"
  npc_override_te_aldecas1_te_goditem_alde1_go_away_a5fb7a: "走开"
  npc_override_te_aldecas1_te_goditem_alde1_great_power_comes_great_9df890: "力量越大，责任和义务也就越大。"
  npc_override_te_aldecas1_te_goditem_alde1_hands_d1f891: "在{0}的手中。"
  npc_override_te_aldecas1_te_goditem_alde1_he_s_babbling_now_e1c213: "他在胡言乱语了。"
  npc_override_te_aldecas1_te_goditem_alde1_here_7f5577: "就是这个。"
  npc_override_te_aldecas1_te_goditem_alde1_here_we_items_symbolize_a01058: "但是，这里我们拥有的可是象征着诸神黄昏的道具……"
  npc_override_te_aldecas1_te_goditem_alde1_however_okay_if_i_said_8f58aa: "不过，我能说一件事吗？"
  npc_override_te_aldecas1_te_goditem_alde1_however_seems_like_we_ne_24bf39: "不过，看起来我们还需要更多材料。"
  npc_override_te_aldecas1_te_goditem_alde1_however_you_won_t_able_b64634: "不过，你是找不到黄昏之痕的。"
  npc_override_te_aldecas1_te_goditem_alde1_i_couldn_t_stand_so_0840dc: "我实在受不了了，所以逃了出来……但她们追到这里来了……"
  npc_override_te_aldecas1_te_goditem_alde1_i_don_t_think_i_9250d1: "……不管是制作、锻造还是别的什么，我恐怕暂时都做不了了。"
  npc_override_te_aldecas1_te_goditem_alde1_i_feel_so_grateful_all_a814f5: "能让我待在这里，我一直都心怀感激。"
  npc_override_te_aldecas1_te_goditem_alde1_i_feel_so_thankful_all_7b6508: "我一直都心怀感激。"
  npc_override_te_aldecas1_te_goditem_alde1_i_finally_breathe_now_d1194e: "我终于能喘口气了。"
  npc_override_te_aldecas1_te_goditem_alde1_i_had_run_away_because_26267a: "我不得不逃跑，就是因为她们……"
  npc_override_te_aldecas1_te_goditem_alde1_i_hope_i_find_way_d2b13f: "我希望在这里能找到那条路。"
  npc_override_te_aldecas1_te_goditem_alde1_i_hope_things_stay_as_13defb: "……希望一切能像现在这样平静下去。"
  npc_override_te_aldecas1_te_goditem_alde1_i_like_you_master_basics_26c419: "我希望你先把基础掌握扎实。"
  npc_override_te_aldecas1_te_goditem_alde1_i_like_you_minimum_quali_ba3073: "但至少希望你具备最低限度的资格。"
  npc_override_te_aldecas1_te_goditem_alde1_i_ll_make_essence_rune_69591b: "我现在就用你准备好的材料来制作符文精华。"
  npc_override_te_aldecas1_te_goditem_alde1_i_ll_make_jormungand_aft_62ba79: "之后我就会制作约尔蒙冈德。"
  npc_override_te_aldecas1_te_goditem_alde1_i_ll_make_muspellium_ess_a3c35c: "穆斯佩利姆和符文精华我随时可以按你的要求制作，"
  npc_override_te_aldecas1_te_goditem_alde1_i_ll_make_muspellium_mat_b8d78b: "我现在就用你准备好的材料来制作穆斯佩利姆。"
  npc_override_te_aldecas1_te_goditem_alde1_i_ll_start_making_jormun_e6a5cf: "我现在就如约开始制作约尔蒙冈德。"
  npc_override_te_aldecas1_te_goditem_alde1_i_m_all_exhausted_hahaha_ac6873: "我累得不行了。哈哈哈……"
  npc_override_te_aldecas1_te_goditem_alde1_i_m_also_master_who_bfc2dc: "我也是一个追求极致之道的匠人。"
  npc_override_te_aldecas1_te_goditem_alde1_i_m_glad_i_least_a5b7bf: "至少能为你做这些事，我很欣慰。"
  npc_override_te_aldecas1_te_goditem_alde1_i_m_so_exhausted_i_669934: "我累得什么都做不了了。"
  npc_override_te_aldecas1_te_goditem_alde1_i_m_sorry_i_ll_4fd88d: "抱歉。我需要休息一下。"
  npc_override_te_aldecas1_te_goditem_alde1_i_m_sorry_i_m_988ea0: "给你添麻烦了，实在抱歉，但我也是身不由己。"
  npc_override_te_aldecas1_te_goditem_alde1_i_m_sure_he_s_b51a95: "他肯定跟我一样过得好好的。"
  npc_override_te_aldecas1_te_goditem_alde1_i_m_sure_they_re_927db1: "她们肯定是冲着约尔蒙冈德来的。"
  npc_override_te_aldecas1_te_goditem_alde1_i_m_tired_little_bit_35fa8f: "我有点累了。"
  npc_override_te_aldecas1_te_goditem_alde1_i_may_look_just_fine_6318b1: "我看上去可能没事，但精神上已经疲惫不堪了。"
  npc_override_te_aldecas1_te_goditem_alde1_i_mean_if_guild_master_3d2119: "我的意思是，如果公会会长想要的话。"
  npc_override_te_aldecas1_te_goditem_alde1_i_my_reasons_ffa4c5: "我有我的理由。"
  npc_override_te_aldecas1_te_goditem_alde1_i_see_you_ve_developed_6df2e0: "看来你正如承诺的那样发展了这座城堡。"
  npc_override_te_aldecas1_te_goditem_alde1_i_so_overwhelmed_felt_as_53e74d: "我太激动了，感觉只有一瞬间。"
  npc_override_te_aldecas1_te_goditem_alde1_i_t_believe_i_m_470013: "真不敢相信我终于亲手触碰到这些材料了……"
  npc_override_te_aldecas1_te_goditem_alde1_i_t_believe_i_m_f9ccbe: "更不敢相信我竟然要用它们亲手打造约尔蒙冈德……用我自己的双手！"
  npc_override_te_aldecas1_te_goditem_alde1_i_t_tell_how_i_cde1c0: "我无法形容此刻的心情。"
  npc_override_te_aldecas1_te_goditem_alde1_i_think_i_should_rest_267ac8: "我觉得应该休息几天了。"
  npc_override_te_aldecas1_te_goditem_alde1_if_you_could_just_get_6657e7: "如果你能帮我赶走她们的话……约尔蒙冈德，没错！我给你打造约尔蒙冈德！"
  npc_override_te_aldecas1_te_goditem_alde1_initialization_68fa16: "初始化"
  npc_override_te_aldecas1_te_goditem_alde1_initialize_a459df: "初始化"
  npc_override_te_aldecas1_te_goditem_alde1_instruction_507ada: "^4d4dff！— 说明 —！"
  npc_override_te_aldecas1_te_goditem_alde1_jormungand_one_most_powe_5b5f6a: "约尔蒙冈德是我打造的最强大的神兵之一，你完全有资格从我这里得到这样的东西……"
  npc_override_te_aldecas1_te_goditem_alde1_jormungand_powerful_weap_fea6a0: "约尔蒙冈德，汇聚了神话中一切痕迹的强大武器，终于问世了。"
  npc_override_te_aldecas1_te_goditem_alde1_jormungand_s_rib_292f3f: "1根约尔蒙冈德之肋"
  npc_override_te_aldecas1_te_goditem_alde1_jormungand_staff_modeled_62226c: "约尔蒙冈德是一把以环绕世界的神之子——尘世巨蟒约尔蒙冈德为原型的法杖。"
  npc_override_te_aldecas1_te_goditem_alde1_just_wait_he_ll_calm_101b54: "等一等，他会冷静下来的。"
  npc_override_te_aldecas1_te_goditem_alde1_leave_me_5e48dd: "交给我吧。"
  npc_override_te_aldecas1_te_goditem_alde1_let_me_give_you_list_e5a4f4: "如果你需要的话，我把材料清单给你。"
  npc_override_te_aldecas1_te_goditem_alde1_life_just_so_hard_dc0ccb: "生活……真是太艰难了。"
  npc_override_te_aldecas1_te_goditem_alde1_like_dream_place_me_too_4f48eb: "对我来说，这里也如同梦境一般。"
  npc_override_te_aldecas1_te_goditem_alde1_lower_commerce_level_762bba: "降低商业等级30"
  npc_override_te_aldecas1_te_goditem_alde1_lower_commerce_level_b75783: "降低商业等级"
  npc_override_te_aldecas1_te_goditem_alde1_make_jormungand_c3791d: "制作约尔蒙冈德。"
  npc_override_te_aldecas1_te_goditem_alde1_manage_fortress_well_rai_0304c9: "好好管理这座城堡，将^4d4dff商业等级提升至30以上^000000。"
  npc_override_te_aldecas1_te_goditem_alde1_menu_a_c06288: "女孩的声音:喂，你是不是在说我们？对吧，{0}？真不敢相信你竟然逃到这种地方来了。"
  npc_override_te_aldecas1_te_goditem_alde1_menu_a_c06516: "女孩的声音:卡诺！你竟敢无视我们的警告！看来你还有同伴嘛？但你觉得他们能护你到什么时候？！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_aira_175c02: "艾拉:说得对！那就这么办！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_aira_7f9b24: "艾拉:嗯？喂，卡诺。你该回去了。"
  npc_override_te_aldecas1_te_goditem_alde1_menu_aira_b95a82: "艾拉:我的召唤水球！我饶不了你！我要亲手收拾你！！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_aira_e818b1: "艾拉:你以为我输了？你错了！我们要强行突入卡诺所在的地方！！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_aira_f65a94: "艾拉:啊！我忍不了了！姐妹们，过来！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_cano_1c7010: "卡诺:啊啊啊！！那些女孩突破了护盾，闯入华丽金属所在的地方了！！！！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_cano_6a1b20: "卡诺:哦……不！你们要把我怎么样？！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_cano_da151e: "卡诺:哦……不……不要啊！！！！！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_current_2fcb1a: "当前状态:{0}"
  npc_override_te_aldecas1_te_goditem_alde1_menu_current_94c9ab: "城堡当前商业等级:{0}"
  npc_override_te_aldecas1_te_goditem_alde1_menu_ezella_4058a5: "艾泽拉:啊……这样只会让我们两个都更疲惫而已……"
  npc_override_te_aldecas1_te_goditem_alde1_menu_ezella_8fe594: "艾泽拉:你这个像风一样脆弱的家伙……！！！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_ezella_a14b7f: "艾泽拉:你再逃一次试试。你会后悔的，明白吗？"
  npc_override_te_aldecas1_te_goditem_alde1_menu_girls_11258d: "女孩们的声音:卡诺～我们已经知道你在哪儿了。你完了！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_girls_2ffc25: "女孩们的声音:我们只等你10分钟。如果你到时候不出现，我们就攻城！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_girls_510d62: "女孩们:够了，赶紧断了吧！你们真是太烦人了！！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_girls_562cda: "女孩们:约尔蒙冈德应该为我们而造！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_girls_938e12: "女孩们:……我们还要等多久？"
  npc_override_te_aldecas1_te_goditem_alde1_menu_kuluna_02bea8: "库露娜:嗯？你真要这样？那你最好做好心理准备！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_kuluna_8e8292: "库露娜:嗯哼～你回来之后得帮我修好断掉的魔杖，还要给我打造强力武器！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_kuluna_97219b: "库露娜:……这叫战略性撤退。"
  npc_override_te_aldecas1_te_goditem_alde1_menu_lune_6e765e: "露涅:……好吧。战斗开始！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_lune_bfa97b: "露涅:……你想被淹死在深海里吗？嗯？"
  npc_override_te_aldecas1_te_goditem_alde1_menu_mallina_47bd85: "玛丽娜:……你们为什么老是来烦我们？但最终的胜利一定属于我们！！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_mallina_e781bc: "玛丽娜:够了！！别来烦我！！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_modified_00d279: "调整后的商业等级:{0}"
  npc_override_te_aldecas1_te_goditem_alde1_menu_morin_69547d: "莫琳:…… …… ……"
  npc_override_te_aldecas1_te_goditem_alde1_menu_morin_b1f86f: "莫琳:已经……没意思了。"
  npc_override_te_aldecas1_te_goditem_alde1_menu_nasarin_0067bc: "娜莎琳:……我浪费时间了。卡诺在这座城堡的中心？"
  npc_override_te_aldecas1_te_goditem_alde1_menu_nasarin_5a8a3c: "娜莎琳:……啊……成为女武神真是太难了！"
  npc_override_te_aldecas1_te_goditem_alde1_menu_nasarin_ed3e32: "娜莎琳:……直接把他抓走就好了。你们跟他废话那么多干嘛？"
  npc_override_te_aldecas1_te_goditem_alde1_menu_options_06b634: "3:任务失败"
  npc_override_te_aldecas1_te_goditem_alde1_menu_options_112cfe: "4:可以制作道具，5:道具制作成功。"
  npc_override_te_aldecas1_te_goditem_alde1_menu_options_a03d81: "2:任务进行中"
  npc_override_te_aldecas1_te_goditem_alde1_menu_options_b22cdb: "0:可以进行任务"
  npc_override_te_aldecas1_te_goditem_alde1_menu_options_cbbc1b: "1:进行任务。等待10分钟"
  npc_override_te_aldecas1_te_goditem_alde1_menu_princess_482061: "公主状态:{0}"
  npc_override_te_aldecas1_te_goditem_alde1_merciless_girls_399964: "那些无情的女孩们！！！"
  npc_override_te_aldecas1_te_goditem_alde1_moreover_you_ve_found_tw_2cbfaf: "而且，你已经找到了黄昏之痕……"
  npc_override_te_aldecas1_te_goditem_alde1_msg_61ce5a: "[{0}]"
  npc_override_te_aldecas1_te_goditem_alde1_muspellium_026a49: "穆斯佩利姆"
  npc_override_te_aldecas1_te_goditem_alde1_muspellium_essence_rune_279c62: "各1个穆斯佩利姆和符文精华^000000"
  npc_override_te_aldecas1_te_goditem_alde1_no_right_8304d8: "不是吗？"
  npc_override_te_aldecas1_te_goditem_alde1_now_051c1c: "现在不行。"
  npc_override_te_aldecas1_te_goditem_alde1_now_actually_right_time_990f57: "现在正是制作它的最佳时机。"
  npc_override_te_aldecas1_te_goditem_alde1_now_i_ll_stay_here_57d937: "从现在起，我会安安静静地待在这里，在攻城战结束之前不会打扰任何人。"
  npc_override_te_aldecas1_te_goditem_alde1_now_i_m_scared_girls_e3913d: "现在我对女孩都有心理阴影了……吓得什么都做不了……"
  npc_override_te_aldecas1_te_goditem_alde1_oh_no_bdec23: "哦，不……！"
  npc_override_te_aldecas1_te_goditem_alde1_oh_thank_you_cd310c: "哦……谢谢你。"
  npc_override_te_aldecas1_te_goditem_alde1_order_make_muspellium_3c2bbc: "为了制作穆斯佩利姆，"
