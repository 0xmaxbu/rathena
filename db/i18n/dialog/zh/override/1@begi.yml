Header:
  Type: I18N_DIALOG
  Version: 1
Body:
  npc_override_1@begi_PoringVillage_ah_i_found_some_items_50d5f9: "啊，我找到了一些道具。让我给你一个。庆祝你的第一次到访！"
  npc_override_1@begi_PoringVillage_all_traces_poring_villag_1807f4: "^0000ff波利村的所有任务痕迹已被清除。现在，再次与 Emily 对话以进入^000000"
  npc_override_1@begi_PoringVillage_any_processing_monsters_dd7ac1: "^ff0000在地下城内进行任何怪物处理，如驯服怪物等，将不被视为正常进度。请注意。^000000"
  npc_override_1@begi_PoringVillage_as_i_heard_you_get_e1bd02: "据我所知，如果你从这里再往西走一点，可以得到波利村大葱或胡萝卜。"
  npc_override_1@begi_PoringVillage_beginner_mode_player_tra_db8432: "^ff0000在初学者模式下，玩家会变身为怪物。请注意，进入和进行过程中现有的变身效果会消失。^000000"
  npc_override_1@begi_PoringVillage_drives_me_crazy_ok_let_172a43: "这让我抓狂。好吧，五五分。就这么定了。"
  npc_override_1@begi_PoringVillage_enchant_requires_jellopy_f1af98: "这次附魔需要50个杰勒比结晶和20,000z……但是……你没有。"
  npc_override_1@begi_PoringVillage_enchant_reset_failure_in_cbace8: "附魔和重置有^ff000030%的失败率。^000000投资你的蔬菜和运气吧！"
  npc_override_1@begi_PoringVillage_enchant_reset_requires_z_73664e: "附魔或重置需要20,000z和50个杰勒比结晶！不算贵，对吧？"
  npc_override_1@begi_PoringVillage_hmm_you_should_create_pa_44d860: "嗯，你应该先创建一个队伍，才能开始这场伟大的冒险。"
  npc_override_1@begi_PoringVillage_how_about_2385af: "六四开怎么样！！"
  npc_override_1@begi_PoringVillage_how_much_i_need_enchant_ba4266: "附魔需要多少？"
  npc_override_1@begi_PoringVillage_how_square_s_much_better_f5b9bd: "真死板！在一起好多了！"
  npc_override_1@begi_PoringVillage_i_don_t_need_novice_6dcae6: "我不需要这个初学者箱子。你可以拿走。现在，我们出去吧！"
  npc_override_1@begi_PoringVillage_i_enchant_fresh_vegetabl_9933f2: "我给新鲜蔬菜附魔。"
  npc_override_1@begi_PoringVillage_i_m_going_start_slowly_3df46e: "我现在要慢慢开始了……"
  npc_override_1@begi_PoringVillage_i_should_find_another_ad_61b40b: "我应该找一个和我等级差不多的冒险者。很高兴认识你。"
  npc_override_1@begi_PoringVillage_item_complete_check_out_2dfb0a: "道具完成了！看看吧。"
  npc_override_1@begi_PoringVillage_jellopies_zeny_all_you_n_d3f8ce: "50个杰勒比结晶和20,000 Zeny，就是你需要给大葱或胡萝卜添加特殊效果的一切！"
  npc_override_1@begi_PoringVillage_let_s_go_forward_82f5f6: "我们前进吧。"
  npc_override_1@begi_PoringVillage_menu_emily_0fb6df: "Emily：好的。我们走吧！"
  npc_override_1@begi_PoringVillage_menu_emily_133254: "Emily：我不擅长战斗……让我先去找宝藏。待会见~"
  npc_override_1@begi_PoringVillage_menu_emily_23d300: "Emily：听起来有人正往这边冲……"
  npc_override_1@begi_PoringVillage_menu_emily_482d1e: "Emily：但是波利看起来有点特别。小心！"
  npc_override_1@begi_PoringVillage_menu_emily_5357ee: "Emily：我需要多看看才能判断……"
  npc_override_1@begi_PoringVillage_menu_emily_5cf479: "Emily：它在说什么？"
  npc_override_1@begi_PoringVillage_menu_emily_6c949c: "Emily：我很确定波利在某处收集了很多宝藏。"
  npc_override_1@begi_PoringVillage_menu_emily_843104: "Emily：啊，如果你靠近蓝色光柱，会有一种独特的力量。"
  npc_override_1@begi_PoringVillage_menu_emily_86c48f: "Emily：嗯……好吧。它们看起来不太友好。快，躲起来！"
  npc_override_1@begi_PoringVillage_menu_emily_88ed04: "Emily：哇~你挺强的！你打败了所有这些波利！"
  npc_override_1@begi_PoringVillage_menu_emily_8feb24: "Emily：嗯……这里又有一个首领……看起来很强……"
  npc_override_1@begi_PoringVillage_menu_emily_9974c3: "Emily：嘿，你好！可以和你聊一下吗？"
  npc_override_1@begi_PoringVillage_menu_emily_be31a6: "Emily：哎呀。你不能躲起来吗？嗯……加油！"
  npc_override_1@begi_PoringVillage_menu_emily_c4591e: "Emily：嗯……看起来它们设置了障碍，不让我们轻易离开。"
  npc_override_1@begi_PoringVillage_menu_emily_c52666: "Emily：什么？你是谁？"
  npc_override_1@begi_PoringVillage_menu_emily_e0ca1e: "Emily：那么……这就是波利村？"
  npc_override_1@begi_PoringVillage_menu_king_4e50ac: "波利之王：打扰一下……但是……请你现在回去好吗？……"
  npc_override_1@begi_PoringVillage_menu_king_546eb2: "波利之王：呃……我不喜欢战斗，但别无选择。"
  npc_override_1@begi_PoringVillage_menu_king_5de8a8: "波利之王：也许我们的传单有些误会。这个村子很穷，没有什么值钱的东西。"
  npc_override_1@begi_PoringVillage_menu_king_a8de7a: "波利之王：我是这个波利村的领袖。抱歉介绍晚了。"
  npc_override_1@begi_PoringVillage_menu_options_3e5fa7: "？？？：别让他们跑了！把他们所有值钱的道具都拿走！"
  npc_override_1@begi_PoringVillage_menu_options_5202b4: "？？？：我听到人类的声音了。大家，欢迎他们。"
  npc_override_1@begi_PoringVillage_menu_options_69b587: "'{0}：你被疯鹦鹉咬过吗？'"
  npc_override_1@begi_PoringVillage_menu_options_93c79a: "'{0}：哦！！！！放出里面的鹦鹉！！！！'"
  npc_override_1@begi_PoringVillage_menu_options_c16133: "'{0}：我觉得现在啄一下某人没问题！！'"
  npc_override_1@begi_PoringVillage_menu_veggie_12b1c5: "蔬菜附魔师：让你的大葱或胡萝卜更强！"
  npc_override_1@begi_PoringVillage_msg_8fd52e: "五五分……"
  npc_override_1@begi_PoringVillage_must_been_rotten_vegetab_c33bc6: "一定是腐烂的蔬菜。真可惜，我无法承受这种程度的力量……"
  npc_override_1@begi_PoringVillage_my_name_emily_i_waiting_2c12b3: "我的名字是 Emily。我一直在等待一个愿意和我一起去冒险的人！"
  npc_override_1@begi_PoringVillage_no_way_i_m_course_e434da: "不可能。七三分。当然我占七成。"
  npc_override_1@begi_PoringVillage_now_i_m_looking_entrance_fa634c: "现在我正在找入口，等完全打开后再和我谈谈。"
  npc_override_1@begi_PoringVillage_oh_now_you_stronger_than_df1b95: "哦，现在你比我强了。你怎么长得这么快？"
  npc_override_1@begi_PoringVillage_party_member_party_enter_7d0aa4: "队伍成员{0}的队伍{1}进入了{2}。"
  npc_override_1@begi_PoringVillage_please_put_equipment_you_d17e01: "请先穿上你想要附魔的装备。"
  npc_override_1@begi_PoringVillage_proper_reward_42c2e3: "合适的报酬？"
  npc_override_1@begi_PoringVillage_s_gotta_s_no_good_fa8d5a: "必须是五五分，否则免谈"
  npc_override_1@begi_PoringVillage_seems_poring_village_def_464954: "看起来这个波利村可以被像我们这样的初学者打败。不过这只是个大胆的猜测……"
  npc_override_1@begi_PoringVillage_so_you_ready_be603b: "那么，你准备好了吗？"
  npc_override_1@begi_PoringVillage_sounds_fair_me_14c413: "但五五分对我来说很公平。"
  npc_override_1@begi_PoringVillage_tada_enchant_done_check_318f0b: "嗒哒！附魔完成！检查你的蔬菜。"
  npc_override_1@begi_PoringVillage_time_s_crack_created_yet_371c18: "^ff0000时间裂缝尚未生成。^000000"
  npc_override_1@begi_PoringVillage_unknown_error_occurred_285cc7: "发生未知错误。"
  npc_override_1@begi_PoringVillage_vegetable_b56504: "这不是蔬菜！？"
  npc_override_1@begi_PoringVillage_vegetable_cannot_enchant_541cf1: "这个蔬菜不能再附魔了。"
  npc_override_1@begi_PoringVillage_vegetable_never_been_for_cfd54b: "这是一个从未强化过的蔬菜……"
  npc_override_1@begi_PoringVillage_well_actually_i_cannot_g_effe87: "嗯，实际上我不能通过冒险者公会正式给你报酬。但我们可以在狩猎后分成收入。"
  npc_override_1@begi_PoringVillage_well_as_you_know_s_4060a5: "嗯……如你所知，这毕竟是蔬菜。所以有时会坏掉。"
  npc_override_1@begi_PoringVillage_well_come_one_don_t_884827: "嗯，来吧。别那么严肃。听着，你可以听完我的故事后再决定。当然，我可以给你合适的报酬。"
  npc_override_1@begi_PoringVillage_who_said_i_adventure_you_18a571: "谁说要和你一起冒险了？"
  npc_override_1@begi_PoringVillage_why_don_t_you_come_a5af5a: "你为什么不晚点再来？现在先休息一下吧。"
  npc_override_1@begi_PoringVillage_wow_you_look_like_novice_6375c7: "哇~你看起来像个初学者。我真希望等你长大后有一天能和你一起冒险！"
  npc_override_1@begi_PoringVillage_yes_proper_reward_884b96: "是的！合适的报酬。"
  npc_override_1@begi_PoringVillage_you_all_items_you_find_50aa3d: "你可以拥有在这个地下城里找到的所有道具。我已经有一些了。"
  npc_override_1@begi_PoringVillage_you_look_very_tired_91f8fd: "你看起来很疲惫。"
