Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job_sword1_swordman_ah_yes_your_application_b4b7f5: "啊，是的。你的申请将尽快审核。"
  npc_override_job_sword1_swordman_ah_youth_8b2149: "啊，年轻真好！"
  npc_override_job_sword1_swordman_alright_then_feel_free_c_9acdc8: "好的，随时回来，当你准备好了。你现在只需要满足我们的要求。祝你好运。"
  npc_override_job_sword1_swordman_amongst_first_class_jobs_dd7810: "在一转职业中，剑士是最佳的近战战士，原因有三。"
  npc_override_job_sword1_swordman_applicant_pass_course_76342a: "申请者{0}。通过{1}课程。"
  npc_override_job_sword1_swordman_applicant_quit_test_bb06da: "申请者{0}放弃了测试.."
  npc_override_job_sword1_swordman_applicant_quit_test_ce8a26: "申请者{0}放弃了测试。"
  npc_override_job_sword1_swordman_applicant_you_successful_ca7c2c: "申请者{0}。你成功通过了测试。"
  npc_override_job_sword1_swordman_applicant_you_surrender_1befc8: "申请者{0}。你要投降吗？？"
  npc_override_job_sword1_swordman_as_you_travel_through_th_07bff5: "当你穿越三个课程时，你可能会掉到一个随机的地下区域。课程的设计让你仍然可以找到回来的路。"
  npc_override_job_sword1_swordman_bravo_go_again_088c5f: "太棒了！再来一次！"
  npc_override_job_sword1_swordman_brings_you_us_eeeea8: "什么风把你吹来了？"
  npc_override_job_sword1_swordman_check_point_cheer_up_1c3b6b: "这是第{0}个检查点！加油！"
  npc_override_job_sword1_swordman_check_requirements_job_c_00a2e5: "再次检查转职要求，准备好了再回来。"
  npc_override_job_sword1_swordman_come_back_me_when_you_56a696: "当你学完所有基础初心者技能后，再回来找我。"
  npc_override_job_sword1_swordman_don_t_ever_give_up_5d54ca: "永远不要放弃！现在重新测试！"
  npc_override_job_sword1_swordman_enter_room_my_right_so_1b3bce: "进入我右边的房间参加考试。你需要和我右边的NPC说话才能进入考试区域。"
  npc_override_job_sword1_swordman_excellent_let_me_promote_858371: "太好了！让我立刻把你晋升为剑士！"
  npc_override_job_sword1_swordman_first_swordman_benefit_a_e17e6a: "首先，剑士有额外的生命值加成。其次，剑士通常比其他一转职业有更多武器选择。"
  npc_override_job_sword1_swordman_first_you_must_learn_all_9f3f32: "首先，你必须学会全部9个基础技能。如果你无法完成这个要求，你就不能转职为任何职业。"
  npc_override_job_sword1_swordman_good_good_4a58b4: "好，好。"
  npc_override_job_sword1_swordman_ha_ha_ha_aabfe5: "哈哈哈！"
  npc_override_job_sword1_swordman_haha_oh_boy_i_m_e40809: "哈哈！哦，天哪。我很荣幸，但你已经有其他职业了！不过，我也不能怪你……"
  npc_override_job_sword1_swordman_hahaha_congratulations_n_186b9c: "哈哈哈！恭喜你！现在你已经完全有资格成为一名真正的剑士了！我立刻为你转职！"
  npc_override_job_sword1_swordman_hey_you_need_talk_swordm_55afe2: "嘿。你需要和房间中央的剑士说话，不是我。"
  npc_override_job_sword1_swordman_hm_701c55: "嗯……？"
  npc_override_job_sword1_swordman_hm_alright_come_back_whe_dfe269: "嗯？好的，你改变主意随时回来。世界永远需要另一个剑士！"
  npc_override_job_sword1_swordman_hm_how_did_you_get_94c26a: "嗯？你怎么进来的？你不应该在这里，请现在离开。"
  npc_override_job_sword1_swordman_hm_you_still_haven_t_4d48bc: "嗯，你还没有学会所有基础技能。在成为剑士之前，你需要先学会它们。"
  npc_override_job_sword1_swordman_hm_you_ve_learned_all_134380: "嗯，你已经学会了所有基础技能但还没有参加考试。你必须先通过考试才能转职为剑士。"
  npc_override_job_sword1_swordman_hmm_ah_you_must_first_341954: "嗯？啊，你必须先掌握基础技能，才能准备好成为一名剑士。"
  npc_override_job_sword1_swordman_hmm_you_look_like_well_9c09ee: "嗯……你看起来是一名经验丰富的剑士。不过，我相信你必须训练来提升技能和力量！"
  npc_override_job_sword1_swordman_hmmm_2ac89c: "嗯……"
  npc_override_job_sword1_swordman_however_careful_as_waste_efde6c: "但是，小心，这会浪费你的时间！祝你好运。"
  npc_override_job_sword1_swordman_i_already_sent_your_test_83dde6: "我已经把你的测试结果发送到职业部门了。请去中心找官员询问。谢谢。"
  npc_override_job_sword1_swordman_i_see_you_re_retreading_892a34: "我看到你正在重走剑士之路！一旦你习惯了挥舞剑，你就再也回不去了！！"
  npc_override_job_sword1_swordman_i_sencerely_congratulate_fbd466: "我衷心祝贺你通过了测试！"
  npc_override_job_sword1_swordman_i_tell_you_about_test_485115: "我来告诉你关于测试的事！仔细听，我不会重复。"
  npc_override_job_sword1_swordman_i_you_9378ca: "我能为你做的。"
  npc_override_job_sword1_swordman_if_you_already_met_requi_95f886: "如果你已经满足了要求，你现在就可以参加面试。你愿意吗？"
  npc_override_job_sword1_swordman_if_you_choose_surrender_41f23d: "如果你选择「投降」，或者时间耗尽，你就不会通过测试。"
  npc_override_job_sword1_swordman_if_you_complete_these_re_87bb59: "如果你能完成这2个要求，你可以随时转职为剑士。"
  npc_override_job_sword1_swordman_if_you_find_you_strong_bccbff: "如果你发现自己不够强大，无法通过测试，去课程入口和检查点管理员说话。"
  npc_override_job_sword1_swordman_it_454889: "它……"
  npc_override_job_sword1_swordman_job_change_muhahaha_you_57a49e: "转职？哈哈哈！但你已经是剑士了！要自豪，要坚强！"
  npc_override_job_sword1_swordman_menu_job_d92c09: "转职:关于剑士:关于职业要求:取消"
  npc_override_job_sword1_swordman_menu_sign_ee5f59: "报名:取消"
  npc_override_job_sword1_swordman_menu_yes_de2097: "是:否"
  npc_override_job_sword1_swordman_now_let_s_see_3052a1: "现在，让我看看……"
  npc_override_job_sword1_swordman_once_again_congratulatio_f514dd: "再次恭喜你。我期望你将成为剑士公会的一个好代表。"
  npc_override_job_sword1_swordman_purpose_test_confirm_whe_a7d13d: "这个测试的目的是确认你是否有资格成为一名剑士。如你所知，剑士需要体力和精神！"
  npc_override_job_sword1_swordman_retesting_try_worry_abou_97dacd: "重新测试？试着不要担心。你不退缩面对挑战是好事！来，拿着这些，加油！"
  npc_override_job_sword1_swordman_s_too_late_you_become_97b656: "你成为剑士已经太晚了。你已经有其他职业了。不过，告诉你也无妨……"
  npc_override_job_sword1_swordman_second_you_must_pass_swo_5cb8e1: "其次，你必须通过剑士测试。去剑士测试等候室询问测试管理员。"
  npc_override_job_sword1_swordman_seems_being_06471b: "看起来成为"
  npc_override_job_sword1_swordman_seems_there_nothing_70af98: "但看起来没有什么"
  npc_override_job_sword1_swordman_so_c7572d: "那么……"
  npc_override_job_sword1_swordman_so_you_one_who_wants_7fea0a: "那么你就是想成为剑士的人？好的！你看起来很可靠！"
  npc_override_job_sword1_swordman_so_you_wish_become_proud_df8e1f: "那么你想成为一名骄傲的剑士？当然，请报名！"
  npc_override_job_sword1_swordman_so_you_wish_know_more_8e4f2f: "那么你想了解更多关于强大的剑士职业？好吧，那么……"
  npc_override_job_sword1_swordman_sorry_guy_i_only_allow_72fcfa: "抱歉，伙计，但我只允许初心者进入测试大厅。"
  npc_override_job_sword1_swordman_stop_i_t_let_you_905b40: "停下！在你学会所有基础技能之前，我不能让你进去。测试大厅不是来闲逛的！"
  npc_override_job_sword1_swordman_stop_if_you_want_take_163053: "停下！如果你想参加剑士测试，你需要先填写申请表。"
  npc_override_job_sword1_swordman_swordman_association_a86d9c: "剑士公会！"
  npc_override_job_sword1_swordman_swordman_center_room_hel_8b7e75: "房间中央的剑士可以帮你处理，明白了吗？"
  npc_override_job_sword1_swordman_swordman_part_071d18: "剑士不是"
  npc_override_job_sword1_swordman_t_a021d3: "不可能……"
  npc_override_job_sword1_swordman_there_reasons_why_swordy_fac20b: "有3个原因说明剑士是最适合近战的！"
  npc_override_job_sword1_swordman_there_s_no_need_tell_b0217b: "但不需要告诉你要求。你已经满足了要求，已经成为剑士了！好吧，不管怎样……"
  npc_override_job_sword1_swordman_third_most_swordman_skil_c68007: "第三，大多数剑士技能都是强力的物理攻击！在我看来，成为剑士是最好的职业！"
  npc_override_job_sword1_swordman_try_relax_your_best_cour_d371bc: "试着放松，尽力而为。这个课程并不难。"
  npc_override_job_sword1_swordman_warrior_aren_t_you_158d6a: "战士，不是吗？"
  npc_override_job_sword1_swordman_welcome_c8f06d: "欢迎来到"
  npc_override_job_sword1_swordman_what_business_eb746a: "有什么事"
  npc_override_job_sword1_swordman_who_hell_you_nobody_othe_c158a0: "你到底是谁？！除了初心者，任何人都不允许进来！"
  npc_override_job_sword1_swordman_who_you_place_swordman_t_5296d8: "你是谁？！这里是剑士测试的地方！你不允许在这里！现在离开！"
  npc_override_job_sword1_swordman_without_those_you_won_t_dba347: "没有这些，你就不能成为剑士。现在，完成这个测试的条件非常简单。"
  npc_override_job_sword1_swordman_you_re_reborn_50537a: "你是转生的"
  npc_override_job_sword1_swordman_you_surrender_5077a8: "你要投降吗？"
  npc_override_job_sword1_swordman_you_travel_through_three_1c1a81: "你将穿越三个课程，必须在^FF000010分钟^000000内到达最终检查点。"
  npc_override_job_sword1_swordman_you_ve_been_reborn_haven_5ebfe3: "你已经转生了，不是吗？"
  npc_override_job_sword1_swordman_your_destiny_i_m_sorry_71d0f0: "你的命运。我很抱歉，"
