Body:
  npc_override_socket_enchant_socket_enchant_adding_slots_may_seem_si_fd2907: "增加插槽看起来简单，但远比看上去复杂。"
  npc_override_socket_enchant_socket_enchant_after_you_lose_some_weig_0f3785: "- 减轻一些重量后再来 -"
  npc_override_socket_enchant_socket_enchant_again_only_carry_one_equ_18d0ee: "再说一遍，^FF0000只带一件你想让我增加插槽的装备^000000。"
  npc_override_socket_enchant_socket_enchant_ah_don_t_forget_bring_aef22f: "啊，别忘了把那个"
  npc_override_socket_enchant_socket_enchant_all_other_equipment_same_7624cb: "其他同名装备都应该放到卡普拉仓库里，明白了吗？"
  npc_override_socket_enchant_socket_enchant_alright_average_equipmen_2432f7: "好的，这是普通装备等级。"
  npc_override_socket_enchant_socket_enchant_alright_i_understand_2b4ff9: "好的，我能理解。"
  npc_override_socket_enchant_socket_enchant_alright_let_me_know_armo_98db25: "好的……告诉我你想增加插槽的防具，我会告诉你需要什么材料。"
  npc_override_socket_enchant_socket_enchant_alright_please_bring_me_ba5504: "好的，请带给我"
  npc_override_socket_enchant_socket_enchant_alright_then_let_work_be_fac966: "好的，开始工作吧！"
  npc_override_socket_enchant_socket_enchant_alright_which_armor_you_c93f1c: "好的，你想让我尝试给哪件防具增加插槽？"
  npc_override_socket_enchant_socket_enchant_alright_which_weapon_you_50a4bb: "好的，你想让我尝试给哪件武器增加插槽？"
  npc_override_socket_enchant_socket_enchant_armor_divided_into_diffe_c14419: "防具根据工作难度分为 4 个等级。"
  npc_override_socket_enchant_socket_enchant_armor_you_said_1fdee0: "你说防具？"
  npc_override_socket_enchant_socket_enchant_b_class_57bcaf: "B 级吗？"
  npc_override_socket_enchant_socket_enchant_before_i_must_warn_you_216264: "但在那之前，我必须警告你风险。"
  npc_override_socket_enchant_socket_enchant_c_class_armor_eh_2ea49d: "C 级防具吗？"
  npc_override_socket_enchant_socket_enchant_c_class_easiest_one_s_7f5ace: "C 级最容易，S 级最难。"
  npc_override_socket_enchant_socket_enchant_c_class_eh_92829c: "C 级吗？"
  npc_override_socket_enchant_socket_enchant_crazy_huh_1fe2ed: "疯狂吧。嗯？"
  npc_override_socket_enchant_socket_enchant_currently_you_re_carryin_73594b: "- 你身上带的东西太多了 -"
  npc_override_socket_enchant_socket_enchant_d_near_miracle_if_i_35ef25: "如果真能成功，那简直就是奇迹。"
  npc_override_socket_enchant_socket_enchant_don_t_get_too_excited_8b4fdd: "但别太兴奋。"
  npc_override_socket_enchant_socket_enchant_don_t_so_disappointed_tr_55bc2a: "别太失望，下次再试。"
  npc_override_socket_enchant_socket_enchant_great_seems_successful_9ae288: "太好了，看来成功了。"
  npc_override_socket_enchant_socket_enchant_however_i_am_completely_2f2fd8: "不过，我完全是无辜的。"
  npc_override_socket_enchant_socket_enchant_however_you_should_know_809353: "不过你要知道，我也有可能失败。"
  npc_override_socket_enchant_socket_enchant_i_categorize_weapons_the_05d813: "我按照增加插槽的难度给武器分类，C 级最容易，S 级最难。"
  npc_override_socket_enchant_socket_enchant_i_d_like_go_ahead_6e79ea: "我很想继续这次插槽添加尝试，但你还缺一些东西。"
  npc_override_socket_enchant_socket_enchant_i_m_considering_becoming_5a5a95: "我在考虑成为一名插槽工程师。"
  npc_override_socket_enchant_socket_enchant_i_m_engineer_specializes_567e4d: "我是一名专门给普通武器和防具增加插槽的工程师。"
  npc_override_socket_enchant_socket_enchant_i_try_add_slot_now_56bfcb: "如果你有所需物品和 Zeny，我现在就可以尝试增加插槽。"
  npc_override_socket_enchant_socket_enchant_i_wish_you_good_luck_7933ae: "祝你下次好运！"
  npc_override_socket_enchant_socket_enchant_if_attempt_add_slot_your_7399cd: "如果这次给武器增加插槽失败，那么^FF0000武器^000000以及^FF0000上面镶嵌的卡片都会被销毁^000000。"
  npc_override_socket_enchant_socket_enchant_if_attempt_add_slot_your_a2d6c5: "如果这次给防具增加插槽失败，那么^FF0000防具^000000、^FF0000它的强化等级^000000以及^FF0000上面镶嵌的卡片都会被销毁^000000。"
  npc_override_socket_enchant_socket_enchant_if_you_all_required_mate_d73741: "如果你有所有必需材料、我的 Zeny 服务费和防具，我们就可以开始插槽添加尝试。"
  npc_override_socket_enchant_socket_enchant_if_you_ask_me_add_843ea9: "如果你让我给某件物品增加插槽，请确保你的背包里没有多个相同的物品。"
  npc_override_socket_enchant_socket_enchant_if_you_ever_want_try_a81d68: "如果你想尝试给装备增加插槽，随时回来找我。"
  npc_override_socket_enchant_socket_enchant_if_you_re_interested_my_52e7d1: "如果你对我的服务感兴趣，请告诉我。"
  npc_override_socket_enchant_socket_enchant_isn_t_really_peculiar_a78097: "这难道不奇怪吗？"
  npc_override_socket_enchant_socket_enchant_just_remember_careful_5147fc: "记住一定要小心。"
  npc_override_socket_enchant_socket_enchant_just_remember_life_s_no_f456a3: "记住，如果你总是谨小慎微，生活就毫无乐趣了～"
  npc_override_socket_enchant_socket_enchant_looks_pretty_well_done_c_84ca11: "看起来做得很不错。恭喜！"
  npc_override_socket_enchant_socket_enchant_menu_add_47f78e: "给武器增加插槽:给防具增加插槽:插槽尝试说明:取消"
  npc_override_socket_enchant_socket_enchant_menu_attempt_9f2ced: "尝试增加插槽:取消"
  npc_override_socket_enchant_socket_enchant_menu_c_a81efd: "C 级:B 级:A 级:S 级"
  npc_override_socket_enchant_socket_enchant_menu_chain_29863f: "铁链:短剑:嘎贡弓:长矛:海东剑:鲁特琴:钢丝:虎爪: Arbalest 弓"
  npc_override_socket_enchant_socket_enchant_menu_gemmed_1ecbf1: "镶宝头盔:桶帽:记忆之书:紧身衣:军团板甲:全身板甲:盗贼服:护胫:兜帽:披风:头盔:忍者服:兽人头盔:古代披风:僧侣帽:黄金装备:胸针: Munak 帽"
  npc_override_socket_enchant_socket_enchant_menu_gungnir_cb0678: "冈格尼尔:毒刀:冰镐:Sucsamad:金伦加鸿沟:弯刀:新月镰刀:幸存者之杖（敏捷）"
  npc_override_socket_enchant_socket_enchant_menu_here_6b33b7: "举个例子：如果你的背包里有一件 +7 披风和一件普通披风，我会随机选择其中一件进行插槽添加尝试。"
  npc_override_socket_enchant_socket_enchant_menu_hunter_c93d82: "猎人弓:幸存者之杖（智力）:双手巨剑:焰形剑:渗透者:弩炮:击晕棒:狂暴:大剑"
  npc_override_socket_enchant_socket_enchant_menu_majestic_8693cb: "威严山羊头:尖刺头带:骨盔:海盗帽:王冠:头冠:斯芬克斯帽:施法长袍:耳环:戒指: Bow Thimble"
  npc_override_socket_enchant_socket_enchant_menu_mantle_0dc658: "披风:外套:头环:贝雷帽"
  npc_override_socket_enchant_socket_enchant_menu_mirror_ed1380: "镜盾:锁子甲:圣徒长袍:丝绸长袍:靴子:鞋子:围巾:护手:小圆盾:盾牌:僵尸帽"
  npc_override_socket_enchant_socket_enchant_menu_trident_fd2b00: "三叉戟:绳索:小提琴"
  npc_override_socket_enchant_socket_enchant_msg_0ab831: "带来！"
  npc_override_socket_enchant_socket_enchant_msg_5bab61: "增加插槽？"
  npc_override_socket_enchant_socket_enchant_my_bdadcc: "以及我的 ^FF0000"
  npc_override_socket_enchant_socket_enchant_my_service_fee_required_f61f99: "我的服务费、所需材料和成功率都取决于我要处理的具体物品。"
  npc_override_socket_enchant_socket_enchant_need_some_time_think_abo_6ab721: "需要点时间考虑一下，对吧？"
  npc_override_socket_enchant_socket_enchant_now_i_only_upgrade_certa_6122ce: "现在，我只能升级该等级中的特定装备，请从以下物品中选择一件，我们试着给它增加插槽。"
  npc_override_socket_enchant_socket_enchant_oh_there_s_also_somethin_d5afba: "哦，还有一件很重要的事你应该知道。"
  npc_override_socket_enchant_socket_enchant_okay_which_weapon_shall_0f2a05: "好……我们要给哪件武器增加插槽？"
  npc_override_socket_enchant_socket_enchant_only_certain_equipment_h_86e991: "只有某些装备能够承受增加两个额外插槽。"
