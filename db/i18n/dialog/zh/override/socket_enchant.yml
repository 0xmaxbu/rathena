  npc_override_socket_enchant_socket_enchant_you_sure_about_62d3d8: "你确定吗？"
  npc_override_socket_enchant_socket_enchant_you_sure_you_equipment_r_fa2b17: "你确定有装备、必需材料和 Zeny 吗？"
  npc_override_socket_enchant_socket_enchant_you_want_add_slot_ca60a1: "你想给 1 件"
  npc_override_socket_enchant_socket_enchant_you_want_add_slot_weapon_f32d9c: "你想给武器增加插槽？"
  npc_override_socket_enchant_socket_enchant_your_luck_destined_god_o_9dd7b7: "这是你的运气，是上天注定的，明白吗？"
  npc_override_socket_enchant_socket_enchant_zeny_service_fee_eefe4f: " Zeny^000000 服务费。"