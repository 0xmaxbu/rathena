  npc_override_socket_enchant_socket_enchant_other_towns_opposite_tru_85f044: "在其他城镇则相反。"
  npc_override_socket_enchant_socket_enchant_please_choose_weapon_whi_e0e75b: "请选择你想让我尝试增加插槽的武器。"
  npc_override_socket_enchant_socket_enchant_please_try_again_cefdd7: "- 然后再试一次 -"
  npc_override_socket_enchant_socket_enchant_s_class_alright_6c779d: "S 级？好吧……"
  npc_override_socket_enchant_socket_enchant_s_new_field_where_you_6cf66b: "这是一个可以给装备增加插槽的新领域，如果我能从事这样赚钱的职业会很酷。"
  npc_override_socket_enchant_socket_enchant_s_so_complicated_i_d_20959c: "这太复杂了，如果我说我知道影响这个过程的所有因素，那是在撒谎。"
  npc_override_socket_enchant_socket_enchant_see_you_again_buddy_bd76e1: "再见，朋友！"
  npc_override_socket_enchant_socket_enchant_seeya_395801: "再见～"
  npc_override_socket_enchant_socket_enchant_so_what_kind_armor_you_15e298: "那么，你有什么样的防具？"
  npc_override_socket_enchant_socket_enchant_some_high_risk_territory_86524f: "这可是高风险领域！"
  npc_override_socket_enchant_socket_enchant_some_towns_slot_addition_b1b448: "在某些城镇，对强化次数较少的装备进行插槽添加更容易成功。"
  npc_override_socket_enchant_socket_enchant_sounds_reasonable_b2ae49: "听起来合理。"
  npc_override_socket_enchant_socket_enchant_still_i_notice_few_trend_d7f3f0: "不过，我确实注意到了一些趋势……"
  npc_override_socket_enchant_socket_enchant_sure_no_problem_7a8730: "当然可以，没问题。"
  npc_override_socket_enchant_socket_enchant_take_easy_adventurer_c6a442: "放轻松，冒险者。"
  npc_override_socket_enchant_socket_enchant_there_s_huge_element_luc_a3d001: "据我了解，成功增加插槽有很大的运气成分。"
  npc_override_socket_enchant_socket_enchant_there_s_so_much_more_4ea295: "在我成为学徒之前，还有很多东西要学……"
  npc_override_socket_enchant_socket_enchant_therefore_i_need_give_yo_22d581: "所以，我必须先给你一个公平的警告……"
  npc_override_socket_enchant_socket_enchant_too_many_items_you_fc968e: "- 请减少一些负重 -"
  npc_override_socket_enchant_socket_enchant_um_s_class_11d0a5: "嗯……S 级？"
  npc_override_socket_enchant_socket_enchant_wah_i_am_so_sorry_312782: "哇！……非常抱歉，失败了。"
  npc_override_socket_enchant_socket_enchant_wait_minute_17efa5: "- 等一下！！ -"
  npc_override_socket_enchant_socket_enchant_well_i_haven_t_really_afdaa3: "嗯，我对插槽添加技术还没有真正精通。"
  npc_override_socket_enchant_socket_enchant_which_armor_you_like_try_a5f46e: "你想给哪件防具增加插槽？"
  npc_override_socket_enchant_socket_enchant_which_class_you_like_try_0461cb: "你想尝试哪一级？"
  npc_override_socket_enchant_socket_enchant_whoa_whoa_whoa_c79d6d: "哇哦，哇哦，哇哦……"
  npc_override_socket_enchant_socket_enchant_you_chosen_average_b_cla_2966c2: "你选择了普通的 B 级。"
