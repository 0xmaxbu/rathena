Body:

  npc_override_mosk_dun02_mosk_dun_baba_yaga_horrible_3f1868: "可怕的芭芭雅嘎。"
  npc_override_mosk_dun02_mosk_dun_come_us_470ed3: "跟我们走。"
  npc_override_mosk_dun02_mosk_dun_communicating_c31d0e: "与"
  npc_override_mosk_dun02_mosk_dun_csar_0e2223: "沙皇对话。"
  npc_override_mosk_dun02_mosk_dun_don_t_disturb_us_anymore_95f11d: "别再打扰我们了。"
  npc_override_mosk_dun02_mosk_dun_halt_right_there_da6303: "站住！"
  npc_override_mosk_dun02_mosk_dun_i_explain_what_happend_u_4f651f: "——我来解释一下至今发生的事情。——"
  npc_override_mosk_dun02_mosk_dun_i_should_get_out_here_1d29bc: "我该离开这里了……"
  npc_override_mosk_dun02_mosk_dun_if_you_brave_then_take_85d61e: "如果你勇敢，就向前迈一步。否则，就后退。——^000000"
  npc_override_mosk_dun02_mosk_dun_if_you_courage_step_forw_0ba671: "如果你有勇气，就向前迈步。否则，就后退。——^000000"
  npc_override_mosk_dun02_mosk_dun_if_you_leave_place_392cff: "如果你离开这个地方，"
  npc_override_mosk_dun02_mosk_dun_if_you_something_say_450fd1: "如果你有话要说，"
  npc_override_mosk_dun02_mosk_dun_if_you_something_say_spe_33651b: "如果你有话要说，就说吧"
  npc_override_mosk_dun02_mosk_dun_if_you_truly_brave_step_308739: "如果你真的勇敢，就向前迈步。否则，就后退。——^000000"
  npc_override_mosk_dun02_mosk_dun_if_you_valorous_then_tak_97aef1: "如果你英勇无畏，就向前迈一步。否则，就后退。——^000000"
  npc_override_mosk_dun02_mosk_dun_if_you_want_protect_your_8acd3c: "——如果你想保住性命，就回去吧——"
  npc_override_mosk_dun02_mosk_dun_menu_go_b75c1d: "回去吧。:留下来。"
  npc_override_mosk_dun02_mosk_dun_menu_run_8b5034: "逃跑。:解释情况。"
  npc_override_mosk_dun02_mosk_dun_menu_step_21d9d6: "向前迈步。:留下来。"
  npc_override_mosk_dun02_mosk_dun_menu_take_d08eab: "乘船回村。:继续探索。"
  npc_override_mosk_dun02_mosk_dun_speak_csar_8e7f86: "与沙皇对话。"
  npc_override_mosk_dun02_mosk_dun_there_writing_big_rock_253371: "一块大石头上刻着字。"
  npc_override_mosk_dun02_mosk_dun_there_writing_big_rock_5af0be: "——一块大石头上刻着字。——"
  npc_override_mosk_dun02_mosk_dun_those_who_advance_may_ge_0ff848: "^3131FF——前进者或会受伤，但心怀勇气；后退者将得保全。——"
  npc_override_mosk_dun02_mosk_dun_those_who_advance_may_ge_d12f98: "^3131FF——前进者或会受伤，但心怀英勇；后退者将得保全。——"
  npc_override_mosk_dun02_mosk_dun_those_who_advance_may_ge_d1ad5a: "^3131FF——前进者或会受伤，但心怀勇武；后退者将得保全。——"
  npc_override_mosk_dun02_mosk_dun_those_who_afraid_death_g_1abcfd: "畏惧死亡者将后退，否则就前进并留下。——^000000"
  npc_override_mosk_dun02_mosk_dun_those_who_courage_go_bac_aca4f3: "有勇气者将后退，否则就前进并留下。——^000000"
  npc_override_mosk_dun02_mosk_dun_those_who_serve_sun_die_5e5a05: "^3131FF——侍奉太阳者将死，前往北方。——^000000"
  npc_override_mosk_dun02_mosk_dun_those_who_stay_may_die_88d65a: "^3131FF——留下者或会死亡，但将赢得荣耀；后退者或会受伤，但将获得勇气。——"
  npc_override_mosk_dun02_mosk_dun_those_who_step_forward_g_6f3bcd: "^3131FF——前进者将赢得荣耀但或会死亡，后退者将获得勇气但仍可能受伤。——"
  npc_override_mosk_dun02_mosk_dun_unknown_area_arouses_you_cede0d: "——那片未知的区域引起了你的兴趣。——"
  npc_override_mosk_dun02_mosk_dun_we_expected_f71b5c: "我们预料到"
  npc_override_mosk_dun02_mosk_dun_we_information_a60e04: "我们有情报"
  npc_override_mosk_dun02_mosk_dun_we_re_called_out_emergen_625849: "我们被紧急召集而来，"
  npc_override_mosk_dun02_mosk_dun_we_re_csar_s_soldiers_f5a7d2: "我们是沙皇的士兵。"
  npc_override_mosk_dun02_mosk_dun_what_your_business_csar_492c43: "你找沙皇有何事？"
  npc_override_mosk_dun02_mosk_dun_you_appear_again_d20660: "你会再次出现。"
  npc_override_mosk_dun02_mosk_dun_you_board_ship_pull_oars_254e48: "——你登上了船，开始划桨。——"
  npc_override_mosk_dun02_mosk_dun_you_bravely_step_forward_dd6644: "——你勇敢地向前迈步。——"
  npc_override_mosk_dun02_mosk_dun_you_considered_as_our_en_d6d1fe: "你将被视为我们的敌人。"
  npc_override_mosk_dun02_mosk_dun_you_decide_stay_ed7ce3: "——你决定留下来。——"
  npc_override_mosk_dun02_mosk_dun_you_decided_stay_8a7366: "——你决定留下来。——"
  npc_override_mosk_dun02_mosk_dun_you_find_ship_anchor_1c8997: "——你发现了一艘停泊的船。——"
  npc_override_mosk_dun02_mosk_dun_you_follow_way_before_yo_dd0ef5: "——你沿着面前的路前进。——"
  npc_override_mosk_dun02_mosk_dun_you_sense_danger_decide_fb41b1: "——你察觉到危险，决定回去。——"
  npc_override_mosk_dun02_mosk_dun_you_ve_been_secretly_02392f: "你一直在暗中"
  npc_override_mosk_dun02_mosk_dun_you_won_t_advance_39f9ac: "——你不会前进。——"
