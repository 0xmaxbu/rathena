Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_te_prtcas01_te_goditem_prt01_ah_master_ccdda3: "啊……主人。"
  npc_override_te_prtcas01_te_goditem_prt01_ah_stop_following_me_aro_a71bd7: "啊，别再跟着我了！"
  npc_override_te_prtcas01_te_goditem_prt01_also_keep_mind_fact_i_755e93: "另外，请记住我每周只能做一次这件事。"
  npc_override_te_prtcas01_te_goditem_prt01_also_place_where_you_fin_65140f: "另外，一个可以找到{0}材料的地方……"
  npc_override_te_prtcas01_te_goditem_prt01_although_i_managed_escap_b2ede4: "……虽然我又从他们那里逃脱了……"
  npc_override_te_prtcas01_te_goditem_prt01_am_i_having_some_kind_738bf7: "我是不是有什么健康问题？"
  npc_override_te_prtcas01_te_goditem_prt01_before_girls_find_us_eca310: "在女孩们找到我们之前……"
  npc_override_te_prtcas01_te_goditem_prt01_bronze_bars_magical_powe_fc9d6f: "4个具有魔力的青铜条"
  npc_override_te_prtcas01_te_goditem_prt01_commerce_level_gets_decr_ace11d: "由于当前等级低于30，商业等级已降至0。"
  npc_override_te_prtcas01_te_goditem_prt01_continue_as_37c6ef: "就这样继续。"
  npc_override_te_prtcas01_te_goditem_prt01_could_you_check_again_i_af210c: "你能再检查一下吗？我会给你列出我们需要的材料。"
  npc_override_te_prtcas01_te_goditem_prt01_course_i_ll_make_jormung_6c090e: "当然，一旦我们收集齐所有需要的材料，我就会制作约尔蒙甘德。"
  npc_override_te_prtcas01_te_goditem_prt01_did_you_hear_news_c50e92: "你听说那个消息了吗？"
  npc_override_te_prtcas01_te_goditem_prt01_don_t_worry_about_me_f7c190: "别担心我。"
  npc_override_te_prtcas01_te_goditem_prt01_essence_rune_6b8236: "关于符文精华，"
  npc_override_te_prtcas01_te_goditem_prt01_essence_rune_a6a72c: "符文精华"
  npc_override_te_prtcas01_te_goditem_prt01_essence_rune_you_need_co_477ac5: "关于符文精华，你需要^4d4dff将200个远古粗糙符文石和100个神秘粗糙符文石组合起来^000000。"
  npc_override_te_prtcas01_te_goditem_prt01_essential_material_makin_0bc62c: "这是制作赫尔沃和约尔蒙甘德的基本材料。"
  npc_override_te_prtcas01_te_goditem_prt01_even_if_refinement_level_d8b3ec: "^ff0000即使已经应用了精炼等级和卡片，制作过程也需要你所拥有的瓦尔基里之盾中的任意一个。"
  npc_override_te_prtcas01_te_goditem_prt01_forget_c4bbfb: "算了。"
  npc_override_te_prtcas01_te_goditem_prt01_fuse_materials_c57515: "融合材料。"
  npc_override_te_prtcas01_te_goditem_prt01_gaebolg_gloria_region_be_32455d: "格洛丽亚地区的盖博尔格正遭到一群不明生物的袭击。"
  npc_override_te_prtcas01_te_goditem_prt01_girls_ad8bc1: "女孩们……？"
  npc_override_te_prtcas01_te_goditem_prt01_girls_coming_750ac5: "女孩们来了。"
  npc_override_te_prtcas01_te_goditem_prt01_go_away_a5fb7a: "走开"
  npc_override_te_prtcas01_te_goditem_prt01_great_power_comes_great_9df890: "强大的力量伴随着巨大的责任和义务。"
  npc_override_te_prtcas01_te_goditem_prt01_hands_d1f891: "在{0}的手中。"
  npc_override_te_prtcas01_te_goditem_prt01_he_s_babbling_now_e1c213: "他现在在胡言乱语。"
  npc_override_te_prtcas01_te_goditem_prt01_here_7f5577: "给你。"
  npc_override_te_prtcas01_te_goditem_prt01_hervor_one_most_powerful_1d16bf: "赫尔沃是我制作的最强大的战斗装备之一，你值得从我这里收到这样的东西……"
  npc_override_te_prtcas01_te_goditem_prt01_hervor_shield_blacksmith_8c36c9: "赫尔沃，铁匠维伦德为他的妻子赫尔沃制作的盾牌，终于完成了"
  npc_override_te_prtcas01_te_goditem_prt01_hervor_shield_named_afte_e831f5: "赫尔沃是以瓦尔基里赫尔沃命名的盾牌。"
  npc_override_te_prtcas01_te_goditem_prt01_however_okay_if_i_said_8f58aa: "不过，我说句话可以吗？"
  npc_override_te_prtcas01_te_goditem_prt01_however_seems_like_we_ne_24bf39: "不过，看起来我们需要更多的材料。"
  npc_override_te_prtcas01_te_goditem_prt01_however_you_won_t_able_92996a: "不过，你找不到维伦德的物品。"
  npc_override_te_prtcas01_te_goditem_prt01_i_couldn_t_stand_so_0840dc: "我受不了了，所以我逃跑了……但她们在这里……"
  npc_override_te_prtcas01_te_goditem_prt01_i_didn_t_know_fortress_a0b111: "我不知道这个要塞会有曾经属于赫尔沃的丈夫维伦德的物品……"
  npc_override_te_prtcas01_te_goditem_prt01_i_don_t_think_i_9250d1: "……我想我暂时什么都做不了，无论是生产还是锻造还是别的什么。"
  npc_override_te_prtcas01_te_goditem_prt01_i_feel_so_grateful_all_a814f5: "我一直很感激你让我留在这里。"
  npc_override_te_prtcas01_te_goditem_prt01_i_feel_so_thankful_all_7b6508: "我一直很感激。"
  npc_override_te_prtcas01_te_goditem_prt01_i_finally_breathe_now_d1194e: "我现在终于可以喘口气了。"
  npc_override_te_prtcas01_te_goditem_prt01_i_had_run_away_because_26267a: "我不得不因为她们而逃跑……"
  npc_override_te_prtcas01_te_goditem_prt01_i_hope_i_find_way_d2b13f: "我希望我能在这里找到那条路。"
  npc_override_te_prtcas01_te_goditem_prt01_i_hope_things_stay_as_13defb: "……我希望事情能一直像现在这样和平。"
  npc_override_te_prtcas01_te_goditem_prt01_i_like_you_master_basics_26c419: "我希望你先掌握基础知识。"
  npc_override_te_prtcas01_te_goditem_prt01_i_like_you_minimum_quali_ba3073: "但我希望你至少具备最低资格。"
  npc_override_te_prtcas01_te_goditem_prt01_i_ll_make_essence_rune_69591b: "我会用你准备的材料制作符文精华。"
  npc_override_te_prtcas01_te_goditem_prt01_i_ll_make_muspellium_ess_a3c35c: "我会随时应你的要求制作穆斯佩利姆和符文精华，"
  npc_override_te_prtcas01_te_goditem_prt01_i_ll_make_muspellium_mat_b8d78b: "我会用你准备的材料制作穆斯佩利姆。"
  npc_override_te_prtcas01_te_goditem_prt01_i_ll_make_you_hervor_214a38: "之后我会为你制作赫尔沃。"
  npc_override_te_prtcas01_te_goditem_prt01_i_ll_start_making_hervor_774396: "我会按照承诺开始制作赫尔沃。"
  npc_override_te_prtcas01_te_goditem_prt01_i_m_all_exhausted_hahaha_ac6873: "我累坏了。哈哈哈……"
  npc_override_te_prtcas01_te_goditem_prt01_i_m_also_master_who_bfc2dc: "我也是追求终极之道的大师。"
  npc_override_te_prtcas01_te_goditem_prt01_i_m_glad_i_least_a5b7bf: "我很高兴至少能为你做这件事。"
  npc_override_te_prtcas01_te_goditem_prt01_i_m_so_exhausted_i_669934: "我累坏了，什么都做不了。"
  npc_override_te_prtcas01_te_goditem_prt01_i_m_sorry_i_ll_4fd88d: "对不起。我要休息一下。"
  npc_override_te_prtcas01_te_goditem_prt01_i_m_sorry_i_m_988ea0: "很抱歉给你添麻烦了，但我无能为力。"
  npc_override_te_prtcas01_te_goditem_prt01_i_m_sure_he_s_b51a95: "我相信他和我一样过得很好。"
  npc_override_te_prtcas01_te_goditem_prt01_i_m_sure_they_re_6c48ce: "我确信她们是来拿赫尔沃的。"
  npc_override_te_prtcas01_te_goditem_prt01_i_m_tired_little_bit_35fa8f: "我有点累了。"
  npc_override_te_prtcas01_te_goditem_prt01_i_may_look_just_fine_6318b1: "我可能看起来还好，但我在精神上非常疲惫。"
  npc_override_te_prtcas01_te_goditem_prt01_i_mean_if_guild_master_3d2119: "我是说如果公会会长想要的话。"
  npc_override_te_prtcas01_te_goditem_prt01_i_my_reasons_ffa4c5: "我有我的理由。"
  npc_override_te_prtcas01_te_goditem_prt01_i_see_you_ve_developed_6df2e0: "我看到你已经按照承诺发展了要塞。"
  npc_override_te_prtcas01_te_goditem_prt01_i_so_overwhelmed_felt_as_53e74d: "我 overwhelmed 到感觉只是一瞬间。"
  npc_override_te_prtcas01_te_goditem_prt01_i_t_believe_i_m_470013: "我不敢相信我终于亲手触摸到这些材料了……"
  npc_override_te_prtcas01_te_goditem_prt01_i_t_tell_how_i_cde1c0: "我无法形容我的感受。"
  npc_override_te_prtcas01_te_goditem_prt01_i_think_i_should_rest_267ac8: "我想我应该休息几天。"
  npc_override_te_prtcas01_te_goditem_prt01_if_we_use_them_we_3d8149: "如果我们使用它们，我们可以制作赫尔沃。"
  npc_override_te_prtcas01_te_goditem_prt01_if_you_could_just_get_20b537: "如果你能摆脱她们……赫尔沃，对了！我会为你制作赫尔沃！"
  npc_override_te_prtcas01_te_goditem_prt01_initialization_68fa16: "初始化"
  npc_override_te_prtcas01_te_goditem_prt01_initialize_a459df: "初始化"
  npc_override_te_prtcas01_te_goditem_prt01_instruction_507ada: "^4d4dff！- 说明 -！"
  npc_override_te_prtcas01_te_goditem_prt01_just_wait_he_ll_calm_101b54: "等着，他会冷静下来的。"
  npc_override_te_prtcas01_te_goditem_prt01_leave_me_5e48dd: "交给我吧。"
  npc_override_te_prtcas01_te_goditem_prt01_let_me_give_you_list_e5a4f4: "如果你愿意，让我给你列出材料。"
  npc_override_te_prtcas01_te_goditem_prt01_life_just_so_hard_dc0ccb: "生活……就是这么艰难。"
  npc_override_te_prtcas01_te_goditem_prt01_like_dream_place_me_too_4f48eb: "这里对我来说也像个梦想之地。"
  npc_override_te_prtcas01_te_goditem_prt01_lower_commerce_level_762bba: "降低商业等级30"
  npc_override_te_prtcas01_te_goditem_prt01_lower_commerce_level_b75783: "降低商业等级"
  npc_override_te_prtcas01_te_goditem_prt01_make_hervor_325baf: "制作赫尔沃。"
  npc_override_te_prtcas01_te_goditem_prt01_manage_fortress_well_rai_0304c9: "好好管理这个要塞，将^4d4dff其商业等级提高30或更多^000000。"
  npc_override_te_prtcas01_te_goditem_prt01_menu_a_b9f49c: "女孩的声音:凯！你竟敢无视我们的警告！所以，你有同伴在那里，是吧？但你以为他们能陪你多久？！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_a_c06288: "女孩的声音:嘿，你在说我们吗？是{0}，对吧？我不敢相信你逃到了这种地方。"
  npc_override_te_prtcas01_te_goditem_prt01_menu_aira_15ab62: "艾拉:你以为我输了？你错了！我们强行前往凯所在的地方！！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_aira_175c02: "艾拉:你说得对！那好吧！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_aira_1d7f70: "艾拉:嗯？嘿凯。你要回家了。"
  npc_override_te_prtcas01_te_goditem_prt01_menu_aira_b95a82: "艾拉:我的召唤水球！我要抓住你！用我自己的双手！！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_aira_f65a94: "艾拉:啊！我受不了了！女孩们，过来！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_current_2fcb1a: "当前状态:{0}"
  npc_override_te_prtcas01_te_goditem_prt01_menu_current_94c9ab: "要塞当前商业等级:{0}"
  npc_override_te_prtcas01_te_goditem_prt01_menu_ezella_4058a5: "伊泽拉:啊……这只会让我们两个更累……"
  npc_override_te_prtcas01_te_goditem_prt01_menu_ezella_8fe594: "伊泽拉:哦，你这个弱者，会像风一样消失……！！！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_ezella_a14b7f: "伊泽拉:再试着逃跑。你会后悔的，明白吗？"
  npc_override_te_prtcas01_te_goditem_prt01_menu_girls_02ece2: "女孩们:赫尔沃应该为我们制作！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_girls_2ffc25: "女孩们的声音:我们只等10分钟。如果你在这期间不出现，我们就冲进要塞！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_girls_44e997: "女孩们的声音:凯~我们已经知道你在哪里了。结束了！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_girls_510d62: "女孩们:得了，别说了！你们太执着了！！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_girls_938e12: "女孩们:……我们还要等多久？"
  npc_override_te_prtcas01_te_goditem_prt01_menu_kai_5748f5: "凯:哦……不……不！！！！！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_kai_875e4e: "凯:哦……不！你打算对我做什么？！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_kai_c3d57f: "凯:啊啊！！女孩们打破了盾牌，闯进了华丽金属所在的地方！！！！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_kuluna_02bea8: "库露娜:嗯？所以你要这样？你最好做好准备！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_kuluna_8e8292: "库露娜:是的~你回来后必须修好我坏掉的魔杖，为我制作强大的武器！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_kuluna_97219b: "库露娜:……这叫做战略撤退。"
  npc_override_te_prtcas01_te_goditem_prt01_menu_lune_6e765e: "露娜:……好吧。让战斗开始吧！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_lune_bfa97b: "露娜:……你想被淹死在深海里吗？嗯？"
  npc_override_te_prtcas01_te_goditem_prt01_menu_mallina_47bd85: "马琳娜:……你为什么这么打扰我们？但最终胜利将属于我们！！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_mallina_e781bc: "马琳娜:停下！！别再烦我了！！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_modified_00d279: "修改后的商业等级:{0}"
  npc_override_te_prtcas01_te_goditem_prt01_menu_morin_69547d: "莫林:……。……"
  npc_override_te_prtcas01_te_goditem_prt01_menu_morin_b1f86f: "莫林:不再……有趣了。"
  npc_override_te_prtcas01_te_goditem_prt01_menu_nasarin_5a8a3c: "娜萨琳:……啊……成为瓦尔基里太难了！"
  npc_override_te_prtcas01_te_goditem_prt01_menu_nasarin_8973d7: "娜萨琳:……我浪费了时间。凯在这个要塞的中心吗？"
  npc_override_te_prtcas01_te_goditem_prt01_menu_nasarin_ed3e32: "娜萨琳:……直接带走他。你们为什么和他说那么多话？"
  npc_override_te_prtcas01_te_goditem_prt01_menu_options_06b634: "3: 任务失败"
  npc_override_te_prtcas01_te_goditem_prt01_menu_options_112cfe: "4: 可以生产物品，5: 物品生产成功。"
  npc_override_te_prtcas01_te_goditem_prt01_menu_options_a03d81: "2: 任务进行中"
  npc_override_te_prtcas01_te_goditem_prt01_menu_options_b22cdb: "0: 可以进行任务"
  npc_override_te_prtcas01_te_goditem_prt01_menu_options_cbbc1b: "1: 进行任务。等待10分钟"
  npc_override_te_prtcas01_te_goditem_prt01_menu_princess_482061: "公主状态:{0}"
  npc_override_te_prtcas01_te_goditem_prt01_merciless_girls_399964: "无情的女孩们！！！"
  npc_override_te_prtcas01_te_goditem_prt01_moreover_you_ve_found_ve_1fc8a7: "此外，你找到了维伦德的物品……"
  npc_override_te_prtcas01_te_goditem_prt01_msg_61ce5a: "[{0}]"
  npc_override_te_prtcas01_te_goditem_prt01_muspellium_026a49: "穆斯佩利姆"
  npc_override_te_prtcas01_te_goditem_prt01_muspellium_essence_rune_279c62: "1个穆斯佩利姆和符文精华，分别^000000"
  npc_override_te_prtcas01_te_goditem_prt01_no_right_8304d8: "不，对吧？"
  npc_override_te_prtcas01_te_goditem_prt01_now_051c1c: "现在不行。"
  npc_override_te_prtcas01_te_goditem_prt01_now_actually_right_time_990f57: "现在实际上是制作它的正确时机。"
  npc_override_te_prtcas01_te_goditem_prt01_now_i_ll_stay_here_57d937: "从现在开始，我会安静地待在这里，不打扰任何人，直到攻城结束。"
  npc_override_te_prtcas01_te_goditem_prt01_now_i_m_scared_girls_e3913d: "现在我害怕女孩……我太害怕了，什么都做不了……"
  npc_override_te_prtcas01_te_goditem_prt01_oh_no_bdec23: "哦，不……！"
  npc_override_te_prtcas01_te_goditem_prt01_oh_thank_you_cd310c: "哦……谢谢你。"
  npc_override_te_prtcas01_te_goditem_prt01_order_make_muspellium_3c2bbc: "为了制作穆斯佩利姆，"
  npc_override_te_prtcas01_te_goditem_prt01_order_make_muspellium_yo_f6fe60: "为了制作穆斯佩利姆，你需要^4d4dff将50个神之金属和50个铝组合起来^000000。"
  npc_override_te_prtcas01_te_goditem_prt01_organize_possessions_e92975: "整理物品。"
  npc_override_te_prtcas01_te_goditem_prt01_password_83fa6b: "密码？"
  npc_override_te_prtcas01_te_goditem_prt01_people_say_they_definite_0d5959: "……但人们说它们肯定会出现在真正想要的人面前。祝你好运。"
  npc_override_te_prtcas01_te_goditem_prt01_please_lighten_your_load_73e172: "请减轻你的负重后再试。"
  npc_override_te_prtcas01_te_goditem_prt01_please_pretend_see_me_4eb328: "请，假装没看到我。"
