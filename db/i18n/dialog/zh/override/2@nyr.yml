Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_2@nyr_Wolves_aaahhh_1e9cc1: "啊啊啊！！！"
  npc_override_2@nyr_Wolves_acknowledge_6736a0: "承认它！"
  npc_override_2@nyr_Wolves_acknowledge_us_e5ebde: "承认我们！"
  npc_override_2@nyr_Wolves_addition_dealing_intrude_3ceaec: "除了处理入侵者外，我还有另一个任务要交给你。"
  npc_override_2@nyr_Wolves_adventurer_2439c4: "冒险者？"
  npc_override_2@nyr_Wolves_adventurer_f822b4: "冒险者！"
  npc_override_2@nyr_Wolves_adventurer_party_enter_f_a46be7: "冒险者{0}将首先进入{1}队伍的{2}。所有狼群，依次集合。"
  npc_override_2@nyr_Wolves_adventurer_please_safe_93702c: "冒险者，请小心。"
  npc_override_2@nyr_Wolves_adventurer_thank_you_par_3f87f0: "冒险者，感谢你参与净化行动！"
  npc_override_2@nyr_Wolves_adventurer_thank_you_you_7cfa03: "冒险者，感谢你的协助。"
  npc_override_2@nyr_Wolves_adventurer_welcome_0467bb: "冒险者，欢迎。"
  npc_override_2@nyr_Wolves_adventurer_welcome_thank_5a8185: "冒险者，欢迎。感谢你加入这次净化行动。"
  npc_override_2@nyr_Wolves_adventurer_why_you_here_5f2f07: "冒险者……？你为什么在这里，冒险者？"
  npc_override_2@nyr_Wolves_adventurer_why_you_here_61bdfc: "冒险者？你为什么在这里？"
  npc_override_2@nyr_Wolves_adventurer_you_safe_d8a005: "冒险者，你安全吗？"
  npc_override_2@nyr_Wolves_adventurers_thank_you_yo_fbc681: "冒险者们，也感谢你们的辛勤工作！直到我们再次见面！"
  npc_override_2@nyr_Wolves_after_you_loose_some_wei_468fb8: "- 等你减点体重之后。 -"
  npc_override_2@nyr_Wolves_ah_971301: "啊……"
  npc_override_2@nyr_Wolves_ah_i_m_intoxicated_intox_3000e2: "啊~我陶醉了~陶醉于心灵魔法~"
  npc_override_2@nyr_Wolves_ah_i_saw_something_like_a08601: "啊！我在普隆德拉看到过类似的东西。每个人都在那里砸蛋，对吧？"
  npc_override_2@nyr_Wolves_ah_seems_like_something_0f39c0: "啊，似乎有什么东西来了~"
  npc_override_2@nyr_Wolves_ah_you_said_there_enemie_130735: "啊……！你说神殿守卫中有敌人，所以我们得先挑出我们信任的人。"
  npc_override_2@nyr_Wolves_all_hands_formation_faed55: "全体列队！"
  npc_override_2@nyr_Wolves_all_sectors_cleared_gath_0c2651: "所有区域已清除！在出口集合！"
  npc_override_2@nyr_Wolves_all_zones_cleared_gather_07a31b: "所有区域已清除！在神殿入口集合！"
  npc_override_2@nyr_Wolves_alright_i_ll_send_signal_3d17fb: "好的。我会发送信号。"
  npc_override_2@nyr_Wolves_also_our_duty_enact_godd_68a2b0: "执行女神的意志于他们身上也是我们的职责！"
  npc_override_2@nyr_Wolves_am_i_also_getting_shocke_d66fab: "我也被电击了吗？我的身体是不是也有什么问题？"
  npc_override_2@nyr_Wolves_area_under_maintenance_a_08aed7: "该区域正在维护中，禁止进入。很危险。请后退。"
  npc_override_2@nyr_Wolves_area_under_maintenance_a_66d3de: "该区域正在维护中，禁止进入。"
  npc_override_2@nyr_Wolves_aren_t_you_least_secure_172648: "……你至少这么安全吗？"
  npc_override_2@nyr_Wolves_argh_argh_temple_guard_g_b22363: "啊！！！！啊！！！神殿守卫抓住了一个男人！！！"
  npc_override_2@nyr_Wolves_as_expected_you_smack_ma_0dfbd7: "果然，你得敲打一个故障的机器！"
  npc_override_2@nyr_Wolves_ask_if_s_okay_back_2521a6: "问问是否可以撤退。"
  npc_override_2@nyr_Wolves_awaiting_security_code_r_2ac2dd: "等待安全代码重置。请输入新的安全代码。"
  npc_override_2@nyr_Wolves_awaiting_security_code_r_71f635: "等待安全代码重置"
  npc_override_2@nyr_Wolves_back_off_a44d9b: "退后！"
  npc_override_2@nyr_Wolves_because_we_don_t_look_ad8ee7: "是因为我们看起来不像人类吗？"
  npc_override_2@nyr_Wolves_because_we_look_so_easy_9ce66e: "是因为我们看起来很好欺负吗？"
  npc_override_2@nyr_Wolves_beep_a25744: "哔-"
  npc_override_2@nyr_Wolves_beep_vault_unlock_protoc_27545a: "哔 - 金库解锁协议已激活"
  npc_override_2@nyr_Wolves_beware_allies_may_distin_eac1de: "小心，在黑暗中盟友可能无法与敌人区分！谨慎行事，避免攻击我们自己的人！"
  npc_override_2@nyr_Wolves_cancel_input_8e6f7b: "取消输入"
  npc_override_2@nyr_Wolves_careful_fa18ab: "小心。"
  npc_override_2@nyr_Wolves_clean_up_your_mess_167ca8: "清理你的烂摊子。"
  npc_override_2@nyr_Wolves_could_you_input_changed_a1ae95: "你能输入更改后的安全代码吗？那样我们就都会真正开心了。"
  npc_override_2@nyr_Wolves_currently_you_re_carryin_73594b: "- 你目前携带 -"
  npc_override_2@nyr_Wolves_did_you_find_what_kind_3ac1e7: "你找到了吗？这是什么样的地方？"
  npc_override_2@nyr_Wolves_didn_t_party_leader_deci_8577d3: "不是队长决定来的吗？"
  npc_override_2@nyr_Wolves_doesn_t_look_good_i_661592: "这看起来不太好。我需要去找苏阿德，但副手在哪里？"
  npc_override_2@nyr_Wolves_doesn_t_look_like_they_451a2e: "他们看起来不像是想找一本特定的书吗？"
  npc_override_2@nyr_Wolves_don_t_you_see_we_416a19: "你没看到吗？我们正在闯入一个图书馆。这里一定有很多定居者的秘密。"
  npc_override_2@nyr_Wolves_drop_your_weapon_ea2b9a: "放下你的武器！！"
  npc_override_2@nyr_Wolves_end_library_227f4f: "这是图书馆的尽头吗？"
  npc_override_2@nyr_Wolves_enter_0abb0f: "进入。"
  npc_override_2@nyr_Wolves_even_most_secretive_libr_e22590: "即使是最隐秘的图书馆也不会把那样的书随便乱放。"
  npc_override_2@nyr_Wolves_events_inside_temple_adcee8: "- 神殿内的事件。 -"
  npc_override_2@nyr_Wolves_everyone_assembled_af7354: "大家都到齐了吗？"
  npc_override_2@nyr_Wolves_everyone_gathered_over_t_ddcd79: "大家都聚集在那边。"
  npc_override_2@nyr_Wolves_everyone_lay_down_your_w_1f0086: "所有人放下武器，举起双手！"
  npc_override_2@nyr_Wolves_everyone_you_may_now_dis_13711a: "各位，现在可以解散了！"
  npc_override_2@nyr_Wolves_examine_carefully_could_f94e61: "仔细检查。它可能被篡改了。"
  npc_override_2@nyr_Wolves_father_80d4f8: "……父亲？？"
  npc_override_2@nyr_Wolves_father_father_ab1c03: "父亲！父亲！！！"
  npc_override_2@nyr_Wolves_father_who_praises_you_n_3bb5e7: "一个表扬你但从不爱你的父亲？"
  npc_override_2@nyr_Wolves_four_6e2150: "四！！"
  npc_override_2@nyr_Wolves_four_bed031: "四！"
  npc_override_2@nyr_Wolves_give_back_67b451: "还回来！"
  npc_override_2@nyr_Wolves_give_land_back_its_right_ec8a62: "把这片土地还给它合法的主人！还回来！！"
  npc_override_2@nyr_Wolves_give_right_back_owner_la_499573: "把权利还给这片土地的合法主人！还回来！！"
  npc_override_2@nyr_Wolves_go_home_miriam_i_m_0eb5f0: "回家吧，米里亚姆。我不会再配合你古板的行为方式了。"
  npc_override_2@nyr_Wolves_good_s_fortunate_otherwi_a9caf7: "很好。这是幸运的。否则，我们可能会自相争吵，对吧？"
  npc_override_2@nyr_Wolves_good_timing_then_we_ll_4f1757: "时机正好。那我们就说再见吧！"
  npc_override_2@nyr_Wolves_ha_hah_adventurer_you_al_a1e99c: "哈……哈……冒险者，你还好吗？"
  npc_override_2@nyr_Wolves_hah_now_s_life_saver_69c25c: "哈-现在真是救命稻草。"
  npc_override_2@nyr_Wolves_halt_identify_yourself_dd089f: "站住！表明你的身份。"
  npc_override_2@nyr_Wolves_he_s_always_been_like_ca1345: "他一直都是这样……那有什么不祥的吗？"
  npc_override_2@nyr_Wolves_heart_f3671a: "心……"
  npc_override_2@nyr_Wolves_heart_hunters_undercover_0fc271: "猎心者是卧底。"
  npc_override_2@nyr_Wolves_hearthunter_you_re_worki_7b5e6a: "猎心者……你从一开始就和那些你提到的疯狂科学家合作……！"
  npc_override_2@nyr_Wolves_hehe_did_you_like_your_e7621b: "嘿嘿 - 你喜欢你的伪装吗？给我们拍拍背。"
  npc_override_2@nyr_Wolves_hello_adventurer_agent_t_a48952: "你好，冒险者。神殿的一名代理人一直在等你。"
  npc_override_2@nyr_Wolves_hello_did_you_get_good_fd13f7: "你好！你休息得好吗？如果你今天能帮我，我会很感激。请注意，行动每天只能进行一次。"
  npc_override_2@nyr_Wolves_here_s_what_2dd421: "是这样的……"
  npc_override_2@nyr_Wolves_here_we_go_good_luck_19c706: "我们走！！！祝你好运！走吧，伙计们！"
  npc_override_2@nyr_Wolves_here_we_go_intruder_here_376d69: "我们走！入侵者在这里！！！"
  npc_override_2@nyr_Wolves_hey_exhilarating_735aff: "嘿！这真令人兴奋~"
  npc_override_2@nyr_Wolves_hey_mr_genius_don_t_92a5f6: "嘿，天才先生，你不知道什么叫讽刺吗？！严密的安全不等于繁琐苛刻的程序，对吧？"
  npc_override_2@nyr_Wolves_hey_one_s_amazing_0ff299: "嘿！！这个太厉害了！！！"
  npc_override_2@nyr_Wolves_hey_place_my_great_great_f772f1: "嘿，那块地是我曾曾祖母的！"
  npc_override_2@nyr_Wolves_hey_strange_no_matter_ho_b2d685: "嘿！这很奇怪。无论我怎么操作，心灵魔法都没有发出。"
  npc_override_2@nyr_Wolves_hey_there_other_people_o_274b1e: "嘿，那边还有其他人，他们怎么说？"
  npc_override_2@nyr_Wolves_hey_there_you_1d3b04: "嘿！你在这里！！"
  npc_override_2@nyr_Wolves_hey_who_s_handling_machi_b4511b: "嘿！谁在那样操作机器？"
  npc_override_2@nyr_Wolves_hi_let_me_formally_intro_45c752: "嗨，让我正式介绍一下我们自己。我们是猎心者，我们即将在这里埋葬你。"
  npc_override_2@nyr_Wolves_high_priest_what_even_me_56bb2d: "大祭司？？那是什么意思？"
  npc_override_2@nyr_Wolves_hmm_my_mood_feels_exhila_e5a36f: "嗯，我的心情第一次感到兴奋。"
  npc_override_2@nyr_Wolves_hold_adventurer_5fd2fb: "等等，冒险者！"
  npc_override_2@nyr_Wolves_how_far_we_there_ce05b8: "我们离那里还有多远？"
  npc_override_2@nyr_Wolves_how_high_priest_we_ll_c51c7c: "怎么会……大祭司……？我们得调查一下。"
  npc_override_2@nyr_Wolves_how_i_fbb7db: "我该怎么做？"
  npc_override_2@nyr_Wolves_how_s_taste_repression_48cf3a: "尝尝被镇压的滋味怎么样？"
  npc_override_2@nyr_Wolves_huh_a78e67: "嗯……？"
  npc_override_2@nyr_Wolves_i_didn_t_give_you_25b1cb: "我没有给你任何指示。你是想自作主张吗？"
  npc_override_2@nyr_Wolves_i_don_t_even_remember_08a9f2: "我甚至不记得得到过表扬。嗯……啊！我不记得是因为我从未得到过。！"
  npc_override_2@nyr_Wolves_i_don_t_know_let_4d0d7b: "我不知道。我们去找找吧。"
  npc_override_2@nyr_Wolves_i_don_t_think_good_166a25: "我觉得这不是一个好情况。我需要靠近一点。"
  npc_override_2@nyr_Wolves_i_don_t_think_party_0b9b94: "我觉得队伍还没到。"
  npc_override_2@nyr_Wolves_i_feel_chill_down_my_71723b: "我感到脊背发凉……好像有人在监视……？"
  npc_override_2@nyr_Wolves_i_heard_fight_somewhere_8eb97c: "我听到某处有打斗声？"
  npc_override_2@nyr_Wolves_i_know_f18215: "我知道……"
  npc_override_2@nyr_Wolves_i_know_they_must_real_d0557e: "我知道。他们一定有一个真正的秘密图书馆。"
  npc_override_2@nyr_Wolves_i_ll_evacuate_people_fbae7a: "我会疏散人群。"
  npc_override_2@nyr_Wolves_i_ll_give_you_exactly_ec6f34: "我给你正好30分钟！在时间限制内回来！"
  npc_override_2@nyr_Wolves_i_ll_go_s_probably_e572fa: "我去。那可能是我父亲的，因为我对它可能去了哪里有一个很好的想法。"
  npc_override_2@nyr_Wolves_i_ll_proceed_f246e8: "我要继续了。"
  npc_override_2@nyr_Wolves_i_ll_track_them_down_c36efd: "我会追踪他们，而你，冒险者，照顾好这些家伙！"
  npc_override_2@nyr_Wolves_i_m_bit_believer_dc9528: "我有点相信。"
  npc_override_2@nyr_Wolves_i_m_going_burn_out_be860f: "我要把手指烧坏了。"
  npc_override_2@nyr_Wolves_i_m_going_talk_forever_5aacbb: "我不会永远说下去。我们走吧。"
  npc_override_2@nyr_Wolves_i_m_just_following_behin_f6a6fc: "我只是跟在后面，为什么我需要组队？我一个人就够了。你待在这里，如果有什么事我会发信号。"
  npc_override_2@nyr_Wolves_i_m_miriam_daughter_high_4f2e09: "我是米里亚姆，大祭司阿玛尔的女儿。我们一直在跟踪一群可疑的人进入这个区域……"
  npc_override_2@nyr_Wolves_i_m_sure_there_instigato_79fd51: "我确信外面的人群中潜伏着煽动者，是坏人安插的……"
  npc_override_2@nyr_Wolves_i_recall_seeing_last_tim_636b2f: "我记得上次看到过这个，但我们是怎么处理的……"
  npc_override_2@nyr_Wolves_i_sent_suad_don_t_148eea: "我是苏阿德派来的。别太担心。"
  npc_override_2@nyr_Wolves_i_still_don_t_understand_4faa71: "我还是不明白。发生了什么事？"
  npc_override_2@nyr_Wolves_i_still_mission_pending_a8de74: "我还有未完成的任务！"
  npc_override_2@nyr_Wolves_i_think_my_father_involv_fcac4c: "我觉得我父亲卷入了这件事。"
  npc_override_2@nyr_Wolves_i_thought_killing_me_2dc437: "我以为它要杀了我！"
  npc_override_2@nyr_Wolves_i_told_you_find_first_a5d0be: "我告诉过你一开始就要找到它，而不是因为它在那里就来找我。"
  npc_override_2@nyr_Wolves_i_ve_heard_you_ll_da4db5: "我听说你也会加入我们，在神殿内部进行一次单独的净化行动。我们会指望你的！"
  npc_override_2@nyr_Wolves_i_ve_received_rendezvous_e167ef: "我已收到会合点。你可以通过这个紧急出口立即加入。当你准备好时，请进入。"
  npc_override_2@nyr_Wolves_i_wish_i_could_found_eb82e4: "我希望我能找到那本书，但我找不到。他们已经完成了他们的工作，所以我们要离开了。"
  npc_override_2@nyr_Wolves_i_wish_i_had_suad_c9ef18: "我希望苏阿德能和我在一起。我希望我能在某个时候帮到他。"
  npc_override_2@nyr_Wolves_i_wish_leader_tell_me_3e0cc8: "我希望队长能作为代表告诉我。"
  npc_override_2@nyr_Wolves_if_i_knew_i_wouldn_bd3a70: "如果我知道的话，我就不会在这里了。我会说，'把看起来像那样的东西都带来。'去找吧。"
  npc_override_2@nyr_Wolves_if_s_case_then_there_0817d4: "如果是那样的话，那我们就无能为力了。下次见！"
  npc_override_2@nyr_Wolves_if_you_dismiss_now_we_b3fcbb: "如果你现在解散，我们不会以擅闯神殿的罪名起诉你！"
  npc_override_2@nyr_Wolves_if_you_get_any_closer_035dde: "如果你再靠近，我们将采取行动。"
  npc_override_2@nyr_Wolves_if_you_t_step_aside_78912a: "如果你做不到，让开。我来处理。"
  npc_override_2@nyr_Wolves_illusion_23387f: "那应该是幻象。"
  npc_override_2@nyr_Wolves_information_leaked_other_9ae3fa: "或者信息泄露了。否则，我们不会有所准备。"
  npc_override_2@nyr_Wolves_inspect_all_facilities_e_3ece5b: "检查所有设施并确保安全。任何试图突破并获取力量的人必须被处理！"
  npc_override_2@nyr_Wolves_intruder_argh_df6e8c: "入侵者……！啊！！！"
  npc_override_2@nyr_Wolves_isn_t_end_line_139cbb: "这不是终点吗？"
  npc_override_2@nyr_Wolves_isn_t_only_magic_permitt_151335: "这不是王国唯一允许的魔法吗？"
  npc_override_2@nyr_Wolves_isn_t_party_leader_arriv_4c8296: "队长还没到吗？"
  npc_override_2@nyr_Wolves_jing_clap_b6de4d: "叮- 啪-"
  npc_override_2@nyr_Wolves_just_any_heart_hunter_he_b8d399: "不是普通的猎心者。他是一个非常非常厉害的猎心者。"
  npc_override_2@nyr_Wolves_keep_your_guard_up_de8ccf: "保持警惕！"
  npc_override_2@nyr_Wolves_last_library_i_don_t_872946: "这是最后一个图书馆，但我不认为它在这里。"
  npc_override_2@nyr_Wolves_leave_irrelevant_books_a_a4fd79: "不要管无关的书。那不是我们要找的。"
  npc_override_2@nyr_Wolves_leave_one_me_a17914: "这个交给我！"
  npc_override_2@nyr_Wolves_let_me_explain_ff77ea: "让我解释一下。"
  npc_override_2@nyr_Wolves_let_s_go_too_7ff8cf: "我们也进去吧。"
  npc_override_2@nyr_Wolves_looks_like_issue_riot_to_5f2231: "看来上面的骚乱问题很严重。"
  npc_override_2@nyr_Wolves_looks_like_s_short_circu_852d19: "看起来短路了！它在发光！"
  npc_override_2@nyr_Wolves_looks_like_they_re_headi_77d922: "看起来他们正前往神殿。"
  npc_override_2@nyr_Wolves_luckily_there_s_adventur_e6f7a6: "幸运的是，这里有一位冒险者。时机正好。"
