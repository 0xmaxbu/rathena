Body:

  npc_override_nguild_pay_nguild_dunsw_menu_pull_7414f9: "拉动。:不拉。"
  npc_override_nguild_pay_nguild_dunsw_nothing_happened_4501ec: "什么也没发生。"
  npc_override_nguild_pay_nguild_dunsw_one_who_overcome_ordeal_2c6a9e: "「能够克服磨难、展现真正勇气的人……将找到道路……」"
  npc_override_nguild_pay_nguild_dunsw_only_one_who_show_true_433e8c: "「唯有能够展现真正勇气的人才能接受这项试炼。」"
  npc_override_nguild_pay_nguild_dunsw_there_s_small_lever_you_e840a3: "这里有一个小拉杆。你要拉动它吗？"
  npc_override_nguild_pay_nguild_kafras_i_am_contracted_provide_045215: "我受雇仅服务于^ff0000{0}^000000公会。请使用附近的其他卡普拉服务人员。很抱歉给你带来不便。"
  npc_override_nguild_pay_nguild_managers_as_you_wish_master_5a4c04: "遵命，主人。"
  npc_override_nguild_pay_nguild_managers_as_you_wish_master_i_806c21: "遵命，主人。但我建议我们尽快雇佣一名卡普拉！"
  npc_override_nguild_pay_nguild_managers_goods_produced_everyday_77d2e3: "货物每天都在生产。"
  npc_override_nguild_pay_nguild_managers_how_you_i_m_here_ea742a: "你好！我在此为你提供帮助服务！我会尽我所能为你服务。"
  npc_override_nguild_pay_nguild_managers_i_am_here_follow_s_4c14a6: "我在此听候^5533FF{0}^000000的命令！嘿！你甚至不是公会成员！！"
  npc_override_nguild_pay_nguild_managers_i_am_waiting_my_master_4b40ee: "我在等待我的主人。勇敢的冒险者，追随你的命运吧！"
  npc_override_nguild_pay_nguild_managers_i_done_anything_wrong_if_4f8ed6: "我做错了什么吗？如果我做错了，请原谅我好吗？"
  npc_override_nguild_pay_nguild_managers_i_think_kafra_staff_bene_e381d6: "我认为卡普拉服务会对我们的公会成员有益。"
  npc_override_nguild_pay_nguild_managers_kafra_been_dismissed_we_992a5d: "卡普拉已被解雇。但是……我们真的应该尽快雇佣一名卡普拉！"
  npc_override_nguild_pay_nguild_managers_master_i_think_you_shoul_c51d86: "主人，我认为你应该保留当前的卡普拉服务人员，因为她已经在尽力为我们服务了。"
  npc_override_nguild_pay_nguild_managers_master_you_don_t_contrac_2e58da: "主人，你还没有和卡普拉服务公司签订合同。"
  npc_override_nguild_pay_nguild_managers_master_you_enough_money_75aa30: "主人，你没有足够的钱雇佣卡普拉。雇佣已取消。"
  npc_override_nguild_pay_nguild_managers_order_hire_kafra_you_mus_ff28d0: "要雇佣卡普拉，你必须先学习公会技能^5533FF「与卡普拉签约」^000000。"
  npc_override_nguild_pay_nguild_managers_please_follow_me_through_12288d: "请跟我穿过这条秘密通道。"
  npc_override_nguild_pay_nguild_managers_s_unfortunate_i_won_t_54e25a: "很遗憾，我不能再为你的公会服务了……"
  npc_override_nguild_pay_nguild_managers_thank_you_master_i_ll_763138: "谢谢主人，我会尽全力！^^"
  npc_override_nguild_pay_nguild_managers_welcome_master_i_assist_b26228: "欢迎你，^5533FF{0}^000000主人！我将竭诚为你服务！"
  npc_override_nguild_pay_nguild_managers_where_guardians_destroy_809717: "守卫在哪里？消灭这些入侵者！"
  npc_override_nguild_pay_nguild_managers_you_created_contract_kaf_475afd: "你已与卡普拉服务公司签订了合同。"
  npc_override_nguild_pay_nguild_managers_you_go_our_treasure_room_7d425d: "你要去我们的宝物库吗？只有你，公会会长，才能进入这个房间。"
  npc_override_nguild_pay_nguild_managers_you_like_dismiss_current_5f5c00: "你想解雇当前的卡普拉吗？"
  npc_override_nguild_pay_nguild_managers_you_like_employ_services_7df2f2: "你想雇佣卡普拉服务吗？你需要^5533FF10,000 Zeny^000000来支付……"
  npc_override_nguild_pay_nguild_managers_you_must_pull_down_secre_62e645: "你必须拉下那个秘密开关才能出去。"
  npc_override_nguild_pay_nguild_managers_you_re_i_am_here_781f91: "你不是^5533FF{0}^000000！我在此只为听从^5533FF{1}^000000的命令。"
  npc_override_nguild_pay_nguild_managers_you_should_get_them_when_aecc98: "你应该尽快获取它们，因为如果你在错误的时间拿取，它们可能会消失。"
  npc_override_nguild_pay_nguild_treas_all_treasure_boxes_been_a8c751: "所有宝箱都已被打开。你必须等到明天它们才会再次出现。"
  npc_override_nguild_pay_nguild_treas_menu_pull_7414f9: "拉动。:不拉。"
  npc_override_nguild_pay_nguild_treas_there_s_small_lever_you_e840a3: "这里有一个小拉杆。你要拉动它吗？"
  npc_override_nguild_pay_nguild_treas_treasure_chest_broken_op_8244b6: "宝箱已被打开"
