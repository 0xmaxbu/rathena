Body:

  npc_override_moc_fild02_quest_pecopeco_ah_ok_i_think_you_dbcd0e: "啊，好的，我觉得你可以帮我猎杀一些大嘴鸟。"
  npc_override_moc_fild02_quest_pecopeco_any_progress_you_ve_made_b3e247: "你所取得的任何进展都将被清除"
  npc_override_moc_fild02_quest_pecopeco_become_hostile_towards_m_a17faa: "变得对我有敌意。"
  npc_override_moc_fild02_quest_pecopeco_bill_birds_lately_they_s_3fa235: "鸟嘴，但最近它们似乎"
  npc_override_moc_fild02_quest_pecopeco_come_back_when_you_ve_44350c: "完成任务后回来，我会给你一个小奖励。"
  npc_override_moc_fild02_quest_pecopeco_doesn_t_look_like_you_4ba0e4: "看起来你还没有足够的数量。"
  npc_override_moc_fild02_quest_pecopeco_gonna_delicious_cdfe6e: "这一定会很美味！"
  npc_override_moc_fild02_quest_pecopeco_hi_there_b3874c: "你好。"
  npc_override_moc_fild02_quest_pecopeco_hmm_i_don_t_think_1d8eb5: "嗯，我觉得你还没有猎杀到100只……"
  npc_override_moc_fild02_quest_pecopeco_hmm_i_don_t_think_2144d7: "嗯，我觉得你还没有猎杀到50只……"
  npc_override_moc_fild02_quest_pecopeco_hmm_i_don_t_think_5d960b: "嗯，我觉得你还没有猎杀到150只……"
  npc_override_moc_fild02_quest_pecopeco_hmmm_you_seem_too_strong_a32b99: "嗯……你似乎太强了，不适合在这里战斗。"
  npc_override_moc_fild02_quest_pecopeco_how_many_you_like_hunt_7fc82d: "你想猎杀多少只？"
  npc_override_moc_fild02_quest_pecopeco_i_am_so_afraid_these_b3d1b6: "我很害怕这些大嘴鸟会因为我的，呃，研究活动而伤害我。"
  npc_override_moc_fild02_quest_pecopeco_i_am_still_doing_my_4a4134: "我还在做我的，呃，研究……"
  npc_override_moc_fild02_quest_pecopeco_i_need_some_bill_birds_dbf305: "我需要一些^FF0000鸟嘴^000000来做我的，呃，研究……"
  npc_override_moc_fild02_quest_pecopeco_i_think_i_ll_feel_1aa262: "我想我会感到更安全……"
  npc_override_moc_fild02_quest_pecopeco_i_think_i_rest_easily_04793d: "我想我现在可以轻松休息了。"
  npc_override_moc_fild02_quest_pecopeco_if_you_change_your_mind_3f2210: "如果你改变主意，请回来。"
  npc_override_moc_fild02_quest_pecopeco_menu_gather_599c5b: "收集物品:猎杀大嘴鸟:取消"
  npc_override_moc_fild02_quest_pecopeco_menu_i_256156: "我有一些鸟嘴:你需要什么？"
  npc_override_moc_fild02_quest_pecopeco_menu_peco_17ceb4: "50只大嘴鸟:100只大嘴鸟:150只大嘴鸟"
  npc_override_moc_fild02_quest_pecopeco_menu_what_ff50dd: "什么样的帮忙？:不"
  npc_override_moc_fild02_quest_pecopeco_menu_yes_141459: "是:否"
  npc_override_moc_fild02_quest_pecopeco_menu_yes_755efb: "是:否:我想退出"
  npc_override_moc_fild02_quest_pecopeco_now_different_nature_7da31e: "但现在情况不同了。"
  npc_override_moc_fild02_quest_pecopeco_oh_thank_you_so_much_82a4f5: "哦，非常感谢你！"
  npc_override_moc_fild02_quest_pecopeco_ok_then_well_come_back_0e1574: "好的，如果你改变主意就回来这里。"
  npc_override_moc_fild02_quest_pecopeco_peco_pecos_fascinating_6d9971: "大嘴鸟很迷人。"
  npc_override_moc_fild02_quest_pecopeco_please_9ea78a: "请……"
  npc_override_moc_fild02_quest_pecopeco_please_hurry_kill_those_4f0bb0: "请快点杀掉150只那些美味的呃讨厌的大嘴鸟。"
  npc_override_moc_fild02_quest_pecopeco_please_hurry_kill_those_7079cf: "请快点杀掉100只那些美味的呃讨厌的大嘴鸟。"
  npc_override_moc_fild02_quest_pecopeco_please_hurry_kill_those_c6b2f5: "请快点杀掉50只那些美味的呃讨厌的大嘴鸟。"
  npc_override_moc_fild02_quest_pecopeco_thank_you_so_much_6369bf: "非常感谢你。"
  npc_override_moc_fild02_quest_pecopeco_these_animals_collecting_56a6d9: "这些动物通过收集它们的"
  npc_override_moc_fild02_quest_pecopeco_those_picky_s_over_there_5aa7c2: "那边的大嘴鸟似乎和你的实力差不多。"
  npc_override_moc_fild02_quest_pecopeco_you_finished_hunting_pec_0d599b: "你完成猎杀50只大嘴鸟了吗？"
  npc_override_moc_fild02_quest_pecopeco_you_finished_hunting_pec_392eeb: "你完成猎杀150只大嘴鸟了吗？"
  npc_override_moc_fild02_quest_pecopeco_you_help_me_out_bring_ead8ec: "你能帮我带^FF000025个鸟嘴^000000来吗？"
  npc_override_moc_fild02_quest_pecopeco_you_help_protect_me_kill_5d287e: "你能帮我杀掉它们来保护我吗？"
  npc_override_moc_fild02_quest_pecopeco_you_me_favor_please_2e5c05: "你能帮我一个忙吗？"
  npc_override_moc_fild02_quest_pecopeco_you_see_i_ve_been_49bf97: "你看我一直在呃，''研究''"
  npc_override_moc_fild02_quest_pecopeco_you_sure_you_want_stop_507e20: "你确定要停止猎杀吗？"
