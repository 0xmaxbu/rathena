Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_glast_01_OldGlastHeim_merchants_agi_boots_8c0ecb: "敏捷靴"
  npc_override_glast_01_OldGlastHeim_merchants_all_enchant_refine_rates_1c02c1: "而且^FF0000如果失败，所有附魔或精炼等级都会丢失。^000000"
  npc_override_glast_01_OldGlastHeim_merchants_also_you_don_t_lose_89318d: "此外，即使附魔失败你也不会失去物品，我们还保证保留卡片和精炼等级。但我们无法初始化附魔。"
  npc_override_glast_01_OldGlastHeim_merchants_anyways_s_all_basic_ench_6bd0b0: "总之，这就是所有基本附魔信息。现在你应该亲自看看了。"
  npc_override_glast_01_OldGlastHeim_merchants_archery_569af0: "箭术"
  npc_override_glast_01_OldGlastHeim_merchants_arrggg_we_failed_better_35ca51: "啊，我们失败了。下次祝你好运。"
  npc_override_glast_01_OldGlastHeim_merchants_attack_speed_f33d40: "攻击速度"
  npc_override_glast_01_OldGlastHeim_merchants_boots_been_upgraded_as_y_56ce8f: "靴子已按你的要求升级。"
  npc_override_glast_01_OldGlastHeim_merchants_bring_me_temporal_crysta_7f6907: "给我带来^0000FF5个时间水晶^000000，我会尝试为你的高级时间靴子打一个插槽。但是，有^FF0000失败并破坏物品^000000的可能。可以吗？"
  npc_override_glast_01_OldGlastHeim_merchants_bring_temporal_crystal_i_0ef80c: "带来时间水晶物品以兑换各种时间靴子物品。挑选你想要的。"
  npc_override_glast_01_OldGlastHeim_merchants_buy_temporal_boots_need_b5ed38: "购买时空靴（需要 1 个时空水晶）"
  npc_override_glast_01_OldGlastHeim_merchants_cancel_77dfd2: "取消"
  npc_override_glast_01_OldGlastHeim_merchants_come_back_anytime_you_wa_a43c1d: "随时欢迎回来。"
  npc_override_glast_01_OldGlastHeim_merchants_come_back_whenever_you_w_982cd8: "随时欢迎回来。"
  npc_override_glast_01_OldGlastHeim_merchants_cool_let_s_make_deal_9186b7: "酷，我们成交。"
  npc_override_glast_01_OldGlastHeim_merchants_course_th_slot_only_you_1ae7e8: "当然，这只是针对第4个插槽的。你在初期可以获得较小的效果，然后效果会变得越来越强。"
  npc_override_glast_01_OldGlastHeim_merchants_course_you_must_cope_big_c72f37: "当然，每次你想再次附魔时，你必须承担更大的破坏风险。"
  npc_override_glast_01_OldGlastHeim_merchants_dex_boots_a07445: "灵巧靴"
  npc_override_glast_01_OldGlastHeim_merchants_effect_upgrade_239b4e: "效果升级！"
  npc_override_glast_01_OldGlastHeim_merchants_enchant_order_same_as_hu_bdd1b9: "附魔顺序与胡金的魔法大师附魔相同。请参考他的说明。"
  npc_override_glast_01_OldGlastHeim_merchants_enchanting_s_th_slot_as_f05f58: "为^0000FF{0}^000000的第4个插槽附魔^0000FF{1}^000000级效果。需要^0000FF{2}^000000个凝固咒语物品。"
  npc_override_glast_01_OldGlastHeim_merchants_enchanting_socket_s_th_s_c9380b: "为^0000ff{0} (插槽)^000000的第4个插槽附魔^0000ff{1}^000000级效果。需要^0000ff{2} {3}、{4} {5}和{6} z^000000。有一定失败的风险……"
  npc_override_glast_01_OldGlastHeim_merchants_enough_temporal_crystals_992e59: "时间水晶不够。你需要5个时间水晶来升级你的物品。"
  npc_override_glast_01_OldGlastHeim_merchants_exchange_a47d45: "兑换为 {0}"
  npc_override_glast_01_OldGlastHeim_merchants_fighting_spirit_c3bed0: "斗志"
  npc_override_glast_01_OldGlastHeim_merchants_get_final_option_upgrade_77969e: "要获得最终选项升级，需要更多的凝固咒语物品。别忘了这一点。"
  npc_override_glast_01_OldGlastHeim_merchants_give_effect_my_temporal_be1d4d: "给我的时空靴附加效果"
  npc_override_glast_01_OldGlastHeim_merchants_hey_you_lot_if_so_005882: "嘿，你有很多{0}或{1}吗？如果有的话，为什么不和我交换一幅我拥有的精美肖像呢？"
  npc_override_glast_01_OldGlastHeim_merchants_hmm_you_don_t_enough_261391: "嗯，你现在的咒语不够。去获取更多。"
  npc_override_glast_01_OldGlastHeim_merchants_hmm_you_missing_coagulat_ad970d: "嗯，你还差{0}个凝固咒语物品。去获取更多，然后我们可以谈更多附魔。"
  npc_override_glast_01_OldGlastHeim_merchants_hmm_you_missing_items_go_60578a: "嗯，你还差{0} {1}物品。去获取更多，然后我们可以谈更多附魔。"
  npc_override_glast_01_OldGlastHeim_merchants_how_enchanting_work_232154: "附魔是如何工作的？"
  npc_override_glast_01_OldGlastHeim_merchants_i_am_ok_e4182f: "我接受！"
  npc_override_glast_01_OldGlastHeim_merchants_i_been_collecting_portra_4da73c: "我已经收集肖像一年了。现在是向人们展示我的收藏的时候了。"
  npc_override_glast_01_OldGlastHeim_merchants_i_deal_temporal_boots_so_491715: "我只处理带插槽的时间靴子。"
  npc_override_glast_01_OldGlastHeim_merchants_i_don_t_give_out_6c01fe: "我不会随机给予效果。你可以为物品挑选你想要的效果。"
  npc_override_glast_01_OldGlastHeim_merchants_i_enchant_your_temporal_656af2: "我可以根据该物品的数量为你的时间靴子物品附魔。^0000FF不是普通类型的靴子^000000。只有那6种扩展版本靴子才可能。"
  npc_override_glast_01_OldGlastHeim_merchants_i_need_items_temporal_bo_9c41d7: "我需要4件物品。^0000ff{0}、{1}、{2}、时间靴子(插槽)系列^000000。如果你没有这些中的任何一件，我无法帮助你。"
  npc_override_glast_01_OldGlastHeim_merchants_i_think_putting_slot_int_44d977: "我认为给物品打一个插槽是最好的。即使有一些失败的风险。"
  npc_override_glast_01_OldGlastHeim_merchants_i_understand_try_slot_c8af4e: "我明白。试试打孔吧。"
  npc_override_glast_01_OldGlastHeim_merchants_int_boots_f6e56e: "智力靴"
  npc_override_glast_01_OldGlastHeim_merchants_lucky_68bec2: "幸运"
  npc_override_glast_01_OldGlastHeim_merchants_luk_boots_64478b: "幸运靴"
  npc_override_glast_01_OldGlastHeim_merchants_magician_always_says_enc_0ac7af: "那个魔术师总是说给时间靴子附魔是最好的。但是，我的想法 quite 不同。"
  npc_override_glast_01_OldGlastHeim_merchants_ok_come_back_again_when_6150db: "好的，当你确定后再回来。"
  npc_override_glast_01_OldGlastHeim_merchants_ok_come_back_anytime_you_80e331: "好的，随时欢迎回来。"
  npc_override_glast_01_OldGlastHeim_merchants_ok_come_back_when_you_f2629f: "好的，当你准备好时再回来。"
  npc_override_glast_01_OldGlastHeim_merchants_once_again_magician_won_026c93: "再次提醒，^FF0000那个魔术师不会给任何有插槽的物品附魔。^000000"
  npc_override_glast_01_OldGlastHeim_merchants_once_th_slot_completes_b_02e576: "一旦第4个插槽完成最佳选项，你就可以在第3个插槽获得一个随机 bonus 效果。需要……一定的报酬~"
  npc_override_glast_01_OldGlastHeim_merchants_once_you_put_socket_into_fddc17: "但是，一旦你给物品打了插槽，你就不能再附魔它了。请务必记住这一点。"
  npc_override_glast_01_OldGlastHeim_merchants_only_item_you_wearing_up_d18a9f: "只有你在穿的物品才能被升级。"
  npc_override_glast_01_OldGlastHeim_merchants_phew_6a9c9d: "呼……"
  npc_override_glast_01_OldGlastHeim_merchants_quit_1a2285: "退出"
  npc_override_glast_01_OldGlastHeim_merchants_remember_only_those_type_960a7d: "记住，只有那6种时间靴子可以附魔。"
  npc_override_glast_01_OldGlastHeim_merchants_right_item_enchant_f4f62d: "这不是适合这个附魔的正确物品。"
  npc_override_glast_01_OldGlastHeim_merchants_right_item_enchant_remem_b65aa7: "这不是适合这个附魔的正确物品。记住，只有那6种带插槽的时间靴子才能进行隐藏附魔……"
  npc_override_glast_01_OldGlastHeim_merchants_s_my_small_hobby_enchant_130bf4: "这是我的小爱好……使用被污染的凝固咒语给带插槽的时间靴子附魔。"
  npc_override_glast_01_OldGlastHeim_merchants_so_you_came_enchant_temp_d8154b: "那么你是来附魔时间靴子的。请注意，带插槽的靴子不能被附魔，而且这个升级只对你正在穿的靴子可能。"
  npc_override_glast_01_OldGlastHeim_merchants_some_risk_failing_76fd7a: "有一定失败的风险……"
  npc_override_glast_01_OldGlastHeim_merchants_something_wrong_happened_801756: "发生了一些错误。"
  npc_override_glast_01_OldGlastHeim_merchants_spell_2747aa: "法术"
  npc_override_glast_01_OldGlastHeim_merchants_st_enchanting_you_need_c_457303: "对于第1次附魔，你需要^0000FF{0}^000000个凝固咒语物品。"
  npc_override_glast_01_OldGlastHeim_merchants_still_want_proceed_320c47: "仍然想继续吗？"
  npc_override_glast_01_OldGlastHeim_merchants_still_want_risk_7b71ae: "仍然想冒险吗？"
  npc_override_glast_01_OldGlastHeim_merchants_str_boots_72ee1b: "力量靴"
  npc_override_glast_01_OldGlastHeim_merchants_successful_here_you_go_a206d8: "成功！给你。"
  npc_override_glast_01_OldGlastHeim_merchants_sure_04b0c5: "当然"
  npc_override_glast_01_OldGlastHeim_merchants_take_risk_try_add_slot_1512a4: "冒险尝试打孔"
  npc_override_glast_01_OldGlastHeim_merchants_take_these_temporal_boot_85541d: "拿这些时间靴子。我们可以用5个时间水晶升级你的时间靴子。"
  npc_override_glast_01_OldGlastHeim_merchants_th_slot_already_upgraded_bb1c48: "第4个插槽已经升级到最终选项。你想给第3个插槽一个随机 bonus 效果吗？你需要^0000ff{0}^000000个凝固咒语物品。"
  npc_override_glast_01_OldGlastHeim_merchants_these_boots_already_pass_c9bb17: "这些靴子已经超过了附魔限制。我们不能再给它们附魔了。"
  npc_override_glast_01_OldGlastHeim_merchants_think_again_ac047b: "再想想"
  npc_override_glast_01_OldGlastHeim_merchants_trying_2e020a: "正在尝试{0}"
  npc_override_glast_01_OldGlastHeim_merchants_upgrade_modified_boots_n_55fcc3: "升级改装靴（需要 5 个时空水晶）"
  npc_override_glast_01_OldGlastHeim_merchants_upgrade_temporal_boots_n_cf4458: "升级时空靴（需要 5 个时空水晶）"
  npc_override_glast_01_OldGlastHeim_merchants_vit_boots_802d6d: "体力靴"
  npc_override_glast_01_OldGlastHeim_merchants_vitality_be320b: "活力"
  npc_override_glast_01_OldGlastHeim_merchants_want_enchant_37767e: "想给^0000FF{0}^000000附魔吗？"
  npc_override_glast_01_OldGlastHeim_merchants_want_enchant_socket_st_e_777cb3: "想给^0000ff{0} (插槽)^000000附魔吗？对于第1次附魔，你需要^0000ff{1} {2}、{3} {4}和{5} zeny^000000。"
  npc_override_glast_01_OldGlastHeim_merchants_we_need_advanced_tempora_8191c8: "这不是！我们需要^0000FF高级时间靴子^000000物品！^0000FF带有属性效果且没有插槽^000000的物品！"
  npc_override_glast_01_OldGlastHeim_merchants_wear_temporal_boots_you_33a171: "穿上你想升级的^0000FF时间靴子^000000，然后再跟我说话。"
  npc_override_glast_01_OldGlastHeim_merchants_well_ok_come_back_when_48b83d: "好吧，好的。当你准备好时再回来。"
  npc_override_glast_01_OldGlastHeim_merchants_what_you_like_exchange_d638ca: "你想用什么来交换{0}？"
  npc_override_glast_01_OldGlastHeim_merchants_yes_i_am_sure_ff8acf: "是的，我确定。"
  npc_override_glast_01_OldGlastHeim_merchants_you_keep_obtain_coagulat_e81de6: "你可以在旅行途中不断获得^0000FF凝固咒语^000000。"
  npc_override_glast_01_OldGlastHeim_merchants_you_like_random_bonus_ef_5b4e24: "你想给第3个插槽一个随机 bonus 效果吗？你需要^0000ff{0} {1}、{2} {3}和{4} zeny^000000。但有很高的失败风险……"
  npc_override_glast_01_OldGlastHeim_merchants_you_must_bring_temporal_6006c4: "你必须带来^0000FF5个时间水晶物品^000000。你知道，没有什么是免费的……"
  npc_override_glast_01_OldGlastHeim_merchants_you_must_bring_zeny_noth_c1fbdd: "你必须带来^0000ff{0} zeny^000000。你知道，没有什么是免费的……"
  npc_override_glast_01_OldGlastHeim_merchants_you_need_more_temporal_c_68cf86: "你需要更多的时间水晶。当你在旧格拉斯海姆旅行时获得更多时间水晶后再回来。"
  npc_override_glast_01_OldGlastHeim_merchants_you_seem_carrying_too_ma_d53e5a: "你似乎携带了太多物品。把一些物品存放到仓库里再回来。"
  npc_override_glast_01_OldGlastHeim_merchants_you_should_ask_hugin_s_c72c10: "你应该向胡金的魔法大师询问所有基本事项。我想要关于附魔工作的更深入对话。"
  npc_override_glast_01_OldGlastHeim_merchants_you_sure_about_buying_te_538946: "你确定要购买时间 ^FF0000{0}^000000 靴子吗？概不退款。"
  npc_override_glast_01_OldGlastHeim_merchants_you_sure_you_wearing_ite_711fb0: "你确定你穿着这件物品吗？"
  npc_override_glast_01_OldGlastHeim_merchants_you_sure_you_won_t_152811: "你确定你不会后悔吗？"
  npc_override_glast_01_OldGlastHeim_merchants_you_trade_temporal_boots_c6d6c8: "你可以用^0000FF1个时间靴子和5个时间水晶^000000兑换以下物品之一。^FF0000之前的精炼等级不会保留到这些新物品上^000000。"
  npc_override_glast_01_OldGlastHeim_merchants_you_wearing_item_b79b83: "你穿着这件物品吗？"
  npc_override_glast_01_OldGlastHeim_merchants_you_wearing_temporal_boo_da34a5: "你没有穿着时间靴子。穿上它们后再跟我说话。"
  npc_override_glast_01_OldGlastHeim_merchants_your_bag_too_heavy_reduc_55e070: "你的背包太重了。减轻一些重量再回来。"
  npc_override_glast_01_quests_glastheim_alright_just_tell_me_whe_ba625a: "好的，只要告诉我你什么时候想离开。"
  npc_override_glast_01_quests_glastheim_alright_please_come_back_c19388: "好的，请随时改变主意后再回来。我想你会有很多话要跟我说的……"
  npc_override_glast_01_quests_glastheim_i_send_you_two_places_6cea5c: "我可以送你去两个地方。你想让我送你去哪里？"
  npc_override_glast_01_quests_glastheim_i_t_move_between_time_23a111: "我无法像胡金大师那样穿越时空和维度，但我可以假装做到。"
  npc_override_glast_01_quests_glastheim_menu_cancel_9335a2: "取消:修道院墓地 (Lv100~130) - 5000z:2层走廊 (Lv140以上) - 10000z"
  npc_override_glast_01_quests_glastheim_menu_i_2453a9: "我不是故意跟你说话的:请让我离开这里"
  npc_override_glast_01_quests_glastheim_menu_i_604908: "我不在乎:那很有趣，请告诉我更多"
  npc_override_glast_01_quests_glastheim_menu_no_f625c3: "不去探索:我真的想去探索！"
  npc_override_glast_01_quests_glastheim_ok_let_s_get_out_30e7c4: "好的，让我们离开这里。"
  npc_override_glast_01_quests_glastheim_sure_free_service_i_get_acc109: "当然，但这不是免费服务！我必须得到一些回报。呵呵……"
  npc_override_glast_01_quests_glastheim_thanks_hugin_i_found_way_a82eef: "多亏了胡金，我找到了进入这个被强大黑暗力量笼罩的旧格拉斯海姆的方法。"
  npc_override_glast_01_quests_glastheim_well_if_you_interested_n_3a5b3e: "好吧，如果你对此不感兴趣，那就算了。"
  npc_override_glast_01_quests_glastheim_what_did_you_expect_serv_7d8a41: "什么？你以为这个服务是免费的吗？"
  npc_override_glast_01_quests_glastheim_what_s_causing_glast_hei_318b30: "是什么导致格拉斯海姆被如此强大的黑暗力量笼罩？"
  npc_override_glast_01_quests_glastheim_what_you_say_you_want_5f7d3d: "你怎么说？你想去那里探索吗？"
  npc_override_glast_01_quests_glastheim_you_want_return_372aa8: "你想返回吗？"
