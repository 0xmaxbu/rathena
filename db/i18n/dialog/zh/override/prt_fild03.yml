Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_prt_fild03_acolyte_acolyte_applicant_5fdc86: "服事申请者。"
  npc_override_prt_fild03_acolyte_acolyte_applicants_7023f8: "服事申请者……？"
  npc_override_prt_fild03_acolyte_acolyte_applicants_d39fe0: "服事申请者之一。"
  npc_override_prt_fild03_acolyte_ah_5eceea: "啊……！"
  npc_override_prt_fild03_acolyte_ah_i_sense_you_endured_dcc648: "啊，我感觉到你经历了"
  npc_override_prt_fild03_acolyte_ah_you_must_one_acolyte_a1f037: "啊，你一定是服事申请者之一。我真诚地欢迎你。"
  npc_override_prt_fild03_acolyte_always_remember_thankful_c30872: "永远记住要感谢上帝，他一直照顾着我们所有人。在混乱和困难时期，以坚定不移的信仰面对你的艰辛。"
  npc_override_prt_fild03_acolyte_back_valhalla_5a886d: "从瓦尔哈拉回来并"
  npc_override_prt_fild03_acolyte_bad_all_you_ve_made_376c0a: "不错，你从普隆德拉一路走到了这里。你叫什么名字，孩子？"
  npc_override_prt_fild03_acolyte_bad_bad_you_withstood_pe_1a46aa: "不错，不错。你在苦行试炼中表现得相当好。"
  npc_override_prt_fild03_acolyte_farewell_5260b4: "再见。"
  npc_override_prt_fild03_acolyte_first_you_reach_least_no_4390c4: "首先，你必须至少达到初心者职业等级9，并学会所有基础技能。"
  npc_override_prt_fild03_acolyte_good_now_i_give_you_a21cbc: "很好。现在我将给予你成为服事的资格。"
  npc_override_prt_fild03_acolyte_greetings_21e190: "问候。"
  npc_override_prt_fild03_acolyte_hello_there_5a8ec9: "你好~"
  npc_override_prt_fild03_acolyte_hey_44afd2: "嘿……"
  npc_override_prt_fild03_acolyte_hey_5a8841: "嘿。"
  npc_override_prt_fild03_acolyte_hmm_9c4d28: "嗯……"
  npc_override_prt_fild03_acolyte_hmm_your_job_level_enoug_18d773: "嗯……你的职业等级够了……"
  npc_override_prt_fild03_acolyte_how_your_practice_coming_a54150: "你的修行进展如何？我当然希望你在上帝的恩典中享受生活。"
  npc_override_prt_fild03_acolyte_however_i_tell_you_suite_f8c80d: "然而，我看得出你不适合当服事。请记住你前世是谁，并找到你的道路。"
  npc_override_prt_fild03_acolyte_huh_bfd2a5: "{0}，嗯？"
  npc_override_prt_fild03_acolyte_huh_what_brings_you_here_1e2490: "嗯？什么风把你吹来了？对于像你这样的初心者来说，这是个非常危险的地方！"
  npc_override_prt_fild03_acolyte_huh_why_isn_t_your_32585f: "{0}，嗯？为什么你的名字不在我的名单上？"
  npc_override_prt_fild03_acolyte_i_believe_you_ve_been_71a6c3: "我相信马雷乌斯修士已经告诉了你很多关于服事的事情。另外，普隆德拉圣殿里有很多乐于助人的人。"
  npc_override_prt_fild03_acolyte_i_don_t_any_replies_826678: "我没有任何回复。"
  npc_override_prt_fild03_acolyte_i_don_t_think_your_f4d2dc: "我不认为你的名字"
  npc_override_prt_fild03_acolyte_i_guess_there_s_really_30732e: "我想我真的不需要教你太多。而且，我相信你们这一代的人可能很难听一个像我这样的老人说话。哈哈哈~"
  npc_override_prt_fild03_acolyte_i_m_sorry_seems_you_512c63: "很抱歉，但你似乎已经有自己的职业了，不是吗？"
  npc_override_prt_fild03_acolyte_i_pray_god_hope_you_946dd4: "我会向上帝祈祷，希望你早日成为服事。"
  npc_override_prt_fild03_acolyte_i_send_carrier_pigeon_pr_62eb99: "我会送一只信鸽去普隆德拉圣殿。当你回去时，那里的祭司应该已经收到了我的消息。"
  npc_override_prt_fild03_acolyte_i_send_message_sanctuary_dc39f9: "我会给圣殿发消息，确认你，{0}，来拜访我并完成了你的苦行。"
  npc_override_prt_fild03_acolyte_i_sense_you_endured_past_efc20d: "我感觉到你经历了前世。在进入瓦尔哈拉之前，你一定学到了很多东西。"
  npc_override_prt_fild03_acolyte_i_sincerely_welcome_you_d258c5: "我真诚地欢迎你。"
  npc_override_prt_fild03_acolyte_i_ve_sent_carrier_pigeon_9c17fc: "我已经送了一只带着消息的信鸽。希望它能安全到达那里……"
  npc_override_prt_fild03_acolyte_i_wait_until_25cb35: "我会等到"
  npc_override_prt_fild03_acolyte_if_you_like_come_sit_9d2a18: "如果你愿意，过来和我一起坐，冥想伟大的真理。上帝的威严真是令人振奋……"
  npc_override_prt_fild03_acolyte_lastly_i_want_sincerely_24cb3c: "最后，我想真诚地祝贺你坚持完成了苦行试炼。"
  npc_override_prt_fild03_acolyte_let_s_see_4d37ed: "让我看看……"
  npc_override_prt_fild03_acolyte_let_s_see_7d5528: "{0}？让我看看……"
  npc_override_prt_fild03_acolyte_let_s_see_whether_you_51fe4d: "让我看看你准备好了没有……嗯……"
  npc_override_prt_fild03_acolyte_may_god_5c1e1c: "愿上帝"
  npc_override_prt_fild03_acolyte_may_god_afb834: "愿上帝"
  npc_override_prt_fild03_acolyte_meantime_64149e: "与此同时，"
  npc_override_prt_fild03_acolyte_menu_change_6ae975: "转职为服事。:询问成为服事的需求。:放弃。"
  npc_override_prt_fild03_acolyte_most_basic_thing_so_you_aec17b: "这是最基本的事情，所以你需要把它当作训练自己的方式。"
  npc_override_prt_fild03_acolyte_msg_6eae3a: "……"
  npc_override_prt_fild03_acolyte_my_list_b99fa2: "不在我的名单上……"
  npc_override_prt_fild03_acolyte_my_list_hmmm_b001ab: "在我的名单上。嗯……"
  npc_override_prt_fild03_acolyte_new_life_s_journey_a55106: "新生命的旅程。"
  npc_override_prt_fild03_acolyte_novice_de4787: "初心者。"
  npc_override_prt_fild03_acolyte_now_go_back_santuary_fin_342f67: "现在回圣殿去，完成成为服事的手续，孩子。"
  npc_override_prt_fild03_acolyte_now_venture_forth_seek_p_ee6af2: "现在，出发去寻找需要你的人。愿上帝照亮你的道路。"
  npc_override_prt_fild03_acolyte_now_venture_forth_seek_t_45a370: "现在，出发去寻找需要你的人。愿上帝照亮你的道路。"
  npc_override_prt_fild03_acolyte_now_what_your_name_e3e276: "那么，你叫什么名字？"
  npc_override_prt_fild03_acolyte_now_your_name_right_exce_96feca: "那么，你的名字是{0}，对吧？很好，感谢你来拜访我。"
  npc_override_prt_fild03_acolyte_oh_78a2fc: "哦……"
  npc_override_prt_fild03_acolyte_oh_ho_2a847d: "哦嗬……"
  npc_override_prt_fild03_acolyte_oh_my_you_haven_t_51c87c: "天哪？！你还没有完成基础修行？！你还有很长的路要走！提高职业等级后再来吧！"
  npc_override_prt_fild03_acolyte_oh_you_must_one_who_219b67: "哦……？你一定是那个立志成为服事的人。我已经从圣殿收到了你可能会来的消息。"
  npc_override_prt_fild03_acolyte_okay_i_ll_send_message_fbf3aa: "好的。我会给圣殿发消息，说你，{0}，来拜访我了。"
  npc_override_prt_fild03_acolyte_past_life_experience_you_21f232: "前世经历。在进入瓦尔哈拉之前，你一定学到了很多东西。"
  npc_override_prt_fild03_acolyte_perhaps_you_should_retur_e187e8: "也许你应该回普隆德拉圣殿，重新查看你苦行试炼的目的地。"
  npc_override_prt_fild03_acolyte_please_return_prontera_s_9721d6: "请回普隆德拉圣殿，与负责的祭司交谈。"
  npc_override_prt_fild03_acolyte_please_take_care_they_sh_fce1e0: "请保重。当你到达普隆德拉圣殿时，他们应该知道你已经见过我了。"
  npc_override_prt_fild03_acolyte_right_d016e9: "对吧？"
  npc_override_prt_fild03_acolyte_seems_your_name_1f25d2: "似乎你的名字"
  npc_override_prt_fild03_acolyte_so_what_s_your_name_02fb09: "那么你叫什么名字？"
  npc_override_prt_fild03_acolyte_still_lessons_may_come_p_ddaa43: "不过，教训可能来自你最意想不到的地方。上帝喜欢用奇怪的方式教导他的孩子。你会明白的。"
  npc_override_prt_fild03_acolyte_then_you_must_fulfill_fo_b0ac7d: "那么，你必须完成以下要求，把这些当作上帝给你的修行。"
  npc_override_prt_fild03_acolyte_there_something_89eb1e: "有些"
  npc_override_prt_fild03_acolyte_unfortunately_i_don_t_th_839768: "很遗憾，我认为你还没有准备好成为服事。请先完成所有基础技能的学习。"
  npc_override_prt_fild03_acolyte_welcome_deep_feel_free_s_b82422: "欢迎来到深处。请随意坐下，和我一起思考上帝的信息。这个地方很美，即使危险伴随着它的宁静……"
  npc_override_prt_fild03_acolyte_well_i_ll_send_message_2cbdb8: "好的，我会发消息告诉他们你来拜访我了。所以，你现在可以回普隆德拉圣殿了。"
  npc_override_prt_fild03_acolyte_well_i_welcome_you_f14a78: "好的，我欢迎你"
  npc_override_prt_fild03_acolyte_what_be65b9: "什么？"
  npc_override_prt_fild03_acolyte_what_you_seek_ffeba9: "你在寻找什么？"
  npc_override_prt_fild03_acolyte_what_your_name_let_s_9974c2: "你叫什么名字？{0}？让我看看……啊，你在我的名单上。"
  npc_override_prt_fild03_acolyte_whatever_you_9dd7d9: "无论你是什么，"
  npc_override_prt_fild03_acolyte_when_you_think_you_fulfi_e43f12: "当你认为你已经完成了这个要求，然后再来找我。然后你将拥有一份神圣的职业，可以传播上帝的旨意。"
  npc_override_prt_fild03_acolyte_whoever_you_please_take_5d5cfb: "无论你是谁，请保重。这里的怪物与它们可爱的外表相反，强得惊人。"
  npc_override_prt_fild03_acolyte_why_don_t_you_go_ef5a42: "你为什么不回普隆德拉圣殿再检查一下？"
  npc_override_prt_fild03_acolyte_wish_you_luck_your_79cf57: "祝你好运，在你的"
  npc_override_prt_fild03_acolyte_you_17664a: "与你同在……"
  npc_override_prt_fild03_acolyte_you_73b785: "与你同在。"
  npc_override_prt_fild03_acolyte_you_any_more_business_me_74e1f2: "你还有什么事要找我吗？！没有！现在回圣殿去！"
  npc_override_prt_fild03_acolyte_you_anything_say_because_800ece: "你有什么要说的吗？因为不幸的是，"
  npc_override_prt_fild03_acolyte_you_c09be9: "你……"
  npc_override_prt_fild03_acolyte_you_come_into_deep_here_26bc3e: "你是来这里深处修行的吗？还是只是一个流浪者？"
  npc_override_prt_fild03_acolyte_you_feeling_okay_today_i_e10ebb: "你今天感觉还好吗？我从你的穿着可以看出你已经是一名服事了。你不是在开玩笑吧？"
  npc_override_prt_fild03_acolyte_you_look_like_acolyte_ap_145600: "你看起来像个服事申请者。我说得对吗？"
  npc_override_prt_fild03_acolyte_you_look_like_e00e24: "你看起来像个"
  npc_override_prt_fild03_acolyte_you_must_one_4b935d: "你一定是"
  npc_override_prt_fild03_acolyte_you_one_7bbfc3: "你是"
  npc_override_prt_fild03_acolyte_you_probably_made_mistak_c441dd: "你可能搞错了。回圣殿去，和主教确认一下。"
  npc_override_prt_fild03_acolyte_you_ready_c9a0a2: "你准备好了。"
  npc_override_prt_fild03_acolyte_you_truly_wish_become_se_8d5074: "你真的希望成为上帝的仆人吗？"
  npc_override_prt_fild03_acolyte_you_wanna_tell_me_ca0940: "你想告诉我？"
  npc_override_prt_fild03_acolyte_you_wish_become_acolyte_3ea9e9: "你希望成为服事吗？"
  npc_override_prt_fild03_acolyte_your_name_ce3cd6: "你的名字是{0}？"