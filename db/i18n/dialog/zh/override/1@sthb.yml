  npc_override_1@sthb_SkyFortress_memorial_dungeon_doesn_t_d50fd3: "纪念地下城 {0} 不存在。"
  npc_override_1@sthb_SkyFortress_menu_earnest_3ad4e6: "厄内斯特: 渺小……人类……新手……走开……"
  npc_override_1@sthb_SkyFortress_menu_earnest_4ec3ef: "厄内斯特: 一群危险的虫子……！"
  npc_override_1@sthb_SkyFortress_menu_earnest_c69757: "厄内斯特: 肮脏的人类……阻止他们……守卫……神圣的要塞……"
  npc_override_1@sthb_SkyFortress_menu_earnest_d98850: "厄内斯特: 肮脏的虫子……无法按本意生活……不朽的力量……我的身体……"
  npc_override_1@sthb_SkyFortress_menu_earnest_db55bd: "厄内斯特: 我很生气……太吵了……我要把它们全部消灭……"
  npc_override_1@sthb_SkyFortress_menu_immortal_2405d5: "不朽的诅咒骑士: 我……我好像控制不住这股力量！"
  npc_override_1@sthb_SkyFortress_menu_immortal_51fe05: "不朽的风幽灵: 愚蠢的人类……你在祈求死亡……"
  npc_override_1@sthb_SkyFortress_menu_immortal_5f2a35: "不朽的风幽灵: 体内沸腾的力量……感觉真好……"
  npc_override_1@sthb_SkyFortress_menu_immortal_609316: "不朽的风幽灵: 我感觉体内充满了更多的力量……"
  npc_override_1@sthb_SkyFortress_menu_immortal_668f05: "不朽的诅咒骑士: 凡人在不朽骑士面前不过是一抔灰烬！"
  npc_override_1@sthb_SkyFortress_menu_immortal_74a206: "不朽的风幽灵: 敢反抗我的人类只有死路一条……"
  npc_override_1@sthb_SkyFortress_menu_immortal_94ecd5: "不朽的诅咒骑士: 贪图要塞财宝的小偷必将灭亡……"
  npc_override_1@sthb_SkyFortress_menu_immortal_a995d7: "不朽的风幽灵: 我会慢慢地杀了你……从你的肺深处……"
  npc_override_1@sthb_SkyFortress_menu_immortal_b81a13: "不朽的诅咒骑士: 是什么样的入侵者试图唤醒我……"
  npc_override_1@sthb_SkyFortress_menu_immortal_f95b95: "不朽的诅咒骑士: 荣耀归于碧珠！入侵者必死！"
  npc_override_1@sthb_SkyFortress_menu_jack_88db20: "杰克: 碧珠……告诉我要……阻止入侵者……"
  npc_override_1@sthb_SkyFortress_menu_jack_9394db: "杰克: 我必须……服从……碧珠的命令……"
  npc_override_1@sthb_SkyFortress_menu_jack_9914a9: "杰克: 我受伤了……我害怕……我鼓起勇气……我打你……"
  npc_override_1@sthb_SkyFortress_menu_options_0b16bc: "{0} : 它对我非常警惕。"
  npc_override_1@sthb_SkyFortress_menu_options_10fa70: "{0} : 我最好先击败它。"
  npc_override_1@sthb_SkyFortress_menu_options_285fe2: "{0} : 碧珠？所以魔像只是这里的守卫？是这样吗……？"
  npc_override_1@sthb_SkyFortress_menu_options_449575: "{0} : 所以终于到最后了……我想他一定是普隆德拉入侵的罪魁祸首，不是吗？"
  npc_override_1@sthb_SkyFortress_menu_options_4d47f6: "{0} : 什……什么？"
  npc_override_1@sthb_SkyFortress_menu_options_75bd4a: "{0} : 那是魔像的痕迹！"
  npc_override_1@sthb_SkyFortress_menu_options_78cb36: "{0} : 这就是导致普隆德拉入侵的原因？在天空要塞里面？"
  npc_override_1@sthb_SkyFortress_menu_options_85ca7d: "{0} : 我们往顶部走吧！我相信那里一定有什么东西。"
  npc_override_1@sthb_SkyFortress_menu_options_8a6e30: "{0} : 里面到底发生了什么？"
  npc_override_1@sthb_SkyFortress_menu_options_bce98a: "{0} : 你可能碰到了什么不该碰的东西……"
  npc_override_1@sthb_SkyFortress_menu_options_c53e07: "{0} : 那是什么……巨大的肿块？"
  npc_override_1@sthb_SkyFortress_menu_options_d8d7d1: "{0} : 我觉得如果我们继续跟着走，一定会有所发现"
  npc_override_1@sthb_SkyFortress_menu_options_e164d0: "{0} : 我相信那个巨大的魔像在天空要塞中扮演着重要角色。"
  npc_override_1@sthb_SkyFortress_menu_party_2e5e7f: "队伍名称: {0}"
  npc_override_1@sthb_SkyFortress_menu_party_8c7899: "队伍队长: {0}"
  npc_override_1@sthb_SkyFortress_menu_stefan_0cdc18: "斯特凡: ~呻吟~ ~咆哮~"
  npc_override_1@sthb_SkyFortress_menu_stefan_2bdba2: "斯特凡 杰克 厄内斯特 沃尔夫: 倒下了……不朽的诅咒骑士……悲伤……会杀……入侵者……"
  npc_override_1@sthb_SkyFortress_menu_stefan_315ec7: "斯特凡: ~咕哝~"
  npc_override_1@sthb_SkyFortress_menu_stefan_3862f5: "斯特凡 杰克 厄内斯特 沃尔夫: 守卫……天空要塞……不朽……生物……"
  npc_override_1@sthb_SkyFortress_menu_stefan_420bea: "斯特凡 杰克 厄内斯特 沃尔夫: 士兵们……碧珠的……要塞……全部砍倒……我会站出来……我会杀了他们……全部……"
  npc_override_1@sthb_SkyFortress_menu_stefan_56050f: "斯特凡 杰克 厄内斯特 沃尔夫: 我会摧毁你……我会粉碎你……来吧，诅咒士兵们……地动山摇……"
  npc_override_1@sthb_SkyFortress_menu_stefan_6bc8b3: "斯特凡 杰克 厄内斯特 沃尔夫: 回来了……碧珠的力量……永恒的身体……再次……"
  npc_override_1@sthb_SkyFortress_menu_stefan_6ead2a: "斯特凡 杰克 厄内斯特 沃尔夫: 诅咒士兵们……来吧……放马过来……"
  npc_override_1@sthb_SkyFortress_menu_stefan_8c8a25: "斯特凡 杰克 厄内斯特 沃尔夫: 死了……我曾经……但是……我不会死……"
  npc_override_1@sthb_SkyFortress_menu_stefan_a54579: "斯特凡 杰克 厄内斯特 沃尔夫: 神圣的要塞……入侵者……多么邪恶……阻止他们……"
  npc_override_1@sthb_SkyFortress_menu_stefan_b0cb28: "斯特凡 杰克 厄内斯特 沃尔夫: 强大……冒险者…… ~咆哮~ 我的……士兵们……出去……"
  npc_override_1@sthb_SkyFortress_menu_stefan_ca46b2: "斯特凡 杰克 厄内斯特 沃尔夫: 实验……变得更强……不朽的风幽灵……死了……全部去死……"
  npc_override_1@sthb_SkyFortress_menu_stefan_e3285b: "斯特凡: ~咆哮~"
  npc_override_1@sthb_SkyFortress_menu_wolf_2013e3: "沃尔夫: 冒险者们……一群愚蠢的新手……"
  npc_override_1@sthb_SkyFortress_menu_wolf_5fc030: "沃尔夫: 要塞里的所有下属……入侵者……阻止他们……碧珠的命令……"
  npc_override_1@sthb_SkyFortress_menu_wolf_606f00: "沃尔夫: 别想逃……靠近点……我会杀了你们……"
  npc_override_1@sthb_SkyFortress_menu_wolf_d615b9: "沃尔夫: 入侵者……天空要塞……"
