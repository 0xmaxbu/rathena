  npc_override_payon_in03_fortune_you_should_live_aspect_m_1cbd8f: " 你应该带着那种想法生活。"
  npc_override_payon_in03_fortune_you_should_prepare_your_06f2e3: " 你应该为你的未来做准备。 "
  npc_override_payon_in03_fortune_you_should_so_concerned_0741b4: " 你也不应该太担心金钱和财产。 "
  npc_override_payon_in03_fortune_you_should_take_shot_you_18851c: " 你应该试一试。你没什么可失去的。 "
  npc_override_payon_in03_fortune_you_son_future_hmm_what_73e5d3: " 你将来会有一个儿子。嗯？你说什么？没有生孩子的计划？ "
  npc_override_payon_in03_fortune_you_sure_you_returned_ev_b077b9: " 你确定你已经归还了所有借来的东西吗？最好在受到惩罚之前处理好一切。 "
  npc_override_payon_in03_fortune_you_surely_get_money_hmm_10b811: " 但你肯定会得到钱的。嗯…… "
  npc_override_payon_in03_fortune_you_too_should_look_afte_66901f: " 你，也应该照顾好自己，不要只工作。你有很多隐藏的价值。 "
  npc_override_payon_in03_fortune_you_understand_what_i_me_f6ec62: " 你明白我的意思吗，年轻人？ "
  npc_override_payon_in03_fortune_you_ve_been_told_your_11cb01: " 你已经被告知了你的学习运势！是个好运势吗？ "
  npc_override_payon_in03_fortune_you_ve_got_give_him_d042ab: " 但你得承认他的大胆。 "
  npc_override_payon_in03_fortune_you_very_busy_future_tak_a38b01: " 你的未来非常忙碌！注意你的健康！ "
  npc_override_payon_in03_fortune_you_want_love_as_well_920f7b: " 如果你也想要爱情，为什么不接受牌的建议，先做好准备呢？ "
  npc_override_payon_in03_fortune_you_want_protect_your_as_77a59f: " 如果你想保护你的财产，小心西方。 "
  npc_override_payon_in03_fortune_you_your_friend_encounte_19e129: " 你和你的朋友会遇到困难！联合你们的力量克服它！ "
  npc_override_payon_in03_fortune_young_one_you_gather_muc_ef544c: " 年轻人，你会收集很多财富。 "
  npc_override_payon_in03_fortune_your_case_wise_grow_your_bf0ebd: " 在你的情况下，培养你的幽默感是明智的。 "
  npc_override_payon_in03_fortune_your_fortune_rather_good_41081d: " 你的运势相当好。这个世界上有些人得到了更可怕的运势。 "
  npc_override_payon_in03_fortune_your_friend_danger_you_m_8c5f42: " 你的朋友有危险！你必须帮助你的朋友！ "
  npc_override_payon_in03_fortune_your_friend_hit_you_don_539aab: " 你的朋友打了你！即使疼也不要哭！快点和好！ "
  npc_override_payon_in03_fortune_your_friendship_verge_fa_5e9900: " 你们的友谊正处于破裂的边缘！为你的友谊施放护盾！ "
  npc_override_payon_in03_fortune_your_future_self_encount_71fd4e: " 你未来的自己会遇到一堵高墙！虽然，我不确定那可能是什么类型的建筑！ "
  npc_override_payon_in03_fortune_your_grades_danger_you_m_f0bd47: " 你的成绩有危险！你必须更努力学习！ "
  npc_override_payon_in03_fortune_your_head_seems_heavy_be_264311: " 你的头因为学习而看起来很重！你需要转移注意力！暂时把学习放在一边！ "
  npc_override_payon_in03_fortune_your_heart_ready_young_o_85be84: " 你的心准备好了吗，年轻人？ "
  npc_override_payon_in03_fortune_your_love_going_crisis_p_b881e5: " 你的爱情即将面临危机！保护你的爱情！ "
  npc_override_payon_in03_fortune_your_love_needs_fresh_bl_344540: " 你的爱情需要新鲜血液。健康的运动和饮食习惯是必要的！ "
  npc_override_payon_in03_fortune_your_love_right_now_so_716af8: " 你现在的爱情无聊到在打哈欠。何不尝试一些新鲜的东西？ "
  npc_override_payon_in03_fortune_your_loved_one_t_worse_67ad4a: " 你的爱人不会比玩偶更差吧？ "
  npc_override_payon_in03_fortune_your_misunderstandings_r_370006: " 如果你花时间交谈，你们的误会就会消除！去和你的朋友谈谈！ "
  npc_override_payon_in03_fortune_your_relationship_must_v_83df9e: " 你们的关系一定很幸福，因为看起来你们两个在云中飞翔！非常嫉妒！ "
  npc_override_payon_in03_fortune_your_strength_enough_6be315: " 你的力量不够。 "
  npc_override_payon_in03_fortune_your_tendency_spend_mone_4b31c3: " 你花钱的倾向在增长！小心！不要两手空空！ "
  npc_override_payon_in03_fortune_your_tooth_become_gold_t_89fec9: " 你的牙齿会变成金牙？！ "
  npc_override_payon_in03_fortune_youth_eternal_one_point_f82363: " 青春不是永恒的。有一天当你醒来时，你发现自己已经是一个中年工人了。 "
  npc_override_payon_in03_fortune_z_each_fortune_shall_we_85caf1: " 每次运势1000z！我们开始吗？"
