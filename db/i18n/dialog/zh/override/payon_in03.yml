  npc_override_payon_in03_fortune_which_better_5afea5: " 哪个更好？ "
  npc_override_payon_in03_fortune_who_he_so_fiercly_gazing_57c8f8: " 他用那强壮的肌肉如此凶猛地凝视着谁？他肯定在看着别人。 "
  npc_override_payon_in03_fortune_who_knows_key_future_may_d22453: " 谁知道呢，未来的关键可能就在东方。 "
