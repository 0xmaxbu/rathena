  npc_override_payon_in03_fortune_wound_isn_t_cured_soon_1cc01d: " 如果伤口不尽快愈合，就会变成阿努比斯想要的那样。 "
  npc_override_payon_in03_fortune_you_able_approach_them_r_d920eb: " 你能不管不顾地接近他们吗？要做到这一点，你必须准备好你的心……嗯…… "
  npc_override_payon_in03_fortune_you_afraid_look_into_dol_03ca0c: " 如果你害怕看玩偶的眼睛，那是因为有一片黑暗的阴影笼罩着你的爱情。 "
