  npc_override_payon_in03_fortune_you_must_work_hard_becom_41aa1f: " 你必须努力工作才能变得富有。不要想其他事情。简单地专注于你的目标并为之努力会有帮助。 "
  npc_override_payon_in03_fortune_you_must_work_hard_becom_8faa1a: " 你必须努力工作才能变得富有。不要想其他事情……专注于并为实现你的目标而努力。 "
