Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_payon_in03_fortune_act_little_more_wisdom_y_44a027: " 为了你的未来，行事要多一些智慧。 "
  npc_override_payon_in03_fortune_act_wisely_you_ll_troubl_bb66ea: " 明智地行事吧！如果你轻易被骗，你会有麻烦的！ "
  npc_override_payon_in03_fortune_agh_don_t_die_studying_468c63: " 啊！别学到死！学的时候也要休息！你需要休息！ "
  npc_override_payon_in03_fortune_agh_someone_after_your_p_0c1e33: "啊！有人盯上了你的财产！小心！ "
  npc_override_payon_in03_fortune_agh_you_re_about_give_f94416: " 啊！你快要为爱人献出灵魂了！收敛一点！ "
  npc_override_payon_in03_fortune_agh_you_suffering_becaus_810783: " 啊！你正因为朋友而受苦！试着敞开心扉，宽容一些！ "
  npc_override_payon_in03_fortune_ah_f23635: "啊……？！"
  npc_override_payon_in03_fortune_ah_sexy_rival_appeared_d_e52f32: " 啊！一个性感的对手出现了！别被分心！ "
  npc_override_payon_in03_fortune_ah_so_05dae4: " 啊~原来如此！ "
  npc_override_payon_in03_fortune_ah_there_noble_person_up_1a9e49: " 啊……北边有一位贵人。北边就是北边。这个方向永远不会改变。 "
  npc_override_payon_in03_fortune_ah_your_friend_gone_craz_3dcad0: " 啊！你的朋友疯了！他们需要友情的治愈！ "
  npc_override_payon_in03_fortune_all_all_big_fortune_righ_166302: " 总而言之，一笔巨大的财富就在你眼前。我很期待。 "
  npc_override_payon_in03_fortune_all_you_young_one_theref_54e94d: " 这些都是为了你，年轻人。因此，遵循这个运势，摆脱虚伪。 "
  npc_override_payon_in03_fortune_also_bad_influence_your_d14cc7: " 而且，它也会对你的人生产生不良影响！ "
  npc_override_payon_in03_fortune_always_challenge_others_63e09e: " 永远要挑战他人！失败也没关系，因为挑战本身就会成为人生。 "
  npc_override_payon_in03_fortune_always_too_much_freedom_3f5823: " 不总是这样！太多的自由会导致自我放纵！ "
  npc_override_payon_in03_fortune_am_i_cheesy_i_m_e7483c: " 我很俗套吗？我就是这样的！那么，再见~~~~了~~~了~~~~！！ "
  npc_override_payon_in03_fortune_anger_only_exhausts_you_8b5798: " 愤怒只会让你精疲力竭。远离愤怒，与笑话为友。杰克说的。 "
  npc_override_payon_in03_fortune_anubis_doesn_t_like_foul_957b95: " 阿努比斯不喜欢粗俗的语言。你没有说脏话吧？ "
  npc_override_payon_in03_fortune_anubis_giving_warning_we_36199b: " 阿努比斯正在发出西方的警告。那里有一个存在，可以夺走你的财富。 "
  npc_override_payon_in03_fortune_anubis_god_death_express_a9e2b3: " 阿努比斯是死神，但它对死亡之外的未来更感兴趣。 "
  npc_override_payon_in03_fortune_anubis_hates_those_who_t_34129c: " 阿努比斯讨厌那些为死亡攒钱的人。它认为那是浪费金钱。不要犯为死亡攒钱的错误。 "
  npc_override_payon_in03_fortune_anubis_likes_comedy_desp_4da231: " 阿努比斯喜欢喜剧，尽管人们不这么认为。它期待喜剧。喜剧在未来一定很重要。 "
  npc_override_payon_in03_fortune_anubis_must_like_being_b_2218d6: " 阿努比斯最近一定不喜欢忙碌。 "
  npc_override_payon_in03_fortune_anubis_says_careful_dark_54cefb: " 阿努比斯说小心黑暗。在黑暗中，死亡潜伏在暗处。 "
  npc_override_payon_in03_fortune_anubis_says_no_interest_dc4893: " 阿努比斯说它对你不感兴趣。这是个好兆头。 "
  npc_override_payon_in03_fortune_anubis_very_interested_s_1e2c43: " 阿努比斯对所献祭的祭品非常感兴趣。它喜欢的祭品是青春和努力。 "
  npc_override_payon_in03_fortune_anubis_warning_you_hatre_dd8f38: " 阿努比斯正在警告你关于仇恨。仇恨只会带来死亡。 "
  npc_override_payon_in03_fortune_any_ideas_who_may_8490d4: " 你知道可能是谁吗？ "
  npc_override_payon_in03_fortune_anyhow_cruelty_harm_you_78caca: " 无论如何，残忍肯定会伤害你。小心点。 "
  npc_override_payon_in03_fortune_anyhow_you_should_avoid_e3763d: " 无论如何，你应该避免鲁莽驾驶……如果骑士都这么说，那就是个大问题了。 "
  npc_override_payon_in03_fortune_anything_your_friend_all_1f9966: " 为你的朋友做任何事！全心全意！你的朋友会很高兴的！ "
  npc_override_payon_in03_fortune_anyways_he_jealous_human_ce5cbc: " 总之，他嫉妒那些在历史上留下名字的人类。 "
  npc_override_payon_in03_fortune_anyways_search_type_mone_cf2304: " 总之，去寻找那种类型的钱吧。 "
  npc_override_payon_in03_fortune_approach_them_more_since_57b827: " 以更真诚和体贴的态度接近他们。 "
  npc_override_payon_in03_fortune_approach_then_affection_54b03b: " 带着感情去接近。 "
  npc_override_payon_in03_fortune_aren_t_you_already_caugh_4be965: " 你不是已经陷入无法逃脱的爱情了吗？看看你周围。 "
  npc_override_payon_in03_fortune_arrogance_takes_away_res_1a0bf5: " 傲慢会夺走那份尊重。巴风特讨厌那种傲慢。 "
  npc_override_payon_in03_fortune_as_jack_s_advice_says_b2f268: " 正如杰克的建议所说，靠近轻松的钱。更安全、更好。 "
  npc_override_payon_in03_fortune_as_you_quench_your_thirs_38fa5c: " 就像你可以在干燥的沙漠中解渴一样，在这个艰难的世界里你也能赚到钱！ "
  npc_override_payon_in03_fortune_attack_love_you_need_str_f0a525: " 用爱情去攻击……你需要更强的攻击……嗯…… "
  npc_override_payon_in03_fortune_attitude_reflecting_upon_64443c: " ……带着反思自我的态度。你觉得呢？你不觉得你看向未来的时间太多了吗？ "
  npc_override_payon_in03_fortune_aware_wings_wings_symbol_24917b: " 小心翅膀。翅膀象征着飞翔、冒险和冒险者的不定性。 "
  npc_override_payon_in03_fortune_bad_result_may_come_your_146cd8: " 坏结果可能会降临到你身上。 "
  npc_override_payon_in03_fortune_bah_don_t_laugh_about_6c2e46: " 呸，别笑！这是一个严肃的警告。 "
  npc_override_payon_in03_fortune_bah_isn_t_time_think_178b1a: " 呸！现在不是想钱的时候。冷静下来，放松心情！ "
  npc_override_payon_in03_fortune_baphomet_doesn_t_care_ab_dd0d30: " 巴风特不在乎人类的未来。它们只是静静地观察。嗯……看起来它对你的未来也没什么可说的…… "
  npc_override_payon_in03_fortune_baphomet_facing_future_n_b3e92e: " 巴风特正面向未来。无论你付出多少努力，如果没有看向未来的眼光，一切都是徒劳。 "
  npc_override_payon_in03_fortune_baphomet_like_tribute_he_d44a71: " 巴风特想要贡品。它说你如果这样做，它会回报你巨大的利益。 "
  npc_override_payon_in03_fortune_baphomet_looks_as_having_7afb50: " 这个巴风特看起来过得很艰难。那个人即使看起来不累，也一定筋疲力尽了。 "
  npc_override_payon_in03_fortune_baphomet_says_beware_whe_b922ea: " 巴风特说，在干预他人事务时要小心。 "
  npc_override_payon_in03_fortune_baphomet_says_humans_no_6eba44: " 巴风特说人类没有未来。它说人类的贪婪和自私没有希望。 "
  npc_override_payon_in03_fortune_baphomet_says_nothing_sa_638c66: " 巴风特说它没什么可说的。我想知道为什么？这不是个很好的兆头吗？！！ "
  npc_override_payon_in03_fortune_baphomet_telling_you_loo_6ee773: " 巴风特告诉你要看向未来。 "
  npc_override_payon_in03_fortune_baphomet_warning_about_a_49d8de: " 巴风特正在警告关于傲慢。即使是强大而智慧的战士，也必须对巴风特表示尊重，"
  npc_override_payon_in03_fortune_baphomet_warning_about_l_b7baa8: " 巴风特正在警告关于因懒惰而停止磨镰刀的懒惰。 "
  npc_override_payon_in03_fortune_bear_mind_7113ca: " 记住这一点。 "
  npc_override_payon_in03_fortune_bear_mind_then_until_we_69adbd: " 记住这一点！那么，直到我们再次相见……*噗*！ "
  npc_override_payon_in03_fortune_beauty_only_skin_deep_4dd873: " 美丽只是肤浅的。 "
  npc_override_payon_in03_fortune_because_there_curse_medu_052432: " 因为可能会有美杜莎的诅咒。 "
  npc_override_payon_in03_fortune_because_they_find_their_98ae71: " 因为他们在过程中找到了生命的意义。年轻人，何不也去寻找你生命的意义？ "
  npc_override_payon_in03_fortune_become_lord_you_need_col_d3ac3a: " 要成为领主，你需要同伴。你应该听取兽人领主的建议！ "
  npc_override_payon_in03_fortune_become_pirate_love_simpl_2813ff: " 成为爱情的海盗！这是一个简单但强大的运势！ "
  npc_override_payon_in03_fortune_become_rich_you_must_wor_d79990: " 要变得富有，你必须像变成骷髅一样努力工作。骷髅说要努力工作直到你变成骷髅。 "
  npc_override_payon_in03_fortune_before_bulls_used_though_84b47f: " 以前，牛被认为是愚蠢而诚实的工人，但现在的牛是强大而优秀的战士。 "
  npc_override_payon_in03_fortune_being_close_friends_desp_25ffe6: " 尽管有差异仍是亲密的朋友，这才是真正的友谊！包容彼此的差异！ "
  npc_override_payon_in03_fortune_being_greedy_taking_care_829a55: " 不贪婪，照顾好自己的份额，是管理财富最明智的方式。 "
  npc_override_payon_in03_fortune_bull_honest_worker_cries_7b9db8: " 牛是诚实的工人，即使在工作时也会哭泣。它知道即使在表达悲伤时，也不能对必须做的事懒惰。 "
  npc_override_payon_in03_fortune_bull_s_thought_your_fort_f9d645: " 这是牛的想法，也是你的运势。 "
  npc_override_payon_in03_fortune_bull_thinks_happiness_aw_96e668: " 牛想着未来等待着的幸福，但它不喜欢因为幸福而降低效率。 "
  npc_override_payon_in03_fortune_bull_warning_about_ignor_b2259f: " 牛正在警告关于对危机的无知。 "
  npc_override_payon_in03_fortune_bull_warning_about_meat_379d81: " 牛正在警告关于注水牛肉的肉。 "
  npc_override_payon_in03_fortune_bull_warning_something_m_8bd865: " 牛正在警告一些会让生活悲伤的事情。 "
  npc_override_payon_in03_fortune_bull_warns_corruption_la_165f9e: " 牛警告腐败。一个不勤奋的懒惰享乐主义者。 "
  npc_override_payon_in03_fortune_bulls_continue_work_even_745c57: " 牛即使在阴郁的日子里也继续工作。然后它们能收集到很多东西。 "
  npc_override_payon_in03_fortune_bulls_leave_leather_when_427c19: " 牛死后会留下皮革吗？还是老虎？ "
  npc_override_payon_in03_fortune_bulls_like_working_money_26dc4c: " 牛不喜欢为钱工作。当别人把劳动当作金钱时，它们会不高兴。 "
  npc_override_payon_in03_fortune_bulls_only_know_how_work_f9c98d: " 牛只知道如何工作，但牛本身有很多可以提供的东西。肉、皮革、角…… "
  npc_override_payon_in03_fortune_business_looking_into_fu_048066: " 一个面向未来的生意？ "
  npc_override_payon_in03_fortune_calls_its_loved_one_they_06c0f8: " 它呼唤着爱人，但他们听不见…… "
  npc_override_payon_in03_fortune_card_expects_something_l_3e2e37: " 这张牌期待你做到类似的事情。 "
  npc_override_payon_in03_fortune_card_only_shows_gaunt_bo_134fc4: " 这张牌只显示出瘦骨嶙峋的骨头，但注意到它有所有必要的工具了吗？"
  npc_override_payon_in03_fortune_card_reading_only_readin_adcd2b: " 占卜只是占卜……无论结果多么非凡，都不要太过沉迷。记住这一点。 "
  npc_override_payon_in03_fortune_card_saying_3f87b4: " 这张牌是这样说的。 "
  npc_override_payon_in03_fortune_card_says_you_should_too_de6d28: " 这张牌说你不应该太贪婪，因为那可能会让你自掘坟墓。 "
  npc_override_payon_in03_fortune_card_supports_strong_lov_b86a39: " 这张牌支持强烈的爱情。 "
  npc_override_payon_in03_fortune_card_telling_me_fly_your_6ee4bd: " 这张牌告诉我，'像蝴蝶一样飞向你的爱人，像流星一样射向它。' "
  npc_override_payon_in03_fortune_card_warning_you_treat_y_efa4a0: " 这张牌警告你不要把爱人当作傀儡。 "
  npc_override_payon_in03_fortune_careful_kind_cell_stuck_11850a: " 小心不要让那种细胞粘在你身上。 "
  npc_override_payon_in03_fortune_careful_lose_your_assets_3c92f9: " 小心不要丢失你的财产。好好保管你的钱包。 "
  npc_override_payon_in03_fortune_careful_shoveling_you_mi_5a0447: " '小心铲土'……你可能会被铲子打到。你应该小心建筑工地吗？ "
  npc_override_payon_in03_fortune_careful_when_jack_speaks_281044: " 小心。当杰克这样说话时，他的玩心已经消失了。 "
  npc_override_payon_in03_fortune_careful_word_god_death_f41436: " 小心。这是死神的话语。 "
  npc_override_payon_in03_fortune_carefully_worn_their_hea_3af128: " 如果它被精心佩戴，你就能从中看到他们对你的心意…… "
  npc_override_payon_in03_fortune_cautious_9580bb: "要小心。 "
  npc_override_payon_in03_fortune_cautious_death_death_you_e0dc6d: " 小心死亡……可能是轮到你，也可能是别人。 "
  npc_override_payon_in03_fortune_charisma_sweetest_poison_d8f61d: " 魅力……是最甜蜜的毒药。 "
  npc_override_payon_in03_fortune_check_see_if_there_aspec_916d90: " 检查看看你的生活中是否有像飞蛾一样的方面。 "
  npc_override_payon_in03_fortune_chicken_puts_sand_its_mo_276b62: " 鸡会把沙子放进嘴里，以帮助它不足的消化系统。 "
  npc_override_payon_in03_fortune_choose_job_involves_flyi_953553: " 选择一份涉及飞行的职业！你很有潜力！ "
  npc_override_payon_in03_fortune_clear_your_mind_88bbc3: "清空你的思绪…… "
  npc_override_payon_in03_fortune_compared_life_they_belie_f4c6c7: " 与生命相比，他们认为金钱是愚蠢的。骑士想理解这些关于生命的想法。 "
  npc_override_payon_in03_fortune_could_also_good_thing_me_603549: " 但那也可能是一件好事。这就是木偶的意义。 "
  npc_override_payon_in03_fortune_could_good_bad_also_very_d773ff: " 可能是好也可能是坏。这也是一个非常累人的处境。 "
  npc_override_payon_in03_fortune_cut_you_filled_uncertain_16d269: " 切！你对未来充满了不确定性！让我们摆脱这个！哇！它消失了！ "
  npc_override_payon_in03_fortune_deep_sleep_brings_happin_f3da65: " 深度睡眠带来幸福和梦想。我认为你现在需要的是睡眠。 "
  npc_override_payon_in03_fortune_delicate_treatment_atten_79ad60: " 在爱情中，细腻的对待和关注是最好的。 "
  npc_override_payon_in03_fortune_delightful_preparation_i_d23ac9: " 愉快的准备？我不明白……我想我太老了。也许年轻人能理解…… "
  npc_override_payon_in03_fortune_devote_energy_love_1e5032: " 把那份精力投入到爱情中……！ "
  npc_override_payon_in03_fortune_devoted_myself_training_7d17e5: "并全身心投入训练。"
  npc_override_payon_in03_fortune_did_you_know_moth_s_374dac: " 你知道飞蛾的翅膀上有无限量的粉末吗？飞蛾象征着财富，因为它能像翅膀上的粉末一样收集财富。 "
  npc_override_payon_in03_fortune_did_you_like_next_time_eff3de: " 你喜欢吗？下次邀请你的朋友！那么再见再见！！ "
  npc_override_payon_in03_fortune_did_you_something_absurd_bf846b: " 你对那个人做了什么荒唐的事吗？你确定吗？好好想想~ "
  npc_override_payon_in03_fortune_digging_east_right_now_h_c9f086: " 它现在正在东边挖掘。怎么样，要不要去那里试试？ "
  npc_override_payon_in03_fortune_doesn_t_seem_like_there_30fdd6: " 小钱包里不是应该有钱吗？你会有一些小收入！明智地存钱！ "
  npc_override_payon_in03_fortune_doll_craving_attention_l_bba0a2: " 玩偶渴望关注。大量的关注。 "
  npc_override_payon_in03_fortune_dolls_become_accustomed_8df26a: " 玩偶被触摸得越多，就越习惯主人。给你的玩偶更多关注。 "
  npc_override_payon_in03_fortune_dolls_understand_human_s_2eef62: " 玩偶比人类更懂人心。试着像对待玩偶一样对待你的爱人。 "
  npc_override_payon_in03_fortune_don_t_blame_environment_d00100: " 不要责怪环境。那个借口只是给懦夫用的。 "
  npc_override_payon_in03_fortune_don_t_eat_anything_night_38825d: " 晚上不要吃任何东西。你的胃会痛的。 "
  npc_override_payon_in03_fortune_don_t_eat_too_much_db94b9: " 也不要吃太多辛辣和咸的食物、酒精等。多么体贴的睡魔啊。 "
  npc_override_payon_in03_fortune_don_t_focus_too_much_c3e695: " 不要太关注金钱。只管去做。它说这是最好的方法。 "
  npc_override_payon_in03_fortune_don_t_forget_you_must_6e43db: " 不要忘记你必须最考虑自己。 "
  npc_override_payon_in03_fortune_don_t_forget_your_friend_696dcf: " 不要忘记你在天堂的朋友！友谊是永恒的！ "
  npc_override_payon_in03_fortune_don_t_get_disturbed_mark_289a90: " 不要被死亡的标记所困扰。那只是小丑的玩笑。 "
  npc_override_payon_in03_fortune_don_t_get_fooled_tricks_90003b: " 不要被诡计所欺骗。他们也是人。他们也知道如何偶尔撒谎。冷静而仔细地寻找诡计。 "
  npc_override_payon_in03_fortune_don_t_get_lazy_about_158918: " 无论去哪里都不要懒惰于学习！寻求真理之路并走下去找到答案！ "
  npc_override_payon_in03_fortune_don_t_get_malicious_thou_a63e79: " 不要有恶意。保持一颗善良的心。 "
  npc_override_payon_in03_fortune_don_t_get_sidetracked_lo_20254c: " 不要分心看向别处！你会被诅咒的！ "
  npc_override_payon_in03_fortune_don_t_get_too_greedy_b22448: " 不要对事物太贪婪。 "
  npc_override_payon_in03_fortune_don_t_measure_friendship_d2b323: " 不要用金钱来衡量友谊！如果你这样做，小心你们的友谊会出现裂痕！ "
  npc_override_payon_in03_fortune_don_t_neglect_trivial_th_17a0d6: " 不要忽视地上的小事！如果你保持开放的心态，你就能收集到金钱！ "
  npc_override_payon_in03_fortune_don_t_picky_about_days_ccb998: " 不要挑剔工作的日子。你能赚更多钱。 "
  npc_override_payon_in03_fortune_don_t_prepare_future_car_617b1f: " 不要草率地为未来做准备。松散的措施比准备好的冒险更糟糕。 "
  npc_override_payon_in03_fortune_don_t_run_forward_carele_7124c1: " 不要鲁莽地向前冲。举起你的剑，等待你的机会。 "
  npc_override_payon_in03_fortune_don_t_shy_front_your_f42507: " 不要在爱人面前害羞！爱超越一切！ "
  npc_override_payon_in03_fortune_don_t_think_them_too_1821a2: " 不要太想他们。危机只是危机。 "
  npc_override_payon_in03_fortune_don_t_think_your_head_0ed1bb: " 不要以为你的脑袋是空的！因为，你很聪明！你能做到！ "
  npc_override_payon_in03_fortune_don_t_try_gaze_straight_e1fa09: " 不要试图直视他们。努力去接近他们。 "
  npc_override_payon_in03_fortune_don_t_you_think_you_b13b81: " 你不觉得你已经迷恋外表，并在用爱情赌博吗？这次你可能需要更小心。 "
  npc_override_payon_in03_fortune_don_t_your_troubles_disa_12f0ca: " 看着波利微笑，你的烦恼不是消失了吗？你的未来一定充满了美好的事物！ "
  npc_override_payon_in03_fortune_dracula_brings_money_may_9ecb99: " 德古拉带来金钱。也许这是它作为伯爵时的道德影响。当吸血鬼很昂贵，但我从未见过贫穷的吸血鬼。 "
  npc_override_payon_in03_fortune_dracula_mocks_human_s_mo_3bcab9: " 德古拉嘲笑人类的金钱。对它来说毫无价值。 "
  npc_override_payon_in03_fortune_dracula_money_important_e2a0c7: " 对德古拉来说，金钱不重要。血液更有价值。对你来说，金钱也不应该那么重要。你不需要担心金钱。 "
  npc_override_payon_in03_fortune_dracula_says_brush_your_44c859: " 德古拉说，'一天刷三次牙。'确保你刷牙！ "
  npc_override_payon_in03_fortune_dracula_says_careful_str_33ccec: " 德古拉说，'晚上在街上要小心。' "
  npc_override_payon_in03_fortune_dracula_says_don_t_too_146064: " 德古拉说，'不要太挑剔。' "
  npc_override_payon_in03_fortune_dracula_says_study_impor_16e9f8: " 德古拉说，'先学习重点。'临时抱佛脚是没用的！ "
  npc_override_payon_in03_fortune_dracula_says_true_presen_d43f74: " 德古拉说要忠于当下。确实，思考并忠于当下，比试图弄清楚你的未来重要得多。 "
  npc_override_payon_in03_fortune_dustiness_symbolizes_haz_52a462: " 尘土象征着朦胧的未来。它和你现在的心境相似。它说这是显而易见的。 "
  npc_override_payon_in03_fortune_dustiness_teeth_very_str_c54fda: " 尘土怪的牙齿非常强壮。这意味着…… "
  npc_override_payon_in03_fortune_dustiness_teeth_very_str_cd2e0b: " 尘土怪的牙齿非常强壮。这意味着…… "
  npc_override_payon_in03_fortune_eat_right_food_right_tim_503f45: " 在正确的时间吃正确的食物。这是让你的身体存活的唯一方式。你不能变成骷髅那样。 "
  npc_override_payon_in03_fortune_eating_good_wild_dangero_7b6b4a: " 吃是好事，但野外是危险的地方。让你的胃留点空。 "
  npc_override_payon_in03_fortune_eating_happiness_same_go_87170e: " 吃就是幸福。人类也是如此。珍惜食物，享受进食。 "
  npc_override_payon_in03_fortune_effort_into_oneself_puts_a16098: " 对自身的努力会给一个人的存在带来巨大的力量。 "
  npc_override_payon_in03_fortune_eh_what_kind_friendship_08021d: " 嗯！？这是什么友谊！？快点和好！ "
  npc_override_payon_in03_fortune_eh_you_re_too_smart_a120f0: " 嗯？你太聪明了！你比你的朋友们高一个层次！休息一下！ "
  npc_override_payon_in03_fortune_else_jack_attack_dbe83e: " 否则，杰克会攻击你。 "
  npc_override_payon_in03_fortune_else_you_face_frustratio_65a053: " 否则你会面临挫折或犯下大错。 "
  npc_override_payon_in03_fortune_else_you_really_simple_h_b177a4: " 否则你真的会成为一个简单诚实的大傻瓜。那可能会很麻烦。 "
  npc_override_payon_in03_fortune_embrace_every_aspect_you_815274: " 接纳你爱人的每一个方面！那才是真爱！ "
  npc_override_payon_in03_fortune_especially_young_one_lik_47ad67: " 尤其是像你这样的年轻人……你太接近某人了。咳。 "
  npc_override_payon_in03_fortune_even_anubis_doesn_t_thin_7e8408: " 连阿努比斯都不去想死亡，那你为什么要去想呢？期待美好的未来吧，年轻人。 "
  npc_override_payon_in03_fortune_even_darkness_you_shine_7b1f1a: " 即使在黑暗中，你也会为你的目标闪耀。 "
  npc_override_payon_in03_fortune_even_hot_dry_desert_isn_e95b02: " 即使在炎热干燥的沙漠中，未来不是更快乐吗，因为你能遇到甜美的果汁？加油！ "
  npc_override_payon_in03_fortune_even_if_may_seem_pointle_97a483: " 即使看起来毫无意义，如果你坚持，你就能赚到很多钱！你能做到！ "
  npc_override_payon_in03_fortune_even_if_you_did_get_589819: " 即使你没有得到你想要的运势，也不要太沮丧，只管去追求你的爱情！ "
  npc_override_payon_in03_fortune_even_if_you_may_pleased_0e4ec7: " 即使你可能不满意，冷静地考虑并努力寻找真正的幸福。 "
  npc_override_payon_in03_fortune_even_if_you_save_money_a68755: " 即使你存钱，它也会像烟一样消失。不要太沉迷！ "
  npc_override_payon_in03_fortune_even_if_you_wish_approac_7dc1c6: " 即使你想接近你的爱人，你的身体也不舒服！休息一下！ "
  npc_override_payon_in03_fortune_even_joker_asks_change_n_eee563: " 即使小丑要求零钱，也不要给他。他会要求零钱，然后最终要求一大笔钱。 "
  npc_override_payon_in03_fortune_even_reminiscing_about_p_77f75d: " 即使一边喝咖啡一边回忆过去，也无法让时间倒流。 "
  npc_override_payon_in03_fortune_even_though_desert_you_s_303b7e: " 即使那是沙漠，你似乎也有轻松的微笑！也许你在学习时也需要这样放松！ "
  npc_override_payon_in03_fortune_even_though_doesn_t_soun_497166: " ……即使这听起来不像是飞蛾会说的话。 "
  npc_override_payon_in03_fortune_even_though_happiness_ma_10b39d: " 即使幸福即将来临，也不要让它影响你现在的工作。 "
  npc_override_payon_in03_fortune_even_though_skeleton_onl_d47c44: " 即使它只是一具只有骨头的骷髅，它也有所有必要的安全装备。 "
  npc_override_payon_in03_fortune_even_though_you_may_hone_b7cbd3: " 即使你可能诚实而简单，但在危机时刻，你必须保持警惕。 "
  npc_override_payon_in03_fortune_even_though_you_satisfie_22150c: " 即使你现在对你的爱情不满意，看看他们的穿着。 "
  npc_override_payon_in03_fortune_even_though_your_love_ri_f8e9e2: " 即使你现在看起来你的爱情好像什么都没有，但它拥有你需要的一切。 "
  npc_override_payon_in03_fortune_even_traditional_beauty_93854c: " 即使是传统美人，在别人看来也可能很冷。试着从不同角度看看你的爱人。 "
  npc_override_payon_in03_fortune_even_when_you_sick_don_df7bdc: " 即使生病，也不要忘记学习！有努力，就一定会有好结果！ "
  npc_override_payon_in03_fortune_even_wind_blows_trail_he_e72a2f: " 即使风吹动她衣服的衣摆飘动，她的姿态也从不改变。用那样的心去爱一个人，会带来善意和幸福。 "
  npc_override_payon_in03_fortune_eyes_marionette_symboliz_1379fa: " 木偶的眼睛象征着'挑战'。挑战在你的未来将意义重大。 "
  npc_override_payon_in03_fortune_fashion_hands_those_who_1093b4: " 时尚掌握在领先者手中！ "
  npc_override_payon_in03_fortune_finding_different_sides_6369a4: " 发现自己不同的一面是进步的方式。研究你自己。 "
  npc_override_payon_in03_fortune_first_clear_your_mind_ju_1f0f42: " 首先，清空你的思绪！就像洗碗时清洗一样！ "
  npc_override_payon_in03_fortune_fisherman_oceanographer_5153bf: " 渔夫？海洋学家？海盗？虽然我不知道是哪个职业…… "
  npc_override_payon_in03_fortune_forget_about_money_fly_f_18ebb0: " 忘记金钱，飞~飞！你会感到非常清爽！ "
  npc_override_payon_in03_fortune_forget_about_studying_mo_c4e506: " 暂时忘记学习，享受派对吧！应该会很清爽~！ "
  npc_override_payon_in03_fortune_fortune_card_c0bf17: " 这是这张牌的运势。 "
  npc_override_payon_in03_fortune_fortune_foreshadowing_yo_1ba1d6: " 这个运势预示着你将来会成为一名强壮健康的工人。 "
  npc_override_payon_in03_fortune_fortune_love_told_what_y_afc64d: " 爱情运势被揭晓了！你觉得怎么样！你喜欢吗？ "
  npc_override_payon_in03_fortune_fortune_saying_love_appr_603404: " 这个运势在说爱情……摇摇晃晃、软软地靠近~然后砰~拥抱它。 "
  npc_override_payon_in03_fortune_fortunes_simple_refreshi_b9280a: " 运势简单清爽。当你想轻松占卜而不感到负担时，这是完美的！ "
  npc_override_payon_in03_fortune_fortuneteller_like_me_ta_2858a1: " 像我这样的占卜师从一个人那里取一个问题，然后问牌。牌回答，我告诉那个人。 "
  npc_override_payon_in03_fortune_fortunetellers_gather_he_4f4503: "占卜师们聚集在斐扬，"
  npc_override_payon_in03_fortune_friend_waiting_you_nice_b881f5: " 一个朋友在等你！对你的朋友好一点！ "
  npc_override_payon_in03_fortune_future_card_sees_future_a96110: " 未来……能看到未来的牌开始说话了……准备好…… "
  npc_override_payon_in03_fortune_future_only_open_those_g_564865: " 未来只会向超越人类贪婪的人敞开。 "
  npc_override_payon_in03_fortune_future_seems_like_you_ki_fda12c: " 在未来，看起来你会像那些波利一样用脚踢钱！恭喜！ "
  npc_override_payon_in03_fortune_future_things_cannot_don_02e8fd: " 在未来，现在做不到的事情将会实现！你可以期待！ "
  npc_override_payon_in03_fortune_get_some_sleep_3da2d3: " 去睡一觉吧。 "
  npc_override_payon_in03_fortune_give_lots_presents_your_3877b5: " 给你的爱人送很多很多~~礼物！然后你会经历很多~很多好事！ "
  npc_override_payon_in03_fortune_give_your_friend_present_cec5f6: " 给你的朋友送礼物！他们会在镇上到处炫耀！？ "
  npc_override_payon_in03_fortune_give_your_friend_ride_pl_c76485: " 让你的朋友坐飞机兜风！他们可能会高兴得飞起来！？ "
  npc_override_payon_in03_fortune_give_your_friends_presen_447df2: " 给你的朋友们送礼物！你们的友谊会更深！ "
  npc_override_payon_in03_fortune_gloomy_fortune_how_about_46ae18: " 一个阴郁的运势。小心点怎么样？ "
  npc_override_payon_in03_fortune_go_out_some_fun_your_a88242: " 出去和朋友玩吧！你们的友谊一定会变强！ "
  npc_override_payon_in03_fortune_go_trip_your_friend_frie_4b0625: " 和朋友去旅行吧！友谊在新环境中能变得更牢固！ "
  npc_override_payon_in03_fortune_go_your_loved_one_presen_7762a9: " 带着礼物去找你的爱人！他们会非常高兴的！ "
  npc_override_payon_in03_fortune_going_around_collect_mon_354c12: " 到处去收集钱可能会让你遇到可怕的人！非常小心！ "
  npc_override_payon_in03_fortune_gold_rather_peculiar_com_049217: " 与其他资产相比，黄金相当特殊。 "
  npc_override_payon_in03_fortune_good_luck_try_your_best_c7a644: " 祝你好运，尽力而为。 "
  npc_override_payon_in03_fortune_good_nor_bad_so_there_8ade5e: " 不好也不坏，所以总有新的可能性。 "
  npc_override_payon_in03_fortune_great_strength_baphomet_8ec55d: " 巴风特强大的力量带来财富。看起来在巴风特力量的帮助下，你能收集到很多财富！ "
  npc_override_payon_in03_fortune_green_good_studying_colo_7c2ed5: " 绿色对学习有好处！把你的墙壁涂成绿色或喝绿色饮料！幸运色！绿色！ "
  npc_override_payon_in03_fortune_green_symbolizes_peace_y_47f866: " 绿色象征和平！你的未来看起来非常和平！这是件好事，对吧？ "
  npc_override_payon_in03_fortune_hair_medusa_all_snakes_s_a14349: " 美杜莎的头发都是蛇。蛇象征着贪婪和狡猾。在收集东西时，似乎会有一种狡猾的力量加入你。这不是个很明亮的征兆…… "
  npc_override_payon_in03_fortune_hair_medusa_sticking_up_679338: " 美杜莎的头发竖起来了。它对即将发生的大变化感到紧张。一个连可怕的美杜莎都担心的变化。 "
  npc_override_payon_in03_fortune_hair_medusa_symbolizes_a_6601d1: " 美杜莎的头发象征着财富的数量。看起来会有好事发生在你身上，年轻人。 "
  npc_override_payon_in03_fortune_he_always_says_light_hea_4573d5: " 他总是这么说。轻松愉快的钱即使堆积起来也不危险。 "
  npc_override_payon_in03_fortune_he_believes_like_cancer_557d08: " 他认为那就像无法切除的癌细胞。 "
  npc_override_payon_in03_fortune_he_falling_asleep_awaiti_f1bea8: " 他在等待战斗时睡着了。是因为他很悠闲，还是仅仅很可悲？我想取决于情况。 "
  npc_override_payon_in03_fortune_he_knows_about_danger_fr_8a6034: " 他知道作为领主，自由的危险。 "
  npc_override_payon_in03_fortune_he_linger_around_you_as_212313: " 他会像邻居或稀有物品一样在你身边徘徊，然后向你要钱。 "
  npc_override_payon_in03_fortune_he_says_if_someone_somet_764406: " 他说如果有人有你想要的东西，就把它变成你的。 "
  npc_override_payon_in03_fortune_he_says_overcome_frustra_cbd88b: " 他说要克服挫折，有必要想一些快乐的事情。 "
  npc_override_payon_in03_fortune_he_says_your_future_mixe_8ff7ee: " 他说你的未来混合着风暴和秋天的天气。 "
  npc_override_payon_in03_fortune_he_very_angry_about_intr_b6528a: " 他对侵入他人空间非常愤怒。接受巴风特的警告。 "
  npc_override_payon_in03_fortune_he_wants_enjoy_watching_048c1f: " 他想享受看着你因焦虑而颤抖。 "
  npc_override_payon_in03_fortune_he_warning_you_drool_ove_7bada8: " 他在警告你不要对别人流口水。 "
  npc_override_payon_in03_fortune_health_best_ce005c: " 健康是最好的。 "
  npc_override_payon_in03_fortune_heart_poring_card_earnes_308ba6: " 这是波利牌真诚希望美好友谊的心！ "
  npc_override_payon_in03_fortune_hee_go_after_your_love_08b4e5: " 嘿！像鼹鼠一样去追求你的爱情！噗哈哈哈！ "
  npc_override_payon_in03_fortune_help_your_friend_s_scar_841060: " 帮助你的朋友疗伤。你的朋友会非常感激的！ "
  npc_override_payon_in03_fortune_hint_saying_strong_hairs_e917f6: " 这是一个暗示，说一个强大的发型是扭转局势的关键。改变你的发型！ "
  npc_override_payon_in03_fortune_his_expression_awe_when_224932: " 他的表情很敬畏。当遇到荒唐的事情时，他的脸和表情会变得特别扭曲。 "
  npc_override_payon_in03_fortune_his_goal_become_rich_rea_ea72c1: " 他的目标不是变得富有。一个真正肮脏的调皮鬼。 "
  npc_override_payon_in03_fortune_his_navel_very_pretty_yo_861fa5: " 他的肚脐很漂亮。你必须遇到那种肚脐的人才能幸福。 "
  npc_override_payon_in03_fortune_hmm_expecting_lot_hehe_166d57: " 嗯……期待很多。嘿嘿~ "
  npc_override_payon_in03_fortune_hmm_ghost_saying_strange_6c1b1b: " 嗯~一个鬼魂在说奇怪的话。 "
  npc_override_payon_in03_fortune_hmm_how_about_giving_cut_f1469b: " 嗯。送一只可爱的小狗作为礼物怎么样？一只圆鼻子的。然后他们一定会很高兴。 "
  npc_override_payon_in03_fortune_hmm_try_love_more_spirit_2b1b29: " 嗯，试着用更多的精神去爱。你会得到好结果的。 "
  npc_override_payon_in03_fortune_hmm_you_like_amulet_bef52e: " 嗯……你想要护身符吗？ "
  npc_override_payon_in03_fortune_hode_forgive_others_thos_20c7d4: " 霍德可以原谅别人，但不能原谅伤害它的人。 "
  npc_override_payon_in03_fortune_hode_knows_nothing_about_5177f1: " 霍德对金钱一无所知。但从霍德身上会掉落非常稀有的物品。 "
  npc_override_payon_in03_fortune_hode_very_strong_live_su_7b309e: " 霍德有着非常强烈的生存意志。这是为了在森林中生存。它建议带着那种意志去约会。"
  npc_override_payon_in03_fortune_hode_warning_you_voracio_e51a5a: " 霍德正在警告你暴饮暴食让它变得迟钝。 "
  npc_override_payon_in03_fortune_hodes_afraid_crises_you_b9d462: " 霍德害怕危机。你也应该试着不要害怕危机。 "
  npc_override_payon_in03_fortune_hodes_know_about_money_t_2faf96: " 霍德对金钱一无所知。它们只是狼吞虎咽地吃掉一切。但那可能是获得巨大财富的捷径。 "
  npc_override_payon_in03_fortune_hodes_know_about_tomorro_777655: " 霍德不知道明天，但它们仍然知道死亡。 "
  npc_override_payon_in03_fortune_hodes_know_about_tomorro_f86eb6: " 霍德不知道明天。但尽管它们很安静，它们会危及其他生物。 "
  npc_override_payon_in03_fortune_hodes_know_anything_abou_2146a3: " 霍德对金钱一无所知。但它们不会原谅那些觊觎它们东西的人。 "
  npc_override_payon_in03_fortune_hodes_ponder_about_life_fa8675: " 霍德不思考生命，但它们的生存意志非常强烈。"
  npc_override_payon_in03_fortune_hodes_strong_even_though_6bf1b6: " 霍德即使在沙漠中也很强壮。仅仅因为环境恶劣，并不意味着你不能收集财富。 "
  npc_override_payon_in03_fortune_how_about_becoming_brave_4268ba: " 成为爱情战场上的勇敢战士怎么样？ "
  npc_override_payon_in03_fortune_how_about_changing_your_f2ba64: " 改变你的生活方式怎么样？这就是这个意思。 "
  npc_override_payon_in03_fortune_how_about_getting_involv_b6d0c7: " 参与养牛怎么样？看起来你能通过它收集很多财富。 "
  npc_override_payon_in03_fortune_how_about_living_like_to_d79d90: " 那样生活怎么样？ "
  npc_override_payon_in03_fortune_how_about_preparing_your_403d96: " 你也准备一下怎么样？ "
  npc_override_payon_in03_fortune_how_about_studying_theol_f21fa0: " 学习神学怎么样？你甚至可以研究天使！ "
  npc_override_payon_in03_fortune_how_about_taking_break_l_8be4ef: " 从爱情中休息一下，给自己放松的时间怎么样……我同意这张牌。 "
  npc_override_payon_in03_fortune_how_about_taking_break_l_ce4751: " 从爱情中休息一下，给自己放松的时间怎么样……我同意这张牌所说的。 "
  npc_override_payon_in03_fortune_how_about_try_being_litt_f2c666: " 怎么样？试着对金钱更随意一点。 "
  npc_override_payon_in03_fortune_how_about_trying_grab_th_507699: " 试着吸引他们的注意力怎么样？ "
  npc_override_payon_in03_fortune_how_rich_i_25651b: " （我会多么富有？） "
  npc_override_payon_in03_fortune_how_you_think_money_look_efa705: " 看着这么平静的牌，你怎么能想到钱！真不好！吸……吸鼻子！总之，看起来你会收集到很多财富！ "
  npc_override_payon_in03_fortune_humans_may_face_disaster_e358a7: " 如果轻率地谈论未来，人类可能会面临灾难。这就是为什么我们问牌关于未来的事。 "
  npc_override_payon_in03_fortune_humans_problem_their_mou_37bc79: " 人类有嘴巴的问题。嗯~啊。我，也是？！ "
  npc_override_payon_in03_fortune_i_accept_your_heart_your_6d4b3b: "我怀着感激之心接受你的心意和虔诚。给占卜师付钱时，心意比金额更重要。"
  npc_override_payon_in03_fortune_i_agony_because_my_slow_f935d4: "我曾因进展缓慢而苦恼。"
  npc_override_payon_in03_fortune_i_came_because_i_heard_430cc9: "我来是因为我听说很多"
  npc_override_payon_in03_fortune_i_decided_become_fortune_9705c0: "我决定成为一名占卜师"
  npc_override_payon_in03_fortune_i_don_t_know_maybe_e5e9c2: " 我不知道。也许它是在说一个瘦弱的人将来会做出伟大的事情？ "
  npc_override_payon_in03_fortune_i_don_t_know_why_59bcd4: " 我不知道他为什么要警告你……你养牛了吗？ "
  npc_override_payon_in03_fortune_i_feel_some_sort_emptine_b2f65d: " 我感到某种空虚……也许你的爱情有缺口？ "
  npc_override_payon_in03_fortune_i_get_warning_any_danger_174606: " （我能得到即将到来的危险的警告吗？） "
  npc_override_payon_in03_fortune_i_hope_you_able_avoid_72676d: " 我希望你能通过这个警告避免不幸。那么…… "
  npc_override_payon_in03_fortune_i_hope_you_disappointed_deb721: " 我希望你不会对这个运势的寓意失望。 "
  npc_override_payon_in03_fortune_i_like_know_my_love_d9903a: " （我想知道我的爱情运势。） "
  npc_override_payon_in03_fortune_i_m_quite_sure_may_ade908: " 我不太确定，但这可能会成为对你很重要的忠告……？ "
  npc_override_payon_in03_fortune_i_need_advice_about_my_7b4749: " （我需要关于我未来的建议。） "
  npc_override_payon_in03_fortune_i_see_i_see_sign_6de197: " 我看到了……我看到了爱情的征兆…… "
  npc_override_payon_in03_fortune_i_see_you_working_hard_3d494f: " 我能看到你在未来努力工作！多么充满活力的未来！ "
  npc_override_payon_in03_fortune_i_tell_what_doing_way_3667ca: " 从它拿着带血的斧头哭泣的样子，我能看出它在做什么。它被爱情深深伤害了。 "
  npc_override_payon_in03_fortune_i_think_one_you_looking_3e22a0: " 我认为你看着的那个人就是那种表情。 "
  npc_override_payon_in03_fortune_i_think_trying_give_warn_597aec: " 我认为它试图发出警告。小心。 "
  npc_override_payon_in03_fortune_i_think_you_should_wake_7603e8: " 我认为你应该早起。 "
  npc_override_payon_in03_fortune_i_wonder_aren_t_you_b38fde: " 我想知道……你不好奇吗？ "
  npc_override_payon_in03_fortune_i_wonder_meaning_money_s_b21438: " 我想知道金钱的意义也会慢慢从你的生活中消失。 "
  npc_override_payon_in03_fortune_i_wonder_what_type_perso_17f0e2: " 我想知道是什么样的人让杰克嫉妒！ "
  npc_override_payon_in03_fortune_if_condition_just_right_62b8d0: " 如果条件刚好合适，吸血鬼可以永远活着。但是，当那个完美条件被破坏时，它们就会遭遇悲惨的结局。 "
  npc_override_payon_in03_fortune_if_joker_saying_careful_8029eb: " 如果小丑这么说，要小心。对轻率的傻瓜没有治愈方法。 "
  npc_override_payon_in03_fortune_if_word_strikes_you_wary_99d763: " 如果一句话触动了你，要警惕那个。也许……一个冒险者？ "
  npc_override_payon_in03_fortune_if_you_don_t_leave_7264ab: " 如果你不留下你的名字，他可能会因为你浪费生命而憎恨你。 "
  npc_override_payon_in03_fortune_if_you_don_t_want_1744d3: " 如果你不想被打，停止你的烂笑话！ "
  npc_override_payon_in03_fortune_if_you_don_t_you_feba2a: " 如果你不这样做，你会像他一样。听睡魔的话。 "
  npc_override_payon_in03_fortune_if_you_go_little_little_035e78: " 如果你一点一点地去做，好事会发生！坐下来看看你周围！ "
  npc_override_payon_in03_fortune_if_you_hope_type_future_d97af1: " 如果你希望那种未来，没问题，但你还是应该小心。 "
  npc_override_payon_in03_fortune_if_you_look_carefully_dr_606bab: " 如果你仔细看，它不是喝果汁，而是通过地上的吸管喝地下水！钱藏在没人预料到的地方！祝你好运搜索！ "
  npc_override_payon_in03_fortune_if_you_point_being_warne_e8acd6: " 如果你到了被霍德警告的地步……你一定是个相当了不起的人。 "
  npc_override_payon_in03_fortune_if_you_re_sure_something_d4c3c5: " 如果你不确定什么，问朋友！这不是什么羞耻的事！你能做到！ "
  npc_override_payon_in03_fortune_if_you_say_fortunetellin_6ba7ff: " 如果你说占卜！当然就是关于未来！让我们试着弄清楚！ "
  npc_override_payon_in03_fortune_if_you_see_flag_pirate_53cc45: " 如果你看到海盗的旗帜，要么逃跑，要么照他们说的做。海盗不会给第二次警告。 "
  npc_override_payon_in03_fortune_if_you_see_someone_resem_5a5419: " 如果你看到像骷髅的人，帮助他们。 "
  npc_override_payon_in03_fortune_if_you_sit_around_all_1123dc: " 如果你整天坐着，即使是本来会成功的事情也不会成功。明白了吗？运动，运动！ "
  npc_override_payon_in03_fortune_if_you_thinking_somethin_8a8fe3: " 如果你现在在想什么，停止你的动作。否则灾难可能会降临到你身上。 "
  npc_override_payon_in03_fortune_if_you_want_something_gr_7033b6: " 如果你想在未来做伟大的事情，你必须向骷髅表达你的感激之情。 "
  npc_override_payon_in03_fortune_if_you_work_something_re_f15a10: " 如果你从事与蘑菇或苹果相关的工作，好运在等着你！那会是什么工作呢？ "
  npc_override_payon_in03_fortune_illegal_copying_love_b258c9: " 非法复制不是爱情！ "
  npc_override_payon_in03_fortune_indeed_hode_right_you_un_4c7f66: " 确实，霍德是对的。你也明白吗？ "
  npc_override_payon_in03_fortune_indeed_money_futile_e1194b: " 确实，金钱是徒劳的。 "
  npc_override_payon_in03_fortune_indeed_sad_love_might_ha_547a7c: " 确实，这是悲伤的爱情……可能很难克服。 "
  npc_override_payon_in03_fortune_indication_you_prosper_n_ab2a85: " 这表明你会繁荣！现在不需要担心！ "
  npc_override_payon_in03_fortune_irresistable_kiss_up_you_b16417: " 无法抗拒的吻……是否避开它由你决定。 "
  npc_override_payon_in03_fortune_isn_t_better_than_curse_bc655f: " 但这总比诅咒好。就当是这样，然后忘记它。 "
  npc_override_payon_in03_fortune_issues_about_studying_se_b4fe58: " 学习的问题是严肃的事情！让我们看看！呀！ "
  npc_override_payon_in03_fortune_its_pure_eyes_look_loved_fee9cd: " 它纯洁的眼睛看着爱人却无法认出他们，翅膀向爱人飘动，却无助地停留在一个地方，"
  npc_override_payon_in03_fortune_its_youth_gone_after_lif_ae7a5b: " 它追逐黄金一生，青春已逝。它变成了一个只剩下骨头的怪物。无论你多么喜欢金钱和工作，也要照顾好自己的生命。 "
  npc_override_payon_in03_fortune_jack_asking_money_don_t_55b5cc: " 杰克在要钱。不要吝啬给那些带来娱乐和乐趣的人付钱。 "
  npc_override_payon_in03_fortune_jack_jealous_because_spl_6742e5: " 杰克嫉妒是因为一个出色的人正在向你走来。 "
  npc_override_payon_in03_fortune_jack_likes_fun_money_he_3c8b91: " 杰克喜欢轻松的钱。他讨厌悲伤和沉重的钱。 "
  npc_override_payon_in03_fortune_jack_makes_money_through_6648b7: " 杰克通过笑话赚钱。他人的幸福是他财富的关键。 "
  npc_override_payon_in03_fortune_jack_says_order_prepare_d5a520: " 杰克说，为了准备未来，愉快的准备是必要的。 "
  npc_override_payon_in03_fortune_jack_says_something_inte_548a96: " 杰克说未来会发生有趣的事情。据他说，未来会比现在更有趣。 "
  npc_override_payon_in03_fortune_jack_says_you_may_frustr_c89ceb: " 杰克说你未来可能会感到沮丧。 "
  npc_override_payon_in03_fortune_jack_thinks_money_as_foo_8f139e: " 杰克认为金钱是愚蠢的东西。但不知怎的，他赚到了那种钱。 "
  npc_override_payon_in03_fortune_jack_warning_you_about_o_0c2a58: " 杰克正在警告你关于他人的愤怒，愤怒会夺走幸福并扼杀笑话。 "
  npc_override_payon_in03_fortune_jack_warning_you_lame_jo_847232: " 杰克正在警告你烂笑话。当他发现有人说烂笑话时，他倾向于用棍子打他们。 "
  npc_override_payon_in03_fortune_joker_enjoys_giving_oppo_8432a3: " 小丑喜欢给出相反的警告。 "
  npc_override_payon_in03_fortune_joker_offers_nice_insura_c50688: " 小丑提供了一份不错的保险，说要为未来做准备，但大部分都是浪费时间。 "
  npc_override_payon_in03_fortune_joker_says_you_let_him_6a45c2: " 小丑说你让他借钱，他会还你更多。你会拒绝的，对吧？但小丑的诱惑不会在一次尝试后结束。 "
  npc_override_payon_in03_fortune_joker_t_use_any_his_ee05cd: " 小丑因为被绑在牌上而无法发挥任何力量。也许那个人被什么东西困住了，无法展现真正的价值？ "
  npc_override_payon_in03_fortune_joker_trying_trick_you_c_ef9c1c: " 小丑试图欺骗你。这张牌有各种不同类型的不祥运势。 "
  npc_override_payon_in03_fortune_jokers_don_t_just_appear_19ff90: " 小丑不会只出现一次就离开。他们会在未来回来。 "
  npc_override_payon_in03_fortune_jokers_enjoy_giving_oppo_26525a: " 小丑喜欢给出相反的警告。他说享受睡懒觉。"
  npc_override_payon_in03_fortune_jokers_enjoy_giving_oppo_a60930: " 小丑喜欢给出相反的警告。他说享受夜宵。 "
  npc_override_payon_in03_fortune_jokers_enjoy_giving_oppo_c26ed5: " 小丑喜欢给出相反的警告。 "
  npc_override_payon_in03_fortune_jokers_exist_one_form_th_b04944: " 小丑不以一种形式存在。他们会以几种不同的方式瞄准你的钱。 "
  npc_override_payon_in03_fortune_jokers_like_they_ability_e4560b: " 小丑就是这样。他们有能力把小错误变成大灾难。 "
  npc_override_payon_in03_fortune_jokers_sly_just_because_4a5706: " 小丑很狡猾，但那只是因为他们习惯如此。 "
  npc_override_payon_in03_fortune_jokes_fun_too_much_turn_c2c084: " 笑话很有趣，但太多会让你像他一样变成鬼魂。 "
  npc_override_payon_in03_fortune_just_like_bull_eeb7f7: " 就像牛一样。 "
  npc_override_payon_in03_fortune_just_like_juice_inside_n_7af3e9: " 就像仙人掌针里的果汁一样，即使你在痛苦中，你仍然可以收集财富。你能做到！ "
  npc_override_payon_in03_fortune_keep_eye_out_foreign_cur_82fd6a: " 留意外币。它会给你带来好运。 "
  npc_override_payon_in03_fortune_keep_righteous_heart_min_60db06: " 保持正直的心灵。 "
  npc_override_payon_in03_fortune_kek_your_mind_goes_blank_bf60e1: " 咳！当你想到钱时，你的脑子一片空白！想点别的！暂时忘记钱！ "
  npc_override_payon_in03_fortune_kiss_me_a31909: "吻我~~"
  npc_override_payon_in03_fortune_kissy_me_aaeeeb: "吻我~"
  npc_override_payon_in03_fortune_knight_commenting_about_74f947: " 骑士评论一个人的未来是非常罕见的。 "
  npc_override_payon_in03_fortune_knight_horse_fantasy_eve_a4afa7: " 骑马的骑士是每个人心中的幻想。让这个幻想成真吧。 "
  npc_override_payon_in03_fortune_knight_job_requires_lot_d45ce3: " 骑士是一份需要很多钱的职业。大笔开销的暗示。你可能需要勒紧裤腰带。 "
  npc_override_payon_in03_fortune_knight_s_future_leads_de_d0c668: " 骑士的未来通向死亡。战场上光荣的死亡。 "
  npc_override_payon_in03_fortune_knight_says_new_road_lif_88aafc: " 骑士说，一旦你把目光从财富上移开，新的人生道路就会打开。 "
  npc_override_payon_in03_fortune_knight_values_honor_more_136f1d: " 骑士重视荣誉胜过财富。他们认为讨论财富本身是肮脏的，不值得。你怎么能向这样的骑士询问财富运势呢？ "
  npc_override_payon_in03_fortune_knight_wants_you_proud_y_e3ca27: " 骑士希望你为自己感到骄傲。 "
  npc_override_payon_in03_fortune_knight_warning_you_botto_fa2b99: " 这位骑士从心底警告你，"
  npc_override_payon_in03_fortune_knight_warning_you_cruel_8f8c51: " 骑士正在警告你关于残忍。可能是你的，也可能是你周围某个人的。 "
  npc_override_payon_in03_fortune_knight_warning_you_lonel_bdbcbb: " 这位骑士正在警告你关于孤独。他没有一个人来帮助他的马，"
  npc_override_payon_in03_fortune_knight_warning_you_reckl_8af30e: " 骑士正在警告你关于鲁莽驾驶。你骑大嘴鸟吗？ "
  npc_override_payon_in03_fortune_knights_fight_money_they_5dbf28: " 骑士不为钱而战。如果他们这样做，他们就是雇佣兵。骑士追求更高的东西。骑士想告诉你的是生活方式。 "
  npc_override_payon_in03_fortune_know_love_know_thyself_65c33c: " 了解爱情，了解你自己！ "
  npc_override_payon_in03_fortune_know_your_position_right_9d2702: " 了解你现在的位置和未来要瞄准的地方。 "
  npc_override_payon_in03_fortune_knowing_crisis_crisis_mo_70acc3: " 不知道危机是危机是最危险的。 "
  npc_override_payon_in03_fortune_lantern_its_back_even_it_d5afe9: " 它的背上有一个灯笼，甚至手里也有一个……它认为一盏灯不够。 "
  npc_override_payon_in03_fortune_laziness_cause_you_lose_6d1ead: " 那种懒惰会让你瞬间失去生命。 "
  npc_override_payon_in03_fortune_laziness_more_dangerous_afebc2: " 懒惰比面前的怪物更危险。不要忘记这个警告。 "
  npc_override_payon_in03_fortune_lean_against_wall_await_90535e: " 靠墙等待你的爱情！*砰*爱情会出现！ "
  npc_override_payon_in03_fortune_learn_how_accept_others_ab0af4: " 学会如何接受他人的意见。从接受兽人领主的意见开始怎么样？ "
  npc_override_payon_in03_fortune_leave_your_future_marina_8630a7: " 把你的未来交给海葵。海葵珍惜它宝贵的海洋。大海在你的未来也会非常重要。 "
  npc_override_payon_in03_fortune_life_may_seem_like_hot_9a7c1a: " 生活可能看起来像一个炎热干燥的沙漠，但在未来，美味的果汁和休息在等着你！ "
  npc_override_payon_in03_fortune_lightens_attacks_pickaxe_96fe55: " 那用镐头轻盈地攻击！你必须积极地前进。你觉得呢？你的运势很好。 "
  npc_override_payon_in03_fortune_little_things_life_bring_6ccadd: " 生活中的小事会在未来给你带来幸福和欢乐！比现在更多！ "
  npc_override_payon_in03_fortune_live_future_strong_teeth_62c171: " 用强壮的牙齿活在未来的意思？！ "
  npc_override_payon_in03_fortune_loneliness_simply_sadnes_e7c983: " 孤独不仅仅是悲伤。它是一个无形的恶魔，吞噬你的生命。远离孤独。 "
  npc_override_payon_in03_fortune_look_around_you_course_l_1b27e3: " 看看你周围。当然，找找看有没有你可能得罪过的人…… "
  npc_override_payon_in03_fortune_look_love_different_pers_e3b9be: " 从不同角度看待爱情。你永远不知道什么时候能发现什么。 "
  npc_override_payon_in03_fortune_look_sohee_s_hairstyle_i_94c3a3: " 看看苏菲的发型。不是很华丽吗。 "
  npc_override_payon_in03_fortune_losing_money_isn_t_joke_13e31c: " 但丢钱可不是开玩笑的，对吧？你应该小心。 "
  npc_override_payon_in03_fortune_love_afraid_show_differe_687614: " 但那不是爱情。不要害怕向你的爱人展示自己不同的一面…… "
  npc_override_payon_in03_fortune_love_bending_yourself_so_d854b6: " 爱情就是为他人弯曲自己！服务！牺牲！ "
  npc_override_payon_in03_fortune_love_blossom_totally_dif_5c72ca: " 爱情会在一个完全不同的人身上绽放！哇，太酷了！ "
  npc_override_payon_in03_fortune_love_blossoms_foundation_4971c8: " 爱情从基础绽放！忠于基础！ "
  npc_override_payon_in03_fortune_love_indeed_subject_deal_305c71: " 爱情确实是一个需要谨慎处理的主题。记住这一点，年轻人。 "
  npc_override_payon_in03_fortune_love_like_juice_forest_r_445d39: " 爱情就像森林里的果汁！很清爽！照顾好你的爱人！ "
  npc_override_payon_in03_fortune_love_meant_so_hard_46cb11: " 爱情不应该这么难。 "
  npc_override_payon_in03_fortune_love_must_pushed_forward_2965f8: " 爱情必须向前推进！ "
  npc_override_payon_in03_fortune_love_requires_health_str_b7301a: " 爱情需要健康和力量！锻炼变得更强！力量和爱情！ "
  npc_override_payon_in03_fortune_love_requires_preparatio_a1f0d5: " 爱情也需要准备！ "
  npc_override_payon_in03_fortune_love_s_form_obscure_95d2ca: " 爱情的形式是模糊的。 "
  npc_override_payon_in03_fortune_love_supposed_about_cont_768b3e: " 爱情不应该是关于控制和约束~嗯~ "
  npc_override_payon_in03_fortune_love_sweet_careful_get_c_bcec50: " 爱情很甜蜜！小心不要蛀牙！ "
  npc_override_payon_in03_fortune_lover_something_wrong_he_47f526: " 如果爱人做错了什么，他就用针戳他们。好可怕…… "
  npc_override_payon_in03_fortune_make_opportunity_alone_e_a6c650: " 创造独处的机会！那会带来很多幸福！ "
  npc_override_payon_in03_fortune_make_yourself_stronger_a_fa3512: " 以任何形式让自己变得更强。在未来，你会需要它。 "
  npc_override_payon_in03_fortune_making_yourself_look_pre_d26c20: " 让自己看起来得体和保持善良的心一样重要。 "
  npc_override_payon_in03_fortune_many_hardships_await_you_00f633: " 未来会有很多艰辛等着你！但你能克服它们！ "
  npc_override_payon_in03_fortune_marina_doesn_t_really_th_f82ca4: " 海葵真的什么都不想……但它会说一件事。食物。海葵喜欢食物。 "
  npc_override_payon_in03_fortune_marina_doesn_t_think_its_9a8d3c: " 海葵不想它的未来……但我可以告诉你一件事。自由。海葵自由地游泳。 "
  npc_override_payon_in03_fortune_marina_gathers_money_qui_a92669: " 海葵安静地、一点一点地收集金钱，同时自由漫游。这才是真正的赚钱方式。海葵向你建议这个方法。 "
  npc_override_payon_in03_fortune_marina_interested_money_a30d73: " 海葵对金钱不感兴趣。这张牌暗示你也会具有这些特质。你会享受金钱之外的生活。 "
  npc_override_payon_in03_fortune_marina_prefers_clean_fun_801198: " 海葵喜欢干净的资金。它讨厌可疑的钱。你的财产也应该干净。 "
  npc_override_payon_in03_fortune_marina_think_its_future_19667f: " 海葵不想它的未来……但我可以告诉你一件事。生存。海葵只想着生存和生命。 "
  npc_override_payon_in03_fortune_marina_warning_about_big_f496f8: " 海葵正在警告大肚子。它不高兴，因为它像自己……减点肥怎么样？ "
  npc_override_payon_in03_fortune_marina_warning_about_laz_69001a: " 海葵正在警告懒惰的生活方式。它说这种生活方式会导致像它自己一样的结果。 "
  npc_override_payon_in03_fortune_marina_warning_hot_sting_e64a57: " 海葵正在警告热辣的毒刺。小心毒物。 "
  npc_override_payon_in03_fortune_marionette_believes_pres_8f4e88: " 木偶相信现在比未来更重要。基本上，问未来是毫无意义的。 "
  npc_override_payon_in03_fortune_marionette_devotes_every_8132d5: " 木偶全身心投入现在。它也建议你有那种态度。 "
  npc_override_payon_in03_fortune_marionette_emphasizing_p_ed8667: " 木偶强调适当的饮食。不要太依赖肉类。 "
  npc_override_payon_in03_fortune_marionette_likes_shiny_m_b7392e: " 木偶喜欢闪亮的金钱。不是暗淡的钱，而是闪亮的那种。 "
  npc_override_payon_in03_fortune_marionette_marionette_fo_d5fc4b: " 木偶永远是木偶。它的过去和未来永远不会改变。它的现在就是它的未来。你不觉得这很悲伤吗？ "
  npc_override_payon_in03_fortune_marionette_requires_lots_8fb788: " 木偶需要很多钱。它的开销是巨大的。你前面一定有很多开销。 "
  npc_override_payon_in03_fortune_marionette_restrained_ho_8d4061: " 木偶被束缚，但它希望有一天能获得自由。 "
  npc_override_payon_in03_fortune_marionette_s_eyes_warnin_d2f954: " 木偶的眼睛正在警告你的虚伪。谎言、欺骗、虚假的计算和行为……木偶正在警告所有这些。 "
  npc_override_payon_in03_fortune_marionette_says_you_must_304c34: " 木偶说你不能依赖暴力，要使用不同的方法。 "
  npc_override_payon_in03_fortune_marionette_treasures_art_643041: " 木偶珍视艺术胜过财富。记住这一点。荣誉高于资产。 "
  npc_override_payon_in03_fortune_marionette_uses_lot_mone_d76886: " 木偶花很多钱。你周围也有那样的人。 "
  npc_override_payon_in03_fortune_marionette_warning_about_c5ee2a: " 木偶正在警告不祥的活动。如果你最近做了什么，你应该尽快解决。 "
  npc_override_payon_in03_fortune_may_difficult_if_you_cau_e8d81f: " 如果你被一种情况困住，可能会很困难。好的时候为坏的时候做准备，坏的时候期待好运。 "
  npc_override_payon_in03_fortune_maybe_means_he_sees_type_a79348: " 也许它的意思是他看到了你身上的那种傲慢？既然巴风特在警告你…… "
  npc_override_payon_in03_fortune_maybe_you_being_troubles_8d3e49: " 也许你在惹麻烦？努力放松一下。 "
  npc_override_payon_in03_fortune_maybe_you_discouraged_li_a387cf: " 也许你现在有点太沮丧了。勇敢大胆一点，年轻人。 "
  npc_override_payon_in03_fortune_maybe_you_using_love_as_d4a9cd: " 也许你在用爱情作为工作的借口？这张牌说试着从不同角度观察爱情。 "
  npc_override_payon_in03_fortune_meaning_your_future_beco_445477: " 这意味着你的未来将成为幸福与挫折之间的战斗…… "
  npc_override_payon_in03_fortune_means_if_you_go_after_c5ba72: " 这意味着如果你追求名声和永生，悲剧最终会等着你。它们不是生命中重要的东西。 "
  npc_override_payon_in03_fortune_means_now_time_wait_how_c1ca2a: " 这意味着现在是等待的时候。怎么样，你愿意等一会儿吗？ "
  npc_override_payon_in03_fortune_medusa_enjoy_playing_mon_f11726: " 美杜莎不喜欢玩弄金钱。如果你试图以不正当的方式使用金钱，你应该停止。为什么？ "
  npc_override_payon_in03_fortune_medusa_punishes_those_wh_e8b301: " 美杜莎惩罚那些不警告就挑战它的人。意想不到的惩罚。 "
  npc_override_payon_in03_fortune_medusa_s_warning_very_st_b6fbf9: " 美杜莎的警告非常严厉。仔细看看你周围。 "
  npc_override_payon_in03_fortune_medusa_says_there_great_e49931: " 美杜莎说未来会有巨大的混乱。混乱……我不确定它指的是什么类型的混乱，但肯定是以前从未发生过的事情。 "
  npc_override_payon_in03_fortune_medusa_strongly_recommen_c0d531: " 美杜莎强烈推荐储蓄。这张牌告诉你要储蓄。它说在你的头发里放很多储蓄账户，让自己像它的头型。 "
  npc_override_payon_in03_fortune_medusa_symbolizes_absolu_77889e: " 美杜莎象征着接受所有人挑战的绝对者。你的未来将处于被许多人挑战的位置。 "
  npc_override_payon_in03_fortune_medusa_symbolizes_absolu_ad3d1d: " 美杜莎象征着接受所有人挑战的绝对者。你的未来一定充满挑战！ "
  npc_override_payon_in03_fortune_medusa_warning_about_per_84dd8a: " 美杜莎正在警告你关于你附近的人。关于他们的存在……以及关系，"
  npc_override_payon_in03_fortune_medusa_warning_you_nice_d705f9: " 美杜莎警告你要对他人友善，否则它会把你变成石头。"
  npc_override_payon_in03_fortune_medusa_warning_you_retur_980ba2: " 美杜莎警告你要按时归还借来的东西。 "
  npc_override_payon_in03_fortune_medusa_you_should_carefu_7b7a66: " 那是美杜莎。你应该小心。警告很久以前就结束了。 "
  npc_override_payon_in03_fortune_menu_i_949774: "我想要塔罗牌占卜。:什么是塔罗牌占卜？"
  npc_override_payon_in03_fortune_menu_i_9c69b8: " 我想要波利牌占卜。 : 什么是波利牌占卜？ "
  npc_override_payon_in03_fortune_menu_i_a7133e: " （我好奇爱情！） : （我想在学校表现好！） : （我的友谊会完好无损吗？） : （我想知道未来的自己！） : （我会赚很多钱吗？） "
  npc_override_payon_in03_fortune_menu_love_1e9844: " 爱情必须有两样东西:巨大的力量和生存的意志。你有没有想过你现在的自己能否克服这个？ "
  npc_override_payon_in03_fortune_menu_the_f45023: " 飞蛾的警告:'危险！'。一个非常简单但明显的警告。 "
  npc_override_payon_in03_fortune_menu_yes_716132: " 是的。 : 我想再考虑一下。 "
  npc_override_payon_in03_fortune_menu_yes_d6109a: "是的。:我想再考虑一下。"
  npc_override_payon_in03_fortune_menu_you_bd7b28: " 你需要想一个比金钱更高尚的理想。骑士建议的运势是:骑士从不谈论赚钱的方法。 "
  npc_override_payon_in03_fortune_might_seem_funny_bull_lo_a4270c: " 牛会看向未来可能看起来很有趣，但牛现在正在看向你的未来。 "
  npc_override_payon_in03_fortune_misfortune_shown_knight_6cc6a1: " 骑士牌显示的不幸是急躁。这也是夺走骑士生命的东西。 "
  npc_override_payon_in03_fortune_mmm_long_awaited_time_co_e6ef00: " 嗯！期待已久的时刻到了！向可爱的波利询问关于金钱的问题！ "
  npc_override_payon_in03_fortune_mmm_you_both_gone_crazy_f4ec3c: " 嗯！你们都疯了。你们必须通过对话来克服！ "
  npc_override_payon_in03_fortune_mmph_you_re_dying_study_3d1c13: " 嗯！你为了不学习都快死了！这种时候，休息是最好的！ "
  npc_override_payon_in03_fortune_money_automatically_come_382526: " 金钱不会自动来到不努力的人身边！无论运势多好，你都必须勤奋工作！ "
  npc_override_payon_in03_fortune_money_like_clouds_instea_dd89fc: " 金钱就像云！不要想钱，想想幸福的生活！ "
  npc_override_payon_in03_fortune_money_like_sand_even_you_873cfe: " 金钱就像沙子。即使你存了它，风一吹就消失了。这张牌显示了金钱的空虚。 "
  npc_override_payon_in03_fortune_monster_card_reading_use_35cc45: " 怪物牌占卜使用我们周围熟悉的怪物牌来获取关于我们未来、爱情和其他许多事情的建议。 "
  npc_override_payon_in03_fortune_most_people_curious_abou_76bb0a: " 大多数人对金钱很好奇。 "
  npc_override_payon_in03_fortune_moth_flies_around_withou_4b5106: " 飞蛾四处飞舞，不为未来担忧。它告诉你要自由飞翔，而不是为未来焦虑…… "
  npc_override_payon_in03_fortune_moth_says_time_think_abo_da9415: " 飞蛾说现在不是考虑财富和繁荣的时候。它说有人重要的人出现在你附近。 "
  npc_override_payon_in03_fortune_moth_used_when_caterpill_17294e: " 飞蛾在还是毛毛虫时被利用，变成飞蛾后被人类忽视。 "
  npc_override_payon_in03_fortune_moth_warning_you_you_sho_72e1bd: " 飞蛾正在警告你这个。你应该小心。 "
  npc_override_payon_in03_fortune_msg_6eae3a: "……"
  npc_override_payon_in03_fortune_must_you_love_one_hair_62bb8c: " 你必须爱那个有着蛇发的人吗？重新考虑这份爱情，认真想想。 "
  npc_override_payon_in03_fortune_necessary_reflect_upon_p_4f3b89: " 为了看向未来，有必要反思过去和现在。这张牌说仔细审视你的过去。 "
  npc_override_payon_in03_fortune_need_i_say_more_s_7a99cc: " 还需要我多说吗？那是个危险的想法！！ "
  npc_override_payon_in03_fortune_newton_discovered_gravit_4901b2: " 牛顿通过掉落的苹果发现了万有引力！小心你周围的小事！ "
  npc_override_payon_in03_fortune_next_time_you_meet_them_ac4291: " 下次你见到他们时，给他们按摩。从小事做起。 "
  npc_override_payon_in03_fortune_nice_cup_cold_juice_unde_e83e31: " 在烈日下喝一杯冰凉的果汁！学习也应该这样做！ "
  npc_override_payon_in03_fortune_no_always_return_change_c63d4c: " 不行！一定要找零。 "
  npc_override_payon_in03_fortune_no_matter_how_fearful_bu_aa990b: " 无论牛多么可怕，它有一个鼻环，它已经被人类驯服了。无论那个人多么惊人，驯服是你的责任。 "
  npc_override_payon_in03_fortune_no_matter_how_little_amo_fec70e: " 无论金额多么小，你都不能只是留着。苏菲非常讨厌这样。 "
  npc_override_payon_in03_fortune_no_matter_how_romantic_b_7a83c5: " 无论爱情多么浪漫和美丽，如果它不正当，它就是不可取的…… "
  npc_override_payon_in03_fortune_no_matter_what_other_peo_33a5eb: " 无论别人怎么说，奔向你的爱人！一心一意的爱！ "
  npc_override_payon_in03_fortune_no_matter_what_person_ph_4143e0: " 无论一个人做什么，体力是最重要的。锻炼变得更强。 "
  npc_override_payon_in03_fortune_no_matter_what_stealing_0f7eb6: " 无论如何，偷窃都是错的！即使是海盗之王德雷克也以海盗之名祝福你！偷窃是被禁止的！ "
  npc_override_payon_in03_fortune_no_need_worry_about_oste_69eb39: " 不用担心骨质疏松！吃那么多钙不是好事吗？哎呀！这不是关于钱的？！ "
  npc_override_payon_in03_fortune_no_smoking_even_friend_s_d5c4ce: " 不要吸烟，即使是和朋友一起！为了你的健康戒烟！ "
  npc_override_payon_in03_fortune_no_your_heart_about_leav_47c82e: " 不！你的心正要离开你的爱情！抓住它！ "
  npc_override_payon_in03_fortune_nobody_tell_me_anything_7ef308: "但没人会告诉我任何事~"
  npc_override_payon_in03_fortune_noooooooo_stealing_f57c66: " 不~~~~~~~~要偷窃！ "
  npc_override_payon_in03_fortune_nope_ee47a2: "不！"
  npc_override_payon_in03_fortune_nope_i_read_cards_you_986747: "不，我可以为你读牌！"
  npc_override_payon_in03_fortune_nor_lover_awaiting_him_s_a7a09e: " 也没有爱人在等他，所以孤独击中了他的心。 "
  npc_override_payon_in03_fortune_normal_worker_one_great_ad1184: " 不是普通工人，而是一个拥有巨大力量和威势的人…… "
  npc_override_payon_in03_fortune_northwest_you_like_try_y_c09fd4: " 西北方？你想在那个方向试试运气吗？ "
  npc_override_payon_in03_fortune_nyangnyangnyang_53c6a0: "喵呜喵呜喵呜~"
  npc_override_payon_in03_fortune_nyanyangnyanyag_f74d25: "喵呜喵呜喵呜喵~"
  npc_override_payon_in03_fortune_nyanyangnyanyang_8c75ec: "喵呜喵呜喵呜喵呜~"
  npc_override_payon_in03_fortune_oh_no_person_your_friend_2ce8a2: "哦不？！这个人不是你的朋友，而是敌人！你必须小心！ "
  npc_override_payon_in03_fortune_oh_no_you_confident_abou_44c84c: " 哦不！你对未来没有信心！多相信自己一点！希望！ "
  npc_override_payon_in03_fortune_oh_no_you_lost_your_5ece43: " 哦不！你失去了你的爱人。而且，周围没有相似的人。振作起来！ "
  npc_override_payon_in03_fortune_oh_no_you_re_missing_51e567: " 哦，不！你错过了要点！找出本质！ "
  npc_override_payon_in03_fortune_oh_no_your_friend_ignori_0004d6: " 哦不！你的朋友在无视你！给你的朋友一瓶果汁！你们的友谊可能会回来？ "
  npc_override_payon_in03_fortune_oh_no_your_love_danger_2334e4: " 哦不！你的爱情处于危险之中！逃离威胁！ "
  npc_override_payon_in03_fortune_oh_you_keep_thinking_abo_458d94: " 哦！你一直在想未来的死亡！首先，忘记死亡，好好生活！ "
  npc_override_payon_in03_fortune_oh_your_lover_about_leav_a1ced4: " 哦！你的爱人正要离开你身边！抓紧了！ "
  npc_override_payon_in03_fortune_ohh_cute_love_fortune_he_8e5b1b: " 哦！可爱的爱情运势！嘿！让我们看看牌！ "
  npc_override_payon_in03_fortune_ok_keep_mind_933254: " 好吗？记住这一点~ "
  npc_override_payon_in03_fortune_ok_let_s_try_c4a49f: " 好！让我们试试！ "
  npc_override_payon_in03_fortune_ok_then_come_again_next_354940: " 那好吧！下次再来！我们会做得很好！拜拜~！ "
  npc_override_payon_in03_fortune_ok_then_young_adventurer_97299d: " 那好吧。年轻的冒险者，祝你好运…… "
  npc_override_payon_in03_fortune_once_sohee_didn_t_get_7a30cc: " 有一次，苏菲让婴儿鬼魂跑腿时没有拿回找零。 "
  npc_override_payon_in03_fortune_once_you_emptied_your_mi_64c3fd: "一旦你清空了思绪，想想你最想知道的事情。"
  npc_override_payon_in03_fortune_once_you_type_willpower_3dadc9: " 一旦你有了那种意志力，通往未来的道路就会非常广阔和光明。 "
  npc_override_payon_in03_fortune_one_cannot_live_as_knigh_9af40c: " 一个人如果不为那种未来感到骄傲，就不能作为骑士生活。 "
  npc_override_payon_in03_fortune_one_day_when_you_wake_f4325b: " 有一天，当你醒来时，你的爱人会留下一份礼物！开心！ "
  npc_override_payon_in03_fortune_one_more_thing_adad83: " 还有……一件事。 "
  npc_override_payon_in03_fortune_one_person_left_out_amon_2a7a24: " 你的朋友中有一个人被冷落了！更友好一点！ "
  npc_override_payon_in03_fortune_one_thing_sure_you_very_9faf37: " 有一件事是肯定的，你会非常幸福！恭喜年轻人！ "
  npc_override_payon_in03_fortune_one_warning_sandman_resp_b731b4: " 来自睡魔的一个警告，尊敬你的父母。 "
  npc_override_payon_in03_fortune_one_you_love_give_you_5d99c7: " 你爱的人会给你死亡之吻。 "
  npc_override_payon_in03_fortune_only_small_part_your_fut_129ba1: " 这只是你未来的一小部分！你必须发现其余的部分！ "
  npc_override_payon_in03_fortune_ooh_something_about_your_cd6919: " 哦……关于你的运势开始显现了…… "
  npc_override_payon_in03_fortune_oooh_stern_warning_about_8dbc8e: " 哦，关于未来的严厉警告！年轻人，记住这一点。 "
  npc_override_payon_in03_fortune_orc_lord_expressing_oppo_c6d2ab: " 兽人领主表达了对过于好奇未来的反对。 "
  npc_override_payon_in03_fortune_orc_lord_likes_gold_all_a5756f: " 兽人领主喜欢黄金。在所有宝藏中，黄金是最好的。密切关注黄金。 "
  npc_override_payon_in03_fortune_orc_lord_possesses_much_034b78: " 兽人领主拥有很多财富。这是因为贪婪。贪婪是收集金钱必不可少的。赚钱的欲望和贪婪不是什么可耻的事。勤奋地去赚钱吧。 "
  npc_override_payon_in03_fortune_orc_lord_says_dairy_farm_044dc8: " 兽人领主说乳业将在未来发展。你为什么不也投资呢？ "
  npc_override_payon_in03_fortune_orc_lord_says_love_your_028ad9: " 兽人领主说对同伴的爱会在未来成为巨大的力量。 "
  npc_override_payon_in03_fortune_orc_lord_says_you_need_f3d467: " 兽人领主说你未来需要巨大的力量。比现在大三、四倍的力量。 "
  npc_override_payon_in03_fortune_orc_lord_starts_drooling_a59839: " 兽人领主开始对任何涉及金钱的事情流口水。它瞄准任何有钱的人。 "
  npc_override_payon_in03_fortune_orc_lord_warning_about_d_373f85: " 兽人领主正在警告关于毁灭。它非常了解毁灭，因为它是毁灭的大师。 "
  npc_override_payon_in03_fortune_orc_lord_warning_you_abo_707d4d: " 兽人领主正在警告你关于自由。自由不是好事吗？ "
  npc_override_payon_in03_fortune_orc_lord_warning_you_opp_97e152: " 兽人领主警告你关于异性。是的。她们有毒。保持距离。 "
  npc_override_payon_in03_fortune_orc_lord_warning_you_sel_073b6a: " 兽人领主正在警告你关于自以为是。这是最危险的害虫，会吞噬你。 "
  npc_override_payon_in03_fortune_passion_love_like_raging_719720: " 像汹涌波涛一样的爱情激情……你甚至无法隐藏它。 "
  npc_override_payon_in03_fortune_passion_love_like_raging_c1ec59: " 像汹涌波涛一样的爱情激情……你甚至无法隐藏它。 "
  npc_override_payon_in03_fortune_passionate_love_nearby_g_5d2d29: " 热烈的爱情就在附近。这是个好兆头。 "
  npc_override_payon_in03_fortune_pattern_clothes_symboliz_591ded: " 衣服的图案象征着警告。它说要小心爱情。 "
  npc_override_payon_in03_fortune_pay_little_more_attentio_cb8ce6: " 多关注现在。 "
  npc_override_payon_in03_fortune_perhaps_person_you_belie_2cfe60: " 也许你认为是蝴蝶的人实际上是飞蛾。这个运势在等待审慎的判断。 "
  npc_override_payon_in03_fortune_person_s_heart_like_card_d8d247: " 一个人的心就像这张牌。你翻开它，没人能告诉背面是什么。试着翻开那个人的牌。 "
  npc_override_payon_in03_fortune_pick_job_where_you_work_1485a1: " 选择一份可以和别人一起工作的职业！会很有收获的，对吧？ "
  npc_override_payon_in03_fortune_pirate_warning_you_your_0c7056: " 海盗正在警告你关于你的美貌。不要太炫耀你的美貌。海盗也很嫉妒外表。 "
  npc_override_payon_in03_fortune_pirates_betrayal_means_t_833763: " 对海盗来说，背叛意味着悲惨的死亡。小心背叛。 "
  npc_override_payon_in03_fortune_pirates_future_doesn_t_m_12ee9f: " 海盗没有未来。这并不意味着你没有。但是……你只需要做出更谨慎的决定。 "
  npc_override_payon_in03_fortune_pirates_give_warnings_ab_e60b25: " 海盗对很多事情发出警告。但现在，这张牌在说背叛。 "
  npc_override_payon_in03_fortune_pirates_remembered_as_pi_0f0d2c: " 海盗即使死后也被记住为海盗。一个人的名字超越了生死。 "
  npc_override_payon_in03_fortune_please_pay_your_fee_all_ab3dfb: "请用你全部的诚意支付费用。"
  npc_override_payon_in03_fortune_point_where_challenge_ch_67dc9c: " ……到那种挑战会改变你人生的地步。 "
  npc_override_payon_in03_fortune_poke_poke_they_tell_you_ce056e: " 戳~戳~它们告诉你你的运势！这不是传统的，但活力是最好的！ "
  npc_override_payon_in03_fortune_poring_card_readings_foc_2045c3: " 波利牌占卜专注于可爱的波利牌……！ "
  npc_override_payon_in03_fortune_poring_fortunetelling_wo_c81a10: " 波利占卜在关于友谊方面非常有效！ "
  npc_override_payon_in03_fortune_praising_type_love_alway_a31754: " 这是在赞美那种总是在那里，却几乎没有形态的爱情。 "
  npc_override_payon_in03_fortune_prepare_event_love_they_65a0fc: " 准备一场爱情活动！他们会高兴得飞起来！ "
  npc_override_payon_in03_fortune_prepare_hat_cover_your_f_9565c4: " 准备一顶帽子盖住你朋友的大脑袋！他们会被你的关心感动的！ "
  npc_override_payon_in03_fortune_prepare_present_your_lov_715a00: " 为你的爱人准备礼物！他们可能会因为幸福过度而心脏病发作！ "
  npc_override_payon_in03_fortune_reason_person_may_seem_c_c20222: " 这个人看起来反复无常或狡猾的部分原因是他们天生如此。 "
  npc_override_payon_in03_fortune_reason_pirates_indulge_o_190162: " 海盗在广阔汹涌的海洋中沉溺于他人的财产，是因为这是让陆地上的人知道他们存在的唯一方式。 "
  npc_override_payon_in03_fortune_relationships_among_frie_ad13c0: " 朋友之间的关系比人们想象的更难！让我们用牌来尝试解决这个复杂的友谊难题！ "
  npc_override_payon_in03_fortune_respect_his_opinion_youn_f5e974: " 尊重他的意见，年轻人。你不会失去任何东西。 "
  npc_override_payon_in03_fortune_rid_yourselves_shadow_th_eb4c66: " 摆脱那个阴影。然后玩偶也会微笑。 "
  npc_override_payon_in03_fortune_romance_best_part_love_1ac0e9: " 浪漫是爱情最美好的部分~ "
  npc_override_payon_in03_fortune_romance_lays_ahead_your_63fbf1: " 浪漫在你的未来等着你！放松自己，做好准备！ "
  npc_override_payon_in03_fortune_rough_sea_called_world_o_53caf6: " 在这个被称为世界的汹涌大海中，只有海盗，爱情的不法之徒，才是法则。 "
  npc_override_payon_in03_fortune_s_bad_you_punished_1f446b: " 那很糟糕！你会受到惩罚的！ "
  npc_override_payon_in03_fortune_s_fortune_marina_card_8bee4e: " 那是海葵牌的运势。 "
  npc_override_payon_in03_fortune_s_good_sign_congratulati_9933f0: " 这是个好兆头！恭喜！ "
  npc_override_payon_in03_fortune_s_hard_make_money_isn_eed252: " 赚钱很难，不是吗？但不要忘记生活中的善行！ "
  npc_override_payon_in03_fortune_s_uneasy_fortune_you_rea_30e895: " 这是一个不安的运势。你准备好了吗？ "
  npc_override_payon_in03_fortune_s_why_future_unexpected_56a8c5: " 这就是为什么它是未来。未来偶尔会出乎意料地发生事情。啦啦~ "
  npc_override_payon_in03_fortune_s_why_he_knows_about_d5eb85: " 这就是为什么他知道毁灭带来的危险和不幸。不要轻率地毁灭。你最终也会毁灭自己。 "
  npc_override_payon_in03_fortune_s_why_those_who_controll_5e50e7: " 这就是为什么被傻瓜控制的人认为对方也是傻瓜。 "
  npc_override_payon_in03_fortune_s_why_you_should_more_c106af: " 这就是为什么你应该更小心。 "
  npc_override_payon_in03_fortune_sadness_failure_darkness_299b58: " 悲伤、失败、黑暗、孤独……你可能会感受到所有这些情绪，但它们不是致命的。别担心。 "
  npc_override_payon_in03_fortune_sadness_natural_feeling_dfe52f: " 悲伤是一种自然的情绪，但不要让它击垮你。 "
  npc_override_payon_in03_fortune_same_concept_you_ready_a_3745f0: " 概念是一样的。如果你准备好了，任何类型的爱情都是可能的。没有不可能的事。 "
  npc_override_payon_in03_fortune_same_goes_humans_wary_th_510069: " 人类也是如此。警惕那些像兽人领主一样贪婪的人。 "
  npc_override_payon_in03_fortune_same_life_17ca89: " 生活中也是如此。 "
  npc_override_payon_in03_fortune_sand_dune_changes_its_sh_0bd8ce: " 沙丘即使一天后也会改变形状。睡魔牌在说一个充满变化的未来。 "
  npc_override_payon_in03_fortune_sand_instant_cure_athlet_741df1: " 沙子是脚气的即时治愈方法。他说要小心脚气，他讨厌那些把感染的脚蹭进他身体的人。 "
  npc_override_payon_in03_fortune_sand_s_future_simply_san_2a26b6: " 沙子的未来只是沙子。不是岩石，也不是泥土。有些东西就是不会改变，年轻人。 "
  npc_override_payon_in03_fortune_sandman_cries_sadness_wh_ae377e: " 当提到钱时，睡魔悲伤地哭泣。它很伤心，因为金钱不具备爱或感情。 "
  npc_override_payon_in03_fortune_sandman_likes_save_too_e_b6adb5: " 睡魔也喜欢储蓄。连怪物都喜欢储蓄，但当人类不储蓄时…… "
  npc_override_payon_in03_fortune_sandman_s_body_empty_ins_237a63: " 睡魔的身体里面是空的。你的钱包似乎也空了。你应该存点钱。 "
  npc_override_payon_in03_fortune_sandman_s_warning_very_s_a0cb47: " 睡魔的警告非常严厉。经常洗脚，年轻人。 "
  npc_override_payon_in03_fortune_sandman_says_over_sleepe_f57d2c: " 睡魔说过度睡眠的人会被社会惩罚！ "
  npc_override_payon_in03_fortune_sandman_says_watch_out_b_3779ec: " 睡魔说小心不要变成鸡那样。 "
  npc_override_payon_in03_fortune_sandman_screaming_becaus_a8c0cd: " 睡魔因为看到太多钱而尖叫。它看到了你未来手中的钱。我想知道那些钱是什么？ "
  npc_override_payon_in03_fortune_saying_careful_burn_your_aeca6a: " 它说小心不要用香烟烧到你的胡子。当你做某事时，总有东西处于危险中……它可能是在警告这个。 "
  npc_override_payon_in03_fortune_saying_daring_action_nec_367a75: " 它说像霍德从沙子里冲出来那样的大胆行动是必要的。 "
  npc_override_payon_in03_fortune_saying_forgive_those_who_33e6ba: " 说它不会原谅那些像黑洞一样使用别人东西的人……借了从不归还 "
  npc_override_payon_in03_fortune_saying_studying_dark_nig_b2bb09: " 它说在黑夜中学习可能是危险的！晚上学习时要小心！ "
  npc_override_payon_in03_fortune_saying_type_behavior_sur_476ab5: " 说那种行为肯定会招来怪物的诅咒。 "
  npc_override_payon_in03_fortune_says_became_like_because_07975c: " 它说是因为不良的饮食习惯才变成那样的。 "
  npc_override_payon_in03_fortune_says_better_i_no_idea_6846c5: " 它说要做得更好……我不知道它是什么意思。 "
  npc_override_payon_in03_fortune_says_nothing_you_particu_b53375: " 它说对你没有什么特别的。没有什么不祥的。 "
  npc_override_payon_in03_fortune_says_say_one_thing_you_37ec3d: " 它说会为你讲一件事。在晴朗的天空之外可以看到乌云。 "
  npc_override_payon_in03_fortune_says_there_no_set_path_7febef: " 它说未来没有固定的道路。这在某种程度上不是一种解脱吗？ "
  npc_override_payon_in03_fortune_says_too_caught_up_prese_8db06a: " 它说不要太沉迷于现在，因为未来总是在变化。 "
  npc_override_payon_in03_fortune_says_what_you_need_pride_4c2952: " 它说你需要的是骄傲。不是荣誉、财富或爱情……而是骄傲。 "
  npc_override_payon_in03_fortune_says_you_might_tempted_s_e603f5: " 它说你可能会被诱惑去做坏事来收集金钱！不要忘记善良的心！ "
  npc_override_payon_in03_fortune_scariest_thing_hammer_no_5ddd6e: " 最可怕的不是锤子也不是角。而是支撑它沉重体重的巨大双腿。没人能在那些腿的撞击下幸存。那个人可能也在隐藏最危险的部分。 "
  npc_override_payon_in03_fortune_scrumptious_ice_cream_co_c5d678: " 即使在天堂也能吃到的美味冰淇淋！挑战自己，从事制作那种东西的工作！ "
  npc_override_payon_in03_fortune_scythe_baphomet_holding_ae8611: " 巴风特持有的镰刀象征着征服未来的强烈意志。 "
  npc_override_payon_in03_fortune_scythe_baphomet_means_st_6577a6: " 巴风特的镰刀意味着收集财富的强大工具。如果你有像他一样强大的工具，收集财富应该很容易。 "
  npc_override_payon_in03_fortune_scythe_may_seem_burdenso_171a2d: " 镰刀可能看起来很沉重，但强大的巴风特可以自由使用它。 "
  npc_override_payon_in03_fortune_seeing_he_warning_about_c99f00: " 看到他在警告关于仇恨。你不觉得在这种时候避开他的目光是个好主意吗？ "
  npc_override_payon_in03_fortune_seeing_hode_spits_out_sa_d0094f: " 看到霍德向打扰它们的人吐沙子，你一定以某种方式打扰了那个人。 "
  npc_override_payon_in03_fortune_seeing_you_work_so_hard_9e4313: " 看到你工作这么努力，看起来你会赚很多钱！恭喜~！ "
  npc_override_payon_in03_fortune_seems_as_if_your_friend_0b41a9: " 看起来你的朋友会给你很多礼物！期待吧！ "
  npc_override_payon_in03_fortune_seems_like_darkness_its_864de5: " 看起来黑暗正在路上。小心，这个黑暗不寻常。 "
  npc_override_payon_in03_fortune_seems_like_he_wants_tell_bcc9f7: " 看起来他想告诉你这个。 "
  npc_override_payon_in03_fortune_seems_like_jack_worried_dbc1b0: " 看起来杰克担心过度的笑话。 "
  npc_override_payon_in03_fortune_seems_like_you_two_lucky_99f8a8: " 看起来你会有两次幸运的祭品！不要错过这两个机会！ "
  npc_override_payon_in03_fortune_serious_problem_your_lif_7b1e76: " 这是个严重的问题。这是你的生命，所以好好想想，年轻人。 "
  npc_override_payon_in03_fortune_set_goal_higher_than_mon_5348c4: " 设定一个高于金钱和财富的目标。你明白吗，年轻人？ "
  npc_override_payon_in03_fortune_share_your_bone_your_fri_af4724: " 和你的朋友分享你的骨头！友谊中的牺牲是美丽的！ "
  npc_override_payon_in03_fortune_shouldn_t_you_reconsider_bbf8d4: " 你不应该重新考虑仅仅为了钱而违背意愿工作吗？ "
  npc_override_payon_in03_fortune_shovel_5434bd: " 铲子……？ "
  npc_override_payon_in03_fortune_shoveling_requires_skill_929d22: " 铲土也需要技巧。 "
  npc_override_payon_in03_fortune_skeleton_ability_dig_whe_35ef1d: " 骷髅有在它感觉到未来的地方挖掘的能力，而不是看向未来。 "
  npc_override_payon_in03_fortune_skeleton_card_gray_tone_7d9be3: " 骷髅牌是灰色调的。如果你读懂灰色，你就能看到黑暗。 "
  npc_override_payon_in03_fortune_skeleton_encouraging_you_de6dbf: " 骷髅鼓励你即使在黑暗潮湿的地方也不要失去光明。 "
  npc_override_payon_in03_fortune_skeleton_s_pickaxe_very_ab9cca: " 骷髅的镐头非常强壮。即使它的身体看起来很弱，有了正确的工具，它也能做伟大的事情。 "
  npc_override_payon_in03_fortune_skeleton_says_you_make_m_2f2cd6: " 骷髅说你可以通过向北走赚钱。向北走。 "
  npc_override_payon_in03_fortune_skeleton_warning_you_abo_0b6297: " 骷髅正在警告你不规律的饮食习惯。 "
  npc_override_payon_in03_fortune_small_territory_ensure_g_14429b: " 一个小领地会确保巨大的幸福。 "
  npc_override_payon_in03_fortune_smoking_mine_imprudent_l_a5b4c6: " 在矿井里吸烟是轻率的、危及生命的行为。你在用那种行为浪费你宝贵的生命。 "
  npc_override_payon_in03_fortune_so_7fe8c6: "是这样吗……？"
  npc_override_payon_in03_fortune_so_cursed_make_effort_le_263aaa: " 所以，为了不被诅咒，努力在历史上留下你的名字。 "
  npc_override_payon_in03_fortune_so_don_t_blame_your_cf31d3: " 所以不要责怪你现在的身体，去寻找正确的工具。然后你会有好结果。 "
  npc_override_payon_in03_fortune_so_don_t_upset_about_559ffe: " 所以不要为此难过！ "
  npc_override_payon_in03_fortune_so_empty_upsetting_don_t_76de90: " 所以~空空的。令人沮丧，但不要太担心钱！更好的事情一定会发生！ "
  npc_override_payon_in03_fortune_so_train_yourself_tempte_6c9621: " 所以训练自己不要被诱惑。 "
  npc_override_payon_in03_fortune_so_try_offering_part_you_25cc8f: " 所以试着把你的一部分财产献给巴风特。 "
  npc_override_payon_in03_fortune_so_worry_move_29808b: " 所以不要担心，继续前进。 "
  npc_override_payon_in03_fortune_so_you_don_t_repeat_e10eb4: " 这样你就不会重复他的错误。小心急躁。 "
  npc_override_payon_in03_fortune_so_you_like_monster_card_aba84e: "那么，你想要怪物牌占卜吗？ "
  npc_override_payon_in03_fortune_so_you_malicious_desires_caf908: " 所以如果你有恶意，忘记它们。邪恶的心很容易招来不幸。 "
  npc_override_payon_in03_fortune_so_you_need_try_somethin_a2418f: " 所以，你需要尝试魅力以外的东西。 "
  npc_override_payon_in03_fortune_so_you_quickly_respond_c_19bda7: " 这样你就能快速应对危机。 "
  npc_override_payon_in03_fortune_so_you_should_start_savi_9f959f: " 所以你也应该开始储蓄。 "
  npc_override_payon_in03_fortune_so_your_best_119a80: " 所以尽你所能。 "
  npc_override_payon_in03_fortune_sohee_dislikes_stinky_fe_cfaeb1: " 苏菲讨厌臭脚。不要忘记洗脚。 "
  npc_override_payon_in03_fortune_sohee_dislikes_wealthy_t_c5cabf: " 苏菲讨厌富人。他们试图收集金钱，但从不为他人使用。如果你不想被苏菲诅咒，你需要学会慷慨地使用金钱。 "
  npc_override_payon_in03_fortune_sohee_hates_misers_she_b_668cce: " 苏菲讨厌吝啬鬼。她相信自己变成这样是因为一个吝啬鬼。不要在苏菲面前吝啬！ "
  npc_override_payon_in03_fortune_sohee_likes_foreign_mone_7bbd53: " 苏菲喜欢外币。它们可爱又漂亮。如果你有外币，苏菲会爱你。 "
  npc_override_payon_in03_fortune_sohee_likes_take_care_he_5b2e91: " 苏菲喜欢照顾自己的外表。如果你不这样做，苏菲会生你的气。 "
  npc_override_payon_in03_fortune_sohee_stands_tip_her_toe_3de3a3: " 苏菲踮着脚尖站着。这是因为她的脚趾非常强壮。 "
  npc_override_payon_in03_fortune_sohee_wearing_fine_artic_c9b272: " 苏菲穿着一件精美的衣服。要穿那样的衣服，你需要很多钱。你知道秘诀是什么吗？苏菲活着的时候存了很多钱。 "
  npc_override_payon_in03_fortune_soldier_waiting_attack_i_4bf3a7: " 那个士兵是在等待攻击吗？我能感觉到马和骑士之间的巨大张力。 "
  npc_override_payon_in03_fortune_solving_wonders_future_t_b7d9c6: " 用这些可爱又迷人的波利牌解开未来的奥秘！ "
  npc_override_payon_in03_fortune_someone_after_you_person_2d0de7: " 有人在盯着你。那个人像图片一样非常强壮。他们可能对你怀恨在心。 "
  npc_override_payon_in03_fortune_someone_knows_dangers_yo_57029e: " 有人知道你不知道的危险，会以牌的形式警告你……所以仔细听-！ "
  npc_override_payon_in03_fortune_someone_return_something_36a067: " 有人会归还你丢失的东西！多么令人欣慰！ "
  npc_override_payon_in03_fortune_something_exciting_may_h_cb823f: " 令人兴奋的事情可能会发生！会是什么呢？好玩！好玩！ "
  npc_override_payon_in03_fortune_something_good_might_hap_b2ac82: " 在这个美好的日子里可能会有好事发生！你可以期待！耶！ "
  npc_override_payon_in03_fortune_something_very_rare_may_de180b: " 非常稀有的东西可能会来到你身边。金矿自古以来就是许多人的梦想。你面前就有一个金矿。 "
  npc_override_payon_in03_fortune_sometime_your_future_fut_0ca70a: " 在你未来的某个时候，一个像德古拉一样的未来在等着你。 "
  npc_override_payon_in03_fortune_sound_moth_s_wings_flutt_7d8ea3: " 飞蛾翅膀扇动的声音意味着混乱。你周围可能会发生混乱的事件。 "
  npc_override_payon_in03_fortune_spades_means_death_joker_dbdf49: " 黑桃意味着死亡。小丑故意留下那种标记。 "
  npc_override_payon_in03_fortune_speaking_future_as_dange_bbee63: " 谈论未来是一种危险的行为。 "
  npc_override_payon_in03_fortune_splendid_event_held_go_g_9815ae: " 一场盛大的活动即将举行！去准备吧！期待吧！ "
  npc_override_payon_in03_fortune_stomach_pocket_there_mus_5e65a2: " 在胃袋里，一定有一个秘密宝藏。你的口袋里也可能有东西。 "
  npc_override_payon_in03_fortune_story_i_heard_skeleton_g_976921: " 我从骷髅那里听到的故事是这样的。我是未来的国王。这到底是什么意思？ "
  npc_override_payon_in03_fortune_strange_come_up_about_lo_b5bff0: " 关于爱情出现这个很奇怪…… bizarre……你不是在用这把铲子报复某人吧？？ "
  npc_override_payon_in03_fortune_strengthen_your_body_obs_7152f5: " 强化你的身体并观察目标。这是成功的步骤。 "
  npc_override_payon_in03_fortune_study_little_little_make_4d3761: " 一点一点地学习，让自己感觉更轻松！如果你被文字压得喘不过气，你就无法学习！ "
  npc_override_payon_in03_fortune_study_something_make_peo_1c894d: " 学习一些能让人们快乐的东西！未来已定！ "
  npc_override_payon_in03_fortune_studying_came_strange_pl_fffde6: " 学习来到了一个奇怪的地方！它需要找到原来的道路！你能做到！ "
  npc_override_payon_in03_fortune_studying_effort_more_imp_03ea8b: " 但在学习中，努力比任何类型的运势都重要！ "
  npc_override_payon_in03_fortune_studying_just_like_hunti_f9875c: " 学习就像在沙漠中狩猎怪物。休息一会儿是最好的。明白了吗？ "
  npc_override_payon_in03_fortune_such_passionate_love_isn_ea5ef4: " 有如此热烈的爱情，不是只有一条路吗……？ "
  npc_override_payon_in03_fortune_t_help_they_don_t_1d8306: " 但没办法，他们不喜欢小狗。 "
  npc_override_payon_in03_fortune_t_you_hear_cry_card_ef37bf: " 你听不到牌的哭声吗？它在受苦。爱情就是这样…… "
  npc_override_payon_in03_fortune_take_anubis_s_advice_avo_ad7680: " 接受阿努比斯的建议，避开黑暗。这是最明智的选择。 "
  npc_override_payon_in03_fortune_take_care_your_appearanc_669b8e: " 照顾好你的外表。把你牙齿间的辣椒拿出来！ "
  npc_override_payon_in03_fortune_take_careful_look_around_73bcc1: " 仔细看看你周围。宝藏无处不在。 "
  npc_override_payon_in03_fortune_take_close_look_1d3c51: " 仔细看看。 "
  npc_override_payon_in03_fortune_take_marionette_s_advice_49d5a2: " 接受木偶的建议。她从不说错话。呵呵…… "
  npc_override_payon_in03_fortune_teeth_dustiness_very_str_88dd1d: " 尘土怪的牙齿非常强壮。这意味着……有人可能会试图用牙齿咬你？！ "
  npc_override_payon_in03_fortune_teeth_dustiness_very_str_cea619: " 尘土怪的牙齿非常强壮。这意味着……用你的牙齿争取胜利？！ "
  npc_override_payon_in03_fortune_thank_you_then_we_shall_4aa8fc: " 谢谢~！那我们就来看看你的运势！ "
  npc_override_payon_in03_fortune_thankful_you_alive_thank_bad09a: " 感谢你活着。感恩本身应该会有很大帮助。 "
  npc_override_payon_in03_fortune_then_5a3625: "那么……"
  npc_override_payon_in03_fortune_then_gently_think_your_w_63d8a5: " 那么~轻轻地想想你的愿望！ "
  npc_override_payon_in03_fortune_then_good_luck_try_your_713c8a: " 那么祝你好运，尽力而为。 "
  npc_override_payon_in03_fortune_then_i_begin_tell_fortun_c2b459: "那么，我将开始讲述你愿望的运势。专注于你自己……"
  npc_override_payon_in03_fortune_then_jack_reward_you_ret_d0e172: " 那么，杰克会回报你。 "
  npc_override_payon_in03_fortune_then_only_skeleton_many_a8b3b9: " 那么不仅骷髅，很多人也会大大回报你。 "
  npc_override_payon_in03_fortune_then_search_different_ro_d5fbc9: " 然后寻找不同的路线。这是明智的决定。 "
  npc_override_payon_in03_fortune_then_see_you_next_time_d30896: " 那么，下次见~~~~~ "
  npc_override_payon_in03_fortune_then_skeleton_help_you_h_958c41: " 那么骷髅会帮助你。你如何表达你的感激之情？ "
  npc_override_payon_in03_fortune_then_skeleton_think_you_55534a: " 那么骷髅会认为你帮助了它自己，会很高兴。多么愚蠢的怪物。哈哈。 "
  npc_override_payon_in03_fortune_then_there_surely_progre_61a2d5: " 那么肯定会有进展。 "
  npc_override_payon_in03_fortune_there_common_saying_when_50a961: " 有句俗话说，当飞蛾扇动翅膀时，财富也会飞走。这不是个很好的征兆。 "
  npc_override_payon_in03_fortune_there_danger_waiting_ahe_361bee: " 前方有危险在等着你！你现在应该避开它！照顾好自己！ "
  npc_override_payon_in03_fortune_there_jewel_your_mind_yo_492bc5: " 你的心中有一颗宝石！你需要把所有的智慧带到生活中！不要学坏东西！ "
  npc_override_payon_in03_fortune_there_may_big_crisis_don_29edf3: " 可能会有大危机！不要因为学不进去就太有压力！ "
  npc_override_payon_in03_fortune_there_much_more_life_tha_7e18a9: " 生活中比财富有更多东西。 "
  npc_override_payon_in03_fortune_there_must_great_fortune_e0d932: " 那个方向一定有很大的财富。 "
  npc_override_payon_in03_fortune_there_no_cure_poison_fb23d0: " 这种毒没有解药！ "
  npc_override_payon_in03_fortune_there_only_one_reason_jo_cadaa5: " 小丑要钱只有一个原因……拿走你的。 "
  npc_override_payon_in03_fortune_there_person_like_sure_y_faa67c: " 肯定有那样的人。你应该小心。 "
  npc_override_payon_in03_fortune_there_person_you_must_de_ada216: " 你附近有一个不能轻率打交道的人。不要轻率地说或做任何事。和这个人打交道时必须小心。 "
  npc_override_payon_in03_fortune_there_rare_precious_trea_57f420: " 沙子中有稀有而珍贵的宝藏。睡魔说，在广阔的沙世界中，一个宝藏将会被发现。那个宝藏就是你，年轻人。"
  npc_override_payon_in03_fortune_there_s_no_need_overdo_f34020: "没必要过度。只要全心全意地给予……*啧啧*"
  npc_override_payon_in03_fortune_there_s_phenomenon_you_d_b21e6f: " 有一种你不理解的现象！多做一点研究！你很快就能弄清楚！ "
  npc_override_payon_in03_fortune_there_should_great_wealt_f4acee: " 兽人领主的角所指的方向应该有巨大的财富。这张牌指向…… "
  npc_override_payon_in03_fortune_there_something_you_must_4b0755: " 在你的未来，有一些你必须战斗……并获胜的东西。 "
  npc_override_payon_in03_fortune_there_something_you_need_f00e38: " 被告知财富运势后，有一些你需要记住的事情！ "
  npc_override_payon_in03_fortune_there_those_who_born_des_91f21e: " 有些人天生就注定要撞上这堵墙，这个障碍。你的爱情似乎已经到达了那堵墙……一定很难。 "
  npc_override_payon_in03_fortune_therefore_don_t_speak_mo_d205a0: " 因此，不要和兽人领主谈论金钱。 "
  npc_override_payon_in03_fortune_therefore_getting_fortun_d365af: " 因此，得到这样的运势被认为是幸运的。利用这个运势来繁荣。 "
  npc_override_payon_in03_fortune_they_may_seem_dreary_omi_868419: " 他们可能看起来阴郁和不祥，但他们的衣着无可挑剔。他们对对方表现出虔诚。 "
  npc_override_payon_in03_fortune_they_might_feeling_one_e_47d8db: " 他们可能觉得一个不够。 "
  npc_override_payon_in03_fortune_they_seduce_you_numerous_e96a67: " 他们会无数次诱惑你。 "
  npc_override_payon_in03_fortune_those_who_live_land_need_903762: " 但生活在陆地上的人不需要这样做。不要觊觎别人的东西。这是海盗的建议。 "
  npc_override_payon_in03_fortune_those_who_work_hard_gath_4a9446: " 努力工作的人会收集到巨大的财富。骷髅说勤奋的工作会大大帮助收集财富。 "
  npc_override_payon_in03_fortune_too_much_greed_forbidden_7bd236: " 但是，太多的贪婪是被禁止的。 "
  npc_override_payon_in03_fortune_treasure_present_what_ca_4a51d8: " 珍惜现在……这是这张牌所说的。 "
  npc_override_payon_in03_fortune_treasure_without_knowing_c87e37: " 它在不知不觉中拥有宝藏。 "
  npc_override_payon_in03_fortune_true_advice_anubis_78e0e9: " 这是阿努比斯的真正建议。 "
  npc_override_payon_in03_fortune_trust_me_go_e85242: " 相信我，去做吧。 "
  npc_override_payon_in03_fortune_try_changing_your_dating_7518bd: " 试着改变你的约会方式。 "
  npc_override_payon_in03_fortune_try_doing_some_volunteer_53b5f1: " 试着做一些志愿工作！这很有价值，你也会感觉很好！ "
  npc_override_payon_in03_fortune_try_studying_aerospace_m_f6010a: " 试着学习航空航天或气象学！你不觉得会很有趣吗？ "
  npc_override_payon_in03_fortune_try_studying_history_our_f4a007: " 试着学习我们国家的历史！从老虎开始抽烟的时候起！ "
  npc_override_payon_in03_fortune_try_your_best_then_see_c8d6ea: " 尽你所能。那么，再见！拜~~~~~~~~~~拜~~~~拜~ "
  npc_override_payon_in03_fortune_trying_warn_something_ab_600d02: " 它试图警告关于未来的某事。小心。 "
  npc_override_payon_in03_fortune_type_fortune_never_wrong_d2fbe3: " 这种类型的运势从不出错。 "
  npc_override_payon_in03_fortune_type_stinginess_spite_ot_361ccc: " 那种吝啬会怨恨别人。在必要的时候使用金钱。 "
  npc_override_payon_in03_fortune_uh_oh_someone_after_your_70b993: " 哎呀！有人在盯上你的钱！好好保管！ "
  npc_override_payon_in03_fortune_uh_oh_someone_peeping_yo_9a4a77: " 哎呀！有人在偷窥你的爱情！去责骂他们！ "
  npc_override_payon_in03_fortune_uh_oh_you_re_about_5dad0a: " 哎呀！你快要被抢劫了！你必须先存一点！ "
  npc_override_payon_in03_fortune_uh_you_didn_t_share_99165b: " 啊！你没有和你的爱人分享你的果汁！真可惜！照顾好你的爱人！ "
  npc_override_payon_in03_fortune_unconcerned_expression_51f36d: " 它有一副漠不关心的表情。 "
  npc_override_payon_in03_fortune_unfortunately_i_agree_yo_cf66a7: " 不幸的是，我同意它，年轻人。 "
  npc_override_payon_in03_fortune_use_fortune_as_support_y_1217c6: " 把这个运势作为你生活的支撑。好吗？ "
  npc_override_payon_in03_fortune_use_your_money_buy_somet_a751c1: " 用你的钱买些有趣的东西！然后好运就会降临到你身上！ "
  npc_override_payon_in03_fortune_use_your_money_something_a2bc7f: " 把你的钱花在令人兴奋的事情上！看起来好运会降临到你身上！ "
  npc_override_payon_in03_fortune_very_favorable_s_point_i_276ccd: " 非常有利。我能从牌上感受到强烈的能量到这种程度。我会把一些能量给你。 "
  npc_override_payon_in03_fortune_very_good_thing_means_br_d9163c: " 这是非常好的事情。意味着光明清晰的未来。呵呵呵~ "
  npc_override_payon_in03_fortune_very_humanly_common_curi_5b6f72: " 这是非常人性化和常见的好奇心。牌对关于财富的运势非常吝啬。 "
  npc_override_payon_in03_fortune_very_nice_fortune_signif_98fa39: " 非常好。这个运势象征着'希望'。 "
  npc_override_payon_in03_fortune_very_romantic_hehe_424ba8: " 非常浪漫。呵呵。 "
  npc_override_payon_in03_fortune_very_witty_hoho_488139: " 非常机智，呵呵。 "
  npc_override_payon_in03_fortune_waaah_so_sad_ea14ca: "哇~好伤心~"
