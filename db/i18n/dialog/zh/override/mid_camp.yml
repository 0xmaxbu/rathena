Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_mid_camp_quests_13_1_aaaaaaaaahhhhhhhhh_57a7d6: "……啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊！"
  npc_override_mid_camp_quests_13_1_aaaaaahahhhhhhhhhhcckk_76c2f9: "啊啊啊啊啊啊啊啊啊啊啊啊咳咳咳咳咳！！！！！"
  npc_override_mid_camp_quests_13_1_aaahahahahaha_4794db: "啊哈哈哈哈哈哈哈哈。"
  npc_override_mid_camp_quests_13_1_aarrrrr_nightmare_04ae28: "啊！！！！！！这简直是噩梦！"
  npc_override_mid_camp_quests_13_1_aarrrrr_t_believe_e31ec8: "啊！！！！！！简直不敢相信！！"
  npc_override_mid_camp_quests_13_1_abidal_you_anything_say_e98eab: "阿比达尔，关于这件事你有什么要说的吗？"
  npc_override_mid_camp_quests_13_1_able_fix_1737a1: "能够修复这个的"
  npc_override_mid_camp_quests_13_1_about_already_ce95b6: "已经知道这件事了，但是"
  npc_override_mid_camp_quests_13_1_about_him_since_he_fef898: "关于他，因为他"
  npc_override_mid_camp_quests_13_1_about_me_being_here_27cf01: "关于我在这里的事。"
  npc_override_mid_camp_quests_13_1_about_your_mission_fed0bd: "关于你的任务！"
  npc_override_mid_camp_quests_13_1_accidentally_hits_drops_d4b23c: "不小心碰到并掉落了"
  npc_override_mid_camp_quests_13_1_according_his_descriptio_942583: "根据他的描述，那只怪物疑似是长毛猫科家族的成员。我很想亲眼看看，但是……"
  npc_override_mid_camp_quests_13_1_according_report_origina_d19b6b: "根据报告，灰烬真空原本的天气状况是寒冷干燥的，就像右侧的土地一样。"
  npc_override_mid_camp_quests_13_1_actually_hansenne_one_wh_44c9b8: "……其实……毁掉那个蛋糕的并不是汉森。"
  npc_override_mid_camp_quests_13_1_actually_i_m_here_study_01e92a: "其实我是来研究这个奇怪现象的。"
  npc_override_mid_camp_quests_13_1_actually_we_don_t_make_7d0733: "其实，我们没必要把事态搞得比现在更大。"
  npc_override_mid_camp_quests_13_1_additional_services_plea_73291f: "如需额外服务，请咨询特工加鲁克。"
  npc_override_mid_camp_quests_13_1_adventurer_i_ve_be3e9a: "来自这位冒险者。我已经"
  npc_override_mid_camp_quests_13_1_adventurer_i_ve_come_her_a8ad6c: "冒险者。我已经来到这里"
  npc_override_mid_camp_quests_13_1_adventurers_ash_vacuum_a_ca0131: "为了灰烬真空而来的冒险者们！为了三王国的联盟！卢恩-米德加尔特、施瓦茨瓦尔德、阿鲁纳菲尔特！"
  npc_override_mid_camp_quests_13_1_adventurers_like_you_003579: "像你这样的冒险者"
  npc_override_mid_camp_quests_13_1_after_all_just_cake_7519ae: "毕竟，那只是一个蛋糕……"
  npc_override_mid_camp_quests_13_1_after_all_ll_you_who_6b4d6c: "毕竟，最后有麻烦的人可是你。"
  npc_override_mid_camp_quests_13_1_after_all_they_re_reason_ce4dae: "毕竟，他们正是三个国家决定合作的原因。"
  npc_override_mid_camp_quests_13_1_after_you_lose_some_weig_0f3785: "- 等你减掉一些体重之后。 -"
  npc_override_mid_camp_quests_13_1_again_later_meow_4878db: "待会儿再来，喵？"
  npc_override_mid_camp_quests_13_1_again_thank_you_so_much_2be9bc: "再次感谢你。"
  npc_override_mid_camp_quests_13_1_agenda_schedule_ce6b14: "- 议程和日程 -"
  npc_override_mid_camp_quests_13_1_aggressive_due_a9a574: "因为这个变得具有攻击性"
  npc_override_mid_camp_quests_13_1_ago_come_yet_a7a9b3: "之前就来了吗？"
  npc_override_mid_camp_quests_13_1_ah_8b7bcd: "啊？"
  npc_override_mid_camp_quests_13_1_ah_971301: "啊……"
  npc_override_mid_camp_quests_13_1_ah_ah_right_e4c94f: "啊？！啊！对了！"
  npc_override_mid_camp_quests_13_1_ah_ahh_i_see_147edc: "……啊……啊，我明白了。"
  npc_override_mid_camp_quests_13_1_ah_cf07cb: "啊！"
  npc_override_mid_camp_quests_13_1_ah_did_you_lose_letter_9271ee: "啊，你把信弄丢了吗？"
  npc_override_mid_camp_quests_13_1_ah_f5ad63: "……啊……"
  npc_override_mid_camp_quests_13_1_ah_he_wrote_letter_you_93e8ae: "啊，他还给你写了这封信。"
  npc_override_mid_camp_quests_13_1_ah_hello_98e865: "啊，你好！"
  npc_override_mid_camp_quests_13_1_ah_hello_adventurer_610aba: "啊，你好冒险者！"
  npc_override_mid_camp_quests_13_1_ah_i_am_sorry_3552f2: "啊，很抱歉但是……"
  npc_override_mid_camp_quests_13_1_ah_i_forgot_say_thank_e5171c: "啊，我忘了说谢谢。"
  npc_override_mid_camp_quests_13_1_ah_i_got_bc2e36: "啊，我明白了！"
  npc_override_mid_camp_quests_13_1_ah_i_know_what_you_804086: "啊，我知道你能做什么了！"
  npc_override_mid_camp_quests_13_1_ah_i_m_so_embarrassed_18900b: "啊。太尴尬了。"
  npc_override_mid_camp_quests_13_1_ah_i_mean_9de18a: "啊……我是说……"
  npc_override_mid_camp_quests_13_1_ah_i_need_tell_you_a96247: "啊，我需要告诉你关于联盟的事，但首先，我能问你一件事吗？"
  npc_override_mid_camp_quests_13_1_ah_i_ve_received_report_150d0f: "啊，还有……我收到报告说你为了保护报告不被敌人夺走，英勇地与敌人战斗。"
  npc_override_mid_camp_quests_13_1_ah_i_ve_received_report_e87b68: "啊，还有……我收到报告说当情况发生时，你试图把报告交给我们的敌人。"
  npc_override_mid_camp_quests_13_1_ah_journal_yes_i_should_5d019a: "啊……日记……是的，我应该把这件事记录在日记上。"
  npc_override_mid_camp_quests_13_1_ah_just_forget_what_i_9d64dc: "啊，就忘了我说的吧。那话有点过分了。"
  npc_override_mid_camp_quests_13_1_ah_meeting_room_everythi_17b276: "啊……那个……在那个会议室里……一切还好吗？"
  npc_override_mid_camp_quests_13_1_ah_nothing_c27044: "啊，没什么……"
  npc_override_mid_camp_quests_13_1_ah_oh_my_908b1d: "啊，天哪。"
  npc_override_mid_camp_quests_13_1_ah_place_protected_5bae07: "啊，那个地方受到保护"
  npc_override_mid_camp_quests_13_1_ah_s_you_adventurer_fd8382: "啊，是你啊冒险者。"
  npc_override_mid_camp_quests_13_1_ah_s_you_again_so_6de91b: "啊，又是你。那么，你现在习惯这个地区了吗？"
  npc_override_mid_camp_quests_13_1_ah_supplies_0feb56: "啊！补给。"
  npc_override_mid_camp_quests_13_1_ah_there_cdc1db: "……啊，找到了。"
  npc_override_mid_camp_quests_13_1_ah_there_s_possibility_m_7c78c4: "啊，还有环境导致变异的可能性。"
  npc_override_mid_camp_quests_13_1_ah_they_always_push_me_71e006: "啊！他们总是推我，"
  npc_override_mid_camp_quests_13_1_ah_welcome_back_b8caf2: "啊，欢迎回来！"
  npc_override_mid_camp_quests_13_1_ah_ya_work_tough_c567ea: "啊，你们的工作真辛苦。"
  npc_override_mid_camp_quests_13_1_ah_yeah_you_re_right_45756f: "啊是的……你说得对。"
  npc_override_mid_camp_quests_13_1_ah_you_2aba3b: "啊！！！你有它？"
  npc_override_mid_camp_quests_13_1_ah_you_4ea2e5: "啊，你是"
  npc_override_mid_camp_quests_13_1_ah_you_came_back_211271: "啊，你回来了。"
  npc_override_mid_camp_quests_13_1_ah_you_member_alliance_d_bba45f: "啊，你是发现次元裂缝的联盟成员吗？欢迎。一切都准备好了。只要穿过去，找到营地就行了。"
  npc_override_mid_camp_quests_13_1_ah_you_must_one_who_6bdf8e: "啊！你一定是来帮我们追踪撒旦摩洛克的那个混蛋的，就是那个弄出大洞然后像风一样消失的家伙。"
  npc_override_mid_camp_quests_13_1_ah_you_must_talking_abou_0516bb: "啊，你一定是在说~？"
  npc_override_mid_camp_quests_13_1_ah_you_re_back_1d15f4: "啊！你回来了！"
  npc_override_mid_camp_quests_13_1_ah_you_sure_you_want_503525: "啊，你确定要交换吗？"
  npc_override_mid_camp_quests_13_1_ah_your_sweet_potatoes_n_063bd2: "啊，你的红薯现在烤得很好了。"
  npc_override_mid_camp_quests_13_1_aha_dfd557: "啊哈！"
  npc_override_mid_camp_quests_13_1_aha_yeah_i_just_remember_d80eda: "啊哈，对了，我刚想起来。你们施瓦茨瓦尔德人根本不懂得欣赏食物，对吧？"
  npc_override_mid_camp_quests_13_1_ahahaha_e3f373: "啊哈哈哈哈！"
  npc_override_mid_camp_quests_13_1_ahahahahaha_hahahahaha_27a275: "啊哈哈哈哈。哈哈哈哈哈。"
  npc_override_mid_camp_quests_13_1_ahem_ahem_i_see_i_5add6d: "*咳咳* 我明白了。我一直太忙了，没空看所有报告。那么你来这里有什么事？要奖励？"
  npc_override_mid_camp_quests_13_1_ahem_ahem_thank_you_brin_b014a4: "*咳咳* 谢谢你把报告带给我。看来我对指挥官的看法错了。这份报告实际上做得很好。"
  npc_override_mid_camp_quests_13_1_ahh_5af867: "啊……"
  npc_override_mid_camp_quests_13_1_ahh_i_sensed_i_get_4b6558: "啊……我预感到你会来请求我。"
  npc_override_mid_camp_quests_13_1_ahhh_a4d1c6: "啊啊啊……"
  npc_override_mid_camp_quests_13_1_ahhh_i_m_sick_person_ef2220: "啊啊啊~ 我是个病人。我需要休息！"
  npc_override_mid_camp_quests_13_1_ahhh_my_body_542c63: "啊啊啊，我的身体……"
  npc_override_mid_camp_quests_13_1_ahhh_one_i_left_meeting_4c2654: "啊啊啊……我留在会议室里的那个……"
  npc_override_mid_camp_quests_13_1_ahhh_s_exciting_a0d2ea: "啊啊啊，太令人兴奋了~"
  npc_override_mid_camp_quests_13_1_ahhh_wait_i_didn_t_5abffd: "啊啊啊，等等。我还没读完呢。"
  npc_override_mid_camp_quests_13_1_ahhhh_2ce1ef: "啊啊啊啊！"
  npc_override_mid_camp_quests_13_1_ahhhhh_7e6194: "啊啊啊啊……"
  npc_override_mid_camp_quests_13_1_ahhhhhh_i_guess_we_shoul_a820d9: "啊啊啊啊啊！我想我们今天该到此为止了！感谢大家的到来。好了，走吧。解散！"
  npc_override_mid_camp_quests_13_1_ahhhhhkk_64a42a: "啊啊啊啊咳！"
  npc_override_mid_camp_quests_13_1_alas_head_office_keeps_p_336ccc: "唉，总部一直催我提交报告……好像我能创造奇迹似的！"
  npc_override_mid_camp_quests_13_1_alas_there_s_no_one_eff6b4: "唉！没有一个我能信任的人！"
  npc_override_mid_camp_quests_13_1_alberto_entrance_198d46: "入口处的阿尔贝托"
  npc_override_mid_camp_quests_13_1_all_course_promotional_s_385e83: "所有这些当然，推广人员可以告诉你，但他们不太可靠。所以，让我来解释给你听。仔细听。"
  npc_override_mid_camp_quests_13_1_all_done_e6aa44: "全部完成了。"
  npc_override_mid_camp_quests_13_1_all_done_here_you_go_21a91b: "全部完成了。给你。"
  npc_override_mid_camp_quests_13_1_all_i_wanted_let_those_4f4335: "我只是想让那些人更亲近彼此，变得更友好。但是，问题每次都冒出来。"
  npc_override_mid_camp_quests_13_1_all_we_wanted_just_shake_911d3e: "我们只是想稍微震动一下这个城镇，"
  npc_override_mid_camp_quests_13_1_all_you_instructed_go_ti_f34144: "你们所有人都被指示前往卢恩-米德加尔特的次元裂隙！"
  npc_override_mid_camp_quests_13_1_alliance_first_step_peac_29319c: "这个联盟是三个王国之间和平的第一步。你知道他们都各怀鬼胎，所以这需要和谐。作为联盟的首领，这是唯一要追求的东西。"
  npc_override_mid_camp_quests_13_1_almost_half_town_been_de_9c6ba1: "这个城镇几乎一半已经被摧毁了，"
  npc_override_mid_camp_quests_13_1_almost_prepared_good_sta_e6edeb: "而且几乎为良好的开端做好了准备……嗯哼……"
  npc_override_mid_camp_quests_13_1_alone_world_far_away_428b68: "独自在这个遥远的世界"
  npc_override_mid_camp_quests_13_1_alright_alright_gosh_you_1c746b: "好了好了。天哪，你能别对我大喊大叫吗？"
  npc_override_mid_camp_quests_13_1_alright_alright_i_know_w_2294bf: "好了好了。我知道你为什么来找我。"
  npc_override_mid_camp_quests_13_1_alright_how_about_8c0cb9: "好了，这个怎么样？"
  npc_override_mid_camp_quests_13_1_alright_i_m_ryosen_rune_7cd9d0: "好了。我是来自卢恩-米德加尔特的良宣。我们确定撒旦摩洛克是通过次元裂缝来到这个地方的，然而，我们在检查过的区域内没有找到任何踪迹。"
  npc_override_mid_camp_quests_13_1_alright_if_you_say_so_81def1: "好了，既然你这么说。"
  npc_override_mid_camp_quests_13_1_alright_then_i_ll_tell_1d26da: "……好吧，那我就告诉你。"
  npc_override_mid_camp_quests_13_1_alright_then_you_rather_afb1a6: "。好吧，那么。你愿意去捕获摩洛克的转世并收集他们的残余吗？"
  npc_override_mid_camp_quests_13_1_alright_you_come_b11b68: "好了，你可以来"
  npc_override_mid_camp_quests_13_1_alright_you_don_t_any_0b1466: "好了，你什么都没有。"
  npc_override_mid_camp_quests_13_1_also_heard_rumor_d6a1b4: "还听说了一个传言"
  npc_override_mid_camp_quests_13_1_although_seal_wasn_t_bro_80e838: "虽然封印没有被打破，但他成功地削弱了它。"
  npc_override_mid_camp_quests_13_1_always_careful_get_lost_036448: "始终小心不要迷路。"
  npc_override_mid_camp_quests_13_1_always_open_you_2a5caa: "这里永远为你敞开。"
  npc_override_mid_camp_quests_13_1_am_i_exaggerating_d13d7a: "我夸大了吗？"
  npc_override_mid_camp_quests_13_1_am_i_right_449c27: "我说得对吗？"
  npc_override_mid_camp_quests_13_1_amazing_wasn_t_9a1829: "太神奇了，不是吗？"
  npc_override_mid_camp_quests_13_1_and_10ca01: "……还有……"
  npc_override_mid_camp_quests_13_1_and_bb881c: "还有……"
  npc_override_mid_camp_quests_13_1_and_f0fa6b: "还有……"
  npc_override_mid_camp_quests_13_1_animal_mainland_771386: "大陆上的动物，"
  npc_override_mid_camp_quests_13_1_animals_feed_95a43a: "动物的饲料或者"
  npc_override_mid_camp_quests_13_1_another_day_started_back_345776: "新的一天开始了，回去工作！"
  npc_override_mid_camp_quests_13_1_another_personality_hidd_251a73: "但他内心隐藏着另一个人格。"
  npc_override_mid_camp_quests_13_1_answer_lies_satan_morocc_96679b: "答案就在撒旦摩洛克身上。"
  npc_override_mid_camp_quests_13_1_any_assistance_now_0de907: "目前不需要任何帮助……"
  npc_override_mid_camp_quests_13_1_any_more_brutal_grotesqu_47827e: "任何更残忍或更怪异的"
  npc_override_mid_camp_quests_13_1_anymore_1e979b: "不再。"
  npc_override_mid_camp_quests_13_1_anything_64b581: "任何事？"
  npc_override_mid_camp_quests_13_1_anything_except_things_w_5c78f5: "除了卢恩-米德加尔特大陆上没有的东西……把它们藏起来。只要告诉我们你拿着什么就行了。"
  npc_override_mid_camp_quests_13_1_anyway_7479d2: "总之……"
  npc_override_mid_camp_quests_13_1_anyway_give_me_327a61: "总之，把它给我。"
  npc_override_mid_camp_quests_13_1_anyway_go_marian_a4cf77: "总之，去找玛丽安，"
  npc_override_mid_camp_quests_13_1_anyway_i_am_sure_there_45822d: "总之，我确信那里有很多名利双收的机会……"
  npc_override_mid_camp_quests_13_1_anyway_i_believe_my_frie_e41551: "总之，我相信我的朋友能很好地帮助我。"
  npc_override_mid_camp_quests_13_1_anyway_i_m_supposed_info_4af1af: "总之，我应该把这个消息告诉很多冒险者。"
  npc_override_mid_camp_quests_13_1_anyway_i_promised_tell_y_2512a0: "总之，我答应过告诉你关于三个王国的事……这是个有点长的故事，所以请仔细听。"
  npc_override_mid_camp_quests_13_1_anyway_i_told_you_about_45ea60: "总之，我告诉过你关于灰烬真空的事。我知道的一切。虽然你对它还不太了解，但我只能告诉你这些了。"
  npc_override_mid_camp_quests_13_1_anyway_just_go_back_77be70: "总之，回到"
  npc_override_mid_camp_quests_13_1_anyway_just_go_back_recr_527579: "总之，回到招募官那里。"
  npc_override_mid_camp_quests_13_1_anyway_what_brings_you_h_bc62f7: "总之，是什么让你再次来到这里？"
  npc_override_mid_camp_quests_13_1_anyway_what_meeting_abou_37c996: "总之，这个会议是关于什么的？"
  npc_override_mid_camp_quests_13_1_anyway_who_you_place_res_1f9dfa: "总之，你是谁？这个地方是限制区域。"
  npc_override_mid_camp_quests_13_1_anyway_you_did_first_ste_3836cc: "总之你完成了第一步。"
  npc_override_mid_camp_quests_13_1_anyways_according_your_c_330a08: "总之，根据你的结论，那顶帽子一定是别人给他们的，或者他们可能是从其他生物掉落后捡到的。"
  npc_override_mid_camp_quests_13_1_anyways_as_i_said_i_2678dd: "总之，正如我说的，我有很多猪笼草标本。"
  npc_override_mid_camp_quests_13_1_anyways_ec35f1: "总之……"
  npc_override_mid_camp_quests_13_1_anyways_i_took_some_time_cfbe23: "总之，我花了一些时间调查你的背景和成就报告。"
