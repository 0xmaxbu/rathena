Body:
  npc_override_job_cru_crusader_about_c7fb90: "关于它。"
  npc_override_job_cru_crusader_advised_continue_practic_dad022: "建议你继续自行练习。"
  npc_override_job_cru_crusader_after_obtaining_those_it_b15e4f: "获得这些物品并通过我们的测试后，你也能成为一名十字军。"
  npc_override_job_cru_crusader_ah_971301: "啊……"
  npc_override_job_cru_crusader_ah_well_done_39eaca: "啊，做得好。"
  npc_override_job_cru_crusader_ah_you_still_completed_t_e528b7: "啊，你还没有完成我交给你的任务。把以下物品带来，向我证明你成为十字军的意志吧……"
  npc_override_job_cru_crusader_all_other_tests_86531b: "所有其他测试。"
  npc_override_job_cru_crusader_all_tests_9834aa: "所有测试，以便"
  npc_override_job_cru_crusader_answer_them_correctly_b99637: "正确回答它们。"
  npc_override_job_cru_crusader_appear_e6817b: "出现在"
  npc_override_job_cru_crusader_as_happened_one_thousand_15bd4e: "正如一千年前所发生的那样，邪恶势力终有一日会大举进攻，企图再次统治这个世界。"
  npc_override_job_cru_crusader_as_woman_sword_you_must_f8c6b4: "作为一名剑术女性，你必须勤勉而不懈地训练。做好准备吧，没有人知道圣战何时会来临。"
  npc_override_job_cru_crusader_aspiring_crusader_817a80: "一名有志成为十字军的人……"
  npc_override_job_cru_crusader_battle_test_please_prepa_d64c3f: "对于战斗测试，请准备一份^3355FF圣水^000000。"
  npc_override_job_cru_crusader_become_crusader_e097c4: "成为一名十字军。"
  npc_override_job_cru_crusader_become_crusader_you_must_842e49: "要成为十字军，你必须训练到 Job 等级 40。更多详情，请与我们里面的负责人交谈。"
  npc_override_job_cru_crusader_becoming_crusader_634a4e: "想成为十字军吗？"
  npc_override_job_cru_crusader_begin_right_away_1d10fe: "立即开始？"
  npc_override_job_cru_crusader_behold_ebc8fc: "看好了……！"
  npc_override_job_cru_crusader_brother_f98f81: "……兄弟。"
  npc_override_job_cru_crusader_but_2e7fce: "但是……"
  npc_override_job_cru_crusader_carelessly_losing_things_b8aa73: "粗心大意丢失物品是剑士的态度。如果你真的想重考，就必须尊重十字军的传统。"
  npc_override_job_cru_crusader_chaos_one_day_arise_chal_d8b7b2: "混沌终有一日会崛起，挑战我们和平、正义与秩序的准则。在消灭邪恶、创建理想世界之前，我们绝不能停止训练。"
  npc_override_job_cru_crusader_choose_correct_answer_6c5759: "选择正确的答案。"
  npc_override_job_cru_crusader_come_3d448e: "即将到来的。"
  npc_override_job_cru_crusader_come_back_after_taking_f55355: "在接受"
  npc_override_job_cru_crusader_come_back_take_5fce63: "回来参加"
  npc_override_job_cru_crusader_come_me_once_you_re_d293a9: "一旦你准备好，就来找我"
  npc_override_job_cru_crusader_coming_along_7a46db: "进行得怎么样了？"
  npc_override_job_cru_crusader_coming_holy_war_cc19cc: "即将到来的圣战。"
  npc_override_job_cru_crusader_comrade_aea7ab: "……同志。"
  npc_override_job_cru_crusader_congratulations_04ece6: "恭喜你。"
  npc_override_job_cru_crusader_congratulations_completi_b7cadc: "恭喜你完成了所有测试。你确实有资格作为十字军与我们并肩作战，迎接圣战。"
  npc_override_job_cru_crusader_crusader_545728: "一名十字军。"
  npc_override_job_cru_crusader_crusader_7f1fe0: "十字军……？"
  npc_override_job_cru_crusader_cured_cure_skill_61ec97: "被治愈技能治愈？"
  npc_override_job_cru_crusader_defeat_monsters_bb6079: "击败怪物"
  npc_override_job_cru_crusader_develop_your_faith_faith_dc4b95: "培养你的信仰。从信仰中诞生力量与纪律。日复一日地训练自己，成为一名伟大的十字军。"
  npc_override_job_cru_crusader_did_you_prepare_b68bf0: "你准备好了"
  npc_override_job_cru_crusader_did_you_well_555765: "你表现得"
  npc_override_job_cru_crusader_don_t_give_me_reason_768afe: "别给我怀疑你的理由，拿出你的耐心。如果你希望成为十字军，就必须用耐心忍受我的考验。"
  npc_override_job_cru_crusader_don_t_linger_around_plac_3c5c3b: "别在这种地方逗留，去开辟属于你自己的道路，发掘自身的力量。我们并肩作战的那一天很快就会到来。"
  npc_override_job_cru_crusader_don_t_stress_you_need_82903a: "别紧张，要通过这个测试你需要了解很多东西。不管怎样，我会在这里等你。等你觉得自己准备好了，就回来，好吗？"
  npc_override_job_cru_crusader_each_person_get_minutes_00b327: "每人有4分钟完成测试。如果你想在测试中途离开，请断开游戏连接。"
  npc_override_job_cru_crusader_easy_as_sounds_3c8f52: "听起来那么容易。"
  npc_override_job_cru_crusader_even_these_relatively_pe_701be7: "即使在相对和平的时期，我们的训练也从未停止。我们必须为黑暗浪潮席卷人类的那一天做好准备……"
  npc_override_job_cru_crusader_fight_holy_war_4b0004: "在圣战中战斗。"
  npc_override_job_cru_crusader_finish_those_other_tests_445424: "完成其他测试，"
  npc_override_job_cru_crusader_foretold_holy_war_b1a44f: "预言的圣战"
  npc_override_job_cru_crusader_get_prepares_come_back_h_d627ed: "做好准备然后回来这里。"
  npc_override_job_cru_crusader_give_you_questions_8ef3a8: "给你10个问题"
  npc_override_job_cru_crusader_go_enter_93a75b: "去吧，进入"
  npc_override_job_cru_crusader_go_forth_defeat_all_aea31e: "出发吧，击败所有"
  npc_override_job_cru_crusader_go_prontera_castle_f34fe7: "去普隆德拉城堡"
  npc_override_job_cru_crusader_go_prontera_castle_meet_5182f8: "去普隆德拉城堡见布里安特·皮约德。"
  npc_override_job_cru_crusader_go_study_some_more_80600f: "再去学习一下，"
  npc_override_job_cru_crusader_go_talk_our_6f579d: "去找我们的"
  npc_override_job_cru_crusader_go_train_yourself_prepar_0516f5: "去训练自己，为即将到来的圣战做准备。胜利将属于准备最充分的人。"
  npc_override_job_cru_crusader_good_luck_703764: "祝你好运。"
  npc_override_job_cru_crusader_good_work_0f1ee8: "干得好～"
  npc_override_job_cru_crusader_he_testing_you_next_65b9ac: "他接下来会测试你。"
  npc_override_job_cru_crusader_highest_hp_252eea: "拥有最高的生命值？"
  npc_override_job_cru_crusader_hm_you_no_business_place_3f453a: "嗯。你在这里无事可做。请离开，不要打扰我的训练。"
  npc_override_job_cru_crusader_hmm_9c4d28: "嗯……"
  npc_override_job_cru_crusader_hmm_seems_like_you_did_7c3dc4: "嗯，看来你做得不错。应该不算太难。你已经没有"
  npc_override_job_cru_crusader_hmm_you_wish_become_crus_6ab23b: "嗯。你想成为十字军，却不佩戴念珠？如果你不能遵守我们的习俗，我与你没什么好说的。"
  npc_override_job_cru_crusader_hmmm_2ac89c: "嗯……"
  npc_override_job_cru_crusader_hmmm_what_pity_7deb31: "嗯……真可惜。"
  npc_override_job_cru_crusader_holy_water_16aa6b: "1份圣水。"
  npc_override_job_cru_crusader_holy_water_used_purify_y_4a220f: "1份^3355FF圣水^000000。这将在你参加测试前用来净化你。"
  npc_override_job_cru_crusader_holy_water_you_prepared_1734df: "你准备的圣水。"
  npc_override_job_cru_crusader_how_goes_019340: "怎么样了"
  npc_override_job_cru_crusader_how_much_sp_level_heal_fe90fb: "8. 7级治愈术消耗多少魔力值？"
  npc_override_job_cru_crusader_how_your_training_28bda1: "你的训练怎么样了"
  npc_override_job_cru_crusader_hurry_now_go_take_next_191a7a: "快去吧，参加下一个测试。"
  npc_override_job_cru_crusader_i_am_michael_halig_i_fa3bd8: "我是迈克尔·哈利格。我是众多为圣战作准备的十字军之一。我们以虔诚的信仰和无尽的忠诚不断训练自己。"
  npc_override_job_cru_crusader_i_am_preparing_00df88: "我正在为"
  npc_override_job_cru_crusader_i_conducting_your_next_t_a53535: "我将主持你的下一个测试。"
  npc_override_job_cru_crusader_i_don_t_know_what_075f73: "我现在不知道你是怎样的人。但是"
  npc_override_job_cru_crusader_i_give_639f1a: "我会给"
  npc_override_job_cru_crusader_i_hope_you_train_yoursel_56f371: "我希望你也能为未来而训练自己。"
  npc_override_job_cru_crusader_i_inform_him_07b5c2: "我会告诉他"
  npc_override_job_cru_crusader_i_inform_him_prepare_nex_dd4614: "我会通知他为下一个测试做好准备。"
  npc_override_job_cru_crusader_i_ll_let_you_retake_28c1aa: "你可以随意重考。但如果你持续失败，那你的"
  npc_override_job_cru_crusader_i_ll_see_you_later_78ca74: "待会见～"
  npc_override_job_cru_crusader_i_ll_see_you_soon_21479e: "待会见。"
  npc_override_job_cru_crusader_i_must_acknowledge_your_4ae821: "我必须肯定你的努力和决心。你现在可以继续参加下一个测试了。"
  npc_override_job_cru_crusader_i_see_you_been_called_360a34: "看来你被召唤来成为十字军。我们确信你的意志，但现在我们必须测试你的能力。"
  npc_override_job_cru_crusader_i_shall_53603b: "我会"
  npc_override_job_cru_crusader_i_shall_test_you_if_943bac: "如果你愿意，我会测试你。你愿意为了圣战而忍受这些考验吗？"
  npc_override_job_cru_crusader_i_shall_test_you_see_943911: "我会测试你，看你是否适合成为一名十字军。"
  npc_override_job_cru_crusader_i_test_see_if_you_55b2a4: "我会测试你是否具备成为十字军所需的知识。"
  npc_override_job_cru_crusader_i_told_you_just_purify_e39788: "我告诉过你，只要净化候选人就行了。"
  npc_override_job_cru_crusader_i_understand_if_you_easi_10fd37: "我能理解你很容易感到沮丧，但你必须克服沮丧才能通过这个测试。"
  npc_override_job_cru_crusader_i_wait_you_abd4bd: "我会等你。"
  npc_override_job_cru_crusader_i_wish_improve_sense_ser_7ba2c8: "我希望提升内心的宁静感，为即将到来的圣战作准备。所以，请勿打扰我。"
  npc_override_job_cru_crusader_if_monster_level_undead_02264e: "2. 如果怪物是2级不死属性，圣属性攻击比火属性攻击多造成多少伤害？"
  npc_override_job_cru_crusader_if_you_feel_participatin_e7a797: "如果你觉得参加圣战是你的使命，请马上回来参加成为"
  npc_override_job_cru_crusader_if_you_interested_becomi_9e92dc: "如果你有兴趣成为十字军，你必须先以剑士的身份训练。当你觉得自己作为剑士已经学到足够多的时候，再来找我们吧……"
  npc_override_job_cru_crusader_if_you_like_become_crusa_8e2cb7: "如果你想成为十字军，请与普隆德拉中央宫殿的负责人交谈。"
  npc_override_job_cru_crusader_if_you_no_business_here_e9d727: "如果你在这里无事可做，"
  npc_override_job_cru_crusader_if_you_put_forth_effort_d015a5: "只要你付出努力，就能完成这个任务。愿奥丁保佑你旅途平安。"
  npc_override_job_cru_crusader_if_you_ready_b1e6aa: "如果你准备好了"
  npc_override_job_cru_crusader_if_you_too_man_sword_2f608b: "如果你也是一名剑士，就不断训练和准备吧。没有人知道圣战何时会开始。"
  npc_override_job_cru_crusader_if_you_wish_join_us_c87679: "如果你想加入我们，你必须先学习剑士的戒律并彻底训练自己……"
  npc_override_job_cru_crusader_if_your_int_including_in_79b94d: "2. 如果你的智力为30（含装备加成），在55级时，5级治愈术恢复多少生命值？"
  npc_override_job_cru_crusader_instructed_until_then_62994d: "指示。在那之前，"
  npc_override_job_cru_crusader_job_level_become_b303e6: "Job 等级 40 才能成为"
  npc_override_job_cru_crusader_joining_us_as_842873: "加入我们没有"
  npc_override_job_cru_crusader_just_focus_467a08: "集中注意力……"
  npc_override_job_cru_crusader_just_second_you_rosary_e_525876: "等一下，你没有装备念珠。作为十字军，你必须随身携带念珠。"
  npc_override_job_cru_crusader_last_test_here_083743: "这里的最后一项测试。"
  npc_override_job_cru_crusader_leader_inside_501f00: "里面的负责人。"
  npc_override_job_cru_crusader_let_me_assure_you_i_85906d: "我向你保证我不是罪犯。我只是在这里训练自己。也许等你变强了，你就会明白了。"
  npc_override_job_cru_crusader_let_me_take_67aadc: "让我"
  npc_override_job_cru_crusader_let_s_begin_869d3b: "我们开始吧。"
  npc_override_job_cru_crusader_let_s_see_4d37ed: "让我看看……"
  npc_override_job_cru_crusader_let_s_try_again_64b4e1: "再试一次，"
  npc_override_job_cru_crusader_level_divine_protection_e56d03: "3. 7级神圣之光对不死属性的防御提升多少？"
  npc_override_job_cru_crusader_like_i_mentioned_before_de2d22: "就像我之前提到的，你应该去普隆德拉城堡找布里安特·皮约德参加下一个测试。祝你好运，尽快成为十字军，好吗？"
  npc_override_job_cru_crusader_listen_carefully_57ef81: "仔细听，"
  npc_override_job_cru_crusader_look_your_face_df5219: "看看你的脸。"
  npc_override_job_cru_crusader_look_your_results_eb8a3a: "看看你的结果。"
  npc_override_job_cru_crusader_may_odin_3f5e68: "愿奥丁"
  npc_override_job_cru_crusader_may_odin_s_blessings_c4d6e9: "愿奥丁的祝福"
  npc_override_job_cru_crusader_me_5e20cf: "和我在一起。"
  npc_override_job_cru_crusader_me_man_sword_63f69c: "和我一起，剑士？"
  npc_override_job_cru_crusader_me_woman_sword_de45bb: "和我一起，剑士？"
  npc_override_job_cru_crusader_meet_bliant_piyord_16221e: "并与布里安特·皮约德会面。"
  npc_override_job_cru_crusader_meet_moorenak_miyol_who_ebb583: "去普隆德拉城堡地下监狱找正在训练的穆雷诺克·米约尔。去吧，先跟他谈谈。"
  npc_override_job_cru_crusader_meet_you_ffe043: "见到你。"
