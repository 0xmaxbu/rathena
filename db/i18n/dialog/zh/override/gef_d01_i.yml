  npc_override_gef_d01_i_quests_illusion_dungeons_much_less_what_s_taking_f81494: "更不用说洞穴里正在发生的事了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_munch_munch_munch_munch_f80b0a: "咔嚓，^FF0000咔嚓咔嚓咔嚓^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_munch_munch_murmur_887fce: "咔嚓，^FF0000咔嚓^000000……喃喃……"
  npc_override_gef_d01_i_quests_illusion_dungeons_munch_munch_murmur_my_tr_69fca4: "咔嚓，咔嚓……喃喃……我的^BDBDBD宝贝^000000……我的^BDBDBD珍贵^000000宝贝……全是^BDBDBD我的^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_munch_murmur_munch_munch_65dc0f: "咔嚓，喃喃……^FF0000咔嚓^000000，咔嚓。^FF0000咔嚓^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_munch_murmur_munch_munch_6e193c: "咔嚓，喃喃……^FF0000咔嚓^000000，咔嚓。^FF0000咔嚓^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_munch_murmur_munch_munch_bd12ea: "咔嚓，喃喃……^FF0000咔嚓^000000，咔嚓。"
  npc_override_gef_d01_i_quests_illusion_dungeons_munch_murmur_munch_munch_c5310c: "咔嚓，喃喃……^FF0000咔嚓^000000，咔嚓……"
  npc_override_gef_d01_i_quests_illusion_dungeons_murmur_munch_munch_murmu_4f5dfc: "喃喃……^FF0000咔嚓^000000，咔嚓。^FF0000喃喃^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_must_essence_abyss_8ab98d: "^4d4dff它一定是深渊精华^000000。- "
  npc_override_gef_d01_i_quests_illusion_dungeons_muyeon_must_gone_detache_5598e8: "慕妍一定去了^0000CD detached 帕伊恩宫殿。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_muyeon_you_mean_muyeon_s_12c471: "慕妍？你说的是灵魂链接师慕妍吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_body_become_healthy_b054e5: "我的身体变得健康了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_brother_might_think_s_6a6dc7: "我哥哥可能以为只有他知道的秘密地方，但那是村子里每个人都知道的地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_brothers_abandoned_vi_03e340: "我的兄弟们作为婴儿被遗弃在村子里。村民们把他们捡起来抚养。"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_dearest_friend_cough_33979c: "我最亲爱的朋友……咳……可能有危险，但我不能待着不动！……咯咯"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_friend_leiphen_who_lo_952dab: "正在看碎片的我的朋友莱芬突然消失了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_friend_might_other_on_cbda2c: "我的朋友可能有另一个。不，我是说他一定还有。"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_goal_right_now_explor_7bd2cc: "我现在的目标不是探索，我想让你营救那个游侠和他的朋友们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_heart_hurts_like_too_a71afd: "我的心也很痛，但如果你了解因为他的能力而挣扎的最小的孩子……我必须做好准备。谢谢你，冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_low_stamina_insuffici_6de440: "我低下的体力和不足的法力一直是问题。我以为我可以用魔法来弥补我虚弱的体质。当然，即使那样也需要一些最低限度的体力，但我连那个都没有。"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_my_precious_treasure_19a1d9: "我的……我的珍贵^BDBDBD宝贝^000000……^FF0000喃喃^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_my_precious_treasure_787c54: "我的……我的珍贵^BDBDBD宝贝^000000……^FF0000喃喃^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_my_treasure_all_my_db8899: "我的……我的宝贝。^BDBDBD所有的^000000……我的……^FF0000咔嚓，咔嚓^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_my_treasure_all_my_f71bac: "我的……我的宝贝。^BDBDBD所有的^000000……我的……^FF0000咔嚓，咔嚓^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_name_sunrin_4a8eb6: "我的名字是孙林。"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_neighborhood_friends_33f397: "我小的时候邻居朋友有点取笑我，但我对这个名字没什么不满。"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_predecessors_may_been_c8f14f: "我的前辈们可能过于热衷于研究他们塔下的东西，但正是这种热情让吉芬成长为现在的魔法之城。"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_treasure_munch_munch_3b8aad: "还有我的宝贝……^FF0000咔嚓^000000，咔嚓……你带来了^BDBDBD我的^000000宝贝？"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_treasure_my_revenge_5085c4: "^FF0000我的宝贝……我的复仇……"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_wishes_now_doesn_t_e61bfb: "它有我的愿望。现在……它不需要存在了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_name_briashen_looking_kh_981c98: "布里亚申寻找的名字是卡赫里斯……"
  npc_override_gef_d01_i_quests_illusion_dungeons_name_person_briashen_loo_1c93d5: "== 布里亚申正在寻找的人的名字是……=="
  npc_override_gef_d01_i_quests_illusion_dungeons_narin_said_i_get_some_54e9cb: " - ^424242纳林说，我可以从这里得到一些^0000CD{0}^424242。对他来说应该够了。^0000CD让我准备^4242425个。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_nearest_place_let_s_go_74378a: "去最近的地方……^FF0000让我们去找那个饥饿的^424242女人。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_never_mind_good_luck_fin_1fc408: "没关系。祝你好运找到他。也许你应该检查一下南边的地下墓穴。"
  npc_override_gef_d01_i_quests_illusion_dungeons_news_sirood_s_disappeara_8105f7: "西罗德失踪的消息立刻传遍了伊斯鲁德，并且投入了大量时间和人力进行了大规模搜索，但搜索没有找到任何线索就结束了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_next_thing_i_knew_i_c2ce60: "然后接下来我知道的，我被转化了。德古拉违背了他的诺言。"
  npc_override_gef_d01_i_quests_illusion_dungeons_nice_if_just_dream_149ef1: "如果只是场梦就好了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_nice_if_we_could_go_85b8a1: "如果我们也能去就好了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_nice_if_we_went_together_a35edc: "如果我们能一起去就好了，但是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_nine_tailed_foxes_spirit_29119f: "但是九尾狐的灵魂比我们想象的更愤怒。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_1d59ae: "不！"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_9a4c18: "……不。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_adventurer_you_agreed_0a73ad: "不。冒险者，你同意过我的，她不可信。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_all_b2199e: "不。一点都没有。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_because_i_bored_death_a013fa: "不。因为我无聊死了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_coincidence_they_like_591a62: "……不，那是巧合。它们不像我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_don_t_even_think_cc02aa: "不。想都别想。莫乔，你快越界了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_don_t_hunt_them_f5915c: "不，不要猎杀它们！你必须帮助它们！"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_don_t_i_d_4d5d7b: "不，不要！我宁可死！"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_how_could_a530cc: "不，怎么可能？"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_asked_find_khahris_29df54: "……不，我被要求去找卡赫里斯。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_don_t_i_0eb59e: "不，我不信任。我可能信任莫乔，我的信仰姐妹，但不信任法师莫乔。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_don_t_know_92f6e0: "不，我不知道"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_don_t_remember_6793e1: "不，我不记得了。格姆修女回来的时候，我要告你的状！"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_just_want_you_e76fd5: "不。我只想你^0000cd找到他们^000000并确保他们没事。如果他们需要帮助，请提供帮助。如果他们有口信给我，请告诉我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_m_even_going_f895f2: "不！我连碰都不会让你碰！"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_m_jojo_5d0843: "不，我不是乔乔。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_ve_never_seen_df8eef: "不。我从没见过这里有蚂蚁……除非我和米尔科在一起。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_isn_t_weird_ef6088: "……不，那不是很奇怪吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_matter_how_many_times_960b91: "不管我去医院多少次，都没有好转……"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_more_stupid_ideas_ple_f534aa: "别再提愚蠢的想法了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_my_daughter_my_pretty_9441f3: "^FF0000不，我的女儿。我的^000000漂亮宝贝。不。丢了，^FF0000把她丢了^000000。丢了。呜呜……我的^FF0000漂亮……宝贝……找^000000不到，^FF0000找不^000000到，找不……^FF0000到^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_my_name_jane_1d34db: "不，我的名字是简。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_never_keep_your_hands_f24201: "不。绝不。管好你自己的手。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_no_he_s_my_d4a60b: "不，不！他不是我的朋友！我这辈子从没见过他，我发誓！"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_no_i_d_love_8515c8: "不，不！我很乐意！但是，呃，你不会要求我的血作为回报吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_no_s_me_s_dcbadd: "不，不。不是我是卡赫里斯"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_no_t_find_her_476439: "不。^FF0000不。^000000找不到她。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_no_you_i_m_0f5352: "不，不。不是你。我说的是马特德雷恩利亚。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_now_i_understand_why_9a4cac: "不，现在我明白你为什么做出那个决定了。你不能就这样让我死去，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_one_comes_back_s_963e8f: "……没有人回来。最好不要来这里。这里充满危险。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_other_members_my_grou_0c5bf7: "不。我的小队的其他成员和两个法师已经在那里了。他们只是还没回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_place_overrun_unholy_b7994c: "不。这个地方充满了不圣洁的生物。最好还是让上帝的两位仆人来寻找他们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_s_always_been_my_c0b1de: "不。但征服大陆上所有地下城成为最伟大的巫师一直是我的梦想。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_s_important_right_now_a10724: "不，那现在不重要……"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_s_somewhere_else_i_0a3291: "不。它来自别的地方，而且我闻到了不止一个人类的气味。……一场^0000cd战斗^000000！某处爆发了战斗！血！快走！"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_stone_contains_my_mag_10915d: "不。这是蕴含我魔力的石头。让我们看看它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_t_my_daughter_baby_3f3181: "不^FF0000不可能。我的女儿。^000000宝贝……宝贝？不。哈，哈^FF0000哈哈。不。哈，哈。^000000我的^FF0000漂亮宝贝，^000000宝贝。我的^FF0000漂亮宝贝。不。^000000不。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_two_so_they_look_54b9e3: "不。必须是两个人，这样他们可以互相照应。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_wait_just_ice_reflect_c53e3b: "^ff0000不，等等。那只是冰反射的环境光。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_wait_you_leaving_righ_159860: "不，等等。你现在就要走吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_way_all_5cac15: "不会吧……全部？"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_why_you_here_ea726b: "不……你为什么在这里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_you_didn_t_s_8930b6: "不，你没有。这就是为什么你被那些蘑菇打得落花流水。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_you_re_staying_me_96c1e3: "不。你要和我待在一起。你敢碰那本书。"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_you_sure_6f2aac: "不……你确定吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_you_t_a314b1: "不。^FF0000你不能^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_nobody_here_except_two_u_fb106b: "除了我们两个，这里没有别人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_nod_go_alberta_7762fa: "点点头去阿尔伯塔。"
  npc_override_gef_d01_i_quests_illusion_dungeons_none_my_guildsmen_such_n_328846: "但我的公会成员中没有这样的名字。我读了那本书，她听起来确实像是我们的一员。^0000cd但不再是了^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_notebook_13fbca: "一本笔记本？"
  npc_override_gef_d01_i_quests_illusion_dungeons_notebook_both_diary_rese_730d87: "这本笔记本既是^0000cd日记也是研究日志^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_notebook_i_want_see_note_790fa3: "笔记本……我想看看笔记本……如果你想进入笔记本，你应该和格里姆神父谈谈。如果你愿意，我可以和你一起去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_nothing_happened_4501ec: "^ff0000什么都没发生。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_nothing_symphathy_i_feel_7fedde: "这与我感受到的同情无关。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_adventurer_let_me_kn_ac1750: "现在，冒险者。准备好的时候告诉我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_adventurer_sirood_yo_dabf42: "现在，冒险者和西罗德！！你能帮我吗？？诶！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_calm_down_you_sure_91077e: "现在，冷静一下……你确定这是西罗德的钓鱼竿吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_come_hug_us_no_c71c7e: "现在，来拥抱我们？不，先拥抱我。然后，当我周围的冰裂开时，光芒会闪烁，你知道的，就像那些童话故事里一样！"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_he_s_roaming_about_e7dab2: "现在，他正在洞穴里徘徊，渴望主人的爱。那不是太悲惨了吗？我只是想给他想要的爱，他却为此惩罚了我！"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_know_difference_al_16f4ec: "但现在我知道区别了，这也跟我的健康无关。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_know_ruined_villag_16ae3d: "现在我知道这不是那个被毁的村庄了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_know_those_nightma_0203f8: "现在我知道那些噩梦确实起源于月光花，我感觉好多了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_ll_give_you_c5df96: "现在，我把钓鱼竿给你，这是西罗德的纪念品。谢谢……"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_m_also_taking_975060: "目前，我也在照顾它，但我一个人不够好。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_stand_front_famili_679bfc: " - ^424242现在我站在熟悉的光芒前。轻轻向纳林挥手，她闭上眼睛双手合十。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_t_see_both_58b917: "现在我看不到你们两个了……但不要走。我用安静的声音说话。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_understand_why_dra_de714f: "现在我明白为什么德古拉如此不信任你们人类了。我还以为他太挑剔了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_if_you_ll_excuse_dd5379: "现在如果你不介意的话，忠海和我去调查其他地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_let_s_light_twigs_55d107: "现在，让我们点燃树枝试着融化冰。你为什么不先试着融化我朋友周围的冰呢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_let_s_see_how_ac5770: "现在，让我们看看这会如何影响情况。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_look_as_i_said_4addab: "现在，看。就像我之前说的，它们完全不混合，不是吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_problem_d489a6: "但现在的问题是，"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_s_interfering_our_or_e6c051: "现在，那干扰了我们原来的使命，就是保持这个地方没有不圣洁的东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_we_know_you_exist_3042ee: "现在我们知道你的存在了，我们不能忽视你。我可以，但这里的人不能。他们的教会不允许。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_we_need_help_vrid_f2e4d4: "现在，我们需要帮助弗里德。请把他从冰里救出来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_you_fish_sirood_agai_20fa29: "现在你可以和西罗德一起钓鱼了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_you_know_what_i_da35c6: "现在你知道我经历了什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_you_see_whirlpool_pa_6cc50a: "现在，你看到漩涡了吗！！这是通往巴伊亚海沟底部的通道！"
  npc_override_gef_d01_i_quests_illusion_dungeons_observing_surroundings_h_1e936c: "观察周围的环境，我可以看到偶尔形成的小漩涡。"
  npc_override_gef_d01_i_quests_illusion_dungeons_occasionally_if_you_defe_43cc66: "偶尔如果你击败{0}"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_another_adventurer_ju_f4d7a6: "哦，另一个冒险者刚刚去了那边。我听说头晕减轻了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_come_think_you_don_d9c412: "哦……回想起来，你不再咳嗽了，是吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_come_you_know_i_747a1c: "哦，得了吧！你知道我一直忙着研究东西！"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_come_you_re_priest_99adf2: "哦，得了吧！你是牧师？你应该对每个人都有信心！你为什么把我当小偷一样对待？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_geez_how_you_move_25c55b: "哦天哪，你怎么移动得这么快？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_great_instead_fightin_722b70: "哦，太好了！与其战斗，我们为什么不问问这位冒险者谁是对的？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_hello_9bf012: "哦，你好……"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_hey_i_m_here_322e3c: "哦嘿，我是来找西罗德的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_almost_forgot_let_77dcce: "哦，我差点忘了。让我再对你施放我的法术。它很弱，所以不会持续太久。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_heard_fishing_rod_4acf50: "哦，还有我听说今天找到了钓鱼竿。我能请你检查一下附近的海里是否还有其他漂浮物吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_knew_2c212d: "哦，我就知道……！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_m_going_catch_0e703f: "哦，我要去抓一个人，可以吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_m_sorry_church_de0fc6: "哦，对不起。符文-米德加尔特教会定期派遣牧师到这些地下墓穴来维持和平。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_m_sorry_i_091c98: "哦，对不起，但我现在不能说话。我太忙着检查你给我带来的东西了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_m_sorry_i_678ed4: "哦，对不起，我不是故意让你一直站着的。你能帮我从霓虹蘑菇上弄一些孢子吗？我需要一些光线来看清我在写什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_see_75461a: "……哦，我明白了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_see_you_again_04d134: "哦，又见到你了"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_want_go_home_9ae528: "哦，我想回家……"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_just_case_i_actually_e00bf5: "哦，以防万一，我真的找到了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_ll_great_if_you_2cbdea: "哦，如果你也能除掉^0000cd10个甜蜜噩梦^000000那就太好了。我想知道那会对梦境产生什么影响。谢谢！"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_my_god_human_human_74e940: "哦天哪……人类，一个人类？一个真正的人类？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_my_gosh_place_where_836c9d: "哦天哪……那个地方是我哥哥和嫂子经常去约会的地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_no_there_too_many_4b4205: "哦，不！我体内的毒素太多了。这越来越危险了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_no_you_hit_shrapnel_73e1a3: "哦不，你被弹片击中了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_really_62e6de: "哦真的吗……"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_really_good_you_8a947f: "哦，真的吗？太好了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_really_s_such_silly_ddbab5: "哦……真的，这是个多么愚蠢的故事。很难继续说下去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_right_bd644d: "哦对了！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_right_here_i_give_08135f: "……哦，对了。这里……我把这个给你。这里，你也拿着，教授。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_s_right_adventurer_co_bbfd01: "哦，对了！冒险者，你能帮我抓一个僵尸吗？我是说，活的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_since_you_going_there_f4c6bf: "哦，既然你又要去那里，请确保莱芬没事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_stone_i_found_while_e32d99: "哦，还有这是我在研究时发现的一块石头。我一直留着它因为它看起来像是冒险者可以使用的东西，所以请拿着它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_thank_god_thank_you_4536fd: "哦感谢上帝！谢谢你。我以为我会死在这里！"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_thank_god_where_you_fa48ae: "哦，感谢上帝！你在哪里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_thank_you_everything_862058: "……哦。谢谢你为我做的一切。嗯，我想是时候重新加入我的小队了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_then_i_ask_you_c02612: "……哦。那我可以问你问题吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_then_why_now_998e60: "哦，那为什么现在……"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_wait_cdd6ec: "哦，等等！"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_way_there_anything_el_adac65: "哦，顺便问一下，你回来这里还有什么需要的东西吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_way_weren_t_you_8bb647: "哦，顺便问一下，你不是在找人吗？你说他叫什么名字？朱朱？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_well_i_m_neon_9d8ff7: "哦，嗯……我是……霓虹蘑菇是……你知道的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_what_surprise_d214b8: "哦，太令人惊讶了！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_while_you_re_could_e6e317: "哦，顺便说一下，你能帮那个愁眉苦脸的牧师也猎杀一些僵尸吗？就每样5只。我不想给你太多负担。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_why_am_i_so_6bdb8b: "哦，为什么我这么弱？不像我的哥哥们，我的能力在战斗中不是特别有用。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_you_here_0a7bf1: "哦你来了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_you_i_m_sorry_7d1b53: "哦，是你吗？对不起。也许你可以晚点再来？不，算了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_you_know_how_those_453644: "哦，你知道那些孢子是怎么发光的。我想用它们来照亮这个地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_you_mean_bomi_i_92b173: "哦，你是说波米？我以为她和德古拉一样是吸血鬼。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_you_need_more_experie_2711a9: "……哦，你需要更多经验。失陪了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_you_no_problem_i_5229a4: "哦，是你吗？没问题。我可以等到你有时间理我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_you_re_right_you_1061c1: "哦，你说得对。你一定忘了我让你做什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_you_then_go_go_69b2e3: "哦，是你吗？那就走吧。走开。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ok_fine_let_me_tell_0b078c: "好吧。我告诉你。答应我听完后回去。不是我想多说。"
