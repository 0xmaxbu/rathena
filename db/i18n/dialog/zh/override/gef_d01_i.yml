  npc_override_gef_d01_i_quests_illusion_dungeons_once_they_get_close_enou_1ae3b2: "但一旦它们靠得足够近，就会攻击人。我的心为它们感到难过……"
  npc_override_gef_d01_i_quests_illusion_dungeons_once_we_claim_land_legen_8bb5b4: "一旦我们占领了这片土地，传说中的力量也将属于我们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_once_you_find_either_one_337170: "一旦你找到其中任何一个"
  npc_override_gef_d01_i_quests_illusion_dungeons_one_day_everyone_started_1b9e9f: "有一天，所有人都开始在这里排队，所以我也站在这里了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_one_day_people_church_fo_1cf4f7: "有一天，教会的人找到了我。他们一心想以正义之名杀死我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_one_different_color_neon_86da98: "这个和霓虹蘑菇的颜色不同。是新品种吗？我最好小心地采摘……"
  npc_override_gef_d01_i_quests_illusion_dungeons_one_its_own_cuteness_poi_f3980f: "那个有它自己的可爱之处？"
  npc_override_gef_d01_i_quests_illusion_dungeons_one_side_normal_seawater_4c7754: "一边是普通的海水，另一边是混合了埋在钓鱼竿中的深渊海水的海水。我会试着把这两样混合起来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_one_them_doesn_t_want_4be534: "但是其中一个不想战斗。她想谈谈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_one_us_missing_you_hurt_23d442: "我们少了一个。你伤害了他，不是吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_only_applies_us_humans_t_65ea07: "那只适用于我们人类。它们是吸血鬼！"
  npc_override_gef_d01_i_quests_illusion_dungeons_only_because_s_too_dark_ac2dc2: "这只是因为太黑了看不见。而且别再偷看我做什么了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_only_leiphen_also_kid_na_c07419: "不仅是莱芬，还有一个叫纳林的孩子……你也帮了他。你真是一位伟大的冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_only_look_like_one_we_c95614: "它不仅看起来像，它就是我们做的那个！"
  npc_override_gef_d01_i_quests_illusion_dungeons_only_person_i_ask_you_98aa70: "我唯一能求助的人就是你了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_oops_7517c8: "哎呀……"
  npc_override_gef_d01_i_quests_illusion_dungeons_oops_f6443e: "哎呀！"
  npc_override_gef_d01_i_quests_illusion_dungeons_oops_fire_didn_t_go_5c0f6b: "哎呀……火不太行。我不能烧书或工具。"
  npc_override_gef_d01_i_quests_illusion_dungeons_oops_i_m_position_compar_4b657b: "哎呀，我没有资格比较相似的面孔……我们是双胞胎。哈哈哈"
  npc_override_gef_d01_i_quests_illusion_dungeons_oops_s_archeologist_leip_72c4b7: " - ^424242哎呀。肯定不是考古学家莱芬。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_or_not_ea3fdd: "……或者不是。"
  npc_override_gef_d01_i_quests_illusion_dungeons_orb_needs_more_time_gath_0b3843: "这个宝珠需要更多时间来收集足够的能量才能起作用。"
  npc_override_gef_d01_i_quests_illusion_dungeons_order_bring_sirood_back_bf3d46: "为了把西罗德带回岸上，我们还需要额外的^4d4dff{0}^000000。问题是怎么得到它……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ordinary_people_like_pro_d17879: "像教授这样的普通人根本看不到我们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_other_words_even_if_i_b41eea: "换句话说，即使我错了，我也没有回到一楼。"
  npc_override_gef_d01_i_quests_illusion_dungeons_others_you_said_you_help_8cde0c: "还有其他人……你说你会帮助他们。我会告诉你怎么做。你可以怎么帮忙……"
  npc_override_gef_d01_i_quests_illusion_dungeons_otherwise_how_could_you_8e70cd: "否则，你怎么能进出别人的梦境？"
  npc_override_gef_d01_i_quests_illusion_dungeons_our_name_18cf2f: "从我们的名字里！"
  npc_override_gef_d01_i_quests_illusion_dungeons_pass_money_dd14e5: "付钱"
  npc_override_gef_d01_i_quests_illusion_dungeons_pay_so_good_compared_job_600ab7: "报酬相对于工作来说很不错，而且交货地点也是矿场，所以有点可疑……"
  npc_override_gef_d01_i_quests_illusion_dungeons_payback_revenge_munch_mu_2ece86: "还有报复{0}。^FF0000复仇^000000……咔嚓咔嚓……我的^BDBDBD复仇^000000……请……"
  npc_override_gef_d01_i_quests_illusion_dungeons_payon_cave_used_part_vil_61a656: "帕伊恩洞穴曾经是一个被山体滑坡掩埋的村庄的一部分。"
  npc_override_gef_d01_i_quests_illusion_dungeons_payon_home_sacred_creatu_1e509d: "帕伊恩自古以来就是神圣生物的家园。"
  npc_override_gef_d01_i_quests_illusion_dungeons_people_desire_what_they_81022d: "人们渴望他们没有的东西。我渴望^0000cd力量^000000，因为我太小太虚弱，无法像同龄人一样生活。"
  npc_override_gef_d01_i_quests_illusion_dungeons_people_f8e052: "各位！！！"
