Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_gef_d01_i_quests_illusion_dungeons_aaaaaaaaaa_182b18: "啊啊啊啊啊！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_aagh_s_attack_monsters_c_2a1d11: "啊啊！！是袭击。怪物从四面八方涌来了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_aargh_what_097934: "啊啊！这是什么！"
  npc_override_gef_d01_i_quests_illusion_dungeons_able_meet_sirood_again_l_da6153: "能再次见到西罗德，简直像做梦一样。"
  npc_override_gef_d01_i_quests_illusion_dungeons_about_angry_nine_tails_29b4c2: "关于愤怒的九尾狐。"
  npc_override_gef_d01_i_quests_illusion_dungeons_about_foxes_nightmares_c_b6a7d8: "我是说，关于狐狸们的噩梦成真的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_about_khahris_you_told_m_fe7e1d: "你告诉我的关于卡丽丝的事，我不会忘记的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_about_man_b8bc72: "关于那个男人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_about_months_ago_i_went_e17a05: "大约三个月前……我在一个风雨交加的日子去钓鱼了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_about_muyeon_1b9300: "是关于穆延的事吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_about_teddy_bear_b52dc2: "关于泰迪熊"
  npc_override_gef_d01_i_quests_illusion_dungeons_about_those_walking_corp_942aac: "当然是关于那些行走的尸体！"
  npc_override_gef_d01_i_quests_illusion_dungeons_accept_3e1999: "接受。"
  npc_override_gef_d01_i_quests_illusion_dungeons_accept_bb54db: "接受"
  npc_override_gef_d01_i_quests_illusion_dungeons_accept_request_70d649: "接受请求"
  npc_override_gef_d01_i_quests_illusion_dungeons_according_briashen_he_lo_20aafa: "据布里亚申说，他和她长得像双胞胎。"
  npc_override_gef_d01_i_quests_illusion_dungeons_according_bryashen_khahr_5da053: "== 据布里亚申说，被玛雅带走的是卡丽丝。 =="
  npc_override_gef_d01_i_quests_illusion_dungeons_according_mirko_mirko_ne_c346fd: "== 但据米尔科说，米尔科从未见过卡丽丝。 =="
  npc_override_gef_d01_i_quests_illusion_dungeons_according_my_investigati_0df843: "根据我的调查，狂怒冰巨人就像空气中的尘埃一样微小。"
  npc_override_gef_d01_i_quests_illusion_dungeons_according_my_investigati_5a7900: "根据我的调查，狂怒雪人是喜欢向人打招呼的温和生物。"
  npc_override_gef_d01_i_quests_illusion_dungeons_according_my_investigati_795094: "根据我的调查，这个洞穴曾经是一个地下王国，整个都是由黄金建成的，就像黄金国一样！"
  npc_override_gef_d01_i_quests_illusion_dungeons_according_my_investigati_7e5491: "根据我的调查，加泽蒂是冰巨人。它们对这个洞穴太好奇了，把头伸进去结果脖子断了。现在它们在洞穴里游荡，寻找自己的身体。"
  npc_override_gef_d01_i_quests_illusion_dungeons_according_my_investigati_82ac3f: "根据我的调查，这些冰柱经历了很多。"
  npc_override_gef_d01_i_quests_illusion_dungeons_according_our_assessment_618737: "根据我们的评估，这个地方内部发生的事情似乎^0000cd不会影响^000000外界。"
  npc_override_gef_d01_i_quests_illusion_dungeons_acid_a54755: "是酸吗……"
  npc_override_gef_d01_i_quests_illusion_dungeons_acid_you_go_back_village_387bc7: "阿西德！你可以先回村子去了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_actually_backwards_006b16: "== 其实是反过来的？ =="
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_2439c4: "冒险者？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_come_back_tom_025646: "冒险者，明天再来帮我猎些玛特吸血蝙蝠吧，好吗？没有它们太安静了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_could_you_bri_c89203: "冒险者，明天能再给我带些来吗？我担心今天这些可能会被我用完。就算用不完，我也总是需要更多样本的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_could_you_get_434cb1: "冒险者，你能也给我弄些噩梦之簇吗？我可以把它们和孢子混合成糊状，涂在墙上。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_could_you_tak_ff4a60: "冒险者，下次你进笔记本的时候能带上我吗？我发誓我不会偷笔记本的。我只是对它太好奇了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_did_you_forge_182894: "冒险者，你忘了我拜托的事吗？我需要^0000cd10份玛特吸血蝙蝠的黏稠血和10份霓虹蘑菇的蘑菇汁^000000。谢谢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_did_you_good_89620c: "冒险者，你昨晚睡得好吗？我做噩梦了，大概是整天看那些鬃毛看的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_did_you_know_863498: "冒险者，你知道吗，吉芬地下的这些墓穴曾经很安静，充满了特殊的能量，而不是怪物。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_did_you_repor_37b3a1: "冒险者，你已经报告过了吗？你在这里还有别的事要做吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_did_you_take_23f091: "冒险者，我拜托的事你办好了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_enough_time_p_432900: "冒险者，距离你上次狩猎还没过多久。你需要休息。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_friend_save_b_4f48ad: "冒险者朋友，救救布里亚申。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_here_ed6a86: "冒险者来了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_how_did_you_f_1b0ec2: "冒险者，你触摸笔记本的时候有什么感觉？你觉得它是怎么运作的？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_don_t_want_d87341: "冒险者，我不想太麻烦你，但我能请你帮个忙吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_don_t_want_eacca5: "冒险者，我不想你太劳累。不如你先去休息一下吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_haven_t_see_f1bbe2: "一个从未在我梦中出现的冒险者正在帮助我们，所以我确信我们能够改变它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_m_going_tak_011f0c: "冒险者，我打算带朱比利兄弟去宝石姐妹那里。你能在这里四处看看吗？我会尽快回来的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_read_notebo_16ad9c: "冒险者，我在笔记本上看到，主人用一些材料对僵尸做实验。我觉得是世界树叶和一些图画。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_talk_you_se_98a048: "冒险者，我能和你说句话吗？我想听听你的意见。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_ve_been_wai_dd2d22: "冒险者，我一直在等你！你拿到我要的东西了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_if_you_re_bus_e29367: "冒险者，如果你不忙的话，愿意听听我们说话吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_let_s_go_c6d708: "冒险者，我们走吧！"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_now_radiating_e0759c: "这个冒险者现在正散发着大量的寒气！"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_please_bring_9ab2d2: "冒险者，请把蝙蝠毛带来给我。王，我是说，王先生，我需要多少蝙蝠毛？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_please_don_t_568583: "冒险者，拜托嘛？我看起来不可怜吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_please_take_m_a9b68c: "冒险者，你回到岸上的时候请带上我吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_s_flair_whoop_6e4cf7: "冒险者的风采……哎呀！"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_see_luminous_ea805e: "冒险者，看到这边的微光了吗？那是你带给我的发光孢子发出的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_showed_up_jus_da145f: "正好在需要冒险者的时候，冒险者就出现了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_bri_2e09f5: "冒险者，谢谢你把这些带给我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_doi_76b88e: "冒险者，谢谢你为我们做这些。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_fee_19e90f: "冒险者，谢谢。如果你想^0000cd再次进入笔记本^000000，随时可以来找我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_hel_57df47: "冒险者，谢谢你帮我做研究。这些发光孢子维持不了多久。你明天能再给我带些来吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_try_a1900d: "冒险者，谢谢你试图帮我，但我不想让你太劳累。不如先休息一下吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_ven_2ff374: "冒险者，谢谢你为我们进入那个神秘的地方。如果你能偶尔去看看那里的同事，给我带些他们的消息来，我将不胜感激。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_wait_339cc1: "冒险者，等等！"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_waiting_you_460096: "有位冒险者在等你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_waiting_you_bda40b: "冒险者在等你"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_welcome_back_5896ed: "冒险者，欢迎回来！我等你好久了！你带了我要的东西吗？快，让我看看！"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_welcome_back_7bbeaf: "冒险者，欢迎回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_welcome_back_cc7f70: "冒险者，欢迎回来。今天能和往常一样帮我吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_welcome_back_ea95c6: "冒险者，欢迎回来！"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_busy_bacf69: "冒险者，你忙吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_going_get_0fecef: "冒险者，你打算去给他弄蝙蝠毛吗？好的，那意味着你会去处理那些玛特吸血蝙蝠。它们扇动翅膀的声音让我晚上睡不着。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_know_wher_4de3e9: "冒险者，你知道海的最深处在哪里吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_leaving_n_33b384: "冒险者，你现在要走吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_light_my_11fcbc: "冒险者！你是我生命中的光！"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_re_back_a_e32d25: "冒险者，你已经回来了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_really_cu_259249: "冒险者，你对什么都这么好奇。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_took_care_13e5d1: "冒险者，你把它们都解决了。谢谢你。它们在天堂也会感谢你的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_want_ente_756294: "冒险者，你想进入笔记本吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_after_being_hurt_like_he_c95af2: "但受了这样的伤之后……他说他需要休息一段时间，但他一定是自己进了那个蚁丘。"
  npc_override_gef_d01_i_quests_illusion_dungeons_after_hellish_dream_i_sa_286eb2: "在那个地狱般的梦之后，我看到自己在洞穴的壁画上记录当天的事件。"
  npc_override_gef_d01_i_quests_illusion_dungeons_after_i_caught_my_first_9356b5: "在我钓到第一条鱼之后，我试图用鱼竿把它弄上来时绊了一下，掉进了水里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_after_i_could_stay_littl_064f44: "在那之后……我能多待一会儿了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_after_i_going_stop_geolo_22ee16: "在那之后，我打算暂停这一侧的地质勘探，组织一次新的远征。"
  npc_override_gef_d01_i_quests_illusion_dungeons_after_i_handed_pieces_hi_d32eac: "在我把碎片交给他之后……"
  npc_override_gef_d01_i_quests_illusion_dungeons_after_months_555b7a: "三个月后！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_after_we_got_together_ra_85263a: "之后我们聚在一起，到处跑去找西罗德，但没有结果，我们都快要放弃了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_after_we_waited_outside_1aeae2: "之后我们在外面等着，因为单独进去的勘探结果不错，"
  npc_override_gef_d01_i_quests_illusion_dungeons_again_i_forgot_again_c11848: "……又来了……我又忘了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_again_stranger_74028c: "又是……陌生人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_971301: "啊……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_adventurer_good_see_y_c51f59: "啊，冒险者。很高兴又见到你！德古拉好多了，虽然他整天都在睡觉。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_ah_ah_bda2aa: "啊！啊！啊！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_ah_nice_smell_meat_ae37e9: "啊……啊……肉香味。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_ah_right_should_take_ba993c: "啊，啊……那个，对吧？那个应该优先处理。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_ah_then_hey_adventure_f98f02: "啊，啊……那么……嘿，冒险者！！初次见面很抱歉，但我能请你帮个忙吗？？我们被困在依斯鲁得出不去……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_come_think_e66f27: "啊……说起来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_come_think_you_rememb_fbf728: "啊！说起来，你还记得我们第一次见面的时候吗？我不是说过我已经习惯当冒险者了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_cough_cough_00bc18: "啊！咳咳！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_did_you_notice_yes_e5a509: "啊！你注意到了吗？是的，我也叫卢安达。村里的长老们说……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_f5ad63: "……啊……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_fox_lady_9799e3: "啊……那位狐狸女士……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_going_back_3d8071: "啊？不回去了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_i_m_going_anymore_bb7270: "啊，我不干了。把那句话告诉那些老家伙们！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_i_see_i_ve_848a95: "啊……原来如此，我从没听说过海沟。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_junghee_4cf421: "啊，正熙！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_karu_my_husband_sa_8ab9d1: "啊……卡鲁……我的丈夫……萨……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_s_relief_i_d_5b0171: "啊，那就好……如果你回到岸上时能带上我就太好了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_sister_marina_help_yo_6bd49d: "啊，玛丽娜修女！救命！你以后不想为我的死感到内疚的话就一定要帮我！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_there_you_how_place_e00f25: "啊，你来了！那个地方怎么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_today_must_my_lucky_35750b: "啊，今天一定是我的幸运日！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_watch_your_mind_locat_dc9339: "啊！小心点。位置在战场中央，为了安全我把它装在了角落里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_welcome_adventurer_c60f5a: "啊，欢迎你，冒险者！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_when_peaceful_rest_7a1a4c: "啊……什么时候才能安息……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_yes_333f97: "啊……是的。{0}。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_yes_65f3f8: "啊……是的。{0}。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_you_look_pretty_stron_bb0331: "啊～你看起来挺强的。太好了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_you_re_here_3667d3: "啊你来了！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_you_re_here_f7cc32: "啊，你来了！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_you_re_one_introduced_8cbccf: "啊，你就是拉凯特介绍的那个人。我一直在等你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_you_stranger_i_saw_9617d5: "啊！你？上次我看到的那个陌生人！！你还在这里？我肯定会……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ahah_i_m_full_i_2e8be7: "啊啊，我吃饱了。我现在不会死了。我吃饱了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ahhhhhhhhhhhhhhhhhhhhhhh_4e29f9: "啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊……"
  npc_override_gef_d01_i_quests_illusion_dungeons_air_brimming_strange_ene_a664cf: "- 空气中弥漫着奇怪的能量。 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_air_here_worse_than_mine_116ff1: "这里的空气比矿里还糟糕……咳。"
  npc_override_gef_d01_i_quests_illusion_dungeons_alive_1ec8bf: "还活着！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_b2ff06: "一点也不。"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_dead_must_return_ear_ab1839: "所有死者都必须回归大地。"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_he_wanted_protect_ot_29b1e8: "他只想保护别人，却未能实现这个愿望就死了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_people_here_immigran_fa0ee6: "这里的人都是移民和定居者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_potions_i_found_didn_2ae760: "我找到的所有药水都没能改善我虚弱的体质。它们只能增强已有的力量。"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_quests_quest_board_b_4e7b8e: "委托板上的所有委托都已接取。"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_residents_here_spiri_21ad6e: "这里的居民都是被怨恨束缚的灵魂。当你死了，执着于你渴望的东西，你就会永远重复同样的事而不自知……"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_three_disappeared_mi_a80e2b: "三个人都在交谈中消失了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_time_effort_807d60: "所有的时间和努力……"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_vampires_same_we_re_6baa80: "不是所有吸血鬼都一样。我们和她不同。对了，你怎么还在这里？德古拉不需要你了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_you_no_longer_1df83d: "所有……你不再……"
  npc_override_gef_d01_i_quests_illusion_dungeons_alright_then_i_d_better_20ff21: "好吧，那我最好去休息一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_also_ants_super_powerful_1fd114: "而且，蚂蚁超强的！"
  npc_override_gef_d01_i_quests_illusion_dungeons_also_could_you_hunt_zomb_f4b6a2: "还有，你能帮那边那个皱眉的神父猎杀每种僵尸5只吗？谢了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_also_i_ve_sensed_evil_600d2a: "另外，我感应到了邪恶的存在。请小心。"
  npc_override_gef_d01_i_quests_illusion_dungeons_also_please_hunt_zombies_838f30: "另外，请帮那个唠叨的神父猎杀每种僵尸5只。"
  npc_override_gef_d01_i_quests_illusion_dungeons_also_there_s_something_o_99e0ad: "另外，这里的人和狐狸都有些不对劲，我还看到其中有一个长相奇怪的魔法师。"
  npc_override_gef_d01_i_quests_illusion_dungeons_am_i_dead_am_i_f8c517: "我是死了……还是活着……"
  npc_override_gef_d01_i_quests_illusion_dungeons_am_i_dull_efd5c8: "我是不是很迟钝……？"
  npc_override_gef_d01_i_quests_illusion_dungeons_am_i_hurt_3f521e: "我受伤了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_am_i_khahris_1e0ff1: "我是……卡丽丝吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_am_i_person_2c3947: "我是……人类吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_amount_i_think_i_create_fe6f3e: "有了这个量，我想我可以制造出一个普通人也能进入的裂隙漩涡。你把它交给我吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_amount_okay_057ece: "这个量够了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_and_dbaaae: "需要10个{0}、{1}和{2}！"
  npc_override_gef_d01_i_quests_illusion_dungeons_anymore_9ce0a8: "不再有了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_even_though_s_str_42c728: "总之，虽然奇怪地黑暗，但就像在这里又不在……感知正在从身体上剥离……"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_i_need_sticky_blo_ae98fa: "总之，我需要^0000cd10份玛特吸血蝙蝠的黏稠血和10份霓虹蘑菇的蘑菇汁^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_investigation_has_d3346d: "总之，调查还没完成，所以我们很紧张……"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_please_take_care_ac35a2: "总之，请照顾好这个地方的^0000FF真理巫师^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_second_floor_road_563f62: "总之，这里是二楼，去一楼的路在那边，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_thank_you_doing_m_786326: "总之，谢谢你为我做这些！"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_these_mages_after_f55e52: "总之，这些魔法师在建成吉芬塔之后，注意到了墓穴中偶尔出现的亵渎生物。"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_they_re_so_old_d00564: "总之它们太旧了，保存得也不好，很容易碎成灰。我没能完成研究。"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_we_met_here_we_9c982f: "总之，我们在这里相遇了。我们惊讶于彼此有多么相似。"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_you_heard_aylvar_702116: "总之，你有艾尔瓦的消息吗？我听到的时候很犹豫。"
  npc_override_gef_d01_i_quests_illusion_dungeons_archeologist_leiphen_cou_47e02d: " - ^424242考古学家莱芬吃不下东西……但据纳林说，她会很高兴的。我只能在这里面拿到{0}。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_archeologist_leiphen_hel_615016: " - ^424242考古学家莱芬屏住呼吸点了点头。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_aren_t_ants_colonies_659b28: "蚂蚁不是群居的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_aren_t_they_creepy_every_d2d71f: "它们不吓人吗？每次我看它们的时候，它们看起来都在无声地说，"
  npc_override_gef_d01_i_quests_illusion_dungeons_aren_t_those_just_teddy_38ddf7: "那些不就是泰迪熊吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_argh_i_don_t_ever_f33ea9: "啊啊！我再也不想看到它们了！我们走！"
  npc_override_gef_d01_i_quests_illusion_dungeons_argh_i_t_believe_you_e221dd: "啊啊，真不敢相信你直接冲进那种地方去了！这就是为什么我不能让你一个人待着！"
  npc_override_gef_d01_i_quests_illusion_dungeons_argh_you_re_going_burn_8bbc4f: "啊啊，你是要把我们都烧死吗！"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_briashen_asked_you_li_603345: "正如布里亚申所问，你愿意下楼去帮他吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_exchange_i_took_how_fd8195: " - ^424242作为交换，我拿走了{0}。他怎么会因为没看到真正有价值的东西就对这种垃圾着迷呢？^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_expected_cough_cough_ce9042: "果然……咳咳……发生了什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_expected_i_don_t_616da8: "果然，我觉得那不是什么不好的预感。我真的不敢相信。一个在过去遇见我的冒险者……"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_far_as_i_remember_b6504d: "据我所知，以前从未发生过这样的事。要想弄清楚这个，我们只能靠自己了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_girl_who_there_told_98aaba: " - ^424242正如在那里的女孩告诉我的，我捏紧了那片龟壳碎片，感觉风再次吹拂我的头发。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_as_i_said_before_some_327b2a: "就像我之前说过的，有些人可能会看到虚妄，但是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_i_told_you_i_e80fe2: "就像我告诉你的，在找到这个地方的秘密之前我不会离开。"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_i_woke_up_i_851a98: "当我醒来时，我感觉到了艾尔贝塔港的海风……在我手里，有两片龟壳碎片。"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_if_wasn_t_enough_b12470: "而且好像还不够似的，那些魔法师用魔法复制了复活的过程。"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_long_as_maya_doesn_0bacb6: "只要玛雅不来，我就没事……"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_long_as_maya_doesn_93f359: "只要玛雅不来，我就没事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_she_told_me_there_db4522: " - ^424242正如她告诉我的，还有其他人……但他看起来不像考古学家莱芬。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_as_you_guess_many_people_1bfc7e: "正如你所猜想的，有许多人和它一起被埋葬了，他们的灵魂在洞穴里游荡。"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_you_know_i_live_558de6: "如你所知，我靠用在这里找到的材料自制的人造血为生。我想我也给德古拉做一些。"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_you_know_memory_perce_bc3e61: "如你所知，那里的记忆和感知是扭曲的。你看起来没事，但是"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_you_know_we_re_14733f: "如你所知，我们是来监视他们的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_you_see_there_traces_fff4c6: "如你所见，这些深处有文明的痕迹，但这里的每个人都是外来者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ask_young_scholar_there_64de9a: "去问那边那位年轻学者关于穆延的下落。"
  npc_override_gef_d01_i_quests_illusion_dungeons_asudem_2dfc3f: "阿苏德姆！！！！！！！！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_awesome_5fc348: "太棒了！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_aww_a08236: "…………啊呜……"
  npc_override_gef_d01_i_quests_illusion_dungeons_aww_asudem_why_why_my_97375b: "啊呜！阿苏德姆，为什么？为什么？我的……我是怎么找到你的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_aww_my_wounds_fully_heal_c0d895: "啊呜，我的伤全好了，但我还是好痛。"
  npc_override_gef_d01_i_quests_illusion_dungeons_aylvar_right_about_place_fad981: "……艾尔瓦说得对。"
  npc_override_gef_d01_i_quests_illusion_dungeons_back_alberta_d5bf09: "回到艾尔贝塔。"
  npc_override_gef_d01_i_quests_illusion_dungeons_back_then_only_couple_mo_000209: "那时候，每隔十年左右才会有几只怪物出现。"
  npc_override_gef_d01_i_quests_illusion_dungeons_back_when_their_village_6e47ae: "当他们的村庄被埋葬的时候……"
  npc_override_gef_d01_i_quests_illusion_dungeons_bad_luck_follows_me_wher_2cbb7c: "厄运如影随形。宝美甚至给我做了一个幸运符，但没用。"
  npc_override_gef_d01_i_quests_illusion_dungeons_bat_blood_she_drinks_som_9afbc4: "她喝的蝙蝠血有时会让她失去理智。过一会儿她会平静下来，但如果教会的人看到她那种脆弱的状态，他们会试图杀死她。"
  npc_override_gef_d01_i_quests_illusion_dungeons_bats_catacombs_drink_blo_9a8cc1: "墓穴里的蝙蝠吸食僵尸的血，大概是因为没有别的东西可吃。"
  npc_override_gef_d01_i_quests_illusion_dungeons_beats_me_c2fb68: "这难倒我了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_because_bats_stealthy_th_0ae2a0: "因为蝙蝠很隐蔽，而且它们会飞。哦，说到这个，你知道玛特吸血蝙蝠的短毛是用来制作隐形斗篷的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_couldn_t_eithe_2c5427: "因为我也做不到。"
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_didn_t_need_e512e1: "因为我不需要。"
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_let_you_i_11ac96: "因为我允许你。我让你呼吸不是因为你有活下去的价值，而是因为我懒得杀你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_m_monster_i_c7c184: "因为我是怪物。我属于这里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_m_vampire_b06aa4: "因为我是吸血鬼。"
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_ve_lost_intere_7fdf0b: "因为我失去兴趣了？！"
  npc_override_gef_d01_i_quests_illusion_dungeons_become_smarter_b10735: "为了变得更聪明？"
  npc_override_gef_d01_i_quests_illusion_dungeons_before_my_eyes_completel_4c909d: " - ^424242在视线完全变暗之前，我的脸颊感受到了洞穴里更凉爽的空气……^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_before_you_get_danger_ge_44815d: "在你陷入危险之前，找到你要找的人然后离开。"
  npc_override_gef_d01_i_quests_illusion_dungeons_beginning_tragedy_49ae4f: "那就是悲剧的开始。"
  npc_override_gef_d01_i_quests_illusion_dungeons_berome_21a4fc: "贝罗梅"
  npc_override_gef_d01_i_quests_illusion_dungeons_besides_last_person_you_3381ce: "而且，你遇到的最后一个人是……维塔塔？"
  npc_override_gef_d01_i_quests_illusion_dungeons_betrayed_her_hah_where_s_31bade: "背叛她？哈？她在哪儿？他应该让她去死才对！"
  npc_override_gef_d01_i_quests_illusion_dungeons_better_start_introducing_f62e06: "最好先自我介绍一下。我是纳林。^0000CD老鬼。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_beyond_door_appears_blac_1feffd: " - ^424242门后一片漆黑，似乎什么都不存在。一道微红的光在黑暗的天空前漂浮。一个神情紧张的女孩出现了。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_biting_nails_fingertips_429f10: " - ^424242咬指甲，指尖都咬烂了……^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_bleeding_should_stopped_934548: "== 血应该止住了，但过度活动会让伤口裂开。 =="
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_away_i_ll_just_a4aba5: "宝美不在。我就把这些放在这里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_away_she_left_note_e1f7ff: "宝美不在。她留了一张纸条。"
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_gathering_her_thoug_4f4f7a: "宝美正在整理思绪。我晚点再跟她说。"
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_i_ll_see_you_ca896f: "宝美，等我好些了再来看你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_saved_me_she_fed_ab4404: "宝美救了我。她喂我她的血，让我恢复了力量。我不是活物，但那天她给了我新的生命。"
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_wait_you_re_bomi_3e77b5: "宝美？等等，你就是那个宝美？"
  npc_override_gef_d01_i_quests_illusion_dungeons_book_sustained_its_owner_dafe56: "这本书靠主人的精神能量维持，它会把注视它的人拉入^0000cd书中的世界^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_bounced_22c7b4: "弹开了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_brave_newly_born_soldier_7cbdbe: "勇敢的新生士兵们！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_0efa2b: "布里亚申……"
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_all_right_46b857: "布里亚申还好吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_asked_me_find_s_07fc02: "布里亚申让我找一个和她长得很像的游侠。"
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_real_ebb6fd: "那个布里亚申是真的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_s_dangerous_2153d7: "布里亚申，那很危险！"
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_sat_down_d59ddc: "== 布里亚申坐了下来。 =="
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_strongest_among_9850f1: "布里亚申是我们中最强的，她出去巡逻了，但看来会来这里的冒险者们还没有组成远征队的能力。"
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_who_searching_m_fb33f3: "== 正在寻找记忆的布里亚申感到困惑。 =="
  npc_override_gef_d01_i_quests_illusion_dungeons_briefly_explained_what_b_9501ed: "== 简要解释了布里亚申说的话。 =="
  npc_override_gef_d01_i_quests_illusion_dungeons_bright_beautiful_figure_1544bd: "这明亮美丽的身影……"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_antoine_i_go_we_5eda3d: "我和安托万兄弟去。我们受过战斗训练。你没有。"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_antoine_you_stay_fd5ee7: "安托万兄弟，你留在这里。我和玛丽娜修女去。你们谁有意见吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_i_don_t_think_23b6ae: "兄弟，我觉得你不危险。现在不是时候。兄弟，我们先走吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_i_m_all_same_176a7f: "兄弟……我都一样……"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_jojo_asked_me_ne_f41778: "乔乔兄弟让我千万别让你碰那本书。你不记得了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_jojo_you_re_safe_93ceda: "乔乔兄弟！你没事！"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_jubilee_79dd17: "朱比利兄弟？"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_jubilee_left_tre_dd8387: "朱比利兄弟去处理伤口了，但乔乔兄弟还没回来。我真希望他平安无事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_jubilee_you_thin_ff7e74: "朱比利兄弟，你觉得你能走吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_karu_lives_separ_707872: "卡鲁兄弟和他的嫂子分开住，我们还住在一起，但我觉得他不太在乎他姐姐。"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_s_big_deal_ma_b4b88d: "兄弟！出大事了。妈……村子那边传来血腥味。"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_you_ready_you_le_658f21: "兄弟？你准备好了吗？你很快就要走了吗？时间不多了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_you_still_here_s_7b7f73: "兄弟……你还在这里？魔法一天后就会消失，请天亮后再回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_brothers_disappeared_qui_501722: "兄弟们很快就消失了。我得告诉卢安达发生了什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_brothers_looks_like_hunt_370fe7: "兄弟们，看来这次狩猎很顺利。"
  npc_override_gef_d01_i_quests_illusion_dungeons_brothers_sisters_we_need_913f9b: "兄弟们。姐妹们。我们需要谈谈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_brothers_there_someone_o_1a74f3: "兄弟们，那边有人。陌生人？"
  npc_override_gef_d01_i_quests_illusion_dungeons_call_me_back_when_you_61d912: "准备好了就叫我回来"
  npc_override_gef_d01_i_quests_illusion_dungeons_cancel_c0b2bd: "不要取消"
  npc_override_gef_d01_i_quests_illusion_dungeons_careful_fa18ab: "小心。"
  npc_override_gef_d01_i_quests_illusion_dungeons_careful_something_bad_ha_08a1c2: "小心，里面正在发生不好的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_case_bahia_trench_scient_a83216: "但在巴伊亚海沟的情况下，科学家们计算过，从科学上讲，那里因为太深不可能有生命存在。"
  npc_override_gef_d01_i_quests_illusion_dungeons_case_karoo_hyung_he_abil_88e6b4: "至于卡鲁哥，他有即使在远处也能精确观察的能力……"
  npc_override_gef_d01_i_quests_illusion_dungeons_case_you_forgotten_you_k_68d4b6: "以防你忘了，你知道你为什么还能站在那里呼吸吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_caught_i_got_caught_cbfd0c: "被抓住了，我被抓住了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_certainly_i_don_t_know_069942: "当然！！我不知道，但你愿意吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_chattering_his_teeth_c_c_ccf233: "*牙齿打颤* 好……好……好……好冷。别碰我！你太冷了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_cheap_where_twins_they_s_35e956: "切……双胞胎在哪儿？他们应该在……"
  npc_override_gef_d01_i_quests_illusion_dungeons_chief_559232: "酋长"
  npc_override_gef_d01_i_quests_illusion_dungeons_chief_what_about_village_7e5859: "酋长，那些被怪物抓走的村民怎么办？他们已经……"
  npc_override_gef_d01_i_quests_illusion_dungeons_chief_who_worried_about_937240: "担心我的酋长不见了。我得把经历告诉卢安达先生。"
  npc_override_gef_d01_i_quests_illusion_dungeons_chunghae_having_problem_07bdd8: "忠海因为愤怒的狐狸们在调查这个地方时遇到了麻烦。"
  npc_override_gef_d01_i_quests_illusion_dungeons_chunghae_s_almost_done_i_ace59a: "忠海对这个地方的调查快完成了。我最好准备离开。"
  npc_override_gef_d01_i_quests_illusion_dungeons_chunghae_said_we_re_insi_246b1c: "忠海说我们在一朵月夜花的噩梦里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_chunghae_what_you_doing_d6394e: "忠海，你在这里做什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_ci_974a20: "CI……"
  npc_override_gef_d01_i_quests_illusion_dungeons_cloaking_capes_thieves_t_a11bef: "隐形斗篷？盗贼和他们那类人一定很喜欢那些。"
  npc_override_gef_d01_i_quests_illusion_dungeons_closeness_so_strong_you_04c92c: "一种如此强烈的亲近感，以至于你因为被附身而无法回来……"
  npc_override_gef_d01_i_quests_illusion_dungeons_colleague_briashen_spoke_291fa6: "布里亚申提到的同事是卡丽丝，"
  npc_override_gef_d01_i_quests_illusion_dungeons_collect_900032: "并收集20个^0000FF{0}^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_0b3a3d: "来吧……"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_back_10c51c: "然后回来？"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_back_me_when_you_4561a2: "收集完所有精华之后就回来找我！"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_i_only_trying_help_c077f5: "拜托，我只是想帮忙！"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_let_s_go_yay_5fa21b: "来吧！我们走吧～～！！耶！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_s_me_mojo_don_c2dfd0: "拜托，是我，莫乔。你不信任我吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_think_i_feel_like_fd71d5: "说起来，我觉得呼吸顺畅多了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_coming_back_original_sto_d1bcda: "回到原来的故事，我画壁画的原因是因为有一天我梦到一个村庄在燃烧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_composition_normal_sea_w_699051: "普通海水和深海水的成分几乎相同。唯一的区别是巴伊亚海沟的深海。"
  npc_override_gef_d01_i_quests_illusion_dungeons_consciousness_became_far_4658ca: " - ^424242意识变得遥远，艾尔贝塔港咸咸的、略带腥味的气息拂过鼻尖。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_content_notebook_isn_t_w_85450d: "这本笔记本的内容并不是让我担心的原因。你触摸它的时候难道没有察觉到某种^0000cd奇怪的能量^000000吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_corpse_fine_please_6c0ec5: "尸体也行，拜托了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_745493: "……咳……"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_949484: "咳……"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_cough_8a4c07: "咳咳"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_cough_a72d8f: "咳咳！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_cough_adventurer_c_7b388a: "咳咳……冒险者……咳……带上我！"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_cough_cough_9a4b67: "咳……咳……咳……"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_cough_cough_bb98f0: "咳咳……咳"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_cough_cough_cough_fa2869: "咳……咳咳……咳"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_lucky_e23226: "咳……幸运……"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_ant_b4b9b9: "会是蚂蚁吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_dangerous_so_if_yo_72963c: "可能会有危险，所以如果你发现了它，为什么不避开呢？没必要冒险。"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_he_father_jubilee_eaa05e: "他会是朱比利神父吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_just_reflect_dream_2c9074: "或者它可能只是反映死者的梦境。"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_nugget_help_6d53fb: "这块金块能帮忙吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_you_come_back_afte_f5ebfe: "你能在天亮之后再来吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_you_get_me_shining_790b15: "你今天能再给我弄些发光孢子吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_you_go_check_up_c467a0: "你能帮我们去看看^0000FF穆延^000000吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_you_hunt_some_angr_b95646: "你能猎杀一些^4d4dff愤怒的九尾狐^000000吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_you_leave_fishing_baadae: "你能把这根鱼竿留给我吗？我想如果我把这些海水提取出来变成精华，或许能想出点什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_you_light_twigs_pl_e58e54: "你能点燃树枝放在我周围吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_couldn_t_all_three_khahr_ec7a6d: "这三个人难道不都是卡丽丝吗，而不是那个长得像他的人？"
  npc_override_gef_d01_i_quests_illusion_dungeons_course_be6167: "当然。"
  npc_override_gef_d01_i_quests_illusion_dungeons_course_i_come_back_s_1b4f3f: "我当然得回来。这是一个我能发现龟岛历史所有新事实的地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_course_i_could_wrong_af5bf7: "当然，我也可能错了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_course_i_didn_t_come_559207: "当然，我不是为了宝藏才来的。我们正好在附近，我只是想看看这个地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_course_only_his_servants_c42018: "当然不是。只有祂的仆人能听见祂的声音。"
  npc_override_gef_d01_i_quests_illusion_dungeons_curiosity_what_fuels_our_9b35cc: "好奇心是生命的燃料。它是发展的种子。冒险者，你会因为危险而犹豫去往新世界吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_cursed_lizard_roams_abou_07c439: "那条被诅咒的蜥蜴在这个洞穴里游荡，仍然想到外面去。这难道不悲惨吗？我只是想解放它，结果它把我冻在冰块里作为回报！"
  npc_override_gef_d01_i_quests_illusion_dungeons_cute_horns_af9ffc: "……可爱的角……"
  npc_override_gef_d01_i_quests_illusion_dungeons_d_great_if_you_join_c53c98: "如果你能再次加入我们就太好了。在废墟村庄见。"
  npc_override_gef_d01_i_quests_illusion_dungeons_damn_damn_8bcf12: "该^BDBDBD死^000000……^BDBDBD该^000000死……"
  npc_override_gef_d01_i_quests_illusion_dungeons_damn_uh_mon_monster_2aafcf: "该^BDBDBD死^000000……怪……^BDBDBD怪物^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_damn_you_don_t_look_16b937: "该^BDBDBD死^000000！别^BDBDBD那样^000000看^BDBDBD我^000000……^BDBDBD别看^000000！"
  npc_override_gef_d01_i_quests_illusion_dungeons_damnuh_mon_dmonster_aee3af: "该^BDBDBD死^000000的……怪……^BDBDBD怪物^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_damnuh_mon_dmonster_b1d8d3: "该^BDBDBD死^000000……怪……^BDBDBD怪物^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_damnuh_mon_dmonster_b3e673: "该^BDBDBD死^000000……怪……^BDBDBD怪物^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_damnuh_mon_monster_99334a: "该^BDBDBD死^000000……怪……^FF0000{0}只怪物^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_dangerous_if_left_unatte_51310a: "放任不管的话会很危险……"
  npc_override_gef_d01_i_quests_illusion_dungeons_day_over_you_two_stay_615ff1: "天快黑了，你们两个待在一起。我会给你们一个新的法术。"
  npc_override_gef_d01_i_quests_illusion_dungeons_day_sirood_went_missing_968305: "西罗德失踪的那天恰好也是风雨交加的日子。我穿上雨衣去钓鱼了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_dead_belong_ground_we_he_e7bf58: "死者属于大地。我们来这里是为了^0000cd让亡灵安息^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_dead_belong_ground_you_r_754a6c: "死者属于大地，你就是其中之一。你以为你是什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_dead_don_t_talk_there_cc8706: "死者不会说话。我从他们那里什么都查不到。"
  npc_override_gef_d01_i_quests_illusion_dungeons_dead_shall_return_earth_3d8762: "死者应当回归大地！"
  npc_override_gef_d01_i_quests_illusion_dungeons_delicious_s_so_delicious_ec3eca: "美味。太好吃了。开心。真的很好吃。"
  npc_override_gef_d01_i_quests_illusion_dungeons_depends_what_kind_cape_y_c479c4: "那要看你想要什么样的斗篷了。反正用毛做东西不容易。"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_he_go_hospital_b9649b: "他去医院了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_i_ever_tell_you_d2ff28: "我有没有告诉过你，那块蕴含我魔法的石头可以测量与我之间的距离？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_i_forget_something_p_463cbf: " - ^424242我忘了什么吗？^0000CD{0} 5块 ^424242和^0000CD猎杀10只{1}。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_twins_find_out_leave_5648b6: "双胞胎发现了然后离开了？耐心点……他们会很快回来的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_come_help_us_f0dcc0: "你是来帮我们的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_find_him_2f57d9: "你找到他了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_forget_what_i_cb61a2: "还是说你忘了我要你做的事？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_forget_why_broth_e820ca: "你忘了乔乔兄弟为什么让你待在这里、远离那本笔记本了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_get_payback_terr_a5c48e: "你报仇了吗？向那些^BDBDBD可怕的^000000怪物？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_get_some_rest_000b3d: "你休息过了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_get_their_blood_b59c3c: "你拿到了吗？但它们的血有剧毒。所以我用这些蘑菇来解毒。"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_guys_make_up_c64517: "你们和好了吗？德古拉，最糟糕的时候已经过去了。你只需要休息恢复体力。"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_happen_hear_our_8f1c74: "你碰巧听到我们的对话了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_hear_82aaa9: "你听到了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_just_call_me_fe60f5: "你刚才是不是叫我恶心的动物？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_save_me_i_ec651e: "你……救了我？我还以为你想让我死呢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_see_65f051: "你看到了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_see_people_oh_0a6a8c: "你看到人了吗？哦，你应该早点告诉我的。你在哪儿看到的？我们现在就去说吧！"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_see_real_thing_b987ea: "你这次看到真东西了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_see_too_c0164d: "你也看到了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_send_them_out_4daa1b: "你把他们派出去了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_didn_t_you_say_you_0c3b6f: "你不是说你得回去报告吗？去出口吧。我在那里闻到了你朋友的气味。"
  npc_override_gef_d01_i_quests_illusion_dungeons_didn_t_you_see_injured_9ef6d8: "你没看到受伤的游侠吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_didn_t_you_see_ranger_b7e7db: "你在这附近见过一个叫布里亚申的游侠吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_didn_t_you_see_someone_0a0c80: "你在这附近见过一个叫布里亚申的人吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_different_face_6d86d8: "是不同的一张脸吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_different_what_i_previou_ed4aa9: "但这和我之前对人类的理解不同。我开始理解他们了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_disappeared_9fd832: "消失了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_change_fact_your_b7a12a: "但这改变不了你的存在本身就违背了我们神的意志的事实。我们不能放过你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_guarantee_you_wo_396601: "这不能保证你将来不会。"
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_last_long_longer_367d8d: "它持续不了多久。你在这里待得越久，就越能注意到彼此。逐渐地。"
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_matter_if_real_a2e5d3: "这是否真实并不重要。看着祖先受苦是件难受的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_matter_if_they_3db065: "它们是否真实并不重要。它们同样具有威胁。"
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_matter_if_they_aeb784: "它们是否真实并不重要。"
  npc_override_gef_d01_i_quests_illusion_dungeons_doll_we_made_alive_movin_bb6a6f: "我们做的娃娃活了，还会动！"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_alarmed_you_may_bdae18: "^FF0000别紧张，你可能会觉得呼吸有些奇怪。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_breathe_you_too_3c4e79: "别呼吸。你也是。"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_even_pat_me_b279b4: "连拍我的背都不要……"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_get_confused_0bcec1: "别搞混了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_look_my_treasure_08d4c2: "别看我的^BDBDBD宝藏^000000！我^BDBDBD不会^000000给你的！！！！！嚼，^FF0000嚼^000000，嚼……"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_surprised_his_sing_05db4f: "别惊讶。他的歌声真的能鼓舞勇气、给予力量。他在这里是有原因的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_talk_me_294fc6: "别跟我说话……"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_talk_negatively_ev_cf4b40: "别说消极的话。每个人都活着。癌症不是活的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_touch_bomi_she_83c5c5: "别碰宝美……她……我……我们不想伤害任何人……她教会了我这个……"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_worry_about_e7e356: "别担心那个。"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_worry_i_e0c5a2: "别担心。我会的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_worry_myself_forge_9e5613: "别担心。{0}和我都不会忘记你的，纳林。"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_worry_s_nothing_5f77f8: "别担心，不是什么严重的事，我想我在看什么愚蠢的东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_drac_let_s_go_i_60edd2: "德拉克，我们走吧。我知道你不再痛了。这次我们真的应该回城堡去了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_drac_they_won_t_leave_6b4847: "德拉克，他们不会放过我们的。我们干脆解决掉他们！"
  npc_override_gef_d01_i_quests_illusion_dungeons_dracula_dracula_let_me_h_82a25f: "德古拉！德古拉！让我给你治疗！"
  npc_override_gef_d01_i_quests_illusion_dungeons_dracula_hang_drink_73f104: "德古拉，撑住。喝了这个。"
  npc_override_gef_d01_i_quests_illusion_dungeons_dracula_what_s_human_you_3f19c3: "德古拉，那个人类对你来说算什么？你为什么非要待在这样一个地方"
  npc_override_gef_d01_i_quests_illusion_dungeons_dracula_why_c132a7: "……德古拉？为什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_dracula_you_mean_dracula_2d3599: "德古拉？你是说那个德古拉？"
  npc_override_gef_d01_i_quests_illusion_dungeons_dream_reality_2e10ee: "这是梦还是现实……"
  npc_override_gef_d01_i_quests_illusion_dungeons_drivius_come_get_ca99e3: "德里维斯！过来拿吧！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_drove_me_sanity_sent_me_424e69: "它把我逼疯了，让我去了废墟村庄。"
  npc_override_gef_d01_i_quests_illusion_dungeons_duration_vortex_very_sho_5d227f: "漩涡的持续时间非常短。我花了两个月才把写有我名字的鱼竿放进漩涡里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_each_every_request_preci_2f072c: "每一个请求都是宝贵的。再次感谢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_eaylvar_s_voice_getting_cec974: " - ^424242艾尔瓦的声音越来越小，我感到头晕。开始闻到湿粘土的味道……^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_effective_nonetheless_yo_5f844e: "但确实有效。你不知道可以这样用吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_empty_hands_i_think_bulk_d6327e: " - ^424242两手空空，我想起留在心底的那块笨重而温暖的东西。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_enchant_large_boulder_ma_569084: "给一块大石头附魔，让它落到海沟所在的地板上。"
  npc_override_gef_d01_i_quests_illusion_dungeons_end_maya_ba8f4f: "但在最后，玛雅……"
  npc_override_gef_d01_i_quests_illusion_dungeons_enlightened_mage_looks_d_371f9f: "那个^0000CD开悟的魔法师^000000看起来很危险。"
  npc_override_gef_d01_i_quests_illusion_dungeons_enough_d5b216: "还不够！！！^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_enter_garden_awareness_d9f9eb: "进入觉悟花园"
  npc_override_gef_d01_i_quests_illusion_dungeons_erm_how_i_get_hair_20f8be: "呃，怎么才能弄到毛？猎杀玛特吸血蝙蝠吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_erm_you_want_teach_me_6e4fec: "呃，你想教我？"
  npc_override_gef_d01_i_quests_illusion_dungeons_err_then_i_ll_investigat_68c4a0: "呃，那我就得去调查别的东西了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_essence_turtle_so_i_eat_3b5a9e: "精华是乌龟，所以我能吃，但我一个人猎不到，所以这段时间一直在挨饿……"
  npc_override_gef_d01_i_quests_illusion_dungeons_estopped_handing_piece_o_c31cdb: " - ^424242停止递出碎片。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_eternal_life_22bbd2: "永生。"
  npc_override_gef_d01_i_quests_illusion_dungeons_eternal_life_892ed1: "永生……！"
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_i_forget_you_127f39: "即使我忘了你，兄弟……不要走……拜托。"
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_s_my_dream_859922: "即使不是为了我的梦想，隐形斗篷在各种情况下也很有用。"
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_they_try_attack_77b3a4: "即使他们试图攻击我们，我们也比他们人多。"
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_we_t_talk_f5ccd5: "即使不能说话，我也能通过观察人们的生活方式来弄清楚一些事情。"
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_you_busy_please_8a7f34: "即使你很忙，也请抽出一点时间给我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_you_won_t_b15ccd: "即使你不愿意，我们也不会放你走！你的存在本身就违背了祂的意志！"
  npc_override_gef_d01_i_quests_illusion_dungeons_even_their_sap_cannot_co_4e6dc5: "但即使是它们的汁液也无法完全去除血液中的毒素。当我摄入太多毒素的时候……"
  npc_override_gef_d01_i_quests_illusion_dungeons_even_though_bomi_strong_d909bc: "虽然宝美是个坚强的女人，但她的身体在衰竭。看到她一天天消瘦下去，我很痛苦。我给了她永生，但她拒绝了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_even_though_doesn_t_chan_523c12: "即使这改变不了你唤醒死者的事实。"
  npc_override_gef_d01_i_quests_illusion_dungeons_events_take_place_inside_1ade7b: "^ff0000但里面发生的事件并不总是相同的。这个洞穴里的时空是否仍在扭曲？我也会受到影响吗？^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_every_day_i_spend_most_0aa495: "每天，我花费大部分精力来抵挡嗜血的蝙蝠。如果不待在出口附近，我早就被杀死了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_every_time_i_performed_r_111acd: "而且，每当我进行仪式时，我都会做关于怨灵和哀嚎九尾狐的噩梦。"
  npc_override_gef_d01_i_quests_illusion_dungeons_every_time_someone_tries_53270c: "每当有人试图对狐珠进行仪式时，他们都会做噩梦。"
  npc_override_gef_d01_i_quests_illusion_dungeons_everyone_calm_hell_down_ef6aa1: "大家冷静点！"
  npc_override_gef_d01_i_quests_illusion_dungeons_everyone_hush_i_smell_so_f26567: "大家安静。我闻到了什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_everyone_stands_line_day_3109ba: "每个人都排队等上好几天才轮到自己的机会。"
  npc_override_gef_d01_i_quests_illusion_dungeons_everything_place_interes_71205d: "这个地方的一切都很有趣。尤其是那些甜蜜噩梦。它们充满了矛盾。"
  npc_override_gef_d01_i_quests_illusion_dungeons_everything_s_just_same_a_8ce59c: "一切都和你离开时一样，但我想清理这个地方，"
  npc_override_gef_d01_i_quests_illusion_dungeons_everything_you_say_sound_4cfde0: "你说的每件事听起来都让我觉得牵强。"
  npc_override_gef_d01_i_quests_illusion_dungeons_evidence_eradication_meg_2a6ffc: "^FF0000消灭巨石的证据^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_evidence_eradication_meg_c1a80d: "^FF0000消灭巨石的证据^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_evidence_extermination_w_61c5e7: "^FF0000消灭兀坦的证据^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_evil_hurts_1934cd: "恶魔！好痛！"
  npc_override_gef_d01_i_quests_illusion_dungeons_excuse_me_471adf: "打扰一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_excuse_me_i_came_here_0f1c43: "打扰一下。我是代表格里姆神父来的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_explained_everything_mir_2dba48: "== 向米尔科和约兰达解释了所有事。 =="
  npc_override_gef_d01_i_quests_illusion_dungeons_father_grimm_must_gettin_193204: "格里姆神父现在一定很着急了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_father_grimm_put_book_do_598e97: "就这样吧！格里姆神父，放下那本书。我们打吧！"
  npc_override_gef_d01_i_quests_illusion_dungeons_feel_free_tell_me_if_66e285: "如果你改变主意了随时告诉我！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_feels_like_you_re_walkin_e0967f: "感觉就像走在朦胧的……梦里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_feels_same_as_last_time_3c0cd2: "感觉和上次我把鹅卵石扔进巴伊亚海沟时一样……"
  npc_override_gef_d01_i_quests_illusion_dungeons_few_days_ago_as_soon_a45798: "几天前，工作一结束……他就走了……他说他会回来的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_few_days_ago_b6d516: "但几天前……"
  npc_override_gef_d01_i_quests_illusion_dungeons_fight_broken_out_somewhe_f9bcf4: "那边某个地方发生了打斗。你不想去看看吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_fight_no_what_if_people_68ddfc: "打斗？……不。如果教会的人找到了宝美怎么办？"
  npc_override_gef_d01_i_quests_illusion_dungeons_fight_oh_no_we_d_44d11c: "打斗？哦不，我们最好快点！"
  npc_override_gef_d01_i_quests_illusion_dungeons_finally_day_come_when_we_9f3011: "终于，我们重新崛起的日子到来了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_finally_i_got_finally_i_7b190e: "终于^BDBDBD我^000000拿到了^BDBDBD它^000000……终于^BDBDBD我^000000拿到了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_finally_they_all_left_cl_9c38ee: "终于，他们都走了。好险。"
  npc_override_gef_d01_i_quests_illusion_dungeons_finally_you_say_somethin_ec274a: "终于，你说了一句有道理的话。"
  npc_override_gef_d01_i_quests_illusion_dungeons_find_briashen_his_compan_7bc90c: "找到布里亚申和他的同伴们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_fine_arrogant_think_free_801ce2: "……好吧。傲慢也好不傲慢也罢。随便怎么想。反正我不在乎。"
  npc_override_gef_d01_i_quests_illusion_dungeons_fire_1a764e: "火？"
  npc_override_gef_d01_i_quests_illusion_dungeons_first_let_s_what_i_408bcc: "首先，做我能做的事。嗯？你？"
  npc_override_gef_d01_i_quests_illusion_dungeons_first_time_my_long_exist_760b59: "在我漫长的存在中，我第一次真正思考人类，以及是什么造就了他们。他们也有这种帮助他人的冲动，不求回报。"
  npc_override_gef_d01_i_quests_illusion_dungeons_fishing_rod_belongs_my_f_2f6c67: "这根鱼竿属于我三个月前失踪的朋友<FONT COLOR = 4D4DFF><FONT SIZE = 16><B>西罗德</FONT></FONT></B>。我发现了什么！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_fishing_rod_made_sirood_228ce9: "这根鱼竿是西罗德亲手制作的，所以是独一无二的。你可以在这看到手柄上的首字母，S.R.D！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_fishing_rod_submerged_wa_ba2e89: "这根鱼竿……在水中浸泡了三个月，但被发现时还是原样，或者更糟，处于损坏状态。"
  npc_override_gef_d01_i_quests_illusion_dungeons_flaw_hehe_3a6072: "缺陷……呵呵……"
  npc_override_gef_d01_i_quests_illusion_dungeons_follow_strong_leader_rec_2cf774: "跟随一个强大的领袖？最近，我感觉这些家伙的行动有序得令人不安……"
  npc_override_gef_d01_i_quests_illusion_dungeons_follow_you_around_curios_e9a29b: "它会跟着你。好奇害死猫。不要探究不清楚的事。不要回头，也不要在背后议论人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_font_color_e_f_f_542fbb: "<FONT COLOR = E68F8F><FONT SIZE = 16><B>哇！！！！！！</FONT></FONT></B>"
  npc_override_gef_d01_i_quests_illusion_dungeons_font_color_e_f_f_95b5d5: "<FONT COLOR = E68F8F><FONT SIZE = 16><B>啊啊啊啊啊！！！！！！</FONT></FONT></B>"
  npc_override_gef_d01_i_quests_illusion_dungeons_font_color_e_f_f_a6b74b: "<FONT COLOR = E68F8F><FONT SIZE = 16><B>哇啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊！！！！！！</FONT></FONT></B>"
  npc_override_gef_d01_i_quests_illusion_dungeons_force_so_strong_even_we_cea540: "一股强大到连我们都能感受到的力量！瞧！"
  npc_override_gef_d01_i_quests_illusion_dungeons_forget_everything_49e15b: "然后忘掉一切。"
  npc_override_gef_d01_i_quests_illusion_dungeons_forget_no_matter_how_mis_8a088a: "算了吧。不管我多可怜，都不需要你的帮助！"
  npc_override_gef_d01_i_quests_illusion_dungeons_forget_shameful_past_bei_ba7143: "忘记被困在黑暗潮湿的地下那段耻辱的过去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_four_us_sirood_raket_gei_70bfc9: "我们四个——西罗德、拉凯特、盖恩和我经常一起去钓鱼。"
  npc_override_gef_d01_i_quests_illusion_dungeons_foxes_spirits_getting_mo_7f729c: "狐狸精的怨气与日俱增，没人知道原因。"
  npc_override_gef_d01_i_quests_illusion_dungeons_furious_king_froze_cave_2ad5a9: "愤怒的国王冻结了洞穴，并在里面召唤了强大的怪物，这样就没有人再敢入侵他的王国了。可悲的是，不是吗？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_gasp_am_i_going_die_0d0875: "*喘气* 我要死了吗？我？真不敢相信我会死在这样一个地方！"
  npc_override_gef_d01_i_quests_illusion_dungeons_gein_gasps_say_hello_his_5c5dc5: "- 盖恩喘着气向他的两个朋友打招呼。 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_gein_started_talking_aga_4fc8af: "- 盖恩擦了擦眼泪，又开始说话了。 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_get_out_789c66: "然后出去！"
  npc_override_gef_d01_i_quests_illusion_dungeons_get_rid_monsters_munch_m_d7347d: "消灭10只……怪物！嚼，^FF0000嚼嚼^000000……^BDBDBD消灭^000000它们！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_get_some_rest_20fbdd: "休息一下"
  npc_override_gef_d01_i_quests_illusion_dungeons_girl_glanced_toward_back_bd1f30: " - ^424242女孩朝她所站位置的后面瞥了一眼。仔细看，似乎有什么红色的东西漂浮在黑洞前面。我们过去看看吧。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_girl_said_briefly_stoppe_5debef: " - ^424242女孩简单地说完就不再说话了。她看起来很悲伤……^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_give_him_money_too_3969bd: "把这些钱也给他。"
  npc_override_gef_d01_i_quests_illusion_dungeons_give_me_my_treasure_03e986: "^FF0000给我^000000！我的宝藏！"
  npc_override_gef_d01_i_quests_illusion_dungeons_give_me_pieces_8a9b7a: "给我。^0000CD{0}，10块。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_give_me_sec_i_need_284a83: "……给我一点时间。我需要时间理清思路。好久没说话了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_glad_see_you_again_i_cabae3: "很高兴再次见到你。我已经把信息报告给了骑士团，现在我的工作是支持莱芬的研究。"
  npc_override_gef_d01_i_quests_illusion_dungeons_glances_mojo_f12353: "*瞥了莫乔一眼*"
  npc_override_gef_d01_i_quests_illusion_dungeons_gloss_related_what_you_s_9f4ab4: "这个光泽和你说的话有关吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_all_way_left_you_7e5226: "一直往左走，你就能找到他。"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_ashore_0bcd8d: "上岸"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_alberta_d96417: "回到艾尔贝塔。"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_s_dangerous_e45f02: "回去。很危险……"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_s_dangerous_here_8e8d05: "回去。这里很危险。"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_scholar_who_blue_53c0de: "和^0000CD一位蓝发学者^000000一起回去。你认识他吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_stranger_never_b_a3722b: "回去吧，陌生人。别再回来了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_you_belong_here_4e8dda: "回去。你不属于这里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_you_should_here_49e1dd: "回去。……你不该在这里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_get_done_f3c69d: "去办完吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_go_get_my_treasure_3ba53a: "去，^BDBDBD去^000000拿来！我的^BDBDBD宝藏^000000！你可以从他们那里拿走！我的^BDBDBD宝藏^000000！"
  npc_override_gef_d01_i_quests_illusion_dungeons_go_hospital_440d35: "去医院！"
  npc_override_gef_d01_i_quests_illusion_dungeons_god_bless_you_0c7c05: "愿上帝保佑你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_going_back_f0d7bf: "……不回去了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_good_4d82cf: "这可不太好。"
  npc_override_gef_d01_i_quests_illusion_dungeons_good_bdc919: "好。"
  npc_override_gef_d01_i_quests_illusion_dungeons_good_i_don_t_know_0bff95: "好。我不知道他的名字和他在哪里，但我能猜到。"
  npc_override_gef_d01_i_quests_illusion_dungeons_good_job_2dc47c: "干得好。"
  npc_override_gef_d01_i_quests_illusion_dungeons_good_job_6222cc: "干得好！"
  npc_override_gef_d01_i_quests_illusion_dungeons_good_luck_703764: "祝你好运。"
  npc_override_gef_d01_i_quests_illusion_dungeons_good_luck_investigating_e9a88c: "祝你和忠海调查顺利！"
  npc_override_gef_d01_i_quests_illusion_dungeons_good_night_s_sleep_come_e3caf3: "好好睡一觉，天亮后再回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_gosh_you_re_so_stubborn_995d19: "天哪，你真固执。喂他吧。我来抵挡它们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_got_a049d0: "……明白了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_got_buried_them_no_wonde_5f9950: "然后和它们一起被埋葬了。难怪它们这么愤怒。"
  npc_override_gef_d01_i_quests_illusion_dungeons_got_i_thinking_now_i_9c0a90: "明白了。我在想，既然我来了，不如趁现在帮帮你。我很高兴我能做到。我会回来的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_grr_let_me_go_enough_af9ee4: "呃，放我走！够了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_grr_why_you_so_evil_7af70e: "呃，你为什么这么邪恶？"
  npc_override_gef_d01_i_quests_illusion_dungeons_guy_front_already_ran_aw_834449: "前面那个家伙已经跑了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_guy_i_finally_found_him_3298a3: " - ^424242那个家伙……？我终于找到他了。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_ha_chief_183ecf: "哈……但是酋长……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ha_ha_ha_did_something_d65287: "哈哈哈……发生什么事了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_ha_ha_ha_ha_ha_f54675: "哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈……啊，欢迎你，冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ha_ha_look_9d33c4: "哈哈……看！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ha_ha_uh_my_treasure_635142: "哈……哈^BDBDBD呃^000000，我的^BDBDBD宝藏^000000……我的宝藏……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ha_haha_hahahaha_hahahah_87e4d0: "哈……哈哈……哈哈^BDBDBD哈^000000哈……哈哈^BDBDBD哈^000000哈哈哈……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ha_s_just_my_delusion_1cc923: "哈……只是我的妄想罢了。今天特别想念那个孩子。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hah_hah_now_there_s_00b777: "哈哈，现在只剩一件事可以尝试了。那就是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_haha_don_t_worry_too_e907a5: "哈哈，别太担心。那个梦还没发生呢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_haha_why_did_only_get_0a3bfd: "哈哈……为什么这个现在才被发现？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_haha_why_did_only_get_216bc0: "哈哈……为什么这个现在才被发现？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_hahaha_asudem_no_honey_d_8ea74a: "哈哈哈阿苏德姆……别这样嘛。你不相信我的技术吗？这次我和往常一样钓到了很多。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hahaha_nice_meet_you_i_d70c50: "哈哈哈很高兴见到你。不知道你有没有注意到，我的兄弟姐妹是三胞胎。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hahaha_s_only_one_day_9e65ff: "哈哈哈，只是一天而已。有什么大不了的？嗯？！"
  npc_override_gef_d01_i_quests_illusion_dungeons_happened_half_day_ago_7a4f71: "那是^FF0000半天前^000000发生的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_happy_hunting_adventurer_67ddeb: "狩猎愉快，冒险者！"
  npc_override_gef_d01_i_quests_illusion_dungeons_hard_communicate_a4acd8: " - ^424242很难沟通……^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_hay_3089d0: "喂！"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_came_back_serious_inj_d442b6: "他前几天带着重伤回来了，他的同事还在那里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_could_just_another_ch_d818cf: "他可能只是噩梦中的另一个角色。"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_could_sent_your_frien_dcc4db: "他可能是你朋友派来的。人类，回答我！"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_couldn_t_sleep_well_5aab89: "他的咳嗽太严重了，睡不好觉。"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_go_hospital_today_won_016410: "他今天得去医院，钱会不够用。"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_hasn_t_come_back_437ff1: "他还没回来……咳……还没。"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_helped_me_expected_no_2a4f24: "他帮了我，不求回报。这种随机的善意是人类的特质，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_i_checking_place_when_080359: "我和他正在检查这个地方时，我们发现了一些荧光蘑菇。乔乔兄弟的眼睛一亮，然后……"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_just_came_back_huntin_fdff09: "他刚打猎回来。你应该让他休息，至少今天剩下的时间让他歇一歇。"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_mean_me_first_he_0032b0: "是他先对我凶的！而且他说他很忙。所以我才说走吧。走！"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_pretty_formidable_i_w_9036b8: "他相当厉害。我不建议^0000FF单独和他打。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_really_looked_pitiful_b18ed6: "但他看起来真的很可怜！"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_s_fully_recovered_he_b2021e: "他已经完全恢复了，但他还是不愿意离开。我不知道他为什么对那个转化的人类这么着迷。"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_s_worried_you_haven_b223fd: "他担心你还没出来。他让我在你需要的时候帮你。发生什么事了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_said_he_wanted_help_e69492: "他说他想帮你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_said_he_wanted_unders_7a7f85: "他说他想理解人类，这样才能更好地理解她。我觉得他已经实现了他的目标。"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_seems_ok_ok_just_2aea1c: " - ^424242他看起来还好。……还好？别管他了。天亮后再回来吧。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_shows_big_interest_he_a49832: "他表现出极大的兴趣。^0000CD他说那是用只生活在龟岛上的龟壳制成的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_touched_one_mushrooms_ec52a3: "他碰了一个蘑菇，然后它就爆炸了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_training_become_stron_1ce8b4: "他……训练是为了变得更强……就算他不能变得更强……他也已经够了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_very_fidgety_fishing_da6c36: "- 他手里拿着鱼竿时非常坐立不安。看起来不像是来钓鱼的。 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_he_wears_glasses_blue_sh_7b6ab9: "^0000CD他戴着眼镜^000000，蓝色的短发。^0000CD他的脸一看就是个学者^000000，你应该能认出来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hee_hee_hee_ah_hello_cad3dd: "嘿……嘿……嘿……啊……你好。"
  npc_override_gef_d01_i_quests_illusion_dungeons_heh_heh_hello_adventurer_4d5a20: "嘿嘿……你好冒险者，嘿嘿……我累得动不了了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_heh_heh_s_so_hard_b72049: "嘿嘿……用尽全力真难啊……"
  npc_override_gef_d01_i_quests_illusion_dungeons_hehehe_i_hope_day_come_14b4a1: "呵呵呵我希望那一天快点到来……"
  npc_override_gef_d01_i_quests_illusion_dungeons_hehehe_other_times_i_d_d7d53f: "呵呵呵换作其他时候我会说这很疯狂，但如果我们跟随着一个强大的领袖……"
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_9b56d5: "你好。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_adventurer_b3fe79: "你好，冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_adventurer_how_you_85e383: "你好，冒险者。你怎么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_c8783d: "你好！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_looks_like_you_ve_e19ed1: "你好，看来你在这里待了一段时间了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_my_name_soup_frien_bbb8c8: "你好，我叫苏普，是失踪的西罗德的朋友。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_research_going_wel_9dd4dc: "你好，研究进展顺利。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_you_like_go_upstai_913f02: "你好，你想再上楼去吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_help_c47ae1: "帮忙"
  npc_override_gef_d01_i_quests_illusion_dungeons_help_him_c46923: "帮他"
  npc_override_gef_d01_i_quests_illusion_dungeons_help_me_really_you_won_85b4e1: "……帮我？真的？你不会让我死？"
  npc_override_gef_d01_i_quests_illusion_dungeons_helping_who_me_monster_d_d5459c: "帮谁？对我来说，那个怪物看起来不需要帮助！"
  npc_override_gef_d01_i_quests_illusion_dungeons_her_safety_more_importan_2d9068: "她的安全比什么都重要。"
  npc_override_gef_d01_i_quests_illusion_dungeons_here_i_brought_things_yo_e4912d: "给，我带来了你要的东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_here_i_give_you_t_e7984f: "给，我把这个给你。不过不能吃……"
  npc_override_gef_d01_i_quests_illusion_dungeons_here_only_one_piece_i_f8b726: "我现在只有这一块。"
  npc_override_gef_d01_i_quests_illusion_dungeons_here_sign_promise_profes_605e98: "还有，这是承诺的信物。教授和兄弟。我很高兴你来了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_here_there_truths_we_can_513586: "在这里，有我们在其他地方找不到的真相。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_5a8841: "嘿。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_c812b3: "嘿！"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_could_you_take_look_da956d: "嘿，你能看一下这个吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_don_t_just_stand_6dddce: "嘿……别光站着，帮我……"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_hey_hey_asudem_honey_3aeaf9: "嘿，嘿，嘿，阿苏德姆……亲爱的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_i_m_one_them_1d0636: "嘿，我是他们中的一员，我不会让你这样说我前辈的坏话！"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_most_people_don_t_79196d: "嘿，大多数人听到你那样解释都不明白！"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_stranger_look_me_sec_9b27c2: "嘿陌生人，看我一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_there_don_t_cut_9fa042: "嘿！！！别插队！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_what_if_i_tell_3fc711: "嘿，如果我这样告诉你呢！而且那不是我的研究，是你的！"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_why_you_carrying_so_9e8353: "嘿，你怎么带了这么多？先把你的包清空吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_you_monk_over_there_39063d: "嘿，那边的修士。你觉得是什么让你成为人类？你觉得是什么让吸血鬼成为吸血鬼？如果有一个吸血鬼一生从未伤害过任何人呢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_you_really_should_ge_ef795e: "嘿，你真的该休息一下了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_hi_i_heard_every_story_edd3c5: "你好{0}。我从莱芬那里听说了所有的故事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_his_god_loves_us_all_494180: "他的旨意？上帝爱我们所有人。这不是你们宣扬的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_his_name_font_color_d_9702ad: "他的名字是<FONT COLOR = 4D4DFF><FONT SIZE = 16><B>杰里蒙</FONT></FONT></B>，一位海洋科学家。我见过我父亲几次。我知道你在普隆特拉的东图书馆。"
  npc_override_gef_d01_i_quests_illusion_dungeons_his_name_khahris_he_look_10564f: "他的名字是卡赫里斯……他长得和我很像"
  npc_override_gef_d01_i_quests_illusion_dungeons_his_real_name_what_his_72508e: "他的真名是？他叫什么名字来着？？克图拉什么的。有人曾经告诉我，那条蜥蜴是被拉赫尔的祭司长们雇来看守一个被封印在这个洞穴里的男孩的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hm_you_re_adventurer_22b9f9: "嗯？你是冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hmm_9c4d28: "嗯……"
  npc_override_gef_d01_i_quests_illusion_dungeons_hmm_seems_subtle_glow_se_c9bdbf: "嗯……而且它似乎有微弱的光芒……这根钓鱼竿好像是镀过的？"
  npc_override_gef_d01_i_quests_illusion_dungeons_hmpf_alright_if_you_ever_336e38: "哼，好吧，但如果你同情我的话，就回来帮我。答应我？"
  npc_override_gef_d01_i_quests_illusion_dungeons_hold_my_hand_when_i_b43c8a: "我发信号的时候握住我的手！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_honest_though_did_you_re_ecd245: "老实说，你真的努力学习了吗？你有没有每节课都去上，整夜学习，刻苦练习？你最好说实话。"
  npc_override_gef_d01_i_quests_illusion_dungeons_honey_let_s_go_i_185861: "亲爱的，我们走吧，我想今天的约会结束了。嘿，我们去办点事吧~我们离开这里……"
  npc_override_gef_d01_i_quests_illusion_dungeons_honey_who_s_there_f1cd3f: "亲爱的？是谁在那里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_hooray_hooray_c1a933: "万岁！！！万岁！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_hope_you_two_safe_eed5e7: "希望你们两个平安无事……"
  npc_override_gef_d01_i_quests_illusion_dungeons_hopeless_desperate_poiso_83b599: "绝望、无助，还有毒。"
  npc_override_gef_d01_i_quests_illusion_dungeons_horrible_nightmare_d68019: "这场可怕的噩梦……"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_about_i_go_e03745: "我去怎么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_about_two_us_stay_bfd2c9: "我们两个留下来一个去怎么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_am_i_defaming_them_026989: "我只是说实话，怎么算诽谤他们呢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_dead_reanimated_what_665425: "死者是如何复活的？什么样的生命力让它们继续活动？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_did_you_70cd05: "……你是怎么……？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_did_you_come_back_2734e7: "你怎么活着回来的，真可惜……幸好那里的蚂蚁似乎没有过来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_did_you_sustain_your_155d36: "你到目前为止是怎么维持生计的？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_difficult_bring_you_676235: "怎么样？把你带出来很困难吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_fbe0d0: "……怎么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_i_help_you_13e773: "我怎么帮你？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_i_know_5824c2: "我怎么会知道"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_i_let_you_out_ef7fa1: "- 我怎么放你出去？-"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_i_sure_you_ask_d5321d: "你怎么知道我不确定，你问？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_s_mojo_doing_heh_eafca3: "莫乔怎么样了？嘿，她太好奇了，我为要应付她的格里姆兄弟感到难过。"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_s_mushroom_61d4dc: "蘑菇怎么样了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_things_going_16f205: "{0}、{1}和{2}的情况怎么样了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_we_going_use_their_5cf27f: "我们要怎么利用它们的冷能量呢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_worth_living_here_ad7c39: "怎么样？住在这里值得吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_you_303189: "你怎么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_you_know_e0049d: "你怎么知道的？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_you_like_isn_t_396656: "你觉得怎么样？这里是不是也很有魅力？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_you_make_artificial_c9d60a: "你怎么制作人造血液的？"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_you_you_weird_2dec0c: "你怎么样？你怪不怪？"
  npc_override_gef_d01_i_quests_illusion_dungeons_however_after_meeting_vi_490e08: "然而，在遭遇一场猛烈的风暴后，我来到了一个龟岛，但它似乎不是普通的龟岛。"
  npc_override_gef_d01_i_quests_illusion_dungeons_however_there_empty_door_14f9aa: "然而，在那边，那个空门……可能有什么东西，你也许知道。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hu_huh_s_just_gone_e928d5: "嗯？哈？它就这么消失了。{0}。"
  npc_override_gef_d01_i_quests_illusion_dungeons_huge_whirlpool_created_f_d25dcb: "- 杰里蒙面前出现了一个巨大的漩涡！-"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_brother_over_there_i_945131: "嗯？哥哥，那边……我以前见过他。"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_coughing_young_man_e_39acb2: "嗯？艾因布洛克的那个咳嗽的年轻人让你来找我的？"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_e3e4fb: "嗯……！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_i_talking_about_cave_a613e8: "嗯？我说的是后面的那个洞穴。"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_no_i_ve_never_154f4b: "嗯？不，我从没听说过。"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_s_i_d_love_23b865: "嗯？但是那个……我很想看看。"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_s_you_again_don_3222b3: "嗯？！又是你？你不觉得我们见面太频繁了吗？前几天有人正在说……"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_we_didn_t_say_26ef92: "嗯？我们没说什么关于鬼魂的事。还是说我们说过了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_what_should_i_as_f02ae5: "嗯……我该怎么办……按照卢安达的建议，我们必须逃到这个……"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_what_you_mean_i_463e39: "嗯？你什么意思？我会再回来的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_what_you_talking_abo_8ab28e: "嗯？你在说什么，我是冒险者卡赫里斯。我以前告诉过你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_why_am_i_telling_c288f2: "嗯？我为什么要告诉你这个？"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_you_haven_t_seen_543640: "嗯？你没看见吗？你是不是旅行太入迷了？啧啧，你真不走运……"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_you_re_stranger_luan_b29a64: "嗯？！你就是卢安达在出去打猎的路上感兴趣的那个陌生人？"
  npc_override_gef_d01_i_quests_illusion_dungeons_hum_91cccd: "哼……"
  npc_override_gef_d01_i_quests_illusion_dungeons_human_curiosity_unavoida_13a9a9: "人类的好奇心是不可避免的。我也是。"
  npc_override_gef_d01_i_quests_illusion_dungeons_human_did_you_just_call_233470: "人类，你刚才叫我蝙蝠？你怎么敢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_human_huuuman_there_no_s_db37bc: "^BDBDBDA^000000人类？一个^BDBDBD呼呜^000000人类？^BDBDBD不可能有那种东西^000000!!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_hungry_i_m_so_hungry_a50b37: "饿了。我饿得动不了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_hunt_garden_perception_756268: "从感知花园狩猎{0}和{1}"
  npc_override_gef_d01_i_quests_illusion_dungeons_hunt_garden_perception_d46c24: "从感知花园狩猎{0}"
  npc_override_gef_d01_i_quests_illusion_dungeons_hunt_monsters_garden_per_bb4873: "从感知花园狩猎怪物"
  npc_override_gef_d01_i_quests_illusion_dungeons_hurts_enough_scream_56e594: "==痛得足以尖叫！=="
  npc_override_gef_d01_i_quests_illusion_dungeons_huu_without_aylvar_i_die_6881ae: "呼……没有艾尔瓦和{0}，我早就死了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_hypothesis_44f047: "这是一个假设。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_agree_sister_gem_also_f33a1d: "我同意吉恩修女的看法。而且，能这么近距离看到吸血鬼也不是常有的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_agree_these_bats_disgr_aa0344: "我同意，这些蝙蝠是可耻、无耻、令人厌恶的动物。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_alarmed_when_you_sudde_aff124: "你突然消失的时候，我吓了一跳。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_all_twigs_i_need_c3f9f6: "我需要的所有树枝都齐了。我应该回到泽斯和西罗德那里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_almost_got_trouble_30f85f: "我差点惹上麻烦……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_already_know_fire_won_fd5f8e: "^ff0000我已经知道火没用，但我还是会顺着他们的要求做。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_am_alberta_guard_st_d33e0d: "我是第一骑士团阿尔伯塔卫士队的骑士艾尔瓦。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_am_here_find_him_d1c4e9: "我是来找他的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_am_khahris_d6afbe: "我是卡赫里斯。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_am_sorry_you_already_2fea4c: "对不起，{0}。你已经有太多东西了。我想现在很难找到我的朋友。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_am_worried_because_he_30aa0d: "我很担心，因为他又去了那里。他说发现那个地方的秘密后就回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_apologize_deep_down_i_aa7c44: "我道歉。内心深处，我觉得冒险者跟我说话很烦人。现在，我会先问你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_asked_you_come_back_3745d8: "我让你回来的……但你今天必须离开。在这里再待下去很危险。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ate_everything_sorry_s_a9b4fa: "我把所有东西都吃了。对不起。那是我唯一能给你的东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_barely_made_entrance_w_1a50c2: "我勉强到了入口处，但当我试图离开时，他就会出现，而且我已经在这里躲了好几天了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_became_wizard_because_ac811f: "我成为巫师是因为我觉得魔法可以弥补我身体的虚弱。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_beg_you_don_t_6d5d31: "我求你了，别让我再做那种事了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_came_back_here_look_a9514b: "我回到这里找他……但他被玛雅袭击了，然后被带走了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_came_here_again_well_e9eaf9: "我又来了。嗯，每天都来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_checked_mound_dirt_loo_8fb87c: "我检查了那堆泥土，找树枝。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_come_back_again_i_d6221f: " - ^424242我会再回来的。我双手合十放在胸前。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_come_back_research_you_2c8fd2: "我会回来的。为了研究，也为了你，纳林。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_completed_my_guild_s_ac9f77: "我完成了公会的官方巫师培训。我强到可以和你比试！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_cough_must_go_myself_94fc3a: "我……咳咳……必须自己去……咳咳……咳……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_couldn_t_believe_he_899c22: "我不敢相信他把我变成了怪物。我信任他！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_couldn_t_get_damn_1aa835: "我无法得到^BDBDBD它^000000……该死的^BDBDBD怪^000000……怪物……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_couldn_t_get_over_34906f: "我无法接受自己变成了怪物，但现在我明白了。我可能不再是人类了，但我还是我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_couldn_t_sleep_eat_59d1f1: "^FF0000我好几天^000000吃不下睡不着。我一直在四处徘徊。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_d9b4ac: "我……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_d_learned_about_them_e802af: "我通过波米了解到了他们。我学到的东西毫无意义，而且我真的不太理解。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_d_like_save_myself_75d045: "我想自己救它，但你也看到了，我很虚弱，可恶。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_danger_someone_helped_a52624: "我当时很危险，但有人帮助了我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_debating_if_i_should_ee166e: "我在犹豫是否要追他们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_did_my_best_bf0eac: "我尽力了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_did_what_i_did_4cd39a: "我所做的一切都是为了救她，我理解她为此怨恨我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_even_time_c229a5: "我甚至没时间看那个！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_know_i_df8d05: "我不知道我有这方面的天赋。如果我有^0000cd足够的时间活下去^000000，我会有很多不同的经历。我可能会选择一条不同的道路。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_know_there_742748: "我不知道我们中间有个有抱负的小偷。哈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_know_you_2699ee: "你身为人类时我不认识你，但我觉得你和现在的你没什么不同。你仍然在努力保护对你重要的东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_mean_about_a64fe2: " - ^424242我不是那个意思，但还是走吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_mean_nosy_5ca99c: "我不是想多管闲事。我必须知道它是谁的，这样我才能？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_realize_strong_dd86ee: "但我没意识到坚强的意志来自强壮的身体……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_tell_you_099e5e: "……我跟你讲这么长的故事不是为了听那个……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_understand_why_6f5b57: "我不明白为什么吸血鬼会帮助人类，但现在我知道了。德古拉从波米那里学到了如何变得更有人性。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_even_know_0fe2d4: "我甚至不知道该怎么感谢你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_acedd2: "我不知道。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_how_053889: "我不知道它是如何与现实相连的，"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_how_c75337: "我不知道它们是如何变成现实的。我怀疑任何人都不知道，真的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_i_ee3d4a: "我不知道。我不知道你从哪里来，我怎么会知道？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_if_5bce2f: "我不知道它们有什么目的，但它们看起来确实美丽而神秘。也许这个地方外面的人能认出它的价值。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_if_7b9a1d: "我不知道能不能再拔出来……不，如果一开始就是这样，我就不会求你了，冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_why_1f85a6: "我不知道你为什么觉得他看起来很可怜，但那不重要。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_why_ab7494: "我不知道为什么我无法呼吸，也不知道为什么我不吃东西也不会饿。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_live_alone_11f795: "我不是一个人住在村子里，如果有人看到了，肯定会传开，但第一次听到就能让我确定。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_need_alone_29a9a6: "我不需要……孤独……？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_remember_b3ff47: "我不记得了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_think_s_0eaf34: "我不认为那是我的名字。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_think_s_1b9eb8: "但是……我也不认为那是卡赫里斯。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_think_you_dc1d1a: "我觉得你什么都没说"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_think_you_f946f7: "==我觉得你没说谎。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_understand_her_8647ff: "我不明白她的逻辑。她怎么可能宁愿作为人类死去，也不愿作为吸血鬼活着？她怎么会认为永生的礼物是一种背叛？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_want_frozen_3592f7: "我不想再被冻住了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_want_hope_51e192: "但我不想要希望。如果你抱有希望……你可能会被背叛。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_want_worry_2d9c1e: "我不想再担心了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_draw_what_i_see_8bb435: "我画我在梦中看到的东西，但是……我看到的东西真的会发生吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_drink_fake_blood_i_e053fa: "我喝我用能找到的原料制作的假血。我可能看起来^0000cd足够像人类^000000，但我不是。不是真的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_e38e9f: "我愿意。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_eat_anything_front_me_072ecc: "我可以吃掉面前的一切。从头到脚……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_eat_anything_really_an_80a1d9: "^FF0000我什么都能吃。真的什么都能吃。我可以吃……咔嚓咔嚓。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_empty_bottle_oh_i_507138: "我有一个空瓶子？哦，我忘了我被袭击时弄丢了背包。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_everything_i_need_toda_9ecc26: "我今天调查需要的东西都有了，谢谢！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_explain_5b5bb7: "我可以解释。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_fainted_middle_learnin_c46e98: "我学习新法术的时候又晕倒了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_as_if_i_7b5656: "我感觉仿佛穿越了时空，在这昏暗的灯光下学习。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_dazed_as_if_916545: "^ff0000我感到眩晕，仿佛在梦中。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_good_energy_t_3e0378: "我能感受到无法触摸的美好能量。这就是为什么我感到更加痛苦。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_like_i_written_fde2f2: "我觉得我写出了《失败阿修罗王国》。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_resentful_myself_b695cc: "我为自己无法帮助村庄防御而感到愤恨。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_serious_anguish_p_c46621: "- 从这个人的身上感受到了严重的痛苦。等我升到140级后再来吧。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_strange_9fc0f4: " - ^424242我感觉很奇怪……^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_weird_nothing_her_2a2eec: " - ^424242我感觉很奇怪，但这里什么都没有……^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_felt_way_614fb5: "我也有那种感觉。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_flick_my_finger_you_5c5da7: "如果你想的话，我可以弹你一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_found_again_while_wait_8d0068: "我在等冒险者的时候又找到了这个。请收下！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_given_shorter_time_liv_c27996: "我被赋予了比大多数人更短的寿命。从出生起，我就被告知我永远不会比父母活得更久。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_go_back_56cc1c: "我必须回去……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_go_back_ruined_village_b80224: "我可以回到那个被毁的村庄。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_go_back_send_him_88528c: "我必须回去送他去医院，但是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_got_betrayed_my_best_22ad85: "我被我最好的朋友背叛了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_got_roughly_945808: "我大概了解了"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_grabbed_piece_handed_o_773020: " - ^424242我接过骑士递来的碎片。龟甲上刻着一片小叶子。它是一块笨重的碎片，但不知何故感觉很温暖。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_gravely_injured_them_s_7279c8: "我被它们严重伤害，不知怎的，我最终来到了这个充满死亡和神秘能量地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_guess_i_leave_now_b5857b: "我想我现在得走了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_guess_i_ll_b14086: "但我想我必须这样做。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_guess_i_ll_stay_3136c1: "我想我只能留在这里观察情况。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_guess_i_ll_staying_0d6b77: "我想我会一直待在这里，直到找到所有的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_guess_so_eb667a: "我想是吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_had_hunch_same_kind_4444c6: "我有一种预感，那是我被卷入的同类漩涡。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hate_being_hot_fire_f8e7c3: "但我讨厌热，而且火可能会把我们烧死。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_haven_t_had_meal_78db53: "我今天没吃东西。我昨天饿了一整天。我的孩子也在挨饿。我的丈夫也在挨饿。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_haven_t_had_meal_80d3ae: "我今天、昨天、前天都没吃东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_haven_t_seen_any_e8b09a: "我在附近没有见过其他人，但如果见到的话，我会告诉他你在找他。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hear_you_give_up_add699: "我能听到你。放弃你对它的执念吧。那对你来说是最好的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_briaschen_did_an_e7efc7: "我听说布里亚申那样做了。我和卡赫里斯在一起的时候，蚂蚁没有攻击我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_only_master_luan_31a3f1: "我听说这次只有卢安达大师和毛大师在忙？你躺在树上只是大喊……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_scream_when_man_6f28ed: "前面那个男人刚进去的时候，我听到了一声尖叫。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_something_36fcee: " - ^424242我听到什么声音了。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_stern_faced_seco_8ab0e4: "我听说那个严肃的二哥警告过你，但你真是个无畏的外来者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_there_many_dange_b75060: "我听说下层有很多危险的深海生物，但来到这里后，发现它们比我想象的还要危险。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_they_named_after_ca5467: "我听说它们是以村庄的守护者命名的。我为此感到相当自豪。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_you_look_just_26d47f: "我听说你长得和我很像？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_here_until_i_find_7e9794: "我会一直在这里，直到找到所有的秘密。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_brother_jubilee_b_c8458f: "希望朱比利兄弟和乔乔兄弟平安无事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_everything_okay_d0c9eb: "希望一切都能好起来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_nothing_bad_happe_4dae97: "希望那两个人不会有坏事发生。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_sirood_appear_fro_3036ed: "希望西罗德能完好无损地出现在我们面前，就像那根钓鱼竿完好无损地出现一样……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_soldier_find_her_331a18: "希望那个士兵能在她深入被毁的村庄之前找到她。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_we_find_answer_fc1f70: "希望我们能找到这种现象的答案。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_we_ll_meet_3a1f9d: "希望我们能再见面。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_you_ll_find_55139a: "希望你能尽快找到他。你知道，我不是这里唯一的人。如果你还没找到他，也许他？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_you_ll_find_6dacf7: "希望你能尽快找到你的朋友。为什么不去南边的地下墓穴看看呢？他可能在那里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hospital_shop_now_95aa66: "我现在有医院或商店吗？！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hugged_vrid_as_he_f74cac: "^ff0000我按照他的要求拥抱了弗里德。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_i_able_stay_alone_ccf553: "我、我之所以能够一直独处，是因为我终有一天能再次见到你们两个？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_i_don_t_know_a96616: "……我、我不知道具体原因……只是可能是那样吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_i_e75067: "……我……我……！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_i_m_glad_cd39db: "我……我很……高兴……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_joking_i_m_middle_f2b034: "我在开玩笑。我正在收集假血原料，但现在我想检查这个蘑菇。我以前从没见过。我想趁它还新鲜的时候检查一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_just_i_guess_what_6cbaa4: "我只是……我想里面的东西对我来说已经很无聊了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_knew_coming_i_d_cbcfbd: "我知道进来后最好待在忠海身边。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_knew_idiotic_idea_i_0f44f7: "我就知道那是个愚蠢的主意！我不该听你那些愚蠢的故事！我不该跟着你进这个洞穴！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_know_s_because_me_986cd8: "我知道。不是因为我和我的兄弟们……但是……那天……我们…………真是太遗憾了"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_know_they_re_dreamt_32289a: "我知道它们是^0000FF月光花梦境的产物。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_learned_about_catacomb_7bf03a: "我在图书馆阅读关于塔的历史时，了解到了吉芬塔下面的地下墓穴。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_lit_dry_twigs_placed_3d6619: "^ff0000我点燃了干树枝并把它们放在他周围。已经过去一段时间了，但冰似乎没有融化的迹象。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_05a7aa: "我会去做的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_appreciate_if_you_6b2a3e: "如果你能照顾他们，我会很感激的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_call_junghee_we_71bfea: "我会叫正熙，我们随后跟上你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_catch_up_soon_010300: "我很快就到。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_doing_research_whil_52d765: "我会继续这项研究一段时间。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_figure_out_636803: "我得弄清楚。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_get_back_you_6dfeab: "如果需要帮助我会回来找你的。谢谢！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_get_point_e556d2: "我直说吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_get_rid_them_ba71c4: "我会除掉他们的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_leave_angry_soldier_aba970: "我把^0000FF愤怒的士兵^000000留给你了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_let_justice_decide_f4a54c: "我会让正义决定他们的命运。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_make_sure_no_86e675: "我会确保没有村民靠近现实与梦境崩塌的墙壁。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_need_some_form_ce2d8c: "但我需要某种形式的保护。我要带上正熙。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_staying_here_while_936b7e: "我会在这里待一段时间，所以如果你改变主意请告诉我！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_take_as_compliment_efcda4: "我就当你是在夸奖我了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_talk_elders_d20840: "我会和长老们谈谈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_talk_you_again_13f0d5: "我过一会儿再跟你谈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_tell_jerrymon_about_fadc0d: "我会通过我父亲提前告诉杰里蒙有关内容！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_waiting_you_here_d7e9bd: "我会在这里等你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_look_like_human_ea6344: "我看起来像^0000cd人类^000000吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_looking_piece_while_su_555476: " - ^424242我看了碎片好一会儿，但突然有什么东西似乎出现在我的脑海中。突然一阵风吹来，我的视线变得更暗了。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_lost_her_i_lost_9f06e5: "我失去了她。我失去了她。我的宝贝。我漂亮的宝贝。你在哪里？我的宝贝。她叫什么名字？我的女儿。女儿？我的宝贝。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_8e34f3: "我不是吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_about_give_up_0b0b26: "但我不会放弃的！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_always_correct_i_ae19dd: "我并不总是正确的，但我可以预见未来。啊！我还有更多的能力。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_away_right_now_f9a6cd: "我现在不在。请在黎明后回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_bad_mood_0a0769: " - ^424242我心情不好……^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_carrying_too_many_468846: "我携带的物品种类太多了。我应该先减轻背包的负担。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_convinced_mage_respo_f8d134: "我确信那个法师对这些猖獗的噩梦负有责任。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_especially_tired_tod_f0257b: "我今天特别累。今晚我要早点睡觉。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_exhausted_don_t_8dc389: "我筋疲力尽了，没有一些工具来做出合理的推断。最好准备好再回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_fine_guesses_everyon_241e88: "我猜也可以。每个人的体型都不一样。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_fine_now_a806d9: "我现在没事了"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_glad_they_only_2b71c6: "我很高兴它们只长在这里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_glad_we_ve_f0c6d8: "很高兴我们遇到了你，"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_glad_you_came_76af5e: "很高兴你安全回来了。里面的所有人都好吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_glad_you_didn_470498: "很高兴你没死。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_cross_ah_185951: "我要穿过去~~啊！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_die_please_02443e: "我要死了。请帮帮我……求你了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_die_starve_babeb2: "我要死了。要饿死了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_die_starving_68f6a6: "我要死了。饿死了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_die_we_d5f775: "我要死了。我们都要死了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_go_there_7a8766: "我不会再去那里了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_let_you_2677e4: "我不会让你那么做的！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_stay_ca72b8: "我要留下来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_stay_here_392655: "我要在这里待一段时间。德古拉完全恢复能量还需要一段时间，而且就我个人而言，我想了解这些人还有很多事情。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_stay_ruined_afce18: "我要留在被毁的村庄里调查这一现象。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_there_you_51e840: "我要去那里，你想跟我一起去吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_watch_you_9a01f8: "我会看着你的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_guessing_reason_why_b66acc: "我猜测这就是怪物攻击村庄的原因，但我必须告诉村长并调查一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_happy_arrangement_dr_9e8f01: "我对这个安排不满意，德拉克。等你好点了，我就回我们的城堡，知道吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hearing_anything_946821: "我什么都没听到！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_help_me_c68548: "我饿了。帮帮我。我太饿了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_help_me_dd9a7f: "我饿了。帮帮我。求你了。饿。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_hungry_i_2783eb: "我饿了……饿。我要死了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_i_m_eb1a1d: "我饿了。我快饿死了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_i_ve_49aa15: "我饿了。我已经饿了很久了……我要死了。求求你了，帮帮我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_want_more_55badf: "我饿了。想要更多。好吃。太美味了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hurry_right_now_059163: "我现在很急！卡赫里斯可能有危险。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hurt_641217: "我没受伤！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_mentally_strong_enou_acb1fc: "我的精神不够强大，无法承受这样的噩梦。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_mirko_s_yolanda_d82f54: "我是米尔科，那是约兰达"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_my_name_bomi_39efae: "我是……我的名字是^0000cd波米^000000。对不起，我不是你要找的人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_numskull_i_wouldn_e097fb: "我不是傻瓜。如果我是，我就不会成为巫师了。别忘了，是我救了德古拉！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_ok_now_let_426e56: "我现在好了！我们走吧！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_one_them_i_bd90b0: "我是其中之一，而且碰巧在你找到我们之前，我捡到了一本^0000cd笔记本^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_only_one_brought_72d26c: "……我不是唯一一个被带到这里的人，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_out_my_mind_0eccaa: "我疯了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_rwella_a5bc91: "我是鲁维拉"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_saying_once_so_d50e18: "我只说一次，所以仔细听好。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sensing_really_bad_f8cc5d: "我从这些狐狸和鬼魂身上感受到了非常糟糕的预感。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_seriously_hurt_69009a: "我伤得很重……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_so_glad_11ea11: "我很高兴……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_so_surprised_shocked_1003b9: "我现在非常惊讶和震惊，不知道该做什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_bother_you_56be16: "对不起打扰你了，但是拜托。我会在这里等你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_could_you_36c0a1: "对不起，你能从这个洞穴里的干土堆中找一些干树枝吗？我们不需要超过10根。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_i_bored_f6ac56: "对不起，我的故事让你无聊了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_i_bothered_5c4b7a: "对不起，打扰你了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_i_broke_5b5829: "对不起，我违背了诺言。但即使我能回到过去，我也会再做一次。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_i_m_a5546e: "对不起，但我很饿……我现在动不了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_t_move_6e4f7d: "……对不起，动不了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_still_practicing_vai_2ea773: "我还在练习……徒劳？！你不能相信别人的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_still_talking_you_e54eba: "我还在跟你说话。你不怕我是因为我现在是蝙蝠形态，对吗？你们人类太愚蠢了，无法超越你们所看到的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_still_too_stiff_1df9a3: "我仍然僵硬得动不了。你也愿意照顾他吗？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_stuck_here_forever_e2f293: "我被永远困在这里了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sure_either_da1b0b: "我也不确定？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sure_heh_heh_b728a2: "我不确定。嘿嘿。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sure_how_works_42c738: "我不确定那是怎么运作的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sure_what_principle_df6798: "我不确定是什么原理，但我按照杰里蒙大人的指示努力搅拌了！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_telling_you_because_d0195d: "我告诉你是因为我对你有好感。马上离开这个地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_tired_33fdf2: "我累了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_too_tired_e5fb77: "我太累了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_victim_here_you_158d16: "你知道，我才是受害者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_waiting_her_right_fa395b: "我正在等她。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_worried_about_those_4608df: "我担心那两个人。他们应该没事吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_worried_about_what_7f8847: "我担心那里正在发生的事情。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_zeith_334054: "我是泽斯，这是……？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_may_end_up_wasting_a197f5: "我可能会浪费我们的时间，但我想试着帮助他们安息。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_mean_he_smells_like_117482: "我是说他闻起来像个朋友，小家伙。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_mean_send_them_heaven_d89b02: "我是说……送他们去天堂。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_met_bomi_before_i_d79708: "我来这里之前见过波米。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_might_able_touch_8c1028: "我也许能触摸到它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_might_remember_little_1144d9: "我可能会记得更久一点。但我最终会忘记的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_my_treasure_now_s_8d686f: "我有我的宝贝^BDBDBD现在^000000……它很闪亮……很漂亮。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_ca74d0: "我需要10个^4d4dff{0}^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_explore_dungeon_f_8fe8ee: "== 我需要先探索地下城。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_get_rid_monsters_892d14: " - ^0000CD我需要除掉^42424210个{0}怪物。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_more_e5c2cb: "^FF0000我需要更多！！！！！！^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_more_i_d_965e90: "我需要更多的^4d4dff{0}^000000，而且我想让你处理那些妨碍我研究的^4d4dff深海生物^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_permission_enter_91cc50: "我需要进入地下墓穴的许可。我明天要去检查它们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_right_now_6bdb3f: "我现在需要10个。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_see_what_s_5d5be1: "……我也需要看看那里有什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_sticky_bloods_mat_045398: "我需要^0000cd10个来自马特德雷恩利亚的粘稠血液和10个来自霓虹蘑菇的蘑菇汁液^000000。如果你至少狩猎^0000cd5只马特德雷恩利亚和5个霓虹蘑菇^000000，你就能得到它们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_needed_humans_survive_3fe616: "我需要人类才能生存。我藏在人群中，需要的时候就猎杀他们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_no_choice_ask_other_e7937b: "今天我别无选择，只能向其他冒险者求助。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_nodded_recalled_bulky_546104: " - ^424242我点了点头，想起了我现在放在胸口的笨重碎片。港口的海风吹过我的耳畔……^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_now_live_some_more_1449b4: "我现在可以多活一段时间了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_only_faith_him_he_a229f9: "我只信仰他，而他告诉我不要相信你们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_only_trying_help_him_e335f5: "我只是想帮助他。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_other_things_94802a: "我有其他事情要做。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_picked_up_unknown_shel_46bae9: "我前几天捡到了一个未知的贝壳。看起来感知花园里的所有怪物，比如蚂蚁，都有它们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_placed_my_hand_book_967805: "我把手放在格里姆神父拿着的书上。突然我感到头晕，周围的空气似乎在闪烁。我小心翼翼地打开了笔记本。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_placed_my_hand_noteboo_e2a8bd: "我把手放在笔记本上，格里姆神父把它翻到了最后一页。突然，我的视线变得模糊，我感觉我的身体被传送到了某个地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_promise_i_m_going_9f1da9: "我保证我不会做任何危险的事。我只是看看材料。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_question_you_king_15ef46: "我有个问题要问你，国王。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ran_out_ingredients_i_96748e: "我的原料用完了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_realized_all_those_i_982b26: "我意识到所有我救的人都回到了他们原来的地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_really_didn_t_hurt_a6a99e: "……但是……但是我真的没有伤害任何人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_really_don_t_want_03c739: "我真的不想自己处理它们，"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_really_hope_brother_jo_04d4e5: "我真的希望乔乔兄弟平安无事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_really_want_know_what_c1c5bd: "我最想知道是什么让它们继续活动，我的前辈们对它们做了什么样的实验，以及它们处于什么样的状态。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_recently_found_out_the_765961: "我最近发现巴伊亚海沟里有生命。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_relayed_bomi_dracula_s_5ea1ee: "我把波米和德古拉的故事转告给了格姆修女和其他人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_relayed_what_happened_16c34e: "我把笔记本里发生的事转告给了格里姆神父和莫乔，并告诉他们其他人决定留下来监视吸血鬼。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_relayed_what_i_heard_f8a0c2: "- 我把从杰里蒙那里听到的话转述了一遍。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_released_them_ice_earl_7e7119: "^ff0000……？我早些时候把它们从冰里放出来了。为什么它们又被冻住了？^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_remember_come_back_ple_f1b061: "我会记住的……回来。求你了。哥……！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_remember_please_come_b_2d0a86: "我会……记住的……请……回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_right_08641e: "我是对的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_s_because_i_m_efda95: "我……不是因为害怕！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_said_before_no_one_966ad0: "我以前说过……但没有人回来过。我不指望任何人会回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_said_s_what_i_17179f: "我说那不是我要的。冒险者，你忙吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_said_they_zombies_mush_30dc14: "我说它们是僵尸，不是蘑菇！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_saw_after_last_ritual_b6d8f3: "我在最后一次仪式后看到了它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_saw_something_526c4f: "而且，我看到了一些东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_saw_sophia_drinking_ma_307bb1: "我看到索菲亚在喝法力药水。也许药水是我对身体支撑永无止境寻找的答案。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_saw_too_2c4d02: "我也看到了"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_scanned_any_malicious_88451e: "我扫描了它是否有恶意意图，但没有感觉到任何。我想它的主人只是^0000cd需要一些未完成的事情上的帮助^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_c52c6e: "我明白了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_hmm_you_t_96d57b: "我能看见。嗯……你看不见。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_how_she_dc1caf: "……我明白了。她怎么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_i_m_looking_957934: "我明白了。我在找你……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_just_let_me_7d2e93: "我明白了。你想离开的时候告诉我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_people_s_good_03b242: "我能看到人们的善恶能量。对于冒险者来说……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_s_shame_you_d01510: "我明白了。你不能抓住这么好的机会真是太遗憾了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_we_found_him_377235: "我明白了。我们发现他受伤昏迷，所以把他带到这里治疗。他现在可以离开了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_should_closer_after_da_a0ea02: " - ^424242我应该靠近一点。黎明之后，也许会更平静。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_should_go_back_my_adf30a: "我应该回我的家乡……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_should_go_s_time_69df7e: "我应该走了。是时候回去报告了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_should_leave_too_excus_a86881: "我也该走了。失陪了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_should_stopped_you_lea_d5742c: "我应该阻止你离开的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_show_these_pieces_my_47d0b6: "我把这些碎片给我的朋友^0000CD莱芬^000000看。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_sleep_last_aeb8ee: "我终于可以睡觉了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_smell_blood_human_bloo_14476e: "我闻到了^0000cd血^000000的味道！人血！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_specialize_singing_s_m_71bd0e: "我专攻歌唱。这是我的人生目标。当我歌颂奥丁时，我感到最大的喜悦。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_stay_safe_7f9e27: "我会的。保重。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_stayed_because_i_wante_7deb31: "我留下来是因为我想在她作为人类死去的时候陪伴在她身边。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_still_carry_fox_bead_a6dae8: "我仍然带着我试图净化的狐珠。准备好的时候告诉我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_still_enough_light_lef_778d4f: "这些发光的孢子还有足够的光。请在黎明后再回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_studied_pharmaceutical_c7cbd1: "我学习了^0000cd药剂配方^000000，以用药水弥补我虚弱的体力。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_surprised_b7915b: "我很惊讶。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_swear_i_ll_give_21553a: "我发誓我会还给你的。就一分钟。三十秒怎么样？那就十秒？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_symphatize_soldier_98a1a3: "我能理解那个士兵的感受。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_believe_how_simple_7621b1: "我不敢相信你的头脑这么简单。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_believe_there_s_33464b: "我不敢相信在伊斯鲁德附近有这么大这么深的海沟……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_believe_worked_2a6fd2: "……我不敢相信这真的有效。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_belive_muyeon_had_07b195: "我不敢相信慕妍得一个人应付这些。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_cook_rotten_meat_728c2f: "我不会煮腐肉，但我可以尝试吃！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_d3b5dc: "我不能"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_even_move_finger_64472a: "因为周围的冰，我连一根手指都动不了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_even_scream_0ffa66: "我甚至无法尖叫。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_forgive_you_i_5cd0f6: "我不能原谅^BDBDBD你们^000000！！我会^BDBDBD找到^000000并^BDBDBD杀死^000000你们所有人！！^FF0000咔嚓^000000……咔嚓……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_give_you_much_f466ff: "我不能给你太多，但我会把我之前找到的稀有矿石给你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_guess_a13832: "我猜不到。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_hear_khahris_anymore_0e34b3: "== 我再也听不到卡赫里斯的声音了。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_help_47f88d: "我也没办法"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_help_af8229: "……我也没办法。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_leave_here_just_fba86d: "我现在还不能离开这里。这个地方还有很多我想了解的事情。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_move_without_chewing_a7a20a: "我不咀嚼吞下什么东西就动不了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_remember_what_khahri_c31b90: "我不记得卡赫里斯长什么样了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_say_how_glad_aee432: "我无法表达有你在这里我有多高兴。现在我们有四个人了，^0000cd我们两个可以留下，另外两个去查看^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_stay_here_father_e51fe9: "我不能待在这里。格里姆神父，我必须进去。让我进去，求你了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_trust_her_notebook_1bccde: "我不能信任她拿着笔记本。如果出了什么事，里面的人可能回不来了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_wait_out_like_dbe67d: "我不能像以前那样等了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_take_3545be: "我会拿走的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_tell_he_brought_everyt_189416: "我看得出来他把你要的所有东西都带来了。来吧，把药膏做好涂在墙上。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_tell_s_enough_just_30451d: "我一眼就能看出那不够。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_drinking_water_g_e1f398: "我觉得喝水就足够了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_enough_today_ple_e151d2: "我想今天就够了，请明天再来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_forgot_somethi_a8824e: "我想我忘了什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_know_people_8d5497: "我想我知道。人们总是认为事情理所当然。如果我能永生，我想我会失去所有的动力。我是说，你只有时间而已。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_ll_able_68a52c: "我想如果我抓住10个，我就能多呼吸一点了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_lost_my_dcd0a5: "我想我因为练习不顺利而失去理智了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_need_some_1e5067: "我想我需要在这里做点工作。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_saw_something_176dd1: " - ^424242我想我看到了什么。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_tell_you_531318: "我想我可以告诉你我为什么画了那幅壁画。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_ve_heard_5a0392: "我觉得我在哪里听过那个名字……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_real_we_ve_d1305c: "我觉得那是真的。我们从没见过。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_s_possible_we_ed6356: "我想我们可能在一个月光花的梦中。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_we_ll_use_07e7e4: "我想我们得用火。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_we_should_talk_55cd87: "- 我觉得我们应该和杰里蒙谈谈把西罗德送上岸的工作。- "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_you_guys_need_1d0594: "我觉得你们需要好好谈谈。你们试着跟她谈过吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_you_ll_find_a71fba: "我想当你见到布里亚申的时候你就会发现的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_you_re_more_c320ca: "我觉得你比我知道的任何人都要有人性。你还教会了一个吸血鬼人性。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_you_re_thinking_3cee36: "我觉得你跟我想的一样。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_thinking_while_looking_3bcac4: "我一边四处看一边思考。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_thought_a4893e: "我想……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_thought_i_d_never_5c45db: "我以为我再也回不来了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_thought_i_going_die_94e399: "我以为我会死在这里，但幸运女神终于眷顾了我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_thought_priests_could_6abfe8: "我以为牧师可以治疗自己。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_threw_away_36d12e: "我把它扔了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_told_him_i_d_b6fcd6: "我告诉他我会马上回来的，但那个谣言到底是怎么回事？有很多人和怪物在排队。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_told_you_s_difficult_832b96: "我告诉过你，看到那些士兵而不感到痛苦对我来说很难。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_too_you_know_you_575773: "我也可以做到，你知道的。你只要给我一个机会！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_touched_sent_me_back_968719: "我触摸了它，它把我送回了原来的被毁村庄。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_try_ignore_my_reality_7a3fcb: "我试图忽视我的现实，但这种无处不在的饥饿和干渴不断提醒着我，我是一个多么可怕的怪物。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_trying_swim_as_hard_1c4b6b: "我拼命地想游出去，但我感觉到有什么东西用巨大的力量把我往里拉。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_understand_even_me_i_cc39c4: "我明白。即使对我来说，我也很困惑，但请听我说。我觉得我的朋友有危险了"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_understand_now_why_you_f69d2a: "我现在明白你为什么那样做了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_understand_why_those_f_a60797: "我明白为什么那些^0000FF狐狸会生气^000000，但这必须做。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_uneasy_feeling_dreadfu_36b1ea: "我有一种不安的预感，可怕的事情即将发生。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_vaguely_remember_i_did_b8a841: "我模糊地记得。我确实在和我兄弟们去打猎之前警告过我遇到的一个陌生人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_been_mines_most_706094: "这些天我大部分都在矿里，所以我的咳嗽似乎好转了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_been_told_idiot_2e9233: "有人告诉我那个白痴很兴奋。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_been_waiting_line_150772: "我已经排了好几天的队，但突然我就不感兴趣了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_been_watching_deep_88ced1: "我一直在观察这里的深海生物，我看到它们中的一些散发着深渊精华的光芒。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_decided_wait_her_e8689b: "我决定等她。反正我也可以休息一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_found_dry_twig_7b302f: "我找到了1个^006400干树枝^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_found_strange_stone_543ba4: "我在那里的时候发现了这些奇怪的石头。虽然不多，"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_found_traces_experi_3a5620: "我发现到处都是实验的痕迹。我的一些前辈一定在我之前来过这里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_got_so_many_27ef9c: "我有很多问题，但那个刻薄的牧师不让我碰它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_heard_adventurers_m_9fde28: "我听说冒险者会为别人做很多事情。是真的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_heard_both_you_8e175f: "我听到你们两个的话了，但你们都没告诉我你们在为什么而战斗。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_heard_they_hire_17ee31: "我听说他们雇佣冒险者是因为他们没有足够的人手来防御村庄。我猜就是你们？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_known_beginning_you_757f9d: "我从一开始就知道。你的表情太透明了，什么都藏不住。我只是没说什么，因为我觉得你紧张地偷看我们的样子很有趣。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_lived_village_long_14787d: "我在村子里住了很长时间，但这似乎是我从未听说过的现象。我猜测，但我觉得这是最近才开始发生的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_never_hurt_anyone_030b26: "我从没伤害过任何人，现在也不会开始。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_picked_up_your_62dda6: "我捡到了你的笔记本。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_studied_lot_why_af4273: "我学了很多。你为什么觉得我有？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_talked_guards_cough_80ffa6: "我跟守卫谈过，但是……咳咳……咳……他们没有认真对待……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_talked_villagers_ca3892: "我跟村民们谈过，"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_waited_answer_while_th_75f510: "==我等了一会儿回答，但自称卡赫里斯的人没有回应。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_i_waited_while_there_no_eac8bc: "==我等了一会儿，但自称卡赫里斯的人没有回应。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_i_waiting_tomorrow_3a50bf: "我会等到明天。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_ask_them_somethin_0a0190: "我想问他们一些事情！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_end_infernal_nigh_539c4a: "我想结束这个……地狱般的噩梦……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_get_rid_their_188386: "我想除掉他们的鬃毛，看看它是否会影响我们的梦境。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_know_more_than_486336: "我最想知道是什么撕裂了现实与梦境之间的墙壁。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_repay_you_healing_cf7436: "我想报答你的治疗。而且，听了你们两个的话，我觉得还是我去比较好。你想让我把你的同事带回来吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_without_having_le_133e36: "而且我想在不让我同事自生自灭的情况下做到这一点。你明白我的意思吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_you_bring_me_051c49: "我想让你带我出去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_you_go_over_32ec08: "我想让你去那边……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_you_liberate_them_ce3f56: "我想让你把他们从长在他们身上的冰柱中解放出来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wanted_my_obsession_2d935d: "我想这么做。我的执念是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wasn_t_asking_you_003b9c: "我没在问你！除非你要让我碰那本笔记本，否则别烦我！"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wasn_t_ready_let_b736c8: "我还没准备好让她走。我还没来得及思考我在做什么，就把她转化了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wish_i_could_go_800947: "我希望能跟你一起去，但我的队伍需要我留在这里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wish_you_stronger_then_7b332d: "我希望你更强壮。那样的话，我就能告诉你了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_witnessed_sad_event_i_d21af3: "我目睹了一件悲伤的事。我必须告诉卢安达我的经历。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_won_t_leave_you_90bd78: "我不会让你一个人的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_won_t_resent_you_84c9c9: "但我不会为此怨恨你。我保证。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wonder_if_there_specia_8dfb9c: "我想知道是否有特殊的药水可以物理上改善我。那样，我最终就能变得更强壮。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wondering_if_there_any_67034b: "我想知道除了钓鱼竿之外还有没有其他发现。"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wouldn_t_adventurer_if_1ed5fc: "如果我那样做的话，我就不配当冒险者了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_alone_there_could_bee_20ebc0: "如果{0}独自在那里，也可能是幻觉，对吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_case_724a41: "如果真是那样的话？"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_happens_i_ll_let_d95ecc: "如果发生那种事，我会让你自己照顾他们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_he_hasn_t_contacted_3a7298: "如果他还没联系我，一定出了什么事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_could_i_ve_b6dd48: "如果我可以的话，我早就回到你身边了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_don_t_come_c21047: " - ^424242如果我不回来，她会忘记的。就在我走进光芒之前，纳林的声音从我身后传来。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_don_t_go_95fdb7: "如果我不自己去看看的话……"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_drink_toxic_blood_aab286: "如果我喝这个有毒的血液大约三十次，我可能会变成？哦，算了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_forget_again_please_eb8265: "如果我再次忘记……请我会努力记住的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_go_back_outside_098440: "如果我回到外面的世界，我无法阻止自己伤害别人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_go_there_i_f9c779: "如果我能去那里，我会亲自救他。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_m_mistaken_s_d15a07: "如果我没弄错的话，那是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_mix_them_like_7e6276: "如果我像这样把它们混合然后喝下去……"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_only_i_had_been_015c27: "如果我再强壮一点就好了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_s_youngest_s_memory_11fc1e: "如果这是最小那个的记忆，那就是了。在这个年纪当陌生人真奇怪。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_so_my_sister_law_10e26b: "如果那样的话……我的嫂子也……"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_there_others_i_ask_83aa59: "如果还有其他人，我可以请他们帮忙。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_they_make_even_slight_2e38cd: "但如果他们犯了哪怕最微小的错误，我们就会除掉他们！"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_we_play_rules_then_e22d19: "如果我们按规则来玩，那我们就不应该让他们活下去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_we_re_really_inside_1abded: "如果我们真的像忠海认为的那样，在月光花的噩梦中，"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_we_well_we_might_63c25f: "如果我们做得好，我们可能能让连接这里和伊斯鲁德的漩涡永远持续下去！"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_ask_me_sounds_ec2738: "如果你问我，那听起来是你所有故事中似乎最合理的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_collect_them_i_84e8fe: "如果你收集它们，我会为你创造一个漩涡。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_decide_ll_make_814bee: "如果你决定这样做，它会让你成为我们的一员，非常狂喜。可能因为他是个傻瓜。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_don_t_want_57c931: "如果你不想让我教你，那也没关系。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_ever_go_through_99465d: "如果你经历了类似的事情，请告诉我。我求你了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_find_either_one_124135: "如果你找到其中任何一个，我希望你把他们带出来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_find_leiphen_plea_782ba7: "如果你找到莱芬，请确保他在吃东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_follow_whirlpool_4156c5: "如果你跟着这个漩涡，也许能找到钓鱼竿的主人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_go_downstairs_you_88ce51: "如果你下楼，你会遇到一些相当凶猛的鱼。那样可以吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_harm_yourself_a4f804: "如果你能伤害自己……"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_leave_let_sister_aeb53b: "如果你必须离开，告诉玛丽娜修女。她会把你送回你来的地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_look_around_maybe_1d676a: "如果你四处看看，也许你会找到一个线索……哪怕只是一个小东西？"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_okay_you_hunt_fee5b2: "如果你可以的话，你能去周围猎杀一些怪物吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_overdo_you_ll_782c59: "如果你过度操劳，只会损害你的健康。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_busy_could_b884a3: "如果你不忙，能帮我个忙吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_busy_right_0e0a9a: "如果你现在不忙，帮我击败{0}、{1}和{2}。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_curious_stand_445cc1: "如果你那么好奇，就站在我后面等着轮到你！"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_familiar_comba_42c643: "如果你熟悉战斗，不熟悉战斗的傀儡师不会轻易离开这里的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_looking_teache_7ea0d4: "如果你在找老师，她在另一个房间。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_really_curious_aa1abe: "如果你真的很好奇，我会告诉你我的位置。为什么不进去看看呢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_really_want_exper_edf1c0: "如果你真的想对那些亵渎神明的生物做实验，那我建议你先和乔乔兄弟以及其他人谈谈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_saw_alone_could_0d18b4: "如果你看到{0}独自一人，那可能是幻觉，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_shake_like_crazy_8c1775: "如果你疯狂地摇晃它！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_time_please_come_3d399c: "如果你有时间，请明天再来。我会等你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_want_go_you_70fb16: "如果你想去，你必须亲自去看看。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_want_leave_ask_da7bb0: "如果你想离开，请玛丽娜修女放你出去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_want_look_further_820159: "如果你想进一步调查此事，你必须去那个被毁的村庄。"
  npc_override_gef_d01_i_quests_illusion_dungeons_imagine_how_uncomfortabl_af202f: "想象一下它们一定有多不舒服多冷！"
  npc_override_gef_d01_i_quests_illusion_dungeons_indeed_shows_how_its_own_ff518b: "确实。这表明它的主人研究了那些亵渎神明的生物，以^0000cd创造体力和法力增强剂^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_influenced_sirood_we_als_3dcbc8: "受西罗德的影响，我们也爱上了钓鱼，我们四个人经常玩得很开心。"
  npc_override_gef_d01_i_quests_illusion_dungeons_information_isn_t_someth_8efbe3: "信息不是免费获得的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_interesting_7c5f3c: "有趣。"
  npc_override_gef_d01_i_quests_illusion_dungeons_invading_they_called_the_f24b76: "入侵……他们自称纳扎里亚人，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_investigation_going_smoo_5f3220: "调查很顺利~"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_72ec8e: "不是吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_briashen_having_lo_48ac8f: "与其说是幻觉和布里亚申一起冒险，不如说是布里亚申的幻觉比其它冒险者更长？"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_doll_we_made_b1f9fa: "那不是我们做的玩偶吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_enough_c8ffe0: "这不够。"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_fishing_rod_bit_577dab: "那根钓鱼竿是不是有点奇怪？"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_guy_just_really_98487b: "……这家伙是不是真的很冷？"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_just_whirlpool_cre_7dafdc: "？？？那不是摇晃时产生的漩涡吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_town_plenty_food_45d7e9: "这不是一个食物充足的城镇，而且我不认为有什么特别的理由让怪物以它为目标。"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_what_you_told_78eec9: "那不是你第一次告诉我的。反正我从来都不相信那个愚蠢的故事。我跟着你进去是因为好奇。我现在完全后悔了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_jerrymon_began_examine_r_994654: "- 杰里蒙开始仔细检查钓鱼竿。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_jerrymon_poured_both_wat_624c13: " - 杰里蒙把两种水倒进一个瓶子里，开始一起摇晃。 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_jerrymon_put_glowing_sto_154da8: " - 杰里蒙把一块发光的石头放进瓶子里。发光的石头被吸进瓶子里的漩涡中，消失得无影无踪！ - "
  npc_override_gef_d01_i_quests_illusion_dungeons_jerrymon_should_still_na_23ffed: "^4d4dff杰里蒙^000000应该还在普隆特拉的<NAVI>[东图书馆]<INFO>prontera,192,264,</INFO></NAVI>。"
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_58fd5c: "乔乔。"
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_f9743c: "乔乔？"
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_s_colleagues_lookin_2dd6be: "乔乔的同事们在找他。"
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_wanted_see_me_f2244e: "乔乔想见我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_you_jojo_1ff144: "乔乔？你是乔乔吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_you_re_jojo_right_1e69e1: "乔乔？你是乔乔，对吧？你的同事们在担心你。我们回去吧。你没受伤吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_junghee_i_explore_place_df6dc9: "正熙和我会进一步探索这个地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_junghee_i_mean_soldier_f_bd08f5: "正熙？我是说，有个士兵跟着她进去了，但两个都还没出来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_just_949961: "就只是那样。"
  npc_override_gef_d01_i_quests_illusion_dungeons_just_disappeared_words_886777: "就这样消失了……那些话……"
  npc_override_gef_d01_i_quests_illusion_dungeons_just_get_out_before_s_109914: "在结束之前赶紧出去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_just_get_out_here_quickl_4b638d: "快离开这里。回到我们见面的地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_just_leave_me_alone_i_6981ca: "别管我！我知道如果我给你，你会拿着它逃跑的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_just_leave_me_alone_whil_16131f: "让我一个人待一会儿好吗？抱歉花了这么长时间。"
  npc_override_gef_d01_i_quests_illusion_dungeons_just_let_me_read_i_ab6930: "让我读一下。之后我会去把他们带出来。求你了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_just_listen_339e3a: "听着。"
  npc_override_gef_d01_i_quests_illusion_dungeons_just_now_db67df: "但是刚才！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ka_karu_d0b45a: "卡……卡鲁……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ka_karu_hyungnim_hyungni_eddccb: "卡……卡鲁大哥……大哥"
  npc_override_gef_d01_i_quests_illusion_dungeons_karu_disappeared_i_need_56da67: "卡鲁消失了。我需要告诉卢安达发生了什么事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_karu_don_t_too_sad_28643d: "卡鲁，别太难过……你发现我是这样的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_karu_how_hunt_today_740f5a: "卡鲁……今天打猎怎么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_keep_whoa_whoa_ok_now_3384f9: "保持……哇……哇……好了，现在。"
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_58e0e0: "卡赫里斯！"
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_6ec7d9: "卡赫里斯！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_929304: "卡赫里斯……！？"
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_9a72f5: "卡赫里斯……"
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_briashen_looking_ad3f51: "==布里亚申看着的卡赫里斯，看起来就像一只蚂蚁。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_ccd1b8: "卡赫里斯？"
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_gripped_his_fore_3a08ae: "==卡赫里斯用极大的力量抓住他的前臂。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_once_except_last_774224: "和卡赫里斯一起……除了最后一次玛雅出现之外，没有一次。"
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_vitata_so_other_ff0471: "卡赫里斯……和维塔塔在一起，所以其他蚂蚁显然不会碰它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_waiting_me_i_go_5e50ee: "卡赫里斯会等我的……我必须去找他。"
  npc_override_gef_d01_i_quests_illusion_dungeons_kidnapped_come_think_i_h_e31080: "绑架……回想起来，我在回来的路上帮助了一个被可怕的泰迪熊追赶的人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_kill_return_them_depths_55970b: "^ff0000杀死10个{0}、{1}、{2}、{3}和{4}^000000并送他们回到深渊……安息……"
  npc_override_gef_d01_i_quests_illusion_dungeons_king_smelled_blood_even_b2c114: "国王闻到了血腥味。尽管他就是这样在我流血不止的时候找到我的，但他能做到这一点仍然让我害怕。"
  npc_override_gef_d01_i_quests_illusion_dungeons_king_what_7d18d1: "国王？怎么了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_king_worried_about_growi_f7ccf9: "国王担心越来越多的小偷，这时一位年轻的战士进来赶走了所有入侵者。国王大喜，把女儿的手嫁给了战士。"
  npc_override_gef_d01_i_quests_illusion_dungeons_king_you_don_t_so_40808c: "国王，你不必这么刻薄。"
  npc_override_gef_d01_i_quests_illusion_dungeons_known_there_hundreds_dif_93a953: "众所周知，世界海洋中有数百种不同类型的海沟。"
  npc_override_gef_d01_i_quests_illusion_dungeons_kuh_if_me_my_brothers_29c47c: "咳……如果我和我的兄弟们没有清空村庄……人们就不会被怪物抓走……"
  npc_override_gef_d01_i_quests_illusion_dungeons_kyaaaaaa_4cb793: "呀啊啊啊！！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_land_3f2545: "这片土地！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_last_entry_i_took_my_3cdfdd: "那是最后的记录。我把手从笔记本上拿开。格里姆神父合上了笔记本。"
  npc_override_gef_d01_i_quests_illusion_dungeons_leave_d1a78d: "离开这个！"
  npc_override_gef_d01_i_quests_illusion_dungeons_leave_them_they_saved_jo_fd1214: "别管他们。他们救了乔乔。"
  npc_override_gef_d01_i_quests_illusion_dungeons_legend_says_nine_tailed_865f07: "传说九尾狐悟道成为了神圣的生物，月光花就是她的后裔。我觉得这值得调查。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_go_62fdff: "放手！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_check_other_point_4b80c7: " - ^424242让我检查另一个点。我们走……^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_go_2d6d8d: "让我走！"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_go_there_again_84bb59: "让我再去那里一次。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_hear_841e0d: "让我听听。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_know_when_you_8706a5: "准备好的时候告诉我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_pray_you_before_5c25e9: "在你离开之前让我为你祈祷。亲爱的上帝，请守护你的孩子们……"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_remind_you_0741bd: "但让我提醒你，"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_search_608d01: "让我搜索一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_thank_you_behalf_27a46e: "让我代表他的同事们感谢你。能问一下你的名字吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_begin_our_investig_270c30: "让我们开始今天的调查吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_chat_later_huh_a80684: "我们稍后再聊吧，嗯？"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_clear_things_up_2bd043: "让我们把事情说清楚再谈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_get_out_here_c068ff: "让我们离开这里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_go_208616: "走吧！"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_go_back_i_5f02e0: "我们回去吧。我累了。我想睡觉。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_go_back_now_6f4ff3: " - ^424242我们现在回去吧。教授似乎还没什么事。我稍后再来。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_go_d7f55d: "走吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_go_investigate_rui_7f70eb: "让我们去调查那个被毁的村庄！"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_go_outside_too_b93ee0: "让我们也出去吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_gooo_3c64b1: "走吧走吧！"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_hunt_together_6c40d9: "让我们一起打猎……"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_leave_him_alone_7cd71d: "让我们把他留在这里"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_run_f19ab4: "快跑！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_see_4d37ed: "让我看看……"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_see_how_long_bb5c8d: "让我看看你能得意多久。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_stop_making_mistak_918707: "让我们别再一直犯错然后让我来善后了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_wait_muyeon_now_a99048: "让我们等^0000FF慕妍^000000吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_us_help_other_souls_e4d659: "让我们像你一样帮助其他灵魂解脱吧，纳林。"
  npc_override_gef_d01_i_quests_illusion_dungeons_level_higher_quest_d8fa92: "== 这是一个160级或更高的任务 =="
  npc_override_gef_d01_i_quests_illusion_dungeons_level_over_quest_0ffebe: " - ^0000CD150级及以上可以做这个任务。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_life_death_e6a8b2: "也就是说，生与死……"
  npc_override_gef_d01_i_quests_illusion_dungeons_light_flashed_eac48d: "^ff0000光芒闪过！^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_light_magic_please_stop_369caa: "光……魔法……请停止那个魔法……"
  npc_override_gef_d01_i_quests_illusion_dungeons_lighten_your_weight_9e0f6c: "- 减轻你的负重 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_like_alchemist_example_3bd3b3: "比如炼金术士。"
  npc_override_gef_d01_i_quests_illusion_dungeons_like_f7579a: "像这样！"
  npc_override_gef_d01_i_quests_illusion_dungeons_like_gona_over_there_35f60b: "就像那边的戈纳。"
  npc_override_gef_d01_i_quests_illusion_dungeons_like_i_told_you_earlier_a8e96e: "就像我之前告诉你的，当这个洞穴还是一个王国的时候，国王有一只宠物蜥蜴。有一天，这只蜥蜴跑到王国外面去看外面的世界，结果却迷路了。国王对蜥蜴非常生气，于是诅咒了它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_like_i_told_you_earlier_f36541: "就像我之前告诉你的，当这个洞穴还是一个王国的时候，国王有一只宠物蜥蜴。当国王在一怒之下冻结了洞穴时，这只蜥蜴也变成了一个可怕的冰怪物。"
  npc_override_gef_d01_i_quests_illusion_dungeons_like_what_9178c1: "- 像什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_like_what_eating_sleepin_8f997e: "像什么？吃饭、睡觉、上厕所？"
  npc_override_gef_d01_i_quests_illusion_dungeons_listen_aca285: "听着。"
  npc_override_gef_d01_i_quests_illusion_dungeons_listen_me_you_always_go_9d09f1: "听我说，否则你可以随时回塔里去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_listen_people_a2f755: "听着，各位！"
  npc_override_gef_d01_i_quests_illusion_dungeons_listen_what_they_want_br_d04b2a: "^0000CD听听他们想要什么。兄弟，即使你看起来很微不足道，也要做一些让他们高兴的事。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_lizard_really_strong_i_s_0cb63a: "但是那只蜥蜴真的很强。我建议你组队战斗。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ll_ensure_chunghae_s_saf_b07bf0: "那样可以确保忠海在调查期间的安全。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ll_great_if_you_help_41cb2f: "如果你能帮助我们那就太好了，冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_long_live_emperor_79781e: "皇帝万岁！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_long_story_short_she_got_da12c9: "长话短说，她被卷入了交火中。她快死了，我慌了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_look_i_m_going_experimen_328c10: "听着，我不会在僵尸身上做实验。我只是想看看她使用的材料。"
  npc_override_gef_d01_i_quests_illusion_dungeons_look_place_952126: "看看这个地方！"
  npc_override_gef_d01_i_quests_illusion_dungeons_look_those_dashing_soldi_716dd3: "看看那边那些帅气的士兵！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_look_what_we_ve_got_60723d: "看看我们有什么。你忘了我让你做什么了吗？我告诉过你^0000cd去猎杀10只马特德雷恩利亚并带回20根短蝙蝠毛^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_looked_real_i_almost_foo_9d8789: "看起来很真实。我差点连自己都骗了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_looking_closely_fishing_27c633: "- 但仔细观察钓鱼竿，我感觉有些不同。这根木制钓鱼竿已经在水中浸泡了3个月，但看起来还是一样，而且我能看到一点闪亮的光泽…… -"
  npc_override_gef_d01_i_quests_illusion_dungeons_looking_doesn_t_make_sen_cc6bd5: "看起来，这不合常理。"
  npc_override_gef_d01_i_quests_illusion_dungeons_looking_into_bottle_jerr_d1bf9f: "- 看着杰里蒙拿着的瓶子，我能清楚地看到漩涡的形状。- "
  npc_override_gef_d01_i_quests_illusion_dungeons_looking_second_expressio_d7bb8e: "看第二个表情，你能看出那个陌生人有什么要说的吗？最小的，我们先走。"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_exactly_like_brias_bf23c4: "看起来和布里亚申一模一样"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_exactly_like_ruine_6cff0b: "它看起来和刚才我们在的被毁的村庄一模一样，但又……不同！"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_he_s_been_e76631: "看起来他被毛影响了。也许是因为他的能力，他经常被别人的情绪所左右……"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_i_interrupted_e55e7e: "看起来我打扰了那对情侣的约会。我需要告诉卢安达发生了什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_i_really_t_ba4af5: "看起来我真的不记得了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_message_i_sen_b804f0: "看起来我发的信息已经到达伊斯鲁德了，我很高兴……"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_rat_lurked_in_d7a0f1: "看起来有一只老鼠潜入了神圣的集会。"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_stranger_if_i_b92d8c: "看起来像个陌生人？如果我没记错的话，我在附近没见过那张脸。"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_we_got_caught_7812e1: "看起来我们被抓住了？！"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_we_only_need_e1ed54: "看起来我们只需要大约10个^4d4dff{0}^000000就能送西罗德上岸了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_you_ve_finish_e6f40c: "看起来你已经办完事了。你想去伊斯鲁德吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_normal_outside_cou_32a657: "== 外面看起来很正常，但这会不会就是我听说过的认知障碍的效果？=="
  npc_override_gef_d01_i_quests_illusion_dungeons_lot_monsters_come_town_s_ff94d6: "很多怪物很快就会来到这个城镇。不要白白死去，离开这个地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_luanda_cave_luanda_219863: "卢安达洞穴？卢安达？"
  npc_override_gef_d01_i_quests_illusion_dungeons_luanda_caves_strategical_2c3bf6: "卢安达洞穴在战略上是城镇北部唯一的出路。"
  npc_override_gef_d01_i_quests_illusion_dungeons_lululala_8a2a5d: "噜噜啦啦~~~"
  npc_override_gef_d01_i_quests_illusion_dungeons_lump_what_jerrymon_said_c236f1: " - 这就是杰里蒙说的那块东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_mage_you_stay_out_notebo_75594e: "法师，你别插手！这本笔记本正在把人们带到我们不知道的地方。而且入口在最后一页。"
  npc_override_gef_d01_i_quests_illusion_dungeons_magic_dropped_stone_conn_826f18: "掉落的石头上的魔法与我相连，所以通过测量距离，我可以稍微了解一下它有多深以及石头附近发生了什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_magic_exhausting_both_my_d25cdb: "魔法对我的身心都是一种消耗。我比想象中更快地达到了极限。但我并不沮丧。我想我可以弥补这一点。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maknae_maru_excellent_me_08a1e3: "末子玛露有着过目不忘的出色记忆力和读懂对手心思的能力……"
  npc_override_gef_d01_i_quests_illusion_dungeons_man_deathly_afraid_he_al_53147d: "那个人吓得要死，但他还活着并且离开了这个地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_man_named_briashen_5d4640: "一个叫布里亚申的男人……"
  npc_override_gef_d01_i_quests_illusion_dungeons_man_named_khahris_he_rea_f0921a: "一个叫卡赫里斯的男人，他是真的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_man_named_khahris_real_451e8a: "一个叫卡赫里斯的男人，那是真的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_man_s_scream_heard_front_ada901: "- 队伍前面传来一个男人的尖叫声。让我们去前面查看情况。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_many_monsters_come_town_f3aa3a: "很多怪物来到了镇上，人们因此痛苦地哭喊着……"
  npc_override_gef_d01_i_quests_illusion_dungeons_many_them_told_me_about_de5ed7: "而且他们中的很多人告诉我一些关于某个奇怪法师的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_mao_guy_you_ve_been_2c954d: "毛小子……你一直在想很多事情。"
  npc_override_gef_d01_i_quests_illusion_dungeons_marina_i_don_t_care_ab6ce4: "玛丽娜，我不在乎他们是谁。他们救了我，不求任何回报。"
  npc_override_gef_d01_i_quests_illusion_dungeons_marina_i_think_we_ve_0483a0: "玛丽娜，我想我们找到他了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_marina_why_don_t_you_09587a: "玛丽娜，你为什么不留下？格姆修女和我去。考虑到我们的能力，我想那最好。"
  npc_override_gef_d01_i_quests_illusion_dungeons_matte_drainliars_91c932: "^0000cd10只马特德雷恩利亚^000000！"
  npc_override_gef_d01_i_quests_illusion_dungeons_matte_drainliars_feed_bl_591f62: "马特德雷恩利亚以这个地方复活尸体的血液为食。"
  npc_override_gef_d01_i_quests_illusion_dungeons_matter_out_our_hands_now_38ee43: "这件事现在已经超出我们的掌控了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_may_i_continue_exploring_05b57c: "我可以继续探索吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_maya_khahris_melted_into_4b3c9d: "== 玛雅和卡赫里斯融入了黑暗并消失了。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_maya_moving_her_antennae_06e390: "== 玛雅正在移动她的触角听故事。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_maya_ruler_dungeons_a41510: "但是玛雅是地下城的统治者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_8f8629: "也许……"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_doesn_t_help_much_f73bb0: "也许没什么帮助，但是……咳"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_even_happening_oth_fa498f: "也许这甚至也在其他地方发生？"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_i_should_explore_d_83b905: "也许我明天应该在怪物躲起来的时候更深入地探索地下墓穴。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_i_should_try_formu_337081: "也许我应该尝试自己配制体力和法力药水。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_i_use_them_figure_7c458b: "也许我可以用它们来弄清楚她做的实验以及让死者复活的力量。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_ice_magical_e45a6f: "也许这冰是魔法造成的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_just_bad_air_c5070e: "也许只是空气不好！"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_maybe_c2463a: "也许……也许"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_maybe_d387d8: "也许……也许.."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_nightmares_stop_ma_3298f6: "如果我们消除它们的原因，也许噩梦就会停止物质化。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_only_happens_me_i_858410: "但也许那只发生在我身上。我是一个新生的吸血鬼，而且很弱。德古拉活了很久，而且一点也不弱。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_ritual_reason_they_52903f: "也许仪式是它们生气的原因，它没有按我们希望的那样运作。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_s_already_taking_p_656aaf: "或者也许它已经发生了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_s_because_dream_no_fefe4a: "也许是因为这是一个梦，但没有任何改变。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_s_because_walls_be_e76ae3: "也许是因为现实与梦境之间的墙壁已经崩塌了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_s_faith_you_overhe_e9e052: "也许你无意中听到我们说话就是信仰。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_s_time_we_leave_96a05e: "也许是时候把事情交给年轻一代了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_you_find_use_those_ea7afd: "但也许你可以找到那些东西的用途？"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_you_keep_questioni_f93acb: "也许你一直质疑我是因为你不信任我。如果我教你如何成为人类中最伟大的法师呢？那样你会信任我吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_you_should_help_th_f723c6: "也许你应该帮助他们创造自己的故事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_you_should_ve_chos_141d98: "也许你当初应该选择一条不同的职业道路。"
  npc_override_gef_d01_i_quests_illusion_dungeons_me_4e26f0: "我？"
  npc_override_gef_d01_i_quests_illusion_dungeons_me_favor_3368a5: "帮我个忙。"
  npc_override_gef_d01_i_quests_illusion_dungeons_me_nazarians_2a1d26: "我……纳扎里亚人……"
  npc_override_gef_d01_i_quests_illusion_dungeons_mean_i_m_free_free_f95319: "这意味着我自由了？终于自由了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_meantime_i_contacted_jun_ac887c: "与此同时，我联系了朱诺大学并去了龟岛，但没有取得任何成果……我希望能找到一条线索，弄清楚莱芬消失去了哪里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_meantime_i_ll_catch_some_aec092: "在此期间我先睡一会儿。"
  npc_override_gef_d01_i_quests_illusion_dungeons_meantime_i_make_fire_5cc521: "与此同时，我会生火。"
  npc_override_gef_d01_i_quests_illusion_dungeons_meat_easily_digestible_m_180dc3: "肉……容易消化的肉。饿。饿。太好了。肉……"
  npc_override_gef_d01_i_quests_illusion_dungeons_meat_pieces_please_655a92: "还有^0000CD肉^000000，^0000CD10块^000000谢谢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_megalith_extermination_c84c05: "^FF0000 巨石歼灭^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_as_da4e9b: "像往常一样，我想让你消灭^0000cd不安的亡灵^000000。有^0000cd三种不同的类型：小型、快速型和大型。请每种消灭10只。^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_but_c12edd: "但我确定一件事："
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_enter_51fc5c: "进入传送门。:退出。"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_exit_15a60f: "退出。:不退出。"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_go_4a411d: "和他一起去。:分开走。"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_it_03865c: "是的，但我现在很忙。:拒绝。"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_options_e504a4: ":)……"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_please_3f9e21: "请消灭^0000cd不安的亡灵^000000。有^0000cd三种不同的类型：小型、快速型和大型。请每种消灭10只。^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_please_aba1b7: "请消灭^0000cd不安的亡灵^000000。有^0000cd三种不同的类型：小型、快速型和大型。请每种消灭10只。^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_sure_13c874: "好的，我会的。:对不起，我害怕鬼。"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_vrid_0e6536: "弗里德的报告：愤怒的雪地精！"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_vrid_32e0f4: "弗里德的报告："
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_vrid_5d1c22: "弗里德的报告：奇怪的蜥蜴！"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_vrid_768e07: "弗里德的报告：愤怒的加泽提！"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_vrid_dedaec: "弗里德的报告：坚硬的冰柱！"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_vrid_eb741b: "弗里德的报告：愤怒的冰巨人！"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_will_17c8f3: "好的。:不用了，谢谢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_yes_b6ef50: "是的。:还没。"
  npc_override_gef_d01_i_quests_illusion_dungeons_might_come_handy_somewhe_4b6c15: "它可能在某个地方派上用场！"
  npc_override_gef_d01_i_quests_illusion_dungeons_mild_confusion_a442ea: "轻微的困惑。"
  npc_override_gef_d01_i_quests_illusion_dungeons_mirko_said_she_never_met_c78075: "米尔科说她从没见过你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_mirko_yolanda_236ed9: "米尔科和约兰达"
  npc_override_gef_d01_i_quests_illusion_dungeons_mirko_yolanda_asked_brin_4dff7e: "米尔科和约兰达要求在布里亚申独自受伤进去后把他带出来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_missing_priest_called_ju_033749: "失踪的牧师叫^0000cd朱比利^000000，巫师是^0000cd乔乔^000000。他们是典型的牧师和巫师。你不会错过他们的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_mm_bomi_0db4dd: "嗯……波米？"
  npc_override_gef_d01_i_quests_illusion_dungeons_mm_i_feeling_something_s_be13b3: "嗯，我有种感觉，有什么可疑的事情即将发生。"
  npc_override_gef_d01_i_quests_illusion_dungeons_mm_i_m_sure_yet_b41202: "嗯，我还不确定。你介意我稍后再问你吗？好的，那么请给我带来^0000cd10片干枯的世界树树叶和10个可疑的五芒星^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_mm_isn_t_enough_please_5894c5: "嗯，这不够。请给我带来^0000cd10片干枯的世界树树叶和10个可疑的五芒星^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_mm_you_re_adventurer_wha_24d6cd: "嗯，你是冒险者。你来找我有什么事？对不起，我有点忙。你能去跟那边的牧师谈谈吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_monsters_here_much_stron_909623: "这里的怪物比我们认识的龟岛上的怪物强得多。拜托了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_moonlight_flower_recreat_53b6e2: "月光花在它们的噩梦中重现过去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_most_people_try_make_mos_c14e86: "大多数人因为知道自己不能永生，所以努力充分利用生命。"
  npc_override_gef_d01_i_quests_illusion_dungeons_most_perfect_use_these_t_e4f3e6: "最好是不需要用到这些东西……"
  npc_override_gef_d01_i_quests_illusion_dungeons_move_76cdb9: "移动"
