  npc_override_gef_d01_i_quests_illusion_dungeons_please_take_meat_pieces_c07888: "请拿肉。{0}。10块。"
  npc_override_gef_d01_i_quests_illusion_dungeons_please_take_out_each_87e034: "请消灭^4d4dff{0}^000000、^4d4dff{1}^000000和^4d4dff{2}^000000各10个。"
  npc_override_gef_d01_i_quests_illusion_dungeons_please_take_out_each_974ff8: "请消灭15个^4d4dff{0}^000000和^4d4dff{1}^000000各15个。"
  npc_override_gef_d01_i_quests_illusion_dungeons_please_talk_me_again_whe_43e291: "当你准备好穿越时再跟我谈谈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_please_teach_them_act_so_821e41: "请教教他们不要这么鬼鬼祟祟的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_please_tell_brother_grim_6e9f62: "请告诉格里姆兄弟我们决定留下来"
  npc_override_gef_d01_i_quests_illusion_dungeons_please_tell_brother_grim_8e9da2: "请告诉格里姆兄弟我们决定留下来监视他们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_please_tell_me_where_am_9b8478: "请告诉我。我在哪里？这里刚刚发生了什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_please_tell_me_your_frie_f33238: "请告诉我你的朋友长什么样。"
  npc_override_gef_d01_i_quests_illusion_dungeons_plop_57e9fb: "-扑通-"
  npc_override_gef_d01_i_quests_illusion_dungeons_population_deep_sea_crea_a5d735: "深海生物的数量正在增加。冒险者，能请求你的帮助吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_preparation_time_village_72c222: "为了那个时刻做准备，村里的战士把老弱病残疏散到了这个地方，他们在洞穴里到处储存了补给品。"
  npc_override_gef_d01_i_quests_illusion_dungeons_problem_amount_essence_f_7183ee: "问题是……钓鱼竿上的精华量不足以制造一个能容纳一个人的漩涡。"
  npc_override_gef_d01_i_quests_illusion_dungeons_problem_just_let_me_know_eaac5a: "没问题。准备好的时候告诉我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_professor_got_my_stuff_s_82e381: "教授拿到了我的东西，所以我能立刻认出来。平时我是不会知道的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_professor_just_come_back_cd56d8: "教授会回来的。我们去找他。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_puhahaha_i_think_you_cam_6b1b1c: "噗哈哈哈，我想你是来看大哥和嫂子约会的地方的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_punish_intruder_7f1747: "惩罚入侵者！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_punish_them_6a92d7: "惩罚他们！"
  npc_override_gef_d01_i_quests_illusion_dungeons_put_your_mouth_shh_quiet_8fc0f2: "把这个放进你嘴里。嘘，安静！"
  npc_override_gef_d01_i_quests_illusion_dungeons_quest_done_again_tomorro_64cfdc: "这个任务明天可以再做一次。"
  npc_override_gef_d01_i_quests_illusion_dungeons_quest_itself_doesn_t_dif_93b0a4: "任务本身不必很难，因为你只需要在洞穴里四处走动处理怪物或者带回来怪物的副产品。"
  npc_override_gef_d01_i_quests_illusion_dungeons_quests_recruiting_town_t_17bd9b: "在城里招募的任务有单独的请求板。"
  npc_override_gef_d01_i_quests_illusion_dungeons_quiet_now_cff801: "现在安静！"
  npc_override_gef_d01_i_quests_illusion_dungeons_quit_investigating_9ad060: "停止调查。"
  npc_override_gef_d01_i_quests_illusion_dungeons_raket_looked_intently_hi_453f65: "- 拉凯特专注地看着他的钓鱼竿，然后回答了盖因。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_ranger_s_name_briashen_8881ef: "游侠的名字是布里亚申……"
  npc_override_gef_d01_i_quests_illusion_dungeons_really_e7da47: "真的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_really_really_you_going_37c058: "真的……真的吗？你会回到这里来找我吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_really_s_sane_place_go_071f02: "真的，那不是……一个正常的地方"
  npc_override_gef_d01_i_quests_illusion_dungeons_really_worked_hey_zeith_ea8438: "真的有效！嘿，泽斯！你没事吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_recently_i_haven_t_had_2732a8: "最近因为各种事情我没什么可笑的，但多亏了你，我大声笑了出来。我期待下一个故事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_red_light_invisible_nari_7297c8: " - ^424242这道红光纳林是看不见的。它似乎就是消失了。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_relax_focus_your_mind_op_38a1ff: "放松……集中注意力在它上面……向它的能量敞开你的心扉。"
  npc_override_gef_d01_i_quests_illusion_dungeons_remember_what_muyeon_sai_27c9bb: "记得慕妍说过什么吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_reported_luanda_gained_e_863695: "向卢安达报告并获得了经验。"
  npc_override_gef_d01_i_quests_illusion_dungeons_request_been_cancelled_75fbc9: "请求已被取消。"
  npc_override_gef_d01_i_quests_illusion_dungeons_request_yet_37fa36: "……请求还在……"
  npc_override_gef_d01_i_quests_illusion_dungeons_revenge_67df05: "复仇？"
  npc_override_gef_d01_i_quests_illusion_dungeons_right_now_there_so_many_f518bf: "现在，我体内的毒素太多了，感觉我好像要变成怪物了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_rune_midgarts_flanked_ar_1f82ce: "符文-米德加尔特两侧是阿鲁纳费尔特兹和施瓦茨瓦尔德，大陆上最强大的两个国家，而它的魔力正是让它们不敢轻举妄动的原因。"
  npc_override_gef_d01_i_quests_illusion_dungeons_rwella_2d8389: "鲁维拉？"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_5a97cd: "那是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_about_dying_their_curs_20d4ef: "这个……不是关于死亡……它们的诅咒……在你身上……"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_alive_s_alive_damn_af3566: "它..^BDBDBD它^000000是……活的。^BDBDBD它是^000000活的……该死！^BDBDBD活着的，^000000活着的？！我！！！我是^BDBDBD死了^000000，死了！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_all_mine_all_mine_25d072: "全是……我的。^BDBDBD全部^000000可以^BDBDBD成为^000000我的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_all_mine_all_mine_cd50e9: "全是……我的。^BDBDBD全部^000000可以^BDBDBD成为^000000我的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_all_mine_could_all_b3b53c: "全是我的。^BDBDBD可以^000000全部^ BDBDBD成为我的^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_all_mine_could_allmine_ec2bef: "全是我的。^BDBDBD可以^000000全部^BDBDBD成为我的^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_because_form_more_effi_521da7: "那是因为这个形态更有效率。我不需要喝很多就能饱，我不显眼，而且人们，比如那边那个傻瓜，会在我面前放松警惕。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_been_exactly_months_si_6126a0: "自从西罗德失踪已经整整3个月了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_been_hard_you_being_706fc1: "你一个人一定过得很艰难。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_been_said_all_mammals_823af8: "据说所有哺乳动物的好奇心都能与食欲相媲美，但法师……是最糟糕的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_been_submerged_water_m_9152c5: "它已经在水中浸泡了3个月……但一点都没有腐蚀。完全没事？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_been_while_i_haven_ed062d: "已经有一阵子了，我没有失去理智。我没有被怨恨冲昏头脑，理性和情感都没有丢失。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_big_dream_impossible_d_7122aa: "……那是个大梦想，一个不可能的梦想。嗯，任何人都可以有大梦想。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_bizarre_shimmer_you_re_c76eba: "那是一种你可能会被吸入的奇异微光。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_bulletin_board_things_609f41: "这是一个写着村民请求的公告板，但现在似乎不是这种情况了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_cd820a: "那是……！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_chunk_scooped_up_landi_0b93af: "这是在发现钓鱼竿附近用捞网捞起来的一块东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_crazy_kkkk_52c4be: "那不疯狂kkkk。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_dangerous_here_i_ll_5fd70a: "这里很危险。我会找到卡赫里斯然后尽快回去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_dangerous_rate_you_re_068455: "这样下去很危险。你生病了，你需要离开这里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_deeper_here_than_anywh_d5d109: "这里比任何地方都深，而且能够自由呼吸真是太神奇了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_embarrassing_even_now_4ecf72: "真丢脸。即使到现在，我们能做的也只是阻止它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_even_ruin_so_how_3baf29: "这连废墟都不是，所以疯狂一下怎么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_fine_today_i_ll_88e6f2: "今天没问题。我明天会处理的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_first_time_someone_her_1c12b8: "这不是第一次，有人在这里。真是罕见的事件。当我第一次看到有人时，我想起了我想要什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_giving_me_anxiety_feel_0f55b0: "这让我感到焦虑。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_good_question_zeith_an_e65886: "这是个好问题。泽斯，回答他。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_good_someone_still_sta_fe14aa: "那很好，但还是得有人留在这里盯着他们。你了解我们，对吧？请告诉格里姆兄弟。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_great_here_we_recently_698864: "太好了。在这里，我们最近找到了一条通往更深处的路。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_haunted_cave_so_we_1f8272: "这是个闹鬼的洞穴，所以我们一直在那里定期举行仪式和驱魔。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_high_risk_job_b128ef: "这是一份高风险的工作。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_huge_7eb54d: "这是一个巨大的^ff0000{0}^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_image_another_world_di_fdfa65: "这是另一个世界的影像，不同于我们的世界。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_impossible_ddf96b: "这不可能，这是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_interesting_if_what_yo_5a9e50: "这很有趣。如果你说的是真的，那不就意味着你一直在过去和我说话？"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_intruder_64bf57: "是入侵者！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_just_guess_b994db: "这只是猜测。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_just_outlandish_3a9f89: "……那太离奇了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_kind_rude_answer_my_ee1479: "那有点粗鲁，也回答我的问题。你见过布里亚申吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_like_you_re_writing_a47d40: "这不像你在写什么重要的东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_melting_820e07: "它没有融化。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_much_i_ll_money_9f74b8: "这不多。钱我以后再付。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_much_secret_each_my_0aabb1: "这不算什么秘密，但我的每个兄弟都拥有一种神秘的能力。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_normal_reaction_humans_49586b: "那是人类的正常反应！她忘恩负义！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_ok_i_die_starving_ac8a7d: "没关系。否则我会死的。饿死……"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_ok_i_forget_both_41b69b: "没关系。我会忘记你们两个。这里所有的灵魂都是那样的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_ok_i_ll_leave_2e47c5: "没关系。我暂时离开你们。{0}，我们一起去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_ok_i_need_i_cfb8a2: "没关系。我需要{0}，否则我就只能死。饿着肚子痛苦地死去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_okay_because_i_m_d59ef9: "没关系因为我还活着！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_one_who_made_mess_8f5a7f: "就是你缝错了弄得一团糟的那个？？是的！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_only_reason_kept_churc_c403f5: "这就是阻止教会进一步追究此事的唯一原因，"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_over_dffcce: "结束了！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_posture_someone_who_s_81048a: "== 但这不像是一个在什么地方受过伤的人的姿势。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_s_puzzling_response_migh_c65f3d: " - ^424242这是一个令人困惑的回答，但可能有帮助。正如女孩告诉我的，我紧握着龟壳。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_s_quite_popular_spot_amo_0c77a4: "这是村里情侣们相当受欢迎的地方。很安静，是个约会的好地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_real_blood_he_needs_83b045: "那不是真正的血！他需要它！你看不出来他要死了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_really_weird_you_hunt_258817: "那真的很奇怪。你猎杀活的怪物，但不知为何只给腐肉？"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_reason_we_been_perform_132147: "这就是我们一直定期举行仪式的原因。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_reason_why_you_shut_71feec: "这就是你把自己关在西边洞穴的原因。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_requested_name_b9d1c9: "那不是要求的名字"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_ridiculous_b0dee0: "……那太荒谬了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_right_adventurer_e6d58b: "没错！冒险者，"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_right_adventurer_man_629ad7: "没错！冒险者先生，"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_right_d65817: "没错"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_right_lot_people_said_61431d: "没错。很多人说他们看到了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_s_hard_even_i_9de8ea: "这……这很难。即使我也羡慕那些被这种负担困住的人。但是……我无法关闭它。那些处于危险中的人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_said_i_lost_my_1fb3e9: "据说我在做了一个痛苦的梦后失去了理智，但不知怎的我的焦虑……"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_shiny_shiny_s_pretty_878349: "它很闪亮……闪亮……它很漂亮，真漂亮。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_sign_promise_i_try_6a6726: "这是一个承诺的标志。我会努力记住你们两个的。所以来……来找我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_situation_where_even_o_494b6e: "这是一个即使一个请求都可惜的情况，但{0}……真的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_so_amazing_we_breathe_c58fd0: "我们能不用鳃呼吸，没有海水压力，甚至还有我从未见过的海洋生物……真是太神奇了！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_something_we_need_thin_b08e14: "这是我们需要思考的事情。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_strange_my_head_i_f6ab1d: "这很奇怪。在我的脑海里，我知道我是人类，但当我看到一只蚂蚁从那里经过时，我会想我是不是一只蚂蚁"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_stupid_182a7c: "这不蠢！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_time_we_deal_quasi_c99673: "是时候我们处理这个准现实了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_true_cough_my_friend_859840: "这是真的，但是……咳……去矿场工作的朋友还没回来……咳。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_true_his_wounds_almost_6c3445: "这是真的。他的伤口几乎完全愈合了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_truth_6fca0c: "这是事实！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_uncommon_see_strangers_1a7ac6: "在镇上看到陌生人并不罕见，所以我的记忆很模糊，但我记得它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_urgent_so_i_ll_49d3a6: "很紧急，所以我快速问你！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_very_puzzling_us_too_669396: "这也让我们很困惑。如果我们知道原因，我们就会把一切都收拾好了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_way_09cec7: "但是……那不是方法！"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_weird_as_you_see_319f9b: "这很奇怪。如你所见，我很好。我正在找在这里分手的朋友"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_weird_left_right_over_ae5bd7: "左边右边都很奇怪，就在那边。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_what_muyeon_said_32e8b0: "慕妍就是那么说的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_why_i_want_see_921854: "这就是为什么我这么想看笔记本。我想知道它如何包含一个世界，以及为什么现在才被发现。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_why_mirko_asked_me_7733fc: "这就是为什么米尔科也请我帮忙。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_why_we_re_defending_5d38a7: "这就是为什么我们在这里防御怪物攻击。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_why_we_re_worried_e70bd5: "这就是为什么我们担心她。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_worst_thing_i_ve_4d68c4: "那是我见过的最糟糕的事情。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_you_figure_out_i_513520: "那由你来弄清楚。我不是披风制造者，对吗？但我知道你需要的不止这些。"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_your_fault_9894cd: "这不是你的错。"
  npc_override_gef_d01_i_quests_illusion_dungeons_same_question_we_asked_f_ae2edb: "那是我们一开始问的同样的问题。一旦我们读了书中写的内容，那就不再重要了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_save_friend_b7f913: "救救那个朋友。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sea_monsters_attack_time_207a59: "海怪确实会不时攻击，但也就那样……"
  npc_override_gef_d01_i_quests_illusion_dungeons_secret_ice_cave_0208c4: "冰洞的秘密！"
  npc_override_gef_d01_i_quests_illusion_dungeons_see_i_told_you_e8f1e7: "看，我告诉过你！"
  npc_override_gef_d01_i_quests_illusion_dungeons_see_if_you_break_ice_1b813f: "看看你能不能打破他周围的冰。如果可以的话，请帮我也从冰里出来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_see_those_two_little_wat_8b4f06: "看到这两个小水瓶了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_seeing_you_re_adventurer_e0990a: "既然你是冒险者，我想你应该熟悉^0000FF帕伊恩洞穴^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_seemed_like_he_going_fir_6dd564: "看起来他要去^ff0000艾因贝克矿场的一楼^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_seems_alleviated_just_re_6f9efc: "似乎只是通过减少怪物就得到了缓解。"
  npc_override_gef_d01_i_quests_illusion_dungeons_seems_getting_little_col_9ca85a: " - ^424242似乎变得有点冷了。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_seems_like_happened_long_32be3d: "似乎是很久以前的事了。不像毛，我的记性不是很好。"
  npc_override_gef_d01_i_quests_illusion_dungeons_seems_like_phenomenon_t_ddf495: "这似乎是一个不能忽视的现象。我必须和防御负责人卢安达谈谈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_seems_monster_appeared_l_f8fc6c: "似乎出现了一只怪物来领导它们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sense_could_you_handle_s_9fe27d: "从这个意义上说，你能处理一些深海生物吗？也许我们可以从中得到^4d4dff{0}^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_seriously_we_met_here_fe_3186d9: "真的。我们在这里见过几次面，和蚂蚁一起……"
  npc_override_gef_d01_i_quests_illusion_dungeons_several_days_s_weird_18a692: " - ^424242几天？很奇怪。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_holding_her_bare_han_8372d4: " - ^424242……她用裸手拿着吃..^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_left_without_telling_4fc903: "她没告诉我们发生了什么就离开了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_looks_just_like_bria_1670dc: "她看起来和布里亚申一模一样"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_ran_into_cave_as_76ce08: "她跑进了洞穴，好像被什么东西附身了一样。"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_s_right_we_shouldn_d39e1f: "她是对的。我们不应该。但看着它们……我不确定它们是否该死。"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_said_dracula_betraye_c159d3: "她说德古拉背叛了她。"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_still_hasn_t_forgive_fb2202: "她仍然没有原谅我。但我做了我必须做的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_t_remember_even_if_504b93: " - ^424242她不记得，但即使她不记得，她也不同于其他鬼魂。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_told_me_other_place_f2438e: " - ^424242她告诉我另一个地方，^0000CD另一个^000000点。^0000CD龟之宫殿^424242在附近吗？^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_wants_me_leave_arche_f2a830: " - ^424242……她想让我和考古学家莱芬一起离开。然后她会记得……"
  npc_override_gef_d01_i_quests_illusion_dungeons_should_i_ask_mr_luanda_12e569: "我应该问卢安达先生发生了什么事吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_should_i_say_aloud_since_4fd5dc: "我应该大声说出来吗，既然我遇到了你？我的名字是毛。我是你前几天遇到的卢安的弟弟。"
  npc_override_gef_d01_i_quests_illusion_dungeons_should_i_say_hello_nice_07f258: "我应该打招呼吗？很高兴认识你。我是卢安达，这个洞穴的防御管理者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_should_i_say_s_like_6a1e13: "我应该说它就像水和油吗？有一段它们从不混合。"
  npc_override_gef_d01_i_quests_illusion_dungeons_should_sirood_come_back_ba60c5: "西罗德会安全回来吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_shouldn_t_you_say_yourse_cc718f: "你不应该先说说你自己吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_show_me_piece_let_me_0a81ad: "给我看看那块碎片。让我看一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_showed_received_gein_jer_7971f7: "- 把从盖因那里收到的^4d4dff{0}^000000给杰里蒙看。- "
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_a02d05: "唉……"
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_all_because_you_idi_b4b916: "唉，这都是因为你，白痴。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_alright_i_ll_61408b: "……唉。好吧，我会做的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_anyway_lizard_exist_f2c465: "唉，反正，那只蜥蜴确实存在于这个洞穴里。如果你想看到它，那么在30秒内按下洞穴中央的所有4个封印宝珠。那会把它从藏身处引出来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_i_t_think_better_bca00c: "但是……唉，我想不出更好的办法。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_knucklehead_touched_a13cbf: "唉……这个笨蛋碰了他不该碰的东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_maybe_they_all_forg_eb2a94: "唉，也许他们都忘了我，就好像我从未存在过一样。那是最让我痛苦的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_vrid_cf962e: "唉。这是弗里德。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_whatever_please_hel_f9adb2: "唉，随便了。请帮帮他们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_you_re_lucky_i_3944df: "……唉。你真幸运，我太善良了，不会把你留在这里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_simple_quests_we_prepare_3d4f9c: "对于简单的任务，我们准备了一个请求板，你可以在那里找到它们并向我报告。"
  npc_override_gef_d01_i_quests_illusion_dungeons_since_fake_blood_pure_dr_fcc541: "但由于这种假血不纯，定期饮用会导致体内毒素积累，这会把你逼疯，直到毒素完全排出体外。"
  npc_override_gef_d01_i_quests_illusion_dungeons_since_he_said_he_ranger_5ebd92: "既然他说他是一个左臂受伤的游侠，不可能他只有一个朋友。"
  npc_override_gef_d01_i_quests_illusion_dungeons_since_we_re_underground_bece8c: "既然我们在地下，太黑了，我无法写字和阅读。我有很多信息想要编目，但我因为看不清而不断拼错单词。"
  npc_override_gef_d01_i_quests_illusion_dungeons_since_you_ve_been_hired_ee4bc3: "既然你被村庄雇佣了，我希望你努力工作，减轻一点负担。最近真的很辛苦。拜托了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_ah_i_think_i_0e2a8f: "西罗德……啊，我想我知道是谁了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_back_us_18c786: "西罗德回到我们身边了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_e5a5ed: "西罗德……？"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_greeted_me_as_if_bfa6f5: " - 西罗德像在等我一样向我打招呼。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_s_fishing_pole_ri_df2a33: "西罗德的钓鱼竿升到了海平面以上。在搜索期间他的物品无处可寻！"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_s_fishing_rod_fou_ee7908: "西罗德的钓鱼竿被找到了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_s_passion_fishing_9cda94: "西罗德对钓鱼的热情到了即使在风雨中也会邀请我们去钓鱼的程度。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_s_sake_fa0ab2: "但是为了西罗德……"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_went_fishing_alon_05b8ac: "西罗德独自去钓鱼，此后再也没见过他……"
  npc_override_gef_d01_i_quests_illusion_dungeons_sister_gem_just_waste_ti_948f03: "格姆修女，这只是浪费时间。他们一有机会就会杀了我们。在他们动手之前先除掉他们！"
  npc_override_gef_d01_i_quests_illusion_dungeons_sister_gem_please_listen_cddb09: "格姆修女，请听我说！"
  npc_override_gef_d01_i_quests_illusion_dungeons_sister_marina_you_seen_m_f90113: "玛丽娜修女，你见过这个地方的蘑菇吗？它们不是我们认识的那种蘑菇。它们是触摸时会爆炸的微型炸弹。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sisters_let_me_talk_your_a23a9e: "姐妹们，让我说。你们急于下结论的倾向对这种情况没有帮助。"
  npc_override_gef_d01_i_quests_illusion_dungeons_smell_salty_wind_lifted_a8be10: " - ^424242咸风的气息吹起了我的衣角。你可以听到阿尔伯塔港的海浪和海鸥的声音……^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_smells_delicious_looks_s_bbd855: "闻起来很香。看起来很美味。请给我。饿了。快点。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sniff_i_smell_humans_s_b37025: "嗅嗅……我能闻到人类的味道。还不是时候遇到他们。我们走。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sniff_way_smell_coming_w_e9f8f4: "*嗅嗅* 这边！气味是从这边来的！"
  npc_override_gef_d01_i_quests_illusion_dungeons_snort_b64258: "*哼*"
  npc_override_gef_d01_i_quests_illusion_dungeons_snort_if_i_drink_anythin_bf2b4c: "*哼* 如果我因为饿就喝任何东西，我现在不会比那些马特德雷恩利亚好多少，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_snort_you_t_beat_mushroo_5e70c5: "*哼* 你打不过蘑菇，但你可以救吸血鬼。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_c7572d: "所以……"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_chunghae_investigate_75d99a: "这样忠海就可以调查它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_either_we_went_alone_709e6e: "所以要么我们独自去了，要么他独自去了……有一天他在那里看到一个长得和他很像的人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_he_promised_then_one_2c7936: "所以他^0000cd答应了^000000。然后有一天，有些人来这里找他，他们打了起来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_how_acid_b65b5b: "那么酸液怎么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_i_m_asking_adventurer_22f2a7: "所以我问这个冒险者。你一直告诉我不要做这个，不要做那个。有什么是我可以做而你不说不的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_i_m_thinking_could_d64c66: "所以我在想……你今天能再给我带一些吗？我需要^0000cd10片干枯的世界树树叶和10个可疑的五芒星^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_i_pulled_my_hair_9a20cf: "所以……我拔下头发仔细研究。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_i_want_save_all_be0e25: "所以我想拯救所有生命。那些流进来的人，甚至那些被负担永远困住的人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_mm_our_new_friend_827b97: "所以，嗯……我们的新朋友……"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_they_ve_come_true_32229f: "所以它们成真了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_we_re_resorting_brute_5f1a86: "所以我们只能用蛮力。你想让我先走？懦夫！唉……请温柔点？不，用你最大的力气打我吧！"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_we_ve_come_agreement_9c5b71: "所以我们达成了协议。我们现在就走。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_what_about_76f510: "那么，这是怎么回事？"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_what_did_look_like_bb8650: "那么它长什么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_what_s_really_dangero_c2c3a1: "那么现在真正危险的是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_what_you_want_ab6443: "那么你想要什么……"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_when_my_first_nightma_376e52: "所以当我的第一个噩梦发生时，我以为它和其他人在同一条船上。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_arguing_about_whi_b352de: "所以你们在争论你们中的哪一个应该去那个地方？"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_come_agreement_751fa3: "那么你们达成协议了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_help_me_bit_917802: "那么，你能再帮我一点吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_keep_eye_us_8716fb: "所以你可以盯着我们。德拉克，我受不了了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_re_hating_your_3e1ddf: "所以你在恨你自己的同类。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_re_hurry_leave_cfbec8: "那么，你急着离开。发生了什么事吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_re_okay_adventure_bc05d9: "所以你同意让这个冒险者读，但不同意让我读。"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_re_saying_they_c0590a: "所以你是说他们真的是无辜的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sob_164784: "呜呜！"
  npc_override_gef_d01_i_quests_illusion_dungeons_some_mages_decided_erect_567025: "一些法师决定建造他们自己的象牙塔。他们在大陆上到处搜索，最终定居在这些地下墓穴上方的地面上。"
  npc_override_gef_d01_i_quests_illusion_dungeons_some_quests_progress_d41bdd: "一些任务正在进行中。"
  npc_override_gef_d01_i_quests_illusion_dungeons_some_them_nine_tailed_fo_ab2970: "其中一些是九尾狐。狐狸的愤怒超出了正常范围。"
  npc_override_gef_d01_i_quests_illusion_dungeons_something_bit_sinister_i_d77102: "有点阴险，但我想这次会相当有利可图，最小的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_something_different_atmo_e54261: "但有些不同，气氛。"
  npc_override_gef_d01_i_quests_illusion_dungeons_something_ignited_their_e42dec: "而且有什么东西点燃了他们压抑已久的愤怒。"
  npc_override_gef_d01_i_quests_illusion_dungeons_something_s_weird_here_d0c3de: "这里有点奇怪"
  npc_override_gef_d01_i_quests_illusion_dungeons_something_shiny_same_fee_5a04d7: "有东西闪闪发亮，而且和西罗德的钓鱼竿有同样的感觉，所以我暂时保管了它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sometimes_direct_approac_9418cd: "有时候直接的方法最好。让我们试着敲打冰直到它破裂。请先试试泽斯的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sometimes_if_you_defeat_e040b4: "有时候如果你击败在感知花园游荡的{0}或{1}"
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_bother_you_b7940c: "抱歉打扰你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_danger_5b27ab: "……为危险道歉。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_i_don_t_want_1c4636: "对不起，但我不想介入你们两个之间。你们都有道理，我不能偏袒任何一方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_sudden_request_5feb86: "抱歉突然的请求。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_wait_minute_443b36: "对不起，等一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_wait_minute_fdaf11: "对不起，等一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_soul_linkers_communicate_c5d30d: "灵魂链接师以与灵魂交流为生，做噩梦只是正常现象。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sounds_like_conversation_96e044: "听起来像是乌坦或巨石怪 targeting 村庄的对话。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sounds_like_something_si_0fe458: "听起来类似的事情未来可能发生，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_speak_sleep_ce763d: "说出来然后入睡……"
  npc_override_gef_d01_i_quests_illusion_dungeons_spell_protect_you_moment_abcafe: "一个能暂时保护你的法术。"
  npc_override_gef_d01_i_quests_illusion_dungeons_spirits_moonlight_flower_707970: "月光花的灵魂仍然活在过去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_stand_line_b90e03: "排队！"
  npc_override_gef_d01_i_quests_illusion_dungeons_stay_away_me_i_won_0e4246: "离我远点，我就不会伤害你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_steven_7ff5ad: "史蒂文！"
  npc_override_gef_d01_i_quests_illusion_dungeons_steven_brought_because_h_d9ea62: "史蒂文带来它是因为他说他在家里找咸的东西吃。"
  npc_override_gef_d01_i_quests_illusion_dungeons_steven_cough_e7766c: "史蒂文是……咳"
  npc_override_gef_d01_i_quests_illusion_dungeons_steven_kind_guy_cough_co_0ca875: "^ff0000史蒂文^000000不是那种人……咳咳"
  npc_override_gef_d01_i_quests_illusion_dungeons_still_good_idea_get_clos_258fca: " - ^424242还是不要靠近为好。等一天。黎明后再来。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_still_mirko_too_weak_com_f4fb59: "不过，米尔科太虚弱了，无法进来搜索，所以担心也是徒劳的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_still_satisfied_let_s_co_0e6992: " - ^424242还是……满意了。黎明后再来吧。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_still_village_chief_best_026ba1: "不过，村长，村里最年长的长者，似乎因为冷静而受损较少。谢谢你的故事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_stone_magical_power_8bc2c1: "蕴含魔力的石头？"
  npc_override_gef_d01_i_quests_illusion_dungeons_stop_dumping_things_me_e95dcd: "……别再把东西丢给我了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_stop_i_didn_t_say_ce5ee5: "住口？我没说错什么。你很快就会离开并忘记一切。你永远不会回来……对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_stop_invasion_f8ba8e: "不会停止入侵！"
  npc_override_gef_d01_i_quests_illusion_dungeons_stop_saying_1d4e31: "别再说了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_story_so_unrealistic_bor_b577af: "但那个故事太不现实太无聊了，不值得记住。蜥蜴就是蜥蜴，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_story_you_just_told_me_4e9c6b: "你刚告诉我的故事真的很有帮助。谢谢你，冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_strange_shimmer_as_you_s_5027bc: "奇怪的微光？正如你所说，这真是一个奇怪的现象。"
  npc_override_gef_d01_i_quests_illusion_dungeons_strange_what_719978: "奇怪，那是什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_strong_boundary_formed_w_ac17e2: "在它们相遇的地方形成了强大的边界，感觉那个区域的深海海水正在拼命阻挡从上方流下来的海水。"
  npc_override_gef_d01_i_quests_illusion_dungeons_strong_leader_also_probl_4eaf3c: "强大的领导者也是个问题……但作为一种传说的力量传承下来？这是我从未听说过的故事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_stubborn_girl_refuses_ac_2de340: "但那个固执的女孩拒绝承认这一点！"
  npc_override_gef_d01_i_quests_illusion_dungeons_such_experiments_prohibi_21b7a8: "这种实验现在被禁止了，所有旧记录都被销毁了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sucks_e4a402: "这太糟糕了！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_suddenly_my_hands_like_m_111884: "突然从我的手中……就像它融化了一样。"
  npc_override_gef_d01_i_quests_illusion_dungeons_suddenly_you_guys_realiz_fd4ea9: "然后突然你们意识到了。真奇怪。……然后，结束了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sure_04b0c5: "当然"
  npc_override_gef_d01_i_quests_illusion_dungeons_sure_37a98c: "当然。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sure_anything_you_1ef178: "当然，什么都愿意为你做。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sure_my_guest_bddd8c: "当然，请便。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sure_thing_any_time_you_b1548f: "没问题。随时都可以，{0}"
  npc_override_gef_d01_i_quests_illusion_dungeons_sure_thing_da4966: "没问题。"
  npc_override_gef_d01_i_quests_illusion_dungeons_sure_why_d9c786: "当然，为什么不呢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_sweet_nightmares_even_th_b60f32: "甜蜜噩梦……连它们的名字都是矛盾的。也许它们的鬃毛是所有噩梦的源头。"
  npc_override_gef_d01_i_quests_illusion_dungeons_t_get_yet_84a0a6: "- 还不能进去 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_t_you_let_me_go_5f7aa4: "你不能让我走吗？！"
  npc_override_gef_d01_i_quests_illusion_dungeons_t_you_tell_sacred_creatu_c4dcb3: "你从神圣生物身上看不出来吗！"
  npc_override_gef_d01_i_quests_illusion_dungeons_take_care_briashen_d7538b: "照顾好布里亚申。"
  npc_override_gef_d01_i_quests_illusion_dungeons_take_care_don_t_late_8ee7d2: "保重。不要迟到……"
  npc_override_gef_d01_i_quests_illusion_dungeons_take_care_those_chasing_8d7404: "适当照顾那些追我们的人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_take_care_yourself_i_hop_35aae7: "照顾好自己！！希望哪怕有最小的线索……"
  npc_override_gef_d01_i_quests_illusion_dungeons_take_i_don_t_need_616af6: "拿着这个。我不需要它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_take_me_briashen_s_f8e458: "带我去布里亚申那里！"
  npc_override_gef_d01_i_quests_illusion_dungeons_take_meat_pieces_d93579: "拿肉。^0000CD{0}。10块。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_talk_me_when_you_re_c1b956: "准备好上岸的时候跟我谈谈！"
  npc_override_gef_d01_i_quests_illusion_dungeons_talk_scholar_maybe_he_co_68c772: "和学者谈谈，也许他能给你一些关于情况的信息。"
  npc_override_gef_d01_i_quests_illusion_dungeons_teddy_bear_just_473504: "泰迪熊只是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_tell_him_about_coughing_6f786d: "告诉他关于那个咳嗽年轻人的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_tell_me_681d6a: "告诉我"
  npc_override_gef_d01_i_quests_illusion_dungeons_tell_me_when_you_re_262232: "准备好的时候告诉我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_tell_mirko_then_see_you_94dc5e: "告诉米尔科。再见"
  npc_override_gef_d01_i_quests_illusion_dungeons_tell_you_what_i_found_fe17a4: "告诉你我发现的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_terrible_36b98f: "这太可怕了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_th_then_see_you_tomorrow_aa357c: "那-那明天见，冒险者……"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_god_3b7a39: "感谢上帝……"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_174534: "谢谢你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_3005ad: "谢谢你，{0}！"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_5ce302: "谢谢你！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_accepting_well_48a787: "谢谢你接受。嗯，我认为最好把这些怪物想象成与龟岛不同的怪物。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_advance_6f42f5: "提前谢谢你！"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_adventurer_7933ab: "谢谢你，冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_adventurer_eve_8709a7: "谢谢你，冒险者。一切顺利，没有人因为你而受伤。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_helping_me_too_d56e23: "也谢谢你帮助我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_helping_them_r_d88da9: "谢谢你帮助他们安息。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_i_d_appreciate_3549e5: "谢谢你，如果你能帮助我击败深海生物或鱼人，我将不胜感激。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_i_ll_put_7bbdcf: "谢谢你，我会把它好好用于我的研究。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_i_ll_see_58b0fe: "谢谢你。回头见。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_i_m_sorry_0427c0: "谢谢你，对不起。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_i_m_sorry_7e5dfd: "谢谢你。对不起，但我从那地下墓穴遥远的角落都能听到你在战斗。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_i_need_sticky_602be7: "谢谢你。我需要^0000cd10个来自马特德雷恩利亚的粘稠血液和10个来自霓虹蘑菇的蘑菇汁液^000000。谢谢你为我做这个。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_i_never_imagin_53b107: "……谢谢你。我从没想过有一天会有人对我说这么亲切的话，但我一直渴望听到。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_meat_i_die_2a4206: "谢谢你。肉，如果吃不到我会死的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_remembering_de5bc4: "谢谢你记得"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_return_i_ll_8a7267: "谢谢你。作为回报，我会给你一些我从这个地方捡到的石头。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_saving_me_02c347: "谢谢你救了我"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_so_much_365320: "非常感谢！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_so_much_advent_74ab3c: "非常感谢，冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_so_much_see_6273bd: "非常感谢。明天见！"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_so_much_you_216eac: "非常感谢。你现在应该休息一下了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_thank_you_so_592fc4: "谢谢你。非常感谢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_thanks_you_i_74b6c5: "谢谢你。多亏了你，我发现了毛的烦恼。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_um_let_me_68e04b: "谢谢你……嗯，让我对你施个法术。你今天也会去见其他人吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_very_much_adve_682b92: "非常感谢你，冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_waiting_68f5e8: "谢谢你的等待……"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_waiting_i_m_24dff4: "谢谢你的等待。我现在好了。让我说完。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_your_hard_work_56604e: "谢谢你的辛勤工作！！你带来了10个^4d4dff{0}^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_your_hard_work_66306b: "谢谢你的辛勤工作。今天好好休息，明天再来找我们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_your_hard_work_e590d2: "谢谢你的辛勤工作，你还带了^4d4dff{0}^000000！！果然，我的预测是正确的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thank_you_your_help_3a7d59: "谢谢你的帮助。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thanks_40d2e7: "……谢谢……"
  npc_override_gef_d01_i_quests_illusion_dungeons_thanks_fac5db: "谢谢……"
  npc_override_gef_d01_i_quests_illusion_dungeons_thanks_great_help_62c6ac: "谢谢，那会帮大忙的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thanks_really_62a8f7: "谢谢……真的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_thanks_you_adventurer_i_05030b: "多亏了你，冒险者，我每天都过得开心又刺激。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thanks_you_adventurer_th_50ba46: "多亏了你，冒险者。非常感谢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thanks_you_i_been_able_031f04: "多亏了你，我才能够继续在矿场深处进行研究。"
  npc_override_gef_d01_i_quests_illusion_dungeons_thanks_you_i_get_hospita_fd2777: "多亏了你，我得到了医院账单和你的咳嗽……"
  npc_override_gef_d01_i_quests_illusion_dungeons_thanks_you_something_me_bccc23: "谢谢！！你能帮我做点事吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_their_nightmares_coming_c46e0f: "他们的噩梦正在成真。"
  npc_override_gef_d01_i_quests_illusion_dungeons_their_rule_help_anyone_w_dc4473: "他们的规则是帮助任何需要帮助的人，不管他们是谁。很简单，不是吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_adventurer_please_b_04a44f: "那么，冒险者，请给我带来^0000cd10个霓虹蘑菇的闪亮孢子^000000和^0000cd10个甜蜜噩梦的噩梦簇^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_again_i_ll_take_846efa: "那么再说一次，我明天会照顾你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_angry_soldier_over_2f6134: "那么那边的愤怒士兵一定是这个村庄的守卫。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_as_briashen_asked_y_1c5055: "那么，正如布里亚申要求的，你想下楼去帮他吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_careful_14b314: "那小心点。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_careful_82c4a2: "那小心点！"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_chunghae_won_t_able_7943fb: "那忠海就无法充分调查这个地方了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_go_back_place_you_8a677e: "那么，回去吧。回到你来的地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_good_time_adventure_ee3143: "那祝你玩得开心。冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_i_d_fully_regained_991818: "到那时，我已经完全恢复了力量，而那些人类不是我的对手。但是波米……她不想让任何人受伤。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_i_ll_ask_you_ff9ce2: "那我明天再问你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_i_ll_cross_first_cd9831: "那我先过去！！！小心跟上我！"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_i_ll_take_care_fb8fa2: "那我明天也会照顾你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_i_m_going_go_669d7e: "那我要和冒险者一起去！"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_let_me_open_9c77ec: "那么，让我打开它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_let_s_go_detached_75b636: "那我们去^0000CD detached 帕伊恩宫殿^000000吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_let_s_meet_izlude_0c635e: "那我们在伊斯鲁德见！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_nice_day_today_ed2c48: "那祝今天愉快！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_one_day_while_i_73ee94: "然后，有一天，当我在这里时，我遇到了一个不是人类的^0000cd实体^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_one_rangers_slightl_0b9e55: "然后其中一个游侠，受了点轻伤，走进了我之前说的那个新发现的蚁穴。我想 ……"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_one_rangers_slightl_cf752c: "然后其中一个游侠，受了点轻伤，走进了我之前说的那个新发现的蚁穴。我想……"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_please_come_back_af_787b35: "那请在黎明后回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_please_help_me_defe_d9fdc7: "那请帮我击败"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_please_hunt_turtles_54b8d8: "那请猎杀海龟。^0000CD{0}、{1}、{2}、{3}。每种10只。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_see_you_izlude_6e790c: "那伊斯鲁德见！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_see_you_later_2bdd6d: "那回头见"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_see_you_near_exit_bedd7c: "那一会儿出口附近见！"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_should_i_touch_620a2e: "那么……我应该触摸这个吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_take_care_yourself_43251f: "那保重~~！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_what_about_you_i_2c064d: "那你呢？我知道你能变身。但你还能做什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_why_did_you_turn_0cecdc: "那你为什么违背她的意愿把她转化了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_you_d_better_go_71b60b: "那你最好去处理你的事情。"
  npc_override_gef_d01_i_quests_illusion_dungeons_then_you_mind_if_i_e21ce4: "那么，你介意我跟着吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_accident_people_wh_3eba08: "出事了。差点杀了我的人又找到我了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_adventurer_wait_mi_3edf90: "那边冒险者，等一下！"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_anyone_who_help_oh_2a93d3: "有人能帮忙吗？哦！嘿，你！"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_b07750: "那边，{0}。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_cases_where_you_ca_8276f9: "有些公告板上的请求不能马上完成，但没有具体的时间限制，所以不要着急。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_limit_protection_s_04a39f: "保护法术有限制。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_lot_things_i_d_669e12: "有很多我想研究的东西，但现在最好还是回去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_many_enemies_so_le_ffbd0c: "敌人太多了，我们散开逃跑吧！"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_must_some_misunder_dba104: "一定有什么误会。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_no_one_around_here_049acf: "这里除了我和你之外没有别人，对吧？我已经在这里待了好几天^FF0000但没见过任何人^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_no_request_here_808433: "这里没有请求吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_nothing_we_old_fol_80b017: "我们这些老人无能为力。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_other_point_let_s_5d4990: " - ^424242有另一个点。我们走……^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_there_quest_whose_cooldo_ca7ef5: "有一个冷却时间还没过的任务。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_rare_life_forms_bo_e02bd7: "海沟底部有稀有的生命形式，像我这样的海洋科学家对此表现出极大的兴趣，并一直在探索它们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_s_another_portal_l_2836ac: "有另一个看起来和我们来时穿过的传送门一模一样的传送门。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_s_another_vampire_ef9ad8: "还有另一个吸血鬼！难怪这个地方感觉这么不对劲，到处都是吸血鬼！"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_s_cave_near_archer_b45ea3: "帕伊恩后面的弓箭手村附近有一个洞穴。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_s_more_than_one_9517ed: "有一两件事要调查，我会很忙。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_s_no_way_they_5f3968: "他们不可能在什么都没发生的情况下就这样寄钱来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_s_nothing_inside_m_368527: "这堆泥土里面什么都没有。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_s_shimmering_porta_8bd100: "空中有一个闪闪发光的传送门。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_someone_he_seems_m_2cfe18: " - ^424242有人。他似乎在嘟囔什么，但我听不清楚。他看起来不像考古学家莱芬^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_there_someone_here_like_ee3a93: "但^0000CD这里有像你一样的人^000000。一个不应该在这里的人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_something_other_si_f1238a: "闪闪发光的传送门另一边有什么东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_three_people_who_l_fcb947: "有三个看起来像卡赫里斯的人……"
  npc_override_gef_d01_i_quests_illusion_dungeons_there_two_locations_go_f_153b2d: "^0000CD有两个地点^000000。去找并带他回来。不要回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_these_found_only_inside_0f82a8: "这些只在这个地方找到。请随时把它们带给我。你知道，梦醒时就消失了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_these_foxes_villagers_an_728ba0: "这些狐狸、村民和愤怒的灵魂……"
  npc_override_gef_d01_i_quests_illusion_dungeons_these_literally_emergenc_c5357e: "这些实际上是紧急物品。如果不用就完美了，但是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_these_monsters_quite_fer_6a15a9: "这些怪物相当凶猛，所以非常小心。"
  npc_override_gef_d01_i_quests_illusion_dungeons_these_soldiers_tried_pro_54ad56: "这些士兵试图保护他们的村民直到最后一刻，"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_also_named_them_kar_9a4464: "它们还以城镇周围的洞穴命名为卡鲁、卢安达和毛。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_asked_my_name_again_e1f877: "^ff0000他们又问了我的名字，好像他们不记得我。有些奇怪的事情正在发生，但我又告诉了他们我的名字，反正。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_became_bitter_after_94569c: "在被忽视太多次后，它们变得怨恨。现在，它们假装友好，"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_conducted_various_e_83fbab: "他们进行了各种实验来理解让死者复活的特殊能量。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_could_using_him_as_0ad1da: "但它们可能是在利用他当诱饵！"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_destroyed_good_reas_c5e088: "它们被摧毁是有充分理由的。所以别再想知道它们的事了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_died_such_horrible_fefe38: "它们死得如此可怕，以至于无法前往冥界。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_drink_zombie_blood_fc63e4: "但它们喝僵尸的血！呕！我永远不会喝死人的血，不管我有多饿。太丢脸了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_even_tried_kidnap_y_722a48: "它们甚至试图绑架你！"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_just_look_big_becau_dda469: "它们只是因为身上长满了冰柱才看起来很大。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_like_twins_84e969: "它们就像双胞胎"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_may_real_if_they_493668: "它们可能不是真实的，但如果它们对活人构成任何威胁，那么就必须处理掉。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_might_go_away_compl_7eb916: "它们可能不会完全消失。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_must_near_cave_now_3aa10b: "它们现在一定在洞穴附近。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_quite_annoying_so_c_d31ea8: "它们相当烦人，所以小心。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_re_annoying_c40171: "它们很烦人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_re_having_same_conv_4cc6d2: "^ff0000它们在进行和之前一样的对话。而且，我觉得它们不记得我。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_reminded_me_time_wh_bea753: "它们让我想起了村庄被山体滑坡掩埋的时候。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_said_he_casts_power_5b0c77: "它们说他走到哪里就施放强大的法术，而正是他的一个法术震动了地面，导致了致命的山体滑坡。结果，很多村民和狐狸死了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_said_name_guardian_2b2bb4: "它们说那是守护旧村庄的守护灵的名字。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_seem_threaten_us_so_a213d1: "而且它们有时会威胁我们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_started_fade_away_a_68bff9: "^ff0000它们在向我道别时开始消失。这个洞穴似乎陷入了无尽的时间循环。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_started_fade_away_a_b4becc: "^ff0000它们在向我道别时开始消失。很快它们就什么都不剩了，就好像它们从未存在过一样。这一切只是一场梦还是什么？^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_took_my_treasured_m_aa2850: "它们拿走了^BDBDBD我的^000000宝贝^BDBDBDD……我的！！宝贝^000000……！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_ve_all_been_elimina_9c0616: "它们都被消灭了，谢谢你的辛勤工作。"
  npc_override_gef_d01_i_quests_illusion_dungeons_this_this_41a46c: "这……这个！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_those_arrogant_mages_cro_4792cf: "那些傲慢的法师越界了！他们试图扮演上帝！"
  npc_override_gef_d01_i_quests_illusion_dungeons_those_foxes_must_angrier_e3c307: "那些狐狸一定比我想象的更愤怒。"
  npc_override_gef_d01_i_quests_illusion_dungeons_those_two_ladies_may_agr_89f5b5: "那两位女士可能不同意，但我不必留在这里。我留下来只是因为^0000cd甜蜜噩梦^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_though_shallow_trenches_f21f8d: "虽然浅海沟可以在某种程度上探索。"
  npc_override_gef_d01_i_quests_illusion_dungeons_time_as_mirko_said_brias_93057e: "== 这次，正如米尔科所说，布里亚申脸色不好。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_time_passed_6afb41: "时间流逝了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_time_sad_we_need_build_3899e9: "现在不是悲伤的时候。我们需要建立更多的防御措施并采取其他措施。"
  npc_override_gef_d01_i_quests_illusion_dungeons_time_she_s_completely_lo_149bc4: "而这一次，她完全失去了理智，进入了洞穴。"
  npc_override_gef_d01_i_quests_illusion_dungeons_today_i_heard_some_stran_ecb54f: "今天，我在地下墓穴里听到了一些奇怪的声音。僵尸和蝙蝠异常安静。"
  npc_override_gef_d01_i_quests_illusion_dungeons_today_i_no_choice_commis_a45660: "今天，我别无选择，只能委托其他冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_told_him_about_karoo_asu_7526b9: "告诉他关于卡鲁和阿苏德姆的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_mao_wh_2caa96: "告诉卢安达关于毛独自训练的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_someon_906a0a: "告诉卢安达关于有人从洞穴里拿东西的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_storie_34f2e2: "告诉卢安达关于陌生人们的故事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_story_4cf5ba: "告诉卢安达关于遇到匆忙跑到某处的兄弟们的故事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_story_ac1be1: "告诉卢安达关于遇到村民和村长的故事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_story_dac1b4: "告诉卢安达关于看到卡鲁和阿苏德姆的故事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_strang_826034: "告诉卢安达关于你看到的奇怪微光。"
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_three_9ce9d3: "告诉卢安达关于你遇到并交谈过的三个年轻人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_who_pa_7b146f: "告诉卢安达关于谁在洞穴里画壁画的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_tomorrow_day_after_tomor_7695a5: "明天，后天……我会等的……哥哥和教授。"
  npc_override_gef_d01_i_quests_illusion_dungeons_too_bad_there_nothing_bu_b68056: "太糟糕了。没有什么可烧的……所以我生不了火。"
  npc_override_gef_d01_i_quests_illusion_dungeons_too_dangerous_2864d5: "这太危险了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_too_long_ago_there_lot_715f8c: "不久前，当下层的生物来到上层时，引起了很大的骚动。"
  npc_override_gef_d01_i_quests_illusion_dungeons_too_many_them_545850: "太多了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_totem_glows_softly_blue_841e04: "这是一个发出柔和蓝光的图腾。"
  npc_override_gef_d01_i_quests_illusion_dungeons_touch_4d2a8d: "触摸它"
  npc_override_gef_d01_i_quests_illusion_dungeons_town_isolated_world_moun_38b86d: "一个被山脉与世隔绝的城镇，帕伊恩人民的思维方式与外面不同。"
  npc_override_gef_d01_i_quests_illusion_dungeons_triplets_said_been_named_9467e5: "据说三胞胎以村庄洞穴命名卡鲁、卢安达和毛。"
  npc_override_gef_d01_i_quests_illusion_dungeons_try_again_1e2e57: "- 再试一次。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_try_place_them_too_close_4c8e64: "尽量别把它们放得太靠近我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_try_talking_mirko_again_96e432: "试着再和米尔科谈谈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_tsk_tsk_i_don_t_f6c685: "啧，啧。我不知道你怎么成了巫师，连拼写都不会。"
  npc_override_gef_d01_i_quests_illusion_dungeons_tsk_tsk_you_guys_so_c90780: "啧，啧。你们太天真了，以为火能融化这样的冰。没用，对吧？我们需要跳出思维定势。让我们试着用冰来打败冰！"
  npc_override_gef_d01_i_quests_illusion_dungeons_turned_out_his_son_law_8e9775: "但结果发现他的女婿也是个小偷。他最终带着王国最珍贵的宝藏逃跑了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_turned_out_ordinary_inva_6fa655: "结果是一个普通的、毫无价值的蘑菇。"
  npc_override_gef_d01_i_quests_illusion_dungeons_turning_around_small_smi_856031: " - ^424242带着微笑转身，双手合十的纳林惊讶地瞥了一眼。^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_typical_priest_wait_him_5c2a6a: "典型的牧师……等等，是他吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_typical_wizard_could_joj_814055: "^0000cd典型的巫师^000000……那会是^0000cd乔乔^000000吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_typical_wizard_wait_coul_1558cc: "典型的巫师……等等，那会是乔乔？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_u_i_don_t_want_8007f7: "^0000CDU 我不想让任何人死在这里。我想拯救所有生命。^000000......"
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_07d624: "呃！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_167de7: "呃……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_i_t_eat_sorry_18648f: "呃……我吃不下。对不起……你的努力白费了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_thanks_1f43bf: "呃……谢谢！"
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_things_got_messy_62ff24: "呃……事情变得一团糟……"
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_you_re_going_burn_badb54: "呃，你要烧死我们了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_7b1d46: "呃……"
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_f97db7: "呃……？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_hello_481350: "呃，你好"
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_huh_you_saw_me_cc56ab: "呃.. 哈？！你看到了我和长得像我兄弟的年轻人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_i_didn_t_tell_f7db04: "呃，我没告诉你。我正在休学年假。"
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_so_c58175: "呃……是这样吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_uhhh_yes_i_made_mistake_8930ec: "呃……是的，我搞错了，这是西罗德留下的钓鱼竿。请好好保管它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_uhm_s_bit_mess_great_1768c0: "嗯……有点乱……但就我的技术而言，这是一幅很棒的壁画。"
  npc_override_gef_d01_i_quests_illusion_dungeons_um_adventurer_ba2b3c: "嗯……冒险者？"
  npc_override_gef_d01_i_quests_illusion_dungeons_um_b716d0: "嗯……"
  npc_override_gef_d01_i_quests_illusion_dungeons_um_hahahahahahahahaha_f63d26: "嗯哈哈哈哈哈！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_um_hey_6e85c2: "……嗯.. 嘿？"
  npc_override_gef_d01_i_quests_illusion_dungeons_um_okay_then_please_brin_772eb1: "嗯，好的，那请先给我带来^0000cd20根短蝙蝠毛^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_um_uhm_0bd721: "嗯……嗯……"
  npc_override_gef_d01_i_quests_illusion_dungeons_um_you_adventurer_i_favo_8a2a6c: "嗯.. 你是冒险者吗？？我有个请求想请你帮忙……"
  npc_override_gef_d01_i_quests_illusion_dungeons_um_you_haven_t_found_bbbd32: "嗯，你还没找到，我明白了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_ummm_i_know_someone_who_4f9a8f: "嗯……但我认识一个可能对这根钓鱼竿有点了解的人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_under_command_knights_i_7b71f2: "在骑士团的命令下，我正在执行搜索阿尔伯塔第二骑士团的任务，他们在龟岛失踪了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_unless_you_realize_us_we_79429d: "但除非你意识到我们，否则我们也无法意识到你。这是件好事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_until_adventurer_strong_847985: "但直到有足够强大的冒险者能够到达那里……"
  npc_override_gef_d01_i_quests_illusion_dungeons_until_day_they_our_feet_1746b1: "直到那一天他们在我们脚下，我们纳扎里亚人！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_until_i_find_out_all_673a1e: "直到我找出这里所有的秘密。"
  npc_override_gef_d01_i_quests_illusion_dungeons_vague_image_i_saw_indist_168b92: "我看到的模糊影像与地狱无法区分。"
  npc_override_gef_d01_i_quests_illusion_dungeons_vampire_f3aec1: "吸血鬼？！"
  npc_override_gef_d01_i_quests_illusion_dungeons_vampires_who_understand_1dc04a: "还有理解人类的吸血鬼？我的天哪！"
  npc_override_gef_d01_i_quests_illusion_dungeons_village_having_lot_troub_a7f942: "村庄因为巨石怪而遇到很多麻烦。如果你带给我3个{0}作为击败巨石怪的证明，我会奖励你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_vitata_khahris_35009b: "那个维塔塔就是卡赫里斯"
  npc_override_gef_d01_i_quests_illusion_dungeons_vitata_s_behavior_threat_a1c772: "维塔塔的行为对她的地位构成威胁……"
  npc_override_gef_d01_i_quests_illusion_dungeons_vitata_turned_way_d9b8da: "== 维塔塔转向了这边。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_vrid_grimaced_sighed_scr_39bfa9: "^ff0000弗里德 grimaced，叹了口气，挠了挠头。然后他说……^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_vrid_you_haven_t_said_69e26d: "弗里德，你什么都没说。来吧，想点什么！"
  npc_override_gef_d01_i_quests_illusion_dungeons_waaaaaaa_aebad6: "哇啊啊啊！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_waaaaaaaa_9f44c4: "哇啊啊啊！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_adventurer_you_have_268477: "但是等等，冒险者。你还没听我说完我的故事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_moment_cba7f9: "- 等一下！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_sister_marina_calm_f23c34: "等等，玛丽娜修女。冷静一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_sister_marina_i_sai_696ac7: "等等，玛丽娜修女。我说，冷静一下。"
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_we_re_warriors_we_94fb90: "等等。我们是战士？我们不能不让我们敌人为他对我们做的事付出代价就离开！"
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_what_s_7562cf: "等等，那是什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_waited_while_rwella_didn_6fff53: "== 等了一会儿，但鲁维拉没有回应。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_waiting_someone_discover_6b6b88: "等待有人发现……"
  npc_override_gef_d01_i_quests_illusion_dungeons_warriors_nazarians_f7cf20: "纳扎里亚人的战士！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_watch_illusions_notebook_fad282: "注意幻象。笔记本主人的记忆在这个地方零星地显现。"
  npc_override_gef_d01_i_quests_illusion_dungeons_water_pressure_also_much_17a239: "水压也比正常海水低得多，所以假设它有一个有利于生命的环境。"
  npc_override_gef_d01_i_quests_illusion_dungeons_way_adventurer_weren_t_y_cf72f8: "顺便问一下冒险者，你不是在找慕妍吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_way_haven_t_i_seen_f2f771: "顺便问一下，我在哪里见过你吗？你的脸看起来很面熟。"
  npc_override_gef_d01_i_quests_illusion_dungeons_way_i_told_you_about_f1ef39: "顺便说一下，我告诉过你关于这种假血的危险。记得吗？它会在我的系统中留下毒素。"
  npc_override_gef_d01_i_quests_illusion_dungeons_way_khahris_briashen_loo_dbe08b: "== 顺便说一下，布里亚申寻找的卡赫里斯不是神枪手。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_way_please_make_sure_lei_8793e1: "在路上，请确保莱芬一切安好。"
  npc_override_gef_d01_i_quests_illusion_dungeons_way_there_times_when_peo_3c365b: "顺便说一下，人们有时会有各种情况。"
  npc_override_gef_d01_i_quests_illusion_dungeons_way_they_re_also_victims_8febf8: "在某种程度上，他们也是受害者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_way_what_brings_you_here_bc04c7: "顺便问一下，什么风把你吹到这里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_act_now_we_ve_42c480: "我们必须现在行动。我们已经让三个中的一个失去战斗力了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_call_deep_seawater_df8bbd: "我们称它为^4d4dff深海海水^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_came_here_find_out_428271: "我们来这里是为了查明这个地方是如何以及为什么被创造的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_didn_t_find_anything_d05a42: "我们没有发现这个地方有什么特别的。我们想离开，但我们中的几个人，^0000cd一个牧师和一个巫师^000000还没有回来加入我们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_don_t_worship_monster_ded78f: "我们不崇拜怪物。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_fully_prepared_while_a7d0fe: "我们在冒险者来的时候已经充分准备好了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_guess_one_fact_all_fe1444: "我们可以猜测一个事实。所有失去的记忆都在纳林的潜意识中。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_hate_life_those_who_90cbca: "我们憎恨生命。那些不被怨恨的负担束缚的人，那些奇怪地呼吸的人。我们想听到你最后一口气。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_invited_go_out_togeth_edfb96: "我们被邀请一起出去，但他们都拒绝了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_know_you_haven_t_522c02: "我们知道你没有伤害任何人，而且你想保持这样。我们感谢你救了乔乔兄弟。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ll_a300f8: "我们会做的！"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ll_try_your_suggestio_372cd0: "我们会试试你的建议。冒险者，你能猎杀10个坚硬冰柱然后回来吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ll_try_your_suggestio_7ce5c3: "我们会试试你的建议。冒险者，你能猎杀10个愤怒加泽提然后回来吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ll_try_your_suggestio_7efef4: "我们会试试你的建议。冒险者，你能猎杀10个愤怒雪地精然后回来吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ll_try_your_suggestio_ce85df: "我们会试试你的建议。冒险者，你能猎杀10个愤怒冰巨人然后回来吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_mages_just_like_you_2a377f: "从这个意义上说，我们法师和你们冒险者一样。我就知道你会理解我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_must_drive_out_all_e382cc: "我们必须驱逐所有人类并占领这片土地。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_must_shut_place_down_d682a1: "我们必须关闭那个地方，这样就没有人能够进入它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_need_dry_twigs_check_4099cb: "我们需要10根干树枝。检查这个洞穴里的干土堆。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_need_find_some_people_c508ad: "我们需要找到一些人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_need_look_around_more_6db8cc: "我们需要四处寻找更多线索。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_need_look_into_furthe_55a88a: "我们需要进一步调查此事。我最好去被毁的村庄。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_need_melt_ice_around_937957: "但我们需要它来融化我们周围的冰。我们会没事的……我想。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_only_identified_exist_95048f: "我们只在巴伊亚海沟深处确认了深渊海水的存在，而且很难获得样本。这根钓鱼竿上有很多深渊海水……"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_planned_subdue_wutan_c779c3: "我们计划征服乌坦部落。任何能捕获5个{0}、{1}和{2}的人，请申请。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_plant_our_holy_core_d20208: "我们会把我们的神圣核心植入那只是一个空壳的身体里！"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_re_enthralled_monster_308a8a: "我们不会被怪物迷住的！"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_re_going_make_any_63efc4: "我们不会做任何决定。相反，我们会^0000cd和你待在一起^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_re_no_position_take_40c4ec: "我们现在没有条件照顾任何人，所以照顾好你自己……"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_re_supposed_come_back_7a17ab: "我们……不应该回来的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_really_inside_moonlig_31a7ed: "我们真的在月光花的噩梦中吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_see_right_cbcb2f: "我们走着瞧。对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_should_grasp_situatio_abf39c: "我们应该先掌握情况。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_t_get_there_our_8bd8e1: "我们自己进不去那里。现在没有人能做到。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_t_let_keep_happening_62a66f: "我们不能让这种情况继续下去。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_t_like_d9bcf1: "我们不能这样……"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_take_basic_training_s_533820: "我们接受成为上帝仆人的基础训练，但我们每个人能做什么取决于我们的天赋。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_think_about_how_break_728fd9: "我们得想想怎么打破这冰。*呻吟*"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_thought_d_take_foreve_afa05c: "我们以为要找到他们会花很长时间，所以我们决定分开行动。我们正在讨论如何进行时，你出现了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_understand_things_we_3c5e2b: "我们明白我们想研究的东西可能很危险，所以我们尽力小心。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_understand_you_don_t_4c6d15: "我们明白你不想伤害任何人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_use_cold_energy_monst_5ff5d3: "我想我们可以利用这个地方怪物的冷能量来打破冰。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ve_asked_soldier_find_87b5cd: "我们已经让一个士兵去找她了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ve_been_trying_both_f9ae9c: "我们一直在努力两件事兼顾，而且只有我们三个人很难做到。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ve_done_nothing_wrong_81e95c: "我们没有做错任何事！"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ve_planned_subdue_meg_b21714: "我们计划征服巨石怪。任何能捕获5个{0}、{1}和{2}的人，请申请。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ve_searched_around_no_111b41: "我们已经搜索过了，但笔记本主人对这个地方的记忆相当模糊和不一致。不同巫师的幻象不断大量频繁地出现。"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_won_t_need_more_66038f: "一旦我们处理了噩梦，就不再需要仪式了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_welcome_2d1613: "== 欢迎……？=="
  npc_override_gef_d01_i_quests_illusion_dungeons_welcome_e52e5e: "欢迎！"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_d3da28: "嗯……？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_first_all_they_mm_bcd0c1: "嗯，首先，它们是……嗯……呃……"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_i_ll_let_chunghae_90c62b: "嗯，我让忠海去弄清楚。"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_i_m_just_here_886c41: "嗯？我只是因为好奇才在这里……"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_icicles_icicles_s_l_2b9b29: "嗯，冰柱就是冰柱。它们又没有什么生平故事，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_if_monster_hunting_32b8a9: "嗯，如果猎杀怪物太麻烦……你可以把我背出去……"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_let_me_take_pieces_c9df33: "……嗯，让我拿^0000CD{0}^00000010块，^0000CD让我先试试^000000拜托。"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_might_just_idea_liv_0a170f: " - ^424242嗯，可能只是活人的想法，{0}很珍贵。^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_technically_she_s_s_116d31: "嗯，严格来说，她还是学徒，但那不重要。"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_then_go_get_them_f5a0fe: "嗯，那你自己去拿。别把东西丢给这个冒险者。"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_there_things_around_2f1c4e: "嗯，这里有我想研究的东西，而且……"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_they_don_t_bother_5255ef: "嗯，只要我和德古拉还有金待在一起，它们就不会打扰我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_went_horribly_wrong_spec_472800: "那事进行得非常糟糕。包围地下墓穴的特殊能量爆炸了，把所有埋在里面的人都带了回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_wh_who_you_c0a594: "你-你是谁？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_89511a: "那是什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_8b0be3: "什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_about_beings_i_just_6fc83a: "那我刚刚交谈的生物呢？我需要告诉卢安达我的经历。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_about_person_left_b_b7f7a5: "那被留下的人呢？他们没有人照顾。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_am_i_supposed_now_c26b07: "我现在该怎么办？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_be65b9: "什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_briashen_said_50df0e: "布里亚申是那么说的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_brings_you_i_sugges_41fe9d: "什么风把你吹来的？我建议你离这个地方远点。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_changed_24d22a: "是什么改变了这一点？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_d2bf75: "什么……"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_did_khahris_me_6700b9: "卡赫里斯对我……做了什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_did_you_give_her_1ee949: "你给了她什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_did_you_say_f7d677: "你说什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_drac_stop_acting_li_bca2f4: "什么？德拉克！别表现得像个人类！我们是骄傲、高贵的吸血鬼！"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_happened_e9ef65: "发生了什么事？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_happened_where_s_br_20aa05: "发生了什么事？乔乔兄弟在哪里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_happened_you_human_265878: "发生了什么？你曾是人类。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_hell_going_156ba7: "到底发生了什么……"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_hell_going_there_d6820b: "那里到底发生了什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_hey_wait_wait_come_7234d8: "什么？嘿，等等！等等！拜托，泽斯！我以为我们是比那更好的朋友！"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_i_as_adventurer_if_a66072: "我能做什么？作为冒险者，如果这个地方不是历史遗址，也没有人的痕迹……我必须去寻找！"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_i_i_t_walk_43c5d3: "我该怎么办？我的腿走不了。我不能传送，因为我没有足够的能量了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_idiot_9254fa: "真是个白痴！"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_if_he_s_responsible_b80739: "如果他对这次事件负责呢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_if_there_s_human_ba6f62: "如果有一个什么都没做只是伤害别人的人类呢。你会对他们怎么办？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_kind_monster_you_wa_dd4d39: "你想要什么样的怪物？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_kinds_ingredients_y_d2510d: "你需要什么样的原料？我会帮你弄来的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_kinds_monsters_you_5da12d: "你想让我处理什么样的怪物？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_looked_like_whirlpo_9aa581: "什么，看起来像漩涡……我以为我要死了……当我醒来时，我发现自己在这个地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_material_you_talkin_e75fbe: "你说的是什么材料？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_mess_96fbed: "真是一团糟……"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_mirko_guy_good_orga_553e81: "什么？但那个米尔科小子很擅长组织事情。他是个好客户。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_missing_members_loo_606576: "失踪的成员长什么样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_no_d276fb: "什么？？不！"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_no_you_ve_made_11460e: "什么？不！你已经和她和好了。是时候离开了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_people_church_917842: "什么教会的人？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_revenge_how_did_you_5a4b95: "- 什么复仇？你是怎么被冻住的？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_front_967cd0: "前面是什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_going_c28e59: "发生了什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_keepsake_you_don_4ef87c: "什么？？这是纪念品！！你甚至不知道西罗德是死是活！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_so_tacky_2168b5: "什么？那太俗气了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_supposed_mean_you_f5512f: "那是什么意思？你是说我不能打僵尸是因为我不是上帝的仆人？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_up_adventurer_6df088: "怎么了，冒险者？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_up_i_m_8c88e1: "怎么了？我现在有点忙……"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_up_i_m_ed253a: "怎么了？我现在很忙，所以我稍后跟你谈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_up_i_need_3a31c4: "怎么了，我现在需要雇用更多的人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_written_unsettlin_ffe27b: "里面写的东西令人不安，但更严重的是？你得自己读。只是不要打开^0000cd最后一页^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_wrong_859caf: "怎么了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_wrong_briashen_al_72d15e: "怎么了？布里亚申还好吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_your_name_aedcdb: "你叫什么名字？{0}？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_your_name_c88dda: "你叫什么名字？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_she_want_ee4379: "她想要什么……"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_should_i_39c970: "我该怎么办？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_should_i_if_i_67d831: "我该怎么办？如果我受那样的伤，更别说搜索了……"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_smell_blood_smell_b_bccff8: "什么？血腥味？从村庄那边传来的血腥味？不会吧？现在不是关注陌生人的时候。我们快走。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_sound_06d245: "什么……是……那个……声音……"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_stupid_story_a48714: "- 什么愚蠢的故事？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_surprise_93008f: "真令人惊讶！"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_treasure_ade691: "什么宝贝？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_we_done_you_c13b81: "我们对你们做了什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_we_get_rid_these_0bfd33: "我们能做些什么来摆脱这些噩梦？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_we_we_re_just_a2e94f: "但我们能做什么呢？我们只是住在这里，怪物不断涌来，所以我们必须在阻挡它们的同时生活。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_what_s_your_name_d02dee: "什么？你叫什么名字？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_whom_maybe_briashen_688109: "什么？给谁？也许是布里亚申？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_business_me_if_3aa1d3: "什么，你找我有事吗？如果没有，走开！"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_doing_here_don_8c8b3b: "你在这里做什么？你没有事要做吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_doing_such_heav_9063eb: "你带着这么重的包在做什么？清理一些空间。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_doing_such_heav_a7a5b0: "你带着这么重的包在做什么？清理一些出来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_doing_such_heav_cf4122: "你带着这么重的包在做什么？清理一些空间。"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_like_7b5260: "你想做什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_mean_8b5b11: "你那是什么意思？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_mean_8cf2de: "你是什么意思……？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_re_going_ask_4b8a9a: "什么，你要去问他？你自己去！"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_talking_about_fb4e69: "你在说什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_talking_about_i_5db8e6: "你在说什么？！我说听完我的整个故事后回去……！"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_think_adventure_aaf144: "你怎么想，冒险者？你会信任一个如此鲁莽的人来处理重要任务吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_think_cd736b: "你觉得呢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_think_defines_h_89cdd5: "你认为什么定义了人类？"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_want_know_most_4f8eed: "你最想知道什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_whatever_reason_agitates_849470: "无论是什么原因激怒了九尾狐的灵魂。"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_comes_out_you_know_041962: "当它出现时，你知道那是胡说八道？但既然布里亚申出来说了那些话……"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_came_back_my_e7449d: "当我恢复意识时，他已经走了，我的腿动不了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_go_back_i_487271: "当我回去时……我什么都没有，但我会给你一些东西作为回报。"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_heard_his_story_34991e: "当我听到他的故事时，我也想去那里……但我做不到他解释的那样。我好难过。"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_heard_sirood_s_e744de: "当我听说西罗德的钓鱼竿被找到时，我跳了起来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_hunt_i_treated_8840d1: "当我狩猎时，我平等对待所有人类因为我是吸血鬼。那是我的规则。"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_think_day_my_d80362: "当我想到那一天，我的心很痛。突然间，当我的兄弟们不在时……"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_turn_into_monster_6556e4: "当我变成怪物时，我希望你阻止我伤害他们。请帮帮我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_she_brought_back_li_02b8cd: "当她被复活时，她非常震惊和愤怒，根本不听我说。"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_situation_here_sort_5e4870: "当这里的情况解决后，我会去找我的哥哥。他一定在痛苦和悲伤中独自一人。"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_there_people_worry_0a054c: "不是在有需要担心的人的时候。"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_they_coming_back_cf4c53: "他们什么时候回来？"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_we_together_large_m_3b3519: "当我们在一起时，一只巨大的玛雅突然出现了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_did_come_fd847e: "它从哪里来的？！"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_heck_you_453627: "你到底在哪里……"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_i_want_see_what_8ea598: "在哪里，我要看看它！！怎么了？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_oh_i_did_again_b709be: "在哪里？哦，我又来了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_real_khahris_1889f7: "== 真正的卡赫里斯在哪里？=="
  npc_override_gef_d01_i_quests_illusion_dungeons_where_s_briashen_607f29: "布里亚申在哪里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_these_guys_keep_po_950c19: "这些家伙从哪里不断冒出来？"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_you_get_all_why_006bbf: "你从哪里得到所有这些？而且为什么你的故事每次都在变？"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_you_going_put_spor_390de3: "你打算把孢子放在哪里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_you_we_couldn_t_fb9b54: "你去哪里了？我们找不到你，我们到处都找遍了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_your_house_523a6b: "你家在哪里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_whew_4049a2: "呼………"
  npc_override_gef_d01_i_quests_illusion_dungeons_whew_i_stayed_up_all_5188f7: "呼，我整夜都在检查干枯的世界树树叶和可疑的五芒星。如果格里姆神父不烦我，我就不必这样。"
  npc_override_gef_d01_i_quests_illusion_dungeons_whew_thanks_1530b2: "呼，谢谢！"
  npc_override_gef_d01_i_quests_illusion_dungeons_whh_what_happened_77d305: "什什……发生了什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_while_you_re_hunt_matte_cd5384: "顺便说一下，猎杀我们周围的^0000cd马特德雷恩利亚^000000。至少有^0000cd10^000000只。"
  npc_override_gef_d01_i_quests_illusion_dungeons_while_you_re_please_hunt_4c7ffd: "而且顺便说一下，请也猎杀^0000cd10个甜蜜噩梦^000000。我想知道那会对梦境产生什么影响。"
  npc_override_gef_d01_i_quests_illusion_dungeons_while_you_re_you_ll_a44c17: "当你这么做的时候，你会吸收从它们身上释放的冷能量。回来拥抱我们，也许你体内的冷能量会破解我们被困在其中的冰。这听起来合理吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_whirlpool_created_soon_14364d: "漩涡很快就会形成。"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_593006: "是谁？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_5b7d9c: "谁？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_am_i_4f7383: "我是谁……？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_am_i_briashen_4aa5d8: "我是谁，布里亚申……？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_c3d8cf: "谁？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_hurt_then_a6cd4b: "那是谁受伤的？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_knew_he_d_freeze_f15685: "谁知道他会用冰把我们冻住？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_knows_00c298: "谁知道呢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_knows_i_might_find_994cc3: "谁知道呢？我可能会找到一种方法来一次性消灭这些僵尸。"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_my_baby_where_you_4ae359: "是谁？我的宝贝，你在哪里？我的女儿？我的……女儿？哈，哈哈哈。我弄丢了她。我弄丢了她"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_my_baby_who_9db991: "是谁？我的宝贝……谁？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_s_coming_all_way_0c25b0: "是谁大老远来到这个阴森的地方？嗯？！真的……那是一次很好的约会。"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_s_strange_mage_d6c534: "那个奇怪的法师是谁？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_says_i_m_obsessed_31c826: "谁说我痴迷于它？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_wants_talk_because_i_eccd66: "谁想谈谈？因为我不想！我不会不战而降的！"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_you_c71f44: "你是谁？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_you_talking_now_909b82: "你现在在和谁说话？"
  npc_override_gef_d01_i_quests_illusion_dungeons_who_you_why_you_here_cc861c: "你^BDBDBD是^000000谁！？你为什么^BDBDBD在^000000这里！"
  npc_override_gef_d01_i_quests_illusion_dungeons_whoa_2d61c2: "哇……"
  npc_override_gef_d01_i_quests_illusion_dungeons_whoops_673143: "哎呀。"
  npc_override_gef_d01_i_quests_illusion_dungeons_whoops_don_t_rush_me_9610f9: "哎呀……别这样催我……"
  npc_override_gef_d01_i_quests_illusion_dungeons_whoops_s_my_turn_go_f90e7d: "哎呀，很快就要轮到我了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_whose_blood_you_t_let_da138b: "那是谁的血？你不能让他喝那个！"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_aren_t_we_getting_291b3a: "为什么我们不已经除掉她了？死者应该回归大地！安托万兄弟！"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_bat_there_other_smal_0a2e48: "但为什么是蝙蝠？还有其他小动物。"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_d77989: "为什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_did_you_throw_away_766fde: "你为什么扔掉它？你为什么待在这里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_didn_t_you_come_e22565: "但你为什么不跟我一起来？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_didn_t_you_leave_47d6db: "你为什么之后不离开？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_don_t_you_go_1158d6: "你为什么不去跟她谈谈？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_don_t_you_go_628848: "你为什么不去休息一下，黎明后再回来？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_haven_t_you_come_8dcfce: "你为什么还没回来……"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_make_people_so_worri_8c3548: "为什么要让人这么担心……"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_only_discovered_now_9b2766: "为什么这现在才被发现，这不是来自某人的信息吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_still_going_away_677cdf: "为什么它仍然……没有消失……"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_t_you_just_leave_662b51: "你为什么不能就让我们一个人待着？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_t_you_yourself_all_92f4dd: "你为什么不能自己做？你所要做的就是弹一下你的手指。"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_bat_form_0cc884: "你为什么是蝙蝠形态？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_dc153a: "你为什么……？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_doing_here_witho_a59ee9: "而且如果你安全的话，为什么不出来却在这里做这些？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_doing_me_what_a88d5e: "你为什么这样对我？我对你做了什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_ignore_my_warnin_439c27: "你为什么无视我的警告？傲慢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_looking_me_b61ff1: "你为什么看着我？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_looking_me_i_b7905f: "你为什么看着我？我什么都没做！"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_looking_me_like_0ee362: "你为什么那样看着我？德古拉需要更多休息。不要打扰他。"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_mumbling_like_b6a1b1: "……你为什么那样嘟囔？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_obsessed_you_rea_3357b6: "你为什么对此如此痴迷？你真的想让这些不洁的生物在大陆上横行吗？你不明白为什么塔禁止这些实验吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_so_excited_see_05a26d: "你为什么见到我这么兴奋？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_standing_here_bee782: "你为什么站在这里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_standing_there_b_e1b48c: "你为什么茫然地站在那里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_think_you_re_2137af: "你为什么认为自己是个怪物？"
  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_want_quit_magic_cece54: "怎么，你想放弃魔法去当小偷吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_widest_deepest_known_tre_f74d34: "已知最宽最深的海沟是伊斯鲁德附近的^4d4dff巴伊亚海沟^000000。"
  npc_override_gef_d01_i_quests_illusion_dungeons_windy_day_i_had_been_be5605: "那个刮风的日子……我一直为没有阻止西罗德去钓鱼而感到非常内疚。"
  npc_override_gef_d01_i_quests_illusion_dungeons_wizard_adventurer_brough_691d50: "巫师！冒险者带来了头发。"
  npc_override_gef_d01_i_quests_illusion_dungeons_wizard_looks_pretty_stro_075e10: "那个巫师看起来很强。"
  npc_override_gef_d01_i_quests_illusion_dungeons_wootan_tribes_causing_lo_c519b5: "乌坦部落给村庄带来很多麻烦。如果你带来3个{0}作为击败它们的证明，我会奖励你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_words_khahris_heard_afar_cec077: "== 卡赫里斯的话语从远处传来，仿佛在水下……=="
  npc_override_gef_d01_i_quests_illusion_dungeons_worked_because_i_m_geniu_305db4: "它奏效了因为我是个天才！你应该感谢我，泽斯！"
  npc_override_gef_d01_i_quests_illusion_dungeons_world_a0d341: "这个世界！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_world_bow_before_mighty_8e72dc: "世界将在纳扎里亚人的强大力量面前低头！！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_wow_purple_sea_s_fantast_b08391: "哇……这片紫色的海……太棒了！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_wow_same_place_another_p_475070: "哇，同一地方在另一个存在平面上！我从未听说过这个！它是如何运作的？这本笔记本一定与此有关。"
  npc_override_gef_d01_i_quests_illusion_dungeons_wow_so_exciting_i_think_64dbcc: "哇……太令人兴奋了！！！我想这是我14年海洋学家生涯中最激动人心的时刻！"
  npc_override_gef_d01_i_quests_illusion_dungeons_wow_so_you_ve_been_d330d1: "哇，所以你一直在这里闲逛是因为那个忘恩负义的女孩。是这样吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_wow_spins_round_round_b857f9: "哇！它转啊转~~！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_wow_these_guys_real_e6cf5b: "哇……这些家伙是真的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_wow_these_so_old_fragile_00ea3d: "哇，这些太古老太脆弱了，我担心它们可能会在我手中碎裂。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yeah_bastard_really_brav_e9813a: "是啊……那个混蛋那时候真的很勇敢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yeah_even_though_same_ro_294568: "是啊！即使是同一条路，我也感觉我在某处越过了界线。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yeah_how_happened_accide_fa5fa9: "是啊。……事情是这样的……那是意外。我意外打破了墙壁……"
  npc_override_gef_d01_i_quests_illusion_dungeons_yeah_i_guess_so_s_17b8f9: "是啊，我想是吧？那也是一张我记得的脸。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yeah_i_suddenly_ran_into_45e2f4: "是啊。我突然跑到了这样一个地方，问你的名字是什么。你有一颗非常坚强的心。它是什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_yeah_thanks_1eead0: "是吗？谢谢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yeah_then_i_ll_waiting_aca053: "是啊……那我会等你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yeah_we_really_need_help_3b52b0: "是啊，我们真的需要帮助。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yelp_again_help_d7ca71: "哎呀！又来了！救命！"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_5397e0: "是"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_96f28d: "是的，{0}。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_as_second_said_s_11f1b1: "是的。正如老二所说，最好快点开始。我感觉不太舒服.."
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_bro_af37ad: "是的，哥哥。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_c53c56: "是的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_could_you_least_proc_e0a2bb: "是的。你能至少帮我 procurement 一下吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_doing_i_felt_more_7e55f1: "是的。那样做，我感觉比以往任何时候都更有活力。我对生命的炽热渴望造就了现在的我。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_his_majesty_here_fcdce5: "是的！！！陛下在这里！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_i_am_going_there_0afca9: "是的。我要去那里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_i_m_fine_01f683: "是的。我很好……"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_i_m_mage_turned_790ac9: "是的，我是法师转行的海洋学家。我为海洋学学习了魔法。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_i_m_sure_s_ae54d4: "是的，我确定！那是我一直看到的钓鱼竿。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_if_you_hate_them_1aaf3d: "是的。如果你那么恨它们，那你为什么不恢复你原来的形态呢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_looks_like_belongs_o_593175: "是的。它看起来像是属于吉芬塔的某个法师的。封面上写着^0000cd波米^000000，我想那是主人的名字。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_my_guild_love_study_1b36c3: "是的，正是。我的公会很想研究这本笔记本。同一时期的大多数记录都已经丢失了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_now_i_know_you_65a84f: "是的。既然我知道你安全了，我该回格里姆神父那里了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_please_should_suffic_fdb908: "是的，拜托！^0000cd20^000000应该够了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_s_about_my_friend_9427e5: "是的，是关于我的朋友。对不起，故事太长了，就再听一点点，听我说完。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_s_mine_uh_my_ac5ec2: "是的……它是我的.. ^BDBDBD呃^000000……我的 ^BDBDBD宝贝^000000……"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_s_right_947c93: "是的！没错！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_s_right_substance_ju_b0b6ac: "是的，没错……这种物质正是那个……像这样重新发现它……"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_s_what_i_wanted_3b4402: "是的。那就是我想说的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_send_me_there_f9fa49: "是的。送我去那里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_she_s_soul_linker_528c71: "是的。她是定期举行仪式的灵魂链接师。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_sirood_fishing_fanat_8ba2d8: "是的……西罗德是个钓鱼狂热者，一有机会就会来这里钓鱼。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_thanks_i_ll_waiting_fb05a4: "是的，谢谢！我会等你！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_we_6c6e1f: "是的，我们知道。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_we_please_bring_me_91aacd: "是的，我们有。请给我带来一些干枯的世界树树叶和五芒星。每种10个听起来不错。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_who_else_as_you_f1e23a: "是的，还有谁？如你所见，我们碰巧把自己困在冰里了。说来话长。如果你放我们出去，我会告诉你一切的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_why_did_you_come_bcc7eb: "是的，你为什么这么快就回来了？我现在不想被打扰。晚点再来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_yes_go_ahead_don_2db0d4: "是的，是的，去吧，别想太多！只要相信我~~！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_yes_yes_i_ll_waiting_00cc9e: "是的是的~ 我会在这里等你！"
  npc_override_gef_d01_i_quests_illusion_dungeons_yet_c524cd: "还没有。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_agreed_our_enthusias_799ef9: "你同意我们对魔法的热情为国家的发展做出了贡献。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_alive_88bfc1: "你还活着吗？？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_all_time_world_i_97a289: "你有世界上所有的时间。我羡慕这一点。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_also_agreed_me_value_a0ac87: "你也同意我关于好奇心的价值。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_any_concerns_e5e971: "你有什么顾虑吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_any_information_abou_56a3ea: "你有关于西罗德的信息吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_asked_me_if_you_1bbc33: "你问过我你是否看起来像人类。记得吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_asking_same_question_0c7dd8: "你在问同样的问题吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_been_here_while_0cdc5c: "你在这里有一段时间了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_brought_again_8e0ed2: "而且你又带来了那个。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_brought_all_them_i_145c75: "你带来了所有的东西。希望我能从中发现什么。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_brought_all_those_dr_24fc30: "你带来了所有那些干树枝。哦，我们还没自我介绍呢。有吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_c09be9: "你……"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_calling_me_6e6fce: "- 你在叫我吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_came_back_quickly_i_b16d11: "你回来得很快。希望你没有忘记任何东西。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_cancel_however_if_yo_9f1dcc: "你可以取消。但是，如果你取消，到目前为止的进度将丢失。你确定要取消吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_cannot_enter_area_be_ee16f6: "- 你的等级太低，无法进入该区域。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_cannot_proceed_becau_e59859: "- 你无法继续，因为你携带的物品太多。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_cannot_proceed_quest_bc7202: "- 你携带的物品太多，无法进行任务。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_carry_me_out_2a2cf1: "你能把我背出去吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_clear_up_your_invent_19f3fb: "你能清理一下你的 inventory 吗？我会在这里等你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_collect_about_2d0920: "你能收集大约20个^0000FF{0}^000000吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_come_back_after_dawn_47679e: "你可以在黎明后回来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_d_better_calm_down_97fc1c: "你最好先冷静下来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_d_better_hurry_326853: "你最好快点。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_d_better_take_break_253c89: "你最好休息一下"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_death_wish_haven_t_b3abc0: "你想找死吗？你没注意到这些蝙蝠有多饿多凶猛吗？它们会抓住任何移动的东西，这些讨厌鬼！帮我处理掉它们，好吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_did_because_you_didn_8f0769: "你那么做是因为你不想失去她。如果我在那种情况下，我也会做同样的事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_don_t_know_how_c7d044: "你不知道世界是怎么运作的。如果你发现什么，就忽略它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_don_t_know_why_3d3ab6: "你不知道为什么，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_don_t_worry_about_2b0a5d: "你不用担心我。正熙可以保证我的安全。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ever_met_me_when_37eda0: "你在我画壁画的时候见过我吗？我不记得了，但是……"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ever_seen_huge_nearb_002d86: "你在附近见过巨大的^ff0000{0}^000000吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_familiar_smell_about_4a8016: "你身上有一种熟悉的气味，冒险者。我渴望这种气味很久了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_feel_beyond_wall_a9b1f4: "你可以在墙的另一边感受到它。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_feeling_little_safer_96982f: "你现在感觉安全一点了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_find_them_if_you_447aa6: "如果你至少猎杀^0000cd5只马特德雷恩利亚和5个霓虹蘑菇^000000，你就能找到它们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_found_jojo_where_he_8a48c1: "你找到乔乔了吗？他在哪里？朱比利已经离开去治疗伤口了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_furry_bastards_8adb00: "你们这些毛茸茸的混蛋！！！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_get_you_collect_abou_b9563e: "你可以得到^0000FF{0}^000000，你能收集大约20个吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_go_back_tell_him_f1aa0a: "你回去告诉他我没事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_go_out_easily_1a9695: "你进进出出很容易。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_go_prontera_s_navi_629686: "你可以像拉凯特告诉你的那样去普隆特拉的<NAVI>[东图书馆]<INFO>prontera,192,264,</INFO></NAVI>。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_going_back_find_leip_4e9649: "你要回去再找莱芬吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_going_back_jerrymon_0ffe01: "你要回杰里蒙那里吗？请小心。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_going_find_briashen_9fbe7c: "你要再去找布里亚申吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_going_there_again_aff6c5: "你又要去那里吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_gone_good_no_need_3d7192: "你会永远消失的。没必要知道。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_gone_yet_b45577: "你走了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_happy_now_they_don_5efa8c: "你现在开心了吗？不过它们看起来和你用的没什么不同。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_hear_something_stran_41f306: "你能听到从北方传来的奇怪声音吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_heard_father_grimm_n_70e43b: "你听到了，格里姆神父。现在让我看看笔记本。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_heard_something_stra_2f97dd: "你听到什么奇怪的声音了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_here_again_today_577d79: "你今天又来了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_here_go_narin_93b43a: "你是来去找纳林的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_here_right_a43b79: "你在这里，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_here_subjugate_us_6a5055: "你是来征服我们的吗？！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_honestly_say_you_tri_c148d3: "你能诚实地说你努力超越了自己的极限吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_human_84fc87: "……？你是人类吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_human_8bc4e2: "你是……人类吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_human_ffe6ed: "……你不是人类吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_i_going_ask_you_0e9257: "你吗？我正想请你帮个忙，但我可以等。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_i_m_watching_you_9e7403: "你！我正在看着你！睡觉时最好把你的棺材盖关紧！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_just_asked_adventure_07b017: "你刚刚让这个冒险者活捉一个僵尸。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_kill_40d86c: "你能杀死^0000FF10 {0}^000000吗，"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_killed_398674: "你杀死了^ff0000{0}^000000吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_know_if_i_paint_e8533e: "你知道吗？如果我提前画好壁画，我在梦中看到的未来会改变吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_know_me_1c34c2: "你认识我吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_know_mirko_687e83: "你认识米尔科吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_know_name_khahris_842c55: "你知道卡赫里斯这个名字吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_know_something_b10fd5: "……你知道什么吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_like_come_me_c4014e: "你愿意跟我一起来吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_like_go_ashore_now_6b7566: "你现在想上岸吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_like_go_deep_sea_a6dcd6: "你想再去深海吗？我会跟着你的！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_like_go_garden_perce_323c87: "你想去感知花园吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ll_get_some_short_7e1465: "你也会得到一些^0000cd短蝙蝠毛^000000，对吧？我需要比你上次带来的多得多的数量。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ll_get_used_soon_0fb2df: "你很快就会习惯的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ll_help_won_t_5060f4: "你会帮忙的，对吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ll_take_care_those_2aa4e5: "你会像上次一样处理那些马特德雷恩利亚，对吧？它们太吵了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_look_like_you_been_665f6c: "你看起来经历了很多事情。我能看出你能够正常交谈。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_looking_khahris_too_f3e5dd: "你也在找卡赫里斯吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_looking_your_baby_d0bb44: "你在找你的宝贝吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_lot_questions_no_nee_b64c8d: "你有很多问题，但没必要知道。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_may_professor_give_y_5714ce: "你可能是教授，但这并不给你权利在这里四处走动。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_mean_dried_yggdrasil_b3df76: "你是说干枯的世界树树叶和一些五芒星。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_mean_studying_me_dra_5b2738: "你是说，研究我和德古拉。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_mean_you_need_help_4a7de8: "你是说你需要帮助。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_met_mirko_0672e2: "你见过米尔科吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_misspelled_efcc14: "你拼错了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_busy_336525: "你一定很忙。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_clue_about_some_de9fb2: "你一定对某事有线索吧？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_kill_bc7636: "你必须杀了它！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_level_above_per_84ff70: "^4D4DFF你必须达到100级或以上才能进行此任务。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_level_above_per_b16f74: "- 你必须达到110级或以上才能进行此任务。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_level_higher_en_6aad25: "^4d4dff你必须达到120级或更高才能进入该区域。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_seen_day_my_ff5824: "你一定见过我和我的兄弟们打猎回来的那一天。村里发生了一场大灾难，就在第二天。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_priests_least_curiou_6746c3: "你们牧师是我认识的最不好奇的人。我要这些是因为我想把它们和我有的进行比较，而且需要敏锐的眼光才能发现微小的差异。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_alive_i_m_06f60e: "你还活着？我很高兴……为什么不带我出去？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_as_experienced_as_6d288f: "你和我听说的一样经验丰富。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_back_c78f7c: "你回来了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_being_chased_ants_7f9dd0: "你被蚂蚁追赶。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_bomi_right_i_84b222: "你是波米，对吧？我读了你的笔记本。发生了什么？这些吸血鬼对你做了什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_brave_a58442: "你很勇敢"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_carrying_too_many_c1b063: "- 你携带的物品太多，无法进行此任务。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_church_i_didn_359648: "你是教会的人。我没想到你会让那些吸血鬼活着。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_dangerous_others_533a18: "但你对他人来说是危险的，不管你喜不喜欢。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_dead_already_3095f8: "你已经死了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_good_enough_earn_8a14bc: "你还不够好，不值得养活。我不敢相信你的公会实际上投资了你。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_here_yet_you_f94d8d: "你在这里，但你不知道他是谁。他是德古拉。你不是来向他挑战战斗的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_letting_her_feed_9ca176: "你在让她喂他，那个吸血鬼？格姆修女，你忘记作为我们领袖的职责了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_pretty_good_b789df: "你相当不错。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_pretty_sharp_adve_59d3c4: "你相当敏锐，冒险者。没错。我向我的公会核实过，发现确实有波米这个人。不过她有一天就消失了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_right_i_m_2e4ba3: "你说得对，我是布里亚申，但你受伤了吗？什么时候？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_saying_strangers_82f4c5: "你对陌生人这么说？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_scaring_him_dbbfb5: "你在吓他。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_thinking_about_wh_7e9286: "你没有考虑它到达这里时可能会造成什么样的危险。你只是想要它，因为你对它很好奇。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ready_b68a42: "你准备好了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_really_came_see_what_38c4fc: "你真的来看看刚才发生了什么。 damage 没有你梦中看到的那么大，但 damage 很多。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_really_de1d5f: "你真的要进去吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_receive_reward_quest_4179cb: "你可以从防御管理者卢安达那里领取此任务的奖励。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_remember_me_4356f7: "你记得我吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_request_take_987a51: "或者你有请求要接受吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_safe_both_you_72a43f: "你们安全了。你们两个都是。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_said_you_looking_som_ed2851: "你说你在找一个叫西罗德的人？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_said_you_saw_fakes_626beb: "你说你上次进去的时候看到了假货？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_saved_jojo_8d8b2e: "你救了乔乔。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_saw_briashen_22c1ae: "你看到布里亚申了？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_saw_too_i_think_d735b5: "你也看到了。我想我们之前谈过。在我的梦中，我看到怪物进城。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_seen_briashen_1acd1d: "你见过布里亚申吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_seen_briashen_yet_e2ee09: "你见过布里亚申了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_seen_person_aee24b: "你见过这个人吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_seen_someone_named_m_c2b1bf: "你见过一个叫慕妍的人吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_should_able_your_eye_090cc7: "你应该闭着眼睛都能做到。你是个巫师。你没学过如何召唤光吗？但当然，如果你在我面前使用魔法，我会把你烧成灰烬。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_shouldn_t_help_someo_318467: "而且你不应该因为某人是谁而不帮助他们。玛丽娜，你真的要因为他不是我们这边的就让他死吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_shouldn_t_say_what_b3d73d: "你不应该那么说。如果我要你的血呢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_show_me_your_fishing_5aabff: "你能给我看看你的钓鱼竿吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_sirood_5d50eb: "你是西罗德吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_so_kind_as_heal_682fa8: "你能好心帮我治疗一下吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_so_kind_as_put_6021cf: "你能好心帮我让他们安息吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_start_quest_level_33fdf6: "^ff0000�� 你可以从150级开始此任务。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_still_alive_9dfb5f: "……你，还活着？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_stop_asking_me_noteb_228daf: "而且你会停止向我要这本笔记本，对吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_subjugation_party_9f6e85: "你是讨伐队的一员吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_sure_s_enough_1a5b4f: "你确定那够了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_sure_what_270a5d: "你确定什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_sure_you_came_me_35dd73: "你确定你是带着那根钓鱼竿作为线索来找我的吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_sure_you_carry_all_023067: "你确定你能携带所有那些东西吗？为什么不减轻一下你的包呢？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_sure_you_want_receiv_4c4b79: "你确定你想接收任务板上的所有任务吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_surprised_6fcc7c: "你很惊讶！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_t_bring_anything_wor_e9d488: "你不能从书内的世界带来任何东西。如果你带了，我会处理掉它们。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_t_go_back_until_6c82d9: "在找到他之前你不能回去"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_t_just_tell_him_59dc09: "你不能就这么告诉他。冒险者，你知道这是什么样的地方，不是吗？我们很急，所以让我快速向你说明情况。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_t_receive_aa6b3d: "- 你无法接收这个。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_t_smelling_me_i_1ce61e: "你不可能在闻我。我已经不再流血了。我已经痊愈了！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_t_you_feel_anything_b93ed8: "你？你除了好气氛之外什么都感觉不到吗？你到底在做什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_taken_look_their_wav_9d86bc: "你有没有看过它们波浪状的鬃毛？看得够久，你会看到闪烁的图像，我相信那些来自其他人的梦境。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_tell_s_empty_when_beecf7: "当你上路时你可以看出它是空的，但在里面时你看不出来。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_tell_stone_contains_05feba: "你可以通过蕴含我魔力的石头来判断。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_there_823406: "你那边！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_think_i_d_give_6af700: "你觉得我会把如此高级的信息给一个我第一次见的陌生人吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_think_notebook_belon_301bc2: "你觉得这本笔记本属于她吗？但它为什么在这里？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_think_one_nightmares_322e64: "你觉得这是慕妍的噩梦之一吗……"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_too_many_items_5e714a: "你携带的物品太多了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_too_many_items_f33594: "- 你携带的物品太多了。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_turning_around_after_e1672a: "你是在听到这个令人心碎的故事和神秘的线索后转身离开吗……"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_two_get_along_as_a2654d: "你们两个相处得和我记忆中一样好。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_two_still_fighting_9e7ab8: "你们两个还在吵架吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ve_collected_all_98d7a0: "你已经收集了所有的{0}！！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ve_finished_dealing_55fc2e: "你已经处理完了所有的深海生物，谢谢你的辛勤工作。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ve_seen_those_nightm_e53048: "你见过那些噩梦和德雷恩利亚，对吧？你有没有注意到它们看起来和外面那些有什么不同？你觉得为什么会这样？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ve_shown_me_adventur_4c4e30: "你给我展示了，冒险者，一些我本来不会看到的东西。我在这里只是告诉你我记得的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_want_enter_notebook_5173ae: "你想进入笔记本吗？你准备好了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_want_get_frozen_agai_269400: "你想再次被冻住吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_want_leave_27af0b: "你想离开吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_want_me_get_their_313c83: "你想让我^0000cd帮你拿它们的鬃毛^000000吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_want_still_someone_g_c4199f: "你想要那个，但还是会有人回到这里。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_we_must_been_really_6cbc26: "你有？我们一定真的很吵。我想那不太明智。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_well_you_re_more_9e8927: "你？嗯，你比这位修女更可靠，但你确定吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_who_saved_aylvar_tha_0ab7e2: "是你救了艾尔瓦。谢谢你帮助我的朋友！"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_won_t_caught_if_ad5378: "如果你咬住那个并屏住呼吸，你不会被抓住的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_worked_hard_a77aac: "你辛苦了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_worried_about_me_as_1a061f: "你担心我，但这就是你愿意跟着我的极限了吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_you_going_2342e8: "你？^BDBDBD你^000000要走吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_you_re_no_better_4fa1bb: "你！你并不比他们好到哪里去！"
  npc_override_gef_d01_i_quests_illusion_dungeons_young_man_disappeared_ag_9910eb: "那个年轻人又消失了。我需要告诉卢安达先生。"
  npc_override_gef_d01_i_quests_illusion_dungeons_young_man_disappeared_di_352b57: "那个年轻人消失了。你不是说这个年轻人是卢安达先生吗？我应该告诉卢安达我的经历。"
  npc_override_gef_d01_i_quests_illusion_dungeons_young_man_finished_what_541d43: "那个年轻人说完就消失了。他一定跟着先走的兄弟们去了。他到底在做什么？"
  npc_override_gef_d01_i_quests_illusion_dungeons_young_scholar_followed_s_cac945: "一位年轻学者跟着士兵走了，但她看起来一点也不可靠。"
  npc_override_gef_d01_i_quests_illusion_dungeons_your_friend_trouble_c90bd3: "你的朋友有麻烦吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_your_heart_i_t_even_3bb5cc: "你的心……我甚至无法想象你嫂子的……呼……你的悲伤……"
  npc_override_gef_d01_i_quests_illusion_dungeons_your_name_ce3cd6: "你的名字是{0}？"
  npc_override_gef_d01_i_quests_illusion_dungeons_your_request_been_receiv_d731b9: "你的请求已被接收。请向^FF0000防御管理者卢安达^000000报告。"
  npc_override_gef_d01_i_quests_illusion_dungeons_your_request_progress_4728ab: "你的请求正在进行中。"
  npc_override_gef_d01_i_quests_illusion_dungeons_your_strength_isn_t_enou_3ff2ab: "你的力量不足以穿越到下层。"
  npc_override_gef_d01_i_quests_illusion_dungeons_zeith_rolled_his_eyes_vr_8912e8: "^ff0000泽斯翻了个白眼，但弗里德无视他继续说道。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_zeith_stared_vrid_incred_918108: "^ff0000泽斯难以置信地盯着弗里德。^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_zombies_mushrooms_same_d_7d4ea5: "僵尸和蘑菇。对我来说都一样。"
