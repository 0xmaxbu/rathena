  npc_override_gef_d01_i_quests_illusion_dungeons_okay_512623: "好的！"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_6fb660: "好的……"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_d54455: "好的"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_fox_bead_completely_eaeec8: "好的，这个狐珠还没有完全净化。"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_go_d0ce0c: "好的，走吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_going_long_story_le_77edca: "好的，这会是漫长的故事。让我先喝点水。"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_huh_3268f8: "好的，哈！"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_i_ll_back_0ef531: "好的，我会回来的。"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_i_ll_back_152a93: "好的，我会回来的"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_i_ll_tell_you_575977: "好的，我会告诉你这个故事。"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_let_s_condense_0a1206: "好的，让我总结一下……"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_let_s_go_502539: "好的。走吧。"
  npc_override_gef_d01_i_quests_illusion_dungeons_okay_let_s_go_please_5d79e1: "好的，走吧！请带路！去最近的地方！"
