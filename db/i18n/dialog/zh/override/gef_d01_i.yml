  npc_override_gef_d01_i_quests_illusion_dungeons_perception_reality_twist_8f1191: "== 感知与现实被扭曲和过度消耗。=="
  npc_override_gef_d01_i_quests_illusion_dungeons_person_c6fffe: "是人吗？"
  npc_override_gef_d01_i_quests_illusion_dungeons_person_who_seemed_gein_s_e83a14: "- 那个似乎是盖因朋友的人在听故事时张开了嘴。-"
  npc_override_gef_d01_i_quests_illusion_dungeons_phew_i_m_struggling_all_6c1e5b: "呼……我突然 struggle 起来了。我是考古学家，不是冒险故事的英雄。"
  npc_override_gef_d01_i_quests_illusion_dungeons_phi_braggart_master_mao_45cefe: "呸~ 吹牛大王，毛大师已经告诉我一切了。"
  npc_override_gef_d01_i_quests_illusion_dungeons_piece_might_clue_please_4cf4c1: "这块碎片可能是个线索。请看一看。"
  npc_override_gef_d01_i_quests_illusion_dungeons_place_7a36c0: "……就是这个地方。"
  npc_override_gef_d01_i_quests_illusion_dungeons_place_called_trench_put_ca3dfe: "那是一个叫^4d4dff海沟^000000的地方。简单来说，你可以把它想象成海中的深崖。"
  npc_override_gef_d01_i_quests_illusion_dungeons_place_so_many_things_i_a6e5a2: "这个地方有太多我想研究的东西，我不知道从哪里开始。哦天哪，看那个噩梦！"
  npc_override_gef_d01_i_quests_illusion_dungeons_place_spitting_image_gef_a9a5be: "这个地方和吉芬地下墓穴一模一样，它可能存在于笔记本主人的记忆中。"
  npc_override_gef_d01_i_quests_illusion_dungeons_place_too_dangerous_you_50a5ee: "这个地方对你来说太危险了。请等你变强后再来。"
