Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_ecl_in01_guides_eclage_all_your_pain_weariness_9b22dc: "在大自然的怀抱中，你所有的痛苦和疲惫都烟消云散。在艾克雷奇诊所恢复你的身心吧。"
  npc_override_ecl_in01_guides_eclage_follow_path_your_left_7a15ef: "走你左边的路。"
  npc_override_ecl_in01_guides_eclage_haven_t_you_seen_our_766598: "你没看到我们为雅伊做的装饰吗？出去走一圈吧。你会看到我们的住宅区。"
  npc_override_ecl_in01_guides_eclage_menu_palace_f6b789: "宫殿:圣树核心:商店:监狱:诊所:住宅区:结束对话"
  npc_override_ecl_in01_guides_eclage_orb_behind_me_like_symbo_0bf5f9: "我身后的圣树核心就像我们拉芬族的标志。"
  npc_override_ecl_in01_guides_eclage_our_great_king_courageou_94d2fd: "我们伟大的国王、勇敢的将军和学者们都住在宫殿里。"
  npc_override_ecl_in01_guides_eclage_palace_located_top_eclag_4af2f9: "宫殿位于艾克雷奇的顶端。我们通常飞到那里，但我看到你没有翅膀。那就走右边的路吧。它会带你到宫殿。"
  npc_override_ecl_in01_guides_eclage_plaza_eclage_you_ll_find_2bada2: "这里是艾克雷奇的广场。你会在这里找到你需要的一切。"
  npc_override_ecl_in01_guides_eclage_prison_place_criminals_w_169962: "监狱是关押罪犯的地方。像你这样的冒险者为什么要去那里？"
  npc_override_ecl_in01_guides_eclage_s_filled_great_mysteriou_74719d: "它充满了伟大而神秘的力量。我们一直密切关注着它，小心翼翼地守护着。"
  npc_override_ecl_in01_guides_eclage_welcome_adventurer_plaza_0d1fd5: "欢迎，冒险者。这里是艾克雷奇的广场，一棵伟大而神圣的树。我能帮你什么吗？"
  npc_override_ecl_in01_guides_eclage_well_s_little_suspicious_937b11: "嗯，有点可疑……但我会告诉你位置。走你左边的路。不过他们不让人进去。"
  npc_override_ecl_in01_quests_14_3_ack_i_hate_guy_224deb: "啊，我讨厌那家伙。"
  npc_override_ecl_in01_quests_14_3_ah_971301: "啊……"
  npc_override_ecl_in01_quests_14_3_ah_cf07cb: "啊！"
  npc_override_ecl_in01_quests_14_3_argh_43ffb4: "啊！"
  npc_override_ecl_in01_quests_14_3_avant_may_repulsive_ecd7b0: "阿凡特可能令人厌恶，"
  npc_override_ecl_in01_quests_14_3_avant_s_new_teleporter_r_fb0250: "阿凡特的新传送器真的被报道了吗？"
  npc_override_ecl_in01_quests_14_3_cancel_ebda43: "取消。"
  npc_override_ecl_in01_quests_14_3_demon_god_s_hideout_fc8e95: "魔神藏身处？"
  npc_override_ecl_in01_quests_14_3_did_you_read_latest_issu_34cb1b: "你读了最新一期的《通往真理之门》杂志吗？"
  npc_override_ecl_in01_quests_14_3_evil_must_nipped_butt_9fab74: "邪恶必须被扼杀在萌芽状态。"
  npc_override_ecl_in01_quests_14_3_finally_his_hideout_been_8b9a9b: "终于，他的藏身处被发现了。"
  npc_override_ecl_in01_quests_14_3_goodbye_619bc3: "再见。"
  npc_override_ecl_in01_quests_14_3_he_dealt_either_banished_8a143a: "他必须被处理掉，要么被驱逐回他的领域，要么被消灭。"
  npc_override_ecl_in01_quests_14_3_he_s_best_what_he_9c2249: "但他是最擅长做这件事的人。"
  npc_override_ecl_in01_quests_14_3_hey_human_5a4adb: "嘿，人类。"
  npc_override_ecl_in01_quests_14_3_his_traces_his_demon_sol_fb93f2: "他的踪迹和他的恶魔士兵主要在中央的巨山附近被发现。"
  npc_override_ecl_in01_quests_14_3_hmm_9c4d28: "嗯……"
  npc_override_ecl_in01_quests_14_3_how_may_i_help_you_cc1359: "我能帮你什么吗？"
  npc_override_ecl_in01_quests_14_3_i_agree_f24f08: "这点我同意。"
  npc_override_ecl_in01_quests_14_3_i_didn_t_quite_understan_15ec74: "我没太听懂。"
  npc_override_ecl_in01_quests_14_3_i_hope_i_return_one_5fba95: "希望我能平安归来。"
  npc_override_ecl_in01_quests_14_3_i_hope_interdimensional_9660fa: "希望这个跨维度装置不会对世界造成沉重的负担。"
  npc_override_ecl_in01_quests_14_3_i_m_nervous_6a787a: "我很紧张。"
  npc_override_ecl_in01_quests_14_3_i_must_been_out_my_1ada88: "我决定参军的时候一定是疯了。唉，为什么《通往真理之门》要放在那么高的地方？"
  npc_override_ecl_in01_quests_14_3_i_only_guess_something_m_d65148: "我只能猜测这与市长的出生有关。"
  npc_override_ecl_in01_quests_14_3_i_wanted_ask_more_he_612593: "我想问更多，但他用鼻孔看我。"
  npc_override_ecl_in01_quests_14_3_i_wonder_if_means_avant_6060b9: "我想知道这是否意味着阿凡特终于决定追求他对研究活动的兴趣。"
  npc_override_ecl_in01_quests_14_3_if_you_cause_doom_oursel_3fe344: "如果你是给我们自己或世界树带来毁灭的原因，那么我们会毫不犹豫地与你战斗。"
  npc_override_ecl_in01_quests_14_3_if_you_re_curious_then_f78d0a: "如果你好奇，那就用那边的传送器去藏身处吧。"
  npc_override_ecl_in01_quests_14_3_if_you_want_join_expedit_1fe727: "如果你想加入讨伐魔神的远征队，那就使用这个传送器。"
  npc_override_ecl_in01_quests_14_3_if_you_want_more_details_47160c: "如果你想了解更多细节，那你应该去现场看看。"
  npc_override_ecl_in01_quests_14_3_just_use_teleporter_over_0822e5: "就用那边的传送器吧。"
  npc_override_ecl_in01_quests_14_3_lemony_you_really_need_w_a686f6: "莱蒙尼，你真的需要努力改善一下你的性格。"
  npc_override_ecl_in01_quests_14_3_ll_destroyed_once_our_op_9bcd55: "一旦我们的行动结束，它就会被销毁，但目前它是我们离不开的东西。"
  npc_override_ecl_in01_quests_14_3_ll_send_you_directly_exp_dd969c: "它会直接把你送到远征营地。"
  npc_override_ecl_in01_quests_14_3_many_warrior_already_lef_7ee2f1: "许多战士已经出发前往藏身处了。"
  npc_override_ecl_in01_quests_14_3_may_yggdrasil_bless_you_410c17: "愿世界树保佑你。"
  npc_override_ecl_in01_quests_14_3_menu_commander_0d8d24: "指挥官:士兵们，终于到你们将训练投入实战的时候了！"
  npc_override_ecl_in01_quests_14_3_menu_commander_2de352: "指挥官:保持专注！我们要消灭魔神！"
  npc_override_ecl_in01_quests_14_3_menu_commander_5cd966: "指挥官:不要辜负在斯普伦迪德前进基地的战友们！"
  npc_override_ecl_in01_quests_14_3_menu_commander_a82c51: "指挥官:啊，突然我看不见了……"
  npc_override_ecl_in01_quests_14_3_menu_commander_c5054d: "指挥官:刚才有人呜咽了吗？"
  npc_override_ecl_in01_quests_14_3_move_demon_god_s_hideout_25db9b: "移动到魔神的藏身处。"
  npc_override_ecl_in01_quests_14_3_move_eclage_751c14: "移动到艾克雷奇。"
  npc_override_ecl_in01_quests_14_3_msg_6eae3a: "……"
  npc_override_ecl_in01_quests_14_3_mwa_hah_hah_s_time_731577: "哇哈哈哈，轮到我大显身手了！"
  npc_override_ecl_in01_quests_14_3_oh_just_so_you_know_bce8d8: "哦，顺便告诉你，你可能会送命。*咯咯笑*"
  npc_override_ecl_in01_quests_14_3_oh_right_you_too_going_985c65: "哦，对了。你也要去那里吗？"
  npc_override_ecl_in01_quests_14_3_only_he_could_pull_off_2ec116: "只有他能做出这种传送器。"
  npc_override_ecl_in01_quests_14_3_only_those_allowed_enter_f77f63: "只有被允许进入藏身处的人才能使用这个传送器。"
  npc_override_ecl_in01_quests_14_3_originally_crack_created_41422a: "最初这个裂缝是魔神为了帮助他逃跑而创造的，"
  npc_override_ecl_in01_quests_14_3_quit_fb25bb: "退出。"
  npc_override_ecl_in01_quests_14_3_s_connected_recently_dis_2c9c28: "它连接着最近发现的魔神藏身处。"
  npc_override_ecl_in01_quests_14_3_s_scientifically_designe_3be399: "它是科学设计的，可以将使用者直接送到他的藏身处所在的维度裂缝。"
  npc_override_ecl_in01_quests_14_3_shush_c38fed: "嘘。"
  npc_override_ecl_in01_quests_14_3_sigh_s_unfair_such_jerk_e988a7: "唉，真不公平，这样一个混蛋却被认为是魔法科学领域最优秀的人。"
  npc_override_ecl_in01_quests_14_3_so_d_been_thought_invest_1d3b22: "所以人们认为调查裂缝就能找到他。"
  npc_override_ecl_in01_quests_14_3_so_long_as_morocc_exists_08a2fc: "只要摩洛克存在，世界树就不安全。我要加入远征队。"
  npc_override_ecl_in01_quests_14_3_teleporter_connected_ecl_8fd02f: "这个传送器连接着艾克雷奇。"
  npc_override_ecl_in01_quests_14_3_teleporter_connected_rec_a0df8c: "这个传送器连接着最近发现的魔神藏身处。"
  npc_override_ecl_in01_quests_14_3_there_quite_spectacle_wa_18a288: "将会有一场相当壮观的场面可看。"
  npc_override_ecl_in01_quests_14_3_tsk_tsk_26ac45: "啧啧。"
  npc_override_ecl_in01_quests_14_3_turns_out_demon_god_ran_69c027: "原来魔神从摩洛克逃跑，躲到了我们的维度。"
  npc_override_ecl_in01_quests_14_3_use_teleporter_414d33: "不要使用传送器。"
  npc_override_ecl_in01_quests_14_3_use_teleporter_move_demo_6538ba: "使用传送器移动到魔神的藏身处。"
  npc_override_ecl_in01_quests_14_3_use_teleporter_move_ecla_513ff8: "使用传送器移动到艾克雷奇。"
  npc_override_ecl_in01_quests_14_3_way_avant_never_fails_am_5d5797: "顺便说一下，阿凡特总是让我惊叹。"
  npc_override_ecl_in01_quests_14_3_we_now_use_those_passage_d17896: "我们现在可以使用那些通道来探索裂缝内部。"
  npc_override_ecl_in01_quests_14_3_what_s_teleporter_849d26: "那个传送器是什么？"
  npc_override_ecl_in01_quests_14_3_when_i_asked_him_he_553e3d: "当我问他时，他嘟囔着关于悔改的事。"
  npc_override_ecl_in01_quests_14_3_why_he_helping_mayor_any_79574c: "不管怎样，他为什么要帮助市长？"
  npc_override_ecl_in01_quests_14_3_why_so_crowded_here_f5e993: "这里为什么这么拥挤？"
  npc_override_ecl_in01_quests_14_3_yeah_yeah_d1a3e7: "是是是。"
  npc_override_ecl_in01_quests_14_3_yes_just_basic_principle_b61be8: "是的，只是基本原理以及与人类相关的信息。"
  npc_override_ecl_in01_quests_14_3_you_always_study_hard_be_dafb6e: "你可以通过努力学习来打败他。"
  npc_override_ecl_in01_quests_14_3_you_eavesdropping_us_wel_71574d: "你在偷听我们说话吗？嗯，虽然我们也没在讨论什么秘密。"
  npc_override_ecl_in01_quests_14_3_you_know_dimensional_cra_e5a26b: "你知道维度裂缝吧？最近发现裂缝是由维度通道组成的。"
  npc_override_ecl_in01_quests_14_3_you_know_hideout_demon_g_059468: "你知道吗，制造了部分时空维度裂缝的魔神的藏身处最近被发现了。"
  npc_override_ecl_in01_quests_14_3_you_re_unexpected_visito_2dfdf7: "你们是来自米德加兹大陆的意外访客。"
  npc_override_ecl_in01_quests_14_3_you_want_use_a0fe34: "你想使用它吗？"
