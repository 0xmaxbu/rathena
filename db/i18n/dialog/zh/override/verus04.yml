Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_verus04_enchan_verus_accessory_962403: "饰品"
  npc_override_verus04_enchan_verus_according_standard_desig_2f053f: "根据标准设计图纸，装备在强化过程中不会损坏，但最大强化次数会根据装备类型而变化。"
  npc_override_verus04_enchan_verus_add_abilities_your_produ_5d03be: "为你的产品添加能力。"
  npc_override_verus04_enchan_verus_additional_atk_every_upg_f05951: "每强化4级，额外ATK +1%。"
  npc_override_verus04_enchan_verus_additional_damage_small_a5025c: "强化至+9时，对小型和中型怪物额外减少5%伤害。"
  npc_override_verus04_enchan_verus_additional_performance_e_6afc64: "用于额外性能装备^990000 ^000000强化。"
  npc_override_verus04_enchan_verus_after_escaping_modified_d62f60: "从改装后的查尔斯顿3号逃脱后，我们来到了这里。"
  npc_override_verus04_enchan_verus_also_available_pilebunck_37bf22: "还提供^FF0000打桩机^000000 ^FF0000强化^000000服务！"
  npc_override_verus04_enchan_verus_although_lcd_still_dim_s_a0afba: "^0000ff虽然液晶屏幕仍然暗淡，但似乎已经无法工作了。^000000"
  npc_override_verus04_enchan_verus_atk_52638e: "ATK+ 5%！"
  npc_override_verus04_enchan_verus_atk_every_upgrade_level_0568a1: "每强化1级，ATK +5。"
  npc_override_verus04_enchan_verus_attack_speed_bonus_every_6b25a0: "每强化2级，攻击速度加成。"
  npc_override_verus04_enchan_verus_because_customized_upgra_f7a39f: "因为是定制强化，请务必穿戴装备。"
  npc_override_verus04_enchan_verus_because_s_iron_each_reso_340c65: "因为不是铁？每种资源回收都不愿意收购，真让人头疼！"
  npc_override_verus04_enchan_verus_blurred_lcd_screen_may_f_9e614c: "模糊的液晶屏幕可能因恐惧或喜悦而剧烈摇晃，也许是由于电力不足而无法完成演示。"
  npc_override_verus04_enchan_verus_bring_huge_metal_scrap_o_918025: "带上巨大的金属碎片和旧燃料，我可以帮你制作对你有用的装备哦~"
  npc_override_verus04_enchan_verus_broken_engines_required_19bdb5: "需要^FF000015个破损引擎^000000。"
  npc_override_verus04_enchan_verus_buy_ad57d9: "购买。"
  npc_override_verus04_enchan_verus_characteristics_data_sho_a28383: "数据显示更多查尔斯顿2号的特征，而操作系统的访问方式更接近查尔斯顿1号。查尔斯顿1号一直是更感性的那个。"
  npc_override_verus04_enchan_verus_charleston_factory_shut_12ac4c: "查尔斯顿工厂关闭了，但它的技术和产品仍与我们同在。"
  npc_override_verus04_enchan_verus_charleston_product_costs_2b543f: "{0}一个查尔斯顿产品需要1个查尔斯顿组件和100,000 Zeny。请知悉所有费用都用于{1}你的产品。"
  npc_override_verus04_enchan_verus_charlestons_destroyed_po_82267e: "查尔斯顿1号和2号已被破坏到无法修复的程度。它们试图互相修复，但无济于事。"
  npc_override_verus04_enchan_verus_choose_cc2777: "选择{0} + {1}，"
  npc_override_verus04_enchan_verus_choose_enchant_you_want_0642ea: "选择你想要使用的附魔！"
  npc_override_verus04_enchan_verus_clothes_0ac111: "衣服"
  npc_override_verus04_enchan_verus_collection_charleston_ad_f5ac65: "是查尔斯顿优点的集合商品，但不能单独出售，如果带来好的零件可以为你交换。"
  npc_override_verus04_enchan_verus_come_back_next_time_you_c92de5: "下次需要我的时候再来吧~"
  npc_override_verus04_enchan_verus_considerable_level_enhan_82cee6: "这是相当高等级的强化装备，这种类型可以赋予强化扩展性能，从以下系列中选择想要强化的！"
  npc_override_verus04_enchan_verus_continue_5ff510: "继续。"
  npc_override_verus04_enchan_verus_course_there_others_like_bff750: "当然还有其他像我们这样在这里进行产品升级的人——我们很幸运从维尔博士的魔爪中逃脱，并遇到了查尔斯顿1号，它拯救了我们所有人。"
  npc_override_verus04_enchan_verus_damage_large_monsters_wh_b3177c: "强化至+7时，对大型怪物减少10%伤害。"
  npc_override_verus04_enchan_verus_damage_small_medium_mons_63fdf1: "对小型和中型怪物减少10%伤害。"
  npc_override_verus04_enchan_verus_dented_iron_plates_a0321f: "^FF0000300个凹陷的铁板^000000，"
  npc_override_verus04_enchan_verus_design_drawings_producti_600cc5: "附魔生产设计图"
  npc_override_verus04_enchan_verus_design_only_first_time_s_d844c0: "此设计仅用于首次强化，但装备还有其他性能，请使用其他设计来强化它！"
  npc_override_verus04_enchan_verus_design_you_choose_incomp_2cfd03: "你选择的设计与该装备不兼容。"
  npc_override_verus04_enchan_verus_did_you_remove_your_gear_f0a8ee: "你卸下装备了吗？"
  npc_override_verus04_enchan_verus_dinosaur_forward_screen_1f2ceb: "^0000ff恐龙前进屏幕出现，并描述可爱女孩的声音。^000000"
  npc_override_verus04_enchan_verus_dinosaurs_gazed_picture_034a2c: "^0000ff恐龙凝视着这里的画面，停留了一会儿后关闭了。^000000"
  npc_override_verus04_enchan_verus_each_upgrade_resetting_a_f04b97: "每次强化/重置尝试花费100,000 Zeny和1个查尔斯顿组件。"
  npc_override_verus04_enchan_verus_eh_i_customer_activating_415500: "诶，有客人吗？激活销售员模式……"
  npc_override_verus04_enchan_verus_energy_response_confirme_28c2f1: "能量响应确认。它正在工作。"
  npc_override_verus04_enchan_verus_enhanced_c73fe5: "强化 {0}"
  npc_override_verus04_enchan_verus_enough_materials_upgrade_fc56b4: "强化材料不足。"
  npc_override_verus04_enchan_verus_enter_name_86c810: "输入一个名字。"
  npc_override_verus04_enchan_verus_equipment_reached_upper_e700c3: "装备已达到强化上限！"
  npc_override_verus04_enchan_verus_equipment_upgraded_maxim_09a3ff: "此装备已强化至最高等级。请带来其他东西。"
  npc_override_verus04_enchan_verus_exchange_reinforced_part_c971fe: "兑换强化部件"
  npc_override_verus04_enchan_verus_exchange_supplementary_d_470df4: "兑换辅助装置"
  npc_override_verus04_enchan_verus_exchange_supplementary_d_a6b9d9: "兑换辅助装置。"
  npc_override_verus04_enchan_verus_exchange_upgrade_parts_37f28e: "兑换升级部件。"
  npc_override_verus04_enchan_verus_exchanged_if_you_find_mo_3fb007: "用10个{0}交换了{1}。如果找到更多零件，再来找我！"
  npc_override_verus04_enchan_verus_first_equipment_been_upg_6eafdb: "第一件装备已强化^990000{0}次^000000。"
  npc_override_verus04_enchan_verus_footgear_ac7e10: "鞋子"
  npc_override_verus04_enchan_verus_garment_cd2d27: "披风"
  npc_override_verus04_enchan_verus_go_c78e14: "继续。"
  npc_override_verus04_enchan_verus_good_commodity_value_unc_6150df: "商品价值不菲，请确认你的钱包深度！"
  npc_override_verus04_enchan_verus_great_design_made_98bb1f: "太好了，设计完成了。"
  npc_override_verus04_enchan_verus_hello_fuel_been_fully_ch_0be82c: "你好！燃料已完全充满。"
  npc_override_verus04_enchan_verus_hello_how_i_help_you_c51e0a: "你好。我能为你做些什么？"
  npc_override_verus04_enchan_verus_hello_i_help_you_934115: "你好！我能帮你吗？"
  npc_override_verus04_enchan_verus_hello_i_m_mars_explorati_42247e: "你好！我是MARS_01，一台探索机器人。目前，我已进入休眠模式以节省电力。相关功能设置如下。"
  npc_override_verus04_enchan_verus_hey_did_you_just_talk_7e0270: "嘿！你刚才和那堆破烂说话了吗？还是我眼花了？"
  npc_override_verus04_enchan_verus_humans_learn_their_mista_7d723e: "人类从错误和失败中学习。这是我从工厂里那些叫做^FF0000书籍^000000的纸质记忆装置中读到的。"
  npc_override_verus04_enchan_verus_i_already_talked_about_p_8ee6c5: "我已经说过制作装备需要^0000ff10个{0}和5个{1}^000000，你不够。"
  npc_override_verus04_enchan_verus_i_also_provide_wider_sel_aaddae: "我还为^ff0000+9^000000或以上的查尔斯顿装备提供更广泛的强化选项。"
  npc_override_verus04_enchan_verus_i_don_t_know_if_c79677: "我不知道新的查尔斯顿是查尔斯顿1号还是2号。我甚至不知道它最想念或最记得什么。"
  npc_override_verus04_enchan_verus_i_don_t_know_where_8867c4: "我不知道你在哪里可以找到查尔斯顿组件，"
  npc_override_verus04_enchan_verus_i_don_t_mean_depreciate_7a12e7: "我不是要贬低自己，但量产版就是量产版；它们性价比高且实用，但永远不如高端版本。"
  npc_override_verus04_enchan_verus_i_feel_so_congested_os_4c2361: "我在操作系统中感到如此拥堵，以至于我发火了。也许我需要整理我的内存。"
  npc_override_verus04_enchan_verus_i_ll_come_back_later_19e43d: "我稍后再来。"
  npc_override_verus04_enchan_verus_i_ll_see_you_next_17f1d7: "下次见！"
  npc_override_verus04_enchan_verus_i_ll_think_about_6080d6: "我会考虑的……"
  npc_override_verus04_enchan_verus_i_ll_upgrading_first_abi_f1c163: "我将强化第一个能力。现有的强化等级和卡片不会损坏。你想继续吗？"
  npc_override_verus04_enchan_verus_i_ll_upgrading_rd_abilit_f88b8c: "我将强化第3个能力。此最高强化阶段有^990000摧毁装备或重置现有强化等级^000000的风险。你想继续吗？"
  npc_override_verus04_enchan_verus_i_ll_upgrading_second_ab_74e546: "我将强化第二个能力。现有的强化等级和卡片不会损坏。"
  npc_override_verus04_enchan_verus_i_m_interested_equipment_6d3933: "我对这件装备不感兴趣。"
  npc_override_verus04_enchan_verus_i_m_mass_version_charles_d6f40c: "我是量产版查尔斯顿。我甚至没有序列号。谁知道制造了多少个我？可能是一百个，也许甚至一千个。"
  npc_override_verus04_enchan_verus_i_m_sorry_equipment_been_cb4614: "抱歉，装备已被摧毁。"
  npc_override_verus04_enchan_verus_i_still_remember_charles_c4479f: "我仍然记得查尔斯顿1号和2号摧毁维尔博士无数生物的情景，就像昨天一样。"
  npc_override_verus04_enchan_verus_i_suggest_you_reconsider_cc8bfe: "我建议你重新考虑。"
  npc_override_verus04_enchan_verus_i_upgrade_charleston_fac_d2b3ee: "我可以升级查尔斯顿工厂的产品。如果你感兴趣，请告诉我。"
  npc_override_verus04_enchan_verus_if_you_bring_aak_seri_62364b: "如果你带来阿克斯·塞里·王推进翼、阿克斯·塞里·王夹克装备和强化设计，我将按照设计强化装备。"
  npc_override_verus04_enchan_verus_if_you_find_enough_charl_00bd7f: "如果你找到足够的查尔斯顿零件，能再来找我吗？"
  npc_override_verus04_enchan_verus_if_you_find_old_fuel_31cdef: "如果你找到旧燃料，请将燃料插入屏幕底部的口中，这样你就可以解除休眠模式。"
  npc_override_verus04_enchan_verus_if_you_find_please_inser_c9fbcd: "如果你找到1个{0}，请将燃料插入屏幕底部的口中，这样你就可以解除休眠模式。"
  npc_override_verus04_enchan_verus_if_you_give_me_i_715035: "如果你给我5个{0}，我可以制作设计图纸给你看！"
  npc_override_verus04_enchan_verus_if_you_more_charleston_c_f7e34e: "如果你有10个或更多查尔斯顿组件，那么我可以将它们与工厂产品交换。"
  npc_override_verus04_enchan_verus_if_you_more_then_i_286381: "但如果你有10个或更多，那么我可以将它们与工厂产品交换。"
  npc_override_verus04_enchan_verus_interrupt_machine_2800a0: "中断机器"
  npc_override_verus04_enchan_verus_introduction_screen_pres_9d2b34: "^0000ff在这个介绍屏幕上，推测机器人制造者的心理状态极不稳定。^000000"
  npc_override_verus04_enchan_verus_items_your_inventory_wei_1ce130: "你背包里的物品太重了。先减轻重量吧。"
  npc_override_verus04_enchan_verus_just_ignore_9de9fd: "别管它。"
  npc_override_verus04_enchan_verus_just_so_you_know_place_6a24d3: "顺便说一下，我们到达时这个地方已经是一片废墟。它的破坏与我们无关。也许……"
  npc_override_verus04_enchan_verus_last_masterpiece_charles_1b18a4: "查尔斯顿工厂的最后杰作！你在其他地方永远找不到如此精良的装备。"
  npc_override_verus04_enchan_verus_let_me_go_equip_77891b: "让我去装备它。"
  npc_override_verus04_enchan_verus_little_dinosaur_running_d5a76d: "^0000ff小恐龙在屏幕上跑来跑去。^000000"
  npc_override_verus04_enchan_verus_making_39931d: "制作 {0}"
  npc_override_verus04_enchan_verus_mars_38d356: "[MARS_01]^0000ff"
  npc_override_verus04_enchan_verus_maximum_number_enchants_5769ee: "最大附魔数量为{0}。该物品已达到上限。"
  npc_override_verus04_enchan_verus_may_pre_scrap_robot_comm_445838: "它可能是一个随处可见的报废前机器人，不需要太多关注。"
  npc_override_verus04_enchan_verus_maybe_charleston_more_li_f5b515: "也许查尔斯顿比我们其他人更像人类。我只是希望她不必如此悲伤。"
  npc_override_verus04_enchan_verus_maybe_we_ran_out_power_27a871: "也许我们在寻找燃料时耗尽了电力。我们应该加燃料吗？"
  npc_override_verus04_enchan_verus_mechanic_only_72d52b: "仅限机械工匠。"
  npc_override_verus04_enchan_verus_mechanic_only_9e04d5: "^FF0000仅限机械工匠^000000"
  npc_override_verus04_enchan_verus_mechanic_only_comes_card_614d5d: "仅限机械工匠。附带1个卡片插槽。"
  npc_override_verus04_enchan_verus_memories_humans_fade_get_6aafca: "人类的记忆会随着时间的推移而消退、扭曲或美化。"
  npc_override_verus04_enchan_verus_menu_atk_0aaefd: "ATK: 450"
  npc_override_verus04_enchan_verus_menu_atk_3b7452: "ATK: 400"
  npc_override_verus04_enchan_verus_menu_charleston_fbfa5f: "查尔斯顿工厂最畅销的商品:^FF0000升级零件板^000000和^FF0000补充零件力量^000000现已发售！"
  npc_override_verus04_enchan_verus_menu_class_28a2f6: "类型:钝器"
  npc_override_verus04_enchan_verus_menu_class_5b5d84: "类型:铠甲，不可破坏。"
  npc_override_verus04_enchan_verus_menu_price_31835b: "^FF0000价格:3,999,999 Zeny^000000"
  npc_override_verus04_enchan_verus_menu_quit_073ffc: "退出。:{0}"
  npc_override_verus04_enchan_verus_menu_required_7b4117: "需求等级:100"
  npc_override_verus04_enchan_verus_menu_required_835b06: "需求等级:130"
  npc_override_verus04_enchan_verus_menu_weapon_5b0a03: "武器等级:4"
  npc_override_verus04_enchan_verus_menu_weight_30c8f0: "重量:400"
  npc_override_verus04_enchan_verus_menu_weight_31362c: "重量:300"
  npc_override_verus04_enchan_verus_menu_weight_4bcdc1: "重量:350"
  npc_override_verus04_enchan_verus_menu_weight_665942: "重量:200"
  npc_override_verus04_enchan_verus_more_information_24dbab: "更多信息。"
  npc_override_verus04_enchan_verus_msg_1aff49: "{0}，"
  npc_override_verus04_enchan_verus_msg_2e2f08: "----------"
  npc_override_verus04_enchan_verus_msg_6e4401: "^000000------------------"
  npc_override_verus04_enchan_verus_msg_fca926: "^990099{0}^000000？？"
  npc_override_verus04_enchan_verus_no_problem_come_back_if_5d4270: "没问题。如果你改变主意，再回来。"
  npc_override_verus04_enchan_verus_note_2c924e: "注意"
  npc_override_verus04_enchan_verus_number_equipment_reached_d2fe5a: "装备数量已达上限。"
  npc_override_verus04_enchan_verus_oh_haven_t_you_heard_c226ba: "哦，你没听说吗？哎呀，我的错。请忘记我说过的话。"
  npc_override_verus04_enchan_verus_oh_my_god_t_sold_cfc762: "哦，我的天！那个不能卖给回收站！"
  npc_override_verus04_enchan_verus_old_fuel_huge_metal_scra_9dcd98: "旧燃料和巨大金属废料用于兑换装备。"
  npc_override_verus04_enchan_verus_old_robot_may_running_ou_594e73: "旧机器人可能电量耗尽，完全没有反应。"
  npc_override_verus04_enchan_verus_only_zeny_get_yourself_u_922bc5: "仅需^FF00003,999,999^000000 Zeny！获取超高性能行动装备！"
  npc_override_verus04_enchan_verus_original_charleston_stan_78f529: "原来的查尔斯顿站在那里，但是……"
  npc_override_verus04_enchan_verus_picture_shows_dinosaur_s_84c662: "^0000ff画面显示恐龙默默地看着空碗，这可能是材料不足时的错误信息！^000000"
  npc_override_verus04_enchan_verus_pilebuncker_21aa11: "^FF00001个打桩机^000000，"
  npc_override_verus04_enchan_verus_pilebuncker_p_64a726: "打桩机 P"
  npc_override_verus04_enchan_verus_pilebuncker_s_05eb9f: "打桩机 S"
  npc_override_verus04_enchan_verus_pilebuncker_t_e3e703: "打桩机 T"
  npc_override_verus04_enchan_verus_please_contact_administr_5134ab: "请联系管理员。"
  npc_override_verus04_enchan_verus_please_make_sure_you_re_ad39ee: "请确保你穿戴了想要升级的装备。"
  npc_override_verus04_enchan_verus_please_pay_special_atten_e73156: "请特别注意装备是否会被移除。"
