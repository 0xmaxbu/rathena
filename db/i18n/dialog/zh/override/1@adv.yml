Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@adv_VillaofHighPriest_a_0a8a42: "..啊.."
  npc_override_1@adv_VillaofHighPriest_adventurer_came_far_help_89cd18: "冒险者远道而来帮助我们。"
  npc_override_1@adv_VillaofHighPriest_adventurer_didn_t_you_co_27f2ee: "冒险者……你不是一个人来的吗？"
  npc_override_1@adv_VillaofHighPriest_adventurer_please_find_a_ca71b4: "冒险者，请去找另一位员工，向他询问关于宅邸的事。"
  npc_override_1@adv_VillaofHighPriest_adventurer_please_let_me_af1757: "冒险者，如果调查完成后扭曲之神的身份被揭露了，请告诉我。"
  npc_override_1@adv_VillaofHighPriest_adventurers_always_seek_4c11e5: "冒险者总是在追求力量。"
  npc_override_1@adv_VillaofHighPriest_appears_several_villa_s_c36a81: "看起来有几位宅邸的员工被困在里面了。"
  npc_override_1@adv_VillaofHighPriest_apply_7c4cb4: "申请「{0}」。"
  npc_override_1@adv_VillaofHighPriest_atmosphere_so_heavy_i_co_28fb19: "气氛太沉重了，我甚至无法开口询问。"
  npc_override_1@adv_VillaofHighPriest_bagot_please_continue_ri_9cd3f7: "巴戈特，请继续仪式。"
  npc_override_1@adv_VillaofHighPriest_being_vessel_god_descend_4d6a56: "作为神明降临的容器，对本大爷来说完全没问题！"
  npc_override_1@adv_VillaofHighPriest_bow_down_feet_god_reborn_423500: "在神的脚下跪拜，重生为神的仆人吧！"
  npc_override_1@adv_VillaofHighPriest_chapel_been_sealed_off_18cc2e: "礼拜堂已经被封锁了。"
  npc_override_1@adv_VillaofHighPriest_chapel_reached_going_up_93a4a3: "沿着中央楼梯上去，经过宴会厅就能到达礼拜堂。"
  npc_override_1@adv_VillaofHighPriest_coming_far_normal_f2c785: "能走到这里可不寻常。"
  npc_override_1@adv_VillaofHighPriest_could_pope_359d7a: "难道是教皇？！"
  npc_override_1@adv_VillaofHighPriest_doesn_t_matter_93045b: "但这无关紧要。"
  npc_override_1@adv_VillaofHighPriest_don_t_worry_about_me_1b5517: "别担心我。我会守在门附近，如果有危险就立刻离开。"
  npc_override_1@adv_VillaofHighPriest_door_won_t_budge_4b4aa5: "门纹丝不动。"
  npc_override_1@adv_VillaofHighPriest_embryo_fell_out_331ae8: "这个胚胎掉了出来。"
  npc_override_1@adv_VillaofHighPriest_entrance_villa_key_entra_b3436a: "宅邸的入口？钥匙就在入口处。"
  npc_override_1@adv_VillaofHighPriest_feels_like_strong_magica_0d097d: "感觉有一股强大的魔力在阻挡着门。"
  npc_override_1@adv_VillaofHighPriest_firmly_locked_door_6cbf4d: "紧紧锁住的门。"
  npc_override_1@adv_VillaofHighPriest_first_all_you_adventurer_a3167d: "首先，你就是那位冒险者吗？"
  npc_override_1@adv_VillaofHighPriest_first_shall_we_get_some_1ac09e: "首先，我们先从宅邸员工那里获取一些信息吧？"
  npc_override_1@adv_VillaofHighPriest_go_up_central_stairs_pas_efe922: "沿着中央楼梯上去，经过宴会厅，就能到达礼拜堂。"
  npc_override_1@adv_VillaofHighPriest_ha_didn_t_i_clearly_8a8c73: "哈……我不是明明告诉过你要全部清理干净吗？怎么还有老鼠？"
  npc_override_1@adv_VillaofHighPriest_he_s_talent_you_don_62fca2: "他是个不可多得的人才。"
  npc_override_1@adv_VillaofHighPriest_here_s_key_side_door_5ce83d: "这是侧门的钥匙。"
  npc_override_1@adv_VillaofHighPriest_here_s_proof_miracle_4b6bd7: "这就是证据。奇迹~"
  npc_override_1@adv_VillaofHighPriest_hm_could_you_please_chec_483484: "嗯？请确认一下队伍领袖是否申请了进入宅邸？"
  npc_override_1@adv_VillaofHighPriest_how_about_joining_hands_33558d: "不如与我们联手如何？"
  npc_override_1@adv_VillaofHighPriest_how_dare_you_017252: "你好大的胆子！"
  npc_override_1@adv_VillaofHighPriest_how_rude_you_my_masterpi_74ef52: "你竟敢对我的杰作如此无礼？！"
  npc_override_1@adv_VillaofHighPriest_huh_73fef0: "嗯？"
  npc_override_1@adv_VillaofHighPriest_i_also_heard_someone_tel_737c7c: "我刚才也听到有人让我离开。这是大规模裁员的前兆吗！？"
  npc_override_1@adv_VillaofHighPriest_i_descend_being_form_god_4fcf34: "我将降下一位以神明形态存在的存在！"
  npc_override_1@adv_VillaofHighPriest_i_didn_t_think_you_148b8f: "我没想到你竟然如此愚蠢。"
  npc_override_1@adv_VillaofHighPriest_i_feel_sharp_presence_be_f9b4d4: "我感觉到中央楼梯的另一端有一股锐利的气息。"
  npc_override_1@adv_VillaofHighPriest_i_feel_unknown_magical_p_d751da: "我感觉到一股未知的魔力。"
  npc_override_1@adv_VillaofHighPriest_i_hope_you_live_forever_37e38f: "希望你永远活着~"
  npc_override_1@adv_VillaofHighPriest_i_ll_analysis_here_82f2cf: "我会在这里进行分析。"
  npc_override_1@adv_VillaofHighPriest_i_ll_go_employee_80f589: "我去找那位员工。"
  npc_override_1@adv_VillaofHighPriest_i_ll_go_so_adventurer_b05084: "我去啦~ 那么冒险者？你好~！"
  npc_override_1@adv_VillaofHighPriest_i_ll_guard_so_go_92e4aa: "我来守卫，你进去吧。"
  npc_override_1@adv_VillaofHighPriest_i_m_worried_about_missin_053c27: "我担心伊米尔之心碎片失踪的事。"
  npc_override_1@adv_VillaofHighPriest_i_made_promise_so_i_d82888: "我做出了承诺，所以我会遵守。你明白吗？"
  npc_override_1@adv_VillaofHighPriest_i_need_take_care_my_72486d: "我需要照顾我的父亲，所以我们先离开这里吧。"
  npc_override_1@adv_VillaofHighPriest_i_see_c52c6e: "原来如此。"
  npc_override_1@adv_VillaofHighPriest_i_see_male_employee_over_147a5a: "我看到那边有一位男性员工。"
  npc_override_1@adv_VillaofHighPriest_i_show_miracles_arrogant_6f24c3: "我将向傲慢的奥丁仆从展示奇迹。"
  npc_override_1@adv_VillaofHighPriest_i_spare_key_because_door_e1a28d: "我有一把备用钥匙，因为我通常就是从这个门送食物的。"
  npc_override_1@adv_VillaofHighPriest_i_take_care_my_father_8fe596: "我会照顾我的父亲。"
  npc_override_1@adv_VillaofHighPriest_i_take_those_people_evac_cbf09e: "我会带着那些人撤离。"
  npc_override_1@adv_VillaofHighPriest_i_think_i_communicate_be_48ee5e: "我觉得我比那个固执的家伙更善于沟通。"
  npc_override_1@adv_VillaofHighPriest_i_think_i_should_check_1f698b: "我想我应该检查一下是否还有其他员工，然后上二楼。"
  npc_override_1@adv_VillaofHighPriest_i_used_spare_key_4f449f: "我使用了备用钥匙。"
  npc_override_1@adv_VillaofHighPriest_if_s_about_inciting_trou_a6bca2: "如果是为了煽动骚乱，神殿里发生的事已经足够了。"
  npc_override_1@adv_VillaofHighPriest_if_we_leave_like_all_6b9b0d: "如果我们就这样离开，这里的所有人都会被处置掉。"
  npc_override_1@adv_VillaofHighPriest_if_you_companions_i_reco_d9e1a8: "如果你有同伴，我建议一起去。"
  npc_override_1@adv_VillaofHighPriest_if_you_look_embryo_falle_67acc9: "如果你看看那个掉落的胚胎，一定是那个叫巴戈特的人创造的东西。"
  npc_override_1@adv_VillaofHighPriest_if_you_re_ready_shall_798145: "如果你准备好了，要我带你前往宅邸吗？"
  npc_override_1@adv_VillaofHighPriest_if_you_re_stubborn_guy_298074: "如果你是个固执的人，那是什么意思？"
  npc_override_1@adv_VillaofHighPriest_if_you_try_go_down_69bc91: "如果你再次试图走上错误的道路，我必须阻止他。"
  npc_override_1@adv_VillaofHighPriest_indeed_c8b181: "确实……"
  npc_override_1@adv_VillaofHighPriest_investigate_chapel_somet_6abe58: "调查礼拜堂！这里绝对有可疑之处！"
  npc_override_1@adv_VillaofHighPriest_k_f64a43: "咔……"
  npc_override_1@adv_VillaofHighPriest_kind_name_talent_who_bec_46f7c3: "就是那种名字。一个只要改变他那老派性格就能变得更强的人才。"
  npc_override_1@adv_VillaofHighPriest_kyaaaaaaaaaaa_79949c: "呀啊啊啊啊啊啊啊——！"
  npc_override_1@adv_VillaofHighPriest_let_s_get_out_here_5ea330: "我们先离开这里吧。"
  npc_override_1@adv_VillaofHighPriest_like_temple_too_ef8466: "神殿里也是这样。"
  npc_override_1@adv_VillaofHighPriest_looks_doesn_t_look_like_1574a8: "从样子来看，你似乎不会接受我们的提议啊。"
  npc_override_1@adv_VillaofHighPriest_looks_like_they_blinded_b8611b: "看来他们连我的父亲也蒙蔽了。"
  npc_override_1@adv_VillaofHighPriest_lowly_servant_witnessed_c05625: "卑微的仆从已经见证了神的奇迹！"
  npc_override_1@adv_VillaofHighPriest_magic_splendid_knight_al_e99548: "那位华丽骑士的魔力已经消失了。"
  npc_override_1@adv_VillaofHighPriest_meantime_i_kept_my_promi_4653b1: "与此同时，我遵守了承诺，因为我让你以^4d4dff强烈的滋味^000000活了下来。"
  npc_override_1@adv_VillaofHighPriest_memorial_dungeon_request_3c4dd9: "纪念地下城的申请必须由队伍领袖进行。^000000"
  npc_override_1@adv_VillaofHighPriest_memorial_event_215b18: "^4d4dff 这是一个纪念事件。"
  npc_override_1@adv_VillaofHighPriest_menu_a_0eb707: "被称为神的存在：..a.."
  npc_override_1@adv_VillaofHighPriest_menu_a_5892c7: "被称为神的存在：咔咔咔……？咔咔咔咔呀哈哈哈哈哈哈！！"
  npc_override_1@adv_VillaofHighPriest_menu_a_7d0097: "被称为神的存在：咔咔咔咔咔咔 啊啊啊啊啊！！！！"
  npc_override_1@adv_VillaofHighPriest_menu_a_84de34: "被称为神的存在：呀哈哈哈哈哈哈！！"
  npc_override_1@adv_VillaofHighPriest_menu_a_98e1db: "被称为神的存在：咔咔咔咔 咔咔咔咔 咔咔咔咔"
  npc_override_1@adv_VillaofHighPriest_menu_a_b149e3: "被称为神的存在：……"
  npc_override_1@adv_VillaofHighPriest_menu_a_c10c19: "被称为神的存在：……"
  npc_override_1@adv_VillaofHighPriest_menu_a_f515bc: "被称为神的存在：..我们.."
  npc_override_1@adv_VillaofHighPriest_menu_a_f7b197: "被称为神的存在：咔……"
  npc_override_1@adv_VillaofHighPriest_menu_a_fc6624: "被称为神的存在：咔咔咔咔 咔咔咔咔 ……"
  npc_override_1@adv_VillaofHighPriest_menu_amal_00c2ae: "阿马尔：胡说八道！米里亚姆，让开！"
  npc_override_1@adv_VillaofHighPriest_menu_amal_0f55c4: "阿马尔：卑微的仆从已经见证了神的奇迹！"
  npc_override_1@adv_VillaofHighPriest_menu_amal_35b3ba: "阿马尔：哦……哦……！美丽的芙蕾雅……！你就是我的神吗？"
  npc_override_1@adv_VillaofHighPriest_menu_amal_48c0de: "阿马尔：他们将亲自见证芙蕾雅的奇迹。跪拜吧，重生为神的仆人！"
  npc_override_1@adv_VillaofHighPriest_menu_amal_51fac2: "阿马尔的声音：哦，神啊——！！！"
  npc_override_1@adv_VillaofHighPriest_menu_amal_56fcba: "阿马尔：哦……芙蕾雅！请惩罚这些异端！"
  npc_override_1@adv_VillaofHighPriest_menu_amal_61ab60: "阿马尔：……？怎么了，我的神？您卑微的仆从已准备好聆听预言……"
  npc_override_1@adv_VillaofHighPriest_menu_amal_8beb98: "阿马尔：这些可恶的异端不知怎的竟然走到了这里。但你很快就会跪倒在至高无上的神性面前。"
  npc_override_1@adv_VillaofHighPriest_menu_amal_99d4ba: "阿马尔：我将向傲慢的奥丁仆从展示奇迹。巴戈特，请继续仪式。"
  npc_override_1@adv_VillaofHighPriest_menu_amal_a9cabf: "阿马尔：……哦天哪……不能这样……"
  npc_override_1@adv_VillaofHighPriest_menu_amal_b60c79: "阿马尔：哦……哦……！我美丽的女神芙蕾雅……！"
  npc_override_1@adv_VillaofHighPriest_menu_amal_c9734d: "阿马尔：……我感觉不到任何神力……？为什么……？"
  npc_override_1@adv_VillaofHighPriest_menu_amal_dab5ae: "阿马尔：这不可能！放开我，米里亚姆！"
  npc_override_1@adv_VillaofHighPriest_menu_amal_f481b4: "阿马尔：神怎么能惩罚我，一个忠诚的芙蕾雅仆从？"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_0d4839: "巴戈特：什么？你救了他？你看到祭司了吗？巴戈特说了什么？我说这是可能的。"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_500bd2: "巴戈特：希望你永远活着~"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_511e8f: "巴戈特：你害怕我连神明降临的容器都能创造的能力吗？"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_5ed53b: "巴戈特：作为神明降临的容器，对本大爷来说完全没问题！"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_62ebc8: "巴戈特：嗒哒~ 科学与魔法的精髓就在这里！"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_718acd: "巴戈特：你到底有没有在听？舒朗是有点浪费，但那就是他的结局了。"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_992189: "巴戈特：你就是那位冒险者吗？想看看我的作品吗？"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_a97ff7: "巴戈特：你没在听我说话。那是什么？哦~！是的，奇迹。"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_aacac9: "巴戈特：那是什么声音？"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_b1b13a: "巴戈特：既然我按照承诺召唤了你的神，我就带走心了。"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_bb74ca: "巴戈特：哇……你说话的方式……真是灵感。总之，我做出了承诺，所以我会遵守。"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_d24406: "巴戈特：我遵守了承诺，因为我已经能够以「强烈的滋味」活了一段时间。那么冒险者？你好~！"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_f87432: "巴戈特：能够立刻检查实验结果的感觉真好。"
  npc_override_1@adv_VillaofHighPriest_menu_crying_8739f6: "哭泣的声音：天哪！你怎么了！救救我！"
  npc_override_1@adv_VillaofHighPriest_menu_hans_2dcb9d: "汉斯：小姐！请带我一起走！"
  npc_override_1@adv_VillaofHighPriest_menu_hans_380bad: "汉斯：宅邸的气氛很不寻常。所有的侍祭都武装起来了。"
  npc_override_1@adv_VillaofHighPriest_menu_ira_1ad8b4: "艾拉：他们似乎武装起来了。"
  npc_override_1@adv_VillaofHighPriest_menu_ira_2d0993: "艾拉：找到二楼宴会厅的钥匙。那边一定有什么东西！"
  npc_override_1@adv_VillaofHighPriest_menu_ira_59fe80: "艾拉：给你。应该没问题，因为只有用户会去一楼。"
  npc_override_1@adv_VillaofHighPriest_menu_ira_a0c420: "艾拉：别担心我。你们两个小心点。"
  npc_override_1@adv_VillaofHighPriest_menu_ira_f844bf: "艾拉：那里住着一群祭司。我不知道他们是否真的是祭司。"
  npc_override_1@adv_VillaofHighPriest_menu_leader_4d6811: "领袖：{0}"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_0b8ec9: "米里亚姆：你刚才差点就死了。看清楚了。那个邪恶的存在哪一部分是神？"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_0bc322: "米里亚姆：现在有尖叫声！发生什么事了？"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_1856ad: "米里亚姆：冒险者，请先进去。汉斯先生，我们一起走。"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_1eb772: "米里亚姆：父亲！"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_232952: "米里亚姆：冒险者，我们要不要分一下工？"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_283b73: "米里亚姆：艾拉！！"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_39ea4b: "米里亚姆：看来你需要睁开眼睛了。父亲。"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_518d1f: "米里亚姆：冒险者！请阻止他们！我会处理这边并疏散所有人！"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_530bcf: "米里亚姆：我担心失踪的伊米尔之心。神殿里发生的事已经足够了。"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_537212: "米里亚姆：请把这里交给我，去处理二楼的猎心者。"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_555464: "米里亚姆：把这里交给我，去处理二楼的猎心者。"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_5bfcc8: "米里亚姆：你在干什么！！！！"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_5df66c: "米里亚姆：我去找那位员工。冒险者，请去找另一位员工。"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_6d0041: "米里亚姆：里面的人。我来护送你们。我们出去吧。"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_74b39c: "米里亚姆：我想一定出什么事了。我们去找艾拉。"
