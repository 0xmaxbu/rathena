  npc_override_geffen_in_geffen_was_his_wife_d72dba: "- 是他的妻子 -"
  npc_override_geffen_in_geffen_wasn_t_because_whole_dra_f2caea: "不是因为那个系带的问题吧？"
  npc_override_geffen_in_geffen_wasn_t_for_me_leave_gi_f46b56: "我离开吉芬并不是为了离开这座城市。我离开是因为我想看看这个世界。"
  npc_override_geffen_in_geffen_we_ll_meet_again_someday_a5908f: "总有一天我们会再见面的。"
  npc_override_geffen_in_geffen_we_pretty_much_only_serv_5b9557: "我们这里基本上只提供水。还有非常难喝的仿制酒。"
