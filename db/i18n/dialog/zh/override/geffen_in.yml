Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_geffen_in_geffen_a_511348: "什……"
  npc_override_geffen_in_geffen_actually_i_m_wizard_d0fb68: "其实，我是巫师。"
  npc_override_geffen_in_geffen_actually_sir_i_m_sage_293ca1: "其实，先生，我是贤者。"
  npc_override_geffen_in_geffen_adventurer_bf45b3: "一名冒险者吗？"
  npc_override_geffen_in_geffen_adventurers_pay_blacksmi_ba1e0b: "冒险者们会用辛苦赚来的 Zeny 向铁匠购买只有他们才能打造的高品质武器。"
  npc_override_geffen_in_geffen_after_becoming_well_expe_c5ae1b: "在积累了丰富的魔法使用经验后，法师就有资格成为巫师。"
  npc_override_geffen_in_geffen_after_i_realized_i_neede_d336e0: "那之后，我意识到我需要某种武器来对抗敌人的远程攻击。一种能从远处攻击的武器……"
  npc_override_geffen_in_geffen_after_no_one_could_ever_8e9bbf: "从那以后，再也没有人能见到"
  npc_override_geffen_in_geffen_ah_971301: "啊……"
  npc_override_geffen_in_geffen_ah_duuuuuude_you_re_brea_403535: "老兄啊～你伤了我的心！这个价格，我简直是在做慈善！"
  npc_override_geffen_in_geffen_ah_old_flame_return_i_c58f66: "啊！旧情人将会回来！我不知道他们是会重新爱上你，向你借钱，还是回来复仇的……"
  npc_override_geffen_in_geffen_ah_yes_jellopy_f01345: "啊对，果冻。"
  npc_override_geffen_in_geffen_ah_yes_let_me_contact_a6bc8b: "啊好的。让我联系一下灵界。他们通常有很好的理财建议，尽管那边根本没有什么经济体系。"
  npc_override_geffen_in_geffen_ah_yes_they_telling_me_fb37b3: "啊对了。他们告诉我，凡事都要适度。当然，你必须确保支出不要超过预算。"
  npc_override_geffen_in_geffen_ah_you_into_potions_eh_544fbb: "啊，你对药水感兴趣，是吧？"
  npc_override_geffen_in_geffen_al_de_baran_who_had_341948: "在艾尔帕兰，他有4个儿子。"
  npc_override_geffen_in_geffen_all_8c0bbc: "拥有一切！"
  npc_override_geffen_in_geffen_all_they_seem_know_f9743e: "他们好像只知道"
  npc_override_geffen_in_geffen_alright_i_got_2c0713: "好了，我算到了！"
  npc_override_geffen_in_geffen_alright_i_got_something_803807: "好了，我算到了。嗯嗯嗯，你会活到非常非常老。你问多老？"
  npc_override_geffen_in_geffen_also_you_ll_always_succe_df8ded: "而且，你总是会成功的。你会在人生中成功地赢，也会成功地输！"
  npc_override_geffen_in_geffen_although_pressure_may_hi_fd5688: "虽然压力可能很大，但请记住，在兴奋中做出的决定通常是糟糕的。深呼吸，放松一下。"
  npc_override_geffen_in_geffen_although_you_formally_tr_93320e: "虽然你没有正式接受过魔法训练，但你所使用的技能汲取了来自异界的能量，无论你是否意识到这一点……"
  npc_override_geffen_in_geffen_although_you_may_able_us_2dcf3b: "虽然你现在还不能使用魔法或其他强大的技能，但这些知识在未来可能会有用，年轻的初学者……"
  npc_override_geffen_in_geffen_anyone_could_as_strong_a_9864c9: "有了它，任何人都能像赫拉克勒斯一样强大……连我这样的弱者也能！哈哈哈哈哈，"
  npc_override_geffen_in_geffen_anything_04126e: "什么忙吗？"
  npc_override_geffen_in_geffen_anyway_7479d2: "总之……"
  npc_override_geffen_in_geffen_aren_t_you_going_give_dd2ecf: "你不送我个刀鞘吗？"
  npc_override_geffen_in_geffen_arrrrrgh_fb4e48: "啊啊啊啊～！"
  npc_override_geffen_in_geffen_artistic_my_taste_284059: "太前卫了。"
  npc_override_geffen_in_geffen_atmosphere_87d511: "一种氛围。"
  npc_override_geffen_in_geffen_awfully_lazy_today_dde960: "今天懒得很。"
  npc_override_geffen_in_geffen_awww_daa9b8: "哎……"
  npc_override_geffen_in_geffen_back_when_boring_9e5f12: "还是个无聊地方的时候。"
  npc_override_geffen_in_geffen_bargain_c11154: "划算吧？"
  npc_override_geffen_in_geffen_because_incident_weapon_5fc015: "因为那起事故，那位武器工匠"
  npc_override_geffen_in_geffen_boy_awkward_bc90b1: "……天哪，这太尴尬了。"
  npc_override_geffen_in_geffen_boy_you_bc7782: "你现在"
  npc_override_geffen_in_geffen_but_2e7fce: "可是……"
  npc_override_geffen_in_geffen_buuuurns_86c2ca: "好烫烫烫！"
  npc_override_geffen_in_geffen_c_come_again_1e80b5: "你、你说什么？"
  npc_override_geffen_in_geffen_c_mon_dude_latest_red_5ad2b0: "老兄，来吧。这是最新的红色药水。我是从一个朋友的好朋友那里弄来的，你知道，绝对可靠的来源，而且真的便宜。你可不能错过！"
  npc_override_geffen_in_geffen_certainly_fe2665: "确实有"
  npc_override_geffen_in_geffen_city_magic_6936d8: "魔法之城！"
  npc_override_geffen_in_geffen_clearly_deal_century_so_a14c1b: "很显然，这是本世纪最划算的买卖。那你想要几个？"
  npc_override_geffen_in_geffen_collected_patience_6a6b1d: "从容的耐心"
  npc_override_geffen_in_geffen_come_true_4e199d: "会成真！"
  npc_override_geffen_in_geffen_come_wouldn_t_you_agree_1ffe44: "来吧，你不觉得吗？牛仔帽戴在超级初心者身上太好看了！"
  npc_override_geffen_in_geffen_cough_cb8189: "*咳咳*"
  npc_override_geffen_in_geffen_cough_ty_nine_years_old_7793b5: "^333333*咳！*^000000十九岁。这不是好消息吗？那可是高龄了，你还有很多幸福的岁月可以享受。"
  npc_override_geffen_in_geffen_course_doing_kind_experi_86418f: "当然，做那种实验看起来很危险。你可能会向世界释放一些真正可怕的怪物……"
  npc_override_geffen_in_geffen_course_every_popular_sty_dc5b6f: "当然，不是每种流行款式都合我的口味。我是说，我看到有人顶着蘑菇走来走去。还听说有人用鱼做帽子？"
  npc_override_geffen_in_geffen_course_i_m_sure_exactly_93eddd: "当然，我不确定具体哪些梦想会成真，但希望你做过的美梦会成为现实，而不是那些奇怪的噩梦。"
  npc_override_geffen_in_geffen_course_might_too_expensi_4d74af: "当然，对大多数人来说可能太贵了，但你明白意思了吧。"
  npc_override_geffen_in_geffen_cowboy_hats_very_popular_87d8f3: "牛仔帽将在女性"
  npc_override_geffen_in_geffen_crraaaap_b6092e: "不不不不！"
  npc_override_geffen_in_geffen_currently_seeing_e491ef: "正在交往的"
  npc_override_geffen_in_geffen_currently_seeing_perfect_e44200: "正在交往的话，如果你想余生都活在痛苦中，那真是太完美了！"
  npc_override_geffen_in_geffen_day_today_79fa06: "的一天啊？"
  npc_override_geffen_in_geffen_decagon_7a449c: "十边形？"
  npc_override_geffen_in_geffen_did_you_happen_be6dc2: "你有没有"
  npc_override_geffen_in_geffen_don_t_know_3b379d: "不知道"
  npc_override_geffen_in_geffen_don_t_tell_me_you_36f46d: "别告诉我！你是来算命的，对吧？我知道，"
  npc_override_geffen_in_geffen_down_flu_8ccd96: "得流感了！"
  npc_override_geffen_in_geffen_drink_9252e3: "饮料？"
  npc_override_geffen_in_geffen_economy_c9b868: "经济……？"
  npc_override_geffen_in_geffen_economy_town_649f78: "经济！"
  npc_override_geffen_in_geffen_education_really_importa_4bb2da: "教育真的很重要，但如果成绩没有你期望的那么好，也不要气馁。"
  npc_override_geffen_in_geffen_effort_d04e7b: "在努力方面！"
  npc_override_geffen_in_geffen_eric_you_d578ed: "Eric 吧？"
  npc_override_geffen_in_geffen_even_if_you_break_up_95158b: "不过即使要分手，也要尽快分手，之后尽量做好朋友。"
  npc_override_geffen_in_geffen_even_if_you_re_running_8b1628: "即使时间紧迫，最好也慢慢计划好，这样才不会白费力气，或犯下代价高昂的错误。"
  npc_override_geffen_in_geffen_eventually_they_create_t_1c9eb5: "最终，他们创造了长出名流模仿者的树。如今，这看起来像是科学的奇迹，也是对好莱坞女明星的威胁。"
  npc_override_geffen_in_geffen_everyone_knows_wizards_a_61bad8: "谁都知道巫师只有智力没有力量！来吧，聪明人！让我看看你有多厉害！"
  npc_override_geffen_in_geffen_f_minus_0f4d96: "^FF0000不及格^000000！"
  npc_override_geffen_in_geffen_fashion_c9023e: "时尚……？"
  npc_override_geffen_in_geffen_father_survived_alone_tr_24a481: "父亲独自在那场悲剧中幸存了下来。"
  npc_override_geffen_in_geffen_feathered_bonnet_s_suppo_15b6f4: "还是说应该是羽毛帽的人气飙升？这两顶帽子都太有型了，尤其是戴在吟游诗人身上……"
  npc_override_geffen_in_geffen_feels_nice_wear_expensiv_eff71f: "穿戴昂贵的头饰感觉真好！穿漂亮的衣服也不错！但是记住……"
  npc_override_geffen_in_geffen_first_off_accountable_yo_7ffaaf: "首先，对自己的钱负责，制定适合自己的预算。一个好的经验法则是：每赚十个 Zeny，就存一个 Zeny，要么存起来，要么投资未来。"
  npc_override_geffen_in_geffen_fish_530538: "一条……鱼？"
  npc_override_geffen_in_geffen_forgive_me_cb3ce5: "饶了我吧！"
  npc_override_geffen_in_geffen_french_dagger_match_your_9b3960: "^FF3333法式匕首^000000，来配你的美丽和优雅。"
  npc_override_geffen_in_geffen_future_believe_internet_b0b191: "在未来，信不信由你，互联网将被一个巨大的大脑取代。我不知道怎么做到的，但相信我，这个大脑很大。"
  npc_override_geffen_in_geffen_future_i_thought_implied_0d1810: "未来？我以为这已经暗示了，我告诉你的任何运势都是关于你选择的特定领域的未来。"
  npc_override_geffen_in_geffen_future_sex_violence_rock_2621e7: "在未来，性、暴力和摇滚乐被完全废除。人类经历了一个完全和平和极度无聊的时代。"
  npc_override_geffen_in_geffen_future_they_genetically_1beb71: "在未来，他们用基因工程培育各种植物。"
  npc_override_geffen_in_geffen_geffen_sure_strange_wort_ac81b3: "吉芬真是个奇怪的地方。不过从修瓦尔茨共和国远道而来还是值得的。"
  npc_override_geffen_in_geffen_gemstone_42e4f3: "宝石……"
  npc_override_geffen_in_geffen_get_all_scary_b58061: "这么吓人的？！^000000"
  npc_override_geffen_in_geffen_girl_you_5a071a: "你现在"
  npc_override_geffen_in_geffen_god_rest_his_soul_95d805: "愿他安息，"
  npc_override_geffen_in_geffen_good_5219c6: "正道……"
  npc_override_geffen_in_geffen_good_heavens_863401: "……天哪！"
  npc_override_geffen_in_geffen_goodness_you_must_so_str_077902: "天哪，你一定很强！"
  npc_override_geffen_in_geffen_gossip_6c5806: "八卦……？"
  npc_override_geffen_in_geffen_gossip_eh_a459c2: "八卦，是吧？"
  npc_override_geffen_in_geffen_h_hey_you_3cfbbb: "喂，说你呢！"
  npc_override_geffen_in_geffen_haha_what_you_saying_you_7230f2: "哈哈！你在说什么？不需要拉绳！太空时代的尼龙和纤维和氪纤维让兜帽牢牢固定在你头上！"
  npc_override_geffen_in_geffen_hahahahaah_f3256f: "哈哈哈哈哈！"
  npc_override_geffen_in_geffen_hahahahahahaha_b419ba: "哈哈哈哈哈哈哈～！"
  npc_override_geffen_in_geffen_haw_haw_ac55cb: "哈哈！"
  npc_override_geffen_in_geffen_hear_any_bb27eb: "听到什么了？"
  npc_override_geffen_in_geffen_hello_69342c: "你好！"
  npc_override_geffen_in_geffen_hello_efda05: "你好～！"
  npc_override_geffen_in_geffen_hello_hello_e20b0e: "你好你好。"
  npc_override_geffen_in_geffen_hello_i_m_resident_exper_fb2a1f: "你好，我是吉芬这里的怪物学常驻专家。你有什么特别好奇的吗？"
  npc_override_geffen_in_geffen_hello_there_5a8ec9: "你好～"
  npc_override_geffen_in_geffen_help_meeeee_341f1c: "救命啊啊啊！"
  npc_override_geffen_in_geffen_her_voice_46e834: "她的声音刚才"
  npc_override_geffen_in_geffen_here_high_quality_red_po_33ce0f: "就是这个！高品质红色药水！一旦喝下立刻见效。一旦沾上嘴唇，你就停不下来。这东西就是这么好。"
  npc_override_geffen_in_geffen_hey_there_tough_guy_you_59c2fb: "嘿，硬汉。你看上去够聪明，一眼就能认出面前的好买卖。"
  npc_override_geffen_in_geffen_hey_you_sex_crazed_basta_b34f4b: "^990000你这个色情的混蛋！！再敢那样盯着我女儿看，我就把你的眼珠子挖出来，配着意面吃掉！^000000"
  npc_override_geffen_in_geffen_hm_all_spirits_said_did_2a099f: "嗯？灵魂们只说了一句'你学习了吗？'嗯，看来我用另一个问题回答了你的问题！"
  npc_override_geffen_in_geffen_hmm_9c4d28: "嗯……"
  npc_override_geffen_in_geffen_hmm_spirits_being_awfull_a8d182: "嗯。灵魂们今天真是无礼。他们说，'你要是这么担心成绩，为什么不去问你的老师？'"
  npc_override_geffen_in_geffen_hmmm_2ac89c: "嗯……"
  npc_override_geffen_in_geffen_hmmm_i_sense_you_experie_e11bf1: "嗯……我感觉你正在经历人生的迷茫期。你应该优先考虑安稳还是快乐？"
  npc_override_geffen_in_geffen_hmmmm_well_7d8b5c: "嗯，这个嘛……"
  npc_override_geffen_in_geffen_hood_no_drawstrings_2c748a: "这兜帽没有拉绳……？"
  npc_override_geffen_in_geffen_hood_wearing_one_those_q_03a584: "兜帽！戴一个是如今赢得尊重的最快方式！"
  npc_override_geffen_in_geffen_hornets_living_grassland_eadb31: "栖息在草原上的大黄蜂在蜂后的命令下，用一生的时间采集花蜜。蜂蜜就是用它们采集的花蜜制成的。"
  npc_override_geffen_in_geffen_how_dare_you_try_pick_01594b: "^990000你竟敢搭讪我的宝贝女儿！你想尝尝愤怒父亲的怒火吗？！^000000"
  npc_override_geffen_in_geffen_how_did_she_edc243: "她怎么变得"
  npc_override_geffen_in_geffen_how_sad_father_ff9bc7: "那位父亲该有多伤心啊……"
  npc_override_geffen_in_geffen_however_as_balance_natur_27bd47: "然而，随着自然平衡的改变，怪物不可避免地回来了。没有太多人知道这一点，但大多数怪物曾经是温顺的生物。真的很可悲……"
  npc_override_geffen_in_geffen_however_people_who_buy_t_e5857b: "然而，买这些树的人，和那些穿着品味极差衬衫的人是同一类……"
  npc_override_geffen_in_geffen_however_you_should_also_0f26f1: "不过，你也应该避免拿钱赌博。我的意思是，你应该谨慎储蓄和投资。不要被有风险的快速致富计划诱惑！"
  npc_override_geffen_in_geffen_huh_73fef0: "啊？"
  npc_override_geffen_in_geffen_huh_a78e67: "啊……？"
  npc_override_geffen_in_geffen_huh_total_bummer_7125ba: "哎。真倒霉。"
  npc_override_geffen_in_geffen_huuurts_e198f5: "好疼……"
  npc_override_geffen_in_geffen_i_call_7b0a23: "我叫它……"
  npc_override_geffen_in_geffen_i_did_forget_all_about_a502e0: "我说了什么，就全忘了吧，"
  npc_override_geffen_in_geffen_i_didn_t_say_anything_fdc78f: "我什么都没说。但如果"
  npc_override_geffen_in_geffen_i_don_t_know_how_8d06cb: "我不知道那会在多远的未来发生，但最好不要很快发生！"
  npc_override_geffen_in_geffen_i_don_t_know_much_396a92: "我对魔法不太了解，但你知道什么尝起来像魔法吗？^CC6600蜂蜜^000000！"
  npc_override_geffen_in_geffen_i_don_t_know_what_1baa24: "我不知道那是什么。但我想总不会比法师更糟糕吧。"
  npc_override_geffen_in_geffen_i_don_t_like_stereotype_16f1dc: "我不喜欢给人贴标签，但你难道没注意到剑士和骑士"
  npc_override_geffen_in_geffen_i_don_t_think_sons_9d0939: "我觉得他的4个儿子"
  npc_override_geffen_in_geffen_i_especially_worry_about_00f49f: "我特别担心使用魔法的各种弊端。"
  npc_override_geffen_in_geffen_i_find_something_44a05e: "才能找到这样的"
  npc_override_geffen_in_geffen_i_guess_8d1d83: "我想……"
  npc_override_geffen_in_geffen_i_guess_those_641c44: "我觉得那种"
  npc_override_geffen_in_geffen_i_guess_you_want_know_fc8bd4: "我猜你想了解整体的未来。让我和灵魂沟通一下，看看他们怎么说，好吗？"
  npc_override_geffen_in_geffen_i_hear_orcs_their_own_2a5c73: "我听说兽人有自己的文化和语言，据说就像我们人类一样。那是不是说兽人也会约会……？"
  npc_override_geffen_in_geffen_i_hear_originally_called_e2e514: "我听说它最初是以我们大陆的名字命名的，叫卢恩·米德加兹王国。但不知为什么，名字后来改成了'卢恩·米德加兹'。"
  npc_override_geffen_in_geffen_i_hear_there_s_person_de9fe1: "我听说在卢恩·米德加尔特的某处有这么一个人……"
  npc_override_geffen_in_geffen_i_help_you_9dd552: "我能帮你"
  npc_override_geffen_in_geffen_i_i_t_think_anything_47b0b7: "我，我想不起什么来了。一切都变得模模糊糊的……"
  npc_override_geffen_in_geffen_i_just_saved_you_lifetim_f459a6: "不过我刚刚帮你省下了一辈子的彩票钱！那可是一笔不小的数目呢！"
  npc_override_geffen_in_geffen_i_know_i_see_future_bc4c1b: "我知道……我能看到未来！你想算什么运？"
  npc_override_geffen_in_geffen_i_m_girl_65d664: "可、可我是女的啊！"
  npc_override_geffen_in_geffen_i_m_girl_99b475: "我是女的啊！"
  npc_override_geffen_in_geffen_i_m_glad_hear_you_f06792: "很高兴听到你特意来帮助那个年轻人。"
  npc_override_geffen_in_geffen_i_m_no_exception_d5b9ab: "而我也不例外。"
  npc_override_geffen_in_geffen_i_m_seeing_something_1bfd23: "我看到了一些东西……"
  npc_override_geffen_in_geffen_i_m_so_jealous_e4cfb6: "我好羡慕啊！"
  npc_override_geffen_in_geffen_i_m_so_scared_dca263: "我好怕啊！"
  npc_override_geffen_in_geffen_i_m_so_sorry_2f9418: "真是对不起！"
  npc_override_geffen_in_geffen_i_mean_all_these_new_6417bf: "我是说，探险家们不断发现新城市，所以进出口贸易真是繁荣啊！"
  npc_override_geffen_in_geffen_i_mean_i_ve_read_e2c37f: "我是说，我在普隆德拉和朱诺图书馆读过各种怪物的资料，也在野外遇到过一些，但现在我有机会亲眼看到一些强大的怪物了！"
  npc_override_geffen_in_geffen_i_mean_they_re_being_ffa1d0: "我的意思是，他们拿了钱是来帮你的。而我的服务是免费的。所以……就是这样。"
  npc_override_geffen_in_geffen_i_must_78a2d6: "我一定要得到它！"
  npc_override_geffen_in_geffen_i_must_coming_2b8ace: "我一定是"
  npc_override_geffen_in_geffen_i_now_predict_sombrero_c_bcb393: "我现在预言，当一大群吟游诗人组成一个只戴宽边帽的公会时，宽边帽将会非常流行。"
  npc_override_geffen_in_geffen_i_only_use_140edc: "我只能"
  npc_override_geffen_in_geffen_i_predict_38f1ef: "我预言……"
  npc_override_geffen_in_geffen_i_really_had_no_idea_d848b3: "我真的不知道牧师能不能结婚，但既然崔斯坦三世国王本人也在场，"
  npc_override_geffen_in_geffen_i_reeeeally_want_able_vi_1c3b7f: "我真的好想去那个供应真正好酒的地方看看。听说那里简直就是天堂！"
  npc_override_geffen_in_geffen_i_remember_geffen_813e39: "我记得吉芬"
  npc_override_geffen_in_geffen_i_see_you_wield_holy_e9a829: "我看得出你以某种方式运用着神圣之力。我想神圣之力也可以被视为神秘能量的一种形式。"
  npc_override_geffen_in_geffen_i_sense_presence_mighty_b32a10: "我感受到了一股强大灵魂的气息。难道是你……？"
  npc_override_geffen_in_geffen_i_sense_you_may_about_fbad40: "我感觉你可能要做出一个会让你后悔的冲动决定。我必须建议你放慢脚步，三思而后行。"
  npc_override_geffen_in_geffen_i_sense_you_soon_receivi_48b5c1: "我感应到你很快就会拿到全A的成绩……"
  npc_override_geffen_in_geffen_i_sense_you_ve_had_6244b0: "我感觉你刚和一个亲近的人吵了一架。一个你非常在乎的人。"
  npc_override_geffen_in_geffen_i_suggest_you_think_full_1cd1d1: "我建议你在决定哪条路最适合你之前，充分而仔细地思考。记住，你只能从错误中学习。"
  npc_override_geffen_in_geffen_i_suppose_s_okay_0d11d5: "我想应该没问题吧！"
  npc_override_geffen_in_geffen_i_t_let_you_buy_e243b1: "我不能让你买那么多。我的意思是，不是说这些药水里有什么微量杂质之类的……"
  npc_override_geffen_in_geffen_i_t_sell_many_daggers_8e8f20: "我不能卖那么多匕首！那会引来普隆德拉骑士团——我是说，嗯，我本来打算把一些匕首捐给……饥饿的儿童？"
  npc_override_geffen_in_geffen_i_t_sell_you_many_d38f10: "我不能卖你那么多！你想干嘛，占我便宜吗？"
  npc_override_geffen_in_geffen_i_thought_only_members_o_83a5a5: "但我以为只有兽人部族的成员才能戴那个？"
  npc_override_geffen_in_geffen_i_went_down_prontera_san_286c0d: "我去了普隆德拉大圣堂，我敢发誓"
  npc_override_geffen_in_geffen_i_you_117253: "为你做点什么？"
  npc_override_geffen_in_geffen_if_opposite_what_you_wan_7fba6d: "但如果这恰恰不是你想要的，嗯，抱歉。命运之神今天带着讽刺向你微笑。不过改变命运还不算太晚！"
  npc_override_geffen_in_geffen_if_you_plan_carefully_pe_471146: "如果你周密计划，以良好的态度采取积极、建设性的行动，你就能"
  npc_override_geffen_in_geffen_if_you_re_looking_alcoho_4f3c3d: "如果你想找酒的话，崔斯坦三世国王前阵子就颁布禁酒令了。我听说现在只有特定的地方才供应酒。"
  npc_override_geffen_in_geffen_if_you_use_mystic_energy_e2d3b8: "如果你将神秘能量用于伤害他人，或违背大自然所定的法则，那股力量自然会反噬到你身上。记住，种瓜得瓜，种豆得豆。"
  npc_override_geffen_in_geffen_if_you_ve_got_hood_7a8c30: "戴上兜帽，怪物就会害怕你，吓得落荒而逃！而且看看这结实的面料。我怎么拉都拉不破！"
  npc_override_geffen_in_geffen_if_you_wish_use_your_80f364: "如果你想将力量发挥到极致，请记住这件物品。"
  npc_override_geffen_in_geffen_instead_looking_cool_the_6f4705: "不但不酷，反而看起来像一个邪恶的饼干精灵王子。吓人吧？"
  npc_override_geffen_in_geffen_instead_worrying_about_t_1297ed: "与其担心时间悖论，为什么不创造自己的命运呢？"
  npc_override_geffen_in_geffen_int_challenged_bcb62c: "……智力不太够？"
  npc_override_geffen_in_geffen_interesting_b469a0: "……有意思。"
  npc_override_geffen_in_geffen_isn_t_ca6afe: "今天真是"
  npc_override_geffen_in_geffen_j_just_how_drunk_am_800f9d: "我、我到底喝醉到什么程度了？！"
  npc_override_geffen_in_geffen_juno_06394c: "朱诺开设新的飞空艇服务！"
  npc_override_geffen_in_geffen_just_joke_e59710: "只是开玩笑的！"
  npc_override_geffen_in_geffen_key_overcoming_crisis_824035: "是克服危机的关键。"
  npc_override_geffen_in_geffen_kinds_hats_too_02c395: "帽子对我来说"
  npc_override_geffen_in_geffen_least_they_re_planning_a_0327c0: "至少他们正在计划中。飞空艇还没准备好起飞。在那之前，那边有个奇怪的客服代表在提供传送服务。"
  npc_override_geffen_in_geffen_leaves_seeds_fruit_yggdr_5b01ec: "世界树的叶子、种子和果实将这个世界上的所有生灵联系在一起。根据这卷轴所说，世界树也参与了世界的创造。"
  npc_override_geffen_in_geffen_let_me_contact_234543: "让我联系一下"
  npc_override_geffen_in_geffen_life_508e9d: "人生……？"
  npc_override_geffen_in_geffen_like_9bec68: "东西呢？！"
  npc_override_geffen_in_geffen_little_overprotective_7ceca7: "有点过度保护！"
  npc_override_geffen_in_geffen_ll_make_better_people_ou_831367: "这会让你们都成为更好的人。不过这只是我的想法。"
  npc_override_geffen_in_geffen_looking_romance_eh_life_0cf98a: "在寻找浪漫吗？生活总是需要多一点刺激的。"
  npc_override_geffen_in_geffen_looks_like_a2c45c: "看起来像是一个……"
  npc_override_geffen_in_geffen_looks_like_father_s_love_14f116: "看来父爱是永恒的，即使到了来世也是如此。^000000"
  npc_override_geffen_in_geffen_looooove_eh_a117ad: "爱爱爱情，是吧？"
  npc_override_geffen_in_geffen_love_always_fun_even_ble_72f290: "爱情总是有趣的！即使在这个凄凉的世界里，爱也用诱人的光辉包围着我们。珍惜那个对你特别的人，下次再来占卜吧！"
  npc_override_geffen_in_geffen_luckily_doctor_pyeus_fin_24c9be: "幸运的是，派厄斯博士及时完成了钚超驱动点火负电子G系统的引力湮灭驱动器。"
  npc_override_geffen_in_geffen_mages_wielders_magic_you_cb989d: "法师是魔法的驾驭者。不过你现在对这个话题应该更了解了吧，不是吗？"
  npc_override_geffen_in_geffen_mages_wizards_always_car_408bcc: "法师和巫师总是带着书，研究魔法。他们就是那样的人。"
  npc_override_geffen_in_geffen_magnum_break_a37b3c: "怒爆？"
  npc_override_geffen_in_geffen_magnum_break_d8ebc8: "……^EE0000怒爆^000000！"
  npc_override_geffen_in_geffen_main_gauche_i_invented_m_c32dbd: "^FF3333左手短剑^000000！我自己发明的。而且只卖 9,400 Zeny！"
  npc_override_geffen_in_geffen_man_5c77da: "天哪……"
  npc_override_geffen_in_geffen_man_how_many_chances_lif_ecd39f: "天哪，你这辈子已经错过了多少次千载难逢的机会了？兄弟，希望你能中彩票……"
  npc_override_geffen_in_geffen_man_i_hate_mages_passion_9392a4: "老天，我恨死法师了！就知道念书念咒语，还搞得税那么高之类的……"
  npc_override_geffen_in_geffen_man_midgard_continent_su_a57221: "老天，米德加尔特大陆可真大！近来可好，年轻人？"
  npc_override_geffen_in_geffen_manteau_s_old_news_you_503308: "披肩？那是老古董了！你知道现在最新的防护装备是什么吗？"
  npc_override_geffen_in_geffen_marvelous_story_87209e: "这个奇妙的故事～"
  npc_override_geffen_in_geffen_me_i_m_world_s_e16d9b: "我？我是世界上最漂亮的街头商人。嘿嘿～"
  npc_override_geffen_in_geffen_menu_and_7d9bb3: "于是，POING再次崛起，重生为自动英雄：GOD-POING。当然，尼克斯尔特隆47被消灭了。"
  npc_override_geffen_in_geffen_menu_but_9fdd50: "但这还不是全部。还有一种专门只给蜂后吃的特殊蜂蜜："
  npc_override_geffen_in_geffen_menu_eric_e6bfdb: "Eric？那是谁？：是的，没错，我在找他。"
  npc_override_geffen_in_geffen_menu_gimme_9966f5: "给我来点恢复HP的药水。:嗯，你有匕首吗？:你有没有好的披肩？:你除了这些还有别的吗？"
  npc_override_geffen_in_geffen_menu_how_5ac301: "你怎么知道的？：你太离谱了！：我是单身！"
  npc_override_geffen_in_geffen_menu_in_03fc16: "在未来，地球由一台巨型机器人保护：钚超驱动点火负电子G，简称POING。"
  npc_override_geffen_in_geffen_menu_life_0127ae: "人生！：爱情！：财运！：成绩！：未来！：时尚！"
  npc_override_geffen_in_geffen_menu_mages_b5cde3: "法师……？：经济？：你是谁？"
  npc_override_geffen_in_geffen_menu_may_43c80d: "能给我来杯饮料吗？：有什么有趣的八卦吗？"
  npc_override_geffen_in_geffen_menu_may_dd8446: "能给我来杯饮料吗？：最近有什么有趣的八卦吗？"
  npc_override_geffen_in_geffen_menu_meteor_819ba1: "陨石术！:怒雷强击！:手下留情。"
  npc_override_geffen_in_geffen_menu_monsters_c47f54: "附近的怪物。：最近的怪物新闻。：怪物时代：果冻理论。"
  npc_override_geffen_in_geffen_menu_poing_bf4640: "POING多年来击退了无数基洛瑞安人的入侵，直到最终被哈布里斯博士的机械霸主：尼克斯尔特隆47击败。"
  npc_override_geffen_in_geffen_menu_schwarzwald_d51545: "修瓦尔茨共和国？：那么，你为什么要旅行？"
  npc_override_geffen_in_geffen_minute_there_686e6f: "真的很低沉……"
  npc_override_geffen_in_geffen_money_well_you_must_more_5aeab4: "财运？嗯，你在金钱方面一定比我幸运多了。毕竟我整天坐在这里，还是免费提供服务的！"
  npc_override_geffen_in_geffen_most_horrible_vision_bbbf25: "那是最可怕的景象！"
  npc_override_geffen_in_geffen_most_intriguing_6fca01: "非常有趣。"
  npc_override_geffen_in_geffen_msg_6eae3a: "……"
  npc_override_geffen_in_geffen_msg_93fcbf: "……"
  npc_override_geffen_in_geffen_muhwaha_ha_ha_d313ca: "嘿嘿……哈。哈。"
  npc_override_geffen_in_geffen_my_he_head_9de2f1: "我、我的头……"
  npc_override_geffen_in_geffen_my_powers_good_1c4be0: "将力量用于正道。"
  npc_override_geffen_in_geffen_need_fine_exquisite_dedfac: "需要的是一把精致优美的"
  npc_override_geffen_in_geffen_need_manly_dagger_e856ff: "需要的是一把 ^FF3333男子汉匕首^000000。"
  npc_override_geffen_in_geffen_nice_lady_like_you_come_c5c2de: "像你这样的淑女？得了吧，菜刀是给唠叨的老太婆和帮佣用的。"
  npc_override_geffen_in_geffen_no_c03f1e: "不……"
  npc_override_geffen_in_geffen_no_kidding_8264f0: "不是吧？"
  npc_override_geffen_in_geffen_no_matter_how_much_zeny_2c3504: "不管你在衣柜上花了多少 Zeny，如果不搭配好，都会显得很蠢。"
  npc_override_geffen_in_geffen_no_need_look_anywhere_el_895f4e: "明明我这里有最好的货，根本不需要到处找别人！"
  npc_override_geffen_in_geffen_nothing_1be49c: "一无是处的正道！"
  npc_override_geffen_in_geffen_nothing_compare_luscious_d40d93: "没有什么能比得上蜂皇浆那甘美的味道。而且我觉得它比普通蜂蜜对你更有好处！"
  npc_override_geffen_in_geffen_now_76c5ab: "现在……"
  npc_override_geffen_in_geffen_now_here_s_good_example_639521: "现在，这里有一个搭配不当的好例子。想象一个十字军戴着皇冠、精灵耳朵和铁胡须。"
  npc_override_geffen_in_geffen_now_how_cheap_since_they_50f072: "多便宜啊你说？！因为需求太大，我一次只能卖给你100瓶"
  npc_override_geffen_in_geffen_now_i_couldn_t_tell_b2da28: "不过，我不能告诉你真实的成绩。你命中注定每门课都拿A，但如果我告诉你……"
  npc_override_geffen_in_geffen_now_i_gotta_find_some_e92672: "^333333现在我又得找个冤大头把这些垃圾倒出去了！^000000 *咳咳* 我是说，欢迎再来！"
  npc_override_geffen_in_geffen_now_i_think_about_they_609031: "现在想想，他们说的有道理。你为什么不去问问老师、教授什么的，看看自己有没有什么问题呢？"
  npc_override_geffen_in_geffen_now_there_mages_wizards_3a5143: "但现在有了法师和巫师，还有繁荣的"
  npc_override_geffen_in_geffen_now_why_such_beautiful_w_469bf1: "这么漂亮的女人为什么要穿过时的东西？你知道什么能让你更好看吗？"
  npc_override_geffen_in_geffen_obviously_wise_decision_5300b9: "这显然是个明智的决定，因为太多人把我们的大陆和王国搞混了。挺奇怪的吧？"
  npc_override_geffen_in_geffen_oh_6cc234: "哦……！"
  npc_override_geffen_in_geffen_oh_78a2fc: "哦……"
  npc_override_geffen_in_geffen_oh_alright_you_find_eric_374518: "哦，好吧。你可以在我左边的房间找到 Eric。知道有人对他正在做的东西感兴趣，他大概会很高兴。"
  npc_override_geffen_in_geffen_oh_aren_t_you_84eee7: "哦，你不是"
  npc_override_geffen_in_geffen_oh_cool_ac4ebf: "哦酷！"
  npc_override_geffen_in_geffen_oh_dad_must_possessed_me_f2b09e: "哦，肯定是我爸爸又附身到我了。我和我妹妹经常遇到这种事。"
  npc_override_geffen_in_geffen_oh_darn_really_annoying_1b32a9: "哎，真糟糕！上次我去探险时，被一个远程敌人发现了，真是烦死人了。那个臭怪物打断了我所有法术的施放！我一点都没打中它！"
  npc_override_geffen_in_geffen_oh_i_m_sorry_i_dd4d9e: "哦，对不起，我就喜欢开这种玩笑。好了，这次让我认真问问灵魂。嗯嗯嗯……"
  npc_override_geffen_in_geffen_oh_i_see_he_s_1c72db: "哦，我明白了。他就是我左边房间里那个家伙。他总是在搞些什么项目。"
  npc_override_geffen_in_geffen_oh_let_me_tell_you_ecd4b1: "哦！让我告诉你"
  npc_override_geffen_in_geffen_oh_maaan_62df9e: "天哪～"
  npc_override_geffen_in_geffen_oh_nuts_312d57: "哎呀……"
  npc_override_geffen_in_geffen_oh_right_fa7a9d: "哦对了……"
  npc_override_geffen_in_geffen_oh_sweet_lord_77492b: "我的天……"
  npc_override_geffen_in_geffen_oh_you_know_business_see_09e4c6: "哦，你知道的，为了生意。外贸似乎很赚钱。"
  npc_override_geffen_in_geffen_old_flame_definitely_res_7f01fa: "但一个旧情人肯定会重新出现在你的生活中。以某种方式。所以如果这是好消息，恭喜！但如果这是坏消息，那就要小心了！"
  npc_override_geffen_in_geffen_oooh_2d3b6d: "噢～！"
  npc_override_geffen_in_geffen_ooooh_1f16a7: "噢噢噢～！"
  npc_override_geffen_in_geffen_ooooh_9ed790: "噢噢……"
  npc_override_geffen_in_geffen_ooooooooh_0fcacc: "噢噢噢噢噢噢"
  npc_override_geffen_in_geffen_orc_helm_you_re_wearing_c7ecb3: "你戴的是兽人头盔吗？！太酷了！哇……"
  npc_override_geffen_in_geffen_orc_hero_d581eb: "兽人英雄的头盔！"
  npc_override_geffen_in_geffen_other_hand_get_rich_as_9e4c40: "另一方面，没那么快致富的计划是可以的，只要你清楚自己在做什么。我说得对吧？"
  npc_override_geffen_in_geffen_our_kingdom_right_f6851f: "我们王国的名字吧？"
  npc_override_geffen_in_geffen_our_research_ancient_mon_b81ddf: "根据我们对古代怪物的研究和最近发现的怪物的调查，在更强的野兽身上似乎找不到果冻的痕迹。"
  npc_override_geffen_in_geffen_pass_up_too_9305bf: "也会把那个错过的。"
  npc_override_geffen_in_geffen_people_been_coming_weari_bf4c05: "最近总有人戴着可爱的新帽子进来。有一顶我以前从没见过的可爱泰迪熊帽，还有一个女孩戴着黑色的猫耳……"
  npc_override_geffen_in_geffen_perfect_you_28fa55: "那个人非常适合你！"
  npc_override_geffen_in_geffen_perhaps_your_style_learn_a887aa: "也许你的学习方式没有得到学校的支持，或者你对学术不太感兴趣。可以理解。"
  npc_override_geffen_in_geffen_place_40739e: "这个地方……"
  npc_override_geffen_in_geffen_please_come_back_sometim_9d7f33: "请改天再来买我的货吧。我喜欢知道自己想要什么的客人！嘿嘿～"
  npc_override_geffen_in_geffen_powerful_weapon_he_his_s_79b96b: "他和他的儿子们正在开发的那把强力武器了。"
  npc_override_geffen_in_geffen_priest_got_married_pries_94f0ff: "看到一个牧师和一个服事结婚了！"
  npc_override_geffen_in_geffen_projectile_launcher_pref_31eefe: "投射武器发射器，最好是木头做的。"
  npc_override_geffen_in_geffen_psssst_87b4fd: "^333333*嘘！*"
  npc_override_geffen_in_geffen_read_up_your_27166d: "多了解一下"
  npc_override_geffen_in_geffen_really_deep_e0af91: "有一阵子变得"
  npc_override_geffen_in_geffen_recent_news_1da8c5: "最近的新闻？"
  npc_override_geffen_in_geffen_remember_calm_ffd40f: "记住，冷静、"
  npc_override_geffen_in_geffen_retired_his_work_hid_him_db5257: "退休了，躲在了某个地方。"
  npc_override_geffen_in_geffen_royal_jelly_92245c: "^CC6600蜂皇浆^000000！"
  npc_override_geffen_in_geffen_rugged_manly_7af055: "粗犷又阳刚～"
  npc_override_geffen_in_geffen_rumors_43e954: "传闻……？"
  npc_override_geffen_in_geffen_rune_midgarts_kingdom_2836a9: "卢恩·米德加兹王国？"
  npc_override_geffen_in_geffen_s_5a97cd: "那是……"
  npc_override_geffen_in_geffen_s_810442: "它……"
  npc_override_geffen_in_geffen_s_even_worse_53d653: "那更糟糕！！^000000"
  npc_override_geffen_in_geffen_s_funny_286a56: "真奇怪……"
  npc_override_geffen_in_geffen_s_helmet_4d20a1: "那是"
  npc_override_geffen_in_geffen_s_horrible_king_tristram_81b7b6: "崔斯坦三世国王在王国颁布禁酒令真是太糟糕了！这大概是他整个统治期间唯一做过的糟糕决定！"
  npc_override_geffen_in_geffen_s_just_41f264: "只是……"
  npc_override_geffen_in_geffen_s_like_you_re_surrounded_b35128: "就像你被一股难以置信的阳刚之气所包围！噢～！你一定让所有的女孩都无法抗拒！"
  npc_override_geffen_in_geffen_s_my_prediction_you_real_d848f4: "这就是我的预言。你真的能反驳灵界的智慧吗？"
  npc_override_geffen_in_geffen_s_no_good_62e9f9: "那可不好。"
  npc_override_geffen_in_geffen_s_possible_jellopy_may_l_23fcb9: "果冻可能与怪物的性格和力量有关。所以，如果你把果冻和什么东西混合，就会创造出更强大的怪物。"
  npc_override_geffen_in_geffen_s_probably_most_importan_feceee: "这可能是你了解到的关于未来最重要的事情。相信我，其他部分都很无聊。"
  npc_override_geffen_in_geffen_s_right_ddafea: "没错！"
  npc_override_geffen_in_geffen_s_soooo_sweet_delicious_eaef4c: "它甜得不得了，又非常美味。我不确定它是不是催情剂，但我确切地知道它能消除疲劳，帮助你从伤痛中恢复！"
  npc_override_geffen_in_geffen_s_strange_i_foresee_love_711237: "奇怪了，我预见你的未来会有三角恋。不，等等！是恋爱的……"
  npc_override_geffen_in_geffen_sage_0d2149: "么？贤者？"
  npc_override_geffen_in_geffen_scary_24cab8: "^3355FF太可怕了……！"
  npc_override_geffen_in_geffen_schwarzwald_republic_eab15f: "修瓦尔茨共和国？"
  npc_override_geffen_in_geffen_seems_almost_every_monst_3989e6: "似乎周围的每种怪物都由果冻组成。但这只是某些怪物的结晶产物，还是说……有更深层的东西？"
  npc_override_geffen_in_geffen_seems_like_kafra_corpora_33625b: "看来卡普拉公司终于要有竞争对手了！不过话又说回来，我觉得很少有女孩能像卡普拉员工那样迷人……"
  npc_override_geffen_in_geffen_seems_you_trained_mystic_48b492: "看来你受过神秘学艺的训练。魔法……它的力量受因果法则支配。"
  npc_override_geffen_in_geffen_sharp_piercing_49398b: "尖锐的、能穿透的"
  npc_override_geffen_in_geffen_sheath_b26929: "刀鞘？"
  npc_override_geffen_in_geffen_short_dough_fa8a94: "钱不够？"
  npc_override_geffen_in_geffen_short_zeny_6e4195: "Zeny 不够？"
  npc_override_geffen_in_geffen_short_zeny_eh_c0e8b2: "Zeny 不够，是吧？"
  npc_override_geffen_in_geffen_sigh_94086c: "*叹气……*"
  npc_override_geffen_in_geffen_silly_wizard_only_monste_8b4bb2: "愚蠢的巫师！只有巴风特那样的怪物才能驾驭这么大的法术——"
  npc_override_geffen_in_geffen_since_i_like_you_so_67a557: "既然我这么喜欢你，购买就免费送你刀鞘！怎么样，"
  npc_override_geffen_in_geffen_since_when_76275e: "你什么时候"
  npc_override_geffen_in_geffen_smashing_things_f1e0e9: "砸东西！"
  npc_override_geffen_in_geffen_so_basically_i_foresee_y_b1d5c9: "所以基本上，我预见到你很快只会吸引到真正强壮的人。你知道的，比如职业运动员、健美先生、建筑工人之类的人。"
  npc_override_geffen_in_geffen_so_c7572d: "那么……"
  npc_override_geffen_in_geffen_so_if_what_you_want_a3ef2a: "如果这就是你想要的，恭喜你！命运之神今天欢笑着向你微笑。"
  npc_override_geffen_in_geffen_so_just_tell_me_what_d1c64c: "所以尽管告诉我你想要什么，我会从我这珍贵又实惠的货物里给你一个好价钱。"
  npc_override_geffen_in_geffen_so_many_kinds_s_crazy_d0b7c6: "种类太多了！我跟你说，太疯狂了！"
  npc_override_geffen_in_geffen_so_much_technology_inves_2a01e5: "这兜帽凝聚了这么多科技。你能相信我只卖 930 Zeny 吗？"
  npc_override_geffen_in_geffen_so_new_monsters_basicall_1b9a2b: "所以基本上一直都有新怪物被发现！在这个世界上漫游的生物种类真是令人着迷。"
  npc_override_geffen_in_geffen_so_you_want_know_about_fac0f6: "所以你想了解财运，是吗？让我和超自然界的灵魂交流一下……"
  npc_override_geffen_in_geffen_some_sort_368c5e: "某种……"
  npc_override_geffen_in_geffen_someday_you_swear_yourse_971230: "^3355FF你暗暗发誓，总有一天，你要向这个侮辱崇高法师职业的好斗醉鬼报仇雪恨。总有一天……^000000"
  npc_override_geffen_in_geffen_someone_s_head_b747c4: "在某个人的头上？"
  npc_override_geffen_in_geffen_something_fd39ed: "……或者别的什么。"
  npc_override_geffen_in_geffen_something_these_magic_so_045e09: "和某种魔法耳罩有关的东西。我想他一直在找投资人帮他完成他在做的那个玩意儿。"
  npc_override_geffen_in_geffen_sometimes_i_get_future_p_6bddde: "有时候，我会把未来和现在搞混。你知道的，因为我总是在展望未来嘛……"
  npc_override_geffen_in_geffen_sometimes_s_cute_idea_fo_e640be: "有时候，跟随一个主题是个可爱主意。比如，同时穿戴天使翅膀和天使翅膀耳饰。"
  npc_override_geffen_in_geffen_somewhere_world_there_ra_903189: "在这个世界的某处，有一根稀有的法杖，能将精神能量转化为物理力量，赋予持有者^990000破坏力^000000……"
  npc_override_geffen_in_geffen_soooo_88f8a8: "那么……"
  npc_override_geffen_in_geffen_sorry_about_6c6840: "真是抱歉！"
  npc_override_geffen_in_geffen_speaking_which_i_ve_also_976974: "说起来，我还听过一个传闻，说在克魔岛附近的某片土地上有一棵奇迹之树。它们一定有关联，我确信！"
  npc_override_geffen_in_geffen_spirit_my_father_4d962f: "我父亲的灵魂，"
  npc_override_geffen_in_geffen_spirits_f18bac: "这些灵魂"
  npc_override_geffen_in_geffen_spirits_second_9c2892: "灵魂一下。"
  npc_override_geffen_in_geffen_spirits_tell_me_you_shou_0e0edc: "灵魂告诉我，你应该尝试不同的学习方式，这样才能确保获得你想要的成绩。"
  npc_override_geffen_in_geffen_stay_away_my_daughter_i_9a7d91: "^990000离我女儿远点，不然我就打爆你的头，小子！艾丽莎要嫁给医生！或者律师！^000000"
  npc_override_geffen_in_geffen_still_if_you_want_go_ce2559: "不过，如果你想观光的话，我个人推荐你去我的家乡朱诺看看。那里很美的。"
  npc_override_geffen_in_geffen_still_if_you_want_seek_61bdc3: "不过，如果你想寻找强大的怪物，可以穿过西边的桥去打犬妖。"
  npc_override_geffen_in_geffen_still_may_us_believe_the_e34a4d: "尽管如此，我们中很多人相信果冻和怪物之间可能有某种关系，虽然很难相信真的有。"
  npc_override_geffen_in_geffen_still_people_manage_get_43724c: "尽管如此，人们还是能靠我们这里提供的仿制饮料喝醉。我想全都是心理作用吧。"
  npc_override_geffen_in_geffen_super_novices_e9ae30: "超级初心者"
  npc_override_geffen_in_geffen_taking_our_jobs_censorin_3a714b: "抢我们饭碗、审查媒体、搞坏教育系统、制造空气污染、发动战争、还搞说唱音乐……"
  npc_override_geffen_in_geffen_tell_me_about_eb61e0: "可不是嘛。"
  npc_override_geffen_in_geffen_tend_you_know_6d91cc: "总是那样，你知道的……"
  npc_override_geffen_in_geffen_thanks_number_internet_w_ee8bdc: "多亏了大量的网络日志，这个大脑变得平和，决定不再按原计划统治世界。"
  npc_override_geffen_in_geffen_them_time_dfea5c: "。"
  npc_override_geffen_in_geffen_there_item_protect_caste_5622b4: "但有一种物品可以保护施法者免受恶果，使其安全地使用某些魔法。那就是闪耀的神秘石头——宝石。"
  npc_override_geffen_in_geffen_there_s_magic_school_nor_19f5c7: "城市西北部有一所魔法学校，面向有兴趣成为法师的初学者。在那里，他们可以学习魔法的基础。"
  npc_override_geffen_in_geffen_there_s_no_way_you_4866f2: "你不可能错过这个！现在，你想要几把？"
  npc_override_geffen_in_geffen_there_skillful_weapon_sm_b8190e: "曾经有一个技艺精湛的武器工匠"
  npc_override_geffen_in_geffen_there_some_new_fashions_a6fc6d: "卢恩·米德加尔特王国最近流行起了一些新时尚！"
  npc_override_geffen_in_geffen_they_re_hard_working_peo_8d44e2: "但他们都是勤劳的人。而且，他们提炼的矿石和打造的武器需求量很大。"
  npc_override_geffen_in_geffen_they_ve_plagued_humans_l_db3432: "它们长期困扰人类，但在人类和怪物之间的一场大战中被彻底消灭了。"
  npc_override_geffen_in_geffen_those_kinds_concepts_mig_70a6bf: "这些概念对你这样的新手来说可能太深奥了。"
  npc_override_geffen_in_geffen_truth_monsters_existed_s_1f0661: "事实是，怪物自古以来就存在。怪物时代是怪物力量达到巅峰的时期。"
  npc_override_geffen_in_geffen_try_make_amends_swallow_2cbbc1: "试着弥补，放下自尊，必要时真诚地道歉。友谊不值得这样做吗？我觉得值得。"
  npc_override_geffen_in_geffen_ugh_167de7: "呃……"
  npc_override_geffen_in_geffen_uh_i_buy_white_potions_d0ee89: "呃，我能不能换白色药水？"
  npc_override_geffen_in_geffen_um_b716d0: "嗯……"
  npc_override_geffen_in_geffen_um_i_m_sorry_40d7f6: "嗯，对不起。"
  npc_override_geffen_in_geffen_um_i_sense_strong_love_f4edf7: "嗯，我感觉到你的灵魂散发出强烈的爱情能量。它相当有威慑力，会把软弱和无能的人推开。"
  npc_override_geffen_in_geffen_um_if_you_re_planning_f548d2: "嗯，但如果你打算去那里，最好不要单独去。我真的建议你要做好充分准备，如果你要打那种怪物的话。"
  npc_override_geffen_in_geffen_um_spirits_tell_me_you_5b147b: "嗯，灵魂告诉我，不管你买多少张彩票，都中不了奖的。很抱歉，但这是事实。"
  npc_override_geffen_in_geffen_unfortunately_he_lost_al_af005c: "不幸的是，他失去了所有的儿子，"
  npc_override_geffen_in_geffen_very_carefully_b6c88b: "非、常、小心。^000000"
  npc_override_geffen_in_geffen_very_soon_4b5f3f: "中很快流行起来！"
  npc_override_geffen_in_geffen_w_waaaaait_afbc7e: "等等等～"
  npc_override_geffen_in_geffen_w_waaaait_you_didn_t_33ddb8: "等等等等！你都没让我告诉你红色药水还能帮你在该胖的地方胖、该瘦的地方瘦！等等啊！"
  npc_override_geffen_in_geffen_w_wait_89fa52: "等等……"
  npc_override_geffen_in_geffen_w_whoa_dd5efa: "哇……！"
  npc_override_geffen_in_geffen_waaah_bc6e43: "^3355FF哇啊～！"
  npc_override_geffen_in_geffen_wait_sec_45e3ae: "等等……"
  npc_override_geffen_in_geffen_wanna_drink_me_39b3a3: "要不要跟我喝一杯？"
  npc_override_geffen_in_geffen_wasn_t_because_whole_dra_f2caea: "不会是因为拉绳的事吧？"
  npc_override_geffen_in_geffen_we_pretty_much_only_serv_5b9557: "我们这里基本上只供应水。还有那种非常难喝的仿制酒精饮料。"
  npc_override_geffen_in_geffen_we_psychic_consultants_a_f0c6d5: "我们占卜顾问其实没有受过时尚方面的训练，但我希望至少能帮到你一点点。"
  npc_override_geffen_in_geffen_we_psychics_pretty_accur_e5a3d3: "我们占卜师在这方面可是很准的。看到你和伴侣这么幸福，真是太好了！"
  npc_override_geffen_in_geffen_we_ve_got_some_kind_81618e: "我们这里有个总待在角落里的算命师，还有一个总是找法师茬子的吵闹好斗的醉汉。"
  npc_override_geffen_in_geffen_weird_b9a0e4: "^3355FF奇怪……"
  npc_override_geffen_in_geffen_weird_brain_thing_defini_d26893: "这个奇怪的大脑一定会成为善的力量，成为人类的慈爱恩人，只要人们继续在网上写个人日记。"
  npc_override_geffen_in_geffen_welcome_geffen_9aa573: "欢迎来到吉芬，"
  npc_override_geffen_in_geffen_well_7b1901: "好吧……"
  npc_override_geffen_in_geffen_well_any_case_concentrat_63ac47: "嗯，不管怎样，专注学业虽然辛苦，但会有回报的。希望你无论做什么都能取得好成绩～"
  npc_override_geffen_in_geffen_well_as_you_may_already_56baff: "嗯，你可能已经知道了，因为巫师和法师在吉芬修炼，怪物倾向于远离这座城市。所以疲惫的冒险者欢迎来这里休息。"
  npc_override_geffen_in_geffen_well_i_guess_you_thank_bca9a1: "嗯，我想吉芬的经济得感谢铁匠。当然，他们总是脏兮兮、汗津津、臭烘烘的，说话也有点粗鲁……"
  npc_override_geffen_in_geffen_well_i_hope_i_settled_e722d7: "好了，希望我解开了你对未来的疑虑。毕竟，这就是我作为专业灵媒顾问的工作。随时欢迎再来～"
  npc_override_geffen_in_geffen_well_i_ve_heard_they_b42cc9: "嗯，我听说他们要在"
  npc_override_geffen_in_geffen_well_i_wouldn_t_know_aabbda: "这个嘛，我可不知道。我为了成为法师，学习太辛苦了。我整夜都在熬夜，为一切与魔法有关的事情而苦恼。"
  npc_override_geffen_in_geffen_well_juno_monster_museum_c4e226: "嗯，朱诺怪物博物馆现在对公众开放了。他们有迷人的展览，各种怪物都在展出！"
  npc_override_geffen_in_geffen_well_well_well_aren_t_a7497e: "哎呀呀。你真是个漂亮的姑娘。今天恰好就是你的幸运日！"
  npc_override_geffen_in_geffen_well_you_need_money_live_23571e: "嗯，生活需要钱，但光有钱不算生活。别忘了还有其他重要的事情。还有，尽量不要压力太大，好吗？"
  npc_override_geffen_in_geffen_went_heaven_anxiety_bb64be: "不会带着遗憾去天堂的。"
  npc_override_geffen_in_geffen_what_2d63f0: "^990000什么……？！"
  npc_override_geffen_in_geffen_what_67bccd: "我能"
  npc_override_geffen_in_geffen_what_d_you_just_say_2d5643: "你刚说什么？"
  npc_override_geffen_in_geffen_what_i_meant_say_cf50ea: "我的意思是说"
  npc_override_geffen_in_geffen_what_i_remember_he_seeme_c9a800: "依我所记得的，他看起来很沮丧，觉得永远也完成不了他的小项目。"
  npc_override_geffen_in_geffen_what_i_tell_you_about_034100: "关于人生我能告诉你什么呢？让我快速联系一下灵界～"
  npc_override_geffen_in_geffen_what_matters_supernatura_12ac09: "这和超自然的事情有什么关系？嗯，让我联系一下灵魂。啊！来了……"
  npc_override_geffen_in_geffen_what_part_i_whup_you_b922c5: "^990000我说的^FF0000就在这儿把你揍扁^000000 ^990000你是哪句听不懂？！够了，你这个变态！^000000"
  npc_override_geffen_in_geffen_what_s_also_exciting_exp_cf0962: "同样令人兴奋的是，你们冒险者为卢恩·米德加兹王国所取得的探索成就。"
  npc_override_geffen_in_geffen_what_s_shape_eleven_side_4d5161: "十一条边的是什么形状？你不能指望我一下子就想出来。我是占卜师，又不是数学家！"
  npc_override_geffen_in_geffen_what_s_so_weird_023847: "什么很奇怪吗？"
  npc_override_geffen_in_geffen_what_strong_guy_like_you_4e0e5a: "像你这么强壮的男人要刀做什么？在你那超强力量的挥砍下，刀只会断掉！"
  npc_override_geffen_in_geffen_what_you_really_c6f5ff: "你真正"
  npc_override_geffen_in_geffen_whatever_f6ba8a: "不管是什么～"
  npc_override_geffen_in_geffen_whatever_you_don_t_work_a8ebe8: "不管你做什么，千万别在卢恩·米德加兹当占卜师。真正的财路，显然是在发现新大陆上。我当初怎么就没走这条路呢？！"
  npc_override_geffen_in_geffen_when_greatest_deal_your_9592b0: "这辈子最划算的买卖就在眼前？！可悲，真可悲……"
  npc_override_geffen_in_geffen_when_new_land_discovered_385688: "当发现新大陆时，通常会有该地区特有的独特怪物。"
  npc_override_geffen_in_geffen_where_could_591e0b: "但我去哪里"
  npc_override_geffen_in_geffen_which_dreams_exactly_wel_50b6f1: "具体哪些梦想？嗯，灵魂们今天特别沉默。它们不太想说话。灵魂也有自己的生活，你知道的。等等，这话说的通吗？"
  npc_override_geffen_in_geffen_while_developing_powerfu_2dcf0b: "在开发一把强力武器的时候。"
  npc_override_geffen_in_geffen_while_i_researching_magi_2fedc4: "我在研究魔法时，发现了这卷神秘的卷轴。它描述了一棵名为世界树的巨树。"
  npc_override_geffen_in_geffen_white_potions_oh_those_d_acb21a: "白色药水？哦，那玩意儿根本不存在。不过呢，呃，如果有人在卖那种货，带过来给我，我好，嗯，检验一下有什么区别。但没错，我这才是真货。"
  npc_override_geffen_in_geffen_whoa_2d61c2: "哇……"
  npc_override_geffen_in_geffen_whoa_326398: "哇～！"
  npc_override_geffen_in_geffen_whoa_80ab4f: "哇！"
  npc_override_geffen_in_geffen_whoa_s_almost_asking_too_773190: "哇，这要求也太过分了！好吧好吧……"
  npc_override_geffen_in_geffen_whoa_whoa_cde082: "哇，哇！"
  npc_override_geffen_in_geffen_why_s_all_thanks_blacksm_a4928c: "嘿，那全都得归功于铁匠！不过你应该早就知道了吧？"
  npc_override_geffen_in_geffen_wizard_bwahaha_07af5a: "巫师？！哈哈哈！"
  npc_override_geffen_in_geffen_wizards_access_more_powe_45d615: "巫师能使用比法师更强大、更具破坏性的魔法。法师可以在吉芬塔顶层申请成为巫师。"
  npc_override_geffen_in_geffen_wonderful_51f90c: "美好"
  npc_override_geffen_in_geffen_world_events_09cf3c: "天下大事！"
  npc_override_geffen_in_geffen_wow_46eaec: "哇……"
  npc_override_geffen_in_geffen_wow_s_really_broad_categ_277bf6: "哇，这范围可真广。不过让我联系一下灵界的一些灵魂，看看能帮到你什么。"
  npc_override_geffen_in_geffen_y_y_y_yes_sir_334a31: "是、是、是、是，先生！"
  npc_override_geffen_in_geffen_ya_fancy_schmancy_mage_243c78: "你这个花里胡哨的法师！"
  npc_override_geffen_in_geffen_yeah_872dd3: "是啊……"
  npc_override_geffen_in_geffen_yeah_i_got_stuff_dd94f4: "对，我有货！"
  npc_override_geffen_in_geffen_yes_8108a4: "是的……"
  npc_override_geffen_in_geffen_you_0cc832: "你"
  npc_override_geffen_in_geffen_you_been_some_these_new_fc0fe3: "你去过那些新发现的地方吗？它们真的很有趣，你可以从这些异国文化中学到很多东西。"
  npc_override_geffen_in_geffen_you_c09be9: "你……"
  npc_override_geffen_in_geffen_you_d_probably_ce05f9: "你大概"
  npc_override_geffen_in_geffen_you_d_probably_get_cocky_7d3995: "你可能会骄傲自满，荒废学业，考试不及格，引发时间悖论。我是说，我必须真的在未来才能看到它，你知道吗？"
  npc_override_geffen_in_geffen_you_didn_t_let_me_270e3e: "你都没让我把话说完。我的意思是……"
  npc_override_geffen_in_geffen_you_ever_seen_any_orcs_18161f: "你见过半人兽人部族吗？如果从这里往南走，我想你可以在深林里找到兽人。"
  npc_override_geffen_in_geffen_you_get_hell_away_my_0f8fd3: "^990000你给我离我女儿远点，你这种贱货，不然我就把你的器官卖了换 Zeny！"
  npc_override_geffen_in_geffen_you_heal_all_your_wounds_f8650e: "只要喝红色药水就能治好所有伤口！而且我只卖你 ^FF3333500 Zeny^000000 一瓶！"
  npc_override_geffen_in_geffen_you_hear_me_054246: "听到了没有？！^000000"
  npc_override_geffen_in_geffen_you_heard_0d83e2: "你听说了吗？"
  npc_override_geffen_in_geffen_you_just_gotta_believe_m_d7b60e: "你就相信我吧！"
  npc_override_geffen_in_geffen_you_know_ally_rune_midga_b0b7e8: "你知道的，卢恩·米德加兹王国的盟友。嗯……我们的首都是朱诺？"
  npc_override_geffen_in_geffen_you_know_c90368: "你知道"
  npc_override_geffen_in_geffen_you_know_kind_lame_sense_e9c231: "你知道的，就是那种冷笑话的，上面写着'灾难性的（猫咪性的）'，还有一只穿着疯狂科学家衣服的小猫什么的。"
  npc_override_geffen_in_geffen_you_know_name_b9080a: "你知道"
  npc_override_geffen_in_geffen_you_know_we_don_t_03ac9f: "你知道我们这里不再供应酒了。我们只有这些假的、没有味道、毫无效果的饮料。是啊，它们挺无聊的……"
  npc_override_geffen_in_geffen_you_know_where_they_tend_f3d7d6: "你知道的，就是温柔地低声甜言蜜语，然后……哦！我真的很想知道！"
  npc_override_geffen_in_geffen_you_listening_e0c716: "在偷听的？"
  npc_override_geffen_in_geffen_you_look_so_0cff38: "你看起来真……"
  npc_override_geffen_in_geffen_you_look_strong_enough_k_0434b0: "你看起来足够强大去迎接那种挑战。但如果你看到更鲁莽的人穿过西桥，你可能想警告他们一下。"
  npc_override_geffen_in_geffen_you_might_understand_lit_ad2689: "你现在可能不明白这小道理，但随着你对这个疯狂世界的了解加深，你就会明白了。"
  npc_override_geffen_in_geffen_you_must_take_initiative_a4d698: "你必须主动出击！试着不要太被情绪左右，去解决这件事。"
  npc_override_geffen_in_geffen_you_perfect_woman_soon_f_31ad8e: "^3355FF你和完美的女人很快就会坠入爱河^000000。对，这才是我的意思！"
  npc_override_geffen_in_geffen_you_re_asking_me_about_ee637f: "你问我成绩？这太奇怪了。我是说，学校才管你的成绩单吧？"
  npc_override_geffen_in_geffen_you_re_looking_91d505: "你该不是在找"
  npc_override_geffen_in_geffen_you_re_mage_30380b: "你不是法师！"
  npc_override_geffen_in_geffen_you_re_serious_c32581: "你是认真的……"
  npc_override_geffen_in_geffen_you_re_trading_business_6775a3: "你自己也是做买卖的，对吧？所以你当然明白我们正处于贸易的黄金时代！"
  npc_override_geffen_in_geffen_you_should_really_b1ff4a: "你真的应该"
  npc_override_geffen_in_geffen_you_soon_swept_off_your_5f2372: "^3355FF你很快就会被完美的男人迷倒^000000。对，这才是我的意思！"
  npc_override_geffen_in_geffen_you_step_away_09bdd2: "^3355FF你慢慢退开。"
  npc_override_geffen_in_geffen_you_sure_dressed_pretty_755709: "你穿得可真漂亮，"
  npc_override_geffen_in_geffen_you_sure_like_ask_imposs_bc647b: "你还真是喜欢强人所难啊。好吧，我现在就告诉你。全世界没有别的商人能卖只有我能提供的货。"
  npc_override_geffen_in_geffen_you_t_even_you_00cd19: "可你根本不会那招，对吧？"
  npc_override_geffen_in_geffen_you_wanna_get_your_hands_c86f87: "想弄点好东西吗？过来！^000000"
  npc_override_geffen_in_geffen_you_want_know_your_love_e42820: "你想知道爱情运？噢吼～那你一定有喜欢的人了！来吧，你可以告诉我的！"
  npc_override_geffen_in_geffen_your_dreams_3541cb: "你的梦想"
  npc_override_geffen_in_geffen_your_grades_you_re_still_2b5050: "成绩？你还在上学？佩服佩服！你的眼神告诉我，你比同龄人成熟得多。好的，让我联系一下灵魂……"
