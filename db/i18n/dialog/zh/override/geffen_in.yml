  npc_override_geffen_in_magic_books_when_you_approach_docume_191cb0: "当你接近那些文件时，一个看起来像档案管理员的巨人试图召唤守卫加尔顿。你应该赶快离开这里。"
  npc_override_geffen_in_magic_books_when_you_fail_bind_such_b2d382: "当你未能绑定如此强大的法术或未能控制它们时，你的身心可能会受到无法挽回的伤害。"
  npc_override_geffen_in_magic_books_when_you_use_complex_mag_6199ff: "当你使用复杂的法术召唤风暴、释放闪电或焚烧一片区域时，这会在身体和精神上消耗大量能量。"
