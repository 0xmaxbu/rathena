  npc_override_geffen_in_geffen_we_psychics_pretty_accur_e5a3d3: "我们通灵师在这类事情上是很准的。看到你和伴侣真的很幸福，真是太好了！"
  npc_override_geffen_in_geffen_we_ve_got_some_kind_81618e: "我们这里有个算命师，总是待在角落里；还有一个好战的大嗓门醉鬼，老是找魔法师的麻烦。"
