  npc_override_geffen_in_geffen_very_soon_4b5f3f: "很快！"
  npc_override_geffen_in_geffen_visit_geffen_i_impress_37a254: "来吉芬吧，我对它的印象深刻。当然，这座魔法塔是它成为全王国魔法之都的首要原因。"
  npc_override_geffen_in_geffen_visit_geffen_nearly_10_3a9463: "来吉芬吧，将近100年前，当这座塔建成时，人们从四面八方蜂拥而至。现在吉芬是米德加兹中部最大的城市之一。"
  npc_override_geffen_in_geffen_w_waaaaait_afbc7e: "等——等一下——"
