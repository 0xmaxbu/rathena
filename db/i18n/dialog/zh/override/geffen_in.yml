  npc_override_geffen_in_geffen_weird_brain_thing_defini_d26893: "这个奇怪的大脑一定会成为善良的源泉，人类充满爱心的恩人，只要人们继续在网上写个人日志。"
  npc_override_geffen_in_geffen_weird_kind_scholar_aske_47301b: "有个怪学者问过我这事。他付钱请我帮他照看药水，因为他要去别的地方看看。"
