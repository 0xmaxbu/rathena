  npc_override_geffen_in_mage_mage_actually_elemental_spirits_466f96: "其实，元素精灵们不久前发生了意外。一个学徒错误地施放了魔法，召唤出了怪物的灵魂。这引发了大混乱。"
  npc_override_geffen_in_mage_mage_after_spirits_had_taken_016de6: "精灵们平静下来后，我们决定应该研究怪物的灵魂，以防再次发生类似事件。我们需要为此制作一个特殊的容器。"
  npc_override_geffen_in_mage_mage_after_that_we_regret_t_26b171: "之后，我们后悔已经太晚了。怪物灵魂在容器内合而为一，创造了前所未有的怪物形态。"
  npc_override_geffen_in_mage_mage_after_that_you_must_goe66b16: "然后你必须走在所有魔法使用者梦想中的正确道路上。"
  npc_override_geffen_in_mage_mage_after_you_experience_m_732c36: "在你体验了与元素精灵的交流之后，我会告诉你你是否有资格成为一个巫师。"
  npc_override_geffen_in_mage_mage_as_wizards_we_communica_3bd36e: "作为巫师，我们与元素精灵交流以学习和使用咒语。但是，只有当我们经历了元素精灵本身的体验，我们才能施展终极魔法。"
  npc_override_geffen_in_mage_mage_bear_mind_magic_seems_e_f7e8f4: "请记住，魔法看似强大，但如果你不恰当地使用它，它可能会导致非常可怕的后果。"
  npc_override_geffen_in_mage_mage_bring_book_water_from_h7e3b9f: "从霍尼那里带来水之书。霍尼正在吉芬塔地下室研究灵魂。"
