  npc_override_geffen_in_geffen_well_7b1901: "嗯……"
  npc_override_geffen_in_geffen_well_any_case_concentrat_63ac47: "嗯，无论如何，集中精力学习虽然困难，但也很有回报。希望你能在自己选择的路上做得好~"
  npc_override_geffen_in_geffen_well_as_you_may_already_56baff: "嗯，你可能已经知道了，由于巫师和魔法师在吉芬修炼，魔物通常会远离这座城市。所以疲惫的冒险者可以在这里休息。"
  npc_override_geffen_in_geffen_well_i_guess_you_thank_bca9a1: "嗯，我想你可以感谢铁匠们为吉芬带来的经济。当然，他们总是脏兮兮、汗流浃背、臭烘烘的，说话也有点粗鲁……"
  npc_override_geffen_in_geffen_well_i_hope_i_settled_e722d7: "嗯，我希望我已经消除了你对未来的任何疑虑。毕竟，那是我作为职业通灵顾问的工作。欢迎随时再来~"
  npc_override_geffen_in_geffen_well_i_ve_heard_they_b42cc9: "嗯，我听说他们正在开通新的飞艇服务"
  npc_override_geffen_in_geffen_well_i_wouldn_t_know_aabbda: "嗯，我不知道。我为了成为魔法师一直在努力学习。我整夜熬夜，为所有与魔法有关的事情而苦恼。"
  npc_override_geffen_in_geffen_well_juno_monster_museum_c4e226: "嗯，朱诺魔物博物馆现在已经向公众开放了。他们有一个很吸引人的展览，各种魔物正在展出！"
  npc_override_geffen_in_geffen_well_well_well_aren_t_a7497e: "哎呀呀，看看你，真是个漂亮的姑娘。今天正好是你的幸运日！"
