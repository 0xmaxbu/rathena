  npc_override_geffen_in_mage_nothing_24207d: "没什么……？"
  npc_override_geffen_in_mage_oh_man_your_basic_skill_9e45ac: "哦，天哪，你的基础技能等级还不够成为魔法师。"
  npc_override_geffen_in_mage_one_these_days_you_ll_7b59e9: "总有一天，当你能用意念召唤火焰时，你就会意识到自己内心的力量！"
  npc_override_geffen_in_mage_oooh_you_re_such_hot_44dd4e: "哦哦，你真是个辣妹~！"
  npc_override_geffen_in_mage_past_there_complicated_p_62321b: "过去有一个复杂的药水制作测试。因为这个，我们流失了很多申请者。"
  npc_override_geffen_in_mage_right_you_said_you_wanna_300a0c: "对了，你说你想成为魔法师？"
  npc_override_geffen_in_mage_so_we_decided_accept_all_61bcbb: "所以，我们决定接受所有满足基本条件的申请者。"
  npc_override_geffen_in_mage_take_your_time_more_you_3f4171: "慢慢来。你学得越多，就越能准备好再次学习魔法。"
  npc_override_geffen_in_mage_there_anything_more_i_he_2d1bc1: "还有什么我能帮你的吗？如果没有，为什么不出去试试你的技能呢？世界在等着你~！"
  npc_override_geffen_in_mage_wanna_mage_eh_428fe7: "想成为魔法师？嗯……"
  npc_override_geffen_in_mage_wanna_mage_eh_b402bf: "想成为魔法师，嗯？"
  npc_override_geffen_in_mage_we_welcome_you_mage_guil_2b8f42: "欢迎你加入魔法师公会，我们的新朋友！"
  npc_override_geffen_in_mage_welcome_mage_guild_d194e8: "「欢迎来到魔法师公会~」"
  npc_override_geffen_in_mage_well_since_you_passed_ma_cde9a8: "嗯，既然你已经通过了一次魔法师考试，我不会质疑你的资格。你想要立即恢复你的魔法技能，对吧？"
  npc_override_geffen_in_mage_whaaaaat_right_after_you_121bee: "什——么——？！你刚说完想成为魔法师就改变主意了？！果断一点！"
  npc_override_geffen_in_mage_what_you_interested_mage_c01875: "怎么，你对魔法师公会有兴趣？我不想告诉你这个，但你不属于这里。"
  npc_override_geffen_in_mage_whoa_long_time_no_see_7b758a: "哇，好久不见！不过你不是应该已经死了吗？"
  npc_override_geffen_in_mage_wow_some_reason_you_look_083ffd: "哇，不知为什么，你看起来比以前好多了。不过我相信你也会成为一名更好的魔法师。"
  npc_override_geffen_in_mage_you_8a836b: "你是……{0}。"
  npc_override_geffen_in_magic_books_according_humans_informa_42df66: "^660066根据人类的资料，这种精华构成了四大自然元素之一。^000000"
  npc_override_geffen_in_magic_books_afterwards_create_bring_ec64ff: "之后，制作并给我带来那件神器。之后我们再谈魔法书的制作。"
  npc_override_geffen_in_magic_books_ah_i_ll_get_myself_52a407: "啊，我再待下去会给自己惹麻烦的。也许我已经惹上了……"
  npc_override_geffen_in_magic_books_ah_so_you_want_intermedi_b88582: "啊，所以你想要中级魔法书。如果你支付 ^4d4dff100,000 Zeny 的押金^000000，我们会借给你一本中级魔法书。"
  npc_override_geffen_in_magic_books_ah_there_s_silver_lining_5cc73e: "啊，但还是有好消息的！"
  npc_override_geffen_in_magic_books_all_depends_your_ability_237570: "这完全取决于你控制法术的能力。你必须在学会魔法绑定后亲身体验才能真正理解。"
  npc_override_geffen_in_magic_books_alright_then_let_s_get_f210fa: "好吧，那我们开始吧！"
  npc_override_geffen_in_magic_books_anything_useful_836cc1: "有什么有用的东西吗？"
  npc_override_geffen_in_magic_books_as_i_said_earlier_spells_cdd5de: "正如我之前所说，魔法书中的法术往往会回归其本质。"
  npc_override_geffen_in_magic_books_as_you_know_four_element_c12d8e: "如你所知，四大元素是火、水、风和地。能够自由运用它们就是魔法的基本原理。"
  npc_override_geffen_in_magic_books_aw_you_don_t_s_254bf3: "哦，你没有吗？真遗憾，但我也无能为力。等你有足够的钱了再来吧，好吗？"
  npc_override_geffen_in_magic_books_book_t_used_just_anyone_af625a: "那本书可不是任何人都能用的，你知道吗？"
  npc_override_geffen_in_magic_books_carrying_globes_four_ele_d09f29: "携带四大元素的球体也与魔法绑定有关。"
  npc_override_geffen_in_magic_books_circles_magic_work_organ_1bf7b3: "魔法循环是有机地协同工作的。当你使用冰冻术来绑定一个法术时，该法术不会激活，直到你施放释放法术为止。"
  npc_override_geffen_in_magic_books_congratulations_entering_b29c8f: "恭喜你进入了全新的魔法世界。"
  npc_override_geffen_in_magic_books_course_binding_spell_con_a9af1f: "当然，绑定法术会持续消耗你的魔力，但比传统魔法消耗的魔力要少。"
  npc_override_geffen_in_magic_books_did_did_you_just_say_40e790: "你……你刚才说的是终极魔法书吗？"
  npc_override_geffen_in_magic_books_did_old_man_recommend_me_e478e7: "是那位老先生推荐你来找我的吗？"
  npc_override_geffen_in_magic_books_documents_container_aren_b81433: "这个容器里的文件无法辨认。试着阅读也没用。"
  npc_override_geffen_in_magic_books_documents_making_you_fee_1d8d8e: "这些文件让你感到恶心。你应该等胃里舒服些了再来。"
  npc_override_geffen_in_magic_books_don_t_try_out_just_b9bec7: "不要只是为了自己看看效果就去尝试！在施法时睡着？对我们这些魔法修炼者来说，没有比这更丢人的了。"
  npc_override_geffen_in_magic_books_don_t_you_know_how_a6321a: "你不知道有多少人也想要你手上的那本书吗？想要不止一本有点自私哦。"
  npc_override_geffen_in_magic_books_essence_flame_refined_st_ffbd1b: "^660066火焰精华可以在托尔火山洞穴一楼的稳定地面上精炼。需要 10 块爱之煤炭来精炼精华。^000000"
  npc_override_geffen_in_magic_books_essence_last_permanently_5d3f68: "^008800{0}精华将永久持续，除非出现问题。^000000"
  npc_override_geffen_in_magic_books_even_if_you_create_one_6ceed5: "即使你制作了一本，它的力量也会超出你的能力范围。"
  npc_override_geffen_in_magic_books_few_scholars_midgard_con_8985d8: "米德加尔特大陆的一些学者曾试图收集古代魔法书并重现那本书，但是……"
  npc_override_geffen_in_magic_books_frankly_i_m_only_interes_e00593: "坦白说，我只对制作终极魔法书感兴趣。"
  npc_override_geffen_in_magic_books_frankly_i_ve_never_even_ba83d1: "坦白说，我从未见过终极魔法书。"
  npc_override_geffen_in_magic_books_freezing_spell_used_magi_ec256a: "冰冻术用于魔法绑定。它帮助你将魔法法术插入到魔法循环中。"
  npc_override_geffen_in_magic_books_galfos_near_expedition_c_2621ff: "加尔弗斯在次元裂隙外的远征队营地附近。"
  npc_override_geffen_in_magic_books_ha_ha_d039c4: "哈哈……"
  npc_override_geffen_in_magic_books_ha_ha_i_m_sorry_98d4ea: "哈哈，抱歉，你应该专注于强化你的身体，而不是制作魔法书。"
  npc_override_geffen_in_magic_books_ha_ha_you_also_seeking_717d59: "哈哈，你也在寻求新的知识吗？"
  npc_override_geffen_in_magic_books_hah_you_re_silly_fb7879: "哈！你真傻。"
  npc_override_geffen_in_magic_books_he_s_been_taking_great_f89918: "他对古代魔法书产生了浓厚的兴趣。"
  npc_override_geffen_in_magic_books_hey_what_did_i_tell_a73fa3: "嘿，我怎么跟你说的？没有钱我就买不起制作书的工具！"
  npc_override_geffen_in_magic_books_his_name_galfos_72f429: "他的名字叫加尔弗斯。"
  npc_override_geffen_in_magic_books_how_may_i_help_you_cc1359: "有什么可以帮你的？"
  npc_override_geffen_in_magic_books_huh_you_looking_ultimate_dcec4e: "咦，你在找终极魔法书？谁派你来的？"
  npc_override_geffen_in_magic_books_i_able_refine_essence_fo_a0e9e7: "^660066我成功地从矿山洞穴二楼的古老岩石中精炼出了化石精华。到目前为止，那个地方是所有测试场地中最稳定的。"
  npc_override_geffen_in_magic_books_i_better_forget_equip_my_a1e10f: "我最好别忘了装备我的戒指。"
  npc_override_geffen_in_magic_books_i_didn_t_know_someone_627bf9: "我不知道真的会有人对那本书感兴趣。是的，我正在研究那本魔法书。你是怎么发现的？"
  npc_override_geffen_in_magic_books_i_didn_t_support_him_1446c7: "我没有支持他，也没有为他的研究提供任何建议，因为我觉得他很快就会放弃，但是……"
  npc_override_geffen_in_magic_books_i_heard_you_ve_studied_a08dd7: "我听说你研究过终极魔法书。"
  npc_override_geffen_in_magic_books_i_m_good_using_magic_4722c3: "我不擅长使用魔法，更不用说我喜欢在战斗中用拳头了。不过，我发现魔法书非常迷人。"
  npc_override_geffen_in_magic_books_i_m_here_babysit_get_60ef3d: "我不是来当保姆的。滚开！"
  npc_override_geffen_in_magic_books_i_m_sorry_could_you_aec874: "抱歉，你能找别人吗？我现在有点忙。"
  npc_override_geffen_in_magic_books_i_m_sorry_i_don_8f4c63: "抱歉，我不和那些还没准备好的人说话。"
  npc_override_geffen_in_magic_books_i_m_sorry_i_only_38aca1: "抱歉，我只有初学者的魔法书，但显然它们不适合你。你还想要一本吗？"
  npc_override_geffen_in_magic_books_i_m_sorry_i_t_70bda7: "很抱歉我没能给你更多帮助。"
  npc_override_geffen_in_magic_books_i_m_sorry_my_knowledge_962042: "抱歉，我的知识与你无关。"
  npc_override_geffen_in_magic_books_i_m_sorry_our_management_25487c: "抱歉，我们管理层最近决定限制多循环师使用魔法书。因为他们的数量增长比我们预期的要快。"
  npc_override_geffen_in_magic_books_i_m_sorry_there_s_8da08a: "抱歉，关于终极魔法书剩下的信息不多了。"
  npc_override_geffen_in_magic_books_i_need_least_zeny_buy_8f0767: "我至少需要 ^0000aa500,000 Zeny^000000 来购买所有必需的工具。你有钱吗？"
  npc_override_geffen_in_magic_books_i_need_solve_one_last_6f2b41: "我还需要解决最后一个问题才能制作魔法书。"
  npc_override_geffen_in_magic_books_i_succeeded_refining_ess_9e492c: "^660066我成功地在冰洞穴三楼的深处精炼出了冰川精华。如果你想尝试，准备 10 个冰之心，然后前往以下地点。^000000"
  npc_override_geffen_in_magic_books_i_t_believe_someone_actu_38b47d: "我真不敢相信真的有人想要那本书。"
  npc_override_geffen_in_magic_books_i_ve_heard_he_s_3680a1: "我听说他在次元裂隙外的远征队营地附近，为了寻找关于古代魔法书的信息。"
  npc_override_geffen_in_magic_books_i_ve_perfectly_restored_91ad15: "我已经根据古代文献完美地恢复了这些法术，但我仍然没有关于所需神器的信息。"
  npc_override_geffen_in_magic_books_if_he_s_discovered_anyth_2508f8: "如果他发现了什么有用的东西，也许对你有帮助。"
  npc_override_geffen_in_magic_books_if_our_management_releas_e1b6f1: "如果我们管理层解除限制，你会是第一个知道的。别担心。"
  npc_override_geffen_in_magic_books_if_you_d_like_try_03aef5: "如果你想尝试，准备 10 个朱庇特之石，然后前往那个地牢。祝你好运。^000000"
  npc_override_geffen_in_magic_books_if_you_want_see_him_0bc97f: "如果你想见他，你应该准备好长途旅行。"
  npc_override_geffen_in_magic_books_intermediate_superior_ma_1cc642: "中级和高级魔法书在借阅终极魔法书时必须归还。记住你只是借用它们，所以一定要好好保管那些书。"
  npc_override_geffen_in_magic_books_learn_spell_first_i_ve_7a49f7: "先学会这个法术吧。我有好多话要告诉你。"
  npc_override_geffen_in_magic_books_let_s_compare_spell_scro_b55a5e: "让我们把卷轴上的法术比作一根金属丝。当金属丝被用来开门或做其他事情时，它会被弯曲和挤压，失去原来的形状。魔法书中的法术更像是形状记忆合金。"
  npc_override_geffen_in_magic_books_like_alloy_spell_magic_b_9572b0: "像合金一样，魔法书中的法术在使用后仍然存在，虽然重复使用法术需要时间来恢复。"
  npc_override_geffen_in_magic_books_loan_deposit_z_deposit_a_1d9d38: "^4d4dff押金是 100,000 Zeny^000000。由于魔法书的变化，押金已相应调整。"
  npc_override_geffen_in_magic_books_loan_deposit_z_deposit_a_c20012: "^4d4dff押金是 500,000 Zeny^000000。由于魔法书的变化，押金已相应调整。"
  npc_override_geffen_in_magic_books_magic_binding_becomes_mo_6b0468: "当你使用更强大的法术时，魔法绑定会变得更加困难。"
  npc_override_geffen_in_magic_books_magic_books_advanced_typ_b95572: "魔法书是魔法卷轴的进阶类型。卷轴上的法术使用一次后就会消失，而魔法书中的法术可以多次施放。"
  npc_override_geffen_in_magic_books_magic_books_ah_you_look_ed4475: "啊，你看起来很有魔法天赋。我的商店里有所有你需要的魔法书。看看吧。"
  npc_override_geffen_in_magic_books_magic_books_call_lightni_9f7d97: "雷击术是3级闪电魔法。能造成相当于150%魔法攻击力的无视防御伤害。每次施放消耗32sp。"
  npc_override_geffen_in_magic_books_magic_books_cold_bolt_is_3c203c: "冰箭术是2级水魔法。冰箭术的伤害随着技能等级提升而增加。每次施放消耗12sp。"
  npc_override_geffen_in_magic_books_magic_books_fire_ball_is_43db7b: "火球术是2级火魔法。火球术的伤害随着技能等级提升而增加。每次施放消耗25sp。"
  npc_override_geffen_in_magic_books_magic_books_fire_bolt_is_a48f19: "火箭术是1级火魔法。火箭术的伤害随着技能等级提升而增加。每次施放消耗12sp。"
  npc_override_geffen_in_magic_books_magic_books_fire_pillar_i_5cc8dd: "火柱是2级火属性区域魔法。当你施放火柱时，火柱会在你指定的地方燃烧。每次施放消耗75sp。"
  npc_override_geffen_in_magic_books_magic_books_frost_diver_is_4f8f53: "冰冻术是3级水魔法。冰冻术的伤害随着技能等级提升而增加。每次施放消耗25sp。"
  npc_override_geffen_in_magic_books_magic_books_hello_i_m_mag_ee52eb: "你好，我是魔法书商人。"
  npc_override_geffen_in_magic_books_magic_books_i_sell_all_kind_45245f: "我出售各种各样的魔法书。"
  npc_override_geffen_in_magic_books_magic_books_lightning_bolt_23d0ce: "雷箭术是2级风魔法。雷箭术的伤害随着技能等级提升而增加。每次施放消耗12sp。"
  npc_override_geffen_in_magic_books_magic_books_napalm_beat_is_586a27: "圣灵召唤是1级念力魔法。圣灵召唤的伤害随着技能等级提升而增加。每次施放消耗9sp。"
  npc_override_geffen_in_magic_books_magic_books_s_fire_pillar_b0e3ee: "火柱只能在地面上施放。被火柱击中的敌人会受到火属性伤害并陷入晕眩状态。"
  npc_override_geffen_in_magic_books_magic_books_soul_strike_is_8f1764: "圣灵召唤是2级念力魔法。圣灵召唤的伤害随着技能等级提升而增加。每次施放消耗25sp。"
  npc_override_geffen_in_magic_books_magic_books_thunder_storm_6a33d3: "雷暴术是3级风属性区域魔法。雷暴术的伤害随着技能等级提升而增加。每次施放消耗71sp。"
  npc_override_geffen_in_magic_books_magic_books_what_kind_of_b_964ae7: "你想买什么样的书？"
  npc_override_geffen_in_magic_books_make_ancient_ultimate_ma_c693e9: "要制作古代终极魔法书，我需要一件神器和一些法术来融合进去。"
  npc_override_geffen_in_magic_books_man_i_almost_lost_my_f33263: "天哪，我差点没控制住那惊人的魔法能量！这是你的魔法书。"
  npc_override_geffen_in_magic_books_master_velofos_asked_me_ad0cbd: "维洛弗斯大师让我把他的魔法书带来。"
  npc_override_geffen_in_magic_books_maybe_s_place_find_some_9e92f8: "也许那里就是找到关于这本终极魔法书神器信息的地方。"
  npc_override_geffen_in_magic_books_menu_heh_46ed4b: "嘿！你来得正是时候：我正要找个测试对象呢。"
  npc_override_geffen_in_magic_books_menu_huh_a98aa1: "咦，你不知道什么是形状记忆合金？呃，只要记住这一点：用形状记忆合金制成的金属丝会随着时间恢复形状。"
  npc_override_geffen_in_magic_books_menu_i_8c3a1e: "我已经发现了关于彗星的一切。：我已经掌握了四重漩涡的巅峰。"
  npc_override_geffen_in_magic_books_menu_let_8af21d: "让我想想。：魔法书（生命吸取）：魔法书（冰霜杰克）：魔法书（大地扭曲）：魔法书（深红岩石）：魔法书（连锁闪电）"
  npc_override_geffen_in_magic_books_menu_let_9da37c: "让我想想。：魔法书（暴风雪）：魔法书（怒雷强击）：魔法书（陨石术）"
  npc_override_geffen_in_magic_books_menu_let_e7d8b3: "让我想想。：我想要中级魔法书。：我想要高级魔法书。：我想要终极魔法书。"
  npc_override_geffen_in_magic_books_menu_nothing_ceab5a: "没什么。：你知道阅读魔法书吗？：冰冻术是什么？：我可以要一本魔法书吗？：我可以在没有冰冻术的情况下使用阅读魔法书吗？：关于终极魔法书"
  npc_override_geffen_in_magic_books_menu_of_04d73f: "当然，伤害不会很严重：你会睡着或者陷入混乱。这都是因为当你试图召唤和持有未学过的法术时，你的魔法书和魔法绑定力量之间发生了冲突。"
  npc_override_geffen_in_magic_books_menu_sure_e5c7f5: "当然可以。：我在哪里可以找到进阶书籍？"
  npc_override_geffen_in_magic_books_menu_there_344a70: "不过有一个问题：我太穷了，连买制作书的工具的钱都不够。"
  npc_override_geffen_in_magic_books_menu_there_97c9f1: "不过有一个缺点：魔法书不能用于你没有学过的法术。"
  npc_override_geffen_in_magic_books_menu_well_c3beb3: "嗯，你已经满足了所有条件，除了一个：你需要释放术。"
  npc_override_geffen_in_magic_books_menu_wh_eaa225: "什……什么？不！：当然。"
  npc_override_geffen_in_magic_books_menu_yes_cac114: "是的，我有。：不，我没有。"
  npc_override_geffen_in_magic_books_ms_lea_ab20b6: "莉亚女士。"
  npc_override_geffen_in_magic_books_my_brother_just_like_you_1943a6: "我的兄弟就像你一样。他对重现终极魔法书非常感兴趣。"
  npc_override_geffen_in_magic_books_my_research_almost_done_3bd4da: "我的研究快完成了，"
  npc_override_geffen_in_magic_books_my_right_arm_feels_hot_1b9b92: "我的右臂感觉很热，而左臂感觉很冷。我永远无法习惯这种奇怪的天气！"
  npc_override_geffen_in_magic_books_no_problem_be5b78: "没问题。"
  npc_override_geffen_in_magic_books_nothing_document_looks_u_6b8fe3: "这份文件中没有什么有用的东西。"
  npc_override_geffen_in_magic_books_nothing_happen_when_you_88be42: "如果你没有使用魔法绑定就试图绑定魔法，什么也不会发生，因为你没有东西来容纳魔法。"
  npc_override_geffen_in_magic_books_nothing_here_looks_speci_660f63: "这里没什么特别的。"
  npc_override_geffen_in_magic_books_now_we_re_getting_somewh_5645ca: "（总算有点进展了！）"
  npc_override_geffen_in_magic_books_oh_did_you_find_0b684a: "哦，你找到了"
  npc_override_geffen_in_magic_books_oh_i_didn_t_mean_f9d913: "……哦，我不是故意说那么久的。总之，你可以用魔法书施放你已经学会的法术。它的概念和普通法术不同。"
  npc_override_geffen_in_magic_books_oh_my_071888: "哦，天哪……"
  npc_override_geffen_in_magic_books_oh_my_i_sense_incredible_508d9b: "哦天哪，我感觉到了你身上不可思议的能量。太好了！现在我们准备好制作终极魔法书了。"
  npc_override_geffen_in_magic_books_oh_yes_perhaps_he_might_ed9ed9: "哦对了，也许他知道些什么。"
  npc_override_geffen_in_magic_books_oh_you_want_superior_mag_36ca49: "哦，你想要高级魔法书？政策已经改变了，现在无条件接受押金，而不是之前那些苛刻的借阅条件。"
  npc_override_geffen_in_magic_books_order_create_essence_lav_722dd3: "^660066为了制作熔岩精华，你必须在托尔火山洞穴二楼最热的地方精炼 40 个燃烧之心。^000000"
  npc_override_geffen_in_magic_books_order_obtain_ultimate_ma_eed0bd: "为了获得终极魔法书，你必须达到等级 140 并学会大地猛击和彗星。"
  npc_override_geffen_in_magic_books_order_refine_essence_sto_805b7c: "^660066为了精炼风暴精华，我拜访了昆仑的隐士棋盘，那里是风之精灵的居所。"
  npc_override_geffen_in_magic_books_order_use_reading_spell_3fc028: "为了使用阅读魔法书，你必须学会冰冻术来绑定魔法。"
  npc_override_geffen_in_magic_books_please_don_t_say_you_476845: "请别说你没有。"
  npc_override_geffen_in_magic_books_please_go_talk_lea_archi_3e9ea7: "请去档案室找 [莉亚] 谈谈。告诉她你需要一本我存放在那里的魔法书。"
  npc_override_geffen_in_magic_books_please_lighten_your_bag_95aebb: "请减轻你的背包负重。"
  npc_override_geffen_in_magic_books_problem_i_t_use_ultimate_71eb00: "问题是即使我制作了终极魔法书，我自己也用不了。这就是为什么我无法独自测试它。"
  npc_override_geffen_in_magic_books_problem_when_you_try_for_b38b1b: "问题在于当你试图强行施放未学过的法术时。这一定会对你造成反噬。"
  npc_override_geffen_in_magic_books_reading_spell_book_liter_1f50f6: "阅读魔法书字面上的意思就是「读一本魔法书」。你知道怎么用魔法书吗？"
  npc_override_geffen_in_magic_books_refining_process_easy_i_61bad6: "精炼过程很简单，但我很难找到催化剂——龙牙。^000000"
  npc_override_geffen_in_magic_books_s_good_question_s_relate_c15cdd: "这是个好问题。这和魔法绑定有关。"
  npc_override_geffen_in_magic_books_s_like_water_needs_bowl_ae03c1: "就像水需要一个碗来盛放。"
  npc_override_geffen_in_magic_books_s_right_4b5ef4: "没错。"
  npc_override_geffen_in_magic_books_s_why_i_ve_been_de231a: "这就是为什么我一直在等待像你这样的真正魔法修炼者来帮我测试终极魔法书。"
  npc_override_geffen_in_magic_books_s_why_we_use_magic_f0fb6a: "这就是为什么我们用魔法书来减轻那种负担。它可以在你专注于绑定魔法力量时帮助召唤预施放的法术。"
  npc_override_geffen_in_magic_books_said_as_circler_you_cann_961e0b: "话虽如此，作为一个循环师，你不能改变或创造魔法书中的法术。"
  npc_override_geffen_in_magic_books_since_you_ve_learned_rel_99d5b7: "既然你已经学会了释放术，你也能使用魔法绑定了。好吧，这个我们以后再说。"
  npc_override_geffen_in_magic_books_someone_already_used_are_780260: "已经有人用过这个地方了。"
  npc_override_geffen_in_magic_books_superior_magic_book_loan_e3c2cb: "高级魔法书 ^4d4dff押金是 500,000 Zeny^000000。"
  npc_override_geffen_in_magic_books_surprising_he_never_took_042190: "真让人惊讶。他从来没有认真对待过我的研究。我很高兴他终于改变了主意。"
  npc_override_geffen_in_magic_books_test_object_7dd359: "测试对象？"
  npc_override_geffen_in_magic_books_thank_you_making_my_drea_191f22: "谢谢你让我的梦想成真。如果你还需要这种书，随时可以回来。"
  npc_override_geffen_in_magic_books_thank_you_your_deposit_b_e7c792: "感谢你的押金。书的归还日期写在书封背面的借阅卡上。请尽量不要丢失或损坏书籍，避免支付赔偿金。"
  npc_override_geffen_in_magic_books_there_anything_else_you_80fb41: "你还需要别的什么吗？"
  npc_override_geffen_in_magic_books_there_s_great_archive_el_2087ed: "在巨人国首都艾尔迪卡斯特斯有一个巨大的档案馆，那里储存着世界上所有的知识。"
  npc_override_geffen_in_magic_books_those_activities_may_dif_8ef0e7: "这些活动可能与魔法不同，但在运用四大元素方面两者是相同的。"
  npc_override_geffen_in_magic_books_wait_minute_d99a41: "等一下，"
  npc_override_geffen_in_magic_books_way_what_brings_you_me_b2732a: "话说回来，今天找我有什么事？"
  npc_override_geffen_in_magic_books_we_endure_great_hardship_9d85d2: "我们忍受巨大的艰辛和痛苦来实现我们的目标。当我们最终做到时，那种成就感无法用语言形容。这就是为什么你我都选择了魔法之路。"
  npc_override_geffen_in_magic_books_we_humans_use_torches_ke_fa409a: "我们人类用火把来保存火，用扇子来扇风，用碗来盛水。我们也用黏土制作陶器。"
  npc_override_geffen_in_magic_books_we_magic_practitioners_a_5b00ec: "我们魔法修炼者总是渴望新的知识和力量。"
  npc_override_geffen_in_magic_books_weak_spells_you_bind_two_ab31c0: "对于较弱的法术，你可以用你的魔法循环绑定两到三个。对于更强大的法术，可能一到两个就行了。"
  npc_override_geffen_in_magic_books_welcome_magic_archive_yo_0bab76: "欢迎来到魔法档案馆。你可以在特定条件下在这里阅读和借阅书籍。"
  npc_override_geffen_in_magic_books_welcome_my_friend_bbd420: "欢迎你，我的朋友。"
  npc_override_geffen_in_magic_books_well_then_you_don_t_06b326: "好吧，那你就不需要额外的讲解了。"
  npc_override_geffen_in_magic_books_well_why_don_t_you_f6909a: "嗯……在那之前，你为什么不再多练习一下呢？"
  npc_override_geffen_in_magic_books_what_13b8ee: "但是什么？"
  npc_override_geffen_in_magic_books_what_brings_you_me_59dba8: "今天找我有什么事？"
