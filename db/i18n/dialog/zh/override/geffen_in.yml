  npc_override_geffen_in_geffen_use_8b998e: "你需要强大的力量才能"
  npc_override_geffen_in_geffen_use_more_than_zeny_lea_bbd65c: "需要的不仅仅是 Zeny 来学习魔法，你知道吗。你需要知识、天赋、练习和耐心！"
