  npc_override_geffen_in_mage_mage_bring_frog_eggs_you_can_83d3b2: "从干燥的沼泽带来蛙卵。我已经从我姐妹克莱姆那里听说你的事情了。她很高兴地提到你。"
  npc_override_geffen_in_mage_mage_bring_gift_of_nature_yo_2fc5c9: "从克莱姆带来大自然的礼物。她正在吉芬塔地下室研究灵魂。"
  npc_override_geffen_in_mage_mage_bring_incantation_sam_s_e02be8: "从萨姆·斯泰尔那里带来咒语。他正在吉芬塔地下室研究灵魂。"
