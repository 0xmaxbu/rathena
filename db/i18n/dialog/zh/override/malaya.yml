Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_malaya_guides_malaya_check_your_mini_map_91e6e6: "查看你的小地图。"
  npc_override_malaya_guides_malaya_i_hope_you_enjoy_your_24c6f6: "祝你旅途愉快。"
  npc_override_malaya_guides_malaya_i_ll_remove_all_marks_02e4d3: "我会移除你小地图上的所有标记。"
  npc_override_malaya_guides_malaya_marked_your_mini_map_eabbe5: "已标记在你的小地图上。"
  npc_override_malaya_guides_malaya_menu_kafra_e29ae5: "[卡普拉员工]：[旅馆与酒馆]：[武器与防具店]：[道具店]：[医院]：[公园]：[港口]：移除小地图标记：取消"
  npc_override_malaya_guides_malaya_the_376b0c: "{0} {1}"
  npc_override_malaya_guides_malaya_there_anything_else_i_yo_8fdf01: "还有什么我可以帮你的吗？"
  npc_override_malaya_guides_malaya_welcome_port_malaya_brea_4aa7aa: "欢迎来到 ^8B4513马莱亚港^000000，呼吸之村。"
  npc_override_malaya_guides_malaya_where_cultures_legends_c_103656: "文化与传说在此交汇！"
  npc_override_malaya_guides_malaya_you_need_help_navigating_10d126: "你需要在村里导航的帮助吗？"
  npc_override_malaya_kafras_dewata_island_f18d49: "在迪瓦塔岛"
  npc_override_malaya_kafras_glast_heim_1b32f5: "在克雷斯特汉姆"
  npc_override_malaya_kafras_i_only_offer_storage_ed3dd0: "我只提供仓库服务！"
  npc_override_malaya_kafras_kafra_corporation_20c94e: "卡普拉公司。"
  npc_override_malaya_kafras_kafra_employee_df8212: "[卡普拉员工]"
  npc_override_malaya_kafras_lutie_ab6d6c: "在卢铁"
  npc_override_malaya_kafras_port_malaya_d411a3: "在马莱亚港"
  npc_override_malaya_kafras_welcome_c8f06d: "欢迎来到"
  npc_override_malaya_malaya_adventurers_these_days_a_327919: "如今的冒险者们总是装作很忙的样子。等你有空的时候，我们可以一起去马莱亚港看看。"
  npc_override_malaya_malaya_around_here_let_me_tell_1bf048: "不是本地人？让我告诉你为什么连你这样的外地人也该小心。"
  npc_override_malaya_malaya_as_time_goes_their_venge_82f507: "但随着时间的流逝和怨恨的增长，它们会坐在你身上直到你窒息。"
  npc_override_malaya_malaya_back_outside_9f30a3: "回到外面"
  npc_override_malaya_malaya_bakonawa_also_known_as_m_ef5c6a: "巴科纳瓦在马莱亚港也被称为“吞月之兽”。"
  npc_override_malaya_malaya_because_strange_things_h_b4b135: "因为如果用班贡果曾居住过的树木作为建筑柱梁，会发生奇怪的事情。"
  npc_override_malaya_malaya_beware_mongkukurums_need_4f88cd: "当心蒙库库鲁姆的针，外地人。"
  npc_override_malaya_malaya_boy_fairies_prettier_why_ad52ab: "但男性精灵更漂亮。为什么呢？"
  npc_override_malaya_malaya_buwaya_don_t_come_villag_443eb6: "布瓦亚不常来村里，但也有过它们在夜间用背上的箱子抓人的情况。"
  npc_override_malaya_malaya_careful_night_1e4657: "夜间小心！"
  npc_override_malaya_malaya_careful_walking_around_v_c13a25: "夜间在村里走动要小心。{0} 被沃克沃克干掉了。"
  npc_override_malaya_malaya_carry_drum_around_you_yo_ce34c5: "随身带个鼓。你会发现它很管用。"
  npc_override_malaya_malaya_come_rest_lodging_zeny_05dfc6: "来休息吗？住宿费 5,000 Zeny。"
  npc_override_malaya_malaya_door_closed_seems_keepin_24bb37: "门关着。似乎在注视着你。"
  npc_override_malaya_malaya_encan_encan_fairies_live_6ec7a6: "恩坎托！恩坎托精灵住在森林里的大树或岩石中。有男性精灵和女性精灵……"
  npc_override_malaya_malaya_father_said_i_won_t_254f68: "父亲说，一旦我和森林里的精灵交上朋友，就不会得皮肤病。"
  npc_override_malaya_malaya_foreigners_welcomed_much_9f1b1c: "在我们村里像最近这样混乱的时候，外地人不太受欢迎。"
  npc_override_malaya_malaya_great_91bb26: "太好了！"
  npc_override_malaya_malaya_great_let_s_leave_now_5a28a3: "太好了！我们现在就出发去艾尔贝塔吧！！"
  npc_override_malaya_malaya_ha_ha_ha_there_no_e3d100: "哈哈哈。普通柱子里没有班贡果，所以不用担心。"
  npc_override_malaya_malaya_ha_ha_ha_there_way_dd951f: "哈哈哈。有办法阻止巴科纳瓦吞噬人。"
  npc_override_malaya_malaya_happiness_never_lasts_fo_c17336: "但幸福永远不会长久，对吧？婴儿因意外流产了……"
  npc_override_malaya_malaya_hat_my_mom_washed_yester_21e326: "我妈妈昨天洗的帽子不见了。邻居家的帽子前几天也不见了。"
  npc_override_malaya_malaya_he_he_father_said_i_796cd2: "嘿嘿。父亲说等村里平静下来，我就可以去森林里看精灵了。"
  npc_override_malaya_malaya_he_he_i_like_funny_8441bb: "嘿嘿……我确实喜欢有趣的故事，但对我来说有点难度。"
  npc_override_malaya_malaya_he_he_i_never_thought_010399: "嘿嘿。但我从没想过要走出马莱亚港。"
  npc_override_malaya_malaya_he_he_isn_t_fun_2ce0b8: "嘿嘿。不有趣吗？"
  npc_override_malaya_malaya_he_he_isn_t_fun_8cb254: "嘿嘿。不有趣吗？{0} 看起来是个有趣的人。"
  npc_override_malaya_malaya_he_sensitive_noise_so_wh_f5d22f: "它对噪音敏感，所以当它要吞月亮的时候！！"
  npc_override_malaya_malaya_heading_port_malaya_50831e: "前往马莱亚港！！"
  npc_override_malaya_malaya_hear_either_tik_tik_wak_96ed22: "如果听到嘀嗒声或哇哇声，要小心，那是梅奥内农克尔翅膀拍打的声音。"
  npc_override_malaya_malaya_heard_there_follows_meon_e31a15: "听说有 {0} 跟着梅奥内农克尔。"
  npc_override_malaya_malaya_hey_there_30dcdc: "嘿，你好！"
  npc_override_malaya_malaya_hmm_time_careful_witches_06a84d: "嗯……是时候小心女巫的诅咒了吗？"
  npc_override_malaya_malaya_hmm_you_think_jejeling_t_0467f6: "嗯……你觉得是杰杰林拿走的吗？"
  npc_override_malaya_malaya_hope_you_enjoy_your_stay_2b2631: "希望你玩得开心。"
  npc_override_malaya_malaya_huh_says_here_monster_na_81777f: "嗯？！这里写着一种叫沃克沃克的怪物特别喜欢在夜间造访村子，应该避开。"
  npc_override_malaya_malaya_huh_you_re_captain_you_1da8f9: "嗯？你不是船长？你吓到我了。糟了！啊，对了！我收到了一份旅行者的官方文件。"
  npc_override_malaya_malaya_huk_then_isn_t_dangerous_a1c860: "哈！那不是危险了吗？"
  npc_override_malaya_malaya_i_cheer_their_forbidden_28e1f1: "我会为他们的禁忌之爱加油。"
  npc_override_malaya_malaya_i_close_coming_back_cozy_ebe5f4: "我差点就回不了舒适的艾尔贝塔了。"
  npc_override_malaya_malaya_i_couldn_t_visit_village_c02ab6: "我因为村里有些问题没能去拜访，但现在看来一切都解决了！"
  npc_override_malaya_malaya_i_don_t_anything_share_840fb5: "我没什么可跟你分享的。"
  npc_override_malaya_malaya_i_don_t_know_sure_510593: "我不太确定，但那是一个像舒适惬意的公园一样的村庄。"
  npc_override_malaya_malaya_i_heard_someone_took_jej_affed4: "我听说有人在马希瓦加镇拿走了杰杰林的帽子。"
  npc_override_malaya_malaya_i_heard_there_outsider_h_b29085: "我听说有个外地人在帮助这个村子。"
  npc_override_malaya_malaya_i_know_bakonawa_could_al_f1aa06: "但我知道巴科纳瓦也能“吞噬人”。"
  npc_override_malaya_malaya_i_like_fun_stories_oh_481feb: "我喜欢有趣的故事。哦对了！{0}，爱情很上镜。你不觉得吗？"
  npc_override_malaya_malaya_i_like_fun_stories_so_623ac7: "我喜欢有趣的故事。不久前，{0} 来给我讲了个有趣的故事。"
  npc_override_malaya_malaya_i_m_afraid_jeepney_full_2d1463: "恐怕吉普尼车满了。"
  npc_override_malaya_malaya_i_m_scared_i_visit_43f7d0: "我很害怕，但我必须去见森林里的精灵。"
  npc_override_malaya_malaya_i_m_sorry_how_about_19f5b4: "抱歉，但换辆吉普尼怎么样？"
  npc_override_malaya_malaya_i_m_sure_you_ll_eb1bf6: "我相信一旦你到了马莱亚港，你也会有同样的感觉。"
  npc_override_malaya_malaya_i_m_worried_about_my_0a295a: "我很担心我怀孕的儿媳。希望梅奥内农克尔不会打扰她。"
  npc_override_malaya_malaya_i_m_worried_because_my_d23364: "我很担心，因为我儿媳怀孕了。希望一切顺利。"
  npc_override_malaya_malaya_i_planted_pair_pear_tree_d4a7dc: "'我在院子里种了一对梨树。'"
  npc_override_malaya_malaya_i_think_nameless_adventu_9808f3: "我想是一个无名冒险者帮助村民们解除了忧虑。耶！你想回艾尔贝塔吗？"
  npc_override_malaya_malaya_i_think_someone_stealing_07fb77: "我觉得有人在偷村里的帽子。"
  npc_override_malaya_malaya_i_think_village_saved_na_7e0417: "我觉得村子被一个无名冒险者救了。"
  npc_override_malaya_malaya_i_think_village_still_bu_6eaa9c: "我觉得村子还很忙。你逛完了？总是有船去艾尔贝塔的。"
  npc_override_malaya_malaya_i_visited_friend_baryo_m_2b3287: "我去马希瓦加镇拜访了一个朋友，他说他看到杰杰林戴着那顶丢失的帽子……"
  npc_override_malaya_malaya_if_fluttering_sound_smal_24eec9: "但如果拍打声很小或者你什么都没听到，那就只能说你得做好被攻击的准备并祈求好运了。"
  npc_override_malaya_malaya_if_you_ever_walk_around_d2be46: "如果你曾在马莱亚港夜间行走……"
  npc_override_malaya_malaya_if_you_hear_baby_crying_65b36a: "如果你听到村外森林里有婴儿的哭声，永远不要靠近。"
  npc_override_malaya_malaya_if_you_plan_go_out_5f90d1: "如果你打算出村，要小心提乌克努克。据说 {0} 被提乌克努克骗了，不得不去医院。"
  npc_override_malaya_malaya_im_worried_about_childre_f74b51: "我很担心孩子们。希望他们没有因为村里发生的事而害怕。"
  npc_override_malaya_malaya_kafra_employee_i_m_frien_6a4f87: "我认识的一个卡普拉员工给我讲了一个关于客户的故事。"
  npc_override_malaya_malaya_kafra_wise_never_marry_w_7a3886: "'卡普拉，智者永不结婚，一旦结婚就会变得不同。'"
  npc_override_malaya_malaya_little_while_ago_came_to_f636ae: "不久前 {0} 来给我讲了个有趣的故事。"
  npc_override_malaya_malaya_menu_about_da2564: "关于马莱亚港。：前往马莱亚港。：取消。"
  npc_override_malaya_malaya_menu_board_92a130: "上车 [乘客 {0}/{1}]：吉普尼？：还有其他吉普尼吗？：啊……好的……"
  npc_override_malaya_malaya_menu_i_6c1fce: "我明白了。：有什么办法阻止它们来吗？"
  npc_override_malaya_malaya_menu_i_761075: "我想知道 12 座车在哪里。：我想知道 30 座车在哪里。：我想知道 60 座车在哪里。"
  npc_override_malaya_malaya_menu_return_9c4e26: "返回。：不返回。"
  npc_override_malaya_malaya_menu_store_08dc2d: "仓库。：住宿 - 5,000z：取消。"
  npc_override_malaya_malaya_meoneonuncle_97c4cc: "梅奥内农克尔？"
  npc_override_malaya_malaya_meoneonuncle_then_starte_0761cf: "梅奥内农克尔随后开始以幽灵的形式出现，夺走村里孕妇的婴儿。"
  npc_override_malaya_malaya_meoneonuncle_woman_who_l_764081: "梅奥内农克尔是久居马莱亚港的一位女子。她嫁给了一个体面的男人，还生了一个孩子。"
  npc_override_malaya_malaya_mongkukurum_400674: "蒙库库鲁姆？"
  npc_override_malaya_malaya_mongkukurum_makes_doll_o_f1ee83: "蒙库库鲁姆用看到的人制作人偶，并用针诅咒它。"
  npc_override_malaya_malaya_monster_also_called_witc_3ef751: "一种也被称为女巫的怪物。看起来像人，也穿衣服。"
  npc_override_malaya_malaya_my_aunt_stepped_ant_15df14: "'我姑姑踩到了一只蚂蚁。'"
  npc_override_malaya_malaya_my_mom_told_me_i_a44d87: "我妈妈告诉我我可以在马莱亚港玩。"
  npc_override_malaya_malaya_my_mom_told_me_play_22838a: "我妈妈告诉我不要在外面玩，因为很危险。为什么？"
  npc_override_malaya_malaya_needs_darkness_develop_4d520e: "它需要黑暗来发展。"
  npc_override_malaya_malaya_never_ever_stare_into_th_3a6b88: "永远不要直视它们的眼睛太久。"
  npc_override_malaya_malaya_nice_day_ed51dd: "祝你有美好的一天。"
  npc_override_malaya_malaya_nice_trip_4d4053: "旅途愉快。"
  npc_override_malaya_malaya_oh_god_df182b: "天哪！！"
  npc_override_malaya_malaya_oh_gosh_65e94f: "哦，天哪……"
  npc_override_malaya_malaya_oh_my_visiting_cb9247: "哦天哪！来参观的？"
  npc_override_malaya_malaya_oh_other_jeepneys_operat_d93387: "哦！当然有其他吉普尼在运营。"
  npc_override_malaya_malaya_oh_wait_suppose_secret_s_7b93d9: "哦等等！这本该是秘密的。嘘！请假装没听见。"
  npc_override_malaya_malaya_phew_i_thought_bakonawa_e810bf: "呼……我还以为巴科纳瓦又出现了。"
  npc_override_malaya_malaya_port_malaya_s_best_inn_d5dd03: "这是马莱亚港最好的旅馆，“城中小屋”。"
  npc_override_malaya_malaya_port_malaya_small_villag_271561: "马莱亚港是艾尔贝塔西南方的一个小村庄。"
  npc_override_malaya_malaya_port_malaya_there_passen_dda5b8: "马莱亚港有 12 座、30 座和 60 座的吉普尼，各有 3 辆在运营。"
  npc_override_malaya_malaya_s_okay_come_here_if_e4a9ba: "没关系。如果你想回艾尔贝塔，随时来这里。"
  npc_override_malaya_malaya_s_your_chance_doesn_t_7f704a: "这是你的机会！！什么噪音都行！！不管是锅、钹、鼓、罐子还是煎锅，只要继续制造噪音就行。"
  npc_override_malaya_malaya_s_zeny_go_port_malaya_5ce139: "去马莱亚港需要 10,000 Zeny。有兴趣吗？"
  npc_override_malaya_malaya_sad_story_d8809c: "真是个悲伤的故事。"
  npc_override_malaya_malaya_says_travelers_should_ca_89774b: "上面说旅行者夜间在村里行走时应注意怪物。"
  npc_override_malaya_malaya_she_eventually_passed_aw_3295ec: "她最终在失去孩子后悲痛了数日，过世了。"
  npc_override_malaya_malaya_so_you_adventurer_villag_e56da1: "所以你就是村民们说的那个冒险者？多亏了你，我重新开了旅馆。谢谢。"
  npc_override_malaya_malaya_sorry_i_think_you_bit_10fbd5: "抱歉。我觉得你有点不够。"
  npc_override_malaya_malaya_sounds_like_sneaky_monst_31dd6e: "听起来像是个狡猾的怪物。"
  npc_override_malaya_malaya_successfully_stored_see_467487: "寄存成功。下次见。"
  npc_override_malaya_malaya_then_bakonawa_get_surpri_0fca1d: "然后巴科纳瓦会受惊，吐出月亮然后逃跑！"
  npc_override_malaya_malaya_then_my_daughter_law_saf_17287c: "那样我的儿媳就安全了。"
  npc_override_malaya_malaya_there_monster_named_tiuc_5810b2: "有一种叫提乌克努克的怪物在村外游荡，变成婴儿后哭泣。"
  npc_override_malaya_malaya_there_one_way_all_mongku_f8c81f: "有一个办法。所有蒙库库鲁姆都有红色的眼睛。"
  npc_override_malaya_malaya_there_rumor_monster_came_970edf: "有传言说这个怪物来自一个从未出生过的婴儿的灵魂。太可怜了。"
  npc_override_malaya_malaya_there_way_recognize_mons_b7610e: "有办法识别这个怪物吗？"
  npc_override_malaya_malaya_they_say_you_attack_buwa_820969: "据说如果你被抓进布瓦亚背的箱子里，可以攻击里面的弱点。"
  npc_override_malaya_malaya_tool_store_ill_buy_needl_f33bd0: "在道具店，“我买针线！你买干草来弄丢针。'"
  npc_override_malaya_malaya_tsk_tsk_must_person_isn_b66a2a: "啧啧……一定是个不值得杰勒比结晶的人。"
  npc_override_malaya_malaya_ugh_s_just_like_time_923369: "呃……就像之前那时候一样……"
  npc_override_malaya_malaya_unidentified_creature_ge_100cb2: "不明生物瞥了你一眼然后消失了。"
  npc_override_malaya_malaya_unidentified_creature_ge_550239: "不明生物瞥了你一眼，脸红了，然后消失了。"
  npc_override_malaya_malaya_unidentified_creature_lo_33294c: "不明生物看了你一眼然后跑掉了。"
  npc_override_malaya_malaya_village_chaotic_these_da_8ac4d4: "这些天村里很混乱。如果你看到红眼睛的人，尽量不要直视他们的眼睛。"
  npc_override_malaya_malaya_village_chaotic_these_da_dc1c62: "这些天村里很混乱。看起来蒙库库鲁姆又回村里了。"
  npc_override_malaya_malaya_village_chaotic_these_da_ef0acf: "这些天村里很混乱。我这样溜出来真的好吗？"
  npc_override_malaya_malaya_village_somewhat_stable_561c31: "村子现在还算稳定，但夜间走动还是要小心。"
  npc_override_malaya_malaya_welcome_724486: "欢迎。"
  npc_override_malaya_malaya_welcome_port_malaya_fore_906bba: "欢迎来到马莱亚港，外地人。"
