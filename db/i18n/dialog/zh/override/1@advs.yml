Body:
  npc_override_1@advs_VillaofDeception_after_you_loose_some_wei_468fb8: "- 等你减完肥再说。 -"
  npc_override_1@advs_VillaofDeception_ah_my_half_soul_beyond_b8ad75: "啊……我在这走廊之外的另一半灵魂仍未得到解脱……"
  npc_override_1@advs_VillaofDeception_all_aftereffects_access_52216c: "^0000ff 所有进入的后遗症都已消除。^000000"
  npc_override_1@advs_VillaofDeception_cancel_77dfd2: "取消"
  npc_override_1@advs_VillaofDeception_currently_you_re_carryin_73594b: "- 你当前携带了 -"
  npc_override_1@advs_VillaofDeception_ddispel_circle_requires_c65c2d: "驱散法阵^ff0000需要消耗你的生命值和魔力值。^000000 在过程中，你^ff0000将无法移动且毫无防御。^000000 你确定要开始驱散吗？"
  npc_override_1@advs_VillaofDeception_dungeon_been_created_you_121c44: "^0000ff地下城尚未创建，或者你正在尝试进入与队伍领袖不同的地下城。^000000"
  npc_override_1@advs_VillaofDeception_entry_19172e: "进入"
  npc_override_1@advs_VillaofDeception_found_something_bright_g_2fdc1d: "^0000ff在明亮的发光光环中发现了什么。^000000"
  npc_override_1@advs_VillaofDeception_i_m_bit_trouble_if_156646: "如果我再靠近就麻烦了！！！"
  npc_override_1@advs_VillaofDeception_i_think_you_get_out_350592: "^0000ff我想你现在可以出去了。^000000"
  npc_override_1@advs_VillaofDeception_i_together_let_s_play_5871be: "我……和……一起……来玩吧……"
  npc_override_1@advs_VillaofDeception_magic_stone_absorbed_you_d781f5: "^0000ff吸收了你的体力和魔力的魔法石产生了共鸣。一直游荡的魔法法阵消失了。^000000"
  npc_override_1@advs_VillaofDeception_menu_leader_4d6811: "领袖:{0}"
  npc_override_1@advs_VillaofDeception_menu_number_af465f: "剩余怪物数量:{0}"
  npc_override_1@advs_VillaofDeception_menu_options_9ad9ef: "？？？:你真的不擅长烹饪，活该在我的花园里随意逛逛。"
  npc_override_1@advs_VillaofDeception_menu_party_328f2e: "队伍:{0}"
  npc_override_1@advs_VillaofDeception_menu_tip_39fdfd: "提示:扭曲之神芙蕾雅越靠近吊灯就越虚弱。"
  npc_override_1@advs_VillaofDeception_only_member_party_enter_9eb530: "^ff0000只有队伍成员才能进入纪念地下城。^000000"
  npc_override_1@advs_VillaofDeception_party_entering_3748ac: "{1}队伍的{0}正在进入{2}。"
  npc_override_1@advs_VillaofDeception_please_try_again_cefdd7: "- 请再试一次 -"
  npc_override_1@advs_VillaofDeception_please_wait_end_quest_de_5bb479: "请等待任务延迟结束。"
  npc_override_1@advs_VillaofDeception_s_all_human_0f871e: "这就是人类的全部。"
  npc_override_1@advs_VillaofDeception_seems_something_been_rev_895745: "但似乎宅邸里有什么东西被复活了。我想我需要再次寻求帮助。"
  npc_override_1@advs_VillaofDeception_stop_9e2534: "停止"
  npc_override_1@advs_VillaofDeception_thanks_mr_i_arrived_safe_c25ca7: "{0}多亏了先生，我安全到达了村庄。"
  npc_override_1@advs_VillaofDeception_too_many_items_you_fc968e: "- 你携带的物品太多了。 -"
  npc_override_1@advs_VillaofDeception_two_souls_simultaneously_09fda5: "两个灵魂同时被解放，打开了通往中央的门。"
  npc_override_1@advs_VillaofDeception_unknown_error_0aeb9e: "^0000ff{0} ^000000- 未知错误"
  npc_override_1@advs_VillaofDeception_unknown_error_occurred_285cc7: "^ff0000发生了未知错误。^000000"
  npc_override_1@advs_VillaofDeception_wait_minute_17efa5: "- 等一下！！ -"
  npc_override_1@advs_VillaofDeception_where_dd1f21: "{0}在哪里？"
  npc_override_1@advs_VillaofDeception_you_here_set_me_free_09ace6: "你是来解放我的吗？"
  npc_override_1@advs_VillaofDeception_you_must_free_both_souls_737459: "你必须同时解放走廊左右两侧的两个灵魂。"
  npc_override_1@advs_VillaofDeception_you_must_least_baselevel_660e42: "你必须至少达到 Base 等级 170 才能创建副本。"
  npc_override_1@advs_VillaofDeception_you_must_least_baselevel_69927b: "你必须至少达到 Base 等级 200 才能进入。"
