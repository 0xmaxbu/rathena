Body:
  npc_override_izlude_in_izlude_after_all_right_cecc6f: "对吧？"
  npc_override_izlude_in_izlude_ah_971301: "啊……"
  npc_override_izlude_in_izlude_ah_there_s_much_us_81393e: "啊~~ 这段时间我们没什么事做。你看，商人会收购怪物掉落的物品。不过这个你知道的吧？ "
  npc_override_izlude_in_izlude_alright_magnum_break_bes_0a8f03: "好极了！！^EE0000怒爆^000000才是最棒的！！这才像话~！！你懂行~ 哈哈哈！"
  npc_override_izlude_in_izlude_alright_magnum_break_bes_1c42a9: "好极了！！^EE0000怒爆^000000才是最棒的！！这才像话~！！你懂行啊，小子。哈哈哈~！"
  npc_override_izlude_in_izlude_angelings_immune_magic_a_a52c0f: "天使波利对魔法攻击免疫。如果只会用魔法攻击的人遇上天使波利，那就该"
  npc_override_izlude_in_izlude_another_important_thing_066b74: "另一件重要的事就是你能多准确地命中对手。这里 DEX 是关键。如果提升 DEX，伤害的最小值和最大值之间的差距也会缩小。"
  npc_override_izlude_in_izlude_any_case_magnum_break_sk_a6fbdc: "无论如何，怒爆才是剑士的真正技能~！！像狂击这种简单的技能只不过是通往怒爆的一小步而已。"
  npc_override_izlude_in_izlude_arena_here_place_capable_210d09: "这里的竞技场是全卢恩·米德加兹王国各地有能力的年轻人挑战自我、检验实力的圣地。"
  npc_override_izlude_in_izlude_aside_dangers_mountain_i_8c654f: "除了山本身的危险之外，那里还栖息着极其凶残的虫子。我是说，它们会毫无缘由地攻击你。"
  npc_override_izlude_in_izlude_attention_attention_db34cc: "注意，注意！"
  npc_override_izlude_in_izlude_careful_before_you_reali_e865f3: "但要小心，不知不觉间你可能会面对面遇上幽灵波利——一种像幽灵一样漂浮在空中的致命波利。"
  npc_override_izlude_in_izlude_case_i_ll_explain_about_e24644: "那我就简单给你讲讲其他属性。想要快速攻击和闪避，就得重视 AGI。 "
  npc_override_izlude_in_izlude_case_you_want_make_more_165367: "如果你想打出更多暴击，投资 LUK 是个好主意。INT 也会增加最大 SP，而释放各种技能都需要 SP……不过最终还是看你自己。"
  npc_override_izlude_in_izlude_come_ride_wind_2f7a54: "来乘风破浪"
  npc_override_izlude_in_izlude_course_d_good_high_attac_fc1f23: "不过当然啦，高攻击力也不错吧？你可以弄一把好武器，或者提升 STR 来增加你的攻击力。"
  npc_override_izlude_in_izlude_don_t_leave_just_yet_831b17: "但先别走啊~！对这些职业的人来说有个好消息。打造一把带某种属性武器是关键。"
  npc_override_izlude_in_izlude_don_t_you_think_binocula_6fe6b1: "你不觉得望远镜"
  npc_override_izlude_in_izlude_don_t_you_think_strong_b73269: "你不觉得强健的 VIT 和训练独特的呼吸法从而实现快速 HP 恢复，是剑士最大的优势吗？"
  npc_override_izlude_in_izlude_fascinating_ship_f64adb: "乘坐迷人的船只吧！"
  npc_override_izlude_in_izlude_ghostring_grayish_poring_49845e: "幽灵波利是一种灰色的波利，像幽灵一样漂浮在空中。就像其他幽灵一样，物理攻击对它完全无效。"
  npc_override_izlude_in_izlude_golem_desert_one_them_do_5ec61c: "沙漠中的哥布林就是其中之一。别因为它行动迟缓就小看它……"
  npc_override_izlude_in_izlude_good_luck_ddf2f3: "祝你好运~"
  npc_override_izlude_in_izlude_greetings_36b940: "欢迎！"
  npc_override_izlude_in_izlude_haha_fact_actually_part_3e1126: "哈哈~ 事实上，那本来也是我们工作的一部分。但越来越多猎人跑来找我们要报酬，实在忙不过来了。"
  npc_override_izlude_in_izlude_haha_fact_used_part_our_7b91f9: "哈哈，其实呢，那本来是我们工作的一部分。但越来越多猎人跑来要报酬，实在忙不过来了。"
  npc_override_izlude_in_izlude_hahahaha_500406: "哈哈哈哈！！"
  npc_override_izlude_in_izlude_hahahaha_i_knew_you_d_5400a6: "哈哈哈哈！！！我就知道你会同意我！！你真是个好人！！毫无疑问，只有^FF2400狂击^000000才配得上剑士。请告诉那边的笨蛋~ 哈哈哈！"
  npc_override_izlude_in_izlude_hahahaha_i_knew_you_d_773b8e: "哈哈哈哈！！！我就知道你会同意我！！你真是个好人！！毫无疑问，只有^FF2400狂击^000000才配得上剑士。请告诉那边的搞笑男！！哈哈哈。"
  npc_override_izlude_in_izlude_hahahaha_see_someone_who_f0cfb3: "哈哈哈哈！！看到没！？选了不同职业的人也同意我~！你真是个好人！哈哈哈！！毫无疑问，只有^FF2400狂击^000000才配得上剑士。请告诉那边的白痴~ 哈哈哈！"
  npc_override_izlude_in_izlude_head_back_382b63: "回去吗？"
  npc_override_izlude_in_izlude_heard_everything_3717d5: "都听到了。"
  npc_override_izlude_in_izlude_hehehehe_hahahaha_b94837: "嘿嘿嘿嘿..哈哈哈哈 "
  npc_override_izlude_in_izlude_here_izlude_6cbcf7: "依斯鲁得的时光。"
  npc_override_izlude_in_izlude_here_izlude_we_responsib_ae64a3: "在依斯鲁得，我们不仅要维护陆地的和平，还要维护海上的和平。所以这座城市有一架巨大的望远镜。"
  npc_override_izlude_in_izlude_hey_everybody_1bfaa6: "大家注意啦！"
  npc_override_izlude_in_izlude_hey_i_know_you_54656a: "嘿，我知道你"
  npc_override_izlude_in_izlude_hey_i_know_you_just_888064: "嘿，我知道你"
  npc_override_izlude_in_izlude_hm_5ea458: "嗯……"
  npc_override_izlude_in_izlude_hmm_9c4d28: "嗯……"
  npc_override_izlude_in_izlude_hmm_let_me_give_you_68a4fd: "嗯，给你一点建议。狂击达到5级后，技能消耗的 SP 会大幅增加，所以要注意你的 SP。"
  npc_override_izlude_in_izlude_hmm_let_me_give_you_928d47: "嗯，给你一点建议。狂击达到5级后，技能消耗的 SP 会大幅增加，所以要注意你的 SP。"
  npc_override_izlude_in_izlude_hmpf_as_i_recall_you_6d19ad: "哼。我记得你也在跑，显然太忙了没空用你那宝贝狂击。无论如何，怒爆才是剑士的真正技能~!!"
  npc_override_izlude_in_izlude_huh_why_am_i_so_bc2fe3: "咦？我怎么这么开心？"
  npc_override_izlude_in_izlude_hurry_hurry_5ddfad: "快来，快来！"
  npc_override_izlude_in_izlude_i_hear_cuisine_there_rea_17ba32: "听说那里的美食非常棒！虽然吃生鱼片对我来说很新鲜，但我很想去那里尝一次！"
  npc_override_izlude_in_izlude_i_know_bridge_might_look_49de8a: "我知道，这座桥看起来可能又脆弱又单薄，但它其实是用最先进的技术建造的尖端之作。"
  npc_override_izlude_in_izlude_i_m_right_aren_t_8be7c4: "我对吧？！^EE0000怒爆^000000才是最棒的！！！你懂行嘛？真不知道那肥脸为什么那么固执。"
  npc_override_izlude_in_izlude_i_mean_we_still_busy_254f81: "我的意思是，我们还是挺忙的，但跟以前比根本不算什么。吃过苦的人，才知道珍惜哪怕一点点安逸。"
  npc_override_izlude_in_izlude_i_thinking_even_though_p_c7dfef: "我在想，虽然依斯鲁得的人住得离海这么近……"
  npc_override_izlude_in_izlude_if_you_ever_want_visit_69fc9f: "如果你想去咪智山另一边的地方，那就做好挑战的准备吧。或者你也可以绕路走。"
  npc_override_izlude_in_izlude_if_you_lucky_enough_you_b7b44e: "如果你足够幸运，甚至可能撞上天使波利——长着天使翅膀的波利。"
  npc_override_izlude_in_izlude_if_you_train_your_skills_dee72b: "如果你刻苦训练，甚至能看到自己的 HP 在恢复。恢复量"
  npc_override_izlude_in_izlude_if_you_try_cast_magic_5b914a: "如果你在它附近施放魔法，它就会注意到并走过来砸碎你。所以你最好小心哥布林。"
  npc_override_izlude_in_izlude_if_you_ve_got_extra_b5c935: "如果你有多余的短剑或剑，可以试试看。但一个人会非常困难，你说呢？"
  npc_override_izlude_in_izlude_izlude_beautiful_town_ri_586881: "但依斯鲁得是一座紧邻大海的美丽城市，还有美丽的依斯拉岛。"
  npc_override_izlude_in_izlude_izlude_key_our_kingdom_b_95789f: "依斯鲁得对我国至关重要，因为剑士公会就设在这里，而且依斯鲁得还负责守护卢恩·米德加兹的海岸线。"
  npc_override_izlude_in_izlude_izlude_satellite_city_pr_3d86e0: "依斯鲁得是卢恩·米德加兹王国首都普隆德拉的卫星城。"
  npc_override_izlude_in_izlude_izlude_welcomes_you_812ad8: "依斯鲁得欢迎您。"
  npc_override_izlude_in_izlude_job_right_5d6e4c: "胜任的技能~!!"
  npc_override_izlude_in_izlude_just_one_little_steps_to_cf75ff: "只不过是通往怒爆的一小步而已。"
  npc_override_izlude_in_izlude_magnum_break_0cc51d: "^EE0000怒爆！^000000"
  npc_override_izlude_in_izlude_menu_bash_be3e68: "狂击:怒爆"
  npc_override_izlude_in_izlude_menu_byalan_bd2b3b: "依斯鲁得岛 -> 150 Zeny:艾尔贝塔港口 -> 500 Zeny:取消。"
  npc_override_izlude_in_izlude_menu_ghostring_8e5fbb: "幽灵波利？:天使波利？:结束对话。"
  npc_override_izlude_in_izlude_menu_of_e60f78: "当然知道:啊？真的吗？"
  npc_override_izlude_in_izlude_menu_sure_7ce780: "当然啦:不想，我不在乎。"
  npc_override_izlude_in_izlude_menu_tell_ceb1db: "请继续讲:结束对话。"
  npc_override_izlude_in_izlude_menu_yeah_8ba3c7: "是啊，累死了:不，我超喜欢这里！"
  npc_override_izlude_in_izlude_most_importantly_look_ar_608485: "最重要的是，用之前先看看周围。否则你会惹上大麻烦~ "
  npc_override_izlude_in_izlude_mt_mjornir_located_north_776ebf: "普隆德拉北方的咪智山，是一座"
  npc_override_izlude_in_izlude_no_matter_how_strong_sto_75288a: "无论风暴多么猛烈，无论有多少人站在上面，这座桥都绝对不会倒塌。"
  npc_override_izlude_in_izlude_office_gives_away_regist_3b35c9: "登记处会给任何符合条件的商人发放登记证。所以现在，猎人们都把东西卖给有登记的商人。"
  npc_override_izlude_in_izlude_office_prize_compensatio_024b58: "战利品补偿处只给有登记的人付款。当然，你得是个商人而且整天待在同一个地方。"
  npc_override_izlude_in_izlude_oh_man_6f575c: "天哪~"
  npc_override_izlude_in_izlude_oh_shut_up_those_poporin_bb452e: "闭嘴。那是波波利。我记得你也在跑，显然太忙了没空用你那宝贝狂击。"
  npc_override_izlude_in_izlude_okay_good_bye_db6fd1: "好吧再见~~"
  npc_override_izlude_in_izlude_okay_then_7dd751: "那么，"
  npc_override_izlude_in_izlude_only_skill_s_needed_swor_8bd6c1: "剑士只需要一个技能：^FF2400狂击^000000！狂击、狂击，只需要^FF2400狂击^000000！没必要浪费时间精力学那些小技能！其他都是给懦夫和胆小鬼的！"
  npc_override_izlude_in_izlude_only_skill_s_needed_swor_b0844b: "剑士只需要一个技能：^FF2400狂击^000000！狂击、狂击，只需要^FF2400狂击^000000！没必要浪费时间精力学那些小技能~~ 其他都是给懦夫和胆小鬼的！"
  npc_override_izlude_in_izlude_only_zeny_ride_913669: "只要 500 Zeny 就能乘船！"
  npc_override_izlude_in_izlude_only_zeny_ride_c667b4: "只要 150 Zeny 就能乘船！"
  npc_override_izlude_in_izlude_ounce_91b321: "预防"
  npc_override_izlude_in_izlude_people_who_ve_actually_b_db6f4b: "去过那里的人说，如果你走得足够深，地下城实际上会延伸到水下。"
  npc_override_izlude_in_izlude_people_who_ve_seen_under_23c6a6: "见过水下景色的人说那里美得令人窒息，从那以后一直魂牵梦萦。"
  npc_override_izlude_in_izlude_perfect_4fcbaf: "才是完美的"
  npc_override_izlude_in_izlude_please_enjoy_fe4745: "请尽情享受"
  npc_override_izlude_in_izlude_pound_cure_72b78f: "治疗，"
  npc_override_izlude_in_izlude_prevention_worth_480575: "胜于"
  npc_override_izlude_in_izlude_pubs_prontera_always_ful_7ef193: "普隆德拉的酒馆总是挤满了本地人和外地人。那里总是相当热闹。"
  npc_override_izlude_in_izlude_really_cool_you_6d13a2: "真的很酷吗？！你可以"
  npc_override_izlude_in_izlude_recovered_depends_e9fed4: "取决于你的"
  npc_override_izlude_in_izlude_right_magnum_break_best_77d41d: "对吧？！^EE0000怒爆^000000才是最棒的！！！你懂行嘛？真不知道那家伙为什么那么固执。"
  npc_override_izlude_in_izlude_s_exactly_why_you_re_548984: "这就是你蠢的原因，你这白痴！还有什么理想的剑士？我还记得你上次用怒爆的时候……"
  npc_override_izlude_in_izlude_s_exactly_why_you_re_b3fdde: "这就是你蠢的原因，你这白痴！还有什么理想的剑士？你记得上次你用怒爆的时候吗？！"
  npc_override_izlude_in_izlude_s_pretty_good_place_stop_d0448a: "那里是打听消息和听八卦的好去处。"
  npc_override_izlude_in_izlude_s_right_magnum_break_4ed233: "没错，怒爆"
  npc_override_izlude_in_izlude_s_somewhere_near_bridge_dc5699: "就在连接森林和沙漠的那座桥附近，从这里往东南去斐扬的路上。"
  npc_override_izlude_in_izlude_see_all_sorts_places_41e19c: "看到各种各样的地方……！"
  npc_override_izlude_in_izlude_see_someone_who_pursues_907135: "看到没！？选了不同职业的人也同意我~！你真是个好人！哈哈哈！！"
  npc_override_izlude_in_izlude_skill_4eb1f6: "才是真正能"
  npc_override_izlude_in_izlude_so_if_you_invest_more_0143c7: "所以如果你把更多点数投到 VIT 上，休息时恢复的 HP 总量就更多。"
  npc_override_izlude_in_izlude_so_if_you_listen_careful_0041d5: "所以如果仔细倾听的话，说不定运气好就能听到对自己非常有用的信息。"
  npc_override_izlude_in_izlude_so_nowadays_hunters_sell_67244e: "所以现在嘛，猎人们都把东西卖给有登记的商人了。已经没什么人为了这事来找我们了。"
  npc_override_izlude_in_izlude_so_whaddya_say_99f776: "那么，觉得怎么样？"
  npc_override_izlude_in_izlude_so_what_you_think_4c4cbe: "你觉得呢？"
  npc_override_izlude_in_izlude_so_won_t_too_effective_3bea6e: "所以对水属性怪物效果不太好，但对付不死系和地属性怪物，这可是神技！"
  npc_override_izlude_in_izlude_so_won_t_very_effective_c4423b: "所以对水属性怪物效果不太好，但对付不死系和地属性怪物，这可是神技！"
  npc_override_izlude_in_izlude_some_monsters_world_uniq_840c87: "世界上有些怪物拥有感知神秘能量的独特能力，能在魔法施放前就察觉到。"
  npc_override_izlude_in_izlude_some_people_may_think_iz_5f6563: "有些人可能觉得依斯鲁得只是普隆德拉的卫星城，并没有那么重要……"
  npc_override_izlude_in_izlude_something_simplistic_lik_84205d: "像狂击这种简单的技能"
  npc_override_izlude_in_izlude_sometimes_explosion_acci_eeb391: "有时候爆炸会误伤一些路过的怪物。"
  npc_override_izlude_in_izlude_steep_climb_03bb9c: "陡峭难攀的山。"
  npc_override_izlude_in_izlude_surprisingly_once_you_re_d31877: "令人惊奇的是，一旦到了水下，你就能像鱼一样呼吸。也许是某种超自然力量在起作用。"
  npc_override_izlude_in_izlude_swordman_skill_e3fda7: "剑士技能。"
  npc_override_izlude_in_izlude_telescope_constantly_wat_a9ebbb: "这架望远镜时刻监视着大海，这样我们就能防止任何严重的麻烦发生。你知道的……"
  npc_override_izlude_in_izlude_them_run_345158: "逃命了。"
  npc_override_izlude_in_izlude_then_they_all_end_up_21ea32: "然后它们全都会追着你跑，但这是一个真正的剑士应该承担的风险。"
  npc_override_izlude_in_izlude_there_only_pink_porings_ce42e4: "那里不仅有粉色的波利，还有沙漠中的土波利，以及绿色的波波利。"
  npc_override_izlude_in_izlude_there_other_cultures_com_453d68: "但还有其他完全靠海为生而发展起来的文化。当然，我说的是天津。"
  npc_override_izlude_in_izlude_there_s_very_delightful_3d77eb: "有一个非常有趣的地方，在那里你可以找到"
  npc_override_izlude_in_izlude_those_whose_main_attack_238130: "像剑士和弓箭手这样以物理攻击为主的人，面对幽灵波利时可能不得不逃命。"
  npc_override_izlude_in_izlude_though_very_beautiful_by_d8138d: "虽然依斯拉岛非常美丽，但它有一个深入海底的神秘地下城。"
  npc_override_izlude_in_izlude_train_hard_26d74a: "好好训练~~"
  npc_override_izlude_in_izlude_type_poring_88d46f: "所有种类的波利。"
  npc_override_izlude_in_izlude_unfortunately_monsters_t_54456c: "但遗憾的是，那里的怪物太强了，普通人无法去观光。不过，哪怕只有一次，我也想下去看看……"
  npc_override_izlude_in_izlude_vitality_vit_ea9b42: "体力，也就是 VIT。"
  npc_override_izlude_in_izlude_wanna_ed0cb6: "想要"
  npc_override_izlude_in_izlude_way_even_swordman_archer_79a3d9: "这样一来，即使是剑士或弓箭手也能像魔法一样对幽灵波利造成伤害。"
  npc_override_izlude_in_izlude_we_had_work_overtime_eve_e3c669: "我们每天都得加班。啊，那真是噩梦……！总之，政府最终做出了明智的决定，建立了登记制度。"
  npc_override_izlude_in_izlude_well_7b1901: "嗯……"
  npc_override_izlude_in_izlude_well_course_they_all_ver_a11cd9: "当然啦，它们都很可爱，但幽灵波利是例外。它非常非常危险。"
  npc_override_izlude_in_izlude_well_sometimes_explosive_8a8e3d: "嗯……有时候爆炸伤害可能会误伤一些路过的怪物，那些家伙就会追着你跑，但这正是一个剑士应该承担的风险！"
  npc_override_izlude_in_izlude_what_what_you_mean_you_267d2b: "什么？！你说你不知道？！那个，你知道打怪可以获得物品吧。把那些东西拿去卖给商人，就能赚钱。 "
  npc_override_izlude_in_izlude_what_you_talking_about_i_c6d5ae: "你在说什么鬼话！？理想的剑士应该孤身一人，被无数敌人包围，用一记猛攻将它们全部击飞……"
  npc_override_izlude_in_izlude_what_you_talking_about_i_e70476: "你在说什么鬼话！？理想的剑士应该孤身一人，被无数敌人包围，用一记猛攻将它们全部击飞。"
  npc_override_izlude_in_izlude_which_one_you_think_bett_b14892: "你觉得哪个更好？暴击伤害技能^FF2400狂击^000000，还是范围伤害技能^EE0000怒爆^000000？"
  npc_override_izlude_in_izlude_without_doubt_only_bash_a7b019: "毫无疑问，只有^FF2400狂击^000000才配得上剑士。请告诉那边的白痴！！哈哈哈~"
  npc_override_izlude_in_izlude_you_battle_monsters_diff_c935d1: "你可以与不同等级的怪物战斗。所以，你能通过的关卡数就是你战斗实力的证明。"
  npc_override_izlude_in_izlude_you_bored_all_talk_you_7a9b18: "你听烦了吗？还是想让我继续？"
  npc_override_izlude_in_izlude_you_ended_up_running_awa_f5c66a: "你最后被那个蠢技能打到的怪物追着满街跑！弱鸡！你周围的波利全被打中，全都想杀了你。"
  npc_override_izlude_in_izlude_you_had_run_away_all_98a47c: "你被那个蠢技能打到的波利追着满街跑！弱鸡！你打到的那些波利全都要杀你！"
  npc_override_izlude_in_izlude_you_know_you_ll_need_81dfa8: "你懂的，想轻松挥舞好武器，多多少少需要点力量。"
  npc_override_izlude_in_izlude_you_ll_board_ship_port_55d9f4: "要前往依斯拉岛必须在港口乘船。岛上有危险的地下城，不要到处乱逛。"
  npc_override_izlude_in_izlude_you_wanna_know_8e7efb: "想知道吗？"
  npc_override_izlude_in_izlude_you_wanna_know_some_usef_41b1d6: "想知道点有用的信息吗？好吧好吧，让我告诉你！怒爆具有火属性。"
  npc_override_izlude_in_izlude_you_wanna_know_some_usef_ce1cca: "想知道点有用的信息吗？好吧好吧，让我告诉你！怒爆的爆炸具有火属性。"
  npc_override_izlude_in_izlude_your_visit_d6a86a: "您在"
  npc_override_izlude_in_izlude_zeny_1938bb: "150 Zeny！"
  npc_override_izlude_in_izlude_zeny_64b049: "500 Zeny！"
  npc_override_izlude_in_swordman_basic_skill_level_5c7f86: "和^4A4AFF基本技能等级9^000000。"
  npc_override_izlude_in_swordman_come_back_me_when_you_56a696: "等你学完了初学者基本技能再回来找我。"
  npc_override_izlude_in_swordman_congratulations_again_be_4414b5: "再次恭喜你成为剑士，希望你多多参与我们公会的复兴活动。"
  npc_override_izlude_in_swordman_congratulations_now_you_a0b45f: "恭喜！从现在开始，你将过上剑士的生活！"
  npc_override_izlude_in_swordman_excellent_let_me_promote_858371: "太好了！让我立刻晋升你为剑士！"
  npc_override_izlude_in_swordman_first_swordman_higher_hp_43f462: "首先，剑士比其他职业拥有更高的 HP。"
  npc_override_izlude_in_swordman_good_you_want_swordman_r_830e2a: "很好。你想立刻成为剑士吗？"
  npc_override_izlude_in_swordman_hm_701c55: "嗯……？"
  npc_override_izlude_in_swordman_hmm_ah_you_must_first_341954: "嗯？啊，你必须先掌握基本技能，才能准备好成为剑士。"
  npc_override_izlude_in_swordman_hmm_both_your_job_level_c3a2a5: "嗯，你的 Job 等级和基本技能等级都达标了。"
  npc_override_izlude_in_swordman_hmm_you_look_like_well_9c09ee: "嗯……你看起来是个经验丰富的剑士。不过，我相信你必须训练来提升技能和增强力量！"
  npc_override_izlude_in_swordman_hmmm_2ac89c: "嗯……"
  npc_override_izlude_in_swordman_i_feel_sorry_you_conside_acdfcf: "但我感到遗憾……你克服了所有困难之后还要再考虑……"
  npc_override_izlude_in_swordman_i_m_sorry_tell_you_b8738e: "很抱歉告诉你，要成为剑士，你必须至少达到^4A4AFF Job 等级10^000000。"
  npc_override_izlude_in_swordman_i_see_you_re_retreading_892a34: "看来你正在重走剑士之路！一旦你习惯了挥舞剑，就再也回不去了！！"
  npc_override_izlude_in_swordman_i_you_9378ca: "我能为你做的。"
  npc_override_izlude_in_swordman_it_454889: "它……"
  npc_override_izlude_in_swordman_just_devote_yourself_gre_d83f7c: "只要全身心投入成为一名伟大的剑士。"
  npc_override_izlude_in_swordman_let_s_right_now_04fc8a: "我们现在就开始吧！"
  npc_override_izlude_in_swordman_menu_tell_2ea8d4: "告诉我关于剑士的事。:我想成为剑士。:没什么。"
  npc_override_izlude_in_swordman_menu_yes_400366: "是的，我想。:我再考虑一下。"
  npc_override_izlude_in_swordman_most_distinctive_feature_9c8579: "剑士最显著的特点是在近战中能发挥出真正的实力。"
  npc_override_izlude_in_swordman_my_opinion_swordman_best_e465e0: "在我看来，剑士是有史以来最好的职业！"
  npc_override_izlude_in_swordman_second_except_bows_rods_a91a46: "其次，除了弓和杖之外，剑士可以使用所有其他武器，因此他们可以以最佳状态战斗。"
  npc_override_izlude_in_swordman_seems_being_06471b: "似乎成为"
  npc_override_izlude_in_swordman_seems_there_nothing_70af98: "但似乎没什么"
  npc_override_izlude_in_swordman_so_you_wish_know_more_de4acc: "所以你想了解更多关于强大剑士的事？好吧！"
  npc_override_izlude_in_swordman_swordman_guild_b80b78: "这里是剑士公会。"
  npc_override_izlude_in_swordman_swordman_part_071d18: "剑士不是"
  npc_override_izlude_in_swordman_t_a021d3: "不可能……"
  npc_override_izlude_in_swordman_there_three_reasons_75bde1: "有三个原因！"
  npc_override_izlude_in_swordman_third_most_skills_swordm_398b6e: "第三，剑士的大部分技能都能造成强大的物理攻击。"
  npc_override_izlude_in_swordman_though_i_gave_you_simple_28d0c3: "虽然我给了你一个简单的解释，但我相信你理解了成为剑士的核心意义。"
  npc_override_izlude_in_swordman_want_swordman_without_ha_8d8c4c: "想在没有最低要求的情况下成为剑士？"
  npc_override_izlude_in_swordman_warrior_aren_t_you_158d6a: "战士，不是吗？"
  npc_override_izlude_in_swordman_why_you_here_f3f3c0: "你为什么在这里？"
  npc_override_izlude_in_swordman_yeah_prudent_decision_ne_6b3d24: "是啊。选择职业需要谨慎的决定。"
  npc_override_izlude_in_swordman_you_already_excellent_sw_97dab1: "你已经是个优秀的剑士了，不是吗？"
  npc_override_izlude_in_swordman_you_already_one_other_jo_a4d3b6: "你已经有其他职业了，不是吗？"
  npc_override_izlude_in_swordman_you_re_reborn_50537a: "你是转生的"
  npc_override_izlude_in_swordman_you_think_being_swordman_6355e6: "你觉得成为剑士那么容易吗？"
  npc_override_izlude_in_swordman_you_ve_been_reborn_haven_5ebfe3: "你已经转生了，不是吗？"
  npc_override_izlude_in_swordman_you_ve_gone_too_far_291901: "你这个玩笑开得太过分了。"
  npc_override_izlude_in_swordman_your_destiny_i_m_sorry_71d0f0: "你的命运。抱歉，"