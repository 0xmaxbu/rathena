  npc_override_alberta_alberta_hmm_looks_like_you_don_632bff: "嗯，看来你不够。如果还想从我这儿换东西，就再去多弄点果冻吧。"
  npc_override_alberta_alberta_hmm_so_why_don_t_eeabb7: "嗯，这样吧，你给我弄10个果冻，我给你1瓶药水。怎么样？"
  npc_override_alberta_alberta_hmm_you_want_exchange_je_f736ad: "嗯……你想用果冻换红色药水还是胡萝卜？嗯……选哪个？"
  npc_override_alberta_alberta_hoping_save_any_survivor_83c640: "为了营救可能的幸存者，一些镇民冒险登上了那艘船。然而，他们全都惊恐地跑了出来，说船里有尸体在走来走去。"
  npc_override_alberta_alberta_how_many_potions_6ca056: "你想要"
  npc_override_alberta_alberta_how_many_you_want_9e4d82: "你想要多少？"
  npc_override_alberta_alberta_i_changed_my_mind_6d6bab: "我改主意了。"
  npc_override_alberta_alberta_i_ll_around_f5a828: "我会在这附近"
  npc_override_alberta_alberta_i_lucky_i_didn_t_88a59a: "幸好我没有惹怒它。即使是最小的动物，一旦被激怒也可能是危险的。"
  npc_override_alberta_alberta_i_m_giving_you_more_f8c826: "我一次最多给你100瓶，别打那主意，懂吗？如果不想要，就输'0'。"
  npc_override_alberta_alberta_i_m_guessing_s_some_1d329e: "我猜这大概是什么潮流或者骗局吧，让你去收集所有的卡片什么的。我说，一张卡片怎么可能真的承载魔物的力量呢？！"
  npc_override_alberta_alberta_i_once_saw_pack_wolves_2d7b24: "我有一次看到一群狼围攻其中一只巨大又懒散的熊！"
  npc_override_alberta_alberta_i_want_many_6cc551: "我要这么多。"
  npc_override_alberta_alberta_i_went_see_what_when_bbbd46: "我走过去想看看是什么，伸手去摸它。那根茎居然拍了我的手一下！"
