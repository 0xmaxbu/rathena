Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_alberta_alberta_admission_875177: "入队"
  npc_override_alberta_alberta_ah_captain_i_miss_our_677a91: "啊~ 船长。我最想念的就是我们的船长……在船长的剑下，没有敌人能活下来。"
  npc_override_alberta_alberta_ah_ol_days_if_only_fb662a: "啊~ 那段往昔。要是……要是我们没有遇上那场风暴就好了……^666666*嗝*^000000"
  npc_override_alberta_alberta_ahoy_mate_618393: "嘿伙计，"
  npc_override_alberta_alberta_ain_t_no_way_yer_ae2661: "没500 Zeny你哪儿也别想去！"
  npc_override_alberta_alberta_alberta_harbour_13a048: "艾尔贝塔港口。"
  npc_override_alberta_alberta_alright_6ceaec: "好吧……"
  npc_override_alberta_alberta_alright_let_s_see_what_9fa3f9: "好吧，让我看看你有什么……"
  npc_override_alberta_alberta_alright_then_see_you_nex_df4543: "那好吧，下次见。"
  npc_override_alberta_alberta_alright_well_7884aa: "好吧，那……"
  npc_override_alberta_alberta_as_many_as_i_get_9316c1: "能换多少换多少。"
  npc_override_alberta_alberta_as_many_as_i_please_8d61cb: "能换多少换多少。"
  npc_override_alberta_alberta_bastard_captain_fighting_dc6814: "船长正与之搏斗的那个混蛋，还有他身边的同伙，全都被火焰包围了！"
  npc_override_alberta_alberta_business_341748: "做生意。"
  npc_override_alberta_alberta_captain_hiccup_he_swing_0eb19b: "船长~！！！^666666*嗝~*^000000 他会这样挥剑，然后……然后！！"
  npc_override_alberta_alberta_carrots_please_81ff20: "要胡萝卜。"
  npc_override_alberta_alberta_catch_ya_later_8ace61: "回头见。"
  npc_override_alberta_alberta_derelict_ship_a29b3c: "一艘废弃的船"
  npc_override_alberta_alberta_discount_skill_we_buy_go_6f3f18: "有了'低价买进'技能，我们就能从城镇的商店里以极低的价格买入货物，然后装进我们租来的手推车里。"
  npc_override_alberta_alberta_drifted_into_2e8dc1: "漂流进了"
  npc_override_alberta_alberta_exploration_team_295246: "探险队"
  npc_override_alberta_alberta_fee_only_b2cb9d: "费只要"
  npc_override_alberta_alberta_go_away_41df5b: "快滚~"
  npc_override_alberta_alberta_good_day_5017a8: "你好呀~"
  npc_override_alberta_alberta_hahahaha_hiccup_you_ve_g_a0b2cb: "哈哈哈^666666*嗝*^000000……你胆子不小。我现在看起来一文不值，但以前我可是'玛丽号'上的水手。"
  npc_override_alberta_alberta_hell_you_doing_here_439faa: "你在这鬼地方干什么？"
  npc_override_alberta_alberta_hey_now_don_t_try_7026b9: "喂喂，别想赖账！我说了250 Zeny！"
  npc_override_alberta_alberta_hey_pansy_ass_i_said_2ba7d2: "嘿软脚虾，我说了最多100根，不能再多了！我才不会为了你这种人累断腰！"
  npc_override_alberta_alberta_hey_weren_t_you_listenin_64a5cb: "喂！你没在听吗？我说了10个果冻换1瓶红色药水……你聋了吗？"
  npc_override_alberta_alberta_hey_what_d_i_say_b91997: "嘿，我说什么来着？一次最多100瓶，你想害死我啊！"
  npc_override_alberta_alberta_hey_you_know_one_time_a88e98: "嘿，你知道吗，有一次我穿过森林的时候，看到一根绿色的小茎在动来动去。"
  npc_override_alberta_alberta_hmm_bad_4ccb16: "嗯，还不错……"
  npc_override_alberta_alberta_hmm_look_pansy_ass_i_9f0f61: "嗯，听好了软脚虾，我说了3个果冻换1根胡萝卜……懂了吗？"
  npc_override_alberta_alberta_hmm_looks_like_you_don_632bff: "嗯，看来你不够。如果还想从我这儿换东西，就再去多弄点果冻吧。"
  npc_override_alberta_alberta_hmm_so_why_don_t_eeabb7: "嗯，这样吧，你给我弄10个果冻，我给你1瓶药水。怎么样？"
  npc_override_alberta_alberta_hmm_you_want_exchange_je_f736ad: "嗯……你想用果冻换红色药水还是胡萝卜？嗯……选哪个？"
  npc_override_alberta_alberta_hoping_save_any_survivor_83c640: "为了营救可能的幸存者，一些镇民冒险登上了那艘船。然而，他们全都惊恐地跑了出来，说船里有尸体在走来走去。"
  npc_override_alberta_alberta_how_many_potions_6ca056: "你想要"
  npc_override_alberta_alberta_how_many_you_want_9e4d82: "你想要多少？"
  npc_override_alberta_alberta_i_changed_my_mind_6d6bab: "我改主意了。"
  npc_override_alberta_alberta_i_ll_around_f5a828: "我会在这附近"
  npc_override_alberta_alberta_i_lucky_i_didn_t_88a59a: "幸好我没有惹怒它。即使是最小的动物，一旦被激怒也可能是危险的。"
  npc_override_alberta_alberta_i_m_giving_you_more_f8c826: "我一次最多给你100瓶，别打那主意，懂吗？如果不想要，就输'0'。"
  npc_override_alberta_alberta_i_m_guessing_s_some_1d329e: "我猜这大概是什么潮流或者骗局吧，让你去收集所有的卡片什么的。我说，一张卡片怎么可能真的承载魔物的力量呢？！"
  npc_override_alberta_alberta_i_once_saw_pack_wolves_2d7b24: "我有一次看到一群狼围攻其中一只巨大又懒散的熊！"
  npc_override_alberta_alberta_i_want_many_6cc551: "我要这么多。"
  npc_override_alberta_alberta_i_went_see_what_when_bbbd46: "我走过去想看看是什么，伸手去摸它。那根茎居然拍了我的手一下！"
  npc_override_alberta_alberta_i_wonder_21ad65: "我想知道……"
  npc_override_alberta_alberta_if_any_a696a7: "这些事情"
  npc_override_alberta_alberta_if_i_buy_lot_them_6ce73b: "如果我能大批量进货，然后在这里以更高的价格转手……"
  npc_override_alberta_alberta_if_s_too_hard_your_63de8e: "或者如果你这软脚虾觉得太难，3个果冻换1根胡萝卜也行。"
  npc_override_alberta_alberta_if_you_change_72fca7: "如果你"
  npc_override_alberta_alberta_if_you_re_interested_my_28ecfd: "如果你对我的提议感兴趣，就把我说要的东西拿来。"
  npc_override_alberta_alberta_izlude_marina_zeny_2a0dd2: "依斯鲁得码头 -> 500 Zeny。"
  npc_override_alberta_alberta_join_494e2d: "沉船"
  npc_override_alberta_alberta_just_fun_i_threw_rock_6b0c98: "为了好玩，我朝它扔了块石头，突然它就朝我冲了过来！我吓死了，拔腿就跑，然后砰！！！"
  npc_override_alberta_alberta_landlubber_66b3e3: "旱鸭子。"
  npc_override_alberta_alberta_leave_him_alone_00545a: "别理他了。"
  npc_override_alberta_alberta_let_s_see_80b633: "让我看看"
  npc_override_alberta_alberta_man_sword_must_had_some_5ddfa8: "天哪，那把剑一定有什么神秘的力量，又或者是船长真的有那么强……！"
  npc_override_alberta_alberta_man_when_you_travel_all_fd30b7: "唉……当你在世界各地旅行的时候，会听到各种稀奇古怪的事情。"
  npc_override_alberta_alberta_menu_i_8381d9: "如果你想和一只狼打，而它周围还有同类的话，我劝你三思。小心别被围攻！"
  npc_override_alberta_alberta_much_obliged_come_again_907e6e: "多谢，随时欢迎再来。"
  npc_override_alberta_alberta_never_heard_a0288b: "从没听过。"
  npc_override_alberta_alberta_never_heard_everybody_kn_e22fd6: "从没听过？！大家都知道那艘臭名昭著的海盗船'玛丽号'！^666666*嗝~*^000000"
  npc_override_alberta_alberta_never_mind_8721eb: "算了。"
  npc_override_alberta_alberta_never_mind_i_like_my_edffcc: "算了，我的果冻自己留着。"
  npc_override_alberta_alberta_no_problem_2160d2: "没问题，"
  npc_override_alberta_alberta_oh_6cc234: "哦……！"
  npc_override_alberta_alberta_oh_before_you_join_i_527da8: "哦！在你加入之前，我得提醒你。如果你不是特别强，最好还是别去。"
  npc_override_alberta_alberta_once_i_heard_there_cards_fe0343: "有一次，我听说有一种卡片，里面封印着魔物的力量。如果谁能弄到一张卡，就能使用那只魔物的力量。"
  npc_override_alberta_alberta_open_roadside_stands_fe4bbd: "在路边摆摊"
  npc_override_alberta_alberta_pardon_me_if_i_seem_a7475e: "如果我显得心不在焉，请多包涵。我正四处打听，想做个计划。你瞧，我听说吉芬有家店卖能抵抗魔法的防具。"
  npc_override_alberta_alberta_people_also_say_babies_a_427e0f: "人们还说婴儿是鹳鸟在送来之前组装好的，女孩子喜欢混蛋男生，还有圣诞老人真的存在！不过只在Lutie（玩具城）。"
  npc_override_alberta_alberta_people_say_legendary_wea_cccdde: "人们说传说中的武器冈格尼尔从不会偏离目标。我想知道这是不是真的……"
  npc_override_alberta_alberta_phew_sob_sob_god_i_026cff: "呼~~ ^666666*呜* *呜……*^000000 天哪，我想念大家！现在我心里好难受！求你了，走吧。"
  npc_override_alberta_alberta_please_reduce_amount_ite_cd9169: "请减少身上物品的数量，"
  npc_override_alberta_alberta_possibly_9378dc: "到底是不是"
  npc_override_alberta_alberta_ran_into_low_tree_branch_cf9fa1: "它撞上了一根低矮的树枝，把自己撞晕了！我发誓，我再也不为了好玩去招惹动物了！"
  npc_override_alberta_alberta_really_no_kidding_9eb37b: "真的？别开玩笑！"
  npc_override_alberta_alberta_red_potions_please_c6a80d: "要红色药水。"
  npc_override_alberta_alberta_right_i_m_giving_you_f60f4c: "听好了，我一次最多给你100根，别多想，好吗？如果不想要，就输'0'。"
  npc_override_alberta_alberta_s_more_than_just_yelling_5b3474: "这可不是光喊'请多给点钱！'就行的。你需要有魅力，还得精通话术！"
  npc_override_alberta_alberta_s_right_ddafea: "这就对了！"
  npc_override_alberta_alberta_s_right_nobody_meshes_cr_f917d8: "没错！没人敢惹'玛丽号'的船员！也没人能在剑术上打败我们的船长！"
  npc_override_alberta_alberta_say_nothing_51b0af: "什么都不说。"
  npc_override_alberta_alberta_see_you_next_time_f1ab5e: "下次见。"
  npc_override_alberta_alberta_seems_you_don_t_enough_a53915: "看来你不够。如果还想换别的，就再去多弄点。"
  npc_override_alberta_alberta_seems_you_don_t_money_d31bf9: "朋友，看来你没带够钱。不过等你能付得起的时候，请再来吧。"
  npc_override_alberta_alberta_seriously_1fb5b3: "真是的……"
  npc_override_alberta_alberta_ship_also_packed_dangero_864b93: "船上还满是危险的海洋生物，他们就算想进去也进不去。"
  npc_override_alberta_alberta_sign_me_up_c8aa6c: "我加入！"
  npc_override_alberta_alberta_sign_up_861d69: "报名吗？"
  npc_override_alberta_alberta_so_might_good_experience_fe62f9: "所以，像你这样的年轻人去当一名新兵，也许是不错的经历。但是，如果你还不够强，那就不值得拿命去冒险。"
  npc_override_alberta_alberta_so_want_3f2fc6: "那么，想"
  npc_override_alberta_alberta_so_you_wanna_head_back_162a50: "那你是想回艾尔贝塔大陆了，是吧？"
  npc_override_alberta_alberta_some_time_ago_387aac: "前些时候，"
  npc_override_alberta_alberta_staring_get_lost_76f66b: "看什么看？滚开！！"
  npc_override_alberta_alberta_startled_me_so_i_jumped_27e9a1: "吓了我一跳，我往后跳了一点，然后才意识到那不是茎，而是一只很小的动物。"
  npc_override_alberta_alberta_sunken_ship_1d0c8e: "吗？"
  npc_override_alberta_alberta_sunken_ship_zeny_8fb2db: "沉船 -> 250 Zeny。"
  npc_override_alberta_alberta_then_afterwards_we_trave_5a68ee: "之后，我们就可以去任何地方旅行，把货物卖掉赚取利润！"
  npc_override_alberta_alberta_then_come_see_me_again_20c06b: "然后再来找我。"
  npc_override_alberta_alberta_there_nothing_you_get_fr_cd4474: "在这艘船上没有白拿的东西，想要什么，就得付出劳动！！"
  npc_override_alberta_alberta_there_you_go_as_i_48710d: "给你~！说到做到。可别一口气全塞进嘴里。"
  npc_override_alberta_alberta_there_you_go_as_i_e04af5: "给你！说到做到。可别一口气全喝光了。"
  npc_override_alberta_alberta_too_bad_pansy_428ef7: "还不错嘛软脚虾……"
  npc_override_alberta_alberta_true_d21373: "真的……"
  npc_override_alberta_alberta_uh_no_thanks_36bb66: "呃，还是算了。"
  npc_override_alberta_alberta_wait_moment_980524: "等一下！！"
  npc_override_alberta_alberta_wanna_go_63a2b5: "哪里？"
  npc_override_alberta_alberta_way_business_more_conven_0e6155: "这样一来，做生意就更方便也更安全了。可别打瞌睡哦，虽然这真的太容易让人犯困了。"
  npc_override_alberta_alberta_we_couldn_t_anything_abo_7d7601: "面对那艘看起来不祥的船，我们束手无策，只能任由它停在那里。如今，探险队试图进入那艘船，消灭里面的怪物。"
  npc_override_alberta_alberta_we_get_up_more_zeny_1a3f93: "用这个了不起的技能，我们最多能多赚24%的Zeny。但记住要努力修炼才能掌握！！"
  npc_override_alberta_alberta_we_merchants_7b14c7: "我们商人可以"
  npc_override_alberta_alberta_we_merchants_our_own_neg_603584: "我们商人在卖东西的时候，有自己专门的议价技能。这个技能能让我们比别人卖东西赚到更多的钱。"
  npc_override_alberta_alberta_welcome_alberta_a33ad4: "欢迎来到艾尔贝塔，"
  npc_override_alberta_alberta_wh_what_you_9857cf: "你……你"
  npc_override_alberta_alberta_what_cha_got_3b6433: "你有什么……"
  npc_override_alberta_alberta_where_d_ya_7ec179: "你想去"
  npc_override_alberta_alberta_wolves_much_more_coopera_9ee947: "狼远比看上去更懂得合作。如果其中一只受到攻击，附近的狼都会跑来帮忙。"
  npc_override_alberta_alberta_yes_please_37ebb8: "好的。"
  npc_override_alberta_alberta_you_brought_too_many_thi_df3efe: "你带的东西太多了！"
  npc_override_alberta_alberta_you_cannot_accept_any_mo_82606b: "不能再接收更多物品了！"
  npc_override_alberta_alberta_you_know_those_lazy_look_3ef898: "你知道去斐扬路上森林里那些懒洋洋的熊吗？"
  npc_override_alberta_alberta_you_like_bb1111: "你愿意加入"
  npc_override_alberta_alberta_you_want_get_256eed: "多少瓶药水？"
  npc_override_alberta_alberta_young_adventurer_ac6cd8: "年轻的冒险者！"
  npc_override_alberta_alberta_your_mind_9c9203: "改主意了。"
  npc_override_alberta_alberta_zeny_9724d8: "200 Zeny。"
