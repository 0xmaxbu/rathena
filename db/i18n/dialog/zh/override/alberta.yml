  npc_override_alberta_alberta_pardon_me_if_i_seem_a7475e: "如果我显得心不在焉，请多包涵。我正四处打听，想做个计划。你瞧，我听说吉芬有家店卖能抵抗魔法的防具。"
  npc_override_alberta_alberta_people_also_say_babies_a_427e0f: "人们还说婴儿是鹳鸟在送来之前组装好的，女孩子喜欢混蛋男生，还有圣诞老人真的存在！不过只在Lutie（玩具城）。"
  npc_override_alberta_alberta_people_say_legendary_wea_cccdde: "人们说传说中的武器冈格尼尔从不会偏离目标。我想知道这是不是真的……"
