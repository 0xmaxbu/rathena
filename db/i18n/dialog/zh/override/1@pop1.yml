Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_according_recent_investi_e724d7: "根据最近的调查报告，这是由于克苏拉纳克斯的影响使其获得了微弱的魔力。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_143715: "冒险者……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_59e18c: "冒险者？但是……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_come_us_3de680: "冒险者，跟我们走。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_hostle_target_611c3f: "冒险者是敌对目标。毫不留情地消灭他！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_please_follow_160d9e: "冒险者，请跟我来……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_please_help_m_922b42: "冒险者，请……帮帮我。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_what_pope_s_d_31732d: "冒险者，教皇的梦境状态是什么样的？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_you_came_than_da9b03: "冒险者，你来了。非常感谢你在百忙之中抽出时间。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_you_mind_if_i_0ca762: "冒险者，你介意我再请你帮个忙吗？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_after_all_i_think_you_d77eab: "毕竟，我觉得你是值得信赖的，所以我会信任你并告诉你。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_after_waking_up_she_sad_5b6704: "醒来后，她表情悲伤，经常沉浸在自己的思绪中，注意力不集中。然后她又回去睡觉了。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_after_you_appeared_we_ha_825b57: "你出现后，大祭司和守卫都来找我们了……我们甚至与父母失散了！！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_agreed_s_easier_way_54f8d6: "同意，那样更简单~"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_ah_9f5525: "啊……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_all_you_restrain_pope_4fcd43: "你们所有人，制服教皇！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_all_you_shut_up_b13166: "你们所有人！闭嘴！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_also_blasphemy_freyja_ho_1a640a: "不遵守时间也是对芙蕾雅的亵渎。请谨慎行事。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_am_i_just_vessel_goddess_7ba600: "我只是女神的容器吗？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_annoying_adventurer_soon_72399d: "那个讨厌的冒险者很快就会消失！！！！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_anyone_who_disagrees_dea_973cf7: "任何不同意的人都将被武力处理。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_arghh_think_just_mere_mo_b0e53f: "啊……没想到这只是一个凡人……！真是耻辱……！！！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_as_adventurer_speculates_ed73e8: "正如冒险者推测的那样，教皇最近出了点小问题。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_as_current_pope_s_sleep_96ede2: "由于现任教皇的睡眠时间越来越慢，推测有人试图留住她，或者教皇自己不想醒来。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_as_situation_continues_l_eaf9f7: "随着这种情况持续，流言开始在圣殿内部逐渐传播。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_as_today_s_time_you_c109aa: "至于今天，是你放松休息的时间。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_aye_aye_sir_c30e2a: "遵命！！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_before_coming_here_i_tol_92affc: "来这里之前，尼伦告诉过我。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_begone_5d7ece: "滚开！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_behold_birth_our_new_pop_0c232f: "看啊，我们新教皇的诞生！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_both_you_become_popes_37d4a9: "你们两个都可以成为教皇！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_boy_same_citeria_knows_n_b4588b: "一个符合同样标准但一无所知的男孩是无用的……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_boy_white_hair_pale_comp_21b221: "一个白发苍白肤色的男孩出现了。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_190ca1: "哥哥……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_74cea9: "哥哥。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_a8afa6: "哥哥……？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_b14266: "哥哥？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_don_t_say_advent_f8ca17: "哥哥，别这么说。冒险者一直是个值得信赖的伙伴。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_f7a05c: "哥哥……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_frozen_ice_cave_cc7e27: "哥哥……被冻在冰洞里了。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_look_looks_delic_9c3294: "哥哥！看那个！看起来很好吃。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_place_1ad7d8: "哥哥，这就是那个地方……？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_but_2e7fce: "但是……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_but_6f5c5d: "但是……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_but_bda5a6: "但是？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_bye_749de5: "再见！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_bye_c74845: "再见~"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_cannot_confirmed_possibl_95ce9c: "无法确认，但这是可能的。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_certainly_pope_please_st_0f2924: "当然，教皇。请站在我身后。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_certainly_shall_we_raise_6ec5f5: "当然！我们要一起把它当宠物养吗？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_changing_clothes_14425a: "换衣服……？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_citizens_arunafeltz_find_99503e: "阿鲁纳费尔茨的公民在教皇身上找到安慰、灵感和希望。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_come_closer_me_5bba0b: "靠近我……！！！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_come_let_us_go_together_45b76b: "来吧，我们一起走。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_come_we_get_out_here_ae72ee: "来吧，我们必须离开这里。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_come_we_need_get_out_04286c: "来吧，我们需要离开这里。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_could_i_raise_4b6f03: "我可以养它吗？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_could_you_accompany_pope_d5a8ae: "你能再次陪伴教皇进入她的梦境吗？她……需要陪伴。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_crack_time_safe_enough_p_020024: "时间裂缝不够安全，无法来回穿越。请在后遗症计时器过去后再回来。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_cute_17d8e8: "可爱！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_cute_puppy_2aae67: "可爱的小狗。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_d_amn_what_s_noise_0b7726: "该死，这里是什么噪音。怎么回事……？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dangerous_you_sure_about_8c7417: "这很危险。你确定要离开……？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_did_you_just_heard_f10caf: "你刚才听到了吗？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_doesn_t_matter_now_we_e77d6e: "现在无所谓了。从现在起我们将永远在一起。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_bother_me_72e327: "别烦我。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_go_don_t_b5b7d5: "别走！不要就这样离开我……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_listen_don_t_b7a77a: "别听那个。甚至不要去想！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_luwmin_frozen_move_d7daa7: "别那样。卢明被冻住了，无法移动。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_stand_still_pope_172220: "别站着不动，教皇，采取行动！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_worry_i_m_11c798: "别担心。我没事。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_worry_s_as_e6cb9d: "别担心，我又不是永远睡下去。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_you_dare_interfere_2bdaa9: "你敢干涉！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_you_understand_whe_197a86: "你难道不明白我们在哪里吗……？！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_9ad308: "梦境……？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_ad96ef: "这是一个梦！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_b1b32d: "这是一个梦……？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_ff293a: "梦境……？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_having_my_brother_4c32c5: "……还有让哥哥陪在我身边的梦……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_realm_created_luwm_f2d260: "这是由卢明创造的梦境领域，与教皇共享。双胞胎的命运同时使这个梦境成为可能。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_duty_us_priests_ensure_s_1fce69: "确保教皇的安全是我们祭司的职责。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_even_so_make_me_very_eaa723: "即便如此，那也会……让我非常高兴。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_exit_appeared_east_direc_212643: "出口出现在东方。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_face_eyes_you_luwmin_4e2a5d: "这张脸……和眼睛。你是卢明吗？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fair_skin_white_hair_eye_b8cf52: "白皙的皮肤，白色的头发，不同颜色的眼睛。毫无疑问。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_first_all_forgive_me_giv_539cd0: "首先，请原谅我给你这个请求。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_first_she_started_go_bed_071f25: "起初，她开始晚上早睡，然后她开始早上起得很晚，现在她更频繁地上床睡觉。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_forever_2d77c3: "永远。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_forever_nobody_find_a8beee: "永远……没人会找到……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fortunate_60da11: "那很幸运。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fountain_same_as_i_imagi_06270c: "这个喷泉和我想象的一样。那棵树也是。还有……那个娃娃！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_freyja_s_reincarnated_su_0e371f: "这是芙蕾雅的旨意，在这样的容器中转世。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fun_i_never_want_forget_868400: "很有趣，我永远不会忘记。我很开心。尽管如此，这是一个快乐的梦，也可能是一个可怕的噩梦。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fun_meeting_you_guys_aft_e21c3b: "这么久之后见到你们真的很开心。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fuzzy_d04fe3: "模糊……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_girl_undoubtly_true_pope_3adc4b: "这个女孩无疑是真正的教皇。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_go_back_288584: "回去。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_go_back_where_you_belong_11abfb: "回到你属于的地方！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_go_back_where_you_belong_6bcb08: "回到你属于的地方。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_going_together_ec932b: "一起走。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_good_bye_160c87: "再见！！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_good_idea_30e5e3: "好主意！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_got_promise_e103ac: "……得到了承诺……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_guards_gone_we_need_hurr_55210b: "守卫走了。我们必须快点！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_guards_sieze_boy_c70b07: "守卫，抓住那个男孩！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_h_how_did_you_get_38472e: "你……怎么……出来的？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_halt_4d1bb4: "站住！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_halt_afc326: "站住！！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_halt_cdcf60: "站住！！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_halt_who_goes_there_0d2f46: "站住！谁在那里？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_he_looks_same_as_pope_0a9a4f: "他看起来和教皇一样。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_he_s_frozen_9aece1: "他被冻住了？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_he_white_hair_aafff8: "他有白色的头发……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_head_south_a9466f: "向南走……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hehe_let_s_go_23761a: "嘿嘿。走吧~。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hello_i_am_pathway_dream_85e5d6: "你好，我是通往梦境的通道。有什么可以帮你的吗？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hence_i_looked_into_cons_928519: "因此我查看了卢明的意识。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_here_f17d0b: "这里。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_here_owner_ice_cave_c586da: "这就是冰洞的主人。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hey_how_about_we_go_2b32f8: "嘿，我们接下来去拉的地方怎么样？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hide_seek_605cda: "或者玩捉迷藏？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_high_priest_your_enemes_9e31c2: "大祭司，你的敌人派了儿童刺客来伤害你！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_historical_moment_639393: "这是一个历史性的时刻！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hmmm_indeed_my_fortune_w_394340: "嗯，这确实是我的幸运，能见证这样的事件！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_home_our_new_pope_52095a: "这是我们新教皇的家。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_house_where_new_pope_661461: "这就是新教皇来自的房子……？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_house_where_new_pope_a8d428: "这就是新教皇……的房子？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_about_we_head_home_1d5862: "我们先回家怎么样？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_about_we_just_play_12f843: "我们明天玩捉迷藏怎么样？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_dare_you_5c3286: "你竟敢……！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_dare_you_interfere_e80bec: "你竟敢干涉这个……！"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_did_help_you_c20a00: "它怎么帮助你的？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_upsetting_must_havin_a80b83: "他们的领袖沉睡不醒……深深的沉睡，这一定让人多么不安。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_you_get_into_someone_99994b: "但是你怎么能进入别人的梦境呢？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_you_know_my_name_f14544: "你怎么知道我的……名字？这是芙蕾雅的旨意吗？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_your_dream_24bd12: "你的梦怎么样？"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_however_82ccaf: "然而……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_however_as_dream_i_know_8a2dc5: "然而，既然是梦，我不知道里面会有什么。没人知道教皇会展示什么，或者她会如何反应。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_however_even_if_situatio_cdef42: "然而，即使情况如此，即使冒险者认为我是个可靠的人，也请听我说完，无论你接受还是不接受这个请求，你必须绝对保密今天的对话。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_however_method_rather_un_5d96c5: "然而，那种方法由于被抓住的概率很高，所以不太可能。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_however_true_current_pop_50bb2b: "然而，现任教皇确实缺乏资质。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_huh_i_ll_waiting_you_d83615: "嗯？我会在那里等你。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_humans_carrying_fire_odi_2432a0: "携带奥丁之火的人类威胁我，让我把这个孩子冻在这里……"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_accompany_her_a0fff8: "我会陪伴她。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_always_wanted_my_broth_49ee9f: "我一直想和哥哥在一起。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_adventurer_03f0b4: "我是冒险者{0}。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_charge_741049: "我负责。"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_escorting_pope_c85235: "我在护送教皇。"
