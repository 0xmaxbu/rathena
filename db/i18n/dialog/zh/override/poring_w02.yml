Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_poring_w02_poring_war_after_you_lose_some_weig_0f3785: "- 等你减点肥再说。 -"
  npc_override_poring_w02_poring_war_agi_extra_effectaspd_whe_79c044: " AGI + 1，盗贼职业装备时额外效果 ASPD + 3%。"
  npc_override_poring_w02_poring_war_ah_i_got_you_side_00ddb0: "啊，我明白了！你是天使波利那一派的？！"
  npc_override_poring_w02_poring_war_ah_i_got_you_side_b12deb: "啊，我明白了！你是恶魔波利那一派的？！"
  npc_override_poring_w02_poring_war_all_war_badges_been_equi_e3c64c: "所有战争徽章都已装备完毕。"
  npc_override_poring_w02_poring_war_all_war_badges_equipped_8f8157: "所有战争徽章已装备。"
  npc_override_poring_w02_poring_war_also_means_battle_needs_5b543a: "这也意味着战斗需要总共10名成员。"
  npc_override_poring_w02_poring_war_also_s_totally_up_you_afc3bd: "另外，你想为哪一队而战完全由你决定~"
  npc_override_poring_w02_poring_war_amazing_ee5d85: "太棒了！"
  npc_override_poring_w02_poring_war_angeling_team_recruitmen_2fdbe5: "天使波利队招募完成。如果恶魔波利队招募在1分钟内未准备好，战斗将自动取消。"
  npc_override_poring_w02_poring_war_angeling_team_recruitmen_6f28e8: "天使波利队招募失败。战斗将很快取消。"
  npc_override_poring_w02_poring_war_anyway_human_you_want_jo_bda5fe: "总之，人类。你想加入我们的波利战争吗？"
  npc_override_poring_w02_poring_war_battle_been_canceled_sin_ef0a18: "由于并非所有队伍都已满员，战斗已被取消！！"
  npc_override_poring_w02_poring_war_battle_cancelled_if_memb_1050f8: "如果成员未在一分钟内招募完毕，战斗将被取消！！"
  npc_override_poring_w02_poring_war_battle_proud_porings_rin_3a3c55: "这场战斗是波利们的骄傲！Ring！加入天使波利队！！"
  npc_override_poring_w02_poring_war_booooo_boo_boooo_e9cee2: "Booooo~ Boo~ Boooo~"
  npc_override_poring_w02_poring_war_cancel_ebda43: "取消。"
  npc_override_poring_w02_poring_war_carefull_allow_enemy_tak_986008: "小心不要让敌人在这里夺走并装备你的战争徽章。"
  npc_override_poring_w02_poring_war_click_item_came_out_mout_846d5e: "Click~ 物品伴随着隆隆声从波利的嘴里掉了出来。"
  npc_override_poring_w02_poring_war_clock_ticking_make_up_yo_f1b345: "时间不等人。尽快下定决心并注册。"
  npc_override_poring_w02_poring_war_come_join_us_5166c0: "来吧！加入我们！"
  npc_override_poring_w02_poring_war_currently_you_re_carryin_73594b: "- 你当前携带了 -"
  npc_override_poring_w02_poring_war_d_e_v_i_l_8a5e29: "D,E,V,I,L,I,N,G! 恶魔波利队！快来加入我们！！"
  npc_override_poring_w02_poring_war_d_e_v_i_l_910da7: "D,E,V,I,L,I,N,G! 恶魔波利队！快来加入我们！"
  npc_override_poring_w02_poring_war_deviling_team_recruitmen_5c287c: "恶魔波利队招募完成。如果天使波利队招募在1分钟内未准备好，战斗将自动取消。"
  npc_override_poring_w02_poring_war_deviling_team_recruitmen_920353: "恶魔波利队招募失败。战斗将很快取消。"
  npc_override_poring_w02_poring_war_dex_extra_effct_atk_when_c6aeef: " DEX + 1，弓箭手职业装备时额外效果 ATK + 10。"
  npc_override_poring_w02_poring_war_diffeent_kinds_figures_s_e61db6: "将从7种不同的手办中随机选出1种。"
  npc_override_poring_w02_poring_war_don_t_forget_let_all_3c5de3: "别忘了让所有成员加入队伍。只有已注册队伍的成员才能参加战斗。"
  npc_override_poring_w02_poring_war_each_team_composed_peopl_6c46a0: "每队由5人组成。一旦集齐5名成员，战斗即开始。"
  npc_override_poring_w02_poring_war_each_team_should_try_kil_a4c0c3: "每队应尝试击杀对方基地的两只波利。击杀一只波利后，你有有限的时间去击杀另一只。否则，你击杀的那只会复活。"
  npc_override_poring_w02_poring_war_enough_coins_5715fa: "硬币不足。"
  npc_override_poring_w02_poring_war_even_so_thanks_coming_fi_40d8a0: "即便如此，感谢你为我们而战。请收下这枚波利硬币。"
  npc_override_poring_w02_poring_war_figures_except_novice_al_f46c92: "除初学者外的手办都是 ^4d4dff角色绑定物品^000000。"
  npc_override_poring_w02_poring_war_figures_st_job_class_cha_302006: "包含初学者在内的一转职业角色手办终于上架了！"
  npc_override_poring_w02_poring_war_finally_s_time_us_teach_b918ee: "终于，是时候给那些蠢猪一个教训了！！"
  npc_override_poring_w02_poring_war_first_lets_register_your_3159ee: "首先，让我们注册你的队伍名称，然后我们会检查成员。"
  npc_override_poring_w02_poring_war_first_make_sure_all_memb_dde891: "首先，确保所有成员都在你的队伍中。"
  npc_override_poring_w02_poring_war_gate_activated_36d6ec: "大门已激活。"
  npc_override_poring_w02_poring_war_get_out_now_leave_34cf23: "现在就出去！离开！！"
  npc_override_poring_w02_poring_war_good_time_ring_79d0f1: "玩得开心，ring。"
  npc_override_poring_w02_poring_war_good_work_085bd7: "干得好！"
  npc_override_poring_w02_poring_war_goodbye_my_human_friend_098f3c: "再见，我的人类朋友。"
  npc_override_poring_w02_poring_war_gotta_hide_hide_right_0847b2: "得躲起来，躲起来，对吧~！"
  npc_override_poring_w02_poring_war_greatest_battle_all_time_c6d128: "史上最伟大的战斗，恶魔波利队的招募结束了，ring！"
  npc_override_poring_w02_poring_war_haven_t_you_finished_par_56cb92: "你还没完成队伍注册吗？"
  npc_override_poring_w02_poring_war_hehehee_i_feel_kinda_shy_98afe4: "Hehehee，我现在有点害羞。"
  npc_override_poring_w02_poring_war_hey_hey_there_hu_humans_258358: "嘿..嘿，那边。呼..人类..."
  npc_override_poring_w02_poring_war_hey_human_don_t_you_bf2e8f: "嘿，人类。你不想为黑暗贵族恶魔波利而战吗？你觉得呢？！"
  npc_override_poring_w02_poring_war_hey_human_how_about_figh_d9d3bf: "嘿，人类。不如为我们波利，在天使波利那一侧作战？？！"
  npc_override_poring_w02_poring_war_hey_i_don_t_all_fb9934: "嘿，我可没那么多时间！尽快下定决心并注册。"
  npc_override_poring_w02_poring_war_hey_s_life_ring_we_6e1066: "嘿，这就是生活，ring。我们也需要zeny，你知道的~！"
  npc_override_poring_w02_poring_war_hmm_i_see_6d9115: "嗯，我明白了。"
  npc_override_poring_w02_poring_war_how_come_so_many_humans_940b86: "怎么会有这么多人类想加入我们的波利战争？"
  npc_override_poring_w02_poring_war_hp_extra_effect_hp_when_5d7637: " HP + 70，初学者装备时额外效果 HP + 30。"
  npc_override_poring_w02_poring_war_huhhhh_hu_humans_so_cold_f8570b: "Huhhhh！呼..人类真是冷酷无情！！！"
  npc_override_poring_w02_poring_war_hwak_9f2dc8: "Hwak!!"
  npc_override_poring_w02_poring_war_i_allow_you_return_your_a32603: "我允许你回到你的人类世界。"
  npc_override_poring_w02_poring_war_i_cant_give_you_anything_910e5c: "我什么都给不了你，因为我们输了，一切都..."
  npc_override_poring_w02_poring_war_i_i_ve_got_some_37b718: "我..我有一些有趣的工作给你..你有兴趣吗？"
  npc_override_poring_w02_poring_war_i_ll_check_again_after_49f443: "我会再次检查，在注册队伍名称后，你将被送往战场。"
  npc_override_poring_w02_poring_war_i_ll_send_you_back_e5700f: "我会送你回到你的存档点。"
  npc_override_poring_w02_poring_war_i_ll_send_you_battlefiel_24c59d: "一旦我确认你的队伍，我就会送你到战场。"
  npc_override_poring_w02_poring_war_i_ll_transfer_you_battle_bde5cf: "我会将你传送到战斗集结区。"
  npc_override_poring_w02_poring_war_i_never_forgive_you_b78ad7: "我永远不会原谅你！"
  npc_override_poring_w02_poring_war_i_see_empty_slots_equip_7201f0: "我能看到装备徽章的空位。"
  npc_override_poring_w02_poring_war_i_ts_shame_battle_tied_43719b: "战斗打平了，真是遗憾..."
  npc_override_poring_w02_poring_war_if_you_aren_t_registered_a0573e: "如果你不是已注册的队伍成员，你就不能参加战斗。"
  npc_override_poring_w02_poring_war_if_you_don_t_get_c776ec: "如果你不能及时到达，你就赶不上战斗了。"
  npc_override_poring_w02_poring_war_if_you_re_member_angelin_2d0dd5: "如果你是天使波利队的成员，你的目标是击杀对方基地的恶魔波利，反之亦然。"
  npc_override_poring_w02_poring_war_if_you_really_want_fight_443f2e: "如果你真的想参加战争或什么的..队伍招募员就在那边。"
  npc_override_poring_w02_poring_war_im_sorry_rules_rules_i_ecf89b: "抱歉，但规则就是规则。如果你的队伍没有注册，我帮不了你。"
  npc_override_poring_w02_poring_war_insert_poring_coin_pull_118e56: "投入波利硬币并拉动拉杆。"
  npc_override_poring_w02_poring_war_int_extra_effct_sp_when_76364b: " INT + 1，服事职业装备时额外效果 SP + 50。"
  npc_override_poring_w02_poring_war_int_extra_sp_recovery_in_77ab81: " INT + 1，魔法师职业装备时额外 SP 恢复增加 5%。"
  npc_override_poring_w02_poring_war_item_name_poring_coin_p_83ed1a: "物品名称 - 波利硬币(P.Co)"
  npc_override_poring_w02_poring_war_item_name_price_poring_c_0cd67f: "物品名称 - 价格波利硬币(P.Co)"
  npc_override_poring_w02_poring_war_join_proud_angeling_team_3339dc: "加入骄傲的天使波利队，带着天使翅膀！！"
  npc_override_poring_w02_poring_war_let_s_go_let_s_00abc0: "出发！战斗！胜利，胜利，胜利！！！"
  npc_override_poring_w02_poring_war_let_s_go_let_s_5d90c6: "出发！战斗！为凯旋而战！！！！"
  npc_override_poring_w02_poring_war_let_s_teach_them_lesson_419d91: "让我们给他们一个教训，ring！"
  npc_override_poring_w02_poring_war_lets_see_name_party_fb52e2: "让我看看...队伍的名称是..."
  npc_override_poring_w02_poring_war_marins_cheerfully_shouti_0f1f52: "- 玛琳们正在为胜利欢呼。 -"
  npc_override_poring_w02_poring_war_maybe_next_time_c71159: "...也许下次吧..."
  npc_override_poring_w02_poring_war_menu_alright_530904: "好的，我加入你！:那是什么？:无视"
  npc_override_poring_w02_poring_war_menu_am_2f8aaa: "我有资格加入吗？:如何参加战争？:取消:请让我离开这里！"
  npc_override_poring_w02_poring_war_menu_angeling_9e0380: "天使波利:我们没时间等那些愚蠢的恶魔波利！战斗取消了，ring！"
  npc_override_poring_w02_poring_war_menu_deviling_0ed886: "恶魔波利:你不能让我们永远等下去！！我们要取消战斗，ring！"
  npc_override_poring_w02_poring_war_menu_draw_6b2280: "平局:取消"
  npc_override_poring_w02_poring_war_menu_equip_f9f52a: "装备战争徽章。:取消。"
  npc_override_poring_w02_poring_war_menu_marvelous_5a0c6b: "奇妙勋章 - 4 P.Co:部落联盟 - 20 P.Co:波利礼盒 - 30 P.Co:下一页"
  npc_override_poring_w02_poring_war_menu_mr_020313: "多佩尔先生:每个队员必须加入队伍，队长将注册他们的队伍名称。"
  npc_override_poring_w02_poring_war_menu_mr_067ff8: "多佩尔先生:请允许我向勇敢为波利而战的人类赠送纪念品！请跟德维说话。"
  npc_override_poring_w02_poring_war_menu_mr_20f39d: "多佩尔先生:你有50秒。加入队伍，注册名称并前往战场。"
  npc_override_poring_w02_poring_war_menu_mr_216d41: "多佩尔先生:队伍 {0} 的恶魔波利队赢得了战斗！"
  npc_override_poring_w02_poring_war_menu_mr_2e1d3b: "多佩尔先生:欢迎所有前来参加战斗的勇士。"
  npc_override_poring_w02_poring_war_menu_mr_35faa4: "多佩尔先生:1号基地的恶魔波利已复活！获得1分！！"
  npc_override_poring_w02_poring_war_menu_mr_423793: "多佩尔先生:2号基地的天使波利已复活！获得1分！！"
  npc_override_poring_w02_poring_war_menu_mr_4ef683: "多佩尔先生:时间到。战斗前将简要说明规则。"
  npc_override_poring_w02_poring_war_menu_mr_57330e: "多佩尔先生:1号基地的天使波利被击杀！失去1分！！"
  npc_override_poring_w02_poring_war_menu_mr_5eaa73: "多佩尔先生:2号基地的恶魔波利被击杀！失去1分！！"
  npc_override_poring_w02_poring_war_menu_mr_7a87a5: "多佩尔先生:天使波利队必须保护他们基地上的2只天使波利，同时消灭恶魔波利队基地上的恶魔波利，反之亦然。"
  npc_override_poring_w02_poring_war_menu_mr_811a22: "多佩尔先生:还要知道那些波利很愤怒，会攻击所有人，无论他们属于哪个队伍。"
  npc_override_poring_w02_poring_war_menu_mr_8b0efd: "多佩尔先生:你还有30秒。加入队伍，注册名称并前往战场。"
  npc_override_poring_w02_poring_war_menu_mr_9c00c8: "多佩尔先生:基本上，波利是人类的天然敌人，所以攻击是不可避免的，即使双方在同一队。"
  npc_override_poring_w02_poring_war_menu_mr_a6c8fe: "多佩尔先生:如果你们消灭了敌方队伍的2只怪物，你们的队伍就获胜。规则就这么简单。"
  npc_override_poring_w02_poring_war_menu_mr_b25ea0: "多佩尔先生:都准备好了吗？让我来说明战斗规则。"
  npc_override_poring_w02_poring_war_menu_mr_c6e6eb: "多佩尔先生:时间到！让我传送你们。"
  npc_override_poring_w02_poring_war_menu_mr_db6cf8: "多佩尔先生:在某些区域，你需要通过消灭对方队伍成员获得的战争徽章。好了，开始吧！"
  npc_override_poring_w02_poring_war_menu_mr_db900c: "多佩尔先生:2号基地的天使波利被击杀！失去1分！！"
  npc_override_poring_w02_poring_war_menu_mr_e1fa80: "多佩尔先生:2号基地的恶魔波利已复活！获得1分！！"
  npc_override_poring_w02_poring_war_menu_mr_e6dabf: "多佩尔先生:1号基地的天使波利已复活！获得1分！！"
  npc_override_poring_w02_poring_war_menu_mr_e7bf5d: "多佩尔先生:队伍 {0} 的天使波利队赢得了战斗！"
  npc_override_poring_w02_poring_war_menu_mr_eee89f: "多佩尔先生:但是天使波利或恶魔波利会在一段时间后复活，所以在消灭第一只后，尽快消灭另一只很重要。"
  npc_override_poring_w02_poring_war_menu_mr_ef3a0f: "多佩尔先生:时间到。很快，你们将被传送到胜者舞台。"
  npc_override_poring_w02_poring_war_menu_mr_f1b090: "多佩尔先生:1号基地的恶魔波利被击杀！失去1分！！"
  npc_override_poring_w02_poring_war_menu_no_5d9ac0: "不！等等！:前往集结区。"
  npc_override_poring_w02_poring_war_menu_no_7678a8: "不！你错了。:是的。我想注册那个名称。:取消"
  npc_override_poring_w02_poring_war_menu_novice_cafb83: "初学者手办 - 50 P.Co:剑士手办 - 100 P.Co:盗贼手办 - 100 P.Co:商人手办 - 100 P.Co:服事手办 - 100 P.Co:魔法师手办 - 100 P.Co:弓箭手手办 - 100 P.Co:随机抽取 - 50 P.Co:取消"
  npc_override_poring_w02_poring_war_menu_options_0269db: " :一座象征着部落强大联盟的雕像。人们相信观看这座雕像确实有助于加强部落之间的关系。"
  npc_override_poring_w02_poring_war_menu_options_0c0dc5: " :一枚由修葛拉特产的特殊金属制成的勋章。"
  npc_override_poring_w02_poring_war_menu_options_1d23f0: " :一个不错的剑士手办。可以作为'^4d4dff饰品^000000'装备。"
  npc_override_poring_w02_poring_war_menu_options_2de03b: " :一个精美的盗贼手办。可以作为'^4d4dff饰品^000000'装备。"
  npc_override_poring_w02_poring_war_menu_options_51e4a6: " :年轻的贵族，死灵会来帮助你。"
  npc_override_poring_w02_poring_war_menu_options_556a38: " :你的朋友野玫瑰会来帮助你。"
  npc_override_poring_w02_poring_war_menu_options_6c7403: " :一个精美的商人手办。可以作为'^4d4dff饰品^000000'装备。"
  npc_override_poring_w02_poring_war_menu_options_92c31b: " :一个精美的服事手办。可以作为'^4d4dff饰品^000000'装备。"
  npc_override_poring_w02_poring_war_menu_options_953b62: " :一个精美的魔法师手办。可以作为'^4d4dff饰品^000000'装备。"
  npc_override_poring_w02_poring_war_menu_options_af061a: " :一个精美的初学者手办。可以作为'^4d4dff饰品^000000'装备。"
