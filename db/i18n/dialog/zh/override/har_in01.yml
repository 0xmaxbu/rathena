Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_har_in01_enchan_rockridge_accessory_right_slot_d08e7c: "饰品（右槽）"
  npc_override_har_in01_enchan_rockridge_ah_didn_t_turn_out_94ded0: "啊，结果不太理想。"
  npc_override_har_in01_enchan_rockridge_ah_we_met_before_i_541c71: "啊，我们之前见过吗？我每天见太多人了，记不住所有人的脸。让我给你快速说明一下。"
  npc_override_har_in01_enchan_rockridge_ah_you_coins_adbbbe: "啊，你有硬币。"
  npc_override_har_in01_enchan_rockridge_ah_you_re_interested_027c48: "啊，你对"
  npc_override_har_in01_enchan_rockridge_all_equipment_zeny_regar_6c76dd: "所有装备一律^0000CD1,500,000 Zeny^000000，不分类型。"
  npc_override_har_in01_enchan_rockridge_all_equipment_zeny_regar_771764: "所有装备一律^0000CD3,000,000 Zeny^000000，不分类型。"
  npc_override_har_in01_enchan_rockridge_all_my_bullets_finest_qu_d21f93: "我所有的子弹都是最优质的。"
  npc_override_har_in01_enchan_rockridge_all_my_products_hard_fin_20394a: "但是^0000CD我所有的产品都是别处很难找到^000000的。为什么不看看呢？"
  npc_override_har_in01_enchan_rockridge_alright_come_back_if_you_3c4bd6: "好吧，如果你改变主意就回来。"
  npc_override_har_in01_enchan_rockridge_armor_b1fc5d: "盔甲"
  npc_override_har_in01_enchan_rockridge_armor_bulkier_than_weapo_e0e1a4: "防具比武器笨重，所以我每周只能让固定数量的产品到货。"
  npc_override_har_in01_enchan_rockridge_armor_dealer_brings_new_791379: "防具商人每周五会进新货，而且每次一到货就几乎卖光了。"
  npc_override_har_in01_enchan_rockridge_as_i_told_you_s_f97c54: "正如我告诉你的，是^0000CD{0} Zeny^000000。你想买吗？"
  npc_override_har_in01_enchan_rockridge_because_what_413bac: "因为什么？"
  npc_override_har_in01_enchan_rockridge_been_enchanted_maximum_l_18808e: "这已经附魔到最高上限了。也许你应该重置它。"
  npc_override_har_in01_enchan_rockridge_bullets_7509c5: "子弹"
  npc_override_har_in01_enchan_rockridge_cancel_77dfd2: "取消"
  npc_override_har_in01_enchan_rockridge_cancel_ebda43: "取消。"
  npc_override_har_in01_enchan_rockridge_chuckle_sure_young_peopl_1fa4b4: "*轻笑* 当然，年轻人穿什么都好看。"
  npc_override_har_in01_enchan_rockridge_click_name_detailed_desc_c2e044: "点击名称查看详细描述。"
  npc_override_har_in01_enchan_rockridge_come_again_9c3015: "欢迎再来。"
  npc_override_har_in01_enchan_rockridge_come_back_if_you_want_e6accd: "如果你想要更多装备就回来。我会一直在这里。*轻笑*"
  npc_override_har_in01_enchan_rockridge_did_you_just_try_switch_e0f9e9: "你刚才想切换装备吗？"
  npc_override_har_in01_enchan_rockridge_done_check_out_211e96: "完成了。看看吧。"
  npc_override_har_in01_enchan_rockridge_each_every_piece_equipme_c98681: "每一件装备都有它的故事，如果你不带走它，它可能会怨恨你。"
  npc_override_har_in01_enchan_rockridge_elemental_cape_048615: "元素斗篷"
  npc_override_har_in01_enchan_rockridge_enchant_contraband_items_c733e0: "附魔违禁品。"
  npc_override_har_in01_enchan_rockridge_err_you_re_carrying_lot_51cc46: "呃，你带了很多东西。"
  npc_override_har_in01_enchan_rockridge_garment_cd2d27: "披风"
  npc_override_har_in01_enchan_rockridge_golden_scarf_6e7558: "金色围巾"
  npc_override_har_in01_enchan_rockridge_hello_how_may_i_help_7c4b97: "你好。今天有什么可以帮你的吗？"
  npc_override_har_in01_enchan_rockridge_hello_welcome_rock_ridge_8d2070: "你好。欢迎来到岩脊防具店。"
  npc_override_har_in01_enchan_rockridge_hippie_feather_17c0c5: "嬉皮羽毛"
  npc_override_har_in01_enchan_rockridge_hm_you_don_t_coins_c7b744: "嗯，你没有硬币。"
  npc_override_har_in01_enchan_rockridge_hmpf_don_t_act_like_bcb8a8: "哼，别装不知道。我说的是你可以在岩脊买到的特殊装备。"
  npc_override_har_in01_enchan_rockridge_huh_so_i_wasted_my_ea292e: "哼。所以我在一个不想买东西的人身上浪费了口舌。"
  npc_override_har_in01_enchan_rockridge_i_am_5bf3c4: "我是。"
  npc_override_har_in01_enchan_rockridge_i_carry_shotguns_revolve_87c6bc: "我经营霰弹枪、左轮手枪和子弹。"
  npc_override_har_in01_enchan_rockridge_i_charge_rock_ridge_coin_21375d: "这项服务我收2个岩脊硬币。把它们带给我。"
  npc_override_har_in01_enchan_rockridge_i_charge_rock_ridge_coin_743dce: "附魔和重置每个插槽我都收2个岩脊硬币。"
  npc_override_har_in01_enchan_rockridge_i_don_t_handle_items_e9e748: "我不处理这种道具。"
  npc_override_har_in01_enchan_rockridge_i_enchant_equipment_you_bbf69b: "我可以为岩脊硬币购买的装备附魔，防具和披风最多3个插槽，饰品最多2个插槽。"
  npc_override_har_in01_enchan_rockridge_i_ll_come_back_later_19e43d: "我稍后再来。"
  npc_override_har_in01_enchan_rockridge_i_ll_show_you_list_244f61: "我给你看看可用道具列表。^0000CD如果是空白的，说明全部卖完了^000000。"
  npc_override_har_in01_enchan_rockridge_i_m_carrying_too_many_468846: "我携带的道具种类太多了。我应该先减轻背包。"
  npc_override_har_in01_enchan_rockridge_i_m_closed_today_e3dca0: "我今天关门了。"
  npc_override_har_in01_enchan_rockridge_i_m_overweight_i_d_50e3b6: "我超重了。我最好先把背包减轻。"
  npc_override_har_in01_enchan_rockridge_i_no_idea_what_you_fd6bf5: "我不知道你在说什么。"
  npc_override_har_in01_enchan_rockridge_i_suggest_you_don_t_9f4ceb: "我建议你不要告诉其他人这件事，"
  npc_override_har_in01_enchan_rockridge_i_ve_just_brought_few_630976: "我刚进了几款好型号。"
  npc_override_har_in01_enchan_rockridge_if_you_made_up_your_01b6e7: "如果你已经决定了，请再跟我谈谈。"
  npc_override_har_in01_enchan_rockridge_if_you_want_lighten_your_1204d3: "如果你想减轻背包，治安官办公室方向有一位卡普拉服务人员。"
  npc_override_har_in01_enchan_rockridge_if_you_want_something_sp_26b6f3: "但如果你想找些特别的东西，去防具店看看。"
  npc_override_har_in01_enchan_rockridge_let_me_show_you_some_54f254: "让我给你看几款好型号。"
  npc_override_har_in01_enchan_rockridge_let_s_788324: "我们开始吧。"
  npc_override_har_in01_enchan_rockridge_lighten_your_bag_first_26c929: "先减轻你的背包？"
  npc_override_har_in01_enchan_rockridge_ll_rock_ridge_coins_c02ca1: "那是{0}个岩脊硬币。"
  npc_override_har_in01_enchan_rockridge_make_them_better_how_7a4c0e: "让它们更好？怎么做？"
  npc_override_har_in01_enchan_rockridge_menu_chuckle_6118d0: "*轻笑* 你想要哪个:^0000CD肩部^000000、^0000CD颈部还是胸部^000000的？"
  npc_override_har_in01_enchan_rockridge_mine_worker_backpack_f3c0c5: "矿工背包"
  npc_override_har_in01_enchan_rockridge_msg_6dd69d: "[{0}]。"
  npc_override_har_in01_enchan_rockridge_my_neck_chest_33f4af: "颈部或胸部"
  npc_override_har_in01_enchan_rockridge_my_shoulders_174196: "肩部"
  npc_override_har_in01_enchan_rockridge_no_b8b9f1: "不。"
  npc_override_har_in01_enchan_rockridge_oh_note_these_contraband_de1629: "哦，注意这些违禁品容易损坏，尤其是重置时。"
  npc_override_har_in01_enchan_rockridge_oh_you_really_want_reset_c255cc: "哦，你真的想重置吗？正如我之前告诉你的，违禁的治安官徽章容易损坏。"
  npc_override_har_in01_enchan_rockridge_once_week_i_close_my_9492ff: "每周有一天，我会关店休息，感恩我所拥有的一切。"
  npc_override_har_in01_enchan_rockridge_oops_i_guess_you_re_38d395: "哎呀，我猜你太天真了，不适合听我刚说的话。"
  npc_override_har_in01_enchan_rockridge_people_often_let_their_p_e61a03: "人们常常被自己的先入之见蒙蔽。大多数人不会想到像我这样的老妇人会卖这种特殊道具。"
  npc_override_har_in01_enchan_rockridge_pick_one_you_like_i_73cf83: "挑一个你喜欢的，我给你介绍。"
  npc_override_har_in01_enchan_rockridge_please_bring_more_ac9bca: "请多带一些。"
  npc_override_har_in01_enchan_rockridge_please_go_lighten_your_b_33dfc5: "请先去减轻你的背包。"
  npc_override_har_in01_enchan_rockridge_promise_me_you_ll_back_ce4019: "答应我你会回来的。我会为你保留这些装备。"
  npc_override_har_in01_enchan_rockridge_reset_contraband_item_en_94e849: "重置违禁品附魔等级。"
  npc_override_har_in01_enchan_rockridge_revolvers_6c545e: "左轮手枪"
  npc_override_har_in01_enchan_rockridge_s_enchanted_what_you_exp_03eea4: "它没有附魔。你想让我重置什么？"
  npc_override_har_in01_enchan_rockridge_s_same_day_no_deliveries_8ed7c5: "……而且正好那天没有送货。"
  npc_override_har_in01_enchan_rockridge_same_reason_i_t_give_dcaa7a: "出于同样的原因，我不能给你^0000CD特别折扣^000000。"
  npc_override_har_in01_enchan_rockridge_sell_items_da520e: "出售物品。"
  npc_override_har_in01_enchan_rockridge_shotguns_981c5e: "霰弹枪"
  npc_override_har_in01_enchan_rockridge_show_me_what_you_ve_6b8592: "给我看看你有哪些。"
  npc_override_har_in01_enchan_rockridge_so_you_here_because_67841d: "那么，你是因为^0000CD它^000000才来的吗？"
  npc_override_har_in01_enchan_rockridge_something_wrong_happened_801756: "出错了。"
  npc_override_har_in01_enchan_rockridge_sure_here_s_your_fa1843: "当然。这是你的{0}。"
  npc_override_har_in01_enchan_rockridge_sure_if_you_things_i_1da900: "当然，如果你有我可以卖的东西。"
  npc_override_har_in01_enchan_rockridge_take_look_around_see_if_347536: "四处看看，有没有你想要的东西。"
  npc_override_har_in01_enchan_rockridge_tell_me_what_kind_item_c4101d: "告诉我你想要什么类型的道具，我给你看列表。"
  npc_override_har_in01_enchan_rockridge_thank_you_helping_rock_r_a6f866: "感谢你帮助岩脊。"
  npc_override_har_in01_enchan_rockridge_there_you_go_enjoy_6a921b: "给你。享受吧！"
  npc_override_har_in01_enchan_rockridge_today_stock_c48539: "今天，{0}有货。"
  npc_override_har_in01_enchan_rockridge_uh_oh_you_don_t_4fa6db: "哎呀，你没有足够的钱买这个。"
  npc_override_har_in01_enchan_rockridge_um_anything_3701b2: "嗯，随便什么。"
  npc_override_har_in01_enchan_rockridge_vigilante_badge_bd38e8: "治安官徽章"
  npc_override_har_in01_enchan_rockridge_well_just_my_luck_6a369f: "唉，算我倒霉。"
  npc_override_har_in01_enchan_rockridge_what_you_like_6df180: "你想要什么？"
  npc_override_har_in01_enchan_rockridge_why_don_t_you_collect_62cd0b: "你为什么不先收集它们？"
  npc_override_har_in01_enchan_rockridge_why_don_t_you_come_00c775: "你为什么不晚点再来？我会一直在这里。"
  npc_override_har_in01_enchan_rockridge_why_don_t_you_go_e5771c: "你为什么不"
  npc_override_har_in01_enchan_rockridge_why_you_wasting_my_time_295585: "你为什么浪费我的时间？先去穿上你的装备。"
  npc_override_har_in01_enchan_rockridge_yes_c53c56: "是。"
  npc_override_har_in01_enchan_rockridge_you_certain_you_want_ite_b8e7f0: "你确定想要这个道具吗？"
  npc_override_har_in01_enchan_rockridge_you_don_t_enough_coins_c68021: "你的硬币不够。"
  npc_override_har_in01_enchan_rockridge_you_must_really_strong_c_47b76f: "你能带这么多东西，一定很强。"
  npc_override_har_in01_enchan_rockridge_you_re_adventurer_i_like_5d4e8a: "你是冒险者。我喜欢你这样有热情的人。"
  npc_override_har_in01_enchan_rockridge_you_re_carrying_too_much_a3ebb9: "你带的东西太多了，没法买任何东西。"
  npc_override_har_in01_enchan_rockridge_you_re_carrying_too_much_a4ef02: "你带的东西太多了，没法买武器。"
  npc_override_har_in01_enchan_rockridge_you_re_silly_1ae11f: "你真傻。"
  npc_override_har_in01_enchan_rockridge_you_should_forget_your_o_9a4ca6: "为了你自己好，你应该忘掉它。"
  npc_override_har_in01_enchan_rockridge_you_tried_buy_some_contr_505f7f: "你试过用岩脊硬币买一些违禁品吗？我可以让你的违禁品变得更好。"
  npc_override_har_in01_enchan_rockridge_you_want_browse_revolver_f98b5f: "你想浏览左轮手枪？我明白了。"
  npc_override_har_in01_enchan_rockridge_you_want_browse_shotguns_ad8ac4: "你想浏览霰弹枪？我明白了。"
  npc_override_har_in01_enchan_rockridge_you_want_bullets_i_see_0dd394: "你想要子弹，我明白了。"
