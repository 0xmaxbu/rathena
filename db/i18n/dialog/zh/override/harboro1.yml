Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_harboro1_guides_rockridge_also_you_use_navigation_e50524: "另外，你可以通过^B9062F点击我指给你的地点名称^000000来使用^B9062F导航^000000模式。"
  npc_override_harboro1_guides_rockridge_click_name_activate_navi_000b7e: "点击名称即可激活导航模式。"
  npc_override_harboro1_guides_rockridge_did_you_need_anything_el_63f632: "你还需要别的什么吗？"
  npc_override_harboro1_guides_rockridge_enjoy_your_stay_rock_rid_e1971e: "祝你在岩脊镇过得愉快！"
  npc_override_harboro1_guides_rockridge_i_m_sheriff_s_assistant_1d4390: "我是警长的助手，负责为游客指路。你想去什么地方？"
  npc_override_harboro1_guides_rockridge_i_ve_marked_location_nav_5c27a4: "我已经在你的小地图上标记了<NAVI>工具店<INFO>harboro1,312,193,0,000,0</INFO></NAVI>的位置。"
  npc_override_harboro1_guides_rockridge_i_ve_marked_location_nav_a9f21b: "我已经在你的小地图上标记了<NAVI>旅馆<INFO>harboro1,156,215,0,000,0</INFO></NAVI>的位置。"
  npc_override_harboro1_guides_rockridge_i_ve_marked_location_nav_ae1395: "我已经在你的小地图上标记了<NAVI>警长办公室<INFO>harboro1,241,218,0,000,0</INFO></NAVI>的位置。"
  npc_override_harboro1_guides_rockridge_i_ve_marked_location_nav_c55b61: "我已经在你的小地图上标记了<NAVI>武器/防具店<INFO>harboro1,312,193,0,000,0</INFO></NAVI>的位置。"
  npc_override_harboro1_guides_rockridge_kafra_employee_got_pleas_a77b74: "^006400卡普拉服务人员^000000，明白了。请点击你小地图上的^0000FF箱子图标^000000。"
  npc_override_harboro1_guides_rockridge_let_me_remove_all_marks_862cc3: "让我移除你小地图上所有的标记。"
  npc_override_harboro1_guides_rockridge_tell_me_where_you_want_764bb6: "告诉我你想去哪里，我给你指路。"
  npc_override_harboro1_guides_rockridge_there_anywhere_else_you_edac6a: "还有别的地方你想去看看吗？"
  npc_override_harboro1_guides_rockridge_welcome_rock_ridge_hot_d_454ee4: "欢迎来到岩脊镇，西部炎热干燥的沙漠之地，冒险正等着你！"
  npc_override_harboro1_quests_rockridge_about_what_you_get_i_5897e0: "关于你能得到什么，我明白了。"
  npc_override_harboro1_quests_rockridge_according_letter_bandit_fcb008: "但根据那封信，匪帮头目^4d4dff约翰尼·詹姆斯^000000想和我们这边的人一对一谈谈。"
  npc_override_harboro1_quests_rockridge_ack_even_agave_8a1bfd: "哎呀，这里面真的有龙舌兰吗？"
  npc_override_harboro1_quests_rockridge_actual_development_rock_34801d: "岩脊镇的实际开发是在火车系统最终引入之后才开始的。"
  npc_override_harboro1_quests_rockridge_actually_672c01: "其实……"
  npc_override_harboro1_quests_rockridge_actually_they_used_two_s_770796: "其实，在地下室建成之前，它们曾经是两层楼的。房主们一定怀念有两层楼的日子。"
  npc_override_harboro1_quests_rockridge_adventurer_all_way_here_cb5ad2: "冒险者？大老远跑到岩脊镇来？"
  npc_override_harboro1_quests_rockridge_adventurer_cold_heart_773652: "冒险者的心真冷！"
  npc_override_harboro1_quests_rockridge_adventurer_get_purple_or_cb7678: "冒险者，去弄^4d4dff1个紫色矿石^000000来。"
  npc_override_harboro1_quests_rockridge_adventurer_i_ve_been_wai_444db4: "冒险者，我一直在等你！你是来为点点向野牛匪帮报仇的，对吧？"
  npc_override_harboro1_quests_rockridge_adventurer_thank_you_che_6b602a: "冒险者，谢谢你帮我检查了那个危险区域，找我妻子的金戒指。"
  npc_override_harboro1_quests_rockridge_adventurer_thank_you_com_072b1f: "冒险者，谢谢你回来。我们已经检查了点点在村子里挖的所有洞，但都没找到我们要找的东西。它一定是带到荒原去了。"
  npc_override_harboro1_quests_rockridge_adventurer_we_ve_found_r_b38200: "冒险者，我们找到戒指了！"
  npc_override_harboro1_quests_rockridge_adventurer_where_did_you_b77f53: "冒险者，你把那块又大又漂亮的矿石放哪儿了？你弄丢了吗？"
  npc_override_harboro1_quests_rockridge_adventurer_who_took_care_b5bfed: "就是那个收拾了野牛匪帮的冒险者！"
  npc_override_harboro1_quests_rockridge_adventurers_like_you_roc_fb3ec8: "为了像你这样的冒险者，也为了岩脊镇。"
  npc_override_harboro1_quests_rockridge_after_all_time_we_spent_fd40d9: "我们在村子里找了那么久，最后在他家里找到了。"
  npc_override_harboro1_quests_rockridge_agave_drink_mix_012754: "龙舌兰饮料粉？"
  npc_override_harboro1_quests_rockridge_agave_drink_mix_comes_se_88680f: "^0000CD龙舌兰饮料粉^000000是7包一套的。我整套都丢了，不指望你能找到完整的一套。能找到^0000CD5包^000000我就很高兴了。"
  npc_override_harboro1_quests_rockridge_agave_flavored_juice_did_1e352e: "这是龙舌兰口味的果汁吗？你是帮我找到龙舌兰口味果汁的吗？耶！莱克特现在就想喝！"
  npc_override_harboro1_quests_rockridge_agave_juice_you_mean_my_695b23: "龙舌兰果汁？你是说我最喜欢的龙舌兰口味果汁？"
  npc_override_harboro1_quests_rockridge_ah_adventurer_let_s_keep_860027: "啊，冒险者。这件事就天知地知你知我知，好吗？"
  npc_override_harboro1_quests_rockridge_ah_adventurer_welcome_ba_95d19a: "啊，冒险者，欢迎回来。"
  npc_override_harboro1_quests_rockridge_ah_adventurer_you_like_b_6522e9: "啊，冒险者。你想买点纪念品吗？"
  npc_override_harboro1_quests_rockridge_ah_come_don_t_like_31a930: "啊，别这样嘛。帮帮这个可怜的人吧。"
  npc_override_harboro1_quests_rockridge_ah_course_albert_ran_s_68deb6: "啊，当然，阿尔伯特跑了。这样他就能带他的朋友一起来了。"
  npc_override_harboro1_quests_rockridge_ah_fool_johnny_550680: "啊，去骗约翰尼！"
  npc_override_harboro1_quests_rockridge_ah_guys_please_calm_down_6ba567: "啊，各位，请冷静一下。"
  npc_override_harboro1_quests_rockridge_ah_i_m_busy_i_3d551f: "啊，我很忙，不过我不介意更忙一点！"
  npc_override_harboro1_quests_rockridge_ah_i_should_ve_known_c70296: "啊，我早该知道的。"
  npc_override_harboro1_quests_rockridge_ah_i_t_move_i_9d79d4: "啊，我动不了。我浑身都疼。"
  npc_override_harboro1_quests_rockridge_ah_i_ve_talked_too_232c75: "啊，我说太多了。抱歉占用了你的时间，冒险者。"
  npc_override_harboro1_quests_rockridge_ah_i_want_beat_drum_7e2b3c: "啊，我想敲这面鼓！我很想听听它的声音！"
  npc_override_harboro1_quests_rockridge_ah_kiddo_speaking_which_cb6898: "啊，小鬼，说到这个，你能去消灭一些气态怪吗？这样我们后面布置炸弹会方便些。"
  npc_override_harboro1_quests_rockridge_ah_price_adventurers_onl_20e5d1: "啊，那个价格只给冒险者。"
  npc_override_harboro1_quests_rockridge_ah_s_brother_maurice_32a339: "啊，就是这样，莫里斯兄弟！"
  npc_override_harboro1_quests_rockridge_ah_s_you_213c50: "啊，是你啊。"
  npc_override_harboro1_quests_rockridge_ah_sheriff_s_here_who_b0f2ad: "啊，警长来了。你旁边那位是谁？我告诉过你我想和镇长谈谈。"
  npc_override_harboro1_quests_rockridge_ah_shop_closed_sanders_o_0e3e9e: "啊，店关门了。店主桑德斯拿着枪去沙漠里亲自猎杀野牛匪帮了。然后摔了一跤，伤了背。"
  npc_override_harboro1_quests_rockridge_ah_so_he_told_you_be1075: "啊，所以他跟你说了匪帮的事。"
  npc_override_harboro1_quests_rockridge_ah_so_you_re_as_f378b3: "啊，看来你也没我想的那么势利。"
  npc_override_harboro1_quests_rockridge_ah_stranger_you_came_hel_b7b93e: "啊，陌生人！你又来帮忙了，对吧？"
  npc_override_harboro1_quests_rockridge_ah_welcome_back_b8caf2: "啊，欢迎回来！"
  npc_override_harboro1_quests_rockridge_ah_what_s_taking_karam_d9850d: "……啊，卡拉姆怎么这么久？我昨天就需要人手了！"
  npc_override_harboro1_quests_rockridge_ah_yes_sheriff_s_office_cd6cce: "啊，是的，这里是警长办公室。你问我是不是要排队？"
  npc_override_harboro1_quests_rockridge_ah_you_adventurer_please_69cd4d: "啊，你是冒险者吗？请帮我阻止那个疯子！"
  npc_override_harboro1_quests_rockridge_ah_you_d_better_show_9f188c: "啊，你最好对我们未来的镇长放尊重一点。"
  npc_override_harboro1_quests_rockridge_ah_you_must_forgotten_ab_4a2d44: "啊，你一定是忘了你的报酬。请先去^FF0000整理一下你的背包^000000。"
  npc_override_harboro1_quests_rockridge_ah_you_point_s_more_a63490: "啊，你说得有道理。而且那样更合理，不是吗？"
  npc_override_harboro1_quests_rockridge_ah_you_re_adventurer_who_5c0540: "啊，你就是刚来到这片土地的冒险者。哈哈，别那么惊讶。我知道是因为……"
  npc_override_harboro1_quests_rockridge_ah_you_re_back_c1ae73: "啊，你回来了。"
  npc_override_harboro1_quests_rockridge_ahem_yes_him_14c392: "*咳咳* 是的，就是他。"
  npc_override_harboro1_quests_rockridge_akuha_nahari_oh_gosh_whe_7aff05: "阿库哈！纳哈里！天哪，她们去哪儿了？"
  npc_override_harboro1_quests_rockridge_akuha_nahari_where_they_530043: "阿库哈！纳哈里！她们去哪儿了？"
  npc_override_harboro1_quests_rockridge_albert_15e2ae: "阿尔伯特！"
  npc_override_harboro1_quests_rockridge_albert_ford_hit_roof_if_f2fc12: "^4d4dff阿尔伯特·福特^000000看到这一幕会气炸的。"
  npc_override_harboro1_quests_rockridge_albert_new_leader_your_g_1b17e3: "阿尔伯特现在是你帮派的新老大了。"
  npc_override_harboro1_quests_rockridge_albert_ran_once_already_97db0b: "阿尔伯特已经跑过一次了。"
  npc_override_harboro1_quests_rockridge_albert_s_mane_74b8d7: "阿尔伯特的鬃毛？"
  npc_override_harboro1_quests_rockridge_albert_s_spy_been_going_2400c2: "阿尔伯特的间谍一直在地下室进进出出。"
  npc_override_harboro1_quests_rockridge_albert_stop_looking_some_28abc1: "阿尔伯特，别光看着，做点什么！"
  npc_override_harboro1_quests_rockridge_albert_wants_us_pay_him_ca9f15: "阿尔伯特要我们付钱买他的矿石。"
  npc_override_harboro1_quests_rockridge_albert_you_re_no_use_b2fda0: "阿尔伯特，你对我们已经没用了，但我暂时不追究你。暂时。"
  npc_override_harboro1_quests_rockridge_all_buildings_smell_like_1778a3: "所有建筑都散发着新油漆的味道，走到哪里都能听到锤子的声音。这个村子充满活力！"
  npc_override_harboro1_quests_rockridge_all_i_just_wait_cdcfa9: "我要做的只是等待。"
  npc_override_harboro1_quests_rockridge_all_i_want_sneeze_ccd022: "而我只想打喷嚏……"
  npc_override_harboro1_quests_rockridge_all_right_104f98: "好吧！"
  npc_override_harboro1_quests_rockridge_all_them_00e75f: "全部。"
  npc_override_harboro1_quests_rockridge_all_time_you_ve_been_cbbdde: "原来你一直在耍我们！"
  npc_override_harboro1_quests_rockridge_all_times_81d673: "任何时候，"
  npc_override_harboro1_quests_rockridge_all_you_ac7fbd: "你要做的就是"
  npc_override_harboro1_quests_rockridge_alright_come_back_if_you_2fcd18: "好吧，但如果你改变主意了，再回来找我。"
  npc_override_harboro1_quests_rockridge_alright_go_talk_johnny_o_b1e5d2: "好吧，再去和约翰尼谈最后一次。"
  npc_override_harboro1_quests_rockridge_alright_go_your_way_bf6b5f: "好吧，你走吧。"
  npc_override_harboro1_quests_rockridge_alright_i_ll_tell_you_82d143: "好吧，我告诉你矿石在哪里。"
  npc_override_harboro1_quests_rockridge_alright_let_me_hear_f8fff5: "好吧，让我听听。"
  npc_override_harboro1_quests_rockridge_alright_let_me_rephrase_01fcc0: "好吧，让我重新说一遍。"
  npc_override_harboro1_quests_rockridge_alright_let_s_go_back_7cd3d8: "好吧，我们回去吧。"
  npc_override_harboro1_quests_rockridge_alright_makes_sense_64d243: "好吧，这说得通。"
  npc_override_harboro1_quests_rockridge_alright_should_you_know_218f9a: "好吧，这应该够了。你知道我需要什么，对吧？你确定你能潜进去吗？也许我应该去。"
  npc_override_harboro1_quests_rockridge_alright_take_your_time_8bc792: "好吧，慢慢来。"
  npc_override_harboro1_quests_rockridge_alright_then_go_meet_alb_babad0: "好吧，那就去见阿尔伯特吧。"
  npc_override_harboro1_quests_rockridge_alright_then_go_talk_him_fb2884: "好吧，那就去和他谈谈。"
  npc_override_harboro1_quests_rockridge_alright_then_i_ll_let_c35e1f: "好吧，那让肖恩来处理这件事。"
  npc_override_harboro1_quests_rockridge_alright_then_let_s_i_41bfa2: "好吧，那我们开始吧。我把需要的东西都记下来。你能从米德加尔特带过来吗？"
  npc_override_harboro1_quests_rockridge_alright_up_we_go_348bdd: "好吧，我们上去！"
  npc_override_harboro1_quests_rockridge_alright_we_re_going_worr_053ba4: "……好吧，我们不再担心那个叛徒了。"
  npc_override_harboro1_quests_rockridge_alright_what_i_you_8cde89: "- 好吧，我能为你做些什么？"
  npc_override_harboro1_quests_rockridge_also_mine_doesn_t_c602a1: "这也和矿有关，不是吗？"
  npc_override_harboro1_quests_rockridge_am_i_going_die_here_ac36d7: "我会死在这里吗？"
  npc_override_harboro1_quests_rockridge_and_efa20a: "和{0}。"
  npc_override_harboro1_quests_rockridge_anyway_desalination_syst_4d3e2c: "总之，海水淡化系统本身运转良好，但构成系统的管道网容易腐蚀和断裂。它们需要不断维护。"
  npc_override_harboro1_quests_rockridge_anyway_i_ll_appreciate_i_c4ea50: "总之，如果你能处理掉野牛匪帮，我会很感激的。"
  npc_override_harboro1_quests_rockridge_anyway_i_looking_things_91a020: "总之，我在找只有这里才有的东西。如果你找到了，给我吧。"
  npc_override_harboro1_quests_rockridge_anyway_johnny_james_more_50d779: "总之，约翰尼·詹姆斯比我想的还要固执。"
  npc_override_harboro1_quests_rockridge_anyway_kiddo_you_sure_yo_df6094: "总之，小鬼，你确定你能帮我们吗？矿里有长得像棉花球的怪物。消灭它们，它们会留下致命的毒粉和爆炸粉。"
  npc_override_harboro1_quests_rockridge_anyway_what_we_you_9c9fa5: "总之，我们能为你做些什么？"
  npc_override_harboro1_quests_rockridge_anyway_wyatt_you_attend_b28c04: "……总之，怀亚特和你去参加会议，我就不去了。"
  npc_override_harboro1_quests_rockridge_area_desert_desalinating_730e4f: "这片区域是沙漠。淡化海水比运水进来便宜。"
  npc_override_harboro1_quests_rockridge_aren_t_you_tired_pipes_b71327: "你不累吗？管道现在不需要清理。你为什么不去处理别的事？"
  npc_override_harboro1_quests_rockridge_argh_i_don_t_want_0f6240: "啊，我不想为这个烂摊子负责！"
  npc_override_harboro1_quests_rockridge_as_always_i_m_grateful_8f11b0: "和往常一样，感谢你的帮助，但你得早上再来。谢谢。"
  npc_override_harboro1_quests_rockridge_as_always_please_hunt_co_e33ac5: "和往常一样，请帮我消灭^0000CD30只郊狼^000000。"
  npc_override_harboro1_quests_rockridge_as_help_me_something_59e268: "来帮我做点事？"
  npc_override_harboro1_quests_rockridge_as_i_get_older_s_384bd8: "随着我年纪越来越大，整天站在外面传播他的话语变得越来越困难。"
  npc_override_harboro1_quests_rockridge_as_if_wasn_t_enough_6d52fc: "而且这还不够，他们还在我们的矿里安了家。现在我没法产生任何利润，公司对我不满意。"
  npc_override_harboro1_quests_rockridge_as_many_as_i_ask_68a0e1: "我要多少就给多少。"
  npc_override_harboro1_quests_rockridge_as_soon_as_you_re_7a1b96: "你一完成就来。"
  npc_override_harboro1_quests_rockridge_as_usual_get_deadly_pois_621662: "和往常一样，拿到^0000cd10个致命毒粉和1个爆炸粉^000000，然后^0000cd消灭15个气态怪^000000。明白了吗？"
  npc_override_harboro1_quests_rockridge_as_you_see_rock_ridge_c0d827: "如你所见，岩脊镇是一个在荒原上建立的拓荒者村庄。"
  npc_override_harboro1_quests_rockridge_aside_main_gate_there_fe_45e7e8: "除了主门，还有几个只有我们知道的入口，我们守卫着其中一个。"
  npc_override_harboro1_quests_rockridge_ask_if_he_s_seen_9608cf: "问他有没有看到果汁粉包装。"
  npc_override_harboro1_quests_rockridge_aww_here_s_list_ingredie_8497a3: "哎呀，这是我需要的材料清单。快点带过来，好吗？"
  npc_override_harboro1_quests_rockridge_aww_i_m_too_scared_c12fb2: "哎呀，我太害怕了，不敢再谈这个了。"
  npc_override_harboro1_quests_rockridge_aww_just_one_look_them_205cbc: "哎呀，只看它们一眼，"
  npc_override_harboro1_quests_rockridge_aww_s_getting_chilly_let_d6ebbd: "哎呀，天变冷了。我们回去吧。"
  npc_override_harboro1_quests_rockridge_bah_alright_then_i_won_2662a2: "呸！好吧，那我不强迫你了。"
  npc_override_harboro1_quests_rockridge_bandits_didn_t_bother_ch_cc8d4b: "而且匪帮没有检查那么深的地方。"
  npc_override_harboro1_quests_rockridge_bandits_might_stand_guar_8bc533: "匪帮可能会在矿周围站岗。"
  npc_override_harboro1_quests_rockridge_bandits_only_first_floor_35b2fd: "匪帮只在一楼。我们可以溜到二楼继续采矿。"
  npc_override_harboro1_quests_rockridge_bandits_stole_them_compa_389c86: "而且匪帮从公司那里偷走了它们。"
  npc_override_harboro1_quests_rockridge_basement_haunted_you_don_ed0e4f: "地下室闹鬼。你不会真的相信吧？"
  npc_override_harboro1_quests_rockridge_basement_village_ebdfba: "从村子的地下室，"
  npc_override_harboro1_quests_rockridge_beautiful_isn_t_fd0b34: "很漂亮，不是吗？"
  npc_override_harboro1_quests_rockridge_because_bandits_right_8f17bf: "这是因为匪帮，对吧？"
  npc_override_harboro1_quests_rockridge_because_he_s_made_offer_1c76ca: "因为他已经把这个提议正式化了，我们不能无视它。"
  npc_override_harboro1_quests_rockridge_because_his_spy_just_poi_860660: "因为他的间谍刚才用手指比枪指着我。"
  npc_override_harboro1_quests_rockridge_because_lecter_stop_cryi_c5622d: "因为莱克特……别哭了。聪明的仙人掌小孩不会这么容易哭的！"
  npc_override_harboro1_quests_rockridge_because_they_spring_up_e_6021a7: "因为它们每天都冒出来，"
  npc_override_harboro1_quests_rockridge_because_we_re_greedy_7aeb11: "- 因为我们贪婪，"
  npc_override_harboro1_quests_rockridge_been_212bdb: "已经"
  npc_override_harboro1_quests_rockridge_being_such_dangerous_pla_42e053: "待在这种危险的地方让我紧张。"
  npc_override_harboro1_quests_rockridge_besides_johnny_given_up_dbf2c2: "而且约翰尼已经放弃了。"
  npc_override_harboro1_quests_rockridge_besides_we_also_want_min_5ab2b1: "另外，我们也想要回矿。我们一点也不想和做交易。"
  npc_override_harboro1_quests_rockridge_best_i_i_hope_you_88a05f: "这是我所能做的最好的了。希望你会喜欢。我代表我的家人感谢你的帮助。"
  npc_override_harboro1_quests_rockridge_best_netter_village_mrs_98d795: "村子里最好的织网人是软羽夫人。"
  npc_override_harboro1_quests_rockridge_biggest_threat_fields_ar_f8fc17: "这附近荒原上最大的威胁就是野牛匪帮。他们聪明又残忍，而且不讲道理。"
  npc_override_harboro1_quests_rockridge_bless_you_e77ca3: "保佑你。"
  npc_override_harboro1_quests_rockridge_blood_blood_i_don_t_842383: "血债血偿，我不想那样。你可以拿走这个包裹，陌生人。"
  npc_override_harboro1_quests_rockridge_bodies_workers_who_went_2042c2: "在地下室失踪的工人的尸体已经被找到了。他们被撕得面目全非，连他们的家人都难以辨认。"
  npc_override_harboro1_quests_rockridge_boo_0ba64e: "嘘！"
  npc_override_harboro1_quests_rockridge_boohoo_grandma_boohoo_fc568a: "呜呜！奶奶！呜呜！"
  npc_override_harboro1_quests_rockridge_boohoo_where_hell_sherif_943616: "呜呜！警长办公室到底在哪儿？我的钱！钱钱钱！"
  npc_override_harboro1_quests_rockridge_boring_though_8599b1: "- 不过很无聊。"
  npc_override_harboro1_quests_rockridge_boss_betrayed_us_7ccd67: "老大背叛了我们？"
  npc_override_harboro1_quests_rockridge_boss_boss_980144: "老大！老大！"
  npc_override_harboro1_quests_rockridge_boss_you_boss_8949f6: "老大？是你吗，老大？"
  npc_override_harboro1_quests_rockridge_both_badges_worn_us_vigi_3ddcb0: "这两枚徽章都由我们自卫队佩戴，但它们提供不同的效果。"
  npc_override_harboro1_quests_rockridge_box_7e79ff: "那个箱子！"
  npc_override_harboro1_quests_rockridge_boy_s_loud_here_somethin_abd819: "（天哪，这里好吵。发生什么事了吗？）"
  npc_override_harboro1_quests_rockridge_brave_warrior_cacti_dcd9f4: "仙人掌族的勇敢战士。"
  npc_override_harboro1_quests_rockridge_bread_bread_bread_bread_67791e: "面包！面包，面包！面包！"
  npc_override_harboro1_quests_rockridge_bread_buy_bread_freshly_7a0f6f: "面包！买刚出炉的新鲜面包！"
  npc_override_harboro1_quests_rockridge_bring_lots_friends_you_n_e9682a: "但下次多带些朋友来，好吗？"
  npc_override_harboro1_quests_rockridge_bring_me_bastard_s_mane_3180ae: "把那个混蛋的鬃毛给我带来！"
  npc_override_harboro1_quests_rockridge_bring_me_his_mane_as_e1d2f2: "然后把^4d4dff他的鬃毛^000000给我带来作为证明。"
  npc_override_harboro1_quests_rockridge_bring_me_midgard_you_buy_580881: "从米德加尔特给我带60个{0}来。你可以在大城市的商人那里买到。"
  npc_override_harboro1_quests_rockridge_bring_me_midgard_you_buy_9fd633: "从米德加尔特给我带160个{0}来。你可以在大城市的商人那里买到。"
  npc_override_harboro1_quests_rockridge_bring_me_midgard_you_buy_b8b3f9: "从米德加尔特给我带{0}个{1}来。你可以在大城市的商人那里买到。"
  npc_override_harboro1_quests_rockridge_bring_me_midgard_you_buy_f4f34b: "从米德加尔特给我带50个{0}来。你可以在大城市的商人那里买到。"
  npc_override_harboro1_quests_rockridge_bring_them_me_eec95f: "把它们带给我。"
  npc_override_harboro1_quests_rockridge_broken_elevator_north_ce_9cddf1: "坏掉的电梯在这个矿的北边中心位置。"
  npc_override_harboro1_quests_rockridge_buffalo_bandits_87e38b: "还有野牛匪帮。"
  npc_override_harboro1_quests_rockridge_buffalo_bandits_e60c54: "野牛匪帮"
  npc_override_harboro1_quests_rockridge_buffalo_bandits_mine_jus_dd73bf: "野牛匪帮、矿，就举几个例子？"
  npc_override_harboro1_quests_rockridge_buffalo_bandits_want_mak_ee572e: "野牛匪帮想和我们做交易。"
  npc_override_harboro1_quests_rockridge_buffaloes_fc7bc3: "野牛！"
  npc_override_harboro1_quests_rockridge_buffaloes_get_out_mine_w_e5858d: "烟花开始时野牛会跑出矿，但那些气团可能会引发连锁反应，炸掉整个矿。先消灭15个。你能做到吗？"
  npc_override_harboro1_quests_rockridge_cacti_members_village_go_101a52: "仙人掌族和这个村子的人关系很好，最近通往他们村子的路上出现了更多的郊狼。"
  npc_override_harboro1_quests_rockridge_cacti_we_people_rock_rid_dece9a: "仙人掌族和我们岩脊镇的人叫他们^4d4dff野牛匪帮^000000。"
  npc_override_harboro1_quests_rockridge_cacturon_should_ashamed_6b8289: "但卡克特伦竟然信任你们这种暴徒，她应该感到羞耻。"
  npc_override_harboro1_quests_rockridge_call_help_4e6bc1: "去呼叫支援。"
  npc_override_harboro1_quests_rockridge_called_gasters_inside_mi_950727: "矿里叫做气态怪的？"
  npc_override_harboro1_quests_rockridge_carola_you_things_scare_9dfc9b: "卡罗拉，你做的事连大多数男人都害怕，而你竟然害怕根本不存在的东西。"
  npc_override_harboro1_quests_rockridge_carrying_limit_helper_11ab39: "^0000ff[负重限制助手]^000000"
  npc_override_harboro1_quests_rockridge_central_road_0fcfcb: "中央大道"
  npc_override_harboro1_quests_rockridge_charlie_t_come_here_he_4b5071: "查理不能来这里。他住在海对面。"
  npc_override_harboro1_quests_rockridge_check_location_ores_brin_249e7c: "检查矿石的位置，然后只带^4d4dff1个矿石箱^000000回来。"
  npc_override_harboro1_quests_rockridge_check_my_bank_account_6d128b: "查看我的银行账户。"
  npc_override_harboro1_quests_rockridge_check_out_exquisite_fini_2f5619: "看看鼓皮周围精致的做工，以及桶身发出的平衡而饱满的声音。"
  npc_override_harboro1_quests_rockridge_check_what_s_going_e41856: "看看发生了什么事。"
  npc_override_harboro1_quests_rockridge_cheers_33224c: "干杯！"
  npc_override_harboro1_quests_rockridge_cheers_nya_3d739d: "干杯，喵！"
  npc_override_harboro1_quests_rockridge_cheers_our_great_village_94f031: "为我们伟大的村子干杯！干杯！"
  npc_override_harboro1_quests_rockridge_chicken_hiccups_you_got_5ff915: "鸡肉！*打嗝* 你得配鸡肉吃！"
  npc_override_harboro1_quests_rockridge_children_they_as_cute_as_e440b7: "小孩？他们有小叶子那么可爱吗？"
  npc_override_harboro1_quests_rockridge_chuckle_483441: "*轻笑*"
  npc_override_harboro1_quests_rockridge_chuckle_i_ll_make_you_df81a2: "*轻笑* 我会让你为羞辱我付出代价的。"
  npc_override_harboro1_quests_rockridge_chuckle_what_should_i_bu_d4bd5e: "*轻笑* 我该怎么对付野牛匪帮呢？"
  npc_override_harboro1_quests_rockridge_chuckle_who_knew_adventu_db4ff1: "*轻笑* 谁知道冒险者竟然这么有用？"
  npc_override_harboro1_quests_rockridge_chuckle_who_knew_carola_ab89c4: "*轻笑* 谁知道卡罗拉这种人竟然会怕鬼？"
  npc_override_harboro1_quests_rockridge_chuckle_you_re_so_useful_5725a0: "*轻笑* 你真有用。只要让你站在我们旁边，就像护身符一样灵验。"
  npc_override_harboro1_quests_rockridge_clear_sea_anemones_momen_4e5ff8: "现在远离海葵。"
  npc_override_harboro1_quests_rockridge_clear_throat_beb521: "*清嗓子* {0}！"
  npc_override_harboro1_quests_rockridge_clenches_his_teeth_sweet_e618f4: "*咬紧牙关* 亲爱的，我们现在别开始这个。"
  npc_override_harboro1_quests_rockridge_come_back_if_you_change_7fcf38: "但如果你改变主意了，再回来。"
  npc_override_harboro1_quests_rockridge_come_back_later_937ea4: "晚点再来？"
  npc_override_harboro1_quests_rockridge_come_don_t_so_heartless_ced973: "拜托，别这么无情。我只是想和你聊聊天。我有个你可能会感兴趣的提议。你觉得怎么样？"
  npc_override_harboro1_quests_rockridge_come_i_said_i_d_1b032a: "拜托，我说过我报答你的。"
  npc_override_harboro1_quests_rockridge_come_let_s_go_play_33286c: "来吧，我们去和约翰尼玩！"
  npc_override_harboro1_quests_rockridge_come_let_s_patient_littl_24d165: "来吧，我们再耐心等一会儿。"
  npc_override_harboro1_quests_rockridge_come_out_gold_silver_dia_470a15: "出来吧，金子、银子、钻石！你躲不过德尔伯特的！"
  npc_override_harboro1_quests_rockridge_come_us_if_you_want_bfb78d: "如果你想听神的话语，就来找我们。"
  npc_override_harboro1_quests_rockridge_come_village_if_you_want_03db95: "如果你愿意，就来村子里。"
  npc_override_harboro1_quests_rockridge_come_you_need_get_rid_876fe9: "拜托，你得消灭野牛匪帮，然后出其不意地抓住阿尔伯特！"
  npc_override_harboro1_quests_rockridge_command_been_cancelled_bb0d0b: "命令已取消。"
  npc_override_harboro1_quests_rockridge_company_sent_capable_adv_7ce7b8: "公司这次派来了一个能干的冒险者。"
  npc_override_harboro1_quests_rockridge_company_wants_milk_mine_3b48fb: "公司想把矿榨干，"
  npc_override_harboro1_quests_rockridge_convince_johnny_albert_g_a57562: "然后让约翰尼相信阿尔伯特已经放弃了你们。"
  npc_override_harboro1_quests_rockridge_costello_looking_around_dbc298: "^4d4dff科斯特洛环顾四周，焦急地嘟囔着。"
  npc_override_harboro1_quests_rockridge_costello_right_892a82: "一定是科斯特洛，对吧？"
  npc_override_harboro1_quests_rockridge_costello_wants_leave_6f0ab4: "科斯特洛想离开。"
  npc_override_harboro1_quests_rockridge_could_you_also_help_my_26c9fd: "你也能帮帮我的村子吗？"
  npc_override_harboro1_quests_rockridge_could_you_go_tell_shawn_61ed15: "你能去告诉肖恩矿石在哪里吗？"
  npc_override_harboro1_quests_rockridge_could_you_help_me_6def0a: "你能帮我吗？"
  npc_override_harboro1_quests_rockridge_could_you_stop_hitting_m_3b3ae7: "你能不能别跟我调情了？我是董事长的私人秘书。"
  npc_override_harboro1_quests_rockridge_could_you_talk_my_mom_e5fdc9: "你能跟我妈谈谈吗？她不让我喝，我就不能喝。"
  npc_override_harboro1_quests_rockridge_course_a46205: "当然不。"
  npc_override_harboro1_quests_rockridge_course_everyone_even_old_7e083d: "当然。每个人，甚至我这个老人，在大自然母亲眼中都是孩子。"
  npc_override_harboro1_quests_rockridge_course_i_m_sure_if_90bb3d: "当然，我不确定你能不能直接和他们的老大谈，但是……"
  npc_override_harboro1_quests_rockridge_course_most_its_resident_2856fb: "而且，当然，大多数居民都来自米德加尔特。"
  npc_override_harboro1_quests_rockridge_course_they_re_surrounde_ce26b1: "而且，当然，他们被其他想要工作和食物的人包围着。"
  npc_override_harboro1_quests_rockridge_course_we_don_t_need_fab83d: "但当然，我们不需要他的情报。"
  npc_override_harboro1_quests_rockridge_course_we_serve_individu_913b1b: "当然，我们也为个人客户服务，但企业才是银行的主要收入来源。"
  npc_override_harboro1_quests_rockridge_course_you_need_time_res_278b50: "但当然，你需要休息，就像现在一样。整天工作不休息会让生活变得枯燥。"
  npc_override_harboro1_quests_rockridge_coyote_so_absorbed_playi_b86744: "- 一只郊狼嘴里叼着什么东西玩得太投入了，都没发现我在附近。也许它嘴里叼着卡克特伦先生的果汁粉包装。-"
  npc_override_harboro1_quests_rockridge_coyote_something_its_mou_049b37: "- 一只郊狼嘴里叼着什么东西，正甩着头玩。可能是卡克特伦夫人的果汁粉包装。-"
  npc_override_harboro1_quests_rockridge_coyote_something_its_mou_9f6c29: "- 一只郊狼嘴里叼着什么东西，正甩着头玩。但我带的东西太多了，没法检查它嘴里有什么。我最好先减轻背包重量。-"
  npc_override_harboro1_quests_rockridge_coyotes_8b9a91: "从郊狼身上"
  npc_override_harboro1_quests_rockridge_coyotes_aren_t_aggressiv_7d2220: "郊狼不具攻击性，但它们仍然妨碍仙人掌族自由进出他们的村子。"
  npc_override_harboro1_quests_rockridge_coyotes_been_attacking_o_54993d: "郊狼最近经常袭击我们的村子，所以我们请了一些冒险者来削减它们的数量。"
  npc_override_harboro1_quests_rockridge_damn_449fa3: "……该死！"
  npc_override_harboro1_quests_rockridge_deadly_poisonous_powder_8d80b1: "致命毒粉？你要杀了它们？你说过只是想吓跑它们。"
  npc_override_harboro1_quests_rockridge_deal_f751ab: "成交。"
  npc_override_harboro1_quests_rockridge_deletion_aborted_b587c9: "删除已中止。"
  npc_override_harboro1_quests_rockridge_demon_some_strange_kid_j_5447da: "恶魔，有个奇怪的小孩一直在我们周围晃悠。你认识他吗？"
  npc_override_harboro1_quests_rockridge_depends_you_shawn_cfb3c7: "这取决于你和肖恩。"
  npc_override_harboro1_quests_rockridge_did_he_really_betray_us_d5a950: "他真的背叛了我们吗？"
  npc_override_harboro1_quests_rockridge_did_he_tell_you_c1b1c8: "他告诉你了吗？"
  npc_override_harboro1_quests_rockridge_did_johnny_even_give_you_68cde5: "约翰尼甚至给你发信号给阿尔伯特的暗号了吗？"
  npc_override_harboro1_quests_rockridge_did_something_happen_ins_fa9e9c: "矿里发生了什么事吗？"
  npc_override_harboro1_quests_rockridge_did_something_happen_tra_aa0672: "那个叛徒怎么了？"
  npc_override_harboro1_quests_rockridge_did_you_catch_them_all_f82ebd: "你把它们都抓到了吗？我最好在更多冒出来之前完成我的巡逻。"
  npc_override_harboro1_quests_rockridge_did_you_find_ore_fragmen_7111b1: "你找到我要的矿石碎片了吗？"
  npc_override_harboro1_quests_rockridge_did_you_find_something_t_182bc0: "你找到什么了吗？那我们回去吧！"
  npc_override_harboro1_quests_rockridge_did_you_find_what_we_bc73dd: "你找到我们要的东西了吗？你带的东西太多了，我看不到。你能先^FF0000减轻背包重量^000000吗？"
  npc_override_harboro1_quests_rockridge_did_you_forget_what_you_1d598e: "你忘了你要做什么了吗？那我再说一遍。"
  npc_override_harboro1_quests_rockridge_did_you_get_your_revenge_d35e8a: "你被释放后报仇了吗？"
  npc_override_harboro1_quests_rockridge_did_you_hear_bandits_att_e63035: "你听说匪帮袭击了我们的货运火车，偷走了所有矿石吗？"
  npc_override_harboro1_quests_rockridge_did_you_hear_basement_ha_69c674: "你听说了吗？地下室闹鬼！"
  npc_override_harboro1_quests_rockridge_did_you_hunt_all_them_0c457d: "你把它们都消灭了吗？对了，你为什么带这么多东西？"
  npc_override_harboro1_quests_rockridge_did_you_know_most_buildi_033423: "你知道岩脊镇一楼的建筑大多门前都有一个巨大的招牌吗？"
  npc_override_harboro1_quests_rockridge_did_you_know_there_s_1e916c: "你知道这个村子下面还有一层吗？那才是真正的岩脊镇，后来因为海水侵蚀和地下水淹没变得无法居住了。"
  npc_override_harboro1_quests_rockridge_did_you_know_we_had_5da77a: "你知道我们不得不填埋以前的地面吗？那是个艰难的决定，而且仍然没有解决所有问题。"
  npc_override_harboro1_quests_rockridge_did_you_lose_one_i_40748f: "你把我给你的那个弄丢了吗？"
  npc_override_harboro1_quests_rockridge_did_you_really_take_care_db6c90: "你真的解决了他吗？"
  npc_override_harboro1_quests_rockridge_did_you_take_care_all_d956d2: "你把那些该死的野牛匪帮都收拾了吗？"
  npc_override_harboro1_quests_rockridge_didn_t_i_tell_you_53c11c: "我不是告诉过你到那里要^4d4dff10,000 Zeny^000000吗？"
  npc_override_harboro1_quests_rockridge_didn_t_work_out_ddca6a: "但结果没成。"
  npc_override_harboro1_quests_rockridge_different_ours_dfc3d5: "和我们的不同。"
  npc_override_harboro1_quests_rockridge_doesn_t_make_me_more_938d38: "这并没有让我更确信信任你的决定。"
  npc_override_harboro1_quests_rockridge_doesn_t_matter_whether_t_d7f34f: "火车来不来都无所谓。我们一直很忙。"
  npc_override_harboro1_quests_rockridge_doesn_t_mean_we_want_4c0216: "但这并不意味着我们想全部消灭它们。"
  npc_override_harboro1_quests_rockridge_don_t_call_me_unless_096cea: "除非有事情要告诉我，否则别叫我！"
  npc_override_harboro1_quests_rockridge_don_t_come_back_until_911713: "除非你拿到^4d4dff阿尔伯特的鬃毛^000000给我看，否则别回来，明白了吗？"
  npc_override_harboro1_quests_rockridge_don_t_come_near_me_6f736a: "别靠近我，否则后果自负。"
  npc_override_harboro1_quests_rockridge_don_t_compare_me_him_ffc32e: "别拿我和他比。"
  npc_override_harboro1_quests_rockridge_don_t_forget_teach_alber_c4f491: "这次别忘了教训阿尔伯特一顿。"
  npc_override_harboro1_quests_rockridge_don_t_forget_tell_sherif_3d54c1: "别忘了告诉警长我配合了。"
  npc_override_harboro1_quests_rockridge_don_t_give_johnny_chance_d0e464: "别给约翰尼思考的机会。"
  npc_override_harboro1_quests_rockridge_don_t_give_me_dirty_1d283b: "别用那种眼神看我。我们现在没做什么坏事，对吧？"
  npc_override_harboro1_quests_rockridge_don_t_worry_about_him_8b5d1d: "别担心他。他很久以前就和他们断绝关系了。他对那些抛弃他的野牛没有任何感情。我说得对吗？"
  npc_override_harboro1_quests_rockridge_don_t_worry_about_your_476d7a: "别担心你的报酬，我已经安排好了。去把活干完就行。"
  npc_override_harboro1_quests_rockridge_don_t_worry_johnny_t_afef22: "别担心。约翰尼逃不掉法律的制裁。"
  npc_override_harboro1_quests_rockridge_don_t_worry_you_still_907d3e: "别担心。你仍然可以买枪。小桑德斯租了工具店的一个角落，在那里卖几把枪。"
  npc_override_harboro1_quests_rockridge_don_t_worry_your_thorns_40eb46: "别担心。你的刺那么锋利，没人敢碰你。"
  npc_override_harboro1_quests_rockridge_don_t_you_think_regular_b63361: "你不觉得普通的酷刑或威胁会有用吗？"
  npc_override_harboro1_quests_rockridge_don_t_you_want_your_6ae0c3: "你不想要回你的矿石和矿吗，嗯？"
  npc_override_harboro1_quests_rockridge_edith_daddy_working_hard_29b978: "伊迪丝！爸爸在为你努力工作！"
  npc_override_harboro1_quests_rockridge_either_way_his_refusal_c_5df8c7: "不管怎样，他拒绝合作让事情变得困难。"
  npc_override_harboro1_quests_rockridge_eliminate_buffalo_bandit_047702: "消灭岩脊镇和矿周围的野牛匪帮，"
  npc_override_harboro1_quests_rockridge_elite_buffalo_bandits_le_179077: "精英野牛匪帮是野牛匪帮中的头目，这件事说的就是他们。"
  npc_override_harboro1_quests_rockridge_enjoy_your_stay_lazy_owl_4e0992: "祝你在懒猫头鹰旅馆住得愉快。"
  npc_override_harboro1_quests_rockridge_enough_keep_me_awake_all_4720f7: "这足以让我彻夜难眠。"
  npc_override_harboro1_quests_rockridge_enter_basement_d5c536: "进入地下室。"
  npc_override_harboro1_quests_rockridge_entrance_mine_just_littl_0e6ad2: "矿的入口就在这边往北一点。"
  npc_override_harboro1_quests_rockridge_entrance_second_floor_mi_7b3213: "矿二楼的入口在^4d4dff矿主入口更南边^000000的地方。"
  npc_override_harboro1_quests_rockridge_erekter_wants_become_bes_9f42b1: "埃雷克特长大后想成为村子里最好的织网人。"
  npc_override_harboro1_quests_rockridge_err_mom_did_you_fall_9a5c78: "嗯？妈，你摔伤了吗？为什么你的衣服这么脏？"
  npc_override_harboro1_quests_rockridge_err_wait_s_real_agave_b3ce02: "嗯，等等。这不是真正的龙舌兰果汁。上面写着龙舌兰口味果汁。"
  npc_override_harboro1_quests_rockridge_err_why_i_thought_you_205f12: "嗯？为什么不呢？我以为你今天去了岩脊镇市场。"
  npc_override_harboro1_quests_rockridge_even_his_second_command_ad8629: "连他的副手都放弃了他。"
  npc_override_harboro1_quests_rockridge_even_mrs_cacturon_doesn_497ee2: "连卡克特伦夫人都不认为她能找回全部七包。"
  npc_override_harboro1_quests_rockridge_even_sheriff_agrees_me_cb9e50: "连警长都同意我的看法。"
  npc_override_harboro1_quests_rockridge_even_then_i_keep_my_e76f09: "即使那样我也一直把它放在口袋里。就这次掉了，然后那只杂种就捡到了！"
  npc_override_harboro1_quests_rockridge_every_night_they_show_up_46bcf0: "每天晚上，它们成群结队地出现，叫着好像在说我们永远不可能把它们全部消灭。"
  npc_override_harboro1_quests_rockridge_every_one_us_born_loved_6c4df6: "我们每个人生来都是要被爱的。"
  npc_override_harboro1_quests_rockridge_everyone_said_rock_ridge_d0ccbc: "每个人都说岩脊镇是机会之地！为什么没人告诉我有可怕的野牛匪帮？"
  npc_override_harboro1_quests_rockridge_everything_went_just_as_eb3919: "一切都按计划进行！"
  npc_override_harboro1_quests_rockridge_everything_your_village_b63166: "不是你们村子里的一切"
  npc_override_harboro1_quests_rockridge_exactly_what_i_ve_wanted_38f2b9: "这正是我想要的！"
  npc_override_harboro1_quests_rockridge_excellent_choice_792f07: "好选择！"
  npc_override_harboro1_quests_rockridge_excuse_me_39524e: "你说什么？"
  npc_override_harboro1_quests_rockridge_excuse_me_something_wron_c8c493: "打扰一下，有什么问题吗？"
  npc_override_harboro1_quests_rockridge_exit_through_eastern_gat_cdab8e: "从东门出去，沿着铁路往北走。你会看到一辆^4d4dff静止的货运火车^000000。"
  npc_override_harboro1_quests_rockridge_exit_village_through_eas_56504c: "从村子东门出去，你就到了^4d4dff基瓦瓦沙漠^000000。"
  npc_override_harboro1_quests_rockridge_explains_why_bandits_bee_c5848c: "这就解释了为什么匪帮一直在矿周围站岗。"
  npc_override_harboro1_quests_rockridge_fact_my_company_like_too_9d3080: "事实上，我的公司也希望如此。"
  npc_override_harboro1_quests_rockridge_feel_free_come_back_if_e9b3c5: "如果你改变主意了，随时回来。"
  npc_override_harboro1_quests_rockridge_filling_work_still_hasn_c33f80: "而且填埋工作还没有完成。唉，我都不知道那是不是个好决定了。"
  npc_override_harboro1_quests_rockridge_finding_ores_bfd75e: "找到矿石。"
  npc_override_harboro1_quests_rockridge_firecracker_maker_97ec5a: "鞭炮制造师？"
  npc_override_harboro1_quests_rockridge_first_level_mine_done_se_ced791: "矿的一楼已经完了，但二楼的储量足够我们维持一段时间。矿的问题已经解决了。"
  npc_override_harboro1_quests_rockridge_flooded_s_why_had_filled_8a0b62: "它被淹了。这就是为什么必须填埋，我们必须搬上去。你老糊涂了吗？当初是你坚持说这个地方太低了，没法建房子的。"
  npc_override_harboro1_quests_rockridge_follow_main_road_village_0287e0: "沿着村里的主路往东走，你就会看到警长办公室。"
  npc_override_harboro1_quests_rockridge_follow_narrow_passage_yo_0c4874: "沿着这条狭窄的通道走，你会看到一条矿脉。"
  npc_override_harboro1_quests_rockridge_follow_railroad_east_fd4703: "沿着铁路往东走。"
  npc_override_harboro1_quests_rockridge_follow_road_east_get_inn_be1f6d: "沿着这条路往东走，可以到达旅馆、警长办公室、商店和广场。"
  npc_override_harboro1_quests_rockridge_food_ingredients_suppose_df06be: "本该从米德加尔特运来的食材没有到，我不能让这些人一直等着。"
  npc_override_harboro1_quests_rockridge_forget_i_tried_got_flat_1900b5: "算了。我试过了，结果被直接拒绝了。"
  npc_override_harboro1_quests_rockridge_forget_you_heard_me_f77191: "忘了你听到的话。"
  npc_override_harboro1_quests_rockridge_frankly_i_don_t_understa_2144b8: "坦白说，我不明白他为什么要这么做，但我不想阻止他。"
  npc_override_harboro1_quests_rockridge_freeze_5dc0f6: "不许动！"
  npc_override_harboro1_quests_rockridge_ga_ah_6a4ae0: "嘎——啊——。"
  npc_override_harboro1_quests_rockridge_ga_ah_86f2bd: "嘎——啊。"
  npc_override_harboro1_quests_rockridge_gasp_13b5d1: "*倒吸一口气*"
  npc_override_harboro1_quests_rockridge_gasp_adventurer_careful_0d3330: "*倒吸一口气* 冒险者，小心！自从野牛匪帮占领了附近的矿，这个地方就不安全了。"
  npc_override_harboro1_quests_rockridge_gasp_buffalo_bandits_ad3727: "*倒吸一口气* 野牛匪帮！"
  npc_override_harboro1_quests_rockridge_gasp_don_t_tell_anyone_d6934c: "*倒吸一口气* 别告诉任何人村子里没有工作可做。"
  npc_override_harboro1_quests_rockridge_gasp_h_how_long_you_89db8c: "*倒吸一口气* 你——你站在那里多久了？当——当然，有工作我很开心！"
  npc_override_harboro1_quests_rockridge_gasp_i_m_back_cactus_957514: "*倒吸一口气* 我回到仙人掌村了。哎呀，我又迷路了？"
  npc_override_harboro1_quests_rockridge_gasp_taneska_i_told_you_92339f: "*倒吸一口气* 塔内斯卡，我告诉过你别打它！"
  npc_override_harboro1_quests_rockridge_gasp_taneska_please_don_d35d1a: "*倒吸一口气* 塔内斯卡，请别碰它！你已经受过一次警告了！"
  npc_override_harboro1_quests_rockridge_geez_makes_no_sense_044c41: "天哪！这说不通！"
  npc_override_harboro1_quests_rockridge_geez_they_re_drinking_ag_208eb1: "天哪，他们又在喝酒了。"
  npc_override_harboro1_quests_rockridge_geez_you_adventurers_sca_30a7e4: "天哪，你们冒险者真是可怕的一群人。"
  npc_override_harboro1_quests_rockridge_get_rid_any_buffalo_band_f5608c: "消灭你看到的任何野牛匪帮，然后拿到矿石。"
  npc_override_harboro1_quests_rockridge_get_rid_sea_anemones_41b215: "然后消灭海葵"
  npc_override_harboro1_quests_rockridge_get_rid_sea_anemones_aga_e82af1: "再次消灭海葵。"
  npc_override_harboro1_quests_rockridge_get_souvenirs_your_famil_1d0078: "给你的家人、朋友、老师和另一半买纪念品！"
  npc_override_harboro1_quests_rockridge_get_your_butt_outta_here_386667: "滚出去！滚！"
  npc_override_harboro1_quests_rockridge_getting_rid_them_a377f8: "消灭它们"
  npc_override_harboro1_quests_rockridge_give_me_ore_da8c40: "把矿石给我。"
  npc_override_harboro1_quests_rockridge_glance_2c544a: "*瞥了一眼*"
  npc_override_harboro1_quests_rockridge_go_back_0c2272: "回去然后"
  npc_override_harboro1_quests_rockridge_go_c78e14: "去吧。"
  npc_override_harboro1_quests_rockridge_go_down_basement_3c223c: "去地下室。"
  npc_override_harboro1_quests_rockridge_go_down_basement_f7476b: "去地下室"
  npc_override_harboro1_quests_rockridge_go_east_b8bc59: "往东走，"
  npc_override_harboro1_quests_rockridge_go_lighten_your_bag_firs_4442c4: "先去^FF0000减轻背包重量^000000。"
  npc_override_harboro1_quests_rockridge_go_out_wasteland_you_ll_acfe25: "去荒原，你会看到我在你地图上留下的标记。你不需要搜索那些标记以外的地方。"
  npc_override_harboro1_quests_rockridge_go_outside_village_talk_9ee585: "出村子去跟我丈夫谈谈。他会告诉你在哪里可能找到。"
  npc_override_harboro1_quests_rockridge_go_rest_today_come_back_13a3b7: "今天先去休息，明天早上再来。再见！"
  npc_override_harboro1_quests_rockridge_go_sheriff_tell_him_you_cd6c73: "去找警长，告诉他你是来帮忙处理野牛匪帮问题的。他会告诉你该做什么。"
  npc_override_harboro1_quests_rockridge_god_come_cozy_bedrooms_n_03c44c: "但神可以来到舒适的卧室和香气扑鼻的厨房。我们不必整天站在刮风的港口。"
  npc_override_harboro1_quests_rockridge_good_business_these_i_di_d98d17: "这是好生意。这些我在别的地方没见过。我非常喜欢！"
  npc_override_harboro1_quests_rockridge_good_job_should_convince_c67bc4: "干得好！这应该能说服阿尔伯特。"
  npc_override_harboro1_quests_rockridge_good_job_villagers_enjoy_979b34: "干得好。村民们今天可以享用干净的水了，这都是因为你。"
  npc_override_harboro1_quests_rockridge_good_let_me_tell_you_c56b06: "好。让我告诉你该怎么做。看看我左边储水室底部的那扇门。它通向地下室。"
  npc_override_harboro1_quests_rockridge_good_luck_703764: "祝你好运。"
  npc_override_harboro1_quests_rockridge_good_luck_living_ripe_ol_78cfa5: "祝你长命百岁。"
  npc_override_harboro1_quests_rockridge_good_then_let_s_go_c37a5b: "好！那我们去"
  npc_override_harboro1_quests_rockridge_good_then_you_also_must_53247c: "好，那你一定也知道他们在我们的矿里安了家。"
  npc_override_harboro1_quests_rockridge_good_we_lied_first_meeti_ee4ade: "第一次见面时我们撒谎说你是从总部来的，这很好。"
  npc_override_harboro1_quests_rockridge_good_we_ve_made_deal_ba6808: "好！我们成交了。我需要一些时间来清点库存。过一会儿再来找我。"
  npc_override_harboro1_quests_rockridge_gosh_i_m_really_up_2fb2b1: "天哪，我真的不想再出远门了……我希望在离开前能喝一杯凉水。"
  npc_override_harboro1_quests_rockridge_got_fa9772: "明白了。"
  npc_override_harboro1_quests_rockridge_gramps_said_you_d_bring_24de74: "爷爷说你会带龙舌兰口味果汁来。我等了一整天。哇！"
  npc_override_harboro1_quests_rockridge_grandma_grandma_boohoo_dc6414: "奶奶……奶奶……呜呜！"
  npc_override_harboro1_quests_rockridge_grandpa_said_we_shouldn_e28ea4: "爷爷说我们不能跟陌生人走，否则他们会拔光我们所有的刺。如果他说的是真的怎么办？"
  npc_override_harboro1_quests_rockridge_groan_alright_then_i_d_2768a9: "*呻吟* 好吧，那我最好找别人。"
  npc_override_harboro1_quests_rockridge_groan_what_i_b17bfe: "*呻吟* 我该怎么办？"
  npc_override_harboro1_quests_rockridge_groundwater_keeps_wellin_b305c9: "地下水不断涌出"
  npc_override_harboro1_quests_rockridge_grr_i_t_believe_you_2629ee: "哼，真不敢相信你！你今晚的晚饭只有一半！"
  npc_override_harboro1_quests_rockridge_grr_if_i_get_out_7dd5a0: "哼，如果我出去的话……"
  npc_override_harboro1_quests_rockridge_grr_you_re_jerk_i_3246f8: "哼，你真是个混蛋。我没时间跟你废话。滚出去！"
  npc_override_harboro1_quests_rockridge_grr_you_senile_coot_41c2a6: "哼，你这个老糊涂！"
  npc_override_harboro1_quests_rockridge_guys_let_s_go_4e246c: "各位，我们走！"
  npc_override_harboro1_quests_rockridge_hah_hah_hah_497a2c: "哈哈哈！"
  npc_override_harboro1_quests_rockridge_hah_hah_hah_doesn_t_bcd86c: "哈哈哈！这说不通。你个子高，还有胡子。婴儿可没有胡子。"
  npc_override_harboro1_quests_rockridge_hah_hah_hah_father_s_6aac43: "哈，哈，哈！父亲的力量！"
  npc_override_harboro1_quests_rockridge_hah_hah_i_my_daughter_8e125c: "哈，哈！我可以为了我的女儿做到！"
  npc_override_harboro1_quests_rockridge_hah_hah_i_see_957df6: "哈哈，我明白了。"
  npc_override_harboro1_quests_rockridge_hah_hah_s_boring_job_12013c: "哈哈，这工作确实无聊。"
  npc_override_harboro1_quests_rockridge_hah_hah_thank_you_your_6cabd9: "哈哈，谢谢你的兴趣，但我们还没 desperate 到需要你们这种小屁孩帮忙的地步。"
  npc_override_harboro1_quests_rockridge_hah_i_don_t_want_a663dd: "哈！我不想这样对怀亚特，但我打算坐下一班船离开岩脊镇。"
  npc_override_harboro1_quests_rockridge_hang_there_2dc21b: "坚持住！"
  npc_override_harboro1_quests_rockridge_hang_what_buffalo_wait_y_be1e0d: "挂什么野牛？等等，你是在说我吗？"
  npc_override_harboro1_quests_rockridge_hasn_t_been_even_thirty_bb543d: "距离我们上一顿饭还不到三十分钟！"
  npc_override_harboro1_quests_rockridge_having_sacrifice_d0c000: "不得不牺牲"
  npc_override_harboro1_quests_rockridge_having_something_blessin_19e489: "有事可做是一种福气。"
  npc_override_harboro1_quests_rockridge_he_could_just_tell_us_2f5eb3: "他可以直接告诉我们矿石在哪里，然后自由离开。"
  npc_override_harboro1_quests_rockridge_he_couldn_t_gone_too_07e67e: "但他不可能走太远，因为他很快就回到我这里了。你为什么不沿着篱笆走，看看有没有白毛漂浮的洞？"
  npc_override_harboro1_quests_rockridge_he_d_better_e7f4e6: "他最好如此。"
  npc_override_harboro1_quests_rockridge_he_d_probably_say_someth_12e963: "他可能会说些蠢话，比如^4d4dff付给他们一百万 Zeny 左右买矿石^000000。"
  npc_override_harboro1_quests_rockridge_he_doesn_t_carry_as_6447d9: "他卖的产品种类不如他父亲多，但他有一些精心挑选的型号。"
  npc_override_harboro1_quests_rockridge_he_doesn_t_seem_venture_575d45: "而且他似乎不会走太远。可能是因为他还年轻。我在你地图中间标记了三个可能的位置。你不需要在那些位置之外寻找。"
  npc_override_harboro1_quests_rockridge_he_doesn_t_want_let_8b6275: "他不想为了换一堆矿石就释放一个罪犯。"
  npc_override_harboro1_quests_rockridge_he_even_offered_us_tell_d8255f: "他甚至主动提出告诉我们矿石在哪里，以换取他的自由。"
  npc_override_harboro1_quests_rockridge_he_gave_up_location_beca_babf76: "他放弃位置是因为他认为你已经死了。"
  npc_override_harboro1_quests_rockridge_he_got_off_ship_mainland_dccff6: "他穿着沉重的采矿装备从大陆坐船下来，然后看了一眼那块岩石，就变成了一个挥舞着镐的疯子。"
  npc_override_harboro1_quests_rockridge_he_least_made_inmate_dep_3b4c6e: "他至少给你存了囚犯保证金吗？"
  npc_override_harboro1_quests_rockridge_he_left_you_hasn_t_1d18fe: "但他抛弃了你，而且一直没回来救你。"
  npc_override_harboro1_quests_rockridge_he_ll_let_you_5b90e8: "他会让你"
  npc_override_harboro1_quests_rockridge_he_looks_more_like_coyot_2e86ca: "- 他看起来更像郊狼而不是狗。-"
  npc_override_harboro1_quests_rockridge_he_may_come_buildings_i_2500c3: "他可能不会进建筑物，但我想进去坐一会儿。"
  npc_override_harboro1_quests_rockridge_he_must_waiting_johnny_s_5e111f: "他一定在等约翰尼被处决，这样他就能成为帮派的老大。"
  npc_override_harboro1_quests_rockridge_he_passed_you_note_e5a1a8: "他给你传纸条了吗？"
  npc_override_harboro1_quests_rockridge_he_probably_hasn_t_heard_9d87ea: "他可能还没听说。"
  npc_override_harboro1_quests_rockridge_he_probably_thought_albe_86f101: "他可能以为阿尔伯特背叛了他。"
  npc_override_harboro1_quests_rockridge_he_probably_wants_us_exc_e7251a: "他可能想让我们用他交换矿石。"
  npc_override_harboro1_quests_rockridge_he_ran_save_himself_chuc_a5d640: "他为了自己逃跑了。*轻笑*"
  npc_override_harboro1_quests_rockridge_he_reminds_me_myself_whe_0df13b: "他让我想起了五岁的自己。我觉得我们可以信任他。"
  npc_override_harboro1_quests_rockridge_he_s_asleep_covered_dirt_51ea16: "- 他睡着了，浑身是土，好像在地上滚过一样。我不应该叫醒他。-"
  npc_override_harboro1_quests_rockridge_he_s_been_following_me_8e21d1: "从那以后他一直跟着我。"
  npc_override_harboro1_quests_rockridge_he_s_cute_60354c: "他很可爱。"
  npc_override_harboro1_quests_rockridge_he_s_full_mining_gear_bf89ac: "他穿着全套采矿装备，却连普通石头和矿脉都分不清。他有多蠢？"
  npc_override_harboro1_quests_rockridge_he_s_happy_why_you_1e2fda: "他很高兴。你为什么叹气？"
  npc_override_harboro1_quests_rockridge_he_s_helping_us_catch_acf92b: "他在帮我们抓阿尔伯特。"
  npc_override_harboro1_quests_rockridge_he_s_here_only_because_9725a2: "他在这里只是因为总部把他留在这里。"
  npc_override_harboro1_quests_rockridge_he_s_here_see_when_8a111c: "他在这里看你们什么时候终于会被绞死。"
  npc_override_harboro1_quests_rockridge_he_s_shedding_lot_hair_be3136: "- 他掉了很多毛。他走到哪里都会留下白毛。-"
  npc_override_harboro1_quests_rockridge_he_s_so_loud_cf90f8: "他太吵了。"
  npc_override_harboro1_quests_rockridge_he_s_stupid_even_he_791201: "他很蠢，但即使他也知道那意味着什么。"
  npc_override_harboro1_quests_rockridge_he_s_turning_everyone_el_83ee79: "而且他正在把其他人都变成他的敌人，这样他就能成为他们的老大。"
  npc_override_harboro1_quests_rockridge_he_s_useless_as_hostage_d389dc: "他作为人质毫无用处。"
  npc_override_harboro1_quests_rockridge_he_said_he_d_sell_1e2f56: "他说他会以一百万 Zeny 的价格把矿石卖给我们。"
  npc_override_harboro1_quests_rockridge_he_said_he_something_imp_1e97e0: "他说他有重要的事要告诉你。"
  npc_override_harboro1_quests_rockridge_he_still_hasn_t_told_8f8dd8: "他还没告诉我们被偷的矿石在哪里。"
  npc_override_harboro1_quests_rockridge_he_t_even_trust_his_788070: "他连自己的人都信不过，对吧？"
  npc_override_harboro1_quests_rockridge_he_thinks_you_ve_betraye_ab3321: "他认为你背叛了他，因为……你知道的？你丢下他自己跑了。"
  npc_override_harboro1_quests_rockridge_he_told_us_where_ores_7b8e01: "他确实告诉我们矿石在哪里了，但我们还没有履行我们的承诺。"
  npc_override_harboro1_quests_rockridge_he_wants_johnny_hanged_a_9ce35c: "他想让约翰尼被当众绞死，让全世界都看到。"
  npc_override_harboro1_quests_rockridge_he_wants_solve_everythin_ca969f: "他想用钱解决一切？用别人的钱。"
  npc_override_harboro1_quests_rockridge_he_way_place_changed_lot_fd99f6: "是吗？对了，这个地方变化很大。"
  npc_override_harboro1_quests_rockridge_hear_our_office_severely_d77919: "听到了吗？我们的办公室严重缺人。"
  npc_override_harboro1_quests_rockridge_hear_s_his_way_saying_5bbc1d: "听到了吗？这是他表达爱我的方式。"
  npc_override_harboro1_quests_rockridge_hell_they_re_reason_vill_1a7a5d: "见鬼，这个村子就是因为他们才存在的。"
  npc_override_harboro1_quests_rockridge_hello_9b56d5: "你好。"
  npc_override_harboro1_quests_rockridge_hello_promising_adventur_7aab7e: "你好，有前途的冒险者！要不要我给你介绍一个新的探索地点？"
  npc_override_harboro1_quests_rockridge_hello_there_problem_b7f9d5: "你好。有什么问题吗？"
  npc_override_harboro1_quests_rockridge_hello_up_coming_adventur_befd88: "你好，崭露头角的冒险者！"
  npc_override_harboro1_quests_rockridge_hello_you_new_place_you_096ca1: "你好。你是新来的吗？你要^FF0000至少达到100级^000000才能在这里舒舒服服地待着？"
  npc_override_harboro1_quests_rockridge_help_a92107: "救命。"
  npc_override_harboro1_quests_rockridge_help_him_5f1f0d: "帮他。"
  npc_override_harboro1_quests_rockridge_help_me_again_e6a266: "再帮我一次？"
  npc_override_harboro1_quests_rockridge_help_your_village_get_se_a8afd9: "先帮你的村子安顿下来。"
  npc_override_harboro1_quests_rockridge_her_gifts_d2fbdf: "为了她的礼物，"
  npc_override_harboro1_quests_rockridge_here_pick_one_you_like_675077: "来，挑一个你喜欢的。"
  npc_override_harboro1_quests_rockridge_here_s_rock_ridge_coin_3914ff: "这是我们承诺的岩脊镇硬币。谢谢你帮我们在荒原搜索。"
  npc_override_harboro1_quests_rockridge_here_take_238729: "来，拿着。"
  npc_override_harboro1_quests_rockridge_here_you_ve_earned_a063e0: "来，这是你应得的。"
  npc_override_harboro1_quests_rockridge_hey_boss_i_told_you_c4a173: "嘿老大，我告诉过你别丢下我。"
  npc_override_harboro1_quests_rockridge_hey_buddy_you_look_prett_3f285c: "嘿，伙计。你看起来挺强壮的。你是来干活的，对吧？"
  npc_override_harboro1_quests_rockridge_hey_come_i_m_finished_dfc085: "嘿，拜托！我还没说完！"
  npc_override_harboro1_quests_rockridge_hey_did_you_guys_fight_4e983b: "嘿，你们打架了吗？"
  npc_override_harboro1_quests_rockridge_hey_did_you_just_get_9f7b57: "嘿，你刚被放出来吗？我们也是！事实上，我们在那里见过。我大部分最好的朋友都是在里面认识的。"
  npc_override_harboro1_quests_rockridge_hey_don_t_you_see_ab7b2a: "嘿，你没看到那边的队伍吗？我不管你是谁？想吃饭就去排队。"
  npc_override_harboro1_quests_rockridge_hey_hey_cb8cdd: "嘿，嘿！"
  npc_override_harboro1_quests_rockridge_hey_how_d_you_like_d753ce: "嘿，你想买点面包吗？"
  npc_override_harboro1_quests_rockridge_hey_i_m_having_important_9af53c: "嘿，我正在开一个重要会议。滚开！"
  npc_override_harboro1_quests_rockridge_hey_jamie_how_many_more_455696: "嘿，杰米！你说下水道还需要多少工人？"
  npc_override_harboro1_quests_rockridge_hey_johnny_your_friend_l_699dc5: "嘿约翰尼，你的朋友丢下你了。"
  npc_override_harboro1_quests_rockridge_hey_kid_asking_you_quest_cda4ff: "嘿，有个小孩在问你问题。他看起来好奇得不得了，我担心你不回答他他会死。"
  npc_override_harboro1_quests_rockridge_hey_kiddo_how_d_you_e7cd4f: "嘿，小鬼。你想不想和我们一起做生意？"
  npc_override_harboro1_quests_rockridge_hey_kiddo_s_very_nice_ae2b1d: "嘿，小鬼！很高兴又见到你。用你带来的材料做的炸弹正在陈化过程中。你知道葡萄酒和炸弹都是越陈越香吗？"
  npc_override_harboro1_quests_rockridge_hey_kiddo_you_mind_helpi_768d69: "嘿小鬼，你明天介意再帮我一次吗？我需要不止一个炸弹来举办烟花派对。"
  npc_override_harboro1_quests_rockridge_hey_look_c536ee: "嘿，看，"
  npc_override_harboro1_quests_rockridge_hey_may_i_talk_you_9d88c7: "嘿，我能和你谈一下吗？"
  npc_override_harboro1_quests_rockridge_hey_s_nice_i_didn_8a6601: "嘿，这样不好。我救你可不是为了让你叫我混蛋。"
  npc_override_harboro1_quests_rockridge_hey_stop_swinging_pickax_620cdc: "嘿，别挥那把镐了！"
  npc_override_harboro1_quests_rockridge_hey_we_re_hiring_6323df: "嘿，我们不招人。"
  npc_override_harboro1_quests_rockridge_hey_welcome_back_75cd33: "嘿，欢迎回来。"
  npc_override_harboro1_quests_rockridge_hey_why_t_you_give_29c20e: "嘿，为什么你不能给我贷款？"
  npc_override_harboro1_quests_rockridge_hey_you_crazy_3a0461: "嘿，你疯了吗？！"
  npc_override_harboro1_quests_rockridge_hey_you_re_my_space_b53e81: "嘿，你占了我的地方。让开，好吗？"
  npc_override_harboro1_quests_rockridge_hiccups_cheers_nya_nya_f1a77a: "*打嗝* 干杯！喵——喵！"
  npc_override_harboro1_quests_rockridge_hiccups_i_drink_beer_all_31f2a4: "*打嗝* 我可以整天喝啤酒！"
  npc_override_harboro1_quests_rockridge_hiccups_they_robbed_me_c_721346: "*打嗝* 他们把我抢得一干二净。我连喝一杯卡鲁纳牛奶的钱都不够了。"
  npc_override_harboro1_quests_rockridge_his_spy_outside_window_e_ad73ba: "他窗外的间谍甚至用手指比枪指着我！"
  npc_override_harboro1_quests_rockridge_hm_i_don_t_think_b9704c: "嗯，我觉得你没有足够的钱付路费。"
  npc_override_harboro1_quests_rockridge_hm_i_meant_as_joke_3c20d5: "嗯，我是开玩笑的，但也许她真的害怕了。"
  npc_override_harboro1_quests_rockridge_hm_i_understand_4f6188: "嗯……我明白了。"
  npc_override_harboro1_quests_rockridge_hm_you_don_t_cb4b2f: "嗯，你没有"
  npc_override_harboro1_quests_rockridge_hm_you_ve_brought_7cf3b7: "嗯，你带来了"
  npc_override_harboro1_quests_rockridge_hmm_isn_t_bad_idea_212748: "嗯，这不是个坏主意。"
  npc_override_harboro1_quests_rockridge_hmpf_40a0b0: "哼。"
  npc_override_harboro1_quests_rockridge_hmpf_don_t_you_want_b971b8: "哼，你不想要回你的矿石了吗？！"
  npc_override_harboro1_quests_rockridge_hmpf_we_may_lost_battle_c42527: "哼，我们这次可能输给了你，"
  npc_override_harboro1_quests_rockridge_hmpf_why_you_so_heartles_414adb: "哼，你为什么这么无情？"
  npc_override_harboro1_quests_rockridge_hmpf_you_re_working_hard_c6b046: "哼，你不够努力。啧，啧。"
  npc_override_harboro1_quests_rockridge_ho_ho_ho_there_s_dae39c: "呵呵呵，村子里没有一张渔网我没碰过。"
  npc_override_harboro1_quests_rockridge_hold_rail_if_you_don_ca6fce: "不想被浪卷走就抓紧栏杆！"
  npc_override_harboro1_quests_rockridge_holy_crap_yeah_25fe93: "天哪，是啊。"
  npc_override_harboro1_quests_rockridge_honey_did_spotty_take_my_ec9538: "亲爱的！点点拿了我的手表吗？"
  npc_override_harboro1_quests_rockridge_honey_you_even_listening_c61878: "亲爱的！你有没有在听我说话？！"
  npc_override_harboro1_quests_rockridge_honey_you_should_least_f_b1496a: "亲爱的，你至少应该跟着冒险者走到门口，这样你就能告诉他去哪里找。"
  npc_override_harboro1_quests_rockridge_house_sank_little_little_1269e2: "这栋房子一点一点地往下沉，直到地面再也承受不住它的重量。"
  npc_override_harboro1_quests_rockridge_houses_closer_beach_alwa_ee75d8: "靠近海滩的房子一直容易下沉，早在第一层被填埋之前就是这样。"
  npc_override_harboro1_quests_rockridge_how_about_i_show_you_ee6f96: "要不我给你看看你能为我们做什么的清单？如果你感兴趣，晚点再来。我保证会慷慨地付给你报酬。"
  npc_override_harboro1_quests_rockridge_how_did_go_560715: "怎么样？"
  npc_override_harboro1_quests_rockridge_how_did_i_end_up_e00e3d: "我怎么到这里来的？"
  npc_override_harboro1_quests_rockridge_how_did_negotiation_go_9b480d: "谈判怎么样了？"
  npc_override_harboro1_quests_rockridge_how_did_you_know_passwor_3ff04d: "你怎么知道只有老大和我知道的暗号？"
  npc_override_harboro1_quests_rockridge_how_exorbitant_4a23fb: "太离谱了！"
  npc_override_harboro1_quests_rockridge_how_getting_rid_sea_anem_e95fae: "消灭海葵怎么样？"
  npc_override_harboro1_quests_rockridge_how_i_get_mine_e50ea4: "我怎么去矿？"
  npc_override_harboro1_quests_rockridge_how_i_help_a40ffb: "- 我能怎么帮忙？"
  npc_override_harboro1_quests_rockridge_how_long_we_wait_around_c22267: "我们还要等多久？"
  npc_override_harboro1_quests_rockridge_how_many_gasters_did_you_acfb8b: "你消灭了多少个气态怪？"
  npc_override_harboro1_quests_rockridge_how_many_times_i_tell_469e4f: "我要告诉你多少次让你把你的狗离我们的东西远点？你真的想让我把它送上船送走吗？"
  npc_override_harboro1_quests_rockridge_how_s_albert_01d522: "阿尔伯特怎么样？"
  npc_override_harboro1_quests_rockridge_how_s_going_8e2ed1: "怎么样？"
  npc_override_harboro1_quests_rockridge_how_tomorrow_sound_day_a_0028c0: "明天怎么样？或者后天？"
  npc_override_harboro1_quests_rockridge_hq_decided_dccdb8: "总部已经决定"
  npc_override_harboro1_quests_rockridge_huh_73fef0: "嗯？"
  npc_override_harboro1_quests_rockridge_huh_no_4e21e5: "嗯？不。"
  npc_override_harboro1_quests_rockridge_huh_sure_no_problem_1d110d: "嗯？当然，没问题。"
  npc_override_harboro1_quests_rockridge_huh_yes_way_i_guess_1529db: "嗯？是的，某种意义上，我想是的。"
  npc_override_harboro1_quests_rockridge_huh_you_want_help_us_eaf7bd: "嗯？你想帮我们。谢谢，但不用了，谢谢。我们付不起钱。"
  npc_override_harboro1_quests_rockridge_hunt_gasters_before_i_ge_865a5f: "在我进去之前消灭^FF000020个气态怪^000000。"
  npc_override_harboro1_quests_rockridge_hunt_just_gasters_there_3e5224: "只消灭15个气态怪。不用急。你可以慢慢来。只要今天结束前回来。我想再见到你。"
  npc_override_harboro1_quests_rockridge_hurting_nature_should_ne_466463: "伤害大自然永远不应该是一场游戏。这些冒险者只猎杀足够数量的郊狼来保证我们的安全。"
  npc_override_harboro1_quests_rockridge_i_583fdb: "是我吗？"
  npc_override_harboro1_quests_rockridge_i_a5260d: "我有{0}"
  npc_override_harboro1_quests_rockridge_i_agree_our_heart_our_bd03a0: "我同意我们的心就是我们的教堂。"
  npc_override_harboro1_quests_rockridge_i_already_know_what_he_8ccda9: "我已经知道他要说什么了，但他是镇长；至少他得知道发生了什么。"
  npc_override_harboro1_quests_rockridge_i_another_lock_your_mane_debd81: "我能再要一撮你的鬃毛吗？"
  npc_override_harboro1_quests_rockridge_i_applaud_you_your_brave_4e86e8: "我为你的勇敢和智慧鼓掌。"
  npc_override_harboro1_quests_rockridge_i_asked_52bc07: "我问了。"
  npc_override_harboro1_quests_rockridge_i_asked_yes_no_oh_741782: "我问你是或否。算了，我就当你是同意了。"
  npc_override_harboro1_quests_rockridge_i_asked_you_hunt_coyotes_6bc17f: "我让你消灭30只郊狼。你消灭了多少？"
  npc_override_harboro1_quests_rockridge_i_assume_you_came_all_6303cf: "我猜你大老远从大陆来是有原因的。"
  npc_override_harboro1_quests_rockridge_i_barely_understand_his_059999: "（我几乎听不懂他的英语。）"
  npc_override_harboro1_quests_rockridge_i_believe_one_small_chan_19f695: "但我相信每天一点小改变最终能带来巨大的不同。"
  npc_override_harboro1_quests_rockridge_i_believe_universe_broug_b04048: "我相信宇宙把你带到我们身边是神意的安排。你介意再帮我一个忙吗？"
  npc_override_harboro1_quests_rockridge_i_came_here_because_i_7e437d: "我来这里是因为听说可以很快发财，喵。"
  npc_override_harboro1_quests_rockridge_i_came_here_first_invite_2972e4: "我先来的，然后邀请她过来。"
  npc_override_harboro1_quests_rockridge_i_came_negotiate_you_7f5396: "我来和你谈判。"
  npc_override_harboro1_quests_rockridge_i_came_tell_you_a6d293: "我来告诉你这个。"
  npc_override_harboro1_quests_rockridge_i_came_tell_you_what_192f87: "我来告诉你总部的决定。"
  npc_override_harboro1_quests_rockridge_i_come_here_when_i_be3948: "是吗？我想念过去的时候会来这里，但这里太黑了。对了，为什么变得这么湿？"
  npc_override_harboro1_quests_rockridge_i_cook_pumpkin_stew_i_e5f46c: "我得做南瓜炖菜，但没有南瓜。这相当于做吐司没有面包。"
  npc_override_harboro1_quests_rockridge_i_could_always_use_help_18a207: "我总是需要人帮忙消灭海葵。"
  npc_override_harboro1_quests_rockridge_i_d417f8: "但我会"
  npc_override_harboro1_quests_rockridge_i_d_better_get_involved_fc7e49: "（我最好别掺和。我厌倦了收拾别人的烂摊子。）"
  npc_override_harboro1_quests_rockridge_i_d_better_get_rid_2aa5be: "我最好消灭足够多的野牛匪帮，足以吓到阿尔伯特·福特。"
  npc_override_harboro1_quests_rockridge_i_d_better_lighten_my_105d81: "- 我最好先减轻背包重量再跟他谈。-"
  npc_override_harboro1_quests_rockridge_i_d_better_train_our_8e2e34: "我最好更努力地训练我们的自卫队。"
  npc_override_harboro1_quests_rockridge_i_d_hate_go_back_ad26ec: "我不想空手回家。"
  npc_override_harboro1_quests_rockridge_i_d_like_thank_you_b791db: "我代表岩脊镇和我的公司感谢你。"
  npc_override_harboro1_quests_rockridge_i_d_like_you_3aa532: "我想让你"
  npc_override_harboro1_quests_rockridge_i_d_love_piece_meat_822a7f: "我很想尝一块那个肉。"
  npc_override_harboro1_quests_rockridge_i_d_motivated_work_harde_3fedb3: "如果你给我涨工资，我会更有动力努力工作。"
  npc_override_harboro1_quests_rockridge_i_didn_t_know_there_eff902: "我不知道这里没有草。"
  npc_override_harboro1_quests_rockridge_i_don_t_box_ores_4e8789: "我没有一箱矿石可以给阿尔伯特·福特看。"
  npc_override_harboro1_quests_rockridge_i_don_t_care_how_95a92a: "我不在乎你怎么做，只要你做了就行。"
  npc_override_harboro1_quests_rockridge_i_don_t_care_if_d5b863: "我不在乎。如果我明天不能工作，那我就走出这里！"
  npc_override_harboro1_quests_rockridge_i_don_t_enough_brown_a9273a: "（我没有足够的棕色围巾和匪帮围巾来威胁阿尔伯特·福特。）"
  npc_override_harboro1_quests_rockridge_i_don_t_feel_good_33e3ab: "我对……感觉不太好"
  npc_override_harboro1_quests_rockridge_i_don_t_know_i_6dff45: "我不知道，但我厌倦了无所事事。这不可能是我们旅程的终点！"
  npc_override_harboro1_quests_rockridge_i_don_t_know_i_ecf95e: "我不知道，我也不在乎！"
  npc_override_harboro1_quests_rockridge_i_don_t_know_much_c2252b: "我知道的不多，只知道这座城市需要能干的冒险者的帮助。"
  npc_override_harboro1_quests_rockridge_i_don_t_know_what_ffc662: "我不知道他们会要求什么来交换矿石，"
  npc_override_harboro1_quests_rockridge_i_don_t_like_waiting_a3ead5: "我不喜欢等待。"
  npc_override_harboro1_quests_rockridge_i_don_t_need_5ea6ec: "而且我不需要它。"
  npc_override_harboro1_quests_rockridge_i_don_t_need_more_51b37c: "我不需要更多矿石。"
  npc_override_harboro1_quests_rockridge_i_don_t_need_so_9f3504: "但我不需要这么多。"
  npc_override_harboro1_quests_rockridge_i_don_t_search_farther_5dfd1e: "- 我不需要搜得更远了。-"
  npc_override_harboro1_quests_rockridge_i_don_t_think_bandits_4273f7: "而且我觉得匪帮不知道这件事。"
  npc_override_harboro1_quests_rockridge_i_don_t_use_right_9a4b6e: "我现在不需要用这个。"
  npc_override_harboro1_quests_rockridge_i_don_t_want_impose_a048ae: "我不想麻烦你的好意，但你能帮我消灭^0000CD30^000000只^0000CD郊狼^000000吗？"
  npc_override_harboro1_quests_rockridge_i_don_t_want_talk_5e80bb: "我不想谈这个。我犯了那么多愚蠢的错误，完全不像我。这就是为什么我们躲在这个黑暗潮湿的地方。"
  npc_override_harboro1_quests_rockridge_i_doubt_you_could_find_70d37b: "我怀疑你找不到全部7包。至少有几包肯定已经被撕破洒出来了。"
  npc_override_harboro1_quests_rockridge_i_e38e9f: "我愿意。"
  npc_override_harboro1_quests_rockridge_i_especially_like_drinki_6f5756: "我特别喜欢在白天喝它！"
  npc_override_harboro1_quests_rockridge_i_fbf810: "我可以做到。"
  npc_override_harboro1_quests_rockridge_i_feel_as_if_i_b6a5ea: "我感觉我应该帮它们堆雪人。"
  npc_override_harboro1_quests_rockridge_i_feel_happy_just_lookin_b0f1f9: "光是看着火车站我就感到开心。它是我们村子的象征，你知道的。"
  npc_override_harboro1_quests_rockridge_i_fought_tooth_nail_prot_75c2fc: "我拼命保护我的杂货。除了我儿子喜欢的龙舌兰饮料粉，我大部分东西都保住了。"
  npc_override_harboro1_quests_rockridge_i_go_5f240e: "我可以去。"
  npc_override_harboro1_quests_rockridge_i_going_tell_you_about_5e7cc8: "我本来要告诉你一个新大陆的事，但如果你不想知道，那就算了。"
  npc_override_harboro1_quests_rockridge_i_got_ship_rock_ridge_96ab89: "我一从帕斯塔下船就上了去岩脊镇的船。"
  npc_override_harboro1_quests_rockridge_i_guess_i_ll_stay_c25a08: "我想我得在码头多待一会儿。"
  npc_override_harboro1_quests_rockridge_i_had_my_favorite_bean_3da0d6: "我今天早餐吃了我最喜欢的豆子菜。我不能失去它。我想让它成为我的一部分。"
  npc_override_harboro1_quests_rockridge_i_had_so_much_fun_39db19: "我小时候玩得很开心，但我的孩子从未体验过任何那种快乐。如今，每个人都太忙了，没时间聚会或通宵唱歌跳舞。"
  npc_override_harboro1_quests_rockridge_i_haven_t_been_able_fa42e0: "我一直没能好好喂我的孩子。我都不记得他上次吃顿像样的饭是什么时候了。"
  npc_override_harboro1_quests_rockridge_i_help_ad8459: "我可以帮忙。"
  npc_override_harboro1_quests_rockridge_i_hid_entrance_just_case_bdc3fe: "我把入口藏起来了，以防万一。"
  npc_override_harboro1_quests_rockridge_i_hope_i_understand_him_8d6840: "我希望等我长得和他一样高的时候，能更好地理解他。"
  npc_override_harboro1_quests_rockridge_i_hope_my_opinion_helpfu_8538d9: "希望我的意见对你有帮助！"
  npc_override_harboro1_quests_rockridge_i_hope_they_d_leave_7bd982: "我希望他们能给我留点食物。"
  npc_override_harboro1_quests_rockridge_i_hope_things_village_se_6f683d: "我希望村子里的情况能尽快安定下来，从这条队伍开始。"
  npc_override_harboro1_quests_rockridge_i_hope_you_ll_enjoy_8f0f4d: "希望你享受探索这个美妙的地方。"
  npc_override_harboro1_quests_rockridge_i_hope_you_ll_find_25e756: "希望你在这片梦想之地找到你的机会。"
  npc_override_harboro1_quests_rockridge_i_hope_you_ll_lose_a1f63d: "希望你这次别再弄丢了。"
  npc_override_harboro1_quests_rockridge_i_hope_you_ll_make_780775: "希望你能做出正确的决定。"
  npc_override_harboro1_quests_rockridge_i_i_ll_counting_you_2c8493: "我——我就指望你了，冒险者。"
  npc_override_harboro1_quests_rockridge_i_i_ll_go_bring_883158: "我——我去把其他帮派成员带来！"
  npc_override_harboro1_quests_rockridge_i_i_love_working_loading_433eab: "我——我喜欢在这个装卸码头工作。这是我做过的最好的工作！"
  npc_override_harboro1_quests_rockridge_i_i_m_captain_adventurer_2af605: "我——我是冒险者队长！我要消灭一百——一百——一百——一百只郊狼！"
  npc_override_harboro1_quests_rockridge_i_imagine_how_buffaloes_28de03: "我能想象野牛们会是什么反应。"
  npc_override_harboro1_quests_rockridge_i_joking_f37c78: "我开玩笑的。"
  npc_override_harboro1_quests_rockridge_i_knew_d_you_instead_801bdc: "我就知道会是你而不是他。"
  npc_override_harboro1_quests_rockridge_i_knocked_signaling_rock_06afb2: "我敲了信号石，阿尔伯特·福特就跑出来了。"
  npc_override_harboro1_quests_rockridge_i_know_about_buffalo_ban_152583: "我知道野牛匪帮的事。"
  npc_override_harboro1_quests_rockridge_i_know_costello_still_yo_336de8: "我知道科斯特洛仍然是你们的镇长，因为我查过了！"
  npc_override_harboro1_quests_rockridge_i_know_fact_no_one_4c6402: "而且我知道现在没有人会免费帮忙。"
  npc_override_harboro1_quests_rockridge_i_know_litis_i_m_17970b: "我知道，利蒂斯。我只是个倔强的老骡子。"
  npc_override_harboro1_quests_rockridge_i_know_there_s_albert_dd4be8: "我知道。有阿尔伯特。"
  npc_override_harboro1_quests_rockridge_i_know_you_mean_well_a8b120: "我知道你是好意，"
  npc_override_harboro1_quests_rockridge_i_like_being_new_places_7ac7b1: "我喜欢去新地方和当地居民聊天。我可以从他们的生活方式中学到很多东西。"
  npc_override_harboro1_quests_rockridge_i_liked_food_too_i_4044f2: "我也喜欢那里的食物。我以前讨厌豆子，直到进了监狱。我吃过的所有豆子都不如监狱里的好吃。"
  npc_override_harboro1_quests_rockridge_i_ll_alright_we_all_c6098f: "我会没事的。我们都长得一样？他们不会知道我不是他们的人。"
  npc_override_harboro1_quests_rockridge_i_ll_appreciate_if_you_378faa: "如果你能从今天开始每天都帮我，我会很感激的。"
  npc_override_harboro1_quests_rockridge_i_ll_check_pulley_we_c73c63: "我会检查我们回去要用的滑轮。"
  npc_override_harboro1_quests_rockridge_i_ll_counting_you_a444e1: "我就指望你了！"
  npc_override_harboro1_quests_rockridge_i_ll_counting_you_strang_0e4a30: "我就指望你了，陌生人。"
  npc_override_harboro1_quests_rockridge_i_ll_give_shawn_c4be78: "我会给肖恩的。"
  npc_override_harboro1_quests_rockridge_i_ll_give_you_special_c650c8: "我给你打个特别折扣。这个羽毛饰品只要两百万 Zeny。这条手帕——哦，哇！——只要五百万！"
  npc_override_harboro1_quests_rockridge_i_ll_go_while_everyone_8a5c5a: "我会在大家都睡着的时候去。"
  npc_override_harboro1_quests_rockridge_i_ll_here_somewhere_case_217f7f: "如果你需要我，我会在这附近的某个地方。"
  npc_override_harboro1_quests_rockridge_i_ll_kill_you_all_a2c9cd: "我要杀了你们！所有人！"
  npc_override_harboro1_quests_rockridge_i_ll_let_sheriff_warp_fbc74b: "我让警长沃普来处理这件事。"
  npc_override_harboro1_quests_rockridge_i_ll_let_you_come_bc8c4b: "如果你答应我不告诉地面上任何人我们的事，我就让你自由出入。答应吗？"
  npc_override_harboro1_quests_rockridge_i_ll_let_you_handle_1f83e8: "我让你来处理和阿尔伯特的谈判。"
  npc_override_harboro1_quests_rockridge_i_ll_meet_you_here_954267: "我晚点在这里再和你见面。"
  npc_override_harboro1_quests_rockridge_i_ll_move_rest_someplace_437bbd: "我会把剩下的搬到别的地方。"
  npc_override_harboro1_quests_rockridge_i_ll_pay_you_good_9ec31e: "我会给你丰厚的报酬。你随时都受欢迎。"
  npc_override_harboro1_quests_rockridge_i_ll_really_appreciate_i_f663d9: "如果你能再帮我一段时间，我真的会非常感激。你激励我更加努力地为我的儿子创造更好的生活。"
  npc_override_harboro1_quests_rockridge_i_ll_repay_you_please_416aa5: "我会报答你的。拜托？"
  npc_override_harboro1_quests_rockridge_i_ll_talk_costello_09e20a: "我去和科斯特洛谈谈。"
  npc_override_harboro1_quests_rockridge_i_ll_tell_you_password_1fe56e: "我会告诉你用来把他从藏身处叫出来的暗号。"
  npc_override_harboro1_quests_rockridge_i_ll_tell_you_where_0820ef: "之后我会告诉你矿石在哪里。"
  npc_override_harboro1_quests_rockridge_i_ll_tell_you_where_a8f3c1: "我会告诉你矿石在哪里"
  npc_override_harboro1_quests_rockridge_i_ll_use_every_ounce_c4fd44: "我会用我全身的每一丝能量把他的教诲传播给这片新土地的人民！"
  npc_override_harboro1_quests_rockridge_i_ll_wait_here_828546: "我在这里等。"
  npc_override_harboro1_quests_rockridge_i_ll_waiting_bc318a: "我会等着的。"
  npc_override_harboro1_quests_rockridge_i_love_agave_flavored_ju_5ed7de: "我喜欢龙舌兰口味果汁。我想每天都喝。"
  npc_override_harboro1_quests_rockridge_i_love_these_new_musical_8977f4: "我喜欢这些新乐器！"
  npc_override_harboro1_quests_rockridge_i_love_traveling_i_had_3b3295: "我喜欢旅行。我在帕斯塔旅行很开心，我决心在卢恩-米德加尔特和从王国可以到达的其他城市和村庄度过我的余生。"
  npc_override_harboro1_quests_rockridge_i_m_abraham_iven_hudin_c8ba74: "我是亚伯拉罕·伊文·胡丁。我 originally 来自不同的国家。"
  npc_override_harboro1_quests_rockridge_i_m_adventurer_i_m_91d2ca: "我是冒险者，我是代表她来的。"
  npc_override_harboro1_quests_rockridge_i_m_adventurer_i_wonderi_538e47: "我是冒险者。我想知道你是否需要帮助。"
  npc_override_harboro1_quests_rockridge_i_m_as_resolved_complete_a3653a: "但我完成任务的决心和我第一天来到这里时一样坚定。"
  npc_override_harboro1_quests_rockridge_i_m_ashamed_6e6f73: "- 我为此感到羞耻。"
  npc_override_harboro1_quests_rockridge_i_m_best_coyote_hunting_2ee835: "我是最厉害的郊狼猎手冒险者！我要消灭一百只郊狼！"
  npc_override_harboro1_quests_rockridge_i_m_busy_5300b0: "我很忙。"
  npc_override_harboro1_quests_rockridge_i_m_captain_adventurer_i_dc998a: "我是冒险者队长！我要消灭一百只郊狼！"
  npc_override_harboro1_quests_rockridge_i_m_carrying_too_many_468846: "我带的东西种类太多了。我应该先减轻背包重量。"
  npc_override_harboro1_quests_rockridge_i_m_cautious_because_i_e313c6: "我很谨慎，因为我不想让匪帮发现这个入口。"
  npc_override_harboro1_quests_rockridge_i_m_charge_case_ec08a9: "我负责这个案子。"
  npc_override_harboro1_quests_rockridge_i_m_costello_mayor_rock_60ba91: "我是科斯特洛，岩脊镇的镇长。"
  npc_override_harboro1_quests_rockridge_i_m_coyote_hunting_adven_e01daf: "我是郊狼猎手冒险者！"
  npc_override_harboro1_quests_rockridge_i_m_crouched_horse_656773: "我是弯马，"
  npc_override_harboro1_quests_rockridge_i_m_dock_personal_safety_9babca: "我在码头是出于个人安全问题，"
  npc_override_harboro1_quests_rockridge_i_m_glad_i_too_d9c6c2: "我很高兴我太害怕了没有装货。如果点点闻到火药味，它就不会回家了。"
  npc_override_harboro1_quests_rockridge_i_m_glad_you_came_e71803: "很高兴你安全到达这里。"
  npc_override_harboro1_quests_rockridge_i_m_going_back_home_17831b: "不成为百万富翁我绝不回家！"
  npc_override_harboro1_quests_rockridge_i_m_going_let_my_cf9455: "我不会让身体的疲惫妨碍我。"
  npc_override_harboro1_quests_rockridge_i_m_going_talk_sheriff_4a2182: "我要去找警长沃普谈谈你的事。"
  npc_override_harboro1_quests_rockridge_i_m_going_tell_costello_cad973: "我要告诉科斯特洛多招募一些像你这样的冒险者！"
  npc_override_harboro1_quests_rockridge_i_m_going_tell_you_bb0943: "但在我除掉他之前，我不会告诉你矿石的位置。"
  npc_override_harboro1_quests_rockridge_i_m_guessing_albert_ford_4e1f7b: "我猜阿尔伯特·福特很快就会想和我们谈谈。"
  npc_override_harboro1_quests_rockridge_i_m_headquarters_6b08c4: "我来自总部。"
  npc_override_harboro1_quests_rockridge_i_m_here_because_i_f9cc2e: "我在这里是因为无处可去，但等那些占据矿里的人走了，我就会上去。"
  npc_override_harboro1_quests_rockridge_i_m_here_c66f6d: "我在这里。"
  npc_override_harboro1_quests_rockridge_i_m_here_eat_638ad0: "我不是来吃饭的。"
  npc_override_harboro1_quests_rockridge_i_m_here_her_behalf_b8b64b: "我是代表她来的。如果你继续这么固执，"
  npc_override_harboro1_quests_rockridge_i_m_i_m_14e6ba: "我加入！我加入！"
  npc_override_harboro1_quests_rockridge_i_m_joking_you_d_23028f: "……我开玩笑的。但你最好先减轻背包重量。除非你有家人要养，否则带这么多东西是适得其反的。"
  npc_override_harboro1_quests_rockridge_i_m_just_passersby_d01d24: "我只是个路人。"
  npc_override_harboro1_quests_rockridge_i_m_looking_into_how_80beaa: "我正在研究如何利用这个地方。"
  npc_override_harboro1_quests_rockridge_i_m_messing_you_breathe_15f1ca: "我逗你玩的。深呼吸。"
  npc_override_harboro1_quests_rockridge_i_m_okay_as_long_4ff974: "我没事，只要你不想当镇长。"
  npc_override_harboro1_quests_rockridge_i_m_overweight_i_d_50e3b6: "我超重了。我最好先减轻背包重量。"
  npc_override_harboro1_quests_rockridge_i_m_pretty_little_too_7130c5: "我也又漂亮又小巧。"
  npc_override_harboro1_quests_rockridge_i_m_pretty_sure_i_49e975: "我很确定我没见过你。你背着一个很重的包。怎么，你需要什么来固定自己吗，因为风太大了？"
  npc_override_harboro1_quests_rockridge_i_m_pretty_sure_i_8682c9: "我很确定我没见过你。什么风把你吹到这个村子来的？"
  npc_override_harboro1_quests_rockridge_i_m_pretty_sure_you_b40ccb: "但我很确定你知道。"
  npc_override_harboro1_quests_rockridge_i_m_ready_go_patrol_ce2c5b: "我准备好去巡逻了。你完成后告诉我。"
  npc_override_harboro1_quests_rockridge_i_m_ready_meeting_8a1e58: "我准备好开会了。"
  npc_override_harboro1_quests_rockridge_i_m_really_good_my_6b7e06: "我的手很巧，而且我喜欢烟花。你觉得像我这样的人最适合做什么工作？"
  npc_override_harboro1_quests_rockridge_i_m_really_grateful_ever_9a199f: "我真的很感激你所做的一切，而且……而且……"
  npc_override_harboro1_quests_rockridge_i_m_responsible_all_tran_3c4fb1: "我要为因误识别造成的所有交易错误负责。请，你得理解我。"
  npc_override_harboro1_quests_rockridge_i_m_running_out_103de0: "我的……快用完了"
  npc_override_harboro1_quests_rockridge_i_m_safe_as_long_71763d: "只要你是代理镇长，我就安全。"
  npc_override_harboro1_quests_rockridge_i_m_saying_you_should_75eb37: "我是说你应该像对朋友一样对他们好。"
  npc_override_harboro1_quests_rockridge_i_m_sorry_guys_i_76df19: "对不起，各位。我根本不该带你们来这里……"
  npc_override_harboro1_quests_rockridge_i_m_sorry_i_d_5bdb06: "对不起。我很想帮忙，但我自己的事情已经够多了。"
  npc_override_harboro1_quests_rockridge_i_m_sorry_i_didn_7c9e68: "对不起，我不是故意对你发火的。"
  npc_override_harboro1_quests_rockridge_i_m_sorry_i_m_1aa59a: "对不起。对不起。现在你满意了吗？"
  npc_override_harboro1_quests_rockridge_i_m_sorry_i_said_daae3d: "对不起，我说了那些话。那太轻率了。"
  npc_override_harboro1_quests_rockridge_i_m_sorry_lecter_i_1e4d17: "……对不起，莱克特，但我今天没有龙舌兰口味果汁。"
  npc_override_harboro1_quests_rockridge_i_m_sorry_s_zeny_3c647f: "对不起，但住一晚要5,000 Zeny。"
  npc_override_harboro1_quests_rockridge_i_m_sure_you_find_60cacc: "我相信你可以在码头找到科斯特洛，和往常一样。"
  npc_override_harboro1_quests_rockridge_i_m_telling_you_truth_fc56e2: "我说的是实话。"
  npc_override_harboro1_quests_rockridge_i_m_thinking_we_should_b1c9ff: "我在想我们应该等到阿尔伯特联系我们开会，"
  npc_override_harboro1_quests_rockridge_i_m_tired_being_surround_e0c582: "我厌倦了被这么多水包围！这就是我们不得不不断修理地面和建筑物的原因。"
  npc_override_harboro1_quests_rockridge_i_m_tired_s_just_785021: "我累了，而且不只是身体上的疲劳。*嘟囔嘟囔*"
  npc_override_harboro1_quests_rockridge_i_m_too_busy_myself_845156: "多亏了你，我自己也不太忙了。"
  npc_override_harboro1_quests_rockridge_i_m_too_old_now_e2c9c1: "我现在太老了。"
  npc_override_harboro1_quests_rockridge_i_m_trying_blame_you_533d74: "我不是在怪你。"
  npc_override_harboro1_quests_rockridge_i_m_trying_wake_up_ce6de1: "我不是故意起晚的！"
  npc_override_harboro1_quests_rockridge_i_m_waiting_my_sister_6172c6: "我在等我妹妹。她应该在下一班船上。"
  npc_override_harboro1_quests_rockridge_i_m_watching_you_like_068e75: "我像鹰一样盯着你。"
  npc_override_harboro1_quests_rockridge_i_m_worried_we_miners_cb2d1a: "我担心我们矿工可能很长一段时间都无法工作，"
  npc_override_harboro1_quests_rockridge_i_manage_underground_wat_741077: "我管理地下水泵"
  npc_override_harboro1_quests_rockridge_i_may_able_give_my_4091fc: "我可能无法给我儿子真正的龙舌兰果汁，但我至少希望能去买他想要的东西。"
  npc_override_harboro1_quests_rockridge_i_mean_e46962: "我是说，"
  npc_override_harboro1_quests_rockridge_i_might_weapon_you_could_0b0561: "我可能有一件你可以用来对付他们其中一个人的武器，阿尔伯特·福特。"
  npc_override_harboro1_quests_rockridge_i_miss_smell_stone_floor_bed50b: "我想念石头地板的味道。还有那种凉爽。"
  npc_override_harboro1_quests_rockridge_i_moved_close_picked_up_bf70e3: "- 我走近捡起了袋子。上面有果汁粉品牌的标志。幸运的是，它没有破。-"
  npc_override_harboro1_quests_rockridge_i_my_way_back_rock_1f3008: "我今天从岩脊镇市场回来时被一些郊狼袭击了。"
  npc_override_harboro1_quests_rockridge_i_need_deadly_poison_pow_364244: "我需要10个致命毒粉和……让我看看……1个爆炸粉。"
  npc_override_harboro1_quests_rockridge_i_need_help_0dae58: "我需要帮助。"
  npc_override_harboro1_quests_rockridge_i_need_make_some_arrange_f23d0d: "我需要做一些安排。我们在那里见面。"
  npc_override_harboro1_quests_rockridge_i_need_talk_others_a5cf4e: "我需要和其他人谈谈……"
  npc_override_harboro1_quests_rockridge_i_need_time_ce66b2: "我需要时间。"
  npc_override_harboro1_quests_rockridge_i_never_said_i_wanted_ed40af: "我从没说过我想和你们合作。"
  npc_override_harboro1_quests_rockridge_i_no_chance_get_out_836d84: "我没有机会离开这里吗？"
  npc_override_harboro1_quests_rockridge_i_no_use_anymore_f7015d: "这个对我已经没用了。"
  npc_override_harboro1_quests_rockridge_i_picked_up_pouch_sweet_236475: "- 我捡起了袋子。香甜的粉末开始从底部的破洞漏出来。-"
  npc_override_harboro1_quests_rockridge_i_picked_up_spotty_waste_168b00: "我在荒原捡到了点点。也许这就是为什么它那么喜欢在那里待着。但它从不会走得太远，以至于无法在饭前回家。至少，目前还没有。"
  npc_override_harboro1_quests_rockridge_i_pride_myself_protectin_51922c: "我以保护这里的货物为荣。"
  npc_override_harboro1_quests_rockridge_i_probably_said_as_i_6a6786: "我可能是顺着谈话随口说的。"
  npc_override_harboro1_quests_rockridge_i_ran_419559: "我跑了"
  npc_override_harboro1_quests_rockridge_i_really_repay_you_time_f71930: "这次我真的可以报答你了。如果你改变主意了，请告诉我。"
  npc_override_harboro1_quests_rockridge_i_recommend_you_follow_c_e4e28e: "我建议你沿着中央大道走到村子东门，然后稍微往南走一点。"
  npc_override_harboro1_quests_rockridge_i_removed_plate_bottom_e_b97c59: "我移开了电梯底部的板子，发现下面有矿石箱。"
  npc_override_harboro1_quests_rockridge_i_saw_run_wasteland_go_39330b: "我看到它跑到荒原去了。去找我的戒指。你最好别空手回来！"
  npc_override_harboro1_quests_rockridge_i_say_we_should_go_9e13e3: "我说我们应该继续执行我们的计划。"
  npc_override_harboro1_quests_rockridge_i_say_we_turn_him_314119: "我说我们应该让他和帮派其他人反目。"
  npc_override_harboro1_quests_rockridge_i_see_c52c6e: "我明白了。"
  npc_override_harboro1_quests_rockridge_i_see_da0f97: "……我明白了。"
  npc_override_harboro1_quests_rockridge_i_sell_bread_nothing_els_629ef3: "我只卖面包，别的什么都不卖。"
  npc_override_harboro1_quests_rockridge_i_shook_sand_off_pouch_c2b5d4: "- 我抖掉了袋子上的沙子，把它放进了包里。-"
  npc_override_harboro1_quests_rockridge_i_should_go_he_s_052402: "我该走了。他只是在闹别扭。"
  npc_override_harboro1_quests_rockridge_i_should_go_tell_wyatt_cf9115: "我应该去告诉怀亚特科斯特洛想听听匪帮有什么要说的。^000000"
  npc_override_harboro1_quests_rockridge_i_should_take_me_now_def856: "我应该先把它带走。-"
  npc_override_harboro1_quests_rockridge_i_shouldn_t_put_banana_e9d4a9: "我不该把香蕉面包放在菜单上。谁知道它们会来不及送到？"
  npc_override_harboro1_quests_rockridge_i_so_excited_come_here_3b63c5: "我太兴奋了，穿着全套采矿装备就上了船！"
  npc_override_harboro1_quests_rockridge_i_still_flower_my_head_e80771: "我头上还戴着花吗？"
  npc_override_harboro1_quests_rockridge_i_swear_i_m_lying_74a67d: "我发誓我没撒谎。"
  npc_override_harboro1_quests_rockridge_i_t_believe_boss_thinks_72bd7f: "真不敢相信老大这么看不起我……"
  npc_override_harboro1_quests_rockridge_i_t_believe_you_re_f4fa65: "真不敢相信你这么无情。"
  npc_override_harboro1_quests_rockridge_i_t_believe_you_ugh_d90d68: "真不敢相信你。呃！"
  npc_override_harboro1_quests_rockridge_i_t_help_when_food_e6f195: "食物太美味了，我忍不住。"
  npc_override_harboro1_quests_rockridge_i_t_live_like_anymore_5a02a9: "我不能再这样生活了！猜猜点点这次偷了什么？我的戒指！"
  npc_override_harboro1_quests_rockridge_i_t_lose_all_my_4571a2: "我不能失去所有的刺，变成一个光滑的脸。我会羞愧得想把自己埋进土里。"
  npc_override_harboro1_quests_rockridge_i_t_people_leaving_as_03d9dc: "我不能让人一来就走。"
  npc_override_harboro1_quests_rockridge_i_tell_because_no_bandit_94f507: "我能看出来，因为洞口周围没有匪帮。"
  npc_override_harboro1_quests_rockridge_i_think_happened_wastela_65d131: "我想事情发生在荒原，是野牛匪帮的某个人朝我们的狗开枪了。你能替我替点点报仇吗？"
  npc_override_harboro1_quests_rockridge_i_think_he_s_too_918f3a: "我觉得他太忙着搅拌果汁了，没听到你说话。没关系。我这样做不是为了被感谢。他真的很喜欢。"
  npc_override_harboro1_quests_rockridge_i_think_s_time_we_b7c43b: "我想是时候警告阿尔伯特了。"
  npc_override_harboro1_quests_rockridge_i_think_someone_fired_gu_707b09: "我想有人在点点附近开了枪，但不是在村子里发生的。如果是的话，我们会听到的。"
  npc_override_harboro1_quests_rockridge_i_think_there_treasures_90dd1e: "我想下面有宝藏。"
  npc_override_harboro1_quests_rockridge_i_think_they_killed_brow_cf6ff7: "我想它们是被地下室里繁衍的褐鼠杀死的。有传言说它们甚至会攻击活人，如果属实，那就严重了。"
  npc_override_harboro1_quests_rockridge_i_thought_about_i_desper_54f04e: "我想过。我 desperate 到愿意尝试任何事情。"
  npc_override_harboro1_quests_rockridge_i_thought_signal_miners_c04156: "我以为那是矿工用来通知吃饭时间的信号。"
  npc_override_harboro1_quests_rockridge_i_told_you_i_take_e5446e: "我告诉过你我可以对付他。"
  npc_override_harboro1_quests_rockridge_i_travels_world_bought_v_82a7b8: "我周游世界，买了有价值的东西。这次我在收集这个新大陆的特色产品。"
  npc_override_harboro1_quests_rockridge_i_tried_understanding_wh_9c7c26: "当它拿走我们的鞋子和衣服埋进土里时，我试着理解它，但不行，不能是我的戒指！"
  npc_override_harboro1_quests_rockridge_i_understand_40038e: "我明白。"
  npc_override_harboro1_quests_rockridge_i_understand_aww_my_legs_c04f25: "我明白。哎呀，我的腿！"
  npc_override_harboro1_quests_rockridge_i_understand_everyone_en_637551: "我明白。最近每个人都有够多的事要忙。"
  npc_override_harboro1_quests_rockridge_i_understand_they_want_b_d59a28: "而且我明白它们想变得和那些冒险者一样强大。"
  npc_override_harboro1_quests_rockridge_i_understand_what_mr_gla_06c665: "我明白怒目鹰先生的意思，也明白他为什么这么担心。"
  npc_override_harboro1_quests_rockridge_i_understand_why_pink_ro_64c493: "我明白粉红玫瑰为什么不高兴。"
  npc_override_harboro1_quests_rockridge_i_ve_also_heard_strange_25110a: "我也听到了一个奇怪的谣言，"
  npc_override_harboro1_quests_rockridge_i_ve_baked_bread_just_86d23d: "这面包是我今天早上刚烤的。"
  npc_override_harboro1_quests_rockridge_i_ve_been_coming_here_462ad7: "我一直尽可能来这里，在点点把更多东西带到荒原之前抓住它。"
  npc_override_harboro1_quests_rockridge_i_ve_been_looking_some_6c2fad: "我一直在找一些果汁粉包装，因为我知道有人丢了它们。"
  npc_override_harboro1_quests_rockridge_i_ve_been_looking_someon_bb18e1: "我一直在找你这样的人。"
  npc_override_harboro1_quests_rockridge_i_ve_been_moving_cargo_aeecdc: "自从来到这里，我每天都在搬运货物，我的背都快断了。*呜咽*"
  npc_override_harboro1_quests_rockridge_i_ve_been_thinking_d90bf6: "我一直在想"
  npc_override_harboro1_quests_rockridge_i_ve_brought_case_you_3f76c0: "我带来了这个，以防你不相信我。"
  npc_override_harboro1_quests_rockridge_i_ve_brought_them_here_7d997d: "我带他们来这里参观陌生人的村子，结果在人群中走散了。"
  npc_override_harboro1_quests_rockridge_i_ve_decided_i_m_f14af4: "我决定了！我要加入自卫队！"
  npc_override_harboro1_quests_rockridge_i_ve_got_best_bread_04ff6e: "我有天下最好吃的面包！买我的面包！"
  npc_override_harboro1_quests_rockridge_i_ve_got_bread_s_119bc7: "我有好吃到死的面包。"
  npc_override_harboro1_quests_rockridge_i_ve_got_juice_mix_98afe1: "- 我拿到了果汁粉包装，但我为威胁他才拿到而感到内疚。-"
  npc_override_harboro1_quests_rockridge_i_ve_got_juice_mix_9ea8ac: "- 我拿到了果汁粉包装。-"
  npc_override_harboro1_quests_rockridge_i_ve_heard_96246c: "我听说了。"
  npc_override_harboro1_quests_rockridge_i_ve_heard_news_29b4a7: "我听到消息了。"
  npc_override_harboro1_quests_rockridge_i_ve_heard_s_traditional_170ed4: "我听说这是仙人掌族的传统饮品。当我喝它的时候，感觉就像洗掉了堵在我喉咙里的所有灰尘。"
  npc_override_harboro1_quests_rockridge_i_ve_heard_you_re_3e6592: "我听说你还在和他们讨价还价。"
  npc_override_harboro1_quests_rockridge_i_ve_heard_you_ve_7243c4: "我听说你因为和匪帮谈判的事一直很忙。"
  npc_override_harboro1_quests_rockridge_i_ve_made_all_necessary_8c686f: "我已经做了所有必要的安排。"
  npc_override_harboro1_quests_rockridge_i_ve_received_juice_mix_481c90: "- 我从仙人掌女孩那里收到了果汁粉包装。-"
  npc_override_harboro1_quests_rockridge_i_ve_received_your_villa_c2b142: "我从你们村子收到了，"
  npc_override_harboro1_quests_rockridge_i_very_urgent_grave_matt_bb192b: "我手头有非常紧急和重要的事。请不要打断我。"
  npc_override_harboro1_quests_rockridge_i_waive_you_just_once_11e088: "但我可以为你破例一次。"
  npc_override_harboro1_quests_rockridge_i_want_get_him_while_b8a76e: "我想趁他以为你真的来自总部的时候抓住他。"
  npc_override_harboro1_quests_rockridge_i_want_go_home_a499e3: "我想回家……"
  npc_override_harboro1_quests_rockridge_i_want_go_home_we_c4dc6c: "我想回家。我们在这里永远赚不了大钱。"
  npc_override_harboro1_quests_rockridge_i_want_grow_up_quickly_1a0d41: "我想快点长大，这样我就可以请他再给我讲一遍他讲过的那些事情。"
  npc_override_harboro1_quests_rockridge_i_want_him_gone_fb295a: "我想让他消失。"
  npc_override_harboro1_quests_rockridge_i_want_learn_you_too_a02456: "我也想向你学习！我想变得和你一样擅长织网！"
  npc_override_harboro1_quests_rockridge_i_want_more_chicken_nya_9bce89: "我想要更多鸡肉，喵！而且鸡肉对我的胃很好。"
  npc_override_harboro1_quests_rockridge_i_want_throw_firework_pa_912f42: "我想在^0000cd矿里举办烟花派对^000000，然后^0000cd吓跑匪帮^000000。"
  npc_override_harboro1_quests_rockridge_i_want_you_know_how_fb5ff4: "我想让你知道你的老板有多懦弱。"
  npc_override_harboro1_quests_rockridge_i_wish_i_could_glass_1df6ec: "我希望能在一个阴凉的地方喝一杯冰凉的柠檬水。"
  npc_override_harboro1_quests_rockridge_i_wonder_what_costello_t_9a3571: "我想知道科斯特洛怎么想。"
  npc_override_harboro1_quests_rockridge_i_you_could_come_me_6ac6ba: "我愿意。你可以跟我一起来。"
  npc_override_harboro1_quests_rockridge_if_albert_still_alive_ti_21124f: "如果等我出去的时候阿尔伯特还活着，我就回不了我的帮派了。"
  npc_override_harboro1_quests_rockridge_if_costello_us_plan_migh_744704: "如果科斯特洛和我们在一起，这个计划可能就不会成功了。"
  npc_override_harboro1_quests_rockridge_if_doesn_t_get_solved_cd5a6b: "如果明天之前这件事还没解决，那我就走！"
  npc_override_harboro1_quests_rockridge_if_goes_well_we_get_cb7485: "如果顺利的话，我们可以离开这个鬼地方，我也可以回矿里工作了。你也可以。"
  npc_override_harboro1_quests_rockridge_if_he_gets_out_realizes_0590fc: "如果他出去发现你还活着，你就有麻烦了，不是吗？"
  npc_override_harboro1_quests_rockridge_if_he_here_save_you_9ea253: "如果他是来救你的，他会试着透过栏杆和你说话，不是吗？"
  npc_override_harboro1_quests_rockridge_if_he_really_betrayed_us_cf000e: "如果他真的背叛了我们，我们想亲自惩罚他。"
  npc_override_harboro1_quests_rockridge_if_i_him_i_ve_e78dd4: "如果我是他，我会试着给你传纸条。"
  npc_override_harboro1_quests_rockridge_if_i_told_you_about_061ca8: "如果我跟你说过分享矿的利润，我不记得了。"
  npc_override_harboro1_quests_rockridge_if_joke_wasn_t_funny_8edd59: "如果那是玩笑，那一点都不好笑。"
  npc_override_harboro1_quests_rockridge_if_necessary_we_could_pr_cc8fc5: "如果有必要，我们可以在几天内生产出几周份的矿石。"
  npc_override_harboro1_quests_rockridge_if_only_there_weren_t_97d019: "……如果没有那么多虫子就好了。我要把这味道装瓶带走。"
  npc_override_harboro1_quests_rockridge_if_only_we_didn_t_536b70: "要是我们不用担心那些野牛匪帮就好了……！"
  npc_override_harboro1_quests_rockridge_if_s_necessary_i_could_b3f636: "如果有必要，我可以散布谣言说村子里的职位都满了。*轻笑*"
  npc_override_harboro1_quests_rockridge_if_someone_else_hears_yo_9eecb0: "如果别人听到你这么说，他们会以为你好几天没吃饭没睡觉"
  npc_override_harboro1_quests_rockridge_if_there_someone_else_fo_2ba913: "如果有的话，别人肯定早就找到了。"
  npc_override_harboro1_quests_rockridge_if_we_make_him_believe_302901: "如果我们能让他相信这一点，那我们就能在谈判中占据优势。"
  npc_override_harboro1_quests_rockridge_if_we_t_avoid_meeting_a668c5: "如果我们无法避免这次会面，那我们最好做好准备。"
  npc_override_harboro1_quests_rockridge_if_we_want_ores_back_884080: "如果我们想要回矿石，那我们随时可以找约翰尼谈"
  npc_override_harboro1_quests_rockridge_if_you_business_basement_69eb6e: "如果你有事要去地下室，请消灭10只^0000ff褐鼠^000000。"
  npc_override_harboro1_quests_rockridge_if_you_business_down_the_9e5de4: "如果你有事要去下面，请消灭10只^0000ff沼泽弧光虫^000000。"
  npc_override_harboro1_quests_rockridge_if_you_don_t_believe_079887: "如果你不相信我，你可以去村子里跟她谈谈。"
  npc_override_harboro1_quests_rockridge_if_you_don_t_enough_f2541e: "如果你钱不够，那我就不能让你住。"
  npc_override_harboro1_quests_rockridge_if_you_don_t_think_126bae: "如果你觉得找不到，那就沿着铁路走。"
  npc_override_harboro1_quests_rockridge_if_you_find_purple_ore_91ff9e: "如果你找到紫色矿石碎片"
  npc_override_harboro1_quests_rockridge_if_you_friends_who_least_cc7f8b: "如果你有朋友至少达到^4d4dff100级^00000，告诉他们来找我，好吗？"
  npc_override_harboro1_quests_rockridge_if_you_get_old_enough_343a77: "如果你长大到能理解这一点，你妈妈会教你打猎的。"
  npc_override_harboro1_quests_rockridge_if_you_help_us_we_13895e: "而且如果你帮我们，我们会替你处理阿尔伯特。反正他妨碍我们夺回矿。"
  npc_override_harboro1_quests_rockridge_if_you_left_somewhere_be_49c1bf: "如果你因为太重把它放在什么地方了，请去把它拿回来。"
  npc_override_harboro1_quests_rockridge_if_you_let_me_go_1b740f: "如果你放我走。"
  npc_override_harboro1_quests_rockridge_if_you_re_busy_6be14c: "如果你不忙的话，"
  npc_override_harboro1_quests_rockridge_if_you_re_busy_come_edd321: "如果你不忙，明天再来帮我。我会报答你的。"
  npc_override_harboro1_quests_rockridge_if_you_re_busy_could_7d7c48: "而且如果你不忙，你能回来再消灭一些郊狼吗？最近郊狼比以前多了。它们和我们一样是大自然的一部分，但它们威胁到了我们的安全。"
  npc_override_harboro1_quests_rockridge_if_you_re_leader_your_747a17: "如果你是你们帮派的老大，我愿意和你做生意。"
  npc_override_harboro1_quests_rockridge_if_you_re_looking_job_adf2ce: "如果你在找工作，去别的地方吧。"
  npc_override_harboro1_quests_rockridge_if_you_re_tired_get_90fc47: "如果你累了，先休息一下。我不想让我的请求成为你的负担。"
  npc_override_harboro1_quests_rockridge_if_you_see_them_please_d1c3fe: "如果你看到她们，请告诉她们奶奶在找她们。"
  npc_override_harboro1_quests_rockridge_if_you_tell_him_i_c4d0ea: "如果你告诉他是我让你来的。"
  npc_override_harboro1_quests_rockridge_if_you_want_i_send_21f61b: "如果你愿意，我可以送你去那里。"
  npc_override_harboro1_quests_rockridge_inhale_deeply_250377: "*深吸一口气* {0}！"
  npc_override_harboro1_quests_rockridge_instead_dealing_you_38e561: "而不是和你打交道。"
  npc_override_harboro1_quests_rockridge_instrument_itself_work_a_bb888c: "这件乐器本身就是一件艺术品。"
  npc_override_harboro1_quests_rockridge_is_079bc3: "是"
  npc_override_harboro1_quests_rockridge_isn_t_72ec8e: "不是吗？"
  npc_override_harboro1_quests_rockridge_its_main_customers_compa_3cb924: "而且它的主要客户是企业和其他商业机构。"
  npc_override_harboro1_quests_rockridge_ivoka_different_idea_898723: "但伊沃卡有不同的想法。"
  npc_override_harboro1_quests_rockridge_ivoka_our_cacti_friends_c003e0: "伊沃卡和我们的仙人掌族朋友们，你们干得好！你们现在可以把他带走了。"
  npc_override_harboro1_quests_rockridge_ivoka_s_plan_worked_flaw_2f42bf: "伊沃卡的计划完美地成功了。"
  npc_override_harboro1_quests_rockridge_ivoka_s_right_3cec8d: "伊沃卡说得对。"
  npc_override_harboro1_quests_rockridge_ivoka_wants_turn_him_aga_aeb0ea: "伊沃卡想让他和帮派其他人反目。"
  npc_override_harboro1_quests_rockridge_jerk_sheriff_822270: "那个混蛋警长，"
  npc_override_harboro1_quests_rockridge_joe_who_s_bit_east_78853f: "乔，就在这东边一点。"
  npc_override_harboro1_quests_rockridge_johnny_betrayed_you_firs_753769: "约翰尼先背叛了你。"
  npc_override_harboro1_quests_rockridge_johnny_free_b54bba: "约翰尼自由了吗？"
  npc_override_harboro1_quests_rockridge_johnny_guy_normal_c7ea3a: "这个约翰尼不正常。"
  npc_override_harboro1_quests_rockridge_johnny_if_you_help_us_4503f9: "约翰尼，如果你帮我们，我们可以不花钱就拿到矿石。"
  npc_override_harboro1_quests_rockridge_johnny_james_isn_t_only_e0b40c: "约翰尼·詹姆斯不是唯一让我们担心的人。还有……？"
  npc_override_harboro1_quests_rockridge_johnny_james_locked_up_b_5addb4: "^4d4dff约翰尼·詹姆斯被关在地下室里^000000。"
  npc_override_harboro1_quests_rockridge_johnny_james_you_shouldn_c02a4a: "约翰尼·詹姆斯？你不该对警官这么无礼。"
  npc_override_harboro1_quests_rockridge_johnny_knows_he_s_trying_7df5d6: "而且约翰尼知道这一点。他试图用矿石作为他的免罪金牌。"
  npc_override_harboro1_quests_rockridge_johnny_locked_up_undergr_1823fa: "约翰尼被关在地下监狱里。"
  npc_override_harboro1_quests_rockridge_johnny_must_worried_abou_ede427: "约翰尼一定担心失去他在帮派中的地位，尽管他表现出一副不在乎的样子。"
  npc_override_harboro1_quests_rockridge_join_conversation_fd0ceb: "加入对话。"
  npc_override_harboro1_quests_rockridge_juice_mix_package_d2f28d: "果汁粉包装？"
  npc_override_harboro1_quests_rockridge_juice_mix_package_if_you_f262ea: "果汁粉包装？如果你说的是卡在石头中间的那个包装，那没错，我有。"
  npc_override_harboro1_quests_rockridge_just_bring_agave_juice_m_b0bb6f: "只要带^0000CD5包龙舌兰饮料粉^000000来。那就足够让我儿子开心了。"
  npc_override_harboro1_quests_rockridge_just_bring_me_s_all_de05c3: "只要给我带10个来。我就需要这么多。"
  npc_override_harboro1_quests_rockridge_just_figure_speech_ed1607: "那只是修辞手法。"
  npc_override_harboro1_quests_rockridge_just_get_purple_ore_adeq_d476e8: "只要弄^4d4dff1个大小合适的紫色矿石^000000。"
  npc_override_harboro1_quests_rockridge_just_hang_there_i_m_b553c7: "再坚持一下。我在外面给你种了些草。如果长好了，你就不用挨饿了。"
  npc_override_harboro1_quests_rockridge_just_like_diamonds_e04fca: "就像钻石一样。"
  npc_override_harboro1_quests_rockridge_just_look_your_map_go_756f04: "看看你的地图，一直往上走。你就会到火车站。"
  npc_override_harboro1_quests_rockridge_just_so_you_know_offer_ad3270: "事先告诉你，这个提议不会一直有效。"
  npc_override_harboro1_quests_rockridge_just_standing_here_makes_916c3f: "光是站在这里就让我开心得停不下来。哈哈哈！"
  npc_override_harboro1_quests_rockridge_just_thought_toying_them_172ef5: "光是想想耍他们就让我兴奋。"
  npc_override_harboro1_quests_rockridge_justice_so_costly_someti_f52667: "正义有时代价高昂……"
  npc_override_harboro1_quests_rockridge_kafra_services_available_2e6a8b: "卡普拉服务在岩脊镇广场内提供。"
  npc_override_harboro1_quests_rockridge_karintas_your_mom_ever_h_f4d5ad: "卡林塔斯，你妈妈有没有为了乐趣而猎杀它们？"
  npc_override_harboro1_quests_rockridge_keep_them_check_8e4d4c: "来控制它们的数量。"
  npc_override_harboro1_quests_rockridge_kiddo_you_right_get_dead_596b09: "小鬼，你能做到的，对吧？从气态怪那里拿到10个致命毒粉和1个爆炸粉。"
  npc_override_harboro1_quests_rockridge_kiddo_you_right_get_expl_f9b7b4: "小鬼，你能做到的，对吧？从气态怪那里拿到1个爆炸粉。"
  npc_override_harboro1_quests_rockridge_kiwawa_desert_vast_full_6c2bab: "基瓦瓦沙漠广阔无垠，除了泥土和石头什么都没有。很容易在里面迷路。"
  npc_override_harboro1_quests_rockridge_knock_concave_rock_front_f933d1: "^4d4dff敲矿前凹石三次，^000000阿尔伯特就会出来。"
  npc_override_harboro1_quests_rockridge_knock_knock_knock_knock_c088fe: "敲，敲——敲——敲，敲。"
  npc_override_harboro1_quests_rockridge_knock_rock_front_mine_th_992f47: "敲矿前的石头三次，阿尔伯特就会出来。"
  npc_override_harboro1_quests_rockridge_land_opportunity_s_rock_019450: "机会之地，那就是岩脊镇。"
  npc_override_harboro1_quests_rockridge_last_time_when_i_came_b96c85: "上次我来这里的时候，"
  npc_override_harboro1_quests_rockridge_least_during_time_i_coul_ce6903: "至少在那段时间里我可以忘记现实，关于矿，没有工作，你知道的，那种事。"
  npc_override_harboro1_quests_rockridge_least_i_work_food_eat_10a253: "但至少我有工作可做，有饭可吃，多亏了某些人。"
  npc_override_harboro1_quests_rockridge_least_i_you_adventurer_i_52e5ee: "至少我还有你，冒险者。我相信我们两个可以处理好这件事。"
  npc_override_harboro1_quests_rockridge_lecter_you_should_thank_c2f14e: "莱克特，你应该先感谢冒险者。"
  npc_override_harboro1_quests_rockridge_lemonade_i_mean_god_you_a363a1: "柠檬水！我是说，神与你同在！"
  npc_override_harboro1_quests_rockridge_let_me_help_ll_quicker_3a3b2f: "让我帮忙。会快一些。"
  npc_override_harboro1_quests_rockridge_let_me_see_your_id_ac10ea: "让我看看你的证件。你知道的，这里很多人长得都很像。"
  npc_override_harboro1_quests_rockridge_let_me_tell_you_little_2d0522: "让我给你讲讲这个村子。它建在一座沉入海底的城市遗迹之上。"
  npc_override_harboro1_quests_rockridge_let_s_9e0396: "就这么办。"
  npc_override_harboro1_quests_rockridge_let_s_check_over_there_5857a2: "我们去那边看看。"
  npc_override_harboro1_quests_rockridge_let_s_drive_albert_into_a3edf0: "让我们把阿尔伯特逼入绝境！"
  npc_override_harboro1_quests_rockridge_let_s_get_out_here_c65fb6: "在阿尔伯特发现为什么他的匪帮巡逻后回不来之前，我们赶紧离开这里。"
  npc_override_harboro1_quests_rockridge_let_s_get_work_shall_eb7de0: "让我们开始工作吧，好吗？"
  npc_override_harboro1_quests_rockridge_let_s_go_208616: "我们走！"
  npc_override_harboro1_quests_rockridge_let_s_go_back_before_175628: "在她担心之前我们回去吧。"
  npc_override_harboro1_quests_rockridge_let_s_go_back_my_2f59b1: "我们回我的办公室吧。"
  npc_override_harboro1_quests_rockridge_let_s_go_back_shall_10e447: "我们回去吧，好吗？"
  npc_override_harboro1_quests_rockridge_let_s_go_back_village_522a2a: "我们回村子吧。大家一定在等我们。"
  npc_override_harboro1_quests_rockridge_let_s_go_negotiate_him_bbb815: "我们去和他谈判吧！"
  npc_override_harboro1_quests_rockridge_let_s_go_play_him_af9283: "我们去耍他吧！"
  npc_override_harboro1_quests_rockridge_let_s_go_see_how_41c7bb: "我们去看看野牛匪帮的头目^4d4dff约翰尼·詹姆斯^000000有多丑。"
  npc_override_harboro1_quests_rockridge_let_s_go_up_shall_0ee21e: "我们上去吧，好吗？"
  npc_override_harboro1_quests_rockridge_let_s_listen_what_he_462960: "让我们听听他要说什么。"
  npc_override_harboro1_quests_rockridge_let_s_listen_what_ivoka_ff50df: "让我们听听伊沃卡要说什么。"
  npc_override_harboro1_quests_rockridge_let_s_look_around_little_76f1d1: "让我们再四处看看。看，那边有很多陌生人！"
  npc_override_harboro1_quests_rockridge_let_s_make_money_hee_cde529: "让我们赚钱——嘿嘿！——然后吃好吃的！"
  npc_override_harboro1_quests_rockridge_let_s_pray_him_show_0dea7b: "让我们向他祈祷，表达我们的感激之情。"
  npc_override_harboro1_quests_rockridge_let_s_see_mm_kiddo_0f45c9: "让我看看……嗯，小鬼，你忘了消灭所有的气态怪。我们工作的时候不能有气态怪在周围。"
  npc_override_harboro1_quests_rockridge_let_s_see_mm_you_b1aa43: "让我看看……嗯，你没带10个致命毒粉来。那是我做炸弹最少需要的量。"
  npc_override_harboro1_quests_rockridge_let_s_see_mm_you_da207e: "让我看看……嗯，你没带1个爆炸粉来。那是我做炸弹最少需要的量。"
  npc_override_harboro1_quests_rockridge_let_s_see_ooh_kiddo_84db79: "让我看看……哦，小鬼，你把所有事都办好了！你消灭了气态怪，还带来了我要的东西。"
  npc_override_harboro1_quests_rockridge_let_s_try_make_him_a8098a: "让我们试着让他相信阿尔伯特背叛了他，而他唯一的机会就是跟我们谈。"
  npc_override_harboro1_quests_rockridge_let_s_wait_bandit_train_6023b2: "让我们在火车旁等匪帮。"
  npc_override_harboro1_quests_rockridge_let_s_wait_daddy_he_98bd53: "我们等爸爸吧。他会带食物回来的。"
  npc_override_harboro1_quests_rockridge_let_spy_see_you_talk_cff58b: "让间谍看到你和约翰尼谈话。"
  npc_override_harboro1_quests_rockridge_like_shawn_said_go_secon_fc3183: "就像肖恩说的，去矿的二楼，拿一个矿石，然后给阿尔伯特看。"
  npc_override_harboro1_quests_rockridge_listen_what_he_say_9564aa: "听听他要说什么。"
  npc_override_harboro1_quests_rockridge_little_bit_white_hair_sc_dd50f8: "里面散落着一点白毛。-"
  npc_override_harboro1_quests_rockridge_little_kids_like_him_ful_00e90c: "像他这样的小孩子充满了好奇心。你最好在他开始哭之前告诉他。"
  npc_override_harboro1_quests_rockridge_ll_bad_both_us_da5ac8: "那对我们两个都不好。"
  npc_override_harboro1_quests_rockridge_ll_just_you_me_right_2673fb: "就你和我，对吧？"
  npc_override_harboro1_quests_rockridge_ll_make_things_easier_bo_6f1a8f: "那会让双方都轻松些。"
  npc_override_harboro1_quests_rockridge_ll_show_those_bandits_th_c994ce: "而且那会让那些匪帮知道他们 squat 在矿里是浪费时间。"
  npc_override_harboro1_quests_rockridge_ll_take_many_you_wimps_d6cd66: "你们这些废物得很多人才能抬起电梯。"
  npc_override_harboro1_quests_rockridge_ll_tame_him_further_c7ac6f: "那会让他更老实。"
  npc_override_harboro1_quests_rockridge_long_time_9df567: "而且很长一段时间以来，"
  npc_override_harboro1_quests_rockridge_look_around_while_you_hu_3135c7: "你打猎的时候四处看看，好吗？谢谢。"
  npc_override_harboro1_quests_rockridge_look_i_still_left_some_14e1d2: "但你看，你昨天带来的材料我还剩一些。我用不完这些。"
  npc_override_harboro1_quests_rockridge_look_those_people_been_w_ad3288: "看那边。那些人已经等了好几个小时了。我怎么告诉他们我没有足够的食材给他们做饭？"
  npc_override_harboro1_quests_rockridge_look_who_s_still_breathi_c9dcf9: "看看现在谁还活着！"
  npc_override_harboro1_quests_rockridge_looking_place_stay_you_c_574ec4: "在找住的地方？你来对地方了！"
  npc_override_harboro1_quests_rockridge_lucas_you_want_me_kill_38b12c: "卢卡斯！你想让我杀了你吗？别那样做！"
  npc_override_harboro1_quests_rockridge_make_him_think_he_no_cd7c2d: "然后让他以为自己没有筹码了。"
  npc_override_harboro1_quests_rockridge_make_sense_you_i_don_45a314: "这说得通吗？我不相信有值得为了它去犯罪的监狱食物。"
  npc_override_harboro1_quests_rockridge_make_sure_you_ore_you_50dc18: "确保你带着矿石。"
  npc_override_harboro1_quests_rockridge_many_023695: "对很多人来说，"
  npc_override_harboro1_quests_rockridge_many_generations_49e588: "很多代人。"
  npc_override_harboro1_quests_rockridge_many_people_already_floc_508e2b: "而且很多人已经蜂拥而至，想要分一杯新土地的羹。"
  npc_override_harboro1_quests_rockridge_many_people_know_about_b_7bf7dc: "没有多少人知道它，因为它还没有很多分行。"
  npc_override_harboro1_quests_rockridge_many_people_village_jobl_ab8567: "村子里很多人失业，所有可用的工作都给了冒险者。"
  npc_override_harboro1_quests_rockridge_may_i_talk_you_second_27b571: "我能和你谈一下吗？"
  npc_override_harboro1_quests_rockridge_may_sun_earth_70a8b7: "愿太阳和大地"
  npc_override_harboro1_quests_rockridge_may_sun_earth_bless_you_ebcb32: "愿太阳和大地保佑你！"
  npc_override_harboro1_quests_rockridge_maybe_costello_could_hir_6da476: "也许科斯特洛可以雇你去矿里工作。"
  npc_override_harboro1_quests_rockridge_maybe_grownups_our_villa_09af10: "也许我们村子里的成年人也应该出去猎杀郊狼。"
  npc_override_harboro1_quests_rockridge_maybe_he_s_waiting_somet_d96932: "或者也许他在等什么。"
  npc_override_harboro1_quests_rockridge_maybe_i_should_deal_buff_5c093c: "也许我应该亲自对付野牛匪帮。"
  npc_override_harboro1_quests_rockridge_maybe_i_should_join_vigi_d9bc67: "也许我应该加入自卫队。"
  npc_override_harboro1_quests_rockridge_maybe_i_should_take_gian_948cae: "也许我应该带一把大扇子。"
  npc_override_harboro1_quests_rockridge_maybe_i_should_ve_opened_e9f104: "也许我应该自己开一家旅馆。"
  npc_override_harboro1_quests_rockridge_maybe_i_should_yell_scar_1e0d34: "- 也许我应该大喊把它吓跑。我该喊什么？-"
  npc_override_harboro1_quests_rockridge_maybe_we_should_explore_4d8c65: "也许我们应该探索矿以外的地方，尽可能深入。"
  npc_override_harboro1_quests_rockridge_maybe_we_should_go_back_99437e: "也许我们应该回大陆去。"
  npc_override_harboro1_quests_rockridge_maybe_you_could_help_me_f8fee1: "也许你可以帮我。"
  npc_override_harboro1_quests_rockridge_maybe_you_could_meet_him_f924b3: "或者也许你可以代替我去见他，假装是总部来的人。我跟你一起去。"
  npc_override_harboro1_quests_rockridge_maybe_you_re_right_did_0b1090: "……也许你是对的。你一处理完他就来这里了吗？"
  npc_override_harboro1_quests_rockridge_mayor_costell_s_solution_bbf1e8: "科斯特洛镇长的解决方案是填埋第一层，在上面建一个新的村子。所以现在以前的一楼变成了地下室。二楼实际上是一楼。"
  npc_override_harboro1_quests_rockridge_mean_you_re_willing_go_99523c: "这意味着你愿意下楼吗？"
  npc_override_harboro1_quests_rockridge_means_we_bargaining_chip_e84b0b: "这意味着我们现在有筹码了。"
  npc_override_harboro1_quests_rockridge_meantime_i_ll_check_pull_bd37cd: "与此同时，我会检查我们回去要用的滑轮。"
  npc_override_harboro1_quests_rockridge_meantime_i_ll_prepare_me_144b72: "与此同时，我会为会议做准备。"
  npc_override_harboro1_quests_rockridge_meantime_i_ll_scare_john_64b585: "与此同时，我会再吓吓约翰尼。"
  npc_override_harboro1_quests_rockridge_menu_ah_1b5ee7: "啊，冒险者。你消灭了^FF0000每种匪帮各3个：黄鬃、黑鬃和白鬃^000000吗？"
  npc_override_harboro1_quests_rockridge_menu_ah_7ffe7b: "啊，冒险者。嘘！请小声点：野牛匪帮可能会听到我们。"
  npc_override_harboro1_quests_rockridge_menu_and_a04742: "猜猜我在那里遇到了谁：这家伙。他被炸火车的爆炸波及，那些无情的野牛把他丢下等死。"
  npc_override_harboro1_quests_rockridge_menu_as_b68fda: "就像我之前告诉你的，这次我们有东西给你：^0000CD1个岩脊镇硬币^000000。嘿，你能帮我们吗？"
  npc_override_harboro1_quests_rockridge_menu_as_c69e01: "和往常一样，请消灭^FF0000每种匪帮各3个：黄鬃、黑鬃和白鬃^000000。"
  npc_override_harboro1_quests_rockridge_menu_cancel_f5ab26: "取消：{0}"
  npc_override_harboro1_quests_rockridge_menu_close_1ddc7c: "差不多，但我做的东西更强：^0000cd炸弹^000000。而矿对像我这样的人来说是最好的事情。"
  npc_override_harboro1_quests_rockridge_menu_could_d5b9b3: "你能再来吗？如果你不忙，每天凌晨4:00之后随时欢迎。"
  npc_override_harboro1_quests_rockridge_menu_curious_381e66: "好奇的人：这队伍是干什么的？你们在排队领活动奖品吗？"
  npc_override_harboro1_quests_rockridge_menu_east_9da632: "东：旅馆"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_1251c9: "热情的求职者：为什么不接受我？我强壮到可以去外面猎杀郊狼！"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_4aaceb: "热情的求职者：我也想工作！"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_73edfe: "热情的求职者：猎杀气态怪？请让我加入你们。"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_92bb03: "热情的求职者：猎杀戴面具的野牛？请让我加入你们。"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_9886be: "热情的求职者：我已经准备好立刻工作了。你们为什么不雇我？"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_a402fa: "热情的求职者：我不是来这里打盹的。给我工作！"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_a77880: "热情的求职者：猎杀持步枪的野牛？请让我加入你们。"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_bc5256: "热情的求职者：这不公平！"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_c54491: "热情的求职者：你刚下船吗？别来回踱步了？你让我很烦。"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_ccbdfe: "热情的求职者：你不能偏心！"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_f37d64: "热情的求职者：猎杀戴眼罩的野牛？请让我加入你们。"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_f491f2: "热情的求职者：嘿，那我们呢？！"
  npc_override_harboro1_quests_rockridge_menu_enthusiastic_f6be43: "热情的求职者：加入野牛匪帮/郊狼讨伐队。能在5分钟内完成的人欢迎加入。"
  npc_override_harboro1_quests_rockridge_menu_exotic_0496c7: "异域商人：胡丁的宝箱！别碰它。谢谢！"
  npc_override_harboro1_quests_rockridge_menu_exotic_4db450: "异域商人：怎么了，夏洛特？"
  npc_override_harboro1_quests_rockridge_menu_food_1e89b6: "食物分发员：不，我没那么说！只是今天做饭要花一点时间。别慌！"
  npc_override_harboro1_quests_rockridge_menu_he_bfe921: "他睡着的时候是个天使，但是……唉……光是想到他^FF0000凌晨4:00之后^000000醒来可能会做什么，我就已经头疼了。"
  npc_override_harboro1_quests_rockridge_menu_hungry_096b1b: "饥饿的劳工：嘿，你没看到这里在排队吗？去队伍末尾！"
  npc_override_harboro1_quests_rockridge_menu_hungry_25f9a4: "饥饿的劳工：等等，你刚才说没有食材了？你们没食物了？"
  npc_override_harboro1_quests_rockridge_menu_hungry_550b91: "饥饿的劳工：哎呀，我快饿死了。为什么队伍一点都没变短？"
  npc_override_harboro1_quests_rockridge_menu_hungry_d8536d: "饥饿的劳工：很快就轮到我了！"
  npc_override_harboro1_quests_rockridge_menu_hungry_ec36d5: "饥饿的劳工：这太荒谬了。我排了3个小时的队才吃到饭。"
  npc_override_harboro1_quests_rockridge_menu_jamie_55ff83: "杰米：自从昨天又失踪了两个，15个。没人想去下面。"
  npc_override_harboro1_quests_rockridge_menu_jamie_816d4d: "杰米：董事长，我刚接到地下室的电话。又有五名工人被怪物袭击了。"
  npc_override_harboro1_quests_rockridge_menu_job_80edf0: "职业中介老板：嘿，杰米！你说下水道还需要多少工人？"
  npc_override_harboro1_quests_rockridge_menu_let_744093: "让我看看现在几点了……还没到^FF00004:00^000000。你能晚点再来吗？"
  npc_override_harboro1_quests_rockridge_menu_now_1c6c67: "好了，听好了：拿到^0000cd10个致命毒粉和1个爆炸粉^000000，然后^0000cd消灭15个气态怪^000000。明白了吗？"
  npc_override_harboro1_quests_rockridge_menu_options_018b8a: "{0}：肖恩说只要一个箱子。"
  npc_override_harboro1_quests_rockridge_menu_options_08c6a1: "{0}：你是说约翰尼·詹姆斯？"
  npc_override_harboro1_quests_rockridge_menu_options_10573b: "{0}：我想就是这里，但也许我来太早了。"
  npc_override_harboro1_quests_rockridge_menu_options_19f901: "{0}：你不看新闻的吗？我现在是镇长了。"
  npc_override_harboro1_quests_rockridge_menu_options_22fc0a: "{0}：……"
  npc_override_harboro1_quests_rockridge_menu_options_2bd2c3: "{0}：我只是路过。我晚点再来。"
  npc_override_harboro1_quests_rockridge_menu_options_2ef5e5: "{0}：你为什么觉得我在撒谎？"
  npc_override_harboro1_quests_rockridge_menu_options_3f0406: "{0}：你确定吗？"
  npc_override_harboro1_quests_rockridge_menu_options_4041e0: "{0}：事实上，你确实见过。"
  npc_override_harboro1_quests_rockridge_menu_options_4723cb: "{0}：科斯特洛先生？"
  npc_override_harboro1_quests_rockridge_menu_options_54904d: "{0}：他们喝醉了。"
  npc_override_harboro1_quests_rockridge_menu_options_57b910: "{0}：好的。"
  npc_override_harboro1_quests_rockridge_menu_options_612ebe: "{0}：我不能。"
  npc_override_harboro1_quests_rockridge_menu_options_7cce51: "{0}：天哪。"
  npc_override_harboro1_quests_rockridge_menu_options_91898a: "{0}：放轻松。是我。"
  npc_override_harboro1_quests_rockridge_menu_options_958fd5: "{0}：你们在冒险者中已经很出名了。"
  npc_override_harboro1_quests_rockridge_menu_options_a5c980: "{0}：我们没时间了。约翰尼会花钱买通出狱的。"
  npc_override_harboro1_quests_rockridge_menu_options_adb240: "{0}：啊，那个。"
  npc_override_harboro1_quests_rockridge_menu_options_b2e115: "{0}：警长沃普想要它作为我们谈判的证明。"
  npc_override_harboro1_quests_rockridge_menu_options_be22a2: "{0}：我在这里没有别的事了。我最好回肖恩那里去。"
  npc_override_harboro1_quests_rockridge_menu_options_e17b81: "{0}：我要告诉你多少次？"
  npc_override_harboro1_quests_rockridge_menu_options_ec4aa9: "{0}：我从总部大老远赶来参加这次会议。"
  npc_override_harboro1_quests_rockridge_menu_options_ff5026: "{0}：但谈判还没结束。"
  npc_override_harboro1_quests_rockridge_menu_scared_1935a8: "害怕的工匠：如果你想让我们为你工作，先把工作场所弄安全！"
  npc_override_harboro1_quests_rockridge_menu_scared_1be4a3: "害怕的工匠：嘿，生命比金钱重要。"
  npc_override_harboro1_quests_rockridge_menu_scared_28ecd1: "害怕的工匠：下面的地方不安全。"
  npc_override_harboro1_quests_rockridge_menu_scared_3d31bd: "害怕的工匠：你没下去过吧？你真幸运。"
  npc_override_harboro1_quests_rockridge_menu_scared_3d60bd: "害怕的工匠：我从没见过那么大的虫子。我不能再在这里工作了。"
  npc_override_harboro1_quests_rockridge_menu_scared_624480: "害怕的工匠：你还太年轻，不能死。"
  npc_override_harboro1_quests_rockridge_menu_scared_74e2c9: "害怕的工匠：下面的地方已经没救了！现在停下来还不晚！"
  npc_override_harboro1_quests_rockridge_menu_scared_9a2e9b: "害怕的工匠：除非他们承诺给我工伤赔偿，否则我不干了！"
  npc_override_harboro1_quests_rockridge_menu_scared_cfb7db: "害怕的工匠：一大群虫子爬过地上我的同事向我扑来，我吓得什么都做不了。为什么没人告诉我它们的事？"
  npc_override_harboro1_quests_rockridge_menu_scared_f8bed1: "害怕的工匠：你最好再考虑一下。下面很危险。"
  npc_override_harboro1_quests_rockridge_menu_since_e81614: "既然无法确定到底是谁吓到了点点，我想让你消灭每种匪帮各3个：黄鬃、黑鬃和白鬃。"
  npc_override_harboro1_quests_rockridge_menu_so_3bac76: "所以传言是真的：科斯特洛终于逃离了这个鬼地方，对吧？哇哈哈哈！"
  npc_override_harboro1_quests_rockridge_menu_spotty_5017ac: "点点累坏了，睡着了。你能明天4:00之后再来吗？下次我们会有东西给你。"
  npc_override_harboro1_quests_rockridge_menu_thanks_07d9e1: "谢谢，但我每天只需要巡逻一次。你为什么不在明天4:00之后再来？"
  npc_override_harboro1_quests_rockridge_menu_that_df7d71: "这就是为什么我害怕：我不想被所有我伤害过的人的鬼魂纠缠。"
  npc_override_harboro1_quests_rockridge_menu_the_8788c4: "用我现有的食材唯一能做的就是蘑菇汤，但我没有主要食材：蘑菇。"
  npc_override_harboro1_quests_rockridge_menu_this_a8cf4d: "这只是个传言，但GC银行的创始人用他最爱的东西给银行命名：金币。"
  npc_override_harboro1_quests_rockridge_menu_wanderer_35e825: "流浪的喵族：天哪，哪边是东？！"
  npc_override_harboro1_quests_rockridge_menu_warning_833feb: "^0000ff警告：这个地方不适合弱者或胆小的人。^000000"
  npc_override_harboro1_quests_rockridge_menu_we_485eae: "我们每天只做一次。如果一次性消灭太多，它们会察觉不对劲的。请明天4:00之后再来。"
  npc_override_harboro1_quests_rockridge_menu_west_7d7027: "西：旅馆，东：警长办公室"
  npc_override_harboro1_quests_rockridge_midnight_you_d_better_ca_39699c: "午夜了，你最好趁我工作的时候去睡会儿。"
  npc_override_harboro1_quests_rockridge_mine_pretty_far_village_d12a65: "矿离村子很远，所以一开始运输矿石是个大问题。"
  npc_override_harboro1_quests_rockridge_miners_use_signal_others_03c672: "矿工们用它来向矿里的其他人发信号。"
  npc_override_harboro1_quests_rockridge_mister_what_you_doing_he_49cf04: "先生，你在这里做什么？"
  npc_override_harboro1_quests_rockridge_mm_87f9eb: "嗯，而且……"
  npc_override_harboro1_quests_rockridge_mm_adventurer_let_me_tak_fe1480: "嗯，冒险者，让我收回刚才说的话。请帮助我们。"
  npc_override_harboro1_quests_rockridge_mm_how_about_we_just_286f4e: "嗯，要不我们直接付给他们^4d4dff一百万 Zeny 左右^000000买矿石？"
  npc_override_harboro1_quests_rockridge_mm_i_don_t_know_07c751: "嗯，我不知道还能说什么。"
  npc_override_harboro1_quests_rockridge_mm_i_don_t_remember_41d963: "嗯？我不记得科斯特洛长那样。"
  npc_override_harboro1_quests_rockridge_mm_i_m_pretty_sure_00766a: "嗯？我很确定我没见过你。"
  npc_override_harboro1_quests_rockridge_mm_mm_agave_juice_best_9a5ecb: "嗯，嗯！龙舌兰果汁是我在岩脊镇尝过的最好的东西。"
  npc_override_harboro1_quests_rockridge_mm_no_oh_he_gave_ad0878: "嗯？没有？哦，他给你了。"
  npc_override_harboro1_quests_rockridge_mm_no_she_hunts_them_ab0a51: "嗯，不。她只在需要皮毛和肉的时候才猎杀它们。"
  npc_override_harboro1_quests_rockridge_mm_now_239243: "嗯，现在不行。"
  npc_override_harboro1_quests_rockridge_mm_then_i_ll_become_e4a96a: "嗯……那我就当村子里第二好的织网人！"
  npc_override_harboro1_quests_rockridge_mm_wait_did_costello_sen_c075fe: "嗯？等等，是科斯特洛派你来的吗？"
  npc_override_harboro1_quests_rockridge_mm_what_you_said_b61770: "嗯？你说了什么？"
  npc_override_harboro1_quests_rockridge_mm_where_they_things_you_496e3e: "嗯？它们在哪里？你说要给我的东西。"
  npc_override_harboro1_quests_rockridge_mm_who_s_there_you_487f23: "嗯？谁在那里？是你吗，查理？"
  npc_override_harboro1_quests_rockridge_mm_you_look_too_strong_bf18a9: "嗯？但你看起来太强了，不像是个简单的路人。"
  npc_override_harboro1_quests_rockridge_mm_you_mind_helping_us_32c76c: "而且，嗯……你明天介意再帮我们一次吗？点点一直把家里的东西带到荒原去，我们需要把它们找回来。"
  npc_override_harboro1_quests_rockridge_mm_you_re_adventurer_rig_2517c6: "嗯，你是冒险者，对吧？那就穿过那扇门一直往前走。"
  npc_override_harboro1_quests_rockridge_mm_you_re_one_us_80e46a: "嗯？你不是我们的人。如果你需要工作，你应该去别的地方看看。"
  npc_override_harboro1_quests_rockridge_mm_you_want_your_things_4ca95d: "嗯，你想要回你的东西吗？"
  npc_override_harboro1_quests_rockridge_mm_your_logic_isn_t_08fde6: "嗯……你的逻辑不是完全无懈可击，但至少证明你认识卡克特伦和莱克特。"
  npc_override_harboro1_quests_rockridge_mom_said_she_d_bring_1f088d: "妈妈说她要给我带龙舌兰口味果汁。我的龙舌兰口味果汁……"
  npc_override_harboro1_quests_rockridge_mommy_i_m_okay_9940c2: "妈妈，我没事。"
  npc_override_harboro1_quests_rockridge_mommy_when_we_live_above_cc083e: "妈妈，我们什么时候才能再住到地面上？"
  npc_override_harboro1_quests_rockridge_more_than_f9c07b: "超过"
  npc_override_harboro1_quests_rockridge_more_than_we_need_80c77c: "比我们需要的多。"
  npc_override_harboro1_quests_rockridge_most_buildings_made_wood_f6bc14: "大部分建筑都是木制的，容易腐烂。彻底填埋它们花了很多钱和精力，这样我们的新地面才不会下沉。"
  npc_override_harboro1_quests_rockridge_mother_nature_allows_wee_ae90ca: "大自然母亲允许杂草生长。她允许它们留在这里。"
  npc_override_harboro1_quests_rockridge_move_80510d: "让开。"
  npc_override_harboro1_quests_rockridge_move_north_center_mine_y_0e53e4: "往矿的中心北边移动，你就会看到坏掉的电梯。"
  npc_override_harboro1_quests_rockridge_mr_chairman_i_ve_just_f43b50: "^000077董事长，我刚接到地下室的电话。又有五名工人被怪物袭击了。^000000"
  npc_override_harboro1_quests_rockridge_mr_future_mayor_7222be: "未来的镇长先生。"
  npc_override_harboro1_quests_rockridge_mr_karam_pucci_sent_me_9d9bf3: "卡拉姆·普奇先生派我来的。"
  npc_override_harboro1_quests_rockridge_mr_midnight_they_used_yo_552714: "但是，午夜先生，他们曾经是你的……"
  npc_override_harboro1_quests_rockridge_mr_wyatt_warp_sheriff_vi_633d30: "^4d4dff怀亚特·沃普^000000先生是这个村子的警长，他可以告诉你更多关于匪帮的事。"
  npc_override_harboro1_quests_rockridge_msg_44c582: "……？"
  npc_override_harboro1_quests_rockridge_msg_61ce5a: "[{0}]"
  npc_override_harboro1_quests_rockridge_msg_6eae3a: "……"
  npc_override_harboro1_quests_rockridge_msg_82ba6b: "……！"
  npc_override_harboro1_quests_rockridge_must_boring_those_sea_an_1ee601: "但对那些海葵来说一定不无聊"
  npc_override_harboro1_quests_rockridge_must_signaling_rock_john_1e83a8: "这一定是约翰尼·詹姆斯告诉我的信号石。"
  npc_override_harboro1_quests_rockridge_must_what_mr_mcphy_looki_6c76cc: "- 这一定是麦克菲先生要找的东西。我应该带给她。-"
  npc_override_harboro1_quests_rockridge_mwa_hah_hah_9c721a: "哇哈哈哈！"
  npc_override_harboro1_quests_rockridge_mwa_hah_hah_hah_35a9f7: "哇哈哈哈哈！"
  npc_override_harboro1_quests_rockridge_mwa_hah_hah_i_m_0b2921: "哇哈哈哈，我要把所有东西都挖出来！"
  npc_override_harboro1_quests_rockridge_mwah_hah_hah_beer_best_49581b: "哇哈哈哈！啤酒是最好的！"
  npc_override_harboro1_quests_rockridge_my_clementine_so_old_c57924: "我的克莱门汀没那么老！"
  npc_override_harboro1_quests_rockridge_my_company_pink_rose_stu_3e6bcb: "我的公司，粉红玫瑰，在寻找新市场时偶然发现了它。"
  npc_override_harboro1_quests_rockridge_my_dad_works_train_stati_c38e27: "我爸爸在火车站工作。"
  npc_override_harboro1_quests_rockridge_my_father_so_strong_he_5684cf: "我爸爸很强壮，一次能搬很多箱子！"
  npc_override_harboro1_quests_rockridge_my_gramps_best_cactus_i_f98e15: "我爷爷是我认识的最棒的仙人掌！"
  npc_override_harboro1_quests_rockridge_my_husband_i_look_around_733429: "我丈夫和我会去村子里找找看，以防万一。如果你找到了什么，请回到这里来。"
  npc_override_harboro1_quests_rockridge_my_job_make_sure_36e52a: "我的工作是确保"
  npc_override_harboro1_quests_rockridge_my_job_protect_against_r_1e2c81: "我的工作是保护它免受雨水、风和当然还有小偷的侵害。"
  npc_override_harboro1_quests_rockridge_my_lovely_clementine_i_p_fec202: "我可爱的克莱门汀……我在这里向她求婚的。"
  npc_override_harboro1_quests_rockridge_my_mom_better_hunting_co_ee46f9: "我妈妈猎杀郊狼比任何冒险者都厉害。我也能猎杀它们！"
  npc_override_harboro1_quests_rockridge_my_mom_gave_me_ring_ec865e: "我妈妈在我离开家乡去异国他乡之前给了我那枚戒指。我一直留着以备不时之需，而那只杂种从我这里偷走了它！"
  npc_override_harboro1_quests_rockridge_my_name_donovan_9886f0: "我叫多诺万，"
  npc_override_harboro1_quests_rockridge_my_office_filled_thieves_61769c: "我的办公室里全是小偷。每个人都指望拿工资？却不干活！"
  npc_override_harboro1_quests_rockridge_my_own_sake_353c55: "为了我自己。"
  npc_override_harboro1_quests_rockridge_my_what_da433a: "我的什么？"
  npc_override_harboro1_quests_rockridge_my_wife_i_decided_check_bd4ab4: "我妻子和我决定分头在村子里找，但我不确定我们能不能在你回来之前找完。"
  npc_override_harboro1_quests_rockridge_my_wife_said_spotty_went_7fd054: "我妻子说点点从后门出去，径直跑过了铁丝网篱笆。"
  npc_override_harboro1_quests_rockridge_my_wife_says_she_d_05ddcf: "我妻子说她会把它赶出去，但她不是认真的。不管她多生气，她从不举手打它，而且她总是记得给它喂维生素和打疫苗。"
  npc_override_harboro1_quests_rockridge_my_wife_sent_me_here_eeee27: "我妻子派我来给你指路，但我根本不知道它可能在哪里。"
  npc_override_harboro1_quests_rockridge_need_taken_care_first_921a89: "需要先处理掉。"
  npc_override_harboro1_quests_rockridge_negotiation_off_table_mo_f60909: "从你突袭老大的那一刻起，谈判就已经结束了。"
  npc_override_harboro1_quests_rockridge_never_mind_me_i_complete_1465a9: "别管我。我完全理解。哎呀，我站了太久，腿都快动不了了！"
  npc_override_harboro1_quests_rockridge_next_time_feab17: "下次，"
  npc_override_harboro1_quests_rockridge_next_time_we_meet_we_929b80: "下次我们见面，就是在约翰尼的葬礼上了，明白吗？"
  npc_override_harboro1_quests_rockridge_nice_meet_you_55c5a3: "很高兴认识你！"
  npc_override_harboro1_quests_rockridge_nice_meet_you_64753c: "很高兴认识你。"
  npc_override_harboro1_quests_rockridge_nice_meet_you_my_name_db1b8f: "很高兴认识你！我叫肖恩·麦柯迪，是矿里的工头。"
  npc_override_harboro1_quests_rockridge_nicer_got_2c6eaf: "态度好点，明白吗。"
  npc_override_harboro1_quests_rockridge_no_because_there_s_way_804f2c: "不。因为有一条通往矿二楼的路。"
  npc_override_harboro1_quests_rockridge_no_east_side_overrun_buf_f5c0f1: "不。东边被野牛匪帮占领了。我们应该等那边的情况解决。"
  npc_override_harboro1_quests_rockridge_no_hasn_t_s_just_6fd043: "不，没有。还是和我们离开时一样。"
  npc_override_harboro1_quests_rockridge_no_i_couldn_t_stood_c93ab0: "不，我不可能坚守阵地。你不在场。总之，那些野牛用我的炸弹炸毁了运矿石的火车，然后占领了矿。猜猜我后来怎么样了。"
  npc_override_harboro1_quests_rockridge_no_i_didn_t_say_3a536b: "^990000不，我没那么说！只是今天做饭要花一点时间。别慌！^000000"
  npc_override_harboro1_quests_rockridge_no_i_m_asking_you_e5ab08: "不。我是在邀请你加入我们的伟大计划。总之，你知道东边那个矿吗？它以前属于金月？"
  npc_override_harboro1_quests_rockridge_no_i_m_just_tourist_760796: "不。我只是个游客。"
  npc_override_harboro1_quests_rockridge_no_i_m_worried_about_2643b6: "不，我不是担心他们，但我担心我们。如果这出错了……？"
  npc_override_harboro1_quests_rockridge_no_matter_how_hard_i_7f062d: "不管我多努力"
  npc_override_harboro1_quests_rockridge_no_means_we_ve_been_cf8df8: "不……这意味着我们一直在这里白等。"
  npc_override_harboro1_quests_rockridge_no_no_then_everyone_find_69863a: "不。不，那样大家就会发现。"
  npc_override_harboro1_quests_rockridge_no_one_else_cares_about_4c7eca: "现在没有人在乎他们自己的下水道系统。"
  npc_override_harboro1_quests_rockridge_no_problem_i_don_t_b49202: "没问题。我不介意在这里多待一会儿。"
  npc_override_harboro1_quests_rockridge_no_technically_speaking_8056c8: "不。严格来说，我们要^0000cd夺回矿^000000。你看到村子里发生的事了吗？自从那些野牛占领了矿，大多数人都失业了。"
  npc_override_harboro1_quests_rockridge_no_thank_you_giving_me_46abae: "不。谢谢你给我。"
  npc_override_harboro1_quests_rockridge_no_there_s_couple_native_13d292: "不。有几个原住民部落。"
  npc_override_harboro1_quests_rockridge_no_they_re_necessary_pun_33a688: "不，但它们是惩罚约翰尼所必需的。"
  npc_override_harboro1_quests_rockridge_no_wasn_t_1616f7: "- 不，不是。"
  npc_override_harboro1_quests_rockridge_no_we_just_stay_strong_948562: "不。我们只要坚持到这件事结束。之后会有机会的。"
  npc_override_harboro1_quests_rockridge_no_why_i_give_you_eff18b: "不。我为什么要给你卡克特伦丢了的东西？"
  npc_override_harboro1_quests_rockridge_no_why_should_i_he_a49b26: "不。为什么是我？他问你。而且，小孩通常让我胃疼。"
  npc_override_harboro1_quests_rockridge_no_you_re_going_get_42f2d8: "不。你会被抓到，在我们的计划开始之前就毁了它。"
  npc_override_harboro1_quests_rockridge_noise_could_wake_them_up_b812e3: "但噪音可能会吵醒它们。而且会有守卫。"
  npc_override_harboro1_quests_rockridge_none_these_guys_come_bac_3ad055: "这些人没有一个能活着回来，更不用说赚钱了。然后我们还得出去收尸，这对我们来说是双重损失。"
  npc_override_harboro1_quests_rockridge_normally_d_first_thing_c_2e90f4: "正常情况下，那应该是第一个想到的事。"
  npc_override_harboro1_quests_rockridge_nothing_go_83b393: "没什么。继续。"
  npc_override_harboro1_quests_rockridge_nothing_happened_4501ec: "什么都没发生。"
  npc_override_harboro1_quests_rockridge_nothing_left_92676f: "什么都没留下"
  npc_override_harboro1_quests_rockridge_now_6e482e: "目前，"
  npc_override_harboro1_quests_rockridge_now_all_clicks_into_plac_b9adaa: "现在一切都明白了。"
  npc_override_harboro1_quests_rockridge_now_could_you_bring_some_d90e98: "现在，你今天能再带些材料来吗？我们离需要的炸弹数量还差得远。"
  npc_override_harboro1_quests_rockridge_now_excuse_me_i_d_7bde40: "现在，抱歉。我最好找个地方躲起来……"
  npc_override_harboro1_quests_rockridge_now_get_8968ef: "现在，滚！"
  npc_override_harboro1_quests_rockridge_now_get_outta_here_d109ec: "现在滚出去！"
  npc_override_harboro1_quests_rockridge_now_go_shawn_mccurdy_you_39d09b: "现在去找^4d4dff肖恩·麦柯迪^000000，好吗？"
  npc_override_harboro1_quests_rockridge_now_i_don_t_care_280ce7: "现在，我不在乎钱了。我只想休息。喵……"
  npc_override_harboro1_quests_rockridge_now_i_ve_been_assigned_f4899e: "现在，我被分配去矿里巡逻，但因为它们我去不了。"
  npc_override_harboro1_quests_rockridge_now_i_ve_just_received_5d09ce: "而现在，我刚收到那些野蛮人的一封信。"
  npc_override_harboro1_quests_rockridge_now_let_s_take_care_aee31f: "现在，让我们先处理约翰尼，好吗？"
  npc_override_harboro1_quests_rockridge_now_look_ores_shawn_f391a3: "现在，^4d4dff和肖恩一起去找矿石。^000000"
  npc_override_harboro1_quests_rockridge_now_only_one_left_albert_f2c039: "现在只剩下阿尔伯特·福特了。"
  npc_override_harboro1_quests_rockridge_now_our_vigilante_group_fd1ee6: "现在，我们的自卫队和警长办公室不足以抵挡他们。"
  npc_override_harboro1_quests_rockridge_now_problem_18256b: "现在，这就是问题所在。"
  npc_override_harboro1_quests_rockridge_now_s_our_turn_firm_c3c4ca: "现在轮到我们强硬对待他们了。"
  npc_override_harboro1_quests_rockridge_now_scram_e311c8: "现在滚蛋。"
  npc_override_harboro1_quests_rockridge_now_there_more_people_vi_45c196: "现在村子里人多了，工作机会就少了。我很高兴我有一份足够养家糊口的工资。"
  npc_override_harboro1_quests_rockridge_now_there_s_city_named_c3f651: "现在有一个叫^4d4dff岩脊镇^000000的城市，"
  npc_override_harboro1_quests_rockridge_now_we_negotiate_bandits_ab9052: "而现在我们可以和匪帮平等谈判了。"
  npc_override_harboro1_quests_rockridge_now_you_better_head_over_b14821: "现在，你最好去见阿尔伯特。祝和他谈判好运！"
  npc_override_harboro1_quests_rockridge_nya_nya_nya_nya_hah_ba7bd4: "喵！喵——喵！喵哈哈！喵——喵！"
  npc_override_harboro1_quests_rockridge_nya_nya_nya_teehee_nya_a63dae: "喵，喵，喵！嘻嘻，喵！"
  npc_override_harboro1_quests_rockridge_odin_b1a6fb: "奥丁"
  npc_override_harboro1_quests_rockridge_off_we_go_rock_ridge_28d962: "出发去岩脊镇！"
  npc_override_harboro1_quests_rockridge_oh_a4820b: "哦，而且"
  npc_override_harboro1_quests_rockridge_oh_bc894c: "哦，那个。"
  npc_override_harboro1_quests_rockridge_oh_come_help_me_out_1d23ec: "哦，拜托。帮帮我。人们在挨饿。"
  npc_override_harboro1_quests_rockridge_oh_he_did_c7f484: "哦，他确实做了！"
  npc_override_harboro1_quests_rockridge_oh_i_close_today_come_f0327d: "哦，我今天关门。明天再来。"
  npc_override_harboro1_quests_rockridge_oh_i_don_t_think_7ff0d8: "哦，而且我不认为我会成为下一任镇长。"
  npc_override_harboro1_quests_rockridge_oh_i_m_sorry_i_bf4d8c: "哦，对不起，我没告诉你他的名字，是吗？"
  npc_override_harboro1_quests_rockridge_oh_i_see_bb3c05: "哦，我明白了。"
  npc_override_harboro1_quests_rockridge_oh_make_sure_no_one_5a05db: "哦，而且确保没人知道这件事。"
  npc_override_harboro1_quests_rockridge_oh_poor_spotty_you_re_51b698: "哦，可怜的点点。你掉毛掉得浑身痒。想让爸爸给你梳毛吗？"
  npc_override_harboro1_quests_rockridge_oh_right_he_didn_t_5e8097: "哦，对了？他没有消失。他在码头，随时可以离开。"
  npc_override_harboro1_quests_rockridge_oh_right_here_s_your_e0a034: "哦，对了？这是答应给你的报酬。谢谢。"
  npc_override_harboro1_quests_rockridge_oh_right_i_almost_forgot_aeb6a1: "哦，对了！我差点忘了^4d4dff肖恩·麦柯迪^000000想跟你谈谈矿的事。"
  npc_override_harboro1_quests_rockridge_oh_right_i_also_need_912b85: "哦，对了？我还需要消灭30只郊狼。"
  npc_override_harboro1_quests_rockridge_oh_right_spotty_been_she_4ee702: "哦，对了！点点最近掉毛很厉害。也许你应该找有白毛漂浮的洞。"
  npc_override_harboro1_quests_rockridge_oh_right_why_don_t_752037: "哦，对了！我们为什么不问问这个小孩？"
  npc_override_harboro1_quests_rockridge_oh_s_right_hey_stranger_0bc991: "……哦，对了！嘿，陌生人，"
  npc_override_harboro1_quests_rockridge_oh_so_you_re_0ce5c0: "哦，原来你是"
  npc_override_harboro1_quests_rockridge_oh_thank_you_b522ca: "哦，谢谢你！"
  npc_override_harboro1_quests_rockridge_oh_wait_1e33e5: "哦，等等。"
  npc_override_harboro1_quests_rockridge_oh_where_my_manners_6570c4: "哦，我怎么这么没礼貌？"
  npc_override_harboro1_quests_rockridge_oh_whew_adventurer_0b2fa1: "哦，呼。冒险者。"
  npc_override_harboro1_quests_rockridge_oh_you_adventurer_who_i_dcea10: "哦，你就是那个听说可能成为我们新镇长的冒险者吗？"
  npc_override_harboro1_quests_rockridge_oh_you_don_t_smacks_c9a406: "哦，你没有。*咂嘴* 真令人失望！"
  npc_override_harboro1_quests_rockridge_oh_you_first_need_talk_3e3c22: "哦，但你首先需要^4d4dff和他谈谈。^000000"
  npc_override_harboro1_quests_rockridge_oh_you_know_where_best_cd0023: "哦，你知道这里最好的餐馆在哪里吗？"
  npc_override_harboro1_quests_rockridge_oh_you_should_talk_shawn_4ed6e9: "哦，你出去的时候应该和肖恩·麦柯迪谈谈。"
  npc_override_harboro1_quests_rockridge_oh_you_want_help_me_e7c3b7: "哦，你想再帮我一次。"
  npc_override_harboro1_quests_rockridge_oh_you_want_lighten_your_a4729c: "哦，你想先^FF0000减轻背包重量^000000再给我看。好的！"
  npc_override_harboro1_quests_rockridge_okay_4371ac: "好的。"
  npc_override_harboro1_quests_rockridge_okay_also_aggravated_pro_72aea5: "好的，这也加剧了野牛匪帮的问题，但凡事都有两面性。"
  npc_override_harboro1_quests_rockridge_okay_i_ll_give_you_43af45: "好的，我给你。但如果我发现你骗了我，我会让你为背叛仙人掌的信任付出代价。"
  npc_override_harboro1_quests_rockridge_okay_i_understand_if_you_71f185: "好的，如果你帮不了我们，我理解。"
  npc_override_harboro1_quests_rockridge_okay_okay_i_understand_i_dafa32: "好的，好的，如果你忙我理解。但我给你的提议对我们双方都有利。"
  npc_override_harboro1_quests_rockridge_okay_s_enough_2f8edc: "好的，够了。"
  npc_override_harboro1_quests_rockridge_okay_then_off_we_go_fe02de: "好的，那我们出发去岩脊镇。"
  npc_override_harboro1_quests_rockridge_okay_you_better_get_goin_778ddb: "好的，你最好赶紧去见野牛匪帮，免得他们找到这个地方。"
  npc_override_harboro1_quests_rockridge_once_coward_costello_lea_89cb16: "一旦那个懦夫科斯特洛回大陆，我就是新镇长了。"
  npc_override_harboro1_quests_rockridge_once_we_get_ores_back_f35ec0: "一旦我们拿回矿石，就没什么好担心的了。"
  npc_override_harboro1_quests_rockridge_once_we_retrieve_our_ore_a587d6: "一旦我们拿回矿石，我们就消灭匪帮！"
  npc_override_harboro1_quests_rockridge_one_day_i_m_just_05e059: "总有一天，我要把你的牙全部拔光。"
  npc_override_harboro1_quests_rockridge_one_greatest_challenges_def7b1: "你们村子面临的最大挑战之一。"
  npc_override_harboro1_quests_rockridge_one_look_them_i_knew_09ad4c: "只看一眼，我就知道他们是臭名昭著的^0000cd野牛匪帮^000000。他们想要我的炸弹的原因显而易见。"
  npc_override_harboro1_quests_rockridge_one_more_condition_149a58: "还有一个条件。"
  npc_override_harboro1_quests_rockridge_one_them_cacti_cute_look_fd1c96: "其中一个是^4d4dff仙人掌族^000000，住在附近的可爱的人们。"
  npc_override_harboro1_quests_rockridge_one_them_doesn_t_belong_d492d5: "这是其中一个，而且它不是你的。"
  npc_override_harboro1_quests_rockridge_only_people_as_strong_as_799066: "只有像你这么强的人才能在里面进出而不受伤。"
  npc_override_harboro1_quests_rockridge_only_stone_sticking_out_cbffe1: "里面只有一块突出的石头。-"
  npc_override_harboro1_quests_rockridge_only_thing_left_hang_him_d27159: "唯一要做的就是绞死他，这样其他人就会学到不要再来惹我们！"
  npc_override_harboro1_quests_rockridge_only_thing_left_me_rewar_0b060b: "我唯一要做的就是奖励你。"
  npc_override_harboro1_quests_rockridge_only_thing_thrives_becau_4caceb: "冒险者涌入唯一带来的繁荣就是旅馆。"
  npc_override_harboro1_quests_rockridge_only_weeds_growing_insid_6d0f8b: "里面只有杂草在生长。-"
  npc_override_harboro1_quests_rockridge_only_wet_soil_inside_bfcc78: "里面只有湿土。-"
  npc_override_harboro1_quests_rockridge_only_worked_because_he_h_e52e05: "而且这之所以能成功，是因为他和他的朋友是仙人掌族。"
  npc_override_harboro1_quests_rockridge_oops_691512: "……哎呀。"
  npc_override_harboro1_quests_rockridge_ores_f1ec20: "矿石。"
  npc_override_harboro1_quests_rockridge_ores_they_stole_equal_th_0fcb5b: "他们偷走的矿石相当于三个月的工作量。"
  npc_override_harboro1_quests_rockridge_ores_what_they_want_exch_8b10e4: "为了矿石。他们想用什么交换？"
  npc_override_harboro1_quests_rockridge_other_tribe_tauruses_db9b9e: "另一个部落是^4d4dff金牛座^000000。"
  npc_override_harboro1_quests_rockridge_other_words_ores_no_use_c1d80e: "换句话说，矿石对匪帮来说没有用。"
  npc_override_harboro1_quests_rockridge_others_11119f: "其他人"
  npc_override_harboro1_quests_rockridge_others_need_know_truth_42c93b: "而且其他人需要知道真相。"
  npc_override_harboro1_quests_rockridge_our_biggest_threat_undou_ca62f8: "我们最大的威胁无疑是野牛匪帮，但我们也有一些野生动物的问题。"
  npc_override_harboro1_quests_rockridge_our_home_1af772: "我们的家"
  npc_override_harboro1_quests_rockridge_our_investment_products_9aae63: "但我们的投资产品只面向企业。"
  npc_override_harboro1_quests_rockridge_our_job_take_you_away_5cd701: "我们的工作就是把你带走！"
  npc_override_harboro1_quests_rockridge_our_sheriff_doesn_t_lega_4bf0d5: "我们的警长没有法律权力，但他的办公室仍然是我们处理这种事唯一能求助的地方。"
  npc_override_harboro1_quests_rockridge_our_village_protected_it_188376: "我们的村子有自己的自卫队保护。"
  npc_override_harboro1_quests_rockridge_pant_pant_2747f0: "*喘气*"
  npc_override_harboro1_quests_rockridge_people_just_won_t_stop_1d72e0: "人们就是不停地来到这个村子。"
  npc_override_harboro1_quests_rockridge_people_working_mines_alw_d0659a: "在矿里工作的人总是需要炸弹。我来这里，希望能一边做自己喜欢的事一边赚钱。"
  npc_override_harboro1_quests_rockridge_pick_one_you_like_15065a: "挑一个你喜欢的。"
  npc_override_harboro1_quests_rockridge_pink_rose_headquarters_d_fb98e6: "粉红玫瑰总部决定需要来自米德加尔特的有能力的冒险者来处理这种情况。"
  npc_override_harboro1_quests_rockridge_pink_rose_headquarters_s_58016e: "粉红玫瑰总部说会派人来处理野牛匪帮。"
  npc_override_harboro1_quests_rockridge_pioneering_spirit_cheers_3fc90a: "为了拓荒精神！干杯！"
  npc_override_harboro1_quests_rockridge_pipes_994937: "管道"
  npc_override_harboro1_quests_rockridge_pipes_need_maintenance_c_1ce840: "需要维护的管道被涂成了不同的颜色以便识别。准备好了之后，进入左边的门。"
  npc_override_harboro1_quests_rockridge_pipes_water_pump_02bb0c: "在管道和水泵上。"
  npc_override_harboro1_quests_rockridge_place_5e367c: "这个地方"
  npc_override_harboro1_quests_rockridge_place_abundant_minerals_e29c20: "这个地方富含矿物。"
  npc_override_harboro1_quests_rockridge_place_amazing_look_these_fb1f46: "这个地方太棒了。看看这些大木屋。"
  npc_override_harboro1_quests_rockridge_place_hasn_t_changed_all_8679d7: "这个地方一点都没变。"
  npc_override_harboro1_quests_rockridge_place_pretty_far_s_expen_be2b3b: "那个地方很远，去那里很贵，但我可以为你破例免除船费。"
  npc_override_harboro1_quests_rockridge_place_pretty_far_so_s_e4a3f2: "那个地方很远，所以去那里很贵。"
  npc_override_harboro1_quests_rockridge_place_so_many_people_com_2c4c9a: "这个地方人来人往太多了，很难追踪每一个人。"
  npc_override_harboro1_quests_rockridge_please_careful_640e53: "请小心。"
  npc_override_harboro1_quests_rockridge_please_careful_adventure_11700d: "请小心，冒险者。"
  npc_override_harboro1_quests_rockridge_please_come_again_268879: "请再来。"
  npc_override_harboro1_quests_rockridge_please_eliminate_buffalo_4e7fe1: "请^4d4dff消灭野牛匪帮，并在路上带上5条棕色围巾和5条匪帮围巾^000000。"
  npc_override_harboro1_quests_rockridge_please_help_pink_rose_i_fac65a: "请帮帮粉红玫瑰？我是说，岩脊镇。"
  npc_override_harboro1_quests_rockridge_please_hunt_coyotes_help_f3bfbb: "请消灭^0000ff20只郊狼^000000，帮助我们的朋友。"
  npc_override_harboro1_quests_rockridge_please_hunt_gasters_mine_175bf5: "请在村子外的矿里消灭10只^0000ff气态怪^000000。"
  npc_override_harboro1_quests_rockridge_please_hurry_up_d41952: "请快点。"
  npc_override_harboro1_quests_rockridge_please_just_bring_c74a74: "请只要带"
  npc_override_harboro1_quests_rockridge_please_keep_hunting_coyo_f4d7cc: "请尽可能经常地消灭郊狼。如果你打算经常来这个地方，它们对你和对我们一样麻烦。"
  npc_override_harboro1_quests_rockridge_please_leave_4c8fd7: "请离开。"
  npc_override_harboro1_quests_rockridge_please_take_small_token_00f7de: "请收下这份小小的心意。"
  npc_override_harboro1_quests_rockridge_plus_doesn_t_he_look_3e6596: "而且，他看起来不像是习惯干粗活的人吗？他有跑步者的身材和锐利的眼睛，什么都不放过。我喜欢这样的孩子。"
  npc_override_harboro1_quests_rockridge_ppl_removal_version_f22d1b: "^0000ffPPL移除版本。^000000"
  npc_override_harboro1_quests_rockridge_pretty_little_ladies_lik_178c91: "像你这样的漂亮小姑娘可以两百 Zeny 买到。"
  npc_override_harboro1_quests_rockridge_prevent_flooding_34e148: "以防止洪水。"
  npc_override_harboro1_quests_rockridge_problem_2c38b9: "问题是，"
  npc_override_harboro1_quests_rockridge_protecting_my_company_s_8688a3: "保护我公司的利润固然重要，但如果我死了，那还有什么意义呢？"
  npc_override_harboro1_quests_rockridge_proud_yourself_506c13: "为自己骄傲。"
  npc_override_harboro1_quests_rockridge_proves_their_stupidity_531dbe: "但这证明了他们的愚蠢。"
  npc_override_harboro1_quests_rockridge_pumped_out_into_sea_f4604c: "而且它必须被泵入大海"
  npc_override_harboro1_quests_rockridge_pumps_sewage_system_dc7c1e: "水泵和污水系统"
  npc_override_harboro1_quests_rockridge_purple_ore_fragments_89c29a: "紫色矿石碎片"
  npc_override_harboro1_quests_rockridge_purple_ores_produced_min_c0d9e6: "矿里出产的^4d4dff紫色矿石^000000相当赚钱。事实上，它们是粉红玫瑰最畅销的产品。"
  npc_override_harboro1_quests_rockridge_quit_fb25bb: "退出。"
  npc_override_harboro1_quests_rockridge_rat_sneaked_937ac8: "一只老鼠溜进来了。"
  npc_override_harboro1_quests_rockridge_rate_i_d_spend_all_129243: "这样下去，我赚的 Zeny 都要付医药费了。*呜咽*"
  npc_override_harboro1_quests_rockridge_really_thanks_i_ll_count_0da004: "真的吗？谢谢！我就指望你了！"
  npc_override_harboro1_quests_rockridge_recently_bandits_stole_f_be608a: "最近，匪帮^4d4dff偷走了我们用来运输矿石的货运火车^000000。"
  npc_override_harboro1_quests_rockridge_recently_group_bandits_d_55e78c: "最近，一群^4d4dff匪帮决定他们想要矿^000000。"
  npc_override_harboro1_quests_rockridge_recently_though_hmpf_my_cf4b6f: "但最近……哼，我的骄傲被那些该死的野牛匪帮击碎了。"
  npc_override_harboro1_quests_rockridge_recently_we_ve_drilled_a_7a3ca6: "但最近，我们在下面又钻了一层。"
  npc_override_harboro1_quests_rockridge_remember_when_we_first_c_0bd870: "还记得我们第一次来这里的时候吗？"
  npc_override_harboro1_quests_rockridge_reset_completed_210d08: "重置完成。"
  npc_override_harboro1_quests_rockridge_reward_money_477b31: "这是赏金。"
  npc_override_harboro1_quests_rockridge_right_2628d8: "{0}，对吧？"
  npc_override_harboro1_quests_rockridge_river_today_same_river_y_1173de: "但今天的河流已不是昨天的河流。事物不断变化，这是自然的。"
  npc_override_harboro1_quests_rockridge_road_also_goes_outside_v_9b730a: "这条路也通往村子外面，通往基瓦瓦沙漠。"
  npc_override_harboro1_quests_rockridge_rob_mine_f63522: "抢矿？"
  npc_override_harboro1_quests_rockridge_rock_creates_deep_echoin_1aef34: "这块石头被敲击时会发出深沉的回响。"
  npc_override_harboro1_quests_rockridge_rock_ridge_9e4365: "为了岩脊镇！"
  npc_override_harboro1_quests_rockridge_rock_ridge_become_transp_4efe1f: "为了让岩脊镇成为交通枢纽，住在周围的怪物必须被清除，但我们找不到合适的人选来做这件事。"
  npc_override_harboro1_quests_rockridge_rock_ridge_coin_you_use_598907: "这是岩脊镇硬币。你可以在村子里当钱用。我不愿意让你白帮忙。很高兴你至少能拿到这个。"
  npc_override_harboro1_quests_rockridge_rock_ridge_coin_yours_th_bf3aa1: "那枚岩脊镇硬币是你的。谢谢你的帮助。"
  npc_override_harboro1_quests_rockridge_rock_ridge_having_tiny_b_dcfc8b: "岩脊镇遇到了一点小问题，"
  npc_override_harboro1_quests_rockridge_rock_ridge_land_dreams_o_5dd4ea: "岩脊镇是梦想和机遇之地。"
  npc_override_harboro1_quests_rockridge_rock_ridge_land_gold_opp_3a4a4a: "岩脊镇，黄金和机遇之地！"
  npc_override_harboro1_quests_rockridge_rock_ridge_mining_city_2bd358: "岩脊镇是一个矿业城市，"
  npc_override_harboro1_quests_rockridge_rock_ridge_plaza_0bc10d: "岩脊镇广场"
  npc_override_harboro1_quests_rockridge_rock_ridge_seaside_villa_1e1c7c: "岩脊镇是一个海边村庄。一开始……嗯，直到现在它还在和大海搏斗。"
  npc_override_harboro1_quests_rockridge_rock_ridge_thanks_you_2b7413: "岩脊镇感谢你"
  npc_override_harboro1_quests_rockridge_s_about_time_meet_bandit_e51247: "该去见匪帮了。"
  npc_override_harboro1_quests_rockridge_s_agave_flavored_drink_p_84495d: "这是龙舌兰口味饮料粉。"
  npc_override_harboro1_quests_rockridge_s_because_they_ve_been_945a46: "是因为它们一直在袭击我们，而且越来越严重。"
  npc_override_harboro1_quests_rockridge_s_because_you_one_night_13ce53: "而且是因为你！一天晚上，一些人来找我，说他们听说我是炸弹专家。他们要求我捐炸弹给他们。"
  npc_override_harboro1_quests_rockridge_s_been_two_months_since_3923c3: "你辞职已经两个月了，你不帮忙做家务，反而在宠那只狗。你要为它的不良行为负责！"
  npc_override_harboro1_quests_rockridge_s_blocked_we_still_use_5d1b27: "但它没有被封住。我们仍然可以使用它。"
  npc_override_harboro1_quests_rockridge_s_cliche_totally_convinc_1103af: "这是老套了，但完全令人信服，不是吗？"
  npc_override_harboro1_quests_rockridge_s_complete_lie_won_t_415fb8: "而且那不是完全的谎言。或者说，很快就会不是了。"
  npc_override_harboro1_quests_rockridge_s_completely_understanda_71ba73: "公司如此焦躁是完全能理解的。"
  npc_override_harboro1_quests_rockridge_s_dangerous_stay_here_to_ea389e: "在这里待太久很危险。"
  npc_override_harboro1_quests_rockridge_s_deadly_only_humans_dor_76d091: "它只对人类和喵族致命。对金牛座来说，它只会引起过敏反应，比如发痒和打喷嚏。"
  npc_override_harboro1_quests_rockridge_s_difficult_64c993: "这并不难。"
  npc_override_harboro1_quests_rockridge_s_east_mm_wait_west_89334e: "是东边？嗯，等等。西边是左手边，然后……"
  npc_override_harboro1_quests_rockridge_s_easy_use_tastes_simila_9290e0: "它很容易使用，味道和真正的龙舌兰果汁相似。小仙人掌们都喜欢这种饮料。"
  npc_override_harboro1_quests_rockridge_s_empty_ba4ded: "它是空的。-"
  npc_override_harboro1_quests_rockridge_s_enough_reason_dismisse_8fa3cf: "而且这不足以成为被罢免的理由。"
  npc_override_harboro1_quests_rockridge_s_five_million_zeny_how_1c7720: "五百万 Zeny。那是多少钱？"
  npc_override_harboro1_quests_rockridge_s_gold_ring_019536: "但它不是金戒指。"
  npc_override_harboro1_quests_rockridge_s_good_we_ve_caught_f5697b: "很好，我们已经抓住了它，"
  npc_override_harboro1_quests_rockridge_s_great_plan_all_right_259f4e: "这不是什么好计划，但总算是个计划。"
  npc_override_harboro1_quests_rockridge_s_heartless_688c54: "真无情。"
  npc_override_harboro1_quests_rockridge_s_how_much_he_likes_4fc06c: "这就是他有多喜欢我。"
  npc_override_harboro1_quests_rockridge_s_interesting_phenomenon_858710: "这是个有趣的现象。我觉得那些招牌是为了让建筑看起来至少正面有两层楼。"
  npc_override_harboro1_quests_rockridge_s_jail_cell_b849da: "这是间牢房。"
  npc_override_harboro1_quests_rockridge_s_job_just_one_man_469888: "而且这不是一个人能完成的工作。"
  npc_override_harboro1_quests_rockridge_s_johnny_we_ve_wanted_af1af5: "而且我们一直以来想要的就是约翰尼。"
  npc_override_harboro1_quests_rockridge_s_just_a81584: "只是"
  npc_override_harboro1_quests_rockridge_s_just_safe_us_too_7a4d51: "只是周围有太多郊狼对我们不安全。这就是为什么我们请冒险者帮忙。"
  npc_override_harboro1_quests_rockridge_s_just_temporary_ecdd66: "但那只是暂时的。"
  npc_override_harboro1_quests_rockridge_s_just_things_haven_t_b747cd: "只是……情况一直不太好。"
  npc_override_harboro1_quests_rockridge_s_like_those_buffaloes_w_624ca6: "那些野牛又没有办法确认。"
  npc_override_harboro1_quests_rockridge_s_lot_contrary_what_most_29e144: "而且那不算多，与大多数人的想法相反。"
  npc_override_harboro1_quests_rockridge_s_mineral_vein_decorativ_5a5bb6: "那不是矿脉，而是我们村民一起搬来的装饰石。我告诉过他，但他不在乎！"
  npc_override_harboro1_quests_rockridge_s_mineral_vein_s_decorat_b91dc5: "那不是矿脉，是装饰石！把镐拿开，现在！"
  npc_override_harboro1_quests_rockridge_s_more_like_anyway_we_4da425: "这才像话。总之，我们要去抢^0000cd矿^000000。"
  npc_override_harboro1_quests_rockridge_s_mrs_cacturon_lost_let_4ae665: "就是这样。卡克特伦夫人把它弄丢了。让我把它带回去给她。"
  npc_override_harboro1_quests_rockridge_s_mrs_cacturon_s_let_92674f: "这是卡克特伦夫人的。让我把它带回去给她。"
  npc_override_harboro1_quests_rockridge_s_none_my_business_i_53fb99: "- 那不关我的事。我就直接走过去。-"
  npc_override_harboro1_quests_rockridge_s_o_clock_direction_when_961297: "打开地图时在3点钟方向。"
  npc_override_harboro1_quests_rockridge_s_only_filled_dust_185920: "里面只有灰尘。-"
  npc_override_harboro1_quests_rockridge_s_perfect_day_visit_rock_e2d40d: "今天是游览岩脊镇的好日子，不是吗？"
  npc_override_harboro1_quests_rockridge_s_possible_3a9d79: "那是有可能的。"
  npc_override_harboro1_quests_rockridge_s_possible_bandits_know_496dec: "但匪帮可能知道我们在矿里找箱子。"
  npc_override_harboro1_quests_rockridge_s_pretty_windy_today_i_d7aadc: "今天风很大。我最好把所有的门窗都关好。"
  npc_override_harboro1_quests_rockridge_s_real_i_see_17c634: "那是真的，我明白了。"
  npc_override_harboro1_quests_rockridge_s_right_seeds_distrust_b_ad2fbc: "没错。不信任的种子已经种下了。我们现在要做的就是"
  npc_override_harboro1_quests_rockridge_s_right_we_reclaim_mine_55aa13: "没错。我们也得夺回矿。"
  npc_override_harboro1_quests_rockridge_s_secret_96342d: "这是个秘密。"
  npc_override_harboro1_quests_rockridge_s_should_i_uh_mm_e0d667: "我——我应该吗？呃，嗯……好吧。"
  npc_override_harboro1_quests_rockridge_s_something_citizens_han_ef039d: "而且这不是普通市民能处理的事。"
  npc_override_harboro1_quests_rockridge_s_sweetheart_you_shouldn_797892: "亲——亲爱的，风这么大你不应该在外面。我们进去吧。"
  npc_override_harboro1_quests_rockridge_s_time_af4b09: "是时候"
  npc_override_harboro1_quests_rockridge_s_time_threaten_them_2bd625: "是时候威胁他们了。"
  npc_override_harboro1_quests_rockridge_s_too_sweet_me_though_bc1212: "不过对我来说太甜了。嗯，那不重要。"
  npc_override_harboro1_quests_rockridge_s_usable_i_ll_just_4f3734: "- 它不能用了。我只能把它留下，再找另一个。-"
  npc_override_harboro1_quests_rockridge_s_weapon_i_talking_about_5d5026: "那就是我说的武器。"
  npc_override_harboro1_quests_rockridge_s_what_cacti_call_wastel_cb48c6: "那是仙人掌族对荒原的称呼。总之，在沙漠北边有一辆^4d4dff静止的货运火车^000000。"
  npc_override_harboro1_quests_rockridge_s_where_those_who_did_f7ce5c: "那是那些做了不该做的事的人戴着手铐进来的地方。"
  npc_override_harboro1_quests_rockridge_s_why_his_spy_hasn_8ad6dd: "这就是为什么他的间谍没听说他的死讯。"
  npc_override_harboro1_quests_rockridge_s_why_place_always_busy_622825: "这就是为什么这个地方总是很忙。这里的延误会导致岩脊镇其他地方都延误。"
  npc_override_harboro1_quests_rockridge_s_why_you_ve_been_0092a0: "这就是为什么你被邀请到岩脊镇。"
  npc_override_harboro1_quests_rockridge_s_worthless_abandoned_812740: "它毫无价值，被遗弃了。"
  npc_override_harboro1_quests_rockridge_save_2c489a: "保存。"
  npc_override_harboro1_quests_rockridge_saved_please_come_again_0482de: "已保存。请再来。"
  npc_override_harboro1_quests_rockridge_say_could_you_0c8d20: "嘿，你能"
  npc_override_harboro1_quests_rockridge_say_good_enough_motivati_4cb8af: "嘿，这够激励你了吗？如果你还是不想帮我们，我不会强迫你。"
  npc_override_harboro1_quests_rockridge_say_how_d_you_like_b21d80: "嘿，你想为我工作吗？我会慷慨地付给你报酬。"
  npc_override_harboro1_quests_rockridge_say_you_5a361d: "嘿，你能做到吗？"
  npc_override_harboro1_quests_rockridge_say_you_want_help_them_5ef25d: "说你想帮他们找戒指。"
  npc_override_harboro1_quests_rockridge_second_look_you_re_too_b6778b: "再看一眼，你太弱了，反正也去不了那里。"
  npc_override_harboro1_quests_rockridge_see_those_sea_anemones_t_16fbc4: "看到那些海葵了吗？它们一直堵塞下水道管道，所以我们定期清理它们。我喜欢坐在这里看它们动。每当我这样做，时间就过得飞快。"
  npc_override_harboro1_quests_rockridge_seems_all_strangers_gree_59f32a: "看来所有陌生人都很贪婪，你也不例外。"
  npc_override_harboro1_quests_rockridge_seems_we_wouldn_t_workin_e0a568: "看来我们今天又不用工作了，就像昨天和前天一样。"
  npc_override_harboro1_quests_rockridge_sent_me_adventurers_bcd5c2: "它给我送来了冒险者。"
  npc_override_harboro1_quests_rockridge_settled_bd3ab8: "已经安定下来了。"
  npc_override_harboro1_quests_rockridge_sewage_system_71cdbb: "和污水系统。"
  npc_override_harboro1_quests_rockridge_sewer_system_manager_17b8c1: "下水道系统管理员。"
  npc_override_harboro1_quests_rockridge_shakes_his_head_hah_hah_2609d9: "*摇头* 哈哈哈。"
  npc_override_harboro1_quests_rockridge_shameless_f8a5c7: "或者无耻。"
  npc_override_harboro1_quests_rockridge_shawn_right_ba76af: "肖恩说得对。"
  npc_override_harboro1_quests_rockridge_shawn_said_you_d_bring_99affa: "肖恩说你会带矿石箱来。在哪里？"
  npc_override_harboro1_quests_rockridge_she_didn_t_say_anything_9b1244: "我因为害怕野牛匪帮而辞职时，她什么都没说。她是个好人。"
  npc_override_harboro1_quests_rockridge_she_ll_happy_see_me_e03416: "她看到我做得好会很高兴的。"
  npc_override_harboro1_quests_rockridge_she_worried_sick_when_i_0e4e6d: "一年前我决定去这片大陆时，她担心得要命。"
  npc_override_harboro1_quests_rockridge_sheriff_always_wanted_hi_1f7ff3: "但警长一直想要他。"
  npc_override_harboro1_quests_rockridge_sheriff_been_so_busy_dea_866789: "警长一直忙于处理野牛匪帮，没时间做其他事。我在这里等了他好几个小时。"
  npc_override_harboro1_quests_rockridge_sheriff_even_care_about_0f1e0c: "警长甚至在乎这种情况吗？"
  npc_override_harboro1_quests_rockridge_sheriff_s_office_06966e: "这是警长办公室。"
  npc_override_harboro1_quests_rockridge_sheriff_s_office_3d069a: "在警长办公室。"
  npc_override_harboro1_quests_rockridge_sheriff_s_office_b1382f: "警长办公室"
  npc_override_harboro1_quests_rockridge_sheriff_s_office_shop_bu_885ee5: "警长办公室和商店建筑在这个广场的西面。旅馆和港口在西边更远的地方。"
  npc_override_harboro1_quests_rockridge_sheriff_s_office_those_u_235680: "警长办公室。地下监狱里的人一天吃三顿饭，食物太好吃了，以至于有些人真的会为了它犯轻罪。"
  npc_override_harboro1_quests_rockridge_sheriff_s_office_underst_effa39: "警长办公室严重缺人。我排了一整天的队，队伍还是和我刚来时一样长。我一直听到地下室传来奇怪的声音，我真的需要有人来检查一下。"
  npc_override_harboro1_quests_rockridge_sheriff_traced_bombs_bac_28984d: "警长追查到了炸弹，把我拖走了。"
  npc_override_harboro1_quests_rockridge_sheriff_warp_determined_110a93: "警长沃普决心绞死他。"
  npc_override_harboro1_quests_rockridge_sheriff_warp_doesn_t_wan_3d99d6: "但警长沃普不想那样。"
  npc_override_harboro1_quests_rockridge_sheriff_warp_only_smiles_32963e: "警长沃普只对我微笑。"
  npc_override_harboro1_quests_rockridge_sheriff_warp_told_you_ev_e9b9e9: "警长沃普把一切都告诉你了，对吧？"
  npc_override_harboro1_quests_rockridge_sheriffs_no_better_than_4407b9: "而且警长们也不比他们好。他们让他浑身是血地躺在牢房里。我能怎么办？如果我能帮忙，我不能让任何人死，所以我治疗了他。"
  npc_override_harboro1_quests_rockridge_sheriffs_throw_us_jail_i_6ded8d: "警长会把我们扔进监狱，如果匪帮不杀我们的话。但没关系。我喜欢那里的豆子。"
  npc_override_harboro1_quests_rockridge_should_enough_day_today_9874e2: "今天这些应该够了。"
  npc_override_harboro1_quests_rockridge_should_enough_i_d_better_5efafd: "这些应该够了。我最好回村子向她汇报。"
  npc_override_harboro1_quests_rockridge_should_enough_i_d_better_d97e44: "这些应该够了。我最好回村子向她汇报。"
  npc_override_harboro1_quests_rockridge_show_him_his_mane_d002bb: "给他看他的鬃毛。"
  npc_override_harboro1_quests_rockridge_show_him_ore_550324: "给他看矿石。"
  npc_override_harboro1_quests_rockridge_show_their_mufflers_scar_f5e701: "然后把他们的^4d4dff围巾和围巾给阿尔伯特看。^000000"
  npc_override_harboro1_quests_rockridge_show_what_s_your_hand_f676be: "看看你手里有什么。"
  npc_override_harboro1_quests_rockridge_shows_your_experience_as_36f79e: "这显示了你的冒险者经验。"
  npc_override_harboro1_quests_rockridge_shriek_5dee97: "*尖叫*"
  npc_override_harboro1_quests_rockridge_shut_up_before_i_put_440e33: "闭嘴，不然我给你鼻子穿个环！"
  npc_override_harboro1_quests_rockridge_sigh_a02d05: "唉……"
  npc_override_harboro1_quests_rockridge_sigh_how_long_we_wait_02015e: "唉……我们还要等多久？"
  npc_override_harboro1_quests_rockridge_sigh_i_miss_my_mom_173340: "唉……我想我妈妈。"
  npc_override_harboro1_quests_rockridge_sigh_then_there_s_nothin_ea2f41: "唉，那这里没有我们能卖的东西了。我们现在该去哪里？"
  npc_override_harboro1_quests_rockridge_sigh_when_last_ship_day_a73892: "……唉。当今天最后一班船进港时，我给你买柠檬水、酸橙汽水，你想要什么都行。"
  npc_override_harboro1_quests_rockridge_since_bandits_set_up_sho_4a774a: "自从匪帮在矿里安营扎寨，大部分有经验的矿工都离开了。"
  npc_override_harboro1_quests_rockridge_since_elevator_started_o_087665: "自从电梯开始运行，我们就停止使用那条通道了，"
  npc_override_harboro1_quests_rockridge_since_more_disappeared_y_980b69: "^000077自从昨天又失踪了2个，15个。没人想去下面。^000000"
  npc_override_harboro1_quests_rockridge_since_you_brought_back_m_c4aec8: "自从你找回了我妻子的金戒指，我一直在打零工补贴家用。我们现在有能力报答你了。"
  npc_override_harboro1_quests_rockridge_since_you_opened_mine_c5c121: "自从你打开了矿，"
  npc_override_harboro1_quests_rockridge_sister_loretta_my_legs_h_b8b687: "洛雷塔修女，我的腿疼。*呜咽*"
  npc_override_harboro1_quests_rockridge_sly_bastard_he_betrayed_030fb3: "那个狡猾的混蛋，他背叛了我！"
  npc_override_harboro1_quests_rockridge_small_animal_bone_inside_376ee7: "里面有一根小动物骨头。-"
  npc_override_harboro1_quests_rockridge_small_insect_scuttling_a_4e30ab: "一只小虫子在里面爬来爬去。-"
  npc_override_harboro1_quests_rockridge_sniff_sniff_doesn_t_plac_b3395f: "*嗅嗅* 你不觉得这个地方闻起来很好吗？我喜欢它咸咸的、潮湿的、发霉的味道！我可以在这里住一辈子！"
  npc_override_harboro1_quests_rockridge_sniffle_how_many_days_i_46c800: "*抽泣* 我还要等多少天才能喝到龙舌兰口味果汁？莱克特不想等……等……呜呜呜！"
  npc_override_harboro1_quests_rockridge_sniffle_yes_s_as_pretty_61d89a: "*抽泣* 是的，它和我上次检查时一样漂亮。"
  npc_override_harboro1_quests_rockridge_snort_b64258: "*哼*"
  npc_override_harboro1_quests_rockridge_snort_these_yeah_we_thou_76ca34: "*哼* 这些？是啊，我们以前觉得它们够好了，直到我们意识到外面的怪物有多强。"
  npc_override_harboro1_quests_rockridge_snort_you_d_better_d8a06a: "*哼* 你最好如此。"
  npc_override_harboro1_quests_rockridge_snort_you_re_enemy_i_45d8d2: "*哼* 你是敌人，但我欣赏你的直率。我们想要……？"
  npc_override_harboro1_quests_rockridge_snort_you_think_i_m_4ac127: "*哼* 你以为我傻吗？如果你是小偷，等我回村子的时候你就不会在这里了。"
  npc_override_harboro1_quests_rockridge_so_anyway_buffalo_bandit_6222cd: "总之，野牛匪帮意识到矿有多赚钱，就在里面安了家。"
  npc_override_harboro1_quests_rockridge_so_c7572d: "所以……"
  npc_override_harboro1_quests_rockridge_so_he_could_go_back_4bac94: "这样他就可以带着你的要求回总部了。"
  npc_override_harboro1_quests_rockridge_so_how_much_did_karam_88bf21: "那么卡拉姆告诉了你多少？"
  npc_override_harboro1_quests_rockridge_so_i_m_thinking_a09389: "所以我在想"
  npc_override_harboro1_quests_rockridge_so_i_m_thinking_we_428aa6: "所以我在想我们应该溜到二楼去收集矿石。"
  npc_override_harboro1_quests_rockridge_so_i_ve_heard_cb0755: "我听说了。"
  npc_override_harboro1_quests_rockridge_so_mine_useless_moment_7d5c65: "所以矿目前没用了。"
  npc_override_harboro1_quests_rockridge_so_mission_dd9635: "所以这是个任务。"
  npc_override_harboro1_quests_rockridge_so_most_its_citizens_min_a2a4a2: "所以大部分居民都是矿工和商人。"
  npc_override_harboro1_quests_rockridge_so_now_act_like_god_26f4f1: "所以现在，做好你作为神的仆人的本分。"
  npc_override_harboro1_quests_rockridge_so_we_had_drill_vents_e5c75f: "所以我们不得不直接从地面钻通风口和工人通道。"
  npc_override_harboro1_quests_rockridge_so_we_ve_been_discussing_2b0520: "所以我们一直在讨论下一步行动。"
  npc_override_harboro1_quests_rockridge_so_what_i_help_ef1a01: "那么，我能帮什么忙？"
  npc_override_harboro1_quests_rockridge_so_you_could_prepare_you_79b2e1: "这样你就可以为你的惩罚做准备了。"
  npc_override_harboro1_quests_rockridge_so_you_d_scared_want_3df43f: "这样你就会害怕，想要远离。"
  npc_override_harboro1_quests_rockridge_so_you_re_strong_enough_6299ed: "那么，你足够强大去"
  npc_override_harboro1_quests_rockridge_so_you_things_i_might_cade42: "所以你有什么我可能感兴趣的东西要卖吗？"
  npc_override_harboro1_quests_rockridge_some_cacti_don_t_like_16c226: "有些仙人掌不喜欢拓荒者，但是，小叶子，记住他们也是大自然母亲的孩子。"
  npc_override_harboro1_quests_rockridge_some_come_out_you_eventu_45266d: "有些东西最终会从你身体里出来。可怜的豆子。它们会生气被你们这种混蛋吃掉。"
  npc_override_harboro1_quests_rockridge_some_items_cannot_delete_0b90ff: "有些物品无法删除。"
  npc_override_harboro1_quests_rockridge_some_miners_reported_us_681746: "一些矿工向我们报告了散布神经毒素的气态怪物。"
  npc_override_harboro1_quests_rockridge_some_people_after_sellin_c175f9: "有些人卖了一段时间枪之后，开始觉得自己也擅长用枪。我不是其中之一。我一直都很擅长。"
  npc_override_harboro1_quests_rockridge_some_workers_went_down_b_f1b0e4: "一些工人下去地下室维修时听到了奇怪的沙沙声。"
  npc_override_harboro1_quests_rockridge_someone_must_piled_mound_dd90c8: "- 一定是有人堆了这个沙堆。-"
  npc_override_harboro1_quests_rockridge_someone_needs_convince_a_f08b1e: "需要有人让阿尔伯特相信约翰尼作为人质一文不值，"
  npc_override_harboro1_quests_rockridge_something_inside_8e0018: "里面有东西。-"
  npc_override_harboro1_quests_rockridge_something_shining_inside_d5fab4: "里面有东西在发光，"
  npc_override_harboro1_quests_rockridge_sometimes_he_says_things_eb5cbd: "有时他会说些我听不懂的话，但没关系。"
  npc_override_harboro1_quests_rockridge_soon_he_ll_tried_court_8d047c: "很快他就要上法庭受审了。"
  npc_override_harboro1_quests_rockridge_soon_i_m_going_take_e9f58d: "很快，我要带几个恢复得差不多的矿工去矿的二楼工作。"
  npc_override_harboro1_quests_rockridge_soon_when_daddy_go_work_115498: "很快。等爸爸能回矿里工作的时候。等爸爸妈妈赚够钱买回房子的时候。"
  npc_override_harboro1_quests_rockridge_sorry_i_lock_your_mane_1bcbd9: "对不起，我能要一撮你的鬃毛吗？"
  npc_override_harboro1_quests_rockridge_sorry_we_need_someone_st_2320a1: "对不起，但我们需要比你更强的人。"
  npc_override_harboro1_quests_rockridge_souvenirs_i_ve_got_souve_85bd62: "纪念品！我有纪念品！"
  npc_override_harboro1_quests_rockridge_spotty_digs_holes_buries_d9f4a9: "点点每天挖洞埋东西。如果你在荒原找到洞，请往里面看看。"
  npc_override_harboro1_quests_rockridge_spotty_perfect_dog_if_he_0a39d6: "如果点点不把家里的东西带出去，它就是条完美的狗。唉……"
  npc_override_harboro1_quests_rockridge_spotty_you_alright_don_t_6d9898: "点点，你还好吗？别害怕。爸爸陪着你。"
  npc_override_harboro1_quests_rockridge_spotty_you_want_treat_hm_2b265c: "点点，你想要零食吗？嗯？"
  npc_override_harboro1_quests_rockridge_stand_tall_travel_world_e608cb: "昂首挺胸，像世界是你的那样去周游世界！"
  npc_override_harboro1_quests_rockridge_startled_coyote_scuttled_c36f33: "- 郊狼受惊后退。我走近检查它掉了什么。是果汁粉包装！-"
  npc_override_harboro1_quests_rockridge_still_i_t_help_think_c5da70: "但我还是忍不住觉得一切都发生得太快了。"
  npc_override_harboro1_quests_rockridge_stop_looking_outside_win_78a8db: "别往窗外看了。"
  npc_override_harboro1_quests_rockridge_stop_lying_4466ff: "别撒谎了！"
  npc_override_harboro1_quests_rockridge_stop_resisting_c8763b: "别反抗了！"
  npc_override_harboro1_quests_rockridge_stop_whining_like_wimps_e9dbd6: "别像个废物一样抱怨了。为成为团队的一员而骄傲，更努力地工作！"
  npc_override_harboro1_quests_rockridge_strange_adventurer_i_ve_7504c4: "奇怪的冒险者。我让你消灭^0000CD30只郊狼^000000。你进展如何？"
  npc_override_harboro1_quests_rockridge_strange_adventurer_thank_093507: "奇怪的冒险者，谢谢你回来。"
  npc_override_harboro1_quests_rockridge_strange_adventurer_you_s_996d91: "奇怪的冒险者，你能好心帮我找一下我在荒原丢的龙舌兰饮料粉吗？"
  npc_override_harboro1_quests_rockridge_stranger_8855be: "陌生人……"
  npc_override_harboro1_quests_rockridge_strangers_lost_battle_se_0ee232: "陌生人们输给了大海，放弃了他们的家园。我以为他们会离开，但他们像杂草一样顽强；他们在旧家园之上又建了一个村子。"
  npc_override_harboro1_quests_rockridge_stupid_bandits_i_t_belie_65c22a: "愚蠢的匪帮，真不敢相信他们为了藏矿石把电梯弄坏了。"
  npc_override_harboro1_quests_rockridge_stupid_buffaloes_7dc3ed: "愚蠢的野牛。"
  npc_override_harboro1_quests_rockridge_sure_37a98c: "当然。"
  npc_override_harboro1_quests_rockridge_sure_i_9fe937: "当然，我可以做到。"
  npc_override_harboro1_quests_rockridge_sure_i_you_want_me_e46f36: "当然，我可以做到。你要我^0000CD找到5包龙舌兰饮料粉并消灭30只郊狼^000000，对吧？"
  npc_override_harboro1_quests_rockridge_sure_thing_da4966: "没问题。"
  npc_override_harboro1_quests_rockridge_sure_why_d9c786: "当然，为什么不呢？"
  npc_override_harboro1_quests_rockridge_swamp_arclouzes_fast_car_7d3dec: "沼泽弧光虫是生活在下面的快速食肉昆虫，它们的数量以惊人的速度增长，以至于工人们现在拒绝下去工作。"
  npc_override_harboro1_quests_rockridge_sweet_potato_croquettes_1354d5: "今天菜单上有红薯可乐饼，但我做不出来，因为我没有从大陆收到常规货物。"
  npc_override_harboro1_quests_rockridge_sweetheart_please_calm_d_7b57f4: "亲爱的，请冷静。你有没有可能把它放在他能拿到的地方？"
  npc_override_harboro1_quests_rockridge_t_you_get_water_elsewher_9d45a9: "你不能从别的地方取水吗？"
  npc_override_harboro1_quests_rockridge_t_you_just_attend_meetin_41bdb9: "你就不能参加会议吗，也许假装是总部来的人？"
  npc_override_harboro1_quests_rockridge_t_you_see_big_beautiful_c3f981: "你没看到这栋建筑屋顶上那个又大又漂亮的金币吗？"
  npc_override_harboro1_quests_rockridge_take_care_bandits_7f86b4: "处理匪帮。"
  npc_override_harboro1_quests_rockridge_take_more_things_a0ed22: "拿走更多东西"
  npc_override_harboro1_quests_rockridge_take_your_time_37b967: "慢慢来。"
  npc_override_harboro1_quests_rockridge_takes_up_lot_my_time_10c167: "占用了我很多时间。"
  npc_override_harboro1_quests_rockridge_talking_4dc1e6: "通过和……谈话"
  npc_override_harboro1_quests_rockridge_tattered_fabric_pouch_ha_00fc8d: "- 一个破旧的布袋半埋在沙堆里，但我带的东西太多了，没法检查。我最好先减轻背包重量。-"
  npc_override_harboro1_quests_rockridge_tattered_fabric_pouch_ha_66babc: "- 一个破旧的布袋半埋在沙堆里。可能是卡克特伦夫人的果汁粉包装。-"
  npc_override_harboro1_quests_rockridge_tattered_fabric_pouch_ha_adf8f7: "- 一个破旧的布袋半埋在沙堆里。我觉得只是垃圾。-"
  npc_override_harboro1_quests_rockridge_tell_him_d6dfdc: "告诉他"
  npc_override_harboro1_quests_rockridge_tell_him_longer_they_sta_ba745a: "告诉他他们在矿里待得越久，活下来的机会就越小。"
  npc_override_harboro1_quests_rockridge_tell_johnny_albert_other_fc440d: "告诉约翰尼阿尔伯特和其他人都抛弃了他。阿尔伯特现在是他们的老大！"
  npc_override_harboro1_quests_rockridge_tell_me_what_job_entails_269ea5: "告诉我这份工作具体要做什么。"
  npc_override_harboro1_quests_rockridge_tell_them_you_d_talk_36db3f: "然后告诉他们你得先和总部谈谈。"
  npc_override_harboro1_quests_rockridge_tell_us_where_ores_3d58f6: "告诉我们矿石在哪里。"
  npc_override_harboro1_quests_rockridge_tell_you_what_707467: "告诉你吧。"
  npc_override_harboro1_quests_rockridge_temporary_passage_connec_26d3a6: "那条临时通道连接着二楼最远的角落，"
  npc_override_harboro1_quests_rockridge_temporary_passage_drille_ca76b7: "为开发目的钻的临时通道仍然有用。"
  npc_override_harboro1_quests_rockridge_temporary_passage_isn_t_0dec21: "而且临时通道不安全，自从重新钻了之后就不安全了。"
  npc_override_harboro1_quests_rockridge_than_what_you_need_93a1b3: "比你需要的多。"
  npc_override_harboro1_quests_rockridge_thank_you_174534: "谢谢。"
  npc_override_harboro1_quests_rockridge_thank_you_doing_me_0bc9e6: "谢谢你为我做这些。"
  npc_override_harboro1_quests_rockridge_thank_you_doing_me_findi_da76a3: "谢谢你为我做这些。还有找到了^0000CD5包饮料粉^000000。如果不是你，事情会困难得多。谢谢。"
  npc_override_harboro1_quests_rockridge_thank_you_helping_us_c148fd: "谢谢你的帮助。"
  npc_override_harboro1_quests_rockridge_thank_you_hunting_coyote_44f993: "谢谢你帮我消灭郊狼。对了，你有没有在它们附近看到一些^0000CD果汁粉包装^000000？"
  npc_override_harboro1_quests_rockridge_thank_you_please_take_s_ed329f: "谢谢。请收下这个。不多，但希望你会喜欢。"
  npc_override_harboro1_quests_rockridge_thank_you_your_help_3a7d59: "谢谢你的帮助。"
  npc_override_harboro1_quests_rockridge_thank_you_your_time_f99122: "谢谢你的时间。"
  npc_override_harboro1_quests_rockridge_thank_you_your_understan_b6942b: "谢谢你的理解。祝你今天愉快。"
  npc_override_harboro1_quests_rockridge_thanks_a8b40f: "但还是谢谢。"
  npc_override_harboro1_quests_rockridge_thanks_here_take_f63a9b: "谢谢！来，拿着这个。"
  npc_override_harboro1_quests_rockridge_thanks_them_i_ve_got_c9858c: "但多亏了他们，我有了一份 lucrative 的工作。"
  npc_override_harboro1_quests_rockridge_then_again_you_could_lyi_408a21: "但话说回来，你可能在骗我。"
  npc_override_harboro1_quests_rockridge_then_few_years_ago_7eede2: "然后几年前"
  npc_override_harboro1_quests_rockridge_then_i_ll_use_force_9a68bf: "那我就得用武力了。"
  npc_override_harboro1_quests_rockridge_then_i_m_going_hunt_fd05c8: "那我要去消灭一百——一百——一百只郊狼！"
  npc_override_harboro1_quests_rockridge_then_i_saw_you_you_f9b250: "然后我看到了你，你就像羊群中的狼一样显眼。也就是说，你通过了！恭喜！"
  npc_override_harboro1_quests_rockridge_then_let_s_go_0b4b79: "那我们走吧。"
  npc_override_harboro1_quests_rockridge_then_let_s_go_3d4232: "那我们走吧！"
  npc_override_harboro1_quests_rockridge_then_some_time_ago_monst_2dd36d: "然后一段时间前，怪物开始出现在地下室，现在我们的工人太害怕了，不敢工作。这就是我们目前的情况。"
  npc_override_harboro1_quests_rockridge_then_we_re_all_right_468a35: "那我们就没事了。我们继续走，很快就能见到奶奶了。"
  npc_override_harboro1_quests_rockridge_then_what_you_waiting_5c1699: "那你还等什么？"
  npc_override_harboro1_quests_rockridge_then_why_don_t_you_cc2751: "那你为什么不让我把它还给它的主人？卡克特伦夫人的孩子因为喝不到他最喜欢的果汁而难过。我只想让他开心。"
  npc_override_harboro1_quests_rockridge_there_81b5ac: "那里。"
  npc_override_harboro1_quests_rockridge_there_aren_t_many_people_be19ef: "这家餐厅里没有很多人。"
  npc_override_harboro1_quests_rockridge_there_lot_ores_buried_fl_cf52ad: "那层埋了很多矿石，所以我们的产量是一楼的好几倍。"
  npc_override_harboro1_quests_rockridge_there_many_things_189550: "有很多事要做。"
  npc_override_harboro1_quests_rockridge_there_only_one_floor_ins_a41092: "矿里曾经只有一层，"
  npc_override_harboro1_quests_rockridge_there_only_sand_rocks_ou_17f511: "但外面只有沙子和石头，没有能吃的东西。真不敢相信我竟然想在这种地方开厨房。"
  npc_override_harboro1_quests_rockridge_there_others_who_make_go_b1ed78: "有其他人也能织出好网，但我是给网做最后修饰的人。"
  npc_override_harboro1_quests_rockridge_there_s_7bd232: "有"
  npc_override_harboro1_quests_rockridge_there_s_broken_elevator_037d6c: "有一部坏掉的电梯。"
  npc_override_harboro1_quests_rockridge_there_s_hole_ground_a47856: "- 地上有个洞。"
  npc_override_harboro1_quests_rockridge_there_s_nice_looking_roc_43038c: "有一块好看的石头！嘿哟！"
  npc_override_harboro1_quests_rockridge_there_s_no_way_he_a87a5a: "他不可能想去那里。"
  npc_override_harboro1_quests_rockridge_there_s_nothing_we_could_a3e341: "我们无能为力。野牛匪帮偷走了我们最后一批货，而且这不会是最后一次。"
  npc_override_harboro1_quests_rockridge_there_s_something_weird_7b94b8: "- 这个沙堆有点奇怪，但我带的东西太多了，没法检查。我最好先减轻背包重量。-"
  npc_override_harboro1_quests_rockridge_there_s_time_everything_8a3b70: "万物皆有其时。"
  npc_override_harboro1_quests_rockridge_there_so_many_mouths_fee_ee9a98: "这么多张嘴要喂，而我没有肉？这是灾难！"
  npc_override_harboro1_quests_rockridge_there_so_many_problems_6a7979: "有太多问题了"
  npc_override_harboro1_quests_rockridge_there_so_many_them_would_0fd703: "但它们太多了，这连 dent 都不会留下。我想更进一步。"
  npc_override_harboro1_quests_rockridge_there_so_many_things_78f8c0: "有太多事要做"
  npc_override_harboro1_quests_rockridge_there_some_juice_mixes_s_2eb67c: "里面一定还有一些果汁粉。如果你能找到5包，我会很感激的。"
  npc_override_harboro1_quests_rockridge_there_trees_growing_sea_4af250: "海上有树在生长，而且它们看起来都一样。"
  npc_override_harboro1_quests_rockridge_there_you_meet_people_wh_9510e0: "在那里，你可以遇到提供工作和食物的人。"
  npc_override_harboro1_quests_rockridge_these_guys_could_lying_515655: "这些人可能在撒谎。"
  npc_override_harboro1_quests_rockridge_these_ores_worthless_unl_44fc60: "这些矿石除非经过加工，否则毫无价值，"
  npc_override_harboro1_quests_rockridge_these_tauruses_warlike_p_9b7930: "这些金牛座好战，掠夺是他们唯一的生存方式。"
  npc_override_harboro1_quests_rockridge_they_could_buried_ground_1e82ca: "^FF0000它们可能被埋在地下，被人捡走，或者被郊狼找到。^000000"
  npc_override_harboro1_quests_rockridge_they_d_patrol_around_ele_41b7a8: "他们会在电梯周围巡逻。"
  npc_override_harboro1_quests_rockridge_they_don_t_want_know_b309cc: "他们不想知道，也不在乎。你得处境相当糟糕才会来到这里。"
  npc_override_harboro1_quests_rockridge_they_keep_guard_over_und_e74d71: "他们在警长沃普的命令下守卫着它。"
  npc_override_harboro1_quests_rockridge_they_ll_help_create_situ_4f92b3: "他们会帮助创造警长沃普想要的情况。"
  npc_override_harboro1_quests_rockridge_they_must_lost_their_min_53ddd2: "他们一定是疯了！"
  npc_override_harboro1_quests_rockridge_they_never_they_d_rather_cd75fa: "但他们永远不会那样做。他们宁愿袭击我们的村子来救他，也不会背叛他。"
  npc_override_harboro1_quests_rockridge_they_re_as_thin_as_2cdaea: "它们细得像手指，有一次我差点把手指伸进炖菜里而不是它们。"
  npc_override_harboro1_quests_rockridge_they_re_begging_c7d192: "他们在乞求。"
  npc_override_harboro1_quests_rockridge_they_re_eager_all_right_ad3ca8: "他们很 eager，没错，但没有一个足够强壮到能派上用场。"
  npc_override_harboro1_quests_rockridge_they_re_first_floor_so_3fd143: "他们在一楼，所以我们只要封住电梯就行了。"
  npc_override_harboro1_quests_rockridge_they_re_middle_ranking_o_6ddc26: "他们是戴面具野牛的中层军官。我要你消灭10个^0000ff戴绿色面具的野牛匪帮^000000。"
  npc_override_harboro1_quests_rockridge_they_re_middle_ranking_o_f331e9: "他们是持步枪野牛的中层军官。我要你消灭10个^0000ff眼睛发蓝光的步枪野牛匪帮^000000。"
  npc_override_harboro1_quests_rockridge_they_re_middle_ranking_o_fc6081: "他们是持剑野牛的中层军官。我要你消灭10个^0000ff戴眼罩、穿淡绿色背心的野牛匪帮^000000。"
  npc_override_harboro1_quests_rockridge_they_re_purple_monsters_3eb35b: "它们是紫色的怪物，叫气态怪。它们不会主动攻击，但仍然构成威胁。"
  npc_override_harboro1_quests_rockridge_they_re_so_cheap_you_54dca0: "它们太便宜了，你几乎是免费拿到的。实际上我在亏钱卖！"
  npc_override_harboro1_quests_rockridge_they_re_under_elevator_s_cfae40: "它们在^4d4dff矿二楼的电梯下面^000000。"
  npc_override_harboro1_quests_rockridge_they_re_very_good_friend_2c74ed: "他们是我们的好朋友。"
  npc_override_harboro1_quests_rockridge_they_t_even_come_up_2fe262: "他们连自己的信号都想不出来。"
  npc_override_harboro1_quests_rockridge_they_think_they_re_smart_d23fdf: "他们以为自己很聪明，"
  npc_override_harboro1_quests_rockridge_they_ve_been_invading_vi_937c88: "而且他们每隔一段时间就会入侵这个村子，好像在测试我们能坚持多久。"
  npc_override_harboro1_quests_rockridge_they_want_bargain_over_o_6e23c6: "他们想就他们偷走的矿石讨价还价。"
  npc_override_harboro1_quests_rockridge_they_want_talk_me_wyatt_a28323: "而且他们想和我还有怀亚特谈，没有别人。"
  npc_override_harboro1_quests_rockridge_think_about_your_future_c89e88: "想想你的未来。"
  npc_override_harboro1_quests_rockridge_those_darn_buffalo_bandi_ff946c: "那些该死的野牛匪帮！"
  npc_override_harboro1_quests_rockridge_those_days_my_whole_fami_fd04f4: "在那些日子里，我们全家会聚在一起做龙舌兰果汁。我们还会用龙舌兰叶包着牛排烤，有时远方的亲戚也会来拜访我们，一起整夜演奏音乐和跳舞。"
  npc_override_harboro1_quests_rockridge_those_evil_bandits_how_c_07a6b6: "那些邪恶的匪帮，他们怎么能在小狗附近开枪？"
  npc_override_harboro1_quests_rockridge_those_goddamn_ores_reaso_dea17a: "那些该死的矿石就是我们陷入这种困境的原因。"
  npc_override_harboro1_quests_rockridge_those_jerks_rock_ridge_u_f60427: "岩脊镇的那些混蛋低估了我们。*咬牙切齿*"
  npc_override_harboro1_quests_rockridge_threaten_him_9ff582: "威胁他。"
  npc_override_harboro1_quests_rockridge_time_5e2772: "这次不行。"
  npc_override_harboro1_quests_rockridge_today_spotty_took_could_c91591: "今天点点拿走了一个{0}。你能去找找吗？它可能很容易替换，但我不能每次点点拿走东西都去重新买。"
  npc_override_harboro1_quests_rockridge_too_much_handle_i_don_e422c0: "但这太多了，我处理不了。我觉得我做不到。"
  npc_override_harboro1_quests_rockridge_tool_shop_weapon_armor_s_30d7f1: "工具店，武器/防具店"
  npc_override_harboro1_quests_rockridge_totally_like_you_99775e: "那完全像你。"
  npc_override_harboro1_quests_rockridge_train_brings_ores_mine_b_74661e: "火车从矿里运来矿石，从码头给矿工运来补给。"
  npc_override_harboro1_quests_rockridge_traitor_thought_he_d_liv_58b49d: "那个叛徒以为他会比我活得久。"
  npc_override_harboro1_quests_rockridge_try_stay_right_track_7ccd6c: "尽量走在正确的道路上。"
  npc_override_harboro1_quests_rockridge_tsk_tsk_you_re_big_f1ab40: "啧，啧。你又大又害羞。真可爱！"
  npc_override_harboro1_quests_rockridge_tumbleweed_rolling_aroun_329a29: "里面有个风滚草在滚来滚去。-"
  npc_override_harboro1_quests_rockridge_turn_into_weeping_drooli_884c81: "然后变成一个哭泣、流口水、抽泣的 mess。*颤抖*"
  npc_override_harboro1_quests_rockridge_ugh_their_staring_eyes_m_6d4f5b: "呃，他们盯着我的眼睛让我太不舒服了，吃不下饭。"
  npc_override_harboro1_quests_rockridge_uh_oh_i_d_better_17c7fd: "呃哦，我最好去处理一下那个情况。如果你改变主意了，再回来。"
  npc_override_harboro1_quests_rockridge_um_what_s_hair_your_c7a369: "嗯？你手里的毛是什么？"
  npc_override_harboro1_quests_rockridge_under_village_there_s_sh_be168c: "而且在村子下面有……*颤抖* 我们别去那里了。"
  npc_override_harboro1_quests_rockridge_unless_you_re_going_expl_5f7067: "除非你要自己解释，否则闭嘴让我来说！"
  npc_override_harboro1_quests_rockridge_unoccupied_until_you_arr_7e20ff: "在你来之前是空的吗？"
  npc_override_harboro1_quests_rockridge_unprocessed_ores_just_li_f009b8: "未加工的矿石。就像匪帮从我们这里偷走的一样。"
  npc_override_harboro1_quests_rockridge_up_we_go_db4e4e: "我们上去！"
  npc_override_harboro1_quests_rockridge_us_a830ea: "为我们。"
  npc_override_harboro1_quests_rockridge_usually_ship_fare_zeny_o_87fff6: "通常，船费是^4d4dff10,000 Zeny^000000单程，"
  npc_override_harboro1_quests_rockridge_vigilante_badge_l_a7ae60: "自卫队徽章（L）"
  npc_override_harboro1_quests_rockridge_vigilantes_sheriff_had_e_869e95: "自卫队和警长已经受够他们了，现在他们开始抢劫火车了。"
  npc_override_harboro1_quests_rockridge_village_run_out_drinking_c51d0e: "这个村子会耗尽饮用水。必须有人来做这件事。信不信由你，我做这一切完全是为了利润。"
  npc_override_harboro1_quests_rockridge_wah_geez_who_you_07790c: "哇！天哪，你是谁？"
  npc_override_harboro1_quests_rockridge_wah_my_agave_flavored_ju_aa4e09: "哇！我的龙舌兰口味果汁！哇！"
  npc_override_harboro1_quests_rockridge_wah_wah_my_agave_flavore_9c0a0f: "哇！哇！我的龙舌兰口味果汁！"
  npc_override_harboro1_quests_rockridge_wah_who_you_64cf41: "哇！你是谁？"
  npc_override_harboro1_quests_rockridge_wait_1ae604: "等等！"
  npc_override_harboro1_quests_rockridge_wait_511dcb: "……等等。"
  npc_override_harboro1_quests_rockridge_wait_did_you_just_say_cec21a: "^990000等等，你刚才说没有食材了？你用完了？^000000"
  npc_override_harboro1_quests_rockridge_wait_honey_you_should_th_d94f5c: "等等，亲爱的。你应该再想想。你和我都太害怕野牛匪帮了，不敢去荒原。"
  npc_override_harboro1_quests_rockridge_wait_then_why_you_bother_3a83fe: "等等，那你为什么来烦我？你没看到我因为缺货而心烦吗？"
  npc_override_harboro1_quests_rockridge_wait_today_s_better_s_c73931: "等等，今天更好。今天是绞死野牛的好日子！"
  npc_override_harboro1_quests_rockridge_wait_what_my_husband_fee_aea1fe: "等等，我丈夫在喂那只狗吃什么？亲爱的！那是我们的晚饭！"
  npc_override_harboro1_quests_rockridge_wait_yes_5409af: "等等。是的。"
  npc_override_harboro1_quests_rockridge_wait_you_781627: "等等！……你！"
  npc_override_harboro1_quests_rockridge_wait_you_re_stranger_f9b680: "等等，你就是那个陌生人"
  npc_override_harboro1_quests_rockridge_wasn_t_factory_made_powd_b2f365: "那不是工厂生产的粉末。真正的龙舌兰果汁需要花很多时间和精力制作，所以我们只在特殊场合才喝。"
  npc_override_harboro1_quests_rockridge_wasn_t_too_difficult_2802d7: "不算太难，对吧？"
  npc_override_harboro1_quests_rockridge_watch_your_feet_577a57: "小心脚下。"
  npc_override_harboro1_quests_rockridge_watching_him_so_happy_dr_3ccd43: "看着他喝假果汁那么开心，让我想起了我小时候喝的真龙舌兰果汁。"
  npc_override_harboro1_quests_rockridge_way_what_s_shining_thing_6d0f6b: "对了，你手里那个发光的东西是什么？"
  npc_override_harboro1_quests_rockridge_way_where_s_costello_he_d36cf6: "对了，科斯特洛在哪里？他是镇长？他不能在这么关键的时候消失！"
  npc_override_harboro1_quests_rockridge_way_you_ve_declared_war_bd2dda: "对了，你已经向阿尔伯特·福特宣战了。"
  npc_override_harboro1_quests_rockridge_way_you_ve_grown_pretty_3740ee: "对了，你变得挺强的了。"
  npc_override_harboro1_quests_rockridge_we_believe_him_aabe57: "我们相信他！"
  npc_override_harboro1_quests_rockridge_we_broke_elevator_so_we_239e29: "我们弄坏了电梯，这样我们就可以把它们藏在下面。"
  npc_override_harboro1_quests_rockridge_we_built_house_scratch_o_c8d62d: "我们从零开始建造了这栋房子，从地基石头到屋顶都是我们自己做的。"
  npc_override_harboro1_quests_rockridge_we_cacti_don_t_hunt_fb4e7f: "但我们仙人掌族不为乐趣而狩猎。在冒险者不断出现在他们周围的情况下，教孩子们这一点很有挑战性。"
  npc_override_harboro1_quests_rockridge_we_cacti_want_preserve_o_9a7b4a: "但我们仙人掌族想尽可能保留我们的传统，教给我们的孩子们。"
  npc_override_harboro1_quests_rockridge_we_call_him_quiet_joe_2755ed: "我们叫他安静乔。"
  npc_override_harboro1_quests_rockridge_we_could_always_invade_y_7e2604: "我们随时可以袭击你们的村子，把老大带回来！"
  npc_override_harboro1_quests_rockridge_we_could_become_pathfind_22e8a9: "或者我们可以成为未知世界的开拓者！"
  npc_override_harboro1_quests_rockridge_we_could_tell_him_albert_3c48b0: "我们可以告诉他阿尔伯特已经放弃了他，"
  npc_override_harboro1_quests_rockridge_we_could_use_convince_ba_0b8364: "我们可以用它来说服匪帮矿并不像他们想的那么有用。"
  npc_override_harboro1_quests_rockridge_we_couldn_t_built_rock_0b1d28: "如果没有他们，我们不可能建成岩脊镇。"
  npc_override_harboro1_quests_rockridge_we_d_better_bring_more_be1efa: "我们最好多招些冒险者，这样我们就能一次性消灭匪帮！"
  npc_override_harboro1_quests_rockridge_we_dig_mines_build_house_942fd6: "我们挖矿，建房子！没有海水或沙尘暴能阻止我们！"
  npc_override_harboro1_quests_rockridge_we_don_t_even_know_17b7ee: "但我们甚至不知道我们在哪里。"
  npc_override_harboro1_quests_rockridge_we_don_t_need_chapel_462c72: "我们不需要教堂。奥丁不来建筑物，他来我们的心里。"
  npc_override_harboro1_quests_rockridge_we_don_t_need_ores_dd48d3: "我们不需要矿石"
  npc_override_harboro1_quests_rockridge_we_don_t_pay_him_f19284: "但如果你告诉我们矿石在哪里，我们就不必付他钱了。"
  npc_override_harboro1_quests_rockridge_we_don_t_take_407ef3: "而且我们不接受"
  npc_override_harboro1_quests_rockridge_we_don_t_time_argue_2a0a49: "我们没时间争论。"
  npc_override_harboro1_quests_rockridge_we_great_pioneers_rock_r_e32f66: "我们是岩脊镇的伟大拓荒者！嘿，吼！"
  npc_override_harboro1_quests_rockridge_we_haven_t_worked_days_8eb730: "我们已经好几天没工作了。你能相信吗？"
  npc_override_harboro1_quests_rockridge_we_just_t_work_because_eddc2e: "我们只是因为 squat 在矿里的匪帮而无法工作。"
  npc_override_harboro1_quests_rockridge_we_keep_rifle_house_self_c247f4: "我们在家里放了一把步枪用于自卫，前几天我注意到点点看到它时浑身发抖像片叶子。"
  npc_override_harboro1_quests_rockridge_we_know_another_passage_593217: "我们知道另一条通往矿二楼的路。"
  npc_override_harboro1_quests_rockridge_we_lived_harmony_nature_b3d618: "我们与大自然和谐共处。"
  npc_override_harboro1_quests_rockridge_we_ll_attack_your_villag_821138: "我们会袭击你们的村子，把它夷为平地！"
  npc_override_harboro1_quests_rockridge_we_ll_careful_course_sin_af47f5: "我们当然得小心，因为匪帮还在矿里。"
  npc_override_harboro1_quests_rockridge_we_ll_counting_you_adven_0062ce: "我们就指望你了，冒险者！"
  npc_override_harboro1_quests_rockridge_we_ll_counting_you_kiddo_9e97bd: "我们就指望你了，小鬼！"
  npc_override_harboro1_quests_rockridge_we_ll_counting_you_kiddo_eaa483: "我们就指望你了，小鬼！你回来后我会慷慨地报答你。我在警长办公室的监狱里顺手牵羊拿了几样东西。好了，去吧！"
  npc_override_harboro1_quests_rockridge_we_ll_hang_you_all_dd7ff6: "我们会绞死你们？所有人！"
  npc_override_harboro1_quests_rockridge_we_ll_last_laugh_7affbb: "我们会笑到最后！"
  npc_override_harboro1_quests_rockridge_we_ll_wait_him_train_3ab570: "我们在火车旁等他。"
  npc_override_harboro1_quests_rockridge_we_made_hurry_so_s_442fa1: "我们赶工做的，所以有时有点不安全。哈哈。"
  npc_override_harboro1_quests_rockridge_we_need_lot_people_const_4cf774: "建筑工地需要很多人。下面……有点危险，但你看起来知道怎么应对危险。"
  npc_override_harboro1_quests_rockridge_we_need_ore_fool_albert_852c65: "我们需要一个矿石来骗阿尔伯特和其他匪帮。你现在想去拿吗？"
  npc_override_harboro1_quests_rockridge_we_no_one_else_turn_81f3d5: "我们没有别人可以求助了，我想不到比这更好的办法了。让我们赌一把这个冒险者。"
  npc_override_harboro1_quests_rockridge_we_no_one_else_turn_9654f2: "我们没有别人可以求助了。如果你改变主意了，请回来。"
  npc_override_harboro1_quests_rockridge_we_no_use_him_either_9a82cf: "他对我们也没有用。"
  npc_override_harboro1_quests_rockridge_we_no_use_them_you_ff522b: "我们对它们没有用处，而你就被它们困住了。"
  npc_override_harboro1_quests_rockridge_we_people_rock_ridge_her_27c2e3: "但我们岩脊镇的人不是来屈服的，我们是来征服的！"
  npc_override_harboro1_quests_rockridge_we_re_almost_done_bandit_19e241: "我们快把匪帮处理完了！"
  npc_override_harboro1_quests_rockridge_we_re_brave_we_re_a57498: "我们勇敢！我们英勇！"
  npc_override_harboro1_quests_rockridge_we_re_desert_i_t_b88311: "我们在沙漠里，我不能进建筑物，但我希望你住得愉快。"
  npc_override_harboro1_quests_rockridge_we_re_going_give_mine_0fae08: "但我们不会把矿还给你们，即使它对我们没用！"
  npc_override_harboro1_quests_rockridge_we_re_hoping_d_you_10a27e: "而我们希望那个人是你。"
  npc_override_harboro1_quests_rockridge_we_re_just_dealing_littl_0521e0: "我们只是在处理一点家庭问题。你是谁？我能看出来你不是本地人。"
  npc_override_harboro1_quests_rockridge_we_re_pioneers_rock_ridg_a5fe3a: "我们是岩脊镇的拓荒者！"
  npc_override_harboro1_quests_rockridge_we_re_sorry_75b3fb: "对不起，"
  npc_override_harboro1_quests_rockridge_we_re_sorry_we_offer_bb2404: "对不起，但我们不为个人客户提供服务。"
  npc_override_harboro1_quests_rockridge_we_reclaim_mine_too_320054: "我们也得夺回矿！"
  npc_override_harboro1_quests_rockridge_we_repay_nature_088247: "我们回报大自然"
  npc_override_harboro1_quests_rockridge_we_should_least_let_him_b30b38: "我们至少应该让他做好梦，对吧？"
  npc_override_harboro1_quests_rockridge_we_should_talk_mayor_cos_16c7c0: "我们应该先和科斯特洛镇长谈谈。"
  npc_override_harboro1_quests_rockridge_we_start_teach_our_young_3f10fe: "我们从小就开始教孩子们打猎，"
  npc_override_harboro1_quests_rockridge_we_still_pump_out_water_0685e9: "我们仍然需要每天抽水以防止洪水，但这只是小挫折？我们退了一步是为了进两步。岩脊镇会继续成长。"
  npc_override_harboro1_quests_rockridge_we_t_afford_012a53: "而且我们负担不起。"
  npc_override_harboro1_quests_rockridge_we_t_anything_until_we_9797cb: "在我们拿到补给之前，我们什么都做不了。"
  npc_override_harboro1_quests_rockridge_we_t_completely_fill_up_384ed9: "我们不能完全填埋地下室，因为那里是我们的海水淡化系统。"
  npc_override_harboro1_quests_rockridge_we_t_make_him_things_dd28ce: "我们不能不解释就让他去做事。他有权知道他要面对什么。"
  npc_override_harboro1_quests_rockridge_we_t_work_yet_we_ebcc79: "我们不能工作，却又不让我们离开。这公平吗？"
  npc_override_harboro1_quests_rockridge_we_take_care_between_us_24a9f1: "我们两个可以处理好这件事，但镇长需要知道他的村子里发生了什么。"
  npc_override_harboro1_quests_rockridge_we_taurases_take_pride_o_9533c4: "但我们金牛座以我们的身体优势为荣。我怎么能告诉其他人我因为对一些气体过敏而无法工作？"
  npc_override_harboro1_quests_rockridge_we_try_know_if_works_2fadad: "我们得试试才知道有没有用。其他的可以以后再说。而且，我们还没准备好做任何事。"
  npc_override_harboro1_quests_rockridge_we_ve_been_having_hard_141847: "我们一直在经历困难"
  npc_override_harboro1_quests_rockridge_we_ve_been_thinking_abou_2a4ad3: "我们一直在想办法救他，"
  npc_override_harboro1_quests_rockridge_we_ve_discovered_new_vei_15dd06: "我们发现了一条新矿脉。位置是秘密。"
  npc_override_harboro1_quests_rockridge_we_ve_got_enough_ores_a3db07: "我们的矿石已经足够多了，不缺你们偷走的那一点点。"
  npc_override_harboro1_quests_rockridge_we_ve_got_great_plan_8de1db: "我们有个好计划。"
  npc_override_harboro1_quests_rockridge_we_ve_got_you_now_12532c: "我们抓住你了！"
  npc_override_harboro1_quests_rockridge_we_ve_saved_lot_ores_33de5a: "我们存了很多矿石，足够不缺你们从我们这里偷走的那一小部分。"
  npc_override_harboro1_quests_rockridge_we_wake_up_morning_work_7c4ad9: "我们早上醒来，工作以回报大自然的馈赠，晚上上床睡觉。"
  npc_override_harboro1_quests_rockridge_we_want_live_them_peacef_dda4d8: "我们想和他们在基瓦瓦沙漠和平共处。"
  npc_override_harboro1_quests_rockridge_we_want_set_example_keep_374995: "我们想树立榜样，控制他们。消灭^0000ff15个持步枪的野牛匪帮^000000。"
  npc_override_harboro1_quests_rockridge_we_want_set_example_keep_5572b5: "我们想树立榜样，控制他们。消灭^0000ff15个戴眼罩的野牛匪帮^000000。"
  npc_override_harboro1_quests_rockridge_we_want_set_example_keep_be243a: "我们想树立榜样，控制他们。消灭^0000ff15个戴红色面具的野牛匪帮^000000。"
  npc_override_harboro1_quests_rockridge_welcome_724486: "欢迎。"
  npc_override_harboro1_quests_rockridge_welcome_adventurer_35361e: "欢迎，冒险者！"
  npc_override_harboro1_quests_rockridge_welcome_city_freedom_roc_8b9e3d: "欢迎来到自由之城岩脊镇。奥丁与你同在，无论你走到哪里！"
  npc_override_harboro1_quests_rockridge_welcome_e52e5e: "欢迎！"
  npc_override_harboro1_quests_rockridge_welcome_gc_bank_s_rock_4a82ee: "欢迎来到GC银行岩脊镇分行。今天有什么可以帮您的？"
  npc_override_harboro1_quests_rockridge_welcome_i_ve_been_waitin_a23e87: "欢迎！我一直在等你！"
  npc_override_harboro1_quests_rockridge_welcome_lazy_owl_s_inn_8d9ed8: "欢迎来到懒猫头鹰旅馆。"
  npc_override_harboro1_quests_rockridge_welcome_rock_ridge_adven_df7146: "欢迎来到岩脊镇，冒险者！"
  npc_override_harboro1_quests_rockridge_welcome_rock_ridge_c819b2: "欢迎来到岩脊镇！"
  npc_override_harboro1_quests_rockridge_well_i_agree_6d8d7e: "嗯，那一点我同意。"
  npc_override_harboro1_quests_rockridge_well_i_don_t_any_83af6c: "嗯，我在这里没什么事。我该走了。"
  npc_override_harboro1_quests_rockridge_well_i_ll_dipped_butterm_d0b958: "嗯，我简直不敢相信。"
  npc_override_harboro1_quests_rockridge_well_i_m_still_hq_6bc8b1: "嗯，我还是来自总部。"
  npc_override_harboro1_quests_rockridge_well_let_me_rephrase_we_448088: "嗯，让我重新说一遍？我们让他跑了。"
  npc_override_harboro1_quests_rockridge_well_then_could_you_hear_6baa0c: "……嗯，那你能听我说吗？我想请你帮个忙。"
  npc_override_harboro1_quests_rockridge_wh_wha_73f252: "什——什么……？"
  npc_override_harboro1_quests_rockridge_wh_what_hell_s_going_4e3aaa: "什——什么鬼东西？"
  npc_override_harboro1_quests_rockridge_wh_what_i_god_visits_10914e: "什——什么我能怎么办？神在梦中造访我。"
  npc_override_harboro1_quests_rockridge_what_445ccd: "那是什么？"
  npc_override_harboro1_quests_rockridge_what_89511a: "什么事？"
  npc_override_harboro1_quests_rockridge_what_about_all_these_peo_1e7dbc: "但这些 eager 工作的人怎么办？"
  npc_override_harboro1_quests_rockridge_what_about_all_these_peo_409bf7: "这些人怎么办？"
  npc_override_harboro1_quests_rockridge_what_about_boss_c2d186: "老大怎么办？"
  npc_override_harboro1_quests_rockridge_what_about_costello_b2eae6: "科斯特洛怎么办？"
  npc_override_harboro1_quests_rockridge_what_about_mine_b02430: "矿怎么办？"
  npc_override_harboro1_quests_rockridge_what_about_miners_they_c_a64377: "那矿工们呢？他们满怀希望地来到这里，现在却无家可归、无工可做、无钱可用。"
  npc_override_harboro1_quests_rockridge_what_about_their_wanting_8ac48a: "他们想讨价还价的事呢？你也是在开玩笑吗？"
  npc_override_harboro1_quests_rockridge_what_albert_moron_e300cd: "什么？阿尔伯特，那个白痴！"
  npc_override_harboro1_quests_rockridge_what_am_i_looking_ah_c09330: "我在看什么？啊，那些野牛。悬赏他们的头有一大笔钱。"
  npc_override_harboro1_quests_rockridge_what_b540a1: "什么？"
  npc_override_harboro1_quests_rockridge_what_bargain_maybe_we_co_caa051: "什么交易？也许我们可以直接从嘴里撬出矿石的位置。"
  npc_override_harboro1_quests_rockridge_what_business_e14089: "什么生意？"
  npc_override_harboro1_quests_rockridge_what_did_you_my_men_95f0a8: "你对我的手下做了什么？"
  npc_override_harboro1_quests_rockridge_what_earth_going_f33cfc: "到底发生了什么事？"
  npc_override_harboro1_quests_rockridge_what_else_could_i_bunch_2d38df: "我还能怎么办？一群看起来至少比我高一个头的可怕野牛，注意？要求我把炸弹给他们。"
  npc_override_harboro1_quests_rockridge_what_good_lying_us_we_42615b: "撒谎对我们有什么好处？我们是乞丐。告诉我们你想要什么。"
  npc_override_harboro1_quests_rockridge_what_hang_boss_1951ae: "什么？绞死老大？"
  npc_override_harboro1_quests_rockridge_what_happened_its_reside_12e0e2: "它的居民怎么了，你问？你是冒险者，你为什么在乎？"
  npc_override_harboro1_quests_rockridge_what_happened_our_negoti_242187: "我们的谈判怎么了？"
  npc_override_harboro1_quests_rockridge_what_happens_if_i_say_fddea5: "如果我拒绝会怎样？"
  npc_override_harboro1_quests_rockridge_what_haven_t_you_seen_1c6f60: "什么，你没见过野牛匪帮吗？"
  npc_override_harboro1_quests_rockridge_what_hell_you_done_us_c43100: "你到底对我们做了什么？"
  npc_override_harboro1_quests_rockridge_what_i_c53cb8: "我能做什么？"
  npc_override_harboro1_quests_rockridge_what_i_could_always_feed_d3ff3d: "什么？你说我可以一直喂它们蔬菜？当然，但它们只想要肉。"
  npc_override_harboro1_quests_rockridge_what_i_don_t_enough_f89884: "什么？我没有足够的食物给你！"
  npc_override_harboro1_quests_rockridge_what_i_haven_t_even_b74886: "什么？我还没开始？"
  npc_override_harboro1_quests_rockridge_what_i_m_miner_fighter_b060d1: "什么？我是矿工，不是战士？我不能去那里！你知道我连帽子被吹到那个方向时都没法在外面待太久找到它。"
  npc_override_harboro1_quests_rockridge_what_i_thought_you_guys_659a44: "什么？我以为你们能分辨出彼此。"
  npc_override_harboro1_quests_rockridge_what_i_you_3d61cf: "我能为你做什么？"
  npc_override_harboro1_quests_rockridge_what_i_you_ec9259: "- 我能为你做什么？"
  npc_override_harboro1_quests_rockridge_what_if_s_too_dangerous_710bd9: "如果太危险了怎么办？我说我们应该绕道去别的地方。"
  npc_override_harboro1_quests_rockridge_what_if_we_t_go_30b376: "如果我们回不了家怎么办？"
  npc_override_harboro1_quests_rockridge_what_kinds_things_1249f9: "什么东西？"
  npc_override_harboro1_quests_rockridge_what_make_sense_you_2227e1: "什么？这说得通吗？"
  npc_override_harboro1_quests_rockridge_what_missing_shipment_9a1e18: "什么缺货？"
  npc_override_harboro1_quests_rockridge_what_negotiation_905799: "什么谈判？"
  npc_override_harboro1_quests_rockridge_what_no_i_don_t_586b49: "什么？不！我不想当骗子！我们告诉家人我们会带着大把的钱回去。"
  npc_override_harboro1_quests_rockridge_what_s_taking_you_so_4e5f24: "你怎么花了这么长时间？"
  npc_override_harboro1_quests_rockridge_what_should_i_akuha_naha_40bd13: "我该怎么办？阿库哈！纳哈里！"
  npc_override_harboro1_quests_rockridge_what_should_i_i_think_9b42af: "我该怎么办？我想我爱上了这个孩子。"
  npc_override_harboro1_quests_rockridge_what_strange_look_your_f_0fbd0a: "你脸上那奇怪的表情是什么？"
  npc_override_harboro1_quests_rockridge_what_there_think_about_d03db1: "这有什么好想的？"
  npc_override_harboro1_quests_rockridge_what_time_d47e12: "这次又是什么事？"
  npc_override_harboro1_quests_rockridge_what_we_t_trust_him_ebfb19: "什么？但我们不能信任他？我们才刚认识他！"
  npc_override_harboro1_quests_rockridge_what_what_6c6f34: "什么？什么事？"
  npc_override_harboro1_quests_rockridge_what_you_brought_my_toda_a12f67: "你今天给我带了什么？"
  npc_override_harboro1_quests_rockridge_what_you_doing_here_you_9561f7: "你在这里做什么？你不够好，赚不到你的那份。出去！"
  npc_override_harboro1_quests_rockridge_what_you_doing_what_hell_e33171: "你在做什么？这到底是什么？！"
  npc_override_harboro1_quests_rockridge_what_you_looking_scram_b_239089: "你在看什么？在我往你脸上打洞之前滚开！滚！"
  npc_override_harboro1_quests_rockridge_what_you_looking_you_eav_c1e471: "你在看什么？你在偷听我说话吗？"
