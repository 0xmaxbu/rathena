  npc_override_harboro1_quests_rockridge_what_you_need_84a42d: "- 你需要什么？"
  npc_override_harboro1_quests_rockridge_what_you_say_a2c9eb: "你觉得怎么样？"
  npc_override_harboro1_quests_rockridge_what_you_say_carola_how_6101ad: "你觉得怎么样，卡罗拉？你愿意跟我一起下去吗？"
  npc_override_harboro1_quests_rockridge_what_you_talking_about_30b0c8: "你在说什么？！"
  npc_override_harboro1_quests_rockridge_what_you_talking_about_a_9b48e4: "什么？你在说阿尔伯特？"
  npc_override_harboro1_quests_rockridge_what_you_talking_about_fb4e69: "你在说什么？"
  npc_override_harboro1_quests_rockridge_what_you_think_johnny_th_a47af6: "你觉得约翰尼看到那一幕时会怎么想？"
  npc_override_harboro1_quests_rockridge_what_you_trying_time_c3aceb: "你这次又想干什么？"
  npc_override_harboro1_quests_rockridge_what_you_want_9b4b57: "你想要什么？"
  npc_override_harboro1_quests_rockridge_whatever_i_m_still_going_977187: "随便。我还是不进去！"
  npc_override_harboro1_quests_rockridge_when_1fc083: "那什么时候？"
  npc_override_harboro1_quests_rockridge_when_fact_you_wake_up_e668ed: "而事实上，你每天都比我们其他人起得晚。"
  npc_override_harboro1_quests_rockridge_when_he_got_drunk_he_708d72: "他喝醉的时候经常告诉我他会比我活得久。"
  npc_override_harboro1_quests_rockridge_when_i_get_out_here_e2b8d4: "等我出去，我会送那家伙去地狱和阿尔伯特作伴。"
  npc_override_harboro1_quests_rockridge_when_i_solve_case_i_e2cb18: "等我破了这案子，我就取代科斯特洛当镇长。"
  npc_override_harboro1_quests_rockridge_when_sun_comes_up_tomorr_f3c4c2: "明天太阳升起的时候。"
  npc_override_harboro1_quests_rockridge_when_they_found_source_n_c566f0: "当他们找到噪音的来源时？呀啊啊啊！"
  npc_override_harboro1_quests_rockridge_when_we_eating_today_wha_da5b02: "我们今天什么时候吃饭？吃什么？豆子？"
  npc_override_harboro1_quests_rockridge_when_we_first_opened_sec_fb0a2c: "我们第一次打开二楼的时候，没有电梯，"
  npc_override_harboro1_quests_rockridge_when_we_start_working_ag_94d1c9: "我们什么时候才能重新开始工作？"
  npc_override_harboro1_quests_rockridge_when_you_get_there_ask_4d52df: "你到那里后，找^4d4dff怀亚特·沃普^000000先生。"
  npc_override_harboro1_quests_rockridge_when_you_re_done_sure_6efb1c: "你完成后如果不确定接下来做什么，嗯……"
  npc_override_harboro1_quests_rockridge_where_3764ad: "哪里？"
  npc_override_harboro1_quests_rockridge_where_i_get_work_food_cbcfc5: "我在哪里能找到工作和食物？往东走到东门。你会在路上看到。"
  npc_override_harboro1_quests_rockridge_where_you_come_into_play_c6abb0: "这就是你发挥作用的地方，冒险者。"
  npc_override_harboro1_quests_rockridge_whew_thank_you_should_en_9eaca7: "呼，谢谢。今天这些应该够了。"
  npc_override_harboro1_quests_rockridge_while_exploring_land_866cb7: "在探索这片土地的时候，"
  npc_override_harboro1_quests_rockridge_while_he_made_friends_ou_ac3e4f: "而他和我们的敌人交朋友。我们不需要像他这样自私的叛徒。"
  npc_override_harboro1_quests_rockridge_while_hunting_area_58f663: "在这片区域打猎的时候。"
  npc_override_harboro1_quests_rockridge_while_you_re_maybe_you_2cb122: "顺便，也许你可以也消灭一些^0000CD郊狼^000000。帮我消灭^0000CD30^000000只。"
  npc_override_harboro1_quests_rockridge_whine_nahari_grandma_goi_774692: "*呜咽* 纳哈里，奶奶不会高兴的。"
  npc_override_harboro1_quests_rockridge_whine_we_want_hunt_coyot_361d8d: "*呜咽* 但我们想像他们一样猎杀郊狼。汪！汪，汪！嘿！"
  npc_override_harboro1_quests_rockridge_whispering_he_s_more_sim_110484: "（耳语）他比我想的简单多了。我们去向警长汇报吧。"
  npc_override_harboro1_quests_rockridge_who_cares_about_ores_23634b: "谁在乎矿石？"
  npc_override_harboro1_quests_rockridge_who_hell_you_1ddf4d: "你他妈是谁？"
  npc_override_harboro1_quests_rockridge_who_knew_they_d_hidden_b57ac6: "谁知道它们竟然藏在我们眼皮底下？"
  npc_override_harboro1_quests_rockridge_who_knows_we_could_trade_b38712: "谁知道？我们可以用约翰尼交换被偷的矿石。"
  npc_override_harboro1_quests_rockridge_who_knows_you_might_find_876366: "谁知道？你可能会找到可以用来对付野牛匪帮的东西。"
  npc_override_harboro1_quests_rockridge_who_me_884d83: "谁？我？"
  npc_override_harboro1_quests_rockridge_who_s_been_interfering_u_c53dec: "一直在妨碍我们的人！"
  npc_override_harboro1_quests_rockridge_who_s_sheriff_c267ca: "谁是警长？"
  npc_override_harboro1_quests_rockridge_who_s_there_47f7ea: "谁在那里？！"
  npc_override_harboro1_quests_rockridge_who_s_you_re_one_d2c090: "这是谁？你不是我期待的人。"
  npc_override_harboro1_quests_rockridge_who_want_eat_such_terrib_325d67: "谁会想吃这么难吃的东西？"
  npc_override_harboro1_quests_rockridge_who_we_bc7919: "我们是谁？"
  npc_override_harboro1_quests_rockridge_who_where_i_don_t_69749c: "谁？哪里？我没看到他。把他送到我这里来。"
  npc_override_harboro1_quests_rockridge_who_you_c8bfc1: "你是谁？！"
  npc_override_harboro1_quests_rockridge_who_you_think_told_me_9528b8: "你觉得是谁告诉我怎么给你发信号的？"
  npc_override_harboro1_quests_rockridge_whoa_agave_flavored_juic_a52299: "哇，龙舌兰口味果汁！谢谢你，冒险者！"
  npc_override_harboro1_quests_rockridge_whoa_so_pretty_3524e7: "哇，好漂亮！"
  npc_override_harboro1_quests_rockridge_whoa_whoa_adventurer_vio_a100d6: "哇，哇！冒险者很暴力。我不和野蛮人做生意。"
  npc_override_harboro1_quests_rockridge_whoever_spread_stupid_ru_1555be: "而且不管是谁散布了那个愚蠢的谣言，他都是为了不让别人发现宝藏。"
  npc_override_harboro1_quests_rockridge_why_am_i_hearing_you_551ae5: "而且为什么我听说你会成为下一任镇长？"
  npc_override_harboro1_quests_rockridge_why_did_you_go_jail_846ea5: "你为什么进监狱？"
  npc_override_harboro1_quests_rockridge_why_don_t_you_f57578: "你为什么不"
  npc_override_harboro1_quests_rockridge_why_don_t_you_go_775600: "你为什么不回家，明天早上再来？"
  npc_override_harboro1_quests_rockridge_why_don_t_you_procure_6a4af3: "你为什么不去外面采购一些食材？"
  npc_override_harboro1_quests_rockridge_why_haven_t_you_seen_2afa4c: "怎么，你没在这片荒原上见过仙人掌吗？我很忙。走吧。"
  npc_override_harboro1_quests_rockridge_why_he_1ad3f6: "他为什么要那样做？"
  npc_override_harboro1_quests_rockridge_why_hello_you_too_ac5186: "怎么，你好啊。"
  npc_override_harboro1_quests_rockridge_why_i_keep_forgetting_i_ef0562: "为什么我总是忘记不能对那个男人抱任何期望？"
  npc_override_harboro1_quests_rockridge_why_i_loved_story_you_f4d3c3: "为什么不呢？我喜欢那个故事。你想听，不是吗？"
  npc_override_harboro1_quests_rockridge_why_isn_t_there_any_99bafe: "为什么没有金属？火车被袭击的时候一定掉了一些。"
  npc_override_harboro1_quests_rockridge_why_s_important_right_pl_02ebe7: "这就是为什么在正确的时间出现在正确的地点很重要。"
  npc_override_harboro1_quests_rockridge_why_so_you_could_rob_dda8ee: "怎么，这样你就可以抢矿？"
  npc_override_harboro1_quests_rockridge_why_some_sort_secret_ope_afddb3: "怎么，这是什么秘密行动吗？"
  npc_override_harboro1_quests_rockridge_why_they_staring_us_c5d4d1: "他们为什么盯着我们看？"
  npc_override_harboro1_quests_rockridge_why_they_want_me_anyway_93ed7c: "他们为什么要找我？"
  npc_override_harboro1_quests_rockridge_why_things_need_named_ca_508f09: "这就是为什么给东西命名要小心。"
  npc_override_harboro1_quests_rockridge_why_what_did_he_time_36e407: "为什么？他这次又做了什么？"
  npc_override_harboro1_quests_rockridge_why_what_you_scheming_f6df17: "为什么？你在策划什么？"
  npc_override_harboro1_quests_rockridge_why_you_carrying_so_much_f7ab8d: "你为什么带这么多东西？"
  npc_override_harboro1_quests_rockridge_why_you_doing_me_4938ec: "你为什么这样对我？"
  npc_override_harboro1_quests_rockridge_why_you_keep_poking_me_f35ee1: "你为什么一直戳我？"
  npc_override_harboro1_quests_rockridge_why_you_looking_adventur_5e0b42: "你为什么在找冒险者？"
  npc_override_harboro1_quests_rockridge_why_you_looking_me_like_47cd0d: "你为什么那样看着我？"
  npc_override_harboro1_quests_rockridge_why_you_playing_fire_mid_e32650: "你为什么在荒郊野外玩火？你很可疑。"
  npc_override_harboro1_quests_rockridge_why_you_so_paranoid_s_020b8a: "你为什么这么 paranoid？没关系，小鬼。走吧。但如果你改变主意了，再回来！"
  npc_override_harboro1_quests_rockridge_why_you_telling_me_016df0: "你为什么告诉我这个？"
  npc_override_harboro1_quests_rockridge_why_you_think_6470d5: "你为什么这么想？"
  npc_override_harboro1_quests_rockridge_why_you_too_busy_today_cc0bc1: "为什么不呢？你今天太忙了吗？"
  npc_override_harboro1_quests_rockridge_without_job_they_t_make_c8f647: "没有工作，他们就不能赚钱；没有钱，他们就不能养活自己。这太可怕了。"
  npc_override_harboro1_quests_rockridge_woof_woof_woof_woof_8f88dd: "汪，汪！汪，汪！"
  npc_override_harboro1_quests_rockridge_word_some_worker_couldn_7e3c06: "有传言说一些工人在地下室被填埋之前没能逃出来。"
  npc_override_harboro1_quests_rockridge_work_itself_isn_t_compli_2fb3b0: "工作本身并不复杂。"
  npc_override_harboro1_quests_rockridge_worked_72cfa1: "成功了！"
  npc_override_harboro1_quests_rockridge_workers_who_sent_down_ba_b2ded0: "被派去村子地下室的工人一个接一个地失踪了，所以我们调查了一下。我们相信他们是被怪物杀死的。"
  npc_override_harboro1_quests_rockridge_working_order_f90c4c: "运转正常"
  npc_override_harboro1_quests_rockridge_works_both_us_don_t_f25f06: "这对我们双方都有利，你不觉得吗？"
  npc_override_harboro1_quests_rockridge_worries_me_our_children_513d70: "我担心我们的孩子认为打猎只是为了好玩。"
  npc_override_harboro1_quests_rockridge_worst_over_i_ll_need_836ecc: "最糟糕的时候已经过去了。我还需要你的帮助。在那之前保存体力，好吗？"
  npc_override_harboro1_quests_rockridge_wow_thank_you_bfdd27: "哇，谢谢！"
  npc_override_harboro1_quests_rockridge_wow_you_really_like_me_fec5e0: "……哇。你真的挺喜欢我的，不是吗？"
  npc_override_harboro1_quests_rockridge_yay_i_m_going_go_a19576: "耶！我要去告诉我的朋友们！"
  npc_override_harboro1_quests_rockridge_yay_mom_s_home_mom_414bac: "耶，妈妈回来了！妈妈，你买果汁了吗？我的龙舌兰口味果汁！"
  npc_override_harboro1_quests_rockridge_yeah_right_9e065b: "是啊，当然。"
  npc_override_harboro1_quests_rockridge_yeah_yeah_i_love_you_56f53f: "是啊，是啊。我也爱你。"
  npc_override_harboro1_quests_rockridge_yes_c53c56: "是的。"
  npc_override_harboro1_quests_rockridge_yes_his_name_fb1864: "是的，那是他的名字。"
  npc_override_harboro1_quests_rockridge_yes_i_did_2856c4: "- 是的，我做了。"
  npc_override_harboro1_quests_rockridge_yes_i_ll_teach_you_cf0541: "是的，我会教你织网。现在，让我先教你如何用草叶打漂亮的结。"
  npc_override_harboro1_quests_rockridge_yes_i_love_lot_heh_4e58ed: "是的，我很喜欢！非常喜欢！嘿嘿！谢谢！"
  npc_override_harboro1_quests_rockridge_yes_i_m_home_mm_528425: "是的，我回来了。嗯，莱克特，我有话要告诉你。"
  npc_override_harboro1_quests_rockridge_yes_leaf_good_cactus_he_beeaa7: "是的。小叶子是个好仙人掌，他很爱他的爷爷。"
  npc_override_harboro1_quests_rockridge_yes_sheriff_s_looking_fo_cf7318: "是的。警长期待着绞死他的那一天。哈哈哈！"
  npc_override_harboro1_quests_rockridge_yes_some_guys_i_sent_9be2bc: "是的。我派去巡逻的一些人没回来，还有一些我们的矿石……？"
  npc_override_harboro1_quests_rockridge_yes_thank_you_d241e0: "是的。谢谢。"
  npc_override_harboro1_quests_rockridge_yes_those_clumps_gas_the_5111d7: "是的，那些气团。它们让我打喷嚏打得厉害，"
  npc_override_harboro1_quests_rockridge_yes_usually_s_closed_onl_12be30: "是的。通常它是关着的，只有有事要去地下室的人才能用，"
  npc_override_harboro1_quests_rockridge_yes_we_people_supposed_t_9290ef: "是的，我们可以。人们应该互相信任。你不知道吗？既然他来了，他就是我们中的一员了。而且我说过，每个人生来都是善良的。"
  npc_override_harboro1_quests_rockridge_yes_we_re_done_talking_51db77: "是的，我们谈完了。"
  npc_override_harboro1_quests_rockridge_yes_we_use_him_our_5f06e2: "是的，而且我们可以利用他来为我们谋利。"
  npc_override_harboro1_quests_rockridge_yes_we_ve_known_about_70147a: "是的，我们知道那个间谍。"
  npc_override_harboro1_quests_rockridge_yes_why_did_you_save_979e2c: "是的。或者你为什么在我来矿里找野牛算账的时候救了我？他们因为我把你赶出去了。"
  npc_override_harboro1_quests_rockridge_yes_you_brought_correct_99ba44: "是的，你带来了正确的箱子。"
  npc_override_harboro1_quests_rockridge_yes_you_ll_talk_him_3b9380: "是的。你得和他谈，不是科斯特洛。"
  npc_override_harboro1_quests_rockridge_yip_8d0af3: "汪！"
  npc_override_harboro1_quests_rockridge_yo_tell_him_3e5df9: "你去告诉他。"
  npc_override_harboro1_quests_rockridge_you_1e9a84: "你去做吧。"
  npc_override_harboro1_quests_rockridge_you_2eb5d5: "和你一起。"
  npc_override_harboro1_quests_rockridge_you_805a59: "你。"
  npc_override_harboro1_quests_rockridge_you_anguished_sad_let_me_81a9fd: "你痛苦还是难过？让我帮你。"
  npc_override_harboro1_quests_rockridge_you_bdb6ef: "但你知道。"
  npc_override_harboro1_quests_rockridge_you_being_stranger_distr_fb1a51: "你是个陌生人这件事比我们想的更有效地分散了他们的注意力。"
  npc_override_harboro1_quests_rockridge_you_believe_some_people_82cdd4: "你能相信有人真的住在这里吗？地面上的人不关心他们。 officially，这个地方是空的，尽管它不是。"
  npc_override_harboro1_quests_rockridge_you_call_me_shawn_8e989c: "你可以叫我肖恩。"
  npc_override_harboro1_quests_rockridge_you_calm_down_we_re_84adfb: "你冷静点。我们每坐在这里一小时都在亏钱。"
  npc_override_harboro1_quests_rockridge_you_came_all_way_here_a57382: "你大老远来这里就为了告诉我这个。为什么？"
  npc_override_harboro1_quests_rockridge_you_came_back_hunting_i_8a5674: "你打猎回来了。我没给你添负担吧？"
  npc_override_harboro1_quests_rockridge_you_came_back_quickly_ah_1dfc2e: "你回来得很快。啊，我怀念年轻的日子。"
  npc_override_harboro1_quests_rockridge_you_came_far_land_e280a7: "你来自远方。"
  npc_override_harboro1_quests_rockridge_you_came_hunt_coyotes_me_1f7d0c: "你是来帮我消灭郊狼的，对吧？"
  npc_override_harboro1_quests_rockridge_you_carrying_too_many_it_743bf2: "- 你携带的物品太多，无法继续这个任务。-"
  npc_override_harboro1_quests_rockridge_you_certain_you_want_690cab: "你确定想要这个吗？"
  npc_override_harboro1_quests_rockridge_you_come_back_when_you_505e6f: "你不忙的时候可以再回来。"
  npc_override_harboro1_quests_rockridge_you_could_also_ask_guide_3f30f4: "你也可以问我前面的向导指路。"
  npc_override_harboro1_quests_rockridge_you_could_always_go_back_c9aeac: "你随时可以回去，你知道的。"
  npc_override_harboro1_quests_rockridge_you_could_dead_pit_all_4585a5: "这个死坑你可以随便拿走，我们不在乎。"
  npc_override_harboro1_quests_rockridge_you_could_give_up_johnny_4819ad: "你可以放弃约翰尼，自己领导你的帮派。"
  npc_override_harboro1_quests_rockridge_you_could_just_tell_him_b15a6a: "你可以直接告诉他总部正在考虑关闭它。"
  npc_override_harboro1_quests_rockridge_you_could_listen_what_th_c4382a: "你可以听听他们要说什么，"
  npc_override_harboro1_quests_rockridge_you_could_pick_up_few_dfa899: "你可以在去会面的路上捡几块矿石给他看。"
  npc_override_harboro1_quests_rockridge_you_could_ve_stood_deec7c: "你本可以坚守阵地的？"
  npc_override_harboro1_quests_rockridge_you_d_better_anything_st_74469a: "你最好别做傻事。"
  npc_override_harboro1_quests_rockridge_you_d_better_get_out_792b50: "你最好离开那里"
  npc_override_harboro1_quests_rockridge_you_d_better_nicer_than_4bd763: "你最好态度好点。我是个敏感的人。"
  npc_override_harboro1_quests_rockridge_you_d_better_tell_anyone_987eae: "但你最好别告诉任何人这件事。明白了吗？"
  npc_override_harboro1_quests_rockridge_you_decided_use_menu_a9a02b: "你决定不使用菜单。"
  npc_override_harboro1_quests_rockridge_you_decided_use_undergro_4d061a: "你决定不使用地下通道。"
