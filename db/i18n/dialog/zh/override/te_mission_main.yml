  npc_override_te_mission_main_te_mission_main_could_you_check_again_0397b6: "Could you check again?"
  npc_override_te_mission_main_te_mission_main_destroying_emperiums_rep_4ae51b: "Destroying Emperiums repeatedly staggers commercial development level."
