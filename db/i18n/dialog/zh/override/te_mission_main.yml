  npc_override_te_mission_main_te_mission_main_moreover_you_keep_mind_y_096a50: "Moreover, you have to keep in mind that you can't accept both high-level and low-level missions simultaneously if they are of the same content."
  npc_override_te_mission_main_te_mission_main_msg_61ce5a: "[{0}]"
