  npc_override_com_d02_i_quests_illusion_dungeons_muscle_spasm_b94cb3: "Muscle spasm?"
  npc_override_com_d02_i_quests_illusion_dungeons_mushrooms_zombies_same_d_718e78: "Mushrooms and zombies. Same difference to me."
  npc_override_com_d02_i_quests_illusion_dungeons_muyeon_if_you_t_no_d9b3fd: "Muyeon... If you can't do it, no one else can!"
  npc_override_com_d02_i_quests_illusion_dungeons_muyeon_really_upset_we_s_2e6025: "Muyeon is really upset. We should ask her what happened."
  npc_override_com_d02_i_quests_illusion_dungeons_my_baby_baby_i_lost_465e35: "My baby? Baby? I lost, lost, my daughter... baby. Where... where?"
  npc_override_com_d02_i_quests_illusion_dungeons_my_baby_gone_my_baby_f4353e: "My baby is gone... My baby. My lovely baby."
  npc_override_com_d02_i_quests_illusion_dungeons_my_baby_i_lost_her_bc46e5: "My baby, I lost her. I lost my baby. Where are you?"
  npc_override_com_d02_i_quests_illusion_dungeons_my_brothers_abandoned_vi_03e340: "My brothers were abandoned in the village as babies. The villagers picked them up and raised them."
  npc_override_com_d02_i_quests_illusion_dungeons_my_fear_death_what_keeps_8b4944: "My fear of death is what keeps me going. It's made me who I am."
  npc_override_com_d02_i_quests_illusion_dungeons_my_treasure_8d83f3: "My treasure..."
  npc_override_com_d02_i_quests_illusion_dungeons_my_treasure_if_gone_all_51469f: "My treasure, if the {0} was gone... All, Munch... Muunch...."
  npc_override_com_d02_i_quests_illusion_dungeons_my_treasure_munch_t_forg_eac61e: "My, treasure... Munch, can't forgive..."
  npc_override_com_d02_i_quests_illusion_dungeons_nice_if_just_dream_149ef1: "It would be nice if it was just a dream..."
  npc_override_com_d02_i_quests_illusion_dungeons_nightmares_about_about_f_586e73: "Nightmares about about the foxes? Nine tails and Moonlight flowers?"
  npc_override_com_d02_i_quests_illusion_dungeons_no_1d59ae: "No!"
  npc_override_com_d02_i_quests_illusion_dungeons_no_9a4c18: "...No."
  npc_override_com_d02_i_quests_illusion_dungeons_no_b8b9f1: "No."
  npc_override_com_d02_i_quests_illusion_dungeons_no_i_d_rather_wait_da62db: "No. I'd rather wait until they return."
  npc_override_com_d02_i_quests_illusion_dungeons_no_i_m_going_i_83c9dd: "No, I'm not going to do that. I never forget favors. You've saved me. I promise I won't hurt you. Please believe me."
  npc_override_com_d02_i_quests_illusion_dungeons_no_my_baby_a4d5aa: "No, my baby..."
  npc_override_com_d02_i_quests_illusion_dungeons_no_no_s_true_2e281b: "No, no, that's not true."
  npc_override_com_d02_i_quests_illusion_dungeons_no_one_hurts_anyone_fron_5f420e: "No one hurts anyone in front of me."
  npc_override_com_d02_i_quests_illusion_dungeons_no_priests_try_get_rid_b63e63: "No. Priests will try to get rid of these. Just focus on recording this process."
  npc_override_com_d02_i_quests_illusion_dungeons_no_s_clear_their_souls_99c081: "No. It's clear their souls have returned to their dead bodies. If we can attach and detach our souls freely from our bodies, we can forever escape from physical pain!"
  npc_override_com_d02_i_quests_illusion_dungeons_no_they_re_going_put_c99306: "No! They're going to put us in danger!"
  npc_override_com_d02_i_quests_illusion_dungeons_nothing_happened_i_ll_in_1701e1: "Nothing happened. I'll increase the amount of holy water for the forty-ninth attempt."
  npc_override_com_d02_i_quests_illusion_dungeons_now_s_enough_4ab955: "Now, that's enough."
  npc_override_com_d02_i_quests_illusion_dungeons_now_s_hypothetical_now_b_06bebb: "{0}, now that's hypothetical, but now Briashen is really dangerous!"
  npc_override_com_d02_i_quests_illusion_dungeons_now_what_i_look_like_246286: "Now, what do I look like?"
  npc_override_com_d02_i_quests_illusion_dungeons_obtained_all_deep_sea_cr_4e3925: "^4d4dff{0}^000000 can be obtained from all the deep sea creatures here."
  npc_override_com_d02_i_quests_illusion_dungeons_oh_don_t_remind_me_696ebf: "Oh, don't remind me!"
  npc_override_com_d02_i_quests_illusion_dungeons_oh_geez_here_goes_again_93fdb2: "Oh geez, here it goes again."
  npc_override_com_d02_i_quests_illusion_dungeons_oh_no_i_feel_toxins_cda39c: "Oh, no...\tI can feel the toxins spreading through my body...!"
  npc_override_com_d02_i_quests_illusion_dungeons_oh_no_s_cba358: "Oh, no. That's?"
  npc_override_com_d02_i_quests_illusion_dungeons_oh_why_am_i_so_6bdb8b: "Oh, why am I so weak? Unlike my older brothers, my abilities are not particularly useful in battle."
  npc_override_com_d02_i_quests_illusion_dungeons_oh_you_don_t_even_95fac9: "Oh, you don't even bother calling me by name anymore."
  npc_override_com_d02_i_quests_illusion_dungeons_oh_you_ok_i_am_e89185: "{0}! Oh, you are ok! I am... worried. After Leiphen, {1}, you also disappeared, I was really concerned."
  npc_override_com_d02_i_quests_illusion_dungeons_oh_you_re_right_219768: "...Oh, you're right."
  npc_override_com_d02_i_quests_illusion_dungeons_okay_4371ac: "Okay."
