Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_com_d02_i_quests_illusion_dungeons_aagh_s_attack_monsters_c_2a1d11: "啊！！遭到攻击了。怪物从四面八方涌来。"
  npc_override_com_d02_i_quests_illusion_dungeons_above_all_i_ll_giving_9f0265: "最重要的是，我不能放弃自己，我做不到。"
  npc_override_com_d02_i_quests_illusion_dungeons_adventurer_2439c4: "冒险者？"
  npc_override_com_d02_i_quests_illusion_dungeons_adventurer_i_m_just_part_bc1c02: "冒险者。我只是布赖申进来时内置的感知错误的一部分。"
  npc_override_com_d02_i_quests_illusion_dungeons_after_they_go_away_they_755946: "等它们离开后。我们现在一动就会被杀掉。"
  npc_override_com_d02_i_quests_illusion_dungeons_ah_adventurer_wait_d60a79: "啊，冒险者！等等！"
  npc_override_com_d02_i_quests_illusion_dungeons_ah_ah_aaahhh_276087: "啊……啊……啊啊啊……"
  npc_override_com_d02_i_quests_illusion_dungeons_ah_died_fd0023: "啊，它死了！"
  npc_override_com_d02_i_quests_illusion_dungeons_ah_ha_i_found_46c089: "啊哈，找到了。"
  npc_override_com_d02_i_quests_illusion_dungeons_ah_i_m_sorry_aww_050fcc: "啊，抱歉！哎，这太可怕了。干脆杀了我吧。我再也受不了你展示给我的那些梦境了。"
  npc_override_com_d02_i_quests_illusion_dungeons_ah_karu_my_husband_sa_8ab9d1: "啊……卡鲁……我的丈夫……萨……"
  npc_override_com_d02_i_quests_illusion_dungeons_ah_what_we_they_re_ba397d: "啊，我们该怎么办？它们比我想象的要强。"
  npc_override_com_d02_i_quests_illusion_dungeons_ah_you_stranger_i_saw_9617d5: "啊！是你？上次见到的那个陌生人！！你还在这里？我肯定会……"
  npc_override_com_d02_i_quests_illusion_dungeons_ahahahahahahahahahahahah_233524: "啊哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈"
  npc_override_com_d02_i_quests_illusion_dungeons_ahh_asudem_why_why_my_4a02aa: "啊！阿苏德姆，为什么？为什么？我的……我是怎么找到你的……"
  npc_override_com_d02_i_quests_illusion_dungeons_ahha_ahahaha_haha_cc58a7: "啊哈，啊哈哈哈，哈哈……"
  npc_override_com_d02_i_quests_illusion_dungeons_ahha_ha_boohoo_4c8425: "啊哈……哈……呜呜……"
  npc_override_com_d02_i_quests_illusion_dungeons_ahhh_ahhhhh_cf3a81: "啊啊……啊啊啊！！"
  npc_override_com_d02_i_quests_illusion_dungeons_all_17653d: "^0000CD{0}、{1}、{2}、{3}、^000000全部？"
  npc_override_com_d02_i_quests_illusion_dungeons_all_energy_sealed_inside_9b610d: "封印在洞穴内的所有能量已经释放，唤醒了克鲁拉努克斯。"
  npc_override_com_d02_i_quests_illusion_dungeons_all_here_dead_006d6f: "这里所有人都死了。"
  npc_override_com_d02_i_quests_illusion_dungeons_all_us_made_same_d4f15b: "并非所有人都一样。"
  npc_override_com_d02_i_quests_illusion_dungeons_all_you_no_longer_1df83d: "全部……你不再……"
  npc_override_com_d02_i_quests_illusion_dungeons_am_i_bat_3d60ef: "我是蝙蝠吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_and_2f99a0: "^4d4dff{0}^000000、^4d4dff{1}^000000和^4d4dff{2}^000000。"
  npc_override_com_d02_i_quests_illusion_dungeons_and_7bf7b1: "然后呢？"
  npc_override_com_d02_i_quests_illusion_dungeons_anyone_here_anyone_941d53: "有人吗？有人……？"
  npc_override_com_d02_i_quests_illusion_dungeons_apparently_trying_your_b_69a44e: "显然，在这种情况下你已经尽力了，但还不够。"
  npc_override_com_d02_i_quests_illusion_dungeons_argh_come_f060cb: "啊，拜托！"
  npc_override_com_d02_i_quests_illusion_dungeons_argh_why_you_being_so_2ceb79: "啊！你为什么这么固执？我不该受这种待遇！"
  npc_override_com_d02_i_quests_illusion_dungeons_arghhhhh_cef378: "啊——！"
  npc_override_com_d02_i_quests_illusion_dungeons_arrgghh_cf286c: "呃——！"
  npc_override_com_d02_i_quests_illusion_dungeons_as_always_5da9af: "一如既往。"
  npc_override_com_d02_i_quests_illusion_dungeons_asudem_2dfc3f: "阿苏德姆！！！！！！！！！"
  npc_override_com_d02_i_quests_illusion_dungeons_bad_really_bad_e70697: "糟了，真的糟了！"
  npc_override_com_d02_i_quests_illusion_dungeons_bah_75b92a: "呸！"
  npc_override_com_d02_i_quests_illusion_dungeons_bomi_falling_into_long_d_f92034: "波米正在陷入长久的深睡之中。"
  npc_override_com_d02_i_quests_illusion_dungeons_bomi_stirring_her_long_d_346dca: "波米正在从长久的深睡中苏醒。"
  npc_override_com_d02_i_quests_illusion_dungeons_boohoo_oh_god_i_m_5f5484: "呜呜！天哪！我受到了如此不公平的对待！"
  npc_override_com_d02_i_quests_illusion_dungeons_breathing_edde15: "呼吸！"
  npc_override_com_d02_i_quests_illusion_dungeons_briashen_i_m_sorry_i_9d8111: "布赖申。对不起。我想我们再也不能一起去冒险了。"
  npc_override_com_d02_i_quests_illusion_dungeons_brother_i_don_t_think_23b6ae: "哥哥，我不觉得你有危险。现在不是时候。哥哥，我们先走吧。"
  npc_override_com_d02_i_quests_illusion_dungeons_brother_i_m_all_same_176a7f: "哥哥……我还是一样的……"
  npc_override_com_d02_i_quests_illusion_dungeons_brother_s_big_deal_ma_873de3: "哥哥！出大事了。妈……村子里传来血腥味。"
  npc_override_com_d02_i_quests_illusion_dungeons_brother_you_all_right_fd1a4a: "哥哥，你没事吧？"
  npc_override_com_d02_i_quests_illusion_dungeons_brother_you_ready_you_le_658f21: "哥哥？你准备好了吗？你马上要走了吗？时间不多了。"
  npc_override_com_d02_i_quests_illusion_dungeons_brothers_looks_like_hunt_370fe7: "兄弟们，看来这次狩猎很顺利。"
  npc_override_com_d02_i_quests_illusion_dungeons_brothers_there_s_someone_cfd74c: "兄弟们，那边有人。是个陌生人？"
  npc_override_com_d02_i_quests_illusion_dungeons_bye_749de5: "再见！"
  npc_override_com_d02_i_quests_illusion_dungeons_careless_klutz_48d9df: "那个粗心的笨蛋！"
  npc_override_com_d02_i_quests_illusion_dungeons_catch_1af789: "接住！"
  npc_override_com_d02_i_quests_illusion_dungeons_cheap_where_twins_they_s_35e956: "便宜货……那对双胞胎去哪了？她们应该在那里的……"
  npc_override_com_d02_i_quests_illusion_dungeons_chief_what_about_village_7e5859: "首领，那些被怪物抓走的村民怎么办？他们已经……"
  npc_override_com_d02_i_quests_illusion_dungeons_chunghae_29df75: "忠海！"
  npc_override_com_d02_i_quests_illusion_dungeons_come_what_3ebf9c: "拜托，什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_d_don_t_touch_anything_89fe4b: "别……别碰任何东西！"
  npc_override_com_d02_i_quests_illusion_dungeons_did_she_tell_you_anythin_39470a: "她有没有跟你提起过……我？"
  npc_override_com_d02_i_quests_illusion_dungeons_did_twins_find_out_leave_5648b6: "双胞胎发现了吗然后离开了？耐心点……她们很快就会回来的……"
  npc_override_com_d02_i_quests_illusion_dungeons_did_vampire_call_help_5b0fb9: "吸血鬼呼救了吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_did_we_fail_again_67cb5e: "我们又失败了吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_did_you_just_compare_me_fc26c3: "你刚才是拿我跟僵尸比较吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_did_you_wait_did_you_7f1f48: "你等了吗？你等我了吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_die_4c1646: "去死！"
  npc_override_com_d02_i_quests_illusion_dungeons_die_511d96: "去死！！！"
  npc_override_com_d02_i_quests_illusion_dungeons_dieee_1b40f5: "去死吧！"
  npc_override_com_d02_i_quests_illusion_dungeons_different_other_two_time_195362: "和我之前进行的那两次仪式不同。"
  npc_override_com_d02_i_quests_illusion_dungeons_disappeared_b5f2c4: "消失了！"
  npc_override_com_d02_i_quests_illusion_dungeons_doesn_t_work_703808: "没用。"
  npc_override_com_d02_i_quests_illusion_dungeons_don_t_look_them_they_036130: "别。看它们。它们不正常。Happy很可能会把你当嚼骨来啃。"
  npc_override_com_d02_i_quests_illusion_dungeons_don_t_talk_negatively_ev_40c114: "别说丧气话。大家都还活着。Cancer不算活着……"
  npc_override_com_d02_i_quests_illusion_dungeons_don_t_you_feel_energy_568e7d: "你没感觉到空气中的能量吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_dracula_how_you_feeling_6f8fe7: "德古拉，你感觉怎么样？"
  npc_override_com_d02_i_quests_illusion_dungeons_elder_jaegyom_nightmares_35f074: "在谦长老，这次不只是噩梦困扰着我。"
  npc_override_com_d02_i_quests_illusion_dungeons_enough_lecturing_get_poi_4998ac: "说教够了。快说重点。"
  npc_override_com_d02_i_quests_illusion_dungeons_even_if_you_i_won_2e7121: "就算你说，我也不会听的。"
  npc_override_com_d02_i_quests_illusion_dungeons_even_if_you_re_turned_b63d53: "即使你被转化了，你仍然是你。"
  npc_override_com_d02_i_quests_illusion_dungeons_everyone_gave_up_after_f_046dc0: "所有人都在第一次尝试后放弃了。而你做了三次。"
  npc_override_com_d02_i_quests_illusion_dungeons_everything_cause_effect_45efdf: "凡事皆有因果。不了解原因，怎么能期望冒险者明白这是怎么回事呢？"
  npc_override_com_d02_i_quests_illusion_dungeons_farther_east_we_re_almos_6f8b9b: "再往东！我们快到了！"
  npc_override_com_d02_i_quests_illusion_dungeons_father_grimm_could_you_s_856286: "格林神父，你能不能别插嘴？"
  npc_override_com_d02_i_quests_illusion_dungeons_felt_as_if_nightmares_ha_80a16a: "感觉噩梦仿佛在现实中发生了一样。"
  npc_override_com_d02_i_quests_illusion_dungeons_first_let_s_what_i_408bcc: "首先，让我做我能做的事。嗯？你？"
  npc_override_com_d02_i_quests_illusion_dungeons_fly_other_side_river_22fb5f: "飞到河的另一边。"
  npc_override_com_d02_i_quests_illusion_dungeons_forty_eighth_attempt_now_56ffd2: "这是第四十八次尝试。现在，让我洒上圣水。"
  npc_override_com_d02_i_quests_illusion_dungeons_found_alive_c7ed56: "发现幸存者。"
  npc_override_com_d02_i_quests_illusion_dungeons_gasp_what_hell_you_0034cc: "*倒吸一口气*你到底是什么东西？！"
  npc_override_com_d02_i_quests_illusion_dungeons_get_down_6582f4: "趴下！"
  npc_override_com_d02_i_quests_illusion_dungeons_giving_up_my_humanity_et_160a17: "为了永生而放弃人性违背了我的信仰、我至今为止的所有努力，以及我拼命保护的一切。"
  npc_override_com_d02_i_quests_illusion_dungeons_glances_mojo_f12353: "*瞥了 mojo 一眼*"
  npc_override_com_d02_i_quests_illusion_dungeons_go_ahead_b1f554: "请便。"
  npc_override_com_d02_i_quests_illusion_dungeons_gone_completely_gone_a1edcf: "消失了。彻底消失了！"
  npc_override_com_d02_i_quests_illusion_dungeons_gone_living_people_17244a: "消失了。活着的人。"
  npc_override_com_d02_i_quests_illusion_dungeons_good_because_you_don_t_e900e7: "很好，因为你不会想惹我生气的。"
  npc_override_com_d02_i_quests_illusion_dungeons_grr_f79692: "咕噜……"
  npc_override_com_d02_i_quests_illusion_dungeons_grrgghh_7b3cf4: "咕噜噜……"
  npc_override_com_d02_i_quests_illusion_dungeons_grrrr_40cb14: "吼！！！"
  npc_override_com_d02_i_quests_illusion_dungeons_guillotine_fist_283a29: "断头台之拳！"
  npc_override_com_d02_i_quests_illusion_dungeons_h_help_i_don_t_acf5ef: "救……救命！！我不想死！"
  npc_override_com_d02_i_quests_illusion_dungeons_ha_ah_ah_too_cold_6ec8ea: "哈……啊，太冷了……我想回去……"
  npc_override_com_d02_i_quests_illusion_dungeons_ha_chief_e24b8b: "哈……但是首领……"
  npc_override_com_d02_i_quests_illusion_dungeons_hahaha_asudem_no_honey_d_8ea74a: "哈哈哈阿苏德姆……不，亲爱的。你不相信我的技术吗？这次我也像往常一样抓了很多。"
  npc_override_com_d02_i_quests_illusion_dungeons_hahaha_nice_meet_you_i_d70c50: "哈哈哈很高兴见到你。不知道你注意到没有，我的兄弟姐妹是三胞胎。"
  npc_override_com_d02_i_quests_illusion_dungeons_hahaha_s_only_one_day_9e65ff: "哈哈哈，才一天而已。有什么大不了的？嗯？！"
  npc_override_com_d02_i_quests_illusion_dungeons_he_really_worried_about_fa5d64: "他真的很担心你。"
  npc_override_com_d02_i_quests_illusion_dungeons_he_s_human_humans_move_45abeb: "他是人类，人类是群居动物。他会带朋友来攻击我们的。你忘了吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_he_s_still_whispering_me_a36ae0: "他还在对我低语那句话。"
  npc_override_com_d02_i_quests_illusion_dungeons_he_s_such_hypocrite_i_25b3fd: "他真是个伪君子。我再也不会相信牧师了，都是他的错。"
  npc_override_com_d02_i_quests_illusion_dungeons_hehehe_other_times_i_d_d7d53f: "嘿嘿嘿平时我会说这很疯狂，但如果我们追随一个强大的领袖……"
  npc_override_com_d02_i_quests_illusion_dungeons_hehehehe_i_hope_day_come_a3d0fc: "嘿嘿嘿嘿我希望那一天快点到来……"
  npc_override_com_d02_i_quests_illusion_dungeons_hello_you_adventurer_how_77ece1: "你好。你是冒险者吗？你多大了？这是你第一次来这个地方吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_hey_adventurer_then_acce_40f080: "嘿，冒险者！那就接受请求吧！好吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_hey_hey_hey_asudem_honey_ff65da: "嘿，嘿，嘿，阿苏德姆……亲爱的……"
  npc_override_com_d02_i_quests_illusion_dungeons_hey_stranger_look_me_sec_9b27c2: "嘿陌生人，看我一眼。"
  npc_override_com_d02_i_quests_illusion_dungeons_hey_there_too_many_them_6af3a7: "嘿，太多了！我说只引一个，不是这么多！"
  npc_override_com_d02_i_quests_illusion_dungeons_hey_you_bat_one_over_152f17: "嘿，你这只蝙蝠，那边那个！你也是吸血鬼吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_hmpf_you_should_worry_ab_815728: "哼，你该担心自己才对，你快死了！"
  npc_override_com_d02_i_quests_illusion_dungeons_honey_let_s_go_i_61103d: "亲爱的，我们走吧，我觉得今天的约会到此为止了。嘿，我们去办点事吧~我们会离开这里的……"
  npc_override_com_d02_i_quests_illusion_dungeons_honey_who_s_there_f1cd3f: "亲爱的？谁在那里？"
  npc_override_com_d02_i_quests_illusion_dungeons_how_about_i_give_you_b80810: "我给你一份回礼怎么样？我知道你想要强壮的身体和长寿。"
  npc_override_com_d02_i_quests_illusion_dungeons_how_could_23d707: "怎么会？"
  npc_override_com_d02_i_quests_illusion_dungeons_how_could_you_me_eae003: "你怎么能这样对我？！"
  npc_override_com_d02_i_quests_illusion_dungeons_how_different_64fa94: "有什么不同？"
  npc_override_com_d02_i_quests_illusion_dungeons_how_i_catch_i_wish_c0ac58: "我怎么才能抓住它？我希望有办法把它带到我的实验室……"
  npc_override_com_d02_i_quests_illusion_dungeons_how_wait_you_offering_no_050b95: "但是怎么做？等等，你是说……？不用了，谢谢。"
  npc_override_com_d02_i_quests_illusion_dungeons_huh_brother_over_there_i_945131: "嗯？哥哥，那边……我以前见过他。"
  npc_override_com_d02_i_quests_illusion_dungeons_huh_s_you_again_don_3222b3: "嗯？！又是你？你不觉得我们见面太频繁了吗？前几天有人在说……"
  npc_override_com_d02_i_quests_illusion_dungeons_huh_then_how_i_investiga_3b59c8: "嗯？那我该怎么调查那边？"
  npc_override_com_d02_i_quests_illusion_dungeons_huh_what_should_i_as_26ffb2: "嗯……我该怎么办……就像卢安达建议的，我们必须逃到这个地……"
  npc_override_com_d02_i_quests_illusion_dungeons_huh_why_am_i_telling_c288f2: "嗯？我为什么要告诉你这些？"
  npc_override_com_d02_i_quests_illusion_dungeons_huh_you_haven_t_seen_543640: "嗯？你没见过吗？你被旅途分心了吗？啧啧，你真不走运……"
  npc_override_com_d02_i_quests_illusion_dungeons_huh_you_re_stranger_luan_442123: "嗯？！你就是卢安达外出狩猎时感兴趣的那个陌生人？"
  npc_override_com_d02_i_quests_illusion_dungeons_human_5de0b4: "人类？"
  npc_override_com_d02_i_quests_illusion_dungeons_human_you_blind_i_m_6ec280: "人类，你瞎了吗？我不是蝙蝠。"
  npc_override_com_d02_i_quests_illusion_dungeons_humans_die_eventually_so_91af39: "人类终究会死。早死一点有什么不好？来吧，喝一杯。不过这个味道不太好。"
  npc_override_com_d02_i_quests_illusion_dungeons_humans_t_trusted_ever_c1db96: "人类永远不能信任。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_078130: "我是。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_agree_he_might_bring_3378c2: "我同意他可能会带朋友来，但不是所有人类都不可信。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_d_better_careful_i_91190d: "我最好小心点。我不想因为采集一些蘑菇孢子而死。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_d_love_read_myself_4f762d: "我也想自己读一下。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_disappeared_anyway_if_a856cc: "如果布赖申没来，我反正也会消失，但谢谢你来找我。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_don_t_know_acedd2: "我不知道。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_don_t_like_mirko_2840e6: "我不喜欢米尔科。我不去。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_don_t_think_those_40e5c5: "我觉得那些僵尸没有灵魂。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_draw_what_i_see_8bb435: "我画下我在梦中看到的东西，但是……我看到的东西真的会发生吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_i_eat_anthing_now_please_3db5e8: "我现在什么都吃得下。请给我点东西吃。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_find_them_d717d2: "我会找到他们的！"
  npc_override_com_d02_i_quests_illusion_dungeons_i_found_36dec6: "找到了。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_get_payback_they_took_e83b3e: "我会报复……对……{0}……他们拿走了我的宝物！"
  npc_override_com_d02_i_quests_illusion_dungeons_i_had_nothing_e973b9: "我跟这件事没关系。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_heard_only_master_luan_31a3f1: "我听说这次只有卢安达师傅和毛师傅在到处跑？你躺在树顶上只喊着……"
  npc_override_com_d02_i_quests_illusion_dungeons_i_heard_stern_faced_seco_8ab0e4: "我听说那个表情严肃的老二警告过你，但你真是个无畏的外来者。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_i_don_t_want_bf5a66: "我知道，但我不想为了他们放弃我的人性。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_i_m_glad_cd39db: "我……我很……高兴……"
  npc_override_com_d02_i_quests_illusion_dungeons_i_i_m_still_wizard_819ae8: "我……我还是个魔法师！"
  npc_override_com_d02_i_quests_illusion_dungeons_i_ll_catch_up_soon_010300: "我马上跟上。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_ll_take_as_compliment_efcda4: "我就当你是在夸奖我了。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_ll_take_as_yes_8679d3: "我就当你答应了。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_look_like_novice_you_27f54f: "我看起来像初心者吗？你真可爱。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_bit_sane_now_0cdfbd: "我现在有点清醒了。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_going_die_die_2d67f9: "我要死了。死。死。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_going_kill_them_7e76ed: "我要把它们全部杀光！"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_hungry_hungry_f621ca: "我饿了……饿了。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_hungry_please_help_3bc80b: "我饿了。请帮帮我。我饿了。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_hungry_please_help_3c1bc9: "我饿了。请帮帮我。求你了……"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_sensing_faint_energy_2a031f: "我感应到南方有微弱的能量。我们快点！"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_sensing_some_faint_c5b651: "我感应到东方有微弱的能量。我们走。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_sorry_00dca6: "对不起。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_starving_death_if_267d29: "我要饿死了。如果我不吃点东西，我会死的。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_still_training_vain_0223ae: "我还在训练……徒劳？！你不能相信别人的……"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_telling_you_i_3c22dd: "我告诉你，我从你身上感觉到了好的气息。立刻离开这个地方。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_thirsty_thirsty_9ea564: "我渴了……渴了。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_may_look_i_m_39c01a: "我看起来可能不像，但我相当聪明。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_miss_my_happy_when_09a885: "我想我的Happy了。等我们终于搞定这件事，我想先把Happy带回来。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_s_okay_41a4f0: "没……没关系。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_saw_living_things_e1119e: "我看到了生物？"
  npc_override_com_d02_i_quests_illusion_dungeons_i_see_hmm_you_t_f06605: "我能看见。嗯……不过你看不见。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_starve_death_if_i_80afc8: "我会饿死的。如果我不吃点东西，我会死的。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_still_hear_you_ccb15e: "我还能听到你。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_swear_odin_day_never_e8770f: "我向奥丁发誓，那一天永远不会到来。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_explain_what_i_4ec126: "我无法解释我看到了什么。你必须亲眼看到才能相信。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_find_gone_my_29e7c8: "我找不到。消失了……我的女儿，我的……女儿？我的？宝贝……"
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_find_my_baby_a1987a: "我……找不到。我的宝贝。不见了。我的……可爱的女儿。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_go_out_anyway_b69f2e: "反正我也出不去。别难过。我希望我能成为你心中的一部分。那很有趣。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_say_i_understand_51789b: "我不能说我理解你的逻辑，但我会尊重你的意愿。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_stand_so_i_1abdf8: "我无法忍受，所以我一直在进进出出。你到底看到了什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_stop_them_following_ba771f: "我无法阻止它们跟着我！"
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_you_re_twisting_d0899c: "我不能。你在歪曲事实让自己好看。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_think_drinking_water_g_e1f398: "我觉得喝水就足够了……"
  npc_override_com_d02_i_quests_illusion_dungeons_i_think_i_lost_my_dcd0a5: "我想我是因为练习不顺利而失去了理智。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_think_so_means_we_e07e10: "我想是的。这意味着我们可以利用它们来对付亡灵。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_told_you_i_used_ba012f: "我告诉过你，我在它们身上用了457个护身符，没有一个起作用。它们是由别的东西驱动的。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_ve_been_earning_my_ef7b15: "我一直自食其力。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_ve_been_singing_since_93a997: "自从发现乔乔哥哥失踪后，我就一直在唱歌。"
  npc_override_com_d02_i_quests_illusion_dungeons_i_worried_about_you_a7c69d: "我很担心你……"
  npc_override_com_d02_i_quests_illusion_dungeons_if_s_youngest_s_memory_11fc1e: "如果是最小的记忆，那就是了。在这个年纪当个陌生人真奇怪。"
  npc_override_com_d02_i_quests_illusion_dungeons_if_you_re_busy_we_338af9: "如果你忙，我们理解。"
  npc_override_com_d02_i_quests_illusion_dungeons_imagine_what_we_power_9392d0: "想象一下我们能用这种力量做什么。"
  npc_override_com_d02_i_quests_illusion_dungeons_just_disappeared_words_886777: "就消失了……那些话……"
  npc_override_com_d02_i_quests_illusion_dungeons_just_hush_4aded3: "嘘！"
  npc_override_com_d02_i_quests_illusion_dungeons_just_listen_you_9c7a31: "听着，好吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_just_stop_talking_take_c_8dffe7: "别说话了，把这些处理掉。"
  npc_override_com_d02_i_quests_illusion_dungeons_just_studying_they_could_538c58: "只是研究？他们本可以把整个大陆变成邪恶的温床！"
  npc_override_com_d02_i_quests_illusion_dungeons_ka_karu_d0b45a: "卡……卡鲁……"
  npc_override_com_d02_i_quests_illusion_dungeons_karu_don_t_too_sad_28643d: "卡鲁，别太难过……你是这样找到我的……"
  npc_override_com_d02_i_quests_illusion_dungeons_karu_how_hunt_today_3cccf1: "卡鲁……今天狩猎怎么样？"
  npc_override_com_d02_i_quests_illusion_dungeons_kill_f7af67: "杀！"
  npc_override_com_d02_i_quests_illusion_dungeons_king_i_told_you_we_bd5be9: "王，我告诉过你，我们不再喝人血了。而且那样说很不礼貌。我代他道歉。"
  npc_override_com_d02_i_quests_illusion_dungeons_king_s_enough_stop_tortu_3297b3: "王，够了。别再折磨他了。"
  npc_override_com_d02_i_quests_illusion_dungeons_later_i_met_him_again_deb795: "后来，我又遇到了他，我们变得亲近了。他是我第一个真正的朋友。"
  npc_override_com_d02_i_quests_illusion_dungeons_leave_realm_3dfce4: "离开这个领域。"
  npc_override_com_d02_i_quests_illusion_dungeons_leave_them_alone_they_re_50d675: "别打扰他们。他们正在和解。"
  npc_override_com_d02_i_quests_illusion_dungeons_let_me_go_you_i_e58eac: "让我跟你走。我想陪着你直到你完全康复。"
  npc_override_com_d02_i_quests_illusion_dungeons_let_me_help_84023d: "让我帮忙。"
  npc_override_com_d02_i_quests_illusion_dungeons_let_me_notebook_a73304: "把笔记本给我。"
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_calm_down_try_120b7f: "让我们冷静下来，试试别的办法。"
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_drink_one_77d45a: "让我们从这个身上喝。"
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_go_back_80df61: "我们回去吧。"
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_go_north_23d6dd: "我们往北走！"
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_go_south_e934e9: "我们往南走！"
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_listen_now_ecb0a8: "我们先听着。"
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_secure_place_first_107710: "我们先确保这个地方的安全。"
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_use_scroll_yggdras_827498: "这次让我们同时使用卷轴和世界之树的叶子。我会从这里激活卷轴。你从那里使用叶子。"
  npc_override_com_d02_i_quests_illusion_dungeons_liar_liar_dd6f69: "骗子，骗子。"
  npc_override_com_d02_i_quests_illusion_dungeons_like_what_41f49b: "比如什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_long_long_time_ago_5bf97e: "那是很久很久以前的事了。"
  npc_override_com_d02_i_quests_illusion_dungeons_look_other_side_netherwo_a537d4: "看冥河的另一边。"
  npc_override_com_d02_i_quests_illusion_dungeons_looking_expression_secon_b67f78: "看老二的表情，我觉得这个陌生人有什么话要说？最小的，我们先走吧。"
  npc_override_com_d02_i_quests_illusion_dungeons_looks_like_stranger_if_i_b92d8c: "看起来像个陌生人？如果我没记错的话，我在附近没见过那张脸。"
  npc_override_com_d02_i_quests_illusion_dungeons_lot_monsters_come_town_s_ff94d6: "很快会有很多怪物来到这个城镇。不要白白送死，离开这个地方。"
  npc_override_com_d02_i_quests_illusion_dungeons_make_into_pieces_7d9799: "碎尸万段！"
  npc_override_com_d02_i_quests_illusion_dungeons_maybe_i_should_crush_mix_34889e: "也许我应该把这些宝石碾碎混合在一起，看看能不能用混合物将亡灵的灵魂从它们的身体中分离出来。"
  npc_override_com_d02_i_quests_illusion_dungeons_maybe_one_day_yes_1f2535: "也许有一天，会的。"
  npc_override_com_d02_i_quests_illusion_dungeons_maybe_we_should_send_som_bd3ecc: "也许我们应该派别人去。"
  npc_override_com_d02_i_quests_illusion_dungeons_maybe_yggdrasil_leaves_k_aa27cd: "也许世界之树的叶子能杀死亡灵。"
  npc_override_com_d02_i_quests_illusion_dungeons_me_what_if_i_don_87c149: "我？如果我不想呢？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_angry_11fbdf: "愤怒的德古拉：波米需要休息。我来对付你！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_angry_12e00e: "愤怒的德古拉：别碰波米！跟我打！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_angry_aa2f6c: "愤怒的德古拉：波米该醒了。人类，别忘了你们的承诺！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_angry_b75efd: "愤怒的德古拉：谁敢伤害我的波米？！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_003414: "考古学家莱芬：经过漫长的研究考察，我终于能在调查地点吃上几顿饭了……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_0afdf2: "考古学家莱芬：你要去海龟岛见纳林吗？我们快点！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_0e070c: "考古学家莱芬：纳林的东西……？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_27ebb4: "考古学家莱芬：嗯……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_35eb56: "考古学家莱芬：还有另一个？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_3d3974: "考古学家莱芬：明天见，纳林。还有你。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_3d4234: "考古学家莱芬：哦……老鬼……？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_52c1f0: "考古学家莱芬：你说最近的地方就在这儿？我没事。给我带路！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_530eaa: "考古学家莱芬：哦，你回来了，{0}。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_65365b: "考古学家莱芬：我准备好了。这里有很多有趣的东西。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_6537ff: "考古学家莱芬：我怎么能忘记这个地方！？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_69beae: "考古学家莱芬：你怎么知道是我？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_74b85b: "考古学家莱芬：或者你可以把我背出去……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_7b3de0: "考古学家莱芬：哦，你回来了。我一直在等。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_7b7044: "考古学家莱芬：肚子咕噜噜叫……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_812f58: "考古学家莱芬：那让我在这附近看看。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_977f19: "考古学家莱芬：嚼着……恶心……？？！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_9b54c2: "考古学家莱芬：真的吗？有人？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_9e4572: "考古学家莱芬：嗯，吃饭和睡觉的问题在艾尔贝塔解决了。我得到了不错的住宿。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_a01846: "考古学家莱芬：你好，{0}。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_a2b75a: "考古学家莱芬：是这里吗？我来过几次……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_b2918b: "考古学家莱芬：好的，再见！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_bbb4c2: "考古学家莱芬：……哦，我以为我要死了。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_cd16b6: "考古学家莱芬：呃，怪物！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_d16c62: "考古学家莱芬：那是什么意思？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_d70f3a: "考古学家莱芬：这……这是一个{0}！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_e0bc5e: "考古学家莱芬：我是考古学教授。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_e557cd: "考古学家莱芬：这个海龟岛，不是我们知道的那个海龟岛。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_ec89ad: "考古学家莱芬：如果{0}能安抚那些纠缠的灵魂，我希望有一天能和他们谈谈。关于这个地方……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_2165b9: "艾尔瓦：呃，和之前一样的风。{0}，你没事吧？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_376b70: "艾尔瓦：真的吗？哦。莱芬……！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_395a43: "艾尔瓦：他是个把研究看得比自身还重要的人，所以我想离他近一点。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_3da65b: "艾尔瓦：我亲眼所见。就在这里。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_604ba4: "艾尔瓦：莱芬，我的朋友……请平安无事。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_7e3f9d: "艾尔瓦：很难说清，这明明是个海龟岛，但我起了一身鸡皮疙瘩。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_8df4de: "艾尔瓦：我不确定怎么回事，但我知道我是勉强逃出来的。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_a93a06: "艾尔瓦：冒险者？啊。是你，{0}。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_bc99bb: "艾尔瓦：{0}，请小心！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_d9b071: "艾尔瓦：我需要你的帮助。请快点！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_ef9430: "艾尔瓦：有办法让我去那里吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_fc4f3e: "艾尔瓦：真的吗？太好了！莱芬……！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_coughing_cc4be4: "咳嗽的年轻人：咳咳！！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_01dfd4: "女孩：你不需要知道，反正你要走了……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_35a30f: "女孩：……随你怎么想。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_37240a: "女孩：如果你不期待，就不会有失望。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_60d5d8: "女孩：……你在这里吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_645a58: "女孩：别呼吸！别说话！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_689cb8: "女孩：是的。只是……走吧。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_7229bc: "女孩：你在说什么？我才是傲慢的那个？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_799b8c: "女孩：那块碎片会帮到你。抓紧了。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_bf6b06: "女孩：我只是因为你这么执着才告诉你的。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_d9db64: "女孩：那块碎片。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_fb6e68: "女孩：你不需要知道。你不应该在这里。有些事你不应该知道。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_ktullanux_7cd0ef: "克鲁拉努克斯：我会……回来……的……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_ktullanux_e5fc70: "克鲁拉努克斯：谁敢叫我蜥蜴？我要把你们全部冻住！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_leiphen_a3dd26: "莱芬：我是莱芬，朱诺的考古学教授。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_mirko_2feba1: "米尔科：嘿，那我该去还是刚出现的冒险者该去？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_mirko_bca03c: "米尔科：如果你要这么生气的话就别去了……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_18f9c9: "纳林：是的，龟壳，我的雕塑。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_3b3301: "纳林：不，别回来。这里非常危险。不要试图回来。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_4a8fbb: "纳林：……是吗？其实我留着它是因为它很漂亮。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_68371d: "纳林：从我有记忆起就一直在等待……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_68a72c: "纳林：而我是唯一知道和感受自己是谁、在做什么的人。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_693085: "纳林：我很幸运，所以有时我能出去，但最终我会回来重复这一切。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_a86e30: "纳林：我是为自己做的。不用谢。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_fbcab6: "纳林：……这就是我的故事的结局。现在把碎片给我，你们两个该回去了……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_019bfa: "{0}：嘿，你是之前的那个女孩？什么，是龟壳？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_07d4bb: "{0}：他……是个奇怪的人。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_0aca63: "{0}：嘿，你好？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_13e342: "{0}：你是什么意思？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_160627: "{0}：……你被背叛了？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_1bcc1a: "{0}：我会去猎杀怪物。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_1f9ed6: "{0}：……{1}？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_22fc0a: "{0}：……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_2591ce: "{0}：你说的是德古拉？我听说过他。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_26f4a5: "{0}：小心，很危险！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_286b94: "{0}：艾尔瓦派我来找你。我是冒险者{1}。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_292cf2: "{0}：是的，我准备好了！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_2b6c11: "{0}：请放心，我们在乎。考古学家莱芬和我不会让你失望的。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_330e05: "{0}：好的……我们一起去？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_38cc46: "{0}：你没有课吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_3b9271: "{0}：这……一定是笔记本主人的旧记忆。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_3ffd34: "{0}：我按种类猎杀了怪物，但得到的都是腐烂的肉。我只带了{1}。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_4097c6: "{0}：即使这么危险，你还是忍不住好奇……不管怎样小心点。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_481aac: "？？？？？：这个世界！！！！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_4da3b3: "{0}：我最好去找乔乔。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_5d2d42: "{0}：这个地方对像你这样的初心者来说太危险了。你最好尽快离开。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_5fe0cc: "{0}：我觉得你去那里很困难。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_6551da: "{0}：……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_684738: "{0}：……打扰一下？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_693937: "{0}：看起来你还需要我。你叫我了吗？我没听清，你能再说一遍吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_694dff: "{0}：嗯……嘿，你好？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_6a3382: "{0}：……你真是个不知疲倦的学者。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_6ae4d6: "{0}：我……能帮什么忙吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_727446: "{0}：嗯，我看到这里有些人。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_752ae8: "{0}：……太糟糕了。莱芬，猎到的怪物的肉全都腐烂了……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_77e786: "{0}：呃，那是什么？？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_79b160: "{0}：典型的魔法师……等等，那难道是乔乔？？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_7a473b: "{0}：我觉得沟通会很困难……我们去找其他人吧？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_7dfa99: "{0}：我来帮忙。让我分享一些食物。这附近有可以猎杀的动物吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_7f4bfd: "{0}：我听说你失踪了半天……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_7ff3b4: "{0}：我们必须记住。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_812bcc: "{0}：你想让我去狩猎？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_858663: "{0}：噩梦，蘑菇，僵尸……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_869ec8: "{0}：不管我怎么猎杀，得到的都是腐烂的肉。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_8af8fa: "{0}：！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_8d3b49: "{0}：但是，有一些奇怪的人。我不确定我们能交谈……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_8fe760: "{0}：你说过你想拯救所有生命。如果你没有放弃那个愿望，你肯定能记住它。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_91454b: "？？？？？：忘记被困在阴暗潮湿地下的可耻过去吧。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_91c181: "{0}：很高兴找到能说话的人。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_943027: "{0}：哦。所以你才在这些地下墓穴里研究僵尸。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_95efc5: "{0}：我们会回来的。不要感到孤独。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_96cc18: "{0}：你一直在这里。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_98c5d6: "{0}：莱芬博士！你是考古学家莱芬，对吧？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_9b691a: "{0}：嗯，这位女士就是莱芬教授。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_9e0c8f: "{0}：他失去了他的宝宝……？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_a25f7b: "{0}：回到这里？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_a60c2e: "{0}：如果你忘记了我们，我们会提醒你。你忘记多少，我们就提醒多少。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_abd54c: "{0}：是的。就在这里。你好，你还好吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_ad0f95: "？？？？？：不会停止入侵！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_aec2c5: "{0}：我们别无选择，相信她吧。我们往上走！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_b37c96: "{0}：我没事。我找到考古学家莱芬了。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_b3da29: "{0}：请放心，我们在乎。当我再次回来时我会很高兴。如果我再来时你变得冷淡，我会难过。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_b3e373: "{0}：但你还记得龟壳碎片。你可以再次记住。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_b983f1: "{0}：没关系，教授。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_c6e08e: "{0}：我也在这里。你还好吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_c771f0: "{0}：我回来了。我完成了狩猎。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_c7db92: "{0}：看着她和{1}在一起的幸福……我感到遗憾。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_cb163a: "{0}：那么你现在要回去了？让我带你出去……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_cd8806: "{0}：你是谁？你怎么认识他的？我在哪里？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_d42db3: "{0}：卡里斯！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_d5d1fa: "{0}：哎呀，你还好吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_d89486: "{0}：……闻起来腐烂了……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_da13c6: "？？？？？：直到他们臣服于我们的那天，我们纳扎里安人！！！！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_dcc767: "{0}：让我再去猎杀一些。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_de648e: "{0}：……你要我猎杀多少只怪物？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_dee177: "{0}：什么意思？它看起来不像普通的海龟岛？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_e30d49: "{0}：你感到孤独时我会来陪你。你不必忘记一切。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_e70278: "{0}：你是说，你想让我们回家。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_e94782: "{0}：你是谁？这块碎片做了什么？我在哪里？我是怎么到这里的？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_ebd8de: "？？？？？：……哦……啊哈……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_ed75d9: "{0}：没关系，考古学家莱芬的位置似乎就是我去过的地方。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_eef715: "{0}：你说你想让我把你背出去……？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_f095bb: "{0}：全是腐烂的肉。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_f29fc0: "{0}：当然。如果不行，我们会回来一次又一次地尝试。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_f2c1c6: "{0}：呃，很难再待下去了。需要躲避。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_f4f0d4: "{0}：我在这里有事要做。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_f7b482: "{0}：哈哈……我无法沟通……我想回家。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_fa208a: "？？？？？：这片土地！！！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_fc4cf8: "{0}：嘿？发生什么事了？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_fc7b6a: "{0}：没关系。我们又来了。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_fe470d: "{0}：呃！你不是小孩子了。这里很危险。别再乱跑了！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_fed42e: "{0}：这是什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_ffe7bc: "？？？？？：嗯哈哈哈哈哈哈哈！！！！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_steven_051ecd: "史蒂文：真是个白痴！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_steven_183ed8: "史蒂文：你就不能放我走吗？！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_steven_19aff5: "史蒂文：空气比矿洞里还差……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_steven_799c89: "史蒂文：呃……唠叨……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_steven_9dad0e: "史蒂文：求你了。"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_teddy_88e78f: "泰迪熊：快跑！！！！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_teddy_f04d8c: "泰迪熊：你对我做了什么……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_white_522f96: "白色泰迪熊：啊……亲爱的夏洛特……竟然在这种地方……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_white_991c58: "白色泰迪熊：被抓了，我被抓住了！"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_woman_96a0c1: "女人：嚼嚼， munch……"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_yolanda_ef906e: "约兰达：你自己到底知道怎么做些什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_monsters_each_please_71bd35: "^0000CD{0}、{1}、{2}、{3}。^0000CD每种10只。^000000拜托了。"
  npc_override_com_d02_i_quests_illusion_dungeons_most_perfect_use_these_t_3a0187: "最好不需要用到这些东西……"
  npc_override_com_d02_i_quests_illusion_dungeons_msg_0b0c6f: "{0}"
  npc_override_com_d02_i_quests_illusion_dungeons_msg_6eae3a: "……"
  npc_override_com_d02_i_quests_illusion_dungeons_msg_861fa1: "{0}。"
  npc_override_com_d02_i_quests_illusion_dungeons_munch_muunch_munch_muunc_f396f4: "嚼……嚼……嚼……嚼……"
  npc_override_com_d02_i_quests_illusion_dungeons_munch_muunch_treasure_my_16ba2f: "嚼……嚼，宝物……我的宝物……嚼……嚼……"
  npc_override_com_d02_i_quests_illusion_dungeons_munch_muunch_treasure_my_4c961c: "嚼……嚼，宝物……我的宝物……嚼……嚼……"
  npc_override_com_d02_i_quests_illusion_dungeons_muscle_spasm_b94cb3: "肌肉痉挛？"
  npc_override_com_d02_i_quests_illusion_dungeons_mushrooms_zombies_same_d_718e78: "蘑菇和僵尸。对我来说都一样。"
  npc_override_com_d02_i_quests_illusion_dungeons_muyeon_if_you_t_no_d9b3fd: "武渊……如果你做不到，就没人能做到了！"
  npc_override_com_d02_i_quests_illusion_dungeons_muyeon_really_upset_we_s_2e6025: "武渊真的很沮丧。我们应该问问她发生了什么事。"
  npc_override_com_d02_i_quests_illusion_dungeons_my_baby_baby_i_lost_465e35: "我的宝贝？宝贝？我丢了，丢了，我的女儿……宝贝。在哪里……在哪里？"
  npc_override_com_d02_i_quests_illusion_dungeons_my_baby_gone_my_baby_f4353e: "我的宝贝不见了……我的宝贝。我可爱的宝贝。"
  npc_override_com_d02_i_quests_illusion_dungeons_my_baby_i_lost_her_bc46e5: "我的宝贝，我失去她了。我失去了我的宝贝。你在哪里？"
  npc_override_com_d02_i_quests_illusion_dungeons_my_brothers_abandoned_vi_03e340: "我的兄弟们小时候被遗弃在村子里。村民们把他们捡来抚养长大。"
  npc_override_com_d02_i_quests_illusion_dungeons_my_fear_death_what_keeps_8b4944: "对死亡的恐惧驱使我前进。它塑造了现在的我。"
  npc_override_com_d02_i_quests_illusion_dungeons_my_treasure_8d83f3: "我的宝物……"
  npc_override_com_d02_i_quests_illusion_dungeons_my_treasure_if_gone_all_51469f: "我的宝物，如果{0}不见了……全部，嚼……嚼……"
  npc_override_com_d02_i_quests_illusion_dungeons_my_treasure_munch_t_forg_eac61e: "我的，宝物……嚼，不可饶恕……"
  npc_override_com_d02_i_quests_illusion_dungeons_nice_if_just_dream_149ef1: "如果只是梦就好了……"
  npc_override_com_d02_i_quests_illusion_dungeons_nightmares_about_about_f_586e73: "关于狐狸的噩梦？九尾狐和月光花？"
  npc_override_com_d02_i_quests_illusion_dungeons_no_1d59ae: "不！"
  npc_override_com_d02_i_quests_illusion_dungeons_no_9a4c18: "……不。"
  npc_override_com_d02_i_quests_illusion_dungeons_no_b8b9f1: "不。"
  npc_override_com_d02_i_quests_illusion_dungeons_no_i_d_rather_wait_da62db: "不。我宁愿等他们回来。"
  npc_override_com_d02_i_quests_illusion_dungeons_no_i_m_going_i_83c9dd: "不，我不会那么做的。我永远不会忘记恩情。你救了我。我保证不会伤害你。请相信我。"
  npc_override_com_d02_i_quests_illusion_dungeons_no_my_baby_a4d5aa: "不，我的宝贝……"
  npc_override_com_d02_i_quests_illusion_dungeons_no_no_s_true_2e281b: "不，不，那不是真的。"
  npc_override_com_d02_i_quests_illusion_dungeons_no_one_hurts_anyone_fron_5f420e: "在我面前没人能伤害任何人。"
  npc_override_com_d02_i_quests_illusion_dungeons_no_priests_try_get_rid_b63e63: "不。牧师会试图除掉这些的。专注于记录这个过程。"
  npc_override_com_d02_i_quests_illusion_dungeons_no_s_clear_their_souls_99c081: "不。很明显他们的灵魂已经回到了死去的身体中。如果我们可以自由地将灵魂附身于身体或脱离身体，我们就能永远逃离肉体的痛苦！"
  npc_override_com_d02_i_quests_illusion_dungeons_no_they_re_going_put_c99306: "不！他们会让我们陷入危险！"
  npc_override_com_d02_i_quests_illusion_dungeons_nothing_happened_i_ll_in_1701e1: "什么也没发生。第四十九次尝试我会增加圣水的用量。"
  npc_override_com_d02_i_quests_illusion_dungeons_now_s_enough_4ab955: "现在，够了。"
  npc_override_com_d02_i_quests_illusion_dungeons_now_s_hypothetical_now_b_06bebb: "{0}，那只是假设，但现在布赖申真的很危险！"
  npc_override_com_d02_i_quests_illusion_dungeons_now_what_i_look_like_246286: "现在，我看起来什么样？"
  npc_override_com_d02_i_quests_illusion_dungeons_obtained_all_deep_sea_cr_4e3925: "^4d4dff{0}^000000可以从这里所有的深海生物身上获得。"
  npc_override_com_d02_i_quests_illusion_dungeons_oh_don_t_remind_me_696ebf: "哦，别提了！"
  npc_override_com_d02_i_quests_illusion_dungeons_oh_geez_here_goes_again_93fdb2: "天哪，又来了。"
  npc_override_com_d02_i_quests_illusion_dungeons_oh_no_i_feel_toxins_cda39c: "哦，不……我感觉到毒素正在蔓延到全身……！"
  npc_override_com_d02_i_quests_illusion_dungeons_oh_no_s_cba358: "哦，不。那是？"
  npc_override_com_d02_i_quests_illusion_dungeons_oh_why_am_i_so_6bdb8b: "哦，为什么我这么弱？不像我的哥哥们，我的能力在战斗中不是特别有用。"
  npc_override_com_d02_i_quests_illusion_dungeons_oh_you_don_t_even_95fac9: "哦，你连我的名字都懒得叫了。"
  npc_override_com_d02_i_quests_illusion_dungeons_oh_you_ok_i_am_e89185: "{0}！哦，你没事！我……很担心。莱芬之后，{1}，你也消失了，我真的很担心。"
  npc_override_com_d02_i_quests_illusion_dungeons_oh_you_re_right_219768: "……哦，你说得对。"
  npc_override_com_d02_i_quests_illusion_dungeons_okay_4371ac: "好的。"
  npc_override_com_d02_i_quests_illusion_dungeons_once_we_claim_land_legen_8bb5b4: "一旦我们占领这片土地，传说中的力量也将属于我们。"
  npc_override_com_d02_i_quests_illusion_dungeons_one_different_color_neon_86da98: "这个和霓虹蘑菇颜色不同。是新品种吗？我最好小心采摘……"
  npc_override_com_d02_i_quests_illusion_dungeons_one_us_search_while_othe_e4153b: "我们中的一个可以搜索，另一个掩护。"
  npc_override_com_d02_i_quests_illusion_dungeons_ooh_i_m_going_studying_cda88a: "哦，我要在你盯梢的情况下做研究，真令人兴奋！"
  npc_override_com_d02_i_quests_illusion_dungeons_our_bodies_don_t_need_02f03a: "但我们的身体不需要灵魂来生存。我仍然认为那些尸体只是？"
  npc_override_com_d02_i_quests_illusion_dungeons_outside_maybe_i_no_longe_3f6b13: "表面上也许是。但我将不再畏惧死亡，因此也没有活下去的欲望。"
  npc_override_com_d02_i_quests_illusion_dungeons_pains_me_see_you_wither_e5a2df: "看到你一天天消瘦，我很心痛。"
  npc_override_com_d02_i_quests_illusion_dungeons_panting_you_re_here_2da3d3: "*喘气*你来了。"
  npc_override_com_d02_i_quests_illusion_dungeons_people_church_30db93: "教会的人？"
  npc_override_com_d02_i_quests_illusion_dungeons_phi_braggart_master_mao_45cefe: "切~吹牛大王，毛师傅已经都告诉我了。"
  npc_override_com_d02_i_quests_illusion_dungeons_please_5c273b: "拜托？"
  npc_override_com_d02_i_quests_illusion_dungeons_please_help_us_you_help_c7cd71: "{0}，请帮帮我们。你能帮我找到我的朋友吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_please_tell_us_already_i_c33aee: "快告诉我们吧。我快等不及了！"
  npc_override_com_d02_i_quests_illusion_dungeons_plus_i_m_fast_my_6be524: "而且，我脚程很快。"
  npc_override_com_d02_i_quests_illusion_dungeons_poor_souls_cover_your_ey_7e1a60: "可怜的灵魂们，捂住你们的眼睛，堵住你们的耳朵。"
  npc_override_com_d02_i_quests_illusion_dungeons_rawr_024dbd: "吼！"
  npc_override_com_d02_i_quests_illusion_dungeons_revenge_revenge_munch_mu_2997b0: "复仇……复仇……嚼……嚼……嚼……嚼……"
  npc_override_com_d02_i_quests_illusion_dungeons_rise_78875b: "起来吧！"
  npc_override_com_d02_i_quests_illusion_dungeons_s_about_dying_their_curs_20d4ef: "这……不是关于死亡……是他们的诅咒……在你身上……"
  npc_override_com_d02_i_quests_illusion_dungeons_s_all_dead_8ccb3f: "全都死了……"
  npc_override_com_d02_i_quests_illusion_dungeons_s_as_if_spirits_antagoni_d43cc6: "仿佛灵魂被它们激怒了。"
  npc_override_com_d02_i_quests_illusion_dungeons_s_blasphemy_dc3cd3: "那是亵渎！"
  npc_override_com_d02_i_quests_illusion_dungeons_s_crazy_kkkk_52c4be: "那不疯狂，哈哈。"
  npc_override_com_d02_i_quests_illusion_dungeons_s_hard_explain_let_s_7bc45f: "很难解释。这么说吧，我们人类喜欢拯救他人。"
  npc_override_com_d02_i_quests_illusion_dungeons_s_just_hypothesis_now_br_cf17c7: "{0}，那只是假设，但现在布赖申真的很危险！"
  npc_override_com_d02_i_quests_illusion_dungeons_s_late_s_already_too_de813b: "太晚了，已经太晚了。"
  npc_override_com_d02_i_quests_illusion_dungeons_s_nice_name_03ddd6: "{0}。好名字。"
  npc_override_com_d02_i_quests_illusion_dungeons_s_telling_truth_when_you_b20bc3: "只从你自己的角度讲述，那不叫说实话！"
  npc_override_com_d02_i_quests_illusion_dungeons_s_true_others_your_kind_5d48f4: "那不是真的。你们同类只想杀了我。"
  npc_override_com_d02_i_quests_illusion_dungeons_s_what_people_protect_th_3c80f0: "这就是人们所做的，为了保护他们所爱的人。"
  npc_override_com_d02_i_quests_illusion_dungeons_s_why_i_fed_him_c79d26: "这就是为什么我喂他我的血，照料他的伤口，尽管我知道我不应该这样做。"
  npc_override_com_d02_i_quests_illusion_dungeons_secretly_priest_course_a38c64: "当然，要瞒着那个牧师。"
  npc_override_com_d02_i_quests_illusion_dungeons_see_i_told_you_one_a74a8a: "看吧，我告诉过你！他的一个朋友已经出现了！这就是我不信任人类的原因！"
  npc_override_com_d02_i_quests_illusion_dungeons_seeing_other_humans_seei_14025a: "看到其他人类和看到另一个自己，是两回事！"
  npc_override_com_d02_i_quests_illusion_dungeons_seems_you_already_identi_b07363: "看来你已经把自己当成蝙蝠了。"
  npc_override_com_d02_i_quests_illusion_dungeons_shakes_her_head_wizards_7b3307: "*摇头*魔法师们。"
  npc_override_com_d02_i_quests_illusion_dungeons_she_s_ungrateful_she_nev_ff355c: "她不是忘恩负义。她从来不想要我给她的东西。"
  npc_override_com_d02_i_quests_illusion_dungeons_should_enough_illuminate_cc44ca: "这足以照亮一个房间了。"
  npc_override_com_d02_i_quests_illusion_dungeons_should_i_say_aloud_since_4fd5dc: "我应该大声说出来吗，自从遇见你？我叫毛。我是你前几天见过的卢安达的弟弟。"
  npc_override_com_d02_i_quests_illusion_dungeons_should_killed_95cb0e: "早该杀掉的！"
  npc_override_com_d02_i_quests_illusion_dungeons_sigh_i_ll_go_after_40ace3: "唉。我去追她。跟长老们谈谈，好吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_sigh_sister_marina_right_5f72ce: "唉，玛丽娜姐姐说得对。"
  npc_override_com_d02_i_quests_illusion_dungeons_sister_mojo_please_stay_9c4a09: " mojo 姐姐，请不要插手这件事。"
  npc_override_com_d02_i_quests_illusion_dungeons_sniff_i_smell_humans_s_cb2797: "嗅嗅……我能闻到人类的气味。现在还不是与他们遭遇的时候。我们走。"
  npc_override_com_d02_i_quests_illusion_dungeons_snort_why_i_you_re_5143c8: "*哼*我为什么要那么做？你只会带着它逃跑。"
  npc_override_com_d02_i_quests_illusion_dungeons_so_i_told_you_i_7695d9: "所以我告诉过你，我会去把他们带回来。我比看起来要强壮。我可以自己完成这件事。"
  npc_override_com_d02_i_quests_illusion_dungeons_so_please_let_me_i_73f9db: "所以请让我拿着它。等我弄清楚一切后，我会还给你的。"
  npc_override_com_d02_i_quests_illusion_dungeons_so_what_s_your_point_377bf4: "所以你的重点是什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_so_you_re_as_stupid_aaae24: "所以你并没有我想的那么愚蠢。"
  npc_override_com_d02_i_quests_illusion_dungeons_somebody_please_shut_him_701211: "谁来让他闭嘴。我讨厌这个故事。"
  npc_override_com_d02_i_quests_illusion_dungeons_something_bit_sinister_i_70c083: "有点阴险，但我觉得这次会相当有利可图，最小的。"
  npc_override_com_d02_i_quests_illusion_dungeons_something_right_651d8f: "有什么不对劲！"
  npc_override_com_d02_i_quests_illusion_dungeons_stop_eavesdropping_peopl_1f6f7c: "别偷听别人说话。"
  npc_override_com_d02_i_quests_illusion_dungeons_stop_s_coming_agh_97f0d9: "停下……它来了，啊！！"
  npc_override_com_d02_i_quests_illusion_dungeons_sure_why_d9c786: "当然，为什么不呢？"
  npc_override_com_d02_i_quests_illusion_dungeons_take_care_don_t_late_8ee7d2: "保重。别迟到……"
  npc_override_com_d02_i_quests_illusion_dungeons_take_gona_you_a8a9c5: "带上戈纳。"
  npc_override_com_d02_i_quests_illusion_dungeons_take_me_you_68bb3a: "带上我！"
  npc_override_com_d02_i_quests_illusion_dungeons_th_unfair_3f4d8b: "这……这不公平……"
  npc_override_com_d02_i_quests_illusion_dungeons_thank_god_3b7a39: "感谢上帝……"
  npc_override_com_d02_i_quests_illusion_dungeons_then_what_explain_their_6ed8be: "那怎么解释它们的移动能力？每个会动的生物都有灵魂。"
  npc_override_com_d02_i_quests_illusion_dungeons_then_what_you_0d19b0: "那你是什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_there_s_one_more_c04b85: "还有一个。"
  npc_override_com_d02_i_quests_illusion_dungeons_there_they_they_look_fin_bc8d36: "他们在那里！他们看起来没事！"
  npc_override_com_d02_i_quests_illusion_dungeons_they_also_named_them_kar_9a4464: "他们还以城镇周围的洞穴给他们起名为卡鲁、卢安达和毛。"
  npc_override_com_d02_i_quests_illusion_dungeons_they_gone_373bef: "他们走了。"
  npc_override_com_d02_i_quests_illusion_dungeons_they_just_studying_200309: "他们只是在研究。"
  npc_override_com_d02_i_quests_illusion_dungeons_they_just_vanished_7976c5: "他们就那么消失了。"
  npc_override_com_d02_i_quests_illusion_dungeons_they_persistent_38b58f: "他们很执着。"
  npc_override_com_d02_i_quests_illusion_dungeons_they_said_name_guardian_2b2bb4: "他们说那是守护旧村的守护灵的名字。"
  npc_override_com_d02_i_quests_illusion_dungeons_they_weren_t_mushrooms_t_5c07cd: "它们不是蘑菇，是僵尸！"
  npc_override_com_d02_i_quests_illusion_dungeons_third_time_i_had_nightma_1640c8: "这是我第三次做噩梦了。我再也受不了了！"
  npc_override_com_d02_i_quests_illusion_dungeons_those_nightmares_just_to_bf0f64: "那些噩梦太可怕了。我不想再经历了。"
  npc_override_com_d02_i_quests_illusion_dungeons_tsk_tsk_you_re_too_ebd2d6: "啧，啧。你对人类太心软了。"
  npc_override_com_d02_i_quests_illusion_dungeons_turn_undead_5a5b28: "转生术！"
  npc_override_com_d02_i_quests_illusion_dungeons_turns_out_you_speak_very_99441e: "{0}，看来你很会说话。"
  npc_override_com_d02_i_quests_illusion_dungeons_ugh_07d624: "呃！"
  npc_override_com_d02_i_quests_illusion_dungeons_ugh_i_don_t_want_82d4e3: "呃，我不想再训练了！"
  npc_override_com_d02_i_quests_illusion_dungeons_uhm_s_bit_mess_great_1768c0: "嗯……有点乱……但这对我的技能来说是一幅很棒的壁画。"
  npc_override_com_d02_i_quests_illusion_dungeons_um_even_t_raise_dead_934776: "嗯，即使这样也不能让死者复活。那么是什么把那些生物从死亡中带回来的呢？"
  npc_override_com_d02_i_quests_illusion_dungeons_um_i_move_fine_now_0b2ac5: "嗯……我现在能正常活动了。我可以走了吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_unload_your_burden_82d447: "卸下你的负担。"
  npc_override_com_d02_i_quests_illusion_dungeons_wait_t_alive_s_already_a7e334: "等等，它不可能是活的。它已经死了。"
  npc_override_com_d02_i_quests_illusion_dungeons_wandering_souls_listen_b_64872d: "游荡的灵魂们，听好并见证！"
  npc_override_com_d02_i_quests_illusion_dungeons_we_must_drive_out_all_e382cc: "我们必须驱逐所有人类并占领这片土地。"
  npc_override_com_d02_i_quests_illusion_dungeons_we_need_someone_strong_g_5b197c: "我们需要一个强壮的人进去，比如那边的冒险者，应该进洞穴里去。"
  npc_override_com_d02_i_quests_illusion_dungeons_we_no_one_else_left_7df772: "但我们已经没有其他人可以执行仪式了。"
  npc_override_com_d02_i_quests_illusion_dungeons_we_re_no_position_take_40c4ec: "我们现在没有能力照顾任何人，所以照顾好自己……"
  npc_override_com_d02_i_quests_illusion_dungeons_we_should_ask_muyeon_wha_7f9ec5: "我们应该问问武渊发生了什么事。"
  npc_override_com_d02_i_quests_illusion_dungeons_we_t_experiment_place_li_f476a9: "我们不能在这种地方做实验。我们为什么不抓一个带回实验室呢？"
  npc_override_com_d02_i_quests_illusion_dungeons_what_be65b9: "什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_what_bomi_76802e: "什么？波米？"
  npc_override_com_d02_i_quests_illusion_dungeons_what_did_you_see_cave_4bf72f: "你在洞穴里看到了什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_what_friend_i_thought_i_8a97e3: "什么朋友？我以为我是你唯一的朋友。"
  npc_override_com_d02_i_quests_illusion_dungeons_what_hey_you_stop_right_01f89d: "什么？嘿，你给我站住！"
  npc_override_com_d02_i_quests_illusion_dungeons_what_i_t_hear_you_93d2e2: "什么？我听不见你。"
  npc_override_com_d02_i_quests_illusion_dungeons_what_more_you_say_53d4e3: "你还有什么要说的？"
  npc_override_com_d02_i_quests_illusion_dungeons_what_mushroom_exploded_414b83: "什么？蘑菇爆炸了？然后呢？"
  npc_override_com_d02_i_quests_illusion_dungeons_what_nightmares_3cce21: "什么噩梦？"
  npc_override_com_d02_i_quests_illusion_dungeons_what_smell_blood_smell_b_bccff8: "什么？血腥味？村子里传来血腥味？不会吧？现在不是关注陌生人的时候。我们快走。"
  npc_override_com_d02_i_quests_illusion_dungeons_what_you_doing_here_74351b: "你在这里做什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_what_you_guys_doing_c274d1: "你们在做什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_what_you_human_6be81c: "什么？你，人类。"
  npc_override_com_d02_i_quests_illusion_dungeons_what_you_mean_you_only_bf375b: "你是什么意思？你只是想安抚九尾狐愤怒的灵魂。"
  npc_override_com_d02_i_quests_illusion_dungeons_what_you_saying_23ee04: "你在说什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_whatever_you_say_i_m_0554aa: "随你怎么说，我不会再做了。"
  npc_override_com_d02_i_quests_illusion_dungeons_when_i_first_met_him_8900e9: "当我第一次见到他时，他濒临灭亡。他的脆弱让我强烈地想起了自己。"
  npc_override_com_d02_i_quests_illusion_dungeons_when_she_won_t_even_a5446c: "当她甚至不愿跟你说话时？"
  npc_override_com_d02_i_quests_illusion_dungeons_when_we_leave_22ca98: "我们什么时候可以离开？"
  npc_override_com_d02_i_quests_illusion_dungeons_where_am_i_where_everybo_366522: "我在哪里？大家都去哪了？"
  npc_override_com_d02_i_quests_illusion_dungeons_where_am_i_where_my_47402c: "我在哪里？我的老板呢？？"
  npc_override_com_d02_i_quests_illusion_dungeons_where_they_febc8d: "他们在哪里？"
  npc_override_com_d02_i_quests_illusion_dungeons_whew_he_s_out_woods_ebb3d5: "呼，他现在脱离危险了。"
  npc_override_com_d02_i_quests_illusion_dungeons_whew_i_am_now_thank_74efd3: "呼，我现在好了。谢谢你。"
  npc_override_com_d02_i_quests_illusion_dungeons_whew_thanks_1530b2: "呼，谢谢！"
  npc_override_com_d02_i_quests_illusion_dungeons_whine_772d3d: "*呜咽*"
  npc_override_com_d02_i_quests_illusion_dungeons_who_did_08b1ca: "是谁干的？"
  npc_override_com_d02_i_quests_illusion_dungeons_who_s_coming_all_way_0c25b0: "谁会大老远跑到这个阴森的地方来？嗯？！真的……原本是一次不错的约会。"
  npc_override_com_d02_i_quests_illusion_dungeons_who_there_who_there_602632: "谁在那里？谁在那里？"
  npc_override_com_d02_i_quests_illusion_dungeons_whoever_east_their_energ_13a8da: "东边的某个人，他们的能量越来越强了。我们快点！"
  npc_override_com_d02_i_quests_illusion_dungeons_whose_side_you_me_him_b6109a: "你站在哪一边？我还是他？"
  npc_override_com_d02_i_quests_illusion_dungeons_why_00da14: "为什么不呢？"
  npc_override_com_d02_i_quests_illusion_dungeons_why_21b2c0: "为什么不呢？！"
  npc_override_com_d02_i_quests_illusion_dungeons_why_aren_t_they_coming_1912dc: "他们怎么还没出来……"
  npc_override_com_d02_i_quests_illusion_dungeons_why_d77989: "为什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_why_did_you_save_me_130954: "你为什么要救我？"
  npc_override_com_d02_i_quests_illusion_dungeons_why_one_so_fast_i_94164c: "为什么那个这么快？我可能还没机会看一眼就死了。"
  npc_override_com_d02_i_quests_illusion_dungeons_why_they_still_coming_ou_996013: "他们为什么还没出来……"
  npc_override_com_d02_i_quests_illusion_dungeons_why_those_d565fe: "为什么是那些？"
  npc_override_com_d02_i_quests_illusion_dungeons_why_too_scary_then_how_ab33a1: "怎么，这太吓人了吗？那这样呢？"
  npc_override_com_d02_i_quests_illusion_dungeons_why_what_good_understand_7aaef7: "为什么？了解它们对你有什么好处？"
  npc_override_com_d02_i_quests_illusion_dungeons_why_wouldn_t_turn_into_2c1d4c: "为什么它不能变成人类？如果死者可以复活，那么它应该也能变成人类。"
  npc_override_com_d02_i_quests_illusion_dungeons_why_you_saying_i_m_487022: "你为什么这么说？我在说我的前辈们！"
  npc_override_com_d02_i_quests_illusion_dungeons_why_you_staring_me_71e4b7: "你为什么盯着我看？"
  npc_override_com_d02_i_quests_illusion_dungeons_why_you_want_i_give_412937: "怎么，你想要吗？我可以给你。"
  npc_override_com_d02_i_quests_illusion_dungeons_wouldn_t_better_if_we_1168b0: "让牧师来处理不是更好吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_wow_i_smell_lies_s_a61a54: "哇，我闻到了谎言的味道，从你嘴里飘出来的。"
  npc_override_com_d02_i_quests_illusion_dungeons_wow_these_guys_real_290faa: "哇……这些家伙是真的……"
  npc_override_com_d02_i_quests_illusion_dungeons_y_y_you_re_me_d8a779: "你……你……你是我？分……分……分身！我……我要死了吗？！"
  npc_override_com_d02_i_quests_illusion_dungeons_yeah_i_guess_so_s_0a06d6: "是啊，我想是吧？那也是我能记住的面孔。"
  npc_override_com_d02_i_quests_illusion_dungeons_yeah_look_you_your_face_e131da: "是啊，但看看你，当我提出时你的脸都亮了。"
  npc_override_com_d02_i_quests_illusion_dungeons_yeah_right_9e065b: "是啊，当然。"
  npc_override_com_d02_i_quests_illusion_dungeons_yes_as_second_said_we_75a9ea: "是的。正如老二所说，我们最好快点开始。我感觉不太好。"
  npc_override_com_d02_i_quests_illusion_dungeons_yes_bro_f7613e: "是的，兄弟。"
  npc_override_com_d02_i_quests_illusion_dungeons_yes_could_you_b21600: "是的。可以吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_yes_e77924: "是的……？"
  npc_override_com_d02_i_quests_illusion_dungeons_yes_you_leave_5d7347: "是的，你可以走了。"
  npc_override_com_d02_i_quests_illusion_dungeons_you_just_want_me_stand_8d4bd2: "你只想让我站在这里，呼吸。是这样吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_you_know_s_discriminatio_b195ab: "你知道这是歧视，对吧？你应该为自己感到羞耻！"
  npc_override_com_d02_i_quests_illusion_dungeons_you_know_what_i_found_3e1377: "你知道我在这里发现了什么吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_you_love_yourself_so_muc_793f78: "你太爱自己了，以至于不接受任何和你不一样的人。但当你看到和你长得一模一样的人时，你又无法忍受。为什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_you_may_feed_him_07a2b4: "你可以喂他。"
  npc_override_com_d02_i_quests_illusion_dungeons_you_mean_owner_notebook_3ee576: "你是说笔记本的主人？"
  npc_override_com_d02_i_quests_illusion_dungeons_you_mind_if_i_get_2bfc0f: "你介意我把那只蝙蝠除掉吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_you_need_stop_hanging_hu_fa9c3b: "你不能再跟人类混在一起了。你现在说话像他们一样。"
  npc_override_com_d02_i_quests_illusion_dungeons_you_re_afraid_dying_your_3fe0de: "但你害怕死亡。而且你的日子不多了。"
  npc_override_com_d02_i_quests_illusion_dungeons_you_re_afraid_yourself_w_76a9e0: "你害怕你自己。为什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_you_re_already_burdening_749312: "你已经在拖累他了。"
  npc_override_com_d02_i_quests_illusion_dungeons_you_re_delusional_if_you_5beb6f: "如果你认为人多力量大不是真的，那你就是在妄想。"
  npc_override_com_d02_i_quests_illusion_dungeons_you_re_genius_c38079: "你是个天才！"
  npc_override_com_d02_i_quests_illusion_dungeons_you_really_want_me_show_ba6088: "你真的想让我展示给你看吗？现在？"
  npc_override_com_d02_i_quests_illusion_dungeons_you_said_you_attacked_zo_74b0b3: "你说你被僵尸攻击了。"
  npc_override_com_d02_i_quests_illusion_dungeons_you_said_you_d_come_b38078: "你说你会回来的？"
  npc_override_com_d02_i_quests_illusion_dungeons_you_saying_he_smells_del_d65f29: "你是说他闻起来很美味？我可以喝他的血吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_you_should_ve_become_pol_e425fc: "你该去当政治家的。那样你会更成功。"
  npc_override_com_d02_i_quests_illusion_dungeons_you_shouldn_t_wasted_you_0c07c1: "你不该把你的宝贵嗓音浪费在这些邪恶的生物上。"
  npc_override_com_d02_i_quests_illusion_dungeons_you_t_you_feel_anything_b93ed8: "你？除了好气息你就感觉不到别的吗？你到底在做什么？"
  npc_override_com_d02_i_quests_illusion_dungeons_you_think_you_7e13d9: "你觉得你能行吗？"
  npc_override_com_d02_i_quests_illusion_dungeons_you_ve_got_listen_both_ae4aa4: "你必须在评判之前听取双方的说法！"
  npc_override_com_d02_i_quests_illusion_dungeons_you_want_them_so_badly_768625: "你如此渴望得到它们，以至于冒着生命危险在这种地方做研究。"
