  npc_override_com_d02_i_quests_illusion_dungeons_please_tell_us_already_i_c33aee: "Please tell us already. I'm dying to know!"
  npc_override_com_d02_i_quests_illusion_dungeons_plus_i_m_fast_my_6be524: "Plus, I'm fast on my feet."
