  npc_override_com_d02_i_quests_illusion_dungeons_people_church_30db93: "The people from the Church?"
  npc_override_com_d02_i_quests_illusion_dungeons_phi_braggart_master_mao_45cefe: "Phi~ braggart, Master Mao has already told me everything."
  npc_override_com_d02_i_quests_illusion_dungeons_please_5c273b: "Please?"
