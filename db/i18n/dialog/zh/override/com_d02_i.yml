  npc_override_com_d02_i_quests_illusion_dungeons_i_m_hungry_please_help_3bc80b: "I'm hungry. Please help me. I'm hungry."
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_hungry_please_help_3c1bc9: "I'm hungry. Please help me. Please..."
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_sensing_faint_energy_2a031f: "I'm sensing faint energy in the south. Let's hurry!"
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_sensing_some_faint_c5b651: "I'm sensing some faint energy in the east. Let's go."
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_sorry_00dca6: "I'm sorry."
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_starving_death_if_267d29: "I'm starving to death. If I don't eat something, I will die."
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_still_training_vain_0223ae: "I'm still training... in vain?! You can't believe someone else's..."
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_telling_you_i_3c22dd: "I'm telling you that I feel good vibes from you. Leave this place right now."
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_thirsty_thirsty_9ea564: "I'm thirsty... Thirsty."
  npc_override_com_d02_i_quests_illusion_dungeons_i_may_look_i_m_39c01a: "I may not look it, but I'm pretty smart."
  npc_override_com_d02_i_quests_illusion_dungeons_i_miss_my_happy_when_09a885: "I miss my Happy. When we finally make this work, I want to bring back Happy first."
  npc_override_com_d02_i_quests_illusion_dungeons_i_s_okay_41a4f0: "I-it's okay."
  npc_override_com_d02_i_quests_illusion_dungeons_i_saw_living_things_e1119e: "I saw living things?"
  npc_override_com_d02_i_quests_illusion_dungeons_i_see_hmm_you_t_f06605: "I can see it. Hmm... you can't see it though."
  npc_override_com_d02_i_quests_illusion_dungeons_i_starve_death_if_i_80afc8: "I will starve to death. If I don't eat something, I will die."
  npc_override_com_d02_i_quests_illusion_dungeons_i_still_hear_you_ccb15e: "I still can hear you."
  npc_override_com_d02_i_quests_illusion_dungeons_i_swear_odin_day_never_e8770f: "I swear to Odin that day will never come."
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_explain_what_i_4ec126: "I can't explain what I saw. You have to see it to believe it."
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_find_gone_my_29e7c8: "I can't find. Gone... My daughter, my... daughter? My? baby..."
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_find_my_baby_a1987a: "I can't... find. My baby. Gone. My... lovely daughter."
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_go_out_anyway_b69f2e: "I can't go out anyway. Don't be sad. I wish I could be a part of your heart. It was fun."
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_say_i_understand_51789b: "I can't say I understand your logic, but I'll respect your wishes."
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_stand_so_i_1abdf8: "I can't stand it, so I keep coming in and out. What the hell did you see?"
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_stop_them_following_ba771f: "I can't stop them from following me!"
  npc_override_com_d02_i_quests_illusion_dungeons_i_t_you_re_twisting_d0899c: "I can't. You're twisting the facts to make yourself look good."
  npc_override_com_d02_i_quests_illusion_dungeons_i_think_drinking_water_g_e1f398: "I think drinking water is good enough..."
  npc_override_com_d02_i_quests_illusion_dungeons_i_think_i_lost_my_dcd0a5: "I think I lost my mind because the practice didn't go well."
  npc_override_com_d02_i_quests_illusion_dungeons_i_think_so_means_we_e07e10: "I think so. This means we can use them to take care of the undead."
  npc_override_com_d02_i_quests_illusion_dungeons_i_told_you_i_used_ba012f: "I told you, I used 457 amulets on them, and none of them worked. They're fueled by something else."
  npc_override_com_d02_i_quests_illusion_dungeons_i_ve_been_earning_my_ef7b15: "I've been earning my keep just fine."
  npc_override_com_d02_i_quests_illusion_dungeons_i_ve_been_singing_since_93a997: "I've been singing since I found out Brother Jojo was missing."
  npc_override_com_d02_i_quests_illusion_dungeons_i_worried_about_you_a7c69d: "I was worried about you.."
  npc_override_com_d02_i_quests_illusion_dungeons_if_s_youngest_s_memory_11fc1e: "If it's the youngest's memory, that's it. It's odd to be a stranger at this age."
  npc_override_com_d02_i_quests_illusion_dungeons_if_you_re_busy_we_338af9: "If you're busy, we'll understand."
  npc_override_com_d02_i_quests_illusion_dungeons_imagine_what_we_power_9392d0: "Imagine what we can do with this power."
  npc_override_com_d02_i_quests_illusion_dungeons_just_disappeared_words_886777: "Just disappeared... the words..."
  npc_override_com_d02_i_quests_illusion_dungeons_just_hush_4aded3: "Just hush!"
  npc_override_com_d02_i_quests_illusion_dungeons_just_listen_you_9c7a31: "Just listen, will you?"
  npc_override_com_d02_i_quests_illusion_dungeons_just_stop_talking_take_c_8dffe7: "Just stop talking, and take care of these."
  npc_override_com_d02_i_quests_illusion_dungeons_just_studying_they_could_538c58: "Just studying? They could've turned the entire continent into an unholy breeding ground!"
  npc_override_com_d02_i_quests_illusion_dungeons_ka_karu_d0b45a: "Ka.. Karu.."
  npc_override_com_d02_i_quests_illusion_dungeons_karu_don_t_too_sad_28643d: "Karu, don't be too sad.. You found me like this.."
  npc_override_com_d02_i_quests_illusion_dungeons_karu_how_hunt_today_3cccf1: "Karu.. How was the hunt today?"
  npc_override_com_d02_i_quests_illusion_dungeons_kill_f7af67: "Kill!"
  npc_override_com_d02_i_quests_illusion_dungeons_king_i_told_you_we_bd5be9: "King, I told you, we are not drinking from people anymore. And that's not a polite thing to say. I apologize on his behalf."
  npc_override_com_d02_i_quests_illusion_dungeons_king_s_enough_stop_tortu_3297b3: "King, that's enough. Stop torturing him."
  npc_override_com_d02_i_quests_illusion_dungeons_later_i_met_him_again_deb795: "Later, I met him again and we got close. He was my first real friend."
  npc_override_com_d02_i_quests_illusion_dungeons_leave_realm_3dfce4: "Leave this realm."
  npc_override_com_d02_i_quests_illusion_dungeons_leave_them_alone_they_re_50d675: "Leave them alone. They're reconciling with each other."
  npc_override_com_d02_i_quests_illusion_dungeons_let_me_go_you_i_e58eac: "Let me go with you. I want to stay with you until you fully recover."
  npc_override_com_d02_i_quests_illusion_dungeons_let_me_help_84023d: "Let me help."
  npc_override_com_d02_i_quests_illusion_dungeons_let_me_notebook_a73304: "Let me have the notebook."
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_calm_down_try_120b7f: "Let's calm down, and try something else."
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_drink_one_77d45a: "Let's drink from this one."
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_go_back_80df61: "Let's go back."
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_go_north_23d6dd: "Let's go north!"
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_go_south_e934e9: "Let's go south!"
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_listen_now_ecb0a8: "Let's listen for now."
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_secure_place_first_107710: "Let's secure this place first."
  npc_override_com_d02_i_quests_illusion_dungeons_let_s_use_scroll_yggdras_827498: "Let's use a scroll and a Yggdrasil leaf at the same time this time. I'll activate the scroll from here. You use the leaf from there."
  npc_override_com_d02_i_quests_illusion_dungeons_liar_liar_dd6f69: "Liar, liar."
  npc_override_com_d02_i_quests_illusion_dungeons_like_what_41f49b: "Like what?"
  npc_override_com_d02_i_quests_illusion_dungeons_long_long_time_ago_5bf97e: "And that was a long, long time ago."
  npc_override_com_d02_i_quests_illusion_dungeons_look_other_side_netherwo_a537d4: "Look at the other side of the Netherworld River."
  npc_override_com_d02_i_quests_illusion_dungeons_looking_expression_secon_b67f78: "Looking at the expression on the second's face, I see that the stranger has something to say? Youngest, let's go first."
  npc_override_com_d02_i_quests_illusion_dungeons_looks_like_stranger_if_i_b92d8c: "Looks like a stranger? If I remember correctly, I haven't seen that face in the neighborhood."
  npc_override_com_d02_i_quests_illusion_dungeons_lot_monsters_come_town_s_ff94d6: "A lot of monsters will come to this town soon. Don't die in vain and leave this place."
  npc_override_com_d02_i_quests_illusion_dungeons_make_into_pieces_7d9799: "Make into pieces!"
  npc_override_com_d02_i_quests_illusion_dungeons_maybe_i_should_crush_mix_34889e: "Maybe I should crush and mix these gemstones together, and see if I can use the mixture to separate the souls of the undead from their bodies."
  npc_override_com_d02_i_quests_illusion_dungeons_maybe_one_day_yes_1f2535: "Maybe one day, yes."
  npc_override_com_d02_i_quests_illusion_dungeons_maybe_we_should_send_som_bd3ecc: "Maybe we should send someone else."
  npc_override_com_d02_i_quests_illusion_dungeons_maybe_yggdrasil_leaves_k_aa27cd: "Maybe Yggdrasil leaves kill the undead."
  npc_override_com_d02_i_quests_illusion_dungeons_me_what_if_i_don_87c149: "Me? What if I don't want to?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_angry_11fbdf: "Angry Dracula: Bomi needs rest. I'll deal with you!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_angry_12e00e: "Angry Dracula: Leave Bomi alone! Fight me instead!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_angry_aa2f6c: "Angry Dracula: It's about time for Bomi to wake up. Humans, don't forget your promise!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_angry_b75efd: "Angry Dracula: Who dares hurt my Bomi?!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_003414: "Archeologist Leiphen : After a long research expedition, I was able to have a few meals at the survey site.."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_0afdf2: "Archeologist Leiphen : Are you going to the Turtle Island to meet Narin? Let's hurry!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_0e070c: "Archeologist Leiphen : Narin's stuff...?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_27ebb4: "Archeologist Leiphen : H..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_35eb56: "Archeologist Leiphen : Is there another one?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_3d3974: "Archeologist Leiphen : See you tomorrow, Narin. and you."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_3d4234: "Archeologist Leiphen : O..Old GGhost?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_52c1f0: "Archeologist Leiphen : You said the nearest place is somewhere here? I'm all good. Show me the way!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_530eaa: "Archeologist Leiphen : Oh, you came back, {0}."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_65365b: "Archeologist Leiphen : I'm ready. There are a lot of interesting things around here."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_6537ff: "Archeologist Leiphen : How can I forget this place!?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_69beae: "Archeologist Leiphen : How did you know it was me?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_74b85b: "Archeologist Leiphen : Or you can carry me out..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_7b3de0: "Archeologist Leiphen : Oh, you came back. I was waiting."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_7b7044: "Archeologist Leiphen : Stomach growling..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_812f58: "Archeologist Leiphen : Then let me look around here for a while."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_977f19: "Archeologist Leiphen : Chewing on... Yuck... ??!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_9b54c2: "Archeologist Leiphen : Really? Some people?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_9e4572: "Archeologist Leiphen : Well, eating and sleeping were solved in Alberta. I got a decent accommodation."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_a01846: "Archeologist Leiphen : Hello, {0}."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_a2b75a: "Archeologist Leiphen : Is this the place? I've been here a few times..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_b2918b: "Archeologist Leiphen : Okay, see you again!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_bbb4c2: "Archeologist Leiphen : ......Oh, I thought I was going to die."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_cd16b6: "Archeologist Leiphen : Ugh, monster!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_d16c62: "Archeologist Leiphen : What does that mean?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_d70f3a: "Archeologist Leiphen : It... It's an {0}!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_e0bc5e: "Archeologist Leiphen : I am a professor of archeology."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_e557cd: "Archeologist Leiphen : This Turtle Island is, not the Turtle Island we know."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_archeologist_ec89ad: "Archeologist Leiphen : If {0} can sooth the entangled spirits, I'd like to talk with them someday. About this place..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_2165b9: "Aylvar : Ugh, it's the same wind like before. {0}, are you ok?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_376b70: "Aylvar : Really? Oh. Leiphen...!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_395a43: "Aylvar : He is a guy where research is more important than himself, so I want to stay closer to him."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_3da65b: "Aylvar : I saw it with my own eyes. It was right here."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_604ba4: "Aylvar : Leiphen, my friend... Please be safe."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_7e3f9d: "Aylvar : It's hard to explain, it's clearly a Turtle Island, but I got goose bumps."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_8df4de: "Aylvar : I'm not sure how, but I knew that I barely escaped with my life."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_a93a06: "Aylvar : Adventurer? Ah. It's you, {0}."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_bc99bb: "Aylvar : {0}, please be careful!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_d9b071: "Aylvar : I need your help. Please, quickly!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_ef9430: "Aylvar : Is there a way for me to go there?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_aylvar_fc4f3e: "Aylvar : Really? Good! Leiphen...!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_coughing_cc4be4: "Coughing young man: Cough Cough!!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_01dfd4: "Girl : You don't need to know, you are going to leave anyway..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_35a30f: "Girl : ......Think what you want."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_37240a: "Girl : If you don't expect, there's nothing to be disappoint about."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_60d5d8: "Girl : ......Are you here?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_645a58: "Girl : Don't breathe! Don't talk!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_689cb8: "Girl : Yes. Just... Go."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_7229bc: "Girl : What are you saying? I am the arrogant one?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_799b8c: "Girl : The piece will help you. Hold tight."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_bf6b06: "Girl : I'm just telling you because you're so persistent."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_d9db64: "Girl : That piece."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_girl_fb6e68: "Girl : You don't need to know. You shouldn't be here. There are things you shouldn't know."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_ktullanux_7cd0ef: "Ktullanux: I'll... be... back..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_ktullanux_e5fc70: "Ktullanux: Who dares call me a lizard? I'll freeze you all!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_leiphen_a3dd26: "Leiphen: I'm Leiphen, a professor of archeology at Juno."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_mirko_2feba1: "Mirko: Hey, then should I go or the adventurer who just showed up?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_mirko_bca03c: "Mirko: Don't go if you're going to be that angry..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_18f9c9: "Narin : Yes, turtle shell, my sculpture."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_3b3301: "Narin : No, don't. It is very dangerous here. Do not try to come back."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_4a8fbb: "Narin : ...Is it? In fact, I had it because it was pretty."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_68371d: "Narin : I was waiting as long as I can remember..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_68a72c: "Narin : And I am alone knowing and feeling who I am, what I am doing."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_693085: "Narin : I'm lucky, so sometimes I can get out, but eventually I go back and repeat."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_a86e30: "Narin : I did it for me. No need to say thanks."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_narin_fbcab6: "Narin : ......This is the end of my story. Now give me the pieces and you two will be going back.."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_019bfa: "{0} : Hey, you are the girl from before? What is it, a turtle shell?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_07d4bb: "{0} : He's...a strange man."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_0aca63: "{0} : Hey, hello?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_13e342: "{0} : What do you mean?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_160627: "{0} : ...You got betrayed?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_1bcc1a: "{0} : I will hunt the monster."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_1f9ed6: "{0} : ... {1}?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_22fc0a: "{0} : ..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_2591ce: "{0} : Are you talking about Dracula? I've heard of him."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_26f4a5: "{0} : Look out, it's dangerous!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_286b94: "{0} : Aylvar sent me to look for you. I'm adventurer {1}."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_292cf2: "{0} : Yes, I'm ready!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_2b6c11: "{0} : Please, we do care. Archeologist Leiphen and myself will meet your expectations."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_330e05: "{0} : Okay... Let's go together?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_38cc46: "{0} : Don't you have a class?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_3b9271: "{0} : This... It must be an old memory of the notebook's owner."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_3ffd34: "{0} : I hunted the monsters by the type but all I got was rotten. I brought only {1}."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_4097c6: "{0} : Even though it's so dangerous, you can't resist curiosity... Be careful anyway."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_481aac: "?????? : This world!!!!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_4da3b3: "{0} : I'd better look for Jojo."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_5d2d42: "{0} : This place is too dangerous for Novices like you. You'd better leave as soon as possible."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_5fe0cc: "{0} : I think it's hard for you to go there."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_6551da: "{0} : ......"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_684738: "{0} : ...Excuse me?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_693937: "{0} : Seems like you still need me. Did you call me? I didn't hear clearly, can you tell me again?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_694dff: "{0} : Hum... Hey, hello?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_6a3382: "{0} : ...You are an implacable scholar after all."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_6ae4d6: "{0} : How.. can I help you?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_727446: "{0} : Umm, I saw some people here."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_752ae8: "{0} : ...It's too bad. Leiphen, the flesh of the hunted monster is all rotten.."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_77e786: "{0} : Uh, what was that??"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_79b160: "{0} : Typical wizard... Wait, could that be Jojo??"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_7a473b: "{0} : I thought it would be difficult to communicate... Let's go to the other people?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_7dfa99: "{0} : I'll help. Let me share some food. Are there any animals I can hunt around?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_7f4bfd: "{0} : I heard you were missing for half a day..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_7ff3b4: "{0} : We must remember."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_812bcc: "{0} : You want me to hunt?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_858663: "{0} : Nightmares, mushrooms, zombies..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_869ec8: "{0} : No matter how much I hunt all I got is rotten meat."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_8af8fa: "{0} : !"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_8d3b49: "{0} : But, there are some weird people. I'm not sure we can talk..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_8fe760: "{0} : You said you want to save all life. If you haven't given up on that wish, you can surely remember it."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_91454b: "?????? : Forget the shameful past of being trapped in the dark and damp ground."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_91c181: "{0} : I'm glad that I found someone who can speak."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_943027: "{0} : Oh. That's why you were studying the zombies in these catacombs."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_95efc5: "{0} : We will come back. Do not feel alone."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_96cc18: "{0} : You are always here."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_98c5d6: "{0} : Dr. Leiphen! You are Archeologist Leiphen, right?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_9b691a: "{0} : Well, this is the woman here, Professor Leiphen."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_9e0c8f: "{0} : Did he lose his baby...?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_a25f7b: "{0} : Come back here?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_a60c2e: "{0} : If you forget us, we will remind you. As much as you forget."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_abd54c: "{0} : Yes. Just right here. Hello, are you ok?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_ad0f95: "?????? : Will not stop the invasion!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_aec2c5: "{0} : We don't have a choice, just believe her. Let's go upward!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_b37c96: "{0} : I am ok. I found Archeologist Leiphen."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_b3da29: "{0} : Please, we do care. I will be glad when I get back again. I will be sad if you are cold when I come here again."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_b3e373: "{0} : But you still remember the turtle shell pieces. You can remember again."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_b983f1: "{0} : It's ok, Professor."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_c6e08e: "{0} : I am here too. Are you doing well?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_c771f0: "{0} : I came back. I finished the hunting."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_c7db92: "{0} : Looking at the happiness she gets with {1}.... I feel sorry."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_cb163a: "{0} : Well, then you are going back for now? Let me guide you out..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_cd8806: "{0} : Who are you? How do you know him? Where am I?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_d42db3: "{0} : Khahris!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_d5d1fa: "{0} : Oops, are you ok?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_d89486: "{0} : ...It smells rotten..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_da13c6: "?????? : Until the day they are at our feet, us Nazarians!!!!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_dcc767: "{0} : Let me go hunt more."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_de648e: "{0} : ....How many monsters do you need me to hunt?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_dee177: "{0} : What does it mean? It didn't seem like the normal Turtle Island?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_e30d49: "{0} : I'll help you when you feel lonely. You won't have to forget everything."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_e70278: "{0} : You mean, you want us to return home."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_e94782: "{0} : Who are you? This piece did something? Where am I? How did I get here?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_ebd8de: "?????? : ...oh...ahah..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_ed75d9: "{0} : It's ok, Archeologist Leiphen's location seems to be where I went."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_eef715: "{0} : You said you want me to carry you out...?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_f095bb: "{0} : It's all rotten meat."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_f29fc0: "{0} : Of course. And if it doesn't work, we'll come back to try again and again."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_f2c1c6: "{0} : Ugh, it'll be difficult to stay much longer. Need to avoid."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_f4f0d4: "{0} : I have something to do here."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_f7b482: "{0} : Haha... I can't communicate... I want to go home."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_fa208a: "?????? : This land!!!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_fc4cf8: "{0} : Hey? What's going on?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_fc7b6a: "{0} : It's ok. We are here again."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_fe470d: "{0} : Ugh! You are not a kid. It's dangerous here. Stop wandering around!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_fed42e: "{0} : What's this?"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_options_ffe7bc: "?????? : Mmmhahahahahahahahahaha!!!!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_steven_051ecd: "Steven: What an idiot!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_steven_183ed8: "Steven: Can't you let me go?!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_steven_19aff5: "Steven: Air worse than in the mine..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_steven_799c89: "Steven: Ugh... nagging..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_steven_9dad0e: "Steven: Please."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_teddy_88e78f: "Teddy Bear: Let's Run!!!!"
  npc_override_com_d02_i_quests_illusion_dungeons_menu_teddy_f04d8c: "Teddy Bear: What have you done to me..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_white_522f96: "White Teddy Bear: Ah... dear Charlotte... to be in a place like this..."
  npc_override_com_d02_i_quests_illusion_dungeons_menu_white_991c58: "White Teddy Bear: Caught, I got caught!"
