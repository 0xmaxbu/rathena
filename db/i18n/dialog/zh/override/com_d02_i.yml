Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_com_d02_i_quests_illusion_dungeons_aagh_s_attack_monsters_c_2a1d11: "Aagh!! It's an attack. Monsters are coming from all sides."
  npc_override_com_d02_i_quests_illusion_dungeons_above_all_i_ll_giving_9f0265: "Above all, I'll be giving up on myself, and I can't do that."
  npc_override_com_d02_i_quests_illusion_dungeons_adventurer_2439c4: "Adventurer?"
  npc_override_com_d02_i_quests_illusion_dungeons_adventurer_i_m_just_part_bc1c02: "Adventurer. I'm just part of the perception error built in when Briaschen came in here."
  npc_override_com_d02_i_quests_illusion_dungeons_after_they_go_away_they_755946: "After they go away. They'll kill us if we move now."
  npc_override_com_d02_i_quests_illusion_dungeons_ah_adventurer_wait_d60a79: "Ah, Adventurer! Wait!"
  npc_override_com_d02_i_quests_illusion_dungeons_ah_ah_aaahhh_276087: "Ah... Ah... Aaahhh..."
  npc_override_com_d02_i_quests_illusion_dungeons_ah_died_fd0023: "Ah, it died!"
  npc_override_com_d02_i_quests_illusion_dungeons_ah_ha_i_found_46c089: "Ah-ha, I found."
  npc_override_com_d02_i_quests_illusion_dungeons_ah_i_m_sorry_aww_050fcc: "Ah, I'm sorry! Aww, this is just too creepy. Just kill me already. I can't watch the dreams you show me anymore."
  npc_override_com_d02_i_quests_illusion_dungeons_ah_karu_my_husband_sa_8ab9d1: "Ah.. Karu.. My husband.. Sa.."
  npc_override_com_d02_i_quests_illusion_dungeons_ah_what_we_they_re_ba397d: "Ah, what do we do? They're stronger than I thought."
  npc_override_com_d02_i_quests_illusion_dungeons_ah_you_stranger_i_saw_9617d5: "Ah! You? The stranger I saw last time!! Are you still here? I'm sure I'll..."
  npc_override_com_d02_i_quests_illusion_dungeons_ahahahahahahahahahahahah_233524: "Ahahahahahahahahahahahahahahahaha"
  npc_override_com_d02_i_quests_illusion_dungeons_ahh_asudem_why_why_my_4a02aa: "Ahh! Asudem, why? Why? My... how did I find you..."
  npc_override_com_d02_i_quests_illusion_dungeons_ahha_ahahaha_haha_cc58a7: "Ahha, Ahahaha, haha..."
  npc_override_com_d02_i_quests_illusion_dungeons_ahha_ha_boohoo_4c8425: "Ahha... ha... boohoo..."
  npc_override_com_d02_i_quests_illusion_dungeons_ahhh_ahhhhh_cf3a81: "Ahhh... Ahhhhh!!"
  npc_override_com_d02_i_quests_illusion_dungeons_all_17653d: "^0000CD{0}, {1}, {2}, {3}, ^000000ALL?"
  npc_override_com_d02_i_quests_illusion_dungeons_all_energy_sealed_inside_9b610d: "All the energy that was sealed inside the cave has been released, awakening Ktullanux."
  npc_override_com_d02_i_quests_illusion_dungeons_all_here_dead_006d6f: "All here are dead."
  npc_override_com_d02_i_quests_illusion_dungeons_all_us_made_same_d4f15b: "Not all of us are made the same."
  npc_override_com_d02_i_quests_illusion_dungeons_all_you_no_longer_1df83d: "All.. you no longer.."
  npc_override_com_d02_i_quests_illusion_dungeons_am_i_bat_3d60ef: "Am I a bat?"
  npc_override_com_d02_i_quests_illusion_dungeons_and_2f99a0: "^4d4dff{0}^000000, ^4d4dff{1}^000000, and ^4d4dff{2}^000000."
  npc_override_com_d02_i_quests_illusion_dungeons_and_7bf7b1: "And?"
  npc_override_com_d02_i_quests_illusion_dungeons_anyone_here_anyone_941d53: "Anyone here? Anyone...?"
  npc_override_com_d02_i_quests_illusion_dungeons_apparently_trying_your_b_69a44e: "Apparently, trying your best wasn't enough in this case."
  npc_override_com_d02_i_quests_illusion_dungeons_argh_come_f060cb: "Argh, come on!"
  npc_override_com_d02_i_quests_illusion_dungeons_argh_why_you_being_so_2ceb79: "Argh! Why are you being so stubborn? I don't deserve this!"
  npc_override_com_d02_i_quests_illusion_dungeons_arghhhhh_cef378: "Arghhhhh-!"
  npc_override_com_d02_i_quests_illusion_dungeons_arrgghh_cf286c: "Arrgghh-!"
  npc_override_com_d02_i_quests_illusion_dungeons_as_always_5da9af: "As always."
  npc_override_com_d02_i_quests_illusion_dungeons_asudem_2dfc3f: "Asudem!!!!!!!!!!!!!!!"
  npc_override_com_d02_i_quests_illusion_dungeons_bad_really_bad_e70697: "This is bad, really bad!"
  npc_override_com_d02_i_quests_illusion_dungeons_bah_75b92a: "Bah!"
  npc_override_com_d02_i_quests_illusion_dungeons_bomi_falling_into_long_d_f92034: "Bomi is falling into a long, deep sleep."
  npc_override_com_d02_i_quests_illusion_dungeons_bomi_stirring_her_long_d_346dca: "Bomi is stirring from her long, deep sleep."
  npc_override_com_d02_i_quests_illusion_dungeons_boohoo_oh_god_i_m_5f5484: "Boohoo! Oh, God! I'm being treated so unfairly!"
  npc_override_com_d02_i_quests_illusion_dungeons_breathing_edde15: "Breathing!"
  npc_override_com_d02_i_quests_illusion_dungeons_briashen_i_m_sorry_i_9d8111: "Briashen. I'm sorry. I don't think we can go on adventures together anymore."
  npc_override_com_d02_i_quests_illusion_dungeons_brother_i_don_t_think_23b6ae: "Brother, I don't think you're dangerous. This isn't the time. Brother, let's go first."
  npc_override_com_d02_i_quests_illusion_dungeons_brother_i_m_all_same_176a7f: "Brother.. I'm all the same.."
  npc_override_com_d02_i_quests_illusion_dungeons_brother_s_big_deal_ma_873de3: "Brother! It's a big deal. Ma.. The smell of blood comes from the village."
  npc_override_com_d02_i_quests_illusion_dungeons_brother_you_all_right_fd1a4a: "Brother, are you all right?"
  npc_override_com_d02_i_quests_illusion_dungeons_brother_you_ready_you_le_658f21: "Brother? Are you ready? Are you leaving soon? Time is running out."
  npc_override_com_d02_i_quests_illusion_dungeons_brothers_looks_like_hunt_370fe7: "Brothers, it looks like the hunt went well this time."
  npc_override_com_d02_i_quests_illusion_dungeons_brothers_there_s_someone_cfd74c: "Brothers, there's someone over there. A stranger?"
  npc_override_com_d02_i_quests_illusion_dungeons_bye_749de5: "Bye!"
  npc_override_com_d02_i_quests_illusion_dungeons_careless_klutz_48d9df: "That careless klutz!"
  npc_override_com_d02_i_quests_illusion_dungeons_catch_1af789: "Catch!"
  npc_override_com_d02_i_quests_illusion_dungeons_cheap_where_twins_they_s_35e956: "Cheap... where are the twins? They should be there..."
  npc_override_com_d02_i_quests_illusion_dungeons_chief_what_about_village_7e5859: "Chief, what about the villagers captured by the monsters? They already..."
  npc_override_com_d02_i_quests_illusion_dungeons_chunghae_29df75: "Chunghae!"
  npc_override_com_d02_i_quests_illusion_dungeons_come_what_3ebf9c: "Come on, what?"
  npc_override_com_d02_i_quests_illusion_dungeons_d_don_t_touch_anything_89fe4b: "D-Don't touch anything!"
  npc_override_com_d02_i_quests_illusion_dungeons_did_she_tell_you_anythin_39470a: "Did she tell you anything about... me?"
  npc_override_com_d02_i_quests_illusion_dungeons_did_twins_find_out_leave_5648b6: "Did the twins find out and leave? Be patient.. They'll be back soon.."
  npc_override_com_d02_i_quests_illusion_dungeons_did_vampire_call_help_5b0fb9: "Did the vampire call for help?"
  npc_override_com_d02_i_quests_illusion_dungeons_did_we_fail_again_67cb5e: "Did we fail again?"
  npc_override_com_d02_i_quests_illusion_dungeons_did_you_just_compare_me_fc26c3: "Did you just compare me to zombies?"
  npc_override_com_d02_i_quests_illusion_dungeons_did_you_wait_did_you_7f1f48: "Did you wait? Did you wait for me?"
  npc_override_com_d02_i_quests_illusion_dungeons_die_4c1646: "Die!"
  npc_override_com_d02_i_quests_illusion_dungeons_die_511d96: "DIE!!!"
  npc_override_com_d02_i_quests_illusion_dungeons_dieee_1b40f5: "DIEEE!"
  npc_override_com_d02_i_quests_illusion_dungeons_different_other_two_time_195362: "It was different from the other two times I performed the ritual."
  npc_override_com_d02_i_quests_illusion_dungeons_disappeared_b5f2c4: "Disappeared!"
  npc_override_com_d02_i_quests_illusion_dungeons_doesn_t_work_703808: "It doesn't work."
  npc_override_com_d02_i_quests_illusion_dungeons_don_t_look_them_they_036130: "Don't. Look at them. They're not normal. Happy will probably chew on you instead of his chew toy."
  npc_override_com_d02_i_quests_illusion_dungeons_don_t_talk_negatively_ev_40c114: "Don't talk negatively. Everyone's alive. Cancer isn't alive..."
  npc_override_com_d02_i_quests_illusion_dungeons_don_t_you_feel_energy_568e7d: "Don't you feel the energy in the air?"
  npc_override_com_d02_i_quests_illusion_dungeons_dracula_how_you_feeling_6f8fe7: "Dracula, how are you feeling?"
  npc_override_com_d02_i_quests_illusion_dungeons_elder_jaegyom_nightmares_35f074: "Elder Jaegyom, nightmares weren't the only thing occurred to me this time."
  npc_override_com_d02_i_quests_illusion_dungeons_enough_lecturing_get_poi_4998ac: "Enough with the lecturing. Get to the point already."
  npc_override_com_d02_i_quests_illusion_dungeons_even_if_you_i_won_2e7121: "Even if you do, I won't hear it."
  npc_override_com_d02_i_quests_illusion_dungeons_even_if_you_re_turned_b63d53: "Even if you're turned, you'll still be you."
  npc_override_com_d02_i_quests_illusion_dungeons_everyone_gave_up_after_f_046dc0: "Everyone gave up after the first try. You did it three times."
  npc_override_com_d02_i_quests_illusion_dungeons_everything_cause_effect_45efdf: "Everything has a cause and effect. How can you expect the adventurer to understand what this is about without knowing the cause?"
  npc_override_com_d02_i_quests_illusion_dungeons_farther_east_we_re_almos_6f8b9b: "Farther east! We're almost there!"
  npc_override_com_d02_i_quests_illusion_dungeons_father_grimm_could_you_s_856286: "Father Grimm, could you stop cutting in?"
  npc_override_com_d02_i_quests_illusion_dungeons_felt_as_if_nightmares_ha_80a16a: "It felt as if the nightmares is happening in reality."
  npc_override_com_d02_i_quests_illusion_dungeons_first_let_s_what_i_408bcc: "First, let's do what I can. Huh? You?"
  npc_override_com_d02_i_quests_illusion_dungeons_fly_other_side_river_22fb5f: "Fly to the other side of the river."
  npc_override_com_d02_i_quests_illusion_dungeons_forty_eighth_attempt_now_56ffd2: "This is the forty-eighth attempt. Now, let me sprinkle holy water."
  npc_override_com_d02_i_quests_illusion_dungeons_found_alive_c7ed56: "Found alive."
  npc_override_com_d02_i_quests_illusion_dungeons_gasp_what_hell_you_0034cc: "*Gasp* What the hell are you?!"
  npc_override_com_d02_i_quests_illusion_dungeons_get_down_6582f4: "Get down!"
  npc_override_com_d02_i_quests_illusion_dungeons_giving_up_my_humanity_et_160a17: "Giving up my humanity for eternal life goes against my beliefs, all my hard work up till now, and everything I tried hard to protect."
  npc_override_com_d02_i_quests_illusion_dungeons_glances_mojo_f12353: "*Glances at Mojo*"
  npc_override_com_d02_i_quests_illusion_dungeons_go_ahead_b1f554: "Go ahead."
  npc_override_com_d02_i_quests_illusion_dungeons_gone_completely_gone_a1edcf: "Gone. Completely gone!"
  npc_override_com_d02_i_quests_illusion_dungeons_gone_living_people_17244a: "Gone. The living people."
  npc_override_com_d02_i_quests_illusion_dungeons_good_because_you_don_t_e900e7: "Good, because you don't want to make me angry."
  npc_override_com_d02_i_quests_illusion_dungeons_grr_f79692: "Grr..."
  npc_override_com_d02_i_quests_illusion_dungeons_grrgghh_7b3cf4: "Grrgghh..."
  npc_override_com_d02_i_quests_illusion_dungeons_grrrr_40cb14: "GRRRR!"
  npc_override_com_d02_i_quests_illusion_dungeons_guillotine_fist_283a29: "Guillotine Fist!"
  npc_override_com_d02_i_quests_illusion_dungeons_h_help_i_don_t_acf5ef: "H-help!! I don't want to die!"
  npc_override_com_d02_i_quests_illusion_dungeons_ha_ah_ah_too_cold_6ec8ea: "Ha-ah...ah, too cold.. I want to go back..."
  npc_override_com_d02_i_quests_illusion_dungeons_ha_chief_e24b8b: "Ha.. But Chief.."
  npc_override_com_d02_i_quests_illusion_dungeons_hahaha_asudem_no_honey_d_8ea74a: "Hahaha Asudem... No honey. Don't you trust my skills? I caught plenty this time as usual."
  npc_override_com_d02_i_quests_illusion_dungeons_hahaha_nice_meet_you_i_d70c50: "Hahaha Nice to meet you. I don't know if you noticed, but my siblings are triplets."
  npc_override_com_d02_i_quests_illusion_dungeons_hahaha_s_only_one_day_9e65ff: "Hahaha, it's only one day. What's the big deal? Huh?!"
  npc_override_com_d02_i_quests_illusion_dungeons_he_really_worried_about_fa5d64: "He was really worried about you."
  npc_override_com_d02_i_quests_illusion_dungeons_he_s_human_humans_move_45abeb: "He's a human, and humans move in groups. He's going to bring his friends to attack us. Did you forget that already?"
  npc_override_com_d02_i_quests_illusion_dungeons_he_s_still_whispering_me_a36ae0: "He's still whispering that to me."
  npc_override_com_d02_i_quests_illusion_dungeons_he_s_such_hypocrite_i_25b3fd: "He's such a hypocrite. I can never trust priests again, and it's his fault."
  npc_override_com_d02_i_quests_illusion_dungeons_hehehe_other_times_i_d_d7d53f: "Hehehe Other times, I'd say it's crazy, but if we follow a strong leader..."
  npc_override_com_d02_i_quests_illusion_dungeons_hehehehe_i_hope_day_come_a3d0fc: "Hehehehe I hope that day will come soon..."
  npc_override_com_d02_i_quests_illusion_dungeons_hello_you_adventurer_how_77ece1: "Hello. Are you an adventurer? How old are you? Is this your first time in this place?"
  npc_override_com_d02_i_quests_illusion_dungeons_hey_adventurer_then_acce_40f080: "Hey, adventurer! Then accept the request! Okay?"
  npc_override_com_d02_i_quests_illusion_dungeons_hey_hey_hey_asudem_honey_ff65da: "Hey, hey, hey, Asudem... honey..."
  npc_override_com_d02_i_quests_illusion_dungeons_hey_stranger_look_me_sec_9b27c2: "Hey stranger, look at me for a second."
  npc_override_com_d02_i_quests_illusion_dungeons_hey_there_too_many_them_6af3a7: "Hey, there are too many of them! I told you to lure just one, not this many!"
  npc_override_com_d02_i_quests_illusion_dungeons_hey_you_bat_one_over_152f17: "Hey, you bat, the one over there! Are you also a vampire?"
  npc_override_com_d02_i_quests_illusion_dungeons_hmpf_you_should_worry_ab_815728: "Hmpf, you should worry about yourself, you're dying!"
  npc_override_com_d02_i_quests_illusion_dungeons_honey_let_s_go_i_61103d: "Honey, let's go, I think today's date is over. Hey, let's do some errands~ We'll get out of here..."
  npc_override_com_d02_i_quests_illusion_dungeons_honey_who_s_there_f1cd3f: "Honey? Who's there?"
  npc_override_com_d02_i_quests_illusion_dungeons_how_about_i_give_you_b80810: "How about I give you a gift in return for your favor? I know you want a strong body and longevity."
  npc_override_com_d02_i_quests_illusion_dungeons_how_could_23d707: "How could it be?"
  npc_override_com_d02_i_quests_illusion_dungeons_how_could_you_me_eae003: "How could you do this to me?!"
  npc_override_com_d02_i_quests_illusion_dungeons_how_different_64fa94: "How different?"
  npc_override_com_d02_i_quests_illusion_dungeons_how_i_catch_i_wish_c0ac58: "How can I catch it? I wish there was a way to take it to my lab..."
  npc_override_com_d02_i_quests_illusion_dungeons_how_wait_you_offering_no_050b95: "But how? Wait, are you offering...? No, thanks."
  npc_override_com_d02_i_quests_illusion_dungeons_huh_brother_over_there_i_945131: "Huh? Brother, over there.. I've seen him before."
  npc_override_com_d02_i_quests_illusion_dungeons_huh_s_you_again_don_3222b3: "Huh?! It's you again? Don't you think we see each other quite often? The other day someone was talking..."
  npc_override_com_d02_i_quests_illusion_dungeons_huh_then_how_i_investiga_3b59c8: "Huh? Then how do I investigate over there?"
  npc_override_com_d02_i_quests_illusion_dungeons_huh_what_should_i_as_26ffb2: "Huh.. What should I do... As Luanda advised, we have to escape to this place..."
  npc_override_com_d02_i_quests_illusion_dungeons_huh_why_am_i_telling_c288f2: "Huh? Why am I telling you this?"
  npc_override_com_d02_i_quests_illusion_dungeons_huh_you_haven_t_seen_543640: "Huh? You haven't seen it? Did you get caught up in your travels? Tsk tsk, you're out of luck.."
  npc_override_com_d02_i_quests_illusion_dungeons_huh_you_re_stranger_luan_442123: "Huh?! You're the stranger Luanda took an interest in on his way out hunting?"
  npc_override_com_d02_i_quests_illusion_dungeons_human_5de0b4: "A human?"
  npc_override_com_d02_i_quests_illusion_dungeons_human_you_blind_i_m_6ec280: "Human, are you blind? I'm not a bat."
  npc_override_com_d02_i_quests_illusion_dungeons_humans_die_eventually_so_91af39: "Humans die eventually. Is it so bad to die a little bit earlier? Come on, let's have a drink. This one doesn't smell good, though."
  npc_override_com_d02_i_quests_illusion_dungeons_humans_t_trusted_ever_c1db96: "Humans can't be trusted, ever."
  npc_override_com_d02_i_quests_illusion_dungeons_i_078130: "I was."
  npc_override_com_d02_i_quests_illusion_dungeons_i_agree_he_might_bring_3378c2: "I agree that he might bring his friends, but not all humans are untrustworthy."
  npc_override_com_d02_i_quests_illusion_dungeons_i_d_better_careful_i_91190d: "I'd better be careful. I don't want to die because I was gathering some mushroom spores."
  npc_override_com_d02_i_quests_illusion_dungeons_i_d_love_read_myself_4f762d: "I'd love to read it myself as well."
  npc_override_com_d02_i_quests_illusion_dungeons_i_disappeared_anyway_if_a856cc: "I would have disappeared anyway if Briashen didn't come, but thank you for coming to find me."
  npc_override_com_d02_i_quests_illusion_dungeons_i_don_t_know_acedd2: "I don't know."
  npc_override_com_d02_i_quests_illusion_dungeons_i_don_t_like_mirko_2840e6: "I don't like Mirko. I won't go."
  npc_override_com_d02_i_quests_illusion_dungeons_i_don_t_think_those_40e5c5: "I don't think those zombies have souls."
  npc_override_com_d02_i_quests_illusion_dungeons_i_draw_what_i_see_8bb435: "I draw what I see in my dreams, but... will the things I see really happen?"
  npc_override_com_d02_i_quests_illusion_dungeons_i_eat_anthing_now_please_3db5e8: "I can eat anthing now. Please give me something."
  npc_override_com_d02_i_quests_illusion_dungeons_i_find_them_d717d2: "I will find them!"
  npc_override_com_d02_i_quests_illusion_dungeons_i_found_36dec6: "I found."
  npc_override_com_d02_i_quests_illusion_dungeons_i_get_payback_they_took_e83b3e: "I will get payback... on... {0}... They took my treasure!"
  npc_override_com_d02_i_quests_illusion_dungeons_i_had_nothing_e973b9: "I had nothing to do with it."
  npc_override_com_d02_i_quests_illusion_dungeons_i_heard_only_master_luan_31a3f1: "I heard that only Master Luanda and Master Mao were running around this time? You lay on top of a tree and just shouted..."
  npc_override_com_d02_i_quests_illusion_dungeons_i_heard_stern_faced_seco_8ab0e4: "I heard that the stern-faced second warned you, but what a fearless outsider you are."
  npc_override_com_d02_i_quests_illusion_dungeons_i_i_don_t_want_bf5a66: "I do, but I don't want to give up my humanity for them."
  npc_override_com_d02_i_quests_illusion_dungeons_i_i_m_glad_cd39db: "I... I'm... glad..."
  npc_override_com_d02_i_quests_illusion_dungeons_i_i_m_still_wizard_819ae8: "I... I'm still a wizard!"
  npc_override_com_d02_i_quests_illusion_dungeons_i_ll_catch_up_soon_010300: "I'll catch up soon."
  npc_override_com_d02_i_quests_illusion_dungeons_i_ll_take_as_compliment_efcda4: "I'll take that as a compliment."
  npc_override_com_d02_i_quests_illusion_dungeons_i_ll_take_as_yes_8679d3: "I'll take that as a yes."
  npc_override_com_d02_i_quests_illusion_dungeons_i_look_like_novice_you_27f54f: "Do I look like a Novice? You're cute."
  npc_override_com_d02_i_quests_illusion_dungeons_i_m_bit_sane_now_0cdfbd: "I'm a bit sane now."
