  npc_override_com_d02_i_quests_illusion_dungeons_one_different_color_neon_86da98: "This one has a different color from Neon Mushrooms. Is it a new kind? I'd better pick it carefully..."
  npc_override_com_d02_i_quests_illusion_dungeons_one_us_search_while_othe_e4153b: "One of us can search while the other covers for them."
  npc_override_com_d02_i_quests_illusion_dungeons_ooh_i_m_going_studying_cda88a: "Ooh, I'm going to be studying with you breathing down my neck, how exciting!"
  npc_override_com_d02_i_quests_illusion_dungeons_our_bodies_don_t_need_02f03a: "But our bodies don't need souls for their survival. I still think those corpses are just?"
  npc_override_com_d02_i_quests_illusion_dungeons_outside_maybe_i_no_longe_3f6b13: "On the outside, maybe. But I will no longer fear death, and therefore have no desire to live."
  npc_override_com_d02_i_quests_illusion_dungeons_pains_me_see_you_wither_e5a2df: "It pains me to see you wither away, day by day."
