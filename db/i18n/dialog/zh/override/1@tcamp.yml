Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@tcamp_ThorGunsuBase_all_kinds_documents_all_077ba6: "各种文件都混在一起了。"
  npc_override_1@tcamp_ThorGunsuBase_all_weapons_firearms_the_bb6da5: "这些人丢弃的所有武器和火器，距离过期日期都还有不到一年的时间。"
  npc_override_1@tcamp_ThorGunsuBase_anyway_what_information_518b1d: "总之，你得到了什么信息？"
  npc_override_1@tcamp_ThorGunsuBase_as_expected_you_talented_c0e3c2: "果然，你很有天赋，冒险者。我用尽了所有的人脉才找到位置。"
  npc_override_1@tcamp_ThorGunsuBase_as_expected_your_skills_abac25: "果然，你的技能很好。我用尽了所有的人脉才找到位置，但你一下子就找到了。"
  npc_override_1@tcamp_ThorGunsuBase_better_proceed_caution_c904e3: "最好小心行事。"
  npc_override_1@tcamp_ThorGunsuBase_careful_explore_inside_173df6: "小心地探索里面。"
  npc_override_1@tcamp_ThorGunsuBase_document_weapon_sales_re_9da84b: "这份文件是武器销售记录。请给我看看。"
  npc_override_1@tcamp_ThorGunsuBase_even_date_very_recent_th_ec516b: "连日期都很近。还有记录显示将大量武器移交给了丹德林先生。"
  npc_override_1@tcamp_ThorGunsuBase_get_out_bag_put_your_5b30f5: "从包里拿出来。放到你头上。"
  npc_override_1@tcamp_ThorGunsuBase_how_did_you_adventurer_d_00cf83: "你和冒险者是怎么挖到这么深的？"
  npc_override_1@tcamp_ThorGunsuBase_i_also_something_deliver_0a2ea5: "我也有东西要送到拉赫，所以米里亚姆，我们一起去吧。"
  npc_override_1@tcamp_ThorGunsuBase_i_didn_t_know_miriam_c65949: "我不知道米里亚姆会在这里。对吧，冒险者？"
  npc_override_1@tcamp_ThorGunsuBase_i_guess_s_point_time_660c8d: "……但我想就是在这个时候。"
  npc_override_1@tcamp_ThorGunsuBase_i_ll_dig_little_deeper_37af68: "我还得再深入挖掘一下，但这只是我目前的猜测。"
  npc_override_1@tcamp_ThorGunsuBase_i_ll_relay_what_i_475693: "我得把发现的情况转告给我的养父。"
  npc_override_1@tcamp_ThorGunsuBase_i_tell_you_shortcut_get_81b4e0: "我会告诉你一条出去的捷径，所以冒险者，你能把在这里发现的情况告诉苏阿德吗？"
  npc_override_1@tcamp_ThorGunsuBase_i_think_s_isolated_corru_6d5a50: "我认为这是最低层级的孤立腐败事件，武器泄露事件。"
  npc_override_1@tcamp_ThorGunsuBase_i_took_one_out_middle_2ccebe: "我从中间抽了一张出来看……军事基地的警卫地图？"
  npc_override_1@tcamp_ThorGunsuBase_i_took_out_few_pages_62afca: "我从中间抽了几页，发现是武器过期日期和销售记录。"
  npc_override_1@tcamp_ThorGunsuBase_i_wondering_if_really_po_859e65: "我在想它是不是真的会在这种时候冒出来。"
  npc_override_1@tcamp_ThorGunsuBase_if_s_isolated_corruption_6cbd12: "如果是孤立腐败，有可能连我的养父都还不知道。"
  npc_override_1@tcamp_ThorGunsuBase_if_s_your_adoptive_fathe_eda4a0: "如果是你的养父，是阿马尔祭司吗？"
  npc_override_1@tcamp_ThorGunsuBase_if_weapon_properly_maint_9068e0: "如果武器没有得到妥善维护，可能无法正常运作。"
  npc_override_1@tcamp_ThorGunsuBase_if_you_get_caught_watcht_02e98b: "如果你被瞭望塔发现，士兵就会出现，所以小心别被发现。"
  npc_override_1@tcamp_ThorGunsuBase_if_you_get_caught_you_abf959: "如果你被发现了，可能会遭到攻击，所以如果无法突破，我们就在这里再见面。"
  npc_override_1@tcamp_ThorGunsuBase_intruder_detected_7d2d97: "检测到入侵者！！"
  npc_override_1@tcamp_ThorGunsuBase_intruder_found_intruder_c07953: "发现入侵者，发现入侵者。立即排除。"
  npc_override_1@tcamp_ThorGunsuBase_just_moment_i_m_reading_b53268: "……等一下，我正在看文件。"
  npc_override_1@tcamp_ThorGunsuBase_let_s_careful_caught_gua_92d541: "我们小心别被警卫发现，探索里面。"
  npc_override_1@tcamp_ThorGunsuBase_let_s_something_about_ri_eac709: "我们得做点什么，对吧，冒险者？"
  npc_override_1@tcamp_ThorGunsuBase_let_s_try_go_while_5c81c5: "我们尽量避开警卫塔，试着进去。"
  npc_override_1@tcamp_ThorGunsuBase_look_document_here_1b70db: "看看这里的文件。"
  npc_override_1@tcamp_ThorGunsuBase_looking_date_s_long_time_ec3a3f: "看日期，这是很久以前的文件。"
  npc_override_1@tcamp_ThorGunsuBase_looks_like_he_left_behin_4c3534: "看起来他只留下了不重要的文件。我们先处理掉它们。"
  npc_override_1@tcamp_ThorGunsuBase_looks_like_i_found_what_402d6d: "看来我找到了我要找的东西。我把文件收起来了。"
  npc_override_1@tcamp_ThorGunsuBase_looks_like_menu_been_set_663eca: "看起来菜单已经定好了，是浇了酱汁的炸鱼……"
  npc_override_1@tcamp_ThorGunsuBase_looks_like_you_found_adv_ab12a3: "看来你很快就找到了冒险者和玛拉姆。"
  npc_override_1@tcamp_ThorGunsuBase_menu_caution_f3b056: "^FF0000注意:如果你在地下城内进行任意处理，例如驯服怪物，将不被视为正常进度。^000000"
  npc_override_1@tcamp_ThorGunsuBase_menu_leader_4d6811: "队长: {0}"
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_06bdf1: "玛拉姆: 这栋楼看起来很可疑，对吧？这里面应该也有监控系统。"
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_7243a4: "玛拉姆: 看来我们深入得够深了。我们应该能安全地找到我们需要的东西。"
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_73dd24: "玛拉姆: 这次我们小心探索，注意别被发现。"
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_7d5d33: "玛拉姆: 哈，这真的很有趣。"
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_82fa20: "玛拉姆: 好了，我们现在可以通过了！"
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_9866db: "玛拉姆: 要不要祝你好运？"
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_ed59b2: "玛拉姆: 请稍等。我知道怎么打开它。"
  npc_override_1@tcamp_ThorGunsuBase_menu_miriam_7061ef: "米里亚姆: 哦，冒险者？玛拉姆，你也在这里！？"
  npc_override_1@tcamp_ThorGunsuBase_menu_party_328f2e: "队伍: {0}"
  npc_override_1@tcamp_ThorGunsuBase_msg_c77c95: "......."
  npc_override_1@tcamp_ThorGunsuBase_no_miriam_how_you_here_97f38c: "不，米里亚姆！你怎么在这里？"
  npc_override_1@tcamp_ThorGunsuBase_oh_please_give_me_docume_a454d5: "哦，请把文件给我。我会把它们作为证据。"
  npc_override_1@tcamp_ThorGunsuBase_one_military_bases_manag_a59684: "这是我养父管理的军事基地之一。"
  npc_override_1@tcamp_ThorGunsuBase_one_year_long_expiration_2710da: "一年不算长的过期日期，但也不算太紧。"
  npc_override_1@tcamp_ThorGunsuBase_only_member_party_enter_9eb530: "^ff0000只有队伍成员才能进入纪念地下城。^000000"
  npc_override_1@tcamp_ThorGunsuBase_party_entering_3748ac: "队伍 {1} 的 {0} 正在进入 {2}。"
  npc_override_1@tcamp_ThorGunsuBase_please_read_these_docume_f0d242: "请阅读这些文件。它们包含我们要找的东西。"
  npc_override_1@tcamp_ThorGunsuBase_quality_all_weapons_comi_f21094: "从后洞出来的所有武器质量都一样。"
  npc_override_1@tcamp_ThorGunsuBase_rather_than_having_me_ex_d5b283: "与其让我全部解释给你听，我觉得你亲自看看会更好。"
  npc_override_1@tcamp_ThorGunsuBase_really_isolated_case_cor_4261c6: "这真的是孤立腐败案件吗？这让我很困扰。"
  npc_override_1@tcamp_ThorGunsuBase_s_right_adventurer_when_cea166: "没错，冒险者。我看了账本，似乎我的养父并没有参与。"
  npc_override_1@tcamp_ThorGunsuBase_seems_like_real_deal_aft_ae5d0b: "看来这确实是真货。这里的安保跟之前的完全不同……"
  npc_override_1@tcamp_ThorGunsuBase_seems_like_you_haven_t_084150: "看来你还没有创建地下城。请稍后再检查。"
  npc_override_1@tcamp_ThorGunsuBase_still_what_i_gained_proc_bcc685: "不过，我在过程中获得的收获不同，所以我想这还是有意义的。"
  npc_override_1@tcamp_ThorGunsuBase_thank_you_coming_all_way_5a60f4: "感谢你远道而来。"
  npc_override_1@tcamp_ThorGunsuBase_then_i_guess_i_ll_42c344: "那我得离开一段时间了。"
  npc_override_1@tcamp_ThorGunsuBase_there_wouldn_t_been_need_0226c1: "本来没有必要立即处理掉。"
  npc_override_1@tcamp_ThorGunsuBase_they_moved_separately_en_d528ad: "他们分头行动，但最终到了同一个地方。"
  npc_override_1@tcamp_ThorGunsuBase_they_said_they_conduct_s_2fedef: "他们说他们会进行单独调查！"
  npc_override_1@tcamp_ThorGunsuBase_top_chapter_if_you_feed_4bdf4c: "最上面一章是……「如果你给岩浆灵喂一个土豆，然后过一会儿猎杀它，它应该掉落一个烤土豆吗？」"
  npc_override_1@tcamp_ThorGunsuBase_top_page_battle_decide_m_3e74c9: "最上面一页……是决定午餐菜单的战斗吗？"
  npc_override_1@tcamp_ThorGunsuBase_try_move_away_security_g_bd5351: "尽量远离警卫的视线。"
  npc_override_1@tcamp_ThorGunsuBase_unknown_error_0aeb9e: "^0000ff{0} ^000000- 未知错误"
  npc_override_1@tcamp_ThorGunsuBase_unknown_error_occurred_285cc7: "^ff0000发生了未知错误。^000000"
  npc_override_1@tcamp_ThorGunsuBase_we_follow_shortly_so_ple_0e6356: "我们很快会跟上，所以请你先去告诉我们。"
  npc_override_1@tcamp_ThorGunsuBase_well_if_you_find_anythin_05d695: "好吧，如果你发现了什么，请联系我！"
  npc_override_1@tcamp_ThorGunsuBase_what_i_heard_dandelion_e_f5dabb: "根据我之前从丹德林那里听到的，人不多，但到处都有瞭望塔，监控范围相当广。"
  npc_override_1@tcamp_ThorGunsuBase_what_kind_picture_s_real_fa8bb8: "这是什么画？而且画得真的很好……"
  npc_override_1@tcamp_ThorGunsuBase_when_application_complet_acead6: "申请完成后，再次跟我谈话并选择 ^0000CD{0} 进入^000000"
  npc_override_1@tcamp_ThorGunsuBase_when_i_pulled_one_out_e3975b: "当我从中间抽了一张出来……我发现了一幅用教皇饼干糖霜画的教皇插图。"
  npc_override_1@tcamp_ThorGunsuBase_why_did_pour_out_moment_1e38ff: "为什么在我们准备抗议的时候，它突然涌出来了？"
  npc_override_1@tcamp_ThorGunsuBase_why_here_i_m_curious_d6df46: "……为什么这个会在这里？但我对结果很好奇！"
  npc_override_1@tcamp_ThorGunsuBase_you_sell_weapons_like_so_91052a: "你们就这样肆无忌惮地卖武器。"
  npc_override_1@tcamp_ThorGunsuBase_you_ve_arrived_adventure_2ecff2: "你到了，冒险者！"
