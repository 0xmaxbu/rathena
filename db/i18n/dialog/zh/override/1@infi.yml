Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@infi_InfiniteSpace_ah_no_i_didn_t_446c09: "啊，不，我不是故意进去的。我不是故意违反任何法律的。"
  npc_override_1@infi_InfiniteSpace_all_right_just_one_thing_0ba845: "好吧，只有一件事，我是个没经验的新手冒险者。所以我会从安全的地方指引你，帮你探索下面。"
  npc_override_1@infi_InfiniteSpace_because_its_depth_seemin_6c23a3: "因为它的深度似乎无穷无尽，这里的人们开始害怕这个地方，把它叫做无限空间。"
  npc_override_1@infi_InfiniteSpace_boss_monster_trying_summ_08e8fd: "首领怪物正在试图召唤它的同伴。"
  npc_override_1@infi_InfiniteSpace_good_shall_we_go_now_79884b: "好。我们现在出发吗？"
  npc_override_1@infi_InfiniteSpace_ha_d228a2: "哈？"
  npc_override_1@infi_InfiniteSpace_hmm_you_one_royal_palace_9ca481: "嗯，你是王宫的镇压部队成员吗？"
  npc_override_1@infi_InfiniteSpace_i_know_some_people_who_bf9b07: "我认识一些偷偷溜进去发财的人。这就是我想试一试的原因，你有兴趣吗？"
  npc_override_1@infi_InfiniteSpace_i_ll_keep_separate_recor_666eee: "我会单独记录这次探险。如果你运气好的话，可能会从探险中获得不错的奖励。"
  npc_override_1@infi_InfiniteSpace_i_m_adventure_tour_you_1b53fb: "我是探险向导，你可以自己探索。我们不是挺般配的吗？那么，你准备好了我们就开始。"
  npc_override_1@infi_InfiniteSpace_i_m_just_ordinary_woman_184d13: "我只是个出来散步的普通女人。这就是我的散步终点，我正要……"
  npc_override_1@infi_InfiniteSpace_i_m_ordinary_adventurer_7ecdd3: "我是个普通的冒险者。"
  npc_override_1@infi_InfiniteSpace_i_ve_never_soon_you_fe7342: "我以前从没见过你，所以以为你是王宫的镇压部队成员。"
  npc_override_1@infi_InfiniteSpace_i_went_out_place_many_b5719c: "我进进出出这个地方很多次，找到了激怒里面怪物的方法。如果你能对付愤怒状态的怪物，就能获得更丰厚的奖励。"
  npc_override_1@infi_InfiniteSpace_menu_i_1070b7: "我没兴趣。:是。"
  npc_override_1@infi_InfiniteSpace_menu_i_87d1a6: "我想正常进行:我想进行一些困难的挑战"
  npc_override_1@infi_InfiniteSpace_menu_prepare_148ae7: "准备进入无限空间:取消"
  npc_override_1@infi_InfiniteSpace_menu_reckless_025fb5: "鲁莽的探险家：看来这里没有别的路了。很危险，你最好回到外面去。"
  npc_override_1@infi_InfiniteSpace_menu_reckless_34c0dd: "鲁莽的探险家：这个区域是安全的。使用通道前往下一个区域。"
  npc_override_1@infi_InfiniteSpace_menu_reckless_7c9dea: "鲁莽的探险家：嗯~看起来很危险，所以我先回去了。我从上面给你指引方向。"
  npc_override_1@infi_InfiniteSpace_menu_reckless_9078c6: "鲁莽的探险家：哦，你听到什么声音了吗？"
  npc_override_1@infi_InfiniteSpace_menu_reckless_a46a42: "鲁莽的探险家：这个区域是安全的。穿过通道前往下一个区域。"
  npc_override_1@infi_InfiniteSpace_menu_reckless_a648d4: "鲁莽的探险家：哦，那一定是盘踞在这里的怪物。"
  npc_override_1@infi_InfiniteSpace_menu_reckless_cd9360: "鲁莽的探险家：哇哦~对于一个沉没的地方来说，这里很整洁，你不觉得吗？"
  npc_override_1@infi_InfiniteSpace_menu_reckless_e5a83d: "鲁莽的探险家：它们看起来和我们在外面看到的没什么不同，但我能感受到非常强大的能量。"
  npc_override_1@infi_InfiniteSpace_menu_reckless_fb47f0: "鲁莽的探险家：我觉得这里更像是一处古代遗迹，而不是灯塔。这里太井然有序了……"
  npc_override_1@infi_InfiniteSpace_menu_what_422da3: "如果我是镇压部队成员呢？:有什么事？"
  npc_override_1@infi_InfiniteSpace_oh_your_whole_body_shout_0c6afa: "哦，你的全身都在喊累了。你不能这样下去的。"
  npc_override_1@infi_InfiniteSpace_once_passage_opens_take_348f75: "通道开启后，先休息一会儿，然后再跟我对话。"
  npc_override_1@infi_InfiniteSpace_paros_lighthouse_here_co_1d69b5: "这里的帕罗斯灯塔不久前因不明原因倒塌了，下面有很多东西。"
  npc_override_1@infi_InfiniteSpace_passage_yet_activated_95e226: "通道尚未激活。"
  npc_override_1@infi_InfiniteSpace_phew_s_relief_9a9ddf: "呼~真是松了口气。"
  npc_override_1@infi_InfiniteSpace_please_note_any_abnormal_3139a0: "^FF0000请注意，在副本内进行任何异常的怪物处理（如驯养）均不被视为正常行为，可能会妨碍副本进度。^000000"
  npc_override_1@infi_InfiniteSpace_reservation_instance_fai_f7a70c: "由于存在进行中的副本，'{0}'的预约失败了。"
  npc_override_1@infi_InfiniteSpace_s_impossible_alone_you_l_6286fc: "一个人是不可能的。你想组建至少一人的队伍，还是加入其他队伍后再来？"
  npc_override_1@infi_InfiniteSpace_s_unfortunate_come_back_0a9c8c: "真可惜。如果你改变主意随时回来。我随时欢迎你。"
  npc_override_1@infi_InfiniteSpace_she_moved_close_me_2e9aed: "^777700（她靠近了我）^000000"
  npc_override_1@infi_InfiniteSpace_so_shall_we_get_out_b0d9c1: "那么，我们要离开这里吗？"
  npc_override_1@infi_InfiniteSpace_some_restoration_workers_e2ca4a: "一些派往王宫的修复工人和守卫失踪了。有传言说怪物在下面爬行。"
  npc_override_1@infi_InfiniteSpace_what_you_talking_about_fb4e69: "你在说什么？"
  npc_override_1@infi_InfiniteSpace_what_you_think_you_like_ff56b7: "你觉得怎么样？你想尝试一些有挑战性的事情吗？"
  npc_override_1@infi_InfiniteSpace_you_come_back_me_after_e9d84f: "你能变强一点后再来找我吗？先到100级怎么样？"
  npc_override_1@infi_InfiniteSpace_you_going_there_again_ti_a5849b: "这次你还要进去吗？"
  npc_override_1@infi_InfiniteSpace_you_heard_about_paros_li_b9f7e7: "你听说过帕罗斯灯塔倒塌的事吗？"
