  npc_override_rebel_in_quests_16_2_you_look_quite_happy_a60418: "……但你看起来挺高兴的。"
  npc_override_rebel_in_quests_16_2_you_lost_book_you_borrow_918722: "你把借的书弄丢了吗？"
