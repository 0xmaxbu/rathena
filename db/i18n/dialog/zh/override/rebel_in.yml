  npc_override_rebel_in_quests_16_2_we_meet_again_if_necessa_29cc43: "如果有必要，我们会再见。"
  npc_override_rebel_in_quests_16_2_we_met_today_first_time_dbd379: "我们今天第一次见面，但我想我们从现在起会成为朋友。所以你可以叫我维罗。"
  npc_override_rebel_in_quests_16_2_we_middle_mission_s_alre_1d35c9: "但我们在执行任务中。已经开始了。这有点像紧急情况。所以我们必须保持紧张。"
  npc_override_rebel_in_quests_16_2_we_much_younger_compared_f0f525: "和这里的其他人相比，我们也没年轻多少。多几岁有什么区别？"
