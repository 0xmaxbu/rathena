  npc_override_rebel_in_quests_16_2_my_age_only_pleasure_bat_628a23: "在我这个年纪……唯一的乐趣就是坐在温暖的地方晒太阳。"
  npc_override_rebel_in_quests_16_2_my_brain_cells_already_k_78b1dc: "我的脑细胞已经知道你会接受它。"
  npc_override_rebel_in_quests_16_2_my_brothers_helped_my_pa_07f956: "我的兄弟们帮助了我的父母。如你所见，我很小，小时候经常生病。"
  npc_override_rebel_in_quests_16_2_my_critical_costume_i_pr_88ff05: "这是我为这次任务准备的关键服装。谁会怀疑一个游客？"
  npc_override_rebel_in_quests_16_2_my_dear_come_back_if_cd8fb7: "亲爱的，如果你想我了就回来！"
  npc_override_rebel_in_quests_16_2_my_dear_you_leaving_me_d98463: "亲爱的，你要离开我吗？我在寒冷的天气中受苦！"
  npc_override_rebel_in_quests_16_2_my_dear_you_re_late_3d3780: "亲爱的~~~你迟到了！我等了你很久了！你又带对了吗？我是说，柴火。"
  npc_override_rebel_in_quests_16_2_my_dear_you_so_kind_e39813: "亲爱的，你真善良可爱！但我明天可能要去执行任务。请不要失望！"
  npc_override_rebel_in_quests_16_2_my_father_concerned_he_t_d2e290: "我父亲会担心的。但他会像往常一样告诉我没关系。"
  npc_override_rebel_in_quests_16_2_my_feeling_right_such_th_097d82: "我的感觉是对的。这是很久以来最激动人心的战斗！"
  npc_override_rebel_in_quests_16_2_my_friend_told_me_hmm_fae856: "我的朋友告诉我的。嗯……我能做什么？冒险者，我能请你帮个忙吗？"
  npc_override_rebel_in_quests_16_2_my_god_s_amazing_you_a5ef96: "我的天……太神奇了。你在那么短的时间内收回了所有这些武器。他们到处藏了这么多武器。"
  npc_override_rebel_in_quests_16_2_my_god_seyren_windsor_60a7fa: "我的天……赛伦·温莎？"
  npc_override_rebel_in_quests_16_2_my_god_so_who_s_fd1c77: "我的天！那我的配偶是谁？"
  npc_override_rebel_in_quests_16_2_my_god_why_there_8d412f: "我的天。为什么它在那里……"
  npc_override_rebel_in_quests_16_2_my_god_you_dropped_him_d2131e: "我的天！你又把他摔了。别工作太辛苦。"
  npc_override_rebel_in_quests_16_2_my_god_you_re_least_d8c1ee: "我的天。你是我见过的最弱的冒险者。"
  npc_override_rebel_in_quests_16_2_my_heart_red_blood_belon_455883: "我流淌着红血的心属于教皇……"
  npc_override_rebel_in_quests_16_2_my_job_prevent_such_fool_61ab58: "我的工作就是防止这样的傻瓜做傻事。"
  npc_override_rebel_in_quests_16_2_my_lady_i_treasure_3c8eb1: "我的女士！！我必须珍惜它！！！"
  npc_override_rebel_in_quests_16_2_my_mistake_only_mine_als_3ab55f: "我的错误不只是我的。它也可能让每个小队成员陷入危险。每个人的安全比我的个人骄傲更重要。"
  npc_override_rebel_in_quests_16_2_my_name_3bddae: "{0}是我的名字。"
  npc_override_rebel_in_quests_16_2_my_name_philopontess_you_555f7d: "我的名字是菲洛庞特斯。你可以叫我苔丝。"
  npc_override_rebel_in_quests_16_2_my_opinion_i_think_s_da6be6: "在我看来，我认为我们最好被广阔的世界接受，而不是像这样生活在这里。"
  npc_override_rebel_in_quests_16_2_my_opinion_we_d_better_1520d7: "在我看来，我们最好制定一个计划，追踪被盗的^4d4dff泰拉·格洛里亚^000000的下落并收回它。"
  npc_override_rebel_in_quests_16_2_my_problem_too_4e3c42: "这也是我的问题。"
  npc_override_rebel_in_quests_16_2_my_request_could_you_ple_aafcc8: "这是我的请求。你能告诉我吗？"
  npc_override_rebel_in_quests_16_2_my_silly_sister_e27fcc: "我傻妹妹。"
  npc_override_rebel_in_quests_16_2_my_wife_children_passed_2a4231: "我的妻子和孩子已经去世了。"
  npc_override_rebel_in_quests_16_2_my_wife_who_passed_away_b7ca4b: "……还有我去世的妻子。"
  npc_override_rebel_in_quests_16_2_mystic_frozen_certainly_3ef345: "Mystic Frozen？当然它是一个水属性强的物品。没错。Mystic Frozen将足够强大以达到我们的目的。让我们试试。"
  npc_override_rebel_in_quests_16_2_mystic_frozen_certainly_a0957b: "Mystic Frozen？当然它是一个水属性强的物品。没错。Mystic Frozen将足够强大以达到我们的目的。但一两个不够。"
  npc_override_rebel_in_quests_16_2_mystic_frozen_location_c_cf1cc1: "Mystic Frozen。位置很明确，因为我用我们的特工检查过了。如果我们把你带来的Mystic Frozen砸成碎片……"
  npc_override_rebel_in_quests_16_2_mystic_frozen_water_attr_d498df: "而且Mystic Frozen是揭示里希塔乐镇装置所需的水属性石头。"
  npc_override_rebel_in_quests_16_2_naturally_you_talk_presi_f954d6: "当然，你必须和总统谈谈这个……很抱歉我们不得不以这种方式见你。"
  npc_override_rebel_in_quests_16_2_nearly_over_several_ingr_239f4c: "快完成了。但缺少几种配料。"
  npc_override_rebel_in_quests_16_2_nemi_been_angry_about_ma_e142b8: "内米一直对这些恶性库存很生气。如果你那样做，它们肯定会卖得很好。呵呵……"
  npc_override_rebel_in_quests_16_2_nemi_what_happened_gonie_67c3ea: "内米，怎么了？戈尼死了吗？"
  npc_override_rebel_in_quests_16_2_nerius_family_great_skil_edd3c5: "内利乌斯家族剑术高超。"
  npc_override_rebel_in_quests_16_2_never_happen_again_5fb952: "再也不会发生了……"
  npc_override_rebel_in_quests_16_2_never_i_am_impervious_sh_a15dca: "绝不！我不知羞耻，所以我会一直喊到他们出来！嘿！菜鸟！出来！出来！"
  npc_override_rebel_in_quests_16_2_nevertheless_first_one_a_d25aeb: "尽管如此，第一个总是很难，从第二个开始就简单了。现在让我们用传送消失吧……"
  npc_override_rebel_in_quests_16_2_newbies_we_don_t_know_e76a4c: "对于新手，我们不知道哪种枪适合他们。所以他们必须尝试很多不同的枪。"
  npc_override_rebel_in_quests_16_2_next_time_please_visit_n_b99ad1: "下次，请再次访问内利乌斯家族！"
  npc_override_rebel_in_quests_16_2_nice_meet_you_64753c: "很高兴见到你。"
  npc_override_rebel_in_quests_16_2_nice_meet_you_here_7b012b: "很高兴在这里见到你。"
  npc_override_rebel_in_quests_16_2_night_fishing_best_fishi_522399: "夜钓是所有钓鱼中最好的。水声、微光和夜晚独处的感觉。"
  npc_override_rebel_in_quests_16_2_nihil_he_said_he_come_c3310f: "是尼希尔。他说他会做完一切后来。"
  npc_override_rebel_in_quests_16_2_nihil_spica_participated_bf49c3: "尼希尔和斯皮卡参加了。"
  npc_override_rebel_in_quests_16_2_no_816c52: "不"
  npc_override_rebel_in_quests_16_2_no_according_my_experien_5ef5fe: "不。根据我到目前为止的经验，我买不到的东西都是没用的。"
