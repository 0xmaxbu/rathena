  npc_override_rebel_in_quests_16_2_you_need_schwartz_honor_ffc8d4: "你需要{0}{1}个施瓦尔特茨荣誉代币。"
  npc_override_rebel_in_quests_16_2_you_no_more_investigate_1164d9: "你没有更多要调查的了。你为什么一个人来，没有克鲁克斯？"
  npc_override_rebel_in_quests_16_2_you_okay_here_now_b702d1: "你现在在这里可以吗？"
