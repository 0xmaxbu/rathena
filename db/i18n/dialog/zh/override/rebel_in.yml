  npc_override_rebel_in_quests_16_2_we_doing_our_mutual_bene_262c2d: "我们这样做是为了我们的共同利益。"
  npc_override_rebel_in_quests_16_2_we_don_t_need_listen_95fa6c: "我们不需要再听了。"
  npc_override_rebel_in_quests_16_2_we_don_t_need_so_37d1e8: "我们之间不需要这么多礼节……"
  npc_override_rebel_in_quests_16_2_we_don_t_need_we_c42026: "我们不需要。我们可以自己打败他们！"
  npc_override_rebel_in_quests_16_2_we_don_t_owe_you_4229f1: "我们不欠你什么。"
  npc_override_rebel_in_quests_16_2_we_don_t_want_talk_1b52a7: "我们不想再和你说话了。"
  npc_override_rebel_in_quests_16_2_we_don_t_want_talk_2f5e23: "我们不想和你说话。走吧。"
  npc_override_rebel_in_quests_16_2_we_don_t_want_talk_bea70b: "我们不想说话。"
  npc_override_rebel_in_quests_16_2_we_estimate_one_who_took_0fb74d: "我们估计拿走它的人是企业的受托人。而我们要调查的设施是^4d4dff艾音布罗克附近的废弃工厂区^000000。"
