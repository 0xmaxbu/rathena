  npc_override_rebel_in_quests_16_2_every_time_they_leave_ba_a876bd: "每次他们离开基地，我都担心他们会受伤。"
  npc_override_rebel_in_quests_16_2_every_visitor_guest_820a4e: "不是每个访客都是客人。"
  npc_override_rebel_in_quests_16_2_everyone_here_knows_ente_f566fb: "这里的每个人都知道他背后有一家企业。"
  npc_override_rebel_in_quests_16_2_everyone_monster_here_lo_6b38fa: "这里每个人都是怪物。看看戈尼。他在流血，几乎死了。但他还活着。事实是其他人都非同寻常，而你才是正常的。"
  npc_override_rebel_in_quests_16_2_everyone_says_no_questio_1b39b4: "每个人都对这个问题说不。但他们仍然像小菜一碟一样得到它们！我看到他们了！"
  npc_override_rebel_in_quests_16_2_exact_coordinates_operat_ee691e: "确切的^4d4dff行动地点坐标是280, 332^000000。行动的负责人可能是……^4d4dff朱利安^000000。"
  npc_override_rebel_in_quests_16_2_exactly_as_reward_i_give_196e7f: "没错！作为奖励，我会给你一个机会，把修理管道的零件带来。"
  npc_override_rebel_in_quests_16_2_exactly_i_told_you_there_5c3329: "没错。我告诉过你柱子后面会有空间。不是吗？"
  npc_override_rebel_in_quests_16_2_exactly_s_something_you_3b7d6b: "没错。那是你应该改变的东西。自信。在你的情况下，缺乏信心导致了缺乏自信。"
  npc_override_rebel_in_quests_16_2_exit_downstairs_go_there_e4b592: "出口在楼下。去那里。"
  npc_override_rebel_in_quests_16_2_experienced_blacksmith_r_71ed80: "有经验的铁匠只需用锤子砸武器时感受手臂上的振动，就能识别武器的状态。"
  npc_override_rebel_in_quests_16_2_explain_him_21fa78: "向他解释。"
  npc_override_rebel_in_quests_16_2_explain_situation_2b2da4: "解释情况。"
  npc_override_rebel_in_quests_16_2_extremely_hard_build_tru_e09b94: "重建信任极其困难。但我们还能做什么呢？他们希望我们粘上破碎的部分。"
  npc_override_rebel_in_quests_16_2_facing_them_something_i_cf516a: "面对他们也不是我愿意做的事。"
  npc_override_rebel_in_quests_16_2_fact_i_dislike_those_kid_574c1d: "我讨厌那些孩子是另一回事。"
  npc_override_rebel_in_quests_16_2_fact_skia_isn_t_here_12a228: "斯基亚今天不在这里这个事实可能和你的计划有关……"
  npc_override_rebel_in_quests_16_2_fact_you_say_now_shows_bfecae: "你现在这么说表明你知道我们和他们之间的关系。我说得对吗？"
  npc_override_rebel_in_quests_16_2_favor_552b44: "为了这个恩惠……"
  npc_override_rebel_in_quests_16_2_favor_adler_s_334a96: "恩惠？阿德勒的和那个？"
  npc_override_rebel_in_quests_16_2_fellow_full_chivalry_s_d_f3413c: "这家伙充满了骑士精神！如今很难找到这样的人。"
