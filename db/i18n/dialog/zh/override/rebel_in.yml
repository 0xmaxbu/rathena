  npc_override_rebel_in_quests_16_2_then_s_mercenary_ring_ty_74dbf0: "那就是佣兵戒指A型和B型。升级一个插槽我要收五个代币。升级的最大插槽数是两个。初始化我要收10个代币。"
  npc_override_rebel_in_quests_16_2_then_should_i_since_you_a00796: "那我要吗？既然你是个包里装着3万各种物品的冒险者，你应该能背他。"
  npc_override_rebel_in_quests_16_2_then_store_outside_door_988b76: "那门外的商店是^0000cd骗局^000000。那个倒下的人是^0000cd反叛者^000000的成员……这就是为什么……"
  npc_override_rebel_in_quests_16_2_then_tell_them_come_out_d4e14d: "那告诉他们出来！现在出来！出来！出来！"
  npc_override_rebel_in_quests_16_2_then_there_one_thing_we_ea3323: "那我们有一件事要做。"
  npc_override_rebel_in_quests_16_2_then_we_began_believe_we_75c710: "然后我们开始相信自己是最差劲、最绝望的孩子……"
  npc_override_rebel_in_quests_16_2_then_we_cannot_afford_ac209f: "那我们负担不起。"
  npc_override_rebel_in_quests_16_2_then_we_get_going_cefff0: "那我们就出发吧。"
