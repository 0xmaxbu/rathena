  npc_override_rebel_in_quests_16_2_you_here_now_a4bdea: "你现在在这里吗？"
  npc_override_rebel_in_quests_16_2_you_i_just_appear_commun_ed68fb: "你和我似乎无法沟通。"
  npc_override_rebel_in_quests_16_2_you_ignored_us_when_we_4d3b9b: "我们有麻烦时你无视我们。现在你来求助？你怎么能这样？"
  npc_override_rebel_in_quests_16_2_you_imagine_all_you_want_bd09c4: "你可以尽情想象，包括谋杀或暴力。那会比那更糟。"
  npc_override_rebel_in_quests_16_2_you_insane_you_ran_away_8e81d7: "你疯了吗？你因为私事逃离部队。你还伤害了同伴！"
