  npc_override_rebel_in_quests_16_2_i_nowhere_else_go_neithe_ad187f: "我无处可去。这里的其他人也一样。我们不能仅仅相信你的承诺就帮助你。"
  npc_override_rebel_in_quests_16_2_i_occasionally_shooting_d538c7: "我偶尔会感到心脏附近有刺痛。我的心跳比平常快。有时即使没有发烧，我也会变热。"
  npc_override_rebel_in_quests_16_2_i_passed_some_unimportan_ef1bef: "我把那个人的供词中一些不重要的细节传给了施瓦茨政府。而且，我把布鲁诺交给了施瓦茨。"
  npc_override_rebel_in_quests_16_2_i_prefer_being_active_du_a9797b: "我喜欢执行活跃任务。顺便问一下……我怎么才能得到它们？"
  npc_override_rebel_in_quests_16_2_i_prefer_cookies_lucy_i_74a02d: "我更喜欢露西的饼干，但我应该开始吃这些了。"
  npc_override_rebel_in_quests_16_2_i_prepare_meal_gluttons_7cdb72: "我必须为贪吃鬼准备饭菜……你能去把慈善带来吗？"
  npc_override_rebel_in_quests_16_2_i_prepare_tea_time_tomor_0dc822: "我还得准备明天的下午茶……如果你不介意，明天能再带一次吗？"
  npc_override_rebel_in_quests_16_2_i_promised_meet_vero_lig_23efd3: "我答应在里希塔乐镇见维罗。我们去里希塔乐镇吧。"
  npc_override_rebel_in_quests_16_2_i_provide_special_upgrad_2b4161: "我提供议事长袍、咨询长袍和佣兵戒指A型和B型的特殊升级。作为回报，我要施瓦茨荣誉代币。"
  npc_override_rebel_in_quests_16_2_i_put_bucket_there_recei_88334a: "我把桶放在那里接漏水！一旦管道完全破裂，这里就会发洪水！既然这个地方是藏身处，一旦发洪水就会暴露。然后……我们会……"
