  npc_override_rebel_in_quests_16_2_i_m_one_who_brought_90d71f: "是我把她带来的，他似乎不在乎我……"
  npc_override_rebel_in_quests_16_2_i_m_one_who_s_c32eb3: "我不是脾气暴躁的人。我猜是你。"
  npc_override_rebel_in_quests_16_2_i_m_one_who_saved_1f38a8: "我是在战争肆虐时救了你命的人。"
