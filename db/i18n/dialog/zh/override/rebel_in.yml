  npc_override_rebel_in_quests_16_2_then_i_get_ready_receive_868539: "那我就准备重新接待客人了！"
  npc_override_rebel_in_quests_16_2_then_i_go_prepare_repair_585bbe: "那我去准备修理！再次靠你了！"
