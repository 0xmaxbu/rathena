  npc_override_rebel_in_quests_16_2_then_who_s_going_repair_9b000d: "那谁来修？这里没有人。"
  npc_override_rebel_in_quests_16_2_then_who_should_we_ask_ddcd99: "那我们应该请谁来做？"
  npc_override_rebel_in_quests_16_2_then_why_did_you_bring_b9af1c: "那你为什么带他们进来？"
  npc_override_rebel_in_quests_16_2_then_why_you_go_through_9f7a30: "那你为什么要经过这种地方？"
  npc_override_rebel_in_quests_16_2_then_you_borrow_name_ner_38cb6e: "那你要借用内利乌斯家族的名字。"
