  npc_override_rebel_in_quests_16_2_you_made_me_expect_what_c238bd: "……你让我期待了。你现在在做什么？"
  npc_override_rebel_in_quests_16_2_you_make_bouquet_carnati_db1420: "你能做一束康乃馨花束吗？"
  npc_override_rebel_in_quests_16_2_you_make_new_friends_sta_77232c: "你可以交新朋友，培养爱好或提高射击能力。你甚至可以做一些我意想不到的事情。"
  npc_override_rebel_in_quests_16_2_you_marvelous_lighthalze_5f0c0c: "你在里希塔乐镇表现出色。难怪你是这么热门的人物。"
  npc_override_rebel_in_quests_16_2_you_may_realized_you_alr_916176: "你可能没有意识到。但你已经对这里的每个人都这样做了。他们都靠你。再相信自己一点。"
  npc_override_rebel_in_quests_16_2_you_may_received_already_7452f4: "你可能已经通过反叛者收到了。"
  npc_override_rebel_in_quests_16_2_you_mean_bruno_2d0fe2: "你是说……布鲁诺？"
