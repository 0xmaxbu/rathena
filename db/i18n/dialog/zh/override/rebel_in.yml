  npc_override_rebel_in_quests_16_2_i_like_your_honesty_you_6b74bf: "我喜欢你的诚实。你其实不需要知道那个。"
  npc_override_rebel_in_quests_16_2_i_like_your_spirit_you_9598b3: "我喜欢你的精神。你说你需要合作？为什么不呢？我同意。"
