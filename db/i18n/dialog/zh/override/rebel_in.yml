  npc_override_rebel_in_quests_16_2_i_also_think_my_daughter_6f613a: "我也想念我的女儿。"
  npc_override_rebel_in_quests_16_2_i_always_like_working_7b89a8: "我一直喜欢工作。"
  npc_override_rebel_in_quests_16_2_i_always_take_care_f30e73: "我一直必须照顾它。"
  npc_override_rebel_in_quests_16_2_i_always_thank_you_your_ecc7d2: "我一直感谢你的帮助。"
  npc_override_rebel_in_quests_16_2_i_always_wanted_visit_pl_986239: "我一直想以游客身份参观这个地方。我从未想过会以这种方式来到这里。"
  npc_override_rebel_in_quests_16_2_i_am_agent_secret_wings_947ee3: "我是^0000cd秘翼的特工^000000，一个直接对施瓦茨瓦尔德总统负责的机构。"
