  npc_override_rebel_in_quests_16_2_you_need_five_schwartz_h_6bda9c: "你需要五个施瓦尔特茨荣誉代币来升级你左槽装备的佣兵戒指A型或B型的一个插槽。你确定要升级吗？"
  npc_override_rebel_in_quests_16_2_you_need_fuel_27989c: "你需要燃料吗？"
