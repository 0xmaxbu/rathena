  npc_override_rebel_in_quests_16_2_hey_you_saying_i_m_7bbec9: "嘿！！！你说我是变态？你每天用那巨大的身体走在管道上。结果，这根细管道坏了！那里！还有那里！你能看到漏水吗？"
  npc_override_rebel_in_quests_16_2_hey_you_standing_up_too_3ede9c: "嘿，你也站起来了！"
  npc_override_rebel_in_quests_16_2_hey_you_started_fab4c2: "嘿！你开始了！"
  npc_override_rebel_in_quests_16_2_hey_you_two_there_15564a: "嘿，你们两个！"
  npc_override_rebel_in_quests_16_2_hi_what_now_c3f7f6: "嗨。现在怎么了？"
  npc_override_rebel_in_quests_16_2_high_class_tea_dien_old_7bc6bd: "迪恩的高级茶，里德什的旧信，科特内斯的非常闪亮的戒指。"
  npc_override_rebel_in_quests_16_2_high_class_tea_dien_told_eec54d: "这就是迪恩说的高级茶……但为什么它会在这种地方？"
  npc_override_rebel_in_quests_16_2_his_elder_sister_just_fi_c3033b: "他的姐姐只是在翻阅她正在看的书籍和文件。但阿里韦罗似乎并不在意，继续兴奋地说着。"
  npc_override_rebel_in_quests_16_2_his_excellency_entrusted_41e7c1: "阁下把其余的事托付给了我，所以从现在起你可以和我一起工作。"
  npc_override_rebel_in_quests_16_2_his_handsome_face_cc7053: "是因为他英俊的脸吗？"
  npc_override_rebel_in_quests_16_2_his_name_bruno_since_s_3decd1: "他的名字是布鲁诺……既然这是个如此普通的名字，可能是化名。"
  npc_override_rebel_in_quests_16_2_his_name_gonie_598628: "他的名字是戈尼吗？"
  npc_override_rebel_in_quests_16_2_his_voice_betrays_his_pa_b963ef: "他的声音出卖了他的恐慌。而且他还让我做他一直在自己做的工作。有什么不对吗？我很好奇。我按照他的要求把大自然砸成了碎片。"
