  npc_override_rebel_in_quests_16_2_dry_i_feel_like_s_19c7c9: "很干，我觉得没有完全烤好。太甜了，形状也不一致。但是……"
  npc_override_rebel_in_quests_16_2_due_my_position_i_am_bae6d3: "这是由于我的职位，而且我不是一个自由的冒险者……斯基亚女士为我处理得相当好……"
  npc_override_rebel_in_quests_16_2_during_extradition_proce_4bc877: "在引渡程序中，我不得不从施瓦茨瓦尔德政府那里得到一点帮助。"
  npc_override_rebel_in_quests_16_2_eee_you_later_i_go_8f0e80: "待会儿见！我得去整理我做的东西。我靠你了！"
