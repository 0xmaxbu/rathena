  npc_override_rebel_in_quests_16_2_i_mean_my_code_name_f76288: "我是说，我的代号是苍鹭。"
  npc_override_rebel_in_quests_16_2_i_mean_researchers_7c1321: "我是说，研究人员。"
  npc_override_rebel_in_quests_16_2_i_mean_spoiled_crow_pres_53329c: "我是说，总统的宠坏的乌鸦-"
  npc_override_rebel_in_quests_16_2_i_mean_why_you_go_5e24c9: "我是说，为什么你必须经过这样的地方？他们不给你任何活动费用吗？也许阁下不关心你的舒适。"
  npc_override_rebel_in_quests_16_2_i_might_look_suspicious_04f168: "我可能看起来很可疑，所以我会藏起来。"
  npc_override_rebel_in_quests_16_2_i_must_go_yuno_0c156d: "而且我必须去朱诺。"
  npc_override_rebel_in_quests_16_2_i_must_showing_my_gratit_68cfa0: "我现在应该表达我的感激之情。但我必须再请你帮一个忙。请偶尔和我姐姐谈谈。她经常很孤独……"
  npc_override_rebel_in_quests_16_2_i_my_best_rookie_what_fabea0: "我会尽力的。菜鸟，你最近在做什么？你和懒鬼谈得怎么样？"
  npc_override_rebel_in_quests_16_2_i_need_some_burnt_tree_0acba2: "我需要一些烧焦的树。大约10棵。因为它们已经充分干燥，会烧得很好。而且有比煤更好的东西来保持火长时间燃烧。请带一些煤来。三块。"
  npc_override_rebel_in_quests_16_2_i_need_some_burnt_trees_bf655c: "我需要一些烧焦的树，大约10棵。因为它们已经充分干燥，会烧得很好。而且有更好的煤来保持火长时间燃烧。请带一些煤来，三块。"
  npc_override_rebel_in_quests_16_2_i_need_some_glittering_s_acf4ba: "我需要一些闪闪发光的东西来装饰我的流星。让我看看……我需要透明闪烁的水晶碎片和黑水晶碎片。"
  npc_override_rebel_in_quests_16_2_i_never_accept_5051df: "我永远不会接受！"
