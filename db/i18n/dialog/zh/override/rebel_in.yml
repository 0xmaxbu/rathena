  npc_override_rebel_in_quests_16_2_we_know_lot_about_facili_875d35: "我们对这个设施很了解。"
  npc_override_rebel_in_quests_16_2_we_like_hunt_pet_child_e0d5b0: "我们想猎杀^4d4dff宠物小孩^000000那家伙。你要加入我们吗？"
  npc_override_rebel_in_quests_16_2_we_like_your_courage_so_317893: "但我们喜欢你的勇气。所以我们会先听你说。"
  npc_override_rebel_in_quests_16_2_we_liked_our_unit_comman_5a83c8: "但我们喜欢我们的部队和埃里克森指挥官……"
