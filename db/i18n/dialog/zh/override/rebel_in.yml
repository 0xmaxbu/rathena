  npc_override_rebel_in_quests_16_2_no_he_opened_his_eyes_ddc4bb: "不，他因为冲击本能地睁开了眼睛。他仍然昏迷。"
  npc_override_rebel_in_quests_16_2_no_he_s_637c3e: "不，他不是。"
