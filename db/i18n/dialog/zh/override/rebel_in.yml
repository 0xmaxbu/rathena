  npc_override_rebel_in_quests_16_2_no_i_t_make_our_fa78f3: "不，我不能让我们的客人工作。"
  npc_override_rebel_in_quests_16_2_no_i_these_many_stuffs_c8b916: "不。我有这么多东西要照看。而且我没有足够的时间。哦，冒险者！请等一下！和我谈一分钟！"
  npc_override_rebel_in_quests_16_2_no_isn_t_965be0: "不，不是……"
  npc_override_rebel_in_quests_16_2_no_matter_how_much_you_057d7f: "不管你向我推荐多少，我不需要。"
  npc_override_rebel_in_quests_16_2_no_maybe_s_weird_underst_d97df9: "……不。也许理解疯子很奇怪。"
  npc_override_rebel_in_quests_16_2_no_mission_then_what_hap_a98ad9: "没有任务？那我做的任务怎么了？"
  npc_override_rebel_in_quests_16_2_no_more_anchovy_cookie_l_7f784e: "没有更多的凤尾鱼饼干了。我们回去找米洛再拿一些。"
  npc_override_rebel_in_quests_16_2_no_more_upgrade_possible_4ef927: "这件装备无法再升级了。你还有别的吗？"
  npc_override_rebel_in_quests_16_2_no_my_hands_may_dirty_f1f1b8: "不！！我的手可能很脏。但我对慈善的心很干净！"
  npc_override_rebel_in_quests_16_2_no_never_don_t_touch_9e63ce: "不！绝不！别碰我！哎呀！"
  npc_override_rebel_in_quests_16_2_no_no_233eb5: "……不，不。"
  npc_override_rebel_in_quests_16_2_no_no_don_t_look_68c400: "不，不。别那样看着我。它们不是给我的。"
  npc_override_rebel_in_quests_16_2_no_no_i_don_t_499f6c: "不，不。我对他们没有任何偏见了。"
  npc_override_rebel_in_quests_16_2_no_no_s_what_i_2c3ce0: "不，不。我不是那个意思。通常他们称之为气氛制造者。"
  npc_override_rebel_in_quests_16_2_no_no_we_apologize_d67bc6: "……不，不……我们必须道歉。"
  npc_override_rebel_in_quests_16_2_no_nothing_please_bring_8e95de: "不！没什么。请尽快把它带来。"
  npc_override_rebel_in_quests_16_2_no_now_d1219e: "不。不是现在。"
  npc_override_rebel_in_quests_16_2_no_please_talk_me_while_b6abe6: "不，{0}，请和我谈一会儿。"
  npc_override_rebel_in_quests_16_2_no_problem_be5b78: "没问题。"
  npc_override_rebel_in_quests_16_2_no_retreat_path_area_whe_0c30ac: "设施所在区域没有撤退路径。"
  npc_override_rebel_in_quests_16_2_no_retreat_path_df7cbb: "没有撤退路径。"
  npc_override_rebel_in_quests_16_2_no_s_flaw_i_am_25a5c1: "不。我说的不是那个缺陷。虽然它的名字是流星，但它一点也不闪烁。"
  npc_override_rebel_in_quests_16_2_no_s_okay_e4e584: "不。没关系。"
  npc_override_rebel_in_quests_16_2_no_s_true_dc8b65: "……不。不是真的。"
  npc_override_rebel_in_quests_16_2_no_she_did_look_me_e6048d: "不！她确实用她明亮闪亮的眼睛看我了！"
  npc_override_rebel_in_quests_16_2_no_should_never_him_let_0dc27b: "不，绝不应该是他……我们先别理他。"
  npc_override_rebel_in_quests_16_2_no_surface_just_means_co_c5a2a1: "不，表面只是覆盖星星的手段。"
  npc_override_rebel_in_quests_16_2_no_target_please_i_don_13b3c3: "不！请不要是目标！我还不想死！！！对不起！是我的错！我再也不会了！"
  npc_override_rebel_in_quests_16_2_no_thanks_our_seniors_do_62635f: "不用谢。我们的前辈不会每顿饭都吃茶和零食的！一天一次就够了。"
  npc_override_rebel_in_quests_16_2_no_wait_please_fact_i_11fe30: "不，请等一下。事实上，我……不，我的同伴……"
  npc_override_rebel_in_quests_16_2_no_wait_wait_minute_ab8dbe: "不……等等……等一下"
  npc_override_rebel_in_quests_16_2_no_we_ones_who_should_97f56d: "……不……我们应该道歉。"
  npc_override_rebel_in_quests_16_2_no_we_won_t_tell_db5365: "不。我们不会告诉你。"
  npc_override_rebel_in_quests_16_2_no_what_kind_jerk_you_343442: "不！你把我当成什么混蛋了？看着我的眼睛！"
  npc_override_rebel_in_quests_16_2_no_what_shame_7ab76a: "不……真遗憾……"
