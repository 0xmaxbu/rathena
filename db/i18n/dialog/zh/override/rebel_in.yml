  npc_override_rebel_in_quests_16_2_menu_options_3fdd02: "{0}：对！"
  npc_override_rebel_in_quests_16_2_menu_options_4221e1: "{0}：我不敢相信。这不是我想象的。"
  npc_override_rebel_in_quests_16_2_menu_options_44308b: "？？？：我会告诉他下次再买。"
  npc_override_rebel_in_quests_16_2_menu_options_455003: "{0}：我应该那样做吗？"
  npc_override_rebel_in_quests_16_2_menu_options_48f9e6: "{0}：我必须告诉斯基亚这件事，然后马上去贫民窟！"
  npc_override_rebel_in_quests_16_2_menu_options_54334f: "{0}：你只从里到外想吗？"
  npc_override_rebel_in_quests_16_2_menu_options_55aead: "{0}：那可能吗？"
  npc_override_rebel_in_quests_16_2_menu_options_57600c: "{0}：……."
  npc_override_rebel_in_quests_16_2_menu_options_65f354: "{0}：任务？"
  npc_override_rebel_in_quests_16_2_menu_options_74761b: "{0}：怎么会？"
  npc_override_rebel_in_quests_16_2_menu_options_7cf9b9: "{0}：票？"
  npc_override_rebel_in_quests_16_2_menu_options_80eae9: "{0}：我，一路，背，他，来，了。不是吗？"
  npc_override_rebel_in_quests_16_2_menu_options_81928b: "{0}：那是怎样的人生……？"
  npc_override_rebel_in_quests_16_2_menu_options_81ad8e: "{0}：我觉得你把他当作物品。"
  npc_override_rebel_in_quests_16_2_menu_options_88219e: "{0}：现在没什么特别的。"
  npc_override_rebel_in_quests_16_2_menu_options_8a99f8: "{0}：我没事。"
  npc_override_rebel_in_quests_16_2_menu_options_8fba6b: "{0}：……！那些人？！"
  npc_override_rebel_in_quests_16_2_menu_options_9094ee: "{0}：而且不是那样的。"
  npc_override_rebel_in_quests_16_2_menu_options_986190: "{0}：但你看起来很冷静！"
  npc_override_rebel_in_quests_16_2_menu_options_9c9526: "{0}：我有个请求。请让我打你一下。"
  npc_override_rebel_in_quests_16_2_menu_options_a01036: "{0}：现在你看起来不同了。"
  npc_override_rebel_in_quests_16_2_menu_options_a3a241: "{0}：……这看起来可疑！"
  npc_override_rebel_in_quests_16_2_menu_options_ac9261: "{0}：你把我当成什么暴徒了！"
  npc_override_rebel_in_quests_16_2_menu_options_ad3607: "{0}：所以你只是让他勉强活着？"
  npc_override_rebel_in_quests_16_2_menu_options_b197fa: "{0}：看你的反应，它不像是子弹的名字。"
  npc_override_rebel_in_quests_16_2_menu_options_b67123: "{0}：哦，我现在感觉活过来了。"
  npc_override_rebel_in_quests_16_2_menu_options_ba6e42: "{0}：你怎么知道他的名字？"
  npc_override_rebel_in_quests_16_2_menu_options_bb9aeb: "{0}：这叫做'无限自信'。"
  npc_override_rebel_in_quests_16_2_menu_options_c0c853: "{0}：你说要和我组成搭档。"
  npc_override_rebel_in_quests_16_2_menu_options_c2fc65: "{0}：突然？"
  npc_override_rebel_in_quests_16_2_menu_options_c6dbe9: "{0}：那一定很痛……"
  npc_override_rebel_in_quests_16_2_menu_options_c9eabf: "？？？：嗯……既然这里太干了，可能会变得更脆。"
  npc_override_rebel_in_quests_16_2_menu_options_cabfda: "{0}：你在哪里听到那个虚假谣言的……"
  npc_override_rebel_in_quests_16_2_menu_options_ccfd7f: "{0}：…….."
  npc_override_rebel_in_quests_16_2_menu_options_d383b4: "{0}：嘿！我一直背着一个昏迷的人！"
  npc_override_rebel_in_quests_16_2_menu_options_d75c2c: "{0}：懒鬼，请冷静！"
