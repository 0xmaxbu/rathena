  npc_override_rebel_in_quests_16_2_there_he_leaves_again_wi_417574: "他又没跟你说再见就走了。替他道歉。我们有些孩子被宠坏了。但不是每个反叛者都这样。"
  npc_override_rebel_in_quests_16_2_there_incident_called_ma_ec185a: "有一个叫'魔法过度使用'的事件。因为这个事件，他们通过了禁止传送的法律。在我看来，'魔法过度使用'是施瓦尔特茨瓦尔特政府操纵的。"
  npc_override_rebel_in_quests_16_2_there_must_reason_as_rid_72fb68: "一定有原因，既然里德什让我们带它……"
  npc_override_rebel_in_quests_16_2_there_new_members_jana_l_8ee2a9: "还有新成员……^0000CD雅娜·列维德娃^000000和^0000CD伊利亚·列别德夫^000000。他们是双胞胎，还年轻。"
