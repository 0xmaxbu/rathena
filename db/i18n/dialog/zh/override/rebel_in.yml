  npc_override_rebel_in_quests_16_2_i_ve_been_living_einbech_ab4e6a: "我和艾琳在艾音贝赫住了很长时间。"
  npc_override_rebel_in_quests_16_2_i_ve_been_waiting_good_a28a73: "我等了好一会儿。"
  npc_override_rebel_in_quests_16_2_i_ve_done_my_job_d2ebb2: "我完成工作了~"
  npc_override_rebel_in_quests_16_2_i_ve_never_imagined_done_c34a66: "我从没想过会做得这么完美。我欠你的。谢谢。"
  npc_override_rebel_in_quests_16_2_i_ve_never_stepped_back_f4f94e: "我从未退缩过。"
  npc_override_rebel_in_quests_16_2_i_ve_spoken_lucy_5fd400: "我和露西谈过了。"
  npc_override_rebel_in_quests_16_2_i_wait_5fab47: "我会等。"
  npc_override_rebel_in_quests_16_2_i_wait_eight_months_e83380: "我可以等八个月。"
  npc_override_rebel_in_quests_16_2_i_wait_i_cannot_put_a46420: "我可以等！我不能给幸运压力。"
  npc_override_rebel_in_quests_16_2_i_wait_too_5d4e4c: "我也可以等！"
  npc_override_rebel_in_quests_16_2_i_waiting_6fb889: "我会等。"
  npc_override_rebel_in_quests_16_2_i_waiting_hotel_cadd22: "我会在酒店等。"
  npc_override_rebel_in_quests_16_2_i_want_called_my_first_338254: "我想被叫我的名字，伊利亚……"
  npc_override_rebel_in_quests_16_2_i_want_go_back_our_6b7b8e: "我想尽快回到我们的藏身处。"
  npc_override_rebel_in_quests_16_2_i_want_go_out_57eaa6: "我想出去。"
  npc_override_rebel_in_quests_16_2_i_want_talk_lebedev_twin_cfec11: "我想亲自和列别杰夫双胞胎谈谈。但这是越权，对沃尔科娃指挥官不好。"
  npc_override_rebel_in_quests_16_2_i_wanted_ask_you_about_05bfb1: "我想问你这个。她真的高兴吗？"
  npc_override_rebel_in_quests_16_2_i_wanted_buy_self_defens_ac24fc: "我想买一把自卫枪。有人推荐我来这家店。"
  npc_override_rebel_in_quests_16_2_i_wanted_deal_customers_ef71e6: "我想招待顾客。但我现在别无选择。"
  npc_override_rebel_in_quests_16_2_i_wanted_send_her_note_e9f29a: "我想给她发一张便条，更新变更的日程。但我想我会在这里见到她……所以我一直等着。"
  npc_override_rebel_in_quests_16_2_i_wish_had_been_dream_7a0dee: "我希望那是一场梦……"
  npc_override_rebel_in_quests_16_2_i_wish_i_go_myself_6f67d7: "我希望我能自己去，一颗一颗地挑选好水晶。但由于我必须照看这些东西，我不能。我需要很多时间来清洁和组装它们……呼……"
  npc_override_rebel_in_quests_16_2_i_wish_you_fortune_war_ac533c: "祝你在战争中好运。"
  npc_override_rebel_in_quests_16_2_i_won_t_able_help_209796: "我无法直接帮助你。"
  npc_override_rebel_in_quests_16_2_i_won_t_forgive_you_544bfb: "如果你让贾娜难过，我不会原谅你。"
  npc_override_rebel_in_quests_16_2_i_won_t_mad_all_92bed4: "我不会生气。你从一开始就需要星之碎屑，对吧？"
  npc_override_rebel_in_quests_16_2_i_won_t_take_any_74e068: "我不会再拿了！别管我！"
  npc_override_rebel_in_quests_16_2_i_won_t_tolerate_you_6c52e3: "如果你在耍花招，我不会容忍你。"
  npc_override_rebel_in_quests_16_2_i_wonder_s_already_time_6d0ef2: "我想是时候我们该困了。明天再一起玩吧……Zzz"
  npc_override_rebel_in_quests_16_2_i_wondered_why_he_doing_a110ed: "我想知道他为什么这样做。尽管如此，他是一名高级士兵……"
  npc_override_rebel_in_quests_16_2_if_about_secret_wings_i_60add3: "如果是关于秘翼，我不会提任何事。但对于那个问题，我会帮助你。"
  npc_override_rebel_in_quests_16_2_if_adventurer_talks_them_3d4e39: "如果冒险者和他们谈，他们会听的。"
  npc_override_rebel_in_quests_16_2_if_any_chance_well_i_3c6838: "如果万一……嗯，我猜你已经知道那部分了。我会交给你的。"
  npc_override_rebel_in_quests_16_2_if_everyone_thinks_way_36fe11: "如果每个人都这么想……"
  npc_override_rebel_in_quests_16_2_if_food_too_expensive_mi_268bfb: "如果食物太贵，你可能很难弄到。请带以下清单中的一种。"
  npc_override_rebel_in_quests_16_2_if_gun_barrel_hard_enoug_78aea6: "如果枪管不够硬，射击几次后内管会熔化。毕竟，它很快就会磨损。"
  npc_override_rebel_in_quests_16_2_if_hadn_t_been_order_8025b7: "如果不是我们领袖的命令，我现在就可以在这里把你打晕……"
  npc_override_rebel_in_quests_16_2_if_i_ask_adler_about_8e56da: "如果我问阿德勒关于那些人的事，看起来不太好。这就是我请求你的原因。拜托。"
  npc_override_rebel_in_quests_16_2_if_i_continue_too_rude_ee3c48: "如果我继续说下去，就太粗鲁了。"
  npc_override_rebel_in_quests_16_2_if_i_didn_t_see_1a4d5c: "如果我没看到鬼，你活得相当长了。不是吗？"
  npc_override_rebel_in_quests_16_2_if_i_get_rid_c2b10c: "如果我摆脱这个和那个……！"
  npc_override_rebel_in_quests_16_2_if_i_had_better_skill_997b6d: "如果我有更好的技能，用矿石就够了。我很惭愧……"
  npc_override_rebel_in_quests_16_2_if_i_you_i_read_7c72e3: "如果我是你，我会用我才华横溢的直觉从他们的眼中读出对迫击炮的强烈渴望和激动。"
  npc_override_rebel_in_quests_16_2_if_man_schwaltzvalt_goin_ba7c84: "如果那个人来自施瓦茨瓦尔德，这不会容易。"
  npc_override_rebel_in_quests_16_2_if_my_mother_finds_out_e0424c: "如果我妈妈发现这个，她会相当 upset。"
  npc_override_rebel_in_quests_16_2_if_my_sister_elena_heard_ee234e: "如果我妹妹埃琳娜听到了，她可能会开枪打他的头！"
  npc_override_rebel_in_quests_16_2_if_only_she_alive_93c645: "如果她还活着……"
  npc_override_rebel_in_quests_16_2_if_possible_i_ask_you_5dad54: "如果可能，我会请你再调查一次。"
  npc_override_rebel_in_quests_16_2_if_possible_i_like_ask_736251: "如果可能，我想明天也请你帮个忙。"
  npc_override_rebel_in_quests_16_2_if_possible_please_hurry_cb4ba1: "如果可能，请快点。"
  npc_override_rebel_in_quests_16_2_if_she_doesn_t_come_c7f680: "如果她不出来……你可以去别的地方找她。也许她一次听不到你。如果那样，把凤尾鱼饼干放在长椅上，再叫慈善。"
  npc_override_rebel_in_quests_16_2_if_they_don_t_say_2bef8d: "如果他们什么都不说，问问他们周围的其他同伴。"
  npc_override_rebel_in_quests_16_2_if_they_give_me_more_6b18ae: "如果他们给我更多时间和预算，我可以做得更好吃。"
  npc_override_rebel_in_quests_16_2_if_they_had_intention_at_ce8b89: "如果他们有意攻击我们，他们早就做了，而不是请求喝茶。而且这两个人能对我们这么多人做什么？"
  npc_override_rebel_in_quests_16_2_if_they_need_our_help_cb5788: "如果他们需要我们的帮助，我们可以利用他们。我们不像以前那么弱了。"
  npc_override_rebel_in_quests_16_2_if_wasn_t_one_thing_f6d806: "如果不是一件事……不，算了。"
  npc_override_rebel_in_quests_16_2_if_we_attack_using_water_e269b7: "如果我们用水属性攻击它，设备就会被摧毁。嘿，伙计。带一个水属性强的物品来。"
  npc_override_rebel_in_quests_16_2_if_we_feel_uncomfortable_812865: "如果我们感到不舒服，他们也会感到不舒服。所以这不是什么坏条件。来吧。喝杯茶不是什么难事。"
  npc_override_rebel_in_quests_16_2_if_we_kick_out_these_9f893e: "如果我们把这些人赶出去，他们可能会变成流氓。最坏的情况下，他们会卷入犯罪。"
  npc_override_rebel_in_quests_16_2_if_we_negotiating_rebell_e04236: "如果我们在和反叛军谈判，为什么我们去艾音贝赫而不是艾音布罗克？"
  npc_override_rebel_in_quests_16_2_if_weapon_repaired_me_hu_215b74: "如果我修理的武器伤害了我们的人，而不是敌人，那将是一场悲剧。我想防止这种情况发生。"
  npc_override_rebel_in_quests_16_2_if_works_well_you_ll_54c6e2: "如果这行得通。你就可以在施瓦茨瓦尔德和卢恩-米德加尔特自由工作。"
  npc_override_rebel_in_quests_16_2_if_you_behave_rudely_you_95e753: "如果你行为粗鲁，你就活不回去了。"
  npc_override_rebel_in_quests_16_2_if_you_bring_i_make_f790a0: "如果你带来，我会免费给你做花束，不用付花钱。"
  npc_override_rebel_in_quests_16_2_if_you_bring_me_three_deae00: "如果你给我带来^0000CD三张光滑纸^000000，我就给你做。"
  npc_override_rebel_in_quests_16_2_if_you_bring_one_them_8412d2: "如果你带来其中一个，我们的前辈会很高兴。"
  npc_override_rebel_in_quests_16_2_if_you_bring_pieces_smoo_72cdca: "如果你带来3张^0000CD光滑纸^000000，我就给你做。"
  npc_override_rebel_in_quests_16_2_if_you_bring_slick_paper_920f7c: "如果你带来^0000CD3张光滑纸^000000，我会免费给你做花束，不用付花钱。"
  npc_override_rebel_in_quests_16_2_if_you_bring_token_stras_4b6bd1: "如果你把这个代币带给2楼走廊10点钟方向的斯特拉斯，你会得到有用的回报。"
  npc_override_rebel_in_quests_16_2_if_you_cannot_judge_easi_eea3bb: "如果你不能轻易判断，可以和^0000CD他们周围的其他反叛军^000000谈谈。"
  npc_override_rebel_in_quests_16_2_if_you_cannot_trust_pres_b9d38d: "如果你不能信任总统，请信任冒险者和卢恩-米德加尔特王室。他们已经承诺全力支持。"
  npc_override_rebel_in_quests_16_2_if_you_convince_them_pub_fb0da1: "如果你说服他们，舆论就会改变。一旦舆论改变，前辈们能做什么呢？"
  npc_override_rebel_in_quests_16_2_if_you_curious_go_upstai_7ec8ef: "如果你好奇，上楼去看看。他们可能会拍你的背。"
  npc_override_rebel_in_quests_16_2_if_you_don_t_get_b33bf6: "如果你不明白，相信我。因为我信任你。"
  npc_override_rebel_in_quests_16_2_if_you_don_t_like_998798: "如果你不喜欢这个词，奴隶怎么样？"
  npc_override_rebel_in_quests_16_2_if_you_don_t_like_b6c2bc: "如果你不喜欢，为什么你和我们住在这里？"
  npc_override_rebel_in_quests_16_2_if_you_don_t_means_f11ae4: "如果你不这样做，那就意味着你只是在被剥削。那你只需温和地回去。"
  npc_override_rebel_in_quests_16_2_if_you_don_t_mind_e6a229: "如果你不介意，你能明天回来帮我招待顾客吗？呵呵……"
  npc_override_rebel_in_quests_16_2_if_you_don_t_want_9158bd: "如果你不想战斗，我猜你不需要任何合作。回去吧。"
  npc_override_rebel_in_quests_16_2_if_you_go_south_einbroch_810ef6: "如果你从艾音布罗克观测站往南走，你会找到它。"
  npc_override_rebel_in_quests_16_2_if_you_go_south_einbroch_ebcab4: "如果你从艾音布罗克观测站往南走，你会找到一个^0000CD卖花女孩^000000。"
  npc_override_rebel_in_quests_16_2_if_you_going_back_now_faeb4c: "如果你现在要回去，你想让我送你去普隆德拉吗？"
  npc_override_rebel_in_quests_16_2_if_you_help_me_again_a8a997: "如果你能再帮我一次……你能明天回来吗？我可能需要其他矿石。"
  npc_override_rebel_in_quests_16_2_if_you_help_them_they_8fac35: "如果你帮助他们，他们会给你一个证明你荣誉的代币。"
  npc_override_rebel_in_quests_16_2_if_you_help_us_we_0465ed: "但如果你帮助我们，我们可以解决它。那是只有你能做的事。我们真的需要你的帮助。"
  npc_override_rebel_in_quests_16_2_if_you_lazy_you_must_e8b26c: "如果你是懒鬼，你一定是秘翼的特工。对吧？"
  npc_override_rebel_in_quests_16_2_if_you_lose_book_more_8263e2: "如果你把书弄丢超过一次或损坏它，我们可能会禁止借给你。"
  npc_override_rebel_in_quests_16_2_if_you_lost_go_downstair_6a3420: "如果你迷路了，下楼和其他人谈谈。"
  npc_override_rebel_in_quests_16_2_if_you_lost_go_downstair_8e80d8: "如果你迷路了，下楼和其他人谈谈。"
  npc_override_rebel_in_quests_16_2_if_you_lost_you_go_12097c: "如果你弄丢了……你必须去图书馆报告那本书丢失。"
  npc_override_rebel_in_quests_16_2_if_you_meet_julian_north_1caedb: "如果你在艾音布罗克北部野地的东北角见到朱利安，他会让你进去。"
  npc_override_rebel_in_quests_16_2_if_you_mind_you_stop_588bb9: "如果你不介意，你能偶尔来放些花吗？"
  npc_override_rebel_in_quests_16_2_if_you_more_important_th_da4226: "如果你有更重要的事要做，别担心我。"
  npc_override_rebel_in_quests_16_2_if_you_need_anything_tal_014ac8: "如果你需要什么，随时告诉我。"
  npc_override_rebel_in_quests_16_2_if_you_need_later_hesita_608ac6: "如果你以后需要，不要犹豫告诉我。"
  npc_override_rebel_in_quests_16_2_if_you_only_sell_somethi_04e439: "如果你只能把东西卖给需要的人，你就是新手。我会把东西卖给一些人，他们买了就会需要它！"
  npc_override_rebel_in_quests_16_2_if_you_re_hurry_you_907914: "如果你着急，你应该早点来！"
  npc_override_rebel_in_quests_16_2_if_you_re_willing_go_43f546: "如果你愿意去，告诉我！"
  npc_override_rebel_in_quests_16_2_if_you_really_need_help_cb1483: "如果你真的需要帮助，去找别人。"
  npc_override_rebel_in_quests_16_2_if_you_really_think_so_d8243b: "如果你真的这么想，明天再来。我今天收工了。"
  npc_override_rebel_in_quests_16_2_if_you_remember_collapse_8fba64: "如果你记得秘翼的崩溃，也许你知道很多。"
  npc_override_rebel_in_quests_16_2_if_you_save_there_mold_f25a0e: "如果你保存它，上面会长霉。"
  npc_override_rebel_in_quests_16_2_if_you_see_mr_adler_c49b99: "如果你见到阿德勒先生，请代我向他致谢。"
  npc_override_rebel_in_quests_16_2_if_you_stay_here_longer_26527d: "如果你在这里待得更久，你的头上可能会多一个气孔。"
  npc_override_rebel_in_quests_16_2_if_you_take_train_here_f7475d: "如果你从这里坐火车，一会儿就能到艾音布罗克。"
  npc_override_rebel_in_quests_16_2_if_you_tell_book_name_5ecbee: "如果你把书名告诉图书管理员，他/她会交给你的。"
  npc_override_rebel_in_quests_16_2_if_you_time_visit_arena_1e43b7: "如果你有时间，随时来竞技场。"
  npc_override_rebel_in_quests_16_2_if_you_upset_stomach_whi_89c96d: "如果你喝茶时胃不舒服，那就没救了。"
  npc_override_rebel_in_quests_16_2_if_you_us_we_give_4d46e9: "如果你为我们做这件事，我们会给你施瓦茨荣誉代币。"
  npc_override_rebel_in_quests_16_2_if_you_value_your_life_169901: "如果你珍惜你的生命，不要刺激这里的人。他们中很多人脾气暴躁。"
  npc_override_rebel_in_quests_16_2_if_you_want_again_welcom_bcb3e8: "如果你想再做一次，欢迎。"
  npc_override_rebel_in_quests_16_2_if_you_want_become_assas_eb1e07: "……如果你想成为刺客，去沙漠东边。"
  npc_override_rebel_in_quests_16_2_if_you_want_call_free_428eb6: "如果你想称之为免费搭车，随你便。但你真的想把你的行为贬低为'免费搭车'吗？你可以用优雅的表达'封闭渗透后的占领'。"
  npc_override_rebel_in_quests_16_2_if_you_want_fight_me_85f7fc: "如果你想再和我战斗，我会再给你一次机会。"
  npc_override_rebel_in_quests_16_2_if_you_want_help_them_21c2d6: "如果你那么想帮助他们，你们两个去帮他们。但确保把衣服脱掉！"
  npc_override_rebel_in_quests_16_2_if_you_want_hesitate_tel_abc8ba: "如果你愿意，随时告诉我。"
  npc_override_rebel_in_quests_16_2_if_you_want_i_help_ac655c: "如果你愿意，我可以帮助你。怎么样？我需要一个搭档，我相信我们可以成为一对很棒的组合。"
  npc_override_rebel_in_quests_16_2_if_you_want_know_what_529dcf: "如果你想知道这是做什么用的，去问楼梯下面那个叫'斯特拉斯'的固执家伙。"
  npc_override_rebel_in_quests_16_2_if_you_want_me_make_52aa68: "如果你不想让我在你头上开个漂亮的洞，现在就离开。"
  npc_override_rebel_in_quests_16_2_if_you_want_revenge_mayb_b8d58b: "如果你想复仇，也许这就是机会！复仇并不总是意味着武装复仇。"
  npc_override_rebel_in_quests_16_2_if_you_want_surrender_du_53517d: "如果你想在战斗中投降，告诉伊万旁边的^0000CD索里塔^000000。"
  npc_override_rebel_in_quests_16_2_if_you_want_surrender_du_f0ed46: "如果你想在战斗中投降，告诉索里塔。"
  npc_override_rebel_in_quests_16_2_if_you_want_surrender_te_b8c4ef: "如果你想投降，告诉索里塔。"
  npc_override_rebel_in_quests_16_2_if_you_want_you_receive_157d5b: "如果你愿意，你可以通过继续帮助我们来获得它们。"
  npc_override_rebel_in_quests_16_2_if_you_wanted_become_pil_ced908: "如果你想成为飞行员，为什么要当秘密特工？"
  npc_override_rebel_in_quests_16_2_if_you_wish_too_much_ae430a: "如果你愿望太多，可能会变秃。"
  npc_override_rebel_in_quests_16_2_if_you_you_get_tracked_de5595: "如果你那样做，你会被追踪。"
  npc_override_rebel_in_quests_16_2_if_your_determination_st_999871: "如果你的决心不够坚定，你将永远停留在原地。"
  npc_override_rebel_in_quests_16_2_ilya_i_heard_b81bad: "伊利亚，我听到了。"
  npc_override_rebel_in_quests_16_2_ilya_lebedev_excited_boa_663946: "伊利亚·列别杰夫兴奋地吹嘘发生了什么。"
  npc_override_rebel_in_quests_16_2_ilya_lebedev_looks_quite_1d8c28: "伊利亚·列别杰夫看起来很兴奋。"
  npc_override_rebel_in_quests_16_2_ilya_only_one_who_call_ff07ec: "伊利亚是唯一可以叫我贾娜的人。"
  npc_override_rebel_in_quests_16_2_ilya_tell_adventurer_go_3e6639: "伊利亚，告诉冒险者走开。"
  npc_override_rebel_in_quests_16_2_important_me_all_41bb4f: "但这对我来说一点也不重要。"
  npc_override_rebel_in_quests_16_2_important_thing_charity_7d7c8d: "重要的是，慈善太可爱太迷人了！"
  npc_override_rebel_in_quests_16_2_important_thing_we_both_5364fc: "重要的是我们都安全到达了这里。记得我让你带一块 mystic frozen 和三块 rough wind。对吧？"
  npc_override_rebel_in_quests_16_2_important_thing_we_must_edfa5c: "重要的是我们必须得到反叛军的合作。"
  npc_override_rebel_in_quests_16_2_initialization_cannot_co_fef2c2: "初始化不能随时进行。只有在你获得两个效果且无法再升级装备后，我才会进行。而且……然后……"
  npc_override_rebel_in_quests_16_2_initialize_consultation_272011: "要初始化咨询长袍或议事长袍，你需要10个施瓦茨荣誉代币。装备本身不会被摧毁。你已经插入的卡片和它的冶炼等级也会安全。"
  npc_override_rebel_in_quests_16_2_inside_laboratory_there_038a50: "实验室里，由于逃脱的实验对象而一片混乱。"
  npc_override_rebel_in_quests_16_2_inside_laboratory_there_db1f02: "实验室里，还有一些研究人员躲在某个地方。"
  npc_override_rebel_in_quests_16_2_inspecting_facility_must_0aa1f1: "而且检查设施必须通过反叛军和组织进行。只有这样，我们才能批准你的调查，以收回秘密宝藏。"
  npc_override_rebel_in_quests_16_2_instead_feel_free_works_708e40: "相反，在部队里做你能做的工作。"
  npc_override_rebel_in_quests_16_2_interested_me_2227ee: "对我感兴趣？"
  npc_override_rebel_in_quests_16_2_investigate_facility_we_84800c: "要调查设施，我们需要施瓦茨政府的许可。"
  npc_override_rebel_in_quests_16_2_investigation_buildings_39cf50: "那么建筑物和地理特征的调查呢？"
  npc_override_rebel_in_quests_16_2_irene_one_them_961343: "艾琳是他们中的一员……"
  npc_override_rebel_in_quests_16_2_irene_s_mom_dad_left_2c8ce8: "艾琳的爸爸妈妈离开家去找更好的工作。我们已经失联10多年了。"
  npc_override_rebel_in_quests_16_2_irene_thank_you_bye_1ae31a: "艾琳会感谢你的。再见……"
  npc_override_rebel_in_quests_16_2_iron_most_basic_material_50c994: "铁是每种武器最基本的材料。没有它，我用其他强化材料什么也做不了。"
  npc_override_rebel_in_quests_16_2_irresponsible_i_give_you_319ca1: "这是不负责任的。我会再给你一把枪。别再这样了。"
  npc_override_rebel_in_quests_16_2_isn_t_you_must_you_aaaaf0: "{0}不是你吗……？一定是你！你为什么假装不是？"
