  npc_override_rebel_in_quests_16_2_we_competitive_anywhere_c79cf4: "我们无论去哪里都有竞争力。"
  npc_override_rebel_in_quests_16_2_we_continue_our_conversa_569159: "我们将在那里继续我们的谈话。"
