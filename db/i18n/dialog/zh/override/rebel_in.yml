  npc_override_rebel_in_quests_16_2_i_just_felt_devastated_l_623098: "失去儿子、儿媳和孙女让我感到崩溃。我茫然失措，找不到活下去的理由……"
  npc_override_rebel_in_quests_16_2_i_knew_we_meet_again_04e64c: "我知道我们会再见面的。我一直在等这一天来杀你。"
  npc_override_rebel_in_quests_16_2_i_know_cumbersome_we_cou_f66b4a: "我知道这会很麻烦。但我们会靠你的。"
  npc_override_rebel_in_quests_16_2_i_know_dff1f8: "我知道。"
  npc_override_rebel_in_quests_16_2_i_know_how_make_them_1a15a8: "我知道怎么让他们听我说。但这只会让情况更糟。"
