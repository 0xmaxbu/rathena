  npc_override_rebel_in_quests_16_2_there_so_many_people_vis_5a4124: "明天会有很多人来拜访我们。所以我会问埃里如何接待很多客人。"
  npc_override_rebel_in_quests_16_2_there_some_people_who_li_ca3d43: "有些人不喜欢沃尔科娃指挥官。"
  npc_override_rebel_in_quests_16_2_there_something_importan_d50647: "有重要的事。"
