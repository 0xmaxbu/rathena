  npc_override_rebel_in_quests_16_2_i_m_sorry_a1b803: "……对不起。"
  npc_override_rebel_in_quests_16_2_i_m_sorry_i_t_8e66b7: "对不起，我不能告诉你更多。这是机密。"
  npc_override_rebel_in_quests_16_2_i_m_sorry_s_fun_333dd3: "对不起。反正也不好玩。"
