  npc_override_rebel_in_quests_16_2_hahaha_you_figured_out_w_a03049: "哈哈哈。你猜到了？我们很幸运，除了一个核心材料外，我们拥有修理它所需的所有材料。像往常一样，核心材料总是个问题。"
