  npc_override_rebel_in_quests_16_2_didn_t_you_tell_me_cf3d6f: "你不是告诉我想看就看吗？这也太小了！它能发射子弹吗？看看这里的灰尘。我猜你在这里没生意了。"
  npc_override_rebel_in_quests_16_2_dien_30b214: "迪恩！"
