  npc_override_rebel_in_quests_16_2_hey_who_hell_you_8b5a5c: "嘿，你他妈是谁？"
  npc_override_rebel_in_quests_16_2_hey_who_my_kids_why_dfb1d5: "嘿！谁是我的孩子！为什么我要喂他们？发生了什么？"
  npc_override_rebel_in_quests_16_2_hey_who_who_said_there_9fc7d7: "嘿~谁？谁说的？沟通中一定有什么误会。我们必须去艾音贝赫。"
  npc_override_rebel_in_quests_16_2_hey_why_adventurers_norm_38f6f4: "嘿，为什么！冒险者通常在口袋里携带大约30,000个金属东西！这是我从大多数冒险者那里发现的！"
  npc_override_rebel_in_quests_16_2_hey_why_did_you_tell_827be4: "嘿！你为什么突然告诉他们你是谁？你一直告诉我甚至不要提起它。而你却正式公开了！"
  npc_override_rebel_in_quests_16_2_hey_why_you_saying_c39a73: "嘿，你为什么这么说？"
  npc_override_rebel_in_quests_16_2_hey_you_adventurer_ee6845: "嘿，你！冒险者？"
  npc_override_rebel_in_quests_16_2_hey_you_don_t_489ae1: "嘿，你不必这样做……"
  npc_override_rebel_in_quests_16_2_hey_you_re_being_rude_9b2023: "嘿！你对冒险者很粗鲁！分清现实和幻想！"
  npc_override_rebel_in_quests_16_2_hey_you_reject_front_som_4d6147: "嘿，你会在别人面前拒绝吗？冒险者？你不必这样做。"
