  npc_override_rebel_in_quests_16_2_i_m_sure_you_know_3d7b24: "我相信你知道我们第一次任务中发生了什么……不久前。"
  npc_override_rebel_in_quests_16_2_i_m_surprised_erst_accep_d55c35: "我很惊讶厄斯特这么容易就接受了。"
