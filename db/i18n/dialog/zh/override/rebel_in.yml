  npc_override_rebel_in_quests_16_2_you_give_us_some_time_cddfff: "你能给我们一些时间考虑吗？"
  npc_override_rebel_in_quests_16_2_you_go_separately_meet_c_8cc2a5: "你们分开走，在^4d4dff里希塔乐镇机场与克鲁克斯和斯奇亚见面^000000。"
  npc_override_rebel_in_quests_16_2_you_going_hate_them_fore_bf1040: "你要一直恨他们，什么都不做直到我死吗？"
  npc_override_rebel_in_quests_16_2_you_great_faith_yourself_9c2abe: "你对自己很有信心。"
  npc_override_rebel_in_quests_16_2_you_guys_fighting_again_f84749: "你们又在打架？"
  npc_override_rebel_in_quests_16_2_you_handed_her_leaflet_d66b5c: "你把传单递给了她。"
  npc_override_rebel_in_quests_16_2_you_handed_him_leaflet_deae8d: "你把传单递给了他。"
  npc_override_rebel_in_quests_16_2_you_hate_help_government_8373f2: "你讨厌帮助曾经抛弃我们的政府？这说明我们曾经对他们来说什么都不是，但现在他们需要我们的帮助。这对我们来说算是一种补偿吗？"
  npc_override_rebel_in_quests_16_2_you_haven_t_forgotten_ab_b78631: "你没忘记跑腿的事吧？"
  npc_override_rebel_in_quests_16_2_you_haven_t_found_any_9c07c2: "你还没找到任何特殊线索？"
  npc_override_rebel_in_quests_16_2_you_haven_t_found_thing_5e7913: "你还没找到你要找的东西。"
  npc_override_rebel_in_quests_16_2_you_hear_conversation_in_cc152f: "- 你听到房间里的谈话。-"
  npc_override_rebel_in_quests_16_2_you_heard_mercenary_revo_d7aafc: "你听说过施瓦尔特茨瓦尔特的雇佣兵起义吗？"
  npc_override_rebel_in_quests_16_2_you_heard_their_story_le_e99997: "（你听了他们的故事。去告诉^0000CD埃琳娜·沃尔科娃^000000。）"
  npc_override_rebel_in_quests_16_2_you_heard_voice_man_who_1f4db7: "你听到了突然出现的男人的声音。他到底是从哪里冒出来的？"
  npc_override_rebel_in_quests_16_2_you_help_me_be786d: "你能帮我吗？"
  npc_override_rebel_in_quests_16_2_you_help_me_bf1355: "你能帮我吗？"
  npc_override_rebel_in_quests_16_2_you_help_me_once_again_9f7927: "你能再帮我一次吗？告诉他们我在找他们。然后请你和他们一起来。"
  npc_override_rebel_in_quests_16_2_you_help_us_9e9911: "{0}……你会帮我们吗？"
