  npc_override_rebel_in_quests_16_2_you_keep_secret_d27a20: "你会保守秘密吗？"
  npc_override_rebel_in_quests_16_2_you_key_player_mission_b6138f: "你是那个任务的关键人物。"
  npc_override_rebel_in_quests_16_2_you_kidding_me_6fd09a: "你在开玩笑吗？"
  npc_override_rebel_in_quests_16_2_you_know_already_why_you_aad284: "你已经知道了。你为什么问？"
  npc_override_rebel_in_quests_16_2_you_know_einbech_mining_7a2b1d: "你知道'艾音贝赫，采矿村'吗？"
  npc_override_rebel_in_quests_16_2_you_know_its_location_c45213: "你知道它的位置吗？"
  npc_override_rebel_in_quests_16_2_you_know_lady_skia_i_18e6be: "你知道斯奇亚女士和我之前在朱诺请求过一次会面吗？"
  npc_override_rebel_in_quests_16_2_you_know_meaning_positio_fca110: "你知道这个职位的意义吗？"
  npc_override_rebel_in_quests_16_2_you_know_nothing_e864cd: "你什么都不知道！"
  npc_override_rebel_in_quests_16_2_you_know_opportunity_tak_7683e6: "你知道这是利用政府对你的支持和同情的机会。这将为反叛者提供更好的基础。"
  npc_override_rebel_in_quests_16_2_you_know_our_seniors_who_afeba5: "你知道我们住在二楼的前辈吗？你见过他们吗？"
  npc_override_rebel_in_quests_16_2_you_know_quite_lot_about_cc4e48: "你对它了解很多。"
  npc_override_rebel_in_quests_16_2_you_know_stuff_out_order_e2ee91: "你知道那个东西？它现在坏了。"
  npc_override_rebel_in_quests_16_2_you_know_tall_guy_who_9c20c5: "你知道，那个不怎么说话的高个子。"
  npc_override_rebel_in_quests_16_2_you_know_who_023bfe: "你知道是谁吗？"
  npc_override_rebel_in_quests_16_2_you_know_who_did_you_c1dd8e: "你……知道是谁吗？你认识艾琳吗？？"
  npc_override_rebel_in_quests_16_2_you_known_as_hero_midgar_32b4b5: "你在这个米德加尔特大陆上被称为英雄，是信任的象征。如果你和我一起来，反叛者对我们不会太固执。一旦我们获得他们的信任，一切都会顺利。"
  npc_override_rebel_in_quests_16_2_you_laying_curse_me_plea_4be914: "你在诅咒我吗？求你了！别让我变秃！"
  npc_override_rebel_in_quests_16_2_you_leaving_right_after_6057b0: "你得到你想要的就马上离开？"
  npc_override_rebel_in_quests_16_2_you_like_say_anything_d700d6: "你想说点什么吗？"
  npc_override_rebel_in_quests_16_2_you_like_show_me_your_3ae73b: "你想给我看看你的武器吗？通过看很多武器，我可以研究它们。"
  npc_override_rebel_in_quests_16_2_you_liked_them_didn_t_34a764: "你喜欢它们，不是吗？"
  npc_override_rebel_in_quests_16_2_you_ll_right_cc4816: "你会做的。对吧？"
  npc_override_rebel_in_quests_16_2_you_ll_so_embarrassed_so_66b0c9: "你会非常尴尬、抱歉和羞愧。你还能抬起头来吗？"
