  npc_override_rebel_in_quests_16_2_jana_calls_you_older_why_89b92b: "贾娜叫你年长的{0}。那她为什么叫我伊利亚……？！"
  npc_override_rebel_in_quests_16_2_jana_levedeva_ilya_lebed_558a58: "贾娜·列别杰娃和伊利亚·列别杰夫！立正！"
  npc_override_rebel_in_quests_16_2_jana_levedeva_ilya_lebed_e270f1: "贾娜·列别杰娃和伊利亚·列别杰夫。我会暂时把你们排除在实战之外。"
  npc_override_rebel_in_quests_16_2_jana_researching_whether_a35932: "贾娜正在研究我们是否可以将炸药粉应用于手榴弹。"
