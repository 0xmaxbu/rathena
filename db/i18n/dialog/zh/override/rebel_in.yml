  npc_override_rebel_in_quests_16_2_i_heard_there_s_fascinat_5a7907: "我听说那里有一家迷人的化妆品店。"
  npc_override_rebel_in_quests_16_2_i_heard_there_special_tr_75f472: "我听说有与反叛军的特殊训练，所以我自愿参加了。而我现在在做什么？"
