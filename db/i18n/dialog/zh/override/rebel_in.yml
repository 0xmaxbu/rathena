  npc_override_rebel_in_quests_16_2_once_rebellion_occupies_5372ff: "{0}，一旦反叛军占领实验室，你必须比任何人都更快地冲向中央房间。"
  npc_override_rebel_in_quests_16_2_once_they_broken_they_mu_a4625e: "一旦坏了，他们必须带到这里修理。但他们只是扔掉。即使我们罚款，他们也不带回来，声称弄丢了。"
  npc_override_rebel_in_quests_16_2_once_we_sent_delegates_s_c595b1: "有一次我们向施瓦茨瓦尔德派遣了代表。"
  npc_override_rebel_in_quests_16_2_once_we_start_we_finish_9a503d: "一旦开始，我们必须完成。"
  npc_override_rebel_in_quests_16_2_once_you_find_anything_p_323e57: "一旦你发现什么，^4d4dff请在中央百货公司前见面，我们会分享信息^000000。"
  npc_override_rebel_in_quests_16_2_once_you_touch_wreckage_b0b821: "一旦你触摸残骸……"
  npc_override_rebel_in_quests_16_2_one_day_our_agent_h_aa015d: "有一天，我们在艾音贝赫的特工H像往常一样带着火把和棍棒从警卫室出来进行夜间巡逻。H穿着警卫服。"
  npc_override_rebel_in_quests_16_2_one_day_she_asked_me_b7963c: "有一天，她问我。"
  npc_override_rebel_in_quests_16_2_one_facilities_we_planni_139bdf: "这是我们计划调查的设施之一。"
  npc_override_rebel_in_quests_16_2_one_who_went_einbroch_lo_833b10: "不久前去艾音布罗克的那个人……"
  npc_override_rebel_in_quests_16_2_only_information_we_stat_88ff0f: "我们唯一的信息是特工的陈述……听了这个故事后，你发现什么异常了吗？"
  npc_override_rebel_in_quests_16_2_only_my_close_friends_ca_246e94: "只有我的亲密朋友叫我维罗。哈哈哈。所以你很荣幸。"
  npc_override_rebel_in_quests_16_2_only_star_remaining_1fe5e4: "只剩下星星。"
  npc_override_rebel_in_quests_16_2_oops_1cda63: "哎呀。"
  npc_override_rebel_in_quests_16_2_oops_again_f96b82: "哎呀……又来了？"
  npc_override_rebel_in_quests_16_2_oops_as_you_know_i_bfbca1: "哎呀……如你所知，我还没有足够的纸来包花。"
  npc_override_rebel_in_quests_16_2_oops_defeat_waste_stoves_920af5: "哎呀！还有击败10个废炉！"
  npc_override_rebel_in_quests_16_2_oops_f6443e: "哎呀！"
  npc_override_rebel_in_quests_16_2_oops_here_you_you_arrive_7aac6f: "哎呀？！你在这里。你已经到了吗？"
  npc_override_rebel_in_quests_16_2_oops_i_don_t_get_678d46: "哎呀？！我不明白……虽然他突然在艾音布罗克消失了，但他确实在和我一起执行任务……"
  npc_override_rebel_in_quests_16_2_oops_my_hot_friend_alrea_041d82: "哎呀？！我的热辣朋友已经到了。"
  npc_override_rebel_in_quests_16_2_oops_no_let_s_say_ef9b21: "哎呀！不！让我们说这个冒险者是我的配偶。"
  npc_override_rebel_in_quests_16_2_oops_oh_sorry_who_you_a7a1bc: "……哎呀？哦，对不起。你是谁？"
  npc_override_rebel_in_quests_16_2_oops_really_44f093: "哎呀，真的吗？"
  npc_override_rebel_in_quests_16_2_oops_sorry_bunch_flowers_aeacb0: "哎呀！对不起。一束花……你不需要吗？"
  npc_override_rebel_in_quests_16_2_oops_sorry_see_you_later_8d4e7e: "哎呀，对不起。回头见。"
  npc_override_rebel_in_quests_16_2_oops_there_s_someone_pas_3a634f: "哎呀！有人路过。"
  npc_override_rebel_in_quests_16_2_oops_they_went_inside_co_70cb5e: "哎呀？他们进去了！快来！"
  npc_override_rebel_in_quests_16_2_oops_we_no_other_choice_99561e: "哎呀……如果女士们和鲁伯特同意了，我们别无选择……"
  npc_override_rebel_in_quests_16_2_oops_we_no_other_choice_d17b5c: "哎呀……我们别无选择……"
  npc_override_rebel_in_quests_16_2_oops_welcome_4e7c0b: "哎呀！欢迎。"
  npc_override_rebel_in_quests_16_2_oops_you_ve_come_back_c8bd4d: "哎呀？你空手回来了。你的凤尾鱼饼干呢？你已经吃完了吗？"
  npc_override_rebel_in_quests_16_2_order_persuade_people_re_e7415c: "为了说服反叛军的人，我想请你帮忙……"
  npc_override_rebel_in_quests_16_2_organization_destroyed_o_d87789: "那个组织曾经被摧毁过一次，所以他们一定缺乏武装力量。我们会支持他们。"
  npc_override_rebel_in_quests_16_2_originally_they_used_bor_0ecff9: "以前，他们借用和归还枪时不需要写任何东西。但几乎没人归还。我们资源有限，所以不能一直生产和购买武器。"
  npc_override_rebel_in_quests_16_2_otherwise_store_might_co_4ea471: "否则这家店可能会彻底倒闭。"
  npc_override_rebel_in_quests_16_2_otherwise_you_chased_tho_38c551: "否则你将被那些人追杀一辈子，对吧？如果你帮助我们，我们不会杀你。"
  npc_override_rebel_in_quests_16_2_ouch_i_m_so_busy_f56c18: "哎呀，我太忙了。抱歉再次请求你。去吧，冒险者！"
  npc_override_rebel_in_quests_16_2_ouch_sorry_request_you_a_131175: "哎呀，抱歉再次请求你。你现在一定很辛苦。"
  npc_override_rebel_in_quests_16_2_ouch_store_looks_smaller_15df2c: "哎呀！这家店从外面看比实际小。柱子后面有空间吗？"
  npc_override_rebel_in_quests_16_2_ouch_you_right_then_what_00041a: "哎呀，你说得对。那我们该怎么办……？我们需要尽快修理它。"
  npc_override_rebel_in_quests_16_2_our_commander_great_pers_95cb18: "我们的指挥官是个伟大的人！"
  npc_override_rebel_in_quests_16_2_our_cooperators_who_brou_d5e512: "对于带来一定数量代币的合作者，我们将赠送礼物。请选择你需要的物品。"
  npc_override_rebel_in_quests_16_2_our_mission_completed_7b165c: "我们的任务完成了。"
  npc_override_rebel_in_quests_16_2_our_president_said_his_e_0be89c: "而且我们的总统说，如果你继续帮助我们清除不需要的实验对象，阁下会给予你足够的补偿。"
  npc_override_rebel_in_quests_16_2_outwardly_nerius_family_9b660d: "表面上，内利乌斯家族是当事方。这就是为什么斯基亚现在在那里。"
  npc_override_rebel_in_quests_16_2_over_my_dead_body_061f90: "除非我死！"
  npc_override_rebel_in_quests_16_2_pardon_d2f5a6: "请再说一遍？"
  npc_override_rebel_in_quests_16_2_pardon_i_see_see_you_883292: "请再说一遍？我明白了……回头见。"
  npc_override_rebel_in_quests_16_2_pardon_you_haven_t_heard_4a147b: "请再说一遍？你还没听我的故事……"
  npc_override_rebel_in_quests_16_2_particular_royal_family_032b51: "特别是，王室不应该采取官方行动。"
  npc_override_rebel_in_quests_16_2_past_hunter_guild_payon_f5c73f: "过去，猎人公会在斐扬森林里。"
  npc_override_rebel_in_quests_16_2_people_just_excited_abou_4c2cea: "人们只是对小孩子射击感到兴奋。"
  npc_override_rebel_in_quests_16_2_people_struggling_field_5c2d87: "人们正在野外为此挣扎。"
  npc_override_rebel_in_quests_16_2_people_told_me_there_bad_3f13a9: "人们告诉我矿里藏着坏人，士兵来抓他们。"
  npc_override_rebel_in_quests_16_2_people_who_sitting_here_9bdf2d: "坐在这里的人是前辈。他们是反叛军的锚和象征。"
  npc_override_rebel_in_quests_16_2_perhaps_inconvenience_th_36c63b: "也许不便就是他们的座右铭。"
  npc_override_rebel_in_quests_16_2_perhaps_somebody_feeding_323abf: "也许有人在外面喂她……但我想给她喂好饲料。如果有人给她腐烂的食物……绝不能发生。"
  npc_override_rebel_in_quests_16_2_perhaps_there_must_been_44b732: "……也许一定有一个巨大的误会。"
  npc_override_rebel_in_quests_16_2_person_adventurer_who_se_8510dc: "这个人是解决大陆各种问题（包括施瓦茨瓦尔德）的冒险者。该冒险者目前受卢恩-米德加尔特王国保护。{0}"
  npc_override_rebel_in_quests_16_2_person_wants_go_inside_c_32895d: "这个人想进去，声称菜鸟派他/她来的。"
  npc_override_rebel_in_quests_16_2_phew_6a9c9d: "呼……"
  npc_override_rebel_in_quests_16_2_phew_ad8b54: "呼！"
  npc_override_rebel_in_quests_16_2_phew_air_so_hazy_flowers_24cc64: "呼……空气太浑浊，花都很快枯萎了……"
  npc_override_rebel_in_quests_16_2_phew_he_s_so_loud_534b4c: "呼。他太吵了。我会靠你的，冒险者。"
  npc_override_rebel_in_quests_16_2_phew_he_s_so_rude_550958: "呼，他太粗鲁了。我们别无选择。我会找别人来做。你不必担心这个。"
  npc_override_rebel_in_quests_16_2_phew_i_am_exhausted_as_fbed66: "呼，我也筋疲力尽了。请现在好好休息，等^0000cd天亮后^000000再回来。"
  npc_override_rebel_in_quests_16_2_phew_let_s_just_laugh_81715f: "呼……让我们一笑置之。毕竟公平就是公平。"
  npc_override_rebel_in_quests_16_2_phew_oh_sorry_2ef3a0: "呼……哦，对不起。"
  npc_override_rebel_in_quests_16_2_phew_request_commander_v_e359ee: "……呼，沃尔科娃指挥官的请求……我别无选择，只能回答你。但我只能告诉你那些孩子的负面事情。"
  npc_override_rebel_in_quests_16_2_phew_sir_what_you_now_474365: "呼……先生，你现在要做什么？呵呵。"
  npc_override_rebel_in_quests_16_2_phew_so_complicated_we_c_f2168a: "呼，太复杂了。我们会靠你的。那家伙太执着了。"
  npc_override_rebel_in_quests_16_2_phew_sounds_so_serious_b3d7b9: "呼……听起来很严重。"
  npc_override_rebel_in_quests_16_2_phew_these_old_men_never_e8ff53: "呼。这些老头永远不会改变。"
  npc_override_rebel_in_quests_16_2_phew_we_count_you_anyway_af9bbd: "呼……无论如何我们都会靠你的。不管那家伙告诉你什么，火一旦熄灭，每个人都会感冒。"
  npc_override_rebel_in_quests_16_2_phew_what_should_i_serve_797454: "呼，我今天该给贪吃鬼们吃什么？他们会喜欢什么……？"
  npc_override_rebel_in_quests_16_2_phew_you_been_stimulated_83544d: "呼……你被我的才华横溢的口才刺激了。这就是为什么你甚至无法回应。我当然理解……"
  npc_override_rebel_in_quests_16_2_philopontess_please_go_a_357a26: "菲洛庞特斯？请继续。"
  npc_override_rebel_in_quests_16_2_pick_up_story_you_saying_28a4b8: "捡起那个故事？你是说冒险者没有才华？亲眼看到后？"
  npc_override_rebel_in_quests_16_2_pipe_destroyed_completel_fd3781: "这根管道会完全破裂。然后这里会发洪水。既然这个地方是藏身处，一旦发洪水就会暴露。然后……我们会……"
  npc_override_rebel_in_quests_16_2_pipe_down_you_must_say_1ff857: "小声点~你不应该在公共场所说那个词！你必须时刻小心！记住我们在执行任务中！"
  npc_override_rebel_in_quests_16_2_place_been_occupied_supe_c647d4: "这个地方被巨星丹尼占领了。去别的地方！"
  npc_override_rebel_in_quests_16_2_place_where_einbroch_win_e55b93: "这是艾音布罗克风力涡轮机所在的地方。你带三块火焰之心和一块剩余的大自然。我们将用它们摧毁设备。"
  npc_override_rebel_in_quests_16_2_please_1245ce: "请。"
  npc_override_rebel_in_quests_16_2_please_adventurer_you_wr_99211b: "拜托，冒险者……你能写上去吗？请说是……"
  npc_override_rebel_in_quests_16_2_please_alive_9f3b6b: "……请活着。"
  npc_override_rebel_in_quests_16_2_please_allow_me_get_righ_3466c8: "请允许我直奔主题。"
  npc_override_rebel_in_quests_16_2_please_arrange_your_inve_d7a20f: "请整理你的物品栏再试一次。-"
  npc_override_rebel_in_quests_16_2_please_borrow_book_us_ju_9fdb02: "请从普隆德拉图书馆的少儿区帮我们借一本书。"
  npc_override_rebel_in_quests_16_2_please_bring_me_bouquet_12c6ef: "请给我带一束花。"
  npc_override_rebel_in_quests_16_2_please_bring_me_two_orid_936164: "请给我带两块奥里德康。"
  npc_override_rebel_in_quests_16_2_please_bring_pieces_crys_4c9fa4: "请带回^0000cd10块水晶和10块黑水晶^000000。你可以通过击败^0000cd黑曜石和矿石^000000获得。小心！"
  npc_override_rebel_in_quests_16_2_please_bring_them_five_p_a50749: "请把它们带给我提到的五个人。"
  npc_override_rebel_in_quests_16_2_please_call_me_tess_2430eb: "请叫我苔丝。"
  npc_override_rebel_in_quests_16_2_please_call_me_tess_683bfe: "请叫我苔丝。"
  npc_override_rebel_in_quests_16_2_please_calm_down_talk_me_72c727: "请冷静下来再和我谈。呵呵……"
  npc_override_rebel_in_quests_16_2_please_careful_next_time_507061: "下次请小心。"
  npc_override_rebel_in_quests_16_2_please_collect_some_more_3fea85: "请再收集一些。"
  npc_override_rebel_in_quests_16_2_please_come_back_after_t_2f44e3: "请在完成其他任务后回来。"
  npc_override_rebel_in_quests_16_2_please_come_back_after_y_943199: "请在你决定后回来。"
  npc_override_rebel_in_quests_16_2_please_customer_you_shou_662450: "请，顾客。你不应该这样做。"
  npc_override_rebel_in_quests_16_2_please_defeat_pitman_ein_c95893: "请在艾音贝赫矿场击败30个矿夫并给我们带一份火药。"
  npc_override_rebel_in_quests_16_2_please_defeat_scrap_heat_74ce05: "请击败^0000cd废炉^000000并带回^0000cd五块钢和15块旧钢板^000000！"
  npc_override_rebel_in_quests_16_2_please_defeat_scrap_heat_de0691: "请^0000cd击败废炉^000000。大约10个！这是我的私人请求！"
  npc_override_rebel_in_quests_16_2_please_defeat_venomous_n_1d9d5f: "请在艾音贝赫矿场击败20个毒气和20个毒气并给我们带一份炸药粉。"
  npc_override_rebel_in_quests_16_2_please_don_t_brand_as_c43ac3: "请不要把它称为免费搭车。"
  npc_override_rebel_in_quests_16_2_please_don_t_forget_c2ac44: "请不要忘记。"
  npc_override_rebel_in_quests_16_2_please_don_t_go_away_71365f: "但请不要不回来了。"
  npc_override_rebel_in_quests_16_2_please_don_t_mistreat_le_70dd2e: "请不要虐待传单。这次，我会再给你。"
  npc_override_rebel_in_quests_16_2_please_don_t_so_mean_aacf36: "请不要这么刻薄。"
  npc_override_rebel_in_quests_16_2_please_don_t_tell_about_1fc0fc: "请不要告诉反叛军里的任何人，除了列别杰夫双胞胎。"
  npc_override_rebel_in_quests_16_2_please_escort_miss_spica_a44a67: "请护送斯皮卡小姐。"
  npc_override_rebel_in_quests_16_2_please_find_them_hand_th_83ce5f: "请找到他们并交给反叛军小队成员。"
  npc_override_rebel_in_quests_16_2_please_follow_me_way_60ba57: "请跟我来，这边。"
  npc_override_rebel_in_quests_16_2_please_get_four_great_na_cfe354: "请拿四块大自然来朱诺。它们与风属性相反。"
  npc_override_rebel_in_quests_16_2_please_give_me_i_won_9ebf12: "请给我。我不会太苛刻。"
  npc_override_rebel_in_quests_16_2_please_give_me_let_me_c4c2fe: "请给我。让我用我才华横溢的品味来判断！"
  npc_override_rebel_in_quests_16_2_please_give_my_regards_l_e04963: "请代我向斯皮卡女士问好。"
  npc_override_rebel_in_quests_16_2_please_go_ask_him_370b0a: "请去问他。"
  npc_override_rebel_in_quests_16_2_please_go_back_010110: "请回去。"
  npc_override_rebel_in_quests_16_2_please_go_send_them_mess_83fd7f: "请去给他们传个信。告诉他们'苍鹭展开了翅膀'，他们就会明白。"
  npc_override_rebel_in_quests_16_2_please_help_them_time_c8777b: "请在那时帮助他们。"
  npc_override_rebel_in_quests_16_2_please_keep_mind_we_been_962a12: "请记住，我们最近一直是施瓦茨瓦尔德最神秘、最独家的组织。"
  npc_override_rebel_in_quests_16_2_please_last_one_533b40: "请。最后一个……"
  npc_override_rebel_in_quests_16_2_please_leave_4c8fd7: "请离开。"
  npc_override_rebel_in_quests_16_2_please_leave_6e1b07: "^FF0000请离开！！！^000000"
  npc_override_rebel_in_quests_16_2_please_leave_me_alone_03f21b: "……请别管我。"
  npc_override_rebel_in_quests_16_2_please_leave_now_08847f: "请现在离开。"
  npc_override_rebel_in_quests_16_2_please_let_me_pet_you_9007b9: "请……让我摸摸你，慈善。"
  npc_override_rebel_in_quests_16_2_please_let_s_just_talk_0d4b36: "请……让我们谈谈……"
  npc_override_rebel_in_quests_16_2_please_listen_me_i_m_369051: "请听我说。我来向你提出一个非常困难的请求。"
  npc_override_rebel_in_quests_16_2_please_listen_nihil_firs_9a0b99: "请先听尼希尔说。"
  npc_override_rebel_in_quests_16_2_please_make_lighter_come_a05625: "请做得更轻一点再回来。"
