  npc_override_rebel_in_quests_16_2_you_deserve_hot_person_0c700e: "你值得成为热门人物。"
  npc_override_rebel_in_quests_16_2_you_did_great_job_maybe_6b2ac7: "你做得很好。也许，你们两个？"
  npc_override_rebel_in_quests_16_2_you_did_great_job_so_d042f1: "你做得很好。所以你会再次丢掉武器，不是吗？"
  npc_override_rebel_in_quests_16_2_you_did_once_how_we_35fc8b: "你做过一次。我们怎么相信你不会再做？"
