  npc_override_rebel_in_quests_16_2_you_face_consequences_pr_9e0c2c: "但你将不得不面对后果。做好准备！"
  npc_override_rebel_in_quests_16_2_you_feel_all_time_68f2c9: "你一直感觉到吗？"
  npc_override_rebel_in_quests_16_2_you_forgotten_why_we_hid_333996: "你忘了我们为什么躲在这里吗？"
  npc_override_rebel_in_quests_16_2_you_found_charity_if_she_f501e8: "你找到查丽蒂了吗？如果她不出现，在同一个地方多叫几次。"
  npc_override_rebel_in_quests_16_2_you_freaking_out_about_f_6df65d: "你对未来感到恐慌吗？"
  npc_override_rebel_in_quests_16_2_you_fumbling_again_might_405948: "你又在搞砸了！可能会流下来！"
  npc_override_rebel_in_quests_16_2_you_gave_him_ring_4288aa: "你把戒指给了他。"
  npc_override_rebel_in_quests_16_2_you_get_them_obsidians_m_7fc478: "你可以从^0000cd黑曜石和矿石^000000那里得到。所以击败它们。我现在得走了。再见！"
  npc_override_rebel_in_quests_16_2_you_get_them_so_easily_eb8358: "但你可以很容易地得到它们！既然我们只处理过枪之类的东西，对我们来说很难得到。我见过很多冒险者很容易得到那些物品。"
