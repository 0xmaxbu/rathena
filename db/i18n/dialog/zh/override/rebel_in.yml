  npc_override_rebel_in_quests_16_2_we_going_einbroch_too_cbdb91: "我们也要去艾音布罗克。"
  npc_override_rebel_in_quests_16_2_we_going_take_train_here_827876: "我们要在这里坐火车。你看到下面下水道里^0000cd很小的洞^000000了吗？"
  npc_override_rebel_in_quests_16_2_we_had_no_idea_what_5c568a: "我们不知道该怎么办。我们只想逃跑。因为每个人都在指责我们，对我们失望……"
