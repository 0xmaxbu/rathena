  npc_override_rebel_in_quests_16_2_look_gonie_might_die_91d3b2: "看看那个。戈尼可能会死。"
  npc_override_rebel_in_quests_16_2_look_her_my_elder_sister_26773a: "看看她！我姐姐比以前更高兴了。"
  npc_override_rebel_in_quests_16_2_look_her_she_s_even_729d67: "看看她。她甚至没看这里。"
  npc_override_rebel_in_quests_16_2_look_him_he_t_even_8510ad: "看看他。他甚至不能伤害我们。"
  npc_override_rebel_in_quests_16_2_look_isn_t_light_beautif_02bb3c: "看看这个。这光不美吗？它在灯上闪烁。"
  npc_override_rebel_in_quests_16_2_look_mark_what_happened_db7f22: "看看这个标记。发生了什么？"
  npc_override_rebel_in_quests_16_2_look_muddy_water_reflect_d7d0f5: "看看那浑浊的水，什么都不反射。"
  npc_override_rebel_in_quests_16_2_look_place_s_just_tiny_82ec25: "看看这个地方。它只是个小店。你能叫它总部吗？你不想重拾你的荣耀吗？"
  npc_override_rebel_in_quests_16_2_look_there_four_walls_fo_8e0b18: "看。四面墙和四个角。所以必须有四个楼梯。只有两个楼梯，没有楼梯的地方太不方便了！"
  npc_override_rebel_in_quests_16_2_look_there_s_entrance_he_7254b4: "看看这个。这里有个入口。这是^0000cd隐藏在海滩墙壁中的入口^000000。太可疑了。我们进去看看里面有什么。"
  npc_override_rebel_in_quests_16_2_look_what_did_i_say_c1b03f: "看！我说什么来着？每个冒险者都很强！"
  npc_override_rebel_in_quests_16_2_look_you_give_him_too_e751a8: "看。你给他的工作太多了。"
  npc_override_rebel_in_quests_16_2_look_your_face_now_don_7a21fa: "看看你现在的脸！别那样看着我~"
  npc_override_rebel_in_quests_16_2_look_your_face_red_again_4fb1fe: "看那个！你的脸又红了！什么……"
  npc_override_rebel_in_quests_16_2_look_your_taste_you_real_d26b68: "看看你的品味……你真的不懂潮流，是吗？"
  npc_override_rebel_in_quests_16_2_looking_clothes_i_think_215677: "看衣服，我觉得你是个旅行者。我的记忆在消退。"
  npc_override_rebel_in_quests_16_2_looking_series_incidents_f13476: "看看设备安装后发生的一系列事件，我们的信念变得更加坚定。"
  npc_override_rebel_in_quests_16_2_looking_what_they_doing_288990: "但看看他们在做什么，他们最多只能在USU里像带着铅的动物一样生活。"
  npc_override_rebel_in_quests_16_2_looking_you_now_i_m_34d21d: "看看你现在的样子，我相信你能再活100年！"
  npc_override_rebel_in_quests_16_2_looking_your_eyes_i_see_bf0d64: "看着你的眼睛，我看出来你不是来听我们感谢的。"
  npc_override_rebel_in_quests_16_2_looks_delicious_thank_yo_c8351e: "看起来很好吃！谢谢你的好意！"
  npc_override_rebel_in_quests_16_2_looks_like_huge_mistake_d6b163: "（……看起来是个大错误。我们回去找^0000CD埃琳娜·沃尔科娃^000000。）"
  npc_override_rebel_in_quests_16_2_love_a0ec87: "……爱？？"
  npc_override_rebel_in_quests_16_2_lucky_836896: "幸运？"
  npc_override_rebel_in_quests_16_2_lucky_bring_cup_tea_6c1d75: "幸运，倒杯茶。"
  npc_override_rebel_in_quests_16_2_lucky_me_first_2ad1f8: "幸运！我先！！！"
  npc_override_rebel_in_quests_16_2_lucky_rookie_s_why_they_276be4: "幸运菜鸟。这就是他们叫你'幸运'的原因。对吧？"
  npc_override_rebel_in_quests_16_2_lucky_thanks_tea_send_th_26bf03: "幸运，谢谢你的茶。现在送他们。让乌鸦回巢。"
  npc_override_rebel_in_quests_16_2_lucky_they_strangers_who_fcf2cf: "幸运，他们是陌生人。他们是谁？"
  npc_override_rebel_in_quests_16_2_lucky_where_you_been_i_db0fdf: "幸运~~~你去哪里了！！我等了好一会儿！我要出去执行任务，祝我好运。"
  npc_override_rebel_in_quests_16_2_made_those_kids_9fb23a: "……那些孩子做的？"
  npc_override_rebel_in_quests_16_2_maid_who_passed_glass_ea_db4870: "但递玻璃杯的女仆很容易被找到。"
  npc_override_rebel_in_quests_16_2_make_any_fuss_1f58e6: "不要制造任何骚动。"
  npc_override_rebel_in_quests_16_2_make_fuss_f9bd4c: "不要制造骚动。"
  npc_override_rebel_in_quests_16_2_make_fuss_go_back_894e71: "不要制造骚动。回去！"
  npc_override_rebel_in_quests_16_2_make_sure_they_never_com_69ad2f: "确保他们再也回不来！！"
  npc_override_rebel_in_quests_16_2_make_sure_you_don_t_21a112: "确保你不要吃它们。明白了吗？"
  npc_override_rebel_in_quests_16_2_make_sure_you_properly_m_597f31: "确保你正确维护你的武器。"
  npc_override_rebel_in_quests_16_2_make_sure_you_tell_them_e592f1: "确保你告诉他们是我们做的这些。"
  npc_override_rebel_in_quests_16_2_man_called_lazy_too_dc2ac2: "那个叫懒鬼的人也是。"
  npc_override_rebel_in_quests_16_2_man_called_lazy_who_came_7ed9f6: "那个和你一起来的叫懒鬼的人……"
  npc_override_rebel_in_quests_16_2_man_named_vero_shown_up_2513c5: "那个叫维罗的人还没有出现。看来他们还没准备好。"
  npc_override_rebel_in_quests_16_2_man_neat_appearance_ligh_91e863: "一个外表整洁的男人，浅棕色头发垂到肩膀。"
  npc_override_rebel_in_quests_16_2_man_shiny_blonde_hair_to_a287b6: "那个金发闪亮的男人告诉我也要封锁与移动相关的魔法。"
  npc_override_rebel_in_quests_16_2_man_who_been_speaking_lo_420ccf: "那个一直大声说话的男人突然变得严肃起来。他开始自言自语。"
  npc_override_rebel_in_quests_16_2_man_who_used_chamberlain_d7251c: "那个曾经是管家的人……你不是在报告里写他在试图联系某人吗？"
  npc_override_rebel_in_quests_16_2_mansion_surrounded_water_294ddf: "就是这个吗？被水包围的宅邸？根据条件，看起来是。"
  npc_override_rebel_in_quests_16_2_many_us_move_freely_so_f1c66d: "我们中没有多少人能自由活动。所以我们请你承担这个任务。"
  npc_override_rebel_in_quests_16_2_mason_excellent_sniper_p_45b36b: "梅森是一名出色的狙击手，人们称他为天才。受伤后，他临时自愿来到这里，现在他热爱这份工作。"
  npc_override_rebel_in_quests_16_2_match_well_tea_2570d9: "它会和茶很配。"
  npc_override_rebel_in_quests_16_2_material_type_chimeras_6b0033: "^4d4dff材料型奇美拉^000000和"
  npc_override_rebel_in_quests_16_2_matter_benefits_s_about_308f50: "这不是利益的问题。是关于我们的感受！"
  npc_override_rebel_in_quests_16_2_matter_her_skill_s_mater_10aa85: "这不是她技能的问题。是材料。"
  npc_override_rebel_in_quests_16_2_may_blessing_jooshin_you_b80bf0: "愿朱申的祝福永远与你同在。"
  npc_override_rebel_in_quests_16_2_may_i_ask_you_what_4f1fae: "我可以问一下这是什么吗……？"
  npc_override_rebel_in_quests_16_2_may_look_like_mercenary_9cbe10: "这可能看起来像一个像垃圾一样的佣兵团。但我们处理的是人的生命。你必须遵守纪律。"
  npc_override_rebel_in_quests_16_2_may_matter_cooperation_y_860bc8: "对你来说可能是合作的问题。但对我们来说，这是生存的问题。"
  npc_override_rebel_in_quests_16_2_maybe_25207d: "也许。"
  npc_override_rebel_in_quests_16_2_maybe_2a7117: "也许就是为了这个。"
  npc_override_rebel_in_quests_16_2_maybe_guy_one_objects_sp_8678e5: "也许这个家伙是通过移植伊米尔心脏分裂出来的物体之一……"
  npc_override_rebel_in_quests_16_2_maybe_i_just_sew_single_12087a: "也许我可以只缝一颗纽扣？"
  npc_override_rebel_in_quests_16_2_maybe_i_listen_rebellion_01a103: "也许我必须听听^0000CD他们周围的反叛军^000000。）"
  npc_override_rebel_in_quests_16_2_maybe_keyword_incident_h_9b3449: "也许关键词是实际任务中发生的事件。"
  npc_override_rebel_in_quests_16_2_maybe_s_our_chance_give_5520ce: "也许这是我们给企业一份大礼的机会~"
  npc_override_rebel_in_quests_16_2_maybe_s_why_your_name_aa3ef8: "也许这就是你叫幸运的原因？"
  npc_override_rebel_in_quests_16_2_maybe_she_come_back_afte_fdae67: "也许她散步后会回来。如果她没回来，请再去找她！"
  npc_override_rebel_in_quests_16_2_maybe_somebody_wanted_yo_c5e393: "也许有人想让你挣扎。"
  npc_override_rebel_in_quests_16_2_maybe_their_brains_fille_03034d: "也许他们的大脑里装满了火药。愚蠢的怪人。"
  npc_override_rebel_in_quests_16_2_maybe_they_already_regar_979b99: "……也许他们已经把我当作敌人了。所以他们不会听我的。"
  npc_override_rebel_in_quests_16_2_maybe_we_find_something_28001f: "也许我们能找到我们遗漏的东西。"
  npc_override_rebel_in_quests_16_2_maybe_we_should_listen_h_88a7ee: "也许我们应该先听她说话。"
  npc_override_rebel_in_quests_16_2_me_4e26f0: "我？"
  npc_override_rebel_in_quests_16_2_me_e9b2c8: "还有我……"
  npc_override_rebel_in_quests_16_2_me_efficiency_most_impor_b29ba9: "对我来说，效率最重要！最暖和的就是最好的！"
  npc_override_rebel_in_quests_16_2_me_i_am_just_doing_562921: "我？我只是在做女士交给我的任务。"
  npc_override_rebel_in_quests_16_2_me_lazy_although_s_my_c913a8: "我？懒鬼。虽然这不是我的真名，但现在叫我懒鬼。"
  npc_override_rebel_in_quests_16_2_meantime_i_get_ready_rec_9fa047: "与此同时，我会准备接待顾客。"
  npc_override_rebel_in_quests_16_2_meeting_getting_too_long_44ab9e: "……会议太长了。"
  npc_override_rebel_in_quests_16_2_mention_president_heart_fc6d45: "更不用说总统了，猎心者也让我们恼火。"
  npc_override_rebel_in_quests_16_2_menu_dien_070bed: "迪恩：你没想过我们会轻易接受。是吗？"
  npc_override_rebel_in_quests_16_2_menu_dien_21749c: "迪恩：我有很多事情要准备。"
  npc_override_rebel_in_quests_16_2_menu_dien_64df35: "迪恩：多么轰动！"
  npc_override_rebel_in_quests_16_2_menu_dien_79a880: "迪恩：你以为我没有完全准备好就开始了吗？"
  npc_override_rebel_in_quests_16_2_menu_dien_7eb294: "迪恩：这很重要……不会花太长时间。"
  npc_override_rebel_in_quests_16_2_menu_dien_8562f3: "迪恩：不是简单到连三岁小孩都能理解吗？"
  npc_override_rebel_in_quests_16_2_menu_dien_99dfbc: "迪恩：我们计划了多少年！"
  npc_override_rebel_in_quests_16_2_menu_dien_9aded6: "迪恩：和你一起来的那个人……他叫懒鬼吗？"
  npc_override_rebel_in_quests_16_2_menu_dien_a55643: "迪恩：像那样躺在某处可能真的很危险。"
  npc_override_rebel_in_quests_16_2_menu_dien_c0f1a7: "迪恩：我想了很多。"
  npc_override_rebel_in_quests_16_2_menu_dien_c78888: "迪恩：我以为会有灾难。"
  npc_override_rebel_in_quests_16_2_menu_dien_d3d599: "迪恩：我的时代……已经过去了。"
  npc_override_rebel_in_quests_16_2_menu_dien_d4cb2d: "迪恩：这是如此重要的派对。"
  npc_override_rebel_in_quests_16_2_menu_dien_d77520: "迪恩：如果我们都同意，他不能不批准。"
  npc_override_rebel_in_quests_16_2_menu_dien_e82628: "迪恩：你在试图侮辱我吗？"
  npc_override_rebel_in_quests_16_2_menu_dien_e8944f: "迪恩：有这么多孩子……"
  npc_override_rebel_in_quests_16_2_menu_dien_f7d5da: "迪恩：呃！！我根本不该提起你！"
  npc_override_rebel_in_quests_16_2_menu_elena_3a8650: "埃琳娜·沃尔科娃：我真诚地道歉。"
  npc_override_rebel_in_quests_16_2_menu_elena_3beebb: "埃琳娜·沃尔科娃：看来米洛和梅森有很多话要说。"
  npc_override_rebel_in_quests_16_2_menu_elena_65a6db: "埃琳娜·沃尔科娃：确保你回到这里。"
  npc_override_rebel_in_quests_16_2_menu_elena_6f70b5: "埃琳娜·沃尔科娃：否则我会找点乐子，而你没有。"
  npc_override_rebel_in_quests_16_2_menu_elena_71c817: "埃琳娜·沃尔科娃：我不想这样做。"
  npc_override_rebel_in_quests_16_2_menu_elena_978334: "埃琳娜·沃尔科娃：嗯，应该只是一些狗在叫。"
  npc_override_rebel_in_quests_16_2_menu_elena_a5c155: "埃琳娜·沃尔科娃：如果可能的话，我想自己解决这个问题。"
  npc_override_rebel_in_quests_16_2_menu_elena_d2c3fe: "埃琳娜·沃尔科娃：我妈妈告诉我不要打神职人员。"
  npc_override_rebel_in_quests_16_2_menu_elena_f2da40: "埃琳娜·沃尔科娃：他们是克拉纳·内米埃里的梅森和米洛吗……？"
  npc_override_rebel_in_quests_16_2_menu_guard_c884be: "警卫队长：你和那个看起来懒洋洋的家伙一起来的。"
  npc_override_rebel_in_quests_16_2_menu_guard_f28fac: "警卫队长：听起来很危险……"
  npc_override_rebel_in_quests_16_2_menu_i_63c202: "我明天凌晨4点后就会完全准备好。一旦你在那之后准备好，告诉我姐姐。然后我会很快到这里。"
  npc_override_rebel_in_quests_16_2_menu_ilya_0b6f08: "伊利亚·列别杰夫：抱歉……？"
  npc_override_rebel_in_quests_16_2_menu_ilya_257edc: "伊利亚·列别杰夫：……什么，什么鬼！"
  npc_override_rebel_in_quests_16_2_menu_ilya_285b72: "伊利亚·列别杰夫：是关于探索诺格罗德的伟大冒险者。"
  npc_override_rebel_in_quests_16_2_menu_ilya_297166: "伊利亚·列别杰夫：是的。请。"
  npc_override_rebel_in_quests_16_2_menu_ilya_42f5a3: "伊利亚·列别杰夫：别担心，贾娜。"
  npc_override_rebel_in_quests_16_2_menu_ilya_5d2cb3: "伊利亚·列别杰夫：我也是！"
  npc_override_rebel_in_quests_16_2_menu_ilya_6d2ac6: "伊利亚·列别杰夫：……"
  npc_override_rebel_in_quests_16_2_menu_ilya_6d9211: "伊利亚·列别杰夫：我们会靠你的！"
  npc_override_rebel_in_quests_16_2_menu_ilya_7fa062: "伊利亚·列别杰夫：对不起……沃尔科娃指挥官……"
  npc_override_rebel_in_quests_16_2_menu_ilya_8165cb: "伊利亚·列别杰夫：是的！是的！"
  npc_override_rebel_in_quests_16_2_menu_ilya_88ba1d: "伊利亚·列别杰夫：别听，贾贾……！！"
  npc_override_rebel_in_quests_16_2_menu_ilya_8f0aa7: "伊利亚·列别杰夫：看了名字后，我觉得我必须读它。"
  npc_override_rebel_in_quests_16_2_menu_ilya_986926: "伊利亚·列别杰夫：反正都是我们的错。"
  npc_override_rebel_in_quests_16_2_menu_ilya_a317e1: "伊利亚·列别杰夫：谢谢你……"
  npc_override_rebel_in_quests_16_2_menu_ilya_ab8d6e: "伊利亚·列别杰夫：贾娜……"
  npc_override_rebel_in_quests_16_2_menu_ilya_c687b4: "伊利亚·列别杰夫：他们说这是本很有名的书。"
  npc_override_rebel_in_quests_16_2_menu_ilya_cf534d: "伊利亚·列别杰夫：这就是为什么我们随心所欲地行动，以为我们很快就会被开除。"
  npc_override_rebel_in_quests_16_2_menu_ilya_feaa65: "伊利亚·列别杰夫：所以我们以为我们又会被抛弃……"
  npc_override_rebel_in_quests_16_2_menu_jana_1cdf05: "贾娜·列别杰娃：嗯，那是……"
  npc_override_rebel_in_quests_16_2_menu_jana_396a93: "贾娜·列别杰娃：是的……"
  npc_override_rebel_in_quests_16_2_menu_jana_39d67f: "贾娜·列别杰娃：这个饼干篮，露西奶奶……？"
  npc_override_rebel_in_quests_16_2_menu_jana_40e2f8: "贾娜·列别杰娃：你以为用饼干就能引诱我们吗？"
  npc_override_rebel_in_quests_16_2_menu_jana_566036: "贾娜·列别杰娃：是的！"
  npc_override_rebel_in_quests_16_2_menu_jana_75ee94: "贾娜·列别杰娃：哎呀，你是……"
  npc_override_rebel_in_quests_16_2_menu_jana_8990c9: "贾娜·列别杰娃：我，我……"
  npc_override_rebel_in_quests_16_2_menu_jana_9169b0: "贾娜·列别杰娃：拜托！"
  npc_override_rebel_in_quests_16_2_menu_jana_baa2a0: "贾娜·列别杰娃：哦……"
  npc_override_rebel_in_quests_16_2_menu_jana_c17856: "贾娜·列别杰娃：请再说一遍……？"
  npc_override_rebel_in_quests_16_2_menu_jana_ccd40d: "贾娜·列别杰娃：对不起……"
  npc_override_rebel_in_quests_16_2_menu_jana_d0e6c5: "贾娜·列别杰娃：事实上，我们听到一些人在这么说。甚至一些不认识我们的人也这么说。"
