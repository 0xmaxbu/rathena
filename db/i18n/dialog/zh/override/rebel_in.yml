  npc_override_rebel_in_quests_16_2_i_t_vacate_my_seat_c9489e: "但我不能离开座位太久。"
  npc_override_rebel_in_quests_16_2_i_take_care_information_cc0ce6: "我可以负责信息分析和外交事务。"
  npc_override_rebel_in_quests_16_2_i_take_chance_participat_919578: "我会抓住机会参与。"
  npc_override_rebel_in_quests_16_2_i_take_him_well_8b1289: "我会好好……照顾他。"
  npc_override_rebel_in_quests_16_2_i_take_leaflets_if_you_8ee805: "如果你给我，我会拿传单……但我只需要矿里少量的火药。"
  npc_override_rebel_in_quests_16_2_i_take_schwartz_honor_to_080d34: "我拿20个施瓦茨荣誉代币来升级议事长袍或咨询长袍的插槽。升级的最大插槽数是2个。而且我拿10个施瓦茨荣誉代币来初始化。你明白吗？"
  npc_override_rebel_in_quests_16_2_i_talked_out_my_sister_14f957: "我和我姐姐谈过了。"
  npc_override_rebel_in_quests_16_2_i_taught_my_code_name_04e4f4: "我把我的代号'苍鹭'教给了他们，而你不知道！谁负责这次通信？吸毒者？"
  npc_override_rebel_in_quests_16_2_i_tell_crux_you_go_cd753f: "我会告诉克鲁克斯。你先去追那个家伙，拜托。"
  npc_override_rebel_in_quests_16_2_i_tell_nihil_about_28cbc7: "我必须告诉尼希尔这件事。"
  npc_override_rebel_in_quests_16_2_i_tell_you_situation_ste_e0231e: "我会一步一步告诉你从特工发现异常装置那一刻起的情况。一旦发现任何异常，告诉我。"
  npc_override_rebel_in_quests_16_2_i_tell_your_commander_86ba0a: "我可以把这个告诉你的指挥官吗？"
  npc_override_rebel_in_quests_16_2_i_think_change_needed_9a525c: "而且我认为需要改变。"
