  npc_override_rebel_in_quests_16_2_way_hmm_no_never_mind_b99e7a: "顺便说一下……嗯，不。没什么。"
  npc_override_rebel_in_quests_16_2_way_how_did_you_find_c4490f: "顺便说一下……你是怎么找到我们的？这是一家只有少数人光顾的小店。"
