  npc_override_rebel_in_quests_16_2_you_d_better_go_out_dd8938: "……你最好现在出去。"
  npc_override_rebel_in_quests_16_2_you_d_better_take_look_98b8b8: "你最好看看外面是谁。他的名字是……^0000cd戈尼^000000。对吗？"
  npc_override_rebel_in_quests_16_2_you_d_better_think_twice_db23e6: "你最好三思而后答。"
