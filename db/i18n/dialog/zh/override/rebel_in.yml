  npc_override_rebel_in_quests_16_2_i_really_need_them_so_afebaf: "但我真的需要它们。所以请把它们带给我。好吗？"
  npc_override_rebel_in_quests_16_2_i_reclaimed_blessing_sta_3efaa3: "我收回了祝福之星。"
  npc_override_rebel_in_quests_16_2_i_recognized_once_76442b: "我一眼就认出来了！"
  npc_override_rebel_in_quests_16_2_i_remember_as_mission_va_306670: "我会记住这是一个留下各种问题的任务。"
  npc_override_rebel_in_quests_16_2_i_remember_i_asked_him_3c42e5: "我记得我让他去跑腿。他会回到这里吗？"
  npc_override_rebel_in_quests_16_2_i_reported_elders_our_ro_053a0e: "我向我们王室的长辈报告了这件事。我被责骂了，勉强得到允许来这里。"
  npc_override_rebel_in_quests_16_2_i_said_no_35d429: "我说了不！"
