  npc_override_rebel_in_quests_16_2_you_doing_me_purpose_are_41f679: "……你是故意这样对我的，不是吗？你为什么这么恨我？"
  npc_override_rebel_in_quests_16_2_you_don_t_anything_me_6b4670: "你什么都没给我带？真遗憾！嗯~我也喜欢饼干~"
