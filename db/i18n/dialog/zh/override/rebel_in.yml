  npc_override_rebel_in_quests_16_2_i_like_fight_you_when_7c411f: "我想在你状态最好的时候和你战斗。明天再来。"
  npc_override_rebel_in_quests_16_2_i_like_get_some_more_d78c55: "我想再拿一些！"
  npc_override_rebel_in_quests_16_2_i_like_guys_who_serious_93acdc: "我喜欢认真对待完成任务的人。但在这种情况下……我希望他放弃任务去度假。"
