  npc_override_rebel_in_quests_16_2_menu_options_dc0b1e: "{0}：看起来如果和他在一起，每一刻都会很痛苦……一定不是他。"
  npc_override_rebel_in_quests_16_2_menu_options_dc12bb: "{0}：请，放开我的手。"
  npc_override_rebel_in_quests_16_2_menu_options_e3d773: "？？？：刚才，有一阵骚动。"
  npc_override_rebel_in_quests_16_2_menu_options_e46f14: "{0}：是的。是的。听起来很棒。"
  npc_override_rebel_in_quests_16_2_menu_options_ec1672: "？？？：哈！太震惊了！"
  npc_override_rebel_in_quests_16_2_menu_options_edab6f: "{0}：谁？"
  npc_override_rebel_in_quests_16_2_menu_options_ee0fe4: "{0}：你刚才说'呵呵'了吗？"
  npc_override_rebel_in_quests_16_2_menu_options_f2867c: "{0}：正如我之前告诉你的，你的大嘴巴总是个问题。"
  npc_override_rebel_in_quests_16_2_menu_options_f58807: "{0}：哪种零食那么贵？"
