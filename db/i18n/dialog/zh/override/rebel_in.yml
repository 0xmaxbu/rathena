  npc_override_rebel_in_quests_16_2_thank_you_so_much_making_2749f0: "非常感谢你让我们的前辈们开心！"
  npc_override_rebel_in_quests_16_2_thank_you_there_accident_fefb60: "谢谢你……那天发生了事故……一条隧道塌了，有些人再也没回来。"
