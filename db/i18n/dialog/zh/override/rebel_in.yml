  npc_override_rebel_in_quests_16_2_we_count_you_again_next_0b80ad: "我们下次还会靠你的。"
  npc_override_rebel_in_quests_16_2_we_destroyed_prohibition_e44e1c: "我们摧毁了禁制设备，看起来……没有目击者。以防万一，我们散开去艾音布罗克。"
  npc_override_rebel_in_quests_16_2_we_destroyed_prohibition_e88e2c: "我们摧毁了禁制设备。现在回克拉纳·内梅里。"
