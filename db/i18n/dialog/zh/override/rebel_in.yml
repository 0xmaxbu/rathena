  npc_override_rebel_in_quests_16_2_i_did_take_cookie_where_d66aae: "（我确实拿了饼干……它在哪里？"
  npc_override_rebel_in_quests_16_2_i_didn_t_know_what_d76e10: "我不知道发生了什么，只是告诉他停下来。"
  npc_override_rebel_in_quests_16_2_i_didn_t_know_who_65a01e: "我不知道你是谁。但我知道你有某种目的。我没有告诉你我的名字，但你却在喊'出来吧，菜鸟'。所以我有了线索。"
