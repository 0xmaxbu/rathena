  npc_override_rebel_in_quests_16_2_thanks_your_support_conc_f8bfe9: "多亏你的支持和关心，我们才做到了。"
  npc_override_rebel_in_quests_16_2_thanks_your_support_we_k_aca032: "多亏你的支持，我们保持了皇室的传统。而且我们避开了恶意之人的肮脏手段。"
