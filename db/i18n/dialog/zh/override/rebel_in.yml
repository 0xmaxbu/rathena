  npc_override_rebel_in_quests_16_2_then_you_please_look_tas_194485: "那你能看看迪恩、里德什和科特内斯给你的任务吗？"
  npc_override_rebel_in_quests_16_2_then_you_re_going_told_49ee67: "那你要挨骂了。"
