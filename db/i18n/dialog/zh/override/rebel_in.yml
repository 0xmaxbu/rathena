  npc_override_rebel_in_quests_16_2_there_nothing_more_we_wa_8234db: "我们别无所求。现在让我们结束谈话。"
  npc_override_rebel_in_quests_16_2_there_only_old_people_le_deb483: "村子里只剩下老人。所以对艾琳来说一定很无聊。但她不想搬到另一个村子，因为她相信她的父母总有一天会回来。"
