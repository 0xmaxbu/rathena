  npc_override_rebel_in_quests_16_2_enter_military_base_18e100: "进入军事基地。"
  npc_override_rebel_in_quests_16_2_enter_rebellion_arena_c68a6f: "进入反叛军竞技场"
  npc_override_rebel_in_quests_16_2_enter_waiting_room_56d485: "进入等候室。"
  npc_override_rebel_in_quests_16_2_equipment_destroyed_quic_420e77: "设备很快被摧毁了。然后我意识到维罗看起来有点不正常。他生病了吗？"
