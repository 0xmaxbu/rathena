  npc_override_rebel_in_quests_16_2_we_must_destroy_before_t_aa6fb6: "我们必须在他们意识到装备物品正被逐一摧毁之前摧毁这个。快点把它们带来。"
  npc_override_rebel_in_quests_16_2_we_must_go_rebellion_201cf4: "我们必须去反叛者那里。"
  npc_override_rebel_in_quests_16_2_we_must_make_definite_pl_75dc9f: "我们必须制定一个明确的计划来解决这个情况。"
  npc_override_rebel_in_quests_16_2_we_must_quickly_so_enemy_02a189: "我们必须快速行动，这样即使敌人察觉到也无法采取任何对策。"
