  npc_override_rebel_in_quests_16_2_you_most_dangerous_guy_h_3e4493: "你是这里最危险的人！"
  npc_override_rebel_in_quests_16_2_you_must_been_devastated_3f9167: "你一定很崩溃……"
  npc_override_rebel_in_quests_16_2_you_must_been_ready_die_b8c866: "你来这里的时候一定已经做好了死的准备。所以我会说这是你生命的代价。"
  npc_override_rebel_in_quests_16_2_you_must_bruno_9ca8de: "还有……你一定是布鲁诺？"
  npc_override_rebel_in_quests_16_2_you_must_confusing_me_so_379a81: "你一定把我错认成别人了……"
