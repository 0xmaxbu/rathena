  npc_override_rebel_in_quests_16_2_we_get_rid_them_b98fbb: "我们除掉他们！"
  npc_override_rebel_in_quests_16_2_we_give_you_information_63e6d9: "我们给你信息，解除对设施的监视和法律限制。"
  npc_override_rebel_in_quests_16_2_we_give_you_some_more_0e6eda: "我们会再给你一些。请确保把它们带给那五个人。"
  npc_override_rebel_in_quests_16_2_we_go_somewhere_deep_ins_0b3270: "我们要去村子深处。从这里开始，只要相信我，跟着我。因为路有点复杂，我会留下^0000cd痕迹^000000。确保跟上。"
