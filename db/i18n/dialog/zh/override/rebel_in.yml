  npc_override_rebel_in_quests_16_2_every_place_there_hidden_8462d2: "在每个地方，都有一个隐藏的关鍵人物，即使你不容易看到那个人，也能推动整个团体。在这里，就是你。"
  npc_override_rebel_in_quests_16_2_every_single_moment_unex_2514b8: "每一刻都是出乎意料的。现在就做。"
