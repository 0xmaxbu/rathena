  npc_override_rebel_in_quests_16_2_i_m_vacation_now_cbab3b: "我从现在开始休假！"
  npc_override_rebel_in_quests_16_2_i_made_cookies_together_aacf4b: "我和贾娜一起做了饼干。昨天，我们一起读了一本书。明天我们将探索废弃的矿场……"
  npc_override_rebel_in_quests_16_2_i_made_various_stuffs_no_136a89: "而且我做了各种各样的东西，现在我用完了水晶……你介意帮我拿一些吗？"
  npc_override_rebel_in_quests_16_2_i_make_sure_you_get_1966d5: "我会确保你得到足够的补偿。"
  npc_override_rebel_in_quests_16_2_i_managed_get_detailed_d_af7d55: "我成功获得了关于那个人的详细数据，并在没有引起太多骚动的情况下获得了供词。"
