  npc_override_rebel_in_quests_16_2_then_we_must_go_back_3124b7: "那我们必须快点回去。"
  npc_override_rebel_in_quests_16_2_then_we_want_disable_ent_b4467c: "那我们要让企业彻底无法修复。"
