  npc_override_rebel_in_quests_16_2_i_never_imagined_i_sent_7c3a6f: "我从没想过我会被送到这个满是怪物的实验室！"
  npc_override_rebel_in_quests_16_2_i_never_imagined_i_trave_81e3bb: "我从没想过我会出国旅行……我希望一切顺利。"
  npc_override_rebel_in_quests_16_2_i_never_imagined_there_p_fac2cb: "我从没想过商店后面会有这样的地方……这是什么？"
  npc_override_rebel_in_quests_16_2_i_never_thought_you_d_d6f9fa: "我从没想过你真的会吃它们。你吃了吗？"
  npc_override_rebel_in_quests_16_2_i_never_trust_you_guys_ebcff5: "但我永远不会信任你们！我会盯着你们！！！"
  npc_override_rebel_in_quests_16_2_i_no_choice_let_s_4f9cbe: "（我别无选择。让我们准备战斗，再次和埃琳娜·沃尔科娃谈谈。）"
