  npc_override_rebel_in_quests_16_2_door_seems_locked_2293e8: "- 门似乎锁着 -"
  npc_override_rebel_in_quests_16_2_dried_filefish_fillet_yo_5437ce: "干鲂鱼片？你在卖吗？哦，我没有牙齿，所以不能吃。"
