  npc_override_rebel_in_quests_16_2_menu_options_34c67b: "{0}：为什么又是我！"
  npc_override_rebel_in_quests_16_2_menu_options_3b980f: "？？？：那块饼干一定值一大笔钱。"
  npc_override_rebel_in_quests_16_2_menu_options_3c09c9: "{0}：（那个人是谁？我只听到了声音。）"
  npc_override_rebel_in_quests_16_2_menu_options_3c9f69: "{0}：嘿，你太过分了！"
