  npc_override_rebel_in_quests_16_2_we_cannot_stick_same_spo_df1347: "我们不能永远停留在同一个地方。"
  npc_override_rebel_in_quests_16_2_we_cannot_teleport_immed_0d9648: "摧毁后我们不能立即传送。我告诉过你，我自己却忘了！真丢脸。"
