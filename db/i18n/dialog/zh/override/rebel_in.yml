  npc_override_rebel_in_quests_16_2_thanks_e0935c: "……谢谢。"
  npc_override_rebel_in_quests_16_2_thanks_event_heine_famil_db0131: "多亏这次事件，海涅家族学到了很多。"
  npc_override_rebel_in_quests_16_2_thanks_go_get_her_please_650624: "谢谢！去把她带回来吧。"
  npc_override_rebel_in_quests_16_2_thanks_his_support_i_rec_70ddf8: "多亏他的支持，我恢复了自己。然后我搬到了艾音布罗克，种了这棵树来纪念艾琳。"
