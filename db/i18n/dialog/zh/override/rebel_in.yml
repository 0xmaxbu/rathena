  npc_override_rebel_in_quests_16_2_i_after_sleeping_85b034: "我睡完觉再做。"
  npc_override_rebel_in_quests_16_2_i_agree_you_agree_too_98866c: "我同意。你也同意吗？"
  npc_override_rebel_in_quests_16_2_i_also_extremely_sad_hea_a72a9b: "听到你的遭遇我也非常难过。而且我一直在寻找机会见你并和你谈谈。"
