  npc_override_rebel_in_quests_16_2_no_why_did_i_volunteer_3d19d1: "不……我为什么要自愿做这个？"
  npc_override_rebel_in_quests_16_2_no_wonder_they_started_t_fb33ac: "难怪他们开始谈论戈尼。看起来他们从开始就隐瞒了什么！"
  npc_override_rebel_in_quests_16_2_no_wonder_we_word_secret_96e6c0: "难怪我们的名字里有'秘密'这个词。这就是为什么我在任务中如此小心。"
  npc_override_rebel_in_quests_16_2_no_wonder_you_symbol_fai_fe9c35: "难怪你是信仰的象征！！现在，我们可以等待前辈和工作人员。对吧？"
  npc_override_rebel_in_quests_16_2_no_you_don_t_please_98f61c: "不，你不必。下次请在别人面前表达你的意见。"
  npc_override_rebel_in_quests_16_2_no_you_t_i_don_bddb9f: "不，你不能！我不知道你是谁。但请救救我！"
  npc_override_rebel_in_quests_16_2_nonsense_65a0ea: "这是胡说八道。"
  npc_override_rebel_in_quests_16_2_norgroad_horizon_please_b862c5: "诺格罗德地平线，请。"
  npc_override_rebel_in_quests_16_2_normally_there_strong_wi_2a023a: "通常，时不时会有强风。但那天，风强到足以熄灭灯光。然后……"
  npc_override_rebel_in_quests_16_2_normally_they_just_pass_133407: "通常他们只是路过……"
  npc_override_rebel_in_quests_16_2_normally_they_say_fire_s_accd58: "通常他们说火在熄灭前最强。所以我的理论集中在装置出现一会儿，然后在火把熄灭前迅速消失的事实上。"
  npc_override_rebel_in_quests_16_2_normally_they_use_iron_d_3b2622: "通常他们使用从矿里挖出的铁。但由于无法满足需求，也消耗了很多废旧铁。我们家买了铁然后转卖。"
  npc_override_rebel_in_quests_16_2_nothing_1b3f14: "没什么。"
  npc_override_rebel_in_quests_16_2_nothing_happened_aa941e: "但什么也没发生。"
  npc_override_rebel_in_quests_16_2_now_0029a8: "目前。"
  npc_override_rebel_in_quests_16_2_now_5f263e: "不是现在？"
  npc_override_rebel_in_quests_16_2_now_die_5666e8: "现在，死吧。"
  npc_override_rebel_in_quests_16_2_now_generation_shifted_t_382e06: "现在世代已经更替。今天是老一代的最后一天，也是新一代的第一天。而你就是连接。"
  npc_override_rebel_in_quests_16_2_now_i_count_you_dad4a9: "现在，我靠你了。"
  npc_override_rebel_in_quests_16_2_now_i_don_t_here_25ed7c: "现在，我不必再待在这里了。"
  npc_override_rebel_in_quests_16_2_now_i_feel_like_everythi_01463d: "现在我感觉一切都恢复正常了。"
  npc_override_rebel_in_quests_16_2_now_i_give_you_leaflets_ed8117: "现在！我给你传单。再见！"
  npc_override_rebel_in_quests_16_2_now_i_go_sleep_see_fd2faf: "现在我要进去睡觉了。再见！"
  npc_override_rebel_in_quests_16_2_now_i_let_you_know_c158a8: "现在，我会让你知道未来的计划。"
  npc_override_rebel_in_quests_16_2_now_i_m_counting_rookie_663a56: "现在我靠菜鸟了！"
  npc_override_rebel_in_quests_16_2_now_i_pay_more_attention_e3873d: "从现在起，我会更加关注你。"
  npc_override_rebel_in_quests_16_2_now_i_see_you_c53605: "现在我能看到你了。"
