  npc_override_rebel_in_quests_16_2_way_what_brought_you_her_638bfc: "顺便说一下，什么风把你吹来了？我以为你已经办完事了。"
  npc_override_rebel_in_quests_16_2_way_what_happened_gonie_8d9d68: "顺便说一下，戈尼那次发生了什么事？"
  npc_override_rebel_in_quests_16_2_way_what_place_since_the_59f8b7: "顺便说一下，这是什么地方？既然有这么多枪，我猜这是军械库。"
  npc_override_rebel_in_quests_16_2_way_what_we_doing_here_04e335: "顺便说一下，我们在这里做什么？我们不是应该在^0000cd艾音贝赫^000000见面吗？我等了很久，然后来了这里。然后我发现你在这里。"
  npc_override_rebel_in_quests_16_2_way_what_you_doing_here_13f9d8: "顺便说一下，你在这里做什么？"
  npc_override_rebel_in_quests_16_2_way_where_cookies_10636b: "……顺便说一下，饼干在哪里？"
  npc_override_rebel_in_quests_16_2_we_262f7b: "我们……"
  npc_override_rebel_in_quests_16_2_we_about_experiment_degr_9efb52: "我们即将根据火药量实验火力程度！"
  npc_override_rebel_in_quests_16_2_we_all_right_our_power_4e8dc3: "我们只靠自己的力量就够了。"
