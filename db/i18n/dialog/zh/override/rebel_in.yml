  npc_override_rebel_in_quests_16_2_i_never_forget_day_5d00ba: "我永远不会忘记那一天！"
  npc_override_rebel_in_quests_16_2_i_never_forgive_you_who_23fe1c: "我永远不会原谅你抛弃了我！！！"
