  npc_override_rebel_in_quests_16_2_i_think_i_heard_s_9af37b: "我想我听说他们一直在这样做……从那以后。"
  npc_override_rebel_in_quests_16_2_i_think_i_misheard_somet_cf6ecc: "我想我现在听错了什么。"
  npc_override_rebel_in_quests_16_2_i_think_i_seen_phantom_ffcc14: "我想我看到了幻影。你想读吗？"
