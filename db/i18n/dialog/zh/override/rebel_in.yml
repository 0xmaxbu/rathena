Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_rebel_in_quests_16_2_about_monster_central_ro_24b804: "关于中央房间的怪物"
  npc_override_rebel_in_quests_16_2_about_result_i_inform_yo_a4c01c: "关于结果，我稍后会通知你！"
  npc_override_rebel_in_quests_16_2_about_time_year_when_min_056965: "还有……关于那一年的这个时候，当时矿场还没有关闭。我听说有传言说矿场深处有叫做反叛军的坏人。"
  npc_override_rebel_in_quests_16_2_about_twins_our_unit_you_7d0167: "关于我们部队里的双胞胎？你是个冒险者。为什么要问我这种事？"
  npc_override_rebel_in_quests_16_2_accept_3e1999: "接受。"
  npc_override_rebel_in_quests_16_2_according_government_sch_4621f5: "根据施瓦茨瓦尔德政府的规定，为了防止魔法过度使用，村庄内禁止使用传送。但这只是无稽之谈。"
  npc_override_rebel_in_quests_16_2_according_nihil_person_b_05c4ff: "根据尼希尔的说法，管家背后的人很可能在里希塔乐镇。"
  npc_override_rebel_in_quests_16_2_according_our_agent_reke_1860a5: "根据我们的特工报告，雷根贝勒和政府现在认真起来了。"
  npc_override_rebel_in_quests_16_2_according_regulation_we_e2da5b: "根据规定，我们必须将他们开除。"
  npc_override_rebel_in_quests_16_2_actually_i_military_grou_d56c09: "实际上，我心里有一个军事团体想和我们合作。我相信你知道他们。"
  npc_override_rebel_in_quests_16_2_actually_s_something_we_415ff6: "实际上，这是我们从未想过的事情……"
  npc_override_rebel_in_quests_16_2_actually_there_another_t_90a5b1: "实际上，在宴会上斯皮卡还给克鲁克斯安排了另一个任务。"
  npc_override_rebel_in_quests_16_2_actually_there_much_said_5e2874: "实际上，内利乌斯家族尊贵的女儿还有很多话要说。"
  npc_override_rebel_in_quests_16_2_actually_they_more_like_2adeed: "实际上……他们更像是怪物。"
  npc_override_rebel_in_quests_16_2_addition_real_master_mus_b9064a: "除此之外，真正的大师还必须用眼睛和耳朵去确认。"
  npc_override_rebel_in_quests_16_2_adventure_busy_you_shoul_515c35: "冒险者很忙！你不应该问这种事！"
  npc_override_rebel_in_quests_16_2_adventurer_2439c4: "冒险者？"
  npc_override_rebel_in_quests_16_2_adventurer_almighty_cab60b: "冒险者不是万能的。"
  npc_override_rebel_in_quests_16_2_adventurer_approved_roya_9ee6e6: "获得卢恩-米德加尔特王室认可的冒险者将与我们一同执行这次任务。"
  npc_override_rebel_in_quests_16_2_adventurer_aren_t_isn_t_7cc91b: "冒险者~现在不冷吗？"
  npc_override_rebel_in_quests_16_2_adventurer_busy_9604b0: "冒险者很忙。"
  npc_override_rebel_in_quests_16_2_adventurer_busy_now_what_accf69: "冒险者现在很忙。你在说什么？"
  npc_override_rebel_in_quests_16_2_adventurer_calm_down_let_cdf0e3: "冒险者，冷静。让我来处理这个。保存你的体力。"
  npc_override_rebel_in_quests_16_2_adventurer_could_you_ple_db0b26: "冒险者，你能去问问贾娜吗？"
  npc_override_rebel_in_quests_16_2_adventurer_did_you_rest_a2a9f7: "冒险者，你休息好了吗？我完成修理后休息得很好。我知道你不关心这个，但我在你问我之前先告诉你。"
  npc_override_rebel_in_quests_16_2_adventurer_don_t_worry_a_5fd2d8: "冒险者，别担心赛昂。我会照顾这家伙的。"
  npc_override_rebel_in_quests_16_2_adventurer_good_luck_i_t_043193: "冒险者，祝你好运！我会和菜鸟聊聊的。振作起来。"
  npc_override_rebel_in_quests_16_2_adventurer_here_65727c: "冒险者在这里？"
  npc_override_rebel_in_quests_16_2_adventurer_how_you_met_a_ebb2e7: "冒险者！怎么样了？你见过他们所有人并说服他们了吗？还没有？我猜也是。如果你去2楼，你可以见到他们所有人。"
  npc_override_rebel_in_quests_16_2_adventurer_how_your_busi_93e3d0: "冒险者，你的生意怎么样？懒鬼告诉我可以完全信任你。"
  npc_override_rebel_in_quests_16_2_adventurer_i_don_t_know_dd7931: "冒险者，我不知道这是不是真的。但你介意帮我们把他们带来吗？"
  npc_override_rebel_in_quests_16_2_adventurer_i_know_you_d_de4921: "冒险者。我知道你很快就会离开我。"
  npc_override_rebel_in_quests_16_2_adventurer_i_need_long_t_3e83b0: "冒险者，从现在起我需要进行一次长谈。所以我靠你了。当你去那里时，别忘了用那个地方。我是说'那个地方'。"
  npc_override_rebel_in_quests_16_2_adventurer_i_told_you_ta_d1be32: "冒险者？我告诉过你要好好休息。不是吗？"
  npc_override_rebel_in_quests_16_2_adventurer_please_go_the_6821a2: "冒险者，请先去那里。"
  npc_override_rebel_in_quests_16_2_adventurer_please_search_f053ae: "冒险者，请搜索^4d4dff北部和东北部区域^000000。"
  npc_override_rebel_in_quests_16_2_adventurer_please_take_c_df8b96: "冒险者，请负责北部和东北部区域。"
  npc_override_rebel_in_quests_16_2_adventurer_please_take_g_887002: "冒险者，请今天好好休息。你必须照顾好自己。"
  npc_override_rebel_in_quests_16_2_adventurer_s_time_you_ta_41c3c4: "冒险者，是时候采取行动了。请说服他们。"
  npc_override_rebel_in_quests_16_2_adventurer_seems_like_yo_8cb134: "冒险者，看来你付出了很多努力！"
  npc_override_rebel_in_quests_16_2_adventurer_try_heal_man_d2a5e9: "冒险者，试着治疗这个人。虽然他有伤，但不严重。因为他是因为虚脱而倒下的，所以简单的治疗就能让他恢复。一旦他醒来，我会从他那里获取所有信息。"
  npc_override_rebel_in_quests_16_2_adventurer_you_brought_t_f5c56b: "冒险者！你把他们都带来了吗？让我看看。"
  npc_override_rebel_in_quests_16_2_adventurer_you_know_how_25b08e: "冒险者，你知道怎么抄近路。我喜欢这一点。"
  npc_override_rebel_in_quests_16_2_adventurer_you_must_pers_3727de: "冒险者{0}？你一定是卢恩-米德加尔特王宫里那个人……"
  npc_override_rebel_in_quests_16_2_adventurer_you_must_tire_3ae0d4: "冒险者，你今天一定累了。休息一下，等^0000cd明天天亮^000000后再回来。"
  npc_override_rebel_in_quests_16_2_adventurer_you_re_late_560c71: "冒险者，你迟到了。"
  npc_override_rebel_in_quests_16_2_adventurer_you_symbol_fa_7253e5: "冒险者。你是信仰的象征。请去向他们展示你的信仰。这样就能解决一切。你刚才看到我做了什么吗？照我做的做。"
  npc_override_rebel_in_quests_16_2_advice_repairing_weapons_53703a: "修理武器的建议？嗯，但你不是铁匠，对吧？"
  npc_override_rebel_in_quests_16_2_after_all_he_been_burden_06e1f9: "毕竟，即使我们留下他，他也会成为我们的负担。"
  npc_override_rebel_in_quests_16_2_after_all_i_hope_you_428dfe: "毕竟，我希望你能尽快找到你要找的东西。"
  npc_override_rebel_in_quests_16_2_after_all_she_put_me_142a35: "毕竟，她把我安排在这个位置作为她的替代者，并在做她必须做的事。"
  npc_override_rebel_in_quests_16_2_after_all_what_we_need_6e8c1f: "毕竟，我们需要的是对^4d4dff设施^000000的调查。"
  npc_override_rebel_in_quests_16_2_after_being_deployed_act_a2c08f: "部署到实际战斗后，他们惹了麻烦然后逃跑了。我不知道为什么他们被称为天才。像我这样的人也能被称为天才。"
  npc_override_rebel_in_quests_16_2_after_betraying_rival_sa_de7ade: "背叛了同一领域的竞争对手后，我得到了升级的秘密方法。从那以后，我就像这样在暗处工作……哦，算了。这不是个愉快的故事。"
  npc_override_rebel_in_quests_16_2_after_finding_researcher_e25e22: "找到研究人员后，请将他们交给附近反叛军小队的成员。"
  npc_override_rebel_in_quests_16_2_after_incident_they_neve_dc3634: "那次事件之后，他们再也没来过。只是听到关于他们的故事，我就不觉得他们是我以前认识的那些孩子了。"
  npc_override_rebel_in_quests_16_2_after_jana_had_such_hard_3b8418: "在那之后。贾娜经历了很艰难的时期。"
  npc_override_rebel_in_quests_16_2_after_listening_what_you_9b0b06: "听了你说的话后，我并不完全信任你。但我觉得不得不信任你。"
  npc_override_rebel_in_quests_16_2_after_mercenary_rebellio_6152cb: "佣兵反叛之后，那些反对企业的人联合起来建立了反叛军。"
  npc_override_rebel_in_quests_16_2_after_they_moved_usu_bec_55bb61: "在那之后，他们被调到了USU，接受了更多教育等等。引起了一阵骚动。"
  npc_override_rebel_in_quests_16_2_after_waiting_while_you_d669d1: "等了一会儿后，你收回了凤尾鱼饼干。"
  npc_override_rebel_in_quests_16_2_after_working_hard_all_d_f05d50: "辛苦工作了一整天后，我喜欢看着铁路、抽着烟。那是我人生的乐趣。"
  npc_override_rebel_in_quests_16_2_again_8c0021: "不要再来了！！！"
  npc_override_rebel_in_quests_16_2_again_if_you_broke_your_c7f33d: "又来了？如果你弄坏了武器然后假装弄丢了，想都别想。"
  npc_override_rebel_in_quests_16_2_agenda_robe_fd38a1: "议事长袍"
  npc_override_rebel_in_quests_16_2_agent_named_lazy_waiting_59da24: "一个名叫^4d4dff懒鬼^000000的特工将在^4d4dff艾音布罗克火车站^000000等你。"
  npc_override_rebel_in_quests_16_2_agent_named_lazy_waiting_d4fd9c: "一个名叫^4d4dff懒鬼^000000的特工正在等我们。"
  npc_override_rebel_in_quests_16_2_agent_named_lazy_waiting_e8821e: "一个名叫懒鬼的特工正在等你。"
  npc_override_rebel_in_quests_16_2_agree_what_7dd4ba: "同意什么？"
  npc_override_rebel_in_quests_16_2_ah_2d0cf1: "啊~"
  npc_override_rebel_in_quests_16_2_ah_8b44c1: "啊……那是……"
  npc_override_rebel_in_quests_16_2_ah_cf07cb: "啊！"
  npc_override_rebel_in_quests_16_2_ah_don_t_misunderstand_i_329d0a: "啊，别误会。我不是说要和你战斗。我是说我会站在你这边。"
  npc_override_rebel_in_quests_16_2_ah_enough_quantity_adven_a71e56: "啊！！！！数量不够！！！冒险者，感谢你帮助我们。但这还不够！"
  npc_override_rebel_in_quests_16_2_ah_hero_8bc1cd: "啊……英雄。"
  npc_override_rebel_in_quests_16_2_ah_i_hate_cleaning_why_1f4b09: "啊，我讨厌打扫。为什么他们不开发一种自动打扫的机器呢？"
  npc_override_rebel_in_quests_16_2_ah_i_m_so_hungry_41b215: "啊，我好饿。今天巡逻时什么都没发生。"
  npc_override_rebel_in_quests_16_2_ah_i_miss_him_94c9f0: "……啊……我想他了。"
  npc_override_rebel_in_quests_16_2_ah_i_see_6994e3: "啊！我明白了。"
  npc_override_rebel_in_quests_16_2_ah_ilya_person_keeps_irr_f712a8: "啊，伊利亚。那个人一直烦我。"
  npc_override_rebel_in_quests_16_2_ah_my_heart_beating_fast_5854f4: "啊！我的心又跳得很快了！"
  npc_override_rebel_in_quests_16_2_ah_rupert_655dd8: "啊！！鲁伯特！"
  npc_override_rebel_in_quests_16_2_ah_sir_s_what_i_7810e3: "啊！先生，我不是那个意思……你简要地向反叛军领袖报告了你和维罗一起做的事。"
  npc_override_rebel_in_quests_16_2_ah_yes_we_closed_today_734948: "啊……是的。我们今天关门了。请改天再来。"
  npc_override_rebel_in_quests_16_2_ah_you_arrived_8a6757: "啊，你到了吗？"
  npc_override_rebel_in_quests_16_2_aha_you_advanturer_950321: "啊哈，你是个冒险者。"
  npc_override_rebel_in_quests_16_2_ahaha_i_ve_got_disease_1fc043: "啊哈哈。我得了一种坐不住的病。顺便说一下……作为客人，我不能空手而来。这是朱诺的特产……请尝尝。"
  npc_override_rebel_in_quests_16_2_ahem_ahem_e279a7: "咳咳，咳咳。"
  npc_override_rebel_in_quests_16_2_aigu_hehe_aigu_everyone_e03122: "哎呦？呵呵。哎呦是大家的偶像。"
  npc_override_rebel_in_quests_16_2_all_because_air_here_ed41e3: "这都是因为这里的空气！"
  npc_override_rebel_in_quests_16_2_all_i_get_around_place_2e26c2: "我在这个地方{0}能找到的所有东西。我用它们做不出什么好东西。"
  npc_override_rebel_in_quests_16_2_all_i_get_around_place_6b7980: "我在这个地方能找到的所有东西只有散发着难闻气味的黄油和枯萎的草药。我用它们做不出什么好东西。"
  npc_override_rebel_in_quests_16_2_all_i_tell_you_e66202: "这就是我能告诉你的全部。"
  npc_override_rebel_in_quests_16_2_all_sudden_maybe_now_219fd3: "突然？也许现在不是时候……"
  npc_override_rebel_in_quests_16_2_all_sudden_well_i_always_94005e: "突然？嗯，我一直喜欢工作。"
  npc_override_rebel_in_quests_16_2_all_us_also_eager_prepar_35afc2: "我们所有人也都很急切，准备了很多东西。我们不应该让那个人失望~"
  npc_override_rebel_in_quests_16_2_all_we_hope_now_peter_f006c3: "我们现在只希望住院的彼得能醒来。"
  npc_override_rebel_in_quests_16_2_all_we_insert_star_crumb_bcaeb7: "我们要做的就是插入星之碎屑。所以一旦你带来它，我们就可以马上离开。"
  npc_override_rebel_in_quests_16_2_already_515cdd: "已经？"
  npc_override_rebel_in_quests_16_2_alright_17187c: "好吧。"
  npc_override_rebel_in_quests_16_2_alt_older_brother_c19146: "阿尔特有个哥哥。"
  npc_override_rebel_in_quests_16_2_although_committed_enter_cd5612: "……虽然这是企业犯下的罪行，但我们不能否认它发生在我们的国家。所以我们必须承担一些责任。"
  npc_override_rebel_in_quests_16_2_although_fritz_i_involve_6968f2: "虽然弗里茨和我都参与其中，但尼希尔在国内事务方面做得相当不错。"
  npc_override_rebel_in_quests_16_2_although_he_any_talent_c_b95544: "虽然他在商业方面没有任何天赋，但他偶然误解了什么。现在他太兴奋了，同时做的事情太多了。"
  npc_override_rebel_in_quests_16_2_although_he_sent_you_her_0c4108: "虽然是他派你来的，但你不能进去。"
  npc_override_rebel_in_quests_16_2_although_i_bring_these_v_25af77: "虽然我把这些带到村庄的长椅或广场，但没有村民会拿传单。"
  npc_override_rebel_in_quests_16_2_although_i_cannot_give_y_4a8bdc: "虽然我不能给你钱，但让我给你这个。"
  npc_override_rebel_in_quests_16_2_although_i_cannot_help_y_e92886: "……虽然我不能在身体上帮助你，"
  npc_override_rebel_in_quests_16_2_although_i_leashed_them_4fd96e: "虽然我用皮带拴住了它们，但它们一直想着逃跑……"
  npc_override_rebel_in_quests_16_2_although_i_m_expert_yet_5c2e2a: "虽然我还不是专家，但我想在不让大师或小队成员担心的情况下解决问题。"
  npc_override_rebel_in_quests_16_2_although_i_wasn_t_direct_6b774e: "虽然我没有直接参与其中，但我也不想帮你。"
  npc_override_rebel_in_quests_16_2_although_mission_started_976723: "虽然任务开始得不同寻常，但这确实是一个了不起的成就。"
  npc_override_rebel_in_quests_16_2_although_my_private_requ_919163: "虽然这是我的私人请求，但我希望你能帮我做这件事。"
  npc_override_rebel_in_quests_16_2_although_s_long_story_te_112c23: "虽然对一个陌生人来说这是个很长的故事，但我会告诉你。而且你是阿德勒先生派来的……"
  npc_override_rebel_in_quests_16_2_although_s_my_guess_i_99bfbe: "虽然这是我的猜测，但我相当确定。"
  npc_override_rebel_in_quests_16_2_although_s_only_small_nu_77185a: "虽然人数不多，但有一些特工正在进行信息战。"
  npc_override_rebel_in_quests_16_2_although_there_been_mino_daf08f: "虽然发生了一起小事故，但现在我们又有两个禁止传送设备要摧毁。"
  npc_override_rebel_in_quests_16_2_although_there_dust_your_a76156: "虽然你的鞋上有灰尘，但你的枪必须永远闪亮……这就是所谓的'硬汉风格'！"
  npc_override_rebel_in_quests_16_2_although_they_all_novice_0b8e8b: "虽然他们都是新手，但在击败秘翼时他们可能会成为我们的障碍。"
  npc_override_rebel_in_quests_16_2_although_they_come_here_9bb69e: "虽然他们是带着可疑目的来的，但他们确实一路把受伤的戈尼带到了这里。规矩点，老家伙们。"
  npc_override_rebel_in_quests_16_2_although_they_quite_frig_2121be: "虽然他们相当可怕……但他们都是好人。"
  npc_override_rebel_in_quests_16_2_although_they_said_accid_a07e5a: "虽然他们说那是意外，但有传言。"
  npc_override_rebel_in_quests_16_2_although_they_young_thei_b02383: "虽然他们很年轻，但他们的能力很出众。问题是他们失控了。"
  npc_override_rebel_in_quests_16_2_although_time_passes_doe_04a056: "虽然时间流逝，但并不意味着过去就会消失！"
  npc_override_rebel_in_quests_16_2_although_we_destroyed_eq_582050: "虽然我们摧毁了设备，但还有一些魔力残留。因此，这个区域暂时无法进行传送。"
  npc_override_rebel_in_quests_16_2_although_we_kill_them_mo_213d82: "虽然我们杀了他们，但更多的会从某个地方冒出来。我出来休息一会儿。"
  npc_override_rebel_in_quests_16_2_although_we_let_them_wha_5b7927: "虽然我们让他们在外面随心所欲，但我们会教他们谁牵着他们的绳子。"
  npc_override_rebel_in_quests_16_2_although_we_look_around_4f44d4: "虽然我们四处查看，但一无所知。"
  npc_override_rebel_in_quests_16_2_although_you_didn_t_come_45bc1c: "虽然你不必来这里，但你还是不辞辛劳。我是说……谢谢。"
  npc_override_rebel_in_quests_16_2_although_you_don_t_trust_f6efac: "虽然你不信任我，但请信任冒险者！"
  npc_override_rebel_in_quests_16_2_although_you_my_sister_i_f61f44: "虽然你是我妹妹，但我绝不会接受这个！"
  npc_override_rebel_in_quests_16_2_although_you_talk_him_he_9a5465: "虽然你和他谈话，但他根本不会听。"
  npc_override_rebel_in_quests_16_2_always_99cf84: "不总是……"
  npc_override_rebel_in_quests_16_2_any_case_fireplace_bless_15ea6b: "无论如何，那个壁炉是赐予我们很多东西的恩赐。但由于缺少柴火，火快要熄灭了。"
  npc_override_rebel_in_quests_16_2_any_case_i_try_best_e8bfc8: "无论如何，我会尽力做好我的本职工作。"
  npc_override_rebel_in_quests_16_2_any_case_we_destroy_all_6860f0: "无论如何，我们会摧毁安装在施瓦茨瓦尔德的所有'禁止传送设备'。"
  npc_override_rebel_in_quests_16_2_any_who_reads_definitely_64850e: "任何读到这个的人肯定会来这家店买81毫米迫击炮。"
  npc_override_rebel_in_quests_16_2_anyhow_he_must_1308d9: "……无论如何……他一定有。"
  npc_override_rebel_in_quests_16_2_anyhow_thank_you_your_su_6fbf4b: "无论如何，感谢你的支持。"
  npc_override_rebel_in_quests_16_2_anyone_else_oh_next_one_effe07: "还有别人吗……？哦，下一个是好心的^0000cd老太太，我是说女士^000000。然后你见到特种部队指挥官^0000cd厄斯特^000000……"
  npc_override_rebel_in_quests_16_2_anything_special_61909e: "有什么特别的吗？"
  npc_override_rebel_in_quests_16_2_anyway_government_overlo_dab7a4: "无论如何，政府出于各种原因一直在忽视残余势力。我确信政府仍然对此感到不安。"
  npc_override_rebel_in_quests_16_2_anyway_i_count_you_go_f7be78: "无论如何，我会靠你了。^0000cd从艾音贝赫下去，找到可疑的土堆^000000并调查它。然后请^0000cd带回大约三把破损的枪^000000。"
  npc_override_rebel_in_quests_16_2_anyway_i_like_adventurer_f14b22: "无论如何，我喜欢冒险者！我不会让冒险者走的！绝不！"
  npc_override_rebel_in_quests_16_2_anyway_i_ll_give_you_02a0bb: "无论如何，我会再给你凤尾鱼饼干。请保管好。这次，你带着慈善和凤尾鱼饼干一起回来！"
  npc_override_rebel_in_quests_16_2_anyway_if_you_bunch_toke_4b530b: "无论如何，如果你有一堆代币而且不打算扔掉，来找我。我们可以做个好交易。"
  npc_override_rebel_in_quests_16_2_anyway_let_s_get_here_502a3b: "无论如何，我们进去吧。"
  npc_override_rebel_in_quests_16_2_anyway_let_s_see_if_e42b1c: "无论如何，让我们看看那家伙会不会再出现。"
  npc_override_rebel_in_quests_16_2_anyway_our_agent_einbech_901d9b: "无论如何，我们在艾音贝赫的特工报告说，在货运列车末端出现了一个可疑装置，然后迅速消失了。问题是……"
  npc_override_rebel_in_quests_16_2_anyway_take_care_yoursel_7f5df6: "无论如何，照顾好自己。"
  npc_override_rebel_in_quests_16_2_anyway_we_think_about_me_3ef0c5: "无论如何，我们会在路上思考方法。你只要信任我，跟着我。只要你信任我，没有什么是不可能的。你可以在任何情况下信任我。"
  npc_override_rebel_in_quests_16_2_anyway_you_did_great_job_344261: "……无论如何，你做得很好。"
  npc_override_rebel_in_quests_16_2_anyway_you_touching_her_63c483: "无论如何，你会用手触摸她！"
  npc_override_rebel_in_quests_16_2_anyways_we_observe_centr_725906: "无论如何，我们必须观察中央房间的核心。"
  npc_override_rebel_in_quests_16_2_apart_fighting_i_like_as_4a95aa: "除了战斗之外……我想请你帮个忙。"
  npc_override_rebel_in_quests_16_2_apart_materials_60aded: "除了材料之外……"
  npc_override_rebel_in_quests_16_2_apparently_you_did_defea_5ac626: "显然，你没有击败^0000cd10个废炉^000000。我闻不到铁的味道。"
  npc_override_rebel_in_quests_16_2_appointed_place_einbroch_b8e118: "约定地点是^4d4dff艾音布罗克火车站^000000。"
  npc_override_rebel_in_quests_16_2_aren_t_you_adventurer_b2bfd2: "你不是冒险者吗？"
  npc_override_rebel_in_quests_16_2_aren_t_you_fd7cdc: "不是吗？"
  npc_override_rebel_in_quests_16_2_aren_t_you_going_fight_7ac454: "你不是要和我战斗吗？"
  npc_override_rebel_in_quests_16_2_arivero_yurhik_as_you_sa_02081b: "阿里韦罗·尤尔希克……正如你所说，那个神枪手的姓氏似乎和这里诺亚的一样。"
  npc_override_rebel_in_quests_16_2_arrggh_e7f002: "啊啊啊！！！"
  npc_override_rebel_in_quests_16_2_arrggh_i_only_go_far_23aa05: "啊啊啊……我只能走到这里了……"
  npc_override_rebel_in_quests_16_2_arrgh_00f2eb: "啊！！！！"
  npc_override_rebel_in_quests_16_2_arrgh_8fd5ab: "啊……"
  npc_override_rebel_in_quests_16_2_arrgh_charity_i_hope_the_a6c352: "啊……慈善……我希望他们在我墓碑上写下我是多么想念慈善而死的……"
  npc_override_rebel_in_quests_16_2_arrgh_every_single_part_11beb5: "啊……我身体的每个部位都在痛。"
  npc_override_rebel_in_quests_16_2_arrgh_yeah_f694ad: "啊，是啊！！"
  npc_override_rebel_in_quests_16_2_arrrgh_32f160: "啊啊啊！"
  npc_override_rebel_in_quests_16_2_arrrgh_especially_ms_ele_e1f05c: "啊啊啊，尤其是埃琳娜女士……她让我们受苦……"
  npc_override_rebel_in_quests_16_2_arrrgh_kid_67c6b8: "啊啊啊……那个孩子？"
  npc_override_rebel_in_quests_16_2_as_commander_volkova_sai_1ae9d4: "正如沃尔科娃指挥官所说，我把那些孩子带来了。"
  npc_override_rebel_in_quests_16_2_as_everyone_already_disa_d10620: "既然大家都已经对我们失望了，我们以为我们可以随心所欲……"
  npc_override_rebel_in_quests_16_2_as_far_as_i_remember_7fc314: "但据我所知，克拉纳·内米埃里没有叫阿里韦罗·尤尔希克的神枪手……"
  npc_override_rebel_in_quests_16_2_as_i_didn_t_see_8c601a: "但因为我没有亲眼看到，"
  npc_override_rebel_in_quests_16_2_as_i_expected_0d479d: "正如我所料…………"
  npc_override_rebel_in_quests_16_2_as_i_explained_before_in_800f6d: "正如我之前解释的，戒指的初始化相当困难。^ff0000成功率是80%。^000000如果失败，物品就会消失。你确定要这样做吗？"
  npc_override_rebel_in_quests_16_2_as_i_mentioned_before_ou_835a2e: "正如我之前提到的，我们最大的挑战是在没有任何武装冲突的情况下进入反叛军的秘密基地。这套服装就是为了这个目的。"
  npc_override_rebel_in_quests_16_2_as_i_promised_i_listen_bf050a: "正如我承诺的，我会听你说。说吧。"
  npc_override_rebel_in_quests_16_2_as_i_told_you_before_d1e11b: "正如我之前告诉你的，你是我们中最自由的人。"
  npc_override_rebel_in_quests_16_2_as_i_told_you_earlier_7e6d45: "正如我之前告诉你的，请想想阿德勒指挥官。"
  npc_override_rebel_in_quests_16_2_as_i_told_you_i_fcb50e: "正如我告诉你的，在你出现之前，我才是克拉纳·内米埃里最炙手可热的人！"
  npc_override_rebel_in_quests_16_2_as_i_told_you_s_f5c231: "正如我告诉你的，这是一个我们规定之外的单位。所以我不能详细告诉你。但我们确实做了一些反叛军不做的事情。"
  npc_override_rebel_in_quests_16_2_as_i_told_you_you_e29ab2: "正如我告诉你的，你不必这样做……你太执着了。"
  npc_override_rebel_in_quests_16_2_as_i_wrote_letter_35ad07: "正如我在信中写的。"
  npc_override_rebel_in_quests_16_2_as_if_you_going_far_f372c2: "好像你要去很远的地方？"
  npc_override_rebel_in_quests_16_2_as_long_as_there_just_52da4c: "只要有一个人信任你，你就可以无限成长。"
  npc_override_rebel_in_quests_16_2_as_long_as_there_magic_bd5134: "只要里面有魔法，同样的事情就会再次发生。"
  npc_override_rebel_in_quests_16_2_as_long_as_you_behave_2577d2: "只要你守规矩，他们就不会生你的气。……也许吧。"
  npc_override_rebel_in_quests_16_2_as_long_as_you_behave_ba9600: "只要你守规矩……就不会有什么坏事发生。也许……？"
  npc_override_rebel_in_quests_16_2_as_long_as_you_walk_1c9f09: "只要你^0000cd走在管道上^000000而不是楼梯上，那就是你的错。管道是无辜的。你怎么能这样对管道！"
  npc_override_rebel_in_quests_16_2_as_matter_fact_i_estimat_effc4c: "事实上，我稍微估算了一下。"
  npc_override_rebel_in_quests_16_2_as_matter_fact_she_canno_73d018: "……事实上，她不太会缝纫。"
  npc_override_rebel_in_quests_16_2_as_my_family_ignored_me_cd1a8e: "由于我的家人忽视了我，我决定离开家去寻找我能做的事情。"
  npc_override_rebel_in_quests_16_2_as_soon_as_you_drink_459047: "你喝完茶就马上离开~我们不会送你的！"
  npc_override_rebel_in_quests_16_2_as_they_got_old_they_9d04d2: "但随着他们变老，他们从前线退役了。现在他们喝着茶，看着年轻的反叛军成长。"
  npc_override_rebel_in_quests_16_2_as_they_occupied_place_t_4c7edd: "由于他们占领了这个地方，他们正在改造一些路线以建立训练营。"
  npc_override_rebel_in_quests_16_2_as_they_told_me_stand_6f4639: "由于他们让我待命，我可以坐在这里。"
  npc_override_rebel_in_quests_16_2_as_usual_please_find_res_0bd6cb: "像往常一样，请找到躲藏的研究人员并将他们交给反叛军小队成员。"
  npc_override_rebel_in_quests_16_2_as_vero_asked_me_i_f99d97: "正如维罗要求我的，我用火焰之心砸碎了禁止传送设备。"
  npc_override_rebel_in_quests_16_2_as_we_acted_our_pleasure_6ef137: "由于我们随心所欲地行动，情况变得越来越糟……所以我们很害怕……"
  npc_override_rebel_in_quests_16_2_as_written_letter_1723de: "正如信中写的。"
  npc_override_rebel_in_quests_16_2_as_you_always_shown_us_30130c: "因为你一直向我们展示诚实的信仰。"
  npc_override_rebel_in_quests_16_2_as_you_attempted_reclaim_52d917: "当你试图收回破损的枪时，土堆动了，突然有什么东西冒了出来。"
  npc_override_rebel_in_quests_16_2_as_you_helped_our_republ_81a5df: "由于你帮助了我们的共和国，阁下正在试图为你准备一些对冒险者有用的东西。"
  npc_override_rebel_in_quests_16_2_as_you_know_government_v_228165: "如你所知，政府与企业的关系不太好。而我们需要合作来获取企业的设施。"
  npc_override_rebel_in_quests_16_2_as_you_know_there_many_60b06a: "如你所知，艾音贝赫经常发生事故。"
  npc_override_rebel_in_quests_16_2_as_you_promised_me_just_82fe0f: "正如你向我承诺的，喝杯茶就回去。"
  npc_override_rebel_in_quests_16_2_as_you_put_years_your_84837c: "随着年龄增长，你的记忆力和判断力不如以前了。"
  npc_override_rebel_in_quests_16_2_as_you_wish_4d3029: "随你的便！"
  npc_override_rebel_in_quests_16_2_as_you_wish_dafe43: "如你所愿。"
  npc_override_rebel_in_quests_16_2_ask_him_again_ed22df: "再问他一次。"
  npc_override_rebel_in_quests_16_2_ask_them_about_incident_1ea957: "（向他们询问过去发生的事件……）"
  npc_override_rebel_in_quests_16_2_ask_them_directly_df4a1c: "直接问他们。"
  npc_override_rebel_in_quests_16_2_ask_them_if_they_know_1d6cf4: "问他们是否知道那天发生了什么。我敢打赌没人知道。除非我们谈论它，否则怎么会有人发现呢？"
  npc_override_rebel_in_quests_16_2_asked_you_0fe5f2: "这是{0}{1}要求你的。"
  npc_override_rebel_in_quests_16_2_authorized_personnel_onl_6c9c9b: "仅限授权人员。请勿靠近。"
  npc_override_rebel_in_quests_16_2_avoid_being_detected_duc_50ef58: "为了避免被发现，蹲下身子跟着我。"
  npc_override_rebel_in_quests_16_2_avoid_getting_caught_let_5ba1a6: "为了避免被抓，我们分散行动。"
  npc_override_rebel_in_quests_16_2_avoid_surveillance_enter_494f3f: "为了避免企业的监视，我们的总统秘密来到这里，然后立即回去了。"
  npc_override_rebel_in_quests_16_2_bang_4001b8: "砰！"
  npc_override_rebel_in_quests_16_2_basic_repair_all_over_308ee0: "基本修理全部完成了。"
  npc_override_rebel_in_quests_16_2_basic_repairing_all_over_aea4c4: "基本修理全部完成了。但你还没有带来星之碎屑。请尽快带来。"
  npc_override_rebel_in_quests_16_2_beautiful_cat_who_stays_997427: "就是那只漂亮的猫，就待在这里！在这个楼梯下的篮子里。"
  npc_override_rebel_in_quests_16_2_because_i_didn_t_enough_92bcd2: "这是因为我由于宴会缺乏足够的训练吗？我的健康可能有问题。"
  npc_override_rebel_in_quests_16_2_because_i_support_jana_i_7af919: "因为我必须支持贾娜。我会射杀任何对贾娜动手的人。"
  npc_override_rebel_in_quests_16_2_because_i_trust_crux_c05bf5: "因为我信任克鲁克斯。"
  npc_override_rebel_in_quests_16_2_because_jana_i_had_been_c06a23: "因为贾娜和我曾经非常自信我们会做得很好。"
  npc_override_rebel_in_quests_16_2_because_like_fine_magic_a4f97e: "因为它就像一块优质的魔法石。"
  npc_override_rebel_in_quests_16_2_because_these_busy_times_c6ec8f: "因为这些是忙碌的时期。"
  npc_override_rebel_in_quests_16_2_because_we_don_t_want_65a2af: "因为我们不想留下记录。我们绝不能被其他人发现。即使我们被抓住了，我们的移动路线也必须隐藏。移动路线可能是一个很大的线索。"
  npc_override_rebel_in_quests_16_2_because_you_like_see_my_e82fd4: "因为你喜欢看我的脚弄湿。"
  npc_override_rebel_in_quests_16_2_become_strong_you_need_o_10201d: "要变强，你需要一个机会。"
  npc_override_rebel_in_quests_16_2_becoming_more_serious_we_295a25: "这比我们预期的更严重。"
  npc_override_rebel_in_quests_16_2_been_better_if_we_saved_19dab8: "如果我们把它留给访客会更好。"
  npc_override_rebel_in_quests_16_2_before_i_came_here_i_2c84d7: "在我来这里之前，我知道坐在这里的人有权威，但我现在意识到这有点不同。"
  npc_override_rebel_in_quests_16_2_before_i_scold_you_about_9e5a61: "但在我为此责骂你之前……"
  npc_override_rebel_in_quests_16_2_before_laying_flower_you_df096a: "在献花之前，你检查了那棵树是不是对的。"
  npc_override_rebel_in_quests_16_2_before_they_trainees_had_0617a8: "在那之前，他们是学员，比其他小队成员有更多空闲时间。他们会偶尔来食堂，拿些零食，和我们聊天。"
  npc_override_rebel_in_quests_16_2_before_we_kill_you_all_9f0c71: "在我们杀光你们之前，我们绝无可能与你们合作！"
  npc_override_rebel_in_quests_16_2_being_able_share_confide_5bd089: "能够不拘礼节地分享秘密是很重要的。"
  npc_override_rebel_in_quests_16_2_being_mean_my_character_80f3c0: "……刻薄不是我的性格。这就是我不想和神职人员纠缠的原因……"
  npc_override_rebel_in_quests_16_2_being_nervous_you_cuter_dd745d: "紧张？你比我想象的更可爱。"
  npc_override_rebel_in_quests_16_2_belief_he_must_here_a6ef56: "相信他一定在这里！"
  npc_override_rebel_in_quests_16_2_beside_tree_small_grandm_60687f: "在树旁，一个小老太太伸出了手。"
  npc_override_rebel_in_quests_16_2_besides_i_don_t_much_79840e: "此外，我没有太多时间。"
  npc_override_rebel_in_quests_16_2_besides_you_re_just_adve_52f19b: "此外，你只是个冒险者。你与我们和那些人都没有关系。我担心你可能会受伤。"
  npc_override_rebel_in_quests_16_2_better_me_act_more_like_1b8d7c: "我表现得更像女孩子会不会更好？"
  npc_override_rebel_in_quests_16_2_big_picture_already_been_d2ddae: "大局已经定好了……"
  npc_override_rebel_in_quests_16_2_biggest_wish_my_life_col_4efbc5: "我一生中最大的愿望就是施瓦茨的崩溃！"
  npc_override_rebel_in_quests_16_2_blacksmiths_large_cities_228818: "大城市的铁匠会用艾尔特尼姆矿石交换艾尔特尼姆……请给我两块艾尔特尼姆。"
