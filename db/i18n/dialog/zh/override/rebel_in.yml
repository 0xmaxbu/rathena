  npc_override_rebel_in_quests_16_2_even_if_we_had_one_c01087: "即使我们有一个，我们也不会卖给你。"
  npc_override_rebel_in_quests_16_2_even_ridsh_cotnes_no_i_96df44: "即使里德什和科特内斯……？不。即使你亲口告诉我，我也不敢相信你同意。"
