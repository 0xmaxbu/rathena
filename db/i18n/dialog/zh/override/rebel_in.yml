  npc_override_rebel_in_quests_16_2_menu_options_146962: "{0}：真的吗？你确定我们要进去吗？"
  npc_override_rebel_in_quests_16_2_menu_options_15c856: "{0}：布鲁诺？"
  npc_override_rebel_in_quests_16_2_menu_options_1d5866: "{0}：我是你的秘书吗……！？"
  npc_override_rebel_in_quests_16_2_menu_options_27127b: "{0}：什么！什么？你为什么停止说话？"
