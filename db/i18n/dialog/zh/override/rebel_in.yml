  npc_override_rebel_in_quests_16_2_then_i_m_leaving_after_e3ca10: "那我喝完茶就走。"
  npc_override_rebel_in_quests_16_2_then_i_met_gonie_came_c4b548: "然后我遇到了戈尼，来到了这里。但我发现我在这里也帮不上什么忙。"
  npc_override_rebel_in_quests_16_2_then_i_no_choice_eat_c6a2ae: "那我别无选择，只能吃了。给我吧。"
  npc_override_rebel_in_quests_16_2_then_i_no_choice_taste_859691: "那，我别无选择，只能尝尝。给我吧。"
  npc_override_rebel_in_quests_16_2_then_i_t_tell_you_c9871a: "……那我不能告诉你。"
  npc_override_rebel_in_quests_16_2_then_let_me_go_too_cc9ab2: "那让我也去吧。"
  npc_override_rebel_in_quests_16_2_then_let_us_go_lighthalz_7fd4be: "那我们去^4d4dff里希塔乐镇^000000吧。"
  npc_override_rebel_in_quests_16_2_then_person_behind_him_m_9aaf10: "那他身后的人可能地位很高或有权力。或者他/她可能很有钱。"
