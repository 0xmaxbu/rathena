  npc_override_rebel_in_quests_16_2_i_am_pet_child_hunter_5c0d99: "我是宠物孩子猎人！"
  npc_override_rebel_in_quests_16_2_i_am_precious_so_i_b47a25: "我很珍贵，所以我应该看到和听到好东西。"
