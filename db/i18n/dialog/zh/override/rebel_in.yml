  npc_override_rebel_in_quests_16_2_don_t_forget_defeat_abou_47e7bb: "别忘了击败大约10个废炉！我会在床上睡觉。太冷了！"
  npc_override_rebel_in_quests_16_2_don_t_forget_fdd50e: "……别忘了。"
  npc_override_rebel_in_quests_16_2_don_t_give_lucky_too_8471a7: "不要给幸运太大压力。"
  npc_override_rebel_in_quests_16_2_don_t_just_standing_ther_1afcc0: "不要只是站在那里。坐在这里。"
