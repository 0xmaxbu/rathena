  npc_override_rebel_in_quests_16_2_therefore_i_like_ask_you_3555b3: "因此，我想请你帮个忙……实际上是几个。因为必须在外面完成。"
  npc_override_rebel_in_quests_16_2_therefore_older_please_i_651187: "因此{0}大哥哥，请为我们进行一次前期探索。"
  npc_override_rebel_in_quests_16_2_therefore_you_bring_your_76864f: "因此！你自己带这个！然后亲切地给每个人发传单。确保你面带微笑地亲手递到每个人手里。"
  npc_override_rebel_in_quests_16_2_these_anchovy_cookies_ch_710d37: "这些凤尾鱼饼干是查丽蒂最喜欢的零食。把饼干放在^0000CD村子各处的长椅^000000上，然后叫查丽蒂。如果她出来了，请把她带到我这里。"
  npc_override_rebel_in_quests_16_2_these_guys_quite_loud_f9790a: "这些家伙很吵。"
  npc_override_rebel_in_quests_16_2_these_mt_special_sunglas_67b8be: "这些是我的特制太阳镜。"
  npc_override_rebel_in_quests_16_2_these_only_enough_today_703a0e: "这些只够今天用。当然我们必须每天生火！"
  npc_override_rebel_in_quests_16_2_these_people_must_return_91d277: "这些人必须在紧急情况下快速返回，所以他们不能走太远。"
  npc_override_rebel_in_quests_16_2_these_people_really_rude_a57630: "这些人真的很粗鲁。"
  npc_override_rebel_in_quests_16_2_they_a459d2: "他们？"
  npc_override_rebel_in_quests_16_2_they_accept_our_proposal_cdc05e: "他们会接受我们的提议。"
  npc_override_rebel_in_quests_16_2_they_adults_babies_they_8b7ced: "他们是成年人，不是婴儿。他们可以照顾自己。"
  npc_override_rebel_in_quests_16_2_they_all_know_we_better_842b25: "他们都知道我们比成年人更有能力。"
  npc_override_rebel_in_quests_16_2_they_been_trainees_while_97b10c: "他们当了一段时间的实习生，几个月前第一次执行真正的任务。就在那时他们惹了麻烦。"
  npc_override_rebel_in_quests_16_2_they_bright_silver_hairs_b19cd7: "他们有着明亮的银发，总是形影不离。你很容易找到他们。"
  npc_override_rebel_in_quests_16_2_they_cannot_use_e9e2fc: "他们无法使用它。"
  npc_override_rebel_in_quests_16_2_they_cats_give_them_char_1ce5b5: "这是给猫的。给查丽蒂，然后把剩下的带回来。确保你不要吃。"
  npc_override_rebel_in_quests_16_2_they_claimed_you_had_mad_ffd71e: "他们本可以声称是你把事情搞得更糟了。"
  npc_override_rebel_in_quests_16_2_they_come_help_us_like_5028ca: "他们经常这样来帮助我们。"
  npc_override_rebel_in_quests_16_2_they_come_out_continuous_d374d9: "他们源源不断地出来。我无法想象他们做了多少实验。"
  npc_override_rebel_in_quests_16_2_they_doing_purpose_bced99: "他们是故意的吗？"
  npc_override_rebel_in_quests_16_2_they_don_t_look_so_12c7af: "他们看起来没那么强。"
  npc_override_rebel_in_quests_16_2_they_don_t_seem_our_6e1778: "他们看起来不像是我们的孩子。"
  npc_override_rebel_in_quests_16_2_they_enjoy_tea_time_ever_4ee2f0: "他们每天都享受茶点时间。"
  npc_override_rebel_in_quests_16_2_they_fascinated_my_talen_f81723: "他们被我有才华的开场白迷住了，所以忘了读传单的其余部分！"
  npc_override_rebel_in_quests_16_2_they_haven_t_found_out_ab5e23: "他们还没有找到确切的机制。"
  npc_override_rebel_in_quests_16_2_they_haven_t_read_my_c52dd6: "他们还没读我的传单！"
  npc_override_rebel_in_quests_16_2_they_idiots_who_cannot_e_2483c8: "他们是连自动目标都打不中的白痴。他们糟糕得像是故意没打中一样。"
  npc_override_rebel_in_quests_16_2_they_let_you_know_how_ff1379: "他们会告诉你怎么离开这里。"
  npc_override_rebel_in_quests_16_2_they_like_rats_trap_all_b665c6: "他们就像陷阱里的老鼠。我们要做的就是清理~我也要进去了。"
  npc_override_rebel_in_quests_16_2_they_look_like_lucky_s_708f36: "他们看起来像拉奇的顾客。"
  npc_override_rebel_in_quests_16_2_they_looking_you_everywh_f0a286: "他们到处在找你。你真受欢迎。不是吗？"
  npc_override_rebel_in_quests_16_2_they_material_type_chime_ffcdf4: "它们是^4d4dff物质型奇美拉和人型奇美拉^000000。"
  npc_override_rebel_in_quests_16_2_they_might_installed_gat_db35e0: "他们可能安装了传送门。我们必须先禁用它。"
  npc_override_rebel_in_quests_16_2_they_milo_mason_rachel_c_87b0b6: "他们是米洛、梅森、瑞秋、埃里克森指挥官和埃琳娜指挥官。"
  npc_override_rebel_in_quests_16_2_they_mortars_cannons_i_t_6ca9c8: "它们是迫击炮，不是大炮。我以为它们今天会卖出去……"
  npc_override_rebel_in_quests_16_2_they_must_been_hurry_eve_54a003: "他们一定很匆忙。所有东西都留在这里。"
  npc_override_rebel_in_quests_16_2_they_never_came_back_7b2292: "……而且他们再也没回来。"
  npc_override_rebel_in_quests_16_2_they_ones_who_owe_you_3085e3: "他们是欠你的人。"
  npc_override_rebel_in_quests_16_2_they_room_nd_floor_you_20a751: "他们在^0000cd二楼的房间^000000里。你可以上去见他们。"
  npc_override_rebel_in_quests_16_2_they_saved_gonie_s_life_895aac: "他们救了戈尼的命。他们来到安静的艾音贝赫。他们^0000cd偶然^000000发现了受伤的戈尼并治好了他。然后他们把他带到了^0000cd这里^000000。"
  npc_override_rebel_in_quests_16_2_they_say_we_d_better_3a6b22: "他们说我们最好搬到另一个地方。"
  npc_override_rebel_in_quests_16_2_they_say_we_had_outsider_c2996b: "他们说我们很久没外人来过了。而那个外人说服我们与政府合作。"
  npc_override_rebel_in_quests_16_2_they_say_you_no_one_eaae36: "他们说必须是你。没有别人……"
  npc_override_rebel_in_quests_16_2_they_seem_found_their_fo_5c2a8c: "他们似乎找回了原来的本色。很好。你做得很好。"
  npc_override_rebel_in_quests_16_2_they_skip_training_hurt_484ba9: "他们跳过训练，在训练期间造成事故伤害了一名队员……最近，他们试图逃离部队并被抓住。所以值班经理和我都很头疼。"
  npc_override_rebel_in_quests_16_2_they_so_bad_i_feel_8e18fd: "他们很坏。但同时我感到同情。"
  npc_override_rebel_in_quests_16_2_they_so_dangerous_9d379c: "他们没那么危险。"
  npc_override_rebel_in_quests_16_2_they_so_stupid_8c0e29: "但他们没那么蠢。"
  npc_override_rebel_in_quests_16_2_they_still_under_age_acc_c9ff62: "……但他们还是未成年人。据他们原部队的指挥官说，他们没有父母。"
  npc_override_rebel_in_quests_16_2_they_take_chance_start_r_ef23eb: "他们会趁机开始的，对吧？"
  npc_override_rebel_in_quests_16_2_they_their_own_weapons_y_194b41: "他们有自己的武器。你还借给他们更多？"
  npc_override_rebel_in_quests_16_2_they_told_me_come_here_57258d: "他们让我来这里。"
  npc_override_rebel_in_quests_16_2_they_told_me_meet_agent_f3d814: "他们让我去见秘密之翼的特工。会是那个人吗？嗯，不可能……"
  npc_override_rebel_in_quests_16_2_they_told_us_bring_them_a12bb7: "但……他们让我们带他们来。所以我们必须去把他们带来。"
  npc_override_rebel_in_quests_16_2_they_too_many_8e093a: "他们太多了！"
  npc_override_rebel_in_quests_16_2_they_took_training_witho_97a268: "他们毫无问题地完成了训练，射击成绩优异。他们很快就能扮演反叛者的角色。"
  npc_override_rebel_in_quests_16_2_they_used_better_than_i_794be4: "他们以前比这更好……希望你能照顾他们。"
  npc_override_rebel_in_quests_16_2_they_used_help_me_i_2da0d0: "他们以前帮我做这个。但我现在不能请求他们了。"
  npc_override_rebel_in_quests_16_2_they_ve_been_everywhere_e41b99: "他们无处不在！"
  npc_override_rebel_in_quests_16_2_they_worst_kids_i_don_00293b: "他们是最差劲的孩子。我不知道为什么我们要把他们留在这里。"
  npc_override_rebel_in_quests_16_2_things_been_decided_some_4f2393: "事情在某种程度上已经决定了。"
  npc_override_rebel_in_quests_16_2_those_guys_what_they_wan_17c406: "那些家伙想做他们想做的事，他们会再次需要你的帮助。"
  npc_override_rebel_in_quests_16_2_those_guys_who_destroyed_c928a7: "那些摧毁我们的家伙！"
  npc_override_rebel_in_quests_16_2_those_who_did_return_wea_56c071: "那些没有归还武器的人。"
  npc_override_rebel_in_quests_16_2_three_sheets_leaflets_i_26385a: "三张传单。靠你了。"
  npc_override_rebel_in_quests_16_2_ticket_gate_over_there_w_edb2cc: "检票口在那边！我们得付火车票钱。你是说我们走过去？"
  npc_override_rebel_in_quests_16_2_time_day_everyone_taking_408765: "这个时候，大家都在休息。请回去休息。"
  npc_override_rebel_in_quests_16_2_time_he_could_really_die_103e03: "这次，他可能真的会死。"
  npc_override_rebel_in_quests_16_2_time_i_make_no_mistake_4d79c5: "这次，我射击不会出错。"
  npc_override_rebel_in_quests_16_2_time_let_me_talk_them_3d9dab: "时间到了。让我现在和他们谈谈。"
  npc_override_rebel_in_quests_16_2_time_passing_rupert_9afb67: "时间在流逝。鲁珀特。"
  npc_override_rebel_in_quests_16_2_time_royal_family_us_so_0e3aed: "这次，{0}和皇室与我们同在。所以总统认为我们有很大的机会。"
  npc_override_rebel_in_quests_16_2_time_year_adler_children_731dbc: "每年的这个时候，阿德勒的孩子们总是在这个时候来找我，但今年我不能点蜡烛了。"
  npc_override_rebel_in_quests_16_2_time_you_just_infant_dia_3efc08: "那时，你还只是穿尿布的婴儿。你怎么会对他们了解这么多？"
  npc_override_rebel_in_quests_16_2_today_i_don_t_enough_7d8e2e: "今天我没有足够的神之金属。能请你给我带两块神之金属吗？"
  npc_override_rebel_in_quests_16_2_today_i_give_best_anchov_17f211: "今天……我要给查丽蒂最好的凤尾鱼饼干！"
  npc_override_rebel_in_quests_16_2_today_we_like_go_einbech_af959e: "今天，我们想去艾音贝赫矿研究炸药。但我想如果只有我们两个去会很危险。"
  npc_override_rebel_in_quests_16_2_token_honor_8c5b64: "荣誉代币？"
  npc_override_rebel_in_quests_16_2_totally_my_fault_my_mist_3f37b6: "这完全是我的错，我的失误。"
  npc_override_rebel_in_quests_16_2_train_carried_coal_mine_902e8a: "那是从矿上运煤的火车。因为是晚上，火车停了。嗯，他们说由于矿里有很多怪物，火车最近不常运营了。"
  npc_override_rebel_in_quests_16_2_trainees_7157fa: "实习生们！！！"
  npc_override_rebel_in_quests_16_2_traveler_you_came_again_a9ec99: "旅行者。你又来了。谢谢。"
  npc_override_rebel_in_quests_16_2_true_61ff56: "那……是真的吗？"
  npc_override_rebel_in_quests_16_2_true_f57d93: "这不是真的。"
  npc_override_rebel_in_quests_16_2_true_nihil_overstepped_h_98053c: "尼希尔确实在过程中越界了。但我们洗清了家族的耻辱。"
  npc_override_rebel_in_quests_16_2_trust_me_tell_adventurer_ecd587: "相信我。如果你有任何问题，告诉冒险者。"
  npc_override_rebel_in_quests_16_2_trying_respect_you_as_se_eff29a: "试图尊重你作为前辈，我一直容忍你的行为。然而，这次你越界了。"
  npc_override_rebel_in_quests_16_2_turned_off_torch_fire_ye_5aa20f: "熄灭的火把……火！！是的，是火。因为艾音贝赫是山区，即使平时偶尔也会刮大风。与往常不同的是火把被吹灭了。"
  npc_override_rebel_in_quests_16_2_twinkle_twinkle_little_s_d77b80: "一闪一闪小星星~我的流星，你依然美丽。"
  npc_override_rebel_in_quests_16_2_twins_nearby_place_where_673c98: "双胞胎会在他们一直在的地方附近。"
  npc_override_rebel_in_quests_16_2_type_air_critical_dry_sk_bf6b87: "这种空气对你这种干性皮肤很关键！"
  npc_override_rebel_in_quests_16_2_uhm_break_ambush_250f6e: "嗯？闯入还是伏击……"
  npc_override_rebel_in_quests_16_2_umm_anyway_what_we_find_ce5c52: "嗯。总之，我们要做的是在里希塔乐镇找到那个家伙。"
  npc_override_rebel_in_quests_16_2_unexpected_result_115cdf: "这是个意想不到的结果。"
  npc_override_rebel_in_quests_16_2_unfair_i_ve_been_victimi_ce54b3: "这不公平。我是受害者！父亲！母亲！！"
  npc_override_rebel_in_quests_16_2_unless_i_see_miss_charit_8739d5: "除非我每天见到查丽蒂小姐，否则我眼睛里会长猫毛！"
  npc_override_rebel_in_quests_16_2_unless_we_block_area_fir_e581a8: "除非我们先封锁区域，否则他们会迅速关闭实验室并逃跑。"
  npc_override_rebel_in_quests_16_2_unless_you_live_here_s_00e681: "除非你住在这里，否则很难发现谁有权力。"
  npc_override_rebel_in_quests_16_2_unless_you_pay_us_millio_e27176: "除非你付我们100万Zeny听你的故事，否则现在就离开。"
  npc_override_rebel_in_quests_16_2_unless_you_useless_idiot_f69fd6: "除非你是个没用的白痴。"
  npc_override_rebel_in_quests_16_2_unlike_wimp_chatting_dow_ee4e57: "和楼下那个懦夫聊天不同，你看起来挺有意思的。"
  npc_override_rebel_in_quests_16_2_unusual_obsession_heine_269adb: "海涅家族不寻常的执念……"
  npc_override_rebel_in_quests_16_2_upon_any_consideration_i_b58753: "经过任何考虑，我认为维罗误解了什么。他称之为妹妹的那个面无表情的女士仍在翻阅书籍和文件。而他为什么说她很高兴？他为什么这么说？"
  npc_override_rebel_in_quests_16_2_upon_your_approval_his_e_55f6b8: "经你批准，阁下想亲自见你，道歉，并希望有机会与你和解。"
  npc_override_rebel_in_quests_16_2_use_anchovy_cookies_find_7f7033: "用凤尾鱼饼干找到查丽蒂，把剩下的带回来！"
  npc_override_rebel_in_quests_16_2_usu_stands_under_seal_un_feca20: "USU代表^0000CD封印之下部队^000000。这是一群做过一些疯狂事情的怪人。"
  npc_override_rebel_in_quests_16_2_usually_we_feel_buy_tick_860422: "通常，我们可以买票，向站务员问好，吃美味的零食，享受我们的旅程。"
  npc_override_rebel_in_quests_16_2_vague_theory_succeeded_634a80: "这是一个模糊的理论，但成功了。"
  npc_override_rebel_in_quests_16_2_vero_disappeared_all_sud_4dc90e: "维罗说完再见就突然消失了。这里发生了什么事？他被紧急任务召唤了吗？"
  npc_override_rebel_in_quests_16_2_vero_disappeared_hurry_a_ad2f06: "维罗匆忙消失了，好像被什么东西追赶着。带上三个火焰之心和一个伟大的自然去艾音布罗克。"
  npc_override_rebel_in_quests_16_2_vero_pressing_me_as_if_a74de8: "维罗在催促我，好像他没有多少时间了。有点可疑。但我不问他，因为我知道他不会告诉我。"
  npc_override_rebel_in_quests_16_2_vero_s_gone_shall_i_b6db91: "维罗走了。我要回克拉纳·内梅里吗？"
  npc_override_rebel_in_quests_16_2_very_moment_when_fire_st_eab9ec: "火势最猛烈然后消失的那一刻！！这就是设备出现的条件。"
  npc_override_rebel_in_quests_16_2_very_shining_ring_cotnes_0b229c: "这就是科特内斯说的非常闪亮的戒指……作为饰品，看起来很壮观，不是吗？"
  npc_override_rebel_in_quests_16_2_vivo_experiment_really_h_42a8ce: "……活体实验真的很可怕。"
  npc_override_rebel_in_quests_16_2_voice_i_ve_never_heard_bf6c8f: "这是我从未听过的声音。是帮助那个孩子的冒险者吗？"
  npc_override_rebel_in_quests_16_2_wait_73a827: "等等！"
  npc_override_rebel_in_quests_16_2_wait_adventurer_please_t_25087b: "等等！！！冒险者！请和我说话！"
  npc_override_rebel_in_quests_16_2_wait_calm_down_listen_me_9b8efa: "等等！冷静下来听我说。"
  npc_override_rebel_in_quests_16_2_wait_i_see_thimble_arche_ed0b87: "等等，我能看看那个弓箭手顶针吗？"
  npc_override_rebel_in_quests_16_2_wait_stop_right_there_so_d2de4e: "等等。停在那里。有人躺在这里。不要踩到。嘿，小心！"
  npc_override_rebel_in_quests_16_2_wait_they_re_sending_us_4260ab: "等等！他们就这样把我们送走？看起来是的。我搞错了吗？"
  npc_override_rebel_in_quests_16_2_wait_we_going_leave_him_cd7a34: "等等，我们要把他留在这里吗？"
  npc_override_rebel_in_quests_16_2_wait_where_did_you_get_74fcb5: "……等等，你从哪里弄到这个饼干的？"
  npc_override_rebel_in_quests_16_2_wait_who_you_dcd7c4: "等等，你是谁？"
  npc_override_rebel_in_quests_16_2_wait_you_disappointed_yo_f80872: "等等。你失望了吗！你就是！"
  npc_override_rebel_in_quests_16_2_waiting_room_there_ivan_28a99b: "在等候室里，有^0000CD伊万，负责竞技场入口的人^000000。"
  npc_override_rebel_in_quests_16_2_wandering_around_laborat_c5b8e2: "在实验室里到处游荡！"
  npc_override_rebel_in_quests_16_2_water_7bd840: "水。"
  npc_override_rebel_in_quests_16_2_water_four_sides_water_a_f0c0f6: "四面环水……水属性……"
  npc_override_rebel_in_quests_16_2_way_43fd4c: "这边。"
  npc_override_rebel_in_quests_16_2_way_787cf8: "这边……"
  npc_override_rebel_in_quests_16_2_way_all_sudden_5961f2: "就这样，突然……"
  npc_override_rebel_in_quests_16_2_way_charity_loves_stroll_832970: "顺便说一下……查丽蒂喜欢散步，她大约半天都在外面闲逛。看这个。我今天早上给了她饲料，她还没吃一半。"
