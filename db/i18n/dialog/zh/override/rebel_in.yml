  npc_override_rebel_in_quests_16_2_i_told_you_drink_tea_e1dded: "我告诉过你拿枪时不要喝茶。如果你洒在上面怎么办？"
  npc_override_rebel_in_quests_16_2_i_told_you_i_d_366bf0: "我告诉过你我会^0000CD对你手下留情^000000。虽然你赢了战斗，但你实际上并没有赢。明白了吗？"
