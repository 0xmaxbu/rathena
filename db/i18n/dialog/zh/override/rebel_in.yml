  npc_override_rebel_in_quests_16_2_you_must_kidding_what_ki_b4168e: "你一定在开玩笑。这是什么废话！你一开始为什么来这里烦我？"
  npc_override_rebel_in_quests_16_2_you_must_other_things_co_ca767a: "你一定有别的事要做，明天再来。"
  npc_override_rebel_in_quests_16_2_you_must_so_tired_now_942b9b: "你现在一定很累。休息一下。我们明天能靠你吗？如果你有兴趣，黎明后再来找我们。"
