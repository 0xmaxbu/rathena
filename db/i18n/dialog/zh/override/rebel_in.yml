  npc_override_rebel_in_quests_16_2_i_read_document_008c46: "我读了文件。"
  npc_override_rebel_in_quests_16_2_i_read_too_what_you_840a55: "我也读了。你刚才说的写在那里。"
  npc_override_rebel_in_quests_16_2_i_really_don_t_understan_3d0973: "我真的不明白紧张和免费搭车之间的关系。"
  npc_override_rebel_in_quests_16_2_i_really_hate_those_who_4fee52: "我真的讨厌那些试图随意利用别人生命的人。"
