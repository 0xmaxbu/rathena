  npc_override_rebel_in_quests_16_2_we_need_item_strong_wate_69bc52: "我们需要一个具有强水属性的物品。"
  npc_override_rebel_in_quests_16_2_we_need_more_help_6973dd: "我们需要更多帮助。"
  npc_override_rebel_in_quests_16_2_we_need_pieces_crystal_p_fad540: "我们需要^0000cd10块水晶和10块黑水晶^000000。这次别忘了！"
  npc_override_rebel_in_quests_16_2_we_need_special_vibratio_f1022c: "我们需要黑曜石和矿石死亡时产生的特殊振动。那种振动能使水晶碎成更小的碎片……"
  npc_override_rebel_in_quests_16_2_we_never_know_what_you_ce0d5c: "我们永远不知道你在食物里放了什么！我们不想听你说什么。所以滚出去！"
  npc_override_rebel_in_quests_16_2_we_never_see_them_again_543a0e: "我们再也见不到他们了。所以温柔地送他们走吧。菜鸟。"
  npc_override_rebel_in_quests_16_2_we_no_choice_come_back_b8597c: "……我们别无选择。稍后再来。"
  npc_override_rebel_in_quests_16_2_we_no_choice_s_our_e86630: "但我们别无选择。这是我们的错。请向我们的指挥官报告。"
  npc_override_rebel_in_quests_16_2_we_no_other_choice_c3be70: "我们别无选择。"
  npc_override_rebel_in_quests_16_2_we_now_cooperating_aren_de4ee5: "我们现在在合作，不是吗？"
  npc_override_rebel_in_quests_16_2_we_only_single_chance_so_04b75b: "而且我们只有一次机会。所以欢迎你给我们一个好主意。"
  npc_override_rebel_in_quests_16_2_we_problem_according_our_0e1213: "我们有个问题。根据我们的日程，我们计划在摧毁里希塔乐镇的设备后立即摧毁朱诺的设备……"
  npc_override_rebel_in_quests_16_2_we_punished_moved_usu_th_b858c0: "我们被惩罚并调到了USU……然后我们觉得其他人都把我们当成可怕的孩子。"
  npc_override_rebel_in_quests_16_2_we_re_rebellions_we_end_7e8815: "我们是反叛者。我们在枪口的尽头。"
  npc_override_rebel_in_quests_16_2_we_re_sorry_9884f2: "……我们很抱歉……"
  npc_override_rebel_in_quests_16_2_we_realize_we_enough_arm_fc349c: "我们确实意识到我们没有足够的武装力量。所以我们准备了一些其他策略。"
  npc_override_rebel_in_quests_16_2_we_really_repair_urgentl_92bfc9: "我们真的必须紧急修理它。但这个人由于某种原因不能去矿上。而且，我因为其他工作也不能去矿上。我们一定会补偿你的支持。"
  npc_override_rebel_in_quests_16_2_we_rely_heroic_adventure_1d6920: "我们必须依靠英勇的冒险者来借用反叛者的军事力量……"
  npc_override_rebel_in_quests_16_2_we_sacrificed_too_much_f_69a6cf: "我们牺牲了太多，不能忘记！"
  npc_override_rebel_in_quests_16_2_we_search_rest_them_79170e: "我们会搜寻其余的人。"
  npc_override_rebel_in_quests_16_2_we_see_something_get_the_da6ec9: "我们必须看到什么才能进去。"
  npc_override_rebel_in_quests_16_2_we_send_official_letter_a4ff72: "我们可以给企业发一封正式信函，请求他们配合调查。但据我们所知，这种正式请求只会给他们时间隐藏东西。"
  npc_override_rebel_in_quests_16_2_we_send_someone_you_migh_8110f3: "我们会派一个你可能很熟悉的人来。"
  npc_override_rebel_in_quests_16_2_we_should_done_ba292f: "我们不该这么做的……"
  npc_override_rebel_in_quests_16_2_we_should_them_sense_apo_28a3a0: "我们应该让他们感受到歉意和对未来的希望承诺。同时，^0000cd我们必须让他们放松心情，承诺在未来事务中合作^000000……"
  npc_override_rebel_in_quests_16_2_we_show_you_our_gratitud_bb2ae8: "我们必须向你表达我们的感激之情。"
  npc_override_rebel_in_quests_16_2_we_sorry_about_d1ce04: "我们对此感到抱歉。"
  npc_override_rebel_in_quests_16_2_we_still_absolute_rule_w_54b1be: "但我们仍然有一条绝对规则。我们不惹其他反叛者。"
  npc_override_rebel_in_quests_16_2_we_supposed_here_now_7a515a: "我们现在不应该在这里。"
  npc_override_rebel_in_quests_16_2_we_talk_freely_00fd59: "我们可以自由交谈吗？"
  npc_override_rebel_in_quests_16_2_we_talking_about_party_w_8b06b5: "我们在谈我们即将举行的派对。"
  npc_override_rebel_in_quests_16_2_we_think_schwaltzvalt_go_fa5be7: "我们认为施瓦尔特茨瓦尔特政府安装设备是为了限制传送，以保护雷肯贝尔企业的秘密研究。"
  npc_override_rebel_in_quests_16_2_we_thought_we_had_alread_fa02a4: "我们以为我们已经把一切都毁了。"
  npc_override_rebel_in_quests_16_2_we_tired_because_someone_a9b7e3: "我们很累，因为有人在烦我们。"
  npc_override_rebel_in_quests_16_2_we_trouble_ef590c: "我们有麻烦了。"
  npc_override_rebel_in_quests_16_2_we_try_find_those_guys_ae9c26: "我们会试着找到那些家伙。"
  npc_override_rebel_in_quests_16_2_we_trying_our_best_get_8f6065: "我们正在尽力除掉他们。但说实话，这很难。"
  npc_override_rebel_in_quests_16_2_we_various_weapons_inclu_3266e9: "我们有各种武器，包括火器、火药、大炮、迫击炮和燃烧瓶。请常来光顾。"
  npc_override_rebel_in_quests_16_2_we_ve_picked_out_combata_f201c0: "我们已经挑选了战斗人员。由于这次行动是机密的，我们选择了我们完全信任的人。"
