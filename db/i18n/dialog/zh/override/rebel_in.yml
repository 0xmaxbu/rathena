  npc_override_rebel_in_quests_16_2_way_i_taught_you_55cfc4: "是我教你的方式吗？"
  npc_override_rebel_in_quests_16_2_way_let_s_talk_about_2aeb16: "顺便说一下，让我们谈谈布鲁诺。我们还要保密多久？"
  npc_override_rebel_in_quests_16_2_way_never_call_elena_hun_70db92: "顺便说一下，永远不要当着埃琳娜的面叫她'猎犬'。她会把你分解掉的。"
  npc_override_rebel_in_quests_16_2_way_s_important_i_think_d6366a: "顺便说一下，那不重要。我觉得我的流星出了很严重的问题。"
  npc_override_rebel_in_quests_16_2_way_s_so_beautiful_what_224b8c: "顺便说一下，太美了，多么灿烂的光芒……我想现在开始工作。"
