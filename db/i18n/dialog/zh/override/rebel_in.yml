  npc_override_rebel_in_quests_16_2_s_frustrating_live_like_3a0f79: "这样生活真令人沮丧。不是吗？"
  npc_override_rebel_in_quests_16_2_s_good_attitude_please_t_2bf471: "态度很好。请看看那些有红线的人。收回他们扔掉的武器。"
  npc_override_rebel_in_quests_16_2_s_good_c416bb: "很好。"
  npc_override_rebel_in_quests_16_2_s_good_i_like_ask_dfc301: "很好。我想请你帮个忙。你愿意接受吗？"
  npc_override_rebel_in_quests_16_2_s_hard_job_all_we_454519: "这不是什么困难的工作。我们只需要去大约四个地方，摧毁几样东西。"
  npc_override_rebel_in_quests_16_2_s_heap_earth_where_broke_b5bbaf: "是埋藏破损枪的土堆。让我们挖出来收回枪。"
  npc_override_rebel_in_quests_16_2_s_how_we_developed_syste_955e2a: "我们就是这样开发出这样的系统的。都是因为住在这里的人。"
  npc_override_rebel_in_quests_16_2_s_important_0b2b65: "那并不重要。"
  npc_override_rebel_in_quests_16_2_s_inconvenient_i_thought_883ebb: "不方便。我以为你会直接借给我们，不需要任何手续。"
  npc_override_rebel_in_quests_16_2_s_interesting_although_t_4ae16c: "很有趣。虽然它们是同样的武器，但根据主人注重什么，它们有不同的倾向。"
  npc_override_rebel_in_quests_16_2_s_issue_here_1a5321: "那不是这里的问题。"
  npc_override_rebel_in_quests_16_2_s_issue_here_we_cannot_45054f: "……那不是这里的问题。我们不能直接去那里敲门！"
  npc_override_rebel_in_quests_16_2_s_joke_they_don_t_e18a2e: "但这只是个玩笑。他们实际上并不偷东西。"
  npc_override_rebel_in_quests_16_2_s_just_lack_my_ability_fae8c1: "只是我的能力不足，哈哈！"
  npc_override_rebel_in_quests_16_2_s_just_monster_b06159: "只是怪物！"
  npc_override_rebel_in_quests_16_2_s_just_our_excuse_nobody_6fee77: "这只是我们的借口，没人阻止我们……"
  npc_override_rebel_in_quests_16_2_s_just_personal_feeling_847896: "……只是个人感觉。"
  npc_override_rebel_in_quests_16_2_s_just_regrettable_2d4dbc: "但这只是遗憾。"
  npc_override_rebel_in_quests_16_2_s_just_your_imagination_3080d4: "只是你的想象。世界上没有像我这样的人。"
  npc_override_rebel_in_quests_16_2_s_lack_self_confidence_a2a605: "是缺乏自信。"
  npc_override_rebel_in_quests_16_2_s_like_you_solved_whole_099dcd: "就像你解决了整个问题。他们不会越过你的。"
  npc_override_rebel_in_quests_16_2_s_make_those_kids_quiet_9c3cbb: "是为了让那些孩子安静。"
  npc_override_rebel_in_quests_16_2_s_me_063e71: "是我。"
  npc_override_rebel_in_quests_16_2_s_my_fault_our_meals_e4d3c8: "我们的饭菜不好吃不是我的错。"
  npc_override_rebel_in_quests_16_2_s_my_pleasure_1a944c: "这是我的荣幸。"
  npc_override_rebel_in_quests_16_2_s_name_charity_some_guys_e06997: "它叫慈善！有人说它是阿鲁纳菲尔兹纯种拉赫林短毛猫。其实它只是来到我们这里，开始一起生活。所以我们不知道它的品种或年龄。"
  npc_override_rebel_in_quests_16_2_s_national_secret_62f5ad: "这是国家机密。"
  npc_override_rebel_in_quests_16_2_s_natural_539226: "这很自然。"
  npc_override_rebel_in_quests_16_2_s_noisy_outside_73b2fe: "……外面很吵。"
  npc_override_rebel_in_quests_16_2_s_now_i_cannot_live_d0b9ff: "就是这样。从现在起，我不能住在施瓦茨瓦尔德或卢恩-米德加尔特。"
  npc_override_rebel_in_quests_16_2_s_okay_because_i_trust_0f77da: "没关系，因为我信任自己。在这个广阔世界的所有人中，我是唯一信任自己的人。所以你只需跟着我。"
  npc_override_rebel_in_quests_16_2_s_okay_i_publicize_mysel_98f90e: "没关系。我可以在整个大陆宣传自己。让我研磨一些硬东西然后放进去……"
  npc_override_rebel_in_quests_16_2_s_only_newbies_me_52bdac: "那只是给新手的。不是给我的。"
  npc_override_rebel_in_quests_16_2_s_price_snack_give_me_ae2b1e: "那是一个零食的价格。给我一个。"
  npc_override_rebel_in_quests_16_2_s_problem_inside_our_uni_b743d0: "这是我们部队内部的问题。所以我们最好自己处理。"
  npc_override_rebel_in_quests_16_2_s_problem_we_face_now_dbd72c: "这就是我们现在面临的问题。这个设备正被各种技术隐藏和保护，包括魔法。"
  npc_override_rebel_in_quests_16_2_s_quite_natural_very_goo_9f1357: "这很自然。很好。祝我们任务顺利。我的目标是和你一起建立梦幻组合的名声。"
  npc_override_rebel_in_quests_16_2_s_quite_obvious_my_famil_638a86: "这很明显。我家有一个二手店。如你所知，这个地区的铁消费量很大。有人开玩笑说，他们会在你闭上眼睛时偷走你的勺子。"
  npc_override_rebel_in_quests_16_2_s_quite_possible_756fa8: "这很有可能。"
  npc_override_rebel_in_quests_16_2_s_quite_suspicious_vero_f8f8cc: "维罗不直视我的眼睛相当可疑。也许他从一开始只需要星之碎屑。我要问他这个吗？"
  npc_override_rebel_in_quests_16_2_s_quite_unusual_d2da87: "这很不寻常。"
  npc_override_rebel_in_quests_16_2_s_quite_unusual_receive_fdd9b9: "收到她的信很不寻常。"
  npc_override_rebel_in_quests_16_2_s_rebellion_e8f002: "是^4d4dff反叛军^000000。"
  npc_override_rebel_in_quests_16_2_s_relic_6b86ff: "这是遗物。"
  npc_override_rebel_in_quests_16_2_s_request_president_a334ee: "那是总统的请求！"
  npc_override_rebel_in_quests_16_2_s_right_4b5ef4: "对。"
  npc_override_rebel_in_quests_16_2_s_right_if_you_need_a8083b: "对！如果你需要我的帮助，我会积极支持你。"
  npc_override_rebel_in_quests_16_2_s_right_you_lucky_person_c2f7a3: "对。你很幸运，真正脾气暴躁的人现在在楼上。"
  npc_override_rebel_in_quests_16_2_s_so_annoying_f101c6: "太烦人了……"
  npc_override_rebel_in_quests_16_2_s_so_annoying_see_rat_443736: "看到这只老鼠在我的空间里晃悠太烦人了。"
  npc_override_rebel_in_quests_16_2_s_so_cool_3b3bcd: "太酷了。"
  npc_override_rebel_in_quests_16_2_s_so_definite_yet_2bd9a8: "还不太确定"
  npc_override_rebel_in_quests_16_2_s_so_interesting_5da09e: "太~有趣了。"
  npc_override_rebel_in_quests_16_2_s_so_serious_1822d0: "没那么严重。"
  npc_override_rebel_in_quests_16_2_s_so_spoiled_adventurer_1efc13: "太娇气了。冒险者，我们会再靠你的。如果你不带它们来，赛昂会整天缠着你。"
  npc_override_rebel_in_quests_16_2_s_strange_i_ve_never_faa148: "但很奇怪。我从未被报告说最近有这样的任务。"
  npc_override_rebel_in_quests_16_2_s_strange_lady_been_look_343716: "很奇怪。女士一直在看文件，对我毫无兴趣。"
  npc_override_rebel_in_quests_16_2_s_strange_why_you_such_abc28b: "很奇怪。你为什么这么着急？"
  npc_override_rebel_in_quests_16_2_s_there_maybe_i_should_e03981: "不在那里。也许我应该再买一个……"
  npc_override_rebel_in_quests_16_2_s_true_22193a: "是真的。"
  npc_override_rebel_in_quests_16_2_s_true_f4fe9c: "是真的……"
  npc_override_rebel_in_quests_16_2_s_true_we_receive_free_8ee49e: "不是真的。我们收到免费通行证，可以使用这个大陆上的所有交通工具。包括飞艇、火车和传送等。"
  npc_override_rebel_in_quests_16_2_s_very_suspicious_him_ma_69dd89: "他那样生气非常可疑。但我决定一笑置之。"
  npc_override_rebel_in_quests_16_2_s_waste_time_9f0b96: "浪费时间"
  npc_override_rebel_in_quests_16_2_s_water_water_attribute_1e265a: "就是！！水！！水属性。"
  npc_override_rebel_in_quests_16_2_s_what_happened_now_i_81342f: "这就是发生的事……现在我知道你受了很多苦。"
  npc_override_rebel_in_quests_16_2_s_what_i_about_tell_8b0f9e: "这就是我要告诉你的！"
  npc_override_rebel_in_quests_16_2_s_what_i_am_about_f47853: "这就是我现在要告诉你的。哈哈。所以请把枪放下……我们先坐下。"
  npc_override_rebel_in_quests_16_2_s_what_i_heard_407a76: "但这是我听到的。"
  npc_override_rebel_in_quests_16_2_s_what_i_like_talk_bda7a0: "这就是我想谈的。"
  npc_override_rebel_in_quests_16_2_s_what_we_contend_3ba051: "这就是我们必须面对的。"
  npc_override_rebel_in_quests_16_2_s_when_mr_adler_visited_3159da: "那是阿德勒先生拜访我的时候。"
  npc_override_rebel_in_quests_16_2_s_when_they_began_disobe_6fe8db: "那就是他们开始违抗前辈的时候。"
  npc_override_rebel_in_quests_16_2_s_why_i_accepted_7e8250: "这就是我接受它的原因。"
  npc_override_rebel_in_quests_16_2_s_why_i_am_asking_f2f2a3: "这就是我请求你帮助的原因。我想你可以通过说服他们来改变他们的想法。"
  npc_override_rebel_in_quests_16_2_s_why_i_came_here_4be87c: "这就是我来这里的原因。这个任务除了反叛军之外没人能完成。所以总统派我来这里。"
  npc_override_rebel_in_quests_16_2_s_why_i_had_move_721dca: "这就是为什么我必须搬到这里，克拉纳·内米埃。"
  npc_override_rebel_in_quests_16_2_s_why_i_look_like_845c11: "这就是为什么我又变成这样。"
  npc_override_rebel_in_quests_16_2_s_why_i_m_trying_e4f823: "这就是为什么我试图帮助你。请说服其他人。"
  npc_override_rebel_in_quests_16_2_s_why_i_ve_been_1227ed: "这就是为什么我一直在这里等！"
  npc_override_rebel_in_quests_16_2_s_why_i_visit_payon_50642c: "这就是为什么我偶尔去斐扬。"
  npc_override_rebel_in_quests_16_2_s_why_need_steel_old_da10eb: "这就是为什么需要钢和旧钢板。"
  npc_override_rebel_in_quests_16_2_s_why_negotiation_so_imp_bf531f: "这就是为什么这次谈判如此重要。我们要向生我气的人求助。这不会容易。"
  npc_override_rebel_in_quests_16_2_s_why_they_organized_mil_aacafe: "这就是为什么他们自己组织了一个军事团体，并发展到这个地步……你真的认为他们会站在我们这边吗？"
  npc_override_rebel_in_quests_16_2_s_why_we_always_make_7d6f3e: "这就是为什么我们总是在壁炉里生火，温暖空气，煮茶，烤红薯……"
  npc_override_rebel_in_quests_16_2_s_why_we_being_swayed_0689be: "这就是为什么我们被他左右。"
  npc_override_rebel_in_quests_16_2_s_why_we_doing_now_22547e: "这就是为什么我们现在在做这个。"
  npc_override_rebel_in_quests_16_2_s_why_we_had_come_9677b5: "这就是为什么我们不得不不提前和你谈就来到这里。"
  npc_override_rebel_in_quests_16_2_s_why_we_need_171284: "这就是为什么我们需要{0}。"
  npc_override_rebel_in_quests_16_2_s_you_adventurer_welcome_4f7ab2: "……是你，冒险者。欢迎。"
  npc_override_rebel_in_quests_16_2_same_monster_regenerated_1f9a78: "同样的怪物每天再生。不有点奇怪吗？"
  npc_override_rebel_in_quests_16_2_same_thing_written_lette_73bff3: "我交给厄斯特的信里写了同样的话。"
  npc_override_rebel_in_quests_16_2_sanatorium_looks_after_n_d8b6f5: "一个照顾新手和老人的疗养院。这里没什么可看的。而且这里太冷了，如果你睡在这里，你的嘴可能会歪。这就是为什么你最好在喝完茶后离开。"
  npc_override_rebel_in_quests_16_2_say_hello_93b2b9: "打招呼。"
  npc_override_rebel_in_quests_16_2_say_yes_3527d3: "说是。"
  npc_override_rebel_in_quests_16_2_saying_same_thing_again_290d7e: "重复同样的话相当困难。"
  npc_override_rebel_in_quests_16_2_scared_fe6458: "害怕……？"
  npc_override_rebel_in_quests_16_2_scared_so_40fa29: "害怕……所以……"
  npc_override_rebel_in_quests_16_2_schwartz_371bc2: "为了施瓦茨？"
  npc_override_rebel_in_quests_16_2_schwartz_government_know_377d79: "而且施瓦茨政府知道这是内利乌斯王室的私人但重要事务。那是因为斯基亚在移交布鲁诺给施瓦茨时编了一个好故事。"
  npc_override_rebel_in_quests_16_2_schwartz_government_posi_7d7da4: "但施瓦茨政府对此持积极态度。"
  npc_override_rebel_in_quests_16_2_schwartz_honor_token_i_a_132f06: "我要给你的^4d4dff施瓦茨荣誉代币^000000是一种在反叛军中使用的奖励货币。"
  npc_override_rebel_in_quests_16_2_schwartz_honor_token_ite_5c5fef: "施瓦茨荣誉代币，由国家发行且禁止个人之间交易的物品。我从人们那里收取这些物品并升级他们的装备。"
  npc_override_rebel_in_quests_16_2_sec_secretary_94fc05: "秘，秘书……？"
  npc_override_rebel_in_quests_16_2_second_thought_i_didn_t_17b7b7: "仔细想想，我并没有给尼希尔任何机会。他对此可能感到难过。"
  npc_override_rebel_in_quests_16_2_secret_wing_destroyed_en_ce5ce5: "但秘密之翼并没有被完全摧毁。"
  npc_override_rebel_in_quests_16_2_secret_wings_190869: "秘密之翼？"
  npc_override_rebel_in_quests_16_2_secret_wings_they_just_r_55a682: "秘密之翼？他们不过是些新手。整天只会拍总统马屁。"
  npc_override_rebel_in_quests_16_2_see_you_clana_nemieri_3d342b: "克拉纳·内梅里见。"
  npc_override_rebel_in_quests_16_2_see_you_einbroch_hotel_82fffd: "在^4d4dff艾音布罗克旅馆^000000见。"
  npc_override_rebel_in_quests_16_2_see_you_end_freight_trai_e4ac8f: "在货运列车的尽头见。"
  npc_override_rebel_in_quests_16_2_see_you_later_careful_05b35b: "回头见。小心点。"
  npc_override_rebel_in_quests_16_2_see_you_later_d94b6f: "回头见。"
  npc_override_rebel_in_quests_16_2_see_you_later_i_contact_697953: "回头见。我会联系你的。"
  npc_override_rebel_in_quests_16_2_see_you_lighthalzen_1f68ec: "在里希塔乐镇见。"
  npc_override_rebel_in_quests_16_2_see_you_lighthalzen_airp_a3e3e8: "在^4d4dff里希塔乐镇机场^000000见，英雄！"
  npc_override_rebel_in_quests_16_2_see_you_yuno_f98918: "在朱诺见。"
  npc_override_rebel_in_quests_16_2_seems_like_decision_been_4deeb5: "看来决定已经做出了。"
  npc_override_rebel_in_quests_16_2_seems_like_dull_middle_a_4e480f: "看来那个站在楼梯旁、无精打采的中年人负责收代币。他叫施特拉塞。如果你感兴趣，就去吧。"
  npc_override_rebel_in_quests_16_2_seems_like_he_lost_his_f893e3: "看来他迷路了。"
  npc_override_rebel_in_quests_16_2_seems_like_he_wants_say_508d71: "（……看来他有话想说。）"
  npc_override_rebel_in_quests_16_2_seems_like_most_things_a_af2957: "{0}，看来大部分事情都安排妥当了。现在我要带着我可怜的妹妹离开了。"
  npc_override_rebel_in_quests_16_2_seems_like_most_us_agree_3355e6: "看来我们大多数人都同意了。如果你还反对，恐怕不会有什么好结果。"
  npc_override_rebel_in_quests_16_2_seems_like_s_easier_talk_442268: "看来和那个女孩说话更容易。"
  npc_override_rebel_in_quests_16_2_seems_like_situation_bee_200548: "看来这里的情况已经平息了。我们要不要四处看看？"
  npc_override_rebel_in_quests_16_2_seems_like_there_still_s_243b2b: "看来还有一些研究人员像这样躲藏着。"
  npc_override_rebel_in_quests_16_2_seems_like_they_complete_90d256: "看来他们完全把那个人交给冒险者了。"
  npc_override_rebel_in_quests_16_2_seems_like_they_gave_gre_00e2c6: "看来他们付出了很大的努力。替我向他们说声谢谢。"
  npc_override_rebel_in_quests_16_2_seems_like_vero_already_e5ff8c: "看来维罗已经出发了。"
  npc_override_rebel_in_quests_16_2_seems_like_we_finished_o_6f6ed5: "看来我们的工作已经完成了。"
  npc_override_rebel_in_quests_16_2_seems_like_you_looking_s_eedc58: "看来你在找人。有什么事吗？"
  npc_override_rebel_in_quests_16_2_seems_like_you_more_wrin_4726e4: "看来你最近皱纹变多了。"
  npc_override_rebel_in_quests_16_2_seems_like_you_too_many_431c4c: "看来你的东西太多了。清理一些后再来吧。"
  npc_override_rebel_in_quests_16_2_seems_like_youngsters_bu_bedf84: "看来年轻人要忙一阵子了。有空的话，请帮帮老人们。"
  npc_override_rebel_in_quests_16_2_seems_like_your_business_fa5408: "看来你的生意遇到麻烦了。"
  npc_override_rebel_in_quests_16_2_sense_cef786: "有点分寸！"
  npc_override_rebel_in_quests_16_2_series_incidents_e5166a: "一连串事件？"
  npc_override_rebel_in_quests_16_2_serves_you_right_a4a652: "活该！"
  npc_override_rebel_in_quests_16_2_several_years_ago_comman_2caa14: "几年前，埃里克森指挥官把他们带到了这里。"
  npc_override_rebel_in_quests_16_2_shall_i_go_now_82eb9a: "……我现在可以进去了吗？"
  npc_override_rebel_in_quests_16_2_shall_i_try_let_s_dc2389: "让我试试？看看。这应该就是特工告诉我们的地方。现在我们要把你带来的火焰之心打碎……"
  npc_override_rebel_in_quests_16_2_shall_we_depart_now_d4628f: "我们现在出发吗？"
  npc_override_rebel_in_quests_16_2_shall_we_destroy_pal_30e26e: "伙计，我们要毁掉它吗？"
  npc_override_rebel_in_quests_16_2_shall_we_get_out_here_eb1bbd: "我们离开这里吗？"
  npc_override_rebel_in_quests_16_2_shall_we_go_waiting_room_3c439c: "我们现在去等候室吗？"
  npc_override_rebel_in_quests_16_2_shall_we_leave_now_d86c9c: "我们现在离开吗？"
  npc_override_rebel_in_quests_16_2_shall_we_stop_3c1cc8: "我们要停下来吗？"
  npc_override_rebel_in_quests_16_2_shameful_me_keep_relying_d649ef: "……一直依赖别人，我会感到羞耻的。"
  npc_override_rebel_in_quests_16_2_she_also_came_here_relax_1e7803: "她需要休息的时候也会来这里放松……"
  npc_override_rebel_in_quests_16_2_she_arrived_8d220f: "她到了。"
  npc_override_rebel_in_quests_16_2_she_barely_sew_button_b84bad: "她连缝个纽扣都不会。"
  npc_override_rebel_in_quests_16_2_she_disguised_herself_as_6cc5fb: "她伪装成游客……现在就在^4d4dff里希塔乐镇的旅馆^000000里。"
  npc_override_rebel_in_quests_16_2_she_fine_67b954: "她没事。"
  npc_override_rebel_in_quests_16_2_she_go_mine_every_day_decf9f: "她每天都去矿上卖吃的。那天，我告诉她不要去。"
  npc_override_rebel_in_quests_16_2_she_had_been_ordered_rec_7b69da: "她被命令向海涅家族的儿子推荐一种饮品。有人告诉她那是他最喜欢的饮料。"
  npc_override_rebel_in_quests_16_2_she_never_told_me_anythi_975c1c: "她从来没跟我提过派对的事！"
  npc_override_rebel_in_quests_16_2_she_s_grown_up_lot_0cc51c: "她长大了不少。"
  npc_override_rebel_in_quests_16_2_she_said_okay_went_mine_c5b61e: "但她说没事，还是去了矿上……"
  npc_override_rebel_in_quests_16_2_she_sewn_well_526873: "……她会缝得好吗？"
  npc_override_rebel_in_quests_16_2_she_shouldn_t_fay_away_c9291e: "她应该不会走远。能请你到艾音贝赫去找查丽蒂吗？"
  npc_override_rebel_in_quests_16_2_she_tell_us_story_4e5384: "她会给我们讲那个故事的……"
  npc_override_rebel_in_quests_16_2_she_told_us_wait_her_c86a8c: "她让我们等她。她说她会带来好消息。"
  npc_override_rebel_in_quests_16_2_she_tomboy_since_she_met_2168fc: "她以前是个假小子。但自从遇到塞伦后，她经常假装很文静。"
  npc_override_rebel_in_quests_16_2_sherine_holding_back_her_8d03d1: "谢琳强忍着泪水。"
  npc_override_rebel_in_quests_16_2_shh_i_told_you_mention_05184f: "嘘——我告诉过你不要提那个名字。以后小心点。我不想因为没做过的事而被背后捅刀子。如果你非要说，就叫它苍鹭。"
  npc_override_rebel_in_quests_16_2_shooting_i_like_s_only_74dec1: "射击？我喜欢。但这并不是我练习它的唯一原因。"
  npc_override_rebel_in_quests_16_2_shop_i_usually_buy_paper_34ed2c: "我平时买纸的那家店关门了……"
  npc_override_rebel_in_quests_16_2_should_i_ae7aa9: "我应该吗？"
  npc_override_rebel_in_quests_16_2_should_i_fight_you_all_1f52aa: "我要突然和你们打一架吗？嗯，我不太想……"
  npc_override_rebel_in_quests_16_2_should_i_go_alone_don_f08f9e: "我要一个人去吗？你不是要直接送信吗？"
  npc_override_rebel_in_quests_16_2_should_i_put_bouquet_dow_722e74: "我要把花束放下吗？"
  npc_override_rebel_in_quests_16_2_should_i_welcome_you_see_4699d8: "……我应该欢迎你吗，以这种方式再次见到你？"
  npc_override_rebel_in_quests_16_2_shouldn_t_you_go_help_7bd5fb: "你不去帮忙吗？"
  npc_override_rebel_in_quests_16_2_shout_him_8b8dbd: "朝他大喊。"
  npc_override_rebel_in_quests_16_2_show_me_0cb6f2: "给我看看。"
  npc_override_rebel_in_quests_16_2_shrines_convents_very_cl_204c84: "神殿和修道院的关系非常密切。"
  npc_override_rebel_in_quests_16_2_shut_up_41b0c1: "闭嘴！"
  npc_override_rebel_in_quests_16_2_since_display_product_we_33130a: "既然是展示品，我们需要下订单。订单太多了，你得等八个月。你能等吗？"
  npc_override_rebel_in_quests_16_2_since_fuss_likely_contin_e4706c: "既然这场骚动可能会持续一段时间，如果你能留下来帮助我们，我们会很高兴的~"
  npc_override_rebel_in_quests_16_2_since_guys_been_assigned_678bf8: "既然这些人被分配到了我的部队，我想在这里照顾他们。但他们不帮忙。"
  npc_override_rebel_in_quests_16_2_since_he_critical_moment_635681: "既然他现在处于关键时刻，我会找机会给他。"
  npc_override_rebel_in_quests_16_2_since_he_having_hard_tim_b6ab49: "既然他制作这个很辛苦，我愿意帮他。但他还是独自完成了这个弓箭手顶针……"
  npc_override_rebel_in_quests_16_2_since_her_choice_i_must_e6c16b: "……既然这是她的选择……我必须接受……但是……"
  npc_override_rebel_in_quests_16_2_since_i_able_come_here_d948d1: "既然我能进到这里，我猜谈判成功了。"
  npc_override_rebel_in_quests_16_2_since_i_am_busy_talk_1c37e1: "既然我很忙，从现在起不要无缘无故地和我说话。"
  npc_override_rebel_in_quests_16_2_since_i_cook_our_glutton_3eccc7: "既然我得给我们这些大胃王做饭，我不能走太远。所以很抱歉没能准备什么好吃的。"
  npc_override_rebel_in_quests_16_2_since_i_looking_her_cont_19d6a5: "既然我一直在观察她，我知道那位女士没有说话也没有行动。但那个叫维罗的男人似乎明白她在想什么，继续说着话。"
  npc_override_rebel_in_quests_16_2_since_larcis_charge_our_0714ac: "既然拉西斯负责我们的生意，请去问他。他会告诉你我们需要什么。"
  npc_override_rebel_in_quests_16_2_since_military_group_you_b8f16b: "既然这是军事组织，你有规章制度要遵守。"
  npc_override_rebel_in_quests_16_2_since_most_kids_busy_the_ba26cd: "既然大多数孩子最近都很忙，我感到有些无聊。"
  npc_override_rebel_in_quests_16_2_since_mountainous_area_t_8ff2e7: "既然是山区，即使平时偶尔也会刮大风……这是每天都发生的事，所以我不觉得奇怪。"
  npc_override_rebel_in_quests_16_2_since_official_mission_i_7bf512: "既然这不是官方任务，我不能给你丰厚的奖励。但这仍然是一项了不起的成就。"
  npc_override_rebel_in_quests_16_2_since_royal_family_rune_823338: "既然卢恩-米德加尔特的皇室在帮助我们，我们决定进行随机检查。"
  npc_override_rebel_in_quests_16_2_since_s_incident_already_a76f36: "既然这是已经发生的事情，而且现在不重要，我就跳过解释了。如果你好奇，可以以后去查。"
  npc_override_rebel_in_quests_16_2_since_s_shooting_star_mu_c2c04f: "既然是流星，它一定会闪烁！那颗通过燃烧自己来发出最后光芒的流星！光芒会散开……光是想象就很美。"
  npc_override_rebel_in_quests_16_2_since_s_too_cold_i_cc6c3d: "既然太冷了，我出不去。亲爱的，你能给我带些柴火吗？"
  npc_override_rebel_in_quests_16_2_since_sound_echoes_here_1af512: "既然这里声音会回响，请安静地走。不要跑。"
  npc_override_rebel_in_quests_16_2_since_there_been_change_f920f2: "既然日程有变，我们可能会错过彼此。"
  npc_override_rebel_in_quests_16_2_since_there_eyes_everywh_4e3a32: "既然到处都是眼睛，她让我去英雄的房间。"
  npc_override_rebel_in_quests_16_2_since_there_grudges_i_kn_c6360f: "既然有怨灵在，我知道这不容易。但我们就靠你了。"
  npc_override_rebel_in_quests_16_2_since_there_so_many_impu_4f2c83: "既然金属中混了这么多杂质，她处理起来一定很困难。但她勉强做到了。"
  npc_override_rebel_in_quests_16_2_since_there_so_many_peop_40c309: "既然有这么多人同意，你不应该独自反对。"
  npc_override_rebel_in_quests_16_2_since_there_still_some_r_a868d5: "既然还有一些研究人员躲在实验室里，我们计划进行调查。"
  npc_override_rebel_in_quests_16_2_since_there_too_many_eye_2c18a4: "既然朱诺和总统府都有太多眼睛盯着，他们想在一个不同的地方见我们。"
  npc_override_rebel_in_quests_16_2_since_there_too_many_eye_a6dd4c: "既然这里眼睛太多，去南部贫民窟等着。我很快会派人去。"
  npc_override_rebel_in_quests_16_2_since_these_their_privat_315c93: "既然这些不是他们的私人枪支，他们处理得很粗心。他们没有意识到必须小心对待物品。"
  npc_override_rebel_in_quests_16_2_since_they_all_know_abou_7596a8: "既然他们都认识你，大家都期待你无论如何都要解决这个问题。"
  npc_override_rebel_in_quests_16_2_since_they_had_done_grea_9c920f: "既然他们为反叛者做出了巨大贡献，我们用铅封住他们而不是死刑或开除。"
  npc_override_rebel_in_quests_16_2_since_they_hate_us_there_95919d: "既然他们恨我们，谈判一直没有进展。这就是问题所在。"
  npc_override_rebel_in_quests_16_2_since_they_out_control_t_921c72: "既然他们失控了……我没办法认出他们。"
  npc_override_rebel_in_quests_16_2_since_those_seniors_rela_2ca49f: "既然那些前辈相对理智，我们才能像这样活着说话。如果有一个脾气暴躁的人……呼……"
  npc_override_rebel_in_quests_16_2_since_token_prize_someon_40fe88: "既然这个代币是给为施瓦尔特茨瓦尔特做过工作的人准备的奖品……"
  npc_override_rebel_in_quests_16_2_since_we_don_t_enough_95c148: "既然时间不够，我们快点毁掉设备然后去艾音布罗克。根据我们的特工说，雷肯贝尔和政府现在认真起来了。"
  npc_override_rebel_in_quests_16_2_since_we_don_t_know_31469f: "既然我们不知道他们藏在哪里，从柜子、箱子等角落开始找。"
  npc_override_rebel_in_quests_16_2_since_we_found_location_1864d9: "但既然我们找到了安装在朱诺的禁传设备的地点和属性，我们现在就可以离开。"
  npc_override_rebel_in_quests_16_2_since_we_place_located_n_9ee3dc: "而且既然我们所在的地方几乎在地下，总是又冷又潮湿。你知道那种感觉吗？又冷又潮湿的空气让我们难受。"
  npc_override_rebel_in_quests_16_2_since_we_rebellion_compl_d9c689: "既然我们反叛者已经完全占领了这个地方，请放心去那里。"
  npc_override_rebel_in_quests_16_2_since_we_revealed_secret_bfc662: "既然我们揭露了传送禁制设备的秘密，我们在里希塔乐镇的特工就能找到设备的地点和属性。"
  npc_override_rebel_in_quests_16_2_since_we_these_things_se_eb2813: "既然我们秘密做这些事，这种情况经常发生。"
  npc_override_rebel_in_quests_16_2_since_we_want_fight_hard_f1bdce: "既然我们想在任务中全力以赴，我们欢迎你的提议。"
  npc_override_rebel_in_quests_16_2_since_you_adventurer_we_cc0dcd: "既然你是冒险者，我们想这对你会有帮助。"
  npc_override_rebel_in_quests_16_2_since_you_got_approval_r_d8a975: "既然你得到了鲁珀特的批准，{0}，为什么不回去报告呢？"
  npc_override_rebel_in_quests_16_2_since_you_hot_person_you_96ca3d: "既然你是热门人物，你的回答也很火热。太好了！我们去试试吧。反正就在这个村子里。"
  npc_override_rebel_in_quests_16_2_since_you_minors_i_like_3912f4: "但既然你们是未成年人，我想给你们尽可能多的成长机会。"
  npc_override_rebel_in_quests_16_2_since_you_our_cooperator_29d6ef: "既然你现在是我们合作者了，去四处看看有没有人有困难。"
  npc_override_rebel_in_quests_16_2_since_you_playing_import_934e97: "既然你扮演着重要角色，你也需要知道这件事。"
  npc_override_rebel_in_quests_16_2_since_you_you_cannot_pro_3d65af: "既然你没有^00ffff{0}^000000，你无法继续前进。"
  npc_override_rebel_in_quests_16_2_single_fish_lives_here_w_39d4a2: "这里连一条鱼都没有。剩下的老人走后，这个村子会变成什么样？"
  npc_override_rebel_in_quests_16_2_sir_0b8205: "长官！"
  npc_override_rebel_in_quests_16_2_sir_143ddc: "长官。"
  npc_override_rebel_in_quests_16_2_sir_stuff_quite_sensitiv_687a65: "长官。那东西很敏感，你不应该随意碰它。"
  npc_override_rebel_in_quests_16_2_sister_a7a392: "姐姐！"
  npc_override_rebel_in_quests_16_2_sister_he_gonie_b1f8fa: "姐姐，他是戈尼。"
  npc_override_rebel_in_quests_16_2_skia_activate_45eb9d: "斯奇亚，启动它。"
  npc_override_rebel_in_quests_16_2_skia_coming_you_she_very_886db2: "斯奇亚会和你一起去。她会很有帮助。"
  npc_override_rebel_in_quests_16_2_skia_d1b423: "斯奇亚？"
  npc_override_rebel_in_quests_16_2_skia_told_spica_about_he_6938c2: "斯奇亚把她症状告诉了斯皮卡。"
  npc_override_rebel_in_quests_16_2_small_hole_where_one_per_b05bf5: "这是一个勉强能容一个人通过的小洞。"
  npc_override_rebel_in_quests_16_2_smells_good_1af314: "闻起来很香。"
  npc_override_rebel_in_quests_16_2_smells_good_course_s_as_d48c20: "闻起来很香。当然不如露西做的……"
  npc_override_rebel_in_quests_16_2_smells_nice_i_ask_them_9cb539: "闻起来不错……我待会儿问问他们配方。"
  npc_override_rebel_in_quests_16_2_snap_c72156: "^FF0000>>>啪<<<^000000"
  npc_override_rebel_in_quests_16_2_sniffle_we_didn_t_throw_667280: "呜咽。我们不是故意扔手榴弹的，我们也不享受。这是我们的错。但是，但是……"
  npc_override_rebel_in_quests_16_2_so_10b991: "是这样吗？"
  npc_override_rebel_in_quests_16_2_so_c0034e: "是这样。"
  npc_override_rebel_in_quests_16_2_so_cooperative_relations_6d8652: "所以这将是一种合作关系。"
  npc_override_rebel_in_quests_16_2_so_delicious_c09446: "太好吃了。"
  npc_override_rebel_in_quests_16_2_so_delicious_we_finished_2f78b8: "太好吃了，我们当天就吃完了。不是吗？"
  npc_override_rebel_in_quests_16_2_so_don_t_look_me_b2c090: "所以别那样看着我！！"
  npc_override_rebel_in_quests_16_2_so_false_rumor_adventure_89bc05: "所以冒险者包里带3万颗宝石是假消息。"
  npc_override_rebel_in_quests_16_2_so_far_i_haven_t_e06fa3: "到目前为止，我没看到任何可疑的人！"
  npc_override_rebel_in_quests_16_2_so_here_s_my_request_66cc10: "所以这是我的请求。"
  npc_override_rebel_in_quests_16_2_so_how_going_9f19a9: "那么，进展如何？"
  npc_override_rebel_in_quests_16_2_so_i_am_requesting_you_a0efa5: "所以我请求你。"
  npc_override_rebel_in_quests_16_2_so_i_come_out_here_5670f2: "所以我经常来这里。这里的水太脏了，没有鱼。我只是享受这种感觉。"
  npc_override_rebel_in_quests_16_2_so_i_d_rather_fight_e13532: "所以我宁愿不和祭司打架……"
  npc_override_rebel_in_quests_16_2_so_i_decided_as_i_815dc0: "所以我决定随心所欲。"
  npc_override_rebel_in_quests_16_2_so_i_gave_her_sewing_0019bd: "所以我给了她这个针线盒。"
  npc_override_rebel_in_quests_16_2_so_i_ll_support_cooperat_26c842: "所以我会支持与合作秘密之翼。你需要我的签名吗？"
  npc_override_rebel_in_quests_16_2_so_i_need_take_some_c03568: "……所以我需要再拿一些钱。谢谢你的理解。"
  npc_override_rebel_in_quests_16_2_so_i_request_you_check_f86c0f: "所以我请求你检查他们的问题并解决它，冒险者。"
  npc_override_rebel_in_quests_16_2_so_i_scared_i_did_5b7f3c: "所以我很害怕……我是故意的……呜咽。"
  npc_override_rebel_in_quests_16_2_so_i_support_cooperation_a8af4a: "所以我支持与合作秘密之翼。你需要我的签名吗？"
  npc_override_rebel_in_quests_16_2_so_i_thinking_you_having_d9a590: "……所以我以为你得了痴呆症。"
  npc_override_rebel_in_quests_16_2_so_i_try_get_prepare_13c195: "所以我尽量准备最好的茶和点心……但在这个偏僻的地方很难找到。"
  npc_override_rebel_in_quests_16_2_so_i_trying_improve_myse_ba7146: "所以我试图自己改进。但听了你的话后，我改变了主意。"
  npc_override_rebel_in_quests_16_2_so_important_information_c04d8c: "那么，重要的信息是……"
  npc_override_rebel_in_quests_16_2_so_let_me_give_you_a60453: "……那么，让我再给你凤尾鱼饼干。请找到查丽蒂。"
  npc_override_rebel_in_quests_16_2_so_many_them_even_if_65d846: "这么多……即使你管理得很仔细？"
  npc_override_rebel_in_quests_16_2_so_my_dear_you_come_ba49a4: "亲爱的，你明天会回来吗？"
  npc_override_rebel_in_quests_16_2_so_noisy_outside_so_i_b80ab5: "外面太吵了，所以我出来了。原来是你。"
  npc_override_rebel_in_quests_16_2_so_old_d94f1d: "没那么老！"
  npc_override_rebel_in_quests_16_2_so_other_people_responsi_3a9957: "所以内部工作都是其他人负责的。他们是^0000cd实际推动反叛者的人^000000。他们是决策者。"
  npc_override_rebel_in_quests_16_2_so_please_bring_me_five_d379ed: "所以请给我带五个铁来。"
  npc_override_rebel_in_quests_16_2_so_please_bring_one_star_c68953: "所以请带一个星之碎片来，这是核心材料。一旦你给我带来，我们就可以修好它马上离开。我会准备好的。"
  npc_override_rebel_in_quests_16_2_so_reason_4da3de: "所以……这就是原因。"
  npc_override_rebel_in_quests_16_2_so_rebellion_put_their_g_ea1782: "所以反叛者把他们的公会设在艾音布罗克。其余的人藏在艾音布罗克的其他地方。这就是为什么我建议你在艾音贝赫见面……"
  npc_override_rebel_in_quests_16_2_so_s_material_hmm_f85d92: "所以……是材料。嗯……"
  npc_override_rebel_in_quests_16_2_so_s_true_adventurers_ki_b7d25d: "所以冒险者真的很善良！"
  npc_override_rebel_in_quests_16_2_so_she_s_listening_me_286d2a: "（所以她现在在听我说。说服她会困难得多。）"
  npc_override_rebel_in_quests_16_2_so_they_borrow_them_here_6b28d2: "所以他们可以在这里借到。"
  npc_override_rebel_in_quests_16_2_so_they_started_hate_me_ba06c8: "（所以他们很早就开始恨我了……我该怎么办？"
  npc_override_rebel_in_quests_16_2_so_true_adventurers_so_t_4c8d3d: "所以冒险者真的很有才华。我请求的时候还有点担心。"
  npc_override_rebel_in_quests_16_2_so_true_mr_adler_soldier_38bd73: "……原来是真的。阿德勒先生毕竟是个高级军官。"
  npc_override_rebel_in_quests_16_2_so_we_d_like_request_47e012: "所以我们想请你进行一次前期探索。"
  npc_override_rebel_in_quests_16_2_so_we_fix_before_leaving_f56eb6: "所以我们必须在离开前修好它。"
  npc_override_rebel_in_quests_16_2_so_we_like_give_you_33e210: "所以，我们想给你一些简单的请求或任务。"
  npc_override_rebel_in_quests_16_2_so_we_pretend_cooperate_97aa37: "所以我们会假装与秘密之翼合作，先把讨厌的人除掉。"
  npc_override_rebel_in_quests_16_2_so_we_re_being_kicked_66751f: "所以我们……不会被赶出去？"
  npc_override_rebel_in_quests_16_2_so_we_taking_opportunity_2a1db2: "所以我们正在利用这个机会执行我们计划好的事情。"
  npc_override_rebel_in_quests_16_2_so_we_ve_been_talking_5cce60: "所以我们一直在找错人谈话。"
  npc_override_rebel_in_quests_16_2_so_where_am_i_fb8c2e: "那么，我在哪里？"
  npc_override_rebel_in_quests_16_2_so_why_did_you_come_b8d8d6: "那么，你为什么来这里？顺便问一下，你是谁？"
  npc_override_rebel_in_quests_16_2_so_why_did_you_leave_c762b6: "那么，你为什么离开家？"
  npc_override_rebel_in_quests_16_2_so_you_abandoning_me_aga_dc01a6: "所以你又要抛弃我了？那让我先杀了你！"
  npc_override_rebel_in_quests_16_2_so_you_b17845: "原来是你。"
  npc_override_rebel_in_quests_16_2_so_you_charge_housekeepi_daf3aa: "所以你是负责这里家务的？"
  npc_override_rebel_in_quests_16_2_so_you_going_back_prince_f68546: "所以你要回去了，公主。"
  npc_override_rebel_in_quests_16_2_so_you_ll_return_yoursel_a727aa: "所以你要自己还回去？"
  npc_override_rebel_in_quests_16_2_so_you_meet_crux_lightha_1095d9: "所以你必须在^4d4dff里希塔乐镇机场^000000^4d4dff与克鲁克斯见面^000000。然后你必须根据克鲁克斯已经调查过的线索缩小范围。"
  npc_override_rebel_in_quests_16_2_so_you_re_all_here_358be9: "所以你们都在这儿？我已经听说了全部。"
  npc_override_rebel_in_quests_16_2_so_you_re_going_mine_47ea99: "所以你要去矿上？"
  npc_override_rebel_in_quests_16_2_so_you_re_kicking_us_49c7bc: "所以你要赶我们走？内梅里先生。你不能这样做。"
  npc_override_rebel_in_quests_16_2_so_you_re_one_secret_6a63f3: "所以你是秘密之翼的人，对吧？"
  npc_override_rebel_in_quests_16_2_so_you_talked_them_3651b2: "那么，你和他们谈过了？"
  npc_override_rebel_in_quests_16_2_so_you_ve_brought_what_7965ad: "所以你把我让你带的东西带来了？让我看看……"
  npc_override_rebel_in_quests_16_2_so_you_want_reward_e1b189: "……那么？你想要奖励？"
  npc_override_rebel_in_quests_16_2_some_lucky_guys_come_bac_b1f4ec: "有些幸运的家伙就这样回来了。"
  npc_override_rebel_in_quests_16_2_some_people_said_younger_e4ead4: "有人说妹妹往平民区扔了手榴弹。但我不知道确切的故事。"
  npc_override_rebel_in_quests_16_2_some_reason_i_felt_like_edddeb: "不知为何，我今天想来这里。"
  npc_override_rebel_in_quests_16_2_some_remnants_went_figel_d5bd08: "一些残余势力去了菲格尔，但其余的人聚集在艾音贝赫和艾音布罗克组织反叛者。顺便说一下，艾音布罗克是一个大城市，很多人居住和经过。不是吗？"
  npc_override_rebel_in_quests_16_2_someone_come_i_think_he_dfec23: "有人来了，我觉得他在找你。"
  npc_override_rebel_in_quests_16_2_someone_you_know_well_to_5736c1: "某个你很熟悉的人让我把这个交给你。"
  npc_override_rebel_in_quests_16_2_something_extremely_impo_d25c8d: "对我们家族来说极其重要的东西被偷了。"
  npc_override_rebel_in_quests_16_2_sometimes_i_face_some_un_36a593: "有时我不得不面对一些不愉快的情况，做一些有时不道德的事情。但为了我的任务和生存，我必须毫不犹豫地做出瞬间决定并执行行动。"
  npc_override_rebel_in_quests_16_2_sometimes_i_reclaim_them_871b2b: "有时我有空的时候会回收它们。有时我会派新人去取。但如你所见，我们最近相当忙。"
  npc_override_rebel_in_quests_16_2_sometimes_i_wish_she_cal_a41d30: "有时我希望她叫我'哥哥'……"
  npc_override_rebel_in_quests_16_2_sometimes_you_look_older_286b08: "有时你看起来比科特内斯还老！"
  npc_override_rebel_in_quests_16_2_soon_our_day_come_0290c9: "很快，我们的时代就会到来。"
  npc_override_rebel_in_quests_16_2_soon_they_realize_buying_10c787: "很快他们就会意识到买这个迫击炮会给他们带来巨大的利润，然后蜂拥而至克拉纳·内梅里！来吧，如果你不买什么，请离开！稍后再来！"
  npc_override_rebel_in_quests_16_2_sorry_d449c9: "对不起。"
  npc_override_rebel_in_quests_16_2_sorry_dfac4e: "还有……对不起。"
  npc_override_rebel_in_quests_16_2_sorry_having_entered_roo_2e3dc4: "对不起，在主人不在的时候进了房间。"
  npc_override_rebel_in_quests_16_2_sorry_i_guess_i_made_c25896: "对不起。我猜我做了错误的判断。我应该收集更准确的信息。"
  npc_override_rebel_in_quests_16_2_sorry_i_m_late_9d8b67: "对不起，我迟到了。"
  npc_override_rebel_in_quests_16_2_sorry_if_i_don_t_53242c: "对不起。如果我没有足够的光滑纸，我就不能做花束……"
  npc_override_rebel_in_quests_16_2_sorry_inconvenience_11b5cd: "抱歉给您带来不便。"
  npc_override_rebel_in_quests_16_2_sorry_interrupt_you_only_683ee4: "抱歉打扰你，但这里唯一能战斗的特工就是冒险者和我……"
  npc_override_rebel_in_quests_16_2_sorry_lucky_so_many_thin_58c33c: "对不起。拉奇有很多事情要做……我替他道歉。"
  npc_override_rebel_in_quests_16_2_sorry_request_you_again_7fa15f: "抱歉再次请求你，冒险者。请击败^0000cd10个黑曜石和10个矿石^000000。就靠你了。"
  npc_override_rebel_in_quests_16_2_sorry_some_our_kids_spoi_37ad37: "对不起。我们有些孩子被宠坏了……剩下的就靠你了。"
  npc_override_rebel_in_quests_16_2_sorry_sorry_as_matter_fa_c21452: "对不起！对不起！事实上，我很早就到了这里。但我必须和特工谈话才能找到正确的位置。我应该提前到达并叫你的。抱歉让你一个人来这里。"
  npc_override_rebel_in_quests_16_2_sorry_what_happened_yuno_f2d42b: "为在朱诺发生的事道歉。"
  npc_override_rebel_in_quests_16_2_sorry_your_inconvenience_9fec12: "抱歉给您带来不便。请稍等。"
  npc_override_rebel_in_quests_16_2_sort_we_lend_weapons_reb_7b8d75: "算是吧。我们在这里借武器给反叛者。"
  npc_override_rebel_in_quests_16_2_sounds_funny_i_m_saying_9f218f: "作为USU的指挥官说这话听起来很可笑……"
  npc_override_rebel_in_quests_16_2_sounds_good_we_save_mone_3a9ecf: "听起来不错。我们可以省钱。"
  npc_override_rebel_in_quests_16_2_sounds_like_bunch_nonsen_dfd687: "听起来像是一堆废话。我不想再听了。"
  npc_override_rebel_in_quests_16_2_sounds_like_everybody_he_243c2a: "听起来这里的每个人都很酷。"
  npc_override_rebel_in_quests_16_2_sounds_like_he_been_cure_e2fd15: "听起来他已经痊愈了，现在没事了。"
  npc_override_rebel_in_quests_16_2_sounds_like_he_brought_t_b0e6e0: "听起来他是从孤儿院带他们来的。"
  npc_override_rebel_in_quests_16_2_spare_button_missing_51a318: "备用纽扣不见了。"
  npc_override_rebel_in_quests_16_2_spica_so_sharp_those_thi_a5b214: "斯皮卡在这些事情上很敏锐。"
  npc_override_rebel_in_quests_16_2_spica_told_crux_investig_5f23ea: "斯皮卡让克鲁克斯调查那天宴会上给我下药的侍女。"
  npc_override_rebel_in_quests_16_2_ssssh_b3df3d: "嘘！"
  npc_override_rebel_in_quests_16_2_stop_978c88: "住手！"
  npc_override_rebel_in_quests_16_2_stop_9e2534: "停下"
  npc_override_rebel_in_quests_16_2_stop_i_pet_her_5da346: "住手！让我来摸她！！"
  npc_override_rebel_in_quests_16_2_stop_stalling_ba4499: "别拖延了……"
  npc_override_rebel_in_quests_16_2_stop_wandering_around_ge_653406: "别到处晃悠了，快滚。"
  npc_override_rebel_in_quests_16_2_store_even_small_sound_c_8ccc19: "在这家店里，即使很小的声音也会因为结构而产生巨大的共鸣。请在这里保持安静。"
  npc_override_rebel_in_quests_16_2_strange_according_my_cal_727675: "这很奇怪。根据我的计算，这些迫击炮今天应该已经卖出去了……四天后，我们应该达到盈亏平衡点。之后，我们就会开始盈利。"
  npc_override_rebel_in_quests_16_2_stranger_rarely_visits_p_1b5565: "陌生人很少来这个地方。所以像你这样的人会吸引所有人的注意。"
  npc_override_rebel_in_quests_16_2_strictly_speaking_no_let_41e237: "严格来说，不是。但我们就说类似吧。"
  npc_override_rebel_in_quests_16_2_stroke_my_head_c76cb1: "不要摸我的头。"
  npc_override_rebel_in_quests_16_2_strong_wind_turned_off_t_4661b8: "大风……熄灭的火把……"
  npc_override_rebel_in_quests_16_2_such_long_time_us_worry_68a6fb: "但对我们来说还没有长到需要担心的地步。"
  npc_override_rebel_in_quests_16_2_suicide_bombing_he_faile_2cd007: "那是自杀式爆炸，但他失败了。他太轻易地放弃了自己的生命。"
  npc_override_rebel_in_quests_16_2_superior_unit_6db130: "上级……单位？"
  npc_override_rebel_in_quests_16_2_superstar_denny_going_ho_d7f4dd: "超级巨星丹尼现在要回家了！"
  npc_override_rebel_in_quests_16_2_sure_i_plenty_time_way_9971ce: "当然。我有很多时间。顺便问一下，我一直待在这里可以吗？"
  npc_override_rebel_in_quests_16_2_surely_i_want_express_my_5ce538: "当然，我想表达对戈尼所做的一切的感谢。"
  npc_override_rebel_in_quests_16_2_suspicious_tell_me_hones_1e2e8d: "这很可疑。老实告诉我。"
  npc_override_rebel_in_quests_16_2_t_you_just_drink_tea_4b5297: "你就不能在离开前喝杯茶吗？我好不容易才弄到这种茶……你以前也喜欢……"
  npc_override_rebel_in_quests_16_2_t_you_please_skip_perfor_5ba5f6: "你能不能跳过那个表演？"
  npc_override_rebel_in_quests_16_2_t_you_see_i_am_969675: "你看不出来吗？我是游客，这是我的秘书。"
  npc_override_rebel_in_quests_16_2_take_care_guys_please_b9fb6d: "请照顾好这些家伙。"
  npc_override_rebel_in_quests_16_2_take_care_yourself_2c96e0: "照顾好自己！"
  npc_override_rebel_in_quests_16_2_take_care_yourself_6a871d: "照顾好自己。"
  npc_override_rebel_in_quests_16_2_take_fellow_out_now_0ddd07: "现在把这个家伙带出去。"
  npc_override_rebel_in_quests_16_2_take_him_out_first_799322: "先把他带出去！！！"
  npc_override_rebel_in_quests_16_2_take_look_around_tell_me_e3569b: "四处看看，告诉我你在找什么。"
  npc_override_rebel_in_quests_16_2_take_seat_some_cookies_55cc52: "请坐，吃些饼干。"
  npc_override_rebel_in_quests_16_2_talented_work_27660a: "……才华横溢的工作？"
  npc_override_rebel_in_quests_16_2_talk_about_cooperation_2db4b8: "谈谈合作。"
  npc_override_rebel_in_quests_16_2_talk_me_before_meeting_aa0455: "在会议前和我谈谈。"
  npc_override_rebel_in_quests_16_2_talk_me_when_you_nothing_8d5029: "没事的时候不要和我说话。"
  npc_override_rebel_in_quests_16_2_talk_me_when_you_ready_f30135: "准备好的时候和我谈。然后我会让你进入竞技场的等候室。"
  npc_override_rebel_in_quests_16_2_talkative_guy_stooge_pre_a6dc5d: "那个话痨是总统的走狗。但你是个随时可以离开的冒险者。"
  npc_override_rebel_in_quests_16_2_talking_like_clothes_you_c146d1: "穿着那身衣服说这种话，你看起来没什么说服力。"
  npc_override_rebel_in_quests_16_2_tastes_good_certainly_be_6595ee: "味道不错！当然不如露西奶奶做的好。但仍然很棒。"
  npc_override_rebel_in_quests_16_2_teaching_juniors_after_r_449aa5: "退休后教后辈，我时不时想起我的儿子。"
  npc_override_rebel_in_quests_16_2_teleport_69007d: "传送？"
  npc_override_rebel_in_quests_16_2_teleporting_available_sc_6200a8: "施瓦尔特茨瓦尔特地区无法传送。我相信你知道这一点。"
  npc_override_rebel_in_quests_16_2_tell_each_senior_command_7a19c8: "通知每位高级指挥官和指挥官现在集合。"
  npc_override_rebel_in_quests_16_2_tell_fools_who_sent_you_106600: "告诉派你来的那些蠢货！"
  npc_override_rebel_in_quests_16_2_tell_guard_rookie_sent_y_725ebc: "告诉卫兵是菜鸟派你来的。"
  npc_override_rebel_in_quests_16_2_tell_guy_downstairs_you_5c28f2: "告诉楼下那个人，因为我威胁你，你别无选择。"
  npc_override_rebel_in_quests_16_2_tell_him_buy_some_cosmet_6b4231: "让他从卢恩-米德加尔特买些化妆品！"
  npc_override_rebel_in_quests_16_2_tell_his_excellency_wait_bbf08b: "告诉阁下，即使阁下想念我，也请稍等。"
  npc_override_rebel_in_quests_16_2_tell_kids_front_door_ent_2e0dd3: "告诉门口的孩子们，在里德什冷静下来之前不要进来。"
  npc_override_rebel_in_quests_16_2_tell_leader_about_having_1cc308: "告诉首领你救了戈尼的事。"
  npc_override_rebel_in_quests_16_2_tell_me_exactly_how_you_6c85b4: "除非你想死，否则告诉我你是怎么到这里的，你从哪里来。"
  npc_override_rebel_in_quests_16_2_tell_me_terms_trade_9bd5a3: "告诉我交易条件。"
  npc_override_rebel_in_quests_16_2_tell_me_what_you_brought_446c63: "告诉我你带了什么！"
  npc_override_rebel_in_quests_16_2_tell_me_when_you_feel_dbb38b: "想打架的时候告诉我。"
  npc_override_rebel_in_quests_16_2_tell_me_when_you_fully_d66465: "完全准备好的时候告诉我。我会去等候室。"
  npc_override_rebel_in_quests_16_2_tell_them_about_me_come_d24a65: "告诉他们关于我的事，然后和他们一起回来。"
  npc_override_rebel_in_quests_16_2_tell_them_ca0e57: "告诉他们！"
  npc_override_rebel_in_quests_16_2_tell_truth_i_want_see_df8ce3: "说实话！！我想见查丽蒂！！我想摸她！！我太想她了！"
  npc_override_rebel_in_quests_16_2_tell_us_your_point_f00d2a: "告诉我们你的观点！"
  npc_override_rebel_in_quests_16_2_tell_you_briefly_mercena_526d2b: "简单来说，雇佣兵被用作共和国的驻军。但随着共和国开发了守护者，他们即将被抛弃。然后雇佣兵起义，几乎被全歼。"
