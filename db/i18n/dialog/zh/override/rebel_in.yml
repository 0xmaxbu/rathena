  npc_override_rebel_in_quests_16_2_we_attacked_them_all_sud_2f381e: "我们突然袭击了他们，我们预计还有更多人躲藏着。"
  npc_override_rebel_in_quests_16_2_we_attacked_them_all_sud_33784c: "我们突然袭击了他们，我们预计还有更多人躲藏着。但我们迟早会找到他们。"
  npc_override_rebel_in_quests_16_2_we_been_discussing_diplo_ed233c: "我们一直在讨论行动中可能出现的外交问题。此外，我们还谈了与企业和其他计划的关系。"
  npc_override_rebel_in_quests_16_2_we_been_investigating_pl_a84a3e: "我们调查这个地方已经很长时间了。"
  npc_override_rebel_in_quests_16_2_we_been_talking_about_pa_16f5e2: "我们一直在谈即将举行的派对。"
