  npc_override_rebel_in_quests_16_2_there_reward_we_prepared_ac2584: "我们为你准备了奖励但还没给你。所以我发了这封信邀请你。"
  npc_override_rebel_in_quests_16_2_there_s_no_need_sad_a8d55c: "没必要难过。"
  npc_override_rebel_in_quests_16_2_there_s_nothing_they_pro_84b575: "他们什么都做不好。而且，他们甚至不听我们的话。"
  npc_override_rebel_in_quests_16_2_there_s_someone_you_shou_c51296: "……还有一个人你应该最后谈谈。"
  npc_override_rebel_in_quests_16_2_there_s_something_air_4375ad: "空气中有股味道。"
  npc_override_rebel_in_quests_16_2_there_s_something_i_like_5ee741: "我有件事想告诉你。"
  npc_override_rebel_in_quests_16_2_there_s_something_i_like_ac901f: "我有件事想问你。"
  npc_override_rebel_in_quests_16_2_there_s_something_more_i_cdfd2a: "现在有更重要的事。这是迪恩的一封信。"
  npc_override_rebel_in_quests_16_2_there_s_still_some_water_4fd7ff: "但管道还有漏水。我修了一个，另一个管道又漏了……我希望我们能换成全新的管道。"
  npc_override_rebel_in_quests_16_2_there_several_more_facil_ac80b4: "还有几处设施据推测也有像这样的秘密实验室。"
  npc_override_rebel_in_quests_16_2_there_slight_problem_mer_538862: "有个小问题。佣兵戒指A型和B型在初始化过程中可能会损坏。概率约为20%。由于它们是小物品，消除升级效果时会有严重的副作用。"
