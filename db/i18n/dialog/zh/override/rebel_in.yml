  npc_override_rebel_in_quests_16_2_you_don_t_enough_space_55560c: "你的包空间不够。"
  npc_override_rebel_in_quests_16_2_you_don_t_enough_tokens_93e213: "你的代币不够……"
  npc_override_rebel_in_quests_16_2_you_don_t_look_like_c54121: "你看起来不像反叛者。"
  npc_override_rebel_in_quests_16_2_you_don_t_need_talk_1afd37: "你不需要和我们说话！"
  npc_override_rebel_in_quests_16_2_you_don_t_nervous_i_f206a9: "你不必紧张。我会负责和他们谈话。你只需在我旁边补充几句话。"
  npc_override_rebel_in_quests_16_2_you_don_t_tell_me_0f4c51: "你不必告诉我故事。你已经用行动告诉我了。如果我能和你并肩作战，我会欢迎任何事情。"
  npc_override_rebel_in_quests_16_2_you_don_t_them_44f45f: "你没有吗？"
  npc_override_rebel_in_quests_16_2_you_dragging_you_somethi_7870f5: "你在拖延……你有事要求我，不是吗？"
  npc_override_rebel_in_quests_16_2_you_escorting_spica_righ_70c620: "你在护送斯皮卡，对吧？"
  npc_override_rebel_in_quests_16_2_you_even_know_where_you_8c5d7a: "你知道你在哪吗？"
