  npc_override_rebel_in_quests_16_2_how_you_so_sure_31cc35: "你怎么这么确定？"
  npc_override_rebel_in_quests_16_2_however_i_don_t_know_d5fe20: "然而，我不知道女士们给他们看了什么牌……"
  npc_override_rebel_in_quests_16_2_huge_system_cannot_opera_6eae41: "这是一个无法由一两个成员操作的庞大系统。而且没有其他人。"
