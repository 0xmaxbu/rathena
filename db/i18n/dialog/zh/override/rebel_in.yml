  npc_override_rebel_in_quests_16_2_difficult_me_i_m_sorry_62d451: "这对我来说很难。很抱歉你得找别人。"
  npc_override_rebel_in_quests_16_2_difficult_now_you_carry_80f905: "现在很难了。你得背着他。如果对你来说太重，你可以命令我强壮的秘书来抬他~"
