  npc_override_rebel_in_quests_16_2_i_m_sure_if_i_759bd8: "我不确定我能否对一个外人说这个……但你现在和反叛军很亲近。"
  npc_override_rebel_in_quests_16_2_i_m_sure_people_stop_3e8694: "我相信人们会阻止她冲向进入矿场的火车。对吧？"
