  npc_override_rebel_in_quests_16_2_i_am_interested_you_nois_fc23d3: "我对你和吵闹的游客都不感兴趣。"
  npc_override_rebel_in_quests_16_2_i_am_member_secret_wings_d6c4b9: "而且我是秘翼的成员，一个直接对施瓦茨瓦尔德共和国总统负责的机构。既然总统保证了我的身份，你不必担心。"
