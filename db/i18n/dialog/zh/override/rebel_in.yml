  npc_override_rebel_in_quests_16_2_i_am_sorry_i_cannot_e453b2: "很抱歉我不能陪你完成这次任务。"
  npc_override_rebel_in_quests_16_2_i_am_staying_here_hahaha_7b94d3: "我待在这里。哈哈哈。我真的很喜欢这家伙，我们可以一起工作。"
  npc_override_rebel_in_quests_16_2_i_am_still_upset_791b44: "但我仍然很沮丧。"
  npc_override_rebel_in_quests_16_2_i_am_struggling_now_you_4e1966: "我现在很挣扎。你不想我被抓。不是吗？"
  npc_override_rebel_in_quests_16_2_i_am_telling_you_advance_b205ec: "我先告诉你。每次你初始化戒指时，有20%的概率会摧毁。你确定要继续吗？"
  npc_override_rebel_in_quests_16_2_i_am_very_busy_because_d01de4: "我很忙，因为我必须喂这些贪吃鬼~好了~我希望你能帮我做点事~"
