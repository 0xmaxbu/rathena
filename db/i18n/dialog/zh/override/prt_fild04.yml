  npc_override_prt_fild04_quest_creamy_after_you_lost_some_weig_b89d61: "等你减掉一些体重之后。"
  npc_override_prt_fild04_quest_creamy_ah_ok_i_think_you_108dce: "啊，好的，我想你可以帮我猎杀一些蝴蝶精灵。"
