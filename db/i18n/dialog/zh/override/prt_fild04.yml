  npc_override_prt_fild04_quest_creamy_hmm_i_don_t_think_2144d7: "嗯……我想你还没有猎杀够50只……"
  npc_override_prt_fild04_quest_creamy_hmm_i_don_t_think_5d960b: "嗯……我想你还没有猎杀够150只……"
