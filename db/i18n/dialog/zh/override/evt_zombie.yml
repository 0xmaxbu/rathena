Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_evt_zombie_halloween_2008_all_participants_should_3902bf: "所有参与者应不穿戴任何装备。"
  npc_override_evt_zombie_halloween_2008_anything_else_9be99f: "还有别的吗？"
  npc_override_evt_zombie_halloween_2008_as_i_promised_a9694c: "如我所承诺的"
  npc_override_evt_zombie_halloween_2008_come_back_once_you_re_5f615d: "准备好了再回来。"
  npc_override_evt_zombie_halloween_2008_come_don_t_wuss_bcf722: "来吧！别当胆小鬼！"
  npc_override_evt_zombie_halloween_2008_good_job_kkkkkk_2cd7f4: "干得好！咯咯咯咯！"
  npc_override_evt_zombie_halloween_2008_gosh_abfcaa: "天哪！"
  npc_override_evt_zombie_halloween_2008_got_b740d2: "明白了吗？"
  npc_override_evt_zombie_halloween_2008_ha_e2ddbc: "哈！"
  npc_override_evt_zombie_halloween_2008_here_7f5577: "给你。"
  npc_override_evt_zombie_halloween_2008_hey_44afd2: "嘿……"
  npc_override_evt_zombie_halloween_2008_i_hope_you_come_back_d64859: "希望你能平安回来。"
  npc_override_evt_zombie_halloween_2008_i_quite_swamped_my_work_b4842a: "我被工作忙得不可开交，所以累坏了。"
  npc_override_evt_zombie_halloween_2008_i_sometimes_forget_send_e78317: "我有时会忘记把你送到那里……"
  npc_override_evt_zombie_halloween_2008_i_special_event_hallowee_536667: "我有个特别的万圣节活动，考验你的运气和敏捷。"
  npc_override_evt_zombie_halloween_2008_if_you_collect_enough_ti_8e1ad1: "如果你收集到足够的票券，就能换取丰厚的奖品！"
  npc_override_evt_zombie_halloween_2008_if_you_then_i_remove_a705e3: "如果是的话，我会在你进入之前移除它们。"
  npc_override_evt_zombie_halloween_2008_isn_t_fun_zombies_ff3811: "有僵尸是不是很有趣？？"
  npc_override_evt_zombie_halloween_2008_kkkkkkk_fbb0e7: "咯咯咯咯咯。"
  npc_override_evt_zombie_halloween_2008_kkkkkkkk_37f8bb: "咯咯咯咯咯。"
  npc_override_evt_zombie_halloween_2008_kkkkkkkkk_596607: "咯咯咯咯咯！"
  npc_override_evt_zombie_halloween_2008_lemme_tell_you_what_item_239c15: "让我告诉你可以兑换哪些道具。"
  npc_override_evt_zombie_halloween_2008_let_me_check_your_weight_c7ffa3: "让我检查一下你的负重。"
  npc_override_evt_zombie_halloween_2008_menu_pumpkin_1663e4: "南瓜派:南瓜头:老旧蓝色箱子:老旧紫色箱子:老旧卡册"
  npc_override_evt_zombie_halloween_2008_menu_yes_2f6f57: "是的，我知道:不，我不知道"
  npc_override_evt_zombie_halloween_2008_oh_one_more_thing_4034ae: "哦，还有一件事！"
  npc_override_evt_zombie_halloween_2008_oh_well_done_you_alright_ba89b4: "哦，干得好！你没事！"
  npc_override_evt_zombie_halloween_2008_ok_see_you_then_7ff074: "好，到时候见。"
  npc_override_evt_zombie_halloween_2008_ok_you_ready_1adad0: "好，你准备好了。"
  npc_override_evt_zombie_halloween_2008_one_more_thing_aff907: "还有一件事……"
  npc_override_evt_zombie_halloween_2008_please_come_here_right_n_24ed35: "请带着正确数量的票券来这里。"
  npc_override_evt_zombie_halloween_2008_put_all_belongings_your_e92e6b: "把所有的随身物品放入仓库，等负重为「0」后再回来。"
  npc_override_evt_zombie_halloween_2008_remember_there_three_exi_7ea83a: "记住，有三个出口但只有一个随机有效，那里的僵尸和食尸鬼无法被杀死，而且你不能穿戴任何装备。"
  npc_override_evt_zombie_halloween_2008_s_up_you_find_out_9693ed: "那就要靠你自己去发现了。"
  npc_override_evt_zombie_halloween_2008_so_what_you_say_7ccae5: "那么你怎么说？"
  npc_override_evt_zombie_halloween_2008_t_you_even_count_62b3f1: "你连数数都不会吗？"
  npc_override_evt_zombie_halloween_2008_there_s_always_black_she_175fc8: "哪里都有害群之马。"
  npc_override_evt_zombie_halloween_2008_there_zombies_ghouls_roa_e436bc: "这里有僵尸和食尸鬼游荡，还有三个南边的出口，但只有一个有效。"
  npc_override_evt_zombie_halloween_2008_tickets_old_blue_box_ec8a6c: "50 张票券兑换老旧蓝色箱子。"
  npc_override_evt_zombie_halloween_2008_tickets_old_card_album_fef768: "200 张票券兑换老旧卡册。"
  npc_override_evt_zombie_halloween_2008_tickets_old_purple_box_a310a4: "70 张票券兑换老旧紫色箱子。"
  npc_override_evt_zombie_halloween_2008_tickets_pumpkin_head_a4396a: "20 张票券兑换南瓜头。"
  npc_override_evt_zombie_halloween_2008_tickets_pumpkin_pie_a95ad2: "5 张票券兑换南瓜派。"
  npc_override_evt_zombie_halloween_2008_village_like_virtual_pay_d5fc5c: "这个村庄就像一个虚拟的斐扬。"
  npc_override_evt_zombie_halloween_2008_well_you_want_hear_rules_8d6370: "嗯，你是想再听一次规则，还是直接开始……"
  npc_override_evt_zombie_halloween_2008_what_you_like_exchange_b6bf7d: "你想兑换什么？"
  npc_override_evt_zombie_halloween_2008_you_don_t_enough_tickets_e5e138: "你的票券不够！"
  npc_override_evt_zombie_halloween_2008_you_fraidy_cat_something_d84764: "你是胆小鬼还是怎么的？！"
  npc_override_evt_zombie_halloween_2008_you_get_halloween_ticket_49a364: "你可以获得万圣节票券来换取酷炫的道具。"
  npc_override_evt_zombie_halloween_2008_you_interested_cd805f: "你有兴趣吗？"
  npc_override_evt_zombie_halloween_2008_you_know_rules_448344: "你知道规则吗？"
  npc_override_evt_zombie_halloween_2008_you_know_you_want_try_6b4b11: "你知道你想再试一次……"
  npc_override_evt_zombie_halloween_2008_you_know_zombies_people_6c6196: "你知道吗，僵尸以前也是人！"
  npc_override_evt_zombie_halloween_2008_you_need_016ce5: "你需要……"
  npc_override_evt_zombie_halloween_2008_you_re_overweight_95c234: "你超重了……"
  npc_override_evt_zombie_halloween_2008_you_seem_good_go_your_b4c5b7: "你看起来准备好了，负重也刚好。"
  npc_override_evt_zombie_halloween_2008_you_shouldn_t_forget_a12d8d: "你不该忘记……"
  npc_override_evt_zombie_halloween_2008_you_t_riding_pecopeco_ca_191bce: "你不能骑大嘴鸟或携带手推车。"
  npc_override_evt_zombie_halloween_2008_you_t_use_any_skills_6205bb: "你不能使用任何技能来杀死食尸鬼或僵尸。"
  npc_override_evt_zombie_halloween_2008_you_think_i_wouldn_t_75aba4: "你以为我不会注意到你的负重超过「0」吗？"
  npc_override_evt_zombie_halloween_2008_you_want_exchange_ticket_d3ca3a: "你想用票券兑换奖品吗？"
