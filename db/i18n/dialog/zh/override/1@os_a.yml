Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@os_a_OsOccupation_ask_about_fallen_mutant_ebbafc: "询问关于堕落的变异体。"
  npc_override_1@os_a_OsOccupation_ask_about_miguel_fb379b: "询问关于米格尔"
  npc_override_1@os_a_OsOccupation_ask_about_records_fd33fd: "询问关于记录。"
  npc_override_1@os_a_OsOccupation_before_i_die_i_always_a26e9c: "在我死之前……我一直想见到我的老同事们……你实现了我的愿望。"
  npc_override_1@os_a_OsOccupation_coordinates_received_d14c98: "## 坐标已接收 ##"
  npc_override_1@os_a_OsOccupation_enter_message_input_6702bb: "## 输入消息 ##"
  npc_override_1@os_a_OsOccupation_est_9b0231: "……埃斯特？"
  npc_override_1@os_a_OsOccupation_est_last_thing_i_ll_9ad1bc: "……埃斯特，我最后看到的……是你的脸……这让我感到欣慰。"
  npc_override_1@os_a_OsOccupation_est_rebellion_ghost_squa_643e0b: "埃斯特……反叛幽灵小队……你还记得米格尔叔叔吗？"
  npc_override_1@os_a_OsOccupation_est_you_still_big_heart_97c796: "埃斯特……你还是那么善良……那种感觉……在战场上……是我教你的……"
  npc_override_1@os_a_OsOccupation_even_though_s_cp_rated_395c34: "虽然这只是CP7级别的，抱歉没能给你更多经验。"
  npc_override_1@os_a_OsOccupation_find_everything_you_ll_k_3c5c35: "找到一切……你就会知道在我身上发生了什么……你会看到在这里无法解释的事情。"
  npc_override_1@os_a_OsOccupation_focus_briefing_e19f09: "专注于简报。"
  npc_override_1@os_a_OsOccupation_get_identification_tag_h_e8bdfc: "获取识别标签并交给埃斯特。"
  npc_override_1@os_a_OsOccupation_ha_haha_you_still_rememb_bb925a: "哈……哈哈……你还记得。"
  npc_override_1@os_a_OsOccupation_here_supplies_experience_3c9a42: "这是给参加行动的部队提供的补给和经验。拿着吧。"
  npc_override_1@os_a_OsOccupation_how_you_know_my_name_dd7e9b: "你怎么知道我的名字？你是谁！我会让你死得痛快，所以老实交代。"
  npc_override_1@os_a_OsOccupation_how_you_know_name_a81a9e: "你怎么知道那个名字……"
  npc_override_1@os_a_OsOccupation_i_checked_northeast_sect_6ad483: "我检查了东北区域，看到铁路上方有一个地方似乎是研究设施。"
  npc_override_1@os_a_OsOccupation_i_don_t_think_there_b9b9c7: "我觉得这里不会再有什么事情要做了。"
  npc_override_1@os_a_OsOccupation_i_think_he_stopped_breat_871a38: "^0000FF我觉得他已经停止呼吸了。^000000"
  npc_override_1@os_a_OsOccupation_i_want_go_back_37f0e8: "我想回去。"
  npc_override_1@os_a_OsOccupation_identification_tag_mutan_f020b1: "^0000FF变异体脖子上的识别标签很显眼。^000000"
  npc_override_1@os_a_OsOccupation_intermediate_point_secur_17db25: "中间点已确认安全。"
  npc_override_1@os_a_OsOccupation_krrr_i_guess_you_re_deebff: "嘎。我猜你不是瑞根斯奇姆的人。你能让开吗，我有话要对那个人说。"
  npc_override_1@os_a_OsOccupation_let_s_go_out_now_8efb7c: "我们现在出去吧。我们需要尽快准备维修。"
  npc_override_1@os_a_OsOccupation_maybe_research_miguel_ta_acbb18: "也许米格尔说的研究……就在那里面。我得马上开始另一次行动。"
  npc_override_1@os_a_OsOccupation_menu_alpha_4b11ec: "阿尔法：这是埋伏！当前坐标是奥斯卡·塞拉 9……@$%**！"
  npc_override_1@os_a_OsOccupation_menu_alpha_5280fa: "阿尔法：—— 嗞嗞嗞嗞 ——"
  npc_override_1@os_a_OsOccupation_menu_alpha_673a1e: "阿尔法：排水通道现已清除变异体。确认残留生物实验。正在准备第二次交战。"
  npc_override_1@os_a_OsOccupation_menu_alpha_cb52b2: "阿尔法：阿尔法正在向南推进。我们发现大量变异体正向北朝回音方向移动。"
  npc_override_1@os_a_OsOccupation_menu_alpha_cf6e54: "阿尔法：阿尔法在南排水道发现大量变异体。我们将投入战斗。"
  npc_override_1@os_a_OsOccupation_menu_chemical_150564: "化学处理小组：沼气设施锁定已完成。残留气体将在接下来的几分钟内持续释放。"
  npc_override_1@os_a_OsOccupation_menu_est_021870: "埃斯特：阿尔法小队，开始搜索南部水道周围。"
  npc_override_1@os_a_OsOccupation_menu_est_17679d: "埃斯特：时间到了。我们行动。{0}的部队是支援队，在这里待命并回应通讯。"
  npc_override_1@os_a_OsOccupation_menu_est_239fc1: "埃斯特：{0}，你还活着吗？"
  npc_override_1@os_a_OsOccupation_menu_est_262911: "埃斯特：{0}，你能听到吗？"
  npc_override_1@os_a_OsOccupation_menu_est_26ff2b: "埃斯特：阿尔法，收到。回音，状态报告。"
  npc_override_1@os_a_OsOccupation_menu_est_39a0a8: "埃斯特：信息不多，所以创造信息是我们的职责。从现在起，我们将分成3组并控制这个地方。"
  npc_override_1@os_a_OsOccupation_menu_est_3a67d3: "埃斯特：——收到。"
  npc_override_1@os_a_OsOccupation_menu_est_3b1a31: "埃斯特：回音的接收不顺畅。重新发送消息。"
  npc_override_1@os_a_OsOccupation_menu_est_41313c: "埃斯特：我们不应该出现需要支援的情况，但如果发生这种情况，回音小队将被呼叫。"
  npc_override_1@os_a_OsOccupation_menu_est_4f8c06: "埃斯特：{0}你能听到吗？如果可以，请回应。"
  npc_override_1@os_a_OsOccupation_menu_est_52bb5e: "埃斯特：回音小队由{0}指挥负责后备。你们将封锁这个地方，防止任何人外出。"
  npc_override_1@os_a_OsOccupation_menu_est_69d7a3: "埃斯特：{0}，检查周围是否有痕迹。"
  npc_override_1@os_a_OsOccupation_menu_est_6c8917: "埃斯特：我也希望回音小队如此。"
  npc_override_1@os_a_OsOccupation_menu_est_7638fa: "埃斯特：如果靠得太近，你会立刻死亡，所以在处理完成之前不要移动……"
  npc_override_1@os_a_OsOccupation_menu_est_7e939e: "埃斯特：接收灵敏度良好，回音准备回应，有任何情况立即报告。"
  npc_override_1@os_a_OsOccupation_menu_est_8a2568: "埃斯特：布拉沃已完成东侧搜索。"
  npc_override_1@os_a_OsOccupation_menu_est_92a819: "埃斯特：阿尔法无回应。{0}请支援他们。坐标是奥斯卡·塞拉 32 356"
  npc_override_1@os_a_OsOccupation_menu_est_9d0c82: "埃斯特：阿尔法，交战完成后发送通讯。"
  npc_override_1@os_a_OsOccupation_menu_est_9dc7a6: "埃斯特：布拉沃小队，你们将在东部边界前与我一起清扫。"
  npc_override_1@os_a_OsOccupation_menu_est_a3198b: "埃斯特：我们将向南移动。我会传输新的坐标。请为交战做好准备。"
  npc_override_1@os_a_OsOccupation_menu_est_a619ef: "埃斯特：我将使用无线电发送他们最后接触点的估计坐标。请在获取无线电信息后发送支援。"
  npc_override_1@os_a_OsOccupation_menu_est_b2bb57: "埃斯特：我已确认前方有沼气扩散，目前正在处理中。"
  npc_override_1@os_a_OsOccupation_menu_est_b6fbf5: "埃斯特：阿尔法重新发送你的坐标。阿尔法！！！请回应！！。"
  npc_override_1@os_a_OsOccupation_menu_est_be5fe6: "埃斯特：该死！……回音，检查是否能支援阿尔法的坐标。"
  npc_override_1@os_a_OsOccupation_menu_est_c1d0db: "埃斯特：我们这边交战已结束。"
  npc_override_1@os_a_OsOccupation_menu_est_c82d04: "埃斯特：如果你看到能沟通的变异体，立即捕获它。除此之外……你可以全部制服。"
  npc_override_1@os_a_OsOccupation_menu_est_cc7e9d: "埃斯特：{0}！！回应你当前的状况！！"
  npc_override_1@os_a_OsOccupation_menu_est_d09bfc: "埃斯特：我已发送第二次搜索坐标。注意不要丢失你的记录。"
  npc_override_1@os_a_OsOccupation_menu_est_d536c4: "埃斯特：布拉沃也正朝那里移动，我们跳过东部据点。"
  npc_override_1@os_a_OsOccupation_menu_est_e068b4: "埃斯特：{0}！如果可用，检查阿尔法的坐标！"
  npc_override_1@os_a_OsOccupation_menu_est_ed69b1: "埃斯特：首先，我们需要在这里建立基地。我们不知道有多少个体潜伏在周围。"
  npc_override_1@os_a_OsOccupation_menu_est_f10d75: "埃斯特：{0}。请查看周围是否有残留痕迹。"
  npc_override_1@os_a_OsOccupation_menu_look_27eba6: "再四处看看。:出去"
  npc_override_1@os_a_OsOccupation_menu_operation_1d5fa4: "作战官：据说它的战斗能力比普通变异体强，除非你愿意战斗，否则避免交战。"
  npc_override_1@os_a_OsOccupation_menu_operation_1f7db8: "作战官：第4区据说是机密文件储藏室。"
  npc_override_1@os_a_OsOccupation_menu_operation_303a88: "作战官：处理CP4或更高级别的变异体时要小心。"
  npc_override_1@os_a_OsOccupation_menu_operation_311d4b: "作战官：阿尔法、查理、德尔塔小队也要小心。不要被CP6级别的变异体包围！"
  npc_override_1@os_a_OsOccupation_menu_operation_37293f: "作战官：查理和德尔塔小队，如果出现交战情况，立即投入战斗无需报告。"
  npc_override_1@os_a_OsOccupation_menu_operation_52f8b8: "作战官：主要搜索区域没有平民，所以你可以安全地制服任何移动的生物。"
  npc_override_1@os_a_OsOccupation_menu_operation_65b5a7: "作战官：我们在该区域收到了预警。"
  npc_override_1@os_a_OsOccupation_menu_operation_832b19: "作战官：先遣队已经搜索过该区域，但没有发现异常，所以专注于战斗并小心不要被包围。"
  npc_override_1@os_a_OsOccupation_menu_operation_94e67e: "作战官：看来我来得有点晚了！"
  npc_override_1@os_a_OsOccupation_menu_operation_ae116e: "作战官：阿尔法小队应该在感觉到附近有变异体反应的那一刻就准备战斗。"
  npc_override_1@os_a_OsOccupation_menu_operation_b371e8: "作战官：它们与CP1是同一类型，但等级越高破坏力越大。小心不要被包围。"
  npc_override_1@os_a_OsOccupation_menu_operation_ca5eba: "作战官：布拉沃小队。正在与CP6变异体交战。它们的攻击力非常强大。"
  npc_override_1@os_a_OsOccupation_menu_operation_cdf8b5: "作战官：标记为A013的变异体是与基地无关的独立变异体。"
  npc_override_1@os_a_OsOccupation_menu_operation_eb93df: "作战官：小心，高CP等级的变异体很难对付！"
  npc_override_1@os_a_OsOccupation_menu_operation_fd3aa6: "作战官：致所有小队。如果你发现S级变异体，请立即投入战斗。"
  npc_override_1@os_a_OsOccupation_menu_options_0b3906: "?????? : 回音坐标变异体炮火支援已完成。"
  npc_override_1@os_a_OsOccupation_menu_options_2bf6ea: "?????? : 狐步舞报告，坐标已收到。请注意只打击变异体。"
  npc_override_1@os_a_OsOccupation_menu_options_311240: "???? : 嘎……"
  npc_override_1@os_a_OsOccupation_menu_options_34703b: "?????? : 这里是狐步舞。地面炮火支援已准备就绪。请发送需要支援的坐标。"
  npc_override_1@os_a_OsOccupation_menu_options_7a4bf2: "?????? : 3秒后，仅针对变异体的地面炮火将发送至回音侧。"
  npc_override_1@os_a_OsOccupation_mi_guel_51605c: "米……格尔……？"
  npc_override_1@os_a_OsOccupation_msg_6eae3a: "……"
  npc_override_1@os_a_OsOccupation_mutant_who_s_life_runnin_33ab85: "^0000FF生命垂危的变异体似乎想要说些什么。^000000"
  npc_override_1@os_a_OsOccupation_no_communication_status_47a453: "## 无通讯状态 ##"
  npc_override_1@os_a_OsOccupation_nothing_particular_1a82bd: "没有什么特别的。"
  npc_override_1@os_a_OsOccupation_received_message_1f6567: "## 收到消息 ##"
  npc_override_1@os_a_OsOccupation_remaining_mutant_survivo_49c49d: "剩余变异体幸存者 - {0}"
  npc_override_1@os_a_OsOccupation_sector_secured_bcdcab: "第{0}区已确认安全。"
  npc_override_1@os_a_OsOccupation_send_message_input_986d87: "## 发送消息输入 ##"
  npc_override_1@os_a_OsOccupation_so_don_t_delay_too_ed59db: "是吗？不要拖延太久。"
  npc_override_1@os_a_OsOccupation_somewhere_here_mad_resea_a05605: "就在这某处……瑞根斯奇姆的疯狂研究成果……可以在这某处找到。"
  npc_override_1@os_a_OsOccupation_team_alpha_s_last_commun_f4a253: "## 阿尔法小队最后的通讯是在奥斯卡·塞拉 52 177 ##"
  npc_override_1@os_a_OsOccupation_there_no_trace_alpha_onl_1c40a9: "没有阿尔法的痕迹。只有无线电。"
  npc_override_1@os_a_OsOccupation_ugh_i_don_t_much_09dba0: "呃……我没多少时间了……仔细听，埃斯特。"
  npc_override_1@os_a_OsOccupation_uncle_miguel_how_did_hap_7dd4c9: "米格尔叔叔！？怎么会变成这样！"
  npc_override_1@os_a_OsOccupation_uncle_uncle_2d2066: "叔叔！叔叔！！"
  npc_override_1@os_a_OsOccupation_uncle_wake_up_let_s_bd06bb: "叔叔！醒醒！！我们出去吧。如果我们出去，就能救你！"
  npc_override_1@os_a_OsOccupation_uncle_what_what_happened_214312: "叔叔！这是什么！你怎么了？"
  npc_override_1@os_a_OsOccupation_well_even_if_you_ask_387001: "嗯，即使你问我……这也是我第一次和变异体说话。"
  npc_override_1@os_a_OsOccupation_you_ve_dealt_cp_mutant_137274: "你独自对付了一个CP7变异体……战斗顺利吗？"
  npc_override_1@os_a_OsOccupation_menu_est_c1d0db: "埃斯特：我们这边交战已结束。"
  npc_override_1@os_a_OsOccupation_menu_est_c82d04: "埃斯特：如果你看到能沟通的变异体，立即捕获它。除此之外……你可以全部制服。"
