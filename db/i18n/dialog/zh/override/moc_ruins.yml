Body:
  npc_override_moc_ruins_26-40_menu_client_46655d: "Client Location : {0}"
  npc_override_moc_ruins_26-40_menu_client_feee0d: "Client : {0}"
  npc_override_moc_ruins_26-40_menu_requested_78544f: "Requested Mission : {0}"
  npc_override_moc_ruins_26-40_msg_14fa70: "[{0} !!]"
  npc_override_moc_ruins_26-40_you_accepted_mission_5ac025: "You have accepted the {0} mission."
  npc_override_moc_ruins_26-40_you_declined_mission_30fc43: "You have declined the {0} mission."
  npc_override_moc_ruins_26-40_your_level_doesn_t_meet_4b7039: "Your level doesn't meet the requirements. You can't take the '{0}' mission."
  npc_override_moc_ruins_guides_morroc_and_fc118a: "and {0}"
  npc_override_moc_ruins_guides_morroc_currently_7f1530: "Currently the {0}"
  npc_override_moc_ruins_guides_morroc_let_me_mark_entrance_34c003: "Let me mark the entrance to the {0}"
  npc_override_moc_ruins_guides_morroc_located_e33a33: "The {0} is located"
  npc_override_moc_ruins_guides_morroc_the_0a9eb8: "The {0}"
  npc_override_moc_ruins_guides_morroc_the_is_c9d21b: "The {0} is"
  npc_override_moc_ruins_morocc_aah_s_s_still_ringing_c3bea7: "啊！！！它……它还在我耳边回响！！！啊啊啊啊！！！！"
  npc_override_moc_ruins_morocc_actuality_4f3ed7: "但实际上，"
  npc_override_moc_ruins_morocc_adventurers_union_pronte_233f8c: "冒险者公会和普隆德拉王国正全力投入重建工作，同时也在设法遏制灾难的源头。"
  npc_override_moc_ruins_morocc_after_terrible_incident_f12bdd: "那场可怕的灾难摧毁了整个梦罗克之后，卢恩·米德加兹王国召集了我们这些志愿者来协助重建。"
  npc_override_moc_ruins_morocc_against_kind_damage_955af5: "绝对无可挑剔！"
  npc_override_moc_ruins_morocc_against_those_adventurer_7b6558: "面对那些冒险者，"
  npc_override_moc_ruins_morocc_ah_i_kinda_wanna_see_fce42c: "啊……我有点想亲眼看看那个撒旦，但是！我真的不行。我连做梦都不该梦到亲眼见到那个撒旦。"
  npc_override_moc_ruins_morocc_all_happened_so_fast_oas_d7c429: "一切都发生得太快。城堡的绿洲完全干涸，城镇被毁。还有……还有那个声音……我听到了一个声音。"
  npc_override_moc_ruins_morocc_all_we_know_tons_monster_30af2c: "我们只知道那些奇怪的建筑里栖息着大量怪物。你最好离那些危险的地方远一点。"
  npc_override_moc_ruins_morocc_allows_assassins_fa7d8e: "让刺客"
  npc_override_moc_ruins_morocc_also_sonic_blow_skill_fe74bd: "而且，^663399音速投掷^000000技能"
  npc_override_moc_ruins_morocc_also_without_dagger_9c1791: "另外，如果右手"
  npc_override_moc_ruins_morocc_andre_colored_ivory_yell_1a46cf: "安德烈是象牙色的，黄绿色的是皮埃尔，红色的是德尼罗。"
  npc_override_moc_ruins_morocc_andre_weakest_piere_comp_b250cc: "安德烈是最弱的，皮埃尔中等，德尼罗是最强的蚂蚁。记住这点，以便选择适合你等级的蚂蚁作战。"
  npc_override_moc_ruins_morocc_angeling_high_level_mons_7a8418: "大天使波利是高等级的圣属性怪物，因此对大多数魔法免疫，只有无属性或暗属性攻击的魔法才能造成伤害。"
  npc_override_moc_ruins_morocc_angelings_rarely_seen_fo_9b29ec: "大天使波利很少见，但能在普隆德拉南部某个原野上的波利群中找到。"
  npc_override_moc_ruins_morocc_ant_hell_swarming_ant_mo_59be5e: "蚂蚁地狱里到处都是蚂蚁怪物。你会发现它们都被冠以不同的名字……"
  npc_override_moc_ruins_morocc_anyone_buy_basic_set_kat_db8162: "任何人都可以"
  npc_override_moc_ruins_morocc_anything_dceb18: "任何"
  npc_override_moc_ruins_morocc_anyway_you_know_where_we_6ba5c4: "话说回来，你知道我们现在在哪儿吗？我不过是在酒馆里小酌了一杯，可一出来，整个城镇就不见了……要么，是已经过了五百年？？？！"
  npc_override_moc_ruins_morocc_anyways_don_t_you_think_3e679c: "话说回来，你不觉得撒旦梦罗克太残忍了吗？"
  npc_override_moc_ruins_morocc_anyways_isn_t_crib_i_7a4064: "算了，那不是抄袭吗？我好像以前在哪听过……"
  npc_override_moc_ruins_morocc_approach_their_enemies_s_04c88f: "会悄悄地接近敌人，"
  npc_override_moc_ruins_morocc_as_bad_as_seems_we_6bc700: "情况已经够糟了，我们甚至无法请求更多的支援。"
  npc_override_moc_ruins_morocc_as_important_as_seems_ev_0a10e0: "虽然事情至关重要，大家也都小心翼翼，可总有些人根本意识不到事态的严重，你说是不是？"
  npc_override_moc_ruins_morocc_as_well_as_51c0a1: "同时"
  npc_override_moc_ruins_morocc_aside_daggers_8d2860: "你还可以装备其他武器，"
  npc_override_moc_ruins_morocc_assassin_clan_954e6a: "刺客一族"
  npc_override_moc_ruins_morocc_assassin_one_advanced_jo_d04aed: "刺客是盗贼的高级职业之一，擅长用无属性和毒属性攻击战斗。"
  npc_override_moc_ruins_morocc_assassins_fde0de: "刺客……"
  npc_override_moc_ruins_morocc_assassins_trained_f8a76a: "……刺客受过训练，"
  npc_override_moc_ruins_morocc_assassins_which_very_pro_05f1e3: "成为非常专业的刺客，"
  npc_override_moc_ruins_morocc_before_performing_their_464283: "在执行任务之前。"
  npc_override_moc_ruins_morocc_believe_me_19ece5: "相信我，"
  npc_override_moc_ruins_morocc_blood_blood_what_takes_p_cb8cf0: "鲜血……鲜血是偿还灵魂的代价……还有那阴森的笑声……"
  npc_override_moc_ruins_morocc_cave_sure_dangerous_hell_d9eeba: "那个洞穴确实是个危险的地狱，又粘又脏……有2层地下区域。"
  npc_override_moc_ruins_morocc_compared_dual_daggers_fffb38: "相比双匕首，"
  npc_override_moc_ruins_morocc_course_1a6601: "当然，"
  npc_override_moc_ruins_morocc_course_only_assassins_us_efab39: "当然，只有刺客才能使用它们。"
  npc_override_moc_ruins_morocc_cracking_time_space_3ee634: "撕裂时间与空间，"
  npc_override_moc_ruins_morocc_crying_727ebe: "——哭泣——"
  npc_override_moc_ruins_morocc_d_better_disturb_him_any_8e45d9: "——最好别再打扰他了 ——"
  npc_override_moc_ruins_morocc_damage_only_caused_ghost_81352a: "只有通过魔法或带有特定属性的武器才能对幽灵波利造成伤害。"
  npc_override_moc_ruins_morocc_damn_you_515879: "该死的！"
  npc_override_moc_ruins_morocc_day_i_saw_bloody_moon_a74e75: "……那一天……我看见天空挂着血色的月亮。四周静得可怕，让人毛骨悚然。"
  npc_override_moc_ruins_morocc_desert_morocc_highest_av_f8b702: "梦罗克沙漠的平均气温是米德加兹最高的。在沙漠中央坐在沙子上之前，你最好三思，不然屁股会被烤焦的。"
  npc_override_moc_ruins_morocc_different_kinds_daggers_04363d: "同时装备"
  npc_override_moc_ruins_morocc_don_t_drink_too_much_171640: "but don't drink too much."
  npc_override_moc_ruins_morocc_don_t_even_think_about_5c9e8c: "Don't even think about drinking if you don't have 1,000 zeny."
  npc_override_moc_ruins_morocc_double_attack_skill_26024d: "^663399二刀连击^000000技能。"
  npc_override_moc_ruins_morocc_dragon_fly_special_one_s_b6a861: "龙蝇是个特殊的家伙，就在城镇的东北方。"
  npc_override_moc_ruins_morocc_dual_daggers_21de29: "双匕首"
  npc_override_moc_ruins_morocc_due_low_annual_rainfall_14ff42: "由于年降雨量少、湿度低、蒸发率高，沙漠里几乎找不到什么植被。"
  npc_override_moc_ruins_morocc_enables_you_equip_efc982: "可以让你"
  npc_override_moc_ruins_morocc_even_after_hundreds_thou_0fc2c0: "可即使尝试了成百上千次，"
  npc_override_moc_ruins_morocc_even_whistle_dry_wind_ai_336631: "连一丝干风都没有，空气沉闷得让人几乎喘不过气。"
  npc_override_moc_ruins_morocc_failed_reborn_same_place_b8fc51: "在同一处复活失败，"
  npc_override_moc_ruins_morocc_fields_rune_midgarts_inf_40e30f: "卢恩·米德加兹的原野到处都是凶猛危险的怪物……但你得承认，有些真的很可爱！"
  npc_override_moc_ruins_morocc_fight_set_katars_e0c89a: "或者使用拳刃战斗！"
  npc_override_moc_ruins_morocc_fly_lord_445eee: "蝇王？！"
  npc_override_moc_ruins_morocc_forbidden_harm_innocent_bd8f83: "被禁止伤害无辜之人，"
  npc_override_moc_ruins_morocc_fruits_major_ingredients_fe665d: "Fruits are major ingredients,"
  npc_override_moc_ruins_morocc_ghostring_evil_ghost_por_365016: "幽灵波利是邪恶的幽灵波利。它很少见，但能在普隆德拉南部某个原野上的波利群中找到。"
  npc_override_moc_ruins_morocc_ghostring_high_leveled_m_49857c: "幽灵波利是高等级的念属性怪物，因此能抵御所有物理攻击。"
  npc_override_moc_ruins_morocc_good_all_rune_midgarts_16a893: "为整个卢恩·米德加兹谋福利。"
  npc_override_moc_ruins_morocc_gotta_try_harder_harder_7d8156: "必须更加拼命尝试，永远不要放弃，"
  npc_override_moc_ruins_morocc_great_satan_morocc_t_rev_afe8f2: "伟大的梦罗克撒旦还是无法复活～"
  npc_override_moc_ruins_morocc_haw_whew_ugh_a5c6d0: "哈……呼……呃……"
  npc_override_moc_ruins_morocc_heh_heh_let_me_tell_069564: "嘿嘿～让我给你讲个故事。你知道我刚从那边的酒馆出来吧？"
  npc_override_moc_ruins_morocc_hehe_don_t_you_think_5bad05: "嘿嘿～你不觉得我对波利了解很多吗？我超级爱它们的"
  npc_override_moc_ruins_morocc_hehe_don_t_you_think_b69d55: "嘿嘿～你不觉得我对波利了解很多吗？我超级爱它们的～"
  npc_override_moc_ruins_morocc_hehe_poring_hee_cf5724: "嘿嘿……波利……嘻……"
  npc_override_moc_ruins_morocc_hehe_poring_teehee_e80d51: "嘿嘿……波利……嘻……"
  npc_override_moc_ruins_morocc_here_there_d3c093: "这里那里！"
  npc_override_moc_ruins_morocc_here_you_go_688fd3: "Here you go."
  npc_override_moc_ruins_morocc_hey_you_did_you_cross_bf31a8: "嘿，你。你穿越沙漠了吗？"
  npc_override_moc_ruins_morocc_hey_you_stop_there_5fb013: "喂，你！站住。"
  npc_override_moc_ruins_morocc_heyyy_you_re_being_too_cb8361: "哎哟，你也太狠了吧，小姐。你的拳头跟你一样娇弱，可打人还真疼。"
  npc_override_moc_ruins_morocc_hic_516766: "嗝！"
  npc_override_moc_ruins_morocc_hmm_9c4d28: "Hmm……"
  npc_override_moc_ruins_morocc_hmmm_82c2a4: "嗯……"
  npc_override_moc_ruins_morocc_hmmm_you_shouldn_t_here_fe6879: "嗯……你不该来这儿……"
  npc_override_moc_ruins_morocc_hopefully_0318c5: "希望"
  npc_override_moc_ruins_morocc_how_come_s_never_possibl_a6aae4: "为什么总是在它还在的时候，从不知道珍惜呢？"
  npc_override_moc_ruins_morocc_how_little_picky_wears_t_3adaf8: "还有小波利有时顶着那个小小的蛋壳……"
  npc_override_moc_ruins_morocc_however_now_satan_revive_a1aeaf: "不过现在撒旦已经复活，没人能确定梦罗克的生命循环会发生什么变化。"
  npc_override_moc_ruins_morocc_however_we_no_longer_so_944e7c: "然而，我们现在已经不再这样做了，"
  npc_override_moc_ruins_morocc_i_hear_assassins_practic_d325ca: "我听说刺客会悄悄地、隐秘地练习杀人……"
  npc_override_moc_ruins_morocc_i_hear_coolest_assassin_486213: "我还听说其中最酷的刺客是十字刺客！不过那更是个大谜团～除非你是个厉害的盗贼，否则根本见不到他们！"
  npc_override_moc_ruins_morocc_i_heard_satan_morocc_rev_88bfc2: "我听说撒旦梦罗克复活了。它撕裂了时空跑了出来，什么什么……嗝～"
  npc_override_moc_ruins_morocc_i_hunch_hot_dry_climate_cd5ff6: "我有一种预感，梦罗克这种又热又干的气候，是因为那个撒旦被深埋在地下封印了太久。"
  npc_override_moc_ruins_morocc_i_i_really_saw_fly_8ff9ae: "我……我真的看到了……蝇王在一眨眼间就被打得粉碎……"
  npc_override_moc_ruins_morocc_i_know_s_time_worry_8de80d: "我知道现在不是操心宝石的时候……可这……曾是我的一切……"
  npc_override_moc_ruins_morocc_i_left_home_three_years_27b0e1: "我三年前离家出走，从那以后就一直在寻找他们的秘密基地……"
  npc_override_moc_ruins_morocc_i_ll_tell_you_what_3150e5: "我就告诉你什么是刺客！"
  npc_override_moc_ruins_morocc_i_m_really_wondered_how_bb190d: "我真想知道那场可怕的毁灭之后入口变成什么样了，可我出不去……如果你打听到什么，请告诉我一声。"
  npc_override_moc_ruins_morocc_i_m_so_scared_i_a0646b: "我好害怕……我只想看看那些可爱的波利放松一下心情……"
  npc_override_moc_ruins_morocc_i_m_so_scared_where_696f8d: "我好害怕！爸爸妈妈在哪儿……！呜呜……我们的家在哪儿……"
  npc_override_moc_ruins_morocc_i_m_sure_how_cow_066a34: "我搞不懂牛奶怎么会从鸟蛋里掉出来……"
  npc_override_moc_ruins_morocc_i_m_sure_largest_pyramid_0a805c: "我确信最大的那座金字塔里安葬着古代国王——奥西里斯的陵墓！我愿意用性命担保！"
  npc_override_moc_ruins_morocc_i_may_man_science_how_b7f942: "我虽然不是科学家，可这怎么可能呢？"
  npc_override_moc_ruins_morocc_i_mean_did_milk_come_cb62a0: "我是说，牛奶是跟蛋一起预先装好的，还是怎么进去的？……"
  npc_override_moc_ruins_morocc_i_remember_i_said_bandit_4ac9b4: "我记得我说过，沙漠里的强盗就是沙漠之狼……那些家伙总是成群结队地游荡，一旦其中一只受到攻击，它们就会变得极其凶残暴戾。"
  npc_override_moc_ruins_morocc_i_t_anymore_ec312c: "可我再也做不到了。"
  npc_override_moc_ruins_morocc_i_t_believe_what_just_c1af04: "我真不敢相信发生了什么……我们的小镇曾经有的是那些可爱的小怪物，而不是这种凶残可怕的邪魔！唉……"
  npc_override_moc_ruins_morocc_i_think_there_d_nothing_9d3caa: "不过我想，像你这样勇敢、穿越了荒野沙漠的人去找找它，也没什么损失吧，你说呢？嘻嘻～找到的时候别忘了请我喝一杯！"
  npc_override_moc_ruins_morocc_i_ve_devoted_my_life_667be8: "我这一生都致力于研究梦罗克附近神秘的金字塔。虽然至今还没有确凿的发现，但是……"
  npc_override_moc_ruins_morocc_i_wish_i_knew_how_5d7ac8: "我真想知道损失到底有多严重，可我们根本估算不出来。就像逆潮铲沙一样……"
  npc_override_moc_ruins_morocc_i_work_trading_business_cc1918: "我做的是贸易生意，所以总是要穿越又热又干的梦罗克沙漠出差。"
  npc_override_moc_ruins_morocc_if_you_ever_55ccb6: "如果你哪天，"
  npc_override_moc_ruins_morocc_if_you_ever_could_cross_6f63cd: "要是你能不受撒旦干扰穿越沙漠就好了……"
  npc_override_moc_ruins_morocc_if_you_find_them_clan_5d613d: "如果你找到他们，而且一族之主认为你够格，你就能成为刺客！呃，至少，我觉得是吧……"
  npc_override_moc_ruins_morocc_if_you_re_assassin_606a0e: "如果你是刺客，"
  npc_override_moc_ruins_morocc_importance_e47e9d: "谋略和"
  npc_override_moc_ruins_morocc_infiltrators_murderers_979d90: "潜入者和杀人凶手，"
  npc_override_moc_ruins_morocc_inflicts_continuous_hits_32f1a4: "能造成8连击"
  npc_override_moc_ruins_morocc_just_head_east_till_you_8727ef: "一直往东走，直到看到通往斐扬森林的桥。"
  npc_override_moc_ruins_morocc_katars_faster_attack_spe_70b733: "拳刃的攻击速度更快。"
  npc_override_moc_ruins_morocc_lacking_attack_speed_437f31: "在攻击速度上有所不足。"
  npc_override_moc_ruins_morocc_later_i_learned_wasn_t_e850fa: "后来我才知道，我找到的根本不是普通的仙人掌，而是叫做'木卡'的怪物。"
  npc_override_moc_ruins_morocc_least_3384b8: "至少，"
  npc_override_moc_ruins_morocc_let_s_stop_crying_eliese_e82cdb: "………………别哭了，艾莉丝……"
  npc_override_moc_ruins_morocc_level_katar_mastery_b3cda1: "^663399拳刃修练 Lv4^000000时学习音速投掷技能。"
  npc_override_moc_ruins_morocc_like_one_time_while_i_256459: "就说有一次吧，我在沙漠正中央渴得不行，就抓了一棵仙人掌……可还没等我切开它，它就扇了我一巴掌！然后还用满身的刺射我的屁股……"
  npc_override_moc_ruins_morocc_look_hardest_stone_world_1de543: "可你看看！世界上最硬的石头竟然裂成了两半！"
  npc_override_moc_ruins_morocc_look_our_targets_eye_78e433: "直视目标的眼睛。"
  npc_override_moc_ruins_morocc_many_factors_determine_i_a9dd7c: "决定它价值的因素有很多，但最重要的是它的个头。"
