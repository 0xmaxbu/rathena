  npc_override_sp_cor_quests_17_1_wait_minute_1f5d60: "等一下。"
  npc_override_sp_cor_quests_17_1_wait_nobody_back_there_n_1873ba: "等等，现在后面没有人，你在等谁吗？"
  npc_override_sp_cor_quests_17_1_wait_something_s_right_cced1e: "等等，有什么不对劲？"
  npc_override_sp_cor_quests_17_1_wait_what_about_your_gua_595095: "等等，但你的守卫呢？"
  npc_override_sp_cor_quests_17_1_wait_you_trying_take_oth_0089a6: "等等，你是想带其他冒险者一起去吗？"
  npc_override_sp_cor_quests_17_1_wasn_t_he_guy_who_63a682: "他不是也来自里希塔乐镇的家伙吗？"
  npc_override_sp_cor_quests_17_1_waste_time_no_matter_how_75309f: "无论怎么看都是浪费时间。即使你告诉我一百次，让我去也不经济。但我还是接受你的提议。"
  npc_override_sp_cor_quests_17_1_water_waterway_looks_cle_ca2885: "这条水道的水看起来很干净，但我们想送去分析。"
  npc_override_sp_cor_quests_17_1_way_43fd4c: "这边走。"
  npc_override_sp_cor_quests_17_1_way_did_vip_feel_uncomfo_2b60e9: "顺便问一下，贵宾对非公平使用一等舱感到不舒服吗？开始不舒服，但剩下的旅程会很顺利。"
  npc_override_sp_cor_quests_17_1_way_i_ll_let_you_46c5e8: "这边走，我让你进矿井。"
  npc_override_sp_cor_quests_17_1_we_act_quickly_annihilat_08c253: "我们必须迅速行动歼灭他们。我们没有太多时间。"
  npc_override_sp_cor_quests_17_1_we_all_believe_you_8661fb: "我们都相信你！"
  npc_override_sp_cor_quests_17_1_we_all_go_together_we_aa2550: "我们可以一起去。我们来这里就是为了这个。"
  npc_override_sp_cor_quests_17_1_we_already_expected_as_m_e7b4a3: "当我们开始研究时，我们已经预料到了。"
  npc_override_sp_cor_quests_17_1_we_came_arrest_people_re_ac365e: "我们来这里是为了与政府和企业合作逮捕负责人。"
  npc_override_sp_cor_quests_17_1_we_collect_garbage_each_277f89: "我们从每个房间收集垃圾然后处理。嗯，通常我们是为整洁的人做的。他们话不多。"
  npc_override_sp_cor_quests_17_1_we_completed_pre_trainin_6fc4aa: "这样，我们就完成了员工的预培训。"
  npc_override_sp_cor_quests_17_1_we_control_how_where_emp_83e7da: "我们不控制员工如何以及在何处度过私人时间。"
  npc_override_sp_cor_quests_17_1_we_d_rather_trust_our_0551b4: "我们宁愿相信我们的结果，而不是黛西的。"
  npc_override_sp_cor_quests_17_1_we_deal_those_guys_somet_96247a: "我们必须对付那些家伙，有时很难。"
  npc_override_sp_cor_quests_17_1_we_don_t_anythin_give_077d02: "我们没有什么可以给你的，但也许你可以拿走我们在这里找到的这些组件。我看到佣兵们在收集它们。你不也需要吗？"
  npc_override_sp_cor_quests_17_1_we_don_t_even_know_319e7a: "但是，我们甚至不知道他是死是活。"
  npc_override_sp_cor_quests_17_1_we_don_t_keep_track_c8ac25: "我们不追踪总部内的所有行程和行动。我听说很多，不过。"
  npc_override_sp_cor_quests_17_1_we_don_t_know_how_f70126: "我们还不知道这些东西有多危险。冒险者，请不要太靠近。"
  npc_override_sp_cor_quests_17_1_we_don_t_know_what_64c048: "我们不知道这里潜伏着什么样的危险。请不要再靠近。"
  npc_override_sp_cor_quests_17_1_we_don_t_know_when_802c95: "我们不知道何时会有敌人袭击。等你能够保护自己时再回来。"
  npc_override_sp_cor_quests_17_1_we_figured_out_path_loca_0e41d4: "我们找到了一条进入的路径或位置，所以我希望你进一步调查。"
  npc_override_sp_cor_quests_17_1_we_focus_one_person_don_e1557e: "我们专注于一个人，你不知道它是怎么运作的吗？"
  npc_override_sp_cor_quests_17_1_we_found_entry_9e700c: "我们找到了一个入口。"
  npc_override_sp_cor_quests_17_1_we_found_entry_abandoned_d691a9: "我们找到了通往^4D4DFF鲁达斯废弃废物^000000的入口。"
  npc_override_sp_cor_quests_17_1_we_going_okay_555415: "我们……会没事吧……？"
  npc_override_sp_cor_quests_17_1_we_had_fired_them_becaus_780a8b: "我们因为他们的不道德实验而解雇了他们，我猜是他们。"
  npc_override_sp_cor_quests_17_1_we_ll_follow_pat_s_0277c8: "我们将按照帕特的工作日程。我们可以跟随他的踪迹，更多地了解他失踪的原因。"
  npc_override_sp_cor_quests_17_1_we_ll_go_there_soon_621430: "我们很快会进去。士兵们，你们准备好了吗？"
  npc_override_sp_cor_quests_17_1_we_ll_keep_eye_suggest_561168: "我们会密切关注，并建议修改我们在这里能得到的损坏武器供我们自己使用。"
  npc_override_sp_cor_quests_17_1_we_ll_meet_your_son_5c7e10: "我们会和你的儿子见面，继续调查，然后联系你。你们都可以相信我并等待。你们相信我，对吧？"
  npc_override_sp_cor_quests_17_1_we_ll_take_turns_6c8d75: "我们得轮流来。"
  npc_override_sp_cor_quests_17_1_we_long_love_hate_relati_8057c3: "我们与政府和企业有着长期的爱恨关系。即使幻景与两者都无关，我们也必须从它手中夺回巴蒙德的遗产。"
  npc_override_sp_cor_quests_17_1_we_lost_elyumina_he_may_b6c4a1: "我们失去了艾露米娜。他可能不是个好战士，但他真的很擅长逃跑。该死！"
  npc_override_sp_cor_quests_17_1_we_lot_people_us_though_893621: "我们有很多人的……*笑*"
  npc_override_sp_cor_quests_17_1_we_must_capture_him_with_770ede: "这次我们必须抓住他。来<NAVI>[这边]<INFO>sp_cor,180,169,0,101,0</INFO></NAVI>。"
  npc_override_sp_cor_quests_17_1_we_need_more_information_92d325: "我们需要更多信息，还必须围捕研究员。我们为什么不一起去？队长？冒险者？"
  npc_override_sp_cor_quests_17_1_we_need_support_adventur_85c291: "我们需要冒险者的支援！"
  npc_override_sp_cor_quests_17_1_we_only_going_investigat_9d75a7: "我们只调查他吗？其他人呢？"
  npc_override_sp_cor_quests_17_1_we_open_main_gate_a4d2c3: "我们必须打开主门。"
  npc_override_sp_cor_quests_17_1_we_planning_carry_out_al_808168: "我们计划对周边地区进行全面战斗以防止反击。当然平民不会包括在内……"
  npc_override_sp_cor_quests_17_1_we_re_all_going_die_3ea73b: "我们都要死在这里。"
  npc_override_sp_cor_quests_17_1_we_re_finally_here_reken_019b19: "我们终于到雷肯伯了。"
  npc_override_sp_cor_quests_17_1_we_re_going_out_together_b895f6: "我们一起出去。"
  npc_override_sp_cor_quests_17_1_we_re_here_grow_vegetabl_2778dc: "我们来这里种蔬菜。这个自给自足的农场是我们的骄傲和喜悦。"
  npc_override_sp_cor_quests_17_1_we_re_now_officially_tra_21e18d: "我们现在正式成为施瓦茨瓦尔德共和国的旅行者。反正到处躲躲藏藏也很难四处看看。"
  npc_override_sp_cor_quests_17_1_we_re_offering_you_plea_61f831: "我们向你提供认罪协议。我们之所以提供这个，是因为我们真的相信你在做一件伟大的事情。"
  npc_override_sp_cor_quests_17_1_we_re_ready_da8f7c: "我们准备好了！"
  npc_override_sp_cor_quests_17_1_we_re_still_searching_so_db326c: "我们还在搜索，所以不要走太深。我们不知道里面可能潜伏着什么。"
  npc_override_sp_cor_quests_17_1_we_really_don_t_know_a9f288: "我们真的不知道该怎么办。"
  npc_override_sp_cor_quests_17_1_we_really_going_back_2817f1: "我们真的又要回去吗？"
  npc_override_sp_cor_quests_17_1_we_really_so_loud_1069fd: "我们真的那么大声吗？"
  npc_override_sp_cor_quests_17_1_we_recently_expanded_fie_95af93: "我们最近扩大了行动范围。"
  npc_override_sp_cor_quests_17_1_we_sent_recon_team_inves_17b877: "我们派了一支侦察队去调查你提到的区域。"
  npc_override_sp_cor_quests_17_1_we_should_go_navi_here_3393d1: "我们现在应该去<NAVI>[这里]<INFO>rgsr_in,12,46,0,000,0</INFO></NAVI>~"
  npc_override_sp_cor_quests_17_1_we_should_hurry_up_4bd613: "我们应该快点。"
  npc_override_sp_cor_quests_17_1_we_t_just_leave_them_ce2d18: "我们不能就这样离开他们。"
  npc_override_sp_cor_quests_17_1_we_t_thank_you_enough_5465f7: "我们感激不尽。"
  npc_override_sp_cor_quests_17_1_we_took_control_transpor_1d9124: "我们控制了运输路线，但他们可能会在几小时内反击。那会让行动变得无用。"
  npc_override_sp_cor_quests_17_1_we_tracking_attacker_som_b746a8: "我们在追踪袭击者，我们有些人受伤了，现在我们^0000FF需要支援。^000000"
  npc_override_sp_cor_quests_17_1_we_ve_been_cooperating_v_7bd038: "我们一直在和这边的副总裁合作。"
  npc_override_sp_cor_quests_17_1_we_ve_finally_enter_reke_52fb72: "我们终于进入了雷肯伯总部。我想知道帕特第一次穿过这扇门时是否感到宽慰。他接下来去了哪里？"
  npc_override_sp_cor_quests_17_1_we_ve_taken_control_rout_b82cc7: "我们已经控制了路线，他们可能会在几小时内反击。"
  npc_override_sp_cor_quests_17_1_we_won_t_able_search_833142: "除非我们先抓住他，否则我们无法搜索或恢复这个区域。"
  npc_override_sp_cor_quests_17_1_welcome_sit_your_conveni_cfef6a: "欢迎！请随意坐！"
  npc_override_sp_cor_quests_17_1_well_aaah_i_heard_these_a5e6f7: "嗯？啊啊！我听到了。这些奇怪的尖叫声？所以其他成员进去了。"
  npc_override_sp_cor_quests_17_1_well_accurate_incinerato_ed572c: "嗯，准确地说，这不是焚化炉，它只是一个临时装载站，在焚烧前收集垃圾。实际的焚化炉在更远的地方。"
  npc_override_sp_cor_quests_17_1_well_doesn_t_matter_you_94a3d5: "嗯，那不重要。你关心你的研究，不是吗？"
  npc_override_sp_cor_quests_17_1_well_fact_some_facility_249ee6: "嗯……事实是，一些设施维护员工在实验室外工作。"
  npc_override_sp_cor_quests_17_1_well_forget_you_re_prob_8f43e4: "嗯，算了。你可能自己也很忙。但我怎么知道？我只是个农场工人。"
  npc_override_sp_cor_quests_17_1_well_holzman_went_sincla_6cdf26: "嗯，霍尔兹曼去了辛克莱实验室。"
  npc_override_sp_cor_quests_17_1_well_i_don_t_information_d8ea9e: "嗯……我^0000FF没有你要的信息。^000000我是最后一个来这里的。"
  npc_override_sp_cor_quests_17_1_well_i_know_both_names_45f231: "嗯，两个名字我都知道，但他们不吸引我。他们俩都为愚蠢的事情冒着生命危险。"
  npc_override_sp_cor_quests_17_1_well_i_need_you_check_1d42dd: "但是，嗯，我需要你检查这个并配合调查。你知道当我收到总部扔来的文件时我会怎么做。"
  npc_override_sp_cor_quests_17_1_well_name_long_let_s_a5e7da: "嗯……那个名字太长了，让我们叫他^0000CD帕特^000000吧。"
  npc_override_sp_cor_quests_17_1_well_now_you_should_just_b0f309: "嗯，目前，你应该直接进去。"
  npc_override_sp_cor_quests_17_1_well_problem_mina_4a54b4: "嗯，问题是，米娜——"
  npc_override_sp_cor_quests_17_1_well_renewable_energy_b525c9: "嗯……可再生能源？"
  npc_override_sp_cor_quests_17_1_well_says_you_re_vacatio_f9b542: "嗯，上面说你在度假。"
  npc_override_sp_cor_quests_17_1_well_short_feed_study_an_ed752c: "嗯……简而言之，是为了喂养研究动物，我在种植可以终身维持动物的超级蔬菜。"
  npc_override_sp_cor_quests_17_1_well_then_i_ll_bring_80b53e: "那我就带阿斯一起去……"
  npc_override_sp_cor_quests_17_1_well_then_i_ll_tell_62af1a: "那我会告诉奥斯卡开门。我们必须这么做！"
  npc_override_sp_cor_quests_17_1_well_there_s_reason_here_f37854: "嗯……这里有理由这样做。一旦收到实验室的请求，我们就批准。这是最高优先级。"
  npc_override_sp_cor_quests_17_1_well_they_ll_only_really_c36408: "嗯，他们只会在实验室工作，所以他们几乎没有时间吃饭。"
  npc_override_sp_cor_quests_17_1_well_we_keep_looking_loc_132d19: "嗯。我们必须继续寻找这个新实验室的位置。当我们找到它时，我们必须从内部研究它。"
  npc_override_sp_cor_quests_17_1_well_we_re_flattered_76e977: "嗯，我们很荣幸，但……"
  npc_override_sp_cor_quests_17_1_well_we_re_flattered_we_5ef75a: "嗯，我们很荣幸，但……我们没那么特别……我们永远是精英。嘿！"
  npc_override_sp_cor_quests_17_1_well_what_about_us_we_bdc393: "但是，嗯……我们呢？我们在一段关系中……"
  npc_override_sp_cor_quests_17_1_well_what_adventurer_doi_df2380: "嗯？冒险者在这里做什么？"
  npc_override_sp_cor_quests_17_1_well_what_am_i_supposed_877d47: "嗯，我应该选什么？"
  npc_override_sp_cor_quests_17_1_well_you_involved_operat_e61084: "嗯？你参与这次行动了吗？"
  npc_override_sp_cor_quests_17_1_well_you_see_c68844: "嗯你看……"
  npc_override_sp_cor_quests_17_1_well_you_see_i_need_7cdaa1: "嗯你看……我需要更多人手来修理。总有东西坏了，所以我总是需要更多人手。但最近，"
  npc_override_sp_cor_quests_17_1_weren_t_those_guards_we_da2ae9: "那些不是我们一段时间前在战场上战斗过的守卫吗？"
  npc_override_sp_cor_quests_17_1_what_96ba6e: "什么？！"
  npc_override_sp_cor_quests_17_1_what_about_me_i_m_14033a: "那我呢，我太老了！"
  npc_override_sp_cor_quests_17_1_what_about_me_why_am_574b03: "那我呢？为什么我一个人在这里？你担心我吗？呵呵呵！"
  npc_override_sp_cor_quests_17_1_what_about_person_next_y_dd5c17: "那你旁边的人呢？"
  npc_override_sp_cor_quests_17_1_what_about_rest_workforc_c655b5: "但其余的劳动力呢？"
  npc_override_sp_cor_quests_17_1_what_am_i_going_here_dcebdc: "我要在这里做什么？"
  npc_override_sp_cor_quests_17_1_what_am_i_supposed_now_c26b07: "我现在应该做什么？"
  npc_override_sp_cor_quests_17_1_what_big_mansion_front_u_a1c1a0: "我们面前这座大宅邸是什么？我从未见过这样的东西。"
  npc_override_sp_cor_quests_17_1_what_building_really_227d6c: "但是，这座建筑到底是做什么的？"
  npc_override_sp_cor_quests_17_1_what_could_their_motives_08fae1: "他们的动机可能是什么？"
  npc_override_sp_cor_quests_17_1_what_d8baec: "那是什么？"
  npc_override_sp_cor_quests_17_1_what_daisy_saying_s_true_ae007e: "黛西说的……是真的，但奇怪地令人不快。"
  npc_override_sp_cor_quests_17_1_what_did_he_say_no_ec0d29: "他说了什么？不，对吧？"
  npc_override_sp_cor_quests_17_1_what_did_person_wearing_5bc010: "那个穿蓝色衣服的人在这里做了什么？"
  npc_override_sp_cor_quests_17_1_what_did_you_just_say_b5f3f8: "你刚才说什么？"
  npc_override_sp_cor_quests_17_1_what_documents_971d41: "什么文件？"
  npc_override_sp_cor_quests_17_1_what_gives_you_right_jus_daaa72: "你有什么权利来这里指控我们？我们在这里安静地生活了很多年。我们有罪吗？"
  npc_override_sp_cor_quests_17_1_what_happened_marcus_giv_57d818: "马库斯怎么了？把我的马库斯还给我！我已经两年没有马库斯的消息了！"
  npc_override_sp_cor_quests_17_1_what_happened_people_b00678: "人们怎么了？"
  npc_override_sp_cor_quests_17_1_what_happened_you_b715b3: "你发生了什么事？"
  npc_override_sp_cor_quests_17_1_what_hell_did_rekenber_t_241621: "雷肯伯对他们的员工做了什么？！"
  npc_override_sp_cor_quests_17_1_what_hell_you_doing_ente_c4a811: "你和企业的人在搞什么！怎么会发展到这一步！"
  npc_override_sp_cor_quests_17_1_what_i_hear_navi_voice_ead8dc: "什么……我能听到一个<NAVI>[声音]<INFO>sp_rudus,15,280,0,101,0</INFO></NAVI>，它从哪里来？"
  npc_override_sp_cor_quests_17_1_what_i_m_busy_right_c26cda: "什么？我现在很忙！"
  npc_override_sp_cor_quests_17_1_what_i_ve_seen_so_2f5dc9: "到目前为止我所看到的只是冰山一角。"
  npc_override_sp_cor_quests_17_1_what_i_wanted_fa366d: "这不是我想要的。"
  npc_override_sp_cor_quests_17_1_what_illegal_experiments_ad6764: "什么非法实验？"
  npc_override_sp_cor_quests_17_1_what_investigation_b518b5: "什么调查？"
  npc_override_sp_cor_quests_17_1_what_kind_error_check_078c04: "这是什么错误？检查一下。"
  npc_override_sp_cor_quests_17_1_what_mean_a57d36: "那是什么意思？"
  npc_override_sp_cor_quests_17_1_what_more_you_hiding_you_d0ab2e: "你后院还藏着什么？你不是来寻求我们帮助的吗？如果那边有什么隐藏的，"
  npc_override_sp_cor_quests_17_1_what_s_expression_d1448b: "那表情是什么意思……？"
  npc_override_sp_cor_quests_17_1_what_s_going_69e9e5: "里面发生了什么？"
  npc_override_sp_cor_quests_17_1_what_s_left_i_ll_9d36f1: "这就是剩下的。冒险者，我给你。"
