  npc_override_sp_cor_quests_17_1_you_need_help_if_you_11c873: "你需要帮助吗？如果你有<NAVI>[反叛者]<INFO>sp_cor,127,140,0,101,0</INFO></NAVI>的事，就往西南走。"
  npc_override_sp_cor_quests_17_1_you_notice_things_quickl_1e10b4: "你注意到事情很快。"
  npc_override_sp_cor_quests_17_1_you_only_looking_one_per_166f86: "还是你只在找特定的人？"
  npc_override_sp_cor_quests_17_1_you_others_previously_at_de7822: "你和其他人之前攻击了一个一直在进行非法实验的实验室。"
  npc_override_sp_cor_quests_17_1_you_part_operation_too_d14d46: "你也参与这次行动吗？"
  npc_override_sp_cor_quests_17_1_you_playing_me_a9f631: "你……在耍我吗？"
  npc_override_sp_cor_quests_17_1_you_professionals_too_e34a97: "你们也是专业人士！"
  npc_override_sp_cor_quests_17_1_you_re_allowed_enter_are_9e0542: "- 你不允许进入这个区域。 -"
  npc_override_sp_cor_quests_17_1_you_re_already_witness_o_2323b4: "你已经是我们这边的证人了。你不能成为证人。"
  npc_override_sp_cor_quests_17_1_you_re_back_e65dc8: "你回来了。"
  npc_override_sp_cor_quests_17_1_you_re_bit_late_well_edfb9e: "你有点晚了。嗯，我们也没有准时到。"
  npc_override_sp_cor_quests_17_1_you_re_finally_here_am_9a42fa: "你终于来了。我对你来说太快了吗？或者你认为也许因为贵宾的鞋子不适合长途跋涉？"
  npc_override_sp_cor_quests_17_1_you_re_guard_your_guard_e496ea: "你是守卫？你的守卫来自卢恩-米德加尔特边境，对吧？"
  npc_override_sp_cor_quests_17_1_you_re_just_going_look_e2792f: "你只是进去看看对吧？"
  npc_override_sp_cor_quests_17_1_you_re_looking_marcus_ma_faac7e: "你在找马库斯？马……库斯……霍尔兹曼。他来自里希塔乐镇东部……"
  npc_override_sp_cor_quests_17_1_you_re_more_loyal_than_a2bbc4: "你比我想象的更忠诚。也不蠢。"
  npc_override_sp_cor_quests_17_1_you_re_only_thinking_abo_7b55e2: "你只在想你要什么。"
  npc_override_sp_cor_quests_17_1_you_re_repeating_yoursel_b97d60: "你在重复自己了。我向你保证，你可以相信这些文件。"
  npc_override_sp_cor_quests_17_1_you_re_vip_you_re_1a4dcd: "你是贵宾。你真美，我很 impressed。啧。啧。啧。"
  npc_override_sp_cor_quests_17_1_you_re_welcome_25b02b: "不客气。"
  npc_override_sp_cor_quests_17_1_you_re_wrong_course_ther_23b723: "你没有错，当然，但这有单独的原因。"
  npc_override_sp_cor_quests_17_1_you_ready_b68a42: "你准备好了吗？"
  npc_override_sp_cor_quests_17_1_you_really_believe_so_c88874: "你真的相信吗？"
  npc_override_sp_cor_quests_17_1_you_really_know_what_i_bc702a: "你真的知道我在想什么吗？"
  npc_override_sp_cor_quests_17_1_you_really_look_traces_a_4c6a57: "你真的能看看被遗弃项目的痕迹吗……？"
  npc_override_sp_cor_quests_17_1_you_really_sure_about_pl_20e432: "你真的确定这个地方吗？"
  npc_override_sp_cor_quests_17_1_you_really_think_everyon_e3a75b: "你真的认为每个人都会那样改变主意吗？对他们的家人？他们的朋友？甚至爱人？这是更大的问题！"
  npc_override_sp_cor_quests_17_1_you_remember_lucky_i_bro_a07238: "你记得幸运吗？我把他带来了，去问他进展如何。"
  npc_override_sp_cor_quests_17_1_you_rest_assured_there_e_0421f2: "你可以放心，这里到处都有眼睛。我很小心。"
  npc_override_sp_cor_quests_17_1_you_saying_you_ve_witnes_95713b: "你是说你目睹了非法实验？"
  npc_override_sp_cor_quests_17_1_you_secretary_vice_presi_49e036: "你是副总裁的秘书吗？"
  npc_override_sp_cor_quests_17_1_you_see_big_column_81c8f2: "你看到这根大柱子了吗？"
  npc_override_sp_cor_quests_17_1_you_see_mine_entrance_bl_5a2c5d: "你看到被铁丝网封锁的^FF0000矿井入口^000000了吗？"
  npc_override_sp_cor_quests_17_1_you_seeing_show_yourselv_6bda88: "你看到了吗？现身吧！出来！"
  npc_override_sp_cor_quests_17_1_you_seen_rekenber_s_crit_5ca657: "你见过雷肯伯特别优惠的标准吗？"
  npc_override_sp_cor_quests_17_1_you_should_received_enou_fff657: "你应该已经收到足够的信息来开始调查了。"
  npc_override_sp_cor_quests_17_1_you_should_try_look_iden_c26f44: "你应该尝试在垃圾堆里找一个^0000FF身份识别手镯^000000。你知道它是什么吗？"
  npc_override_sp_cor_quests_17_1_you_should_try_look_iden_f9e170: "你应该尝试在垃圾堆里找一个^0000FF身份识别手镯^000000。你知道它是什么吗？"
  npc_override_sp_cor_quests_17_1_you_sick_any_illness_par_2e219d: "你病了……或者有什么特别的疾病吗"
  npc_override_sp_cor_quests_17_1_you_stand_next_us_glare_7b7485: "你可以站在我们旁边瞪眼，或者你可以帮助新手审问。"
  npc_override_sp_cor_quests_17_1_you_stay_loyal_them_exch_9b9603: "你忠于他们，以换取……死刑。在这种情况下，你将没有未来。"
  npc_override_sp_cor_quests_17_1_you_still_list_085eb6: "你还有那个名单吗？"
  npc_override_sp_cor_quests_17_1_you_still_take_me_daisy_9ddf1e: "你还把我当成雏菊吗？！"
  npc_override_sp_cor_quests_17_1_you_still_trust_research_b8352e: "你还信任研究员吗？你是这个意思吗？"
  npc_override_sp_cor_quests_17_1_you_sure_410bf2: "你确定吗？"
  npc_override_sp_cor_quests_17_1_you_t_enter_yet_53034d: "- 你还不能进去。 -"
  npc_override_sp_cor_quests_17_1_you_talking_about_me_44e454: "你在说我吗？"
  npc_override_sp_cor_quests_17_1_you_talking_me_ee7449: "……你在跟我说话吗？"
  npc_override_sp_cor_quests_17_1_you_talking_us_4a68a6: "你在跟我们说话吗？"
  npc_override_sp_cor_quests_17_1_you_think_monsters_get_o_34c714: "你认为怪物能从小缝隙里出来吗？"
  npc_override_sp_cor_quests_17_1_you_think_s_like_everyon_f53413: "你认为文件里的每个人都这样吗？不可能？帕特是个顾家的人，你真的认为他在假期因为个人问题不回家吗？你真的相信吗？"
  npc_override_sp_cor_quests_17_1_you_think_these_guys_who_8136ba: "你认为这些不听劝的人会去吗？你愿意陪我一起寻找真相吗？"
  npc_override_sp_cor_quests_17_1_you_think_where_they_i_aede08: "你认为这就是他们在的地方吗？我必须找到失踪的人。"
  npc_override_sp_cor_quests_17_1_you_thought_about_d7bb0b: "你想过吗？"
  npc_override_sp_cor_quests_17_1_you_threatening_us_now_77c11c: "你在威胁我们吗？"
  npc_override_sp_cor_quests_17_1_you_tired_already_there_9eea5f: "你已经累了吗？每天都有这样的人。当你的人受苦时，更多的人受苦，以至于你甚至无法认出痛苦。"
  npc_override_sp_cor_quests_17_1_you_took_care_them_all_18d567: "你把他们都照顾好了。对于一个冒险者来说，你很擅长照料花园。"
  npc_override_sp_cor_quests_17_1_you_trust_what_we_ve_2a899a: "你现在相信我们说的话吗？"
  npc_override_sp_cor_quests_17_1_you_use_any_words_you_e05bdc: "你可以用任何你想用的词，不必犹豫。"
  npc_override_sp_cor_quests_17_1_you_ve_arrived_good_time_7eeb2e: "你来得正是时候。"
  npc_override_sp_cor_quests_17_1_you_ve_done_some_serious_468504: "你对我们造成了严重伤害。"
  npc_override_sp_cor_quests_17_1_you_ve_got_weapons_armor_bd7ebd: "你有与你的职业匹配的武器和防具，你穿着暖和的衣服。通过！"
  npc_override_sp_cor_quests_17_1_you_ve_never_taken_good_257666: "你从未好好看过里希塔乐镇村庄。我来自大城市，我知道几个可以推荐开始的地方。"
  npc_override_sp_cor_quests_17_1_you_ve_picked_us_because_94b60d: "你选我们是因为你知道你可以随意践踏我们，不是吗？因为我们是容易的目标。"
  npc_override_sp_cor_quests_17_1_you_ve_picked_us_because_9af5d0: "你选我们是因为你知道你可以随意践踏我们，不是吗？"
  npc_override_sp_cor_quests_17_1_you_want_employee_transf_f07309: "你想要员工调动记录吗？它们保存在文件储存室里。"
  npc_override_sp_cor_quests_17_1_you_want_give_vice_presi_0f9559: "你想给副总裁一个怀疑的理由吗？我们不能允许那样？"
  npc_override_sp_cor_quests_17_1_you_want_go_along_invest_6c820c: "你想一起参与调查吗？"
  npc_override_sp_cor_quests_17_1_you_want_know_why_person_ff6998: "你想知道为什么一个领导实验的人被扔在垃圾桶里并被遗弃。"
  npc_override_sp_cor_quests_17_1_you_want_lock_down_cor_7437dd: "你想封锁科尔，耗尽他们，然后重新收集数据吗？"
  npc_override_sp_cor_quests_17_1_you_want_play_them_tuck_cfeda1: "你想和他们玩，然后把他们塞回床上，而其他人都在等你完成吗？"
  npc_override_sp_cor_quests_17_1_you_went_there_fcf5fc: "你去那里了吗？"
  npc_override_sp_cor_quests_17_1_you_who_you_i_ve_a5ab05: "你，你是谁……？我以前见过那张脸……你是……？"
  npc_override_sp_cor_quests_17_1_you_you_re_adventurer_ca_da858a: "你……你是和枪手一起来的冒险者。我有麻烦了吗？我对这些非法实验或研究所一无所知。"
  npc_override_sp_cor_quests_17_1_your_bag_full_please_che_811db7: " - 你的背包满了。请检查你的负重和携带物品数量，然后再来找我。 -"
  npc_override_sp_cor_quests_17_1_your_body_must_tired_2d159a: "你的身体一定累了。"
  npc_override_sp_cor_quests_17_1_your_eyes_so_shut_you_5d499f: "你的眼睛闭得这么紧，以至于看不到眼前的东西吗？"
  npc_override_sp_cor_quests_17_1_your_guard_know_some_rom_e8930a: "你的守卫懂一些浪漫吗？"
  npc_override_sp_cor_quests_17_1_your_hobby_eavesdrop_f50904: "偷听是你的爱好吗？"
  npc_override_sp_cor_quests_17_1_your_party_leader_hasn_t_c6ec68: "你的队长还没有创建地牢。跟他们确认一下。"
  npc_override_sp_cor_quests_17_1_your_party_leader_hasn_t_de2cc3: "你的队长还没有创建地牢。让我再检查一次。"
  npc_override_sp_cor_quests_17_1_your_president_always_lo_42931e: "你们的总统总是看不起我们。"
  npc_override_sp_cor_quests_17_1_your_results_any_differe_2eae74: "你的结果有什么不同吗？"
  npc_override_sp_cor_quests_17_1_yuno_really_nice_place_i_c134f0: "朱诺真是个好地方。我经常这么说。朱诺是贤者之城。嗯，我会用不同的方式说。"
