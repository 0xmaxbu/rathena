Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_sp_cor_ba_pw_menu_rookie_fb4ca9: "新手：哦？我还没开门呢！稍等一下，我们正在尽全力开门！"
  npc_override_sp_cor_enchan_illusion_17_1_along_few_others_around_25aa01: "以及周围的其他几个。"
  npc_override_sp_cor_enchan_illusion_17_1_alright_right_you_really_6a8d6f: "好吧，{0}，对吗？你真的想用它换50个Cor核心吗？"
  npc_override_sp_cor_enchan_illusion_17_1_argh_why_you_keep_asking_ea8e52: "啊！为什么你总是在我需要专注研究的时候来找我？我很忙，好吗？如果你无聊，去给我多带些损坏的武器来！"
  npc_override_sp_cor_enchan_illusion_17_1_attempting_upgrade_slot_3ee71c: "正在尝试升级装备的^990000第{0}个插槽^000000。"
  npc_override_sp_cor_enchan_illusion_17_1_capabilities_module_ench_da7e6d: "这个模块的能力可以在装备上附魔至{0} {1}。看来模块阈值已经达到极限了。"
  npc_override_sp_cor_enchan_illusion_17_1_cor_cores_50c11a: "5个Cor核心"
  npc_override_sp_cor_enchan_illusion_17_1_did_you_bring_damaged_we_b65745: "你带损坏的武器来了吗？你想见那个科学罪犯吗？他在里面。要我帮你叫他吗？"
  npc_override_sp_cor_enchan_illusion_17_1_didn_t_you_come_weapons_8882fb: "你不是来找武器或防具的吗？你的背包满了。我没时间等你翻背包。稍后再来吧。"
  npc_override_sp_cor_enchan_illusion_17_1_each_module_requires_mys_4f458e: "每个模块需要30个神秘组件和5个Cor核心。你还没有凑齐。请检查一下。"
  npc_override_sp_cor_enchan_illusion_17_1_equipment_needs_checked_62a2a9: "装备需要检查。那东西不是这个设备能处理的。"
  npc_override_sp_cor_enchan_illusion_17_1_exchange_5dfc87: "交换。"
  npc_override_sp_cor_enchan_illusion_17_1_exchange_os_weapon_a56254: "交换OS武器。"
  npc_override_sp_cor_enchan_illusion_17_1_feel_feel_talk_me_if_9de0dc: "如果你想要防具改造模块，随时来找我聊聊。"
  npc_override_sp_cor_enchan_illusion_17_1_hello_9b56d5: "你好。"
  npc_override_sp_cor_enchan_illusion_17_1_here_take_i_bet_s_630e1d: "来，拿着这个{0}。我打赌这可能是你拥有过的最好的防具。你真应该感恩。"
  npc_override_sp_cor_enchan_illusion_17_1_hey_nice_meet_you_415d1e: "嘿，很高兴见到你。"
  npc_override_sp_cor_enchan_illusion_17_1_hey_you_kidding_me_hey_2e6c96: "嘿，你在开玩笑吗？嘿，我本来想对你友好的！"
  npc_override_sp_cor_enchan_illusion_17_1_hey_you_kidding_me_you_293bff: "嘿，你在开玩笑吗？你的Cor核心不够！嘿，我本来想对你友好的！"
  npc_override_sp_cor_enchan_illusion_17_1_i_don_t_like_we_883069: "我不喜欢我们在为总统和公司工作，但忙碌的感觉还是挺好的。"
  npc_override_sp_cor_enchan_illusion_17_1_i_gave_you_armor_modific_12a01c: "我给了你一个防具改造模块。"
  npc_override_sp_cor_enchan_illusion_17_1_i_gave_you_best_i_d5ba9c: "我把我剩下的最好的给你了。"
  npc_override_sp_cor_enchan_illusion_17_1_i_going_call_her_she_368d1b: "……我正准备叫她，但她已经来了。"
  npc_override_sp_cor_enchan_illusion_17_1_i_guide_you_exchange_ite_6a7b7c: "我会根据你的职业引导你交换物品。"
  npc_override_sp_cor_enchan_illusion_17_1_i_ll_give_you_whatever_940c26: "我想给你什么就给你什么，在我拥有的里面。为什么我要让你挑？"
  npc_override_sp_cor_enchan_illusion_17_1_i_m_latest_hologram_tech_8b36c1: "^0000FF# 我是最新完善的全息影像技术，能够展示自然的反应和姿态。#^000000"
  npc_override_sp_cor_enchan_illusion_17_1_i_m_locked_up_here_305b54: "我被关在这里修理玩具，都是因为你。你能处理这个，对吧？"
  npc_override_sp_cor_enchan_illusion_17_1_i_m_selling_you_want_6826d9: "我在卖{0}，你想买吗？"
  npc_override_sp_cor_enchan_illusion_17_1_i_m_stopping_here_a878d6: "我就在这里停下了。"
  npc_override_sp_cor_enchan_illusion_17_1_i_randomly_give_you_82769e: "我可以随机给你一个{0}，"
  npc_override_sp_cor_enchan_illusion_17_1_i_told_you_bring_me_dd45d3: "我告诉过你，给我带1个损坏的武器和50个神秘组件。你应该听别人说话。"
  npc_override_sp_cor_enchan_illusion_17_1_if_you_bring_illusion_eq_9daa45: "如果你带来带有强化模块的幻景装备，我会按你的意愿改进它们。"
  npc_override_sp_cor_enchan_illusion_17_1_if_you_want_illusion_arm_236282: "如果你想要幻景防具，给我带50个{0}来。我会给你一件。"
  npc_override_sp_cor_enchan_illusion_17_1_if_you_want_refine_navi_bdd154: "如果你想精炼它，我旁边的<NAVI>[锡罐]<INFO>sp_cor,106,136,0,101,0</INFO></NAVI>可以很好地照顾你。"
  npc_override_sp_cor_enchan_illusion_17_1_if_you_want_weapon_you_29a5e5: "如果你想要武器，你可以去找艾露米娜聊聊。"
  npc_override_sp_cor_enchan_illusion_17_1_illusion_armor_614422: "幻景防具"
  npc_override_sp_cor_enchan_illusion_17_1_kind_you_get_randomly_de_9e3bf7: "你得到的种类是随机决定的。"
  npc_override_sp_cor_enchan_illusion_17_1_let_s_see_ooh_when_989347: "让我看看……哦，我什么时候做了这么多品种？好吧，我今天心情好。你想要什么？"
  npc_override_sp_cor_enchan_illusion_17_1_looks_like_equipment_you_5530f4: "看起来你试图强化的装备已经达到极限了。"
  npc_override_sp_cor_enchan_illusion_17_1_menu_axe_568ae2: "斧头：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_book_a69f1b: "书：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_bow_9baba0: "弓：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_cancel_c51c57: "取消。:普通级。:稀有级。:独特级。:传说级。"
  npc_override_sp_cor_enchan_illusion_17_1_menu_crossbow_a57a7f: "弩：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_dagger_0f676e: "匕首：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_elena_522a30: "艾莲娜·沃尔科娃：啊，我一直在找你，冒险者。"
  npc_override_sp_cor_enchan_illusion_17_1_menu_elyumina_13642a: "艾露米娜：好了，好了！我来了！你真是可怜，没有我，你就只能拿豆袋战斗了。"
  npc_override_sp_cor_enchan_illusion_17_1_menu_elyumina_1e728d: "艾露米娜：什么？如果你只是要让我像雕像一样站在这里，那你为什么还要叫我？你们这些野蛮人！"
  npc_override_sp_cor_enchan_illusion_17_1_menu_elyumina_8b9b92: "艾露米娜：什么？如果你只是要让我像雕像一样站在这里，那你为什么还要叫我？你们这些混蛋！"
  npc_override_sp_cor_enchan_illusion_17_1_menu_explore_eacfd3: "探索设备。:附魔幻景防具。:附魔幻景引擎之翼。:附魔幻景腿甲。:附魔幻景饰品[R]。:附魔幻景饰品[L]。"
  npc_override_sp_cor_enchan_illusion_17_1_menu_i_d00b61: "我再考虑一下……:我们继续吧。"
  npc_override_sp_cor_enchan_illusion_17_1_menu_katar_a41655: "拳刃：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_knuckle_49e08a: "拳套：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_lance_51d5ae: "长矛：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_mace_c13dd2: "锤：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_rebellion_96270a: "反叛者：嘿，罪犯。你被通缉了。"
  npc_override_sp_cor_enchan_illusion_17_1_menu_rebellion_ef9b1b: "反叛者：哦，那台机器没有模块就没用。"
  npc_override_sp_cor_enchan_illusion_17_1_menu_sniper_33f1ec: "狙击步枪：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_staff_b2a4b2: "法杖：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_sword_5d9404: "剑：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_two_bc3705: "双手剑：{0}"
  npc_override_sp_cor_enchan_illusion_17_1_module_needs_checked_dev_28a76a: "模块需要检查。这个设备无法检测到它。"
  npc_override_sp_cor_enchan_illusion_17_1_msg_6e4401: "------------------"
  npc_override_sp_cor_enchan_illusion_17_1_my_end_course_you_check_cae6db: "当然不是我的问题。这是你的问题。检查一下你的背包是否满了，或者你是否拥有所有需要的材料。"
  npc_override_sp_cor_enchan_illusion_17_1_my_technology_only_found_eda070: "我的技术只能在未来的城市中找到。我是RS26，一把雷根舒姆机械。"
  npc_override_sp_cor_enchan_illusion_17_1_okay_enjoy_your_conversa_6d69b1: "好吧，享受你们的对话。"
  npc_override_sp_cor_enchan_illusion_17_1_or_95f32b: "或{0}。"
  npc_override_sp_cor_enchan_illusion_17_1_os_weapons_i_ll_handle_4b2e64: "OS武器？如果你给我带1个{0}和50个{1}，我来处理。"
  npc_override_sp_cor_enchan_illusion_17_1_please_come_back_if_you_7a7bca: "如果你需要我的帮助，请再来找我~"
  npc_override_sp_cor_enchan_illusion_17_1_please_organize_your_ite_01b3c7: "请整理你的物品后再试一次。"
  npc_override_sp_cor_enchan_illusion_17_1_rebellion_using_building_8319b7: "反叛者暂时在使用这座建筑。"
  npc_override_sp_cor_enchan_illusion_17_1_request_armor_modificati_ea09b9: "请求防具改造模块。"
  npc_override_sp_cor_enchan_illusion_17_1_request_os_weapon_c9a2dd: "请求OS武器。"
  npc_override_sp_cor_enchan_illusion_17_1_request_weapon_modificat_77006d: "请求武器改造装置（物理）。"
  npc_override_sp_cor_enchan_illusion_17_1_see_elyumina_723de2: "去见艾露米娜。"
  npc_override_sp_cor_enchan_illusion_17_1_selected_module_enchante_cbb0b3: "选定的模块可以在装备上附魔至^0000FF{0} {1}^000000。这件装备目前已被该模块附魔了^0000FF{2}。"
  npc_override_sp_cor_enchan_illusion_17_1_since_these_modules_work_c54864: "由于这些模块与标准装备兼容，它们不会破坏物品。但是，升级次数可能因装备而异。"
  npc_override_sp_cor_enchan_illusion_17_1_so_you_received_message_197479: "那么，你收到消息了。队长们正在里面开会。艾莲娜·沃尔科娃队长一定叫了你。"
  npc_override_sp_cor_enchan_illusion_17_1_then_please_visit_me_aga_465f60: "那么，当你需要我的帮助时，请再来找我~"
  npc_override_sp_cor_enchan_illusion_17_1_there_if_you_want_anothe_8e4607: "给你。如果你想要另一个，那就给我带更多损坏的武器和神秘组件来。"
  npc_override_sp_cor_enchan_illusion_17_1_there_seems_problem_plea_5fe3ed: "似乎有问题。请检查你的背包是否有足够的空间，以及你是否拥有所有需要的交换材料。"
  npc_override_sp_cor_enchan_illusion_17_1_took_long_time_coax_him_395db2: "花了很长时间才说服他，但他最终同意修改我们的武器和防具。他也相当擅长。他每天都在工作。"
  npc_override_sp_cor_enchan_illusion_17_1_tsk_tsk_i_said_everythin_d60a7a: "啧，啧。我说我做的都是好东西。你真的非要挑吗？好吧，那你听好了。"
  npc_override_sp_cor_enchan_illusion_17_1_we_grace_equipment_excha_3ba789: "我们有^4d4dff格蕾丝^000000装备，可以用{0}交换。"
  npc_override_sp_cor_enchan_illusion_17_1_we_haven_t_been_busy_262c40: "我们已经很久没有这么忙了。"
  npc_override_sp_cor_enchan_illusion_17_1_welcome_welcome_14ecc0: "欢迎，欢迎！"
  npc_override_sp_cor_enchan_illusion_17_1_what_so_important_you_ha_53ee82: "有什么重要的事情让你打断我的研究？这最好很重要。"
  npc_override_sp_cor_enchan_illusion_17_1_what_there_s_problem_d451e6: "……什么？有问题。"
  npc_override_sp_cor_enchan_illusion_17_1_which_one_f9b0a1: "哪一个？"
  npc_override_sp_cor_enchan_illusion_17_1_which_one_you_cor_cores_7eabb1: "你有哪一个，5个Cor核心还是100万Zeny？"
  npc_override_sp_cor_enchan_illusion_17_1_you_business_me_i_exchan_1f7533: "或者你有事找我？我可以交换武器改造装置和防具改造模块。"
  npc_override_sp_cor_enchan_illusion_17_1_you_don_t_enough_cor_96d366: "你的Cor核心不够。请再检查一下你的背包。"
  npc_override_sp_cor_enchan_illusion_17_1_you_don_t_enough_zeny_490313: "你的Zeny不够。请再检查一下你的钱包。"
  npc_override_sp_cor_enchan_illusion_17_1_you_need_module_matches_85c6c7: "你需要拥有一个与功效匹配的模块才能进行强化。"
  npc_override_sp_cor_enchan_illusion_17_1_you_selected_b0bd49: "^0000FF你已选择{0} {1}^000000"
  npc_override_sp_cor_enchan_illusion_17_1_you_t_proceed_conversati_381a25: "因为你携带了大量物品，无法继续对话。"
  npc_override_sp_cor_enchan_illusion_17_1_you_want_armor_modificat_5e11c7: "你想要防具改造模块吗？需要30个{0}和5个{1}。"
  npc_override_sp_cor_enchan_illusion_17_1_you_want_proceed_c927ea: "你想继续吗？"
  npc_override_sp_cor_enchan_illusion_17_1_you_want_weapon_modifica_5a25fe: "你想要武器改造装置吗？需要5个{0}或100万Zeny。"
  npc_override_sp_cor_enchan_illusion_17_1_your_bag_full_please_mak_018609: " - 你的背包满了。请腾出一些空间，然后再来找我。 -"
  npc_override_sp_cor_enchan_illusion_17_1_your_bag_full_please_mak_4abc9c: "你的背包满了。请先腾出一些空间。"
  npc_override_sp_cor_quests_17_1_aaaaah_researcher_s_us_w_d0e137: "啊啊啊！！研究员！是我们！我们也在这里！"
  npc_override_sp_cor_quests_17_1_aaaah_i_haven_t_finished_e75064: "啊啊啊……我还没完成。"
  npc_override_sp_cor_quests_17_1_aaaah_i_love_yuno_laughs_1eb1c6: "啊啊啊。我爱朱诺。*笑*"
  npc_override_sp_cor_quests_17_1_aaah_eva_my_dear_eva_a2d545: "啊啊……伊娃，我亲爱的伊娃……"
  npc_override_sp_cor_quests_17_1_aaah_how_contact_you_no_5fda94: "啊啊~怎么联系你！不管怎样！请再联系我们，即使我们很忙！"
  npc_override_sp_cor_quests_17_1_aaah_yes_right_right_vic_f95018: "啊啊！是的，对，对！！……副总裁？哦，你好！"
  npc_override_sp_cor_quests_17_1_aah_s_you_did_you_cddb1e: "啊，是你！你见过……帕特吗？"
  npc_override_sp_cor_quests_17_1_aah_you_re_alive_adventu_0ac92e: "啊！你还活着！冒险者！有人和你在一起吗？"
  npc_override_sp_cor_quests_17_1_aah_you_want_meet_them_2f2fc1: "啊啊~你想再见他们几分钟吗~贵宾会再来这里吗？"
  npc_override_sp_cor_quests_17_1_aas_est_went_look_around_19500d: "阿斯和艾斯特去查看这一带了。"
  npc_override_sp_cor_quests_17_1_aas_oh_my_really_you_111487: "阿斯？哦天哪，真的是你吗阿斯？你还好吗？你在这里做什么？你是要去审问那个背叛我们、改变立场的人吗？"
  npc_override_sp_cor_quests_17_1_aas_told_me_you_had_61f61a: "阿斯告诉我你有东西要送。"
  npc_override_sp_cor_quests_17_1_aas_what_you_doing_here_de2bb1: "阿斯？你在这里做什么……？"
  npc_override_sp_cor_quests_17_1_abandoned_mine_beyond_ba_550454: "废弃的矿井就在这道屏障后面。小心。"
  npc_override_sp_cor_quests_17_1_about_dien_14a684: "关于迪恩。"
  npc_override_sp_cor_quests_17_1_absolutely_03f916: "绝对不行！"
  npc_override_sp_cor_quests_17_1_absolutely_nothing_946002: "绝对什么都没有。"
  npc_override_sp_cor_quests_17_1_ack_what_9b06fb: "啊，那是什么？"
  npc_override_sp_cor_quests_17_1_actually_i_don_t_know_448ee2: "其实，我不知道。也许你知道。"
  npc_override_sp_cor_quests_17_1_advanced_team_difficulty_e26455: "先遣队独自搜索一切有困难，"
  npc_override_sp_cor_quests_17_1_adventurer_adventurer_he_21649a: "冒险者？冒险者！！嘿，我还没死呢！！好得很！！"
  npc_override_sp_cor_quests_17_1_adventurer_back_already_42953a: "冒险者已经回来了吗？"
  npc_override_sp_cor_quests_17_1_adventurer_could_i_speak_680297: "冒险者。我可以和你说几句话吗？"
  npc_override_sp_cor_quests_17_1_adventurer_first_class_f_2a5be3: "冒险者没有一等假通行证吗？"
  npc_override_sp_cor_quests_17_1_adventurer_go_mcdonald_s_263d09: "冒险者将和贵宾一起去麦当劳实验室。当我们完成调查后，我们会在麦当劳实验室再见面。"
  npc_override_sp_cor_quests_17_1_adventurer_let_s_go_quic_ba0d22: "冒险者，我们快点走吧？一起走。"
  npc_override_sp_cor_quests_17_1_adventurer_listen_me_lis_98ea28: "冒险者！听我说！听我说，你来判断谁对谁错。你知道这些家伙一直在说什么吗？"
  npc_override_sp_cor_quests_17_1_adventurer_my_secretary_14632a: "冒险者是我的秘书，那是我的守卫。"
  npc_override_sp_cor_quests_17_1_adventurer_rebellion_kee_b87435: "冒险者，反叛者会继续保持对这里的包围，并调查周边。"
  npc_override_sp_cor_quests_17_1_adventurer_return_cat_bu_3066ae: "冒险者，回到子弹上的猫，告诉泰斯这里发生了什么。"
  npc_override_sp_cor_quests_17_1_adventurer_s_dangerous_h_d338c3: "冒险者，这里很危险。前往安全地点。"
  npc_override_sp_cor_quests_17_1_adventurer_s_help_apprec_9d630b: "冒险者的帮助将受到赞赏！请加入<NAVI>[左侧]<INFO>sp_cor,108,130,0,101,0</INFO></NAVI>的搜索队！"
  npc_override_sp_cor_quests_17_1_adventurer_should_come_a_265723: "冒险者应该跟我来。"
  npc_override_sp_cor_quests_17_1_adventurer_should_take_b_a027c8: "冒险者应该休息一下。"
  npc_override_sp_cor_quests_17_1_adventurer_you_ll_first_046822: "冒险者，有消息我会第一个通知你。"
  npc_override_sp_cor_quests_17_1_adventurer_you_re_here_w_49cb4e: "冒险者！你来了！还能是谁呢？"
  npc_override_sp_cor_quests_17_1_adventurers_bold_ideas_0a8f1f: "冒险者们有大胆的想法吗？"
  npc_override_sp_cor_quests_17_1_after_all_i_blinded_my_c2c7ef: "毕竟，我被自己的自负蒙蔽了双眼。我没有意识到正在发生的任何事情。"
  npc_override_sp_cor_quests_17_1_after_all_they_all_disap_8ce441: "毕竟，他们都是以类似的方式消失的。所以一旦我们弄清楚其中一个人发生了什么，我们就会知道其他人发生了什么。"
  npc_override_sp_cor_quests_17_1_after_memorial_dungeon_c_36bee0: "在纪念地牢创建并且所有队员选择进入后，你可以选择进入开始行动。"
  npc_override_sp_cor_quests_17_1_age_he_received_special_525c65: "在21岁时，他获得了低收入家庭的特别奖。这引起了周围很多人的嫉妒。"
  npc_override_sp_cor_quests_17_1_ah_adventurer_long_time_34f14a: "啊，冒险者！好久不见！你不想我吗？"
  npc_override_sp_cor_quests_17_1_ah_adventurer_you_too_go_fe34b5: "啊，冒险者，你也一样。干得好！"
  npc_override_sp_cor_quests_17_1_ah_ahah_i_m_really_7acf05: "啊，啊哈……我真是个糟糕的人……"
  npc_override_sp_cor_quests_17_1_ah_argh_i_m_gonna_e15d6c: "啊……啊！！我要……死了！！"
  npc_override_sp_cor_quests_17_1_ah_frustrating_14bcc7: "啊，真让人沮丧！"
  npc_override_sp_cor_quests_17_1_ah_hello_5b6243: "啊，你好。"
  npc_override_sp_cor_quests_17_1_ah_i_see_you_re_e1ce51: "啊！我明白了。你在找帕特里克·考夫曼的调动记录？"
  npc_override_sp_cor_quests_17_1_ah_i_understand_thanks_y_4e3f32: "啊，我明白了。多亏了你们，我要做的事情更多了，人手却更少了，但我没事。"
  npc_override_sp_cor_quests_17_1_ah_man_i_think_i_d75494: "啊，天哪。我想是这个，但我打不开。是太锈了吗？"
  npc_override_sp_cor_quests_17_1_ah_mm_yes_4164a6: "啊……嗯，是的。"
  npc_override_sp_cor_quests_17_1_ah_nice_meet_you_my_a4a2c2: "啊！很高兴见到你。我叫黛西。我是副总裁的老朋友。"
  npc_override_sp_cor_quests_17_1_ah_right_elyumina_also_k_0b876b: "啊，对了。艾露米娜也会在这里待一段时间。"
  npc_override_sp_cor_quests_17_1_ah_s_you_i_m_a1b324: "啊！！是你，我很抱歉！我会尽力的！"
  npc_override_sp_cor_quests_17_1_ah_well_done_i_wanted_d7f66d: "啊！干得好。我想把她介绍给你。她是名单上^0000FF另一个失踪者^000000的未婚妻。"
  npc_override_sp_cor_quests_17_1_ah_yes_you_re_right_4f6611: "啊是的，你说得对。对于有特才能的人，他们必须先经过OT，然后才会被分配到各自的部门。"
  npc_override_sp_cor_quests_17_1_ah_you_came_early_i_445c6b: "啊，你来早了。我以为你会休息一会儿再来。"
  npc_override_sp_cor_quests_17_1_ah_you_re_done_yet_dd8ebb: "啊，你还没完成呢。"
  npc_override_sp_cor_quests_17_1_ah_you_re_so_cold_bccf3f: "啊，你真冷淡，冒险者。别那样。"
  npc_override_sp_cor_quests_17_1_ah_you_want_try_thank_c221c0: "啊，你想试试？谢谢你，戈尼。"
  npc_override_sp_cor_quests_17_1_ahah_a6f4d1: "啊哈……"
  npc_override_sp_cor_quests_17_1_ahah_i_polite_enough_our_861e05: "啊哈！我是不够礼貌吗？我们的贵宾生气了~但冒险者和我以前去过很多地方，我们知道这些事情。"
  npc_override_sp_cor_quests_17_1_ahahaha_courtesy_courtes_a36255: "啊哈哈哈！礼貌，礼貌！让我们对我们的贵宾有礼貌！"
  npc_override_sp_cor_quests_17_1_ahahaha_vip_never_heard_555cd7: "啊哈哈哈。贵宾从未听过比金勺子更重的东西。"
  npc_override_sp_cor_quests_17_1_all_captains_inside_d3d6bd: "所有队长都在里面。"
  npc_override_sp_cor_quests_17_1_all_employees_go_through_6890aa: "所有员工都要经过OT吗？"
  npc_override_sp_cor_quests_17_1_all_future_work_handled_63e9d3: "所有未来的工作将通过^0000FF这边的阿斯^000000来处理。我会把手镯交给阿斯。"
  npc_override_sp_cor_quests_17_1_all_garbage_incinerated_2065db: "所有垃圾都在这里焚烧吗？"
  npc_override_sp_cor_quests_17_1_all_started_because_trai_e69215: "一切都是因为守卫中的叛徒开始的。"
  npc_override_sp_cor_quests_17_1_all_went_so_fast_069fba: "一切发生得太快了。"
  npc_override_sp_cor_quests_17_1_already_why_don_t_you_32f197: "已经要走了？为什么不再待一会儿？我刚点了一份炖菜，你觉得怎么样？"
  npc_override_sp_cor_quests_17_1_already_you_ve_been_ther_ebff71: "已经？你今天已经在那里待了很久了吧？我知道这不容易，你应该休息一下。"
  npc_override_sp_cor_quests_17_1_alright_6ceaec: "好吧……"
  npc_override_sp_cor_quests_17_1_alright_a5b0b1: "好吧！"
  npc_override_sp_cor_quests_17_1_alright_i_m_glad_hear_a11516: "好吧，很高兴听到这个消息，我很乐意接受你的合作。"
  npc_override_sp_cor_quests_17_1_alright_i_see_let_s_2de25c: "好吧，我明白了。让我们把它称为问题，而不是失踪者。这样你会感觉好些吗？如果这能让你更容易接受，我就这么称呼。你真的想以积极的态度解决这个问题吗？"
  npc_override_sp_cor_quests_17_1_alright_if_md_activated_1d13ac: "好吧，如果MD激活了，再跟我对话并选择^0000CD进入^000000。你一进入，我们的行动就会开始。"
  npc_override_sp_cor_quests_17_1_alright_later_i_send_spe_1686f1: "好吧。稍后，我会派专家去寻找尸体或遗骸。再说一次，你的服务必须得到适当的回报。"
  npc_override_sp_cor_quests_17_1_alright_let_me_talk_them_46ace8: "好吧。让我和他们谈谈。"
  npc_override_sp_cor_quests_17_1_alright_please_stay_here_5a1812: "好吧，请待在这里。"
  npc_override_sp_cor_quests_17_1_alright_then_please_care_4d5484: "好吧，那么请小心。"
  npc_override_sp_cor_quests_17_1_alright_we_re_going_foll_c561ee: "好吧！我们要跟进帕特，所以旅行的下一个地方将在<NAVI>[总部]<INFO>lighthalzen,107,165,0,101,0</INFO></NAVI>。"
  npc_override_sp_cor_quests_17_1_alright_we_re_going_foll_e29a86: "好吧！我们要跟进帕特，所以旅行的下一个地点将在<NAVI>[总部]<INFO>lighthalzen,107,165,0,101,0</INFO></NAVI>。"
  npc_override_sp_cor_quests_17_1_alright_you_re_elite_eli_84bde2: "好吧，你是反叛者中的精英中的精英，特别挑选来捕捉这个一直在攻击这个区域的研究员，不分敌友。"
  npc_override_sp_cor_quests_17_1_also_codename_we_use_amo_c45058: "另外，这将是我们彼此之间提到这位科学家时使用的代号。"
  npc_override_sp_cor_quests_17_1_also_s_easier_than_getti_63eef0: "另外，这比进入我家容易。"
  npc_override_sp_cor_quests_17_1_also_s_really_economical_5c8b48: "另外，这真的很经济。快速决策，我喜欢。"
  npc_override_sp_cor_quests_17_1_always_like_331238: "一直是这样的吗？"
  npc_override_sp_cor_quests_17_1_am_i_dead_7c4e2b: "我……死了吗？"
  npc_override_sp_cor_quests_17_1_am_i_problem_you_you_ebc0ae: "我是你的问题吗？你以为我会轻易放弃吗？我会一直找下去，直到找到马库斯！"
  npc_override_sp_cor_quests_17_1_am_i_really_interrogatin_a7624b: "（我真的在审问他吗？）"
  npc_override_sp_cor_quests_17_1_am_i_supposed_suspend_al_496d10: "我应该暂停所有批判性思维，毫无保留地相信你吗？"
  npc_override_sp_cor_quests_17_1_annex_one_oh_you_want_53fc4b: "附属的那个。哦，你想去吗？我有一段时间没去那里了，很难进去。如果你不介意，你能把人送回来这里吗？"
  npc_override_sp_cor_quests_17_1_anyhow_i_ve_analyzed_all_c67667: "无论如何，我已经分析了上次行动中收集的所有信息。"
  npc_override_sp_cor_quests_17_1_anyone_4272e3: "任何人都能做到。"
  npc_override_sp_cor_quests_17_1_anyone_who_s_good_enough_e46e16: "任何身体状况良好且希望留下的人都可以留在这里，他们仍然会被雇用。"
  npc_override_sp_cor_quests_17_1_anyway_how_about_all_the_4669da: "不管怎样，这些怎么样……？"
  npc_override_sp_cor_quests_17_1_anyway_i_don_t_think_b284cc: "不管怎样，我不认为你能独自处理它们。"
  npc_override_sp_cor_quests_17_1_anyway_i_m_looking_navi_a0e4cc: "不管怎样，我在找一个<NAVI>[人]<INFO>sp_cor,151,180,0,101,0</INFO></NAVI>来帮我洗衣服。已经有一段时间了，我的脚很脏。"
  npc_override_sp_cor_quests_17_1_anyway_i_m_looking_navi_cd956b: "不管怎样，我在找一个<NAVI>[人]<INFO>sp_cor,151,180,0,000,0</INFO></NAVI>来帮我洗衣服。已经有一段时间了，我的脚很脏。"
  npc_override_sp_cor_quests_17_1_anyway_i_should_go_beyon_9d6aaf: "不管怎样，我应该越过屏障去获取让泰斯满意的信息？"
  npc_override_sp_cor_quests_17_1_anyway_if_you_re_looking_35ca37: "不管怎样，如果你在找特定的人，你应该^0000FF问问研究员们。^000000他们大多数已经逃跑了，但有几个留了下来。"
  npc_override_sp_cor_quests_17_1_anyway_if_you_want_know_6b06ce: "不管怎样，如果你想了解更多，去看看<NAVI>[焚化炉]<INFO>sp_cor,70,263,0,101,0</INFO></NAVI>。"
  npc_override_sp_cor_quests_17_1_anyway_please_careful_da_224c3b: "不管怎样，请小心，这是个危险的地方。"
  npc_override_sp_cor_quests_17_1_anyway_so_area_all_exper_da5b89: "不管怎样，所以这个区域全是实验？"
  npc_override_sp_cor_quests_17_1_anyway_there_s_nothing_a_7e250e: "不管怎样，没有什么比到处旅行更好的了。"
  npc_override_sp_cor_quests_17_1_anyway_time_around_elder_a8cb61: "不管怎样，这一次，反叛者的长老们将参与这次行动。"
  npc_override_sp_cor_quests_17_1_anyway_vice_president_i_ef243d: "不管怎样，副总裁，我知道你们这种人，我会提交我的报告，然后按我自己的方式做事。"
  npc_override_sp_cor_quests_17_1_anyway_we_ve_opened_door_39385e: "不管怎样，我们已经打开了门，走吧。"
  npc_override_sp_cor_quests_17_1_anyway_what_about_all_th_9f9a89: "不管怎样，这些怎么样……？"
  npc_override_sp_cor_quests_17_1_anyway_you_special_unit_294baf: "不管怎样，你的守卫中有特种部队吗？我已经知道答案了。"
  npc_override_sp_cor_quests_17_1_appears_i_m_next_line_17b840: "看来我是王位的下一个继承人。"
  npc_override_sp_cor_quests_17_1_area_been_closed_evacuat_dfb165: "该区域已关闭。疏散过程几乎完成。"
  npc_override_sp_cor_quests_17_1_area_nothing_disposal_fa_630659: "这个区域不过是一个处理设施。"
  npc_override_sp_cor_quests_17_1_aren_t_you_imagining_too_5d1256: "你是不是想太多了。"
  npc_override_sp_cor_quests_17_1_aren_t_you_participating_d72065: "你不参加下一次行动吗？"
  npc_override_sp_cor_quests_17_1_aren_t_you_supposed_work_ba3c3b: "你现在不应该在工作吗？"
  npc_override_sp_cor_quests_17_1_aren_t_you_tired_walking_acb6eb: "你不厌倦走这条狭窄陡峭的路吗？"
  npc_override_sp_cor_quests_17_1_argh_658e94: "啊……"
  npc_override_sp_cor_quests_17_1_arthur_don_t_touch_these_7dc6c2: "亚瑟，别碰这些，否则你的手会融化。"
  npc_override_sp_cor_quests_17_1_as_far_as_i_ve_bebebe: "这就是我已经调查到的范围。"
  npc_override_sp_cor_quests_17_1_as_general_soldier_schwa_fa5ad3: "但作为施瓦茨共和国的一名普通士兵，独自处理这件事太难了，最终我们利用了反叛者和冒险者的力量。"
  npc_override_sp_cor_quests_17_1_as_i_told_you_before_ecea6f: "正如我之前告诉你的，我全天候工作……这里有很多实验室，我不确定哪些还在运营，哪些没有。"
  npc_override_sp_cor_quests_17_1_as_lazy_said_he_doesn_6108d3: "正如莱兹所说，他不相信你的发现。"
  npc_override_sp_cor_quests_17_1_as_lazy_saying_even_if_348f23: "正如莱兹所说……即使你叫莱兹为屎，莱兹还是莱兹。"
  npc_override_sp_cor_quests_17_1_as_lazy_saying_i_think_a4890b: "正如莱兹所说，我认为雷肯伯利用了这些人的绝望。"
  npc_override_sp_cor_quests_17_1_as_now_rekenber_now_dedi_0ce3f2: "截至目前，雷肯伯将^0000FF全力配合调查。^000000请告诉我你需要的一切。我们会尽一切可能支持你。"
  npc_override_sp_cor_quests_17_1_as_said_they_called_hear_45b15a: "正如所说，他们被称为'猎心者'。"
  npc_override_sp_cor_quests_17_1_as_such_i_m_going_0becd6: "因此，我将报告关于帕特旅程的调查。"
  npc_override_sp_cor_quests_17_1_as_we_started_treating_t_de80f9: "当我们开始治疗他们时，我们发现除了伤势之外，还有一些^0000FF严重的健康问题。^000000"
  npc_override_sp_cor_quests_17_1_as_you_adventurer_please_915197: "至于你，冒险者，请选择准备并等待我们。"
  npc_override_sp_cor_quests_17_1_as_you_see_no_misunderst_ca278b: "如你所见，没有误解，只有真相~"
  npc_override_sp_cor_quests_17_1_as_you_see_we_didn_7be393: "如你所见，我们没有伤害他们……"
  npc_override_sp_cor_quests_17_1_ask_about_next_operation_cf01a5: "询问下一次行动。"
  npc_override_sp_cor_quests_17_1_ask_what_you_need_prepar_f228fd: "询问你需要准备什么。"
  npc_override_sp_cor_quests_17_1_attacker_8d647a: "攻击者？"
  npc_override_sp_cor_quests_17_1_awkward_5d2e7c: "这很尴尬。"
  npc_override_sp_cor_quests_17_1_bad_listen_don_t_bother_a161be: "听一听不好吗？别管他们，不值得你花时间。"
  npc_override_sp_cor_quests_17_1_ban_forget_what_we_had_2c82fc: "班，算了吧。我们拥有的可能根本不是真正的和平。"
  npc_override_sp_cor_quests_17_1_barrier_created_afterwar_3e031e: "屏障是后来才建立的吗？"
  npc_override_sp_cor_quests_17_1_because_est_special_troo_688f6a: "正因为如此，艾斯特特种部队隐藏在战场上以进一步推进。"
  npc_override_sp_cor_quests_17_1_because_he_s_rekenber_of_a81ef8: "因为他是雷肯伯的官员，他应该很容易找到这些信息，对吧？"
  npc_override_sp_cor_quests_17_1_because_lab_crushed_toxi_0c05ab: "因为实验室被摧毁了，有毒物质到处涌现。"
  npc_override_sp_cor_quests_17_1_because_she_chose_stay_b_b2227d: "因为她选择留在其他人进入宅邸之后，以保护他的研究数据。"
  npc_override_sp_cor_quests_17_1_before_we_go_there_two_760dc3: "在我们继续之前，这次联合调查有两个^0000CD条件。^000000"
  npc_override_sp_cor_quests_17_1_before_you_register_as_g_b89d95: "在你注册为宅邸的客人之前，优先考虑每个人的安全。"
  npc_override_sp_cor_quests_17_1_beginners_mode_player_tr_c0af78: "^FF0000在初学者模式下，玩家会变身为怪物。请注意，现有的变身效果将在进入并继续后消失。^000000"
  npc_override_sp_cor_quests_17_1_being_adventurer_really_00f77b: "当冒险者真的更适合我。"
  npc_override_sp_cor_quests_17_1_being_emotional_doesn_t_dad143: "情绪化无助于解决问题。"
  npc_override_sp_cor_quests_17_1_beyond_lab_site_barmund_c768cf: "在这个实验室之外是^0000CD巴蒙德宅邸，^000000它曾经是隐藏的。"
  npc_override_sp_cor_quests_17_1_big_problem_they_don_t_73235c: "这是个大问题。他们根本不相信我们。"
  npc_override_sp_cor_quests_17_1_both_our_determinations_498f54: "如果我们两人的决心结合起来，没有什么能阻止我们。"
  npc_override_sp_cor_quests_17_1_briefing_held_after_we_e_b58744: "简报将在我们进入行动区域后举行。确保你带好所需的物资。"
  npc_override_sp_cor_quests_17_1_button_right_here_opens_5c0d52: "这个按钮就在这里，可以打开门，但你一松开，门就会关闭。"
  npc_override_sp_cor_quests_17_1_c_eeaabf: "c.a....a..."
  npc_override_sp_cor_quests_17_1_captain_there_another_ex_3a2b27: "队长，设施附近又发生了一次爆炸！"
  npc_override_sp_cor_quests_17_1_careful_fa18ab: "小心。"
  npc_override_sp_cor_quests_17_1_careful_here_289512: "这里小心。"
  npc_override_sp_cor_quests_17_1_carefully_closed_box_aga_668b08: "- 再次小心地关上了盒子。 -"
  npc_override_sp_cor_quests_17_1_catch_aphids_eb6b73: "捕捉蚜虫。"
  npc_override_sp_cor_quests_17_1_certainly_papers_i_ve_re_f9fab9: "这肯定不在我收到的文件中。只提到了出发和少数调动。所有细节都缺失了。"
  npc_override_sp_cor_quests_17_1_chat_morning_f8974c: "和莫宁聊天。"
  npc_override_sp_cor_quests_17_1_chief_researchers_here_k_b371a1: "这里的首席研究员知道所有细节。我真的不知道他们会就这样离开。我以为他们就像我的家人一样……"
  npc_override_sp_cor_quests_17_1_chief_told_me_pack_my_25e6ad: "首席告诉我打包行李，因为外面有骚动。我犹豫是因为我要照顾我的庄稼，但后来所有人都已经离开了。"
  npc_override_sp_cor_quests_17_1_citizen_s_safety_threate_140c63: "市民的安全受到威胁，"
  npc_override_sp_cor_quests_17_1_clusters_small_green_gra_1ce0bf: "一簇簇小绿葡萄挂在看起来健康的葡萄藤上。"
  npc_override_sp_cor_quests_17_1_clusters_small_green_gra_d777fe: "一簇簇小绿葡萄挂在恢复生机的葡萄藤上。"
  npc_override_sp_cor_quests_17_1_come_check_out_yourself_ba9582: "进来自己看看吧！"
  npc_override_sp_cor_quests_17_1_come_get_inside_navi_hea_b0c5a3: "来吧，进入<NAVI>[总部]<INFO>lhz_in01,107,137,0,101,0</INFO></NAVI>！"
  npc_override_sp_cor_quests_17_1_come_like_first_operatio_3bfe52: "来吧？就像我们第一次行动那样。"
  npc_override_sp_cor_quests_17_1_come_they_re_all_gunmen_bd2178: "来吧，他们都是枪手！"
  npc_override_sp_cor_quests_17_1_come_think_your_name_was_f62887: "话说回来，你的名字不在公司的员工名单上。"
  npc_override_sp_cor_quests_17_1_company_doesn_t_investig_fdce82: "公司不调查私人事务。这是私事是有原因的。问问自己，你是否希望别人调查你的私事。"
  npc_override_sp_cor_quests_17_1_contains_envelope_f19041: "- 里面有一个信封。 -"
  npc_override_sp_cor_quests_17_1_cooperate_us_we_ll_help_6d4a9b: "与我们合作，我们会帮助你继续。"
  npc_override_sp_cor_quests_17_1_cooperating_them_0d8413: "与他们合作……？！"
  npc_override_sp_cor_quests_17_1_correct_answer_we_t_i_11a970: "正确答案是我们不能！我认为那不可能。"
  npc_override_sp_cor_quests_17_1_couldn_t_you_just_said_8dbc6a: "你就不能直说吗？"
  npc_override_sp_cor_quests_17_1_course_be6167: "当然。"
  npc_override_sp_cor_quests_17_1_course_i_like_latter_928e8c: "当然，我喜欢后者。"
  npc_override_sp_cor_quests_17_1_course_i_spare_some_time_276caf: "当然，我可以为帮助夺回实验室的人腾出一些时间。我真的很感激。"
  npc_override_sp_cor_quests_17_1_course_if_you_use_magic_5ed337: "当然，如果你使用传送或苍蝇翅膀这样的魔法，你可以通过。"
  npc_override_sp_cor_quests_17_1_course_s_common_sense_796999: "当然，这是常识~"
  npc_override_sp_cor_quests_17_1_course_they_being_paid_w_c47ecf: "当然。他们是为工作而得到报酬的。如果你离开，你就不会再得到报酬了，对吧？"
  npc_override_sp_cor_quests_17_1_course_we_re_just_gettin_57d492: "当然不是。我们只是在被你们反叛者攻击。"
  npc_override_sp_cor_quests_17_1_course_you_also_use_magi_3cc21a: "当然你也可以用魔法出去……啊哈。"
  npc_override_sp_cor_quests_17_1_course_you_never_gave_hi_5f9668: "当然不是。你从未给过他机会。"
  npc_override_sp_cor_quests_17_1_course_you_re_list_new_3c9f65: "当然。你在新员工名单上。你可以去二楼，参加OT并听培训。"
  npc_override_sp_cor_quests_17_1_course_you_really_think_b3ee63: "当然。但你真的认为里面有什么有价值的东西吗？他们在离开之前就会带走。"
  npc_override_sp_cor_quests_17_1_create_e5eb84: "创建'{0}'"
  npc_override_sp_cor_quests_17_1_create_party_following_c_01572f: "使用以下命令创建队伍^4D4DFF'/organize 队伍名称'。^000000"
  npc_override_sp_cor_quests_17_1_current_situation_nobody_31805b: "以目前的情况，没有人会相信你的发现。"
  npc_override_sp_cor_quests_17_1_daisy_hi_you_more_inform_3af7b4: "黛西？嗨。你对发生的事情有更多了解吗？"
  npc_override_sp_cor_quests_17_1_daisy_i_don_t_like_bf85fa: "黛西，我不喜欢他的眼神和说话方式。所有政府人员都这样吗？"
  npc_override_sp_cor_quests_17_1_daisy_if_you_need_anythi_82109b: "黛西，如果你需要什么，请随时来找我。"
  npc_override_sp_cor_quests_17_1_daisy_s_opinion_hard_acc_d3db6c: "黛西的观点很难接受，但背后的逻辑……是正确的。我想我会试一试。"
  npc_override_sp_cor_quests_17_1_daisy_what_you_thinking_e2436b: "黛西，你在想什么？"
  npc_override_sp_cor_quests_17_1_daisy_you_compare_list_p_b502b9: "黛西，你能对比一下名单吗。"
  npc_override_sp_cor_quests_17_1_day_incident_midnight_gu_588484: "在事发当天，午夜时分，守卫们换了不寻常的制服。"
  npc_override_sp_cor_quests_17_1_daytime_our_team_charge_62c7f0: "白天，我们的团队负责巡逻和安全。晚上，施莱因的保安接管。"
  npc_override_sp_cor_quests_17_1_deal_hide_5a4a82: "交易是隐藏。"
  npc_override_sp_cor_quests_17_1_dear_adventurer_you_forg_7d17ff: "亲爱的冒险者，你忘了是谁一直在帮助你吗？反叛者一直在这些区域活动。"
  npc_override_sp_cor_quests_17_1_dear_vice_president_ffaa67: "亲爱的副总裁？"
  npc_override_sp_cor_quests_17_1_detailed_records_found_i_a367de: "详细记录可以在他所在的实验室里面找到，或者也许在另一个实验室。"
  npc_override_sp_cor_quests_17_1_did_he_use_all_his_cb58ef: "他把所有的假期都用完了吗？"
  npc_override_sp_cor_quests_17_1_did_i_change_definition_fc72c4: "我是不是在不知情的情况下改变了定义？"
  npc_override_sp_cor_quests_17_1_did_tes_send_you_if_e8b818: "是泰斯派你来的吗？如果你想要更多信息，你得自己去找。"
  npc_override_sp_cor_quests_17_1_did_vip_know_about_disap_298c86: "在我推动调查之前，贵宾知道他的员工失踪了吗？"
  npc_override_sp_cor_quests_17_1_did_you_find_cdff47: "你找到了吗？"
  npc_override_sp_cor_quests_17_1_did_you_go_navi_cat_4ba061: "你去<NAVI>[子弹上的猫]<INFO>pub_cat,93,105,0,000,0</INFO></NAVI>了吗？"
  npc_override_sp_cor_quests_17_1_did_you_go_there_yoursel_1c08eb: "你自己去那里了吗？"
  npc_override_sp_cor_quests_17_1_did_you_hear_all_as_165ebe: "你都听到了吗？正如文件所述，他加入企业后从未接到过电话。嗯，我不喜欢看到他们那样，但我必须遵守我的第一个旅游承诺。"
  npc_override_sp_cor_quests_17_1_did_you_hear_s_smart_d9d74f: "你听到了吗？真聪明。"
  npc_override_sp_cor_quests_17_1_did_you_know_vip_there_ea2589: "你认识这位贵宾吗？你的文件里有关于这个的吗？为什么实验室只招收健康的人和你这种人？"
  npc_override_sp_cor_quests_17_1_did_you_see_any_more_475062: "你还看到更多猎心者吗？"
  npc_override_sp_cor_quests_17_1_didn_t_tes_tell_you_e7e87d: "泰斯不是告诉你要采取行动吗？如果你没有准备好，你现在就应该去做。"
  npc_override_sp_cor_quests_17_1_didn_t_you_come_here_7db586: "你不是来这里找黛西的吗？"
  npc_override_sp_cor_quests_17_1_didn_t_you_know_they_e0b123: "你不知道他们有一天可能会给你带来麻烦吗？"
  npc_override_sp_cor_quests_17_1_didn_t_you_say_vice_5d5937: "你不是说雷肯伯的副总裁会去说服他们吗？你想跟我谈什么？"
  npc_override_sp_cor_quests_17_1_didn_t_you_say_we_881685: "你不是说我们要死了吗？"
  npc_override_sp_cor_quests_17_1_didn_t_you_see_navi_fe966d: "你没看到<NAVI>[阿斯]<INFO>sp_cor,135,147,0,101,0</INFO></NAVI>和副总裁一起走了吗？我担心那些受伤的人。"
  npc_override_sp_cor_quests_17_1_dien_having_cup_tea_seco_9ecf58: "迪恩正在二楼她的房间里喝茶。"
  npc_override_sp_cor_quests_17_1_dien_s_room_81ad55: "迪恩的房间？"
  npc_override_sp_cor_quests_17_1_difficult_get_3e02f8: "很难得到它。"
  npc_override_sp_cor_quests_17_1_discovery_century_ahaha_25f388: "这是本世纪的发现。啊哈！"
  npc_override_sp_cor_quests_17_1_dodge_9595e7: "躲开它！"
  npc_override_sp_cor_quests_17_1_doesn_t_even_door_fbb473: "它甚至没有门。"
  npc_override_sp_cor_quests_17_1_doesn_t_make_sense_you_c179d1: "你不觉得有道理吗？如果我不理解某件事，我必须亲眼看看。"
  npc_override_sp_cor_quests_17_1_don_t_change_his_name_6cf370: "不要改变他的名字！"
  npc_override_sp_cor_quests_17_1_don_t_cry_he_ll_171187: "别哭。他很快就会回来的。他很聪明，安妮。"
  npc_override_sp_cor_quests_17_1_don_t_disappointed_95f1e2: "不要失望！"
  npc_override_sp_cor_quests_17_1_don_t_forget_we_senior_532805: "别忘了我们这里有位前辈，所以你必须注意你的行为。"
  npc_override_sp_cor_quests_17_1_don_t_get_too_close_934336: "不要靠得太近。"
  npc_override_sp_cor_quests_17_1_don_t_look_me_like_99b4bc: "别那样看着我。你越穷，你的家庭就越好，我们要是不利用这些人就是傻瓜。至少我当初是那么想的。"
  npc_override_sp_cor_quests_17_1_don_t_move_ca1288: "别动！"
  npc_override_sp_cor_quests_17_1_don_t_put_food_waste_7c2ac8: "不要把食物垃圾放在那里。会发臭的。"
  npc_override_sp_cor_quests_17_1_don_t_take_too_personal_8b6633: "别太往心里去。世界上谁只有一个名字？"
  npc_override_sp_cor_quests_17_1_don_t_worry_about_me_f7c190: "别担心我。"
  npc_override_sp_cor_quests_17_1_don_t_worry_about_tellin_fd99b6: "别担心告诉我你在想什么，我会保密的。"
  npc_override_sp_cor_quests_17_1_don_t_worry_i_belong_c256c7: "别担心，我属于秘密之翼。"
  npc_override_sp_cor_quests_17_1_don_t_worry_s_alright_c80e33: "别担心，没事的。你知道这都是真的。"
  npc_override_sp_cor_quests_17_1_don_t_worry_you_won_57938c: "别担心，你不会死的。"
  npc_override_sp_cor_quests_17_1_don_t_you_go_headquarter_47e060: "你不是要去总部调查吗？"
  npc_override_sp_cor_quests_17_1_don_t_you_know_2b691a: "你不知道吗？"
  npc_override_sp_cor_quests_17_1_don_t_you_know_who_88401e: "你不知道我是谁吗？我是施瓦茨瓦尔德的——不，是整个大陆最伟大的机器学习研究员。我打赌你们都见过我的服务机器人。"
  npc_override_sp_cor_quests_17_1_don_t_you_know_why_4e3752: "你不知道我们为什么被称为反叛者吗？"
  npc_override_sp_cor_quests_17_1_don_t_you_something_else_286c36: "你没有别的事要做吗。"
  npc_override_sp_cor_quests_17_1_don_t_you_think_if_f4ad2c: "你不认为如果企业从一开始就妥善管理，我们现在就不会处于这种情况吗？"
  npc_override_sp_cor_quests_17_1_don_t_you_think_vice_51bbc2: "你不认为副总裁只会跟我们分享^0000CD他想让我们知道的吗？^000000"
  npc_override_sp_cor_quests_17_1_don_t_you_think_we_ae7e3e: "你不认为我们应该在你告诉我们路之后现在就出发吗？"
  npc_override_sp_cor_quests_17_1_don_t_you_want_clear_ae1450: "你不想澄清他们的怀疑吗？获得他们的合作，了解你后院有什么？"
  npc_override_sp_cor_quests_17_1_drinks_come_over_there_bb0071: "饮料从那边来。"
  npc_override_sp_cor_quests_17_1_due_expansion_we_ve_been_1ca2f0: "由于这次扩张，我们得以在艾音布罗克建立新基地。"
  npc_override_sp_cor_quests_17_1_dungeon_created_yet_chec_14cc01: "地牢尚未创建。请再检查。"
  npc_override_sp_cor_quests_17_1_dungeon_yet_created_let_f69706: "地牢尚未创建。让我再检查一次。"
  npc_override_sp_cor_quests_17_1_easier_if_we_destroy_sou_fd943e: "如果我们能摧毁源头会更容易。但上面的人不会批准，所以我们不得不开始二次搜索。"
  npc_override_sp_cor_quests_17_1_economical_course_s_econ_f077a6: "经济？当然经济。我也喜欢经济。那么，我可以按自己的条件经济地做这件事吗？对吧？"
  npc_override_sp_cor_quests_17_1_eh_course_s_important_ef8fdf: "嗯？当然那很重要！"
  npc_override_sp_cor_quests_17_1_eh_i_really_like_person_990096: "嗯……我真的很喜欢这个人！他是少数有头脑的人之一！"
  npc_override_sp_cor_quests_17_1_eh_lazy_where_you_going_f1137b: "嗯？莱兹？你要去哪里！"
  npc_override_sp_cor_quests_17_1_eh_why_adventurer_if_you_39e6ee: "嗯？为什么冒险者？如果你一起来，那你就可以做所有有趣的部分……！"
  npc_override_sp_cor_quests_17_1_eheh_so_i_m_just_9ef1b4: "呵呵。所以我就只能在这里等死了。我想用我的研究震惊世界，但我最终却住在这里。"
  npc_override_sp_cor_quests_17_1_elena_volkova_organizing_f9e99d: "艾莲娜·沃尔科娃正在组织一支侦察队，调查可疑区域。"
  npc_override_sp_cor_quests_17_1_elite_members_usu_other_4a4f14: "USU的精英成员和其他反叛者部队已被选中，我将担任他们的指挥官。其余的反叛者将封锁所有通往科尔入口。"
  npc_override_sp_cor_quests_17_1_elyumina_3df919: "艾露米娜？"
  npc_override_sp_cor_quests_17_1_elyumina_doesn_t_know_ho_cce327: "艾露米娜不知道宅邸内部是什么样子"
  npc_override_sp_cor_quests_17_1_elyumina_doesn_t_seem_kn_6f14e0: "不过，艾露米娜似乎对他的团队了解不多。"
  npc_override_sp_cor_quests_17_1_elyumina_said_somehow_de_b4e95a: "艾露米娜说，不知何故，从内部封印它的装置坏了。"
  npc_override_sp_cor_quests_17_1_elyumina_should_also_cha_d6e0cf: "艾露米娜暂时也应该在这里负责。"
  npc_override_sp_cor_quests_17_1_employees_list_assigned_d0f745: "名单上的员工被分配到另一个工作站，并且他们在不断轮换。"
  npc_override_sp_cor_quests_17_1_enough_time_passed_our_c_bb2cd2: "我们的庄稼又需要照料了。你能再帮我们一次吗？"
  npc_override_sp_cor_quests_17_1_entrance_lab_double_lock_7f93a0: "实验室的入口有双重锁。"
  npc_override_sp_cor_quests_17_1_entrance_secured_oscar_w_935d92: "入口由站在前门的奥斯卡保护。"
  npc_override_sp_cor_quests_17_1_erm_we_re_still_investig_26f46b: "嗯，我们这边还在调查，冒险者。"
  npc_override_sp_cor_quests_17_1_err_then_0dd2ad: "呃，那么……"
  npc_override_sp_cor_quests_17_1_est_also_there_you_ll_fa3854: "艾斯特也会在那里，你很容易就能找到位置。"
  npc_override_sp_cor_quests_17_1_est_came_back_first_i_9602fe: "艾斯特先回来了，我不确定你发生了什么事。"
  npc_override_sp_cor_quests_17_1_eva_i_want_see_eva_965d52: "伊娃，我想再见伊娃。她忘了我吗？我已经好几年没能联系她了。"
  npc_override_sp_cor_quests_17_1_evacuation_process_alrea_f5be43: "疏散过程已经开始，将平民和总统的小士兵移出该区域。"
  npc_override_sp_cor_quests_17_1_even_if_everything_looks_f029e5: "即使表面上一切看起来都很好，内部却有很多谎言。我被欺骗了。"
  npc_override_sp_cor_quests_17_1_even_if_i_received_treat_ee5d41: "即使我接受了治疗，我也没有生存的机会。我很清楚这一点。对我来说，没有人在身边安静地生活在这里不是最好的吗？"
  npc_override_sp_cor_quests_17_1_even_if_marcus_s_thought_8df0b0: "即使马库斯对我的想法改变了，他也不止一个人！"
  npc_override_sp_cor_quests_17_1_even_if_she_s_little_e416c3: "即使她有时有点吵，我也理解。我今天和工厂经理开了个玩笑就被解雇了。"
  npc_override_sp_cor_quests_17_1_even_if_there_someone_in_152e70: "即使有人把莱兹介绍为屎，你会一辈子都把他当成屎吗？"
  npc_override_sp_cor_quests_17_1_even_if_you_come_people_95a4b3: "即使你和2个人一起来……"
  npc_override_sp_cor_quests_17_1_even_so_really_going_eno_e4c8cd: "即使如此，那真的足够吗？"
  npc_override_sp_cor_quests_17_1_even_so_we_might_we_c7a7d0: "即使如此，我们可能不得不这样做。我们分成两队，一队阻止他们追击，其余的人进入并继续调查。"
  npc_override_sp_cor_quests_17_1_even_though_i_live_einbr_2b25e9: "即使我住在艾音布罗克，"
  npc_override_sp_cor_quests_17_1_even_though_i_m_acquaint_7d58fb: "即使我熟悉这些信息，深入企业内部也是不可能的。"
  npc_override_sp_cor_quests_17_1_even_though_i_m_very_5bcf9b: "即使我是一个非常有才华的人，我也必须优先考虑自己的安全。"
  npc_override_sp_cor_quests_17_1_even_though_i_opened_i_2c1702: "即使我打开了它，我也不打算一直开着门。"
  npc_override_sp_cor_quests_17_1_even_though_we_suppresse_757261: "即使我们在第一次歼灭行动中压制了敌人，但变种人又开始爬出来了。"
  npc_override_sp_cor_quests_17_1_everyone_alright_6b59d6: "大家都还好吗？"
  npc_override_sp_cor_quests_17_1_everyone_else_better_rig_a15c21: "其他所有人都有更好的王位继承权，他们天生就有资格。"
  npc_override_sp_cor_quests_17_1_everyone_else_you_know_w_5a0f9e: "其他人，你们知道该怎么做，对吧？"
  npc_override_sp_cor_quests_17_1_everyone_formation_0ee6f6: "所有人，列阵！"
  npc_override_sp_cor_quests_17_1_everyone_get_back_s_dang_afa36f: "所有人后退！危险！"
  npc_override_sp_cor_quests_17_1_everyone_let_s_go_back_048c9d: "大家，我们回<NAVI>[子弹上的猫]<INFO>pub_cat,93,105,0,000,0</INFO></NAVI>吧~"
  npc_override_sp_cor_quests_17_1_everyone_please_come_out_ea7a5c: "大家，请出来。"
  npc_override_sp_cor_quests_17_1_everything_here_mine_i_w_a7f5e4: "这里的一切都是我的！我不会让你伤害我的朋友们！我不是在开玩笑！"
  npc_override_sp_cor_quests_17_1_everything_i_ve_heard_sa_2a575a: "我所听到和看到的一切……我感觉好像有一个看不见的人在操纵一切。这不是我认为可能发生的场景。"
  npc_override_sp_cor_quests_17_1_everytime_if_you_only_dr_6c3193: "每次。如果你只喝酒，你会变成一条狗。啧啧。"
  npc_override_sp_cor_quests_17_1_exact_same_treatment_huh_c3dde2: "完全一样的待遇，对吧？"
  npc_override_sp_cor_quests_17_1_exactly_means_these_peop_b22cab: "正是！那意味着这些人做了坏事？雷肯伯的高层难道要进来拿走我们科学家的研究成果？"
  npc_override_sp_cor_quests_17_1_explanation_849b54: "解释？"
  npc_override_sp_cor_quests_17_1_facility_doing_illegal_e_01774e: "这个设施正在进行政府和雷肯伯严格禁止的非法实验。"
  npc_override_sp_cor_quests_17_1_facility_maintenance_dep_4e4cdd: "它曾是设施维护部门，我告诉过他们事情不应该是那样运作的。"
  npc_override_sp_cor_quests_17_1_facility_maintenance_dep_ad50a0: "设施维护部门，跟我来！"
  npc_override_sp_cor_quests_17_1_facility_maintenance_dep_eced0e: "设施维护部门……"
  npc_override_sp_cor_quests_17_1_family_pride_huh_isn_t_6c0b24: "家族骄傲~嗯，那不是很好吗。"
  npc_override_sp_cor_quests_17_1_far_einbroch_railway_sta_326683: "离艾音布罗克火车站不远……有一个叫<NAVI>[子弹上的猫]<INFO>einbroch,302,329,0,101,0</INFO></NAVI>的小酒吧，下一次行动将在那里进行。"
  npc_override_sp_cor_quests_17_1_feeling_something_valuab_308348: "珍贵之物的感觉！"
  npc_override_sp_cor_quests_17_1_feels_good_smell_books_h_ec0fff: "在这里闻到书的味道感觉很好。我的梦想是成为一名图书管理员。我应该从现在开始那样做。"
  npc_override_sp_cor_quests_17_1_finally_i_ve_got_my_d0a909: "终于，我有机会发光了！"
  npc_override_sp_cor_quests_17_1_finally_s_time_lucky_roo_c0c095: "终于，幸运新手发光的时候到了。哦，等不及了！"
  npc_override_sp_cor_quests_17_1_finally_we_show_world_wh_a309bc: "终于，我们可以向世界展示我们的能力了！"
  npc_override_sp_cor_quests_17_1_first_327447: "首先……"
  npc_override_sp_cor_quests_17_1_first_class_last_time_we_b4cb37: "一等舱？上次我们旅行……"
  npc_override_sp_cor_quests_17_1_first_i_ll_tell_you_0ace9a: "首先，我告诉你去哪里。"
  npc_override_sp_cor_quests_17_1_first_i_thought_wall_mea_f810b5: "起初我以为这堵墙是为了分隔冶炼厂和矿井……"
  npc_override_sp_cor_quests_17_1_first_please_least_minim_d80559: "首先，请至少保持^0000CD最低限度的礼貌。^000000"
  npc_override_sp_cor_quests_17_1_first_time_i_ve_seen_63328f: "这是我第一次看到它。"
  npc_override_sp_cor_quests_17_1_first_try_look_around_tr_8d11f8: "首先，试着在这次旅行中四处看看。看看你感觉如何。"
  npc_override_sp_cor_quests_17_1_first_you_could_decide_s_629135: "首先，你可以选择固执"
  npc_override_sp_cor_quests_17_1_future_please_call_me_la_abcce3: "以后，请叫我莱兹。改天再跟我一起去冒险吧。偶尔来朱诺。"
  npc_override_sp_cor_quests_17_1_gah_you_fools_stop_manha_4fee40: "嘎，你们这些傻瓜！别粗暴地对我！我的身体很珍贵！我比你们这些肌肉脑袋加起来都更有价值！"
  npc_override_sp_cor_quests_17_1_gate_you_re_about_enter_9cccec: "你即将进入的门……我们称它为入口，但它实际上是出口。"
  npc_override_sp_cor_quests_17_1_gentlemen_please_don_t_w_370c5c: "先生们，请不要这样做。我们不是来这里伤害你们的。"
  npc_override_sp_cor_quests_17_1_get_out_now_rekenber_s_a76219: "现在出去！这是雷肯伯的实验室！你在擅闯私人财产！"
  npc_override_sp_cor_quests_17_1_go_ahead_enter_mansion_t_d83b6d: "继续通过这条下水道进入宅邸。"
  npc_override_sp_cor_quests_17_1_go_navi_document_storage_f0c696: "去<NAVI>[文件储存室]<INFO>lhz_in01,32,264,0,000,0</INFO></NAVI>，在别人注意到你之前快点去。"
  npc_override_sp_cor_quests_17_1_go_spin_again_332242: "再去转一次！"
  npc_override_sp_cor_quests_17_1_goni_you_serious_ooh_i_57a4c3: "戈尼，你是认真的吗？哦，我明白了。有意思……"
  npc_override_sp_cor_quests_17_1_good_afternoon_we_want_a_9250c5: "下午好。我们想问你几个问题。"
  npc_override_sp_cor_quests_17_1_good_day_63801e: "祝你今天愉快！"
  npc_override_sp_cor_quests_17_1_good_i_don_t_regret_e3d2a2: "这很好，我今天起床不后悔！"
  npc_override_sp_cor_quests_17_1_good_job_everyone_ho_ho_0df66a: "干得好，大家！呵呵！你们，我知道我可以信任你们！"
  npc_override_sp_cor_quests_17_1_good_let_s_forget_about_f713b4: "很好。让我们忘记过去的冲突，专注于未来。谢谢你，副总裁。"
  npc_override_sp_cor_quests_17_1_good_luck_8e30d6: "祝你好运！"
  npc_override_sp_cor_quests_17_1_good_morning_now_vip_s_8d70e2: "早上好~从现在开始，贵宾们，我们要弄清楚帕特从工作到雷肯伯再到现在的工作历程~和莱兹以及他的团队一起~"
  npc_override_sp_cor_quests_17_1_good_we_continue_our_inv_d4ca54: "很好。我们现在可以继续调查了。副总裁，请把文件给我。"
  npc_override_sp_cor_quests_17_1_goodnight_i_ll_fine_wher_e8f4e8: "晚安，无论我去哪里我都会很好。"
  npc_override_sp_cor_quests_17_1_gosh_mom_dad_thank_you_bd09b0: "天哪！妈妈，爸爸！谢谢你们！所以你们甚至不能联系他，你们不好奇他发生了什么事吗？我敢肯定你们好奇。"
  npc_override_sp_cor_quests_17_1_government_just_now_real_f7ac06: "政府刚刚意识到这个问题。那和失踪人员之间肯定有联系。这就是为什么我决定进一步调查。"
  npc_override_sp_cor_quests_17_1_grapes_please_green_bean_c9aafe: "葡萄请{0}。青豆请{1}。南瓜请{2}。"
  npc_override_sp_cor_quests_17_1_grapes_please_green_bean_dd1a66: "葡萄请{0}。青豆请{1}。南瓜请{2}。既然你知道流程，我就不多说了。"
  npc_override_sp_cor_quests_17_1_grapes_you_green_beans_p_ebac4e: "葡萄你需要{0}。青豆{1}。南瓜{2}。"
  npc_override_sp_cor_quests_17_1_great_f9a621: "太棒了……"
  npc_override_sp_cor_quests_17_1_great_if_those_guys_went_48ece8: "如果那些家伙出了屏障就好了。"
  npc_override_sp_cor_quests_17_1_great_mansion_left_great_9061b5: "去伟大的贤者们留下的伟大宅邸？"
  npc_override_sp_cor_quests_17_1_guard_you_tired_compared_ab1587: "守卫，你累了吗？与朱诺相比，里希塔乐镇是个小村庄。"
  npc_override_sp_cor_quests_17_1_guards_wearing_new_unifo_1e745d: "穿着新制服跟随施莱因的守卫，可能不全是猎心者。"
  npc_override_sp_cor_quests_17_1_guy_really_vice_presiden_481697: "这家伙真的是副总裁吗？"
  npc_override_sp_cor_quests_17_1_guy_what_he_thinking_702cb5: "这家伙，他在想什么？"
  npc_override_sp_cor_quests_17_1_hah_ah_why_did_i_bb0bdf: "哈啊！！我为什么要说那个？！都怪我的嘴！！我妈妈一直很好！对我！！"
  npc_override_sp_cor_quests_17_1_hah_guy_he_s_still_7001af: "哈，这家伙，他还在讲隐私。统计数据和概率不是经济的一部分吗？为什么这些人走了就再也不联系家里？"
  npc_override_sp_cor_quests_17_1_hah_hah_he_s_so_d8bd49: "哈哈。他太可爱了。"
  npc_override_sp_cor_quests_17_1_hah_s_s_spirit_type_50c216: "哈！就是这样，就是这种精神。日复一日的那种！你永远不会允许你的朋友就这样失踪。你的性格拯救了我们的守卫，至少目前是这样。"
  npc_override_sp_cor_quests_17_1_hand_over_picture_a2d74b: "交出照片"
  npc_override_sp_cor_quests_17_1_hasn_t_been_long_since_78bb28: "我们认识还没多久，你就已经开始对我发号施令了。"
  npc_override_sp_cor_quests_17_1_he_asked_me_if_i_66d337: "他问我是否想变得更强。如果我接受了他的提议，我也会成为猎心者。"
  npc_override_sp_cor_quests_17_1_he_had_almost_zero_conta_47a487: "他与公司几乎零接触。他从幻景获得资金以换取他的研究成果。这就是为什么他不在名单上。"
  npc_override_sp_cor_quests_17_1_he_knows_illusion_better_e6f6a0: "他比我们都更了解幻景。我们不能失去他。"
  npc_override_sp_cor_quests_17_1_he_look_like_vice_presid_ec430f: "不过他看起来确实像副总裁。"
  npc_override_sp_cor_quests_17_1_he_moved_another_rekenbe_35ce34: "5个月后，他被调到另一个雷肯伯设施，之后就没有记录了。"
  npc_override_sp_cor_quests_17_1_he_s_logistic_guy_86267f: "他是后勤人员。"
  npc_override_sp_cor_quests_17_1_he_s_probably_vacation_t_12bebe: "他可能在度假！谢谢你给我介绍工作！"
  npc_override_sp_cor_quests_17_1_he_s_somewhere_here_pub_2e7bb7: "他就在这家酒吧的某个地方，去找他吧。"
  npc_override_sp_cor_quests_17_1_he_s_vice_president_he_b15ac0: "他是副总裁。他关系很好。"
  npc_override_sp_cor_quests_17_1_he_working_as_part_facil_c3cf62: "他曾是设施维护部门的一员，然后被调到一个新设施。"
  npc_override_sp_cor_quests_17_1_he_your_vice_president_cf7753: "他是你们的副总裁。"
  npc_override_sp_cor_quests_17_1_head_safe_location_hurry_d8d1bf: "前往安全地点，快点！"
  npc_override_sp_cor_quests_17_1_heart_hunters_bellares_s_448af5: "猎心者贝拉雷斯和萨纳雷斯与我们以前遇到的不同。"
  npc_override_sp_cor_quests_17_1_heeey_mom_don_t_fight_7143f6: "嘿嘿~妈妈，别和爸爸吵架。"
  npc_override_sp_cor_quests_17_1_hehe_7808fc: "呵呵？……"
  npc_override_sp_cor_quests_17_1_hehe_right_so_me_aas_7f316d: "呵呵。对。所以我和阿斯先走。"
  npc_override_sp_cor_quests_17_1_hello_69342c: "你好！"
  npc_override_sp_cor_quests_17_1_hello_adventurer_330a38: "你好冒险者！"
  npc_override_sp_cor_quests_17_1_hello_document_storage_r_1baa6d: "你好，这是文件储存室。"
  npc_override_sp_cor_quests_17_1_hello_everyone_i_m_kaya_a28064: "大家好，我是卡亚·托斯，雷肯伯的副总裁。"
  npc_override_sp_cor_quests_17_1_hello_everyone_my_name_t_b4404c: "大家好。我叫泰斯，来自施瓦茨总统办公室。"
  npc_override_sp_cor_quests_17_1_hello_him_90b9f6: "你好~是他吗？"
  npc_override_sp_cor_quests_17_1_hello_how_may_i_help_f78c6a: "你好，有什么可以帮你的吗？"
  npc_override_sp_cor_quests_17_1_hello_i_don_t_really_e633bc: "你好~我真的不知道从哪里开始……谢谢你收留了我的儿子，我的家人不再担心没有足够的食物来生存了。谢谢，谢谢。"
  npc_override_sp_cor_quests_17_1_hello_i_m_back_everythin_4ead79: "你好。我回来了，一切都好吗？"
  npc_override_sp_cor_quests_17_1_hello_i_m_just_tourist_75e4c1: "你好~我只是个导游，怎么能给你下命令呢。判断由贵宾的智力、推理和良心来完成~"
  npc_override_sp_cor_quests_17_1_hello_med_i_ve_been_e6b9c8: "你好，梅德。我一直期待再次见到你。"
  npc_override_sp_cor_quests_17_1_hello_okay_you_re_busy_fd18ae: "你好。好吧，你太忙了以至于不知道有人死了？那发生了什么？你不觉得这是件大事吗？"
  npc_override_sp_cor_quests_17_1_hello_there_i_m_called_93d92d: "你好。我叫格雷·厄尔。"
  npc_override_sp_cor_quests_17_1_hello_you_going_rudus_9643ab: "你好，你要去鲁达斯吗？"
  npc_override_sp_cor_quests_17_1_hello_you_need_anything_13c7e1: "你好。你需要什么吗？"
  npc_override_sp_cor_quests_17_1_hello_you_re_back_alread_65f3b6: "你好，你已经回来了吗冒险者？有什么事吗？你需要什么吗？"
  npc_override_sp_cor_quests_17_1_help_a92107: "帮助。"
  npc_override_sp_cor_quests_17_1_her_fiance_hired_rekenbe_d4f218: "她的未婚夫被雷肯伯雇用，然后她就再也联系不上他了。当然，她试图联系公司并询问发生了什么，但他们告诉她什么？"
  npc_override_sp_cor_quests_17_1_here_come_here_come_over_376e56: "来，过来。就在这里，过来这里。"
  npc_override_sp_cor_quests_17_1_here_i_choose_one_what_39feba: "来，我选那个。我们接下来做什么？"
  npc_override_sp_cor_quests_17_1_here_job_application_88bc1e: "来，工作申请……"
  npc_override_sp_cor_quests_17_1_here_lighthalzen_downtow_aa2428: "在里希塔乐镇，市中心和贫民窟共存。两边的结构使得从一边到另一边穿过铁路变得困难。"
  npc_override_sp_cor_quests_17_1_here_stand_line_please_m_41923d: "来，请排队。排成三排。轮到你时请告诉我你的全名。"
  npc_override_sp_cor_quests_17_1_here_we_sector_section_e_762128: "我们到了，艾音布罗克山脉01区-95-146段。"
  npc_override_sp_cor_quests_17_1_hey_adventurer_why_didn_9bdc45: "嘿，冒险者。你怎么没告诉我你按我说的做了？我差点又问你一遍。"
  npc_override_sp_cor_quests_17_1_hey_don_t_come_any_5d8883: "嘿，别再靠近了。这些是受污染的物品。小心。"
  npc_override_sp_cor_quests_17_1_hey_don_t_say_bc650f: "嘿，别那么说。"
  npc_override_sp_cor_quests_17_1_hey_eva_hello_come_over_9ba043: "嘿伊娃！你好！过来这里，过来这里！"
  npc_override_sp_cor_quests_17_1_hey_hot_blooded_captain_8a98e1: "嘿，那边热血的队长。"
  npc_override_sp_cor_quests_17_1_hey_i_m_official_duty_5e956f: "嘿！！我现在在执行公务！我也要坐一等舱。"
  npc_override_sp_cor_quests_17_1_hey_i_worried_about_all_2be6b2: "嘿，我一直在担心这一切！"
  npc_override_sp_cor_quests_17_1_hey_sammy_could_i_ask_f57f73: "嘿，萨米。我能问你几个问题吗？"
  npc_override_sp_cor_quests_17_1_hey_so_you_found_watchto_4f8322: "嘿……所以你找到了一个瞭望塔和小洞？"
  npc_override_sp_cor_quests_17_1_hey_take_easy_you_re_1fda4a: "……嘿，放轻松。你没有资格要求任何东西。"
  npc_override_sp_cor_quests_17_1_hey_tes_8e21ce: "嘿~泰斯！"
  npc_override_sp_cor_quests_17_1_hey_what_about_me_768d5a: "嘿，那我呢！"
  npc_override_sp_cor_quests_17_1_hey_what_hell_commotion_077971: "嘿，这到底是怎么回事？"
  npc_override_sp_cor_quests_17_1_hey_what_s_going_here_996d03: "嘿！这里发生了什么事？"
  npc_override_sp_cor_quests_17_1_hey_where_you_going_a3ebb6: "嘿，你要去哪里！"
  npc_override_sp_cor_quests_17_1_hey_you_busy_96e634: "嘿，你忙吗？"
  npc_override_sp_cor_quests_17_1_hey_you_re_there_already_07b5fd: "嘿，你已经在那里了。怎么样？你用自己的双眼发现了什么？"
  npc_override_sp_cor_quests_17_1_hey_you_seen_my_cart_755a62: "嘿，你今天看到我的手推车了吗？"
  npc_override_sp_cor_quests_17_1_heyo_there_you_mom_dad_908479: "嘿哟！你在这里。妈妈，爸爸，你们好吗？"
  npc_override_sp_cor_quests_17_1_hi_what_i_you_31a2cf: "嗨，有什么可以帮你的吗？"
  npc_override_sp_cor_quests_17_1_hick_297c47: "……嗝……"
  npc_override_sp_cor_quests_17_1_his_group_called_illusio_d2dceb: "他的团队被称为^0000CD幻景^000000，由^0000CD雷根舒姆的前成员^000000组成。"
  npc_override_sp_cor_quests_17_1_his_stiffness_stronger_t_5b7491: "他的僵硬比竹子还强。他太僵硬了，膝盖都弯不了。"
  npc_override_sp_cor_quests_17_1_hm_5ea458: "嗯……"
  npc_override_sp_cor_quests_17_1_hm_i_think_we_need_0c28b6: "嗯？我认为我们需要清理该区域的猎心者。"
  npc_override_sp_cor_quests_17_1_hmm_691ebb: "嗯！"
  npc_override_sp_cor_quests_17_1_hmm_excuse_me_0773e0: "嗯。打扰一下。"
  npc_override_sp_cor_quests_17_1_hmm_i_don_t_any_486935: "嗯……我对此没有异议。"
  npc_override_sp_cor_quests_17_1_hmm_part_investigation_s_457cea: "嗯……那部分调查还需要更多清晰度。"
  npc_override_sp_cor_quests_17_1_hmm_so_you_ve_found_d1fe47: "嗯，所以你在封闭矿井的屏障里发现了，后面有怪物？"
  npc_override_sp_cor_quests_17_1_hmm_some_reason_i_feel_9f9c8a: "……嗯，不知为何，我感觉自己总是在扮演守门人的角色？"
  npc_override_sp_cor_quests_17_1_hmm_there_many_overlap_n_202487: "嗯……两个名单上有很多重叠的名字。我预料到了……但我很困惑。"
  npc_override_sp_cor_quests_17_1_hmm_well_i_guess_we_d654e5: "嗯……好吧，我想我们需要留一些了解这个地方的人在这里。好吧，我决定了。"
  npc_override_sp_cor_quests_17_1_hmmm_775f8a: "嗯嗯。"
  npc_override_sp_cor_quests_17_1_hmmm_i_won_t_able_0c6041: "嗯嗯……我不能轻易下结论，让我们花点时间讨论一下。"
  npc_override_sp_cor_quests_17_1_hmpf_you_probably_didn_t_f128df: "哼，你可能甚至不知道他们是服务机器人。"
  npc_override_sp_cor_quests_17_1_hobby_yours_provoke_othe_0a3964: "挑衅别人是你的爱好吗？"
  npc_override_sp_cor_quests_17_1_hold_edcfe3: "等一下！"
  npc_override_sp_cor_quests_17_1_hooligan_who_detained_me_9759e1: "那天拘留我的那个流氓也不够。和其他冒险者组成队伍再来，好吗？"
  npc_override_sp_cor_quests_17_1_hooray_finally_some_air_26954a: "万岁，终于有新鲜空气了，嗯。"
  npc_override_sp_cor_quests_17_1_how_about_then_why_don_bd7621: "那这样怎么样？你们两个互不信任的人，为什么不一起去亲眼看看？"
  npc_override_sp_cor_quests_17_1_how_about_we_save_some_b1e01a: "我们何不节省点时间，之后再分享信息？我们分开行动，然后在特定地点再见面。"
  npc_override_sp_cor_quests_17_1_how_about_we_start_somet_329180: "我们何不从一个稍微简单一点的开始，如何以不同的方式开始这次调查？我们让贵宾来选择。"
  npc_override_sp_cor_quests_17_1_how_about_you_guard_e23f70: "你呢，守卫？"
  npc_override_sp_cor_quests_17_1_how_deeply_did_you_inves_51bdeb: "你对企业调查得有多深？"
  npc_override_sp_cor_quests_17_1_how_did_you_know_3dbb46: "你怎么知道的？"
  npc_override_sp_cor_quests_17_1_how_heart_hunters_come_b_51522f: "猎心者怎么回来得这么快？"
  npc_override_sp_cor_quests_17_1_how_hell_you_become_gove_4ba198: "没有军队你怎么能成为政府？"
  npc_override_sp_cor_quests_17_1_how_his_vacations_did_he_bae9e4: "他的假期怎么样？他休息得好吗？"
  npc_override_sp_cor_quests_17_1_how_long_should_i_chop_99009e: "我要砍多久的木头？我不能直接砍掉吗？"
  npc_override_sp_cor_quests_17_1_how_many_discarded_peopl_d70047: "你认为你会在这里找到多少被丢弃的人？"
  npc_override_sp_cor_quests_17_1_how_many_researcher_like_38e3ee: "有多少研究员像我们一样！"
  npc_override_sp_cor_quests_17_1_how_researchers_handle_g_5c6b30: "研究员们怎么处理垃圾？"
  npc_override_sp_cor_quests_17_1_how_they_call_themselves_0bc8c1: "如果他们连垃圾都不能扔到正确的地方，他们怎么能称自己为真正的人。也许山里留下了很多堆积物。"
  npc_override_sp_cor_quests_17_1_how_we_doing_221976: "我们该怎么做？"
  npc_override_sp_cor_quests_17_1_how_you_doing_lately_b88179: "你最近怎么样？"
  npc_override_sp_cor_quests_17_1_how_you_feeling_today_i_362284: "你今天感觉怎么样？我可以根据你的心情给你推荐一杯饮料。"
  npc_override_sp_cor_quests_17_1_how_you_find_anything_su_e6e6b3: "在这么大的地方你怎么找到任何东西？没有人可以问。"
  npc_override_sp_cor_quests_17_1_how_you_know_26163e: "你怎么知道？"
  npc_override_sp_cor_quests_17_1_how_you_want_investigate_afddd5: "只有这么少的人，你想怎么调查这么多人？"
  npc_override_sp_cor_quests_17_1_however_everything_going_f20533: "然而，并非一切都如预期。"
  npc_override_sp_cor_quests_17_1_however_i_hadn_t_realize_d6924f: "然而，我没有意识到这些腐烂的人在政治上如此根深蒂固。"
  npc_override_sp_cor_quests_17_1_huh_80ee84: "嗯……"
  npc_override_sp_cor_quests_17_1_huh_d911b6: "会的。嗯。"
  npc_override_sp_cor_quests_17_1_huh_did_you_rest_well_175c69: "嗯~你休息得好吗？"
  npc_override_sp_cor_quests_17_1_huh_huwah_8c23cf: "嗯！！呼哇！"
  npc_override_sp_cor_quests_17_1_huh_i_breathe_now_how_8b2808: "嗯……我现在能呼吸了。我看起来多大？别因为我比你想象的年轻就叫我爷爷。"
  npc_override_sp_cor_quests_17_1_huh_i_don_t_want_c921f1: "嗯……我不想洗这些东西，呃……里面好像烧焦了。"
  npc_override_sp_cor_quests_17_1_huh_i_know_him_indeed_55aadb: "嗯？我认识他！那确实是卡亚，副总裁。"
  npc_override_sp_cor_quests_17_1_huh_i_m_really_tired_f3febe: "嗯，我真的累了。如果不是为了钱，我不会做这些。"
  npc_override_sp_cor_quests_17_1_huh_s_so_hard_match_b23e39: "嗯，和年轻人配合太难了。"
  npc_override_sp_cor_quests_17_1_huh_senior_researcher_c4539e: "嗯，高级研究员？"
  npc_override_sp_cor_quests_17_1_huh_surprisingly_i_told_a65333: "嗯。出乎意料，我告诉你了很多。我应该休息了。"
  npc_override_sp_cor_quests_17_1_huh_uh_d55080: "嗯……呃……"
  npc_override_sp_cor_quests_17_1_huh_waaaaa_cde10b: "嗯！！哇啊啊！！"
  npc_override_sp_cor_quests_17_1_huh_you_know_garbage_imp_f63ba5: "嗯……你知道……垃圾……是一项重要的工作……"
  npc_override_sp_cor_quests_17_1_i_accompany_you_actively_072554: "^0000CD我会陪同你并积极合作。^000000"
  npc_override_sp_cor_quests_17_1_i_agree_68dfb2: "我同意！"
  npc_override_sp_cor_quests_17_1_i_agree_we_act_quickly_d5c3d5: "我同意，但我们必须迅速行动。"
  npc_override_sp_cor_quests_17_1_i_agree_your_assessment_26925b: "我同意你的评估。"
  npc_override_sp_cor_quests_17_1_i_already_told_you_befor_e2d0be: "我之前已经告诉过你了，不是吗？副总裁记忆力不好吗？"
  npc_override_sp_cor_quests_17_1_i_already_told_you_i_be6a5f: "我已经告诉过你了！我没有撒谎。"
  npc_override_sp_cor_quests_17_1_i_always_hide_yuno_s_220139: "我总是躲在朱诺的餐馆里~"
  npc_override_sp_cor_quests_17_1_i_am_touched_right_now_692f7f: "我现在很感动，眼里含着泪水。"
  npc_override_sp_cor_quests_17_1_i_analyze_along_other_ma_22b146: "我会和其他材料一起分析这个。"
  npc_override_sp_cor_quests_17_1_i_analyze_data_everyone_2bc580: "我必须分析大家给我的数据，它堆积如山。"
  npc_override_sp_cor_quests_17_1_i_believe_president_rela_39c941: "我相信总统与政府和企业有关系。所以他们必须仔细考虑这些事情。"
  npc_override_sp_cor_quests_17_1_i_believe_relationship_b_0119c2: "我相信我们两国之间的关系将因我们的努力而在未来得到维持。"
  npc_override_sp_cor_quests_17_1_i_born_talk_about_who_9de71d: "我生来就是为了谈论它，但你在说谁？"
  npc_override_sp_cor_quests_17_1_i_bracelet_70fae0: "我有……这个手镯。"
  npc_override_sp_cor_quests_17_1_i_came_here_because_i_1da14a: "我来这里是为了表达我的感激之情。"
  npc_override_sp_cor_quests_17_1_i_came_here_very_high_93a164: "我和你儿子公司的一位非常^0000FF重要^000000成员一起来到这里。我那天告诉过你什么？他来看看那些雇用了特殊人才的家庭的福利。"
  npc_override_sp_cor_quests_17_1_i_came_out_see_what_7c1fe8: "我出来看看那是什么骚动，发生了什么事？！"
  npc_override_sp_cor_quests_17_1_i_carry_waste_materials_1381bf: "我运送废料和实验室设备。"
  npc_override_sp_cor_quests_17_1_i_caught_aphids_grapevin_c1f092: "我在葡萄藤上抓到了蚜虫。"
  npc_override_sp_cor_quests_17_1_i_caught_aphids_green_be_63512d: "我在青豆茎上抓到了蚜虫。"
  npc_override_sp_cor_quests_17_1_i_caught_aphids_pumpkin_c45da3: "我在南瓜藤上抓到了蚜虫。"
  npc_override_sp_cor_quests_17_1_i_charge_regenschirm_i_v_2c1e29: "我负责雷根舒姆，但我从未见过帕特里克·考夫曼。"
  npc_override_sp_cor_quests_17_1_i_cooperate_one_time_onl_f940ae: "我只合作这一次，好吗？"
  npc_override_sp_cor_quests_17_1_i_could_given_you_my_e7e7a2: "我本可以把我的美丽机械身体给你们，这样你们就可以永远保存你们辛勤积累的知识。"
  npc_override_sp_cor_quests_17_1_i_couldn_t_send_letters_271359: "我不能寄信。我也无法联系外界，我也出不去。这是这里的规则。"
  npc_override_sp_cor_quests_17_1_i_d_like_know_where_409b15: "我想知道帕特里克·考夫曼在哪里。他是一名被派往这里的设施维护员工。"
  npc_override_sp_cor_quests_17_1_i_d_love_go_too_b05098: "我也想去，但米娜不让我。我想是因为他关心。"
  npc_override_sp_cor_quests_17_1_i_decided_go_along_adven_cb1fc0: "我决定按照冒险者的建议进行新的调查。但我不知道我是否做出了正确的选择。"
  npc_override_sp_cor_quests_17_1_i_didn_t_come_you_4bd1a6: "我不是为了那个来的。你见过一个叫帕特里克·考夫曼的设施维护员工吗？他现在在哪里？"
  npc_override_sp_cor_quests_17_1_i_didn_t_know_hah_4fb948: "我不知道那个！哈……"
  npc_override_sp_cor_quests_17_1_i_didn_t_know_rekenber_d8d0ea: "我不知道雷肯伯是如此宗教化的团体。"
  npc_override_sp_cor_quests_17_1_i_didn_t_mean_cover_ce2ef9: "我不是故意隐瞒什么，这只是我听到的。其他人都去<NAVI>[办公室]<INFO>lhz_in01,80,210,0,000,0</INFO></NAVI>了吗？"
  npc_override_sp_cor_quests_17_1_i_didn_t_think_we_ff8a93: "我没想到我们会再次和这些人成为朋友。"
  npc_override_sp_cor_quests_17_1_i_digged_bracelet_buried_8bbda6: "我在一堆垃圾里挖到了一个手镯。这似乎是一个实验的身份识别手镯。上面写着……帕特……帕特里克……考夫……曼。"
  npc_override_sp_cor_quests_17_1_i_don_t_authority_create_8ae617: "我没有权力创建和发展自己的军队。"
  npc_override_sp_cor_quests_17_1_i_don_t_believe_higher_335253: "我不相信更高的力量，但也许我开始相信了。"
  npc_override_sp_cor_quests_17_1_i_don_t_feel_so_09c586: "我感觉不太好。我们应该做好准备。"
  npc_override_sp_cor_quests_17_1_i_don_t_give_up_9b9fb2: "我不会轻易放弃。"
  npc_override_sp_cor_quests_17_1_i_don_t_go_headquarters_596646: "我不需要去总部调查~"
  npc_override_sp_cor_quests_17_1_i_don_t_hate_destroying_664150: "我不讨厌摧毁机器，但这不如和你战斗有趣。"
  npc_override_sp_cor_quests_17_1_i_don_t_know_acedd2: "我不知道。"
  npc_override_sp_cor_quests_17_1_i_don_t_know_def523: "我不知道那个。"
  npc_override_sp_cor_quests_17_1_i_don_t_know_details_869509: "那个，我还不知道详情。"
  npc_override_sp_cor_quests_17_1_i_don_t_know_everything_bb1a83: "我不知道莱兹知道的一切，但他似乎比副总裁你更了解情况。"
  npc_override_sp_cor_quests_17_1_i_don_t_know_exact_11a03c: "我不知道确切位置。"
  npc_override_sp_cor_quests_17_1_i_don_t_know_purpose_d85961: "我不知道这堵墙的用途，但它不是在工厂还在运营时建造的。"
  npc_override_sp_cor_quests_17_1_i_don_t_know_sure_18b8f4: "我不确定。我们部门很多人在工作中受伤，我们的新员工都很强壮。"
  npc_override_sp_cor_quests_17_1_i_don_t_know_what_43053e: "我不知道副总裁在想什么……但即使我不必去，我也会跟他去。"
  npc_override_sp_cor_quests_17_1_i_don_t_know_why_072fc1: "我不知道为什么我一直站在这里。如果他们问什么，我就拒绝。他们是耐力怪物。"
  npc_override_sp_cor_quests_17_1_i_don_t_know_why_d0f546: "我不知道为什么冶炼设施里会有瞭望塔，但它绝对是个瞭望塔！"
  npc_override_sp_cor_quests_17_1_i_don_t_much_i_e0fc82: "我没什么事可做，但我已经看过这个地方了，我没有看到叫那个名字的人……你知道我的意思吗？"
  npc_override_sp_cor_quests_17_1_i_don_t_much_time_4c30c2: "我没有太多时间等这种愚蠢的事。"
  npc_override_sp_cor_quests_17_1_i_don_t_need_one_e75150: "我也不需要。"
  npc_override_sp_cor_quests_17_1_i_don_t_really_know_f9ff99: "我真的不知道会发生什么，所以你为什么不去四处看看呢？"
  npc_override_sp_cor_quests_17_1_i_don_t_see_any_ba813a: "我在这里没看到任何研究员。"
  npc_override_sp_cor_quests_17_1_i_don_t_think_5c0d31: "但我不认为是这样？"
  npc_override_sp_cor_quests_17_1_i_don_t_think_gate_1db29f: "我认为门没开，对吧？"
  npc_override_sp_cor_quests_17_1_i_don_t_think_going_c21308: "我不认为这会成功。你觉得泰斯会怎么说？战斗还在进行。"
  npc_override_sp_cor_quests_17_1_i_don_t_think_i_53a9c2: "我不认为我应该开始这次对话，所以你为什么不和泰斯谈谈呢？"
  npc_override_sp_cor_quests_17_1_i_don_t_think_s_007c3e: "而且……我不认为这是巧合。"
  npc_override_sp_cor_quests_17_1_i_don_t_think_s_5fa201: "我不认为这是一个研究设施，即使看了其他成员的报告。"
  npc_override_sp_cor_quests_17_1_i_don_t_think_s_f10f7c: "我不认为那是正确的名字。"
  npc_override_sp_cor_quests_17_1_i_don_t_think_so_b30487: "我不认为是这样？那个人看起来傻傻的。"
  npc_override_sp_cor_quests_17_1_i_don_t_think_there_2ba057: "我不认为这里有任何与考夫曼有关的东西。"
  npc_override_sp_cor_quests_17_1_i_don_t_want_anybody_c7e003: "我不想让任何人受伤，你们会用武器伤害我们！"
  npc_override_sp_cor_quests_17_1_i_don_t_want_die_e7d655: "我不想死。请给我一些希望。"
  npc_override_sp_cor_quests_17_1_i_don_t_want_get_119049: "我不想和公司惹麻烦，我告诉我的儿子要服从命令，不要抱怨。"
  npc_override_sp_cor_quests_17_1_i_drank_too_much_today_8cbb6c: "我今天喝太多了……为什么不来加入我们？"
  npc_override_sp_cor_quests_17_1_i_earned_good_amount_mon_30767a: "我今天赚了不少钱！"
  npc_override_sp_cor_quests_17_1_i_feel_better_already_am_2bf2db: "我已经感觉好多了。太神奇了~"
  npc_override_sp_cor_quests_17_1_i_feel_discarded_2702f6: "我感觉被抛弃了。"
  npc_override_sp_cor_quests_17_1_i_feel_really_alive_thes_58ea9e: "这些天我感觉真的活着。"
  npc_override_sp_cor_quests_17_1_i_finally_understood_tru_4681cd: "我终于理解了真正的含义……"
  npc_override_sp_cor_quests_17_1_i_finally_unlocked_door_2ea1dc: "我终于打开了这扇门。"
  npc_override_sp_cor_quests_17_1_i_finished_analyzing_inf_710a6c: "我已经完成了对你们之前从雷根舒姆收集到的信息的分析，有物资和研究数据的痕迹。"
  npc_override_sp_cor_quests_17_1_i_forward_your_letters_y_a55f54: "我可以帮你转寄信件。"
  npc_override_sp_cor_quests_17_1_i_given_job_taking_care_0c1c5a: "我被分配了照顾牲畜的工作以便我们能生存吗？"
  npc_override_sp_cor_quests_17_1_i_go_back_headquarters_l_962565: "我将带着失踪人员名单回总部。我会用手镯作为证据，并向他们的家人发送必要的赔偿。"
  npc_override_sp_cor_quests_17_1_i_go_now_8280c9: "我现在得走了。"
  npc_override_sp_cor_quests_17_1_i_grateful_if_you_joined_904999: "如果你能加入，我会很感激。"
  npc_override_sp_cor_quests_17_1_i_guide_you_follow_me_de95ec: "我会引导你，跟我来。我们去<NAVI>[雷根舒姆]<INFO>rgsr_in,157,84,0,101,0</INFO></NAVI>。"
