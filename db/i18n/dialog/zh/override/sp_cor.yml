  npc_override_sp_cor_quests_17_1_i_rather_my_life_cut_4c9af5: "我宁愿生命被缩短，也不愿作为怪物活哪怕一秒钟。明白了吗？"
  npc_override_sp_cor_quests_17_1_i_rather_use_force_than_b1c4d9: "我宁愿使用武力也不愿妥协。"
  npc_override_sp_cor_quests_17_1_i_realized_papers_easy_t_ccd56e: "我意识到文件很容易欺骗那些只坐在办公桌前做自己的事的人。"
  npc_override_sp_cor_quests_17_1_i_really_apply_job_34e07a: "我真的可以申请这份工作吗……？"
  npc_override_sp_cor_quests_17_1_i_really_appreciate_2fbe7a: "我真的非常感激。"
  npc_override_sp_cor_quests_17_1_i_really_don_t_know_57b1f8: "……我真的不知道其他人在他们的房间里做了什么。"
  npc_override_sp_cor_quests_17_1_i_really_late_what_all_9668da: "我真的这么晚了吗？这都是什么，为什么大家都受伤了？"
  npc_override_sp_cor_quests_17_1_i_really_like_here_don_ae340c: "我真的很喜欢这里。别忘了冒险，没什么好担心的。"
  npc_override_sp_cor_quests_17_1_i_really_t_believe_they_2c8eab: "我真的无法相信他们在这个地方进行非法实验。为什么它看起来这么好？"
  npc_override_sp_cor_quests_17_1_i_refused_left_only_watc_29af1d: "我拒绝了并离开了，只能看着更多守卫受苦。"
  npc_override_sp_cor_quests_17_1_i_remember_your_face_don_cbc6ce: "我会记住你的脸！！别以为你会永远安全！晚上小心！"
  npc_override_sp_cor_quests_17_1_i_rest_shouldn_t_i_42fdc3: "我可以休息吗？我不应该回去工作吗？如果我不工作，我的家人会挨饿。"
  npc_override_sp_cor_quests_17_1_i_said_your_bodies_weren_307e22: "我说过你们的身体不健康，但谁说过要死？"
  npc_override_sp_cor_quests_17_1_i_say_common_sense_front_57da8d: "我可以在努力学习过的人面前说常识~"
  npc_override_sp_cor_quests_17_1_i_searched_ground_found_3f92ec: "我在地上搜索，发现了一张有人埋藏的纸条。"
  npc_override_sp_cor_quests_17_1_i_see_fd141e: "我明白了……"
  npc_override_sp_cor_quests_17_1_i_see_there_entrance_6b7d45: "我明白了……有一个入口……"
  npc_override_sp_cor_quests_17_1_i_see_what_purpose_who_b381e0: "我明白了，目的是什么。还有……你又是谁？"
  npc_override_sp_cor_quests_17_1_i_see_you_again_dawn_618682: "黎明时再见。"
  npc_override_sp_cor_quests_17_1_i_seem_like_joke_you_0272c4: "我对你来说像个笑话吗贵宾？"
  npc_override_sp_cor_quests_17_1_i_send_everything_085597: "我会发送一切。"
  npc_override_sp_cor_quests_17_1_i_sense_their_hate_i_d2e9a8: "我能感觉到他们的仇恨，但我听不到他们。"
  npc_override_sp_cor_quests_17_1_i_sent_person_pick_perso_1450e6: "我派人去接负责人。我们是被派来这里搜索和侦察的先遣队，但如你所见……"
  npc_override_sp_cor_quests_17_1_i_should_able_handle_the_9080ba: "我应该能快速处理他们。"
  npc_override_sp_cor_quests_17_1_i_should_checked_if_you_f8d75c: "我应该先检查你是否在跟我们说话之前和其他人谈过了。现在，太晚了。"
  npc_override_sp_cor_quests_17_1_i_should_go_explain_situ_bfe892: "我应该去更详细地解释情况……"
  npc_override_sp_cor_quests_17_1_i_should_looked_them_mor_63f761: "我应该多看看他们，但我没有足够的资源……"
  npc_override_sp_cor_quests_17_1_i_should_probably_use_mo_dd54c6: "我应该从现在开始更频繁地使用它？"
  npc_override_sp_cor_quests_17_1_i_so_close_transplanting_81b3a2: "我差点就把人类意识移植到我的机器里了。"
  npc_override_sp_cor_quests_17_1_i_so_many_things_talk_a03eba: "我有很多事情要谈。我可以整天谈论它们。"
  npc_override_sp_cor_quests_17_1_i_so_much_trouble_work_87f6a8: "我在这里工作会有太多麻烦，我永远不会休息。"
  npc_override_sp_cor_quests_17_1_i_something_ask_you_083a23: "我有事要问你。"
  npc_override_sp_cor_quests_17_1_i_something_i_must_you_ab3cab: "我有必须做的事。你做你该做的。"
  npc_override_sp_cor_quests_17_1_i_sound_weird_when_i_db249c: "我说这种话听起来奇怪吗？我想我有点失去理智了。"
  npc_override_sp_cor_quests_17_1_i_split_workforce_38976e: "我不得不分割劳动力。"
  npc_override_sp_cor_quests_17_1_i_spread_fertilizer_arou_1b8675: "我在青豆周围施肥。"
  npc_override_sp_cor_quests_17_1_i_spread_fertilizer_arou_e2e62e: "我在葡萄周围施肥。"
  npc_override_sp_cor_quests_17_1_i_spread_fertilizer_pump_ad4e66: "我在南瓜藤上施肥。"
  npc_override_sp_cor_quests_17_1_i_still_cannot_conclude_61a638: "我仍然不能断定他们失踪了。"
  npc_override_sp_cor_quests_17_1_i_still_keep_bargain_4ff198: "……我还能保留这笔交易吗？"
  npc_override_sp_cor_quests_17_1_i_t_believe_area_disguis_056a6b: "我无法相信这个区域伪装成一个废弃的矿井。"
  npc_override_sp_cor_quests_17_1_i_t_chief_researcher_att_cb5a44: "我不能……首席研究员攻击了我们。"
  npc_override_sp_cor_quests_17_1_i_t_control_them_complet_d6f8d0: "我无法控制他们！……这完全出乎意料。"
  npc_override_sp_cor_quests_17_1_i_t_find_bathroom_i_3eea23: "我找不到厕所！我再也憋不住了……也许那边的树可以……"
  npc_override_sp_cor_quests_17_1_i_t_get_through_them_de8ccb: "我无法用言语说服他们。"
  npc_override_sp_cor_quests_17_1_i_t_go_now_when_c0a740: "我现在不能去，但等我长大了，我会去工作。我没时间玩。"
  npc_override_sp_cor_quests_17_1_i_t_help_we_re_d1670b: "我没办法。我们在他们身上浪费时间，何必呢？怎么了？你无话可说吗？"
  npc_override_sp_cor_quests_17_1_i_t_keep_working_as_fba964: "在企业处于这种状态时，我无法继续担任副总裁。"
  npc_override_sp_cor_quests_17_1_i_t_say_anything_about_e4fc7a: "我对此无话可说。"
  npc_override_sp_cor_quests_17_1_i_t_stand_now_i_4bd08c: "我现在站不起来，我之前浑身是血。我本来会跟着他们的，但我站不起来。"
  npc_override_sp_cor_quests_17_1_i_t_thank_you_enough_e7c8ab: "我感激不尽。"
  npc_override_sp_cor_quests_17_1_i_t_understand_how_peopl_e2f50d: "我无法理解为什么如此聪明的人却如此肮脏和混乱。"
  npc_override_sp_cor_quests_17_1_i_talked_other_captains_44658b: "我和其他反叛者队长谈过了，并决定疏散这个区域的所有人，释放我们的精英部队进行搜索。"
  npc_override_sp_cor_quests_17_1_i_tell_you_names_all_3dbc4d: "我可以告诉你所有蔬菜的名字。"
  npc_override_sp_cor_quests_17_1_i_think_greatly_help_if_edbe4b: "我认为如果你也加入她的团队会大有帮助……"
  npc_override_sp_cor_quests_17_1_i_think_i_heard_as_7f964c: "我想我在这里听够了。我们会在总部找到其余的信息。"
  npc_override_sp_cor_quests_17_1_i_think_i_may_take_acb268: "我想我可能不得不代替彼得。"
  npc_override_sp_cor_quests_17_1_i_think_kaya_something_e_c570b9: "我想卡亚还有别的话要说。"
  npc_override_sp_cor_quests_17_1_i_think_lab_also_been_54b686: "我认为这个实验室也在进行非法实验。所以……我能请你帮个忙吗？"
  npc_override_sp_cor_quests_17_1_i_think_laboratory_where_de6fad: "我认为这就是^0000FF失踪者被送到的实验室。^000000除了这个区域的人，可能还有其他我们现在看不到的人。"
  npc_override_sp_cor_quests_17_1_i_think_may_turn_into_741234: "我认为这可能会变成一场混乱的战斗。"
  npc_override_sp_cor_quests_17_1_i_think_others_went_navi_a156be: "我想其他人去了<NAVI>[会议室]<INFO>lhz_in01,162,257,0,000,0</INFO></NAVI>，那里举行会议。你不应该去吗？"
  npc_override_sp_cor_quests_17_1_i_think_our_coco_where_c95e43: "我想……我们的可可……他去哪里了……"
  npc_override_sp_cor_quests_17_1_i_think_people_coming_6e3f55: "我想有人来了。"
  npc_override_sp_cor_quests_17_1_i_think_s_conscious_deci_14a8bf: "我认为这是施莱因有意留下这些文件的决定。"
  npc_override_sp_cor_quests_17_1_i_think_s_entrance_their_e0c1be: "我认为这是他们主基地的入口。"
  npc_override_sp_cor_quests_17_1_i_think_we_should_fight_72fb63: "我认为我们应该很快再战，但现在先休息一下。"
  npc_override_sp_cor_quests_17_1_i_think_we_should_hurry_14f95a: "我认为我们应该快点。"
  npc_override_sp_cor_quests_17_1_i_think_you_re_just_3bf378: "我认为你只是无知的人，什么都不知道。"
  npc_override_sp_cor_quests_17_1_i_thought_here_lazy_must_f316f9: "我以为是在这里。莱兹一定在想^0000FF这意味着什么。^000000我只从坐在办公桌前的角度看世界。我相信我的视角是真实的。"
  npc_override_sp_cor_quests_17_1_i_thought_i_okay_101e0d: "我以为我会没事。"
  npc_override_sp_cor_quests_17_1_i_thought_they_assign_th_d0c409: "我以为他们会直接把这些人分配到他们的部门。"
  npc_override_sp_cor_quests_17_1_i_thought_vip_said_there_cfb72d: "我以为贵宾说只有两个条件？再说，大家都已经听到我说的话了。"
  npc_override_sp_cor_quests_17_1_i_thought_you_investigat_fe7938: "我以为你在和莱兹一起调查，看起来你没有得到很好的结果。"
  npc_override_sp_cor_quests_17_1_i_told_kaya_story_about_d6823a: "- 我告诉卡亚关于你在鲁达斯遇到的研究员以及实验的事。 -"
  npc_override_sp_cor_quests_17_1_i_told_you_you_alone_25ee00: "我告诉过你，你必须独自做这件事。"
  npc_override_sp_cor_quests_17_1_i_took_picture_me_let_5a611d: "- 我把照片带走了，让我们把它还给迪恩。 -"
  npc_override_sp_cor_quests_17_1_i_tracked_load_carries_f_b4134c: "我追踪了一列运货列车。努力不错。但火车在哪里？"
  npc_override_sp_cor_quests_17_1_i_tried_get_while_ago_40b321: "我一会儿前试图进去，但被铁丝网挡住了。我从外面可以看到可疑的动作。"
  npc_override_sp_cor_quests_17_1_i_tried_keep_him_around_bee8bf: "我试图让他多留一会儿，但他们把他带到了实验室。"
  npc_override_sp_cor_quests_17_1_i_tried_send_emergency_r_9f1506: "我试图发送紧急请求以获得响应小组，但他们异常强大……"
  npc_override_sp_cor_quests_17_1_i_trust_you_i_don_ad4fcf: "我相信你，但我不了解你的朋友。请以^0000CD1人队伍^000000回来。"
  npc_override_sp_cor_quests_17_1_i_understand_40038e: "我明白。"
  npc_override_sp_cor_quests_17_1_i_understand_if_we_don_974e9c: "我明白。如果我们不去那边，我们的报告只会引起争议。"
  npc_override_sp_cor_quests_17_1_i_understand_what_they_r_86512c: "我明白他们在说什么。"
  npc_override_sp_cor_quests_17_1_i_understand_what_you_me_57e965: "我明白你的意思，但黛西的逻辑^0000CD太过分了。^000000我不能怀疑^0000CD官方文件的可信度，^000000那是不可能的。"
  npc_override_sp_cor_quests_17_1_i_understand_what_you_re_deba1c: "我明白你在说什么，但你错了。我们告诉你的是真相，而你假设我们在撒谎。"
  npc_override_sp_cor_quests_17_1_i_understand_why_est_so_43c56b: "我能理解为什么艾斯特如此愤怒。"
  npc_override_sp_cor_quests_17_1_i_understood_moment_i_he_f16fe5: "我听到副总裁说话的那一刻我就明白了。我曾自豪地工作，但最终我只是在为我的高级研究员制造消耗品。"
  npc_override_sp_cor_quests_17_1_i_ve_already_been_there_0c2131: "我已经去过了。"
  npc_override_sp_cor_quests_17_1_i_ve_already_decided_sen_cfdc48: "我已经决定派遣支援部队。"
  npc_override_sp_cor_quests_17_1_i_ve_already_seen_place_c87fad: "我已经看过这个地方了。我们去别处看看。"
  npc_override_sp_cor_quests_17_1_i_ve_already_used_all_dcc82c: "我已经用完了我带来的所有人手，所以我需要一些支援。"
  npc_override_sp_cor_quests_17_1_i_ve_been_agent_long_9879c7: "我当特工已经很久了，我知道这些事。有官方的处理方式，但我不能告诉你这些信息。"
  npc_override_sp_cor_quests_17_1_i_ve_been_contacted_tes_c085aa: "泰斯联系过我。"
  npc_override_sp_cor_quests_17_1_i_ve_been_some_discussio_97c2a5: "我一直与施瓦茨政府有一些讨论，所以我会忙一段时间……"
  npc_override_sp_cor_quests_17_1_i_ve_been_taking_invento_4552ed: "我一直在盘点，但有很多东西我真的无法识别。但我真的想自己做这件事。"
  npc_override_sp_cor_quests_17_1_i_ve_been_told_we_a9579a: "我被告知在整整一年内不允许调动人员，但为什么考夫曼被调动了？"
  npc_override_sp_cor_quests_17_1_i_ve_been_waiting_you_760466: "我一直在等你。"
  npc_override_sp_cor_quests_17_1_i_ve_been_working_here_5d0c50: "我在这里工作了一整年，但我仍然不确定我在做什么。"
  npc_override_sp_cor_quests_17_1_i_ve_came_here_purge_826aeb: "我来这里是为了清除企业中的邪恶。"
  npc_override_sp_cor_quests_17_1_i_ve_delivered_informati_c9bd48: "我已经传达了信息！"
  npc_override_sp_cor_quests_17_1_i_ve_found_where_go_0dbe15: "我找到了下一步要去的地方。接下来我们去<NAVI>[贫民窟]<INFO>lighthalzen,336,266,0,101,0</INFO></NAVI>。"
  npc_override_sp_cor_quests_17_1_i_ve_met_heart_hunters_6614a7: "我也遇到过猎心者……"
  npc_override_sp_cor_quests_17_1_i_ve_never_seen_anyone_fc1e4d: "我从未见过有人进去……"
  npc_override_sp_cor_quests_17_1_i_ve_never_seen_room_dd3189: "我从未在房间里见过那个。"
  npc_override_sp_cor_quests_17_1_i_ve_said_few_times_09465e: "我已经说过好几次了。"
  npc_override_sp_cor_quests_17_1_i_ve_seen_some_signs_bed9ea: "我也看到了一些迹象。"
  npc_override_sp_cor_quests_17_1_i_ve_sent_help_requests_34d0f9: "我到处发送了求助请求，但我还没有得到好的回复。"
  npc_override_sp_cor_quests_17_1_i_ve_tended_all_crops_c733ad: "我已经照料了所有的庄稼。我应该回到农场工人那里。"
  npc_override_sp_cor_quests_17_1_i_very_legitimate_way_be_e145c5: "我必须以非常合法的方式来做，因为我告诉他我会在不引起摩擦的情况下做。"
  npc_override_sp_cor_quests_17_1_i_want_gather_more_comba_bfad94: "如果可能的话，我想收集更多战斗数据。"
  npc_override_sp_cor_quests_17_1_i_want_get_battle_inform_fda7e4: "我想获取战斗信息。"
  npc_override_sp_cor_quests_17_1_i_want_some_delicious_ri_789b75: "我想吃些美味的米饭。"
  npc_override_sp_cor_quests_17_1_i_wasn_t_able_reach_af4dfd: "我没能联系到他，然后我来这里寻找留给我的东西。"
  npc_override_sp_cor_quests_17_1_i_went_top_watchtower_5f2763: "我上去了，瞭望塔！"
  npc_override_sp_cor_quests_17_1_i_wish_we_could_talk_333b02: "我希望我们能更深入地讨论这次行动。"
  npc_override_sp_cor_quests_17_1_i_won_t_go_near_51bb64: "我不会再靠近你了。你表现得很奇怪！"
  npc_override_sp_cor_quests_17_1_i_won_t_say_twice_cec609: "我不会说第二遍。"
  npc_override_sp_cor_quests_17_1_i_wonder_how_valuable_th_ed149e: "我想知道这些东西有多值钱。它们值多少钱？我想触摸和闻它们。它们闻起来和摸起来都像贵重物品，我打赌！"
  npc_override_sp_cor_quests_17_1_i_wonder_if_those_streng_d328af: "我想知道那些是否是通过这个实验室的实验而强化的？"
  npc_override_sp_cor_quests_17_1_i_wonder_whether_i_shoul_e7d18b: "我不知道是否应该去公司直接问他，我工作很忙，联系不上他。"
  npc_override_sp_cor_quests_17_1_i_work_here_i_m_25a78c: "我会在这里工作……我是新来的……我应该去哪里……"
  npc_override_sp_cor_quests_17_1_identification_bracelet_c2dda5: "这是一个身份识别手镯。"
  npc_override_sp_cor_quests_17_1_if_adventurer_poor_famil_55973d: "如果冒险者来自贫困家庭，你必须养家，你会为吃饭省钱吗？"
  npc_override_sp_cor_quests_17_1_if_anyone_ask_me_about_65d1a4: "如果有人问我卢恩-米德加尔特的未来，我会用生命打赌，那将是辉煌的朱诺城。"
  npc_override_sp_cor_quests_17_1_if_everything_document_f_cb163d: "如果那份文件上的一切都是假的，那我们就找不到更多信息了。"
  npc_override_sp_cor_quests_17_1_if_he_did_there_bracelet_14a137: "如果他做了，地上某个地方会有一个手镯。它可能甚至已经不在了……"
  npc_override_sp_cor_quests_17_1_if_he_worked_here_others_592136: "如果他在这里工作，其他人可能知道一些关于他的事。"
  npc_override_sp_cor_quests_17_1_if_i_could_use_small_f9ba50: "如果我能用那个小洞，我的努力不就白费了吗？"
  npc_override_sp_cor_quests_17_1_if_i_wanted_i_cautioned_9d9bc0: "如果我想做这件事，我被警告要合法进行，以避免引起更多摩擦。"
  npc_override_sp_cor_quests_17_1_if_lazy_wrong_after_join_df229b: "如果莱兹在联合调查后错了，那你只是浪费了一点时间，但对副总裁来说，这是个大问题。"
  npc_override_sp_cor_quests_17_1_if_me_daisy_going_fair_7aadd2: "如果我、{0}和黛西一起去，这将是一次公平的调查。"
  npc_override_sp_cor_quests_17_1_if_only_way_achieve_revi_482696: "如果实现这一目标的唯一方式是审查名单上的人，我将接受这个条件。"
  npc_override_sp_cor_quests_17_1_if_our_opponents_heart_h_d5e637: "如果我们的对手是猎心者，那就有意思了。"
  npc_override_sp_cor_quests_17_1_if_possible_could_you_jo_b0dcc5: "如果可能的话，你能加入艾斯特并做一些计划吗？"
  npc_override_sp_cor_quests_17_1_if_s_case_then_we_2bd217: "如果是这样，那么我们应该审查调查方法和来源的可信度。"
  npc_override_sp_cor_quests_17_1_if_s_daisy_you_flower_841623: "如果是黛西……你是一朵花吗？"
  npc_override_sp_cor_quests_17_1_if_s_requirement_i_ll_e44312: "如果那是要求，我就去！"
  npc_override_sp_cor_quests_17_1_if_s_vice_president_who_fe8737: "如果不是副总裁，我们还能信任谁！"
  npc_override_sp_cor_quests_17_1_if_something_suspicious_5e1e19: "如果有什么可疑的事情发生，交给我！"
  npc_override_sp_cor_quests_17_1_if_there_s_nothing_speci_191f35: "如果没有什么特别的，我就离开。但如果那里有什么东西，我应该全力以赴吗？"
  npc_override_sp_cor_quests_17_1_if_there_s_problem_how_2e9d24: "如果事情进展有问题，请告诉我们。从他小时候起，他就一直认真倾听，他能修好任何东西。"
  npc_override_sp_cor_quests_17_1_if_they_had_certain_phys_947f11: "如果他们有^0000FF特定的身体状况和贫困的背景^000000，有时只是无家可归，就更容易对他们进行实验。"
  npc_override_sp_cor_quests_17_1_if_up_me_i_d_cfe15e: "如果由我决定，我早就那么做了。我们什么时候还能有这样的机会？"
  npc_override_sp_cor_quests_17_1_if_we_get_caught_we_b87eaa: "如果我们被抓到，我们就完了！！"
  npc_override_sp_cor_quests_17_1_if_we_re_going_raid_f4c15a: "如果下次我们要突袭，我们必须彻底。"
  npc_override_sp_cor_quests_17_1_if_we_refuse_comply_what_78aa8d: "如果我们拒绝服从，会发生什么？你要开枪打我们吗？"
  npc_override_sp_cor_quests_17_1_if_what_you_ve_written_b9865d: "如果你写的是真的，那么天空是红的也是真的。"
  npc_override_sp_cor_quests_17_1_if_you_arrived_little_so_49463b: "如果你早到一点，你的舌头上就会有个洞。你很幸运"
  npc_override_sp_cor_quests_17_1_if_you_asked_enterprise_04a3c8: "如果你要求企业与我们合作，但如果他们拒绝了，你打算怎么办？"
  npc_override_sp_cor_quests_17_1_if_you_both_investigate_080960: "如果你们俩都调查报告之间的差异，你们就会知道哪个是准确的。这里必须达成妥协。"
  npc_override_sp_cor_quests_17_1_if_you_come_back_here_53bc39: "如果你过段时间回到这里，而我已经完全变成了怪物，请杀了我。"
  npc_override_sp_cor_quests_17_1_if_you_document_book_fin_f0e165: "如果你有文件或书要找，请去见接待处的工作人员。"
  npc_override_sp_cor_quests_17_1_if_you_don_t_anything_2d120b: "如果你没有别的话要说，那么请解释一下为什么你的名字不同。"
  npc_override_sp_cor_quests_17_1_if_you_don_t_cooperate_7a7df5: "如果你不与他合作，从现在开始按我的方式做，"
  npc_override_sp_cor_quests_17_1_if_you_don_t_investigate_264108: "如果你不用怀疑的态度调查，你在表面上看不到任何问题。"
  npc_override_sp_cor_quests_17_1_if_you_don_t_like_b6e60a: "如果你不喜欢被称为贵宾，那你更喜欢哪个头衔？"
  npc_override_sp_cor_quests_17_1_if_you_find_sources_nois_6f51fa: "如果你找到噪音的来源，看到怪物，或任何其他不寻常的事情，请告诉我！"
  npc_override_sp_cor_quests_17_1_if_you_get_hurt_only_c177a9: "如果你受伤只会引起丑闻。那会很糟糕！你知道我的意思，对吧？"
  npc_override_sp_cor_quests_17_1_if_you_go_don_t_70e2bd: "如果你去，别放弃好吗？"
  npc_override_sp_cor_quests_17_1_if_you_go_force_you_f19f57: "如果你强行进去，你会被狗追。你应该^FF0000侦察附近^000000并等待更多支援。"
  npc_override_sp_cor_quests_17_1_if_you_go_past_sewage_836c5c: "如果你经过污水处理厂，里面有一个巨大的魔力发电厂。"
  npc_override_sp_cor_quests_17_1_if_you_join_recon_team_acccbd: "如果你加入侦察队，肯定会有帮助。"
  npc_override_sp_cor_quests_17_1_if_you_keep_waiting_outs_722b62: "如果你一直在外面等，你不觉得看起来更可疑吗？"
  npc_override_sp_cor_quests_17_1_if_you_keep_working_you_a4b412: "如果你继续工作，你会的。你需要休息，让专业人士治疗。"
  npc_override_sp_cor_quests_17_1_if_you_know_what_place_571dfc: "如果你知道这个地方在研究什么，请举手。"
  npc_override_sp_cor_quests_17_1_if_you_look_around_close_044847: "如果你仔细看看周围，你就会明白。"
  npc_override_sp_cor_quests_17_1_if_you_mean_your_illegal_4b8b83: "如果你指的是你的非法实验结果，"
  npc_override_sp_cor_quests_17_1_if_you_pressured_above_y_5a3909: "但如果你受到上面的压力，你必须遵守并给他们劳动力，对吧？"
  npc_override_sp_cor_quests_17_1_if_you_re_adventurer_if_402900: "如果你是冒险者，如果你感兴趣，由沃尔科娃队长的<NAVI>[下属]<INFO>sp_cor,108,130,0,101,0</INFO></NAVI>管理，去问问吧。"
  npc_override_sp_cor_quests_17_1_if_you_re_hurry_you_d23626: "如果你着急，你就会把它们混在一起！"
  npc_override_sp_cor_quests_17_1_if_you_re_interested_you_249093: "如果你对此感兴趣，你可以问我聪明的<NAVI>[下属]<INFO>sp_cor,108,130,0,101,0</INFO></NAVI>了解更多详情。"
  npc_override_sp_cor_quests_17_1_if_you_re_new_around_30eedd: "如果你是新来的，你可以向负责分配任务的人询问方向。"
  npc_override_sp_cor_quests_17_1_if_you_re_ready_please_88d8e3: "如果你准备好了，请进入。"
  npc_override_sp_cor_quests_17_1_if_you_re_right_then_393eab: "如果你是对的，那我们去<NAVI>[总部]<INFO>lhz_in01,107,137,0,101,0</INFO></NAVI>确认一下。"
  npc_override_sp_cor_quests_17_1_if_you_re_too_busy_099620: "如果你不太忙，也许你可以继续找！我正在尽一切努力把薪水送过去！"
  npc_override_sp_cor_quests_17_1_if_you_refuse_cooperate_b36434: "如果你拒绝合作，你将被指控非法行为和拒绝合作。"
  npc_override_sp_cor_quests_17_1_if_you_spend_long_time_063114: "如果你当冒险者很长时间，你就能把1和1加在一起。我看到了阴谋。"
  npc_override_sp_cor_quests_17_1_if_you_still_plan_attack_9b377c: "如果你仍然计划攻击其他企业设施，你可能想先休息一下。"
  npc_override_sp_cor_quests_17_1_if_you_t_believe_each_c3ad11: "如果你们不能相信彼此的结果，你们为什么不从头开始？"
  npc_override_sp_cor_quests_17_1_if_you_t_find_him_c59d8c: "如果你找不到他，你可能可以在市场上买一个手镯，然后举行一个适当的葬礼。"
  npc_override_sp_cor_quests_17_1_if_you_t_work_you_b51610: "如果你不能工作，你就不能生活。"
  npc_override_sp_cor_quests_17_1_if_you_time_how_about_496300: "如果你有时间，不如回鲁达斯找更多身份识别手镯？"
  npc_override_sp_cor_quests_17_1_if_you_time_i_hope_5a30c8: "如果你有时间，我希望你能让这些实验得到安息。除了你……冒险者，没有人能看到他们走完最后一程。"
  npc_override_sp_cor_quests_17_1_if_you_unhealthy_you_sho_9aeaed: "如果你不健康，你应该先专注于康复。"
  npc_override_sp_cor_quests_17_1_if_you_want_i_teach_b816f3: "如果你愿意，我可以教你更多技巧。这在现实世界中非常有用。"
  npc_override_sp_cor_quests_17_1_if_you_want_more_informa_cd74b6: "如果你想要更多信息，你应该问入口处的<NAVI>[萨米]<INFO>rgsr_in,12,46,0,101,0</INFO></NAVI>。"
  npc_override_sp_cor_quests_17_1_if_you_want_uncover_secr_4ea4ea: "如果你想揭开秘密，直接去文件储存室自己搜索文件，而不是通过人力资源部门，会更明智。"
  npc_override_sp_cor_quests_17_1_illusion_created_after_m_1e3a1e: "幻景是在宅邸发现之后创建的，以垄断这个地方内部可用的知识。"
  npc_override_sp_cor_quests_17_1_information_i_got_est_in_e49fac: "我从艾斯特那里得到的信息令人难以置信。"
  npc_override_sp_cor_quests_17_1_inspect_your_unit_before_3803d1: "在进入占领之前检查你的单位。"
  npc_override_sp_cor_quests_17_1_investigate_together_b89c17: "一起调查？"
  npc_override_sp_cor_quests_17_1_investigation_looking_go_ca3426: "调查看起来不错，但你能停止这种荒谬的行为吗。"
  npc_override_sp_cor_quests_17_1_isn_t_another_one_your_758ea2: "这不是你的又一个谎言吗？"
  npc_override_sp_cor_quests_17_1_isn_t_common_sense_peopl_b32041: "难道^0000CD企业内部的人知道得更多^000000不是常识吗？"
  npc_override_sp_cor_quests_17_1_isn_t_there_lot_work_2220a5: "这里不是也有^0000FF很多工作^000000要做吗？还有废料……对吧？但我不认为枪手会在这里待超过一两天。"
  npc_override_sp_cor_quests_17_1_isn_t_truly_wonderful_am_6a2184: "这难道不真正美妙和令人惊叹吗？我见过很多事情，但我从未想过这一天会到来。"
  npc_override_sp_cor_quests_17_1_isn_t_what_means_92559b: "这不是那个意思吗？"
  npc_override_sp_cor_quests_17_1_jewel_rune_midgard_heart_82164d: "卢恩-米德加尔特的宝石，国家的心脏，是朱诺。每个人都应该至少去一次。"
  npc_override_sp_cor_quests_17_1_job_important_protecting_c73824: "工作很重要，但保护贵宾也很重要。"
  npc_override_sp_cor_quests_17_1_job_slums_wasn_t_much_a3fdea: "贫民窟的工作和雷肯伯的工作没有太大区别。"
  npc_override_sp_cor_quests_17_1_just_let_me_explain_when_88f166: "让我解释一下。当你跟着我时，我的机器——那些曾经保护我的——"
  npc_override_sp_cor_quests_17_1_just_one_more_check_marc_8876ff: "再检查一次。马库斯·霍尔兹曼在名单上。他现在在哪里工作？"
  npc_override_sp_cor_quests_17_1_kaufmann_s_there_other_p_a5a689: "这是考夫曼的……？那里有其他人吗？"
  npc_override_sp_cor_quests_17_1_kaufmann_still_work_mcdo_9dbea8: "考夫曼还在麦当劳实验室工作吗？"
  npc_override_sp_cor_quests_17_1_kaya_i_stay_here_process_fa2291: "卡亚和我会留在这里处理和传递 incoming 信息。"
  npc_override_sp_cor_quests_17_1_kaya_relax_leave_your_pr_1afc1b: "卡亚，放松。把你的问题抛在脑后，假装你在度假。你会得到更清晰的视角。"
  npc_override_sp_cor_quests_17_1_kaya_should_there_too_1ebaec: "卡亚也应该在那里。"
  npc_override_sp_cor_quests_17_1_laboratory_i_discovered_1b2c5d: "我一段时间前发现的实验室，以及废物场。我相信这只是时间问题。它一定在附近。"
  npc_override_sp_cor_quests_17_1_laboratory_regenschirm_70cfd0: "实验室？是雷根舒姆吗？"
  npc_override_sp_cor_quests_17_1_lazy_isn_t_type_person_671983: "莱兹不是那种会无缘无故花时间调查这些事情的人。"
  npc_override_sp_cor_quests_17_1_lazy_says_he_cannot_beli_8c96cc: "莱兹说他无法相信副总裁提供的结果，但你也不相信礼二提供的结果，对吗？"
  npc_override_sp_cor_quests_17_1_lazy_seems_up_something_e5b766: "莱兹似乎在谋划什么。"
  npc_override_sp_cor_quests_17_1_lazy_what_s_wrong_c78782: "莱兹，怎么了？"
  npc_override_sp_cor_quests_17_1_lazy_your_name_lazy_didn_2b7933: "莱兹？你的名字是莱兹？你不是介绍自己叫黛西吗？"
  npc_override_sp_cor_quests_17_1_leave_me_5e48dd: "交给我。"
  npc_override_sp_cor_quests_17_1_leaving_place_don_t_i_79525a: "离开这个地方？别，我要死了。这是残酷的真相。我了解我的身体。这是我研究的。"
  npc_override_sp_cor_quests_17_1_let_me_go_first_i_9e8c4f: "让我先走。我感觉我快要死了。"
  npc_override_sp_cor_quests_17_1_let_me_know_whenever_you_6745ae: "你准备好的时候告诉我。"
  npc_override_sp_cor_quests_17_1_let_me_revel_you_new_220576: "让我向你透露新基地的位置。"
  npc_override_sp_cor_quests_17_1_let_me_see_patrick_kaufm_0ba583: "让我看看……^0000CD帕特里克·考夫曼^000000。"
  npc_override_sp_cor_quests_17_1_let_me_speak_them_880bbb: "让我和他们谈谈"
  npc_override_sp_cor_quests_17_1_let_me_tell_you_where_793512: "让我告诉你在哪里可以找到这些值得信赖的文件。"
  npc_override_sp_cor_quests_17_1_let_rest_people_here_loo_4f9a44: "让这里的其他人看看他们去了哪里。"
  npc_override_sp_cor_quests_17_1_let_s_another_look_aroun_6913d2: "让我们再四处看看。"
  npc_override_sp_cor_quests_17_1_let_s_ask_guy_informatio_b6575c: "让我们向这家伙打听信息。"
  npc_override_sp_cor_quests_17_1_let_s_first_look_situati_dc3c83: "让我们先看看情况和背景信息。"
  npc_override_sp_cor_quests_17_1_let_s_get_more_informati_7c7ada: "让我们从<NAVI>[办公室]<INFO>lhz_in01,80,210,0,000,0</INFO></NAVI>获取更多信息。"
  npc_override_sp_cor_quests_17_1_let_s_go_7d9a7e: "我们走！"
  npc_override_sp_cor_quests_17_1_let_s_go_back_navi_10b24e: "我们回<NAVI>[子弹上的猫]<INFO>pub_cat,93,105,0,000,0</INFO></NAVI>吧。"
  npc_override_sp_cor_quests_17_1_let_s_go_back_rebellion_04944d: "- 我们回反叛者那里。 -"
  npc_override_sp_cor_quests_17_1_let_s_go_follow_me_0886e8: "我们走。{0}，跟我来<NAVI>[这边]<INFO>sp_cor,180,169,0,101,0</INFO></NAVI>。"
  npc_override_sp_cor_quests_17_1_let_s_go_headquarters_re_e812c5: "我们去总部吧。雷肯伯的道路宽阔而闪耀~每个人都知道施瓦茨瓦尔德共和国~"
  npc_override_sp_cor_quests_17_1_let_s_go_navi_cat_d1b848: "我们去<NAVI>[子弹上的猫]<INFO>pub_cat,93,105,0,000,0</INFO></NAVI>吧。"
  npc_override_sp_cor_quests_17_1_let_s_go_navi_conference_3cf55b: "我们去<NAVI>[会议室]<INFO>lhz_in01,162,257,0,101,0</INFO></NAVI>，帕特在雷肯伯开始他生活的地方。"
  npc_override_sp_cor_quests_17_1_let_s_go_navi_document_f236ea: "我们去<NAVI>[文件储存室]<INFO>lhz_in01,32,264,0,101,0</INFO></NAVI>。"
  npc_override_sp_cor_quests_17_1_let_s_go_navi_einbroch_eaa47e: "我们去<NAVI>[艾音布罗克机场]<INFO>einbroch,42,208,0,101,0</INFO></NAVI>。"
  npc_override_sp_cor_quests_17_1_let_s_go_now_you_d9f648: "我们现在走吧。你要去<NAVI>[麦当劳实验室]<INFO>ein_fild01,95,146,0,000,0</INFO></NAVI>，完成后等我们。"
  npc_override_sp_cor_quests_17_1_let_s_go_yuno_huh_c8b7df: "我们去朱诺吧。嗯？"
  npc_override_sp_cor_quests_17_1_let_s_head_over_there_bbb317: "我们去那里吧，坐非公平的一等舱座位，会更舒服。"
  npc_override_sp_cor_quests_17_1_let_s_hurry_there_s_00a6a4: "我们快点。还有很多事要做。"
  npc_override_sp_cor_quests_17_1_let_s_look_somewhere_els_9861f5: "- 我们去别处看看。 -"
  npc_override_sp_cor_quests_17_1_let_s_meet_inside_451c9f: "我们在里面见面。"
  npc_override_sp_cor_quests_17_1_let_s_open_door_oscar_3ebc55: "让我们和奥斯卡一起开门。"
  npc_override_sp_cor_quests_17_1_let_s_prepare_heart_hunt_7dd5a0: "让我们准备猎杀猎心者。"
  npc_override_sp_cor_quests_17_1_let_s_quietly_move_insid_d049e0: "让我们悄悄进去。"
  npc_override_sp_cor_quests_17_1_let_s_report_elena_then_e2c75c: "我们向艾莲娜报告！然后，回子弹上的猫向泰斯报告！"
  npc_override_sp_cor_quests_17_1_let_s_secure_regenschirm_c2521a: "让我们确保'雷根舒姆'的安全并找出真相。"
  npc_override_sp_cor_quests_17_1_let_s_see_lab_outside_10d753: "让我看看……实验室在艾音布罗克外区的外面。"
  npc_override_sp_cor_quests_17_1_let_s_see_marcus_holzman_289cfa: "让我看看，马库斯·霍尔兹曼？等等……"
  npc_override_sp_cor_quests_17_1_let_s_see_why_they_7a67aa: "让我们看看为什么他们从未联系过。我不知道他们假期做了什么，但我们可以看到他们现在在哪里。"
  npc_override_sp_cor_quests_17_1_let_s_wait_bit_c478bb: "我们等一会儿。"
  npc_override_sp_cor_quests_17_1_like_spy_novel_411c0e: "这就像间谍小说！"
  npc_override_sp_cor_quests_17_1_list_missing_people_i_ne_95138c: "失踪人员名单。我需要和这里的人再核对一下。"
  npc_override_sp_cor_quests_17_1_listen_carefully_as_i_sa_03bb51: "仔细听。正如我之前所说，加入雷肯伯是贫民窟大多数人羡慕的事。如果你无法想象他们有多兴奋，那也许你不会思考。"
  npc_override_sp_cor_quests_17_1_listen_me_1ad4ab: "听我说。"
  npc_override_sp_cor_quests_17_1_listen_me_i_asked_govern_a7c2de: "听我说。我向政府求助。我确实同意，为了我们彼此信任，我们必须充分合作。"
  npc_override_sp_cor_quests_17_1_listen_up_you_ve_got_326655: "听着。你有两个选择。"
  npc_override_sp_cor_quests_17_1_ll_great_c2f295: "会很棒的！"
  npc_override_sp_cor_quests_17_1_location_einbroch_north_ef13b2: "位置是艾音布罗克东北田野。操作系统的代号是鲁达斯。"
  npc_override_sp_cor_quests_17_1_locks_inside_handled_aas_663289: "里面的锁将由阿斯处理。"
  npc_override_sp_cor_quests_17_1_look_although_may_true_m_3d7832: "听着，虽然对我来说可能是真的，但这并不意味着适用于我。"
  npc_override_sp_cor_quests_17_1_look_around_you_even_tho_e41e72: "看看你周围。即使你在这里过得很艰难，你能看到任何试图解释自己的研究员吗？"
  npc_override_sp_cor_quests_17_1_look_i_take_care_myself_3d8f08: "听着，我可以照顾自己，如果有必要，我可以跟着冒险者，但贵宾呢？"
  npc_override_sp_cor_quests_17_1_look_like_your_sister_ma_244c6d: "看起来你妹妹和总统达成了某种交易。"
  npc_override_sp_cor_quests_17_1_look_over_here_strange_af1524: "看这里，这不奇怪吗？"
  npc_override_sp_cor_quests_17_1_look_s_all_nice_good_57768f: "听着，有^0000CD事实^000000固然很好。但这甚至不能用作火力。"
  npc_override_sp_cor_quests_17_1_look_s_same_as_i_40622b: "听着。正如我所说。"
  npc_override_sp_cor_quests_17_1_looks_better_than_barrie_cd0c62: "看起来比屏障好。"
  npc_override_sp_cor_quests_17_1_looks_like_livestock_stu_5c3f47: "看起来像牲畜研究。"
  npc_override_sp_cor_quests_17_1_looks_like_navi_aas_info_5dbd5b: "看起来<NAVI>[阿斯]<INFO>sp_cor,135,147,0,101,0</INFO></NAVI>很担心受伤的人。让我们听听她想说什么。"
  npc_override_sp_cor_quests_17_1_looks_like_navi_aas_info_edaa8d: "看起来<NAVI>[阿斯]<INFO>sp_cor,135,147,0,101,0</INFO></NAVI>很担心受伤的人。我们去看看她想说什么。"
  npc_override_sp_cor_quests_17_1_looks_like_there_aren_t_d8d28e: "看起来进去的人不够……"
  npc_override_sp_cor_quests_17_1_lot_garbage_piled_up_aro_e34fb1: "这块岩石周围堆积了很多垃圾。看起来已经有一段时间了。让我们挖地。"
  npc_override_sp_cor_quests_17_1_lucky_said_s_just_abando_a899c2: "幸运说那只是一个废弃的冶炼厂，矿井关闭后留下的。"
  npc_override_sp_cor_quests_17_1_manager_0f4eb4: "经理？"
  npc_override_sp_cor_quests_17_1_mansion_s_manager_stayin_c9c8f5: "宅邸的经理待在花园附近。一定要先见他们。"
  npc_override_sp_cor_quests_17_1_many_missing_people_schw_d45863: "施瓦茨瓦尔德的许多失踪者最终会来到这里。你打算调查每一个人吗？如果你有足够的时间，那不是件坏事。"
  npc_override_sp_cor_quests_17_1_many_other_volunteer_adv_af4bbb: "许多其他志愿冒险者在我们之前已经进入。"
  npc_override_sp_cor_quests_17_1_marcus_holzman_lighthalz_51f606: "来自里希塔乐镇的马库斯·霍尔兹曼？"
  npc_override_sp_cor_quests_17_1_marcus_never_me_my_marcu_7b752b: "马库斯永远不会那样对我！我的马库斯……马库斯……"
  npc_override_sp_cor_quests_17_1_may_hard_you_please_inve_e810c7: "这可能对你来说很难，但请先调查入口。"
  npc_override_sp_cor_quests_17_1_maybe_goni_i_stand_back_ca5b56: "但也许戈尼和我可以站在后面，用眼神瞪着他。"
  npc_override_sp_cor_quests_17_1_maybe_he_doesn_t_like_65591a: "也许他不再喜欢我们了……^0000FF在我的第一个假期^000000，我只是回家和家人聊天。"
  npc_override_sp_cor_quests_17_1_maybe_he_doesn_t_want_4d8610: "也许他不想联系你了？"
  npc_override_sp_cor_quests_17_1_maybe_if_he_worked_here_ed179c: "也许如果他在这里工作，其他人可能知道一些关于它的事。"
  npc_override_sp_cor_quests_17_1_maybe_illusions_intended_d3ef2d: "也许幻景打算打开它……因为里面全是实验……"
  npc_override_sp_cor_quests_17_1_maybe_last_chance_we_ll_b00c9c: "也许……这是我们找到帕特里克的最后机会。"
  npc_override_sp_cor_quests_17_1_maybe_party_leader_hasn_bdd3f1: "也许^FF0000队长^000000还没开门？"
  npc_override_sp_cor_quests_17_1_maybe_s_time_you_should_c2eaf7: "也许你应该多关注一些。我们想让你谈谈。"
  npc_override_sp_cor_quests_17_1_maybe_there_another_reas_446974: "但……也许……调动有另一个原因？什么……"
  npc_override_sp_cor_quests_17_1_maybe_there_connection_p_b9d610: "也许与之前的事件有联系。也许我们可以向卢恩-米德加尔特发送额外信息。"
  npc_override_sp_cor_quests_17_1_maybe_you_ll_find_someth_d09844: "也许你会找到一些东西。"
  npc_override_sp_cor_quests_17_1_mcdonald_lab_located_sec_553765: "麦当劳实验室位于^0000FF艾音布罗克山脉01区-95-146段^000000，辛克莱实验室位于艾音布罗克山脉11区-45-156段。"
  npc_override_sp_cor_quests_17_1_me_rebellions_stay_outsi_6b543f: "我和反叛者会留在外面。阿斯会在里面。"
  npc_override_sp_cor_quests_17_1_me_well_i_m_responsible_e2ce54: "我？嗯……我负责为在这里工作的人制作和运送食物。"
  npc_override_sp_cor_quests_17_1_meals_delicious_there_no_8ced94: "饭菜很美味。而且没有人生病。"
  npc_override_sp_cor_quests_17_1_mean_there_s_no_way_53b359: "那意味着没有办法让一个人独自穿越到另一边？"
  npc_override_sp_cor_quests_17_1_meantime_i_help_out_my_798dfb: "与此同时，我必须帮助我的团队。"
  npc_override_sp_cor_quests_17_1_meantime_i_try_learn_mor_46f6d0: "与此同时，我会尝试了解更多关于里希塔乐镇的信息。"
  npc_override_sp_cor_quests_17_1_meet_navi_rebellion_crew_6f61c7: "在艾音布罗克西北区域与<NAVI>[反叛者队员]<INFO>ein_fild03,278,269,0,101,0</INFO></NAVI>见面。"
  npc_override_sp_cor_quests_17_1_menu_a_643066: "1:2的比例可能更好……不，最好不要实验。我认为你是对的。"
  npc_override_sp_cor_quests_17_1_menu_dig_70b59a: "挖。:退出。"
  npc_override_sp_cor_quests_17_1_menu_elena_6c4b1d: "艾莲娜·沃尔科娃：你说什么，你们这些不听话的傻瓜？"
  npc_override_sp_cor_quests_17_1_menu_elena_9ecc40: "艾莲娜：呵呵呵。不管这个地方有什么，我希望它能是个挑战。"
  npc_override_sp_cor_quests_17_1_menu_elena_cf0a4e: "艾莲娜·沃尔科娃：他知道这里发生了什么。让我们活捉他。"
  npc_override_sp_cor_quests_17_1_menu_elyumina_479edb: "艾露米娜：不！我是他们的研究支持者！"
  npc_override_sp_cor_quests_17_1_menu_elyumina_573b1f: "艾露米娜：别、别再叫那个可笑的名字了！"
  npc_override_sp_cor_quests_17_1_menu_elyumina_5e6d61: "艾露米娜：别、别再叫那个了！"
  npc_override_sp_cor_quests_17_1_menu_elyumina_6e2afc: "艾露米娜：……"
  npc_override_sp_cor_quests_17_1_menu_elyumina_833f4e: "艾露米娜：……是的，但其他的，我不……"
  npc_override_sp_cor_quests_17_1_menu_elyumina_8a8fc7: "艾露米娜：不。不！"
  npc_override_sp_cor_quests_17_1_menu_elyumina_a729f7: "艾露米娜：放开我！呃，我不会逃跑的！我聪明的机器和愚蠢的下属在哪里？"
  npc_override_sp_cor_quests_17_1_menu_elyumina_b6cad2: "艾露米娜：……别取笑我！啊！"
  npc_override_sp_cor_quests_17_1_menu_elyumina_f58b5c: "艾露米娜：……所以，这就是为什么……而且……"
  npc_override_sp_cor_quests_17_1_menu_elyumina_fd90bc: "艾露米娜：……明白了吗？你最好遵守你的承诺，否则我不会……"
  npc_override_sp_cor_quests_17_1_menu_emily_b22977: "艾米丽：是的队长，别担心！"
  npc_override_sp_cor_quests_17_1_menu_est_0eeb93: "艾斯特：现在我们可以进去了。"
  npc_override_sp_cor_quests_17_1_menu_find_099855: "为莫宁找一顿饭。:和莫宁聊天。"
  npc_override_sp_cor_quests_17_1_menu_i_3c232e: "我会调查的。:我现在有别的事要做。"
  npc_override_sp_cor_quests_17_1_menu_i_57a76c: "我认为这个实验室是一样的。:我不知道"
  npc_override_sp_cor_quests_17_1_menu_i_828986: "我会带来的。:发生了紧急事情。"
  npc_override_sp_cor_quests_17_1_menu_i_f4d0a6: "我要回鲁达斯。:有什么我可以帮忙的吗？"
  npc_override_sp_cor_quests_17_1_menu_jump_5d09b9: "跳过屏障。:回去。"
  npc_override_sp_cor_quests_17_1_menu_jump_8ff589: "跳过屏障。:回去。"
  npc_override_sp_cor_quests_17_1_menu_lazy_1e25a4: "莱兹：哦，要求真多！我也喜欢你这一点。"
  npc_override_sp_cor_quests_17_1_menu_lazy_6d488e: "莱兹：所以，他就像分包商的分包商。"
  npc_override_sp_cor_quests_17_1_menu_lazy_78de2b: "莱兹：去尽你最大的努力吧，伟大的科学家女士。"
  npc_override_sp_cor_quests_17_1_menu_lazy_f0c0b8: "莱兹：菲洛彭女人，你真 thorough。"
  npc_override_sp_cor_quests_17_1_menu_lazy_f937b6: "莱兹：我迫不及待想把你带到我这边。光是想想就让我兴奋！"
  npc_override_sp_cor_quests_17_1_menu_let_faf49c: "我们来做吧。:听起来像麻烦。"
  npc_override_sp_cor_quests_17_1_menu_morning_164a45: "莫宁：莫宁？这里是莫宁。"
  npc_override_sp_cor_quests_17_1_menu_morning_2a5b4d: "莫宁：冒险者说其他楼层很可怕。蘑菇……"
  npc_override_sp_cor_quests_17_1_menu_morning_4bee08: "莫宁：大家都很安静，除了你冒险者。"
  npc_override_sp_cor_quests_17_1_menu_morning_54bfee: "莫宁：………？"
  npc_override_sp_cor_quests_17_1_menu_morning_c6b6b5: "莫宁：我在想你给我讲的故事。听到那个我很难过。"
  npc_override_sp_cor_quests_17_1_menu_oh_fd7882: "哦哇，看看态度的转变。我们只需要说魔法词：副总裁。"
  npc_override_sp_cor_quests_17_1_menu_open_a26668: "开门。:进去。:退出。"
  npc_override_sp_cor_quests_17_1_menu_rebellion_eec767: "反叛者：所以，现在他们拒绝听米娜的话，而且——"
  npc_override_sp_cor_quests_17_1_menu_rekenber_2a3cab: "雷肯伯守卫：这个地方禁止外人进入。"
  npc_override_sp_cor_quests_17_1_menu_rekenber_542366: "雷肯伯守卫：这个地方是限制区。"
  npc_override_sp_cor_quests_17_1_menu_retired_7f1b01: "退役反叛者：去别的地方。这里不适合你。"
  npc_override_sp_cor_quests_17_1_menu_rookie_a839db: "新手：……别在别人面前说那种话。"
  npc_override_sp_cor_quests_17_1_menu_rookie_b4f4af: "新手：偷？那不好。"
  npc_override_sp_cor_quests_17_1_menu_rookie_c73acc: "新手：好的，干得好！别担心。我会照顾你的。"
  npc_override_sp_cor_quests_17_1_menu_rookie_d553b5: "新手：……好吧，所以，你在这里……"
  npc_override_sp_cor_quests_17_1_menu_rookie_dd92a6: "新手：……所以……啊，我明白了……"
  npc_override_sp_cor_quests_17_1_menu_rookie_edde50: "新手：但她说她知道怎么进去。"
  npc_override_sp_cor_quests_17_1_menu_take_626072: "看一看。:就拿走它。:离开它。"
  npc_override_sp_cor_quests_17_1_menu_the_3379a3: "混合比例是1:3……你在做什么？，应该是1:4。你想让实验室爆炸吗？"
  npc_override_sp_cor_quests_17_1_menu_yes_24ea61: "是的。我要走了。:我今天不能去。"
  npc_override_sp_cor_quests_17_1_menu_yes_b6ef50: "是。:还没有。"
  npc_override_sp_cor_quests_17_1_meow_2bdde4: "喵~！"
  npc_override_sp_cor_quests_17_1_mercenary_seems_know_how_ffe56a: "（这个佣兵似乎知道怎么处理那个麻烦制造者。）"
  npc_override_sp_cor_quests_17_1_mina_a0c378: "米娜？"
  npc_override_sp_cor_quests_17_1_mina_said_you_come_back_e4316b: "米娜说你可以晚点再来。对他可爱的孩子们来说，现在起床活动还太早。"
  npc_override_sp_cor_quests_17_1_mm_adventurer_don_t_act_b2c4b8: "嗯？冒险者，不要擅自行动。我知道我可以信任你，但其他人不知道。"
  npc_override_sp_cor_quests_17_1_mm_i_m_sorry_hear_6b1344: "嗯，听到那个我很难过。冒险者，如果你想加入行动，那么作为队伍的领导者，请选择准备。"
  npc_override_sp_cor_quests_17_1_mm_mina_doesn_t_think_19e069: "嗯？米娜认为你一个人做不到。请组队回来，冒险者。"
  npc_override_sp_cor_quests_17_1_mm_sure_why_if_you_25019a: "嗯……当然，为什么不呢？如果你尽可能与我们合作，那么我们可以忽略细节。"
  npc_override_sp_cor_quests_17_1_money_welfare_paychecks_470450: "有了钱和福利薪水，让某人从脆弱的家庭中消失，然后让他们的声音不被听到，不是更容易吗？"
  npc_override_sp_cor_quests_17_1_monsters_c9c5a6: "怪物！？"
  npc_override_sp_cor_quests_17_1_monsters_came_out_842e63: "怪物出来了。"
  npc_override_sp_cor_quests_17_1_more_i_learn_about_truth_d86856: "我对真相了解得越多，我就越不明白发生了什么。"
  npc_override_sp_cor_quests_17_1_most_armed_forced_join_s_2cba71: "大部分武装力量加入了施莱因，他们开始自称猎心者。"
  npc_override_sp_cor_quests_17_1_most_colleagues_who_went_a134fe: "大部分先进去的同事已经清理完毕。"
  npc_override_sp_cor_quests_17_1_most_my_crew_suffered_hu_1c1694: "我的大部分船员遭受了巨大的伤亡，而我只是羞愧地站着……"
  npc_override_sp_cor_quests_17_1_most_people_slums_hired_f2fa08: "雷肯伯雇用的贫民窟大多数人^0000FF再也无法联系上了。^000000"
  npc_override_sp_cor_quests_17_1_move_behind_me_now_a27eaf: "到我后面去！现在！"
  npc_override_sp_cor_quests_17_1_mr_lazy_please_bring_out_4f4543: "莱兹先生，请把囚犯带出来。"
  npc_override_sp_cor_quests_17_1_msg_00d9a9: "…………"
  npc_override_sp_cor_quests_17_1_msg_44c582: "…？"
  npc_override_sp_cor_quests_17_1_msg_61ce5a: "[{0}]"
  npc_override_sp_cor_quests_17_1_msg_6eae3a: "…"
  npc_override_sp_cor_quests_17_1_msg_79ef7f: "…."
  npc_override_sp_cor_quests_17_1_msg_861fa1: "{0}。"
  npc_override_sp_cor_quests_17_1_msg_8707ce: "… …"
  npc_override_sp_cor_quests_17_1_msg_93fcbf: "……"
  npc_override_sp_cor_quests_17_1_msg_babd0c: "...................."
  npc_override_sp_cor_quests_17_1_msg_e0b936: "… … …"
  npc_override_sp_cor_quests_17_1_msg_e95f89: "....."
  npc_override_sp_cor_quests_17_1_msg_f0e1ca: "........"
  npc_override_sp_cor_quests_17_1_must_been_one_devices_il_73f87b: "这一定是幻景和猎心者用来封闭入口的装置之一。"
  npc_override_sp_cor_quests_17_1_my_angela_i_ll_finally_60bac1: "我的安吉拉……我终于能再见到我的安吉拉了……"
  npc_override_sp_cor_quests_17_1_my_coworkers_i_don_t_9ecbe1: "我的同事？我不在乎那些疯子。"
  npc_override_sp_cor_quests_17_1_my_crew_working_securing_0efd41: "我的船员正在先确保门口的安全。如果你打开了，去检查另一边。"
  npc_override_sp_cor_quests_17_1_my_dog_ran_away_camp_e225b6: "我的狗从营地跑了，还没回来。我得去找它。"
  npc_override_sp_cor_quests_17_1_my_eyes_now_wide_opened_8a5fb8: "我的眼睛现在睁得大大的。"
  npc_override_sp_cor_quests_17_1_my_name_kaya_i_work_47ee9e: "我叫卡亚。我在雷肯伯部门工作。"
  npc_override_sp_cor_quests_17_1_my_name_patrick_kaufmann_07a5a8: "我叫帕特里克·考夫曼。"
  npc_override_sp_cor_quests_17_1_my_only_goal_being_succe_962822: "我唯一的目标是成功，我做了各种各样的事情。"
  npc_override_sp_cor_quests_17_1_my_research_nothing_comp_a0da39: "我的研究与沃尔、维尔那些幼稚的作品相比不值一提，不管他们叫什么名字。"
  npc_override_sp_cor_quests_17_1_my_specialty_go_big_e7726a: "我的专长是做大！"
  npc_override_sp_cor_quests_17_1_name_just_name_if_i_2d69a8: "名字只是名字。如果我被称为屎，我在和副总裁说话时会变成屎吗？"
  npc_override_sp_cor_quests_17_1_navi_cat_bullet_info_ein_05749a: "<NAVI>[子弹上的猫]<INFO>einbroch,302,329,0,101,0</INFO></NAVI>。你不觉得这是个可爱的酒吧名字吗？"
  npc_override_sp_cor_quests_17_1_navi_guard_info_sp_cor_beadfd: "<NAVI>[守卫]<INFO>sp_cor,135,147,0,101,0</INFO></NAVI>似乎有话要对贵宾说。是受伤人员的问题吗？"
  npc_override_sp_cor_quests_17_1_navi_mcdonald_laboratory_695cb3: "<NAVI>[麦当劳实验室]<INFO>ein_fild01,95,146,0,000,0</INFO></NAVI>位于艾音布罗克外区。请小心，这是个危险区域。"
  npc_override_sp_cor_quests_17_1_navi_researcher_info_sp_f3d550: "<NAVI>[研究员]<INFO>sp_cor,224,77,0,101,0</INFO></NAVI>就在庄稼旁边。你看到她了吗？"
  npc_override_sp_cor_quests_17_1_navi_rudus_info_ein_fild_74e918: "<NAVI>[鲁达斯]<INFO>ein_fild05,158,284,0,101,0</INFO></NAVI>在艾音布罗克东北田野。"
  npc_override_sp_cor_quests_17_1_navi_tents_info_sp_cor_5052ac: "西北部的<NAVI>[帐篷]<INFO>sp_cor,159,220,0,101,0</INFO></NAVI>很危险。请远离它们。东北部的<NAVI>[水道]<INFO>sp_cor,236,275,0,101,0</INFO></NAVI>也一样。"
  npc_override_sp_cor_quests_17_1_new_facility_i_must_find_57bb2a: "一个新设施……我必须找出它在哪里。可能还有更多我们不知道的事情。"
  npc_override_sp_cor_quests_17_1_new_laboratory_92acc9: "这是新实验室。"
  npc_override_sp_cor_quests_17_1_new_laboratory_i_couldn_4731ff: "一个新实验室……我无法调查它。它是一个需要很多人的新实验室，但我没能找到它。你觉得呢？你能闻到我们越来越接近了吗？"
  npc_override_sp_cor_quests_17_1_nice_meet_you_i_m_7509ac: "很高兴见到你，我是卡亚·托斯。"
  npc_override_sp_cor_quests_17_1_nice_meet_you_my_name_77f2bc: "很高兴见到你，我叫马库斯。"
  npc_override_sp_cor_quests_17_1_no_big_crowds_right_571df3: "没有大人群吧？"
  npc_override_sp_cor_quests_17_1_no_i_don_t_actually_b349fc: "不，其实我自己不去那里。有一个专门的部门负责那个。他们使用带车厢的铁轨，因为材料有毒或太大。"
  npc_override_sp_cor_quests_17_1_no_i_m_heading_waste_d623b1: "不。但我要去废物区。"
  npc_override_sp_cor_quests_17_1_no_let_me_go_now_aa7a1a: "不！让我走！现在！我无法相信我们无法避开那种武器！让我走！让我走！！"
  npc_override_sp_cor_quests_17_1_no_matter_how_much_i_1ce833: "无论我如何劝说，他们都不听。改变一个人的想法不容易。我应该和泰斯讨论一下。"
  npc_override_sp_cor_quests_17_1_no_matter_how_stupid_you_3469d9: "不管你有多笨，把手放在手腕上总是更好的，对吧？"
  npc_override_sp_cor_quests_17_1_no_matter_what_truth_i_54b100: "不管真相是什么，我不知道有第三个人和你有同样的问题。"
  npc_override_sp_cor_quests_17_1_no_my_body_strong_1e21e8: "不，我的身体很强壮。"
  npc_override_sp_cor_quests_17_1_no_need_report_me_now_634294: "但现在不需要向我报告。我的人已经代表你这么做了。"
  npc_override_sp_cor_quests_17_1_no_no_adventurer_you_don_0b7984: "不，不，冒险者。你不必做这种事。你只需要向我报告情况，然后按我告诉你的方式做。"
  npc_override_sp_cor_quests_17_1_no_no_i_admire_your_dc24e5: "不，不。我钦佩你的努力，冒险者。"
  npc_override_sp_cor_quests_17_1_no_really_just_little_bi_e59724: "不，真的，只是一点点，我迟到了吗？这都是什么，是毒品吗？"
  npc_override_sp_cor_quests_17_1_no_s_i_just_t_811bc4: "不，不是那个，我只是无法相信。呃，我太累了……"
  npc_override_sp_cor_quests_17_1_no_s_if_such_facility_337ec0: "不，不是那个。如果是这样的设施，泰斯不会知道的。"
  npc_override_sp_cor_quests_17_1_no_s_okay_i_i_3fc9b8: "不，这不好。我必须……我需要工作。"
  npc_override_sp_cor_quests_17_1_no_s_people_should_live_4b6c8a: "不，不是那个。人们应该带着好的想法生活。"
  npc_override_sp_cor_quests_17_1_no_s_very_productive_4d5991: "不，那不是很有效率。"
  npc_override_sp_cor_quests_17_1_no_s_you_re_requesting_6193a7: "不，不是那个。你在请求我们的合作，并要求我们在没有任何实际证据的情况下完全信任你。我们怎么能相信你？"
  npc_override_sp_cor_quests_17_1_no_something_definitely_413e12: "不，肯定有什么不对劲！他不是那种会^0000FF就这样停止联系我们^000000的人。"
  npc_override_sp_cor_quests_17_1_no_way_we_done_anything_041cff: "不可能！我们做了什么错事吗？"
  npc_override_sp_cor_quests_17_1_no_way_we_know_where_4702ae: "不可能……我们知道在哪里捕鱼……哪里有好蘑菇……哪里是最好的厕所位置……你们这些家伙什么都不知道。"
  npc_override_sp_cor_quests_17_1_no_we_didn_t_catch_6a85e2: "不，我们没有抓到米娜的机器。它们一直隐藏着，在睡觉。"
  npc_override_sp_cor_quests_17_1_no_well_s_alright_me_8cedca: "不？好吧，那我也无所谓。"
  npc_override_sp_cor_quests_17_1_no_who_you_really_how_2caf23: "不，你到底是谁？你怎么认识伊娃·穆勒？是伊娃派你来的吗？她怎么样？哦天哪！伊娃！伊娃怎么样？"
  npc_override_sp_cor_quests_17_1_no_wouldn_t_been_necessa_612804: "不，如果合适的人在执政，就没有必要做这样的交易！"
  npc_override_sp_cor_quests_17_1_nobody_money_pay_first_c_135306: "除了贵宾，没有人有钱坐一等舱。他可以带我们一起去。"
  npc_override_sp_cor_quests_17_1_nod_604a29: "*点头*"
  npc_override_sp_cor_quests_17_1_nope_8fe984: "……不。"
  npc_override_sp_cor_quests_17_1_nope_afd5b9: "不。"
  npc_override_sp_cor_quests_17_1_normally_we_d_all_issued_a592f7: "通常，我们都会得到通行证以便自由出入，但我们现在没有时间，这是我设法准备的最好的。"
  npc_override_sp_cor_quests_17_1_nothing_special_here_fde04c: "- 这里没什么特别的。 -"
  npc_override_sp_cor_quests_17_1_now_as_you_know_conversa_d3d338: "现在，如你所知，这次对话是商务会议，副总裁的下属不是正站在你身后吗？"
  npc_override_sp_cor_quests_17_1_now_even_if_you_actively_57299f: "现在，即使你积极与我合作，我也很难喜欢或信任这种安排。"
  npc_override_sp_cor_quests_17_1_now_good_luck_adventurer_8462d9: "现在，祝你好运，冒险者！如果我们遇到新信息，我们会联系你！"
  npc_override_sp_cor_quests_17_1_now_here_s_what_really_d4234a: "现在这才是真正重要的。如果你不告诉我们真正发生了什么，你就无法获得他们的合作。"
  npc_override_sp_cor_quests_17_1_now_i_formally_introduce_84b650: "现在我可以正式介绍自己了。"
  npc_override_sp_cor_quests_17_1_now_i_t_think_anything_799ea7: "现在我想不到别的了，我心情不好。我很快会回去工作……"
  npc_override_sp_cor_quests_17_1_now_i_think_about_her_34c395: "现在我想起来，她的眼睛不正常。她看起来像个疯子。"
  npc_override_sp_cor_quests_17_1_now_let_s_all_go_c82b76: "现在，让我们都去<NAVI>[里希塔乐镇]<INFO>lighthalzen,259,215,0,101,0</INFO></NAVI>。"
  npc_override_sp_cor_quests_17_1_now_let_s_get_down_bc7e1e: "现在，让我们谈正事，好吗？请把他送到这里来，莱兹先生。"
  npc_override_sp_cor_quests_17_1_now_let_s_head_these_36f716: "现在让我们前往这些新实验室。可能还有很多我们可以在那里发现的。"
  npc_override_sp_cor_quests_17_1_now_look_pile_documents_533cdc: "现在，看看这^0000CD一堆文件^000000。你不必读得太仔细。只要看看封面。"
  npc_override_sp_cor_quests_17_1_now_my_foot_like_other_fb0c3b: "目前，我的脚是这样的，但另一条腿很快就会改变。"
  npc_override_sp_cor_quests_17_1_now_s_finally_elena_volk_15371e: "现在，终于轮到艾莲娜·沃尔科娃发光了！"
  npc_override_sp_cor_quests_17_1_now_turned_into_matter_t_ee8596: "现在这已变成信任问题，不仅仅是关于人员失踪的问题！"
  npc_override_sp_cor_quests_17_1_now_we_all_go_together_f7d14b: "现在，我们能一起去找帕特吗？里希塔乐镇在东边。人们常说那是^0000CD贫民窟。^000000当然，我们的贵宾已经知道这一切了，对吧？"
  npc_override_sp_cor_quests_17_1_now_we_know_what_place_a94ebb: "既然我们知道那是什么地方，我们就不能置之不理。"
  npc_override_sp_cor_quests_17_1_now_we_should_go_navi_6d5da3: "现在我们应该去<NAVI>[贫民窟]<INFO>lighthalzen,336,266,0,101,0</INFO></NAVI>。"
  npc_override_sp_cor_quests_17_1_now_we_t_get_because_2adc21: "但目前，我们进不去，因为门是关着的。"
  npc_override_sp_cor_quests_17_1_now_you_know_let_him_5ee847: "但现在你知道了，让他处理剩下的事。"
  npc_override_sp_cor_quests_17_1_now_you_re_going_too_f8fc44: "现在你太过分了！"
  npc_override_sp_cor_quests_17_1_oh_5235ff: "哦！"
  npc_override_sp_cor_quests_17_1_oh_78a2fc: "哦……"
  npc_override_sp_cor_quests_17_1_oh_about_you_need_profes_94a8f8: "哦。关于那个。你需要专业的治疗和护理。"
  npc_override_sp_cor_quests_17_1_oh_adventurer_long_time_e15bec: "哦，冒险者！好久不见！其实，我想问你一件事。是关于米娜的。"
  npc_override_sp_cor_quests_17_1_oh_aren_t_you_vip_1be6f3: "哦，你不是^0000CD贵宾^000000吗？"
  npc_override_sp_cor_quests_17_1_oh_did_you_come_pick_9963dd: "哦……你是来取材料的吗？我已经尽力安排了，但我无法分类，因为我不知道那是什么。"
  npc_override_sp_cor_quests_17_1_oh_don_t_worry_about_e1cd42: "哦，那个？别担心，那是我用来分散人们注意力的名字。好了，现在你认识我了。哦对了……算了，你不需要知道那个。"
  npc_override_sp_cor_quests_17_1_oh_don_t_worry_s_be8268: "哦，别担心，这算是我们特工的通行证。当然，你不需要知道更多。"
  npc_override_sp_cor_quests_17_1_oh_economical_what_s_wro_099f36: "哦？不经济吗？怎么了，用这个名字可以节省时间。"
  npc_override_sp_cor_quests_17_1_oh_he_s_one_who_db1818: "哦，他就是那个一直在找帕特里克的人。"
  npc_override_sp_cor_quests_17_1_oh_he_wasn_t_able_f3d8b1: "哦~他没能休息，直到年底。雷肯伯真是个地方~"
  npc_override_sp_cor_quests_17_1_oh_hello_there_my_name_bb5b59: "哦，你好！我叫阿斯，来自雷肯伯安保。"
  npc_override_sp_cor_quests_17_1_oh_huh_i_thought_vice_24b6dd: "哦……嗯，我以为副总裁让你让他们安息？"
  npc_override_sp_cor_quests_17_1_oh_i_don_t_know_8b4ae1: "哦，那个？我还不知道，但我跟着副总裁来这里就是为了找出答案。"
  npc_override_sp_cor_quests_17_1_oh_i_know_wasn_t_7376fc: "哦我知道！不是农业研究吗？"
  npc_override_sp_cor_quests_17_1_oh_i_ll_let_you_8d75fb: "哦！我会告诉你我在这里发现了什么。"
  npc_override_sp_cor_quests_17_1_oh_i_see_so_you_0af5ef: "哦我明白了，所以你不相信我？"
  npc_override_sp_cor_quests_17_1_oh_i_thought_vice_presid_486ce6: "哦……，我以为副总裁让你让他们安息？"
  npc_override_sp_cor_quests_17_1_oh_i_thought_you_rebelli_64f110: "哦……我以为你也是反叛者成员。"
  npc_override_sp_cor_quests_17_1_oh_i_ve_been_hit_f42b60: "哦，我被击中了！我们应该逃跑！"
  npc_override_sp_cor_quests_17_1_oh_i_when_i_m_15c75a: "哦，我工作的时候可以做那个！"
  npc_override_sp_cor_quests_17_1_oh_my_i_t_believe_bfea13: "哦天哪~我无法相信。非常感谢。恐怕我们很难联系到你……"
  npc_override_sp_cor_quests_17_1_oh_my_thank_you_609b74: "哦天哪……谢谢你……"
  npc_override_sp_cor_quests_17_1_oh_my_vice_president_wha_d7cd95: "哦天哪，副总裁。你在这个地方做什么……哦，你想知道什么？"
  npc_override_sp_cor_quests_17_1_oh_no_mother_i_m_2e77cd: "哦不~妈妈~我被惩罚了~"
  npc_override_sp_cor_quests_17_1_oh_no_you_still_think_b4c85c: "哦不~你还认为我是骗子。"
  npc_override_sp_cor_quests_17_1_oh_place_so_peaceful_acf21b: "哦，这个地方真平静。"
  npc_override_sp_cor_quests_17_1_oh_please_stop_talking_32bfa5: "哦拜托！别说了！"
  npc_override_sp_cor_quests_17_1_oh_really_i_didn_t_98ed30: "哦，真的吗？我不知道，因为我以前从未见过你的脸。"
  npc_override_sp_cor_quests_17_1_oh_reporting_site_wasn_t_ccc8f5: "哦！报告现场看起来不太好！"
  npc_override_sp_cor_quests_17_1_oh_s_possible_186b24: "哦……有可能。"
  npc_override_sp_cor_quests_17_1_oh_s_wrong_i_d_9fef0b: "哦，那不对。我会写老板昏倒了，送了饮酒礼物。呃……听起来也很奇怪吗？"
  npc_override_sp_cor_quests_17_1_oh_sorry_i_m_senior_04606f: "哦，抱歉，我是雷肯伯高级安保官员，阿斯。"
  npc_override_sp_cor_quests_17_1_oh_sudden_should_i_seek_b2a7ca: "哦……这很突然。在我被称为骗子之后，我应该寻求副总裁的合作吗？"
  npc_override_sp_cor_quests_17_1_oh_sure_i_lunch_menu_dc2e23: "哦当然，我有一份来自邻居们的午餐菜单调查……你想用这个作为事实吗？"
  npc_override_sp_cor_quests_17_1_oh_there_i_found_16c186: "哦，找到了。我找到了。"
  npc_override_sp_cor_quests_17_1_oh_there_more_techniques_196609: "哦……还有更多技术吗？很高兴听到。"
  npc_override_sp_cor_quests_17_1_oh_there_they_cd92d7: "哦，他们在那里。"
  npc_override_sp_cor_quests_17_1_oh_there_you_gather_arou_e9b0cd: "哦，你在这里！集合！"
  npc_override_sp_cor_quests_17_1_oh_they_re_just_busy_dd29a0: "哦，他们只是很忙！"
  npc_override_sp_cor_quests_17_1_oh_vice_president_please_122c39: "哦副总裁！！请接受我的问候。"
  npc_override_sp_cor_quests_17_1_oh_wait_minute_297089: "哦，那个？等一下……"
  npc_override_sp_cor_quests_17_1_oh_welcome_back_823ae6: "哦！欢迎回来！"
  npc_override_sp_cor_quests_17_1_oh_welcome_back_adventur_bbcaa7: "哦，欢迎回来冒险者。来。考夫曼，你找到他了吗？"
  npc_override_sp_cor_quests_17_1_oh_what_coincidence_he_s_8faa2e: "哦，真巧。他也来自里希塔乐镇贫民窟！"
  npc_override_sp_cor_quests_17_1_oh_what_happened_e21f57: "哦，发生了什么事？"
  npc_override_sp_cor_quests_17_1_oh_woah_hello_s_ok_a4c724: "哦，哇，你好？？没关系我不介意！"
  npc_override_sp_cor_quests_17_1_oh_you_look_younger_than_df5f3b: "哦，你看起来比我年轻？啊哈哈哈！我想我真的开始喜欢这家伙了？"
  npc_override_sp_cor_quests_17_1_oh_you_re_adventurer_did_4ffe05: "哦你是冒险者？是泰斯叫你的吗？"
  npc_override_sp_cor_quests_17_1_oh_you_re_going_navi_6d22c2: "哦，你要去<NAVI>[废物区]<INFO>sp_rudus,227,351,0,101,0</INFO></NAVI>？嗯，祝你好运。我想你会需要它的。"
  npc_override_sp_cor_quests_17_1_oh_you_re_here_i_35b892: "哦你来了。我听说侦察队已经控制了铁路运输路线。"
  npc_override_sp_cor_quests_17_1_oh_you_saved_us_my_423034: "哦，你救了我们！我叫马库斯。你在这里做什么？"
  npc_override_sp_cor_quests_17_1_ohh_i_m_really_curious_79a1a7: "哦~我真的很好奇~"
  npc_override_sp_cor_quests_17_1_okay_challenge_accepted_3d1521: "好的！接受挑战。"
  npc_override_sp_cor_quests_17_1_okay_thank_you_very_much_9bda6b: "好的，非常感谢，贵宾。"
  npc_override_sp_cor_quests_17_1_okay_then_we_ll_get_76cb27: "好的。那我们就走了！"
  npc_override_sp_cor_quests_17_1_okay_well_there_s_nothin_6c064c: "好的，这里什么都没有，所以回去吧！"
  npc_override_sp_cor_quests_17_1_one_employee_here_said_o_08033a: "这里的一个员工说我的一个远房亲戚去世了，留下了一大笔遗产。"
  npc_override_sp_cor_quests_17_1_one_responsible_schlein_697ff0: "而对此负责的是施莱因，穿着新制服出现。"
  npc_override_sp_cor_quests_17_1_only_adventurers_you_mus_179a3a: "只有冒险者吗？你一定感觉很糟糕吧？哈哈哈"
  npc_override_sp_cor_quests_17_1_only_here_2e551d: "只有这里吗？"
  npc_override_sp_cor_quests_17_1_only_more_guards_ended_u_dce04c: "只有更多守卫被牺牲，我们没有取得任何成功。"
  npc_override_sp_cor_quests_17_1_only_part_s_legal_course_f22577: "只有合法的部分，当然。但我们会确保你可以保留它。所以，告诉我们关于这个地方和你同事的一切。"
  npc_override_sp_cor_quests_17_1_only_person_who_you_you_948289: "而唯一能做到的人就是你。你打败了EL1_A17T。当然，我会和你一起去，但我只会在那里收集他们的新数据。"
  npc_override_sp_cor_quests_17_1_only_solution_i_think_ex_76358a: "我能想到的唯一解决方案是把他们的电池耗尽直到他们停止工作。"
  npc_override_sp_cor_quests_17_1_only_we_access_more_data_66d6ef: "我们不仅可以获得更多数据，而且质量将远高于外人可获得的。"
  npc_override_sp_cor_quests_17_1_ooh_you_cannot_transferr_a976d8: "哦……除非你收到^0000FF不寻常的请求，^000000否则至少一年内不能被调动。"
  npc_override_sp_cor_quests_17_1_oooh_i_tell_grapes_happy_8980b6: "哦哦，我可以看出葡萄现在很开心！"
  npc_override_sp_cor_quests_17_1_oooh_i_tell_green_beans_87e993: "哦哦，我可以看出青豆现在很开心！"
  npc_override_sp_cor_quests_17_1_oooh_i_tell_pumpkins_hap_58bf61: "哦哦，我可以看出南瓜现在很开心！"
  npc_override_sp_cor_quests_17_1_oooh_someone_else_here_l_7088e1: "哦哦！这里还有其他人很有想象力。"
  npc_override_sp_cor_quests_17_1_ooooh_what_reason_i_m_0b1502: "哦哦~原因是什么~我很好奇~"
  npc_override_sp_cor_quests_17_1_oops_sorry_now_rookie_go_af9b16: "哎呀，抱歉。现在，新手，祝你好运。"
  npc_override_sp_cor_quests_17_1_operation_we_ve_only_pic_49dc4a: "这次行动，我们只挑选了足够强大以自保的士兵，比如我。请以^0000CD1人队伍^000000回来。"
  npc_override_sp_cor_quests_17_1_other_rebellion_members_10df67: "其他反叛者成员已经在寻找入口。如果你不介意，你能去看看他们吗？"
  npc_override_sp_cor_quests_17_1_other_rebellion_members_c9d027: "其他反叛者成员已经进入。"
  npc_override_sp_cor_quests_17_1_other_rebellion_members_d1bc60: "其他反叛者成员已经在寻找入口。如果你不介意，冒险者，去找找他们。"
  npc_override_sp_cor_quests_17_1_our_adventurer_asked_goo_c8e13b: "我们的冒险者问了一个好问题。他们几乎都来自贫民窟。在雷肯伯，他们提供住宿，包括膳食和住宿，你几乎不需要花任何钱。"
  npc_override_sp_cor_quests_17_1_our_crops_good_now_messi_20f853: "我们的庄稼目前很好。太频繁地摆弄它们对它们不好。它们可能看起来不是，但它们很敏感。"
  npc_override_sp_cor_quests_17_1_our_crops_need_tended_ev_83324b: "我们的庄稼每天都需要照料。请再来帮助我们。"
  npc_override_sp_cor_quests_17_1_our_guard_here_vip_imagi_a69a71: "我们这里的守卫和贵宾没有想象力？我知道你不看眼前的东西，但看看这里的现实情况。"
  npc_override_sp_cor_quests_17_1_our_only_job_8d2757: "这是我们唯一的工作！"
  npc_override_sp_cor_quests_17_1_our_operation_also_inclu_89ea37: "我们的行动也包括你，冒险者。我知道你有多厉害，所以我向其他人推荐了你。你会和我们一起做的，对吗？"
  npc_override_sp_cor_quests_17_1_our_plan_action_i_believ_e58248: "随着我们计划的实施，我相信我们有更美好的未来。"
  npc_override_sp_cor_quests_17_1_our_plan_i_m_cooperating_228f06: "那是我们的计划。我正在与这些人合作。"
  npc_override_sp_cor_quests_17_1_our_vip_chosen_very_suit_3737bd: "我们的贵宾为我们的调查选择了一个非常合适的候选人。我为你鼓掌。这是个好主意。"
  npc_override_sp_cor_quests_17_1_pa_patrick_kaufmann_patr_25c5b4: "帕……帕特里克·考夫曼……帕特里克……嗯……啊！我想起来了！"
  npc_override_sp_cor_quests_17_1_pa_who_patrick_kaufmann_61c8e9: "帕……谁？帕特里克·考夫曼？那是谁？我不知道……哦！你问过<NAVI>[萨米]<INFO>rgsr_in,12,46,0,000,0</INFO></NAVI>了吗？"
  npc_override_sp_cor_quests_17_1_paperwork_5c8a8f: "文书工作？"
  npc_override_sp_cor_quests_17_1_pat_didn_t_get_neither_b4ed78: "但帕特没有得到这两个原因中的任何一个。这真的是实验室吗？"
  npc_override_sp_cor_quests_17_1_pat_probably_worked_hard_b54367: "帕特可能努力工作以获得摆脱贫困的机会，过上更好的生活。他想重新开始。"
  npc_override_sp_cor_quests_17_1_pat_s_home_where_pat_d21726: "这是帕特的家。这是帕特第一次与雷肯伯接触并遇到工作人员的地方。"
  npc_override_sp_cor_quests_17_1_pat_who_df464c: "帕特，谁？"
  npc_override_sp_cor_quests_17_1_path_we_took_you_adventu_2543e2: "和你一起走过的路径对我来说是一种新鲜的感觉。"
  npc_override_sp_cor_quests_17_1_patrick_facility_mainten_28bed9: "帕特里克在设施维护部门？我不知道。这里没有人做他们通常的工作。当我来到这里时，我被分配了不同的工作。"
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_don_t_y_830e99: "帕特里克·考夫曼？你不是指帕特里克·杨吧？"
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_facilit_6a5e84: "帕特里克·考夫曼。设施维护官员。"
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_i_know_2537fe: "帕特里克·考夫曼……我认识他。他是我的好朋友。他的手很粗糙，但工作又快又准。"
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_no_you_892985: "帕特里克·考夫曼……？不，但你是指帕特里克·杨，对吧？"
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_s_brace_046a1c: "这是帕特里克·考夫曼的手镯……我们回<NAVI>[卡亚]<INFO>sp_cor,136,146,0,101,0</INFO></NAVI>那里吧。"
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_transfe_965e4e: "帕特里克·考夫曼。调动代码12-4332。"
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_yes_you_f0dfab: "帕特里克……考夫曼。是的，已确认。"
  npc_override_sp_cor_quests_17_1_patrick_same_department_89bc21: "帕特里克来自同一个部门，所以对他来说可能也一样。"
  npc_override_sp_cor_quests_17_1_payments_also_confirmed_9eb4fc: "付款也确认为每月一次。"
  npc_override_sp_cor_quests_17_1_people_materials_left_be_524537: "在匆忙逃离中留下的人和材料很可能是好人留下的。"
  npc_override_sp_cor_quests_17_1_people_who_healthy_body_25c8f9: "身体健康且没有家人的人。其中，为什么他们只挑最穷的？"
  npc_override_sp_cor_quests_17_1_people_who_made_these_do_6a1b48: "制作这些文件的人对帕特一无所知。这份名单上不止一两个人。你真的应该只听一个人的吗？"
  npc_override_sp_cor_quests_17_1_people_your_team_kind_pe_e550da: "你团队中的人是不会失踪的那种人。"
  npc_override_sp_cor_quests_17_1_perfect_end_88179d: "完美到最后。"
  npc_override_sp_cor_quests_17_1_perfect_i_had_hoped_you_13637d: "完美，我希望你会这么说。很高兴看到你不再生气了。所以敞开心扉~别生气~慢慢呼吸~呼气~"
  npc_override_sp_cor_quests_17_1_perform_last_unit_check_2594c3: "在搜索前进行最后一次单位检查。"
  npc_override_sp_cor_quests_17_1_perhaps_someone_didn_t_w_a4edbb: "也许有人不想让你知道真相，故意删除了这些细节。否则它会显示在原始文件中。"
  npc_override_sp_cor_quests_17_1_perhaps_they_escaped_man_b3ed55: "也许他们^0000FF逃到了宅邸。^000000"
  npc_override_sp_cor_quests_17_1_perhaps_you_don_t_know_4cdaf4: "也许你不知道，但这个^0000FF实验室在进行非法实验。^000000"
  npc_override_sp_cor_quests_17_1_person_front_me_8dfa9e: "我前面的人？"
  npc_override_sp_cor_quests_17_1_person_responsible_all_ae5dc0: "这就是这一切的负责人吗？"
  npc_override_sp_cor_quests_17_1_person_who_abandoned_me_28742d: "抛弃我的人没想到我还活着。"
  npc_override_sp_cor_quests_17_1_pick_names_list_randomly_413749: "从名单上随机挑一个。如果我选一个，你会说我后来操纵了结果。"
  npc_override_sp_cor_quests_17_1_place_adults_only_3873e5: "这个地方只限成人。"
  npc_override_sp_cor_quests_17_1_place_bit_chaotic_rebell_959332: "这个地方有点混乱，但反叛者们更喜欢这里。"
  npc_override_sp_cor_quests_17_1_place_busy_guests_light_fa145f: "这个地方是给忙碌的客人喝一杯的。请自便。"
  npc_override_sp_cor_quests_17_1_place_filled_so_many_unp_a46db5: "这个地方充满了太多令人不快的惊喜，以至于我不断提醒自己要警惕我看到的一切。"
  npc_override_sp_cor_quests_17_1_place_inappropriate_vice_b019b5: "这个地方不适合副总裁。很难守卫。人们很容易聚集在一起。"
  npc_override_sp_cor_quests_17_1_place_incredibly_nice_lo_00d3de: "这个地方看起来非常好，很难相信他们在这里做实验。即使我也想住在这样的地方。"
  npc_override_sp_cor_quests_17_1_place_just_dump_b4cbcc: "这个地方只是个垃圾场。"
  npc_override_sp_cor_quests_17_1_place_memorial_dungeon_1e1353: "^4D4DFF这个地方是纪念地牢。"
  npc_override_sp_cor_quests_17_1_place_reserved_those_who_af4e66: "这个地方是为那些想安静交谈的人保留的。"
  npc_override_sp_cor_quests_17_1_place_restricted_outside_f375f7: "这个地方禁止外人进入，请离开。"
  npc_override_sp_cor_quests_17_1_place_seems_like_dead_en_a4a0e0: "这个地方看起来像个死胡同。"
  npc_override_sp_cor_quests_17_1_place_used_as_base_while_f02d10: "这个地方将在你执行其他任务时用作基地。"
  npc_override_sp_cor_quests_17_1_place_very_dangerous_com_bda86e: "这个地方非常危险。等你足够强大以保护自己时再回来。"
  npc_override_sp_cor_quests_17_1_places_like_prone_accide_09cd30: "像这样做地方容易发生普通反叛者成员无法处理的事故。"
  npc_override_sp_cor_quests_17_1_plan_i_told_our_soldiers_0523cf: "那是计划。我告诉我们的士兵不要伤害任何人，并保持警惕。他们不会轻率地战斗。"
  npc_override_sp_cor_quests_17_1_please_before_he_gives_m_91dc7b: "求你了！在他让我心脏病发作之前！"
  npc_override_sp_cor_quests_17_1_please_careful_i_know_yo_97240c: "请小心。我知道你会做得很好。"
  npc_override_sp_cor_quests_17_1_please_come_back_after_d_4d56a9: "请在黎明后回来，等米娜的孩子们醒来，开始又一个充满活力的一天！"
  npc_override_sp_cor_quests_17_1_please_come_back_after_d_81bd08: "请在黎明后回来。谢谢。"
  npc_override_sp_cor_quests_17_1_please_contact_operation_8b3e98: "请联系行动小组。"
  npc_override_sp_cor_quests_17_1_please_excuse_me_26d67e: "请原谅我。"
  npc_override_sp_cor_quests_17_1_please_form_party_try_ag_b47945: "请组队后再试一次。^000000"
  npc_override_sp_cor_quests_17_1_please_gather_around_let_218f05: "请集合~让我们检查一下人数！卡亚·托斯！卡亚·托斯？"
  npc_override_sp_cor_quests_17_1_please_give_me_few_minut_3d27cc: "……请给我几分钟考虑我的选择。"
  npc_override_sp_cor_quests_17_1_please_handle_heart_hunt_df74aa: "请处理15个^0000FF猎心者贝拉雷斯和猎心者萨纳雷斯。^000000"
  npc_override_sp_cor_quests_17_1_please_honey_you_re_aski_a31666: "求你了亲爱的！你没问重要的问题。有什么规定禁止我的儿子联系我们吗？自从我的孩子被雇用的那天起我就没有联系过，我自己甚至联系不上他……"
  npc_override_sp_cor_quests_17_1_please_hunt_down_each_he_a41195: "请猎杀15个猎心者。"
  npc_override_sp_cor_quests_17_1_please_look_if_you_need_02f39e: "请看一看。如果你需要什么，告诉我！"
  npc_override_sp_cor_quests_17_1_please_make_sure_you_all_4f3b0b: "请确保你完成所有这些。"
  npc_override_sp_cor_quests_17_1_please_note_any_abnormal_3139a0: "^FF0000请注意，实例内任何异常的怪物处理，如驯服，不被视为正常行为，可能会阻碍实例进度。^000000"
  npc_override_sp_cor_quests_17_1_please_note_you_t_clear_4a50c5: "^ff0000请注意，如果你试图驯服怪物或进行任何其他不相关的怪物活动，你无法清除这个地牢。^000000"
  npc_override_sp_cor_quests_17_1_please_reconsider_vice_p_03dcae: "请 reconsider，副总裁。"
  npc_override_sp_cor_quests_17_1_please_return_back_soon_447945: "请尽快回来。"
  npc_override_sp_cor_quests_17_1_please_say_yes_let_me_974ae0: "请说是。让我跟着你。我等不及要离开这家伙了。"
  npc_override_sp_cor_quests_17_1_please_stay_here_i_check_4b843a: "请待在这里，我会检查周围。"
  npc_override_sp_cor_quests_17_1_please_take_care_cce3d8: "请保重。"
  npc_override_sp_cor_quests_17_1_please_talk_85a23e: "请说话。"
  npc_override_sp_cor_quests_17_1_please_tell_lucky_4442d1: "请告诉幸运。"
  npc_override_sp_cor_quests_17_1_please_think_kaufmann_wh_d7ec2f: "但请在可能的时候想想考夫曼。"
  npc_override_sp_cor_quests_17_1_please_think_over_vice_p_8238d8: "请 reconsider，副总裁！"
  npc_override_sp_cor_quests_17_1_please_wait_minute_4fef14: "请等一下。"
  npc_override_sp_cor_quests_17_1_please_wait_moment_lazy_1a3c8a: "请等一下，莱兹"
  npc_override_sp_cor_quests_17_1_plus_we_might_able_get_2d4056: "另外我们可能无法马上回来，所以可能会变得复杂。"
  npc_override_sp_cor_quests_17_1_preparation_operation_ye_ce63b2: "行动准备尚未完成，或者你的队伍正在进行另一次行动。"
  npc_override_sp_cor_quests_17_1_president_gave_me_his_fu_cd7ba7: "总统给了我这件事的全部权力。"
  npc_override_sp_cor_quests_17_1_president_give_you_permi_016635: "总统会给你许可。"
  npc_override_sp_cor_quests_17_1_prison_jail_s_prisoners_8ba255: "监狱。牢房。是给囚犯的……这是什么地方？！"
  npc_override_sp_cor_quests_17_1_problem_we_t_use_force_773f09: "问题是。我们不能对他们使用武力。我们该怎么办？"
  npc_override_sp_cor_quests_17_1_processing_refining_vege_4c1977: "加工和提炼蔬菜……用这些……他们想做什么？？他们试图解决饥饿问题吗？"
  npc_override_sp_cor_quests_17_1_prohibited_go_further_pl_6b78c7: "禁止继续前进，请后退。"
  npc_override_sp_cor_quests_17_1_provide_us_information_a_66f603: "并提供关于你同事的信息，他们只是你的商业伙伴。在这种情况下，你可以保留你的研究，尽管能力有限。"
  npc_override_sp_cor_quests_17_1_put_simply_our_affiliate_93af85: "简单来说，我们的附属企业研究所雷根舒姆被一大群敌人占领。"
  npc_override_sp_cor_quests_17_1_question_reliable_958bb8: "问题是，这可靠吗？"
  npc_override_sp_cor_quests_17_1_quite_strange_unfamiliar_e09f07: "这对我来说相当奇怪和陌生。"
  npc_override_sp_cor_quests_17_1_ready_20c7c5: "准备"
  npc_override_sp_cor_quests_17_1_really_1acc34: "真的吗？！"
  npc_override_sp_cor_quests_17_1_really_e7da47: "真的吗？"
  npc_override_sp_cor_quests_17_1_really_help_if_someone_a_55e345: "如果有像你这么强的人加入我们，真的会有帮助。"
  npc_override_sp_cor_quests_17_1_really_rekenber_i_i_m_df8c76: "真的……雷肯伯……我……我现在在这里……！"
  npc_override_sp_cor_quests_17_1_really_then_i_don_t_202be7: "真的吗？那我什么都不知道。"
  npc_override_sp_cor_quests_17_1_really_you_d_me_if_e0be83: "真的……你愿意为我做那个……如果我们早点认识，我们会成为长久的朋友。如果你需要任何帮助，告诉我。"
  npc_override_sp_cor_quests_17_1_regenschirm_lab_back_rek_dbbb7d: "雷根舒姆实验室，在雷肯伯，曾涉及类似的实验并引起了骚动。"
  npc_override_sp_cor_quests_17_1_rekenber_explain_68a409: "雷肯伯，^0000FF解释！^000000"
  npc_override_sp_cor_quests_17_1_rekenber_missing_list_d68cf1: "雷肯伯……失踪名单……？"
  npc_override_sp_cor_quests_17_1_rekenber_roads_wide_glea_0c1e13: "雷肯伯的道路宽阔而闪耀~每个人都知道施瓦茨瓦尔德共和国~"
  npc_override_sp_cor_quests_17_1_related_laboratory_s_sec_e7c616: "这与实验室的安全有关。"
  npc_override_sp_cor_quests_17_1_requesting_help_analyzin_63d99a: "请求帮助和分析文书工作是两回事。"
  npc_override_sp_cor_quests_17_1_requires_large_workforce_ac6a94: "建造研究设施需要大量劳动力和材料。即使建成后，材料仍应不断运入。"
  npc_override_sp_cor_quests_17_1_research_experimentation_ca3f85: "研究和实验并不总是安全的。我以为我会没事，但最终我无法避免。"
  npc_override_sp_cor_quests_17_1_researcher_named_elyumin_c8904f: "那个名叫^0000CD艾露米娜^000000的研究员一定做了这件事。我们马上追她！"
  npc_override_sp_cor_quests_17_1_reservation_instance_fai_f7a70c: "实例'{0}'的预订由于活动实例而失败。"
  npc_override_sp_cor_quests_17_1_rest_waiting_they_ll_com_885dd7: "其余的人会等待，当我们发出信号时，他们会进来。"
  npc_override_sp_cor_quests_17_1_results_same_no_matter_h_b74162: "无论检查多少次，结果都是一样的。我们还有很多其他工作要做。"
  npc_override_sp_cor_quests_17_1_right_fbc63d: "对。"
  npc_override_sp_cor_quests_17_1_right_isn_t_weird_you_9454ee: "对吧？你不也觉得奇怪吗？"
  npc_override_sp_cor_quests_17_1_right_otherwise_vice_pre_131b47: "对吧？否则，副总裁带来的就不是反叛者，而是守卫了。"
  npc_override_sp_cor_quests_17_1_right_s_also_rude_048e38: "对吧？这也很粗鲁。"
  npc_override_sp_cor_quests_17_1_roger_then_i_discuss_str_daefe8: "收到。那我将和艾斯特讨论策略。"
  npc_override_sp_cor_quests_17_1_romance_thrills_hehe_we_019d4e: "浪漫和刺激，呵呵。我们一直等待这个梦想实现。"
  npc_override_sp_cor_quests_17_1_rookie_did_great_job_i_4dcbc6: "新手做得很好。我不知道他这么擅长说服。"
  npc_override_sp_cor_quests_17_1_rookie_president_s_soldi_3da310: "新手和总统的士兵，叫做翅膀什么的，正准备审问他。"
  npc_override_sp_cor_quests_17_1_route_hasn_t_been_secure_a9abdb: "路线尚未确保安全。你为什么不让你的队长准备路线？"
  npc_override_sp_cor_quests_17_1_s_24962f: "就是这样。"
  npc_override_sp_cor_quests_17_1_s_all_information_about_04e149: "这就是关于帕特的所有信息。"
  npc_override_sp_cor_quests_17_1_s_all_my_fault_a4453e: "都是我的错！"
  npc_override_sp_cor_quests_17_1_s_already_known_our_neig_4815df: "我们的邻居已经知道雷肯伯在进行非法实验。也许这份名单上的人也可能参与其中。"
  npc_override_sp_cor_quests_17_1_s_alright_you_need_take_5f7596: "没关系，你也需要休息，冒险者。"
  npc_override_sp_cor_quests_17_1_s_also_very_good_deceive_8c99cc: "欺骗别人也很好。谁会怀疑一个游客？对吧？"
  npc_override_sp_cor_quests_17_1_s_another_day_let_s_90f57a: "但那是改天的事。让我们专注于眼前的任务。"
  npc_override_sp_cor_quests_17_1_s_because_angry_research_35af5a: "都是因为那个逃跑的愤怒研究员。如你所见，我们还没找到他。他像鳗鱼一样滑溜。"
  npc_override_sp_cor_quests_17_1_s_because_i_m_only_139bb8: "那是因为我是实验室里唯一的机械师。我不在乎除了我的机器以外的任何事情……"
  npc_override_sp_cor_quests_17_1_s_been_while_since_i_77eb49: "我已经很久没有这么兴奋了。"
  npc_override_sp_cor_quests_17_1_s_building_top_left_our_0f16c0: "它在我们总部左上角的<NAVI>[里希塔乐镇]<INFO>lighthalzen,56,270,0,101,0</INFO></NAVI>的建筑里。"
  npc_override_sp_cor_quests_17_1_s_closed_inside_856b3a: "它从里面锁着。"
  npc_override_sp_cor_quests_17_1_s_common_person_list_a69a40: "这不是名单上的普通人。"
  npc_override_sp_cor_quests_17_1_s_correct_2a48a0: "没错。"
  npc_override_sp_cor_quests_17_1_s_dangerous_go_alone_6200df: "独自去很危险。"
  npc_override_sp_cor_quests_17_1_s_dangerous_here_move_ov_b6893f: "这里很危险。移到安全区域！"
  npc_override_sp_cor_quests_17_1_s_dangerous_moment_becau_b8835b: "目前很危险，因为矿井关闭了。"
  npc_override_sp_cor_quests_17_1_s_dangerous_you_place_li_6cb1c6: "你待在这种地方很危险。即使对经验丰富的人来说。请下次再来。"
  npc_override_sp_cor_quests_17_1_s_easy_recognize_person_d5302d: "从一个人的性格和语气很容易认出一个人。任何人都知道，但我只要看你的脸就能看出来。"
  npc_override_sp_cor_quests_17_1_s_elyumina_i_t_they_cccdf5: "是艾露米娜，我做不到！他们配备了高科技机器学习模块。"
  npc_override_sp_cor_quests_17_1_s_elyumina_s_elyumina_s_517fd2: "是艾露米娜的！艾露米娜的机器！还有陷阱！……它们在紧急情况下会进入低功耗隐身模式。现在是它们重新出现并开始肆虐的时候了。"
  npc_override_sp_cor_quests_17_1_s_est_9528da: "不是那样的，艾斯特。"
  npc_override_sp_cor_quests_17_1_s_familiar_name_patrick_f09c68: "是个熟悉的名字……帕特里克……帕特里克……你在说那个打扫实验室的帕特吗？"
  npc_override_sp_cor_quests_17_1_s_get_out_get_out_86eabb: "就是这样！出去！现在出去！"
  npc_override_sp_cor_quests_17_1_s_giant_sewer_if_you_9815be: "这是一个巨大的下水道。如果你沿着下水道走，你会发现里面有一个巨大的污水处理厂。"
  npc_override_sp_cor_quests_17_1_s_good_hear_8b7c6f: "很高兴听到。"
  npc_override_sp_cor_quests_17_1_s_good_idea_then_me_568543: "好主意。那我和你一起去辛克莱实验室。"
  npc_override_sp_cor_quests_17_1_s_how_we_re_able_0a88e3: "这就是我们如何为帕特提供生活。但奇怪的是我们还没有收到他的消息。"
  npc_override_sp_cor_quests_17_1_s_i_only_categorize_larg_637e40: "不是那样的。我只分类大型材料或技术设备。"
  npc_override_sp_cor_quests_17_1_s_illegal_laboratory_you_0cf295: "这是一个非法实验室。你知道非法实验室是什么吗？"
  npc_override_sp_cor_quests_17_1_s_impressive_how_they_ve_15c288: "他们能让我们在酒吧里和所有人一起开会，现在一个反叛者单位正在帮助企业，这令人印象深刻。"
  npc_override_sp_cor_quests_17_1_s_joke_i_think_i_cf9fff: "这是个玩笑，我想我需要更多时间来正确调查这个区域。"
  npc_override_sp_cor_quests_17_1_s_just_common_sense_why_35234a: "这只是常识，为什么公司会特意给一个失业的人发工资？"
  npc_override_sp_cor_quests_17_1_s_just_speculation_time_f59204: "这次不仅仅是猜测，证据现在很清楚了。"
  npc_override_sp_cor_quests_17_1_s_kind_problem_always_se_7b30b1: "总是把最好的工人送走是个问题。"
  npc_override_sp_cor_quests_17_1_s_locked_64a009: "- 锁着。 -"
  npc_override_sp_cor_quests_17_1_s_locked_inside_even_gon_bb7923: "但它从里面锁着。连戈尼都打不开，他是我们中最强的。这就是我觉得有趣的地方。"
  npc_override_sp_cor_quests_17_1_s_me_0e73f3: "就是我！"
  npc_override_sp_cor_quests_17_1_s_mess_s_total_mess_cfd9a3: "一团糟，一团糟。没有我你活不下去。"
  npc_override_sp_cor_quests_17_1_s_more_amazing_than_you_fcd870: "比你想象的更惊人。"
  npc_override_sp_cor_quests_17_1_s_more_important_block_o_edba1b: "更重要的是封锁所有出口，这样就没有人能逃脱。"
  npc_override_sp_cor_quests_17_1_s_more_secure_than_i_2dd343: "比我想象的更安全。"
  npc_override_sp_cor_quests_17_1_s_my_style_57187f: "那不是我的风格。"
  npc_override_sp_cor_quests_17_1_s_new_me_982c57: "这对我来说是新的。"
  npc_override_sp_cor_quests_17_1_s_nice_here_quiet_if_787c94: "这里很好很安静。如果我能休息一天就好了……"
  npc_override_sp_cor_quests_17_1_s_nice_suddenly_so_much_20a6b7: "突然有这么多工作要做真好……但我一个人做不完所有事……"
  npc_override_sp_cor_quests_17_1_s_okay_i_d_surprised_930212: "没关系。如果我看到自己，我也会惊讶。我尽量不看镜子。"
  npc_override_sp_cor_quests_17_1_s_okay_i_didn_t_b88882: "没关系。我没搞砸。即使我被解雇了，我的手很巧。"
  npc_override_sp_cor_quests_17_1_s_okay_you_don_t_22f4da: "没关系，你现在不必看。还有其他紧急事情要处理。"
  npc_override_sp_cor_quests_17_1_s_old_picture_people_you_4e285a: "- 这是一张你以前见过的人的老照片。 -"
  npc_override_sp_cor_quests_17_1_s_one_many_ways_approach_36e9d9: "这是接近人们的众多方式之一，所以看着学着。我的包里有很多技巧。"
  npc_override_sp_cor_quests_17_1_s_pod_lot_i_d_926728: "是豆荚地吗？我想吃豆面~但我们还不能吃。我希望我们能……"
  npc_override_sp_cor_quests_17_1_s_possible_ee4da2: "那不可能。"
  npc_override_sp_cor_quests_17_1_s_probably_what_their_fa_24ed39: "这可能不是他们家人想要的，但外面对他们来说很危险。你知道我的意思吗？"
  npc_override_sp_cor_quests_17_1_s_proper_ending_me_don_e8ccda: "对我来说这是个合适的结局，你不觉得吗？"
  npc_override_sp_cor_quests_17_1_s_purpose_tour_now_let_5e92e2: "这就是这次旅行的目的。现在我们走吧，我们没有太多时间。"
  npc_override_sp_cor_quests_17_1_s_railway_carry_minerals_691918: "这是一条运送矿物的铁路，但他们在上面建了一道屏障。"
  npc_override_sp_cor_quests_17_1_s_really_strange_us_as_f0c3cc: "对我们来说也很奇怪，你知道发生了什么吗冒险者？"
  npc_override_sp_cor_quests_17_1_s_right_4b5ef4: "没错。"
  npc_override_sp_cor_quests_17_1_s_right_s_right_guy_dc1c59: "没错，没错！那个看起来又高又大的家伙。我想和他做朋友，因为我们来自同一个地方。有一天我看不到他了。然后我被调走了。"
  npc_override_sp_cor_quests_17_1_s_right_you_feel_bad_8f356b: "没错。你感觉不好吗？但这是事实。只有口口相传才能揭示真正的事实。"
  npc_override_sp_cor_quests_17_1_s_room_over_there_s_11e1b1: "就是那个房间。只有反叛者领袖才能进出的地方。"
  npc_override_sp_cor_quests_17_1_s_safe_here_even_if_e8c9f7: "这里很安全。即使地方很大，他们也不会随机攻击。"
  npc_override_sp_cor_quests_17_1_s_second_floor_clana_nem_0d2cd1: "它在克拉娜·内米耶里二楼。"
  npc_override_sp_cor_quests_17_1_s_small_bar_next_train_72e79a: "它是艾音布罗克火车站旁边的一家小酒吧。"
  npc_override_sp_cor_quests_17_1_s_so_trusting_ca2e6c: "但那是如此……不信任……"
  npc_override_sp_cor_quests_17_1_s_something_i_tell_you_81c89e: "这不是我能在这里告诉你的，所以请到<NAVI>[这里]<INFO>sp_cor,135,147,0,101,0</INFO></NAVI>来。"
  npc_override_sp_cor_quests_17_1_s_somewhere_einbroch_s_o_654ac6: "它在^0000FF艾音布罗克外区^000000的某个地方。我听说很多新设施涉及城市里不能做的危险实验，所以劳动力被送到外面。"
  npc_override_sp_cor_quests_17_1_s_souvenir_us_when_we_535f1a: "这是我们小时候的纪念品。"
  npc_override_sp_cor_quests_17_1_s_system_based_their_pla_c971e5: "这是一个基于他们^0000FF出生地^000000的系统。有很多人不熟悉企业文化。经过多次试错，新员工现在需要经过OT。"
  npc_override_sp_cor_quests_17_1_s_these_guards_let_schle_e708a5: "是这些守卫，由施莱因领导，"
  npc_override_sp_cor_quests_17_1_s_time_mina_s_children_d00b3e: "米娜的孩子们该起床活动了，冒险者。"
  npc_override_sp_cor_quests_17_1_s_time_operation_yet_jus_d59209: "还没到行动时间，先休息吧。"
  npc_override_sp_cor_quests_17_1_s_too_bad_168b79: "太糟糕了。"
  npc_override_sp_cor_quests_17_1_s_too_bad_they_won_837eb4: "太糟糕了，它们不会被使用了。"
  npc_override_sp_cor_quests_17_1_s_triple_edged_door_i_9e1bb3: "这是一扇三刃门。我很难打开它。"
  npc_override_sp_cor_quests_17_1_s_valid_argument_i_need_e3a776: "这是有效的论点。但我也需要去吗？我更喜欢和你谈话。"
  npc_override_sp_cor_quests_17_1_s_very_useful_isn_t_1fd582: "但这很有用，不是吗？"
  npc_override_sp_cor_quests_17_1_s_we_want_protect_civili_068a9d: "不是那样的！我们想保护平民，把事情做好！"
  npc_override_sp_cor_quests_17_1_s_weird_9c674b: "真奇怪~"
  npc_override_sp_cor_quests_17_1_s_what_i_m_saying_1c14af: "我不是那个意思贵宾。这里的秘书也知道。你真的不知道吗？你在假装吗？"
  npc_override_sp_cor_quests_17_1_s_what_i_m_trying_e914f1: "这就是我想定义的冒险者。我们有贵宾在身边，我怎么设定目的地？"
  npc_override_sp_cor_quests_17_1_s_what_i_said_all_36d2d9: "我根本不是那个意思……"
  npc_override_sp_cor_quests_17_1_s_where_they_throw_away_b7b927: "这是他们扔掉失败实验的地方。"
  npc_override_sp_cor_quests_17_1_s_why_i_didn_t_7bf1d8: "这就是为什么我不知道。"
  npc_override_sp_cor_quests_17_1_s_why_i_don_t_f09da3: "这就是为什么^0000CD我不做案头工作^000000。"
  npc_override_sp_cor_quests_17_1_s_your_operation_you_no_d39c4f: "这是你的行动。你没有可用的支援吗？"
  npc_override_sp_cor_quests_17_1_safe_me_stay_here_96315e: "我待在这里安全吗？"
  npc_override_sp_cor_quests_17_1_sammy_know_more_he_manag_3e4470: "萨米会知道更多。他管理这里的劳动力。你应该去见见他。"
  npc_override_sp_cor_quests_17_1_says_director_mcdonald_c_692d95: "上面写着主管麦当劳直接来这里，给了一份调动人员名单。"
  npc_override_sp_cor_quests_17_1_schlein_only_gathers_str_72be10: "施莱因毕竟只召集最强的人。"
  npc_override_sp_cor_quests_17_1_scientists_researchers_e_292651: "科学家，研究员，这里的每个人都假装一切正常。"
  npc_override_sp_cor_quests_17_1_second_i_want_reliable_p_14eef6: "……第二，我想要你队伍中的一个^0000CD可靠的人^000000。"
  npc_override_sp_cor_quests_17_1_security_devices_traps_s_bb9b2e: "……安全装置和召唤怪物的陷阱仍处于低功耗模式。别碰它们，否则它们很容易过热。"
  npc_override_sp_cor_quests_17_1_see_i_knew_who_wouldn_f0b866: "看到了吗？我就知道。谁不会那样做？好吧当然。也许十个人中有一个。"
  npc_override_sp_cor_quests_17_1_see_i_told_you_persuadin_8c5086: "看，我告诉过你。说服他是浪费时间。如果你不与我合作，我无法向总统报告。"
  npc_override_sp_cor_quests_17_1_see_my_family_now_why_e97a62: "看，这就是我的家人。为什么我要承担这么重的负担？放弃希望比在其他地方活着容易一百倍，不是吗？"
  npc_override_sp_cor_quests_17_1_see_why_you_sticking_you_cadb03: "看！你为什么把鼻子伸进别人的事里？"
  npc_override_sp_cor_quests_17_1_seems_been_made_intentio_3db6b1: "它似乎是为了'扔进去'而建造的。"
  npc_override_sp_cor_quests_17_1_seems_group_pretended_pa_78fb34: "它似乎来自那个假装是安全人员然后攻击实验室的团体。"
  npc_override_sp_cor_quests_17_1_seems_i_ve_picked_up_2c6669: "看来我遇到了坏顾客，但有冒险者的帮助应该没问题。"
  npc_override_sp_cor_quests_17_1_seems_lazy_something_tel_61edfe: "而且莱兹似乎有话要告诉你。"
  npc_override_sp_cor_quests_17_1_seems_like_animal_dug_ho_a9eaeb: "看起来像是动物挖了这个洞，做了一个小洞穴。"
  npc_override_sp_cor_quests_17_1_seems_like_their_equipme_5c7872: "看起来他们的装备或能力在各种方面都有所提升。"
  npc_override_sp_cor_quests_17_1_seems_me_they_like_arran_56d51b: "在我看来他们喜欢这种安排。"
  npc_override_sp_cor_quests_17_1_seems_place_cover_up_uns_b6f2c7: "这似乎是一个掩盖失败实验的地方。"
  npc_override_sp_cor_quests_17_1_seems_power_plant_suppor_2dfdbd: "看来发电厂支持整个宅邸。"
  npc_override_sp_cor_quests_17_1_seems_they_poisoned_whil_9f416c: "看来他们在搬运废料时^0000FF中毒^000000了，他们的衣服被实验室使用的各种危险物质污染了，因为他们没有安全设备。"
  npc_override_sp_cor_quests_17_1_separate_matter_because_fcb611: "因为你这么说就是另一回事了吗？你什么时候决定的？"
  npc_override_sp_cor_quests_17_1_settles_we_ll_answer_vic_d48fbc: "那就定了，我们将向副总裁汇报。我就知道！"
  npc_override_sp_cor_quests_17_1_sewage_plant_quite_compl_e13796: "污水处理厂相当复杂，你可能会迷路。"
  npc_override_sp_cor_quests_17_1_shall_we_go_31432c: "我们走吗？"
  npc_override_sp_cor_quests_17_1_she_didn_t_even_follow_05be3e: "她甚至没有遵守基本的安全规则。有多少人中毒了？"
  npc_override_sp_cor_quests_17_1_she_didn_t_want_come_877a84: "她不想回来……"
  npc_override_sp_cor_quests_17_1_she_s_right_nobody_else_b7279b: "她说得对！没有其他人像我们这样了解这个地方。"
  npc_override_sp_cor_quests_17_1_she_said_he_saw_vip_da2ce5: "她说他看到了贵宾……"
  npc_override_sp_cor_quests_17_1_she_worries_because_she_ae706b: "她很担心，因为她没有收到联系。"
  npc_override_sp_cor_quests_17_1_shh_ae6177: "嘘！"
  npc_override_sp_cor_quests_17_1_shifts_scheduled_day_cam_334423: "那天安排的班次穿着新制服进来，我错误地相信那是实验服。"
  npc_override_sp_cor_quests_17_1_should_i_everything_plea_ce7e51: "我应该做一切来取悦你吗？"
  npc_override_sp_cor_quests_17_1_should_i_investigate_fur_c7aa4b: "我应该进一步调查吗？"
  npc_override_sp_cor_quests_17_1_should_we_charge_d86713: "我们应该冲进去吗？"
  npc_override_sp_cor_quests_17_1_should_we_really_go_head_aff15b: "我们真的应该那样做吗？去总部调查？"
  npc_override_sp_cor_quests_17_1_shouldn_t_happened_087472: "这不应该发生。"
  npc_override_sp_cor_quests_17_1_shouldn_t_hard_guard_057fe9: "有守卫应该不难。"
  npc_override_sp_cor_quests_17_1_shouldn_t_we_listen_what_9e7223: "我们不应该听听黛西要说什么吗？"
  npc_override_sp_cor_quests_17_1_shouldn_t_you_awake_now_8f39fd: "你现在不应该醒了吗？嘿，醒醒！"
  npc_override_sp_cor_quests_17_1_show_me_way_out_09e85e: "给我指出去的路！"
  npc_override_sp_cor_quests_17_1_shush_you_re_new_give_4897fc: "嘘~你是新手。给我点时间解决这个问题。"
  npc_override_sp_cor_quests_17_1_sigh_i_don_t_know_59116e: "唉……我不知道为什么我们彼此如此敌对。"
  npc_override_sp_cor_quests_17_1_sigh_wait_dfc011: "唉，等一下。"
  npc_override_sp_cor_quests_17_1_simply_because_s_more_tr_7344c4: "仅仅因为让一个守卫消失更麻烦。会制造更多噪音。"
  npc_override_sp_cor_quests_17_1_since_day_they_used_data_fd7db8: "从那天起，他们利用关于你的数据，他们最强大的敌人，并迅速发展壮大。"
  npc_override_sp_cor_quests_17_1_since_he_child_he_pick_e7883d: "从小，他就会捡起东西修理，然后再卖掉。这是一种如今已经失传的天赋。"
  npc_override_sp_cor_quests_17_1_since_i_m_type_who_35dd76: "因为我是那种更喜欢用武力而不是谈话来得到她想要的答案的人，所以我在那里可能没什么事可做，"
  npc_override_sp_cor_quests_17_1_since_important_interrog_7168b5: "既然这是一次重要的审讯，应该有尽可能多的政府特工在场，就像其他人一样，以防止以后的沟通不畅。"
  npc_override_sp_cor_quests_17_1_since_incident_many_memb_d0f1e0: "但自从这次事件以来，我们的许多员工要求调动，导致人手不足。你能帮我们照料庄稼吗？"
  npc_override_sp_cor_quests_17_1_since_when_you_think_sit_7e2d16: "你认为这个地方从什么时候开始被用作废物处理设施的？"
  npc_override_sp_cor_quests_17_1_since_you_came_along_i_b0c2b2: "自从你来了，我要做的事情越来越多，而一个人能做的有限。"
  npc_override_sp_cor_quests_17_1_since_you_re_stranger_i_7db646: "但既然你不是陌生人，我就让你通过。"
  npc_override_sp_cor_quests_17_1_small_fussy_leaves_grown_4a3268: "小而杂乱的叶子从看起来健康的南瓜藤上长出来。"
  npc_override_sp_cor_quests_17_1_small_fussy_leaves_grown_803f8f: "小而杂乱的叶子从恢复生机的南瓜藤上长出来。"
  npc_override_sp_cor_quests_17_1_small_green_beans_hangin_d611e5: "小青豆挂在恢复生机的豆茎上。"
  npc_override_sp_cor_quests_17_1_small_green_beans_hangin_f4ddfe: "小青豆挂在看起来健康的豆茎上。"
  npc_override_sp_cor_quests_17_1_small_hole_so_small_huma_2f3c4b: "一个小到人类无法通过的洞？啊哈哈……"
  npc_override_sp_cor_quests_17_1_small_report_s_just_admi_db52b7: "一份小报告~不只是欣赏而不做事，对吧？"
  npc_override_sp_cor_quests_17_1_smart_head_yours_29bf4b: "用你那聪明的脑袋。"
  npc_override_sp_cor_quests_17_1_so_22a9d6: "所以{0}，"
  npc_override_sp_cor_quests_17_1_so_either_you_re_lying_3d8fc5: "所以要么你在这里撒谎，要么是我。冒险者，是我在撒谎吗？"
  npc_override_sp_cor_quests_17_1_so_far_i_believe_trick_f6c122: "到目前为止，我相信这是企业的把戏，来自那些坐在公司里的人。"
  npc_override_sp_cor_quests_17_1_so_first_things_first_op_bba412: "所以首先，这次行动是为了收集更多信息，然后我们会发起全面攻击……"
  npc_override_sp_cor_quests_17_1_so_he_knows_he_t_cecf0c: "所以，他知道他不能正面对抗我们。他在用游击战术。"
  npc_override_sp_cor_quests_17_1_so_here_s_real_question_085063: "所以真正的问题是！如果我们之间没有信任，我们怎么能真正与你合作？"
  npc_override_sp_cor_quests_17_1_so_laboratory_probably_s_fe90ad: "所以实验室可能还在施瓦茨瓦尔德。材料不能公开运输，"
  npc_override_sp_cor_quests_17_1_so_let_s_start_einbroch_598be9: "所以我们从<NAVI>[机场]<INFO>einbroch,42,208,0,101,0</INFO></NAVI>的^0000CD艾音布罗克^000000开始。"
  npc_override_sp_cor_quests_17_1_so_loud_05ec97: "别那么大声！！"
  npc_override_sp_cor_quests_17_1_so_now_rest_us_doing_b8b0c2: "所以现在，我们其余的人正在尽最大努力关闭雷根舒姆……"
  npc_override_sp_cor_quests_17_1_so_s_why_est_so_044e18: "所以这就是为什么艾斯特如此紧张。"
  npc_override_sp_cor_quests_17_1_so_these_gunmen_think_th_cf171e: "所以这些枪手认为他们可以来这里突然制造骚动！"
  npc_override_sp_cor_quests_17_1_so_vice_president_fb067b: "所以副总裁……"
  npc_override_sp_cor_quests_17_1_so_we_believe_unconditio_366313: "所以我们必须无条件相信。不奇怪吗？你没有证据吗？"
  npc_override_sp_cor_quests_17_1_so_we_look_secret_locati_a0ae33: "所以我们必须寻找一个秘密地点，我猜会在那些地点之一。"
  npc_override_sp_cor_quests_17_1_so_what_s_going_0623da: "所以发生了什么？"
  npc_override_sp_cor_quests_17_1_so_what_when_you_your_fcd8c6: "所以呢？当你做调查时，你认为这是游戏吗？"
  npc_override_sp_cor_quests_17_1_so_when_i_met_kaya_63c229: "所以当我遇到卡亚时，我请他与我合作。你可以在院子里帮助我们，对吧？"
  npc_override_sp_cor_quests_17_1_so_when_pat_came_here_25c184: "所以当帕特来这里时，我以为他也是调动。特别是在那个时候，因为新研究设施，维护和后勤部门团队……"
  npc_override_sp_cor_quests_17_1_so_where_kaufmann_right_4b3166: "那么考夫曼现在在哪里？"
  npc_override_sp_cor_quests_17_1_so_you_hiding_purpose_yo_500b70: "所以你是故意隐藏的。你能告诉我这一切是怎么回事吗？"
  npc_override_sp_cor_quests_17_1_so_you_know_who_s_5d51b4: "那么，你知道谁负责把劳动力从一个部门调到另一个部门吗？是你信任的人吗？"
  npc_override_sp_cor_quests_17_1_so_you_mean_say_patrick_20b4f6: "所以你是说帕特里克甚至不会来看我们？"
  npc_override_sp_cor_quests_17_1_so_you_searched_into_ent_158b1f: "所以你对企业进行了非常彻底的调查，你的信息是^0000CD100%可靠。^000000"
  npc_override_sp_cor_quests_17_1_some_reason_there_s_been_e355cc: "不知为何，外面没有发生事故。啧。"
  npc_override_sp_cor_quests_17_1_some_rebellions_already_70f1dd: "一些反叛者已经进入宅邸。"
  npc_override_sp_cor_quests_17_1_some_researchers_their_d_36514b: "一些研究员或他们的设备可以留下。和其他人待在我们清理过的区域。"
  npc_override_sp_cor_quests_17_1_some_should_stay_here_wa_d2d552: "有些人应该留在这里守望，以防他们回来，我们其余的人前往<NAVI>[安全地点]<INFO>sp_cor,122,141,0,101,0</INFO></NAVI>！"
  npc_override_sp_cor_quests_17_1_some_time_ago_rekenber_s_91122e: "一段时间前，雷肯伯的实验室因非法实验而受到调查。"
  npc_override_sp_cor_quests_17_1_someone_enough_suspiciou_e15dc0: "有足够怀疑的人会已经发现了真相。"
  npc_override_sp_cor_quests_17_1_someone_seems_already_du_724608: "似乎有人已经挖过这个地方。"
  npc_override_sp_cor_quests_17_1_something_doesn_t_feel_r_1195d0: "但这里感觉有些不对劲。"
  npc_override_sp_cor_quests_17_1_sometimes_strange_beasts_55269d: "有时奇怪的野兽会游荡而过。"
  npc_override_sp_cor_quests_17_1_soon_my_security_devices_629459: "……很快，我的安全装置和陷阱将退出低功耗模式并再次移动。"
  npc_override_sp_cor_quests_17_1_sorry_i_m_busy_i_f33052: "抱歉，我很忙。我不认为你们城里人想待在这里，因为闻起来像肥料。你为什么不过去加入其他人，研究员以前待的地方？"
  npc_override_sp_cor_quests_17_1_sorry_trouble_3985ae: "抱歉添麻烦了。"
  npc_override_sp_cor_quests_17_1_sounds_like_good_idea_7b48eb: "听起来是个好主意。"
  npc_override_sp_cor_quests_17_1_southeast_there_s_navi_p_7b467a: "在东南部，有<NAVI>[种植园]<INFO>sp_cor,243,84,0,101,0</INFO></NAVI>，我们相信它是为了食物供应和研究目的而存在的。"
  npc_override_sp_cor_quests_17_1_speaking_personalities_i_b84510: "说到性格，我自己就像个守卫，我们的精神无法被打破。你不能像轮子一样碾碎我，我会反击。"
  npc_override_sp_cor_quests_17_1_special_forces_lookout_a_00c8e3: "特种部队已经在警戒，但他们还没有找到实验室……"
  npc_override_sp_cor_quests_17_1_special_unit_under_est_s_0cf9b4: "艾斯特指挥下的特种部队将被派去收复。"
  npc_override_sp_cor_quests_17_1_still_i_want_keep_workin_004bce: "尽管如此，我想继续工作。我们可以在任何地方写作，对吧？如果我们在总部有个座位……"
  npc_override_sp_cor_quests_17_1_still_there_only_few_org_8237e0: "尽管如此，只有少数组织为人民做出贡献……"
  npc_override_sp_cor_quests_17_1_stop_embarrassing_us_b920ba: "别让我们难堪。"
  npc_override_sp_cor_quests_17_1_stop_embarrassing_us_you_d656ca: "别让我们难堪。你这么说只是因为有观众！"
  npc_override_sp_cor_quests_17_1_stop_talking_me_5f80ee: "别跟我说话！"
  npc_override_sp_cor_quests_17_1_stuff_what_about_damage_b5a910: "闭嘴！你对我造成的伤害呢？"
  npc_override_sp_cor_quests_17_1_stupid_thing_come_attack_4592d9: "直接来攻击是愚蠢的。他们在研究什么？"
  npc_override_sp_cor_quests_17_1_such_clumsy_tricks_he_bo_bea9d7: "这么笨拙的把戏~他~无聊~"
  npc_override_sp_cor_quests_17_1_such_people_rekenber_bee_16c4d0: "对于这样的人，雷肯伯一直作为社会福利的一部分发放特别礼物，你不知道吗。雷肯伯在欺骗人们。"
  npc_override_sp_cor_quests_17_1_such_person_around_i_m_32bfc9: "有这样的人在身边……我现在害怕了……"
  npc_override_sp_cor_quests_17_1_sum_all_up_we_ve_3a7195: "总而言之，我们失去了与雷肯伯员工的许多联系。没有人真正知道他们发生了什么。"
  npc_override_sp_cor_quests_17_1_sure_0a9dc3: "当然。"
  npc_override_sp_cor_quests_17_1_surely_there_s_reason_wh_0f330f: "当然……有理由让你和我们一起旅行。"
  npc_override_sp_cor_quests_17_1_t_you_tell_us_more_8c7647: "你不能告诉我们更多关于他们一直在做什么吗？"
  npc_override_sp_cor_quests_17_1_t_you_tell_what_you_89a778: "你不能从你看到的判断吗？如果你有空就帮忙干活，没时间解释。"
  npc_override_sp_cor_quests_17_1_take_care_44981f: "保重！"
  npc_override_sp_cor_quests_17_1_take_condition_injured_5105a2: "看看受伤者的情况。"
  npc_override_sp_cor_quests_17_1_take_look_condition_inju_1c4a6a: "看看受伤者的情况。"
  npc_override_sp_cor_quests_17_1_take_rest_now_f629fa: "先休息一下。"
  npc_override_sp_cor_quests_17_1_take_some_time_finish_in_8b007e: "完成调查并收集这里所有数据需要一些时间。"
  npc_override_sp_cor_quests_17_1_take_your_time_37b967: "慢慢来。"
  npc_override_sp_cor_quests_17_1_tell_me_again_when_you_ef769b: "当你^FF0000准备好进去^000000时再告诉我。"
  npc_override_sp_cor_quests_17_1_tell_me_more_683b29: "告诉我更多。"
  npc_override_sp_cor_quests_17_1_tell_me_what_he_did_403841: "告诉我他做了什么~"
  npc_override_sp_cor_quests_17_1_tell_us_about_your_illeg_ef68df: "而不是告诉我们你的非法研究或你的朋友。"
  npc_override_sp_cor_quests_17_1_tes_watch_out_your_back_7aaa07: "泰斯，小心你的背后。哈哈，你会没事的。"
  npc_override_sp_cor_quests_17_1_thank_you_174534: "谢谢。"
  npc_override_sp_cor_quests_17_1_thank_you_again_all_help_2997df: "再次感谢所有的帮助。"
  npc_override_sp_cor_quests_17_1_thank_you_courtesy_court_aeca08: "谢谢！礼貌，礼貌！现在，让我们都去<NAVI>[里希塔乐镇]<INFO>lighthalzen,259,215,0,101,0</INFO></NAVI>？"
  npc_override_sp_cor_quests_17_1_thank_you_everything_you_a5ab3e: "感谢你迄今为止所做的一切。"
  npc_override_sp_cor_quests_17_1_thank_you_i_m_sorry_c78971: "谢谢。很抱歉这么突然地要求你。"
  npc_override_sp_cor_quests_17_1_thank_you_i_written_many_7f99e9: "谢谢。我在逗留期间写了很多信，所以我会整理一下。再次感谢！"
  npc_override_sp_cor_quests_17_1_thank_you_so_much_093766: "非常感谢！"
  npc_override_sp_cor_quests_17_1_thank_you_thank_you_9118d0: "谢谢，谢谢！"
  npc_override_sp_cor_quests_17_1_thank_you_thank_you_b028e0: "谢谢！谢谢！"
  npc_override_sp_cor_quests_17_1_thank_you_very_much_toda_83a2c3: "非常感谢你今天的工作。"
  npc_override_sp_cor_quests_17_1_thank_you_we_grow_grapes_ad0d59: "谢谢！我们在农场种植葡萄、青豆和南瓜，它们各自有不同的需求。"
  npc_override_sp_cor_quests_17_1_thank_you_we_ve_got_77d678: "谢谢。我们有葡萄、青豆和南瓜，我相信我告诉过你它们各自有不同的需求。"
  npc_override_sp_cor_quests_17_1_thank_you_your_help_keep_767b2a: "谢谢你的帮助。继续重建这个实验室。"
  npc_override_sp_cor_quests_17_1_thanks_employment_i_job_c2189e: "多亏了这份工作，我有工作了，可以养活我的家人了。我为此感到自豪。"
  npc_override_sp_cor_quests_17_1_thanks_previous_data_col_d3a5bd: "但多亏了维尔纳研究所之前收集的数据……"
  npc_override_sp_cor_quests_17_1_thanks_you_things_gotten_854abc: "多亏了你，情况变好了……"
  npc_override_sp_cor_quests_17_1_thanks_you_we_ve_success_9972dc: "多亏了你，我们成功抓住了艾露米娜。既然我们不用担心她的随机攻击了，总统的小士兵和平民就可以回家了。"
  npc_override_sp_cor_quests_17_1_their_deception_they_too_c51b6d: "在他们的欺骗下，他们同时接管了所有保安。"
  npc_override_sp_cor_quests_17_1_then_both_my_arms_end_686ff2: "然后我的双臂……最后……你还能叫我人类吗？"
  npc_override_sp_cor_quests_17_1_then_good_luck_adventure_fea90c: "那祝你好运，冒险者！当我学到新东西时我会联系你！"
  npc_override_sp_cor_quests_17_1_then_he_sent_another_lab_995eea: "……然后他被送到了另一个实验室。"
  npc_override_sp_cor_quests_17_1_then_i_ll_countin_you_13cad9: "那，我就指望你了。"
  npc_override_sp_cor_quests_17_1_then_i_ll_go_3d4f53: "那我就走了。"
  npc_override_sp_cor_quests_17_1_then_i_ll_go_field_4d065d: "那我就去野外。"
  npc_override_sp_cor_quests_17_1_then_i_ll_inform_adventu_2ebd65: "那我会单独通知冒险者你的位置。"
  npc_override_sp_cor_quests_17_1_then_i_ll_keep_you_5d5f90: "……那我会通知你下一次行动。"
  npc_override_sp_cor_quests_17_1_then_way_b16359: "那么，这边走。"
  npc_override_sp_cor_quests_17_1_then_we_ll_look_circumst_31debd: "那我们会看看周围的情况。"
  npc_override_sp_cor_quests_17_1_then_we_ve_least_got_abfdab: "那，我们至少有四个，包括我和米娜——"
  npc_override_sp_cor_quests_17_1_then_who_else_you_re_4d64a6: "那，还有谁？你是这里唯一的队长。"
  npc_override_sp_cor_quests_17_1_then_you_ll_really_die_7c77a5: "那你真的会死。我认为你还不想死，对吧？"
  npc_override_sp_cor_quests_17_1_there_another_closed_min_6fad48: "艾音布罗克西北区域还有另一个封闭的矿井。"
  npc_override_sp_cor_quests_17_1_there_any_other_people_h_24808b: "这里有其他人吗？"
  npc_override_sp_cor_quests_17_1_there_any_problem_97042f: "有什么问题吗？"
  npc_override_sp_cor_quests_17_1_there_aren_t_lot_securit_4dc7d2: "企业里没有多少安保人员了，因为大多数人背叛了雷肯伯。"
  npc_override_sp_cor_quests_17_1_there_doesn_t_seem_any_6a1d57: "似乎没有房间了。"
  npc_override_sp_cor_quests_17_1_there_explosion_near_fac_4ca48a: "设施附近发生了爆炸。是这个实验室的研究员艾露米娜造成的。"
  npc_override_sp_cor_quests_17_1_there_goes_course_i_also_a00314: "那就对了。当然。我也知道答案，但不管怎样我会问你，帕特里克和马库斯还在雷肯伯工作吗？"
  npc_override_sp_cor_quests_17_1_there_lab_workers_7b64c8: "有^0000FF实验室工作人员^000000"
