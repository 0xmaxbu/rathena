Body:
  npc_override_1@slw_WernerLaboratoryCentralRoom_about_central_room_i_am_bc6c2a: "关于中央房间，{0} 我就指望你了！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_according_design_drawing_fa8999: "根据设计图纸，这部分应该连接到中央房间……但我只看到一扇可疑的门。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_after_activating_gate_we_b2199b: "激活大门后，我们必须从外面守卫它。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_after_looking_around_her_1d4ae7: "环顾四周之后，你觉得怎么样？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_after_moment_i_divided_s_f63cb3: "这一刻之后，^4d4dff我将再次分裂并散落。^000000"
  npc_override_1@slw_WernerLaboratoryCentralRoom_after_transplanting_dumm_14f538: "在移植了伊米尔之心的仿制品后，身体无法承受那股力量，最终崩溃了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_ah_8011cc: "……啊……"
  npc_override_1@slw_WernerLaboratoryCentralRoom_ah_s_right_9771bc: "啊~。没错。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_all_i_now_strong_transfe_712bde: "我现在所拥有的只是将某种东西不断传递下去的强烈意志。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_all_you_want_say_41b79f: "这就是你想说的全部吗？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_already_activated_d7dd60: "它已经激活了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_although_scrap_s_heart_f_4107e1: "虽然只是一块碎片，但它是伊米尔的心脏碎片。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_any_case_energy_goes_int_0c2353: "无论如何，能量会流入实验体……利用那股力量，我调整了他们的时间。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_anyway_you_dead_meat_93f7db: "反……反正，你死定了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_aren_t_you_curious_about_b90716: "你不好奇吗？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_as_eisen_said_s_no_ff55f4: "正如艾森所说，我是否还是塞伦已经不再重要了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_beeee_prepared_48c74c: "做……做好准备！！！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_beyond_wall_there_someth_1c8624: "在这堵墙后面，有你前来寻找的东西。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_cannot_compared_imitatio_d48dc5: "它无法与仿制品相提并论。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_cannot_progress_quest_be_044ff3: "- 由于你携带的物品太多，无法继续任务。 -"
  npc_override_1@slw_WernerLaboratoryCentralRoom_case_we_use_expression_s_33f5cd: "在这种情况下，我们使用这样的表达方式。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_certainly_some_them_get_7ee68f: "……当然，其中一些会因为细胞破裂而死亡。哈哈！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_certainly_you_ll_die_her_e7bff9: "当然。你会死在这里。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_chairman_i_mean_person_o_81a58a: "会长……我是说，那个人沉迷于过去。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_change_blue_red_s_389ef2: "然后把^4d4dff蓝色^000000变成^ff0000红色^000000。就是这样。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_change_red_blue_789edd: "把^ff0000红色^000000变成^4d4dff蓝色^000000。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_continuous_division_crea_02260f: "持续的分裂创造了无数我的复制品。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_damn_b323b7: "该死！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_damn_werner_why_did_you_a33b80: "……该死，维尔纳。为什么把我跟狼混在一起？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_dang_how_did_you_get_3d9886: "……该死，你是怎么进来的？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_device_been_initialized_57ce04: "装置已初始化。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_did_you_enjoy_my_work_6f0447: "你喜欢我的作品吗？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_die_here_me_7d2640: "死在这里？我？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_don_t_you_remember_how_9a2846: "你不记得我费了多大劲才把你从那个地狱里带出来的吗？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_during_process_its_memor_c7c63c: "在这个过程中，它的记忆、意识、灵魂、心智和自我都像沙子一样散落了。它们变得毫无意义。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_easier_than_you_thought_0e841f: "比你想象的简单？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_eisen_right_seyren_winds_6ea542: "艾森说得对。^4d4dff塞伦·温莎已经不在人世了。^000000"
  npc_override_1@slw_WernerLaboratoryCentralRoom_eisen_werner_205af0: "……艾森·维尔纳。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_eisen_werner_let_me_ask_254508: "……艾森·维尔纳。让我再问你一次。这就是你意志的终结吗？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_eisen_you_abandoned_ever_59cbbe: "……艾森。你竟然就这样抛弃了一切。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_end_your_12dc3c: "……这就是你意志的终结吗？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_energy_extracted_flows_i_fb5b18: "从这里面提取的能量流入地上的魔法阵……哈哈哈。当然，这个魔法阵已经被魔法重新诠释了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_enter_now_2c6c87: "现在进入。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_event_proceeded_memorial_e6d841: "^4d4dff此事件已推进至纪念地下城。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_fellow_among_delegation_60d72c: "这家伙是那个愚蠢的王室代表团中的一员。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_fools_kingdom_cannot_eve_f048f3: "……王国里的傻瓜们甚至无法利用他们已经拥有的力量。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_forget_your_duty_seyren_a52def: "别忘了你的职责，塞伦。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_gate_malfunctioning_now_7984b8: "大门现在出故障了。这样下去很危险……"
  npc_override_1@slw_WernerLaboratoryCentralRoom_gate_now_activated_865b3b: "大门现在已激活。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_go_07415e: "进去。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_great_now_i_got_bf6c7a: "太好了，现在我明白了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_great_see_you_end_84f058: "能在最后见到你真是太好了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_great_turning_point_vivo_a4d018: "这是活体实验的一个重大转折点。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_guy_stopped_now_616c25: "那家伙现在已经停下来了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_haha_they_let_us_open_5b49dc: "哈哈，他们让我们打开了中央房间的大门！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_he_activate_gate_central_c4b628: "他将激活通往中央房间的大门。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_heart_fragment_ymir_hold_dc1660: "它是伊米尔的心脏碎片，拥有构成世界的基本力量。它也拥有生命的起源。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_here_comes_main_characte_17f0bf: "主角登场了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_hey_baby_you_t_me_a473b1: "嘿，宝贝？你不能这样对我。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_hmm_e777ce: "嗯？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_hmm_i_see_s_way_94d8e4: "嗯，我明白了。原来是这样操作的。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_hmm_s_because_you_re_49550e: "嗯，那是因为反正你都要死在这里了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_honestly_i_m_impressed_i_843287: "说实话，我很佩服。我没想到你会一路走到这里。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_how_dare_you_come_you_1037ea: "你怎么敢进来！你真勇敢！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_how_many_copies_myself_b_836837: "到目前为止，已经创造了多少个我的复制品？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_how_you_like_gift_i_de0d78: "你觉得我准备的礼物怎么样？！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_huge_sensation_458ee2: "伴随着巨大的震动。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_huhuhuhuhu_810600: "呼呼呼呼呼……"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_am_here_d7c94a: "我在这里。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_asked_him_whether_he_c3092f: "我问他是否知道这里的路径，他回答是。所以我就把他带到这里了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_don_t_need_loser_8c90fb: "我也不需要失败者。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_feel_like_i_ve_30a83e: "我感觉自己从漫长的沉睡中醒来了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_feel_like_i_ve_45e174: "我感觉自己从漫长的沉睡中醒来了。也许就是为了这一天。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_guard_gate_central_roo_76dd23: "我将再次守卫中央房间的大门。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_guide_you_c793cc: "我来为你引路。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_haven_t_been_waiting_7ae13e: "我可没有空手等待。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_know_you_ve_come_43d935: "我知道你是为了卢恩-米德加尔特王国的事务而来的。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_lost_ego_after_continu_5014d1: "在连续分裂后我失去了自我，但又被重新生成为之前的形态。我不认为那是巧合。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_lucky_show_my_last_83a257: "我很幸运能在你面前展示我最后的意志。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_mean_if_only_he_c3dcae: "我是说，如果他停下来的话……"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_never_expected_0620fc: "我从没想过会这样！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_never_imagined_done_al_9654c3: "我从没想过事情会突然变成这样。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_realized_after_looking_84af76: "而在看到^4d4dff泰拉·格洛里亚^000000之后，我才意识到。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_really_don_t_more_cffc61: "我真的没有太多时间了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_sent_silly_guys_back_318daf: "我把那些蠢货送回去重新开始了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_thought_there_must_bee_06a588: "我想一定有某种原因。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_told_you_i_d_a0d386: "我告诉过你我已经准备好礼物了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_trying_apply_many_kind_b536e4: "我试图把它应用到各种各样的东西上。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_ve_been_waiting_you_702ea7: "我已经等了你很久了。正如艾森所说，我是否还是塞伦已经不再重要了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_ve_been_waiting_you_d17c1e: "我已经等了你很久了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_ve_given_up_saving_c15b5b: "反正我已经放弃拯救这个实验室了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_only_kid_had_gone_2bfd91: "如果那孩子回去了的话，他就不会落得那样的下场……"
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_there_gate_already_be_ec9a6d: "如果有一扇已经激活的大门，你就能看到它。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_time_goes_biologicall_b3b53e: "如果按生物学时间流逝，就意味着有人在变老。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_you_entering_now_i_d71a39: "如果你现在进入，我将激活大门。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_you_looked_my_work_3ed133: "如果你认真看过我的作品，你就会明白我在说什么。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_you_want_replay_story_b23d30: "如果你想重温塞伦·温莎的故事，请选择^4d4dff继续剧情^000000。如果你想见识艾森·维尔纳的杰作，请选择^4d4dff继续战斗^000000。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_isn_t_amazing_71a82e: "是不是很神奇？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_isn_t_world_funny_place_873884: "这个世界是不是很有趣？哈哈哈哈哈哈"
  npc_override_1@slw_WernerLaboratoryCentralRoom_its_flow_relative_60ddf7: "它的流动是相对的。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_just_imitating_main_body_426c93: "只是在模仿本体，它们甚至在里面生长。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_laboratory_i_built_refer_451114: "那是我参考它建造的实验室。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_land_gone_only_star_rema_14482e: "……陆地已经消失，只剩下星辰。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_let_me_ask_you_again_018202: "让我再问你一次。这就是你意志的终结吗？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_let_me_finish_you_6f312e: "让我来终结你！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_let_me_tell_you_once_351c89: "让我再告诉你一次。别惊讶。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_let_s_call_day_856523: "但我们今天就到此为止吧。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_let_s_move_next_zone_19e05c: "让我们前往下一个区域。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_look_carefully_ddda59: "仔细看这个。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_look_carefully_what_you_a07fdb: "仔细看这个。你前来夺回的东西正在做着奇妙的事情！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_look_good_825e9c: "看起来不错吗？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_magic_field_been_activat_2ad43b: "魔法场已激活。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_magic_field_been_elimina_b929b3: "魔法场已消除。入口已创建。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_make_things_worse_uncont_f060a8: "更糟糕的是，那是一个充满愤怒、无法控制的生物。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_maybe_bit_made_me_exist_46448e: "也许那一点意志让我得以存在。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_maybe_day_29d499: "也许就是为了这一天。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_md_only_party_leader_ent_7d09f7: "^4d4dff只有队伍队长现在可以进入[中央房间]。^000000"
  npc_override_1@slw_WernerLaboratoryCentralRoom_me_all_my_companions_die_2da41e: "^4d4dff我和我的所有同伴早已死去。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_menu_experiment_c9a10c: "实验编号: {0}"
  npc_override_1@slw_WernerLaboratoryCentralRoom_menu_options_2dee71: "{0} : 你在说活体实验的事吗？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_menu_options_8b600b: "{0} : 这就是你想说的全部吗？"
  npc_override_1@slw_WernerLaboratoryCentralRoom_menu_options_bd1e2a: "{0} : ……塞伦？！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_0b0c6f: "^ff0000{0}^000000"
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_61ce5a: "[{0}]"
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_79ef7f: "...."
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_93fcbf: "......"
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_c77c95: "......."
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_e95f89: "....."
  npc_override_1@slw_WernerLaboratoryCentralRoom_my_type_fce846: "那是我的风格。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_never_think_i_m_finished_257816: "别以为我就此结束了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_next_security_devices_si_bf7f8d: "下一个安全装置也是类似的，所以我不需要再解释了。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_no_i_d_glad_if_a40d24: "不，如果你能感到惊讶，我会很高兴的。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_no_never_0fc4e7: "不！绝不！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_no_wonder_looked_like_th_cfaf74: "难怪他们看起来有靠山。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_now_i_much_more_urgent_e89eb1: "现在，我有一条比给艾森更紧急的信息要告诉你。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_now_take_look_gift_i_9869b2: "现在，看看我准备的礼物。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_oh_2eba04: "哦……"
  npc_override_1@slw_WernerLaboratoryCentralRoom_oh_i_turn_every_time_efb7c0: "哦……我每次都得打开它。太不方便了！"
  npc_override_1@slw_WernerLaboratoryCentralRoom_once_identified_appropri_0c41f2: "一旦它被正确识别，我可能会要求你结算……"
  npc_override_1@slw_WernerLaboratoryCentralRoom_only_party_leader_procee_c83874: "^4d4dff只有队伍队长可以继续进行此事件。^000000"
  npc_override_1@slw_WernerLaboratoryCentralRoom_only_successful_experime_7b513a: "而唯一成功的实验就是你。我们现在叫你塞伦。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_operated_security_device_a5fcc3: "已操作安全装置。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_otherwise_please_ask_you_987b65: "否则，请让你的队伍队长申请进入。"
  npc_override_1@slw_WernerLaboratoryCentralRoom_parallel_world_3c1f45: "这是平行世界吗？"
