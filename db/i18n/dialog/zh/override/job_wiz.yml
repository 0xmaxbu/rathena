Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job_wiz_wizard_about_monster_questions_a47835: "关于怪物的问题。"
  npc_override_job_wiz_wizard_after_test_over_cd2775: "之后，测试就结束了。"
  npc_override_job_wiz_wizard_after_these_three_rooms_7dc67f: "这三个房间清除后，测试就结束了。"
  npc_override_job_wiz_wizard_ah_i_know_what_you_e953e7: "啊……我知道你要说什么。你想转职为巫师，对吧？"
  npc_override_job_wiz_wizard_all_testing_status_broad_54607a: "所有测试状态将被广播，并且在前一个测试者通过后立即开始。"
  npc_override_job_wiz_wizard_also_if_you_like_know_07b8b5: "另外，如果你想了解转职过程的任何信息，我可以解释。"
  npc_override_job_wiz_wizard_also_only_mages_who_reac_71bdd3: "另外，只有Job Level达到40或更高的魔法师才有资格参加这些任务。"
  npc_override_job_wiz_wizard_among_one_these_tests_we_efd1d8: "在这些测试中，我们免除Job Level 50的人。"
  npc_override_job_wiz_wizard_anyways_always_try_your_f30ded: "但无论如何，总是尽你最大的努力。"
  npc_override_job_wiz_wizard_anyways_as_questions_abo_c8e52f: "总之，关于魔法的问题……"
  npc_override_job_wiz_wizard_anyways_i_like_welcome_y_51cbfc: "总之，我很欢迎你。我将协助你成为一名巫师。"
  npc_override_job_wiz_wizard_anyways_try_your_best_f541bc: "总之，尽你最大的努力。"
  npc_override_job_wiz_wizard_as_i_thought_i_knew_e710c1: "正如我所想，我就知道你能做到，我能闻到你身上的味道！*汪*"
  npc_override_job_wiz_wizard_as_you_wish_let_s_a809a9: "如你所愿，让我们开始最终测试！"
  npc_override_job_wiz_wizard_bark_bark_bark_don_t_072342: "*汪* *汪* *汪* 别说废话！好吧，我知道我是条狗！"
  npc_override_job_wiz_wizard_bark_bark_bark_i_m_195ae3: "……*汪* *汪* *汪*……我很沮丧，但无所谓！！你看起来很忙，我就算了。"
  npc_override_job_wiz_wizard_bark_get_lost_b7c1f0: "*汪* 滚开！"
  npc_override_job_wiz_wizard_bark_s_common_you_see_e732a3: "*汪* 看到狗说话不常见吧，我猜。汪~"
  npc_override_job_wiz_wizard_bark_well_reason_i_becam_3eb258: "*汪* 好吧，我变成狗的原因是……我在帮男朋友做实验，准备他的魔法学位期末考试。好吧，*呜呜* 他不小心把我变成了狗。"
  npc_override_job_wiz_wizard_bark_what_why_you_lookin_c1141d: "……*汪*……？怎么了？你为什么那样看着我？！"
  npc_override_job_wiz_wizard_bark_you_gave_up_5f4fff: "*汪*……你放弃了？"
  npc_override_job_wiz_wizard_basics_being_wizard_67e4e5: "这是成为巫师的基础。"
  npc_override_job_wiz_wizard_because_you_mage_f5eb9b: "因为你是一名魔法师。"
  npc_override_job_wiz_wizard_best_even_dream_about_li_1c6a1b: "最好不要梦想成为巫师的生活。格拉……格莱……*打喷嚏* 大魔法不是人类应该使用的！"
  npc_override_job_wiz_wizard_blue_gemstone_each_6884ee: "^3355FF蓝色宝石^000000 10个，"
  npc_override_job_wiz_wizard_careful_greater_magic_al_68fad5: "小心！大魔法永远会追着你……"
  npc_override_job_wiz_wizard_careful_we_lost_many_mag_b7daf7: "小心。由于考试的难度，我们已经失去了很多魔法师。"
  npc_override_job_wiz_wizard_choose_monster_different_234ee0: "1. 选择与其他怪物属性不同的怪物。"
  npc_override_job_wiz_wizard_choose_monster_looting_o_200826: "2. 选择不是拾取型的怪物。"
  npc_override_job_wiz_wizard_choose_monster_move_b264a2: "5. 选择可以移动的怪物。"
  npc_override_job_wiz_wizard_choose_monster_s_differe_218b17: "9. 选择不同物种的怪物。"
  npc_override_job_wiz_wizard_choose_monster_weak_agai_c82652: "7. 选择对火属性攻击弱的怪物。"
  npc_override_job_wiz_wizard_choose_one_relate_mage_d23688: "3. 选择与魔法师无关的那个。"
  npc_override_job_wiz_wizard_choose_spell_efficient_a_ca66a7: "4. 选择对海洋球体有效的法术。"
  npc_override_job_wiz_wizard_comming_you_thats_some_d_a61535: "从你嘴里说出来，真是不错的想法。这更适合你。哈哈哈哈哈哈哈哈~"
  npc_override_job_wiz_wizard_complete_yourself_thats_23be6a: "自己完成。那是最好的方式。"
  npc_override_job_wiz_wizard_complete_yourself_thats_2cf0b1: "自己完成，那是最好的方式。"
  npc_override_job_wiz_wizard_condors_picky_s_sometime_3e9c8e: "秃鹰、小鸡，有时像魔像这样的怪物会掉落它们。"
  npc_override_job_wiz_wizard_congratulations_always_g_fbc32d: "恭喜。无论做什么，都要全力以赴。"
  npc_override_job_wiz_wizard_congratulations_congrats_35d9c2: "恭喜，恭喜，恭喜！呜哇啊啊啊啊！~嘿嘿嘿嘿嘿嘿"
  npc_override_job_wiz_wizard_congratulations_good_luc_f47ec4: "恭喜，祝你好运！"
  npc_override_job_wiz_wizard_congratulations_you_pass_7e4d8e: "恭喜，{0}。你通过了转职测试。"
  npc_override_job_wiz_wizard_cornutus_kukre_marina_va_7186e0: "克努图斯、库克雷、玛丽娜、瓦登……这些怪物经常掉落它们。"
  npc_override_job_wiz_wizard_cornutus_vadon_monsters_e49a27: "克努图斯、瓦登，以及像火星这样的怪物可以掉落那些宝石。"
  npc_override_job_wiz_wizard_cough_cough_as_you_wish_1d4004: "*咳* *咳* 如你所愿，我们将开始最终测试！"
  npc_override_job_wiz_wizard_cough_cough_did_you_real_367e8a: "*咳* *咳* 你真的以为以你这种平庸的水平能成为巫师吗？"
  npc_override_job_wiz_wizard_cough_cough_let_s_see_2fc889: "*咳* *咳* 让我们看看你能活多久。~哈哈哈哈哈哈"
  npc_override_job_wiz_wizard_cough_cough_no_point_cry_ad9a08: "*咳* *咳* 死了之后哭也没用……"
  npc_override_job_wiz_wizard_cough_cough_sneeze_i_don_2ade86: "*咳* *咳* *打喷嚏* 我不知道你是谁，你做什么，但我跟你没有任何关系。"
  npc_override_job_wiz_wizard_cough_cough_then_here_go_4fd7f3: "*咳* *咳* 那么问题来了！"
  npc_override_job_wiz_wizard_cough_cough_then_i_shall_85e8bb: "*咳* *咳* 那么我来解释。"
  npc_override_job_wiz_wizard_cough_cough_well_done_yo_cd6309: "*咳* *咳* 做得好，你通过了第二次测试。"
  npc_override_job_wiz_wizard_cough_cough_what_you_wan_811663: "*咳* *咳* 你想要什么？"
  npc_override_job_wiz_wizard_cough_cough_you_give_up_cb8d0d: "*咳* *咳* 你可以放弃并回城！忘记大魔法，过正常的生活。你说呢？"
  npc_override_job_wiz_wizard_cough_cough_you_must_ve_997e18: "*咳* *咳*……你一定通过了第一次测试。"
  npc_override_job_wiz_wizard_cough_cough_you_want_tak_ab764c: "*咳* *咳* 你想再参加一次测试吗？还是你带来了^3355FF破旧卷轴^000000？"
  npc_override_job_wiz_wizard_cough_if_you_t_pass_47cd7f: "*咳* 如果你不能通过战斗测试，那就把这个做好。哈哈哈哈哈哈哈哈~"
  npc_override_job_wiz_wizard_course_you_get_blue_gems_db54fd: "当然你可以在城里的魔法商店买到蓝色宝石……"
  npc_override_job_wiz_wizard_crystal_blue_each_f8607d: "^3355FF水晶蓝^000000 5个，"
  npc_override_job_wiz_wizard_crystsal_blue_each_0ba39d: "^3355FF水晶蓝^000000 5个，"
  npc_override_job_wiz_wizard_dang_i_hope_you_fail_03068b: "该死！我希望你失败！！滚开！！"
  npc_override_job_wiz_wizard_did_you_get_all_items_2f69ca: "你拿到所有物品了吗？"
  npc_override_job_wiz_wizard_dog_talking_so_amusing_y_977898: "狗说话对你来说很有趣吗？"
  npc_override_job_wiz_wizard_don_t_come_any_closer_6a965c: "不要再靠近了，走吧！"
  npc_override_job_wiz_wizard_don_t_forget_them_time_9fc7df: "这次别忘了，收集正确的物品，好吗？再见……"
  npc_override_job_wiz_wizard_don_t_forget_time_bring_c37faf: "这次别忘了，带上所有物品，好吗？……"
  npc_override_job_wiz_wizard_don_t_forget_wizards_gro_4dd47c: "不要忘记巫师每天都在成长和增强力量。"
  npc_override_job_wiz_wizard_don_t_get_too_laid_b1e302: "不要太放松，还有2个测试。"
  npc_override_job_wiz_wizard_don_t_go_about_casting_69631d: "不要在城里无缘无故施法，也不要用你自己的战斗法术打扰别人。"
  npc_override_job_wiz_wizard_don_t_live_dishonestly_i_0810fe: "不要不诚实或不礼貌地生活，否则总有一天你会被困在一个你无法控制的法术中，砰，你死了！"
  npc_override_job_wiz_wizard_don_t_pretend_weak_just_e70e27: "不要因为你是女孩就假装软弱。看看我！我做到了，你也可以。你不能要求同情。"
  npc_override_job_wiz_wizard_don_t_too_relieved_just_01869b: "第一次测试后不要太放松。"
  npc_override_job_wiz_wizard_don_t_weak_mind_woof_b7e544: "不要意志薄弱，*汪* 回去！*汪* *汪* 现在就回去！*汪*"
  npc_override_job_wiz_wizard_each_person_may_take_app_48326b: "每个人可能需要大约5到10分钟。"
  npc_override_job_wiz_wizard_each_room_there_monsters_5f1930: "每个房间里都有特定属性的怪物。"
  npc_override_job_wiz_wizard_earth_room_job_change_te_5694cb: "大地之房；转职测试现在开始。"
  npc_override_job_wiz_wizard_eh_did_you_leave_middle_47449b: "嗯，你在测试中途离开了吗？"
  npc_override_job_wiz_wizard_eh_soso_a67245: "嗯，一般般……"
  npc_override_job_wiz_wizard_eh_what_s_i_don_1628e2: "嗯，这是什么？我觉得你没有所有东西？"
  npc_override_job_wiz_wizard_elder_willows_metallers_d96842: "老柳树、金属虫或沙漠中的蝎子也可以。"
  npc_override_job_wiz_wizard_eliminate_all_monster_wi_466479: "在时间限制内消灭所有怪物。"
  npc_override_job_wiz_wizard_end_test_next_candidate_ad9ff9: "测试结束。下一位候选人，请准备。"
  npc_override_job_wiz_wizard_end_time_293c9f: "时间到。"
  npc_override_job_wiz_wizard_enough_prove_us_effort_t_95947c: "这已经足够证明成为一名巫师需要付出的努力，如果一个魔法师已经学到了那么多。"
  npc_override_job_wiz_wizard_even_though_your_grade_w_f97dd8: "虽然你不是A级巫师的材料，但我能看出你真的很想要大魔法。我会告诉凯瑟琳你通过了。哈哈哈哈哈哈哈哈~"
  npc_override_job_wiz_wizard_excuse_me_i_am_wondering_ad9d06: "？打扰一下，我想知道我们以前见过吗……？"
  npc_override_job_wiz_wizard_fighting_them_yourself_l_87ca63: "自己战斗和学习是最好的方式。"
  npc_override_job_wiz_wizard_final_test_total_parts_4745ea: "最终测试共有3个部分。"
  npc_override_job_wiz_wizard_finding_them_yourself_mu_222065: "但是，自己找到它们会更有回报，对后面的测试也更有帮助。"
  npc_override_job_wiz_wizard_fire_room_job_change_tes_3864be: "火焰之房；转职测试现在开始。"
  npc_override_job_wiz_wizard_first_get_red_gemstones_155ffc: "首先，要获得红色宝石，去普隆德拉的地下水道。"
  npc_override_job_wiz_wizard_first_test_collecting_ma_91222c: "第一次测试是收集魔法物品。"
  npc_override_job_wiz_wizard_geez_what_lame_person_930665: "天哪，真是个无聊的人。"
  npc_override_job_wiz_wizard_geez_you_already_failed_2acf31: "天哪……你已经失败了战斗测试！哈哈哈哈哈哈哈哈~ 你就那么喜欢魔法吗？"
  npc_override_job_wiz_wizard_get_lost_hahahahaha_1ec72c: "滚开！~哈哈哈哈哈哈"
  npc_override_job_wiz_wizard_get_lost_if_you_wizard_86bff0: "滚开！如果你现在是巫师，我处理的怪物会立刻把你吃掉！"
  npc_override_job_wiz_wizard_get_lost_if_you_wizard_994580: "滚开！如果你现在是巫师，我战斗的怪物会立刻把你吃掉！"
  npc_override_job_wiz_wizard_gloomy_laurel_corner_cha_b02ca4: "角落里阴郁的月桂负责那部分。"
  npc_override_job_wiz_wizard_go_away_get_lost_3839f2: "走开！滚开！"
  npc_override_job_wiz_wizard_go_away_one_who_works_009ee2: "走开，为教会工作的人！"
  npc_override_job_wiz_wizard_go_back_live_easy_life_f67a02: "回去过轻松的生活吧，大魔法是一种不应该被像你这样的人使用的力量。"
  npc_override_job_wiz_wizard_go_back_live_quiet_peace_f756f2: "回去过安静和平的生活吧！"
  npc_override_job_wiz_wizard_go_finish_rest_tests_spi_f79c3c: "带着这种精神完成剩下的测试！"
  npc_override_job_wiz_wizard_go_go_become_wizard_you_b843fb: "去吧！去成为你真正想成为的巫师。"
  npc_override_job_wiz_wizard_go_join_parties_others_k_417745: "去和其他人组队，继续训练。"
  npc_override_job_wiz_wizard_go_talk_catherine_she_ll_067f33: "去和凯瑟琳说话。她会帮你的。"
  npc_override_job_wiz_wizard_go_talk_guy_corner_rest_9c1451: "去和角落里的家伙说话，完成剩下的测试。"
  npc_override_job_wiz_wizard_go_talk_guy_corner_take_a3d8bc: "去和角落里的家伙说话，参加剩下的测试。"
  npc_override_job_wiz_wizard_go_talk_man_corner_he_d346c1: "去和角落里的男人说话，他会给你剩下的考试。"
  npc_override_job_wiz_wizard_go_visit_mage_guild_aa12ed: "去拜访^0000FF魔法师^000000公会。"
  npc_override_job_wiz_wizard_going_there_studying_bit_6c7ad8: "去那里学习一会儿也会有帮助。"
  npc_override_job_wiz_wizard_good_job_you_finished_an_d756ab: "做得好，你回答完了所有问题……如果你有钱，去买点药水什么的吧。哈哈……"
  npc_override_job_wiz_wizard_good_thinking_better_cho_f6929a: "好想法。这对你来说是个更好的选择。哈哈哈哈~"
  npc_override_job_wiz_wizard_good_you_ve_passed_first_a52ed3: "很好。你现在通过了第一次测试。"
  npc_override_job_wiz_wizard_good_you_you_passed_firs_b35061: "恭喜你！你通过了第一次测试。"
  npc_override_job_wiz_wizard_granted_you_re_mage_how_cdefc7: "虽然你是魔法师，但你怎么能这么弱？！"
  npc_override_job_wiz_wizard_green_live_each_a47db0: "^3355FF绿色生命^000000 5个，"
  npc_override_job_wiz_wizard_grrr_anyways_continue_te_ea798c: "*呜呜* 总之，继续测试。"
  npc_override_job_wiz_wizard_guard_monster_appeared_y_d2c387: "守卫怪物出现了。你有1分钟。"
  npc_override_job_wiz_wizard_guard_monster_appeared_y_ef88d9: "守卫怪物出现了。你有2分钟。"
  npc_override_job_wiz_wizard_gulp_gulp_gulp_haaaaaah_64de60: "咕噜咕噜咕噜……哈啊啊啊……~嘿嘿"
  npc_override_job_wiz_wizard_hahaha_ok_least_you_some_850958: "哈哈哈~ 好吧，至少你还有点精神。"
  npc_override_job_wiz_wizard_hahaha_since_you_only_mi_d64a79: "哈哈哈~ 因为你只错了一道题，你通过了第二次测试。"
  npc_override_job_wiz_wizard_hahaha_sneeze_good_choic_1e8e4b: "哈哈哈~ *打喷嚏* 好选择……*咳* *咳*~"
  npc_override_job_wiz_wizard_hahaha_you_look_frighten_52bf63: "哈哈哈~ 你看起来很害怕。你知道，现在回头过轻松的生活还不晚。"
  npc_override_job_wiz_wizard_hahahaha_don_t_relax_jus_fb9312: "哈哈哈哈~ 不要太放松，还有第三次测试。"
  npc_override_job_wiz_wizard_hahahaha_i_ll_let_you_d44006: "哈哈哈哈~ 我就让你过关，因为你只错了一道题。你通过了第二次测试。"
  npc_override_job_wiz_wizard_hahahaha_surprising_comm_5effc4: "哈哈哈哈~ 令人惊讶，从你嘴里说出来，那是个非常明智的选择……*咳* *咳*"
  npc_override_job_wiz_wizard_hahahaha_you_desperate_s_ed2365: "哈哈哈哈~ 你就那么绝望吗？*打喷嚏* 真是个麻烦……"
  npc_override_job_wiz_wizard_hahahaha_you_don_t_know_869ed8: "哈哈哈哈~ 你不知道这有多危险……对付大魔法。"
  npc_override_job_wiz_wizard_hahahaha_you_re_one_want_5a6075: "哈哈哈哈~ 你就是那个想成为巫师的人？！"
  npc_override_job_wiz_wizard_hahahahaha_yeah_go_bring_ab973d: "哈哈哈哈哈~ 是啊！去给我带一个^3355FF破旧卷轴^000000。"
  npc_override_job_wiz_wizard_hahahahaha_you_look_frig_453894: "哈哈哈哈哈~ 你看起来很害怕。现在回头还不晚。"
  npc_override_job_wiz_wizard_hahahahahaha_cough_cough_60194d: "哈哈哈哈哈哈~ *咳* *咳* 如果你能正确回答所有这些问题，怎么在战斗中表现不好？？"
  npc_override_job_wiz_wizard_hahahahahaha_i_ve_never_1711a1: "哈哈哈哈哈哈~ 我从未见过有人如此……如此……*打喷嚏* 顽强。"
  npc_override_job_wiz_wizard_hahahahahahah_well_done_994dde: "哈哈哈哈哈哈~ 做得好，你通过了第二次测试。"
  npc_override_job_wiz_wizard_hahahahahahaha_now_there_bb46bb: "哈哈哈哈哈哈哈~ 这里有个傻瓜！"
