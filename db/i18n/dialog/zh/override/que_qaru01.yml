Body:

  npc_override_que_qaru01_okolnir_all_you_enjoy_them_toget_d55209: "你们大家一起享受……"
  npc_override_que_qaru01_okolnir_all_you_worked_together_7028f2: "你们大家一起 teamwork……"
  npc_override_que_qaru01_okolnir_always_real_b7b8cd: "永远保持真实。"
  npc_override_que_qaru01_okolnir_andvari_s_ring_757b0d: "安德瓦利的戒指。"
  npc_override_que_qaru01_okolnir_as_i_declared_i_give_c24b06: "正如我所宣告的，我将把女神的光辉赐予你。"
  npc_override_que_qaru01_okolnir_as_i_declared_you_worthy_f864af: "正如我所宣告的，你配得上持有{0}。"
  npc_override_que_qaru01_okolnir_as_you_know_place_test_b6d817: "如你所知，这是女武神为测试冒险者而创造的地方……"
  npc_override_que_qaru01_okolnir_behalf_humanbeings_who_d_623723: "代表在此击败神明的人类。"
  npc_override_que_qaru01_okolnir_bring_me_one_who_brought_4f2e64: "把带你来这里的这个人带来。"
  npc_override_que_qaru01_okolnir_brynhild_armor_piece_7aa04b: "布伦希尔德铠甲碎片"
  npc_override_que_qaru01_okolnir_building_okolnir_needs_q_482461: "建造奥科尼尔需要相当长的时间。"
  npc_override_que_qaru01_okolnir_castle_hidden_secret_240cce: "这座城堡隐藏着一个秘密。"
  npc_override_que_qaru01_okolnir_cold_moonlight_de4890: "冷月之光"
  npc_override_que_qaru01_okolnir_come_back_when_you_ready_67d3d7: "等你准备好了再回来。"
  npc_override_que_qaru01_okolnir_dawn_essence_b44de1: "黎明精华"
  npc_override_que_qaru01_okolnir_deliver_him_my_2f3791: "……把我的意志传达给他。"
  npc_override_que_qaru01_okolnir_did_you_forget_something_d85892: "……你忘了什么吗？"
  npc_override_que_qaru01_okolnir_don_t_hesitate_try_8d5fea: "不要犹豫，去尝试。"
  npc_override_que_qaru01_okolnir_dusk_glow_321a75: "黄昏微光"
  npc_override_que_qaru01_okolnir_eastern_magic_formation_d9c48d: "东方魔法阵正在运作，召唤血腥猎手。"
  npc_override_que_qaru01_okolnir_even_though_s_only_virtu_8d6ccc: "……即使这只是虚拟的……"
  npc_override_que_qaru01_okolnir_go_rachel_juno_meet_ravi_7829ca: "去拉赫和朱诺，与拉维姐妹见面。"
  npc_override_que_qaru01_okolnir_goddess_shines_brightly_1b508d: "…………女神的光辉照耀着你，你应该变得更强，才配得上它……"
  npc_override_que_qaru01_okolnir_goddess_tear_c4606b: "女神之泪"
  npc_override_que_qaru01_okolnir_good_luck_703764: "祝你好运。"
  npc_override_que_qaru01_okolnir_great_economy_defense_ok_cf1b83: "很好！经济和防御都没问题。"
  npc_override_que_qaru01_okolnir_guild_brought_into_world_7dc2db: "[{0}]，来自公会[{1}]，将{2}带到了这个世界。"
  npc_override_que_qaru01_okolnir_guild_opened_gates_realm_07ccfc: "[{0}]，来自公会[{1}]，打开了通往奥科尼尔领域的大门。"
  npc_override_que_qaru01_okolnir_hazy_starlight_6033c4: "朦胧星光。"
  npc_override_que_qaru01_okolnir_heavenly_maiden_s_robe_a_5146e9: "一件天女长袍，以及100个柔软羽毛。"
  npc_override_que_qaru01_okolnir_hero_remains_1d0c4c: "英雄遗骸"
  npc_override_que_qaru01_okolnir_hope_you_get_everything_3c8a5f: "希望你能得到你想要的一切……"
  npc_override_que_qaru01_okolnir_however_you_requirements_87f079: "然而，你身上没有所需的条件……"
  npc_override_que_qaru01_okolnir_humans_imperfect_so_thei_e47739: "人类是不完美的，所以他们的主神会在他们需要时帮助他们。"
  npc_override_que_qaru01_okolnir_humans_strong_when_they_eefa01: "人类团结时强大，但容易被欲望所左右。"
  npc_override_que_qaru01_okolnir_i_am_wish_maiden_804193: "我是……许愿少女。"
  npc_override_que_qaru01_okolnir_i_answer_all_your_reques_de1810: "如果你把这些带给我，我会满足你所有的请求。"
  npc_override_que_qaru01_okolnir_i_don_t_know_how_5ae1f9: "我不知道奥科尼尔是如何存在的，但我想只有女武神知道。"
  npc_override_que_qaru01_okolnir_i_feel_disappointed_all_0fd6dd: "我对你们所有人感到失望。"
  npc_override_que_qaru01_okolnir_i_give_you_some_things_92046f: "我会给你一些东西作为娱乐。"
  npc_override_que_qaru01_okolnir_i_hope_you_complete_all_aaea26: "我希望你能在虚拟奥科尼尔被摧毁之前完成所有试炼……"
  npc_override_que_qaru01_okolnir_i_hope_your_dreams_come_5bb040: "我希望你的梦想成真。"
  npc_override_que_qaru01_okolnir_i_open_gate_okolnir_if_6251df: "如果你的成员准备好了，我会打开奥科尼尔的大门。"
  npc_override_que_qaru01_okolnir_i_open_gate_you_come_c79f97: "我会为你打开大门，让你回到这里。"
  npc_override_que_qaru01_okolnir_i_test_whether_you_deser_655e06: "我会测试你是否配得上女神的光辉……"
  npc_override_que_qaru01_okolnir_i_ve_never_seen_you_3c74d6: "……我以前从未见过你。"
  npc_override_que_qaru01_okolnir_i_wait_you_top_okolnir_feea62: "我会在奥科尼尔的顶端等你……"
  npc_override_que_qaru01_okolnir_if_castle_s_economy_over_caf2e9: "如果城堡的^4d4dff经济超过65且防御也超过30^000000，就可以进入奥科尼尔。"
  npc_override_que_qaru01_okolnir_if_you_finished_time_oko_cd816a: "如果你在规定时间内没有完成，奥科尼尔将被摧毁，我将去休息。"
  npc_override_que_qaru01_okolnir_if_you_pass_all_tests_5b5d7f: "而且，如果你通过了奥科尼尔中女武神给予的所有试炼！"
  npc_override_que_qaru01_okolnir_if_you_ready_protect_cas_49ee05: "如果你准备好保护这座城堡。"
  npc_override_que_qaru01_okolnir_isn_t_simple_bda73a: "不简单吗？"
  npc_override_que_qaru01_okolnir_just_gather_your_fellow_b664b7: "召集你的同伴。"
  npc_override_que_qaru01_okolnir_just_go_away_a9324a: "走开……"
  npc_override_que_qaru01_okolnir_key_castle_095415: "钥匙在城堡里。"
  npc_override_que_qaru01_okolnir_many_valhala_s_flowers_a_b8d076: "还需要许多瓦尔哈拉之花作为祭品。"
  npc_override_que_qaru01_okolnir_menu_about_c499cb: "关于奥科尼尔。:前往奥科尼尔。:取消。"
  npc_override_que_qaru01_okolnir_menu_enter_a7cc9f: "现在进入。:不。"
  npc_override_que_qaru01_okolnir_menu_piamette_057581: "皮亚梅特：欢乐时光又回来了！现在，去吧！我会回来的！！"
  npc_override_que_qaru01_okolnir_menu_piamette_1e9d3f: "皮亚梅特：傻鸟！傻提奥！你为什么不一劳永逸地把笼子收起来？！"
  npc_override_que_qaru01_okolnir_menu_piamette_28d2bc: "皮亚梅特：所有钥匙守护者都死了吗？谁放了我的鸟？提奥，是谁干的？"
  npc_override_que_qaru01_okolnir_menu_piamette_2f9c62: "皮亚梅特嘀咕：哈！它们被关在笼子里了。"
  npc_override_que_qaru01_okolnir_menu_piamette_414bd7: "皮亚梅特：它们都被抓住了！"
  npc_override_que_qaru01_okolnir_menu_piamette_6b5ad9: "皮亚梅特嘀咕：……嘘……提奥。鸟儿回来了……它们是之前逃跑的鸟吗？还是伪装成善良冒险者的破坏者？"
  npc_override_que_qaru01_okolnir_menu_piamette_acda86: "皮亚梅特：钥匙守护者在保护我的笼子。"
  npc_override_que_qaru01_okolnir_menu_piamette_c93558: "皮亚梅特嘀咕：……有六只鸟，提奥。但有一只……"
  npc_override_que_qaru01_okolnir_menu_piamette_caaa7a: "皮亚梅特：我现在很生气！"
  npc_override_que_qaru01_okolnir_menu_piamette_df7fc1: "皮亚梅特：提奥，抓住那些鸟！把笼子从这里拿走！"
  npc_override_que_qaru01_okolnir_menu_piamette_ed8ae7: "皮亚梅特：让我们叫出钥匙守护者，不要让鸟儿走远。"
  npc_override_que_qaru01_okolnir_menu_sure_d1d739: "当然，我们去那里。:不。"
  npc_override_que_qaru01_okolnir_menu_we_9346a9: "我们准备好了。:我们需要更多时间。"
  npc_override_que_qaru01_okolnir_menu_wish_1357fb: "许愿少女：……奥科尼尔很快就要消失了……我会把你送回你原来的地方。"
  npc_override_que_qaru01_okolnir_menu_wish_405ff1: "许愿少女：……要有勇气……等待你的机会再来…… "
  npc_override_que_qaru01_okolnir_menu_wish_48b272: "许愿少女：但这就是结局。很快就会有召唤怪物出现……"
  npc_override_que_qaru01_okolnir_menu_wish_577989: "许愿少女：我真诚地欢迎你们所有的最大努力！"
  npc_override_que_qaru01_okolnir_menu_wish_640e9d: "许愿少女：你们到达了这里……你们的守护者死了吗……？"
  npc_override_que_qaru01_okolnir_menu_wish_7b1f71: "许愿少女：奥科尼尔的大门打开了！别忘了你们只有一个小时。"
  npc_override_que_qaru01_okolnir_menu_wish_9086b4: "许愿少女：……你们将陷入奥科尼尔的沉睡中…… "
  npc_override_que_qaru01_okolnir_menu_wish_b21672: "许愿少女：所以安全地来到我这里……"
  npc_override_que_qaru01_okolnir_menu_wish_b39ae5: "许愿少女：尽力而为，奥科尼尔将在一小时内消失！"
  npc_override_que_qaru01_okolnir_menu_wish_c5a7f0: "许愿少女：看到过去的影子感觉如何。这只是开始。"
  npc_override_que_qaru01_okolnir_menu_wish_ca6232: "许愿少女：你和皮亚梅特玩得开心吗？"
  npc_override_que_qaru01_okolnir_menu_wish_d2afbb: "许愿少女：你们所看到的都不是真实的，不要被神秘花园所迷惑。"
  npc_override_que_qaru01_okolnir_menu_wish_ef571d: "许愿少女：……很好，你配得上女神的光辉。"
  npc_override_que_qaru01_okolnir_menu_yes_a5b5ee: "是的，我是:抱歉，我稍后再试"
  npc_override_que_qaru01_okolnir_mourning_virtual_realm_o_76830a: "在这个虚拟领域奥科尼尔中哀悼。"
  npc_override_que_qaru01_okolnir_msg_79ef7f: "……."
  npc_override_que_qaru01_okolnir_mystic_garden_exit_now_o_417184: "神秘花园的出口现在打开了。"
  npc_override_que_qaru01_okolnir_northern_magic_formation_c39506: "北方魔法阵正在运作，召唤神殿守护者。"
  npc_override_que_qaru01_okolnir_now_i_open_gate_okolnir_880856: "现在我将打开我所在位置的奥科尼尔大门。"
  npc_override_que_qaru01_okolnir_ok_66d92d: "……好的……"
  npc_override_que_qaru01_okolnir_ok_c161fc: "好的……"
  npc_override_que_qaru01_okolnir_okolnir_355d25: "那就是^4d4dff'奥科尼尔'^000000。"
  npc_override_que_qaru01_okolnir_okolnir_begun_disappear_43ba00: "奥科尼尔已经开始消失。"
  npc_override_que_qaru01_okolnir_okolnir_disappear_minute_195dfb: "奥科尼尔将在5分钟后消失。"
  npc_override_que_qaru01_okolnir_okolnir_disappear_minute_4aa36f: "奥科尼尔将在2分钟后消失。"
  npc_override_que_qaru01_okolnir_okolnir_disappear_minute_8af2fa: "奥科尼尔将在4分钟后消失。"
  npc_override_que_qaru01_okolnir_okolnir_disappear_minute_9faafc: "奥科尼尔将在20分钟后消失。"
  npc_override_que_qaru01_okolnir_okolnir_disappear_minute_a3d8d2: "奥科尼尔将在10分钟后消失。"
  npc_override_que_qaru01_okolnir_okolnir_disappear_minute_bb2274: "奥科尼尔将在3分钟后消失。"
  npc_override_que_qaru01_okolnir_okolnir_disappear_minute_bdff2a: "奥科尼尔将在1分钟后消失。"
  npc_override_que_qaru01_okolnir_okolnir_disappear_minute_e3f4ed: "奥科尼尔将在30分钟后消失。"
  npc_override_que_qaru01_okolnir_okolnir_kind_virtual_rea_fd2a59: "奥科尼尔是一种虚拟领域……"
  npc_override_que_qaru01_okolnir_okolnir_virtual_place_26f721: "奥科尼尔是一个虚拟的地方。"
  npc_override_que_qaru01_okolnir_okolnir_won_t_last_forev_cc4f42: "……奥科尼尔不会永远存在……"
  npc_override_que_qaru01_okolnir_once_all_those_prepared_0ed5db: "一旦所有这些都准备好了，大门就会打开。"
  npc_override_que_qaru01_okolnir_only_opens_when_everyone_49a074: "只有当所有人齐心协力时，它才会打开。"
  npc_override_que_qaru01_okolnir_only_qualified_enter_oko_41a91c: "只有合格者才能进入奥科尼尔和瓦尔哈拉。"
  npc_override_que_qaru01_okolnir_only_those_prepared_may_19bab1: "只有准备好的人才能进入这里。"
  npc_override_que_qaru01_okolnir_piamette_been_released_s_c2386e: "皮亚梅特已经被释放，所以通往南方的传送门现在正在运作。"
  npc_override_que_qaru01_okolnir_please_bring_those_four_a7bfa7: "请把那四样东西带来，10个玛瑙，10个玫瑰石英，以及20个精灵矿石，"
  npc_override_que_qaru01_okolnir_please_develop_your_cast_58edbf: "请更多地发展你的城堡……"
  npc_override_que_qaru01_okolnir_please_follow_me_5f824a: "请跟我来……"
  npc_override_que_qaru01_okolnir_qualifications_da6278: "资格？"
  npc_override_que_qaru01_okolnir_really_e7da47: "真的吗？"
  npc_override_que_qaru01_okolnir_regret_your_actions_49e2fe: "不要后悔你的行为……"
  npc_override_que_qaru01_okolnir_remember_74122e: "记住……"
  npc_override_que_qaru01_okolnir_sorry_hear_c159fd: "很遗憾听到这个。"
  npc_override_que_qaru01_okolnir_takes_about_hours_create_643794: "创建虚拟领域大约需要12到13个小时。"
  npc_override_que_qaru01_okolnir_there_no_room_error_ther_0fba20: "那里不容许任何错误。"
  npc_override_que_qaru01_okolnir_there_too_many_people_yo_99de24: "人太多了，你无法进入。"
  npc_override_que_qaru01_okolnir_trials_facing_you_5d7813: "你面临的试炼？"
  npc_override_que_qaru01_okolnir_valkyrie_armor_10eefb: "女武神铠甲"
  npc_override_que_qaru01_okolnir_valkyrie_s_token_eb4157: "女武神令牌"
  npc_override_que_qaru01_okolnir_warp_gate_responds_cryst_9145e8: "传送门对水晶钥匙有反应。"
  npc_override_que_qaru01_okolnir_western_magic_formation_8005ac: "西方魔法阵正在运作，召唤暗影守护者。"
  npc_override_que_qaru01_okolnir_yes_valkyrie_definitely_fde98a: "是的，女武神肯定更喜欢强大的冒险者。"
  npc_override_que_qaru01_okolnir_you_afraid_bd0439: "……你害怕"
  npc_override_que_qaru01_okolnir_you_also_receive_mysteri_b962cf: "你还会收到一份神秘的礼物。"
  npc_override_que_qaru01_okolnir_you_enter_okolnir_now_246163: "你现在可以进入奥科尼尔了……"
  npc_override_que_qaru01_okolnir_you_granted_power_great_3654d0: "你将被赋予伟大女武神的力量……"
  npc_override_que_qaru01_okolnir_you_know_qualifications_adb05f: "……你知道进入奥科尼尔的资格。"
  npc_override_que_qaru01_okolnir_you_like_try_enter_here_5d54da: "你想尝试进入这里吗？"
  npc_override_que_qaru01_okolnir_you_ll_wait_ac58b3: "你得等。"
  npc_override_que_qaru01_okolnir_you_must_bring_several_i_34f9c0: "你必须带几样道具才能进入奥科尼尔。"
  npc_override_que_qaru01_okolnir_you_must_bring_those_six_b9c631: "你必须带那六样东西，10个黄金，以及20个精灵矿石。"
  npc_override_que_qaru01_okolnir_you_need_collect_many_so_08190c: "你需要收集许多柔软羽毛。"
  npc_override_que_qaru01_okolnir_you_need_crystal_key_act_8e4c26: "你需要水晶钥匙来激活传送门。"
  npc_override_que_qaru01_okolnir_you_need_members_present_430622: "你需要16到20名成员在场才能打开奥科尼尔的大门。"
  npc_override_que_qaru01_okolnir_you_need_members_present_69d5d2: "^4d4dff你需要16到20名成员在场^000000。"
  npc_override_que_qaru01_okolnir_you_only_one_hour_7c2d9c: "^ff0000你只有一个小时。^000000"
  npc_override_que_qaru01_okolnir_you_qualified_155c71: "……你不合格。"
  npc_override_que_qaru01_okolnir_you_qualified_yet_0cd699: "你还不合格。"
  npc_override_que_qaru01_okolnir_you_ready_endure_trials_be01f1: "你准备好忍受获得女神荣耀的试炼了吗？"
  npc_override_que_qaru01_okolnir_you_ready_go_through_53f3e5: "你准备好通过了吗？"
  npc_override_que_qaru01_okolnir_you_requirements_carry_e5e0c2: "你有携带它的条件……"
  npc_override_que_qaru01_okolnir_you_should_catch_chance_9e1100: "你应该在机会来临时抓住它。"
  npc_override_que_qaru01_okolnir_you_strangers_here_you_d_946214: "你们是这里的陌生人。你们最好现在就离开。"
  npc_override_que_qaru01_okolnir_you_think_you_defeat_god_5c27f1: "你以为你能轻易击败女神的光辉吗？"
  npc_override_que_qaru01_okolnir_you_try_anytime_future_a28e04: "你可以在未来任何时候尝试……"
  npc_override_que_qaru01_okolnir_you_wait_again_e41dfb: "你得再次等待……"
  npc_override_que_qaru01_okolnir_you_want_go_there_0f0eaa: "你想去那里吗？"
  npc_override_que_qaru01_okolnir_you_wish_enter_09e175: "你希望进入吗？"
