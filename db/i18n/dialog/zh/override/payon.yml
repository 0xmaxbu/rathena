  npc_override_payon_26-40_please_bring_my_order_di_372328: "Please bring my order. Dieshin will give you my product."
  npc_override_payon_26-40_please_check_your_quest_4755aa: "Please check your Quest Window by pressing 'alt + u'."
  npc_override_payon_26-40_porings_steal_items_if_t_1e998e: "Porings steal items if they see them on the ground. However, Marin has no interest in dropped items. So I was wondering, how come Marin doesn't pay attention to gathering items even though they are the same kind of monster as Porings."
  npc_override_payon_26-40_really_hmm_oh_right_you_8cd9f0: "Really? Hmm, oh right. You don't look sophisticated."
  npc_override_payon_26-40_recent_research_came_out_90be75: "Recent research came out and showed that this monster can be tamed and trained by Honey."
  npc_override_payon_26-40_s_shaped_like_insect_bla_146e6a: "It's shaped like an insect with black sleek skin and it has a giant horn it's head."
  npc_override_payon_26-40_thank_you_very_much_god_0d634e: "Thank you very much. God bless you!"
  npc_override_payon_26-40_there_currently_no_escor_5b670f: "There are currently no Escort Missions registered on the board."
