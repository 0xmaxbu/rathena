  npc_override_payon_26-40_hunting_mission_details_980e96: "- Hunting Mission details -"
  npc_override_payon_26-40_i_am_currently_studying_11b1b3: "I am currently studying about it and try to prove the theory. So I plan to kill the flies around Bigfoot and observe his reaction."
  npc_override_payon_26-40_i_am_currently_studying_ce52a5: "I am currently studying about it and trying to prove the theory. So I plan to set a Honey trap on the places he usually passes and observe his reaction."
