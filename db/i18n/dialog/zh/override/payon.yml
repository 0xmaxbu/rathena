Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_payon_26-40_according_recent_researc_9f76a9: "根据最近的研究，苍蝇和大脚怪怪物有共生关系。"
  npc_override_payon_26-40_ah_ha_i_got_c8b5f1: "啊哈！我明白了！"
  npc_override_payon_26-40_anyway_i_here_waiting_yo_3b92ce: "不管怎样，我会在这里等你。完成任务后请回来！"
  npc_override_payon_26-40_arrived_much_faster_than_7978d0: "它比我想象的到得还要快。我想马上测试它！"
  npc_override_payon_26-40_arrived_much_faster_than_cbce5d: "它比我想象的到得还要快。我想马上测试它们！"
  npc_override_payon_26-40_bigfoot_around_north_gef_c55f76: "Bigfoot is around the north of 吉芬 field or the southeast of 斐扬 field."
  npc_override_payon_26-40_blankets_must_biologist_c60e9e: "毯子！一定是鲁提南部田野的生物学家订的毯子。"
  npc_override_payon_26-40_board_4eebe1: "- 在公告板上。 -"
  npc_override_payon_26-40_both_monsters_canbe_foun_cefea3: "两种怪物都可以在玩具工厂仓库或玩具监控室找到。要到达那里，请询问艾尔帕兰东北部的克劳斯先生。"
  npc_override_payon_26-40_broken_clock_hu_hu_c040d9: "破钟……？呼呼……"
  npc_override_payon_26-40_bulletin_board_bfde66: "- 在公告板上。 -"
  npc_override_payon_26-40_bye_bye_900aac: "拜拜～"
  npc_override_payon_26-40_delivery_mission_details_0cadb1: "- 送货任务详情 -"
  npc_override_payon_26-40_dieshin_s_cooperation_mo_e9ba15: "迪辛的合作动机是提供最快、最可靠的送货服务。所以请立即送货，不要延误。"
  npc_override_payon_26-40_find_skeletons_you_bette_ffa9e1: "To find Skeletons, you better check 斐扬 Dungeon 1F, which is located in Archer Village, north of 斐扬."
  npc_override_payon_26-40_gathering_mission_detail_2ef143: "- 收集任务详情 -"
  npc_override_payon_26-40_get_ayothaya_you_better_4c8708: "To get to 哎哟泰雅, you better go to 'Aibakthing' in 艾尔贝塔 and pay his fare."
  npc_override_payon_26-40_get_there_ask_kafra_empl_307840: "To get there, ask a Kafra Employee in 吉芬, they can warp you there."
  npc_override_payon_26-40_getting_piece_cake_you_s_c70087: "要获得蛋糕碎片，你应该寻找「神秘箱」。"
  npc_override_payon_26-40_give_me_08de78: "给我！"
  npc_override_payon_26-40_ha_ha_04c053: "哈～！哈～！"
  npc_override_payon_26-40_here_some_hair_broken_cl_bc3b4e: "这里有一些头发～一个破钟～！"
  npc_override_payon_26-40_here_thank_you_very_much_01fc34: "给你。非常感谢你。上帝保佑你！"
  npc_override_payon_26-40_hey_dude_you_look_like_0449ce: "嘿～！伙计！你看起来是个非常富有的冒险者。"
  npc_override_payon_26-40_hmm_i_thought_dieshin_fa_832fbc: "嗯，我以为迪辛又快又准，但你给我带来了一个空箱子。真令人失望。"
  npc_override_payon_26-40_honey_i_ordered_you_sent_764f99: "这是我要的蜂蜜！你是迪辛派来的吧？"
  npc_override_payon_26-40_honey_must_entomologist_781a0a: "Honey? It must be the Entomologist at the west of St. Capitolina Abbey, wich is northeast of 普隆德拉 who ordered the Honey."
  npc_override_payon_26-40_how_i_help_you_13e773: "我能帮你什么？"
  npc_override_payon_26-40_hu_hu_we_delivery_men_2cb559: "呼呼～～我们是送货员～"
  npc_override_payon_26-40_huh_73fef0: "嗯？"
  npc_override_payon_26-40_huh_whatever_careful_s_v_5beb3c: "哼，随便吧。但要小心！这里非常滑。"
  npc_override_payon_26-40_huh_you_sure_something_w_b41d56: "Huh? Are you sure? Something is wrong……"
  npc_override_payon_26-40_hunting_mission_details_980e96: "- 狩猎任务详情 -"
  npc_override_payon_26-40_i_am_currently_studying_11b1b3: "我目前正在研究这个，试图证明这个理论。所以我计划消灭大脚怪周围的苍蝇并观察它的反应。"
  npc_override_payon_26-40_i_am_currently_studying_ce52a5: "我目前正在研究这个，试图证明这个理论。所以我计划在他经常经过的地方设置蜂蜜陷阱并观察他的反应。"
  npc_override_payon_26-40_i_am_waiting_special_del_afb25b: "我在等一个特殊的快递。"
  npc_override_payon_26-40_i_appreciate_your_kindne_995138: "我很感激你的好意。"
  npc_override_payon_26-40_i_been_waiting_a654ae: "我一直在等这个！"
  npc_override_payon_26-40_i_give_you_reward_as_2c66d3: "我会按约定给你奖励。"
  npc_override_payon_26-40_i_give_you_reward_as_9724ec: "我会按约定给你奖励。"
  npc_override_payon_26-40_i_give_you_reward_if_3a1557: "如果你完成任务，我会给你奖励。好吗？我们说定了？"
  npc_override_payon_26-40_i_see_you_gathering_miss_06d0ef: "我看你有一个收集任务。"
  npc_override_payon_26-40_if_you_forgot_where_deli_f89913: "如果你忘了送去哪里，请按 'alt + u' 查看任务窗口。"
  npc_override_payon_26-40_if_you_forgot_where_make_e74ae6: "如果你忘了送去哪里，请按 'alt + u' 查看任务窗口。"
  npc_override_payon_26-40_insecticide_i_ordered_yo_bea5f7: "这是我要的杀虫剂！你是迪辛派来的吧？"
  npc_override_payon_26-40_insecticide_must_zoologi_bda1b0: "The insecticide? It must be the Zoologist on the southeast of 斐扬 who ordered the Insecticide."
  npc_override_payon_26-40_look_like_usual_poring_u_37aa6e: "它看起来像普通的波利，但它有独特的特征。"
  npc_override_payon_26-40_looks_like_bear_red_fur_d9c1a3: "它看起来像一只长着红色毛皮、肩膀上有 'X' 形伤疤的熊。"
  npc_override_payon_26-40_lu_huh_5c0493: "噜～？嗯？"
  npc_override_payon_26-40_lu_lu_lu_lu_029568: "噜～噜～噜～噜～"
  npc_override_payon_26-40_many_missions_5ff377: "- 许多任务 -"
  npc_override_payon_26-40_martins_found_mjolnir_de_f1ec11: "马丁斯可以在妙勒尼废弃矿坑找到，但二楼很危险，所以要小心！"
  npc_override_payon_26-40_menu_deliver_84e760: "送货杀虫剂:送货蜂蜜:送货毯子（Lv.35 以上）"
  npc_override_payon_26-40_menu_deliver_cfddc0: "送货杀虫剂。:送货蜂蜜。:送货毯子。"
  npc_override_payon_26-40_menu_gather_0c372f: "收集骨头:收集动物皮:收集剥皮:收集尾巴:收集饼干:收集胡须"
  npc_override_payon_26-40_menu_gather_dc0bd4: "收集骨头:收集动物皮:收集剥皮（Lv.30 以上）:收集尾巴（Lv.32 以上）:收集饼干（Lv.35 以上）:收集胡须（Lv.35 以上）"
  npc_override_payon_26-40_menu_hunting_57c01a: "狩猎毒孢子:狩猎烟幕:狩猎老柳树:狩猎可可:狩猎塔拉蛙"
  npc_override_payon_26-40_menu_hunting_63e8fd: "狩猎毒孢子:狩猎烟幕:狩猎老柳树（Lv.30 以上）:狩猎可可（Lv.35 以上）:狩猎塔拉蛙（Lv.38 以上）"
  npc_override_payon_26-40_menu_hunting_e8ac92: "狩猎任务:送货任务:收集任务:护送任务"
  npc_override_payon_26-40_menu_i_2cc286: "……I am not interested.:Here is the Honey."
  npc_override_payon_26-40_menu_i_6a5823: "……I am not interested.:Here are the blankets."
  npc_override_payon_26-40_menu_i_7222bf: "……I am not interested.:Here is the Insecticide."
  npc_override_payon_26-40_menu_i_8d34db: "我不需要帮助。:我有个送货任务。"
  npc_override_payon_26-40_menu_i_ccdbda: "我准备走了。:我有个狩猎任务。"
  npc_override_payon_26-40_menu_i_f8bcba: "我是个贫穷的冒险者。:我有一个收集任务。"
  npc_override_payon_26-40_menu_no_4e32ed: "不，我不接受。:是，我接受。"
  npc_override_payon_26-40_more_details_please_pres_fa6de3: "更多详情请按 'Alt + U' 查看任务窗口。"
  npc_override_payon_26-40_oh_ho_yes_one_08b61f: "哦吼！是的！那个！"
  npc_override_payon_26-40_oh_i_need_honey_continue_f74d19: "哦，我需要蜂蜜来继续研究。"
  npc_override_payon_26-40_oh_i_need_insecticide_co_523df0: "哦，我需要杀虫剂来继续研究。"
  npc_override_payon_26-40_oh_right_7b0704: "哦，对！"
  npc_override_payon_26-40_oh_well_then_go_figure_28190b: "哦，好吧。那你自己想办法吧。"
  npc_override_payon_26-40_oh_well_then_go_figure_7534f7: "哦，好吧。那你自己想办法吧。拜～！"
  npc_override_payon_26-40_oh_you_eden_group_a41141: "哦，你是伊甸园的？"
  npc_override_payon_26-40_oh_you_right_e79870: "哦，你说得对。"
  npc_override_payon_26-40_piere_andre_deniro_vitat_d8452d: "'Piere', 'Andre', 'Deniro' and 'Vitata' are in Ant Hell which is located near the Saint Darmain Fortress soutwest of 梦罗克."
  npc_override_payon_26-40_place_freaking_cold_20d6dd: "但是，这地方冷得要命。"
  npc_override_payon_26-40_please_bring_my_order_di_372328: "请把我的订单送来。迪辛会把我的产品给你的。"
  npc_override_payon_26-40_please_check_your_quest_4755aa: "请按 'alt + u' 查看任务窗口。"
  npc_override_payon_26-40_porings_steal_items_if_t_1e998e: "波利如果看到地上的物品就会偷走。但是，马里恩对掉落的物品不感兴趣。所以我在想，为什么马里恩虽然是和波利同种的怪物，却对收集物品不感兴趣呢。"
  npc_override_payon_26-40_really_hmm_oh_right_you_8cd9f0: "真的吗？嗯，哦对。你看起来并不成熟。"
  npc_override_payon_26-40_recent_research_came_out_90be75: "最近的研究表明，这种怪物可以被蜂蜜驯服和训练。"
  npc_override_payon_26-40_s_shaped_like_insect_bla_146e6a: "它形状像昆虫，有黑色光滑的皮肤，头上有一个巨大的角。"
  npc_override_payon_26-40_thank_you_very_much_god_0d634e: "非常感谢你。上帝保佑你！"
  npc_override_payon_26-40_there_currently_no_escor_5b670f: "目前公告板上没有护送任务。"
  npc_override_payon_26-40_thief_bug_female_thief_b_1afe8a: "'Thief Bug', 'Female Thief Bug' and 'Male Thief Bug' are int he Prontere Culvert. To get there, you need to be a volunteer of the 普隆德拉 Culvert's punitive force."
  npc_override_payon_26-40_those_blankets_i_ordered_d99568: "这是我要的毯子！你是迪辛派来的吧？"
  npc_override_payon_26-40_wait_you_already_deliver_dd9162: "等等，但你已经有快递箱了。"
  npc_override_payon_26-40_we_faster_than_any_fligh_2a14fd: "我们比任何航班都快～！"
  npc_override_payon_26-40_we_fastest_delivery_comp_acb494: "我们是最快的快递公司，迪辛公司。"
  npc_override_payon_26-40_we_t_allow_you_deliver_317cd1: "我们不能让你一次送两个箱子。所以，请先完成你的送货。"
  npc_override_payon_26-40_weird_eb0b7c: "这很奇怪。"
  npc_override_payon_26-40_welcome_welcome_53b5c8: "欢迎～欢迎！"
  npc_override_payon_26-40_well_done_good_job_thank_099f8c: "做得好。干得好！非常感谢你！这里有一份小礼物给你。"
  npc_override_payon_26-40_well_i_requested_mission_e33e12: "好吧，我委托了任务，你做得很好。"
  npc_override_payon_26-40_what_did_you_bring_c7baff: "但是，你带了什么？"
  npc_override_payon_26-40_what_innocent_face_ha_ha_02f5ee: "多么天真的脸！哈～哈哈哈。"
  npc_override_payon_26-40_what_mission_you_4dfd1e: "你有什么任务？"
  npc_override_payon_26-40_where_bear_s_footskins_a_0176fd: "但是，熊脚皮和动物皮在哪里？"
  npc_override_payon_26-40_where_mole_whiskerss_mol_bfc65c: "但是，鼹鼠胡须和鼹鼠爪子在哪里？？"
  npc_override_payon_26-40_where_skel_bones_7766bb: "但是，骷髅骨头在哪里？"
  npc_override_payon_26-40_where_well_baked_cookies_249d5a: "但是，烤得好的饼干和蛋糕碎片在哪里？"
  npc_override_payon_26-40_where_worm_peelings_garl_241640: "但是，蠕虫皮和大蒜在哪里？"
  npc_override_payon_26-40_where_yoyo_tails_acorns_60b5c7: "但是，溜溜猴尾巴、橡子和浣熊叶子在哪里？"
  npc_override_payon_26-40_why_don_t_you_some_8de43d: "你为什么不去外面狩猎，而不是到处闲逛浪费时间？"
  npc_override_payon_26-40_why_you_carrying_so_many_5d6e2c: "你为什么带着这么多东西？"
  npc_override_payon_26-40_wow_i_didn_t_expect_0a39e6: "哇，我没想到你会做那个任务。我正要放弃。但你做得很好。我很感激！"
  npc_override_payon_26-40_wow_you_did_excellent_jo_ac8f7a: "哇～你做得很好！"
  npc_override_payon_26-40_wow_you_must_beginner_ri_fc8417: "哇，你一定是个新手吧？"
  npc_override_payon_26-40_you_accept_mission_65f67e: "你要接受这个任务吗？"
  npc_override_payon_26-40_you_already_doing_missio_6b1850: "你已经在做这个任务了。"
  npc_override_payon_26-40_you_bring_bear_s_footski_b4266b: "你必须带 10 个「熊脚皮」和「5 个动物皮」！"
  npc_override_payon_26-40_you_bring_mole_whiskers_803f16: "你必须带「5 个鼹鼠胡须」和「3 个鼹鼠爪子」来完成这个任务。"
  npc_override_payon_26-40_you_bring_well_baked_coo_f5be9c: "你必须带「5 个烤得好的饼干」和「1 个蛋糕碎片」来完成这个任务。"
  npc_override_payon_26-40_you_bring_worm_peelings_9fd555: "你必须带「20 个蠕虫皮」和「20 个大蒜」来完成这个任务。"
  npc_override_payon_26-40_you_bring_yoyo_tails_aco_60d8d5: "你必须带「10 个溜溜猴尾巴」、「10 个橡子」和「10 个浣熊叶子」来完成这个任务。"
  npc_override_payon_26-40_you_check_world_map_pres_c73249: "你可以按 'ctrl + ~' 键查看世界地图。"
  npc_override_payon_26-40_you_dieshin_s_delivery_m_ce349b: "你不是迪辛的送货员？"
  npc_override_payon_26-40_you_don_t_enough_skel_109bab: "You don't have enough 'Skel-Bones'…… You can find it when you hunt Skeletons."
  npc_override_payon_26-40_you_find_bear_s_footskin_0b0490: "你可以从大脚怪那里获得熊脚皮，从动物那里获得动物皮。"
  npc_override_payon_26-40_you_find_them_easily_aro_bbd354: "You can find them easily around fields, but the field east of 哎哟泰雅 is the best spot for hunting all 3 monsters."
  npc_override_payon_26-40_you_get_reward_client_af_e74073: "完成任务后你可以从委托人那里获得奖励。"
  npc_override_payon_26-40_you_get_those_items_mart_79f97b: "你可以从「马丁斯」那里获得那些物品。"
  npc_override_payon_26-40_you_get_those_items_pier_0e19bb: "你可以从「皮埃尔」、「安德雷」、「德尼罗」、「维塔塔」、「盗虫」、「雌盗虫」和「雄盗虫」那里获得那些物品。"
  npc_override_payon_26-40_you_get_well_baked_cooki_eab6e6: "你可以从穿红衬衫或绿衬衫的「饼干」那里获得烤得好的饼干。"
  npc_override_payon_26-40_you_get_yoyo_tails_yoyo_352712: "你可以从「溜溜猴」那里获得溜溜猴尾巴，从「可可」那里获得橡子，从「烟幕」那里获得浣熊叶子。"
  npc_override_payon_26-40_you_go_lutie_asking_mr_d7c292: "你可以通过询问艾尔帕兰东北部的克劳斯先生去鲁提。"
  npc_override_payon_26-40_you_haven_t_done_mission_75b871: "但是你还没有完成任务。你为什么现在来找我？你还没有完成任务！"
  npc_override_payon_26-40_you_haven_t_done_mission_905cc9: "你还没有完成任务。你为什么回到这里？"
  npc_override_payon_26-40_you_heard_about_horn_mon_601519: "你听说过角怪吗？"
  npc_override_payon_26-40_you_heard_about_marin_mo_5048a8: "你听说过马里恩怪物吗？"
  npc_override_payon_26-40_you_heard_monster_named_87ab63: "你听说过一种叫大脚怪的怪物吗？"
  npc_override_payon_26-40_you_poor_adventurer_good_158eb0: "你是个贫穷的冒险者～！祝你好运！"
  npc_override_payon_26-40_you_qualified_member_you_d580c6: "你不是合格的成员。你不能使用公告板。"
  npc_override_payon_26-40_you_training_course_some_283f9b: "你是在参加什么培训课程吗？"
  npc_override_payon_26-40_your_level_qualified_you_793fcf: "你的等级不合格。你不能使用公告板。"
  npc_override_payon_advanced_refiner_all_cards_properties_los_b9c35a: "其中的卡片和属性^ff0000都会消失^000000！"
  npc_override_payon_advanced_refiner_and_cffa50: "和"
  npc_override_payon_advanced_refiner_armor_e3aa3f: "防具"
  npc_override_payon_advanced_refiner_armor_equipment_so_let_m_14d6e8: "防具和装备，请告诉我"
  npc_override_payon_advanced_refiner_because_if_weapon_breaks_3da649: "因为如果武器因为不合理的精炼而损坏，我的心情也会变差。"
  npc_override_payon_advanced_refiner_besides_equipment_break_a19fa5: "^ff0000而且，装备会直接损坏！^000000"
  npc_override_payon_advanced_refiner_clang_clang_clang_c21f74: "铛！铛！铛！"
  npc_override_payon_advanced_refiner_even_your_cards_your_mod_9a9c85: "连卡片和改造效果都会^ff0000完全消失^000000。"
