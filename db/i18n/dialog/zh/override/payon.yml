Body:
  npc_override_payon_26-40_according_recent_researc_9f76a9: "According to the recent research, flies and Bigfoot monsters have a symbiotic relationship."
  npc_override_payon_26-40_ah_ha_i_got_c8b5f1: "Ah ha! I got it!"
  npc_override_payon_26-40_anyway_i_here_waiting_yo_3b92ce: "Anyway, I will be here waiting for you. Please come back when you finish the mission!"
