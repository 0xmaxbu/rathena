  npc_override_payon_26-40_i_appreciate_your_kindne_995138: "I appreciate your kindness."
  npc_override_payon_26-40_i_been_waiting_a654ae: "I have been waiting for this!"
  npc_override_payon_26-40_i_give_you_reward_as_2c66d3: "I will give you a reward as promised."
