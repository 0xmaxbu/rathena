  npc_override_payon_26-40_dieshin_s_cooperation_mo_e9ba15: "Dieshin's cooperation motive is to give the fastest and credited delivery. So please deliver it now without any delay."
  npc_override_payon_26-40_find_skeletons_you_bette_ffa9e1: "To find Skeletons, you better check 斐扬 Dungeon 1F, which is located in Archer Village, north of 斐扬."
  npc_override_payon_26-40_gathering_mission_detail_2ef143: "- Gathering Mission details -"
  npc_override_payon_26-40_get_ayothaya_you_better_4c8708: "To get to 哎哟泰雅, you better go to 'Aibakthing' in 艾尔贝塔 and pay his fare."
