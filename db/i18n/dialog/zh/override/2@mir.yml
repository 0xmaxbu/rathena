  npc_override_2@mir_RitualOfBlessing_menu_kronecker_b6f32e: "克罗内克:根据在王宫中世代相传的王室议会，"
  npc_override_2@mir_RitualOfBlessing_menu_kronecker_fe15d9: "克罗内克:致我们的新国王……"
