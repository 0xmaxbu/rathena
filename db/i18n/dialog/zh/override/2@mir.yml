Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_2@mir_RitualOfBlessing_after_i_left_banquet_hal_87c547: "After I left the Banquet Hall"
  npc_override_2@mir_RitualOfBlessing_all_my_fault_11902a: "...This... Is all... My fault..."
  npc_override_2@mir_RitualOfBlessing_all_seem_well_b4f173: "All seem well."
  npc_override_2@mir_RitualOfBlessing_argh_e047e4: "Argh!!!"
  npc_override_2@mir_RitualOfBlessing_argh_watch_out_65b433: "Argh! Watch out!"
  npc_override_2@mir_RitualOfBlessing_been_taken_them_cfa08d: "Has it been taken by them?"
  npc_override_2@mir_RitualOfBlessing_cheer_up_766155: "Cheer up!"
  npc_override_2@mir_RitualOfBlessing_courage_take_step_forwar_8e7bf2: "The courage to take a step forward without turning back, and stab the enemy with a dagger,"
  npc_override_2@mir_RitualOfBlessing_crown_passed_down_palace_8c825c: "It is the crown passed down in the palace of Rune-Midgarts."
  npc_override_2@mir_RitualOfBlessing_die_43d4ce: "Die!!!"
  npc_override_2@mir_RitualOfBlessing_don_t_get_out_now_1475ae: "Don't get out now."
  npc_override_2@mir_RitualOfBlessing_don_t_give_me_look_f1c9f8: "Don't give me that look. I have wasted my time here as well, you know."
  npc_override_2@mir_RitualOfBlessing_eh_where_did_they_come_f5d908: "...Eh... Where did they come from?"
  npc_override_2@mir_RitualOfBlessing_everyone_all_right_da27bd: "Is everyone all right..."
  npc_override_2@mir_RitualOfBlessing_example_e4a9a1: "For example..."
  npc_override_2@mir_RitualOfBlessing_fake_resembling_ymir_s_h_873da0: "This fake resembling Ymir's Heart!"
  npc_override_2@mir_RitualOfBlessing_fellows_let_s_leave_plac_fd4903: "Fellows! Let's leave this place!"
  npc_override_2@mir_RitualOfBlessing_geoborg_a5b79b: "Geoborg"
  npc_override_2@mir_RitualOfBlessing_ha_what_good_all_power_55284e: "Ha! What good does all the power do when you don't know how to use it? I guess you don't need this anymore."
  npc_override_2@mir_RitualOfBlessing_haha_i_didn_t_expect_f13284: "...Haha, I didn't expect to fight here!"
  npc_override_2@mir_RitualOfBlessing_heart_embrace_everything_676e1e: "The heart to embrace everything in this world,"
  npc_override_2@mir_RitualOfBlessing_heh_b22285: "Heh!"
  npc_override_2@mir_RitualOfBlessing_heine_9bd964: "Heine"
  npc_override_2@mir_RitualOfBlessing_hm_19ba4b: "Hm!"
  npc_override_2@mir_RitualOfBlessing_hold_there_no_fun_i_245200: "Hold it there. It is no fun. I may want to destroy something."
  npc_override_2@mir_RitualOfBlessing_how_dare_you_ed4bee: "...How dare you..."
  npc_override_2@mir_RitualOfBlessing_i_am_counting_you_3b15d1: "I am counting on you!"
  npc_override_2@mir_RitualOfBlessing_i_am_sorry_interrupt_fun_baefaa: "I am sorry to interrupt the fun!"
  npc_override_2@mir_RitualOfBlessing_i_heard_there_something_6c6bed: "I have heard that there is something really nice hidden here..."
  npc_override_2@mir_RitualOfBlessing_i_help_9aa504: "...Will I be a help?"
  npc_override_2@mir_RitualOfBlessing_i_hope_helps_you_cc0d7d: "...I hope it helps you."
  npc_override_2@mir_RitualOfBlessing_i_ll_see_you_out_bd8a4d: "I'll see you out there."
  npc_override_2@mir_RitualOfBlessing_i_shall_get_going_brothe_34244e: "...I shall get going. The brothers don't look so good."
  npc_override_2@mir_RitualOfBlessing_i_t_help_old_man_ebba51: "But I can't help it, old man. This is fake."
  npc_override_2@mir_RitualOfBlessing_i_ve_been_wondering_when_c7c5b5: "I've been wondering when you would arrive."
  npc_override_2@mir_RitualOfBlessing_intact_pride_which_never_fca89e: "The intact pride which never bends in the justice and faith no matter what,"
  npc_override_2@mir_RitualOfBlessing_let_s_get_out_here_20981b: "Let's get out of here now."
  npc_override_2@mir_RitualOfBlessing_let_s_meet_past_memories_fac78e: "Let's meet at the Past Memories of the Royal Family."
  npc_override_2@mir_RitualOfBlessing_look_who_s_talking_824e31: "Look who's talking!!!"
  npc_override_2@mir_RitualOfBlessing_mean_3f5c27: "Does it mean..."
  npc_override_2@mir_RitualOfBlessing_means_more_than_ordinary_261b34: "It means more than an ordinary crown."
  npc_override_2@mir_RitualOfBlessing_menu_intruder_7db6ed: "Intruder: Then ladies and gentlemen, have a good time!"
  npc_override_2@mir_RitualOfBlessing_menu_kronecker_17942d: "Kronecker: Although there has been a slight delay, let me proceed."
  npc_override_2@mir_RitualOfBlessing_menu_kronecker_34d5e7: "Kronecker: The blessing star light may reach the glory of the earth..."
  npc_override_2@mir_RitualOfBlessing_menu_kronecker_5233ec: "Kronecker: On the behalf of the seven royal families supporting Rune-Midgarts,"
  npc_override_2@mir_RitualOfBlessing_menu_kronecker_562ce9: "Kronecker: Peter!!!"
  npc_override_2@mir_RitualOfBlessing_menu_kronecker_7ceb31: "Kronecker: Here is the new representative appointed"
  npc_override_2@mir_RitualOfBlessing_menu_kronecker_b6f32e: "Kronecker: According to the Royal Assembly which has passed down in the palace,"
  npc_override_2@mir_RitualOfBlessing_menu_kronecker_fe15d9: "Kronecker: To our new king..."
  npc_override_2@mir_RitualOfBlessing_msg_44c582: "...?"
  npc_override_2@mir_RitualOfBlessing_msg_61ce5a: "[{0}]"
  npc_override_2@mir_RitualOfBlessing_msg_79ef7f: "...."
  npc_override_2@mir_RitualOfBlessing_nerius_63f7b5: "Nerius"
  npc_override_2@mir_RitualOfBlessing_no_never_mind_ca009b: "....No, never mind."
  npc_override_2@mir_RitualOfBlessing_no_nothing_much_nothing_c54f87: "No, nothing much. Nothing worth doing here anyways."
  npc_override_2@mir_RitualOfBlessing_no_use_495140: "It is no use!"
  npc_override_2@mir_RitualOfBlessing_nothing_good_heard_if_we_18645e: "Nothing good can be heard if we keep them waiting for any longer. Let's get going."
  npc_override_2@mir_RitualOfBlessing_nyhill_you_should_come_u_cd42d4: "Nyhill, you should come with us!"
  npc_override_2@mir_RitualOfBlessing_oh_doesn_t_look_good_8d4a95: "Oh, this doesn't look good."
  npc_override_2@mir_RitualOfBlessing_oh_hello_you_must_famous_695dea: "Oh, hello! You must be the famous Archduke Grantz the Sage!"
  npc_override_2@mir_RitualOfBlessing_oh_my_5a3c24: "...Oh... My..."
  npc_override_2@mir_RitualOfBlessing_oh_you_didn_t_know_972236: "Oh, you didn't know?"
  npc_override_2@mir_RitualOfBlessing_other_people_get_out_the_627f9a: "Other people will get out on their own!"
  npc_override_2@mir_RitualOfBlessing_people_other_families_al_a0ea29: "The people from other families all have taken their seats."
  npc_override_2@mir_RitualOfBlessing_peter_been_wounded_41ca39: "Peter has been wounded."
  npc_override_2@mir_RitualOfBlessing_peter_critical_condition_c7525b: "Peter is in a critical condition."
  npc_override_2@mir_RitualOfBlessing_phew_let_s_get_out_c36eab: "Phew, let's get out of here."
  npc_override_2@mir_RitualOfBlessing_piece_ymir_s_heart_i_3edc63: "The piece of Ymir's Heart. I have heard that it is here, but I don't see any, do I?"
  npc_override_2@mir_RitualOfBlessing_please_allow_power_sourc_c0f2c2: "Please allow the power from the source granted for all beings,"
  npc_override_2@mir_RitualOfBlessing_please_take_care_others_c13d7f: "Please take care of the others."
  npc_override_2@mir_RitualOfBlessing_quiet_d827b5: "... Quiet."
  npc_override_2@mir_RitualOfBlessing_richard_5c7969: "Richard"
  npc_override_2@mir_RitualOfBlessing_roegenburg_96ee5a: "Roegenburg"
  npc_override_2@mir_RitualOfBlessing_room_consciousness_close_ef65df: "The Room of Consciousness will be closed for a while!"
  npc_override_2@mir_RitualOfBlessing_s_ki_a37525: "...S... ki... a..."
  npc_override_2@mir_RitualOfBlessing_since_hall_seems_been_cl_72d7a4: "Since the hall seems to have been cleared out, I am leaving now. What a hassle, this time!"
  npc_override_2@mir_RitualOfBlessing_sis_let_s_get_out_801840: "Sis, let's get out!"
  npc_override_2@mir_RitualOfBlessing_skia_why_did_guy_save_3cbe0f: "Skia, why did this guy save Lord Nyhill, not me?"
  npc_override_2@mir_RitualOfBlessing_strong_protect_everythin_b6fb61: "The strong will to protect everything in the arms,"
  npc_override_2@mir_RitualOfBlessing_terra_gloria_7fa120: "Terra Gloria?"
  npc_override_2@mir_RitualOfBlessing_terra_gloria_missing_f903ee: ".... ^4d4dffTerra Gloria^000000 is missing..."
  npc_override_2@mir_RitualOfBlessing_there_much_left_use_find_8e945e: "There is much left for use to find out."
  npc_override_2@mir_RitualOfBlessing_there_seat_left_next_lor_4de9ea: "^4d4dffThere is a seat left next to Lord Richard. It must be the seat reserved for an observer.^000000"
  npc_override_2@mir_RitualOfBlessing_there_seems_no_one_dead_6fb0b1: "...There seems to be no one dead."
  npc_override_2@mir_RitualOfBlessing_time_fake_ymir_s_heart_350f2d: "It is the time for this fake Ymir's Heart to go!"
  npc_override_2@mir_RitualOfBlessing_virtue_looking_up_others_cffecd: "The virtue of looking up to others with a humble mind,"
  npc_override_2@mir_RitualOfBlessing_walther_e9f3c7: "Walther"
  npc_override_2@mir_RitualOfBlessing_way_f0f918: "By the way........."
  npc_override_2@mir_RitualOfBlessing_we_don_t_time_chat_cf8d80: "We don't have the time to chat!"
  npc_override_2@mir_RitualOfBlessing_we_need_move_him_fast_5e800f: "We need to move him fast."
  npc_override_2@mir_RitualOfBlessing_we_shall_leave_place_fir_03ccae: "We shall leave this place first."
  npc_override_2@mir_RitualOfBlessing_we_should_watch_ritual_b_d97975: "We should watch the Ritual of Blessing."
  npc_override_2@mir_RitualOfBlessing_welcome_e52e5e: "Welcome!"
  npc_override_2@mir_RitualOfBlessing_well_first_things_first_c2fa9d: "...Well, first things first, There are things to find out."
  npc_override_2@mir_RitualOfBlessing_well_i_ll_get_going_95d7bf: "Well, I'll get going without casing a scene this time."
  npc_override_2@mir_RitualOfBlessing_well_i_see_if_you_e9f62f: "Well, I see. If you knew that you wouldn't have kept it in the ground, wasting your time on this ritual and all."
  npc_override_2@mir_RitualOfBlessing_well_let_s_go_5b10c6: "Well, let's go."
  npc_override_2@mir_RitualOfBlessing_what_earth_11972d: "What on earth...!"
  npc_override_2@mir_RitualOfBlessing_what_fake_5b40d7: "But what is this? It is fake!"
  npc_override_2@mir_RitualOfBlessing_what_going_541517: "What is going on..."
  npc_override_2@mir_RitualOfBlessing_what_hidden_here_known_a_95784c: "What is hidden here is not known to anyone... Except the seven royal families...!"
  npc_override_2@mir_RitualOfBlessing_what_you_doing_3d39a6: "What are you doing!!!"
  npc_override_2@mir_RitualOfBlessing_what_you_talking_about_b51e16: "...What are you talking about?"
  npc_override_2@mir_RitualOfBlessing_what_you_waiting_get_out_45d61b: "What are you waiting for! Get out of here with the wounded people!"
  npc_override_2@mir_RitualOfBlessing_what_you_want_326403: "...What do you want?"
  npc_override_2@mir_RitualOfBlessing_where_these_bastards_2f18b0: "...Where are these bastards from?"
  npc_override_2@mir_RitualOfBlessing_whoever_left_here_clear_25b538: "Whoever left here, clear out with the wounded near you!"
  npc_override_2@mir_RitualOfBlessing_wigner_79ae29: "Wigner"
  npc_override_2@mir_RitualOfBlessing_wisdom_look_truth_dd6616: "And the wisdom to look at the truth"
  npc_override_2@mir_RitualOfBlessing_you_here_230369: "You are here!"
  npc_override_2@mir_RitualOfBlessing_you_leave_through_door_y_bb7d08: "You can leave through the door you have entered."
  npc_override_2@mir_RitualOfBlessing_you_mind_fighting_agains_234352: "...Would you mind fighting against the intruder for us?"
  npc_override_2@mir_RitualOfBlessing_you_old_man_noble_people_b02f68: "You old man, and the noble people behind him..."
