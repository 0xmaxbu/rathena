  npc_override_que_ba_quests_morocc_satan_morocc_heinous_dem_35de7f: "被封印在梦罗克地下深处数百年之久的邪恶恶魔梦罗克魔王，已经复活并挣脱了束缚。"
  npc_override_que_ba_quests_morocc_satan_morocc_most_powerf_98d1ea: "梦罗克魔王是存在于凡间的最强大的邪恶存在。对你来说，夺走你的生命对它来说轻而易举。"
  npc_override_que_ba_quests_morocc_satan_morocc_nothing_lik_f4bf48: "梦罗克魔王和你遇到过的那些怪物不一样。你最多只会丢掉自己的性命，但你的失误和无能可能会害死我的士兵。我不能允许这种事发生！"
  npc_override_que_ba_quests_morocc_satan_morocc_s_power_bee_e49328: "梦罗克魔王的力量在我们的时空连续体中造成了异常的裂隙。目前这些裂隙还只局限于这个区域，但我们无法确定它们是否会扩散。"
