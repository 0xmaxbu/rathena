  npc_override_que_ba_quests_morocc_hahaha_nice_meet_you_i_f3f86b: "哈哈哈，很高兴见到你。我就是那本书的作者。我来看看我的新书《命运之鸦》卖得怎么样，能遇到我的粉丝真是莫大的荣幸！我感到很不好意思，但还是谢谢了！嘿嘿。"
