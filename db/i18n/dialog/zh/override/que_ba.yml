  npc_override_que_ba_quests_morocc_eva_we_won_t_die_1773b6: "^3131FF「伊娃」^000000，我们不会死的……因为我们从来就不是真正活着的。"
  npc_override_que_ba_quests_morocc_eva_what_you_doing_come_e3b94e: "「——伊娃，你在做什么？过来！快！」"
  npc_override_que_ba_quests_morocc_even_if_he_something_eva_a500fb: "即使他和伊娃有什么关联，现在为她做任何事都太迟了。"
  npc_override_que_ba_quests_morocc_even_my_best_friends_his_125c7a: "就连我最好的朋友都是他的傀儡……"
  npc_override_que_ba_quests_morocc_eventually_he_turned_his_43aed0: "最终他把头从乌鸦那边转开，放弃了驱赶它。然后狗也不再叫了。^000000"
