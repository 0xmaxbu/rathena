  npc_override_que_ba_quests_morocc_well_i_don_t_anything_53296e: "嗯，我也没有别的事可做了。也许我该读读那本书……^000000"
  npc_override_que_ba_quests_morocc_well_i_guess_jack_s_fea5a9: "好吧，我猜杰克没在干活。"
  npc_override_que_ba_quests_morocc_well_if_s_free_there_d9c13a: "^660000嗯，如果是免费的，而且留着也没坏处。^000000"
  npc_override_que_ba_quests_morocc_well_if_you_insist_givin_51b1ad: "好吧……如果你坚持要试试的话……那我至少需要 50 颗那样的冰冻之心。"
  npc_override_que_ba_quests_morocc_well_juno_quite_far_here_bdf5d4: "嗯，朱诺离这里相当远，但如果你真的那么热衷于阅读这样一本畅销书，那应该是值得的。"
  npc_override_que_ba_quests_morocc_well_looks_like_you_earn_780200: "好吧……看来这是你应得的。"
  npc_override_que_ba_quests_morocc_well_official_name_them_3d0a83: "嗯，它们的正式名称是 ^3355FF双筒望远镜^000000！这是一种类似双筒望远镜的光学装置，专为双眼同时使用而设计！"
  npc_override_que_ba_quests_morocc_well_s_okay_i_happened_7ce2da: "嗯，没关系。我碰巧在街上捡到的。你不用道歉。"
  npc_override_que_ba_quests_morocc_well_you_don_t_look_4f0d6a: "嗯，你看起来不像一个喜欢读书的人，但我希望你至少知道怎么从图书馆借书。"
  npc_override_que_ba_quests_morocc_wh_what_a5b632: "什……什么？！"
  npc_override_que_ba_quests_morocc_wh_who_you_c0a594: "你……你是谁？"
  npc_override_que_ba_quests_morocc_whack_eb7de7: "（啪）"
  npc_override_que_ba_quests_morocc_what_about_you_huh_ef735f: "那你呢，嗯？"
  npc_override_que_ba_quests_morocc_what_did_you_really_defe_6103f0: "什么？你真的击败了梦罗克魔王？"
  npc_override_que_ba_quests_morocc_what_don_t_you_know_0bb13c: "什么，你不知道怎么从图书馆借书？哦，天哪……"
  npc_override_que_ba_quests_morocc_what_don_t_you_know_cbe885: "什么？你不知道玛米吗？卢恩-米德加尔特三大偶像之一啊？"
  npc_override_que_ba_quests_morocc_what_he_anything_e401aa: "他到底有什么关系？"
  npc_override_que_ba_quests_morocc_what_how_you_even_think_244a00: "什么？你一点真本事都没有，怎么敢想加入我们？"
  npc_override_que_ba_quests_morocc_what_i_nothing_ask_you_9d0763: "什么事？我没有什么需要你做的。"
  npc_override_que_ba_quests_morocc_what_if_all_caused_crow_f47246: "如果这一切都是那根乌鸦羽毛引起的呢？如果……？"
  npc_override_que_ba_quests_morocc_what_if_they_any_descend_f370a4: "如果他们还有后代或继承者呢？"
  npc_override_que_ba_quests_morocc_what_kind_book_you_looki_d6b1f9: "你在找什么样的书？"
  npc_override_que_ba_quests_morocc_what_matters_i_m_cured_c5249f: "重要的是我已经好了！"
  npc_override_que_ba_quests_morocc_what_now_i_m_shocked_ecc0cf: "什么？现在轮到我震惊了！"
  npc_override_que_ba_quests_morocc_what_s_b0c0b7: "这是什么？"
  npc_override_que_ba_quests_morocc_what_s_happened_feather_5d340b: "这根羽毛怎么了？"
  npc_override_que_ba_quests_morocc_what_s_happening_here_ac096c: "这里发生了什么？"
  npc_override_que_ba_quests_morocc_what_s_matter_f992c2: "发生什么事了？"
  npc_override_que_ba_quests_morocc_what_s_scary_all_caused_291605: "可怕的是，这一切仅仅是因为它挣脱了束缚就造成了。想想看，如果让它自由游荡，会造成多大的破坏……"
  npc_override_que_ba_quests_morocc_what_s_up_meow_0df872: "怎么了，喵！"
  npc_override_que_ba_quests_morocc_what_s_your_name_465a41: "—— 你叫什么名字？——"
  npc_override_que_ba_quests_morocc_what_they_show_me_b94c86: "它们是什么？给我看看！？"
  npc_override_que_ba_quests_morocc_what_you_about_say_you_de324b: "……^660000这是你正要说的，但你无法拒绝他的提议。看着他眼中燃烧着对她的狂热爱意，即使是奥丁也无法拒绝……^000000"
  npc_override_que_ba_quests_morocc_what_you_e12378: "你是……什么？"
  npc_override_que_ba_quests_morocc_what_you_reading_9a9c3d: "你在读什么？"
  npc_override_que_ba_quests_morocc_what_you_say_you_want_c1ff8b: "你觉得怎么样？你想帮我，对吧？"
  npc_override_que_ba_quests_morocc_what_you_talking_about_fb4e69: "你在说什么？"
  npc_override_que_ba_quests_morocc_what_you_talking_about_m_929da0: "你在说什么，喵！"
  npc_override_que_ba_quests_morocc_what_you_wanna_drink_56b32d: "你想喝什么？"
  npc_override_que_ba_quests_morocc_what_you_want_8d4f6e: "^660000你想做什么？^000000"
  npc_override_que_ba_quests_morocc_what_you_want_9b4b57: "你想要什么？"
  npc_override_que_ba_quests_morocc_what_your_name_oh_yes_272dca: "你叫什么来着？{0}？哦对，我听说过你。"
  npc_override_que_ba_quests_morocc_whatever_you_say_8e713b: "随你怎么说。"
  npc_override_que_ba_quests_morocc_when_i_young_i_heard_ee2147: "我年轻时听说鸟类的羽毛会引来奥丁的仆从祝福主人，所以很多诗人把它们用作书签。"
  npc_override_que_ba_quests_morocc_when_you_get_those_items_16151f: "等你拿到那些材料后，来找我们，我们会给你做一个邮差路标。"
  npc_override_que_ba_quests_morocc_where_am_i_why_am_75641f: "—— 我在哪？我为什么在这里？——"
  npc_override_que_ba_quests_morocc_where_hell_am_i_278fa8: "……我到底在哪里？"
  npc_override_que_ba_quests_morocc_where_should_we_go_7a746a: "我们该去哪里？"
  npc_override_que_ba_quests_morocc_where_some_secret_busine_2e1cf3: "一些秘密交易进行的地方……"
  npc_override_que_ba_quests_morocc_which_been_leading_einbe_17638a: "这一直引领着艾音贝赫的矿业，"
  npc_override_que_ba_quests_morocc_which_i_really_think_adu_1b63c0: "这……我真的认为只适合成年人。"
  npc_override_que_ba_quests_morocc_which_proved_place_used_ecda33: "这证明了那个地方曾被用作实验室。"
  npc_override_que_ba_quests_morocc_while_trying_remember_wh_9cd477: "^660000当你试图回忆发生了什么事时，你遇到了一位从你身边经过的女人。你本能地伸手去碰她的肩膀想引起她的注意。^000000"
  npc_override_que_ba_quests_morocc_whisper_1bb6eb: "（低语）"
  npc_override_que_ba_quests_morocc_whizz_b7b576: "（嗖——）"
  npc_override_que_ba_quests_morocc_whizz_d2497f: "（嗖）"
  npc_override_que_ba_quests_morocc_who_blessed_mother_natur_5807ea: "他受到大自然的祝福。"
  npc_override_que_ba_quests_morocc_who_dares_interrupt_me_f_1c633f: "谁敢打扰我感受玛米？你想找茬吗……呃？"
  npc_override_que_ba_quests_morocc_who_hell_you_0c4a24: "你到底是谁！"
  npc_override_que_ba_quests_morocc_who_s_mammi_fea10c: "玛米是谁？"
  npc_override_que_ba_quests_morocc_who_ve_thought_actually_283f23: "谁能想到真的亲眼见到了撒旦……？"
  npc_override_que_ba_quests_morocc_whoa_you_re_e0833f: "哇，你不是"
  npc_override_que_ba_quests_morocc_why_don_t_you_go_acb6ea: "你为什么不进去休息一下？读读《命运之痕》什么的。"
  npc_override_que_ba_quests_morocc_why_don_t_you_keep_8be868: "你为什么不留一根羽毛呢？说不定能给你带来好运。"
  npc_override_que_ba_quests_morocc_without_anybody_anything_dc1d16: "里面没有任何人或任何东西"
  npc_override_que_ba_quests_morocc_wow_i_think_really_skin_92ff8f: "哇……我觉得这真的是梦罗克魔王的皮。恭喜你，士兵。你刚刚拯救了这个世界和人民，使他们免遭毁灭和邪恶的吞噬。"
  npc_override_que_ba_quests_morocc_wow_look_size_these_feat_36eebf: "哇，看看这些羽毛的大小。这么大的乌鸦需要大翅膀才能飞吧。"
  npc_override_que_ba_quests_morocc_wow_thanks_80dd11: "哇，谢了！"
  npc_override_que_ba_quests_morocc_wow_you_really_going_hel_509676: "哇，你真的要帮我吗？"
  npc_override_que_ba_quests_morocc_writer_writing_notebook_2b5318: "^660000那位作家正以极快的速度在笔记本上写着。^000000"
  npc_override_que_ba_quests_morocc_ye_yes_you_861fec: "……对……对，就是你！"
  npc_override_que_ba_quests_morocc_yes_i_ll_whatever_takes_4b60a2: "是的，只要能加入大陆卫队，我什么都愿意做！"
  npc_override_que_ba_quests_morocc_yes_i_ve_been_having_6bae54: "是的，我一直在做一些非常逼真的梦，感觉就像真的一样。"
  npc_override_que_ba_quests_morocc_yes_i_ve_confirmed_you_902b3c: "是的，我已确认你是大陆卫队的成员。祝你在完成任务时好运。"
  npc_override_que_ba_quests_morocc_yes_mr_hilpert_s_soul_f49e63: "是的，希尔伯特先生的灵魂被乌鸦诅咒了！"
  npc_override_que_ba_quests_morocc_yes_picture_book_mammi_i_5be146: "^660000是的，那是玛米的画册，就是梦罗克的本杰明坚称她是卢恩-米德加尔特王国三大偶像之一的那位。难怪奥利弗会高兴得尖叫起来。^000000"
  npc_override_que_ba_quests_morocc_yes_sir_016cb4: "—— 是，长官！"
  npc_override_que_ba_quests_morocc_yes_umm_ahchoo_where_i_0fd346: "是的，嗯……阿嚏！我在哪里可以找到旧的新闻……？阿嚏！"
  npc_override_que_ba_quests_morocc_yet_been_released_accord_2bc14c: "尚未发布，但据目击者称，"
  npc_override_que_ba_quests_morocc_you_3b10d0: "你是……{0}？"
  npc_override_que_ba_quests_morocc_you_about_leave_when_you_ac011c: "^660000你正要离开时，在地上发现了一张纸。^000000"
  npc_override_que_ba_quests_morocc_you_about_pull_out_book_7b6767: "^660000你正要一边抱怨一边把那本书抽出来时，突然感觉大脑像爆炸了一样。你昏了过去……^000000"
  npc_override_que_ba_quests_morocc_you_best_thanks_7a7261: "你最棒了！谢谢！"
  npc_override_que_ba_quests_morocc_you_better_retreat_dc83dd: "你最好撤退"
  npc_override_que_ba_quests_morocc_you_bound_your_fate_no_81a62b: "你被你的命运所束缚，无论你多么努力地想要逃避……"
  npc_override_que_ba_quests_morocc_you_carefully_approached_b92956: "^660000你小心翼翼地靠近他，然后拍了拍他的肩膀。^000000"
  npc_override_que_ba_quests_morocc_you_carefully_looked_thr_d70ba9: "^660000你仔细翻阅报纸，想看看能不能找到关于火灾事故的文章。^000000"
  npc_override_que_ba_quests_morocc_you_carefully_opened_boo_584ada: "^660000你小心翼翼地再次打开书，但什么也没发生。^000000"
  npc_override_que_ba_quests_morocc_you_carefully_turned_fir_4d258f: "^660000你小心翼翼地翻开第一页，担心自己会再做一场疯狂的梦。^000000"
  npc_override_que_ba_quests_morocc_you_checked_what_thing_y_affbc6: "^660000你检查了包里的东西，那是……^000000"
  npc_override_que_ba_quests_morocc_you_clenched_your_fists_c360fe: "你紧张地握紧拳头，然后开始走上漆黑的楼梯。^000000"
  npc_override_que_ba_quests_morocc_you_could_clearly_see_wh_a92fda: "^660000由于烟雾弥漫，你看不清房间里有什么，但你知道那里有东西。^000000"
  npc_override_que_ba_quests_morocc_you_could_look_if_you_43e8a9: "这个嘛，如果你想看的话可以看看。"
  npc_override_que_ba_quests_morocc_you_d_better_finish_quic_bbd719: "你最好快点完成，因为我们不喜欢外人在我们村里乱逛。"
  npc_override_que_ba_quests_morocc_you_d_better_pack_up_eb77af: "你最好收拾收拾，从哪来回哪去。你想在梦罗克魔王来袭时离这里远远的。"
  npc_override_que_ba_quests_morocc_you_d_better_wake_up_cb9ab0: "你最好从梦中醒来，继续你的生活。"
  npc_override_que_ba_quests_morocc_you_d_know_if_you_895967: "你读了就知道了。这是一份证明你是大陆卫队成员的文件。我承认我对你的技能和勇气印象深刻。"
  npc_override_que_ba_quests_morocc_you_damn_bird_fly_away_ea15bb: "你这该死的鸟！飞走吧，滚！"
  npc_override_que_ba_quests_morocc_you_decided_deliver_book_ce7713: "你决定把书送给梦罗克的本杰明。"
  npc_override_que_ba_quests_morocc_you_didn_t_bring_3e72a4: "你没有带来"
  npc_override_que_ba_quests_morocc_you_don_t_so_angry_03da12: "先生，你没必要对我这么生气。"
  npc_override_que_ba_quests_morocc_you_don_t_wanna_hurt_2e5361: "你不想伤害你老朋友的感情吧~"
  npc_override_que_ba_quests_morocc_you_feel_excitement_anti_79d552: "^660000你能感觉到内心的兴奋和期待在涌动。也许你正在接近了解你梦境真正含义的真相。^000000"
  npc_override_que_ba_quests_morocc_you_feel_like_s_too_cdb086: "你感觉再靠近就太危险了。"
  npc_override_que_ba_quests_morocc_you_feel_power_darkness_baff6e: "你能感觉到黑暗的力量从光与暗交织的裂隙中升腾而起。"
  npc_override_que_ba_quests_morocc_you_feel_your_heart_beat_4a4651: "你感觉到自己的心脏因兴奋而加速跳动。"
  npc_override_que_ba_quests_morocc_you_felt_as_if_you_f3fcc8: "—— 你感觉自己好像落下了一些重要的东西。——"
  npc_override_que_ba_quests_morocc_you_felt_somebody_starin_c52431: "^660000你感觉到有人正盯着你看书。你转过头，发现一个衣冠楚楚却又形迹可疑的年轻人。^000000"
  npc_override_que_ba_quests_morocc_you_felt_something_uncom_c5220e: "你对这个所谓的梦感到有些不安。你想弄明白自己在读书时所看到的一切意味着什么。"
  npc_override_que_ba_quests_morocc_you_felt_sorry_interrupt_af331e: "你为打断他写作而感到抱歉。"
  npc_override_que_ba_quests_morocc_you_find_any_more_inform_e0d052: "让你从新闻文章中找不到更多信息。"
  npc_override_que_ba_quests_morocc_you_find_book_left_books_b5d87a: "你可以在楼上的左边书架找到那本书。"
  npc_override_que_ba_quests_morocc_you_find_every_book_publ_0d8915: "你可以在图书馆找到修发兹出版的每一本书。很有可能在那里找到。"
  npc_override_que_ba_quests_morocc_you_fine_fine_339688: "你……还好吗？好吧，好吧。"
  npc_override_que_ba_quests_morocc_you_given_him_mammi_s_0e282b: "^660000你已把玛米的画册交给了他。^000000"
  npc_override_que_ba_quests_morocc_you_given_him_oliver_s_e73ab8: "^660000你已把奥利弗的小说《命运之鸦》交给了他，并向他解释了你身上发生的怪事。^000000"
  npc_override_que_ba_quests_morocc_you_guildmaster_d3519a: "你去找公会会长，为了"
  npc_override_que_ba_quests_morocc_you_heard_man_8120a8: "你听到那人的话。"
  npc_override_que_ba_quests_morocc_you_kidding_course_af772a: "你在开玩笑吗？！当然！"
  npc_override_que_ba_quests_morocc_you_kidding_me_if_you_d8b4b1: "你在开玩笑吗？如果你要找失踪的孩子，去朱诺警察局！"
  npc_override_que_ba_quests_morocc_you_know_a4e76b: "你知道吗……"
  npc_override_que_ba_quests_morocc_you_know_i_just_came_867d05: "你知道……我只是来喘口气的。这整个修复工作快把我累死了。"
  npc_override_que_ba_quests_morocc_you_know_i_just_wrote_a5e546: "你知道，我只是把梦里看到的东西写下来；我没想到人们会这么喜欢我的故事！这让我很惊讶。"
  npc_override_que_ba_quests_morocc_you_know_i_kinda_4646ac: "你知道，我有点……"
  npc_override_que_ba_quests_morocc_you_know_if_dream_realit_0627eb: "但你不知道这是梦还是现实。^000000"
  npc_override_que_ba_quests_morocc_you_know_man_name_oliver_2fc930: "你认识一个叫奥利弗·希尔伯特的人吗？"
  npc_override_que_ba_quests_morocc_you_know_morocc_ahchoo_t_2d343d: "你知道，在梦罗克……阿嚏！……有一个和你一样是玛米狂热粉丝的人……阿嚏！所以你为什么不去见见他呢？"
  npc_override_que_ba_quests_morocc_you_know_old_saying_you_f6aa55: "你知道那句老话，「在图书馆工作三年，就能背下埃达。」"
  npc_override_que_ba_quests_morocc_you_know_place_prohibite_445d2d: "你知道这个地方是禁止进入的，喵。"
  npc_override_que_ba_quests_morocc_you_know_why_you_re_2e24b1: "—— 你知道你为什么会在街上吗？你住在哪里？你父母一定很想见你。——"
  npc_override_que_ba_quests_morocc_you_look_bored_you_must_a3c438: "你看起来很无聊。你一定在等有人给你找点事做！"
  npc_override_que_ba_quests_morocc_you_look_little_pale_61e021: "你看起来脸色有点苍白。"
  npc_override_que_ba_quests_morocc_you_look_pretty_passiona_fb7772: "看来你终究还是挺有热情的。"
  npc_override_que_ba_quests_morocc_you_looked_angrily_him_f_dcf815: "^660000你愤怒地看着他，发现他变成了一个完全不同的人；他不再看起来愚蠢或严肃，而是极其冷酷。^000000"
  npc_override_que_ba_quests_morocc_you_looked_down_ground_t_8306c7: "^660000你低头看向地面，然后发现了几根乌鸦被石子击中时掉落的羽毛。^000000"
  npc_override_que_ba_quests_morocc_you_looked_up_found_huge_187237: "^660000你抬头一看，发现一只巨大的乌鸦坐在图书馆的屋顶上，仿佛这里是它的地盘。^000000"
  npc_override_que_ba_quests_morocc_you_looking_down_me_beca_64f597: "你因为我是守门人就瞧不起我吗？！"
  npc_override_que_ba_quests_morocc_you_looking_man_who_appe_bae99f: "^660000你正看着一个外表如怪物般丑陋的男人。"
  npc_override_que_ba_quests_morocc_you_looking_their_backs_2b6f34: "^660000你看着他们离开的背影，然后注意到你手里还拿着刚才在读的那本书。然后……^000000"
  npc_override_que_ba_quests_morocc_you_must_having_hard_tim_3e3fb5: "你一定记不住书名或者作者了吧。"
  npc_override_que_ba_quests_morocc_you_now_convinced_just_y_35cc3d: "你现在确信这不仅仅是你的梦或幻觉。你看到了过去真实发生的事。"
  npc_override_que_ba_quests_morocc_you_now_enter_master_zon_f1da25: "你将进入区域 1 主区域。"
  npc_override_que_ba_quests_morocc_you_picked_up_one_big_b26aed: "^660000你从地上捡起一根很大的黑色羽毛。"
  npc_override_que_ba_quests_morocc_you_put_your_guard_down_8e0a86: "^660000你放下戒备，盯着他看。"
  npc_override_que_ba_quests_morocc_you_question_75bb09: "你一个问题？"
  npc_override_que_ba_quests_morocc_you_quickly_checked_date_6798d8: "你迅速查了一下新闻的日期。那是太久以前的事了"
  npc_override_que_ba_quests_morocc_you_quickly_turned_your_6c78fb: "^660000你迅速转头顺着他的目光看去。那里只有你的包。^000000"
  npc_override_que_ba_quests_morocc_you_re_having_trouble_th_77a70c: "^660000由于胸口的疼痛和火焰，你很难思考，但你知道这座宅邸撑不了多久了。你环顾四周寻找出口，看到楼下火焰中央站着一个男人。^000000"
  npc_override_que_ba_quests_morocc_you_re_looking_way_too_c745ca: "…………你现在看起来太可疑了。"
  npc_override_que_ba_quests_morocc_you_really_want_morocc_c_a902ea: "你真的想要梦罗克护身石吗？"
  npc_override_que_ba_quests_morocc_you_really_want_morocc_r_455d8a: "你真的想要梦罗克戒指吗？"
  npc_override_que_ba_quests_morocc_you_really_want_seal_con_7e50d9: "你真的想要大陆卫队之印吗？"
  npc_override_que_ba_quests_morocc_you_remember_what_morocc_766c41: "你还记得这一切发生之前的梦罗克是什么样的吗？如果你以前来过这里，你应该记得。"
  npc_override_que_ba_quests_morocc_you_reset_moc_fild_1ed9c2: "你可以在 moc_fild21 5 5 处重置。"
  npc_override_que_ba_quests_morocc_you_rummaged_your_pocket_5e92c0: "^660000你在口袋里翻找那张便条，碰巧掉落了在图书馆外捡到的那根乌鸦羽毛。然后突然……^000000"
  npc_override_que_ba_quests_morocc_you_scrambled_stand_you_66d3ff: "^660000你慌忙站起来，然后循着尖叫声来到一栋破旧废弃的大楼。^000000"
  npc_override_que_ba_quests_morocc_you_see_every_book_rune_1dc4a3: "你知道吗，卢恩-米德加尔特图书馆的每本书上都有本杰明的名字……就是我！"
  npc_override_que_ba_quests_morocc_you_see_fragments_floati_f98907: "你可以看到碎片在裂隙中漂浮，辐射的光芒正在减慢它们的运动。"
  npc_override_que_ba_quests_morocc_you_should_go_rest_now_39d44b: "你现在该去休息了。别担心，这里的其他事情我们会处理好的。"
  npc_override_que_ba_quests_morocc_you_should_take_good_car_12e2a2: "你应该好好照顾自己，特别是如果你是个冒险者的话。"
  npc_override_que_ba_quests_morocc_you_shown_him_autograph_b5ce8e: "^660000你已经给他看了奥利弗·希尔伯特的签名和便条。^000000"
  npc_override_que_ba_quests_morocc_you_specific_book_mind_7b2b99: "你有特定的书要找吗？"
  npc_override_que_ba_quests_morocc_you_squinted_your_eyes_l_daa1d0: "^660000你眯起眼睛，仔细听。你能听到人声，但说话者的轮廓却不像人形。^000000"
  npc_override_que_ba_quests_morocc_you_started_feeling_cold_95e964: "^660000你开始感到寒冷并颤抖起来。^000000"
  npc_override_que_ba_quests_morocc_you_still_business_zid_63f810: "你还有事要找齐德吗？"
  npc_override_que_ba_quests_morocc_you_still_inside_library_1c2f38: "^660000你还在图书馆里，"
  npc_override_que_ba_quests_morocc_you_still_legs_5207a1: "你还有腿……"
  npc_override_que_ba_quests_morocc_you_stretch_your_hand_pi_cbdb66: "你伸出手，捡起一块暗淡的碎片。"
  npc_override_que_ba_quests_morocc_you_suddenly_feel_sharp_40db22: "^660000你突然感到胸口一阵剧痛，仿佛有人捏住了你的心脏。^000000"
  npc_override_que_ba_quests_morocc_you_talking_about_4a03d5: "你在说什么？"
  npc_override_que_ba_quests_morocc_you_talking_yourself_f5f9d7: "你在自言自语吗？"
  npc_override_que_ba_quests_morocc_you_think_i_m_stupid_0fbc3d: "你觉得我蠢到会告诉你"
  npc_override_que_ba_quests_morocc_you_too_many_items_your_b83599: "—— 你的背包里道具太多，无法继续此任务。——"
  npc_override_que_ba_quests_morocc_you_tried_think_hard_cou_871e07: "你努力思考，但仍无法弄清这个梦的含义。^000000"
  npc_override_que_ba_quests_morocc_you_turned_around_found_fcdff7: "你转过身，发现一个女人站在那里。^000000"
  npc_override_que_ba_quests_morocc_you_turned_your_head_tow_f5dc49: "^660000你转头看向书架，发现了那个有空缺的书架。^000000"
  npc_override_que_ba_quests_morocc_you_understand_right_ple_91ba12: "……你明白吧？请回到现场，组成至少 2 人的队伍后再来。谢谢。"
  npc_override_que_ba_quests_morocc_you_ve_come_here_bad_950515: "你来的不是时候，不过很高兴认识你。我是大陆卫队长官巴罗格。我们被派往梦罗克镇压梦罗克魔王……我们需要能聚集的所有力量和运气。"
  npc_override_que_ba_quests_morocc_you_ve_got_kicked_out_bf14d3: "—— 你被赶出了那个地方。——"
  npc_override_que_ba_quests_morocc_you_wake_up_look_around_91c276: "^660000你醒来，环顾四周。不知怎的，你现在在一栋巨大的宅邸里。^000000"
  npc_override_que_ba_quests_morocc_you_walked_through_flame_d9e354: "^660000你穿过火焰吞噬的走廊，来到一个即将坍塌的房间，就像这个地方的其他地方一样。^000000"
  npc_override_que_ba_quests_morocc_you_want_ask_me_147be6: "你想问我吗？"
  npc_override_que_ba_quests_morocc_you_want_f34aa5: "你想要……这个？"
  npc_override_que_ba_quests_morocc_you_want_tropical_sograt_cc1ad4: "你想要一杯「热带索格瑞特」还是"
  npc_override_que_ba_quests_morocc_you_wave_your_hand_close_9ec331: "^660000你在他面前挥挥手想引起他的注意。然而他似乎沉浸在自己的梦境中，完全无视你的存在。^000000"
  npc_override_que_ba_quests_morocc_you_weaklings_t_even_scr_122034: "你们这些弱者连抓伤我都做不到！"
  npc_override_que_ba_quests_morocc_you_won_e_even_able_5fdda3: "反正你也进不了那个房间的，喵~。"
  npc_override_que_ba_quests_morocc_you_won_t_able_help_53df1b: "如果你不完全了解其中的风险，你就无法帮助我们。我见过成千上万的鲁莽冒险者白白送死，他们以为自己能凭一己之力击败梦罗克魔王。"
  npc_override_que_ba_quests_morocc_you_wonder_what_he_meant_60561a: "你想知道他所说的「感受她」是什么意思，而他却只是看着和抚摸一本书。^000000"
  npc_override_que_ba_quests_morocc_you_zeny_alright_adacd1: "你有足够的 Zeny，对吧？"
  npc_override_que_ba_quests_morocc_young_man_approached_sho_470685: "^660000那个年轻人走上前来，咧嘴笑着和你握手。^000000"
  npc_override_que_ba_quests_morocc_your_application_already_5861bf: "你的申请已经注册了。请去见巴罗格长官。"
  npc_override_que_ba_quests_morocc_your_eyes_so_tempting_i_3eb1ac: "你的眼睛真诱人……我想吃掉它们！嘿嘿！"
  npc_override_que_ba_quests_morocc_your_healthy_golden_skin_e6182d: "你健康的金色皮肤在梦罗克祝福的阳光下闪闪发光。"
  npc_override_que_ba_quests_morocc_your_lungs_seem_much_wea_e8dd58: "而你的肺似乎因为最近频繁的咳嗽和打喷嚏而变得虚弱了许多。^000000"
  npc_override_que_ba_quests_morocc_your_smile_outshines_aur_4fc4ac: "你的笑容比瓦尔哈拉诸神的光辉还要耀眼。你是一本活的福音。你的笑容甚至让女神芙蕾雅羞愧地躲进阴影里！啊……玛米，我的玛米！"
  npc_override_que_ba_quests_morocc_zeny_dcc15a: "还有 ^3355FF50000 Zeny^000000！"
  npc_override_que_ba_quests_morocc_zeny_drink_64216f: "这杯酒要 800 Zeny，但"
  npc_override_que_ba_quests_morocc_zeny_drink_d7deb0: "这杯酒的钱。"
  npc_override_que_ba_quests_morocc_zeny_if_you_want_60fd35: "收 1,000 Zeny，如果你想"
  npc_override_que_ba_quests_morocc_zeny_you_i_m_4149fe: "800 Zeny，但对你，我"
  npc_override_que_ba_quests_morocc_zid_seemed_lost_his_inte_f2b773: "齐德似乎对这本书失去了兴趣。"
  npc_override_que_ba_quests_morocc_zid_stopped_talking_then_e7eb47: "^660000齐德停止了说话，然后低下了头。停顿之后，他再次开口。^000000"
  npc_override_que_ba_quests_morocc_zid_turned_his_head_away_6241d7: "^660000齐德把头转了过去。你仍然不确定这一切是否真的在发生。一切都太超现实了……^000000"
