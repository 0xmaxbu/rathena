  npc_override_que_ba_quests_morocc_he_expressed_his_desire_6752fb: "他向继母伊娃表达了想了解外部世界更多知识的愿望，但她总是用严厉的眼神无视他的愿望。"
  npc_override_que_ba_quests_morocc_he_inhaled_deeply_then_s_38538d: "^660000他深吸一口气，然后突然转头看向你。^000000"
  npc_override_que_ba_quests_morocc_he_killed_himself_despai_4f44a6: "他……在伊娃变成像我一样的怪物后绝望地自杀了……她想让他把她当作实验对象。"
  npc_override_que_ba_quests_morocc_he_little_boy_outside_wi_10c189: "他曾经是个外面来的小男孩，但比任何成年的贤者都要睿智。他能流利地说多种语言，听起来就像奥丁吟诵的埃达。"
  npc_override_que_ba_quests_morocc_he_man_eva_you_saw_8309ac: "他就是你梦中看到的和伊娃在一起的那个男人。当然，他现在老了，年龄已经显现在他的脸上和皮肤上。^000000"
