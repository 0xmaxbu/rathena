  npc_override_que_ba_quests_morocc_eva_couldn_t_forget_him_737e16: "伊娃无法忘记他。她在这个黑暗的洞穴里等待他的归来。有一段时间，他没有写地址地寄信来，但后来信就断了。就在那时，伊娃消失了。"
