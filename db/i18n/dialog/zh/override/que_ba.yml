Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_que_ba_quests_morocc_about_his_fiancee_sake_h_2670a1: "关于他的未婚妻，是为了她的安全着想。"
  npc_override_que_ba_quests_morocc_accessory_980944: "饰品！"
  npc_override_que_ba_quests_morocc_according_employee_reken_d570de: "据雷根贝勒公司的一名员工称，"
  npc_override_que_ba_quests_morocc_according_juno_soldier_a_6c2e6b: "据逮捕他们的朱诺士兵所说，"
  npc_override_que_ba_quests_morocc_adventurer_you_must_enth_749e5b: "冒险者，你一定也是她的狂热粉丝。你是在哪里找到这本稀有的画册的？"
  npc_override_que_ba_quests_morocc_after_all_god_trifled_me_1aa84f: "毕竟，上天戏弄了我……"
  npc_override_que_ba_quests_morocc_after_hours_later_since_8b8317: "死亡时间过后 6 小时将会重置。"
  npc_override_que_ba_quests_morocc_again_later_meow_4878db: "下次再来，喵？"
  npc_override_que_ba_quests_morocc_ah_ahchoo_726c52: "啊……阿嚏！"
  npc_override_que_ba_quests_morocc_ah_ahchoo_mr_hilpert_you_0decb7: "啊……阿嚏！希尔伯特先生，你对我的包感兴趣吗？这只是我从初学者训练场得到的一个普通包……"
  npc_override_que_ba_quests_morocc_ah_i_remember_one_s_dbeecb: "啊，我记得那个……这是最常被落在手推车里的那一款。"
  npc_override_que_ba_quests_morocc_ah_i_see_df4b54: "啊，原来如此。"
  npc_override_que_ba_quests_morocc_ah_i_think_you_re_c36b8e: "啊……我觉得你来得太晚了。"
  npc_override_que_ba_quests_morocc_ah_i_ve_got_idea_ce0145: "啊，我有个主意。由于这是一次联合作战，我们已经从修发兹共和国接受了一些雇佣兵加入大陆卫队。"
  npc_override_que_ba_quests_morocc_ah_look_picture_her_wear_692f8a: "啊……看这张她戴着卷卷小狗耳朵的照片！她看起来难道不像一只在恋人之城克魔岛独自流浪的悲伤小狗吗？！"
  npc_override_que_ba_quests_morocc_ah_luckily_there_s_one_0fe8ff: "啊，幸好有一本……阿嚏！"
  npc_override_que_ba_quests_morocc_ah_mammi_e34959: "啊……玛米……"
  npc_override_que_ba_quests_morocc_ah_one_best_sellers_josh_242b6b: "啊！这是约书亚·范塞的畅销书之一。"
  npc_override_que_ba_quests_morocc_ah_place_protected_5bae07: "啊，那个地方有防护"
  npc_override_que_ba_quests_morocc_ah_very_well_i_extremely_5bc41f: "啊，很好。我有一个极其重要的消息要告诉你。"
  npc_override_que_ba_quests_morocc_ah_why_i_m_love_9397f4: "啊……这就是我深爱玛米小姐的原因。"
  npc_override_que_ba_quests_morocc_ah_you_re_adventurer_wor_b831c4: "啊，你是在为大陆卫队工作的冒险者吧。很高兴见到你。如果需要帮助，随时可以找我。"
  npc_override_que_ba_quests_morocc_ahchoo_ahchoo_gosh_ad1f21: "阿嚏！阿嚏！天哪……"
  npc_override_que_ba_quests_morocc_ahchoo_fef93b: "……阿嚏！"
  npc_override_que_ba_quests_morocc_ahchoo_thanks_you_i_coul_a4e406: "阿嚏！多亏了你，我在图书馆里没找到。所以我一路旅行到修发兹……阿嚏！"
  npc_override_que_ba_quests_morocc_ahchoo_you_also_mammi_fa_3de605: "阿嚏！你也是玛米的粉丝吗？"
  npc_override_que_ba_quests_morocc_ain_t_0070c0: "那不是"
  npc_override_que_ba_quests_morocc_al_8e04c9: "——……阿尔。——"
  npc_override_que_ba_quests_morocc_all_b2ff06: "一点也不。"
  npc_override_que_ba_quests_morocc_all_because_dude_called_b78ea6: "这一切都是因为那个叫雷扬·摩尔或者莫尔……或者……的家伙吗？"
  npc_override_que_ba_quests_morocc_all_death_suffering_anyw_06f5c1: "所有的死亡与苦难……与梦罗克及其周边正在发生的事相比，任何其他地方都像是天堂。"
  npc_override_que_ba_quests_morocc_all_i_m_asking_check_b9d9a8: "我只是想让你去普隆德拉图书馆借一本书而已。听起来很简单，不是吗？"
  npc_override_que_ba_quests_morocc_all_requests_cancelled_t_f5eb84: "所有请求都已取消，没有任务可做了。"
  npc_override_que_ba_quests_morocc_all_these_books_piled_up_59aa5a: "这么多书堆在手推车里，让我感到很沮丧，你知道吗？唉……"
  npc_override_que_ba_quests_morocc_allowed_here_2f0286: "被允许进入此地。"
  npc_override_que_ba_quests_morocc_almost_done_then_you_bro_d503a9: "本来都快完成了，然后你把它们全砸了——连 ^FF00FF哔哔^000000 和 ^FF00FF哔哔^000000 都砸了——然后躲在这里。"
  npc_override_que_ba_quests_morocc_already_lucky_here_e96ca0: "能在这里已经很幸运了。"
  npc_override_que_ba_quests_morocc_alright_17187c: "好的。"
  npc_override_que_ba_quests_morocc_alright_how_about_8c0cb9: "好吧，这样如何？"
  npc_override_que_ba_quests_morocc_alright_let_me_see_7feaab: "好吧，让我看看……"
  npc_override_que_ba_quests_morocc_alright_you_come_b11b68: "好吧，你可以进来"
  npc_override_que_ba_quests_morocc_also_bestseller_2bf95b: "那也是一本畅销书。"
  npc_override_que_ba_quests_morocc_also_female_assistant_tu_2264ed: "还有，那个女助手变成了一只乌鸦飞走了，然后那根乌鸦羽毛让我打喷嚏又咳嗽。"
  npc_override_que_ba_quests_morocc_also_informed_us_they_639610: "并且还告知我们，他们是"
  npc_override_que_ba_quests_morocc_although_you_bit_intimid_4cc376: "^660000虽然你对这个守卫有些畏惧，而且你的喷嚏显然也没帮上忙，但你还是继续前行。^000000"
  npc_override_que_ba_quests_morocc_although_you_re_bit_inti_cede9c: "^660000虽然你被这个守卫吓到了一点，而你的喷嚏也显然于事无补，但你还是继续了。^000000"
  npc_override_que_ba_quests_morocc_ancient_weapon_some_kind_dc46d3: "^3131FF古代兵器 = 某种动力源^000000"
  npc_override_que_ba_quests_morocc_anyway_thank_you_coming_4e0f6d: "总之，感谢你光临「麦克米兰工坊」。不过下次记得买点东西，好吗？"
  npc_override_que_ba_quests_morocc_anyways_thank_you_bringi_b2a182: "总之，谢谢你带来活体煤炭。看来你比我想象的要强。"
  npc_override_que_ba_quests_morocc_area_meow_if_you_don_486607: "区域，喵！如果你不"
  npc_override_que_ba_quests_morocc_argggghhhhhhh_412544: "啊啊啊啊啊啊！！"
  npc_override_que_ba_quests_morocc_argh_43ffb4: "啊！"
  npc_override_que_ba_quests_morocc_argh_658e94: "啊……"
  npc_override_que_ba_quests_morocc_argh_all_because_library_8cb15e: "啊，那都是因为图书馆馆长！"
  npc_override_que_ba_quests_morocc_argh_i_t_breathe_i_33e38a: "啊……我喘不过气了……我得出去……"
  npc_override_que_ba_quests_morocc_as_i_told_you_earlier_56b3ee: "正如我之前跟你说的，这是我愿意跨越大陆去得到的东西。拜托了？"
  npc_override_que_ba_quests_morocc_as_soon_as_he_finished_586464: "^660000他一说完，就又沉浸在对玛米的幻想中来逃避现实。^000000"
  npc_override_que_ba_quests_morocc_as_soon_as_he_talked_560622: "^660000他一跟你搭上话，就又回去写作了，完全沉浸在工作中。^000000"
  npc_override_que_ba_quests_morocc_as_soon_as_news_spread_89ea94: "消息一传开，"
  npc_override_que_ba_quests_morocc_as_soon_as_you_heard_0428e5: "^660000你一听到她的声音，"
  npc_override_que_ba_quests_morocc_as_you_left_library_you_0aeedb: "^660000当你离开图书馆时，你觉得把奥利弗先生当成半个同路人也许更好。^000000"
  npc_override_que_ba_quests_morocc_as_you_see_situation_t_970e4f: "如你所见，情况不能再糟了。村庄和周边地区因梦罗克魔王复活而遭受了不可挽回的破坏。"
  npc_override_que_ba_quests_morocc_ask_you_enjoy_106a9e: "收你 800 Zeny。好好享用吧，"
  npc_override_que_ba_quests_morocc_assassins_i_charge_f7cb9c: "对刺客，我收费"
  npc_override_que_ba_quests_morocc_assassins_must_live_alon_3a0308: "「刺客必须独居于阴影之中。」"
  npc_override_que_ba_quests_morocc_awed_time_space_gap_wher_6c0079: "对赋予黑暗以生命的时空裂隙感到敬畏，你本能地向后退了一步。"
  npc_override_que_ba_quests_morocc_baaaadddd_279da8: "糟——糕——了！！"
  npc_override_que_ba_quests_morocc_bar_another_living_soul_b49f65: "酒吧告诉另一个活人。"
  npc_override_que_ba_quests_morocc_because_only_book_leanin_58da13: "因为那是唯一一本靠在一个空书架墙上的书。^000000"
  npc_override_que_ba_quests_morocc_been_already_passed_minu_ba0cee: "梦罗克死亡已经超过 30 分钟了，所以即使战士们点击时空裂隙也无法继续任务。"
  npc_override_que_ba_quests_morocc_been_especially_made_e4437e: "是专门制作的"
  npc_override_que_ba_quests_morocc_beep_e42d9b: "^FF0000—— 哔哔 ——^000000"
  npc_override_que_ba_quests_morocc_behalf_continental_guard_742df1: "我代表大陆卫队感谢你的努力。现在让我看看有没有来自总部的消息需要你知道……"
  npc_override_que_ba_quests_morocc_believe_what_i_just_said_15b51f: "相信我刚才说的话吗？"
  npc_override_que_ba_quests_morocc_benjamin_seems_huge_fan_f982e2: "^660000这个叫本杰明的人似乎是一位名叫玛米的女明星的狂热粉丝。他滔滔不绝地赞美她的美貌好一阵子，然后突然停下来，显得很沮丧。^000000"
  npc_override_que_ba_quests_morocc_besides_first_things_fir_b0054c: "而且，首先要做的是城里的修复工作，这是最紧迫的。"
  npc_override_que_ba_quests_morocc_binoculars_803d8e: "双筒望远镜！"
  npc_override_que_ba_quests_morocc_blame_hot_weather_people_0c075d: "要怪就怪这天气太热了，各位！"
  npc_override_que_ba_quests_morocc_book_become_so_popular_y_6d7ec2: "这本书太受欢迎了，连作者所在的国家修发兹都找不到了。"
  npc_override_que_ba_quests_morocc_book_interesting_i_m_sur_85cb94: "这本书很有意思，但我敢肯定那个叫奥利弗的家伙也经历过和你一样的事。"
  npc_override_que_ba_quests_morocc_book_isn_t_you_you_13c79d: "^660000这本书不是给你的，但你信奉 100% 客户满意度。现在就去朱诺图书馆吧。^000000"
  npc_override_que_ba_quests_morocc_book_s_cover_seriously_d_3447fe: "^660000考虑到这本书最近才出版，它的封面严重受损。一定有很多人翻过它。^000000"
  npc_override_que_ba_quests_morocc_book_soon_selected_as_es_975ac8: "这本书很快将被选为"
  npc_override_que_ba_quests_morocc_books_tagged_as_bestsell_e51575: "^660000标有「本月畅销书」的书籍放在与视线齐平的书架中央。^000000"
  npc_override_que_ba_quests_morocc_books_telling_exact_scen_c2261c: "^660000这本书描述的正是你梦中见过的场景。^000000"
  npc_override_que_ba_quests_morocc_bowwow_fb7b67: "汪汪！"
  npc_override_que_ba_quests_morocc_boy_ran_away_when_he_07064f: "那男孩大约 10 岁时跑掉了。我猜他是到了青春期……你知道那个年纪的男孩女孩。"
  npc_override_que_ba_quests_morocc_boys_show_guy_door_684bbf: "小子们，让这家伙滚出去！！"
  npc_override_que_ba_quests_morocc_breathe_word_about_172de0: "泄露半个字"
  npc_override_que_ba_quests_morocc_built_test_duplicate_god_581768: "它是为了测试和复制神的创造之力而建造的。"
  npc_override_que_ba_quests_morocc_buy_water_here_oh_boy_b5e47a: "在这里买水。哎呀……"
  npc_override_que_ba_quests_morocc_care_drink_cd3409: "要来一杯吗？"
  npc_override_que_ba_quests_morocc_careful_catch_cold_eb305d: "小心别着凉！"
  npc_override_que_ba_quests_morocc_careless_behavior_seems_e5c74f: "粗心的行为，似乎"
  npc_override_que_ba_quests_morocc_cause_accident_04d6b3: "事故的原因。"
  npc_override_que_ba_quests_morocc_clear_out_your_inventory_bc5468: "清空你的背包！"
  npc_override_que_ba_quests_morocc_cold_up_there_i_guess_852a72: "上面冷吗？我猜是的，因为修发兹位于这里的北方。"
  npc_override_que_ba_quests_morocc_come_what_38fb2b: "别这样，到底是"
  npc_override_que_ba_quests_morocc_contaminating_nature_so_d6c030: "污染自然的东西，这样她才能净化水源。"
  npc_override_que_ba_quests_morocc_continental_guard_been_f_642aab: "大陆卫队在这个村庄和沙漠周边已进入全面戒备状态。我们必须做好准备，以防梦罗克魔王突破我们的防线。"
  npc_override_que_ba_quests_morocc_continental_guard_curren_a44291: "大陆卫队目前正根据王国的命令，策划一系列压制梦罗克魔王的应对措施。"
  npc_override_que_ba_quests_morocc_continental_guard_headqu_53b3b0: "大陆卫队总部位于梦罗克中心宫殿附近，请尽快去见长官。"
  npc_override_que_ba_quests_morocc_continental_guards_769a5d: "^3131FF<大陆卫队>^000000"
  npc_override_que_ba_quests_morocc_cough_cough_908a66: "咳咳！"
  npc_override_que_ba_quests_morocc_cough_fire_cough_f3b0da: "咳！着火了……咳！"
  npc_override_que_ba_quests_morocc_cough_i_m_looking_book_0cabc3: "咳……我在找一本叫《命运之鸦》的书，作者是奥利弗·希尔伯特。"
  npc_override_que_ba_quests_morocc_cough_no_i_m_fa_0b471c: "咳，不，我不是粉……"
  npc_override_que_ba_quests_morocc_could_you_please_leave_m_362e78: "能让我一个人待会儿吗？我头痛得厉害。"
  npc_override_que_ba_quests_morocc_countless_number_books_f_e1968b: "^660000填满这个房间的无数本书告诉你，为什么这里被称为学者之城朱诺的最伟大的图书馆。^000000"
  npc_override_que_ba_quests_morocc_course_just_dream_still_1cc74f: "^660000当然，那只是个梦，但依然是非常神秘的体验。^000000"
  npc_override_que_ba_quests_morocc_course_ll_incredibly_dif_17d5c3: "当然，那会极其艰难……我们需要做出牺牲……我甚至不确定我们是否能赢。尽管如此，世界的命运危在旦夕，我们必须有所作为。黑暗的时代确实已经降临在我们身上……"
  npc_override_que_ba_quests_morocc_crow_fate_498053: "^660000《命运之鸦》^000000？"
  npc_override_que_ba_quests_morocc_crow_fate_c95fbd: "《命运之鸦》^000000！"
  npc_override_que_ba_quests_morocc_crow_fate_sold_out_even_9a99e6: "^3131FF《命运之鸦》^000000 在拿到手之前就售罄了。你在卢恩-米德加尔特王国任何地方都找不到这本书。"
  npc_override_que_ba_quests_morocc_crumbling_12218a: "—— 崩塌中 ——"
  npc_override_que_ba_quests_morocc_culture_page_37cc58: "—— 文化版 ——"
  npc_override_que_ba_quests_morocc_current_state_ea4b11: "当前状况"
  npc_override_que_ba_quests_morocc_damage_satan_morocc_s_re_a593bc: "梦罗克魔王复活所造成的破坏，只需环顾四周便可一目了然。"
  npc_override_que_ba_quests_morocc_day_tao_really_wanted_bi_19fc96: "那天，陶真的很想要一个大蝴蝶结，喵。"
  npc_override_que_ba_quests_morocc_deeply_as_you_life_419ea9: "如同爱惜生命一般。"
  npc_override_que_ba_quests_morocc_deja_vu_am_i_having_2c8c6d: "既视感？我是在经历既视感吗？"
  npc_override_que_ba_quests_morocc_demanding_you_must_encas_0712e3: "要求你必须把书包起来以免损坏。^000000"
  npc_override_que_ba_quests_morocc_desert_around_morocc_als_9f8e06: "梦罗克周围的沙漠在被梦罗克魔王及其强大的分身和手下占领后，也变成了一片死亡之地。"
  npc_override_que_ba_quests_morocc_did_you_change_your_mind_93bd4a: "你改变主意，愿意把玛米小姐的画册卖给我了吗？"
  npc_override_que_ba_quests_morocc_did_you_just_say_eva_e506bb: "你刚才说了伊娃？"
  npc_override_que_ba_quests_morocc_did_you_notice_our_villa_2ef5a4: "你有没有注意到我们村民看起来不太一样？"
  npc_override_que_ba_quests_morocc_didn_t_you_just_call_71a37a: "^660000你不是刚刚叫我是替别人跑腿的冒险者吗……？^000000"
  npc_override_que_ba_quests_morocc_didn_t_you_know_satan_d5b010: "你不知道吗？梦罗克魔王已经复活，从他被封印的梦罗克村庄逃出来了。"
  npc_override_que_ba_quests_morocc_die_haha_e50ba0: "死？……哈哈。"
  npc_override_que_ba_quests_morocc_difficult_find_crow_fate_f77441: "^660000找到《命运之鸦》并不难"
  npc_override_que_ba_quests_morocc_disabled_enter_moc_fild_65ac8e: "无法从野外进入 moc_fild21。"
  npc_override_que_ba_quests_morocc_disgrace_me_3b4a93: "让我蒙羞！！！"
  npc_override_que_ba_quests_morocc_dog_barking_loudly_front_f88d97: "^660000一只狗在图书馆前面大声吠叫。^000000"
  npc_override_que_ba_quests_morocc_don_t_ever_low_estimate_6df2e0: "永远不要低估我，喵！"
  npc_override_que_ba_quests_morocc_don_t_look_my_face_489174: "别看着我的脸……"
  npc_override_que_ba_quests_morocc_don_t_peep_something_you_3afaa2: "不要偷看你不该看的东西。好吧，至少尽量别。"
  npc_override_que_ba_quests_morocc_don_t_you_better_things_ff60b8: "你就没有更好的事情可做吗？你最好去避难所保命吧。"
