  npc_override_que_ba_quests_morocc_hey_you_re_reading_trace_b55a43: "嘿，你在读《命运之痕》！"
  npc_override_que_ba_quests_morocc_him_his_small_dark_under_d27b11: "对他来说，他那狭小阴暗的地下村庄是一座监狱，阻碍了他满足好奇心和追求自由的渴望。"
  npc_override_que_ba_quests_morocc_hired_specialists_invest_ab0aa9: "并已聘请专家调查"
  npc_override_que_ba_quests_morocc_his_female_fans_showed_n_551610: "他的女性粉丝表现出负面反应"
  npc_override_que_ba_quests_morocc_his_name_sefakiest_he_al_4f5175: "他的名字叫塞法基斯特，他总是支持她的研究。"
  npc_override_que_ba_quests_morocc_his_patience_finally_ran_c6838b: "他的耐心终于在昨晚耗尽了。"
  npc_override_que_ba_quests_morocc_his_plan_all_long_5e6ac0: "这长久以来就是他的计划……"
  npc_override_que_ba_quests_morocc_his_professionalism_cce831: "因为他的专业精神"
  npc_override_que_ba_quests_morocc_his_resurrection_caused_a86220: "他的复活给村庄和周围的沙漠造成了不可挽回的破坏，现在他已经转移到了索格瑞特沙漠。"
  npc_override_que_ba_quests_morocc_his_voice_as_stern_intim_fd9440: "^660000他的声音和他的外表一样严厉而令人生畏。^000000"
  npc_override_que_ba_quests_morocc_hit_pebble_which_man_thr_73d77c: "^660000被那个男人扔出的小石子击中，乌鸦迅速飞向了空中。^000000"
  npc_override_que_ba_quests_morocc_hm_you_don_t_seem_e2318f: "嗯？你看起来不像是"
  npc_override_que_ba_quests_morocc_hmm_8bcb9b: "嗯~！"
  npc_override_que_ba_quests_morocc_hmm_9c4d28: "嗯……"
  npc_override_que_ba_quests_morocc_hmm_c74b93: "……嗯……"
  npc_override_que_ba_quests_morocc_hmm_i_m_sorry_i_b29691: "嗯……很抱歉。我在这里工作了几十年，但我好像从来没听说过书名和你说的相近的书。"
  npc_override_que_ba_quests_morocc_hmm_i_m_sorry_i_bcb64d: "嗯……很抱歉。我在这里工作了几十年，但我好像从来没听说过这样的书。"
  npc_override_que_ba_quests_morocc_hmm_i_m_sorry_i_f2d3f8: "嗯……很抱歉。我在这里工作了几十年，但我好像从来没听说过这样的作者。"
  npc_override_que_ba_quests_morocc_hmm_let_him_what_he_8c7367: "嗯。让他做他想做的事吧。"
  npc_override_que_ba_quests_morocc_hmm_occurs_me_you_don_b681d7: "嗯，我觉得你并不了解这其中所涉及的危险。你知道梦罗克魔王有多强大吗？"
  npc_override_que_ba_quests_morocc_hmm_yeah_i_see_a37683: "嗯……是吗？我明白了。"
  npc_override_que_ba_quests_morocc_hmmm_775f8a: "嗯嗯。"
  npc_override_que_ba_quests_morocc_hmpf_i_right_i_knew_79c50a: "哼，我就知道。我就知道你连这么简单的任务都完成不了。我不该在你身上浪费时间的。"
  npc_override_que_ba_quests_morocc_hoho_did_he_really_say_c2a717: "呵呵，他昨天真的那么说了吗……？"
  npc_override_que_ba_quests_morocc_hopefully_fans_reaction_a5cb5c: "希望粉丝们的反应不会引起太多担忧"
  npc_override_que_ba_quests_morocc_hours_term_timer_stopped_17a03f: "6 小时计时器已停止。"
  npc_override_que_ba_quests_morocc_how_could_no_one_shed_bcfc28: "看了她这张悲伤的照片，怎么会没有人落泪呢？！啊，玛米！我来让你成为世界上最幸福的女人！"
  npc_override_que_ba_quests_morocc_how_dare_you_b2ea3f: "你怎么敢"
  npc_override_que_ba_quests_morocc_how_hell_did_you_find_9893fa: "你到底是怎么找到我的？！"
  npc_override_que_ba_quests_morocc_how_may_i_help_you_cc1359: "有什么可以帮到你的吗？"
  npc_override_que_ba_quests_morocc_how_may_i_help_you_cd0cb1: "……有什么可以帮到你的吗？"
  npc_override_que_ba_quests_morocc_how_s_out_meow_7238cb: "外面怎么样，喵？"
  npc_override_que_ba_quests_morocc_how_you_any_proof_your_ba81d0: "怎么？你有胜利的证明吗？"
  npc_override_que_ba_quests_morocc_howdy_new_customer_3ef3da: "你好啊，新顾客！！"
  npc_override_que_ba_quests_morocc_huh_73fef0: "嗯？"
  npc_override_que_ba_quests_morocc_huh_80ee84: "嗯……"
  npc_override_que_ba_quests_morocc_huh_c42198: "……………嗯？"
  npc_override_que_ba_quests_morocc_huh_how_did_ruffian_like_7a35cc: "……嗯。你这样的流氓是怎么进来的？"
  npc_override_que_ba_quests_morocc_huh_what_you_kidding_me_c3213d: "哈？什么，你在开玩笑吗？"
  npc_override_que_ba_quests_morocc_huh_you_sure_you_bring_562a92: "哈？！你确定你能带来那些？嗯……"
  npc_override_que_ba_quests_morocc_huh_you_want_chance_prov_c7f4c6: "哈？你想找机会证明自己？"
  npc_override_que_ba_quests_morocc_huh_you_want_join_us_2972d0: "哈？你想加入我们，为大陆卫队做志愿工作？"
  npc_override_que_ba_quests_morocc_human_curiosity_led_grea_65858d: "人类的好奇心带来了伟大的成就和贡献，但有些知识可能超出了人类所能承受的范围。"
  npc_override_que_ba_quests_morocc_i_am_currently_checking_bbbd89: "我目前正在检查梦罗克的状态。"
  npc_override_que_ba_quests_morocc_i_am_sure_you_already_4ec9d4: "我相信你已经知道，梦罗克魔王的复活正威胁着卢恩-米德加尔特王国的和平。如果任由梦罗克魔王肆意横行，它将吞噬整个世界。"
  npc_override_que_ba_quests_morocc_i_applaud_you_your_coura_82039e: "我为你的勇气喝彩，但你需要的不只是勇气来帮助我们。"
  npc_override_que_ba_quests_morocc_i_believe_she_s_reincarn_2e6dc2: "我相信她是智慧女神的转世，被嫉妒的女神们放逐到了米德加尔特大陆。"
  npc_override_que_ba_quests_morocc_i_d_better_give_him_5a39d2: "我最好把这张便条还给他。"
  npc_override_que_ba_quests_morocc_i_didn_t_think_you_2dac5e: "我没想到你会这么轻易地接受我。我准备好了。你想问什么就问吧。"
  npc_override_que_ba_quests_morocc_i_don_t_care_what_6ed057: "我不在乎你说什么，我就是要进去！！！"
  npc_override_que_ba_quests_morocc_i_don_t_know_why_93cc1c: "我不知道为什么，但……我相信伊娃已经不存在了……"
  npc_override_que_ba_quests_morocc_i_don_t_time_go_64ba87: "我没时间陪你！走开！"
  npc_override_que_ba_quests_morocc_i_feel_so_excited_think_7de9cb: "一想到能和玛米进行一场关于文学的深入交流，我就兴奋不已！耶！"
  npc_override_que_ba_quests_morocc_i_flew_over_rune_midgart_1d2087: "我乘坐最早的一班飞艇飞到了卢恩-米德加尔特王国"
  npc_override_que_ba_quests_morocc_i_found_giant_black_feat_17f395: "她离开后，我在她的房间里发现了一根 ^3131FF巨大的黑色羽毛^000000。"
  npc_override_que_ba_quests_morocc_i_goal_achieve_here_ahch_6bbf2a: "我在这里有一个目标要实现……阿嚏！"
  npc_override_que_ba_quests_morocc_i_going_charge_you_c7eb0f: "我本来打算收你"
  npc_override_que_ba_quests_morocc_i_got_book_him_as_621573: "那本书是他作为礼物送给我的。他可能还有更多关于她的稀有书籍……阿嚏！"
  npc_override_que_ba_quests_morocc_i_guarantee_you_d_just_d0f2cd: "我保证你只会拖累我的士兵。你只有在梦里才能对梦罗克魔王构成威胁。放弃吧。"
  npc_override_que_ba_quests_morocc_i_guess_everyone_make_be_5fc2d7: "我想并不是每个人都能写出畅销书，对吧？"
  npc_override_que_ba_quests_morocc_i_guess_he_won_t_e548b6: "我猜他看不见也听不见我，就像其他人一样。"
  npc_override_que_ba_quests_morocc_i_guess_s_just_old_e70b5d: "我想这只是陈年旧事……我为什么要关心？别人为什么要关心？"
  npc_override_que_ba_quests_morocc_i_guess_s_stupid_idea_dd2699: "我想这是个愚蠢的想法。"
  npc_override_que_ba_quests_morocc_i_guess_so_630c8f: "我想是吧。"
  npc_override_que_ba_quests_morocc_i_guess_you_d_benefit_29aa85: "我想你最好了解一下全面的情况。要我跟你简单说明一下吗？"
  npc_override_que_ba_quests_morocc_i_guess_you_seriously_wo_38747f: "我猜你重创了梦罗克魔王，它退回到了时空裂隙中。毫无疑问，它正在试图恢复力量。"
  npc_override_que_ba_quests_morocc_i_gurantee_you_you_ll_185dd1: "我保证你会很快好起来的。"
  npc_override_que_ba_quests_morocc_i_happened_hear_monsters_3b872b: "我碰巧听说熔岩洞穴里的怪物拥有永恒之火，可以解决我们的篝火问题。我希望你能为我们收集那些火焰。"
  npc_override_que_ba_quests_morocc_i_haven_t_had_chance_32fe73: "我还没来得及打开看，但我的出版商说里面有一些非常稀有的东西。我希望这足够付你那本书的钱。"
  npc_override_que_ba_quests_morocc_i_hope_you_keep_mind_eff268: "我希望你记住，我们的战斗远未结束。我们的敌人是恶魔之王……我担心梦罗克魔王很快就会卷土重来。"
  npc_override_que_ba_quests_morocc_i_hope_you_ll_also_c17c97: "希望你也喜欢我的下一本书。那我先走了……谢谢你的画册！"
  npc_override_que_ba_quests_morocc_i_i_don_t_know_e2aa17: "我……我不知道该怎么道歉……"
  npc_override_que_ba_quests_morocc_i_i_see_d75a32: "我……我明白了……"
  npc_override_que_ba_quests_morocc_i_just_told_you_0b337a: "我刚才告诉过你"
  npc_override_que_ba_quests_morocc_i_just_want_know_out_3e4db0: "……我只是出于好奇想知道……^000000"
  npc_override_que_ba_quests_morocc_i_knew_d_too_tough_ba4704: "我就知道那对你来说太难了。我很高兴你终于及时意识到了自己的极限。认识到自己的弱点也是需要智慧的。"
  npc_override_que_ba_quests_morocc_i_know_cave_s_hidden_a7836c: "我知道北方有一个隐藏的洞穴。"
  npc_override_que_ba_quests_morocc_i_know_what_you_re_333e33: "我知道你要说什么。你想要我手上的魔力眼镜，对——吧？"
  npc_override_que_ba_quests_morocc_i_let_you_d05129: "我会让你"
  npc_override_que_ba_quests_morocc_i_live_nowhere_i_don_5e3ad6: "—— 我无家可归，也没有父母。——"
  npc_override_que_ba_quests_morocc_i_ll_ask_you_help_4f4262: "我改天再请你帮忙吧。"
  npc_override_que_ba_quests_morocc_i_ll_let_live_just_c17908: "我就让你再多活一会儿。你永远别想穿过这个时空裂隙找到我！"
  npc_override_que_ba_quests_morocc_i_ll_let_you_if_ae8f07: "如果你请我喝一杯，我就让你进去。"
  npc_override_que_ba_quests_morocc_i_ll_send_you_field_4fe0b4: "我马上把你送到野外。请使用野外入口处的传送点返回这个区域。"
  npc_override_que_ba_quests_morocc_i_looking_thing_shining_c20414: "我刚才在看包盖下闪闪发光的东西！"
  npc_override_que_ba_quests_morocc_i_m_afraid_creepy_bird_0bb1e3: "我担心那只可怕的鸟会吓跑我的客人！"
  npc_override_que_ba_quests_morocc_i_m_afraid_you_so_3a98c2: "我不怕你，放马过来吧！"
  npc_override_que_ba_quests_morocc_i_m_going_see_her_2431c7: "我明天早上一到就去看她！玛米，我来了！"
  npc_override_que_ba_quests_morocc_i_m_going_tell_you_8a3fed: "我要告诉你一些关于作为大陆卫队成员与梦罗克魔王作战的基本信息。"
  npc_override_que_ba_quests_morocc_i_m_having_great_ideas_3f2379: "我现在有些绝妙的想法。不好意思，我得走了。"
  npc_override_que_ba_quests_morocc_i_m_here_find_somebody_8b0a2a: "我是来找人的！"
  npc_override_que_ba_quests_morocc_i_m_like_other_outsiders_9ebcc1: "「我和其他外来者不一样……阿嚏！」"
  npc_override_que_ba_quests_morocc_i_m_looking_book_called_f2ed86: "我在找一本叫《命运之鸦》的书，作者是奥利弗·希尔伯特……阿嚏！"
  npc_override_que_ba_quests_morocc_i_m_messenger_dispatched_72c8d3: "我是从梦罗克大陆卫队总部派往 {0} 的信使。我的职责是把这个重要的消息尽可能多地传达给知名的冒险者。我很高兴终于找到你了，{1}。"
  npc_override_que_ba_quests_morocc_i_m_messenger_morocc_con_112b02: "我是来自梦罗克大陆卫队总部的信使，我来到 {0} 是为了给卢恩-米德加尔特王国的所有人带来一个紧急消息。"
  npc_override_que_ba_quests_morocc_i_m_ready_accept_end_c5ba26: "但我已经准备好接受结局……一切的结局……"
  npc_override_que_ba_quests_morocc_i_m_really_stressed_out_747301: "我现在压力真的很大。"
  npc_override_que_ba_quests_morocc_i_m_so_sorry_being_837b43: "很抱歉没能帮上什么忙。"
  npc_override_que_ba_quests_morocc_i_m_sorry_i_m_8c4287: "很抱歉，我正忙着审核所有未来大陆卫队的申请，没时间一一问候你们这些冒险者。"
  npc_override_que_ba_quests_morocc_i_m_sorry_inexperienced_9e4ea2: "很抱歉，但经验不足的冒险者只会妨碍我们。希望你能理解。如果你真的想帮我们，现在就请专注于你的训练吧。"
  npc_override_que_ba_quests_morocc_i_m_sorry_you_ve_1f009a: "很抱歉你大老远跑来却一无所获。"
  npc_override_que_ba_quests_morocc_i_m_stationed_here_assis_fc923e: "我被派驻在这里，协助那些愿意志愿帮助大陆卫队对抗梦罗克魔王的冒险者。"
  npc_override_que_ba_quests_morocc_i_m_still_convinced_you_f3f082: "我仍然不相信你有足够的能力加入我们。让我想想……嗯……"
  npc_override_que_ba_quests_morocc_i_m_surprised_story_book_7fd215: "我很惊讶这本书里的故事……和我的人生经历很相似。非常相似。"
  npc_override_que_ba_quests_morocc_i_m_talking_about_c4e0c4: "我在说的是！"
  npc_override_que_ba_quests_morocc_i_no_longer_had_worry_cf520e: "我不再需要担心挨饿，但我作为「人类」的生活在那天结束了。"
  npc_override_que_ba_quests_morocc_i_normal_man_once_povert_b205c1: "我曾经是一个普通人，但贫穷让我失去了自尊、自信和身份。"
  npc_override_que_ba_quests_morocc_i_only_serve_two_175854: "我只供应两种"
  npc_override_que_ba_quests_morocc_i_problem_1ecc63: "我有个问题……"
  npc_override_que_ba_quests_morocc_i_really_need_read_book_261940: "我真的很需要读那本书，然后告诉她我在这里等她，但我甚至没有时间喘口气，因为眼前的这个局面！"
  npc_override_que_ba_quests_morocc_i_really_want_buy_your_1267b2: "我真的想买你的书！"
  npc_override_que_ba_quests_morocc_i_remember_mr_zid_saying_c4d8f1: "我记得齐德先生说伊娃留下了一根黑色羽毛。"
  npc_override_que_ba_quests_morocc_i_riding_carriage_last_n_0e4377: "—— 我昨晚坐马车时，发现你躺在街上。我叫海吉。你可以叫我海吉先生，孩子。——"
  npc_override_que_ba_quests_morocc_i_said_go_away_you_391a83: "我说了走开，你这只蠢鸟！"
  npc_override_que_ba_quests_morocc_i_see_keep_up_your_3413a3: "我明白了。继续保持你在对抗梦罗克魔王方面的出色表现。别忘了大陆的未来掌握在我们手中。"
  npc_override_que_ba_quests_morocc_i_see_well_then_your_f94ee7: "我明白了。那为了你的安全，请尽快离开这个危险区域。"
  npc_override_que_ba_quests_morocc_i_should_go_read_book_2b7a77: "我应该马上去读这本书。嘿嘿嘿！"
  npc_override_que_ba_quests_morocc_i_sick_tired_worrying_ab_5fab1a: "我厌倦了每天为食物发愁，于是自愿成为一个实验的受试者。"
  npc_override_que_ba_quests_morocc_i_standing_next_her_9232f3: "我站在她旁边吗？"
  npc_override_que_ba_quests_morocc_i_strongly_recommend_you_0f370d: "我强烈建议你现在只考虑自己的安全。当最终决战来临时，我相信没有任何地方是安全的。"
  npc_override_que_ba_quests_morocc_i_strongly_resent_my_fat_a2961b: "我强烈地怨恨我的命运……"
  npc_override_que_ba_quests_morocc_i_t_believe_happening_88a939: "我简直不敢相信这会发生！"
  npc_override_que_ba_quests_morocc_i_t_give_you_anything_089fcf: "我什么也不能给你"
  npc_override_que_ba_quests_morocc_i_t_leave_him_here_917ce8: "—— 我不能把他留在这里！——"
  npc_override_que_ba_quests_morocc_i_think_when_crow_hit_d69b01: "我想当乌鸦被石子击中时，它的智慧一定变成了灾难。"
  npc_override_que_ba_quests_morocc_i_think_you_ve_dropped_ac4ea5: "我想你掉了这个。"
  npc_override_que_ba_quests_morocc_i_told_great_writers_usu_a02e77: "我听说伟大的作家通常从梦中获得灵感。我想我天生就是其中之一。哈哈哈！"
  npc_override_que_ba_quests_morocc_i_trying_drive_away_beca_a8cce3: "我试图赶走它是因为……它总有一种不祥的感觉。"
  npc_override_que_ba_quests_morocc_i_used_small_feather_i_c087d0: "我曾经有一根小羽毛。我想我成为图书馆馆长也是顺理成章的事。哈哈哈！"
  npc_override_que_ba_quests_morocc_i_ve_always_believed_sat_6cc2c8: "我一直相信撒旦……"
  npc_override_que_ba_quests_morocc_i_ve_got_nothing_say_e4be85: "如果是关于发给各公会的请求，我没什么好说的。"
  npc_override_que_ba_quests_morocc_i_ve_got_perfect_thing_2a2c06: "我有件完美的东西可以帮你吸引玛米。你想看吗？"
  npc_override_que_ba_quests_morocc_i_ve_heard_kingdom_plann_74f857: "我听说王国正计划派遣一大群研究人员去调查梦罗克魔王逃往的那个异世界。"
  npc_override_que_ba_quests_morocc_i_ve_no_doubt_if_3f4ee0: "我毫不怀疑，如果不加以制止，梦罗克魔王将占领整个米德加尔特大陆。我们必须立刻阻止它，以免整个世界陷入苦难。"
  npc_override_que_ba_quests_morocc_i_ve_prepared_few_things_843953: "我准备了几样东西作为给你的奖励。让我看看……有三样物品。你想领取哪一样？"
  npc_override_que_ba_quests_morocc_i_ve_read_his_trace_3924d3: "我读了他的《命运之痕》至少好几遍了。那本书太吸引人了，我永远读不腻。"
  npc_override_que_ba_quests_morocc_i_wonder_if_he_threw_bc98e9: "我想知道他是不是像图书馆馆长那样朝乌鸦扔石头……"
  npc_override_que_ba_quests_morocc_if_i_another_dream_i_719094: "如果我再做一次梦，到时候再说吧~"
  npc_override_que_ba_quests_morocc_if_i_want_read_news_af9aab: "如果我想看关于火灾的新闻，应该去哪个版面？"
  npc_override_que_ba_quests_morocc_if_oliver_dreaming_exact_7d9241: "如果奥利弗做了和你完全一样的梦，那可能意味着他和你正在共享梦境。而且，你发现书中的洞穴村庄确实存在。"
  npc_override_que_ba_quests_morocc_if_you_been_invited_our_9af9ef: "如果你收到了我们信使的邀请，或者对自己的能力有信心，我们鼓励你志愿加入大陆卫队，为这片大陆带回和平。"
  npc_override_que_ba_quests_morocc_if_you_d_like_i_26f66c: "如果你愿意，我可以直接送你去那里。"
  npc_override_que_ba_quests_morocc_if_you_d_like_know_cb6057: "如果你想了解更多信息，建议你去和梦罗克村事故现场负责的大陆卫队谈谈。"
  npc_override_que_ba_quests_morocc_if_you_don_t_really_bb21e0: "如果你真的不喜欢那本书，为什么不把它卖给我呢？"
  npc_override_que_ba_quests_morocc_if_you_help_me_i_8b9085: "如果你帮我，我会给你看一本玛米的限量画册……仅此一次。嘻嘻嘻嘻。"
  npc_override_que_ba_quests_morocc_if_you_re_gonna_e6201f: "如果你不打算做"
  npc_override_que_ba_quests_morocc_if_you_re_here_request_ffc2ca: "如果你是来找我们之前发布的那个请求的，那就算了吧。"
  npc_override_que_ba_quests_morocc_if_you_re_interested_fee_9ee755: "如果你感兴趣的话，也可以顺便去那个图书馆看看。"
  npc_override_que_ba_quests_morocc_if_you_really_feel_sorry_70b96d: "如果你真的为我们感到难过，请不要让别人知道我们在哪里。"
  npc_override_que_ba_quests_morocc_if_you_really_want_enter_1b83dd: "如果你真的想进去，"
  npc_override_que_ba_quests_morocc_if_you_really_want_read_1edaed: "如果你真的想读那本书，你应该去朱诺图书馆试试。"
  npc_override_que_ba_quests_morocc_if_you_say_so_thank_865e64: "既然你这么说，谢谢你的理解。"
  npc_override_que_ba_quests_morocc_if_you_want_i_ll_376c0e: "如果你愿意，我可以推荐"
  npc_override_que_ba_quests_morocc_ignoring_collapsing_labo_edaaaa: "伊娃无视着坍塌的实验室天花板，走近一根试管，小心翼翼地取出一样东西，然后把它夹在夹克下面。>"
  npc_override_que_ba_quests_morocc_inside_just_come_back_740a38: "里面。只要回来"
  npc_override_que_ba_quests_morocc_interesting_you_my_atten_9b2d8a: "有意思。你引起了我的注意。好吧，如果你能为我完成一件事，我想承认你的实力也是公平的。"
  npc_override_que_ba_quests_morocc_isn_t_38dc63: "这……这不是……吗？"
  npc_override_que_ba_quests_morocc_isn_t_over_there_870b51: "那不是在那边的吗？！"
  npc_override_que_ba_quests_morocc_jean_cadoc_s_new_series_972bd4: "让·卡多克的新系列"
  npc_override_que_ba_quests_morocc_just_like_last_time_you_850ee4: "^660000就像你上次见到他时一样，本杰明正活在自己的梦里，把一本书贴在脸上摩挲。^000000"
  npc_override_que_ba_quests_morocc_just_remember_02b9f0: "记住……"
  npc_override_que_ba_quests_morocc_just_whatever_you_want_7b2514: "你想干什么就干什么！"
  npc_override_que_ba_quests_morocc_just_you_ec47b1: "专门为你！"
  npc_override_que_ba_quests_morocc_knight_like_me_1e87d5: "像我这样的骑士正处在一个"
  npc_override_que_ba_quests_morocc_know_guy_cf006c: "认识这家伙？"
  npc_override_que_ba_quests_morocc_know_items_i_need_7ef8a7: "知道我需要的材料……"
  npc_override_que_ba_quests_morocc_krrrr_41219e: "嘎——！"
  npc_override_que_ba_quests_morocc_laboratory_found_empty_74e2da: "实验室被发现是空的"
  npc_override_que_ba_quests_morocc_laboratory_must_been_use_543dcc: "那个实验室一定被用作"
  npc_override_que_ba_quests_morocc_laboratory_which_eva_i_b_b19b65: "伊娃和我被实验的那个实验室并不普通。"
  npc_override_que_ba_quests_morocc_lady_mammi_25e909: "玛米小姐！"
  npc_override_que_ba_quests_morocc_lady_mammi_4e1042: "玛米小姐……"
  npc_override_que_ba_quests_morocc_lady_question_known_as_p_6bd097: "这位女士被称为祭司 M，"
  npc_override_que_ba_quests_morocc_last_night_two_young_men_65d636: "昨晚，两名年轻男子被目击"
  npc_override_que_ba_quests_morocc_later_after_learning_hae_d0874a: "后来，在得知海吉是朱诺城市大学的教授后，阿尔确信命运站在他这一边。>"
  npc_override_que_ba_quests_morocc_least_morocc_village_des_82ab91: "梦罗克村至少有 70% 在梦罗克魔王复活的灾难中被摧毁。"
  npc_override_que_ba_quests_morocc_leave_gosh_won_t_go_dc38c5: "走开！天哪，它不肯走！"
  npc_override_que_ba_quests_morocc_let_me_process_your_appl_69d9b6: "让我立即处理你的申请。请稍等。"
  npc_override_que_ba_quests_morocc_let_me_take_guess_you_ee4e93: "让我猜猜。你还没有从这个联合部门接到任何任务，对吧？"
  npc_override_que_ba_quests_morocc_let_me_think_if_book_95737b: "让我想想。如果这本书在普隆德拉图书馆还没有，那就意味着卢恩-米德加尔特没有多少人读过这本书。"
  npc_override_que_ba_quests_morocc_let_s_disturb_him_especi_426f8b: "我们别打扰他，尤其是当他充满创作灵感的时候。那可不常见。"
  npc_override_que_ba_quests_morocc_let_s_go_eva_7cc29e: "我们走，伊娃！"
  npc_override_que_ba_quests_morocc_let_s_see_one_two_d38718: "让我看看……一、二、三……三十个，你都带来了。好吧，这是个相当简单的任务。只需要花点时间和一点努力。谁都能做到。"
  npc_override_que_ba_quests_morocc_letter_recommendation_0f0c20: "推荐信？"
  npc_override_que_ba_quests_morocc_listen_might_more_helpfu_3d6702: "听着，你先跟别人聊聊可能会更有帮助。我相信其他大陆卫队成员或者我们的信使会更有能力帮到你。"
  npc_override_que_ba_quests_morocc_look_around_they_witness_b31e8a: "看看周围！他们就是人类的见证者。而且每天都有新的加入者。"
  npc_override_que_ba_quests_morocc_look_i_understand_your_e_9c5646: "听着，我理解你的热情，但如果你以为能帮到我们，那你就错了。我没有时间详细解释我们面临的危险。"
  npc_override_que_ba_quests_morocc_look_s_picture_book_mamm_fe3edc: "看，这就是我跟你说的那本玛米画册。"
  npc_override_que_ba_quests_morocc_looking_lustrous_feather_bb72eb: "看着这根光泽的羽毛，你莫名地感到很开心，仿佛获得了珍宝一般。^000000"
  npc_override_que_ba_quests_morocc_looks_like_cover_s_round_d85567: "看起来封面是圆角的，还有一条红色绑带，"
  npc_override_que_ba_quests_morocc_looks_like_you_business_d9c6d8: "看来你找我有事。请尽量简洁，因为我时间不多。有很多事情需要处理……"
  npc_override_que_ba_quests_morocc_looks_like_you_came_some_ced4ad: "看来你是有事而来，但别妄想得到我的帮助，喵！！"
  npc_override_que_ba_quests_morocc_looks_like_you_t_afford_c5b9ca: "看来你付不起"
  npc_override_que_ba_quests_morocc_looks_like_your_help_cou_3e1fb2: "看来你的帮助还是有用的。是时候让你参与进来了。祝你好运。"
  npc_override_que_ba_quests_morocc_luckily_feather_gone_so_b01646: "幸好羽毛不见了，希望我不会再遭受什么灾难。"
  npc_override_que_ba_quests_morocc_maaaammmiii_44a685: "玛——米——！"
  npc_override_que_ba_quests_morocc_macmillan_s_post_worksho_36f439: "麦克米兰 ^3355FF邮差^000000 工坊。"
  npc_override_que_ba_quests_morocc_main_character_writer_s_e42406: "主角是一位作家，这家伙写他情妇的故事真是太感人了……"
  npc_override_que_ba_quests_morocc_main_reason_because_sata_734b30: "主要原因是梦罗克魔王在索格瑞特沙漠被发现，但还有另一个重要原因。"
  npc_override_que_ba_quests_morocc_make_sure_0cc2e3: "确保这个"
  npc_override_que_ba_quests_morocc_make_sure_you_cash_348951: "确保你带够了钱！"
  npc_override_que_ba_quests_morocc_make_sure_you_come_back_503da2: "一定要回来"
  npc_override_que_ba_quests_morocc_male_silhouette_quickly_d36214: "^660000那个男性身影迅速靠近墙壁，开始挖掘坍塌的角落。^000000"
  npc_override_que_ba_quests_morocc_mammi_i_m_coming_don_695c7f: "玛米，我来了！你要等我！"
  npc_override_que_ba_quests_morocc_mammi_seems_strange_leve_4b30b0: "^660000玛米似乎有着你永远无法理解的奇怪人气。^000000"
  npc_override_que_ba_quests_morocc_man_also_yelling_front_l_246475: "^660000图书馆前面还有一个男人在大喊大叫。^000000"
  npc_override_que_ba_quests_morocc_man_who_looks_as_dry_8214b5: "^660000这个看起来像被太阳晒干的鱼一样干瘦的男人，脸上依然挂着让你想起仁慈之神的微笑，手里抚摸着一本书。^000000"
  npc_override_que_ba_quests_morocc_man_you_don_t_know_ca2285: "喂，你什么都不知道，对吧？！从你那张傻乎乎的表情来看，我猜你是个替别人跑腿的冒险者。嘿嘿！"
  npc_override_que_ba_quests_morocc_mansion_looks_very_elega_e5eaf5: "^660000这栋宅邸看起来非常优雅华丽，但它正在燃烧，就像你第一个梦中的实验室一样。^000000"
  npc_override_que_ba_quests_morocc_master_marjana_room_righ_f4d06f: "主人和玛雅娜在右边那个房间里？喵，喵，喵~~"
  npc_override_que_ba_quests_morocc_may_i_see_0a1615: "可以让我看看吗？"
  npc_override_que_ba_quests_morocc_maybe_oliver_eva_s_boy_7cd906: "也许奥利弗就是伊娃的孩子……"
  npc_override_que_ba_quests_morocc_maybe_stronghold_itself_308a49: "也许这个据点本身就是独一无二的……"
  npc_override_que_ba_quests_morocc_me_any_favors_then_why_d902db: "给我什么恩惠，那为什么"
  npc_override_que_ba_quests_morocc_me_fix_you_something_oka_b050b1: "我帮你修点什么，好吗？"
  npc_override_que_ba_quests_morocc_means_s_time_both_us_0e9e9a: "这意味着是我们两个——你和我——开始行动的时候了。谁知道梦罗克什么时候会回来折磨我们？"
  npc_override_que_ba_quests_morocc_means_she_s_waiting_some_fb0c75: "这意味着……她在等我这样的人。嘿嘿嘿！"
  npc_override_que_ba_quests_morocc_menu_a_68eff7: "面带微笑的真诚告白："
  npc_override_que_ba_quests_morocc_menu_about_1a895f: "关于洞穴村庄:关于他自己:关于伊娃:结束对话"
  npc_override_que_ba_quests_morocc_menu_al_e35b1a: "阿尔心想，不管多久他都得撒谎。老人似乎理解他：他的眼神流露出对这个小男孩的同情。海吉坚持说阿尔可以想住多久就住多久。"
  npc_override_que_ba_quests_morocc_menu_and_244e6d: "^660000而且你并不孤单：你现在可以清楚地看到从实验室逃出来的那对男女。^000000"
  npc_override_que_ba_quests_morocc_menu_ask_ea9039: "询问关于大陆卫队的事:我想加入大陆卫队:结束对话"
  npc_override_que_ba_quests_morocc_menu_besides_32a72f: "而且，你不能在这里惹麻烦：这个地方"
  npc_override_que_ba_quests_morocc_menu_cancel_387baf: "取消对话:询问发生了什么"
  npc_override_que_ba_quests_morocc_menu_cancel_42b1b7: "取消对话:进入野外调查:前往梦罗克事故现场"
  npc_override_que_ba_quests_morocc_menu_cancel_6f6d0e: "取消。:重置。"
  npc_override_que_ba_quests_morocc_menu_could_2cbc65: "我能订一个 ^3355FF邮差路标^000000 吗？:不了……"
  npc_override_que_ba_quests_morocc_menu_don_5cce76: "别忘了这个书名：奥利弗·希尔伯特所著的《命运之鸦》。我相信在普隆德拉图书馆能找到它。"
  npc_override_que_ba_quests_morocc_menu_end_3f868b: "结束对话:再问一次"
  npc_override_que_ba_quests_morocc_menu_end_ca148a: "结束对话:你一定要让我加入！"
  npc_override_que_ba_quests_morocc_menu_end_e540c5: "结束对话:询问守卫位置"
  npc_override_que_ba_quests_morocc_menu_enter_0cc51b: "进入第一个调查区域:进入第二个调查区域:返回梦罗克事故现场:取消对话"
  npc_override_que_ba_quests_morocc_menu_for_a3822b: "因其锋利的拳刃而塑造的坏小子形象："
  npc_override_que_ba_quests_morocc_menu_give_24c596: "给:不给"
  npc_override_que_ba_quests_morocc_menu_give_50abc3: "放弃:给我一个证明自己的机会！"
  npc_override_que_ba_quests_morocc_menu_god_19bb28: "神的警告：化为灰烬的秘密实验室"
  npc_override_que_ba_quests_morocc_menu_help_ebeb97: "帮助他:不帮助他"
  npc_override_que_ba_quests_morocc_menu_i_8a8aec: "我要了。:不了，谢谢。"
  npc_override_que_ba_quests_morocc_menu_i_d98a06: "我决定把这本《天使玛米特别画册：在克魔岛》送给你，里面全是她美丽的照片，作为你帮助我的回报。嗯……你觉得怎么样？"
  npc_override_que_ba_quests_morocc_menu_if_af5d71: "如果你不忙，而且真的想读这本书，我有一个建议：去朱诺图书馆试试。"
  npc_override_que_ba_quests_morocc_menu_is_60706b: "玛雅娜在吗？:我是来找你的，陶。"
  npc_override_que_ba_quests_morocc_menu_it_9d8634: "^660000这是一个无法形容的梦：修发兹某个未知地点的燃烧实验室。"
  npc_override_que_ba_quests_morocc_menu_it_c61fb4: "它被那颗石子诅咒了。:乌鸦和奥利弗有关。"
  npc_override_que_ba_quests_morocc_menu_my_95e148: "我的玛米说她爱上了修发兹的 ^FF0000「奥利弗·希尔伯特」^000000 写的一本书：^FF0000《命运之鸦》^000000，但我连看都没机会看！"
  npc_override_que_ba_quests_morocc_menu_no_4f877d: "不了，谢谢。:请吧。"
  npc_override_que_ba_quests_morocc_menu_oh_121cd8: "哦，对了！我想我知道那本书："
  npc_override_que_ba_quests_morocc_menu_order_a8d91e: "点饮品:询问任务:取消"
  npc_override_que_ba_quests_morocc_menu_renowned_1a5ec6: "著名刺客西格琳德：「我只为你效劳。」"
  npc_override_que_ba_quests_morocc_menu_satan_49f545: "梦罗克魔王：我抓住你们只是时间问题，你们这些微不足道的虫子。再等一会儿……"
  npc_override_que_ba_quests_morocc_menu_satan_6a5107: "梦罗克魔王：你们尽管去处理你们的遗憾吧。我很快就会扼杀你们的生命！"
  npc_override_que_ba_quests_morocc_menu_satan_d7316e: "梦罗克魔王：我对你们这些弱者感到非常佩服。"
  npc_override_que_ba_quests_morocc_menu_say_63ee20: "说书名。:说作者。:按关键词搜索。"
  npc_override_que_ba_quests_morocc_menu_seal_24eef5: "1. 大陆卫队之印:2. 梦罗克护身石:3. 梦罗克戒指"
  npc_override_que_ba_quests_morocc_menu_search_6e821d: "搜索书籍。:环顾图书馆。"
  npc_override_que_ba_quests_morocc_menu_sell_ca002f: "卖:不卖"
  npc_override_que_ba_quests_morocc_menu_so_fa4b77: "所以，就你一个人，小屁孩？:你怎么了？！:嘿，别再喵喵叫了？！"
  npc_override_que_ba_quests_morocc_menu_speak_5d30b8: "说话:路过"
  npc_override_que_ba_quests_morocc_menu_step_258cf0: "退后。:不，听我说！"
  npc_override_que_ba_quests_morocc_menu_sure_afcd76: "当然:我为什么要听你的？！"
  npc_override_que_ba_quests_morocc_menu_thank_df8503: "非常感谢！那记住这个书名：奥利弗·希尔伯特所著的《命运之鸦》。我相信在普隆德拉图书馆能找到它。"
  npc_override_que_ba_quests_morocc_menu_that_7b017a: "那太难了！:没问题。你要多少？"
  npc_override_que_ba_quests_morocc_menu_that_ff54dc: "那太难了！让我想想！:没问题。"
  npc_override_que_ba_quests_morocc_menu_the_0409e3: "这件饰品的属性是：^0000FF 暴击率 + 5^000000。"
  npc_override_que_ba_quests_morocc_menu_the_a42ece: "这件饰品的属性是：^0000FF 最大生命值 +50，攻击速度 +3%^000000。"
  npc_override_que_ba_quests_morocc_menu_the_c56997: "这件饰品的属性是：^0000FF 最大魔力值 +50，咏唱速度 -1%^000000。"
  npc_override_que_ba_quests_morocc_menu_think_0ab1e8: "想想看：即使伊娃或那个男孩还活着，谁能把我们从这个黑暗的洞穴里救出去？答案是没有人。"
  npc_override_que_ba_quests_morocc_menu_tropical_b0a979: "热带索格瑞特:海滩上的朱红:你们有免费饮品吗？"
  npc_override_que_ba_quests_morocc_menu_what_0d9bce: "这个地方是做什么的？:我是来当志愿者的。:告诉我村子里的情况。"
  npc_override_que_ba_quests_morocc_menu_what_fdb147: "那是什么？:制造:无视他"
  npc_override_que_ba_quests_morocc_menu_yes_141459: "是:否"
  npc_override_que_ba_quests_morocc_menu_yes_ebb012: "1. 是。:2. 否。"
  npc_override_que_ba_quests_morocc_menu_you_a6d9d7: "^660000你已踏上了前往朱诺的旅程，去阅读《命运之鸦》的前传——《命运之痕》。^000000"
  npc_override_que_ba_quests_morocc_menu_your_206bc0: "你接下来的任务会很简单，但极其困难：你将与其他大陆卫队成员一起，阻止梦罗克魔王完全恢复其真正力量。"
  npc_override_que_ba_quests_morocc_meow_7f804c: "……喵……"
  npc_override_que_ba_quests_morocc_meow_meow_efc984: "喵，喵。"
  npc_override_que_ba_quests_morocc_meow_wait_minute_why_am_fc9a60: "……喵？等等，我为什么要讲这个故事，喵？！"
  npc_override_que_ba_quests_morocc_mission_a19d13: "任务……？"
  npc_override_que_ba_quests_morocc_mission_f371ec: "一个任务……"
  npc_override_que_ba_quests_morocc_mission_until_then_you_v_98c5ea: "一个任务。在那之前，你已经"
  npc_override_que_ba_quests_morocc_more_information_about_l_ed8ddf: "关于实验室的更多信息"
  npc_override_que_ba_quests_morocc_more_information_please_1ab7cf: "如需更多信息，请与梦罗克大陆卫队队长交谈。他在等你，{0}。"
  npc_override_que_ba_quests_morocc_more_shocking_god_given_db6e36: "但更令人震惊的是，神竟然赐予了如此稀有的她的画册"
  npc_override_que_ba_quests_morocc_morocc_45eb3f: "^3131FF<梦罗克>^000000"
  npc_override_que_ba_quests_morocc_morocc_been_killed_death_8ed2eb: "梦罗克已被击杀。死亡时间为 {0}（00 时/00 分/00 秒）。"
  npc_override_que_ba_quests_morocc_morocc_been_summoned_aft_8297f6: "梦罗克已被召唤。90 分钟后将恢复到重置状态。"
  npc_override_que_ba_quests_morocc_morocc_being_killed_72e793: "梦罗克正在被击杀。"
  npc_override_que_ba_quests_morocc_morocc_charm_stone_extre_c888a9: "梦罗克护身石是王国宫廷直接颁发的极其珍贵的奖励，象征着繁荣与魔力。"
  npc_override_que_ba_quests_morocc_morocc_city_desert_been_6075f2: "^660000沙漠之城梦罗克已被梦罗克魔王彻底摧毁。^000000"
  npc_override_que_ba_quests_morocc_morocc_continental_guard_208e5f: "梦罗克大陆卫队总部？"
  npc_override_que_ba_quests_morocc_morocc_continental_guard_50408a: "梦罗克大陆卫队立即成立，以对抗梦罗克魔王并缓解这一危急情况。我在这里是为了将这个灾难告知卢恩-米德加尔特王国的所有人。"
  npc_override_que_ba_quests_morocc_morocc_minutes_survival_f3b6ca: "梦罗克 90 分钟存活计时器已停止。"
  npc_override_que_ba_quests_morocc_morocc_ring_extremely_va_7a21db: "梦罗克戒指是王国宫廷直接颁发的极其珍贵的奖励，象征着暴击之力。"
  npc_override_que_ba_quests_morocc_morocc_village_completel_a31407: "梦罗克村已被彻底摧毁，梦罗克魔王现在占领了索格瑞特沙漠。"
  npc_override_que_ba_quests_morocc_most_bartenders_c79e86: "大多数酒保都会"
  npc_override_que_ba_quests_morocc_most_checked_out_book_li_7a1309: "是图书馆借阅量最高的书籍。"
  npc_override_que_ba_quests_morocc_mother_she_regular_human_c86fbc: "母亲……她是个普通人。"
  npc_override_que_ba_quests_morocc_mr_b_had_been_so_adb7cc: "B 先生对 A 先生的"
