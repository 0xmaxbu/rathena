  npc_override_que_ba_quests_morocc_s_why_kingdom_ordered_us_831e27: "这就是为什么王国命令我们精锐士兵组建大陆卫队，并招募世界各地的知名冒险者，以便我们能联合起来对抗梦罗克魔王。"
