  npc_override_que_ba_quests_morocc_eva_managed_save_one_tes_517b94: "伊娃设法救下了一个实验体，他后来长成了一个看起来正常的人，但实际上是完美的。"
  npc_override_que_ba_quests_morocc_eva_one_them_although_sh_bdc8e0: "伊娃是其中之一……虽然她并不善良，但她至少同情我，因为我是因为贫穷而出卖自己的。"
