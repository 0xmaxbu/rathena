  npc_override_que_ba_quests_morocc_muhahahaha_a0733a: "呜哈哈哈！"
  npc_override_que_ba_quests_morocc_muhahahahahaha_a792ba: "呜哈哈哈哈哈哈！"
  npc_override_que_ba_quests_morocc_mumble_mumble_807ba5: "咕哝……咕哝……"
  npc_override_que_ba_quests_morocc_my_accessory_gone_6f9f91: "我的饰品不见了！"
  npc_override_que_ba_quests_morocc_my_appearance_bother_you_40a360: "我的外表让你不舒服吗？"
  npc_override_que_ba_quests_morocc_my_family_macmillan_clan_423c3b: "我的家族，麦克米兰家族，生产专业交通信号路标已有 250 多年的历史。如今，我们正在接受我们独特装饰品 ^3355FF邮差路标^000000 的特殊订单。"
  npc_override_que_ba_quests_morocc_my_friend_drink_as_8a8dee: "我的朋友，当作"
  npc_override_que_ba_quests_morocc_my_mammi_different_those_eff4f2: "我的玛米和那些只靠美貌、缺乏内涵的其他名人不一样。"
  npc_override_que_ba_quests_morocc_my_mammi_pillow_cover_bu_c56772: "我的玛米枕头套被埋在废墟下了……天哪！"
  npc_override_que_ba_quests_morocc_my_name_zid_tell_me_d36c11: "我叫齐德。告诉我你想从我这里了解什么。我想多了解这本书。"
  npc_override_que_ba_quests_morocc_my_only_regret_we_t_962d8e: "我唯一的遗憾是我们无法在这个维度之外追击梦罗克。不过，我很高兴你击败了梦罗克魔王，阻止了它恢复全部力量。至少目前是这样……"
  npc_override_que_ba_quests_morocc_my_pretty_accessory_ac63ea: "我漂亮的饰品！"
  npc_override_que_ba_quests_morocc_my_purpose_life_protect_71ef46: "我的人生目标是保护其他村民。他们还有未来，即使生活在这个黑暗的洞穴里。"
  npc_override_que_ba_quests_morocc_my_soldiers_risking_thei_4f77c5: "我的士兵们正在冒着生命危险与梦罗克的分身和手下作战，以便让他们的战友更安全地前往梦罗克的巢穴。"
  npc_override_que_ba_quests_morocc_no_commoners_allowed_are_2f57e4: "平民不得进入此区域。"
  npc_override_que_ba_quests_morocc_no_gathering_these_flame_f11f89: "不，收集这些火焰与我们将要做的事相比简直是小事一桩。"
  npc_override_que_ba_quests_morocc_no_he_s_too_young_9634bf: "不，他太年轻了，不可能是他，因为那已经是很久以前的事了……"
  npc_override_que_ba_quests_morocc_no_i_anything_as_long_0856dd: "……不，只要是为了玛米，我什么都愿意做。嘿嘿，你是个善良的冒险者。谢了。"
  npc_override_que_ba_quests_morocc_no_i_got_as_gift_ec8ed5: "不，是别人送我的礼物……阿嚏！"
  npc_override_que_ba_quests_morocc_no_i_t_just_accept_035182: "……不，我不能就这样相信你的一面之词。我的意思是，如果你完成了这么重要的任务，你必须带给我一些证据。"
  npc_override_que_ba_quests_morocc_no_no_16db2c: "不，不！"
  npc_override_que_ba_quests_morocc_no_one_expected_him_end_3f4ac0: "没有人预料到他会这么轻易地结束自己的生命，毕竟他曾是最热忱的研究者。"
  npc_override_que_ba_quests_morocc_no_one_village_welcomes_d78cfd: "这个村子里没有人欢迎你。回去吧。"
  npc_override_que_ba_quests_morocc_no_one_welcome_us_we_9c2f74: "没有人会欢迎我们……我们看起来像怪物！"
  npc_override_que_ba_quests_morocc_no_outsiders_allowed_bey_1cb43d: "外人不得越过此线。"
  npc_override_que_ba_quests_morocc_no_place_playing_meow_50b4c8: "这不是玩耍的地方，喵……"
  npc_override_que_ba_quests_morocc_no_problem_i_m_here_efe8af: "没问题，我是来协助你的。"
  npc_override_que_ba_quests_morocc_no_problem_take_your_tim_1a0bcc: "没问题。你慢慢考虑，想好了再跟我说。"
  npc_override_que_ba_quests_morocc_no_problem_take_your_tim_bf9461: "没问题。你慢慢考虑，想好了再跟我说。"
  npc_override_que_ba_quests_morocc_no_problem_why_don_t_cce4ae: "没问题；你为什么不至少告诉我一些你记得的事情呢？"
  npc_override_que_ba_quests_morocc_no_thanks_i_m_interested_e4c1f7: "不了，谢谢。我对她没有你那么感兴趣。"
  npc_override_que_ba_quests_morocc_nothing_seems_working_no_f9f2b0: "现在好像什么都行不通了……"
  npc_override_que_ba_quests_morocc_nothing_yet_please_carry_3a8aa4: "暂时还没有。请继续你当前的任务。再次感谢你。"
  npc_override_que_ba_quests_morocc_now_continental_guards_l_31eb6c: "现在，大陆卫队将允许玩家进入。"
  npc_override_que_ba_quests_morocc_now_how_may_i_help_75983a: "……现在有什么可以帮到你的吗？"
  npc_override_que_ba_quests_morocc_now_hurry_up_if_you_82d9a4: "快去吧。如果你想放弃也没问题。不过要告诉我！"
  npc_override_que_ba_quests_morocc_now_i_m_oldest_villager_e9d86a: "现在我是最年长的村民了，肩负着保护他人的重任。"
  npc_override_que_ba_quests_morocc_now_i_m_too_old_778025: "现在我太老了，连伊娃或那个男孩的事都记不清了。"
  npc_override_que_ba_quests_morocc_now_i_need_start_reading_11eeb2: "现在我该开始读这本书了，为了将来能见到我的玛米，所以请别打扰我。"
  npc_override_que_ba_quests_morocc_now_i_remember_hearing_m_07e7b3: "对了，我记得听说北边冰洞里的怪物有冰冻的心脏。那些心脏也许能帮士兵们缓解酷暑。"
  npc_override_que_ba_quests_morocc_now_i_wonder_if_scene_2e192a: "^660000现在我想知道那个场景是不是在描述过去真实发生的事故。如果发生过那么大的火灾，我肯定能在报纸上核实。"
  npc_override_que_ba_quests_morocc_now_my_masterpiece_compl_553806: "现在我的杰作即将完成！"
  npc_override_que_ba_quests_morocc_now_please_go_speak_chie_f138e6: "现在请去和大陆卫队的巴罗格长官谈谈。你可以在中心找到他。"
  npc_override_que_ba_quests_morocc_now_you_let_me_join_6e8df4: "现在你愿意让我加入大陆卫队了吗？"
  npc_override_que_ba_quests_morocc_now_you_re_front_marius_6c88ee: "现在你站在了马里乌斯面前，炼金术士中的炼金术士。无视我，嗯？来吧，我要揍扁你！"
  npc_override_que_ba_quests_morocc_oh_12769b: "哦，{0}！"
  npc_override_que_ba_quests_morocc_oh_b0ade3: "……哦！"
  npc_override_que_ba_quests_morocc_oh_boy_looks_like_you_4bdb29: "哦，天哪。看来你给我带来了非常非常古老的遗物。"
  npc_override_que_ba_quests_morocc_oh_c_mon_jerk_s_ea1e13: "哦拜托，混蛋。这是真的！！"
  npc_override_que_ba_quests_morocc_oh_i_see_you_re_6efe5d: "哦，我明白了……你是"
  npc_override_que_ba_quests_morocc_oh_i_t_wait_see_3d2151: "哦……我等不及要看惠因特制了……"
  npc_override_que_ba_quests_morocc_oh_mammi_my_mammi_643977: "哦……玛米……我的玛米……"
  npc_override_que_ba_quests_morocc_oh_mammi_oh_e8d70e: "哦……玛米……哦……"
  npc_override_que_ba_quests_morocc_oh_my_god_0b5469: "哦，天哪！"
  npc_override_que_ba_quests_morocc_oh_my_god_i_m_ec8c22: "哦天哪，对不起！非常抱歉！"
  npc_override_que_ba_quests_morocc_oh_now_i_shouldn_t_85903c: "哦，现在，我不应该。"
  npc_override_que_ba_quests_morocc_oh_right_if_you_re_b76429: "哦，对了。如果你对这位作者奥利弗·希尔伯特感兴趣，我建议你也读一读《命运之鸦》的前传 ^3131FF《命运之痕》^000000 以及续作。"
  npc_override_que_ba_quests_morocc_oh_right_you_want_my_793735: "哦，对了！你想要我的签名吗？"
  npc_override_que_ba_quests_morocc_oh_thank_you_so_much_b20d76: "哦，非常感谢你提供如此宝贵的信息！"
  npc_override_que_ba_quests_morocc_oh_well_5f3ea5: "哦，好吧。"
  npc_override_que_ba_quests_morocc_oh_well_whatever_2f9b46: "哦，随便吧。"
  npc_override_que_ba_quests_morocc_oh_world_world_doomed_14b925: "哦，这个世界……这个世界完蛋了……"
  npc_override_que_ba_quests_morocc_oh_you_did_b55884: "哦……你做了？"
  npc_override_que_ba_quests_morocc_oh_you_don_t_even_fa00c2: "哦，你甚至"
  npc_override_que_ba_quests_morocc_oh_you_find_them_corner_f4484b: "哦，你可以在右边房间的角落里找到它们。"
  npc_override_que_ba_quests_morocc_oh_you_just_throw_away_0b0b94: "哦，你可以直接扔掉。它已经没用了。"
  npc_override_que_ba_quests_morocc_oh_you_know_author_40ba4c: "哦，你知道作者？"
