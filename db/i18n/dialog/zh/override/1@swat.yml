Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@swat_HeartHunterWarBase_after_follow_instruction_f01eae: "之后，听从你部队指挥官的指示。一旦基地大门打开，去跟那边的突击部队指挥官谈话，然后开始行动。"
  npc_override_1@swat_HeartHunterWarBase_all_remaining_force_oute_808fda: "外边界所有剩余部队已被清理完毕。"
  npc_override_1@swat_HeartHunterWarBase_any_case_most_operation_3b41bc: "无论如何，大部分行动必须是反人员伤害，并且基地设施应尽可能保持完好。"
  npc_override_1@swat_HeartHunterWarBase_attack_base_detected_eve_0d5297: "检测到对基地的攻击。所有人，开始防御战术。"
  npc_override_1@swat_HeartHunterWarBase_doesn_t_hurt_me_334577: "这伤不了我……"
  npc_override_1@swat_HeartHunterWarBase_enemies_approaching_nd_d_3d9a9a: "敌人正在接近第 2 防御基地。第 2 阶段已宣布。"
  npc_override_1@swat_HeartHunterWarBase_enemies_disabled_third_s_8d5c40: "敌人已禁用第三安全系统。基地防御失败。"
  npc_override_1@swat_HeartHunterWarBase_enemies_reached_section_ba51f0: "敌人已到达第 2 区域。安全系统已禁用。"
  npc_override_1@swat_HeartHunterWarBase_enemies_reached_st_secur_9a1e1b: "敌人已到达第 1 安全系统。安全系统已禁用。"
  npc_override_1@swat_HeartHunterWarBase_enter_door_front_you_03932c: "进入你面前的这道门。"
  npc_override_1@swat_HeartHunterWarBase_entry_also_impossible_if_d7750b: "^ff0000如果纪念地下城尚未作为作战区域创建，则无法进入。^000000"
  npc_override_1@swat_HeartHunterWarBase_explain_situation_me_a4cc66: "向我说明情况。"
  npc_override_1@swat_HeartHunterWarBase_field_operation_check_wh_23919c: "作战区域是 {0}，请确认作战是否正确应用。"
  npc_override_1@swat_HeartHunterWarBase_five_minutes_until_main_529190: "主力部队将在五分钟后到达。"
  npc_override_1@swat_HeartHunterWarBase_give_him_gunpowder_ea936f: "把火药给他"
  npc_override_1@swat_HeartHunterWarBase_goint_outer_boundary_hea_e47c10: "^ff0000在未清除猎心者战争基地的情况下前往外边界是被禁止的。此外，你无法进入已经清除的猎心者战争基地。请检查你的作战点^000000"
  npc_override_1@swat_HeartHunterWarBase_gunpowder_ready_b36ee8: "火药准备好了吗？"
  npc_override_1@swat_HeartHunterWarBase_hey_who_s_there_255907: "嘿，谁在那里？"
  npc_override_1@swat_HeartHunterWarBase_hmm_engineers_need_repai_799abb: "嗯。工程师需要修复被占领的基地。是时候让战斗部队出动了。"
  npc_override_1@swat_HeartHunterWarBase_hmm_good_job_let_us_04d703: "嗯。干得好。让我们离开训练场。通道在楼上。走我身后的楼梯上去。"
  npc_override_1@swat_HeartHunterWarBase_hmm_great_let_s_start_1dc721: "嗯。太好了。我们马上开始。"
  npc_override_1@swat_HeartHunterWarBase_hmm_you_haven_t_received_bf3f07: "嗯，你还没有收到简报？既然时间不够，我简单说明一下。"
  npc_override_1@swat_HeartHunterWarBase_hmm_you_our_troop_since_27ab3b: "嗯，你是我们的部队？既然侦察还没结束，不要在这里随意走动。"
  npc_override_1@swat_HeartHunterWarBase_i_am_executing_my_missio_61ba1a: "我正在与反叛者部队一起执行我的任务。"
  npc_override_1@swat_HeartHunterWarBase_i_got_i_asked_little_65a02d: "我明白了。我问得有点太多了。"
  npc_override_1@swat_HeartHunterWarBase_i_m_ready_7bbf8d: "我准备好了。"
  npc_override_1@swat_HeartHunterWarBase_i_m_talking_your_leader_8b22df: "我现在正在跟你的队长说话，{0}。"
  npc_override_1@swat_HeartHunterWarBase_i_never_push_suspicious_8f99f9: "我从不按可疑的按钮。"
  npc_override_1@swat_HeartHunterWarBase_i_repeat_intruders_detec_f46ae5: "我重复一遍。在限制区域检测到入侵者。猎心者们，加强警戒！"
  npc_override_1@swat_HeartHunterWarBase_i_see_c52c6e: "我明白了。"
  npc_override_1@swat_HeartHunterWarBase_i_see_since_we_hurry_438a02: "我明白了。既然我们很急，请尽快完成准备并告诉我。"
  npc_override_1@swat_HeartHunterWarBase_if_necessary_we_reinforc_3544b9: "如有必要，我们可以利用地形特征来加强火力……但必须尽量减少。"
  npc_override_1@swat_HeartHunterWarBase_if_you_activate_device_t_b234a1: "如果你激活装置，它们会打开一条勉强可以通过的狭窄通道。"
  npc_override_1@swat_HeartHunterWarBase_if_you_deal_monsters_arb_addcd3: "^ff0000如果你在地下城内任意处理怪物，例如驯服怪物，将不被视为正常进度。请注意。^000000"
  npc_override_1@swat_HeartHunterWarBase_if_you_find_enemy_don_044a5a: "如果你发现敌人，别忘了在不向我报告的情况下消灭它。"
  npc_override_1@swat_HeartHunterWarBase_if_you_ready_i_let_af9526: "如果你准备好了，我会告诉你攻击时间。"
  npc_override_1@swat_HeartHunterWarBase_ignore_47715f: "忽略它"
  npc_override_1@swat_HeartHunterWarBase_intruders_detected_deep_6893d0: "在第 3 区域深处检测到入侵者。猎心者们，不惜一切代价保护基地！"
  npc_override_1@swat_HeartHunterWarBase_intruders_detected_restr_f6073c: "在限制区域检测到入侵者。猎心者们，加强警戒！"
  npc_override_1@swat_HeartHunterWarBase_intruders_detected_secti_b27e1c: "在第 2 区域检测到入侵者。猎心者们，加强警戒！"
  npc_override_1@swat_HeartHunterWarBase_julian_we_check_her_litt_40f883: "朱利安，我们得多观察她一会儿……"
  npc_override_1@swat_HeartHunterWarBase_just_thought_96acbc: "只是随便想想。"
  npc_override_1@swat_HeartHunterWarBase_let_me_fcf34b: "让我来。"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_094545: "艾贝尔: 我……正在被处理掉吗？"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_28bed3: "艾贝尔: 那么……"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_2b7abf: "艾贝尔: 抱歉，没有逃跑的可能。"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_37b385: "艾贝尔: 我会阻止他。"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_4dc4e0: "艾贝尔: 想逃跑？"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_505639: "艾贝尔: 那你不是要处理掉我？"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_71a8c2: "艾贝尔: 你刚才用的是什么东西？"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_aa3017: "艾贝尔: 我不记得了。他是来摧毁这个地方的吗？"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_aec004: "艾贝尔: 你为什么不杀我？"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_c4d24b: "艾贝尔: 艾贝尔听从朱利安的指令。"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_caec8c: "艾贝尔: ……你是谁？"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_d5c100: "艾贝尔: 他是来摧毁这个地方的吗？"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_e0cd85: "艾贝尔: 饭……"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_e5ecf4: "艾贝尔: 我错过了……"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_fa80fb: "艾贝尔: 朱利安，那是敌人吗？"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_02f313: "朱利安: 现在，出发！"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_076d35: "朱利安: 和之前一样，请毫不留情地攻击，就像实战一样。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_089576: "朱利安: 这次，战斗中升级的防御部队和大量部队将投入。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_08c171: "朱利安: 这是我们上次抓住的女孩。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_0e2257: "朱利安: 很好。把她关进监狱。她是研究对象，所以要小心处理。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_117c85: "朱利安: 等等！"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_155a04: "朱利安: 捂住耳朵保护鼓膜！我现在要引爆它！"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_1f9441: "朱利安: 既然我们占领了通讯室，实际上就是我们胜利了。我们似乎没有受到太大损失。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_2162e0: "朱利安: 快完成了！坚持住！"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_2bc954: "朱利安: 太简单了吗？在第 2 区域，我们还有歼灭作战训练。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_2c10e2: "朱利安: 第 1 区域已占领。负责第 1 区域防御的人稍后到营房后面集合。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_2c4ac3: "朱利安: 别唠叨了。训练结束了，准备吃饭。该吃饭了。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_2c7a25: "朱利安: 如果你通过狭窄通道并歼灭一半部队，我将判定防御失败。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_31e5ad: "朱利安: 请在剩余的训练中帮助我们。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_3259c3: "朱利安: 太好了。我们已经完成了炸药的制作。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_3dc415: "朱利安: 是的。去换上便装。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_3f1d4d: "朱利安: 如果你操作我面前的控制器，第 3 课程就开始了。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_46f65b: "朱利安: 哦，我们到目前为止进行了多少次训练了？"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_478c40: "朱利安: 我通过广泛安装猎心者家伙的安全系统，构建了一个自动防御系统。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_4a4990: "朱利安: 你上去检查一下是否有剩余部队或威胁。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_4b5973: "朱利安: 我不想同时杀死我们自己的人。而且……你对我们来说是一股未知的力量"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_4c2f09: "朱利安: 嘿！我会从远处支援你。坚持到那时候！"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_4e583e: "朱利安: 太好了。我们前进吧。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_50d32d: "朱利安: 你在说什么？处理只适用于机器。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_5119b7: "朱利安: 该死，逃跑会很困难。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_51d41a: "朱利安: 太好了。干得好，艾贝尔。不，别踢那条狗……他不是敌人。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_559727: "朱利安: 你可能会觉得这个地方很陌生。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_5ab533: "朱利安: 什么？剩余部队？"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_5c5474: "朱利安: 但我觉得艾贝尔没有使用 100% 的力量。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_5d23a8: "朱利安: 我们的主力部队到达还有一些时间。保持警惕，待命。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_5f1d9d: "朱利安: 现在，让我把他们炸飞！"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_621fc3: "朱利安: 目标是看看当我们将自动装置和部队一起用于防御战术时，如何阻挡敌人。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_629009: "朱利安: 你轻松歼灭了第 2 区域的升级部队。我最好改变我们的防御战术。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_63c881: "朱利安: 我们不知道她是谁，来自哪里。我们只知道她的名字，艾贝尔……"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_68a774: "朱利安: 别担心这个地方。我可以用剩余的火药处理它。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_6e0907: "朱利安: 她处于一种如此机械化的状态，很难在她身上看到人类的影子。但她不会攻击任何人，除非被判定为敌人。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_6e8fb4: "朱利安: 这可能是最后一个安全系统。但我们没有火药了。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_70ce0e: "朱利安: 战斗可能在你寻找火药时就开始了。做好准备。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_783db0: "朱利安: 嗯，不错的火药。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_843ad9: "朱利安: 前面有一个正在运行的安全系统。如果你再往前一步，就会被子弹打成筛子。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_871ad8: "朱利安: 让我先走。我必须处理前面的障碍。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_874e92: "朱利安: 根据估计，这里应该有个问候。但什么都没有。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_903d5a: "朱利安: 附近可能有狙击手，所以不要聚集。单独完成任务。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_94ae8a: "朱利安: 没有任何先前的记忆或理智，她只剩下保护基地的意图。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_954f45: "朱利安: 我不是想低估你的战斗能力"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_966bb9: "朱利安: 这是一种防御训练。是为了了解我们需要多少力量来防御这个区域。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_9cbbf8: "朱利安: 我们从一开始就遇到麻烦了。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_9d5271: "朱利安: 你必须帮我找出她的潜在能力。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_a1e66a: "朱利安: 虽然我们不能用它来移动我们的部队，但这是一个体验模拟战斗的完美地点。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_a840d0: "朱利安: 现在，请毫不留情地攻击，就像实战一样。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_a8e0c9: "朱利安: 顺便说一下，你面前留下的防御装置将与你之前面对的那些大不相同。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_a96fc7: "朱利安: 所以我们把它改造成了一个训练场，可以进行与之前战斗类似的模拟战斗。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_ba813a: "朱利安: 从这里开始，我们分开行动。我们每个人都会找到弱点并歼灭敌人。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_c13a78: "朱利安: 太好了！离她远点！让我给她来一下狠的！"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_c8fdd4: "朱利安: 别磨蹭了，出发"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_cc5d2f: "朱利安: 这足以清除安全系统和刚才冲过来的猎心者家伙。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_d4f691: "朱利安: 稍等一下。我正在准备压制她"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_d6508b: "朱利安: 我们必须为清理部队确保一条通路。在附近找火药。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_d6dccc: "朱利安: 现在躲避敌人！她不是普通人。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_d7166d: "朱利安: 太好了。我们现在走吧！"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_d89695: "朱利安: 嗯，看起来他们已经和我们分散的成员开战了。我们可能很快就会有危险。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_dd39f5: "朱利安: 很高兴你们都安全。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_e1d96f: "朱利安: 有东西来了！！躲避！！"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_e53b33: "朱利安: 嗯……算是吧。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_e59859: "朱利安: 我们占领的区域后面有一个相当大的空间。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_e6bd7b: "朱利安: 你们将扮演入侵者的角色。我们的部队将伪装成猎心者进行防御。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_e90b7c: "朱利安: 哦，你面前的人只是暂时的敌人。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_eeb9a2: "朱利安: 艾贝尔~ 你上次跟这家伙交手过。你还记得吗？"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_ef328a: "朱利安: 我们必须活捉你，并查明你的身份。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_f39f9e: "朱利安: 嗯。干得好。让我们离开训练场。通道在楼上。走我身后的楼梯上去。"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_fef0c8: "朱利安: 这是麻痹射击。当它击中某人时，会造成神经系统混乱。"
  npc_override_1@swat_HeartHunterWarBase_menu_options_720bb4: "???: 谁在那里……？"
  npc_override_1@swat_HeartHunterWarBase_menu_security_7f3b9a: "安全系统: 紧急情况已解除。终止自动防御装置。"
  npc_override_1@swat_HeartHunterWarBase_menu_security_f42165: "安全系统: 紧急情况第 2 阶段已宣布。自动防御装置已激活。"
  npc_override_1@swat_HeartHunterWarBase_menu_voice_073ae0: "语音通讯: 我们已占领猎心者的通讯室。战斗似乎已经结束。所有部队成员防守已占领的据点，待命。"
  npc_override_1@swat_HeartHunterWarBase_msg_04aa49: "-----------------------"
  npc_override_1@swat_HeartHunterWarBase_msg_6eae3a: "……"
  npc_override_1@swat_HeartHunterWarBase_msg_e78ceb: "---------------------"
  npc_override_1@swat_HeartHunterWarBase_no_don_t_look_me_6f3421: "不，别那样看着我。这个女孩从不跟其他男人说话。所以我就负责照顾她了。"
  npc_override_1@swat_HeartHunterWarBase_oh_isn_t_first_time_1149a1: "哦，这不是我第一次告诉你这个吗？如果你能检查一下设施，我会很高兴的。你觉得呢？"
  npc_override_1@swat_HeartHunterWarBase_once_we_ready_operation_4bf5c5: "一旦我们准备好行动，你就和我一起进去。"
  npc_override_1@swat_HeartHunterWarBase_only_party_leader_talk_j_723ba1: "^ff0000只有队伍队长可以详细跟朱利安谈话。^000000"
  npc_override_1@swat_HeartHunterWarBase_open_soon_once_gate_base_a5d966: "很快会打开。一旦基地大门打开，去跟那边的突击部队指挥官谈话，然后开始行动。"
  npc_override_1@swat_HeartHunterWarBase_our_advance_party_secure_948171: "我们的先遣队已经 securing 了南部基地的边界。我们将走那条路前往中心区域。每个突击部队将走各自的路线。"
  npc_override_1@swat_HeartHunterWarBase_party_entering_d3d912: "队伍 {1} 的 {0} 正在进入 {2}。"
  npc_override_1@swat_HeartHunterWarBase_place_dangerous_you_must_acfbd0: "这个地方很危险，你必须尽快离开。我们靠近敌人基地。"
  npc_override_1@swat_HeartHunterWarBase_push_b69d1c: "^ff0000[不要按]^000000"
  npc_override_1@swat_HeartHunterWarBase_red_button_e64a36: "红色按钮。"
  npc_override_1@swat_HeartHunterWarBase_remaining_defensive_forc_be02db: "剩余防御部队 {0}%"
  npc_override_1@swat_HeartHunterWarBase_remaining_heart_hunter_23dff6: "剩余 {0} 猎心者"
  npc_override_1@swat_HeartHunterWarBase_s_real_ad3a6d: "……是真的。"
  npc_override_1@swat_HeartHunterWarBase_sake_mobility_we_abandon_d8fa15: "为了机动性，我们放弃了重型武器。由于我们的首要任务是在不造成太大破坏的情况下占领基地，大部分爆炸性武器也被排除了。"
  npc_override_1@swat_HeartHunterWarBase_security_system_here_con_e7fa62: "这里的安全系统控制着那边的许多系统装置。"
  npc_override_1@swat_HeartHunterWarBase_seems_like_adventurer_wi_c2586e: "^0000ff看起来没有所属部队（队伍）的冒险者无法进入。^000000"
  npc_override_1@swat_HeartHunterWarBase_seems_like_base_been_arr_aac834: "^0000ff看起来基地内部已经布置好了。^000000"
  npc_override_1@swat_HeartHunterWarBase_sounds_cool_you_like_for_703078: "听起来很酷。你就像外籍军团一样，所以行动期间待在我身边。"
  npc_override_1@swat_HeartHunterWarBase_stop_812f80: "停下。"
  npc_override_1@swat_HeartHunterWarBase_stop_which_unit_you_acco_985243: "停下，你是哪个部队的？根据你的回答，我们可能不得不使用武力镇压你。"
  npc_override_1@swat_HeartHunterWarBase_takes_some_time_assembli_140bdc: "组装炸药需要一些时间。你上去检查一下是否有威胁。"
  npc_override_1@swat_HeartHunterWarBase_there_broad_vacant_land_9cd8c0: "在我们占领的基地外边界有一片宽阔的空地。我们在那里建了一个训练场，但设施不完善。我需要精英人员来检查它。"
  npc_override_1@swat_HeartHunterWarBase_there_intruder_restricte_fc52c0: "限制区域有入侵者。所有部队成员集合。"
  npc_override_1@swat_HeartHunterWarBase_there_warning_written_re_90ea0b: "有一个用红色写的警告。"
  npc_override_1@swat_HeartHunterWarBase_took_me_more_than_week_5fe373: "花了我一个多星期才能跟她说话。现在她说话很好了。"
  npc_override_1@swat_HeartHunterWarBase_unknown_error_occurred_58bda4: "发生了未知错误。"
  npc_override_1@swat_HeartHunterWarBase_unless_you_activate_devi_1fb1ad: "除非你激活装置，否则防御训练不会开始。准备好后激活它。"
  npc_override_1@swat_HeartHunterWarBase_wait_while_we_proceed_on_09fc30: "请稍等 {0}，你的部队队长来了我们就继续。"
  npc_override_1@swat_HeartHunterWarBase_way_did_you_receive_brie_e3cf3a: "顺便问一下，你收到朱利安将军的简报了吗？收到简报后再回来。"
  npc_override_1@swat_HeartHunterWarBase_we_arranging_situation_i_528036: "我们正在整理基地内部的情况。还不能让你进去。"
  npc_override_1@swat_HeartHunterWarBase_we_arranging_situation_i_562852: "我们正在整理基地内部的情况。你还不能进去。"
  npc_override_1@swat_HeartHunterWarBase_we_don_t_enough_forces_74cca3: "我们没有足够的兵力来攻击基地。"
  npc_override_1@swat_HeartHunterWarBase_we_don_t_time_joke_fc24a9: "我们没有时间开玩笑"
  npc_override_1@swat_HeartHunterWarBase_we_just_sneak_like_we_5c367f: "我们可以就这样溜进去。但我们最好为清理部队确保一条通路。我们该怎么做？"
  npc_override_1@swat_HeartHunterWarBase_we_something_as_last_res_d983ec: "如果我们未能防御基地，我们还有最后的手段。现在是测试它的时候了。"
  npc_override_1@swat_HeartHunterWarBase_weak_d767fa: "弱……"
  npc_override_1@swat_HeartHunterWarBase_well_doesn_t_matter_you_a94736: "好吧，没关系。你应该对这里的情况有个大致了解。只要记住这不是一件容易的事。"
  npc_override_1@swat_HeartHunterWarBase_when_your_progress_diffe_8f2bf0: "^ff0000这是当你的进度与队伍队长或队伍成员不同时。在这种情况下，找另一个可以和你一起去同一个地方的队伍成员。^000000"
  npc_override_1@swat_HeartHunterWarBase_where_did_you_learn_tech_dda7d2: "你刚才用的技巧是从哪里学来的？"
  npc_override_1@swat_HeartHunterWarBase_why_they_all_coming_out_21c808: "他们怎么突然都出来了。把火药给我"
  npc_override_1@swat_HeartHunterWarBase_yes_7b21e8: "是的，就是这样。"
  npc_override_1@swat_HeartHunterWarBase_yes_ee33f3: "是的！"
  npc_override_1@swat_HeartHunterWarBase_you_augmentation_force_s_8d6d7a: "你是攻击猎心者基地的增援部队吗？我想我们之前见过。"
  npc_override_1@swat_HeartHunterWarBase_you_been_toilet_i_lookin_001eb3: "你去厕所了吗？我一直在找你。"
  npc_override_1@swat_HeartHunterWarBase_you_close_enough_call_he_c942ab: "你跟她熟到可以叫她的名字了吗？"
  npc_override_1@swat_HeartHunterWarBase_you_deserter_wandering_a_20c0de: "你是一个没有固定位置的逃兵吗？"
  npc_override_1@swat_HeartHunterWarBase_you_enemy_our_troop_whic_ea219b: "你……敌人？我们的部队？你站在哪一边？"
  npc_override_1@swat_HeartHunterWarBase_you_ignored_button_stepp_2a57b1: "你无视了按钮并退了回去。什么都没发生。"
  npc_override_1@swat_HeartHunterWarBase_you_like_foreign_legion_ee5188: "你就像外籍军团一样，所以行动期间待在我身边。还有问题吗？当然，即使你有，我也不会回答。"
  npc_override_1@swat_HeartHunterWarBase_you_my_companion_enemy_w_e739a3: "你是我的同伴？还是敌人？你站在哪一边？"
  npc_override_1@swat_HeartHunterWarBase_you_safely_passed_sectio_de26f5: "你安全通过了第 1 区域。现在帮助我们进行第 2 区域的防御训练。"
  npc_override_1@swat_HeartHunterWarBase_you_see_unusually_attrac_94989b: "你可以看到一个异常吸引人的"
  npc_override_1@swat_HeartHunterWarBase_you_slow_2d5afb: "你……太慢了。"
  npc_override_1@swat_HeartHunterWarBase_you_you_re_stronger_than_1a1778: "你……你比我强。我从未经历过这种情况……"
  npc_override_1@swat_HeartHunterWarBase_your_first_visit_here_f94f4b: "{0}，这是你第一次来这里吗？"

