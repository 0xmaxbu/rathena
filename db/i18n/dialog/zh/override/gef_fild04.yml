Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_gef_fild04_quest_pupa_amazing_you_found_so_man_d25b96: "真了不起，你这么快就找到了这么多。"
  npc_override_gef_fild04_quest_pupa_any_progress_you_ve_made_b3e247: "你取得的任何进度都将被清除"
  npc_override_gef_fild04_quest_pupa_hmm_i_don_t_think_16ac8a: "嗯，我觉得你还没有消灭 50 只虫蛹……"
  npc_override_gef_fild04_quest_pupa_hmm_i_don_t_think_c8a55e: "嗯，我觉得你还没有消灭 100 只虫蛹……"
  npc_override_gef_fild04_quest_pupa_hmm_i_don_t_think_eac787: "嗯，我觉得你还没有消灭 150 只虫蛹……"
  npc_override_gef_fild04_quest_pupa_how_many_you_like_get_3e24fe: "你想消灭多少只？"
  npc_override_gef_fild04_quest_pupa_i_know_i_could_ve_ba293e: "我知道我本可以自己做这件事，但一直站在这里并不容易。"
  npc_override_gef_fild04_quest_pupa_i_need_chrysalis_ea53a3: "我需要 ^00CE0025 个蛹壳^000000。"
  npc_override_gef_fild04_quest_pupa_i_need_chrysalis_no_less_621bc4: "我需要 ^00CE0025 个蛹壳^000000，一个也不能少。"
  npc_override_gef_fild04_quest_pupa_if_you_change_your_mind_3f2210: "如果你改变主意，请回来。"
  npc_override_gef_fild04_quest_pupa_if_you_get_rid_those_422601: "如果你能消灭这片区域的 150 只虫蛹，我会很感激。"
  npc_override_gef_fild04_quest_pupa_if_you_get_rid_those_abe57f: "如果你能消灭这片区域的 100 只虫蛹，我会很感激。"
  npc_override_gef_fild04_quest_pupa_if_you_get_rid_those_db8d3b: "如果你能消灭这片区域的 50 只虫蛹，我会很感激。"
  npc_override_gef_fild04_quest_pupa_lets_honest_you_pretties_e0a239: "说实话，你也不是我见过的最漂亮的面孔。"
  npc_override_gef_fild04_quest_pupa_like_i_promised_give_me_133e0e: "正如我承诺的，把蛹壳给我，我会用我的智慧来回报你。"
  npc_override_gef_fild04_quest_pupa_menu_gather_c0af3a: "收集道具：消灭虫蛹：取消"
  npc_override_gef_fild04_quest_pupa_menu_i_8b4a09: "我有蛹壳：你需要什么？"
  npc_override_gef_fild04_quest_pupa_menu_pupa_7dcfa6: "50 只虫蛹：100 只虫蛹：150 只虫蛹"
  npc_override_gef_fild04_quest_pupa_menu_sure_fa2cd4: "当然，我不介意：不"
  npc_override_gef_fild04_quest_pupa_menu_yes_141459: "是：否"
  npc_override_gef_fild04_quest_pupa_menu_yes_755efb: "是：否：我想放弃"
  npc_override_gef_fild04_quest_pupa_new_here_you_4d7fad: "你是新来的吧？"
  npc_override_gef_fild04_quest_pupa_none_less_my_daughter_th_aa3c7e: "不过，我的女儿觉得在这片田野周围收集虫蛹很有趣，现在变得不太雅观了。"
  npc_override_gef_fild04_quest_pupa_oh_thank_you_so_much_fcb780: "哦，太感谢你了。"
  npc_override_gef_fild04_quest_pupa_ok_then_well_come_back_0e1574: "那好吧，如果你改变主意就回来。"
  npc_override_gef_fild04_quest_pupa_please_return_me_when_yo_1cbb99: "等你再强一点的时候再来找我。"
  npc_override_gef_fild04_quest_pupa_really_what_you_like_hel_c8760f: "真的吗？你想帮我做什么？"
  npc_override_gef_fild04_quest_pupa_remember_get_rid_those_p_81c5e4: "记住，消灭 100 只虫蛹。"
  npc_override_gef_fild04_quest_pupa_remember_get_rid_those_p_85e3ab: "记住，消灭 50 只虫蛹。"
  npc_override_gef_fild04_quest_pupa_remember_get_rid_those_p_9967d1: "记住，消灭 150 只虫蛹。"
  npc_override_gef_fild04_quest_pupa_thank_you_so_much_093766: "太感谢你了！"
  npc_override_gef_fild04_quest_pupa_well_look_i_like_helping_af3806: "好吧，我喜欢帮助这里的新面孔。"
  npc_override_gef_fild04_quest_pupa_you_collect_chrysalis_re_2b6f53: "你能收集 ^00CE0025 个蛹壳^000000 带回来给我吗？我保证会好好报答你。"
  npc_override_gef_fild04_quest_pupa_you_could_probably_easil_b82a40: "你本可以轻松帮我，但我想把机会让给那些不如你强大的人。"
  npc_override_gef_fild04_quest_pupa_you_gotten_rid_pupa_5ab6d7: "你消灭虫蛹了吗？"
  npc_override_gef_fild04_quest_pupa_you_mind_helping_me_get_792ee6: "你介意帮我消灭一些虫蛹来清理这片田野吗？"
  npc_override_gef_fild04_quest_pupa_you_sure_you_want_stop_507e20: "你确定要停止狩猎吗？"
