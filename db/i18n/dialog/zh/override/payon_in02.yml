Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_payon_in02_archer_ah_items_arrived_product_205974: "啊，生产部送来的道具到了。给你！这些都是你的！"
  npc_override_payon_in02_archer_ah_you_must_been_be46e3: "啊，你一定是"
  npc_override_payon_in02_archer_alright_see_you_later_988307: "好的，回头见。"
  npc_override_payon_in02_archer_although_archer_ragnarok_5073cc: "虽然在仙境传说中弓箭手的生命值较低，但他或她拥有极高的命中率和攻击速度，因此可以在怪物靠近之前将其击杀。"
  npc_override_payon_in02_archer_although_archer_weaker_h_26fd83: "虽然弓箭手的生命值较低，但他或她可以从远距离射击敌人，"
  npc_override_payon_in02_archer_although_there_s_no_spec_8d7afd: "虽然没有特别的"
  npc_override_payon_in02_archer_archer_change_jobs_hunte_941885: "^8C2121弓箭手可以转职为猎人。^000000"
  npc_override_payon_in02_archer_archer_skills_using_bow_9f8188: "弓箭手拥有使用弓箭的技能，并且具备各种天赋。"
  npc_override_payon_in02_archer_because_archer_needs_ext_a4567f: "因为弓箭手需要极高的专注力，所以我们不接受缺乏耐心的人。"
  npc_override_payon_in02_archer_before_didn_t_you_427cbd: "之前，不是吗？"
  npc_override_payon_in02_archer_bye_e17e76: "再见。"
  npc_override_payon_in02_archer_congratulations_you_now_6398af: "恭喜你！你现在是一名弓箭手了！同时，希望你积极参与弓箭手公会复兴的各项活动。"
  npc_override_payon_in02_archer_err_cb8e49: "呃……"
  npc_override_payon_in02_archer_greatest_ability_archer_e1492b: "弓箭手最大的能力是从远距离攻击敌人。"
  npc_override_payon_in02_archer_haha_you_kidding_me_acaa42: "哈哈，你在开玩笑吧……"
  npc_override_payon_in02_archer_having_bow_arrows_now_yo_98fdae: "拥有了弓和箭，你现在成为了一名真正的弓箭手。"
  npc_override_payon_in02_archer_hey_i_know_you_141307: "嘿，我认识你。"
  npc_override_payon_in02_archer_hey_what_64dbe3: "嘿，你在"
  npc_override_payon_in02_archer_hm_so_you_now_ready_e795d6: "'……嗯~~看来你已经准备好成为一名弓箭手了。我这就为你办理转职手续。'"
  npc_override_payon_in02_archer_i_feel_sorry_only_novice_97f86a: "很抱歉，但只有初心者才能转职。"
  npc_override_payon_in02_archer_i_know_you_ll_make_c20aca: "我知道你会成为一名出色的弓箭手……"
  npc_override_payon_in02_archer_i_tell_you_re_cut_57a41c: "我能看出来你不适合当弓箭手。总感觉你更适合做"
  npc_override_payon_in02_archer_if_you_any_questions_fee_14c044: "如果你有任何问题，随时可以来问我。"
  npc_override_payon_in02_archer_if_you_open_arrow_contai_73fe5a: "如果你打开箭筒，里面会有箭矢，然后你就可以装备它们了。"
  npc_override_payon_in02_archer_menu_i_baa458: "我想成为弓箭手。:请告诉我转职要求。:没什么，谢谢。"
  npc_override_payon_in02_archer_need_say_anything_else_42b3b2: "还有什么好说的。"
  npc_override_payon_in02_archer_nice_meet_you_how_may_e45c8c: "很高兴见到你。有什么可以帮到你的吗？"
  npc_override_payon_in02_archer_oh_6a4011: "哦……？"
  npc_override_payon_in02_archer_other_than_hunter_if_you_a0edb3: "^8C2121除了猎人之外，如果你是男性，可以转职为吟游诗人；如果你是女性，可以转职为舞娘。^000000"
  npc_override_payon_in02_archer_reward_you_time_i_hope_2f2fe5: "这次给你的奖励，希望你能理解。照顾好自己。"
  npc_override_payon_in02_archer_so_archer_safer_real_bat_4f5389: "所以弓箭手在真正的战斗中更安全。"
  npc_override_payon_in02_archer_something_else_ded8a4: "别的什么……"
  npc_override_payon_in02_archer_valhalla_been_reborn_df8050: "前往瓦尔哈拉并转生。"
  npc_override_payon_in02_archer_well_i_expect_hear_bette_9b2be7: "好了，我期待听到你的好消息。是时候说再见了。"
  npc_override_payon_in02_archer_well_then_i_don_t_32ed7c: "那好吧。我不"
  npc_override_payon_in02_archer_well_you_re_right_skill_80fff4: "嗯，你的技能等级还不够。"
  npc_override_payon_in02_archer_wow_s_so_impressive_a84468: "哇，太厉害了！"
  npc_override_payon_in02_archer_you_already_your_own_dec_9744dc: "你已经有不错的职业了，不是吗？"
  npc_override_payon_in02_archer_you_d_better_learn_all_6e6cc8: "你最好先学会所有基础技能，然后才能成为弓箭手。"
  npc_override_payon_in02_archer_you_doing_here_03ba8a: "你来这里……？"
  npc_override_payon_in02_archer_you_right_e12152: "你是……{0}，对吧？"
  npc_override_payon_in02_archer_you_took_test_af2996: "你参加了这个测试"
  npc_override_payon_in02_archer_your_basic_skill_now_eno_ca7f9e: "你的基础技能等级已经足够了……"
  npc_override_payon_in02_archer_your_job_level_must_leas_ddbcdb: "你的Job等级必须至少达到^4A4AFF10^000000，且基础技能等级应达到^4A4AFF9级"
