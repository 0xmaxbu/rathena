Body:

  npc_override_payon_in02_archer_ah_items_arrived_product_205974: "啊，生产部送来的道具到了。给你！这些都是你的！"
  npc_override_payon_in02_archer_ah_you_must_been_be46e3: "啊，你一定是"
  npc_override_payon_in02_archer_ah_your_bow_arrived_bow_8e6838: "啊，你的弓已经从弓制作部送来了。来，拿着！它是你的～"
  npc_override_payon_in02_archer_alright_let_me_check_d38fc5: "好吧，让我检查一下。"
  npc_override_payon_in02_archer_alright_see_you_later_988307: "好的，回头见。"
  npc_override_payon_in02_archer_although_archer_ragnarok_5073cc: "虽然在仙境传说中弓箭手的生命值较低，但他或她拥有极高的命中率和攻击速度，因此可以在怪物靠近之前将其击杀。"
  npc_override_payon_in02_archer_although_archer_weaker_h_26fd83: "虽然弓箭手的生命值较低，但他或她可以从远距离射击敌人，"
  npc_override_payon_in02_archer_although_there_s_no_spec_8d7afd: "虽然没有特别的"
  npc_override_payon_in02_archer_anyway_whatever_you_you_461304: "无论如何，无论你是什么，你不能选择弓箭手作为职业，因为你已经有职业了。"
  npc_override_payon_in02_archer_archer_change_jobs_hunte_941885: "^8C2121弓箭手可以转职为猎人。^000000"
  npc_override_payon_in02_archer_archer_needs_extremely_h_6c9f2b: "弓箭手需要极高的专注力和反应速度，所以我们不接受那些缺乏耐心的人。"
  npc_override_payon_in02_archer_archer_skills_using_bow_9f8188: "弓箭手拥有使用弓箭的技能，并且具备各种天赋。"
  npc_override_payon_in02_archer_because_archer_needs_ext_a4567f: "因为弓箭手需要极高的专注力，所以我们不接受缺乏耐心的人。"
  npc_override_payon_in02_archer_before_didn_t_you_427cbd: "之前，不是吗？"
  npc_override_payon_in02_archer_but_2e7fce: "但是……"
  npc_override_payon_in02_archer_bye_e17e76: "再见。"
  npc_override_payon_in02_archer_congratulations_36b252: "恭喜！"
  npc_override_payon_in02_archer_congratulations_you_now_6398af: "恭喜你！你现在是一名弓箭手了！同时，希望你积极参与弓箭手公会复兴的各项活动。"
  npc_override_payon_in02_archer_course_we_expect_you_hel_3545b1: "当然，我们期望你能用你的努力帮助弓箭手公会的未来。"
  npc_override_payon_in02_archer_err_cb8e49: "呃……"
  npc_override_payon_in02_archer_excellent_80519c: "太棒了！"
  npc_override_payon_in02_archer_excellent_congratulation_ff2082: "太棒了！恭喜！"
  npc_override_payon_in02_archer_first_all_you_job_level_b23737: "首先，你必须作为初学者达到Job等级9，并学会所有基础技能。"
  npc_override_payon_in02_archer_good_day_how_may_i_9e89da: "日安。我能怎么帮你？"
  npc_override_payon_in02_archer_greatest_ability_archer_e1492b: "弓箭手最大的能力是从远距离攻击敌人。"
  npc_override_payon_in02_archer_haha_you_kidding_me_acaa42: "哈哈，你在开玩笑吧……"
  npc_override_payon_in02_archer_having_bow_arrows_now_yo_98fdae: "拥有了弓和箭，你现在成为了一名真正的弓箭手。"
  npc_override_payon_in02_archer_hey_i_know_you_141307: "嘿，我认识你。"
  npc_override_payon_in02_archer_hey_what_64dbe3: "嘿，你在"
  npc_override_payon_in02_archer_hm_so_you_now_ready_e795d6: "'……嗯~~看来你已经准备好成为一名弓箭手了。我这就为你办理转职手续。'"
  npc_override_payon_in02_archer_hmm_9c4d28: "嗯……"
  npc_override_payon_in02_archer_i_appraise_value_various_be5539: "我会评估你带来的各种树干的价值，这些是制作弓所需的。"
  npc_override_payon_in02_archer_i_explain_requirements_b_31b8b7: "我会解释成为弓箭手的要求。"
  npc_override_payon_in02_archer_i_feel_sorry_only_novice_97f86a: "很抱歉，但只有初心者才能转职。"
  npc_override_payon_in02_archer_i_know_you_ll_make_c20aca: "我知道你会成为一名出色的弓箭手……"
  npc_override_payon_in02_archer_i_ll_transfer_these_trun_936582: "我会把这些树干转交给我们的弓制作部。既然你已经满足了要求，让我立刻晋升你！"
  npc_override_payon_in02_archer_i_tell_you_re_cut_57a41c: "我能看出来你不适合当弓箭手。总感觉你更适合做"
  npc_override_payon_in02_archer_i_understand_my_guest_if_2c4d02: "我理解。如果你想看看要求，请便。"
  npc_override_payon_in02_archer_if_so_you_need_fill_797fdb: "如果是这样，你需要填写这份申请表。"
  npc_override_payon_in02_archer_if_you_any_questions_fee_14c044: "如果你有任何问题，随时可以来问我。"
  npc_override_payon_in02_archer_if_you_open_arrow_contai_73fe5a: "如果你打开箭筒，里面会有箭矢，然后你就可以装备它们了。"
  npc_override_payon_in02_archer_if_you_think_you_ve_c8e9ea: "如果你认为你已经满足了，我们现在可以检查一下。"
  npc_override_payon_in02_archer_less_than_you_get_grade_0a2eab: "不到25！？你必须至少得到25分！来吧，再努力一点！"
  npc_override_payon_in02_archer_let_s_see_1f0bb6: "让我看看……"
  npc_override_payon_in02_archer_menu_apply_6b4a4c: "申请。:取消"
  npc_override_payon_in02_archer_menu_grade_66b72a: " S级 : {0} 个, 等级: {1} . "
  npc_override_payon_in02_archer_menu_grade_846221: " A级 : {0} 个, 等级 : {1} . "
  npc_override_payon_in02_archer_menu_grade_c35f13: " B级 : {0} 个, 等级 : {1} . "
  npc_override_payon_in02_archer_menu_grade_cb8844: " C级 : {0} 个, 等级 : {1} . "
  npc_override_payon_in02_archer_menu_i_baa458: "我想成为弓箭手。:请告诉我转职要求。:没什么，谢谢。"
  npc_override_payon_in02_archer_menu_total_b9b289: "总等级: ^FF0000{0}^000000 / 40"
  npc_override_payon_in02_archer_menu_yes_668f8f: "是的，我是。:不，还没有。"
  npc_override_payon_in02_archer_more_than_nice_job_64c0e3: "超过30！干得好！"
  npc_override_payon_in02_archer_need_say_anything_else_42b3b2: "还有什么好说的。"
  npc_override_payon_in02_archer_nice_meet_you_how_may_e45c8c: "很高兴见到你。有什么可以帮到你的吗？"
  npc_override_payon_in02_archer_now_off_you_go_hunt_b30281: "现在，去吧。带着骄傲去狩猎，知道你是由最优秀的人之一训练的！"
  npc_override_payon_in02_archer_now_then_637e96: "那么，"
  npc_override_payon_in02_archer_oh_6a4011: "哦……？"
  npc_override_payon_in02_archer_okay_sign_here_alright_u_d26f39: "好吧，在这里签字。好吧，嗯，一旦你满足了要求，我就晋升你。"
  npc_override_payon_in02_archer_order_become_archer_you_691f48: "为了成为弓箭手，你必须在40分中获得至少^0000FF25^000000分。你可以从「柳树」，那棵树身上获得树干。不过要小心。它们可能是强硬的怪物。"
  npc_override_payon_in02_archer_other_than_hunter_if_you_a0edb3: "^8C2121除了猎人之外，如果你是男性，可以转职为吟游诗人；如果你是女性，可以转职为舞娘。^000000"
  npc_override_payon_in02_archer_reward_you_time_i_hope_2f2fe5: "这次给你的奖励，希望你能理解。照顾好自己。"
  npc_override_payon_in02_archer_see_you_next_time_fea506: "下次见。"
  npc_override_payon_in02_archer_sigh_well_you_just_barel_78e3c9: "*叹气* 好吧，你勉强通过了……无论如何，干得好。"
  npc_override_payon_in02_archer_so_archer_safer_real_bat_4f5389: "所以弓箭手在真正的战斗中更安全。"
  npc_override_payon_in02_archer_so_yeah_no_real_reason_f916cd: "所以……是啊……没有真正的理由告诉你要求……"
  npc_override_payon_in02_archer_something_else_ded8a4: "别的什么……"
  npc_override_payon_in02_archer_um_b716d0: "嗯……"
  npc_override_payon_in02_archer_unfortunately_you_didn_t_430406: "不幸的是，你没有带来任何所需物品。我没有什么可以评估的。"
  npc_override_payon_in02_archer_valhalla_been_reborn_df8050: "前往瓦尔哈拉并转生。"
  npc_override_payon_in02_archer_wait_second_you_ve_chose_4207bf: "等一下。你已经选择了不同的职业。你不需要知道这个～"
  npc_override_payon_in02_archer_well_alright_ec4e13: "好吧，好吧。"
  npc_override_payon_in02_archer_well_i_expect_hear_bette_9b2be7: "好了，我期待听到你的好消息。是时候说再见了。"
  npc_override_payon_in02_archer_well_then_i_don_t_32ed7c: "那好吧。我不"
  npc_override_payon_in02_archer_well_you_re_right_job_22bb34: "好吧，你的职业等级不对。请再检查一下要求。"
  npc_override_payon_in02_archer_well_you_re_right_skill_80fff4: "嗯，你的技能等级还不够。"
  npc_override_payon_in02_archer_wow_more_than_009636: "哇！超过40！"
  npc_override_payon_in02_archer_wow_s_so_impressive_a84468: "哇，太厉害了！"
  npc_override_payon_in02_archer_you_a2f86b: "你是……{0}吗？"
  npc_override_payon_in02_archer_you_already_your_own_dec_9744dc: "你已经有不错的职业了，不是吗？"
  npc_override_payon_in02_archer_you_also_gather_trunks_t_e9cb4b: "你还必须收集^FF0000树干^000000。有4种不同类型的树干，每种质量不同。根据它们的质量，你会获得不同的等级。"
  npc_override_payon_in02_archer_you_d_better_learn_all_6e6cc8: "你最好先学会所有基础技能，然后才能成为弓箭手。"
  npc_override_payon_in02_archer_you_doing_here_03ba8a: "你来这里……？"
  npc_override_payon_in02_archer_you_don_t_look_much_0d3e65: "你看起来一点也不像初学者……"
  npc_override_payon_in02_archer_you_now_archer_a487fe: "你现在是一名弓箭手！"
  npc_override_payon_in02_archer_you_re_already_archer_yo_8138e5: "你已经是弓箭手了。你应该已经知道这些了……"
  npc_override_payon_in02_archer_you_ready_b68a42: "你准备好了吗？"
  npc_override_payon_in02_archer_you_right_e12152: "你是……{0}，对吧？"
  npc_override_payon_in02_archer_you_took_test_af2996: "你参加了这个测试"
  npc_override_payon_in02_archer_you_ve_already_become_ar_c1ef7a: "你已经成为弓箭手了……"
  npc_override_payon_in02_archer_you_want_archer_cd3449: "你想成为弓箭手吗？"
  npc_override_payon_in02_archer_your_basic_skill_now_eno_ca7f9e: "你的基础技能等级已经足够了……"
  npc_override_payon_in02_archer_your_job_level_must_leas_b64032: "你的职业等级必须至少为10，别忘了你应该学会所有基础技能。完成后，再回来。"
  npc_override_payon_in02_archer_your_job_level_must_leas_ddbcdb: "你的Job等级必须至少达到^4A4AFF10^000000，且基础技能等级应达到^4A4AFF9级"
