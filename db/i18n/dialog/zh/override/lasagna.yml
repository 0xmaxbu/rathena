  npc_override_lasagna_lasagna_npcs_whatever_well_good_i_ll_e7acea: "Whatever it is. Well, good. I'll assign your first mission as your first practice."
  npc_override_lasagna_lasagna_npcs_when_bow_tie_made_ll_646dde: "When the bow tie is made, It'll be embroidered with your name and hung on the wall of the Vigilante office."
  npc_override_lasagna_lasagna_npcs_when_did_we_eat_because_42a76a: "When did we eat because we wanted to? It was more like eating because it was there."
  npc_override_lasagna_lasagna_npcs_when_gamberry_thomas_gat_21db26: "When Gamberry and Thomas gathered a fleet and set out, Peperoncino organized and manages to this day Farfalle Vigilantes to maintain pubic order of Lasagna."
  npc_override_lasagna_lasagna_npcs_when_he_young_he_couldn_157189: "When he was young, he couldn't resist using violence to rehab hoodlum dorams. Thus, he is called the mad dog of Lasagna."
  npc_override_lasagna_lasagna_npcs_when_i_formed_vigilante_7b0a7c: "When I formed the vigilante corps, many people were drawn to my personality and joined me."
  npc_override_lasagna_lasagna_npcs_when_i_kid_so_so_9d7efe: "When I was a kid, it was so... so tough around here..."
  npc_override_lasagna_lasagna_npcs_when_i_told_him_noble_e9f030: "When I told him that ��a noble person from a new place solves the problem,�� I meant that the problem will move onto ^0000cda new person^000000. Seems like he misunderstood me and sent you."
  npc_override_lasagna_lasagna_npcs_when_i_younger_i_also_70cd6d: "When I was younger, I also wanted to become someone great."
  npc_override_lasagna_lasagna_npcs_when_ship_anchored_unkno_6a901b: "When the ship was anchored in an unknown island to replenish water, I explored the island as I always did. And I found a ^0000cdsealed pot^000000 there."
  npc_override_lasagna_lasagna_npcs_when_we_jumped_into_spec_81b361: "When we jumped into the specialty product business, many dorams who were moved by us wanted to help."
  npc_override_lasagna_lasagna_npcs_when_we_went_through_den_f27f4f: "When we went through the dense fog that appeared suddenly, there was an island we had never seen before. There were the Butterfly crewmen, their presence natural like the natives."
  npc_override_lasagna_lasagna_npcs_when_you_arrive_village_8c2c7d: "^4d4dffWhen you arrive in the village, find the tool shop first and deliver this box.^000000"
  npc_override_lasagna_lasagna_npcs_when_you_come_back_later_6e1b0b: "When you come back later, ^0000cdI'll teach you how to cook^000000. It is my way of saying sorry. Well, you may go now."
  npc_override_lasagna_lasagna_npcs_when_you_get_out_village_b7b7bf: "When you get out of the village, there is a cave at the right end of the field in which unpleasant snakes called the ^0000cdBasilisks^000000 live. You can get it from them."
  npc_override_lasagna_lasagna_npcs_when_you_go_somewhere_wh_1ca12c: "When you go somewhere where you know nobody, a Doram from the same town can be your best friend. So I recommend you to meet as many of them as possible now."
  npc_override_lasagna_lasagna_npcs_when_you_live_alone_long_63a279: "When you live alone for a long time, you get sensitive to the slightest noise. So what brings you here? I'm out of kaluna milk right now. Do you want to order something else?"
  npc_override_lasagna_lasagna_npcs_where_3764ad: "Where?"
  npc_override_lasagna_lasagna_npcs_where_adventurer_club_no_c60cbb: "Where the Adventurer Club is now, there used to be ^0000cdPub-Oven^000000. The place used to sell Kahlugna Milk. You can go to see ^0000cdthe first owner^000000 of the place. However..."
  npc_override_lasagna_lasagna_npcs_where_s_lunchbox_where_s_b7a815: "Where's the lunchbox? Where's mine? there's none for me! Where did you drop it? My food! My food!!!"
  npc_override_lasagna_lasagna_npcs_where_warehouse_comes_ha_f69a00: "This is where the warehouse comes in handy."
  npc_override_lasagna_lasagna_npcs_where_we_had_landed_soft_01b28a: "Where we had landed softly after being hit by huge waves is called the Soft Island. This is a mysterious place inhabited by people with different appearances. It's a discovery of a new world."
  npc_override_lasagna_lasagna_npcs_where_world_did_you_find_cd0c2c: "Where in the world did you find these idiots? Do you think they can handle this job?"
