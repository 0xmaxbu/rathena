  npc_override_lasagna_lasagna_npcs_moo_9f9991: "哞——"
  npc_override_lasagna_lasagna_npcs_moo_b75d6a: "哞——"
  npc_override_lasagna_lasagna_npcs_moo_moo_481bfb: "哞——哞——"
  npc_override_lasagna_lasagna_npcs_moo_moo_79578e: "哞——哞——"
  npc_override_lasagna_lasagna_npcs_moreover_s_dangerous_cro_7aaa21: "而且，翻越山脊很危险。"
  npc_override_lasagna_lasagna_npcs_moreover_you_come_mid_mi_46b580: "而且，你可以来到这个……米德……米德格……米德加尔……"
  npc_override_lasagna_lasagna_npcs_most_cherished_moment_my_ee278f: "那是我一生中最珍贵的时刻。"
  npc_override_lasagna_lasagna_npcs_most_ferocious_heinous_b_1e8fb8: "最凶猛、最恶毒、最残忍的巴西利斯克。这东西非常危险。这是我见过的最可怕的巴西利斯克。我因为害怕而扭伤了脚踝。"
  npc_override_lasagna_lasagna_npcs_most_locations_shared_sa_3853a2: "大多数共享位置都是安全的村庄或城市。"
  npc_override_lasagna_lasagna_npcs_most_notoriously_my_elde_7eab00: "最臭名昭著的是，我的哥哥和弟弟真是让我头疼！"
  npc_override_lasagna_lasagna_npcs_most_people_lasagna_work_d3f300: "千层面的大多数人都在为义警团或商人工作，所以镇上总是人手不足。"
  npc_override_lasagna_lasagna_npcs_most_people_who_knew_pas_b20974: "大多数了解甘贝里船长过去的人都已经离开了千层面。现在这里几乎没有知道过去的人了。"
  npc_override_lasagna_lasagna_npcs_most_representative_elem_b18149: "最具代表性的属性是自然属性。"
  npc_override_lasagna_lasagna_npcs_move_your_butt_you_lazy_cc1349: "动动你的屁股，你这只懒树懒！"
  npc_override_lasagna_lasagna_npcs_msg_00d9a9: "…………"
  npc_override_lasagna_lasagna_npcs_msg_015e65: "………………"
  npc_override_lasagna_lasagna_npcs_msg_0b0c6f: "{0}"
  npc_override_lasagna_lasagna_npcs_msg_5a2bae: "……"
  npc_override_lasagna_lasagna_npcs_msg_61ce5a: "[{0}]"
  npc_override_lasagna_lasagna_npcs_msg_6eae3a: "……"
  npc_override_lasagna_lasagna_npcs_msg_86a00b: "………………"
  npc_override_lasagna_lasagna_npcs_msg_93fcbf: "……"
  npc_override_lasagna_lasagna_npcs_msg_941526: "…………"
  npc_override_lasagna_lasagna_npcs_msg_c77c95: "……"
  npc_override_lasagna_lasagna_npcs_msg_e95f89: "……"
  npc_override_lasagna_lasagna_npcs_much_please_take_s_token_23019c: "不多，但请收下。这是我的一点心意。"
  npc_override_lasagna_lasagna_npcs_must_somewhere_near_here_359321: "一定在附近某个可以和伊穆吉沟通的地方。"
  npc_override_lasagna_lasagna_npcs_must_ve_been_lot_work_1a68bc: "一定很辛苦吧。"
  npc_override_lasagna_lasagna_npcs_my_brothers_pretty_mean_390b7a: "我的兄弟们相当刻薄。所以我尽量听从丹迪的吩咐。"
  npc_override_lasagna_lasagna_npcs_my_dad_i_mean_chef_31e04d: "我爸——我是说厨师——让我去弄蘑菇孢子什么的……"
  npc_override_lasagna_lasagna_npcs_my_dad_i_mean_chef_94cc16: "我爸——我是说厨师——给了我进入洞穴的训练，这样他就可以派我去做这样的任务喵。"
  npc_override_lasagna_lasagna_npcs_my_dexterity_tougher_tad_456617: "但我的灵巧更厉害。瞧！把我弟弟的护符好好利用起来。"
  npc_override_lasagna_lasagna_npcs_my_dream_almost_propheti_993656: "我的梦几乎是预言性的。所以停下你正在做的事，去^4D4DFF[码头]^000000乘坐前往新世界的船。那里会有更大的冒险在等着你喵。"
  npc_override_lasagna_lasagna_npcs_my_duty_lead_those_bad_1e179c: "这是我的职责，^0000cd引导那些坏喵族走上正途^000000。"
  npc_override_lasagna_lasagna_npcs_my_family_members_very_l_a54169: "我的家人都很懒。除非我以坚定的信念训练他们，否则他们永远成不了战士。"
  npc_override_lasagna_lasagna_npcs_my_father_born_seaman_so_cd6c9d: "我父亲天生就是海员，所以很久以前就出海了，说要捕捉世界上最大的金枪鱼。"
  npc_override_lasagna_lasagna_npcs_my_friend_you_re_quick_46c05c: "我的朋友，你既敏捷又明智。是的，请去弄些蘑菇孢子来。"
  npc_override_lasagna_lasagna_npcs_my_guess_eggring_must_ve_7eaae6: "我的猜测是，^4d4dff一定是某只蛋精吞了那个箱子。^000000"
  npc_override_lasagna_lasagna_npcs_my_hometown_wasn_t_like_941c13: "我的家乡不是那样的。"
  npc_override_lasagna_lasagna_npcs_my_house_invisible_priso_13d561: "我的家是囚禁我的无形监狱，我是一只渴望自由的鸟……"
  npc_override_lasagna_lasagna_npcs_my_hunch_never_wrong_67ab1b: "我的直觉从不出错。"
  npc_override_lasagna_lasagna_npcs_my_mom_dad_told_me_f04d41: "我的爸爸妈妈一遍又一遍地告诉我。"
  npc_override_lasagna_lasagna_npcs_my_mother_collector_so_s_a47f0c: "我妈妈是个收集狂，她会深入森林深处寻找奇怪的果实。她总是来去匆匆，我根本不知道。"
  npc_override_lasagna_lasagna_npcs_my_name_10a387: "我叫 {0}。"
  npc_override_lasagna_lasagna_npcs_my_parents_keep_going_ou_dc6003: "……我的父母总是去危险的地方。我还太小帮不了他们，所以我只能为他们制作这些护符。"
  npc_override_lasagna_lasagna_npcs_my_sister_told_me_my_49ca01: "我姐姐告诉我，我的父母是战士！他们去进行伟大的冒险了！！"
  npc_override_lasagna_lasagna_npcs_my_story_why_you_curious_f561b4: "我的故事……你为什么会好奇？不过既然你问了，我就告诉你。我出生在千层面以外的一个叫^0000cd富西利^000000的地方。那时候，提到佩佩隆奇诺的名字，富西利无人不知。"
  npc_override_lasagna_lasagna_npcs_my_strings_still_aren_t_844949: "我的鱼串还没到。一定是那些沙漠之狼干的。"
  npc_override_lasagna_lasagna_npcs_n_no_way_7913a9: "不——不会吧！"
  npc_override_lasagna_lasagna_npcs_nah_my_mom_held_my_521ab6: "不。我妈妈拉着我的手，顺着潮汐来到了这里。她被冲走了，我一个人落在了这里。莱加拉斯发现了我，从那以后，我们就像一家人一样生活在一起。"
  npc_override_lasagna_lasagna_npcs_native_lasagna_brought_u_822141: "千层面本地人，因富有的父母而生活优渥。"
  npc_override_lasagna_lasagna_npcs_navi_dragon_s_nest_info_5564d3: "<NAVI>^4D4DFF[龙巢]^000000<INFO>lasa_fild02,340,244,000,1,</INFO></NAVI> 在右边的洞穴里。跟我来吧。"
  npc_override_lasagna_lasagna_npcs_never_e29869: "绝不。"
  npc_override_lasagna_lasagna_npcs_new_adventurer_polite_do_817248: "一名新冒险者。有礼貌的喵族在进入前总是会敲门。既然你冒险前一定很紧张，这次我就算了。"
  npc_override_lasagna_lasagna_npcs_new_adventures_yours_cha_ef6655: "新的冒险等待你去挑战。"
  npc_override_lasagna_lasagna_npcs_new_continent_new_contin_a59cd9: "新大陆！新大陆！"
  npc_override_lasagna_lasagna_npcs_new_day_just_begun_so_9a2206: "新的一天刚刚开始，野生大黄蜂也开始活动了。"
  npc_override_lasagna_lasagna_npcs_nice_meet_you_64753c: "很高兴认识你。"
  npc_override_lasagna_lasagna_npcs_nice_meet_you_i_am_305f0d: "很高兴认识你。我是这艘船的记录员，负责所有记录。你随时可以来问问题。除了机密文件外，你可以自由查阅任何记录。"
  npc_override_lasagna_lasagna_npcs_nice_rest_come_back_agai_c8b6ae: "好好休息，明天再来。"
  npc_override_lasagna_lasagna_npcs_nice_work_story_matches_0f489f: "干得好。这个故事与我记得的一些细节相符。他确实是个活历史。我想我应该根据这个故事来补充记录。"
  npc_override_lasagna_lasagna_npcs_nickname_berry_b4b1bf: "昵称是贝里。"
  npc_override_lasagna_lasagna_npcs_nickname_pepe_2a011c: "昵称是佩佩。"
  npc_override_lasagna_lasagna_npcs_nickname_toto_935e55: "昵称是托托。"
  npc_override_lasagna_lasagna_npcs_no_9f92cd: "不？"
  npc_override_lasagna_lasagna_npcs_no_adventurer_faint_hear_1e3619: "没有哪个胆小的冒险者能在新大陆生存下来！"
  npc_override_lasagna_lasagna_npcs_no_adventurer_waiting_sa_7747b5: "不，是等待起航的冒险者。我猜船因为雾还没出发。这家伙是来查看情况的。"
  npc_override_lasagna_lasagna_npcs_no_all_captain_what_you_bebadf: "不，完全没有。船长，你在说什么呢？"
  npc_override_lasagna_lasagna_npcs_no_attack_work_if_you_5d444c: "如果打不中目标，什么攻击都没用！"
  npc_override_lasagna_lasagna_npcs_no_b8b9f1: "不。"
  npc_override_lasagna_lasagna_npcs_no_clue_i_ve_never_6f73a9: "不知道。我从没听说过。"
  npc_override_lasagna_lasagna_npcs_no_customers_my_pub_soon_1f8d9c: "没有客人，我的酒馆很快就要倒闭了。"
  npc_override_lasagna_lasagna_npcs_no_don_t_insult_them_7ce8bf: "不，别侮辱他们。是这个地方不寻常。"
  npc_override_lasagna_lasagna_npcs_no_don_t_you_know_0d802a: "不。你不知道吗？这是最近热门歌曲的歌词。哦，拜托，别表现得像是从哪个乡下地方来的。他们会怎么看待我们所有人？"
  npc_override_lasagna_lasagna_npcs_no_don_t_you_know_f2aa25: "不。你不知道吗？这是最近热门歌曲的歌词。哦，拜托，别表现得像是从哪个乡下地方来的。他们会怎么看待我们所有人？总之，你该带的东西呢？你有吗？"
  npc_override_lasagna_lasagna_npcs_no_i_found_thief_already_3e7c03: "不。我已经找到小偷了。我打算用最痛苦的方式惩罚他。不过，在那之前我还有一些事要处理。所以我才一直没声张。"
  npc_override_lasagna_lasagna_npcs_no_i_hope_someone_carrie_b0c707: "不。我希望有人能背我……"
  npc_override_lasagna_lasagna_npcs_no_i_really_wanted_join_097bc0: "不！我真的想加入！"
  npc_override_lasagna_lasagna_npcs_no_missing_pages_been_fo_d14625: "不。缺失的页面已经找到了。在厨房的烤箱里。"
  npc_override_lasagna_lasagna_npcs_no_more_humans_allowed_7cdcba: "不允许再有人类进入！"
  npc_override_lasagna_lasagna_npcs_no_my_mom_dad_left_768133: "不。我爸爸妈妈刚离开不久。我必须再在这里待一段时间，多长大一些。多睡多吃。等我变得强壮了，我就去观光。"
  npc_override_lasagna_lasagna_npcs_no_need_know_about_your_ad8681: "不需要了解你的过去。我只需要你在船上好好干活。既然你们俩都是第一次上船，看来前路漫漫。"
  npc_override_lasagna_lasagna_npcs_no_never_i_don_t_2f34b6: "不，绝不。我不打算和萨满喵交朋友，也不打算自己去猎杀巴西利斯克。"
  npc_override_lasagna_lasagna_npcs_no_never_mind_201874: "不，算了！"
  npc_override_lasagna_lasagna_npcs_no_never_mind_c36804: "不，算了。"
  npc_override_lasagna_lasagna_npcs_no_never_mind_me_abf6ca: "不，别管我……"
  npc_override_lasagna_lasagna_npcs_no_news_still_4d9190: "还是没有消息。"
  npc_override_lasagna_lasagna_npcs_no_no_i_m_saying_828f16: "不不。我不是说你做错了。但你能多告诉我一些吗？"
  npc_override_lasagna_lasagna_npcs_no_no_more_b2bc55: "不！不要了！"
  npc_override_lasagna_lasagna_npcs_no_no_never_you_cannot_cf38e9: "不不，绝不。你不能就这样脱身。^0000cd这一定是我们的宿命。^000000这是命运！你应该帮我。"
  npc_override_lasagna_lasagna_npcs_no_no_person_won_t_ce88e8: "不不——那个人不会伤害你的——"
  npc_override_lasagna_lasagna_npcs_no_no_s_most_popular_2e8285: "不不。那是最受欢迎的菜品。我指的是……对了！我是指厨师的特色菜。"
  npc_override_lasagna_lasagna_npcs_no_one_knows_what_howeve_cf22a9: "没人知道它是什么。然而，所有水手都有它。你真的别问了。现在去拿。我给你 10 秒钟。"
  npc_override_lasagna_lasagna_npcs_no_other_crews_con_chlii_5b5727: "除了甘贝里船长和我以外，孔-克利纳号上没有其他船员知道这件事。"
  npc_override_lasagna_lasagna_npcs_no_prob_farewell_then_69d089: "没问题。那就再会了。"
  npc_override_lasagna_lasagna_npcs_no_s_6bfbe1: "不，不是那样的！！"
  npc_override_lasagna_lasagna_npcs_no_s_nothing_da2af9: "不，没什么。"
  npc_override_lasagna_lasagna_npcs_no_s_okay_i_ll_fc1129: "不，没关系。我现在不说了。"
  npc_override_lasagna_lasagna_npcs_no_sailing_while_c1a74c: "暂时不能航行。"
  npc_override_lasagna_lasagna_npcs_no_snake_roast_6888cc: "不要烤蛇！"
  npc_override_lasagna_lasagna_npcs_no_such_thing_i_m_3203cc: "没有这回事。我饿了。"
  npc_override_lasagna_lasagna_npcs_no_surprise_there_938b70: "那并不奇怪！"
  npc_override_lasagna_lasagna_npcs_no_they_re_both_well_051654: "不，他们都很好，还在千层面。我来这里是因为我想了解一些关于甘贝里船长的事。"
  npc_override_lasagna_lasagna_npcs_no_wait_a3ea2e: "不，等等！"
  npc_override_lasagna_lasagna_npcs_no_wonder_fog_smells_lik_05576e: "难怪雾里有烟味。"
  npc_override_lasagna_lasagna_npcs_no_yet_they_keep_coming_924203: "不，还没。它们还在来。我说了还没。"
  npc_override_lasagna_lasagna_npcs_nonsense_who_else_take_c_d2312b: "胡说！还有谁会负责通往新大陆的海路？"
  npc_override_lasagna_lasagna_npcs_nope_afd5b9: "不。"
  npc_override_lasagna_lasagna_npcs_nothing_don_t_you_other_a52ef1: "没事！你没有别的事可做吗？"
  npc_override_lasagna_lasagna_npcs_nothing_like_happened_if_c4e977: "如果那家伙不去招惹巴西利斯克，这种事根本不会发生。好了，去吧。"
  npc_override_lasagna_lasagna_npcs_nothing_me_00e11f: "那跟我没关系。"
  npc_override_lasagna_lasagna_npcs_nothing_up_quiet_shoal_f_a840ca: "没什么事。安静点。满月下飞鱼群跃过海面的景象真是太壮观了。"
  npc_override_lasagna_lasagna_npcs_notice_b6a240: "！- 注意 -！"
  npc_override_lasagna_lasagna_npcs_now_follow_after_me_grab_a64010: "现在，跟着我。拿起一条鳀鱼。去掉头。拔出内脏。放进容器里。"
  npc_override_lasagna_lasagna_npcs_now_i_think_about_i_b1618c: "现在我想起来了，我一直想做些^0000cd和鳀鱼有关的事^000000。鳀鱼很好吃。"
  npc_override_lasagna_lasagna_npcs_now_look_someone_here_be_45400e: "你看！有人来找我了，因为我没能送货！我完了！我要饿死了！"
  npc_override_lasagna_lasagna_npcs_now_now_calm_down_how_827d51: "好了好了，冷静点。坐船感觉怎么样？它把鳀鱼从鳀鱼渔船运到千层面，但你不会看到它们，因为货物存放在货舱里。"
  npc_override_lasagna_lasagna_npcs_now_our_cows_lots_tasty_7ea454: "现在我们的奶牛可以吃到很多美味的草了。谢谢你。"
  npc_override_lasagna_lasagna_npcs_now_teach_us_7cb16c: "现在，教教我们吧。"
  npc_override_lasagna_lasagna_npcs_now_they_massive_fleet_d2913e: "但现在，他们拥有了一支庞大的船队！"
  npc_override_lasagna_lasagna_npcs_now_time_see_head_chef_fa9318: "现在是时候去见^0000cd主厨、舵手和水手长^000000了。他们一定在走廊尽头的^0000cd餐厅^000000里。祝你航行安全。"
  npc_override_lasagna_lasagna_npcs_now_we_talking_b5485a: "这才像话。"
  npc_override_lasagna_lasagna_npcs_now_we_ve_checked_your_262218: "既然我们已经检查了你的武器，为什么不看看要狩猎的目标呢？"
  npc_override_lasagna_lasagna_npcs_now_you_get_4be9f3: "现在你明白了吗？"
  npc_override_lasagna_lasagna_npcs_now_you_know_how_equip_90b7b4: "现在你知道怎么装备物品了，因为我已经解释过了，对吧？"
  npc_override_lasagna_lasagna_npcs_now_you_know_how_use_2e687d: "……现在你知道怎么使用技能了。"
  npc_override_lasagna_lasagna_npcs_now_young_one_hiding_yeo_ccb347: "而现在，那个小家伙把如意珠藏在某个地方，正在寻求 500 年后升天的机会。我要夺回属于我的东西。我的权利是正当的。"
  npc_override_lasagna_lasagna_npcs_nya_nya_nya_problem_7ae0ad: "喵喵喵……一个问题。"
  npc_override_lasagna_lasagna_npcs_nyo_ho_nyo_ho_how_472bf1: "嚯嚯！嚯嚯！你竟敢对我不敬？"
  npc_override_lasagna_lasagna_npcs_nyo_hoho_nyo_hoho_9b16c8: "嚯嚯！！嚯嚯！！"
  npc_override_lasagna_lasagna_npcs_nyo_hoho_nyo_hoho_i_f8aba4: "嚯嚯！嚯嚯！我是这片领域最强的喵族！"
  npc_override_lasagna_lasagna_npcs_nyo_hoho_nyo_hoho_you_b4658d: "嚯嚯！嚯嚯！你看起来很忙。你要去哪里？"
  npc_override_lasagna_lasagna_npcs_oh_actually_i_lost_d0b89a: "哦，其实……我弄丢了！"
  npc_override_lasagna_lasagna_npcs_oh_again_81bd92: "哦，又来了。"
  npc_override_lasagna_lasagna_npcs_oh_all_i_m_grateful_f421e1: "哦，不会。我也很感谢你。总之，如果你去^0000cd南桥附近的钓鱼点^000000，你会见到拄着拐杖站在那里的^0000cd莱加拉斯^000000。他就是给我们供应卡鲁纳的人。"
  npc_override_lasagna_lasagna_npcs_oh_aroma_7184fb: "哦……这香气！"
  npc_override_lasagna_lasagna_npcs_oh_bun_sure_hot_huge_9053a1: "哦，这是包子……确实又热又大。这和咱们那边的完全不一样。"
  npc_override_lasagna_lasagna_npcs_oh_dead_8ca26a: "哦，死者。"
  npc_override_lasagna_lasagna_npcs_oh_dear_315af8: "哦，天哪……"
  npc_override_lasagna_lasagna_npcs_oh_dear_9aea7a: "哦天哪……"
  npc_override_lasagna_lasagna_npcs_oh_did_chief_send_you_99e052: "哦！是团长派你来的吗？"
  npc_override_lasagna_lasagna_npcs_oh_didn_t_chef_tell_e641c0: "哦，厨师没告诉你吗？抱歉，大多数人都是在从他那里听说详情后才来的。"
  npc_override_lasagna_lasagna_npcs_oh_don_t_take_wrong_d8321f: "哦，别误会。尽管看起来可能不是那样，但我内心真的很感激。谢谢！"
  npc_override_lasagna_lasagna_npcs_oh_embarrassing_how_many_d6fe74: "哦，真尴尬！我要跟你说多少遍，这里每个人都是搅拌的？！"
  npc_override_lasagna_lasagna_npcs_oh_hello_9aef12: "哦，你好？"
  npc_override_lasagna_lasagna_npcs_oh_here_you_bef8c8: "哦！你在这里！"
  npc_override_lasagna_lasagna_npcs_oh_how_did_you_know_f00a28: "哦！你怎么知道的？"
  npc_override_lasagna_lasagna_npcs_oh_hum_i_should_go_8f8060: "哦，嗯。我应该去看看水手长是否在正确的位置。"
  npc_override_lasagna_lasagna_npcs_oh_i_am_blaming_you_89e7f3: "哦，我不是在责怪你。我会尽力给你最好的航行体验。我是^0000cd斯特洛^000000。"
  npc_override_lasagna_lasagna_npcs_oh_i_don_t_even_40f609: "然后……哦，我甚至不想想象那之后的事。"
  npc_override_lasagna_lasagna_npcs_oh_i_favor_ask_you_342648: "哦，我有件事想请你帮忙。你能把它带给^0000cd副厨师长^000000吗？你能帮我这个忙吗？你会时不时乘坐这艘船航行的，对吧？"
  npc_override_lasagna_lasagna_npcs_oh_i_guess_we_getting_f8898d: "哦，我猜我们要讲到精彩部分了。我真的很喜欢。"
  npc_override_lasagna_lasagna_npcs_oh_i_m_so_hungry_4fe383: "哦，我好饿。食物什么时候来？食物。"
  npc_override_lasagna_lasagna_npcs_oh_i_m_sorry_i_737c63: "哦！抱歉。我还以为又是大黄蜂呢。"
  npc_override_lasagna_lasagna_npcs_oh_i_must_put_near_2e37fe: "哦，那个！我一定把它放在附近了……"
  npc_override_lasagna_lasagna_npcs_oh_i_see_bb3c05: "哦，我明白了。"
  npc_override_lasagna_lasagna_npcs_oh_i_see_i_am_1489f4: "哦，我明白了。我很抱歉。"
  npc_override_lasagna_lasagna_npcs_oh_i_see_nice_meet_a0de9d: "哦，我明白了。很高兴认识你。我是这艘船的记录员，负责所有记录。你随时可以来问问题。除了机密文件外，你可以自由查阅任何记录。"
  npc_override_lasagna_lasagna_npcs_oh_i_see_please_excuse_372bb8: "哦，我明白了。请原谅。"
  npc_override_lasagna_lasagna_npcs_oh_i_see_thank_you_41b978: "哦，我明白了。谢谢你。"
  npc_override_lasagna_lasagna_npcs_oh_i_should_get_you_ed3ade: "哦，我应该给你一个放大镜。当你获得未鉴定的武器或装备时，可以用它来鉴定。"
  npc_override_lasagna_lasagna_npcs_oh_my_days_so_you_feaa46: "哦，天哪！所以你连千层面都没去过？"
  npc_override_lasagna_lasagna_npcs_oh_my_days_you_startled_bf375e: "哦，天哪！你吓到我了！"
  npc_override_lasagna_lasagna_npcs_oh_my_f009ab: "哦天哪。"
  npc_override_lasagna_lasagna_npcs_oh_my_he_really_idiot_7aec03: "哦天哪，他真是个白痴。要是他早点来找我，我会告诉他一条痛苦较小的路。"
  npc_override_lasagna_lasagna_npcs_oh_my_heart_beating_just_d5ab03: "哦，光是想到这个我的心就怦怦跳。"
  npc_override_lasagna_lasagna_npcs_oh_my_who_ve_thought_969d1b: "哦天哪。谁能想到还有另一个像^0000cd孔-克利纳号水手长^000000一样的白痴呢。"
  npc_override_lasagna_lasagna_npcs_oh_never_mind_i_am_15b9be: "哦，算了。我不记录你的缺点了……这就够了。"
  npc_override_lasagna_lasagna_npcs_oh_night_i_listened_song_5c4009: "哦那晚，我听了这首歌。我到处都能听到。我能从手掌的纹路、耳边和银色波浪中听到它。"
  npc_override_lasagna_lasagna_npcs_oh_no_ce8d16: "哦，不……"
  npc_override_lasagna_lasagna_npcs_oh_no_i_m_sorry_399f78: "哦不。我很抱歉。"
  npc_override_lasagna_lasagna_npcs_oh_no_what_happened_9507c1: "哦不。发生了什么事？"
  npc_override_lasagna_lasagna_npcs_oh_quite_story_i_really_408398: "哦，这真是个精彩的故事。我真的很感谢你的故事。我相信无数次的冒险造就了今天的你，亲爱的船长。"
  npc_override_lasagna_lasagna_npcs_oh_really_ooh_s_awful_64762a: "哦，那个？真的？哦，那太糟糕了……说真的，怎么会……呃。"
  npc_override_lasagna_lasagna_npcs_oh_red_fog_seemed_all_bd4c07: "哦，红色的^0000cd雾^000000！刚才还好好的！"
  npc_override_lasagna_lasagna_npcs_oh_right_i_ll_give_9a9288: "哦，对了！我把这个也给你。"
  npc_override_lasagna_lasagna_npcs_oh_right_pepe_looked_lik_0d828e: "哦，对了。佩佩看起来像个流浪汉，点了一杯卡鲁纳牛奶。那时贝里找茬说，只有小孩子才喝摇晃的。"
  npc_override_lasagna_lasagna_npcs_oh_s_really_good_225421: "哦，真的很好……"
  npc_override_lasagna_lasagna_npcs_oh_so_you_re_famous_70f7b6: "哦！你就是大家说的那个有名的人类！"
  npc_override_lasagna_lasagna_npcs_oh_so_you_re_here_cdf8cd: "哦，所以你是来学习药水合成的？"
  npc_override_lasagna_lasagna_npcs_oh_strange_story_i_heard_568fdb: "哦，奇怪。这不是我从你母亲那里听到的故事，船长。她说你不想接手肉铺生意，一大早就出去了。"
  npc_override_lasagna_lasagna_npcs_oh_thank_you_you_saved_e37bb9: "哦，谢谢你！你救了我！我希望你能尝尝用这个做的布丁，但我现在太忙了。"
  npc_override_lasagna_lasagna_npcs_oh_thanks_bunch_what_rel_70ab8d: "哦，非常感谢。真是松了口气！"
  npc_override_lasagna_lasagna_npcs_oh_there_basilisks_comin_dce157: "哦！又有巴西利斯克朝这边来了。拜托，处理掉它们。"
  npc_override_lasagna_lasagna_npcs_oh_there_they_again_adve_f86c63: "哦，它们又来了！冒险者，请别让它们靠近这里。抓十只。"
  npc_override_lasagna_lasagna_npcs_oh_there_you_go_5204ac: "哦，这就对了！"
  npc_override_lasagna_lasagna_npcs_oh_those_eggring_boys_sp_2dc0d0: "哦，那些蛋精小子们。说起来，我最近很少看到他们了。他们放弃并离开千层面了吗？"
  npc_override_lasagna_lasagna_npcs_oh_wait_you_big_help_139247: "哦，等等！你这次帮了大忙，所以我把这个送给你作为谢礼。"
  npc_override_lasagna_lasagna_npcs_oh_wait_you_re_taking_fa495c: "哦，等等。你不是在当真吧？这是个玩笑，玩笑！"
  npc_override_lasagna_lasagna_npcs_oh_way_you_need_know_d7b6fc: "哦，顺便提一下，你需要知道^0000cd烹饪可能会失败^000000。失败的概率取决于你拥有的厨具和你的烹饪等级。"
  npc_override_lasagna_lasagna_npcs_oh_what_am_i_going_c00b0b: "哦，我该怎么办。嘿，冒险者！等一下！"
  npc_override_lasagna_lasagna_npcs_oh_yeah_b02a1c: "哦耶！"
  npc_override_lasagna_lasagna_npcs_oh_yeah_i_see_your_127277: "哦，是的。我在名单上看到了你的名字。{0}。"
  npc_override_lasagna_lasagna_npcs_oh_yeah_thanks_84c9d0: "哦，是的。谢谢。"
  npc_override_lasagna_lasagna_npcs_oh_yes_let_s_give_c50f75: "哦，是的。让我们为完成任务归来的冒险者热烈鼓掌！"
  npc_override_lasagna_lasagna_npcs_oh_yes_well_thanks_0285c5: "哦，是的。嗯，谢谢。"
  npc_override_lasagna_lasagna_npcs_oh_you_adventurer_you_do_2f3560: "哦！你这位冒险者！你不用那么认真地对待他……！"
  npc_override_lasagna_lasagna_npcs_oh_you_brought_them_all_e76cd7: "哦，你把它们都带来了！让我马上给你做。"
  npc_override_lasagna_lasagna_npcs_oh_you_come_i_hunch_d4306c: "哦，你会来的。我有预感。"
  npc_override_lasagna_lasagna_npcs_oh_you_d_like_learn_9c8143: "哦，你想学急救！真了不起！"
  npc_override_lasagna_lasagna_npcs_oh_you_haven_t_met_a44e46: "哦！你还没见过我们的团长？"
  npc_override_lasagna_lasagna_npcs_oh_you_must_famous_stran_4641e8: "哦！你一定就是新大陆来的那位有名的陌生人吧？"
  npc_override_lasagna_lasagna_npcs_oh_you_newly_trained_adv_6a2cd1: "哦，你就是那位刚受训完毕、前往新大陆冒险的冒险者吧。我很欣赏冒险精神。我年轻时也到处旅行。"
  npc_override_lasagna_lasagna_npcs_oh_you_re_done_yet_5db4c4: "哦，你还没做完。忘了你要抓什么了吗？"
  npc_override_lasagna_lasagna_npcs_oh_you_re_youngest_kitte_7e2c43: "哦，你就是道具商人的小猫咪！"
  npc_override_lasagna_lasagna_npcs_oh_you_right_there_one_257f79: "哦，你说得对。有^0000cd这么一个人^000000。"
  npc_override_lasagna_lasagna_npcs_oh_you_shouldn_t_said_def7eb: "哦，你不该那么说！"
  npc_override_lasagna_lasagna_npcs_oh_you_want_me_explain_c5ca23: "哦，你想让我再解释一遍吗？"
  npc_override_lasagna_lasagna_npcs_ohh_box_c978fa: "哦哦……！就是这个箱子！"
  npc_override_lasagna_lasagna_npcs_ohh_c8857f: "哦哦！"
  npc_override_lasagna_lasagna_npcs_ok_get_there_now_edc349: "好了。现在上去吧。"
  npc_override_lasagna_lasagna_npcs_ok_i_40f4db: "好，我会的！"
  npc_override_lasagna_lasagna_npcs_ok_i_t_help_just_44c7bd: "好吧，没办法。就今天。"
  npc_override_lasagna_lasagna_npcs_okay_fine_let_s_go_480309: "好吧，我们走吧。去^0000cd码头附近的鳀鱼工坊^000000。"
  npc_override_lasagna_lasagna_npcs_okay_give_me_food_now_5c74a2: "好了，现在给我吃的。"
  npc_override_lasagna_lasagna_npcs_okay_i_ll_go_find_b11c5d: "好的，我去查清楚。"
  npc_override_lasagna_lasagna_npcs_okay_i_m_sitting_now_68bf50: "好，我坐下了。"
  npc_override_lasagna_lasagna_npcs_okay_see_you_later_ede9e5: "好的。回头见。"
  npc_override_lasagna_lasagna_npcs_okay_then_let_s_get_5e6c09: "好吧，那我们马上开始！把这个便当送给^0000cd洞穴里的义警。他叫潘纳。^000000"
  npc_override_lasagna_lasagna_npcs_olio_183987: "奥利奥！"
  npc_override_lasagna_lasagna_npcs_once_sun_up_they_ll_2789e5: "太阳一出来，它们又会回来。你能到时候再来帮我吗？"
  npc_override_lasagna_lasagna_npcs_once_you_cross_south_bri_ec3c67: "过了南桥后，你会看到一个十字路口。走下面的路，直走到牧羊人所在的拉维奥利平原。"
  npc_override_lasagna_lasagna_npcs_once_you_get_cookbook_yo_7d6bdc: "一旦你有了食谱，就需要收集^0000cd食材^000000。光舔食谱而不准备食材是没用的。连蛋精都懂这个道理。"
  npc_override_lasagna_lasagna_npcs_one_27141a: "一！"
  npc_override_lasagna_lasagna_npcs_one_again_31f06c: "又是^0000cd那个家伙^000000。"
  npc_override_lasagna_lasagna_npcs_one_checking_ticket_entr_041c1e: "入口处检票的那个人让我把它送给主厨。"
  npc_override_lasagna_lasagna_npcs_one_more_thing_just_drop_2bf503: "还有一件事。改掉在陌生人面前装天真的习惯！"
  npc_override_lasagna_lasagna_npcs_one_particular_even_came_568970: "这一只甚至昨天闯进了城镇，造成了破坏。我们不得不拘留它，但它不肯说出原因。"
  npc_override_lasagna_lasagna_npcs_one_team_if_i_don_366204: "一个团队。如果我不出现，他们大概又会骚扰莱加拉斯。好吧。"
  npc_override_lasagna_lasagna_npcs_only_chief_officer_tell_820080: "只有首席官能告诉我们是否能去新大陆。"
  npc_override_lasagna_lasagna_npcs_only_lasts_day_when_expi_dc73b0: "它只能持续一天。过期后就会烧掉。我想你应该从现在开始和萨满喵亲近一些。"
  npc_override_lasagna_lasagna_npcs_only_thing_i_could_weake_543c18: "我唯一能做的就是每天尽可能削弱它。"
  npc_override_lasagna_lasagna_npcs_only_vigilantes_eat_here_ed0960: "只有义警才能在这里吃饭。"
  npc_override_lasagna_lasagna_npcs_only_zenies_port_city_la_64b4cf: "只要^0000cd{0} Zeny^000000就能到港口城市千层面。"
  npc_override_lasagna_lasagna_npcs_open_close_item_window_s_8ecb4f: "按快捷键 [Alt+E] 打开或关闭物品窗口。"
  npc_override_lasagna_lasagna_npcs_opps_i_supposed_go_ancho_332677: "哎呀！我本该去鳀鱼工坊的。得快点。"
  npc_override_lasagna_lasagna_npcs_order_cook_such_dishes_y_6abb67: "为了烹饪这样的菜肴，你需要做一些准备工作。"
  npc_override_lasagna_lasagna_npcs_other_than_setting_off_a_e211ab: "除了出发去冒险，我还收集别人的冒险故事。我听说甘贝里船长你在千层面待了很长时间。"
  npc_override_lasagna_lasagna_npcs_other_than_there_also_ne_dd9ce0: "除此之外，还有无属性和不死属性。你很快就会知道它们是什么了。"
  npc_override_lasagna_lasagna_npcs_ouch_why_you_hitting_me_62c485: "哎哟！你为什么突然打我？"
  npc_override_lasagna_lasagna_npcs_our_cow_should_eat_lots_bed2c5: "我们的奶牛……应该吃很多好吃的东西……请处理掉五只叶精和五只草精。"
  npc_override_lasagna_lasagna_npcs_our_cows_liked_you_very_5943bd: "我们的奶牛非常喜欢你。这很让人惊讶，因为它们通常很害羞。"
  npc_override_lasagna_lasagna_npcs_our_cows_nothing_eat_the_a3aae8: "那我们的奶牛就没东西吃了。"
  npc_override_lasagna_lasagna_npcs_our_great_captain_gamber_86e955: "我们伟大的甘贝里船长亲自前来！"
  npc_override_lasagna_lasagna_npcs_our_honey_danger_db6166: "我们的蜂蜜有危险！"
  npc_override_lasagna_lasagna_npcs_our_ship_different_power_d145b7: "我们的船与其他船相比有不同动力系统。只有少数人知道这一点。"
  npc_override_lasagna_lasagna_npcs_out_curiosity_perhaps_i_699bec: "也许是出于好奇吧。如果我去新大陆，我也会到处戳戳看看。呃……请扶我一下。我走不稳了。"
  npc_override_lasagna_lasagna_npcs_out_towner_dorams_abound_ebd990: "这里外地喵族泛滥，我绝对不想再看到更多了。"
  npc_override_lasagna_lasagna_npcs_oven_resolution_b7fe82: "^0000cd[烤箱决议]^000000"
  npc_override_lasagna_lasagna_npcs_oww_hurts_i_m_sorry_c23468: "哎哟……好疼。如果我冒犯了你，我很抱歉，但你是巴西利斯克的首领伊穆吉吗？"
  npc_override_lasagna_lasagna_npcs_panna_bb9f1c: "潘纳？"
  npc_override_lasagna_lasagna_npcs_panna_here_s_your_lunchb_41de60: "潘纳？你的便当……"
  npc_override_lasagna_lasagna_npcs_patiently_72f2f7: "耐心地——"
  npc_override_lasagna_lasagna_npcs_patiently_sitting_4b2218: "耐心地坐着。"
  npc_override_lasagna_lasagna_npcs_patrol_who_went_check_ha_7b4894: "去查看情况的巡逻队^0000cd还没回来^000000。一定出事了。你说你要去查看龙的状态，对吧？跟我来。"
  npc_override_lasagna_lasagna_npcs_pay_same_anywhere_you_re_2dba3e: "在哪薪水都一样。你准备好了吗？"
  npc_override_lasagna_lasagna_npcs_peep_peep_pweep_peep_ea278c: "唧唧-唧唧-啵唧-唧唧"
  npc_override_lasagna_lasagna_npcs_people_new_continent_so_d48cfb: "新大陆来的人真高。"
  npc_override_lasagna_lasagna_npcs_people_only_see_as_much_9cf1b1: "人只能看到自己认知范围内的事物。"
  npc_override_lasagna_lasagna_npcs_pepe_5b7ff4: "佩佩？"
  npc_override_lasagna_lasagna_npcs_pepe_peperoncino_gamberr_de8eff: "^0000cd佩佩。佩佩隆奇诺。甘贝里是贝里，托梅·托马斯是托托^000000。我想年轻人不知道。总之，他们就像野生的巴西利斯克。"
  npc_override_lasagna_lasagna_npcs_peperoncino_5425ce: "佩佩龙奇诺"
  npc_override_lasagna_lasagna_npcs_peperoncino_b9e71e: "- 佩佩隆奇诺 -"
  npc_override_lasagna_lasagna_npcs_pfff_what_s_wrong_using_c6af7d: "噗！用召唤技能来补充物理技能有什么不对吗？"
  npc_override_lasagna_lasagna_npcs_phew_i_tried_so_hard_c41739: "呼……我那么努力地装死。它走了吗？"
  npc_override_lasagna_lasagna_npcs_phew_such_nonsense_a77ad3: "呼，真是胡说八道。"
