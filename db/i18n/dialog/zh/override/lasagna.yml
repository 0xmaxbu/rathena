  npc_override_lasagna_lasagna_npcs_dear_adventurer_i_should_4904d3: "Dear adventurer, I should take him to the base. Would you be able to go there alone? ^0000cdTartufi^000000 is upstairs. Go and ask him what the problem is."
  npc_override_lasagna_lasagna_npcs_dear_adventurer_i_should_9a3ca9: "Dear adventurer, I should take him to the base. Would you be able to go there alone?"
