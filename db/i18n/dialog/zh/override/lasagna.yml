  npc_override_lasagna_lasagna_npcs_fire_element_highly_resi_4cd88c: "Fire element is highly resistant to Earth element."
  npc_override_lasagna_lasagna_npcs_first_aid_skill_converti_90f004: "First Aid is a skill converting your SP into HP in an emergency."
  npc_override_lasagna_lasagna_npcs_first_i_tried_persuade_t_5626f5: "At first, I tried to persuade those lousy dorams through conversation. I tried to be a gentleman but they wouldn't listen. That's when Gamberry took the matters into his own hands."
