  npc_override_lasagna_lasagna_npcs_f_f_011568: "F12! F12!"
  npc_override_lasagna_lasagna_npcs_fair_fair_right_42cfec: "Fair is fair, right?"
  npc_override_lasagna_lasagna_npcs_famous_pub_oven_a85689: "Is this the famous Pub-Oven?"
  npc_override_lasagna_lasagna_npcs_far_star_continent_d2b3d6: "Far-Star Continent?"
  npc_override_lasagna_lasagna_npcs_farfalle_vigilantes_char_aebccd: "And Farfalle Vigilantes will be in charge of training them. With Soft Island as its base, Butterfly agreed to support adventurers. Preparation time is three years."
  npc_override_lasagna_lasagna_npcs_father_mother_please_com_8ea809: "Father, mother. Please come back home safely."
  npc_override_lasagna_lasagna_npcs_feels_like_black_fog_nea_a0ad4a: "It feels like the black fog neat me is lifting! I don't hear the whispering sound anymore! My head feels so clear in a long time."
  npc_override_lasagna_lasagna_npcs_feels_like_everyone_back_06f5be: "It feels like everyone will be back and smiling if I go to the port."
  npc_override_lasagna_lasagna_npcs_feels_like_seeing_sunshi_86a127: "It feels like seeing the sunshine through the black fog."
  npc_override_lasagna_lasagna_npcs_feels_like_watching_blue_0e8c33: "It feels like watching the blue horizon on a clear and windless day. It is refreshing."
  npc_override_lasagna_lasagna_npcs_feels_like_watching_clou_aeff31: "It feels like watching the clouds go by lying on my back on a green hill."
  npc_override_lasagna_lasagna_npcs_feels_like_we_re_being_bfca83: "Feels like we're being sold."
  npc_override_lasagna_lasagna_npcs_felt_like_i_could_grab_39f0d3: "It felt like I could grab the tune with my hand. When I was walking, following the sound, someone shook me hard. The next thing I noticed was that I was being held by the crews just before jumping off the ship."
  npc_override_lasagna_lasagna_npcs_few_years_ago_captain_to_841040: "A few years ago, Captain Tomatomas embarked on a journey to discover a new trading route, but he went missing when his ship was caught up in a storm."
