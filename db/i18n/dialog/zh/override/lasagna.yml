  npc_override_lasagna_lasagna_npcs_what_what_did_you_say_89a0c8: "What? What did you say? A sailor boy? Hey! I am not just a sailor boy, but an invaluable asset who takes care of miscellaneous businesses of Con-Chliina! This ship cannot sail without me!"
