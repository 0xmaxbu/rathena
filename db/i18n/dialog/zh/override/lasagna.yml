  npc_override_lasagna_lasagna_npcs_i_ll_take_chief_when_ff1bbe: "做好后我会拿去给团长，你可以先走。"
  npc_override_lasagna_lasagna_npcs_i_ll_take_empty_dishes_49f08b: "我来收空盘子。"
  npc_override_lasagna_lasagna_npcs_i_ll_tell_you_today_e039dd: "我来告诉你今天的护符。它是……"
  npc_override_lasagna_lasagna_npcs_i_ll_think_about_i_83b475: "我会考虑的。我甚至不知道那是什么。我不知道它是什么就无法答应你。"
