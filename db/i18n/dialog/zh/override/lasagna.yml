  npc_override_lasagna_lasagna_npcs_make_sure_knock_keep_you_326ed5: "务必敲门。保持礼貌。"
  npc_override_lasagna_lasagna_npcs_make_sure_you_deliver_my_0545b3: "务必把我的口信带给水手长。今天的护符是 20 个巴西尔和 5 个巴西尔锁。"
  npc_override_lasagna_lasagna_npcs_makes_whiffing_sound_32aa8b: "～发出呼呼声～"
