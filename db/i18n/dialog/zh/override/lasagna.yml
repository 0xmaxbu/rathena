  npc_override_lasagna_lasagna_npcs_top_they_also_discovered_87ab8b: "最重要的是，他们还发现了一条通往米德加尔特大陆的新航路！"
  npc_override_lasagna_lasagna_npcs_try_again_2dc228: "- 再试一次。 -"
  npc_override_lasagna_lasagna_npcs_try_again_624fb2: "再试一次。"
  npc_override_lasagna_lasagna_npcs_try_make_him_talk_again_4055b0: "再试试让他开口。"
  npc_override_lasagna_lasagna_npcs_tuna_served_again_first_15b077: "又是金枪鱼。第一天是金枪鱼，第二天是金枪鱼意面，第三天是炸金枪鱼，第四天是炖金枪鱼……我吃腻了。刚刚才吃过。我们是不是惹副厨师长生气了？"
  npc_override_lasagna_lasagna_npcs_tut_4aa53a: "啧。"
  npc_override_lasagna_lasagna_npcs_twinkle_twinkle_little_s_bf789f: "一闪一闪亮晶晶——满天都是小星星——"
  npc_override_lasagna_lasagna_npcs_uh_boatswain_person_who_22718c: "呃，那个水手长就是向我求助的人。"
  npc_override_lasagna_lasagna_npcs_uh_yes_i_m_sorry_34f848: "呃……是的。对不起。我不是故意的。"
  npc_override_lasagna_lasagna_npcs_uh_you_legalas_who_suppl_07c45a: "呃，你是供应卡鲁纳的莱加拉斯吗？"
  npc_override_lasagna_lasagna_npcs_um_did_you_really_catch_7d2c02: "嗯，你真的抓到甜罗达蛙了？"
  npc_override_lasagna_lasagna_npcs_unfair_dda60c: "这不公平。"
  npc_override_lasagna_lasagna_npcs_unfair_i_haven_t_known_260b77: "我到现在才知道这个方法，真不公平！"
  npc_override_lasagna_lasagna_npcs_unfortunately_i_became_u_525a9f: "但不幸的是，^0000cd我再也不能上船了^000000。我不能告诉你为什么。这是机密信息。"
  npc_override_lasagna_lasagna_npcs_unfortunately_most_pages_91cbaf: "不幸的是，大部分书页在大火中遗失了。我几乎认不出残存的文件。"
  npc_override_lasagna_lasagna_npcs_unfortunately_those_page_759145: "不幸的是，那些书页包含^0000cd关于甘贝里船长的记录^000000。因为甘贝里是我们的船长，我已尽最大努力制作这份记录。"
  npc_override_lasagna_lasagna_npcs_up_above_world_so_high_059e4d: "挂在天上放光明——好像许多小眼睛——"
  npc_override_lasagna_lasagna_npcs_up_level_village_hypnoti_75806d: "等级达到 49 级之前，村里的催眠师可以重置你的状态和技能。"
  npc_override_lasagna_lasagna_npcs_up_level_your_skills_sta_49be3b: "^4d4dff在等级 49 级之前，你的技能和状态可以随时重置。^000000"
  npc_override_lasagna_lasagna_npcs_upgrade_a6f47e: "升级"
  npc_override_lasagna_lasagna_npcs_upgrade_amulet_b7211f: "升级护符"
  npc_override_lasagna_lasagna_npcs_use_butterfly_wings_item_def3c8: "使用 ^4d4dff蝴蝶翅膀^000000 物品可直接飞往该位置。"
  npc_override_lasagna_lasagna_npcs_use_equip_item_double_cl_76754d: "要使用或装备物品，^4d4dff双击该物品^000000，或"
  npc_override_lasagna_lasagna_npcs_use_equip_item_equipment_3e90b8: "^4d4dff要使用或装备已注册在槽位中的物品或装备，按下从 F1 到 F9 对应每个槽位的按键即可。^000000"
  npc_override_lasagna_lasagna_npcs_use_thorny_vine_flute_2a005f: "使用荆棘藤笛"
  npc_override_lasagna_lasagna_npcs_using_soft_island_as_bas_d416c2: "以软岛为基地，蝴蝶号已经在新世界站稳脚跟并开始盈利。他们天生就是做生意的料。"
  npc_override_lasagna_lasagna_npcs_vigilance_corps_merchant_006684: "^0000cd义警团和商人^000000是……嗯……在运营千层面的几个组织中，你可以说这两个组织创造了今天的千层面。而甘贝里、托马斯和我是其中的核心。"
  npc_override_lasagna_lasagna_npcs_vigilante_chef_2a9de9: "义警厨师"
  npc_override_lasagna_lasagna_npcs_vigilante_corp_only_main_4ce0fc: "义警团不仅维护城镇治安，还在城镇运营中扮演主要角色。"
  npc_override_lasagna_lasagna_npcs_vigilante_haven_t_been_a_813562: "义警团成立时间不长，但在我们出现之前，千层面是一个衰败的城镇，多亏了我们，现在城镇才繁荣起来！"
  npc_override_lasagna_lasagna_npcs_vigilante_s_job_assist_d_ddcc91: "义警的工作除了维护治安外，还包括协助在新大陆远征的喵族，所以请多多帮忙。"
  npc_override_lasagna_lasagna_npcs_vigilantes_over_here_the_47fadc: "义警们！这边！有人在这里诱骗人们上船！"
  npc_override_lasagna_lasagna_npcs_vit_vitality_which_indic_1f3f0f: "^4d4dffVIT 是生命力，代表健康^000000。它能^4d4dff提升你的总体 HP^000000。"
  npc_override_lasagna_lasagna_npcs_waa_aah_meow_73a637: "哇——啊——喵"
  npc_override_lasagna_lasagna_npcs_waa_d415d0: "哇。"
  npc_override_lasagna_lasagna_npcs_waa_waa_1620a7: "哇哇！"
  npc_override_lasagna_lasagna_npcs_waa_waa_a2d663: "哇。哇！"
  npc_override_lasagna_lasagna_npcs_waa_waa_eabe6e: "哇。哇。"
  npc_override_lasagna_lasagna_npcs_wahaha_another_victory_m_9fea9b: "哇哈哈！我又赢了！真是收获满满的一天！"
  npc_override_lasagna_lasagna_npcs_wait_box_looks_familiar_1ec0f4: "等等。这个箱子看起来很眼熟……"
  npc_override_lasagna_lasagna_npcs_wait_guy_holding_dda4c8: "等等，那个家伙拿着……"
  npc_override_lasagna_lasagna_npcs_wait_take_you_come_handy_73f356: "等等，带上这个。紧急情况下会用得上。请小心！"
  npc_override_lasagna_lasagna_npcs_waited_long_time_almost_27ae93: "等了好久。差点等死了。"
  npc_override_lasagna_lasagna_npcs_want_some_tiger_strike_s_5ff040: "想来点猛虎拳之类的吗？"
  npc_override_lasagna_lasagna_npcs_warehouse_service_a6fda5: "仓库服务"
  npc_override_lasagna_lasagna_npcs_warehouse_service_also_s_a9ba42: "^4d4dff仓库服务^000000也是类似的。"
  npc_override_lasagna_lasagna_npcs_warehouse_service_costs_97ecc9: "仓库服务费用为 50 Zeny。"
  npc_override_lasagna_lasagna_npcs_wasn_t_supposed_lengthy_77f7c3: "本来不应该这么长的。"
  npc_override_lasagna_lasagna_npcs_water_element_superior_f_d5def6: "水属性优于火属性。"
  npc_override_lasagna_lasagna_npcs_way_how_s_your_settlemen_3ebee0: "话说回来，你在这片土地上安顿得怎么样？"
  npc_override_lasagna_lasagna_npcs_way_please_dda474: "这边请。"
  npc_override_lasagna_lasagna_npcs_way_there_shining_grass_cf9297: "顺便说一下，这个世界上有^4d4dff闪耀的草^000000。"
  npc_override_lasagna_lasagna_npcs_way_things_you_only_need_854420: "照现在这样，如果你想加入义警团并参加\\\\\\\\\\\\\\\"米德加尔特远征\\\\\\\\\\\\\\\"，只需要通过一个简单的测试。"
  npc_override_lasagna_lasagna_npcs_way_we_re_going_see_817fd2: "话说回来，我们明天还会再见面的，对吧？"
  npc_override_lasagna_lasagna_npcs_way_you_get_upper_hand_0134ba: "这样你就能在战斗中占据上风。"
  npc_override_lasagna_lasagna_npcs_way_you_know_what_skill_35a217: "话说，你知道什么是^4d4dff技能树^000000吗？"
  npc_override_lasagna_lasagna_npcs_we_accept_people_new_con_0294a4: "我们现在接受新大陆的人了吗？"
  npc_override_lasagna_lasagna_npcs_we_all_kinds_chores_hand_bb27cd: "我们做各种杂活，从处理港口的顽童到维护村庄的治安。"
  npc_override_lasagna_lasagna_npcs_we_almost_lost_all_our_fae7e0: "我们差点失去了所有想买鱼糕的顾客。非常感谢！"
  npc_override_lasagna_lasagna_npcs_we_aren_t_as_laid_fb8ebb: "我们可不像你们那么懒散。"
  npc_override_lasagna_lasagna_npcs_we_cannot_quite_trust_st_86cf98: "我们不太能相信佩佩隆奇诺讲的故事。我不能记录我不相信的故事。"
  npc_override_lasagna_lasagna_npcs_we_cannot_sail_off_like_8641ad: "我们不能就这样起航。"
  npc_override_lasagna_lasagna_npcs_we_caught_storm_parted_t_2e4941: "我们遇到了一场风暴，与^0000cd托马斯船长的纳维号^000000失散了。我们一直在寻找纳维号。"
  npc_override_lasagna_lasagna_npcs_we_d_better_head_square_f2e118: "我们最好去广场。"
  npc_override_lasagna_lasagna_npcs_we_didn_t_get_orders_69418f: "我们很少接到这道菜的订单，所以很奇怪有这么多需求。是不是终于传开了说它好吃？"
  npc_override_lasagna_lasagna_npcs_we_doing_charity_work_he_e31527: "我们不是在做慈善。我们训练有前途的喵族，派他们去新大陆为喵族争光。这就是训练你们的原因。"
  npc_override_lasagna_lasagna_npcs_we_don_t_wear_clothes_c58e56: "我们不穿衣服。"
  npc_override_lasagna_lasagna_npcs_we_drink_together_00c065: "我们可以一起喝！"
  npc_override_lasagna_lasagna_npcs_we_gathered_those_lousy_123dd6: "我们召集了那些糟糕的喵族，把他们送到义警团和商人那里。千层面的^0000cd治安由义警团负责^000000，^0000cd所有与产品相关的事务由商人负责^000000。"
  npc_override_lasagna_lasagna_npcs_we_get_rid_fog_8f59fb: "我们能驱散雾吗？"
  npc_override_lasagna_lasagna_npcs_we_go_anywhere_if_we_9b6733: "只要有风和帆，我们哪里都能去。"
  npc_override_lasagna_lasagna_npcs_we_gracious_enough_give_f7c20a: "我们慷慨到给你们这样的人类一个去千层面的机会。"
  npc_override_lasagna_lasagna_npcs_we_heading_new_world_loa_6df03e: "我们正满载物资前往新世界。我一直想仔细看看，这是个绝佳的机会。"
  npc_override_lasagna_lasagna_npcs_we_legendary_vigilante_c_03bc16: "我们是保护千层面的传奇义警团！"
  npc_override_lasagna_lasagna_npcs_we_ll_continue_after_you_a80ed3: "我们等你回来再继续。"
  npc_override_lasagna_lasagna_npcs_we_ll_move_right_next_275d28: "我们直接进入下一个测试。"
  npc_override_lasagna_lasagna_npcs_we_lost_butterfly_storm_ee2854: "我们离开里希塔乐港第二天遇到的风暴中失去了蝴蝶号。我们回到千层面时，谁都说不出话来。"
  npc_override_lasagna_lasagna_npcs_we_make_some_fish_cake_d6ef1b: "我们今天能做点鱼糕吗？我求你了。别让我送走那些空手而归的客人。他们大老远来就是为了鱼糕。"
  npc_override_lasagna_lasagna_npcs_we_met_storm_everyone_we_8a638c: "我们遇到了一场风暴。大家都做好了充分准备，所以损失不大。我想这就是所谓的经验之谈吧。"
  npc_override_lasagna_lasagna_npcs_we_need_something_as_wel_f13e3e: "我们也需要做点什么。"
  npc_override_lasagna_lasagna_npcs_we_need_take_off_anytime_8f41c3: "我们随时都要起航了，但起航的准备工作还没做好。"
  npc_override_lasagna_lasagna_npcs_we_never_had_any_rats_e15660: "我们从来没有老鼠，但突然间船上有老鼠了。调查后发现，水手长……你真是……"
  npc_override_lasagna_lasagna_npcs_we_our_way_lasagna_capta_28afda: "我们正前往千层面。甘贝里船长和托马斯船长长谈了一番。"
  npc_override_lasagna_lasagna_npcs_we_re_almost_finished_ka_22e148: "但我们店里的卡鲁纳快用完了，供应我们的人已经好几天没来了。连库存都快没了。"
  npc_override_lasagna_lasagna_npcs_we_re_communing_48d548: "我们在沟通。"
  npc_override_lasagna_lasagna_npcs_we_re_full_so_there_e66929: "我们吃饱了，所以只剩下一件事要做。睡觉。"
  npc_override_lasagna_lasagna_npcs_we_re_team_245fd5: "我们是一个团队。"
  npc_override_lasagna_lasagna_npcs_we_re_thoroughly_prepare_842cb8: "我们准备得很充分！"
  npc_override_lasagna_lasagna_npcs_we_run_into_storms_so_48cb63: "我们经常遇到风暴，我在想是不是该改变航线了。幸好我们避开了里希塔乐港的风暴。"
  npc_override_lasagna_lasagna_npcs_we_see_i_ll_come_88a229: "走着瞧吧。我想来的时候会来的。"
  npc_override_lasagna_lasagna_npcs_we_sent_someone_hurry_fi_741afe: "我们派了人赶紧去找蘑菇孢子，但一无所获。一点消息都没有。"
  npc_override_lasagna_lasagna_npcs_we_t_call_test_if_5ac822: "如果你插手的话，就不能称之为测试了，对吧？"
  npc_override_lasagna_lasagna_npcs_we_trim_your_beards_we_1cd8f8: "我们修剪你的胡须。我们梳理你的尾巴。出发去新世界之前一定要打扮好自己。"
  npc_override_lasagna_lasagna_npcs_we_unable_issue_sailing_f47af4: "由于雾的影响，我们无法发出起航信号。去问^0000cd首席官^000000航行时间表是否有变化。如果有变化，去处理一下。"
  npc_override_lasagna_lasagna_npcs_we_ve_gotten_along_prett_465522: "我们一直相处得不错，但最近它们开始在千层面惹麻烦了。"
  npc_override_lasagna_lasagna_npcs_we_weren_t_born_same_9a24ad: "我们不是同一天出生的，但让我们在同一天死去吧！"
  npc_override_lasagna_lasagna_npcs_we_wish_you_pleasant_day_de7c63: "祝您在孔-克利纳号上度过愉快的一天！"
  npc_override_lasagna_lasagna_npcs_we_wondering_if_we_had_40adba: "我们还在想是不是要下去把你的尸体拖回来……"
  npc_override_lasagna_lasagna_npcs_weather_good_today_isn_t_305630: "今天天气不错，不是吗？"
  npc_override_lasagna_lasagna_npcs_weather_sunny_warm_25c121: "天气晴朗温暖，但是……"
  npc_override_lasagna_lasagna_npcs_weird_ship_firm_why_so_4bd9a2: "奇怪。船很稳，但为什么这么恶心？"
  npc_override_lasagna_lasagna_npcs_welcome_724486: "欢迎。"
  npc_override_lasagna_lasagna_npcs_welcome_board_welcome_co_147ba1: "欢迎登船。欢迎来到^0000cd孔-克利纳号^000000。我们会安全送你到达目的地。不过，我们现在还不能起航。"
  npc_override_lasagna_lasagna_npcs_welcome_thank_you_your_e_5c7fcd: "欢迎。感谢你的努力。现在请汇报吧。"
  npc_override_lasagna_lasagna_npcs_well_24e5b9: "嗯，这是……"
  npc_override_lasagna_lasagna_npcs_well_don_t_bring_dishono_312c52: "好了，别给喵族丢脸，好吗？不过，既然你在这里受过训练，无论在哪里你都能发挥自己的作用。祝你好运。"
  npc_override_lasagna_lasagna_npcs_well_don_t_i_new_6a93cc: "嗯，我面前不是有个^0000cd新帮手^000000吗？"
  npc_override_lasagna_lasagna_npcs_well_he_may_had_some_a449a8: "嗯，他可能有一定的影响力……"
  npc_override_lasagna_lasagna_npcs_well_he_s_denial_i_1e1d0e: "嗯，他在否认，但我觉得他是被恶灵附身了。他在一个无人岛上打开了一个密封的罐子。"
  npc_override_lasagna_lasagna_npcs_well_he_seems_living_off_8a3e3f: "嗯……他似乎靠一个又一个的迷信活着。比如玩偶和盐。"
  npc_override_lasagna_lasagna_npcs_well_how_i_find_dragon_3f43bc: "嗯，我怎么才能找到龙巢？"
  npc_override_lasagna_lasagna_npcs_well_i_after_basilisks_j_c93298: "嗯，我刚才在追踪巴西利斯克。"
  npc_override_lasagna_lasagna_npcs_well_i_am_sure_we_7159ef: "嗯，我不确定。我们需要用其他版本来核实这个故事。因为有出入，我不能仅凭甘贝里船长的话来做记录。"
  npc_override_lasagna_lasagna_npcs_well_i_don_t_know_037d4f: "嗯……我对商队不太了解！"
  npc_override_lasagna_lasagna_npcs_well_i_don_t_mean_55e516: "嗯……我不是说……嗯……好吧 10 秒到了。给我带^0000cd3 个巴西尔岩石^000000，不能少。别让人知道。如果你告诉别人，我会让你后悔的。"
  npc_override_lasagna_lasagna_npcs_well_i_don_t_think_20011d: "嗯，我觉得从他那里问不出更多了，但如果有什么新消息我会告诉你的。"
  npc_override_lasagna_lasagna_npcs_well_i_guess_time_me_60b919: "嗯，我想是时候离开这些宝贵的经历，去寻找新的冒险了。"
  npc_override_lasagna_lasagna_npcs_well_i_guess_you_say_bd61c5: "嗯，我想你可以这么说……"
  npc_override_lasagna_lasagna_npcs_well_i_ll_back_fff634: "嗯，我会回来的。"
  npc_override_lasagna_lasagna_npcs_well_just_as_i_heard_a83d53: "……嗯，正如我从萨满喵那里听到的。我被告知水手长会让我来做。"
  npc_override_lasagna_lasagna_npcs_well_magchi_used_wield_s_cc3f6b: "嗯，马奇过去常用某种长棍。也许那有用。^0000cd至少 20 只^000000必须在它们逃跑之前处理掉。"
  npc_override_lasagna_lasagna_npcs_well_now_open_skill_wind_2a3c2f: "好了，现在。打开技能窗口，把急救技能放到快捷键槽里使用。"
  npc_override_lasagna_lasagna_npcs_well_now_your_hp_being_b94153: "好了，现在。你的 HP 正在恢复，红色药草正在发挥作用。"
  npc_override_lasagna_lasagna_npcs_well_problems_occur_harb_227f71: "嗯，港口确实时不时会出现问题，但我觉得这对你来说不是问题。"
  npc_override_lasagna_lasagna_npcs_well_purser_sent_me_take_1c321c: "嗯……事务长派我来处理这个问题。"
  npc_override_lasagna_lasagna_npcs_well_s_me_i_should_c31fcc: "嗯，我要说的就这些。我该走了……"
  npc_override_lasagna_lasagna_npcs_well_s_particularly_impo_6cded9: "嗯，不是特别重要，但它就像是义警团的标志……"
  npc_override_lasagna_lasagna_npcs_well_s_really_because_we_b0fbbb: "嗯，真的不是因为我们人手不足……"
  npc_override_lasagna_lasagna_npcs_well_stello_con_chliina_0ee48a: "嗯，那是孔-克利纳号的斯特洛……"
  npc_override_lasagna_lasagna_npcs_well_thanks_anyway_i_did_0c4b4a: "嗯，不管怎样还是谢谢了。我本来也没指望你会帮我带来。我没什么可以给你的了。既然外面世界很危险，拿着这个吧。"
  npc_override_lasagna_lasagna_npcs_well_then_8a21b3: "那么。"
  npc_override_lasagna_lasagna_npcs_well_then_go_ahead_drink_c7cd31: "好，那么。^4d4dff去喝掉我给你的苹果汁吧。^000000"
  npc_override_lasagna_lasagna_npcs_well_then_i_am_counting_91af28: "那么。拜托你了。"
  npc_override_lasagna_lasagna_npcs_well_then_i_ll_let_1964e9: "好吧，那我来告诉你一些有趣的事。"
  npc_override_lasagna_lasagna_npcs_well_then_i_ll_your_c6e3a7: "好吧，那我就是你爸爸了！！"
  npc_override_lasagna_lasagna_npcs_well_then_i_m_counting_aad681: "好吧，那拜托你了。"
  npc_override_lasagna_lasagna_npcs_well_then_let_me_ask_fe35f8: "好吧，那我想请你帮个忙。请帮我带一些这本^0000cd食谱^000000里的食材。这个叫^0000cd玛斯黛拉果酒^000000的东西……我很好奇，但它需要一些这里找不到的食材。"
  npc_override_lasagna_lasagna_npcs_well_then_let_s_start_50a3d8: "好吧，那我们开始烹饪吧。准备好了再跟我说！"
  npc_override_lasagna_lasagna_npcs_well_then_safe_trip_515e6c: "好吧，那祝你一路平安。"
  npc_override_lasagna_lasagna_npcs_well_then_time_issue_sai_5655a1: "好吧。是时候发出起航信号了。"
  npc_override_lasagna_lasagna_npcs_well_there_s_no_choice_d717e6: "好吧，那没得选了。"
  npc_override_lasagna_lasagna_npcs_well_trained_4859e1: "训练有素的。"
  npc_override_lasagna_lasagna_npcs_well_two_should_enough_372526: "嗯……两个应该够了。"
  npc_override_lasagna_lasagna_npcs_well_uh_i_m_uh_b84a78: "嗯，呃……我……呃……我很自由奔放！就这样！"
  npc_override_lasagna_lasagna_npcs_well_we_re_no_different_b94251: "嗯，我们也没什么不同，因为我们以为天底下只有远星大陆。"
  npc_override_lasagna_lasagna_npcs_well_we_talk_about_later_56a480: "嗯，我们以后再说吧。我在想你什么时候回来。雾散的时候，我们就知道你成功了，亲爱的冒险者。感谢你的努力。"
  npc_override_lasagna_lasagna_npcs_well_well_you_seem_know_02e657: "嗯嗯。你看起来懂这里的规矩。你可以把它带给副厨师长。不过，副厨师长有点古怪。你递东西给他的时候得说点什么。"
  npc_override_lasagna_lasagna_npcs_well_you_met_all_them_403f80: "嗯。你见到他们所有人了吗？"
  npc_override_lasagna_lasagna_npcs_what_638f38: "这……是什么。"
  npc_override_lasagna_lasagna_npcs_what_89511a: "什么事？"
  npc_override_lasagna_lasagna_npcs_what_amazing_adventure_t_d8e69b: "那真是……多么精彩的冒险。谢谢你分享你的故事。我现在清楚地明白你端庄的举止从何而来了。"
  npc_override_lasagna_lasagna_npcs_what_babysitting_about_i_6d6248: "原来看孩子是这样的？我不知道。如果知道的话，我就不会做了。"
  npc_override_lasagna_lasagna_npcs_what_basilrock_246743: "什么是巴西尔岩石？"
  npc_override_lasagna_lasagna_npcs_what_be65b9: "什么？"
  npc_override_lasagna_lasagna_npcs_what_brought_you_all_way_22686d: "什么风把你吹到这里来了，人类？"
  npc_override_lasagna_lasagna_npcs_what_brought_you_here_91ee40: "什么风把你吹来了？"
  npc_override_lasagna_lasagna_npcs_what_brought_you_here_ab_1995b6: "什么风把你吹来了？是关于昨天的事吗？"
  npc_override_lasagna_lasagna_npcs_what_brought_you_here_yo_b7d753: "什么风把你吹来了？你是来见船长的吗？如果不是，请离开。你不应该在这里。"
  npc_override_lasagna_lasagna_npcs_what_did_we_wrong_anyway_7e54ad: "我们到底做错了什么？"
  npc_override_lasagna_lasagna_npcs_what_did_you_bring_somet_a51ead: "什么事？你带了吃的来吗？"
  npc_override_lasagna_lasagna_npcs_what_didn_t_you_say_166d0f: "什么事？你不是说你有事要找的不是我，而是卡鲁吗？"
  npc_override_lasagna_lasagna_npcs_what_earth_why_doesn_t_fc1016: "到底怎么回事！为什么它不会融化？"
  npc_override_lasagna_lasagna_npcs_what_going_ddc44b: "怎么回事？"
  npc_override_lasagna_lasagna_npcs_what_gross_looking_thing_783985: "这是什么恶心的东西？"
  npc_override_lasagna_lasagna_npcs_what_happened_favor_i_as_851319: "我托你办的事怎么样了。4 个玛斯黛拉果和 1 个猫粮硬饼。"
  npc_override_lasagna_lasagna_npcs_what_he_saying_2fed23: "他在说什么？"
  npc_override_lasagna_lasagna_npcs_what_hunter_desert_wolf_88f712: "这世上哪有什么沙漠之狼猎手吃鱼？而且还是鱼干！"
  npc_override_lasagna_lasagna_npcs_what_i_2368fe: "我该怎么办？"
  npc_override_lasagna_lasagna_npcs_what_i_95f33d: "我该怎么处理它？"
  npc_override_lasagna_lasagna_npcs_what_i_finished_training_326435: "什么？我昨天就完成训练了。"
  npc_override_lasagna_lasagna_npcs_what_i_gather_legalas_fe_b1d62b: "据我所知，莱加拉斯给你们吃、给你们穿、给你们住。"
  npc_override_lasagna_lasagna_npcs_what_i_hear_you_eat_c1d873: "我听说你们把莱加拉斯清洗好的卡鲁尼亚克全吃光了。现在，我们用那些卡鲁尼亚克做的卡鲁纳快用完了。你们能稍微克制一下吗？"
  npc_override_lasagna_lasagna_npcs_what_i_need_day_bun_26cd56: "我今天需要的是^0000cd包子^000000。千层面也有类似的东西，但食谱完全不同。"
  npc_override_lasagna_lasagna_npcs_what_i_need_day_cat_69026d: "我今天需要的是^0000cd猫粮硬饼和马兰多罐头食品^000000。我很好奇纳维号的船员是如何度过这么漫长的航程的。"
  npc_override_lasagna_lasagna_npcs_what_i_should_become_sha_053be7: "什么？我应该成为萨满喵？真是胡说八道！我是个水手！我要作为水手死在海上！"
  npc_override_lasagna_lasagna_npcs_what_i_want_isn_t_a61ef6: "我要的并不过分。"
  npc_override_lasagna_lasagna_npcs_what_i_you_3d61cf: "我能为你做什么？"
  npc_override_lasagna_lasagna_npcs_what_if_monster_takes_my_272fb1: "如果怪物带走我哥哥怎么办？那个怪物肯定会很疼……"
  npc_override_lasagna_lasagna_npcs_what_if_some_bad_news_449022: "如果即使我努力为他们的安全制作这些护符，还是传来坏消息怎么办？"
  npc_override_lasagna_lasagna_npcs_what_isn_t_boat_stuck_4d6e85: "什么？船不是稳稳地卡在水面上吗？！"
  npc_override_lasagna_lasagna_npcs_what_kind_food_you_like_87fde3: "你喜欢吃什么类型的食物？因为智力或幸运菜对你没什么用，你现在可以制作四种菜。"
  npc_override_lasagna_lasagna_npcs_what_look_your_eyes_you_9ef227: "你眼神是什么意思？你觉得我很可怜喵？"
  npc_override_lasagna_lasagna_npcs_what_mean_a57d36: "那是什么意思？"
  npc_override_lasagna_lasagna_npcs_what_mean_a5ed46: "这是什么意思？"
  npc_override_lasagna_lasagna_npcs_what_missing_pages_about_0db4af: "缺失的那些页面是关于什么的？"
  npc_override_lasagna_lasagna_npcs_what_new_world_person_wa_9c785e: "一个新世界的人找我有什么事？"
  npc_override_lasagna_lasagna_npcs_what_pain_if_grandma_i_c051ed: "是什么痛苦？如果奶奶和我能处理，我们会处理的。人不该对有困难的人视而不见。"
  npc_override_lasagna_lasagna_npcs_what_people_midgard_5d7bb4: "米德加尔特的人能做什么……？"
  npc_override_lasagna_lasagna_npcs_what_reason_so_impetuous_e93dc3: "这么年轻就这么急躁，是什么原因？"
  npc_override_lasagna_lasagna_npcs_what_relief_did_tell_you_3230e1: "真是松了口气！但他有告诉你是什么导致他延误的吗？"
  npc_override_lasagna_lasagna_npcs_what_rude_ungrateful_dor_149594: "真是粗鲁、忘恩负义的喵族。"
  npc_override_lasagna_lasagna_npcs_what_s_front_you_lasagna_a49945: "你面前的是港口村庄千层面。"
  npc_override_lasagna_lasagna_npcs_what_s_gotten_into_you_2c0599: "你怎么了？"
  npc_override_lasagna_lasagna_npcs_what_s_more_jogi_keeps_fa2274: "更糟的是，约吉一直在森林附近游荡，说他要参加民兵队。妈妈说那很危险……"
  npc_override_lasagna_lasagna_npcs_what_s_problem_9ff19d: "有什么问题？"
  npc_override_lasagna_lasagna_npcs_what_s_up_4e6df1: "怎么了？"
  npc_override_lasagna_lasagna_npcs_what_s_worse_dorams_who_67ae3d: "更糟的是，从千层面以外来的喵族经常惹麻烦。这真是让义警团头疼。"
  npc_override_lasagna_lasagna_npcs_what_s_your_name_c88dda: "你叫什么名字？"
  npc_override_lasagna_lasagna_npcs_what_should_we_next_abec0b: "我们接下来该做什么？"
  npc_override_lasagna_lasagna_npcs_what_splendid_thorn_ddd764: "好漂亮的荆棘。"
  npc_override_lasagna_lasagna_npcs_what_strings_aeb640: "鱼串是什么？"
  npc_override_lasagna_lasagna_npcs_what_such_dangerous_miss_44e85b: "什么？居然是这么危险的任务？"
  npc_override_lasagna_lasagna_npcs_what_they_look_like_you_10c7c7: "它们长什么样？你一眼就能认出来。你不会错过的！"
  npc_override_lasagna_lasagna_npcs_what_true_f1a090: "什么！是真的！"
  npc_override_lasagna_lasagna_npcs_what_unfair_5de113: "什么不公平？"
  npc_override_lasagna_lasagna_npcs_what_us_fa912c: "那跟我们有什么关系？"
  npc_override_lasagna_lasagna_npcs_what_wait_b77ee5: "什么？等等……那是……"
  npc_override_lasagna_lasagna_npcs_what_we_call_potion_you_440b1c: "这就是我们所说的药水，随时随地都可以服用！"
  npc_override_lasagna_lasagna_npcs_what_we_called_before_80c50b: "我们以前叫什么来着？"
  npc_override_lasagna_lasagna_npcs_what_what_816f21: "什……什么事？"
  npc_override_lasagna_lasagna_npcs_what_what_did_you_just_0817a2: "什么？你刚才说什么？如果我没听错的话，你说你愿意帮我。"
  npc_override_lasagna_lasagna_npcs_what_what_did_you_say_89a0c8: "什么？你刚才说什么？水手小子？嘿！我不只是个水手小子，我是孔-克利纳号上处理各种杂务的宝贵人才！这艘船没我就开不了！"
  npc_override_lasagna_lasagna_npcs_what_who_broke_pussy_wil_4d0d27: "什么！谁折断了这枝柳枝！"
  npc_override_lasagna_lasagna_npcs_what_you_doing_here_did_676dd8: "你在这里做什么？你错过船了吗？"
  npc_override_lasagna_lasagna_npcs_what_you_doing_new_way_92b592: "你在做什么？这是一种新的寻死方式吗？我不怕挑战。拔刀吧。"
  npc_override_lasagna_lasagna_npcs_what_you_doing_such_rust_953a60: "但你在这穷乡僻壤做什么？去更大的世界闯荡不是更好吗？比如新世界。"
  npc_override_lasagna_lasagna_npcs_what_you_don_t_get_93cd8d: "为了什么？猎杀巴西利斯克没什么好处。"
  npc_override_lasagna_lasagna_npcs_what_you_expect_me_witho_af5376: "没有食材你指望我做什么？"
  npc_override_lasagna_lasagna_npcs_what_you_going_give_me_ac14bc: "你要给我什么？你有很多武器吗？我能看看吗？你愿意用它交换 {0} 吗？"
  npc_override_lasagna_lasagna_npcs_what_you_going_then_ab3d79: "那你打算怎么办？"
  npc_override_lasagna_lasagna_npcs_what_you_mean_486ade: "那个？你什么意思？"
  npc_override_lasagna_lasagna_npcs_what_you_mean_8b5b11: "你什么意思？"
  npc_override_lasagna_lasagna_npcs_what_you_mean_save_you_ecb09d: "你说「救你」是什么意思？"
  npc_override_lasagna_lasagna_npcs_what_you_mean_you_don_2f9b79: "你说你不知道是什么意思？！"
  npc_override_lasagna_lasagna_npcs_what_you_mean_you_unders_41860a: "你说你明白是什么意思？你不该说那样的话。"
  npc_override_lasagna_lasagna_npcs_what_you_need_2ef875: "你需要什么？"
  npc_override_lasagna_lasagna_npcs_what_you_re_here_already_0685e5: "什么，你已经来帮忙了？"
  npc_override_lasagna_lasagna_npcs_what_you_talking_about_2c2738: "你们刚才在说什么？"
  npc_override_lasagna_lasagna_npcs_what_you_talking_about_fb4e69: "你在说什么？"
  npc_override_lasagna_lasagna_npcs_what_you_talking_about_g_c421a8: "你在跟客人说什么呢？"
  npc_override_lasagna_lasagna_npcs_what_you_talking_about_y_b4509e: "你在说什么？那天你一定喝得很醉。在广阔的大海上经历那么多事，冒险者还有什么可求的？"
  npc_override_lasagna_lasagna_npcs_what_you_think_cd736b: "你觉得呢？"
  npc_override_lasagna_lasagna_npcs_what_you_think_want_give_f02076: "你觉得呢？想再试一次吗？"
  npc_override_lasagna_lasagna_npcs_what_you_want_9b4b57: "你想要什么？"
  npc_override_lasagna_lasagna_npcs_what_you_want_me_help_5d5c4a: "你想让我帮你做什么？"
  npc_override_lasagna_lasagna_npcs_what_you_went_after_basi_ab03f2: "什么？你去追踪巴西利斯克了？你？"
  npc_override_lasagna_lasagna_npcs_whatever_happened_our_pa_4a376e: "我们的父母到底怎么了？～突然大哭起来～"
  npc_override_lasagna_lasagna_npcs_whatever_i_ll_look_shoul_d3ca76: "不管是什么，我去找。在这里找起来应该需要些时间。但在此期间，你能对付它们吗？"
  npc_override_lasagna_lasagna_npcs_whatever_i_m_happy_i_e2f610: "不管是什么，我很高兴能吃到美味的食物。"
  npc_override_lasagna_lasagna_npcs_whatever_well_good_i_ll_e7acea: "不管是什么。好吧，那很好。我把你的第一个任务作为你的第一次实践。"
  npc_override_lasagna_lasagna_npcs_when_bow_tie_made_ll_646dde: "领结做好后，会绣上你的名字，挂在义警团的墙上。"
  npc_override_lasagna_lasagna_npcs_when_did_we_eat_because_42a76a: "我们什么时候因为想吃才吃过？更像是为了吃而吃。"
  npc_override_lasagna_lasagna_npcs_when_gamberry_thomas_gat_21db26: "当甘贝里和托马斯集结船队出航时，佩佩隆奇诺组建了法法尔义警团并管理至今，以维持千层面的治安。"
  npc_override_lasagna_lasagna_npcs_when_he_young_he_couldn_157189: "他年轻时，忍不住用暴力来改造那些流氓喵族。因此，他被称为千层面的疯狗。"
  npc_override_lasagna_lasagna_npcs_when_i_formed_vigilante_7b0a7c: "当我组建义警团时，许多人被我的个性所吸引并加入了我。"
  npc_override_lasagna_lasagna_npcs_when_i_kid_so_so_9d7efe: "我小时候，这里非常……非常艰苦……"
  npc_override_lasagna_lasagna_npcs_when_i_told_him_noble_e9f030: "当我告诉他\\\\\\\\\\\\\\\"来自新地方的贵人会解决问题\\\\\\\\\\\\\\\"时，我的意思是这个问题会转移到^0000cd一个新的人身上^000000。看来他误会了我的意思，把你派来了。"
  npc_override_lasagna_lasagna_npcs_when_i_younger_i_also_70cd6d: "我年轻的时候，也想成为伟大的人。"
  npc_override_lasagna_lasagna_npcs_when_ship_anchored_unkno_6a901b: "当船在一个未知岛屿停靠补给淡水时，我像往常一样探索了那个岛屿。我在那里发现了一个^0000cd密封的罐子^000000。"
  npc_override_lasagna_lasagna_npcs_when_we_jumped_into_spec_81b361: "当我们投身特产生意时，许多被我们感动的喵族想要帮忙。"
  npc_override_lasagna_lasagna_npcs_when_we_went_through_den_f27f4f: "当我们穿过突然出现的浓雾时，出现了一个我们从未见过的岛屿。蝴蝶号的船员们就在那里，他们看上去就像当地人一样自然。"
  npc_override_lasagna_lasagna_npcs_when_you_arrive_village_8c2c7d: "^4d4dff当你到达村庄时，先找道具店，把这个箱子送过去。^000000"
  npc_override_lasagna_lasagna_npcs_when_you_come_back_later_6e1b0b: "当你稍后回来时，^0000cd我会教你如何烹饪^000000。这是我道歉的方式。好了，你现在可以走了。"
  npc_override_lasagna_lasagna_npcs_when_you_get_out_village_b7b7bf: "当你走出村子时，田地右端有一个洞穴，那里住着叫^0000cd巴西利斯克^000000的令人不快的蛇。你可以从它们那里获得。"
  npc_override_lasagna_lasagna_npcs_when_you_go_somewhere_wh_1ca12c: "当你去一个谁也不认识的地方时，来自同一城镇的喵族可以成为你最好的朋友。所以我建议你现在就尽量多认识一些人。"
  npc_override_lasagna_lasagna_npcs_when_you_live_alone_long_63a279: "当你独自生活很久时，会对最微小的声音变得敏感。那你来这里是为什么？我现在没有卡鲁纳牛奶了。你想点别的吗？"
  npc_override_lasagna_lasagna_npcs_where_3764ad: "哪里？"
  npc_override_lasagna_lasagna_npcs_where_adventurer_club_no_c60cbb: "现在是冒险者俱乐部的地方，过去曾是^0000cd烤箱酒馆^000000。那里曾经卖卡鲁纳牛奶。你可以去见那家店的^0000cd第一任老板^000000。不过……"
  npc_override_lasagna_lasagna_npcs_where_s_lunchbox_where_s_b7a815: "便当在哪里？我的呢？没有我的！你把它丢在哪里了？我的食物！我的食物！！！"
