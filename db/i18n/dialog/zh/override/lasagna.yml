  npc_override_lasagna_lasagna_npcs_me_you_look_like_newbie_d0a181: "在我看来，你像个刚刚翻过山脊的新手冒险者，喵。"
  npc_override_lasagna_lasagna_npcs_means_customers_who_came_95a30b: "这意味着那些为卡鲁纳牛奶而来的顾客就白跑一趟了。"
  npc_override_lasagna_lasagna_npcs_means_you_no_longer_rece_c7dcda: "- 这意味着你不能再领取任何物品了。 -"
  npc_override_lasagna_lasagna_npcs_meanwhile_earth_element_133697: "同时，地属性绝对优于风属性。"
  npc_override_lasagna_lasagna_npcs_meeow_55d669: "喵……"
  npc_override_lasagna_lasagna_npcs_meeow_another_out_towner_f6506d: "喵？？又是一个我没见过的外地喵族吗？"
  npc_override_lasagna_lasagna_npcs_meeowww_9b27bc: "……喵呜……"
  npc_override_lasagna_lasagna_npcs_menu_options_55a293: "{0} : 不，我没有。"
  npc_override_lasagna_lasagna_npcs_menu_options_af55f8: "{0} : 什么？？？"
  npc_override_lasagna_lasagna_npcs_menu_the_df1af5: "护符仍然有效。在^0000cd凌晨 4 点^000000之后去找萨满喵，带来明天的护符。"
