  npc_override_lasagna_lasagna_npcs_mature_doram_doesn_t_hol_17cdab: "成熟的喵族不会执着于这种事。你可以走了。我们正要起航。"
  npc_override_lasagna_lasagna_npcs_may_great_help_you_a1ddaa: "这对你可能会大有帮助！"
  npc_override_lasagna_lasagna_npcs_may_help_you_ease_your_acef58: "它可以帮助你在船上走动时放松心情。只要你注意礼节，大家都会欢迎你。"
  npc_override_lasagna_lasagna_npcs_may_i_ask_more_favors_8b1702: "我下次还能再请你帮忙吗？你知道的，那些食材。"
  npc_override_lasagna_lasagna_npcs_may_i_help_you_5a540b: "我能帮你吗？"
