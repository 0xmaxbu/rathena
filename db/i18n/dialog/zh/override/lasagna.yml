  npc_override_lasagna_lasagna_npcs_listening_other_people_s_8a979f: "倾听他人的冒险故事是冒险者的美德之一。如果你能仔细倾听并向他人学习，那将是宝贵的人生教训。"
  npc_override_lasagna_lasagna_npcs_little_doram_starts_whin_acdc8a: "小喵族开始抱怨，同时偷偷注意着旁边成年喵族的反应。"
  npc_override_lasagna_lasagna_npcs_little_importance_a292f4: "这点不重要……"
  npc_override_lasagna_lasagna_npcs_little_present_prepared_497384: "这是法法尔义警团团长和孔-克利纳号船长为了庆祝第一次任务而为新手冒险者准备的小礼物。"
  npc_override_lasagna_lasagna_npcs_living_history_lasagna_42daad: "千层面的活历史。"
  npc_override_lasagna_lasagna_npcs_ll_restore_your_stamina_083165: "当你疲劳时服用，它会恢复你的体力。"
