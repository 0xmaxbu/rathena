  npc_override_lasagna_lasagna_npcs_really_698094: "Not really..."
  npc_override_lasagna_lasagna_npcs_really_afb342: "It really was..."
  npc_override_lasagna_lasagna_npcs_really_did_you_join_forc_bc7248: "Really? Did you join by force?"
  npc_override_lasagna_lasagna_npcs_really_e7da47: "Really?"
  npc_override_lasagna_lasagna_npcs_really_he_seemed_really_473f51: "Not really. He seemed really energetic."
  npc_override_lasagna_lasagna_npcs_really_hours_too_short_w_338b24: "Really, 24 hours are too short. We should hire one more person!"
  npc_override_lasagna_lasagna_npcs_really_i_didn_t_know_8a5833: "Really? I didn't know."
  npc_override_lasagna_lasagna_npcs_really_interested_a9e6f6: "Not really interested."
  npc_override_lasagna_lasagna_npcs_really_then_did_magchi_m_d3927d: "Really? Then did Magchi make up that story? And are you going to take care of them?"
  npc_override_lasagna_lasagna_npcs_really_then_you_may_need_a79fa0: "Really? Then you may not need this either. Too bad. I have prepared it for you. I guess it belongs to someone else now."
  npc_override_lasagna_lasagna_npcs_really_you_ll_help_me_8a5e87: "Really... you'll help me? Even after I had hit you? Well, I'm so grateful if you can because I need some help right now."
  npc_override_lasagna_lasagna_npcs_reckless_attacks_no_use_794289: "...Reckless attacks are of no use!"
  npc_override_lasagna_lasagna_npcs_red_grass_blue_grass_gre_e8f0b1: "^4d4dffRed Grass, Blue Grass, Green Grass, White Grass...^000000etc..."
  npc_override_lasagna_lasagna_npcs_red_herbs_running_out_7559ac: "Red Herbs are running out."
  npc_override_lasagna_lasagna_npcs_red_yarn_take_you_place_94ee22: "Red yarn will take you to the place you want to go, and the yellow road will take you home. don't forget. If you get lost, follow the red yarn."
  npc_override_lasagna_lasagna_npcs_refers_brotherhood_forme_e323d8: "Refers to the brotherhood formed in agreement by Thomas, Peperoncino, and Gamberry."
  npc_override_lasagna_lasagna_npcs_relief_all_had_been_gone_ab84f4: "It was a relief that not all of it had been gone..."
  npc_override_lasagna_lasagna_npcs_relief_we_more_people_he_6d7e9c: "It is a relief that we have more people to hear the story from, other than Captain Gamberi."
  npc_override_lasagna_lasagna_npcs_remember_peace_tartufi_p_b3a397: "Remember, the peace of Tartufi is the peace of the ocean. It means hope. Please ingratiate yourself with Tartufi."
  npc_override_lasagna_lasagna_npcs_reset_status_d19cd4: "Reset the status."
  npc_override_lasagna_lasagna_npcs_return_town_5e8e05: "Return to the town. -"
  npc_override_lasagna_lasagna_npcs_right_click_item_view_it_91b525: "^4d4dffRight-click an item to view its detailed description.^000000"
  npc_override_lasagna_lasagna_npcs_right_click_scroll_then_cef914: "^4d4dffRight-click the scroll,^000000 and then, click the ^4d4dffbook-shaped icon^000000 found in the description window."
  npc_override_lasagna_lasagna_npcs_right_concludes_test_ed1a3f: "Right... That concludes the test."
  npc_override_lasagna_lasagna_npcs_right_d016e9: "Right?"
  npc_override_lasagna_lasagna_npcs_right_fbc63d: "Right."
  npc_override_lasagna_lasagna_npcs_right_i_ve_been_living_d5890b: "Right. I've been living in Lasagna all this time and never been on a ship. This is a good chance to board on one."
  npc_override_lasagna_lasagna_npcs_right_if_we_use_he_a3ffcf: "Right. If we use this, he won't be able to keep his mouth shut for much longer!"
  npc_override_lasagna_lasagna_npcs_right_now_effort_being_c_f14eee: "And right now, that effort is being challenged."
  npc_override_lasagna_lasagna_npcs_right_right_411e5b: "Right, right."
  npc_override_lasagna_lasagna_npcs_right_s_what_i_m_f2832d: "Right. That's what I'm talking about. You always start or finish the day with kaluna milk. But that kaluna is nearly all gone!"
  npc_override_lasagna_lasagna_npcs_right_there_someone_who_a00d70: "Right. There was someone who needed help. You had a long day today, so perhaps you should go see him tomorrow."
  npc_override_lasagna_lasagna_npcs_right_they_re_aglio_olig_86ba6e: "Right! They're Aglio and Oligo!"
  npc_override_lasagna_lasagna_npcs_right_time_two_people_he_71ade7: "Right on time. Two people are here already and waiting."
  npc_override_lasagna_lasagna_npcs_right_timing_off_2f312b: "Right. Timing is off."
  npc_override_lasagna_lasagna_npcs_right_you_cannot_see_any_226a21: "Right. You cannot see anything. There is this ^0000cdthick fog^000000. I wonder if we would be able to set off now."
  npc_override_lasagna_lasagna_npcs_ring_help_you_gather_spe_42cdf2: "That ring will help you gather special experiences as a novice adventurer."
  npc_override_lasagna_lasagna_npcs_ring_prepared_captain_de_af9e8e: "And the ring is prepared by the captain. Dear captain?"
  npc_override_lasagna_lasagna_npcs_rookie_experience_workin_9e9cdb: "Rookie? Have experience working in this field? Well, it doesn't matter even if you don't. You can learn it easily."
  npc_override_lasagna_lasagna_npcs_rookies_go_through_these_24c187: "Rookies go through these four steps, but skilled workers pick up and simultaneously remove head and guts and throw it inside the container. They are capable of one-step method."
  npc_override_lasagna_lasagna_npcs_rope_tied_times_check_415078: "Rope tied 33 times, check."
  npc_override_lasagna_lasagna_npcs_rumor_among_humans_alche_35f2a6: "Rumor has it that, among humans, ^4d4dffAlchemist^000000, ^4d4dffCreator^000000, or the upper-level ^4d4dffGeneric^000000"
  npc_override_lasagna_lasagna_npcs_s_be7f9f: "That's it?"
  npc_override_lasagna_lasagna_npcs_s_because_boat_moves_alo_50c9dc: "That's because the boat moves along with the waves."
  npc_override_lasagna_lasagna_npcs_s_been_long_time_since_07d6d8: "It's been a long time since I had a visitor like you."
  npc_override_lasagna_lasagna_npcs_s_been_minutes_since_we_32a324: "It's been 15 minutes since we sent a message but still no news. This must mean that he's probably sleeping nearby again."
  npc_override_lasagna_lasagna_npcs_s_better_you_don_t_ae3770: "It's better that you don't know."
  npc_override_lasagna_lasagna_npcs_s_cool_apple_juice_739b05: "It's cool apple juice!"
  npc_override_lasagna_lasagna_npcs_s_dangerous_around_here_76c2f3: "it's dangerous around here. What brought you all this way?"
  npc_override_lasagna_lasagna_npcs_s_dangerous_put_yourself_54d3ae: "It's dangerous to put yourself out into the world. Take these tri-colored anchovies."
  npc_override_lasagna_lasagna_npcs_s_dangerous_put_yourself_d366f0: "It's dangerous to put yourself out into the world."
  npc_override_lasagna_lasagna_npcs_s_different_version_i_he_a4f0ee: "It's different from the version I heard."
  npc_override_lasagna_lasagna_npcs_s_easy_use_each_slot_77386d: "It's easy to use. ^4d4dffEach slot corresponds to the keys from F1 through F9.^000000"
  npc_override_lasagna_lasagna_npcs_s_fish_cake_there_aren_f2421d: "It's the fish cake, there Aren't too many who ask for it. So we don't even have the ingredients in store."
  npc_override_lasagna_lasagna_npcs_s_floating_water_stuck_w_4b3005: "It's floating on water, not stuck on water. How can a boat move if It's stuck on water?!"
  npc_override_lasagna_lasagna_npcs_s_going_fine_3b1b7c: "It's going to be fine."
  npc_override_lasagna_lasagna_npcs_s_going_lot_easier_use_fda749: "It's going to be a lot easier to use it."
  npc_override_lasagna_lasagna_npcs_s_gone_what_relief_2619ad: "It's gone. What a relief!"
  npc_override_lasagna_lasagna_npcs_s_great_empty_out_all_92dc43: "It's great to empty out all the cargo and return with new items loaded. I feel proud, It's like the feeling you get from gleaning and dispersing the crops widely."
  npc_override_lasagna_lasagna_npcs_s_honey_lasagna_fields_c_b9c1f0: "It's honey. Lasagna fields are covered with sweet flowers, so we can collect a lot of quality honey."
  npc_override_lasagna_lasagna_npcs_s_house_where_lots_flowe_9f047d: "^4d4dffIt's the house where lots of flowerpots are aligned.^000000 You can't miss it."
  npc_override_lasagna_lasagna_npcs_s_i_witnessed_murder_eve_5919f1: "It's [I Witnessed a Murder on the Evening of Full Moon]. Tell me, if you know the story."
  npc_override_lasagna_lasagna_npcs_s_like_register_vigilant_77bcb3: "it's like a register of Vigilante members."
  npc_override_lasagna_lasagna_npcs_s_more_than_enough_e95600: "That's more than enough."
  npc_override_lasagna_lasagna_npcs_s_my_first_time_new_8d1871: "It's my first time in the new world and I'm really excited. Did you decide what you'll do first when you get there? I want to go to the Mjolnir Mountains first!"
  npc_override_lasagna_lasagna_npcs_s_nice_name_3ba764: "{0}... That's a nice name."
  npc_override_lasagna_lasagna_npcs_s_okay_i_care_68f96c: "It's okay. I care."
  npc_override_lasagna_lasagna_npcs_s_okay_if_you_decide_6e5971: "It's okay if you decide not to help meow."
  npc_override_lasagna_lasagna_npcs_s_okay_just_leave_them_8ae353: "It's okay, just leave them. I'll take them with me when I go back to town later."
  npc_override_lasagna_lasagna_npcs_s_okay_too_i_came_094a12: "That's okay, too. I came back to life many times already. Long and deep sleep is all I need to revive meow."
  npc_override_lasagna_lasagna_npcs_s_problem_i_m_upset_422870: "That's not the problem I'm upset."
  npc_override_lasagna_lasagna_npcs_s_relief_competent_doram_3d5759: "it's a relief to have a competent Doram with me."
  npc_override_lasagna_lasagna_npcs_s_right_4b5ef4: "That's right."
  npc_override_lasagna_lasagna_npcs_s_right_ddafea: "That's right!"
  npc_override_lasagna_lasagna_npcs_s_right_gamberry_da721f: "That's right, Gamberry..."
  npc_override_lasagna_lasagna_npcs_s_rude_s_okay_you_6069e5: "That's rude but It's okay. You're not the only one meow."
  npc_override_lasagna_lasagna_npcs_s_small_thriving_town_th_3b1f89: "it's a small but a thriving town thanks to the efforts of Chief Peperoncino, Captain Gamberi, and Captain Tomatomas!"
  npc_override_lasagna_lasagna_npcs_s_someone_help_me_dorams_ff817e: "S-someone help me... Dorams, they're so cute I'm going to die..."
  npc_override_lasagna_lasagna_npcs_s_too_early_right_now_f87d3b: "It's too early right now. Pushing won't solve anything."
  npc_override_lasagna_lasagna_npcs_s_what_gentleman_f7e520: "That's what a gentleman does."
  npc_override_lasagna_lasagna_npcs_s_what_i_meant_cat_b029f2: "...That's not what I meant! This cat's brains must be full of fat!"
  npc_override_lasagna_lasagna_npcs_s_what_i_want_hear_c88cb5: "That's not what I want to hear. Take a look at the sea we are about to explore."
  npc_override_lasagna_lasagna_npcs_s_what_tartufi_said_77eb1f: "That's what Tartufi said."
  npc_override_lasagna_lasagna_npcs_s_where_our_cows_grazing_2a0d22: "That's where our cows are grazing. Grass there is fresh and clean, so the milk tastes superb."
  npc_override_lasagna_lasagna_npcs_s_why_taken_long_time_894e0c: "That's why it has taken a long time to research and make the record."
  npc_override_lasagna_lasagna_npcs_s_why_we_went_through_34e6fc: "That's why we went through the trouble to come here! Just like Peperoncino, Thomas, and Gamberry, we'll unite and become successful!"
  npc_override_lasagna_lasagna_npcs_sailed_out_soft_island_w_18ee09: "Sailed out from Soft Island. We'll probably come a few more times."
  npc_override_lasagna_lasagna_npcs_sailing_depends_your_han_998d76: "The sailing depends on your hand, dear adventurer. Well, go on and take care of your first mision!"
  npc_override_lasagna_lasagna_npcs_same_time_we_ran_vigilan_ecea3a: "At the same time, we ran a ^0000cdvigilante corps^000000 to clean up the streets of Lasagna. Many people joined us for our cause."
  npc_override_lasagna_lasagna_npcs_saved_meow_dcc8ea: "Saved, meow!"
  npc_override_lasagna_lasagna_npcs_say_yes_3527d3: "Say yes."
  npc_override_lasagna_lasagna_npcs_scoffs_alright_then_639833: "~Scoffs~ Alright, then."
  npc_override_lasagna_lasagna_npcs_search_again_12616f: "Search again."
  npc_override_lasagna_lasagna_npcs_search_bce064: "Search"
  npc_override_lasagna_lasagna_npcs_search_butterfly_second_7d7cb3: "A search for Butterfly, second time. Nothing. We couldn't find any remnants of Butterfly. So they must be safe."
  npc_override_lasagna_lasagna_npcs_search_target_set_goal_c_e56c43: "Search for the target, set the goal, and click Pathfinding."
  npc_override_lasagna_lasagna_npcs_seasickness_90cebe: "Seasickness."
  npc_override_lasagna_lasagna_npcs_seaway_we_about_take_no_2374f3: "The seaway we are about to take is ^0000cdno typical seaway^000000. You need to read the movements of the stars and wind. You need to take the way which is not marked on the map which makes you wonder if you will ever find the land."
  npc_override_lasagna_lasagna_npcs_secondly_recovers_hp_sp_a0dcef: "Secondly, it ^0000cdrecovers HP and SP^000000. The amount of recovery also depends on the level of cooking, and some food only recovers HP."
  npc_override_lasagna_lasagna_npcs_see_what_i_mean_differen_a08f07: "See what I mean? Different version from the last."
  npc_override_lasagna_lasagna_npcs_see_you_again_21444b: "See you again."
  npc_override_lasagna_lasagna_npcs_see_you_later_d94b6f: "See you later."
  npc_override_lasagna_lasagna_npcs_seems_like_yeouiju_must_d7eca0: "Seems like Yeouiju is a must-have in order to become a dragon. Is that why the basilisks are bothering Tartufi?"
  npc_override_lasagna_lasagna_npcs_selling_specialty_produc_27533e: "It was ^0000cdselling specialty products^000000. Gamberry's friend ^0000cdThomas^000000 joined the venture and we decided to start the business in Lasagna. But the problem was ^0000cdlousy dorams^000000."
  npc_override_lasagna_lasagna_npcs_seriously_wounded_mildly_db80b7: "Seriously wounded 1, mildly wounded 13, top quality anchovies 23 boxes, kaluna 7 jars, beard comb 1 box, fine fabric 200 rolls."
  npc_override_lasagna_lasagna_npcs_set_sail_ah_right_you_330acd: "Set sail? Ah, right. You said you were from the new world. Then can I ask for a favor? Please tell their ^0000cdchief^000000 to keep them quiet."
  npc_override_lasagna_lasagna_npcs_set_sail_then_you_advent_f036da: "Set sail? Then are you an adventurer? I heard from Magchi that a new world has been discovered. An unknown land where no one has gone before. I wish I can go, too."
  npc_override_lasagna_lasagna_npcs_setup_skill_you_d_like_b82d22: "Setup the skill you'd like to use so that you can use it while in battle."
  npc_override_lasagna_lasagna_npcs_shaman_meow_as_bad_as_0e98ea: "Shaman meow is not as bad as you think. Why don't you go get a counseling when you have time."
  npc_override_lasagna_lasagna_npcs_shaman_meow_lives_seclud_5cf8ac: "The Shaman meow lives in a secluded place near the entrance of the village."
  npc_override_lasagna_lasagna_npcs_shaman_meow_living_seclu_4dfe83: "Shaman meow is living in a secluded place at the entrance of Lasagna. I hope that a stranger from a new place like you take care of my problem."
  npc_override_lasagna_lasagna_npcs_shaman_meow_sure_seems_v_1d22ec: "That Shaman meow sure seems to have the vision. I am a believer now. I believe the amulet is really effective. Please go get me one now. Please."
  npc_override_lasagna_lasagna_npcs_shaman_meow_told_me_ridd_9ddd24: "The ^0000cdShaman meow^000000 has told me a riddle that a stranger from a new place will solve this problem. It is not a coincidence that we have met."
  npc_override_lasagna_lasagna_npcs_she_gets_angry_easily_ma_2cd2a5: "She gets angry easily but makes new clothes for me, saying I deserve pretty ones."
  npc_override_lasagna_lasagna_npcs_ship_i_want_ship_3ad010: "Ship. I want to be on a ^0000cdship^000000!"
  npc_override_lasagna_lasagna_npcs_ship_s_log_b51e7b: "Ship's Log"
  npc_override_lasagna_lasagna_npcs_ship_set_off_when_time_b6dde8: "The ship will set off when the time comes."
  npc_override_lasagna_lasagna_npcs_short_i_really_enjoyed_y_2d098c: "It was short, but I really enjoyed your being here. Goodbye."
  npc_override_lasagna_lasagna_npcs_shortcut_key_settings_yo_422889: "^4d4dffIn the shortcut key settings, you can select the corresponding shortcut key as you desire."
  npc_override_lasagna_lasagna_npcs_shortcut_key_settings_yo_ea184d: "^4d4dffIn the shortcut key settings, you can select the corresponding shortcut keys as you desire.^000000"
  npc_override_lasagna_lasagna_npcs_should_better_than_sprou_9e643e: "It should be better than that sprout you brought with you."
  npc_override_lasagna_lasagna_npcs_should_i_help_you_find_628924: "Should I help you find the thief then?"
  npc_override_lasagna_lasagna_npcs_should_i_just_jump_off_2daad1: "Should I just jump off the deck...?"
  npc_override_lasagna_lasagna_npcs_should_produce_i_guess_h_eff5c9: "This should produce {0}, I guess. How do you like it?"
  npc_override_lasagna_lasagna_npcs_show_below_neck_area_50fbe1: "(Show the below-neck area.)"
  npc_override_lasagna_lasagna_npcs_show_me_your_amulet_you_c02d37: "Show me your amulet, will you? I can't seem to find it in your inventory."
  npc_override_lasagna_lasagna_npcs_shows_detailed_descripti_b64c1e: "This shows the detailed description of the selected item."
  npc_override_lasagna_lasagna_npcs_shrieks_hi_hiya_cb7636: "~Shrieks~ Hi...Hiya..."
  npc_override_lasagna_lasagna_npcs_shrieks_you_startled_me_d099aa: "~Shrieks~ You startled me!"
  npc_override_lasagna_lasagna_npcs_shut_your_mouth_you_re_3fee70: "Shut your mouth! You're joining the Vigilante Corp the moment you return to the village, got it?"
  npc_override_lasagna_lasagna_npcs_sighs_deeply_a0e251: "........~Sighs deeply~..."
  npc_override_lasagna_lasagna_npcs_signs_deeply_my_head_spi_5b3007: "~Signs deeply~ My head is spinning!"
  npc_override_lasagna_lasagna_npcs_simply_drag_appropriate_740efb: "Or, simply drag the appropriate items to the area you'd like to equip.^000000"
  npc_override_lasagna_lasagna_npcs_simply_drag_appropriate_b8e85f: "Simply drag the appropriate items to the area you'd like to equip.^000000"
  npc_override_lasagna_lasagna_npcs_since_condition_dragon_v_fa2901: "Since the condition of the dragon is very important in Lasagna, the vigilantes check it at all time."
  npc_override_lasagna_lasagna_npcs_since_i_am_duty_i_8e7eb0: "Since I am on duty, I cannot proceed with any personal study of cooking. Come back after the break of day."
  npc_override_lasagna_lasagna_npcs_since_i_am_my_way_a8f7ed: "Since I am on my way there, I'll get some for you if I can. However, my mission comes first. You don't expect for me to process it before the mission the captain has given me, do you?"
  npc_override_lasagna_lasagna_npcs_since_i_ve_come_all_a8270d: "Since I've come all the way here, I should try the kaluna milk!"
  npc_override_lasagna_lasagna_npcs_since_s_come_we_ll_6d7eb9: "Since it's come to this, We'll use what force necessary to loosen his tongue..."
  npc_override_lasagna_lasagna_npcs_since_takes_concentratio_d2637a: "Since it takes concentration, please don't interrupt me."
  npc_override_lasagna_lasagna_npcs_since_trial_version_novi_b88892: "Since it is a trial version for novice, it has the same effect as level 1 food, but ^0000cdit doesn't last as long.^000000"
  npc_override_lasagna_lasagna_npcs_since_we_re_here_let_e19b35: "Since we're here, Let's make an oven resolution!"
  npc_override_lasagna_lasagna_npcs_since_when_been_your_dut_2c2da6: "Since when it has been your duty to check it? So quietly? Without a knock on the door?"
  npc_override_lasagna_lasagna_npcs_since_when_i_part_team_152005: "Since when was I part of the team? All right, fine... Let's go."
  npc_override_lasagna_lasagna_npcs_sir_s_what_you_said_b98a69: "Sir, That's not what you said the last time we talked over a drink. You said you left because you hated being looked down upon due to poverty."
  npc_override_lasagna_lasagna_npcs_sitting_17e441: "Sitting."
  npc_override_lasagna_lasagna_npcs_sitting_now_23b27d: "Sitting now."
  npc_override_lasagna_lasagna_npcs_situation_bad_611623: "Is the situation that bad?"
  npc_override_lasagna_lasagna_npcs_skills_activated_manuall_e04d69: "^4d4dffSkills that are activated manually ^000000 can be ^4d4dffplaced on the quickbar^000000 for fast use."
  npc_override_lasagna_lasagna_npcs_sleepy_meow_who_lives_ov_a6acda: "^4D4DFF[Sleepy meow]^000000, who lives over there at the mouth of the cave where basilisks live, is desperately seeking for a strong individual. Perhaps you should give it a try for the experience. Thank you for helping us."
  npc_override_lasagna_lasagna_npcs_slippery_sticky_s_amazin_31f4f7: "Slippery- sticky- It's amazing such creatures exist."
  npc_override_lasagna_lasagna_npcs_snore_106f51: "*Snore*"
  npc_override_lasagna_lasagna_npcs_so_again_proves_i_m_7c2134: "So that again proves that I'm the best in this domain!"
  npc_override_lasagna_lasagna_npcs_so_all_about_boosting_yo_af6de9: "So, is this all about boosting your abilities based on your competencies?"
  npc_override_lasagna_lasagna_npcs_so_amazing_i_want_ask_e88509: "So amazing that I want to ask for another favor tomorrow. Florin's been having a lot of difficulties lately."
  npc_override_lasagna_lasagna_npcs_so_basically_s_beyond_yo_0da9dc: "So basically, It's beyond your imagination how many glasses I have to wash each day. Not only that, I have to listen to vigilance corps and merchants' low-ranking dorams whine, and counsel rookie adventurers."
  npc_override_lasagna_lasagna_npcs_so_cold_hearted_bf2596: "So cold-hearted..."
  npc_override_lasagna_lasagna_npcs_so_every_day_i_must_5c77ce: "So every day, I must only collect how much I need for the day. But I still haven't collected enough for today."
  npc_override_lasagna_lasagna_npcs_so_give_try_craft_someth_ff9e55: "So give it a try and craft something with the Combination Kit."
  npc_override_lasagna_lasagna_npcs_so_i_hope_you_come_191ac8: "So I hope you come back tomorrow!"
  npc_override_lasagna_lasagna_npcs_so_i_just_wanted_you_3b4ab4: "Is that so? I just wanted you to take your time. Well, get in there. Remember, the peace of Tartufi is the peace of the ocean. It means hope."
  npc_override_lasagna_lasagna_npcs_so_i_need_you_catch_ef63a6: "So I need you to catch Grass Fabres and Leaf Lunatics. Five each. Okay, then start!"
  npc_override_lasagna_lasagna_npcs_so_just_thought_them_mak_7bfaa3: "So just the thought of them makes me all furious meow."
  npc_override_lasagna_lasagna_npcs_so_let_me_introduce_myse_a7d342: "Is that so? Let me introduce myself. I am the Sous Chef in charge of this kitchen."
  npc_override_lasagna_lasagna_npcs_so_many_heartbreaking_st_90a6b8: "So many heartbreaking stories."
  npc_override_lasagna_lasagna_npcs_so_mean_i_shared_my_625802: "So mean. I shared my painful past and you couldn't care any less."
  npc_override_lasagna_lasagna_npcs_so_people_who_wish_succe_bfe9aa: "So people who wish to succeed or adventurers who wish to become just like them come here a lot."
  npc_override_lasagna_lasagna_npcs_so_please_get_those_mush_e41369: "So please get those mushroom spores for me cuz I'm dying meow."
  npc_override_lasagna_lasagna_npcs_so_please_go_get_rid_3770de: "So please go and get rid of them. Five from each group should be enough."
  npc_override_lasagna_lasagna_npcs_so_please_think_as_savin_2af014: "So, please think of it as... saving someone's life...and help meeee..."
  npc_override_lasagna_lasagna_npcs_so_s_so_bothersome_i_44be1c: "Is that so? But That's so bothersome! I can't even look after my own body."
  npc_override_lasagna_lasagna_npcs_so_s_what_we_re_2f8fd9: "So That's what we're doing right now. We're sitting as hard as we can."
  npc_override_lasagna_lasagna_npcs_so_s_why_you_re_e400ce: "So That's why you're breathing out fire."
  npc_override_lasagna_lasagna_npcs_so_taking_care_these_bra_dc2a66: "So taking care of these bratty brothers has become my responsibility! I wonder why I was born the eldest! I've almost had it!"
  npc_override_lasagna_lasagna_npcs_so_they_fought_my_store_fabbc2: "So they ^0000cdfought^000000. My ^0000cdstore was destroyed^000000. So I made a ^0000cdclaim for damages^000000 for broken furniture and profit loss until the pub was back in business."
  npc_override_lasagna_lasagna_npcs_so_they_having_animated_71f07b: "So they were having an animated discussion over status."
  npc_override_lasagna_lasagna_npcs_so_they_move_another_per_5c6f2c: "So they move on to another person nearby. That's why when the host dies, it is specially sealed in a jar by a shaman and discarded in a place where no one can find it."
  npc_override_lasagna_lasagna_npcs_so_we_don_t_even_dba502: "So we don't even have the ingredients prepared these days. When there's an order once in a while, we run to the fish store to buy a cod and start cooking then."
  npc_override_lasagna_lasagna_npcs_so_we_get_ingredients_im_571db2: "So we get the ingredients immediately when there's an order."
  npc_override_lasagna_lasagna_npcs_so_we_hire_outsiders_who_b3915b: "So we hire outsiders who want a job as a special treatment policy, and Legalas is in charge of fermenting kaluna."
  npc_override_lasagna_lasagna_npcs_so_well_polite_get_hold_81f7b6: "Is that so? Well, it is not polite to get hold of a busy person."
  npc_override_lasagna_lasagna_npcs_so_what_brings_you_here_827774: "So what brings you here?"
  npc_override_lasagna_lasagna_npcs_so_what_happened_then_th_f50486: "So what happened then? They showed up at the pub and what did they do?"
  npc_override_lasagna_lasagna_npcs_so_what_i_won_her_de6ca8: "So? What! I won her on a bet. Every time I call her name, it reminds me of that moment of victory. It's beautiful."
  npc_override_lasagna_lasagna_npcs_so_what_s_matter_00d6cd: "So what's the matter?"
  npc_override_lasagna_lasagna_npcs_so_what_us_e01ecd: "So what does that have to do with us?"
  npc_override_lasagna_lasagna_npcs_so_what_you_curious_abou_4c1caf: "So what are you curious about?"
  npc_override_lasagna_lasagna_npcs_so_what_you_going_9018aa: "So, what are you going to do?"
  npc_override_lasagna_lasagna_npcs_so_what_you_re_telling_a1bd92: "So what you're telling is that I should keep the two far away from the workshop while Legalas is working."
  npc_override_lasagna_lasagna_npcs_so_when_time_comes_we_a7551f: "So when the time comes, we hire adventurers to hunt the wild hornets."
  npc_override_lasagna_lasagna_npcs_so_you_me_another_favor_38a263: "So can you do me another favor tomorrow? Oh, no need to answer right away. Get some good rest tonight and come back tomorrow."
  npc_override_lasagna_lasagna_npcs_so_you_need_boost_dex_75bc4e: "So, ^4d4dffyou need to boost DEX first to increase Accuracy^000000."
  npc_override_lasagna_lasagna_npcs_so_you_played_dead_good_63ebfc: "So you played dead? Good job. A vigilante should know how to save one's life. Good for you."
  npc_override_lasagna_lasagna_npcs_so_you_re_adventurer_dor_af06bf: "So, you're that adventurer Doram, eh?"
  npc_override_lasagna_lasagna_npcs_so_you_running_errand_de_1f9b94: "So, you were running an errand to deliver a box to Healer Haru."
  npc_override_lasagna_lasagna_npcs_so_you_see_ribbon_goes_5182ec: "So, do you see this ribbon that goes perfectly well with this cool uniform?"
  npc_override_lasagna_lasagna_npcs_so_you_want_me_get_bbeb74: "So you want me to get some mushroom spores, right?"
  npc_override_lasagna_lasagna_npcs_some_reason_they_live_ba_dcb5ae: "But for some reason, they live with the basilisks, but so this is a serious problem for us."
  npc_override_lasagna_lasagna_npcs_something_embarrassed_la_b49e4d: "It is not something to be embarrassed by in Lasagna."
  npc_override_lasagna_lasagna_npcs_sometimes_npcs_help_you_b700aa: "^4d4dffSometimes NPCs will help you find your destination through the Navigation tool."
  npc_override_lasagna_lasagna_npcs_sounds_cute_doesn_t_soun_b21a0b: "It sounds cute, but it doesn't sound quite delicious."
  npc_override_lasagna_lasagna_npcs_sounds_very_pressuring_9fbe83: "It sounds very pressuring."
  npc_override_lasagna_lasagna_npcs_sous_chef_always_edge_be_26986b: "The Sous Chef is always on the edge before sailing off. don't take it personally."
  npc_override_lasagna_lasagna_npcs_sous_chef_believes_bring_747c4c: "The Sous Chef believes that it brings bad luck to have a stranger while cooking. You should go now."
  npc_override_lasagna_lasagna_npcs_sous_chef_i_think_guy_a3e986: "Sous Chef! I think this guy's telling the truth. It is ordered by you, right?"
  npc_override_lasagna_lasagna_npcs_sous_chef_we_recruited_p_058dcd: "The sous chef we recruited from Port Richoli is just fantastic."
  npc_override_lasagna_lasagna_npcs_speaking_which_fisher_sa_9d3f28: "Speaking of which, ^4D4DFF[Fisher]^000000 said he needed some help. Would you like to give it a try? Thank you for helping us."
  npc_override_lasagna_lasagna_npcs_starts_again_long_story_daffa4: "It starts again. The long story."
  npc_override_lasagna_lasagna_npcs_stay_out_trouble_now_a91042: "Stay out of trouble, now."
  npc_override_lasagna_lasagna_npcs_stello_590425: "Stello?"
  npc_override_lasagna_lasagna_npcs_stello_adventurer_seems_14427e: "Stello. This adventurer seems very experienced. This could be a new adventure as well. It could help us."
  npc_override_lasagna_lasagna_npcs_stello_called_joke_af21b0: "Stello, it is called a joke."
  npc_override_lasagna_lasagna_npcs_stello_con_chliina_s_fir_9234c1: "Stello, Con-Chliina's first officer, discovered the sea route and finally found Butterfly that had safely reached Soft Island in the new world."
  npc_override_lasagna_lasagna_npcs_stello_doesn_t_make_sens_1d7219: "Stello. It doesn't make sense to call it as the last training when we are dealing with a Doram who has finished the training for the adventure. This should be called the first practice."
  npc_override_lasagna_lasagna_npcs_stello_gentleman_should_eaca68: "Stello. a gentleman should use a good language at all time."
  npc_override_lasagna_lasagna_npcs_stello_give_adventurer_25629f: "Stello. give ^0000cdthat^000000 to the adventurer."
  npc_override_lasagna_lasagna_npcs_stello_i_don_t_think_75432b: "Stello, I don't think that is the matter of the question. Look outside."
  npc_override_lasagna_lasagna_npcs_stello_i_guess_you_shoul_3a1074: "Stello, I guess you should go down there yourself."
  npc_override_lasagna_lasagna_npcs_stello_i_told_you_how_2da7eb: "Stello, I have told you how the way you dress shows what kind of Doram you are. Ad just your attire, please."
  npc_override_lasagna_lasagna_npcs_stello_polite_interrupt_b20215: "Stello, it is not polite to interrupt. I had a strong sense of justice and couldn't just let those bad Dorams disturbing peace in Lasagna. I had to ^0000cdlead them into the right path^000000."
  npc_override_lasagna_lasagna_npcs_stello_say_again_beccc5: "Stello, say it again."
  npc_override_lasagna_lasagna_npcs_stello_you_must_learn_ab_1b2833: "Stello, you must learn about this thing called social codes."
  npc_override_lasagna_lasagna_npcs_stello_you_need_really_m_78ac3d: "Stello? You need to really mean it."
  npc_override_lasagna_lasagna_npcs_stello_you_should_libera_2c1cb9: "Stello, you should be liberal with your praise. Just as I did it to you."
  npc_override_lasagna_lasagna_npcs_sticky_webfoot_main_ingr_8c8c8c: "This sticky webfoot is the main ingredient of pudding, but it goes bad quickly after a day. And smells awful, too."
  npc_override_lasagna_lasagna_npcs_still_no_news_butterfly_b31126: "Still no news on Butterfly."
  npc_override_lasagna_lasagna_npcs_still_searching_no_news_6f1681: "Still searching. No news on Butterfly."
  npc_override_lasagna_lasagna_npcs_still_yota_never_show_hi_111e10: "Still, Yota would never show his smiles, while Jogi would bring me hideous stuff like an earthworm, saying I should be tougher. ~Makes a sobbing sound~"
  npc_override_lasagna_lasagna_npcs_stirred_96dca4: "Stirred."
  npc_override_lasagna_lasagna_npcs_stirred_shaken_who_cares_a89b9a: "Stirred or shaken, who cares as long as It's tasty?"
  npc_override_lasagna_lasagna_npcs_stop_808022: "Stop!"
  npc_override_lasagna_lasagna_npcs_stop_eating_stop_shame_y_798a23: "Stop eating! Stop! Shame on you!"
  npc_override_lasagna_lasagna_npcs_stop_fighting_you_two_71bac3: "...Stop fighting, you two!"
  npc_override_lasagna_lasagna_npcs_stop_looking_around_like_a6fe51: "Stop looking around like a hillbilly!"
  npc_override_lasagna_lasagna_npcs_stop_lying_4466ff: "Stop lying!"
  npc_override_lasagna_lasagna_npcs_storm_again_0877cb: "Storm again."
  npc_override_lasagna_lasagna_npcs_storm_so_sick_storms_we_b29d42: "Storm. So sick of storms. We're so used to it that we can practically ride over it."
  npc_override_lasagna_lasagna_npcs_story_about_captain_gamb_898f79: "The story about Captain Gamberi is included in all the books as well. And all of it was reduced to ashes."
  npc_override_lasagna_lasagna_npcs_story_chief_officer_true_ea21b2: "Was the story of the Chief Officer true then?"
  npc_override_lasagna_lasagna_npcs_story_doesn_t_add_up_42aecd: "That story doesn't add up."
  npc_override_lasagna_lasagna_npcs_story_pepperoncino_doesn_4cd299: "The story from Pepperoncino doesn't quite make sense either. I can check out his story with the records."
  npc_override_lasagna_lasagna_npcs_story_pepperoncino_s_sid_393c5b: "The story on Pepperoncino's side makes me more confused. Listen for yourself."
  npc_override_lasagna_lasagna_npcs_str_means_strength_boost_9b1b49: "^4d4dffSTR means strength^000000. It ^4d4dffboosts physical attacks^000000."
  npc_override_lasagna_lasagna_npcs_strange_i_cannot_remembe_a48370: "That is strange. I cannot remember all the records, but the story told by Captain Gamberi ^0000cdis different^000000 from the part of the record I do remember."
