  npc_override_lasagna_lasagna_npcs_tartufi_must_calmed_down_8ebb64: "Tartufi must have calmed down. Please go first. I'll go with Machie when he can walk a little. It is too heavy to carry him on my back."
  npc_override_lasagna_lasagna_npcs_tartufi_right_upstairs_g_af3532: "^0000cdTartufi^000000 is right upstairs. Go and ask him what the problem is. He doesn't bite. You don't need to be scared."
