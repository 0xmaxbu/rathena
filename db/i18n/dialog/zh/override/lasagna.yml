  npc_override_lasagna_lasagna_npcs_then_dragon_f1a619: "Then the Dragon is..."
  npc_override_lasagna_lasagna_npcs_then_find_something_easy_f3206c: "Then find something easy. I think something like ^0000cdbabysitting^000000 would be nice."
  npc_override_lasagna_lasagna_npcs_then_go_back_your_spot_eb1a9c: "Then go back to your spot. You shouldn't expect any favors from me from now on."
  npc_override_lasagna_lasagna_npcs_then_how_about_you_give_07bb8a: "Then how about you give these two a try? They want to work on a ship, so even an apprenticeship would be nice."
  npc_override_lasagna_lasagna_npcs_then_i_ask_you_deliver_0c8d71: "Then I ask that you ^0000cddeliver the lunchbox to Panna in the cave^000000 for today as well. Hurry up on your way there, but take your time on your way back."
  npc_override_lasagna_lasagna_npcs_then_i_ll_just_leave_979041: "Then I'll just leave Lasagna without hesitation."
  npc_override_lasagna_lasagna_npcs_then_i_met_pepperoncino_6e38d1: "Then I met Pepperoncino."
  npc_override_lasagna_lasagna_npcs_then_i_pioneered_seaway_a9ac60: "Then I pioneered the seaway to Malangdo with ^0000cdStello^000000 whom I had straightened, and reunited with Thomas. Eventually, we decided to advance into the new continent."
  npc_override_lasagna_lasagna_npcs_then_i_saw_unlimited_pot_b745b1: "Then I saw the unlimited potential of fishing industry, or anchovy manufacturing to be more exact. So I jumped into the ^0000cdanchovy manufacturing business^000000. And I met Gamberry around that time."
  npc_override_lasagna_lasagna_npcs_then_lasagna_return_its_c4cd76: "Then Lasagna will return to its former state of filth and danger. I can't let that happen. We're finally living like decent human beings but to go back to that dark age..."
  npc_override_lasagna_lasagna_npcs_then_legalas_find_some_o_214162: "Then Legalas can find some other job."
  npc_override_lasagna_lasagna_npcs_then_let_s_cut_chase_d3487c: "Then Let's cut to the chase."
  npc_override_lasagna_lasagna_npcs_then_one_all_all_one_d0376a: "Then one for all! All for one!"
  npc_override_lasagna_lasagna_npcs_then_one_day_two_roughne_05f377: "Then one day, two roughnecks came up with the merchants and vigilance corps and started beating up Lasagna kids."
  npc_override_lasagna_lasagna_npcs_then_see_you_again_soon_f1e3ba: "Then see you again soon."
  npc_override_lasagna_lasagna_npcs_then_see_you_again_tomor_ef4ab8: "Then see you again tomorrow!"
  npc_override_lasagna_lasagna_npcs_then_use_combination_kit_df9b63: "Then, ^4d4dffuse the Combination Kit or cooking utensils^000000 to make an item you want."
  npc_override_lasagna_lasagna_npcs_then_what_did_you_think_24b122: "Then what did you think it was?"
  npc_override_lasagna_lasagna_npcs_then_what_you_need_fresh_e2bc37: "Then what do you need a fresh eye for?"
  npc_override_lasagna_lasagna_npcs_then_what_you_want_me_41e22c: "Then, what do you want me to help you with?"
  npc_override_lasagna_lasagna_npcs_then_when_we_able_set_2b62d5: "Then when would we be able to set off?"
  npc_override_lasagna_lasagna_npcs_then_you_d_better_listen_297d24: "Then, you'd better listen to me!"
  npc_override_lasagna_lasagna_npcs_then_you_guys_shouldn_t_7e74c4: "Then you guys shouldn't get in the way now, should you? Are you going to eat more kalunyaks?"
  npc_override_lasagna_lasagna_npcs_then_you_learn_how_fearf_698e29: "Then you would learn how fearful a sailor can be."
  npc_override_lasagna_lasagna_npcs_then_you_need_combinatio_ccf7da: "Then, you need a combination scroll first."
  npc_override_lasagna_lasagna_npcs_then_you_two_who_t_abbd87: "Then you two who can't support yourselves will wander around and starve to death in some filthy backstreet alley."
  npc_override_lasagna_lasagna_npcs_there_anything_doesn_t_s_5f10fd: "Is there anything that doesn't sound delicious to you?"
  npc_override_lasagna_lasagna_npcs_there_anything_troubles_5d756f: "Is there anything that troubles you?"
  npc_override_lasagna_lasagna_npcs_there_anything_you_need_1d272d: "Is there anything you need?"
  npc_override_lasagna_lasagna_npcs_there_box_53b02f: "There was a box!"
  npc_override_lasagna_lasagna_npcs_there_c268ec: "There is."
  npc_override_lasagna_lasagna_npcs_there_jindou_s_intervent_2ef9f1: "There was Jindou's intervention, but I didn't think you'd complete the first test so easily..."
  npc_override_lasagna_lasagna_npcs_there_lot_books_5c5c50: "There are a lot of books."
  npc_override_lasagna_lasagna_npcs_there_more_continents_ot_04e320: "There are more continents other than Midgard."
  npc_override_lasagna_lasagna_npcs_there_no_one_village_who_e2b1f5: "There was no one in the village who didn't know me."
  npc_override_lasagna_lasagna_npcs_there_no_other_way_7d6815: "There is no other way."
  npc_override_lasagna_lasagna_npcs_there_none_these_savory_cada36: "There were none of these savory and comfy streets of cheese... Instead, we had mushy anchovy guts... everywhere you go..."
  npc_override_lasagna_lasagna_npcs_there_numerous_islands_s_00a466: "There are numerous islands on the sea where no one lives. Sometimes, you find a pot buried in the middle of an island."
  npc_override_lasagna_lasagna_npcs_there_numerous_kinds_ele_83046b: "There are numerous kinds of elements from neutral to four major natural elements, alongside the holy and dark elements."
  npc_override_lasagna_lasagna_npcs_there_one_ten_two_ten_6bfec8: "There are one ten two ten three ten yarn balls... So many!"
  npc_override_lasagna_lasagna_npcs_there_over_there_6ad452: "There. Over there."
  npc_override_lasagna_lasagna_npcs_there_paradise_group_you_1b73fb: "There is a Paradise Group you might want to visit."
  npc_override_lasagna_lasagna_npcs_there_part_leaders_ship_de7fb3: "There are 12 Part Leaders on this ship other than the Captain, and there are many other crews. You don't need to meet them all. You can meet the important ones."
  npc_override_lasagna_lasagna_npcs_there_place_near_entranc_7750b5: "There is a place near the entrance of the village where herbs grow."
  npc_override_lasagna_lasagna_npcs_there_puppet_master_75e8ba: "There is a puppet master for this!"
  npc_override_lasagna_lasagna_npcs_there_really_no_way_help_7a1117: "Is there really no way to help him?"
  npc_override_lasagna_lasagna_npcs_there_s_baby_here_92704e: "there's a baby here."
  npc_override_lasagna_lasagna_npcs_there_s_good_breeze_blow_b4e65b: "And there's a good breeze blowing..."
  npc_override_lasagna_lasagna_npcs_there_s_hair_designer_do_2165fc: "There's a hair designer in downtown, so make sure you drop by."
  npc_override_lasagna_lasagna_npcs_there_s_no_more_today_621397: "there's no more for today, so can go..."
  npc_override_lasagna_lasagna_npcs_there_s_nothing_i_teach_ec0a3c: "there's nothing I can teach you. But as I said, I'll look for a place where you can learn."
  npc_override_lasagna_lasagna_npcs_there_s_nothing_see_2acef8: "There's nothing to see."
  npc_override_lasagna_lasagna_npcs_there_s_nothing_special_90b163: "There's nothing special about life in this world."
  npc_override_lasagna_lasagna_npcs_there_s_nothing_threaten_fca815: "there's nothing threatening around here right now. Our cows are satisfied with their meals, too."
  npc_override_lasagna_lasagna_npcs_there_s_something_called_77e1ac: "there's something called doram trash among the dorams. Too bad that you can't use it since you're not dorams and That's about it. Fine."
  npc_override_lasagna_lasagna_npcs_there_s_something_i_want_5ee0f6: "there's something I wanted to ask you. Do you remember anything about Captain Gamberry and Chief Peperoncino?"
  npc_override_lasagna_lasagna_npcs_there_seems_another_both_f96ec8: "There seems to be another bothersome fish cake order that came in. So please get the ingredients for me. I'm busy today as well, desperately fighting against the sunlight meow."
  npc_override_lasagna_lasagna_npcs_there_six_types_cooking_b78e7f: "There are six types of cooking. Each enhances ^0000cdStr, Agi, Vit, Int, Dex or Luk^000000. The amount of status enhancement depends on the level of cooking."
  npc_override_lasagna_lasagna_npcs_there_some_guys_who_mana_e2e678: "There will be some guys who manage to show up right before the ship sails off so you should meet the ones you can meet for now. First of all, you should go meet the Captain."
  npc_override_lasagna_lasagna_npcs_there_something_causing_7f1d9e: "There is something causing the fog? A villain involved, maybe? This is exciting!"
  npc_override_lasagna_lasagna_npcs_there_something_wrong_yo_777b83: "There is something wrong with your tongue."
  npc_override_lasagna_lasagna_npcs_there_sufferer_i_m_here_b6cc10: "There is a sufferer and I'm here for that person."
  npc_override_lasagna_lasagna_npcs_there_thick_fog_i_wonder_aad1ec: "There is this thick fog. I wonder if we would be able to set off no"
  npc_override_lasagna_lasagna_npcs_there_time_everything_0964df: "There is a time for everything."
  npc_override_lasagna_lasagna_npcs_there_too_many_things_he_b4210d: "But there were too many things here that I had to protect..."
  npc_override_lasagna_lasagna_npcs_there_two_main_functions_3f4b7e: "There are two main functions of cooking."
  npc_override_lasagna_lasagna_npcs_there_two_steps_preparat_064fc6: "There are two steps for the preparation."
  npc_override_lasagna_lasagna_npcs_these_days_many_people_c_2039ae: "These days, many people come to seek information before heading off to the new world."
  npc_override_lasagna_lasagna_npcs_they_abound_around_here_309bf3: "They abound around here. Go get them, tiger!"
  npc_override_lasagna_lasagna_npcs_they_all_good_people_46046b: "They are all good people."
  npc_override_lasagna_lasagna_npcs_they_both_obtained_those_19e10f: "They both are obtained from those dirty ^0000cdbasilisks^000000. Basilisks received energy from Lord Imuk that lived over 2,000 years, so evil spirits can't stand even being near a piece of them."
  npc_override_lasagna_lasagna_npcs_they_come_back_when_time_37feee: "They will come back when it is the time to set off anyway."
  npc_override_lasagna_lasagna_npcs_they_dime_dozen_around_h_514146: "They are a dime a dozen around here, so they're a great target for the novice Dorams to test their worth on."
  npc_override_lasagna_lasagna_npcs_they_dropped_everything_2e1c03: "They dropped everything and put all their efforts into finding Captain Tomatomas."
  npc_override_lasagna_lasagna_npcs_they_easily_spotted_arou_582691: "They are easily spotted around here."
  npc_override_lasagna_lasagna_npcs_they_grow_too_fast_keep_6ab264: "They grow too fast and keep growing no matter how many times I pluck them. I've had it..."
  npc_override_lasagna_lasagna_npcs_they_just_never_give_up_bae2fd: "They just never give up, do they? But you must try a little harder. They're nowhere near done because they know that you're weak. So you must show your strong side!"
  npc_override_lasagna_lasagna_npcs_they_ll_quiet_while_if_f34437: "They'll be quiet for a while if you show them that you're strong. So try a little harder. I'll help you."
  npc_override_lasagna_lasagna_npcs_they_may_look_dumb_they_7aeea3: "They may look dumb but they can be a real pain in the butt. They will pick up and eat anything they come across."
  npc_override_lasagna_lasagna_npcs_they_may_look_like_books_e5864f: "They may look like books, but they are not. They are the records of all the things which have happened on the ship."
  npc_override_lasagna_lasagna_npcs_they_organized_merchant_78a192: "They organized a merchant business with Thomas (current captain of Butterfly) who joined later."
  npc_override_lasagna_lasagna_npcs_they_pick_every_single_t_53be78: "They would pick on every single thing so I decided to catch them and make them work."
  npc_override_lasagna_lasagna_npcs_they_professionals_they_c5d7ca: "They are professionals. They will take care of it in no time!"
  npc_override_lasagna_lasagna_npcs_they_promised_they_won_t_83eddf: "But they promised that they won't eat kalunyak, so you won't have any problem with the delivery anymore."
  npc_override_lasagna_lasagna_npcs_they_re_aglio_olio_812d2a: "They're Aglio and Olio."
  npc_override_lasagna_lasagna_npcs_they_re_aglio_olio_aglio_66af2d: "They're Aglio and Olio. Not Aglio and Oligo. You made them sound like a sugar."
  npc_override_lasagna_lasagna_npcs_they_re_honey_crazy_crea_4c5bb7: "They're honey-crazy creatures who are masters when it comes to collecting honey... We can't get rid of them entirely since the flowers need to be pollenated, but there's a need to control their number."
  npc_override_lasagna_lasagna_npcs_they_re_perfect_served_a_f8fe9b: "They're perfect to be served with alcohol and make great snacks for students studying for an exam. Try one."
  npc_override_lasagna_lasagna_npcs_they_really_way_too_filt_ce111b: "But they really are way too filthy. I bet the boatswain will ask you for a favor since he won't want to catch one with his own hands."
  npc_override_lasagna_lasagna_npcs_they_seem_no_learning_sk_683671: "They seem to have no learning skills since they do that every single day."
  npc_override_lasagna_lasagna_npcs_they_won_t_listen_no_11aee2: "They won't listen no matter what. Look at those bellies. They're from eating so much kalunyak and kaluna."
  npc_override_lasagna_lasagna_npcs_thing_clinging_onto_boat_6d4a1f: "That thing clinging onto the boatswain is also a doram. It especially hates basil locks. That is the reason why basil locks are used."
  npc_override_lasagna_lasagna_npcs_thing_you_cannot_buy_mon_f0b362: "The thing that you cannot buy with money when you leave Lasagna."
  npc_override_lasagna_lasagna_npcs_think_about_takes_about_201948: "Think about it. It takes about that much time to search through everything here. On top of that, I don't even know what Yeouiju is."
  npc_override_lasagna_lasagna_npcs_think_as_continuation_yo_f07557: "Think of it as a continuation of your training and please help me. I'll give you a hefty wage, so what'd you say?"
  npc_override_lasagna_lasagna_npcs_this_is_it_58d4f6: "This is it!!"
  npc_override_lasagna_lasagna_npcs_this_this_is_d5eeb6: "This... This is..."
  npc_override_lasagna_lasagna_npcs_those_doram_mouse_lookin_266678: "Those doram mouse-looking ones all left Lasagna and only the ones who wanted to live a decent life stayed. They're the ones who made current Lasagna."
  npc_override_lasagna_lasagna_npcs_those_evil_spirits_usual_23f332: "Those evil spirits usually try to take over the host by absorbing his energy and leave when he dies. For some reason, they can't take over the host's body."
  npc_override_lasagna_lasagna_npcs_those_grass_fabres_leaf_a57658: "Those Grass Fabres and Leaf Lunatics are eating away the entire grass. But they shouldn't because they're leaving my cute cows here with no food."
  npc_override_lasagna_lasagna_npcs_those_heading_new_world_70bd0a: "Those heading to the new world should follow the red yarn and go to the ^0000cddock^000000."
  npc_override_lasagna_lasagna_npcs_those_hunter_desert_wolv_a44351: "Those Hunter Desert Wolves are rampaging still."
  npc_override_lasagna_lasagna_npcs_those_monsters_steal_all_57a09a: "Those monsters steal all the fish I'm drying right now!"
  npc_override_lasagna_lasagna_npcs_those_much_knowledge_bit_70d433: "Those with much knowledge have a bit more options."
  npc_override_lasagna_lasagna_npcs_three_days_since_we_left_df88e4: "Three days since we left Port Richoli. Met a storm. It's not the first time we experienced the fickleness of mother nature, but we can't help but feel dejected when counting the losses."
  npc_override_lasagna_lasagna_npcs_three_glasses_kaluna_mil_187474: "Three glasses of kaluna milk. Here you go."
  npc_override_lasagna_lasagna_npcs_thumping_sound_02a083: "~Thumping sound~"
  npc_override_lasagna_lasagna_npcs_ticket_28c85b: "The ticket?"
  npc_override_lasagna_lasagna_npcs_ticket_fbb264: "The ticket."
  npc_override_lasagna_lasagna_npcs_time_already_up_nyo_hoho_d38c91: "Time is already up! Nyo-hoho!!"
  npc_override_lasagna_lasagna_npcs_time_he_s_ready_run_39052d: "By the time he's ready to run around again, Magchi will come. Thanks a lot. You said you're heading for an adventure in the new world? Tell me about the new world when you're in Lasagna time to time."
  npc_override_lasagna_lasagna_npcs_time_tali_northwestern_t_aed6a5: "This time, Tali at the northwestern tip of Lasagna will give you a hand."
  npc_override_lasagna_lasagna_npcs_timing_off_cf2ebd: "Timing is off!"
  npc_override_lasagna_lasagna_npcs_tired_6e6836: "Tired."
  npc_override_lasagna_lasagna_npcs_today_adventurers_club_m_0290cf: "Today, it is an adventurers' club and a memorial, a must-see place for dorams going on an adventure."
  npc_override_lasagna_lasagna_npcs_today_maybe_tomorrow_let_ce8ad2: "Not today. Maybe tomorrow? Let me see... Who said needed some help?"
  npc_override_lasagna_lasagna_npcs_today_s_amulet_basils_ba_e5df0b: "And today's amulet is ^0000cd20 Basils and 5 Basilrocks^000000. You can get them from the basilisks."
  npc_override_lasagna_lasagna_npcs_today_s_amulet_basils_ba_f08686: "Today's amulet is 20 Basils and 5 Basilrocks! The sun will go down anytime soon!"
  npc_override_lasagna_lasagna_npcs_today_s_talisman_basil_l_1dd76c: "Today's talisman is ^0000cd5 basil locks and 1 holy water^000000. In the new world, the holy water drives the evil spirits away. It must've worked when the boatswain came in contact with the people of the new world."
  npc_override_lasagna_lasagna_npcs_today_s_talisman_basil_l_564982: "Today's talisman is ^0000cd20 basil locks^000000. You'll get your hands very dirty today. I'm sorry. But grandma has spoken so That's the bottom line."
  npc_override_lasagna_lasagna_npcs_today_s_talisman_basils_3d5f8d: "Today's talisman is ^0000cd20 basils and 5 basil locks^000000. Same as the first. The most basic is the most useful."
  npc_override_lasagna_lasagna_npcs_today_s_talisman_basils_d5ff97: "Today's talisman is ^0000cd20 basils and 5 basil locks^000000. Tie them firmly and carry them around. Then he'll be safe today."
  npc_override_lasagna_lasagna_npcs_today_s_talisman_let_me_d6d3ad: "Today's talisman... Let me see."
  npc_override_lasagna_lasagna_npcs_today_s_wind_good_fish_1d704e: "Today's wind is good! The fish will dry nicely."
  npc_override_lasagna_lasagna_npcs_today_won_t_boring_i_d9e3ee: "Today won't be boring? I wonder who'll visit me today. Who is it?"
  npc_override_lasagna_lasagna_npcs_tomei_thomas_7ec6c8: "- Tomei Thomas -"
  npc_override_lasagna_lasagna_npcs_too_hard_you_0a0d4d: "Was it too hard for you?"
  npc_override_lasagna_lasagna_npcs_too_heavy_tight_annoying_95c7fe: "This is too heavy, tight and annoying. This is just too uncomfortable."
  npc_override_lasagna_lasagna_npcs_too_heavy_tight_annoying_9f2503: "This is too heavy, tight and annoying. This is just so uncomfortable."
  npc_override_lasagna_lasagna_npcs_too_late_go_report_kalu_eee31e: "Too late. Go and report to Kalu."
  npc_override_lasagna_lasagna_npcs_too_tough_you_handle_33b5d1: "Was it too tough for you to handle?"
  npc_override_lasagna_lasagna_npcs_top_they_also_discovered_87ab8b: "On top of that, they also discovered a new sea route to the continent of Midgard!"
  npc_override_lasagna_lasagna_npcs_try_again_2dc228: "- and try again. -"
  npc_override_lasagna_lasagna_npcs_try_again_624fb2: "Try again."
  npc_override_lasagna_lasagna_npcs_try_make_him_talk_again_4055b0: "Try make him talk again."
  npc_override_lasagna_lasagna_npcs_tuna_served_again_first_15b077: "Tuna is served again. First day was tuna, second day was tuna pasta, third day was fried tuna, fourth day was braised tuna... I'm sick of it. Just had it. Did we do something to anger the sous chef?"
  npc_override_lasagna_lasagna_npcs_tut_4aa53a: "Tut."
  npc_override_lasagna_lasagna_npcs_twinkle_twinkle_little_s_bf789f: "Twinkle twinkle little star - how I wonder what you are -"
  npc_override_lasagna_lasagna_npcs_uh_boatswain_person_who_22718c: "Uh, that boatswain is the person who had asked for my help."
  npc_override_lasagna_lasagna_npcs_uh_yes_i_m_sorry_34f848: "Uh... yes. I'm sorry. I didn't mean to."
  npc_override_lasagna_lasagna_npcs_uh_you_legalas_who_suppl_07c45a: "Uh, are you Legalas who supplies kaluna?"
  npc_override_lasagna_lasagna_npcs_um_did_you_really_catch_7d2c02: "Um, did you really catch Sweet Roda Frog?"
  npc_override_lasagna_lasagna_npcs_unfair_dda60c: "This is unfair."
  npc_override_lasagna_lasagna_npcs_unfair_i_haven_t_known_260b77: "It is unfair that I haven't known about this method so far!"
  npc_override_lasagna_lasagna_npcs_unfortunately_i_became_u_525a9f: "But unfortunately, ^0000cdI became unable to be on a ship^000000. I can't tell you why. It's classified information."
  npc_override_lasagna_lasagna_npcs_unfortunately_most_pages_91cbaf: "Unfortunately, most of the pages were gone in the fire. I could barely recognize the remaining of the document."
  npc_override_lasagna_lasagna_npcs_unfortunately_those_page_759145: "Unfortunately, those pages contained ^0000cdthe record about Captain Gamberi^000000. Since Gamberi is our captain, I have done my best to make the record."
  npc_override_lasagna_lasagna_npcs_up_above_world_so_high_059e4d: "Up above the world so high - like a diamond in the sky -"
  npc_override_lasagna_lasagna_npcs_up_level_village_hypnoti_75806d: "Up to level 49, the village hypnotist will reset your stats and skills."
  npc_override_lasagna_lasagna_npcs_up_level_your_skills_sta_49be3b: "^4d4dffUp to level 49, your skills and status can be reset anytime you want.^000000"
  npc_override_lasagna_lasagna_npcs_upgrade_a6f47e: "Upgrade"
  npc_override_lasagna_lasagna_npcs_upgrade_amulet_b7211f: "Upgrade Amulet"
  npc_override_lasagna_lasagna_npcs_use_butterfly_wings_item_def3c8: "Use the ^4d4dffButterfly Wings^000000 item to fly straight to that location."
  npc_override_lasagna_lasagna_npcs_use_equip_item_double_cl_76754d: "To use or equip an item, ^4d4dffdouble-click that item^000000, or"
  npc_override_lasagna_lasagna_npcs_use_equip_item_equipment_3e90b8: "^4d4dffTo use or equip an item or equipment registered in the slot, press the key that corresponds to each slot from F1 to F9.^000000"
  npc_override_lasagna_lasagna_npcs_use_thorny_vine_flute_2a005f: "Use a Thorny Vine Flute"
  npc_override_lasagna_lasagna_npcs_using_soft_island_as_bas_d416c2: "Using Soft Island as the base, Butterfly already had a footing in the new world and was making profits. They are just born to be merchants."
  npc_override_lasagna_lasagna_npcs_vigilance_corps_merchant_006684: "The ^0000cdvigilance corps and merchants^000000 are... um... Among several organizations that run Lasagna, you can say that the two created today's Lasagna. And Gamberry, Thomas, and I were at the heart of it."
  npc_override_lasagna_lasagna_npcs_vigilante_chef_2a9de9: "Vigilante Chef"
  npc_override_lasagna_lasagna_npcs_vigilante_corp_only_main_4ce0fc: "The Vigilante Corp not only maintain public order in the town, but also play the main role in running the town."
  npc_override_lasagna_lasagna_npcs_vigilante_haven_t_been_a_813562: "The Vigilante haven't been around for long, but Lasagna was a failing town before we showed up and it's thanks to us that the town is thriving now!"
  npc_override_lasagna_lasagna_npcs_vigilante_s_job_assist_d_ddcc91: "A Vigilante's job is to assist the Dorams who are in the New Continent expedition, in addition to maintaining public order, so please help."
  npc_override_lasagna_lasagna_npcs_vigilantes_over_here_the_47fadc: "Vigilantes! Over here! there's someone here tricking people to get on board!"
  npc_override_lasagna_lasagna_npcs_vit_vitality_which_indic_1f3f0f: "^4d4dffVIT is vitality which indicates health^000000. This is what ^4d4dffboosts your overall HP^000000."
  npc_override_lasagna_lasagna_npcs_waa_aah_meow_73a637: "Waa - aah - meow"
  npc_override_lasagna_lasagna_npcs_waa_d415d0: "Waa."
  npc_override_lasagna_lasagna_npcs_waa_waa_1620a7: "Waa waa!"
  npc_override_lasagna_lasagna_npcs_waa_waa_a2d663: "Waa. Waa!"
  npc_override_lasagna_lasagna_npcs_waa_waa_eabe6e: "Waa. Waa."
  npc_override_lasagna_lasagna_npcs_wahaha_another_victory_m_9fea9b: "Wahaha! Another victory for me! What a rewarding day!"
  npc_override_lasagna_lasagna_npcs_wait_box_looks_familiar_1ec0f4: "Wait. This box looks familiar..."
  npc_override_lasagna_lasagna_npcs_wait_guy_holding_dda4c8: "Wait, that guy is holding..."
  npc_override_lasagna_lasagna_npcs_wait_take_you_come_handy_73f356: "Wait, take this with you. It will come in handy in case of an emergency. Please be careful!"
  npc_override_lasagna_lasagna_npcs_waited_long_time_almost_27ae93: "Waited for a long time. Almost died waiting."
  npc_override_lasagna_lasagna_npcs_want_some_tiger_strike_s_5ff040: "Want some tiger strike or something?"
  npc_override_lasagna_lasagna_npcs_warehouse_service_also_s_a9ba42: "The ^4d4dffWarehouse service^000000 is also similar."
  npc_override_lasagna_lasagna_npcs_warehouse_service_costs_97ecc9: "The Warehouse Service costs 50 Zeny."
  npc_override_lasagna_lasagna_npcs_wasn_t_supposed_lengthy_77f7c3: "It wasn't supposed to be lengthy like this."
  npc_override_lasagna_lasagna_npcs_water_element_superior_f_d5def6: "Water element is superior to Fire element."
  npc_override_lasagna_lasagna_npcs_way_how_s_your_settlemen_3ebee0: "By the way, how's your settlement in this land coming along?"
  npc_override_lasagna_lasagna_npcs_way_please_dda474: "This way, please."
  npc_override_lasagna_lasagna_npcs_way_there_shining_grass_cf9297: "By the way, there is ^4d4dffShining Grass^000000 in this world."
  npc_override_lasagna_lasagna_npcs_way_things_you_only_need_854420: "With the way things are, you only need to pass a simple test if you want to join the Vigilante and take part in the 'Midgard Expedition'."
  npc_override_lasagna_lasagna_npcs_way_we_re_going_see_817fd2: "By the way, we're going to see each other again tomorrow, right?"
  npc_override_lasagna_lasagna_npcs_way_you_get_upper_hand_0134ba: "That way, you can get the upper hand of a battle."
  npc_override_lasagna_lasagna_npcs_way_you_know_what_skill_35a217: "By the way, do you know what a ^4d4dffSkill Tree^000000 is?"
  npc_override_lasagna_lasagna_npcs_we_accept_people_new_con_0294a4: "Do we accept the people from the new continent now?"
  npc_override_lasagna_lasagna_npcs_we_all_kinds_chores_hand_bb27cd: "We do all kinds of chores from handling the urchins at the port to maintaining the security of the village."
  npc_override_lasagna_lasagna_npcs_we_almost_lost_all_our_fae7e0: "We almost lost all our customers who wanted fish cake. Thanks a lot!"
  npc_override_lasagna_lasagna_npcs_we_aren_t_as_laid_fb8ebb: "We aren't as laid-back as you people."
  npc_override_lasagna_lasagna_npcs_we_cannot_quite_trust_st_86cf98: "Not we cannot quite trust the story told by Pepperoncino. I cannot record the story I cannot trust."
  npc_override_lasagna_lasagna_npcs_we_cannot_sail_off_like_8641ad: "We cannot sail off like this."
  npc_override_lasagna_lasagna_npcs_we_caught_storm_parted_t_2e4941: "And we were caught in a storm and parted with ^0000cdThomas' ship, Navi^000000. We kept on looking for Navi."
  npc_override_lasagna_lasagna_npcs_we_d_better_head_square_f2e118: "We'd better head to the square."
  npc_override_lasagna_lasagna_npcs_we_didn_t_get_orders_69418f: "We didn't get orders for this menu that often, so It's strange that there's so many requests. Did the word spread finally that It's good?"
  npc_override_lasagna_lasagna_npcs_we_doing_charity_work_he_e31527: "We are not doing a charity work here. We train promising Dorams and send them to the new continent to bring honor to the name of Doram. That's why train you guys."
  npc_override_lasagna_lasagna_npcs_we_don_t_wear_clothes_c58e56: "We don't wear clothes."
  npc_override_lasagna_lasagna_npcs_we_drink_together_00c065: "We can drink together!"
  npc_override_lasagna_lasagna_npcs_we_gathered_those_lousy_123dd6: "We gathered those lousy dorams and sent them to the vigilance corps and merchants. Lasagna's ^0000cdmaintenance of order was handled by the vigilantes^000000, and ^0000cdeverything related to the products was handled by the merchants^000000."
  npc_override_lasagna_lasagna_npcs_we_get_rid_fog_8f59fb: "Can we get rid of the fog?"
  npc_override_lasagna_lasagna_npcs_we_go_anywhere_if_we_9b6733: "We can go anywhere if we have the wind and the sail."
  npc_override_lasagna_lasagna_npcs_we_gracious_enough_give_f7c20a: "We are gracious enough to give humans like you a chance to go to the land of Lasagna."
  npc_override_lasagna_lasagna_npcs_we_heading_new_world_loa_6df03e: "We are heading to the new world loaded with supplies. I wanted to take a close look and this is a great opportunity."
  npc_override_lasagna_lasagna_npcs_we_legendary_vigilante_c_03bc16: "We are the legendary Vigilante Corp that protects Lasagna!"
  npc_override_lasagna_lasagna_npcs_we_ll_continue_after_you_a80ed3: "We'll continue after you get back."
  npc_override_lasagna_lasagna_npcs_we_ll_move_right_next_275d28: "We'll move right on to the next test."
  npc_override_lasagna_lasagna_npcs_we_lost_butterfly_storm_ee2854: "We lost Butterfly to the storm we met on the second day we left Port Richoli. We were so devastated that no one was able to say anything when we returned to Lasagna."
  npc_override_lasagna_lasagna_npcs_we_make_some_fish_cake_d6ef1b: "Can we make some fish cake today? I beg you. Please don't make me send my customers home empty handed. They came after a long time for fish cakes."
  npc_override_lasagna_lasagna_npcs_we_met_storm_everyone_we_8a638c: "We met a storm. Everyone was well-prepared, so the damage was not huge. I guess this is what a know-how is."
  npc_override_lasagna_lasagna_npcs_we_need_something_as_wel_f13e3e: "We need to do something as well."
  npc_override_lasagna_lasagna_npcs_we_need_take_off_anytime_8f41c3: "We need to take off anytime soon, and the preparation for sailing is not made properly."
  npc_override_lasagna_lasagna_npcs_we_never_had_any_rats_e15660: "We never had any rats but all of a sudden the ship is infested. Upon investigation, the boatswain... you're such a..."
  npc_override_lasagna_lasagna_npcs_we_our_way_lasagna_capta_28afda: "We are on our way to Lasagna. Captain Gamberry and Captain Thomas had a long conversation."
  npc_override_lasagna_lasagna_npcs_we_re_almost_finished_ka_22e148: "But we're almost finished with the kaluna in store and the person who supplies us hasn't been here for days. Even the ones we had in stockpile are nearly gone."
  npc_override_lasagna_lasagna_npcs_we_re_communing_48d548: "We're communing."
  npc_override_lasagna_lasagna_npcs_we_re_full_so_there_e66929: "We're full, so there's only one thing to do. Sleep."
  npc_override_lasagna_lasagna_npcs_we_re_team_245fd5: "We're a team."
  npc_override_lasagna_lasagna_npcs_we_re_thoroughly_prepare_842cb8: "We're thoroughly prepared all right!"
  npc_override_lasagna_lasagna_npcs_we_run_into_storms_so_48cb63: "We run into storms so often that I'm wondering if we should change our course. Thank god we avoided the storm in Port Richoli."
  npc_override_lasagna_lasagna_npcs_we_see_i_ll_come_88a229: "We will see. I'll come back if I want to."
  npc_override_lasagna_lasagna_npcs_we_sent_someone_hurry_fi_741afe: "We sent someone in a hurry to find some mushroom spores, but nothing. No news at all."
  npc_override_lasagna_lasagna_npcs_we_t_call_test_if_5ac822: "We can't call it a test if you intervene, can we?"
  npc_override_lasagna_lasagna_npcs_we_trim_your_beards_we_1cd8f8: "We trim your beards. We comb your tails. Be sure to groom yourselves before setting out to the new world."
  npc_override_lasagna_lasagna_npcs_we_unable_issue_sailing_f47af4: "We are unable to issue the sailing signal because of the fog. Ask the ^0000cdChief Officer^000000 if there would be any change in the sailing schedule. If there is any, go fix it."
  npc_override_lasagna_lasagna_npcs_we_ve_gotten_along_prett_465522: "we've gotten along pretty well, but recently, they've started causing trouble around Lasagna."
  npc_override_lasagna_lasagna_npcs_we_weren_t_born_same_9a24ad: "We weren't born on the same day, but Let's all die on the same day!"
  npc_override_lasagna_lasagna_npcs_we_wish_you_pleasant_day_de7c63: "We wish you a pleasant day on Con-Chliina!"
  npc_override_lasagna_lasagna_npcs_we_wondering_if_we_had_40adba: "We were wondering if we had to go down there to recover your dead body..."
  npc_override_lasagna_lasagna_npcs_weather_good_today_isn_t_305630: "The weather is good today, isn't it?"
  npc_override_lasagna_lasagna_npcs_weather_sunny_warm_25c121: "The weather is sunny and warm, but..."
  npc_override_lasagna_lasagna_npcs_weird_ship_firm_why_so_4bd9a2: "Weird. The ship is firm, but why is it so nauseous?"
  npc_override_lasagna_lasagna_npcs_welcome_724486: "Welcome."
  npc_override_lasagna_lasagna_npcs_welcome_board_welcome_co_147ba1: "Welcome on board. Welcome to ^0000cdCon-Chliina^000000. We will send you safely to your destination. However, we cannot sail off right at this moment."
  npc_override_lasagna_lasagna_npcs_welcome_thank_you_your_e_5c7fcd: "Welcome. Thank you for your effort. Please report it now."
  npc_override_lasagna_lasagna_npcs_well_24e5b9: "Well, is this..."
  npc_override_lasagna_lasagna_npcs_well_don_t_bring_dishono_312c52: "Well, don't bring dishonor to the name of Doram, OK? However, since you have been trained here, you will be able to play your part wherever you are. Good luck."
  npc_override_lasagna_lasagna_npcs_well_don_t_i_new_6a93cc: "Well, don't I have the ^0000cdnew helper^000000 in front of me?"
  npc_override_lasagna_lasagna_npcs_well_he_may_had_some_a449a8: "Well, he may have had some influence..."
  npc_override_lasagna_lasagna_npcs_well_he_s_denial_i_1e1d0e: "Well, he's in denial but I think he's been possessed by an evil spirit. He opened a sealed jar on an uninhabited island."
  npc_override_lasagna_lasagna_npcs_well_he_seems_living_off_8a3e3f: "Well... He seems to be living off on one superstition to another. Like dolls and salts."
  npc_override_lasagna_lasagna_npcs_well_how_i_find_dragon_3f43bc: "Well, how can I find the dragon's nest?"
  npc_override_lasagna_lasagna_npcs_well_i_after_basilisks_j_c93298: "Well, I was after the basilisks just before."
  npc_override_lasagna_lasagna_npcs_well_i_am_sure_we_7159ef: "Well, I am not sure. We need to check out the story with other versions. Since there are discrepancies, I cannot make the record counting on the words of Captain Gamberi."
  npc_override_lasagna_lasagna_npcs_well_i_don_t_know_037d4f: "Well... I don't know much about the merchant band!"
  npc_override_lasagna_lasagna_npcs_well_i_don_t_mean_55e516: "Well... I don't mean... Hum... Well 10 seconds has passed. Bring me ^0000cd3 Basilrocks^000000, no less. Bring them without anyone knowing. I will make you regret if you tell anyone."
  npc_override_lasagna_lasagna_npcs_well_i_don_t_think_20011d: "Well, I don't think we can get anything more out of him, but I'll let you know if there's something new."
  npc_override_lasagna_lasagna_npcs_well_i_guess_time_me_60b919: "Well, I guess it is the time for me to go out looking for a new adventure, leaving this valuable experience behind."
  npc_override_lasagna_lasagna_npcs_well_i_guess_you_say_bd61c5: "Well, I guess you can say that..."
  npc_override_lasagna_lasagna_npcs_well_i_ll_back_fff634: "Well, I'll be back."
  npc_override_lasagna_lasagna_npcs_well_just_as_i_heard_a83d53: "...Well, just as I heard from Shaman meow. I was told that the Boatswain would make me do it."
  npc_override_lasagna_lasagna_npcs_well_magchi_used_wield_s_cc3f6b: "Well, Magchi used to wield some type of long pole. Maybe that would do. ^0000cdAt least 20^000000 must be taken care of before they run away."
  npc_override_lasagna_lasagna_npcs_well_now_open_skill_wind_2a3c2f: "Well, now. Open the Skill Window and place the First Aid skill in a shortcut key slot to use."
  npc_override_lasagna_lasagna_npcs_well_now_your_hp_being_b94153: "Well, now. Your HP is being restored as the Red Herb does it's work."
  npc_override_lasagna_lasagna_npcs_well_problems_occur_harb_227f71: "Well, problems do occur at the harbor from time to time, but I thought it wouldn't be an issue for you."
  npc_override_lasagna_lasagna_npcs_well_purser_sent_me_take_1c321c: "Well... The Purser has sent me to take care of the problem."
  npc_override_lasagna_lasagna_npcs_well_s_me_i_should_c31fcc: "Well, That's it from me. I should get going..."
  npc_override_lasagna_lasagna_npcs_well_s_particularly_impo_6cded9: "Well, it's not particularly important, but it's like the symbols of the Vigilante Corp..."
  npc_override_lasagna_lasagna_npcs_well_s_really_because_we_b0fbbb: "Well, It's really not because we're shorthanded..."
  npc_override_lasagna_lasagna_npcs_well_stello_con_chliina_0ee48a: "Well, that was Stello of Con-Chliina..."
  npc_override_lasagna_lasagna_npcs_well_thanks_anyway_i_did_0c4b4a: "Well, thanks anyway. I didn't really expect you to bring it for me. I have nothing else to offer you. Since there is a dangerous world out there, take this."
  npc_override_lasagna_lasagna_npcs_well_then_8a21b3: "Well then."
  npc_override_lasagna_lasagna_npcs_well_then_go_ahead_drink_c7cd31: "Well, then. ^4d4dffGo ahead and drink the apple juice that I gave you.^000000"
  npc_override_lasagna_lasagna_npcs_well_then_i_am_counting_91af28: "Well then. I am counting on you."
  npc_override_lasagna_lasagna_npcs_well_then_i_ll_let_1964e9: "Well, then. I'll let you in on something juicy while I'm at it."
  npc_override_lasagna_lasagna_npcs_well_then_i_ll_your_c6e3a7: "Well, then. I'll be your dad!!"
  npc_override_lasagna_lasagna_npcs_well_then_i_m_counting_aad681: "Well, then. I'm counting on you."
  npc_override_lasagna_lasagna_npcs_well_then_let_me_ask_fe35f8: "Well, then let me ask you a favor. Please bring me some of the ingredients in this ^0000cdCookbook^000000. This thing called ^0000cdMastela Fruit Wine^000000... I am curious about this, but it requires some ingredients which are not found here."
  npc_override_lasagna_lasagna_npcs_well_then_let_s_start_50a3d8: "Well then, Let's start cooking. Talk to me again when you are ready!"
  npc_override_lasagna_lasagna_npcs_well_then_safe_trip_515e6c: "Well, then. Have a safe trip."
  npc_override_lasagna_lasagna_npcs_well_then_time_issue_sai_5655a1: "Well then. It is the time to issue the sailing signal."
  npc_override_lasagna_lasagna_npcs_well_there_s_no_choice_d717e6: "Well, there's no choice, then."
  npc_override_lasagna_lasagna_npcs_well_trained_4859e1: "A well-trained."
  npc_override_lasagna_lasagna_npcs_well_two_should_enough_372526: "Well... two should be enough."
  npc_override_lasagna_lasagna_npcs_well_uh_i_m_uh_b84a78: "Well, uh...I'm...uh...I'm free-spirited! That's all!"
  npc_override_lasagna_lasagna_npcs_well_we_re_no_different_b94251: "Well, we're no different because we thought there was only the Far-Star Continent under the sun."
  npc_override_lasagna_lasagna_npcs_well_we_talk_about_later_56a480: "Well, we can talk about that later. I was wondering when you would be back. When the fog was lifted, we figured out that you had succeeded, dear adventurer. Thank you for your effort."
  npc_override_lasagna_lasagna_npcs_well_well_you_seem_know_02e657: "Well, well. You seem to know how things work around here. You can bring it to the Sous Chef. However, the Sous Chef is kind of eccentric. You have to say something when you hand over things to him."
  npc_override_lasagna_lasagna_npcs_well_you_met_all_them_403f80: "Well. Have you met all of them?"
  npc_override_lasagna_lasagna_npcs_what_638f38: "What... is this."
  npc_override_lasagna_lasagna_npcs_what_89511a: "What is it?"
  npc_override_lasagna_lasagna_npcs_what_amazing_adventure_t_d8e69b: "That was... what an amazing adventure. Thank you for sharing your story. I can clearly see where your dignified manner comes from."
  npc_override_lasagna_lasagna_npcs_what_babysitting_about_i_6d6248: "That was what babysitting was about? I didn't know. If I did, I wouldn't have done it."
  npc_override_lasagna_lasagna_npcs_what_basilrock_246743: "What is a Basilrock?"
  npc_override_lasagna_lasagna_npcs_what_be65b9: "What?"
  npc_override_lasagna_lasagna_npcs_what_brought_you_all_way_22686d: "What brought you all the way up here, human?"
  npc_override_lasagna_lasagna_npcs_what_brought_you_here_91ee40: "What brought you here?"
  npc_override_lasagna_lasagna_npcs_what_brought_you_here_ab_1995b6: "What brought you here? Is it about the favor yesterday?"
  npc_override_lasagna_lasagna_npcs_what_brought_you_here_yo_b7d753: "What brought you here? Are you hear to meet the captain? If not, please leave. You are not supposed to be here."
  npc_override_lasagna_lasagna_npcs_what_did_we_wrong_anyway_7e54ad: "What did we do wrong anyway?"
  npc_override_lasagna_lasagna_npcs_what_did_you_bring_somet_a51ead: "What is it? Did you bring something to eat?"
  npc_override_lasagna_lasagna_npcs_what_didn_t_you_say_166d0f: "What is it? didn't you say that you had some business with not me, but Kalu?"
  npc_override_lasagna_lasagna_npcs_what_earth_why_doesn_t_fc1016: "What on earth! Why doesn't it melt?"
  npc_override_lasagna_lasagna_npcs_what_going_ddc44b: "What is going on?"
  npc_override_lasagna_lasagna_npcs_what_gross_looking_thing_783985: "What is this gross looking thing?"
  npc_override_lasagna_lasagna_npcs_what_happened_favor_i_as_851319: "What happened to the favor I asked you. 4 Mastela Fruit and 1 Cat Hardtacks."
  npc_override_lasagna_lasagna_npcs_what_he_saying_2fed23: "What is he saying?"
  npc_override_lasagna_lasagna_npcs_what_hunter_desert_wolf_88f712: "What Hunter Desert Wolf in the world eats fish? A dried one, too!"
  npc_override_lasagna_lasagna_npcs_what_i_2368fe: "What do I do?"
  npc_override_lasagna_lasagna_npcs_what_i_95f33d: "What do I do with it?"
  npc_override_lasagna_lasagna_npcs_what_i_finished_training_326435: "What? I finished the training yesterday."
  npc_override_lasagna_lasagna_npcs_what_i_gather_legalas_fe_b1d62b: "From what I gather, Legalas feeds you, clothes you, and puts a roof over your heads."
  npc_override_lasagna_lasagna_npcs_what_i_hear_you_eat_c1d873: "From what I hear, you eat all the kalunyaks that Legalas cleans. Right now, we're almost out of kaluna made from those kalunyaks. Can you please control yourselves a bit?"
  npc_override_lasagna_lasagna_npcs_what_i_need_day_bun_26cd56: "What I need to day is the ^0000cdBun^000000. We have something similar in Lasagna, but the recipe is totally different."
  npc_override_lasagna_lasagna_npcs_what_i_need_day_cat_69026d: "What I need to day are the ^0000cdCat Hardtack and Malangdo Canned Food^000000. I am curious how the crews of Navi survived through such a long voyage."
  npc_override_lasagna_lasagna_npcs_what_i_should_become_sha_053be7: "What? I should become a Shaman meow? What a nonsense! I am a sailor! I shall die on the sea as a sailor!"
  npc_override_lasagna_lasagna_npcs_what_i_want_isn_t_a61ef6: "What I want isn't too much."
  npc_override_lasagna_lasagna_npcs_what_i_you_3d61cf: "What can I do for you?"
  npc_override_lasagna_lasagna_npcs_what_if_monster_takes_my_272fb1: "What if a monster takes my brother away? That monster's gotta hurt a lot..."
  npc_override_lasagna_lasagna_npcs_what_if_some_bad_news_449022: "What if some bad news reach us even if I try hard making these amulets for their safety?"
  npc_override_lasagna_lasagna_npcs_what_isn_t_boat_stuck_4d6e85: "What? Isn't the boat stuck firmly on the water?!"
  npc_override_lasagna_lasagna_npcs_what_kind_food_you_like_87fde3: "What kind of food do you like to eat? Since Int or Luk dishes won't do much good for you, you can make four kinds of dishes for now."
  npc_override_lasagna_lasagna_npcs_what_look_your_eyes_you_9ef227: "What is that look in your eyes? Do you think I'm pathetic meow?"
  npc_override_lasagna_lasagna_npcs_what_mean_a57d36: "What does that mean?"
  npc_override_lasagna_lasagna_npcs_what_mean_a5ed46: "What does it mean?"
  npc_override_lasagna_lasagna_npcs_what_missing_pages_about_0db4af: "What were the missing pages about?"
  npc_override_lasagna_lasagna_npcs_what_new_world_person_wa_9c785e: "What does a new world person want with me?"
