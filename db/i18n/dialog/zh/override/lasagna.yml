  npc_override_lasagna_lasagna_npcs_i_like_her_7ad853: "我喜欢她……"
  npc_override_lasagna_lasagna_npcs_i_like_relaxing_here_as_587855: "我也喜欢在这里放松。也不会想吃卡鲁尼亚克。"
  npc_override_lasagna_lasagna_npcs_i_ll_back_soon_065a4e: "我很快就回来。"
