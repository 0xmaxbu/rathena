  npc_override_lasagna_lasagna_npcs_first_off_we_should_meet_5e809b: "First off, we should meet up with our leader to make decisions about the schedule."
  npc_override_lasagna_lasagna_npcs_first_you_need_cookbook_74e49f: "First! You need a ^0000cdCookbook^000000."
  npc_override_lasagna_lasagna_npcs_firstly_enhances_status_3d9573: "Firstly, it ^0000cdenhances status^000000."
  npc_override_lasagna_lasagna_npcs_fish_cake_white_fish_fil_5a690c: "Fish cake is a white fish fillet mashed with boiled beans that is shaped and fried. It's really delicious but no one asks for it."
  npc_override_lasagna_lasagna_npcs_five_mushroom_spores_per_186c3b: "Five mushroom spores. Perfect. It was wise to ask an adventurer for help."
  npc_override_lasagna_lasagna_npcs_five_sticky_webfeet_perf_dfe789: "Five sticky webfeet. Perfect."
  npc_override_lasagna_lasagna_npcs_focus_using_summoning_sk_5784c6: "Focus on using the summoning skills so that you can win battles."
  npc_override_lasagna_lasagna_npcs_fog_3a7cb3: "The fog!"
  npc_override_lasagna_lasagna_npcs_fog_94c669: "The fog..."
  npc_override_lasagna_lasagna_npcs_fog_ce4218: "The fog...?"
