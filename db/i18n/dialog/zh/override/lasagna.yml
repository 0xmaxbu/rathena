  npc_override_lasagna_lasagna_npcs_location_sharing_service_fc3433: "位置共享服务"
  npc_override_lasagna_lasagna_npcs_long_ago_feels_like_happ_56e0a5: "不久之前。感觉就像昨天发生的一样。"
  npc_override_lasagna_lasagna_npcs_long_ago_when_there_shel_52db20: "那是很久以前的事了，那时候蛋精还有壳。"
  npc_override_lasagna_lasagna_npcs_long_awaited_first_voyag_c0e2d8: "期待已久的首航。卸完货后，我希望我们能满载而归……"
  npc_override_lasagna_lasagna_npcs_long_foxtail_1b7a0e: "长狐尾"
  npc_override_lasagna_lasagna_npcs_longest_which_had_taken_75e211: "这是最长的一次，花了很长时间和精力。"
  npc_override_lasagna_lasagna_npcs_look_i_m_basilisk_897686: "听着，我不是巴西利斯克。"
  npc_override_lasagna_lasagna_npcs_look_lasagna_out_there_9e3025: "看看那边的千层面。"
  npc_override_lasagna_lasagna_npcs_look_lasagna_what_you_th_b2edef: "看看千层面。你觉得怎么样？"
  npc_override_lasagna_lasagna_npcs_look_over_there_man_slee_a61ba8: "看那边。那个睡在地上、看起来一点也不绅士的家伙。^0000cd他是我们的主厨^000000。船长总是说我们要在自己的岗位上尽力而为。但没用。"
  npc_override_lasagna_lasagna_npcs_look_sunlight_76707d: "但你看。阳光。"
  npc_override_lasagna_lasagna_npcs_looks_delicious_8bb825: "看起来很好吃……"
  npc_override_lasagna_lasagna_npcs_looks_huge_heavy_go_get_2a71e8: "看起来又大又重。去处理掉一些吧。"
  npc_override_lasagna_lasagna_npcs_looks_like_my_son_caused_12fe1c: "看来是我儿子给你惹麻烦了。"
  npc_override_lasagna_lasagna_npcs_looks_like_two_sent_deli_fe3c1c: "看起来这两个可以送到送货队去，趁莱加拉斯还在工作。工资嘛，一天管一顿饭就行。"
  npc_override_lasagna_lasagna_npcs_looks_like_you_got_seasi_5d6a88: "看起来你晕船了。过一会儿会好起来的。到那时候，你走在陆地上反而会觉得奇怪。"
  npc_override_lasagna_lasagna_npcs_looks_lot_large_how_abou_df5e8b: "看起来数量不少而且块头大。要不要减少一些？"
  npc_override_lasagna_lasagna_npcs_lord_imuk_did_you_say_bc5415: "伊穆克大人……你说你活了 2500 年？"
  npc_override_lasagna_lasagna_npcs_lost_record_about_story_d9ac72: "丢失的记录是关于甘贝里船长在成为孔-克利纳号船长之前的故事，非常罕见。"
  npc_override_lasagna_lasagna_npcs_lot_legalas_you_aware_le_ee0107: "这和莱加拉斯有很大关系。你知道莱加拉斯给卡鲁供应由卡鲁尼亚克发酵而成的卡鲁纳，对吧？"
