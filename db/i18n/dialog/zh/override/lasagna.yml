  npc_override_lasagna_lasagna_npcs_besides_fact_he_grew_up_3faa2b: "Besides the fact that he grew up poor in Fusilli, nothing else is known about his early days."
  npc_override_lasagna_lasagna_npcs_besides_seeking_new_adve_3fbd1e: "Besides seeking for new adventures, listening to other people's stories is an adventurer's duty. From what I gather, you've been in Lasagna longer than most people."
  npc_override_lasagna_lasagna_npcs_besides_there_elements_u_85d5e5: "Besides, there are elements of Undead, Holiness and Darkness."
  npc_override_lasagna_lasagna_npcs_beverage_made_mixing_kal_919b3c: "A beverage made by mixing kaluna and milk that three dorams drank when they met up. In their memory, it is now a festival beverage."
