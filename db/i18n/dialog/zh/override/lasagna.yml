  npc_override_lasagna_lasagna_npcs_gamberry_f0a143: "Gamberry"
  npc_override_lasagna_lasagna_npcs_gamberry_hoodlum_who_rem_fdd0b4: "^0000cdGamberry was a hoodlum who reminded me of a ruffian^000000. He soon was moved by my words and joined me in the business."
