  npc_override_lasagna_lasagna_npcs_i_m_better_fighter_than_766318: "我打架比你厉害！"
  npc_override_lasagna_lasagna_npcs_i_m_bit_busy_urgent_ee934e: "但我现在有点忙，有急事要处理，没法给你测试，所以也许晚点……"
