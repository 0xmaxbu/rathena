  npc_override_lasagna_lasagna_npcs_i_m_busy_right_now_7e9b94: "我现在很忙。下次再帮你。抱歉！"
  npc_override_lasagna_lasagna_npcs_i_m_busy_right_now_97547e: "我现在很忙。晚点再做。"
  npc_override_lasagna_lasagna_npcs_i_m_busy_right_now_d2a3c8: "我现在很忙。"
  npc_override_lasagna_lasagna_npcs_i_m_busy_so_busy_9225b5: "我很忙！非常忙！"
  npc_override_lasagna_lasagna_npcs_i_m_casting_hypnosis_you_38f9f3: "我正在为年轻人催眠，为了他们的未来。"
  npc_override_lasagna_lasagna_npcs_i_m_chief_peperoncino_vi_fb660d: "我是义警团的团长佩佩隆奇诺。"
