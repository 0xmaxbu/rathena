  npc_override_lasagna_lasagna_npcs_i_m_sorry_hear_young_c2a109: "很遗憾听到这个消息。但那个小家伙有错。在如意珠被找回之前，巴西利斯克会继续它们的任务。"
  npc_override_lasagna_lasagna_npcs_i_m_sorry_my_sister_fcf8f4: "对不起。如果我不以合适的价格卖出，我姐姐会生气的。你能带 10 个喵族代币回来吗？"
  npc_override_lasagna_lasagna_npcs_i_m_sorry_our_chit_06170c: "抱歉，我们的闲聊到此为止。忙着照顾小弟弟们的时候，时间过得真快。"
  npc_override_lasagna_lasagna_npcs_i_m_sorry_say_when_658a8f: "很抱歉在你这么努力帮我们的时候说这个，但你要不要找找别的工作？我觉得让你的才能浪费掉太可惜了。"
  npc_override_lasagna_lasagna_npcs_i_m_still_too_young_1b60dd: "我还太小，不能加入民兵队，但我确信一旦加入，我能成为队伍的骨干，因为我坚持训练自己。"
  npc_override_lasagna_lasagna_npcs_i_m_supposed_pluck_red_da87e7: "但我应该去拔红草……"
  npc_override_lasagna_lasagna_npcs_i_m_sure_i_help_7a1749: "我相信我什么忙都能帮上。"
  npc_override_lasagna_lasagna_npcs_i_m_sure_if_you_8381f8: "我不确定你是否知道，但这是巴西利斯克，一种生活在离这里不远的生物。"
  npc_override_lasagna_lasagna_npcs_i_m_sure_won_t_7f15f8: "我相信不会因为一杯卡鲁纳牛奶就发生那种事。"
  npc_override_lasagna_lasagna_npcs_i_m_sure_you_ve_e9b90d: "我相信你去过拉维奥利平原。你一定是从那里来的。"
  npc_override_lasagna_lasagna_npcs_i_m_thinking_about_invit_a4ba72: "我正在考虑明天邀请孔-克利纳号的所有船员，举办一场宴会。"
  npc_override_lasagna_lasagna_npcs_i_m_using_summoning_skil_8c4819: "^4d4dff我通过提升 INT 来使用召唤技能进行魔法攻击！^000000"
  npc_override_lasagna_lasagna_npcs_i_m_working_bcd835: "我没有在工作。"
  npc_override_lasagna_lasagna_npcs_i_m_worried_6f0477: "我很担心。"
  npc_override_lasagna_lasagna_npcs_i_may_feigned_death_i_1f4cbd: "我可能装死了，但我不是胆小鬼。它真的又大又吓人。嗯，现在这不重要了。去找塔尔图菲。告诉他我今天去不了了，很抱歉。"
  npc_override_lasagna_lasagna_npcs_i_mean_here_comes_newbie_c772fa: "我的意思是，^0000cd新手来了！^000000"
  npc_override_lasagna_lasagna_npcs_i_mean_making_eating_a55e6f: "我是说做，不是吃。"
  npc_override_lasagna_lasagna_npcs_i_mean_pepperoncino_lead_f0faa5: "我是说^0000cd义警团的团长佩佩隆奇诺^000000。他现在一定在新开的冒险者俱乐部吃早餐。"
  npc_override_lasagna_lasagna_npcs_i_met_stello_then_i_7e96c3: "我那时遇到了斯特洛。我^0000cd改造了当时是小偷的斯特洛^000000。他现在成了首席官。"
  npc_override_lasagna_lasagna_npcs_i_might_need_get_some_06be8f: "我明天可能还需要一些蘑菇孢子之类的东西，所以再来一趟。我要赶快把这些带回去然后休息。谢谢！我欠你的。"
  npc_override_lasagna_lasagna_npcs_i_must_bathe_sunlight_sl_553e77: "在这样的日子里，我必须沐浴阳光然后睡觉……"
  npc_override_lasagna_lasagna_npcs_i_must_repay_you_saving_dfebdc: "我一定要报答你救了我的鱼串。非常感谢。"
  npc_override_lasagna_lasagna_npcs_i_need_deliver_some_mess_66c23a: "我正好也要给卡鲁送个口信，所以我把这两个带走。"
  npc_override_lasagna_lasagna_npcs_i_need_ice_cubes_today_754bc9: "我今天需要^0000cd冰块^000000。我听说某个洞穴里的冰块即使在盛夏也不会融化。"
  npc_override_lasagna_lasagna_npcs_i_need_someone_ask_favor_883ec5: "我需要找人帮忙。你看起来经验还不够丰富。"
  npc_override_lasagna_lasagna_npcs_i_need_you_defeat_our_e8df6d: "我需要你今天也打败我们的对手——野生大黄蜂。大约十只。谢谢！"
  npc_override_lasagna_lasagna_npcs_i_never_betray_gamberi_7a0248: "我永远不会背叛甘贝里。"
  npc_override_lasagna_lasagna_npcs_i_never_imagined_even_my_e0f29a: "我做梦也没想到除了^4d4dff米德加尔特^000000或我们居住的^4d4dff远星^000000之外，还会有别的大陆。"
  npc_override_lasagna_lasagna_npcs_i_no_idea_which_eggring_99bff5: "我不知道是哪只蛋精吞了那个箱子，但你开始猎杀它们之后就会找到。"
  npc_override_lasagna_lasagna_npcs_i_no_work_so_i_903779: "我没活干，所以再吃点东西。"
  npc_override_lasagna_lasagna_npcs_i_only_done_what_you_fff6e6: "我只做了你让我做的事。"
  npc_override_lasagna_lasagna_npcs_i_opened_jar_unfortunate_15fd7b: "我打开了罐子。那是场不幸的意外。"
  npc_override_lasagna_lasagna_npcs_i_pepperoncino_thomas_wa_251326: "我、佩佩隆奇诺和托马斯想干一票大的。非常非常大的。不像我们以前做的那些。是做生意。"
  npc_override_lasagna_lasagna_npcs_i_persistently_persuaded_510dc2: "我^0000cd坚持不懈地说服孔-克利纳号的船长和船员去寻找蝴蝶号^000000。我的努力终于有了回报，我们在新世界的^0000cd一个偏远岛屿上^000000找到了他们。"
  npc_override_lasagna_lasagna_npcs_i_picked_up_few_things_6128a5: "我捡到了一些东西，让我试试。等等。"
  npc_override_lasagna_lasagna_npcs_i_pray_your_peace_safety_474799: "我为你祈求平安。告诉水手长，他随时可以改变主意回来。"
  npc_override_lasagna_lasagna_npcs_i_really_like_job_i_828797: "我真的很喜欢这份工作！可以闻到花香，还能采到蜂蜜！"
  npc_override_lasagna_lasagna_npcs_i_received_handful_i_don_b90b61: "我已经收到了一些。我不需要更多了。"
  npc_override_lasagna_lasagna_npcs_i_refuse_use_martial_art_26cd1d: "我拒绝像你那样随意使用武术！"
  npc_override_lasagna_lasagna_npcs_i_remember_everyone_i_ve_9134b6: "我记得每一个我遇到过的人。"
  npc_override_lasagna_lasagna_npcs_i_reset_skills_statuses_707634: "我只有在你的等级保持在 49 级或以下时，才免费重置技能和状态。"
  npc_override_lasagna_lasagna_npcs_i_reward_you_handsomely_76147b: "我会慷慨地奖励你。请明天再帮我一个忙。"
  npc_override_lasagna_lasagna_npcs_i_reward_you_handsomely_fa85ff: "我会慷慨地奖励你。不过，你还没能永久解决这个问题，所以我没必要遵守那个承诺。"
  npc_override_lasagna_lasagna_npcs_i_said_i_ll_go_0a9e99: "我说了我会去见卡鲁。反正我也很无聊，所以没关系。走吧，你带路。"
  npc_override_lasagna_lasagna_npcs_i_said_i_m_back_dec822: "我说了我回来了。"
  npc_override_lasagna_lasagna_npcs_i_say_no_i_don_09e648: "我不得不说不。我不想一辈子当个水手小子。"
  npc_override_lasagna_lasagna_npcs_i_see_c52c6e: "我明白了。"
  npc_override_lasagna_lasagna_npcs_i_see_let_me_take_ff84c0: "我明白了。让我快速参观一下。"
  npc_override_lasagna_lasagna_npcs_i_see_let_s_say_f33e56: "我明白了。我们遇到的时候打个招呼吧。嗯，当你把它交给副厨师长的时候，一定要遵循我的指示，好吗？"
  npc_override_lasagna_lasagna_npcs_i_see_lot_out_towners_cd5bdc: "我最近看到很多外地人。"
  npc_override_lasagna_lasagna_npcs_i_see_must_duty_captain_df94b9: "我明白了。^0000cd撕毁和焚烧文件也一定是船长的职责吧^000000，我猜。"
  npc_override_lasagna_lasagna_npcs_i_see_sorry_about_basili_3de4f5: "我明白了。关于巴西利斯克的事很抱歉。我会处理的。"
  npc_override_lasagna_lasagna_npcs_i_see_tartufi_causing_tr_67b928: "我明白了。塔尔图菲又在惹麻烦。今天巴西利斯克在撒野。"
  npc_override_lasagna_lasagna_npcs_i_see_then_you_strong_bef854: "我明白了。那你很强吗？你说你抓了一些巴西利斯克。"
  npc_override_lasagna_lasagna_npcs_i_see_you_around_often_daa1c8: "我最近经常看到你。你看起来真奇怪。没有胡须的脸和没有尾巴的屁股。"
  npc_override_lasagna_lasagna_npcs_i_see_you_re_new_9ff052: "我明白了。你来自新世界。但马奇呢？"
  npc_override_lasagna_lasagna_npcs_i_see_you_taking_care_924768: "我看到你正在处理我请你帮忙的事。"
  npc_override_lasagna_lasagna_npcs_i_seems_so_949043: "看来是这样。"
  npc_override_lasagna_lasagna_npcs_i_sent_many_other_people_440dbb: "我派过很多人去。但都没用。他不会向孔-克利纳号上的任何人敞开心扉谈论他的过去。所以我需要^0000cd一个新的视角^000000。"
  npc_override_lasagna_lasagna_npcs_i_seriously_hope_he_did_629270: "我真希望他做了。否则我就死定了！"
  npc_override_lasagna_lasagna_npcs_i_shook_there_no_sound_7d46b6: "我摇了摇，但没有声音。我很好奇里面有什么，被密封得那么仔细却一点声音也没有。"
  npc_override_lasagna_lasagna_npcs_i_should_check_cargo_bef_3baab2: "我应该起航前检查货物。"
  npc_override_lasagna_lasagna_npcs_i_should_done_earlier_f0b13c: "我早就该这么做了。"
  npc_override_lasagna_lasagna_npcs_i_should_get_going_oh_cb13fd: "我该走了。哦，天哪。"
  npc_override_lasagna_lasagna_npcs_i_should_left_there_walk_fe5f54: "我应该把它留在那里然后走开。"
  npc_override_lasagna_lasagna_npcs_i_should_pluck_all_red_2f22cc: "我应该把这片药草田里的所有红草都拔掉……"
  npc_override_lasagna_lasagna_npcs_i_should_stay_con_chliin_509185: "我应该留在孔-克利纳号上很长时间，见证我们有所发现的时刻。"
  npc_override_lasagna_lasagna_npcs_i_should_stop_so_many_71d19c: "我应该去很多地方看看。"
  npc_override_lasagna_lasagna_npcs_i_should_ve_seen_you_d8e0f8: "我本该从你身上看出来的，因为翻山越岭从来都不容易。"
  npc_override_lasagna_lasagna_npcs_i_should_welcome_new_dor_6d482f: "我应该欢迎新来的喵族。"
  npc_override_lasagna_lasagna_npcs_i_smell_something_smell_9f8a11: "我闻到了什么。新手的味道……"
  npc_override_lasagna_lasagna_npcs_i_suffered_too_much_seas_b8567f: "我晕船太严重了，没法去冒险。"
  npc_override_lasagna_lasagna_npcs_i_suppose_so_they_must_5e57e6: "我想也是。他们一定在什么地方喝着卡鲁纳牛奶打着呼噜。到了起航的时候他们会回来的。你到时候可以见到他们……"
  npc_override_lasagna_lasagna_npcs_i_supposed_give_haru_bc29aa: "我本该把它给哈鲁的。"
  npc_override_lasagna_lasagna_npcs_i_t_8d4b8d: "我做不到。"
  npc_override_lasagna_lasagna_npcs_i_t_believe_how_you_4438f7: "我真不敢相信！你怎么能说这么重的船能浮在水上？！"
  npc_override_lasagna_lasagna_npcs_i_t_believe_i_going_602a3f: "我真不敢相信我居然要离开这么舒适的地方。我忘了吃卡鲁尼亚克是我人生中最大的乐趣。"
  npc_override_lasagna_lasagna_npcs_i_t_believe_i_should_a6e312: "我真不敢相信我得整天带着它……"
  npc_override_lasagna_lasagna_npcs_i_t_believe_i_ve_6d97b1: "我真不敢相信我一直都在吃它们。"
  npc_override_lasagna_lasagna_npcs_i_think_adventurer_knows_16fc2c: "我想冒险者已经知道问题所在了。"
  npc_override_lasagna_lasagna_npcs_i_think_d_best_you_38c9dc: "我觉得你最好先去见见团长。"
  npc_override_lasagna_lasagna_npcs_i_think_i_m_going_a44d6f: "我想照这样下去我会死的……"
  npc_override_lasagna_lasagna_npcs_i_think_i_m_going_d37960: "我想我会在和睡意斗争中死去的喵。"
  npc_override_lasagna_lasagna_npcs_i_think_i_m_having_cb1177: "我想我今天很倒霉……"
  npc_override_lasagna_lasagna_npcs_i_think_ll_suit_my_c6dba0: "我觉得那很适合我的性格。"
  npc_override_lasagna_lasagna_npcs_i_think_one_lively_happy_08b15a: "我觉得这是一个充满活力的快乐村庄！"
  npc_override_lasagna_lasagna_npcs_i_think_s_just_should_872f81: "……我觉得就是这样。我应该再检查一遍，还是就此打住？"
  npc_override_lasagna_lasagna_npcs_i_think_s_something_i_11df2c: "我想这个我可以处理。事实上，我每天都要^0000cd往洞穴里送便当^000000。"
  npc_override_lasagna_lasagna_npcs_i_think_someone_more_exp_f68063: "我觉得这种事应该由更有经验的人来处理。我还是个新手。"
  npc_override_lasagna_lasagna_npcs_i_think_they_used_make_ab57ac: "我想它们被用来做肥料。"
  npc_override_lasagna_lasagna_npcs_i_think_you_better_off_760f1b: "但我认为你更适合做别的行当，而不是这一行。"
  npc_override_lasagna_lasagna_npcs_i_think_you_find_another_0c27e4: "我想你可以在广场上找到另一个像我这样的义警……"
  npc_override_lasagna_lasagna_npcs_i_think_you_should_go_976b30: "我想你现在应该去采摘一些。"
  npc_override_lasagna_lasagna_npcs_i_think_you_should_seek_dea956: "但我认为你应该寻求更大的冒险。别让你的才能浪费在这个穷乡僻壤，去更大的地方吧。"
  npc_override_lasagna_lasagna_npcs_i_think_you_step_up_af2462: "我想这次你可以出马处理了。"
  npc_override_lasagna_lasagna_npcs_i_thinking_about_just_no_a7e7ed: "我刚才在想这件事。嗯，你为冒险接受过适当的训练吗？在此之前，你不想^0000cd测试一下你的实力^000000吗？"
  npc_override_lasagna_lasagna_npcs_i_thought_so_i_went_fe854a: "我也这么想。我捂着耳朵去睡觉了。奇怪的是，第二天和之后每天都会再次发生。"
  npc_override_lasagna_lasagna_npcs_i_thought_tasty_food_mad_ed90d1: "我以为那是店里用某种神秘食材做的美味食物。"
  npc_override_lasagna_lasagna_npcs_i_threw_away_pot_got_813e7d: "我扔掉了罐子，上了孔-克利纳号。当天晚上就发生了。"
  npc_override_lasagna_lasagna_npcs_i_told_disturb_oh_who_c99eef: "我说了别打扰……哦，你是谁？"
  npc_override_lasagna_lasagna_npcs_i_told_you_enter_kitchen_dee853: "我说了别那样进厨房……哦……你是新大陆来的吗？"
  npc_override_lasagna_lasagna_npcs_i_told_you_enter_kitchen_f637c6: "我说了别那样进厨房……哦……你看起来很眼熟……"
  npc_override_lasagna_lasagna_npcs_i_told_you_re_headed_8fe501: "我听说你要去新大陆。"
  npc_override_lasagna_lasagna_npcs_i_understand_40038e: "我明白了。"
  npc_override_lasagna_lasagna_npcs_i_understand_though_let_49fb3c: "不过我能理解。我们去找便当吧。"
  npc_override_lasagna_lasagna_npcs_i_ve_always_wanted_boat_7682b9: "我一直想坐船……哈……怀旧……"
  npc_override_lasagna_lasagna_npcs_i_ve_given_you_all_54344f: "我已经告诉了你药草学基础的所有细节。"
  npc_override_lasagna_lasagna_npcs_i_ve_given_you_more_90e5a0: "如果我有的话我会给你更多，但是……没有。"
  npc_override_lasagna_lasagna_npcs_i_ve_got_finish_quickly_6670f0: "我得赶紧完成这个，然后去港口见他！"
  npc_override_lasagna_lasagna_npcs_i_ve_had_anchovies_befor_1d4f4e: "我以前吃过鳀鱼，因为莱加拉斯时不时会买一些。"
  npc_override_lasagna_lasagna_npcs_i_ve_urgent_matters_take_3632e7: "我有急事要处理，先告辞了。"
  npc_override_lasagna_lasagna_npcs_i_ve_worked_here_while_5a5162: "我在这里工作了一段时间，但我仍然是最年轻的，所以所有的碗碟都是我洗。"
  npc_override_lasagna_lasagna_npcs_i_want_go_back_37f0e8: "我想回去。"
  npc_override_lasagna_lasagna_npcs_i_want_go_there_myself_397dac: "我也想自己去那里！"
  npc_override_lasagna_lasagna_npcs_i_want_no_more_2e1c7f: "我不想要更多了。"
  npc_override_lasagna_lasagna_npcs_i_want_share_mine_i_bd9065: "我想分享我的。我能告诉你吗？"
  npc_override_lasagna_lasagna_npcs_i_wanted_break_free_name_74d209: "我想摆脱家族名号的束缚。我跑出来，在千层面四处游荡。"
  npc_override_lasagna_lasagna_npcs_i_wish_you_godspeed_465347: "祝你一帆风顺！"
  npc_override_lasagna_lasagna_npcs_i_won_t_go_until_1f44c1: "我要吃完这些才走。"
  npc_override_lasagna_lasagna_npcs_i_won_t_hear_story_67cf97: "我不想听故事。"
  npc_override_lasagna_lasagna_npcs_i_won_t_listen_c66d6d: "我不会听的。"
  npc_override_lasagna_lasagna_npcs_i_won_t_listen_i_6fe28c: "我不听。我不想卷入另一件麻烦事。"
  npc_override_lasagna_lasagna_npcs_i_won_t_surprised_if_1d7ce3: "如果雾里冲出一只怪物，我也不会惊讶。我还闻到了烟味。最近附近有火山喷发吗？"
  npc_override_lasagna_lasagna_npcs_i_wondering_if_you_need_7360f3: "我在想你在船上是否需要帮忙。"
  npc_override_lasagna_lasagna_npcs_i_wondering_why_you_sudd_8e1fb4: "我在想你为什么突然把这两个带出来。原来是这么回事。带着他们到处走一定很辛苦。"
  npc_override_lasagna_lasagna_npcs_ice_cubes_i_am_just_802f95: "冰块。我光是想到它们就很兴奋。不会融化的冰块！这确实是个新大陆。"
  npc_override_lasagna_lasagna_npcs_if_anything_happened_he_000908: "如果出了什么事，他会需要帮助。"
  npc_override_lasagna_lasagna_npcs_if_he_chooses_become_sha_f07882: "如果他选择不成为萨满喵，那么他必须每天^0000cd依赖一个新的护符^000000。但如果他选择成为萨满喵，就让他来找我。"
  npc_override_lasagna_lasagna_npcs_if_he_pays_attention_det_3c6dc3: "如果他注重细节，他的护符会更好。但他就是不在乎。"
  npc_override_lasagna_lasagna_npcs_if_he_t_meet_deadline_50e1f7: "如果他赶不上截止日期或送货量，他的工作就会被别人取代。"
  npc_override_lasagna_lasagna_npcs_if_i_cannot_recover_i_032457: "如果我无法恢复，我就应该重建它。我试图采访甘贝里船长来填补缺失的页面，但甘贝里船长没有回应。"
  npc_override_lasagna_lasagna_npcs_if_i_find_item_suitable_faf076: "如果我找到适合约吉的物品，我会付 {0}……"
  npc_override_lasagna_lasagna_npcs_if_i_thorn_49f2a3: "如果我对荆棘这样做……"
  npc_override_lasagna_lasagna_npcs_if_i_you_i_ve_cd6c80: "如果我是你，我早就离开了。你不是因为不知道怎么去才呆在这里的吧？如果是这样，那我就告诉你。为了报答救命恩人，这点事我还是能做的。"
  npc_override_lasagna_lasagna_npcs_if_legalas_loses_his_job_5c6fa3: "如果莱加拉斯丢了工作，他就赚不到钱了。如果他赚不到钱，那你们不就有麻烦了吗？"
  npc_override_lasagna_lasagna_npcs_if_normal_fog_you_need_ca091a: "如果是普通的雾。你需要等它散去。但是，有^0000cd什么东西在引起这场雾^000000。可以驱散它。"
  npc_override_lasagna_lasagna_npcs_if_our_cows_t_eat_8fd128: "如果我们的奶牛吃不到草，我们就挤不了奶。如果没有新鲜牛奶，我们就做不了卡鲁纳牛奶。"
  npc_override_lasagna_lasagna_npcs_if_player_wishes_they_us_683e8f: "^4d4dff如果玩家愿意，可以使用社交选项，如组队、队伍或公会。在这里，他们可以加入队伍或请求交易。^000000"
  npc_override_lasagna_lasagna_npcs_if_s_all_right_you_0e4cd6: "如果你不介意的话，我可以帮你找份工作吗？你今天做了很多，请好好休息，明天见。"
  npc_override_lasagna_lasagna_npcs_if_s_something_important_b14de6: "如果是重要的东西，我不能给你。"
  npc_override_lasagna_lasagna_npcs_if_someone_opens_jar_tho_b9bc8e: "但如果有人打开罐子，那些邪灵就会依附在那个傻瓜身上，重复同样的过程。在宿主死亡之前，没有办法摆脱它们。换句话说，没有能让水手长满意的解决办法。"
  npc_override_lasagna_lasagna_npcs_if_there_anything_else_m_f08231: "如果还有其他东西可以卖，我会买一些带到那边去卖。我要成为百万富翁。"
  npc_override_lasagna_lasagna_npcs_if_there_s_anything_you_33ce1e: "如果你有什么想知道的，尽管来找我。上船后，务必向^0000cd事务长^000000打个招呼。"
  npc_override_lasagna_lasagna_npcs_if_time_permits_i_ll_3950dc: "如果时间允许，我会早点出来等你。"
  npc_override_lasagna_lasagna_npcs_if_violence_subdues_viol_41b794: "如果暴力制服暴力，那什么来制服暴力？总之，千层面就像一个腐烂的垃圾桶。相比之下，富西利是一个完全无辜的小镇！"
  npc_override_lasagna_lasagna_npcs_if_we_had_those_we_bf7719: "如果我们有那些，我们可以保鲜食物，随时喝冰镇卡鲁纳牛奶。^0000cd20 个冰块^000000就行，谢谢。"
  npc_override_lasagna_lasagna_npcs_if_you_any_questions_don_a1471c: "如果你有任何问题，尽管问他。"
  npc_override_lasagna_lasagna_npcs_if_you_anybody_decent_br_0646f5: "如果你有什么像样的人，带来吧。我人手严重不足，所有这些活都是我一个人干的。"
  npc_override_lasagna_lasagna_npcs_if_you_ask_haru_she_82a227: "如果你问哈鲁，她会告诉你如何把它们制成效果更强的药水。"
  npc_override_lasagna_lasagna_npcs_if_you_bring_all_ingredi_32549f: "如果你把所有食材都带来，我们就可以烹饪。快点。"
  npc_override_lasagna_lasagna_npcs_if_you_bring_all_ingredi_c14587: "如果你把所有食材都带来，我们就可以烹饪！"
  npc_override_lasagna_lasagna_npcs_if_you_bring_them_me_e03e60: "如果你把它们带来给我，我会慷慨地奖励你。"
  npc_override_lasagna_lasagna_npcs_if_you_defeat_them_then_d4b19f: "如果你能打败它们，剩下的我会尽力处理。谢谢。"
  npc_override_lasagna_lasagna_npcs_if_you_don_t_cheese_6cb9af: "如果你没有奶酪，我很乐意收 Zeny。"
  npc_override_lasagna_lasagna_npcs_if_you_don_t_like_013e29: "如果你不喜欢刚学的技能，我可以帮你重置。"
  npc_override_lasagna_lasagna_npcs_if_you_eat_you_move_5d0355: "吃了这个，你可以比别人移动得快得多。甚至比蜂鸟扇动翅膀还快。"
  npc_override_lasagna_lasagna_npcs_if_you_fall_down_due_e14bd8: "如果你在冒险途中因疲劳而倒下，你应该回村。这就是这个服务的用途。"
  npc_override_lasagna_lasagna_npcs_if_you_freshly_squeezed_60947f: "如果你有现挤的牛奶，你就能品尝到顶级的卡鲁纳牛奶。"
  npc_override_lasagna_lasagna_npcs_if_you_get_any_59fb0c: "如果你有机会得到的话。"
  npc_override_lasagna_lasagna_npcs_if_you_go_lasagna_there_b9fcfb: "如果你去千层面，那里有一个^4D4DFF[码头]^000000。从那里坐船去新世界。无论你去哪里，我都祝你一切顺利。感谢你所做的一切喵。"
  npc_override_lasagna_lasagna_npcs_if_you_happen_amulet_my_70fe20: "如果你碰巧有我弟弟约塔做的护符，我可以帮你抛光。"
  npc_override_lasagna_lasagna_npcs_if_you_happen_meet_human_1aacf0: "如果你碰巧在米德加尔特大陆遇到人类，为什么不去问问他们呢？"
  npc_override_lasagna_lasagna_npcs_if_you_hurry_you_should_ba3fcd: "如果你赶时间，你应该去见^0000cd船长和首席官^000000。他们决定是否起航。他们在楼上的船长室里。"
  npc_override_lasagna_lasagna_npcs_if_you_i_ll_give_976b0d: "如果你做了，我就给你鳀鱼，好吗？"
  npc_override_lasagna_lasagna_npcs_if_you_need_anything_jus_c4c03b: "如果你需要什么，尽管说！"
  npc_override_lasagna_lasagna_npcs_if_you_need_anything_tal_c38a21: "如果你需要什么，跟这里的奥利奥说。"
  npc_override_lasagna_lasagna_npcs_if_you_need_curse_someon_4dd0ee: "如果你需要诅咒某人、破除诅咒或需要一点运气，就来找我。"
  npc_override_lasagna_lasagna_npcs_if_you_need_help_please_2b9da8: "如果你需要帮助，请帮他们阻止龙喷火。"
  npc_override_lasagna_lasagna_npcs_if_you_need_help_then_ff8d3c: "如果你需要帮助，你至少应该告诉我该做什么。"
  npc_override_lasagna_lasagna_npcs_if_you_re_going_order_432e8a: "如果你不打算点东西，就滚出去！"
  npc_override_lasagna_lasagna_npcs_if_you_re_planning_cross_ce4cf6: "如果你打算翻越那个山脊，我不建议你去。"
  npc_override_lasagna_lasagna_npcs_if_you_re_ruining_his_1ed207: "如果你现在在破坏他的工作，是什么让你觉得莱加拉斯以后不会做什么？他很可能会把你们两个赶走，去找其他机会。"
  npc_override_lasagna_lasagna_npcs_if_you_run_into_problem_b08878: "如果你遇到问题，请他们帮忙。你知道的，义警团里的那对双胞胎。阿利奥……阿利……奥利……"
  npc_override_lasagna_lasagna_npcs_if_you_show_me_what_f449a9: "如果你让我看看你有什么本事，我就让路。"
  npc_override_lasagna_lasagna_npcs_if_you_time_sit_down_c32ecb: "如果你有空，坐下来和我聊聊。"
  npc_override_lasagna_lasagna_npcs_if_you_want_amulet_you_557762: "如果你想要护符，可以用喵族代币交换。我有一堆护符。"
  npc_override_lasagna_lasagna_npcs_if_you_want_boost_your_09ffb9: "如果你想提升物理攻击，专注力量。如果你想要魔法攻击，就加智力。明白了吗？"
  npc_override_lasagna_lasagna_npcs_if_you_want_dispose_any_9a510b: "如果你想处理任何物品，你应该来找我。"
  npc_override_lasagna_lasagna_npcs_if_you_want_drink_kaluna_dcc9b5: "如果你想喝卡鲁纳牛奶，去找隔壁那个人。但你最好快点。搅拌还是摇晃，很快就无关紧要了。"
  npc_override_lasagna_lasagna_npcs_if_you_want_go_you_d87662: "如果你想走，你应该带上我。"
  npc_override_lasagna_lasagna_npcs_if_you_want_kaluna_then_f175c8: "如果你想要卡鲁纳，那就想办法对付^0000cd那边那两个家伙^000000！我快要疯了，他们不仅缠着我，现在还毁了我的工作。也许我回到战场上去更好！"
  npc_override_lasagna_lasagna_npcs_if_you_want_learn_how_19d308: "如果你想学烹饪，随时来找我。"
  npc_override_lasagna_lasagna_npcs_if_you_want_see_detailed_1b7135: "如果你想^4d4dff查看每个物品的详细说明，右键点击该物品。^000000"
  npc_override_lasagna_lasagna_npcs_if_you_wish_i_find_565297: "如果你愿意，我可以帮你找点事做。但不是今天。也许明天。今天你应该好好休息。"
  npc_override_lasagna_lasagna_npcs_if_you_wish_speak_me_6e0afb: "如果你想跟我说话，那你最好先去积累更多经验。"
  npc_override_lasagna_lasagna_npcs_ignore_him_a6cf4a: "无视他。"
  npc_override_lasagna_lasagna_npcs_impetuous_because_youth_405107: "年少气盛。"
  npc_override_lasagna_lasagna_npcs_indeed_if_exist_then_we_3dc31f: "确实，如果它存在，我们就能找到它，总有一天会航行到那里！"
  npc_override_lasagna_lasagna_npcs_indeed_who_else_such_idi_a1b30a: "确实，谁会做这么蠢的事呢？我帮不了他，请离开吧。"
  npc_override_lasagna_lasagna_npcs_ingredients_apple_carrot_8f53d9: "食材是^0000cd1 个苹果和 2 个胡萝卜^000000。"
  npc_override_lasagna_lasagna_npcs_ingredients_apple_clover_51d102: "食材是^0000cd1 个苹果和 1 片四叶草^000000。"
  npc_override_lasagna_lasagna_npcs_ingredients_clover_green_f072c9: "食材是^0000cd1 片四叶草、1 个绿色药草和 1 个红色药草^000000。"
  npc_override_lasagna_lasagna_npcs_ingredients_jellopy_fluf_1c9850: "食材是^0000cd1 个杰勒比结晶、1 块毛和 1 根羽毛^000000。"
  npc_override_lasagna_lasagna_npcs_inside_amulet_seems_pret_9a2ebf: "这个护符的内部看起来相当坚固。"
  npc_override_lasagna_lasagna_npcs_insufficient_materials_r_6b9637: "材料不足，无法免费修复。"
  npc_override_lasagna_lasagna_npcs_int_refers_intelligence_ca97c8: "^4d4dffINT 代表智力，MATK 代表魔法攻击力^000000。如果你的技能以魔法为中心，你必须首先提升 INT。"
  npc_override_lasagna_lasagna_npcs_isn_t_fog_covering_area_eddd8d: "雾气不是笼罩着海岸附近吗？就这样起航不会有问题吗？"
  npc_override_lasagna_lasagna_npcs_isn_t_fog_made_smoke_f27dfb: "不是。这场雾是由^0000cd洞穴里的龙^000000生气时喷出的烟雾形成的。请等待^0000cd义警们^000000处理完毕。"
  npc_override_lasagna_lasagna_npcs_isn_t_kahlugnag_you_hold_33f6cd: "你手里拿的不是^0000cd卡鲁纳牛奶^000000吗？不是谁都能拥有的，你知道吗。"
  npc_override_lasagna_lasagna_npcs_isn_t_natural_fog_1078c9: "这不是普通的雾吗？"
  npc_override_lasagna_lasagna_npcs_isn_t_time_meet_purser_b51053: "是不是该去见事务长了？"
  npc_override_lasagna_lasagna_npcs_isn_t_your_test_765f35: "这不是你的测试。"
  npc_override_lasagna_lasagna_npcs_item_window_comes_four_t_e47de0: "物品窗口有四个标签页。"
  npc_override_lasagna_lasagna_npcs_items_automatically_plac_45eaa9: "物品根据其类型自动放入物品、装备和其他标签页。"
  npc_override_lasagna_lasagna_npcs_jindou_937495: "金豆。"
  npc_override_lasagna_lasagna_npcs_jindou_i_ll_leave_rest_83dc1f: "金豆，剩下的交给你了。"
  npc_override_lasagna_lasagna_npcs_jogi_dandi_about_burst_i_29bea3: "约吉，丹迪快要哭了。请规矩点，好吗？"
  npc_override_lasagna_lasagna_npcs_joke_should_pleasant_bot_7d80c4: "笑话应该让双方都愉快。这纯粹是诅咒。"
  npc_override_lasagna_lasagna_npcs_just_deliver_big_lunchbo_bb1036: "就把这个大便当送给在外面洞穴巡逻的潘纳。"
  npc_override_lasagna_lasagna_npcs_just_flip_through_any_ar_42f19d: "随便翻翻关于我的文章就行。"
  npc_override_lasagna_lasagna_npcs_just_glaring_him_won_t_e300a7: "光瞪着他不会让他开口的。"
  npc_override_lasagna_lasagna_npcs_just_go_already_713fa6: "快走吧！"
  npc_override_lasagna_lasagna_npcs_just_like_yourself_there_af3fdf: "就像你自己一样，最近有很多人穿越这片山脉前往^4d4dff新大陆^000000。"
  npc_override_lasagna_lasagna_npcs_just_never_happened_befo_fefc17: "只是以前从未发生过。"
  npc_override_lasagna_lasagna_npcs_just_pluck_red_grass_col_6ead62: "只要^4d4dff拔掉红草，收集 2 个红色药草^000000就行。就这样。"
  npc_override_lasagna_lasagna_npcs_just_saying_doesn_t_hurt_6f3441: "只是说说……说说又不碍事。"
  npc_override_lasagna_lasagna_npcs_just_take_you_a41da9: "带上这个吧。"
  npc_override_lasagna_lasagna_npcs_just_time_i_just_moment_172da5: "来得正好。我刚好有点时间，想继续研究新大陆的美食。你能帮我弄些食材来吗？"
  npc_override_lasagna_lasagna_npcs_just_time_since_fog_gone_ddce23: "来得正好。既然雾散了，我们很快就能起航。"
  npc_override_lasagna_lasagna_npcs_kah_poltergeist_had_been_b8907b: "喀……一直睡在我包里的骚灵在作怪！"
  npc_override_lasagna_lasagna_npcs_kahlugnag_eggring_he_mad_71af6f: "^0000cd卡鲁纳牛奶^000000？那个蛋精！他让这个新手做这种事来恶作剧！嘿，我很抱歉。请接受我的道歉。"
  npc_override_lasagna_lasagna_npcs_kalu_adventurers_club_wa_b28639: "冒险者俱乐部的卡鲁想知道为什么送货晚了。他今天有足够的存货可以卖，所以你只要今天能送到就没问题。"
  npc_override_lasagna_lasagna_npcs_kalu_tell_kalu_you_deliv_0869e6: "卡鲁！告诉卡鲁你送了便当，这样我们就可以吃饭了！"
  npc_override_lasagna_lasagna_npcs_kaluna_made_kaluna_maste_defac7: "卡鲁纳由南桥附近的卡鲁纳大师制作。具体配方我不能说，因为是商业机密，但我可以告诉你一件事。"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_0711d4: "卡鲁纳牛奶？"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_62a089: "^0000cd[卡鲁纳牛奶]^000000"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_aebcbd: "卡鲁纳牛奶！"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_also_symboli_23893a: "卡鲁纳牛奶也象征着^0000cd信仰、友谊和节日^000000。具体细节我不能在这里讨论，但如果你好奇，去找孔-克利纳号的记录员。"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_glass_gentle_c7dc03: "卡鲁纳牛奶！给那边那位绅士一杯！"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_shaken_4af60b: "卡鲁纳牛奶！摇晃的！"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_shaken_one_g_b1514e: "卡鲁纳牛奶，摇晃的！一杯！"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_should_shake_031405: "卡鲁纳牛奶应该摇晃。"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_should_shake_78babc: "卡鲁纳牛奶应该摇晃。你必须摇晃才能品尝到充分发酵的卡鲁纳与牛奶混合时产生的微妙风味。"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_should_stirr_9540c2: "卡鲁纳牛奶应该搅拌。"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_should_stirr_98ebc6: "卡鲁纳牛奶应该搅拌。最近有很多流浪者涌到这里，喜欢摇晃的人变多了。但那是小孩子的喝法，不是吗？"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_stirred_0b9453: "卡鲁纳牛奶，搅拌的！"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_stirred_glas_ebaa89: "卡鲁纳牛奶，搅拌的！给那边那位绅士一杯！"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_stirred_one_65ffc5: "卡鲁纳牛奶，搅拌的！一杯！哦，管他呢！两杯！"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_stirred_one_8feac2: "卡鲁纳牛奶，搅拌的！一杯！"
  npc_override_lasagna_lasagna_npcs_kalunyak_definitely_best_b201b5: "卡鲁尼亚克绝对是最好的。"
  npc_override_lasagna_lasagna_npcs_keep_hunting_eggrings_un_0cab81: "继续猎杀蛋精，直到找到那个箱子……"
  npc_override_lasagna_lasagna_npcs_keep_mind_you_need_watch_49489a: "记住这一点。和这艘船的船员打交道时，你需要注意礼节。"
  npc_override_lasagna_lasagna_npcs_keep_short_i_am_busy_7b0fcb: "长话短说。我很忙。"
  npc_override_lasagna_lasagna_npcs_keeps_crying_uncontrolla_dc6aa3: "～不停地大哭～ 不要！！妈妈！！爸爸！！"
  npc_override_lasagna_lasagna_npcs_kitten_hoisted_box_given_5a3de4: "小猫把给他的箱子高高举起，兴奋地尖叫着"
  npc_override_lasagna_lasagna_npcs_knock_knock_da5aec: "- 敲门声 -"
  npc_override_lasagna_lasagna_npcs_knock_yes_very_important_67571b: "敲门……是的，敲门非常重要。"
  npc_override_lasagna_lasagna_npcs_known_gone_missing_storm_cd22e1: "据悉在风暴中失踪，但后来被发现安全抵达并定居在新世界。消息传开后，蝴蝶号被广泛视为冒险和英雄的象征。"
  npc_override_lasagna_lasagna_npcs_l_day_afdd5e: "^0000cd[千层面日]^000000"
  npc_override_lasagna_lasagna_npcs_land_we_crossed_called_f_6d007c: "我们跨过的那片土地叫远星。"
  npc_override_lasagna_lasagna_npcs_lasagna_celebrates_day_a_dc92dd: "千层面每年都会以盛大的烟花和节日来庆祝这一天。"
  npc_override_lasagna_lasagna_npcs_lasagna_fresh_sea_breeze_0505a9: "在千层面，清新的海风总是轻抚着你的胡须。"
  npc_override_lasagna_lasagna_npcs_lasagna_just_awful_when_dce583: "我第一次来千层面的时候，这里糟透了。你呼吸一下就会有人找茬。你走着走着就会有人打架。甘贝里船长到处制止那些人群，但他在我心目中的第一印象和他们没什么两样。"
  npc_override_lasagna_lasagna_npcs_lasagna_port_over_way_447802: "千层面港在那边！"
  npc_override_lasagna_lasagna_npcs_lasagna_port_town_locate_e47357: "千层面是位于远星大陆尽头的一个港口城镇。"
  npc_override_lasagna_lasagna_npcs_lasagna_s_anchovies_spec_cccd9c: "千层面的鳀鱼很特别。顶级鳀鱼要经过九次蒸制和干燥，然后去除头和内脏。这是一项需要精细工艺的艺术作品。"
  npc_override_lasagna_lasagna_npcs_lasagna_somewhere_you_ju_c7e376: "千层面只是一个年轻时顺便来赚点钱的地方。大多数人都离开了这里……"
  npc_override_lasagna_lasagna_npcs_lasagna_z_400811: "到千层面 - {0}z"
  npc_override_lasagna_lasagna_npcs_later_he_began_working_a_4701dd: "后来，他开始在一家鳀鱼工坊工作。"
  npc_override_lasagna_lasagna_npcs_later_he_safely_arrived_060696: "后来，他安全抵达并定居在新世界的软岛。他正在稳步扩展他的领域。"
  npc_override_lasagna_lasagna_npcs_later_then_437700: "那就以后再说。"
  npc_override_lasagna_lasagna_npcs_leaf_lunatics_grass_fabr_3cf8d6: "^4d4dff3 只叶精和 2 只草精！^000000"
  npc_override_lasagna_lasagna_npcs_least_ten_should_caught_75780e: "至少应该抓十只。"
  npc_override_lasagna_lasagna_npcs_leave_18c638: "离开。"
  npc_override_lasagna_lasagna_npcs_left_click_mouse_button_8681b5: "左键单击鼠标可与 NPC 对话、移动和攻击目标。^000000"
  npc_override_lasagna_lasagna_npcs_legalas_gets_rid_kalunya_fe9378: "莱加拉斯去掉卡鲁尼亚克的壳，把它放进容器里。然后你从那个容器里吃。很简单，对吧？"
  npc_override_lasagna_lasagna_npcs_legalas_i_tried_everythi_6a95cc: "莱加拉斯，我试了一切办法让他们干活，但他们既没有技能也没有意愿。"
  npc_override_lasagna_lasagna_npcs_let_me_drop_when_i_e22227: "我有空的时候会顺路过来。"
  npc_override_lasagna_lasagna_npcs_let_me_explain_statuses_f87cd1: "让我详细解释一下状态。"
