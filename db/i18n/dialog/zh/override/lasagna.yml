  npc_override_lasagna_lasagna_npcs_expand_our_flourishing_b_331de5: "To expand our flourishing business, we ^0000cdbegan sea trade^000000. But during this time, ^0000cdThomas's ship Butterfly went missing in a typhoon^000000."
  npc_override_lasagna_lasagna_npcs_explains_slew_dorams_who_27bbb9: "That explains the slew of Dorams, who simply wander about, in ^4d4dffLasagna^000000, which was nothing but a fishing village in the border area."
