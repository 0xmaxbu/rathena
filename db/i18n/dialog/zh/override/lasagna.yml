  npc_override_lasagna_lasagna_npcs_s_gone_what_relief_2619ad: "不见了。真是松了口气！"
  npc_override_lasagna_lasagna_npcs_s_great_empty_out_all_92dc43: "清空所有货物，装上新的返回，感觉真好。我感到自豪，就像收获并广泛传播作物一样。"
  npc_override_lasagna_lasagna_npcs_s_honey_lasagna_fields_c_b9c1f0: "是蜂蜜。千层面的田野里开满了香甜的花朵，所以我们可以收集到很多优质蜂蜜。"
  npc_override_lasagna_lasagna_npcs_s_house_where_lots_flowe_9f047d: "^4d4dff那是摆满了很多花盆的房子。^000000你不会错过的。"
  npc_override_lasagna_lasagna_npcs_s_i_witnessed_murder_eve_5919f1: "是《我在满月之夜目睹了一场谋杀》。你知道这个故事的话，就告诉我。"
  npc_override_lasagna_lasagna_npcs_s_like_register_vigilant_77bcb3: "这就像义警成员的登记册。"
  npc_override_lasagna_lasagna_npcs_s_more_than_enough_e95600: "那绰绰有余了。"
  npc_override_lasagna_lasagna_npcs_s_my_first_time_new_8d1871: "这是我第一次来新世界，我真的很兴奋。你决定好到了之后先做什么了吗？我想先去妙勒尼山脉！"
  npc_override_lasagna_lasagna_npcs_s_nice_name_3ba764: "{0}……这名字不错。"
  npc_override_lasagna_lasagna_npcs_s_okay_i_care_68f96c: "没关系。我在乎。"
  npc_override_lasagna_lasagna_npcs_s_okay_if_you_decide_6e5971: "如果你决定不帮忙也没关系喵。"
  npc_override_lasagna_lasagna_npcs_s_okay_just_leave_them_8ae353: "没关系，就放那儿吧。我晚点回镇上的时候再带走。"
  npc_override_lasagna_lasagna_npcs_s_okay_too_i_came_094a12: "那也没关系。我已经死而复生很多次了。只要睡个又长又沉的觉就能恢复喵。"
  npc_override_lasagna_lasagna_npcs_s_problem_i_m_upset_422870: "那不是我生气的问题所在。"
  npc_override_lasagna_lasagna_npcs_s_relief_competent_doram_3d5759: "身边有个能干的喵族真是让人放心。"
  npc_override_lasagna_lasagna_npcs_s_right_4b5ef4: "没错。"
  npc_override_lasagna_lasagna_npcs_s_right_ddafea: "没错！"
  npc_override_lasagna_lasagna_npcs_s_right_gamberry_da721f: "没错，甘贝里……"
  npc_override_lasagna_lasagna_npcs_s_rude_s_okay_you_6069e5: "那很无礼，但没关系。你不是唯一一个喵。"
  npc_override_lasagna_lasagna_npcs_s_small_thriving_town_th_3b1f89: "这是一个虽小但繁荣的城镇，归功于佩佩隆奇诺团长、甘贝里船长和托马托马斯船长的努力！"
  npc_override_lasagna_lasagna_npcs_s_someone_help_me_dorams_ff817e: "有——有人救救我……喵族们，它们太可爱了我要死了……"
  npc_override_lasagna_lasagna_npcs_s_too_early_right_now_f87d3b: "现在太早了。着急解决不了问题。"
  npc_override_lasagna_lasagna_npcs_s_too_expensive_e14766: "太贵了。"
  npc_override_lasagna_lasagna_npcs_s_what_gentleman_f7e520: "这才是绅士所为。"
  npc_override_lasagna_lasagna_npcs_s_what_i_meant_cat_b029f2: "……我不是那个意思！这只猫的脑袋里一定全是脂肪！"
  npc_override_lasagna_lasagna_npcs_s_what_i_want_hear_c88cb5: "那不是我想听的。看看我们即将探索的大海。"
  npc_override_lasagna_lasagna_npcs_s_what_tartufi_said_77eb1f: "塔尔图菲就是这么说的。"
  npc_override_lasagna_lasagna_npcs_s_where_our_cows_grazing_2a0d22: "那是我们的奶牛放牧的地方。那里的草新鲜干净，所以牛奶味道极好。"
  npc_override_lasagna_lasagna_npcs_s_why_taken_long_time_894e0c: "这就是为什么要花很长时间研究和制作这份记录。"
  npc_override_lasagna_lasagna_npcs_s_why_we_went_through_34e6fc: "这就是我们不辞辛劳来到这里的意义！就像佩佩隆奇诺、托马斯和甘贝里一样，我们也会团结起来并取得成功！"
  npc_override_lasagna_lasagna_npcs_sailed_out_soft_island_w_18ee09: "从软岛出发。我们可能还会再来几次。"
  npc_override_lasagna_lasagna_npcs_sailing_depends_your_han_998d76: "航行取决于你的本事，亲爱的冒险者。好了，去完成你的第一个任务吧！"
  npc_override_lasagna_lasagna_npcs_same_time_we_ran_vigilan_ecea3a: "同时，我们组织了^0000cd义警团^000000来整顿千层面的治安。许多人因我们的理想而加入。"
  npc_override_lasagna_lasagna_npcs_saved_meow_dcc8ea: "得救了，喵！"
  npc_override_lasagna_lasagna_npcs_say_yes_3527d3: "说\\\\\\\\\\\\\\\"是\\\\\\\\\\\\\\\"。"
  npc_override_lasagna_lasagna_npcs_scoffs_alright_then_639833: "～嗤笑～ 好吧，那行。"
  npc_override_lasagna_lasagna_npcs_search_again_12616f: "再搜一次。"
  npc_override_lasagna_lasagna_npcs_search_bce064: "搜索"
  npc_override_lasagna_lasagna_npcs_search_butterfly_second_7d7cb3: "第二次搜索蝴蝶号。没有结果。我们找不到蝴蝶号的任何残骸。所以它们一定平安无事。"
  npc_override_lasagna_lasagna_npcs_search_target_set_goal_c_e56c43: "搜索目标，设定目标，点击寻路。"
  npc_override_lasagna_lasagna_npcs_seasickness_90cebe: "晕船。"
  npc_override_lasagna_lasagna_npcs_seaway_we_about_take_no_2374f3: "我们将要航行的海路^0000cd不是普通的海路^000000。你需要读懂星辰和风的动向。你需要走地图上没有标记的路线，甚至会让你怀疑能否找到陆地。"
  npc_override_lasagna_lasagna_npcs_secondly_recovers_hp_sp_a0dcef: "其次，它^0000cd恢复 HP 和 SP^000000。恢复量也取决于烹饪等级，有些食物只恢复 HP。"
  npc_override_lasagna_lasagna_npcs_see_what_i_mean_differen_a08f07: "明白我的意思吧？和上次版本不同。"
  npc_override_lasagna_lasagna_npcs_see_you_again_21444b: "再见。"
  npc_override_lasagna_lasagna_npcs_see_you_later_d94b6f: "回头见。"
  npc_override_lasagna_lasagna_npcs_seems_like_yeouiju_must_d7eca0: "看来如意珠是成为龙的必需品。所以巴西利斯克才会找塔尔图菲的麻烦？"
  npc_override_lasagna_lasagna_npcs_sell_fa3cf2: "出售"
  npc_override_lasagna_lasagna_npcs_sell_your_belongings_581b79: "出售你的物品。"
  npc_override_lasagna_lasagna_npcs_selling_specialty_produc_27533e: "是^0000cd销售特产^000000。甘贝里的朋友^0000cd托马斯^000000加入了我们，我们决定在千层面开展业务。但问题是^0000cd那些糟糕的喵族^000000。"
  npc_override_lasagna_lasagna_npcs_seriously_wounded_mildly_db80b7: "重伤 1 人，轻伤 13 人，优质鳀鱼 23 箱，卡鲁纳 7 罐，胡须梳 1 箱，精细布料 200 卷。"
  npc_override_lasagna_lasagna_npcs_set_sail_ah_right_you_330acd: "起航？啊，对。你说你来自新世界。那我能请你帮个忙吗？请告诉他们的^0000cd团长^000000，让他们安静点。"
  npc_override_lasagna_lasagna_npcs_set_sail_then_you_advent_f036da: "起航？那你是个冒险者？我听马奇说发现了一个新世界。一片无人去过的未知之地。我希望我也能去。"
  npc_override_lasagna_lasagna_npcs_setup_skill_you_d_like_b82d22: "设置你想要使用的技能，以便在战斗中使用。"
  npc_override_lasagna_lasagna_npcs_shaken_009f7f: "动摇了。"
  npc_override_lasagna_lasagna_npcs_shaman_meow_as_bad_as_0e98ea: "萨满喵没有你想的那么坏。你有空的时候为什么不去做个咨询呢。"
  npc_override_lasagna_lasagna_npcs_shaman_meow_lives_seclud_5cf8ac: "萨满喵住在村子入口附近一个偏僻的地方。"
  npc_override_lasagna_lasagna_npcs_shaman_meow_living_seclu_4dfe83: "萨满喵住在千层面入口处一个偏僻的地方。我希望像你这样来自新地方的陌生人能解决我的问题。"
  npc_override_lasagna_lasagna_npcs_shaman_meow_sure_seems_v_1d22ec: "那个萨满喵确实很有远见。我现在相信了。我相信护符真的很有效。请现在去帮我弄一个。拜托了。"
  npc_override_lasagna_lasagna_npcs_shaman_meow_told_me_ridd_9ddd24: "^0000cd萨满喵^000000告诉我一个谜语：来自新地方的陌生人会解决这个问题。我们的相遇不是巧合。"
  npc_override_lasagna_lasagna_npcs_she_gets_angry_easily_ma_2cd2a5: "她容易生气，但会给我做新衣服，说我值得穿漂亮的。"
  npc_override_lasagna_lasagna_npcs_shining_twig_charm_20011c: "发光树枝护符"
  npc_override_lasagna_lasagna_npcs_ship_i_want_ship_3ad010: "船。我想上^0000cd船^000000！"
  npc_override_lasagna_lasagna_npcs_ship_s_log_b51e7b: "航海日志"
  npc_override_lasagna_lasagna_npcs_ship_set_off_when_time_b6dde8: "船到时候会出发的。"
  npc_override_lasagna_lasagna_npcs_short_i_really_enjoyed_y_2d098c: "时间虽短，但我真的很高兴有你在这里。再会了。"
  npc_override_lasagna_lasagna_npcs_shortcut_key_settings_yo_422889: "^4d4dff在快捷键设置中，你可以按自己的喜好选择相应的快捷键。"
  npc_override_lasagna_lasagna_npcs_shortcut_key_settings_yo_ea184d: "^4d4dff在快捷键设置中，你可以按自己的喜好选择相应的快捷键。^000000"
  npc_override_lasagna_lasagna_npcs_should_better_than_sprou_9e643e: "它应该比你带来的那棵嫩芽要好。"
  npc_override_lasagna_lasagna_npcs_should_i_help_you_find_628924: "要我帮你找小偷吗？"
  npc_override_lasagna_lasagna_npcs_should_i_just_jump_off_2daad1: "我是不是应该直接从甲板上跳下去……？"
  npc_override_lasagna_lasagna_npcs_should_produce_i_guess_h_eff5c9: "这应该能做出 {0}，我猜。你觉得怎么样？"
  npc_override_lasagna_lasagna_npcs_show_below_neck_area_50fbe1: "（展示脖子以下的区域。）"
  npc_override_lasagna_lasagna_npcs_show_me_your_amulet_you_c02d37: "给我看看你的护符，好吗？我在你的背包里找不到。"
  npc_override_lasagna_lasagna_npcs_shows_detailed_descripti_b64c1e: "这会显示所选物品的详细说明。"
  npc_override_lasagna_lasagna_npcs_shrieks_hi_hiya_cb7636: "～尖叫～ 嗨……嗨呀……"
  npc_override_lasagna_lasagna_npcs_shrieks_you_startled_me_d099aa: "～尖叫～ 你吓到我了！"
  npc_override_lasagna_lasagna_npcs_shut_your_mouth_you_re_3fee70: "闭嘴！你一回到村里就加入义警团，明白吗？"
  npc_override_lasagna_lasagna_npcs_sighs_deeply_a0e251: "........～深深叹了口气～……"
  npc_override_lasagna_lasagna_npcs_signs_deeply_my_head_spi_5b3007: "～深深叹了口气～ 我的头好晕！"
  npc_override_lasagna_lasagna_npcs_simply_drag_appropriate_740efb: "或者，只需将适当的物品拖拽到你想要装备的位置即可。^000000"
  npc_override_lasagna_lasagna_npcs_simply_drag_appropriate_b8e85f: "只需将适当的物品拖拽到你想要装备的位置即可。^000000"
  npc_override_lasagna_lasagna_npcs_since_condition_dragon_v_fa2901: "由于龙的状态在千层面非常重要，义警们会时刻检查。"
  npc_override_lasagna_lasagna_npcs_since_i_am_duty_i_8e7eb0: "因为我在值班，所以不能进行个人烹饪研究。天亮了再来吧。"
  npc_override_lasagna_lasagna_npcs_since_i_am_my_way_a8f7ed: "既然我正好要去那边，如果能找到的话我会帮你带一些。不过，我的任务优先。你不会指望我在完成船长给我的任务之前就去处理它吧？"
  npc_override_lasagna_lasagna_npcs_since_i_ve_come_all_a8270d: "既然我大老远来了，我应该尝尝卡鲁纳牛奶！"
  npc_override_lasagna_lasagna_npcs_since_s_come_we_ll_6d7eb9: "既然事已至此，我们就用必要的手段让他开口……"
  npc_override_lasagna_lasagna_npcs_since_takes_concentratio_d2637a: "因为需要集中注意力，请不要打扰我。"
  npc_override_lasagna_lasagna_npcs_since_trial_version_novi_b88892: "因为是新手试用版，效果和 1 级食物相同，但^0000cd持续时间没那么长。^000000"
  npc_override_lasagna_lasagna_npcs_since_we_re_here_let_e19b35: "既然我们来了，就做个烤箱决议吧！"
  npc_override_lasagna_lasagna_npcs_since_when_been_your_dut_2c2da6: "从什么时候开始轮到你检查了？这么安静？也不敲门？"
  npc_override_lasagna_lasagna_npcs_since_when_i_part_team_152005: "我什么时候成团队的一员了？好吧，好吧……走吧。"
  npc_override_lasagna_lasagna_npcs_sir_s_what_you_said_b98a69: "先生，你上次喝酒时可不是这么说的。你说你离开是因为讨厌因为贫穷而被看不起。"
  npc_override_lasagna_lasagna_npcs_sitting_17e441: "坐着。"
  npc_override_lasagna_lasagna_npcs_sitting_now_23b27d: "现在坐着。"
  npc_override_lasagna_lasagna_npcs_situation_bad_611623: "情况有那么糟吗？"
  npc_override_lasagna_lasagna_npcs_skills_activated_manuall_e04d69: "^4d4dff需要手动激活的技能^000000可以^4d4dff放在快捷栏上^000000以便快速使用。"
  npc_override_lasagna_lasagna_npcs_sleepy_meow_who_lives_ov_a6acda: "^4D4DFF[瞌睡喵]^000000，住在巴西利斯克生活的洞穴口那边，正在迫切地寻找一个强力的帮手。也许你应该为了经验去试试。感谢你的帮助。"
  npc_override_lasagna_lasagna_npcs_slippery_sticky_s_amazin_31f4f7: "滑溜溜——粘乎乎的——真神奇，居然有这样的生物存在。"
  npc_override_lasagna_lasagna_npcs_snore_106f51: "*鼾声*"
  npc_override_lasagna_lasagna_npcs_so_again_proves_i_m_7c2134: "所以这再次证明了我是这片领域最强的！"
  npc_override_lasagna_lasagna_npcs_so_all_about_boosting_yo_af6de9: "所以，这一切都是关于根据你的能力来提升你的属性？"
  npc_override_lasagna_lasagna_npcs_so_amazing_i_want_ask_e88509: "太棒了，我想明天再请你帮个忙。弗洛林最近遇到很多困难。"
  npc_override_lasagna_lasagna_npcs_so_basically_s_beyond_yo_0da9dc: "所以基本上，我每天要洗多少杯子是你无法想象的。不仅如此，我还要听义警团和商人手下那些低阶喵族的抱怨，还要给新手冒险者提供咨询。"
  npc_override_lasagna_lasagna_npcs_so_cold_hearted_bf2596: "真冷血……"
  npc_override_lasagna_lasagna_npcs_so_every_day_i_must_5c77ce: "所以每天，我只能收集当天所需的量。但我今天还没收集够。"
  npc_override_lasagna_lasagna_npcs_so_give_try_craft_someth_ff9e55: "所以试试看，用合成工具包制作一些东西吧。"
  npc_override_lasagna_lasagna_npcs_so_i_hope_you_come_191ac8: "所以我希望你明天再来！"
  npc_override_lasagna_lasagna_npcs_so_i_just_wanted_you_3b4ab4: "是这样吗？我只是想让你慢慢来。好了，进去吧。记住，塔尔图菲的和平就是海洋的和平。它意味着希望。"
  npc_override_lasagna_lasagna_npcs_so_i_need_you_catch_ef63a6: "所以我需要你抓草精和叶精。各五只。好了，开始吧！"
  npc_override_lasagna_lasagna_npcs_so_just_thought_them_mak_7bfaa3: "所以光是想到它们我就火冒三丈喵。"
  npc_override_lasagna_lasagna_npcs_so_let_me_introduce_myse_a7d342: "是这样吗？让我自我介绍一下。我是负责这间厨房的副厨师长。"
  npc_override_lasagna_lasagna_npcs_so_many_heartbreaking_st_90a6b8: "这么多令人心碎的故事。"
  npc_override_lasagna_lasagna_npcs_so_mean_i_shared_my_625802: "真过分。我分享了痛苦的过去，你却毫不在意。"
  npc_override_lasagna_lasagna_npcs_so_people_who_wish_succe_bfe9aa: "所以希望成功的人或想成为他们那样的冒险者经常会来这里。"
  npc_override_lasagna_lasagna_npcs_so_please_get_those_mush_e41369: "所以请去弄那些蘑菇孢子来，因为我快死了喵。"
  npc_override_lasagna_lasagna_npcs_so_please_go_get_rid_3770de: "所以请去处理掉它们。每群五只就够了。"
  npc_override_lasagna_lasagna_npcs_so_please_think_as_savin_2af014: "所以，请把它当作……救别人的命……然后帮帮我——"
  npc_override_lasagna_lasagna_npcs_so_s_so_bothersome_i_44be1c: "是这样吗？但那太麻烦了！我连自己的身体都照顾不好。"
  npc_override_lasagna_lasagna_npcs_so_s_what_we_re_2f8fd9: "所以我们现在就在做这个。我们在尽可能地坐着。"
  npc_override_lasagna_lasagna_npcs_so_s_why_you_re_e400ce: "所以你才会喷火。"
  npc_override_lasagna_lasagna_npcs_so_taking_care_these_bra_dc2a66: "所以照顾这些顽皮的弟弟们成了我的责任！我真想知道我为什么是老大！我快要受不了了！"
  npc_override_lasagna_lasagna_npcs_so_they_fought_my_store_fabbc2: "所以它们^0000cd打了起来^000000。我的^0000cd店被毁了^000000。所以我提出了^0000cd赔偿要求^000000，包括损坏的家具和酒馆恢复营业前的利润损失。"
  npc_override_lasagna_lasagna_npcs_so_they_having_animated_71f07b: "所以他们在热烈地讨论状态问题。"
  npc_override_lasagna_lasagna_npcs_so_they_move_another_per_5c6f2c: "所以它们会转移到附近另一个人身上。这就是为什么当宿主死亡时，会被萨满特别地封印在罐子里，丢弃在无人能找到的地方。"
  npc_override_lasagna_lasagna_npcs_so_we_don_t_even_dba502: "所以我们这些天连食材都没准备。偶尔有订单的时候，我们就跑到鱼店买一条鳕鱼，然后开始烹饪。"
  npc_override_lasagna_lasagna_npcs_so_we_get_ingredients_im_571db2: "所以有订单时我们能立刻拿到食材。"
  npc_override_lasagna_lasagna_npcs_so_we_hire_outsiders_who_b3915b: "所以我们作为特殊政策，雇佣想找工作的外地人，而莱加拉斯负责发酵卡鲁纳。"
  npc_override_lasagna_lasagna_npcs_so_well_polite_get_hold_81f7b6: "是这样吗？嗯，缠着忙人可不是礼貌的行为。"
  npc_override_lasagna_lasagna_npcs_so_what_brings_you_here_827774: "那你来这里是为什么？"
  npc_override_lasagna_lasagna_npcs_so_what_happened_then_th_f50486: "那后来发生了什么？他们出现在酒馆里做了什么？"
  npc_override_lasagna_lasagna_npcs_so_what_i_won_her_de6ca8: "所以呢？什么！我是打赌赢了她。每次我叫她的名字，都会让我想起那个胜利的时刻。太美了。"
  npc_override_lasagna_lasagna_npcs_so_what_s_matter_00d6cd: "所以有什么事？"
  npc_override_lasagna_lasagna_npcs_so_what_us_e01ecd: "那跟我们有什么关系？"
  npc_override_lasagna_lasagna_npcs_so_what_you_curious_abou_4c1caf: "所以你对什么感到好奇？"
  npc_override_lasagna_lasagna_npcs_so_what_you_going_9018aa: "所以，你打算怎么办？"
  npc_override_lasagna_lasagna_npcs_so_what_you_re_telling_a1bd92: "所以你是说，在莱加拉斯工作的时候，我应该让那两个家伙远离工坊。"
  npc_override_lasagna_lasagna_npcs_so_when_time_comes_we_a7551f: "所以时机到了，我们就雇佣冒险者去猎杀野生大黄蜂。"
  npc_override_lasagna_lasagna_npcs_so_you_me_another_favor_38a263: "所以你明天能再帮我一个忙吗？哦，不用马上回答。今晚好好休息，明天再来。"
  npc_override_lasagna_lasagna_npcs_so_you_need_boost_dex_75bc4e: "所以，^4d4dff你需要先提升 DEX 来增加命中率^000000。"
  npc_override_lasagna_lasagna_npcs_so_you_played_dead_good_63ebfc: "所以你装死了？干得好。义警应该知道如何保命。不错。"
  npc_override_lasagna_lasagna_npcs_so_you_re_adventurer_dor_af06bf: "所以，你就是那个冒险者喵族，嗯？"
  npc_override_lasagna_lasagna_npcs_so_you_running_errand_de_1f9b94: "所以，你是在跑腿，把一个箱子送给治疗师哈鲁。"
  npc_override_lasagna_lasagna_npcs_so_you_see_ribbon_goes_5182ec: "所以，你看到这条和这套帅气制服完美搭配的缎带了吗？"
  npc_override_lasagna_lasagna_npcs_so_you_want_me_get_bbeb74: "所以你想让我去弄些蘑菇孢子，对吧？"
  npc_override_lasagna_lasagna_npcs_some_reason_they_live_ba_dcb5ae: "但出于某种原因，它们和巴西利斯克生活在一起，所以这对我们来说是个严重的问题。"
  npc_override_lasagna_lasagna_npcs_something_embarrassed_la_b49e4d: "在千层面，这没什么好难为情的。"
  npc_override_lasagna_lasagna_npcs_sometimes_npcs_help_you_b700aa: "^4d4dff有时 NPC 会通过导航工具帮你找到目的地。"
  npc_override_lasagna_lasagna_npcs_sounds_cute_doesn_t_soun_b21a0b: "听起来很可爱，但听起来不太美味。"
  npc_override_lasagna_lasagna_npcs_sounds_very_pressuring_9fbe83: "听起来压力很大。"
  npc_override_lasagna_lasagna_npcs_sous_chef_always_edge_be_26986b: "副厨师长在起航前总是很紧张。别往心里去。"
  npc_override_lasagna_lasagna_npcs_sous_chef_believes_bring_747c4c: "副厨师长认为烹饪时有陌生人在场会带来厄运。你现在该走了。"
  npc_override_lasagna_lasagna_npcs_sous_chef_i_think_guy_a3e986: "副厨师长！我觉得这家伙说的是实话。是你让他做的，对吗？"
  npc_override_lasagna_lasagna_npcs_sous_chef_we_recruited_p_058dcd: "我们从里希塔乐镇招募的副厨师长非常棒。"
  npc_override_lasagna_lasagna_npcs_speaking_which_fisher_sa_9d3f28: "说到这个，^4D4DFF[渔夫]^000000说他需要一些帮助。你要不要试试？感谢你的帮助。"
  npc_override_lasagna_lasagna_npcs_starts_again_long_story_daffa4: "又开始了。那个长篇故事。"
  npc_override_lasagna_lasagna_npcs_stay_out_trouble_now_a91042: "现在安分点。"
  npc_override_lasagna_lasagna_npcs_stello_590425: "斯特洛？"
  npc_override_lasagna_lasagna_npcs_stello_adventurer_seems_14427e: "斯特洛。这位冒险者看起来经验丰富。这也可能是一次新的冒险。可能会对我们有帮助。"
  npc_override_lasagna_lasagna_npcs_stello_called_joke_af21b0: "斯特洛，这叫玩笑。"
  npc_override_lasagna_lasagna_npcs_stello_con_chliina_s_fir_9234c1: "斯特洛，孔-克利纳号的首席官，发现了海路，最终找到了已安全抵达新世界软岛的蝴蝶号。"
  npc_override_lasagna_lasagna_npcs_stello_doesn_t_make_sens_1d7219: "斯特洛。对于已经完成冒险训练的人来说，称之为最后一次训练没有意义。这应该叫第一次实践。"
  npc_override_lasagna_lasagna_npcs_stello_gentleman_should_eaca68: "斯特洛，绅士应该时刻使用得体的语言。"
  npc_override_lasagna_lasagna_npcs_stello_give_adventurer_25629f: "斯特洛，把^0000cd那个^000000给冒险者。"
  npc_override_lasagna_lasagna_npcs_stello_i_don_t_think_75432b: "斯特洛，我觉得那不是问题所在。看看外面。"
  npc_override_lasagna_lasagna_npcs_stello_i_guess_you_shoul_3a1074: "斯特洛，我想你应该自己去下面看看。"
  npc_override_lasagna_lasagna_npcs_stello_i_told_you_how_2da7eb: "斯特洛，我告诉过你穿衣打扮体现了一只喵族的品质。请调整你的着装。"
  npc_override_lasagna_lasagna_npcs_stello_polite_interrupt_b20215: "斯特洛，打断别人是不礼貌的。我有强烈的正义感，不能容忍那些坏喵族破坏千层面的和平。我必须^0000cd引导他们走上正途^000000。"
  npc_override_lasagna_lasagna_npcs_stello_say_again_beccc5: "斯特洛，再说一遍。"
  npc_override_lasagna_lasagna_npcs_stello_you_must_learn_ab_1b2833: "斯特洛，你必须了解什么叫社交礼仪。"
  npc_override_lasagna_lasagna_npcs_stello_you_need_really_m_78ac3d: "斯特洛？你得真心诚意才行。"
  npc_override_lasagna_lasagna_npcs_stello_you_should_libera_2c1cb9: "斯特洛，你应该不吝于赞美。就像我对你做的那样。"
  npc_override_lasagna_lasagna_npcs_sticky_webfoot_main_ingr_8c8c8c: "这种粘性蛙蹼是布丁的主要原料，但一天后就会变质。而且味道也很难闻。"
  npc_override_lasagna_lasagna_npcs_still_no_news_butterfly_b31126: "蝴蝶号仍然没有消息。"
  npc_override_lasagna_lasagna_npcs_still_searching_no_news_6f1681: "仍在搜索。蝴蝶号没有消息。"
  npc_override_lasagna_lasagna_npcs_still_yota_never_show_hi_111e10: "不过，约塔从不露出笑容，而约吉会给我带来像蚯蚓这样可怕的东西，说我要变得更坚强。～发出抽泣声～"
  npc_override_lasagna_lasagna_npcs_stirred_96dca4: "搅拌的。"
  npc_override_lasagna_lasagna_npcs_stirred_shaken_who_cares_a89b9a: "搅拌还是摇晃，只要好喝谁在乎呢？"
  npc_override_lasagna_lasagna_npcs_stop_74a906: "停下。"
  npc_override_lasagna_lasagna_npcs_stop_808022: "停！"
  npc_override_lasagna_lasagna_npcs_stop_eating_stop_shame_y_798a23: "别吃了！停下！真丢人！"
  npc_override_lasagna_lasagna_npcs_stop_fighting_you_two_71bac3: "……别打了，你们两个！"
  npc_override_lasagna_lasagna_npcs_stop_looking_around_like_a6fe51: "别像个乡巴佬一样东张西望！"
  npc_override_lasagna_lasagna_npcs_stop_lying_4466ff: "别撒谎！"
  npc_override_lasagna_lasagna_npcs_storm_again_0877cb: "又是风暴。"
  npc_override_lasagna_lasagna_npcs_storm_so_sick_storms_we_b29d42: "风暴。真是受够了风暴。我们已经习惯了，几乎可以驾着它航行。"
  npc_override_lasagna_lasagna_npcs_story_about_captain_gamb_898f79: "关于甘贝里船长的故事也收录在所有书中。而这一切都被烧成了灰烬。"
  npc_override_lasagna_lasagna_npcs_story_chief_officer_true_ea21b2: "那首席官的故事是真的吗？"
  npc_override_lasagna_lasagna_npcs_story_doesn_t_add_up_42aecd: "那个故事对不上。"
  npc_override_lasagna_lasagna_npcs_story_pepperoncino_doesn_4cd299: "佩佩隆奇诺的故事也不太对得上。我可以根据记录核实他的故事。"
  npc_override_lasagna_lasagna_npcs_story_pepperoncino_s_sid_393c5b: "佩佩隆奇诺那边的故事让我更困惑了。你自己听听吧。"
  npc_override_lasagna_lasagna_npcs_str_means_strength_boost_9b1b49: "^4d4dffSTR 代表力量^000000。它^4d4dff提升物理攻击力^000000。"
  npc_override_lasagna_lasagna_npcs_strange_i_cannot_remembe_a48370: "奇怪。我不记得所有记录了，但甘贝里船长讲的^0000cd和我不记得的那部分记录不一样^000000。"
  npc_override_lasagna_lasagna_npcs_such_trouble_find_way_85f77f: "找路真是件麻烦事。"
  npc_override_lasagna_lasagna_npcs_sunlight_putting_me_slee_ce9495: "这阳光照得我想睡觉喵……"
  npc_override_lasagna_lasagna_npcs_superstitions_no_they_ba_aa9aca: "迷信？不，它们是基于纯粹的科学。"
  npc_override_lasagna_lasagna_npcs_sure_i_ll_tell_him_c4734b: "当然。我会告诉他的。"
  npc_override_lasagna_lasagna_npcs_sure_meet_her_971119: "一定要去见见她。"
  npc_override_lasagna_lasagna_npcs_surprise_brings_up_short_a599d9: "惊喜！它会调出快捷键窗口，其中九个小型槽位排成一行。"
  npc_override_lasagna_lasagna_npcs_symbol_our_farfalle_vigi_2977b2: "这是我们法法尔义警团的标志。"
  npc_override_lasagna_lasagna_npcs_t_s_too_extreme_015024: "那——那太过分了！"
  npc_override_lasagna_lasagna_npcs_t_then_you_ve_also_5345c8: "那——那你也……"
  npc_override_lasagna_lasagna_npcs_t_you_just_go_back_ec109d: "你就不能原路返回吗？"
  npc_override_lasagna_lasagna_npcs_take_boarding_pass_port_1bfa3f: "带着这张登船证到城镇北部的港口，他们会让你上船。"
  npc_override_lasagna_lasagna_npcs_take_care_yourself_6a871d: "保重。"
  npc_override_lasagna_lasagna_npcs_take_look_those_desert_w_c49d8e: "看看那些沙漠之狼。你觉得怎么样？"
  npc_override_lasagna_lasagna_npcs_take_them_back_you_worki_f2be80: "带他们回去。在船上工作不需要高智商，但这些白痴可能连清洁都做不好。不，别提清洁了。他们不把我逼疯就算万幸了。"
  npc_override_lasagna_lasagna_npcs_take_your_filthy_hand_of_dcf037: "把你的脏手从她身上拿开！[旺牛]很敏感，除了我没人能碰她！"
  npc_override_lasagna_lasagna_npcs_take_your_time_get_some_40973c: "慢慢来，好好休息。"
  npc_override_lasagna_lasagna_npcs_takes_while_embroider_na_ae4a7e: "刺绣名字需要一些时间。"
  npc_override_lasagna_lasagna_npcs_taking_ship_dock_search_9d9331: "从^4D4DFF[码头]^000000乘船去寻找更大的冒险也是个好主意。感谢你的帮助。"
  npc_override_lasagna_lasagna_npcs_tali_brought_these_sayin_9b1cd6: "塔利带来了这些，说剩了很多布料。"
  npc_override_lasagna_lasagna_npcs_talk_about_weather_429851: "聊聊天气。"
  npc_override_lasagna_lasagna_npcs_tartufi_3ce31d: "塔尔图菲？"
  npc_override_lasagna_lasagna_npcs_tartufi_must_calmed_down_8ebb64: "塔尔图菲一定冷静下来了。你先走吧。等马奇能稍微走动了我再带他去。背着他太重了。"
  npc_override_lasagna_lasagna_npcs_tartufi_right_upstairs_g_af3532: "^0000cd塔尔图菲^000000就在楼上。去问他问题是什么。他不咬人。你不用害怕。"
  npc_override_lasagna_lasagna_npcs_taste_very_important_e6c50d: "味道，非常重要。"
  npc_override_lasagna_lasagna_npcs_teaching_how_cook_what_e_a070b0: "教烹饪？搞什么鬼！"
  npc_override_lasagna_lasagna_npcs_team_efb7f5: "团队！"
  npc_override_lasagna_lasagna_npcs_team_must_move_as_one_c4b4ef: "团队必须步调一致。"
  npc_override_lasagna_lasagna_npcs_tell_me_your_name_a31832: "告诉我你的名字。"
  npc_override_lasagna_lasagna_npcs_tell_young_one_about_yeo_5fca40: "告诉那个小家伙关于如意珠的事。我必须继续修行，所以不要打扰我，走开。"
  npc_override_lasagna_lasagna_npcs_terrible_back_then_7dded2: "那时候糟透了！"
  npc_override_lasagna_lasagna_npcs_thank_you_174534: "谢谢。"
  npc_override_lasagna_lasagna_npcs_thank_you_boarding_con_c_11e5ad: "感谢您乘坐孔-克利纳号。祝您旅途安全舒适！"
  npc_override_lasagna_lasagna_npcs_thank_you_bringing_them_5ef17c: "谢谢你把它们带来给我。多亏了你，千层面的美食又向前迈进了一步。"
  npc_override_lasagna_lasagna_npcs_thank_you_bringing_them_a230fa: "谢谢你把它们带来给我。多亏了你，孔-克利纳号的船员们可以吃到新鲜食物了。"
  npc_override_lasagna_lasagna_npcs_thank_you_finding_box_1049a8: "谢谢你找到那个箱子！"
  npc_override_lasagna_lasagna_npcs_thank_you_form_getting_t_4e16d2: "谢谢你帮我弄到它们。现在孔-克利纳号可以有自己的长期食物储存方法了。"
  npc_override_lasagna_lasagna_npcs_thank_you_getting_them_m_b77fb4: "谢谢你帮我弄到它们。请明天再来。"
  npc_override_lasagna_lasagna_npcs_thank_you_now_our_cows_9d04e7: "谢谢。现在我们的奶牛可以享用美味的食物了。"
  npc_override_lasagna_lasagna_npcs_thank_you_so_much_093766: "非常感谢！"
  npc_override_lasagna_lasagna_npcs_thank_you_so_much_i_2f5beb: "非常感谢。我希望下次你还能帮我们。你觉得怎么样？请考虑一下。"
  npc_override_lasagna_lasagna_npcs_thank_you_so_much_i_ec1920: "非常感谢。我敢打赌它们会害怕得一段时间不敢出现了。"
  npc_override_lasagna_lasagna_npcs_thank_you_using_our_serv_2e9c55: "感谢您使用我们的服务。"
  npc_override_lasagna_lasagna_npcs_thank_you_your_help_3a7d59: "谢谢你的帮助。"
  npc_override_lasagna_lasagna_npcs_thank_you_your_time_f99122: "感谢你抽出时间。"
  npc_override_lasagna_lasagna_npcs_thanks_6099fe: "谢谢。"
  npc_override_lasagna_lasagna_npcs_thanks_i_think_i_sail_08ab12: "谢谢。我想我可以在好天气里出发了。"
  npc_override_lasagna_lasagna_npcs_thanks_keeping_these_pig_379913: "谢谢你帮我看住这些猪。多亏了你，我的工作轻松多了！"
  npc_override_lasagna_lasagna_npcs_thanks_moist_air_our_che_981dab: "而这潮湿的空气让我们的奶酪发酵得更加美味。"
  npc_override_lasagna_lasagna_npcs_thanks_now_i_must_contin_687b85: "谢谢。现在我必须继续修行，所以不要打扰我，走开。"
  npc_override_lasagna_lasagna_npcs_thanks_you_i_able_eat_1bc3b6: "多亏了你，我吃了一顿丰盛的饭。请告诉卡鲁我很感激这顿美味的午餐。希望今天也会是安全的一天……"
  npc_override_lasagna_lasagna_npcs_thanks_you_i_hope_my_c358d1: "谢谢你。我希望我的护符能对你有用……"
  npc_override_lasagna_lasagna_npcs_thanks_you_we_able_colle_f06ec7: "多亏了你，我们收集了这么多蜂蜜。谢谢！"
  npc_override_lasagna_lasagna_npcs_thanks_your_sacrifice_i_17cd01: "多亏了你的牺牲，我才能完成大部分需要交付的^0000cd卡鲁纳^000000。非常感谢。"
  npc_override_lasagna_lasagna_npcs_their_efforts_finally_pa_cd9fc6: "他们的努力终于有了回报，托马托马斯船长最近在米德加尔特海岸外一个叫马兰多的小岛上被发现。"
  npc_override_lasagna_lasagna_npcs_then_again_s_hard_forget_35bba4: "不过话说回来……一旦尝过这种鱼就难以忘怀，因为味道太浓郁了。"
  npc_override_lasagna_lasagna_npcs_then_captain_must_547b3c: "那么，船长一定……？"
  npc_override_lasagna_lasagna_npcs_then_dragon_f1a619: "那么龙……"
  npc_override_lasagna_lasagna_npcs_then_find_something_easy_f3206c: "那就找个简单的。我觉得像^0000cd看孩子^000000这样的活就不错。"
  npc_override_lasagna_lasagna_npcs_then_go_back_your_spot_eb1a9c: "那就回到你的位置上去。从现在起你别指望从我这里得到任何好处。"
  npc_override_lasagna_lasagna_npcs_then_how_about_you_give_07bb8a: "那让这两个试试怎么样？他们想在船上工作，哪怕是当学徒也行。"
  npc_override_lasagna_lasagna_npcs_then_i_ask_you_deliver_0c8d71: "那我请你今天也^0000cd把便当送到洞穴里的潘纳那里^000000。去的时候快点，回来的时候可以慢点。"
  npc_override_lasagna_lasagna_npcs_then_i_ll_just_leave_979041: "那我就毫不犹豫地离开千层面。"
  npc_override_lasagna_lasagna_npcs_then_i_met_pepperoncino_6e38d1: "然后我遇到了佩佩隆奇诺。"
  npc_override_lasagna_lasagna_npcs_then_i_pioneered_seaway_a9ac60: "然后我和我改造过的^0000cd斯特洛^000000开辟了通往马兰多的海路，与托马斯重逢。最终，我们决定进军新大陆。"
