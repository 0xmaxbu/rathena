  npc_override_lasagna_lasagna_npcs_here_s_directions_read_c_bf5a7c: "Here's the directions. To read the combination scroll,"
  npc_override_lasagna_lasagna_npcs_here_shrimps_carrots_cat_210b9b: "Here are the shrimps, carrots and catnip!"
  npc_override_lasagna_lasagna_npcs_here_stranger_new_place_a25bf7: "And here is a stranger from a new place in front of me."
  npc_override_lasagna_lasagna_npcs_here_take_1bdbd6: "Here, take this."
  npc_override_lasagna_lasagna_npcs_here_they_basilrocks_e67fb0: "Here they are. The Basilrocks."
  npc_override_lasagna_lasagna_npcs_hey_adventurer_so_what_d_e02658: "Hey adventurer, so what'd you say? won't you take care of those wolves and save our strings?"
  npc_override_lasagna_lasagna_npcs_hey_adventurer_your_firs_fbde94: "Hey, adventurer! Is it your first voyage?"
  npc_override_lasagna_lasagna_npcs_hey_buddy_08cbf4: "Hey, buddy!"
  npc_override_lasagna_lasagna_npcs_hey_buddy_machie_don_t_fa02f3: "Hey, buddy! Machie! don't die on me!"
  npc_override_lasagna_lasagna_npcs_hey_cows_eat_lot_relax_908666: "Hey cows- eat a lot and relax a lot- I'll sing you a song-"
  npc_override_lasagna_lasagna_npcs_hey_i_get_too_noisy_0925c0: "Hey, I get it. It is too noisy there. You may go now."
  npc_override_lasagna_lasagna_npcs_hey_if_you_give_me_83d4f3: "Hey, if you give me {0} {1}, I'll fix this for you."
