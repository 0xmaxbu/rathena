  npc_override_lasagna_lasagna_npcs_could_you_catch_ten_swee_15492c: "Could you catch ten Sweet Roda Frogs and bring me sticky webfeet? Around five of them. Thank you!"
  npc_override_lasagna_lasagna_npcs_couple_days_ago_we_met_9fd34a: "A couple days ago we met a storm, but another one?! Who set the course this way at this time of the year? I guess I should let it go since It's the first time."
  npc_override_lasagna_lasagna_npcs_course_did_you_forget_al_b4b26f: "Of course not. This is not it. Did you forget already meow?"
  npc_override_lasagna_lasagna_npcs_course_don_t_forget_abou_73afa6: "Of course, don't forget about the Cat Paw Commerce Group!"
  npc_override_lasagna_lasagna_npcs_course_eyes_head_since_s_f181c9: "Of course it has eyes and head since It's a fish."
  npc_override_lasagna_lasagna_npcs_course_there_small_dispu_54f016: "Of course there were small disputes, but Gamberry was moved by my leadership and became influenced. After we gained enough experience and know-hows from anchovy manufacturing, we decided to draw a bigger picture."
