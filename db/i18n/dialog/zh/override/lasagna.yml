  npc_override_lasagna_lasagna_npcs_hello_i_am_a9103b: "Hello. I am {0}."
  npc_override_lasagna_lasagna_npcs_hello_i_am_adventurer_wh_431a4b: "Hello. I am an adventurer {0} who has set off on an adventure on Con-Killina."
  npc_override_lasagna_lasagna_npcs_hello_i_am_looking_adven_121e5c: "Hello, I am {0}, looking for adventure from the new continent. I am here to say hi as the Purser has advised."
  npc_override_lasagna_lasagna_npcs_hello_i_am_passenger_shi_833bdb: "Hello. I am a passenger on this ship. I'd like to know when this ship sets off."
  npc_override_lasagna_lasagna_npcs_hello_i_am_who_new_6ed613: "Hello, I am {0} who is on a new adventure."
  npc_override_lasagna_lasagna_npcs_hello_i_am_who_new_eb2fa8: "Hello, I am {0} who is on a new adventure this time. Nice to meet you."
  npc_override_lasagna_lasagna_npcs_hello_you_person_who_s_47c222: "Hello, are you the person who's here to help us? Then you can start now."
  npc_override_lasagna_lasagna_npcs_helmsman_caught_tuna_fis_988c3d: "Helmsman caught tuna by fishing. Chef tried to steam the whole fish but the sous chef barely stopped him and cut into pieces for everyone. I wish I can have some more."
  npc_override_lasagna_lasagna_npcs_herb_effective_even_when_eff844: "This ^4d4dffherb is effective even when eaten as it is, but, it is far more effective when it is made into a potion.^000000"
  npc_override_lasagna_lasagna_npcs_herbs_growing_entrance_v_338476: "The herbs are growing in the entrance of the village. Did you see them?"
  npc_override_lasagna_lasagna_npcs_here_6d6da7: "Here..."
  npc_override_lasagna_lasagna_npcs_here_basil_basilrock_6c15f2: "Here are the Basil and Basilrock."
  npc_override_lasagna_lasagna_npcs_here_con_chliina_only_sh_b2478d: "From here, the Con-Chliina is the only ship that can reach Midgard. So the only people who can board the ship are the Con-Chliina's sailors and members of the Vigilante Corp."
