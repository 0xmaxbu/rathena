Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_lasagna_lasagna_npcs_abbreviation_lasagna_day_47d7fe: "千层面日的缩写。这是蝴蝶号安全抵达新世界的那一天，经过 32 次搜寻尝试后通过新航线的发现而被找到。"
  npc_override_lasagna_lasagna_npcs_about_family_46df62: "关于家族"
  npc_override_lasagna_lasagna_npcs_about_ten_years_ago_conc_8365da: "大约十年前，这里曾是改造不良喵族并招募他们成为义警的调教场所。在那之前，粗犷的水手们会在辛苦工作一天后来此放松。"
  npc_override_lasagna_lasagna_npcs_above_all_most_important_2690fe: "在所有合成物品中，最重要的应该是一瓶药水。"
  npc_override_lasagna_lasagna_npcs_accept_3e1999: "接受。"
  npc_override_lasagna_lasagna_npcs_act_as_if_you_surrender_db7314: "假装投降。"
  npc_override_lasagna_lasagna_npcs_actually_meant_you_die_e_d2bdc3: "实际上，这意味着你会死，而恶灵会寻找新的宿主。"
  npc_override_lasagna_lasagna_npcs_actually_you_need_recipe_2d04cb: "其实你需要食谱和厨具，但对新手来说可能太复杂了。这次我帮你做一个。我们不能浪费食材，你知道的。"
  npc_override_lasagna_lasagna_npcs_adventurer_adventurer_ye_37b5f4: "一位冒险者。昨天的那位冒险者。太好了，今天也请救救我喵。"
  npc_override_lasagna_lasagna_npcs_adventurer_good_see_you_b63d6c: "冒险者，又见到你真是太好了！它们正猛烈地朝我们冲来。我猜它们对昨天没有鱼吃这件事真的很恼火。"
  npc_override_lasagna_lasagna_npcs_adventurer_i_beg_you_we_a99e3c: "冒险者，我求你了。我们必须阻止千层面回到黑暗时代。一切都在你手中了！"
  npc_override_lasagna_lasagna_npcs_adventurer_i_favor_ask_i_c867a1: "冒险者，我想请你帮个忙。我的送货量还没达标，但那两个家伙把我的卡鲁尼亚克全吃光了！你今天看到的就是我所有的存货，照这样下去我完成不了订单了。"
  npc_override_lasagna_lasagna_npcs_adventurer_i_had_dream_y_c5ed13: "冒险者。我做了一个梦。梦到你正前往新世界喵。"
  npc_override_lasagna_lasagna_npcs_adventurer_i_heard_about_706cfd: "冒险者，我听说了你的壮举。多亏了你，我的鱼串才保住了。"
  npc_override_lasagna_lasagna_npcs_adventurer_i_know_you_re_c89263: "冒险者，我知道你现在正在帮我们，但我认为你更适合做别的行当，而不是这一行。"
  npc_override_lasagna_lasagna_npcs_adventurer_i_m_counting_2f66d6: "冒险者，明天也拜托你了。"
  npc_override_lasagna_lasagna_npcs_adventurer_i_so_desperat_24b881: "冒险者，我当时太绝望了，随便抓了个路过的人帮忙，但我觉得我中大奖了！"
  npc_override_lasagna_lasagna_npcs_adventurer_new_continent_02dffa: "新大陆来的冒险者。是什么风把你吹来了？需要帮忙吗？"
  npc_override_lasagna_lasagna_npcs_adventurer_please_help_p_4232e7: "冒险者，请帮帮忙！成群结队的草精和叶精正在朝这边过来！"
  npc_override_lasagna_lasagna_npcs_adventurer_please_save_m_1c970c: "冒险者……请救救我……"
  npc_override_lasagna_lasagna_npcs_adventurer_stop_what_you_8e8477: "冒险者，先停一下手头的事。我觉得接下来我一个人就能搞定了。你看起来太强了，不适合干这种活。"
  npc_override_lasagna_lasagna_npcs_adventurer_what_did_lega_45c8f8: "冒险者，莱加拉斯怎么说？他说能送卡鲁纳过来吗？"
  npc_override_lasagna_lasagna_npcs_adventurer_you_me_small_53b83e: "冒险者，能帮我一个小忙吗？我现在有急事要处理，但你也看到了，我人手不够。你觉得呢？"
  npc_override_lasagna_lasagna_npcs_adventurer_you_re_here_a_68036b: "冒险者，你已经来了？还没到送便当的时间呢。"
  npc_override_lasagna_lasagna_npcs_adventurer_you_re_kind_y_3be291: "冒险者。你真善良……你救了我的命。"
  npc_override_lasagna_lasagna_npcs_adventurer_you_waking_me_56bdc2: "冒险者……？你叫醒我是因为搞定了吗？让我看看……"
  npc_override_lasagna_lasagna_npcs_adventurers_club_east_he_7c9140: "冒险者俱乐部从这里往东走，应该不难找到。"
  npc_override_lasagna_lasagna_npcs_after_he_couldn_t_get_0a5573: "在那之后，他再也没能上过船。哈哈。他因为^0000cd违约金^000000而负债累累，无法离开。所以他最后去了鳀鱼工坊，在那里去除鳀鱼的头和内脏……"
  npc_override_lasagna_lasagna_npcs_after_observing_you_i_ge_a54ffc: "观察你之后，我觉得你可能更适合做别的行当，而不是这一行。"
  npc_override_lasagna_lasagna_npcs_agi_means_agility_affect_9b63f5: "^4d4dffAGI 代表敏捷^000000。它影响^4d4dff回避率和攻击速度^000000。"
  npc_override_lasagna_lasagna_npcs_aglio_let_you_more_detai_0a1fe9: "^4d4dff阿利奥^000000会告诉你更多细节。他就在那边。"
  npc_override_lasagna_lasagna_npcs_aglio_oligo_225da1: "阿利奥和奥利奥！"
  npc_override_lasagna_lasagna_npcs_aglio_one_very_i_mean_b36bbb: "阿利奥是法法尔义警团中非常——我是说非常——优秀的喵族之一，好好看着学着点！"
  npc_override_lasagna_lasagna_npcs_aglioooooo_805b15: "……阿利奥——！！"
  npc_override_lasagna_lasagna_npcs_ah_adventurer_i_m_so_f2594c: "啊，冒险者，你来了真是太好了！"
  npc_override_lasagna_lasagna_npcs_ah_you_re_here_come_6c6c51: "啊！你来了。进来吧。这里是神奇老奶奶的神奇之地。是一座神社。"
  npc_override_lasagna_lasagna_npcs_ahem_like_gateway_far_st_6a66c9: "咳咳！这就像是通往远星大陆的门户。"
  npc_override_lasagna_lasagna_npcs_ahem_please_tell_part_de_0fba4a: "咳咳，请详细说说那部分！"
  npc_override_lasagna_lasagna_npcs_all_crews_such_gentlemen_b9522e: "所有船员都是绅士，但他们对待无礼行为毫不留情。你最好注意这一点。"
  npc_override_lasagna_lasagna_npcs_all_people_lasagna_love_7a5d95: "所有千层面的人都喜欢卡鲁纳牛奶，但你知道它是怎么做的吗？卡鲁纳由充分发酵的卡鲁尼亚克和新鲜牛奶制成。"
  npc_override_lasagna_lasagna_npcs_all_rush_doesn_t_help_326586: "在烹饪这件事上，着急是没用的。"
  npc_override_lasagna_lasagna_npcs_all_them_i_couldn_t_930c62: "并不是全部。我没能找到所有。"
  npc_override_lasagna_lasagna_npcs_all_young_doram_want_joi_2a2e73: "所有年轻的喵族都想加入我们！"
  npc_override_lasagna_lasagna_npcs_almost_point_totally_des_9b04f1: "差点把一家店完全毁掉的程度。"
  npc_override_lasagna_lasagna_npcs_almost_time_us_sail_off_b4ca90: "我们差不多该起航了。你该回去了。"
  npc_override_lasagna_lasagna_npcs_alright_congratulations_1c900a: "好的，恭喜你成为义警团的一员。"
  npc_override_lasagna_lasagna_npcs_alright_let_s_go_outside_175661: "好的，我们到外面去讨论你的下一个测试。"
  npc_override_lasagna_lasagna_npcs_alright_thank_you_your_h_a916ee: "好吧……谢谢你的……帮助，我想……"
  npc_override_lasagna_lasagna_npcs_alright_then_give_anothe_15ced9: "好吧，那再试一次！"
  npc_override_lasagna_lasagna_npcs_alright_warm_up_go_elimi_63823c: "好吧，作为热身，去消灭^4d4dff三只蛋精^000000。"
  npc_override_lasagna_lasagna_npcs_alright_you_just_return_84d051: "好了。你回你的村子去吧。"
  npc_override_lasagna_lasagna_npcs_also_i_ll_give_you_5b219d: "另外，我会给你一根新法杖。"
  npc_override_lasagna_lasagna_npcs_also_means_you_dodge_ene_44fc11: "这也意味着你能更容易地躲避敌人的攻击。"
  npc_override_lasagna_lasagna_npcs_also_occupational_sickne_864000: "这也算是职业病。"
  npc_override_lasagna_lasagna_npcs_although_person_lasagna_311e9c: "虽然这个人不是千层面本地人，但他与甘贝里船长共度了相当长的有意义的时间。你可以去和他谈谈。我们可以将他的叙述与甘贝里船长的访谈进行对比。"
  npc_override_lasagna_lasagna_npcs_always_right_click_when_0c8f2a: "获取信息时一定要右键点击！右键点击人物、物品和猫咪来了解更多关于它们的信息！"
  npc_override_lasagna_lasagna_npcs_amulet_already_perfect_1886e0: "这个护符已经完美了！"
  npc_override_lasagna_lasagna_npcs_amulet_today_give_me_all_df16ca: "这是今天的护符！把你所有的巴西尔岩石都给我。"
  npc_override_lasagna_lasagna_npcs_anchovy_17dc44: "鳀鱼？"
  npc_override_lasagna_lasagna_npcs_anchovy_business_definit_d877b6: "鳀鱼生意确实大不如前了，但我一直人手紧缺。"
  npc_override_lasagna_lasagna_npcs_anchovy_fish_9516d8: "鳀鱼是鱼吗？"
  npc_override_lasagna_lasagna_npcs_anchovy_long_thin_snack_8f7a9e: "鳀鱼是一种长而细的小吃，有点咸，不是吗？但这东西有头……还有眼睛呢！"
  npc_override_lasagna_lasagna_npcs_anchovy_sounds_great_2bbb7e: "鳀鱼听起来不错！"
  npc_override_lasagna_lasagna_npcs_anchovy_you_said_you_wan_948ada: "鳀鱼。你说过想做一些和鳀鱼有关的事，所以我带你来了。"
  npc_override_lasagna_lasagna_npcs_and_f0fa6b: "还有……"
  npc_override_lasagna_lasagna_npcs_angry_people_who_didn_t_a98c00: "没喝到卡鲁纳牛奶的愤怒的人们很快就会引发^0000cd骚乱^000000，而且很快就会蔓延到整个千层面。"
  npc_override_lasagna_lasagna_npcs_annoying_3e7190: "真烦人。"
  npc_override_lasagna_lasagna_npcs_annoying_flies_annoying_07599a: "烦人的苍蝇。烦人的蚊子。就是烦人。我为了什么名利才一个人在这里做这些啊……"
  npc_override_lasagna_lasagna_npcs_annoying_flies_annoying_ca42ed: "烦人的苍蝇。烦人的蚊子。就是烦人。我想念爸爸妈妈了。"
  npc_override_lasagna_lasagna_npcs_any_case_please_enjoy_yo_b4a47c: "无论如何，请尽情享受你的停留，不要惹麻烦。"
  npc_override_lasagna_lasagna_npcs_any_rate_captain_gamberr_4eae68: "不管怎样，甘贝里船长是个好人。他从还是混混的时候就受我影响，现在已经成为了一名喵族。"
  npc_override_lasagna_lasagna_npcs_any_rate_if_he_must_8643f9: "无论如何，如果他每天都必须依赖一个新的护符，那今天的护符是什么？我敢肯定水手长需要一些时间来考虑，在那之前，他需要护符。"
  npc_override_lasagna_lasagna_npcs_anybody_here_212362: "有人吗？"
  npc_override_lasagna_lasagna_npcs_anyhow_biggest_obstacle_dc01c7: "不管怎样，我们创业时最大的障碍是千层面那些糟糕的喵族。他们扑上来要跟我打架。住在海边的人都这么好斗吗？"
  npc_override_lasagna_lasagna_npcs_anyhow_we_re_hurry_down_fef0d3: "不管怎样，我们赶时间赶到了分秒必争的地步，但那个瞌睡虫大概又在睡觉了。所以希望冒险者你能再次帮助我们。"
  npc_override_lasagna_lasagna_npcs_anyone_who_wants_ride_se_72a5e9: "想玩跷跷板的人——过来吧——"
  npc_override_lasagna_lasagna_npcs_anything_else_4689b4: "还有别的吗？"
  npc_override_lasagna_lasagna_npcs_anything_else_you_re_cur_9f7162: "还有别的你想了解的吗？"
  npc_override_lasagna_lasagna_npcs_anything_promise_4e2a9f: "任何事？这是承诺吗？"
  npc_override_lasagna_lasagna_npcs_anyway_boatswain_no_choi_a39501: "总之，水手长别无选择。要么在折磨中度过余生，要么成为萨满猫过上还算舒适的生活。萨满猫的生活也不算太糟。"
  npc_override_lasagna_lasagna_npcs_anyway_enough_depressing_9efb72: "总之！别再说这些沮丧的事了！"
  npc_override_lasagna_lasagna_npcs_anyway_he_had_huge_debt_c5d3f8: "总之，他欠了船和酒馆一大笔债。两人商量了半天，最后去了^0000cd鳀鱼工坊^000000。几年后，^0000cd甘贝里成了工坊经理^000000。这工作非常适合他。"
  npc_override_lasagna_lasagna_npcs_anyway_i_hope_you_help_e9f263: "总之，我希望你帮我找到那个箱子。拜托了。"
  npc_override_lasagna_lasagna_npcs_anyway_i_ll_look_so_30d2d4: "总之，我去找，你负责对付它们。就今天。明天也许马奇会来收拾它们。但今天你来处理。我听说是因为你的缘故。"
  npc_override_lasagna_lasagna_npcs_anyway_i_m_cat_who_78e017: "总之，我是只懂得回报的猫。"
  npc_override_lasagna_lasagna_npcs_anyway_thank_you_finding_467816: "总之，谢谢你找到那个箱子。"
  npc_override_lasagna_lasagna_npcs_anyway_thanks_your_help_654b71: "总之，谢谢你的帮助。帮了大忙了。"
  npc_override_lasagna_lasagna_npcs_anyway_we_decided_extend_5a5732: "总之，我们决定将舞台扩展到^0000cd大海^000000。这个决定是出于我的冒险精神。"
  npc_override_lasagna_lasagna_npcs_anyway_why_there_cow_shi_b8fae3: "总之，为什么这艘船上有一头牛？"
  npc_override_lasagna_lasagna_npcs_anyway_you_re_allowed_co_8da509: "总之！只有在法法尔义警团同意的情况下，你才被允许来这里。"
  npc_override_lasagna_lasagna_npcs_anyways_just_time_myster_d38f6e: "总之，来得正好。刚刚发生了一件神秘的事情，我需要^0000cd一个与此无关的新鲜视角^000000。"
  npc_override_lasagna_lasagna_npcs_aren_t_they_just_beautif_204c6f: "它们是不是很美？"
  npc_override_lasagna_lasagna_npcs_aren_t_you_being_trained_d5d1fe: "你不是正在义警团接受训练吗？训练没完成怎么上船？回去完成你的训练！"
  npc_override_lasagna_lasagna_npcs_aren_t_you_mischievous_m_7e533f: "你真是个调皮的人。"
  npc_override_lasagna_lasagna_npcs_aren_t_you_too_weak_85d971: "你太弱了，对付不了千层面的喵族吧？"
  npc_override_lasagna_lasagna_npcs_argh_658e94: "呃……"
  npc_override_lasagna_lasagna_npcs_argh_give_me_no_no_a8145e: "呃……把它给我。不，不。不是那样。稍微包一下，让别人看不到。对。就这样。把你所有的都给我。"
  npc_override_lasagna_lasagna_npcs_argh_please_hold_me_litt_8a1e71: "呃……请扶我一下。我走不稳了。"
  npc_override_lasagna_lasagna_npcs_arrived_34a232: "到了。"
  npc_override_lasagna_lasagna_npcs_arrived_lasagna_drank_fi_cbb8bc: "到达千层面。喝了五杯卡鲁纳牛奶。"
  npc_override_lasagna_lasagna_npcs_arrived_soft_island_i_do_c7fd9c: "到达软岛。我不知道我们是怎么在茫茫大海中找到路的，但依然令人惊叹。"
  npc_override_lasagna_lasagna_npcs_arrows_generated_pointin_d866d0: "会生成指向目标位置的箭头。^000000"
  npc_override_lasagna_lasagna_npcs_as_experienced_crew_con_5b99db: "作为孔-克利纳号经验丰富的船员，必须能够在任何需要的时候应对任何情况。"
  npc_override_lasagna_lasagna_npcs_as_more_people_started_u_1181a7: "随着越来越多的人使用这艘船并查阅记录，他一定对那些记录着他不太光彩过去的档案感到难为情。"
  npc_override_lasagna_lasagna_npcs_as_recipe_simple_takes_g_0fed76: "因为食谱简单，所以需要好的食材才能做出最好的味道。所以我们从自己养的奶牛那里获取牛奶。"
  npc_override_lasagna_lasagna_npcs_as_you_know_there_s_325738: "但如你所知，生活中没有所谓的\\\\\\\\\\\\\\\"绝不\\\\\\\\\\\\\\\"。然而，我们总是努力去实现\\\\\\\\\\\\\\\"绝不\\\\\\\\\\\\\\\"。"
  npc_override_lasagna_lasagna_npcs_as_you_please_692abf: "随你便。"
  npc_override_lasagna_lasagna_npcs_as_you_see_captain_gambe_fed9f5: "如你所见，甘贝里船长和佩佩隆奇诺只讲他们喜欢讲的故事。托马斯船长的故事也不能全信。"
  npc_override_lasagna_lasagna_npcs_ascend_you_mean_going_up_11ea96: "升天？你是说去天堂？"
  npc_override_lasagna_lasagna_npcs_ask_about_boarding_con_c_b3de5a: "询问有关登上孔-克利纳号的事。"
  npc_override_lasagna_lasagna_npcs_ask_about_joining_vigila_c28688: "询问加入义警团的事。"
  npc_override_lasagna_lasagna_npcs_ask_about_lasagna_a5c20a: "询问关于拉面的事。"
  npc_override_lasagna_lasagna_npcs_ask_about_merchant_band_301ee5: "询问商队的事。"
  npc_override_lasagna_lasagna_npcs_ask_about_reaching_conti_36402e: "询问如何到达米德加尔特大陆。"
  npc_override_lasagna_lasagna_npcs_ask_about_vigilante_29a424: "询问义警团的事。"
  npc_override_lasagna_lasagna_npcs_ask_healer_haru_about_co_d69673: "向^4d4dff治疗师哈鲁询问合成工具包^000000，她会帮你有效使用它。"
  npc_override_lasagna_lasagna_npcs_ask_purser_when_sailing_d0eeaa: "向事务长询问起航信号何时发出。根据时间，我们需要更换或补充食材。"
  npc_override_lasagna_lasagna_npcs_ask_vigilante_how_dragon_00656d: "向义警询问龙的情况，如果出现任何问题，与义警团一起解决。"
  npc_override_lasagna_lasagna_npcs_ass_different_butt_0eefba: "驴和屁股有什么不同吗？"
  npc_override_lasagna_lasagna_npcs_awesome_ed5dbb: "太棒了！"
  npc_override_lasagna_lasagna_npcs_ba_basilisks_out_frying_0eb79e: "巴……巴西利斯克……刚出虎穴又入狼窝。我不喜欢对付那些脏东西。"
  npc_override_lasagna_lasagna_npcs_baby_cute_ab545b: "宝宝，好可爱……"
  npc_override_lasagna_lasagna_npcs_baby_right_ed425e: "宝宝……对吧？"
  npc_override_lasagna_lasagna_npcs_babysitting_sitting_arou_bd1f3a: "看孩子不是安静地坐着。是要照看宝宝！"
  npc_override_lasagna_lasagna_npcs_bad_manners_823b21: "没礼貌！"
  npc_override_lasagna_lasagna_npcs_baked_gold_apple_08819b: "烤金苹果"
  npc_override_lasagna_lasagna_npcs_baked_gold_apple_hard_re_c6dab0: "^0000cd烤金苹果^000000。很难抗拒它表面的金色光泽。"
  npc_override_lasagna_lasagna_npcs_banquet_8fe6a7: "宴会？"
  npc_override_lasagna_lasagna_npcs_basically_you_talk_left_4d8915: "^4d4dff基本上，将鼠标悬停在 NPC 上并左键单击即可对话。"
  npc_override_lasagna_lasagna_npcs_basil_basil_lock_38049c: "巴西尔和巴西尔锁？"
  npc_override_lasagna_lasagna_npcs_basil_locks_holy_water_n_175714: "^0000cd5 个巴西尔锁和 1 瓶圣水^000000。在新世界，圣水可以驱赶邪灵。水手长接触新世界的人时一定有效。"
  npc_override_lasagna_lasagna_npcs_basil_locks_you_ll_get_7acdfe: "^0000cd20 个巴西尔锁^000000。今天你的手会很脏。我很抱歉。但奶奶发话了，所以就这么定了。"
  npc_override_lasagna_lasagna_npcs_basilisks_acting_strange_23c8ef: "巴西利斯克今天行为反常。"
  npc_override_lasagna_lasagna_npcs_basilisks_charged_task_r_573545: "^0000cd巴西利斯克负责回收如意珠^000000。"
  npc_override_lasagna_lasagna_npcs_basilisks_still_cave_whe_24d4eb: "巴西利斯克还在洞穴里吗？我们小的时候，连靠近那个洞穴都不敢。"
  npc_override_lasagna_lasagna_npcs_basilisks_went_rampage_h_a5f200: "巴西利斯克暴走了，他伤到了腿。其他义警带走了他，我相信他安全返回了。"
  npc_override_lasagna_lasagna_npcs_basils_basil_locks_same_124251: "^0000cd20 个巴西尔和 5 个巴西尔锁^000000。和第一次一样。最基础的就是最有用的。"
  npc_override_lasagna_lasagna_npcs_battle_dorams_specialize_e8d3a7: "战斗喵族专精于召唤。"
  npc_override_lasagna_lasagna_npcs_bba_dee18b: "吧——"
  npc_override_lasagna_lasagna_npcs_beat_red_grass_get_red_6c5490: "^4d4dff打败红草，获得 1 个红色药草^000000。"
  npc_override_lasagna_lasagna_npcs_beats_me_world_full_myst_94aecc: "我不懂。世界充满了神秘。"
  npc_override_lasagna_lasagna_npcs_because_characteristic_l_a23835: "这是因为千层面人口的特点。这里主要由来自其他地区的人组成。甘贝里船长和纳维号的托马斯船长几乎是仅有的千层面本地人。"
  npc_override_lasagna_lasagna_npcs_because_even_people_othe_87c1d4: "正因为如此，甚至其他城镇的人也纷纷涌入加入义警团，也因此我们不得不将拉维奥利平原南部的哨所改为等候区。"
  npc_override_lasagna_lasagna_npcs_because_i_m_one_ace_3ae7c9: "因为我是法法尔义警团的王牌成员之一。"
  npc_override_lasagna_lasagna_npcs_because_keeps_them_away_8d5e48: "因为它暂时能驱赶它们。"
  npc_override_lasagna_lasagna_npcs_because_pepperoncino_4f617f: "是因为佩佩隆奇诺。"
  npc_override_lasagna_lasagna_npcs_because_pepperoncino_88cac2: "那是因为佩佩隆奇诺……"
  npc_override_lasagna_lasagna_npcs_because_you_t_make_kalun_fc36ca: "因为没有卡鲁纳就做不了卡鲁纳牛奶。本来应该从莱加拉斯那里接收卡鲁纳的人现在正处于困境中。"
  npc_override_lasagna_lasagna_npcs_becoming_shaman_meow_bet_b6d817: "但成为萨满喵在很多方面都会更好。邪灵会越来越侵蚀他，以占据他的身体。"
  npc_override_lasagna_lasagna_npcs_befitting_its_fame_place_8da5bd: "不负盛名，这个地方挤满了人。"
  npc_override_lasagna_lasagna_npcs_before_discovered_we_had_524b46: "在被发现之前，我们根本不知道米德加尔特的存在。我相信外面一定还有我们不知道的地方。"
  npc_override_lasagna_lasagna_npcs_before_discovery_new_wor_25270c: "在新世界被发现之前，我们喵族以为千层面就是世界的尽头。新世界是看不见的，还有无数生活在那里的人们。"
  npc_override_lasagna_lasagna_npcs_before_i_advise_you_prac_ff5c1f: "在此之前，我建议你以多种方式练习各种技能，帮助你决定自己喜欢什么。"
  npc_override_lasagna_lasagna_npcs_before_long_midgur_midga_bb6641: "用不了多久，这片米德格……米德加尔……？？这片土地很快就会被我们喵族控制！"
  npc_override_lasagna_lasagna_npcs_beginning_they_only_had_b13f69: "一开始，他们只有一艘漏水的、半沉的贸易船。"
  npc_override_lasagna_lasagna_npcs_bell_check_b0732c: "铃铛，确认。"
  npc_override_lasagna_lasagna_npcs_besides_fact_he_grew_up_3faa2b: "除了他在富西利贫困中长大这一事实外，关于他的早年生活一无所知。"
  npc_override_lasagna_lasagna_npcs_besides_seeking_new_adve_3fbd1e: "除了寻求新的冒险，倾听他人的故事也是冒险者的职责。据我所知，你在千层面待的时间比大多数人都长。"
  npc_override_lasagna_lasagna_npcs_besides_there_elements_u_85d5e5: "此外，还有不死属性、圣属性和暗属性。"
  npc_override_lasagna_lasagna_npcs_beverage_made_mixing_kal_919b3c: "一种将卡鲁纳和牛奶混合制成的饮料，三只喵族聚会时饮用。为了纪念他们，现在成了节日饮料。"
  npc_override_lasagna_lasagna_npcs_big_definitely_baby_2eb0df: "很大，但绝对是……宝宝。"
  npc_override_lasagna_lasagna_npcs_blah_no_luck_here_4025dc: "呸！这儿真不走运！"
  npc_override_lasagna_lasagna_npcs_blue_herbs_restore_sp_ca9d8b: "^4d4dff蓝色药草恢复 SP^000000。"
  npc_override_lasagna_lasagna_npcs_boatswain_acting_strange_bf1602: "水手长行为反常。我们好不容易才阻止他在半夜跳进水里。我看他浑身发抖，像是失去了理智，但第二天早上又好了。他被什么迷住了。"
  npc_override_lasagna_lasagna_npcs_boatswain_con_chliina_do_cfd370: "孔-克利纳号的水手长不说谎。如果你不信我，那就信任雇我担任孔-克利纳号水手长的甘贝里吧。"
  npc_override_lasagna_lasagna_npcs_boatswain_kind_sleazy_437993: "水手长有点滑头。"
  npc_override_lasagna_lasagna_npcs_boatswain_must_ve_sent_y_86634f: "一定是水手长派你来的。我会告诉你今天能保你平安的护符。"
  npc_override_lasagna_lasagna_npcs_boatswain_t_leave_her_si_970862: "水手长一刻也离不开她，因为她是他的幸运女神。幸运的是，我们每天都能喝到卡鲁纳牛奶。"
  npc_override_lasagna_lasagna_npcs_boatswain_tried_throw_ou_2bcf8e: "水手长试图扔掉剩下的金枪鱼，被副厨师长抓了个正着。我们都领教了他有多可怕。"
  npc_override_lasagna_lasagna_npcs_born_as_tomei_thomas_sho_9be8da: "本名托梅·托马斯，后简称为托马斯。"
  npc_override_lasagna_lasagna_npcs_boss_three_glasses_kalun_e2b733: "老板！三杯卡鲁纳牛奶，用力摇晃！上面加蛋黄！"
  npc_override_lasagna_lasagna_npcs_both_totally_fine_return_79db18: "两者都会完全没事，很快回到我们身边。所以别这样了！你真有必要把他弄哭吗，嗯？！"
  npc_override_lasagna_lasagna_npcs_bring_back_branches_thos_a4300b: "带回 5 根那些带刺的藤蔓枝条。"
  npc_override_lasagna_lasagna_npcs_bring_cat_hardtacks_mala_5b14b7: "带来^0000cd5 个猫粮硬饼和 5 个马兰多罐头食品^000000。请快点。"
  npc_override_lasagna_lasagna_npcs_bring_me_now_920b71: "现在把 {0} 给我！"
  npc_override_lasagna_lasagna_npcs_bun_sounds_super_delicio_2ca4a9: "包子听起来超级美味。"
  npc_override_lasagna_lasagna_npcs_buns_order_keep_them_fre_6ac182: "^0000cd20 个包子^000000。为了保持新鲜，你得快点。"
  npc_override_lasagna_lasagna_npcs_bursting_into_crying_gom_2ef187: "～突然大哭起来～ 戈玛·查拉！！"
  npc_override_lasagna_lasagna_npcs_business_good_everywhere_0c8838: "生意在哪里都很好。我对佩佩隆奇诺船长和他船员的远见感到惊讶。"
  npc_override_lasagna_lasagna_npcs_business_we_started_sell_fc28a0: "我们开始的生意是^0000cd在其他城市销售千层面的特产^000000。生意很好，我们雇了更多的人来扩大业务规模。"
  npc_override_lasagna_lasagna_npcs_butterfly_f7f34a: "^0000cd[蝴蝶号]^000000"
  npc_override_lasagna_lasagna_npcs_buy_7ceca5: "购买"
  npc_override_lasagna_lasagna_npcs_buy_item_fbf6a9: "购买物品。"
  npc_override_lasagna_lasagna_npcs_calibration_also_availab_be5c71: "根据你的装备，也可以进行校准。"
  npc_override_lasagna_lasagna_npcs_call_me_when_you_re_c75f80: "完成后叫我。别无缘无故叫醒我喵。"
  npc_override_lasagna_lasagna_npcs_call_up_navigation_panel_b6be5a: "^4d4dff点击相应的菜单图标调出导航面板。"
  npc_override_lasagna_lasagna_npcs_calm_down_i_ll_go_32516c: "冷静。我现在就去找。"
  npc_override_lasagna_lasagna_npcs_calm_down_situation_bad_9cd4df: "冷静点。情况不好，但没必要这么悲观。为什么这里的每个人都这么极端？"
  npc_override_lasagna_lasagna_npcs_cancel_77dfd2: "取消"
  npc_override_lasagna_lasagna_npcs_captain_anchovy_fishing_1e422a: "鳀鱼渔船船长"
  npc_override_lasagna_lasagna_npcs_captain_butterfly_5b018f: "蝴蝶号船长。"
  npc_override_lasagna_lasagna_npcs_captain_captain_who_gamb_d4f4e4: "船长？哪个船长？甘贝里？那个蛋精小子？哦，你说得对。他确实当船长了。我记得他和佩佩一起来我酒馆的时候。"
  npc_override_lasagna_lasagna_npcs_captain_chief_officer_th_7b0bfc: "船长和首席官在里面。你可以去见他们。你也可以和他们谈谈航行时间表。"
  npc_override_lasagna_lasagna_npcs_captain_con_chliina_0a8798: "孔-克利纳号船长。"
  npc_override_lasagna_lasagna_npcs_captain_con_chliina_espe_e33bda: "孔-克利纳号的船长尤其擅长这个。现在，你们来试试。"
  npc_override_lasagna_lasagna_npcs_captain_gamberry_captain_ac1763: "甘贝里船长和托马斯船长正式宣布了他们向新世界扩张的计划。孔-克利纳号将负责招募和派遣冒险者前往新世界。"
  npc_override_lasagna_lasagna_npcs_captain_gamberry_captain_e931a3: "甘贝里船长和托马斯船长很奇怪。他们试图让领航船保持直线行驶，以同样的速度航行。就像让孩子们齐步走一样。"
  npc_override_lasagna_lasagna_npcs_captain_s_cabin_chamber_f3836b: "船长室就是前面那个房间。"
  npc_override_lasagna_lasagna_npcs_captain_s_cabin_right_ov_ab51ad: "^0000cd船长室^000000就在那边。因为船长很看重礼貌和礼仪，千万别出差错。"
  npc_override_lasagna_lasagna_npcs_captain_s_cabin_right_up_dc2793: "船长室就在楼梯上面。"
  npc_override_lasagna_lasagna_npcs_captain_thomas_bc5a08: "托马斯船长？"
  npc_override_lasagna_lasagna_npcs_careful_6350b8: "小心。——"
  npc_override_lasagna_lasagna_npcs_careful_next_time_2b285e: "下次小心点。"
  npc_override_lasagna_lasagna_npcs_cat_hardtack_malangdo_ca_a44a67: "猫粮硬饼和马兰多罐头食品……嗯，它们能保存很久。"
  npc_override_lasagna_lasagna_npcs_cat_paw_commerce_group_l_cdcb81: "猫掌商业集团由托梅-托马斯船长领导！"
  npc_override_lasagna_lasagna_npcs_cat_paw_commerce_group_r_83b2a7: "猫掌商业集团负责仓库，所以把你的物品交给他们吧。"
  npc_override_lasagna_lasagna_npcs_catch_ten_trans_spores_b_0251f1: "抓十只变异孢子，带五个蘑菇孢子喵。"
  npc_override_lasagna_lasagna_npcs_catch_ten_trans_spores_b_c3a586: "抓十只变异孢子，给它们带五个蘑菇孢子喵。"
  npc_override_lasagna_lasagna_npcs_cave_s_nice_i_ve_c2d0b0: "洞穴？那不错。我一直想自己去看看。"
  npc_override_lasagna_lasagna_npcs_check_out_details_quest_9f5833: "在任务信息窗口中查看任务详情。"
  npc_override_lasagna_lasagna_npcs_check_out_quest_details_7d0d6c: "^4d4dff按快捷键 [Alt+U] 查看任务详情，^000000或通过菜单栏中的任务图标查看。^000000"
  npc_override_lasagna_lasagna_npcs_check_out_your_equipped_2b3589: "^4d4dff按快捷键 [Alt+Q] 轻松查看已装备的物品。"
  npc_override_lasagna_lasagna_npcs_cheesy_fcc189: "俗气……"
  npc_override_lasagna_lasagna_npcs_chef_must_waiting_s_such_c82c6e: "厨师一定在等着……你能帮我真是太好了。"
  npc_override_lasagna_lasagna_npcs_chef_s_favorite_snack_s_de639d: "但这是厨师最喜欢的零食。是那个挑食的家伙唯一喜欢吃的零食。"
  npc_override_lasagna_lasagna_npcs_chew_them_up_your_hp_49e052: "嚼碎它们，^4d4dff你的 HP 就会恢复。^000000"
  npc_override_lasagna_lasagna_npcs_chief_farfalle_vigilante_636da8: "法法尔义警团团长。"
  npc_override_lasagna_lasagna_npcs_chief_officer_52a868: "首席官。"
  npc_override_lasagna_lasagna_npcs_chief_officer_captain_on_542b4a: "首席官和船长是发出起航信号的人。问他们是最快的方法。"
  npc_override_lasagna_lasagna_npcs_chief_officer_captain_s_6dcb5a: "首席官在船长室里。去问问他，因为起雾，航行时间表会不会有变化！"
  npc_override_lasagna_lasagna_npcs_chief_officer_captain_s_cf0420: "首席官在那边船长室里。"
  npc_override_lasagna_lasagna_npcs_chief_peperoncino_captai_f86c8d: "佩佩隆奇诺团长和甘贝里船长也是在这里第一次相遇。三人结为结拜兄弟，在他们的努力获得成功后成为了传奇。"
  npc_override_lasagna_lasagna_npcs_chomp_chomp_chomp_a49877: "咔嚓咔嚓咔嚓。"
  npc_override_lasagna_lasagna_npcs_click_item_icon_basic_in_60f299: "点击左上角基本信息窗口中的\\\\\\\\\\\\\\\"物品\\\\\\\\\\\\\\\"图标，打开物品窗口。"
  npc_override_lasagna_lasagna_npcs_click_skill_button_open_8ec7ec: "点击^4d4dff技能^000000按钮打开技能窗口。"
  npc_override_lasagna_lasagna_npcs_cold_kahlugna_milk_best_22a6bc: "冰镇卡鲁纳牛奶最棒了。"
  npc_override_lasagna_lasagna_npcs_come_885c0a: "来吧！"
  npc_override_lasagna_lasagna_npcs_come_again_then_e7f3d6: "那就再来吧。"
  npc_override_lasagna_lasagna_npcs_come_back_after_daybreak_4947a7: "天亮后再来。"
  npc_override_lasagna_lasagna_npcs_come_back_after_finishin_c08aa0: "完成任务后再回来！"
  npc_override_lasagna_lasagna_npcs_come_back_again_ce341c: "再回来！"
  npc_override_lasagna_lasagna_npcs_come_back_again_soon_45f470: "很快再来！"
  npc_override_lasagna_lasagna_npcs_come_find_me_if_you_c01ff0: "有问题就来找我。"
  npc_override_lasagna_lasagna_npcs_come_hurry_645480: "来吧。快点！"
  npc_override_lasagna_lasagna_npcs_come_i_m_cutest_youngest_7c2d31: "来吧……我是千层面最可爱、最年轻的小猫咪！"
  npc_override_lasagna_lasagna_npcs_come_me_then_navi_dragon_e946bb: "那就跟我来。<NAVI>^4D4DFF[龙巢]^000000<INFO>lasa_fild02,340,244,000,1,</INFO></NAVI> 在村外田地右端的洞穴里。"
  npc_override_lasagna_lasagna_npcs_come_over_here_57677d: "过来这里。"
  npc_override_lasagna_lasagna_npcs_come_over_here_click_me_7e69e1: "快过来！点我，快点！"
  npc_override_lasagna_lasagna_npcs_come_think_there_hypnoti_7ff316: "说起来，村里有个^4d4dff催眠师^000000。"
  npc_override_lasagna_lasagna_npcs_come_welcome_d4fd1b: "来吧！欢迎！"
  npc_override_lasagna_lasagna_npcs_condition_dragon_always_264bc2: "龙的状态由义警团持续监控。请去^0000cd见守卫村子南桥的义警^000000，查看龙的状态。"
  npc_override_lasagna_lasagna_npcs_conscience_mm_sorry_i_do_1d680e: "良心？嗯……抱歉，我不知道，因为我完全不知道我的良心在哪。"
  npc_override_lasagna_lasagna_npcs_consider_as_warming_up_a_b991a4: "就当是为你在新大陆可能遇到的所有困难做热身吧。"
  npc_override_lasagna_lasagna_npcs_consider_privilege_3f403e: "把它当成一种特权吧。"
  npc_override_lasagna_lasagna_npcs_consisted_only_events_wh_0ce900: "它不仅包含了船上发生的事件，还包含了几乎所有与孔-克利纳号有关的人的历史。"
  npc_override_lasagna_lasagna_npcs_continent_midgard_far_st_225a92: "从米德加尔特大陆到远星！"
  npc_override_lasagna_lasagna_npcs_could_you_catch_sweet_ro_3255c0: "你能抓一些甜罗达蛙，给我带一些粘性蛙蹼吗？大约五个。谢谢！"
  npc_override_lasagna_lasagna_npcs_could_you_catch_ten_swee_15492c: "你能抓十只甜罗达蛙，给我带一些粘性蛙蹼吗？大约五个。谢谢！"
  npc_override_lasagna_lasagna_npcs_couple_days_ago_we_met_9fd34a: "几天前我们遇到了风暴，但又一次？！谁在这个季节设定了这条航线？我想既然是第一次，就算了吧。"
  npc_override_lasagna_lasagna_npcs_course_did_you_forget_al_b4b26f: "当然不是。不是这个。你已经忘了吗喵？"
  npc_override_lasagna_lasagna_npcs_course_don_t_forget_abou_73afa6: "当然，别忘了猫掌商业集团！"
  npc_override_lasagna_lasagna_npcs_course_eyes_head_since_s_f181c9: "当然有眼睛和头，因为它是一条鱼。"
  npc_override_lasagna_lasagna_npcs_course_there_small_dispu_54f016: "当然也有小争执，但甘贝里被我的领导力所打动，受到了影响。在积累了足够多的鳀鱼加工经验和技能后，我们决定绘制更宏大的蓝图。"
  npc_override_lasagna_lasagna_npcs_cow_s_name_woncow_5ecbbb: "奶牛的名字叫 [旺牛]……"
  npc_override_lasagna_lasagna_npcs_craft_amulet_7ac9af: "制作护符"
  npc_override_lasagna_lasagna_npcs_creases_sail_check_7c524a: "帆上 5 道褶皱，确认。"
  npc_override_lasagna_lasagna_npcs_creases_sail_check_good_667637: "帆上 5 道褶皱，确认。好！"
  npc_override_lasagna_lasagna_npcs_crucial_test_your_streng_adae63: "在出发冒险之前测试你的实力至关重要。"
  npc_override_lasagna_lasagna_npcs_crunchy_salad_580f8f: "脆沙拉"
  npc_override_lasagna_lasagna_npcs_crunchy_salad_enhances_a_334d1d: "香脆沙拉提升^0000cd敏捷^000000。想要攻击更快或不想被击中的人倾向于食用它。"
  npc_override_lasagna_lasagna_npcs_crunchy_salad_i_really_l_010a39: "^0000cd香脆沙拉^000000！我真的很喜欢这道菜。你很有品味。"
  npc_override_lasagna_lasagna_npcs_curiosity_kills_doram_th_f1fdf1: "好奇心害死喵族，人们说……"
  npc_override_lasagna_lasagna_npcs_currently_sails_liner_co_97b4bf: "目前航行于连接千层面和新世界的班轮上。"
  npc_override_lasagna_lasagna_npcs_cut_out_well_since_you_00ab27: "住口。好吧，既然你看起来有歉意，如果你带一个^0000cd巴西尔岩石^000000来，我就原谅你。我可是个相当大度的人。"
  npc_override_lasagna_lasagna_npcs_dandi_today_s_training_p_480fe7: "丹迪！今天的训练是<在头上放 10 条蚯蚓！>过来！"
  npc_override_lasagna_lasagna_npcs_day_i_left_entire_fusill_7ad111: "我离开的那天，整个富西利都哭了。"
  npc_override_lasagna_lasagna_npcs_dear_adventurer_did_you_d02e87: "亲爱的冒险者，你见到萨满喵了吗？"
  npc_override_lasagna_lasagna_npcs_dear_adventurer_i_should_4904d3: "亲爱的冒险者，我应该带他去基地。你能一个人去那里吗？^0000cd塔尔图菲^000000在楼上。去问他问题是什么。"
  npc_override_lasagna_lasagna_npcs_dear_adventurer_i_should_9a3ca9: "亲爱的冒险者，我应该带他去基地。你能一个人去那里吗？"
  npc_override_lasagna_lasagna_npcs_dear_adventurer_since_yo_66e22f: "亲爱的冒险者，既然你完成了任务，这是给你的奖励。从现在起，你可以自由查阅档案室的所有文件。那就这样吧。"
  npc_override_lasagna_lasagna_npcs_dear_captain_what_you_do_114db7: "亲爱的船长，你在这里做什么？"
  npc_override_lasagna_lasagna_npcs_dear_chief_officer_beec2e: "亲爱的首席官！"
  npc_override_lasagna_lasagna_npcs_dear_lord_thank_you_so_817d3f: "天哪，谢谢你。原来这就是你回报我所有善举的方式。"
  npc_override_lasagna_lasagna_npcs_dear_sous_chef_51f3e9: "亲爱的副厨师长。"
  npc_override_lasagna_lasagna_npcs_decline_e87fe0: "拒绝。"
  npc_override_lasagna_lasagna_npcs_depending_all_kinds_supe_c7f159: "依靠各种迷信就是削弱它的方法吗？"
  npc_override_lasagna_lasagna_npcs_depending_preference_one_0f5e34: "根据喜好，可以加入一到三颗醋栗。"
  npc_override_lasagna_lasagna_npcs_dex_dexterity_about_accu_43f6d8: "DEX（灵巧）关乎命中率和施法速度。"
  npc_override_lasagna_lasagna_npcs_dex_highly_crucial_early_6f53c1: "DEX 在早期至关重要，因为它能提升命中率。"
  npc_override_lasagna_lasagna_npcs_dex_related_dexterity_ac_0888b1: "^4d4dffDEX 与灵巧和命中率有关。^000000"
  npc_override_lasagna_lasagna_npcs_did_did_i_misspeak_what_b70fef: "我……我说错话了吗？"
  npc_override_lasagna_lasagna_npcs_did_i_teach_you_about_0b4b7f: "我教过你吗？"
  npc_override_lasagna_lasagna_npcs_did_our_vigilante_member_09790c: "但我们镇中心广场的义警成员有告诉你什么吗？"
  npc_override_lasagna_lasagna_npcs_did_you_bring_amulet_tod_e78a73: "你带来今天的护符了吗？你似乎是空手来的。有什么问题吗？"
  npc_override_lasagna_lasagna_npcs_did_you_decide_what_you_f908dc: "你决定好要点什么了吗？"
  npc_override_lasagna_lasagna_npcs_did_you_forget_you_must_a5af94: "你忘了吗？你必须至少消灭 20 只巴西利斯克，它们才会安静下来。"
  npc_override_lasagna_lasagna_npcs_did_you_get_talk_imoogi_85e2db: "你和伊穆吉谈过了吗？他说了什么？还没？快点。巴西利斯克太烦人了。"
  npc_override_lasagna_lasagna_npcs_did_you_hear_what_i_75eeed: "你听到我听到的了吗？"
  npc_override_lasagna_lasagna_npcs_did_you_know_592d1a: "你知道吗？"
  npc_override_lasagna_lasagna_npcs_did_you_really_think_i_cd89cb: "你真的以为我不会发现吗？你身后留下了一长串证据。"
  npc_override_lasagna_lasagna_npcs_didn_t_i_tell_you_7c9958: "我刚才不是告诉过你了吗？他完全处理好了。我把那些糟糕的喵族召集起来跟他们谈了谈。他们被我的演讲所感动，自愿加入了义警团。"
  npc_override_lasagna_lasagna_npcs_didn_t_i_tell_you_e7abbe: "我不是告诉过你好几次了吗，那些必须发酵后交付？而且截止日期已经过了！"
  npc_override_lasagna_lasagna_npcs_didn_t_new_world_human_0ce63b: "但新世界和人类真的不存在吗？"
  npc_override_lasagna_lasagna_npcs_didn_t_you_say_you_2cdfb6: "你不是说要回莱加拉斯那里吗？下次带帮手来的时候，确保他们是像样的。"
  npc_override_lasagna_lasagna_npcs_didn_t_you_say_you_a4dee1: "你不是说想把你家乡的母亲接来吗？你不能就这样死掉！嘿，伙计！马奇！别死在我面前！"
  npc_override_lasagna_lasagna_npcs_didn_t_you_say_you_ac422c: "你不是说有话要对卡鲁说吗？去吧。"
  npc_override_lasagna_lasagna_npcs_didn_t_you_say_you_e1a76f: "你不是说要去鳀鱼运输船吗？真不明白你去了那里能做什么。"
  npc_override_lasagna_lasagna_npcs_didn_t_you_say_you_fc7a4e: "你不是说要去查明莱加拉斯为什么没能送货吗？"
  npc_override_lasagna_lasagna_npcs_difficult_45b055: "这很难。"
  npc_override_lasagna_lasagna_npcs_difficult_choose_efa46f: "很难选择吗？"
  npc_override_lasagna_lasagna_npcs_difficult_concept_get_so_f9a292: "这可能是个难以理解的概念，所以你应该尝试提升这个和那个，找到适合自己的方式。"
  npc_override_lasagna_lasagna_npcs_dirt_grass_your_feet_you_29ffe7: "你脚上的泥土和草……你不是个整洁的人……哦，算了。我不记录你的缺点了……这就够了。"
  npc_override_lasagna_lasagna_npcs_discovery_new_sea_route_38c69d: "随着新航线的发现，大量外来者涌入我们的城镇……"
  npc_override_lasagna_lasagna_npcs_doesn_t_hurt_go_visit_6b25d3: "去那里看看也无妨。"
  npc_override_lasagna_lasagna_npcs_doesn_t_matter_how_stron_341c00: "不管你有多强。你得先打中目标！"
  npc_override_lasagna_lasagna_npcs_doesn_t_mean_he_doesn_d7788f: "这并不意味着他不喜欢你。"
  npc_override_lasagna_lasagna_npcs_doh_pig_eating_kalunyak_c22d2e: "啧！那头猪又在吃卡鲁尼亚克了！"
  npc_override_lasagna_lasagna_npcs_doll_check_894ff9: "玩偶，确认。"
  npc_override_lasagna_lasagna_npcs_don_t_block_sunlight_meo_d44dc8: "别挡住阳光喵……"
  npc_override_lasagna_lasagna_npcs_don_t_call_me_little_ef8243: "别叫我小孩子。我才 457 岁。但话说回来，和躲在那边某处的爷爷相比，我确实是个孩子。"
  npc_override_lasagna_lasagna_npcs_don_t_disturb_my_sleep_738dbb: "别打扰我的……睡眠……"
  npc_override_lasagna_lasagna_npcs_don_t_even_mention_mess_7b8f91: "别提了。那真是一团糟。路况糟糕。人也糟糕。过去被称为黑暗时代是有原因的。"
  npc_override_lasagna_lasagna_npcs_don_t_even_think_about_df23d4: "从今以后想都别想！"
  npc_override_lasagna_lasagna_npcs_don_t_insult_fusilli_ff87ce: "别侮辱富西利！"
  npc_override_lasagna_lasagna_npcs_don_t_kill_person_your_fed335: "别用你的话杀人。"
  npc_override_lasagna_lasagna_npcs_don_t_let_people_notice_678a73: "别让别人注意到你来自外地！"
  npc_override_lasagna_lasagna_npcs_don_t_need_sweat_i_e9bc91: "不必紧张。我相信你在外面已经得到了足够的训练，现在没什么可做的了。不如去熟悉一下船员和他们的名字？"
  npc_override_lasagna_lasagna_npcs_don_t_so_loud_everyone_b50f4b: "别那么大声！所有人都在看！"
  npc_override_lasagna_lasagna_npcs_don_t_stranger_even_when_b5e76c: "即使你去了新大陆，也别变得陌生！"
  npc_override_lasagna_lasagna_npcs_don_t_talk_about_smell_1a3fe3: "别提那个味道……"
  npc_override_lasagna_lasagna_npcs_don_t_tell_me_you_bb9d83: "别告诉我你来是因为你不知道那件事。"
  npc_override_lasagna_lasagna_npcs_don_t_worry_about_me_9e002a: "别担心我。继续走吧。"
  npc_override_lasagna_lasagna_npcs_don_t_you_boarding_permi_45d649: "你没有^0000cd登船许可证^000000吗？上船需要它！振作起来！回去拿一张！"
  npc_override_lasagna_lasagna_npcs_don_t_you_feel_mysteriou_704cac: "难道你没有感觉到那神秘的力量已经在你的血管里奔涌了吗？你无法抗拒它！"
  npc_override_lasagna_lasagna_npcs_don_t_you_just_need_acf8be: "你只需要食物填饱肚子不是吗？"
  npc_override_lasagna_lasagna_npcs_don_t_you_want_exchange_0cfc03: "你不想用这个交换 {0} {1} 吗？"
  npc_override_lasagna_lasagna_npcs_don_t_you_want_exchange_da356d: "你不想用这个交换 {0}{1} {2} 吗？"
  npc_override_lasagna_lasagna_npcs_doram_feb5dc: "喵族。"
  npc_override_lasagna_lasagna_npcs_doram_nothing_if_curious_9f807f: "喵族不好奇就不是喵族了！"
  npc_override_lasagna_lasagna_npcs_doram_same_town_your_bes_45982d: "来自同一城镇的喵族可以成为你最好的朋友。"
  npc_override_lasagna_lasagna_npcs_doram_trash_what_how_you_c5b091: "喵族败类？什么？你怎么能说这种话？！"
  npc_override_lasagna_lasagna_npcs_double_click_consumable_fe2fa3: "双击消耗品即可使用。"
  npc_override_lasagna_lasagna_npcs_drag_corner_area_right_h_7fa68b: "拖动快捷键窗口右侧的角落区域可查看其他页面。"
  npc_override_lasagna_lasagna_npcs_drag_equipment_window_us_44a8de: "^4d4dff将其拖拽到装备窗口^000000即可使用。"
  npc_override_lasagna_lasagna_npcs_drag_your_skill_item_use_e8b336: "将你的技能或物品拖拽到槽位中使用，按下对应的按键即可立即激活。"
  npc_override_lasagna_lasagna_npcs_dried_fish_they_tied_one_9f5eb1: "鱼干。它们被一条一条地串在绳子上，所以我们简称之为\\\\\\\\\\\\\\\"鱼串\\\\\\\\\\\\\\\"。但那些沙漠之狼总是把它们吃光，真是令人头疼。"
  npc_override_lasagna_lasagna_npcs_dried_star_lilly_check_5c1001: "干星百合，确认。"
  npc_override_lasagna_lasagna_npcs_drop_your_weapons_surren_ec19ac: "放下武器投降！"
  npc_override_lasagna_lasagna_npcs_duty_as_adventurer_c31fd4: "作为冒险者的职责？"
  npc_override_lasagna_lasagna_npcs_each_element_intertwined_859510: "各属性相互交织。所以要明智地使用相克属性。"
  npc_override_lasagna_lasagna_npcs_each_herb_good_source_pr_b43d59: "每种药草都是加工成各种药物的良好来源。"
  npc_override_lasagna_lasagna_npcs_earth_element_defeats_wi_c5ac8e: "地属性克制风属性。"
  npc_override_lasagna_lasagna_npcs_easy_ea82bf: "简单。"
  npc_override_lasagna_lasagna_npcs_eating_again_5944ca: "又在吃？"
  npc_override_lasagna_lasagna_npcs_eating_kalunyak_simple_g_99cf22: "吃卡鲁尼亚克很简单。抓起带硬壳的卡鲁尼亚克。然后交给莱加拉斯。"
  npc_override_lasagna_lasagna_npcs_eating_kalunyaks_enough_a30905: "光是不吃卡鲁尼亚克还不够。我从没想过莱加拉斯可能会离开我们。我们必须做点什么。"
  npc_override_lasagna_lasagna_npcs_effects_vary_herbs_depen_0eb091: "药草的效果因颜色而异。"
  npc_override_lasagna_lasagna_npcs_eggling_may_rest_peace_eace23: "蛋精可以安息了。"
  npc_override_lasagna_lasagna_npcs_eggling_ready_handle_yet_97961e: "蛋精还没准备好处理它。想想为什么蛋精还叫蛋精。"
  npc_override_lasagna_lasagna_npcs_eh_i_never_tried_i_035609: "呃，我从没试过，但我觉得我会喜欢的。"
  npc_override_lasagna_lasagna_npcs_eh_my_name_675ef1: "呃，我叫 {0}。"
  npc_override_lasagna_lasagna_npcs_elderly_lady_she_doesn_t_232d5c: "老奶奶？她看起来不像。像一只非常……年轻的喵族。"
  npc_override_lasagna_lasagna_npcs_eliminate_leaf_lunatics_fda330: "在^4d4dff10 分钟^000000内消灭这里周围的^4d4dff3 只叶精和 2 只草精^000000！"
  npc_override_lasagna_lasagna_npcs_enchanted_song_219d97: "被歌声迷住了？"
  npc_override_lasagna_lasagna_npcs_end_dialogue_893f5e: "结束对话。"
  npc_override_lasagna_lasagna_npcs_enhances_dex_ones_who_d_370cfd: "它提升^0000cd灵巧^000000。想要提高命中率的人会吃这个。"
  npc_override_lasagna_lasagna_npcs_enjoy_smooth_voyage_d20b8b: "祝你航行顺利。"
  npc_override_lasagna_lasagna_npcs_enough_already_you_guys_916a70: "够了！你们一天比一天过分！你们不觉得太过分了吗？你们还有良心吗？！"
  npc_override_lasagna_lasagna_npcs_enough_c635b3: "够了吗？"
  npc_override_lasagna_lasagna_npcs_enough_how_about_checkin_754c8e: "还不够？要不看看他有多少？"
  npc_override_lasagna_lasagna_npcs_enough_next_destination_e0657b: "够了。{0}，下一个目的地是村里的道具店。我再告诉你一次在哪。"
  npc_override_lasagna_lasagna_npcs_enriched_foxtail_0308c8: "强化狐尾草"
  npc_override_lasagna_lasagna_npcs_especially_you_need_adju_e73663: "特别是，你需要调整你的着装。合适的着装带来正确的姿态，而正确的姿态是成为绅士的第一步。"
  npc_override_lasagna_lasagna_npcs_even_i_common_sense_know_536878: "即使是我也有常识，知道重的东西会沉入水中！"
  npc_override_lasagna_lasagna_npcs_even_if_i_don_t_dfdd4f: "即使我没有在这里和睡意抗争而死，我爸——我是说厨师——也会杀了我的。仅仅因为蘑菇孢子喵。"
  npc_override_lasagna_lasagna_npcs_even_if_requires_bit_for_4994fa: "即使那需要一点武力。"
  npc_override_lasagna_lasagna_npcs_even_my_mustache_thinnin_1550bf: "连我的胡子都在变稀……救救我……"
  npc_override_lasagna_lasagna_npcs_even_our_chief_captain_g_df016b: "连我们的团长和甘贝里船长都失去了冷静。"
  npc_override_lasagna_lasagna_npcs_ever_since_head_chef_ent_d170ce: "从那以后，主厨把所有事情都交给了我。"
  npc_override_lasagna_lasagna_npcs_ever_since_we_been_only_18e3c5: "从那以后，我们不仅引领着与新大陆的贸易，还连接着两个大陆。来自两个大陆的冒险者都使用^0000cd孔-克利纳号^000000，我们为此感到自豪。"
  npc_override_lasagna_lasagna_npcs_every_life_world_comes_p_24a47e: "这个世界上的每个生命都带有一个属性。"
  npc_override_lasagna_lasagna_npcs_every_night_i_saw_dim_a9a4b6: "每天晚上，我都会看到一个模糊的身影，或者因为耳边叽叽喳喳的噪音而无法入睡。当我终于睡着时，会感到身体上有重物压着，然后一身冷汗地惊醒。"
  npc_override_lasagna_lasagna_npcs_every_time_i_see_boat_0aa379: "每次看到船，我都会想起贝壳。你知道的，那种里面空空的、外面硬硬的东西。"
  npc_override_lasagna_lasagna_npcs_everyone_keep_away_i_m_72c993: "大家退后！我很危险。喀啦！三色鳀鱼能撑多久？！"
  npc_override_lasagna_lasagna_npcs_everyone_keep_away_i_m_b6d260: "大家退后！我很危险。"
  npc_override_lasagna_lasagna_npcs_everyone_orders_kaluna_m_f9b838: "因为佩佩隆奇诺、甘贝里和托马斯的烤箱决议，这里每个人都点卡鲁纳牛奶。但烤箱酒馆真正的特色菜是鱼糕。"
  npc_override_lasagna_lasagna_npcs_everyone_recommended_i_s_bc8cec: "每个人都建议我来问你要关于千层面和法法尔义警团的故事。"
  npc_override_lasagna_lasagna_npcs_everyone_says_i_hear_adv_bb3b6f: "每个人都说，我可以从你那里听到关于千层面和孔-克利纳号的冒险故事。"
  npc_override_lasagna_lasagna_npcs_everyone_should_know_whe_ad5d5f: "每个人都应该知道从哪里得到它才能携带它。我从哪里可以得到它？"
  npc_override_lasagna_lasagna_npcs_everyone_treats_me_like_ce3548: "每个人都把我当成一只新蛋精，但我也完成了正规训练课程！"
  npc_override_lasagna_lasagna_npcs_everyone_your_position_w_46a3ad: "各位，各就各位！我们现在要起航了！"
  npc_override_lasagna_lasagna_npcs_everything_depends_you_02d994: "一切取决于你。"
  npc_override_lasagna_lasagna_npcs_evil_ghost_absorb_life_o_348f9e: "恶灵会吸走你的生命。亲爱的水手长，你这样活不了几天的。"
  npc_override_lasagna_lasagna_npcs_exactly_when_how_long_ag_d17b28: "到底是什么时候？多久以前？"
  npc_override_lasagna_lasagna_npcs_excellent_work_03a6b9: "干得好。"
  npc_override_lasagna_lasagna_npcs_exchange_5b13ea: "交换"
  npc_override_lasagna_lasagna_npcs_exchange_please_you_plea_31c224: "用它交换 {0}{1} {2}！拜托了？你会做的，对吧？"
  npc_override_lasagna_lasagna_npcs_exchange_please_you_plea_f964f4: "用它交换 {0} {1}！拜托了？你会做的，对吧？"
  npc_override_lasagna_lasagna_npcs_exchange_tokens_armor_9c45c2: "用代币兑换防具。"
  npc_override_lasagna_lasagna_npcs_exchange_tokens_weapon_5cde86: "用代币兑换武器。"
  npc_override_lasagna_lasagna_npcs_excuse_me_471adf: "打扰一下。"
  npc_override_lasagna_lasagna_npcs_excuse_me_captain_80a7ec: "打扰一下，船长。"
  npc_override_lasagna_lasagna_npcs_excuse_me_f96820: "你说什么？"
  npc_override_lasagna_lasagna_npcs_expand_our_flourishing_b_331de5: "为了扩展我们蓬勃发展的业务，我们^0000cd开始了海上贸易^000000。但在这期间，^0000cd托马斯船长的蝴蝶号在台风中失踪了^000000。"
  npc_override_lasagna_lasagna_npcs_explains_slew_dorams_who_27bbb9: "这解释了为什么在^4d4dff千层面^000000——这个边境地区原本只是一个渔村——有大量喵族四处游荡。"
  npc_override_lasagna_lasagna_npcs_exploitation_alert_115d9d: "剥削警告！"
  npc_override_lasagna_lasagna_npcs_f_f_011568: "F12！F12！"
  npc_override_lasagna_lasagna_npcs_fair_fair_right_42cfec: "公平就是公平，对吧？"
  npc_override_lasagna_lasagna_npcs_famous_pub_oven_a85689: "这就是著名的烤箱酒馆吗？"
  npc_override_lasagna_lasagna_npcs_far_star_continent_d2b3d6: "远星大陆？"
  npc_override_lasagna_lasagna_npcs_farfalle_vigilante_c5e964: "蝴蝶面治安官？"
  npc_override_lasagna_lasagna_npcs_farfalle_vigilantes_char_aebccd: "而法法尔义警团将负责训练他们。以软岛为基地，蝴蝶号同意支持冒险者。准备时间为三年。"
  npc_override_lasagna_lasagna_npcs_father_mother_please_com_8ea809: "父亲，母亲。请平安回家。"
  npc_override_lasagna_lasagna_npcs_feels_like_black_fog_nea_a0ad4a: "感觉身边的黑雾正在消散！我再也听不到耳语声了！久违地感觉头脑如此清晰。"
  npc_override_lasagna_lasagna_npcs_feels_like_everyone_back_06f5be: "感觉如果我去港口，所有人都会回来并面带微笑。"
  npc_override_lasagna_lasagna_npcs_feels_like_seeing_sunshi_86a127: "感觉就像在黑暗中看到阳光。"
  npc_override_lasagna_lasagna_npcs_feels_like_watching_blue_0e8c33: "感觉就像在晴朗无风的日子里眺望蓝色地平线。令人神清气爽。"
  npc_override_lasagna_lasagna_npcs_feels_like_watching_clou_aeff31: "感觉就像躺在绿色山丘上仰望云卷云舒。"
  npc_override_lasagna_lasagna_npcs_feels_like_we_re_being_bfca83: "感觉我们被卖了。"
  npc_override_lasagna_lasagna_npcs_felt_like_i_could_grab_39f0d3: "我感觉自己能用手抓住那旋律。当我循着声音走去时，有人用力摇晃了我。接下来我注意到的是，就在我跳下船之前，被船员们拉住了。"
  npc_override_lasagna_lasagna_npcs_few_years_ago_captain_to_841040: "几年前，托马托马斯船长出发探索新的贸易路线，但他的船在风暴中失踪了。"
  npc_override_lasagna_lasagna_npcs_filled_more_abundant_det_1f4e89: "它将比之前的记录更加丰富详尽。"
  npc_override_lasagna_lasagna_npcs_finally_689f10: "终于！"
  npc_override_lasagna_lasagna_npcs_fine_anywhere_as_long_as_b646d1: "好吧。只要不无聊，去哪都行。"
  npc_override_lasagna_lasagna_npcs_fine_i_ll_see_if_a8c36b: "好吧。我去看看附近有没有宝宝。酒馆上面有个^0000cd游乐场^000000。我去那里看看。"
  npc_override_lasagna_lasagna_npcs_fine_if_you_any_chance_b996b5: "好吧。如果你碰巧找到那个如意珠，请告诉伊穆克大人。"
  npc_override_lasagna_lasagna_npcs_fine_you_re_boarding_shi_37feeb: "好吧。你要上船对吧？希望你平安到达目的地。"
  npc_override_lasagna_lasagna_npcs_fire_element_beats_earth_f234ab: "火属性克制地属性。"
  npc_override_lasagna_lasagna_npcs_fire_element_highly_resi_4cd88c: "火属性对地属性有很高的抗性。"
  npc_override_lasagna_lasagna_npcs_first_aid_skill_converti_90f004: "急救是一项在紧急情况下将 SP 转化为 HP 的技能。"
  npc_override_lasagna_lasagna_npcs_first_i_tried_persuade_t_5626f5: "起初，我试图通过谈话来说服那些糟糕的喵族。我试图做个绅士，但他们不听。那时甘贝里接手了。"
  npc_override_lasagna_lasagna_npcs_first_off_let_s_see_394cf4: "首先，让我们看看你有什么本事。"
  npc_override_lasagna_lasagna_npcs_first_off_we_should_meet_5e809b: "首先，我们应该与我们的领导会面，决定时间表。"
  npc_override_lasagna_lasagna_npcs_first_you_need_cookbook_74e49f: "首先！你需要一本^0000cd食谱^000000。"
  npc_override_lasagna_lasagna_npcs_firstly_enhances_status_3d9573: "首先，它^0000cd提升状态^000000。"
  npc_override_lasagna_lasagna_npcs_fish_cake_white_fish_fil_5a690c: "鱼糕是将白色鱼片与煮熟的豆子捣碎后成型油炸而成。非常美味，但很少有人点。"
  npc_override_lasagna_lasagna_npcs_five_mushroom_spores_per_186c3b: "五个蘑菇孢子。完美。向冒险者求助是明智的。"
  npc_override_lasagna_lasagna_npcs_five_sticky_webfeet_perf_dfe789: "五个粘性蛙蹼。完美。"
  npc_override_lasagna_lasagna_npcs_focus_using_summoning_sk_5784c6: "专注于使用召唤技能，以便在战斗中获胜。"
  npc_override_lasagna_lasagna_npcs_fog_3a7cb3: "雾！"
  npc_override_lasagna_lasagna_npcs_fog_94c669: "雾……"
  npc_override_lasagna_lasagna_npcs_fog_ce4218: "雾……？"
  npc_override_lasagna_lasagna_npcs_fog_covering_sky_patrol_1954cc: "雾气遮蔽了天空。^0000cd巡逻队^000000还没有回来，所以可能需要一些时间。"
  npc_override_lasagna_lasagna_npcs_fog_huh_fog_when_did_60b44c: "雾？哈！雾！这是什么时候的事？而且巡逻队还没回来。"
  npc_override_lasagna_lasagna_npcs_fog_lifted_if_you_just_4be327: "如果你只是坐着等，那雾是不会散去的。"
  npc_override_lasagna_lasagna_npcs_follow_arrows_just_appea_21052a: "跟随刚刚出现在地面上的箭头。"
  npc_override_lasagna_lasagna_npcs_follow_yellow_cheese_roa_4585e6: "沿着这条黄色奶酪路走，就能到达我的家乡。我希望有一天能回到那里。"
  npc_override_lasagna_lasagna_npcs_food_72f77e: "食物！！！"
  npc_override_lasagna_lasagna_npcs_fragrant_seasoned_herbs_bb7a9d: "^0000cd香草调味料^000000。它提升^0000cd力量^000000。体力消耗大的人会吃这个。"
  npc_override_lasagna_lasagna_npcs_fragrant_seasoned_herbs_f4708f: "香草调味料"
  npc_override_lasagna_lasagna_npcs_free_up_some_space_7908ba: "- 腾出一些空间 -"
  npc_override_lasagna_lasagna_npcs_fresh_milk_anytime_525697: "随时都有新鲜牛奶！"
  npc_override_lasagna_lasagna_npcs_fresh_tuna_amulet_76ff14: "新鲜金枪鱼护符"
  npc_override_lasagna_lasagna_npcs_front_us_c4ebed: "在我们面前。"
  npc_override_lasagna_lasagna_npcs_funny_how_two_hoodlums_s_e5cff7: "有意思的是，两个混混在管教其他混混。"
  npc_override_lasagna_lasagna_npcs_future_looked_bleak_lasa_385fc2: "千层面的前景一片黯淡，但他们讨论后决定，佩佩隆奇诺团长负责义警团保卫城镇，而甘贝里和托马托马斯船长领导商队。"
  npc_override_lasagna_lasagna_npcs_future_seen_through_past_06fa15: "未来可以通过过去来预见。"
  npc_override_lasagna_lasagna_npcs_fyi_shortcut_key_alt_s_100588: "顺便一提，快捷键是^4d4dffAlt+S^000000。"
  npc_override_lasagna_lasagna_npcs_g_ghost_e8fd3c: "鬼——鬼？"
  npc_override_lasagna_lasagna_npcs_g_guys_didn_t_you_ce7117: "各——各位？你们不是想让我帮你们找看孩子的工作吗？"
  npc_override_lasagna_lasagna_npcs_gamberi_took_me_shaman_m_2fcdee: "甘贝里带我去找了萨满喵做咨询，但没有用。这个恶灵太古老、太强大、太执着了，无法驱除。"
  npc_override_lasagna_lasagna_npcs_gamberi_who_came_there_t_1ab10e: "来到那里的甘贝里试图阻止我，但我打开了封印。^0000cd罐子^000000里什么都没有，什么也没发生。"
  npc_override_lasagna_lasagna_npcs_gamberry_5f3d89: "- 甘贝里 -"
  npc_override_lasagna_lasagna_npcs_gamberry_f0a143: "甘贝里"
  npc_override_lasagna_lasagna_npcs_gamberry_hoodlum_who_rem_fdd0b4: "^0000cd甘贝里是个让我想起恶棍的混混^000000。他很快被我的话语打动，加入了我们的生意。"
  npc_override_lasagna_lasagna_npcs_geesh_you_re_just_scream_35828c: "天哪！你这不是在明摆着说自己是个乡巴佬吗！"
  npc_override_lasagna_lasagna_npcs_gentleman_supposed_sense_c2536a: "绅士应该有幽默感。"
  npc_override_lasagna_lasagna_npcs_get_now_if_your_first_06c2bf: "现在上船吧。如果是第一次，去见事务长，听取登船须知。"
  npc_override_lasagna_lasagna_npcs_get_rid_so_they_won_1b28f9: "消灭^0000cd大约 20 只^000000，它们就会因为害怕而不敢靠近。"
  npc_override_lasagna_lasagna_npcs_get_some_good_rest_come_d5c50c: "好好休息，明天再来。"
  npc_override_lasagna_lasagna_npcs_get_there_25e30f: "进去吧。"
  npc_override_lasagna_lasagna_npcs_get_up_7cdb34: "起来。"
  npc_override_lasagna_lasagna_npcs_giggles_we_should_see_ea_0a8350: "～咯咯笑～ 我们应该多见面！"
  npc_override_lasagna_lasagna_npcs_give_me_bite_77b7aa: "给我咬一口……"
  npc_override_lasagna_lasagna_npcs_give_me_one_even_one_d62821: "给我一个。哪怕其中一个都够我吃一整天了。"
  npc_override_lasagna_lasagna_npcs_give_vigilante_lunchbox_93dd58: "把便当给那个义警。我很好奇里面是什么。"
  npc_override_lasagna_lasagna_npcs_glass_before_sailing_out_de07a6: "出航前一杯，远航归来陆地上喝一杯，为每个远道而来参加烤箱决议的人喝一杯，为每个常客喝一杯，为每个因为别人喝而喝的人喝一杯……"
  npc_override_lasagna_lasagna_npcs_glass_kaluna_milk_please_724aec: "请来一杯卡鲁纳牛奶。"
  npc_override_lasagna_lasagna_npcs_glass_kaluna_milk_pub_af_b5edf1: "拿到薪水后去酒馆喝一杯卡鲁纳牛奶，是世界上最美妙的事。"
  npc_override_lasagna_lasagna_npcs_glossary_7427cf: "术语表"
  npc_override_lasagna_lasagna_npcs_go_ahead_deliver_head_ch_f1cd17: "去吧，把它送给主厨！"
  npc_override_lasagna_lasagna_npcs_go_ahead_get_rid_some_79c24a: "去吧，消灭一些^4d4dff蛋精^000000，好吗？^4d4dff三只^000000暂时就够了。"
  npc_override_lasagna_lasagna_npcs_go_ahead_report_chief_of_f51551: "去向首席官汇报吧。"
  npc_override_lasagna_lasagna_npcs_go_chance_win_cruise_tri_a7de33: "花三条鳀鱼的代价，赢取游轮之旅和年薪一亿的机会！机会青睐于不怀疑的人！"
  npc_override_lasagna_lasagna_npcs_go_collect_red_herb_entr_8babfc: "^4d4dff去村子入口处收集 1 个红色药草。^000000这应该是个不错的练习。"
  npc_override_lasagna_lasagna_npcs_go_find_legalas_find_out_fdfc2f: "去找莱加拉斯，查明发生了什么事。告诉他尽快送货。照这个速度，今天之后我们就要断货了。"
  npc_override_lasagna_lasagna_npcs_go_hunting_after_eating_780ab8: "吃了这个再去狩猎。你会惊讶于自己获得的新力量。"
  npc_override_lasagna_lasagna_npcs_go_learn_skill_if_you_85bf49: "如果你想使用仓库，就去学习这个技能。"
  npc_override_lasagna_lasagna_npcs_go_learn_skills_until_yo_828769: "去学习技能，直到达到使用仓库的等级。"
  npc_override_lasagna_lasagna_npcs_go_meet_old_lady_who_d11c64: "去见^0000cd那位曾经是烤箱酒馆老板的老太太^000000。她住在^0000cd冒险者俱乐部附近的一间小房子里^000000。"
  npc_override_lasagna_lasagna_npcs_go_meet_recorder_who_clo_a5fbf3: "去见离这里最近的记录员。他是个很有趣的人。和他聊天会很有趣。"
  npc_override_lasagna_lasagna_npcs_go_see_her_97037f: "去见她吧。"
  npc_override_lasagna_lasagna_npcs_go_see_old_lady_who_07fe9f: "去见那位曾是烤箱酒馆第一任老板的老太太。她一定就在附近的房子里。"
  npc_override_lasagna_lasagna_npcs_go_talk_chief_first_bd0551: "先去找团长谈谈。"
  npc_override_lasagna_lasagna_npcs_go_talk_jindou_fd173f: "去找金豆谈谈。"
  npc_override_lasagna_lasagna_npcs_go_teach_sweet_roda_frog_107a04: "去教训一下那边的甜罗达蛙，给我带来\\\\\\\\\\\\\\\"奢华布料\\\\\\\\\\\\\\\"。"
  npc_override_lasagna_lasagna_npcs_go_where_afbff8: "去哪里？"
  npc_override_lasagna_lasagna_npcs_going_adventure_new_worl_26c04f: "去新世界冒险也不错。要不是因为工作，我早就出发了。"
  npc_override_lasagna_lasagna_npcs_going_time_eat_soon_i_646681: "快到吃饭时间了。我得快点。"
  npc_override_lasagna_lasagna_npcs_going_work_let_s_forget_fd4238: "这样行不通。忘了看孩子的事吧。有什么你一直想做的事吗？"
  npc_override_lasagna_lasagna_npcs_gone_gone_meeow_ab7924: "消失！消失，喵！"
  npc_override_lasagna_lasagna_npcs_good_bdc919: "好。"
  npc_override_lasagna_lasagna_npcs_good_bye_45db79: "再见。"
  npc_override_lasagna_lasagna_npcs_good_consider_as_last_tr_7ad250: "好。就当是出航前的最后一次训练吧。"
  npc_override_lasagna_lasagna_npcs_good_food_raise_certain_025468: "好的食物可以^0000cd提升某项状态^000000并^0000cd恢复 HP^000000。没有理由不烹饪和享用。"
  npc_override_lasagna_lasagna_npcs_good_i_like_attitude_you_f39715: "好。我喜欢你这种不屈服于威胁的态度。我也是。嗯，我曾经也是。"
  npc_override_lasagna_lasagna_npcs_good_i_won_t_last_dca12e: "这不好……我撑不了多久？"
  npc_override_lasagna_lasagna_npcs_good_job_should_keep_the_d31012: "干得好。这下它们应该能安静一会儿了。我要去找我的宝藏，但得先睡一觉。今天忙了太久，我困了。"
  npc_override_lasagna_lasagna_npcs_good_job_today_as_well_1f1204: "今天也干得好。你们两个，去弄点吃的。冒险者，拿着这个。明天也拜托你了！"
  npc_override_lasagna_lasagna_npcs_good_job_while_three_you_093e72: "干得好。你们三个去洞穴的时候，莱加拉斯带着卡鲁纳来了。如果我们能每天保持这样，送货就完全没问题了。"
  npc_override_lasagna_lasagna_npcs_good_order_fish_cake_jus_2f3994: "好。刚好来了一个鱼糕订单。"
  npc_override_lasagna_lasagna_npcs_good_please_take_look_sh_b91981: "好。请看看这个架子。"
  npc_override_lasagna_lasagna_npcs_good_should_enough_keep_3324b2: "好！这应该足够让我在新世界不被冷落了。"
  npc_override_lasagna_lasagna_npcs_good_thinking_i_knew_you_2260d2: "好想法！我就知道你会这么做。你最好把不再需要的物品卖掉！"
  npc_override_lasagna_lasagna_npcs_good_weather_may_bothere_4df698: "好天气可能惹恼了它们。或者它们可能听到了笛子之类的曲调。"
  npc_override_lasagna_lasagna_npcs_good_work_crossing_over_c22e18: "翻过山来了，干得不错，新手。"
  npc_override_lasagna_lasagna_npcs_grandma_sad_hear_world_f_ac5b93: "奶奶听到会难过的。这个世界充满了存在但看不见的东西。比如说，就说说你的情况吧。"
  npc_override_lasagna_lasagna_npcs_grandpa_who_67dab1: "爷爷？谁？"
  npc_override_lasagna_lasagna_npcs_grass_fabre_leaf_lunatic_041f0a: "草精和叶精，各五只。这应该能吓跑附近的同类，让它们不敢靠近。"
  npc_override_lasagna_lasagna_npcs_grass_fabres_leaf_lunati_821999: "但草精和叶精正在啃食草地。"
  npc_override_lasagna_lasagna_npcs_great_attitude_now_legal_7eda12: "态度很好！现在莱加拉斯会……"
  npc_override_lasagna_lasagna_npcs_great_experience_me_a4b570: "这对我来说是一次很棒的经历。"
  npc_override_lasagna_lasagna_npcs_great_idea_meet_other_me_6e3ab3: "去见见其他船员会是个好主意。"
  npc_override_lasagna_lasagna_npcs_green_herbs_known_detoxi_1b9928: "^4d4dff绿色药草以解毒著称。^000000"
  npc_override_lasagna_lasagna_npcs_grew_up_gamberry_current_de5a77: "与甘贝里（现任孔-克利纳号船长）一起长大，是儿时玩伴。"
  npc_override_lasagna_lasagna_npcs_grow_you_until_you_don_8b6419: "它会随着你成长，直到你不再需要它的帮助。当你成为经验丰富的冒险者时，它会失去所有力量，变成一枚普通的草戒。"
  npc_override_lasagna_lasagna_npcs_growling_455917: "～低吼声～"
  npc_override_lasagna_lasagna_npcs_gulps_a1f826: "～咕噜～"
  npc_override_lasagna_lasagna_npcs_guy_over_there_f0028c: "是那边的那个家伙吗？"
  npc_override_lasagna_lasagna_npcs_guys_9c8520: "各位？"
  npc_override_lasagna_lasagna_npcs_guys_how_about_we_go_3c503b: "各位，我们去^0000cd烤箱酒馆^000000怎么样？"
  npc_override_lasagna_lasagna_npcs_guys_how_you_know_anchov_f13b1f: "各位……你们怎么能不知道鳀鱼是鱼呢？你们过的是什么日子啊？"
  npc_override_lasagna_lasagna_npcs_guys_there_s_something_i_17fea0: "各位，我有件事想和你们分享。"
  npc_override_lasagna_lasagna_npcs_ha_how_could_you_you_84c7b8: "哈！你怎么能这样？你真的照我说的全都做了？真是个傻瓜！你留胡子是为了装时尚吗，你这个白痴？你知道因为你我惹了多大的麻烦吗？我被骂了都是因为你！"
  npc_override_lasagna_lasagna_npcs_ha_huh_ha_i_wish_9cf370: "哈！哼！哈！我希望我能做到。但那两个猪头正在吞噬卡鲁尼亚克！一开始它们只吃一两个，但现在我一抓到它们就开始吃。我根本来不及清洗和发酵！"
  npc_override_lasagna_lasagna_npcs_ha_ppi_ness_456628: "哈——啤——内——斯——"
  npc_override_lasagna_lasagna_npcs_ha_so_seems_like_job_7b96ef: "哈……是这样吗？看来这工作也不适合你。那我们去找别的吧。还有其他你想尝试的工作吗？"
  npc_override_lasagna_lasagna_npcs_ha_yes_thank_you_cb46d7: "哈！是的。谢谢你。"
  npc_override_lasagna_lasagna_npcs_ha_you_pretty_good_how_8369cb: "哈。你相当不错。要不要退出冒险，来当我的学徒？我会对你好的。"
  npc_override_lasagna_lasagna_npcs_hah_i_feel_much_better_686040: "哈，我现在感觉好多了。我饿得差点要吃巴西利斯克了，你来得正是时候。我差点变成一只没能保持喵族身份而退化为动物的喵族。"
  npc_override_lasagna_lasagna_npcs_hang_let_me_check_if_2155b2: "等等。让我先检查一下你的装备是否齐全。"
  npc_override_lasagna_lasagna_npcs_hard_miss_you_tell_drago_3602c4: "很难错过。你看到就知道那是龙巢了。它位于高处，非常显眼……嗯，你一看就知道。"
  npc_override_lasagna_lasagna_npcs_haru_very_smart_girl_so_09fbdf: "哈鲁是个非常聪明的女孩，所以每个病人都会去找她。"
  npc_override_lasagna_lasagna_npcs_hasn_t_been_long_since_e228d1: "你才离开没多久。你已经拿到了吗？还是你忘了我要你找什么？"
  npc_override_lasagna_lasagna_npcs_hat_prepared_pepperoncin_400a3e: "这顶帽子是佩佩隆奇诺听完你的故事后准备的。一位喵族冒险者值得拥有一顶帽子。帽子会给你带来好运。"
  npc_override_lasagna_lasagna_npcs_hat_ring_20f5e8: "帽子和戒指？"
  npc_override_lasagna_lasagna_npcs_haven_t_you_left_midgard_0e4a32: "你还没出发去米德加尔特吗？"
  npc_override_lasagna_lasagna_npcs_having_decided_expand_th_be329f: "决定将势力范围扩展到海上后，甘贝里和托马斯集结了一支船队出航，但托马斯船长在风暴中失踪了。"
  npc_override_lasagna_lasagna_npcs_he_always_hear_answer_5a4e26: "他总是要听到答案吗？"
  npc_override_lasagna_lasagna_npcs_he_came_lasagna_grand_pl_42cbda: "他带着在鳀鱼捕捞船上发大财的宏图大志来到千层面，但因为晕船而放弃了。"
  npc_override_lasagna_lasagna_npcs_he_chief_peperoncino_bos_bc64ce: "他是佩佩隆奇诺团长，义警团的老大！"
  npc_override_lasagna_lasagna_npcs_he_could_table_c39463: "他可能在桌边。"
  npc_override_lasagna_lasagna_npcs_he_ended_up_working_anch_4128f3: "由于当时欠下的债务，他最终和佩佩隆奇诺一起在鳀鱼工坊工作。甘贝里的技能得到认可，成为了工坊经理。"
  npc_override_lasagna_lasagna_npcs_he_ended_up_working_anch_da6fc8: "由于当时欠下的债务，他最终和甘贝里一起在鳀鱼工坊工作。"
  npc_override_lasagna_lasagna_npcs_he_gone_i_guess_he_beba0f: "他走了吗？我想是的。那应该能让它们安静一会儿。一开始他说他是个新手冒险者，让我担心了一下，但他应该能处理好一只喵族的小事。"
  npc_override_lasagna_lasagna_npcs_he_just_baby_1700f0: "他只是个宝宝。"
  npc_override_lasagna_lasagna_npcs_he_just_make_things_wors_a75ba5: "他只会让事情变得更糟。"
  npc_override_lasagna_lasagna_npcs_he_ll_prove_i_right_ac2100: "他会证明我是对的。"
  npc_override_lasagna_lasagna_npcs_he_lost_his_mind_ad123f: "他失去理智了。"
  npc_override_lasagna_lasagna_npcs_he_met_gamberry_current_e4727d: "他在烤箱酒馆遇到了甘贝里（现任孔-克利纳号船长），因为如何喝卡鲁纳牛奶而产生分歧。"
  npc_override_lasagna_lasagna_npcs_he_met_peperoncino_curre_7e3799: "他在烤箱酒馆遇到了佩佩隆奇诺（现任法法尔义警团团长），因为如何喝卡鲁纳牛奶而产生分歧。"
  npc_override_lasagna_lasagna_npcs_he_might_tell_you_what_fece9b: "他可能会告诉你加入义警团的好处，所以去问问他吧。"
  npc_override_lasagna_lasagna_npcs_he_must_having_early_mea_3c4a5c: "他现在一定在新建的<NAVI>^4D4DFF[冒险者俱乐部]^000000<INFO>lasagna,56,186,000,1,</INFO></NAVI>吃早餐。往南门走就能到餐厅。"
  npc_override_lasagna_lasagna_npcs_he_probably_didn_t_hear_b9fc89: "他大概没听到。"
  npc_override_lasagna_lasagna_npcs_he_s_imoogi_somewhat_bas_5bcfd6: "他是^0000cd伊穆吉^000000，算得上是巴西利斯克的首领。但我不太清楚。他总在抱怨，如果不是^0000cd我父母的话，他早就升天了^000000。所以他总是放出巴西利斯克来骚扰我。"
  npc_override_lasagna_lasagna_npcs_he_s_making_something_mu_bcbc45: "（他一边嘟囔着，一边在做什么。）"
  npc_override_lasagna_lasagna_npcs_he_s_quite_skilled_catch_7f399e: "他非常擅长捕捉、清洗和发酵卡鲁尼亚克，千层面的卡鲁纳牛奶因此被誉为本地最好的。啊，这不是重点。"
  npc_override_lasagna_lasagna_npcs_he_s_recording_maniac_wh_06eca2: "他是个记录狂人，喜欢记录一切。"
  npc_override_lasagna_lasagna_npcs_he_s_young_foolish_lack_2b4051: "他年轻又愚蠢，缺乏见识。我是伊穆克。人们叫我^0000cd伊穆克大人^000000。"
  npc_override_lasagna_lasagna_npcs_he_should_adventurers_cl_b285a7: "他现在应该在冒险者俱乐部附近……"
  npc_override_lasagna_lasagna_npcs_he_should_counting_his_d_4ab39d: "他受了这么多苦，日子应该屈指可数了。"
  npc_override_lasagna_lasagna_npcs_he_so_smooth_asking_more_d23277: "他请求帮忙真是顺溜！"
  npc_override_lasagna_lasagna_npcs_he_sometimes_says_such_s_0b5935: "他有时会面无表情地说出如此血腥的话。"
  npc_override_lasagna_lasagna_npcs_he_sometimes_tells_stran_30cb92: "他有时会像讲冒险故事一样，对陌生人或新手^0000cd讲述他自己的故事以及千层面如何发展至今^000000。这次我想让你去听他说。"
  npc_override_lasagna_lasagna_npcs_head_out_east_town_ravio_455c0d: "从镇上向东出发，进入拉维奥利森林，继续向东走，直到找到巨大的带刺藤蔓。"
  npc_override_lasagna_lasagna_npcs_head_out_east_town_ravio_ea9f74: "从镇上向东出发，进入\\\\\\\\\\\\\\\"拉维奥利森林\\\\\\\\\\\\\\\"，继续向东走，直到找到巨大的带刺藤蔓。"
  npc_override_lasagna_lasagna_npcs_heading_midgard_s_my_fir_681873: "要去米德加尔特？这是我第一次来千层面，感觉太棒了！所以我决定就在这里定居了。我找到了住处，也签了合同！"
  npc_override_lasagna_lasagna_npcs_healer_haru_s_house_stra_f9a37c: "^4d4dff治疗师哈鲁的房子^000000就在^4d4dff东边^000000。"
  npc_override_lasagna_lasagna_npcs_healer_next_me_really_go_d22313: "我旁边的这位治疗师真的很厉害。你应该请她看看！"
  npc_override_lasagna_lasagna_npcs_healing_amount_minimal_f4b019: "治疗量可能很少……"
  npc_override_lasagna_lasagna_npcs_hello_9b56d5: "你好。"
  npc_override_lasagna_lasagna_npcs_hello_adventurer_4280fa: "你好，冒险者！"
  npc_override_lasagna_lasagna_npcs_hello_i_am_70e99b: "你好。我是"
  npc_override_lasagna_lasagna_npcs_hello_i_am_a9103b: "你好。我是 {0}。"
  npc_override_lasagna_lasagna_npcs_hello_i_am_adventurer_wh_431a4b: "你好。我是冒险者 {0}，乘孔-克利纳号出发去冒险。"
  npc_override_lasagna_lasagna_npcs_hello_i_am_looking_adven_121e5c: "你好，我是 {0}，来自新大陆寻找冒险。按照事务长的建议，我来打个招呼。"
  npc_override_lasagna_lasagna_npcs_hello_i_am_passenger_shi_833bdb: "你好。我是这艘船上的乘客。我想知道这艘船什么时候出发。"
  npc_override_lasagna_lasagna_npcs_hello_i_am_who_new_6ed613: "你好，我是 {0}，正在开始新的冒险。"
  npc_override_lasagna_lasagna_npcs_hello_i_am_who_new_eb2fa8: "你好，我是 {0}，这次是来开始新的冒险的。很高兴认识你。"
  npc_override_lasagna_lasagna_npcs_hello_you_person_who_s_47c222: "你好，你就是来帮助我们的人吗？那你可以开始了。"
  npc_override_lasagna_lasagna_npcs_helmsman_caught_tuna_fis_988c3d: "舵手钓鱼钓到了一条金枪鱼。厨师试图整条清蒸，但副厨师长勉强阻止了他，切成块分给了大家。我真希望能再吃一些。"
  npc_override_lasagna_lasagna_npcs_herb_effective_even_when_eff844: "^4d4dff这种药草直接食用也有效，但制成药水效果会更好。^000000"
  npc_override_lasagna_lasagna_npcs_herbs_growing_entrance_v_338476: "药草生长在村子入口处。你看到了吗？"
  npc_override_lasagna_lasagna_npcs_here_6d6da7: "这里……"
  npc_override_lasagna_lasagna_npcs_here_basil_basilrock_6c15f2: "这里是巴西尔和巴西尔岩石。"
  npc_override_lasagna_lasagna_npcs_here_con_chliina_only_sh_b2478d: "从这里出发，孔-克利纳号是唯一能到达米德加尔特的船。所以能上船的人只有孔-克利纳号的船员和义警团成员。"
  npc_override_lasagna_lasagna_npcs_here_jogi_bomber_lasagna_c9db90: "这是约吉，千层面的轰炸机！"
  npc_override_lasagna_lasagna_npcs_here_s_directions_read_c_bf5a7c: "这是说明书。要读取合成卷轴，"
  npc_override_lasagna_lasagna_npcs_here_shrimps_carrots_cat_210b9b: "这里有虾、胡萝卜和猫薄荷！"
  npc_override_lasagna_lasagna_npcs_here_stranger_new_place_a25bf7: "而在我面前的是一个来自新地方的陌生人。"
  npc_override_lasagna_lasagna_npcs_here_take_1bdbd6: "给，拿着这个。"
  npc_override_lasagna_lasagna_npcs_here_they_basilrocks_e67fb0: "它们在这里。巴西尔岩石。"
  npc_override_lasagna_lasagna_npcs_hey_adventurer_so_what_d_e02658: "嘿，冒险者，你怎么说？你不愿意处理那些狼，救救我们的鱼串吗？"
  npc_override_lasagna_lasagna_npcs_hey_adventurer_your_firs_fbde94: "嘿，冒险者！这是你的第一次航行吗？"
  npc_override_lasagna_lasagna_npcs_hey_buddy_08cbf4: "嘿，伙计！"
  npc_override_lasagna_lasagna_npcs_hey_buddy_machie_don_t_fa02f3: "嘿，伙计！马奇！别死在我面前！"
  npc_override_lasagna_lasagna_npcs_hey_cows_eat_lot_relax_908666: "嘿，奶牛们——多吃点多休息——我给你们唱首歌——"
  npc_override_lasagna_lasagna_npcs_hey_i_get_too_noisy_0925c0: "嘿，我明白了。那里太吵了。你现在可以走了。"
  npc_override_lasagna_lasagna_npcs_hey_if_you_give_me_83d4f3: "嘿，如果你给我 {0} {1}，我就帮你修好。"
  npc_override_lasagna_lasagna_npcs_hey_isn_t_box_i_2ade89: "嘿！这不是我让你送给哈鲁的箱子吗？"
  npc_override_lasagna_lasagna_npcs_hey_keep_talking_you_ll_79d1d8: "嘿！再说下去你会把好运说没的！"
  npc_override_lasagna_lasagna_npcs_hey_little_fellow_b18bbe: "嘿，小家伙！"
  npc_override_lasagna_lasagna_npcs_hey_machie_wake_up_what_48af39: "嘿！马奇！醒醒！怎么回事？哦，天哪……"
  npc_override_lasagna_lasagna_npcs_hey_machie_wake_up_what_70ef26: "嘿！马奇！醒醒！怎么回事？你不是说想把你家乡的母亲接来吗？你不能就这样死掉！"
  npc_override_lasagna_lasagna_npcs_hey_newbie_ask_purser_wh_6384d3: "嘿，新手！路上问一下事务长我们什么时候起航。我觉得出了什么问题，到现在还没有信号。"
  npc_override_lasagna_lasagna_npcs_hey_newbie_get_over_here_2a0ce0: "嘿，新手！过来这边！"
  npc_override_lasagna_lasagna_npcs_hey_s_no_577ba6: "嘿，不是那个……不……"
  npc_override_lasagna_lasagna_npcs_hey_there_get_over_here_22f93c: "嘿，那边！过来一下！"
  npc_override_lasagna_lasagna_npcs_hey_there_newbie_doram_t_398b52: "嘿，那边。新手喵族。跟我说说。"
  npc_override_lasagna_lasagna_npcs_hey_there_newcomer_5f918b: "嘿，那边。新来的。"
  npc_override_lasagna_lasagna_npcs_hey_what_you_think_789e85: "嘿，你觉得怎么样？"
  npc_override_lasagna_lasagna_npcs_hey_you_adventurer_52d595: "嘿，你，冒险者！"
  npc_override_lasagna_lasagna_npcs_hey_you_come_way_you_12688b: "嘿，你。过来这边。你真的因为我叫你这么做，就把它扔给副厨师长了？"
  npc_override_lasagna_lasagna_npcs_hey_you_keep_quiet_don_079d61: "嘿，你！安静点！别笑！"
  npc_override_lasagna_lasagna_npcs_hey_you_seem_suspicious_e39306: "嘿，你看起来很可疑。"
  npc_override_lasagna_lasagna_npcs_hey_you_two_over_there_090f18: "嘿，你们两个。坐过船吗？"
  npc_override_lasagna_lasagna_npcs_heya_b4a936: "嗨！"
  npc_override_lasagna_lasagna_npcs_highly_specialized_craft_58e853: "高度专精于制作药水。"
  npc_override_lasagna_lasagna_npcs_his_name_imoogi_i_don_7446ed: "他叫伊穆吉。我不知道他住在哪里，但那里有个^0000cd可以和他沟通的东西^000000。巴西利斯克每天早上都会去那里听些什么……"
  npc_override_lasagna_lasagna_npcs_his_parents_ran_butcher_e9ad13: "他的父母在千层面经营一家肉铺。"
  npc_override_lasagna_lasagna_npcs_hiss_4762c6: "嘶！！！！！！！！！！！"
  npc_override_lasagna_lasagna_npcs_hiss_9c008a: "嘶！！！"
  npc_override_lasagna_lasagna_npcs_hiss_d1b45d: "嘶！"
  npc_override_lasagna_lasagna_npcs_hissssssssss_30087c: "嘶嘶嘶嘶嘶嘶嘶！！！！！！！！！！！！！！"
  npc_override_lasagna_lasagna_npcs_hit_him_36d099: "打他。"
  npc_override_lasagna_lasagna_npcs_hit_him_f70c79: "打他。"
  npc_override_lasagna_lasagna_npcs_hiya_isn_t_delightful_se_b36e10: "嗨呀！在这里看到法法尔义警团不令人愉快吗？"
  npc_override_lasagna_lasagna_npcs_hmm_9c4d28: "嗯……"
  npc_override_lasagna_lasagna_npcs_hmm_hmm_hmm_ok_ff808a: "嗯……嗯……嗯！好吧！"
  npc_override_lasagna_lasagna_npcs_hmm_you_good_9f2e36: "嗯……你不错。"
  npc_override_lasagna_lasagna_npcs_hmm_you_look_energetic_d9c535: "嗯……你看起来很有精神。"
  npc_override_lasagna_lasagna_npcs_hmph_anyway_efforts_vigi_cbe08f: "哼！总之，在义警团和商人的努力下，千层面重生成为了现在的样子。"
  npc_override_lasagna_lasagna_npcs_hold_second_here_ca4fa2: "- 等一下！！ -"
  npc_override_lasagna_lasagna_npcs_holy_element_dark_elemen_170623: "圣属性和暗属性截然相反。"
  npc_override_lasagna_lasagna_npcs_holy_element_dark_elemen_2b542e: "圣属性和暗属性直接对立，你应该记住这一点。"
  npc_override_lasagna_lasagna_npcs_honest_before_i_came_her_d4e033: "说实话，在来之前，我以为鳀鱼是从土里挖出来的。不过我不觉得尴尬。"
  npc_override_lasagna_lasagna_npcs_honestly_i_surprised_too_c86534: "说实话，我也很惊讶。"
  npc_override_lasagna_lasagna_npcs_how_about_asking_captain_0a5fe0: "去问问纳维号的托马斯船长怎么样？"
  npc_override_lasagna_lasagna_npcs_how_about_head_chef_why_4cb087: "主厨呢？为什么副厨师长在掌管厨房？"
  npc_override_lasagna_lasagna_npcs_how_about_making_bet_me_d15f7d: "跟我打个赌怎么样？"
  npc_override_lasagna_lasagna_npcs_how_about_story_told_old_de72b9: "听听千层面最年长者的故事怎么样？"
  npc_override_lasagna_lasagna_npcs_how_am_i_supposed_talk_92c014: "我吃东西的时候怎么说话？"
  npc_override_lasagna_lasagna_npcs_how_come_we_don_t_4f3eb8: "为什么我们没有服务？！"
  npc_override_lasagna_lasagna_npcs_how_dare_you_treat_me_41f51b: "你竟敢把我当鬼魂对待！我已经活了^0000cd2500 年^000000！"
  npc_override_lasagna_lasagna_npcs_how_did_go_please_report_9cff42: "进行得怎么样？请向首席官斯特洛汇报。"
  npc_override_lasagna_lasagna_npcs_how_did_sous_chef_figure_7e63d0: "副厨师长是怎么发现的？"
  npc_override_lasagna_lasagna_npcs_how_did_you_get_here_ab08fc: "你到底是怎么到这里的？"
  npc_override_lasagna_lasagna_npcs_how_lasagna_old_days_cda890: "千层面的旧日时光是怎样的？"
  npc_override_lasagna_lasagna_npcs_how_lasagna_past_e74791: "千层面过去是怎样的？"
  npc_override_lasagna_lasagna_npcs_how_new_continent_should_d78390: "新大陆怎么样？我是不是该请假去冒险？"
  npc_override_lasagna_lasagna_npcs_how_someone_who_s_never_c7e9fd: "一个从未面对过巴西利斯克的人怎么能通过那个测试？"
  npc_override_lasagna_lasagna_npcs_how_stupid_i_told_you_15cde9: "真蠢……我告诉你要带^0000cd3^000000个。我说的是 3！你可以从^0000cd巴西利斯克^000000那里获得。我要告诉你多少遍？我觉得我说了大概 100 遍了！"
  npc_override_lasagna_lasagna_npcs_how_vigilance_corps_merc_2256fb: "义警团和商人们怎么样？"
  npc_override_lasagna_lasagna_npcs_how_you_even_think_about_e21c06: "你怎么能想到抢他的食物？再坚持一会儿。"
  npc_override_lasagna_lasagna_npcs_how_you_force_me_say_c87c03: "你怎么能强迫我说这种话？！你真是迟钝！去，走吧！"
  npc_override_lasagna_lasagna_npcs_how_you_hope_survive_new_f6d3c1: "带着这么软弱的心态，你怎么指望在新大陆生存？"
  npc_override_lasagna_lasagna_npcs_how_you_know_such_things_869a9b: "你怎么知道得这么详细？"
  npc_override_lasagna_lasagna_npcs_how_you_like_s_cool_cb7cb7: "你觉得怎么样？清凉、甘甜、就是好喝，对吧？"
  npc_override_lasagna_lasagna_npcs_how_you_think_stello_083ed8: "你觉得呢，斯特洛？"
  npc_override_lasagna_lasagna_npcs_however_he_very_good_mak_20c02b: "不过，他很擅长在短时间内做出足够多人吃的份量。这就是他成为主厨的原因。但当人们开始抱怨味道时，我被叫来了。"
  npc_override_lasagna_lasagna_npcs_however_i_cannot_let_rec_0e751e: "但是，我不能让记录就这样丢失。我该怎么办……"
  npc_override_lasagna_lasagna_npcs_however_i_really_am_hurr_a2e46f: "不过，我真的有急事。我应该等到雾散吗？"
  npc_override_lasagna_lasagna_npcs_however_if_you_change_yo_454604: "不过，如果你改变主意，随时可以回来。我会等你的。"
  npc_override_lasagna_lasagna_npcs_however_she_doesn_t_thin_a07021: "不过，她现在思维不清……我想也许正因为这样，她对过去的记忆更清晰了。就好像她活在过去一样。"
  npc_override_lasagna_lasagna_npcs_however_someone_damaged_2ec8d2: "不过，有人^0000cd损坏了这里的一份记录^000000。"
  npc_override_lasagna_lasagna_npcs_however_we_cannot_sail_o_ce0df2: "不过，我们现在还不能起航。"
  npc_override_lasagna_lasagna_npcs_however_you_shouldn_t_co_da0b47: "不过，你不该来找我。你应该去找^0000cd萨满喵^000000，询问今天的护符。"
  npc_override_lasagna_lasagna_npcs_huge_basilisk_appeared_h_c08c2f: "出现了一只巨大的巴西利斯克，他吓得伤了腿。其他义警带走了他，我相信他安全返回了。"
  npc_override_lasagna_lasagna_npcs_huh_73fef0: "嗯？"
  npc_override_lasagna_lasagna_npcs_huh_7c0f65: "....... 嗯……"
  npc_override_lasagna_lasagna_npcs_huh_aren_t_you_midgard_9b5543: "嗯？你不是来自米德加尔特吗？"
  npc_override_lasagna_lasagna_npcs_huh_case_which_i_need_9e6c5b: "哈！是需要我找到缺失页面的情况吗？你要找的\\\\\\\\\\\\\\\"新鲜视角\\\\\\\\\\\\\\\"的作用，是为调查提供新的见解来解决案件？"
  npc_override_lasagna_lasagna_npcs_huh_i_am_sorry_dd32c2: "哈！我很抱歉。"
  npc_override_lasagna_lasagna_npcs_huh_i_doubt_you_re_ab16a7: "嗯？我怀疑你不是远星来的。"
  npc_override_lasagna_lasagna_npcs_huh_where_you_think_you_a23722: "嗯？你以为你要去哪里？"
  npc_override_lasagna_lasagna_npcs_huh_you_just_passing_058208: "嗯？你只是路过吗？"
  npc_override_lasagna_lasagna_npcs_hum_fog_must_226841: "嗯……这雾一定是……"
  npc_override_lasagna_lasagna_npcs_hum_hum_i_thought_there_e78dbd: "嗯！嗯！我还以为附近没人呢。"
  npc_override_lasagna_lasagna_npcs_hum_let_s_stop_talking_967f70: "嗯，我们别谈这个了。那是很久以前的事了。"
  npc_override_lasagna_lasagna_npcs_hum_ok_please_go_see_8a0b43: "嗯……好吧。请去^0000cd见守卫村子南桥的义警^000000，查看龙的状态。"
  npc_override_lasagna_lasagna_npcs_hum_then_you_found_right_5e7132: "嗯！那你找对人了。对我来说，向冒险者讲述冒险故事又是一次冒险。你现在想听哪个故事？"
  npc_override_lasagna_lasagna_npcs_hum_there_many_kinds_foo_2fbe85: "嗯，食物有很多种。我们也会狩猎食材并进行烹饪。确实有很多种……"
  npc_override_lasagna_lasagna_npcs_hum_we_problem_be5e6d: "嗯，我们有个问题。"
  npc_override_lasagna_lasagna_npcs_human_wow_what_odd_looki_0906da: "人类？哇，长得真奇怪！"
  npc_override_lasagna_lasagna_npcs_humans_always_intrigue_m_1cf874: "人类总是以其奇特的外表引起我的兴趣。"
  npc_override_lasagna_lasagna_npcs_humans_say_their_weapons_9f1539: "人类说他们的武器通过精炼会变强。精炼到底是什么？"
  npc_override_lasagna_lasagna_npcs_hundreds_hamsters_runnin_a68050: "数百只仓鼠在这艘船底部的跑步机上奔跑。这片区域与发动机主体相连，所以船会向前移动。"
  npc_override_lasagna_lasagna_npcs_hunter_desert_wolves_qui_3441df: "沙漠之狼猎手现在安静下来了。它们一定被你的表现震慑住了。"
  npc_override_lasagna_lasagna_npcs_hurry_go_deliver_his_lun_352c92: "快，去给他送便当。他看起来快要饿死了。"
  npc_override_lasagna_lasagna_npcs_hurry_over_port_now_b5dd6a: "赶快去港口。"
  npc_override_lasagna_lasagna_npcs_hurt_lot_110ba3: "很疼吗？"
  npc_override_lasagna_lasagna_npcs_huu_15a00b: "呼……"
  npc_override_lasagna_lasagna_npcs_i_almost_got_hurt_please_4bafac: "我差点受伤。下次请小心。"
  npc_override_lasagna_lasagna_npcs_i_also_gave_you_new_549f97: "我还给了你^4d4dff一套新衣服^000000，你可以换掉脏衣服。"
  npc_override_lasagna_lasagna_npcs_i_am_captain_gamberi_cha_810c4a: "我是这艘船的船长^0000cd甘贝里^000000。欢迎登船。"
  npc_override_lasagna_lasagna_npcs_i_am_captain_gamberi_cha_a193e7: "我是这艘船的船长甘贝里。"
  npc_override_lasagna_lasagna_npcs_i_am_counting_you_then_03eb47: "那就拜托你了。"
  npc_override_lasagna_lasagna_npcs_i_am_excited_too_new_e9cb95: "我也很兴奋。新的食物。"
  npc_override_lasagna_lasagna_npcs_i_am_glad_experienced_ad_a197ba: "我很高兴有你这样经验丰富的冒险者来帮忙。去问问义警关于龙的状态。"
  npc_override_lasagna_lasagna_npcs_i_am_glad_you_working_ccb43b: "我很高兴你像一个成熟的喵族一样在工作。"
  npc_override_lasagna_lasagna_npcs_i_am_here_fulfil_my_7fcd11: "我来这里是为了履行^0000cd作为冒险者的职责^000000。"
  npc_override_lasagna_lasagna_npcs_i_am_hurry_e5c4b6: "我有急事。"
  npc_override_lasagna_lasagna_npcs_i_am_interested_story_ab_0b199d: "我对关于你的故事最感兴趣。"
  npc_override_lasagna_lasagna_npcs_i_am_lasagna_i_born_fac081: "我来自千层面。我出身于一个显赫的家庭和温和的父母。我成长为一个充满好奇心和冒险精神的孩子。"
  npc_override_lasagna_lasagna_npcs_i_am_pretty_sure_evil_1816f7: "我很确定是恶灵在跟你说话。"
  npc_override_lasagna_lasagna_npcs_i_am_sailor_sailors_real_26ff91: "我是水手中的水手。真正的海员。我是这艘船的水手长，负责管教粗鲁的水手和甲板上的所有事务。我要告诉你的故事……你不该告诉任何人。"
  npc_override_lasagna_lasagna_npcs_i_am_shameless_enough_ti_d10511: "我还没厚脸皮到把一个有如此潜力的年轻人束缚住。"
  npc_override_lasagna_lasagna_npcs_i_am_sorry_ask_you_ca9ee1: "很抱歉又要麻烦你。"
  npc_override_lasagna_lasagna_npcs_i_am_sorry_send_you_3492d0: "很抱歉让你一个人去！"
  npc_override_lasagna_lasagna_npcs_i_ascend_heaven_training_4a8e66: "我可以^0000cd通过修行 1000 年并成为龙来升天^000000。但那个小家伙的^0000cd父母^000000在过去两次抢走了^0000cd如意珠^000000并先行升天了。"
  npc_override_lasagna_lasagna_npcs_i_ask_favor_again_next_2d652a: "下次还能再请你帮忙吗？我每天都需要新鲜的。"
  npc_override_lasagna_lasagna_npcs_i_ask_newcomers_about_fu_c15beb: "我问过新来的人关于富西利的事，但没人知道。那一定是个偏远的地方。"
  npc_override_lasagna_lasagna_npcs_i_asked_find_some_basils_33097a: "我被要求找一些巴西尔。我听说可以从巴西利斯克那里找到，所以我大老远跑来抓它们。我想这一定激怒了它们。"
  npc_override_lasagna_lasagna_npcs_i_asked_five_sticky_webf_80cadf: "我要五个粘性蛙蹼，但我还需要更多。我一个人没时间收集。"
  npc_override_lasagna_lasagna_npcs_i_assist_those_who_finis_7f140c: "我协助那些完成法法尔义警团训练的人登上孔-克利纳号。"
  npc_override_lasagna_lasagna_npcs_i_been_everywhere_one_da_79aa71: "我去过很多地方。有一天，我找到了它。"
  npc_override_lasagna_lasagna_npcs_i_been_suffering_superna_d59a5c: "从那以后，我一直受到^0000cd超自然现象^000000的困扰。"
  npc_override_lasagna_lasagna_npcs_i_beg_you_i_m_940ce7: "我求你了。我真的好担心。这几天都睡不着觉。"
  npc_override_lasagna_lasagna_npcs_i_beg_you_please_02bcc6: "我求你了，拜托。"
  npc_override_lasagna_lasagna_npcs_i_beg_you_please_catch_bc8b9d: "我求你了。请抓罗达蛙，给我带五个粘性蛙蹼！没有它们，我做不了布丁！"
  npc_override_lasagna_lasagna_npcs_i_believe_people_new_con_5fbdfb: "我相信新大陆的人们吃的食物和我们不同。新大陆的人们觉得什么好吃呢？"
  npc_override_lasagna_lasagna_npcs_i_believe_should_basic_l_465085: "我相信对人类来说应该是^4d4dff基础等级 6^000000。"
  npc_override_lasagna_lasagna_npcs_i_believe_you_very_well_ea5b1e: "我相信你即使在新地方也能做得很好。"
  npc_override_lasagna_lasagna_npcs_i_broke_all_dishes_so_d91f2c: "但我把所有盘子都打碎了，所以一个都没有了。"
  npc_override_lasagna_lasagna_npcs_i_brought_some_snacks_yo_5c6407: "我给你带了些零食。"
  npc_override_lasagna_lasagna_npcs_i_came_up_items_sold_ebfe37: "我想出了一些可以在新世界和远星之间出售的物品。我对他们口味的差异感到惊讶。听到伊格德拉希尔果实的价格时真的很惊讶。"
  npc_override_lasagna_lasagna_npcs_i_cannot_believe_how_pre_5131b3: "我真不敢相信我们的船长和团长有多装腔作势！"
  npc_override_lasagna_lasagna_npcs_i_cannot_trust_anyone_bdf1cd: "我不能相信任何人。"
  npc_override_lasagna_lasagna_npcs_i_corrected_those_bad_do_f00c97: "我改造了那些坏喵族，组建了商人和义警团从事^0000cd贸易^000000。生意兴隆，附近所有城市都充斥了千层面的商品。"
  npc_override_lasagna_lasagna_npcs_i_could_been_dead_if_02b72e: "要不是我的演技，我早就死了。"
  npc_override_lasagna_lasagna_npcs_i_d_better_make_multiple_c2f74b: "我最好多做几份副本，到处藏起来。"
  npc_override_lasagna_lasagna_npcs_i_d_like_explore_new_b1cfb9: "等我有天能下船了，我想去探索新大陆。"
  npc_override_lasagna_lasagna_npcs_i_d_like_go_out_0db510: "我想出去尝尝每道菜。但如果我这么做了，这艘船的船员们就要饿死了。"
  npc_override_lasagna_lasagna_npcs_i_d_like_hear_about_ccaa5b: "我想有机会听听冒险故事。"
  npc_override_lasagna_lasagna_npcs_i_d_like_hear_too_ef624e: "我也想听。"
  npc_override_lasagna_lasagna_npcs_i_d_like_hear_your_fcc92e: "我想哪天听听你来自新大陆的冒险故事。冒险途中时不时来看我。"
  npc_override_lasagna_lasagna_npcs_i_d_like_know_how_32ebc5: "我想知道它们是怎么做的。请给我带一些。^0000cd5 个猫粮硬饼和 5 个马兰多罐头食品^000000就行。"
  npc_override_lasagna_lasagna_npcs_i_d_like_know_how_9b89fa: "我想知道它是怎么做的。请给我带一些。^0000cd20 个包子^000000就行。"
  npc_override_lasagna_lasagna_npcs_i_d_rather_picky_young_88276f: "我不想对渴望冒险的年轻人太挑剔，所以这应该够了。"
  npc_override_lasagna_lasagna_npcs_i_d_rather_spend_rest_6ac25b: "我宁愿在战斗中度过余生，也不愿与鬼魂为伴！"
  npc_override_lasagna_lasagna_npcs_i_did_i_couldn_t_d95d7e: "我做了。但我没办法。"
  npc_override_lasagna_lasagna_npcs_i_didn_t_mind_stuff_1da5cc: "我不介意主厨做的东西。"
  npc_override_lasagna_lasagna_npcs_i_didn_t_want_ask_168c3c: "我不想找那个瞌睡虫帮忙，但他是唯一有空的人。"
  npc_override_lasagna_lasagna_npcs_i_don_t_experienced_so_e97770: "我不会为有经验的人这么做。所以你最好事先弄清楚自己的状态。"
  npc_override_lasagna_lasagna_npcs_i_don_t_just_make_2dcbc5: "我不只是制作新记录。我也尽力保存好现有记录。"
  npc_override_lasagna_lasagna_npcs_i_don_t_know_much_03751e: "我对航海了解不多，但那些听起来和船都没关系。"
  npc_override_lasagna_lasagna_npcs_i_don_t_know_perhaps_ceef38: "我不知道。大概 200 年左右？"
  npc_override_lasagna_lasagna_npcs_i_don_t_know_what_212321: "我不知道刚才发生了什么，但能回去我很高兴。"
  npc_override_lasagna_lasagna_npcs_i_don_t_know_what_87a925: "我不知道你在说什么。请解释一下。"
  npc_override_lasagna_lasagna_npcs_i_don_t_know_what_888d8f: "我不知道你在说什么。"
  npc_override_lasagna_lasagna_npcs_i_don_t_know_where_66d1b9: "我不知道我的良心在哪。"
  npc_override_lasagna_lasagna_npcs_i_don_t_know_who_c4c7d7: "我不知道他是谁。"
  npc_override_lasagna_lasagna_npcs_i_don_t_know_why_9b685d: "我不知道为什么，但我不喜欢这种感觉。"
  npc_override_lasagna_lasagna_npcs_i_don_t_mean_i_fbd86a: "我不是说……我不是说……那个……"
  npc_override_lasagna_lasagna_npcs_i_don_t_really_know_4cf914: "我自己也不太清楚！"
  npc_override_lasagna_lasagna_npcs_i_don_t_see_anything_7b644e: "我什么都看不见。"
  npc_override_lasagna_lasagna_npcs_i_don_t_see_near_928f9a: "我在附近没看到。我们应该往深处走！"
  npc_override_lasagna_lasagna_npcs_i_don_t_think_i_466379: "我觉得我爬不起来了。"
  npc_override_lasagna_lasagna_npcs_i_don_t_think_i_4db9c8: "我想我再也不能吃鳀鱼了。刚才我们四目相对。以后每次看到鳀鱼，它们都会跟着我。"
  npc_override_lasagna_lasagna_npcs_i_don_t_want_anymore_9a34fa: "我不想再干了。"
  npc_override_lasagna_lasagna_npcs_i_don_t_want_even_c3bf93: "我现在连一口都不想吃了。"
  npc_override_lasagna_lasagna_npcs_i_farewell_then_b84523: "我会的。那就再会了。"
  npc_override_lasagna_lasagna_npcs_i_feed_them_my_grandchil_f1a0c6: "我可以把它们喂给我的孙子们。"
  npc_override_lasagna_lasagna_npcs_i_feel_challenged_whenev_53970c: "每当我遇到像你这样能干的喵族时，我都会感到挑战。"
  npc_override_lasagna_lasagna_npcs_i_feeling_i_ll_see_5541f3: "我感觉我们会常见面。"
  npc_override_lasagna_lasagna_npcs_i_gave_you_red_herbs_82b607: "我给了你红色药草和苹果。"
  npc_override_lasagna_lasagna_npcs_i_get_startled_each_time_3e5624: "每次有邮件来我都被吓一跳……"
  npc_override_lasagna_lasagna_npcs_i_get_what_you_re_15d745: "我明白你的意思。"
  npc_override_lasagna_lasagna_npcs_i_get_you_re_new_89822d: "我明白了！你是新大陆来的，对吧？"
  npc_override_lasagna_lasagna_npcs_i_grew_up_sheltered_48bbc8: "我是在庇护下长大的。"
  npc_override_lasagna_lasagna_npcs_i_guess_everyone_what_ta_bdb79e: "我想不是每个人都有资格成为孔-克利纳号的水手长。他是怎么活到现在的？"
  npc_override_lasagna_lasagna_npcs_i_guess_i_may_caused_06142f: "我想可能是我引起的。"
  npc_override_lasagna_lasagna_npcs_i_guess_i_should_go_6e3d6e: "……我想我该走了。该死。"
  npc_override_lasagna_lasagna_npcs_i_guess_so_adventurer_su_96ff54: "我想也是。这位冒险者看起来确实很厉害。"
  npc_override_lasagna_lasagna_npcs_i_guess_something_may_ca_a0cadc: "我想可能是有什么东西引起了骚动。"
  npc_override_lasagna_lasagna_npcs_i_guess_sticks_make_dora_f6abd5: "我想棍棒确实能造就喵族。那两人把那些混混送去了商人和义警团。嗯……我记得那些小子。他们的胡子被剪了，尾巴也被扯得破烂不堪。"
  npc_override_lasagna_lasagna_npcs_i_guess_there_no_choice_0d49d8: "看来我别无选择了。我应该去那里。"
  npc_override_lasagna_lasagna_npcs_i_guess_there_s_no_d8e29f: "我想也没办法了。"
  npc_override_lasagna_lasagna_npcs_i_guess_we_wouldn_t_b96c88: "我想我们因为雾没法出发了。"
  npc_override_lasagna_lasagna_npcs_i_guess_you_must_heard_d19435: "我想你这次一定听到了真实的故事。"
  npc_override_lasagna_lasagna_npcs_i_guess_you_re_right_9d93ad: "我想你说得对。我不能永远等下去，所以我应该去处理那些巴西利斯克。我要处理多少只？"
  npc_override_lasagna_lasagna_npcs_i_guess_you_read_quite_4e97ad: "我想你读过不少冒险小说吧，亲爱的冒险者。"
  npc_override_lasagna_lasagna_npcs_i_had_strange_dream_2dce65: "我做了一个奇怪的梦。"
  npc_override_lasagna_lasagna_npcs_i_handed_over_boatswain_fbac2e: "我已经交给它了。水手长想知道^0000cd起航信号^000000什么时候发出。"
  npc_override_lasagna_lasagna_npcs_i_happen_cookbook_new_co_0dc50e: "我正好有一本^0000cd新大陆食谱^000000。你现在有做菜用的食材吗？"
  npc_override_lasagna_lasagna_npcs_i_hear_story_912ea1: "我来听听这个故事。"
  npc_override_lasagna_lasagna_npcs_i_heard_boatswain_had_vi_83bc7f: "我听说水手长过去曾和甘贝里船长一起拜访过前任萨满喵。但他听到一半就气冲冲地走了，再也没回来。"
  npc_override_lasagna_lasagna_npcs_i_heard_honey_collect_ne_cdb820: "我听说采蜜人需要帮助，所以你应该去见^4D4DFF[弗洛林]^000000。感谢你的帮助。"
  npc_override_lasagna_lasagna_npcs_i_heard_i_sleep_lot_e93383: "我听说多睡觉才能长得快。"
  npc_override_lasagna_lasagna_npcs_i_heard_igdrasil_rare_ne_034fce: "我听说伊格德拉希尔在新世界很稀有，因为那里没有。所以我打算试着在那里卖。"
  npc_override_lasagna_lasagna_npcs_i_heard_outsider_had_bee_a67880: "我听说^0000cd有个外乡人在招惹巴西利斯克^000000。"
  npc_override_lasagna_lasagna_npcs_i_heard_prok_needs_some_c47857: "我听说普罗克现在需要一些帮助。你不如去见^4D4DFF[普罗克]^000000？感谢你的帮助。"
  npc_override_lasagna_lasagna_npcs_i_heard_started_little_s_6197db: "但我听说它是由三位领袖凑出的一小笔资金起家的，现在已发展成为一个庞大的组织，贡献了这个城镇的大部分收入。"
  npc_override_lasagna_lasagna_npcs_i_heard_story_captain_ga_a17ad1: "我听了甘贝里船长的故事，但我很困惑。"
  npc_override_lasagna_lasagna_npcs_i_heard_story_s_why_4e2e0c: "我听过那个故事。所以你才会被称为疯……"
  npc_override_lasagna_lasagna_npcs_i_heard_there_illegal_an_1e5b13: "我听说最近有非法鳀鱼船在诱骗人们上船。真是个可怕的世界。义警们睁大眼睛在抓捕他们。"
  npc_override_lasagna_lasagna_npcs_i_heard_there_someone_wh_bc8f5e: "我听说新大陆的皇宫里有人教烹饪。去看看应该不错。"
  npc_override_lasagna_lasagna_npcs_i_heard_we_couldn_t_0ffd4c: "我听说我们因为雾没法出发。我来检查洞穴里龙的状态。"
  npc_override_lasagna_lasagna_npcs_i_heard_you_guys_fought_9c513b: "我听说你们打架了。"
  npc_override_lasagna_lasagna_npcs_i_heard_you_re_boarding_2858fb: "我听说你要上船了。你不该快点吗？"
  npc_override_lasagna_lasagna_npcs_i_here_desperately_fight_0c7b51: "我在这里，拼命抵抗着阳光，等着有人路过喵。"
  npc_override_lasagna_lasagna_npcs_i_hope_i_listen_your_03178f: "我希望有一天能听你讲故事。"
  npc_override_lasagna_lasagna_npcs_i_hope_you_help_me_308d5e: "我希望你明天也能帮我！"
  npc_override_lasagna_lasagna_npcs_i_how_long_take_7aed95: "我会的。需要多长时间？"
  npc_override_lasagna_lasagna_npcs_i_hunch_i_leave_place_cbb469: "我有预感现在该离开这里了。"
  npc_override_lasagna_lasagna_npcs_i_hungry_i_t_eat_d5f98f: "我饿了。我再也不能吃鳀鱼了。我现在只能吃卡鲁尼亚克。"
  npc_override_lasagna_lasagna_npcs_i_i_don_t_mean_2eb5af: "我——我不是说我不喜欢奶奶。是是是。我会小心的。"
  npc_override_lasagna_lasagna_npcs_i_interested_fishing_ind_a1929f: "我对渔业感兴趣，就和佩佩隆奇诺一起进入了^0000cd鳀鱼加工^000000行业。我们赚了一笔钱。我们在想怎么处理那么多钱……"
  npc_override_lasagna_lasagna_npcs_i_just_need_my_belly_a5a82e: "我只需要填饱肚子。"
  npc_override_lasagna_lasagna_npcs_i_just_trying_hang_out_32e4bd: "我只是想溜达一会儿，结果摔倒了！"
  npc_override_lasagna_lasagna_npcs_i_knew_5eb1b1: "我就知道！"
  npc_override_lasagna_lasagna_npcs_i_knew_going_happen_agai_7342df: "……我就知道这事会再次发生。更糟的是，这次肯定需要更多时间来修复！"
  npc_override_lasagna_lasagna_npcs_i_knew_he_come_again_2db50e: "我就知道他会再来。他一定听说我正在重编记录。我想他会再次回来销毁它。我想我应该更加小心，不要弄丢它。"
  npc_override_lasagna_lasagna_npcs_i_know_i_searched_into_47b2d9: "我知道。我检查了你的背包太多次了。抱歉……"
