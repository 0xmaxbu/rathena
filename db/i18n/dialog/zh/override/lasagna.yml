  npc_override_lasagna_lasagna_npcs_take_look_those_desert_w_c49d8e: "Take a look at those Desert Wolves. What do you think?"
  npc_override_lasagna_lasagna_npcs_take_them_back_you_worki_f2be80: "Take them back with you. Working on a ship doesn't require high intelligence, but these idiots probably can't even pull off a cleaning job. No, forget cleaning. I'll be lucky if they don't drive me crazy first."
  npc_override_lasagna_lasagna_npcs_take_your_filthy_hand_of_dcf037: "Take your filthy hand off from her! [Woncow] is sensitive, so no one besides me can touch her!"
