  npc_override_lasagna_lasagna_npcs_blah_no_luck_here_4025dc: "Blah! No luck here!"
  npc_override_lasagna_lasagna_npcs_blue_herbs_restore_sp_ca9d8b: "^4d4dff Blue Herbs restore SP^000000."
  npc_override_lasagna_lasagna_npcs_boatswain_acting_strange_bf1602: "Boatswain is acting strangely. We barely stopped him from trying to jump into water in the middle of a night. He seems to have lost it when I see him shivering all over, but then he's fine the next morning. He's bewitched or something."
  npc_override_lasagna_lasagna_npcs_boatswain_con_chliina_do_cfd370: "The Boatswain of Con-Chliina doesn't lie. If you don't trust me, you should trust Gamberi who has hired me as the Boatswain of Con-Chliina."
  npc_override_lasagna_lasagna_npcs_boatswain_kind_sleazy_437993: "The Boatswain is kind of sleazy."
  npc_override_lasagna_lasagna_npcs_boatswain_must_ve_sent_y_86634f: "The boatswain must've sent you. I'll tell you about the talisman that'll help you get through today safely."
  npc_override_lasagna_lasagna_npcs_boatswain_t_leave_her_si_970862: "The boatswain can't leave her side for a second because she's his goddess of fortune. Lucky for us, we can have kaluna milk every day."
  npc_override_lasagna_lasagna_npcs_boatswain_tried_throw_ou_2bcf8e: "Boatswain tried to throw out the remaining tuna and got caught by the sous chef. We all learned how scary he can be."
  npc_override_lasagna_lasagna_npcs_born_as_tomei_thomas_sho_9be8da: "Born as Tomei Thomas but shortened to Thomas."
  npc_override_lasagna_lasagna_npcs_boss_three_glasses_kalun_e2b733: "Boss! Three glasses of kaluna milk shaken hard, please! And egg yolk on top!"
  npc_override_lasagna_lasagna_npcs_both_totally_fine_return_79db18: "Both will be totally fine and return to us soon. So quit it! Did you really have to make him cry, huh?!"
