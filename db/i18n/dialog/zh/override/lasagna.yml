  npc_override_lasagna_lasagna_npcs_menu_vigilante_0b9851: "义警向导:欢迎来到港口城镇千层面。"
  npc_override_lasagna_lasagna_npcs_menu_vigilante_48f119: "义警向导:如果你需要帮助，请随时造访义警团。"
  npc_override_lasagna_lasagna_npcs_menu_years_a6ea1f: "3 年前:决定起航"
  npc_override_lasagna_lasagna_npcs_meow_hey_new_friend_i_ef2d22: "喵！嘿，新朋友！我有个故事要告诉你。你可不想错过！"
  npc_override_lasagna_lasagna_npcs_meow_meow_17cce8: "喵喵。"
  npc_override_lasagna_lasagna_npcs_meow_meow_a4da0c: "喵喵"
  npc_override_lasagna_lasagna_npcs_meow_meow_meow_meow_meow_50e5bb: "喵喵喵喵喵喵！！！"
  npc_override_lasagna_lasagna_npcs_midgard_been_discovered_c2da02: "米德加尔特已经被发现了，所以我想知道是否还有其他地方。那些我们从未去过、地图上也没有的地方。"
  npc_override_lasagna_lasagna_npcs_minute_i_catch_kalunyak_631c34: "我一抓到卡鲁尼亚克，你们两个就吞了它！你连我清洗过的也吃了！"
  npc_override_lasagna_lasagna_npcs_minute_i_landed_new_worl_0d6949: "我一踏上新世界，就立刻回到了船上。只是太喜欢那里的食物了……"
  npc_override_lasagna_lasagna_npcs_minute_i_saw_guide_new_ff7e8e: "我一在《新世界冒险者指南》上看到它，就发誓一定要去！我听说那里的风景很美！"
  npc_override_lasagna_lasagna_npcs_mix_moderate_temperate_g_9e5f9e: "将其以适中的温度混合，用醋栗装饰。然后你就得到了人人都爱的卡鲁纳牛奶。"
  npc_override_lasagna_lasagna_npcs_mixed_stew_b775e1: "杂烩炖菜"
  npc_override_lasagna_lasagna_npcs_mixed_stew_enhances_vit_020beb: "^0000cd杂烩炖菜^000000。它提升^0000cd体质^000000。它很管饱，所以即使被怪物击中也不会有太多痛感。"
  npc_override_lasagna_lasagna_npcs_mixing_usually_done_stir_3d36dc: "混合通常采用搅拌或摇晃的方式，但这两种方法之间有无休止的争论。"
  npc_override_lasagna_lasagna_npcs_mm_good_area_settled_now_5981ad: "嗯……好。这片区域搞定了。你真的很擅长这个。"
  npc_override_lasagna_lasagna_npcs_mm_i_understand_so_you_a61ec3: "嗯……我明白了。所以你拿不到那颗如意珠就决不罢休。我去向塔尔图菲打听如意珠的事。"
  npc_override_lasagna_lasagna_npcs_mom_dad_i_miss_you_421a22: "妈妈，爸爸……我想你们。"
