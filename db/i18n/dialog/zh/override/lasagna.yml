  npc_override_lasagna_lasagna_npcs_pweep_peep_peep_pweep_bb708a: "Pweep-peep-peep-pweep"
  npc_override_lasagna_lasagna_npcs_pweep_pweep_pweep_peep_b6db8a: "Pweep-pweep-pweep-peep"
  npc_override_lasagna_lasagna_npcs_quickest_way_boost_atk_b_ca90c5: "^4d4dffThe quickest way to boost ATK is to boost STR^000000!"
  npc_override_lasagna_lasagna_npcs_quiet_just_speak_up_34843a: "Be quiet. Just speak up."
  npc_override_lasagna_lasagna_npcs_quite_there_dragon_livin_7549a7: "Not quite. There is a dragon living in a nearby cave. The dragon breathes fire which burns up everything around it. The fog is made of the smoke."
  npc_override_lasagna_lasagna_npcs_ranged_physical_atk_mhp_d23fab: "Ranged physical ATK +5%, MHP + 200."
  npc_override_lasagna_lasagna_npcs_rate_i_won_t_enough_6f7df4: "At this rate, I won't have enough honey and won't be able to make kaluna milk. If people can't drink kaluna milk, then there will be a riot and..."
  npc_override_lasagna_lasagna_npcs_rather_than_working_side_340c21: "But rather than working on this side, I think you should seek out for an adventure."
