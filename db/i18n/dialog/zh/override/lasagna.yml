  npc_override_lasagna_lasagna_npcs_hey_little_fellow_b18bbe: "Hey, little fellow!"
  npc_override_lasagna_lasagna_npcs_hey_machie_wake_up_what_48af39: "Hey! Machie! Wake up! What's going on? Oh, my..."
  npc_override_lasagna_lasagna_npcs_hey_machie_wake_up_what_70ef26: "Hey! Machie! Wake up! What's going on? didn't you say that you would like to bring your mother from your hometown? You cannot die like this!"
  npc_override_lasagna_lasagna_npcs_hey_newbie_ask_purser_wh_6384d3: "Hey newbie! Ask the Purser when we will be sailing off on your way. I think something has gone wrong since there is no sign so far."
  npc_override_lasagna_lasagna_npcs_hey_newbie_get_over_here_2a0ce0: "Hey, newbie! Get over here!"
  npc_override_lasagna_lasagna_npcs_hey_s_no_577ba6: "Hey, That's not it... No..."
  npc_override_lasagna_lasagna_npcs_hey_there_get_over_here_22f93c: "Hey, there! Get over here for a minute!"
  npc_override_lasagna_lasagna_npcs_hey_there_newbie_doram_t_398b52: "Hey, there. Newbie Doram. Talk to me."
  npc_override_lasagna_lasagna_npcs_hey_there_newcomer_5f918b: "Hey, there. Newcomer."
  npc_override_lasagna_lasagna_npcs_hey_what_you_think_789e85: "Hey, what do you think?"
  npc_override_lasagna_lasagna_npcs_hey_you_adventurer_52d595: "Hey you, adventurer!"
  npc_override_lasagna_lasagna_npcs_hey_you_come_way_you_12688b: "Hey, you. Come this way. Have you really thrown it to the Sous Chef because I told you so?"
  npc_override_lasagna_lasagna_npcs_hey_you_keep_quiet_don_079d61: "Hey, you! Keep quiet! don't laugh!"
  npc_override_lasagna_lasagna_npcs_hey_you_seem_suspicious_e39306: "Hey, you seem suspicious."
  npc_override_lasagna_lasagna_npcs_hey_you_two_over_there_090f18: "Hey, you two over there. Have you ever been on a ship?"
  npc_override_lasagna_lasagna_npcs_heya_b4a936: "Heya!"
  npc_override_lasagna_lasagna_npcs_highly_specialized_craft_58e853: "are highly specialized in crafting potions."
  npc_override_lasagna_lasagna_npcs_his_name_imoogi_i_don_7446ed: "His name is Imoogi. I don't know where he lives, but there's something ^0000cdup there that can communicate with Imoogi^000000. Basilisks go there every morning and hear something..."
  npc_override_lasagna_lasagna_npcs_his_parents_ran_butcher_e9ad13: "His parents ran a butcher's shop in Lasagna."
  npc_override_lasagna_lasagna_npcs_hiss_4762c6: "Hiss!!!!!!!!!!!!!!!"
  npc_override_lasagna_lasagna_npcs_hiss_9c008a: "Hiss!!!"
  npc_override_lasagna_lasagna_npcs_hiss_d1b45d: "Hiss!"
  npc_override_lasagna_lasagna_npcs_hissssssssss_30087c: "HISSSSSSSSSS!!!!!!!!!!!!!!!!!"
  npc_override_lasagna_lasagna_npcs_hit_him_36d099: "To hit him."
  npc_override_lasagna_lasagna_npcs_hit_him_f70c79: "to hit him."
  npc_override_lasagna_lasagna_npcs_hiya_isn_t_delightful_se_b36e10: "Hiya! Isn't it delightful to see the Farfalle Vigilante even here?"
  npc_override_lasagna_lasagna_npcs_hmm_9c4d28: "Hmm..."
  npc_override_lasagna_lasagna_npcs_hmm_hmm_hmm_ok_ff808a: "Hmm... Hmm... Hmm! OK!"
  npc_override_lasagna_lasagna_npcs_hmm_you_good_9f2e36: "Hmm...You are good."
  npc_override_lasagna_lasagna_npcs_hmm_you_look_energetic_d9c535: "Hmm...You look energetic."
  npc_override_lasagna_lasagna_npcs_hmph_anyway_efforts_vigi_cbe08f: "Hmph! Anyway, with the efforts of vigilance corps and merchants, Lasagna was reborn to its current state."
  npc_override_lasagna_lasagna_npcs_hold_second_here_ca4fa2: "- Hold on a second here!! -"
  npc_override_lasagna_lasagna_npcs_holy_element_dark_elemen_170623: "Holy element and Dark element are in stark contrast to each other."
  npc_override_lasagna_lasagna_npcs_holy_element_dark_elemen_2b542e: "Holy element and Dark element directly oppose each other, and you should keep that in mind."
  npc_override_lasagna_lasagna_npcs_honest_before_i_came_her_d4e033: "To be honest, before I came here, I thought the anchovies were dug from the ground. But I'm not embarrassed though."
  npc_override_lasagna_lasagna_npcs_honestly_i_surprised_too_c86534: "Honestly, I was surprised, too."
  npc_override_lasagna_lasagna_npcs_how_about_asking_captain_0a5fe0: "How about asking Captain Thomas of Navi?"
  npc_override_lasagna_lasagna_npcs_how_about_head_chef_why_4cb087: "How about the Head Chef? Why is the Sous Chef in charge of the kitchen?"
  npc_override_lasagna_lasagna_npcs_how_about_making_bet_me_d15f7d: "How about making a bet with me?"
  npc_override_lasagna_lasagna_npcs_how_about_story_told_old_de72b9: "How about the story told by the oldest person in Lasagna?"
  npc_override_lasagna_lasagna_npcs_how_am_i_supposed_talk_92c014: "How am I supposed to talk when I'm eating?"
  npc_override_lasagna_lasagna_npcs_how_come_we_don_t_4f3eb8: "How come we don't get any service?!"
  npc_override_lasagna_lasagna_npcs_how_dare_you_treat_me_41f51b: "How dare you treat me like a ghost! I have lived for ^0000cd2,500 years^000000!"
  npc_override_lasagna_lasagna_npcs_how_did_go_please_report_9cff42: "How did it go? Please report to Chief Officer Stello."
  npc_override_lasagna_lasagna_npcs_how_did_sous_chef_figure_7e63d0: "How did the Sous Chef figure it out?"
  npc_override_lasagna_lasagna_npcs_how_did_you_get_here_ab08fc: "How did you get here in the first place?"
  npc_override_lasagna_lasagna_npcs_how_lasagna_old_days_cda890: "How was Lasagna in the old days?"
  npc_override_lasagna_lasagna_npcs_how_lasagna_past_e74791: "How was Lasagna in the past?"
  npc_override_lasagna_lasagna_npcs_how_new_continent_should_d78390: "How is the new continent? Should I ask for a leave and go on an adventure?"
  npc_override_lasagna_lasagna_npcs_how_someone_who_s_never_c7e9fd: "How can someone who's never faced a Basilisk before pass that test?"
  npc_override_lasagna_lasagna_npcs_how_stupid_i_told_you_15cde9: "How stupid... I told you to bring ^0000cd3^000000. I said 3! You can get them from the ^0000cdBasilisks^000000. How many times I have to tell you that? I think I said it about 100 times!"
  npc_override_lasagna_lasagna_npcs_how_vigilance_corps_merc_2256fb: "How are the vigilance corps and merchants?"
  npc_override_lasagna_lasagna_npcs_how_you_even_think_about_e21c06: "How can you even think about taking his food? Hang on just a bit longer."
  npc_override_lasagna_lasagna_npcs_how_you_force_me_say_c87c03: "How can you force me to say such a thing?! You're so dense! Go, get going!"
  npc_override_lasagna_lasagna_npcs_how_you_hope_survive_new_f6d3c1: "How can you hope to survive the New Continent with that weak mindset?"
  npc_override_lasagna_lasagna_npcs_how_you_know_such_things_869a9b: "How do you know such things in detail?"
  npc_override_lasagna_lasagna_npcs_how_you_like_s_cool_cb7cb7: "How do you like it? It's cool, sweet, and just good, right?"
  npc_override_lasagna_lasagna_npcs_how_you_think_stello_083ed8: "How do you think, Stello?"
  npc_override_lasagna_lasagna_npcs_however_he_very_good_mak_20c02b: "However, he is very good at making enough servings to feed a number of people in a short time. That is why he has become the Head Chef. But when people started complaining about the taste, I was called in."
  npc_override_lasagna_lasagna_npcs_however_i_cannot_let_rec_0e751e: "However, I cannot let the records be lost like this. What should I do..."
  npc_override_lasagna_lasagna_npcs_however_i_really_am_hurr_a2e46f: "However, I really am in a hurry. Should I wait until the fog is lifted?"
  npc_override_lasagna_lasagna_npcs_however_if_you_change_yo_454604: "However, if you change your mind, come back anytime. I'll be waiting for you."
  npc_override_lasagna_lasagna_npcs_however_she_doesn_t_thin_a07021: "However, she doesn't think clearly now... I guess she may remember the past more vividly because of it. It is like she is living in the past."
  npc_override_lasagna_lasagna_npcs_however_someone_damaged_2ec8d2: "However, someone has ^0000cddamaged one of the records in this place^000000."
  npc_override_lasagna_lasagna_npcs_however_we_cannot_sail_o_ce0df2: "However, we cannot sail off right at this moment."
  npc_override_lasagna_lasagna_npcs_however_you_shouldn_t_co_da0b47: "However, you shouldn't have come to me. You should have gone to ^0000cdShamanyang^000000 and asked about today's amulet."
  npc_override_lasagna_lasagna_npcs_huge_basilisk_appeared_h_c08c2f: "A huge basilisk appeared and he was so startled that he injured his leg. Another vigilante took him, so I'm sure he returned safely."
  npc_override_lasagna_lasagna_npcs_huh_73fef0: "Huh?"
  npc_override_lasagna_lasagna_npcs_huh_7c0f65: "....... Huh..."
  npc_override_lasagna_lasagna_npcs_huh_aren_t_you_midgard_9b5543: "Huh? aren't you from Midgard?"
  npc_override_lasagna_lasagna_npcs_huh_case_which_i_need_9e6c5b: "Huh! Is it a case in which I need to find the missing paged? The role of this fresh eye you are looking for is to provide a new insight to the investigation to solve the case?"
  npc_override_lasagna_lasagna_npcs_huh_i_am_sorry_dd32c2: "Huh! I am sorry."
  npc_override_lasagna_lasagna_npcs_huh_i_doubt_you_re_ab16a7: "Huh? I doubt you're from Far-Star."
  npc_override_lasagna_lasagna_npcs_huh_where_you_think_you_a23722: "Huh? Where do you think you're going?"
  npc_override_lasagna_lasagna_npcs_huh_you_just_passing_058208: "Huh? Are you just passing by?"
  npc_override_lasagna_lasagna_npcs_hum_fog_must_226841: "Hum... This fog must be..."
  npc_override_lasagna_lasagna_npcs_hum_hum_i_thought_there_e78dbd: "Hum! Hum! I thought there was no one around here."
  npc_override_lasagna_lasagna_npcs_hum_let_s_stop_talking_967f70: "Hum, Let's stop talking about it. It was ages ago."
  npc_override_lasagna_lasagna_npcs_hum_ok_please_go_see_8a0b43: "Hum... OK. Please go to see ^0000cdthe vigilante guarding the south bridge of the village^000000, and check the state of the dragon."
  npc_override_lasagna_lasagna_npcs_hum_then_you_found_right_5e7132: "Hum! Then you have found the right man. It is another adventure for me to tell an adventure story to an adventurer. Which story do you want hear now?"
  npc_override_lasagna_lasagna_npcs_hum_there_many_kinds_foo_2fbe85: "Hum, there are many kinds of food. We also hunt the ingredients and cook. There are many things for sure..."
  npc_override_lasagna_lasagna_npcs_hum_we_problem_be5e6d: "Hum, we have a problem."
  npc_override_lasagna_lasagna_npcs_human_wow_what_odd_looki_0906da: "A human? Wow, what an odd-looking one!"
  npc_override_lasagna_lasagna_npcs_humans_always_intrigue_m_1cf874: "Humans always intrigue me with their peculiar look."
  npc_override_lasagna_lasagna_npcs_humans_say_their_weapons_9f1539: "Humans say their weapons become stronger through refinement. What's refinement anyway?"
  npc_override_lasagna_lasagna_npcs_hundreds_hamsters_runnin_a68050: "Hundreds of hamsters are running on treadmills on the bottom of this ship. The ship moves forward because this area is connected to the main part of the engine."
  npc_override_lasagna_lasagna_npcs_hunter_desert_wolves_qui_3441df: "The Hunter Desert Wolves are quiet right now. They must've been shocked to see you in action."
  npc_override_lasagna_lasagna_npcs_hurry_go_deliver_his_lun_352c92: "Hurry, go and deliver his lunchbox. He looks like he's about to starve to death."
  npc_override_lasagna_lasagna_npcs_hurry_over_port_now_b5dd6a: "Hurry over to the port now."
  npc_override_lasagna_lasagna_npcs_hurt_lot_110ba3: "Does it hurt a lot?"
  npc_override_lasagna_lasagna_npcs_huu_15a00b: "Huu..."
  npc_override_lasagna_lasagna_npcs_i_almost_got_hurt_please_4bafac: "I almost got hurt. Please be careful next time."
  npc_override_lasagna_lasagna_npcs_i_also_gave_you_new_549f97: "I also gave you ^4d4dffa new set of clothes^000000 so that you can change out of your dirty ones."
  npc_override_lasagna_lasagna_npcs_i_am_captain_gamberi_cha_810c4a: "I am Captain ^0000cdGamberi^000000 in charge of this ship. Welcome aboard."
  npc_override_lasagna_lasagna_npcs_i_am_captain_gamberi_cha_a193e7: "I am Captain Gamberi in charge of this ship."
  npc_override_lasagna_lasagna_npcs_i_am_counting_you_then_03eb47: "I am counting on you then."
  npc_override_lasagna_lasagna_npcs_i_am_excited_too_new_e9cb95: "I am excited too. New food."
  npc_override_lasagna_lasagna_npcs_i_am_glad_experienced_ad_a197ba: "I am glad that an experienced adventurer like you is helping us. Ask the vigilante about the state of the dragon."
  npc_override_lasagna_lasagna_npcs_i_am_glad_you_working_ccb43b: "I am glad that you are working like a full-fledged Doram."
  npc_override_lasagna_lasagna_npcs_i_am_here_fulfil_my_7fcd11: "I am here to fulfil ^0000cdmy duty as an adventurer^000000."
  npc_override_lasagna_lasagna_npcs_i_am_hurry_e5c4b6: "I am in a hurry."
  npc_override_lasagna_lasagna_npcs_i_am_interested_story_ab_0b199d: "I am interested in the story about you the most."
  npc_override_lasagna_lasagna_npcs_i_am_lasagna_i_born_fac081: "I am from Lasagna. I was born to an honorable family and gentle parents. I grew up to become a curious and adventurous child."
  npc_override_lasagna_lasagna_npcs_i_am_pretty_sure_evil_1816f7: "I am pretty sure that it is the evil ghost talking to you."
  npc_override_lasagna_lasagna_npcs_i_am_sailor_sailors_real_26ff91: "I am the sailor of sailors. The real seaman. I am the boatswain of this ship who is in charge of taking care of tough sailors and all the business on the deck. The story I am about to tell you... You shouldn't tell it to anyone else."
  npc_override_lasagna_lasagna_npcs_i_am_shameless_enough_ti_d10511: "I am not shameless enough to tie down a young person with such potential."
  npc_override_lasagna_lasagna_npcs_i_am_sorry_ask_you_ca9ee1: "I am sorry to ask you again."
  npc_override_lasagna_lasagna_npcs_i_am_sorry_send_you_3492d0: "I am sorry to send you alone!"
  npc_override_lasagna_lasagna_npcs_i_ascend_heaven_training_4a8e66: "I can ^0000cdascend to heaven by training for 1,000 years and becoming a dragon^000000. But the ^0000cdmother and father of that young one^000000 snatched ^0000cdYeouiju^000000 twice in the past and ascended instead."
  npc_override_lasagna_lasagna_npcs_i_ask_favor_again_next_2d652a: "Can I ask for a favor again next time? I need to take fresh ones every day."
  npc_override_lasagna_lasagna_npcs_i_ask_newcomers_about_fu_c15beb: "I ask the newcomers about Fusilli and none of them knows. It must be in the backwoods or something."
  npc_override_lasagna_lasagna_npcs_i_asked_find_some_basils_33097a: "I was asked to find some basils. I heard that I can find them from the basilisks, so I came all the way here to catch them. I guess that must've excited them."
  npc_override_lasagna_lasagna_npcs_i_asked_five_sticky_webf_80cadf: "I asked for five sticky webfeet but I still need a bit more. I don't have enough time to collect them alone."
  npc_override_lasagna_lasagna_npcs_i_assist_those_who_finis_7f140c: "I assist those who finished their training from Farfalle Vigilantes with boarding on Con-Chliina."
  npc_override_lasagna_lasagna_npcs_i_been_everywhere_one_da_79aa71: "I have been to everywhere. And one day, I found it."
  npc_override_lasagna_lasagna_npcs_i_been_suffering_superna_d59a5c: "I have been suffering from ^0000cdthe supernatural phenomenon^000000 ever since."
  npc_override_lasagna_lasagna_npcs_i_beg_you_i_m_940ce7: "I beg you. I'm really worried. Can't even sleep these days."
  npc_override_lasagna_lasagna_npcs_i_beg_you_please_02bcc6: "I beg you, please."
  npc_override_lasagna_lasagna_npcs_i_beg_you_please_catch_bc8b9d: "I beg you. Please catch Roda Frogs and bring me five sticky webfeet! Without them, I can't make any pudding!"
  npc_override_lasagna_lasagna_npcs_i_believe_people_new_con_5fbdfb: "I believe the people of the new continent eat different food from us. What do the people find delicious in the new continent?"
  npc_override_lasagna_lasagna_npcs_i_believe_should_basic_l_465085: "I believe it should be ^4d4dffbasic level 6^000000 for humans."
  npc_override_lasagna_lasagna_npcs_i_believe_you_very_well_ea5b1e: "I believe you can do very well, even in a new location."
  npc_override_lasagna_lasagna_npcs_i_broke_all_dishes_so_d91f2c: "But I broke all the dishes so I have none."
  npc_override_lasagna_lasagna_npcs_i_brought_some_snacks_yo_5c6407: "I brought some snacks for you."
  npc_override_lasagna_lasagna_npcs_i_came_up_items_sold_ebfe37: "I came up with items that can be sold between the new world and Far-Star. I'm surprised at how different their tastes are. Really surprised to hear the price of Igdrasil fruit."
  npc_override_lasagna_lasagna_npcs_i_cannot_believe_how_pre_5131b3: "I cannot believe how pretentious our captain and the leader really are!"
  npc_override_lasagna_lasagna_npcs_i_cannot_trust_anyone_bdf1cd: "I cannot trust anyone."
  npc_override_lasagna_lasagna_npcs_i_corrected_those_bad_do_f00c97: "I corrected those bad Dorams and formed the merchant group and the vigilante corps to engage in^0000cd trades^000000. The business thrived, and all the cities nearby were filled with the goods from Lasagna."
  npc_override_lasagna_lasagna_npcs_i_could_been_dead_if_02b72e: "I could have been dead if it wasn't for my acting skill."
  npc_override_lasagna_lasagna_npcs_i_d_better_make_multiple_c2f74b: "I'd better make multiple copies and hide them everywhere."
  npc_override_lasagna_lasagna_npcs_i_d_like_explore_new_b1cfb9: "I'd like to explore the new continent when I get to leave the ship someday."
  npc_override_lasagna_lasagna_npcs_i_d_like_go_out_0db510: "I'd like to go out there and taste each dish. However, if I do, the crews of this ship will starve to death."
  npc_override_lasagna_lasagna_npcs_i_d_like_hear_about_ccaa5b: "I'd like to hear about the adventure story someday."
  npc_override_lasagna_lasagna_npcs_i_d_like_hear_too_ef624e: "I'd like to hear it too."
  npc_override_lasagna_lasagna_npcs_i_d_like_hear_your_fcc92e: "I'd like to hear your adventure stories from the new continent someday. Come visit me from time to time during the adventure."
  npc_override_lasagna_lasagna_npcs_i_d_like_know_how_32ebc5: "I'd like to know how they are made. Please bring me some. ^0000cd5 Cat Hardtacks and 5 Malangdo Canned Food^000000 would do."
  npc_override_lasagna_lasagna_npcs_i_d_like_know_how_9b89fa: "I'd like to know how it is made. Please bring me some. ^0000cd20 Buns^000000 would do."
  npc_override_lasagna_lasagna_npcs_i_d_rather_picky_young_88276f: "I'd rather not be picky with the young people who are raring to go on an adventure, so this should be enough."
  npc_override_lasagna_lasagna_npcs_i_d_rather_spend_rest_6ac25b: "I'd rather spend the rest of life fighting than living with the ghosts!"
  npc_override_lasagna_lasagna_npcs_i_did_i_couldn_t_d95d7e: "I did. But I couldn't help it."
  npc_override_lasagna_lasagna_npcs_i_didn_t_mind_stuff_1da5cc: "I didn't mind the stuff cooked by the Head Chef."
  npc_override_lasagna_lasagna_npcs_i_didn_t_want_ask_168c3c: "I didn't want to ask that sleepyhead for help, but he was the only person who was available."
  npc_override_lasagna_lasagna_npcs_i_don_t_experienced_so_e97770: "I don't do it for the experienced. So you should figure out your own status well beforehand."
  npc_override_lasagna_lasagna_npcs_i_don_t_just_make_2dcbc5: "I don't just make new records. I also do my best to store the records at their best condition."
  npc_override_lasagna_lasagna_npcs_i_don_t_know_much_03751e: "I don't know much about sailing, but none of those sounds relevant to the ship."
  npc_override_lasagna_lasagna_npcs_i_don_t_know_perhaps_ceef38: "I don't know. Perhaps 200 years or so?"
  npc_override_lasagna_lasagna_npcs_i_don_t_know_what_212321: "I don't know what just happened, but I'm happy to go back."
  npc_override_lasagna_lasagna_npcs_i_don_t_know_what_87a925: "I don't know what you mean. Please explain."
  npc_override_lasagna_lasagna_npcs_i_don_t_know_what_888d8f: "I don't know what you are talking about."
  npc_override_lasagna_lasagna_npcs_i_don_t_know_where_66d1b9: "I don't know where my conscience is."
  npc_override_lasagna_lasagna_npcs_i_don_t_know_who_c4c7d7: "I don't know who he is."
  npc_override_lasagna_lasagna_npcs_i_don_t_know_why_9b685d: "I don't know why, but I don't like the feel of this."
  npc_override_lasagna_lasagna_npcs_i_don_t_mean_i_fbd86a: "I don't mean.... I don't mean... That..."
  npc_override_lasagna_lasagna_npcs_i_don_t_really_know_4cf914: "I don't really know myself!"
  npc_override_lasagna_lasagna_npcs_i_don_t_see_anything_7b644e: "I don't see anything."
  npc_override_lasagna_lasagna_npcs_i_don_t_see_near_928f9a: "I don't see it near here. We should go deeper!"
  npc_override_lasagna_lasagna_npcs_i_don_t_think_i_466379: "I don't think I can ever drag myself up."
  npc_override_lasagna_lasagna_npcs_i_don_t_think_i_4db9c8: "I don't think I can eat another anchovy ever again. Our eyes met just before. They're going to follow me every time I see an anchovy."
  npc_override_lasagna_lasagna_npcs_i_don_t_want_anymore_9a34fa: "I don't want to do this anymore."
  npc_override_lasagna_lasagna_npcs_i_don_t_want_even_c3bf93: "I don't want even a piece of it now."
  npc_override_lasagna_lasagna_npcs_i_farewell_then_b84523: "I will. Farewell, then."
  npc_override_lasagna_lasagna_npcs_i_feed_them_my_grandchil_f1a0c6: "I can feed them to my grandchildren."
  npc_override_lasagna_lasagna_npcs_i_feel_challenged_whenev_53970c: "I feel challenged whenever I stumble upon a competent Doram such as you."
  npc_override_lasagna_lasagna_npcs_i_feeling_i_ll_see_5541f3: "I have a feeling that I'll see you around often."
  npc_override_lasagna_lasagna_npcs_i_gave_you_red_herbs_82b607: "I gave you Red Herbs and apples."
  npc_override_lasagna_lasagna_npcs_i_get_startled_each_time_3e5624: "I get startled each time some mail arrives..."
  npc_override_lasagna_lasagna_npcs_i_get_what_you_re_15d745: "I get what you're saying."
  npc_override_lasagna_lasagna_npcs_i_get_you_re_new_89822d: "I get it! You're from the New Continent, aren't you?"
  npc_override_lasagna_lasagna_npcs_i_grew_up_sheltered_48bbc8: "I was grew up sheltered."
  npc_override_lasagna_lasagna_npcs_i_guess_everyone_what_ta_bdb79e: "I guess not everyone has what it takes to become the boatswain of Con-Chliina. How did he survive all this time?"
  npc_override_lasagna_lasagna_npcs_i_guess_i_may_caused_06142f: "I guess I may have caused it."
  npc_override_lasagna_lasagna_npcs_i_guess_i_should_go_6e3d6e: "... I guess I should go. Damn it."
  npc_override_lasagna_lasagna_npcs_i_guess_so_adventurer_su_96ff54: "I guess so. This adventurer sure seems quite tough."
  npc_override_lasagna_lasagna_npcs_i_guess_something_may_ca_a0cadc: "I guess something may have cause the disturbance."
  npc_override_lasagna_lasagna_npcs_i_guess_sticks_make_dora_f6abd5: "I guess sticks do make dorams. The two sent those hoodlums to the merchants and vigilance corps. Mm... I remember those boys. Their beards were cut and tails were tattered."
  npc_override_lasagna_lasagna_npcs_i_guess_there_no_choice_0d49d8: "I guess there is no choice left for me. I should go there."
  npc_override_lasagna_lasagna_npcs_i_guess_there_s_no_d8e29f: "I guess there's no helping it."
  npc_override_lasagna_lasagna_npcs_i_guess_we_wouldn_t_b96c88: "I guess we wouldn't be able to set off because of the mist."
  npc_override_lasagna_lasagna_npcs_i_guess_you_must_heard_d19435: "I guess you must have heard the actual story this time."
  npc_override_lasagna_lasagna_npcs_i_guess_you_re_right_9d93ad: "I guess you're right. I can't wait forever so I should get rid of those basilisks. How many should I take care of?"
  npc_override_lasagna_lasagna_npcs_i_guess_you_read_quite_4e97ad: "I guess you have read quite a lot of adventure novels, dear adventurer."
  npc_override_lasagna_lasagna_npcs_i_had_strange_dream_2dce65: "I had a strange dream."
  npc_override_lasagna_lasagna_npcs_i_handed_over_boatswain_fbac2e: "I have handed it over. And the Boatswain wanted to know when the ^0000cdSailing Signal^000000 would be issued."
  npc_override_lasagna_lasagna_npcs_i_happen_cookbook_new_co_0dc50e: "I happen to have a ^0000cdCookbook of the new continent^000000. Do you have any of the ingredients for the food now?"
  npc_override_lasagna_lasagna_npcs_i_hear_story_912ea1: "I will hear the story."
  npc_override_lasagna_lasagna_npcs_i_heard_boatswain_had_vi_83bc7f: "I heard that the boatswain had visited previous shaman meow with Captain Gamberry in the past. But he stormed out in the middle of explanation and never came back."
  npc_override_lasagna_lasagna_npcs_i_heard_honey_collect_ne_cdb820: "I heard that honey collect is in need of help, so you should go see ^4D4DFF[Florin]^000000. Thank you for helping us."
  npc_override_lasagna_lasagna_npcs_i_heard_i_sleep_lot_e93383: "I heard I have to sleep a lot to grow a lot."
  npc_override_lasagna_lasagna_npcs_i_heard_igdrasil_rare_ne_034fce: "I heard that Igdrasil is rare in the new world since there are none. So I'm going to try selling it over there."
  npc_override_lasagna_lasagna_npcs_i_heard_outsider_had_bee_a67880: "I heard that ^0000cdan outsider had been messing with the basilisks^000000."
  npc_override_lasagna_lasagna_npcs_i_heard_prok_needs_some_c47857: "I heard that Prok needs some help right now. Why don't you go see ^4D4DFF[Prok]^000000? Thank you for helping us."
  npc_override_lasagna_lasagna_npcs_i_heard_started_little_s_6197db: "But I heard that it was started with the little seed money pooled by the three leaders, and now it has grown into a huge organization that makes most of this town's income."
  npc_override_lasagna_lasagna_npcs_i_heard_story_captain_ga_a17ad1: "I have heard from the story from Captain Gamberi, but I am very confused."
  npc_override_lasagna_lasagna_npcs_i_heard_story_s_why_4e2e0c: "I heard that story. That's why you were called the mad..."
  npc_override_lasagna_lasagna_npcs_i_heard_there_illegal_an_1e5b13: "I heard that there are illegal anchovy boats tricking people to get on board these days. It's a scary world. The vigilantes have their eyes wide open to catch them."
  npc_override_lasagna_lasagna_npcs_i_heard_there_someone_wh_bc8f5e: "I have heard that there is someone who teaches how to cook in the palace of the new continent. It would be a good idea to check out."
  npc_override_lasagna_lasagna_npcs_i_heard_we_couldn_t_0ffd4c: "I heard that we couldn't set off because of the fog. I am here to check the condition of the dragon inside the cave."
  npc_override_lasagna_lasagna_npcs_i_heard_you_guys_fought_9c513b: "I heard you guys fought."
  npc_override_lasagna_lasagna_npcs_i_heard_you_re_boarding_2858fb: "I heard you're boarding on a ship. Shouldn't you hurry?"
  npc_override_lasagna_lasagna_npcs_i_here_desperately_fight_0c7b51: "I was here, desperately fighting against the sunlight and waiting for someone to pass by meow."
  npc_override_lasagna_lasagna_npcs_i_hope_i_listen_your_03178f: "I hope I can listen to your story one day."
  npc_override_lasagna_lasagna_npcs_i_hope_you_help_me_308d5e: "I hope you can help me tomorrow as well!"
  npc_override_lasagna_lasagna_npcs_i_how_long_take_7aed95: "I will. How long would it take?"
  npc_override_lasagna_lasagna_npcs_i_hunch_i_leave_place_cbb469: "I have a hunch that I have to leave this place now."
  npc_override_lasagna_lasagna_npcs_i_hungry_i_t_eat_d5f98f: "I was hungry. I can't eat anchovies anymore. I can only eat kalunyak now."
  npc_override_lasagna_lasagna_npcs_i_i_don_t_mean_2eb5af: "I-I don't mean that I dislike grandma. Yes, yes. I'll be careful."
  npc_override_lasagna_lasagna_npcs_i_interested_fishing_ind_a1929f: "I was interested in the fishing industry, and I went into the ^0000cdanchovy processing^000000 business with Pepperoncino. We made a fortune. We wondered what to do with all the money we had..."
  npc_override_lasagna_lasagna_npcs_i_just_need_my_belly_a5a82e: "I just need my belly to be full."
  npc_override_lasagna_lasagna_npcs_i_just_trying_hang_out_32e4bd: "I was just trying to hang out for a while, but I fell down!"
  npc_override_lasagna_lasagna_npcs_i_knew_5eb1b1: "I knew it!"
  npc_override_lasagna_lasagna_npcs_i_knew_going_happen_agai_7342df: "...I knew this was going to happen again. Worse, this one must require a lot more time to polish!"
  npc_override_lasagna_lasagna_npcs_i_knew_he_come_again_2db50e: "I knew he would come again. He must have heard that I am recollecting the record. I though he would come back to get rid of it again. I guess I should be more careful not to lose it."
  npc_override_lasagna_lasagna_npcs_i_know_i_searched_into_47b2d9: "I know. I searched into your inventory too much. Sorry..."
  npc_override_lasagna_lasagna_npcs_i_know_nothing_i_won_78f6c7: "I know nothing! I won't tell you that our king commanded it!"
  npc_override_lasagna_lasagna_npcs_i_like_baby_cute_4326a0: "I like baby! Cute!"
  npc_override_lasagna_lasagna_npcs_i_like_her_7ad853: "I like her..."
  npc_override_lasagna_lasagna_npcs_i_like_relaxing_here_as_587855: "I like relaxing here as well. No craving for kalunyak either."
  npc_override_lasagna_lasagna_npcs_i_ll_back_soon_065a4e: "I'll be back soon."
  npc_override_lasagna_lasagna_npcs_i_ll_direct_you_village_a52102: "I'll direct you to the village, now."
  npc_override_lasagna_lasagna_npcs_i_ll_follow_you_navi_60deb1: "I'll follow you. <NAVI>^4D4DFF[Dragon's Nest]^000000<INFO>lasa_fild02,340,244,000,1,</INFO></NAVI> is in the cave at the right end of the field outside the village."
  npc_override_lasagna_lasagna_npcs_i_ll_get_going_now_8bcaa2: "I'll get going now..."
  npc_override_lasagna_lasagna_npcs_i_ll_get_warehouse_open_499172: "I'll get the warehouse open."
  npc_override_lasagna_lasagna_npcs_i_ll_give_try_e5565e: "I'll give it a try."
  npc_override_lasagna_lasagna_npcs_i_ll_give_you_full_2d0db8: "I'll give you 10 full minutes while you hunt ^4d4dff3 Leaf Lunatics and 2 Grass Fabres^000000 around here!"
  npc_override_lasagna_lasagna_npcs_i_ll_give_you_left_0f5259: "I'll give you the left-over herbs as a reward."
  npc_override_lasagna_lasagna_npcs_i_ll_give_you_some_2f6ed7: "I'll give you some ^0000cdKahlugna Milk^000000 which all Dorams who have ever visited Lasagna crave. Thank you so much for your effort."
  npc_override_lasagna_lasagna_npcs_i_ll_help_you_f61b77: "I'll help you."
  npc_override_lasagna_lasagna_npcs_i_ll_help_you_what_81b1cc: "I'll help you with what I can!"
  npc_override_lasagna_lasagna_npcs_i_ll_join_militia_become_b8d00b: "I'll join the Militia and become great like my parents!"
  npc_override_lasagna_lasagna_npcs_i_ll_just_pretend_you_95f75f: "I'll just pretend you didn't say that! I don't give a damn about a Shaman meow saying those malicious things!"
  npc_override_lasagna_lasagna_npcs_i_ll_let_slide_since_b2bc4f: "I'll let it slide since you have done me a favor. I'll see you again tomorrow."
  npc_override_lasagna_lasagna_npcs_i_ll_let_you_know_72af59: "I'll let you know how to reach the village."
  npc_override_lasagna_lasagna_npcs_i_ll_make_sure_tell_33eaaa: "I'll make sure to tell him to say sorry to you. He is such a trouble. He will always be nothing but a sailor boy."
  npc_override_lasagna_lasagna_npcs_i_ll_munch_them_like_9c6644: "I'll munch on them like twigs and digest them just like that. Meow!"
  npc_override_lasagna_lasagna_npcs_i_ll_never_hear_end_f7e190: "I'll never hear the end of that darn Fusilli."
  npc_override_lasagna_lasagna_npcs_i_ll_never_tell_you_14299c: "I'll never tell you that what we're after isn't Lasagna but that yellow thing living inside the cave!!!"
  npc_override_lasagna_lasagna_npcs_i_ll_pluck_red_grass_4a36b3: "I'll pluck the Red Grass for you."
  npc_override_lasagna_lasagna_npcs_i_ll_rest_here_make_540b63: "I'll rest here to make my upset stomach feel better."
  npc_override_lasagna_lasagna_npcs_i_ll_right_behind_you_ec71da: "I'll be right behind you!"
  npc_override_lasagna_lasagna_npcs_i_ll_see_what_i_91fd91: "I'll see what I can do. You return home and wait."
  npc_override_lasagna_lasagna_npcs_i_ll_see_you_again_1d5109: "I'll see you again in the village!"
  npc_override_lasagna_lasagna_npcs_i_ll_take_chief_when_ff1bbe: "I'll take it to the chief when it's finished, so you can go first."
  npc_override_lasagna_lasagna_npcs_i_ll_take_empty_dishes_49f08b: "I'll take the empty dishes."
  npc_override_lasagna_lasagna_npcs_i_ll_tell_you_today_e039dd: "I'll tell you today's talisman. It is..."
  npc_override_lasagna_lasagna_npcs_i_ll_think_about_i_83b475: "I'll think about it. I don't even know what that is. I can't promise you without knowing what it is."
  npc_override_lasagna_lasagna_npcs_i_ll_try_d603ba: "I'll try."
  npc_override_lasagna_lasagna_npcs_i_ll_wait_i_ll_71dbe9: "I'll wait! I'll wait!"
  npc_override_lasagna_lasagna_npcs_i_look_something_else_606dc1: "Can I look for something else?"
  npc_override_lasagna_lasagna_npcs_i_looking_you_tool_shop_bb0786: "I was looking for you at the tool shop and they said you headed here."
  npc_override_lasagna_lasagna_npcs_i_lucky_enough_obtain_ig_5ca58b: "I was lucky enough to obtain Igdrasil's Fruit once."
  npc_override_lasagna_lasagna_npcs_i_m_aglio_i_m_435c2c: "I'm Aglio. I'm going to be your attendant from this point on."
  npc_override_lasagna_lasagna_npcs_i_m_back_f3fa74: "I'm back."
  npc_override_lasagna_lasagna_npcs_i_m_beat_6619bb: "I'm beat."
  npc_override_lasagna_lasagna_npcs_i_m_better_fighter_than_766318: "I'm a better fighter than you are!"
  npc_override_lasagna_lasagna_npcs_i_m_bit_busy_urgent_ee934e: "But I'm a bit busy with urgent matters to give you the test now, so perhaps later..."
  npc_override_lasagna_lasagna_npcs_i_m_bored_d02a0c: "I'm bored."
  npc_override_lasagna_lasagna_npcs_i_m_boss_playground_dd781d: "I'm the boss of this playground-"
  npc_override_lasagna_lasagna_npcs_i_m_busy_right_now_7e9b94: "I'm busy right now. I'll help you next time. Sorry!"
  npc_override_lasagna_lasagna_npcs_i_m_busy_right_now_97547e: "I'm busy right now. I'll do it later."
  npc_override_lasagna_lasagna_npcs_i_m_busy_so_busy_9225b5: "I'm busy! So busy!"
  npc_override_lasagna_lasagna_npcs_i_m_casting_hypnosis_you_38f9f3: "I'm casting hypnosis on the young lads for their future."
  npc_override_lasagna_lasagna_npcs_i_m_chief_peperoncino_vi_fb660d: "I'm Chief Peperoncino of the Vigilante Corp."
  npc_override_lasagna_lasagna_npcs_i_m_collecting_honey_nee_441f8b: "I'm collecting honey needed to ferment kaluna from the blooming flowers here, but our biggest rivals, the hornets, are taking everything before we even get a chance."
  npc_override_lasagna_lasagna_npcs_i_m_curious_about_your_1fed31: "I'm curious about your story."
  npc_override_lasagna_lasagna_npcs_i_m_deleting_all_rows_08825e: "I'm deleting all the rows from 7711 through 7720."
  npc_override_lasagna_lasagna_npcs_i_m_doing_my_best_e5deae: "I'm doing my best."
  npc_override_lasagna_lasagna_npcs_i_m_drinking_kaluna_righ_59ff69: "I'm drinking kaluna right now, but It's not because It's tasty. It's because It's there."
  npc_override_lasagna_lasagna_npcs_i_m_dumb_you_know_99f97a: "I'm not dumb you know. But there's no one to send! Look, everyone is busy."
  npc_override_lasagna_lasagna_npcs_i_m_exactly_sure_i_9d101c: "I'm not exactly sure, but I can tell It's really important for people here."
  npc_override_lasagna_lasagna_npcs_i_m_exactly_sure_s_daed09: "I'm not exactly sure, but It's a must-have to become a dragon and ascend to the heaven."
  npc_override_lasagna_lasagna_npcs_i_m_exhausted_6d2529: "I'm exhausted."
  npc_override_lasagna_lasagna_npcs_i_m_expert_i_did_13e929: "I'm not an expert but I did my best."
  npc_override_lasagna_lasagna_npcs_i_m_farfalle_vigilante_c_74ffde: "I'm with the Farfalle Vigilante commanded by Leader Peperoncino!"
  npc_override_lasagna_lasagna_npcs_i_m_feeling_so_tired_f0cdbd: "I'm feeling... so tired..."
  npc_override_lasagna_lasagna_npcs_i_m_fine_had_too_aba910: "I'm fine. Had too much kalunyak that I'm still digesting."
  npc_override_lasagna_lasagna_npcs_i_m_finished_you_go_bc75b2: "I'm... finished... You go ahead..."
  npc_override_lasagna_lasagna_npcs_i_m_getting_into_mood_0590ad: "I'm getting into the mood, so just wait a bit! If everything goes well, not just one, but two glasses on me!"
  npc_override_lasagna_lasagna_npcs_i_m_getting_tired_now_e99928: "I'm getting tired of this now. But there's nothing else to eat."
  npc_override_lasagna_lasagna_npcs_i_m_going_ec3223: "I'm going."
  npc_override_lasagna_lasagna_npcs_i_m_going_finish_myself_91ba03: "I'm going finish this myself."
  npc_override_lasagna_lasagna_npcs_i_m_going_make_bow_9b9e56: "I'm going to make a bow tie with these."
  npc_override_lasagna_lasagna_npcs_i_m_going_trouble_ff9a59: "Or, I'm going to be in trouble!"
  npc_override_lasagna_lasagna_npcs_i_m_goma_chara_eldest_20629d: "I'm Goma Chara, the eldest daughter of the Charas. These brats are who quicken my ageing process..."
  npc_override_lasagna_lasagna_npcs_i_m_hungry_597298: "I'm hungry."
  npc_override_lasagna_lasagna_npcs_i_m_leaving_239d83: "I'm leaving."
  npc_override_lasagna_lasagna_npcs_i_m_leaving_right_now_22709f: "I'm leaving! Right now!"
  npc_override_lasagna_lasagna_npcs_i_m_my_way_pack_703ad4: "I'm on my way to pack up my stuff in Midgard. It's great, really."
  npc_override_lasagna_lasagna_npcs_i_m_one_dorams_who_69bf6b: "I'm not one of the Dorams who would randomly give up on their errands!"
  npc_override_lasagna_lasagna_npcs_i_m_one_responsible_brin_e5398f: "I'm the one responsible for bringing up the subject and for poor Legalas's sake, I'll help you guys find a job."
  npc_override_lasagna_lasagna_npcs_i_m_one_who_said_f69628: "I'm the one who said I'll help you, but how come the lord gets the appreciation?"
  npc_override_lasagna_lasagna_npcs_i_m_pleasantly_full_fine_1f9065: "But I'm pleasantly full in this fine sunny weather..."
  npc_override_lasagna_lasagna_npcs_i_m_really_curious_46951e: "I'm really curious."
  npc_override_lasagna_lasagna_npcs_i_m_sorry_349c20: "I'm sorry, but..."
  npc_override_lasagna_lasagna_npcs_i_m_sorry_hear_young_c2a109: "I'm sorry to hear that. But that young one is at fault. Basilisks will continue with their task until the Yeouiju is recovered."
  npc_override_lasagna_lasagna_npcs_i_m_sorry_my_sister_fcf8f4: "I'm sorry. My sister will get pretty mad if I don't sell it for the proper money. Will you come back with 10 Doram Tokens?"
  npc_override_lasagna_lasagna_npcs_i_m_sorry_our_chit_06170c: "I'm sorry but our chit-chat ends here. Time flies when you're busy taking care of little brothers."
  npc_override_lasagna_lasagna_npcs_i_m_sorry_say_when_658a8f: "I'm sorry to say this when you're working so hard to help us, but how about searching for some other work? I think It's a shame to let your skills go to waste."
  npc_override_lasagna_lasagna_npcs_i_m_still_too_young_1b60dd: "I'm still too young to join the Militia, but, I'm positive that I can be the ace of the band once I join it because I'm committed to training myself."
  npc_override_lasagna_lasagna_npcs_i_m_supposed_pluck_red_da87e7: "But I'm supposed to pluck the Red Grass..."
  npc_override_lasagna_lasagna_npcs_i_m_sure_i_help_7a1749: "I'm sure I can be of help for just about anything."
  npc_override_lasagna_lasagna_npcs_i_m_sure_if_you_8381f8: "I'm not sure if you know, but this is a Basilisk, a race that lives not very far from here."
  npc_override_lasagna_lasagna_npcs_i_m_sure_won_t_7f15f8: "I'm sure that won't happen just over a glass of kaluna milk."
  npc_override_lasagna_lasagna_npcs_i_m_sure_you_ve_e9b90d: "I'm sure you've been to Raviol Plains. You must come from there."
  npc_override_lasagna_lasagna_npcs_i_m_thinking_about_invit_a4ba72: "I'm thinking about inviting all the crewmen of Con-Chliina tomorrow and throwing a banquet."
  npc_override_lasagna_lasagna_npcs_i_m_using_summoning_skil_8c4819: "^4d4dffI'm using the summoning skill by boosting INT for magical attacks!^000000"
  npc_override_lasagna_lasagna_npcs_i_m_worried_6f0477: "I'm worried."
  npc_override_lasagna_lasagna_npcs_i_may_feigned_death_i_1f4cbd: "I may have feigned death, but I am not a coward. It really was huge and frightening. Well, this is not important now. Just go to Tartufi. Tell him that I am sorry that I cannot make it today."
  npc_override_lasagna_lasagna_npcs_i_mean_here_comes_newbie_c772fa: "I mean, ^0000cdhere comes the newbie!^000000"
  npc_override_lasagna_lasagna_npcs_i_mean_making_eating_a55e6f: "I mean making it, not eating it."
  npc_override_lasagna_lasagna_npcs_i_mean_pepperoncino_lead_f0faa5: "I mean ^0000cdPepperoncino the leader of the vigilante corps^000000. He must be having an early meal at the new Adventurer Club now."
  npc_override_lasagna_lasagna_npcs_i_met_stello_then_i_7e96c3: "I met Stello then. I ^0000cdcorrected Stello who was a pickpocket^000000 back then. He has become the Chief Office."
  npc_override_lasagna_lasagna_npcs_i_might_need_get_some_06be8f: "I might need to get some mushroom spores or something tomorrow as well, so drop by again. I'm going to bring these quickly and relax. Thanks! I owe you."
  npc_override_lasagna_lasagna_npcs_i_must_bathe_sunlight_sl_553e77: "I must bathe in the sunlight and sleep on days like this..."
  npc_override_lasagna_lasagna_npcs_i_must_repay_you_saving_dfebdc: "I must repay you for saving my strings. Thank you so much."
  npc_override_lasagna_lasagna_npcs_i_need_deliver_some_mess_66c23a: "I need to deliver some message to Kalu anyway, so I'll take the two with me."
  npc_override_lasagna_lasagna_npcs_i_need_ice_cubes_today_754bc9: "I need ^0000cdIce Cubes^000000 today. I have heard that the Ice Cubes from this one cave doesn't melt even in the middle of summer."
  npc_override_lasagna_lasagna_npcs_i_need_someone_ask_favor_883ec5: "I need someone to ask a favor. You don't seem experienced enough."
  npc_override_lasagna_lasagna_npcs_i_need_you_defeat_our_e8df6d: "I need you to defeat our rival wild hornet today as well. Around ten hornets. Thank you!"
  npc_override_lasagna_lasagna_npcs_i_never_betray_gamberi_7a0248: "I will never betray Gamberi."
  npc_override_lasagna_lasagna_npcs_i_never_imagined_even_my_e0f29a: "I never imagined even in my wildest dreams that there would be any other continent other than ^4d4dffMidgard^000000 or ^4d4dffFar-Star,^000000 which we live in."
  npc_override_lasagna_lasagna_npcs_i_no_idea_which_eggring_99bff5: "I have no idea which Eggring swallowed the box, but, you'll find it once you start hunting them."
  npc_override_lasagna_lasagna_npcs_i_no_work_so_i_903779: "I have no work so I'll eat again."
  npc_override_lasagna_lasagna_npcs_i_only_done_what_you_fff6e6: "I have only done what you told me to do."
  npc_override_lasagna_lasagna_npcs_i_opened_jar_unfortunate_15fd7b: "I opened the jar. It was an unfortunate accident."
  npc_override_lasagna_lasagna_npcs_i_pepperoncino_thomas_wa_251326: "I, Pepperoncino and Thomas wanted to pull off a major gig. A really big one. Nothing like what we had done by then. A business. I mean."
  npc_override_lasagna_lasagna_npcs_i_persistently_persuaded_510dc2: "I ^0000cdpersistently persuaded the captain and crewmen of Con-Chliina to find Butterfly^000000. My efforts finally paid off and we found them on a ^0000cdremote island in the new world^000000."
  npc_override_lasagna_lasagna_npcs_i_picked_up_few_things_6128a5: "I picked up a few things so let me give them a try. Wait."
  npc_override_lasagna_lasagna_npcs_i_pray_your_peace_safety_474799: "I pray for your peace and safety. Tell the boatswain to come back anytime he changes his mind."
  npc_override_lasagna_lasagna_npcs_i_really_like_job_i_828797: "I really like this job! I can smell sweet flowers and also get some honey!"
  npc_override_lasagna_lasagna_npcs_i_received_handful_i_don_b90b61: "I have received a handful. I don't need more."
  npc_override_lasagna_lasagna_npcs_i_refuse_use_martial_art_26cd1d: "I refuse to use martial arts willy-nilly as you do!"
  npc_override_lasagna_lasagna_npcs_i_remember_everyone_i_ve_9134b6: "I remember everyone that I've crossed paths with."
  npc_override_lasagna_lasagna_npcs_i_reset_skills_statuses_707634: "I reset skills and statuses without charge only when your level stays at 49 or below."
  npc_override_lasagna_lasagna_npcs_i_reward_you_handsomely_76147b: "I will reward you handsomely. Please do me another favor tomorrow."
  npc_override_lasagna_lasagna_npcs_i_reward_you_handsomely_fa85ff: "I will reward you handsomely. However, you haven't been able to solve the problem permanently so I don't have to keep the promise I have made."
  npc_override_lasagna_lasagna_npcs_i_said_i_ll_go_0a9e99: "I said I'll go see Kalu. I was bored anyway, so It's all good. Go, you lead the way."
  npc_override_lasagna_lasagna_npcs_i_said_i_m_back_dec822: "I said I'm back."
  npc_override_lasagna_lasagna_npcs_i_say_no_i_don_09e648: "I have to say no. I don't want to spend the eternity as a sailor boy."
  npc_override_lasagna_lasagna_npcs_i_see_c52c6e: "I see."
  npc_override_lasagna_lasagna_npcs_i_see_let_me_take_ff84c0: "I see. Let me take a quick tour."
  npc_override_lasagna_lasagna_npcs_i_see_let_s_say_f33e56: "I see. Let's say hi when we run into each other. Well, make sure to follow my instructions when you hand it over to the Sous Chef, OK?"
  npc_override_lasagna_lasagna_npcs_i_see_lot_out_towners_cd5bdc: "I see a lot of out-of-towners these days."
  npc_override_lasagna_lasagna_npcs_i_see_must_duty_captain_df94b9: "I see. ^0000cdIt must be the duty of the captain to tear and burn the document as well^000000, I guess."
  npc_override_lasagna_lasagna_npcs_i_see_sorry_about_basili_3de4f5: "I see. Sorry about the basilisks. I'll take care of it."
  npc_override_lasagna_lasagna_npcs_i_see_tartufi_causing_tr_67b928: "I see. Tartufi is causing the trouble again. The basilisks are running wild today."
  npc_override_lasagna_lasagna_npcs_i_see_then_you_strong_bef854: "I see. Then are you strong? You said you caught some basilisks."
  npc_override_lasagna_lasagna_npcs_i_see_you_around_often_daa1c8: "I see you around often these days. You look so strange. The face without any whiskers and the butt with no tail."
  npc_override_lasagna_lasagna_npcs_i_see_you_re_new_9ff052: "I see. You're from the new world. But what about Magchi?"
  npc_override_lasagna_lasagna_npcs_i_see_you_taking_care_924768: "I see that you were taking care of the favor I had asked."
  npc_override_lasagna_lasagna_npcs_i_seems_so_949043: "I seems so."
  npc_override_lasagna_lasagna_npcs_i_sent_many_other_people_440dbb: "I have sent many other people. It was no use. He wouldn't open up to anyone on Con-Chliina about his past. That is why I need a ^0000cdfresh eye^000000."
  npc_override_lasagna_lasagna_npcs_i_seriously_hope_he_did_629270: "I seriously hope he did. Otherwise, I'm dead!"
  npc_override_lasagna_lasagna_npcs_i_shook_there_no_sound_7d46b6: "I shook it, but there was no sound. I was wondering what was in there making no sound when it had been sealed so carefully."
  npc_override_lasagna_lasagna_npcs_i_should_check_cargo_bef_3baab2: "I should check the cargo before sailing off."
  npc_override_lasagna_lasagna_npcs_i_should_done_earlier_f0b13c: "I should have done this earlier."
  npc_override_lasagna_lasagna_npcs_i_should_get_going_oh_cb13fd: "I should get going. Oh, my dear."
  npc_override_lasagna_lasagna_npcs_i_should_left_there_walk_fe5f54: "I should have left it there and walked away."
  npc_override_lasagna_lasagna_npcs_i_should_pluck_all_red_2f22cc: "I should pluck all the Red Grass in this herb field..."
  npc_override_lasagna_lasagna_npcs_i_should_stay_con_chliin_509185: "I should stay on Con-Chliina for a long time and witness the moment when we make a discovery."
  npc_override_lasagna_lasagna_npcs_i_should_stop_so_many_71d19c: "I should stop by so many places."
  npc_override_lasagna_lasagna_npcs_i_should_ve_seen_you_d8e0f8: "I should've seen that in you because crossing the mountains is never easy."
  npc_override_lasagna_lasagna_npcs_i_should_welcome_new_dor_6d482f: "I should welcome the new Dorams coming in here."
  npc_override_lasagna_lasagna_npcs_i_smell_something_smell_9f8a11: "I smell something. The smell of a rookie..."
  npc_override_lasagna_lasagna_npcs_i_suffered_too_much_seas_b8567f: "I suffered too much from seasickness to leave on an adventure."
  npc_override_lasagna_lasagna_npcs_i_suppose_so_they_must_5e57e6: "I suppose so. They must be drinking Kahlugna Milk and snoring somewhere. They will come back when it is the time to set off. You can meet them then..."
  npc_override_lasagna_lasagna_npcs_i_supposed_give_haru_bc29aa: "I was supposed to give it to Haru."
  npc_override_lasagna_lasagna_npcs_i_t_8d4b8d: "I can't do this."
  npc_override_lasagna_lasagna_npcs_i_t_believe_how_you_4438f7: "I can't believe it! How can you say that such heavy boat is floating on water?!"
  npc_override_lasagna_lasagna_npcs_i_t_believe_i_going_602a3f: "I can't believe I was going to leave this comfy place. I forgot for a second that eating kalunyak is the biggest joy in my life."
  npc_override_lasagna_lasagna_npcs_i_t_believe_i_should_a6e312: "I can't believe I should keep it with me all day..."
  npc_override_lasagna_lasagna_npcs_i_t_believe_i_ve_6d97b1: "I can't believe I've been eating them all along."
  npc_override_lasagna_lasagna_npcs_i_think_adventurer_knows_16fc2c: "I think the adventurer knows what the problem is already."
  npc_override_lasagna_lasagna_npcs_i_think_d_best_you_38c9dc: "I think it'd be best for you to see the chief first."
  npc_override_lasagna_lasagna_npcs_i_think_i_m_going_a44d6f: "I think I'm going to die at this rate..."
  npc_override_lasagna_lasagna_npcs_i_think_i_m_going_d37960: "I think I'm going to die, trying to fight sleepiness meow."
  npc_override_lasagna_lasagna_npcs_i_think_i_m_having_cb1177: "I think I'm having a very bad day..."
  npc_override_lasagna_lasagna_npcs_i_think_ll_suit_my_c6dba0: "I think that'll suit my personality."
  npc_override_lasagna_lasagna_npcs_i_think_one_lively_happy_08b15a: "I think it is one lively and happy village!"
  npc_override_lasagna_lasagna_npcs_i_think_s_just_should_872f81: "...I think That's just it. Should I look over it again, or stop right here?"
  npc_override_lasagna_lasagna_npcs_i_think_s_something_i_11df2c: "I think That's something I can take care of. As a matter of fact, I have a ^0000cdlunchbox delivery to make inside the cave^000000. Every day, that is."
  npc_override_lasagna_lasagna_npcs_i_think_someone_more_exp_f68063: "I think someone with more experience should take care of this. I'm still a rookie."
  npc_override_lasagna_lasagna_npcs_i_think_they_used_make_ab57ac: "I think they are used to make fertilizers."
  npc_override_lasagna_lasagna_npcs_i_think_you_better_off_760f1b: "But I think you are better off working not in this field, but in a different one."
  npc_override_lasagna_lasagna_npcs_i_think_you_find_another_0c27e4: "I think you can find another Vigilante like myself in the square..."
  npc_override_lasagna_lasagna_npcs_i_think_you_should_go_976b30: "I think you should go pick some now."
  npc_override_lasagna_lasagna_npcs_i_think_you_should_seek_dea956: "But I think you should seek for bigger adventures. don't let your skills go to waste in this boondocks and go out to a bigger place."
  npc_override_lasagna_lasagna_npcs_i_think_you_step_up_af2462: "I think you can step up and handle it this time."
  npc_override_lasagna_lasagna_npcs_i_thinking_about_just_no_a7e7ed: "I was thinking about it just now. Well, have you been trained properly for the adventure? don't you want ^0000cdtest your strength^000000 before that?"
  npc_override_lasagna_lasagna_npcs_i_thought_so_i_went_fe854a: "I thought so. I went to sleep with my ears closed. The strange thing is that it happened again the next day and the day after."
  npc_override_lasagna_lasagna_npcs_i_thought_tasty_food_mad_ed90d1: "I thought it was a tasty food made from some mysterious ingredients in the store."
  npc_override_lasagna_lasagna_npcs_i_threw_away_pot_got_813e7d: "I threw away the pot and got on Con-Chliina. And it happened that night."
  npc_override_lasagna_lasagna_npcs_i_told_disturb_oh_who_c99eef: "I told not to disturb... Oh, who are you?"
  npc_override_lasagna_lasagna_npcs_i_told_you_enter_kitchen_dee853: "I told you not to enter the kitchen like that... Oh... Are you from the new continent?"
  npc_override_lasagna_lasagna_npcs_i_told_you_enter_kitchen_f637c6: "I told you not to enter the kitchen like that... Oh... You seem familiar..."
  npc_override_lasagna_lasagna_npcs_i_told_you_re_headed_8fe501: "I was told you're headed to the New Continent."
  npc_override_lasagna_lasagna_npcs_i_understand_40038e: "I understand."
  npc_override_lasagna_lasagna_npcs_i_understand_though_let_49fb3c: "I can understand, though. Let's go find the lunchbox."
  npc_override_lasagna_lasagna_npcs_i_ve_always_wanted_boat_7682b9: "I've always wanted to be on a boat... hah... nostalgia..."
  npc_override_lasagna_lasagna_npcs_i_ve_given_you_all_54344f: "I've given you all the details about the basics of medicinal botany."
  npc_override_lasagna_lasagna_npcs_i_ve_given_you_more_90e5a0: "I would've given you more if I had any, but...no."
  npc_override_lasagna_lasagna_npcs_i_ve_got_finish_quickly_6670f0: "I've got to finish this quickly and go see him at the port!"
  npc_override_lasagna_lasagna_npcs_i_ve_had_anchovies_befor_1d4f4e: "I've had anchovies before because Legalas bought some time to time."
  npc_override_lasagna_lasagna_npcs_i_ve_urgent_matters_take_3632e7: "I've urgent matters to take care of and will take my leave."
  npc_override_lasagna_lasagna_npcs_i_ve_worked_here_while_5a5162: "I've worked here for a while, but I'm still the youngest so I do all the dishes."
  npc_override_lasagna_lasagna_npcs_i_want_go_back_37f0e8: "I want to go back."
  npc_override_lasagna_lasagna_npcs_i_want_go_there_myself_397dac: "I want to go there myself, too!"
  npc_override_lasagna_lasagna_npcs_i_want_no_more_2e1c7f: "I want no more."
  npc_override_lasagna_lasagna_npcs_i_want_share_mine_i_bd9065: "I want to share mine. Can I tell you?"
  npc_override_lasagna_lasagna_npcs_i_wanted_break_free_name_74d209: "I wanted to break free from the name of the family. I ran off and wandered around Lasagna."
  npc_override_lasagna_lasagna_npcs_i_wish_you_godspeed_465347: "I wish you godspeed!"
  npc_override_lasagna_lasagna_npcs_i_won_t_go_until_1f44c1: "I won't go until I finish eating these."
  npc_override_lasagna_lasagna_npcs_i_won_t_listen_i_6fe28c: "I won't listen to it. I don't want to get involved in another annoying business."
  npc_override_lasagna_lasagna_npcs_i_won_t_surprised_if_1d7ce3: "I won't be surprised if a monster storms out of the fog. I smell something smoky too. Has a volcano erupted recently around here?"
  npc_override_lasagna_lasagna_npcs_i_wondering_if_you_need_7360f3: "I was wondering if you need any help on the ship."
  npc_override_lasagna_lasagna_npcs_i_wondering_why_you_sudd_8e1fb4: "I was wondering why you suddenly took these two out. So That's what happened. It must've been difficult, taking them around with you."
  npc_override_lasagna_lasagna_npcs_ice_cubes_i_am_just_802f95: "The ice cubes. I am just so excited to see them. The ice cubes that don't melt! It sure is the new continent."
  npc_override_lasagna_lasagna_npcs_if_anything_happened_he_000908: "If anything has happened, he would need help."
  npc_override_lasagna_lasagna_npcs_if_he_chooses_become_sha_f07882: "If he chooses not to become a shaman meow, then he must live every day ^0000cddependent on a new talisman^000000. But if he chooses to become a shaman meow, then tell him to come see me."
  npc_override_lasagna_lasagna_npcs_if_he_pays_attention_det_3c6dc3: "If he pays attention to details, his amulets will be even greater. But he just doesn't care."
  npc_override_lasagna_lasagna_npcs_if_he_t_meet_deadline_50e1f7: "If he can't meet the deadline or delivery quota, he'll lose his job to someone else."
  npc_override_lasagna_lasagna_npcs_if_i_cannot_recover_i_032457: "If I cannot recover it, I should rebuild it. I tried to interview Captain Gamberi to fill in the missing pages, but Gaptain Gamberi didn't respond."
  npc_override_lasagna_lasagna_npcs_if_i_find_item_suitable_faf076: "If I find an item suitable for Jogi, I'll pay {0}...."
  npc_override_lasagna_lasagna_npcs_if_i_thorn_49f2a3: "If I do this to the thorn..."
  npc_override_lasagna_lasagna_npcs_if_i_you_i_ve_cd6c80: "If I were you, I would've left long ago. You're not here because you don't know how to get there, right? If That's the case, then I'll tell you. I can do that much for my life's savior."
  npc_override_lasagna_lasagna_npcs_if_legalas_loses_his_job_5c6fa3: "If Legalas loses his job, then he won't be able to earn money. And if he can't earn money, then wouldn't that put you guys in a tight spot?"
  npc_override_lasagna_lasagna_npcs_if_normal_fog_you_need_ca091a: "If it is a normal fog. You need to wait until it is lifted. However, there is ^0000cdsomething causing this fog^000000. It can be removed."
  npc_override_lasagna_lasagna_npcs_if_our_cows_t_eat_8fd128: "If our cows can't eat grass, then we can't milk them. If we have no fresh milk, then we can't make kaluna milk."
  npc_override_lasagna_lasagna_npcs_if_player_wishes_they_us_683e8f: "^4d4dffIf a player wishes, they can use the social options such as Booking, Party, or Guild. Here, they join a party or request transactions.^000000"
  npc_override_lasagna_lasagna_npcs_if_s_all_right_you_0e4cd6: "If It's all right with you, may I find you work? You've done a lot today, so please get some good rest and see you tomorrow."
  npc_override_lasagna_lasagna_npcs_if_s_something_important_b14de6: "If It's something important, I can't give it to you."
  npc_override_lasagna_lasagna_npcs_if_someone_opens_jar_tho_b9bc8e: "But if someone opens the jar, those evil spirits cling onto that idiot and repeat the same process. there's no way to detach them until the host dies. In other words, there's no solution that would make the boatswain happy."
  npc_override_lasagna_lasagna_npcs_if_there_anything_else_m_f08231: "If there is anything else that might sell, I'm going to buy some and sell them there. I'm going be a millionaire."
  npc_override_lasagna_lasagna_npcs_if_there_s_anything_you_33ce1e: "If, there's anything you want to know, don't hesitate to come and see me. And when you get on, make sure to say hi to the ^0000cdpurser^000000."
  npc_override_lasagna_lasagna_npcs_if_time_permits_i_ll_3950dc: "If time permits, I'll be out early and waiting."
  npc_override_lasagna_lasagna_npcs_if_violence_subdues_viol_41b794: "If violence subdues violence, then what will subdue that violence? Anyway, Lasagna was like a rotten trash can. In comparison, Fusilli is a town with totally innocent people!"
  npc_override_lasagna_lasagna_npcs_if_we_had_those_we_bf7719: "If we had those, we could keep food fresh and drink cold Kahlugna Milk anytime. ^0000cd20 Ice Cubes^000000 would do, Thank you."
  npc_override_lasagna_lasagna_npcs_if_you_any_questions_don_a1471c: "If you have any questions, don't hesitate to ask him."
  npc_override_lasagna_lasagna_npcs_if_you_anybody_decent_br_0646f5: "If you have anybody decent, bring him. I'm so short on hands that I do all of that work by myself."
  npc_override_lasagna_lasagna_npcs_if_you_ask_haru_she_82a227: "If you ask Haru, she'll tell you how to turn them into a potion with more effects."
  npc_override_lasagna_lasagna_npcs_if_you_bring_all_ingredi_32549f: "If you bring all the ingredients, we can cook. Hurry up."
  npc_override_lasagna_lasagna_npcs_if_you_bring_all_ingredi_c14587: "If you bring all the ingredients, we can cook!"
  npc_override_lasagna_lasagna_npcs_if_you_bring_them_me_e03e60: "If you bring them to me, I'll reward you handsomely."
  npc_override_lasagna_lasagna_npcs_if_you_defeat_them_then_d4b19f: "If you can defeat them, then I'll do whatever I can with the rest. Thank you."
  npc_override_lasagna_lasagna_npcs_if_you_don_t_cheese_6cb9af: "If you don't have cheese, I'll gladly take Zeny."
  npc_override_lasagna_lasagna_npcs_if_you_don_t_like_013e29: "If you don't like a skill you just learned, I can reset it for you."
  npc_override_lasagna_lasagna_npcs_if_you_eat_you_move_5d0355: "If you eat this, you can move much faster than others. Even faster than a hummingbird flapping its wings."
  npc_override_lasagna_lasagna_npcs_if_you_fall_down_due_e14bd8: "If you fall down due to fatigue during an adventure, you should return to the village. That's what you can do with this service."
  npc_override_lasagna_lasagna_npcs_if_you_freshly_squeezed_60947f: "If you have freshly squeezed milk, then you can taste the supreme version of kaluna milk."
  npc_override_lasagna_lasagna_npcs_if_you_get_any_59fb0c: "If you get to have any."
  npc_override_lasagna_lasagna_npcs_if_you_go_lasagna_there_b9fcfb: "If you go to Lasagna, there is a ^4D4DFF[dock]^000000 there. Take a ship that goes to the new world from there. Wherever you go, I wish you the best. Thanks for everything meow."
  npc_override_lasagna_lasagna_npcs_if_you_happen_amulet_my_70fe20: "If you happen to have the amulet that my brother Yota made, I can polish it for you."
  npc_override_lasagna_lasagna_npcs_if_you_happen_meet_human_1aacf0: "If you happen to meet a human in the Midgard Continent, why don't you ask them?"
  npc_override_lasagna_lasagna_npcs_if_you_hurry_you_should_ba3fcd: "If you are in a hurry, you should meet ^0000cdthe Captain and the Chief Officer^000000. They decide whether to sail off or not. They are in the Captain's Cabin up there/"
  npc_override_lasagna_lasagna_npcs_if_you_i_ll_give_976b0d: "If you do it I'll give you anchovies, okay?"
  npc_override_lasagna_lasagna_npcs_if_you_need_anything_jus_c4c03b: "If you need anything, just say the word!"
  npc_override_lasagna_lasagna_npcs_if_you_need_anything_tal_c38a21: "If you need anything, talk to Olio here."
  npc_override_lasagna_lasagna_npcs_if_you_need_curse_someon_4dd0ee: "If you need to curse someone, break a curse, or need a bit of luck, then come see me."
  npc_override_lasagna_lasagna_npcs_if_you_need_help_please_2b9da8: "And if you need help, please help them stop the dragon from breathing fire."
  npc_override_lasagna_lasagna_npcs_if_you_need_help_then_ff8d3c: "If you need help, then you should at least tell me what I should do."
  npc_override_lasagna_lasagna_npcs_if_you_re_going_order_432e8a: "If you're not going to order anything, get the heck out!"
  npc_override_lasagna_lasagna_npcs_if_you_re_planning_cross_ce4cf6: "If you're planning to cross that ridge, I wouldn't recommend it."
  npc_override_lasagna_lasagna_npcs_if_you_re_ruining_his_1ed207: "If you're ruining his work right now, what makes you think that Legalas won't do anything later? He'll probably get rid of you two and go find some other opportunities."
  npc_override_lasagna_lasagna_npcs_if_you_run_into_problem_b08878: "If you run into a problem, ask them for help. You know, the twins in the vigilante corps. Aglio... Ali... Ol..."
  npc_override_lasagna_lasagna_npcs_if_you_show_me_what_f449a9: "If you show me what you're made of, I'll get out of your way."
  npc_override_lasagna_lasagna_npcs_if_you_time_sit_down_c32ecb: "If you have the time, sit down and talk with me."
  npc_override_lasagna_lasagna_npcs_if_you_want_amulet_you_557762: "If you want an amulet, you can exchange it with the Doram tokens. I have a bunch of amulets with me."
  npc_override_lasagna_lasagna_npcs_if_you_want_boost_your_09ffb9: "If you want to boost your physical attacks, focus on STR. If what you want is magical attacks, go for INT. Got it?"
  npc_override_lasagna_lasagna_npcs_if_you_want_dispose_any_9a510b: "If you want to dispose of any items, you should see me."
  npc_override_lasagna_lasagna_npcs_if_you_want_drink_kaluna_dcc9b5: "If you want to drink kaluna milk, then go see the guy next door. But you'd better hurry. Stirred or shaken, that won't matter pretty soon."
  npc_override_lasagna_lasagna_npcs_if_you_want_go_you_d87662: "If you want to go, you should take me with you."
  npc_override_lasagna_lasagna_npcs_if_you_want_kaluna_then_f175c8: "If you want kaluna, then do something about ^0000cdthose two over there^000000! I'm about to go crazy because not only do they leech onto me, now they're ruining my work. Perhaps It's better that I go back to the battlefield!"
  npc_override_lasagna_lasagna_npcs_if_you_want_learn_how_19d308: "If you want to learn how to cook, come to see me anytime."
  npc_override_lasagna_lasagna_npcs_if_you_want_see_detailed_1b7135: "If you want to ^4d4dffsee a detailed description for each item, right-click that item.^000000"
  npc_override_lasagna_lasagna_npcs_if_you_wish_i_find_565297: "If you wish, I can find something for you. But not today. Perhaps tomorrow. Today you should get some rest."
  npc_override_lasagna_lasagna_npcs_if_you_wish_speak_me_6e0afb: "If you wish to speak to me, then you'd better go and get some more experience."
  npc_override_lasagna_lasagna_npcs_impetuous_because_youth_405107: "Impetuous because of youth."
  npc_override_lasagna_lasagna_npcs_indeed_if_exist_then_we_3dc31f: "Indeed, if it does exist then we can find it and sail on it someday!"
  npc_override_lasagna_lasagna_npcs_indeed_who_else_such_idi_a1b30a: "Indeed, who else would do such an idiotic thing? I can't help him, so please leave."
  npc_override_lasagna_lasagna_npcs_ingredients_apple_carrot_8f53d9: "The ingredients are ^0000cd1 Apple and 2 Carrots^000000."
  npc_override_lasagna_lasagna_npcs_ingredients_apple_clover_51d102: "The ingredients are ^0000cd1 Apple and 1 Clover^000000."
  npc_override_lasagna_lasagna_npcs_ingredients_clover_green_f072c9: "The ingredients are ^0000cd1 Clover, 1 Green Herb and 1 Red Herb^000000."
  npc_override_lasagna_lasagna_npcs_ingredients_jellopy_fluf_1c9850: "The ingredients are ^0000cd1 Jellopy , 1 Fluff, and 1 Feather^000000."
  npc_override_lasagna_lasagna_npcs_inside_amulet_seems_pret_9a2ebf: "The inside of this amulet seems pretty tough."
  npc_override_lasagna_lasagna_npcs_insufficient_materials_r_6b9637: "Insufficient materials, can not be repaired free."
  npc_override_lasagna_lasagna_npcs_int_refers_intelligence_ca97c8: "^4d4dffINT refers to intelligence and MATK means magical attack^000000. If your skills are centered on magic, you must boost INT first and foremost."
  npc_override_lasagna_lasagna_npcs_isn_t_fog_covering_area_eddd8d: "Isn't the fog covering the area near the shore? wouldn't it be a problem to just sail off?"
  npc_override_lasagna_lasagna_npcs_isn_t_fog_made_smoke_f27dfb: "It Isn't. This fog is made of the smoke which is fumed by ^0000cdthe dragon living in the cave^000000 when it is upset. Please wait until ^0000cdthe vigilantes^000000 take care of it."
  npc_override_lasagna_lasagna_npcs_isn_t_kahlugnag_you_hold_33f6cd: "Isn't that ^0000cdKahlugnag^000000 you are holding in your hand? Not anyone can have it, you know."
  npc_override_lasagna_lasagna_npcs_isn_t_natural_fog_1078c9: "Isn't it a natural fog?"
  npc_override_lasagna_lasagna_npcs_isn_t_time_meet_purser_b51053: "Isn't it the time to meet the Purser?"
  npc_override_lasagna_lasagna_npcs_isn_t_your_test_765f35: "This isn't your test."
  npc_override_lasagna_lasagna_npcs_item_window_comes_four_t_e47de0: "The item window comes with four tabs."
  npc_override_lasagna_lasagna_npcs_items_automatically_plac_45eaa9: "Items are automatically placed into the Item, Gear and Etc tabs, depending on their type."
  npc_override_lasagna_lasagna_npcs_jindou_937495: "Jindou."
  npc_override_lasagna_lasagna_npcs_jindou_i_ll_leave_rest_83dc1f: "Jindou, I'll leave the rest to you."
  npc_override_lasagna_lasagna_npcs_jogi_dandi_about_burst_i_29bea3: "Jogi, Dandi is about to burst into crying. Please behave yourself, will you?"
  npc_override_lasagna_lasagna_npcs_joke_should_pleasant_bot_7d80c4: "A joke should be pleasant for the both parties. This is just a curse."
  npc_override_lasagna_lasagna_npcs_just_deliver_big_lunchbo_bb1036: "Just deliver this big lunchbox to Panna who's out on a cave patrol."
  npc_override_lasagna_lasagna_npcs_just_flip_through_any_ar_42f19d: "Just flip through any articles about me."
  npc_override_lasagna_lasagna_npcs_just_glaring_him_won_t_e300a7: "Just glaring at him won't loosen his tongue."
  npc_override_lasagna_lasagna_npcs_just_go_already_713fa6: "Just go, already!"
  npc_override_lasagna_lasagna_npcs_just_like_yourself_there_af3fdf: "Just like yourself, there are a bunch of people who are crossing this mountain range these days to reach the ^4d4dffNew Continent^000000."
  npc_override_lasagna_lasagna_npcs_just_never_happened_befo_fefc17: "It just has never happened before."
  npc_override_lasagna_lasagna_npcs_just_pluck_red_grass_col_6ead62: "Just ^4d4dffpluck the Red Grass and collect 2 Red Herbs^000000 around here. That's all."
  npc_override_lasagna_lasagna_npcs_just_saying_doesn_t_hurt_6f3441: "Just saying... It doesn't hurt to say that."
  npc_override_lasagna_lasagna_npcs_just_take_you_a41da9: "Just take this with you."
  npc_override_lasagna_lasagna_npcs_just_time_i_just_moment_172da5: "Just in time. I just have a moment to spare and I'd like to keep working on my study of the cuisine in the new continent. Would you get some ingredients for me?"
  npc_override_lasagna_lasagna_npcs_just_time_since_fog_gone_ddce23: "Just in time. Since the fog is gone, we can set off soon."
  npc_override_lasagna_lasagna_npcs_kah_poltergeist_had_been_b8907b: "Kah... The poltergeist that had been sleeping inside my bag is raging!"
  npc_override_lasagna_lasagna_npcs_kahlugnag_eggring_he_mad_71af6f: "^0000cdKahlugnag^000000? That Eggring! He made this newbie do this and pull off a prank! Hey, I am sorry. Please accept my apology."
  npc_override_lasagna_lasagna_npcs_kalu_adventurers_club_wa_b28639: "Kalu from the adventurers' club wants to know why the delivery is being late. He has enough to sell for today, so everything will be fine as long as you can deliver by today."
  npc_override_lasagna_lasagna_npcs_kalu_tell_kalu_you_deliv_0869e6: "Kalu! Tell Kalu that you delivered the lunchbox so we can eat!"
  npc_override_lasagna_lasagna_npcs_kaluna_made_kaluna_maste_defac7: "Kaluna is made by a kaluna master near the south bridge. I can't tell you what exactly goes in there because It's a trade secret, but I can tell you one thing."
  npc_override_lasagna_lasagna_npcs_kaluna_milk_0711d4: "Kaluna milk?"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_62a089: "^0000cd[Kaluna Milk]^000000"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_aebcbd: "Kaluna milk!"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_also_symboli_23893a: "Kaluna milk also symbolizes ^0000cdfaith and friendship, as well as festival^000000. I can't discuss the details here, but if you're curious, go see the bookkeeper of Con-Chliina."
  npc_override_lasagna_lasagna_npcs_kaluna_milk_glass_gentle_c7dc03: "Kaluna milk! A glass for the gentleman over there!"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_shaken_4af60b: "Kaluna milk! Shaken!"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_shaken_one_g_b1514e: "Kaluna milk, shaken! One glass!"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_should_shake_031405: "Kaluna milk should be shaken."
  npc_override_lasagna_lasagna_npcs_kaluna_milk_should_shake_78babc: "Kaluna milk should be shaken. You have to shake it to taste the delicate flavor produced when adequately fermented kaluna is mixed with milk."
  npc_override_lasagna_lasagna_npcs_kaluna_milk_should_stirr_9540c2: "Kaluna milk should be stirred."
  npc_override_lasagna_lasagna_npcs_kaluna_milk_should_stirr_98ebc6: "Kaluna milk should be stirred. With many wanders flocking around here lately, there's been an increase in those who shake it. But That's how kids drink it, Isn't?"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_stirred_0b9453: "Kaluna milk, stirred!"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_stirred_glas_ebaa89: "Kaluna milk, stirred! A glass for the gentleman over there!"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_stirred_one_65ffc5: "Kaluna milk, stirred! One glass! Oh, what the heck! Two glasses!"
  npc_override_lasagna_lasagna_npcs_kaluna_milk_stirred_one_8feac2: "Kaluna milk, stirred! One glass!"
  npc_override_lasagna_lasagna_npcs_kalunyak_definitely_best_b201b5: "Kalunyak is definitely the best."
  npc_override_lasagna_lasagna_npcs_keep_hunting_eggrings_un_0cab81: "Keep hunting Eggrings until you find that box..."
  npc_override_lasagna_lasagna_npcs_keep_mind_you_need_watch_49489a: "Keep that in mind. You need to watch your manners when you deal with the crews of this ship."
  npc_override_lasagna_lasagna_npcs_keep_short_i_am_busy_7b0fcb: "Keep it short. I am busy."
  npc_override_lasagna_lasagna_npcs_keeps_crying_uncontrolla_dc6aa3: "~Keeps crying uncontrollably~ No way!! Mom!! Dad!!"
  npc_override_lasagna_lasagna_npcs_kitten_hoisted_box_given_5a3de4: "The kitten hoisted the box given to him up high, screaming out in joy"
  npc_override_lasagna_lasagna_npcs_knock_knock_da5aec: "- Knock knock -"
  npc_override_lasagna_lasagna_npcs_knock_yes_very_important_67571b: "Knock... Yes, it is very important to knock."
  npc_override_lasagna_lasagna_npcs_known_gone_missing_storm_cd22e1: "Known to have gone missing in a storm but later found to have safely arrived and established in the new world. After the news spread, Butterfly became widely known as the icon of adventure and heroes."
  npc_override_lasagna_lasagna_npcs_l_day_afdd5e: "^0000cd[L-Day]^000000"
  npc_override_lasagna_lasagna_npcs_land_we_crossed_called_f_6d007c: "The land we crossed from is called Far-Star."
  npc_override_lasagna_lasagna_npcs_lasagna_celebrates_day_a_dc92dd: "Lasagna celebrates this day annually with magnificent fireworks and festivals."
  npc_override_lasagna_lasagna_npcs_lasagna_fresh_sea_breeze_0505a9: "In Lasagna, a fresh sea breeze always tickle your whiskers."
  npc_override_lasagna_lasagna_npcs_lasagna_just_awful_when_dce583: "Lasagna was just awful when I first came here. You breathe and someone picks a fight. You walk and fights break out. Captain Gamberry went around putting the brakes on those crowds, but my first impression of him was no different from them."
  npc_override_lasagna_lasagna_npcs_lasagna_port_over_way_447802: "The Lasagna Port is over that way!"
  npc_override_lasagna_lasagna_npcs_lasagna_port_town_locate_e47357: "Lasagna is a port town located at the end of the Far-Star continent."
  npc_override_lasagna_lasagna_npcs_lasagna_s_anchovies_spec_cccd9c: "Lasagna's anchovies are special. Top quality anchovies are steamed and dried nine times, followed by removal of head and guts. This is an art work that requires delicate processes."
  npc_override_lasagna_lasagna_npcs_lasagna_somewhere_you_ju_c7e376: "Lasagna is somewhere you just drop by to make some dough when you are young. Most of them just leave this place..."
  npc_override_lasagna_lasagna_npcs_lasagna_z_400811: "To Lasagna - {0}z"
  npc_override_lasagna_lasagna_npcs_later_he_began_working_a_4701dd: "Later, he began working at an anchovy workshop."
  npc_override_lasagna_lasagna_npcs_later_he_safely_arrived_060696: "Later, he safely arrived and settled in Soft Island of the new world. He's steadily expanding his domain."
  npc_override_lasagna_lasagna_npcs_later_then_437700: "Later, then."
  npc_override_lasagna_lasagna_npcs_leaf_lunatics_grass_fabr_3cf8d6: "^4d4dff3 Leaf Lunatics and 2 Grass Fabres!^000000"
  npc_override_lasagna_lasagna_npcs_least_ten_should_caught_75780e: "At least ten should be caught."
  npc_override_lasagna_lasagna_npcs_left_click_mouse_button_8681b5: "Left-click the mouse button to talk with an NPC, move about and attack a target.^000000"
  npc_override_lasagna_lasagna_npcs_legalas_gets_rid_kalunya_fe9378: "Legalas gets rid of kalunyak's shell and puts it in a container. Then you eat from that container. Simple, right?"
  npc_override_lasagna_lasagna_npcs_legalas_i_tried_everythi_6a95cc: "Legalas, I tried everything to make them work, but they have neither the skills nor will."
  npc_override_lasagna_lasagna_npcs_let_me_drop_when_i_e22227: "Let me drop by when I get time."
  npc_override_lasagna_lasagna_npcs_let_me_explain_statuses_f87cd1: "Let me explain the statuses in detail."
  npc_override_lasagna_lasagna_npcs_let_me_give_you_brief_6aa991: "Let me give you a brief example on their correlation."
  npc_override_lasagna_lasagna_npcs_let_me_hmm_e3c613: "Let me. Hmm... {0}, it is."
  npc_override_lasagna_lasagna_npcs_let_me_record_your_profi_762fa0: "Let me record your profile now. Oh, you don't need to do anything. You may just stand there. Your name is... {0}...The height must be... and the color is... like this..."
  npc_override_lasagna_lasagna_npcs_let_me_record_your_profi_7fe664: "Let me record your profile now. Oh, you don't need to do anything. You may just stand there."
  npc_override_lasagna_lasagna_npcs_let_me_see_hum_hum_e644ff: "Let me see... Hum hum... Hmm..."
  npc_override_lasagna_lasagna_npcs_let_me_tell_you_somethin_e3655c: "Let me tell you something about our Vigilante Corp!"
  npc_override_lasagna_lasagna_npcs_let_s_all_make_toast_df95ca: "Let's all make a toast. Hold the glasses high!"
  npc_override_lasagna_lasagna_npcs_let_s_fight_bf7d5f: "Let's fight!"
  npc_override_lasagna_lasagna_npcs_let_s_get_going_f45d72: "Let's get going!"
  npc_override_lasagna_lasagna_npcs_let_s_go_208616: "Let's go!"
  npc_override_lasagna_lasagna_npcs_let_s_go_d7f55d: "Let's go."
  npc_override_lasagna_lasagna_npcs_let_s_go_see_kalu_be0062: "Let's go see Kalu. I want to go and eat something yummy."
  npc_override_lasagna_lasagna_npcs_let_s_go_then_e12a96: "Let's go then."
  npc_override_lasagna_lasagna_npcs_let_s_see_did_you_c5a3dc: "Let's see. Did you bring all the ingredients?"
  npc_override_lasagna_lasagna_npcs_let_s_see_well_story_4f0442: "Let's see. Well, the story you heard is different from the record of Pepperoncino."
  npc_override_lasagna_lasagna_npcs_let_s_see_you_must_2b1700: "Let's see, you must have met the Captain and the Chief Officer. This place must be your second stop."
  npc_override_lasagna_lasagna_npcs_let_s_send_eggling_3a0d4e: "Let's send Eggling."
  npc_override_lasagna_lasagna_npcs_let_you_practice_experim_d8b1d6: "This will let you practice and experiment which will help find the path that works for you."
  npc_override_lasagna_lasagna_npcs_like_big_hairless_cat_da2042: "Like a big, hairless cat!"
  npc_override_lasagna_lasagna_npcs_like_gateway_cannot_shou_91cfe8: "This is like a gateway. It cannot and should not be tainted by humans!"
  npc_override_lasagna_lasagna_npcs_like_our_cat_paw_commerc_6d1afd: "Like our Cat Paw Commerce Group, there are other groups who provide the ^4d4dffLocation sharing service^000000 and the ^4d4dffWarehouse service^000000."
  npc_override_lasagna_lasagna_npcs_links_created_if_there_n_9b3a18: "Links can be created if there is a need for it. If you see the [Target], click it for pathfinding.^000000"
  npc_override_lasagna_lasagna_npcs_listen_carefully_because_34e63c: "Listen carefully, because this is the most important request."
  npc_override_lasagna_lasagna_npcs_listening_other_people_s_8a979f: "Listening to other people's adventure stories is one of the virtues of an adventurer. If you can listen carefully and learn something from other people, they'll be valuable lessons on life."
  npc_override_lasagna_lasagna_npcs_little_doram_starts_whin_acdc8a: "The little Doram starts whining, secretly being conscious of the adult Doram next to him."
  npc_override_lasagna_lasagna_npcs_little_importance_a292f4: "This is of little importance..."
  npc_override_lasagna_lasagna_npcs_little_present_prepared_497384: "It is the little present prepared for the novice adventurer by the leader of Farfalle vigilante corps and the captain of Con-Chliina in celebration of the first mission."
  npc_override_lasagna_lasagna_npcs_living_history_lasagna_42daad: "The living history of Lasagna."
  npc_override_lasagna_lasagna_npcs_ll_restore_your_stamina_083165: "It'll restore your stamina if you take it when you're tired."
  npc_override_lasagna_lasagna_npcs_location_sharing_save_lo_c7bf5f: "^4d4dffLocation sharing^000000 is to save the location for you to return to."
  npc_override_lasagna_lasagna_npcs_location_sharing_service_fc3433: "Location sharing service"
  npc_override_lasagna_lasagna_npcs_long_ago_feels_like_happ_56e0a5: "Not long ago. It feels like it happened just yesterday."
  npc_override_lasagna_lasagna_npcs_long_ago_when_there_shel_52db20: "That was long ago, when there was a shell on an eggring."
  npc_override_lasagna_lasagna_npcs_long_awaited_first_voyag_c0e2d8: "The long-awaited first voyage. After unloading everything, I hope we return as full ship again..."
  npc_override_lasagna_lasagna_npcs_longest_which_had_taken_75e211: "It was the longest which had taken a long time and effort."
  npc_override_lasagna_lasagna_npcs_look_i_m_basilisk_897686: "Look, I'm not a basilisk."
  npc_override_lasagna_lasagna_npcs_look_lasagna_out_there_9e3025: "Look at Lasagna out there."
  npc_override_lasagna_lasagna_npcs_look_lasagna_what_you_th_b2edef: "Look at Lasagna. What do you think?"
  npc_override_lasagna_lasagna_npcs_look_over_there_man_slee_a61ba8: "Look over there. The man sleeping on the floor who seems so far from being a gentleman. ^0000cdHe is our Head Chef^000000. The captain has always said how we have to do our best at what we do. But no use."
  npc_override_lasagna_lasagna_npcs_look_sunlight_76707d: "But look. The sunlight."
  npc_override_lasagna_lasagna_npcs_looks_delicious_8bb825: "That looks delicious..."
  npc_override_lasagna_lasagna_npcs_looks_huge_heavy_go_get_2a71e8: "It looks huge and heavy. Go and get rid of some."
  npc_override_lasagna_lasagna_npcs_looks_like_my_son_caused_12fe1c: "It looks like my son caused some trouble for you."
  npc_override_lasagna_lasagna_npcs_looks_like_two_sent_deli_fe3c1c: "Looks like the two can be sent to the delivery team while Legalas is working. For wage, a meal per day would do."
  npc_override_lasagna_lasagna_npcs_looks_like_you_got_seasi_5d6a88: "Looks like you got a seasickness. It'll get better after a while. By then, you'll feel strange when you walk on land."
  npc_override_lasagna_lasagna_npcs_looks_lot_large_how_abou_df5e8b: "It looks a lot and large. How about cutting down some?"
  npc_override_lasagna_lasagna_npcs_lord_imuk_did_you_say_bc5415: "Lord Imuk... Did you say you lived for 2,500 years?"
  npc_override_lasagna_lasagna_npcs_lost_record_about_story_d9ac72: "The lost record was about the story of Captain Gamberi before he became the captain of Con-Chliina, which was very rare."
  npc_override_lasagna_lasagna_npcs_lot_legalas_you_aware_le_ee0107: "It has a lot to do with Legalas. You are aware that Legalas supplies Kalu with kaluna fermented from kalunyak, right?"
  npc_override_lasagna_lasagna_npcs_low_grade_horse_mackerel_bb5b3b: "Low-grade Horse Mackerel Amulet"
  npc_override_lasagna_lasagna_npcs_luk_means_luck_more_luck_52a38a: "^4d4dffLUK means luck; the more luck you have, the higher your critical hit rate (CRI) becomes^000000."
  npc_override_lasagna_lasagna_npcs_m_me_too_874372: "M-me, too?"
  npc_override_lasagna_lasagna_npcs_machie_ec0401: "Machie?"
  npc_override_lasagna_lasagna_npcs_magchi_injured_during_pa_9f36b8: "Magchi was injured during a patrol and went back."
  npc_override_lasagna_lasagna_npcs_magchi_injured_during_pa_f93dba: "Magchi was injured during a patrol and went back. And I'm from the new world."
  npc_override_lasagna_lasagna_npcs_magchi_just_drove_off_ba_f13586: "Magchi just drove off the basilisks that came this way every day. That was enough, but without Magchi, they are bothering me again. So annoying."
  npc_override_lasagna_lasagna_npcs_magchi_tells_me_s_short_557cce: "Magchi tells me that It's a short, intensive program. But would that be enough? You went through a hell of a training while taking down those basilisks, so you're no longer a rookie."
  npc_override_lasagna_lasagna_npcs_magchi_used_fight_off_ba_3e0ff4: "Magchi used to fight off the basilisks that came this way every day. Without Magchi, they're being troublesome today. So annoying."
  npc_override_lasagna_lasagna_npcs_make_him_talk_9dc0bf: "Make him talk."
  npc_override_lasagna_lasagna_npcs_make_sure_knock_keep_you_326ed5: "Make sure to knock. Keep your manners."
  npc_override_lasagna_lasagna_npcs_make_sure_you_deliver_my_0545b3: "Make sure you deliver my message to the boatswain. And today's talisman is 20 basils and 5 basil locks."
  npc_override_lasagna_lasagna_npcs_makes_whiffing_sound_32aa8b: "~Makes a whiffing sound~"
  npc_override_lasagna_lasagna_npcs_matk_msp_81a01f: "MATK + 70, MSP + 50."
  npc_override_lasagna_lasagna_npcs_mature_doram_doesn_t_hol_17cdab: "A mature Doram doesn't hold on to such things. You may go. We are about to set off."
  npc_override_lasagna_lasagna_npcs_may_great_help_you_a1ddaa: "This may be of great help to you!"
  npc_override_lasagna_lasagna_npcs_may_help_you_ease_your_acef58: "It may help you ease your nerve to walk around the ship. As long as you watch your manners, everyone will welcome you."
  npc_override_lasagna_lasagna_npcs_may_i_ask_more_favors_8b1702: "May I ask more favors next time? You know, the ingredients."
  npc_override_lasagna_lasagna_npcs_may_i_help_you_5a540b: "May I help you?"
  npc_override_lasagna_lasagna_npcs_maybe_our_chief_should_c_a32d2b: "Maybe our chief should be called the mayor instead."
  npc_override_lasagna_lasagna_npcs_maybe_tomorrow_5d0244: "Maybe tomorrow."
  npc_override_lasagna_lasagna_npcs_me_ed250f: "Not me!"
  npc_override_lasagna_lasagna_npcs_me_let_me_explain_i_eda66c: "Me? Let me explain. I'm the proud member of the Farfalle Vigilante from the great Far-Star Continent."
  npc_override_lasagna_lasagna_npcs_me_too_ab2985: "Me too."
  npc_override_lasagna_lasagna_npcs_me_too_b7bada: "Me, too."
  npc_override_lasagna_lasagna_npcs_me_you_look_like_greenho_601aaf: "To me, you look like a greenhorn who's simply acting out."
  npc_override_lasagna_lasagna_npcs_me_you_look_like_newbie_d0a181: "To me, you look like a newbie adventurer who has just crossed the mountain ridge, meeow."
  npc_override_lasagna_lasagna_npcs_means_customers_who_came_95a30b: "It means customers who came for kaluna milk would have made their trip in vain."
  npc_override_lasagna_lasagna_npcs_means_you_no_longer_rece_c7dcda: "- That means you can no longer receive any items. -"
  npc_override_lasagna_lasagna_npcs_meanwhile_earth_element_133697: "Meanwhile, Earth element definitely outperforms Wind element."
  npc_override_lasagna_lasagna_npcs_meeow_55d669: "Meeow...."
  npc_override_lasagna_lasagna_npcs_meeow_another_out_towner_f6506d: "Meeow?? Is this another out-of-towner Doram that I haven't met before?"
  npc_override_lasagna_lasagna_npcs_meeowww_9b27bc: "....Meeowww...."
  npc_override_lasagna_lasagna_npcs_menu_options_55a293: "{0} : No, I have not."
  npc_override_lasagna_lasagna_npcs_menu_options_af55f8: "{0} : Pardon???"
  npc_override_lasagna_lasagna_npcs_menu_the_df1af5: "The amulet is still effective. Go to see Shamanyang after ^0000cd4:00 am^000000 and bring me tomorrow's amulet."
  npc_override_lasagna_lasagna_npcs_menu_they_2aee31: "They are: ^4d4dffKafra^000000 and ^4d4dffZonda^000000."
  npc_override_lasagna_lasagna_npcs_menu_vigilante_0b9851: "Vigilante Guide: Welcome to the port town Lasagna."
  npc_override_lasagna_lasagna_npcs_menu_vigilante_48f119: "Vigilante Guide: If you're ever in need of help, please visit the Vigilante Corp at any time."
  npc_override_lasagna_lasagna_npcs_menu_years_a6ea1f: "3 years ago: decided to set sail"
  npc_override_lasagna_lasagna_npcs_meow_hey_new_friend_i_ef2d22: "Meow! Hey, a new friend! I've got a story to tell you. You don't want to miss this!"
  npc_override_lasagna_lasagna_npcs_meow_meow_17cce8: "Meow meow."
  npc_override_lasagna_lasagna_npcs_meow_meow_a4da0c: "Meow meow"
  npc_override_lasagna_lasagna_npcs_meow_meow_meow_meow_meow_50e5bb: "Meow meow meow meow meow meow!!!"
  npc_override_lasagna_lasagna_npcs_midgard_been_discovered_c2da02: "Midgard has been discovered, so I wonder if there's any other place out there. Place where we've never been to and not on the map."
  npc_override_lasagna_lasagna_npcs_minute_i_catch_kalunyak_631c34: "The minute I catch kalunyak, you two devour it! You even ate the ones I had cleaned!"
  npc_override_lasagna_lasagna_npcs_minute_i_landed_new_worl_0d6949: "The minute I landed on the new world, I went right back to the boat. Just loved the food..."
  npc_override_lasagna_lasagna_npcs_minute_i_saw_guide_new_ff7e8e: "The minute I saw it on [A Guide for New Adventurers to the New World], I promised myself that I would go! I heard It's got wonderful landscapes!"
  npc_override_lasagna_lasagna_npcs_mix_moderate_temperate_g_9e5f9e: "Mix that in moderate temperate and garnish with a gooseberry. And then you get the kaluna milk that everyone loves."
  npc_override_lasagna_lasagna_npcs_mixed_stew_enhances_vit_020beb: "The ^0000cd Mixed Stew.^000000 It enhances ^0000cdVit^000000. It really fills you up so you don't feel mush pain even when you are hit by the monster."
  npc_override_lasagna_lasagna_npcs_mixing_usually_done_stir_3d36dc: "Mixing is usually done by stirring or shaking, but there is never-ending argument about these two methods."
  npc_override_lasagna_lasagna_npcs_mm_good_area_settled_now_5981ad: "Mm...good. This area is settled now. You're really good at this."
  npc_override_lasagna_lasagna_npcs_mm_i_understand_so_you_a61ec3: "Mm... I understand. So you have no intention of giving up until you get that Yeouiju. I'll ask Tartufi about Yeouiju."
  npc_override_lasagna_lasagna_npcs_mom_dad_i_miss_you_421a22: "Mom, dad... I miss you."
