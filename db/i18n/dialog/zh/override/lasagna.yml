  npc_override_lasagna_lasagna_npcs_didn_t_i_tell_you_7c9958: "didn't I tell you just before? He took care of it completely. I gathered those lousy dorams and spoke to them. They were so touched by my speech that they volunteered to join the vigilance corps."
