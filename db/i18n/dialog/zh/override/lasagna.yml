  npc_override_lasagna_lasagna_npcs_ever_since_head_chef_ent_d170ce: "Ever since, the Head Chef entrusted me with everything."
  npc_override_lasagna_lasagna_npcs_ever_since_we_been_only_18e3c5: "Ever since, we have been not only leading the trade with the new continent but also connecting the continents. The adventurers from both continents use ^0000cdCon-Chliina^000000, and we are proud of it."
  npc_override_lasagna_lasagna_npcs_every_life_world_comes_p_24a47e: "Every life in this world comes with a property."
  npc_override_lasagna_lasagna_npcs_every_night_i_saw_dim_a9a4b6: "Every night, I saw a dim silhouette or couldn't fall asleep because of the chattering noise in my ear. When I did fall asleep, I felt this weight on my body and woke up, covered in cold sweats."
  npc_override_lasagna_lasagna_npcs_every_time_i_see_boat_0aa379: "Every time I see a boat, it reminds me of a shell. You know, the one that is empty inside and hard outside."
  npc_override_lasagna_lasagna_npcs_everyone_keep_away_i_m_72c993: "Everyone keep away! I'm dangerous. Krahh! How long can the tri-colored anchovies hold off?!"
  npc_override_lasagna_lasagna_npcs_everyone_keep_away_i_m_b6d260: "Everyone keep away! I'm dangerous."
  npc_override_lasagna_lasagna_npcs_everyone_orders_kaluna_m_f9b838: "Everyone orders kaluna milk here because of the oven resolution by Peperoncino, Gamberry, and Thomas. But Pub-Oven's real specialty menu is the fish cake."
  npc_override_lasagna_lasagna_npcs_everyone_recommended_i_s_bc8cec: "Everyone recommended that I should ask you for stories on Lasagna and Farfalle Vigilantes."
  npc_override_lasagna_lasagna_npcs_everyone_says_i_hear_adv_bb3b6f: "Everyone says that I can hear the adventure stories regarding Lasagna and Con-Chliina from you."
  npc_override_lasagna_lasagna_npcs_everyone_should_know_whe_ad5d5f: "Everyone should know where to get it in order to carry it. Where can I get it?"
  npc_override_lasagna_lasagna_npcs_everyone_treats_me_like_ce3548: "Everyone treats me like a new eggring, but I've also completed a formal training course!"
  npc_override_lasagna_lasagna_npcs_everyone_your_position_w_46a3ad: "Everyone, in your position! We are sailing off now!"
