  npc_override_lasagna_lasagna_npcs_low_grade_leaf_amulet_4b838f: "低级叶子护符"
  npc_override_lasagna_lasagna_npcs_low_grade_rabbit_amulet_e10401: "低级兔子护符"
  npc_override_lasagna_lasagna_npcs_luk_means_luck_more_luck_52a38a: "^4d4dffLUK 代表幸运；幸运越高，暴击率（CRI）就越高^000000。"
  npc_override_lasagna_lasagna_npcs_m_me_too_874372: "我——我也是？"
  npc_override_lasagna_lasagna_npcs_machie_ec0401: "马奇？"
  npc_override_lasagna_lasagna_npcs_magchi_injured_during_pa_9f36b8: "马奇在巡逻时受伤，回去了。"
  npc_override_lasagna_lasagna_npcs_magchi_injured_during_pa_f93dba: "马奇在巡逻时受伤，回去了。而我来自新世界。"
  npc_override_lasagna_lasagna_npcs_magchi_just_drove_off_ba_f13586: "马奇每天都会驱赶那些来这里的巴西利斯克。那样就足够了，但没有马奇之后，它们又来烦我了。真烦人。"
  npc_override_lasagna_lasagna_npcs_magchi_tells_me_s_short_557cce: "马奇告诉我这是一个短期的强化课程。但那够吗？你在消灭那些巴西利斯克的时候经历了一场地狱般的训练，所以你不再是个新手了。"
  npc_override_lasagna_lasagna_npcs_magchi_used_fight_off_ba_3e0ff4: "马奇过去常常击退每天来这里的巴西利斯克。没有马奇，它们今天很麻烦。真烦人。"
  npc_override_lasagna_lasagna_npcs_main_characters_733e79: "主要角色"
