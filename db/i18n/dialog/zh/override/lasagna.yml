  npc_override_lasagna_lasagna_npcs_moreover_s_dangerous_cro_7aaa21: "Moreover, it's dangerous to cross the mountain ridge."
  npc_override_lasagna_lasagna_npcs_moreover_you_come_mid_mi_46b580: "Moreover, you can come to this...Mid...Midgur...Midgar..."
  npc_override_lasagna_lasagna_npcs_most_cherished_moment_my_ee278f: "It was the most cherished moment of my lift."
  npc_override_lasagna_lasagna_npcs_most_ferocious_heinous_b_1e8fb8: "The most ferocious, heinous and brutal basilisk. This thing was dangerous. It was the scariest basilisk that I had ever seen. I had sprained my ankle out of fear."
  npc_override_lasagna_lasagna_npcs_most_locations_shared_sa_3853a2: "Most of the locations shared are the safe village or city."
  npc_override_lasagna_lasagna_npcs_most_notoriously_my_elde_7eab00: "Most notoriously, my elder and younger brother can be a real pain in my neck!"
  npc_override_lasagna_lasagna_npcs_most_people_lasagna_work_d3f300: "Most people in Lasagna work for the vigilante corps or merchants, so the town is always short on hands."
  npc_override_lasagna_lasagna_npcs_most_people_who_knew_pas_b20974: "Most of the people who knew the past of Captain Gamberi have left Lasagna. There is almost no one who knows the past here now."
  npc_override_lasagna_lasagna_npcs_most_representative_elem_b18149: "Most representative elements are the natural ones."
