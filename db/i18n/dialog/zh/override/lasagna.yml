  npc_override_lasagna_lasagna_npcs_team_efb7f5: "Team!"
  npc_override_lasagna_lasagna_npcs_team_must_move_as_one_c4b4ef: "A team must move as one."
  npc_override_lasagna_lasagna_npcs_tell_me_your_name_a31832: "Tell me your name."
  npc_override_lasagna_lasagna_npcs_tell_young_one_about_yeo_5fca40: "Tell the young one about Yeouiju. I must continue with my training so do not disturb me and go away."
  npc_override_lasagna_lasagna_npcs_terrible_back_then_7dded2: "It was terrible back then!"
  npc_override_lasagna_lasagna_npcs_thank_you_174534: "Thank you."
  npc_override_lasagna_lasagna_npcs_thank_you_boarding_con_c_11e5ad: "Thank you for boarding on Con-Chliina. Please enjoy a safe and comfortable trip to your destination!"
  npc_override_lasagna_lasagna_npcs_thank_you_bringing_them_5ef17c: "Thank you for bringing them to me. Thanks to you, the food of Lasagna can take another step forward."
  npc_override_lasagna_lasagna_npcs_thank_you_bringing_them_a230fa: "Thank you for bringing them to me. Thanks to you, the crews of Con-Chliina can have some fresh food."
  npc_override_lasagna_lasagna_npcs_thank_you_finding_box_1049a8: "Thank you for finding the box!"
  npc_override_lasagna_lasagna_npcs_thank_you_form_getting_t_4e16d2: "Thank you form getting them for me. Now Con-Chliina can come up with our own ways to store food for a long time."
  npc_override_lasagna_lasagna_npcs_thank_you_getting_them_m_b77fb4: "Thank you for getting them for me. Please come back tomorrow."
  npc_override_lasagna_lasagna_npcs_thank_you_now_our_cows_9d04e7: "Thank you. Now our cows can enjoy delicious meal."
  npc_override_lasagna_lasagna_npcs_thank_you_so_much_093766: "Thank you so much!"
  npc_override_lasagna_lasagna_npcs_thank_you_so_much_i_2f5beb: "Thank you so much. I hope you can help us again next time. So what'd you say? Please give it a thought."
  npc_override_lasagna_lasagna_npcs_thank_you_so_much_i_ec1920: "Thank you so much. I bet they'll be scared to show up for a while."
  npc_override_lasagna_lasagna_npcs_thank_you_using_our_serv_2e9c55: "Thank you for using our service."
  npc_override_lasagna_lasagna_npcs_thank_you_your_help_3a7d59: "Thank you for your help."
  npc_override_lasagna_lasagna_npcs_thank_you_your_time_f99122: "Thank you for your time."
