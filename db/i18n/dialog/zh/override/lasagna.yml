  npc_override_lasagna_lasagna_npcs_i_ll_give_you_some_2f6ed7: "我会给你一些^0000cd卡鲁纳牛奶^000000，这是所有来过千层面的喵族都渴望的。非常感谢你的努力。"
  npc_override_lasagna_lasagna_npcs_i_ll_help_you_f61b77: "我来帮你。"
  npc_override_lasagna_lasagna_npcs_i_ll_help_you_what_81b1cc: "我会尽我所能帮你！"
  npc_override_lasagna_lasagna_npcs_i_ll_join_militia_become_b8d00b: "我要加入民兵队，成为像我父母一样伟大的人！"
  npc_override_lasagna_lasagna_npcs_i_ll_just_pretend_you_95f75f: "我就当你没说！我才不在乎萨满喵说的那些恶意的话！"
  npc_override_lasagna_lasagna_npcs_i_ll_let_slide_since_b2bc4f: "既然你帮了我，我就不计较了。明天再见。"
