  npc_override_lasagna_lasagna_npcs_finally_689f10: "Finally!"
  npc_override_lasagna_lasagna_npcs_fine_anywhere_as_long_as_b646d1: "Fine. Anywhere as long as It's not boring."
  npc_override_lasagna_lasagna_npcs_fine_i_ll_see_if_a8c36b: "Fine. I'll see if there are any babies around here. There is some type of ^0000cdplayground^000000 above the pub. I'll take a look there."
  npc_override_lasagna_lasagna_npcs_fine_if_you_any_chance_b996b5: "Fine. If you by any chance find that Yeouiju, please tell Lord Imuk."
  npc_override_lasagna_lasagna_npcs_fine_you_re_boarding_shi_37feeb: "Fine. You're boarding on a ship, right? I hope you get to your destination safely."
