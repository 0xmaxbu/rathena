  npc_override_lasagna_lasagna_npcs_business_good_everywhere_0c8838: "Business is good everywhere we go. I'm amazed by the insight of Captain Peperoncino and his crewmen."
  npc_override_lasagna_lasagna_npcs_business_we_started_sell_fc28a0: "The business we started was to ^0000cdsell the specialty products of Lasagna in other cities^000000. It went well, and we hired more people to expand the size of the business."
