  npc_override_lasagna_lasagna_npcs_taking_ship_dock_search_9d9331: "Taking a ship from the ^4D4DFF[dock]^000000 in search of a bigger adventure is also a good idea. Thank you for helping us."
  npc_override_lasagna_lasagna_npcs_tali_brought_these_sayin_9b1cd6: "And Tali brought these, saying there was a lot of cloths left over."
