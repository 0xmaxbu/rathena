  npc_override_lasagna_lasagna_npcs_much_please_take_s_token_23019c: "This is not much, but please take it. It's a token of my appreciation."
  npc_override_lasagna_lasagna_npcs_must_somewhere_near_here_359321: "It must be somewhere near here that can communicate with Imoogi."
  npc_override_lasagna_lasagna_npcs_must_ve_been_lot_work_1a68bc: "It must've been a lot of work."
  npc_override_lasagna_lasagna_npcs_my_brothers_pretty_mean_390b7a: "My brothers can be pretty mean. So I try my best to obey what Dandi tells me to."
  npc_override_lasagna_lasagna_npcs_my_dad_i_mean_chef_31e04d: "My dad, I mean, Chef, told me to get mushroom spores or something..."
  npc_override_lasagna_lasagna_npcs_my_dad_i_mean_chef_94cc16: "My dad, I mean, Chef, gave me a training on entering caves so he can use me for such tasks meow."
  npc_override_lasagna_lasagna_npcs_my_dexterity_tougher_tad_456617: "But my dexterity is tougher. Tada! Put my brother's amulet to good use."
  npc_override_lasagna_lasagna_npcs_my_dream_almost_propheti_993656: "My dream is almost prophetic. So stop what you were doing and go to the ^4D4DFF[dock]^000000 to board on a ship heading to the new world. A bigger adventure will be waiting for you there meow."
  npc_override_lasagna_lasagna_npcs_my_duty_lead_those_bad_1e179c: "It was my duty to ^0000cdlead those bad Dorams into the right path^000000."
  npc_override_lasagna_lasagna_npcs_my_family_members_very_l_a54169: "My family members are very lazy. Unless I train them based on my strong belief, they can never become warriors."
  npc_override_lasagna_lasagna_npcs_my_father_born_seaman_so_cd6c9d: "My father was a born seaman so went out into the sea a long time ago, saying he'll catch the world's largest tuna."
  npc_override_lasagna_lasagna_npcs_my_friend_you_re_quick_46c05c: "My friend, you're quick and sensible. Yes, please get some mushroom spores."
  npc_override_lasagna_lasagna_npcs_my_guess_eggring_must_ve_7eaae6: "My guess is that an ^4d4dffEggring must've eaten that box.^000000"
  npc_override_lasagna_lasagna_npcs_my_hometown_wasn_t_like_941c13: "My hometown wasn't like that."
  npc_override_lasagna_lasagna_npcs_my_house_invisible_priso_13d561: "My house was the invisible prison trapping me inside and I was a bird longing for freedom..."
  npc_override_lasagna_lasagna_npcs_my_hunch_never_wrong_67ab1b: "My hunch is never wrong."
  npc_override_lasagna_lasagna_npcs_my_mom_dad_told_me_f04d41: "My mom and dad told me over and over again."
  npc_override_lasagna_lasagna_npcs_my_mother_collector_so_s_a47f0c: "My mother can be a collector so she would go into the deepmost side of the forest, looking for the odd fruits. She would come and go even before I know it."
  npc_override_lasagna_lasagna_npcs_my_name_10a387: "My name is {0}."
  npc_override_lasagna_lasagna_npcs_my_parents_keep_going_ou_dc6003: "...My parents keep going out into the dangerous areas. I'm still a child to help them, so what I do is to make these amulets for them."
  npc_override_lasagna_lasagna_npcs_my_sister_told_me_my_49ca01: "My sister told me my parents are warriors! They left for a huge adventure!!"
  npc_override_lasagna_lasagna_npcs_my_story_why_you_curious_f561b4: "My story... Why are you curious? But since you asked, I'll tell you. I was born outside of Lasagna called ^0000cdFusilli^000000. Back then, you mention the name Peperoncino and everyone in Fusilli knew."
  npc_override_lasagna_lasagna_npcs_my_strings_still_aren_t_844949: "My strings still Aren't here. It must be those Desert Wolves again."
  npc_override_lasagna_lasagna_npcs_n_no_way_7913a9: "N-no way!"
  npc_override_lasagna_lasagna_npcs_nah_my_mom_held_my_521ab6: "Nah. My mom held my hand and came here just by riding on the tides. She was swept away and I landed here alone. Legalas found me and since then, we've been living together like a family."
  npc_override_lasagna_lasagna_npcs_native_lasagna_brought_u_822141: "Native of Lasagna, brought up affluently thanks to his wealthy parents."
  npc_override_lasagna_lasagna_npcs_navi_dragon_s_nest_info_5564d3: "The <NAVI>^4D4DFF[Dragon's Nest]^000000<INFO>lasa_fild02,340,244,000,1,</INFO></NAVI> is in the cave on the right side. Come with me then."
  npc_override_lasagna_lasagna_npcs_never_e29869: "Never."
  npc_override_lasagna_lasagna_npcs_new_adventurer_polite_do_817248: "A new adventurer. A polite Doram always knocks before entering. Since you must be nervous before the adventure, I'll let it slide this time."
  npc_override_lasagna_lasagna_npcs_new_adventures_yours_cha_ef6655: "The new adventures are yours to challenge."
  npc_override_lasagna_lasagna_npcs_new_continent_new_contin_a59cd9: "The new continent! The new continent!"
  npc_override_lasagna_lasagna_npcs_new_day_just_begun_so_9a2206: "A new day has just begun, and so will the wild hornets with their activities."
  npc_override_lasagna_lasagna_npcs_nice_meet_you_64753c: "Nice to meet you."
  npc_override_lasagna_lasagna_npcs_nice_meet_you_i_am_305f0d: "Nice to meet you. I am the Recorder of this ship who is in charge of all records of this ship. You may come by whenever you have a question. You are free to access any records except the classified ones."
  npc_override_lasagna_lasagna_npcs_nice_rest_come_back_agai_c8b6ae: "Have a nice rest and come back again tomorrow."
  npc_override_lasagna_lasagna_npcs_nice_work_story_matches_0f489f: "Nice work. The story matches some of the details I remember. He sure is a living history. I guess I should fill in the records based on the story."
  npc_override_lasagna_lasagna_npcs_nickname_berry_b4b1bf: "Nickname is Berry."
  npc_override_lasagna_lasagna_npcs_nickname_pepe_2a011c: "Nickname is Pepe."
  npc_override_lasagna_lasagna_npcs_nickname_toto_935e55: "Nickname is Toto."
  npc_override_lasagna_lasagna_npcs_no_9f92cd: "No?"
  npc_override_lasagna_lasagna_npcs_no_adventurer_faint_hear_1e3619: "No adventurer with a faint heart ever survived on the New Continent!"
  npc_override_lasagna_lasagna_npcs_no_adventurer_waiting_sa_7747b5: "No, the adventurer waiting for the sailing. I guess the ship is not setting off because of the fog. This guy came here to check things out."
  npc_override_lasagna_lasagna_npcs_no_all_captain_what_you_bebadf: "No, not at all. Captain, what are you talking about?"
  npc_override_lasagna_lasagna_npcs_no_attack_work_if_you_5d444c: "No attack will work if you miss the target!"
  npc_override_lasagna_lasagna_npcs_no_b8b9f1: "No."
  npc_override_lasagna_lasagna_npcs_no_clue_i_ve_never_6f73a9: "No clue. I've never heard of it."
  npc_override_lasagna_lasagna_npcs_no_customers_my_pub_soon_1f8d9c: "With no customers, my pub will soon be out of business."
  npc_override_lasagna_lasagna_npcs_no_don_t_insult_them_7ce8bf: "No, don't insult them. It's this place That's unusual."
  npc_override_lasagna_lasagna_npcs_no_don_t_you_know_0d802a: "No. don't you know? It is a lyric from this latest hit. Oh, please, don't act like you are from some rural town. What would they think of us all?"
  npc_override_lasagna_lasagna_npcs_no_don_t_you_know_f2aa25: "No. don't you know? It is a lyric from this latest hit. Oh, please, don't act like you are from some rural town. What would they think of us all? Anyways, what about the thing you are supposed to bring? Do you have it?"
  npc_override_lasagna_lasagna_npcs_no_i_found_thief_already_3e7c03: "No. I have found the thief already. I plan to punish him in the most painful way possible. However, there are things I have to take care of before that. That's why I am keeping it quiet."
  npc_override_lasagna_lasagna_npcs_no_i_hope_someone_carrie_b0c707: "No. I hope someone carries me on his back..."
  npc_override_lasagna_lasagna_npcs_no_i_really_wanted_join_097bc0: "No! I really wanted to join!"
  npc_override_lasagna_lasagna_npcs_no_missing_pages_been_fo_d14625: "No. The missing pages have been found. In the oven of the kitchen."
  npc_override_lasagna_lasagna_npcs_no_more_humans_allowed_7cdcba: "No more humans are allowed!"
  npc_override_lasagna_lasagna_npcs_no_my_mom_dad_left_768133: "No. My mom and dad left just recently. I must stay here and grow up a bit more. Sleep a lot and eat a lot. Once I become strong and tough, I'll go for a sightseeing."
  npc_override_lasagna_lasagna_npcs_no_need_know_about_your_ad8681: "No need to know about your past. I just need you to do a good job on the ship. Since this is the first time on a boat for both of you, looks like there's a long bumpy road ahead."
  npc_override_lasagna_lasagna_npcs_no_never_i_don_t_2f34b6: "No, never. I don't intend to be friends with Shaman meow or hunt the basilisks myself."
  npc_override_lasagna_lasagna_npcs_no_never_mind_201874: "No, never mind!"
  npc_override_lasagna_lasagna_npcs_no_never_mind_c36804: "No, never mind."
  npc_override_lasagna_lasagna_npcs_no_never_mind_me_abf6ca: "No, never mind me..."
  npc_override_lasagna_lasagna_npcs_no_news_still_4d9190: "No news still."
  npc_override_lasagna_lasagna_npcs_no_no_i_m_saying_828f16: "No, no. I'm not saying what you did was wrong. But can you tell me more about that?"
  npc_override_lasagna_lasagna_npcs_no_no_more_b2bc55: "No! No more!"
  npc_override_lasagna_lasagna_npcs_no_no_never_you_cannot_cf38e9: "No, no, never. You cannot get out of this like that. ^0000cdIt must have been our destiny.^000000 It is a fate! You should help me."
  npc_override_lasagna_lasagna_npcs_no_no_person_won_t_ce88e8: "No, no - that person won't hurt you-"
  npc_override_lasagna_lasagna_npcs_no_no_s_most_popular_2e8285: "No, no. That's the most popular menu. What I mean is... right! Chef's specialty menu is what I meant."
  npc_override_lasagna_lasagna_npcs_no_one_knows_what_howeve_cf22a9: "No one knows what it is. However, all sailors have it. You should really stop asking. Go get it now. I give 10 seconds."
  npc_override_lasagna_lasagna_npcs_no_other_crews_con_chlii_5b5727: "No other crews of Con-Chliina, except Captain Gamberi and I, know about this."
  npc_override_lasagna_lasagna_npcs_no_prob_farewell_then_69d089: "No prob. Farewell, then."
  npc_override_lasagna_lasagna_npcs_no_s_6bfbe1: "No, That's not it!!"
  npc_override_lasagna_lasagna_npcs_no_s_nothing_da2af9: "No, it's nothing."
  npc_override_lasagna_lasagna_npcs_no_s_okay_i_ll_fc1129: "No, It's okay. I'll keep my mouth shut now."
  npc_override_lasagna_lasagna_npcs_no_sailing_while_c1a74c: "No sailing for a while."
  npc_override_lasagna_lasagna_npcs_no_snake_roast_6888cc: "No snake roast!"
  npc_override_lasagna_lasagna_npcs_no_such_thing_i_m_3203cc: "No such thing. I'm hungry."
  npc_override_lasagna_lasagna_npcs_no_surprise_there_938b70: "No surprise there!"
  npc_override_lasagna_lasagna_npcs_no_they_re_both_well_051654: "No, they're both well and still in Lasagna. I'm here because there is something I wanted to know about Captain Gamberry."
  npc_override_lasagna_lasagna_npcs_no_wait_a3ea2e: "No, wait!"
  npc_override_lasagna_lasagna_npcs_no_wonder_fog_smells_lik_05576e: "No wonder the fog smells like smoke."
  npc_override_lasagna_lasagna_npcs_no_yet_they_keep_coming_924203: "No, not yet. They keep coming. I said not yet."
  npc_override_lasagna_lasagna_npcs_nonsense_who_else_take_c_d2312b: "Nonsense! Who else would take care of the seaway to the new continent?"
  npc_override_lasagna_lasagna_npcs_nope_afd5b9: "Nope."
  npc_override_lasagna_lasagna_npcs_nothing_don_t_you_other_a52ef1: "Nothing! don't you have other things to do?"
  npc_override_lasagna_lasagna_npcs_nothing_like_happened_if_c4e977: "Nothing like this would have happened if that guy just left the basilisks alone. Well, go ahead."
  npc_override_lasagna_lasagna_npcs_nothing_me_00e11f: "That has nothing to do with me."
  npc_override_lasagna_lasagna_npcs_nothing_up_quiet_shoal_f_a840ca: "Nothing is up. Quiet. A shoal of flying fish over the ocean cast with full moon is just spectacular to watch."
  npc_override_lasagna_lasagna_npcs_notice_b6a240: "!- Notice -!"
  npc_override_lasagna_lasagna_npcs_now_follow_after_me_grab_a64010: "Now, follow after me. Grab an anchovy. Remove its head. Pull out the guts. Put it inside the container."
  npc_override_lasagna_lasagna_npcs_now_i_think_about_i_b1618c: "Now that I think about it, I've always wanted to do something ^0000cdrelated to anchovies^000000. Anchovies are yummy."
  npc_override_lasagna_lasagna_npcs_now_look_someone_here_be_45400e: "Now look! Someone is here because I couldn't make the delivery! I'm ruined now! I'll starve to death!"
  npc_override_lasagna_lasagna_npcs_now_now_calm_down_how_827d51: "Now now, calm down. How does it feel to be on a ship? It carries anchovies from the anchovy fishing boat to Lasagna, but you won't get to see them since the cargo is stored in the storage area."
  npc_override_lasagna_lasagna_npcs_now_our_cows_lots_tasty_7ea454: "Now our cows can have lots of tasty grasses. Thank you."
  npc_override_lasagna_lasagna_npcs_now_teach_us_7cb16c: "Now, teach us."
  npc_override_lasagna_lasagna_npcs_now_they_massive_fleet_d2913e: "But now, they have a massive fleet!"
  npc_override_lasagna_lasagna_npcs_now_time_see_head_chef_fa9318: "Now is the time to see the ^0000cdHead Chef, the Helmsman and the Boatswain^000000. They must be in the ^0000cddining room^000000 at the end of the hallway. Have a safe voyage."
  npc_override_lasagna_lasagna_npcs_now_we_talking_b5485a: "Now we are talking."
  npc_override_lasagna_lasagna_npcs_now_we_ve_checked_your_262218: "Now that we've checked your weapons, why don't we take a look at a target to hunt?"
  npc_override_lasagna_lasagna_npcs_now_you_get_4be9f3: "Now do you get it?"
  npc_override_lasagna_lasagna_npcs_now_you_know_how_equip_90b7b4: "Now you know how to equip an item because I already explained it to you, don't you?"
  npc_override_lasagna_lasagna_npcs_now_you_know_how_use_2e687d: "...Now you know how to use skills."
  npc_override_lasagna_lasagna_npcs_now_young_one_hiding_yeo_ccb347: "And now, that young one is hiding Yeouiju somewhere and seeking for a chance to ascend after 500 years. I will regain what's mine. My rights are justified."
  npc_override_lasagna_lasagna_npcs_nya_nya_nya_problem_7ae0ad: "Nya nya nya... A problem."
  npc_override_lasagna_lasagna_npcs_nyo_ho_nyo_ho_how_472bf1: "Nyo-ho! Nyo-ho! How dare you disrespect me?"
  npc_override_lasagna_lasagna_npcs_nyo_hoho_nyo_hoho_9b16c8: "Nyo-hoho!! Nyo-hoho!!"
  npc_override_lasagna_lasagna_npcs_nyo_hoho_nyo_hoho_i_f8aba4: "Nyo-hoho! Nyo-hoho! I'm the strongest Doram in this domain!"
  npc_override_lasagna_lasagna_npcs_nyo_hoho_nyo_hoho_you_b4658d: "Nyo-hoho! Nyo-hoho! You look so hectic. Where are you going?"
  npc_override_lasagna_lasagna_npcs_oh_actually_i_lost_d0b89a: "Oh, actually...I lost it!"
  npc_override_lasagna_lasagna_npcs_oh_again_81bd92: "Oh, not again."
  npc_override_lasagna_lasagna_npcs_oh_all_i_m_grateful_f421e1: "Oh, not at all. I'm grateful to you, too. Anyways, if you go to the ^0000cdfishing hole near the south bridge^000000, you'll meet ^0000cdLegalas^000000 who is standing on crutches. He's the one who supplies us with kaluna."
  npc_override_lasagna_lasagna_npcs_oh_aroma_7184fb: "Oh...This aroma!"
  npc_override_lasagna_lasagna_npcs_oh_bun_sure_hot_huge_9053a1: "Oh, this is the Bun... It sure is hot and huge. This is totally different from that of our side."
  npc_override_lasagna_lasagna_npcs_oh_dead_8ca26a: "Oh, the dead."
  npc_override_lasagna_lasagna_npcs_oh_dear_315af8: "Oh, dear..."
  npc_override_lasagna_lasagna_npcs_oh_dear_9aea7a: "Oh dear..."
  npc_override_lasagna_lasagna_npcs_oh_did_chief_send_you_99e052: "Oh! Did the chief send you?"
  npc_override_lasagna_lasagna_npcs_oh_didn_t_chef_tell_e641c0: "Oh, didn't the Chef tell you? I'm sorry, most people come here after hearing the details from him."
  npc_override_lasagna_lasagna_npcs_oh_don_t_take_wrong_d8321f: "Oh, don't take it the wrong way. Despite what it may seem, I'm really grateful from deep down. Thank you!"
  npc_override_lasagna_lasagna_npcs_oh_embarrassing_how_many_d6fe74: "Oh, this is embarrassing! How many times do I have to tell you that everyone here has it stirred?!"
  npc_override_lasagna_lasagna_npcs_oh_hello_9aef12: "Oh, hello?"
  npc_override_lasagna_lasagna_npcs_oh_here_you_bef8c8: "Oh! Here you are!"
  npc_override_lasagna_lasagna_npcs_oh_how_did_you_know_f00a28: "Oh! How did you know?"
  npc_override_lasagna_lasagna_npcs_oh_hum_i_should_go_8f8060: "Oh, hum. I should go check if the Boatswain in the right place."
  npc_override_lasagna_lasagna_npcs_oh_i_am_blaming_you_89e7f3: "Oh, I am not blaming you. I'll do my best to give you the best sailing adventure. I am ^0000cdStello^000000."
  npc_override_lasagna_lasagna_npcs_oh_i_don_t_even_40f609: "And... Oh, I don't even want to imagine after that."
  npc_override_lasagna_lasagna_npcs_oh_i_favor_ask_you_342648: "Oh, I have a favor to ask you. Would you bring it to the ^0000cdSous Chef^000000. Can you do this for me? You will keep sailing on this ship from time to time, you know, right?"
  npc_override_lasagna_lasagna_npcs_oh_i_guess_we_getting_f8898d: "Oh, I guess we are getting into the good part. I really like it."
  npc_override_lasagna_lasagna_npcs_oh_i_m_so_hungry_4fe383: "Oh, I'm so hungry. When is the food coming? Food."
  npc_override_lasagna_lasagna_npcs_oh_i_m_sorry_i_737c63: "Oh! I'm sorry. I thought it was the hornets again."
  npc_override_lasagna_lasagna_npcs_oh_i_must_put_near_2e37fe: "Oh, that! I must have put it near here..."
  npc_override_lasagna_lasagna_npcs_oh_i_see_bb3c05: "Oh, I see."
  npc_override_lasagna_lasagna_npcs_oh_i_see_i_am_1489f4: "Oh, I see. I am sorry."
  npc_override_lasagna_lasagna_npcs_oh_i_see_nice_meet_a0de9d: "Oh, I see. Nice to meet you. I am the Recorder of this ship who is in charge of all records of this ship. You may come by whenever you have a question. You are free to access any records except the classified ones."
  npc_override_lasagna_lasagna_npcs_oh_i_see_please_excuse_372bb8: "Oh, I see. Please excuse me."
  npc_override_lasagna_lasagna_npcs_oh_i_see_thank_you_41b978: "Oh, I see. Thank you."
  npc_override_lasagna_lasagna_npcs_oh_i_should_get_you_ed3ade: "Oh, I should get you a Magnifier. When you get an unidentified weapon or equipment, check with it."
  npc_override_lasagna_lasagna_npcs_oh_my_days_so_you_feaa46: "Oh, my days! So you haven't even been to Lasagna, have you?"
  npc_override_lasagna_lasagna_npcs_oh_my_days_you_startled_bf375e: "Oh, my days! You startled me!"
  npc_override_lasagna_lasagna_npcs_oh_my_f009ab: "Oh my."
  npc_override_lasagna_lasagna_npcs_oh_my_he_really_idiot_7aec03: "Oh my, he really is an idiot. Had he come to me earlier, I would have told him about a less painful path."
  npc_override_lasagna_lasagna_npcs_oh_my_heart_beating_just_d5ab03: "Oh, my heart is beating just from the thought of it."
  npc_override_lasagna_lasagna_npcs_oh_my_who_ve_thought_969d1b: "Oh my. Who would've thought that there would be another idiot like the ^0000cdboatswain of Con-Chliina^000000."
  npc_override_lasagna_lasagna_npcs_oh_never_mind_i_am_15b9be: "Oh, never mind. I am not writing down your faults... This is enough."
  npc_override_lasagna_lasagna_npcs_oh_night_i_listened_song_5c4009: "Oh the night, I listened to this song. I could hear it anywhere. I could hear is from the creases in my palm, near my ear and the silver waves."
  npc_override_lasagna_lasagna_npcs_oh_no_ce8d16: "Oh, no..."
  npc_override_lasagna_lasagna_npcs_oh_no_what_happened_9507c1: "Oh no. What happened?"
  npc_override_lasagna_lasagna_npcs_oh_quite_story_i_really_408398: "Oh, it was quite a story. I really appreciate your story. I believe that al the numerous adventures have made you the man who you are now, dear captain."
  npc_override_lasagna_lasagna_npcs_oh_really_ooh_s_awful_64762a: "Oh, that? Really? Ooh, That's awful... Seriously, how would that...ugh."
  npc_override_lasagna_lasagna_npcs_oh_red_fog_seemed_all_bd4c07: "Oh, the red ^0000cdfog^000000! It seemed all right just a while ago!"
  npc_override_lasagna_lasagna_npcs_oh_right_i_ll_give_9a9288: "Oh, right! I'll give you this, too."
  npc_override_lasagna_lasagna_npcs_oh_right_pepe_looked_lik_0d828e: "Oh, right. Pepe looked like a homeless and ordered kaluna milk. That's when Berry picked a fight, saying that only the kids have it shaken."
  npc_override_lasagna_lasagna_npcs_oh_s_really_good_225421: "Oh, It's really good..."
  npc_override_lasagna_lasagna_npcs_oh_so_you_re_famous_70f7b6: "Oh! So you're that famous human everyone is talking about!"
  npc_override_lasagna_lasagna_npcs_oh_so_you_re_here_cdf8cd: "Oh, so you're here to learn the potion combination?"
  npc_override_lasagna_lasagna_npcs_oh_strange_story_i_heard_568fdb: "Oh, strange. This is not the story I have heard from your mother, Captain. She said you didn't want to help the butcher's shop business, and you went out from the early morning."
  npc_override_lasagna_lasagna_npcs_oh_thank_you_you_saved_e37bb9: "Oh, thank you! You saved me! I wish you can get a taste of the pudding made with this, but I'm so busy at the moment."
  npc_override_lasagna_lasagna_npcs_oh_thanks_bunch_what_rel_70ab8d: "Oh, thanks a bunch. What a relief, really!"
  npc_override_lasagna_lasagna_npcs_oh_there_basilisks_comin_dce157: "Oh! There are basilisks coming this way again. Please, take care of them."
  npc_override_lasagna_lasagna_npcs_oh_there_they_again_adve_f86c63: "Oh, there they are again! Adventurer, please keep them from coming here. Catch ten of them."
  npc_override_lasagna_lasagna_npcs_oh_there_you_go_5204ac: "Oh, there you go!"
  npc_override_lasagna_lasagna_npcs_oh_those_eggring_boys_sp_2dc0d0: "Oh, those eggring boys. Speaking of which, I haven't seen them much lately. Did they give up and leave Lasagna?"
  npc_override_lasagna_lasagna_npcs_oh_wait_you_big_help_139247: "Oh, wait! You were a big help this time, so I'll give you this as a token of my gratitude."
  npc_override_lasagna_lasagna_npcs_oh_wait_you_re_taking_fa495c: "Oh, wait. You're not taking me seriously, are you? It's a joke, a joke!"
  npc_override_lasagna_lasagna_npcs_oh_way_you_need_know_d7b6fc: "Oh, by the way, you need to know that ^0000cdcooking may fail^000000. The chance of failure depends on the cooking utensils you have and the level of your cooking."
  npc_override_lasagna_lasagna_npcs_oh_what_am_i_going_c00b0b: "Oh, what am I going to do. Hey you, adventurer! Hold on a second!"
  npc_override_lasagna_lasagna_npcs_oh_yeah_b02a1c: "Oh yeah!"
  npc_override_lasagna_lasagna_npcs_oh_yeah_i_see_your_127277: "Oh, yeah. I see your name on the list. {0}."
  npc_override_lasagna_lasagna_npcs_oh_yeah_thanks_84c9d0: "Oh, yeah. Thanks."
  npc_override_lasagna_lasagna_npcs_oh_yes_let_s_give_c50f75: "Oh, yes. Let's give a big hand to the adventurer who has returned from the mission!"
  npc_override_lasagna_lasagna_npcs_oh_yes_well_thanks_0285c5: "Oh, yes. Well, thanks."
  npc_override_lasagna_lasagna_npcs_oh_you_adventurer_you_do_2f3560: "Oh! You adventurer! You don't want to deal with him so seriously...!"
  npc_override_lasagna_lasagna_npcs_oh_you_brought_them_all_e76cd7: "Oh, you have brought them all! Let me cook them for you right away."
  npc_override_lasagna_lasagna_npcs_oh_you_come_i_hunch_d4306c: "Oh, you would come. I have a hunch."
  npc_override_lasagna_lasagna_npcs_oh_you_d_like_learn_9c8143: "Oh, you'd like to learn about First Aid! How admirable of you!"
  npc_override_lasagna_lasagna_npcs_oh_you_haven_t_met_a44e46: "Oh! You haven't met our chief yet?"
  npc_override_lasagna_lasagna_npcs_oh_you_must_famous_stran_4641e8: "Oh! You must be the famous strangers from the New Continent, eh?"
  npc_override_lasagna_lasagna_npcs_oh_you_newly_trained_adv_6a2cd1: "Oh, you are the newly trained adventurer setting off on an adventure to the new continent. I am fond of an adventurous spirit. I used to travel from a place to another when I was young."
  npc_override_lasagna_lasagna_npcs_oh_you_re_done_yet_5db4c4: "Oh, you're not done yet. Have you forgotten what you were supposed to catch?"
  npc_override_lasagna_lasagna_npcs_oh_you_re_youngest_kitte_7e2c43: "Oh, you're the youngest kitten of the tool merchant!"
  npc_override_lasagna_lasagna_npcs_oh_you_right_there_one_257f79: "Oh, you are right. There is ^0000cdthis one person^000000."
  npc_override_lasagna_lasagna_npcs_oh_you_shouldn_t_said_def7eb: "Oh, you shouldn't have said that!"
  npc_override_lasagna_lasagna_npcs_oh_you_want_me_explain_c5ca23: "Oh, do you want me to explain it again?"
  npc_override_lasagna_lasagna_npcs_ohh_box_c978fa: "Ohh...! This is the box!"
  npc_override_lasagna_lasagna_npcs_ohh_c8857f: "Ohh!"
  npc_override_lasagna_lasagna_npcs_ok_get_there_now_edc349: "OK. Get on there now."
  npc_override_lasagna_lasagna_npcs_ok_i_40f4db: "OK, I will!"
  npc_override_lasagna_lasagna_npcs_ok_i_t_help_just_44c7bd: "OK, I can't help it. Just for today."
  npc_override_lasagna_lasagna_npcs_okay_fine_let_s_go_480309: "Okay, fine. Let's go to the anchovy workshop ^0000cdnear the dock^000000."
  npc_override_lasagna_lasagna_npcs_okay_give_me_food_now_5c74a2: "Okay, give me food now."
  npc_override_lasagna_lasagna_npcs_okay_i_ll_go_find_b11c5d: "Okay, I'll go and find out."
  npc_override_lasagna_lasagna_npcs_okay_i_m_sitting_now_68bf50: "Okay, I'm sitting now."
  npc_override_lasagna_lasagna_npcs_okay_see_you_later_ede9e5: "Okay. See you later."
  npc_override_lasagna_lasagna_npcs_okay_then_let_s_get_5e6c09: "Okay, then Let's get started right away! Take this lunchbox to the ^0000cdvigilante inside the cave. His name is Panna.^000000"
  npc_override_lasagna_lasagna_npcs_olio_183987: "Olio!"
  npc_override_lasagna_lasagna_npcs_once_sun_up_they_ll_2789e5: "Once the sun is up, they'll be back again. Could you come back then and help me?"
  npc_override_lasagna_lasagna_npcs_once_you_cross_south_bri_ec3c67: "Once you cross the south bridge, you'll see crossroads. Take the road right underneath and go straight to the Raviol Plains where the shepherd is."
  npc_override_lasagna_lasagna_npcs_once_you_get_cookbook_yo_7d6bdc: "Once you get a Cookbook, you need to collect the ^0000cdingredients^000000. It doesn't help to lick the pages if the Cookbook without preparing the ingredients. Even the eggrings know better than that."
  npc_override_lasagna_lasagna_npcs_one_27141a: "One!"
  npc_override_lasagna_lasagna_npcs_one_again_31f06c: "It is ^0000cdthat one^000000 again."
  npc_override_lasagna_lasagna_npcs_one_checking_ticket_entr_041c1e: "The one checking the ticket at the entrance asked me to deliver it to the Head Chef."
  npc_override_lasagna_lasagna_npcs_one_more_thing_just_drop_2bf503: "One more thing. Just drop that habit of acting like you're naive in front of the strangers!"
  npc_override_lasagna_lasagna_npcs_one_particular_even_came_568970: "This one in particular even came into the town and wreaked havoc yesterday. We had to detain him, but he wouldn't talk why he did it."
  npc_override_lasagna_lasagna_npcs_one_team_if_i_don_366204: "One team. If I don't show up, they'll probably harass Legalas again. Fine."
  npc_override_lasagna_lasagna_npcs_only_chief_officer_tell_820080: "Only the Chief Officer can tell whether we can go to the new continent or now."
  npc_override_lasagna_lasagna_npcs_only_lasts_day_when_expi_dc73b0: "It only lasts a day. When it expires, it will be burnt up. I guess you should be close to Shaman meow from now on."
  npc_override_lasagna_lasagna_npcs_only_thing_i_could_weake_543c18: "The only thing I could do was to weaken it as much as possible each day."
  npc_override_lasagna_lasagna_npcs_only_vigilantes_eat_here_ed0960: "Only the vigilantes can eat here."
  npc_override_lasagna_lasagna_npcs_only_zenies_port_city_la_64b4cf: "Only ^0000cd{0} Zenies^000000 to the port city Lasagna."
  npc_override_lasagna_lasagna_npcs_open_close_item_window_s_8ecb4f: "Open or close the item window with the shortcut key [Alt+E]."
  npc_override_lasagna_lasagna_npcs_opps_i_supposed_go_ancho_332677: "Opps! I was supposed to go to the anchovy workshop. Gotta hurry."
  npc_override_lasagna_lasagna_npcs_order_cook_such_dishes_y_6abb67: "In order to cook such dishes, you need to make some preparation."
  npc_override_lasagna_lasagna_npcs_other_than_setting_off_a_e211ab: "Other than setting off on an adventure, I collect adventure stories from other people. I have heard that Captain Gamberi, you have been in Lasagna for a long time."
  npc_override_lasagna_lasagna_npcs_other_than_there_also_ne_dd9ce0: "Other than that, there are also Neutral and Undead elements. You'll soon know what they are about."
  npc_override_lasagna_lasagna_npcs_ouch_why_you_hitting_me_62c485: "Ouch! Why are you hitting me all of a sudden?"
  npc_override_lasagna_lasagna_npcs_our_cow_should_eat_lots_bed2c5: "Our cow...should eat lots of tasty stuff... Please take care of five Leaf Lunatics and five Grass Fabres."
  npc_override_lasagna_lasagna_npcs_our_cows_liked_you_very_5943bd: "Our cows liked you very much. That's surprising because they're usually very shy."
  npc_override_lasagna_lasagna_npcs_our_cows_nothing_eat_the_a3aae8: "Our cows have nothing to eat then."
  npc_override_lasagna_lasagna_npcs_our_great_captain_gamber_86e955: "Our great Captain Gamberri ventured here in person!"
  npc_override_lasagna_lasagna_npcs_our_honey_danger_db6166: "Our honey is in danger!"
  npc_override_lasagna_lasagna_npcs_our_ship_different_power_d145b7: "Our ship has a different power system compared to other ships. And only few people know this."
  npc_override_lasagna_lasagna_npcs_out_curiosity_perhaps_i_699bec: "Out of curiosity perhaps. I would poke at everything if I go to the new continent too. Argh... Please hold me a little. I cannot walk properly."
  npc_override_lasagna_lasagna_npcs_out_towner_dorams_abound_ebd990: "Out-of-towner Dorams abound in this place, I definitely don't want any more of them."
  npc_override_lasagna_lasagna_npcs_oven_resolution_b7fe82: "^0000cd[Oven Resolution]^000000"
  npc_override_lasagna_lasagna_npcs_oww_hurts_i_m_sorry_c23468: "Oww...that hurts. I'm sorry if I've offended you, but are you Imoogi, the chief of the Basilisk?"
  npc_override_lasagna_lasagna_npcs_panna_bb9f1c: "Panna?"
  npc_override_lasagna_lasagna_npcs_panna_here_s_your_lunchb_41de60: "Panna? Here's your lunchbox..."
  npc_override_lasagna_lasagna_npcs_patiently_72f2f7: "Patiently -"
  npc_override_lasagna_lasagna_npcs_patiently_sitting_4b2218: "Patiently sitting."
  npc_override_lasagna_lasagna_npcs_patrol_who_went_check_ha_7b4894: "The patrol who went to check it ^0000cdhasn't returned yet^000000. Something must have happened. You said you would go there to check the condition of the dragon, right? Come with me.Stone"
  npc_override_lasagna_lasagna_npcs_pay_same_anywhere_you_re_2dba3e: "Pay is same anywhere. You ready?"
  npc_override_lasagna_lasagna_npcs_people_new_continent_so_d48cfb: "The people from the new continent are so tall."
  npc_override_lasagna_lasagna_npcs_people_only_see_as_much_9cf1b1: "People can only see as much as they know."
  npc_override_lasagna_lasagna_npcs_pepe_5b7ff4: "Pepe?"
  npc_override_lasagna_lasagna_npcs_pepe_peperoncino_gamberr_de8eff: "^0000cdPepe. Peperoncino. Gamberry is Berry, and Tomei Thomas is Toto^000000. I guess young people don't know. Anyway, they were like wild basilisks."
  npc_override_lasagna_lasagna_npcs_peperoncino_b9e71e: "- Peperoncino -"
  npc_override_lasagna_lasagna_npcs_pfff_what_s_wrong_using_c6af7d: "Pfff! What's wrong with using the summoning skills to complement the physical skills?"
  npc_override_lasagna_lasagna_npcs_phew_i_tried_so_hard_c41739: "Phew... I tried so hard to fake death. Is it gone now?"
  npc_override_lasagna_lasagna_npcs_phew_such_nonsense_a77ad3: "Phew, such nonsense."
  npc_override_lasagna_lasagna_npcs_picking_fight_what_we_ca_835502: "Picking a fight? This is what we call training!"
  npc_override_lasagna_lasagna_npcs_piece_cake_right_14ffc6: "Piece of cake, right?"
  npc_override_lasagna_lasagna_npcs_place_item_skill_icon_us_0147af: "^4d4dffTo place an item or skill icon to use, drag it to the shortcut key slot.^000000"
  npc_override_lasagna_lasagna_npcs_place_item_skill_you_oft_2fd84a: "^4d4dffPlace an item and/or skill that you often use for quick usage.^000000"
  npc_override_lasagna_lasagna_npcs_place_where_thomas_peper_c4bb54: "The place where Thomas, Peperoncino, and Gamberry met up to make agreements."
  npc_override_lasagna_lasagna_npcs_plants_grasses_packed_fr_367e92: "Plants and grasses are packed in front of her house because she's busy testing medicinal herbs."
  npc_override_lasagna_lasagna_npcs_please_1245ce: "Please."
  npc_override_lasagna_lasagna_npcs_please_bring_five_mushro_770472: "Please bring five mushroom spores and catch ten Trans Spores."
  npc_override_lasagna_lasagna_npcs_please_bring_me_mastela_cdf9a4: "Please bring me ^0000cd4 Mastela Fruit and 1 Cat Hardtack^000000."
  npc_override_lasagna_lasagna_npcs_please_calm_down_i_ll_b5143e: "Please calm down. I'll talk to them."
  npc_override_lasagna_lasagna_npcs_please_catch_five_each_p_63570c: "Please catch five from each pack! I'll do whatever I can with the rest!"
  npc_override_lasagna_lasagna_npcs_please_catch_ten_roda_fr_e96514: "Please catch ten Roda Frogs. I always hated their slippery skin."
  npc_override_lasagna_lasagna_npcs_please_catch_ten_trans_s_d9fe3c: "Please catch ten Trans Spores and bring me five mushroom spores. Hurry!"
  npc_override_lasagna_lasagna_npcs_please_check_see_if_you_a91e3a: "Please check to see if you have the boarding pass with you before boarding!"
  npc_override_lasagna_lasagna_npcs_please_come_back_later_t_fa10ab: "Please come back later and tell me your story."
  npc_override_lasagna_lasagna_npcs_please_defeat_our_rivals_dc0c7c: "Please defeat our rivals, the wild hornets. Around ten would do."
  npc_override_lasagna_lasagna_npcs_please_don_t_miss_announ_65026e: "Please don't miss the announcement about the details of Con-Chliina!"
  npc_override_lasagna_lasagna_npcs_please_excuse_me_i_am_f009cb: "Please excuse me. I am the Sous Chef in charge of this kitchen."
  npc_override_lasagna_lasagna_npcs_please_find_aglio_1eed64: "Please find it, Aglio!"
  npc_override_lasagna_lasagna_npcs_please_follow_me_way_60ba57: "Please follow me, this way."
  npc_override_lasagna_lasagna_npcs_please_get_me_some_cat_1c5e9a: "And please get me some ^0000cdCat Hardtacks made by the Head Chef of Navi^000000 as well. I have heard that it doesn't taste good, but it is nutritious and easy to store."
  npc_override_lasagna_lasagna_npcs_please_give_me_now_i_6b7e9f: "Please give it to me now. I feel the power of the amulet fading away now."
  npc_override_lasagna_lasagna_npcs_please_go_raviol_forest_d735a6: "Please go to Raviol Forest and catch ten wild hornets."
  npc_override_lasagna_lasagna_npcs_please_go_tell_story_sha_655ac8: "Please go and tell this story to the Shaman meow and bring me the remedy. I'll do anything for you if you get rid of it."
  npc_override_lasagna_lasagna_npcs_please_guard_grasses_gra_01a79a: "Please guard the grasses from Grass Fabre and Leaf Lunatic. They are food for our cows."
  npc_override_lasagna_lasagna_npcs_please_guard_my_strings_5dbe42: "Please guard my strings. Catch ten Hunter Desert Wolves. That should be enough to keep them away from my strings."
  npc_override_lasagna_lasagna_npcs_please_help_me_68e8d0: "Please...help me..."
  npc_override_lasagna_lasagna_npcs_please_help_me_make_some_25d24f: "Please help me make some pudding today. Catch ten Sweet Roda Frogs and bring me five sticky webfeet!"
  npc_override_lasagna_lasagna_npcs_please_i_beg_you_78e811: "Please, I beg you!"
  npc_override_lasagna_lasagna_npcs_please_i_don_t_all_188593: "Please. I don't have all day."
  npc_override_lasagna_lasagna_npcs_please_keep_hunter_deser_a2de06: "Please keep the Hunter Desert Wolves away from my strings. Catch ten wolves and they won't go after my strings anymore."
  npc_override_lasagna_lasagna_npcs_please_let_me_know_where_9557ef: "Please let me know where the dragon lives."
  npc_override_lasagna_lasagna_npcs_please_take_care_those_d_02af1e: "Please take care of those Desert Wolves and save our strings. They're my favorite snack. Catch ten wolves and they won't come near anymore."
  npc_override_lasagna_lasagna_npcs_please_take_them_you_aga_8d613f: "Please take them with you again, even for a short while!"
  npc_override_lasagna_lasagna_npcs_please_tell_me_story_506316: "Please, tell me the story!"
  npc_override_lasagna_lasagna_npcs_please_tell_stello_bb137e: "Please tell it to Stello."
  npc_override_lasagna_lasagna_npcs_please_touch_books_3177af: "Please do not touch the books."
  npc_override_lasagna_lasagna_npcs_plenty_yummy_food_if_yes_627df5: "Does it have plenty of yummy food? If yes, I'll go."
  npc_override_lasagna_lasagna_npcs_pluck_red_grass_then_col_2018d9: "^4d4dffPluck 3 Red Grass and then collect 2 Red Herbs^000000 around here!"
  npc_override_lasagna_lasagna_npcs_polish_horse_mackerel_am_c60d79: "Polish the Horse Mackerel Amulet."
  npc_override_lasagna_lasagna_npcs_polite_discuss_looks_fro_4e31df: "It is not polite to discuss the looks in front of the person!"
  npc_override_lasagna_lasagna_npcs_port_smothered_fog_becau_9b3313: "The port is smothered in fog because of that smoke. So I came to investigate since the boats can't set sail."
  npc_override_lasagna_lasagna_npcs_pot_turned_out_pot_which_3494e5: "The pot turned out to be a pot in which an evil ghost has been sealed. Gamberi knew it and tried to stop me. However, it was too late. I had already broken the seal. I grew up in the land, and did not know about that at all."
  npc_override_lasagna_lasagna_npcs_prepare_item_skill_icon_20ed78: "^4d4dffTo prepare an item or skill icon to use, drag it to the shortcut key slot."
  npc_override_lasagna_lasagna_npcs_prepare_item_skill_you_o_24e984: "^4d4dffPrepare an item and/or skill that you often use for faster use."
  npc_override_lasagna_lasagna_npcs_prepare_materials_writte_f307ee: "Prepare the materials written in the combination scroll."
  npc_override_lasagna_lasagna_npcs_press_alt_q_keys_view_8138f0: "Press the ^4d4dffAlt+Q^000000 keys to view your physical stats."
  npc_override_lasagna_lasagna_npcs_press_alt_u_shortcut_key_5736ad: "Press the ^4d4dffAlt + U^000000 shortcut key to open the Quest Information Window."
  npc_override_lasagna_lasagna_npcs_press_f_key_bring_up_d2e7d7: "^4d4dffPress the F12 key and it will bring up the shortcut key slots.^000000"
  npc_override_lasagna_lasagna_npcs_press_f_key_you_d6b073: "Press the ^4d4dffF12 key^000000, will you?"
  npc_override_lasagna_lasagna_npcs_press_juice_out_put_them_d452a0: "Press juice out of it and put them in a bottle..."
  npc_override_lasagna_lasagna_npcs_probably_chest_right_wha_77c208: "Probably in the chest, right? But what am I supposed to do with it?"
  npc_override_lasagna_lasagna_npcs_probably_just_imaginatio_4d1e83: "Probably just an imagination. He wouldn't sell us."
  npc_override_lasagna_lasagna_npcs_probably_just_imaginatio_602025: "Probably just an imagination."
  npc_override_lasagna_lasagna_npcs_proud_cat_getting_really_658c5b: "This proud cat is getting really talkative..."
  npc_override_lasagna_lasagna_npcs_pub_also_adventurers_clu_6dc186: "This is a pub but also an adventurers' club where adventurers stop by. They come from all over the place and share their stories as well as find companions for adventures."
  npc_override_lasagna_lasagna_npcs_pub_oven_990915: "^0000cd[Pub-Oven]^000000"
  npc_override_lasagna_lasagna_npcs_pub_oven_its_own_special_ea8e15: "Pub-Oven has its own special network where it receives ingredients within ten minutes. So customers don't need to wait infinitely."
  npc_override_lasagna_lasagna_npcs_purser_asked_me_check_if_e58d4f: "The Purser asked me to check if there wouldn't be any problem sailing off with the thick ^0000cdfog^000000."
  npc_override_lasagna_lasagna_npcs_purser_must_sent_up_anot_c00e7f: "The Purser must have sent up another irrelevant visitor. He must have told you how the people from the same home town should stick together and all."
  npc_override_lasagna_lasagna_npcs_put_simply_these_element_aa1af9: "Put simply, these are the elements of Water, Wind, Earth, and Fire."
  npc_override_lasagna_lasagna_npcs_pweeeep_peep_peep_pweep_656353: "Pweeeep--peep-peep-pweep"
