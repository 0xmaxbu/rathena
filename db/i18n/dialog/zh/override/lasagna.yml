  npc_override_lasagna_lasagna_npcs_get_now_if_your_first_06c2bf: "Get on now. If it is your first time, meet the purser and listen to the boarding instructions."
  npc_override_lasagna_lasagna_npcs_get_rid_so_they_won_1b28f9: "Get rid of ^0000cd20 or so^000000 and they won't come near from fear."
  npc_override_lasagna_lasagna_npcs_get_some_good_rest_come_d5c50c: "Get some good rest and come back tomorrow."
  npc_override_lasagna_lasagna_npcs_get_there_25e30f: "Get in there."
  npc_override_lasagna_lasagna_npcs_get_up_7cdb34: "Get up."
  npc_override_lasagna_lasagna_npcs_giggles_we_should_see_ea_0a8350: "~Giggles~ We should see each other more often!"
  npc_override_lasagna_lasagna_npcs_give_me_bite_77b7aa: "Give me a bite..."
  npc_override_lasagna_lasagna_npcs_give_me_one_even_one_d62821: "Give me one. Even one of them would be enough to keep me full all day."
  npc_override_lasagna_lasagna_npcs_give_vigilante_lunchbox_93dd58: "Give that vigilante a lunchbox. I'm curious as to what's inside."
  npc_override_lasagna_lasagna_npcs_glass_before_sailing_out_de07a6: "A glass before sailing out, a glass on land after a long voyage, a glass for everyone who came from out of town to make an oven resolution, a glass for every regular customers, a glass for everyone who drinks because others drink it.."
  npc_override_lasagna_lasagna_npcs_glass_kaluna_milk_please_724aec: "A glass of kaluna milk please."
  npc_override_lasagna_lasagna_npcs_glass_kaluna_milk_pub_af_b5edf1: "A glass kaluna milk at a pub after receiving my paycheck is the sweetest thing in the world."
  npc_override_lasagna_lasagna_npcs_go_ahead_deliver_head_ch_f1cd17: "Go ahead and deliver it to the Head Chef!"
  npc_override_lasagna_lasagna_npcs_go_ahead_get_rid_some_79c24a: "Go ahead and get rid of some ^4d4dffEggring^000000, will you? ^4d4dffThree^000000 should do for now."
  npc_override_lasagna_lasagna_npcs_go_ahead_report_chief_of_f51551: "Go ahead and report to the Chief Officer."
  npc_override_lasagna_lasagna_npcs_go_chance_win_cruise_tri_a7de33: "Go for a chance to win a cruise trip and annual salary of one hundred million with a price of three anchovies! Chances are in favor of those who don't doubt!"
  npc_override_lasagna_lasagna_npcs_go_collect_red_herb_entr_8babfc: "^4d4dffGo and collect 1 Red Herb in the entrance of the village.^000000 This should be a good practice."
  npc_override_lasagna_lasagna_npcs_go_find_legalas_find_out_fdfc2f: "Go find Legalas and find out what's going on. And tell him to make delivery as soon as possible. At the rate we're going, we'll be out of stock after today."
  npc_override_lasagna_lasagna_npcs_go_hunting_after_eating_780ab8: "Go hunting after eating this. You won't believe the newfound power in you."
  npc_override_lasagna_lasagna_npcs_go_learn_skill_if_you_85bf49: "Go and learn the skill if you want to use the warehouse."
  npc_override_lasagna_lasagna_npcs_go_learn_skills_until_yo_828769: "Go and learn the skills until you reach the level to use the warehouse."
  npc_override_lasagna_lasagna_npcs_go_meet_old_lady_who_d11c64: "Go to meet ^0000cdthe old lady who used to be the owner of Pub-Oven^000000. She is living in a ^0000cd small house near the Adventurer Club^000000."
  npc_override_lasagna_lasagna_npcs_go_meet_recorder_who_clo_a5fbf3: "Go to meet the Recorder who is the closest to this place. He is such a funny guy. You would have fun talking to him."
  npc_override_lasagna_lasagna_npcs_go_see_her_97037f: "Go see her."
  npc_override_lasagna_lasagna_npcs_go_see_old_lady_who_07fe9f: "Go to see the old lady who used to be the first owner of Pub-Oven. She must be the house near it."
  npc_override_lasagna_lasagna_npcs_go_talk_chief_first_bd0551: "Go talk to the chief first."
  npc_override_lasagna_lasagna_npcs_go_talk_jindou_fd173f: "Go have a talk with Jindou."
  npc_override_lasagna_lasagna_npcs_go_teach_sweet_roda_frog_107a04: "Go and teach Sweet Roda Frogs over there a lesson, and bring 'Luxurious Cloth' to me."
  npc_override_lasagna_lasagna_npcs_go_where_afbff8: "Go where?"
  npc_override_lasagna_lasagna_npcs_going_adventure_new_worl_26c04f: "Going on an adventure to the new world would be nice, too. If it weren't for my job, I would've left long ago."
  npc_override_lasagna_lasagna_npcs_going_time_eat_soon_i_646681: "It is going to be the time to eat soon. I should hurry up."
  npc_override_lasagna_lasagna_npcs_going_work_let_s_forget_fd4238: "This is not going to work. Let's forget about babysitting. Was there anything you've always wanted to do?"
  npc_override_lasagna_lasagna_npcs_gone_gone_meeow_ab7924: "Be gone! Be gone, meeow!"
  npc_override_lasagna_lasagna_npcs_good_bdc919: "Good."
  npc_override_lasagna_lasagna_npcs_good_bye_45db79: "Good bye."
  npc_override_lasagna_lasagna_npcs_good_consider_as_last_tr_7ad250: "Good. Consider it as the last training before sailing off."
  npc_override_lasagna_lasagna_npcs_good_food_raise_certain_025468: "Good food can ^0000cdraise a certain status^000000 and ^0000cdrecover HP^000000. There is no reason not to cook and eat."
  npc_override_lasagna_lasagna_npcs_good_i_like_attitude_you_f39715: "Good. I like the attitude that you don't give in for threats. So do I. Well, so did I."
  npc_override_lasagna_lasagna_npcs_good_i_won_t_last_dca12e: "That is not good... I won't last?"
  npc_override_lasagna_lasagna_npcs_good_job_should_keep_the_d31012: "Good job. That should keep them quiet now. I'm going to look through my treasure but I need to sleep first. I'm sleepy cuz I've been up for so long today."
  npc_override_lasagna_lasagna_npcs_good_job_today_as_well_1f1204: "Good job today as well. Two of you, get some food. Adventurer, that this. I'm counting on you tomorrow as well!"
  npc_override_lasagna_lasagna_npcs_good_job_while_three_you_093e72: "Good job. While the three of you went to the cave, Legalas visited with kaluna. If we can keep this up every day, delivery will be no problem at all."
  npc_override_lasagna_lasagna_npcs_good_order_fish_cake_jus_2f3994: "Good. An order for fish cake just came in."
  npc_override_lasagna_lasagna_npcs_good_please_take_look_sh_b91981: "Good. Please take a look at this shelf here."
  npc_override_lasagna_lasagna_npcs_good_should_enough_keep_3324b2: "Good! This should be enough to keep me from getting snubbed in the new world."
  npc_override_lasagna_lasagna_npcs_good_thinking_i_knew_you_2260d2: "Good thinking! I knew you would. you'd better sell away items that you no longer need!"
  npc_override_lasagna_lasagna_npcs_good_weather_may_bothere_4df698: "The good weather may have bothered them. Or they could have heard a tune of a flute or something."
  npc_override_lasagna_lasagna_npcs_good_work_crossing_over_c22e18: "Good work crossing over the mountain, newbie."
  npc_override_lasagna_lasagna_npcs_grandma_sad_hear_world_f_ac5b93: "Grandma will be sad to hear that. This world is full of things that exist but cannot be seen. For instance, Let's talk about your case."
  npc_override_lasagna_lasagna_npcs_grandpa_who_67dab1: "Grandpa? Who?"
  npc_override_lasagna_lasagna_npcs_grass_fabre_leaf_lunatic_041f0a: "Grass Fabre and Leaf Lunatic, five each. That should scare the rest nearby and keep them at bay."
  npc_override_lasagna_lasagna_npcs_grass_fabres_leaf_lunati_821999: "But the Grass Fabres and Leaf Lunatics are devouring the grasses."
  npc_override_lasagna_lasagna_npcs_great_attitude_now_legal_7eda12: "Great attitude! Now Legalas will..."
  npc_override_lasagna_lasagna_npcs_great_experience_me_a4b570: "It was a great experience for me."
  npc_override_lasagna_lasagna_npcs_great_idea_meet_other_me_6e3ab3: "It would be a great idea to meet other members of the crew."
  npc_override_lasagna_lasagna_npcs_green_herbs_known_detoxi_1b9928: "^4d4dffGreen Herbs are known for detoxification.^000000"
  npc_override_lasagna_lasagna_npcs_grew_up_gamberry_current_de5a77: "Grew up with Gamberry (current captain of Con-Chliina) as childhood friends."
  npc_override_lasagna_lasagna_npcs_grow_you_until_you_don_8b6419: "It will grow with you until you don't need its help anymore. When you become an experienced adventurer, it will lose all its power and become an ordinary ring made of grass."
  npc_override_lasagna_lasagna_npcs_growling_455917: "~Growling~"
  npc_override_lasagna_lasagna_npcs_gulps_a1f826: "~Gulps~"
  npc_override_lasagna_lasagna_npcs_guy_over_there_f0028c: "Was it that guy over there?"
  npc_override_lasagna_lasagna_npcs_guys_9c8520: "Guys?"
  npc_override_lasagna_lasagna_npcs_guys_how_about_we_go_3c503b: "Guys, how about we go to the ^0000cdPub-Oven^000000?"
  npc_override_lasagna_lasagna_npcs_guys_how_you_know_anchov_f13b1f: "Guys... how can you not know that an anchovy is a fish? What kind of lives did you guys live?"
  npc_override_lasagna_lasagna_npcs_guys_there_s_something_i_17fea0: "Guys, there's something I wish to share with you."
  npc_override_lasagna_lasagna_npcs_ha_how_could_you_you_84c7b8: "Ha! How could you? You do everything what I say, really? What a dimwit! Do you wear the beard for fashion, you moron? Do you know what kind of trouble I got into because of you? I was scolded because of you!"
  npc_override_lasagna_lasagna_npcs_ha_huh_ha_i_wish_9cf370: "Ha! Huh! Ha! I wish I can do that. But those two pigs are devouring the kalunyaks! At first, they ate one or two, but now they're at it the minute I catch one. I don't have the opportunity to clean and ferment it!"
  npc_override_lasagna_lasagna_npcs_ha_ppi_ness_456628: "Ha- ppi- ness-"
  npc_override_lasagna_lasagna_npcs_ha_so_seems_like_job_7b96ef: "Ha... Is that so? Seems like this job is not for you either. Then Let's go find something else. Was there any other job you wanted to try?"
  npc_override_lasagna_lasagna_npcs_ha_yes_thank_you_cb46d7: "Ha! Yes. Thank you."
  npc_override_lasagna_lasagna_npcs_ha_you_pretty_good_how_8369cb: "Ha. You are pretty good. How about retiring from the adventures and becoming an apprentice of mine? I'll be nice."
  npc_override_lasagna_lasagna_npcs_hah_i_feel_much_better_686040: "Hah, I feel much better now. I was so hungry that I was about to eat a basilisk, and you couldn't come at a better time. I almost became a doram who failed to remain as one and turn into an animal."
  npc_override_lasagna_lasagna_npcs_hang_let_me_check_if_2155b2: "Hang on. Let me check if you are properly equipped first."
  npc_override_lasagna_lasagna_npcs_hard_miss_you_tell_drago_3602c4: "It is hard to miss. You can tell that it is the dragon's nest when you see it. It is located in a high place and very flashy... Well, you can just tell."
  npc_override_lasagna_lasagna_npcs_haru_very_smart_girl_so_09fbdf: "Haru is a very smart girl, so every sick person goes to her place."
  npc_override_lasagna_lasagna_npcs_hasn_t_been_long_since_e228d1: "It hasn't been long since you left. Have you got them already? Or have you forgotten what I have asked you for?"
  npc_override_lasagna_lasagna_npcs_hat_prepared_pepperoncin_400a3e: "The hat is prepared by Pepperoncino after hearing your story. A Doram adventurer deserves to have a hat. The hat will bring you luck."
  npc_override_lasagna_lasagna_npcs_hat_ring_20f5e8: "A hat and a ring?"
  npc_override_lasagna_lasagna_npcs_haven_t_you_left_midgard_0e4a32: "Haven't you left for Midgard yet?"
  npc_override_lasagna_lasagna_npcs_having_decided_expand_th_be329f: "Having decided to expand their domain to the sea, Gamberry and Thomas gathered a fleet and sailed out, but Captain Thomas went missing in a storm."
  npc_override_lasagna_lasagna_npcs_he_always_hear_answer_5a4e26: "Does he always have to hear the answer?"
  npc_override_lasagna_lasagna_npcs_he_came_lasagna_grand_pl_42cbda: "He came to Lasagna with a grand plan to make a fortune by working on an anchovy fishing line, but gave up because of seasickness."
  npc_override_lasagna_lasagna_npcs_he_chief_peperoncino_bos_bc64ce: "He is Chief Peperoncino, the boss of the Vigilante Corp!"
  npc_override_lasagna_lasagna_npcs_he_could_table_c39463: "He could be at table."
  npc_override_lasagna_lasagna_npcs_he_ended_up_working_anch_4128f3: "He ended up working at the anchovy workshop with Peperoncino due to the debt he incurred at this time. Gamberry was recognized for his skills and became the workshop manager."
  npc_override_lasagna_lasagna_npcs_he_ended_up_working_anch_da6fc8: "He ended up working at the anchovy workshop with Gamberry due to the debt he incurred at this time."
  npc_override_lasagna_lasagna_npcs_he_gone_i_guess_he_beba0f: "Is he gone? I guess he is. That ought to keep them quiet for a while. Got me all worried at first because he said he was a rookie adventurer, but he should be able to pull off one doram's bit."
  npc_override_lasagna_lasagna_npcs_he_just_baby_1700f0: "He is just a baby."
  npc_override_lasagna_lasagna_npcs_he_just_make_things_wors_a75ba5: "He will just make things worse."
  npc_override_lasagna_lasagna_npcs_he_ll_prove_i_right_ac2100: "He'll prove that I was right, after all."
  npc_override_lasagna_lasagna_npcs_he_lost_his_mind_ad123f: "He lost his mind."
  npc_override_lasagna_lasagna_npcs_he_met_gamberry_current_e4727d: "He met Gamberry (current captain of Con-Chliina) at Pub-Oven by having disagreements over how to drink kaluna."
  npc_override_lasagna_lasagna_npcs_he_met_peperoncino_curre_7e3799: "He met Peperoncino (current chief of Farfalle Vigilantes) at Pub-Oven by having disagreements over how to drink kaluna."
  npc_override_lasagna_lasagna_npcs_he_might_tell_you_what_fece9b: "He might tell you What's good about being a Vigilante, so go ahead and ask him."
  npc_override_lasagna_lasagna_npcs_he_must_having_early_mea_3c4a5c: "He must be having an early meal at the newly built <NAVI>^4D4DFF[Adventurer Club]^000000<INFO>lasagna,56,186,000,1,</INFO></NAVI> now. You can enter the restaurant when you head to the south gate."
  npc_override_lasagna_lasagna_npcs_he_probably_didn_t_hear_b9fc89: "He probably didn't hear it."
  npc_override_lasagna_lasagna_npcs_he_s_imoogi_somewhat_bas_5bcfd6: "He's ^0000cdImoogi^000000, somewhat of a basilisk chief. But I don't know. He's complaining about how if it weren't for ^0000cdmy mom and dad, he would've ascended to heaven already^000000. So he always has basilisks on loose to harass me."
  npc_override_lasagna_lasagna_npcs_he_s_making_something_mu_bcbc45: "(He's making something, mumbling.)"
  npc_override_lasagna_lasagna_npcs_he_s_quite_skilled_catch_7f399e: "He's quite skilled at catching, cleaning, and fermenting kalunyak that Lasagna's kaluna milk is regarded as the best around here. Ah, this is not the important part."
  npc_override_lasagna_lasagna_npcs_he_s_recording_maniac_wh_06eca2: "He's a recording maniac who loves to record everything."
  npc_override_lasagna_lasagna_npcs_he_s_young_foolish_lack_2b4051: "He's young and foolish from lack of learning. I am Imook. I am called ^0000cdLord Imuk^000000."
  npc_override_lasagna_lasagna_npcs_he_should_adventurers_cl_b285a7: "He should be at the Adventurers' Club around now..."
  npc_override_lasagna_lasagna_npcs_he_should_counting_his_d_4ab39d: "He should be counting his days by now after suffering so much."
  npc_override_lasagna_lasagna_npcs_he_so_smooth_asking_more_d23277: "He is so smooth at asking for more favors!"
  npc_override_lasagna_lasagna_npcs_he_sometimes_says_such_s_0b5935: "He sometimes says such sanguinary words with a straight face."
  npc_override_lasagna_lasagna_npcs_he_sometimes_tells_stran_30cb92: "He sometimes tells a stranger or a newbie ^0000cdhis story and how Lasagna has developed so far^000000 as he is telling some adventure stories. I'd like to send you to hear from him this time."
  npc_override_lasagna_lasagna_npcs_head_out_east_town_ravio_455c0d: "Head out east from the town to the Ravioli Forest, and keeping going 'east' until you find huge thorny vines."
  npc_override_lasagna_lasagna_npcs_head_out_east_town_ravio_ea9f74: "Head out east from the town to the 'Ravioli Forest', and keeping going 'east' until you find huge thorny vines."
  npc_override_lasagna_lasagna_npcs_heading_midgard_s_my_fir_681873: "Heading to Midgard? It's my first time in Lasagna and It's great, really! So I'm just going to stay here for good. I found a place to live and signed the papers, too!"
  npc_override_lasagna_lasagna_npcs_healer_haru_s_house_stra_f9a37c: "^4d4dffHealer Haru's house^000000 is straight ^4d4dffto the east^000000 from here."
  npc_override_lasagna_lasagna_npcs_healer_next_me_really_go_d22313: "This healer next to me is really good. You should ask her to take a look at it!"
  npc_override_lasagna_lasagna_npcs_healing_amount_minimal_f4b019: "The healing amount can be minimal..."
  npc_override_lasagna_lasagna_npcs_hello_9b56d5: "Hello."
  npc_override_lasagna_lasagna_npcs_hello_adventurer_4280fa: "Hello, adventurer!"
