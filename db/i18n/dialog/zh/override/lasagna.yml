  npc_override_lasagna_lasagna_npcs_funny_how_two_hoodlums_s_e5cff7: "Funny how the two hoodlums were straightening out other hoodlums."
  npc_override_lasagna_lasagna_npcs_future_looked_bleak_lasa_385fc2: "The future looked bleak for Lasagna, but they discussed and decided that Chief Peperoncino would take charge of the Vigilante to protect the town, while the captains Gamberi and Tomatomas lead the merchant band."
