Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_lasagna_lasagna_npcs_abbreviation_lasagna_day_47d7fe: "Abbreviation of Lasagna Day. It is the day when Butterfly, safely arrived in the new world, was found through the discovery of a new sea route after 32 search attempts."
  npc_override_lasagna_lasagna_npcs_about_ten_years_ago_conc_8365da: "About ten years ago, it was a conciliating place to rehab hoodlum dorams and recruit them as vigilantes. Before that, rough sailors came to relax after a hard day's work."
  npc_override_lasagna_lasagna_npcs_above_all_most_important_2690fe: "Above all, the most important out of all the combination items should be a potion."
  npc_override_lasagna_lasagna_npcs_accept_3e1999: "Accept."
  npc_override_lasagna_lasagna_npcs_act_as_if_you_surrender_db7314: "Act as if you surrender."
  npc_override_lasagna_lasagna_npcs_actually_meant_you_die_e_d2bdc3: "Actually, it meant that you would die and the evil ghost would find a new host."
  npc_override_lasagna_lasagna_npcs_actually_you_need_recipe_2d04cb: "Actually, you need the recipe and the cooking utensils, but it could be too complicated for a novice. I'll make one for you this time. We shouldn't waste the ingredients, you know."
  npc_override_lasagna_lasagna_npcs_adventurer_adventurer_ye_37b5f4: "An adventurer. The adventurer from yesterday. Great, please save me today as well meow."
  npc_override_lasagna_lasagna_npcs_adventurer_good_see_you_b63d6c: "Adventurer, good to see you! They're fiercely coming at us. I guess they're real furious about not having any fish yesterday."
  npc_override_lasagna_lasagna_npcs_adventurer_i_beg_you_we_a99e3c: "Adventurer, I beg you. We must stop Lasagna from going back to its dark ages. Everything is in your hands!"
  npc_override_lasagna_lasagna_npcs_adventurer_i_favor_ask_i_c867a1: "Adventurer, I have a favor to ask. I haven't met my delivery quota yet, but those two are eating all my kalunyaks! What you see is all I got for today and at this rate, I won't be able to fulfill the order."
  npc_override_lasagna_lasagna_npcs_adventurer_i_had_dream_y_c5ed13: "Adventurer. I had a dream. You were heading off to the new world meow."
  npc_override_lasagna_lasagna_npcs_adventurer_i_heard_about_706cfd: "Adventurer, I heard about your feats. Thanks to you, my strings are safe."
  npc_override_lasagna_lasagna_npcs_adventurer_i_know_you_re_c89263: "Adventurer, I know you're helping us right now but I think you are better off working not in this field, but in a different one."
  npc_override_lasagna_lasagna_npcs_adventurer_i_m_counting_2f66d6: "Adventurer, I'm counting on you tomorrow as well."
  npc_override_lasagna_lasagna_npcs_adventurer_i_so_desperat_24b881: "Adventurer, I was so desperate back then that I just grabbed anybody who passed by, but I think I hit the jackpot!"
  npc_override_lasagna_lasagna_npcs_adventurer_new_continent_02dffa: "The adventurer from the new continent. What brought you here? Do you need help?"
  npc_override_lasagna_lasagna_npcs_adventurer_please_help_p_4232e7: "Adventurer, please help! Packs of Grass Fabres and Leaf Lunatics are coming this way!"
  npc_override_lasagna_lasagna_npcs_adventurer_please_save_m_1c970c: "Adventurer...please save me..."
  npc_override_lasagna_lasagna_npcs_adventurer_stop_what_you_8e8477: "Adventurer, stop what you're doing just for a minute. I think I can handle it alone from here. You seem too strong for this type of work, you know."
  npc_override_lasagna_lasagna_npcs_adventurer_what_did_lega_45c8f8: "Adventurer, what did Legalas say? Did he say he can deliver kaluna?"
  npc_override_lasagna_lasagna_npcs_adventurer_you_me_small_53b83e: "Adventurer, can you do me a small favor? There are things I must do right now but as you can see, I am shorthanded. What'd you say?"
  npc_override_lasagna_lasagna_npcs_adventurer_you_re_here_a_68036b: "Adventurer, you're here already? It's not the time for lunchbox delivery yet."
  npc_override_lasagna_lasagna_npcs_adventurer_you_re_kind_y_3be291: "Adventurer. You're kind... You saved my life."
  npc_override_lasagna_lasagna_npcs_adventurer_you_waking_me_56bdc2: "Adventurer...? Are you waking me up cuz you're done? Let me see..."
  npc_override_lasagna_lasagna_npcs_adventurers_club_east_he_7c9140: "The Adventurers' Club is to the east from here, so it shouldn't be difficult to find."
  npc_override_lasagna_lasagna_npcs_after_he_couldn_t_get_0a5573: "After that, he couldn't get on a boat ever again. Haha. He became indebted because of the ^0000cdpenalty for breach of contract^000000 and couldn't leave. So he ended up in the anchovy workshop where he removes anchovy head and guts..."
  npc_override_lasagna_lasagna_npcs_after_observing_you_i_ge_a54ffc: "After observing you, I get a feeling that you might better off working not in this field, but in a different one."
  npc_override_lasagna_lasagna_npcs_agi_means_agility_affect_9b63f5: "^4d4dffAGI means agility^000000. It affects ^4d4dffevasion and attack speed^000000."
  npc_override_lasagna_lasagna_npcs_aglio_let_you_more_detai_0a1fe9: "^4d4dffAglio^000000 will let you in on more details. He's right over there."
  npc_override_lasagna_lasagna_npcs_aglio_oligo_225da1: "Aglio and Oligo!"
  npc_override_lasagna_lasagna_npcs_aglio_one_very_i_mean_b36bbb: "Aglio is one of the very, I mean, very good Doram in the Farfalle Vigilante Corp, so watch and learn!"
  npc_override_lasagna_lasagna_npcs_aglioooooo_805b15: "....Aglioooooo!!"
  npc_override_lasagna_lasagna_npcs_ah_adventurer_i_m_so_f2594c: "Ah, adventurer, I'm so glad you're here!"
  npc_override_lasagna_lasagna_npcs_ah_you_re_here_come_6c6c51: "Ah! You're here. Come in. This is a magical place of miraculous elderly lady. It's a shrine."
  npc_override_lasagna_lasagna_npcs_ahem_like_gateway_far_st_6a66c9: "Ahem! This is like a gateway to the Far-Star Continent."
  npc_override_lasagna_lasagna_npcs_ahem_please_tell_part_de_0fba4a: "Ahem, please tell that part in detail!"
  npc_override_lasagna_lasagna_npcs_all_crews_such_gentlemen_b9522e: "All the crews are such gentlemen, but they have no mercy for bad manners. You should be careful about this."
  npc_override_lasagna_lasagna_npcs_all_people_lasagna_love_7a5d95: "All people from Lasagna love kaluna milk, but do you know what It's made of? Kaluna made from well-fermented kalunyak and fresh milk."
  npc_override_lasagna_lasagna_npcs_all_rush_doesn_t_help_326586: "All the rush doesn't help when it comes to cooking."
  npc_override_lasagna_lasagna_npcs_all_them_i_couldn_t_930c62: "Not all of them. I couldn't find them all."
  npc_override_lasagna_lasagna_npcs_all_young_doram_want_joi_2a2e73: "All the young Doram want to join us too!"
  npc_override_lasagna_lasagna_npcs_almost_point_totally_des_9b04f1: "Almost to the point of totally destroying a store."
  npc_override_lasagna_lasagna_npcs_almost_time_us_sail_off_b4ca90: "It is almost the time for us to sail off. You should go back."
  npc_override_lasagna_lasagna_npcs_alright_congratulations_1c900a: "Alright, congratulations on becoming a member of the Vigilante Corp."
  npc_override_lasagna_lasagna_npcs_alright_let_s_go_outside_175661: "Alright, let's go outside and discuss your next test."
  npc_override_lasagna_lasagna_npcs_alright_thank_you_your_h_a916ee: "Alright...Thank you for your...help, I guess..."
  npc_override_lasagna_lasagna_npcs_alright_then_give_anothe_15ced9: "Alright, then. Give it another go!"
  npc_override_lasagna_lasagna_npcs_alright_warm_up_go_elimi_63823c: "Alright, to warm up, go and eliminate ^4d4dffthree Eggrings^000000."
  npc_override_lasagna_lasagna_npcs_alright_you_just_return_84d051: "Alright. You just return to your village."
  npc_override_lasagna_lasagna_npcs_also_i_ll_give_you_5b219d: "Also, I'll give you a new staff."
  npc_override_lasagna_lasagna_npcs_also_means_you_dodge_ene_44fc11: "It also means you can dodge an enemy's attack more easily."
  npc_override_lasagna_lasagna_npcs_also_occupational_sickne_864000: "It is also an occupational sickness."
  npc_override_lasagna_lasagna_npcs_although_person_lasagna_311e9c: "Although this person is not from Lasagna, he has spent meaningful amount of time with Captain Gamberi. You may go talk to him. We can compare the story from him with the interview with Captain Gamberi."
  npc_override_lasagna_lasagna_npcs_always_right_click_when_0c8f2a: "Always right-click when it comes to information! Right-click a human, item and cat to know more about them!"
  npc_override_lasagna_lasagna_npcs_amulet_already_perfect_1886e0: "This amulet is already perfect!"
  npc_override_lasagna_lasagna_npcs_amulet_today_give_me_all_df16ca: "This is the amulet for today! Give me all the Basilrocks you have."
  npc_override_lasagna_lasagna_npcs_anchovy_17dc44: "Anchovy?"
  npc_override_lasagna_lasagna_npcs_anchovy_business_definit_d877b6: "Anchovy business has definitely seen better days, but I'm always short on hands."
  npc_override_lasagna_lasagna_npcs_anchovy_fish_9516d8: "Anchovy is a fish?"
  npc_override_lasagna_lasagna_npcs_anchovy_long_thin_snack_8f7a9e: "Anchovy is a long and thin snack That's a bit salty, Isn't it? But this thing has a head... and eyes too!"
  npc_override_lasagna_lasagna_npcs_anchovy_sounds_great_2bbb7e: "Anchovy sounds great!"
  npc_override_lasagna_lasagna_npcs_anchovy_you_said_you_wan_948ada: "Anchovy. You said you wanted to do something that has to do with anchovies, so I brought you here."
  npc_override_lasagna_lasagna_npcs_and_f0fa6b: "And..."
  npc_override_lasagna_lasagna_npcs_angry_people_who_didn_t_a98c00: "Angry people who didn't get to drink kaluna milk will soon cause a ^0000cdriot^000000, and soon it will spread over the entire Lasagna."
  npc_override_lasagna_lasagna_npcs_annoying_3e7190: "This is annoying."
  npc_override_lasagna_lasagna_npcs_annoying_flies_annoying_07599a: "Annoying flies. Annoying mosquitoes. Just annoying. For what fame and riches am I doing here all alone..."
  npc_override_lasagna_lasagna_npcs_annoying_flies_annoying_ca42ed: "Annoying flies. Annoying mosquitoes. Just annoying. I miss mom and dad."
  npc_override_lasagna_lasagna_npcs_any_case_please_enjoy_yo_b4a47c: "In any case, please enjoy your stay and don't cause any trouble."
  npc_override_lasagna_lasagna_npcs_any_rate_captain_gamberr_4eae68: "At any rate, Captain Gamberry is a good man. He was influenced by me since his ragtag days and now he's become a doram."
  npc_override_lasagna_lasagna_npcs_any_rate_if_he_must_8643f9: "At any rate, if he must depend on a new talisman every day, what's today's talisman? I'm sure the boatswain needs some time to think things over, so until then, he'll need talisman."
  npc_override_lasagna_lasagna_npcs_anybody_here_212362: "Is anybody here?"
  npc_override_lasagna_lasagna_npcs_anyhow_biggest_obstacle_dc01c7: "Anyhow, the biggest obstacle when we started the business was Lasagna's lousy dorams. They pounced on me for a fight. Is everyone who live by sea so belligerent like that?"
  npc_override_lasagna_lasagna_npcs_anyhow_we_re_hurry_down_fef0d3: "Anyhow, we're in a hurry down to the minute and seconds but that sleepyhead is probably sleeping again. So I hope that you, adventurer, can help us again."
  npc_override_lasagna_lasagna_npcs_anyone_who_wants_ride_se_72a5e9: "Anyone who wants to ride the seesaw- come here-"
  npc_override_lasagna_lasagna_npcs_anything_else_4689b4: "Anything else?"
  npc_override_lasagna_lasagna_npcs_anything_else_you_re_cur_9f7162: "Anything else you're curious about?"
  npc_override_lasagna_lasagna_npcs_anything_promise_4e2a9f: "Anything? Is that a promise?"
  npc_override_lasagna_lasagna_npcs_anyway_boatswain_no_choi_a39501: "Anyway, the boatswain has no choice. Live rest of his life, tormented, or become a shaman cat and live somewhat comfortably. Life of a shaman cat Isn't so bad."
  npc_override_lasagna_lasagna_npcs_anyway_enough_depressing_9efb72: "Anyway! Enough of the depressing stuff!"
  npc_override_lasagna_lasagna_npcs_anyway_he_had_huge_debt_c5d3f8: "Anyway, he had a huge debt from the boat and pub. The two mulled over what to do and ended up at the ^0000cdanchovy workshop^000000. Few years later, ^0000cdGamberry became the workshop manager^000000. The job was perfect for him."
  npc_override_lasagna_lasagna_npcs_anyway_i_hope_you_help_e9f263: "Anyway, I hope you help me by finding that box. Please."
  npc_override_lasagna_lasagna_npcs_anyway_i_ll_look_so_30d2d4: "Anyway, I'll look for it, so you take care of them. Just today. Tomorrow, perhaps Magchi will come and get rid of them. But today, you do it. I heard It's because of you."
  npc_override_lasagna_lasagna_npcs_anyway_i_m_cat_who_78e017: "Anyway, I'm the cat who knows how to return the favor."
  npc_override_lasagna_lasagna_npcs_anyway_thank_you_finding_467816: "Anyway, thank you for finding the box."
  npc_override_lasagna_lasagna_npcs_anyway_thanks_your_help_654b71: "Anyway, thanks for your help. It helped a lot."
  npc_override_lasagna_lasagna_npcs_anyway_we_decided_extend_5a5732: "Anyway, we decided to extend our stage to the ^0000cdsea^000000. Such decision was made out of the adventurous spirit of mine."
  npc_override_lasagna_lasagna_npcs_anyway_why_there_cow_shi_b8fae3: "Anyway, why is there a cow on this ship?"
  npc_override_lasagna_lasagna_npcs_anyway_you_re_allowed_co_8da509: "Anyway! You're allowed to come here only when the Farfalle Vigilante accepts."
  npc_override_lasagna_lasagna_npcs_anyways_just_time_myster_d38f6e: "Anyways, just in time. A mysterious thing has just happened, and I need ^0000cda fresh eye who is not involved in it^000000."
  npc_override_lasagna_lasagna_npcs_aren_t_they_just_beautif_204c6f: "Aren't they just beautiful?"
  npc_override_lasagna_lasagna_npcs_aren_t_you_being_trained_d5d1fe: "Aren't you being trained in the vigilante corps? How can you get on the ship when you are not good enough to finish the training? Go back and finish your training!"
  npc_override_lasagna_lasagna_npcs_aren_t_you_mischievous_m_7e533f: "aren't you a mischievous man."
  npc_override_lasagna_lasagna_npcs_aren_t_you_too_weak_85d971: "Aren't you too weak to handle the Dorams in Lasagna?"
  npc_override_lasagna_lasagna_npcs_argh_658e94: "Argh..."
  npc_override_lasagna_lasagna_npcs_argh_give_me_no_no_a8145e: "Argh... Give it to me. No, no. Not like that. Just wrap it a little so that no one can see. Right. Like that. Give me all you have."
  npc_override_lasagna_lasagna_npcs_argh_please_hold_me_litt_8a1e71: "Argh... Please hold me a little. I cannot walk properly."
  npc_override_lasagna_lasagna_npcs_arrived_34a232: "Arrived."
  npc_override_lasagna_lasagna_npcs_arrived_lasagna_drank_fi_cbb8bc: "Arrived in Lasagna. Drank five glasses of kaluna milk."
  npc_override_lasagna_lasagna_npcs_arrived_soft_island_i_do_c7fd9c: "Arrived in Soft Island. I don't know how we found the way in the vast open sea, but It's still amazing."
  npc_override_lasagna_lasagna_npcs_arrows_generated_pointin_d866d0: "Arrows will be generated pointing toward the location of the target.^000000"
  npc_override_lasagna_lasagna_npcs_as_experienced_crew_con_5b99db: "As an experienced crew of Con-Chliina, one must be able to cope with any situation whenever they need to."
  npc_override_lasagna_lasagna_npcs_as_more_people_started_u_1181a7: "As more people started using the ship and accessing the record, he must have felt embarrassed by the record filled with his not so pretty past."
  npc_override_lasagna_lasagna_npcs_as_recipe_simple_takes_g_0fed76: "As the recipe is simple, it takes good ingredients to come up with the best taste. So we get milk from our own cow that we raised."
  npc_override_lasagna_lasagna_npcs_as_you_know_there_s_325738: "But as you know, there's no such thing as ����never���� in life. Yet, we always make the effort to achieve ����never.����"
  npc_override_lasagna_lasagna_npcs_as_you_please_692abf: "As you please."
  npc_override_lasagna_lasagna_npcs_as_you_see_captain_gambe_fed9f5: "As you can see, Captain Gamberi and Pepperoncino only tell the stories they like to tell. We cannot trust the story of Captain Thomas either."
  npc_override_lasagna_lasagna_npcs_ascend_you_mean_going_up_11ea96: "Ascend? You mean going up to the heaven?"
  npc_override_lasagna_lasagna_npcs_ask_about_boarding_con_c_b3de5a: "Ask about boarding the Con-Chliina."
  npc_override_lasagna_lasagna_npcs_ask_about_joining_vigila_c28688: "Ask about joining the Vigilante."
  npc_override_lasagna_lasagna_npcs_ask_about_merchant_band_301ee5: "Ask about merchant band."
  npc_override_lasagna_lasagna_npcs_ask_about_reaching_conti_36402e: "Ask about reaching the continent of Midgard."
  npc_override_lasagna_lasagna_npcs_ask_about_vigilante_29a424: "Ask about the Vigilante."
  npc_override_lasagna_lasagna_npcs_ask_healer_haru_about_co_d69673: "Ask ^4d4dffHealer Haru about the Combination Kit^000000 and she'll help you use it effectively."
  npc_override_lasagna_lasagna_npcs_ask_purser_when_sailing_d0eeaa: "Ask the Purser when the sailing sign will be issued. Depending on the time, we need to either change the ingredients or replenish them."
  npc_override_lasagna_lasagna_npcs_ask_vigilante_how_dragon_00656d: "Ask the vigilante how the dragon is doing and resolve the situation with the vigilante corps if any problem has occurred."
  npc_override_lasagna_lasagna_npcs_ass_different_butt_0eefba: "Is an ass that different from a butt?"
  npc_override_lasagna_lasagna_npcs_awesome_ed5dbb: "Awesome!"
  npc_override_lasagna_lasagna_npcs_ba_basilisks_out_frying_0eb79e: "Ba... Basilisks... Out of the frying pan into the fire. I don't like to deal with those dirty things."
  npc_override_lasagna_lasagna_npcs_baby_cute_ab545b: "Baby, cute..."
  npc_override_lasagna_lasagna_npcs_baby_right_ed425e: "Baby...right?"
  npc_override_lasagna_lasagna_npcs_babysitting_sitting_arou_bd1f3a: "Babysitting is not sitting around quietly. It's looking after a baby!"
  npc_override_lasagna_lasagna_npcs_bad_manners_823b21: "Bad manners!"
  npc_override_lasagna_lasagna_npcs_baked_gold_apple_hard_re_c6dab0: "The ^0000cdBaked Gold Apple^000000. It is hard to resist the golden hue on its surface."
  npc_override_lasagna_lasagna_npcs_banquet_8fe6a7: "Banquet?"
  npc_override_lasagna_lasagna_npcs_basically_you_talk_left_4d8915: "^4d4dffBasically, you talk by left-clicking the mouse button while hovering the cursor over an NPC."
  npc_override_lasagna_lasagna_npcs_basil_basil_lock_38049c: "Basil and basil lock?"
  npc_override_lasagna_lasagna_npcs_basil_locks_holy_water_n_175714: "^0000cd5 basil locks and 1 holy water^000000. In the new world, the holy water drives the evil spirits away. It must've worked when the boatswain came in contact with the people of the new world."
  npc_override_lasagna_lasagna_npcs_basil_locks_you_ll_get_7acdfe: "^0000cd20 basil locks^000000. You'll get your hands very dirty today. I'm sorry. But grandma has spoken so That's the bottom line."
  npc_override_lasagna_lasagna_npcs_basilisks_acting_strange_23c8ef: "The Basilisks are acting strange today."
  npc_override_lasagna_lasagna_npcs_basilisks_charged_task_r_573545: "The ^0000cdbasilisks are charged with the task of recovering Yeouiju^000000."
  npc_override_lasagna_lasagna_npcs_basilisks_still_cave_whe_24d4eb: "Are the basilisks still in the cave? When we were young, we didn't even go near the cave."
  npc_override_lasagna_lasagna_npcs_basilisks_went_rampage_h_a5f200: "Basilisks went on a rampage and he injured his leg. Another vigilante took him, so I'm sure he returned safely."
  npc_override_lasagna_lasagna_npcs_basils_basil_locks_same_124251: "^0000cd20 basils and 5 basil locks^000000. Same as the first. The most basic is the most useful."
  npc_override_lasagna_lasagna_npcs_battle_dorams_specialize_e8d3a7: "Battle Dorams are specialized in summoning."
  npc_override_lasagna_lasagna_npcs_bba_dee18b: "Bba -"
  npc_override_lasagna_lasagna_npcs_beat_red_grass_get_red_6c5490: "^4d4dffBeat the Red Grass and get 1 Red Herb^000000."
  npc_override_lasagna_lasagna_npcs_beats_me_world_full_myst_94aecc: "Beats me. The world is full of mysteries."
  npc_override_lasagna_lasagna_npcs_because_characteristic_l_a23835: "It is because of the characteristic of Lasagna population. It is mostly consisted of the people from other regions. Captain Gamberi and Captain Thomas of Navi are pretty much the only people from Lasagna."
  npc_override_lasagna_lasagna_npcs_because_even_people_othe_87c1d4: "Because of that, even people from other towns are flooding in to join the Vigilante and because of that, we had to turn a sentry post in the southern part of the Ravioli Plain into a waiting area."
  npc_override_lasagna_lasagna_npcs_because_i_m_one_ace_3ae7c9: "Because I'm one of the ace members of the Farfalle Vigilante Corp."
  npc_override_lasagna_lasagna_npcs_because_keeps_them_away_8d5e48: "Because it keeps them away for now."
  npc_override_lasagna_lasagna_npcs_because_pepperoncino_4f617f: "It was because of Pepperoncino."
  npc_override_lasagna_lasagna_npcs_because_pepperoncino_88cac2: "That was because Pepperoncino..."
  npc_override_lasagna_lasagna_npcs_because_you_t_make_kalun_fc36ca: "Because you can't make kaluna milk without kaluna. Someone who was supposed to receive kaluna from Legalas is in a tight spot right now."
  npc_override_lasagna_lasagna_npcs_becoming_shaman_meow_bet_b6d817: "But becoming a shaman meow will be better in many ways. Evil spirits will wear him down more and more to take over his body."
  npc_override_lasagna_lasagna_npcs_befitting_its_fame_place_8da5bd: "Befitting to its fame, this place is packed with people."
  npc_override_lasagna_lasagna_npcs_before_discovered_we_had_524b46: "Before it was discovered, we had no idea Midgard even existed. I'm sure there's a place out there and we just don't know it."
  npc_override_lasagna_lasagna_npcs_before_discovery_new_wor_25270c: "Before the discovery of the new world, we dorams thought that Lasagna was the end of the world. The new world was invisible and so were the countless people who lived there."
  npc_override_lasagna_lasagna_npcs_before_i_advise_you_prac_ff5c1f: "Before that, I advise you to practice with many skills in diverse ways, to help you decide what you like."
  npc_override_lasagna_lasagna_npcs_before_long_midgur_midga_bb6641: "Before long, this Midgur...Midgarr...?? This land will soon be controlled by us, the Dorams!"
  npc_override_lasagna_lasagna_npcs_beginning_they_only_had_b13f69: "In the beginning, they only had a single trading ship that leaked and was half sinking."
