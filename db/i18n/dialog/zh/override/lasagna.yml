  npc_override_lasagna_lasagna_npcs_g_ghost_e8fd3c: "A g-ghost?"
  npc_override_lasagna_lasagna_npcs_g_guys_didn_t_you_ce7117: "G-guys? didn't you want me to find you a babysitting job?"
  npc_override_lasagna_lasagna_npcs_gamberi_took_me_shaman_m_2fcdee: "Gamberi took me to the Shaman meow to get a counselling, but it didn't work. This evil ghost is too old, strong and possessive to be removed."
  npc_override_lasagna_lasagna_npcs_gamberi_who_came_there_t_1ab10e: "Gamberi who came there tried to stop me, but I opened the seal. There was nothing in the ^0000cdpot^000000, and nothing happened."
