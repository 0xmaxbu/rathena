Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@oz_MazeofOz_i_think_good_idea_form_a62655: "I think it would be a good idea to form a ^ff0000party before enter^000000.."
  npc_override_1@oz_MazeofOz_i_think_i_climb_up_5e8f1b: "I think I can climb up using the rope."
  npc_override_1@oz_MazeofOz_i_think_we_use_rope_62f643: "I think we can use the rope to climb up."
  npc_override_1@oz_MazeofOz_let_s_wait_bit_try_6d5ce0: "Let's wait a bit and try again."
  npc_override_1@oz_MazeofOz_menu_imril_72b1bb: "Imril: Thank you! I almost died!"
  npc_override_1@oz_MazeofOz_menu_imril_977f2b: "Imril: And what about those people?"
  npc_override_1@oz_MazeofOz_menu_imril_c69a71: "Imril: I heard you trust people too easily."
  npc_override_1@oz_MazeofOz_menu_imril_daa2e9: "Imril: I'll take some hidden items here, so go up first."
  npc_override_1@oz_MazeofOz_menu_imril_f26c3c: "Imril: The atmosphere is unusual, so don't go downstairs."
  npc_override_1@oz_MazeofOz_menu_leader_4d6811: "Leader: {0}"
  npc_override_1@oz_MazeofOz_menu_magi_3da16b: "Magi: Aaaah!!!"
  npc_override_1@oz_MazeofOz_menu_magi_7accbe: "Magi: This way too!!"
  npc_override_1@oz_MazeofOz_menu_magi_db1fa7: "Magi: My legs look really worn out..."
  npc_override_1@oz_MazeofOz_menu_magi_f7d406: "Magi: Something hot and dusty..."
  npc_override_1@oz_MazeofOz_menu_maram_2b6b15: "Maram: If you climb up the rope in front of here, you can go outside."
  npc_override_1@oz_MazeofOz_menu_maram_338211: "Maram: Imril are you okay?"
  npc_override_1@oz_MazeofOz_menu_maram_452cc6: "Maram: I think my friend is in trouble! I'll go first, so be careful and follow me!"
  npc_override_1@oz_MazeofOz_menu_maram_52941f: "Maram: Go down this road."
  npc_override_1@oz_MazeofOz_menu_maram_61afd3: "Maram: Although it is dangerous and inconvenient now, we have no choice but to use the Maze of Oz."
  npc_override_1@oz_MazeofOz_menu_maram_784bb3: "Maram: What is this voice?!?!?!?!?"
  npc_override_1@oz_MazeofOz_menu_maram_7f4275: "Maram: Especially in areas where the ground has melted a lot, there are many people who try to avoid monsters and end up seriously injured or unable to return due to the lava..."
  npc_override_1@oz_MazeofOz_menu_maram_8592c8: "Maram: It's hard to see, but you can follow the road up here and keep moving!"
  npc_override_1@oz_MazeofOz_menu_maram_874d6b: "Maram: It wasn't like this before, but as the ground below begins to melt, perhaps due to the effects of Mount Tor, more monsters are appearing."
  npc_override_1@oz_MazeofOz_menu_maram_907b7c: "Maram: These are trustworthy people, so don't be so wary."
  npc_override_1@oz_MazeofOz_menu_maram_991fb3: "Maram: Now then, shall we walk down the lovely maze of Oz again?"
  npc_override_1@oz_MazeofOz_menu_maram_9ed05b: "Maram: Since we are in a hiding position, we can't build a bridge or something and advertise that we are hiding here."
  npc_override_1@oz_MazeofOz_menu_maram_a38cd2: "Maram: The area across the bridge has become uninhabitable due to volcanic ash, so they must have been trying to kill him."
  npc_override_1@oz_MazeofOz_menu_maram_a740d8: "Maram: I was a little late because I met a monster on the way."
  npc_override_1@oz_MazeofOz_menu_maram_b625e9: "Maram: They are adventurers who sometimes help my mother with her work."
  npc_override_1@oz_MazeofOz_menu_maram_b73724: "Maram: It's not difficult to build a bridge again..."
  npc_override_1@oz_MazeofOz_menu_maram_b9b31a: "Maram : {0}, are you okay?"
  npc_override_1@oz_MazeofOz_menu_maram_b9d5c6: "Maram: How long will the maze of Oz endure..."
  npc_override_1@oz_MazeofOz_menu_maram_cdfba7: "Maram: Not much left."
  npc_override_1@oz_MazeofOz_menu_maram_d1cdc0: "Maram: That's right."
  npc_override_1@oz_MazeofOz_menu_maram_d4b472: "Maram: Because it's in this condition, it may be that it hasn't been discovered until now."
  npc_override_1@oz_MazeofOz_menu_maram_e92ed4: "Maram: Really? Where on earth do monsters like this come from?"
  npc_override_1@oz_MazeofOz_menu_maram_eafc50: "Maram: It is said that the bridge above was destroyed after seeing natives crossing it while fleeing an attack by hardliners."
  npc_override_1@oz_MazeofOz_menu_maram_ec0ed5: "Maram: Anyway, let's escape quickly before more monsters appear."
  npc_override_1@oz_MazeofOz_menu_maram_f41090: "Maram: It's a big problem because it's getting harder to move supplies because of these monsters."
  npc_override_1@oz_MazeofOz_menu_mark_0b47b6: "Mark: Are you okay?"
  npc_override_1@oz_MazeofOz_menu_mark_8be884: "Mark: Please support the front!!!"
  npc_override_1@oz_MazeofOz_menu_mark_c1cd96: "Mark: Everyone be careful."
  npc_override_1@oz_MazeofOz_menu_miriam_0bf67b: "Miriam: Lava is flowing right below, so ash is always flying."
  npc_override_1@oz_MazeofOz_menu_miriam_249ad8: "Miriam: There were no monsters on the road we passed earlier."
  npc_override_1@oz_MazeofOz_menu_miriam_2b8de0: "Miriam: Everyone is very tired. Let's go up quickly."
  npc_override_1@oz_MazeofOz_menu_miriam_2c1534: "Miriam: Ah!! A monster!!!"
  npc_override_1@oz_MazeofOz_menu_miriam_2f2532: "Miriam: Yes."
  npc_override_1@oz_MazeofOz_menu_miriam_33cb77: "Miriam: It must have been much harder than it is now."
  npc_override_1@oz_MazeofOz_menu_miriam_3db5ae: "Miriam: You have to be very careful when crossing the bridge, so let's talk again at the bridge."
  npc_override_1@oz_MazeofOz_menu_miriam_453467: "Miriam: This is the entrance to the Labyrinth of Oz."
  npc_override_1@oz_MazeofOz_menu_miriam_582ad6: "Miriam: It seems like I see monsters more often than last time."
  npc_override_1@oz_MazeofOz_menu_miriam_706980: "Miriam: If the Maze of Oz didn't exist..."
  npc_override_1@oz_MazeofOz_menu_miriam_7be066: "Miriam: There don't seem to be any monsters around here, so it would be better to move slowly and check the situation again."
  npc_override_1@oz_MazeofOz_menu_miriam_7c1b0b: "Miriam: There may be embers left in the lava ash, so please be careful."
  npc_override_1@oz_MazeofOz_menu_miriam_9624e2: "Miriam: Then, I will cross first, so please follow me slowly. It will be helpful not to look under your feet."
  npc_override_1@oz_MazeofOz_menu_miriam_96ca16: "Miriam: It would be nice if monsters didn't appear, but..."
  npc_override_1@oz_MazeofOz_menu_miriam_99319b: "Miriam: What do you mean..."
  npc_override_1@oz_MazeofOz_menu_miriam_9d2088: "Miriam: Everyone, please move carefully."
  npc_override_1@oz_MazeofOz_menu_miriam_a40ffb: "Miriam: Huh... It wasn't a great monster, but it would have been dangerous for ordinary merchants."
  npc_override_1@oz_MazeofOz_menu_miriam_a909ba: "Miriam: Imril!!!!"
  npc_override_1@oz_MazeofOz_menu_miriam_ae29ae: "Miriam: If you inhale it incorrectly, it will burn your lungs."
  npc_override_1@oz_MazeofOz_menu_miriam_b80b80: "Miriam: I will take care of this rude guy."
  npc_override_1@oz_MazeofOz_menu_miriam_bb33c7: "Miriam: First, please follow the road to the north."
  npc_override_1@oz_MazeofOz_menu_miriam_c57c0b: "Miriam: This bridge is dangerous, so it would be better to share the luggage and cross it one at a time."
  npc_override_1@oz_MazeofOz_menu_miriam_ca4962: "Miriam: You're late! Maram!!!"
  npc_override_1@oz_MazeofOz_menu_miriam_d68def: "Miriam: If you cross the bridge in front of you, it's the real Maze of Oz."
  npc_override_1@oz_MazeofOz_menu_miriam_e7a075: "Miriam : {0} , from now on, just keep going down until you reach a fork in the road."
  npc_override_1@oz_MazeofOz_menu_options_165c89: "??? : Ugh!!!!!"
  npc_override_1@oz_MazeofOz_menu_party_328f2e: "Party: {0}"
  npc_override_1@oz_MazeofOz_menu_tamarin_0af7df: "Tamarin: I heard there used to be a bridge across the canyon?"
  npc_override_1@oz_MazeofOz_menu_tamarin_22fbef: "Tamarin: It also appeared in the back!!!"
  npc_override_1@oz_MazeofOz_menu_tamarin_25e463: "Tamarin: I did it!!!"
  npc_override_1@oz_MazeofOz_menu_tamarin_81d87c: "Tamarin: What if you travel by land?"
  npc_override_1@oz_MazeofOz_menu_tamarin_8f0562: "Tamarin: There are still remains left..."
  npc_override_1@oz_MazeofOz_menu_tamarin_b2e961: "Tamarin: I think this is the way!"
  npc_override_1@oz_MazeofOz_menu_tamarin_c26b63: "Tamarin: Wow... I can't see the bottom."
  npc_override_1@oz_MazeofOz_only_member_party_enter_9eb530: "^ff0000Only a member of the party can enter the Memorial Dungeon.^000000"
  npc_override_1@oz_MazeofOz_open_door_6cc1f0: "Open the door."
  npc_override_1@oz_MazeofOz_party_entering_3748ac: "{0} of the party, {1}, is entering {2}."
  npc_override_1@oz_MazeofOz_please_finish_your_prepa_b4b0d1: "^e5555ePlease finish your preparations^000000 and come back to me."
  npc_override_1@oz_MazeofOz_s_better_wait_bit_before_6e31b6: "It's better to wait a bit before entering."
  npc_override_1@oz_MazeofOz_seems_like_someone_nearb_ca0b91: "It seems like someone was nearby but disappeared quickly."
  npc_override_1@oz_MazeofOz_t_used_yet_let_s_92a56d: "It can't be used yet. Let's talk to Maram first."
  npc_override_1@oz_MazeofOz_then_let_s_head_6aee35: "Then let's head to ^e5555e{0}^000000"
  npc_override_1@oz_MazeofOz_unknown_error_0aeb9e: "^0000ff{0} ^000000- Unknown error"
  npc_override_1@oz_MazeofOz_unknown_error_occurred_285cc7: "^ff0000An unknown error occurred.^000000"
  npc_override_1@oz_MazeofOz_use_rope_climb_up_e7c0cb: "Use the rope to climb up."
  npc_override_1@oz_MazeofOz_we_now_entering_font_siz_38ff4c: "We are now entering the <FONT SIZE = 14><B>^e5555eMaze of Oz^000000</FONT></B>."
  npc_override_1@oz_MazeofOz_where_did_they_go_15c77e: "Where did they go?"
