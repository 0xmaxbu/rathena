Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@oz_MazeofOz_enter_0abb0f: "进入。"
  npc_override_1@oz_MazeofOz_i_think_good_idea_form_a62655: "我觉得在进入之前先组成一个^ff0000队伍^000000是个好主意……"
  npc_override_1@oz_MazeofOz_i_think_i_climb_up_5e8f1b: "我觉得我可以利用绳子爬上去。"
  npc_override_1@oz_MazeofOz_i_think_we_use_rope_62f643: "我觉得我们可以利用绳子爬上去。"
  npc_override_1@oz_MazeofOz_let_s_wait_bit_try_6d5ce0: "我们稍等一下再试。"
  npc_override_1@oz_MazeofOz_menu_imril_72b1bb: "伊姆里尔:谢谢你！我差点死了！"
  npc_override_1@oz_MazeofOz_menu_imril_977f2b: "伊姆里尔:那那些人呢？"
  npc_override_1@oz_MazeofOz_menu_imril_c69a71: "伊姆里尔:我听说你太容易相信别人了。"
  npc_override_1@oz_MazeofOz_menu_imril_daa2e9: "伊姆里尔:我会在这里拿一些隐藏物品，你先上去。"
  npc_override_1@oz_MazeofOz_menu_imril_f26c3c: "伊姆里尔:气氛不寻常，所以不要下楼。"
  npc_override_1@oz_MazeofOz_menu_leader_4d6811: "队长:{0}"
  npc_override_1@oz_MazeofOz_menu_magi_3da16b: "玛吉:啊啊啊！！！"
  npc_override_1@oz_MazeofOz_menu_magi_7accbe: "玛吉:这边也是！！"
  npc_override_1@oz_MazeofOz_menu_magi_db1fa7: "玛吉:我的腿看起来真的很累……"
  npc_override_1@oz_MazeofOz_menu_magi_f7d406: "玛吉:又热又脏……"
  npc_override_1@oz_MazeofOz_menu_maram_2b6b15: "玛拉姆:如果你爬上前方的绳子，就可以出去。"
  npc_override_1@oz_MazeofOz_menu_maram_338211: "玛拉姆:伊姆里尔你还好吗？"
  npc_override_1@oz_MazeofOz_menu_maram_452cc6: "玛拉姆:我觉得我的朋友有麻烦了！我先走，你小心跟上来！"
  npc_override_1@oz_MazeofOz_menu_maram_52941f: "玛拉姆:沿着这条路走。"
  npc_override_1@oz_MazeofOz_menu_maram_61afd3: "玛拉姆:虽然现在危险又不方便，但我们别无选择只能使用奥兹迷宫。"
  npc_override_1@oz_MazeofOz_menu_maram_784bb3: "玛拉姆:这是什么声音？！？！？！？！"
  npc_override_1@oz_MazeofOz_menu_maram_7f4275: "玛拉姆:特别是在地面融化了很多的区域，有很多人试图躲避怪物，结果却因岩浆而严重受伤或无法返回……"
  npc_override_1@oz_MazeofOz_menu_maram_8592c8: "玛拉姆:虽然很难看清，但你可以沿着这条路向上走，继续前进！"
  npc_override_1@oz_MazeofOz_menu_maram_874d6b: "玛拉姆:以前不是这样的，但随着下方地面开始融化，也许是由于托尔火山的影响，出现了更多怪物。"
  npc_override_1@oz_MazeofOz_menu_maram_907b7c: "玛拉姆:这些是值得信任的人，所以别那么警惕。"
  npc_override_1@oz_MazeofOz_menu_maram_991fb3: "玛拉姆:那么，我们再次走过可爱的奥兹迷宫好吗？"
  npc_override_1@oz_MazeofOz_menu_maram_9ed05b: "玛拉姆:既然我们处于隐藏位置，就不能建桥或做类似的事情来宣传我们藏在这里。"
  npc_override_1@oz_MazeofOz_menu_maram_a38cd2: "玛拉姆:桥对面的区域因火山灰变得无法居住，所以他们一定是想杀了他。"
  npc_override_1@oz_MazeofOz_menu_maram_a740d8: "玛拉姆:我在路上遇到了怪物，所以来晚了一点。"
  npc_override_1@oz_MazeofOz_menu_maram_b625e9: "玛拉姆:他们是有时会帮我母亲工作的冒险者。"
  npc_override_1@oz_MazeofOz_menu_maram_b73724: "玛拉姆:重新建桥并不难……"
  npc_override_1@oz_MazeofOz_menu_maram_b9b31a: "玛拉姆:{0}，你还好吗？"
  npc_override_1@oz_MazeofOz_menu_maram_b9d5c6: "玛拉姆:奥兹迷宫还能坚持多久……"
  npc_override_1@oz_MazeofOz_menu_maram_cdfba7: "玛拉姆:没多少了。"
  npc_override_1@oz_MazeofOz_menu_maram_d1cdc0: "玛拉姆:没错。"
  npc_override_1@oz_MazeofOz_menu_maram_d4b472: "玛拉姆:正因为处于这种状况，它可能直到现在才被发现。"
  npc_override_1@oz_MazeofOz_menu_maram_e92ed4: "玛拉姆:真的吗？这种怪物到底是从哪里来的？"
  npc_override_1@oz_MazeofOz_menu_maram_eafc50: "玛拉姆:据说在看到当地人过桥躲避强硬派攻击后，上方的桥被毁掉了。"
  npc_override_1@oz_MazeofOz_menu_maram_ec0ed5: "玛拉姆:不管怎样，在更多怪物出现之前我们快逃吧。"
  npc_override_1@oz_MazeofOz_menu_maram_f41090: "玛拉姆:因为怪物越来越多，运输物资变得越来越困难，这是个大问题。"
  npc_override_1@oz_MazeofOz_menu_mark_0b47b6: "马克:你还好吗？"
  npc_override_1@oz_MazeofOz_menu_mark_8be884: "马克:请支援前方！！！"
  npc_override_1@oz_MazeofOz_menu_mark_c1cd96: "马克:大家小心。"
  npc_override_1@oz_MazeofOz_menu_miriam_0bf67b: "米里亚姆:岩浆就在下方流淌，所以灰烬总是飞扬。"
  npc_override_1@oz_MazeofOz_menu_miriam_249ad8: "米里亚姆:我们之前经过的路上没有怪物。"
  npc_override_1@oz_MazeofOz_menu_miriam_2b8de0: "米里亚姆:大家都很累。我们快点上去。"
  npc_override_1@oz_MazeofOz_menu_miriam_2c1534: "米里亚姆:啊！！怪物！！！"
  npc_override_1@oz_MazeofOz_menu_miriam_2f2532: "米里亚姆:是的。"
  npc_override_1@oz_MazeofOz_menu_miriam_33cb77: "米里亚姆:那一定比现在困难得多。"
  npc_override_1@oz_MazeofOz_menu_miriam_3db5ae: "米里亚姆:过桥时必须非常小心，所以我们在桥上再谈。"
  npc_override_1@oz_MazeofOz_menu_miriam_453467: "米里亚姆:这是奥兹迷宫的入口。"
  npc_override_1@oz_MazeofOz_menu_miriam_582ad6: "米里亚姆:似乎比上次看到怪物更频繁了。"
  npc_override_1@oz_MazeofOz_menu_miriam_706980: "米里亚姆:如果没有奥兹迷宫……"
  npc_override_1@oz_MazeofOz_menu_miriam_7be066: "米里亚姆:这附近似乎没有怪物，所以最好慢慢移动，再次检查情况。"
  npc_override_1@oz_MazeofOz_menu_miriam_7c1b0b: "米里亚姆:岩浆灰中可能还有余烬，请小心。"
  npc_override_1@oz_MazeofOz_menu_miriam_9624e2: "米里亚姆:那么，我先过桥，请慢慢跟上来。不要看脚下会有帮助。"
  npc_override_1@oz_MazeofOz_menu_miriam_96ca16: "米里亚姆:如果怪物不出现就好了，但是……"
  npc_override_1@oz_MazeofOz_menu_miriam_99319b: "米里亚姆:你是什么意思……"
  npc_override_1@oz_MazeofOz_menu_miriam_9d2088: "米里亚姆:大家请小心移动。"
  npc_override_1@oz_MazeofOz_menu_miriam_a40ffb: "米里亚姆:呼……虽然不是很大的怪物，但对普通商人来说会很危险。"
  npc_override_1@oz_MazeofOz_menu_miriam_a909ba: "米里亚姆:伊姆里尔！！！！"
  npc_override_1@oz_MazeofOz_menu_miriam_ae29ae: "米里亚姆:如果吸入不当，会灼伤肺部。"
  npc_override_1@oz_MazeofOz_menu_miriam_b80b80: "米里亚姆:我会处理这个粗鲁的家伙。"
  npc_override_1@oz_MazeofOz_menu_miriam_bb33c7: "米里亚姆:首先，请沿着路向北走。"
  npc_override_1@oz_MazeofOz_menu_miriam_c57c0b: "米里亚姆:这座桥很危险，所以最好分担行李，一个一个过桥。"
  npc_override_1@oz_MazeofOz_menu_miriam_ca4962: "米里亚姆:你来晚了！玛拉姆！！！"
  npc_override_1@oz_MazeofOz_menu_miriam_d68def: "米里亚姆:如果你过了前面的桥，就是真正的奥兹迷宫了。"
  npc_override_1@oz_MazeofOz_menu_miriam_e7a075: "米里亚姆:{0}，从现在起一直往下走，直到到达岔路口。"
  npc_override_1@oz_MazeofOz_menu_options_165c89: "??? : 呜！！！！！"
  npc_override_1@oz_MazeofOz_menu_party_328f2e: "队伍:{0}"
  npc_override_1@oz_MazeofOz_menu_tamarin_0af7df: "塔马林:我听说以前峡谷上有一座桥？"
  npc_override_1@oz_MazeofOz_menu_tamarin_22fbef: "塔马林:后面也出现了！！"
  npc_override_1@oz_MazeofOz_menu_tamarin_25e463: "塔马林:我做到了！！！"
  npc_override_1@oz_MazeofOz_menu_tamarin_81d87c: "塔马林:如果你走陆路旅行会怎样？"
  npc_override_1@oz_MazeofOz_menu_tamarin_8f0562: "塔马林:还有遗迹留下……"
  npc_override_1@oz_MazeofOz_menu_tamarin_b2e961: "塔马林:我觉得这是路！"
  npc_override_1@oz_MazeofOz_menu_tamarin_c26b63: "塔马林:哇……我看不到底。"
  npc_override_1@oz_MazeofOz_only_member_party_enter_9eb530: "^ff0000只有队伍成员可以进入纪念副本。^000000"
  npc_override_1@oz_MazeofOz_open_door_6cc1f0: "打开门。"
  npc_override_1@oz_MazeofOz_party_entering_3748ac: "队伍{1}的{0}正在进入{2}。"
  npc_override_1@oz_MazeofOz_please_finish_your_prepa_b4b0d1: "^e5555e请完成你的准备^000000然后回来找我。"
  npc_override_1@oz_MazeofOz_quit_fb25bb: "退出。"
  npc_override_1@oz_MazeofOz_s_better_wait_bit_before_6e31b6: "进入之前最好稍等一下。"
  npc_override_1@oz_MazeofOz_seems_like_someone_nearb_ca0b91: "似乎有人曾在附近但很快消失了。"
  npc_override_1@oz_MazeofOz_t_used_yet_let_s_92a56d: "还不能使用。我们先跟玛拉姆谈谈。"
  npc_override_1@oz_MazeofOz_then_let_s_head_6aee35: "那我们前往^e5555e{0}^000000"
  npc_override_1@oz_MazeofOz_unknown_error_0aeb9e: "^0000ff{0} ^000000- 未知错误"
  npc_override_1@oz_MazeofOz_unknown_error_occurred_285cc7: "^ff0000发生未知错误。^000000"
  npc_override_1@oz_MazeofOz_use_cd32c0: "不要使用。"
  npc_override_1@oz_MazeofOz_use_rope_climb_up_e7c0cb: "利用绳子爬上去。"
  npc_override_1@oz_MazeofOz_we_now_entering_font_siz_38ff4c: "我们现在正在进入<FONT SIZE = 14><B>^e5555e奥兹迷宫^000000</FONT></B>。"
  npc_override_1@oz_MazeofOz_where_did_they_go_15c77e: "他们去哪里了？"
