  npc_override_ecl_fild01_quests_eclage_although_i_aware_hearing_786ed2: "虽然我知道这件事，但再听到它让我感到孤独。"
  npc_override_ecl_fild01_quests_eclage_although_i_didn_t_expect_e65a6d: "虽然我没想到送货会是这样。"
  npc_override_ecl_fild01_quests_eclage_although_i_expecting_61cb2d: "虽然我料到会这样……"
  npc_override_ecl_fild01_quests_eclage_although_i_prefer_travel_e752d0: "虽然我更喜欢独自旅行，"
  npc_override_ecl_fild01_quests_eclage_although_kar_mayor_he_mi_d43edf: "虽然卡尔是市长，但他可能是历史上权力最小的市长。"
  npc_override_ecl_fild01_quests_eclage_although_luen_45a9e2: "虽然卢恩"
  npc_override_ecl_fild01_quests_eclage_although_one_think_they_633ff6: "虽然看到它们攻击人类，会认为它们不是食草动物，但是"
  npc_override_ecl_fild01_quests_eclage_although_orb_s_inner_cor_0a0651: "虽然宝珠的内核已经消失，但我和哥哥一直在收集我们的魔力并持续为宝珠供能。"
  npc_override_ecl_fild01_quests_eclage_although_s_called_clock_4a105e: "虽然它叫钟楼，但里面的怪物比钟表还多。我亲自数过，真的！"
  npc_override_ecl_fild01_quests_eclage_although_s_inside_eclage_6dd66b: "虽然严格来说它不在艾克拉奇里面！啊哈哈哈哈哈"
  npc_override_ecl_fild01_quests_eclage_although_s_occupied_horr_4508bb: "虽然它现在被可怕的怪物占据了。"
  npc_override_ecl_fild01_quests_eclage_although_s_one_dud_rewar_0a8321: "虽然它是'哑弹'奖励之一~！"
  npc_override_ecl_fild01_quests_eclage_although_typical_laphine_d175cf: "虽然，对于典型的拉芬来说，对我们来说微不足道的东西可能被认为非常巨大……"
  npc_override_ecl_fild01_quests_eclage_although_vague_i_felt_ne_6d9832: "虽然很模糊，但我在彩虹桥附近感觉到了，但是……"
  npc_override_ecl_fild01_quests_eclage_although_we_t_let_any_3d8f88: "虽然我们不能让其他种族掌管宝珠，因为它对我们拉芬来说非常有意义，"
  npc_override_ecl_fild01_quests_eclage_although_you_all_rights_4147a5: "虽然你有权说不，但这就是我得到的……"
  npc_override_ecl_fild01_quests_eclage_although_you_might_want_9adf05: "虽然你可能想为艾克拉奇做更多的工作，"
  npc_override_ecl_fild01_quests_eclage_although_you_re_foreigne_5d9622: "虽然你是外国人，但既然你知道一切，你就有义务保护宝珠。"
  npc_override_ecl_fild01_quests_eclage_always_feels_like_lookin_c1444c: "每次见到罗伯特先生，总感觉像在看镜子……"
  npc_override_ecl_fild01_quests_eclage_am_i_going_like_leading_df6f0c: "我会不会像肥皂剧中扮演悲剧角色的女主角？"
  npc_override_ecl_fild01_quests_eclage_am_i_only_one_so_200041: "只有我这么闲吗？"
  npc_override_ecl_fild01_quests_eclage_am_i_really_only_one_2295d6: "真的只有我一个人吗？"
  npc_override_ecl_fild01_quests_eclage_am_i_upset_592732: "我生气了吗？"
  npc_override_ecl_fild01_quests_eclage_among_laphines_you_seen_d250dc: "在拉芬中，你见过那些个子更高、皮肤特别白皙、翅膀华丽的吗？"
  npc_override_ecl_fild01_quests_eclage_among_many_books_shelves_bce5a4: "在这个房间书架上的众多书籍中，我的肖像画被夹在什么地方当作书签。请找到它！"
  npc_override_ecl_fild01_quests_eclage_among_many_monsters_prof_409260: "在蠕虫教授放出的众多怪物中，^FF0000蓝色李希特恩^000000一直试图咬我。"
  npc_override_ecl_fild01_quests_eclage_among_stolen_items_two_b_00e9a4: "被盗物品中还有两瓶酒！"
  npc_override_ecl_fild01_quests_eclage_among_those_places_reach_01e4ce: "在那些可以乘船到达的地方中，有一个小岛，那里停泊着一艘失事的船。"
  npc_override_ecl_fild01_quests_eclage_among_those_places_reach_590424: "在那些可以乘船到达的地方中，有一个著名的目的地。"
  npc_override_ecl_fild01_quests_eclage_anais_likes_685581: "<- 安娜伊斯喜欢这个。"
  npc_override_ecl_fild01_quests_eclage_analysis_enough_now_f83887: "目前的分析足够了"
  npc_override_ecl_fild01_quests_eclage_and_373dd2: "而且.."
  npc_override_ecl_fild01_quests_eclage_and_f0fa6b: "而且……"
  npc_override_ecl_fild01_quests_eclage_and_that_be865c: "而且'那个'……"
  npc_override_ecl_fild01_quests_eclage_annoying_bcd940: "真烦人.."
  npc_override_ecl_fild01_quests_eclage_another_diary_frog_outsi_004a69: "另一只日记蛙应该在塔外的某个地方。"
  npc_override_ecl_fild01_quests_eclage_another_diary_frog_proba_5147e4: "另一只日记蛙可能被扔到了塔的一楼。"
  npc_override_ecl_fild01_quests_eclage_answer_girl_who_both_pri_d0d12e: "答案是一个既是牧师又是领袖的女孩。这是因为阿鲁纳菲尔特是一个神权实体。"
  npc_override_ecl_fild01_quests_eclage_any_case_discovery_rift_8f3b52: "无论如何，在这附近发现裂隙是绝对机密。"
  npc_override_ecl_fild01_quests_eclage_any_case_finding_great_b_351ddb: "无论如何，亲手找到大鸟的蛋可能比收到它作为礼物更好，对吧？"
  npc_override_ecl_fild01_quests_eclage_any_case_how_old_moreng_00ed8b: "无论如何，莫伦格现在多大了？"
  npc_override_ecl_fild01_quests_eclage_any_case_isn_t_crazy_20052b: "不管怎样，他们在我出生之前就是朋友了，这难道不疯狂吗？"
  npc_override_ecl_fild01_quests_eclage_any_case_such_terrible_i_5eb2d1: "无论如何，我朋友家发生了这么可怕的事件，我请求你抓住那个强盗。"
  npc_override_ecl_fild01_quests_eclage_any_case_thanks_lot_you_4c97b3: "无论如何，非常感谢。你找到了我父亲……"
  npc_override_ecl_fild01_quests_eclage_any_case_thanks_so_much_89dcef: "无论如何，非常感谢！"
  npc_override_ecl_fild01_quests_eclage_any_case_through_much_re_d9a1b7: "无论如何，经过大量研究，我终于有了结果。"
  npc_override_ecl_fild01_quests_eclage_any_case_what_you_plan_74c256: "无论如何。你打算做什么？"
  npc_override_ecl_fild01_quests_eclage_any_good_news_050979: "有什么好消息吗？"
  npc_override_ecl_fild01_quests_eclage_any_rate_all_my_days_89d13d: "不管怎么说，在我认识乌鲁的所有日子里，这是我第一次看到他这么开心。"
