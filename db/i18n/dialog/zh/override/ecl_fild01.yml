  npc_override_ecl_fild01_quests_eclage_oh_thanks_first_time_rec_2b1111: "哦！谢谢！这是我第一次从人类那里收到薪水。我以豹神之名祝福你未来顺利。"
  npc_override_ecl_fild01_quests_eclage_oh_they_started_working_516a77: "哦，他们开始工作了？那我开始浇灌大地吧。我是说，有时候我们拉芬也可以很务实的！"
  npc_override_ecl_fild01_quests_eclage_oh_wait_two_friends_reun_fbdbe5: "哦，等等……两个朋友又重聚在一起了，对吧？"
  npc_override_ecl_fild01_quests_eclage_oh_way_5fdd3c: "哦，顺便说一下，"
  npc_override_ecl_fild01_quests_eclage_oh_way_decorations_you_b_2f6c53: "哦，顺便说一下，你带来的装饰品在其他拉芬中很受欢迎。"
  npc_override_ecl_fild01_quests_eclage_oh_way_i_told_chief_463e92: "哦，顺便说一下，我告诉参谋长给你一些东西。"
  npc_override_ecl_fild01_quests_eclage_oh_well_6e7eea: "哦好吧……"
  npc_override_ecl_fild01_quests_eclage_oh_well_747de8: "哦……好吧……"
  npc_override_ecl_fild01_quests_eclage_oh_well_fac51b: "哦，好吧！"
  npc_override_ecl_fild01_quests_eclage_oh_well_i_ll_just_de3f67: "哦好吧，我就做我今天早些时候做的动作。你知道，菲利应该第一个看到我新动作的人，所以……"
  npc_override_ecl_fild01_quests_eclage_oh_what_happened_here_3159f7: "哦……这里发生了什么事？"
  npc_override_ecl_fild01_quests_eclage_oh_whatever_i_m_going_7118d6: "哦随便了，我要把你扔出去！"
  npc_override_ecl_fild01_quests_eclage_oh_wow_just_so_crazy_94be90: "哦哇，这太疯狂了。"
  npc_override_ecl_fild01_quests_eclage_oh_yeah_me_5e077d: "哦是的，就是我！"
  npc_override_ecl_fild01_quests_eclage_oh_yeah_you_talking_abou_579939: "哦是的，你说的是我们在长老议会面前争论的那次。"
  npc_override_ecl_fild01_quests_eclage_oh_yes_mayor_bestowed_wi_85c773: "哦，是的。市长赐予了你翅膀。"
  npc_override_ecl_fild01_quests_eclage_oh_you_also_midgard_12054c: "哦！你也是来自米德加德的吗？"
  npc_override_ecl_fild01_quests_eclage_oh_you_bought_didn_t_ea9b40: "哦……你买了，不是吗？"
  npc_override_ecl_fild01_quests_eclage_oh_you_came_ask_me_db831c: "哦，你也是来问我关于羽毛的事的吗？"
