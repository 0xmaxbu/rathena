  npc_override_ecl_fild01_quests_eclage_there_s_no_way_64fc7c: "不可能！"
  npc_override_ecl_fild01_quests_eclage_there_s_no_way_anyone_17e6ec: "不可能有人入侵了它！那意味着，你……你就是！"
  npc_override_ecl_fild01_quests_eclage_there_s_no_way_house_66cebc: "房子不可能"
  npc_override_ecl_fild01_quests_eclage_there_s_no_way_i_aade0d: "收到那个孩子的项链后我不可能感觉良好。我知道这可能很麻烦，但请把它还给他。"
  npc_override_ecl_fild01_quests_eclage_there_s_no_way_i_edb4f1: "我不可能怀疑他们！"
