  npc_override_ecl_fild01_quests_eclage_they_re_all_same_2d8373: "它们根本不一样！"
  npc_override_ecl_fild01_quests_eclage_they_re_donas_way_normal_cc010e: "他们是'多纳'。顺便说一下，长相普通的拉芬在他们的语言中被称为'帕庞'。"
