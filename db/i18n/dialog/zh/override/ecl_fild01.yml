  npc_override_ecl_fild01_quests_eclage_anyway_donas_strong_magi_48c499: "总之，多纳拥有强大的魔力，寿命更长。但因为数量不多，大多数都被分配到重要职位。"
  npc_override_ecl_fild01_quests_eclage_anyway_i_allow_you_visit_34a67a: "总之，我允许你随时来访。"
  npc_override_ecl_fild01_quests_eclage_anyway_i_don_t_know_33fb23: "总之，我不知道阿凡特的下落。"
  npc_override_ecl_fild01_quests_eclage_anyway_i_don_t_say_befd65: "总之，我对他的个人赞助事务没有发言权。"
  npc_override_ecl_fild01_quests_eclage_anyway_i_had_no_idea_83c57f: "总之，我没想到他会做这种研究。"
  npc_override_ecl_fild01_quests_eclage_anyway_i_heard_nydhog_796b24: "总之……我从尼德霍格那里听说了。"
  npc_override_ecl_fild01_quests_eclage_anyway_i_ll_make_sure_1f06fb: "总之，我会确保把你的故事报告给上级办公室，你迟早会收到他们的消息。"
  npc_override_ecl_fild01_quests_eclage_anyway_i_m_already_like_4231c0: "总之，我在你心里已经是你的朋友了？"
  npc_override_ecl_fild01_quests_eclage_anyway_i_m_doing_well_a84f1f: "总之，我过得很好。告诉他不用担心我。"
  npc_override_ecl_fild01_quests_eclage_anyway_i_ve_heard_there_1ecf41: "总之，我听说有人"
  npc_override_ecl_fild01_quests_eclage_anyway_i_want_know_what_7da2cd: "总之，我想知道辉煌之地和约顿海姆现在的情况。"
  npc_override_ecl_fild01_quests_eclage_anyway_if_magical_powers_fea36a: "总之，如果宝珠的魔力那么强大，不会留下巨大的能量痕迹吗？"
  npc_override_ecl_fild01_quests_eclage_anyway_if_what_you_re_075f60: "总之，如果你说的是真的，那就是个大问题。"
  npc_override_ecl_fild01_quests_eclage_anyway_isn_t_ordinary_pl_4f6394: "总之，这不是个普通的地方。这个地方充满了新闻价值的故事！"
  npc_override_ecl_fild01_quests_eclage_anyway_kar_became_king_l_79d389: "总之，卡尔成为了国王，但失去了他的一生。"
  npc_override_ecl_fild01_quests_eclage_anyway_let_s_wait_see_20aaf5: "总之，让我们拭目以待是否有任何机会。"
  npc_override_ecl_fild01_quests_eclage_anyway_now_i_found_out_720ffc: "总之，既然我发现了这件事，"
  npc_override_ecl_fild01_quests_eclage_anyway_now_we_know_his_a10c82: "总之，既然我们知道他的下落，我们去告诉卡尔吧。"
  npc_override_ecl_fild01_quests_eclage_anyway_s_true_there_acti_562120: "总之，多亏有你们，确实有了积极的互动。"
  npc_override_ecl_fild01_quests_eclage_anyway_tell_her_i_said_4683f8: "总之，告诉她我说的。"
  npc_override_ecl_fild01_quests_eclage_anyway_thanks_ff1f6b: "总之，谢谢。"
  npc_override_ecl_fild01_quests_eclage_anyway_there_number_mons_453527: "总之，有超过10个地区有众多怪物共同生活；都在格拉斯海姆的上部和下部。"
  npc_override_ecl_fild01_quests_eclage_anyway_they_seem_worried_ed0d38: "总之，他们似乎很担心现任市长卡杜伊。"
  npc_override_ecl_fild01_quests_eclage_anyway_time_he_gone_too_003cd8: "总之，这次他太过分了。"
  npc_override_ecl_fild01_quests_eclage_anyway_we_should_look_av_f96800: "总之，我们应该找阿凡特？"
  npc_override_ecl_fild01_quests_eclage_anyway_what_happened_me_294f98: "总之，这就是我的遭遇。"
  npc_override_ecl_fild01_quests_eclage_anyway_you_seem_so_healt_3178ad: "总之，你看起来很健康，就像一条刚捕到的鱼。"
  npc_override_ecl_fild01_quests_eclage_anyway_you_should_find_s_23b95a: "总之，你也应该找些大地的工作。告诉菲力我会开始工作。"
  npc_override_ecl_fild01_quests_eclage_anyway_you_still_interes_d19821: "总之，你还对我资助的魔法学者感兴趣吗？"
  npc_override_ecl_fild01_quests_eclage_anyway_you_who_came_long_06cfef: "总之，你从远方来"
  npc_override_ecl_fild01_quests_eclage_anyways_ec35f1: "总之……"
  npc_override_ecl_fild01_quests_eclage_anyways_fon_t_make_4c3a7c: "总之，丰来不了吗？"
  npc_override_ecl_fild01_quests_eclage_anyways_goatie_also_ther_c11c8c: "总之，^0000cd山羊^000000也和我在一起，所以 also 问问他。"
  npc_override_ecl_fild01_quests_eclage_anyways_i_don_t_think_656fd4: "总之，我不认为有"
  npc_override_ecl_fild01_quests_eclage_anyways_i_think_s_f158fc: "总之，我认为那是"
  npc_override_ecl_fild01_quests_eclage_anyways_i_think_s_pretty_a4e4ae: "总之，我想我就知道这么多。"
  npc_override_ecl_fild01_quests_eclage_anyways_important_know_s_b3147f: "总之，那很重要，我们最好让莫伦格知道。"
  npc_override_ecl_fild01_quests_eclage_anyways_we_wrote_letters_1c15df: "总之，我们定期互相写信，但联系突然中断，我急忙来看他，发现^0000cd他被关进了监狱^000000。"
  npc_override_ecl_fild01_quests_eclage_apparently_cause_war_see_912fb6: "显然，战争的原因似乎是萨菲亚过度采矿对世界树造成的损害，但是……"
  npc_override_ecl_fild01_quests_eclage_area_interest_i_used_res_d3992b: "这是我入狱前的研究兴趣领域。艾克拉奇的诞生历史。而且它们是官方历史文件中没有记录的历史部分。"
  npc_override_ecl_fild01_quests_eclage_area_kind_broken_so_care_6fcbbc: "这个区域有点破损，小心点。"
  npc_override_ecl_fild01_quests_eclage_aren_t_green_herbs_so_a50b3e: "绿色草药不是很常见吗？"
