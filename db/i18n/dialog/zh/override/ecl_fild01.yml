  npc_override_ecl_fild01_quests_eclage_research_report_my_broth_c92237: "这是……^0000cd一份研究报告^000000。我兄弟，他一定看到了这个然后……"
  npc_override_ecl_fild01_quests_eclage_research_still_ongoing_i_4b2991: "研究仍在进行中。如果我有一丝希望，我会紧紧抓住它，但我似乎还没有找到。"
