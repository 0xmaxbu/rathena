  npc_override_ecl_fild01_quests_eclage_oh_you_don_t_mean_daacfa: "哦……你不会是说克莱弗吧..？"
  npc_override_ecl_fild01_quests_eclage_oh_you_here_e772f8: "哦，你来了！"
  npc_override_ecl_fild01_quests_eclage_oh_you_here_help_me_1c2ec9: "哦，你是来帮我的吗？我想他们说的是真的。很抱歉请你帮这个忙，但你能从他们那里获取这些信息吗？"
  npc_override_ecl_fild01_quests_eclage_oh_you_met_my_brother_6146d1: "哦，{0}你见过我兄弟了吗？他怎么样了？"
  npc_override_ecl_fild01_quests_eclage_oh_you_one_earlier_i_3a5218: "哦！你就是之前那个。你来这里我真的很感激！请帮帮我。我这里的事情似乎处理不完。"
  npc_override_ecl_fild01_quests_eclage_oh_you_re_back_ce2ef3: "哦你回来了。"
  npc_override_ecl_fild01_quests_eclage_oh_you_talking_about_may_3f309d: "哦，你说均市长？叫他陛下吧。他对我们来说就像偶像一样的存在。"
  npc_override_ecl_fild01_quests_eclage_oh_you_want_exercise_you_855fb7: "哦，你想行使你的权利保持沉默？"
  npc_override_ecl_fild01_quests_eclage_ohhhh_unfortunately_you_5ec6ea: "哦嗬~~不幸的是~你被"
  npc_override_ecl_fild01_quests_eclage_ohhhhh_look_3dca3b: "哦嗬嗬嗬看那个！！！"
  npc_override_ecl_fild01_quests_eclage_ok_i_didn_t_my_096fed: "好吧，我没有！天哪，我没有烤那个派！！！"
  npc_override_ecl_fild01_quests_eclage_ok_i_m_going_rest_b643a8: "好吧，我要和其他人一起在这里休息，所以做你需要做的事。"
  npc_override_ecl_fild01_quests_eclage_ok_i_should_hurry_party_ee8959: "好吧，我应该赶快准备派对。"
  npc_override_ecl_fild01_quests_eclage_ok_if_you_don_t_091525: "好吧，如果你不介意的话，你能把这个交给广场上的送货员吗？"
  npc_override_ecl_fild01_quests_eclage_ok_let_s_say_you_a24535: "好吧，假设你先恢复家园树。然后呢？你要怎么处理它会从土地中吸收的所有能量？"
  npc_override_ecl_fild01_quests_eclage_ok_look_through_all_you_d17264: "好吧，你想怎么看就怎么看。"
  npc_override_ecl_fild01_quests_eclage_ok_oh_well_then_9a5e0e: "好吧。哦好吧。"
  npc_override_ecl_fild01_quests_eclage_ok_so_what_about_restroo_accfda: "好吧，那洗手间呢。"
  npc_override_ecl_fild01_quests_eclage_ok_sure_i_give_you_465df3: "好吧，当然。我会给你的。我相信我父亲也会希望你拥有它。"
  npc_override_ecl_fild01_quests_eclage_ok_then_03d28f: "好吧，"
  npc_override_ecl_fild01_quests_eclage_ok_then_i_tell_you_742706: "好吧，那我就告诉你光之标准只告诉我的故事，关于他在米德加德深山里遇到一只吃宝石的金色怪物！"
  npc_override_ecl_fild01_quests_eclage_ok_there_s_no_other_4c6591: "好吧，没有其他办法了。如果不是我们的想象，我们必须再次确认以识别那声音到底是什么。我们必须确保那不是幻觉。"
  npc_override_ecl_fild01_quests_eclage_ok_your_way_now_44846d: "好吧，现在你可以走了。"
  npc_override_ecl_fild01_quests_eclage_okay_24b0b7: "还好吗？"
  npc_override_ecl_fild01_quests_eclage_okay_512623: "好的！"
  npc_override_ecl_fild01_quests_eclage_okay_i_see_i_ll_eb3ec3: "好的……我明白了。那我就找别的办法。如果你出去的路上遇到那个肌肉拉芬，告诉他我再也见不到他了……"
  npc_override_ecl_fild01_quests_eclage_okay_i_ve_decided_d53c5e: "好的，我已经决定了。"
  npc_override_ecl_fild01_quests_eclage_okay_if_you_talk_golie_8380d8: "好的，如果你和塔外城市附近工作的[戈利]谈话，他会给你新的桥梁部件。"
  npc_override_ecl_fild01_quests_eclage_old_man_ep_723ce2: "老人#ep14_2"
  npc_override_ecl_fild01_quests_eclage_old_man_you_happen_know_2d6348: "但是老人，你碰巧知道关于米德加德大鸟传说的任何事吗？"
  npc_override_ecl_fild01_quests_eclage_oliver_0aae05: "奥利弗……"
  npc_override_ecl_fild01_quests_eclage_oliver_eat_more_7bfd8f: "奥利弗，多吃点。"
  npc_override_ecl_fild01_quests_eclage_oliver_hilpert_bf1b96: "奥利弗·希尔珀特……"
  npc_override_ecl_fild01_quests_eclage_once_enough_kind_strong_8c9467: "那种强风有一次就够了。"
  npc_override_ecl_fild01_quests_eclage_once_everything_goes_bac_9726ad: "一旦一切恢复正常，我想和你多聊聊。"
  npc_override_ecl_fild01_quests_eclage_once_i_confessed_everyth_59d822: "一旦我承认了一切，"
  npc_override_ecl_fild01_quests_eclage_once_upon_time_used_very_0e3ebd: "很久以前，它曾是一个非常好的观测站。"
  npc_override_ecl_fild01_quests_eclage_one_day_high_level_laphi_75ac07: "有一天，一个名叫^0000cd姆瓦里迪卡^000000的高级拉芬来拜访我。"
  npc_override_ecl_fild01_quests_eclage_one_i_m_sponsoring_one_e8b1fe: "我资助的那个就是其中之一。"
  npc_override_ecl_fild01_quests_eclage_one_mistake_lead_immense_0e3eb5: "一个错误可能导致巨大的后果。"
  npc_override_ecl_fild01_quests_eclage_one_places_you_should_wa_7496d5: "这是你应该仔细观察的地方之一。"
  npc_override_ecl_fild01_quests_eclage_one_point_some_adventure_1035a3: "有一次，一个冒险者送给我一些^000099葡萄萃取药草茶^000000作为礼物，真的很提神。"
  npc_override_ecl_fild01_quests_eclage_one_possibility_hmm_5ecc2e: "一种可能性。嗯……"
  npc_override_ecl_fild01_quests_eclage_one_them_seems_working_v_b7fe4b: "其中一个似乎在忙而且很烦。"
  npc_override_ecl_fild01_quests_eclage_ones_i_took_last_time_72f877: "上次我拿的那些因为错误而不能使用，我因此被骂得很惨……"
  npc_override_ecl_fild01_quests_eclage_ones_related_monsters_in_28478e: "那些与塔内怪物有关的。"
  npc_override_ecl_fild01_quests_eclage_onetwothreefourfivesixse_4d81e2: "一二三四五六七八九十一二三四五六七八九十一二三四五六七"
  npc_override_ecl_fild01_quests_eclage_only_friend_worried_abou_26e609: "只有朋友才会担心那些谣言。"
  npc_override_ecl_fild01_quests_eclage_only_i_most_laphines_who_57b4d4: "不仅是我，从事这行的大多数拉芬都面临着同样的处境。"
  npc_override_ecl_fild01_quests_eclage_only_if_i_had_known_1dab20: "要是我早点知道就好了……"
  npc_override_ecl_fild01_quests_eclage_only_if_we_15e85e: "只要我们能"
  npc_override_ecl_fild01_quests_eclage_only_if_we_could_get_22b37a: "……只要我们能得到那个……猫粮……我们就不用像这样受这么多苦了……"
  npc_override_ecl_fild01_quests_eclage_only_if_your_level_highe_bc7feb: "如果你的等级更高，我就能带你去一条不错的散步路线……"
  npc_override_ecl_fild01_quests_eclage_only_people_usually_carr_e1b159: "不仅如此，人们通常会在是粉丝的时候随身携带书吗？？尤其是精装书？"
  npc_override_ecl_fild01_quests_eclage_only_problem_designated_924710: "唯一的问题是……它必须在一个指定的地点。"
  npc_override_ecl_fild01_quests_eclage_only_right_adventurer_re_581eac: "冒险者记录所有所见所闻是理所当然的，但由于这是具有政治敏感性的材料，我就不多说了。"
  npc_override_ecl_fild01_quests_eclage_only_take_few_minutes_c8f9df: "只需要几分钟。"
  npc_override_ecl_fild01_quests_eclage_only_thing_he_worried_ab_1b51dc: "唯一的事是……他很担心你过得怎么样。特别是他看不到你的家园树是否成功生长。"
  npc_override_ecl_fild01_quests_eclage_ooo_so_what_called_dark_d810dc: "哦哦，这就是所谓的黑暗碎片。我很高兴我能继续我的实验。"
  npc_override_ecl_fild01_quests_eclage_ooo_so_you_changed_your_178df7: "哦哦~所以你改变主意了？"
  npc_override_ecl_fild01_quests_eclage_oop_d0ac6e: "哎呀。"
  npc_override_ecl_fild01_quests_eclage_oops_1cda63: "哎呀。"
  npc_override_ecl_fild01_quests_eclage_opportunity_make_atoneme_4aa4d4: "这是一个赎罪的机会。"
  npc_override_ecl_fild01_quests_eclage_opposition_he_faced_78872c: "他面临的反对"
  npc_override_ecl_fild01_quests_eclage_orb_always_exposed_plaza_d55d19: "宝珠总是暴露在广场上，由于所有拉芬都盯着它，保护宝珠的守卫从安装灯具的天花板上往下看。"
  npc_override_ecl_fild01_quests_eclage_orb_danger_if_there_anyo_631384: "如果有其他人知道宝珠的事，它就处于危险之中。"
  npc_override_ecl_fild01_quests_eclage_orb_going_alright_if_you_c41792: "如果你帮助我们，宝珠会没事的。"
  npc_override_ecl_fild01_quests_eclage_orb_symbol_eclage_focus_a04388: "宝珠，艾克拉奇的象征和强大魔法力量的焦点！"
  npc_override_ecl_fild01_quests_eclage_order_take_care_urgent_m_da332d: "为了处理紧急事务……"
  npc_override_ecl_fild01_quests_eclage_other_laphines_accept_ma_455c27: "但其他拉芬会接受一个被外国人一句话左右的均市长吗？"
  npc_override_ecl_fild01_quests_eclage_other_laphines_around_me_481ab0: "我周围的其他拉芬都对我的雅伊疯狂着迷，雅伊用怪物副产品装饰着。"
  npc_override_ecl_fild01_quests_eclage_other_laphines_hate_245196: "其他拉芬讨厌它！"
  npc_override_ecl_fild01_quests_eclage_other_one_pretty_importa_915263: "另一个也很重要。我会指望你的！"
  npc_override_ecl_fild01_quests_eclage_other_parts_desk_should_d8ae91: "桌子的其他部分也应该检查。"
  npc_override_ecl_fild01_quests_eclage_other_words_easy_harm_or_e5e656: "换句话说，一旦天花板受到攻击并失效，很容易伤害宝珠。"
  npc_override_ecl_fild01_quests_eclage_other_words_person_who_650970: "换句话说……那个人"
  npc_override_ecl_fild01_quests_eclage_other_words_s_very_likel_0eedfe: "换句话说，很可能是对这个地区陌生的外来者所为。"
  npc_override_ecl_fild01_quests_eclage_others_might_think_you_r_e300fb: "其他人可能会认为你告诉我这些是为了在我和拉芬之间制造矛盾。"
