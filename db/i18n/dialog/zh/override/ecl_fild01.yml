  npc_override_ecl_fild01_quests_eclage_meat_ready_yet_i_t_943293: "肉准备好了吗？我不能再等了……（嘶嘶 嘶嘶）"
  npc_override_ecl_fild01_quests_eclage_meet_luen_again_e3a604: "再次见到卢恩。"
  npc_override_ecl_fild01_quests_eclage_meet_me_forked_road_befo_130eda: "在进入艾克拉奇广场之前的岔路口见我。"
  npc_override_ecl_fild01_quests_eclage_meeting_friend_28ab7c: "与朋友会面。"
  npc_override_ecl_fild01_quests_eclage_memories_every_king_firs_56aa14: "也就是说，从第一位均市长到最后一位均市长，每一位国王的记忆。"
  npc_override_ecl_fild01_quests_eclage_menu_a_0f1f06: "一个简单的召唤工具:嫩芽完成了！"
  npc_override_ecl_fild01_quests_eclage_menu_a_80ab4e: "一只会说话的青蛙？:我想听 worm 教授的日记。"
  npc_override_ecl_fild01_quests_eclage_menu_a_bd87e1: "塞尼斯国王父亲的故事:塞尼斯国王纵火的故事:参谋长的真名:附近地区的维度裂缝"
  npc_override_ecl_fild01_quests_eclage_menu_about_82d0ee: "关于阿凡特:关于参谋长"
  npc_override_ecl_fild01_quests_eclage_menu_according_370894: "根据卢恩的陈述……:根据巴鲁明的陈述……"
  npc_override_ecl_fild01_quests_eclage_menu_actually_cb8bd1: "其实，我已经听到你了。你能告诉我更多吗？:是关于什么的？"
  npc_override_ecl_fild01_quests_eclage_menu_alright_c114d7: "好的！我马上回来！:你自己做！"
  npc_override_ecl_fild01_quests_eclage_menu_and_49a589: "而且有一个特殊的奖励给逃出迷宫的人:有一个给予重生祝福的地方。"
  npc_override_ecl_fild01_quests_eclage_menu_are_2b930d: "多纳和帕庞是对立的吗？:关于埃特兰和罗伯特。:拉芬喜欢均市长吗？"
  npc_override_ecl_fild01_quests_eclage_menu_ask_0b7e3c: "询问如何使用裂缝:询问碎片是如何获得的:那么这个能做什么？"
  npc_override_ecl_fild01_quests_eclage_menu_ask_362a98: "先问卡杜伊。:握住他的手。"
  npc_override_ecl_fild01_quests_eclage_menu_ask_42cf28: "询问长老议会。:关于与罗伯特的战斗。:关于土地恢复项目。"
