  npc_override_ecl_fild01_quests_eclage_robert_life_restorer_who_8f25b9: "^000099罗伯特？……这就是我一直看到的那个生命恢复者的 silhouette 吗？^000000"
  npc_override_ecl_fild01_quests_eclage_robert_probably_doing_ev_eee679: "罗伯特可能正在尽他所能。一旦家园树连接到一片土地，整个区域都会被消耗。为了防止这种情况，他冒着生命危险。"
