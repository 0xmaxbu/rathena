  npc_override_ecl_fild01_quests_eclage_doing_me_while_s_asleep_0b18ff: "它在睡觉的时候对我做这种事吗？"
  npc_override_ecl_fild01_quests_eclage_dominic_always_been_like_6341e3: "多米尼克一直就是这样，小气又奇怪。"
  npc_override_ecl_fild01_quests_eclage_dominic_takes_care_books_b632b1: "多米尼克负责照看书架，我觉得他可能知道些什么。"
  npc_override_ecl_fild01_quests_eclage_don_t_apply_same_concept_04092e: "在思考我们的市长时，不要套用同样的概念。"
  npc_override_ecl_fild01_quests_eclage_don_t_blame_yourself_be6f48: "不要责怪自己。"
  npc_override_ecl_fild01_quests_eclage_don_t_bother_ask_about_c44ad4: "不要再费心问他了。"
  npc_override_ecl_fild01_quests_eclage_don_t_come_back_11b0a3: "别回来！"
  npc_override_ecl_fild01_quests_eclage_don_t_crash_burn_anythin_07882a: "不要撞毁或烧毁任何东西……"
  npc_override_ecl_fild01_quests_eclage_don_t_cry_maggi_020f36: "别哭，玛吉~"
  npc_override_ecl_fild01_quests_eclage_don_t_dump_anything_way_b0edee: "不要在路上丢弃或扔任何东西，"
  npc_override_ecl_fild01_quests_eclage_don_t_even_say_such_7f2c5d: "甚至不要说这种话！"
  npc_override_ecl_fild01_quests_eclage_don_t_ever_come_back_7f690c: "永远别回来！！！"
  npc_override_ecl_fild01_quests_eclage_don_t_forget_bring_mater_acecd7: "别忘了带实验材料。"
  npc_override_ecl_fild01_quests_eclage_don_t_forget_time_a7f7ac: "这次别忘了。"
  npc_override_ecl_fild01_quests_eclage_don_t_get_me_wrong_d904b3: "别误会我。"
  npc_override_ecl_fild01_quests_eclage_don_t_go_back_tower_c900cb: "不要回塔……"
  npc_override_ecl_fild01_quests_eclage_don_t_go_inside_make_875c99: "不要进去，但让他出来。"
  npc_override_ecl_fild01_quests_eclage_don_t_impatient_9acb35: "别不耐烦。"
  npc_override_ecl_fild01_quests_eclage_don_t_just_stand_there_1751c7: "别站在那里，请去找我的肖像！"
  npc_override_ecl_fild01_quests_eclage_don_t_lose_them_again_b79949: "别再弄丢它们了~~~"
  npc_override_ecl_fild01_quests_eclage_don_t_necklace_b9ed44: "没有项链。"
  npc_override_ecl_fild01_quests_eclage_don_t_say_anything_all_fd14ae: "什么都不要说。"
  npc_override_ecl_fild01_quests_eclage_don_t_shy_i_started_e5fd41: "别害羞。我也是刚开始工作不久。但既然我先来的，我就是你老板，好吗？！"
  npc_override_ecl_fild01_quests_eclage_don_t_sneak_up_like_3a3cca: "不要那样偷偷摸摸。你不应该在这里。"
  npc_override_ecl_fild01_quests_eclage_don_t_take_me_lightly_fd699d: "不要因为我年轻就小看我。我已经去过米德加尔特大陆的每个地方。我是个真正的冒险者，你知道的。"
  npc_override_ecl_fild01_quests_eclage_don_t_take_seriously_512078: "别当真。"
  npc_override_ecl_fild01_quests_eclage_don_t_they_know_civiliza_7e2cb3: "他们不知道文明发展不一定能提升生命的价值吗？"
  npc_override_ecl_fild01_quests_eclage_don_t_touch_whoever_you_6c6ae0: "不要像这样随便碰任何人！"
  npc_override_ecl_fild01_quests_eclage_don_t_try_anything_funny_13182b: "别耍花招。"
  npc_override_ecl_fild01_quests_eclage_don_t_work_too_hard_47909c: "......别工作太辛苦。"
  npc_override_ecl_fild01_quests_eclage_don_t_worry_about_me_73b824: "别担心我。我会成为一个伟大的冒险者！"
  npc_override_ecl_fild01_quests_eclage_don_t_worry_about_me_f7c190: "别担心我。"
  npc_override_ecl_fild01_quests_eclage_don_t_worry_about_you_519e92: "别担心，你想和我一起为艾克拉奇工作吗？"
  npc_override_ecl_fild01_quests_eclage_don_t_worry_ffc806: "别担心。"
  npc_override_ecl_fild01_quests_eclage_don_t_worry_i_ll_ce8c06: "别担心，我会得到年度最大独家新闻！"
  npc_override_ecl_fild01_quests_eclage_don_t_worry_i_m_2f5fb7: "别担心。我差不多写完一首歌了。歌词和旋律都快完成了。"
  npc_override_ecl_fild01_quests_eclage_don_t_you_always_smile_5bc5b1: "当你回忆起过去的美好回忆时，你不是总是微笑吗？"
  npc_override_ecl_fild01_quests_eclage_don_t_you_get_there_507ab9: "你还不明白吗？不存在让囚犯服刑条件变得有利的这种事。"
  npc_override_ecl_fild01_quests_eclage_don_t_you_go_02ad69: "你不是该走了吗？"
  npc_override_ecl_fild01_quests_eclage_don_t_you_look_elsewhere_b82747: "你别往别处看~ 你别和其他囚犯说话~ 看着我，只看我~~ 和我在一起时要对我好~~"
  npc_override_ecl_fild01_quests_eclage_don_t_you_think_6c7b90: "你不觉得吗？"
  npc_override_ecl_fild01_quests_eclage_don_t_you_think_mayor_5df409: "你不觉得市长……必须完美吗？"
  npc_override_ecl_fild01_quests_eclage_don_t_you_understand_14797b: "你不明白吗？"
  npc_override_ecl_fild01_quests_eclage_don_t_you_worry_067717: "你别担心！"
  npc_override_ecl_fild01_quests_eclage_dona_looks_surprisingly_1b1466: "^000099一个看起来惊人地像希尔的多纳（^990000虽然他看起来威严得多……^000099）正抓着希尔的衣领。那个多纳是谁？^000000"
  npc_override_ecl_fild01_quests_eclage_done_f7c094: "完成了……"
  npc_override_ecl_fild01_quests_eclage_done_regular_basis_so_yo_ff82e9: "这必须定期完成，所以你已经帮了大忙。"
  npc_override_ecl_fild01_quests_eclage_door_locked_shut_1cc76f: "门锁得死死的。"
  npc_override_ecl_fild01_quests_eclage_door_trust_periodicals_p_08a36b: "……信任期刊出版之门……"
  npc_override_ecl_fild01_quests_eclage_door_yai_opened_golden_h_1cfbdd: "雅伊的门打开了，一个金发拉芬走了出来。"
  npc_override_ecl_fild01_quests_eclage_drank_them_748936: "喝掉了它们！！"
  npc_override_ecl_fild01_quests_eclage_dream_05a1a0: "一个梦！"
  npc_override_ecl_fild01_quests_eclage_drinks_considered_stolen_86f885: "饮料被认为是被盗的。"
  npc_override_ecl_fild01_quests_eclage_drinks_considered_stolen_d953c7: "饮料被认为是被盗的.."
  npc_override_ecl_fild01_quests_eclage_drunk_you_may_think_he_923523: "喝醉了，你可能觉得他可能"
  npc_override_ecl_fild01_quests_eclage_du_already_ran_off_fc2c79: "杜已经跑了……"
  npc_override_ecl_fild01_quests_eclage_during_interrogation_dam_b27e1a: "审讯期间，戴姆斯说他厌倦了不断的争吵，对妻子总是让他买这买那感到筋疲力尽。"
  npc_override_ecl_fild01_quests_eclage_dustballs_bookmarks_made_a25c9b: "灰尘球和落叶书签。"
  npc_override_ecl_fild01_quests_eclage_earlier_moreng_said_he_h_b58be4: "早些时候莫伦格说他还没在城里看到他们，所以也许他还在外面？"
  npc_override_ecl_fild01_quests_eclage_earlier_today_i_met_9d9752: "而今天早些时候，我遇到了"
  npc_override_ecl_fild01_quests_eclage_earn_approval_47383f: "为了获得批准"
  npc_override_ecl_fild01_quests_eclage_earn_her_trust_49c665: "为了赢得她的信任！"
  npc_override_ecl_fild01_quests_eclage_eck_32bc8a: "呃！"
  npc_override_ecl_fild01_quests_eclage_eclage_capital_laphine_2a3719: "艾克拉奇是拉芬的首都。"
  npc_override_ecl_fild01_quests_eclage_eclage_crowded_travelers_89c25f: "艾克拉奇挤满了旅行者，直到最近，他们大多数来自阿尔夫海姆。"
  npc_override_ecl_fild01_quests_eclage_eclage_guard_looking_you_d10dde: "一个艾克拉奇守卫刚才在找你，对吧？"
  npc_override_ecl_fild01_quests_eclage_eclage_monthly_c113b9: "^990000---艾克拉奇月刊---^000000"
  npc_override_ecl_fild01_quests_eclage_eclage_really_nice_place_a3cc19: "艾克拉奇是个非常适合居住的地方"
  npc_override_ecl_fild01_quests_eclage_eeck_e0b6aa: "呃呃呃!!!!"
  npc_override_ecl_fild01_quests_eclage_eeek_dc1cbc: "呃呃呃！"
  npc_override_ecl_fild01_quests_eclage_eeek_i_don_t_like_5c7f76: "呃呃~ 我不喜欢这个。"
  npc_override_ecl_fild01_quests_eclage_eek_30562a: "呃呃！"
  npc_override_ecl_fild01_quests_eclage_eek_i_going_get_out_2a362d: "呃！我正要趁你不在的时候自己出去。但然后我发现了有趣的东西……所以我想我徘徊了一会儿……"
  npc_override_ecl_fild01_quests_eclage_effect_imbued_successful_b3001b: "效果已成功注入。"
  npc_override_ecl_fild01_quests_eclage_eh_6529f5: "嗯……"
  npc_override_ecl_fild01_quests_eclage_eh_brother_what_you_mean_87f765: "嗯？兄弟，你是什么意思？"
  npc_override_ecl_fild01_quests_eclage_eh_good_see_you_again_9bd087: "嗯，很高兴再见到你。"
  npc_override_ecl_fild01_quests_eclage_eh_really_305601: "嗯？真的吗？"
  npc_override_ecl_fild01_quests_eclage_einbroch_filled_machines_8d84a7: "因布罗克到处都是机器。他们似乎不制造很多工业产品，但机器绝对是他们的武器。"
  npc_override_ecl_fild01_quests_eclage_eirinn_bourbon_i_one_thi_e8aab6: "艾琳、波旁和我有一个共同点。"
  npc_override_ecl_fild01_quests_eclage_ek_f164c6: "呃！"
  npc_override_ecl_fild01_quests_eclage_ekk_4d8325: "呃呃？！"
  npc_override_ecl_fild01_quests_eclage_elder_assembly_continued_d4aed8: "长老议会继续因持续的失败而指责拉芬领袖。"
  npc_override_ecl_fild01_quests_eclage_elders_trying_ignore_pra_b3af4e: "长老们试图忽视这个地区务实的年轻领袖，他们想在这附近建立一个首都。他们只是想在这个关于首都的问题中心为自己 carve out 一个位置。"
  npc_override_ecl_fild01_quests_eclage_end_feather_here_very_co_e6eefd: "这根羽毛的这头不太有说服力……"
  npc_override_ecl_fild01_quests_eclage_end_i_m_messenger_mailma_c22bef: "最后，我不是信使，而是邮递员。"
  npc_override_ecl_fild01_quests_eclage_end_recording_250ea7: "这是录音的结尾。"
  npc_override_ecl_fild01_quests_eclage_end_shenime_didn_t_know_08a0c4: "但最终，希尼姆对他资助的学者一无所知，他对学者的个人研究也毫不知情？"
  npc_override_ecl_fild01_quests_eclage_energy_golden_leaf_my_bo_308b80: "^000099借助金叶的能量，我的身心感觉像是恢复了活力。获得了经验值和职业经验值。^000000"
  npc_override_ecl_fild01_quests_eclage_engineer_scientist_hiel_847808: "工程师科学家希尔和罗伯特先生外貌非常相似，但他的举止却极为不同。所以请避免说他们俩长得像。听着让我心痛。"
  npc_override_ecl_fild01_quests_eclage_enjoy_your_trip_f4f862: "祝你旅途愉快。"
  npc_override_ecl_fild01_quests_eclage_enough_now_you_should_go_aebb91: "这就够了。现在，你应该去看他。"
  npc_override_ecl_fild01_quests_eclage_enraged_7f706c: "（愤怒）"
  npc_override_ecl_fild01_quests_eclage_enrages_me_how_irritatin_c6b29a: "这让我愤怒！真烦人！"
  npc_override_ecl_fild01_quests_eclage_enter_3acd44: "进入它 -"
  npc_override_ecl_fild01_quests_eclage_entire_village_covered_s_dcb5a6: "整个村庄被雪覆盖，正如一个正在准备庆祝的地方所预期的那样，气氛很棒。"
  npc_override_ecl_fild01_quests_eclage_entrance_you_people_both_045d70: "通过你们的入口，萨菲亚和拉芬都分心了。"
  npc_override_ecl_fild01_quests_eclage_erhem_erm_keerhm_cough_c_1ddb05: "嗯哼 嗯…… 咳咳咳！"
  npc_override_ecl_fild01_quests_eclage_erhem_prrhaaha_6bef1d: "嗯哼.... 噗哈哈！"
  npc_override_ecl_fild01_quests_eclage_err_no_b7c018: "呃.... 不....."
  npc_override_ecl_fild01_quests_eclage_especially_given_our_sit_f24fb0: "鉴于我们的情况尤其如此……"
  npc_override_ecl_fild01_quests_eclage_especially_if_kar_so_oth_c6a132: "特别是，如果卡尔这样做，其他拉芬可能会误解他。"
  npc_override_ecl_fild01_quests_eclage_especially_since_there_w_aecb20: "特别是因为没有必要把它们做得那么直。"
  npc_override_ecl_fild01_quests_eclage_especially_supply_water_4774cb: "尤其是，水资源的供应对人类很重要，因为人类很脆弱，没有水甚至30天都活不下去。"
  npc_override_ecl_fild01_quests_eclage_especially_when_mayor_ju_9a766d: "特别是当均市长就是我的时候。啊……"
  npc_override_ecl_fild01_quests_eclage_especially_when_s_someth_f0ff23: "特别是当它像家庭事务一样的时候。"
  npc_override_ecl_fild01_quests_eclage_etran_going_back_soon_th_d68ea3: "埃特兰很快就要回来了。到那时，应该准备好了。"
  npc_override_ecl_fild01_quests_eclage_etran_i_looking_restroom_8efd22: "埃特兰，我在这里找洗手间。"
  npc_override_ecl_fild01_quests_eclage_etran_robert_placed_flig_9e1e0a: "^000099埃特兰和罗伯特被放置在飞行机器中。^000000"
  npc_override_ecl_fild01_quests_eclage_etran_robert_put_work_as_535c74: "^000099埃特兰和罗伯特被派去做猫商人。^000000"
  npc_override_ecl_fild01_quests_eclage_etran_s_figure_begins_fa_9e29f7: "^000099埃特兰的身影开始淡出。反应堆的力量一定减弱了。^000000"
  npc_override_ecl_fild01_quests_eclage_etran_s_keepsake_receive_c7988c: "^000099收到了埃特兰的遗物。可以装备它，但^ff0000要发挥其全部力量，^000099我稍后需要希尔的帮助。^000000"
  npc_override_ecl_fild01_quests_eclage_etran_s_sad_legend_267d3e: "^000099埃特兰的悲惨传说^000000"
  npc_override_ecl_fild01_quests_eclage_etran_s_shoulders_seem_t_189833: "^000099埃特兰的肩膀似乎在颤抖。^000000"
  npc_override_ecl_fild01_quests_eclage_etran_started_sob_seemed_539459: "^000099埃特兰开始啜泣，似乎摆脱了生命的负担。他似乎想起了什么，问了一个问题。^000000"
  npc_override_ecl_fild01_quests_eclage_etran_suprisingly_looks_5c7175: "^000099埃特兰惊人地看起来像聪明。难道聪明和希尔是埃特兰和罗伯特的转世？不，那不可能……^000000"
  npc_override_ecl_fild01_quests_eclage_etran_wanted_me_thank_yo_fd8982: "埃特兰要我代他感谢你。"
  npc_override_ecl_fild01_quests_eclage_even_even_if_true_86f5c1: "即使……即使那是真的，"
  npc_override_ecl_fild01_quests_eclage_even_green_herbs_difficu_758504: "'即使是绿色草药，在你需要的时候也找不到。'"
  npc_override_ecl_fild01_quests_eclage_even_his_own_experiments_7917b4: "但即使是他自己的实验，我哥哥也需要某人的翅膀和某人的头发……他真的……"
  npc_override_ecl_fild01_quests_eclage_even_if_he_did_so_c534e7: "即使他这样做了，"
  npc_override_ecl_fild01_quests_eclage_even_if_he_isn_t_20dce0: "即使他不是，我也非常想打断他。"
  npc_override_ecl_fild01_quests_eclage_even_if_i_f3743b: "即使我是"
  npc_override_ecl_fild01_quests_eclage_even_if_there_great_acco_582d2a: "即使有伟大的成就，也有那些无法被记录进历史的时候。"
  npc_override_ecl_fild01_quests_eclage_even_if_you_don_t_05bcfe: "即使你不想透露，历史就是历史。有像我这样的历史学家之间传承的非官方历史。"
  npc_override_ecl_fild01_quests_eclage_even_if_you_don_t_28af44: "即使你不愿意，我也希望你被认定为对艾克拉奇有益的无害之人。"
  npc_override_ecl_fild01_quests_eclage_even_if_you_sell_47b2b8: "即使你卖掉它.."
  npc_override_ecl_fild01_quests_eclage_even_if_you_sustain_othe_bafcea: "即使你维持其他生命形式，没有家园树也不会长久。我们必须容忍眼前的损失。你不知道吗，埃特兰？！"
  npc_override_ecl_fild01_quests_eclage_even_if_you_you_been_338bbb: "即使你有，你也会被强光蒙蔽。"
  npc_override_ecl_fild01_quests_eclage_even_non_engineer_like_m_359dd5: "即使像我这样的非工程师也明白，如果裂隙碎片对压力起反应，它会释放出超乎理解的力量。"
  npc_override_ecl_fild01_quests_eclage_even_research_group_coul_ce31eb: "但即使研究小组也想不出更好的办法。"
  npc_override_ecl_fild01_quests_eclage_even_so_if_i_really_5c64d8: "即便如此，如果我真的想让它可信，我为什么要把你打晕然后就把你留在那里？"
  npc_override_ecl_fild01_quests_eclage_even_so_s_bit_sad_565a9b: "但即便如此，他没留着项链还是有点难过……"
  npc_override_ecl_fild01_quests_eclage_even_though_he_hunted_723714: "尽管他猎杀了"
  npc_override_ecl_fild01_quests_eclage_even_though_i_m_half_50f0e7: "即使我是受歧视的混血，我也会履行我的职责"
  npc_override_ecl_fild01_quests_eclage_even_though_i_m_mayor_18d791: "即使我是市长，我有时也想表现得符合我的年龄。"
  npc_override_ecl_fild01_quests_eclage_even_though_my_husband_a_de6fdb: "即使我丈夫对我冷漠，他也不是坏人。"
