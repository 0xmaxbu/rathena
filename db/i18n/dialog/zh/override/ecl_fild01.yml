  npc_override_ecl_fild01_quests_eclage_if_nothing_took_away_you_f887f3: "如果没有什么东西把它拿走，你应该不难找到它。"
  npc_override_ecl_fild01_quests_eclage_if_one_could_extract_mag_1dd06c: "如果有人能像阿凡特的研究那样从宝珠中提取魔力，"
  npc_override_ecl_fild01_quests_eclage_if_only_if_he_had_038aac: "如果他只有可靠和心胸宽广的朋友……"
  npc_override_ecl_fild01_quests_eclage_if_other_laphines_see_me_f8aaf1: "如果其他拉芬看到我这个样子，他们可能会害怕。"
  npc_override_ecl_fild01_quests_eclage_if_s_big_you_could_884920: "如果它那么大，你可能可以用这个广场大小的煎蛋！"
  npc_override_ecl_fild01_quests_eclage_if_s_case_i_guess_f55eca: "如果是那样的话，我想我们两个之间就没有友谊了。"
  npc_override_ecl_fild01_quests_eclage_if_s_case_you_very_61b87a: "如果是那样的话，你从现在开始会很忙的。"
  npc_override_ecl_fild01_quests_eclage_if_s_okay_you_me_cc0c15: "如果可以的话，你能帮我个忙吗？"
  npc_override_ecl_fild01_quests_eclage_if_s_something_he_didn_f2dabc: "如果是他不想告诉任何人的事情，他本可以直接告诉我的。"
  npc_override_ecl_fild01_quests_eclage_if_s_something_useless_s_10b82f: "如果是没用的东西，搞乱他的研究材料更好。"
  npc_override_ecl_fild01_quests_eclage_if_s_something_useless_y_949cdd: "如果是没用的东西，你会后悔的。"
  npc_override_ecl_fild01_quests_eclage_if_s_south_here_41806c: "如果它在这儿的南边……"
  npc_override_ecl_fild01_quests_eclage_if_she_awakes_my_fault_fbeb7e: "如果她醒了，那就是我的错。"
  npc_override_ecl_fild01_quests_eclage_if_somebody_steals_magic_1d7869: "如果有人怀着不良动机从宝珠中窃取魔力并开始使用它……"
  npc_override_ecl_fild01_quests_eclage_if_something_ever_happen_00e81f: "如果发生了什么事，我因此死了，"
  npc_override_ecl_fild01_quests_eclage_if_there_beautiful_yai_m_c7947f: "如果有一只漂亮的雅伊属于我自己，那才是真正的天堂！"
  npc_override_ecl_fild01_quests_eclage_if_there_oppositions_amo_4cff5a: "如果多纳势力中存在^000099反对派^000000，或^000099屠杀多纳势力^000000，这些行为不能作为官方历史记录。"
  npc_override_ecl_fild01_quests_eclage_if_there_really_as_much_008308: "如果真的存在那么多敌意以至于被排除在历史之外，艾克拉奇和彩虹桥就不可能是现在这个样子。"
  npc_override_ecl_fild01_quests_eclage_if_they_didn_t_scatter_54b8b5: "如果它们没有散得太开，我相信它们还在附近的某个地方。"
  npc_override_ecl_fild01_quests_eclage_if_they_find_out_some_b6b1a7: "如果他们发现有些物品不见了，那么……"
  npc_override_ecl_fild01_quests_eclage_if_they_really_carnivore_15e6b6: "如果它们真的是食肉动物，它们靠什么食物生存？而且，没有记录显示它们在攻击后会吃掉路过的冒险者。"
  npc_override_ecl_fild01_quests_eclage_if_they_scratched_fittin_a62979: "如果它们被适当地抓伤，会看起来更野性。"
  npc_override_ecl_fild01_quests_eclage_if_things_never_happened_fed4b8: "如果以前从未发生过的事情发生了，那就有新情况了。"
  npc_override_ecl_fild01_quests_eclage_if_unfolded_carefully_ma_34d245: "^000099如果小心地展开，它可能会显示出页面。^000000"
  npc_override_ecl_fild01_quests_eclage_if_wasn_t_him_i_b86ecd: "如果不是因为他，我可能就会像塞尼斯一样了，谁知道呢？"
  npc_override_ecl_fild01_quests_eclage_if_wasn_t_i_wouldn_03e1c6: "如果不是因为那件事，我不会这么担心……"
  npc_override_ecl_fild01_quests_eclage_if_we_find_something_let_55601c: "如果我们发现了什么，就到这里会合。"
  npc_override_ecl_fild01_quests_eclage_if_we_let_him_i_c48f25: "如果我们放任他，我不知道他接下来会惹什么麻烦。"
  npc_override_ecl_fild01_quests_eclage_if_we_t_get_any_8ad786: "如果我们得不到关于学者的任何信息，我们可以追踪希尼梅。"
  npc_override_ecl_fild01_quests_eclage_if_worked_out_could_been_668cdc: "如果成功了，这可能是赢得母亲信任的机会……"
  npc_override_ecl_fild01_quests_eclage_if_you_aren_t_too_669184: "如果你不太忙，你能给我带一团灰尘来做蜡烛吗？"
  npc_override_ecl_fild01_quests_eclage_if_you_ask_children_draw_faa1e8: "如果你让孩子们画一个世界，他们不就会画成这样吗？"
  npc_override_ecl_fild01_quests_eclage_if_you_ask_third_person_1524a8: "如果你在没有上下文的情况下用第三人称代词问我，我不明白……"
  npc_override_ecl_fild01_quests_eclage_if_you_bring_me_cup_d4ee1f: "如果你给我带来^0000991杯葡萄萃取药草茶^000000，我会告诉你艾克拉奇的各种八卦故事作为回报。怎么样？"
  npc_override_ecl_fild01_quests_eclage_if_you_bring_me_fully_fc2ee4: "如果你给我带来一片完全长大的家园树叶，我绝不会放弃。你无法伪造罗伯特的成功，你知道的。"
  npc_override_ecl_fild01_quests_eclage_if_you_buy_now_we_1936cc: "如果你现在买，我们还会送你3罐猫粮喵！！多买些喵！！！"
  npc_override_ecl_fild01_quests_eclage_if_you_chance_you_ll_68933b: "如果你有机会，你也能听到其他拉芬的故事。"
  npc_override_ecl_fild01_quests_eclage_if_you_climbed_all_way_097920: "如果你出于好奇一路爬到这儿，你最好现在开始往下走。"
  npc_override_ecl_fild01_quests_eclage_if_you_come_back_late_c504c4: "如果你回来得太晚，你只能听到我的呻吟和抱怨。"
  npc_override_ecl_fild01_quests_eclage_if_you_completed_your_fo_3e8c1a: "如果你填完了表格，请把它们交给那边的管理员。"
  npc_override_ecl_fild01_quests_eclage_if_you_could_help_us_ed4938: "如果你能帮我们，其他拉芬不会对你有更好的看法吗？"
  npc_override_ecl_fild01_quests_eclage_if_you_dark_crystal_you_f01b01: "如果你有黑暗水晶，你可以发挥更大的力量，但我无法获得那种组合方法。"
  npc_override_ecl_fild01_quests_eclage_if_you_don_t_like_19575b: "如果你不喜欢什么，或者不想参与，就忘了我告诉你的一切。但如果我的故事引起了你的兴趣，或者你有一丝帮助我的欲望……"
  npc_override_ecl_fild01_quests_eclage_if_you_don_t_mind_630e0f: "如果你不介意，我们再去巡逻一次吧。"
  npc_override_ecl_fild01_quests_eclage_if_you_don_t_want_d5c305: "如果你不愿意，就别想再来了。"
  npc_override_ecl_fild01_quests_eclage_if_you_ever_get_sick_77d1e0: "如果你生病了，我会保证你从现在起的生活。"
  npc_override_ecl_fild01_quests_eclage_if_you_felt_sick_then_d3241c: "如果你感到恶心，那就是个大问题了。"
  npc_override_ecl_fild01_quests_eclage_if_you_find_out_somethin_a3100c: "如果你发现了什么，回到卡尔所在的地方。"
  npc_override_ecl_fild01_quests_eclage_if_you_follow_road_head_6ceaed: "如果你沿着这条路向东走……"
  npc_override_ecl_fild01_quests_eclage_if_you_get_autograph_me_86099b: "如果你现在得到我的签名，你以后可能能养活你家三代人。怎么样，想要一个吗？"
  npc_override_ecl_fild01_quests_eclage_if_you_hadn_t_filled_8cf6d9: "如果你一开始没有填错我的名字，我们就不会这样等着了！"
  npc_override_ecl_fild01_quests_eclage_if_you_like_find_out_a2eb97: "如果你想了解更多关于反应中听到的对话，去监狱找克莱弗谈谈。他在那个领域比我强多了。"
  npc_override_ecl_fild01_quests_eclage_if_you_like_go_down_b4bd90: "如果你想下去，请按铃~"
  npc_override_ecl_fild01_quests_eclage_if_you_look_books_scatte_8775a7: "如果你看塔里散落的书，里面有书签。我觉得即使里面有别人的记忆，这也是送给朋友的好礼物。"
  npc_override_ecl_fild01_quests_eclage_if_you_make_out_here_62ead1: "如果你能从这里出去，请让我兄弟知道，帮我想办法恢复原样。"
  npc_override_ecl_fild01_quests_eclage_if_you_me_favor_i_cf17ca: "如果你帮我一个忙，我就让你听。"
  npc_override_ecl_fild01_quests_eclage_if_you_mention_his_name_59fd81: "如果你提到他的名字，你可能会和我一样处境。"
  npc_override_ecl_fild01_quests_eclage_if_you_met_wuhari_as_3f5f78: "如果你见过乌哈里，如你所见，我原本不是这个样子。我兄弟和我有^0000cd特别小的体型^000000，即使在低级拉芬中也是如此。"
  npc_override_ecl_fild01_quests_eclage_if_you_my_place_you_f164f4: "如果你在我的位置，你不会只是扔几只青蛙，而是会把整个家都扔出去！"
  npc_override_ecl_fild01_quests_eclage_if_you_need_more_just_ff50cc: "如果你需要更多，告诉我~"
  npc_override_ecl_fild01_quests_eclage_if_you_operate_rift_frag_3a38f8: "如果你能正确操作裂缝碎片，去见^000099过去的历史人物^000000应该不会很难。"
  npc_override_ecl_fild01_quests_eclage_if_you_order_now_we_1529de: "如果你现在下单，我们还送你一把即使使用一百次也感觉像新的一次性叉子！"
  npc_override_ecl_fild01_quests_eclage_if_you_person_who_enough_cf8d67: "如果你是一个有足够勇气和智慧独自去异国他乡的人，我相信你也有很多经验。"
  npc_override_ecl_fild01_quests_eclage_if_you_place_one_time_5d7e99: "如果你一次性投资zeny，终极礼物就会~降临~！"
  npc_override_ecl_fild01_quests_eclage_if_you_re_asking_me_4f4c4c: "如果你问我的感觉，魔力正从我的身体里渗出来，感觉不太好。"
  npc_override_ecl_fild01_quests_eclage_if_you_re_curious_go_758fa8: "如果你好奇，去挑战自己，解开塔之谜吧。"
  npc_override_ecl_fild01_quests_eclage_if_you_re_going_hold_ef81a9: "如果你不打算对它可能带来的反噬负责，"
  npc_override_ecl_fild01_quests_eclage_if_you_re_looking_shenim_895b77: "如果你在找希尼梅，太遗憾了。我是新任命接替他的职位的，因为他突然消失了。"
  npc_override_ecl_fild01_quests_eclage_if_you_re_lost_way_ac8855: "如果你在路上迷路了，问东门的守卫。"
  npc_override_ecl_fild01_quests_eclage_if_you_real_man_don_bc157e: "如果你是个真正的男人，别这么软弱！"
  npc_override_ecl_fild01_quests_eclage_if_you_remember_any_othe_6cad4b: "如果你记得其他故事，再告诉我。"
  npc_override_ecl_fild01_quests_eclage_if_you_remember_ask_ceci_c335b7: "如果你记得，问问塞西莉亚为什么问这样的问题。"
  npc_override_ecl_fild01_quests_eclage_if_you_return_me_after_cd0f3b: "如果你消灭了15个^FF0000蓝 Lichteln^000000后回到我身边"
  npc_override_ecl_fild01_quests_eclage_if_you_ride_boats_albert_e135b5: "如果你乘坐阿尔贝塔的船，你可以到达各个目的地。"
  npc_override_ecl_fild01_quests_eclage_if_you_some_time_later_e31bb9: "但如果你以后有时间，请来看看我们。"
  npc_override_ecl_fild01_quests_eclage_if_you_strong_ability_co_6c01b2: "如果你有很强的控场能力，我可以让你相信不仅我的名字，我的脸^000099也都是我原本的^000000，即使它们真的不是。"
  npc_override_ecl_fild01_quests_eclage_if_you_take_train_einbro_cf433d: "如果你在艾因布罗克坐火车，你可以到一个叫艾因贝克的村庄。"
  npc_override_ecl_fild01_quests_eclage_if_you_talk_golie_who_c5c78a: "如果你和塔外城市附近工作的[Golie]谈话，他会给你新的桥梁部件。"
  npc_override_ecl_fild01_quests_eclage_if_you_talking_about_him_7d1280: "如果你说的是他，他在和乌胡鲁待了一会儿就悄悄离开了。"
  npc_override_ecl_fild01_quests_eclage_if_you_tell_them_you_25998f: "如果你告诉他们你是来祝贺均市长新生的，你一定能见到伟大的卡杜伊。"
  npc_override_ecl_fild01_quests_eclage_if_you_think_so_2e845f: "……如果你这么想，"
  npc_override_ecl_fild01_quests_eclage_if_you_thinking_about_se_327443: "如果你想卖掉它，你应该放弃。"
  npc_override_ecl_fild01_quests_eclage_if_you_thought_siroma_yo_4d03ba: "如果你想到的是Siroma，你错了。也不是海洋的。"
  npc_override_ecl_fild01_quests_eclage_if_you_try_bit_harder_9f1aca: "如果你再努力一点，你也许能"
  npc_override_ecl_fild01_quests_eclage_if_you_walk_around_talki_e45b5f: "如果你不加小心地到处说那些事，你会变得像我一样。是的，当然，我不是因为那个才在这儿的。就像我之前说的，我被指控匿名破坏财产……"
  npc_override_ecl_fild01_quests_eclage_if_you_want_cat_merchant_1d792b: "如果你想要猫商人服务，你应该找代理人，而不是我。"
  npc_override_ecl_fild01_quests_eclage_if_you_want_figure_out_941e5f: "如果你想了解更多关于那段对话的内容，最好去问他。同时，我会分析这个安排。"
  npc_override_ecl_fild01_quests_eclage_if_you_want_hear_what_193945: "如果你想听你想听的，帮我找回我的记忆！"
  npc_override_ecl_fild01_quests_eclage_if_you_want_please_retur_7fbadc: "如果你愿意，请明天这个时候回来。"
  npc_override_ecl_fild01_quests_eclage_if_you_want_see_interest_d47bdc: "如果你想看有趣的景象，比如一块石头吞掉你掉下的硬币，那是个值得参观的好地方。"
  npc_override_ecl_fild01_quests_eclage_if_you_went_as_far_57122c: "如果你去过莫拉，你也应该来艾克拉奇看看。"
  npc_override_ecl_fild01_quests_eclage_if_you_wondering_about_s_e0e063: "如果你有什么疑问，可以去找我的朋友^000099希尔^000000。他和我一样疯狂，但他是好人，嘿嘿嘿。"
  npc_override_ecl_fild01_quests_eclage_if_your_perspective_some_ab9219: "如果你对某事的看法改变了，你评价那个事物的方式也会改变。"
  npc_override_ecl_fild01_quests_eclage_impolite_kids_you_robbin_1aa391: "没礼貌的孩子。你是在抢劫空房子吗？"
  npc_override_ecl_fild01_quests_eclage_incident_254e5a: "关于那次事件……"
  npc_override_ecl_fild01_quests_eclage_incident_a015bc: "这次事件。"
  npc_override_ecl_fild01_quests_eclage_incident_lighting_room_p_1bb05b: "照明室的事件被证明是自卫行为。"
  npc_override_ecl_fild01_quests_eclage_incident_splendide_alone_9a33dc: "光是辉煌之地的事件就让我头疼……但情况变得更糟了。"
  npc_override_ecl_fild01_quests_eclage_indeed_people_who_get_mo_e0d675: "确实……先到莫拉的人先用魔法帮助其他人旅行？"
  npc_override_ecl_fild01_quests_eclage_ingredients_written_here_4437ca: "原料写在这里，但它们很难收集，而且使用方法有点难理解……"
  npc_override_ecl_fild01_quests_eclage_initialization_68fa16: "初始化"
  npc_override_ecl_fild01_quests_eclage_inside_house_my_mom_a8efb8: "但在屋子里，我妈妈"
  npc_override_ecl_fild01_quests_eclage_inside_village_there_als_16e760: "村子里面也有一个生产儿童玩具的地方，但不知为什么，他们把我赶出来了。"
  npc_override_ecl_fild01_quests_eclage_instantly_hiel_s_smile_r_b882c9: "^000099刹那间，希尔的微笑让我想起了罗伯特。我一定是一时入神了。^000000"
  npc_override_ecl_fild01_quests_eclage_instead_shouldn_t_we_thi_f7726b: "相反，我们难道不应该想想今后如何对付希尼梅吗？"
  npc_override_ecl_fild01_quests_eclage_instinctively_commited_c_216f5b: "本能地犯了罪！！"
  npc_override_ecl_fild01_quests_eclage_interesting_7c5f3c: "有趣。"
  npc_override_ecl_fild01_quests_eclage_investigation_carefully_b4207a: "仔细调查，对吧？"
  npc_override_ecl_fild01_quests_eclage_investigation_going_202f6f: "调查进展"
  npc_override_ecl_fild01_quests_eclage_investigation_going_5d4712: "调查进展如何？"
  npc_override_ecl_fild01_quests_eclage_iron_chef_robert_44f753: "^000099铁人厨师罗伯特^000000"
  npc_override_ecl_fild01_quests_eclage_irritating_different_lev_883eb7: "^000099这……比克莱弗还要烦人。我必须想办法让他不停地说话停下来……^000000"
  npc_override_ecl_fild01_quests_eclage_isn_t_brooch_really_real_315897: "那个胸针不是很可爱吗？"
  npc_override_ecl_fild01_quests_eclage_isn_t_depressing_b54c10: "……不是很令人沮丧吗。"
  npc_override_ecl_fild01_quests_eclage_isn_t_difficult_you_trav_381d0c: "但你在艾克拉奇到处走不是很难吗？"
  npc_override_ecl_fild01_quests_eclage_isn_t_easy_8a34b8: "那不简单吗？"
  npc_override_ecl_fild01_quests_eclage_isn_t_fair_a3fc92: "这不公平！！"
  npc_override_ecl_fild01_quests_eclage_isn_t_good_option_you_643b7b: "对你来说不是个好选择吗？"
  npc_override_ecl_fild01_quests_eclage_isn_t_history_document_s_d7a34c: "^000099这不是历史文献。只是一本三流杂志。让我们看看目录。^000000"
  npc_override_ecl_fild01_quests_eclage_isn_t_how_all_childhood_1c9c31: "童年的梦想不都是这样的吗？"
  npc_override_ecl_fild01_quests_eclage_isn_t_my_brother_so_cbd01e: "我兄弟不酷吗？"
  npc_override_ecl_fild01_quests_eclage_isn_t_okay_as_long_2c9f28: "但只要他不像塞尼斯那样暴虐就没问题吧？"
  npc_override_ecl_fild01_quests_eclage_isn_t_pretty_interesting_b55ab4: "不是很有趣吗？"
  npc_override_ecl_fild01_quests_eclage_isn_t_what_you_already_1bc813: "那不就是你手里已经有的东西吗？"
  npc_override_ecl_fild01_quests_eclage_it_is_e1bf82: "它是……？！"
