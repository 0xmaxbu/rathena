  npc_override_ecl_fild01_quests_eclage_mean_something_db3b77: "这意味着什么吗？"
  npc_override_ecl_fild01_quests_eclage_mean_t_any_other_locatio_8b559d: "那意味着它不能在任何其他位置吗？"
  npc_override_ecl_fild01_quests_eclage_mean_you_meet_up_my_3dae44: "那意味着你会和我兄弟见面吗？"
