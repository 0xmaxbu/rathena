  npc_override_ecl_fild01_quests_eclage_menu_breaking_62f54c: "突发新闻:关于秘密地点的想法。"
  npc_override_ecl_fild01_quests_eclage_menu_bring_3d524f: "带猫粮来。:带拉芬硬币来。:带家园树叶来。"
  npc_override_ecl_fild01_quests_eclage_menu_but_036759: "但是……:我一定弄错了什么。"
  npc_override_ecl_fild01_quests_eclage_menu_but_566e41: "但是，酒精味……:我一定弄错了什么。"
  npc_override_ecl_fild01_quests_eclage_menu_close_189af4: "合上书:绝望的 settlement-------7p:长老议会的残暴-------48p:永别--------132p:（褪色的区域）"
  npc_override_ecl_fild01_quests_eclage_menu_continue_3dec1e: "继续我的路。:进入这个地方。"
  npc_override_ecl_fild01_quests_eclage_menu_delivery_c075b2: "送货……:希尼梅让我……"
  npc_override_ecl_fild01_quests_eclage_menu_did_b844f0: "你知道他在研究什么吗？:你想让他研究什么？"
  npc_override_ecl_fild01_quests_eclage_menu_do_09eed4: "我必须做贡献吗？:是关于伊格德拉西的！"
  npc_override_ecl_fild01_quests_eclage_menu_do_1fa1bd: "你怀疑任何人吗？:还有其他东西 missing 吗？"
  npc_override_ecl_fild01_quests_eclage_menu_does_f84e3e: "他想要什么吗？:是个奇怪的仙子！"
  npc_override_ecl_fild01_quests_eclage_menu_doesn_50d91d: "我真的不这么认为。:确实很平静。"
  npc_override_ecl_fild01_quests_eclage_menu_don_499ec1: "别读它！:读它。"
  npc_override_ecl_fild01_quests_eclage_menu_don_751575: "不要离开住所。:离开住所。"
  npc_override_ecl_fild01_quests_eclage_menu_don_b4379b: "不要进入住所。:进入住所。"
  npc_override_ecl_fild01_quests_eclage_menu_don_bd295d: "别问我那个！:再想想！"
  npc_override_ecl_fild01_quests_eclage_menu_don_be6ebb: "别做。:做吧。"
  npc_override_ecl_fild01_quests_eclage_menu_eclage_966cd2: "艾克拉奇？:轻松返回营地的方式:拍拍……"
  npc_override_ecl_fild01_quests_eclage_menu_eh_f1d526: "呃……:说重点！"
  npc_override_ecl_fild01_quests_eclage_menu_examine_4ee90d: "检查它。:算了吧。"
  npc_override_ecl_fild01_quests_eclage_menu_examine_a10eab: "检查桌子。:忽略它。"
  npc_override_ecl_fild01_quests_eclage_menu_examine_b9a9b1: "检查它们。:算了吧。"
  npc_override_ecl_fild01_quests_eclage_menu_experiments_29fc87: "实验？假设？:制作的物品？"
  npc_override_ecl_fild01_quests_eclage_menu_fill_970dcb: "填写表格。:算了吧。"
  npc_override_ecl_fild01_quests_eclage_menu_first_59faee: "第一:第二:第三:第四:第五"
  npc_override_ecl_fild01_quests_eclage_menu_forget_29f0a1: "如果你不要就算了。:是的当然~"
  npc_override_ecl_fild01_quests_eclage_menu_forget_407806: "算了吧。:下去。"
  npc_override_ecl_fild01_quests_eclage_menu_forget_759202: "忘了这次谈话。:塞尼斯国王父亲的故事:塞尼斯国王纵火的故事:参谋长的真名:附近地区的维度裂缝"
  npc_override_ecl_fild01_quests_eclage_menu_give_043012: "给予帮助。:不给予帮助。"
  npc_override_ecl_fild01_quests_eclage_menu_give_601949: "给她药草:去别的地方。"
  npc_override_ecl_fild01_quests_eclage_menu_go_3ab3f0: "马上进去。:等着四处看看。"
  npc_override_ecl_fild01_quests_eclage_menu_has_0ad08c: "他以前可疑吗？:事件发生后你怀疑他吗？"
  npc_override_ecl_fild01_quests_eclage_menu_hisie_7dcff2: "希西:这就够了！阿凡特！！"
  npc_override_ecl_fild01_quests_eclage_menu_hisie_dfec19: "希西:小心！！！"
  npc_override_ecl_fild01_quests_eclage_menu_hmm_2a7195: "嗯，我想去，但我也很忙……:当然，我去看看。"
  npc_override_ecl_fild01_quests_eclage_menu_hmm_2a9642: "嗯，但是……:我一定搞错了什么。"
  npc_override_ecl_fild01_quests_eclage_menu_hmm_9820b3: "嗯，我不这么认为，但……:我一定搞错了什么。"
  npc_override_ecl_fild01_quests_eclage_menu_hmm_f3fc02: "嗯……我不这么认为，但……:我一定搞错了什么。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_1f973e: "[霍尔格伦]:你闭着眼睛精炼过吗？如果你从未做过，就别开始。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_1fb922: "[霍尔格伦]:哈哈哈，也许我今天不太舒服。哦！今天是星期天，对吧？我忘了星期天不适合精炼武器。也许，盔甲可以。对了，它肯定会浮起来。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_20743f: "[霍尔格伦]:嗨，很高兴认识你。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_2b075e: "[霍尔格伦]:嘿，你过得不错。这是+9的暗淡黑色皮靴。我会让你更富有。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_4ae9c9: "[霍尔格伦]:现在我想起来了，今天是双数日。双数日不适合盔甲精炼。对了，鞋子会浮得很好。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_547418: "[霍尔格伦]:我不开玩笑。哦很好，你拿着一把'+9冰镐'。把它给我。我会把它升到10。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_570bf1: "[霍尔格伦]:这是一件相当不错的盔甲。这是+7的高风险女武神盔甲吗？"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_9954eb: "[霍尔格伦]:你在水里精炼过吗？如果你从未做过，就别开始。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_b044b3: "[霍尔格伦]:这是+9的流浪女武神披风。很好，我一定会把这个升到10。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_b7987b: "[霍尔格伦]:呜哦哦哦哦！！！"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_c829b7: "[霍尔格伦]:哦，现在我看到日历了，今天是这个月的第一个星期天。不知道为什么，我在第一个星期天总是精炼不好鞋子。对了，今天非常适合衣服！！"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_cbae5a: "[霍尔格伦]:我可以闭着眼睛精炼物品。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_cef829: "[霍尔格伦]:哈哈哈，我想我有非常重要的事……我现在该走了。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_d13070: "[霍尔格伦]:我小时候去过游泳池，即使我不会游泳，我也能浮在水面上。我就是能做到。这就是我如何开始当精炼师的。"
  npc_override_ecl_fild01_quests_eclage_menu_hollgrehen_d5ce29: "[霍尔格伦]:我不做那种廉价武器。至少是4级的。"
  npc_override_ecl_fild01_quests_eclage_menu_i_0172c6: "我去！我做！我会除掉它们！:我今天没心情。:你不想要腌水果吗？"
  npc_override_ecl_fild01_quests_eclage_menu_i_06bedd: "我是一个活着来到这里的人:你不想验证一下你的理论吗？"
  npc_override_ecl_fild01_quests_eclage_menu_i_12d4f2: "我从外面看到的。:我进过塔里。"
  npc_override_ecl_fild01_quests_eclage_menu_i_1fa82f: "我没生气。:未完成的故事？"
  npc_override_ecl_fild01_quests_eclage_menu_i_21ca25: "我明白了，太遗憾了。:能让我看看那个反应器吗？"
  npc_override_ecl_fild01_quests_eclage_menu_i_235be3: "我没发现多少东西。:我有个问题……"
  npc_override_ecl_fild01_quests_eclage_menu_i_296c62: "我也不想来看你。:你犯了什么罪？"
  npc_override_ecl_fild01_quests_eclage_menu_i_3cb5c7: "我只是来打个招呼。:要求修改埃特兰的项链。"
  npc_override_ecl_fild01_quests_eclage_menu_i_4d73e4: "我会寻找其他方法。:让我们试着和罗伯特交流。"
  npc_override_ecl_fild01_quests_eclage_menu_i_580f93: "我明白了……嗯……:恐怕那不是真的。"
  npc_override_ecl_fild01_quests_eclage_menu_i_5944d6: "我现在有点忙……:当然！"
  npc_override_ecl_fild01_quests_eclage_menu_i_61e822: "我下次再做~:注入物理能力:注入魔法能力:注入远程能力:注入恢复能力"
  npc_override_ecl_fild01_quests_eclage_menu_i_63e2c0: "我很忙！:为什么是我！"
  npc_override_ecl_fild01_quests_eclage_menu_i_705ec3: "我觉得很棒。:我觉得我以前听过这个。"
  npc_override_ecl_fild01_quests_eclage_menu_i_77ed65: "我想帮你。:只是因为。"
  npc_override_ecl_fild01_quests_eclage_menu_i_78838c: "我想了解这座塔。:是条会说话的虫子！"
  npc_override_ecl_fild01_quests_eclage_menu_i_877dd3: "我想我下次再来……:我有必要的硬币。"
  npc_override_ecl_fild01_quests_eclage_menu_i_af7576: "我不敢相信你。:好吧，既然我走到这一步，我就听你说完。"
  npc_override_ecl_fild01_quests_eclage_menu_i_b29d77: "我做！我也是冒险者！:抱歉，我现在做不到。"
  npc_override_ecl_fild01_quests_eclage_menu_i_b5ce0b: "我把信弄丢了。:还没有。"
  npc_override_ecl_fild01_quests_eclage_menu_i_bc2e98: "我都带来了。:它们是什么来着？"
  npc_override_ecl_fild01_quests_eclage_menu_i_c20cd3: "我不是那种会被欺负的人。:我会帮你抓小偷。"
  npc_override_ecl_fild01_quests_eclage_menu_i_ce2e96: "我查出谁是抢劫犯了。:我还没弄清楚。"
  npc_override_ecl_fild01_quests_eclage_menu_i_cfd7aa: "我稍后再想。:没问题。"
  npc_override_ecl_fild01_quests_eclage_menu_i_d41c63: "我只是路过。:我觉得希尔的实验成功了。"
  npc_override_ecl_fild01_quests_eclage_menu_i_d7f96a: "我没说过我会直接给你。:把材料给他。"
  npc_override_ecl_fild01_quests_eclage_menu_i_de0afa: "我给自己弄来的。:我给你们带来的。"
  npc_override_ecl_fild01_quests_eclage_menu_i_dfdfb3: "我想去，但是……:没问题。"
  npc_override_ecl_fild01_quests_eclage_menu_i_e82c37: "我在市场买的。:我偷的。:我见了埃特兰爵士。"
  npc_override_ecl_fild01_quests_eclage_menu_i_ebf81b: "我不想！:好吧。"
  npc_override_ecl_fild01_quests_eclage_menu_i_ee2310: "我宁愿不……:当然！"
  npc_override_ecl_fild01_quests_eclage_menu_i_f17816: "我想帮你但是……:当然。"
  npc_override_ecl_fild01_quests_eclage_menu_i_f4e029: "我来看看你是不是还活着。:给他食物:拂去灰尘:给朋友的礼物"
  npc_override_ecl_fild01_quests_eclage_menu_ingredients_2c6d2d: "我需要的原料是^0000CD以下各一种:拉芬翅膀碎片、萨法之发、卡沃代尔尼罗尔、纯净布拉迪姆、黑暗符文、鲜血符文^000000。"
  npc_override_ecl_fild01_quests_eclage_menu_ingredients_738239: "我需要的原料是^0000cd以下各一种:拉芬翅膀碎片、萨法之发、卡沃代尔尼罗尔、纯净布拉迪姆、黑暗符文、鲜血符文 ^000000。"
  npc_override_ecl_fild01_quests_eclage_menu_input_a5d2ca: "输入一个数字。:看桌子的其他部分。"
  npc_override_ecl_fild01_quests_eclage_menu_it_2fad5c: "帮助他人很重要。:不，我只是路过。"
  npc_override_ecl_fild01_quests_eclage_menu_it_ba0412: "这只是个谣言。:他们有工作给我吗？"
  npc_override_ecl_fild01_quests_eclage_menu_jellopy_fdf810: "杰洛皮:幸运蛋:本地怪物的战利品"
  npc_override_ecl_fild01_quests_eclage_menu_just_d57be9: "走走路就好了。:我会给你带来的。"
  npc_override_ecl_fild01_quests_eclage_menu_keep_0e2328: "继续读。:停止阅读。"
  npc_override_ecl_fild01_quests_eclage_menu_leave_d850c0: "离开房子。:稍后再离开。"
  npc_override_ecl_fild01_quests_eclage_menu_leave_ed7568: "交给我吧！:我不想。"
  npc_override_ecl_fild01_quests_eclage_menu_let_e0332e: "让希西来处理。:我来照顾这个地方！"
  npc_override_ecl_fild01_quests_eclage_menu_look_b0eb9f: "查看他的财物。:不查看就解释。"
  npc_override_ecl_fild01_quests_eclage_menu_look_ced483: "看看里面。:让我出去。"
  npc_override_ecl_fild01_quests_eclage_menu_make_6839ac: "制作蜡烛。:不制作蜡烛。"
  npc_override_ecl_fild01_quests_eclage_menu_nine_8f174a: "九:蘑菇"
  npc_override_ecl_fild01_quests_eclage_menu_no_3463fa: "不！:是的，我保证。"
  npc_override_ecl_fild01_quests_eclage_menu_no_5e24ec: "不，我不能！:好吧，我不会告诉任何人。"
  npc_override_ecl_fild01_quests_eclage_menu_no_9ff33b: "不。:是的。"
  npc_override_ecl_fild01_quests_eclage_menu_no_b5818b: "不，还没有。:握住他的手。"
  npc_override_ecl_fild01_quests_eclage_menu_no_c3f624: "不，我拒绝！:你想让我做什么？"
  npc_override_ecl_fild01_quests_eclage_menu_no_ee19cd: "不，我不这么认为。:是的，我有。"
  npc_override_ecl_fild01_quests_eclage_menu_now_412b95: "现在我要追踪抢劫犯。:我再想想。:我们先在外面见面。"
  npc_override_ecl_fild01_quests_eclage_menu_observe_9566a8: "观察它:算了吧"
