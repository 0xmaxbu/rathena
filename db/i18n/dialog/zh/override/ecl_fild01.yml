Body:
  npc_override_ecl_fild01_quests_eclage_aaa_14b6e2: "啊~"
  npc_override_ecl_fild01_quests_eclage_aaa_25fc49: "啊~~~~"
  npc_override_ecl_fild01_quests_eclage_aaa_49a08b: "啊~~~"
  npc_override_ecl_fild01_quests_eclage_aaa_85276b: "啊~~~~~"
  npc_override_ecl_fild01_quests_eclage_aaa_9e5097: "啊~~~~~~"
  npc_override_ecl_fild01_quests_eclage_aaa_e15f90: "啊~~"
  npc_override_ecl_fild01_quests_eclage_aaaaahhhhhhhhh_65f62a: "……啊……啊……啊啊啊啊啊!!!!!"
  npc_override_ecl_fild01_quests_eclage_about_8a8cef: "关于它？"
  npc_override_ecl_fild01_quests_eclage_about_avant_b4e52c: "关于阿凡特。"
  npc_override_ecl_fild01_quests_eclage_about_many_things_0717be: "关于很多事情。"
  npc_override_ecl_fild01_quests_eclage_about_steal_6918af: "正要偷窃"
  npc_override_ecl_fild01_quests_eclage_about_truth_you_believe_8eac68: "关于你所相信的真相。"
  npc_override_ecl_fild01_quests_eclage_about_where_you_came_rea_d20704: "是关于你来自哪里，真的很有趣。但为什么？"
  npc_override_ecl_fild01_quests_eclage_about_wuhuru_well_i_don_db6dfc: "关于乌鲁……嗯，我不太清楚那些混乱的细节……"
  npc_override_ecl_fild01_quests_eclage_about_you_e64915: "关于你，"
  npc_override_ecl_fild01_quests_eclage_according_estimation_tim_428a14: "根据估计，家园树恢复所需的时间至少为200年。在此期间，这片土地上80%的生命形式将被摧毁。"
  npc_override_ecl_fild01_quests_eclage_according_luen_s_stateme_53c22f: "根据卢恩的陈述，一个陌生的短红发人士正匆忙地跑到某处。"
  npc_override_ecl_fild01_quests_eclage_according_luen_she_thoug_a142bc: "根据卢恩的说法，她认为她是第一个到家的人。"
  npc_override_ecl_fild01_quests_eclage_according_my_brother_you_6499c6: "根据我哥哥的说法，^4d4dff你将能够在彩虹桥的某处找到线索。^000000"
  npc_override_ecl_fild01_quests_eclage_according_rumors_there_l_45cda0: "根据传闻，米德加尔特有一只大鸟的传说，它产的蛋和房子一样大。"
  npc_override_ecl_fild01_quests_eclage_according_their_report_d_12f2fe: "根据他们的报告，这是由于过度开采。"
  npc_override_ecl_fild01_quests_eclage_according_your_brother_h_6b86cf: "根据你哥哥的说法，他从一位高级拉芬那里收到了材料。"
  npc_override_ecl_fild01_quests_eclage_ack_48ced2: "呃……"
  npc_override_ecl_fild01_quests_eclage_acorns_07bfeb: "橡子？！"
  npc_override_ecl_fild01_quests_eclage_acorns_0b8d2f: "橡子~~！！！"
  npc_override_ecl_fild01_quests_eclage_acorns_75dedc: "橡子！"
  npc_override_ecl_fild01_quests_eclage_acorns_so_good_c836d3: "橡子真好吃……"
  npc_override_ecl_fild01_quests_eclage_acted_like_house_e09d0d: "表现得像房子"
  npc_override_ecl_fild01_quests_eclage_actually_672c01: "其实……"
  npc_override_ecl_fild01_quests_eclage_actually_better_deliver_2d21e0: "其实晚点送去更好吗……"
  npc_override_ecl_fild01_quests_eclage_actually_c54f1c: "其实.."
  npc_override_ecl_fild01_quests_eclage_actually_i_don_t_any_a9457a: "其实我没有任何属于自己的时间，因为我必须一直待在这里。"
  npc_override_ecl_fild01_quests_eclage_actually_i_feel_like_my_ac4f08: "其实……我觉得如果我空手回去，我的朋友们会生我的气。"
  npc_override_ecl_fild01_quests_eclage_actually_i_m_first_king_b2e924: "其实我不是第一个混血国王。"
  npc_override_ecl_fild01_quests_eclage_actually_i_m_hoping_he_98d15d: "其实我希望他是出于兴趣才这么做的。"
  npc_override_ecl_fild01_quests_eclage_actually_i_m_sponsoring_121832: "其实，我正在资助一位魔法学者。"
  npc_override_ecl_fild01_quests_eclage_actually_isn_t_my_first_3c2255: "其实，这不是我第一次来这里，但在放松管制达到顶峰的时候，我有机会去其他地方。"
  npc_override_ecl_fild01_quests_eclage_actually_let_s_talk_abou_437a78: "其实，我们稍后再谈这个，现在先去找我父亲。"
  npc_override_ecl_fild01_quests_eclage_actually_why_don_t_i_6fabb5: "其实，为什么我现在不开始唱歌呢？"
  npc_override_ecl_fild01_quests_eclage_actually_your_project_su_2c1ca4: "其实，你的项目成功了。"
  npc_override_ecl_fild01_quests_eclage_additional_reaction_get_e223a8: "^000099附加反应不会被减少。^000000"
  npc_override_ecl_fild01_quests_eclage_advanced_base_splendide_c21994: "在辉煌之地的前进基地。"
  npc_override_ecl_fild01_quests_eclage_adventurer_third_floor_s_554020: "三楼的冒险者快饿死了！"
  npc_override_ecl_fild01_quests_eclage_adventurers_doing_okay_d_de871b: "冒险者们还好吗？别忘了检查他们三个~"
  npc_override_ecl_fild01_quests_eclage_after_becoming_mayor_cry_c6f2e9: "成为市长后，那个爱哭鬼成长了很多。"
  npc_override_ecl_fild01_quests_eclage_after_hundreds_years_i_f_360a9b: "数百年后，我终于全明白了！怎么会这样！"
  npc_override_ecl_fild01_quests_eclage_after_i_think_through_th_5ac11b: "在我仔细考虑之后"
  npc_override_ecl_fild01_quests_eclage_after_losing_my_mind_due_a8b9b5: "由于演讲失败而失去理智后，我在艾克拉奇所有的雅伊上喷绘了'吃土吧，拉芬官方学院混蛋'后被监禁了。嗯，我本来可以避免被捕的。"
  npc_override_ecl_fild01_quests_eclage_after_making_statement_r_e41b62: "^000099说完那句话后，罗伯特消失在反应堆里。我手中握着罗伯特的家园树叶和埃特兰的项链。^000000"
  npc_override_ecl_fild01_quests_eclage_after_massaging_his_head_f9ec55: "按摩了他的头部一段时间后，他看起来好多了，然后继续往前走。"
  npc_override_ecl_fild01_quests_eclage_after_obtaining_body_i_r_6bdbe9: "获得这个身体后，我意识到我宁愿要回我小小的身体。"
  npc_override_ecl_fild01_quests_eclage_after_pounding_door_whil_8fb766: "敲门一会儿后，你感觉到门附近有人，然后打开了一个只有一只眼睛能偷看的窗户。"
  npc_override_ecl_fild01_quests_eclage_after_realizing_i_ponder_19fd07: "意识到这一点后，我思考着如何解开这个扭曲的真相"
  npc_override_ecl_fild01_quests_eclage_after_robbing_our_stuff_26eb19: "抢了我们的东西{0}之后？"
  npc_override_ecl_fild01_quests_eclage_after_seeing_hisie_hidin_b68d99: "看到希西躲起来后，你敲了雅伊的门。"
  npc_override_ecl_fild01_quests_eclage_after_when_big_accident_e3ed15: "就在那之后，大事故发生了。"
  npc_override_ecl_fild01_quests_eclage_after_wuhuru_just_spend_c0762e: "之后，乌鲁只是在他的雅伊里度日。"
  npc_override_ecl_fild01_quests_eclage_after_you_re_done_df4951: "你完成后。"
  npc_override_ecl_fild01_quests_eclage_after_your_visit_i_felt_48221f: "在你来访后，我感到轻松多了。我也很兴奋能控制生命力。"
  npc_override_ecl_fild01_quests_eclage_again_first_person_see_y_045840: "再说一次，第一个看到你的人"
  npc_override_ecl_fild01_quests_eclage_again_first_person_see_y_2ba694: "再说一次，第一个看到你的人可能是我妈妈。"
  npc_override_ecl_fild01_quests_eclage_again_later_ab0d37: "稍后再来。"
  npc_override_ecl_fild01_quests_eclage_again_must_cried_as_such_35ca02: "一定又这样哭了。"
  npc_override_ecl_fild01_quests_eclage_ah_298394: "啊...."
  npc_override_ecl_fild01_quests_eclage_ah_971301: "啊……"
  npc_override_ecl_fild01_quests_eclage_ah_before_i_had_stomach_d89aee: "啊，在我胃痛之前，"
  npc_override_ecl_fild01_quests_eclage_ah_cf07cb: "啊！"
  npc_override_ecl_fild01_quests_eclage_ah_come_think_you_know_2c3204: "啊，想起来了，你认识从迷雾森林来的人类。"
  npc_override_ecl_fild01_quests_eclage_ah_great_f1de77: "啊，太好了！"
  npc_override_ecl_fild01_quests_eclage_ah_home_tree_s_leaf_b893e1: "啊，家园树的叶子。对了。如果家园树生长良好，它会结出叶子。这不是你在其他植物中能看到的东西。"
  npc_override_ecl_fild01_quests_eclage_ah_how_beautiful_135b99: "啊……多美啊。"
  npc_override_ecl_fild01_quests_eclage_ah_how_long_been_since_17da2f: "啊，多久没见到食物了！ yummy！谢天谢地是肉！我觉得有点硬……而且不够热……但毕竟是肉！！"
  npc_override_ecl_fild01_quests_eclage_ah_huh_1340db: "啊…… 嗯……？"
  npc_override_ecl_fild01_quests_eclage_ah_i_felt_so_dizzy_30a3be: "啊，我之前头晕得脑袋直转，现在什么都看不见了！是晚上还是白天？我好饿……"
  npc_override_ecl_fild01_quests_eclage_ah_i_guess_fear_death_f7c99a: "啊……我想这就是对死亡的恐惧……过去的记忆像闪电一样在我脑海中闪过……就像我们在普隆特拉南门度过的快乐时光……"
  npc_override_ecl_fild01_quests_eclage_ah_i_just_remembered_see_b2bcf6: "啊！我刚想起在那之前就看到了乌鲁！"
  npc_override_ecl_fild01_quests_eclage_ah_i_just_want_whine_053871: "啊，我只想抱怨。我哥哥去哪了……？"
  npc_override_ecl_fild01_quests_eclage_ah_i_m_just_feeling_ac545a: "……啊.. 我只是自怨自艾，所以你继续走吧。"
  npc_override_ecl_fild01_quests_eclage_ah_i_m_so_glad_8bb543: "啊……我很高兴遇到了像你这样的好朋友。"
  npc_override_ecl_fild01_quests_eclage_ah_i_m_so_hungry_a76608: "啊~ 我好饿。今天该吃什么？"
  npc_override_ecl_fild01_quests_eclage_ah_i_m_sorry_i_a2f3d5: "啊，对不起。我明白了。"
  npc_override_ecl_fild01_quests_eclage_ah_i_m_starting_headache_170d17: "啊……我开始头疼了。"
  npc_override_ecl_fild01_quests_eclage_ah_pickled_fruits_06a275: "啊..腌水果。"
  npc_override_ecl_fild01_quests_eclage_ah_right_4c7629: "啊……是吗？"
  npc_override_ecl_fild01_quests_eclage_ah_s_too_bad_3e6b05: "啊，那太糟糕了。"
  npc_override_ecl_fild01_quests_eclage_ah_s_tood_bad_dd6e8e: "啊，那太糟糕了。"
  npc_override_ecl_fild01_quests_eclage_ah_s_you_again_you_c29084: "啊，又是你！你真迟钝。总之，你是来告诉我开始工作的，对吧？我知道了，我知道了。你现在可以走了。"
  npc_override_ecl_fild01_quests_eclage_ah_thank_you_so_much_223179: "啊，非常感谢！"
  npc_override_ecl_fild01_quests_eclage_ah_there_anyone_more_exp_c67347: "啊……有没有更有经验的人来处理这个……"
  npc_override_ecl_fild01_quests_eclage_ah_very_good_look_perfec_1d631c: "啊~ 很好。看看这个完美的派。香味也很棒。我该尝一点吗？"
  npc_override_ecl_fild01_quests_eclage_ah_what_i_done_4899de: "啊.. 我做了什么……？"
  npc_override_ecl_fild01_quests_eclage_ah_what_relief_i_m_e6a3d8: "啊……真是松了口气……很高兴你在这里。我正要独自离开这座塔！但我想我迷路了。"
  npc_override_ecl_fild01_quests_eclage_ah_whatever_take_anyway_6edc83: "啊，不管了！拿着这个。"
  npc_override_ecl_fild01_quests_eclage_ah_who_world_did_such_b53f04: "啊，到底是谁…… 做了这样的事……"
  npc_override_ecl_fild01_quests_eclage_ah_you_722dab: "啊，你是？"
  npc_override_ecl_fild01_quests_eclage_ah_you_don_t_want_a89544: "啊……你不想要吗？"
  npc_override_ecl_fild01_quests_eclage_ah_you_re_right_e70422: "啊，你说得对。"
  npc_override_ecl_fild01_quests_eclage_ah_you_trying_show_etran_cabb1f: "啊，你想给埃特兰看我的家园树叶。你问这么明显的问题……"
  npc_override_ecl_fild01_quests_eclage_ah_you_ve_come_just_8b39af: "啊，你来得正是时候。"
  npc_override_ecl_fild01_quests_eclage_aha_f73000: "啊哈……!!!!!!"
  npc_override_ecl_fild01_quests_eclage_ahah_i_m_all_fired_1f78e3: "啊哈~我充满干劲。"
  npc_override_ecl_fild01_quests_eclage_ahah_way_b98d29: "啊哈~顺便说一下，"
  npc_override_ecl_fild01_quests_eclage_ahaha_no_need_worry_abou_d67002: "啊哈哈，不用担心我！我自己能行！"
  npc_override_ecl_fild01_quests_eclage_ahaha_really_you_might_r_7ef8ca: "啊哈哈……真的吗？也许你是对的……？ 哦好吧，我再做一个，别担心……"
  npc_override_ecl_fild01_quests_eclage_ahahahah_ha_hahha_hahaa_88587c: "啊哈哈哈……哈……哈哈..哈哈.."
  npc_override_ecl_fild01_quests_eclage_ahahahahahaha_79a921: "啊哈哈哈哈哈-"
  npc_override_ecl_fild01_quests_eclage_ahahhaa_no_s_like_i_fb4cc1: "啊哈哈，不，不是那样的。我只是在操作便携式裂隙反应器时发现了一些小问题。"
  npc_override_ecl_fild01_quests_eclage_ahh_ded1c5: "啊……"
  npc_override_ecl_fild01_quests_eclage_ahh_how_terrible_923877: "啊，真可怕.."
  npc_override_ecl_fild01_quests_eclage_ahh_now_i_remember_befor_3171e0: "啊！现在我想起来了，以前我们可以订购精确需要的长度，但因为现在大规模生产，他们只提供预设长度。"
  npc_override_ecl_fild01_quests_eclage_ahh_why_isn_t_working_c2eb65: "啊~ 为什么这个不工作！你，当我这样放置你时，你必须有反应！！啊什么都不工作！哇，它从我手中滑落了！（碎裂声）"
  npc_override_ecl_fild01_quests_eclage_ahhh_how_irritating_1dbe38: "啊！真烦人！！！"
  npc_override_ecl_fild01_quests_eclage_ahhhh_abd4ac: "啊啊啊！！！"
  npc_override_ecl_fild01_quests_eclage_ahhhh_i_didn_t_say_92b635: "啊啊啊 我什么都没说。我没有……"
  npc_override_ecl_fild01_quests_eclage_ahhhh_maybe_really_isn_t_811b2f: "啊啊啊也许这真的不是梦！！！"
  npc_override_ecl_fild01_quests_eclage_ahhhh_my_head_feels_like_0b57d4: "啊啊啊，我的头感觉要爆炸了。"
  npc_override_ecl_fild01_quests_eclage_ahhhhhhhh_a35609: "啊啊啊啊啊啊!!!!!!!!!!"
  npc_override_ecl_fild01_quests_eclage_ahng_i_think_they_alread_921d3d: "啊嗯！？我想他们已经开始工作了。田野又在呼吸了。这片田野有很多故事，你知道的。"
  npc_override_ecl_fild01_quests_eclage_ahng_s_simple_tell_laphi_741e4c: "啊嗯？很简单。告诉散落在田野各处的拉芬们开始今天的工作。"
  npc_override_ecl_fild01_quests_eclage_ahng_well_too_bad_if_dcf7d4: "啊嗯？好吧，太糟糕了。但如果你以后有时间，请顺道过来。我这里需要一点帮助。"
  npc_override_ecl_fild01_quests_eclage_alarm_clock_tower_1d8e8f: "钟楼里的闹钟"
  npc_override_ecl_fild01_quests_eclage_alberta_place_people_run_384268: "艾尔贝塔是卢恩-米德加尔特的人们需要去其他国家旅行时会去的地方。"
  npc_override_ecl_fild01_quests_eclage_alcohol_he_must_eabeb3: "和酒精。他一定"
  npc_override_ecl_fild01_quests_eclage_alcohol_more_gambling_dd6a39: "用酒精换取更多赌博"
  npc_override_ecl_fild01_quests_eclage_all_ae1148: "一点也不！"
  npc_override_ecl_fild01_quests_eclage_all_aside_i_m_sure_5d71f1: "除此之外，我确定希尼姆在隐瞒什么。"
  npc_override_ecl_fild01_quests_eclage_all_because_you_a8de24: "这一切都是因为你"
  npc_override_ecl_fild01_quests_eclage_all_day_long_90cfd8: "一整天。"
  npc_override_ecl_fild01_quests_eclage_all_expensive_s_just_34aeaf: "都那么贵。但这只是"
  npc_override_ecl_fild01_quests_eclage_all_first_time_visitors_595268: "所有首次来访艾克拉奇的游客必须在这里填写必要的表格才能进入。"
  npc_override_ecl_fild01_quests_eclage_all_first_time_visitors_9e26db: "所有首次来访艾克拉奇的游客必须在进入前填写必要的表格。"
  npc_override_ecl_fild01_quests_eclage_all_i_am_trying_just_e52893: "我只想把这个交给他！"
  npc_override_ecl_fild01_quests_eclage_all_i_did_just_place_824048: "我只是把手放在上面！"
  npc_override_ecl_fild01_quests_eclage_all_i_did_today_4ea1fc: "我今天所做的只是"
  npc_override_ecl_fild01_quests_eclage_all_i_know_sure_shenime_0848d4: "我唯一确定的是希尼姆不是他的真名。所以我编造了一个有趣的故事。你知道控制公众意味着什么吗？"
  npc_override_ecl_fild01_quests_eclage_all_i_saw_land_blooming_c124f2: "我只看到了开满花的土地和怪物。"
  npc_override_ecl_fild01_quests_eclage_all_i_sincerely_apprecia_c0c6ad: "尽管如此，我衷心感谢你的帮助。"
  npc_override_ecl_fild01_quests_eclage_all_i_trust_you_thank_78f281: "我唯一能信任的就是你{0}。谢谢。"
  npc_override_ecl_fild01_quests_eclage_all_i_wanted_you_gain_540cbd: "我只是想让你在艾克拉奇获得认可，我并没有恶意。"
  npc_override_ecl_fild01_quests_eclage_all_i_your_convenience_r_88fed0: "这是我现在能为你提供的全部便利。"
  npc_override_ecl_fild01_quests_eclage_all_ingredients_research_206294: "这份研究报告中的所有^0000CD材料^000000对我来说都很难自己收集。{0}我想请求你的帮助。"
  npc_override_ecl_fild01_quests_eclage_all_myself_2c31d9: "全靠我自己……"
  npc_override_ecl_fild01_quests_eclage_all_others_ac37ef: "所有其他人。"
  npc_override_ecl_fild01_quests_eclage_all_sudden_people_midgar_e10a4e: "突然间，来自米德加尔特的人们开始越来越多地访问艾克拉奇。"
  npc_override_ecl_fild01_quests_eclage_all_thanks_you_fact_mr_8e3b00: "这都多亏了你！聪明先生正在睡觉这个事实意味着他几天内都不会醒。"
  npc_override_ecl_fild01_quests_eclage_all_things_why_my_e0746b: "偏偏为什么我的"
  npc_override_ecl_fild01_quests_eclage_all_unique_ae72ce: "那么独特。"
  npc_override_ecl_fild01_quests_eclage_all_while_you_took_42c732: "一直以来，你拿了"
  npc_override_ecl_fild01_quests_eclage_all_you_need_zeny_69bd65: "你只需要10,000金币~"
  npc_override_ecl_fild01_quests_eclage_almost_got_bitten_again_bd68d0: "差点又被咬了。"
  npc_override_ecl_fild01_quests_eclage_along_clever_rattled_abo_ae8e83: "^000099除此之外，聪明还喋喋不休地说着一些我听不懂的话，比如'女武神最棒了。叔叔好喜欢'。^000000"
