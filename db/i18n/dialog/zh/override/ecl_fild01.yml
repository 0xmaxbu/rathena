  npc_override_ecl_fild01_quests_eclage_however_real_history_bui_959ee2: "然而，真正的历史是建立在年轻拉芬的牺牲之上的。起初，作为一名历史学家，我无法接受那个真相。"
  npc_override_ecl_fild01_quests_eclage_however_s_ideal_place_no_f09f96: "然而，它既不是一个理想的地方，也不是一个适合居住的好地方。"
