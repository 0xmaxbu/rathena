  npc_override_ecl_fild01_quests_eclage_menu_re_ea6571: "^990000回:^000000有更多笨蛋相信这些东西。嘿孩子们，《艾克拉奇月刊》是一本三流八卦杂志。别把它和历史搞混了。"
  npc_override_ecl_fild01_quests_eclage_menu_re_f27a2a: "^990000回:^000000嘿伙计们，你们知道吗？长老议会最初完全反对建造家园树。但历史书上说是他们提出的这个想法。不奇怪吗？谁是对的？"
  npc_override_ecl_fild01_quests_eclage_menu_re_f50e0c: "^990000回-回:^000000:我拿走照片。我会让你加入我们的编辑部。"
  npc_override_ecl_fild01_quests_eclage_menu_re_f87e1e: "^990000回-回:^000000:我也听说过。^000099为了让他们看起来真实，他们从会议前几天就开始一点一点地互相争论^000000。那是历史学家中最有争议的话题。"
  npc_override_ecl_fild01_quests_eclage_menu_re_fde769: "^990000回-回:^000000:哦我明白了。非常感谢你的智慧。我想如果你在一本三流杂志上留下这样的评论，你看起来会非常聪明。"
