  npc_override_ecl_fild01_quests_eclage_oh_man_even_people_we_035aad: "哦天哪，连我们找到的人都这么冷漠……我现在还能做什么……？"
  npc_override_ecl_fild01_quests_eclage_oh_man_he_s_still_84fe65: "哦天哪，他还在担心那种事。"
  npc_override_ecl_fild01_quests_eclage_oh_man_hiccup_818aa6: "哦~天哪，打嗝~"
  npc_override_ecl_fild01_quests_eclage_oh_man_i_m_craving_0808b9: "哦天哪~我 craving 人类世界的冰镇啤酒和烤鸡肉串~"
  npc_override_ecl_fild01_quests_eclage_oh_my_cheat_run_87e35f: "哦我的……这是骗了就跑吗？！"
  npc_override_ecl_fild01_quests_eclage_oh_my_did_i_talk_7800c1: "哦天哪，我说太多了吗？"
  npc_override_ecl_fild01_quests_eclage_oh_my_gosh_you_scared_855b16: "哦天哪！你吓死我了！你在这里做什么？"
  npc_override_ecl_fild01_quests_eclage_oh_my_how_could_eca795: "哦天哪。怎么会这样……？"
  npc_override_ecl_fild01_quests_eclage_oh_my_really_bb626a: "哦天哪..真的吗？"
  npc_override_ecl_fild01_quests_eclage_oh_my_s_really_true_deb75a: "哦天哪，那是真的！"
  npc_override_ecl_fild01_quests_eclage_oh_no_i_m_weird_82a713: "哦……不。我不是个奇怪的拉芬。"
  npc_override_ecl_fild01_quests_eclage_oh_no_no_i_am_8ba4a7: "哦，不，不。我相信你真的很忙。很抱歉请你帮这样的忙。"
  npc_override_ecl_fild01_quests_eclage_oh_no_there_such_inciden_3410ef: "哦不！发生过这样的事件吗？"
