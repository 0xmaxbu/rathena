  npc_override_ecl_fild01_quests_eclage_alright_awesome_awesome_b4f466: "好的！！太棒了，太棒了！"
  npc_override_ecl_fild01_quests_eclage_alright_c283ff: "好的……？"
  npc_override_ecl_fild01_quests_eclage_alright_i_act_as_though_9327ec: "好的，我会表现得像从没来过这里一样。"
  npc_override_ecl_fild01_quests_eclage_alright_let_s_go_9491e4: "好的，我们去吧。"
  npc_override_ecl_fild01_quests_eclage_alright_let_s_go_couse_89350c: "好的，走吧！但当然！只有你去！"
  npc_override_ecl_fild01_quests_eclage_alright_next_person_line_9ca652: "好的，请下一位！"
  npc_override_ecl_fild01_quests_eclage_alright_thanks_lot_de8e3e: "好的，非常感谢~"
  npc_override_ecl_fild01_quests_eclage_alright_then_shall_we_ge_977012: "那好，我们去弄些橡子吧？"
  npc_override_ecl_fild01_quests_eclage_alright_we_just_need_eli_c3d23e: "好的。我们只需要消灭阿凡特召唤的那些。"
  npc_override_ecl_fild01_quests_eclage_alright_what_you_want_wh_3ace57: "好的。你想要什么？是你之前问的那个，关于维度裂隙碎片？"
  npc_override_ecl_fild01_quests_eclage_alright_you_may_now_deli_968a55: "好的，你现在可以把这个交给丰。另外，虽然我知道在这些忙碌的时候这很难，但你能 also 告诉他我说，'请更珍惜地照顾它们吗？'"
  npc_override_ecl_fild01_quests_eclage_alrighty_nice_meeting_yo_275869: "好的~很高兴见到你。我要把这首曲子的剩余部分唱完。"
  npc_override_ecl_fild01_quests_eclage_also_489166: "还有……"
  npc_override_ecl_fild01_quests_eclage_also_alberta_there_islan_35270d: "还有从艾尔贝塔出发，有一个以海龟高度集中而闻名的岛屿。"
  npc_override_ecl_fild01_quests_eclage_also_because_bifrost_71c693: "这也是因为彩虹桥吗？"
  npc_override_ecl_fild01_quests_eclage_also_i_another_favor_f658e2: "另外，我还有一个请求。"
  npc_override_ecl_fild01_quests_eclage_also_if_i_find_means_2891d8: "而且，如果我能找到让自己变大的方法……"
  npc_override_ecl_fild01_quests_eclage_also_known_as_dreaming_n_76d646: ".........也被称为梦想小说家……"
  npc_override_ecl_fild01_quests_eclage_also_messed_up_e0b5ea: "也搞砸了……"
  npc_override_ecl_fild01_quests_eclage_also_please_tell_him_if_ffd04a: "而且请告诉他，如果他不马上回来，我就拔掉那根茎。"
  npc_override_ecl_fild01_quests_eclage_also_reason_donas_existe_d0c070: "而且，这也是多纳存在的原因。多纳随时准备被使用。"
  npc_override_ecl_fild01_quests_eclage_also_they_want_see_bifro_61cedd: "而且，他们想亲眼看看连接约顿海姆和阿尔夫海姆的彩虹桥。"
  npc_override_ecl_fild01_quests_eclage_although_all_your_questi_9906f5: "虽然你所有的问题都得到了回答，但要时常来看我。"
  npc_override_ecl_fild01_quests_eclage_although_exact_informati_6971db: "- 虽然关于莫伦格年龄的准确信息仍然未知，我们先回到尤贝身边。"
  npc_override_ecl_fild01_quests_eclage_although_he_changed_his_221503: "虽然他改变了发色，但确实是阿凡特。"
  npc_override_ecl_fild01_quests_eclage_although_he_pretty_old_h_be40af: "虽然他很老了，但他成了国王。"
  npc_override_ecl_fild01_quests_eclage_although_he_s_bit_immatu_c0ed73: "虽然他有点不成熟"
  npc_override_ecl_fild01_quests_eclage_although_his_fame_lost_b_cb49b1: "虽然他的名声近年来因为呆在家里太喜欢做家务而有所减退。"
  npc_override_ecl_fild01_quests_eclage_although_human_civilizat_34029b: "虽然人类文明已经足够先进可以建立国家，但人类并没有在积累知识，而只是在不断地转移注意力，"
