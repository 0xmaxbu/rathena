  npc_override_ecl_fild01_quests_eclage_put_positively_he_lives_20f03c: "往好处说，他活得年轻，但往坏处说，他只是个不成熟的家伙。"
  npc_override_ecl_fild01_quests_eclage_quiet_kid_no_matter_what_37a02e: "安静的孩子。无论别人怎么说，你父亲是个偷精炼物品的卑鄙小人。如果你为此而烦恼 = 试着回来。我随时面对你的复仇。"
