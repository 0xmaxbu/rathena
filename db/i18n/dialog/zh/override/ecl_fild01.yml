  npc_override_ecl_fild01_quests_eclage_robert_robert_did_you_se_837138: "罗伯特！罗伯特！你看到这里的新的烤鸡肉串店了吗？他们今天盛大开业！我们去吃点吧！"
  npc_override_ecl_fild01_quests_eclage_robert_s_reaction_emerge_f33aa5: "^000099罗伯特的反应还没有出现。他一定还在获取家园树叶的过程中。^000000"
