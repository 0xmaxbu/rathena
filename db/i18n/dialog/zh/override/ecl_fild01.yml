  npc_override_ecl_fild01_quests_eclage_however_if_we_take_care_74b048: "然而，如果我们不恢复家园树就照顾这片土地上的生命形式，没有支持生命形式的基本资源，它将不可避免地走向毁灭。那段时间甚至不会超过400年。"
