  npc_override_ecl_fild01_quests_eclage_reason_you_who_knows_our_711b81: "因此，你知道我们的物资失踪了，而且恰好也是外来者。"
  npc_override_ecl_fild01_quests_eclage_recall_what_guard_just_d_7b5a97: "回想一下刚才路过的守卫说的话，"
  npc_override_ecl_fild01_quests_eclage_recently_she_s_been_aski_454f0f: "最近，她一直要这要那，还为这个那个生气。"
  npc_override_ecl_fild01_quests_eclage_recently_they_discovered_14a813: "最近，他们在这附近发现了一个可疑的裂缝。因为我现在的样子，我无法亲自去查看，但我的同事参加了这里的研究小组，似乎带回了什么东西。"
  npc_override_ecl_fild01_quests_eclage_recently_wife_asked_him_812e28: "最近，妻子让他"
