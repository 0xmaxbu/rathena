  npc_override_ecl_fild01_quests_eclage_there_problem_d0c1a9: "有问题吗？"
  npc_override_ecl_fild01_quests_eclage_there_problem_yggdrasil_440077: "伊格德拉西有问题吗？死亡的气息开始弥漫这片宁静的土地。"
  npc_override_ecl_fild01_quests_eclage_there_rumors_after_disco_a9d5c5: "有谣言说，在与伊格德拉西断绝联系后，他越来越虚弱，最终自焚了。"
  npc_override_ecl_fild01_quests_eclage_there_s_also_secret_tale_c4263c: "还有一个关于佛罗伦萨的儿子，塞尼斯国王的秘密故事。由于他有罪犯父亲的自卑感，他是一个实施激进政策的国王。"
