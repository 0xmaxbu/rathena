  npc_override_ecl_fild01_quests_eclage_reason_why_hiel_research_e33421: "希尔研究裂缝碎片的原因是他和我有相同的目标。^000099他想通过超越时空连续体，直接与过去的拉芬见面来解决问题。^000000"
