  npc_override_ecl_fild01_quests_eclage_really_i_m_glad_i_961311: "真的？我很高兴……我希望有一天能在这个反应器中帮助埃特兰爵士和罗伯特爵士重聚。"
  npc_override_ecl_fild01_quests_eclage_really_least_take_look_p_295211: "真的？但至少看看这个地方的家园树。它长得很好！彩虹桥的所有植物都生机勃勃……如果有敌对势力，那应该是不可能的。"
