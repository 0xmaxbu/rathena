  npc_override_ecl_fild01_quests_eclage_they_should_keep_way_831f0e: "他们应该保持这样。"
  npc_override_ecl_fild01_quests_eclage_they_should_know_how_sca_1efe41: "他们应该知道我能有多可怕。"
  npc_override_ecl_fild01_quests_eclage_they_sold_inside_base_sp_1738c6: "它们在辉煌之地基地内出售。"
  npc_override_ecl_fild01_quests_eclage_they_specialties_base_sp_a28ea9: "它们是辉煌之地基地的特色产品。"
