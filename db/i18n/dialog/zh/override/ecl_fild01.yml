  npc_override_ecl_fild01_quests_eclage_hungry_expression_915fad: "这是饥饿的表情……"
  npc_override_ecl_fild01_quests_eclage_hunting_also_he_never_ca_608680: "打猎也是，他从未抓住"
  npc_override_ecl_fild01_quests_eclage_hunting_land_6fa327: "在土地上打猎"
  npc_override_ecl_fild01_quests_eclage_hunting_some_monsters_3dcfd9: "通过猎杀一些怪物。"
  npc_override_ecl_fild01_quests_eclage_hurry_up_886936: "快点"
  npc_override_ecl_fild01_quests_eclage_hurrying_somewhere_74f621: "匆匆去某地。"
  npc_override_ecl_fild01_quests_eclage_hurt_anywhere_dff424: "哪里受伤了吗？"
  npc_override_ecl_fild01_quests_eclage_hurts_917e27: "好痛！"
  npc_override_ecl_fild01_quests_eclage_i_able_collect_these_abu_d1091f: "我能收集这些丰富的魔力并填满宝珠的内核吗？"
  npc_override_ecl_fild01_quests_eclage_i_accidentally_found_lab_f43c58: "我偶然在东边发现一个实验室雅伊。"
  npc_override_ecl_fild01_quests_eclage_i_actually_pretty_doubtf_37494d: "我其实挺怀疑的……"
  npc_override_ecl_fild01_quests_eclage_i_almost_didn_t_recogniz_be3b92: "我差点没认出他，因为他换了发色。但他的样子和说话方式几乎一样。恶心！"
  npc_override_ecl_fild01_quests_eclage_i_almost_forgot_he_main_54ffff: "我差点忘了他是主谋。"
  npc_override_ecl_fild01_quests_eclage_i_already_did_fact_they_59f91d: "我已经做了。事实上，他们已经在找他了。"
  npc_override_ecl_fild01_quests_eclage_i_also_heard_7d0986: "我也听说"
  npc_override_ecl_fild01_quests_eclage_i_also_honestly_did_beli_50fb5a: "我也真的不相信会有这么大的鸟。"
  npc_override_ecl_fild01_quests_eclage_i_also_made_enough_wicks_8dab03: "我也及时做了足够的灯芯！"
  npc_override_ecl_fild01_quests_eclage_i_also_met_someone_who_a077eb: "而且我也遇到了一个在你被监禁之前目击另一个更大的拉芬追那个拉芬的人。"
  npc_override_ecl_fild01_quests_eclage_i_also_outcasted_here_pe_75f81c: "我也被放逐到这里。人们对外来者没有好客和慷慨的概念。"
  npc_override_ecl_fild01_quests_eclage_i_also_saw_many_suspicio_3f122f: "我也在该地区看到了许多^0000cd可疑的树枝^000000。"
  npc_override_ecl_fild01_quests_eclage_i_also_want_visit_foreig_c688cc: "我也想访问外国。"
  npc_override_ecl_fild01_quests_eclage_i_am_actually_responsibl_cef532: "我其实负责帮忙抓强盗。"
  npc_override_ecl_fild01_quests_eclage_i_am_always_living_anxie_8fed00: "我一直生活在焦虑中..谁会想到日记蛙的生活如此艰难？"
  npc_override_ecl_fild01_quests_eclage_i_am_bit_doubtful_363e21: "我有点怀疑，但是"
  npc_override_ecl_fild01_quests_eclage_i_am_considering_right_n_65efc9: "我正在考虑的……"
  npc_override_ecl_fild01_quests_eclage_i_am_frog_made_wood_0f0eb2: "我是一个木头做的可以用来记录的青蛙。"
  npc_override_ecl_fild01_quests_eclage_i_am_high_level_laphine_68b367: "我是一个高级拉芬生命恢复者。你和这个跟我长得像的人有什么关系？"
  npc_override_ecl_fild01_quests_eclage_i_am_just_7b758c: "我只是"
  npc_override_ecl_fild01_quests_eclage_i_am_just_so_amazing_fac120: "我就是这么了不起！"
  npc_override_ecl_fild01_quests_eclage_i_am_now_able_support_084bd5: "为此，我现在能够很好地支持自己，我和他的关系真的很牢固。"
  npc_override_ecl_fild01_quests_eclage_i_am_one_give_up_732349: "但我不是那种轻易放弃的人。"
  npc_override_ecl_fild01_quests_eclage_i_am_really_all_great_f0e694: "我真的没那么伟大。"
  npc_override_ecl_fild01_quests_eclage_i_am_really_concerned_ab_cb28cf: "我真的很担心他。"
  npc_override_ecl_fild01_quests_eclage_i_am_recently_finding_en_891990: "最近，随着我和身边伟大的菲力一起工作，我一点一点地找到鼓励，但有一天，我向你保证，这一切都会被修复。"
  npc_override_ecl_fild01_quests_eclage_i_am_remembering_somethi_0717aa: "我模糊地记得什么……"
  npc_override_ecl_fild01_quests_eclage_i_am_so_glad_i_277cf6: "我很高兴终于有了自己的雅伊！"
  npc_override_ecl_fild01_quests_eclage_i_am_so_sorry_62d704: "我很抱歉。"
  npc_override_ecl_fild01_quests_eclage_i_am_trapped_body_no_26ef4d: "我被困在这个身体里，无论如何……"
  npc_override_ecl_fild01_quests_eclage_i_am_why_9f8aaa: "我是，但为什么？"
  npc_override_ecl_fild01_quests_eclage_i_am_years_old_1c8ab3: "我146岁了。"
  npc_override_ecl_fild01_quests_eclage_i_appreciate_what_you_di_7444e2: "感谢你上次做的事。大地似乎也心情很好。我能感觉到。你能再帮我们一次吗？"
  npc_override_ecl_fild01_quests_eclage_i_ask_you_2682f0: "我问你！"
  npc_override_ecl_fild01_quests_eclage_i_ask_you_41a744: "我问你……"
  npc_override_ecl_fild01_quests_eclage_i_ask_you_charge_searchi_19eb24: "我要求你负责在艾克拉奇内部搜索。"
  npc_override_ecl_fild01_quests_eclage_i_ask_you_d6f35d: "我要求你"
  npc_override_ecl_fild01_quests_eclage_i_ask_you_eliminate_them_b73fe4: "我要求你下次巡逻该区域时消灭它们。"
  npc_override_ecl_fild01_quests_eclage_i_ask_you_favor_e92bdd: "能请你帮个忙吗？"
  npc_override_ecl_fild01_quests_eclage_i_ask_you_use_hiel_cc80bf: "我要求你使用希尔的裂隙工具去见过去的埃特兰和拉芬。"
  npc_override_ecl_fild01_quests_eclage_i_asked_you_horns_hillsl_1d4e3e: "我要求你带来5个山狮之角、5个神秘之角和5个马蹄。"
  npc_override_ecl_fild01_quests_eclage_i_ate_so_much_i_25565a: "我吃得太多，以至于因牙痛而卧床不起。"
  npc_override_ecl_fild01_quests_eclage_i_been_rejected_straight_d38b3f: "我被直接拒绝了。"
  npc_override_ecl_fild01_quests_eclage_i_been_toast_if_weren_9fba16: "要不是那根树枝，我就完蛋了。"
  npc_override_ecl_fild01_quests_eclage_i_begin_interviewing_a2b256: "我将开始采访"
  npc_override_ecl_fild01_quests_eclage_i_begin_my_interview_you_21afcd: "我将开始采访你。"
  npc_override_ecl_fild01_quests_eclage_i_borrowed_book_3bff1c: "我借了一本书。"
  npc_override_ecl_fild01_quests_eclage_i_borrowed_some_books_as_46daab: "我也借了一些书来了解米德加尔特的人，因为最近有很多来自那个地区的访客。"
  npc_override_ecl_fild01_quests_eclage_i_bought_her_11e6e7: "我给她买的？"
  npc_override_ecl_fild01_quests_eclage_i_brought_3481d3: "我带来了这个。"
  npc_override_ecl_fild01_quests_eclage_i_brought_guy_named_yube_ec88e1: "我把那个叫尤贝的家伙带来了！"
  npc_override_ecl_fild01_quests_eclage_i_brought_some_meat_fili_b19a8a: "我从菲力那里带了一些肉！"
  npc_override_ecl_fild01_quests_eclage_i_came_after_talking_mas_2e93ca: "我和马西昂谈完后来的……"
  npc_override_ecl_fild01_quests_eclage_i_came_back_after_viewin_246be3: "我看完那些参考资料后回来了。"
  npc_override_ecl_fild01_quests_eclage_i_collecting_some_star_s_c553c9: "我在收集一些^FF0000星形蘑菇^000000！"
  npc_override_ecl_fild01_quests_eclage_i_come_help_out_later_c6f7c4: "我稍后也会来帮忙，即使要把这家伙绑在柱子上。"
  npc_override_ecl_fild01_quests_eclage_i_coming_back_40430a: "我从……回来"
  npc_override_ecl_fild01_quests_eclage_i_commanded_guards_stren_554bd2: "我命令守卫加强宝珠周围的安全巡逻。"
  npc_override_ecl_fild01_quests_eclage_i_could_ve_showed_fili_386967: "我本可以给菲力展示我的新动作！"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_ask_them_ba6766: "我不敢直接问与那相关的问题，因为我害怕可能会伤害他们的自尊。"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_experience_an_bceed1: "但我无法从这里体验任何与裂隙相关的东西。那意味着……"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_go_out_d84b90: "我不能出去接你！"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_make_far_a96e3a: "^D96E26但我没能走~那么远~我饿得昏倒了。^000000"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_possibly_carr_cc64bf: "我不可能搬运那么大的东西喵……"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_talk_him_634df4: "我没法和他说话，"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_tell_my_2bd0ef: "但是，我不能告诉我的父母，因为如果他们发现真相，"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_work_without_7b1b64: "没有他们我没法工作。"
  npc_override_ecl_fild01_quests_eclage_i_d_like_make_suggestion_1e49fd: "我想提出一个^0000cd建议^000000。"
  npc_override_ecl_fild01_quests_eclage_i_decided_eat_some_time_2230e5: "我决定暂时不吃它。"
  npc_override_ecl_fild01_quests_eclage_i_decorate_yai_materials_609a00: "我必须用你前几天给我带来的材料装饰雅伊，但我不知道什么时候能离开……"
  npc_override_ecl_fild01_quests_eclage_i_definitely_knew_even_u_3df6ab: "即使在几百年前我也绝对知道，但现在我清楚地忘记了。"
  npc_override_ecl_fild01_quests_eclage_i_definitely_saw_midgard_480eeb: "我肯定在米德加尔特看到过。"
  npc_override_ecl_fild01_quests_eclage_i_did_steal_ceefab: "我没有偷"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_even_anything_2e0f45: "我什么都没做错！"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_even_share_fe055b: "我甚至没有和我如此信任的哥哥分享。"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_expect_meet_957359: "我没想到会遇到来自米德加尔特的人！"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_get_know_ea8a81: "我认识你没多久，但谢谢你，来自未来的旅行者。"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_know_he_6db9c9: "但我不知道他会这么不负责任。"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_know_there_b52fa0: "我不知道会有这样的方式。"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_know_what_f1a4ab: "我不知道那到底是什么，但当我正在思考时，阿凡特刚刚浮现在我脑海中。"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_know_you_193cdf: "我不知道你会那样拒绝……"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_know_you_60db37: "我不知道你为此考虑了这么多……"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_really_anything_335e0e: "我真的没有任何东西"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_see_anybody_843952: "我没看到任何人。"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_sense_any_92f73e: "我没有感知到任何魔法使用或其他类似的东西……"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_steal_any_a9f243: "我没偷任何酒。"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_think_much_ac5ff0: "我没想太多就回家了。但一段时间后，一声如此响亮以至于能震动整个田野的尖叫划破了空气。"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_understand_him_b40c4d: "我更不了解他了。"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_want_myself_0929a4: "我不想这样……我的贪婪过度了。"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_want_provide_005418: "我不想免费提供他食物和住处，"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_want_show_bbb12e: "我不想给你看这个，但这个伤疤就是证据。"
  npc_override_ecl_fild01_quests_eclage_i_digressed_bit_there_st_78ddfd: "我有点离题了。艾克拉奇诞生的故事实际上是一份作为机密材料传承下来的非官方历史记录。但其中有些部分是不正确的。"
  npc_override_ecl_fild01_quests_eclage_i_disadvantage_675fdf: "我有劣势！"
  npc_override_ecl_fild01_quests_eclage_i_doing_my_business_fiel_94e9f7: "我半夜在田里办事，但突然出现两个黑影！"
  npc_override_ecl_fild01_quests_eclage_i_don_t_7df0a4: "我不。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_any_responsibili_932ed7: "我没有任何责任。但如果任何冒险者在这里受伤，大地会悲伤。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_anything_else_24263d: "我在诊所没有其他事可做。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_believe_myths_0f2251: "我不相信神话。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_blame_you_7d1f40: "我不怪你，因为这是无知。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_come_up_6a1a4a: "我没有~上来吧~"
  npc_override_ecl_fild01_quests_eclage_i_don_t_even_know_9d1f2b: "我甚至不知道这个八卦对我有什么用。这就是你和聪明谈的全部吗？"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_about_b9eb72: "我不知道这个……"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_acedd2: "我不知道。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_anything_64adb5: "除此之外我什么都不知道。但如果那是真正的家园树叶子，我不可能认不出来。家园树叶子的生命反应令人难以置信。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_exactly_79c7e9: "我不太清楚……"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_him_8bf2a7: "我不认识他。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_how_7417e8: "我不知道没有这些糖果我是怎么活下来的！"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_how_9cf59f: "我不知道一个一生都过得如此平静的人怎么会变成那样。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_how_bda945: "我不知道这对你听起来如何，但我认为你成为市长是件好事。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_how_c3351e: "我不知道这需要多长时间。目前很难同时见到埃特兰和罗伯特。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_how_c5f16c: "我不知道这么好的孩子怎么会变成那样……"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_if_7bb345: "我不知道我该说还好……还是不好……"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_if_cefce4: "我不知道那是好是坏……"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_person_da05ab: "我不认识那个人！你不觉得可疑吗！"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_what_4b1fbc: "我不知道市长在想什么，但他邀请他们并给他们工作。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_what_5bd54d: "我不知道那是什么，但我想看看他的作品。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_when_e8eae3: "我不记得上一次这么平静是什么时候。我祈祷你的家园树得到祝福。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_where_62da3b: "我不知道你在哪里听说过他，但你应该放弃。你找不到他的。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_where_ebb77c: "但我不知道他在哪里……"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_who_332b7e: "我不知道你是谁，但你能等我叫你吗？"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_why_390399: "我不知道为什么市长对宝珠如此着迷，但既然他是在和你谈话后做出那个决定的，我相信你对他也有很大影响。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_why_5d9004: "我不知道为什么，但你也应该留意。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_why_65e729: "我不知道为什么希尼姆试图让你卷入，但你应该主动接近他。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_why_85d551: "我不知道为什么人们不能自己少量腌制波利，而是邮寄它们……"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_why_e26ab2: "我不知道为什么这么多船最终会 specifically 到艾尔贝塔，但为了那个，旅行变得容易多了。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_like_fairies_5ccaec: "我不喜欢这里的精灵写关于米德加尔特的东西，我讨厌那些书被广泛传播。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_mean_brag_85ef99: "我不是在吹牛，但我曾经是一名历史学家，研究阿尔夫海姆大陆以及地理、生物和考古学。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_mean_brag_e21a81: "我不是在吹牛，但我自己也是一位杰出的知识分子，所以很多人追求我，哈哈。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_mind_having_8b5714: "我不介意在危险区域有人陪伴。"
  npc_override_ecl_fild01_quests_eclage_i_don_t_much_7b7a26: "我没有太多……"
  npc_override_ecl_fild01_quests_eclage_i_don_t_much_else_ae93bf: "我没有太多别的事可做，所以你想再听一遍吗？"
