  npc_override_ecl_fild01_quests_eclage_oh_ok_then_should_we_74b6e9: "哦好的，那我们应该尝试注入效果吗？这个过程不是我的专长，所以我有点紧张，但……哈哈哈……"
  npc_override_ecl_fild01_quests_eclage_oh_please_tell_him_i_5ee39e: "哦，请告诉他我说了这个。就像你信任我一样，^000099我信任你^000000。^000000"
  npc_override_ecl_fild01_quests_eclage_oh_really_come_think_i_e521cc: "哦真的吗？想起来了，我忘了把这个告诉乌哈里。"
  npc_override_ecl_fild01_quests_eclage_oh_really_give_me_minute_f5073d: "哦真的吗？给我一分钟。我把手头的事做完就回来。"
  npc_override_ecl_fild01_quests_eclage_oh_really_ok_you_get_4d4114: "哦~真的吗？好的，你出去。我要开始折磨守卫了。让我想想……好吧，我给他唱歌！"
  npc_override_ecl_fild01_quests_eclage_oh_really_why_you_lookin_8a286e: "哦，真的吗？你为什么在找我父亲？"
  npc_override_ecl_fild01_quests_eclage_oh_reason_i_m_frowning_b42aad: "哦，我皱眉的原因是这个头痛。"
  npc_override_ecl_fild01_quests_eclage_oh_right_744952: "哦……对。"
  npc_override_ecl_fild01_quests_eclage_oh_right_9191e9: "哦，是吗？"
  npc_override_ecl_fild01_quests_eclage_oh_right_chief_staff_63f377: "哦，对！参谋长！"
  npc_override_ecl_fild01_quests_eclage_oh_right_i_guess_what_dbba1f: "哦，是吗？我想他们说的是真的。很抱歉请你帮这个忙，但你能从他们那里获取这些信息吗？"
  npc_override_ecl_fild01_quests_eclage_oh_right_you_showed_some_09c65e: "哦对了。当我谈到维度裂缝碎片时，你表现出了一些兴趣。"
  npc_override_ecl_fild01_quests_eclage_oh_s_nothing_don_t_874dc7: "哦，没什么。别担心。我是偶然进入这座塔的，然后我迷路了。好吃好吃。"
  npc_override_ecl_fild01_quests_eclage_oh_s_right_i_used_ec3732: "哦对了，我以前有记日记的习惯！"
  npc_override_ecl_fild01_quests_eclage_oh_s_right_you_human_fd036f: "哦，对了。你是来自米德加德的人类旅行者，所以你比我更了解这个。"
  npc_override_ecl_fild01_quests_eclage_oh_s_too_bad_b03afa: "哦……太遗憾了……"
  npc_override_ecl_fild01_quests_eclage_oh_so_you_call_those_b8634c: "哦，所以你们把那些圆房子叫做雅伊。"
  npc_override_ecl_fild01_quests_eclage_oh_someone_referred_you_0cdde5: "哦~有人介绍你来的？是谁？你最好说清楚，否则我一定把你踢出去。"
