Body:

  npc_override_payon_in01_quests_payon_ah_no_i_t_1b406f: "啊，不，我不能……"
  npc_override_payon_in01_quests_payon_ah_wait_i_almost_forgot_0270aa: "啊，等等！我差点忘了。我年轻时是个相当受欢迎的女演员。我离开剧团时，我的演员朋友们给了我结婚礼物。我一直留着它来提醒我那珍贵的时光。"
  npc_override_payon_in01_quests_payon_all_started_when_my_pare_220a2c: "一切都始于我父母在我小时候去世。我很早就不得不为生计工作，过得很艰难。"
  npc_override_payon_in01_quests_payon_angel_wing_ae30a0: "1个天使之翼。"
  npc_override_payon_in01_quests_payon_arrrgggghh_4aff39: "啊啊啊啊啊！"
  npc_override_payon_in01_quests_payon_as_you_wish_d7c1e4: "如你所愿……"
  npc_override_payon_in01_quests_payon_did_you_gather_items_the_5ae225: "你收集到物品了吗？那么交给我。"
  npc_override_payon_in01_quests_payon_ear_muffs_my_family_s_68b0ed: "耳罩是我们家的特产，我们提供给拥有^FF33551个诅咒红宝石^000000、^3311AA1个耳机、^000000 ^3355FF 200根羽毛^000000和^DDDD005,000 Zeny^000000的客户。"
  npc_override_payon_in01_quests_payon_fang_garm_28c5d2: "5个加姆之牙。"
  npc_override_payon_in01_quests_payon_fine_here_s_your_helm_6897c1: "好吧，这是你的天使头盔。拿着。"
  npc_override_payon_in01_quests_payon_gasp_i_mean_really_i_434166: "*倒吸一口气* 我是说，真的，我需要^3355FF奥拉奥拉^000000来摆脱它们吗？人们说它在遥远的国家非常罕见。"
  npc_override_payon_in01_quests_payon_goodbye_adventurer_7e2d9b: "再见，冒险者～！"
  npc_override_payon_in01_quests_payon_helm_slot_dbff6b: "1个头盔（带插槽）。"
  npc_override_payon_in01_quests_payon_here_i_give_you_pre_f59dc2: "来，我给你这个预制的。"
  npc_override_payon_in01_quests_payon_hm_888f0f: "嗯。"
  npc_override_payon_in01_quests_payon_hm_ac624d: "……嗯。"
  npc_override_payon_in01_quests_payon_hm_alright_223c72: "嗯。好吧。"
  npc_override_payon_in01_quests_payon_hm_here_s_your_deviruchi_5d65be: "……嗯。这是你的小恶魔帽。请拿着。"
  npc_override_payon_in01_quests_payon_huh_so_you_already_know_a5d9bd: "嗯？所以你已经知道我擅长什么了，是吧？我想没有必要再保密了。告诉我你想要什么。"
  npc_override_payon_in01_quests_payon_huhuhuhuhu_e58811: "呼呼呼呼呼……"
  npc_override_payon_in01_quests_payon_huk_3c209c: "*哈*"
  npc_override_payon_in01_quests_payon_huk_huk_a9804a: "哈……哈……"
  npc_override_payon_in01_quests_payon_i_believe_we_4f917c: "我相信我们"
  npc_override_payon_in01_quests_payon_i_d_like_give_you_addbd5: "我想给你这个。"
  npc_override_payon_in01_quests_payon_i_finally_16944a: "我终于有了这个！"
  npc_override_payon_in01_quests_payon_i_gather_mushrooms_mount_d8c1bd: "我每天都在斐扬山上采蘑菇。时光飞逝，不知不觉就到了节日季节。我希望今年能为我的家人做衣服。"
  npc_override_payon_in01_quests_payon_i_ll_make_short_give_4a88a9: "我长话短说！把它给我，我就给你我的宝贝！所以我的想法怎么样？想交易吗？"
  npc_override_payon_in01_quests_payon_i_mean_any_cards_upgrade_87a74b: "我是说，你交给我用来制作东西的物品上的任何卡片或强化都会丢失。所以交给我的时候要小心。"
  npc_override_payon_in01_quests_payon_i_need_skirt_virgin_8690c5: "但为了那个，我需要^3355FF4个处女之裙^000000……"
  npc_override_payon_in01_quests_payon_i_t_take_any_more_624f23: "我再也受不了了！"
  npc_override_payon_in01_quests_payon_i_t_wait_3801fd: "我等不及了"
  npc_override_payon_in01_quests_payon_i_tried_everything_i_cou_88e625: "我尝试了所有我能做的。我哄它们，杀它们，但只带来片刻的安宁！我甚至试图烧掉这房子……！"
  npc_override_payon_in01_quests_payon_i_ve_worked_years_hopes_cfff7f: "我工作了10年，希望能买到我梦想中的房子，在那里我可以再次找到一些平静和舒适。最终我以为我有足够的Zeny买得起我自己的甜蜜家园。"
  npc_override_payon_in01_quests_payon_i_wish_i_could_make_689c78: "我希望我能为我的孙子孙女们在节日季节做一些衣服……"
  npc_override_payon_in01_quests_payon_if_i_could_afford_them_007f9c: "如果我能买得起5个，我就不用再为这些恶心的虫子烦恼了……"
  npc_override_payon_in01_quests_payon_if_s_okay_b41b24: "如果可以的话……"
  npc_override_payon_in01_quests_payon_if_you_plan_travel_colde_12de27: "如果你计划去寒冷地区旅行，我建议你带一些^3355FF耳罩^000000……"
  npc_override_payon_in01_quests_payon_is_is_this_67fbab: "是，是这个"
  npc_override_payon_in01_quests_payon_kakakakakaka_4d76eb: "咔咔咔咔咔！"
  npc_override_payon_in01_quests_payon_little_evil_horn_a4aefd: "600个小恶魔之角。"
  npc_override_payon_in01_quests_payon_meet_again_341d5e: "会再见的。"
  npc_override_payon_in01_quests_payon_menu_alright_884b4f: "好吧。:没门！"
  npc_override_payon_in01_quests_payon_menu_can_6acfa3: "你能给我做一个特殊物品吗？:嘿。"
  npc_override_payon_in01_quests_payon_menu_continue_131af2: "继续:取消"
  npc_override_payon_in01_quests_payon_menu_give_a266d5: "给他物品。:不给他物品。"
  npc_override_payon_in01_quests_payon_menu_helm_6d72a1: "天使头盔。:小恶魔帽。:我下次再来。"
  npc_override_payon_in01_quests_payon_menu_oh_2ed7c3: "哦是吗？听起来不错。:不了谢谢，夫人。"
  npc_override_payon_in01_quests_payon_menu_show_7170b1: "展示奥拉奥拉:给奥拉奥拉:取消"
  npc_override_payon_in01_quests_payon_menu_thank_bce409: "谢谢购买我们的产品。你不会后悔购买我们的耳罩的：满意度保证～"
  npc_override_payon_in01_quests_payon_msg_6eae3a: "..."
  npc_override_payon_in01_quests_payon_muhahahahah_10ca3c: "哈哈哈哈！！！"
  npc_override_payon_in01_quests_payon_my_family_produced_sold_869574: "我的家族多年来一直生产和销售特殊的冬季产品^3355FF耳罩^000000。我们刚搬到这里，但天气总是很暖和，所以我们几乎无法谋生。"
  npc_override_payon_in01_quests_payon_never_ending_fight_bugs_de6d95: "这场与虫子永无止境的战斗真的让我筋疲力尽。我放弃了。随你便吧，你们这些混蛋！"
  npc_override_payon_in01_quests_payon_now_even_my_eyes_gone_3d0b73: "现在连我的眼睛都疯了！！为什么这些虫子突然变得这么可爱？！不——！！！"
  npc_override_payon_in01_quests_payon_number_items_isn_t_right_0aabb1: "……物品数量不对。你最好再检查一下。"
  npc_override_payon_in01_quests_payon_number_items_right_you_b_6c3ee2: "……物品数量不对。你最好再检查一下。"
  npc_override_payon_in01_quests_payon_oh_dear_9aea7a: "哦天哪……"
  npc_override_payon_in01_quests_payon_oh_man_3a6ad5: "哦天哪……"
  npc_override_payon_in01_quests_payon_oh_thank_you_so_much_9d71a7: "哦！非常感谢你～现在我可以给凯蒂·卡蒂做衣服了～"
  npc_override_payon_in01_quests_payon_oh_you_give_me_your_9f2afd: "哦！你愿意给我你的^3355FF处女之裙^000000吗？我需要四个。求你了，我求求你。"
  npc_override_payon_in01_quests_payon_one_0136d3: "那个？！"
  npc_override_payon_in01_quests_payon_one_these_days_d110ff: "……总有一天。"
  npc_override_payon_in01_quests_payon_oooooohhhh_d0f5fd: "哦哦哦哦哦！！！"
  npc_override_payon_in01_quests_payon_ora_ora_0a6c2a: "奥拉奥拉！！"
  npc_override_payon_in01_quests_payon_ora_ora_91dffc: "奥拉奥拉！"
  npc_override_payon_in01_quests_payon_s_all_i_require_a6771e: "这就是我所需要的。"
  npc_override_payon_in01_quests_payon_s_fine_1eeb87: "没关系。"
  npc_override_payon_in01_quests_payon_sigh_how_i_get_skirt_b1cbf8: "*叹气* 我怎么才能得到^3355FF处女之裙^000000呢？我太虚弱了，即使在摇椅上翻身也让我筋疲力尽。*抽泣* 我只想让我孙子孙女们开心……"
  npc_override_payon_in01_quests_payon_sorry_i_out_control_plea_057b8d: "对不起，我刚才高兴得失控了。现在，我会如约给你我的宝贝。"
  npc_override_payon_in01_quests_payon_stupid_disgusting_dc5577: "愚蠢又恶心"
  npc_override_payon_in01_quests_payon_sweet_jesus_turns_out_s_b9ef91: "天哪！原来这里是盗虫的天堂！！！"
  npc_override_payon_in01_quests_payon_take_care_102bae: "保重。"
  npc_override_payon_in01_quests_payon_talon_griffon_0f8466: "40个狮鹫之爪。"
  npc_override_payon_in01_quests_payon_thank_you_making_old_wom_15033f: "谢谢你让一位老妇人如此开心……"
  npc_override_payon_in01_quests_payon_then_we_shall_meet_again_1b51ed: "那么我们下次再见。"
  npc_override_payon_in01_quests_payon_thief_bugs_b3086f: "盗虫！！"
  npc_override_payon_in01_quests_payon_this_is_1ae3d2: "这是……"
  npc_override_payon_in01_quests_payon_unfortunately_i_didn_t_e_fae168: "不幸的是，我没有足够的钱买下我看中的好房子。但后来，我找到了这所房子，比第一所更大更便宜。我想都没想就买了……"
  npc_override_payon_in01_quests_payon_use_c694ba: "使用这个"
  npc_override_payon_in01_quests_payon_wahhhhhh_i_i_909cb1: "哇啊啊啊！我，我……"
  npc_override_payon_in01_quests_payon_wait_just_so_you_know_520b40: "等等！先跟你说清楚，我不在乎你背包里的物品是否强化过，或者是否附有卡片。"
  npc_override_payon_in01_quests_payon_wait_second_right_now_yo_9f6e3a: "^3355FF等一下！现在，你携带的物品太多了。请把一些东西放进卡普拉仓库后再回来。^000000"
  npc_override_payon_in01_quests_payon_what_dc8aff: "……什么事？"
  npc_override_payon_in01_quests_payon_what_if_i_t_get_88ff4e: "如果我不能摆脱所有这些盗虫怎么办？我甚至可能爱上它们……*哈*"
  npc_override_payon_in01_quests_payon_when_you_wear_over_your_b28699: "当你把它戴在嘴上并开始呼吸时，它会在进入肺部之前过滤掉垃圾。"
  npc_override_payon_in01_quests_payon_you_don_t_enough_money_3d123a: "你没有足够的钱或物品。不幸的是，我们不能打折。请理解我们也要谋生……"
  npc_override_payon_in01_quests_payon_you_little_stinky_filthy_6ab016: "你们这些臭烘烘的肮脏混蛋！"
  npc_override_payon_in01_quests_payon_you_pay_c62767: "你们会付出代价的！！！"
  npc_override_payon_in01_quests_payon_young_traveler_please_he_352339: "年轻的旅行者，请帮帮我。当你找到一些^3355FF处女之裙^000000时，请把它们带给我。我真的很感激……"
  npc_override_payon_in01_quivers_alright_e500e1: "没问题。"
  npc_override_payon_in01_quivers_arrow_revolution_374477: "箭矢革命！"
  npc_override_payon_in01_quivers_as_you_arrows_5dc175: "尽可能多地换取箭矢"
  npc_override_payon_in01_quivers_buy_as_many_quivers_146c3b: "买尽可能多的箭袋"
  npc_override_payon_in01_quivers_carrying_time_888ed2: "携带时间"
  npc_override_payon_in01_quivers_created_something_0ded92: "创造了某样东西"
  npc_override_payon_in01_quivers_destitute_226599: "^333333贫困^000000。"
  npc_override_payon_in01_quivers_develop_revolutionary_te_96953b: "开发这项革命性技术！"
  npc_override_payon_in01_quivers_excellent_80519c: "太棒了！"
  npc_override_payon_in01_quivers_greatest_inventor_our_ti_79334a: "^663300我们时代最伟大的发明家^000000。"
  npc_override_payon_in01_quivers_hey_you_re_carrying_b0525d: "嘿，你带着"
  npc_override_payon_in01_quivers_how_much_you_re_7a6aa0: "你携带了多少"
  npc_override_payon_in01_quivers_i_m_so_sorry_i_e717a5: "我很抱歉。我没有"
  npc_override_payon_in01_quivers_i_m_sorry_you_don_f2d94e: "对不起，但你没有足够的Zeny。我工作多年不能白送这些"
  npc_override_payon_in01_quivers_i_ve_studied_magic_quive_f88a4b: "我多年来一直在研究魔法和箭袋，日夜工作，终于弄明白了如何用魔法压缩箭矢！有了魔法箭袋，你可以携带更多箭矢，但重量更轻！"
  npc_override_payon_in01_quivers_idea_you_so_a758e2: "没想到你这么……"
  npc_override_payon_in01_quivers_just_keep_track_bc0488: "只要记住"
  npc_override_payon_in01_quivers_just_remember_you_won_t_45d084: "只要记住，^FF0000当你的携带重量达到最大重量限制的90%时，你将无法使用箭袋^000000。"
  npc_override_payon_in01_quivers_maximum_number_9b1804: "最大数量"
  npc_override_payon_in01_quivers_menu_arrows_29c41e: "箭矢: ^3131FF{0} ^000000"
  npc_override_payon_in01_quivers_menu_quiver_27c5a1: "箭袋:铁箭袋:钢箭袋:奥里哈鲁根箭袋:火箭袋:银箭袋:风箭袋:石箭袋:水晶箭袋:暗影箭袋:虚无箭袋:生锈箭袋"
  npc_override_payon_in01_quivers_menu_quivers_946abd: "箭袋: ^3131FF{0} ^000000"
  npc_override_payon_in01_quivers_menu_store_bdc705: "尽可能多地把箭矢存入箭袋:购买1个箭袋:取消"
  npc_override_payon_in01_quivers_menu_yes_9cbcad: "是:取消"
  npc_override_payon_in01_quivers_menu_zeny_20ddd8: "所需Zeny: ^3131FF{0} Zeny^000000"
  npc_override_payon_in01_quivers_my_name_jaax_162a98: "我的名字是贾克斯。"
  npc_override_payon_in01_quivers_number_093ba2: "数量"
  npc_override_payon_in01_quivers_purchasable_1a00a7: "可购买"
  npc_override_payon_in01_quivers_quiver_so_close_c657d7: "箭袋这么近？"
  npc_override_payon_in01_quivers_s_miracle_science_one_yo_33815e: "这是科学的奇迹！如果你带来至少{0}支箭矢和每个箭袋{1} Zeny，你自己就可以体验。"
  npc_override_payon_in01_quivers_say_i_am_perhaps_ad8f63: "说我可能是"
  npc_override_payon_in01_quivers_so_c7572d: "所以……"
  npc_override_payon_in01_quivers_so_total_weight_arrows_q_7a35d1: "所以箭矢和箭袋的总重量比单独携带箭矢要轻。"
  npc_override_payon_in01_quivers_there_you_go_b7b297: "给你！"
  npc_override_payon_in01_quivers_time_i_ve_69a1d6: "这次，我"
  npc_override_payon_in01_quivers_time_you_should_7ceeb8: "时间，你应该"
  npc_override_payon_in01_quivers_truly_extraordinary_i_ca_802f0e: "真正非凡的。我称它们为……^663300魔法箭袋^000000！！这将作为"
  npc_override_payon_in01_quivers_way_too_much_stuff_why_005288: "东西太多了。为什么不把它们存进卡普拉仓库？之后我们可以再谈，对吧？"
  npc_override_payon_in01_quivers_what_52f3d0: "什么……？"
  npc_override_payon_in01_quivers_when_glory_owning_cdf178: "当拥有"
  npc_override_payon_in01_quivers_without_ego_i_0c8ec2: "没有自负，我可以"
  npc_override_payon_in01_quivers_you_carry_maximum_arrows_fb4dce: "你可以在这个箭袋中携带最多{0}支箭矢。它是用我的秘密方法制作的，"
  npc_override_payon_in01_quivers_you_carrying_any_arrows_c6b0ff: "你带着任何箭矢吗？我会为你提供一个可以装{0}支你的{1}的箭袋，只需^FF3131{2} Zeny^000000。"
  npc_override_payon_in01_quivers_you_changed_your_mind_9f910c: "你改变主意了？"
  npc_override_payon_in01_quivers_you_currently_carrying_e00f70: "你目前携带的？"
  npc_override_payon_in01_quivers_you_don_t_even_6b1f31: "你连"
  npc_override_payon_in01_quivers_you_like_d698c6: "你想"
  npc_override_payon_in01_quivers_you_like_try_using_one_49a295: "你想试试我的一个箭袋吗？我毫不怀疑像你这样的人能欣赏我的天才！"
  npc_override_payon_in01_quivers_you_see_invention_foreve_a9067f: "你没看到这项发明可以永远改变携带箭矢的方式吗？！未来已至！"
  npc_override_payon_in01_quivers_zeny_0df6e1: "有{0} Zeny吗？"
