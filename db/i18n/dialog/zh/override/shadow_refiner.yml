Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_shadow_refiner_shadow_refiner_all_types_oridecon_eluni_b40a12: "所有类型的奥利哈钢和艾鲁尼姆都可以用来精炼暗影物品。每次尝试还将花费20,000 Zeny。"
  npc_override_shadow_refiner_shadow_refiner_choose_your_ore_start_re_ae3943: "选择你的矿石并开始精炼。"
  npc_override_shadow_refiner_shadow_refiner_hd_ore_only_used_higher_8ed5ff: "HD矿石只能用于精炼等级+7或更高的物品。"
  npc_override_shadow_refiner_shadow_refiner_hd_ores_used_gear_least_d18855: "HD矿石可以用于精炼等级至少+7的装备，只要你一直和我对话，就能防止损坏。"
  npc_override_shadow_refiner_shadow_refiner_heh_i_knew_d0c163: "嘿，我就知道！"
  npc_override_shadow_refiner_shadow_refiner_i_require_zeny_as_fee_7befc0: "每次精炼尝试我需要收取{0} Zeny作为费用。"
  npc_override_shadow_refiner_shadow_refiner_if_you_d_like_refine_068daa: "如果你想精炼暗影物品，请去找他。"
  npc_override_shadow_refiner_shadow_refiner_item_cannot_refined_8204e8: "这件物品无法精炼。"
  npc_override_shadow_refiner_shadow_refiner_menu_etc_0950ff: "其他:每次精炼成功HP +10。"
  npc_override_shadow_refiner_shadow_refiner_menu_weapon_7ee65e: "武器:每次精炼成功ATK、MATK +1。"
  npc_override_shadow_refiner_shadow_refiner_next_refinement_if_fails_d47efd: "下一次精炼如果失败，将降低精炼等级。你想精炼吗？"
  npc_override_shadow_refiner_shadow_refiner_now_basta_charge_refinem_59a8b4: "现在巴斯塔负责暗影物品的精炼。"
  npc_override_shadow_refiner_shadow_refiner_oh_odin_no_8cf7a5: "哦，奥丁啊，不！"
  npc_override_shadow_refiner_shadow_refiner_proceed_02ed4a: "继续"
  npc_override_shadow_refiner_shadow_refiner_safety_refine_level_shad_61d75d: "暗影装备的安全精炼等级是+4。"
  npc_override_shadow_refiner_shadow_refiner_shadow_equipment_may_des_60b1ce: "暗影装备在后续精炼中可能会被销毁。想要开始吗？"
  npc_override_shadow_refiner_shadow_refiner_shadow_equipment_refined_d16375: "暗影装备可以精炼到最高10级……"
  npc_override_shadow_refiner_shadow_refiner_there_s_nothing_here_473bb7: "这里什么都没有！"
  npc_override_shadow_refiner_shadow_refiner_well_then_here_goes_noth_704a83: "那么……豁出去了！"
  npc_override_shadow_refiner_shadow_refiner_when_shadow_item_refined_b563b9: "当暗影物品被精炼时，它会获得额外的加成，非常像普通物品。"
  npc_override_shadow_refiner_shadow_refiner_worked_worked_af4d9a: "成功了！成功了！"
  npc_override_shadow_refiner_shadow_refiner_you_enough_075dc2: "你的{0}不足。"
  npc_override_shadow_refiner_shadow_refiner_you_enough_zeny_b27ef2: "你的Zeny不足。"
  npc_override_shadow_refiner_shadow_refiner_you_ve_cancelled_refinin_9e69d2: "你取消了精炼。"
  npc_override_shadow_refiner_shadow_refiner_you_want_refine_shadow_i_d05026: "你想精炼暗影物品吗？选你喜欢的！"