Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_gl_church_royal_guard_according_reports_other_a5fc8a: "根据其他城市的报告，最后的踪迹可能存在于格拉斯海姆的一座修道院内。"
  npc_override_gl_church_royal_guard_according_research_docum_236a31: "但根据关于皇家守卫的研究文献，最正确的信念是'禁欲与忍耐'。"
  npc_override_gl_church_royal_guard_actually_other_also_need_062631: "实际上，其他3个素质也是拥有皇家守卫精神所必需的，朋友。"
  npc_override_gl_church_royal_guard_asceticism_endurance_you_f5c475: "禁欲与忍耐，年轻人。这与你回答的有些不同。"
  npc_override_gl_church_royal_guard_best_members_crusader_pa_83daad: "十字军和圣骑士中最优秀的成员可以获得皇家守卫的资格。"
  npc_override_gl_church_royal_guard_completed_1798b3: "已完成"
  npc_override_gl_church_royal_guard_congratulations_young_ro_b0dbd3: "恭喜你！年轻的皇家守卫。"
  npc_override_gl_church_royal_guard_contract_heinrich_so_i_k_08a3da: "这是与海因里希的契约，所以我必须遵守。你看起来忠诚又勇敢。"
  npc_override_gl_church_royal_guard_course_be6167: "当然。"
  npc_override_gl_church_royal_guard_did_you_get_3a13b6: "你拿到了吗？"
  npc_override_gl_church_royal_guard_did_you_get_all_them_71ca0d: "你全部拿到了吗？"
  npc_override_gl_church_royal_guard_did_you_need_something_3f8fa6: "你需要什么吗？"
  npc_override_gl_church_royal_guard_did_you_say_test_huhu_e3393f: "你说测试？呵呵！"
  npc_override_gl_church_royal_guard_don_t_forget_bring_burni_3a0d70: "别忘了带100个燃烧之心来。"
  npc_override_gl_church_royal_guard_don_t_forget_bring_burni_56f859: "别忘了带100个燃烧之心来。"
  npc_override_gl_church_royal_guard_fortunately_i_excavated_296925: "幸运的是，我已经挖掘了大部分宝藏并解读了它们。我只剩下最后一个踪迹需要找到。"
  npc_override_gl_church_royal_guard_friend_you_shown_your_in_afebea: "朋友，你已经表现出了对我工作的兴趣，你确定吗？还是你在开玩笑？"
  npc_override_gl_church_royal_guard_good_choice_441612: "好选择。"
  npc_override_gl_church_royal_guard_good_i_feel_truth_your_7828aa: "很好。我能从你心中感受到真诚。现在我可以告诉你更多故事了。"
  npc_override_gl_church_royal_guard_good_idea_a0936c: "好主意。"
  npc_override_gl_church_royal_guard_good_idea_better_find_so_66b292: "好主意，最好找些更有价值的东西。"
  npc_override_gl_church_royal_guard_good_idea_s_useless_work_cf9d24: "好主意，去那里探索是徒劳的。"
  npc_override_gl_church_royal_guard_good_you_might_wrong_ide_45551d: "很好。你可能对皇家守卫有错误的理解。那么，在你看来，成为皇家守卫的关键是什么？"
  npc_override_gl_church_royal_guard_he_doesn_t_want_accept_5094e3: "他不愿接受我的死亡，在世间游荡，继续寻找皇家守卫。"
  npc_override_gl_church_royal_guard_he_my_faithful_adjutant_b1ec27: "他曾是我忠诚的副官。数百年来他一直如此。"
  npc_override_gl_church_royal_guard_hehehe_don_t_worry_about_eb0075: "嘿嘿嘿，别担心我。"
  npc_override_gl_church_royal_guard_heinrich_agonized_look_h_6d8b81: "^000099海因里希脸上带着痛苦的表情。然后他看起来像睡着了。最后他不顾一切地说道。^000000"
  npc_override_gl_church_royal_guard_heinrich_charged_finding_a0af06: "海因里希被赋予了寻找合适人选成为皇家守卫的任务，盾牌就是契约。"
  npc_override_gl_church_royal_guard_heinrich_hesitated_broug_2fe706: "^000099海因里希犹豫了一下，从办公室旁边拿出一面旧盾牌。^000000"
  npc_override_gl_church_royal_guard_here_s_last_trace_royal_ad2df6: "^000099这是皇家守卫的最后踪迹。打开任务窗口查看位置。^000000"
  npc_override_gl_church_royal_guard_him_last_order_i_gave_03a703: "对他来说，这是我给他的最后一个命令。"
  npc_override_gl_church_royal_guard_hmm_documents_you_say_cc0b98: "嗯，你说文献……"
  npc_override_gl_church_royal_guard_how_he_lived_hundreds_0e25a5: "他是如何活了几百年的……"
  npc_override_gl_church_royal_guard_how_much_progress_you_ma_b42e73: "你取得了多少进展？"
  npc_override_gl_church_royal_guard_i_am_heinrich_6f613d: "我是海因里希。"
  npc_override_gl_church_royal_guard_i_brought_relic_0318e1: "我带来了一件遗物……"
  npc_override_gl_church_royal_guard_i_don_t_anything_say_c56deb: "我没什么可对你说的。找别人吧。"
  npc_override_gl_church_royal_guard_i_don_t_know_if_7fe45a: "我不知道这是否会有帮助。我会详细写一份说明。"
  npc_override_gl_church_royal_guard_i_feel_strong_power_arou_9d5c91: "我能感觉到这里有强大的力量。最好在周围探索一下。"
  npc_override_gl_church_royal_guard_i_haven_t_seen_you_bb486a: "我以前没见过你。"
  npc_override_gl_church_royal_guard_i_keep_ebee0d: "我可以留着吗？"
  npc_override_gl_church_royal_guard_i_ll_deciphering_cloth_n_c720c1: "我现在要解读这块布，所以我会很忙！"
  npc_override_gl_church_royal_guard_i_m_collecting_informati_f16954: "我正在收集关于施密茨国王消失踪迹的信息。"
  npc_override_gl_church_royal_guard_i_m_kidding_i_m_2b29a3: "我没开玩笑。我是认真的。"
  npc_override_gl_church_royal_guard_i_m_member_here_authorit_6fdb75: "我是这里的成员，有权查明你在此有何贵干。"
  npc_override_gl_church_royal_guard_i_m_planning_accept_you_6f53d5: "我打算接受你成为皇家守卫的一员，以延续他们失落的传统。你准备好了吗？"
  npc_override_gl_church_royal_guard_i_m_serious_e4acca: "我是认真的！"
  npc_override_gl_church_royal_guard_i_t_entirely_sure_58f201: "我不能完全确定。"
  npc_override_gl_church_royal_guard_i_t_really_talk_about_c5c770: "我不能随便向任何人谈论皇家守卫的事情。"
  npc_override_gl_church_royal_guard_i_want_believe_you_aad4ed: "但是！！我想相信你……"
  npc_override_gl_church_royal_guard_i_worried_about_past_roy_f169fb: "我担心过去的皇家守卫可能未能将他们的历史传承下来。"
  npc_override_gl_church_royal_guard_if_so_i_proceed_making_157108: "如果是这样，我将继续把你培养成皇家守卫。"
  npc_override_gl_church_royal_guard_if_so_i_test_you_288b99: "如果是这样，我会测试你，看看你的禁欲与忍耐。"
  npc_override_gl_church_royal_guard_if_you_bring_them_i_cd4b88: "如果你把它们带来，我可以告诉你更多故事。这意味着你向我展示了你的忍耐力。"
  npc_override_gl_church_royal_guard_if_you_don_t_business_01b31d: "如果你没有正事找我，就继续走吧，我的朋友。"
  npc_override_gl_church_royal_guard_if_you_really_want_i_b8b2ed: "如果你真的想，我会自我介绍。"
  npc_override_gl_church_royal_guard_if_you_say_like_i_527a09: "如果你这么说，我别无选择了。"
  npc_override_gl_church_royal_guard_if_you_t_trust_me_a23385: "如果你不信任我，就测试我吧，朋友。"
  npc_override_gl_church_royal_guard_if_you_tell_me_your_81d629: "如果你告诉我你的身份，我会道歉。"
  npc_override_gl_church_royal_guard_if_you_want_hear_more_2a5ee5: "如果你想听更多故事，你必须向我展示你相似的态度。"
  npc_override_gl_church_royal_guard_if_you_want_see_letters_70110b: "^000099如果你想看信件，请查看任务窗口。^000000"
  npc_override_gl_church_royal_guard_just_forget_let_your_min_f8da80: "忘了它吧，让你的心思去做更有价值的事情。"
  npc_override_gl_church_royal_guard_lighten_your_body_first_f3e8d8: "- 先让你的身体轻松一下 -"
  npc_override_gl_church_royal_guard_long_ago_king_schmidtz_g_3bcdfb: "很久以前，施密茨国王授予带回100个神圣印记的勇敢士兵一个称号。"
  npc_override_gl_church_royal_guard_look_your_body_before_88ad00: "先看看你的身体！"
  npc_override_gl_church_royal_guard_maybe_his_body_just_cast_ffc184: "也许他的身体只是一个躯壳。他找到了一种从一具身体转移到另一具身体的方法来维持生命。"
  npc_override_gl_church_royal_guard_maybe_my_feeling_moved_a_295064: "^000099也许我的感情已经转移到了另一具身体上。^000000"
  npc_override_gl_church_royal_guard_maybe_you_right_accordin_fcdd47: "也许你是对的，但根据我们初步鉴定时的判断，我们可以确定它没有被使用过。"
  npc_override_gl_church_royal_guard_menu_decision_0c6d44: "决断与勇气:冷静的判断:敏锐的智慧:仁慈的精神"
  npc_override_gl_church_royal_guard_menu_great_06c6d9: "很好。:还没。"
  npc_override_gl_church_royal_guard_menu_i_e75efd: "我想了解更多。:别说了。"
  npc_override_gl_church_royal_guard_menu_interesting_bc9051: "有意思。我能去那里吗？:看起来很危险。"
  npc_override_gl_church_royal_guard_menu_just_7233c7: "只是随便看看！:这是我的办公室！:我是谁？你是谁？"
  npc_override_gl_church_royal_guard_menu_not_30dc84: "不完全是，你是谁？:对不起，我不会伤害你的感情。"
  npc_override_gl_church_royal_guard_menu_royal_2bbc8f: "皇家守卫:符文骑士:术士"
  npc_override_gl_church_royal_guard_menu_sure_d94afe: "当然，没问题:还没"
  npc_override_gl_church_royal_guard_menu_that_cfce23: "那是个不公平的要求。:我会试试。"
  npc_override_gl_church_royal_guard_most_archaeologists_eage_7c9240: "大多数考古学家都渴望获得宝藏。我在寻找^000099皇家守卫^000000及其属于施密茨血脉的后代的踪迹。"
  npc_override_gl_church_royal_guard_most_people_just_ignore_2da7c1: "大多数人只是无视我或放弃任务。"
  npc_override_gl_church_royal_guard_msg_61ce5a: "[{0}]"
  npc_override_gl_church_royal_guard_msg_6eae3a: "……"
  npc_override_gl_church_royal_guard_msg_ec0ca0: "1~24"
  npc_override_gl_church_royal_guard_msg_fe0982: "1~5"
  npc_override_gl_church_royal_guard_my_relic_d0d391: "我的遗物？"
  npc_override_gl_church_royal_guard_mysterious_power_t_appea_2308a4: "那股神秘的力量……再也无法出现在世界上了。多么令人失望~！"
  npc_override_gl_church_royal_guard_no_s_correct_one_i_5e1799: "不，这不是我想要的正确那个。"
  npc_override_gl_church_royal_guard_now_he_doesn_t_need_3c5c89: "现在他不需要再这样做了，但他仍将作为一个无法忘记国王最后命令的傻瓜而留存。"
  npc_override_gl_church_royal_guard_now_i_t_tell_you_cffd83: "现在我不能告诉你为什么踪迹会在那里。"
  npc_override_gl_church_royal_guard_now_s_time_keep_promise_dbf573: "现在，是时候履行与海因里希的承诺了。这取决于你。"
  npc_override_gl_church_royal_guard_oh_you_so_young_keep_6d10a0: "哦，你这么年轻。继续努力吧。"
  npc_override_gl_church_royal_guard_ok_let_s_way_actually_0f29b2: "好吧，我们这样做吧。实际上收集100个神圣印记太难了，只需通过收集100个燃烧之心来展示你的雄心。"
  npc_override_gl_church_royal_guard_ok_now_611302: "好~~现在。"
  npc_override_gl_church_royal_guard_ok_tell_me_more_b78148: "好的，告诉我更多。"
  npc_override_gl_church_royal_guard_only_those_who_qualifica_c759e0: "只有具备资格的人才能听到皇家守卫的历史。"
  npc_override_gl_church_royal_guard_our_staff_already_left_f_5fb8f5: "我们的工作人员已经出发去寻找最后的踪迹了，所以不要太拼命。"
  npc_override_gl_church_royal_guard_our_staff_excavated_they_a728cc: "我们的工作人员挖掘了它。他们推测施密茨国王使用过它。但实际上他并没有用过。"
  npc_override_gl_church_royal_guard_perhaps_heinrich_had_wro_525a97: "也许海因里希对你有错误的印象。"
  npc_override_gl_church_royal_guard_please_try_again_42c365: "- 请再试一次。 -"
  npc_override_gl_church_royal_guard_please_unequip_your_ridi_e3bc7f: " 请卸下你的骑乘宠物再试一次！"
  npc_override_gl_church_royal_guard_really_e7da47: "真的吗？"
  npc_override_gl_church_royal_guard_rest_traces_f0c7f9: "其余的踪迹？"
  npc_override_gl_church_royal_guard_royal_guard_c7796e: "皇家守卫？"
  npc_override_gl_church_royal_guard_royal_guard_carved_mark_5ffcfb: "皇家守卫在他们的衣服上刻上施密茨国王的印记。这一习俗的踪迹是最后的线索。"
  npc_override_gl_church_royal_guard_s_enough_don_t_make_db8098: "够了。不要再犯这个错误了。"
  npc_override_gl_church_royal_guard_s_like_disappeared_king_e8cada: "就像它随着国王一起消失了一样。"
  npc_override_gl_church_royal_guard_s_old_treasure_so_someho_cbb55e: "但这是旧宝藏，所以它总会有用的。我可能知道如何使用它。"
  npc_override_gl_church_royal_guard_s_simple_story_tell_pers_d6aecb: "这不是一个简单的故事，不适合告诉你这种人。回去吧。"
  npc_override_gl_church_royal_guard_s_why_i_m_concentrating_778306: "这就是为什么我专注于复兴他们的职业。"
  npc_override_gl_church_royal_guard_schmidzt_s_trace_treasur_cdee36: "施密茨的踪迹？是宝藏吗？"
  npc_override_gl_church_royal_guard_set_item_adjust_royal_gu_b5e350: "调整皇家守卫的套装物品"
  npc_override_gl_church_royal_guard_set_item_adjust_rune_kni_0947b8: "调整符文骑士的套装物品"
  npc_override_gl_church_royal_guard_set_item_adjust_sorcerer_70685f: "调整术士的套装物品"
  npc_override_gl_church_royal_guard_shield_heinrich_our_cont_ac1745: "来自海因里希的盾牌是我们在我死前的契约。"
  npc_override_gl_church_royal_guard_so_reason_finding_their_2cff9a: "所以寻找他们踪迹的原因是……"
  npc_override_gl_church_royal_guard_so_what_now_i_leave_3b5219: "那现在呢？我可以离开吗？"
  npc_override_gl_church_royal_guard_someday_might_useful_you_ff20fe: "总有一天它可能对你有用。"
  npc_override_gl_church_royal_guard_sorry_i_had_sure_i_3ad806: "对不起。我必须确定。我不知道你来自王宫。"
  npc_override_gl_church_royal_guard_sorry_i_t_send_you_72b4cc: "抱歉，但我现在不能送你。"
  npc_override_gl_church_royal_guard_sounds_interesting_doesn_fddc89: "听起来很有趣，不是吗？我不能真的说，但他们的历史和文件受到严格的安全保护。"
  npc_override_gl_church_royal_guard_still_sentimentally_atta_bc00b5: "仍然对你自己恋恋不舍吗？"
  npc_override_gl_church_royal_guard_sure_s_wasn_t_used_e2bf56: "确定不是国王用过的吗？"
  npc_override_gl_church_royal_guard_symbol_honor_continue_gr_74b4b0: "成为荣誉的象征，延续你新名字的伟大传统。"
  npc_override_gl_church_royal_guard_t_you_tell_me_b0de64: "你不能告诉我吗？"
  npc_override_gl_church_royal_guard_test_66a792: "测试？"
  npc_override_gl_church_royal_guard_thank_you_so_much_6369bf: "非常感谢。"
  npc_override_gl_church_royal_guard_thanks_your_effort_i_fin_96a05f: "多亏你的努力，我才能找到最后的线索。太棒了~！"
  npc_override_gl_church_royal_guard_thanks_your_help_i_finis_f126db: "多亏你的帮助，我才能完成了挖掘工作。非常感谢。"
  npc_override_gl_church_royal_guard_their_history_belief_vis_ffab55: "他们的历史、信仰、愿景和战斗技能似乎都没有任何文件保存下来就消失了。"
  npc_override_gl_church_royal_guard_there_still_documents_23c9d6: "还有文献留存吗？"
  npc_override_gl_church_royal_guard_there_trace_someone_alre_c3f37e: "这里有某人已经挖掘过的痕迹。"
  npc_override_gl_church_royal_guard_they_agents_divine_order_10a475: "他们是神圣秩序的代理人，以迅速的惩罚进行审判。"
  npc_override_gl_church_royal_guard_too_bad_here_one_more_855385: "太糟了。这里有又一个被海因里希欺骗的朋友。"
  npc_override_gl_church_royal_guard_too_dangerous_me_there_s_03e89f: "但对我来说那里太危险了，所以我几乎放弃了。"
  npc_override_gl_church_royal_guard_uh_what_am_i_doing_43107d: "嗯？我在做什么？我是来办事的……"
  npc_override_gl_church_royal_guard_uhh_bfa913: "嗯？"
  npc_override_gl_church_royal_guard_umm_maybe_heinrich_had_w_749363: "嗯，也许海因里希判断错了。"
  npc_override_gl_church_royal_guard_unfortunately_after_king_4419df: "不幸的是，施密茨国王消失后，皇家守卫的踪迹也消失了。"
  npc_override_gl_church_royal_guard_wait_while_i_arrange_stu_abbda9: "等一下，让我整理一下你带来的东西。"
  npc_override_gl_church_royal_guard_we_still_many_opinions_a_f45ce5: "关于他们如何存活下来，我们仍然有很多不同的看法。肯定有人相信他们的历史不是虚假的。"
  npc_override_gl_church_royal_guard_what_did_you_lose_shield_8bddb3: "什么？你把盾牌弄丢了？你背上那个是什么？"
  npc_override_gl_church_royal_guard_what_i_hear_story_420315: "我能做些什么来听那个故事？"
  npc_override_gl_church_royal_guard_what_i_saying_mumble_rem_903142: "我在说什么……（嘟囔）剩余的部分在格拉斯海姆大约13……的地方……"
  npc_override_gl_church_royal_guard_what_s_meaning_shield_06ebaf: "这面盾牌是什么意思？"
  npc_override_gl_church_royal_guard_while_investigating_topo_5e07e8: "在调查过程中，地形断裂了。最好暂时去其他地方挖掘。"
  npc_override_gl_church_royal_guard_who_you_c71f44: "你是谁？"
  npc_override_gl_church_royal_guard_you_cannot_inherit_royal_94e85e: "你无法继承皇家守卫！"
