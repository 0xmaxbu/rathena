Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_gl_church_royal_guard_according_reports_other_a5fc8a: "According to reports from other cities the last trace possibly exists in a monastery inside of Glass Heim."
  npc_override_gl_church_royal_guard_according_research_docum_236a31: "But according to research documents about the Royal Guard, the best belief is 'asceticism and endurance'."
  npc_override_gl_church_royal_guard_actually_other_also_need_062631: "Actually, the other 3 are also needed to have the Royal Guard spirit, friend."
  npc_override_gl_church_royal_guard_asceticism_endurance_you_f5c475: "Asceticism and Endurance young one. It is a bit different from what you answered."
  npc_override_gl_church_royal_guard_best_members_crusader_pa_83daad: "The best members of the Crusader and Paladin classes can gain the qualification of the Royal Guard."
  npc_override_gl_church_royal_guard_completed_1798b3: "Completed"
  npc_override_gl_church_royal_guard_congratulations_young_ro_b0dbd3: "Congratulations! Young Royal Guard."
  npc_override_gl_church_royal_guard_contract_heinrich_so_i_k_08a3da: "This is a contract with Heinrich so I have to keep it. You look faithful and brave."
  npc_override_gl_church_royal_guard_course_be6167: "Of course."
  npc_override_gl_church_royal_guard_did_you_get_3a13b6: "Did you get it?"
  npc_override_gl_church_royal_guard_did_you_get_all_them_71ca0d: "Did you get all of them?"
  npc_override_gl_church_royal_guard_did_you_need_something_3f8fa6: "Did you need something?"
  npc_override_gl_church_royal_guard_did_you_say_test_huhu_e3393f: "Did you say the test? Huhu!"
  npc_override_gl_church_royal_guard_don_t_forget_bring_burni_3a0d70: "Don't forget to bring 100 Burning Heart."
  npc_override_gl_church_royal_guard_don_t_forget_bring_burni_56f859: "Don't forget to bring the 100 Burning Hearts."
  npc_override_gl_church_royal_guard_fortunately_i_excavated_296925: "Fortunately, I excavated most of the treasures and interpreted them. I just have one trace left to find."
  npc_override_gl_church_royal_guard_friend_you_shown_your_in_afebea: "Friend, you have shown your interest about my job, are you sure? Or are you kidding me?"
  npc_override_gl_church_royal_guard_good_choice_441612: "Good choice."
  npc_override_gl_church_royal_guard_good_i_feel_truth_your_7828aa: "Good. I can feel truth from your heart. Now I can tell you more of the story."
  npc_override_gl_church_royal_guard_good_idea_a0936c: "Good idea."
  npc_override_gl_church_royal_guard_good_idea_better_find_so_66b292: "Good idea, it would better to find something more worthy."
  npc_override_gl_church_royal_guard_good_idea_s_useless_work_cf9d24: "Good idea, that's useless work to explore there."
  npc_override_gl_church_royal_guard_good_you_might_wrong_ide_45551d: "Good. You might have the wrong idea about what a Royal Guard is. So, in your opinion, what do you think is the key to being a Royal Guard?"
  npc_override_gl_church_royal_guard_he_doesn_t_want_accept_5094e3: "He doesn't want to accept my death and wanders the world, continuing to find Royal Guards."
  npc_override_gl_church_royal_guard_he_my_faithful_adjutant_b1ec27: "He was my faithful adjutant. And he has continued to be so for hundreds of years."
  npc_override_gl_church_royal_guard_hehehe_don_t_worry_about_eb0075: "Hehehe, don't worry about me."
  npc_override_gl_church_royal_guard_heinrich_agonized_look_h_6d8b81: "^000099Heinrich has an agonized look on his face. Then he looked like he fell asleep. Finally he says with reckless abandon.^000000"
  npc_override_gl_church_royal_guard_heinrich_charged_finding_a0af06: "Heinrich was charged with finding the proper people to become Royal Guards, the shield was to be the contract."
  npc_override_gl_church_royal_guard_heinrich_hesitated_broug_2fe706: "^000099Heinrich hesitated and brought an old shield from the side of the office.^000000"
  npc_override_gl_church_royal_guard_here_s_last_trace_royal_ad2df6: "^000099Here's the last trace of the Royal Guard. Open the quest window and check the position.^000000"
  npc_override_gl_church_royal_guard_him_last_order_i_gave_03a703: "To him, this was the last order that I gave to him."
  npc_override_gl_church_royal_guard_hmm_documents_you_say_cc0b98: "Hmm, documents you say..."
  npc_override_gl_church_royal_guard_how_he_lived_hundreds_0e25a5: "How has he lived for hundreds..."
  npc_override_gl_church_royal_guard_how_much_progress_you_ma_b42e73: "How much progress have you made?"
  npc_override_gl_church_royal_guard_i_am_heinrich_6f613d: "I am Heinrich."
  npc_override_gl_church_royal_guard_i_brought_relic_0318e1: "I brought a relic..."
  npc_override_gl_church_royal_guard_i_don_t_anything_say_c56deb: "I don't have anything to say to you. Find another person."
  npc_override_gl_church_royal_guard_i_don_t_know_if_7fe45a: "I don't know if it will be helpful or not. I will write an explanation in detail."
  npc_override_gl_church_royal_guard_i_feel_strong_power_arou_9d5c91: "I can feel strong power around here. It would be better to explore around here."
  npc_override_gl_church_royal_guard_i_haven_t_seen_you_bb486a: "I haven't seen you before."
  npc_override_gl_church_royal_guard_i_keep_ebee0d: "Can I keep it?"
  npc_override_gl_church_royal_guard_i_ll_deciphering_cloth_n_c720c1: "I'll be deciphering the cloth for now so I will be very busy!"
  npc_override_gl_church_royal_guard_i_m_collecting_informati_f16954: "I'm collecting information about King Schmidtz's trace which has disappeared."
  npc_override_gl_church_royal_guard_i_m_kidding_i_m_2b29a3: "I'm not kidding. I'm serious."
  npc_override_gl_church_royal_guard_i_m_member_here_authorit_6fdb75: "I'm a member here and have the authority to find out what your business is here."
  npc_override_gl_church_royal_guard_i_m_planning_accept_you_6f53d5: "I'm planning to accept you as a member of the Royal Guard to continue their lost traditions. Are you ready to do it?"
  npc_override_gl_church_royal_guard_i_m_serious_e4acca: "I'm serious!"
  npc_override_gl_church_royal_guard_i_t_entirely_sure_58f201: "I can't be entirely sure."
  npc_override_gl_church_royal_guard_i_t_really_talk_about_c5c770: "I can't really talk about the Royal Guard to just anyone who asks about them."
  npc_override_gl_church_royal_guard_i_want_believe_you_aad4ed: "BUT!! I want to believe you..."
  npc_override_gl_church_royal_guard_i_worried_about_past_roy_f169fb: "I was worried about past Royal Guards that might not have been able to pass down their history."
  npc_override_gl_church_royal_guard_if_so_i_proceed_making_157108: "If so, I will proceed to making you a Royal Guard."
  npc_override_gl_church_royal_guard_if_so_i_test_you_288b99: "If so I will test you to see your asceticism and endurance."
  npc_override_gl_church_royal_guard_if_you_bring_them_i_cd4b88: "If you bring them I can tell you more of the story. That means you show your endurance to me."
  npc_override_gl_church_royal_guard_if_you_don_t_business_01b31d: "If you don't have business with me, just keep going my friend."
  npc_override_gl_church_royal_guard_if_you_really_want_i_b8b2ed: "If you really want, I will introduce myself."
  npc_override_gl_church_royal_guard_if_you_say_like_i_527a09: "If you say it like that I don't have any more options."
  npc_override_gl_church_royal_guard_if_you_t_trust_me_a23385: "If you can't trust me, test me pal."
  npc_override_gl_church_royal_guard_if_you_tell_me_your_81d629: "If you tell me your identity, I will apologize."
  npc_override_gl_church_royal_guard_if_you_want_hear_more_2a5ee5: "If you want to hear more story, you have to show me your similar attitude."
  npc_override_gl_church_royal_guard_if_you_want_see_letters_70110b: "^000099If you want to see the letters, please check the quest window.^000000"
  npc_override_gl_church_royal_guard_just_forget_let_your_min_f8da80: "Just forget it and let your mind do more worthy things."
  npc_override_gl_church_royal_guard_lighten_your_body_first_f3e8d8: "- Lighten your body first -"
  npc_override_gl_church_royal_guard_long_ago_king_schmidtz_g_3bcdfb: "Long ago King Schmidtz gave a title to a brave soldier who come back with 100 Sacred Marks."
  npc_override_gl_church_royal_guard_look_your_body_before_88ad00: "Look at your body before that!"
  npc_override_gl_church_royal_guard_maybe_his_body_just_cast_ffc184: "Maybe his body is just a cast. He found a way to move from body to body in order to stay alive."
  npc_override_gl_church_royal_guard_maybe_my_feeling_moved_a_295064: "^000099Maybe my feeling has moved to another body.^000000"
  npc_override_gl_church_royal_guard_maybe_you_right_accordin_fcdd47: "Maybe you are right but, according to when we did the initial identification we can be sure it wasn't used."
  npc_override_gl_church_royal_guard_menu_decision_0c6d44: "Decision and Bravery:Calm Judgment:Sharp wisdom:Benevolent spirit"
  npc_override_gl_church_royal_guard_menu_great_06c6d9: "Great.:Not yet."
  npc_override_gl_church_royal_guard_menu_i_e75efd: "I want to know more.:Stop talking."
  npc_override_gl_church_royal_guard_menu_interesting_bc9051: "Interesting. Can I go there?:Seems really dangerous."
  npc_override_gl_church_royal_guard_menu_just_7233c7: "Just looking around!:This is my office!:Who am I? Who are you?"
  npc_override_gl_church_royal_guard_menu_not_30dc84: "Not really, who are you?:Sorry, I won't hurt your feelings."
  npc_override_gl_church_royal_guard_menu_royal_2bbc8f: "Royal Guard:Rune Knight:Sorcerer"
  npc_override_gl_church_royal_guard_menu_sure_d94afe: "Sure, of course:Not yet"
  npc_override_gl_church_royal_guard_menu_that_cfce23: "That's an unfair demand.:I will try."
  npc_override_gl_church_royal_guard_most_archaeologists_eage_7c9240: "Most archaeologists are eager to get treasure. I'm looking for traces of the ^000099Royal Guard^000000 and their sons who belong to the Schmidtz line."
  npc_override_gl_church_royal_guard_most_people_just_ignore_2da7c1: "Most people just ignore me or give up the mission."
  npc_override_gl_church_royal_guard_msg_61ce5a: "[{0}]"
  npc_override_gl_church_royal_guard_msg_6eae3a: "..."
  npc_override_gl_church_royal_guard_msg_ec0ca0: "1~24"
  npc_override_gl_church_royal_guard_msg_fe0982: "1~5"
  npc_override_gl_church_royal_guard_my_relic_d0d391: "My relic?"
  npc_override_gl_church_royal_guard_mysterious_power_t_appea_2308a4: "The mysterious power... can't appear anymore in the world. How disappointing is it~!"
  npc_override_gl_church_royal_guard_no_s_correct_one_i_5e1799: "No, it's not the correct one that I want."
  npc_override_gl_church_royal_guard_now_he_doesn_t_need_3c5c89: "Now he doesn't need to do it anymore, but will remain as a fool whom can't forget his King's final order."
  npc_override_gl_church_royal_guard_now_i_t_tell_you_cffd83: "Now I can't tell you why the trace is there."
  npc_override_gl_church_royal_guard_now_s_time_keep_promise_dbf573: "Now, it's time to keep the promise with Heinrich. It's up to you."
  npc_override_gl_church_royal_guard_oh_you_so_young_keep_6d10a0: "Oh you are so young. Keep working hard."
  npc_override_gl_church_royal_guard_ok_let_s_way_actually_0f29b2: "Ok, let's do it this way. Actually it's too difficult to collect 100 Sacred Marks, just show your ambition by collecting 100 Burning Hearts."
  npc_override_gl_church_royal_guard_ok_now_611302: "Ok~~ now."
  npc_override_gl_church_royal_guard_ok_tell_me_more_b78148: "Ok tell me more."
  npc_override_gl_church_royal_guard_only_those_who_qualifica_c759e0: "Only those who have qualification can hear the Royal Guard history."
  npc_override_gl_church_royal_guard_our_staff_already_left_f_5fb8f5: "Our staff has already left to find the last trace, so don't work too hard."
  npc_override_gl_church_royal_guard_our_staff_excavated_they_a728cc: "Our staff excavated it. They assumed that King Schmidtz used it. But it wasn't used by him."
  npc_override_gl_church_royal_guard_perhaps_heinrich_had_wro_525a97: "Perhaps Heinrich had the wrong image of you."
  npc_override_gl_church_royal_guard_please_try_again_42c365: "- and please try again. -"
  npc_override_gl_church_royal_guard_please_unequip_your_ridi_e3bc7f: " Please unequip your riding pet and try again!"
  npc_override_gl_church_royal_guard_really_e7da47: "Really?"
  npc_override_gl_church_royal_guard_rest_traces_f0c7f9: "The rest of the traces?"
  npc_override_gl_church_royal_guard_royal_guard_c7796e: "Royal Guard?"
  npc_override_gl_church_royal_guard_royal_guard_carved_mark_5ffcfb: "The Royal Guard carved the mark of King Schmidtz on their clothes. The trace of this custom is the last clue."
  npc_override_gl_church_royal_guard_s_enough_don_t_make_db8098: "That's enough. Don't make this mistake again."
  npc_override_gl_church_royal_guard_s_like_disappeared_king_e8cada: "It's like it disappeared with the king."
  npc_override_gl_church_royal_guard_s_old_treasure_so_someho_cbb55e: "But it's an old treasure so, somehow it will be useful. I might know how to use it."
  npc_override_gl_church_royal_guard_s_simple_story_tell_pers_d6aecb: "It's not a simple story to tell a person like you. Go back."
  npc_override_gl_church_royal_guard_s_why_i_m_concentrating_778306: "That's why I'm concentrating to revive their job."
  npc_override_gl_church_royal_guard_schmidzt_s_trace_treasur_cdee36: "Schmidzt's trace? Is it a treasure?"
  npc_override_gl_church_royal_guard_set_item_adjust_royal_gu_b5e350: "Set item to adjust the Royal Guard"
  npc_override_gl_church_royal_guard_set_item_adjust_rune_kni_0947b8: "Set item to adjust the Rune Knight"
  npc_override_gl_church_royal_guard_set_item_adjust_sorcerer_70685f: "Set item to adjust the Sorcerer"
  npc_override_gl_church_royal_guard_shield_heinrich_our_cont_ac1745: "The shield from Heinrich is our contract before I died."
  npc_override_gl_church_royal_guard_so_reason_finding_their_2cff9a: "So the reason of finding their traces..."
  npc_override_gl_church_royal_guard_so_what_now_i_leave_3b5219: "So what now? Can I leave?"
  npc_override_gl_church_royal_guard_someday_might_useful_you_ff20fe: "Someday it might be useful to you."
  npc_override_gl_church_royal_guard_sorry_i_had_sure_i_3ad806: "Sorry. I had to be sure. I didn't know that you are from the royal palace."
  npc_override_gl_church_royal_guard_sorry_i_t_send_you_72b4cc: "Sorry but I can't send you now."
  npc_override_gl_church_royal_guard_sounds_interesting_doesn_fddc89: "Sounds interesting doesn't it? I can't really say but their history and files are under strict security."
  npc_override_gl_church_royal_guard_still_sentimentally_atta_bc00b5: "Are still sentimentally attached to yourself?"
  npc_override_gl_church_royal_guard_sure_s_wasn_t_used_e2bf56: "Sure it's wasn't used by the King?"
  npc_override_gl_church_royal_guard_symbol_honor_continue_gr_74b4b0: "Be a symbol of honor and continue the great tradition of your new name."
  npc_override_gl_church_royal_guard_t_you_tell_me_b0de64: "Can't you tell me?"
  npc_override_gl_church_royal_guard_test_66a792: "Test?"
  npc_override_gl_church_royal_guard_thank_you_so_much_6369bf: "Thank you so much."
  npc_override_gl_church_royal_guard_thanks_your_effort_i_fin_96a05f: "Thanks to your effort I can find the last clue. How amazing~!"
  npc_override_gl_church_royal_guard_thanks_your_help_i_finis_f126db: "Thanks to your help I can finish the excavation work. Thanks a lot."
  npc_override_gl_church_royal_guard_their_history_belief_vis_ffab55: "Their history, belief, vision and fighting skill seemingly disappeared without any of the documents being saved."
  npc_override_gl_church_royal_guard_there_still_documents_23c9d6: "Are there still documents?"
  npc_override_gl_church_royal_guard_there_trace_someone_alre_c3f37e: "There is a trace that someone has already dug here."
  npc_override_gl_church_royal_guard_they_agents_divine_order_10a475: "They are agents of the divine order and judge with swift punishment."
  npc_override_gl_church_royal_guard_too_bad_here_one_more_855385: "Too bad. Here is one more friend who has been cheated by Heinrich."
  npc_override_gl_church_royal_guard_too_dangerous_me_there_s_03e89f: "But it is too dangerous for me there so I almost gave up."
  npc_override_gl_church_royal_guard_uh_what_am_i_doing_43107d: "Uh? What am I doing? I came here for an errand..."
  npc_override_gl_church_royal_guard_uhh_bfa913: "Uhh?"
  npc_override_gl_church_royal_guard_umm_maybe_heinrich_had_w_749363: "Umm, maybe Heinrich had wrong judgement."
  npc_override_gl_church_royal_guard_unfortunately_after_king_4419df: "Unfortunately after King Schmidtz disappeared, traces of the Royal Guard disappeared."
  npc_override_gl_church_royal_guard_wait_while_i_arrange_stu_abbda9: "Wait while I arrange the stuff that you brought."
  npc_override_gl_church_royal_guard_we_still_many_opinions_a_f45ce5: "We still have many opinions about how they could have survived. Surely someone had to have believed that their history was not false."
  npc_override_gl_church_royal_guard_what_did_you_lose_shield_8bddb3: "What? Did you lose the shield? What is the one on your back?"
  npc_override_gl_church_royal_guard_what_i_hear_story_420315: "What can I do to hear that story?"
  npc_override_gl_church_royal_guard_what_i_saying_mumble_rem_903142: "What was I saying... (mumble) the remaining segment is in Glast Heim around 13......."
  npc_override_gl_church_royal_guard_what_s_meaning_shield_06ebaf: "What's the meaning of this shield?"
  npc_override_gl_church_royal_guard_while_investigating_topo_5e07e8: "While investigating, the topography breaks. It would be better to dig other places for a while."
  npc_override_gl_church_royal_guard_who_you_c71f44: "Who are you?"
  npc_override_gl_church_royal_guard_you_cannot_inherit_royal_94e85e: "You cannot inherit the Royal Guard!"
  npc_override_gl_church_royal_guard_you_don_t_look_like_1421c1: "You don't look like a Knight..."
  npc_override_gl_church_royal_guard_you_dragging_something_i_d726de: "You are dragging something. If you're riding something you better dismount it before proceeding."
  npc_override_gl_church_royal_guard_you_get_shield_heinrich_23747b: "^000099You get the shield from Heinrich. There are some letters carved on the inside of the shield.^000000 "
  npc_override_gl_church_royal_guard_you_impetuous_0d4612: "You are impetuous."
  npc_override_gl_church_royal_guard_you_kidding_1e30ee: "Are you kidding?"
  npc_override_gl_church_royal_guard_you_know_heinrich_e75c07: "Do you know Heinrich?"
  npc_override_gl_church_royal_guard_you_more_things_talk_me_4d5b6b: "Do you have more things to talk to me about?"
  npc_override_gl_church_royal_guard_you_only_set_nbumber_bet_7a0144: "You can only set a nbumber between 1 to 24."
  npc_override_gl_church_royal_guard_you_only_set_number_betw_c7cb39: "You can only set a number between 1 to 5."
  npc_override_gl_church_royal_guard_you_persistent_friend_7f6151: "You are persistent friend."
  npc_override_gl_church_royal_guard_you_re_curious_one_who_9bbae9: "You're a curious one. Who are you? What do you want?"
  npc_override_gl_church_royal_guard_you_seem_large_interest_996379: "You seem to have a large interest about this story but I can't tell you more."
  npc_override_gl_church_royal_guard_you_seem_lost_shield_go_18c2b7: "^000099You seem to have lost the shield. Go back to Heinrich and ask for help^000000."
  npc_override_gl_church_royal_guard_you_shouldn_t_treat_like_9a433e: "You shouldn't treat it like it's just some normal chore."
  npc_override_gl_church_royal_guard_you_so_persistent_a25d84: "You are so persistent."
  npc_override_gl_church_royal_guard_you_stranger_i_m_sure_ef9f7e: "You are a stranger and I'm not sure if you belong here."
  npc_override_gl_church_royal_guard_you_surprised_me_how_did_d26ffe: "You surprised me. How did you get it? So far no one could get it."
  npc_override_gl_church_royal_guard_you_too_stubborn_3b8280: "You are too stubborn."
  npc_override_gl_church_royal_guard_you_want_argue_me_you_9b7282: "Do you want to argue with me? Do you know who I am?"
  npc_override_gl_church_royal_guard_your_pack_too_heavy_bdff3a: "- Your pack is too heavy. -"
