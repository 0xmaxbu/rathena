Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@lhz_WolfchevLaboratory_aaaaaah_thank_you_so_muc_d3705c: "啊啊啊啊啊，{0}非常感谢你清除了我那些发狂的孩子们。不是什么大礼但我希望你不要拒绝，我不再需要这个了。"
  npc_override_1@lhz_WolfchevLaboratory_access_denial_been_deact_168100: "^FF0000访问拒绝已被解除。^000000"
  npc_override_1@lhz_WolfchevLaboratory_actually_funny_rumor_64c2b9: "其实，那并不是一个有趣的谣言。"
  npc_override_1@lhz_WolfchevLaboratory_actually_you_did_because_41bc93: "但实际上，你那么做是因为你孤独……你就是因为这个原因才专注于那件事的，对吧？"
  npc_override_1@lhz_WolfchevLaboratory_after_you_left_i_fixing_b2229f: "你离开后，我在修理一些系统部件。然后突然发生了奇怪的事情。"
  npc_override_1@lhz_WolfchevLaboratory_again_s_time_say_goodbye_ae69d3: "又……是时候说再见了。"
  npc_override_1@lhz_WolfchevLaboratory_ah_hey_man_ee5c72: "啊！嘿！伙计！"
  npc_override_1@lhz_WolfchevLaboratory_ah_i_am_absolutely_defea_1713da: "啊……我完全被打败了……"
  npc_override_1@lhz_WolfchevLaboratory_ah_i_send_you_out_c59790: "啊……我可以送你离开我的实验室。你想吗？"
  npc_override_1@lhz_WolfchevLaboratory_ah_if_emergency_system_a_f965f5: "啊！如果紧急系统被激活，只有队伍领袖应该控制一切。压力很大我明白。"
  npc_override_1@lhz_WolfchevLaboratory_ah_if_i_ever_dance_59beb9: "啊……如果我能……快乐地……跳舞和……唱歌……"
  npc_override_1@lhz_WolfchevLaboratory_ah_lady_may_heard_rumor_4f5676: "啊……女士可能没听说过这个谣言。"
  npc_override_1@lhz_WolfchevLaboratory_ahh_lady_shopping_slum_y_e42128: "啊……女士……在贫民窟购物！！……你是那种需要逛遍每家店的人吗？"
  npc_override_1@lhz_WolfchevLaboratory_ahh_lady_you_so_graceful_589845: "啊……女士，你即使只是走路也那么优雅……"
  npc_override_1@lhz_WolfchevLaboratory_ahh_secret_just_some_peo_1169cd: "啊！！这是一个只有某些人知道的秘密。我从雷根贝实验室听说的……一个叫……嗯……沃尔……的人"
  npc_override_1@lhz_WolfchevLaboratory_all_those_boss_creatures_56ccba: "你处理过的所有那些首领生物都开始自我再生了……"
  npc_override_1@lhz_WolfchevLaboratory_alright_i_marked_lan_ent_a3cef0: "好的！我已将局域网进入系统代码标记为"
  npc_override_1@lhz_WolfchevLaboratory_any_one_please_help_plea_6b2550: "有……人吗，请帮帮我……求你了……"
  npc_override_1@lhz_WolfchevLaboratory_any_warnings_f22501: "有什么警告吗？"
  npc_override_1@lhz_WolfchevLaboratory_anyway_research_got_fire_813dec: "总之！！那个研究员被实验室开除了。我想他肯定与这个谣言有关。"
  npc_override_1@lhz_WolfchevLaboratory_anyway_scientist_named_w_944105: "总之！！一个叫沃尔……什么的科学家突然被解雇了。而且他肯定与这个谣言有关，我想……"
  npc_override_1@lhz_WolfchevLaboratory_anyway_since_i_realized_3d5bc0: "总之，自从我意识到雷根贝背叛了我，我就不能让他们为所欲为。"
  npc_override_1@lhz_WolfchevLaboratory_as_you_see_you_only_160206: "如你所见，你是我唯一可以信任的人。你和你的队伍愿意再次帮我停用那些生物吗？"
  npc_override_1@lhz_WolfchevLaboratory_awww_everyone_ok_e625ca: "啊呜……大家都没事吧……？"
  npc_override_1@lhz_WolfchevLaboratory_awww_where_all_my_fellow_3bac8b: "啊呜……我的同伴们都去哪了……"
  npc_override_1@lhz_WolfchevLaboratory_awwww_you_running_away_a_b48475: "啊呜呜！！你！！又跑了……停下！"
  npc_override_1@lhz_WolfchevLaboratory_below_there_comes_grueso_b01005: "从下方传来与风混杂在一起的可怕声音。"
  npc_override_1@lhz_WolfchevLaboratory_boss_creature_ce4fc5: "首领生物？"
  npc_override_1@lhz_WolfchevLaboratory_button_supposed_pressed_cb7f75: "这个按钮本应在紧急情况下按下……但是……"
  npc_override_1@lhz_WolfchevLaboratory_careful_lady_809c5b: "小心，女士。"
  npc_override_1@lhz_WolfchevLaboratory_check_up_your_inventory_5bca6a: "^FF0000 检查你的背包。你携带的物品太多了，无法完成任务。 ^000000"
  npc_override_1@lhz_WolfchevLaboratory_clockwise_c75ac6: "顺时针"
  npc_override_1@lhz_WolfchevLaboratory_course_yea_if_i_m_b767fb: "当然……是的……如果我是好色之徒，地球上所有男人都是！我只是卡萨诺瓦。嗯哈哈哈哈。"
  npc_override_1@lhz_WolfchevLaboratory_creatures_organically_co_b2f48c: "生物是^9f6077与同一工作领域的有机连接^000000。"
  npc_override_1@lhz_WolfchevLaboratory_dangerous_rumors_c79afc: "危险的谣言？"
  npc_override_1@lhz_WolfchevLaboratory_di_rit_di_di_dit_ddf508: "迪 里特- 迪- 迪- 迪特-"
  npc_override_1@lhz_WolfchevLaboratory_did_i_act_too_rashly_ef2848: "……我是不是行动太……草率了……？"
  npc_override_1@lhz_WolfchevLaboratory_don_t_worry_i_didn_abffbf: "别担心。我没别的意思。"
  npc_override_1@lhz_WolfchevLaboratory_door_opened_6b5780: "-门打开了-"
  npc_override_1@lhz_WolfchevLaboratory_door_which_connects_lab_fde482: "连接2号实验室的门现在打开了。"
  npc_override_1@lhz_WolfchevLaboratory_entrance_towards_wolfche_29b785: "这是通往沃尔切夫实验室的入口。入口处有东西在嚎叫。"
  npc_override_1@lhz_WolfchevLaboratory_error_error_cf8a82: "^FF0000错误！错误！^000000"
  npc_override_1@lhz_WolfchevLaboratory_everyone_desire_stronger_b60dcd: "每个人都有变强的欲望，想要支配别人，让其他人服从和钦佩你。你没有那种欲望吗？"
  npc_override_1@lhz_WolfchevLaboratory_excuse_me_human_experime_e77a84: "不好意思？！人体实验？"
  npc_override_1@lhz_WolfchevLaboratory_excuse_me_i_think_i_180368: "打扰一下。但我想我失去了我的心。你能把你的心借给我吗？"
  npc_override_1@lhz_WolfchevLaboratory_finally_result_whom_did_bfc711: "最终。这就是结果吗？？我为谁做了实验？他们骗了我吗？"
  npc_override_1@lhz_WolfchevLaboratory_first_all_i_gotta_handle_c28746: "首先，我得处理那些实验品！"
  npc_override_1@lhz_WolfchevLaboratory_forbidden_personnel_ca4486: "^FF0000禁止入内^000000"
  npc_override_1@lhz_WolfchevLaboratory_gasping_pshaw_you_still_87a67f: "（喘气）呸……你还在跟着我。嘿，你为什么一直跟着我？"
  npc_override_1@lhz_WolfchevLaboratory_get_around_little_more_9a7340: "再四处转转……"
  npc_override_1@lhz_WolfchevLaboratory_give_me_map_please_get_6d74a9: "请给我一张地图……找条路……我陷入你的眼眸了。"
  npc_override_1@lhz_WolfchevLaboratory_go_inside_8c72d1: "进去"
  npc_override_1@lhz_WolfchevLaboratory_go_wolfchev_s_lab_o_92b7ba: "前往12点钟方向的'^0000FF沃尔切夫的实验室^000000'……"
  npc_override_1@lhz_WolfchevLaboratory_good_news_boss_creatures_f40a6b: "好消息是首领生物不像奴隶那样被设置为同时醒来。"
  npc_override_1@lhz_WolfchevLaboratory_guy_e6604a: "……一个家伙……？"
  npc_override_1@lhz_WolfchevLaboratory_ha_i_wanted_show_new_60708b: "哈……我想展示……新药水……"
  npc_override_1@lhz_WolfchevLaboratory_haa_you_any_woman_your_e72966: "哈……你……身边除了你姐妹和母亲外没有别的女人吗？"
  npc_override_1@lhz_WolfchevLaboratory_hahahaha_loneliness_you_1c47d6: "哈哈哈哈。孤独……你说？"
  npc_override_1@lhz_WolfchevLaboratory_he_happens_research_into_1df1ff: "他碰巧在没有告诉雷根贝公司的情况下研究人类'人工生命体'，而且有一个告密者向公司举报了，所以他被解雇了。"
  npc_override_1@lhz_WolfchevLaboratory_hey_dude_anyway_let_s_e39f3b: "嘿伙计！总之我们先离开这里！有没有什么他们够不到的地方？"
  npc_override_1@lhz_WolfchevLaboratory_hey_excuse_me_i_m_b5176b: "嘿……不好意思！！但我不是'好色之徒'，我只是一个崇拜女士的人。"
  npc_override_1@lhz_WolfchevLaboratory_hey_lady_7e4483: "嘿，女士？"
  npc_override_1@lhz_WolfchevLaboratory_hey_there_any_way_stop_4c402a: "嘿，有没有办法阻止那些生物？你应该知道些什么，是你制造了那些东西！"
  npc_override_1@lhz_WolfchevLaboratory_hey_wolfchev_e7a7eb: "嘿！沃尔切夫！！"
  npc_override_1@lhz_WolfchevLaboratory_hey_wolfchev_where_boss_a1e105: "嘿！沃尔切夫！那个^46B951首领生物^000000在哪里？"
  npc_override_1@lhz_WolfchevLaboratory_hey_you_get_out_my_94a6d8: "嘿你，让开……"
  npc_override_1@lhz_WolfchevLaboratory_hey_you_i_met_bad_46a39c: "嘿……你和我是因为一段糟糕的缘分才相遇的……"
  npc_override_1@lhz_WolfchevLaboratory_hit_him_wake_him_up_e93742: "- 打醒他 -"
  npc_override_1@lhz_WolfchevLaboratory_hm_you_sound_suspicious_750a34: "嗯……你听起来很可疑，伙计！哈？"
  npc_override_1@lhz_WolfchevLaboratory_hmm_lab_entering_system_416104: "嗯……实验室进入系统有点奇怪。能等我检查一下系统吗？"
  npc_override_1@lhz_WolfchevLaboratory_hmm_those_boss_creatures_1c05c4: "嗯……那些首领生物又再生了……"
  npc_override_1@lhz_WolfchevLaboratory_how_come_beauty_here_pla_d79c7c: "怎么会有一位美女来到这种有危险谣言的地方？"
  npc_override_1@lhz_WolfchevLaboratory_how_dare_you_come_back_87bb83: "你做了那种事后怎么还敢回到我身边。嘿嘿嘿"
  npc_override_1@lhz_WolfchevLaboratory_how_i_get_into_wolfchev_be6cb7: "我怎么才能进入沃尔切夫的实验室？"
  npc_override_1@lhz_WolfchevLaboratory_human_kaahaha_people_ten_b39568: "人类！咔哈哈。人们通常讨厌这个地方，你为什么在这里？"
  npc_override_1@lhz_WolfchevLaboratory_i_am_also_completely_los_e6b84f: "我在这里也完全迷路了……但是，这不应该发生……"
  npc_override_1@lhz_WolfchevLaboratory_i_am_so_sorry_0ffc26: "我……非常……抱歉……"
  npc_override_1@lhz_WolfchevLaboratory_i_am_so_sorry_you_c85eb1: "非常抱歉，但你能和刚认识的人接吻吗？？不？好的那让我介绍一下我自己。"
  npc_override_1@lhz_WolfchevLaboratory_i_am_sure_9832ca: "我不确定"
  npc_override_1@lhz_WolfchevLaboratory_i_am_telling_you_because_634e08: "我告诉你这些是因为我只是担心你。你需要离开这个充满失踪案件的城镇。"
  npc_override_1@lhz_WolfchevLaboratory_i_arrived_research_facil_d7d542: "我到达了一个似乎至今仍在使用的研究设施。"
  npc_override_1@lhz_WolfchevLaboratory_i_arrived_wolfchev_s_lab_ce29f2: "我到达了'^0000FF沃尔切夫的实验室^000000'。"
  npc_override_1@lhz_WolfchevLaboratory_i_didn_t_know_pressing_1b9225: "我不知道按下紧急警报会引起这样的问题。管理系统似乎已切换为紧急模式。"
  npc_override_1@lhz_WolfchevLaboratory_i_don_t_feel_like_55d028: "我不想谈论我心爱的女士们来取笑她们。你跟你的朋友去做吧。"
  npc_override_1@lhz_WolfchevLaboratory_i_feel_good_see_human_ccdb7e: "见到人类感觉很好"
  npc_override_1@lhz_WolfchevLaboratory_i_figured_something_out_6b2803: "我发现了一些事情……而且有一个系统错误不让我们自由进出，所以你可以每72小时帮我一次……在回来之前先去某处休息。"
  npc_override_1@lhz_WolfchevLaboratory_i_giacomo_girolamo_casan_1598c3: "我，贾科莫·吉罗拉莫·卡萨诺瓦·德·塞因加特对你这样的男人从不感兴趣！！"
  npc_override_1@lhz_WolfchevLaboratory_i_heard_rekenber_doing_h_e13312: "而且我听说雷根贝在用那些失踪的人做人体实验。希望你不要误会我。"
  npc_override_1@lhz_WolfchevLaboratory_i_help_you_get_laborator_180584: "我会马上帮你进入实验室。"
  npc_override_1@lhz_WolfchevLaboratory_i_help_you_get_there_e3acde: "我会帮你进入那里。"
  npc_override_1@lhz_WolfchevLaboratory_i_just_hope_lady_gets_eb4c5a: "我只希望那位女士能离开这个有危险谣言的城镇……"
  npc_override_1@lhz_WolfchevLaboratory_i_listen_you_you_wanna_78d028: "但我可以听你说……你有什么想对我说的吗？"
  npc_override_1@lhz_WolfchevLaboratory_i_looked_wolfchev_again_2ee675: "离开实验室前我又看了一眼沃尔切夫。我能感觉到他不再痴迷了……"
  npc_override_1@lhz_WolfchevLaboratory_i_looking_system_don_t_895be3: "我在看系统……不知道是谁做的……但太难理解了……没头绪……"
  npc_override_1@lhz_WolfchevLaboratory_i_m_so_happy_doing_8ad455: "我很高兴做追求完美的实验，我从不感到孤独。"
  npc_override_1@lhz_WolfchevLaboratory_i_m_so_lost_here_36b7a6: "我第一次来这里，完全迷路了。你能告诉我通往你心的路是哪条吗？"
  npc_override_1@lhz_WolfchevLaboratory_i_m_sorry_seems_you_736cbc: "抱歉，但你似乎还不能进入实验室。你稍后再来好吗？这个系统有点复杂你知道的。"
  npc_override_1@lhz_WolfchevLaboratory_i_might_said_so_what_af987a: "我可能说过那样的话……那又怎样？"
  npc_override_1@lhz_WolfchevLaboratory_i_promise_i_your_everyth_f8bfd4: "我承诺在任何情况下、任何困难的情况下，我都会成为你的全部。"
  npc_override_1@lhz_WolfchevLaboratory_i_say_again_thank_you_1b414f: "我再说一次，{0}非常感谢你清除了我那些发狂的孩子们。不是什么大礼但我希望你不要拒绝，我不再需要这个了。"
  npc_override_1@lhz_WolfchevLaboratory_i_see_i_understand_why_88d00b: "我明白了。我理解你为什么犹豫，不想再逼你了。但我还是不确定你为什么反正想去那里，"
  npc_override_1@lhz_WolfchevLaboratory_i_see_you_still_committi_5fa047: "而且我看你还在执迷不悟！！！"
  npc_override_1@lhz_WolfchevLaboratory_i_still_something_wolfch_9929a3: "我还有事要跟沃尔切夫处理。"
  npc_override_1@lhz_WolfchevLaboratory_i_suppose_you_then_under_a9a39e: "我想那你就能更快地理解这个故事……我确信他参与了那个谣言。我发誓。"
  npc_override_1@lhz_WolfchevLaboratory_if_you_come_me_experimen_de90dc: "如果你来我这里做实验，我可以更好地对待你。"
  npc_override_1@lhz_WolfchevLaboratory_if_you_could_deactivate_08e784: "如果你能停用那个生物，所有在这里游荡的^A1BB44奴隶生物^000000会立即停止移动。"
  npc_override_1@lhz_WolfchevLaboratory_if_you_hope_you_come_32e87b: "还有，如果可以的话……希望你经常回来，特别是和你的朋友们一起。我希望这个地方能再次拥有人心，这样这里的悲伤就会消失。"
  npc_override_1@lhz_WolfchevLaboratory_if_you_want_save_yoursel_bc8ed8: "如果你想救自己，就应该停止跟着我。滚开。"
  npc_override_1@lhz_WolfchevLaboratory_inside_laboratory_should_d2788d: "实验室……里面……它现在应该醒来了。毁掉我毕生的工作令人难过，但我再也受不了了……"
  npc_override_1@lhz_WolfchevLaboratory_just_so_you_know_please_038533: "顺便说一下，请不要因为好奇而随意触碰东西。我不想让你受伤。"
  npc_override_1@lhz_WolfchevLaboratory_kakakaah_thank_you_you_h_44b750: "咔咔咔……谢谢。你很好地处理了那些首领生物……"
  npc_override_1@lhz_WolfchevLaboratory_khahaha_see_you_again_yo_fc6cfa: "咔哈哈，再见。你现在想离开这里吗？"
  npc_override_1@lhz_WolfchevLaboratory_kihihihi_i_see_you_know_7d297c: "嘿嘿嘿。我能看出你知道一些关于我的事。是你告发我的吗？"
  npc_override_1@lhz_WolfchevLaboratory_laboratory_entrance_syst_f39b0c: "实验室进入系统[{0}]成员[{1}]访问已授权……"
  npc_override_1@lhz_WolfchevLaboratory_lady_you_dignified_lady_e6a2bc: "女士。即使你在这种贫穷的城镇闲逛，你也是一位高贵的女士……"
  npc_override_1@lhz_WolfchevLaboratory_left_valve_emergency_acc_3c51bb: "这是紧急通道的左阀门。"
  npc_override_1@lhz_WolfchevLaboratory_let_your_party_leader_ha_81abc4: "让你的队伍领袖来操作阀门。"
  npc_override_1@lhz_WolfchevLaboratory_long_time_i_gotta_go_a16363: "已经很久了，但我得走了。嘿嘿嘿。"
  npc_override_1@lhz_WolfchevLaboratory_management_system_door_w_2df3df: "[管理系统] 连接4号实验室的门现已打开。"
  npc_override_1@lhz_WolfchevLaboratory_management_system_door_w_7d7e73: "[管理系统] 连接2号实验室的门现已打开。"
  npc_override_1@lhz_WolfchevLaboratory_management_system_door_w_f781b3: "[管理系统] 连接3号实验室的门现已打开。"
  npc_override_1@lhz_WolfchevLaboratory_management_system_evacua_ced9fe: "[管理系统] 疏散！！"
  npc_override_1@lhz_WolfchevLaboratory_management_system_pipe_e_a78605: "[管理系统] 检测到管道爆炸！再破裂{0}次，系统将停止。"
  npc_override_1@lhz_WolfchevLaboratory_management_system_system_25c1b7: "[管理系统] 系统冻结！系统冻结！10秒内从实验室疏散。"
  npc_override_1@lhz_WolfchevLaboratory_management_system_warnin_153675: "[管理系统] 警告！2号实验室的管道压力过高。"
  npc_override_1@lhz_WolfchevLaboratory_management_system_warnin_9f9ed7: "[管理系统] 警告！管道压力过高。打开阀门。"
  npc_override_1@lhz_WolfchevLaboratory_menu_kid_4dc0a5: "孩子的低语：哇哇哇~我在哪里？妈妈……啊啊……"
  npc_override_1@lhz_WolfchevLaboratory_menu_man_38fdde: "男人的低语：求……求你了……救救我……我不想死……哇啊啊……"
