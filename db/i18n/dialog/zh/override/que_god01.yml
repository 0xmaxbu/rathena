  npc_override_que_god01_sleipnir_seal_ah_you_re_back_so_49024b: "啊，你回来了。那你记住故事了吗？"
  npc_override_que_god01_sleipnir_seal_ah_you_ve_come_back_ec2968: "啊，你回来了。"
