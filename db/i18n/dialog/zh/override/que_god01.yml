  npc_override_que_god01_sleipnir_seal_as_you_already_know_we_e96c9e: "如你所知，我们正试图找出是否能重新制作『斯雷普尼尔』，它是诸神使用的工具之一。"
  npc_override_que_god01_sleipnir_seal_as_you_press_word_dirdnl_0e74af: "^3355FF当你按下『^ff0000dirdnl^3355FF』这个词时，石碑发出奇怪的哔哔声，但没有其他反应。也许你必须按下其他词。^000000"
  npc_override_que_god01_sleipnir_seal_asgard_realm_gods_there_a2fcb1: "在阿斯加德，众神的领域，有一座巨大的防御城墙在最近的战争中被几乎完全摧毁。"
  npc_override_que_god01_sleipnir_seal_asgardian_rampart_only_m_692502: "阿斯加德城墙只用了 18 个月，但作为交换，他想要女神芙蕾雅做他的妻子，以及太阳和月亮的所有权。"
