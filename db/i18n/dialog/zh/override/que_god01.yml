  npc_override_que_god01_sleipnir_seal_go_date_97fc38: "去约会！"
  npc_override_que_god01_sleipnir_seal_go_inside_speak_investig_ddb11a: "进去和那里的调查员谈谈。他们都有点忙不过来，所以我肯定他们需要你的帮助。"
  npc_override_que_god01_sleipnir_seal_gods_being_gods_291a60: "诸神毕竟是诸神，"
  npc_override_que_god01_sleipnir_seal_gods_furious_stranger_s_65b12b: "众神对陌生人的荒谬要求感到愤怒。然而，洛基向奥丁提议"
  npc_override_que_god01_sleipnir_seal_gods_grew_more_anxious_a_c79e4d: "随着城墙很快将在六个月的期限内完工，众神越来越焦虑。阿斯加德人很快对洛基非常愤怒。"
  npc_override_que_god01_sleipnir_seal_gods_happy_tell_stranger_41e534: "众神很高兴地告诉陌生人，他们无法支付他所要求的报酬，因为他没有按最初约定完成城墙。"
  npc_override_que_god01_sleipnir_seal_gods_there_35ada8: "诸神，有"
  npc_override_que_god01_sleipnir_seal_good_job_you_95820f: "给你一份好工作？"
  npc_override_que_god01_sleipnir_seal_great_job_373333: "干得好~"
  npc_override_que_god01_sleipnir_seal_gullfaxi_owned_hrungnir_c9b5f6: "古尔法克西属于巨人王赫朗格尼尔。斯瓦迪尔法利，斯雷普尼尔的父亲，也属于一个巨人。"
  npc_override_que_god01_sleipnir_seal_hahaha_304fdd: "哈哈哈……！"
  npc_override_que_god01_sleipnir_seal_hahahaha_80aaf3: "哈哈哈……"
  npc_override_que_god01_sleipnir_seal_hahahahaha_i_m_so_194ce1: "哈哈哈哈！我真"
  npc_override_que_god01_sleipnir_seal_hahahahahaha_f49ddb: "哈哈哈哈~！"
  npc_override_que_god01_sleipnir_seal_having_personal_life_1526c8: "拥有个人生活……"
  npc_override_que_god01_sleipnir_seal_he_5780a6: "他是一个"
  npc_override_que_god01_sleipnir_seal_he_changed_506cbd: "他已经变了……"
  npc_override_que_god01_sleipnir_seal_help_us_our_research_3123ee: "帮助我们的研究？"
  npc_override_que_god01_sleipnir_seal_helping_us_out_e1c91f: "帮助了我们。"
  npc_override_que_god01_sleipnir_seal_his_offer_tempting_gods_0d4c4f: "他的提议对众神很有诱惑力，他们需要一切来自敌人的保护。"
  npc_override_que_god01_sleipnir_seal_his_rage_stranger_accuse_1e1031: "在愤怒中，陌生人指责众神欺骗他，这样他们就不必用太阳、月亮和美丽的女神芙蕾雅来支付他。然后，他揭示了自己的真实身份。"
  npc_override_que_god01_sleipnir_seal_his_work_himself_87761b: "他自己完成了工作。"
  npc_override_que_god01_sleipnir_seal_hmm_8ee499: "嗯。"
  npc_override_que_god01_sleipnir_seal_hmm_bb44e9: "嗯……？"
  npc_override_que_god01_sleipnir_seal_hmm_i_see_8ba469: "嗯，我明白了。"
  npc_override_que_god01_sleipnir_seal_hmm_seems_like_6de6a6: "嗯？看起来像"
  npc_override_que_god01_sleipnir_seal_hmmm_2ac89c: "嗯……"
  npc_override_que_god01_sleipnir_seal_hmmm_ebad5e: "嗯……"
  npc_override_que_god01_sleipnir_seal_hmmmmm_9e29d6: "嗯嗯嗯？"
  npc_override_que_god01_sleipnir_seal_how_work_1ae145: "这怎么运作？"
  npc_override_que_god01_sleipnir_seal_however_527860: "然而……"
  npc_override_que_god01_sleipnir_seal_however_82ccaf: "然而……"
  npc_override_que_god01_sleipnir_seal_however_feel_free_1836d5: "然而，请随意"
  npc_override_que_god01_sleipnir_seal_however_i_m_sure_efdc38: "然而，我相信"
  npc_override_que_god01_sleipnir_seal_hrimthurs_as_they_say_af96ce: "或者像他们说的，赫里姆图尔。"
  npc_override_que_god01_sleipnir_seal_huge_variety_6418a6: "种类繁多。"
  npc_override_que_god01_sleipnir_seal_huh_s_f54ed0: "哈。那是……"
  npc_override_que_god01_sleipnir_seal_human_resources_1efdea: "人力资源。"
  npc_override_que_god01_sleipnir_seal_i_achoo_right_achoo_some_67c8fb: "我是~ ^333333*阿嚏！*^000000 对的，^333333*阿嚏！*^000000 石-^333333*咳嗽*^000000 石碑里装了东西。因为这该死的 ^333333*咳——咳咳咳*^000000 流感，我自己没法去看。"
  npc_override_que_god01_sleipnir_seal_i_believe_s_no_use_712808: "我相信，除非你将力量用于正确的目的，否则拥有能力或力量是没有用的。"
  npc_override_que_god01_sleipnir_seal_i_consider_helping_other_51b6ad: "我认为帮助他人是对我精神修养的特殊训练。我希望你也能以善良和慷慨对待他人。"
  npc_override_que_god01_sleipnir_seal_i_could_use_these_a4a9a4: "我可以使用这些。"
  npc_override_que_god01_sleipnir_seal_i_don_t_need_c915a7: "我不需要"
  npc_override_que_god01_sleipnir_seal_i_don_t_usually_get_c71164: "我通常没有机会练习讲故事，而且我对自己版本的斯雷普尼尔故事的真实性也不太自信。"
  npc_override_que_god01_sleipnir_seal_i_finally_fd2f73: "我终于可以"
  npc_override_que_god01_sleipnir_seal_i_got_296ae7: "我明白了！"
  npc_override_que_god01_sleipnir_seal_i_guess_you_haven_t_861966: "我想你还没找到梅托。虽然他有时可能有点过于热情，但他绝对不是坏人。"
  npc_override_que_god01_sleipnir_seal_i_hope_you_8e2eb8: "我希望你能"
  npc_override_que_god01_sleipnir_seal_i_hope_you_ll_continue_2ca91c: "我希望你继续"
  npc_override_que_god01_sleipnir_seal_i_hope_you_understand_i_1e45c5: "但我希望你能理解我已经尽力了。这是我能为你做的最多了。"
  npc_override_que_god01_sleipnir_seal_i_know_d_much_easier_9e908a: "我知道如果这个故事已经被写下来会容易得多，但你必须明白，许多关于众神的故事只通过口头流传。"
  npc_override_que_god01_sleipnir_seal_i_know_story_might_seem_3b3feb: "我知道这个故事可能看起来太长了。但如果你想坐下来再听一遍，我很乐意再讲一遍。感谢你的聆听，冒险者。"
  npc_override_que_god01_sleipnir_seal_i_know_story_quite_long_dc20a3: "我知道这个故事相当长。你是想继续听，还是需要休息一下？"
  npc_override_que_god01_sleipnir_seal_i_know_you_going_help_5a7ee3: "我知道你本来打算帮我们的，但已经有人申请了助手职位。"
  npc_override_que_god01_sleipnir_seal_i_ll_go_then_4ab132: "那我继续了。"
  npc_override_que_god01_sleipnir_seal_i_m_guessing_i_m_ef5f76: "我猜我缺少某种特殊条件，让未知之轮能与特定材料产生共鸣。"
  npc_override_que_god01_sleipnir_seal_i_m_listening_34fc04: "我在听。"
  npc_override_que_god01_sleipnir_seal_i_m_quite_busy_compiling_b84ca5: "我现在正忙着整理所有这些信息。"
  npc_override_que_god01_sleipnir_seal_i_m_so_sorry_ask_b484f7: "很抱歉要麻烦你，但我希望你能理解我们在"
  npc_override_que_god01_sleipnir_seal_i_m_sorry_hassle_you_62b424: "很抱歉麻烦你，但你能出去收集一些东西吗，这样我就可以尝试重新制作"
  npc_override_que_god01_sleipnir_seal_i_m_sure_if_i_064722: "我不确定我是否能真正制作出来，但至少我们可以试试这个实验。"
  npc_override_que_god01_sleipnir_seal_i_m_trying_find_out_8b2261: "我正在尽力了解关于『^FF0000天使翅膀羽毛^000000』的一切。据说它是"
  npc_override_que_god01_sleipnir_seal_i_m_trying_learn_more_d58c96: "我正在努力了解更多关于『^FF0000未知之轮^000000』的信息，它被发现是被称为 ^FF0000斯雷普尼尔^000000 的神器的一部分。"
  npc_override_que_god01_sleipnir_seal_i_m_working_96a968: "我正在做的。"
  npc_override_que_god01_sleipnir_seal_i_must_00205e: "我一定"
  npc_override_que_god01_sleipnir_seal_i_must_cough_cough_remov_4f31d7: "我必须 ^333333*咳嗽咳嗽*^000000 移除装置，这样我才能 ^333333*咳嗽咳嗽*^000000 进一步研究这个 ^333333*吸鼻子*^000000 但看看我现在的样子。我整个人都垮了。我连 ^333333*阿——嚏！*^000000 ……话都说不好了。"
  npc_override_que_god01_sleipnir_seal_i_recently_told_there_pe_c47bb7: "我最近听说斐扬有个人知道这个故事。世界上很少有人拥有这样的知识。"
  npc_override_que_god01_sleipnir_seal_i_remember_now_819155: "我现在想起来了。"
  npc_override_que_god01_sleipnir_seal_i_see_well_stories_meant_ea8d42: "我明白了。好吧，故事是用来享受的，我想你现在没心情坐下来听。"
  npc_override_que_god01_sleipnir_seal_i_see_you_really_want_33a338: "我看得出来你真的很想记录每一个重要细节！"
  npc_override_que_god01_sleipnir_seal_i_should_mention_i_also_69e026: "我应该提一下，我还需要各种各样的海洋相关材料。没有不同的物体来测试，你没法做实验，对吧？"
  npc_override_que_god01_sleipnir_seal_i_stand_corrected_8ccf1b: "我承认我错了。"
  npc_override_que_god01_sleipnir_seal_i_t_believe_how_busy_5a02ad: "我简直不敢相信现在工作有多忙。我甚至没时间见朋友或去购物。"
  npc_override_que_god01_sleipnir_seal_i_t_even_remember_last_bb8506: "我甚至不记得上次"
  npc_override_que_god01_sleipnir_seal_i_t_figure_out_how_ddca3b: "但我搞不清楚它该怎么运作。"
  npc_override_que_god01_sleipnir_seal_i_t_glhk_glhk_tell_93d1e7: "我无法 ^333333*咕噜咕噜*^000000 分辨这是什么古代语言—— ^333333*阿嚏！*^000000 所以……嗯……"
  npc_override_que_god01_sleipnir_seal_i_tell_you_what_i_dbcaaa: "我可以告诉你我所知道的关于斯雷普尼尔的事。让我看看能不能记住所有细节。"
  npc_override_que_god01_sleipnir_seal_i_thinking_using_my_own_930d48: "我之前想用自己的资金雇佣外部机构，但现在你来了，就没这个必要了~"
  npc_override_que_god01_sleipnir_seal_i_told_you_everything_i_0a394a: "我告诉了你我所知道的一切。希望我对你有所帮助。请以同样的慷慨和善意对待他人。"
  npc_override_que_god01_sleipnir_seal_i_told_you_go_look_458e48: "我告诉你去看看那个—— ^333333*阿——嚏！*^000000 那个 ^333333*阿嚏！阿嚏！咕噜咕噜*^000000"
  npc_override_que_god01_sleipnir_seal_i_try_help_ad35a4: "我会尽力帮助"
  npc_override_que_god01_sleipnir_seal_i_understand_my_story_in_1793fc: "我知道我的故事没那么有趣。但下次我会尽力让你听得开心。祝你旅途平安。"
  npc_override_que_god01_sleipnir_seal_i_understand_story_quite_e24203: "我知道这个故事相当长。抱歉。好吧，我会等你写完笔记。"
  npc_override_que_god01_sleipnir_seal_i_understand_tale_sleipn_df1472: "我知道斯雷普尼尔的故事相当长。但如果你有耐心，我改天再给你讲这个故事。再会~"
  npc_override_que_god01_sleipnir_seal_i_ve_almost_completed_my_bd4331: "我几乎完成了我的项目，不需要太多人手。然而，我需要完成的最后一项任务很困难。"
  npc_override_que_god01_sleipnir_seal_if_people_doing_your_res_9d22d8: "但如果做研究的人没有动力和灵感，你将一事无成。"
  npc_override_que_god01_sleipnir_seal_if_you_don_t_mind_a7da12: "但如果你不介意帮我们做些零碎的小事，那可能会减轻我们的工作负担。"
  npc_override_que_god01_sleipnir_seal_if_you_ever_need_92d239: "如果你需要的话。"
  npc_override_que_god01_sleipnir_seal_if_you_ever_want_hear_4113fd: "但如果你以后想听斯雷普尼尔的故事，随时可以再来看我。祝你今天愉快~"
  npc_override_que_god01_sleipnir_seal_if_you_let_s_talk_c6566b: "如果是的话，我们来谈谈"
  npc_override_que_god01_sleipnir_seal_if_you_we_83f0ee: "如果是的话，我们可以"
  npc_override_que_god01_sleipnir_seal_if_you_wish_listen_story_d4150e: "如果你想再听一遍这个故事，随时欢迎。"
  npc_override_que_god01_sleipnir_seal_important_1ce13a: "对……很重要"
  npc_override_que_god01_sleipnir_seal_important_detail_bd6138: "重要细节。"
  npc_override_que_god01_sleipnir_seal_kind_material_i_d_say_f8b9ca: "那种材料，我想每种大约 10 个应该够用。上下浮动 5 个左右……"
  npc_override_que_god01_sleipnir_seal_know_what_you_ve_learned_9d27fc: "知道你已经学到了什么。"
  npc_override_que_god01_sleipnir_seal_later_you_know_71b813: "以后你就知道了。"
  npc_override_que_god01_sleipnir_seal_lend_us_your_assistance_203c61: "给予我们帮助。"
  npc_override_que_god01_sleipnir_seal_let_me_explain_a05824: "让我解释"
  npc_override_que_god01_sleipnir_seal_let_me_give_you_temporar_c5192f: "让我给你一张临时通行证。谢谢"
  npc_override_que_god01_sleipnir_seal_let_me_think_4d3210: "让我想想……"
  npc_override_que_god01_sleipnir_seal_let_s_see_4d37ed: "让我看看……"
  npc_override_que_god01_sleipnir_seal_like_old_myths_legends_y_9577e5: "就像古老的神话和传说一样，你的经历是你可以从中汲取宝贵经验的故事。"
  npc_override_que_god01_sleipnir_seal_little_cce69d: "一点……"
  npc_override_que_god01_sleipnir_seal_loki_introduced_pony_as_ba3caa: "洛基介绍这匹小马为『斯雷普尼尔』并把它献给了"
  npc_override_que_god01_sleipnir_seal_loki_suggested_if_strang_82767c: "洛基建议，如果陌生人能在规定时间内完成大部分城墙翻新，但比约定时间晚，那么众神就没有义务支付陌生人任何报酬。"
  npc_override_que_god01_sleipnir_seal_long_long_time_22fd6d: "很长很长的时间。"
  npc_override_que_god01_sleipnir_seal_looks_feels_like_steel_e_3fef84: "它看起来和摸起来都像钢，但极端的高温和寒冷都不影响它。任何我能施加的冲击或力量也无法使它凹陷。"
  npc_override_que_god01_sleipnir_seal_looks_like_7105c6: "看起来像"
  npc_override_que_god01_sleipnir_seal_lot_things_don_t_you_d69842: "很多事情，不是吗？"
  npc_override_que_god01_sleipnir_seal_mad_scientist_d089eb: "疯狂科学家？"
  npc_override_que_god01_sleipnir_seal_man_promised_rebuild_2e3937: "这个人承诺重建"
  npc_override_que_god01_sleipnir_seal_manpower_4b6fef: "人力和"
  npc_override_que_god01_sleipnir_seal_material_godly_artifact_3e7c14: "作为神器的材料。"
  npc_override_que_god01_sleipnir_seal_materials_you_should_eno_e15eb5: "你带来的材料应该足够我做实验了。非常感谢。"
