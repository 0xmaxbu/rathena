  npc_override_que_god01_sleipnir_seal_dark_horse_offered_rebui_24a836: "一匹黑马提出要重建甚至改进阿斯加德的防御城墙。"
  npc_override_que_god01_sleipnir_seal_despite_loki_remained_ca_7a67b4: "尽管如此，洛基保持冷静，向众神保证他有办法。众神不信任他的狡诈，随着陌生人的工程飞速进展，他们变得越来越绝望。"
  npc_override_que_god01_sleipnir_seal_despite_passing_time_man_f7928d: "尽管时光流逝，人类进步，生活中某些基本原则是永恒的，永远不会改变。"
