  npc_override_que_god01_sleipnir_seal_story_soon_6434a3: "的故事很快就到。"
  npc_override_que_god01_sleipnir_seal_strangely_enough_strange_12d0bc: "奇怪的是，陌生人用他的马搬运材料，重建城墙的速度超乎常人。"
  npc_override_que_god01_sleipnir_seal_strangely_enough_surface_5b590d: "^3355FF奇怪的是，石碑的表面在发热。^000000"
  npc_override_que_god01_sleipnir_seal_stranger_b6616b: "陌生人会"
  npc_override_que_god01_sleipnir_seal_stranger_turned_out_ba1cfb: "陌生人原来"
  npc_override_que_god01_sleipnir_seal_such_great_help_96f782: "如此大的帮助。"
  npc_override_que_god01_sleipnir_seal_surely_i_ll_able_answer_828658: "当然，有了你带来的信息，我应该能回答我一些最重要的问题，尽管这仍然不容易。"
  npc_override_que_god01_sleipnir_seal_surprisingly_c0e76c: "令人惊讶的是，"
  npc_override_que_god01_sleipnir_seal_svadilfari_fell_love_bea_a98650: "斯瓦迪尔法利爱上了一匹美丽的母马，这就是为什么"
  npc_override_que_god01_sleipnir_seal_talk_about_cd4a31: "谈论这个"
  npc_override_que_god01_sleipnir_seal_tell_me_rest_97d7cb: "告诉我剩下的"
  npc_override_que_god01_sleipnir_seal_temporary_c0c535: "临时的"
  npc_override_que_god01_sleipnir_seal_terrible_frost_giant_d7618f: "可怕的霜巨人，"
  npc_override_que_god01_sleipnir_seal_thank_you_anyway_though_415145: "总之还是谢谢你。希望下次我们需要项目帮助时你会来。"
  npc_override_que_god01_sleipnir_seal_thank_you_c9deb2: "感谢你"
  npc_override_que_god01_sleipnir_seal_thank_you_pointing_8f5d06: "感谢你指出"
  npc_override_que_god01_sleipnir_seal_thank_you_so_much_093766: "非常感谢！"
  npc_override_que_god01_sleipnir_seal_thank_you_trouble_abc870: "辛苦你了。"
  npc_override_que_god01_sleipnir_seal_thanks_you_we_able_compl_4280ec: "多亏了你，我们完成了对斯雷普尼尔的基础研究。现在我们可以规划更深入的研究了。"
  npc_override_que_god01_sleipnir_seal_that_was_the_497464: "那就是"
  npc_override_que_god01_sleipnir_seal_their_curiosity_gods_dec_605755: "出于好奇，众神决定调查斯瓦迪尔法利的失踪。"
  npc_override_que_god01_sleipnir_seal_themselves_6ea533: "自己。"
  npc_override_que_god01_sleipnir_seal_then_let_me_continue_58c943: "那就让我继续吧。"
  npc_override_que_god01_sleipnir_seal_then_please_let_me_conti_ed11db: "那就请让我继续吧。"
  npc_override_que_god01_sleipnir_seal_then_reconstruction_ramp_7c72c8: "然后，城墙的重建突然停止了。众神和陌生人都同样惊讶，因为斯瓦迪尔法利不见了。"
  npc_override_que_god01_sleipnir_seal_there_s_no_real_time_a359e5: "这个任务没有真正的时限，但你越快完成越好。"
  npc_override_que_god01_sleipnir_seal_there_s_still_too_much_4da909: "关于神器我们还有太多不知道的。 ^333333*叹气*^000000"
  npc_override_que_god01_sleipnir_seal_there_some_a0ea37: "有一些"
  npc_override_que_god01_sleipnir_seal_there_some_writing_engra_46f933: "^3355FF这块石碑上刻着一些文字。由于你无法阅读，而且石头看起来因年代久远而风化，这似乎是用一种古老的语言写的。^000000"
  npc_override_que_god01_sleipnir_seal_these_i_continue_my_rese_369935: "有了这些，我就可以毫无问题地继续我的研究了。我对你完成的工作感到惊喜。"
  npc_override_que_god01_sleipnir_seal_these_too_oh_8067c7: "还有这些。哦！"
  npc_override_que_god01_sleipnir_seal_they_eager_f1f558: "他们并不急于"
  npc_override_que_god01_sleipnir_seal_they_found_67fc84: "他们发现"
  npc_override_que_god01_sleipnir_seal_they_need_anything_3821c4: "他们需要什么吗？"
  npc_override_que_god01_sleipnir_seal_they_should_let_stranger_a24a3f: "他们应该让陌生人重建他们的防御城墙。"
  npc_override_que_god01_sleipnir_seal_thfdh_dutsjswhsjs_rhf_tk_666d4c: "thfdh duTsjswhsjs rhf tk dmqsjs rj ehddjfn"
  npc_override_que_god01_sleipnir_seal_thor_quickly_killed_gian_845fe7: "索尔用他的锤子雷神之锤迅速杀死了巨人，将锤子砸向巨人的头部，将其打得粉碎。"
  npc_override_que_god01_sleipnir_seal_time_i_went_out_guy_8319cb: "我上次和一个男人出去！照这样下去，我可能在找到男朋友之前就要退休了。不——，我还年轻着呢~！"
  npc_override_que_god01_sleipnir_seal_times_agony_please_refle_d025c6: "在痛苦的时候，请反思你的过去以帮助你找到解决方案。"
  npc_override_que_god01_sleipnir_seal_training_isn_t_limited_j_84f5e7: "训练不仅限于身体和心理上的磨练。"
  npc_override_que_god01_sleipnir_seal_travel_safely_74389d: "一路平安~"
  npc_override_que_god01_sleipnir_seal_twice_about_his_269700: "两次考虑他的"
  npc_override_que_god01_sleipnir_seal_um_what_i_meant_say_8379d3: "嗯，我想说的是—— ^333333*阿——嚏！*^000000"
  npc_override_que_god01_sleipnir_seal_understand_what_94e2d2: "理解什么是"
  npc_override_que_god01_sleipnir_seal_upon_taking_closer_look_22bbd4: "^3355FF仔细查看石碑后，你发现其中一个词的每个刻字的缝隙里都有小装置。"
  npc_override_que_god01_sleipnir_seal_upon_touching_slab_s_sur_1d5fd9: "^3355FF触摸石碑表面时，你感觉到它出奇地温暖。也许这块石碑并不像表面看起来那么简单。^000000"
  npc_override_que_god01_sleipnir_seal_upset_gods_since_strange_d75a0d: "这让众神很不高兴，因为陌生人实际上是一个伪装成巨人的存在。然而，这并不违反他们的协议，"
  npc_override_que_god01_sleipnir_seal_vibrate_b9bb4c: "振动，"
  npc_override_que_god01_sleipnir_seal_wait_23652b: "等等……！"
  npc_override_que_god01_sleipnir_seal_wait_second_right_now_yo_9f6e3a: "^3355FF等一下！现在你携带了太多物品。请先把一些东西存进卡普拉仓库后再回来。^000000"
  npc_override_que_god01_sleipnir_seal_way_you_lead_your_life_8f8d33: "你生活的方式和与他人互动的方式也可以被认为是训练的一部分。"
  npc_override_que_god01_sleipnir_seal_we_conduct_research_godl_502001: "我们对古代诸神留下的神器进行研究。更具体地说，我们对诸神使用的工具感兴趣。"
  npc_override_que_god01_sleipnir_seal_we_ve_been_friends_long_cb3439: "我们在同一领域工作这么久，已经是老朋友了。不知道他现在怎么样？"
  npc_override_que_god01_sleipnir_seal_we_won_t_experiment_you_70295f: "我们不会拿你做实验或什么的，我们只需要你跑些简单的腿。当然，你会得到报酬的。"
  npc_override_que_god01_sleipnir_seal_well_if_you_happen_find_2d3b9b: "嗯，如果你碰巧找到任何可能适合做临时研究助理的人，你愿意推荐给我们吗？"
  npc_override_que_god01_sleipnir_seal_what_8dee4b: "会是什么"
  npc_override_que_god01_sleipnir_seal_what_am_i_doing_c5490d: "我在做什么？"
  npc_override_que_god01_sleipnir_seal_what_i_d_like_ask_769f46: "我想请你做的是收集材料，这样我就能制作『鱼灵』了。"
  npc_override_que_god01_sleipnir_seal_what_you_brought_me_hmm_8c962d: "你带给我的东西。嗯……"
  npc_override_que_god01_sleipnir_seal_where_i_bdfd99: "我说到哪儿了？"
  npc_override_que_god01_sleipnir_seal_whether_we_actually_dete_cd1224: "我们是否能真正探测或感知到灵魂，不如首先证明它们的存在重要。"
  npc_override_que_god01_sleipnir_seal_whgks_dirdnlsjs_wkrdjswh_8a8372: "……whgks ^ff00ffdirdnl^000000sjs wkrdjswhgks whdtnfb"
