  npc_override_que_god01_sleipnir_seal_although_our_researchers_b0407e: "虽然我们的研究人员有点奇怪，但他们都很友善，而且都是好心。"
  npc_override_que_god01_sleipnir_seal_although_stranger_s_skil_fd23a1: "虽然陌生人的技艺高超，但真正加快城墙重建速度的是他的马。这就是传说中的魔法马，斯瓦迪尔法利。"
