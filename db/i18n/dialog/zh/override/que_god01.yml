  npc_override_que_god01_sleipnir_seal_you_really_helped_us_out_6850f6: "你真的帮了我们很多。感谢你所做的一切。"
  npc_override_que_god01_sleipnir_seal_you_still_don_t_b3f917: "^3355FF你仍然不"
  npc_override_que_god01_sleipnir_seal_you_still_listening_if_y_fd27e4: "你还在听吗？如果你累了，我能理解，我们可以"
  npc_override_que_god01_sleipnir_seal_you_sure_you_ve_listened_9c6155: "你确定你已经完整地听完了这个故事吗？很抱歉要麻烦你，但你能去斐扬再听一遍这个故事吗？"
  npc_override_que_god01_sleipnir_seal_you_touched_word_nothing_064b17: "你触摸了 ^ff0000{0}^000000 这个词，什么也没发生。"
