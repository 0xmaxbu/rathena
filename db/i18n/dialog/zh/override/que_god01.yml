  npc_override_que_god01_sleipnir_seal_you_press_word_ghswka_re_702c4f: "^3355FF你按下『^ff0000ghswka^3355FF』这个词，发出肯定的哔哔声。仍然什么都没发生，也许你必须按下另一个词。^000000"
  npc_override_que_god01_sleipnir_seal_you_press_word_tkaryf_an_798fbb: "^3355FF你按下『^ff0000tkaryf^3355FF』这个词，又一声哔哔声从"
