  npc_override_que_god01_sleipnir_seal_now_we_don_t_enough_1bc66f: "现在，我们没有足够的"
  npc_override_que_god01_sleipnir_seal_now_we_ll_plan_out_1814fa: "从现在开始，我们将根据我们现在对神器掌握的信息来规划更高级的研究。"
  npc_override_que_god01_sleipnir_seal_now_we_ve_completed_our_47cf63: "既然我们已经完成了基础研究，我们就规划未来的研究项目。"
