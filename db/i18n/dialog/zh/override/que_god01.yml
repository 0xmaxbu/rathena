  npc_override_que_god01_sleipnir_seal_so_i_hope_you_don_75855f: "所以希望你别介意 ^333333*阿嚏！*^000000 帮我移除 ^333333*咳嗽*^000000 装置。非常感谢。 ^333333*吸鼻子*^000000"
  npc_override_que_god01_sleipnir_seal_so_i_hope_you_understand_46e807: "所以如果他们中有些人待你的方式看起来有点粗鲁，希望你能理解。"
  npc_override_que_god01_sleipnir_seal_so_much_your_help_ca786d: "非常感谢你的帮助~"
