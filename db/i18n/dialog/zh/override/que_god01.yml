  npc_override_que_god01_sleipnir_seal_which_composed_a08e1a: "构成它的成分。"
  npc_override_que_god01_sleipnir_seal_who_might_need_your_help_ac57aa: "可能需要在完成项目时得到你的帮助的人。你为什么不四处问问，看看"
