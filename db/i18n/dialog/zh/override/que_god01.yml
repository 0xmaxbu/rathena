  npc_override_que_god01_sleipnir_seal_anyway_i_thank_you_helpi_96716e: "总之，谢谢你之前帮助我。基本上我需要的就是这些了，请去问问其他研究员是否需要帮助。"
  npc_override_que_god01_sleipnir_seal_anyway_just_ask_him_abou_e9fc8e: "总之，问问他研究的进展。如果他碰巧向你求助，请给予他帮助。"
  npc_override_que_god01_sleipnir_seal_anyway_no_one_really_sur_73cacd: "总之，没人确定是不是真的。最近这成了很多传闻的焦点。不过我不知道它们是不是真的。"
  npc_override_que_god01_sleipnir_seal_anyway_we_ve_already_fin_ce3eae: "总之，我们已经完成了目前的研究项目。现在，我们正在规划下一步要进行的项目……"
  npc_override_que_god01_sleipnir_seal_anyways_we_continue_rese_76e2fa: "总之，我们会继续研究，希望有一天能实现重新制作斯雷普尼尔的目标。"
