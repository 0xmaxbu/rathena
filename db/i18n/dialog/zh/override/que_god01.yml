  npc_override_que_god01_sleipnir_seal_door_locked_there_some_s_610a97: "^3355FF门是锁着的。右侧有一些安全装置。似乎装置需要检测到某种通行证才能进入。^000000"
  npc_override_que_god01_sleipnir_seal_door_locked_you_slide_yo_df8ea8: "^3355FF门是锁着的。你把临时通行证在门右侧的安全装置上刷了一下，门开了。^000000"
