  npc_override_que_god01_sleipnir_seal_results_research_could_a_a22314: "这项研究的结果可能会受到你传达给我的词语的影响。"
  npc_override_que_god01_sleipnir_seal_return_stranger_paid_as_41df41: "作为回报，如果陌生人能满足这些条件，就会按他的要求付酬。因为他只是个凡人，这似乎不可能。"
