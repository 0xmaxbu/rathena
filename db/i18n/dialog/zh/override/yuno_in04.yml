Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_yuno_in04_Extended_Stylist_anything_you_want_cut_cbb0c1: "Anything you want to cut?"
  npc_override_yuno_in04_Extended_Stylist_come_back_anytime_28dab7: "Come back anytime."
  npc_override_yuno_in04_Extended_Stylist_everyone_right_beautiful_6436cd: "Everyone has the right to be beautiful... I hope you find a style that suits you."
  npc_override_yuno_in04_Extended_Stylist_hehe_welcome_i_m_isop_a379b5: "Hehe, Welcome. I'm Isop, the stylist of the <Shook Shook-Store>."
  npc_override_yuno_in04_Extended_Stylist_i_m_back_as_one_de9f0c: "I'm back as one of the greatest stylists in the world. I'm Prince Shami and a professional stylist and I have to say I've been blessed by this great talent! <3"
  npc_override_yuno_in04_Extended_Stylist_i_m_lonza_i_give_8b11a7: "I'm Lonza and I can give you an amazing change that will make you stylish, so come and visit me anytime."
  npc_override_yuno_in04_Extended_Stylist_if_you_re_doram_who_46cde2: "If you're a Doram who lives and dies for fashion, trust me. To the beat of the music~"
  npc_override_yuno_in04_Extended_Stylist_menu_change_2370d7: "Change your style:End conversation"
  npc_override_yuno_in04_Extended_Stylist_nice_meet_you_my_guest_18757c: "Nice to meet you my guest. Would you like to leave your transformation to Maxi, the best stylist in Schwarzwald?"
  npc_override_yuno_in04_Extended_Stylist_please_visit_us_again_29f207: "Please visit us again~"
  npc_override_yuno_in04_Extended_Stylist_there_no_such_thing_as_9f7bc6: "There is no such thing as bad weather, right? One day I want you to trust me."
  npc_override_yuno_in04_Extended_Stylist_welcome_i_m_jovovich_fam_8dee39: "Welcome. I'm Jovovich, a famous stylist from Prontera. How can I help you?"
  npc_override_yuno_in04_Extended_Stylist_welcome_veronica_beauty_132c63: "Welcome to Veronica Beauty Salon, reborn as a world-class stylist. Hhhi."
  npc_override_yuno_in04_Extended_Stylist_you_saying_you_don_t_a231b5: "Are you saying you don't like this stylish? How is this possible!"
