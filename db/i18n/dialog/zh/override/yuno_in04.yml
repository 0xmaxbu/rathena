Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_yuno_in04_Extended_Stylist_anything_you_want_cut_cbb0c1: "你想剪什么？"
  npc_override_yuno_in04_Extended_Stylist_come_back_anytime_28dab7: "随时再来。"
  npc_override_yuno_in04_Extended_Stylist_everyone_right_beautiful_6436cd: "每个人都有美丽的权利……希望你能找到适合自己的风格。"
  npc_override_yuno_in04_Extended_Stylist_hehe_welcome_i_m_isop_a379b5: "呵呵，欢迎。我是伊索普，<咻咻商店>的发型师。"
  npc_override_yuno_in04_Extended_Stylist_i_m_back_as_one_de9f0c: "我回来了，作为世界上最伟大的发型师之一。我是沙米王子，一位专业发型师，我必须说我被这伟大的天赋所祝福！<3"
  npc_override_yuno_in04_Extended_Stylist_i_m_lonza_i_give_8b11a7: "我是隆扎，我可以给你一个惊人的改变，让你变得时尚，所以随时来找我。"
  npc_override_yuno_in04_Extended_Stylist_if_you_re_doram_who_46cde2: "如果你是喵族，为时尚而生，相信我。跟着音乐的节奏~"
  npc_override_yuno_in04_Extended_Stylist_menu_change_2370d7: "改变你的风格:结束对话"
  npc_override_yuno_in04_Extended_Stylist_nice_meet_you_my_guest_18757c: "很高兴见到你，我的客人。你愿意把你的变身交给施瓦茨瓦尔德最好的发型师马克西吗？"
  npc_override_yuno_in04_Extended_Stylist_please_visit_us_again_29f207: "请再次光临~"
  npc_override_yuno_in04_Extended_Stylist_there_no_such_thing_as_9f7bc6: "没有坏天气这回事，对吧？总有一天我想让你信任我。"
  npc_override_yuno_in04_Extended_Stylist_welcome_i_m_jovovich_fam_8dee39: "欢迎。我是乔沃维奇，来自普隆德拉的著名发型师。我能为你做什么？"
  npc_override_yuno_in04_Extended_Stylist_welcome_veronica_beauty_132c63: "欢迎来到维罗妮卡美容院，重生为世界级发型师。嘿嘿。"
  npc_override_yuno_in04_Extended_Stylist_you_saying_you_don_t_a231b5: "你是说你不喜欢这个时尚造型？这怎么可能！"