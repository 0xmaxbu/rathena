Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_alde_gld_agit_main_te_emperium_been_destroyed_3cc6a1: "华丽金属已被摧毁。"
  npc_override_alde_gld_guides_woe_te_ah_if_you_think_i_2d5aaf: "啊，如果你觉得我疯了，是因为我的名字从卡普拉花园中消失了，如果我的说话方式因此有点生硬的话"
  npc_override_alde_gld_guides_woe_te_also_their_buff_effects_cfa092: "此外，他们的增益效果在这里也会被消除。"
  npc_override_alde_gld_guides_woe_te_also_we_lend_variety_bat_25ce08: "另外，我们还免费出借各种战斗装备，这些装备只能在对应区域使用。"
  npc_override_alde_gld_guides_woe_te_also_we_prepared_variety_4afc5d: "此外，我们还准备了各种战斗装备，随时可根据你的要求提供。"
  npc_override_alde_gld_guides_woe_te_although_looks_very_simi_c66713: "虽然它看起来和鲁伊纳非常相似"
  npc_override_alde_gld_guides_woe_te_although_rental_period_r_012e8f: "虽然租借期相对较短，但全部免费。所以，不要错过这个机会！"
  npc_override_alde_gld_guides_woe_te_as_they_say_action_speak_f07e9d: "俗话说，'行动胜于言辞。'"
  npc_override_alde_gld_guides_woe_te_been_named_honor_seven_r_c0723d: "它是为了纪念七大王室家族和王国而命名的。"
  npc_override_alde_gld_guides_woe_te_course_primary_secondary_198ebb: "当然，一转和二转职业也包括在内。"
  npc_override_alde_gld_guides_woe_te_different_rules_applied_5c5f0e: "由于气氛类似于体育馆，因此适用不同的规则，并提供充分的支持。"
  npc_override_alde_gld_guides_woe_te_finally_kafra_service_es_5d4be6: "终于，卡普拉服务建立了自己的要塞！"
  npc_override_alde_gld_guides_woe_te_fortress_provided_kafra_e49f16: "这是卡普拉服务与卢恩-米德加尔特王室合作提供的要塞。"
  npc_override_alde_gld_guides_woe_te_gloria_afb0c0: "格洛里亚？"
  npc_override_alde_gld_guides_woe_te_hehe_doesn_t_mean_i_4338f7: "嘿嘿，这不就意味着我比泰林更优越吗？"
  npc_override_alde_gld_guides_woe_te_if_you_wish_return_valky_0abc0e: "如果你想返回瓦尔哈拉 realm，你可以通过传送旅行。"
  npc_override_alde_gld_guides_woe_te_job_classes_allowed_part_dcd679: "允许参加卡普拉花园和格洛里亚地区要塞攻城战的职业仅限于^4d4dff一转和二转职业以及没有扩展等级的职业。^000000"
  npc_override_alde_gld_guides_woe_te_kafra_service_hopes_you_b6eb4a: "卡普拉服务希望你能在新的要塞中获得宝贵的经验。"
  npc_override_alde_gld_guides_woe_te_kafra_service_its_utmost_8d3b28: "卡普拉服务将竭尽全力通过卡普拉花园为你带来快乐。"
  npc_override_alde_gld_guides_woe_te_kafragarten_aldebaran_ma_da1dff: "在由格洛里亚和卡普拉服务管理的艾尔帕兰卡普拉花园中，我们有与现有规则略有不同的特殊规则。"
  npc_override_alde_gld_guides_woe_te_kafragarten_built_region_91d8ac: "卡普拉花园建在鲁伊纳地区，而在瓦尔哈拉 realm，王室的格洛里亚建立了。"
  npc_override_alde_gld_guides_woe_te_kafragarten_gloria_regio_56d027: "在卡普拉花园和格洛里亚地区，你会得到单独的任务。"
  npc_override_alde_gld_guides_woe_te_kafragarten_like_mirrore_d4920e: "卡普拉花园就像是鲁伊纳的镜像，所以它的结构与鲁伊纳完全相同。"
  npc_override_alde_gld_guides_woe_te_make_good_use_7f2148: "好好利用它"
  npc_override_alde_gld_guides_woe_te_may_biggest_difference_59255f: "这可能是最大的区别。"
  npc_override_alde_gld_guides_woe_te_may_endless_glory_kingdo_ebdf9b: "愿无尽的荣耀与卢恩-米德加尔特王国及其七大王室家族同在！"
  npc_override_alde_gld_guides_woe_te_may_glory_royal_family_o_d5ab4d: "愿王室的荣耀和奥丁的庇护与你同在！"
  npc_override_alde_gld_guides_woe_te_means_kafra_s_garden_45c033: "它的意思是'卡普拉的花园'。"
  npc_override_alde_gld_guides_woe_te_moreover_your_convenienc_80b191: "此外，为了方便你，我们出借各种只能在该要塞内使用的物品。所以，好好利用这个机会。"
  npc_override_alde_gld_guides_woe_te_msg_0c5466: "…… ."
  npc_override_alde_gld_guides_woe_te_msg_3a286c: "…… .."
  npc_override_alde_gld_guides_woe_te_new_stage_prepared_royal_a853ac: "这是王室为了让更多人参与攻城战而准备的新舞台。"
  npc_override_alde_gld_guides_woe_te_no_way_w_no_better_89c3c9: "不可能。W不比我好……哈哈哈。"
  npc_override_alde_gld_guides_woe_te_novice_primary_secondary_af5504: "^4d4dff初心者、一转和二转职业以及额外职业都可以参加。^000000"
  npc_override_alde_gld_guides_woe_te_now_go_see_yourself_98d0df: "现在，自己去看看吧~"
  npc_override_alde_gld_guides_woe_te_obviously_they_re_only_v_6b122c: "但显然，它们只在卡普拉花园和格洛里亚地区有效。"
  npc_override_alde_gld_guides_woe_te_oh_my_f009ab: "天哪。"
  npc_override_alde_gld_guides_woe_te_other_than_much_differen_22a5cd: "除此之外，它与现有的攻城战没有太大区别。"
  npc_override_alde_gld_guides_woe_te_other_words_tertiary_job_c2afe3: "换句话说，三转职业和具有扩展等级的职业如影狼和胧是不允许参加的。"
  npc_override_alde_gld_guides_woe_te_please_keep_mind_you_sup_de27dd: "请记住，你应该在这里通过传送旅行。"
  npc_override_alde_gld_guides_woe_te_primary_secondary_extra_4ec1d6: "只允许一转、二转和没有扩展等级的额外职业以及一转和二转职业参加。"
  npc_override_alde_gld_guides_woe_te_really_true_5c2787: "这是真的吗？"
  npc_override_alde_gld_guides_woe_te_region_kafragarten_1906ac: "这是卡普拉花园地区。"
  npc_override_alde_gld_guides_woe_te_royal_family_kafra_servi_b5c7d4: "王室和卡普拉服务为你准备了各种 retal 物品。"
  npc_override_alde_gld_guides_woe_te_s_been_newly_established_972ade: "它是新建立的，旨在让更多的用户通过攻城战获得经验。"
  npc_override_alde_gld_guides_woe_te_s_like_training_stage_so_ba7401: "可以说，它就像一个训练场。"
  npc_override_alde_gld_guides_woe_te_should_fine_since_s_serv_f94760: "应该没问题，因为它服务于不同的用户。"
  npc_override_alde_gld_guides_woe_te_siege_battle_te_siege_ba_7d79ff: "攻城战TE是^4d4dff专为一转和二转职业设计的攻城战，排除三转职业。^000000"
  npc_override_alde_gld_guides_woe_te_siege_battles_regions_ka_58bb22: "在卡普拉花园和格洛里亚地区的攻城战中，只允许一转和二转职业以及没有扩展等级的用户参加。"
  npc_override_alde_gld_guides_woe_te_so_you_should_pay_close_02ae53: "所以你应该密切关注。"
  npc_override_alde_gld_guides_woe_te_some_them_related_emperi_508002: "其中一些与华丽金属无关，所以挑战自己吧！"
  npc_override_alde_gld_guides_woe_te_tertiary_job_class_users_52117e: "^4d4dff三转职业和具有扩展等级的用户不允许参加适用攻城战TE规则的格洛里亚和卡普拉花园地区。^000000"
  npc_override_alde_gld_guides_woe_te_warp_gate_here_let_you_c682eb: "这里的传送门可以让你进入格洛里亚地区。"
  npc_override_alde_gld_guides_woe_te_we_call_siege_battle_te_709daa: "我们称之为攻城战TE。"
  npc_override_alde_gld_guides_woe_te_welcome_gloria_c797a9: "欢迎来到格洛里亚。"
  npc_override_alde_gld_guides_woe_te_welcome_gloria_fortress_90026e: "欢迎来到格洛里亚，攻城战TE的要塞。我们与卡普拉和王国的主要王室家族合作提供服务。"
  npc_override_alde_gld_guides_woe_te_welcome_kafra_service_we_f1a0a3: "欢迎来到卡普拉服务~ 我们始终为客户提供最好的服务。"
  npc_override_alde_gld_guides_woe_te_what_kafragarten_74eb94: "什么是卡普拉花园？"
  npc_override_alde_gld_guides_woe_te_who_took_castle_named_af_1d92d1: "谁拿走了以我的名字命名的城堡，W？"
  npc_override_alde_gld_guides_woe_te_whole_city_closely_resem_9f8c73: "整座城市与瓦尔哈拉 realm 非常相似，这里寄托着王室对每个人的期望。"
  npc_override_alde_gld_guides_woe_te_you_now_fortress_gloria_224f1a: "你现在位于格洛里亚的要塞。"
  npc_override_alde_gld_guides_woe_te_you_should_troubles_unde_da82aa: "你应该不难理解新规则，因为它只是对参与资格设定了限制。"
  npc_override_alde_gld_guides_woe_te_you_travel_kafragarten_u_7060c4: "你可以使用传送前往卡普拉花园。"
  npc_override_alde_gld_guides_woe_te_you_travel_luina_using_w_4318ed: "你可以使用这里的传送前往鲁伊纳。"
  npc_override_alde_gld_guides_woe_te_you_travel_these_warps_h_eb3704: "你可以通过这些传送旅行。"
