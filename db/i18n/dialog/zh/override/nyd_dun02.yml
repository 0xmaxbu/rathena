Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_nyd_dun02_quests_13_2_according_expedition_cam_e932c9: "根据远征营的调查，这里有一个类似精灵的异族，以及一个类似巨人的异族。"
  npc_override_nyd_dun02_quests_13_2_actually_residents_villa_804f85: "实际上，这个村庄的居民一直在抵抗。所以为了你的安全，我会把你的位置保存在米德加尔特联军哨站。"
  npc_override_nyd_dun02_quests_13_2_actually_s_going_too_wel_46fc2d: "实际上，进展太顺利了……"
  npc_override_nyd_dun02_quests_13_2_additional_services_plea_73291f: "如需额外服务，请咨询特工加鲁克。"
  npc_override_nyd_dun02_quests_13_2_aewrf_sd_fsd_iyu_ed6e71: "Aewrf sd fsd iyu."
  npc_override_nyd_dun02_quests_13_2_after_laphine_gained_her_2a726a: "- 拉芬完全恢复意识后，她环顾四周，用颤抖的声音说道。-"
  npc_override_nyd_dun02_quests_13_2_after_quite_while_fairy_519143: "过了好一会儿，那个精灵来了。"
  npc_override_nyd_dun02_quests_13_2_after_you_ve_finished_se_bee95c: "搜查完成后，把那张纸条带回来给我。"
  npc_override_nyd_dun02_quests_13_2_again_you_slip_through_m_18443f: "你又从泥泞的树根间滑了过去。"
  npc_override_nyd_dun02_quests_13_2_agoltas_me_0e2cd7: "阿戈尔塔斯……"
  npc_override_nyd_dun02_quests_13_2_ah_8fcb71: "啊！！！"
  npc_override_nyd_dun02_quests_13_2_ah_ah_stop_right_there_8af55a: "啊~啊~站住……"
  npc_override_nyd_dun02_quests_13_2_ah_anyway_you_look_like_07821b: "啊……不管怎样……你看起来遇到了麻烦。发生什么事了？"
  npc_override_nyd_dun02_quests_13_2_ah_don_t_worry_about_003f0d: "啊……别担心纸条的标题。"
  npc_override_nyd_dun02_quests_13_2_ah_finally_i_ve_been_4aace4: "啊，终于。我们一直在和泰拉聊天等你。"
  npc_override_nyd_dun02_quests_13_2_ah_here_um_f9e862: "啊……这里……嗯……"
  npc_override_nyd_dun02_quests_13_2_ah_i_told_you_s_3e58db: "啊，我告诉过你这是不可能的，斯诺伦！"
  npc_override_nyd_dun02_quests_13_2_ah_i_ve_heard_our_5a8ef5: "啊~我从指挥官那里听说过你。你为米德加尔特联军营地做了很多事。总之，你来这里有什么事？"
  npc_override_nyd_dun02_quests_13_2_ah_isn_t_much_s_6f540c: "啊……这不多，但这是巨人使用的硬币。"
  npc_override_nyd_dun02_quests_13_2_ah_just_moment_ago_you_660b2a: "啊……但就在刚才，你还在为某事烦恼。有什么事吗？"
  npc_override_nyd_dun02_quests_13_2_ah_just_time_3784eb: "啊！来得正好！"
  npc_override_nyd_dun02_quests_13_2_ah_looks_like_you_ve_a7a461: "啊，看来你成功了。"
  npc_override_nyd_dun02_quests_13_2_ah_must_fate_we_met_c49203: "啊~我们相遇一定是缘分~"
  npc_override_nyd_dun02_quests_13_2_ah_no_no_s_nothing_633e33: "啊，不，不，没什么。"
  npc_override_nyd_dun02_quests_13_2_ah_please_keep_secret_ot_80a4cf: "啊，请对其他拉芬保密这件事。"
  npc_override_nyd_dun02_quests_13_2_ah_quick_49a13c: "啊，真快。"
  npc_override_nyd_dun02_quests_13_2_ah_right_41361b: "啊，对了。{0}！"
  npc_override_nyd_dun02_quests_13_2_ah_right_i_heard_rune_dc9dee: "啊，对了，我听说^0000ff卢恩-米德加尔特的魔法师^000000知道一种基于语言样本进行研究的方法，你能去请他帮我吗？"
  npc_override_nyd_dun02_quests_13_2_ah_ruffthus_neash_man_ne_6f24c9: "啊……拉弗瑟斯·尼阿什。男人尼萨什·奥德萨拉赫？"
  npc_override_nyd_dun02_quests_13_2_ah_see_here_1dfa7d: "啊……看这里……"
  npc_override_nyd_dun02_quests_13_2_ah_taab_isn_t_flexible_b8e08d: "啊，塔布一点也不灵活。"
  npc_override_nyd_dun02_quests_13_2_ah_thor_thorosa_yee_lu_2d3fd1: "……啊……索尔……索罗萨·耶·卢……唔……"
  npc_override_nyd_dun02_quests_13_2_ah_we_even_understand_ea_399aa9: "啊，我们真的能互相理解吗？"
  npc_override_nyd_dun02_quests_13_2_ah_well_met_35e706: "啊，很高兴见到你！"
  npc_override_nyd_dun02_quests_13_2_ah_well_s_as_easy_a4cdcd: "啊！好吧，这没有我想象的那么简单。这些语言在米德加尔特大陆任何地方都听不到。似乎没有已知的语音规则适用于这里。"
  npc_override_nyd_dun02_quests_13_2_ah_you_here_ff9c67: "啊，你来了。"
  npc_override_nyd_dun02_quests_13_2_ah_you_ve_returned_a7d661: "啊！你回来了！"
  npc_override_nyd_dun02_quests_13_2_aha_now_i_understand_fa7e8a: "啊哈！现在我明白了……"
  npc_override_nyd_dun02_quests_13_2_ahh_feeling_much_better_507a98: "啊哈！感觉好多了！"
  npc_override_nyd_dun02_quests_13_2_ahh_feels_like_home_327adf: "啊哈！感觉像在家一样！！"
  npc_override_nyd_dun02_quests_13_2_ahh_foreign_visitor_47e153: "啊哈！有外来访客！"
  npc_override_nyd_dun02_quests_13_2_ahhhhhhh_cb3522: "啊啊啊啊啊！！！！！！"
  npc_override_nyd_dun02_quests_13_2_alfheim_bf2887: "的阿尔夫海姆。"
  npc_override_nyd_dun02_quests_13_2_alfheim_open_seed_325b09: "阿尔夫海姆随种子而开。"
  npc_override_nyd_dun02_quests_13_2_all_58daf2: "就这些吗？"
  npc_override_nyd_dun02_quests_13_2_all_grown_laphine_one_591523: "所有成年的拉芬都有一个。"
  npc_override_nyd_dun02_quests_13_2_all_i_could_keep_tapping_aac6b1: "- 我只能不停地轻拍他的肩膀……当他静静地哭泣时……-"
  npc_override_nyd_dun02_quests_13_2_all_over_room_so_wrapped_3c380b: "- 整个房间都被包裹起来 -"
  npc_override_nyd_dun02_quests_13_2_all_preperation_done_all_76b8b6: "所有准备工作都已完成，请给我大约一小时来完成这件事。"
  npc_override_nyd_dun02_quests_13_2_all_these_marvelous_feat_3a81f4: "拥有所有这些奇妙功能，只要39,900 Zeny……！！！"
  npc_override_nyd_dun02_quests_13_2_alliance_research_group_683e83: "联盟研究小组对其他智慧生命非常感兴趣。每个国家的秘密特工都在努力与这两个种族沟通，只是信息不足。"
  npc_override_nyd_dun02_quests_13_2_also_they_looking_someth_2cc251: "而且，他们正在寻找能治愈受伤拉芬的东西……"
  npc_override_nyd_dun02_quests_13_2_although_i_don_t_much_cccf8b: "虽然我能提供的有限，但请收下这些硬币。"
  npc_override_nyd_dun02_quests_13_2_amount_mineral_627303: "但这种矿石的数量"
  npc_override_nyd_dun02_quests_13_2_ancient_rune_midgarts_ki_0ed1f2: "古代卢恩-米德加尔特王国曾使用某种魔法将大量信息存储在魔法宝石中……用宝石作为存储……"
  npc_override_nyd_dun02_quests_13_2_ancient_rune_midgarts_ki_d06203: "古代卢恩-米德加尔特王国曾使用某种魔法将大量信息存储在魔法宝石中……用宝石作为存储……"
  npc_override_nyd_dun02_quests_13_2_and_4d40c7: "还有{0}……"
  npc_override_nyd_dun02_quests_13_2_and_7bf7b1: "然后呢？"
  npc_override_nyd_dun02_quests_13_2_and_f0fa6b: "还有……"
  npc_override_nyd_dun02_quests_13_2_anudur_amandana_goth_nar_0c9cdf: "阿努杜尔·阿曼达纳·戈斯·纳尔！"
  npc_override_nyd_dun02_quests_13_2_any_other_seed_flower_fa7d2d: "任何其他花的种子……"
  npc_override_nyd_dun02_quests_13_2_anyhow_you_going_ask_fai_81b442: "不管怎样，你要去问那个精灵关于奥根的事，对吧？"
  npc_override_nyd_dun02_quests_13_2_anything_try_make_me_bel_1d1b1a: "……什么都行。试着让我相信你——外来者——和那个拉芬。"
  npc_override_nyd_dun02_quests_13_2_anyway_7479d2: "不管怎样……"
  npc_override_nyd_dun02_quests_13_2_anyway_fairy_now_prison_3cc395: "不管怎样，那个精灵现在被关在监狱里。"
  npc_override_nyd_dun02_quests_13_2_anyway_my_name_gill_bfec60: "不管怎样，我的名字是^0000FF吉尔^000000。"
  npc_override_nyd_dun02_quests_13_2_anyways_c72849: "……不管怎样。"
  npc_override_nyd_dun02_quests_13_2_anyways_how_i_get_out_792b8b: "不管怎样……我怎么才能离开这里？"
  npc_override_nyd_dun02_quests_13_2_anyways_i_favor_ask_you_fe702f: "不管怎样，我有件事想请你帮忙。可以吗？"
  npc_override_nyd_dun02_quests_13_2_anyways_now_we_ve_got_98923a: "不管怎样，现在我们有主意了，我会先把这第一件作品给你。"
  npc_override_nyd_dun02_quests_13_2_anyways_shortly_after_og_5bed37: "不管怎样，奥根失踪后不久那个精灵就出现了……这太可疑了……"
  npc_override_nyd_dun02_quests_13_2_apeu_hjsu_opuer_37fd77: "阿普·赫苏·奥普尔"
  npc_override_nyd_dun02_quests_13_2_apparently_these_people_3a6945: "显然这些人说着一种我们人类无法理解的奇怪语言……但似乎没人能记住他们的语言听起来是什么样的。"
  npc_override_nyd_dun02_quests_13_2_appears_like_s_holding_s_c52bd5: "而且它怀里似乎抱着什么东西……"
  npc_override_nyd_dun02_quests_13_2_approximate_location_eba27e: "大致位置是……"
  npc_override_nyd_dun02_quests_13_2_arc_asked_me_find_you_08b25a: "阿克让我来找你。所以我来了。"
  npc_override_nyd_dun02_quests_13_2_arc_cf7f15: "阿克？"
  npc_override_nyd_dun02_quests_13_2_arc_gave_me_three_yggdra_f91fd6: "阿克给了我三个世界树果实然后……"
  npc_override_nyd_dun02_quests_13_2_arc_i_get_some_rest_55df59: "阿克……我要休息一下……"
  npc_override_nyd_dun02_quests_13_2_arc_looks_around_check_i_8fb116: "- 阿克环顾四周检查是否还有其他人。确认你独自一人后，他压低声音继续讲述他的故事。-"
  npc_override_nyd_dun02_quests_13_2_arc_looks_like_he_thrown_f27eea: "- 阿克看起来对某事陷入了困惑。-"
  npc_override_nyd_dun02_quests_13_2_arc_suddenly_began_gathe_103667: "- 阿克突然开始收拾他的装备。-"
  npc_override_nyd_dun02_quests_13_2_area_off_limits_unauthor_375c1c: "未经授权人员禁止进入此区域。"
  npc_override_nyd_dun02_quests_13_2_area_restricted_unless_y_9d29f6: "除非获得许可，否则此区域禁止进入。"
  npc_override_nyd_dun02_quests_13_2_argh_why_b186f1: ".. 啊……为什么不呢？！"
  npc_override_nyd_dun02_quests_13_2_arpe_yu_osp_sad_4946df: "阿尔佩？尤·奥斯普·萨德？"
  npc_override_nyd_dun02_quests_13_2_arunafeltz_linguist_shou_ebdde0: "^0000ff阿鲁纳佩尔特兹的语言学家^000000应该在联盟总部二楼。"
  npc_override_nyd_dun02_quests_13_2_as_expected_2d9ef3: "不愧是{0}！！"
  npc_override_nyd_dun02_quests_13_2_as_grenouille_told_you_641461: "正如格雷努耶告诉你的。-"
  npc_override_nyd_dun02_quests_13_2_as_he_rubbing_his_closin_36ec57: "- 当他揉着快要闭上的眼睛时。-"
  npc_override_nyd_dun02_quests_13_2_as_i_examine_mineral_6125c4: "当我检查这种矿石时"
  npc_override_nyd_dun02_quests_13_2_as_matter_fact_we_trying_23d958: "事实上，我们尽量避免与马努克的巨人接触，所以我们互不侵犯对方的领土。"
  npc_override_nyd_dun02_quests_13_2_as_our_conversation_reac_d21937: "既然我们的谈话已经进行到这里，你应该知道我的请求是什么了吧？"
  npc_override_nyd_dun02_quests_13_2_as_soon_as_you_done_37d266: "一旦你收集完浆果，立刻把它们带到萨法村庄！！！"
  npc_override_nyd_dun02_quests_13_2_as_you_dug_up_pile_572ef9: "- 当你挖开一堆土时，-"
  npc_override_nyd_dun02_quests_13_2_as_you_handed_over_gem_4fb5b4: "- 当你把宝石递过去时，-"
  npc_override_nyd_dun02_quests_13_2_as_you_see_my_name_eb9722: "如你所见，我的名字是^0000FF巴泽特·茶黑^000000。"
  npc_override_nyd_dun02_quests_13_2_as_you_see_there_re_292780: "如你所见，这里有很多东西"
  npc_override_nyd_dun02_quests_13_2_asd_fo_sdj_fso_df_46d40d: "阿斯德·弗·斯德·弗索·德夫。"
  npc_override_nyd_dun02_quests_13_2_ash_vacuum_several_monst_89cbe1: "灰烬真空中有几种怪物，我觉得它们可以成为可爱的宠物。"
  npc_override_nyd_dun02_quests_13_2_assassins_buried_magical_a28df2: "刺客们在村庄附近埋下了魔法宝石，而他们并未察觉。"
  npc_override_nyd_dun02_quests_13_2_assassins_installed_trap_fc7323: "刺客们在埋下宝石时安装了陷阱来保护宝石。"
  npc_override_nyd_dun02_quests_13_2_assassins_who_charge_bur_cad5cd: "但是，负责埋藏这些宝石的刺客……他们正在执行其他任务，所以不能去取回那些宝石。"
  npc_override_nyd_dun02_quests_13_2_auch_c30410: "哎哟！！！"
  npc_override_nyd_dun02_quests_13_2_available_customers_0304d7: "可供客户使用的"
  npc_override_nyd_dun02_quests_13_2_aweo_wpe_48210c: "阿韦奥·韦普？"
  npc_override_nyd_dun02_quests_13_2_awq_ouwn_ksudh_bud_ds_1d2018: "阿沃·欧文·克苏德·布德·德斯。"
  npc_override_nyd_dun02_quests_13_2_back_right_c459dc: "右边的背面……"
  npc_override_nyd_dun02_quests_13_2_basic_skill_level_eff4ec: "基本技能等级6才能"
  npc_override_nyd_dun02_quests_13_2_bazett_reading_detailed_856613: " - 巴泽特正在阅读详细内容 - "
  npc_override_nyd_dun02_quests_13_2_because_you_t_yourself_a_fa31d6: "因为你自己无法处理这些复杂的情况？"
  npc_override_nyd_dun02_quests_13_2_bee_beep_32a6dc: "哔 哔 -"
  npc_override_nyd_dun02_quests_13_2_before_you_statue_made_s_6420f0: "你面前是一座由石头和木头制成的雕像。它栩栩如生，令人毛骨悚然。"
  npc_override_nyd_dun02_quests_13_2_behalf_sapha_i_extend_ou_7d76e4: "我代表萨法向你表示感谢。"
  npc_override_nyd_dun02_quests_13_2_belonged_ogen_b496ab: "这是奥根的……"
  npc_override_nyd_dun02_quests_13_2_between_huge_roots_there_3520b4: "在巨大的树根之间，有一个通往地下洞穴的洞。"
  npc_override_nyd_dun02_quests_13_2_big_flower_alfheim_lied_30a6a3: "阿尔夫海姆的一朵大花被放置在那里"
  npc_override_nyd_dun02_quests_13_2_big_thorns_used_as_footh_c56184: "大刺可以用作踏脚处。"
  npc_override_nyd_dun02_quests_13_2_booowoong_4057b6: "- 嗡—— -"
  npc_override_nyd_dun02_quests_13_2_bradium_been_refined_pro_4f6879: "……这块布拉迪姆没有经过适当的精炼……"
  npc_override_nyd_dun02_quests_13_2_bradium_certainly_precio_e1c4a2: "布拉迪姆……对萨法来说确实是一种珍贵的矿石。"
  npc_override_nyd_dun02_quests_13_2_bradium_stem_our_life_e31798: "布拉迪姆是我们生命的根基。"
  npc_override_nyd_dun02_quests_13_2_bradium_we_extract_speci_0ae054: "从布拉迪姆中我们可以提取我们生存所需的特殊元素。"
  npc_override_nyd_dun02_quests_13_2_bradium_what_prevents_th_2afea4: "而布拉迪姆正是阻止它们石化的东西。"
  npc_override_nyd_dun02_quests_13_2_bring_back_those_two_gem_6ebd6e: "把那两颗宝石带回来，那会对我帮助很大。"
  npc_override_nyd_dun02_quests_13_2_buried_bradium_exhausted_74c6af: "但埋藏的布拉迪姆总有一天会耗尽，所以我们科学家必须为后代寻找替代方案。"
  npc_override_nyd_dun02_quests_13_2_buryurdath_ee_nekoiyaz_e_344bd7: "布尔尤达斯·伊·内科伊亚兹·埃尔·莫德鲁阿拉·耶·维尔德杜杜尔·耶·塞尤罗萨·乌·雷努德努德·拉"
  npc_override_nyd_dun02_quests_13_2_calm_down_c53b12: "冷静！"
  npc_override_nyd_dun02_quests_13_2_calm_down_i_couldn_t_8ba815: "冷静。我还没能确认被俘的拉芬是谁。"
  npc_override_nyd_dun02_quests_13_2_camp_yours_located_area_fd86ef: "你们的营地位于我们两族之间的中立区域……"
  npc_override_nyd_dun02_quests_13_2_canceled_a341ef: "已取消。"
  npc_override_nyd_dun02_quests_13_2_cancelled_a1bf92: "已取消"
  npc_override_nyd_dun02_quests_13_2_captured_fairy_may_terra_92871f: "被俘的精灵可能是泰拉。-"
  npc_override_nyd_dun02_quests_13_2_cat_trading_s_available_6e7bfe: "猫咪贸易提供的服务如下。"
