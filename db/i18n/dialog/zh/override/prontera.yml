  npc_override_prontera_enchan_illusion_dungeons_as_you_may_guessed_your_c3a835: "As you may have guessed, your equipment will transform into something new after this."
  npc_override_prontera_enchan_illusion_dungeons_bear_wanting_459608: "[Bear Wanting {0}]"
  npc_override_prontera_enchan_illusion_dungeons_benefits_both_us_i_need_a8eeb8: "This benefits both of us. I need Illusion Stones for my studies, and you need powerful equipment for your adventures."
  npc_override_prontera_enchan_illusion_dungeons_benefits_both_us_let_me_5e0e24: "This benefits both of us. Let me know if you're interested in my proposition."
  npc_override_prontera_enchan_illusion_dungeons_best_all_illusion_equipm_a7c47f: "This is the best of all Illusion equipment. There's no technology available in this day and age that can enchant it. Even the most skilled enchanter can't do that."
  npc_override_prontera_enchan_illusion_dungeons_bring_piece_refined_equi_a0a552: "Bring ^0000cda piece of refined equipment, Illusion Stones^000000, and various materials that are only found in this place. I'll ^0000cdupgrade the equipment, weapon, armor, or accessory?^000000for you."
  npc_override_prontera_enchan_illusion_dungeons_cave_very_mysterious_i_m_afe0d7: "This cave is very mysterious, but I'm not strong enough to explore it by myself."
  npc_override_prontera_enchan_illusion_dungeons_come_back_if_interested_eded0a: "Come back if interested."
  npc_override_prontera_enchan_illusion_dungeons_conversation_cannot_proc_50b03f: "Conversation cannot proceed because you have too many items."
