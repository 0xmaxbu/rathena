  npc_override_prontera_enchan_arm_however_you_keep_mind_if_61b8bc: "不过你要记住，如果身上有两件相同的防具，附魔会按照它们在背包中的顺序生效。"
  npc_override_prontera_enchan_arm_i_am_charge_enchanting_a_665341: "我负责给防具附魔。简单说，我一直在研究如何强化防具。"
