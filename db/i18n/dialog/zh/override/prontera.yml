  npc_override_prontera_enchan_illusion_dungeons_i_ll_help_you_if_214380: "I'll help you if you get a lot here."
  npc_override_prontera_enchan_illusion_dungeons_i_ll_try_enchant_ability_2c0431: "I'll try to enchant the {0} ability for your item. ^ff0000Its existing Refining level and cards will not be damaged. It will not be destroyed, even if this attempt fails.^000000 Do you want to continue?"
