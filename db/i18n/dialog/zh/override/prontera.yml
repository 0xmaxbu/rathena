  npc_override_prontera_clothing_buff_removal_while_looks_good_you_als_b8d4c7: "While it looks good on you, it can also get really annoying. I can get rid of it with a single hand gesture!! I will arrange it neatly. If you are ready, choose your option!"
  npc_override_prontera_clothing_buff_removal_you_unable_participate_b_d22703: "Are you unable to participate in battle because of clothing buffs? It has to be annoying."
  npc_override_prontera_enchan_arm_cards_gone_a67c9e: "以及卡片都会消失。"
  npc_override_prontera_enchan_arm_case_enchantment_may_app_458464: "那样的话，附魔可能会作用到你不想要的那件上。所以为保险起见，只带^5555ff一件想要附魔的防具^000000来……"
  npc_override_prontera_enchan_arm_enchanting_awesome_skill_19dfd9: "附魔是一种惊人的技术，能将神秘的状态之力注入防具隐藏孔洞中。"
  npc_override_prontera_enchan_arm_existing_refine_level_ar_10b96a: "装备的现有精炼等级"
  npc_override_prontera_enchan_arm_first_most_importantly_da4778: "首先，也是最重要的一点。"
