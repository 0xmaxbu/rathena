  npc_override_prontera_enchan_arm_i_ve_been_studying_ways_a04325: "我一直在研究如何强化防具，使其能力最大化。"
  npc_override_prontera_enchan_arm_if_any_chance_you_want_b89ad0: "如果你碰巧想给防具附魔，带上 400,000 Zeny 和你想附魔的防具，就可以开始了。"
  npc_override_prontera_enchan_arm_menu_hmm_665066: "嗯……让我考虑一下.:开始吧."
  npc_override_prontera_enchan_arm_menu_non_400944: "无孔防具.:有孔防具.:高级防具.:下次再来."
  npc_override_prontera_enchan_arm_now_you_nice_day_56ee4d: "祝你今天愉快。"
