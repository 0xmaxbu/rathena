Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_prontera_MemorialDay_2008_ah_thank_you_your_hard_1f1fe2: "啊，感谢你辛勤工作，你把它们全都带来了。"
  npc_override_prontera_MemorialDay_2008_ah_you_fluffy_new_towel_7348b0: "啊，你现在有一条柔软的新毛巾了，我甚至把你的名字绣在了上面。"
  npc_override_prontera_MemorialDay_2008_although_no_sculptured_m_071952: "-虽然没有雕刻的大理石会升起以纪念他们，-"
  npc_override_prontera_MemorialDay_2008_arthur_ashe_f7f062: "- 亚瑟·阿什 -"
  npc_override_prontera_MemorialDay_2008_best_thing_giving_you_bo_dabccc: "最好的办法是给你两个，但是……"
  npc_override_prontera_MemorialDay_2008_bring_me_fabric_fluffs_fbec2c: "给我带来^FF000030块布料和20个绒毛^000000。"
  npc_override_prontera_MemorialDay_2008_daniel_webster_03712f: "-丹尼尔·韦伯斯特-"
  npc_override_prontera_MemorialDay_2008_don_t_come_crying_me_8ff6e2: "如果有人决定在你的家附近修建高速公路，别来找我哭！"
  npc_override_prontera_MemorialDay_2008_don_t_panic_a0daab: "不要惊慌！"
  npc_override_prontera_MemorialDay_2008_douglas_adams_ac4bec: "- 道格拉斯·亚当斯。-"
  npc_override_prontera_MemorialDay_2008_excellent_you_ve_brought_9ae69b: "太棒了，你把它们全都带来了。"
  npc_override_prontera_MemorialDay_2008_fine_unprepared_cef8ed: "好吧，那就毫无准备吧！"
  npc_override_prontera_MemorialDay_2008_give_me_moment_d69717: "给我一点时间。"
  npc_override_prontera_MemorialDay_2008_go_help_grast_then_come_ecfea6: "去帮助格拉斯特，然后再回来。"
  npc_override_prontera_MemorialDay_2008_go_plaque_o_clock_direct_3701d0: "去普隆德拉12点钟方向的纪念碑那里，开始你的旅程吧！"
  npc_override_prontera_MemorialDay_2008_good_way_you_even_know_0f4705: "很好。顺便问一下，你知道毛巾是用来做什么的吗？"
  npc_override_prontera_MemorialDay_2008_great_91bb26: "太棒了！"
  npc_override_prontera_MemorialDay_2008_hahaha_db0ba3: "哈哈哈！"
  npc_override_prontera_MemorialDay_2008_hahahahahaha_cough_cough_e21b62: "哈哈哈哈哈哈！！咳咳"
  npc_override_prontera_MemorialDay_2008_here_s_gift_you_7815e2: "这是给你的礼物。"
  npc_override_prontera_MemorialDay_2008_hey_yo_91d54c: "嘿，哟！"
  npc_override_prontera_MemorialDay_2008_hmm_i_think_you_need_d0fe4b: "嗯，我觉得你还需要再多一点。"
  npc_override_prontera_MemorialDay_2008_hmm_you_need_some_more_1dd6b2: "嗯，你还需要更多东西……"
  npc_override_prontera_MemorialDay_2008_how_you_like_test_your_96bf3d: "{0}，你想试试你的运气吗？"
  npc_override_prontera_MemorialDay_2008_how_you_supposed_go_your_e46d0a: "没有毛巾，你怎么能继续你的旅程！？"
  npc_override_prontera_MemorialDay_2008_i_crushed_all_items_toge_5a56c5: "我把所有物品都压碎，为你做成了更紧凑的形式。"
  npc_override_prontera_MemorialDay_2008_i_hope_you_ll_learn_0cfcca: "我希望你在收集这些材料的过程中能学到宝贵的一课。"
  npc_override_prontera_MemorialDay_2008_i_hope_you_ll_remember_245f63: "我希望你能记住，你的自由和幸福是建立在战争中数千条牺牲的生命之上的。"
  npc_override_prontera_MemorialDay_2008_i_like_give_you_small_5dd8af: "我想给你一个小礼物，以感谢你的服务。"
  npc_override_prontera_MemorialDay_2008_i_ll_waiting_your_return_979478: "我会等待你的归来。"
  npc_override_prontera_MemorialDay_2008_i_m_so_glad_meet_bd04c5: "我很高兴能遇到一个理解阵亡将士纪念日意义的人。"
  npc_override_prontera_MemorialDay_2008_i_may_gone_where_i_6f9149: "-我可能没有到达我原本想去的地方，-"
  npc_override_prontera_MemorialDay_2008_i_provide_you_all_materi_12eb4e: "我可以为你提供所有材料。"
  npc_override_prontera_MemorialDay_2008_i_think_i_ended_up_353385: "-但我想我最终到达了需要到达的地方。-"
  npc_override_prontera_MemorialDay_2008_i_told_you_go_speak_b6e19b: "我告诉过你去普隆德拉和格拉斯特说话！"
  npc_override_prontera_MemorialDay_2008_i_wonder_how_many_people_cbf8d8: "我想知道有多少人记得他们……"
  npc_override_prontera_MemorialDay_2008_if_i_provide_you_all_163746: "如果我为你提供所有材料，我就不会为你的服务感谢你了。"
  npc_override_prontera_MemorialDay_2008_if_you_bring_me_material_fd6ced: "如果你给我带来材料，我可以为你做一条毛巾。"
  npc_override_prontera_MemorialDay_2008_if_you_feel_too_burdened_6db0ec: "如果你觉得收集所有材料太有负担了，"
  npc_override_prontera_MemorialDay_2008_if_you_feel_too_burdened_bdbdd4: "如果你觉得收集所有材料太有负担了，我可以为你提供所有材料。"
  npc_override_prontera_MemorialDay_2008_if_you_like_go_journey_93c5eb: "如果你想踏上纪念阵亡将士纪念日的旅程，你应该给我带来我要求的一些材料。"
  npc_override_prontera_MemorialDay_2008_if_you_like_pay_tribute_28abc4: "但如果你想向伟大的士兵致敬，我会帮你做好准备。"
  npc_override_prontera_MemorialDay_2008_if_you_think_just_anothe_77624c: "如果你认为这只是另一个假期，我就不浪费口舌了。"
  npc_override_prontera_MemorialDay_2008_last_message_19465e: "-这是最后一条信息。-"
  npc_override_prontera_MemorialDay_2008_let_s_dust_off_towel_919def: "'让我们用毛巾把它擦干净。'"
  npc_override_prontera_MemorialDay_2008_life_like_grapefruit_5b61f4: "生活……就像一颗葡萄柚。"
  npc_override_prontera_MemorialDay_2008_listen_closely_6d97fd: "仔细听。"
  npc_override_prontera_MemorialDay_2008_mad_sago_lauds_appears_m_71bca5: "***疯狂的萨戈·劳兹似乎在自言自语***"
  npc_override_prontera_MemorialDay_2008_memorial_day_sad_yet_glo_997cd0: "阵亡将士纪念日是一个悲伤而又光荣的日子。"
  npc_override_prontera_MemorialDay_2008_menu_i_362b44: "我想是吧……:你疯了吗？"
  npc_override_prontera_MemorialDay_2008_menu_i_68501c: "我会收集剩下的。:给我材料。"
  npc_override_prontera_MemorialDay_2008_menu_left_9bc81d: "左手。:右手。"
  npc_override_prontera_MemorialDay_2008_menu_sure_df458f: "当然。:不，我很忙。"
  npc_override_prontera_MemorialDay_2008_mistake_think_you_solve_1bd80a: "认为你只用土豆就能解决任何重大问题是错误的。"
  npc_override_prontera_MemorialDay_2008_msg_65f284: "42！"
  npc_override_prontera_MemorialDay_2008_must_what_lauds_talking_a2a47f: "'这一定是劳兹在说的。'"
  npc_override_prontera_MemorialDay_2008_my_what_da433a: "我的什么？"
  npc_override_prontera_MemorialDay_2008_no_problem_i_ll_give_7dc3dc: "没问题，我会给你所有补给……"
  npc_override_prontera_MemorialDay_2008_nor_engraved_stone_bear_b880cc: "-也没有雕刻的石头记载他们的功绩，-"
  npc_override_prontera_MemorialDay_2008_now_before_you_pay_tribu_424ca2: "现在，在你向阵亡士兵致敬之前，你必须做好适当的准备。"
  npc_override_prontera_MemorialDay_2008_now_go_visit_plaque_o_47617a: "现在去普隆德拉12点钟方向的纪念碑参观吧。"
  npc_override_prontera_MemorialDay_2008_now_please_bring_all_the_0ac0d7: "现在，请把所有这些材料带给劳兹。"
  npc_override_prontera_MemorialDay_2008_oh_i_see_i_guess_ad7c79: "哦，我明白了。我猜你最近很忙吧？"
  npc_override_prontera_MemorialDay_2008_oh_isn_t_towel_memory_eab3ac: "哦，那不是一条记忆毛巾吗？"
  npc_override_prontera_MemorialDay_2008_oh_you_ve_brought_everyt_e24ecb: "哦，你把我要求的所有东西都带来了。"
  npc_override_prontera_MemorialDay_2008_oh_you_ve_brought_materi_2a4e2d: "哦，你把我要求的材料带来了。"
  npc_override_prontera_MemorialDay_2008_oh_you_ve_brought_them_3f975c: "哦，你把它们全都带来了。"
  npc_override_prontera_MemorialDay_2008_okay_which_hand_you_like_476f59: "好的，你想选哪只手？"
  npc_override_prontera_MemorialDay_2008_one_each_pet_incubator_f_9fb6ec: "^FF0000各一个宠物孵化器、爆竹、波利娃娃和花束"
  npc_override_prontera_MemorialDay_2008_one_each_red_potion_gree_fc6a30: "^FF0000各一个红色药水、绿色药水、觉醒药水和蝴蝶翅膀^000000。"
  npc_override_prontera_MemorialDay_2008_one_each_trap_yggdrasil_f8f667: "^FF0000各一个陷阱、世界树之叶、蓝色宝石、水晶镜、肉和胡萝卜^000000。"
  npc_override_prontera_MemorialDay_2008_oops_you_haven_t_brought_fc72cc: "哎呀，你还没有带来所有材料。"
  npc_override_prontera_MemorialDay_2008_please_bring_me_one_each_3a57e3: "请给我带来^FF0000各一个陷阱、世界树之叶、蓝色宝石、水晶镜、肉和胡萝卜。^000000"
  npc_override_prontera_MemorialDay_2008_please_bring_me_one_each_61b766: "请给我带来^FF0000各一个红色药水、绿色药水、觉醒药水和蝴蝶翅膀^000000。"
  npc_override_prontera_MemorialDay_2008_please_bring_me_one_each_94884f: "请给我带来^FF0000各一个宠物孵化器、爆竹、波利娃娃和花束^000000。"
  npc_override_prontera_MemorialDay_2008_please_bring_them_lauds_02d34b: "请把它们带给劳兹。"
  npc_override_prontera_MemorialDay_2008_please_don_t_alarmed_eve_b62be9: "即使他开始胡言乱语，也请不要惊慌。"
  npc_override_prontera_MemorialDay_2008_please_give_them_me_than_30f80a: "请把它们给我。顺便说一句，感谢你的辛勤工作。"
  npc_override_prontera_MemorialDay_2008_please_make_sure_you_ll_ba7e15: "请确保你必须给我带来"
  npc_override_prontera_MemorialDay_2008_please_make_sure_you_nee_0f9128: "请确保你需要给我带来"
  npc_override_prontera_MemorialDay_2008_s_dusty_old_plaque_9273ce: "- 这是一块布满灰尘的旧纪念碑。-"
  npc_override_prontera_MemorialDay_2008_s_good_idea_0ebfe8: "这是个好主意。"
  npc_override_prontera_MemorialDay_2008_s_orange_squishy_few_pip_0393b6: "它是橙色的，软软的，里面有几个籽，有些人早餐吃半个。"
  npc_override_prontera_MemorialDay_2008_s_very_important_date_fcee86: "这是一个非常重要的日子！"
  npc_override_prontera_MemorialDay_2008_s_your_call_fbb58d: "这由你决定，{0}。"
  npc_override_prontera_MemorialDay_2008_say_how_you_like_go_9c4137: "话说，你想踏上纪念阵亡将士纪念日的旅程吗？"
  npc_override_prontera_MemorialDay_2008_say_you_learned_anything_6bc973: "话说，你从旅途中学到了什么吗？"
  npc_override_prontera_MemorialDay_2008_seems_you_re_just_carryi_5fb0ea: "看起来你只是带着它，却不理解它的意义。"
  npc_override_prontera_MemorialDay_2008_sigh_i_really_tell_you_2e25dd: "*叹气* 我真的必须再告诉你一遍吗？！"
  npc_override_prontera_MemorialDay_2008_so_did_you_bring_towel_db766d: "那么，你带来毛巾的材料了吗？"
  npc_override_prontera_MemorialDay_2008_stop_trying_give_me_your_f8b6a6: "别再试图把你的垃圾给我！"
  npc_override_prontera_MemorialDay_2008_then_i_ll_waiting_your_dae1e3: "那我会等待你的归来。"
  npc_override_prontera_MemorialDay_2008_then_i_shall_make_you_dccd07: "那么我会按照承诺为你制作一条记忆毛巾。"
  npc_override_prontera_MemorialDay_2008_then_listen_me_carefully_66612a: "那就仔细听我说。"
  npc_override_prontera_MemorialDay_2008_there_point_story_tempor_80761e: "这个故事有一个重点，但它暂时逃离了编年史家的脑海。"
  npc_override_prontera_MemorialDay_2008_there_s_another_message_d6ec8a: "-还有另一条信息。-"
  npc_override_prontera_MemorialDay_2008_there_you_go_19b809: "给你。"
  npc_override_prontera_MemorialDay_2008_there_you_go_b7b297: "给你！"
  npc_override_prontera_MemorialDay_2008_they_last_batch_material_99ec5f: "它们是最后一批材料。"
  npc_override_prontera_MemorialDay_2008_those_items_useful_me_al_4ba369: "那些物品对我完全没用。"
  npc_override_prontera_MemorialDay_2008_towel_about_most_massive_71c605: "毛巾是冒险者能拥有的最有用、最实用的东西之一。"
  npc_override_prontera_MemorialDay_2008_true_heroism_remarkably_8b339f: "-真正的英雄主义是异常清醒的，非常不戏剧化的。-"
  npc_override_prontera_MemorialDay_2008_urge_serve_others_whatev_73e77a: "- 而是不惜一切代价为他人服务的冲动。 -"
  npc_override_prontera_MemorialDay_2008_urge_surpass_all_others_ae2d46: "-它不是不惜一切代价超越所有人的冲动，-"
  npc_override_prontera_MemorialDay_2008_very_important_date_reme_d6cbb1: "一个值得记住的非常重要的日子！"
  npc_override_prontera_MemorialDay_2008_very_important_know_what_eede2d: "知道我们今天在庆祝什么非常重要，你不觉得吗？"
  npc_override_prontera_MemorialDay_2008_way_he_had_unfortunate_a_94f7ad: "顺便说一下，他遭遇了一场不幸的事故，有点失去了理智。"
  npc_override_prontera_MemorialDay_2008_what_d7df74: "这是什么！？"
  npc_override_prontera_MemorialDay_2008_what_shame_you_should_go_9bec28: "真可惜！你应该去和^FF0000普隆德拉的格拉斯特^000000说话。"
  npc_override_prontera_MemorialDay_2008_what_these_they_aren_t_f41744: "这些是什么？它们不够吗？！"
  npc_override_prontera_MemorialDay_2008_what_why_you_giving_me_1d0981: "什么？为什么把你的垃圾给我！"
  npc_override_prontera_MemorialDay_2008_what_you_doing_there_f9a337: "你在那里做什么！？"
  npc_override_prontera_MemorialDay_2008_what_you_mean_you_just_3ffa18: "你什么意思，你刚才就在那里？"
  npc_override_prontera_MemorialDay_2008_what_you_still_doing_her_243233: "你还在这里做什么？"
  npc_override_prontera_MemorialDay_2008_where_your_towel_845f9d: "你的毛巾在哪里！？"
  npc_override_prontera_MemorialDay_2008_without_your_towel_you_l_4e43b6: "没有毛巾你会迷失的！"
  npc_override_prontera_MemorialDay_2008_yet_their_remembrance_as_2796b1: "-然而他们的记忆将和他们所尊敬的土地一样持久。-"
  npc_override_prontera_MemorialDay_2008_you_brought_materials_i_d42b6c: "你把我要求的材料带来了吗？"
  npc_override_prontera_MemorialDay_2008_you_know_what_day_ce083e: "你知道今天是什么日子吗！？"
  npc_override_prontera_MemorialDay_2008_you_ll_bring_me_more_421842: "你之后还需要给我带来更多材料。"
  npc_override_prontera_MemorialDay_2008_you_met_lauds_863fae: "你见过劳兹了吗？"
  npc_override_prontera_MemorialDay_2008_you_rue_day_f57af4: "^FF0000你会后悔的！^000000"
  npc_override_prontera_MemorialDay_2008_you_see_i_two_different_7e71a3: "你看，我的每只手里都有不同的礼物。"
  npc_override_prontera_MemorialDay_2008_you_see_message_cleaned_2aaf2d: "- 你看到了从擦干净的纪念碑上留下的信息。-"
  npc_override_prontera_MemorialDay_2008_you_should_going_plaque_a05e47: "你应该去纪念碑那里！"
  npc_override_prontera_MemorialDay_2008_you_thank_me_later_extra_0d8451: "你可以稍后感谢我提供的额外服务。"
  npc_override_prontera_MemorialDay_2008_you_ve_selected_my_left_4bf142: "你选择了我的左手。"
  npc_override_prontera_MemorialDay_2008_you_ve_selected_my_right_1a49ff: "你选择了我的右手。"
  npc_override_prontera_RWC_2011_adios_d4c747: "再见！"
  npc_override_prontera_RWC_2011_agent_muttered_something_aa0c80: "- 代理自言自语着什么。 -"
  npc_override_prontera_RWC_2011_arrgg_you_ignoring_me_be_513eff: "Arrgg！！你是因为我是新人就无视我吗？通常人们都会听的..."
  npc_override_prontera_RWC_2011_cannot_achieved_all_alon_b1ed00: "但这无法独自完成。你的朋友将在比赛中扮演重要角色。"
  npc_override_prontera_RWC_2011_eventually_my_patience_r_92f73a: "但最终，我的耐心和克制的性格激励我成为了RWC2011的代理！"
  npc_override_prontera_RWC_2011_first_i_start_attaching_0d3258: "首先，我将开始贴你找到的卡片...剩下的卡片我明天再取。"
  npc_override_prontera_RWC_2011_good_luck_e80771: "祝你好运！"
  npc_override_prontera_RWC_2011_he_looks_you_imploring_e_e47a00: "- 他用恳求的眼神看着你。 -"
  npc_override_prontera_RWC_2011_he_thought_something_the_920c1f: "- 他想了些什么，然后看着你的眼睛。 -"
  npc_override_prontera_RWC_2011_here_gifts_i_promised_le_c7eef4: "这是我承诺的礼物...让我看看..."
  npc_override_prontera_RWC_2011_his_brimming_small_eyes_bd9c91: "- 他那盈满泪水的小眼睛似乎在告诉你什么。^FF0000请再跟我说话...^000000 -"
  npc_override_prontera_RWC_2011_his_twinkling_small_eyes_ebe57f: "- 他那闪烁的小眼睛似乎在告诉你什么。^FF0000请再跟我说话...^000000 -"
  npc_override_prontera_RWC_2011_huh_b1cd39: "... 嗯...？"
  npc_override_prontera_RWC_2011_i_afraid_being_attacked_55466b: "我害怕在街头贴RWC2011蓝色卡片时被怪物攻击。"
  npc_override_prontera_RWC_2011_i_am_adventurer_i_don_8aec77: "我不是冒险者，我甚至不知道怎么买卖东西。有时看到冒险者我就很高兴。你知道...我只是一个普通的男孩。"
  npc_override_prontera_RWC_2011_i_am_new_agent_8bcec3: "我是...一个新代理。"
  npc_override_prontera_RWC_2011_i_am_supposed_attach_blu_dcd09c: "我应该在全世界贴上带有RWC2011字样的蓝色卡片来宣传活动。但是...但是..."
  npc_override_prontera_RWC_2011_i_had_turned_off_light_7152aa: "我关了灯，正准备睡觉，然后透过窗户看到了这道明亮的光。"
