  npc_override_prontera_easter_2010_you_silent_person_ha_ha_cfd006: "你是个沉默的人。哈哈。"
  npc_override_prontera_easter_2010_you_so_brave_33f8be: "你真勇敢。"
  npc_override_prontera_easter_2010_you_want_make_deal_9a0725: "你想做交易吗？"
  npc_override_prontera_easter_2010_your_bag_too_full_5b4f1e: "你的背包太满了。"
  npc_override_prontera_easter_2010_your_experience_enough_f02416: "但你的经验还不够。"
  npc_override_prontera_easter_2010_zeny_3d3dce: "^B8860B500,000 Zeny^000000。"
  npc_override_prontera_easter_2010_zeny_ab1444: "^B8860B400,000 Zeny。"
  npc_override_prontera_easter_2010_zeny_b1b542: "^B8860B450,000 Zeny^000000。"
  npc_override_prontera_easter_2010_zeny_e2adc1: "^B8860B480,000 Zeny^000000。"
  npc_override_prontera_enchan_arm_cards_gone_a67c9e: "以及卡片都会消失。"
  npc_override_prontera_enchan_arm_case_enchantment_may_app_458464: "那样的话，附魔可能会作用到你不想要的那件上。所以为保险起见，只带^5555ff一件想要附魔的防具^000000来……"
  npc_override_prontera_enchan_arm_enchanting_awesome_skill_19dfd9: "附魔是一种惊人的技术，能将神秘的状态之力注入防具隐藏孔洞中。"
  npc_override_prontera_enchan_arm_existing_refine_level_ar_10b96a: "装备的现有精炼等级"
  npc_override_prontera_enchan_arm_first_most_importantly_da4778: "首先，也是最重要的一点。"
  npc_override_prontera_enchan_arm_hmm_there_s_nothing_ench_c54c71: "嗯？没有什么可以附魔的！"
  npc_override_prontera_enchan_arm_however_you_keep_mind_if_61b8bc: "不过你要记住，如果身上有两件相同的防具，附魔会按照它们在背包中的顺序生效。"
  npc_override_prontera_enchan_arm_i_am_charge_enchanting_a_665341: "我负责给防具附魔。简单说，我一直在研究如何强化防具。"
  npc_override_prontera_enchan_arm_i_m_responsible_what_hap_cc4d7b: "如果你身上有多件相同的防具，出了什么事我可不负责。"
  npc_override_prontera_enchan_arm_i_ve_been_studying_ways_a04325: "我一直在研究如何强化防具，使其能力最大化。"
  npc_override_prontera_enchan_arm_if_any_chance_you_want_b89ad0: "如果你碰巧想给防具附魔，带上 400,000 Zeny 和你想附魔的防具，就可以开始了。"
  npc_override_prontera_enchan_arm_menu_hmm_665066: "嗯……让我考虑一下.:开始吧."
  npc_override_prontera_enchan_arm_menu_non_400944: "无孔防具.:有孔防具.:高级防具.:下次再来."
  npc_override_prontera_enchan_arm_now_you_nice_day_56ee4d: "祝你今天愉快。"
  npc_override_prontera_enchan_arm_please_come_back_just_on_637071: "请只带一件要附魔的装备再来。"
  npc_override_prontera_enchan_arm_please_come_back_when_yo_388598: "等你有兴趣给防具附魔的时候再来吧。"
  npc_override_prontera_enchan_arm_quite_adventurer_huh_wel_bee83b: "真是个冒险家啊？那么，我们开始吧？"
  npc_override_prontera_enchan_arm_requested_equipment_fail_6b511e: "你要附魔的装备失败了。"
  npc_override_prontera_enchan_arm_socket_enchant_cost_you_ba1669: "插槽附魔需要 400,000 Zeny。会随机附加一项属性。当然，也有损坏防具的风险。"
  npc_override_prontera_enchan_arm_sorry_you_don_t_enough_78a7df: "抱歉，你的 Zeny 不够。"
  npc_override_prontera_enchan_arm_well_i_t_blame_you_462845: "嗯，我不能怪你。安全第一，对吧？"
  npc_override_prontera_enchan_arm_well_s_too_bad_d8c71e: "真遗憾。"
  npc_override_prontera_enchan_arm_you_still_want_try_encha_1f22a0: "你还想尝试附魔吗？"
  npc_override_prontera_enchan_illusion_dungeons_add_stats_illusion_equip_5c2d59: "为幻影装备添加属性。"
  npc_override_prontera_enchan_illusion_dungeons_adventurer_you_illusion_6fdb68: "冒险者，你有^0000cd幻象石^000000吗？如果你有^0000cd武器、防具^000000，或者^0000cd精炼等级9或更高的饰品^000000，"
  npc_override_prontera_enchan_illusion_dungeons_ah_illusion_stones_truly_cae215: "Ah, Illusion Stones are truly mysterious……"
  npc_override_prontera_enchan_illusion_dungeons_ah_unfortunate_well_you_cb30bf: "啊，真不幸。好吧，你不可能总是幸运的。"
  npc_override_prontera_enchan_illusion_dungeons_alright_then_i_ll_add_d9b87b: "好的，那我把你加入我的会员名单。希望下次见到你时，你会有一些幻象装备。"
  npc_override_prontera_enchan_illusion_dungeons_anyway_after_i_couldn_t_2e4782: "不管怎样，在那之后，我找不到回去的路。"
  npc_override_prontera_enchan_illusion_dungeons_anyway_i_enchant_equipme_6627d6: "不管怎样，我可以为那些用幻象石交换或购买的装备附魔。我称它们为幻象装备。"
  npc_override_prontera_enchan_illusion_dungeons_armor_b1fc5d: "盔甲"
  npc_override_prontera_enchan_illusion_dungeons_as_material_you_bring_ex_c27506: "作为材料，你可以带来^0000CD精炼到+9或更高的现有装备。^000000"
  npc_override_prontera_enchan_illusion_dungeons_as_you_may_guessed_your_c3a835: "正如你可能猜到的，你的装备在这之后会转变成新的东西。"
  npc_override_prontera_enchan_illusion_dungeons_bear_wanting_459608: "[渴望熊的{0}]"
  npc_override_prontera_enchan_illusion_dungeons_benefits_both_us_i_need_a8eeb8: "这对我们双方都有利。我需要幻象石来做研究，而你需要强大的装备来冒险。"
  npc_override_prontera_enchan_illusion_dungeons_benefits_both_us_let_me_5e0e24: "这对我们双方都有利。如果你对我的提议感兴趣，请告诉我。"
  npc_override_prontera_enchan_illusion_dungeons_best_all_illusion_equipm_a7c47f: "这是所有幻象装备中最好的。当今没有技术可以为它附魔。即使是最熟练的附魔师也做不到。"
  npc_override_prontera_enchan_illusion_dungeons_bring_piece_refined_equi_a0a552: "带来^0000cd一件精炼装备、幻象石^000000，以及各种只在这个地方找到的材料。我会为你^0000cd升级装备、武器、防具或饰品。^000000"
  npc_override_prontera_enchan_illusion_dungeons_cancel_77dfd2: "取消"
  npc_override_prontera_enchan_illusion_dungeons_cave_very_mysterious_i_m_afe0d7: "这个洞穴非常神秘，但我自己不够强大，无法探索它。"
  npc_override_prontera_enchan_illusion_dungeons_come_back_if_interested_eded0a: "如果感兴趣就回来。"
  npc_override_prontera_enchan_illusion_dungeons_conversation_cannot_proc_50b03f: "因为你携带的物品太多，无法进行对话。"
  npc_override_prontera_enchan_illusion_dungeons_course_we_re_giving_you_f812e1: "当然，我们会给你新装备，所以别忘了所有现有的^0000CD熔炼和附魔^000000都会消失。"
  npc_override_prontera_enchan_illusion_dungeons_did_you_find_anything_yo_783cfc: "找到你喜欢的东西了吗？如果需要什么，请随时告诉我。"
  npc_override_prontera_enchan_illusion_dungeons_enchanting_never_fails_r_8b33af: "附魔永远不会失败，但重置有时会失败。即使是现代科学也无法改变这一点。"
  npc_override_prontera_enchan_illusion_dungeons_equipment_already_enchan_6238d1: "这件装备已经附魔到最大限制了。"
  npc_override_prontera_enchan_illusion_dungeons_equipment_least_responds_0791b3: "这件装备至少对幻象石有积极反应，或者有成功附魔的潜力。"
  npc_override_prontera_enchan_illusion_dungeons_equipment_world_fantasti_b7f6ab: "这件装备不是来自奇幻幻象世界。你把它给我看，我很生气。"
  npc_override_prontera_enchan_illusion_dungeons_every_good_thing_you_nee_fa30ef: "每一件好事都需要另一件好事。"
  npc_override_prontera_enchan_illusion_dungeons_exchange_equipment_eb1ec1: "兑换装备"
  npc_override_prontera_enchan_illusion_dungeons_exchange_i_ll_improve_yo_7c800a: "作为交换，我会改进你的装备。"
  npc_override_prontera_enchan_illusion_dungeons_exchange_illusion_equipm_694653: "交换幻象装备"
  npc_override_prontera_enchan_illusion_dungeons_explore_worlds_illusions_a9ede5: "探索幻象世界，收集幻象石，并交换装备。我可以为你的装备附魔。"
  npc_override_prontera_enchan_illusion_dungeons_first_let_me_tell_you_93f662: "首先，让我告诉你，我只能为某些类型的幻象装备附魔。"
  npc_override_prontera_enchan_illusion_dungeons_garment_cd2d27: "披风"
  npc_override_prontera_enchan_illusion_dungeons_get_them_me_i_ll_359e59: "把它们带给我，我会改进你的装备作为交换。顺便说一下，我只能改进某些类型。"
  npc_override_prontera_enchan_illusion_dungeons_good_thing_illusion_equi_aac2e9: "好东西 [幻影装备]"
  npc_override_prontera_enchan_illusion_dungeons_he_no_sense_when_comes_1aeb8e: "(他在起名方面毫无品味。)"
  npc_override_prontera_enchan_illusion_dungeons_hello_if_you_rare_materi_9c854d: "你好。如果你有来自这个地方的稀有材料，我可以增强你的装备。"
  npc_override_prontera_enchan_illusion_dungeons_helm_upper_886417: "头盔（上段）"
  npc_override_prontera_enchan_illusion_dungeons_here_we_re_getting_resea_ec5c72: "在这里，我们从拥有{0}的冒险者那里获取研究材料，而我提供增强的装备作为交换。"
  npc_override_prontera_enchan_illusion_dungeons_how_much_you_charge_aa436b: "你收多少钱？"
  npc_override_prontera_enchan_illusion_dungeons_i_came_ruined_village_b7de3d: "我来到了废墟村庄，"
  npc_override_prontera_enchan_illusion_dungeons_i_didn_t_know_here_fa040f: "我不知道它在这里！"
  npc_override_prontera_enchan_illusion_dungeons_i_don_t_any_s_68425b: "我没有任何{0}！"
  npc_override_prontera_enchan_illusion_dungeons_i_don_t_care_about_0128c9: "我不在乎潮流。"
  npc_override_prontera_enchan_illusion_dungeons_i_don_t_know_i_82b5fb: "我不知道但我想要一些！"
  npc_override_prontera_enchan_illusion_dungeons_i_don_t_know_why_f91bce: "I don't know why……!"
  npc_override_prontera_enchan_illusion_dungeons_i_enchant_illusion_equip_2e464c: "我可以为幻象装备附魔。"
  npc_override_prontera_enchan_illusion_dungeons_i_feel_like_i_m_8a584d: "我感觉我要疯了。"
  npc_override_prontera_enchan_illusion_dungeons_i_hope_you_like_6326cc: "希望你喜欢。"
  npc_override_prontera_enchan_illusion_dungeons_i_ll_come_back_later_19e43d: "我稍后再来。"
  npc_override_prontera_enchan_illusion_dungeons_i_ll_help_you_if_214380: "如果你在这里找到很多，我会帮助你。"
  npc_override_prontera_enchan_illusion_dungeons_i_ll_try_enchant_ability_2c0431: "我会尝试为你的物品附魔{0}能力。^ff0000其现有的精炼等级和卡片不会受损。即使这次尝试失败，它也不会被摧毁。^000000 你想继续吗？"
  npc_override_prontera_enchan_illusion_dungeons_i_m_chemist_specializing_0f6a70: "我是一名专门研究幻象石的化学家，这些石头在冒险者中流传。"
  npc_override_prontera_enchan_illusion_dungeons_i_m_here_find_some_74dc89: "我来这里是为了找到一些我研究需要的幻象石。"
  npc_override_prontera_enchan_illusion_dungeons_i_m_one_who_researches_afb396: "我是研究{0}来增强防具和武器的人。"
  npc_override_prontera_enchan_illusion_dungeons_i_m_overweight_i_d_50e3b6: "我超重了。我最好先减轻背包重量。"
  npc_override_prontera_enchan_illusion_dungeons_i_m_selling_two_random_81c795: "我在卖我自己制作的两个随机可选武器赋予卷轴。你可以选择你喜欢的支付方式。"
  npc_override_prontera_enchan_illusion_dungeons_i_m_working_how_use_84d293: "我正在研究如何使用{0}来强化装备。"
  npc_override_prontera_enchan_illusion_dungeons_i_need_illusion_stones_s_67063c: "而且我需要^0000FF幻象石和其他材料^000000来升级你的装备。"
  npc_override_prontera_enchan_illusion_dungeons_i_need_some_other_materi_c85e3c: "而且我需要一些^0000CD{0}和其他材料。^000000"
  npc_override_prontera_enchan_illusion_dungeons_i_only_know_they_re_bf3bae: "我只知道它们很稀有，只能在某些特殊地方找到，而我在这里为我的客户收集它们。"
  npc_override_prontera_enchan_illusion_dungeons_i_proposition_you_i_want_a84ec5: "我有一个提议给你。我想要一些只能在这个地方找到的材料。"
  npc_override_prontera_enchan_illusion_dungeons_i_strengthen_exchanged_i_0d0ec9: "我可以强化兑换的物品吗？"
  npc_override_prontera_enchan_illusion_dungeons_i_think_i_met_girl_d46638: "I think I met a girl……"
  npc_override_prontera_enchan_illusion_dungeons_i_ve_also_rolled_up_6b4f68: "我也为那些为村庄努力工作的冒险者卷起了袖子。我能把你的装备变得更强吗？列表上有什么你想要的吗？"
  npc_override_prontera_enchan_illusion_dungeons_i_ve_decided_stick_aroun_2b80f5: "我决定在这里待一段时间。只要待在这个士兵附近，我想我会很安全。"
  npc_override_prontera_enchan_illusion_dungeons_i_went_go_place_where_086306: "我去了{0}被发现的地方，我差点没回来……"
  npc_override_prontera_enchan_illusion_dungeons_if_you_give_me_i_bfc606: "如果你给我一个{0}，我会为你做些好事！"
  npc_override_prontera_enchan_illusion_dungeons_if_you_give_me_some_7e0d55: "如果你给我一些装备和材料，我会把它们换成我的强化装备。"
  npc_override_prontera_enchan_illusion_dungeons_if_you_go_there_could_f09d00: "如果你进去，能帮我 procurement 一些东西吗？"
  npc_override_prontera_enchan_illusion_dungeons_if_you_materials_i_need_9a394a: "如果你有我研究需要的材料，你不会不给我吧？"
  npc_override_prontera_enchan_illusion_dungeons_if_you_re_interested_how_a9e591: "如果你感兴趣，你想获得我的服务会员资格吗？那样你可以获得折扣！"
  npc_override_prontera_enchan_illusion_dungeons_if_you_re_interested_we_f9e5f9: "如果你感兴趣，我们可以讨论我们交易的细节。"
  npc_override_prontera_enchan_illusion_dungeons_if_you_want_refine_your_8efa02: "如果你想精炼你的装备，那就去城镇办公室附近的<NAVI>幻象附魔师<INFO>prontera,90,115,000,0,</INFO></NAVI>。"
  npc_override_prontera_enchan_illusion_dungeons_if_you_want_well_bring_420a91: "If you want to do well, bring equipment refined to ^ff0000+9 or higher. It'll all disappear…… haha?^000000"
  npc_override_prontera_enchan_illusion_dungeons_illusion_stones_1ff140: "幻象石？"
  npc_override_prontera_enchan_illusion_dungeons_interested_5ee0b1: "不感兴趣。"
  npc_override_prontera_enchan_illusion_dungeons_item_requires_you_don_t_956aed: "这个物品需要{0} {1}，而你没有我需要的全部。"
  npc_override_prontera_enchan_illusion_dungeons_left_accessory_244397: "左饰品"
  npc_override_prontera_enchan_illusion_dungeons_left_handed_weapon_shiel_0c470f: "左手武器/盾牌"
  npc_override_prontera_enchan_illusion_dungeons_less_stronger_fe3713: "Less…… stronger……"
  npc_override_prontera_enchan_illusion_dungeons_look_illusion_equipment_5d1b79: "看看幻象装备"
  npc_override_prontera_enchan_illusion_dungeons_looking_some_materials_t_57d78b: "在找一些材料。碰到了一些奇怪的光，现在我在这里。"
  npc_override_prontera_enchan_illusion_dungeons_magic_e6791b: "魔法"
  npc_override_prontera_enchan_illusion_dungeons_make_sure_you_re_equippe_beb6bf: "确保你^0000FF装备了你想要改进的物品。^000000"
  npc_override_prontera_enchan_illusion_dungeons_make_sure_your_equipment_003017: "确保^0000FF你的装备至少精炼到+9^000000再带给我。"
  npc_override_prontera_enchan_illusion_dungeons_makes_you_good_what_you_aeb1b8: "让你善用你所拥有的！"
  npc_override_prontera_enchan_illusion_dungeons_melee_e00694: "近战"
  npc_override_prontera_enchan_illusion_dungeons_menu_illusion_b2d568: "幻象附魔师：如果你对幻象装备感兴趣，就来找我聊聊！"
  npc_override_prontera_enchan_illusion_dungeons_most_important_thing_oth_e5adff: "^ff0000{0}^000000!!! {1} is the most important thing, but…… other materials are also needed."
  npc_override_prontera_enchan_illusion_dungeons_my_clients_want_figure_o_493015: "我的客户想弄清楚这些石头是什么。他们付我很多钱，"
  npc_override_prontera_enchan_illusion_dungeons_no_816c52: "不"
  npc_override_prontera_enchan_illusion_dungeons_no_i_don_t_even_acfc25: "不。我甚至不知道幻象装备是什么。"
  npc_override_prontera_enchan_illusion_dungeons_no_problem_come_back_if_5d4270: "没问题。如果你改变主意，就回来。"
  npc_override_prontera_enchan_illusion_dungeons_oh_you_illusion_equipmen_73d5fa: "哦，你有幻象装备吗？"
  npc_override_prontera_enchan_illusion_dungeons_okay_6fb660: "Okay……"
  npc_override_prontera_enchan_illusion_dungeons_okay_let_me_know_if_e22d94: "好的，但如果你改变主意，请告诉我。"
  npc_override_prontera_enchan_illusion_dungeons_only_fully_enchanted_ite_2efb77: "只有完全附魔的物品才能重置。请附魔两次，如果你仍然想重置，那就把它带给我。"
  npc_override_prontera_enchan_illusion_dungeons_oops_i_m_sorry_i_661154: "哎呀，抱歉。我应该先自我介绍的。"
