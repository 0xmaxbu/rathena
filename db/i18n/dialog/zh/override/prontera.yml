  npc_override_prontera_tu_merchant_you_ll_find_some_npcs_f680f5: "你会找到一些NPC"
  npc_override_prontera_tu_merchant_you_ought_free_up_some_5835df: "你有机会的时候应该腾出一些背包空间。"
  npc_override_prontera_tu_merchant_you_re_such_13d3e4: "你真是个"
  npc_override_prontera_tu_merchant_you_really_good_price_e575e3: "给你一个非常好的价格。"
  npc_override_prontera_tu_merchant_you_scammed_f46be7: "你被骗了！"
  npc_override_prontera_tu_merchant_you_t_afford_0ffa69: "你买不起"
  npc_override_prontera_tu_merchant_you_t_possibly_carry_any_133755: "你不可能再携带任何物品了。为什么不先把东西放进卡普拉仓库？"
  npc_override_prontera_tu_merchant_you_t_really_merchant_if_092831: "如果你连货物都搬不动，你就不能真正成为商人。随着这个技能等级的提高，你可以携带更多物品。"
  npc_override_prontera_tu_merchant_you_t_take_10d198: "你不能拿"
  npc_override_prontera_tu_merchant_you_truly_deserve_little_2bdfbb: "你真的值得一点奖励~"
  npc_override_prontera_tu_merchant_you_ve_actually_mastered_751175: "你实际上已经掌握了低价买入技能！你真是个好学生。你值得一点奖励！"
  npc_override_prontera_tu_merchant_you_ve_actually_went_abo_c5080a: "你实际上已经超越并掌握了推车技能。干得好！"
  npc_override_prontera_tu_merchant_you_ve_been_very_b1d0e4: "你一直非常"
  npc_override_prontera_tu_merchant_you_ve_done_just_0ce373: "你做得正好"
  npc_override_prontera_tu_merchant_you_ve_just_started_out_ac4184: "你刚开始当商人，对吧？你想向一位经验丰富的同事学习商业基础吗？"
  npc_override_prontera_tu_merchant_you_ve_taught_yourself_w_691c94: "你自学得很好。来，你赢得了这个小奖励~"
  npc_override_prontera_tu_merchant_your_adventures_0f46d8: "在你的冒险中……"
  npc_override_prontera_tu_merchant_your_best_8f6658: "尽你最大的努力~"
  npc_override_prontera_tu_merchant_your_final_assignment_i_92eb04: "对于你的最后一个任务，我会要求你学习摆摊技能到技能等级4。当然，一旦你做到了，我会给你一个小奖励。我会等的，所以尽你最大的努力~"
  npc_override_prontera_tu_merchant_your_money_you_f6dc41: "你的钱"
  npc_override_prontera_tu_merchant_your_own_3c4fff: "你自己？"
  npc_override_prontera_tu_merchant_zeny_alright_406375: "Zeny，好吗？"
  npc_override_prontera_tu_merchant_zeny_kind_adventurer_a795d8: "价格 {0} Zeny，善良的冒险者？"
  npc_override_prontera_twintowers_although_we_able_move_lu_8d7bb4: "虽然我们无法移动，但幸运的是我们拥有特殊能力，可以将你传送到危险而刺激的地方。"
  npc_override_prontera_twintowers_although_we_t_move_aroun_77bd18: "虽然我们无法移动，也无法像你们一样生活，"
  npc_override_prontera_twintowers_come_where_you_wish_go_9b63d9: "来吧！你想去哪里？"
  npc_override_prontera_twintowers_dedication_commitment_ac_b4b508: "为实现抱负而付出的奉献和承诺..."
  npc_override_prontera_twintowers_desire_explore_unknown_r_18adfd: "探索未知领域的渴望，"
  npc_override_prontera_twintowers_er_what_pity_traveling_y_b1e195: "呃，真遗憾。独自旅行仍然是冒险的最佳证明。"
  npc_override_prontera_twintowers_feel_free_come_us_when_08cb71: "有时间随时来找我们，我们会一直在那里为你服务。"
  npc_override_prontera_twintowers_flaming_passion_adventur_268898: "冒险者燃烧的激情，"
  npc_override_prontera_twintowers_forget_all_your_troubles_d884da: "忘记你所有的烦恼，在这个奇妙的世界里创造辉煌的传奇。"
  npc_override_prontera_twintowers_how_you_we_twin_towers_adc2ba: "你好吗？我们是双塔。"
  npc_override_prontera_twintowers_i_suppose_you_know_ragna_1a87d7: "我想你知道这是仙境传说，一个梦想与幻想之地。"
  npc_override_prontera_twintowers_isn_t_proving_you_still_bbc6f4: "这不证明你还年轻吗？"
  npc_override_prontera_twintowers_isn_t_true_c40d14: "这不是真的吗？"
  npc_override_prontera_twintowers_just_let_us_know_you_f543fe: "只要告诉我们你想要的目的地，我们就会送你去那里！"
  npc_override_prontera_twintowers_kindly_let_us_know_606b2b: "请告诉我们。"
  npc_override_prontera_twintowers_may_you_experience_sensa_8fb0fd: "愿你体验这个可爱世界的感受！"
  npc_override_prontera_twintowers_reason_we_here_your_serv_cd7cc9: "因此，我们在这里用我们的特殊魔法为你服务。"
  npc_override_prontera_twintowers_such_pleasure_able_meet_017e7b: "很高兴能在这里见到你。"
  npc_override_prontera_twintowers_such_wonderful_world_you_9ae061: "这是一个如此美妙的世界，你将永远是一位伟大的冒险者！"
  npc_override_prontera_twintowers_there_good_bad_times_lif_96259c: "人生有顺境也有逆境，而且冒险本来就不是一件容易的事。"
  npc_override_prontera_twintowers_we_love_world_as_much_22554a: "我们和你一样热爱这个世界！"
  npc_override_prontera_twintowers_we_respect_brave_hearts_c48b5a: "我们尊重这样勇敢的心"
  npc_override_prontera_twintowers_we_wish_help_passionate_050dfb: "我们希望帮助充满激情的冒险者。"
  npc_override_prontera_twintowers_you_having_joyous_advent_fc8ec2: "你是否正在享受愉快的冒险和激动人心的体验？"
  npc_override_prontera_twintowers_you_simply_true_adventur_931831: "你简直就是一位拥有同情心的真正冒险者。"
  npc_override_prontera_umbalian_language_actually_knowledge_umbal_34ba66: "实际上这是伞巴拉人的知识。他们以某种特殊方式与这个米德加尔特世界相连，我们只是还不能确认。有一种理论认为他们可能像精灵一样保护着世界树尤格德拉希尔。"
  npc_override_prontera_umbalian_language_ah_i_heard_her_class_4ae723: "啊，我听说她的班级在那附近……非常感谢！这是给你的一点小东西。"
  npc_override_prontera_umbalian_language_ah_i_see_if_she_55ab0f: "啊我明白了，如果她在学习，那我就不打扰她了。还是谢谢。"
  npc_override_prontera_umbalian_language_ah_you_ve_done_well_0e532b: "啊，你找回我的参考资料做得很好。这些文物包含着世界各地遗迹的信息，从岩浆地牢的燃烧地狱到世界树尤格德拉希尔的诡异隐藏森林。"
  npc_override_prontera_umbalian_language_argh_my_three_students_r_483963: "啊！我的三个学生带着我的参考资料跑了！嘿你！你能帮我找回来吗？我会好好奖励你的。"
  npc_override_prontera_umbalian_language_castle_eh_i_don_t_04feed: "城堡啊，我不想进去……感觉不适合我。我不喜欢那种贵族优越感。"
  npc_override_prontera_umbalian_language_enough_talk_you_re_just_8a77a4: "但别说废话了，你只是急着要你的奖励，不是吗？好吧，听起来可能不多，但我给你的奖励是知识……"
  npc_override_prontera_umbalian_language_hello_there_something_yo_94859b: "你好，有什么需要吗？"
  npc_override_prontera_umbalian_language_hey_there_i_came_here_99c3e5: "嘿，我来普隆德拉是为了找一位能从插槽中移除卡片的老妇人。你知道我在哪里可以找到她吗？"
  npc_override_prontera_umbalian_language_heyyy_there_you_poring_e_ff9f8f: "嘿嘿，你有一个波利蛋和配套的宠物孵化器！那些是给我的吗？"
  npc_override_prontera_umbalian_language_hi_i_came_here_prontera_e3fdc5: "嗨！我来普隆德拉是为了找一位老妇人……但是……"
  npc_override_prontera_umbalian_language_hi_what_you_want_me_6c6d78: "嗨！你想从我这里得到什么？"
  npc_override_prontera_umbalian_language_hmm_i_dunno_why_she_09f1b4: "嗯……我不知道她为什么会在那里……我去看看。"
  npc_override_prontera_umbalian_language_hmm_you_sure_about_4e00c6: "嗯……你确定吗？"
  npc_override_prontera_umbalian_language_hrrmm_okay_cya_then_7e1285: "嗯好吧？那再见……"
  npc_override_prontera_umbalian_language_i_don_t_think_she_0bc08f: "我觉得她不需要在那里，她住在普隆德拉。"
  npc_override_prontera_umbalian_language_i_great_wise_man_juno_c42746: "而我，朱诺的伟大智者，将教你他们的语言！"
  npc_override_prontera_umbalian_language_i_lost_my_teacher_s_7d08cc: "我把老师的书弄丢了！我该怎么办……"
  npc_override_prontera_umbalian_language_i_wonder_where_our_sea_010465: "我想知道我们的海之女孩玛丽在哪里？"
  npc_override_prontera_umbalian_language_job_agency_i_don_t_46d66f: "职业介绍所？我不这么认为。请不要带我绕普隆德拉转！她已经是这里的老师了。"
  npc_override_prontera_umbalian_language_learned_language_umbalia_4065ea: "^0000FF 学会了伞巴拉人的语言！ ^000000"
  npc_override_prontera_umbalian_language_mojo_should_somewhere_ne_129f47: "莫乔应该在水边附近……"
  npc_override_prontera_umbalian_language_o_wow_did_she_become_1126c0: "哦哇，她成为普隆德拉的重要人物了吗？我想她太忙了，我没法拜访她。我稍后再试。"
  npc_override_prontera_umbalian_language_oh_no_i_lost_my_d9673b: "哦不！我把老师的 ^FF0000旧魔法书^000000 弄丢了！"
  npc_override_prontera_umbalian_language_oh_ok_thanks_anyways_03e74a: "哦……好吧……还是谢谢。"
  npc_override_prontera_umbalian_language_oh_pooo_sigh_b2c70a: "哦……唉……叹息……"
  npc_override_prontera_umbalian_language_oh_wait_i_see_he_5a5fbc: "哦等等，我明白了……他想要回他的参考资料，对吗？好吧，我还在用，但是……如果你能给我一个波利蛋和一个孵化器，我就还给他。那些东西太可爱了！"
  npc_override_prontera_umbalian_language_oh_yeah_tell_them_i_1c2641: "哦对了，告诉他们是我派你来的"
  npc_override_prontera_umbalian_language_oh_yeah_tell_them_i_3bb3f5: "哦对了，告诉他们是我派你来的，他们的名字是玛丽、梅森和莫乔。"
  npc_override_prontera_umbalian_language_oh_you_found_marie_amats_8323c2: "哦……你在天津城找到了玛丽。"
  npc_override_prontera_umbalian_language_only_thing_she_d_need_132f04: "她在工具店唯一需要的就是治疗风湿的药。她可能早就离开那里了。"
  npc_override_prontera_umbalian_language_oooo_could_you_please_te_96b50c: "哦哦，你能告诉我她在哪里吗？我会非常感激的。"
  npc_override_prontera_umbalian_language_so_mason_s_prontera_now_5e21b3: "所以……梅森现在在普隆德拉……好吧……"
  npc_override_prontera_umbalian_language_what_am_i_going_those_2d02cd: "我该怎么办……那些愚蠢的巴托里……"
  npc_override_prontera_umbalian_language_what_he_want_me_c852d5: "他想从我这里得到什么？"
  npc_override_prontera_umbalian_language_what_i_know_they_re_206471: "据我所知，他们在不同的城镇各自发展。"
  npc_override_prontera_umbalian_language_where_d_mason_go_then_1e4903: "梅森去哪里了……"
  npc_override_prontera_umbalian_language_why_she_need_go_there_46a99d: "她为什么需要去那里？我想你可能是搞错了。"
  npc_override_prontera_umbalian_language_wow_i_never_knew_she_803a7d: "哇我从不知道她是个虔诚的人……我会去看看，谢谢。"
  npc_override_prontera_umbalian_language_yatta_here_s_lil_somethi_023675: "太好了！这是给你的一点小东西。"
  npc_override_prontera_umbalian_language_yay_i_found_her_thank_7344ff: "耶，我找到她了！非常感谢你的帮助！"
  npc_override_prontera_umbalian_language_yay_i_love_porings_64e8d9: "耶！我爱波利！"
  npc_override_prontera_umbalian_language_you_saw_mojo_aldebaran_afcd03: "你在艾尔帕兰看到莫乔了？"
  npc_override_prontera_umbalian_language_you_speak_umbalian_fluen_c33159: "你说伞巴拉语很流利！所以你永远不会忘记伞巴拉人的语言！"
  npc_override_prontera_uneasy_cemetery_alas_we_still_need_more_6623af: "唉！我们还需要 {0} 瓶圣水……为什么不去向别人要一些额外的圣水呢？"
  npc_override_prontera_uneasy_cemetery_calm_down_restless_cemet_cb74ef: "为了安抚不安的墓地，我们应该用圣水浇灌所有这些坟墓。但我们的兄弟姐妹已经用完了。"
  npc_override_prontera_uneasy_cemetery_could_you_supply_us_holy_39aaab: "你能给我们提供圣水吗？"
  npc_override_prontera_uneasy_cemetery_due_s_help_we_ll_7b6655: "但由于 {0} 的帮助，我们可以休息到下一个午夜！"
  npc_override_prontera_uneasy_cemetery_i_m_afraid_old_cemetery_047cf1: "恐怕老墓地很快就要失控了……请，把你所有能得到的圣水都给我们。"
  npc_override_prontera_uneasy_cemetery_i_m_afraid_there_s_4f978f: "恐怕我们的老墓地出了什么问题……"
  npc_override_prontera_uneasy_cemetery_menu_mother_096f28: "[玛塔纳修女]：以奥丁之名，请消灭这些游荡的亡灵残余！"
  npc_override_prontera_uneasy_cemetery_menu_mother_156da2: "[玛塔纳修女]：墓地变得不安宁了！以奥丁之名，赶快去圣所！拯救普隆德拉城！"
  npc_override_prontera_uneasy_cemetery_menu_mother_9d5a07: "[玛塔纳修女]：以奥丁之名，我们宣布美丽的 {0} 为普隆德拉的救世主！"
  npc_override_prontera_uneasy_cemetery_menu_mother_9d87df: "[玛塔纳修女]：勇敢的 {0} 刚刚杀死了普隆德拉最后一只亡灵！"
  npc_override_prontera_uneasy_cemetery_menu_mother_cd97d5: "[玛塔纳修女]：女士 {0} 刚刚杀死了普隆德拉最后一只亡灵！"
  npc_override_prontera_uneasy_cemetery_menu_mother_d5f295: "[玛塔纳修女]：以奥丁之名，我们宣布英俊的 {0} 为普隆德拉的救世主！"
  npc_override_prontera_uneasy_cemetery_name_odin_we_bless_you_16de6e: "以奥丁之名，我们祝福你，并体面地赠送一份来自马雷乌西斯酒窖的微薄礼物。"
  npc_override_prontera_uneasy_cemetery_old_cemetery_going_out_c_70d2cc: "老墓地很快就要失控了……"
  npc_override_prontera_uneasy_cemetery_our_church_going_thank_y_25a4c6: "我们的教会将亲自感谢你……"
  npc_override_prontera_uneasy_cemetery_please_name_odin_help_pr_9b1e80: "请，以奥丁之名，帮助普隆德拉城。"
  npc_override_prontera_uneasy_cemetery_see_they_all_gone_now_691a54: "看，{0}？它们都走了！"
  npc_override_prontera_uneasy_cemetery_thank_you_good_we_still_686803: "谢谢你，善良的 {0}，但我们还需要 {1} 瓶圣水。"
  npc_override_prontera_uneasy_cemetery_thank_you_now_we_ll_0ee0a6: "谢谢你，{0}！现在我们可以休息到下一个午夜了！"
  npc_override_prontera_uneasy_cemetery_thank_you_now_we_ve_c1a88e: "谢谢你，{0}！现在我们有足够的圣水了！"
  npc_override_prontera_uneasy_cemetery_thanks_s_support_we_ve_42e0ac: "但由于 {0} 的支持，我们度过了 {1} 个轻松的夜晚！"
  npc_override_prontera_uneasy_cemetery_thanks_you_we_ll_able_021e90: "但多亏了你，{0}，我们将能够安睡 {1} 晚！"
  npc_override_prontera_uneasy_cemetery_they_could_return_tomorr_49a3c7: "它们明天晚上可能会再次出现！"
  npc_override_prontera_uneasy_cemetery_upon_pouring_cemetery_wa_f0b42b: "用圣水浇灌墓地后，我们将获得 {0} 个安全的夜晚！"
  npc_override_prontera_valentinesday_2009_adios_mademoiselle_6ee3ff: "再见，小姐……"
  npc_override_prontera_valentinesday_2009_ahaha_my_dear_a8acfd: "啊哈哈，亲爱的。"
  npc_override_prontera_valentinesday_2009_ahahahaha_just_look_25172f: "啊哈哈哈，看看这个！"
  npc_override_prontera_valentinesday_2009_ahhh_mademoiselle_f68faf: "啊，小姐。"
  npc_override_prontera_valentinesday_2009_ahhh_so_heartbreaking_c12d05: "啊，这太令人心碎了。"
  npc_override_prontera_valentinesday_2009_alright_mademoiselle_364eca: "好的。小姐，"
  npc_override_prontera_valentinesday_2009_alrighty_e18583: "好的！"
  npc_override_prontera_valentinesday_2009_and_bb881c: "和……"
  npc_override_prontera_valentinesday_2009_annoying_annoying_annoyi_7f2717: "烦人，烦人，烦人~~！"
  npc_override_prontera_valentinesday_2009_anyone_really_ce896b: "任何人都可以……真的！"
  npc_override_prontera_valentinesday_2009_as_rings_you_receive_oth_80428c: "至于你从别人那里收到的戒指，它们都应该在投票管理员那里登记。"
  npc_override_prontera_valentinesday_2009_aware_always_try_stay_po_3c82ac: "要注意，并始终保持受欢迎！"
  npc_override_prontera_valentinesday_2009_box_ring_carved_your_nam_45468a: "刻有你的名字、装着戒指的盒子，是给你爱的人的。"
  npc_override_prontera_valentinesday_2009_cancels_everything_9ff7de: "'0'，取消一切。"
  npc_override_prontera_valentinesday_2009_challenge_yourself_becom_c5bc3f: "挑战自己成为情人节最热门的人！"
  npc_override_prontera_valentinesday_2009_check_what_you_come_back_2afc83: "检查一下你有什么，然后带着所有材料回来。"
  npc_override_prontera_valentinesday_2009_chocolate_nothing_like_o_66c6cb: "这巧克力与众不同。"
  npc_override_prontera_valentinesday_2009_come_back_anytime_when_y_16248e: "随时回来，当你改变主意的时候。"
