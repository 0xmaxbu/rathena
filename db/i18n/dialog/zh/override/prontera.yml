Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_prontera_RWC_2011_adios_d4c747: "再见！"
  npc_override_prontera_RWC_2011_agent_muttered_something_aa0c80: "- 代理自言自语着什么。 -"
  npc_override_prontera_RWC_2011_arrgg_you_ignoring_me_be_513eff: "Arrgg！！你是因为我是新人就无视我吗？通常人们都会听的..."
  npc_override_prontera_RWC_2011_cannot_achieved_all_alon_b1ed00: "但这无法独自完成。你的朋友将在比赛中扮演重要角色。"
  npc_override_prontera_RWC_2011_eventually_my_patience_r_92f73a: "但最终，我的耐心和克制的性格激励我成为了RWC2011的代理！"
  npc_override_prontera_RWC_2011_first_i_start_attaching_0d3258: "首先，我将开始贴你找到的卡片...剩下的卡片我明天再取。"
  npc_override_prontera_RWC_2011_good_luck_e80771: "祝你好运！"
  npc_override_prontera_RWC_2011_he_looks_you_imploring_e_e47a00: "- 他用恳求的眼神看着你。 -"
  npc_override_prontera_RWC_2011_he_thought_something_the_920c1f: "- 他想了些什么，然后看着你的眼睛。 -"
  npc_override_prontera_RWC_2011_here_gifts_i_promised_le_c7eef4: "这是我承诺的礼物...让我看看..."
  npc_override_prontera_RWC_2011_his_brimming_small_eyes_bd9c91: "- 他那盈满泪水的小眼睛似乎在告诉你什么。^FF0000请再跟我说话...^000000 -"
  npc_override_prontera_RWC_2011_his_twinkling_small_eyes_ebe57f: "- 他那闪烁的小眼睛似乎在告诉你什么。^FF0000请再跟我说话...^000000 -"
  npc_override_prontera_RWC_2011_huh_b1cd39: "... 嗯...？"
  npc_override_prontera_RWC_2011_i_afraid_being_attacked_55466b: "我害怕在街头贴RWC2011蓝色卡片时被怪物攻击。"
  npc_override_prontera_RWC_2011_i_am_adventurer_i_don_8aec77: "我不是冒险者，我甚至不知道怎么买卖东西。有时看到冒险者我就很高兴。你知道...我只是一个普通的男孩。"
  npc_override_prontera_RWC_2011_i_am_new_agent_8bcec3: "我是...一个新代理。"
  npc_override_prontera_RWC_2011_i_am_supposed_attach_blu_dcd09c: "我应该在全世界贴上带有RWC2011字样的蓝色卡片来宣传活动。但是...但是..."
  npc_override_prontera_RWC_2011_i_had_turned_off_light_7152aa: "我关了灯，正准备睡觉，然后透过窗户看到了这道明亮的光。"
  npc_override_prontera_RWC_2011_i_m_just_saying_out_0e2707: "我只是出于关心才这么说。你需要两张^FF0000蓝色1号卡片^000000。这是\\\"2011\\\"...明白了吗？"
  npc_override_prontera_RWC_2011_i_must_keep_promoting_ev_2b568e: "我必须继续宣传活动，所以我想再次请求你~！"
  npc_override_prontera_RWC_2011_i_see_78d1e8: "...我明白了..."
  npc_override_prontera_RWC_2011_i_so_happy_i_couldn_ef3708: "我太高兴了，以至于睡不着！我终于有机会见到很多冒险者并了解他们。"
  npc_override_prontera_RWC_2011_i_so_shocked_i_tried_a001dc: "我太震惊了，我试图冷静下来思考...我从未听说过也从未见过任何发光的波利！"
  npc_override_prontera_RWC_2011_i_spend_my_life_suburb_ffa5c9: "我将在郊区度过一生。"
  npc_override_prontera_RWC_2011_i_still_lots_cards_find_3aaeb9: "我还有很多卡片要找，所以如果你有时间，请回来再帮忙。"
  npc_override_prontera_RWC_2011_i_used_very_normal_boy_cd97d7: "我曾经是梦罗克一个非常普通的男孩。"
  npc_override_prontera_RWC_2011_if_i_ruin_promotion_i_879ab4: "如果我搞砸了这次宣传，我可能会失去工作，不得不回到我曾经独自生活的地方..."
  npc_override_prontera_RWC_2011_if_you_re_interested_fes_eb81a4: "如果你对这个节日感兴趣，开始寻找你可以信任的朋友吧！"
  npc_override_prontera_RWC_2011_if_you_see_golden_poring_a975b7: "如果你看到黄金波利，你能帮我找到珍贵的蓝色卡片吗？"
  npc_override_prontera_RWC_2011_it_0db04a: "它？"
  npc_override_prontera_RWC_2011_many_events_organized_rw_996eb7: "每年都会为RWC宣传组织许多活动。"
  npc_override_prontera_RWC_2011_menu_ok_3955df: "好的，我会帮你！:你能给我多少钱？"
  npc_override_prontera_RWC_2011_menu_ok_ac1f8f: "好的！:我现在很忙。"
  npc_override_prontera_RWC_2011_menu_sure_e7724d: "当然，让我听听。:不，谢谢。"
  npc_override_prontera_RWC_2011_menu_what_e7052f: "RWC是什么？:你是新代理吗？:我不在乎。"
  npc_override_prontera_RWC_2011_mission_so_important_me_b81fe8: "这个任务对我非常重要，"
  npc_override_prontera_RWC_2011_mmmm_yet_we_re_short_b7dbb0: "嗯~还没好吗？我们人手不足...请帮帮我。"
  npc_override_prontera_RWC_2011_msg_93fcbf: "......"
  npc_override_prontera_RWC_2011_my_first_mission_people_73f0d0: "这是我的第一个任务，但人们的反应不太好。"
  npc_override_prontera_RWC_2011_new_agent_looking_you_pi_e191ab: "- 新代理用可怜的眼神看着你。 -"
  npc_override_prontera_RWC_2011_people_used_tell_me_sinc_63372b: "人们以前总是这么说我，因为我很害羞。"
  npc_override_prontera_RWC_2011_please_come_back_tomorro_fe4d7c: "请明天再来。"
  npc_override_prontera_RWC_2011_please_help_me_out_my_4c2b52: "请帮帮我！！我的生命掌握在你手中！"
  npc_override_prontera_RWC_2011_really_happened_f13fd0: "^FF0000真的发生了！^000000"
  npc_override_prontera_RWC_2011_rwc_festival_where_those_91b2e3: "RWC是一个让冒险者们相互竞争、找出谁是最强的节日！"
  npc_override_prontera_RWC_2011_s_much_please_keep_haha_3f5461: "不多，但请收下！哈哈，我们还有很多卡片要找。希望你明天也能帮我。"
  npc_override_prontera_RWC_2011_s_rwc_time_69e8da: "RWC时间到了！"
  npc_override_prontera_RWC_2011_s_same_mission_as_before_f65a70: "和之前的任务一样。"
  npc_override_prontera_RWC_2011_seems_you_ve_traveled_qu_d12970: "看来你已经旅行了足够多，但你不擅长打听世界各地的消息。"
  npc_override_prontera_RWC_2011_shining_poring_ate_all_b_3f8c1e: "那是一只发光的波利！它在不到一秒钟内就吃光了我准备的所有蓝色卡片！"
  npc_override_prontera_RWC_2011_suddenly_window_broken_a_73b509: "突然，窗户碎了，它出现了！"
  npc_override_prontera_RWC_2011_thank_you_i_continue_wor_bf9afa: "谢谢你！！我现在可以继续工作了。当世界上有你这样伟大的冒险者时，没有什么是不可能的！"
  npc_override_prontera_RWC_2011_thanks_last_time_5f8d37: "感谢上次帮忙。"
  npc_override_prontera_RWC_2011_thanks_last_time_we_stil_6208cf: "感谢上次帮忙！我们还有很多卡片要找。你能帮我吗？"
  npc_override_prontera_RWC_2011_there_few_adventurers_mi_4fcf44: "米德加尔特很少有冒险者将生命奉献给战斗，从不跳过训练，隐居生活，并精通他们的技艺。"
  npc_override_prontera_RWC_2011_try_gather_blue_cards_ma_786bbb: "尝试收集蓝色卡片并组成单词，^FF0000R W C 2 0 1 1 ^000000。"
  npc_override_prontera_RWC_2011_try_gather_remaining_car_887bb7: "尝试收集剩余的卡片，直到你组成单词'RWC2011'。"
  npc_override_prontera_RWC_2011_wasn_t_dream_when_i_3b95a1: "但这不是梦。当我醒来时，我意识到所有蓝色卡片都不见了..."
  npc_override_prontera_RWC_2011_what_you_looking_large_c_b03dc6: "你要找的是带有^FF0000RWC2011^000000字样的大卡片。有些可能已经被消化了。"
  npc_override_prontera_RWC_2011_wow_finally_s_season_we_8b3eb0: "哇~终于！！这是我们一直期待的季节！"
  npc_override_prontera_RWC_2011_wow_you_bring_light_my_6190a5: "哇~你再次给我的生活带来了光明！"
  npc_override_prontera_RWC_2011_year_special_mission_bee_8b4a94: "而今年，一项特殊任务被委托给了一个新代理...就是我自己！"
  npc_override_prontera_RWC_2011_yes_must_dream_s_conclus_ac9f04: "^FF0000是的！这一定是个梦！^000000这是我得出的结论，然后回去睡觉了。"
  npc_override_prontera_RWC_2011_you_decided_help_me_well_d202bd: "你决定帮我了吗？好吧，我会准备一些礼物。我相信你会喜欢的。"
  npc_override_prontera_RWC_2011_you_gathered_all_cards_ef3d79: "你收集齐所有卡片了吗？"
  npc_override_prontera_RWC_2011_you_know_what_37f73d: "你知道吗？"
  npc_override_prontera_RWC_2011_you_like_listen_my_story_c72ac3: "你想听我的故事吗？"
  npc_override_prontera_RWC_2011_you_must_new_adventurer_ad4012: "你一定是个新冒险者。我会友好地向你解释。"
  npc_override_prontera_RWC_2011_you_serious_41017e: "你是认真的吗！？"
  npc_override_prontera_RWC_2011_you_too_many_items_pleas_b3fb2f: "你的物品太多了。请清理背包后再来。"
  npc_override_prontera_RWC_2011_you_ve_come_again_4c7da8: "你又来了~"
  npc_override_prontera_christmas_2008_ah_971301: "啊..."
  npc_override_prontera_christmas_2008_ah_cf07cb: "啊！"
  npc_override_prontera_christmas_2008_ah_music_box_useful_065eaf: "啊，音乐盒很有用。"
  npc_override_prontera_christmas_2008_all_children_world_5c79e0: "为了这个世界上所有的孩子！！！"
  npc_override_prontera_christmas_2008_all_over_world_blessed_t_deb3c1: "今晚全世界都将受到祝福！"
  npc_override_prontera_christmas_2008_all_right_isn_t_wonderfu_be6b96: "好的！这不是很棒吗？"
  npc_override_prontera_christmas_2008_all_right_we_start_make_76d41a: "好的！我们可以开始用水晶碎片制作我们的音乐盒了。"
  npc_override_prontera_christmas_2008_all_right_what_comes_you_854224: "好的，当你想到圣诞节时，你会想到什么？"
  npc_override_prontera_christmas_2008_all_right_you_re_cool_945703: "好的，你真酷！！"
  npc_override_prontera_christmas_2008_another_present_christma_ff6691: "另一份礼物是特意做成你名字形状的圣诞蛋糕！"
  npc_override_prontera_christmas_2008_anyway_did_you_know_3f608b: "总之，你知道吗..."
  npc_override_prontera_christmas_2008_anyway_let_those_adventu_52cdb6: "总之让那些冒险者去抓他吧，我有个小游戏给你。"
  npc_override_prontera_christmas_2008_anyway_thanks_lot_your_h_7de0af: "总之，非常感谢你的帮助。"
  npc_override_prontera_christmas_2008_anyway_you_bring_me_some_2b6688: "总之，你能给我带些东西吗？"
  npc_override_prontera_christmas_2008_artist_louise_kim_1142c3: "艺术家，路易丝·金！！！"
  npc_override_prontera_christmas_2008_artist_louise_kim_6e9e44: "由艺术家，路易丝·金制作！"
  npc_override_prontera_christmas_2008_as_i_heard_antonio_quite_11e272: "据我所知，这个安东尼奥和以前大不相同。"
  npc_override_prontera_christmas_2008_aww_don_t_afraid_766c29: "哎呀，别害怕。"
  npc_override_prontera_christmas_2008_aww_maybe_next_time_bb46be: "哎呀也许下次吧..."
  npc_override_prontera_christmas_2008_bad_bad_5fbda3: "坏！坏！"
  npc_override_prontera_christmas_2008_bad_santa_ruins_us_good_bcf194: "一个坏圣诞老人毁了我们好圣诞老人的名声！"
  npc_override_prontera_christmas_2008_blacksmith_hammers_trunk_b1606b: "铁匠锤打树干...然后我们塑造框架。"
  npc_override_prontera_christmas_2008_breating_life_into_62753d: "赋予它生命！"
  npc_override_prontera_christmas_2008_careful_9a2d79: "小心！"
  npc_override_prontera_christmas_2008_caroller_s_hot_news_ha_799051: "颂歌者的热门新闻！哈！"
  npc_override_prontera_christmas_2008_carolling_s_good_8e9eaa: "唱颂歌！那很好！"
  npc_override_prontera_christmas_2008_cheer_goodwill_721f80: "-欢呼与善意！-"
  npc_override_prontera_christmas_2008_christmas_comes_around_db1072: "圣诞节来了！"
  npc_override_prontera_christmas_2008_christmas_season_af98af: "在这个圣诞季节！！"
  npc_override_prontera_christmas_2008_come_me_later_if_you_f4f334: "如果你想接任务，稍后再来找我。"
  npc_override_prontera_christmas_2008_count_your_blessings_sin_2e9810: "-数算你的祝福并歌唱！-"
  npc_override_prontera_christmas_2008_did_you_bring_all_materi_fbc2e8: "你把所有材料都带来了吗？"
  npc_override_prontera_christmas_2008_doesn_t_sound_cool_1053d6: "听起来不酷吗！？"
  npc_override_prontera_christmas_2008_don_t_cry_don_t_74dc06: "别哭，别哭！"
  npc_override_prontera_christmas_2008_don_t_worry_about_missio_e8d70b: "别担心这个任务。"
  npc_override_prontera_christmas_2008_don_t_worry_tastes_good_5e6ee5: "别担心，味道很好。"
  npc_override_prontera_christmas_2008_dye_grateful_hearts_a3f643: "-为感恩的心染色。-"
  npc_override_prontera_christmas_2008_even_shirt_goes_5a00be: "-连衬衫也放进去！-"
  npc_override_prontera_christmas_2008_every_year_adventurers_c_0828bc: "每年，冒险者们都会挑战攻击假圣诞老人安东尼奥，但由于他的帽子和服装，根本无法追上他！"
  npc_override_prontera_christmas_2008_first_let_me_shuffle_up_0b21cb: "首先让我把这些卡片洗一下...好的！！！"
  npc_override_prontera_christmas_2008_furthermore_he_put_bad_m_201e73: "此外，他在礼物上施加了坏魔法，使它们变成怪物！"
  npc_override_prontera_christmas_2008_gift_box_sounds_good_4c955a: "一个礼盒！听起来不错！"
  npc_override_prontera_christmas_2008_gift_boxes_all_right_49a2c6: "礼盒？！好的！"
  npc_override_prontera_christmas_2008_gift_boxes_been_changing_423d37: "自从安东尼奥在礼盒上施加了魔法后，礼盒就变成了怪物，所以怪物吃掉了水晶碎片！"
  npc_override_prontera_christmas_2008_go_brag_about_these_wond_e52df8: "去炫耀这些漂亮的衣服吧。没有我路易丝·金，就不会有这些。"
  npc_override_prontera_christmas_2008_go_please_f8d375: "继续请！"
  npc_override_prontera_christmas_2008_good_e42ce7: "好！"
  npc_override_prontera_christmas_2008_good_holiday_season_064a36: "祝你假期愉快！"
  npc_override_prontera_christmas_2008_good_job_thanks_playing_883f04: "干得好！感谢你和我玩卡片游戏！"
  npc_override_prontera_christmas_2008_guess_which_card_i_pick_79a3be: "猜我抽哪张牌，你就是赢家！"
  npc_override_prontera_christmas_2008_he_isn_t_alone_anymore_843c5c: "而且他不再孤单了...我是这么听说的..."
  npc_override_prontera_christmas_2008_he_seems_quite_resolved_4351b8: "自从他逃离人们之前，他似乎对自己相当坚定。"
  npc_override_prontera_christmas_2008_he_stolen_my_gifts_as_92cbc0: "他偷了我的礼物，还攻击了玩具工厂和姜饼城野外的冒险者。"
  npc_override_prontera_christmas_2008_her_great_skill_fd48ce: "-以她精湛的技艺。-"
  npc_override_prontera_christmas_2008_here_s_secret_5c7e69: "这里有个秘密！"
  npc_override_prontera_christmas_2008_here_you_f51fb7: "给你。"
  npc_override_prontera_christmas_2008_hey_boy_what_comes_mind_311a87: "嘿，男孩！当你想到"
  npc_override_prontera_christmas_2008_hey_girl_what_comes_mind_29b1dc: "嘿，女孩！当你想到"
  npc_override_prontera_christmas_2008_hey_loosers_05d871: "嘿，失败者！"
  npc_override_prontera_christmas_2008_hey_we_treat_you_good_5db4e4: "嘿，我们对你很好..."
  npc_override_prontera_christmas_2008_hey_you_what_comes_mind_49cc8c: "嘿！你！当你想到圣诞节时，你会想到什么？"
  npc_override_prontera_christmas_2008_ho_ho_ho_what_good_b8b2c3: "呵呵呵！真是个好孩子！"
  npc_override_prontera_christmas_2008_ho_ho_ho_what_good_f3d49e: "呵呵呵！真是个好女孩！"
  npc_override_prontera_christmas_2008_hooked_needle_feb65a: "-用带钩的针-"
  npc_override_prontera_christmas_2008_hotness_right_23ce03: "热度，对吧？"
  npc_override_prontera_christmas_2008_i_ain_t_envious_designer_4922a6: "我并不羡慕设计师皮埃尔。"
  npc_override_prontera_christmas_2008_i_always_thought_about_h_6063f5: "我一直觉得圣诞老人穿着太无聊的衣服很无聊。"
  npc_override_prontera_christmas_2008_i_am_genius_world_1ee0ae: "我是世界的天才。"
  npc_override_prontera_christmas_2008_i_am_so_devastated_since_797efe: "我非常沮丧，因为歌唱水晶一直是许多村庄孩子们的希望。"
  npc_override_prontera_christmas_2008_i_am_supposed_get_paid_a10973: "我应该得到很好的报酬，不过既然是圣诞节，我就免费吧！"
  npc_override_prontera_christmas_2008_i_bake_you_cake_i_5cfe23: "我可以为你烤蛋糕，如果你愿意，我还可以在蛋糕上刻上你的名字！"
  npc_override_prontera_christmas_2008_i_blessed_them_good_luck_b1610e: "我祝福他们好运！"
  npc_override_prontera_christmas_2008_i_could_make_glamorous_s_30def4: "我可以为他打造一个华丽的造型！"
  npc_override_prontera_christmas_2008_i_give_you_small_gift_89ff85: "如果你打败我，我会给你一个小礼物！"
  npc_override_prontera_christmas_2008_i_got_them_f5cd31: "我拿到了！"
  npc_override_prontera_christmas_2008_i_know_we_good_controlli_3ead58: "我知道我们不擅长控制东西，但我们的奖励很好，对吧？"
  npc_override_prontera_christmas_2008_i_louise_kim_am_generous_934b93: "我，路易丝·金，足够慷慨，下次会接受你。"
  npc_override_prontera_christmas_2008_i_m_happy_see_you_c8b37a: "很高兴再次见到你。"
  npc_override_prontera_christmas_2008_i_m_only_need_some_e40c10: "我只需要一些材料。那些超出我能力范围的东西..."
