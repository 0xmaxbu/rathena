Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job3_rune02_rune_knight_agreement_only_allows_us_401571: "协议只允许我们送候选者前往米德加营地，其他地方都不行。"
  npc_override_job3_rune02_rune_knight_ah_area_off_limits_you_9e42e2: "啊……这个区域禁止入内，你不应该在这里。请不要妨碍我们的工作。"
  npc_override_job3_rune02_rune_knight_ah_hey_friend_come_over_93526f: "啊……嘿，朋友，过来一下，我们聊聊……"
  npc_override_job3_rune02_rune_knight_ah_what_you_talking_abou_dbb4f5: "啊？你在说什么，雷诺阿？别那样说话！你让我们听起来像罪犯。"
  npc_override_job3_rune02_rune_knight_algiz_rune_means_chance_6d1ee5: "Algiz - 这个符文意味着机遇和挑战的力量。在符文熔炉中，它被塑造成翡翠色的斜线形状。"
  npc_override_job3_rune02_rune_knight_all_right_i_ll_send_4c8ac5: "好的。我马上送你去。稍后我会检查你的情况。"
  npc_override_job3_rune02_rune_knight_all_rune_knights_you_ve_2016a7: "你迄今为止遇到的所有符文骑士都是我和贝尔杰夫教导的弟子。现在你即将加入他们的行列。"
  npc_override_job3_rune02_rune_knight_although_you_seem_potent_4491b6: "虽然……你似乎有潜力成为追随剑道之人的同伴。"
  npc_override_job3_rune02_rune_knight_among_ordinary_runes_bla_ec1de9: "在11个普通符文中，空白符文是个例外。"
  npc_override_job3_rune02_rune_knight_ansuz_rune_means_prepara_e6a231: "Ansuz - 这个符文意味着准备或安排，以及克服未来不安的力量。在符文熔炉中，它被塑造成翡翠色的圆形。"
  npc_override_job3_rune02_rune_knight_anyway_drinks_here_reall_93abee: "不管怎样，这里的酒真的很好。你想来一杯吗？"
  npc_override_job3_rune02_rune_knight_aren_t_you_wrong_state_87b7db: "你现在状态不对吧？"
  npc_override_job3_rune02_rune_knight_arwez_rune_means_change_9d4ebe: "Arwez - 这个符文意味着变化、剧变和移动的力量。在符文熔炉中，它被塑造成灰色的菱形。"
  npc_override_job3_rune02_rune_knight_basically_power_magic_ca_e5bdc3: "基本上，不经训练就无法使用魔法力量，需要引导自然和元素的力量。"
  npc_override_job3_rune02_rune_knight_because_there_test_waiti_6a71bc: "因为有一个测试在等着你，需要使用这些符文石。"
  npc_override_job3_rune02_rune_knight_become_proud_rune_knight_21167c: "成为一名自豪的符文骑士。"
  npc_override_job3_rune02_rune_knight_beljeve_agreement_other_f67964: "贝尔杰夫与其他联盟国家有协议，保证我们符文骑士的自由行动，但是……"
  npc_override_job3_rune02_rune_knight_beljeve_s_disciples_who_455f18: "贝尔杰夫的弟子们开始学习如何用符文石为剑注入力量，他们被称为符文骑士。"
  npc_override_job3_rune02_rune_knight_besides_touching_stuff_p_15a284: " besides未经允许碰这里的东西。你能理解书中的内容吗？"
  npc_override_job3_rune02_rune_knight_cheers_our_new_future_e19ded: "为我们新的未来干杯……"
  npc_override_job3_rune02_rune_knight_congratulations_04ece6: "恭喜你。"
  npc_override_job3_rune02_rune_knight_congratulations_36b252: "恭喜你！"
  npc_override_job3_rune02_rune_knight_congratulations_becoming_569d1f: "恭喜你成为我们的一员。初级符文骑士，{0}。"
  npc_override_job3_rune02_rune_knight_congratulations_now_you_0a6f71: "恭喜你。现在你已经通过了所有测试，可以走上符文骑士的道路了。"
  npc_override_job3_rune02_rune_knight_congratulations_you_long_81b4e4: "恭喜你！你来到了期待已久的最终测试……我想你已经掌握了基础知识。"
  npc_override_job3_rune02_rune_knight_congratulations_you_ve_p_7ee1bf: "恭喜你。你通过了第一个测试。"
  npc_override_job3_rune02_rune_knight_congratulations_you_ve_p_c601d0: "恭喜你。你通过了测试。"
  npc_override_job3_rune02_rune_knight_content_test_get_rid_all_78753c: "测试内容是消灭所有怪物并存活5分钟。"
  npc_override_job3_rune02_rune_knight_course_i_only_accept_you_53b8a9: "当然，只有当你百分之百确定要成为符文骑士时，我才会接受你。"
  npc_override_job3_rune02_rune_knight_course_your_life_might_r_f20570: "当然，你的生命可能会受到格拉斯海姆幽灵的威胁……但克服这种风险对符文骑士候选者来说应该不难。"
  npc_override_job3_rune02_rune_knight_dagaz_rune_means_talent_b858d0: "Dagaz - 这个符文意味着天赋和忍受逆境的力量。在符文熔炉中，它被塑造成翡翠色的螺旋形。"
  npc_override_job3_rune02_rune_knight_did_you_fail_there_s_62e64b: "你失败了吗？但是，尝试次数没有限制。"
  npc_override_job3_rune02_rune_knight_discovery_transferring_m_327ed9: "将这种魔法力量转移到符文中是由贝尔杰夫和塞尔皮奥内完善的，并与符文骑士们分享。"
  npc_override_job3_rune02_rune_knight_don_t_worry_you_won_732370: "别担心，你不需要拥有像吉芬或朱诺的魔法师那样的知识。但你也不能是个白痴。"
  npc_override_job3_rune02_rune_knight_don_t_you_love_smell_df6bf2: "你不喜欢酒精的味道吗？"
  npc_override_job3_rune02_rune_knight_don_t_you_things_right_2c927a: "你现在不是有事情要做吗？"
  npc_override_job3_rune02_rune_knight_ehwaz_osilia_mannaz_ansu_b82e5a: "Ehwaz, Osilia, Mannaz, Ansuz, Hagalas, Kano, Rhydo, Turisus, Dagaz, Sowilo, Laguz, Isia, Pertz, Verkana, Gebo, Algiz, Arwez, Teiwaz, Wunjo, Jera, Nosiege, Ingz, Fehu, Urj。"
  npc_override_job3_rune02_rune_knight_ehwaz_rune_means_enhance_9e2b1c: "Ehwaz - 这个符文意味着增强运气和正面力量。在符文熔炉中，它将源力塑造成红色螺旋形。"
  npc_override_job3_rune02_rune_knight_enter_password_c0444b: "输入密码。"
  npc_override_job3_rune02_rune_knight_even_me_no_any_one_3dcbda: "即使是我……不，我们任何人惹恼了她都无法应付。"
  npc_override_job3_rune02_rune_knight_fehu_rune_means_attainme_1c01b3: "Fehu - 这个符文意味着成就和物质化的力量。在符文熔炉中，它被塑造成银色的圆形。"
  npc_override_job3_rune02_rune_knight_final_test_relatively_si_33c431: "最终测试相对简单。当你消灭格拉斯海姆所有魔法怪物时，一切就结束了……"
  npc_override_job3_rune02_rune_knight_finally_my_turn_i_m_1585a4: "终于！轮到我了吗？我太高兴了。"
  npc_override_job3_rune02_rune_knight_finally_you_honorable_ru_f765c5: "终于你成为了一名光荣的符文骑士。我很乐意帮助你。"
  npc_override_job3_rune02_rune_knight_find_our_rune_knight_gat_77fb08: "找到隐藏在格拉斯海姆内的我们符文骑士聚集地。"
  npc_override_job3_rune02_rune_knight_find_sage_serpeone_who_s_30cb53: "找到智者塞尔皮奥内，他一直在研究和帮助在灰真空米德加营地外的符文骑士们。"
  npc_override_job3_rune02_rune_knight_fortunate_rune_knights_d_4845e9: "幸运的是，符文骑士发现了它们用于正面用途。符文尚未被用于黑魔法，但如果落入错误之手，其力量肯定可能被滥用。"
  npc_override_job3_rune02_rune_knight_gebo_rune_means_cooperat_f6b452: "Gebo - 这个符文意味着合作与和谐的力量。在符文熔炉中，它被塑造成黄色的锥形。"
  npc_override_job3_rune02_rune_knight_get_rid_monsters_appeari_6c9967: "在8分钟内使用提供的符文石消灭出现在这里的怪物。"
  npc_override_job3_rune02_rune_knight_give_me_second_get_royal_249a30: "给我一点时间准备皇家礼物，然后再跟我谈话。"
  npc_override_job3_rune02_rune_knight_go_back_where_you_belong_6bcb08: "回到你属于的地方。"
  npc_override_job3_rune02_rune_knight_go_fiery_lady_library_ro_d9c4ff: "去图书馆那个火热的女士那里完成下一个测试，然后回来。"
  npc_override_job3_rune02_rune_knight_good_i_don_t_ask_22ae3a: "很好。我不需要再问你加入我们的资格了……1.S……现在我给你第一个任务。"
  npc_override_job3_rune02_rune_knight_good_luck_703764: "祝你好运。"
  npc_override_job3_rune02_rune_knight_good_then_i_ll_send_bb5484: "好的。那我现在送你去。但是，有一件事我需要告诉你。"
  npc_override_job3_rune02_rune_knight_ha_you_did_good_job_6220f3: "哈！考虑到我的测试有多难，你做得不错。如果你紧张了，现在可以放松了。"
  npc_override_job3_rune02_rune_knight_had_been_achieved_legend_9ce2d8: "这是由传说中的剑士贝尔杰夫实现的，他被称为剑术大师和可有可无支出的创始人。"
  npc_override_job3_rune02_rune_knight_hagalas_rune_means_freed_aa1e37: "Hagalas - 这个符文意味着自由和抵抗束缚的力量。在符文熔炉中，它被塑造成天蓝色的星形。"
  npc_override_job3_rune02_rune_knight_hahaha_you_heard_won_t_e685db: "哈哈哈。你听到了吗？这次不会容易的。我希望你能通过，我的朋友。"
  npc_override_job3_rune02_rune_knight_hanging_around_man_won_t_41575c: "在这家伙身边闲逛对你没好处。继续走你原来的路。"
  npc_override_job3_rune02_rune_knight_haven_t_you_failed_test_634382: "你不是在测试中失败了吗……如果你失败一次，10分钟内不能再次进入。"
  npc_override_job3_rune02_rune_knight_he_stares_me_absent_look_182ae1: "他用茫然的目光盯着我，过了一会儿他开始说话。"
  npc_override_job3_rune02_rune_knight_help_preparation_we_ve_m_530197: "为了帮助准备，我们与阿尔·德·巴兰的卡夫拉总部签订了合同，特别雇用了一名卡夫拉员工为这个聚集地服务。所以最好去见见她。"
  npc_override_job3_rune02_rune_knight_her_expression_suddenly_fd15e3: "但是当她看过来准备说话时，她的表情突然有些变化。"
  npc_override_job3_rune02_rune_knight_here_take_s_gift_i_de8a02: "来，拿着这个。这是我喜欢送给你们这样年轻一代的礼物。"
  npc_override_job3_rune02_rune_knight_here_you_ve_passed_go_5ef610: "给你，你通过了。回去找提格里斯队长完成下一个测试。"
  npc_override_job3_rune02_rune_knight_hey_i_think_i_told_57f19b: "嘿！我想我告诉过你至少要做20个。"
  npc_override_job3_rune02_rune_knight_hey_long_time_no_see_5f02fa: "嘿，好久不见，{0}。我想你没有什么重要的事要讨论，但请随意。"
  npc_override_job3_rune02_rune_knight_hey_renoa_go_easy_knight_9039b0: "嘿雷诺阿，对那个骑士温和点。你也是，你最好停止未经允许碰这里的东西。"
  npc_override_job3_rune02_rune_knight_hey_what_about_me_i_9d7689: "嘿……那我呢？我不是那样的！"
  npc_override_job3_rune02_rune_knight_hey_you_rune_knight_cand_6564e2: "嘿，你是曼努埃尔推荐的符文骑士候选者吗？我是符文骑士的提格里斯队长，你叫什么名字？"
  npc_override_job3_rune02_rune_knight_hey_you_weren_t_you_03c4d2: "嘿你，你不是在测试吗？卢纳雷亚，发生了什么事？测试都完成了吗？"
  npc_override_job3_rune02_rune_knight_hm_perfect_you_ve_come_f44aa3: "嗯……这太完美了。你带着非常罕见的好成绩来到这里。"
  npc_override_job3_rune02_rune_knight_hmm_bad_s_great_record_2842a9: "嗯，不错。虽然不是很好的记录，但你尽力了。"
  npc_override_job3_rune02_rune_knight_hmm_great_you_ve_come_3044a7: "嗯……这太好了。你带着不错的记录来到这里。"
  npc_override_job3_rune02_rune_knight_how_how_did_you_get_25da09: "怎么……你怎么进来的？！队长，我们有间谍！"
  npc_override_job3_rune02_rune_knight_however_direct_research_101900: "然而，对符文魔法力量的直接研究现在已经打破了人类的正常概念，正在进行中。"
  npc_override_job3_rune02_rune_knight_i_am_going_give_you_f43ccf: "我要给你一个让你直接处理符文的测试。"
  npc_override_job3_rune02_rune_knight_i_am_man_walking_way_7ffc3b: "我是一个走在剑道上的人。但我并不完全像你这样的卢恩-米德加尔特骑士。"
  npc_override_job3_rune02_rune_knight_i_am_only_knight_who_7fff74: "我是这个被诅咒的地方格拉斯海姆中唯一保持剑士之道的骑士。"
  npc_override_job3_rune02_rune_knight_i_am_renoa_i_am_dc271e: "我是雷诺阿。我负责教导和测试符文骑士候选者的符文和魔法。"
  npc_override_job3_rune02_rune_knight_i_am_telling_you_beforeh_6eacf2: "我先告诉你，我不测试或评判你的资格。符文骑士会是那个评判者。"
  npc_override_job3_rune02_rune_knight_i_am_very_proud_as_facedf: "作为一名符文骑士能在她身边服役，我非常自豪。"
  npc_override_job3_rune02_rune_knight_i_been_having_correspond_85995c: "我已经与人类通信多年。这是为了共同利益。总之，这就是我学会你们语言的方式。"
  npc_override_job3_rune02_rune_knight_i_believe_wind_change_al_dcc175: "我相信变化之风并不总是好的。"
  npc_override_job3_rune02_rune_knight_i_didn_t_think_candidate_475ed1: "我没想到今天会有候选者来到我这里……"
  npc_override_job3_rune02_rune_knight_i_don_t_know_how_751417: "我不知道你是怎么来到这里的。但看起来你来了一个不该来的地方。"
  npc_override_job3_rune02_rune_knight_i_forgot_check_if_you_55a1bb: "我忘了检查你是否有资格获得转职庆祝礼物……"
  npc_override_job3_rune02_rune_knight_i_heard_number_candidate_764ed3: "我听说在雷诺阿的测试中放弃的候选者人数一直很高。"
  npc_override_job3_rune02_rune_knight_i_heard_story_magical_sc_ea500f: "我从魔法学者那里听到了关于可以将魔法本质具象化的技术的故事。我开始研究将其具象化为符文，并得到了他们的帮助。"
  npc_override_job3_rune02_rune_knight_i_ll_buy_round_c9f239: "这轮我请。"
  npc_override_job3_rune02_rune_knight_i_ll_get_new_rune_f4dc53: "我会获取新的符文石，所以如果你的准备都完成了，请再跟我谈话。"
  npc_override_job3_rune02_rune_knight_i_ll_hand_over_all_3611d2: "我会把所有制作的符文石交给提格里斯队长。"
  npc_override_job3_rune02_rune_knight_i_ll_need_re_use_b95256: "我需要重新使用这些未使用的符文石。等我拿走所有测试符文石后再跟我谈话。"
  npc_override_job3_rune02_rune_knight_i_ll_start_first_test_a4b520: "我要开始符文骑士转职的第一个测试。"
  npc_override_job3_rune02_rune_knight_i_ll_start_last_test_e6a52f: "我要开始符文骑士转职的最后一个测试。"
  npc_override_job3_rune02_rune_knight_i_lucky_image_rune_stone_3d3c79: "我很幸运。我脑海中符文石的图像和建模的符文石不匹配，但它正常制作了。这种情况很少见。"
  npc_override_job3_rune02_rune_knight_i_m_happy_bottom_my_0f0d5f: "我从心底里高兴。我为你感到非常骄傲。"
  npc_override_job3_rune02_rune_knight_i_m_kidding_i_am_5b242b: "我不是在开玩笑，我真的很期待你作为符文骑士的新开始。"
  npc_override_job3_rune02_rune_knight_i_m_kidding_i_am_6a3f73: "我不是在开玩笑，我真的很期待你作为符文骑士的新开始。所以请尽力。"
  npc_override_job3_rune02_rune_knight_i_m_sure_we_ll_d38dd0: "我相信我们很快会再次相遇。我相信我们会再见面的。"
  npc_override_job3_rune02_rune_knight_i_see_hole_under_huge_2f8639: "我可以看到雷诺阿身后巨大符文石雕像下面的一个洞。这显然是我书中读到的大规模生产的符文加热炉。"
  npc_override_job3_rune02_rune_knight_i_think_you_ve_already_89c6a9: "我想你已经从雷诺阿那里听到了基本的解释和说明。现在似乎轮到我来帮助你了。"
  npc_override_job3_rune02_rune_knight_i_ve_been_waiting_you_23a9d7: "我一直在等你，符文骑士候选者。我是受塞尔皮奥内女士之托来帮助候选者的。"
  npc_override_job3_rune02_rune_knight_i_wait_day_you_become_3c86d8: "我会等待你成为真正的符文骑士成为我们同伴的那一天。"
  npc_override_job3_rune02_rune_knight_i_wait_day_you_become_ccee03: "我会等待你成为真正的符文骑士成为我们同伴的那一天。"
  npc_override_job3_rune02_rune_knight_if_all_your_preparations_befa27: "如果你所有的准备都完成了，我会送你去最终测试场。"
  npc_override_job3_rune02_rune_knight_if_there_s_any_equipment_f67a9b: "如果你现在穿着任何装备，或拿着任何东西。请在转职时刻清空它们。"
  npc_override_job3_rune02_rune_knight_if_you_also_follow_way_8ffe2d: "如果你也追随剑士之道，当你达到全部潜力时，我们的道路肯定会再次交叉。"
  npc_override_job3_rune02_rune_knight_if_you_any_business_here_2307bc: "如果你在这里有任何事务，我会送你去符文骑士聚集地。如果你准备好了，请告诉我。"
  npc_override_job3_rune02_rune_knight_if_you_any_problems_any_37143e: "如果你有任何问题或疑问，请跟我谈话。"
  npc_override_job3_rune02_rune_knight_if_you_breathing_human_t_dfcbd7: "如果你是活人，那就仔细听我说。我不会冒着生命危险在这里犹豫是否跟任何人说话。"
  npc_override_job3_rune02_rune_knight_if_you_continually_walk_a74f24: "如果你持续走在剑道上，你最终会感受到自己力量的极限。就像以前的我一样……"
  npc_override_job3_rune02_rune_knight_if_you_die_t_get_8dbd89: "如果你死亡或无法在规定时间内消灭所有怪物，我会将这次尝试视为失败。"
  npc_override_job3_rune02_rune_knight_if_you_fail_survive_cann_04d344: "如果你无法存活或无法在规定时间内消灭所有怪物，我会将其视为失败。"
  npc_override_job3_rune02_rune_knight_if_you_find_there_ll_66a879: "如果你能找到它，会有一个人在那里迎接你，所以让我们开始吧。"
  npc_override_job3_rune02_rune_knight_if_you_interested_i_ll_8d4cb8: "如果你有兴趣，我会向你介绍将引导你走上符文骑士之路的大师们，并附上我的推荐。"
  npc_override_job3_rune02_rune_knight_if_you_ready_i_ll_2e0a61: "如果你准备好了，我会为你打开通往灰真空中米德加营地的智者塞尔皮奥内的道路。你准备好了吗？"
  npc_override_job3_rune02_rune_knight_if_you_ready_i_ll_9122a4: "如果你准备好了，我会引导你前往直接传送至塞尔皮奥内的传送点。去见她并从她那里获得指示。"
  npc_override_job3_rune02_rune_knight_if_you_ready_just_talk_f7a856: "如果你准备好了，只需再跟我谈话。"
  npc_override_job3_rune02_rune_knight_if_you_ready_move_test_9c0013: "如果你准备好移动到测试场，跟我谈话。"
  npc_override_job3_rune02_rune_knight_if_you_ready_talk_me_54e5b0: "如果你准备好了，随时再跟我谈话。我随时都有空。"
  npc_override_job3_rune02_rune_knight_if_you_remember_books_yo_8a7f11: "如果你记得刚才在图书馆读过的书，你将能够在这里无需我的解释就制作出符文石。"
  npc_override_job3_rune02_rune_knight_if_you_remember_what_you_0f6bef: "如果你记得刚才在图书馆读过的内容，你将能够在这里无需我的解释就制作出符文石。"
  npc_override_job3_rune02_rune_knight_if_you_store_up_energy_96e1c6: "如果你通过消灭人类世界的邪恶生物来积蓄能量，我会将其转化为你可用的能量。"
  npc_override_job3_rune02_rune_knight_if_you_succeed_making_ru_2ad34c: "如果你成功制作符文石，它会自动成为你在成功时使用的符文石，并交付给提格里斯队长……所以请努力。"
  npc_override_job3_rune02_rune_knight_if_you_succeed_making_ru_428903: "如果你成功制作符文石，它会自动成为你在成为符文骑士时使用的符文石，所以请尽力。"
  npc_override_job3_rune02_rune_knight_if_you_taking_rune_knigh_4b31e1: "如果你正在参加符文骑士测试，我希望你尽力。这不会像卢纳雷亚的测试那么容易通过的，好吗？"
  npc_override_job3_rune02_rune_knight_if_you_understood_then_m_a36794: "如果你理解了，那就做好准备然后回来。"
  npc_override_job3_rune02_rune_knight_if_you_want_move_freely_6ea231: "如果你想在灰真空中自由移动，你必须通过正常途径获得资格，即获得米德加联盟的认可。这与我们无关。"
  npc_override_job3_rune02_rune_knight_if_you_want_take_test_a5534b: "如果你想再次参加测试。我可以送你去测试场。"
  npc_override_job3_rune02_rune_knight_if_you_want_walk_your_1b3792: "如果你想走在新的道路上并超越你当前的极限，我愿意帮助你。"
  npc_override_job3_rune02_rune_knight_if_you_want_you_ask_b21738: "如果你愿意，你可以向我们中的一个人求助。但不要认为我们总是会帮助。"
  npc_override_job3_rune02_rune_knight_if_you_wish_join_rune_edc402: "如果你希望加入符文骑士。请从一位向导那里获得推荐，然后再来找我。"
  npc_override_job3_rune02_rune_knight_ingz_rune_means_disrupti_b64ddf: "Ingz - 这个符文意味着中断和分离的力量。在符文熔炉中，它被塑造成紫色的菱形。"
  npc_override_job3_rune02_rune_knight_isia_rune_means_power_st_547e90: "Isia - 这个符文意味着停止一切的力量。在符文熔炉中，它被塑造成紫色的螺旋形。"
  npc_override_job3_rune02_rune_knight_jera_rune_means_comfort_130a8e: "Jera - 这个符文意味着舒适和休息的力量。在符文熔炉中，它被塑造成黄色的圆形。"
  npc_override_job3_rune02_rune_knight_jewel_called_as_rune_med_c57365: "被称为符文的宝石是一种包含无形存在、魔法力量及其本质的媒介，可以直接使用。"
  npc_override_job3_rune02_rune_knight_just_like_taste_drink_i_aa1261: "就像这杯饮料的味道。我希望这种味道永远留在这里。"
  npc_override_job3_rune02_rune_knight_just_wait_minutes_should_1b2030: "等5分钟，应该就轮到你了。"
  npc_override_job3_rune02_rune_knight_kano_rune_means_flame_pa_2939df: "Kano - 这个符文意味着火焰和激情，以及终结一切的力量。它的源力在符文熔炉中被塑造成红色的菱形。"
  npc_override_job3_rune02_rune_knight_knight_going_walk_way_ru_d3f930: "这位骑士将和我们一起走上符文骑士的道路，所以请给予祝福。"
  npc_override_job3_rune02_rune_knight_laguz_rune_means_uncerta_f7bbbc: "Laguz - 这个符文意味着不确定性和保护内在的力量。在符文熔炉中，它被塑造成黄色的菱形。"
  npc_override_job3_rune02_rune_knight_laphine_sage_serpeone_fo_570dae: "拉芬智者塞尔皮奥内和符文骑士创始人贝尔杰夫共同研究了符文，他们的研究成果直到最近才为世人所知。"
  npc_override_job3_rune02_rune_knight_laphine_tribe_fairies_as_24b98b: "拉芬族是灰真空中的妖精，据知与符文骑士的诞生有密切关系。"
  npc_override_job3_rune02_rune_knight_lastly_there_several_thi_000006: "最后，作为一名在瓦尔哈拉转职为领主骑士的有经验的骑士，有几件事需要注意。"
  npc_override_job3_rune02_rune_knight_leader_rune_knights_belj_380931: "符文骑士的领袖贝尔杰夫，据知在撒旦莫洛克复活时灰真空的维度门形成之前，就已经与妖精们有联系。"
  npc_override_job3_rune02_rune_knight_let_me_check_report_inst_9c0943: "让我检查一下照顾你测试的教官的报告。"
  npc_override_job3_rune02_rune_knight_let_me_see_manual_jungbe_1aa457: "让我看看……曼努埃尔和荣伯格必须完成了基本验证，那让我们马上开始测试吧。"
  npc_override_job3_rune02_rune_knight_let_me_send_dispatch_my_f82475: "让我向我的同伴们发一份 dispatch，告知你愿意加入我们的行列。"
  npc_override_job3_rune02_rune_knight_let_s_see_how_many_d6382e: "让我看看。有多少候选者来到这个房间？嘿，卢纳雷亚，这个是第几个候选者？"
  npc_override_job3_rune02_rune_knight_living_things_place_been_83fd7d: "这个地方的生物与我们人类世界的生物不同，它们一直在体内保存魔法能量。"
  npc_override_job3_rune02_rune_knight_looks_like_there_already_6366e1: "看起来测试室里已经有一位申请者了。"
  npc_override_job3_rune02_rune_knight_lunarea_proceed_first_te_e3d7e9: "卢纳雷亚，进行第一个测试。"
  npc_override_job3_rune02_rune_knight_magic_power_could_only_p_fdb574: "魔法力量以前只能由那些通过长期研究能够在体内驾驭魔法力量的人使用"
  npc_override_job3_rune02_rune_knight_magical_monsters_kinds_m_9ca444: "魔法怪物是你可能已经知道的格拉斯海姆3种魔法怪物……这将是一场不容易的 fight，但只要经历这最后的苦难，你就会走上符文骑士的道路。"
  npc_override_job3_rune02_rune_knight_magical_power_rune_knigh_890203: "符文骑士使用的魔法力量在技术层面上与人类世界制造的魔法力量并不相同。"
  npc_override_job3_rune02_rune_knight_magical_power_rune_pitch_43d043: "符文的力量在被塑造时会 pitch 和 toss。"
  npc_override_job3_rune02_rune_knight_making_rune_stones_achie_fc1f11: "符文石的制作是通过一种称为符文精通（rune mastery）的技能实现的，这是在成为符文骑士时学会的。"
  npc_override_job3_rune02_rune_knight_man_wearing_glorious_arm_707bcf: "一个穿着华丽盔甲、眼中充满激情的男人站在我面前。"
  npc_override_job3_rune02_rune_knight_mannaz_rune_means_hope_n_6695e9: "Mannaz - 这个符文意味着希望和新的开始，以及可以扭转绝境的正面力量。在符文熔炉中，它被塑造成翡翠色的菱形。"
  npc_override_job3_rune02_rune_knight_maybe_there_needs_machin_1836f0: "也许需要一台可以将拉芬语翻译成人类易懂语言的机器。"
  npc_override_job3_rune02_rune_knight_menu_captain_02ba29: "提格里斯队长:先生们，让我们看一会儿测试。"
  npc_override_job3_rune02_rune_knight_menu_captain_1c8a20: "提格里斯队长:对于符文骑士来说，这种考验不算什么！"
  npc_override_job3_rune02_rune_knight_menu_captain_37936d: "提格里斯队长:生命之火花……愿它再次燃烧。"
  npc_override_job3_rune02_rune_knight_menu_captain_4a4e6d: "提格里斯队长:符文骑士候选者……如果你想借用我们的力量，跟我们中的一个人谈话。"
  npc_override_job3_rune02_rune_knight_menu_captain_5fa447: "提格里斯队长:邪恶的恶魔！我会把你们送回坟墓！"
  npc_override_job3_rune02_rune_knight_menu_captain_83a443: "提格里斯队长:看来你不需要我们的帮助……让我们看一会儿测试。"
  npc_override_job3_rune02_rune_knight_menu_captain_af6186: "提格里斯队长:愿贝尔杰夫保佑你！"
  npc_override_job3_rune02_rune_knight_menu_chapter_6ee28e: "第一章:第二章:第三章:第四章:停止阅读"
  npc_override_job3_rune02_rune_knight_menu_check_04ccff: "检查已制作的符文数量？:我已经制作了全部20个符文石。"
  npc_override_job3_rune02_rune_knight_menu_enter_c5358e: "进入最终测试场。:我还没准备好。"
  npc_override_job3_rune02_rune_knight_menu_every_408e31: "所有准备都完成了。:我需要更多时间考虑。"
  npc_override_job3_rune02_rune_knight_menu_globalvar_b74d03: "全局变量检查:全局变量一次性修改"
  npc_override_job3_rune02_rune_knight_menu_i_209153: "我想去聚集地。:结束对话。"
  npc_override_job3_rune02_rune_knight_menu_i_297c48: "我想回去。:我想取消。"
  npc_override_job3_rune02_rune_knight_menu_i_2d0d81: "我想去聚集地。:没什么。"
  npc_override_job3_rune02_rune_knight_menu_i_84ab37: "我现在回去。:我留下。"
  npc_override_job3_rune02_rune_knight_menu_i_a18dc5: "我来成为符文骑士。:取消。"
  npc_override_job3_rune02_rune_knight_menu_i_d75734: "我还没准备好。:我准备好成为符文骑士了。"
  npc_override_job3_rune02_rune_knight_menu_i_e5573b: "我现在想回去。:我还没准备好。"
  npc_override_job3_rune02_rune_knight_menu_i_eafa0f: "我已经收集了足够的能量。:去聚集地。:停止对话。"
  npc_override_job3_rune02_rune_knight_menu_move_a00071: "现在移动到测试场。:给我时间准备。"
  npc_override_job3_rune02_rune_knight_menu_move_ab74f7: "移动到辉煌之地:取消。"
  npc_override_job3_rune02_rune_knight_menu_move_be22e1: "现在移动到测试场。:请给我时间准备。"
  npc_override_job3_rune02_rune_knight_menu_rune_00235f: "符文骑士雷诺阿:我比他们所有人都快！与众不同！"
  npc_override_job3_rune02_rune_knight_menu_rune_30b7d4: "符文骑士维尔皮诺:战斗并胜利！不要屈服于痛苦！"
  npc_override_job3_rune02_rune_knight_menu_rune_33e295: "符文骑士卢纳雷亚:快……找到并攻击敌人的弱点！"
  npc_override_job3_rune02_rune_knight_menu_rune_4614d8: "符文骑士卢纳雷亚:没有考验就没有成长。"
  npc_override_job3_rune02_rune_knight_menu_rune_4b5be5: "符文骑士维尔皮诺:继续前进！有障碍要克服。"
  npc_override_job3_rune02_rune_knight_menu_rune_4bb493: "符文骑士维尔皮诺:你不是那种会倒在这种地方的人。"
  npc_override_job3_rune02_rune_knight_menu_rune_8dde4c: "符文骑士卢纳雷亚:一切从零开始！"
  npc_override_job3_rune02_rune_knight_menu_rune_9aef44: "符文骑士雷诺阿:对于符文骑士来说，这种考验不算什么！"
  npc_override_job3_rune02_rune_knight_menu_rune_9cf80f: "符文骑士维尔皮诺:你并不孤单。我们在你身边。"
  npc_override_job3_rune02_rune_knight_menu_rune_c4ce1b: "符文骑士卢纳雷亚:还没结束……你需要更多力量……"
  npc_override_job3_rune02_rune_knight_menu_rune_c9c23b: "符文骑士雷诺阿:诞生符文！愿赋予你生命的力量！"
  npc_override_job3_rune02_rune_knight_menu_rune_d73b82: "符文骑士雷诺阿:风之符文！愿它赋予你力量！"
  npc_override_job3_rune02_rune_knight_menu_rune_f8042e: "符文骑士维尔皮诺:对于真正的符文骑士来说，这不是什么大考验！"
  npc_override_job3_rune02_rune_knight_menu_sure_c2ae13: "当然，喝一杯。:我拒绝。"
  npc_override_job3_rune02_rune_knight_menu_the_7cc372: "符文骑士的诞生:符文与魔法能量:停止阅读"
  npc_override_job3_rune02_rune_knight_menu_the_d23a4d: "25个符文石的名称如下:"
  npc_override_job3_rune02_rune_knight_menu_the_d34742: "符文石的制作:符文石能力详情:停止阅读"
  npc_override_job3_rune02_rune_knight_menu_the_ea02c6: "符文的基本用途:符文的类型:停止阅读"
  npc_override_job3_rune02_rune_knight_menu_use_4d1076: "使用符文加热炉:停止。"
  npc_override_job3_rune02_rune_knight_menu_who_585360: "你是谁？:你在这里做什么？:取消。"
  npc_override_job3_rune02_rune_knight_menu_yes_1e74e3: "是的，请。:还没有。"
  npc_override_job3_rune02_rune_knight_menu_yes_e3a4e4: "是的，带我去。:我有其他事。:取消。"
  npc_override_job3_rune02_rune_knight_menu_yes_f020cd: "是的，我准备好了。:还没有。"
  npc_override_job3_rune02_rune_knight_minutes_when_you_endure_7df361: "5分钟……当你坚持下来并消灭所有怪物时，你就成功了。"
  npc_override_job3_rune02_rune_knight_more_than_i_cannot_tell_e416f1: "除此之外……我不能告诉你更多。既然我代表我的人民在这里说话，而且我是凭特别通行证被允许进入你们营地的，我不能随便说话。"
  npc_override_job3_rune02_rune_knight_msg_6eae3a: "…"
  npc_override_job3_rune02_rune_knight_msg_93fcbf: "……"
  npc_override_job3_rune02_rune_knight_must_surprising_i_laphin_a89424: "一个拉芬族出现在你们人类的基地里，一定很令人惊讶吧。"
  npc_override_job3_rune02_rune_knight_must_too_much_you_extrac_e8b66a: "但是，对你来说，从这 land 的生物中提取魔法能量可能还为时过早。"
  npc_override_job3_rune02_rune_knight_my_name_manuel_i_am_e927a9: "我的名字是曼努埃尔。我被称为光辉符文骑士。当你告诉他你是我推荐的符文骑士候选者时，他会处理剩下的事。"
  npc_override_job3_rune02_rune_knight_my_opinion_you_seem_read_337f67: "在我看来，你似乎已经准备好开始新的道路……"
  npc_override_job3_rune02_rune_knight_nd_0cc3c5: "…… 第172个。"
  npc_override_job3_rune02_rune_knight_no_well_then_never_mind_54a6e3: "不？那好吧，算了。"
  npc_override_job3_rune02_rune_knight_nosiege_rune_means_weakn_f01495: "Nosiege - 这个符文意味着弱点和衰减的力量。在符文熔炉中，它被塑造成黄色的扇形。"
  npc_override_job3_rune02_rune_knight_now_all_tests_you_need_5150b1: "现在你需要参加的所有测试都结束了。回去找提格里斯队长告知他测试结果，然后感受作为符文骑士重生的深刻情感。"
  npc_override_job3_rune02_rune_knight_now_i_ll_cast_magic_55b817: "现在我会对你的身体施放一个魔法咒语，这样你就可以从其他生物身上收集魔法能量。"
  npc_override_job3_rune02_rune_knight_now_i_ll_start_test_c5877e: "现在我开始测试。"
  npc_override_job3_rune02_rune_knight_now_i_think_my_part_5583b8: "现在我想我的部分已经全部结束了。我希望你能成为一名光荣的符文骑士。"
  npc_override_job3_rune02_rune_knight_now_let_s_start_test_ec1ccd: "现在开始测试吧。"
  npc_override_job3_rune02_rune_knight_now_real_test_as_rune_226305: "从现在开始，这将是你想成为的符文骑士的真正测试。你需要准备参加下一个测试。"
  npc_override_job3_rune02_rune_knight_now_real_test_as_rune_65eeff: "现在，这将是符文骑士的真正测试。你必须准备参加下一个测试。"
  npc_override_job3_rune02_rune_knight_now_s_possible_those_who_32ff0d: "现在，即使通常不适合使用魔法力量的人也可以携带一个可以承载魔法的媒介，这是普通凡人以前无法 wield 的。"
  npc_override_job3_rune02_rune_knight_now_s_time_take_test_2c920e: "现在是参加关于符文的测试的时候了。我知道你经历了一个相当复杂的过程。"
  npc_override_job3_rune02_rune_knight_now_test_begins_first_yo_c72e97: "现在开始测试。首先，你会从那位美丽的冰冷女士那里得到第一个测试，所以请尽力。"
  npc_override_job3_rune02_rune_knight_now_testing_room_current_a7a1f9: "现在……测试室目前正在使用中……"
  npc_override_job3_rune02_rune_knight_now_there_many_instructo_7d50f4: "现在有许多教官在卢恩-米德加尔特各地寻找有天赋的剑士。他们在寻找将加入真正剑道的人。"
  npc_override_job3_rune02_rune_knight_now_there_s_only_last_daefc2: "现在，只剩下最后一个测试了。当你通过它时，你将正式踏上成为符文骑士的道路。"
  npc_override_job3_rune02_rune_knight_now_you_yourself_around_21a36b: "现在你可以在我们身边做自己，并为我们中的一员感到骄傲。"
  npc_override_job3_rune02_rune_knight_number_rune_knight_test_974365: "符文骑士测试场的数量现在是…… {0}。"
  npc_override_job3_rune02_rune_knight_number_rune_stones_made_abf4f6: "到目前为止制作的符文石数量是 {0}。"
  npc_override_job3_rune02_rune_knight_number_total_rune_stones_eba97c: "你需要制作的符文石总数正好是20个。记住这一点。"
  npc_override_job3_rune02_rune_knight_oh_i_heard_you_ve_6b3b93: "哦，我听说你通过了雷诺阿的测试，很少有人能通过。"
  npc_override_job3_rune02_rune_knight_oh_i_see_please_wait_e29f32: "哦，我明白了……请稍等。"
  npc_override_job3_rune02_rune_knight_oh_i_ve_heard_before_57770d: "哦，我以前听说过但我忘了。对了，你是{0}吗？我真心欢迎你的到来。"
  npc_override_job3_rune02_rune_knight_oh_really_then_keep_your_0fda49: "哦，真的吗？那就继续你的工作吧。我会继续我的任务。"
  npc_override_job3_rune02_rune_knight_oh_you_must_b92ef8: "哦，你一定是{0}。"
  npc_override_job3_rune02_rune_knight_okay_come_i_ll_guide_8b35f2: "好的，进来。我会引导你。"
  npc_override_job3_rune02_rune_knight_okay_lunarea_hey_listen_2cbbab: "好的卢纳雷亚。嘿，仔细听我说。卢纳雷亚是个不善言辞且安静的人，但你不应该忽视她。"
  npc_override_job3_rune02_rune_knight_once_someone_enters_into_27a7c4: "一旦有人进入测试场，你就不能直接进入了。测试是逐个进行的。"
  npc_override_job3_rune02_rune_knight_one_more_thing_if_you_41b316: "还有一件事。如果你还有剩余的技能点，把它们全部用掉学习技能。如果你还有技能点，就无法转职。"
  npc_override_job3_rune02_rune_knight_only_condition_you_get_r_e7b21e: "唯一的条件是你必须使用在前一个测试中制作的符文石来消灭这些怪物。"
  npc_override_job3_rune02_rune_knight_only_set_weapons_you_use_e17d2f: "你只能使用一套重量限制在400以内的武器。提供的符文石是30个攻击型符文石和30个防御型符文石。"
  npc_override_job3_rune02_rune_knight_ordinary_people_also_lea_3005b2: "普通人也可以学习这个技能，但它需要自己的机器，称为符文熔炉。"
  npc_override_job3_rune02_rune_knight_osilia_rune_equivalent_e_585b7f: "Osilia - 这个符文是等价交换，意味着你失去一个就得到一个，也意味着需要代价的力量。在符文熔炉中，它被塑造成紫色的斜线形状。"
  npc_override_job3_rune02_rune_knight_other_runes_consistent_p_c164f4: "其他11个符文具有持续的力量，不受任何位置影响，所以如果你不掌握全部11个普通符文和14个逆位符文，你就无法发挥出全部力量。"
  npc_override_job3_rune02_rune_knight_our_agents_opening_way_s_6cf1e8: "我们的代理人正在为参加符文骑士转职测试的学员开辟通往辉煌之地（Splendide）的道路。"
  npc_override_job3_rune02_rune_knight_our_master_beljeve_great_9826ec: "我们的主人贝尔杰夫……和伟大的智者塞尔皮奥内……"
  npc_override_job3_rune02_rune_knight_our_rune_knight_s_born_c009d7: "我们的符文骑士诞生于这项研究的结果，它通过使用符文实现了剑与魔法力量的双修。"
  npc_override_job3_rune02_rune_knight_pale_skinned_absent_look_b6b631: "这位肤色苍白、神情茫然的的女性符文骑士似乎不在乎。当然她似乎对我的存在不感兴趣"
  npc_override_job3_rune02_rune_knight_pale_skinned_female_rune_3e5a77: "这位被称为卢纳雷亚的苍白肤色女性符文骑士正静静地点头看着我。"
  npc_override_job3_rune02_rune_knight_patient_wait_your_turn_5819f2: "耐心等候轮到你。"
  npc_override_job3_rune02_rune_knight_pertz_rune_means_revelat_3b0e09: "Pertz - 这个符文意味着启示和机遇的力量。在符文熔炉中，它被塑造成银色的螺旋形。"
  npc_override_job3_rune02_rune_knight_please_brace_yourself_ga_5df26c: "请振作起来，通过 dispatch 那些怪物来收集足够的能量。"
  npc_override_job3_rune02_rune_knight_please_devoted_runes_hop_bc6705: "请致力于符文，希望你的生命能被它照亮。"
  npc_override_job3_rune02_rune_knight_please_get_rid_dullahan_f98ca7: "请消灭 ^0000FF10个杜拉汉^000000、^0000FF10个伪装怪^000000、^0000FF10个奎夫^000000、^0000FF10个海罗佐伊斯特^000000并收集它们的能量。"
  npc_override_job3_rune02_rune_knight_please_understand_devote_7bfbf7: "请理解这一点并致力于这个测试。"
  npc_override_job3_rune02_rune_knight_please_unequip_your_moun_e6a78e: "请卸下你的坐骑再回来。"
  npc_override_job3_rune02_rune_knight_portion_test_over_go_tal_a1179a: "这部分测试结束了。去跟提格里斯队长谈话。"
  npc_override_job3_rune02_rune_knight_power_rune_stones_way_sh_76717e: "符文石的力量是将我们体内的魔法力量塑造成符文的方式，符文取代了我们的身体作为媒介。"
  npc_override_job3_rune02_rune_knight_power_runes_perfect_more_693a0f: "符文的力量并不完美，需要进行更多研究才能使其完全安全。这取决于我和其他像你一样的符文骑士来确保继续这项研究。"
  npc_override_job3_rune02_rune_knight_preparations_going_well_255df9: "准备进行得顺利吗？"
  npc_override_job3_rune02_rune_knight_read_book_thoroughly_com_171bba: "仔细阅读这本书然后回来。如果你是不喜欢阅读和学习的人，那么作为符文骑士生活对你来说不会容易。"
  npc_override_job3_rune02_rune_knight_really_been_such_long_ti_66369e: "真的已经很长时间了，但卢纳雷亚的测试和我的测试天差地别。我希望你不要只是个肌肉发达的傻瓜。"
  npc_override_job3_rune02_rune_knight_refining_rune_stone_fail_17328e: "精炼符文石失败……请重试。"
  npc_override_job3_rune02_rune_knight_remaining_stuff_you_hold_f5b701: "你持有的剩余物品应该由中间的卡夫拉员工保管。"
  npc_override_job3_rune02_rune_knight_remember_day_day_forth_139cba: "从今天起记住这一天！"
  npc_override_job3_rune02_rune_knight_remember_well_fedead: "记住这一点。"
  npc_override_job3_rune02_rune_knight_renoa_i_know_you_ve_ed00cc: "雷诺阿，我知道你等了很久，但轮到你了。"
  npc_override_job3_rune02_rune_knight_result_studying_these_te_47eeb5: "研究这些技术的结果是符文石与剑的物理力量调谐和谐。"
  npc_override_job3_rune02_rune_knight_rhydo_rune_means_combina_9abdfb: "Rhydo - 这个符文意味着组合与重组以及完成的力量。在符文熔炉中，它被塑造成天蓝色的斜线。"
  npc_override_job3_rune02_rune_knight_right_every_challenge_al_4e158d: "对。每个挑战总是需要准备。好的，我会等你。"
  npc_override_job3_rune02_rune_knight_right_i_ll_send_you_e0631c: "好的。我马上送你去。稍后见。"
  npc_override_job3_rune02_rune_knight_right_place_our_sphere_w_174ad8: "就是这里……我们称之为灰真空的领域……它是由"
  npc_override_job3_rune02_rune_knight_rune_created_normally_95c77d: "1个{0}符文正常创建。"
  npc_override_job3_rune02_rune_knight_rune_kind_symbol_s_been_5b2cd7: "符文是一种自古代以来就在米德加大陆使用的符号。到目前为止，它只被神秘圈子使用。"
  npc_override_job3_rune02_rune_knight_rune_knight_job_change_g_77158e: "符文骑士转职全局变量已修改为0。测试场的使用现在可用。"
  npc_override_job3_rune02_rune_knight_rune_knight_job_change_g_d7fa78: "符文骑士转职全局变量现在是{0}。"
  npc_override_job3_rune02_rune_knight_rune_knight_job_change_m_797b36: "符文骑士转职管理模块启动"
  npc_override_job3_rune02_rune_knight_rune_knight_renoa_tell_y_c43515: "符文骑士雷诺阿会告诉你使用符文石的方法。"
  npc_override_job3_rune02_rune_knight_rune_knight_waiting_you_fb35f6: "符文骑士在格拉斯海姆等着你。他会引导你到格拉斯海姆塔入口。"
  npc_override_job3_rune02_rune_knight_rune_knights_gathering_e_7be0b3: "符文骑士是实现了剑与魔法和谐的进化剑士的集结。"
  npc_override_job3_rune02_rune_knight_rune_knights_use_rune_st_3cb9cc: "符文骑士使用符文石作为魔法力量的媒介，而不是直接使用体内制造的魔法能量。"
  npc_override_job3_rune02_rune_knight_rune_mastery_like_code_s_0bafe2: "符文精通就像作为符文骑士标记被放入体内的代码。"
  npc_override_job3_rune02_rune_knight_runes_created_total_smal_34d4cf: "这25个符文石是由总共25个小石头创建的，它们对物理冲击非常脆弱。所以在处理它们时需要特别小心。"
  npc_override_job3_rune02_rune_knight_runes_their_own_system_t_ebfb5d: "符文有自己的系统和类型，可以根据排列方式发挥出各种力量。但它们的力量水平目前无法通过已知手段测量。"
  npc_override_job3_rune02_rune_knight_runes_used_as_symbol_sys_0319bc: "符文被用作符号系统，然而，根据口头流传的故事，它被用于占卜或用于引导人类的潜意识。"
  npc_override_job3_rune02_rune_knight_s_consideration_other_te_62e8fa: "这是为了其他像你一样等待测试的测试者的考虑，所以在指定时间后再回来。"
  npc_override_job3_rune02_rune_knight_s_known_sword_master_bel_76e621: "据知，剑术大师贝尔杰夫感受到了力量的极限，所以他研究了克服凡人身体限制的方法。"
  npc_override_job3_rune02_rune_knight_s_limitless_alternative_9a7353: "这是一种无限的替代能源，对它们的研究仍在进行中。"
  npc_override_job3_rune02_rune_knight_s_much_there_some_gifts_8e0340: "虽然不多，但有一些礼物给在测试中取得好成绩的新符文骑士。"
  npc_override_job3_rune02_rune_knight_s_natural_result_image_r_e50577: "这是自然的结果。我脑海中符文石的图像和建模的符文石不匹配，所以成功率降低了。"
  npc_override_job3_rune02_rune_knight_s_too_bad_there_haven_a7bebf: "太糟糕了，还没有多少候选者来到我的测试部分，所以我只是在休息。"
  npc_override_job3_rune02_rune_knight_sage_already_been_touch_d99d43: "智者已经与我们联系了很长时间，所以你不需要担心理解塞尔皮奥内的语言。"
  npc_override_job3_rune02_rune_knight_sage_serpeone_one_who_be_00ff3e: "智者塞尔皮奥内是从符文骑士一开始就与我们在一起的人。"
  npc_override_job3_rune02_rune_knight_seems_enough_166feb: "似乎不够？"
  npc_override_job3_rune02_rune_knight_seems_you_still_taking_t_b3a86b: "看来你还在参加测试。请尽力通过所有测试。"
  npc_override_job3_rune02_rune_knight_she_finally_opens_her_mo_1822a6: "她终于开口说话了。"
  npc_override_job3_rune02_rune_knight_she_holds_up_her_chin_f75e80: "她静静地托起下巴，轻轻点头，注意到了我。"
  npc_override_job3_rune02_rune_knight_she_just_shakes_her_head_eeb751: "她只是摇头不说话，盯着我。她有一双锐利的眼睛。"
  npc_override_job3_rune02_rune_knight_she_nods_her_head_reache_b21a5f: "她点点头，轻轻伸出手。然后她拔出剑并发出信号。"
  npc_override_job3_rune02_rune_knight_she_says_so_my_friend_c67524: "她这么说，我的朋友。其实我不想看到下一个。所以请好好表现。"
  npc_override_job3_rune02_rune_knight_she_shows_small_smile_wh_7c6a2d: "她露出几乎看不见的微笑看着我。"
  npc_override_job3_rune02_rune_knight_shh_our_mission_somethin_74ff8e: "嘘……我们的任务不是要向公众透露的。请继续前行。"
  npc_override_job3_rune02_rune_knight_since_s_test_getting_hel_37bc68: "既然是测试，从我们那里获得帮助完全是你自己的选择。你接受我们的帮助或独自参加测试都没关系。"
  npc_override_job3_rune02_rune_knight_since_you_don_t_walk_b9b1d6: "既然你不走剑道，你不会理解我们的精神。我自己能行。走你自己的路。"
  npc_override_job3_rune02_rune_knight_so_please_your_best_26ccc8: "所以请尽力。"
  npc_override_job3_rune02_rune_knight_so_second_test_you_need_ad271e: "所以第二个测试，你需要拜访在灰真空中直接帮助符文骑士诞生的拉芬魔法学者。"
  npc_override_job3_rune02_rune_knight_so_then_let_s_check_42c3a2: "是这样吗？那让我们检查一下。"
  npc_override_job3_rune02_rune_knight_so_use_rune_stone_you_5a6cd6: "所以要使用符文石，你需要直接理解另一个领域的生物。"
  npc_override_job3_rune02_rune_knight_so_what_i_help_you_6d2cef: "那么，我能帮你什么？"
  npc_override_job3_rune02_rune_knight_some_us_been_contact_hum_d57c23: "我们中的一些人甚至在维度裂缝打开之前就一直在特殊情况下与人类保持联系。"
  npc_override_job3_rune02_rune_knight_soon_you_ll_see_way_398a1f: "很快你就会清楚看到我们需要走的路。"
  npc_override_job3_rune02_rune_knight_sowilo_rune_means_victor_03d719: "Sowilo - 这个符文意味着胜利和成功，以及安排和停止的力量。在符文熔炉中，它被塑造成天蓝色的扇形。"
  npc_override_job3_rune02_rune_knight_splendide_land_laphine_w_aaac86: "辉煌之地是拉芬族的 land。我们通过符文骑士和远征队之间的协议提供便利。"
  npc_override_job3_rune02_rune_knight_st_assignment_find_out_o_4c293e: "第一个任务是找到隐藏在格拉斯海姆内的我们符文骑士聚集地。"
  npc_override_job3_rune02_rune_knight_stones_different_meaning_105432: "这25个石头有不同的含义，其中14个在逆位时可以拥有与原来完全不同的力量和含义，所以研究这些特殊方面至关重要。"
  npc_override_job3_rune02_rune_knight_strive_live_way_sword_ho_f3bf8f: "努力以荣誉活出剑道……"
  npc_override_job3_rune02_rune_knight_take_final_test_rune_kni_666813: "从兵械库右侧的符文骑士维尔皮诺那里接受最终测试。"
  npc_override_job3_rune02_rune_knight_talk_kafra_employee_use_aecb95: "跟卡夫拉员工谈话以使用仓库。"
  npc_override_job3_rune02_rune_knight_teiwaz_rune_means_perfec_1fd2ee: "Teiwaz - 这个符文意味着完美胜利和绝对解决的力量。在符文熔炉中，它被塑造成金色的圆形。"
  npc_override_job3_rune02_rune_knight_tell_him_you_candidate_r_9be3bd: "告诉他你是符文骑士候选者，他会处理剩下的事。"
  npc_override_job3_rune02_rune_knight_temporarily_you_ll_able_92525d: "暂时你将能够从人类世界的邪恶生物身上提取魔法能量。当然你无法直接使用这种能量……"
  npc_override_job3_rune02_rune_knight_test_begins_now_first_yo_834f51: "现在开始测试。首先，你会从那位美丽的冰冷女士那里得到第一个测试，所以请尽力。"
  npc_override_job3_rune02_rune_knight_test_captain_tigris_reno_c4646f: "在这个测试中，提格里斯队长、雷诺阿、维尔皮诺和我将一起 visit。"
  npc_override_job3_rune02_rune_knight_test_only_one_hand_weapo_656bb0: "对于这个测试，只能装备单手武器、盾牌或双手武器。将其他装备放在中间的卡夫拉员工那里。"
  npc_override_job3_rune02_rune_knight_test_only_one_hand_weapo_feb6f8: "对于这个测试，只能装备单手武器、盾牌或双手武器。"
  npc_override_job3_rune02_rune_knight_test_you_making_rune_sto_4a3530: "在这个测试中，你将自己制作一个符文石，它也将用于你的最后一个测试。"
  npc_override_job3_rune02_rune_knight_test_you_making_rune_sto_c360a2: "在这个测试中，你将自己制作一个符文石，它将用于你的最后一个测试。"
  npc_override_job3_rune02_rune_knight_thank_you_all_your_troub_fd1118: "感谢你迄今为止参加测试的所有麻烦。好的，总之。"
  npc_override_job3_rune02_rune_knight_thanks_your_work_we_cont_ad0123: "感谢你的工作。我们将继续为符文骑士测试者执行我们的任务。"
  npc_override_job3_rune02_rune_knight_then_after_moment_she_pu_46dd00: "然后过了一会儿，她低下头，似乎沉浸在其他思绪中。"
  npc_override_job3_rune02_rune_knight_then_i_ll_send_you_8a49af: "那我会送你去你应该去的符文骑士聚集地。"
  npc_override_job3_rune02_rune_knight_there_been_so_many_candi_ea5f15: "有太多候选者未能通过卢纳雷亚的测试，我已经放弃计数了。"
  npc_override_job3_rune02_rune_knight_there_difference_dependi_fbe060: "会根据分数有所不同，但它们对所有符文骑士都有帮助。"
  npc_override_job3_rune02_rune_knight_there_many_paths_one_tak_ef720c: "世界上有许多道路可以选择。大多数人能看到他们的道路，但并不真正跟随它……"
  npc_override_job3_rune02_rune_knight_there_other_tests_you_ne_0a5c4c: "还有其他测试你需要完成。我希望你做得好。"
  npc_override_job3_rune02_rune_knight_there_s_evaluations_luna_58670e: "有卢纳雷亚、雷诺阿和维尔皮诺对你测试的评估，他们照顾了你的测试。"
  npc_override_job3_rune02_rune_knight_there_s_place_leads_rune_3bd1c3: "在格拉斯海姆骑士团内有一个通往符文骑士秘密聚集地的地方。自己找到那个地方。"
  npc_override_job3_rune02_rune_knight_there_s_place_leads_rune_58dd2b: "在格拉斯海姆骑士团内有一个通往符文骑士秘密聚集室的地方。自己找到那个地方。"
  npc_override_job3_rune02_rune_knight_there_s_royal_gift_rune_4af6aa: "卢恩-米德加尔特王国为所有新符文骑士准备了一份皇家礼物。"
  npc_override_job3_rune02_rune_knight_therefore_jobs_such_as_w_754d70: "因此，巫师和智者等职业应运而生，魔法成为他们自己的神圣领域。"
  npc_override_job3_rune02_rune_knight_toast_day_your_strength_1f86cf: "为你的力量能够承受符文骑士力量的那一天干杯！"
  npc_override_job3_rune02_rune_knight_toast_friendship_c4470b: "为友谊干杯~"
  npc_override_job3_rune02_rune_knight_total_number_rune_stones_97e6b8: "你需要制作的符文石总数是20个。"
  npc_override_job3_rune02_rune_knight_true_way_swordman_who_le_5c26ac: "学习和谐以打破剑之极限的剑士的真正道路是符文骑士。"
  npc_override_job3_rune02_rune_knight_turisus_rune_means_borde_e6a4f2: "Turisus - 这个符文意味着边界和限制的力量。在符文熔炉中，它被塑造成黄色的圆形。"
  npc_override_job3_rune02_rune_knight_um_you_rune_knight_candi_03d93e: "嗯……你是曼努埃尔说的那个符文骑士候选者吗？"
  npc_override_job3_rune02_rune_knight_umm_great_enough_amount_b69597: "嗯，这很好。足够量的活体魔法能量已经在你体内积累。"
  npc_override_job3_rune02_rune_knight_umm_runes_rune_knights_p_7b2eeb: "嗯，^0000FF符文与符文骑士^000000，^0000FF符文原理^000000，^0000FF符文的制作与使用^000000。从这3个开始……"
  npc_override_job3_rune02_rune_knight_umm_seems_you_ve_passed_0a0877: "嗯，看来你通过了卢纳雷亚的测试？我想我不需要再测试你的基础了。"
  npc_override_job3_rune02_rune_knight_umm_you_re_back_how_315c69: "嗯，你回来了？灰真空怎么样？"
  npc_override_job3_rune02_rune_knight_undeniably_our_rune_knig_fce82f: "不可否认，我们的符文骑士有一些差异，但我们不应该忘记我们的剑士根源。"
  npc_override_job3_rune02_rune_knight_unlike_humans_living_thi_ca5ed5: "与人类不同，灰真空中的生物通过在身体内持有魔法能量来保存它。"
  npc_override_job3_rune02_rune_knight_until_then_i_ll_here_3f0972: "到那时，我会在这里发现更多像你一样的候选者。"
  npc_override_job3_rune02_rune_knight_until_you_become_honorab_af16b6: "直到你成为光荣的符文骑士，我无法帮助你在米德加控制你的力量。"
  npc_override_job3_rune02_rune_knight_urj_rune_means_destiny_p_2f593e: "Urj - 这个符文意味着命运和限制的力量。在符文熔炉中，它被塑造成紫色的螺旋线形状。"
  npc_override_job3_rune02_rune_knight_use_these_runes_i_cast_bdd86c: "要使用这些符文，我会对你施放一个特殊的增益法术。"
  npc_override_job3_rune02_rune_knight_verkana_rune_means_richn_c7d3bc: "Verkana - 这个符文意味着丰富、诞生以及防御和保护的力量。在符文熔炉中，它被塑造成金色的星形。"
  npc_override_job3_rune02_rune_knight_very_cold_feeling_rune_k_6d853a: "一个全身黑衣、感觉非常冰冷的符文骑士正在怒视着我。"
  npc_override_job3_rune02_rune_knight_vicious_souls_they_keep_642b8c: "它们死后仍保持的恶毒灵魂是魔法力量的巨大来源。"
  npc_override_job3_rune02_rune_knight_wait_i_ll_collect_all_0822a0: "等等，我会收集所有之前提供的符文石。对为测试制作的符文石的使用有一定限制。"
  npc_override_job3_rune02_rune_knight_wait_place_prohibited_i_c3c75c: "等等！这个地方是禁止入内的。我不介意你四处游荡，但不要再打扰我。"
  npc_override_job3_rune02_rune_knight_walking_way_sword_perpet_83aee6: "走在剑道上是一场永恒的战斗。从现在开始，你前面可能有一段艰难的旅程……"
  npc_override_job3_rune02_rune_knight_we_been_living_secret_he_54e1bb: "我们已经在格拉斯海姆深处秘密生活了半个世纪，但现在是让世界知道我们目的的时候了。"
  npc_override_job3_rune02_rune_knight_we_guess_he_had_been_9786c6: "我们猜他早在维度裂缝被发现通往灰真空之前，就已经与拉芬族有联系了。"
  npc_override_job3_rune02_rune_knight_we_like_other_knights_wh_8a9b0e: "我们不像其他沉迷于排场和仪式的骑士，所以你可能还不了解我们。"
  npc_override_job3_rune02_rune_knight_we_looking_forward_you_h_a4d515: "我们期待你帮助符文骑士将荣誉传播到全世界。"
  npc_override_job3_rune02_rune_knight_we_rune_knights_group_le_71e99d: "我们是符文骑士。一个将真正力量以及身体素质引导至正义剑道的团体。"
  npc_override_job3_rune02_rune_knight_welcome_724486: "欢迎。"
  npc_override_job3_rune02_rune_knight_welcome_you_going_gather_9c2783: "欢迎，{0}。你要去聚集地吗？"
  npc_override_job3_rune02_rune_knight_welcome_you_one_taking_j_57e788: "欢迎，你是来参加符文骑士职业培训测试的人。我是塞尔皮奥内。"
  npc_override_job3_rune02_rune_knight_well_first_i_ll_give_49d9c7: "好首先，我会给你一个任务。让我们从学习开始。去图书馆学习这些书。"
  npc_override_job3_rune02_rune_knight_well_i_d_better_go_839e72: "好我现在最好去找剩下的候选者。"
  npc_override_job3_rune02_rune_knight_well_my_job_done_now_5fe77b: "好，我的工作现在完成了。你想开始你作为符文骑士的新生活吗？"
  npc_override_job3_rune02_rune_knight_well_person_your_strengt_880a63: "好，像你这样有实力的人一定已经去过那里了吧？"
  npc_override_job3_rune02_rune_knight_well_please_follow_me_8c8de4: "好，请跟我来。"
  npc_override_job3_rune02_rune_knight_well_then_i_ll_waiting_7618f1: "好那，我会在这里等你，去参加测试吧。"
  npc_override_job3_rune02_rune_knight_well_there_unidentified_068564: "好，这里有一个身份不明的人。"
  npc_override_job3_rune02_rune_knight_weren_t_you_listening_cf702f: "你没在听吗？"
  npc_override_job3_rune02_rune_knight_when_making_rune_stone_u_ccacb0: "当使用符文精通制作符文石时，它可以制作成你想要的符文属性，但这被归类为符文骑士自己的能力。"
  npc_override_job3_rune02_rune_knight_when_s_your_turn_enter_9a2a75: "当轮到你进入时，你会被直接送到那里。"
  npc_override_job3_rune02_rune_knight_when_test_done_talk_me_464353: "测试完成后，跟我谈话。总之你需要注意与其他人的测试进度。"
  npc_override_job3_rune02_rune_knight_when_test_done_talk_me_580756: "测试完成后，跟我谈话……总之你需要注意与其他人的测试进度。"
  npc_override_job3_rune02_rune_knight_when_time_comes_there_wa_9fe876: "当时候到来时，会有办法帮助你超越那个极限。直到你力量增长的那一天到来，我们至少还可以一起喝一杯。"
  npc_override_job3_rune02_rune_knight_when_you_become_rune_kni_8a002c: "但当你成为符文骑士时，你需要确保加入远征队以 fully 探索灰真空。"
  npc_override_job3_rune02_rune_knight_when_you_get_into_gather_b3fbd0: "当你进入聚集地时，跟提格里斯队长谈话。他总是在等待新成员出现。"
  npc_override_job3_rune02_rune_knight_when_you_making_rune_sto_f4db1a: "当你用符文熔炉制作符文石时，符文的类型由注入其中的魔法能量决定，无法更改。"
  npc_override_job3_rune02_rune_knight_when_you_operate_rune_fu_08ed2c: "当你操作符文熔炉时，身体的魔法能量通过它集中，并使其能够变成符文石。"
  npc_override_job3_rune02_rune_knight_when_you_ready_go_test_b05934: "当你准备好去测试场时跟我谈话。"
  npc_override_job3_rune02_rune_knight_whispers_sage_serpeone_d_9dba0c: "- 智者塞尔皮奥内的低语传递到我的脑海中。-"
  npc_override_job3_rune02_rune_knight_whoa_don_t_look_me_4d0923: "哇别那样看我。好吧，看到了吗？有抱负的符文骑士。回去找卢纳雷亚，按照她说的参加测试。那对你有好处。"
  npc_override_job3_rune02_rune_knight_why_all_rune_knights_bla_066931: "为什么所有符文骑士不是喋喋不休就是不善言辞且好斗……？"
  npc_override_job3_rune02_rune_knight_won_t_you_join_our_c61e68: "你不加入我们的弟兄吗？你看起来完全有资格成为我们中的一员。"
  npc_override_job3_rune02_rune_knight_wow_great_image_rune_sto_ae0f9d: "哇！这太棒了。我脑海中符文石的图像和建模的符文石完美匹配。制作得很好。"
  npc_override_job3_rune02_rune_knight_wow_what_s_you_ve_83cfc3: "哇！这是什么？你已经做了超过20个。现在还可以，但记得下次要听从指示。"
  npc_override_job3_rune02_rune_knight_wunjo_rune_means_intelli_b6d8ca: "Wunjo - 这个符文意味着智慧和智慧的力量。在符文熔炉中，它被塑造成翡翠色的星形。"
  npc_override_job3_rune02_rune_knight_you_cursed_ghost_place_y_d30659: "你是这个地方的诅咒幽灵吗？还是你是一个无知的冒险者？"
  npc_override_job3_rune02_rune_knight_you_don_t_want_touch_0ff110: "你不想碰那个东西。相信我，我不是在开玩笑。"
  npc_override_job3_rune02_rune_knight_you_found_place_correctl_f22b4f: "你正确地找到了这个地方。荣伯格派我来送你去聚集地。"
  npc_override_job3_rune02_rune_knight_you_gathering_enough_mag_1ecd2d: "你收集到足够的魔法能量了吗？还是你有什么问题？"
  npc_override_job3_rune02_rune_knight_you_haven_t_collected_en_49add6: "你还没有收集到足够的魔法能量。"
  npc_override_job3_rune02_rune_knight_you_know_place_called_gl_98d472: "你知道一个叫格拉斯海姆的地方吗？有一位符文骑士在那里等你，他会引导你到格拉斯海姆塔入口。"
  npc_override_job3_rune02_rune_knight_you_ll_wait_regulation_t_c0d5ec: "你必须等待……规定测试必须逐个进行。"
  npc_override_job3_rune02_rune_knight_you_look_like_you_don_0de8d9: "你看起来不明白为什么我要重复书中已经写好的故事的教学。"
  npc_override_job3_rune02_rune_knight_you_might_know_already_i_c50e97: "你可能已经知道，如果你骑着Peco Peco，你应该把它留下。如果你带了它，放下它然后再来。"
  npc_override_job3_rune02_rune_knight_you_might_walking_way_sw_46ea32: "你可能正走在剑道上，但你还不是符文骑士。如果你明白我的意思，不要在这里 wandering 太多。"
  npc_override_job3_rune02_rune_knight_you_now_honorable_rune_k_c9ddfa: "你现在是一名光荣的符文骑士。"
  npc_override_job3_rune02_rune_knight_you_now_member_our_selec_23668c: "你现在是我们精选弟兄的一员。我还记得我第一次见到你的时候。"
  npc_override_job3_rune02_rune_knight_you_one_who_wants_rune_6c0f1b: "你是想成为符文骑士的人吗？今天已经有很多人了。"
  npc_override_job3_rune02_rune_knight_you_re_sure_now_f8f592: "你现在确定吗？"
  npc_override_job3_rune02_rune_knight_you_reached_limit_time_s_5bafcf: "你达到了时间限制，所以我会将测试视为失败。"
  npc_override_job3_rune02_rune_knight_you_read_all_books_libra_06f385: "你读完了图书馆所有的书吗？读起来不会容易，但如果你决心成为符文骑士，你必须具备这种基础知识。"
  npc_override_job3_rune02_rune_knight_you_ready_go_back_rune_22082e: "你准备好回到符文骑士聚集地了吗？"
  npc_override_job3_rune02_rune_knight_you_sent_ash_vacuum_peop_ebb15f: "你将被送到灰真空。派往米德加营地的人都是经过认证的冒险者和官员。"
  npc_override_job3_rune02_rune_knight_you_still_smell_like_fle_148991: "你仍然有 fledging 的味道。为符文骑士带来荣誉，提升你的力量……"
  npc_override_job3_rune02_rune_knight_you_sure_you_don_t_4db118: "你确定吗？你不知道这些饮料的真正优雅……"
  npc_override_job3_rune02_rune_knight_you_understand_i_think_t_a4811b: "你必须理解。我认为这正是展示测试教官个性的测试。嗯……"
  npc_override_job3_rune02_rune_knight_you_ve_been_very_success_213423: "你在最后一个测试之前一直非常成功。"
  npc_override_job3_rune02_rune_knight_you_ve_brought_just_righ_aabcba: "你带来的数量正好。我会把所有完成的符文石交给提格里斯队长。"
  npc_override_job3_rune02_rune_knight_you_ve_got_too_many_319fe1: "你带的东西太多了。你无法继续前进。请在减重后再试。"
  npc_override_job3_rune02_rune_knight_you_walk_way_sword_too_cc54f1: "你也走在剑道上对吧？那我们能互相理解。和 fellow 剑士一起喝酒味道更好。"
  npc_override_job3_rune02_rune_knight_you_want_go_back_expedit_b09ee8: "你想回到远征队的营地吗？"
  npc_override_job3_rune02_rune_knight_you_want_go_back_gatheri_d98b7f: "你想回到聚集地吗？如果你想，我可以马上送你回去。但要继续测试，你需要再来见我。"
  npc_override_job3_rune02_rune_knight_you_want_go_back_rune_9e483d: "你想回到符文骑士聚集地吗？"
  npc_override_job3_rune02_rune_knight_you_want_go_out_splendid_36a5f2: "你想出去到辉煌之地 field 吗？"
  npc_override_job3_rune02_rune_knight_your_name_right_i_see_256c5e: "你的名字是{0}，对吧？我可以清楚地看到你有资格成为我们的同伴。"
  npc_override_job3_rune02_rune_knight_your_test_successful_1c6b25: "你的测试成功了吗？"
