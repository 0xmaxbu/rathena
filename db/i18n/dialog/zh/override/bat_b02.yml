Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_bat_b02_flavius02_battle_station_23a95b: "战斗据点"
  npc_override_bat_b02_flavius02_bye_e17e76: "再见。"
  npc_override_bat_b02_flavius02_cancelled_d3e414: "已取消。"
  npc_override_bat_b02_flavius02_croix_s_crystal_been_des_3b6b33: "克鲁瓦的水晶已被摧毁。"
  npc_override_bat_b02_flavius02_guardian_protecting_croi_04889d: "守护克鲁瓦水晶的守护者已被击杀。"
  npc_override_bat_b02_flavius02_guardian_protecting_guil_318399: "守护纪尧姆水晶的守护者已被击杀。"
  npc_override_bat_b02_flavius02_guillaume_s_crystal_been_4f6757: "纪尧姆的水晶已被摧毁。"
  npc_override_bat_b02_flavius02_just_close_your_eyes_81005b: "闭上眼睛，"
  npc_override_bat_b02_flavius02_may_i_help_you_5a540b: "有什么可以帮你的吗？"
  npc_override_bat_b02_flavius02_menu_axl_d99480: "艾克斯·罗斯，斯旺德里:是的，长官。"
  npc_override_bat_b02_flavius02_menu_croix_0a0a2a: "克鲁瓦·文特纳尔·斯旺德里:虽然纪尧姆正在拼命想战胜我们，但胜利属于我们。让我们展示我们的力量给他们看看。"
  npc_override_bat_b02_flavius02_menu_guillaume_995996: "纪尧姆·文特纳尔·艾克斯·罗斯:让我们进攻摧毁那座水晶！"
  npc_override_bat_b02_flavius02_menu_marollo_14a89c: "马罗洛七世:双方阵营实力相当，很难判断哪支队伍更优秀。"
  npc_override_bat_b02_flavius02_menu_marollo_5ee05e: "马罗洛七世:如果你无法接受结果，那就去另一场峡谷战斗中再试一次吧！"
  npc_override_bat_b02_flavius02_menu_marollo_877a84: "马罗洛七世:这场弗拉维乌斯战斗真是浪费时间。我将根据你们的进展来决定胜负。"
  npc_override_bat_b02_flavius02_menu_marollo_bcc770: "马罗洛七世:纪尧姆·马罗洛、克鲁瓦·马罗洛！以及他们的追随者们！"
  npc_override_bat_b02_flavius02_menu_release_d63594: "全部释放:取消。"
  npc_override_bat_b02_flavius02_take_deep_breath_48d63b: "然后深呼吸。"
  npc_override_bat_b02_flavius02_why_you_come_here_as_6484f8: "你为什么以纪尧姆的身份来到这里？你将被送回你应该去的地方！"
  npc_override_bat_b02_flavius02_why_you_here_croix_merce_7b57d2: "你为什么在这里，克鲁瓦雇佣兵？我确信能战胜像你这样的愚蠢克鲁瓦。哈！"
  npc_override_bat_b02_flavius02_you_free_pain_954ca5: "你可以摆脱痛苦。"
