  npc_override_aldebaran_aldebaran_looks_like_you_a7b25d: "你身上"
  npc_override_aldebaran_aldebaran_lottery_machine_65f2be: "几次呢？"
  npc_override_aldebaran_aldebaran_luck_today_ready_210978: "运气如何。准备好了吗？"
  npc_override_aldebaran_aldebaran_luckily_their_eyesight_p_09a1dc: "幸运的是，它们的视力很差，所以只要你保持安全距离走过，它就不会注意到你。"
  npc_override_aldebaran_aldebaran_lucky_day_adventurer_4672f6: "幸运日，冒险者！"
  npc_override_aldebaran_aldebaran_many_people_all_over_con_6c0d3e: "都有许多从大陆各地赶来这座城市的人，只为一睹哥哥的风采。"
  npc_override_aldebaran_aldebaran_materials_alchemy_payon_50e41d: "斐扬炼金术的材料稀缺，人们对该领域的兴趣最终减弱。现在，你只能在艾尔帕兰学习炼金术。"
  npc_override_aldebaran_aldebaran_may_god_bless_you_f924bd: "愿神保佑你……"
  npc_override_aldebaran_aldebaran_may_part_reason_how_we_7cf81b: "这或许是我们能够"
  npc_override_aldebaran_aldebaran_maybe_advice_come_handy_db0ba6: "既然你知道了，这个建议可能派得上用场。与魔物战斗时，一定要记住技能和武器属性的重要性。"
  npc_override_aldebaran_aldebaran_maybe_next_time_838479: "下次再说吧"
