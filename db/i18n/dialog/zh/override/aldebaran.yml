  npc_override_aldebaran_aldebaran_item_equip_etc_tabs_work_b52eac: "^3355FF道具^000000、^3355FF装备^000000和^3355FF其他^000000标签页的作用与角色道具栏中的标签页相同。"
  npc_override_aldebaran_aldebaran_items_dropped_monsters_p_4b60ab: "魔物掉落的装备比NPC商店出售的寻常武器或防具拥有更多插槽。"
