  npc_override_aldebaran_aldebaran_if_you_right_click_equip_49d5cb: "如果你在道具栏中右键点击可装备物品，会看到它处于未鉴定状态，需要进行鉴定。那该怎么办呢？"
  npc_override_aldebaran_aldebaran_if_you_try_insert_card_ea2327: "如果你试图把这张卡片插入有很多插槽的短剑，"
