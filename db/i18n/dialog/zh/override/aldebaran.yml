  npc_override_aldebaran_aldebaran_let_s_see_4d37ed: "让我看看……"
  npc_override_aldebaran_aldebaran_let_s_see_how_good_5191fd: "来看看你今天的"
  npc_override_aldebaran_aldebaran_let_s_see_how_lucky_24a591: "看看你有多幸运。好！准备好了吗！"
  npc_override_aldebaran_aldebaran_let_s_stop_talking_about_8464ea: "我们别说这些无聊的事了。"
  npc_override_aldebaran_aldebaran_level_weapons_attack_str_cb3a9f: "等级3的武器每级增加5点攻击力，等级4的武器每级增加7点。"
  npc_override_aldebaran_aldebaran_level_weapons_which_lowe_dcfd06: "等级1的武器是最低阶的，需要一种名为^3355FF强化武器金属-级数一^000000的金属才能升级。"
  npc_override_aldebaran_aldebaran_level_weapons_you_may_up_6f8bfb: "等级1的武器可以安全升级到+7而不会破坏。等级2的武器可以升级到+6。等级3的武器可以安全升级到+5。"
  npc_override_aldebaran_aldebaran_level_weapons_you_upgrad_f8a843: "等级4的武器可以不太冒险地升级到+4。至于防具，可以升级到+4。但如果升级失败，装备就会损坏！"
  npc_override_aldebaran_aldebaran_like_redeem_your_25c205: "用这些积分"
  npc_override_aldebaran_aldebaran_listen_25b3eb: "听着……"
  npc_override_aldebaran_aldebaran_ll_give_you_edge_1b2e89: "它会让你在"
  npc_override_aldebaran_aldebaran_long_live_alchemists_8b64cc: "炼金术士万岁！"
  npc_override_aldebaran_aldebaran_long_luxurious_hair_impo_e97243: "乌黑亮丽的长发对你很重要是吧？我想这样的头发让女人看起来很优雅。"
  npc_override_aldebaran_aldebaran_long_time_ago_there_f11950: "很久以前，有"
