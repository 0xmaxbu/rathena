Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_aldebaran_aldebaran_aaaaarrrggghhh_i_am_trou_9f9e9c: "啊啊啊啊啊……我有麻烦了！"
  npc_override_aldebaran_aldebaran_about_free_units_0d1116: "背包里大约有^FF00001100^000000单位的"
  npc_override_aldebaran_aldebaran_access_go_through_89bd8f: "将有权通过"
  npc_override_aldebaran_aldebaran_after_next_year_s_athlet_213ec3: "明年的田径比赛结束后，我要和哥哥一起去环游世界。"
  npc_override_aldebaran_aldebaran_after_receiving_070ae0: "获得这份奖品后，"
  npc_override_aldebaran_aldebaran_ah_let_me_tell_you_3594f6: "啊，让我告诉你如何把卡片插入物品。"
  npc_override_aldebaran_aldebaran_ah_now_i_remember_just_040842: "啊，我想起来了！就在几天前，我看到一种非常有趣的魔物！那是一只长着天使翅膀的波利！"
  npc_override_aldebaran_aldebaran_ah_so_you_like_intellect_6c60fe: "啊，原来你喜欢知性型。很好，很好。"
  npc_override_aldebaran_aldebaran_ah_so_you_tend_like_266f2d: "啊，原来你喜欢活泼主动的类型。我能理解……"
  npc_override_aldebaran_aldebaran_ah_you_total_d1ab3a: "啊，你总共有"
  npc_override_aldebaran_aldebaran_al_de_baran_3fe037: "艾尔帕兰"
  npc_override_aldebaran_aldebaran_al_de_baran_512d12: "艾尔帕兰。"
  npc_override_aldebaran_aldebaran_al_de_baran_known_world_6c9e6e: "艾尔帕兰作为运河之城闻名于世。这些水道为我们美丽的城市增添了一份精致而浪漫的气息。"
  npc_override_aldebaran_aldebaran_al_de_baran_such_wonderf_c3feab: "艾尔帕兰真是个美妙的地方，浪漫的运河和古典的建筑。我最喜欢和漂亮的女友一起在这座城市漫步。"
  npc_override_aldebaran_aldebaran_alchemists_one_nd_jobs_a_b6372a: "炼金术士是二转职业之一，能够利用艾尔帕兰古代的知识，用多种材料制作物品。"
  npc_override_aldebaran_aldebaran_alchemists_specialize_ch_9bf975: "炼金术士专门从事化学研究，以便用各种东西制造有用的物品。"
  npc_override_aldebaran_aldebaran_almost_every_armor_items_37f0ab: "几乎在城镇商店出售的所有防具"
  npc_override_aldebaran_aldebaran_alright_here_we_go_90e644: "好，开始吧！"
  npc_override_aldebaran_aldebaran_alright_then_ca7fd5: "好吧！"
  npc_override_aldebaran_aldebaran_alright_then_i_tell_you_bd35e1: "好吧，那我就给你讲讲魔物卡片和物品插槽的故事。"
  npc_override_aldebaran_aldebaran_alright_then_please_95a4d3: "那么，请"
  npc_override_aldebaran_aldebaran_also_d_really_impractica_90ed7f: "而且，把 cart 租给无法制造或销售商品的人也完全不实际。"
  npc_override_aldebaran_aldebaran_also_kafra_girls_alone_t_85ea8c: "另外，卡普拉女孩们无法独自完成传送。我们只是接收并处理您的传送请求。"
  npc_override_aldebaran_aldebaran_also_when_you_mouse_over_11f492: "此外，当你把鼠标移到道具栏或摆摊窗口的装备上时，物品名称后会用括号标出插槽数量。"
  npc_override_aldebaran_aldebaran_although_assassins_benef_fde7c1: "虽然刺客受益于极快的速度和高敏捷，但他们仍然需要一些灵巧。"
  npc_override_aldebaran_aldebaran_although_lacks_strength_bb4050: "虽然它的强度不如其他金属，但容易寻找和获取。你可以通过击杀魔物或在城镇的锻造店购买来获得。"
  npc_override_aldebaran_aldebaran_always_here_serve_you_2898db: "随时为您服务。"
  npc_override_aldebaran_aldebaran_always_your_side_7cf7e6: "永远站在您这边。"
  npc_override_aldebaran_aldebaran_amazing_picky_most_wonde_7afb51: "'神奇 picky'是世界上最棒、最独特的名字，"
  npc_override_aldebaran_aldebaran_ambernite_50b59c: "琥珀娜"
  npc_override_aldebaran_aldebaran_ambernite_e70508: "琥珀娜吗？"
  npc_override_aldebaran_aldebaran_ancient_alchemists_0ed6e5: "古代的炼金术士们"
  npc_override_aldebaran_aldebaran_and_c5ad1f: "以及……"
  npc_override_aldebaran_aldebaran_any_kafra_passes_d41ec9: "没有卡普拉通行证。"
  npc_override_aldebaran_aldebaran_any_means_654fc2: "无论如何，"
  npc_override_aldebaran_aldebaran_anyway_i_hope_you_enjoy_985113: "总之，希望您在卡普拉公司总部的访问愉快。"
  npc_override_aldebaran_aldebaran_aren_t_level_weapons_coo_3e9c69: "等级4的武器很酷吧！"
  npc_override_aldebaran_aldebaran_aren_t_we_straying_off_0494dd: "我们是不是有点离题了？啊，你一定是那种冒险者！"
  npc_override_aldebaran_aldebaran_armor_items_2c1e81: "防具类物品中。"
  npc_override_aldebaran_aldebaran_arrive_here_prontera_gef_a97576: "从普隆德拉或吉芬来到这里，你必须穿越米约尔尼尔山脉。"
  npc_override_aldebaran_aldebaran_arrrrghh_shut_up_listen_72ab66: "啊啊啊！闭嘴听我说！我花了一周才背下这些！我的记忆力可没其他卡普拉员工那么好……！"
  npc_override_aldebaran_aldebaran_as_i_saying_kafra_corpor_de90d2: "正如我刚才所说，卡普拉公司是在八千五百年前由埃米利奥·亚历山大·卡普拉创立的，嗯……'卡普拉'这个词的发明者？"
  npc_override_aldebaran_aldebaran_as_long_as_ancient_alche_e94b75: "只要古代炼金术士"
  npc_override_aldebaran_aldebaran_as_reason_certain_policy_73182b: "关于这项政策的原因，我们曾经遇到年轻稚嫩的初心者把所有东西塞进仓库的问题。"
  npc_override_aldebaran_aldebaran_as_super_novices_well_we_df36fb: "至于超级初心者，嗯，我们其实不该租手推车给他们，因为艾尔帕兰的超级初心者协会没有与我们签约。"
  npc_override_aldebaran_aldebaran_as_you_already_know_if_1f74ce: "如你所知，如果你曾经获得过魔物卡片，"
  npc_override_aldebaran_aldebaran_as_you_may_know_kafra_327190: "如您所知，卡普拉公司与商人公会，以及米德加兹的铁匠公会和炼金术士公会有特殊关系。"
  npc_override_aldebaran_aldebaran_as_you_probably_already_a9d4fe: "如您所知，顾客必须至少拥有基本技能等级6才能使用卡普拉仓库。"
  npc_override_aldebaran_aldebaran_as_you_see_fc43df: "如你所见，"
  npc_override_aldebaran_aldebaran_awakening_potion_better_30596c: "觉醒药水比集中药水更好！"
  npc_override_aldebaran_aldebaran_awww_daa9b8: "啊……"
  npc_override_aldebaran_aldebaran_back_after_storing_some_b2f182: "卡普拉仓库"
  npc_override_aldebaran_aldebaran_back_then_people_gave_hi_2854b6: "那时人们给他取了个绰号，叫'艾尔帕兰的大嘴鸟'，"
  npc_override_aldebaran_aldebaran_because_shows_soldier_hi_18ce2e: "因为这表示它健康状况最佳。"
  npc_override_aldebaran_aldebaran_behind_scenes_skilled_pr_43d53c: "在幕后，熟练的专业人员和技术人员24小时工作，确保您能快速安全地传送到目的地。"
  npc_override_aldebaran_aldebaran_believe_4aa129: "难以置信！"
  npc_override_aldebaran_aldebaran_best_mercenary_soldier_t_3c0166: "最优秀的佣兵脚踝细、脖子白！"
  npc_override_aldebaran_aldebaran_better_mercenary_soldier_f48661: "想要更强的佣兵，就要付更多钱，懂吗？"
  npc_override_aldebaran_aldebaran_bit_more_impunity_fc25b8: "更肆无忌惮地使用技能了~"
  npc_override_aldebaran_aldebaran_blacksmith_s_family_live_11da5a: "这位铁匠的家人住在这里，因为他的妻子体弱多病。因为她的身体状况，需要服用艾尔帕兰附近生长的药草。"
  npc_override_aldebaran_aldebaran_blocks_people_outside_co_fe2a6b: "阻挡了外人进入这座城镇。"
  npc_override_aldebaran_aldebaran_blossom_strikes_me_as_gi_ba3e9e: "布洛森给我的感觉是邻家女孩型。我猜你就是喜欢这种类型的女孩吧？"
  npc_override_aldebaran_aldebaran_blue_potions_d069a6: "3个蓝色药水~"
  npc_override_aldebaran_aldebaran_boing_boing_clink_b1baa3: "'砰……砰……叮当！'"
  npc_override_aldebaran_aldebaran_boooo_red_potions_bbc517: "切！100个红色药水。"
  npc_override_aldebaran_aldebaran_both_those_places_tough_6d0bcf: "这两个地方都"
  npc_override_aldebaran_aldebaran_brand_new_shiny_pair_f5e46e: "一双崭新闪亮的"
  npc_override_aldebaran_aldebaran_bruke_seimer_e625af: "布鲁克·赛默"
  npc_override_aldebaran_aldebaran_butterfly_wings_8ef527: "4个蝴蝶翅膀~"
  npc_override_aldebaran_aldebaran_came_out_let_s_see_e47721: "出来了！让我们看看"
  npc_override_aldebaran_aldebaran_cancel_77dfd2: "取消"
  npc_override_aldebaran_aldebaran_candidate_number_curly_s_d87ef7: "六号候选人：^AAAA00卡莉·苏^000000！！"
  npc_override_aldebaran_aldebaran_cap_hmmm_474d68: "一顶……帽子？嗯，"
  npc_override_aldebaran_aldebaran_check_its_nose_if_clean_87377e: "先检查它的鼻子是否干净湿润。"
  npc_override_aldebaran_aldebaran_chika_chika_chika_de56dd: "^3355FF咔哒咔哒咔哒"
  npc_override_aldebaran_aldebaran_choose_category_test_you_e53007: "选择一个类别来试试运气吧。"
  npc_override_aldebaran_aldebaran_choose_your_favorite_kaf_bb762f: "选择你最喜欢的卡普拉小姐！"
  npc_override_aldebaran_aldebaran_city_forests_38abf7: "森林之城。"
  npc_override_aldebaran_aldebaran_clock_tower_5e73ab: "这座钟楼"
  npc_override_aldebaran_aldebaran_collect_more_more_81e5ce: "积累越来越多的"
  npc_override_aldebaran_aldebaran_collect_more_more_specia_0cd59a: "多攒~多攒~特别积分~"
  npc_override_aldebaran_aldebaran_comes_into_your_possessi_b26b7b: "到了你手中，"
  npc_override_aldebaran_aldebaran_complicated_0a5277: "并不复杂，对吧？"
  npc_override_aldebaran_aldebaran_congratulations_28d864: "恭喜~~"
  npc_override_aldebaran_aldebaran_congratulations_you_got_d541e4: "恭喜~~你中了一等奖~"
  npc_override_aldebaran_aldebaran_consists_mysterious_anci_cec0e1: "都由神秘的古代魔法构成。"
  npc_override_aldebaran_aldebaran_currently_we_kafra_cente_d44894: "目前，卡普拉中心正在为顾客举办特别活动。"
  npc_override_aldebaran_aldebaran_defense_i_m_so_435b78: "相当不错，但我"
  npc_override_aldebaran_aldebaran_dex_especially_important_8b8ac6: "如果你想击中长有翅膀的魔物，灵巧尤其重要。那些魔物移动迅速，攻击也很快。"
  npc_override_aldebaran_aldebaran_disappeared_e27188: "并消失。"
  npc_override_aldebaran_aldebaran_don_t_belittle_livings_m_22201f: "不要小看米约尔尼尔山的生物。"
  npc_override_aldebaran_aldebaran_don_t_forget_check_soldi_575cef: "别忘了检查佣兵的脚踝。"
  npc_override_aldebaran_aldebaran_don_t_grant_you_819ebc: "不赐予你许可。"
  npc_override_aldebaran_aldebaran_don_t_so_ridiculous_383d04: "别这么荒唐！"
  npc_override_aldebaran_aldebaran_don_t_too_disappointed_t_e2c39f: "别因为只有一个人欢迎你而太失望嘛！"
  npc_override_aldebaran_aldebaran_drinking_your_friends_6e35e8: "和朋友一起喝酒时是很棒的小菜~"
  npc_override_aldebaran_aldebaran_drrrrrr_drrrrrr_d4d026: "'咕噜咕噜~ 咕噜咕噜~'"
  npc_override_aldebaran_aldebaran_drrrrrrrrrrrrrrrrrr_1d05be: "^3355FF咕噜咕噜咕噜……"
  npc_override_aldebaran_aldebaran_due_change_customer_supp_444fc9: "由于客户支持政策变更，我们不再接受卡普拉通行证。不过，对于仍持有通行证的顾客，我们提供退款服务。"
  npc_override_aldebaran_aldebaran_durability_comes_our_45e78a: "和耐用性都获得了我们"
  npc_override_aldebaran_aldebaran_each_upgrade_level_attac_b1ab45: "每升一级，等级1的武器攻击力增加2。等级2的武器则增加3。"
  npc_override_aldebaran_aldebaran_enough_special_reserve_2124e4: "特别积分"
  npc_override_aldebaran_aldebaran_enough_these_31e480: "有了足够的蓝色药水，"
  npc_override_aldebaran_aldebaran_enter_gate_dbe2ea: "进入这扇门……"
  npc_override_aldebaran_aldebaran_equipment_dropped_monste_70e652: "魔物掉落的装备不能立刻装备。"
  npc_override_aldebaran_aldebaran_even_better_rewards_a32c60: "以兑换更好的奖品。"
  npc_override_aldebaran_aldebaran_even_strong_swordman_ins_7eaae6: "即使对强壮的剑士来说，米约尔尼尔山的昆虫也是不小的威胁。开战之前必须先了解敌人！"
  npc_override_aldebaran_aldebaran_even_though_people_fasci_ee24d3: "虽然人们着迷于米约尔尼尔山的美景，但那里到处都是危险的魔物！"
  npc_override_aldebaran_aldebaran_even_though_there_interc_fbcd9e: "虽然钟楼里到处都有相互连接的传送点，但要小心'随机传送'。"
  npc_override_aldebaran_aldebaran_even_without_blacksmith_1eef63: "即使队伍里没有铁匠、炼金术士或商人，你也能鉴定装备！当然，每次使用都会消耗一个放大镜……"
  npc_override_aldebaran_aldebaran_every_feature_clocktower_8e96cd: "这座钟楼的每一个特征"
  npc_override_aldebaran_aldebaran_every_floor_tower_connec_30a222: "这座塔的每一层都通过一种我们称为'传送齿轮'的装置相互连接。"
  npc_override_aldebaran_aldebaran_evil_creatures_human_ene_0c4965: "免受邪恶生物和人类敌人的侵害。"
  npc_override_aldebaran_aldebaran_example_shield_slot_when_878afe: "例如，一个拥有1个插槽的盾牌，鼠标移上去时会显示'Shield [1]'。"
  npc_override_aldebaran_aldebaran_exchange_5dfc87: "兑换。"
  npc_override_aldebaran_aldebaran_exchange_them_5a3200: "兑换什么呢？"
  npc_override_aldebaran_aldebaran_excuse_me_c35a71: "不好意思……？"
  npc_override_aldebaran_aldebaran_f_fourth_prize_9e17b3: "四、四等奖……？！"
  npc_override_aldebaran_aldebaran_favorite_kafra_girl_40edba: "卡普拉女孩是谁？"
  npc_override_aldebaran_aldebaran_fighter_751523: "不是战士。"
  npc_override_aldebaran_aldebaran_first_prize_c1602e: "一等奖！"
  npc_override_aldebaran_aldebaran_five_thousand_eight_hund_15ef88: "五千八百年？！太疯狂了！"
  npc_override_aldebaran_aldebaran_flaaaaaavaaaaah_aa5d4c: "哗啦啦啦~^000000"
  npc_override_aldebaran_aldebaran_g_u_e_s_s_503cc8: "猜~ 猜~ 是~ 什~ 么~"
  npc_override_aldebaran_aldebaran_gate_his_own_accdf7: "这道门，凭自己的意志！"
  npc_override_aldebaran_aldebaran_gatekeeper_creatures_9cf226: "被守门生物所伤。"
  npc_override_aldebaran_aldebaran_general_if_you_want_hit_646e03: "一般来说，如果你想击中和你一样快，甚至更快的魔物，就需要一些灵巧。"
  npc_override_aldebaran_aldebaran_get_out_now_1e2d82: "现在出去！"
  npc_override_aldebaran_aldebaran_go_through_door_34b6e8: "要通过这扇门"
  npc_override_aldebaran_aldebaran_going_work_because_card_4b2bdd: "是不行的，因为这张卡片只能插入到"
  npc_override_aldebaran_aldebaran_good_day_5d2195: "祝你有个美好的一天。"
  npc_override_aldebaran_aldebaran_good_luck_finding_phraco_afdb61: "祝你好运，找到强化金属！"
  npc_override_aldebaran_aldebaran_good_mercenary_soldier_m_7d2a30: "好佣兵的鼻子一定是湿润的，"
  npc_override_aldebaran_aldebaran_good_yaaaaaay_now_you_cac624: "不错的！耶~现在你可以"
  npc_override_aldebaran_aldebaran_gosh_abfcaa: "天哪！"
  npc_override_aldebaran_aldebaran_greatest_among_potions_u_c730f5: "药水中的极品！在晕倒前使用吧~"
  npc_override_aldebaran_aldebaran_hahahaha_chill_out_i_jus_8b2bc0: "哈哈哈……放轻松，我只是开玩笑。"
  npc_override_aldebaran_aldebaran_hat_oh_well_3ec71f: "有多时尚。唉，算了……"
  npc_override_aldebaran_aldebaran_he_became_so_popular_his_1d49c1: "他因为精彩的比赛表现而大受欢迎，"
  npc_override_aldebaran_aldebaran_he_c04d0c: "他……"
  npc_override_aldebaran_aldebaran_he_great_man_he_argh_7101c3: "他是个伟大的人。他……啊！我想不起来了！"
  npc_override_aldebaran_aldebaran_he_keeps_talking_himself_ef3f12: "他老是自言自语大声嚷嚷，吵得我头疼……"
  npc_override_aldebaran_aldebaran_he_still_bed_61110e: "他现在还卧病在床。"
  npc_override_aldebaran_aldebaran_headquarters_9511f1: "的访问愉快。"
  npc_override_aldebaran_aldebaran_hearsay_when_used_once_df5827: "据说使用一次后，"
  npc_override_aldebaran_aldebaran_hello_hello_c7f047: "你好，你好！！"
  npc_override_aldebaran_aldebaran_here_kafra_corporation_w_fa6194: "在卡普拉公司，我们都在尽最大努力为您提供您所期望的优质服务。"
  npc_override_aldebaran_aldebaran_here_you_exchange_358e19: "在这里，你可以把使用卡普拉服务"
  npc_override_aldebaran_aldebaran_hey_44afd2: "喂……"
  npc_override_aldebaran_aldebaran_hey_there_9fc049: "你好啊！"
  npc_override_aldebaran_aldebaran_hey_you_don_t_come_f16ea0: "嘿，不得到允许就闯进别人家，可不太好吧。"
  npc_override_aldebaran_aldebaran_highest_recommendation_w_3e4bed: "最高的推荐。我们"
  npc_override_aldebaran_aldebaran_hint_sarcasm_your_voice_305611: "你刚才说那话的时候，是不是有点讽刺的意味？"
  npc_override_aldebaran_aldebaran_his_amazingly_fast_legs_4188d2: "因为他跑得惊人的快……"
  npc_override_aldebaran_aldebaran_hm_f_fourth_prize_4466ee: "嗯？四、四等奖？"
  npc_override_aldebaran_aldebaran_hmm_9c4d28: "嗯……"
  npc_override_aldebaran_aldebaran_hmm_i_already_felt_you_a64914: "嗯！我早就感觉到你不是普通人，"
  npc_override_aldebaran_aldebaran_hmmm_2ac89c: "嗯……"
  npc_override_aldebaran_aldebaran_homeland_alchemy_aldebar_eafb55: "炼金术之国，艾尔帕兰！"
  npc_override_aldebaran_aldebaran_honey_bees_butterflies_m_2a5e64: "蜜蜂、蝴蝶和飞蛾看起来很简单，但这不代表你可以小看它们。"
  npc_override_aldebaran_aldebaran_hooray_f58bd8: "太好了！"
  npc_override_aldebaran_aldebaran_hope_you_enjoy_your_new_d15097: "希望你喜欢你的新鞋~"
  npc_override_aldebaran_aldebaran_how_dare_you_come_inside_89d4ef: "你怎么敢闯进我家，还一副理所当然地跟我说话？"
  npc_override_aldebaran_aldebaran_how_many_times_a3f585: "你想转动"
  npc_override_aldebaran_aldebaran_however_canals_over_here_3c3da2: "不过这里的运河只是观赏用的。如果需要运输什么，我们直接使用卡普拉公司的传送服务！"
  npc_override_aldebaran_aldebaran_however_equip_tab_each_e_43f7a0: "不过，在装备标签页中，每一件装备都占用一个插槽。我想这是因为每件装备都可以通过锻造或卡片进行独特升级。"
  npc_override_aldebaran_aldebaran_however_i_hope_you_afrai_34041a: "不过，希望你不要害怕我。我和你一样有人性。"
  npc_override_aldebaran_aldebaran_however_overdose_good_yo_fd810a: "不过，过量对身体不好哦~"
  npc_override_aldebaran_aldebaran_however_there_nothing_la_98797f: "然而，没有什么能永恒……"
  npc_override_aldebaran_aldebaran_however_time_they_ve_alr_7e1b79: "然而到了这时候，他们已经把仅有的一点Zeny花在了开启仓库上。但他们没有足够的钱再次打开仓库了！"
  npc_override_aldebaran_aldebaran_huge_mountains_surroundi_2395a9: "环绕这座城镇的巍峨群山"
  npc_override_aldebaran_aldebaran_i_also_hear_they_create_4a79f6: "我还听说他们会制作各种药水，甚至能召唤某些魔物！看来他们的研究有各种巧妙的应用。"
  npc_override_aldebaran_aldebaran_i_am_my_brother_s_df8abc: "我是哥哥唯一的希望，也是艾尔帕兰的未来！"
  npc_override_aldebaran_aldebaran_i_am_only_child_my_f38743: "我是家里唯一的孩子，所以一直把我的小鸡当成弟弟！"
  npc_override_aldebaran_aldebaran_i_apologize_inconvenienc_1d4ed6: "给您带来不便，十分抱歉~"
  npc_override_aldebaran_aldebaran_i_assume_you_feel_someth_366ed2: "我想你会感受到某种异样"
  npc_override_aldebaran_aldebaran_i_been_charged_committee_7421b8: "我受'人间天堂'委员会的委托，看守这座钟楼入口。"
  npc_override_aldebaran_aldebaran_i_came_all_way_here_3e3876: "我从普隆德拉大老远跑到这里，因为听说卡普拉总公司就在艾尔帕兰某处。"
  npc_override_aldebaran_aldebaran_i_don_t_think_you_c64b35: "我想你拿不下收到的物品了~"
  npc_override_aldebaran_aldebaran_i_enjoy_gathering_shells_fd805d: "我喜欢在海边拾蛤蜊。这真的很有趣，让人很放松~"
  npc_override_aldebaran_aldebaran_i_give_you_chance_7db4d4: "我会给你一个机会。"
  npc_override_aldebaran_aldebaran_i_guess_you_assume_item_f33287: "我想你可以认为，同样装备中插槽越多越有价值。"
  npc_override_aldebaran_aldebaran_i_guess_you_spent_entire_4f56dd: "看来你把所有运气都花在这次抽奖上了~"
  npc_override_aldebaran_aldebaran_i_his_manager_time_i_77e57a: "当时我担任他的经纪人，被他的粉丝们搞得压力很大。"
  npc_override_aldebaran_aldebaran_i_hope_you_enjoy_797af2: "希望您"
  npc_override_aldebaran_aldebaran_i_ll_also_guess_you_fc395b: "我猜你也会更喜欢原版电影而不是续集，并且讨厌拙劣模仿。我说对了吗？"
  npc_override_aldebaran_aldebaran_i_m_curly_sue_7e4869: "我是卡莉·苏，"
  npc_override_aldebaran_aldebaran_i_m_here_answer_any_69c1e2: "我在这里为您解答卡普拉公司政策的任何问题，并记录您的任何反馈。"
  npc_override_aldebaran_aldebaran_i_m_kid_85d303: "我不是小孩！"
  npc_override_aldebaran_aldebaran_i_m_lover_447aca: "我是个爱人的人，"
  npc_override_aldebaran_aldebaran_i_m_sorry_15db3c: "很抱歉，"
  npc_override_aldebaran_aldebaran_i_m_sorry_62deac: "抱歉~但是~"
  npc_override_aldebaran_aldebaran_i_m_sorry_dear_5fc5ec: "抱歉~亲爱的~"
  npc_override_aldebaran_aldebaran_i_m_sorry_you_don_d3080e: "很抱歉，你的"
  npc_override_aldebaran_aldebaran_i_m_sorry_you_don_fd7324: "很抱歉，你没有卡普拉通行证。"
  npc_override_aldebaran_aldebaran_i_m_tourist_9f333e: "我是游客"
  npc_override_aldebaran_aldebaran_i_m_trying_my_best_01029b: "我已经尽量表现得文静又有女人味了，所以别逼我打断你的指关节！听到了吗？！"
  npc_override_aldebaran_aldebaran_i_may_machine_heart_i_598439: "我可能有一颗机械心脏，心脏发出的噪音可能会打扰到你，"
  npc_override_aldebaran_aldebaran_i_may_sound_inhuman_rath_6e51c5: "我的声音听起来也许不太像人，反而像机器人"
  npc_override_aldebaran_aldebaran_i_may_still_need_learn_e5f29d: "关于服务顾客我还有很多要学习，但我一直在努力！"
  npc_override_aldebaran_aldebaran_i_mean_instead_enjoying_cdd46e: "我是说，与其享受浪漫晚餐，她更喜欢念叨魔物掉落的装备比商店卖的品质更好……"
  npc_override_aldebaran_aldebaran_i_mean_why_should_i_95bda0: "我是说，魔物掉落的装备插槽更多，这跟我有什么关系？！我连波利都打不死！"
  npc_override_aldebaran_aldebaran_i_member_kafra_garrison_1930d7: "加入卡普拉服务团队之前，我是卡普拉守备队的成员。我的专长是^990000怒爆^000000，所以如果你识相的话，别惹我。"
  npc_override_aldebaran_aldebaran_i_so_surprised_so_me_511b9f: "我太惊讶了，所以和努克努克赶紧逃跑。我朝它丢石头，但好像没伤到它。它一定很强！"
  npc_override_aldebaran_aldebaran_i_swear_he_jumping_aroun_1d11c8: "我发誓！它在米约尔尼尔山附近和一些普通波利一起跳来跳去。我觉得它好像是它们的老大。"
  npc_override_aldebaran_aldebaran_i_t_believe_such_powerfu_80e567: "真不敢相信"
  npc_override_aldebaran_aldebaran_i_t_d3b5dc: "我"
  npc_override_aldebaran_aldebaran_i_tell_you_how_you_2a8120: "我来告诉你怎么找到一个好佣兵。"
  npc_override_aldebaran_aldebaran_i_used_call_amazing_pick_0819a9: "我以前叫它'神奇 picky'……"
  npc_override_aldebaran_aldebaran_i_walking_up_narrow_path_be9560: "我走在一条狭窄的小路上，突然一株巨大又丑陋的植物开始攻击我和努克努克！"
  npc_override_aldebaran_aldebaran_i_want_my_chicken_back_22e314: "我要我的小鸡回来……*啜泣*"
  npc_override_aldebaran_aldebaran_i_want_travel_around_wor_87b274: "总有一天我想环游世界。"
  npc_override_aldebaran_aldebaran_i_worked_so_hard_delight_ae792a: "我可是很用心做了这个有趣的调查！来吧，赏个脸！欣赏漂亮女人就像欣赏艺术品一样。"
  npc_override_aldebaran_aldebaran_i_you_enjoy_your_stay_f121d1: "我相信你会喜欢在艾尔帕兰的停留。"
  npc_override_aldebaran_aldebaran_if_he_long_hair_s_fd0a30: "如果它毛发长就更好了！要是烫过卷毛，那就完美了！"
  npc_override_aldebaran_aldebaran_if_i_see_ocean_port_fc0b84: "如果能在艾尔贝塔港口眺望大海，一定很美妙。"
  npc_override_aldebaran_aldebaran_if_kafra_employee_rented_bfdb62: "如果有卡普拉员工把手推车租给超级初心者，她可能会被蕾拉狠狠责骂……"
