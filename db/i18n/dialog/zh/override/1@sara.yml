Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@sara_SaraMemory_after_being_given_flower_ec58de: "收到鲜花后，元老的心情似乎大大好转了。"
  npc_override_1@sara_SaraMemory_ahh_sara_i_just_looking_cfa0af: "啊，萨拉！我正好在找你……"
  npc_override_1@sara_SaraMemory_alright_my_princess_wher_32ed2b: "好的，我的公主，我们现在该去哪里呢？"
  npc_override_1@sara_SaraMemory_as_they_wander_off_you_4b7f46: "当他们走远时，你听到拐角处传来奇怪的声音……"
  npc_override_1@sara_SaraMemory_as_you_about_call_out_5a2488: "就在你要喊萨拉的时候，突然有人从背后把你击倒了。"
  npc_override_1@sara_SaraMemory_as_you_explore_you_start_fb2f3d: "当你探索这里时，你开始看到时空裂缝。每一条都被一个维度装置覆盖着。"
  npc_override_1@sara_SaraMemory_as_you_fall_ground_two_c9f1dd: "当你倒在地上时，两个黑影向萨拉靠近。"
  npc_override_1@sara_SaraMemory_before_you_enter_you_nee_0b9622: "进入之前你需要组建队伍！你不知道怎么做吗？输入 /organize 队伍名称。"
  npc_override_1@sara_SaraMemory_before_you_go_playing_ar_f5bd74: "在去玩那个之前，为什么不过来和我聊聊呢？"
  npc_override_1@sara_SaraMemory_course_silly_daddy_b6515f: "当然啦，笨爸爸！"
  npc_override_1@sara_SaraMemory_daddy_40b1d5: "爸爸！"
  npc_override_1@sara_SaraMemory_daddy_why_2486c5: "爸爸，为什么？！"
  npc_override_1@sara_SaraMemory_dimensional_device_boots_9f9845: "^FF0000维度装置顺利启动。使用该装置进入时空裂缝。^000000"
  npc_override_1@sara_SaraMemory_don_t_say_sweetheart_who_ead657: "别这么说，亲爱的……这位是谁？"
  npc_override_1@sara_SaraMemory_door_opens_reveal_woman_e926a0: "门开了，露出一个濒死的女人躺在地上，而元老手持染血的长剑站在她身旁。"
  npc_override_1@sara_SaraMemory_doyen_irene_draws_blade_bf51be: "元老艾琳拔出了这把剑！"
  npc_override_1@sara_SaraMemory_doyen_irene_fallen_608d4c: "元老艾琳倒下了。"
  npc_override_1@sara_SaraMemory_doyen_irene_stares_you_f_7ec6b2: "元老艾琳用充满怒火的眼神盯着你。"
  npc_override_1@sara_SaraMemory_doyen_turns_around_notic_27e3ec: "元老转过身来，注意到了萨拉。"
  npc_override_1@sara_SaraMemory_escape_sara_78a45c: "带着萨拉逃走。"
  npc_override_1@sara_SaraMemory_example_i_think_i_caught_c239df: "例如，我觉得我透过离我们最近的那个裂缝瞥见了斐扬。但感觉不太对劲。好像比它应有的样子更古老一些。"
  npc_override_1@sara_SaraMemory_excuse_my_rudeness_i_am_3e3069: "请原谅我的无礼！我是著名的冒险者庞·德莱昂！"
  npc_override_1@sara_SaraMemory_gem_rolls_woman_s_hand_1df194: "一颗宝石从女人手中滚落，停在萨拉面前。萨拉无意识地伸手捡起了宝石。"
  npc_override_1@sara_SaraMemory_girl_full_betrayal_despa_82c01f: "一个充满背叛、绝望和仇恨的女孩。我们将引导你走向你的终极命运。"
  npc_override_1@sara_SaraMemory_guards_guards_there_murd_4aedf4: "卫兵！卫兵！！这里有杀人犯！抓住他！"
  npc_override_1@sara_SaraMemory_guards_must_defeated_gai_e07a45: "必须击败卫兵才能进入下一个区域。"
  npc_override_1@sara_SaraMemory_hah_ok_hold_onto_me_781dcf: "哈！好的，抓紧我！"
  npc_override_1@sara_SaraMemory_hello_village_payon_you_badc6e: "你好！这里是斐扬村。你看起来不像本地人……"
  npc_override_1@sara_SaraMemory_here_you_go_daddy_7d20f2: "给你，爸爸！"
  npc_override_1@sara_SaraMemory_hey_you_too_young_playin_a52f9a: "嘿！你还太小，不能玩那个！等你至少达到^0000FF等级 99^000000再回来！"
  npc_override_1@sara_SaraMemory_hi_daddy_e56ebc: "嗨，爸爸！"
  npc_override_1@sara_SaraMemory_hrumph_sara_irene_she_s_dc70b5: "哼，萨拉·艾琳？！她是十二女武神之一。我不知道她的故事如此悲惨……"
  npc_override_1@sara_SaraMemory_i_am_getting_too_old_fae682: "我老了，不适合干这——"
  npc_override_1@sara_SaraMemory_i_am_glad_hear_maybe_349bdc: "很高兴听到你这么说！也许有一天你能像老狮子莱昂一样勇敢！"
  npc_override_1@sara_SaraMemory_i_am_here_give_flowers_adbf3e: "我是来给 mommy 送花的！"
  npc_override_1@sara_SaraMemory_i_am_just_adventurer_who_afe8a6: "我只是一个路过的冒险者。我听到一些奇怪的人在密谋杀人，所以必须介入。"
  npc_override_1@sara_SaraMemory_i_am_sure_you_fully_663446: "我不确定你是否已经完全探索了时空裂缝。也许你该再往深处看看。"
  npc_override_1@sara_SaraMemory_i_am_waiting_my_father_06e546: "我在等我的爸爸。他说很快就会到这里。"
  npc_override_1@sara_SaraMemory_i_been_looking_you_sara_d5766f: "我一直在找你，萨拉。请跟爸爸走，这里非常危险！"
  npc_override_1@sara_SaraMemory_i_feel_sara_s_power_566bc9: "我能感觉到萨拉的力量在增长。我们不能只是袖手旁观，让她发挥全部潜力！"
  npc_override_1@sara_SaraMemory_i_hate_those_old_fogeys_482d35: "我讨厌那些老顽固。"
  npc_override_1@sara_SaraMemory_i_revenge_sara_s_mom_9ed0b0: "我要为萨拉的 mommy 报仇！！"
  npc_override_1@sara_SaraMemory_i_think_about_hours_afte_4b390b: "我认为在你上次进入裂缝大约 20 小时后，它会再次稳定到足以让你穿越。"
  npc_override_1@sara_SaraMemory_i_want_explore_my_old_ac29ad: "我想探索它，但鉴于我的年纪和膝盖，我似乎不太胜任这个任务。"
  npc_override_1@sara_SaraMemory_i_won_t_let_you_2dc97e: "我不会让你带走萨拉的！"
  npc_override_1@sara_SaraMemory_if_you_assassin_sent_kil_103e32: "如果……你不是被派来杀我妻子和女儿的刺客，你是谁？"
  npc_override_1@sara_SaraMemory_if_you_telling_truth_for_bc8997: "如果……你说的是真的……请原谅我。我以为你是他们中的一员。"
  npc_override_1@sara_SaraMemory_memorial_dungeon_exist_b126a8: "纪念地下城 {0} 不存在。"
  npc_override_1@sara_SaraMemory_menu_okay_a81b9e: "好的:放弃"
  npc_override_1@sara_SaraMemory_menu_party_2e5e7f: "队伍名称: {0}"
  npc_override_1@sara_SaraMemory_menu_party_8c7899: "队伍队长: {0}"
  npc_override_1@sara_SaraMemory_menu_yes_141459: "是:否"
  npc_override_1@sara_SaraMemory_mom_dad_look_what_i_8c5197: "Mom！Dad！看我找到了什么！"
  npc_override_1@sara_SaraMemory_mommy_11cfd2: "……Mommy"
  npc_override_1@sara_SaraMemory_mommy_5b9cf0: "Mommy！"
  npc_override_1@sara_SaraMemory_mommy_ac1692: "不是 Mommy！"
  npc_override_1@sara_SaraMemory_mommy_no_f5c93f: "Mommy 不要！！！！！！！！"
  npc_override_1@sara_SaraMemory_msg_5a2bae: "……"
  npc_override_1@sara_SaraMemory_msg_61ce5a: "[{0}]"
  npc_override_1@sara_SaraMemory_msg_6eae3a: "……"
  npc_override_1@sara_SaraMemory_murderer_here_guards_we_d99629: "杀人犯在这里！卫兵！我们要一劳永逸地解决他！"
  npc_override_1@sara_SaraMemory_my_father_doyen_village_c80007: "我的爸爸是这个村子的元老！我只是随了妈妈。"
  npc_override_1@sara_SaraMemory_my_friends_call_me_leon_0debb2: "我的朋友们叫我狮子莱昂！因为我粗犷的外表和态度。而且我咬人也很厉害！"
  npc_override_1@sara_SaraMemory_no_1d59ae: "不！"
  npc_override_1@sara_SaraMemory_nooooo_1b8e0d: "不……"
  npc_override_1@sara_SaraMemory_oh_daddy_lets_go_top_112a6a: "哦，爸爸！我们去那座小山顶上吧！"
  npc_override_1@sara_SaraMemory_oh_hello_again_i_remembe_b6eb92: "哦！又见面了！我记得你，有什么事吗？"
  npc_override_1@sara_SaraMemory_oh_i_am_sorry_uh_1f8117: "哦！对不起！呃……你为什么一个人站在这里？"
  npc_override_1@sara_SaraMemory_oh_sara_may_i_them_c70150: "哦，萨拉，我可以看看吗？"
  npc_override_1@sara_SaraMemory_okay_302ca1: "……好的。"
  npc_override_1@sara_SaraMemory_old_men_wander_off_seems_1c52cf: "老人们走远了。萨拉似乎有危险。我们必须做点什么！"
  npc_override_1@sara_SaraMemory_older_man_exits_house_sa_f25467: "一位老人从房子里走出来。萨拉一看到他，脸上就绽放出笑容。"
  npc_override_1@sara_SaraMemory_one_cloaked_strangers_co_29ea86: "其中一个披着斗篷的陌生人用斗篷盖住萨拉，然后三个人影一起消失了。"
  npc_override_1@sara_SaraMemory_only_registered_members_5e6e47: "只有已注册成员才能进入实例 {0}。"
  npc_override_1@sara_SaraMemory_party_leader_did_boot_up_103392: "^FF0000队伍队长没有启动维度装置。^000000"
  npc_override_1@sara_SaraMemory_party_leader_did_generat_5a6394: "队伍队长尚未生成地下城。"
  npc_override_1@sara_SaraMemory_payon_4b6889: "为了斐扬！！"
  npc_override_1@sara_SaraMemory_please_don_t_tell_anyone_397f2f: "请不要告诉任何人关于你的时间旅行冒险。我们不能让任何人觉得你比老莱昂更重要。而且他们也不会相信这种故事的。"
  npc_override_1@sara_SaraMemory_please_venture_through_d_98ca7d: "请穿越维度装置，然后向我报告你在里面发现了什么。"
  npc_override_1@sara_SaraMemory_reservation_failed_b861ab: "^0000ff{0} ^000000- 预约失败！"
  npc_override_1@sara_SaraMemory_sara_bc09a2: "萨拉……"
  npc_override_1@sara_SaraMemory_sara_believes_you_killed_8b1aff: "萨拉认为是你杀了她的 mommy。我们必须告诉她真相！"
  npc_override_1@sara_SaraMemory_sara_continues_run_away_3cc3b5: "萨拉继续逃跑！你觉得她往 12 点钟方向去了！"
  npc_override_1@sara_SaraMemory_sara_irene_he_make_your_42702e: "萨拉·艾琳，「他」会让你的梦想成真。"
  npc_override_1@sara_SaraMemory_sara_leaps_forward_open_6e202d: "萨拉冲上前去开门，手里紧握着鲜花。"
  npc_override_1@sara_SaraMemory_sara_ran_away_again_you_256918: "萨拉又逃跑了！你觉得她往 2 点钟方向去了！"
  npc_override_1@sara_SaraMemory_sara_ran_away_yet_again_808641: "萨拉又逃跑了！*叹气* 你觉得她往 12 点钟方向去了！"
  npc_override_1@sara_SaraMemory_sara_ran_away_yet_again_adbb84: "萨拉又逃跑了！你觉得她往 5 点钟方向去了！"
  npc_override_1@sara_SaraMemory_sara_ru_away_c3a185: "萨拉……跑……逃走……"
  npc_override_1@sara_SaraMemory_sara_run_save_yourself_5ac57d: "萨拉……快跑！救你自己！"
  npc_override_1@sara_SaraMemory_sara_runs_away_sound_gua_055ca5: "萨拉跑掉了，卫兵的声音越来越近……"
  npc_override_1@sara_SaraMemory_sara_s_memories_cooldown_6d5b08: "^0000FF[ 萨拉的回忆 ] 冷却时间已清除。现在可以再次使用维度装置了。^000000"
  npc_override_1@sara_SaraMemory_sara_starts_humming_sing_c0056c: "萨拉开始轻声哼唱。她在附近摘了一些野花，然后献给元老。"
  npc_override_1@sara_SaraMemory_seems_you_caused_huge_mi_e1bf4e: "看来你在她和她的父亲之间造成了巨大的误会。"
  npc_override_1@sara_SaraMemory_several_groups_guards_fo_533c43: "几组卫兵已经集结起来与你战斗！"
  npc_override_1@sara_SaraMemory_she_born_under_bad_sign_23c049: "她生来就带着不祥的征兆，而且她妈妈甚至不是我们这里的人！"
  npc_override_1@sara_SaraMemory_she_cough_had_already_be_29aeec: "她*咳嗽*已经被刺客刺伤了。我杀了他*咳*这就是为什么我的剑上沾满了血……"
  npc_override_1@sara_SaraMemory_so_i_like_ask_something_775b2b: "所以，我想请你帮个忙。"
  npc_override_1@sara_SaraMemory_someday_she_cause_blood_9e29d9: "总有一天她会让我们的街道上血流成河。"
  npc_override_1@sara_SaraMemory_sound_many_pairs_boots_h_334003: "外面传来许多靴子奔跑的声音！"
  npc_override_1@sara_SaraMemory_strange_men_i_bet_they_b5a2e0: "奇怪的人？……我敢打赌他们是村子里的一些长老。呃……"
  npc_override_1@sara_SaraMemory_sweetheart_i_am_sorry_i_e23ce3: "亲爱的，对不起，让你等了这么久。与村子长老的会议比预期的要长。"
  npc_override_1@sara_SaraMemory_sweetheart_you_look_so_h_a38ae8: "亲爱的，你看起来好开心。"
  npc_override_1@sara_SaraMemory_there_might_more_assassi_f2284d: "可能还有更多的刺客，所以我们必须尽快找到萨拉！"
  npc_override_1@sara_SaraMemory_thinking_back_you_seem_r_9d018b: "回想起来，你似乎记得房间的左角还有另一具尸体。也许那就是元老所说的刺客。"
  npc_override_1@sara_SaraMemory_though_i_should_warn_you_05c03d: "不过我应该警告你。它可能不稳定。确保你尽快进入。"
  npc_override_1@sara_SaraMemory_though_i_should_warn_you_1ba83e: "不过；我应该警告你。它可能不稳定。确保你尽快进入。"
  npc_override_1@sara_SaraMemory_time_travellers_cannot_i_a23185: "时间旅行者不能再干预了。你无法阻止我们与萨拉见面。"
  npc_override_1@sara_SaraMemory_unknown_error_occurred_58bda4: "发生了未知错误。"
  npc_override_1@sara_SaraMemory_we_must_find_sara_you_823b92: "我们必须找到萨拉。你似乎记得她往 8 点钟方向跑了。"
  npc_override_1@sara_SaraMemory_we_must_our_best_find_4b7ffe: "我们必须尽最大努力找到她。我们分头搜索吧。请帮我找到我的女儿，并向她解释一切。"
  npc_override_1@sara_SaraMemory_we_see_i_look_forward_06c80c: "我们拭目以待……我期待听到她遭遇不幸的消息……"
  npc_override_1@sara_SaraMemory_we_something_before_holy_294805: "我们必须在神圣生物选中她之前做些什么。我请求「他」来处理这件事。"
  npc_override_1@sara_SaraMemory_well_i_t_force_you_e6a89c: "好吧……我不能强迫你。但如果你有一天找到了勇气，请再来和我谈谈。"
  npc_override_1@sara_SaraMemory_what_did_you_see_there_b51588: "你在里面看到了什么？！"
  npc_override_1@sara_SaraMemory_what_you_talking_about_w_b134c2: "你在说什么？我们看到你站在萨拉的 mommy 旁边，你的剑上沾满了血！"
  npc_override_1@sara_SaraMemory_where_am_i_006e21: "我在哪里？"
  npc_override_1@sara_SaraMemory_why_daddy_d23422: "为什么，爸爸？"
  npc_override_1@sara_SaraMemory_why_hack_you_trying_kill_794d24: "为什么……*咳*你要杀我的妻子和女儿？"
  npc_override_1@sara_SaraMemory_why_hurt_so_much_4c2666: "为什么这么痛？"
  npc_override_1@sara_SaraMemory_why_why_bbea2a: "为什么……为什么？"
  npc_override_1@sara_SaraMemory_yes_i_born_here_my_6c8003: "是的！我出生在这里！我叫萨拉，萨拉·艾琳！"
  npc_override_1@sara_SaraMemory_you_here_you_don_t_e8f2eb: "你是这里的人吗？你看起来也不太像本地人。"
  npc_override_1@sara_SaraMemory_you_know_place_doesn_t_33f9d1: "你知道……这个地方对你来说似乎不太安全。等你达到^0000FF等级 99^000000或更高后再回来找我。"
  npc_override_1@sara_SaraMemory_you_know_such_strange_lo_fb2352: "你知道吗，这个地方真是奇怪……"
  npc_override_1@sara_SaraMemory_you_said_you_come_back_5ef62b: "你说你会很快回来的！我等了你好久，你骗了我！"
  npc_override_1@sara_SaraMemory_you_should_blame_yoursel_9d891e: "你不应该为发生的事情责备自己，也不应该为所有流过的血自责。那天的事件似乎是命中注定的，无论谁在场都会发生。"
  npc_override_1@sara_SaraMemory_you_should_go_back_time_eda888: "你应该回到属于你的时间。"
  npc_override_1@sara_SaraMemory_you_think_i_killed_sara_44efe8: "你……认为是我杀了萨拉的 mommy？"
  npc_override_1@sara_SaraMemory_you_too_strong_me_d1c074: "你……对我来说太强大了。"
  npc_override_1@sara_SaraMemory_you_wish_relive_past_aga_ad2f8e: "你想再次重温过去吗？"
