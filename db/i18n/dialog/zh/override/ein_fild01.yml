Header:
  Type: I18N_DIALOG
  Version: 1

Body:

  npc_override_ein_fild01_quest_demonpungus_after_you_lost_some_weig_b89d61: "在你减重之后。"
  npc_override_ein_fild01_quest_demonpungus_ah_ok_i_think_you_79cab9: "啊，好吧，我想你可以帮我狩猎一些恶魔蓬格斯。"
  npc_override_ein_fild01_quest_demonpungus_amazing_you_did_speed_6cc3cd: "太厉害了，你做得很快。"
  npc_override_ein_fild01_quest_demonpungus_any_progress_you_ve_made_b3e247: "你取得的任何进展都将被抹去"
  npc_override_ein_fild01_quest_demonpungus_come_back_when_you_ve_44350c: "完成任务后回来，我会给你一个小奖励。"
  npc_override_ein_fild01_quest_demonpungus_doesn_t_look_like_you_4ba0e4: "看起来你的数量不够。"
  npc_override_ein_fild01_quest_demonpungus_hey_looks_like_weight_7817f7: "嘿，看起来"
  npc_override_ein_fild01_quest_demonpungus_hey_you_there_yeah_you_cc1ea8: "嘿，你。对，就是你！"
  npc_override_ein_fild01_quest_demonpungus_hmm_i_don_t_think_1d8eb5: "嗯，我觉得你还没狩猎到100只……"
  npc_override_ein_fild01_quest_demonpungus_hmm_i_don_t_think_2144d7: "嗯，我觉得你还没狩猎到50只……"
  npc_override_ein_fild01_quest_demonpungus_hmm_i_don_t_think_5d960b: "嗯，我觉得你还没狩猎到150只……"
  npc_override_ein_fild01_quest_demonpungus_how_many_you_like_hunt_7fc82d: "你想狩猎多少只？"
  npc_override_ein_fild01_quest_demonpungus_i_am_trying_make_my_88485e: "我正想穿过这里，但这些恶魔蓬格斯挡住了我的路。"
  npc_override_ein_fild01_quest_demonpungus_i_had_my_doubts_you_c8449c: "我原本有些怀疑，但你证明我错了。"
  npc_override_ein_fild01_quest_demonpungus_i_just_wish_i_could_263cad: "我只希望能顺利通过这里。"
  npc_override_ein_fild01_quest_demonpungus_i_need_see_you_gathered_aa4625: "我需要看到你已经收集了^FF000050个芽孢杆菌^000000，然后我才能奖励你。"
  npc_override_ein_fild01_quest_demonpungus_i_reward_you_helping_cle_1c3116: "我会奖励你帮我清理这里。"
  npc_override_ein_fild01_quest_demonpungus_if_you_change_your_mind_3f2210: "如果你改变主意，请回来。"
  npc_override_ein_fild01_quest_demonpungus_its_amazing_truly_e71eaf: "太神奇了，真的。"
  npc_override_ein_fild01_quest_demonpungus_menu_demon_8e0571: "50只恶魔蓬格斯:100只恶魔蓬格斯:150只恶魔蓬格斯"
  npc_override_ein_fild01_quest_demonpungus_menu_gather_d12376: "收集物品:狩猎恶魔蓬格斯:取消"
  npc_override_ein_fild01_quest_demonpungus_menu_i_5f55ca: "我有芽孢杆菌:你需要什么？"
  npc_override_ein_fild01_quest_demonpungus_menu_sure_859d29: "确定:不"
  npc_override_ein_fild01_quest_demonpungus_menu_yes_141459: "是:否"
  npc_override_ein_fild01_quest_demonpungus_menu_yes_755efb: "是:否:我想退出"
  npc_override_ein_fild01_quest_demonpungus_ok_then_well_come_back_0e1574: "好吧，如果你改变主意就回来这里。"
  npc_override_ein_fild01_quest_demonpungus_please_kill_demon_pungus_027b1f: "请击杀150只恶魔蓬格斯。"
  npc_override_ein_fild01_quest_demonpungus_please_kill_demon_pungus_aef318: "请击杀100只恶魔蓬格斯。"
  npc_override_ein_fild01_quest_demonpungus_please_kill_demon_pungus_f21e9f: "请击杀50只恶魔蓬格斯。"
  npc_override_ein_fild01_quest_demonpungus_remember_i_need_help_hun_37bfc8: "记住，我需要帮忙狩猎恶魔蓬格斯，去狩猎150只。"
  npc_override_ein_fild01_quest_demonpungus_remember_i_need_help_hun_6a006c: "记住，我需要帮忙狩猎恶魔蓬格斯，去狩猎50只。"
  npc_override_ein_fild01_quest_demonpungus_remember_i_need_help_hun_8c22c7: "记住，我需要帮忙狩猎恶魔蓬格斯，去狩猎100只。"
  npc_override_ein_fild01_quest_demonpungus_um_um_i_don_t_6225cd: "嗯，嗯。我不认为……"
  npc_override_ein_fild01_quest_demonpungus_yeah_sorry_i_t_talk_96edbe: "是的，抱歉我现在不能说话。"
  npc_override_ein_fild01_quest_demonpungus_you_finished_hunting_dem_b6ef68: "你完成狩猎150只恶魔蓬格斯了吗？"
  npc_override_ein_fild01_quest_demonpungus_you_finished_hunting_dem_bd908e: "你完成狩猎50只恶魔蓬格斯了吗？"
  npc_override_ein_fild01_quest_demonpungus_you_help_collecting_baci_d515e1: "你能帮忙收集^FF0000芽孢杆菌^000000吗？"
  npc_override_ein_fild01_quest_demonpungus_you_sure_you_want_stop_507e20: "你确定要停止狩猎吗？"
  npc_override_ein_fild01_quest_demonpungus_you_think_you_help_me_2c14d6: "你觉得你能帮我做点什么吗？"
  npc_override_ein_fild01_quest_demonpungus_your_back_crush_you_come_d8fffe: "你的背会压垮你。回来"
