  npc_override_prt_cas_quests_16_1_my_beautiful_shawl_burni_d68527: "我那如太阳般燃烧的美丽披肩就交给你了。"
  npc_override_prt_cas_quests_16_1_my_brother_he_must_done_9c38ff: "我的兄弟，他一定是为了什么才做的。没人知道真相，但人们似乎相信那些流言蜚语。"
  npc_override_prt_cas_quests_16_1_my_brother_indeed_must_d_f984cd: "我的兄弟确实是有原因才做这种事的。"
  npc_override_prt_cas_quests_16_1_my_brother_isaac_wigner_278497: "这是我的兄弟，^0000cd艾萨克·威格纳^000000。"
  npc_override_prt_cas_quests_16_1_my_brothers_i_didn_t_6df879: "我和我的兄弟们不知道如何弯曲，差点就要折断了。"
  npc_override_prt_cas_quests_16_1_my_colleague_who_had_bee_e14a84: "刚才还和我一起说笑的同事…… 唉……"
  npc_override_prt_cas_quests_16_1_my_cooking_perfect_666a45: "我的烹饪是完美的！"
  npc_override_prt_cas_quests_16_1_my_darling_what_you_want_c11a2a: "亲爱的，你现在想让我做什么？"
  npc_override_prt_cas_quests_16_1_my_dream_become_historia_e40ff8: "我的梦想是成为一名历史学家。我想环游米德加尔特，发现古老而隐藏的故事。"
  npc_override_prt_cas_quests_16_1_my_ears_closed_98d7bf: "我的耳朵是闭着的。"
  npc_override_prt_cas_quests_16_1_my_eyes_doing_what_they_23793a: "我想我的眼睛正在做它们应该做的事情。"
  npc_override_prt_cas_quests_16_1_my_fairly_like_dress_up_441103: "我那如仙女般的裙子就交给你了。"
  npc_override_prt_cas_quests_16_1_my_family_been_managing_af4481: "我的家族世代管理着王室往昔记忆。"
  npc_override_prt_cas_quests_16_1_my_family_live_prontera_bfb88f: "我的家人住在普隆德拉。我想知道他们是否安全撤离了。"
  npc_override_prt_cas_quests_16_1_my_fate_568b81: "我的命运！"
  npc_override_prt_cas_quests_16_1_my_father_over_there_580354: "我的父亲在那边。"
  npc_override_prt_cas_quests_16_1_my_fault_here_clothing_p_617578: "穿着这身衣服来到这里不是我的错…… 请体谅我。"
  npc_override_prt_cas_quests_16_1_my_first_time_attending_6a5414: "这是我第一次光明正大地参加正式活动。"
  npc_override_prt_cas_quests_16_1_my_friend_followed_scien_b2a04c: "我的朋友跟随了科学家道妍。我很担心。我听说她真是个怪人。"
  npc_override_prt_cas_quests_16_1_my_head_hurts_18d9de: "我的头疼。"
  npc_override_prt_cas_quests_16_1_my_horn_used_praised_hor_06cfb0: "我的角曾经被角族称赞…… 我甚至不敢想象如果他们看到我现在这丑陋的角会说什么。"
  npc_override_prt_cas_quests_16_1_my_jewelry_box_well_tech_ab3b1c: "我的珠宝盒…… 嗯，严格来说它不是珠宝盒，因为里面没有珠宝，但总之，^0000cd一个装有非常重要东西的小盒子不见了。^000000"
  npc_override_prt_cas_quests_16_1_my_mistake_darkness_insi_ca74ec: "那是我的错误。我沉睡期间，内心的黑暗变得更加强大，被黑暗唤醒的追随者改变了这片土地上的许多事情。"
  npc_override_prt_cas_quests_16_1_my_mother_makes_pretty_c_f466b6: "我的母亲会做漂亮的衣服！"
  npc_override_prt_cas_quests_16_1_my_name_crux_findel_d03f52: "我的名字是克鲁克斯·芬德尔。"
  npc_override_prt_cas_quests_16_1_my_name_kronecker_grantz_848619: "我的名字是克罗内克·格兰茨·海涅。"
  npc_override_prt_cas_quests_16_1_my_noble_brother_doesn_t_0a9552: "我的贵族兄弟不喜欢我说话的方式？"
  npc_override_prt_cas_quests_16_1_my_opinion_there_these_w_a625cb: "这不是我的观点，但人们有这样的说法。你知道的，那些流言。"
  npc_override_prt_cas_quests_16_1_my_parents_happy_as_thei_4b7aac: "我的父母在宫殿大量采购时生意兴隆，他们很高兴。我明天会让他们给我买一本书。"
  npc_override_prt_cas_quests_16_1_my_parents_love_hear_sto_2888cd: "我的父母喜欢听冒险者的故事。"
  npc_override_prt_cas_quests_16_1_my_parents_worried_they_c3685c: "我的父母很担心。他们害怕赫尔穆特会成为国王并发动战争。"
  npc_override_prt_cas_quests_16_1_my_presence_light_up_dar_20cc7f: "我的存在将照亮黑暗的宫殿，你知道的。我应该娱乐那里无聊的人们。"
  npc_override_prt_cas_quests_16_1_my_sake_jurgen_04b1d0: "这不是为了我，而是为了尤尔根。"
  npc_override_prt_cas_quests_16_1_my_sister_chased_me_away_08b8b8: "我姐姐把我赶到宴会厅，说她很忙。我也找不到我的侄子。"
  npc_override_prt_cas_quests_16_1_my_sister_s_fate_depends_de500e: "我姐姐的命运就掌握在你手中。"
  npc_override_prt_cas_quests_16_1_my_sister_very_dishearte_070cae: "我姐姐对所发生的事非常沮丧，和她的爱人一起跑了，说她不能再在这里工作了。"
  npc_override_prt_cas_quests_16_1_my_sister_wants_hang_out_65ed02: "我姐姐想安静地出去玩。"
  npc_override_prt_cas_quests_16_1_my_treat_ef855c: "我请客！"
  npc_override_prt_cas_quests_16_1_myer_61d55a: "迈尔？"
  npc_override_prt_cas_quests_16_1_myer_did_84d41e: "迈尔做了那件事？"
  npc_override_prt_cas_quests_16_1_myer_did_you_really_6ad496: "迈尔，你真的做了那件事吗？"
  npc_override_prt_cas_quests_16_1_myer_myer_25b6ab: "迈尔，迈尔……"
  npc_override_prt_cas_quests_16_1_myer_roegenburg_he_third_7753d5: "这是^0000cd迈尔·罗根堡^000000，他是罗根堡家族的第三个儿子。"
  npc_override_prt_cas_quests_16_1_myer_said_he_go_me_fefa25: "迈尔说他会和我一起去，但我担心他可能随时像风一样离开。"
  npc_override_prt_cas_quests_16_1_myer_true_did_you_spread_96a644: "迈尔，这是真的吗？是你散布了那个谣言？"
  npc_override_prt_cas_quests_16_1_myer_where_you_going_goi_3043e6: "迈尔！你要去哪里？你又要离开家族吗？"
  npc_override_prt_cas_quests_16_1_name_gives_sense_belongi_f7b715: "这个名字给人一种归属感。它也给了我们作为被认可的优秀骑士的自豪感。"
  npc_override_prt_cas_quests_16_1_near_king_there_always_s_cee23e: "在国王身边，总是有一群讨厌的苍蝇。"
  npc_override_prt_cas_quests_16_1_nerius_family_always_ope_57fb3c: "内里乌斯家族永远欢迎你，{0}，所以请常来拜访我们"
  npc_override_prt_cas_quests_16_1_nerius_family_stays_seco_0b3a0e: "内里乌斯家族住在这个房间隔壁的第二个房间。"
  npc_override_prt_cas_quests_16_1_nerius_interested_throne_c79a26: "内里乌斯对王位不感兴趣。"
  npc_override_prt_cas_quests_16_1_never_did_i_know_i_123607: "我从没想过我会落到这个地步……"
  npc_override_prt_cas_quests_16_1_never_ends_a4d470: "而且永远不会结束！"
  npc_override_prt_cas_quests_16_1_never_forget_weight_bloo_de20a7: "永远不要忘记你手上将要沾染的鲜血的重量。"
  npc_override_prt_cas_quests_16_1_never_mentioned_about_wh_0cbed0: "从未提及在哪里举行或如何举行。"
  npc_override_prt_cas_quests_16_1_never_mind_ccf45f: "……没关系。"
  npc_override_prt_cas_quests_16_1_nevertheless_don_t_talk_8dc4d8: "尽管如此，不要在孩子面前那样说。偏袒一个孩子是不好的。"
  npc_override_prt_cas_quests_16_1_nevertheless_i_still_am_e6cb72: "尽管如此，即使我保持安静，我仍然被别人误解。我想沉默终究不是最好的策略。既然我的日记回来了，我该走了。"
  npc_override_prt_cas_quests_16_1_news_your_arrival_must_r_9e53d4: "你到达的消息现在一定已经传到每个家庭了。"
  npc_override_prt_cas_quests_16_1_next_prontera_badge_i_ll_feddd4: "接下来，关于普隆德拉徽章。我会收取5个荣誉印记来强化1个插槽。最多可以强化2个插槽。重置需要10个荣誉印记。"
  npc_override_prt_cas_quests_16_1_next_training_just_as_to_e8de79: "下一次训练也会同样艰苦。你最好现在休息一下。"
  npc_override_prt_cas_quests_16_1_nice_meet_you_64753c: "很高兴见到你。"
  npc_override_prt_cas_quests_16_1_nice_meet_you_i_am_01d746: "很高兴见到你。我是^0000cd伊恩·瓦尔特^000000。"
  npc_override_prt_cas_quests_16_1_nice_meet_you_i_am_e4c363: "很高兴见到你！我是被封印在海绵擦里的清洁导师！"
  npc_override_prt_cas_quests_16_1_nice_meet_you_i_been_629ee9: "很高兴见到你。我一直在这里沉睡，等待有人和我一起清洁。"
  npc_override_prt_cas_quests_16_1_nice_see_you_again_a75c4f: "很高兴再次见到你！"
  npc_override_prt_cas_quests_16_1_nillem_must_waiting_you_b2c43e: "尼勒姆一定在等你。"
  npc_override_prt_cas_quests_16_1_nillem_pestered_me_let_h_532c3c: "那个尼勒姆缠着我要让他和你一起工作。"
  npc_override_prt_cas_quests_16_1_nillem_said_he_visit_you_cd64a8: "尼勒姆说他会准备好一切后去你的房间。你可以在房间里等他。"
  npc_override_prt_cas_quests_16_1_nillem_told_me_08372b: "尼勒姆已经告诉我了。"
  npc_override_prt_cas_quests_16_1_no_about_you_one_who_df36da: "不，不是关于那个。你就是给威格纳家族送家具的人，对吧？"
  npc_override_prt_cas_quests_16_1_no_actually_she_turned_d_d35eeb: "不，实际上……她^0000cd拒绝了^000000。她把你送的东西也退回来了。"
  npc_override_prt_cas_quests_16_1_no_all_6f2b31: "不，完全没有。"
  npc_override_prt_cas_quests_16_1_no_any_access_him_blocke_3a5b3e: "不。任何接触他的途径都被封锁了。"
  npc_override_prt_cas_quests_16_1_no_b8b9f1: "不。"
  npc_override_prt_cas_quests_16_1_no_c03f1e: "不……"
  npc_override_prt_cas_quests_16_1_no_either_she_just_said_65c0f2: "不，也不是那个……她只是说她现在不是谈恋爱的处境。"
  npc_override_prt_cas_quests_16_1_no_enough_ccb791: "不。这就够了。"
  npc_override_prt_cas_quests_16_1_no_everyone_seen_there_n_b86fa2: "不。每个人都在那里看到了，但没人看到它被拿走。"
  npc_override_prt_cas_quests_16_1_no_fact_i_think_i_12b3a4: "不，事实上，我想我很清楚。是因为你不成熟的同情心，你想破坏我的计划！"
  npc_override_prt_cas_quests_16_1_no_grandfather_him_asked_f84017: "不，他的祖父让我给他带个口信。"
  npc_override_prt_cas_quests_16_1_no_harm_should_done_him_46902b: "……不应该伤害他，你知道的。"
  npc_override_prt_cas_quests_16_1_no_he_mad_me_814ca8: "不，他会生我的气的。"
  npc_override_prt_cas_quests_16_1_no_i_am_here_see_fc2a5b: "不。我是来看你的，艾萨克。"
  npc_override_prt_cas_quests_16_1_no_i_am_suspecting_you_ddf63d: "不，我不是在怀疑你。请不要误会。我只是问你什么时候看到它的，以及那里是否还有其他人。"
  npc_override_prt_cas_quests_16_1_no_i_don_t_284da0: "不，我不。"
  npc_override_prt_cas_quests_16_1_no_i_don_t_know_14981e: "不，我不知道。从未听说过。"
  npc_override_prt_cas_quests_16_1_no_i_don_t_think_dfcf5a: "不……我不这么认为……我只是……"
  npc_override_prt_cas_quests_16_1_no_i_haven_t_been_726d55: "不，我还没能见到她。让我再去看看她。"
  npc_override_prt_cas_quests_16_1_no_i_just_question_you_d89426: "不，我只是有个问题要问你。你在房间里看到桌子上有小盒子吗？"
  npc_override_prt_cas_quests_16_1_no_i_just_wanted_talk_87c004: "不。我只是想和你谈谈。"
  npc_override_prt_cas_quests_16_1_no_i_ll_come_back_6b8192: "不。我很快会回来。"
  npc_override_prt_cas_quests_16_1_no_listen_me_i_am_b6e52d: "不，听我说。我说的是实话。别往心里去。"
  npc_override_prt_cas_quests_16_1_no_mage_say_no_no_4cabc7: "没有魔法师会拒绝那个！难怪我这么兴奋！"
  npc_override_prt_cas_quests_16_1_no_matter_more_important_e75132: "没有什么比这更重要！"
  npc_override_prt_cas_quests_16_1_no_much_more_fabulous_b6de32: "不，要华丽得多！"
  npc_override_prt_cas_quests_16_1_no_no_i_am_just_40fc21: "不，不，我不是。就把它带回去吧。"
  npc_override_prt_cas_quests_16_1_no_no_i_didn_t_976c92: "……不，不。我没有。"
  npc_override_prt_cas_quests_16_1_no_no_i_really_wanted_5c5b06: "不！不！我真的很想要它们！谢谢你！"
  npc_override_prt_cas_quests_16_1_no_no_one_s_ever_db77a3: "不。除了我们的姐姐，从来没人对我发过火。"
  npc_override_prt_cas_quests_16_1_no_no_please_d36cd8: "不！不，求你了！"
  npc_override_prt_cas_quests_16_1_no_nothing_like_please_r_05855d: "不，没有那样的事。请放松。"
  npc_override_prt_cas_quests_16_1_no_offense_adventurer_ab_f367aa: "无意冒犯，冒险者。这不是关于你的。他只是在胡说八道……"
  npc_override_prt_cas_quests_16_1_no_ok_me_78c5ff: "不，我没关系。"
  npc_override_prt_cas_quests_16_1_no_one_fool_my_eyes_947ca5: "没人能这样欺骗我的眼睛。"
  npc_override_prt_cas_quests_16_1_no_one_knows_about_you_c51e41: "没人知道这件事，你知道的。"
  npc_override_prt_cas_quests_16_1_no_one_question_your_rep_d46347: "没人会质疑你的声誉和能力。所以我很想开门见山，但……"
  npc_override_prt_cas_quests_16_1_no_one_seems_pay_much_dc6386: "似乎没人太注意，但你永远不知道。"
  npc_override_prt_cas_quests_16_1_no_one_stop_you_hanging_e465ff: "没人会阻止你和我们一起出去玩。请常来拜访我们。"
  npc_override_prt_cas_quests_16_1_no_please_calm_down_i_8ad772: "不。请冷静。我不是在怀疑你。我只是想听听你的故事。我只是根据见过盒子的人的证词追踪盒子的下落。"
  npc_override_prt_cas_quests_16_1_no_please_just_read_firs_177249: "不，不是。请先读一下。"
  npc_override_prt_cas_quests_16_1_no_s_more_serious_8cf275: "不，事情更严重。"
  npc_override_prt_cas_quests_16_1_no_s_ok_68f651: "不，没关系。"
  npc_override_prt_cas_quests_16_1_no_she_said_she_currentl_0ca2f0: "不，不是那个……她说她目前不是谈恋爱的处境。她似乎有原因。"
  npc_override_prt_cas_quests_16_1_no_they_you_don_t_530a57: "不，他们没有。你不必为此担心。"
  npc_override_prt_cas_quests_16_1_no_thing_i_then_see_003e6b: "不，那是我能做到的事。那么回头见。"
  npc_override_prt_cas_quests_16_1_no_use_getting_ticket_nu_56ae9f: "拿到排队号码也没用…… 等轮到我太难了。"
  npc_override_prt_cas_quests_16_1_no_use_though_b8f521: "不过那也没用……"
  npc_override_prt_cas_quests_16_1_no_way_0568d5: "不可能！"
  npc_override_prt_cas_quests_16_1_no_way_what_i_saw_0fbfa4: "不可能！我看到的是蓝眼睛，但这些是红色的！真奇怪！"
  npc_override_prt_cas_quests_16_1_no_well_perhaps_there_co_bd990e: "不？好吧。也许，无风不起浪。"
  npc_override_prt_cas_quests_16_1_no_wonder_he_wasn_t_714ba0: "难怪他没回来！"
  npc_override_prt_cas_quests_16_1_no_wonder_since_exclusiv_64126d: "难怪，因为这是王室专用的文书室。"
  npc_override_prt_cas_quests_16_1_no_you_brought_all_them_f0fe2f: "不！你把它们都带来了。我太高兴了！"
  npc_override_prt_cas_quests_16_1_noble_family_so_good_as_f7ea97: "^0000cd贵族家庭并不像看起来那么好^000000。你只是在后街扮演领袖，完全破坏了我们的计划！"
  npc_override_prt_cas_quests_16_1_nobody_come_into_place_i_33b9cd: "如果你不是工作人员，没人能进入这个地方。请出去。"
  npc_override_prt_cas_quests_16_1_noisy_out_here_f23281: "外面很吵。"
  npc_override_prt_cas_quests_16_1_nonsense_fd0807: "那是胡说八道！"
  npc_override_prt_cas_quests_16_1_note_56dc31: "一张便条？"
  npc_override_prt_cas_quests_16_1_nothing_good_done_stayin_cb8232: "在一个不属于我们时代的地方待太久，不会有什么好事"
  npc_override_prt_cas_quests_16_1_nothing_i_should_know_no_dc8996: "这不是我应该知道的事，也不是我应该参与的地方。但尽管如此，我对此很好奇。"
  npc_override_prt_cas_quests_16_1_nothing_particular_what_2d1600: "没什么特别的。你能想象到的关于王国地牢的一切，就是那里的一切。"
  npc_override_prt_cas_quests_16_1_now_7d2b03: "但现在不行。"
  npc_override_prt_cas_quests_16_1_now_disperse_go_d2395a: "现在散开！走！"
  npc_override_prt_cas_quests_16_1_now_fellow_become_freer_1bca72: "现在那个家伙已经从死亡中解脱了，我想知道他在打什么主意。我想知道他会在下一封信中写下什么样的记忆。"
  npc_override_prt_cas_quests_16_1_now_i_am_going_lead_147bd9: "从现在起，我将帮助我的祖父领导我的家族。"
  npc_override_prt_cas_quests_16_1_now_i_am_home_seems_c244ff: "现在我回家了，赫尔穆特、沃尔夫和阿格妮丝似乎都很好。"
  npc_override_prt_cas_quests_16_1_now_i_embroider_my_dress_6c4371: "现在我可以像夜空中闪烁的星星一样刺绣我的裙子了。一定会很漂亮的。"
  npc_override_prt_cas_quests_16_1_now_i_guess_she_palace_b0af63: "现在我想她在宫殿里是为了修理公主们的衣服。"
  npc_override_prt_cas_quests_16_1_now_i_job_today_you_663074: "既然我今天有工作要做，而且你做得很好。也许我应该给你一份礼物。"
  npc_override_prt_cas_quests_16_1_now_i_open_up_my_864917: "现在我可以对我的兄弟们更加敞开心扉了。"
  npc_override_prt_cas_quests_16_1_now_i_remember_servant_w_beb2e7: "现在我想起来了。以前服侍我的仆人给了我那个。我不确定它是否还在这里。"
  npc_override_prt_cas_quests_16_1_now_i_some_room_breathe_9e5eca: "现在我有一些喘息的空间了……"
  npc_override_prt_cas_quests_16_1_now_i_t_let_myself_455bd9: "现在我无法让自己离开这个黑暗潮湿的地方，因为那个胆小的人类。一旦我出去，我永远不会原谅人类。"
  npc_override_prt_cas_quests_16_1_now_i_think_i_use_f3bbe6: "现在我想我可以用这些东西做一件美丽优雅的裙子。一定会很棒的。"
  npc_override_prt_cas_quests_16_1_now_i_ve_got_something_86d1e6: "现在我有事要做了。"
  npc_override_prt_cas_quests_16_1_now_imperial_ordinance_j_c221d2: "现在帝国法令只会是……"
  npc_override_prt_cas_quests_16_1_now_my_prince_come_me_e58201: "现在，我的王子会和我一起来吗？"
  npc_override_prt_cas_quests_16_1_now_my_thirst_been_quenc_ea7b26: "既然我的口渴已经解渴了，让我给你讲讲这个故事。"
  npc_override_prt_cas_quests_16_1_now_own_i_am_going_c3e016: "从现在起，我要告诉他们我的感受，以避免任何误解。"
  npc_override_prt_cas_quests_16_1_now_palace_hosting_banqu_c64c80: "现在^4d4dff宫殿正在为空洞归来的英雄们举办宴会^000000。"
  npc_override_prt_cas_quests_16_1_now_prison_becomes_clean_b56186: "既然监狱变干净了，你一定也感觉很好，不是吗，人类？我们应该更经常地打扫。"
  npc_override_prt_cas_quests_16_1_now_prison_gotten_messy_52383f: "既然监狱已经像我计划的那样变得混乱了。所以终于到了打扫的时候了。"
  npc_override_prt_cas_quests_16_1_now_quick_e7ded8: "现在！快！"
  npc_override_prt_cas_quests_16_1_now_then_868af0: "现在……那么！"
  npc_override_prt_cas_quests_16_1_now_then_a522b1: "现在……那么。"
  npc_override_prt_cas_quests_16_1_now_there_katrin_isaac_w_82be3a: "现在有卡特琳和艾萨克可以支持尤尔根。"
  npc_override_prt_cas_quests_16_1_now_time_lord_helmut_beg_9b254f: "现在是赫尔穆特大人开始感到口渴的时候了。"
  npc_override_prt_cas_quests_16_1_now_training_too_overwhe_4ad880: "目前，训练对你来说太艰巨了。你最好在继续训练之前学习基础知识。"
  npc_override_prt_cas_quests_16_1_now_we_getting_along_tha_0e2482: "但现在我们相处得很好。再次非常感谢你。"
  npc_override_prt_cas_quests_16_1_now_you_bring_kitchen_on_2eddd4: "现在，你可以把这个带到厨房。那是唯一剩下的事了！"
  npc_override_prt_cas_quests_16_1_now_you_come_past_memori_1d9034: "从现在起，你可以^4d4dff直接来到王室往昔记忆^000000，或者……"
  npc_override_prt_cas_quests_16_1_now_you_finished_cleanin_9625b9: "既然你今天完成了清洁，让我给你这个。明天再来！"
  npc_override_prt_cas_quests_16_1_now_you_get_daily_quests_05fa40: "^4d4dff从现在起，你可以从弗里德里希·斯托尔策那里获得与过去意识之室相关的每日任务。^000000"
  npc_override_prt_cas_quests_16_1_now_you_mention_how_you_26cf4b: "既然你提到了，你觉得我们的第三个孩子艾萨克怎么样？"
  npc_override_prt_cas_quests_16_1_now_you_received_special_d79ca4: "既然你收到了特别奖励金，请继续保持良好的工作。"
  npc_override_prt_cas_quests_16_1_now_you_trained_hunting_04b98a: "从现在起，你可以接受训练，狩猎某些类型的怪物，如人类、动物、昆虫、鱼类、植物、恶魔、天使、无属性和龙类怪物。"
  npc_override_prt_cas_quests_16_1_nowadays_he_shares_many_b020ff: "如今，他与我的祖父分担许多工作，他有很多话要和你谈。"
  npc_override_prt_cas_quests_16_1_noyel_air_i_breathe_coul_b32058: "诺耶尔，我呼吸的空气现在再新鲜不过了！"
  npc_override_prt_cas_quests_16_1_noyel_go_ahead_bring_pri_6b9789: "诺耶尔，去把那个监狱看守带来。我有话要和他算账。"
  npc_override_prt_cas_quests_16_1_noyel_humidifier_you_bro_ec8adc: "诺耶尔，你给我带来的加湿器似乎不工作。你能再带一个新的来吗？"
  npc_override_prt_cas_quests_16_1_noyel_i_question_other_h_6d812d: "诺耶尔，我有个问题！其他人类囚犯也生活在这种恶劣的环境中吗？"
  npc_override_prt_cas_quests_16_1_noyel_when_i_get_those_203e38: "诺耶尔，我什么时候能拿到那20个除湿器？空气感觉太潮湿了，开始让人不舒服了。"
  npc_override_prt_cas_quests_16_1_noyel_where_you_think_yo_537880: "诺耶尔！你以为你要去哪里？诺耶尔。"
  npc_override_prt_cas_quests_16_1_nyhill_c1eb50: "尼希尔？"
  npc_override_prt_cas_quests_16_1_nyhill_come_me_ad7f95: "尼希尔，跟我来。"
  npc_override_prt_cas_quests_16_1_nyhill_doesn_t_what_take_8e9bf4: "尼希尔没有成为国王的资质。"
  npc_override_prt_cas_quests_16_1_nyhill_everything_db0ade: "尼希尔拥有一切。"
  npc_override_prt_cas_quests_16_1_nyhill_he_just_4af63d: "尼希尔，他只是……"
  npc_override_prt_cas_quests_16_1_nyhill_mijeria_i_am_mise_ae8a6f: "尼希尔·米杰里亚，我是一个一无所有的可怜海涅！你给我起了这样的名字，是因为我毫无用处！"
  npc_override_prt_cas_quests_16_1_nyhill_must_left_banquet_dada6a: "尼希尔一定已经离开宴会厅了。"
  npc_override_prt_cas_quests_16_1_nyhill_room_he_told_me_5146f6: "尼希尔会在那个房间吗？他告诉我他不喜欢待在皇家别墅，因为祖父大公。"
  npc_override_prt_cas_quests_16_1_nyhill_so_jealous_him_no_e6201b: "而那个尼希尔现在很嫉妒他。"
  npc_override_prt_cas_quests_16_1_nyhill_went_banquet_hall_7265d5: "尼希尔也去了宴会厅。"
  npc_override_prt_cas_quests_16_1_nyhill_you_sentence_you_b331db: "尼希尔，我判你暂时禁闭处分。"
  npc_override_prt_cas_quests_16_1_oh_5235ff: "哦！"
  npc_override_prt_cas_quests_16_1_oh_78a2fc: "哦……"
  npc_override_prt_cas_quests_16_1_oh_9a5c68: "哦！这个！那个！这个！"
  npc_override_prt_cas_quests_16_1_oh_again_dear_adventurer_d66374: "哦，又来了。亲爱的冒险者，你应该习惯了，要在我家和我兄弟交谈就得这样。"
  npc_override_prt_cas_quests_16_1_oh_alternative_better_th_6dff11: "哦，这个替代方案比我想象的要好。"
  npc_override_prt_cas_quests_16_1_oh_anyways_thank_you_hel_ad57a4: "哦！总之，谢谢你帮助村民们。"
  npc_override_prt_cas_quests_16_1_oh_aren_t_you_adventurer_bfc393: "哦，你不是拯救世界的冒险者吗？请有一天来拜访波尔特马拉亚。那里的每个人都会欢迎你！你的故事甚至传到了远离这里的地方！"
  npc_override_prt_cas_quests_16_1_oh_book_must_one_legend_67f854: "哦！这本书一定是传说中的那本……"
  npc_override_prt_cas_quests_16_1_oh_box_s_lock_protected_c53502: "哦，盒子的锁被^0000cd密码^000000保护了。"
  npc_override_prt_cas_quests_16_1_oh_darling_i_love_here_36b041: "哦，亲爱的，我喜欢在宫殿里，时隔这么久。这里有很多友好的面孔。"
  npc_override_prt_cas_quests_16_1_oh_dear_adventurer_thank_5b0c3b: "哦！亲爱的冒险者，谢谢你。她很能干，你知道的。"
  npc_override_prt_cas_quests_16_1_oh_dear_adventurer_welco_0ba52d: "哦，亲爱的冒险者，欢迎。"
  npc_override_prt_cas_quests_16_1_oh_dear_belt_looks_like_518580: "哦！亲爱的{0}……那条腰带？它看起来像是我被不死族杀死的同事的腰带。"
  npc_override_prt_cas_quests_16_1_oh_dear_crusader_45bf7c: "哦！亲爱的十字军！"
  npc_override_prt_cas_quests_16_1_oh_dear_i_want_catch_90eda5: "哦天哪，我想和很久没能见到的人叙叙旧。你可以去和其他人聊聊。"
  npc_override_prt_cas_quests_16_1_oh_dear_mechanic_belt_lo_821eac: "哦，亲爱的机械工匠！那条腰带？它看起来像是我被不死族杀死的同事的腰带。"
  npc_override_prt_cas_quests_16_1_oh_dear_paladin_9cbae5: "哦！亲爱的圣殿十字军！"
  npc_override_prt_cas_quests_16_1_oh_doesn_t_work_well_979b21: "哦…… 它不太好用。"
  npc_override_prt_cas_quests_16_1_oh_don_t_make_me_fb522d: "哦，别让我笑。"
  npc_override_prt_cas_quests_16_1_oh_ellie_my_wife_very_a9d7a8: "哦，艾莉…… 我的妻子是个很脆弱的女人。我希望她没事。"
  npc_override_prt_cas_quests_16_1_oh_eryus_cough_cough_ead0a2: "哦，埃里乌斯…… 咳…… 咳……"
  npc_override_prt_cas_quests_16_1_oh_first_time_since_our_88c0a1: "哦，这是我们上次见面以来第一次为你的转职吗？"
  npc_override_prt_cas_quests_16_1_oh_good_good_thing_eef0ae: "……哦，好。这是件好事。"
  npc_override_prt_cas_quests_16_1_oh_good_how_nice_f84d31: "哦，好！太好了！"
  npc_override_prt_cas_quests_16_1_oh_gosh_who_done_such_6c31c5: "哦天哪！是谁做了这种事？"
  npc_override_prt_cas_quests_16_1_oh_he_such_kind_person_061747: "哦…… 他是个如此善良的人…… 他一定也遇到了危险，但他仍然关心我……"
  npc_override_prt_cas_quests_16_1_oh_head_chef_been_lookin_24f192: "哦…… 主厨一直在找你。"
  npc_override_prt_cas_quests_16_1_oh_hello_6536fc: "哦，你好。"
  npc_override_prt_cas_quests_16_1_oh_here_you_bef8c8: "哦！你在这里！"
