  npc_override_prt_cas_quests_16_1_oh_no_i_won_t_26c73b: "哦不！我不会吃那个！我不想再吃一口那猪食！我可能不是美食家，但我的舌头还没有腐烂！"
  npc_override_prt_cas_quests_16_1_oh_no_s_getting_out_8fa978: "哦，不。事情开始失控了。在这黑暗失控之前，给我带来……花……~呻吟~"
  npc_override_prt_cas_quests_16_1_oh_no_wonder_you_couldn_174b5d: "哦，难怪你记不起我的脸。我觉得有点奇怪。顺便说一下，你们两姐妹一定是一起在这里工作的。"
  npc_override_prt_cas_quests_16_1_oh_no_you_shouldn_t_f0282f: "哦！不，你不应该。我告诉过你。你是唯一知道这件事的人。"
  npc_override_prt_cas_quests_16_1_oh_odin_thank_you_dear_74e3e1: "哦，奥丁…… 谢谢你！亲爱的冒险者，请找到我的妻子。"
  npc_override_prt_cas_quests_16_1_oh_ok_calm_down_i_954907: "哦，好的。冷静。我会告诉尤尔根你推迟了答复。"
  npc_override_prt_cas_quests_16_1_oh_palace_18b5c1: "哦，宫殿！"
  npc_override_prt_cas_quests_16_1_oh_please_excuse_my_bad_d78208: "哦，请原谅我的失礼。对不起。请原谅我之前的举止。"
  npc_override_prt_cas_quests_16_1_oh_quiet_there_f8365b: "哦，那边安静！"
  npc_override_prt_cas_quests_16_1_oh_really_he_been_waitin_4e6dc9: "哦，真的吗？他一直在等伊森奥诺的召唤！我为他高兴。"
  npc_override_prt_cas_quests_16_1_oh_really_i_see_a906f0: "哦…… 真的。我明白了。"
  npc_override_prt_cas_quests_16_1_oh_really_so_pretty_ther_0d595d: "哦，这真的…… 太美了。这个像玻璃一样的东西里面有水……"
  npc_override_prt_cas_quests_16_1_oh_right_i_my_way_10f129: "哦，对了。我正要去见英雄！"
  npc_override_prt_cas_quests_16_1_oh_right_i_see_right_3cd62c: "哦，对了！我明白了，对了！"
  npc_override_prt_cas_quests_16_1_oh_right_i_told_you_7296a1: "哦，对了！我告诉过我会给你奖励的，不是吗？"
  npc_override_prt_cas_quests_16_1_oh_right_you_re_noyel_dd5bcb: "哦，对了，你是诺耶尔！我喜欢这个名字的发音。从现在起你的名字就是诺耶尔。"
  npc_override_prt_cas_quests_16_1_oh_s_disappointing_i_tho_57901f: "哦，真令人失望！我以为作为冒险者你的记忆力会很好。"
  npc_override_prt_cas_quests_16_1_oh_s_hot_jurgen_please_22aa09: "哦，好热！尤尔根，请救救我…… 啊！"
  npc_override_prt_cas_quests_16_1_oh_s_you_darling_i_f7656a: "哦，是你，亲爱的！我一直在等你！"
  npc_override_prt_cas_quests_16_1_oh_sector_g_you_say_fcacbb: "哦，你说G区？嗯，那个区域一定是……"
  npc_override_prt_cas_quests_16_1_oh_shaking_he_shaking_79adb0: "哦，在颤抖。他在颤抖！"
  npc_override_prt_cas_quests_16_1_oh_slipped_my_tongue_f17cfb: "哦…… 我说漏嘴了。"
  npc_override_prt_cas_quests_16_1_oh_some_faith_don_t_c1dbb1: "哦，有点信心。你不知道我是做什么的吗？"
  npc_override_prt_cas_quests_16_1_oh_song_misfortune_which_197c9f: "哦，这是那首被遗忘的不幸之歌，尽管它有音乐价值。"
  npc_override_prt_cas_quests_16_1_oh_sorry_about_i_am_c0f269: "哦，对此很抱歉。我是^0000cd西蒙·瓦尔特·马歇尔^000000。"
  npc_override_prt_cas_quests_16_1_oh_sure_looks_delicious_e6aae7: "哦，看起来确实很好吃。我应该稍后尝尝。总之，关于盒子你还知道别的什么吗？"
  npc_override_prt_cas_quests_16_1_oh_tamarin_must_friend_w_6ee476: "哦，塔马林一定是那个经常失踪的朋友，对吧？"
  npc_override_prt_cas_quests_16_1_oh_thank_god_dear_advent_07a0e2: "哦！谢天谢地！亲爱的冒险者……"
  npc_override_prt_cas_quests_16_1_oh_then_i_must_been_a1ace6: "哦，那我一定对无数人做了坏事。我对此无能为力。"
  npc_override_prt_cas_quests_16_1_oh_there_he_goes_again_18b134: "哦，他又来了。我现在该走了。亲爱的冒险者，希望稍后能见到你。"
  npc_override_prt_cas_quests_16_1_oh_there_must_been_mista_17d97a: "哦，一定是弄错了！"
  npc_override_prt_cas_quests_16_1_oh_there_one_problem_tho_f82e4d: "哦，不过有一个问题。徽章在重置时有可能被摧毁。几率大约是20%。因为它是个小东西，移除强化会有一些副作用。"
  npc_override_prt_cas_quests_16_1_oh_they_doing_fine_pleas_39fce2: "哦，他们很好。有时间请去我们家看看。"
  npc_override_prt_cas_quests_16_1_oh_troublesome_d3848d: "哦，这很麻烦。"
  npc_override_prt_cas_quests_16_1_oh_uncle_peco_did_you_557dc2: "哦，佩科叔叔，你在这里看到我姐姐了吗？"
  npc_override_prt_cas_quests_16_1_oh_very_presumptuous_me_355593: "哦，我太冒昧了。"
  npc_override_prt_cas_quests_16_1_oh_wait_moment_1a4ea4: "哦，等一下！"
  npc_override_prt_cas_quests_16_1_oh_wait_there_stop_there_e64084: "哦，等一下！停在那里！"
  npc_override_prt_cas_quests_16_1_oh_wait_you_b53feb: "哦，等等。你是……"
  npc_override_prt_cas_quests_16_1_oh_wait_you_know_there_e8b797: "哦，等等！你知道，清洁是有一定的流程的。你首先需要擦掉墙上的霉菌。然后你必须清理油脂。最后你要做的是清洁地板。"
  npc_override_prt_cas_quests_16_1_oh_wait_you_telling_me_b5e816: "哦，等等？你是告诉我它不见了吗？你是在暗示它被我的马车运走了吗？"
  npc_override_prt_cas_quests_16_1_oh_way_you_didn_t_0420fa: "哦，顺便说一下，你没从我这里听到这些。不是我说了什么给你听。"
  npc_override_prt_cas_quests_16_1_oh_we_did_150a10: "哦，我们做到了。"
  npc_override_prt_cas_quests_16_1_oh_we_must_left_you_b93ca4: "哦，我们一定把你排除在谈话之外了，亲爱的冒险者。"
  npc_override_prt_cas_quests_16_1_oh_welcome_dear_adventur_eba454: "哦，欢迎，亲爱的冒险者，我的兄弟在那边……"
  npc_override_prt_cas_quests_16_1_oh_well_87f357: "哦，好吧……"
  npc_override_prt_cas_quests_16_1_oh_well_movement_magic_s_00946c: "哦，好吧，魔法的流动似乎不安。"
  npc_override_prt_cas_quests_16_1_oh_well_only_open_ones_e6c147: "……哦好吧。^4d4dff只对知道真相的人开放^000000……"
  npc_override_prt_cas_quests_16_1_oh_well_since_they_so_961f61: "哦，好吧，既然他们关系那么亲密，他本可以尝试保护他的朋友。"
  npc_override_prt_cas_quests_16_1_oh_well_way_3f4c82: "哦，好吧。顺便说一下……"
  npc_override_prt_cas_quests_16_1_oh_well_who_these_e134c0: "哦，好吧！这些人是谁？"
  npc_override_prt_cas_quests_16_1_oh_well_you_blame_your_38be3a: "哦，好吧，你要怪你自己粗心大意。"
  npc_override_prt_cas_quests_16_1_oh_well_you_who_had_ba74b2: "哦，好吧，是你说过她会因为我的急躁而反感。"
  npc_override_prt_cas_quests_16_1_oh_what_i_help_you_3a4441: "哦，我能帮你什么吗，亲爱的冒险者？"
  npc_override_prt_cas_quests_16_1_oh_what_should_i_6995af: "哦，我该怎么办？"
  npc_override_prt_cas_quests_16_1_oh_when_did_i_get_b39761: "哦！我什么时候在那里弄了个洞？^0000cd15个海之石和1朵凋零玫瑰……^000000在哪里？"
  npc_override_prt_cas_quests_16_1_oh_when_end_b466b5: "哦，什么时候才能结束。"
  npc_override_prt_cas_quests_16_1_oh_where_did_go_264905: "哦？它去哪里了？"
  npc_override_prt_cas_quests_16_1_oh_where_did_you_lose_1389b7: "哦！你把腰带丢在哪里了？"
  npc_override_prt_cas_quests_16_1_oh_where_did_you_lose_6fc924: "哦，你把腰带丢在哪里了？"
  npc_override_prt_cas_quests_16_1_oh_who_47dbdf: "哦，这是谁。"
  npc_override_prt_cas_quests_16_1_oh_why_t_i_get_5940b5: "哦，为什么我不能轻易地把它弄下来？我想我无法早回家了。"
  npc_override_prt_cas_quests_16_1_oh_yes_gate_been_activat_2b8c4c: "哦，是的。大门已经激活了，因为其他人早些时候用过它。"
  npc_override_prt_cas_quests_16_1_oh_yes_i_see_74c83a: "哦…… 是的…… 我明白了……"
  npc_override_prt_cas_quests_16_1_oh_you_5befd5: "哦，是吗？"
  npc_override_prt_cas_quests_16_1_oh_you_9c9bf6: "哦，你有。"
  npc_override_prt_cas_quests_16_1_oh_you_always_so_busy_2a63d3: "哦，你总是这么忙，艾萨克。像这样的宴会是我唯一能见到你的场合。"
  npc_override_prt_cas_quests_16_1_oh_you_back_29eb24: "哦，你回来了。"
  npc_override_prt_cas_quests_16_1_oh_you_back_ca6003: "哦，你回来了！"
  npc_override_prt_cas_quests_16_1_oh_you_f2623c: "哦……{0}，是你吗？"
  npc_override_prt_cas_quests_16_1_oh_you_f77648: "哦，你是……"
  npc_override_prt_cas_quests_16_1_oh_you_here_3ef671: "哦！你在这里！"
  npc_override_prt_cas_quests_16_1_oh_you_here_e1cba9: "哦，你在这里。"
  npc_override_prt_cas_quests_16_1_oh_you_here_help_me_6f2de9: "哦！你是来再次帮助我的吗？"
  npc_override_prt_cas_quests_16_1_oh_you_i_knew_you_d4e734: "哦，你……！我知道你会更好，但我不知道你这么懒。太让人失望了！"
  npc_override_prt_cas_quests_16_1_oh_you_indeed_brought_th_358312: "哦，你真的把它们带来了！让我仔细看看。让我看看。"
  npc_override_prt_cas_quests_16_1_oh_you_know_what_nyhill_26096f: "……哦，你知道尼希尔在做什么吗？"
  npc_override_prt_cas_quests_16_1_oh_you_leaving_now_327613: "哦，你现在要离开吗？"
  npc_override_prt_cas_quests_16_1_oh_you_me_i_so_ea3fbb: "哦，你愿意为我做那件事吗？我会非常感激。这是一个^0000cd波利海绵擦^000000，请把这里的每一寸都擦干净。"
  npc_override_prt_cas_quests_16_1_oh_you_must_invited_as_8bbfa0: "哦，你一定是作为仪式的观察员被邀请的……"
  npc_override_prt_cas_quests_16_1_oh_you_must_lord_heine_dd9f1c: "哦，你一定是海涅家族的领主。"
  npc_override_prt_cas_quests_16_1_oh_you_must_participatin_744c59: "哦！你一定在参加训练。那么，你觉得训练怎么样？"
  npc_override_prt_cas_quests_16_1_oh_you_relationship_enga_5c61c3: "哦，你在恋爱中还是订婚了？或者你已经结婚了？"
  npc_override_prt_cas_quests_16_1_oh_you_right_nyhill_way_9d180c: "哦，你说得对？尼希尔！这边！"
  npc_override_prt_cas_quests_16_1_oh_you_see_me_how_afb006: "哦？你能看到我吗？真奇怪。我不应该被看到。"
  npc_override_prt_cas_quests_16_1_oh_you_should_keep_those_4d0e1b: "哦，你应该记住那些话！"
  npc_override_prt_cas_quests_16_1_oh_you_shouldn_t_bring_328530: "哦，你不应该带太多东西进来。"
  npc_override_prt_cas_quests_16_1_oh_you_still_alive_eb238b: "哦，你还活着！"
  npc_override_prt_cas_quests_16_1_oh_you_thought_so_too_ee5a1a: "哦？你也这么觉得？"
  npc_override_prt_cas_quests_16_1_oh_you_visited_us_change_03406c: "……哦…… 你是来转职的，我记得。"
  npc_override_prt_cas_quests_16_1_oh_you_wanted_know_as_cddd32: "哦，你想知道那个。如你所知，在卢恩-米德加尔特，除了艾尔贝塔和普隆德拉，很少在其他地方看到航海者瓦尔特。"
  npc_override_prt_cas_quests_16_1_ok_e3f886: "好的。"
  npc_override_prt_cas_quests_16_1_ok_go_wigner_ask_isaac_9c424f: "好的。去威格纳家族找艾萨克·威格纳要你要的东西。对吗？"
  npc_override_prt_cas_quests_16_1_ok_hunting_majoruroses_g_f9b9dc: "好的。^0000cd狩猎33只马约鲁罗斯，获得12块软病布，并从皇家图书馆借阅卢恩-米德加尔特历史书^000000。我很快回来。"
  npc_override_prt_cas_quests_16_1_ok_i_guess_i_trust_0a1d3e: "好的，我想我可以相信你的技能。"
  npc_override_prt_cas_quests_16_1_ok_i_ll_give_you_619be7: "好的，我会给你报酬。什么凭证？我需要凭证才能听到谣言吗？"
  npc_override_prt_cas_quests_16_1_ok_i_should_get_going_e3291e: "好的。那我该走了。"
  npc_override_prt_cas_quests_16_1_ok_ok_how_many_you_335f7c: "好的，好的，你想要多少？"
  npc_override_prt_cas_quests_16_1_ok_then_i_prepare_fight_dcad4f: "好的，那我会准备战斗。"
  npc_override_prt_cas_quests_16_1_ok_there_message_isaac_731e65: "没关系。有来自艾萨克的消息。"
  npc_override_prt_cas_quests_16_1_ok_you_9b00c4: "你觉得可以吗？"
  npc_override_prt_cas_quests_16_1_okay_4371ac: "好的。"
  npc_override_prt_cas_quests_16_1_old_soldiers_never_die_t_57d3e5: "老兵永不死！他们只是逐渐凋零！所以收起眼泪！"
  npc_override_prt_cas_quests_16_1_once_he_visits_late_so_edc805: "一旦他来拜访，就会很晚了。所以我必须提前做好准备，不管他穿什么。"
  npc_override_prt_cas_quests_16_1_once_i_tried_move_childr_189af5: "有一次我试图按照我的意愿移动孩子们，但失败了。从那以后我让他们随心所欲。但现在我明白了。"
  npc_override_prt_cas_quests_16_1_once_we_closest_friends_6c46f1: "曾经，我们是最亲密的朋友，但他离开家族后，关系变得尴尬了。"
  npc_override_prt_cas_quests_16_1_once_you_prepare_piece_g_0d84f4: "一旦你准备好一块狮鹫肉…… 你需要倒上酱汁…… 什么？"
  npc_override_prt_cas_quests_16_1_one_27141a: "一！"
  npc_override_prt_cas_quests_16_1_one_characteristics_neri_351f7c: "这是内里乌斯的特征之一。"
  npc_override_prt_cas_quests_16_1_one_day_i_ll_play_ab50c1: "总有一天，我会弹吉他，而你穿着蓝色裙子跳舞唱歌。"
  npc_override_prt_cas_quests_16_1_one_former_heads_family_319a4a: "家族的一位前任族长觉得，用某种怪物训练的方式有其局限性。"
  npc_override_prt_cas_quests_16_1_one_many_aphorisms_passi_417e0e: "这是我们家族流传的许多格言之一。"
  npc_override_prt_cas_quests_16_1_one_more_thing_i_reporte_c1a575: "还有一件事。我已经把你委托我的事情报告给上级了。"
  npc_override_prt_cas_quests_16_1_one_rare_chances_use_sec_b1580e: "这是使用秘密通道的难得机会之一。"
  npc_override_prt_cas_quests_16_1_one_who_betrayed_his_mas_974494: "背叛主人的人。"
  npc_override_prt_cas_quests_16_1_one_who_left_room_making_c8fb4b: "那个出丑离开房间的人是我的儿子，尼希尔。"
  npc_override_prt_cas_quests_16_1_one_who_remembers_first_d61ec9: "记住第一步的人 {0}。"
  npc_override_prt_cas_quests_16_1_one_who_told_about_ritua_88a8da: "那个告诉仪式的人……"
  npc_override_prt_cas_quests_16_1_only_few_people_know_abo_cefa93: "只有少数人知道王室往昔记忆和祝福仪式……"
