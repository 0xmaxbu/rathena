  npc_override_prt_cas_quests_16_1_crack_dimension_99a912: "那是^4d4dff维度裂缝^000000！"
  npc_override_prt_cas_quests_16_1_credentials_wth_talking_099908: "凭证？你在说什么鬼话？他有时候说话真奇怪。"
  npc_override_prt_cas_quests_16_1_cringes_6ef804: "~畏缩~"
  npc_override_prt_cas_quests_16_1_crusader_s_office_end_co_a75410: "十字军办公室在走廊尽头。"
  npc_override_prt_cas_quests_16_1_crusaders_consisting_var_6daf98: "十字军由各种人组成，所以有些人和你一样是冒险者。"
  npc_override_prt_cas_quests_16_1_crusaders_say_he_bluffin_ec25aa: "十字军说他很会说大话，可能是因为他曾经是冒险者。"
  npc_override_prt_cas_quests_16_1_crux_17971c: "还有，克鲁克斯。"
  npc_override_prt_cas_quests_16_1_crux_cheer_up_0299b7: "克鲁克斯，振作起来……"
  npc_override_prt_cas_quests_16_1_crux_did_you_see_5ad457: "克鲁克斯，你看到了吗？"
  npc_override_prt_cas_quests_16_1_crux_did_you_see_nyhill_2a4425: "克鲁克斯，你看到了吗？尼希尔的脚步在颤抖。"
  npc_override_prt_cas_quests_16_1_crux_didn_t_find_out_487c7a: "克鲁克斯没发现什么。"
  npc_override_prt_cas_quests_16_1_crux_let_s_get_back_913010: "克鲁克斯，我们回房间吧。"
  npc_override_prt_cas_quests_16_1_crux_you_answer_me_f69620: "克鲁克斯，你回答我！"
  npc_override_prt_cas_quests_16_1_cupid_love_21f5e8: "^0000cd爱神丘比特^000000……"
  npc_override_prt_cas_quests_16_1_currently_helmut_roegenb_8a9583: "目前^0000cd赫尔穆特·罗根堡^000000，一位优秀的王位候选人，正在参加皇家议会。你看到他了吗？"
  npc_override_prt_cas_quests_16_1_cut_out_there_dumk_2a14c9: "……别说了，杜姆克……"
  npc_override_prt_cas_quests_16_1_cutback_da56ab: "削减！"
  npc_override_prt_cas_quests_16_1_damn_those_undead_ae5f82: "该死……那些不死族……"
  npc_override_prt_cas_quests_16_1_dangerous_out_there_i_ll_2093d4: "外面很危险。我去。你留在这里照顾你的妻子。"
  npc_override_prt_cas_quests_16_1_dark_shape_floating_dark_43dfde: "黑暗形态漂浮在黑暗空间中。我刚表现出兴趣，它就消失得无影无踪。"
  npc_override_prt_cas_quests_16_1_dark_shape_floating_dark_ade964: "黑暗形态漂浮在黑暗空间中。我该怎么办？"
  npc_override_prt_cas_quests_16_1_dark_shape_handed_you_le_513ad0: "黑暗形态把信递给你，然后消失了。"
  npc_override_prt_cas_quests_16_1_dark_shape_handed_you_le_a08df9: "黑暗形态把信递给你，然后离开了。它是想让你送信吗？"
  npc_override_prt_cas_quests_16_1_dark_shape_must_ve_notic_0c0902: "黑暗形态一定注意到了。它也消失得无影无踪。"
  npc_override_prt_cas_quests_16_1_dark_shape_seems_good_mo_92616f: "黑暗形态似乎心情很好，哼着歌。"
  npc_override_prt_cas_quests_16_1_dark_shape_starts_sway_w_3c91c6: "黑暗形态看到我时开始摇摆。它是表示见到我很高兴吗？"
  npc_override_prt_cas_quests_16_1_darkness_should_taken_un_093ccd: "黑暗必须被控制。把那朵花给我……快！啊啊啊！！"
  npc_override_prt_cas_quests_16_1_darkness_sweep_continent_f15d22: "黑暗将席卷大陆，痛苦的呻吟将覆盖整个大陆！！！"
  npc_override_prt_cas_quests_16_1_darling_0a707d: "亲爱的……"
  npc_override_prt_cas_quests_16_1_daughter_7504f0: "女儿？"
  npc_override_prt_cas_quests_16_1_day_mary_accepts_my_feel_386460: "在玛丽接受我的感情的那一天，我想送你一座巨大的纯金雕像。"
  npc_override_prt_cas_quests_16_1_day_paladin_royal_crusad_56c37f: "在……日，皇家十字军办公室的圣骑士……让十字军……参与，并告知嫌疑人有权保持沉默以接受审讯。以下是嫌疑人的陈述。"
  npc_override_prt_cas_quests_16_1_dead_never_comes_back_yo_19b694: "死者永远不会回来。你的父母不会希望你复仇。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_44ebd1: "亲爱的冒险者？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_although_634644: "亲爱的冒险者，虽然我尊重你克服重重障碍和艰辛的努力，但你现在来这里还为时尚早。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_did_you_3d15f8: "亲爱的冒险者，你见到孩子们了吗？如果你有空，我很想和你喝杯茶，听听你的故事。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_did_you_56bd8c: "亲爱的冒险者，你带来我们要的东西了吗？请告诉我们你带来了。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_did_you_5b8f73: "亲爱的冒险者，你带来东西了吗？哦，你带来了。非常感谢。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_did_you_74d6c7: "亲爱的冒险者，你把消息传给迈尔了吗？他说了什么？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_did_you_90d104: "亲爱的冒险者，你带来我要的东西了吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_didn_t_y_8f12b6: "亲爱的冒险者，你不是说要去找送货员吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_get_me_p_10b860: "亲爱的冒险者，能帮我找^0000cd{0}^000000吗？^0000cd15个^000000就够了。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_hello_b370fe: "亲爱的冒险者，你好。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_honor_yo_a724bd: "亲爱的冒险者，很荣幸你能来到罗根堡。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_how_goin_cdf305: "亲爱的冒险者，进展如何？我看到你什么都没有。看来你还没带来。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_how_i_te_8d25e3: "亲爱的冒险者！我该如何向一见钟情的人表达我的感情？我应该去牵她的手说我爱她吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_am_dep_a4b75f: "亲爱的冒险者，我就靠你了！"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_am_gla_149d47: "亲爱的冒险者，很高兴你还在这里。抱歉之前失礼了。我很想和你多聊聊。但如果我在母亲面前说错话，我会挨骂的。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_am_hon_f8fc9c: "亲爱的冒险者，很荣幸见到你。希望你在维格纳家族度过愉快的时光。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_believ_ef4f5b: "亲爱的冒险者。我相信那套制服是吉芬守卫穿的。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_d_like_35703a: "亲爱的冒险者，我想称你为^0000cd爱之使者^000000，因为你替我传递了爱的信息。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_guess_67048e: "亲爱的冒险者，我想今天就到这里吧。如果你不忙，^0000cd为什么不去和我们的父母喝杯茶呢^000000？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_heard_ec976a: "亲爱的冒险者，我听孩子们说了你的事。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_learne_11f7de: "亲爱的冒险者，多亏了你，我学到了新东西，收获颇丰。如果你需要我们的帮助，我们会尽力相助。祝你好运！"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_ll_see_712093: "亲爱的冒险者，那回头见。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_never_c8d220: "亲爱的冒险者，我永远不会忘记这件事，一定会报答你。我们维格纳家族从不忘记任何恩情。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_ve_bee_1ffa67: "亲爱的冒险者！我一直在等你。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_ve_bee_cbd934: "亲爱的冒险者！我一直在等你。进展如何？她也说她爱我吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_i_want_b_6a7e90: "亲爱的冒险者。我想要那团燃烧的火焰。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_if_you_d_539ca1: "亲爱的冒险者，如果你不介意，能帮我向^0000cd迈尔^000000传达我的遗愿吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_if_you_h_d30080: "亲爱的冒险者，如果你不着急，能帮洛温逃到骑士大楼吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_last_mas_c51aa8: "亲爱的冒险者！终于，伊森纳诺大人叫我了！我很高兴能在主人身边守护他。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_my_black_e2fc70: "亲爱的冒险者，我那如黑夜般的黑色礼服就交给你了。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_nice_see_4cdecd: "亲爱的冒险者，很高兴见到你。我是^0000cd阿格涅斯·罗根堡^000000，罗根堡四兄妹中最小的一个。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_please_e_df59c6: "亲爱的冒险者，请原谅我给你带来的所有麻烦。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_please_g_8412c5: "亲爱的冒险者，请帮我找^0000cd5个{0}^000000。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_please_g_aa8f17: "亲爱的冒险者，请帮我找^0000cd5个{0}、5个{1}和5个{2}^000000。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_please_h_5cff65: "亲爱的冒险者，请帮帮我们。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_please_m_4ca566: "亲爱的冒险者，请随意，慢慢在这里逛逛。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_please_m_b202e4: "亲爱的冒险者，请在这里随意。如果你需要什么或发现任何不便，请随时告诉我们。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_since_yo_539e4f: "亲爱的冒险者，既然你已经来了，我可以向你介绍我的家人吗？这位优雅的女士是我的姐姐，^0000cd卡特琳·维格纳^000000。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_since_yo_9bbcd3: "亲爱的冒险者，既然你来到维格纳家族，为什么不去见见其他家族成员呢？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_thank_yo_46d362: "亲爱的冒险者，非常感谢。维格纳生气了吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_thank_yo_5c2c17: "亲爱的冒险者，再次感谢。你明天能再来吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_thank_yo_daec34: "亲爱的冒险者，非常感谢。这是我一点小小的心意。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_thank_yo_db5991: "亲爱的冒险者，谢谢。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_thank_yo_f9643c: "亲爱的冒险者。非常感谢你帮助我的家人。我一直在想如何回报你的贡献，但找不到能与这份感谢相称的东西。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_thanks_c_462e15: "亲爱的冒险者。谢谢你来。我一整天都在想该做什么样的礼服。还是无法决定。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_thanks_y_e57fc8: "亲爱的冒险者，多亏了你，我觉得我和哥哥们的关系更亲密了。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_we_honor_f8c1bc: "亲爱的冒险者，我们很荣幸有你的陪伴。你见过我们维格纳家族的家主——我们的父亲吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_welcome_0f14cd: "亲爱的冒险者，欢迎回来。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_welcome_3a4100: "亲爱的冒险者，欢迎回来。你真是个了不起的人。我想你已经全部拿到了。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_welcome_9a99ce: "亲爱的冒险者，欢迎来到维格纳家族。我的名字是^0000cd勒维埃尔·维格纳^000000。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_welcome_bbeba3: "亲爱的冒险者，欢迎。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_what_bro_025172: "亲爱的冒险者，这个时候是什么风把你吹来的？我能帮你什么吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_what_bro_1cf074: "亲爱的冒险者。是什么把你带到这里来的？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_what_you_695a7e: "亲爱的冒险者，你在这里做什么？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_what_you_c5d20d: "亲爱的冒险者？你在这里做什么？很危险。怪物刚才下来了。请现在离开。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_why_you_d8adf0: "亲爱的冒险者，你怎么又来了？你不是说要回宫殿吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_any_271c9d: "亲爱的冒险者，你知道那是什么花吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_back_9c8dee: "亲爱的冒险者，你回来了。东西安全送到了吗？关于传闻他说了什么？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_back_baf88a: "亲爱的冒险者！你回来了！"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_came_126ad5: "亲爱的冒险者，你来了！你带来我们要的东西了吗？请告诉我们你带来了。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_came_a53975: "亲爱的冒险者，你来了！看来今天可能会有好事发生。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_came_ff7579: "亲爱的冒险者。你来得正是时候"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_here_c348b1: "亲爱的冒险者，你来了。进展如何？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_hole_16ba9d: "亲爱的冒险者，你的口袋有个洞。你丢了什么吗？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_know_b7ca93: "亲爱的冒险者，你什么都不知道。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_know_fbc3fd: "亲爱的冒险者，你知道那句老话吗？越空越能装？"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_may_bb6c62: "亲爱的冒险者，你现在可以出发了。请安全地将我的感情传达给她。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_see_93f64a: "亲爱的冒险者，你看到我了吗？奇怪。我不应该被看到的。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_see_dee7fb: "亲爱的冒险者，你看到我了吗？这可不好。"
  npc_override_prt_cas_quests_16_1_dear_adventurer_you_seem_58efee: "亲爱的冒险者，你看起来很忙。"
  npc_override_prt_cas_quests_16_1_dear_crusader_812eaa: "亲爱的十字军"
  npc_override_prt_cas_quests_16_1_dear_head_chef_please_ma_2292dd: "亲爱的主厨！请嫁给我！"
  npc_override_prt_cas_quests_16_1_dear_hero_please_don_t_cea6ed: "亲爱的英雄，不要太在意这些故事。"
  npc_override_prt_cas_quests_16_1_dear_human_you_one_who_544343: "亲爱的人类，是你唤醒了我吗？"
  npc_override_prt_cas_quests_16_1_dear_jurgen_please_me_to_8e7fb7: "亲爱的尤尔根！请永远和我在一起！"
  npc_override_prt_cas_quests_16_1_dear_lady_jaha_5a7cef: "亲爱的贾哈夫人。"
  npc_override_prt_cas_quests_16_1_dear_paladin_cba18d: "亲爱的圣骑士"
  npc_override_prt_cas_quests_16_1_dear_roegenburg_how_your_6a317a: "亲爱的罗根堡，你的孩子们怎么样？我经常从艾萨克那里听到你第三个孙子的消息。"
  npc_override_prt_cas_quests_16_1_dehumidifier_you_brought_7e590a: "你带来的除湿器似乎不太好用。该换新的了。"
  npc_override_prt_cas_quests_16_1_delete_6cee49: "{0} 删除"
  npc_override_prt_cas_quests_16_1_delicious_609ce8: "美味！"
  npc_override_prt_cas_quests_16_1_delicious_7eb5ba: "真好吃！"
  npc_override_prt_cas_quests_16_1_delivered_enough_magical_a2b427: "它向泰拉·格洛丽亚的祝福之星输送了足够的魔力，"
  npc_override_prt_cas_quests_16_1_depends_what_rumor_you_w_fa9f66: "这取决于你想听什么传闻。价值越高，风险越大。"
