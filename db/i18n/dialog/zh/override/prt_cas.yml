  npc_override_prt_cas_quests_16_1_what_nerd_i_told_you_1f6a80: "真是个书呆子。我告诉过你，如果你不想卷入其中，就退后。"
  npc_override_prt_cas_quests_16_1_what_nonsense_689c76: "一派胡言！"
  npc_override_prt_cas_quests_16_1_what_nonsense_phew_exact_ddbaf0: "一派胡言！呼…… 这就是为什么我告诉过她要向他人敞开心扉，多说话……"
  npc_override_prt_cas_quests_16_1_what_our_family_proud_na_9fdb5a: "我们家族骄傲的是什么？名字？名声？它们在国门外毫无用处。而且现在它们也不像以前那么高了。"
