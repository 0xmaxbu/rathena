  npc_override_prt_cas_quests_16_1_what_you_think_i_totally_87b49f: "你怎么想。我完全同意阿格妮丝的看法。我认为我们互相争斗太久了。"
  npc_override_prt_cas_quests_16_1_what_you_waiting_41ff95: "你还在等什么！"
