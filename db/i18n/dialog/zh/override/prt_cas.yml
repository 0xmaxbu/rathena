  npc_override_prt_cas_quests_16_1_you_visit_prontera_palac_66fe0c: "你可以前往普隆德拉宫殿。"
  npc_override_prt_cas_quests_16_1_you_visited_39b9ad: "你还没有拜访过"
  npc_override_prt_cas_quests_16_1_you_visitor_prontera_pal_41d3f5: "你是普隆德拉宫殿的访客。"
  npc_override_prt_cas_quests_16_1_you_want_build_kingdom_y_43732c: "你想建立一个由你随心所欲统治的王国。如果赫尔穆特没能成为国王呢？那时你会怎么做？"
  npc_override_prt_cas_quests_16_1_you_want_business_us_we_70beea: "你想和我们做生意？但我们不见任何人。"
