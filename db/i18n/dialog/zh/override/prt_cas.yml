  npc_override_prt_cas_quests_16_1_i_prefer_soft_pink_dress_c0f9f1: "我更喜欢柔软的粉色礼服，而不是在大片田野上盛开的年轻花瓣。要做到那样，我想我需要非常柔软的丝绸布料。"
  npc_override_prt_cas_quests_16_1_i_promise_you_lot_more_f9f1a0: "我向你承诺，当我再次在世界上崛起时，会给你更多的奖励。"
  npc_override_prt_cas_quests_16_1_i_putting_cool_pair_shoe_293523: "我正在穿一双很酷的鞋子，但出了点事，我弄断了脚趾甲。"
