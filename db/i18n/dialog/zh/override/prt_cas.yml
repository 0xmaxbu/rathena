  npc_override_prt_cas_quests_16_1_yes_i_am_what_i_9fadc1: "是的，我是。我能为你做什么？"
  npc_override_prt_cas_quests_16_1_yes_i_box_which_looked_6b09ea: "是的，我有。它是一个看起来简单但优雅的盒子。我为了清洁桌子把它拿起来一秒钟，然后放回去。我记得。"
  npc_override_prt_cas_quests_16_1_yes_i_come_here_before_b86f22: "是的。而且我以前来过这里，我帮你打扫过。"
  npc_override_prt_cas_quests_16_1_yes_i_don_t_know_95aeb8: "是的。我不知道他的真名，但他在黑道里被称为^0000cd大脚^000000。"
  npc_override_prt_cas_quests_16_1_yes_i_fell_all_them_dac583: "是的。我把它们都击倒了。现在让我听听那个故事，那个昂贵的故事。"
