  npc_override_prt_cas_quests_16_1_what_if_she_forgets_abou_77848b: "如果她忘了我怎么办？那么，请每天给她发一次我的消息。你不会拒绝的，对吧？"
  npc_override_prt_cas_quests_16_1_what_if_there_dent_shoul_30fc90: "如果有凹痕怎么办？我应该叫詹姆斯来修吗？损坏？送错了？我该怎么办？什么事？"
