  npc_override_prt_cas_quests_16_1_you_been_invited_as_obse_d2b226: "你被邀请作为仪式的观察员。"
  npc_override_prt_cas_quests_16_1_you_been_invited_banquet_082b29: "你也被邀请参加宴会。"
  npc_override_prt_cas_quests_16_1_you_been_main_culprit_af_1f14ee: "你一直是这件事的主谋。"
  npc_override_prt_cas_quests_16_1_you_being_funny_disrespe_d393dc: "你不是在搞笑，而是在对客人无礼。亲爱的冒险者，请原谅无礼。对不起。"
  npc_override_prt_cas_quests_16_1_you_being_so_nervous_isn_1e2999: "但你太紧张了。这对你不是很重要吗？"
  npc_override_prt_cas_quests_16_1_you_better_go_after_lord_a20c5b: "你最好去追大人，确保他没事。"
