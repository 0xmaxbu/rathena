  npc_override_prt_cas_quests_16_1_i_once_tried_distribute_aaedd0: "我曾经试图把它们分发到整个大陆。你以前只要挖地就能得到它们。游客会捡起来当纪念品，或者赌徒会用来作为向海神祈祷的护身符。"
