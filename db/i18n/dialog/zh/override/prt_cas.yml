  npc_override_prt_cas_quests_16_1_yes_word_d1810a: "是的，有传言。"
  npc_override_prt_cas_quests_16_1_yes_yes_my_lady_i_040d44: "是的，是的，我的女士。我随时听候您的差遣。您在哪里？"
  npc_override_prt_cas_quests_16_1_yes_you_call_me_anytime_38af7f: "是的。如果你想见我，可以随时通过这个管家叫我！"
  npc_override_prt_cas_quests_16_1_yes_you_must_ranked_top_7f9c86: "是的！你一定是普隆德拉最忙的人前三名，艾萨克。"
  npc_override_prt_cas_quests_16_1_yes_you_right_fa1a6a: "是的，你说得对！"
  npc_override_prt_cas_quests_16_1_yes_you_right_geoborg_qu_3618a5: "是的，你说得对。是^0000cd格奥博格^000000。女王一定很孤独。"
  npc_override_prt_cas_quests_16_1_yes_you_right_i_think_5e98a8: "是的，你说得对。我想我是不受欢迎的客人。我最好离开。阿格妮丝，我晚点再来。"
  npc_override_prt_cas_quests_16_1_yes_you_right_i_think_bd0e58: "是的，你说得对。我想你抓住重点了。我会试试。我会这样做以避免更多误解。"
  npc_override_prt_cas_quests_16_1_yes_you_should_7c9d05: "是的，你应该！！！"
  npc_override_prt_cas_quests_16_1_yes_your_family_asked_me_661807: "是的。你的家人让我给你传个消息。"
  npc_override_prt_cas_quests_16_1_yesterday_when_i_thinkin_495221: "昨天，当我看着夜空思考时，我发现星星在闪烁。"
  npc_override_prt_cas_quests_16_1_yet_isenhonor_wants_know_d627fb: "还没有。伊森奥诺想知道他兄弟死亡的真相，但由于情况，他没有能力进行调查。"
  npc_override_prt_cas_quests_16_1_yet_ok_we_still_time_130ad6: "还没有？好的。我们还有时间。"
  npc_override_prt_cas_quests_16_1_yo_mean_bad_guy_one_d7f90c: "你是说坏人是我们中的一个？天哪！这很严重！"
  npc_override_prt_cas_quests_16_1_yo_too_ideal_small_sacri_9781bc: "你太理想化了。为了实现大目标，小的牺牲是必须的。"
  npc_override_prt_cas_quests_16_1_yo_who_s_0325fd: "哟！这是谁！"
