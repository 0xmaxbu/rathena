  npc_override_prt_cas_quests_16_1_reason_remains_unknown_t_2beb12: "原因仍然不明，但他们猜测怪物是被讨伐赶到城镇的。"
  npc_override_prt_cas_quests_16_1_recently_i_read_story_kn_2c14af: "最近我读了一个关于骑士为女士牺牲自己的故事。"
  npc_override_prt_cas_quests_16_1_recently_there_rumor_cir_bf9ecb: "最近，普隆德拉流传着关于罗根堡和赫尔穆特·罗根堡的^0000cd谣言^000000。"
  npc_override_prt_cas_quests_16_1_refreshing_94f83e: "很清爽。"
  npc_override_prt_cas_quests_16_1_refreshing_i_am_grateful_4bc984: "很清爽，我很感激你。"
  npc_override_prt_cas_quests_16_1_regard_monster_above_cha_246fe9: "关于上述怪物，^2EA4FF指控包括伪造经验证书、欺诈^000000"
