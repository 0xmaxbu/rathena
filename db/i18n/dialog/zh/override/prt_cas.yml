  npc_override_prt_cas_quests_16_1_what_rumor_about_roegenb_9f7770: "普隆德拉流传的关于罗根堡的谣言是什么。"
  npc_override_prt_cas_quests_16_1_what_s_certain_they_culp_2d0cc1: "可以确定的是，他们是过去在卢恩-米德加尔特制造混乱的罪魁祸首。"
