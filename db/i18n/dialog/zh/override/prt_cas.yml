  npc_override_prt_cas_quests_16_1_you_try_training_8fb01e: "你想试试这个训练吗？"
  npc_override_prt_cas_quests_16_1_you_two_stay_here_might_c76077: "你们两个待在这里。可能很危险。让我先去查看一下。"
  npc_override_prt_cas_quests_16_1_you_unbelievably_rude_i_8527c2: "你太无礼了。我告诉过你应该礼貌地叫我。"
