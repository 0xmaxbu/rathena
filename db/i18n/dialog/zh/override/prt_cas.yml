  npc_override_prt_cas_quests_16_1_you_better_than_i_expect_3524c0: "你比我想象的要好。你已经长大了，我知道你再也不会在我面前哭了。所以别说废话了，出去玩吧。"
  npc_override_prt_cas_quests_16_1_you_blame_certain_level_e7548d: "你在某种程度上要负责任。看看我。我总是全心全意对待别人。他们都因此爱我。"
