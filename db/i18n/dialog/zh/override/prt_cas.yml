  npc_override_prt_cas_quests_16_1_oh_just_impossible_me_qu_a0a438: "哦…… 对我来说，退出是不可能的……"
  npc_override_prt_cas_quests_16_1_oh_kitchen_messy_so_thou_0cb193: "哦，厨房很乱，我脑子里的想法也很乱。哦，多么肮脏混乱！"
  npc_override_prt_cas_quests_16_1_oh_marvelous_1a9ef5: "哦！这太棒了！"
  npc_override_prt_cas_quests_16_1_oh_music_17c8a4: "哦，这音乐是！"
  npc_override_prt_cas_quests_16_1_oh_must_d6a722: "哦，一定是这个。"
  npc_override_prt_cas_quests_16_1_oh_my_0cc9e6: "哦天哪……"
  npc_override_prt_cas_quests_16_1_oh_my_6a18ba: "哦天哪！"
  npc_override_prt_cas_quests_16_1_oh_my_arms_legs_back_5c9b14: "哦，我的手臂、腿、背和整个身体都疼。好吧，我只是很高兴今天的工作完成了。我现在可以休息一下了。我应该去喝点热汤。今天应该是肉汤吧？"
  npc_override_prt_cas_quests_16_1_oh_my_b87eab: "哦，天哪！"
