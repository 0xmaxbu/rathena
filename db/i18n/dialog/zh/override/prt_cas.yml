  npc_override_prt_cas_quests_16_1_yes_i_saw_him_just_1066e4: "是的。我刚才看到他了。这是谁？"
  npc_override_prt_cas_quests_16_1_yes_i_see_you_so_4aaeef: "是的，我明白了。你太无聊了。但这是你魅力的一部分，哈哈。"
  npc_override_prt_cas_quests_16_1_yes_i_something_you_08cd5c: "是的，我有东西给你……"
  npc_override_prt_cas_quests_16_1_yes_i_tell_you_as_f81ead: "是的，只要我知道就告诉你。"
  npc_override_prt_cas_quests_16_1_yes_i_there_any_problem_06c485: "是的，我有…… 家具有什么问题吗？我该怎么办？我永远买不起家具！"
  npc_override_prt_cas_quests_16_1_yes_i_ve_had_lot_157ac1: "是的，我有很多来自各行各业的同伴。但我们到了这里后不得不分开……"
  npc_override_prt_cas_quests_16_1_yes_if_you_slow_witted_321e1a: "是的！如果你反应迟钝，就试着安静！"
  npc_override_prt_cas_quests_16_1_yes_jurgen_seems_really_026b62: "是的。尤尔根似乎真的很认真。"
  npc_override_prt_cas_quests_16_1_yes_jurgen_wants_me_let_0b6a70: "是的。尤尔根想让我告诉你，他的心像大海一样宽广美丽。"
  npc_override_prt_cas_quests_16_1_yes_let_s_take_look_911d3d: "……是的？让我们看看…… 一定要和我分享里面的东西——"
  npc_override_prt_cas_quests_16_1_yes_love_letter_922997: "是的，这是一封情书。"
  npc_override_prt_cas_quests_16_1_yes_my_lady_cfae7f: "是的，我的女士。"
  npc_override_prt_cas_quests_16_1_yes_myer_how_much_you_bcebf4: "是的。^0000cd迈尔^000000？你还要让我们的家族蒙羞多少？"
  npc_override_prt_cas_quests_16_1_yes_myer_said_he_handle_966118: "是的，迈尔说他会处理谣言，所以谣言会消失。我能请你帮我个忙吗？"
  npc_override_prt_cas_quests_16_1_yes_ok_if_rumor_about_269750: "是的，没关系。如果谣言是关于我们家族的，每个人都必须听，这样我们才能聚集并制定解决方案。"
  npc_override_prt_cas_quests_16_1_yes_pleas_go_ahead_b483e7: "是的，请继续。"
  npc_override_prt_cas_quests_16_1_yes_please_go_back_safel_41adc4: "是的，请安全回去。我希望他明天就放弃。"
  npc_override_prt_cas_quests_16_1_yes_please_tell_us_you_2ab140: "是的，请告诉我们你做了。我们尽力平衡她的愤怒。然而，她一直在冷落我们。"
  npc_override_prt_cas_quests_16_1_yes_right_765a6e: "是的。对的。"
