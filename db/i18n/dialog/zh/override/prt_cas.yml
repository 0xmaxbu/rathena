  npc_override_prt_cas_quests_16_1_i_mean_i_am_your_557990: "我的意思是，我不是你的下属……"
  npc_override_prt_cas_quests_16_1_i_mean_i_prepared_dress_a5054a: "我的意思是我准备了一条礼服，想着我会和迈尔一起去。现在舞伴换了，我必须考虑他重新准备。"
