  npc_override_prt_cas_quests_16_1_richard_family_runs_vari_dff5e8: "理查德家族运行各种训练方式。休息是最重要的训练之一。"
  npc_override_prt_cas_quests_16_1_right_2628d8: "{0}，对吧？"
  npc_override_prt_cas_quests_16_1_right_away_1feb4a: "马上做。"
  npc_override_prt_cas_quests_16_1_right_fbc63d: "对的。"
  npc_override_prt_cas_quests_16_1_right_heine_family_every_0056f5: "海涅家族的权利就是一切与海涅之名相关的东西。"
  npc_override_prt_cas_quests_16_1_right_i_ll_see_you_53ce40: "好的。回头见。别让我失望。"
  npc_override_prt_cas_quests_16_1_right_let_me_give_you_45dc36: "好的。让我给你^4d4dff百万尼勒姆呼叫票^000000。"
  npc_override_prt_cas_quests_16_1_right_now_just_hot_mess_10f484: "现在！外面简直一团糟！"
  npc_override_prt_cas_quests_16_1_right_way_did_you_say_418789: "好的。顺便问一下，你说你完全不了解凯恩·瓦尔特·沃克？"
  npc_override_prt_cas_quests_16_1_ritual_calls_blood_ritua_abb6cd: "这是一个召唤鲜血的仪式！一个毁灭与黑暗的仪式！！！！"
  npc_override_prt_cas_quests_16_1_roaring_sound_we_heard_s_697435: "随着一声轰鸣，我们听说有东西掉落在老剑士公会附近。"
  npc_override_prt_cas_quests_16_1_roegenburg_proud_we_desc_80c03c: "罗根堡家族以我们是民族英雄威廉的后裔为荣，并为卢恩-米德加尔特王国的建立和发展做出了贡献。"
  npc_override_prt_cas_quests_16_1_roegenburg_welcomes_adve_72aca0: "罗根堡欢迎有各种经验的冒险者，但对我们来说，现在与你合作还为时过早。"
  npc_override_prt_cas_quests_16_1_room_next_room_heine_fam_babaac: "海涅家族房间隔壁的房间。"
  npc_override_prt_cas_quests_16_1_room_richard_family_a55237: "这是理查德家族的房间。"
  npc_override_prt_cas_quests_16_1_room_richard_family_whic_3e911a: "这是理查德家族的房间，他们一直控制着王国的军权。"
  npc_override_prt_cas_quests_16_1_room_stuffy_317a72: "……房间很闷热。"
  npc_override_prt_cas_quests_16_1_rosa_rosa_5fef09: "罗莎！罗莎！"
  npc_override_prt_cas_quests_16_1_rosa_should_held_my_hand_b57c35: "罗莎本应该紧紧握住我的手。她走丢了，真笨！"
  npc_override_prt_cas_quests_16_1_rosa_who_younger_sister_e8a1a4: "罗莎是那个女孩的妹妹，她在我们的士兵中也很受欢迎。"
  npc_override_prt_cas_quests_16_1_royal_assembly_earlier_w_e991b6: "在早些时候测试王位候选人的皇家议会上……"
  npc_override_prt_cas_quests_16_1_royal_assembly_over_soon_a79165: "皇家议会很快就会结束，最终决定将做出后，仪式就会进行。"
  npc_override_prt_cas_quests_16_1_royal_assembly_over_soon_e68cfc: "皇家议会很快就会结束。"
  npc_override_prt_cas_quests_16_1_royal_chef_must_able_fil_06bcc9: "皇家厨师必须能够尽快填满空盘子！"
  npc_override_prt_cas_quests_16_1_royal_families_attended_e3f224: "8个王室家族出席了。"
  npc_override_prt_cas_quests_16_1_royal_family_focusing_fi_0b31fe: "王室家族正专注于找出谁在幕后操纵。"
  npc_override_prt_cas_quests_16_1_royal_family_rune_midgar_8ff367: "毕竟是卢恩-米德加尔特的王室让你观察仪式的。"
  npc_override_prt_cas_quests_16_1_royal_villa_happens_plac_1017f9: "这座皇家别墅恰好是各家族来首都时居住的地方。除了这个房间，所有其他房间都被其他家族占用了。"
  npc_override_prt_cas_quests_16_1_rudolph_hero_reindeers_s_24f787: "驯鹿英雄鲁道夫说时间就是金钱。我想这也适用于人类。"
  npc_override_prt_cas_quests_16_1_rumor_about_you_i_didn_bad431: "关于你的谣言？我不知道…… 谣言……"
