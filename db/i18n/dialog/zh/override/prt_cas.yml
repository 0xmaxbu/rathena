  npc_override_prt_cas_quests_16_1_especially_you_lack_dign_536cf8: "尤其是你缺乏威严。冒险者会怎么看我们？"
  npc_override_prt_cas_quests_16_1_eternal_glory_hero_midga_5f7a28: "向米德加尔特的英雄致以永恒的荣耀！"
  npc_override_prt_cas_quests_16_1_evangelist_pleasure_767a65: "快乐传道者 {0}。"
  npc_override_prt_cas_quests_16_1_even_better_fresh_scent_f76508: "更好的是，清洁后留下清新的香味，让乘客心情愉悦。"
  npc_override_prt_cas_quests_16_1_even_genius_magician_lik_de1c33: "即使是像我这样的天才魔术师，也有一定的极限。毕竟我也是人类。"
  npc_override_prt_cas_quests_16_1_even_if_fake_imir_heart_2aefa5: "即使是用假的伊米尔之心。"
  npc_override_prt_cas_quests_16_1_even_if_i_did_you_0f9758: "即使我说了，你也不会认真对待。你天生就有那副被祝福的容貌，这是事实。"
  npc_override_prt_cas_quests_16_1_even_if_i_work_so_74b861: "即使我在这里辛苦工作一辈子，我也只能活在阴影中。"
  npc_override_prt_cas_quests_16_1_even_if_s_all_my_3a8669: "即使这一切都是为了我的容貌，我又何尝希望如此？"
  npc_override_prt_cas_quests_16_1_even_if_true_he_still_e7c057: "即使那是真的，他的行为仍然如此粗心大意。"
  npc_override_prt_cas_quests_16_1_even_if_you_elder_family_bc46bc: "即使你是家族长辈，他仍然是王子。你应该对他以礼相待。"
  npc_override_prt_cas_quests_16_1_even_if_you_give_me_84bfc1: "即使你给我一个，你还剩一个。这能有多难？"
  npc_override_prt_cas_quests_16_1_even_if_you_twins_you_8f866f: "即使你们是双胞胎，你们看起来也不完全一样。"
  npc_override_prt_cas_quests_16_1_even_if_your_fear_me_2bbcd7: "即使你对我的恐惧将我束缚在这片黑暗之地，你也永远无法束缚我的意志。记住我的话。"
  npc_override_prt_cas_quests_16_1_even_prisoners_deserve_p_c6c17c: "即使是囚犯也值得拥有舒适的生活环境。记住这一点，诺埃尔。以防万一。"
  npc_override_prt_cas_quests_16_1_even_though_helmut_becom_ce45e7: "即使赫尔穆特成为国王，他也只是个傀儡，而你将^0000cd掌控我们的家族和王国^000000。不是吗？"
  npc_override_prt_cas_quests_16_1_even_when_i_am_doing_9b71ac: "即使我什么都没做错，我也总是被拿来和我英俊的哥哥比较，坏传闻跟着我。你觉得我希望如此吗？"
  npc_override_prt_cas_quests_16_1_even_when_i_eat_drink_5aa20c: "即使我吃饭、喝茶、照镜子、和别人说话的时候！我一整天都在想她。这很痛苦，但我心潮澎湃。"
  npc_override_prt_cas_quests_16_1_event_praise_our_contrib_6db71d: "这是表彰我们贡献的活动。试着微笑一下。"
  npc_override_prt_cas_quests_16_1_event_proceeding_through_8a2661: "^4d4dff这是一个通过纪念进行的活动。"
  npc_override_prt_cas_quests_16_1_event_which_proceeds_as_28efd4: "^4d4dff这是一个作为纪念进行的活动。"
  npc_override_prt_cas_quests_16_1_ever_since_banquet_start_0e5bc4: "自从宴会开始，他就一直把工作带到别的地方去做。"
  npc_override_prt_cas_quests_16_1_ever_since_cowards_stopp_b19b5b: "自从懦夫们不再来到这片黑暗之地，我因无聊而陷入了最后的沉睡。"
  npc_override_prt_cas_quests_16_1_every_knight_belongs_wal_c2761d: "每个被分配到沃尔特家族成员的沃尔特骑士都会被赋予沃尔特这个名字。"
  npc_override_prt_cas_quests_16_1_every_time_i_step_luxury_1209aa: "每当我迈步，奢华的蕾丝就会飘动，让人们想象仙女在林中漫步。这条裙子会让我更美丽。"
  npc_override_prt_cas_quests_16_1_everybody_calm_down_nice_477046: "大家冷静。大声说话不太好。"
  npc_override_prt_cas_quests_16_1_everybody_knows_s_noisy_f84bca: "大家都知道。这里因为故事而吵闹。"
  npc_override_prt_cas_quests_16_1_everybody_worried_about_080a09: "但大家都在担心你。"
  npc_override_prt_cas_quests_16_1_everyone_dresses_so_fanc_2bbd64: "每个人都穿得很华丽……"
  npc_override_prt_cas_quests_16_1_everyone_else_looks_so_n_275369: "其他人都看起来很好，而我感觉自己穿得太朴素了。"
  npc_override_prt_cas_quests_16_1_everyone_else_seems_love_dbdb9a: "其他人似乎都喜欢宴会，但我不喜欢。我是被父母强迫来的。我现在真的想回家休息。"
  npc_override_prt_cas_quests_16_1_everyone_fighting_family_61c8f6: "这个家族里每个人都在争斗，失去重要的东西。你还想要战争吗？"
  npc_override_prt_cas_quests_16_1_everyone_just_too_kind_l_85a2f0: "每个人都太善良了，就这样放过了这种事。"
  npc_override_prt_cas_quests_16_1_everyone_may_know_how_on_ec58b2: "每个人都知道训练后渴望更多行动的感觉。然而，那是该休息的时候。"
  npc_override_prt_cas_quests_16_1_everyone_prontera_must_k_3e2420: "普隆特拉的每个人一定都知道。总之，感谢你为守卫们做这些。"
  npc_override_prt_cas_quests_16_1_everyone_who_ever_talks_7c9fd8: "每个和我说话的人都谈论那件事！"
  npc_override_prt_cas_quests_16_1_everything_all_right_4236c1: "一切正常。"
  npc_override_prt_cas_quests_16_1_everything_settled_soon_4425b9: "一切很快就会解决。在那之前，在你的房间里等着。"
  npc_override_prt_cas_quests_16_1_evil_laughter_5bcd51: "~邪恶的笑声~"
  npc_override_prt_cas_quests_16_1_evil_laughter_continues_65bf8c: "~邪恶的笑声继续~"
  npc_override_prt_cas_quests_16_1_evil_laughter_human_you_d7a3af: "~邪恶的笑声~人类！你战胜了黑暗，拯救了世界。高兴吧！"
  npc_override_prt_cas_quests_16_1_evil_laughter_you_ve_got_73473f: "~邪恶的笑声~你有勇气，人类！"
  npc_override_prt_cas_quests_16_1_eww_f7a96c: "呃……"
  npc_override_prt_cas_quests_16_1_exact_i_volunteered_sinc_815792: "准确地说，我是自愿的，因为我听说你要去拜访纳里乌斯家族。"
  npc_override_prt_cas_quests_16_1_excellent_grilled_griffo_54ef73: "一份出色的烤狮鹫DX做好了！"
  npc_override_prt_cas_quests_16_1_except_him_2ac9f5: "除了他。"
  npc_override_prt_cas_quests_16_1_exchange_5b13ea: "交换"
  npc_override_prt_cas_quests_16_1_exchanged_honor_marks_28ad17: "它可以兑换^FF0000{0}个荣誉徽章^000000。"
  npc_override_prt_cas_quests_16_1_exchanged_honor_marks_fca453: "它可以兑换^FF0000{0}{1}个荣誉徽章^000000。"
  npc_override_prt_cas_quests_16_1_excuse_me_471adf: "打扰一下。"
  npc_override_prt_cas_quests_16_1_excuse_me_6c0653: "……打扰一下。"
  npc_override_prt_cas_quests_16_1_excuse_me_dear_adventure_2796ba: "打扰一下，亲爱的冒险者？"
  npc_override_prt_cas_quests_16_1_excuse_me_too_7825c0: "我也打扰一下。"
  npc_override_prt_cas_quests_16_1_exploring_through_fissur_3277a8: "探索维度裂缝以揭开宫殿的秘密……！"
  npc_override_prt_cas_quests_16_1_expression_your_face_you_acc746: "你脸上的表情……你一定听到了人们的议论。"
  npc_override_prt_cas_quests_16_1_exquisite_taste_made_mas_4d2f2e: "大师制作的精致味道！"
  npc_override_prt_cas_quests_16_1_extend_queen_every_court_8682d6: "对女王以礼相待。"
  npc_override_prt_cas_quests_16_1_facility_so_old_there_no_bbc58f: "这个设施太旧了，没有关于它的文件记载。我们只是口耳相传。"
  npc_override_prt_cas_quests_16_1_facility_there_very_old_70df11: "那里的设施很旧，所以肯定需要一些修缮工作。"
  npc_override_prt_cas_quests_16_1_fact_announced_as_soon_a_38bc8f: "这一事实将在皇家议会和宴会结束后尽快公布。沃尔夫，现在你应该领导我们的家族。我希望这不会成为你的负担。"
  npc_override_prt_cas_quests_16_1_fact_everybody_anxious_t_1deb8e: "事实上，每个人都很焦虑。他们不喜欢战争。"
  npc_override_prt_cas_quests_16_1_fact_he_had_letter_doesn_66b320: "他有这封信并不能证明他是沃尔特家族的人。"
  npc_override_prt_cas_quests_16_1_fact_i_am_younger_siblin_3b5add: "事实上，我是^0000cd以前在这里工作的女仆的妹妹^000000。就是你之前见过的那个女仆。"
  npc_override_prt_cas_quests_16_1_fact_i_know_nothing_abou_d85594: "事实上，我自己对他的死一无所知。然而，在事件爆发之前，他^0000cd派我来这里执行一项任务^000000。"
  npc_override_prt_cas_quests_16_1_fact_nyhill_supposed_can_904d2c: "事实上，尼希尔本应是王位候选人。"
  npc_override_prt_cas_quests_16_1_fact_we_settled_prontera_aab1ad: "事实上，我们定居在卢恩-米德加尔特的中心——普隆德拉。"
  npc_override_prt_cas_quests_16_1_fact_your_come_here_i_852f8d: "事实上，你来这里并非出于你的意愿。我很确定你一定是因为那位大人叫你来才来的。我理解。"
  npc_override_prt_cas_quests_16_1_fake_324ffc: "那是^4d4dff假的^000000。"
  npc_override_prt_cas_quests_16_1_family_led_women_generat_695865: "这个家族世代由女性领导。因此，我们出的女王比国王多。"
  npc_override_prt_cas_quests_16_1_family_previous_king_bec_47aa19: "前代国王的家族^0000cd因古老的诅咒而变成那样^000000……"
  npc_override_prt_cas_quests_16_1_family_yet_01a592: "家族还没有。"
  npc_override_prt_cas_quests_16_1_famous_as_busy_city_615daa: "而且它以繁忙的城市而闻名"
  npc_override_prt_cas_quests_16_1_fast_way_get_stronger_ta_13a0e1: "艰苦战斗后好好休息是变强的捷径。"
  npc_override_prt_cas_quests_16_1_fate_c3cf3f: "这是命运！"
  npc_override_prt_cas_quests_16_1_fate_dirty_scrub_sponge_0298f3: "这是脏海绵的命运。"
  npc_override_prt_cas_quests_16_1_feels_good_i_come_home_5a1f89: "久违的回家感觉真好。"
  npc_override_prt_cas_quests_16_1_feels_like_i_am_dreaming_e075fc: "感觉像在做梦！"
  npc_override_prt_cas_quests_16_1_fight_fight_fight_i_don_09f089: "战斗，战斗，再战斗……我也不想要那样。"
  npc_override_prt_cas_quests_16_1_fighting_all_about_livin_dbd421: "战斗不是生活的全部。"
  npc_override_prt_cas_quests_16_1_final_chapter_2dbbc1: "这是最终章。"
  npc_override_prt_cas_quests_16_1_find_him_s_your_specialt_77b823: "找到他！这是你的专长！"
  npc_override_prt_cas_quests_16_1_find_isaac_bring_thing_i_79ce04: "找到艾萨克，把我要求的东西带来。"
  npc_override_prt_cas_quests_16_1_first_bring_me_ingredien_63ae24: "首先，把柔软口感的食材带给我。"
  npc_override_prt_cas_quests_16_1_first_bring_me_ingredien_bd7795: "首先，把清新口味的食材带给我。"
  npc_override_prt_cas_quests_16_1_first_cell_number_next_f_1e7f5e: "第一个牢房的编号是^0000cd1^000000，接下来四个牢房是空的，你应该往里面输入数字。"
  npc_override_prt_cas_quests_16_1_first_impression_most_im_dcbff6: "第一印象最重要。第一次问候有很大影响！顺便问一下，我应该说什么作为问候？"
  npc_override_prt_cas_quests_16_1_first_pieces_soft_cloth_45a9d7: "首先，^0000cd12块柔软的布料^000000，^0000cd卢恩-米德加尔特历史书^000000"
  npc_override_prt_cas_quests_16_1_first_room_you_ll_see_cb873f: "那是你在里面会看到的^4d4dff第一个房间^000000。"
  npc_override_prt_cas_quests_16_1_first_royal_assembly_whi_80f8d8: "在第一次举行的皇家议会上，四王子恩斯特被选为候选人。然而，由于几起事件，他放弃了本次皇家议会的席位。"
  npc_override_prt_cas_quests_16_1_first_son_stays_front_ri_c8087e: "长子在前线冒着生命危险，次子却在经商，这违背了家族传统。"
  npc_override_prt_cas_quests_16_1_first_time_me_f25dce: "这是我第一次做这件事。"
  npc_override_prt_cas_quests_16_1_first_try_begin_second_t_326904: "第一次尝试开始，第二次尝试确认，第三次尝试放弃，因为注定不属于你。"
  npc_override_prt_cas_quests_16_1_first_you_need_penetrate_d99f33: "首先，你需要用混合物渗透油脂。然后你需要擦掉油脂。好吧，我们再试一次。"
  npc_override_prt_cas_quests_16_1_first_you_need_scrub_gen_0ec04a: "首先你需要轻轻地擦，再轻轻地擦，然后用力擦！然后用中等力度擦，再用力擦。"
  npc_override_prt_cas_quests_16_1_fits_me_surprisingly_wor_3023b9: "它出乎意料地适合我。工作是有意义且愉快的。而且，我可以展示我唯一的能力，而不是作为罗根堡的能力。"
  npc_override_prt_cas_quests_16_1_five_i_going_use_start_8b256c: "^0000cd五个{0}^000000。我要用星尘在裙子上绣出夜空中的星星。一定会很漂亮。"
  npc_override_prt_cas_quests_16_1_five_i_use_them_make_a014cf: "^0000cd五个{0}^000000。我可以用它们让裙子变得优雅美丽，我会看起来像仙女。"
  npc_override_prt_cas_quests_16_1_flower_flower_large_shin_14d30c: "花！是花！大而闪亮的珠宝在宫殿里太常见了。"
  npc_override_prt_cas_quests_16_1_flower_grunts_darkness_s_b1324d: "花……？~哼~黑暗应该稳定……"
  npc_override_prt_cas_quests_16_1_flower_isn_t_enough_calm_900574: "这朵花不足以平息黑暗。多带些来……！"
  npc_override_prt_cas_quests_16_1_flower_you_just_gave_wit_935e54: "- 你刚才给的花已经枯萎了。-"
  npc_override_prt_cas_quests_16_1_flowers_representing_wor_095835: "代表世界的花不仅能平息黑暗，还能带来心灵的平静。"
  npc_override_prt_cas_quests_16_1_food_banquet_perfect_bba18a: "宴会的食物完美无缺！"
  npc_override_prt_cas_quests_16_1_food_delicious_as_well_10c460: "食物也很美味！"
  npc_override_prt_cas_quests_16_1_forget_everything_let_s_b7e370: "忘掉一切，我们出去——"
  npc_override_prt_cas_quests_16_1_former_former_head_famil_7ca0c8: "前任和前任家主……哦！澄清一下，他退休了，但没有死。"
  npc_override_prt_cas_quests_16_1_former_head_family_archd_408a57: "这是前任家主，格兰茨大公，我的父亲。"
  npc_override_prt_cas_quests_16_1_former_heads_richard_fam_22b183: "理查德家族的前任家主们在训练后也得到了充分的休息。嗯，这太常见了，不值一提。"
  npc_override_prt_cas_quests_16_1_fortunately_rune_midgart_3fcc10: "幸运的是，卢恩-米德加尔特由七大王族支撑。"
  npc_override_prt_cas_quests_16_1_fortunately_third_child_9d83f4: "幸运的是，以前那个淘气的三儿子已经成长为配得上维格纳之名的人了。"
  npc_override_prt_cas_quests_16_1_frankly_makes_me_feel_un_bf9c34: "坦白说，把她一个人留下让我感到不安。"
  npc_override_prt_cas_quests_16_1_fried_chicken_baked_pota_34729d: "炸鸡、烤土豆、啤酒、新鲜奶酪……哈……被关在这种地方，我现在 crave 那些普通的菜肴。"
  npc_override_prt_cas_quests_16_1_friend_mine_said_he_saw_88b95d: "我的一个朋友说他看到地下城的怪物在外面世界游荡。"
  npc_override_prt_cas_quests_16_1_frietz_how_did_go_995010: "弗里茨，进展如何？"
  npc_override_prt_cas_quests_16_1_front_guest_0b93d0: "在客人面前。"
  npc_override_prt_cas_quests_16_1_front_prontera_smelter_994e47: "在普隆德拉冶炼厂前"
  npc_override_prt_cas_quests_16_1_fun_55f6dd: "很有趣！"
  npc_override_prt_cas_quests_16_1_fun_story_587186: "有趣的故事？"
  npc_override_prt_cas_quests_16_1_fun_too_8557a9: "那也会很有趣。"
  npc_override_prt_cas_quests_16_1_gap_connected_force_disa_2e4fda: "强行连接的缝隙在完成使命后消失了。"
  npc_override_prt_cas_quests_16_1_gap_might_invisible_stil_8c79fb: "缝隙可能是看不见的，但它仍然是一道裂缝。"
  npc_override_prt_cas_quests_16_1_gasps_d_se_sector_d_806327: "~倒吸一口凉气~ D……Se……区……D……？！~吞咽~"
  npc_override_prt_cas_quests_16_1_gate_place_where_ritual_95d4f7: "通往仪式举行地点的大门尚未正式激活。"
  npc_override_prt_cas_quests_16_1_geoborg_been_silent_as_w_d289ef: "听说吉奥博格从那以后也一直保持沉默。"
  npc_override_prt_cas_quests_16_1_geoborg_family_cursed_65f8a9: "吉奥博格家族被诅咒了吗？"
  npc_override_prt_cas_quests_16_1_get_her_out_here_86aada: "把她弄出去！"
  npc_override_prt_cas_quests_16_1_get_me_out_here_ff2ea2: "带我离开这里。"
  npc_override_prt_cas_quests_16_1_get_out_here_now_252e30: "现在离开这里。"
