  npc_override_prt_cas_quests_16_1_what_weird_difficult_nam_46d434: "{0} 多么奇怪又难发音的名字！我想叫你的名字，但我不认为我能。"
  npc_override_prt_cas_quests_16_1_what_why_did_he_give_a6cf99: "什么事？他为什么给我这个？是发票吗？我做错了什么吗？"
  npc_override_prt_cas_quests_16_1_what_world_they_taking_s_679eb6: "他们到底在磨蹭什么？服务又慢又差……我知道作为骑士要有礼貌，所以我不能挑起争端。好吧。拿这个小费。"
