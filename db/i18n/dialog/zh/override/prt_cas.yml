Body:
  npc_override_prt_cas_brisingamen_seal_age_1ccdbd: "22岁……"
  npc_override_prt_cas_brisingamen_seal_became_fugitive_b81f88: "成了逃犯？"
  npc_override_prt_cas_brisingamen_seal_despite_severity_offense_3fcae1: "^663300尽管罪行严重，她仅被开除出十字军，并被强制剥夺所赐予的神圣之力……^000000"
  npc_override_prt_cas_brisingamen_seal_did_they_want_sentence_h_eb07ae: "他们想判她死刑吗？那未免太残忍了。她一定受尽了屈辱……"
  npc_override_prt_cas_brisingamen_seal_disgrace_crusaders_77fd73: "十字军的耻辱？"
  npc_override_prt_cas_brisingamen_seal_don_t_touch_anything_fc497b: "别碰任何东西！"
  npc_override_prt_cas_brisingamen_seal_female_856c8a: "女性……"
  npc_override_prt_cas_brisingamen_seal_finish_reading_12a58c: "读完为止！)"
  npc_override_prt_cas_brisingamen_seal_get_hell_a60d84: "快滚"
  npc_override_prt_cas_brisingamen_seal_here_bottom_1f745f: "在最下面？"
  npc_override_prt_cas_brisingamen_seal_highly_classified_offici_80ae54: "属于高度机密。官方记录中，洛温·艾伦宁死于任务期间。^000000"
  npc_override_prt_cas_brisingamen_seal_however_information_891cb5: "^663300然而，这份情报"
  npc_override_prt_cas_brisingamen_seal_huh_a78e67: "嗯……？"
  npc_override_prt_cas_brisingamen_seal_i_didn_t_get_bddc7e: "我没找到"
  npc_override_prt_cas_brisingamen_seal_i_left_off_e53dd7: "我上次读到的地方……"
  npc_override_prt_cas_brisingamen_seal_i_should_read_9e4d1c: "我应该读这个"
  npc_override_prt_cas_brisingamen_seal_information_4ff8d5: "情报，那个"
  npc_override_prt_cas_brisingamen_seal_isn_t_same_a8da37: "这不是同一个"
  npc_override_prt_cas_brisingamen_seal_librarian_told_me_42de2e: "图书管理员告诉我的！"
  npc_override_prt_cas_brisingamen_seal_lowen_ellenen_aad6e1: "洛温·艾伦宁。^000000"
  npc_override_prt_cas_brisingamen_seal_lowen_ellenen_eb196a: "洛温·艾伦宁……"
  npc_override_prt_cas_brisingamen_seal_lowen_nd_squad_returned_837391: "^663300第二小队的洛温，在事件发生后第三天返回了她的分队。经过审判，她因接到战斗命令后临阵脱逃而被判有罪。^000000"
  npc_override_prt_cas_brisingamen_seal_member_17b59a: "成员"
  npc_override_prt_cas_brisingamen_seal_msg_61ce5a: "[{0}]"
  npc_override_prt_cas_brisingamen_seal_nd_squad_9592c0: "第二小队……"
  npc_override_prt_cas_brisingamen_seal_no_wonder_librarian_585229: "难怪图书管理员"
  npc_override_prt_cas_brisingamen_seal_now_let_s_see_a88fef: "现在让我看看……"
  npc_override_prt_cas_brisingamen_seal_nuts_db5721: "(可恶……！"
  npc_override_prt_cas_brisingamen_seal_out_here_21dc4d: "离开这里！"
  npc_override_prt_cas_brisingamen_seal_point_where_4dbeca: "从……的地方"
  npc_override_prt_cas_brisingamen_seal_saying_anything_huh_e13346: "说什么。哼。"
  npc_override_prt_cas_brisingamen_seal_seemed_hesitate_before_27ee53: "似乎在犹豫之前"
  npc_override_prt_cas_brisingamen_seal_she_forced_leave_crusade_707a88: "她被迫离开十字军？！太荒谬了！"
  npc_override_prt_cas_brisingamen_seal_should_i_try_meet_her_c85ce2: "我应该试着再见她一面吗？"
  npc_override_prt_cas_brisingamen_seal_some_effects_belonging_e49b65: "以及一些属于"
  npc_override_prt_cas_brisingamen_seal_some_kind_secret_7d6828: "某种秘密？"
  npc_override_prt_cas_brisingamen_seal_sounds_pretty_messy_e3ea62: "听起来相当混乱。"
  npc_override_prt_cas_brisingamen_seal_they_thought_she_brought_6337f8: "他们认为是她带来了"
  npc_override_prt_cas_brisingamen_seal_what_ce3d72: "什么……？"
  npc_override_prt_cas_brisingamen_seal_what_s_mark_f96458: "这个标记是什么"
  npc_override_prt_cas_brisingamen_seal_what_you_doing_99d1c5: "你在做什么？"
  npc_override_prt_cas_brisingamen_seal_what_you_doing_here_74351b: "你在这里做什么？"
  npc_override_prt_cas_brisingamen_seal_who_you_2d876b: "你是谁！"
  npc_override_prt_cas_brisingamen_seal_yawn_276bfa: "^666666*哈欠……*^000000"
  npc_override_prt_cas_brisingamen_seal_years_later_after_incide_6f2911: "^663300事件发生两年后，一支探险队发现了生锈的铠甲碎片、一把断裂的剑"
  npc_override_prt_cas_brisingamen_seal_you_took_book_shelf_whil_3fc13d: "^3355FF你趁图书管理员打盹时从书架上取走了这本书。根据十字军人事记录，只有一名新兵名叫洛温·艾伦宁。"
  npc_override_prt_cas_prontera_go_back_nillem_2146c4: "回到尼勒姆那里。"
  npc_override_prt_cas_prontera_if_you_invited_severnt_s_075097: "如果你是受邀的，应该有仆人在那里迎接你。请按正式流程引导。"
  npc_override_prt_cas_prontera_let_s_first_reply_servan_1266d5: "我们先回复仆人，表示接受邀请。"
  npc_override_prt_cas_prontera_locked_e389af: "门锁着。"
  npc_override_prt_cas_prontera_there_more_find_out_598afb: "还有更多需要了解。"
  npc_override_prt_cas_prontera_way_royal_villa_vips_out_b2d48e: "那边是贵宾专用的皇家别墅。外人不得进入。"
  npc_override_prt_cas_prontera_you_cannot_go_way_5a9606: "你不能往那边走。"
  npc_override_prt_cas_prontera_you_shouldn_t_enter_plac_f7b01d: "你不该那样进入这个地方。"
  npc_override_prt_cas_quests_16_1_aaarrgghh_ad9eed: "啊啊啊——！！"
  npc_override_prt_cas_quests_16_1_aaarrgghhh_87d662: "啊啊啊啊——！！"
  npc_override_prt_cas_quests_16_1_aarghh_darkness_about_st_cd0566: "啊啊啊！！黑暗即将肆虐！"
  npc_override_prt_cas_quests_16_1_about_6351fe: "就是这样。"
  npc_override_prt_cas_quests_16_1_about_confinement_ok_as_771dbe: "关于禁闭，只要待在皇家别墅的西翼就没问题……"
  npc_override_prt_cas_quests_16_1_about_disappeared_terra_6a570e: "关于消失的^4d4dff泰拉·格洛丽亚^000000"
  npc_override_prt_cas_quests_16_1_about_star_blessing_they_c25496: "关于祝福之星……他们说……"
  npc_override_prt_cas_quests_16_1_about_what_our_children_fb2201: "是关于我们的孩子问你的事吗？"
  npc_override_prt_cas_quests_16_1_about_wolf_6e608c: "是关于沃尔夫的事吗？"
  npc_override_prt_cas_quests_16_1_accept_quest_before_you_f53b76: "在接受任务之前，先自定义设置。"
  npc_override_prt_cas_quests_16_1_accidents_happen_when_yo_c94f38: "疏忽大意就会出事。务必时刻保持警惕。"
  npc_override_prt_cas_quests_16_1_actually_they_alive_just_fd785f: "实际上，他们在被发现之前还活着。但救援延误了，他们不得不痛苦地死去。"
  npc_override_prt_cas_quests_16_1_actually_what_they_need_5eff52: "但实际上他们需要的是教育，而非温暖的心。"
  npc_override_prt_cas_quests_16_1_adds_some_sparkles_dish_69a8a5: "它为这道菜增添了一些光彩。"
  npc_override_prt_cas_quests_16_1_adventurer_helped_us_i_g_63b27e: "那位冒险者帮助了我们。我想那是我们关系最亲密的时候。看看这个。"
  npc_override_prt_cas_quests_16_1_adventurer_how_did_your_1baa95: "冒险者，你在艾尔贝塔与守护骑士的会面如何？倒不是说我期望太高……"
  npc_override_prt_cas_quests_16_1_adventurer_i_guess_you_n_280807: "冒险者？我想你现在需要更加努力才行。"
  npc_override_prt_cas_quests_16_1_adventurer_what_brought_9f437a: "冒险者？是什么风把你吹到这里来的？"
  npc_override_prt_cas_quests_16_1_adventurer_you_back_how_68bc61: "冒险者，你回来了。进展如何？"
  npc_override_prt_cas_quests_16_1_after_collecting_all_hon_222113: "收集完所有荣誉徽章后，我要在海边建一座城堡，和那个固执的阿尔纳共度余生。"
  npc_override_prt_cas_quests_16_1_after_coming_home_myer_d_1d9c48: "回家后，迈尔一度表现不错。但他留下一张纸条就离开了。只有阿格涅斯一直健康成长，毫无问题。"
  npc_override_prt_cas_quests_16_1_after_consulting_my_moth_627277: "与母亲商量后，我决定在这里工作，假装自己是我的姐姐。由于大家都很忙，没人注意到我安静地在这个角落工作。"
  npc_override_prt_cas_quests_16_1_after_discussion_our_fam_fca5de: "经过讨论，我们家族决定不参加这次的^0000cd皇家议会^000000。"
  npc_override_prt_cas_quests_16_1_after_long_sleep_i_am_1a38a2: "在漫长的沉睡之后，我在如此混乱之前被唤醒了。"
  npc_override_prt_cas_quests_16_1_after_long_time_i_heard_e3a13d: "很久之后，我听到了关于伊森纳姆因暴力行为而被杀的传闻。"
  npc_override_prt_cas_quests_16_1_after_removing_all_those_9512f7: "不是这个，不是那个……把这些都去掉后，贵族们除了文书工作和社交之外，所剩无几。"
  npc_override_prt_cas_quests_16_1_after_royal_assembly_ove_ff3f28: "皇家议会结束后，女王可能会将王位传给新国王，然后前往猩红城堡。"
  npc_override_prt_cas_quests_16_1_again_i_really_hoped_he_65aad4: "又……我真的希望到今天他已经放弃了……看来这只是徒劳的希望。"
  npc_override_prt_cas_quests_16_1_agnes_don_t_say_appropri_51784b: "阿格涅斯，别这么说。这不合适。我们正在向冒险者讲述罗根堡的故事……"
  npc_override_prt_cas_quests_16_1_agnes_our_favored_child_8471ce: "阿格涅斯是我们家族最受宠爱的孩子。她是唯一的小妹妹。"
  npc_override_prt_cas_quests_16_1_agnes_right_both_you_ple_64ffd8: "阿格涅斯说得对。你们两个，请别吵了。"
  npc_override_prt_cas_quests_16_1_ah_971301: "啊……"
  npc_override_prt_cas_quests_16_1_ah_a2d82f: "啊，是……"
  npc_override_prt_cas_quests_16_1_ah_anyway_i_am_sorry_810fa8: "啊，总之，很抱歉让你看到了不愉快的家庭事务。"
  npc_override_prt_cas_quests_16_1_ah_b9cc35: "啊……！"
  npc_override_prt_cas_quests_16_1_ah_he_also_said_he_5b48e7: "啊，他还说宴会结束后会过来。"
  npc_override_prt_cas_quests_16_1_ah_how_i_fit_pearl_429a35: "啊，我该如何搭配这条珍珠项链，和舞伴一起看起来漂亮呢？"
  npc_override_prt_cas_quests_16_1_ah_i_am_sorry_talk_1fba61: "啊，抱歉说了这么多我们家的事。我年纪大了，变得爱唠叨了。"
  npc_override_prt_cas_quests_16_1_ah_i_am_sorry_you_35d540: "啊，很抱歉让你看到了"
  npc_override_prt_cas_quests_16_1_ah_i_i_had_some_f53e1d: "啊，是吗？我得去打听一些传闻。"
  npc_override_prt_cas_quests_16_1_ah_i_know_story_all_01706b: "啊！我知道那个故事！我们都知道！"
  npc_override_prt_cas_quests_16_1_ah_i_m_sorry_i_f7fcf7: "啊，对不起。我突然生气了。"
  npc_override_prt_cas_quests_16_1_ah_i_need_handkerchief_t_c9a76d: "啊，我需要一条手帕。要做的事情太多了，我忙得不可开交。"
  npc_override_prt_cas_quests_16_1_ah_i_see_df4b54: "啊，我明白了。"
  npc_override_prt_cas_quests_16_1_ah_i_wish_she_here_efad62: "啊，我多希望她在这里！"
  npc_override_prt_cas_quests_16_1_ah_myer_brother_brother_a140be: "啊，迈尔，哥哥！哥哥！"
  npc_override_prt_cas_quests_16_1_ah_no_if_you_feel_f9c72a: "啊，不，不是。如果你觉得不舒服，我很抱歉。我只是没有可以信赖的人。"
  npc_override_prt_cas_quests_16_1_ah_sector_h_bursts_into_2110c2: "啊，H区！~爆发出笑声~他还是个爱抱怨的人吗？"
  npc_override_prt_cas_quests_16_1_ah_sorry_i_couldn_t_705d77: "啊，抱歉，我已经好几天没打理自己了。"
  npc_override_prt_cas_quests_16_1_ah_talk_then_17647c: "啊。那就聊聊吧。"
  npc_override_prt_cas_quests_16_1_ah_there_he_comes_jonath_5609ee: "啊，他来了！乔纳森！我们有客人。"
  npc_override_prt_cas_quests_16_1_ah_you_dear_adventurer_p_b117cf: "啊，原来是你，亲爱的冒险者。请原谅我。"
  npc_override_prt_cas_quests_16_1_ahem_anyways_all_been_pr_59eeae: "嗯哼。总之，一切都已准备就绪。"
  npc_override_prt_cas_quests_16_1_all_adventurers_count_th_b5f4ad: "所有冒险者都靠直觉行事吗？这很危险。凭直觉行事可不是什么好事。"
  npc_override_prt_cas_quests_16_1_all_been_prepared_howeve_aadd24: "一切都已经准备好了……不过，详情我稍后再告诉你。"
  npc_override_prt_cas_quests_16_1_all_calls_available_addi_09b567: "所有服务均可使用，但每项服务可能会收取额外费用。"
  npc_override_prt_cas_quests_16_1_all_cutting_delivery_wor_22b948: "所有的切割和送货工作会把我累垮的。"
  npc_override_prt_cas_quests_16_1_all_gorgeous_pieces_furn_61f9d0: "所有华丽的家具和地毯……我从未见过像那里那样洁白而巨大的虎皮。"
  npc_override_prt_cas_quests_16_1_all_hp_sp_recovered_bd6eb2: "^4d4dff所有 HP 和 SP 已恢复！"
  npc_override_prt_cas_quests_16_1_all_i_been_enjoying_conv_2844a5: "一点也不。我一直很享受这次谈话。"
  npc_override_prt_cas_quests_16_1_all_jurgen_seemed_grown_faaf1b: "一点也不。尤尔根似乎自从我上次拜访后成长了不少。"
  npc_override_prt_cas_quests_16_1_all_let_us_give_you_a0cbf8: "一点也不。下次我们会给你正式的邀请函。"
  npc_override_prt_cas_quests_16_1_all_my_son_supposed_lear_e69cfd: "一点也不。我儿子应该向你聪明的孙子学习。哈哈。"
  npc_override_prt_cas_quests_16_1_all_nobility_who_charge_5bac09: "所有负责卢恩-米德加尔特市场的贵族都在这里。我们，猫爪服务社，不应该错过这个机会。"
  npc_override_prt_cas_quests_16_1_all_please_come_nonsense_4d8ca6: "一点也不。请进。因为里面有人就不能打扫房间，这太荒谬了。"
  npc_override_prt_cas_quests_16_1_all_quests_related_under_1b5479: "所有与地下城相关的任务将被重置。"
  npc_override_prt_cas_quests_16_1_all_staff_i_trust_doing_3c2d8b: "所有我信任的员工都在做其他工作，除了你我没有别人可以拜托了。"
  npc_override_prt_cas_quests_16_1_all_theses_things_thanks_96253b: "这一切都要感谢你。现在每个人都各就各位，为家族和国家努力工作，我感到安心了。"
  npc_override_prt_cas_quests_16_1_all_they_sort_out_puppet_fc6a37: "……他们所能做的就是把潜入宫殿的傀儡清理出去。"
  npc_override_prt_cas_quests_16_1_all_we_give_you_now_35f78c: "目前这就是我们所能给你的奖励了。"
  npc_override_prt_cas_quests_16_1_all_women_i_seen_so_8ed23c: "迄今为止我见过的所有女人都像温室里的花朵。然而，她更像田野里的野花。"
  npc_override_prt_cas_quests_16_1_all_you_helmut_wolf_myer_3fc1f2: "你们所有人，赫尔穆特、沃尔夫和迈尔。"
  npc_override_prt_cas_quests_16_1_all_your_own_good_1ed21e: "这都是为了你好！"
  npc_override_prt_cas_quests_16_1_almost_impossible_meet_t_66dcf0: "通常几乎不可能见到他们。你能正式拜访他们，是多么难得的机会啊。"
  npc_override_prt_cas_quests_16_1_already_happened_we_need_74830c: "已经发生了。我们需要为未来做准备。"
  npc_override_prt_cas_quests_16_1_already_time_hear_news_o_aafc20: "已经到了听老朋友消息的时候了吗？"
  npc_override_prt_cas_quests_16_1_alright_then_what_should_147e7e: "好吧，那么！我们应该先聊什么？"
  npc_override_prt_cas_quests_16_1_alright_whatever_i_ll_le_352f41: "好吧，随便。这次我就告诉你。"
  npc_override_prt_cas_quests_16_1_also_impossible_meet_ern_2d2f39: "而且，也不可能见到^0000cd恩斯特·吉奥博格^000000。"
  npc_override_prt_cas_quests_16_1_also_only_rumor_i_am_bf522e: "这也只是传闻。我确信这是真的。总之，我听说他们被谋杀了，"
  npc_override_prt_cas_quests_16_1_also_south_east_central_b3c45b: "还有，在中央喷泉的东南方向，"
  npc_override_prt_cas_quests_16_1_also_story_guardian_knig_218fae: "还有那个背叛主人的守护骑士的故事……"
  npc_override_prt_cas_quests_16_1_although_adventurers_may_d432b1: "虽然冒险者可能不太关心宫廷事务，但理查德家族掌管着卢恩-米德加尔特的军力。"
  npc_override_prt_cas_quests_16_1_although_banquet_held_qu_d6eeab: "虽然宴会会持续相当长一段时间，但不要太久才到。"
  npc_override_prt_cas_quests_16_1_although_i_feel_reluctan_f5bb4a: "虽然我不太愿意向你透露王室 somewhat 尴尬的一面，"
  npc_override_prt_cas_quests_16_1_although_i_may_look_like_a091d3: "虽然我现在看起来是这样，但我以前在外面被称为拥有负之手的人。那是相当危险的东西。你最好离远点。"
  npc_override_prt_cas_quests_16_1_although_shedhar_current_98f907: "虽然现任家主谢德哈尔不在这里，但斯皮卡掌握着实权。"
  npc_override_prt_cas_quests_16_1_although_there_direct_ga_7fe943: "虽然宫殿里安装了直接通道以方便通行，"
  npc_override_prt_cas_quests_16_1_although_there_document_298747: "虽然有一份文件记载，某十字军丢失了包含指控和判决的文件……"
  npc_override_prt_cas_quests_16_1_although_us_walther_fami_92230a: "虽然我们沃尔特家族没有参加皇家议会，但我们不会坐视这件事不管！"
  npc_override_prt_cas_quests_16_1_although_walther_family_1c83c6: "虽然^0000cd沃尔特家族不参加皇家议会^000000，但我们作为七大王族之一参加宴会。"
  npc_override_prt_cas_quests_16_1_although_we_going_discus_ce5cd4: "虽然我们将在正式会议上讨论此事，但我认为结果不会有太大不同。"
  npc_override_prt_cas_quests_16_1_always_great_joy_listen_e12b66: "倾听那些经历过许多风雨的人的故事，总是令人愉悦的。"
  npc_override_prt_cas_quests_16_1_always_my_pleasure_atten_54b0ef: "参加宴会总是我的荣幸。旅行和了解不同文化总是有趣的。有美妙的音乐和美味的食物就更好了。"
  npc_override_prt_cas_quests_16_1_always_tiring_attend_ban_6cf86c: "参加宴会总是很累。我旅途劳顿，还要与人们交际……真是太痛苦了……呼……"
  npc_override_prt_cas_quests_16_1_am_i_bad_actress_0d71a5: "我是个糟糕的演员吗？"
  npc_override_prt_cas_quests_16_1_am_i_because_those_eyes_6a51f7: "是吗？因为那双眼睛看起来如此美丽。"
  npc_override_prt_cas_quests_16_1_am_i_drunk_e1c355: "……我醉了吗？"
  npc_override_prt_cas_quests_16_1_am_i_going_killed_now_a57afb: "我现在就要被杀了吗？"
  npc_override_prt_cas_quests_16_1_am_i_suspect_here_d81e9a: "我是这里的嫌疑人吗？"
  npc_override_prt_cas_quests_16_1_am_i_too_late_96a9dc: "我来晚了吗？"
  npc_override_prt_cas_quests_16_1_among_three_us_must_been_b77fdb: "我们三人中，一定是我妹妹最难熬。"
  npc_override_prt_cas_quests_16_1_and_f0fa6b: "而且……"
  npc_override_prt_cas_quests_16_1_anyone_such_power_c0a170: "不是任何人都能拥有这样的力量。"
  npc_override_prt_cas_quests_16_1_anyone_without_credentia_128d48: "没有凭证的人听不到好故事。回去吧。"
  npc_override_prt_cas_quests_16_1_anything_else_give_me_d6332a: "还有什么要给我的吗？"
  npc_override_prt_cas_quests_16_1_anything_happened_there_69e3f3: "那里发生了什么事吗？"
  npc_override_prt_cas_quests_16_1_anything_happened_you_f58d1f: "你发生了什么事吗？"
  npc_override_prt_cas_quests_16_1_anytime_you_want_1acb3b: "随时都可以。"
  npc_override_prt_cas_quests_16_1_anyway_he_means_well_c87236: "总之，他出于好意。"
  npc_override_prt_cas_quests_16_1_anyway_house_goes_well_w_05c0b2: "总之，这个家没有我也运转良好。我不担心家族，但我只担心我的祖父，因为他年纪很大了。"
  npc_override_prt_cas_quests_16_1_anyway_i_am_sorry_i_e6dd22: "总之，很抱歉我帮不上你的忙。"
  npc_override_prt_cas_quests_16_1_anyway_i_am_sorry_put_99e24b: "总之，很抱歉今天又让你陷入困难的处境。"
  npc_override_prt_cas_quests_16_1_anyway_i_think_i_visit_b8a4f5: "总之，我想我得回家一趟。家里一直很烦人，但我想那会很有趣。请告诉我的家人，我在工作的同时会帮助他们。"
  npc_override_prt_cas_quests_16_1_anyway_i_think_we_make_173c86: "总之，我想我们必须认真准备迎接他。"
  npc_override_prt_cas_quests_16_1_anyway_let_s_wait_see_b8b360: "总之，让我们拭目以待，因为他们正在尝试像成年人一样思考。"
  npc_override_prt_cas_quests_16_1_anyway_life_short_what_m_2b4ec3: "总之人生短暂。打动人心的是真心，而非金钱或权力。"
  npc_override_prt_cas_quests_16_1_anyway_relief_hear_he_ha_d4aa8e: "总之，听说他在那里没有惹麻烦，我就放心了。"
  npc_override_prt_cas_quests_16_1_anyway_there_no_document_80a4d9: "总之，没有关于他们的文件留下——关于他们被指控的罪名或确认的判决。"
  npc_override_prt_cas_quests_16_1_anyway_who_we_need_worry_6f61cd: "总之，我们需要担心的是我们的妹妹。她有没有生过我们的气？她生气时我们该怎么办？"
  npc_override_prt_cas_quests_16_1_anyways_i_am_filling_spi_a8dbf3: "总之，我现在代替斯皮卡，她出去办事了。"
  npc_override_prt_cas_quests_16_1_anyways_i_found_shabby_m_479ba8: "总之，我在那里的市场上发现一个看起来毫无防备的寒酸男人。他的钱包很鼓。所以我拿了钱包就跑了。"
  npc_override_prt_cas_quests_16_1_anyways_i_guess_we_warn_c8e512: "……总之，我想我们得警告长辈们这件事。"
  npc_override_prt_cas_quests_16_1_anyways_if_you_need_help_264183: "总之，如果你需要帮助，请随时告诉我。"
  npc_override_prt_cas_quests_16_1_anyways_isaac_seems_busy_ec665e: "总之，艾萨克最近似乎忙着做什么。你知道他在做什么吗？"
  npc_override_prt_cas_quests_16_1_anyways_my_profession_re_18d2b7: "总之，我的职业要求我一眼就能抓住任何重要的东西。这就是我在这个领域立足的方式。"
  npc_override_prt_cas_quests_16_1_anyways_sure_seems_suspi_74cdcc: "总之，确实很可疑。谢谢你的情报。"
  npc_override_prt_cas_quests_16_1_anyways_we_invited_honor_b9776f: "总之，多亏了奥林特，我们才能被邀请到这个尊贵的地方。"
  npc_override_prt_cas_quests_16_1_anyways_we_managed_find_c78197: "总之，我们好不容易找到了这个没有太多人的餐厅。但我们很快就得回去了。"
  npc_override_prt_cas_quests_16_1_anyways_what_i_want_say_ab82e3: "总之，我想说的是"
  npc_override_prt_cas_quests_16_1_apart_well_i_am_supposed_2a330b: "除此之外，嗯，我不应该对这种事好奇……"
  npc_override_prt_cas_quests_16_1_apologies_making_you_unc_a711c3: "抱歉让你感到不舒服。再次抱歉，但你能帮我一个忙吗？"
  npc_override_prt_cas_quests_16_1_approach_closer_a30922: "靠近一点。"
  npc_override_prt_cas_quests_16_1_appropriate_talk_about_f_7ffdb5: "在客人面前谈论家族事务是不合适的。"
  npc_override_prt_cas_quests_16_1_archduke_been_waiting_yo_2e4e75: "大公一直在等你。"
  npc_override_prt_cas_quests_16_1_archduke_grantz_been_wai_c25176: "格兰茨大公已经等你很久了。"
  npc_override_prt_cas_quests_16_1_archduke_please_don_t_to_338261: "……大公，请不要太苛责尼希尔。"
  npc_override_prt_cas_quests_16_1_aren_t_they_nerius_siste_af1b5b: "她们不是那个由女性领导的著名家族——纳里乌斯姐妹吗？"
  npc_override_prt_cas_quests_16_1_aren_t_we_heading_out_0e7aba: "我们不是要出发了吗？"
  npc_override_prt_cas_quests_16_1_aren_t_you_adventurer_wh_023d99: "你不就是在维格纳宅邸的那个冒险者吗？"
  npc_override_prt_cas_quests_16_1_aren_t_you_curious_43accf: "你不好奇吗？"
  npc_override_prt_cas_quests_16_1_aren_t_you_following_him_3f1678: "……你不是在跟踪他吗？"
  npc_override_prt_cas_quests_16_1_aren_t_you_going_execute_ccf23c: "你不打算处决我吗？"
  npc_override_prt_cas_quests_16_1_aren_t_you_one_who_b736ad: "你不就是之前潜入那个房间的人吗？你不用遮着脸跑！回来！"
  npc_override_prt_cas_quests_16_1_argh_43ffb4: "啊！"
  npc_override_prt_cas_quests_16_1_argh_658e94: "啊……"
  npc_override_prt_cas_quests_16_1_argh_again_i_am_terrifie_3aeb03: "啊！又来了！我好害怕！"
  npc_override_prt_cas_quests_16_1_argh_again_i_am_terrifie_8f2339: "啊！又来了！我好害怕！但只要我被锁在这里，我就是安全的。"
  npc_override_prt_cas_quests_16_1_argh_how_dare_3f4565: "啊……竟敢……！"
  npc_override_prt_cas_quests_16_1_argh_i_never_been_place_d7fdfa: "啊……我从未到过这种地方……"
  npc_override_prt_cas_quests_16_1_argh_jurgen_my_prince_2f0ea0: "啊！尤尔根，我的王子！"
  npc_override_prt_cas_quests_16_1_argh_my_arms_there_anyon_cba8bb: "啊……我的胳膊……房间里还有其他人吗？"
  npc_override_prt_cas_quests_16_1_argh_those_undead_bastar_6bbfce: "啊……那些不死族的混蛋……我要把他们全部杀光……"
  npc_override_prt_cas_quests_16_1_argh_those_undead_e8a263: "啊……那些不死族……"
  npc_override_prt_cas_quests_16_1_argh_undead_bring_965397: "啊！不死族！放马过来！"
  npc_override_prt_cas_quests_16_1_argh_what_waste_be8d2b: "啊，真是浪费。"
  npc_override_prt_cas_quests_16_1_argh_why_she_upset_9a8803: "啊！她为什么生气了？"
  npc_override_prt_cas_quests_16_1_arghhhh_a17c9c: "啊啊啊！"
  npc_override_prt_cas_quests_16_1_arghhhhh_123454: "啊啊啊啊！"
  npc_override_prt_cas_quests_16_1_arghhhhhhhhh_9858e3: "啊啊啊啊啊啊！"
  npc_override_prt_cas_quests_16_1_aristocrats_never_let_me_e8462d: "贵族们从不让我处理一些大好机会。不过，你可能已经获得了一些<荣誉徽章>，对吧？"
  npc_override_prt_cas_quests_16_1_around_time_when_i_holdi_cb6419: "那是我称霸世界的时候。我正带着追随者们征服一座人类城镇。"
  npc_override_prt_cas_quests_16_1_arrow_through_wind_b67233: "穿风箭 {0}。"
  npc_override_prt_cas_quests_16_1_as_always_0108ca: "……一如既往。"
  npc_override_prt_cas_quests_16_1_as_each_dish_best_moment_c0907f: "正如每道菜都有其最佳品尝时刻，每个人也有最适合下厨的时机！"
  npc_override_prt_cas_quests_16_1_as_far_as_i_know_a62e01: "据我所知，应该已经到了最后阶段。"
  npc_override_prt_cas_quests_16_1_as_i_told_you_before_49db0b: "正如我之前告诉你的，你可以通过击杀美杜莎获得海之石。"
  npc_override_prt_cas_quests_16_1_as_i_told_you_before_cac3f3: "正如我之前所说。这些天我没怎么吃饭。请原谅我的失礼。你拿到我要的东西了吗？"
  npc_override_prt_cas_quests_16_1_as_i_told_you_difficult_87cdc1: "正如我所说，重置徽章很困难，^ff0000成功率是80%。^000000如果失败，一切都将消失。你要重置吗？"
  npc_override_prt_cas_quests_16_1_as_known_richard_family_2009ee: "众所周知，理查德家族培养出了杰出的战士。我们运行着系统的训练体系来支持这一点。"
  npc_override_prt_cas_quests_16_1_as_lady_house_i_make_53f60d: "作为这个家的女主人，我会让你的住宿尽可能舒适。"
  npc_override_prt_cas_quests_16_1_as_long_as_place_crack_14b09d: "只要是从维度裂缝的地方来的，"
  npc_override_prt_cas_quests_16_1_as_member_wigner_family_8ce650: "作为维格纳家族的一员，必须能够应对批评。"
  npc_override_prt_cas_quests_16_1_as_myer_said_i_am_e64a28: "正如迈尔所说，我正在寻找其他方法，而且我会找到的。"
  npc_override_prt_cas_quests_16_1_as_scrub_sponge_i_am_e4882d: "作为一块清洁海绵，我非常满足。"
  npc_override_prt_cas_quests_16_1_as_secret_royal_family_r_d0fba9: "随着王室秘密的揭露，我们将得到拼图缺失的部分。"
  npc_override_prt_cas_quests_16_1_as_soon_as_royal_assembl_f4ac12: "皇家议会一结束，我们就着手进行最后的仪式……"
  npc_override_prt_cas_quests_16_1_as_we_expected_peter_see_a86d73: "正如我们所料，彼得似乎是个强有力的候选人。"
  npc_override_prt_cas_quests_16_1_as_well_so_make_sure_aab9d6: "也一样，所以请务必四处看看。"
  npc_override_prt_cas_quests_16_1_as_you_know_geoborg_fami_90b921: "如你所知，吉奥博格家族是……的后裔"
  npc_override_prt_cas_quests_16_1_as_you_know_sailors_gent_0eeedb: "如你所知，水手们可不是一群温和的人，我们倾向于随身携带钱财，所以经常受到威胁。我们都必须带着守护骑士。"
  npc_override_prt_cas_quests_16_1_as_you_know_such_as_8f49c1: "如你所知，这种事会引发另一种痛苦。我们从小没有父母。但我们没有堕落，因为我们有家庭，而且我们很富有。"
  npc_override_prt_cas_quests_16_1_as_you_said_my_brother_f530a5: "正如你所说，我哥哥的守护骑士一定没有背叛我哥哥。"
  npc_override_prt_cas_quests_16_1_as_you_see_there_lot_2ecebb: "如你所见，有很多易碎的东西。"
  npc_override_prt_cas_quests_16_1_as_you_see_there_no_ff3da5: "如你所见，没有其他家族住宅门口有守卫看守。"
  npc_override_prt_cas_quests_16_1_as_you_see_we_t_188114: "但是，如你所见，我们甚至找不到时间修理任何东西。"
  npc_override_prt_cas_quests_16_1_as_you_tell_against_law_582c3f: "如你所知，这是违法的。所以我以前只通过私人联系工作。然而，有个家伙在重置强化时装备坏了，他告发了我。"
  npc_override_prt_cas_quests_16_1_as_you_wish_c8890a: "如你所愿！"
  npc_override_prt_cas_quests_16_1_ask_about_geoborg_family_1ba9aa: "询问吉奥博格家族的事。"
  npc_override_prt_cas_quests_16_1_ask_about_situation_793f5c: "询问情况。"
  npc_override_prt_cas_quests_16_1_ask_if_he_s_fellow_54c373: "问他是不是243AD265的同伴。"
  npc_override_prt_cas_quests_16_1_assembly_seems_take_some_8396b9: "议会似乎需要一些时间。"
  npc_override_prt_cas_quests_16_1_attack_expected_soon_i_m_308ee8: "预计很快会遭到攻击。我必须做准备。"
  npc_override_prt_cas_quests_16_1_authentic_been_made_dist_87edcd: "这是为贵族制作的正品。不过，我不知道里面有什么。这取决于你的运气。"
  npc_override_prt_cas_quests_16_1_awesome_82524e: "太棒了！"
  npc_override_prt_cas_quests_16_1_awesome_thank_you_so_muc_b2de7a: "这太棒了。非常感谢。你一定很忙吧？我现在得去处理一些事情……"
  npc_override_prt_cas_quests_16_1_aww_i_must_forgotten_tel_c7c2b9: "哎呀……我一定忘了告诉你。"
  npc_override_prt_cas_quests_16_1_aww_please_help_me_dear_58c1e0: "哎呀……请帮帮我，亲爱的冒险者。"
  npc_override_prt_cas_quests_16_1_aww_rosa_where_you_now_89d5b9: "哎呀……罗莎，你现在在哪里？"
  npc_override_prt_cas_quests_16_1_awww_i_need_find_my_fcb8b6: "哎呀……我需要找到我的妻子……而且我不应该被人看到。"
  npc_override_prt_cas_quests_16_1_awww_please_help_me_plea_26f17e: "哎呀……请帮帮我。请找到我的妻子……我真的很担心她。"
  npc_override_prt_cas_quests_16_1_awww_please_help_me_plea_941cae: "哎呀……请帮帮我。请找到我的妻子。"
  npc_override_prt_cas_quests_16_1_b_u_t_c831af: "但是！"
  npc_override_prt_cas_quests_16_1_bad_cea452: "还不错。"
  npc_override_prt_cas_quests_16_1_bad_things_seem_keep_hap_b8ade7: "坏事似乎接连不断。"
  npc_override_prt_cas_quests_16_1_bad_time_should_i_just_e1c18b: "现在不方便吗？我应该离开吗？"
  npc_override_prt_cas_quests_16_1_bam_385f97: "砰！"
  npc_override_prt_cas_quests_16_1_band_pretty_good_e89aea: "这个乐队相当不错。"
  npc_override_prt_cas_quests_16_1_banquet_carries_more_mea_27deae: "这次宴会比庆祝更有意义，因为皇家议会同时举行。你听说了吗？"
  npc_override_prt_cas_quests_16_1_banquet_full_swing_palac_f2d596: "宫殿里宴会正在热烈进行中。"
  npc_override_prt_cas_quests_16_1_banquet_hall_inside_pala_ca16b7: "宴会厅在宫殿内部。你可以沿着通道前往。"
  npc_override_prt_cas_quests_16_1_banquet_hall_open_all_ti_f63372: "宴会厅将一直开放。请赏光出席宴会。"
  npc_override_prt_cas_quests_16_1_banquet_heroes_like_you_41e673: "这次宴会是为像你这样的英雄举办的。"
  npc_override_prt_cas_quests_16_1_banquet_hosted_palace_ce_c0ac61: "宫殿举办的宴会是为了庆祝探险队的归来，并缅怀他们的辛勤工作……"
  npc_override_prt_cas_quests_16_1_banquet_if_my_soft_dress_12484f: "在宴会上，如果我柔软的裙摆像年轻的花瓣一样展开，整个地方将充满芬芳。"
