  npc_override_prt_cas_quests_16_1_i_should_given_up_now_b1af3b: "我现在应该已经放弃了……"
  npc_override_prt_cas_quests_16_1_i_should_go_help_them_89444b: "我现在应该去帮助他们。"
  npc_override_prt_cas_quests_16_1_i_should_just_give_all_497f7a: "我应该放弃一切逃跑。"
  npc_override_prt_cas_quests_16_1_i_should_make_dress_as_ae93a6: "我应该做一条像黑夜一样遥远而神秘的礼服。"
  npc_override_prt_cas_quests_16_1_i_should_prepare_go_him_525a51: "而且我应该准备和他一起去。"
  npc_override_prt_cas_quests_16_1_i_should_seen_face_pleas_0b92ae: "我应该看到脸的！下次请邀请我参加那种活动。"
  npc_override_prt_cas_quests_16_1_i_should_taken_better_ca_d88ce1: "我应该更好地保管它……"
  npc_override_prt_cas_quests_16_1_i_shouldn_t_stayed_behin_7ff697: "我不应该留在后面。他没事吧？"
  npc_override_prt_cas_quests_16_1_i_shouldn_t_worked_him_ab6866: "我一开始就不应该和他一起工作。我白白失去了我可怜的侄子。"
  npc_override_prt_cas_quests_16_1_i_smell_smell_take_out_c38c1c: "我闻到了！这个味道！把你带来的东西拿出来。"
  npc_override_prt_cas_quests_16_1_i_something_tell_you_f425ed: "{0}，我有事要告诉你。"
  npc_override_prt_cas_quests_16_1_i_something_tell_you_spe_6c7d06: "我有事要告诉你，特别来宾。"
  npc_override_prt_cas_quests_16_1_i_something_you_please_t_f127d3: "我有东西给你。请和这里的杰拉德谈谈。"
  npc_override_prt_cas_quests_16_1_i_sorry_i_didn_t_1b50d2: "很抱歉那时没能和你说话。"
  npc_override_prt_cas_quests_16_1_i_sorry_when_i_asked_c32710: "很抱歉我请你帮忙。我们会慷慨地回报你。"
  npc_override_prt_cas_quests_16_1_i_spent_lot_money_time_bec666: "我花了很多钱和时间，不想错过他的任何一场演出。"
  npc_override_prt_cas_quests_16_1_i_spent_too_much_time_8be778: "我在两个种族之间的紧张关系中度过了太多时间。在这样一个幸福轻松的地方，感觉就像在做梦。这一定就是人们所说的和平，对吧？"
  npc_override_prt_cas_quests_16_1_i_start_feel_damp_soggy_1c86e7: "我开始感觉这个潮湿阴冷的地方正在变得清新，诺埃尔。"
  npc_override_prt_cas_quests_16_1_i_started_yesterday_real_42b552: "我昨天才开始，就明白了为什么以前在这里工作的人都 quit 了。"
  npc_override_prt_cas_quests_16_1_i_step_back_now_i_f3f6a9: "不是说我能退缩。我想我能做的就是尽力而为。"
  npc_override_prt_cas_quests_16_1_i_still_like_best_books_27e67d: "我仍然最喜欢哥哥们读给我听的书。"
  npc_override_prt_cas_quests_16_1_i_studied_eclage_817e5f: "我在艾克拉奇学习过。"
  npc_override_prt_cas_quests_16_1_i_suppose_so_c3c701: "我想是的。"
  npc_override_prt_cas_quests_16_1_i_sure_am_counting_you_a35c8a: "我当然指望你。"
  npc_override_prt_cas_quests_16_1_i_surprised_see_what_ins_94fe21: "我很惊讶看到安装在那里的东西对泰拉·格洛丽亚产生反应。"
  npc_override_prt_cas_quests_16_1_i_surprised_when_you_int_df9360: "当你被介绍为特别来宾时我很惊讶。你看起来比我想象的更不寻常。"
  npc_override_prt_cas_quests_16_1_i_t_go_there_myself_0f2986: "但我不能自己去那里。那就意味着不可能见到他了。我们应该想个替代方案。"
  npc_override_prt_cas_quests_16_1_i_t_just_let_go_545cc9: "我不能就这样放弃我生命中这场华丽的宴会！"
  npc_override_prt_cas_quests_16_1_i_t_wait_hear_fd0865: "我等不及要听了。"
  npc_override_prt_cas_quests_16_1_i_t_wait_let_dumb_1b28e3: "我等不及让那些愚蠢的人类尝尝我恐怖之拳的滋味！"
  npc_override_prt_cas_quests_16_1_i_t_wait_see_what_ef6f8f: "我等不及看你这次会带来什么。"
  npc_override_prt_cas_quests_16_1_i_take_request_what_s_6b0b4e: "我会接受请求。你的问题是什么？"
  npc_override_prt_cas_quests_16_1_i_talked_wolf_too_he_f4848a: "我也和沃尔夫谈过了，但他说的话和祖父一样。除非他不听我的，否则我应该请人帮忙。"
  npc_override_prt_cas_quests_16_1_i_tell_him_make_polite_7334f8: "我会告诉他以后礼貌地向你道歉。其实他和你看到的不一样。请善意地理解。"
  npc_override_prt_cas_quests_16_1_i_tell_you_one_though_9c191a: "这个我可以告诉你。我没拿。如果你问我房间里有没有人，嗯……"
  npc_override_prt_cas_quests_16_1_i_terrified_symbol_legit_52ca8f: "我很害怕王室持有的合法性象征已经消失了。"
  npc_override_prt_cas_quests_16_1_i_thank_you_behalf_pront_2bddb5: "我代表普隆德拉守卫感谢你。"
  npc_override_prt_cas_quests_16_1_i_think_all_thanks_you_692292: "我想这都是多亏了你。"
  npc_override_prt_cas_quests_16_1_i_think_because_royal_as_49c735: "我想是因为皇家议会。这就是现在正在流传的传闻。"
  npc_override_prt_cas_quests_16_1_i_think_difficult_get_pe_ee6ed8: "我想很难得到珍珠。真的很难。这超出了我的能力。对不起。"
  npc_override_prt_cas_quests_16_1_i_think_enough_strands_r_40116d: "我想^0000cd3个{0}^000000就够了，需要50根{1}^0000cd^000000。"
  npc_override_prt_cas_quests_16_1_i_think_good_idea_start_cbf6ae: "我想从你的守护骑士开始是个好主意。既然他们一起作为守护骑士工作，他一定知道些什么。"
  npc_override_prt_cas_quests_16_1_i_think_great_lord_helmu_f27651: "而且我认为赫尔穆特大人放弃统一战争是件好事。"
  npc_override_prt_cas_quests_16_1_i_think_great_though_lit_a10128: "我觉得很好，虽然有点遗憾。"
  npc_override_prt_cas_quests_16_1_i_think_i_able_recall_c31cb9: "我想当你用我给你的清洁海绵打扫完厨房后回来，我就能想起来了。"
  npc_override_prt_cas_quests_16_1_i_think_i_am_going_bd2b22: "我想我会继续四处寻找。"
  npc_override_prt_cas_quests_16_1_i_think_i_closer_brother_fd4c85: "我想我以前比现在更亲近兄弟们，赫尔穆特和迈尔。"
  npc_override_prt_cas_quests_16_1_i_think_i_forgiven_whate_563ae1: "我想无论我做什么都会被原谅。"
  npc_override_prt_cas_quests_16_1_i_think_i_heard_their_f9307f: "我想我听说过他们的名字。我听说他们用无尽的公开秀恩爱折磨孤独士兵的心灵。"
  npc_override_prt_cas_quests_16_1_i_think_i_just_found_fa8210: "我想我刚发现了王室的所有秘密。"
  npc_override_prt_cas_quests_16_1_i_think_i_ll_take_07278a: "我想我得深呼吸，喝一杯水冷静下来再做。"
  npc_override_prt_cas_quests_16_1_i_think_i_need_some_8e9487: "我想我需要一些时间沉思。"
  npc_override_prt_cas_quests_16_1_i_think_i_seen_mark_faef51: "我想我看到马克了……"
  npc_override_prt_cas_quests_16_1_i_think_i_should_prepare_27777e: "我想我应该准备些喝的。"
  npc_override_prt_cas_quests_16_1_i_think_i_use_these_4d9e9e: "我想我可以用这些做一个美丽的胸花。它会很清新美丽。"
  npc_override_prt_cas_quests_16_1_i_think_people_just_same_82ad0e: "我想人都一样。我们不需要展示一切，但我们需要展示一些，让别人知道我们内心有多美。"
  npc_override_prt_cas_quests_16_1_i_think_there_must_somet_0cd887: "我想一定出了什么问题。"
  npc_override_prt_cas_quests_16_1_i_think_these_experience_86fc71: "我想这些经历让我们更友好，更有发展。"
  npc_override_prt_cas_quests_16_1_i_think_too_late_me_38309d: "我想对我来说太晚了……"
  npc_override_prt_cas_quests_16_1_i_think_we_need_inform_0e7b9f: "我想我们需要通知^0000cd维格纳^000000这个传闻。请稍等。"
  npc_override_prt_cas_quests_16_1_i_think_you_scrubbing_to_0075d3: "我想你擦得太轻了。你应该给油脂一些时间在混合物中溶解。"
  npc_override_prt_cas_quests_16_1_i_thinking_how_i_emphasi_a94cff: "我在想要如何突出我的珍珠项链。"
  npc_override_prt_cas_quests_16_1_i_thought_about_many_thi_e3af86: "听了阿格涅斯的话后，我想了很多。要做那些事，我不能浪费一分钟。"
  npc_override_prt_cas_quests_16_1_i_thought_crusaders_rele_082ff1: "我以为十字军把他们全都释放了，不是吗？那我一定想错了。"
  npc_override_prt_cas_quests_16_1_i_thought_i_used_those_675812: "我以为我已经习惯了那些事……看来还没有。"
  npc_override_prt_cas_quests_16_1_i_thought_right_way_deve_947593: "而且我认为这是发展力量的正确方式，让人们别无选择只能追随。"
  npc_override_prt_cas_quests_16_1_i_thought_weird_recently_c41ba2: "我觉得那很奇怪，最近发现了那些长着蝙蝠翅膀的调皮家伙，而他们甚至不是蝙蝠。"
  npc_override_prt_cas_quests_16_1_i_thought_you_d_differen_48e778: "我以为你会不同。太令人失望了。"
  npc_override_prt_cas_quests_16_1_i_thought_you_new_assist_eb0d90: "我以为你是新来的助理厨师。抱歉给你添了这么多麻烦！"
  npc_override_prt_cas_quests_16_1_i_told_him_story_meeting_245c3c: "我告诉了他遇见伊森纳姆的守护骑士以及和他交谈的故事。"
  npc_override_prt_cas_quests_16_1_i_told_isenhonor_stop_in_01c4ff: "我告诉伊森纳诺^0000cd停止调查他哥哥的死因^000000。"
  npc_override_prt_cas_quests_16_1_i_told_made_lock_up_d8fbb7: "我被告知这是为了关押对卢恩-米德加尔特和平与安全构成威胁的人而建造的。"
  npc_override_prt_cas_quests_16_1_i_told_you_i_need_8a4252: "我告诉过你我要30个。"
  npc_override_prt_cas_quests_16_1_i_told_you_isn_t_5c15cf: "我告诉过你那不是真的！"
  npc_override_prt_cas_quests_16_1_i_told_you_just_before_7bb182: "我刚才告诉过你。"
  npc_override_prt_cas_quests_16_1_i_told_you_you_need_e8c91c: "我告诉过你！你需要^0000cd1个霉菌粉末和1个圣水^000000来清理霉菌！"
  npc_override_prt_cas_quests_16_1_i_too_young_remember_how_5c8c2f: "我太小了，不记得了。然而，我确实记得我们妹妹和你争吵后变得非常安静。"
  npc_override_prt_cas_quests_16_1_i_took_look_gate_592ddc: "我看了一眼大门。"
  npc_override_prt_cas_quests_16_1_i_took_out_my_bag_ffa6d5: "我从包里拿出来放在这里。然后就不见了。我该怎么办？没有它我不知道该怎么办……我不能让任何人看到它……"
  npc_override_prt_cas_quests_16_1_i_tried_courteous_you_si_6018f6: "我试图对你礼貌，因为你是特别来宾。但我宁愿咬断自己的舌头也不愿继续那样说话。"
  npc_override_prt_cas_quests_16_1_i_tried_everyone_seems_c_45afc8: "我试图为每个人做这个，但似乎造成了麻烦。"
  npc_override_prt_cas_quests_16_1_i_tried_find_replacement_9f92c4: "我试图找她的替代者，但找不到。每个人都在宫殿工作或供应宴会所需物品，已经很忙了。"
  npc_override_prt_cas_quests_16_1_i_tried_hide_my_feelings_d09a9a: "我一直试图隐藏自己的感情，节省言语。然而，我意识到这不是最好的策略。"
  npc_override_prt_cas_quests_16_1_i_tried_loosen_up_you_fc4484: "我试图不放松，你知道的。"
  npc_override_prt_cas_quests_16_1_i_tried_my_best_slay_dab4f1: "……我尽力不杀他。"
  npc_override_prt_cas_quests_16_1_i_tried_stop_him_saying_10c711: "我试图阻止他说我们家族不应该有商人，但他太固执了。"
  npc_override_prt_cas_quests_16_1_i_trying_keep_safe_pleas_a6ee9d: "我一直在努力保管好它……请，亲爱的冒险者，帮帮我们！"
  npc_override_prt_cas_quests_16_1_i_turned_down_c9e5ea: "我拒绝了。"
  npc_override_prt_cas_quests_16_1_i_understand_40038e: "我明白。"
  npc_override_prt_cas_quests_16_1_i_understand_armed_force_064da7: "我明白。一个外国武装部队正在越境，我不确定他们会做什么。他们别无选择，只能阻止他们。"
  npc_override_prt_cas_quests_16_1_i_understand_how_upset_y_9d2309: "我理解你们所有人因这次突发事件而感到的不安。"
  npc_override_prt_cas_quests_16_1_i_understand_i_should_ta_e182bc: "我明白。我应该从这里接手。谢谢你的帮助。"
  npc_override_prt_cas_quests_16_1_i_understand_your_feelin_b4aa56: "我理解你对大人的感情，但你的行为只会给你的家族带来耻辱。"
  npc_override_prt_cas_quests_16_1_i_use_make_beautiful_sha_5fdd02: "我会用它做一条美丽的披肩。我一进入宴会厅，就能给人留下强烈的印象。"
  npc_override_prt_cas_quests_16_1_i_use_them_make_plain_c76eae: "^0000cd5个{0}、5个{1}和5个{2}^000000。我会用它们做一个朴素但美丽的装饰。"
  npc_override_prt_cas_quests_16_1_i_use_these_materials_ma_e9c24f: "我会用这些材料做一条像夜空一样优雅的深色礼服。穿上它，我会给人一种 sleek 猫的形象。"
  npc_override_prt_cas_quests_16_1_i_ve_been_here_as_3ea525: "我在这里待了很久，但那声音……是最近才出现的。"
  npc_override_prt_cas_quests_16_1_i_ve_been_sector_6db3d8: "我去过A区。"
  npc_override_prt_cas_quests_16_1_i_ve_been_sector_b_77a433: "我去过B区。"
  npc_override_prt_cas_quests_16_1_i_ve_been_sector_c_5f732a: "我去过C区。"
  npc_override_prt_cas_quests_16_1_i_ve_been_sector_d_53ce48: "我去过D区。"
  npc_override_prt_cas_quests_16_1_i_ve_been_sector_e_f3c633: "我去过E区。"
  npc_override_prt_cas_quests_16_1_i_ve_been_sector_f_68c70e: "我去过F区。"
  npc_override_prt_cas_quests_16_1_i_ve_been_sector_g_7eb0a3: "我去过G区。"
  npc_override_prt_cas_quests_16_1_i_ve_been_sector_h_d8d632: "我去过H区。"
  npc_override_prt_cas_quests_16_1_i_ve_been_talking_my_9f5db5: "我和妹妹聊得更多了，而且……"
  npc_override_prt_cas_quests_16_1_i_ve_been_waiting_you_67a87a: "我一直在等你。{0}大人……"
  npc_override_prt_cas_quests_16_1_i_ve_been_waiting_you_760466: "我一直在等你。"
  npc_override_prt_cas_quests_16_1_i_visited_palace_rune_mi_41ade3: "我很久以前参观过卢恩·米德加尔特的宫殿。从那以后它变了很多。它变得更加华丽壮观，我真的很喜欢被引导参观这个地方。"
  npc_override_prt_cas_quests_16_1_i_visited_your_room_give_f2892d: "{0}，我去你的房间向你道歉，但你已经去宴会厅了。"
  npc_override_prt_cas_quests_16_1_i_wait_me_62fd85: "我可以做到。等我。"
  npc_override_prt_cas_quests_16_1_i_wait_spica_s_return_54b464: "我得等斯皮卡回来换衣服。"
  npc_override_prt_cas_quests_16_1_i_waiting_you_507f65: "我会等你！"
  npc_override_prt_cas_quests_16_1_i_wake_up_when_i_dd3432: "我在靠近脏的地方时会醒来。"
  npc_override_prt_cas_quests_16_1_i_want_born_as_human_148315: "下辈子我想投胎做人，成为你的……亲密朋友……"
  npc_override_prt_cas_quests_16_1_i_want_compensation_if_y_04c7f4: "我想要报酬。如果你给我足够的报酬，我什么都可以告诉你。所以先让我看看你的报价。"
  npc_override_prt_cas_quests_16_1_i_want_flower_banquet_ha_07f644: "我想成为宴会厅里的一朵花。我想让人们像被 delicate 香味迷住的花一样赞叹我。"
  npc_override_prt_cas_quests_16_1_i_want_go_back_95eb51: "我想回去……"
  npc_override_prt_cas_quests_16_1_i_want_go_back_now_c2e1bb: "我现在想回去。"
  npc_override_prt_cas_quests_16_1_i_want_go_home_a499e3: "我想回家……"
  npc_override_prt_cas_quests_16_1_i_want_go_home_now_2d1771: "我现在想回家。"
  npc_override_prt_cas_quests_16_1_i_want_go_see_her_05eae7: "我想亲自去看她。然而，我想她会感到不舒服。"
  npc_override_prt_cas_quests_16_1_i_want_hear_if_important_8ee054: "如果重要的话，我想听。"
  npc_override_prt_cas_quests_16_1_i_want_him_visit_us_f3fc14: "我想让他多来看我们，而不是帮助我。"
  npc_override_prt_cas_quests_16_1_i_want_history_book_whic_51e097: "我想要一本包含卢恩-米德加尔特全部历史的历史书。它在皇家图书馆里，我从未见过。"
  npc_override_prt_cas_quests_16_1_i_want_know_who_circulat_98afeb: "我想知道是谁散布了传闻。"
  npc_override_prt_cas_quests_16_1_i_want_let_her_know_3c772b: "我想每天让她知道我炽热的心。"
  npc_override_prt_cas_quests_16_1_i_want_make_dress_deeper_bd5d1b: "^0000cd20个{0}^000000。我想做一条比夜空更深更暗的礼服。"
  npc_override_prt_cas_quests_16_1_i_want_pretty_clothes_to_a49f18: "我也想要漂亮的衣服！我也想要^0000cd漂亮的丝绸布料^000000！我会告诉妈妈给我做！"
  npc_override_prt_cas_quests_16_1_i_want_pretty_silk_cloth_6a75b9: "我想要漂亮的丝绸布料！我听说宫殿里举办宴会，公主们穿漂亮的礼服。"
  npc_override_prt_cas_quests_16_1_i_want_run_back_them_650d3f: "宴会一结束我就想跑回他们身边。"
  npc_override_prt_cas_quests_16_1_i_want_satisfy_guests_3ea02c: "我想让客人满意！"
  npc_override_prt_cas_quests_16_1_i_want_send_her_heart_66e0cf: "我想送给她^0000cd像大海一样宽广美丽的心^000000和^0000cd对她永恒的心^000000。"
  npc_override_prt_cas_quests_16_1_i_want_you_pair_up_3192ed: "我想让你和尼勒姆搭档执行这个任务。"
  npc_override_prt_cas_quests_16_1_i_wanted_investigate_mys_6751ea: "考虑到事情的重要性，我想亲自调查。但伊森纳诺命令我回艾尔贝塔，所以我不得不回到这里。"
  npc_override_prt_cas_quests_16_1_i_wanted_thank_you_alway_2ea8c7: "我一直想感谢你。多亏了你，我的家族正在回归安全。"
  npc_override_prt_cas_quests_16_1_i_wash_dishes_again_agai_3649f0: "我洗碗……再洗……再洗……"
  npc_override_prt_cas_quests_16_1_i_wasn_t_able_bring_ea3576: "我没能把它们全部带来。"
  npc_override_prt_cas_quests_16_1_i_wasn_t_interested_atte_78ed13: "我对参加皇家宴会不感兴趣……"
  npc_override_prt_cas_quests_16_1_i_went_down_there_my_fd144b: "我和妻子艾莉一起下去了。"
  npc_override_prt_cas_quests_16_1_i_what_i_a6009f: "我做我能做的。"
  npc_override_prt_cas_quests_16_1_i_what_you_want_too_979fe6: "我也必须做你想做的事吗……？"
  npc_override_prt_cas_quests_16_1_i_whatever_i_want_eb9019: "我可以做任何我想做的事。"
  npc_override_prt_cas_quests_16_1_i_wish_banquet_finished_36dd22: "我希望宴会结束，早点回去。"
  npc_override_prt_cas_quests_16_1_i_wish_you_godspeed_eaa14d: "祝你一路顺风。"
  npc_override_prt_cas_quests_16_1_i_won_t_ba445f: "我不会！"
  npc_override_prt_cas_quests_16_1_i_won_t_either_a5b3f3: "我也不会！"
  npc_override_prt_cas_quests_16_1_i_won_t_ever_let_4656fc: "我永远不会放弃这样的力量！"
  npc_override_prt_cas_quests_16_1_i_won_t_go_before_e4a7bf: "在看到他优雅而光辉的身影之前，我不会走！"
  npc_override_prt_cas_quests_16_1_i_won_t_let_anyone_44e2f0: "我不会让任何人独占尤尔根！天可以原谅，但我不会！"
  npc_override_prt_cas_quests_16_1_i_won_t_let_go_e04338: "我不会放弃这个，真的！"
  npc_override_prt_cas_quests_16_1_i_won_t_let_happen_ce4326: "我也不会让它发生！"
  npc_override_prt_cas_quests_16_1_i_won_t_let_punk_b4f20c: "我不会让这个小混混……恩斯特……！"
  npc_override_prt_cas_quests_16_1_i_won_t_satisfied_if_2fb0df: "如果不是奇迹般奢华、超级华丽，我不会满意！"
  npc_override_prt_cas_quests_16_1_i_won_t_stop_you_142117: "我不会阻止你在城里走动。我会在地图上标记由于情况原因士兵尚未派遣的地方。"
  npc_override_prt_cas_quests_16_1_i_won_t_stop_you_73319e: "我不会阻止你放弃。然而，你应该知道，你目前的训练进度不会反映到下一次训练中。"
  npc_override_prt_cas_quests_16_1_i_won_t_talk_before_a57e3a: "你把它们带来之前我不会说话！再检查一遍，把它们带来！"
  npc_override_prt_cas_quests_16_1_i_wonder_how_many_people_248b4a: "但我想知道有多少人直视太阳后失去了眼睛。为什么人们要看那团燃烧的火焰？它是什么？"
  npc_override_prt_cas_quests_16_1_i_wonder_how_you_deal_dcdd3d: "我想知道你怎么对付看不见的敌人。"
  npc_override_prt_cas_quests_16_1_i_wonder_how_your_sister_830bfc: "我想知道你妹妹最近怎么样。"
  npc_override_prt_cas_quests_16_1_i_wonder_if_he_still_56a40e: "我想知道他是否还在那里。"
  npc_override_prt_cas_quests_16_1_i_wonder_if_my_imaginati_07151a: "……我想知道大门看起来不稳定是不是我的想象。"
  npc_override_prt_cas_quests_16_1_i_wonder_if_old_folks_909f23: "我想知道长辈们会不会听我的。"
  npc_override_prt_cas_quests_16_1_i_wonder_if_our_children_127838: "我想知道我们的孩子们是否守规矩。我们一定太宠他们了，因为他们有时会表现得如此鲁莽。"
  npc_override_prt_cas_quests_16_1_i_wonder_if_our_children_5d0f05: "我想知道我们的孩子们有没有太打扰你。虽然我们很好奇，但我们决定不再追问。"
  npc_override_prt_cas_quests_16_1_i_wonder_if_theodor_hand_b2bc6b: "我想知道西奥多一个人能不能处理好工作。"
  npc_override_prt_cas_quests_16_1_i_wonder_if_you_happy_e1cc51: "我想知道你对训练奖励是否满意。"
  npc_override_prt_cas_quests_16_1_i_wonder_if_you_look_174c4a: "我想知道你能不能尽快悄悄地调查这件事。"
  npc_override_prt_cas_quests_16_1_i_wonder_prisoner_here_m_b2cb5b: "我想知道这里的囚犯是否把监狱当成了某种酒店。他在找经理。我就当没听见。"
  npc_override_prt_cas_quests_16_1_i_wonder_what_we_going_4774fc: "我想知道这次我们会看到什么！"
  npc_override_prt_cas_quests_16_1_i_wonder_where_they_they_c9d2b9: "我想知道他们在哪里。他们太分散了，很难找到每个人。哈哈哈！"
  npc_override_prt_cas_quests_16_1_i_wonder_you_know_candid_eb9c9d: "我想知道你是否知道，^0000cd我们家族的候选人在^0000cd上一次皇家议会^000000中卷入了一起不幸的事件^000000。"
  npc_override_prt_cas_quests_16_1_i_wondered_if_you_come_7b65e8: "我想知道你会不会来，因为来自各地的英雄都应该参加宴会。"
  npc_override_prt_cas_quests_16_1_i_wondering_when_you_d_df963b: "我一直在想你什么时候会叫我！我就知道你会——"
  npc_override_prt_cas_quests_16_1_i_worried_about_as_well_d5090f: "我也很担心。请，亲爱的冒险者，帮帮我们。我们之间的爱情关系就靠你了。"
  npc_override_prt_cas_quests_16_1_i_wouldn_t_let_go_9a676b: "没有它们我不会放手的！我不会！我会告诉人们有一个冒险者陷害无辜的人！他！"
  npc_override_prt_cas_quests_16_1_i_wouldn_t_mind_862839: "我不介意。"
  npc_override_prt_cas_quests_16_1_if_anything_goes_missing_104f4b: "如果有什么东西不见了，总是我们这些普通人被怀疑。你知道这只是偏见吗？"
  npc_override_prt_cas_quests_16_1_if_didn_t_whither_so_39efee: "如果它没有枯萎这么久，它可能是一朵永恒玫瑰。"
  npc_override_prt_cas_quests_16_1_if_erich_hasn_t_come_91072a: "如果埃里希没有出现，我们中的一个，斯奇亚和我，会被选为女王候选人。"
  npc_override_prt_cas_quests_16_1_if_gets_out_my_family_2e92bd: "如果传出去，我的家族可以否认。"
  npc_override_prt_cas_quests_16_1_if_he_doesn_t_try_aa6ac5: "如果他不试图对你做什么，那一定是最好的结果。"
  npc_override_prt_cas_quests_16_1_if_he_had_told_me_a86996: "如果他早点告诉我他不能去，我就不会拒绝所有那些求婚了。"
  npc_override_prt_cas_quests_16_1_if_he_king_material_he_167aaf: "如果他是国王的料，他就会是。如果不是，他不必成为国王。我不想因此给他压力。"
  npc_override_prt_cas_quests_16_1_if_helmut_roegenburg_bec_b30916: "如果赫尔穆特·罗根堡成为国王……啊顺便问一下，你知道关于罗根堡的传闻吗，尤其是关于^0000cd四个孩子的死^000000的传闻。"
  npc_override_prt_cas_quests_16_1_if_i_don_t_show_3ab765: "如果我没出现，立刻去^4d4dff王室往事^000000。"
  npc_override_prt_cas_quests_16_1_if_i_follow_him_like_8fe823: "如果我这样跟着他，每个人都会觉得我奇怪。"
  npc_override_prt_cas_quests_16_1_if_i_get_busted_i_ec2b2f: "^0000cd如果我被抓了，我就有麻烦了^000000。我们没有钱支付赔偿。"
  npc_override_prt_cas_quests_16_1_if_i_go_out_get_beda0e: "如果我出去买礼服，我可能是卢恩-米德加尔特第一个为礼服而死去的公主。所以你能帮我摆脱这个困境吗？"
  npc_override_prt_cas_quests_16_1_if_i_push_you_too_78041c: "如果我逼你太紧，我会有麻烦的！"
  npc_override_prt_cas_quests_16_1_if_i_really_sad_i_0d9141: "如果不是，我会很难过。为了穿漂亮的礼服，我在节食。所以我现在很敏感。"
  npc_override_prt_cas_quests_16_1_if_i_show_my_face_3398e9: "如果我露面，可能会打扰他们的注意力。我宁愿不去见他们。"
  npc_override_prt_cas_quests_16_1_if_katrin_son_i_gladly_b637fd: "如果卡特琳是儿子，我会 gladly 把一切交给她。"
  npc_override_prt_cas_quests_16_1_if_morocc_hadn_t_been_d4ec8b: "如果梦罗克没有被复活……"
  npc_override_prt_cas_quests_16_1_if_my_attitude_then_what_3d27f5: "如果不是我的态度，那是什么？"
  npc_override_prt_cas_quests_16_1_if_next_head_family_meet_86a76c: "如果下任家主见你{0}，请……"
  npc_override_prt_cas_quests_16_1_if_one_our_descendants_h_c1d268: "如果我们后代中有人读到这份记录，"
  npc_override_prt_cas_quests_16_1_if_our_family_turns_out_37d668: "如果我们家族出了国王，我们的大部分财富将被花掉。曾经，我们的家族真的因此受苦。"
  npc_override_prt_cas_quests_16_1_if_so_he_over_there_f68b54: "如果是这样，他在那边。你可以在那里找到他。"
  npc_override_prt_cas_quests_16_1_if_so_you_successful_i_f009e3: "如果是这样，你就成功了。我听得很清楚。"
  npc_override_prt_cas_quests_16_1_if_they_decided_tell_you_84ef98: "如果他们决定不告诉你，那也不是我该讲的故事。"
  npc_override_prt_cas_quests_16_1_if_they_had_thought_abou_13edca: "如果他们想过如何让王国的公民生活得更幸福，他们就不会那样做。"
  npc_override_prt_cas_quests_16_1_if_they_really_want_some_dc0542: "如果他们真的想为我们做点什么，他们真的应该让我们休息。"
  npc_override_prt_cas_quests_16_1_if_they_wouldn_t_listen_52216b: "如果他们不听，为什么不直接拿走呢？20个怎么样？我给你特别许可。"
  npc_override_prt_cas_quests_16_1_if_time_allows_you_like_031a36: "如果时间允许，你想见见我们的孩子吗？他们一直很期待在宴会上见到击败梦罗克的英雄。"
  npc_override_prt_cas_quests_16_1_if_time_allows_you_pleas_ef8f99: "如果时间允许，你能给我们的孩子讲讲你的冒险故事吗？这对他们来说将是宝贵的经历。"
  npc_override_prt_cas_quests_16_1_if_true_lord_heine_must_fcd403: "如果是真的，海涅大人一定不是故意做这种事的。"
  npc_override_prt_cas_quests_16_1_if_we_don_t_honest_43696a: "如果我们不坦诚相待，我们只会渐行渐远。我们又会误解彼此。"
  npc_override_prt_cas_quests_16_1_if_we_join_hands_helmut_75f059: "如果我们联手，^0000cd赫尔穆特成为国王^000000，^0000cd整个国家^000000除了宫殿都会变成后街。现在听到不是更好吗，这样你以后受到的打击会小一些？"
  npc_override_prt_cas_quests_16_1_if_what_helmut_wants_i_0adcf8: "但如果那是赫尔穆特想要的，我不反对。"
  npc_override_prt_cas_quests_16_1_if_what_you_seen_true_988786: "如果你看到的是真的，封印就会被打破。"
  npc_override_prt_cas_quests_16_1_if_you_allow_i_like_269234: "如果你允许，我想^0000cd澄清我家族在传闻中的误解^000000。你有时间吗？"
  npc_override_prt_cas_quests_16_1_if_you_busy_you_may_308259: "如果你很忙，你可以拒绝。很抱歉请你帮忙。我哥哥突然回来了，这让我心烦意乱，很忙。"
  npc_override_prt_cas_quests_16_1_if_you_come_back_again_cb753f: "如果你明天再来帮我，会有更多这样的。常来！"
  npc_override_prt_cas_quests_16_1_if_you_curious_you_may_6ed8ae: "如果你好奇，你可以跟着他。"
  npc_override_prt_cas_quests_16_1_if_you_don_t_make_c918d4: "如果你不这样做，一定要去见沃尔夫，和他谈谈。"
  npc_override_prt_cas_quests_16_1_if_you_don_t_mind_4df7a7: "如果你不介意，和宴会厅里的吉奥博格家族成员谈谈怎么样？"
  npc_override_prt_cas_quests_16_1_if_you_feel_suspicious_a_7c5f20: "如果你感到怀疑，去问门卫。他检查过我的马车。"
  npc_override_prt_cas_quests_16_1_if_you_feel_uncomfortabl_7bea99: "如果你和他们交谈时感到不舒服，请善意地理解。"
  npc_override_prt_cas_quests_16_1_if_you_find_dyu_banquet_4db1fb: "如果你在宴会厅找到迪尤，请告诉他我太忙了，不能带食物回去。"
  npc_override_prt_cas_quests_16_1_if_you_find_more_article_02b4e3: "如果你找到更多士兵留下的物品，请带给我好吗？"
  npc_override_prt_cas_quests_16_1_if_you_follow_my_lead_dd3f5a: "如果你跟着我，你就能完成世界上最困难的清洁任务！"
  npc_override_prt_cas_quests_16_1_if_you_give_me_honor_a70cdc: "如果你给我^FF0000 30个<荣誉徽章>^000000，我会给你一些非常有用的东西。"
  npc_override_prt_cas_quests_16_1_if_you_go_banquet_hall_cc0be4: "如果你去宴会厅，^4d4dff一定要找到纳里乌斯家族的人。^000000"
  npc_override_prt_cas_quests_16_1_if_you_going_borrow_book_033d94: "如果你要借书，你最好减轻行李。似乎没有空间放书了。"
  npc_override_prt_cas_quests_16_1_if_you_here_borrow_pecop_ccf2ff: "如果你是来借大嘴鸟的，我很抱歉。"
  npc_override_prt_cas_quests_16_1_if_you_hurt_jonathan_you_b9841b: "如果你伤害乔纳森，你会被逮捕的。"
  npc_override_prt_cas_quests_16_1_if_you_hurt_step_back_0f9338: "如果你受伤了，退后去治疗。如果你恢复了，回到队伍里。"
  npc_override_prt_cas_quests_16_1_if_you_insist_3b1a68: "如果你坚持。"
  npc_override_prt_cas_quests_16_1_if_you_keep_doing_i_034d90: "如果你继续这样做，我会阻止你来这里！"
  npc_override_prt_cas_quests_16_1_if_you_keep_insulting_my_b16b50: "如果你继续侮辱我的女士，我不会放过你的。"
  npc_override_prt_cas_quests_16_1_if_you_keep_training_you_5450b5: "如果你坚持训练，你会达到你想要的目标。"
  npc_override_prt_cas_quests_16_1_if_you_man_you_should_488dff: "如果你是男人，你应该有远大的梦想。我总是对阿尔纳这么说，但他太一本正经了。"
  npc_override_prt_cas_quests_16_1_if_you_more_questions_yo_c30ef2: "如果你还有问题，可以问这里的杰拉德和马丁。"
  npc_override_prt_cas_quests_16_1_if_you_move_straight_up_50fed0: "如果你直走上楼梯，你会找到十字军办公室。"
  npc_override_prt_cas_quests_16_1_if_you_need_help_roegenb_8b7dff: "如果你需要罗根堡的帮助，随时来找我们。罗根堡的大门永远为你敞开。"
  npc_override_prt_cas_quests_16_1_if_you_need_my_help_448d49: "如果你需要我的帮助，就找我。我会尽全力帮助你。保重！"
  npc_override_prt_cas_quests_16_1_if_you_newbie_you_should_440f65: "如果你是新手，你应该通过入门仪式！"
  npc_override_prt_cas_quests_16_1_if_you_nothing_i_nothing_8b9157: "如果你什么都不做，我也什么都不做。我希望我能像快乐的^0000cd乔纳森^000000一样在后街生活。"
  npc_override_prt_cas_quests_16_1_if_you_present_your_iden_3e0ccc: "如果你出示身份证，我们会立即为你制作。"
  npc_override_prt_cas_quests_16_1_if_you_question_again_co_3d0e82: "如果你还有问题，随时来找我！"
  npc_override_prt_cas_quests_16_1_if_you_rd_place_you_56961d: "如果你在23位，你今天可能见不到他。"
  npc_override_prt_cas_quests_16_1_if_you_record_today_some_7494ff: "如果你记录下今天，将来有人会读到它们并记住我们。"
  npc_override_prt_cas_quests_16_1_if_you_run_into_ernst_49fc9d: "如果你在宴会厅遇到恩斯特，请告诉他来这边。"
  npc_override_prt_cas_quests_16_1_if_you_say_another_word_2a61f5: "如果你再说一个字，我会亲手吊死你。"
  npc_override_prt_cas_quests_16_1_if_you_say_so_1c5fba: "既然你这么说……"
  npc_override_prt_cas_quests_16_1_if_you_say_so_how_8fe7ef: "既然你这么说……你需要多少个？哪里可以得到海之石？"
  npc_override_prt_cas_quests_16_1_if_you_say_so_i_5ccdae: "既然你这么说，我就做。"
  npc_override_prt_cas_quests_16_1_if_you_say_so_i_b02944: "既然你这么说，我不能强求。我会把你的话转达给他。"
  npc_override_prt_cas_quests_16_1_if_you_so_wolf_insist_6bc778: "如果你这样做，沃尔夫就不会坚持战争，迈尔也不会再那样牺牲自己了。"
