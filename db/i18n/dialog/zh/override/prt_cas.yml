  npc_override_prt_cas_quests_16_1_i_mean_war_stories_royal_6b03c0: "我的意思是战争故事、王室传闻，或者类似的东西。"
  npc_override_prt_cas_quests_16_1_i_mean_we_should_careful_0ac15d: "我的意思是，我们应该小心。"
  npc_override_prt_cas_quests_16_1_i_mean_why_don_t_44e76b: "我的意思是，为什么我们不去看看普隆德拉未知的过去，"
  npc_override_prt_cas_quests_16_1_i_merely_attracted_woman_13ca79: "我只是被眼睛漂亮的女人吸引了。那是纯洁的爱。人们不理解我。"
