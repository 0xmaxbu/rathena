  npc_override_prt_cas_quests_16_1_yes_i_m_bored_as_92a152: "是的，我很无聊，正如你想象的那样，但我不能和你一起玩。为什么？你没有我想要的眼睛。"
  npc_override_prt_cas_quests_16_1_yes_i_mean_if_truth_0dd8a0: "是的，我是那个意思。如果这是打开封印的真相，"
