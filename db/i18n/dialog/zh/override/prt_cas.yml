  npc_override_prt_cas_quests_16_1_you_want_know_why_fece59: "你想知道为什么吗？"
  npc_override_prt_cas_quests_16_1_you_want_me_attack_them_a638e6: "你想让我攻击他们吗？"
  npc_override_prt_cas_quests_16_1_you_want_me_steal_88c3a3: "你想让我去偷吗？"
  npc_override_prt_cas_quests_16_1_you_want_more_informatio_b19fe4: "你想要更多信息吗？我真的很想来点玛丝黛拉果酒。"
  npc_override_prt_cas_quests_16_1_you_want_take_look_mater_361c9f: "你想看看材料吗？"
  npc_override_prt_cas_quests_16_1_you_want_what_you_like_1df96b: "你希望你喜欢的东西长久留存。如果你把它换成另一朵花，那就不是你曾经喜欢的那朵花了。"
  npc_override_prt_cas_quests_16_1_you_welcome_your_own_fam_69da7d: "反正你在自己家族也不受欢迎。不如在这里和某位女士调情，改变一下你的人生？"
  npc_override_prt_cas_quests_16_1_you_what_you_please_if_48373b: "如果你想败坏他的名声，就随你便吧。"
  npc_override_prt_cas_quests_16_1_you_who_had_taken_87d39e: "这个……^0000cd是你拿走的吗^000000？"
  npc_override_prt_cas_quests_16_1_you_you_one_charge_clean_7f82df: "是你吗？你是今天负责打扫任务的人吗？"
  npc_override_prt_cas_quests_16_1_you_you_one_who_guided_5e21c7: "是你吗……？是你指引我找到了^0000cd顽固的油污^000000？"
  npc_override_prt_cas_quests_16_1_youngest_agnes_grown_as_148b16: "不过最小的孩子艾格尼丝已经长成了一个乖女孩，想到她我就很开心。"
  npc_override_prt_cas_quests_16_1_your_book_really_heavy_l_39384d: "还有你的这本书。它真的很重很大。我只借了一卷，其他卷已经被人借走了。"
