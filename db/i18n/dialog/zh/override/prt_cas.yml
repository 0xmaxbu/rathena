  npc_override_prt_cas_quests_16_1_what_you_ruined_last_tim_ef5bfb: "你上次毁掉的东西现在即将恢复，兄弟。"
  npc_override_prt_cas_quests_16_1_what_you_saw_dungeon_mon_351850: "你在地牢里看到的是怪物，当然。还能是什么？"
