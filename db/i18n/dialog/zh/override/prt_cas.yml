  npc_override_prt_cas_quests_16_1_you_understand_me_very_w_37737e: "你很理解我！我非常喜欢你。"
  npc_override_prt_cas_quests_16_1_you_us_please_we_running_934533: "你能帮我们吗？求你了。我们快没时间了。艾莉。坚持住……"
  npc_override_prt_cas_quests_16_1_you_use_7877fd: "你要用吗？"
  npc_override_prt_cas_quests_16_1_you_use_cart_after_learn_a6e1c7: "学会'手推车'技能后才能使用手推车。"
  npc_override_prt_cas_quests_16_1_you_valuable_guest_us_wa_484d26: "从现在开始，你就是沃尔瑟家族的贵客了，亲爱的冒险者。无论何时，我都会帮助你。"
  npc_override_prt_cas_quests_16_1_you_ve_been_invited_banq_d89f14: "你也受邀参加这场宴会了吗？"
  npc_override_prt_cas_quests_16_1_you_ve_been_looking_7450a6: "^3131FF{0}^000000……你一直在看这个。"
  npc_override_prt_cas_quests_16_1_you_ve_come_good_time_b3f1f1: "你来得正是时候，我想。我一直没空打理我的号角，它还挂在那里呢。"
  npc_override_prt_cas_quests_16_1_you_ve_come_right_time_996968: "你来得正是时候。监狱已经乱得不成样子了，该打扫一下了。"
  npc_override_prt_cas_quests_16_1_you_ve_come_right_time_f313d2: "你来得正是时候，管家。"
  npc_override_prt_cas_quests_16_1_you_ve_done_your_cleanin_e136d9: "你打扫完了？太好了！这是你的表扬印章！"
