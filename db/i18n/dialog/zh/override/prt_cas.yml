  npc_override_prt_cas_quests_16_1_they_haven_t_been_throug_f73299: "他们成长过程中没有经历过任何麻烦，所以我们觉得他们在各种生活经历方面有所欠缺。"
  npc_override_prt_cas_quests_16_1_they_heard_pickpocket_lo_b22493: "他们听说^0000cd宫殿地下室里关着一个扒手^000000，喋喋不休地说他在外国看到了一个瓦尔特家族的人。"
  npc_override_prt_cas_quests_16_1_they_hiding_something_ba_b8d21c: "他们是不是在向我隐瞒什么坏事……？"
  npc_override_prt_cas_quests_16_1_they_keep_getting_here_t_fff928: "他们不断通过守卫进来。加强安保也没用！"
  npc_override_prt_cas_quests_16_1_they_little_sensitive_th_a52fac: "他们最近有点敏感。请理解。"
  npc_override_prt_cas_quests_16_1_they_might_listen_you_be_9f403c: "但他们可能会听你的，因为你有漂亮的眼睛。"
  npc_override_prt_cas_quests_16_1_they_most_blue_blooded_p_f66ce9: "他们是最纯正的贵族，不习惯等待。"
  npc_override_prt_cas_quests_16_1_they_must_done_something_fca597: "他们一定做了什么，或者它一定回来了……"
  npc_override_prt_cas_quests_16_1_they_must_heard_news_you_64eca0: "他们一定已经听到了你到达的消息。"
  npc_override_prt_cas_quests_16_1_they_must_remotely_relat_7ebd44: "他们一定是远亲之类的。"
  npc_override_prt_cas_quests_16_1_they_must_waiting_pay_vi_29b3f4: "他们一定在等。去拜访一下，交换问候。"
  npc_override_prt_cas_quests_16_1_they_must_waiting_you_cc6cdf: "他们一定在等你。"
  npc_override_prt_cas_quests_16_1_they_my_family_who_close_09deea: "他们是比我任何人都亲近的家人。"
  npc_override_prt_cas_quests_16_1_they_only_own_manor_they_f435a4: "他们只拥有一个庄园。他们称自己是艾尔贝塔最好的家族？他们把瓦尔特家族当成什么了！"
  npc_override_prt_cas_quests_16_1_they_only_talk_about_bus_b92510: "他们只谈生意。我一点也不喜欢。我不想在这里感觉像在工作。"
  npc_override_prt_cas_quests_16_1_they_overlooking_somethi_9829da: "由于个人欲望，他们忽视了更大的事情。当然，我也恨他们，想要复仇，但这不能解决问题。"
  npc_override_prt_cas_quests_16_1_they_pretty_close_often_c9c476: "他们关系很亲密，经常一起锻炼。"
  npc_override_prt_cas_quests_16_1_they_provided_special_re_6b1be3: "他们为你的可信度提供了特别奖励金。"
  npc_override_prt_cas_quests_16_1_they_say_if_helmut_becom_d77aa1: "^0000cd他们说^000000如果赫尔穆特成为国王，他会入侵杀害他父母的国家，发动战争统一大陆。"
  npc_override_prt_cas_quests_16_1_they_seemed_hurry_you_kn_81de4d: "他们似乎很匆忙。你知道发生了什么事吗？"
  npc_override_prt_cas_quests_16_1_they_seemed_very_excited_74403f: "他们在华丽的地方看起来非常兴奋……"
  npc_override_prt_cas_quests_16_1_they_should_able_determi_12472c: "他们应该能够在听取他人的话后判断是非。此外，他们需要能够应对残酷的真相。"
  npc_override_prt_cas_quests_16_1_they_similar_age_so_been_239bda: "他们年龄相仿，所以如果他们是朋友就好了……"
  npc_override_prt_cas_quests_16_1_they_so_busy_preparing_b_241f46: "他们忙于准备宴会，我都没时间解释…… 结果我……"
  npc_override_prt_cas_quests_16_1_they_waiting_me_however_3c23c8: "他们在等我。然而，一个个见他们有点累。"
  npc_override_prt_cas_quests_16_1_they_when_did_you_get_3b86a2: "它们是…… 你什么时候拿到它们的……？"
  npc_override_prt_cas_quests_16_1_they_wouldn_t_listen_bf696b: "但他们不听。"
  npc_override_prt_cas_quests_16_1_thing_put_small_bottle_b_b1bcf9: "放在盒子里小瓶里的东西将改变战斗和战争的动态，尽管它还在测试阶段。"
  npc_override_prt_cas_quests_16_1_thing_wolf_must_trust_yo_9dd6de: "那东西……？沃尔夫一定信任你，亲爱的冒险者。或者可能是……"
  npc_override_prt_cas_quests_16_1_thing_you_brought_me_las_d50bc1: "你上次给我带来的东西相当不错。我对你的剥皮能力印象深刻。不如改行做剥皮大师？"
  npc_override_prt_cas_quests_16_1_things_haven_t_changed_m_c634ae: "事情没有太大变化，但看到这个地方变亮了，感觉还是很好。"
  npc_override_prt_cas_quests_16_1_things_i_been_through_ke_703f9d: "为了在远征营地保住蛋糕，我经历了那么多…… 我快要哭出来了…… 唉……"
  npc_override_prt_cas_quests_16_1_think_why_i_talk_about_5f67d7: "想想。我为什么^0000cd要谈论家具^000000？"
  npc_override_prt_cas_quests_16_1_thinking_him_makes_me_co_64e1c2: "想到他让我充满信心。"
  npc_override_prt_cas_quests_16_1_third_son_leave_house_ha_148e3c: "第三个儿子会离家去后街闲逛，但我们不能一直雇人监视他。"
  npc_override_prt_cas_quests_16_1_those_adventures_valuabl_e6ce29: "那些冒险是金钱买不到的宝贵经历。"
  npc_override_prt_cas_quests_16_1_those_intruders_must_bee_9205f0: "那些入侵者一定是为了^4d4dff伊米尔之心碎片^000000而来。"
  npc_override_prt_cas_quests_16_1_those_judging_eyes_as_sh_39114d: "那些评判的眼神像凶猛野兽一样锐利。如果我们发现一位看起来很棒的女士，我们会用纯粹的欣赏来赞美她的外表。"
  npc_override_prt_cas_quests_16_1_those_people_must_learne_f8af52: "那些人现在一定已经学到了。"
  npc_override_prt_cas_quests_16_1_those_princes_princesses_3c4bb8: "那些书里的王子和公主都是我的朋友。"
  npc_override_prt_cas_quests_16_1_threat_war_disappeared_h_2b41db: "战争的威胁已经消失。动荡时期的英雄不会诞生。黑暗在召唤我！"
  npc_override_prt_cas_quests_16_1_three_0c1119: "三！"
  npc_override_prt_cas_quests_16_1_three_times_left_once_ri_c89e18: "向左三次！向右一次！再向左一次！向前两次！"
  npc_override_prt_cas_quests_16_1_time_again_i_took_close_493953: "这次，我再次仔细看了看。"
  npc_override_prt_cas_quests_16_1_time_bb082f: "现在不是时候！"
  npc_override_prt_cas_quests_16_1_time_peter_participate_a_92d04f: "这次，彼得将作为海涅家族的代表参加。"
  npc_override_prt_cas_quests_16_1_time_service_acceptable_44bc3e: "这次，服务还可以接受。"
  npc_override_prt_cas_quests_16_1_time_waste_time_distingu_70eaa5: "现在不是浪费时间分辨是非的时候。我们该怎么办，亲爱的冒险者。"
  npc_override_prt_cas_quests_16_1_time_welcome_our_new_kin_3159e3: "现在是欢迎我们新国王的时候了。"
  npc_override_prt_cas_quests_16_1_time_you_join_banquet_671c11: "是你加入宴会的时候了。"
  npc_override_prt_cas_quests_16_1_time_you_need_stronger_c_4d2adb: "这次，你需要更强的凭证……"
  npc_override_prt_cas_quests_16_1_today_s_main_dish_grille_828751: "今天的主菜是特制酱汁烤狮鹫。外皮应该酥脆，而里面多汁！"
  npc_override_prt_cas_quests_16_1_today_special_day_so_i_f85e3b: "但今天是特别的日子。所以我晚点再惩罚你！"
  npc_override_prt_cas_quests_16_1_today_we_going_secret_jo_0e50bd: "今天，我们又要一起踏上秘密旅程！"
  npc_override_prt_cas_quests_16_1_today_wind_cold_smells_r_dcfa73: "今天，风很冷，闻起来有腐烂的味道。我感觉发生了什么事。"
  npc_override_prt_cas_quests_16_1_too_bad_if_you_finished_3b03a5: "太糟糕了。如果你完成了训练，你一定能够收获辛勤工作的成果。"
  npc_override_prt_cas_quests_16_1_too_early_lose_our_hope_7c87c0: "现在失去希望还为时过早。"
  npc_override_prt_cas_quests_16_1_too_much_cbc994: "这太过分了。"
  npc_override_prt_cas_quests_16_1_too_noisy_jurgen_cannot_b1a900: "太吵了，尤尔根无法好好休息！"
  npc_override_prt_cas_quests_16_1_touch_80c8ed: "不要碰那个。"
  npc_override_prt_cas_quests_16_1_tough_sword_protection_c75676: "坚韧的保护之剑 {0}。"
  npc_override_prt_cas_quests_16_1_training_involves_huntin_bf291b: "这个训练涉及狩猎50只140级或更高级别的{0}怪物。"
  npc_override_prt_cas_quests_16_1_training_richard_family_a68ebc: "理查德家族的训练与其他训练项目不同。"
  npc_override_prt_cas_quests_16_1_tristan_i_who_founded_ki_4e25c2: "特里斯坦一世，王国的建立者！"
  npc_override_prt_cas_quests_16_1_troops_immortality_they_0a9c13: "不朽军团…… 他们真的很强。请小心。"
  npc_override_prt_cas_quests_16_1_true_5549ba: "但这是真的。"
  npc_override_prt_cas_quests_16_1_true_8c2268: "那是真的。"
  npc_override_prt_cas_quests_16_1_true_winning_someone_s_h_96a5b3: "确实。赢得某人的心是最难的事。"
  npc_override_prt_cas_quests_16_1_true_you_most_beautiful_df6d29: "不是真的！你是这个地方最美丽的人。你是我唯一看到的人。"
  npc_override_prt_cas_quests_16_1_try_9440c3: "试试。"
  npc_override_prt_cas_quests_16_1_try_keep_together_listen_dd44f1: "试着保持专注！再听一遍！"
  npc_override_prt_cas_quests_16_1_try_keep_together_repeat_0308fc: "试着保持专注！再重复一遍！"
  npc_override_prt_cas_quests_16_1_try_whatever_takes_make_0fa4b5: "尽一切努力让它成功。"
  npc_override_prt_cas_quests_16_1_tsk_tsk_even_servant_sup_adc7f9: "啧啧，啧啧。即使是仆人也应该知道礼仪。"
  npc_override_prt_cas_quests_16_1_turned_out_way_009869: "事情已经变成这样了。"
  npc_override_prt_cas_quests_16_1_tut_59bcc1: "啧……"
  npc_override_prt_cas_quests_16_1_tut_i_am_worried_he_8fa848: "啧，我担心他缺乏社交能力。作为家族的继承人，他必须见很多人，你知道的。亲爱的冒险者，请原谅我儿子无礼。"
  npc_override_prt_cas_quests_16_1_twin_sisters_band_comple_c9d7e6: "乐队的双胞胎姐妹性格完全不同。然而，她们擅长模仿彼此。"
  npc_override_prt_cas_quests_16_1_two_4a908e: "二！"
  npc_override_prt_cas_quests_16_1_umm_4bcf25: "……嗯……"
  npc_override_prt_cas_quests_16_1_umm_b1216f: "嗯……"
  npc_override_prt_cas_quests_16_1_unauthorized_access_area_5ff8a9: "未经授权进入此区域受到限制。感谢您的合作。"
  npc_override_prt_cas_quests_16_1_undead_invading_village_2f84d0: "不死族入侵村庄，只要宫殿免受不死族侵袭，我就不会大惊小怪。"
  npc_override_prt_cas_quests_16_1_underground_dungeon_019f6d: "前往地下地牢……"
  npc_override_prt_cas_quests_16_1_underground_dungeon_they_60b3a6: "在地下地牢里，他们是……不。我不认为我应该在这里说。你进去后就会看到。"
  npc_override_prt_cas_quests_16_1_underground_dungeon_used_816dbd: "这个地下地牢曾经干净整洁。人类一段时间前来过之后，它变脏了，可能是因为他们没有做适当的清洁。"
  npc_override_prt_cas_quests_16_1_underling_get_me_torch_b_8748f0: "手下。给我拿监狱里燃烧明亮的火把。这里太暗了。我要把这个地方变得像我的家乡一样明亮。"
  npc_override_prt_cas_quests_16_1_underling_get_me_torch_b_ceeb4e: "手下。给我拿监狱里燃烧明亮的火把。我要把这个地方变得像我的家乡一样明亮。"
  npc_override_prt_cas_quests_16_1_underling_shame_i_ll_giv_c66506: "手下，很遗憾，但我会给你一些我从进来这里的人类身上拿走的东西。"
  npc_override_prt_cas_quests_16_1_uneasy_flow_magical_powe_74e7fd: "在扭曲空间附近可以感受到不安的魔力流动。"
  npc_override_prt_cas_quests_16_1_unfortunately_numbers_ke_125059: "不幸的是，数量不断增长，到了我们自己无法处理的程度。"
  npc_override_prt_cas_quests_16_1_unless_heavens_fall_ritu_2ed235: "除非天塌下来，否则仪式将安全完成，卢恩-米德加尔特将迎来新国王。"
  npc_override_prt_cas_quests_16_1_unlike_her_gaze_glaring_5f7249: "- 与她警惕地环顾四周时盯着桌子的眼神不同，她吃桌上食物的速度之快，几乎堪称艺术。-"
  npc_override_prt_cas_quests_16_1_unlike_his_words_he_real_6a0f84: "^0000ff与他的话不同，他似乎急于解释。^000000"
  npc_override_prt_cas_quests_16_1_unlike_what_he_looks_lik_9608bd: "与他看起来的样子不同，他有一颗如此细腻温暖的心。不过，如果事情失控，他肯定会发狂。"
  npc_override_prt_cas_quests_16_1_until_when_you_going_act_a6a959: "你要这样到什么时候？"
  npc_override_prt_cas_quests_16_1_use_1d4d43: "使用"
  npc_override_prt_cas_quests_16_1_use_cargo_service_2384ca: "使用货运服务"
  npc_override_prt_cas_quests_16_1_use_magic_restricted_are_a544ad: "这个区域限制使用魔法。我唯一能做的就是在这里激活大门……"
  npc_override_prt_cas_quests_16_1_use_service_2fcaed: "使用服务。"
  npc_override_prt_cas_quests_16_1_useful_looking_50587f: "这是一个看起来有用的{0}。"
  npc_override_prt_cas_quests_16_1_useless_punk_he_doesn_t_a225ae: "……那个没用的废物。他什么好事都不做！"
  npc_override_prt_cas_quests_16_1_valkyrie_realm_a89bd7: "女武神领域"
  npc_override_prt_cas_quests_16_1_veins_who_did_you_see_c9e780: "菲音斯？你在那里看到了谁？怎么看到的？"
  npc_override_prt_cas_quests_16_1_verification_credentials_e00d9f: "验证凭证！就这些！"
  npc_override_prt_cas_quests_16_1_very_demanding_guard_wor_aa97e6: "用我的美貌守护世界和平是非常苛刻的。"
  npc_override_prt_cas_quests_16_1_very_difficult_find_you_195f7e: "找到你非常困难，因为你不受任何地方束缚。"
  npc_override_prt_cas_quests_16_1_very_difficult_get_my_ha_66a09a: "拿到这个宴会的邀请函非常困难。"
  npc_override_prt_cas_quests_16_1_very_good_181cc7: "很好！"
  npc_override_prt_cas_quests_16_1_very_good_he_understands_2c38c8: "他能理解我想要什么，这很好。我想我必须开始一项新业务，至少不让威格纳失望。"
  npc_override_prt_cas_quests_16_1_very_important_take_enou_1156a3: "工作后充分休息非常重要。"
  npc_override_prt_cas_quests_16_1_very_soft_softer_than_pi_922071: "它非常柔软。比粉色花瓣还柔软。如果我用这些做花，裙子会感觉像一朵花。"
  npc_override_prt_cas_quests_16_1_village_office_which_thi_325150: "这是普隆德拉的第三个避难所，村办事处。"
  npc_override_prt_cas_quests_16_1_violeta_i_let_slide_time_355611: "维奥莱塔。这次我就放你一马。你现在该回去了。"
  npc_override_prt_cas_quests_16_1_violeta_i_told_you_stop_a36119: "维奥莱塔！我告诉过你停下。"
  npc_override_prt_cas_quests_16_1_violeta_watch_your_manne_a8c97b: "维奥莱塔，注意你的举止！"
  npc_override_prt_cas_quests_16_1_wa_hahaha_i_think_i_2c9fd3: "哇-哈哈哈！我想我给自己找了个嚣张的手下。"
  npc_override_prt_cas_quests_16_1_wait_cathedral_i_ll_look_4c115d: "在大教堂等着。我会找你的妻子。你在哪里弄丢她的？"
  npc_override_prt_cas_quests_16_1_wait_i_been_looking_flow_89f1eb: "等等，我一直在看这里的花。它们在眨眼吗？太神奇了！"
  npc_override_prt_cas_quests_16_1_wait_i_ll_get_ready_ab3e12: "等等，我准备一下。"
  npc_override_prt_cas_quests_16_1_wait_may_i_interrupt_5abb6d: "等等，我可以打断一下吗？"
  npc_override_prt_cas_quests_16_1_wait_maybe_s_alright_aft_a8c8d6: "等等。既然你是我的救命恩人，也许没关系。"
  npc_override_prt_cas_quests_16_1_wait_minute_1f5d60: "等一下。"
  npc_override_prt_cas_quests_16_1_wait_minute_6eb282: "等一下！"
  npc_override_prt_cas_quests_16_1_wait_minute_don_t_you_0deb72: "等一下。你不听我们说话吗？你说你会给报酬的。"
  npc_override_prt_cas_quests_16_1_wait_moment_i_know_where_15fe97: "等一下。我知道你要说什么。我们女仆经常遇到这种情况。"
  npc_override_prt_cas_quests_16_1_wait_phew_let_me_collect_1fb6d0: "等等，呼…… 让我重新振作起来……"
  npc_override_prt_cas_quests_16_1_wait_ready_yet_87fb88: "等等，还没准备好。"
  npc_override_prt_cas_quests_16_1_wait_second_2dc9bb: "等一下。"
  npc_override_prt_cas_quests_16_1_wait_unfair_no_i_taken_206252: "等等，这不公平！不是吗？我是为了你才拿的，姐姐。"
  npc_override_prt_cas_quests_16_1_wait_where_did_go_i_0b9e13: "等等？它去哪里了？我想我在跑的时候丢了工具包。"
