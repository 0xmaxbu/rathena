  npc_override_prt_cas_quests_16_1_i_refuse_ordinariness_feea36: "我拒绝平庸。"
  npc_override_prt_cas_quests_16_1_i_remember_heir_your_fam_da9347: "我记得，但你家族的继承人最近很忙。"
