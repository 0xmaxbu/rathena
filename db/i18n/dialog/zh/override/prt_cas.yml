  npc_override_prt_cas_quests_16_1_yes_s_here_a05f00: "是的，在这里。"
  npc_override_prt_cas_quests_16_1_yes_s_she_lined_up_90597a: "是的，就是它！她把这些石头排在窗边，喜欢看它们在阳光下闪闪发光。"
  npc_override_prt_cas_quests_16_1_yes_s_why_i_am_cef70b: "是的。这就是为什么我在这里检查、教导和领导他们。"
  npc_override_prt_cas_quests_16_1_yes_she_964b69: "是的，她是。"
  npc_override_prt_cas_quests_16_1_yes_sometime_even_betwee_13ec1d: "是的。但有时即使是家人之间也很难见面，他们必须请人传话。"
  npc_override_prt_cas_quests_16_1_yes_thank_you_please_tak_1ba5df: "是的。谢谢。请保重。"
  npc_override_prt_cas_quests_16_1_yes_thank_you_sparing_me_443079: "是的。谢谢你抽出时间。"
  npc_override_prt_cas_quests_16_1_yes_they_cute_pretty_dif_043b5f: "是的。它们很可爱，但很难处理。"
  npc_override_prt_cas_quests_16_1_yes_true_he_been_wanderi_34ae90: "是的，确实他一直在战场上徘徊。"
  npc_override_prt_cas_quests_16_1_yes_well_hum_you_8c2a66: "是的…… 嗯…… 嗯…… 你是……"
  npc_override_prt_cas_quests_16_1_yes_what_brought_you_her_407ff3: "是的，它是。什么风把你吹到这里。既然所有人都去了普隆德拉，你现在见不到主人了。"
