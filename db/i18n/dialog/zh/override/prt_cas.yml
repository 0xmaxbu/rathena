  npc_override_prt_cas_quests_16_1_you_collected_small_kids_88a6fe: "你召集了小孩子，扮演了领袖。你玩得很开心吗？"
  npc_override_prt_cas_quests_16_1_you_come_back_later_afte_29d98c: "你下午再来好吗？"
  npc_override_prt_cas_quests_16_1_you_come_here_invitation_ebe7e5: "你可以凭邀请函来这里。来这里并不难。"
  npc_override_prt_cas_quests_16_1_you_come_here_there_isn_ba25f7: "你来了，但我没有太多可以告诉你的。"
  npc_override_prt_cas_quests_16_1_you_completed_cleaning_m_0cf7b3: "你出色地完成了清洁任务！"
