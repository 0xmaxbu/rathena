  npc_override_prt_cas_quests_16_1_what_you_want_326403: "……你想要什么？"
  npc_override_prt_cas_quests_16_1_what_you_want_9b4b57: "你想要什么？"
  npc_override_prt_cas_quests_16_1_what_you_you_d_better_f0532b: "你能做什么？你最好等到你姐姐消气…… 或者，你可以试着给她一些她喜欢的东西……"
  npc_override_prt_cas_quests_16_1_what_your_language_even_9a2ec1: "你说的什么话。^0000cd即使你出去和低等人混在一起，^000000你也不必把你住的地方变成肮脏的后街。"
  npc_override_prt_cas_quests_16_1_whatever_room_consciousn_f695fa: "不管意识之室里是什么，都被拿走了，对吧？"
  npc_override_prt_cas_quests_16_1_whatever_she_lost_must_v_1d0137: "不管她丢了什么，对她来说一定非常珍贵。我觉得她最好找人帮她找。"
  npc_override_prt_cas_quests_16_1_when_did_i_teach_you_53b37d: "我什么时候那样教你的？你敢说是跟我学的！"
  npc_override_prt_cas_quests_16_1_when_helmut_participated_4aa069: "当赫尔穆特参加皇家议会时，我不在乎。反正他很天真，不知道如何从别人那里获得好感和信任。"
  npc_override_prt_cas_quests_16_1_when_human_feels_empty_s_0f9cb0: "当一个人感到空虚时，他/她倾向于填满它。"
  npc_override_prt_cas_quests_16_1_when_i_about_leave_after_6d53eb: "当我向主厨报告完准备离开时，我被马克的兄弟抓住了。"
  npc_override_prt_cas_quests_16_1_when_i_applied_become_gu_373294: "当我申请成为守卫时，我想用自己的双手保护宫殿的安全……"
  npc_override_prt_cas_quests_16_1_when_i_became_wanted_man_26c57d: "当我成为通缉犯时，我想回去说出真相。然而，信上说^0000cd无论如何都不要回来^000000。我不能违背主人最后的命令。"
  npc_override_prt_cas_quests_16_1_when_i_first_met_orint_758932: "当我第一次见到奥林特时，我以为他冷漠无情。然而，他原来是一个具有非凡专注力和占有欲的人。"
  npc_override_prt_cas_quests_16_1_when_i_going_go_back_f4cae7: "当我完成任务准备回去时，他给我寄了很多钱和一封^0000cd信^000000。上面写着^0000cd不要回到卢恩-米德加尔特^000000。"
  npc_override_prt_cas_quests_16_1_when_i_looking_around_fi_6dcb44: "当我在四处寻找给迪乌的食物时，有人把我带到主厨那里，让我在那里工作！"
  npc_override_prt_cas_quests_16_1_when_i_reported_contribu_1540c4: "当我被告知你的贡献时，一个问题浮现在我的脑海。如果一个自由漫游的冒险者参与严格的训练系统会发生什么？我很好奇。"
  npc_override_prt_cas_quests_16_1_when_i_see_person_i_091a11: "当我看到一个人时，我需要在一瞬间确定钱包的位置、持有的任何武器、目标的机智以及目标能跑多快。这份工作需要这种特殊素质。"
  npc_override_prt_cas_quests_16_1_when_i_think_front_threa_be2eaf: "但当我想到前线受到怪物威胁时，我感到心情沉重。当然，我相信我的人正在努力保护领土。"
  npc_override_prt_cas_quests_16_1_when_i_told_him_i_e37069: "当我告诉他我会填补她的位置时，他说已经有足够的男侍从了，^0000cd他需要一个女仆^000000，在厨房工作和打扫。"
  npc_override_prt_cas_quests_16_1_when_i_told_person_who_2f6bfa: "当我告诉宫殿里负责管理女仆的人时，他说，他不在乎我姐姐违反合同跑掉，^0000cd只要我能找人填补她的位置^000000。"
  npc_override_prt_cas_quests_16_1_when_jurgen_come_out_931a41: "尤尔根什么时候出来？"
  npc_override_prt_cas_quests_16_1_when_my_turn_see_him_2b6c64: "什么时候轮到我见他？"
  npc_override_prt_cas_quests_16_1_when_people_gathered_nig_a38980: "当人们聚集起来，夜幕降临，埋在普隆德拉地下的不死族开始苏醒。"
  npc_override_prt_cas_quests_16_1_when_ritual_take_place_9d751a: "仪式什么时候举行？"
  npc_override_prt_cas_quests_16_1_when_she_come_back_7493d1: "她什么时候回来？"
  npc_override_prt_cas_quests_16_1_when_special_assistant_c_8a8e72: "这位特别助理厨师什么时候到这里？"
  npc_override_prt_cas_quests_16_1_when_special_s_assistant_73b5a8: "这位特别助理厨师什么时候到这里？"
  npc_override_prt_cas_quests_16_1_when_star_disappears_its_510d7b: "当一颗星星消失时，它的卫星也会失去名字。更糟糕的是，我是一个罪人，没能 my star。"
  npc_override_prt_cas_quests_16_1_when_they_pretend_one_pe_5b3edf: "当他们假装成一个人时，他们看起来真的像死灵。"
  npc_override_prt_cas_quests_16_1_when_they_visit_foreign_922508: "当他们访问外国时。赫尔穆特·罗根堡受到了震惊，从那以后他一直在战场上徘徊。"
  npc_override_prt_cas_quests_16_1_when_time_comes_court_ma_833744: "到时候，宫廷魔法师会来引导你。在那之前你可以享受宴会。"
  npc_override_prt_cas_quests_16_1_when_we_arrived_site_are_140184: "当我们到达现场时，区域被封锁，不允许进入，尽管我的儿子和儿媳在里面。"
  npc_override_prt_cas_quests_16_1_when_we_young_we_played_c4bc90: "我们年轻时一起玩。他们给我读书。"
  npc_override_prt_cas_quests_16_1_when_we_young_we_used_603f43: "我们年轻时经常聊天，度过美好的时光。看看这些。我们以前到处跑找这些东西。你还记得这块石头吗？你喜欢看它们在阳光下闪闪发光。"
  npc_override_prt_cas_quests_16_1_when_you_arrive_there_se_b495de: "当你到达时，会有接待的仆人。你可以在那里出示邀请函。"
  npc_override_prt_cas_quests_16_1_when_you_come_back_use_f5649a: "当你回来时，用这个。你可以瞬间回到普隆德拉。"
  npc_override_prt_cas_quests_16_1_when_you_disconcerted_yo_981738: "当你慌乱时，你找不到话说。"
  npc_override_prt_cas_quests_16_1_when_you_go_palace_serva_b7d9fd: "当你去宫殿时，负责的仆人会认出你。"
  npc_override_prt_cas_quests_16_1_when_you_tired_palate_do_3637a5: "当你累了时，味觉不能正常工作。"
  npc_override_prt_cas_quests_16_1_when_you_touch_blank_pag_e0690c: "当你触摸克罗内克给你的书的空白页时，"
  npc_override_prt_cas_quests_16_1_where_candidate_throne_3a4af5: "王位候选人在哪里？"
  npc_override_prt_cas_quests_16_1_where_did_person_who_sup_04c981: "监督排队的人去哪里了？"
  npc_override_prt_cas_quests_16_1_where_did_you_drop_medic_19b8d8: "你把药掉在哪里了？"
  npc_override_prt_cas_quests_16_1_where_he_e3eaee: "他在哪里？"
  npc_override_prt_cas_quests_16_1_where_i_should_stay_7d890c: "这是我应该待的地方。"
  npc_override_prt_cas_quests_16_1_where_i_should_stay_here_1f4b83: "这是我应该待的地方。在这里我可以^0000cd安全地保护更多人^000000。"
  npc_override_prt_cas_quests_16_1_where_jurgen_now_f8cda4: "^0000cd尤尔根^000000现在在哪里？"
  npc_override_prt_cas_quests_16_1_where_skia_7623d8: "斯基亚在哪里？"
  npc_override_prt_cas_quests_16_1_where_where_035c66: "哪里…… 它在哪里？"
  npc_override_prt_cas_quests_16_1_where_you_before_wait_mo_9b9ac0: "你之前在哪里？等一下。让我去给你拿。"
  npc_override_prt_cas_quests_16_1_where_you_going_601ccc: "你打算怎么处理这个……"
  npc_override_prt_cas_quests_16_1_where_your_guardian_knig_c39ced: "你的守护骑士在哪里，伊森奥诺？"
  npc_override_prt_cas_quests_16_1_whether_information_he_t_071fa1: "不管他的信息是真是假，我宁愿去拜访他。谢谢你的信息。"
  npc_override_prt_cas_quests_16_1_whether_willing_70d15c: "不管愿不愿意……"
