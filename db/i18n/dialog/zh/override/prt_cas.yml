  npc_override_prt_cas_quests_16_1_oh_i_like_thank_you_48fc78: "哦，我想感谢你的辛勤工作。给你。"
  npc_override_prt_cas_quests_16_1_oh_i_m_sorry_i_8d627e: "哦，对不起。我想我说得太多了。"
  npc_override_prt_cas_quests_16_1_oh_i_mean_b2452a: "哦，我是说……"
  npc_override_prt_cas_quests_16_1_oh_i_nothing_else_i_b2387a: "哦，我没什么别的事可做。我太无聊了。我应该做点什么。"
  npc_override_prt_cas_quests_16_1_oh_i_really_cannot_go_d305c5: "哦，我真的不能和他出去。好吧，确实有一个原因让我无法接受这份感情。我想我是否应该告诉你这个。"
  npc_override_prt_cas_quests_16_1_oh_i_remember_now_i_36ff6c: "哦，我想起来了。我记得在她的房间里看到它们闪闪发光。"
  npc_override_prt_cas_quests_16_1_oh_i_remember_yes_there_2c00bf: "哦，我想起来了。是的，有一群人像他们想要的那样自由地在地下地牢里走动。"
