  npc_override_prt_cas_quests_16_1_i_never_talk_them_like_257c4d: "我从未这样和他们说过话，你知道的。"
  npc_override_prt_cas_quests_16_1_i_no_idea_how_they_d81b0b: "我不知道他们是怎么进来的，但我绝对肯定他们是监狱脏乱的罪魁祸首。"
