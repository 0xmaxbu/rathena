  npc_override_prt_cas_quests_16_1_oh_i_felt_tipsy_asked_075379: "……哦…… 我感到微醺，让一位侍从带我去可以休息的地方。"
  npc_override_prt_cas_quests_16_1_oh_i_forgotten_mention_i_91a91e: "哦，我忘了提。我只强化装备在左侧插槽的物品。强化时请装备在左侧插槽。"
  npc_override_prt_cas_quests_16_1_oh_i_guess_i_should_931154: "哦，我想我应该改变我的清洁区域，以免撞到他。"
  npc_override_prt_cas_quests_16_1_oh_i_guess_you_should_641153: "哦…… 我想你应该先学会如何骑大嘴鸟。"
