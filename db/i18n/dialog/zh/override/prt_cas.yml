  npc_override_prt_cas_quests_16_1_please_send_them_her_tel_85a1d3: "请把它们送给她，告诉我玛丽今天怎么样。我很伤心她不再来这里打扫房间了。"
  npc_override_prt_cas_quests_16_1_please_so_i_am_sorry_cfc16a: "请，就这样做吧。我为之前的不良举止道歉。"
  npc_override_prt_cas_quests_16_1_please_stop_e68feb: "请停止。"
  npc_override_prt_cas_quests_16_1_please_take_care_lowen_s_cc7069: "请照顾好洛文。她就像普隆德拉的吉祥物一样。"
  npc_override_prt_cas_quests_16_1_please_take_care_our_son_db1fa6: "请照顾好我们的儿子，艾萨克。"
  npc_override_prt_cas_quests_16_1_please_take_good_care_st_b961d3: "请好好保管这些东西。如果你归还它们，他会再把我送到这里来的。"
  npc_override_prt_cas_quests_16_1_please_tell_agnes_i_am_c14670: "请告诉阿格妮丝我很抱歉不能和她一起去宴会。"
  npc_override_prt_cas_quests_16_1_please_tell_him_i_apprec_d891ef: "请告诉他我很感激。"
  npc_override_prt_cas_quests_16_1_please_tell_him_i_give_313ad7: "请告诉他'^0000cd我放弃战争，将继承人的位置传给沃尔夫^000000'。"
  npc_override_prt_cas_quests_16_1_please_tell_him_work_har_0726cc: "请告诉他努力工作！"
  npc_override_prt_cas_quests_16_1_please_tell_me_if_you_139811: "请告诉我。如果你有一个尤尔根能理解的好理由，他就不会再打扰你了，玛丽。"
  npc_override_prt_cas_quests_16_1_please_tell_me_where_her_57849e: "如果你知道的话，请告诉我^4d4dff参加远征的英雄们在哪里^000000。"
  npc_override_prt_cas_quests_16_1_please_tell_tamarin_8baf76: "{0}，请告诉塔马林那个。"
  npc_override_prt_cas_quests_16_1_please_visit_our_manor_a_18e126: "宴会结束后请到我们庄园来。"
  npc_override_prt_cas_quests_16_1_please_visit_our_manor_t_7f3248: "如果你有时间，也请到我们庄园来，亲爱的冒险者。永远欢迎你。"
  npc_override_prt_cas_quests_16_1_please_we_running_out_ti_1e5f35: "请。我们快没时间了。"
  npc_override_prt_cas_quests_16_1_please_your_best_as_alwa_3b6d23: "请一如既往地尽力而为。"
  npc_override_prt_cas_quests_16_1_pleasure_s_been_while_i_784a3a: "荣幸。我很久没在这里看到人类了。"
  npc_override_prt_cas_quests_16_1_po_next_head_family_taki_80f0b6: "波，家族的下一任首领，正在休息。请稍后再来。"
  npc_override_prt_cas_quests_16_1_poor_maid_could_hospital_2b765b: "或者，那个可怜的女仆明天可能会住院。不管怎样，我明白了。"
  npc_override_prt_cas_quests_16_1_possible_a65ee3: "这可能吗？"
  npc_override_prt_cas_quests_16_1_powder_made_shining_plan_a6f724: "由发光植物制成的粉末"
  npc_override_prt_cas_quests_16_1_preparation_banquet_does_87494b: "宴会的准备工作直到宴会结束才算结束。"
  npc_override_prt_cas_quests_16_1_prepare_different_situat_0e6ef0: "为了应对不同的情况，比如发色和衣服颜色，我需要^0000cd很多裙子^000000。你明白我的意思吗？"
