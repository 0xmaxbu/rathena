  npc_override_prt_cas_quests_16_1_your_feeling_must_been_h_af2782: "你的感情一定被你的兄弟们伤害了。"
  npc_override_prt_cas_quests_16_1_your_first_time_visit_wi_5a9690: "这是你第一次拜访威格纳家族吗？"
  npc_override_prt_cas_quests_16_1_your_hands_seem_empty_8b7d32: "你手上好像空空的。"
  npc_override_prt_cas_quests_16_1_your_life_depends_your_a_1a8941: "你的性命取决于你的回答。既然你知道我是谁，我有足够的理由杀了你。"
  npc_override_prt_cas_quests_16_1_your_plan_develop_power_f6e3b3: "你的计划是发展家族势力并统一大陆。然后呢？你又能得到什么？成就？复仇？"
  npc_override_prt_cas_quests_16_1_your_voice_too_loud_7bcfa4: "你的声音太大了！"
