  npc_override_prt_cas_quests_16_1_only_ones_who_know_truth_da1103: "^4d4dff只有知道真相的人才能阅读这个。^000000"
  npc_override_prt_cas_quests_16_1_only_party_leader_enter_47bc38: "只有队长可以进入。^000000"
  npc_override_prt_cas_quests_16_1_only_party_leader_enter_ad030f: "^4d4dff只有队长可以进入副本[意识之室]。^000000"
  npc_override_prt_cas_quests_16_1_only_party_leader_enter_d9e6da: "^4d4dff只有队长可以进入副本[祝福仪式]。^000000"
  npc_override_prt_cas_quests_16_1_only_party_leader_procee_c49f41: "只有队长可以进行纪念活动。组队后再试一次。^000000"
  npc_override_prt_cas_quests_16_1_only_people_permission_a_5d11f6: "只有获得许可的人才能在这里。"
  npc_override_prt_cas_quests_16_1_only_people_permission_e_40eb6d: "只有获得许可的人才能进入这个地方。请离开。"
  npc_override_prt_cas_quests_16_1_opportunities_found_time_4da58c: "危机中发现机遇。"
  npc_override_prt_cas_quests_16_1_order_keep_smooth_relati_7ab0c5: "为了与他们保持良好关系，你可以快点去那里。"
  npc_override_prt_cas_quests_16_1_originally_i_should_i_th_81f3ff: "本来我应该那样做，但我想我需要和迈尔认真谈谈。所以我想请你帮我做那件事……"
  npc_override_prt_cas_quests_16_1_originally_wolf_supposed_9f1b32: "本来沃尔夫应该和我一起去，但他变得很忙，所以取消了。"
