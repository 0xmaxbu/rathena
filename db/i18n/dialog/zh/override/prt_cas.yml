  npc_override_prt_cas_quests_16_1_he_come_empty_hands_079577: "他空手而来。"
  npc_override_prt_cas_quests_16_1_he_come_out_today_5e46ed: "他今天会出来吗？"
  npc_override_prt_cas_quests_16_1_he_comes_here_say_good_94985a: "他来这里道早安，要么帮我干活，要么做别的事。"
  npc_override_prt_cas_quests_16_1_he_complainer_he_s_harml_03056d: "他可能爱抱怨，但他没有恶意。我想你会和他相处得很好的。"
  npc_override_prt_cas_quests_16_1_he_could_somewhere_banqu_f255b8: "他可能在宴会厅的某个地方。"
  npc_override_prt_cas_quests_16_1_he_didn_t_make_good_e0fd01: "他的第一印象不好，但他不是坏孩子……"
  npc_override_prt_cas_quests_16_1_he_doesn_t_any_elements_be31f8: "他没有任何符合家族合法性的要素。他不能被选为候选人。"
  npc_override_prt_cas_quests_16_1_he_doesn_t_even_know_1c1c9b: "他甚至不知道自己的立场，却仍然如此渴望权力。"
  npc_override_prt_cas_quests_16_1_he_enjoys_talking_advent_c76d34: "他喜欢和冒险者聊天。"
  npc_override_prt_cas_quests_16_1_he_even_lift_finger_boss_102052: "他甚至懒得动一根手指，对每个人发号施令。他认为世界围绕着他转。"
  npc_override_prt_cas_quests_16_1_he_explain_better_than_m_65b6fa: "他会比我解释得更好。"
  npc_override_prt_cas_quests_16_1_he_given_up_position_e9b025: "他已经放弃了那个位置。"
  npc_override_prt_cas_quests_16_1_he_given_up_royal_author_08826e: "他就这样放弃了王权！"
  npc_override_prt_cas_quests_16_1_he_go_about_how_we_2d0b3c: "他会喋喋不休地说我们维格纳家族不需要连小事都处理不好的人，管理能力是我们家族最大的美德……光是想想就害怕。"
  npc_override_prt_cas_quests_16_1_he_great_boy_shame_since_55d91c: "他曾是个好孩子。很遗憾，因为他是王位的完美候选人。"
  npc_override_prt_cas_quests_16_1_he_guide_you_59a4b1: "他会引导你。"
  npc_override_prt_cas_quests_16_1_he_he_busy_i_couldn_fc27cb: "他……他很忙，我没能和他说太多话……"
  npc_override_prt_cas_quests_16_1_he_head_family_as_he_49cc70: "他今年成年后将正式成为家主。目前，我负责家族生意。"
  npc_override_prt_cas_quests_16_1_he_hello_7fe198: "他……你好……"
  npc_override_prt_cas_quests_16_1_he_just_150e0f: "他只是……"
  npc_override_prt_cas_quests_16_1_he_just_stopped_went_out_e97dcc: "他只是顺道过来，然后又出去了……"
  npc_override_prt_cas_quests_16_1_he_lineal_family_member_e58c5d: "他是海涅家族的直系成员。"
  npc_override_prt_cas_quests_16_1_he_loses_himself_as_if_fe533b: "他迷失了自己，仿佛内心空虚。"
  npc_override_prt_cas_quests_16_1_he_lying_bed_deeply_woun_a3e56f: "他躺在床上，伤势严重。"
  npc_override_prt_cas_quests_16_1_he_making_fun_me_working_c94035: "他嘲笑我在这里工作！太棒了！"
  npc_override_prt_cas_quests_16_1_he_manages_entrance_114b02: "他负责管理入口。"
  npc_override_prt_cas_quests_16_1_he_member_richard_family_7cf8e8: "他本身就是理查德家族的成员。他是一位杰出的战士。"
  npc_override_prt_cas_quests_16_1_he_met_people_guild_went_191747: "他见了公会的人，然后去看他们了……"
  npc_override_prt_cas_quests_16_1_he_most_wigner_like_one_a87a04: "他是孩子们中最像维格纳的人。"
  npc_override_prt_cas_quests_16_1_he_must_been_disheartene_d89860: "他的权利被忽视，一定很沮丧。"
  npc_override_prt_cas_quests_16_1_he_must_been_drunk_aa6ee8: "他一定不是喝醉了。"
  npc_override_prt_cas_quests_16_1_he_must_headed_royal_vil_53f335: "他一定去了皇家别墅。我们往那边走。"
  npc_override_prt_cas_quests_16_1_he_must_library_a00b48: "他一定在图书馆。"
  npc_override_prt_cas_quests_16_1_he_must_responding_whate_b87172: "他现在一定对任何话都没有反应。"
  npc_override_prt_cas_quests_16_1_he_must_sensed_something_ef4ffe: "他快要被选为国王时一定感觉到了什么才会那样行动……现在没有办法知道了……"
  npc_override_prt_cas_quests_16_1_he_must_somewhere_near_d_f7daa2: "他一定在^0000cd区公所附近^000000的某个地方。"
  npc_override_prt_cas_quests_16_1_he_must_somewhere_pronte_3853e3: "他一定在普隆德拉的某个地方。"
  npc_override_prt_cas_quests_16_1_he_must_somewhere_pronte_862db2: "他一定在普隆德拉的某个地方。为什么不去^0000cd区公所附近^000000看看呢？大多数商店都在那里。"
  npc_override_prt_cas_quests_16_1_he_must_staying_quietly_8c22b5: "他被判纪律禁闭，一定在安静地待着。"
  npc_override_prt_cas_quests_16_1_he_my_bodyguard_9bda54: "而且他是我的保镖。"
  npc_override_prt_cas_quests_16_1_he_my_brother_he_other_5a2b48: "他是我哥哥，但他和其他哥哥都很幼稚。"
  npc_override_prt_cas_quests_16_1_he_never_acted_bring_dis_8d5321: "他从未做出给海涅家族蒙羞的事。"
  npc_override_prt_cas_quests_16_1_he_nillem_c1454e: "他是尼勒姆吗？"
  npc_override_prt_cas_quests_16_1_he_one_charge_weapons_us_528c46: "他负责守卫使用的武器。我担心这会不会给他的工作带来麻烦。"
  npc_override_prt_cas_quests_16_1_he_pretty_annoying_i_kno_3293a0: "他可能很烦人，我知道。他会要求做一个逼真的娃娃，甚至试图勾搭他的女同事。"
  npc_override_prt_cas_quests_16_1_he_s_really_taking_time_94b841: "他真的在仔细看你带来的红眼睛。"
  npc_override_prt_cas_quests_16_1_he_said_good_give_up_fcf541: "他说放弃战争是好事。迈尔非常信任你。他说如果你需要他的帮助，他会尽力帮你。"
  npc_override_prt_cas_quests_16_1_he_said_he_connect_crack_1f315e: "他说他会强行连接维度裂缝。"
  npc_override_prt_cas_quests_16_1_he_said_he_sensed_huge_902a48: "他说^4d4dff他在王室往事中感应到巨大的魔力扭曲，我们可以依靠他^000000。"
  npc_override_prt_cas_quests_16_1_he_said_substitute_so_go_761e85: "他说替补非常帅，我看到他一定会喜欢。我确定他很帅，因为迈尔很挑剔。"
  npc_override_prt_cas_quests_16_1_he_seems_dead_3585c6: "他似乎死了。"
  npc_override_prt_cas_quests_16_1_he_sent_me_excuse_being_b62338: "他以忙为借口派我来。乔纳森，我会找你算账的。"
  npc_override_prt_cas_quests_16_1_he_should_get_us_both_2d48d0: "他应该会的。如果^0000cd我们要杀死吉奥博格家族皇位候选人^000000的事实泄露出去，我们两个都会惹上麻烦。"
  npc_override_prt_cas_quests_16_1_he_so_handsome_i_wonder_7035ca: "他真帅。我想知道他来自哪个家族。"
  npc_override_prt_cas_quests_16_1_he_sorrow_saying_how_dif_be3945: "他悲伤地说，他一生中最想要的第一样东西是多么难以得到。"
  npc_override_prt_cas_quests_16_1_he_spread_bad_rumor_abou_a608f7: "他散布了关于家族的坏传闻，但我认为他是出于绝望才这么做的。"
  npc_override_prt_cas_quests_16_1_he_started_again_fe7372: "他又开始了。"
  npc_override_prt_cas_quests_16_1_he_still_acts_like_child_8a5337: "但他仍然像个孩子一样。"
  npc_override_prt_cas_quests_16_1_he_told_me_he_could_b0d656: "他告诉我他可以帮忙，并在意识之室里安装了一些东西。"
  npc_override_prt_cas_quests_16_1_he_told_me_light_champag_a22dfd: "他告诉我那是清淡的香槟……"
  npc_override_prt_cas_quests_16_1_he_treated_solders_worki_d6bd3b: "他平等地对待士兵和工作的孩子们。所以每个人都喜欢他，追随他。"
  npc_override_prt_cas_quests_16_1_he_understood_everything_8bc732: "他什么都明白。他相信维格纳会尽快找到新物品。"
  npc_override_prt_cas_quests_16_1_he_used_some_really_dire_9e211c: "他用了一些非常直接的语言。多么维格纳式的作风，因为他重视效率……哈哈哈……"
  npc_override_prt_cas_quests_16_1_he_waiting_there_go_pron_fab288: "他在那里等着，一收到伊森纳诺的召唤就立即前往普隆德拉。"
  npc_override_prt_cas_quests_16_1_he_wants_you_these_5b0d73: "他想让你拥有这些。"
  npc_override_prt_cas_quests_16_1_he_who_top_you_399665: "他！谁能比得上你？"
  npc_override_prt_cas_quests_16_1_he_young_man_who_been_2bca15: "他是一个在村子里闲逛了一段时间的年轻人。他似乎工作很勤奋……"
  npc_override_prt_cas_quests_16_1_he_younger_than_me_alway_afb29f: "他比我年轻，却总是想说教！"
  npc_override_prt_cas_quests_16_1_he_youngest_child_wigner_226a45: "他是维格纳家族最小的孩子。不像我和姐姐对家族生意不感兴趣，他是一个天才，将为维格纳家族增光。"
  npc_override_prt_cas_quests_16_1_head_chef_been_waiting_y_187f33: "主厨一直在等你。他现在很生气！"
  npc_override_prt_cas_quests_16_1_head_chef_f04605: "主厨！"
  npc_override_prt_cas_quests_16_1_head_chef_looking_me_set_7c6656: "主厨正用杀人的眼神看着我！"
  npc_override_prt_cas_quests_16_1_heart_rune_midgarts_df3b0a: "在卢恩-米德加尔特的中心！"
  npc_override_prt_cas_quests_16_1_heart_work_those_guys_734869: "心？它对^0000cd那些家伙^000000有效吗？"
  npc_override_prt_cas_quests_16_1_heh_b22285: "嘿！"
  npc_override_prt_cas_quests_16_1_heh_makes_me_feel_any_6af242: "嘿，这并没有让我感觉好一些。我想我因为饿了感觉更糟了。哦，我的肚子在叫……我感觉不舒服……"
  npc_override_prt_cas_quests_16_1_hehe_146725: "嘿嘿——"
  npc_override_prt_cas_quests_16_1_hehe_i_think_s_all_f03bb0: "嘿嘿—— 我想一切都好，因为不用看到那些凶神恶煞的人。对吧？"
  npc_override_prt_cas_quests_16_1_hehe_thank_you_dear_adve_e696d6: "嘿嘿……谢谢你，亲爱的冒险者。"
  npc_override_prt_cas_quests_16_1_heine_family_get_approva_418423: "^4d4dff海涅家族将获得进入'王室往事'的批准^000000，对吧？"
  npc_override_prt_cas_quests_16_1_heine_residence_next_ner_13a884: "海涅宅邸就在纳里乌斯家族旁边。"
  npc_override_prt_cas_quests_16_1_heir_throne_determined_96ccfb: "王位继承人将被确定。"
  npc_override_prt_cas_quests_16_1_heir_walther_family_isen_2cb7f6: "这是^0000cd沃尔特家族的继承人伊森纳诺^000000。他是我的侄子。"
  npc_override_prt_cas_quests_16_1_hello_5a63b6: "你好。{0}。"
  npc_override_prt_cas_quests_16_1_hello_69342c: "你好！"
  npc_override_prt_cas_quests_16_1_hello_756679: "你好……"
  npc_override_prt_cas_quests_16_1_hello_7f5867: "你好。{0}。"
  npc_override_prt_cas_quests_16_1_hello_9b56d5: "你好。"
  npc_override_prt_cas_quests_16_1_hello_adventurers_i_am_h_80bfd5: "你好，冒险者们。很荣幸你们能来到^0000cd罗根堡^000000。我是^0000cd马克西米利安·罗根堡^000000。"
  npc_override_prt_cas_quests_16_1_hello_dear_adventurer_we_bdf479: "你好，亲爱的冒险者。欢迎！"
  npc_override_prt_cas_quests_16_1_hello_ec6b08: "你好？"
  npc_override_prt_cas_quests_16_1_hello_howdy_06d949: "你好。{0} 你好。"
  npc_override_prt_cas_quests_16_1_hello_i_am_adventurer_in_21f8a6: "你好，我是受邀参加皇家宴会的冒险者。你是今天下午打扫维格纳宅邸的女仆吗？"
  npc_override_prt_cas_quests_16_1_hello_i_am_helmut_roegen_776ea8: "你好，我是^0000cd赫尔穆特·罗根堡^000000。"
  npc_override_prt_cas_quests_16_1_hello_i_am_isaac_wigner_b5190c: "你好？我是艾萨克·维格纳。让你来拜访这样一个无聊的家庭真是麻烦。希望如果你能的话，在这里玩得开心……"
  npc_override_prt_cas_quests_16_1_hello_i_m_invited_banque_69107e: "你好，我受邀参加这个宴会。{0} 很高兴见到你。"
  npc_override_prt_cas_quests_16_1_hello_isaac_wigner_ce7c61: "你好，艾萨克·维格纳。"
  npc_override_prt_cas_quests_16_1_hello_kafra_service_e1fce2: "你好。这里是卡普拉服务。"
  npc_override_prt_cas_quests_16_1_hello_kids_7c664e: "你好，孩子们？"
  npc_override_prt_cas_quests_16_1_hello_long_time_no_see_b805e4: "你好，好久不见。抱歉上次给你添麻烦了。幸运的是，盒子的事情已经圆满解决了。"
  npc_override_prt_cas_quests_16_1_hello_manor_walther_fami_c0feb3: "你好？这是沃尔特家族的庄园吗？"
  npc_override_prt_cas_quests_16_1_hello_my_name_jurgen_wig_b3ebd9: "你好。我的名字是^0000cd尤尔根·维格纳^000000。很高兴见到你。"
  npc_override_prt_cas_quests_16_1_hello_nice_meet_you_45d482: "你好，很高兴见到你。"
  npc_override_prt_cas_quests_16_1_hello_singing_birds_pret_98c838: "你好，歌唱的鸟儿和美丽的花朵。"
  npc_override_prt_cas_quests_16_1_hello_you_moment_28e9b1: "你好。你有空吗？"
  npc_override_prt_cas_quests_16_1_helmut_left_front_withou_495b0b: "赫尔穆特什么也没说就去了前线。迈尔也离家出走了。我想他们从阿格涅斯的话中感觉到了什么。"
  npc_override_prt_cas_quests_16_1_helmut_roegenburg_heir_o_d96a3e: "^0000cd赫尔穆特·罗根堡^000000，我们家族的继承人，应该参加皇家议会。去见他怎么样？"
  npc_override_prt_cas_quests_16_1_helmut_trained_himself_w_804d13: "赫尔穆特自己训练。长大后，他去了边境。沃尔夫突然宣布他要赚钱。"
  npc_override_prt_cas_quests_16_1_helmut_you_look_like_goo_b84310: "赫尔穆特和你看起来是好兄弟，但沃尔夫，我知道你想从战争中赚钱，而且"
  npc_override_prt_cas_quests_16_1_help_sure_thing_b0dd7b: "帮忙？没问题！"
  npc_override_prt_cas_quests_16_1_here_comes_genius_mage_n_4c0ebc: "天才法师尼勒姆来了！"
  npc_override_prt_cas_quests_16_1_here_comes_hero_5b4771: "英雄来了！"
  npc_override_prt_cas_quests_16_1_here_document_about_here_dd7da4: "这是关于那件事的文件。这里……是的。等等，我一定忘了带。抱歉。我很快会带着它回来。"
  npc_override_prt_cas_quests_16_1_here_document_about_writ_5711ae: "这是关于它的^0000cd文件^000000。是沃尔夫·罗根堡亲笔写的。"
  npc_override_prt_cas_quests_16_1_here_either_9bd8be: "这里也没有……"
  npc_override_prt_cas_quests_16_1_here_either_how_i_find_b7494a: "这里也没有。我怎么找得到呢。这里有这么多书。"
  npc_override_prt_cas_quests_16_1_here_i_left_right_here_9d176a: "在这里，我就放在这里！和冒险者谈完后，我把它放在这里，然后……就不见了……它去哪儿了？"
  npc_override_prt_cas_quests_16_1_here_i_like_help_lord_3e30fb: "在这里，我想帮助赫尔穆特大人保护人们安全和平的日子。"
  npc_override_prt_cas_quests_16_1_here_i_nothing_helmut_ex_8f2d65: "在这里，除了给赫尔穆特带些啤酒，我帮不上什么忙。"
  npc_override_prt_cas_quests_16_1_here_material_what_archd_dafaf0: "^4d4dff这是大公早些时候看到的材料。^000000"
  npc_override_prt_cas_quests_16_1_here_s_your_tip_your_5f66fa: "这是你出色工作的小费。再来。"
  npc_override_prt_cas_quests_16_1_here_some_chamomile_tea_749953: "这里有一些洋甘菊茶和姜饼。它们会帮助你休息，消除疲劳。"
  npc_override_prt_cas_quests_16_1_here_some_chocolate_cinn_97753e: "这里有一些巧克力和肉桂味的路易波士茶，可以提神。"
  npc_override_prt_cas_quests_16_1_here_some_cold_milk_citr_0c2751: "这里有一些加柚子果冻和奶油的冷牛奶。是一种酸甜饮料。"
  npc_override_prt_cas_quests_16_1_here_some_strong_mint_te_02f789: "这里有一些加牛奶和巧克力碎的浓薄荷茶。是餐后绝佳的享受。"
  npc_override_prt_cas_quests_16_1_here_too_481ac3: "{0}也在这里。"
  npc_override_prt_cas_quests_16_1_here_you_f51fb7: "给你。"
  npc_override_prt_cas_quests_16_1_hero_doesn_t_even_know_094b94: "英雄甚至不知道王室往事的存在和位置。"
  npc_override_prt_cas_quests_16_1_hero_who_made_great_cont_f7d1b4: "或者在探险中做出巨大贡献的英雄，作为这次仪式的观察者。"
  npc_override_prt_cas_quests_16_1_hey_buddy_you_cannot_dea_a0c50d: "嘿，伙计。如果你没有荣誉徽章，就不能和我交易。"
  npc_override_prt_cas_quests_16_1_hey_dear_you_ok_794669: "嘿亲爱的，你还好吗？"
