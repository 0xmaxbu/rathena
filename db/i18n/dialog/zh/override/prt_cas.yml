  npc_override_prt_cas_quests_16_1_i_met_him_stairs_over_dc102e: "我在那边的楼梯上遇到了他。"
  npc_override_prt_cas_quests_16_1_i_met_whole_lot_fellow_d68d07: "我遇到的船员和我航行过的一样多。讨人喜欢的家伙、吹牛的家伙、胆小的家伙……"
