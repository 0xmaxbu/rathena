  npc_override_prt_cas_quests_16_1_you_shouldn_t_ae8463: "你不应该。"
  npc_override_prt_cas_quests_16_1_you_shouldn_t_call_me_edf649: "在这种场合，你不应该叫我姐姐，而应该叫我威格纳家族的长女。"
  npc_override_prt_cas_quests_16_1_you_shouldn_t_contact_an_22e165: "你不应该和你必须见的人之外的任何人联系。"
  npc_override_prt_cas_quests_16_1_you_shouldn_t_forget_you_fe4167: "你不应该忘记，你是将与七个王室家族一起领导王国的王位候选人之一。"
  npc_override_prt_cas_quests_16_1_you_shouldn_t_just_wipe_8ac5aa: "你不应该只是用力擦。你需要让混合物融入油脂才能擦掉。"
  npc_override_prt_cas_quests_16_1_you_shouldn_t_let_your_ae3f86: "即使你觉得训练对你的等级来说太容易，你也不应该放松警惕。祝你好运……"
  npc_override_prt_cas_quests_16_1_you_shouldn_t_regard_me_ec364d: "你不应该把我与那个甚至不知道自己在说什么的粗俗东西相提并论。"
