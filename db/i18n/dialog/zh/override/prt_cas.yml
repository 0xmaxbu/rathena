  npc_override_prt_cas_quests_16_1_relief_heaven_forgive_le_219cda: "至少天堂会宽恕，这是一种安慰。"
  npc_override_prt_cas_quests_16_1_remember_dark_humid_plac_755f31: "记住。像这样一个黑暗潮湿的地方，非常适合那些公然邪恶、甚至没有自己面孔的死灵。"
  npc_override_prt_cas_quests_16_1_remote_safe_place_unknow_e5c7e1: "那是一个偏远但安全的地方。但由于某种不明原因，怪物成群结队地攻击。"
