  npc_override_prt_cas_quests_16_1_i_quit_5c7707: "我 quit。"
  npc_override_prt_cas_quests_16_1_i_realized_new_age_needs_f4b35c: "我意识到新时代需要孩子。我会以孩子们想要的方式为家族和国家工作。"
