  npc_override_prt_cas_quests_16_1_however_no_family_member_95468f: "然而，由于皇家宴会，没有家族成员离开国家。听到这个很奇怪。我想那个人可能是^0000cd凯恩^000000。"
  npc_override_prt_cas_quests_16_1_however_only_thing_i_off_fbe936: "然而，这是我现在唯一能给你的。请稍后拜访我们的庄园。有一些真正有价值的东西。"
  npc_override_prt_cas_quests_16_1_however_people_don_t_see_765038: "然而，人们看不到真实的我！我现在还能做什么？"
  npc_override_prt_cas_quests_16_1_however_please_understan_e7d003: "然而，请理解。这对我们的生意来说是最重要的时刻。亲爱的索菲亚，这段时间过后我会让他专心陪你。"
  npc_override_prt_cas_quests_16_1_however_prince_ernst_now_72fabd: "然而，恩斯特王子现在下落不明。"
