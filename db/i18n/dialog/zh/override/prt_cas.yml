  npc_override_prt_cas_quests_16_1_you_both_walther_your_na_bd8c3c: "你们两个的名字里都有瓦尔特。有什么特殊原因吗？"
  npc_override_prt_cas_quests_16_1_you_bring_orange_alcohol_a7d5aa: "你能带^0000cd1个橙子和1瓶酒^000000来吗？让我们用它们一起打扫！"
  npc_override_prt_cas_quests_16_1_you_bring_wolf_please_ca_732517: "你可以把它带给沃尔夫。请小心。"
  npc_override_prt_cas_quests_16_1_you_brought_flowers_huma_65436d: "你带来了花，人类！"
  npc_override_prt_cas_quests_16_1_you_call_me_belle_1de4aa: "你可以叫我贝尔。"
  npc_override_prt_cas_quests_16_1_you_came_last_so_what_74c7e4: "你终于来了！那是什么声音？你见到我的人了吗？"
  npc_override_prt_cas_quests_16_1_you_cannot_get_mold_with_c50aed: "不借助它自己种族和神的力量，你无法得到这种霉菌。"
  npc_override_prt_cas_quests_16_1_you_cannot_get_rid_black_c7496f: "没有柠檬和粉状细沙，你无法去除瓷砖缝隙里粘着的黑色污垢！"
  npc_override_prt_cas_quests_16_1_you_cannot_just_listen_a_f83d03: "你不能只听艾伦的就离开。我们是一个团队！你看到我们三个一起玩的时候不知道吗？"
  npc_override_prt_cas_quests_16_1_you_cannot_proceed_quest_8481b0: "- 由于物品太多，你无法继续任务。-"
  npc_override_prt_cas_quests_16_1_you_cannot_ride_another_fee344: "由于你已经骑着魔法装备，无法再骑另一个。"
  npc_override_prt_cas_quests_16_1_you_carefully_collected_0195cd: "你小心地收集了光芒，获得了明亮的光芒。"
  npc_override_prt_cas_quests_16_1_you_carefully_collected_203af2: "你小心地收集了光芒，但它散开了。"
