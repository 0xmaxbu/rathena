  npc_override_prt_cas_quests_16_1_you_talking_me_2d9ffd: "你在跟我说话吗？"
  npc_override_prt_cas_quests_16_1_you_tell_me_what_happene_ebf5d7: "你可以告诉我你和伊森纳姆在一起时发生了什么。你为什么在伊森纳姆死前消失，为什么你在这里，等等。"
  npc_override_prt_cas_quests_16_1_you_telling_me_go_back_aa8b57: "你让我回去，而尤尔根就在门里面？"
  npc_override_prt_cas_quests_16_1_you_there_823406: "你！"
  npc_override_prt_cas_quests_16_1_you_think_people_like_yo_c22cac: "你以为人们喜欢你的态度吗？"
  npc_override_prt_cas_quests_16_1_you_threatening_me_178eb4: "你在威胁我吗？"
  npc_override_prt_cas_quests_16_1_you_too_many_items_posse_07eca4: "- 你拥有的物品太多。"
  npc_override_prt_cas_quests_16_1_you_too_young_understand_c7cecf: "你太年轻了，无法理解你的兄弟们为什么想要实现我们的计划。"
