  npc_override_prt_cas_quests_16_1_oh_my_days_did_he_cf957a: "哦，天哪！他真的说你会为这些杂务得到报酬吗？多大的进步啊！"
  npc_override_prt_cas_quests_16_1_oh_my_ellie_critical_con_6a0430: "哦，天哪…… 艾莉情况危急。我希望里面有祭司能出来帮助她。"
