  npc_override_prt_cas_quests_16_1_oh_i_almost_forgot_thing_aae9a6: "哦，我差点忘了。这是我上次和你说过的东西。我不喜欢这种设计，所以我把它给你。"
  npc_override_prt_cas_quests_16_1_oh_i_am_really_sorry_56dccc: "哦，真的很抱歉。^0000cd我不擅长记脸。^000000"
  npc_override_prt_cas_quests_16_1_oh_i_am_sick_cleaning_558c75: "哦，我厌倦了打扫！我在家里已经有足够多的东西要打扫了。我不需要在外面再做更多。"
  npc_override_prt_cas_quests_16_1_oh_i_am_so_embarrassed_760a5e: "哦，我太尴尬了……"
  npc_override_prt_cas_quests_16_1_oh_i_am_sorry_about_27ba3a: "哦，对此我很抱歉。我应该那样做的。"
  npc_override_prt_cas_quests_16_1_oh_i_am_sorry_about_dfe730: "哦！我为我的失礼道歉。没什么。请不要介意……"
  npc_override_prt_cas_quests_16_1_oh_i_am_sorry_i_28a940: "哦，对不起。我相信你不是来听这种故事的。"
  npc_override_prt_cas_quests_16_1_oh_i_am_sorry_i_948fad: "哦，我很抱歉我过于兴奋了。"
  npc_override_prt_cas_quests_16_1_oh_i_am_sorry_keep_0dbe02: "哦！很抱歉一直占着布莱恩。请原谅。"
  npc_override_prt_cas_quests_16_1_oh_i_am_sorry_take_34b54c: "哦！很抱歉占用了你太多时间。房间里面，家族的下一任首领波正在等你。"
  npc_override_prt_cas_quests_16_1_oh_i_am_uncle_now_f6e633: "哦，我现在是叔叔了……"
  npc_override_prt_cas_quests_16_1_oh_i_caught_his_brother_9d153d: "哦，我被他兄弟抓住了。"
  npc_override_prt_cas_quests_16_1_oh_i_don_t_agree_67a6f2: "哦，我不同意你们的看法。我很慷慨。"
  npc_override_prt_cas_quests_16_1_oh_i_don_t_book_f64a12: "哦，我的收藏里没有这本书！"
