  npc_override_prt_cas_quests_16_1_you_crazy_what_you_think_368427: "你疯了吗？你以为我是谁？帮我借一下。"
  npc_override_prt_cas_quests_16_1_you_customer_i_am_going_281849: "你是客人吗？我今天不会再接待更多客人了，因为我很累。"
  npc_override_prt_cas_quests_16_1_you_d_better_mention_abo_ca2e6e: "你最好不要提报酬。我母亲告诉我不要接受陌生人的任何东西。"
  npc_override_prt_cas_quests_16_1_you_deliver_thing_wolf_s_d08c29: "你把东西安全送到沃尔夫那里了吗？你应该小心，因为它可能很危险。"
  npc_override_prt_cas_quests_16_1_you_deny_since_you_young_4ace01: "你能否认吗？从你小时候起，当你无所事事时，不，即使你无礼，人们也对你很好。"
  npc_override_prt_cas_quests_16_1_you_developing_murder_we_de08bc: "但你正在和威格纳一起开发一种作为新商业项目的杀人武器。"
  npc_override_prt_cas_quests_16_1_you_did_good_job_getting_4dc191: "你拿到加湿器干得不错，诺耶尔。"
  npc_override_prt_cas_quests_16_1_you_didn_t_anything_wron_0b0c8c: "但你没做错什么，尼希尔。"
  npc_override_prt_cas_quests_16_1_you_didn_t_just_come_c7af3d: "你不是编故事帮他脱罪吧？"
  npc_override_prt_cas_quests_16_1_you_didn_t_know_30c951: "你不知道！"
  npc_override_prt_cas_quests_16_1_you_didn_t_know_you_8bd77a: "你不知道你可以用不同的方式接近他们"
  npc_override_prt_cas_quests_16_1_you_didn_t_think_i_c15031: "你不会以为我不知道你交往的那些人吧？"
  npc_override_prt_cas_quests_16_1_you_didn_t_think_we_e92d70: "你不会以为我们会亲自去那里拿吧？"
