  npc_override_prt_cas_quests_16_1_you_shouldn_t_worry_abou_cba484: "你不应该担心我。"
  npc_override_prt_cas_quests_16_1_you_smell_strongly_blood_1fe045: "你身上血腥味很重。是的，你击倒了马约鲁罗斯。你是个强大的战士。"
  npc_override_prt_cas_quests_16_1_you_sure_you_didn_t_a377eb: "你确定你这样做不是为了报复失去王位候选人位置？"
  npc_override_prt_cas_quests_16_1_you_t_8e6fcd: "……你不能。"
  npc_override_prt_cas_quests_16_1_you_t_turn_back_time_e261f5: "时间一旦流逝就无法倒流。快点。你没有时间可以浪费。"
