  npc_override_prt_cas_quests_16_1_oh_how_suspicious_c9d087: "哦，真可疑。"
  npc_override_prt_cas_quests_16_1_oh_human_pretty_eyes_you_75b28f: "哦！有着漂亮眼睛的人类！你来得正是时候。"
