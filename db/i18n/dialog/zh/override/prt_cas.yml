  npc_override_prt_cas_quests_16_1_should_more_fabulous_b790ec: "应该更华丽！"
  npc_override_prt_cas_quests_16_1_should_we_negotiate_coop_5aa267: "我们应该与施瓦茨瓦尔德的合作方谈判吗？"
  npc_override_prt_cas_quests_16_1_shouldn_t_i_go_down_a25dbd: "我不应该亲自下去吗？"
  npc_override_prt_cas_quests_16_1_sighs_given_condition_my_374d08: "~叹息~ 鉴于我的角的状态，我想几个这些也不会有任何好处。"
  npc_override_prt_cas_quests_16_1_simon_guardian_knight_is_6e036f: "西蒙，伊森奥诺的守护骑士，在^0000cd码头^000000附近，那里停泊着前往^0000cd依斯鲁得岛^000000的船。"
  npc_override_prt_cas_quests_16_1_simple_if_helmut_roegenb_762381: "简单。如果赫尔穆特·罗根堡成为国王，战争就会爆发。"
  npc_override_prt_cas_quests_16_1_simple_prove_your_streng_a356e5: "简单。证明你的实力。我想你知道^0000cd马约鲁罗斯^000000。"
  npc_override_prt_cas_quests_16_1_since_ashbacuum_been_tak_bf81c3: "既然阿什巴库姆已经被处理了，我想回家打个盹。但他们把我留在这里。"
  npc_override_prt_cas_quests_16_1_since_banquet_you_heroes_72067b: "既然为你英雄们举办的宴会正在宴会厅举行，请在这里享受你的时光。"
  npc_override_prt_cas_quests_16_1_since_became_hard_get_th_ba4ad2: "既然变得很难获得它们，我就放弃了计划。得不偿失，一路上还要杀死美杜莎。"
  npc_override_prt_cas_quests_16_1_since_dish_banquet_f3ae88: "既然这是宴会用的菜！"
  npc_override_prt_cas_quests_16_1_since_distortion_appeare_67ee90: "自从王室往昔记忆中出现了扭曲，我就在那里安装了大门。"
  npc_override_prt_cas_quests_16_1_since_foundation_rune_mi_51d2a4: "自从卢恩-米德加尔特建立以来，许多罗根堡家族的人为国家做出了贡献，这是我们的骄傲。"
  npc_override_prt_cas_quests_16_1_since_freedom_doesn_t_co_8860ed: "既然自由对我们来说不常来，我倾向于尽可能享受它。"
  npc_override_prt_cas_quests_16_1_since_gate_become_useles_a6f61d: "既然大门已经没用了……"
  npc_override_prt_cas_quests_16_1_since_he_just_candidate_06ea95: "既然他只是个为了效果的候选人，他现在一定在做他想做的事。"
  npc_override_prt_cas_quests_16_1_since_he_often_goes_miss_a17f94: "既然他经常失踪，我没太当回事。"
  npc_override_prt_cas_quests_16_1_since_i_am_connecting_tw_38000c: "既然我正在强行重新连接扭曲的时空，"
  npc_override_prt_cas_quests_16_1_since_i_am_here_already_1e7c80: "既然我已经在这里了，让我继续帮助她。"
  npc_override_prt_cas_quests_16_1_since_i_am_married_man_8bdacb: "既然我嫁给了建立这个国家家族的人，我想培养配得上这个名字的孩子。然而，我的丈夫对名声和权力不感兴趣。"
  npc_override_prt_cas_quests_16_1_since_i_delivered_invita_781484: "既然我已经把邀请函交给你了，我就等下一个了。"
  npc_override_prt_cas_quests_16_1_since_i_fulfilled_my_dut_879be3: "既然我已经履行了我的职责，我现在就走！"
  npc_override_prt_cas_quests_16_1_since_i_look_just_like_4cce4e: "既然^0000cd我看起来和我姐姐一模一样^000000，似乎没人注意到。"
  npc_override_prt_cas_quests_16_1_since_i_need_clean_up_7bb98c: "既然我需要打扫。请现在离开。"
  npc_override_prt_cas_quests_16_1_since_i_reputation_keep_2e5c03: "既然我有声誉要维护。我不能有丑闻。请帮助我。"
  npc_override_prt_cas_quests_16_1_since_i_run_some_errands_ba50ca: "既然我要跑些 errands，我现在该走了。"
  npc_override_prt_cas_quests_16_1_since_i_want_save_my_2ce2ba: "既然我想为战斗保存体力，请护送我前往村办事处。"
  npc_override_prt_cas_quests_16_1_since_i_work_furniture_p_d41ec4: "既然我从事家具工作，那样的东西真的很吸引我。它真是一件艺术品。"
  npc_override_prt_cas_quests_16_1_since_isenarm_killed_geo_2862dc: "既然伊森纳姆被格奥博格杀死，^0000cd瓦尔特家族这次被排除在皇家议会之外^000000。"
  npc_override_prt_cas_quests_16_1_since_late_king_passed_a_475e3a: "自从先王突然去世以来，宫殿一直处于混乱状态。"
  npc_override_prt_cas_quests_16_1_since_made_crafting_smal_cbed89: "既然它是用心上掉下的一小块碎片精心制作的……"
  npc_override_prt_cas_quests_16_1_since_mark_working_here_cc1e3d: "既然马克也在这里工作。我们为什么不问问他？"
  npc_override_prt_cas_quests_16_1_since_our_ancestors_foun_7c865d: "既然我们的祖先建立了这个王国，我们有资格产生一位国王。"
  npc_override_prt_cas_quests_16_1_since_place_forbids_acce_0ae4b9: "既然这个地方禁止外人进入，请离开。"
  npc_override_prt_cas_quests_16_1_since_prince_wigner_fami_2ecf2b: "既然威格纳家族的王子看起来那么英俊……"
  npc_override_prt_cas_quests_16_1_since_seems_suspicious_l_c5373e: "既然看起来很可疑，我们现在回去吧。"
  npc_override_prt_cas_quests_16_1_since_specially_maid_scr_53b23d: "既然这是特制海绵擦，它有多重用途。它会指导你如何清洁，所以好好利用它。"
  npc_override_prt_cas_quests_16_1_since_then_i_think_i_1936d1: "从那以后，我想，我开始寻找我能找到的东西。我无法忍受我是唯一一个没有进步的人。"
  npc_override_prt_cas_quests_16_1_since_there_only_us_arou_4683d6: "既然这里只有我们，我们可以稍微放松一点……"
  npc_override_prt_cas_quests_16_1_since_they_keep_calling_515a84: "既然他们一直开会讨论仪式期间发生的事情。"
  npc_override_prt_cas_quests_16_1_since_things_turned_out_1effad: "既然事情已经变成这样了，你最好去加入内里乌斯家族，那么！嘿！"
  npc_override_prt_cas_quests_16_1_since_we_already_here_2f5b32: "既然我们已经在这里了？"
  npc_override_prt_cas_quests_16_1_since_we_difficult_situa_335153: "既然我们处境困难，我们无法提供太壮观的东西，但这是警卫为你准备的奖励。"
  npc_override_prt_cas_quests_16_1_since_we_don_t_belong_e82ad9: "既然我们不属于这个时代，出去比进来容易得多。"
  npc_override_prt_cas_quests_16_1_since_we_orange_alcohol_08e102: "既然我们有橙子和酒，现在让我们一起打扫吧！"
  npc_override_prt_cas_quests_16_1_since_we_working_palace_901a15: "既然我们在宫殿工作，我们不应该忽视哪怕是最微小的事情！"
  npc_override_prt_cas_quests_16_1_since_when_did_you_call_f16088: "你们什么时候开始直呼名字的？"
  npc_override_prt_cas_quests_16_1_since_you_been_invited_a_72ac26: "{0} 既然你被邀请作为特别嘉宾来这里，已经为你准备了一个单独的客房。"
  npc_override_prt_cas_quests_16_1_since_you_found_your_inv_575c3b: "既然你找到了你的邀请函，我们走吧！哈哈哈哈！"
  npc_override_prt_cas_quests_16_1_since_you_invited_as_obs_a50528: "既然你被邀请作为观察员，"
  npc_override_prt_cas_quests_16_1_since_you_know_way_here_c320a0: "既然你知道来这里的路，你一定获得了移动许可。"
  npc_override_prt_cas_quests_16_1_since_you_mold_powder_al_a51fad: "既然你有了霉菌粉末和酒，试着除掉霉菌吧。"
  npc_override_prt_cas_quests_16_1_since_you_must_tired_goi_4ffc48: "既然你今天经历了这么多麻烦，一定很累了。"
  npc_override_prt_cas_quests_16_1_since_you_out_here_archd_277fd1: "既然你和大公一起在这里，图书管理员一定会毫无疑虑地给你看，你知道的。"
  npc_override_prt_cas_quests_16_1_since_you_re_here_you_ffd4c5: "既然你在这里……你一定是……！"
  npc_override_prt_cas_quests_16_1_since_you_seen_let_me_425018: "既然你已经看到了，让我把它放回原处。"
  npc_override_prt_cas_quests_16_1_since_you_some_time_spar_e8ca39: "既然你有一些空闲时间，为什么不去宴会厅享受宴会呢。"
  npc_override_prt_cas_quests_16_1_since_you_special_guest_1b2b22: "既然你是特别嘉宾，你被分配了皇家别墅的一个房间。"
  npc_override_prt_cas_quests_16_1_sine_you_already_experie_a82c60: "既然你已经经历了维度裂缝……"
  npc_override_prt_cas_quests_16_1_sister_forgive_us_please_44c357: "姐姐，原谅我们。请不要再生我们的气了。"
  npc_override_prt_cas_quests_16_1_sister_i_8b7597: "姐姐，我……"
  npc_override_prt_cas_quests_16_1_sister_please_calm_down_3eb730: "姐姐，请冷静。你把它放在哪里了？你确定你把它留在这里了吗？"
  npc_override_prt_cas_quests_16_1_sister_when_did_you_come_8b52bd: "姐姐，你什么时候回来的？"
  npc_override_prt_cas_quests_16_1_situation_here_getting_w_538961: "这里的情况越来越糟，所以请好好照顾自己，以免在地牢里受伤。"
  npc_override_prt_cas_quests_16_1_skeleton_king_tristan_ii_35c719: "发现了特里斯坦三世国王的遗骸。"
  npc_override_prt_cas_quests_16_1_skia_d1b423: "斯基亚？"
  npc_override_prt_cas_quests_16_1_skia_i_take_look_drink_6d87fe: "斯基亚，我能看看你拿到的饮料吗？"
  npc_override_prt_cas_quests_16_1_skia_lord_heine_family_0c824f: "斯基亚和海涅家族领主。"
  npc_override_prt_cas_quests_16_1_skia_my_beloved_twin_f2c7f9: "斯基亚，我亲爱的双胞胎。"
  npc_override_prt_cas_quests_16_1_skia_same_you_you_someti_505fd0: "斯基亚，你也一样。你有时也必须成为影子。"
  npc_override_prt_cas_quests_16_1_skia_there_interesting_l_c7c166: "……斯基亚…… 内里乌斯家族里有一位有趣的女士。"
  npc_override_prt_cas_quests_16_1_skia_told_me_something_s_786635: "斯基亚告诉过我类似的事情。"
  npc_override_prt_cas_quests_16_1_sniffs_smell_yes_human_43333b: "~嗅嗅~ 这个味道……是的……是人类……"
  npc_override_prt_cas_quests_16_1_so_1a89ea: "……是这样吗。"
  npc_override_prt_cas_quests_16_1_so_ae8946: "……所以……"
  npc_override_prt_cas_quests_16_1_so_beautiful_i_couldn_t_907267: "它太美了，让我无法移开视线。"
  npc_override_prt_cas_quests_16_1_so_c7572d: "所以……"
  npc_override_prt_cas_quests_16_1_so_dear_adventurer_pleas_fe834e: "所以，亲爱的冒险者。请再为我做这一次。"
  npc_override_prt_cas_quests_16_1_so_everybody_pursues_hap_db7c26: "所以，每个人都在以自己的方式追求幸福。赫尔穆特在前线找到了它。沃尔夫在金钱中。迈尔在街头。"
  npc_override_prt_cas_quests_16_1_so_exclusive_i_almost_jo_04c1c9: "它是如此独家，我几乎加入了远征队！"
  npc_override_prt_cas_quests_16_1_so_fast_4031a6: "别这么快。"
  npc_override_prt_cas_quests_16_1_so_he_no_longer_alive_ecb6d0: "所以他不再活着了……我知道那已经是很久以前的事了，但仍然很遗憾。"
  npc_override_prt_cas_quests_16_1_so_heirs_throne_551c60: "王位继承人也是如此。"
  npc_override_prt_cas_quests_16_1_so_i_came_back_short_c412db: "所以我回来短暂停留。我听说兄弟之间的关系并不亲密，但突然变深了。我不能置身事外。"
  npc_override_prt_cas_quests_16_1_so_i_carry_lots_pretty_ecc018: "所以我带了很多漂亮的手帕，这样我就可以随时递给我的骑士。"
  npc_override_prt_cas_quests_16_1_so_i_decided_give_up_4f17a3: "所以我决定^0000cd放弃统一战争^000000，那场把人们推入战争漩涡的战争。"
  npc_override_prt_cas_quests_16_1_so_i_feel_they_testing_b8e35f: "是这样吗？我觉得他们在考验我。"
  npc_override_prt_cas_quests_16_1_so_i_hired_very_skillful_78aa67: "所以我雇了一个非常熟练的人来做裙子和配饰，但关键是材料。我猜你经验丰富，能拿到我需要的东西。"
  npc_override_prt_cas_quests_16_1_so_i_m_asking_you_763da4: "所以我在问你——你愿意再从他们那里拿蓝宝石吗？"
  npc_override_prt_cas_quests_16_1_so_i_talked_myer_he_095ec5: "所以我和迈尔谈过了。他让我和你谈谈。他还说，如果你买不到裙子，就买材料自己做。他说街头的人都是这么做的。"
  npc_override_prt_cas_quests_16_1_so_i_think_i_need_6d0ce3: "为了做到这一点，我想我需要^0000cd20个{0}^000000。"
  npc_override_prt_cas_quests_16_1_so_i_told_them_i_41afeb: "所以我告诉他们，我会优雅地放他们带着翅膀离开，作为交换，他们应该给我那些蓝宝石。"
  npc_override_prt_cas_quests_16_1_so_if_he_hasn_t_b275f0: "所以如果他没太大变化，那就意味着他不会制造麻烦。听到这个我松了一口气。"
  npc_override_prt_cas_quests_16_1_so_losing_beloved_ones_m_d527f9: "所以失去了心爱的人，我的孩子们和我一起生活。"
  npc_override_prt_cas_quests_16_1_so_my_goal_unify_contine_cd2b8c: "所以，我的目标是统一大陆，让我的权力延伸到大陆的每一个角落。所以我不断训练自己。"
  npc_override_prt_cas_quests_16_1_so_our_new_king_acknowle_5c4854: "这样我们的新国王才能得到这片土地上所有人的认可。"
  npc_override_prt_cas_quests_16_1_so_please_get_me_i_e7e8f7: "所以请给我^0000cd5个{0}^000000。我想那个数量的星尘可以装饰整件裙子。"
  npc_override_prt_cas_quests_16_1_so_please_me_course_you_d2c894: "所以，请帮我做。当然，你可以拒绝。但我想我找不到像你这么可靠的人了。"
  npc_override_prt_cas_quests_16_1_so_princes_must_been_poi_fb095e: "……所以王子们一定是被下毒了……"
  npc_override_prt_cas_quests_16_1_so_queen_who_handling_al_249f6f: "那么现在处理宫殿所有事务的女王也是如此吗？"
  npc_override_prt_cas_quests_16_1_so_s_shame_sure_come_79a703: "是这样吗？真遗憾。如果你有时间，一定要再来……"
  npc_override_prt_cas_quests_16_1_so_then_what_i_help_70d451: "是这样吗…… 那我能帮你什么？我会尽我所能揭露真相。"
  npc_override_prt_cas_quests_16_1_so_time_me_talk_him_05013e: "所以我和他说话的时间大大减少了。"
  npc_override_prt_cas_quests_16_1_so_we_a4e1bc: "我们也是。"
  npc_override_prt_cas_quests_16_1_so_we_tried_get_into_c4fcc3: "所以，我们试图进入封闭区域，并在时间流逝的同时联系许多人。"
  npc_override_prt_cas_quests_16_1_so_well_then_please_excu_0a48a6: "是这样吗？好吧，那么。请原谅我。"
  npc_override_prt_cas_quests_16_1_so_what_happened_cf5859: "那么，发生了什么？"
  npc_override_prt_cas_quests_16_1_so_what_i_heard_darkness_e4940c: "所以我从黑暗中听到的确实是我同胞的声音。我希望他没事。"
  npc_override_prt_cas_quests_16_1_so_what_i_you_8c2691: "那么，我能为你做什么？"
  npc_override_prt_cas_quests_16_1_so_what_you_going_9018aa: "那么，你打算做什么？"
  npc_override_prt_cas_quests_16_1_so_when_you_going_get_e42f9c: "那么，你什么时候给我们拿？"
  npc_override_prt_cas_quests_16_1_so_who_a9fda0: "…… …… 是 …… …… 所以 …… …… 谁 …… …… 和 …… …… 它"
  npc_override_prt_cas_quests_16_1_so_you_should_go_see_7e53b7: "所以你应该去见斯皮卡。"
  npc_override_prt_cas_quests_16_1_so_you_supposed_adventur_04a3cf: "所以你应该是被邀请参加宴会的冒险者，对吧？"
  npc_override_prt_cas_quests_16_1_some_discussed_idea_duri_feeaa0: "有些人在会议期间讨论了请著名冒险者处理禁区问题的想法。没有获得批准，但我会看看我能在我的权限内做些什么。"
  npc_override_prt_cas_quests_16_1_some_kind_test_e42c43: "某种测试。"
  npc_override_prt_cas_quests_16_1_some_reason_our_children_9ba3cc: "由于某种原因，我们的孩子们变得非常亲近。"
  npc_override_prt_cas_quests_16_1_some_romantics_call_gift_a3774c: "一些浪漫主义者称之为美人鱼的礼物。"
  npc_override_prt_cas_quests_16_1_some_sort_reward_which_b_a43bd6: "这是某种作为感谢送给你的奖励……"
  npc_override_prt_cas_quests_16_1_some_stuff_left_around_f_938fc3: "一些散落在地上的东西被堆在一起了。"
  npc_override_prt_cas_quests_16_1_some_them_must_still_ins_87e752: "他们中的一些人即使服刑期满，也一定还在监狱里。"
  npc_override_prt_cas_quests_16_1_someday_when_you_need_po_4d6b36: "总有一天，当你需要我们家族的力量时，"
  npc_override_prt_cas_quests_16_1_someone_must_taken_advan_5fb11e: "一定有人根据阴谋利用了他……"
  npc_override_prt_cas_quests_16_1_something_dangerous_abou_dda322: "这很危险吗？是关于国际事务还是国际形势……"
  npc_override_prt_cas_quests_16_1_something_happened_our_c_091d05: "我们的孩子，我是说，卡特琳，出什么事了吗？"
  npc_override_prt_cas_quests_16_1_something_like_never_hap_9143d9: "如果我更小心些，这种事永远不会发生……"
