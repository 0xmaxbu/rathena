  npc_override_prt_cas_quests_16_1_pretty_eyes_don_t_any_c33f8f: "漂亮的眼睛也没什么用，我想！你应该敞开心扉，配得上那双漂亮的小眼睛！"
  npc_override_prt_cas_quests_16_1_pretty_handkerchief_f21b9d: "那是一块漂亮的手帕。"
  npc_override_prt_cas_quests_16_1_pretty_stone_which_only_a5c9c5: "这是一块只能在克魔岛找到的漂亮石头。它被称为海之石，因为它看起来像是把大海封在里面，有海水和珊瑚。"
  npc_override_prt_cas_quests_16_1_priest_cathedral_taking_33e6d2: "大教堂的祭司正在照顾我的妻子。"
  npc_override_prt_cas_quests_16_1_prince_ernst_gave_up_his_b957d6: "恩斯特王子放弃了王位候选人的位置。"
  npc_override_prt_cas_quests_16_1_prince_ernst_geoborg_ele_84c771: "恩斯特·格奥博格王子在上次皇家议会上被选为最有权势的候选人。这显示了格奥博格家族的影响力有多大。"
  npc_override_prt_cas_quests_16_1_prisoner_breathing_calml_1e7845: "囚犯呼吸平稳，所以他一定在睡觉。"
  npc_override_prt_cas_quests_16_1_prisoner_grabs_fist_poun_a55d7a: "- 囚犯握紧拳头，捶打他的左胸。-"
  npc_override_prt_cas_quests_16_1_prisoner_here_gazing_aro_9c72eb: "这里的囚犯像狩猎的狮子一样环顾四周。你想在被抓住之前离开。"
  npc_override_prt_cas_quests_16_1_prisoner_here_sitting_ex_7e0633: "这里的囚犯一脸极度无聊地坐着。如果你现在和他说话，你可能不得不坐下来和他聊天。"
  npc_override_prt_cas_quests_16_1_prisoner_here_smiling_ou_8a60ba: "这里的囚犯在痛苦中微笑。我觉得他状态不正常。我应该从他身边走过吗？"
  npc_override_prt_cas_quests_16_1_prisoner_howling_somethi_589141: "囚犯在嚎叫。发生什么事了吗？"
  npc_override_prt_cas_quests_16_1_prisoner_inside_seems_lo_e391a5: "里面的囚犯似乎在找仆人。我想他看到我了，但我只能假装没听到。"
  npc_override_prt_cas_quests_16_1_prisoner_often_called_as_c4864e: "那个囚犯常被称为监狱里的睡美人。我记得他已经睡了很久了。"
  npc_override_prt_cas_quests_16_1_prisoner_seems_reminisce_11e5cb: "- 囚犯似乎在回忆过去，用拳头捶打他的左胸。-"
  npc_override_prt_cas_quests_16_1_prisoner_started_singing_406efc: "囚犯开始唱歌，好像在回忆什么。"
  npc_override_prt_cas_quests_16_1_problem_long_been_pain_n_9adf11: "这个问题长期以来一直是个棘手的问题。"
  npc_override_prt_cas_quests_16_1_problem_occur_next_coron_75716a: "下次加冕时会出现问题。"
  npc_override_prt_cas_quests_16_1_problem_restricted_area_f4edd5: "禁区有问题？"
  npc_override_prt_cas_quests_16_1_problem_we_geoborg_famil_e25750: "这是我们格奥博格家族自己应该克服的问题。"
  npc_override_prt_cas_quests_16_1_proceed_after_resetting_ccbb56: "重置任务后继续。选择要开始任务。"
  npc_override_prt_cas_quests_16_1_produce_good_cloth_good_d2905e: "要生产好布，需要好线。要提取好线，^0000cd软毛^000000是最好的。你能帮我弄些软毛来吗？"
  npc_override_prt_cas_quests_16_1_prontera_being_destroyed_c901d9: "普隆德拉正被不死军团摧毁——！"
