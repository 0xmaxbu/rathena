  npc_override_prt_cas_quests_16_1_i_am_sick_guardian_knigh_9d5779: "我厌倦了守护骑士，因为我哥哥的守护骑士抛弃了我哥哥逃跑了。我不想叫他们守护骑士。"
  npc_override_prt_cas_quests_16_1_i_am_sick_listening_lidi_7a240f: "我厌倦了听利迪翁的挑剔。"
  npc_override_prt_cas_quests_16_1_i_am_skia_fe102a: "我是斯奇亚。"
  npc_override_prt_cas_quests_16_1_i_am_skia_nerius_you_a4431c: "我是斯奇亚·纳里乌斯。你可以叫我斯奇亚。"
  npc_override_prt_cas_quests_16_1_i_am_so_nervous_i_aac9bc: "我好紧张……我不该来的……"
  npc_override_prt_cas_quests_16_1_i_am_sorry_098cc1: "对不起，"
  npc_override_prt_cas_quests_16_1_i_am_sorry_860de5: "对不起。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_about_misunde_82af19: "很抱歉造成了误会。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_about_we_d1b29e: "对此我很抱歉。我们很绝望，也很匆忙。如果你因此不高兴，我道歉。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_about_your_3c7308: "对你的继承人我很抱歉。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_all_mercenari_59fa80: "抱歉，但所有派遣到该地区的雇佣兵都已被宫殿雇佣。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_ask_you_16136b: "很抱歉问你，但你能帮我这个忙吗？"
  npc_override_prt_cas_quests_16_1_i_am_sorry_c8d287: "对不起！"
  npc_override_prt_cas_quests_16_1_i_am_sorry_cause_such_da25ad: "很抱歉在你面前造成如此尴尬的局面。如果你有时间，请再来。下次我们一定会好好接待你。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_dear_customer_081edc: "抱歉，亲爱的顾客。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_hear_a42a79: "听到这个我很抱歉。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_him_my_e56c67: "我为他感到抱歉，但我的命就靠这个了。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_i_apologize_ecce42: "对不起，我为她的无礼道歉。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_i_asked_8c56c9: "很抱歉我问了。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_i_forgot_a746dc: "抱歉，但我忘了该拿什么。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_i_left_f85d47: "很抱歉我离开得太早，没能和他说上话。我问迈尔他是谁，但他没告诉我。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_i_said_90aeb6: "对不起，我说错了，因为我在想别的事。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_i_thought_a1f4c2: "对不起。我以为这里没人。我只是想打扫房间，真的很抱歉。我稍后再来。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_i_want_157f8a: "对不起，但我想一个人待会儿。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_if_my_635ff8: "如果我的骑士给你添了麻烦，我很抱歉。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_interrupt_i_cf3be0: "很抱歉打断，但我有事要告诉你。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_keep_you_6fddcd: "很抱歉让你久等，我在整理思绪。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_make_you_9100e6: "很抱歉让你不舒服。我只是问每个进过那个房间的人情况。我不是在怀疑你。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_make_you_b22763: "很抱歉让你累了。你发现什么了吗？"
  npc_override_prt_cas_quests_16_1_i_am_sorry_niren_d7174e: "……对不起，尼伦……"
  npc_override_prt_cas_quests_16_1_i_am_sorry_say_unauthori_bc4fc4: "很抱歉这么说，但你看到的区域前方未经授权禁止进入。抱歉带来不便，感谢你的配合。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_unauthorized_a3d601: "抱歉，但未经授权禁止进入这个地方。"
  npc_override_prt_cas_quests_16_1_i_am_sorry_we_cannot_99875a: "很抱歉我们不能给你更多。"
  npc_override_prt_cas_quests_16_1_i_am_spica_nerius_family_d0e8bc: "我是纳里乌斯家族的斯皮卡。"
  npc_override_prt_cas_quests_16_1_i_am_supposed_clean_room_615672: "反正我应该在没有人的时候打扫房间。请原谅。"
  npc_override_prt_cas_quests_16_1_i_am_sure_all_royal_44d93d: "我相信城里所有的皇家信使一定都在拿着你的画像找你。"
  npc_override_prt_cas_quests_16_1_i_am_sure_if_she_7a849e: "我不确定她是否还在那里……"
  npc_override_prt_cas_quests_16_1_i_am_surprised_6768c6: "我很惊讶。"
  npc_override_prt_cas_quests_16_1_i_am_surprised_since_mij_de08db: "我一点也不惊讶，因为那是米杰里亚，她什么都没有！"
  npc_override_prt_cas_quests_16_1_i_am_suspecting_you_i_54dfc8: "我不是在怀疑你。我只是^0000cd问你情况^000000来追踪盒子。"
  npc_override_prt_cas_quests_16_1_i_am_suspicious_her_may_203955: "不是说我怀疑她，但问问她可能有帮助。她是否看到了，或者她最后一次看到它是什么时候……"
  npc_override_prt_cas_quests_16_1_i_am_telling_lie_am_3db80f: "我没有说谎。不是吗？"
  npc_override_prt_cas_quests_16_1_i_am_thinking_about_orde_af7497: "我在想那位女士给的命令。"
  npc_override_prt_cas_quests_16_1_i_am_thrilled_you_called_10e5f9: "你如此无情地召唤我，让我很激动——"
  npc_override_prt_cas_quests_16_1_i_am_treated_like_prince_8fcd2a: "我被违背意愿收养后就被当作王子对待。然而，家主谢德哈尔一直对我很好。"
  npc_override_prt_cas_quests_16_1_i_am_trouble_eed757: "我有麻烦了！"
  npc_override_prt_cas_quests_16_1_i_am_trying_defend_him_b3c214: "我不是因为他是我的儿子才试图为他辩护。"
  npc_override_prt_cas_quests_16_1_i_am_trying_elders_my_578d22: "我正在努力。但^0000cd家族长辈不想让我挖出那件不光彩的事件^000000。"
  npc_override_prt_cas_quests_16_1_i_am_trying_hard_send_249598: "我正在努力不每分钟每秒都给她写情书。请在时机到来时回来。"
  npc_override_prt_cas_quests_16_1_i_am_trying_warn_them_ee7427: "我最近试图警告他们一点。如果他们对你有任何无礼的行为，请原谅。"
  npc_override_prt_cas_quests_16_1_i_am_used_talk_formal_2e0515: "我不习惯用敬语说话。"
  npc_override_prt_cas_quests_16_1_i_am_very_happy_i_2a7618: "我很高兴回到这里。"
  npc_override_prt_cas_quests_16_1_i_am_very_sorry_cause_9cb2f5: "非常抱歉给你造成不便。"
  npc_override_prt_cas_quests_16_1_i_am_waiting_ship_izlude_c86238: "我在等去依斯鲁得岛的船。船一来我就冲上去。"
  npc_override_prt_cas_quests_16_1_i_am_way_go_hide_c0d5cf: "我正要去附近的避难所躲藏。你愿意和我一起去吗？"
  npc_override_prt_cas_quests_16_1_i_am_well_taken_care_3ce4e1: "克鲁克斯把我照顾得很好。"
  npc_override_prt_cas_quests_16_1_i_am_willing_so_cf34ba: "我愿意这样做。"
  npc_override_prt_cas_quests_16_1_i_am_worried_about_conse_ea03a2: "我担心如果出了什么差错会有什么后果。"
  npc_override_prt_cas_quests_16_1_i_am_worried_about_repre_1f3f90: "我担心我们家族的代表这样四处游荡。"
  npc_override_prt_cas_quests_16_1_i_am_worried_helmut_left_9feb5c: "我担心^0000cd赫尔穆特一言不发就离开了^000000，因为有很多人在盯着他。他是我们家族的继承人。"
  npc_override_prt_cas_quests_16_1_i_am_your_service_0cf79f: "我随时为你服务。"
  npc_override_prt_cas_quests_16_1_i_apologize_behalf_heine_4ec39d: "我代表海涅家族道歉。"
  npc_override_prt_cas_quests_16_1_i_appreciate_what_you_us_dbb546: "感谢你为我们所做的一切，冒险者。"
  npc_override_prt_cas_quests_16_1_i_appreciate_your_effort_addf14: "感谢你对王室的努力。"
  npc_override_prt_cas_quests_16_1_i_appreciate_your_help_t_e4d65d: "不过感谢你的帮助。我已经绝望到要接受你的好意了。然而，我觉得你从守护骑士那里听不到太多。"
  npc_override_prt_cas_quests_16_1_i_ask_you_bring_more_3a2b54: "我能请你多带些吗？我需要很多裙子。"
  npc_override_prt_cas_quests_16_1_i_ask_you_get_more_c8ec88: "我能请你再多拿些吗？恐怕布料不够。"
  npc_override_prt_cas_quests_16_1_i_asked_what_had_happene_859bd6: "我问孩子们发生了什么事，但他们没有告诉我。"
  npc_override_prt_cas_quests_16_1_i_assumed_people_who_all_3bdaa6: "我曾以为那些拥有世界上所有金钱、见过世界上所有美好事物的人一定有敏锐的眼光。我错了。"
  npc_override_prt_cas_quests_16_1_i_away_long_time_just_12fb6f: "我离开很久了，刚回来。没错吧？"
  npc_override_prt_cas_quests_16_1_i_b4d4eb: "我能做到。"
  npc_override_prt_cas_quests_16_1_i_been_alone_these_days_3ef380: "这些天我一直一个人，因为宴会期间没人来图书馆。"
  npc_override_prt_cas_quests_16_1_i_been_asked_your_husban_1fc5e3: "我是受你丈夫之托。"
  npc_override_prt_cas_quests_16_1_i_been_badgered_head_che_a5365e: "我被主厨唠叨太多了……哈哈……"
  npc_override_prt_cas_quests_16_1_i_been_digging_around_li_1340dd: "我一直在四处打听，我想我们可以随时想来就来……"
  npc_override_prt_cas_quests_16_1_i_been_raised_as_shadow_03966b: "我被当作影子养大，但这从未让我悲伤。"
  npc_override_prt_cas_quests_16_1_i_been_seeing_too_many_da3b01: "这些天我见过太多人了，以至于我现在甚至对熟悉的面孔都感到困惑。"
  npc_override_prt_cas_quests_16_1_i_been_telling_people_we_6ac958: "我一直告诉人们我们穿着戏服。我想我们的服装不太适合普隆德拉这种场合。"
  npc_override_prt_cas_quests_16_1_i_been_waiting_you_4ab8e7: "我一直在等你。"
  npc_override_prt_cas_quests_16_1_i_believe_how_story_got_37209f: "我相信故事就是这样传出去的。"
  npc_override_prt_cas_quests_16_1_i_believe_i_haven_t_ecd92d: "我相信我以前没见过你。你是来见我父亲的吗？"
  npc_override_prt_cas_quests_16_1_i_believe_i_most_thoroug_6829eb: "我相信在维度裂缝方面，我拥有最全面的知识！"
  npc_override_prt_cas_quests_16_1_i_believe_lord_heine_fam_ad408f: "我相信海涅家族的家主也会成为好朋友。"
  npc_override_prt_cas_quests_16_1_i_believe_me_806eff: "我相信是我。"
  npc_override_prt_cas_quests_16_1_i_believe_most_important_42d9e8: "我相信对战士来说最重要的是挑战精神。向下一级迈进的挑战……这是最重要的。"
  npc_override_prt_cas_quests_16_1_i_believe_our_superiors_69ea98: "我相信我们的上级会命令我们这样做。"
  npc_override_prt_cas_quests_16_1_i_believe_so_74da35: "我相信是这样。"
  npc_override_prt_cas_quests_16_1_i_believe_someone_pretty_d778c2: "我相信像你这样眼睛漂亮的人应该原谅我。所以……"
  npc_override_prt_cas_quests_16_1_i_believe_there_guest_he_d07734: "我相信这里有客人……"
  npc_override_prt_cas_quests_16_1_i_believe_wolf_must_alre_f62e1a: "我相信沃尔夫一定已经想好了下一个商业项目的计划。"
  npc_override_prt_cas_quests_16_1_i_believe_you_handle_cle_f5ed4f: "我相信即使没有我，你也能完美地完成清洁！"
  npc_override_prt_cas_quests_16_1_i_believe_you_just_fine_6ebd32: "我相信你会做得很好。"
  npc_override_prt_cas_quests_16_1_i_believe_you_more_produ_9b5110: "我相信你会和他们度过更有成效的时光。"
  npc_override_prt_cas_quests_16_1_i_brightest_star_banquet_011276: "我将成为宴会上最亮的星。"
  npc_override_prt_cas_quests_16_1_i_brought_them_you_d_ba0121: "我带来了。你最好不要这样不耐烦地激怒一个愤怒的人，你知道的。"
  npc_override_prt_cas_quests_16_1_i_called_simon_alberta_i_749c09: "我从艾尔贝塔叫来了西蒙。我现在需要召集所有能帮上忙的人。"
  npc_override_prt_cas_quests_16_1_i_came_here_bring_lord_99d4e6: "我来这里是为了带赫尔穆特大人回去。你祖父非常担心你。他说你在重要时刻离家出走了。"
  npc_override_prt_cas_quests_16_1_i_came_here_just_minute_819f17: "我刚到这里。然而，我听到你说的话。所以，你觉得听到这些是我的错吗？"
  npc_override_prt_cas_quests_16_1_i_cannot_believe_i_am_a00376: "我不敢相信我能和主厨一起做饭！"
  npc_override_prt_cas_quests_16_1_i_cannot_believe_my_brot_dc495a: "我不敢相信我哥哥会暴力行事。即使他做了，也一定有^0000cd原因^000000。"
  npc_override_prt_cas_quests_16_1_i_cannot_believe_myer_di_3c8ec5: "我不敢相信迈尔做了那件事。"
  npc_override_prt_cas_quests_16_1_i_cannot_eat_horrible_fo_f95aed: "这里的食物太难吃了，我一直在想外面的食物。"
  npc_override_prt_cas_quests_16_1_i_cannot_go_back_as_27bbc8: "我不能回去。事实上，自从我成熟后，我就怨恨那些让我父母死去的人。"
  npc_override_prt_cas_quests_16_1_i_cannot_leave_now_010eb9: "我现在不能离开。"
  npc_override_prt_cas_quests_16_1_i_cannot_let_slide_8c640b: "我不能放过这件事。"
  npc_override_prt_cas_quests_16_1_i_cannot_point_out_i_0b6211: "我不能指出来，但我想我已经给了你足够的线索。"
  npc_override_prt_cas_quests_16_1_i_cannot_see_helmut_did_5575e8: "我看不到赫尔穆特。他拒绝来了吗？"
  npc_override_prt_cas_quests_16_1_i_cannot_stop_stirring_s_b1b189: "我不能停止搅拌酱汁。你可以在我报出名字时把食材带给我。"
  npc_override_prt_cas_quests_16_1_i_cannot_use_name_walthe_4a3cb5: "我不能再使用沃尔特这个名字了。"
  npc_override_prt_cas_quests_16_1_i_cannot_wait_know_what_a8dd9e: "我等不及想知道关于我们家族的传闻是什么。"
  npc_override_prt_cas_quests_16_1_i_carry_banquet_whatever_b54012: "无论我穿什么，我都带着这个去参加宴会。我能再请你帮个忙吗？"
  npc_override_prt_cas_quests_16_1_i_chosen_what_i_am_35b82f: "但我选择了做我自己。这是我的路。"
  npc_override_prt_cas_quests_16_1_i_come_deliver_you_messa_d6ad4c: "我来传达你有任务的消息。"
  npc_override_prt_cas_quests_16_1_i_come_here_payon_meet_efa12e: "我从斐扬来这里见尤尔根！"
  npc_override_prt_cas_quests_16_1_i_come_prontera_attend_b_34b3b6: "我从天津城来普隆德拉参加宴会。感觉和天津城完全不同。哈哈哈。"
  npc_override_prt_cas_quests_16_1_i_consulted_varmunt_grea_22f36a: "我就此事咨询了大贤者瓦尔蒙特。"
  npc_override_prt_cas_quests_16_1_i_could_cut_air_knife_46c625: "我刚才可以用刀切开空气。我们现在出去吧。"
  npc_override_prt_cas_quests_16_1_i_couldn_t_find_what_075e95: "但我找不到是什么让蓝眼睛变成了红眼睛。"
  npc_override_prt_cas_quests_16_1_i_couldn_t_risk_letting_03b49f: "我不能冒险让贾哈家族的一位女士假装了解吉奥博格家族。我不能休息。"
  npc_override_prt_cas_quests_16_1_i_couldn_t_shake_hands_b4cdca: "我没能和尤尔根握手！哦，太热了！"
  npc_override_prt_cas_quests_16_1_i_couldn_t_stop_thinking_571a06: "你不在的时候，我一直在想她。"
  npc_override_prt_cas_quests_16_1_i_curious_how_skia_react_63ddca: "我很好奇斯奇亚会有什么反应。"
  npc_override_prt_cas_quests_16_1_i_d_better_i_go_ef422a: "我最好亲自下去。"
  npc_override_prt_cas_quests_16_1_i_d_like_go_get_10415d: "我想自己去拿，或者请别人帮忙。但因为是家族事务，我有点不好意思。"
  npc_override_prt_cas_quests_16_1_i_d_like_hear_your_a37caa: "我想听听你的故事。"
  npc_override_prt_cas_quests_16_1_i_d_like_invite_them_66be9a: "我想邀请他们来皇家别墅参加我的派对。"
  npc_override_prt_cas_quests_16_1_i_d_like_know_myself_c6e203: "我自己也想知道。"
  npc_override_prt_cas_quests_16_1_i_d_like_take_rest_d98621: "我想休息一下。"
  npc_override_prt_cas_quests_16_1_i_d_rather_you_pretend_657054: "我宁愿你假装我没说过。"
  npc_override_prt_cas_quests_16_1_i_damned_if_i_waste_6d9c19: "如果我再在这里浪费时间，我就该死。"
  npc_override_prt_cas_quests_16_1_i_dealt_too_many_people_7b3016: "我和太多人打过交道了……"
  npc_override_prt_cas_quests_16_1_i_didn_t_come_here_66c51b: "我不是来听新传闻的。我在找告诉你故事的人。"
  npc_override_prt_cas_quests_16_1_i_didn_t_expect_all_badee6: "我完全没有料到会有传闻流传。"
  npc_override_prt_cas_quests_16_1_i_didn_t_know_all_1029c2: "我不知道……完全不知道……"
  npc_override_prt_cas_quests_16_1_i_didn_t_know_anyway_45b784: "我不知道。总之，我记得石头旁边还有别的东西。"
  npc_override_prt_cas_quests_16_1_i_didn_t_know_how_7283b5: "我不知道爱一个人有多痛苦。我确实知道我会为她的一个字或一个手势而坐立不安。"
  npc_override_prt_cas_quests_16_1_i_didn_t_know_i_2ab81b: "我不知道，我只对他们严格。"
  npc_override_prt_cas_quests_16_1_i_didn_t_know_imir_cfdc6a: "我不知道意识之室的伊米尔之心被女武神偷走了！"
  npc_override_prt_cas_quests_16_1_i_didn_t_know_servant_cdc06c: "我不知道仆人没有权利会见狱卒。抱歉。"
  npc_override_prt_cas_quests_16_1_i_didn_t_know_there_263230: "我不知道有关于我们家族的传闻在流传"
  npc_override_prt_cas_quests_16_1_i_didn_t_know_women_70ef0d: "我以前不知道女人这么强大。"
  npc_override_prt_cas_quests_16_1_i_didn_t_like_human_4b175c: "我不喜欢上次那个人类仆人。他太弱了。我不知道你怎么样。"
  npc_override_prt_cas_quests_16_1_i_didn_t_mean_cheat_128ca1: "我不是故意骗你的。但你直言不讳地说出你想要什么。起初我因为你们是小孩而看不起你们。"
  npc_override_prt_cas_quests_16_1_i_didn_t_recognize_when_48ff05: "我在前线侍奉赫尔穆特时没有认出来，但在这里，他看起来有点疏远，我感觉他是王室家族的继承人。"
  npc_override_prt_cas_quests_16_1_i_didn_t_say_anything_b42a52: "我没说错什么。"
  npc_override_prt_cas_quests_16_1_i_didn_t_such_thing_9bac15: "我不是故意做那种事的。"
  npc_override_prt_cas_quests_16_1_i_didn_t_tell_children_0d8280: "我没有告诉孩子们关于袭击的事，但我不得不坦白他们父母的死讯。"
  npc_override_prt_cas_quests_16_1_i_didn_t_think_you_964fdb: "我没想到你会放我出去。我只是大声说出来了。"
  npc_override_prt_cas_quests_16_1_i_don_t_believe_so_cc6f1d: "我不这么认为。"
  npc_override_prt_cas_quests_16_1_i_don_t_care_who_176b07: "我不在乎谁成为继承人，只要他能领导好家族。"
  npc_override_prt_cas_quests_16_1_i_don_t_dream_becoming_f63133: "我不梦想一夜暴富，但我确实想有一些荣誉，因为我是男人。"
  npc_override_prt_cas_quests_16_1_i_don_t_even_want_a7c38b: "我甚至不想想象别人看到它……"
  npc_override_prt_cas_quests_16_1_i_don_t_get_beauty_75ee80: "我不明白。美貌是好事。每个人都喜欢。"
  npc_override_prt_cas_quests_16_1_i_don_t_go_back_42a4e7: "我不回去。^0000cd我属于这里，前线^000000。请这样告诉我祖父。"
  npc_override_prt_cas_quests_16_1_i_don_t_know_acedd2: "我不知道。"
  npc_override_prt_cas_quests_16_1_i_don_t_know_how_04366f: "我不知道该怎么感谢你。从孩子们那里听到传闻是最准确的。我听说孩子们聚集在普隆德拉的^0000cd一个大空地^000000里……"
  npc_override_prt_cas_quests_16_1_i_don_t_know_if_bed0b4: "我不知道这是不是最好的主意。我不想让她觉得我们在怀疑她。"
  npc_override_prt_cas_quests_16_1_i_don_t_know_such_d9a18f: "我不知道这个名字。"
  npc_override_prt_cas_quests_16_1_i_don_t_know_what_45f05a: "我不知道你在说什么。请慢慢详细地告诉我？"
  npc_override_prt_cas_quests_16_1_i_don_t_know_what_e6efe9: "我不知道她看上了那个没有内涵的漂亮男孩什么。"
  npc_override_prt_cas_quests_16_1_i_don_t_know_when_a6cc53: "我不知道什么时候，但那是^4d4dff王室往事^000000！"
  npc_override_prt_cas_quests_16_1_i_don_t_know_whereabouts_93c32b: "不幸的是，我不知道^0000cd凯恩·沃尔特·沃克^000000的下落，他曾是伊森纳姆的守护骑士。"
  npc_override_prt_cas_quests_16_1_i_don_t_know_which_03fb46: "……我不知道你来自哪个家族，但你必须停止。"
  npc_override_prt_cas_quests_16_1_i_don_t_know_who_c6aa3b: "我不知道他是谁。我一直在工作。你知道你必须工作才能谋生。"
  npc_override_prt_cas_quests_16_1_i_don_t_know_why_51254c: "我不知道为什么，但斯卡雷特和利迪翁长期以来关系不好。"
  npc_override_prt_cas_quests_16_1_i_don_t_know_you_9560c1: "我不知道。你有没有试过平息某人的愤怒？"
  npc_override_prt_cas_quests_16_1_i_don_t_leave_my_fb3b0b: "我不会丢下我的朋友。做他们想做的事。如果你不这样做，你就会失去资格。"
  npc_override_prt_cas_quests_16_1_i_don_t_like_crowded_3764b7: "……我不喜欢这种拥挤的地方，但我在执行任务时别无选择。"
  npc_override_prt_cas_quests_16_1_i_don_t_like_how_c15c38: "我不喜欢最近事态的发展。"
  npc_override_prt_cas_quests_16_1_i_don_t_mean_6a3d01: "我不是那个意思！"
  npc_override_prt_cas_quests_16_1_i_don_t_mean_i_840bd8: "但，我不是不想让他成为国王。"
  npc_override_prt_cas_quests_16_1_i_don_t_much_money_fce5f7: "我没有多少钱，但我知道该花在哪里。我想我应该拒绝这笔交易。那再见。"
  npc_override_prt_cas_quests_16_1_i_don_t_much_say_8545fd: "关于他我没有太多可说的，因为我看到的关于他的一切都是睡觉。嗯，我想你可以和他成为好朋友。"
  npc_override_prt_cas_quests_16_1_i_don_t_need_hear_a62293: "我不需要听你的一些个人印象。虽然我被抓了，但多亏了那边的狱卒，我在监狱里自由走动。"
  npc_override_prt_cas_quests_16_1_i_don_t_offer_monthly_500d5a: "我不提供分期付款。我只收现金。我只接受两年以上的货币。等我出去后，我会 meaningful 地花掉它。"
  npc_override_prt_cas_quests_16_1_i_don_t_perform_reset_ea796d: "我不是随时都进行重置。我会在2个插槽都强化到无法再强化时进行。而且……然后……"
  npc_override_prt_cas_quests_16_1_i_don_t_remember_b3ff47: "我不记得了。"
  npc_override_prt_cas_quests_16_1_i_don_t_smell_greasy_fc9665: "我闻不到油腻的饺子和新鲜的沙拉。"
  npc_override_prt_cas_quests_16_1_i_don_t_tell_you_5bb9e4: "我不需要告诉你故事的其余部分，对吧？哇……我以为我在同时和三个人打架。他的拳头就像……！呼……当他打我的时候，我看到了。"
  npc_override_prt_cas_quests_16_1_i_don_t_tend_bear_5d8892: "我不倾向于因此怨恨海涅家族。"
  npc_override_prt_cas_quests_16_1_i_don_t_think_entirely_c95ab2: "我不认为这完全是你的错。是我们的父母把你塑造成那样的。"
  npc_override_prt_cas_quests_16_1_i_don_t_think_good_3eb12d: "我不认为这是个好主意。你不应该告诉任何人。请保密。"
  npc_override_prt_cas_quests_16_1_i_don_t_think_good_77dcd3: "我不认为那是个好主意……"
  npc_override_prt_cas_quests_16_1_i_don_t_think_i_990c11: "我不认为我该受责备，但很抱歉没告诉你就拿了你的东西。"
  npc_override_prt_cas_quests_16_1_i_don_t_think_s_2916f0: "我不认为那会发生。"
  npc_override_prt_cas_quests_16_1_i_don_t_think_true_44ead4: "我不认为那是真的。她不是那种人。"
  npc_override_prt_cas_quests_16_1_i_don_t_understand_2bcea9: "我不明白。"
  npc_override_prt_cas_quests_16_1_i_don_t_understand_why_21d9fc: "我不明白为什么伊森纳姆一直表现良好却会那样做……"
  npc_override_prt_cas_quests_16_1_i_don_t_understand_why_877759: "我不明白你为什么散布这样的传闻，做这些事。"
  npc_override_prt_cas_quests_16_1_i_don_t_want_anything_351ee8: "我不想要太大的东西……"
  npc_override_prt_cas_quests_16_1_i_don_t_want_break_1dff9e: "我不想闯入，但很多人害怕战争，"
  npc_override_prt_cas_quests_16_1_i_don_t_want_experience_3ba2eb: "我不想再经历那种事了。"
  npc_override_prt_cas_quests_16_1_i_don_t_want_hear_013f7c: "我不想听！你为什么为了某个失踪的盒子吓唬一个无辜的家具送货员？"
  npc_override_prt_cas_quests_16_1_i_don_t_want_waste_3109c4: "我不想在这里浪费时间。"
  npc_override_prt_cas_quests_16_1_i_dragged_here_force_18d448: "我是被强行拖到这里来的……"
  npc_override_prt_cas_quests_16_1_i_embarrassed_death_1f00e1: "我会羞愧而死。"
  npc_override_prt_cas_quests_16_1_i_endure_59f2d5: "我必须忍受！"
  npc_override_prt_cas_quests_16_1_i_enhance_three_items_fl_42dcb0: "我用荣誉徽章强化三件物品：奉承长袍、谩骂长袍和普隆德拉徽章。"
  npc_override_prt_cas_quests_16_1_i_enough_dresses_last_my_68c85a: "我有足够穿一辈子的裙子。为什么他们还在做……"
  npc_override_prt_cas_quests_16_1_i_expected_you_agree_as_569625: "我以为你会同意，因为你和我一样是女人。"
  npc_override_prt_cas_quests_16_1_i_explained_what_happene_a6fdd3: "- 我向他解释了他的同伴发生了什么事。-"
  npc_override_prt_cas_quests_16_1_i_explained_why_i_came_45c402: "- 我解释了为什么来这里。-"
  npc_override_prt_cas_quests_16_1_i_feel_attractive_offer_7954bc: "我觉得这是一个很有吸引力的提议。你想挑战理查德家族的战士训练体系吗？"
  npc_override_prt_cas_quests_16_1_i_feel_darkness_inside_g_38a6b0: "我能感觉到内心的黑暗正在得到控制。"
  npc_override_prt_cas_quests_16_1_i_feel_dizzy_4d9db0: "……我感到头晕……"
  npc_override_prt_cas_quests_16_1_i_feel_earth_shaking_2210fd: "我能感觉到大地在震动。"
  npc_override_prt_cas_quests_16_1_i_feel_rather_overwhelme_f02e15: "我感到相当不知所措……而且还有社会阶层的问题……"
  npc_override_prt_cas_quests_16_1_i_feel_safe_my_grandfath_a21c16: "但我感到安全，因为我的祖父和我在一起。"
  npc_override_prt_cas_quests_16_1_i_feel_sorry_been_great_d99268: "我感到遗憾。那本来是我给家人留下深刻印象的好机会。"
  npc_override_prt_cas_quests_16_1_i_feel_sorry_first_thing_8fde58: "我很遗憾^0000cd他一生中最想要的第一样东西竟然是假的^000000。"
  npc_override_prt_cas_quests_16_1_i_feel_very_sorry_about_2bee8b: "对此我深感抱歉。"
  npc_override_prt_cas_quests_16_1_i_feel_you_must_raring_417d66: "我觉得你一定渴望行动。我想是时候进行下一次训练了。"
  npc_override_prt_cas_quests_16_1_i_feeling_everything_tur_bc868a: "我有种感觉，如果你帮我送，一切都会顺利。"
  npc_override_prt_cas_quests_16_1_i_fell_love_her_i_21cb4c: "我爱上了她。我爱她端庄而平静的声音。不受影响的行为……反映坚强意志的语调……"
  npc_override_prt_cas_quests_16_1_i_finally_strawberry_cak_2c8ef2: "我终于拿到了没人碰过的草莓蛋糕。"
  npc_override_prt_cas_quests_16_1_i_forgot_you_great_warri_f0a4d7: "我忘了你是个伟大的战士。请原谅我的无礼。"
  npc_override_prt_cas_quests_16_1_i_found_court_mage_who_746d4f: "我找到了一位专攻该领域的宫廷法师。"
  npc_override_prt_cas_quests_16_1_i_get_see_you_again_30824a: "又能见到你了。"
  npc_override_prt_cas_quests_16_1_i_get_see_you_again_f394b1: "又能见到你了。{0}。"
  npc_override_prt_cas_quests_16_1_i_given_up_wars_am_67d10e: "我已经放弃战争，正在寻找更好的解决方案，如果他能的话，请拜访家族看看人们。"
  npc_override_prt_cas_quests_16_1_i_go_around_banquet_hall_94ded4: "我会像一只 sleek 的猫一样在宴会厅里走动，在黑色礼服下隐藏一切。"
  npc_override_prt_cas_quests_16_1_i_going_help_knights_def_dabae8: "我本来要去骑士大楼帮助骑士防守，因为我听说很多居民逃到了那里。然而，这里的兵力似乎足够了。"
  npc_override_prt_cas_quests_16_1_i_grew_children_live_up_e32bcd: "我把孩子们培养得配得上罗根堡之名。"
  npc_override_prt_cas_quests_16_1_i_guarantee_you_monsters_d45493: "我向你保证，外面世界的怪物和地下城的怪物一定是不同的生物。"
  npc_override_prt_cas_quests_16_1_i_guess_adventurers_inte_661880: "我猜冒险者不太感兴趣；然而，有很多王室成员参与了黑暗领主的讨伐。我从他们那里听说了你的工作。"
  npc_override_prt_cas_quests_16_1_i_guess_all_i_you_1dbb12: "我想这就是我现在能为你做的一切。"
  npc_override_prt_cas_quests_16_1_i_guess_end_up_failure_3d1217: "我想这又会以失败告终。"
  npc_override_prt_cas_quests_16_1_i_guess_he_could_looking_de6c86: "我猜他可能在寻找某种他感兴趣的蓝图。"
  npc_override_prt_cas_quests_16_1_i_guess_he_obeyed_queen_bb63e2: "……我猜他服从了女王的意志。"
  npc_override_prt_cas_quests_16_1_i_guess_i_am_about_d6d71c: "……我想我快要忍不住了。"
  npc_override_prt_cas_quests_16_1_i_guess_i_don_t_d4285c: "我想我不用再解释了。把你想强化的装备带给我就行。"
  npc_override_prt_cas_quests_16_1_i_guess_i_no_choice_d76378: "我想我别无选择。"
  npc_override_prt_cas_quests_16_1_i_guess_i_should_go_7a239c: "我想我应该回去告诉他真相。"
  npc_override_prt_cas_quests_16_1_i_guess_i_should_nicer_042abb: "我想我应该对喜欢我的人更好一些。"
  npc_override_prt_cas_quests_16_1_i_guess_isenarm_didn_t_cc28dc: "我猜伊森纳姆不想让你卷入其中。如果他出了什么事，你才是麻烦最大的人。"
  npc_override_prt_cas_quests_16_1_i_guess_make_my_life_a2735f: "我想如果我放弃，我的生活会轻松很多。"
  npc_override_prt_cas_quests_16_1_i_guess_no_accident_inev_901da0: "……我想这不是意外；这是不可避免的……"
  npc_override_prt_cas_quests_16_1_i_guess_no_such_informat_baaa52: "我猜小偷之间没有这样的情报分享。如果你不想被送进监狱，就滚开。"
  npc_override_prt_cas_quests_16_1_i_guess_offer_hasn_t_f032bc: "我猜这个提议对你没有吸引力。抱歉，但等你改变主意后再来吧。"
  npc_override_prt_cas_quests_16_1_i_guess_other_families_m_5b8a6b: "我猜其他家族现在应该已经准备好了，即将行动。"
  npc_override_prt_cas_quests_16_1_i_guess_so_630c8f: "我想是的。"
  npc_override_prt_cas_quests_16_1_i_guess_so_i_help_9acb41: "我想是的。我会尽我所能帮助你。"
  npc_override_prt_cas_quests_16_1_i_guess_some_shady_chara_7e1f13: "我猜一些可疑人物一定混进了为宴会雇佣的临时工中。"
  npc_override_prt_cas_quests_16_1_i_guess_somewhat_similar_ad0b5b: "我猜和刚才发生的事有些相似。她当时说了一些关于比较的话……"
  npc_override_prt_cas_quests_16_1_i_guess_there_been_soldi_04b76c: "我猜在这样困难的时候，有士兵在休假。在我收到报告之前，我一直不知道这件事。"
  npc_override_prt_cas_quests_16_1_i_guess_there_many_stori_c03d2a: "我猜有很多关于皇家议会或宴会的故事。我现在在首都。为了读懂这里的气氛，我想我应该听听那些故事。"
  npc_override_prt_cas_quests_16_1_i_guess_those_intruders_7fa3de: "我猜那些入侵者一定是在爆炸期间拿走了它。"
  npc_override_prt_cas_quests_16_1_i_guess_we_don_t_7280ca: "但我想我们没有足够的时间做那个。"
  npc_override_prt_cas_quests_16_1_i_guess_we_picked_right_b29041: "我想我们选对了时间来这里——"
  npc_override_prt_cas_quests_16_1_i_guess_we_should_finish_4089c7: "……我想我们应该完成我们一直在做的事！"
  npc_override_prt_cas_quests_16_1_i_guess_we_should_finish_ebb8ea: "我想我们应该完成我们一直在做的事！"
  npc_override_prt_cas_quests_16_1_i_guess_we_won_t_89e3d2: "我想我们暂时无法返回本家了。"
  npc_override_prt_cas_quests_16_1_i_guess_what_you_done_d93c07: "我想你为我们所做的一切就是那么珍贵。"
  npc_override_prt_cas_quests_16_1_i_guess_where_been_dropp_2b55e5: "我能猜到它掉在哪里了……"
  npc_override_prt_cas_quests_16_1_i_guess_you_hero_palace_a70be4: "我想你将成为宫殿的英雄。"
  npc_override_prt_cas_quests_16_1_i_guess_you_out_luck_93a4b9: "我想你运气不好。装备坏了。啧啧。"
  npc_override_prt_cas_quests_16_1_i_guide_you_exchange_ite_6a7b7c: "我会根据你的职业引导你兑换物品。"
  npc_override_prt_cas_quests_16_1_i_had_start_gather_infor_7418b4: "我本该早点开始收集情报的。我因为其他事情太忙了，没能做到。"
  npc_override_prt_cas_quests_16_1_i_happen_eavesdrop_fishy_462ae1: "我碰巧偷听到了一段可疑的对话。"
  npc_override_prt_cas_quests_16_1_i_happen_see_someone_str_976b41: "我碰巧看到一个手臂粗壮的人……那些手臂……是什么把你带到这里来的？"
  npc_override_prt_cas_quests_16_1_i_hate_admit_darkness_st_8a3f40: "我不想承认这一点，但黑暗正在肆虐。我需要一些东西来控制它。"
  npc_override_prt_cas_quests_16_1_i_hate_admit_we_haven_a6e953: "我不想承认，但我们甚至还没确定这些怪物来自哪里。"
  npc_override_prt_cas_quests_16_1_i_hate_wars_too_f43c2b: "我也讨厌战争。"
  npc_override_prt_cas_quests_16_1_i_haven_t_met_bloke_e9bd7b: "我还没在那个区域见过那个家伙，但我一个被分配到那里的同伴说他可能相当凶猛。"
  npc_override_prt_cas_quests_16_1_i_hear_voices_somewhere_6c37bd: "我听到某处有声音。"
  npc_override_prt_cas_quests_16_1_i_hear_you_39771b: "我能听到你。"
  npc_override_prt_cas_quests_16_1_i_heard_adventurer_who_m_ee974a: "我听说那位对击败魔王梦罗克做出重大贡献的冒险者被邀请参加皇家宴会。"
  npc_override_prt_cas_quests_16_1_i_heard_found_beach_thes_7856a4: "我听说最近海滩上找不到了。相反，你可以通过击杀^0000cd克魔岛西部洞穴里的美杜莎^000000获得。"
  npc_override_prt_cas_quests_16_1_i_heard_he_doing_somethi_48f25e: "我听说他在和罗根堡家族的第三个儿子一起做什么。你不需要担心艾萨克。他知道如何照顾自己。"
  npc_override_prt_cas_quests_16_1_i_heard_my_grandson_unde_f3643f: "我听说我孙子最近欠你儿子人情。"
  npc_override_prt_cas_quests_16_1_i_heard_myer_he_sorry_510077: "我听迈尔说他很抱歉不能和我一起来宴会。他说他会派一个帅哥代替他做我的舞伴。"
  npc_override_prt_cas_quests_16_1_i_heard_news_his_death_122369: "几天后我听到了他的死讯。我想回去，但因为他的最后命令我不能。我甚至不能在他身边……"
  npc_override_prt_cas_quests_16_1_i_heard_po_next_head_081feb: "我听波说下任家主说你要尝试理查德的战斗训练项目。"
  npc_override_prt_cas_quests_16_1_i_heard_so_much_about_bc4f03: "我听说过很多关于你的事。我是你的超级粉丝！"
  npc_override_prt_cas_quests_16_1_i_heard_soldier_cathedra_13fb62: "我听大教堂的士兵说你救了那对夫妇，埃里乌斯和艾莉。"
  npc_override_prt_cas_quests_16_1_i_heard_soldier_dispatch_23cde4: "我听派驻区公所的士兵说，一个休假的士兵逃到了这里。"
  npc_override_prt_cas_quests_16_1_i_heard_soldier_dispatch_9c3d73: "我听派驻区公所附近的士兵说你帮助了村民。"
  npc_override_prt_cas_quests_16_1_i_heard_soldiers_dispatc_db7fcd: "我听派驻骑士大楼的士兵说你救了洛温。"
  npc_override_prt_cas_quests_16_1_i_heard_story_briefly_sk_e9429d: "我从斯奇亚那里简要听说了这个故事。"
  npc_override_prt_cas_quests_16_1_i_heard_story_my_father_639b4e: "我听我父亲说了这个故事。"
  npc_override_prt_cas_quests_16_1_i_heard_strange_gossip_s_4ca37c: "我护送伊森纳诺去宫殿时，从那里的一些骑士那里听到了一个^0000cd奇怪的传闻^000000。"
  npc_override_prt_cas_quests_16_1_i_heard_there_hot_hair_8bae0a: "我听说有一种^0000cd热发^000000，看起来在燃烧但一点也不热，虽然名字听起来矛盾。"
  npc_override_prt_cas_quests_16_1_i_heard_there_royal_fami_eb1e47: "我听说有王室家族^0000cd不参加皇家议会^000000。是谁？"
  npc_override_prt_cas_quests_16_1_i_heard_you_attended_ban_13a049: "我听说你安全地参加了宴会。"
  npc_override_prt_cas_quests_16_1_i_heard_you_one_who_9325ac: "我听说你是要参加仪式的人。"
  npc_override_prt_cas_quests_16_1_i_heard_you_saw_person_d7f365: "我听说你在国外看到了一个沃尔特家族的人。你在哪里看到他们的？你怎么知道他们是沃尔特家族的？"
  npc_override_prt_cas_quests_16_1_i_heard_your_name_you_fbb2a3: "我听说过你的名字，因为{0}，你是讨伐梦罗克的英雄"
  npc_override_prt_cas_quests_16_1_i_hope_able_cook_you_07aa00: "希望能再次和你一起做饭！"
  npc_override_prt_cas_quests_16_1_i_hope_able_get_away_95e1f0: "希望能摆脱宴会的准备工作。"
  npc_override_prt_cas_quests_16_1_i_hope_deal_goes_well_b93c5f: "希望交易顺利，伙计。"
  npc_override_prt_cas_quests_16_1_i_hope_everything_ok_8e344f: "希望一切顺利。"
  npc_override_prt_cas_quests_16_1_i_hope_helps_e3e2f2: "希望这有帮助。"
  npc_override_prt_cas_quests_16_1_i_hope_i_see_you_916905: "希望稍后能见到你。"
  npc_override_prt_cas_quests_16_1_i_hope_queen_ernst_take_1afac8: "希望女王和恩斯特能休息一下。"
  npc_override_prt_cas_quests_16_1_i_hope_we_get_share_7f445b: "希望我们能有机会分享更多故事。"
  npc_override_prt_cas_quests_16_1_i_hope_wolf_lead_everyth_9eac6c: "但我希望沃尔夫能领导一切。皇家议会结束后，请告诉沃尔夫，我会^0000cd把继承人的位置传给他^000000。"
  npc_override_prt_cas_quests_16_1_i_hope_works_time_12109e: "希望这次能成功。"
  npc_override_prt_cas_quests_16_1_i_hope_you_don_t_a17f8b: "希望你不浪费你的天赋。"
  npc_override_prt_cas_quests_16_1_i_hope_you_enjoy_banquet_e22b1f: "希望你享受宴会，因为它是为你举办的。"
  npc_override_prt_cas_quests_16_1_i_hope_you_good_time_ed25bd: "希望你在那里过得愉快，亲爱的英雄。"
  npc_override_prt_cas_quests_16_1_i_hope_you_like_6326cc: "希望你喜欢。"
  npc_override_prt_cas_quests_16_1_i_hope_you_visit_wigner_130ecb: "希望你能拜访维格纳家族，从^0000cd艾萨克·维格纳^000000那里带一样东西。"
  npc_override_prt_cas_quests_16_1_i_hoped_he_stay_time_7d57d4: "我希望他能暂时留下来，但很难过他突然离开了。"
  npc_override_prt_cas_quests_16_1_i_hunch_something_big_ab_304e48: "我有种预感，大事即将发生。"
  npc_override_prt_cas_quests_16_1_i_i_see_4d3ef9: "我……我明白了。"
  npc_override_prt_cas_quests_16_1_i_invited_you_no_special_cee716: "我邀请你没有特别的原因。"
  npc_override_prt_cas_quests_16_1_i_just_giving_my_sister_ed271d: "我只是在给我妹妹一个推动。"
  npc_override_prt_cas_quests_16_1_i_just_noticed_certain_d_9c7b7b: "我刚注意到某些差异。"
  npc_override_prt_cas_quests_16_1_i_just_sent_message_magi_f7fbaf: "我刚发了消息。魔术师很快就会到这里。"
  npc_override_prt_cas_quests_16_1_i_just_thought_crusaders_cc3dcc: "我只是以为十字军释放他们是为了扰乱囚犯的平静休息。"
  npc_override_prt_cas_quests_16_1_i_keep_thinking_about_wh_9ca948: "我一直在想这是多么重大的责任，我应该多么努力，等等……"
  npc_override_prt_cas_quests_16_1_i_knew_he_been_hanging_6fa465: "我就知道。他和那个三流家族的小混混混太久了……"
  npc_override_prt_cas_quests_16_1_i_knew_nothing_about_uni_ae8302: "我对统一一无所知，但我希望不要爆发战争。"
  npc_override_prt_cas_quests_16_1_i_knew_something_when_he_1f4cbb: "赫尔穆特离开时我就知道些什么，但我没想到他会放弃继承权。"
  npc_override_prt_cas_quests_16_1_i_knew_talk_about_poor_4a57fe: "我就知道。服务太差了！"
  npc_override_prt_cas_quests_16_1_i_knew_you_come_again_0cf383: "我就知道你会再来！"
  npc_override_prt_cas_quests_16_1_i_knew_you_give_up_13185f: "我就知道。你太容易放弃了。你还年轻，你知道的。"
  npc_override_prt_cas_quests_16_1_i_knew_you_i_been_313a6c: "我就知道你会的！我一直看对了你！"
  npc_override_prt_cas_quests_16_1_i_know_almost_impossible_aea44e: "……我知道改变过去几乎是不可能的。"
  npc_override_prt_cas_quests_16_1_i_know_as_much_as_270b7e: "我知道的和你一样多。"
  npc_override_prt_cas_quests_16_1_i_know_banquet_held_some_f2f6f6: "我知道这个宴会是为别人举办的。然而，这仍然是我遇到可以共度一生的人的好机会。"
  npc_override_prt_cas_quests_16_1_i_know_emergency_i_d_277108: "我知道这是紧急情况，但我想安慰一下我同事的灵魂。"
  npc_override_prt_cas_quests_16_1_i_know_few_things_about_33fe89: "我对E区其实知道一些。"
  npc_override_prt_cas_quests_16_1_i_know_how_troubling_you_8c440c: "我知道这让你很困扰，但请帮助我们。你没有忘记该带什么，对吧？"
  npc_override_prt_cas_quests_16_1_i_know_i_m_prisoner_b4eacc: "我知道我是这里的囚犯，但我不明白为什么他们必须把我关在这个又脏又潮湿的地方。"
  npc_override_prt_cas_quests_16_1_i_know_no_one_around_304674: "我周围没有人能进入宫殿，书店也不卖。请帮我找。"
  npc_override_prt_cas_quests_16_1_i_know_s_lot_things_f6938c: "我知道要拿的东西很多，但我相信我们需要所有这些来让我们的妹妹感觉好一些。"
  npc_override_prt_cas_quests_16_1_i_know_story_too_i_f81bbb: "我也知道这个故事。但我不确定告诉你这个故事是对还是错。"
  npc_override_prt_cas_quests_16_1_i_know_unlikely_helmut_b_0cf8c4: "但我知道赫尔穆特不太可能成为国王，所以让他们随心所欲吧。"
  npc_override_prt_cas_quests_16_1_i_know_what_you_mean_8ddd37: "我明白你的意思。"
  npc_override_prt_cas_quests_16_1_i_know_you_come_here_9bb1a4: "我知道你来这里是为了监视我们。"
  npc_override_prt_cas_quests_16_1_i_learned_hide_fight_9814bf: "我学会了隐藏和战斗。"
  npc_override_prt_cas_quests_16_1_i_let_children_as_they_f4c52c: "我一直让孩子们做他们想做的事，但我想避免战争。"
  npc_override_prt_cas_quests_16_1_i_let_elders_know_about_88d16e: "我无论如何都要让长辈们知道这件事。"
  npc_override_prt_cas_quests_16_1_i_let_you_as_you_a96b6a: "我一直让你做你想做的事，但这次我希望你能按照阿格涅斯说的做。如果可能的话，我想避免战争。"
  npc_override_prt_cas_quests_16_1_i_like_anything_pretty_65fb24: "我喜欢任何漂亮的东西！"
  npc_override_prt_cas_quests_16_1_i_like_banquet_hall_leas_f048f4: "我想至少在宴会厅里。"
  npc_override_prt_cas_quests_16_1_i_like_black_dress_remin_6f10c0: "我喜欢让人想起黑夜的黑色礼服。一条如此优雅美丽，让人们默默赞叹的礼服。"
  npc_override_prt_cas_quests_16_1_i_like_give_you_reward_53de0e: "我想给你奖励，但恐怕我没有多少。如果是我鼎盛时期，我会给你全世界的宝藏。"
  npc_override_prt_cas_quests_16_1_i_like_go_find_myself_12d461: "我想自己去找，但我现在的处境不允许……"
  npc_override_prt_cas_quests_16_1_i_like_how_you_refuse_ff2fcb: "我喜欢你拒绝得这么干脆"
  npc_override_prt_cas_quests_16_1_i_like_make_fairy_dress_dbf964: "我想做一件仙女礼服！一条在金色光芒中闪耀，让所有人都赞叹的礼服。"
  npc_override_prt_cas_quests_16_1_i_like_make_handsome_pay_7c13e7: "如果像你这样有名的冒险者帮助我们，我想支付一笔丰厚的报酬。"
  npc_override_prt_cas_quests_16_1_i_like_prepare_myself_i_1067a7: "我想自己准备，但我只是一块清洁海绵。"
  npc_override_prt_cas_quests_16_1_i_like_talk_manager_some_b20113: "我想和经理谈，而不是某个普通职员！"
  npc_override_prt_cas_quests_16_1_i_like_use_pearls_make_5df9f0: "我想用珍珠做项链和手镯。你可以从怪物那里得到珍珠。你能帮我找吗？"
  npc_override_prt_cas_quests_16_1_i_like_way_now_though_f0089f: "不过我喜欢现在的方式。"
  npc_override_prt_cas_quests_16_1_i_ll_after_you_quietly_28fd03: "我会悄悄跟在你后面。"
  npc_override_prt_cas_quests_16_1_i_ll_contact_you_again_bc6565: "当我内心的黑暗开始肆虐时，我会再次联系你。"
  npc_override_prt_cas_quests_16_1_i_ll_decide_what_make_feaa8b: "完成这个后，我会决定接下来做什么。"
  npc_override_prt_cas_quests_16_1_i_ll_enhance_one_flatter_781e8c: "我会用20个荣誉徽章强化奉承长袍或谩骂长袍的一个插槽。我最多可以强化2个插槽。重置需要10个荣誉徽章。你明白了吗？"
  npc_override_prt_cas_quests_16_1_i_ll_exchange_rune_magic_120eeb: "我会^0000ff用30个卢恩魔法粉末兑换1个神秘蓝盒^000000。你觉得怎么样？这是一笔很划算的交易，不是吗？"
  npc_override_prt_cas_quests_16_1_i_ll_get_approval_you_320c5b: "我会帮你获得每天访问王室往事的批准。"
  npc_override_prt_cas_quests_16_1_i_ll_get_over_232de1: "我会克服的！"
  npc_override_prt_cas_quests_16_1_i_ll_go_back_head_01a0ae: "我要回本家。请给我许可。"
  npc_override_prt_cas_quests_16_1_i_ll_go_bdfa8f: "我去。"
  npc_override_prt_cas_quests_16_1_i_ll_go_my_own_fe0746: "我自己去。"
  npc_override_prt_cas_quests_16_1_i_ll_hang_there_just_b3f5be: "我会坚持的。只是不要太晚……"
  npc_override_prt_cas_quests_16_1_i_ll_here_immediately_li_3ca0e6: "我会像闪电一样立刻到这里——"
  npc_override_prt_cas_quests_16_1_i_ll_i_ll_make_feace4: "我会……我会确保保卫这个地方。"
  npc_override_prt_cas_quests_16_1_i_ll_inscribe_your_name_2f4aec: "我会把你的名字刻在这里。希望你能继续成为我同胞的信使。"
  npc_override_prt_cas_quests_16_1_i_ll_let_you_travel_916a8b: "我会让你坐头等舱！"
  npc_override_prt_cas_quests_16_1_i_ll_make_best_dish_862ed7: "我会做最好的菜！"
  npc_override_prt_cas_quests_16_1_i_ll_make_squeaky_clean_eb34a5: "我会把它擦得像这样 squeaky 干净！"
  npc_override_prt_cas_quests_16_1_i_ll_make_sure_ask_5a8450: "我会确保尽可能礼貌地问她。请放松在这里等。"
  npc_override_prt_cas_quests_16_1_i_ll_make_sure_i_b6c68d: "我会确保的。我以艾萨克·维格纳之名发誓。"
  npc_override_prt_cas_quests_16_1_i_ll_make_sure_there_069825: "我会确保你在宫殿居住期间没有任何不便。"
  npc_override_prt_cas_quests_16_1_i_ll_make_work_wait_312fbe: "……我会想办法的，等一下。"
  npc_override_prt_cas_quests_16_1_i_ll_mark_places_which_e6cc45: "我会在地图上标记由于情况原因士兵尚未派遣的地方。"
  npc_override_prt_cas_quests_16_1_i_ll_my_way_1cb0d2: "我走了。"
  npc_override_prt_cas_quests_16_1_i_ll_play_alpen_rose_f182af: "我会演奏《阿尔卑斯玫瑰》。"
  npc_override_prt_cas_quests_16_1_i_ll_play_dazzling_snow_3b5723: "我会演奏《耀眼的雪》。"
  npc_override_prt_cas_quests_16_1_i_ll_play_dream_whale_fc4cf9: "我会演奏《鲸之梦》。"
  npc_override_prt_cas_quests_16_1_i_ll_play_eclage_6a4a36: "我会演奏《艾克拉奇》。"
  npc_override_prt_cas_quests_16_1_i_ll_play_good_morning_4c8abb: "我会演奏《早安》，它背后有一个悲伤的故事。"
  npc_override_prt_cas_quests_16_1_i_ll_play_i_miss_1c3568: "我会演奏《我想你》。"
  npc_override_prt_cas_quests_16_1_i_ll_play_jittering_nigh_33e419: "我会演奏《颤抖的噩梦》。"
  npc_override_prt_cas_quests_16_1_i_ll_play_marschmallow_w_2dc4b1: "我会演奏《棉花糖华尔兹》。"
  npc_override_prt_cas_quests_16_1_i_ll_play_one_step_c31501: "我会演奏《更近一步》。"
  npc_override_prt_cas_quests_16_1_i_ll_play_so_far_9ebd53: "我会演奏《并非遥不可及》。"
  npc_override_prt_cas_quests_16_1_i_ll_play_splendide_drea_000f4f: "我会演奏《辉煌之梦》。"
  npc_override_prt_cas_quests_16_1_i_ll_play_tales_east_4a640d: "我会演奏《东方传说》。"
