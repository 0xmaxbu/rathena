  npc_override_prt_cas_quests_16_1_you_attacked_kids_again_0bb2cb: "你可能会再次被孩子们攻击。"
  npc_override_prt_cas_quests_16_1_you_attend_banquet_13b9d3: "你会参加宴会吗？"
