Body:
  npc_override_ba_in01_enchan_sage_legacy_17_2_automatic_accessories_ex_4b6041: "^FF0000自动饰品^000000可以兑换为^0000CD幻象饰品和1500巴米尔券^000000。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_automatic_equipment_alre_0af9d8: "这件自动装备已达到最大容量。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_automatic_equipment_alre_9e1449: "这件自动装备已从此模块获得最大强化。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_bag_full_please_check_we_f5d9b3: "背包已满。请检查负重和物品数量后再与我对话。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_bring_only_one_equipment_1e9d99: "^FF0000只带一件你想兑换的装备来与我对话。^000000"
  npc_override_ba_in01_enchan_sage_legacy_17_2_cancel_77dfd2: "取消"
  npc_override_ba_in01_enchan_sage_legacy_17_2_done_according_specifica_f63966: "这是按照规格模块进行的，所以装备不会被破坏。不过，升级次数可能会因模块而异。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_equipment_you_want_excha_b9c4df: "你想兑换的装备必须在你的背包中，然后与我对话。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_exchange_5dfc87: "兑换。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_exchange_barmeal_ticket_983bd1: "兑换巴米尔券。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_exchange_barmeal_ticket_b4db71: "兑换巴米尔券。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_exchange_information_cf749f: "兑换信息"
  npc_override_ba_in01_enchan_sage_legacy_17_2_explore_devices_bfd7b1: "探索装置"
  npc_override_ba_in01_enchan_sage_legacy_17_2_fun_your_new_friend_33e555: "与你的新朋友玩得开心！"
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchange_magical_autom_cd6a7f: "我将用^FF00001个魔法自动改良装置^000000兑换{0} {1}或{2} Zeny。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchange_physical_auto_d295f3: "我将用^FF00001个物理自动改良装置^000000兑换{0} {1}或{2} Zeny。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchange_random_automa_b25375: "我将用1个随机自动模块（史诗等级除外）兑换{0} {1}。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchanged_one_random_a_6f53ec: "已兑换为1个随机自动模块。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchanged_one_random_m_627ced: "已兑换为1个随机魔法自动改良装置。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchanged_one_random_p_2658c1: "已兑换为1个随机物理自动改良装置。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_m_also_providing_physi_4d61b7: "我也提供^FF0000物理自动改良装置和魔法自动改良装置^000000。你可以用^0000CD45张巴米尔券^000000或^0000CD1500000 Zeny^000000来兑换。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_provide_you_automatic_7d3272: "我可以为你提供自动模块、物理自动改良装置和魔法自动改良装置。这将帮助你提升自动装备的能力。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_whole_bunch_little_stu_90b374: "我有一大堆小东西！"
  npc_override_ba_in01_enchan_sage_legacy_17_2_if_there_multiple_equipm_b4a9d8: "如果你的背包中有多个装备，符合条件的将随机兑换。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_if_you_bring_automatic_e_a56b2a: "如果你带来自动装备和强化模块，我们可以在装备上附魔相应的模块。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_if_you_want_play_little_379cf2: "如果你想和小管家玩，需要花费30张巴米尔券。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_like_i_said_if_you_7572a7: "就像我说的，如果你想和小管家玩，你需要30张巴米尔券！"
  npc_override_ba_in01_enchan_sage_legacy_17_2_little_manager_855c9d: "小管家"
  npc_override_ba_in01_enchan_sage_legacy_17_2_more_information_24dbab: "更多信息。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_nice_day_dear_guest_5a6712: "祝您愉快，亲爱的客人~"
  npc_override_ba_in01_enchan_sage_legacy_17_2_please_clear_your_invent_2b71b2: "请清理背包后再试。-"
  npc_override_ba_in01_enchan_sage_legacy_17_2_please_make_sure_you_equ_d2c60c: "请确保你已装备好想要强化的自动装备。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_please_select_grade_modu_56e421: "请选择你想使用的模块等级。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_please_try_another_autom_538b60: "请尝试另一件自动装备。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_please_try_another_modul_b358d8: "请尝试另一个模块。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_seems_type_weight_item_y_373530: "^ff0000你拥有的物品类型或重量似乎过多。请整理背包。^000000"
  npc_override_ba_in01_enchan_sage_legacy_17_2_sorry_registration_requi_971790: "抱歉。购买蝴蝶需要注册。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_stopping_conversation_80338d: "停止对话。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_then_combat_specialized_661649: "那么，专精战斗的客人，请安全地提升你的能力。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_then_please_visit_again_ba9c60: "那么需要帮助时请再来拜访~"
  npc_override_ba_in01_enchan_sage_legacy_17_2_then_s_time_me_play_70d18b: "那么，该我玩了！"
  npc_override_ba_in01_enchan_sage_legacy_17_2_transaction_ended_b41ecb: "交易结束。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_unknown_error_occurred_0db2bf: "发生了未知错误。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_varmundt_no_doubt_best_m_3bec3e: "瓦尔蒙特无疑是世界上最优秀的人！"
  npc_override_ba_in01_enchan_sage_legacy_17_2_wait_don_t_f8e10f: "等等……不要"
  npc_override_ba_in01_enchan_sage_legacy_17_2_we_accept_barmeal_ticket_6e2e54: "我们接受巴米尔券，用于将你的幻象装备升级为自动装备。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_we_offering_reinforcemen_a37c3e: "我们提供强化方块，可立即将你的^0000CD+4^000000幻象和自动装备精炼至^FF0000+7^000000！"
  npc_override_ba_in01_enchan_sage_legacy_17_2_welcome_724486: "欢迎。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_welcome_welcome_dfc093: "欢迎欢迎~"
  npc_override_ba_in01_enchan_sage_legacy_17_2_what_you_like_exchange_ac3018: "你想兑换什么？"
  npc_override_ba_in01_enchan_sage_legacy_17_2_woaaaah_i_feel_power_you_45efe6: "哇啊啊~我已经能感受到你自动装备的力量了~！"
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_don_t_enough_barmeal_d18188: "你的巴米尔券不足以进行兑换。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_don_t_enough_zeny_9544d2: "你的Zeny不足以进行兑换。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_enchant_module_autom_249cdf: "你无法为此自动装备附魔此模块。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_exchange_your_illusi_ecd976: "你可以用^0000CD+9幻象铠甲、引擎或腿部装备和900张巴米尔券^000000兑换^FF0000自动铠甲、引擎或腿部装备^000000。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_get_automatic_module_b734dc: "你可以用^0000CD90张巴米尔券^000000获得一个^FF0000自动模块^000000。我会给你一个随机自动模块（史诗等级除外）。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_must_possess_module_7be46f: "你的背包中必须持有与功效匹配的模块才能进行强化。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_need_wings_move_barm_fcfe13: "你需要翅膀前往巴蒙德宅邸吗？"
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_sure_you_want_enchan_9f6056: "你确定要用^0000CD{1}^000000强化^FF0000{0}^000000吗？此过程不可逆。"
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_too_many_items_e50381: "- 你的物品太多了。"
  npc_override_ba_in01_quests_17_2_all_automatic_dolls_mans_b5d3fc: "{0}，宅邸里所有的自动人偶都……亲爱的……哦……"
  npc_override_ba_in01_quests_17_2_combatant_f95592: "{0}是一名战斗者。"
  npc_override_ba_in01_quests_17_2_if_you_don_t_want_7268e3: "{0}，如果你不想被宅邸里的其他自动人偶误解，特别是在禁区附近，你应该提前表明身份。"
  npc_override_ba_in01_quests_17_2_menu_options_08a6c1: "{0}：我知道！"
  npc_override_ba_in01_quests_17_2_menu_options_0f8c7a: "{0}：我找不到合适的东西。我们再找找吧。"
  npc_override_ba_in01_quests_17_2_menu_options_106bd4: "{0}：我就让它这样堆着吧。"
  npc_override_ba_in01_quests_17_2_menu_options_233e89: "{0}：看起来可以用作身体。我拿走了。接下来找手臂吧。"
  npc_override_ba_in01_quests_17_2_menu_options_33b641: "{0}：既然你已经找到了所有应急钥匙，我们去打开锁着的门吧。"
  npc_override_ba_in01_quests_17_2_menu_options_3a5111: "{0}：我们去找另一把应急钥匙吧。"
  npc_override_ba_in01_quests_17_2_menu_options_3b71b4: "{0}：她说这边有一把应急钥匙……{1}"
  npc_override_ba_in01_quests_17_2_menu_options_45924e: "{0}：我非常渴望……"
  npc_override_ba_in01_quests_17_2_menu_options_475f88: "{0}：手臂……手臂……不知道哪个合适……"
  npc_override_ba_in01_quests_17_2_menu_options_50a707: "{0}：我想我已经听够了故事。我现在该回茶馆了吗？"
  npc_override_ba_in01_quests_17_2_menu_options_5905e2: "{0}：我不应该碰这些东西。"
  npc_override_ba_in01_quests_17_2_menu_options_5922c6: "{0}：他会满意这样的腿吗？我们回去吧。"
  npc_override_ba_in01_quests_17_2_menu_options_7a3db1: "{0}：我已经找到了有用的手臂。现在，我们去找一条腿吧。"
  npc_override_ba_in01_quests_17_2_menu_options_7bfa04: "{0}：让我看看……什么可以用作身体……"
  npc_override_ba_in01_quests_17_2_menu_options_962a27: "{0}：这不危险吗？"
  npc_override_ba_in01_quests_17_2_menu_options_a30774: "{0}：我说的是实话……"
  npc_override_ba_in01_quests_17_2_menu_options_b43a11: "{0}：这对手臂来说够好吗？没问题吗？暂时先拿着吧。现在我们要做的就是找一条腿。"
  npc_override_ba_in01_quests_17_2_menu_options_b4b765: "{0}：我找到了！！！"
  npc_override_ba_in01_quests_17_2_menu_options_cddc73: "{0}：我已将陷阱牢固地设置在标记位置。让我们前往下一个地点。"
  npc_override_ba_in01_quests_17_2_menu_options_eab5dc: "{0}：我终于把所有的陷阱都安装好了。我现在该去哪里？"
  npc_override_ba_in01_quests_17_2_menu_options_f8b8dc: "{0}：一定是这里。设置陷阱后冷空气开始流动。让我们前往下一个地点。"
  npc_override_ba_in01_quests_17_2_menu_options_fa0923: "{0}：我已经找到所有东西了。我们回去吧。"
  npc_override_ba_in01_quests_17_2_menu_options_fac386: "{0}：我已按照拉基的要求设置了陷阱。让我们前往下一个地点。"
  npc_override_ba_in01_quests_17_2_menu_options_face08: "{0}：我已经找到了对身体有用的东西。现在，让我们去找一只手臂。"
  npc_override_ba_in01_quests_17_2_msg_e62db8: "{0}！！！"
  npc_override_ba_in01_quests_17_2_party_entering_d3d912: "队伍中的{0}，{1}，正在进入{2}。"
  npc_override_ba_in01_quests_17_2_people_been_registered_94d6b2: "{0}和4……5……4……6……7……4……3……人已登记。"
  npc_override_ba_in01_quests_17_2_reservation_instance_fai_f7a70c: "由于存在活跃副本，副本'{0}'的预约失败。"
  npc_override_ba_in01_quests_17_2_should_come_here_everyda_552a38: "^0000CD{0}应该每天来这里^000000，帮忙清理仓库和地下室。"
  npc_override_ba_in01_quests_17_2_thank_you_very_much_05e0b6: "{0}，非常感谢。"
  npc_override_ba_in01_quests_17_2_welcome_back_you_looked_579f57: "{0}，欢迎回来。你参观过宅邸了吗？另外，你把消息传达给损坏中继器附近的自动人偶了吗？"
  npc_override_ba_in01_quests_17_2_welcome_varmundt_s_mansi_e4824d: "{0}。欢迎来到瓦尔蒙特的宅邸。很高兴认识你。我是这宅邸的管家。"
  npc_override_ba_in01_quests_17_2_what_purpose_your_visit_b583be: "{0}。你来宅邸的目的是什么？"
  npc_override_ba_in01_quests_17_2_you_acting_whim_too_i_c4c359: "{0}，你也是一时兴起吗？我对人类还不太了解。有很多需要知道的。我就是这么准备的。我不会让他们再偷走它了。"
  npc_override_ba_in01_quests_17_2_you_catch_you_b0aff4: "{0}。你能抓住那个吗？你能做到吗？"
  npc_override_ba_in01_quests_17_2_you_sure_3ec590: "{0}，你确定吗？"
