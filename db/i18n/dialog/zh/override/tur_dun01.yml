Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_tur_dun01_flute_as_i_see_you_already_29f61d: "看来你已经有了猎鹰笛！"
  npc_override_tur_dun01_flute_as_s_now_i_may_bca69b: "就目前而言，我可能永远不会有猎鹰。"
  npc_override_tur_dun01_flute_bamboo_cut_obtained_kaph_8aaa27: "^4d4dff竹片可以从卡帕或唐伞妖怪处获得。^000000"
  npc_override_tur_dun01_flute_course_you_ll_need_skill_c8c1a0: "当然，你需要^ff0000猎鹰掌控^000000技能。"
  npc_override_tur_dun01_flute_currently_i_t_help_you_1949cf: "目前我帮不了你，"
  npc_override_tur_dun01_flute_don_t_worry_my_young_af2c32: "别担心，我的年轻朋友，一旦你购买了猎鹰笛，就不需要再买了"
  npc_override_tur_dun01_flute_eeehh_you_ranger_9f9ebd: "呃？你不是游侠？"
  npc_override_tur_dun01_flute_flute_only_crafted_me_3d2683: "笛子只能由我制作。"
  npc_override_tur_dun01_flute_ha_ha_ha_aabfe5: "哈哈哈！"
  npc_override_tur_dun01_flute_hello_young_one_ed4429: "你好，年轻人！"
  npc_override_tur_dun01_flute_here_s_new_wolf_flute_b7dece: "这是新的狼笛。"
  npc_override_tur_dun01_flute_here_take_flute_e42280: "来，拿着这个笛子。"
  npc_override_tur_dun01_flute_hope_you_ready_use_3dd8d7: "希望你准备好使用它了。"
  npc_override_tur_dun01_flute_i_don_t_skill_so_6a9329: "我没有这个技能，所以我不知道如何操控猎鹰。"
  npc_override_tur_dun01_flute_i_m_sorry_you_don_f40333: "很抱歉，你没有足够的钱买猎鹰笛，请等你有了更多的钱再来！"
  npc_override_tur_dun01_flute_i_make_money_since_i_44f0c4: "我也要赚钱，因为我也要吃饭！"
  npc_override_tur_dun01_flute_i_t_give_you_one_ef331e: "但我不能免费给你一个！"
  npc_override_tur_dun01_flute_if_you_need_falcon_flute_971093: "如果你需要猎鹰笛，我会以12,500 Zeny的价格出售。或者太贵了？"
  npc_override_tur_dun01_flute_if_you_summon_wolf_then_928130: "如果你不召唤狼，那么你就不需要狼笛。"
  npc_override_tur_dun01_flute_if_you_want_craft_new_bff6a8: "如果你想制作一个新的狼笛，我需要你带来^4d4dff1个竹片和100,000 Zeny。^000000"
  npc_override_tur_dun01_flute_isn_t_beautiful_day_toda_dd295a: "今天不是美好的一天吗？"
  npc_override_tur_dun01_flute_isn_t_right_2c61c4: "不是吗？"
  npc_override_tur_dun01_flute_just_little_matter_me_cr_c83b28: "对我来说再制作一个笛子只是小事一桩！！"
  npc_override_tur_dun01_flute_just_reminder_8c9913: "只是提醒一下。"
  npc_override_tur_dun01_flute_magical_flute_you_call_y_44c2b3: "有了魔法笛，你可以从任何地方召唤你的猎鹰！"
  npc_override_tur_dun01_flute_menu_don_ac4493: "不买:购买猎鹰笛"
  npc_override_tur_dun01_flute_menu_please_7cba8e: "请给我一个新的狼笛。:不。"
  npc_override_tur_dun01_flute_new_wolf_flute_d00ce6: "新的狼笛？"
  npc_override_tur_dun01_flute_rangers_however_i_specia_b1b103: "对于游侠，我有一个特别的价格，10,000 Zeny！"
  npc_override_tur_dun01_flute_s_because_i_no_clue_d48095: "那是因为我完全不知道它们是怎么运作的。"
  npc_override_tur_dun01_flute_s_good_enough_a9083d: "那就够了。"
  npc_override_tur_dun01_flute_s_marvelous_isn_t_ha_d2bbab: "太棒了，不是吗？哈哈哈！"
  npc_override_tur_dun01_flute_s_too_bad_if_you_67f8cc: "太糟糕了。如果你需要，就回来！"
  npc_override_tur_dun01_flute_since_falcon_flute_won_t_ac83c6: "因为猎鹰笛使用后不会消失，这不是很好吗？"
  npc_override_tur_dun01_flute_then_flute_totally_usele_c73146: "那这个笛子对你完全没用了！"
  npc_override_tur_dun01_flute_why_don_t_you_return_3b5bd0: "但为什么不在你成为伟大的猎人并学会正确操控猎鹰后再回来找我呢？"
  npc_override_tur_dun01_flute_why_i_m_selling_these_051b0f: "我为什么要卖这些猎鹰笛？"
  npc_override_tur_dun01_flute_wolf_flute_you_crafted_m_e28134: "你拥有的狼笛是我自己用木头制作的。"
  npc_override_tur_dun01_flute_wow_all_your_materials_b_e9e21f: "哇！你所有的材料都不错！"
  npc_override_tur_dun01_flute_you_brought_all_material_99d4f6: "你把所有材料都带来了吗？"
  npc_override_tur_dun01_flute_you_come_back_here_find_39a86a: "如果你丢失了狼笛，你可以回到这里找我！"
  npc_override_tur_dun01_flute_you_come_back_here_find_db5222: "如果你改变主意，你可以回到这里找我。"
  npc_override_tur_dun01_flute_you_need_anything_80d6e0: "你需要什么吗？"
  npc_override_tur_dun01_flute_you_need_falcon_0fb715: "你需要猎鹰吗？"
  npc_override_tur_dun01_flute_you_need_skill_falcon_ma_84f468: "你需要^ff0000猎鹰掌控^000000技能才能使用它！"
  npc_override_tur_dun01_flute_you_whistle_your_falcon_8abb47: "有了它，你可以从任何地方吹哨召唤你的猎鹰。"