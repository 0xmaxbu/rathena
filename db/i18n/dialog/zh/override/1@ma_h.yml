  npc_override_1@ma_h_BangungotHospital_i_m_pretty_sure_e4fa2d: "我非常确定它"
  npc_override_1@ma_h_BangungotHospital_i_pretty_much_know_0ffc5f: "我大概知道。"
  npc_override_1@ma_h_BangungotHospital_i_really_appreciate_d0d354: "我真的很感激。"
  npc_override_1@ma_h_BangungotHospital_i_t_talk_him_alone_02f493: "我无法单独和他谈话。"
  npc_override_1@ma_h_BangungotHospital_if_you_change_mind_come_3994b4: "如果你改变主意，再回来找我。"
  npc_override_1@ma_h_BangungotHospital_if_you_want_go_up_43923f: "如果你想上去"
  npc_override_1@ma_h_BangungotHospital_let_me_try_say_something_ad6b17: "让我试着说点什么。-"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_0524fb: "班贡诺特：你无法帮忙……你无法击败我。"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_182b78: "班贡诺特：这就是你的噩梦开始的地方……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_1ac3fa: "班贡诺特：我……不能……就这样……结束……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_1fc968: "班贡诺特：你这个愚蠢的 {0} ……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_253723: "班贡诺特：真正的痛苦！你会知道的！！"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_2615ad: "班贡诺特：你听过病人的尖叫声吗？"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_31a66e: "班贡诺特：我会回来的！！！！！"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_479e64: "班贡诺特：你选择进入这里，但你想离开就没那么容易了……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_5f4f81: "班贡诺特：我的手下……！！去吧！！去病房折磨那些病人！！"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_6b8c43: "班贡诺特：在你死之前出去……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_7250e4: "班贡诺特：你想和我一起玩吗……？"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_77b909: "班贡诺特：你相当强大……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_7936af: "班贡诺特：如果你有胆量，就杀了我！！我很快就会复活！！！"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_7b1138: "班贡诺特：留在这里，被诅咒的疾病……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_8bbcc6: "班贡诺特：……再次击败我……？"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_8d6d79: "班贡诺特：我永远不会死！！！！"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_8efd34: "班贡诺特：哈哈哈哈哈哈哈哈！！！！"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_9ae646: "班贡诺特：哦……不敢相信我会输……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_a38c72: "班贡诺特：但是你能……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_ae01d4: "班贡诺特：痛苦带来的快乐是我的养分。"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_b3b70e: "班贡诺特：我不能就这样死去……！！！！"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_ba92e6: "班贡诺特：如果你没听过，我会让你听个够！！"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_bee0c4: "班贡诺特：我的灵魂将与你被诅咒的身体同在……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_bfd0fa: "班贡诺特：哈哈哈……这还不够，我会变得更强……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_d4a339: "班贡诺特：你这个愚蠢的人……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_d955f0: "班贡诺特：你们这些可怜的小东西。我会邀请你们进入传染病的世界……"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_dbbc60: "班贡诺特：但别以为这就结束了！！"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_f31038: "班贡诺特：哈哈哈哈！！我借助灵魂之柱的力量回来了！！！"
  npc_override_1@ma_h_BangungotHospital_menu_bangungot_f65882: "班贡诺特：你会知道那是什么……"
  npc_override_1@ma_h_BangungotHospital_menu_moaning_df9bbf: "呻吟的病人：啊啊啊……"
