Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@tnm1_DevilTower_after_listening_all_expl_e65287: "听完这些说明之后？"
  npc_override_1@tnm1_DevilTower_all_you_33de04: "这就是你的全部了。"
  npc_override_1@tnm1_DevilTower_annoying_d13e05: "……烦人"
  npc_override_1@tnm1_DevilTower_anyway_ready_enter_753466: "总之，准备好进入了吗？"
  npc_override_1@tnm1_DevilTower_back_up_soldiers_so_why_5eb91f: "援军？那你为什么只是站在这里？"
  npc_override_1@tnm1_DevilTower_because_she_s_mostly_mac_5496c1: "因为她大部分已经是机械了……"
  npc_override_1@tnm1_DevilTower_behind_shelf_secret_pass_f03944: "那个架子后面有一条通往地下室的秘密通道！"
  npc_override_1@tnm1_DevilTower_better_get_964e1e: "最好赶紧行动。"
  npc_override_1@tnm1_DevilTower_better_info_better_zeny_189658: "信息越有价值~我付给你的Zeny就越多！"
  npc_override_1@tnm1_DevilTower_body_gift_gods_af2eff: "这具身体是神赐予的礼物。"
  npc_override_1@tnm1_DevilTower_bring_expedition_chief_82b6d9: "把远征队长带过来。"
  npc_override_1@tnm1_DevilTower_bring_manager_a5ec18: "把负责人带过来。"
  npc_override_1@tnm1_DevilTower_calamity_happened_hundre_995e7a: "数百年前发生的那场灾难不会再发生了吧？"
  npc_override_1@tnm1_DevilTower_captain_says_we_need_get_ef9870: "队长说我们需要消灭所有的恶魔……"
  npc_override_1@tnm1_DevilTower_careful_fa18ab: "小心。"
  npc_override_1@tnm1_DevilTower_collision_those_two_powe_b5fde7: "那两种力量的碰撞太过强烈，难以承受。"
  npc_override_1@tnm1_DevilTower_commander_please_help_me_3879af: "指挥官，请帮帮我。我一个人做不到~！"
  npc_override_1@tnm1_DevilTower_connect_space_again_i_2ff0e0: "再次连接到那个空间？我做不到。"
  npc_override_1@tnm1_DevilTower_could_influenced_south_r_0c0a9b: "它可能已经影响到了卢恩-米德加尔特的南部。"
  npc_override_1@tnm1_DevilTower_decide_quickly_because_y_ec5a8f: "快点决定，因为你在里面的时间是有限的。"
  npc_override_1@tnm1_DevilTower_demon_destroyed_before_r_8f82b4: "恶魔在复活仪式完成之前就被消灭了。"
  npc_override_1@tnm1_DevilTower_devil_s_tower_place_visi_7cc14d: "恶魔之塔不是一个人能去的地方。"
  npc_override_1@tnm1_DevilTower_did_surprise_you_20d423: "那让你吃惊了吗？"
  npc_override_1@tnm1_DevilTower_did_you_make_resolution_0bc71d: "你下定决心了吗？"
  npc_override_1@tnm1_DevilTower_difficult_enter_again_if_b17e7d: "如果你离开的话，再次进入会很困难。"
  npc_override_1@tnm1_DevilTower_difficult_send_you_throu_bea865: "现在通过装置把你送过去很困难。"
  npc_override_1@tnm1_DevilTower_dimensional_device_activ_9bb47d: "维度装置已激活。"
  npc_override_1@tnm1_DevilTower_dimensional_device_needs_d0ddf9: "维度装置需要先激活才能进入。"
  npc_override_1@tnm1_DevilTower_doesn_t_seem_activated_y_3f0859: "它似乎还没有被激活。"
  npc_override_1@tnm1_DevilTower_don_t_take_any_unncessar_2417a2: "不要冒任何不必要的风险，好吗？"
  npc_override_1@tnm1_DevilTower_don_t_worry_though_i_12fc0b: "不过别担心，我可是天才学者~"
  npc_override_1@tnm1_DevilTower_embarrassing_92e038: "……真尴尬。"
  npc_override_1@tnm1_DevilTower_enter_device_3ddbfc: "进入装置。"
  npc_override_1@tnm1_DevilTower_exploring_devil_s_tower_588016: "只有组队远征才能获准探索恶魔之塔。"
  npc_override_1@tnm1_DevilTower_exploring_time_limit_you_7a3016: "^4d4dff探索时间限制是为了你的安全^000000！"
  npc_override_1@tnm1_DevilTower_fama_give_you_first_aid_7dddc8: "法玛会给你急救包，用它来帮助受伤的人。"
  npc_override_1@tnm1_DevilTower_finally_someone_share_my_10250b: "终于有人能和我一起分享这座塔的奥秘了。"
  npc_override_1@tnm1_DevilTower_first_all_we_get_rid_9327d4: "首先，我们得消灭这些恶魔！"
  npc_override_1@tnm1_DevilTower_first_all_you_need_reser_f5e3a8: "首先，你需要在门口排队预约。"
  npc_override_1@tnm1_DevilTower_follow_ef5fd3: "跟上。"
  npc_override_1@tnm1_DevilTower_forget_get_rid_any_demon_b47696: "别忘了消灭路上遇到的任何恶魔。"
  npc_override_1@tnm1_DevilTower_get_out_here_c88f2c: "离开这里。"
  npc_override_1@tnm1_DevilTower_glad_you_all_here_help_bd6faf: "很高兴你们都来帮忙。"
  npc_override_1@tnm1_DevilTower_gone_too_far_somewhere_s_7f6e01: "它在南方的某个地方走得太远了"
  npc_override_1@tnm1_DevilTower_good_luck_703764: "祝你好运。"
  npc_override_1@tnm1_DevilTower_good_luck_8e30d6: "祝你好运！"
  npc_override_1@tnm1_DevilTower_good_things_getting_wors_c2f593: "很好。这里的情况越来越糟了。"
  npc_override_1@tnm1_DevilTower_groaning_just_let_me_die_35c793: "呻吟……让我死吧。"
  npc_override_1@tnm1_DevilTower_ha_ha_ha_ha_let_eacdd2: "哈哈哈哈……来战斗吧……！！！"
  npc_override_1@tnm1_DevilTower_happens_whenever_she_s_w_6e644d: "每次她受伤时都会发生这种情况。"
  npc_override_1@tnm1_DevilTower_help_fama_take_care_inju_04cab3: "帮助法玛照顾受伤的士兵。"
  npc_override_1@tnm1_DevilTower_help_me_ea30ec: "帮帮我！"
  npc_override_1@tnm1_DevilTower_here_i_know_well_287bbc: "从这里……我不太清楚……"
  npc_override_1@tnm1_DevilTower_hey_hey_d63bbd: "嘿，嘿"
  npc_override_1@tnm1_DevilTower_his_conscious_seems_blur_e31324: "他的意识似乎仍然模糊。"
  npc_override_1@tnm1_DevilTower_hrm_difficult_connect_un_f471a5: "嗯……除非是指定的探索时间，否则很难连接。"
  npc_override_1@tnm1_DevilTower_huh_okay_we_take_break_3d974a: "嗯……好吧，我们现在可以休息一下。"
  npc_override_1@tnm1_DevilTower_hurry_up_world_danger_f04b16: "快点，否则这个世界将陷入危险。"
  npc_override_1@tnm1_DevilTower_i_always_been_waiting_me_3e725c: "我一直在等待远征队的成员！"
  npc_override_1@tnm1_DevilTower_i_am_concerned_about_her_9f00ab: "我很担心她。"
  npc_override_1@tnm1_DevilTower_i_am_scheduled_explore_t_576e5b: "我今天被安排去探索！"
  npc_override_1@tnm1_DevilTower_i_am_sorry_i_been_a89184: "很抱歉，但我经历了一段艰难的时期……"
  npc_override_1@tnm1_DevilTower_i_am_sorry_if_i_d33dac: "如果我态度不好我道歉，但我动不了。"
  npc_override_1@tnm1_DevilTower_i_am_sure_what_my_5e33bd: "我不确定我的下一步该怎么做……"
  npc_override_1@tnm1_DevilTower_i_am_talking_your_boss_4d323c: "我在和你的老板说话。"
  npc_override_1@tnm1_DevilTower_i_am_talking_your_party_62e9e3: "我现在在和你的队长说话，所以请退后一会儿。"
  npc_override_1@tnm1_DevilTower_i_been_exploring_passage_2778bb: "我已经探索这座塔的通道有一段时间了。"
  npc_override_1@tnm1_DevilTower_i_believe_you_23a867: "我相信你！"
  npc_override_1@tnm1_DevilTower_i_believe_you_manage_und_57d1ec: "我相信你在这些限制下也能应付。"
  npc_override_1@tnm1_DevilTower_i_feel_much_better_i_b4c8cc: "我感觉好多了，但我仍然动不了。"
  npc_override_1@tnm1_DevilTower_i_fixed_occasionally_bec_e6190a: "我偶尔需要修理，因为我没有正常的身体"
  npc_override_1@tnm1_DevilTower_i_gained_unexpected_info_64af1a: "我在探索塔的过程中获得了意想不到的信息。"
  npc_override_1@tnm1_DevilTower_i_guess_power_demon_moro_aa45de: "我猜是恶魔摩洛克的破坏封印之盾的力量与达纳托斯发生了碰撞。"
  npc_override_1@tnm1_DevilTower_i_guess_what_you_able_4b28c8: "……我猜这就是你能做到的？"
  npc_override_1@tnm1_DevilTower_i_guide_way_you_40db5f: "我会为你带路。"
  npc_override_1@tnm1_DevilTower_i_guide_you_c793cc: "我会引导你。"
  npc_override_1@tnm1_DevilTower_i_guide_you_upper_floor_047b1f: "我会引导你去上层。"
  npc_override_1@tnm1_DevilTower_i_hear_mechanical_sounds_038c4b: "我突然听到了机械的声音。"
  npc_override_1@tnm1_DevilTower_i_help_9d30c9: "我能帮忙吗？"
  npc_override_1@tnm1_DevilTower_i_know_path_upstairs_71f06c: "我知道上楼的路……"
  npc_override_1@tnm1_DevilTower_i_ll_just_find_someone_0a8f30: "我会找别人……"
  npc_override_1@tnm1_DevilTower_i_look_forward_hearing_g_f41a22: "我期待听到好消息。"
  npc_override_1@tnm1_DevilTower_i_look_forward_more_disc_bf3dc9: "我期待更多的发现！"
  npc_override_1@tnm1_DevilTower_i_m_alive_7da4c2: "但我还活着！"
  npc_override_1@tnm1_DevilTower_i_m_amazed_time_travel_9f0f7b: "我很惊讶时间旅行是可能的。"
  npc_override_1@tnm1_DevilTower_i_making_sure_no_one_e65771: "我确保没有人上楼，我害怕再次发生什么。"
  npc_override_1@tnm1_DevilTower_i_may_need_help_here_ad168d: "我这里可能需要帮助。"
  npc_override_1@tnm1_DevilTower_i_need_first_aid_kit_63478d: "我需要1个急救包来治疗受伤的士兵。"
  npc_override_1@tnm1_DevilTower_i_need_your_help_activat_0ce66f: "我需要你的帮助来激活我的修复系统。"
  npc_override_1@tnm1_DevilTower_i_remain_apart_my_consci_dcf0c2: "我会暂时保持与我的意识分离"
  npc_override_1@tnm1_DevilTower_i_saw_some_guys_black_7b5fea: "我看到一些穿黑衣服的人进去了。城堡里发生了什么事？"
  npc_override_1@tnm1_DevilTower_i_see_da0f97: "……我明白了。"
  npc_override_1@tnm1_DevilTower_i_see_so_many_stairs_9d365d: "我看到这么多楼梯……"
  npc_override_1@tnm1_DevilTower_i_send_you_back_where_9d87d0: "我可以把你送回你属于的地方和时间。"
  npc_override_1@tnm1_DevilTower_i_t_die_here_i_448183: "我不能死在这里。我回家后要向我心爱的人求婚。"
  npc_override_1@tnm1_DevilTower_i_t_use_any_your_97e6bc: "你的信息我一条都用不上。"
  npc_override_1@tnm1_DevilTower_i_talk_representative_08f51b: "我会和代表谈谈。"
  npc_override_1@tnm1_DevilTower_i_thought_i_going_die_2839a8: "我以为我要死了。"
  npc_override_1@tnm1_DevilTower_i_use_self_recovery_i_19454e: "我可以自我修复，但我没有时间。"
  npc_override_1@tnm1_DevilTower_i_want_see_my_soldiers_58b7ac: "我不想看到我的士兵死去。"
  npc_override_1@tnm1_DevilTower_i_wish_you_help_me_322023: "我希望你能帮助我。"
  npc_override_1@tnm1_DevilTower_i_wonder_how_others_doin_f8a370: "我想知道其他人怎么样了……"
  npc_override_1@tnm1_DevilTower_if_you_cancel_now_you_b19329: "^4d4dff如果你现在取消。你将能够在一天后再次挑战。^000000"
  npc_override_1@tnm1_DevilTower_if_you_re_lucky_you_608aea: "如果你幸运的话，你可以快速通过。"
  npc_override_1@tnm1_DevilTower_if_you_run_out_time_821369: "但如果你时间耗尽，进入塔的通道就会消失。"
  npc_override_1@tnm1_DevilTower_if_you_unexpectedly_boun_0e6592: "如果你意外地被弹回这里，你应该快速返回。"
  npc_override_1@tnm1_DevilTower_if_you_want_assist_them_4ba0fc: "如果你想帮助他们，你必须快点。"
  npc_override_1@tnm1_DevilTower_if_you_you_may_may_0e9a77: "如果你这样做，你可能可以或不可以重新进入，取决于你有多快。"
  npc_override_1@tnm1_DevilTower_interesting_there_daught_660029: "有趣……有个女儿……"
  npc_override_1@tnm1_DevilTower_laphine_scholar_artie_re_29f955: "拉菲尼学者阿尔蒂会为你排队预约。"
  npc_override_1@tnm1_DevilTower_laphine_scholar_over_the_8a6a77: "那边的拉菲尼学者会用这个时间装置打开维度裂缝。"
  npc_override_1@tnm1_DevilTower_leave_him_get_some_rest_218954: "让他休息一下吧。"
  npc_override_1@tnm1_DevilTower_let_me_see_you_mean_1f2feb: "让我看看……你的意思是这座塔有一条通往恶魔世界的通道。"
  npc_override_1@tnm1_DevilTower_let_s_fun_since_we_a2527d: "既然我们刚离开彩虹桥，让我们找点乐子吧。"
  npc_override_1@tnm1_DevilTower_loki_guillotine_cross_as_33ce04: "^4d4dff刺客公会的十字斩首者洛基加入了你的队伍。"
  npc_override_1@tnm1_DevilTower_look_i_am_sorry_allowed_c7a0f0: "听着，很抱歉，但除了允许的时间外不允许进入，恶魔之塔很危险。"
  npc_override_1@tnm1_DevilTower_lord_knight_no_longer_hu_cc3158: "骑士领主已经不再是人类了。我必须因为他的恶魔追随者而送他安息。"
  npc_override_1@tnm1_DevilTower_lot_soldiers_still_survi_192204: "很多士兵在袭击中幸存了下来。"
  npc_override_1@tnm1_DevilTower_lots_guards_hurt_7d6483: "很多守卫都受伤了。"
  npc_override_1@tnm1_DevilTower_lucile_seems_machine_e2474f: "露西尔似乎是一台机器。"
  npc_override_1@tnm1_DevilTower_luckily_no_one_dead_yet_aa8f94: "幸运的是，目前还没有人死亡。"
  npc_override_1@tnm1_DevilTower_magic_seal_just_appeared_3868af: "一个魔法封印刚刚出现在塔的东南方向。"
  npc_override_1@tnm1_DevilTower_make_sure_you_ready_4bfd11: "确保你准备好了。"
  npc_override_1@tnm1_DevilTower_make_your_exploration_sh_c4ffae: "让你的探索简短而高效。"
  npc_override_1@tnm1_DevilTower_mention_dangerous_as_wel_96940f: "更不用说也很危险。"
  npc_override_1@tnm1_DevilTower_menu_a_18f22c: "一名散兵：楼上似乎发生了什么事……"
  npc_override_1@tnm1_DevilTower_menu_a_934bbc: "一名散兵：以我们的人数不可能突破。"
  npc_override_1@tnm1_DevilTower_menu_a_b343e2: "一名散兵：下一层是最高层……但那里有很多恶魔……"
  npc_override_1@tnm1_DevilTower_menu_an_9f5001: "一名助手：好消息是恶魔已经停止攻击了。"
  npc_override_1@tnm1_DevilTower_menu_an_f75efc: "一名助手：人数不够召集……"
  npc_override_1@tnm1_DevilTower_menu_artie_18773f: "阿尔蒂：你确定那是该说的话吗？也许你的招募策略需要改进……"
  npc_override_1@tnm1_DevilTower_menu_artie_487768: "阿尔蒂：你什么都不懂，人类。再提醒我一次是谁发现了这座塔的入口？"
  npc_override_1@tnm1_DevilTower_menu_artie_8756ed: "阿尔蒂：所以我想你已经不再质疑我有多聪明了吧？"
  npc_override_1@tnm1_DevilTower_menu_artie_d048ef: "阿尔蒂：没有志愿者？来吧。发挥你的激励技巧，找个人来。"
  npc_override_1@tnm1_DevilTower_menu_artie_d6c6a2: "阿尔蒂：一个 dusty little 什么？我要你知道，我的基因比你们这些猿猴优越！"
  npc_override_1@tnm1_DevilTower_menu_artie_e52c3d: "阿尔蒂：你……你？我口吃了吗？那又是谁解开了连接到塔的维度裂缝的计算公式？"
  npc_override_1@tnm1_DevilTower_menu_artie_fb5973: "阿尔蒂：嘿，你！你的研究进展如何？"
  npc_override_1@tnm1_DevilTower_menu_demon_1707ab: "恶魔摩洛：好吧，让我们看看谁会赢！！！出来吧！"
  npc_override_1@tnm1_DevilTower_menu_demon_438ec2: "恶魔摩洛：不……这不可能……你到底是谁……"
  npc_override_1@tnm1_DevilTower_menu_demon_80cdc8: "恶魔崇拜者的声音：你们都将被献祭来唤醒恶魔！！！"
  npc_override_1@tnm1_DevilTower_menu_demon_99acbb: "恶魔摩洛：不可能！！麻烦制造者！"
  npc_override_1@tnm1_DevilTower_menu_demon_a00ab0: "恶魔摩洛：你愚蠢的人类。你以为你能困住我多久！"
  npc_override_1@tnm1_DevilTower_menu_demon_a69001: "恶魔摩洛：害怕我被释放时将带来的毁灭吧！"
  npc_override_1@tnm1_DevilTower_menu_demon_a6a770: "恶魔摩洛：库哈哈哈哈！我力量的碎片！再次聚集到这里！！！"
  npc_override_1@tnm1_DevilTower_menu_demon_cd8ced: "恶魔摩洛：你还要继续打扰我吗！！！"
  npc_override_1@tnm1_DevilTower_menu_demon_debb4f: "恶魔摩洛：暗影！出来，杀死所有黑暗的敌人！"
  npc_override_1@tnm1_DevilTower_menu_demon_e6adbd: "恶魔崇拜者的声音：不，这不可能。不可能……这股力量……你……也许你是……"
  npc_override_1@tnm1_DevilTower_menu_demon_ee12d4: "恶魔崇拜者的声音：胡说！你把自己藏到哪里去了？"
  npc_override_1@tnm1_DevilTower_menu_demonic_49ced8: "恶魔暗影：啧，你连保护都做不到……？算了……你们都会死在这里。"
  npc_override_1@tnm1_DevilTower_menu_demonic_6eb17c: "恶魔暗影：永恒的真理是我将用你们的心血把你们的死亡转化为恶魔的生命！！！"
  npc_override_1@tnm1_DevilTower_menu_demonic_f2b5a9: "恶魔暗影：原来你们就是麻烦制造者！"
  npc_override_1@tnm1_DevilTower_menu_dewey_02c4fa: "杜威：好的，我会的。"
  npc_override_1@tnm1_DevilTower_menu_evil_11d454: "邪恶暗影：我闻到老鼠偷偷溜进来的味道了。我说得没错！！"
  npc_override_1@tnm1_DevilTower_menu_evil_1c0083: "邪恶暗影：我召唤黑暗！！"
  npc_override_1@tnm1_DevilTower_menu_evil_6c42dd: "邪恶暗影：你会为你的好奇和干涉而后悔。该喂食了！"
  npc_override_1@tnm1_DevilTower_menu_healer_8e6322: "治疗师法玛：好的~你要帮我吗？过来拿急救包~！"
  npc_override_1@tnm1_DevilTower_menu_healer_b94898: "治疗师法玛：指挥官请帮帮我。我一个人做不到~！"
  npc_override_1@tnm1_DevilTower_menu_healer_e91dfd: "治疗师法玛：刺客？！"
  npc_override_1@tnm1_DevilTower_menu_huey_01b634: "休伊：姐姐……"
  npc_override_1@tnm1_DevilTower_menu_huey_184ba9: "休伊：他们从哪里来？又是恶魔……"
  npc_override_1@tnm1_DevilTower_menu_huey_983d81: "休伊：哦，不……"
  npc_override_1@tnm1_DevilTower_menu_huey_c9ca6f: "休伊：这边。这边……我们可以利用恶魔来的缝隙上楼！"
  npc_override_1@tnm1_DevilTower_menu_huey_d0483e: "休伊：哦不，姐姐小心！恶魔突然出现了！"
  npc_override_1@tnm1_DevilTower_menu_injured_102291: "受伤士兵：……啊……啊……"
  npc_override_1@tnm1_DevilTower_menu_injured_251e28: "受伤士兵：呻吟……"
  npc_override_1@tnm1_DevilTower_menu_injured_51fa51: "受伤士兵：呻吟……"
  npc_override_1@tnm1_DevilTower_menu_injured_e09eff: "受伤士兵：哎哟……"
  npc_override_1@tnm1_DevilTower_menu_injured_e7d90b: "受伤士兵：哎哟~"
  npc_override_1@tnm1_DevilTower_menu_injured_ec644b: "受伤士兵：我不想死……"
  npc_override_1@tnm1_DevilTower_menu_loki_59d473: "洛基：闭嘴！"
  npc_override_1@tnm1_DevilTower_menu_loki_69ae94: "洛基：唤醒墙壁中的恶魔，你能得到什么？"
  npc_override_1@tnm1_DevilTower_menu_loki_749cd9: "洛基：我的使命是来这里再次埋葬它。"
  npc_override_1@tnm1_DevilTower_menu_loki_74ad87: "洛基：*咧嘴笑*当然！！"
  npc_override_1@tnm1_DevilTower_menu_loki_a51d19: "洛基：那些被恶魔地狱祝福的人是无敌的。我们可以用心灵爆破切断祝福。"
  npc_override_1@tnm1_DevilTower_menu_loki_c17a5f: "洛基：这就是我的使命！"
  npc_override_1@tnm1_DevilTower_menu_loki_d0cc2d: "洛基：你从哪里来？我这里可能需要帮助。"
  npc_override_1@tnm1_DevilTower_menu_loki_d2d09d: "洛基：心灵爆破-！！！"
  npc_override_1@tnm1_DevilTower_menu_loki_dfc9a5: "洛基：……啧！没用……！"
  npc_override_1@tnm1_DevilTower_menu_loki_eb53f2: "洛基：我不在乎神或恶魔或他们的计划。唯一重要的是杀死你。"
  npc_override_1@tnm1_DevilTower_menu_loki_f1108d: "洛基：骑士领主已经不再是人类了。我必须送他安息。"
  npc_override_1@tnm1_DevilTower_menu_loki_fcf052: "洛基：你将负责激活心灵爆破。"
  npc_override_1@tnm1_DevilTower_menu_lucile_06acc1: "露西尔：我们应该在魔法封印刚开始再次移动之前阻止它。"
  npc_override_1@tnm1_DevilTower_menu_lucile_1627a1: "露西尔：好了各位，现在我们知道该怎么做了。我们必须阻止魔法封印到达这里！"
  npc_override_1@tnm1_DevilTower_menu_lucile_1c9a44: "露西尔：情况似乎不太好。"
  npc_override_1@tnm1_DevilTower_menu_lucile_21bb81: "露西尔：我们需要阻止恶魔……你能做到吗？"
  npc_override_1@tnm1_DevilTower_menu_lucile_29c431: "露西尔：我需要你的帮助来激活我的修复系统。"
  npc_override_1@tnm1_DevilTower_menu_lucile_312dcc: "露西尔：我们应该在魔法封印到达中心之前阻止它。"
  npc_override_1@tnm1_DevilTower_menu_lucile_5009f1: "露西尔：我可以自我修复，但我没有时间。你愿意与我分享你的力量吗？"
  npc_override_1@tnm1_DevilTower_menu_lucile_5f06fb: "露西尔：如果我态度不好我道歉，但我动不了。"
  npc_override_1@tnm1_DevilTower_menu_lucile_65fa3d: "露西尔：魔法封印几乎要接近中心了！！"
  npc_override_1@tnm1_DevilTower_menu_lucile_75d92e: "露西尔：现在放松还为时过早！还有未被摧毁的魔法封印。"
  npc_override_1@tnm1_DevilTower_menu_lucile_7ecb59: "露西尔：一点也不。我真的很想知道。楼上发生了什么？"
  npc_override_1@tnm1_DevilTower_menu_lucile_85977a: "露西尔：你觉得情况怎么样，魔剑士？"
  npc_override_1@tnm1_DevilTower_menu_lucile_9415b2: "露西尔：你怎么这么快？"
  npc_override_1@tnm1_DevilTower_menu_lucile_96efc6: "露西尔：请抓紧。"
  npc_override_1@tnm1_DevilTower_menu_lucile_9f062f: "露西尔：好的，我请你做我的后援。哈哈对吧，杜威？"
  npc_override_1@tnm1_DevilTower_menu_lucile_a045ce: "露西尔：我们现在应该阻止它！"
  npc_override_1@tnm1_DevilTower_menu_lucile_a327e2: "露西尔：我不会孤单。还有一些未受伤的士兵！"
  npc_override_1@tnm1_DevilTower_menu_lucile_b3ae28: "露西尔：它越来越近了……不……太危险了。"
  npc_override_1@tnm1_DevilTower_menu_lucile_b46bbe: "露西尔：我是刺客公会的露西尔。"
  npc_override_1@tnm1_DevilTower_menu_lucile_c615cd: "露西尔：普隆德拉的勇敢骑士们怎么了？"
  npc_override_1@tnm1_DevilTower_menu_lucile_d23f74: "露西尔：达纳托斯。先生，你应该那样虚张声势吗？"
  npc_override_1@tnm1_DevilTower_menu_lucile_f68530: "露西尔：魔法封印刚开始再次移动。"
  npc_override_1@tnm1_DevilTower_menu_lucile_f997cd: "露西尔：是的，先生。"
  npc_override_1@tnm1_DevilTower_menu_lucile_fae1aa: "露西尔：请容我告退，如果你想拯救世界，就跟我来。"
  npc_override_1@tnm1_DevilTower_menu_magic_810e3f: "魔剑士：嗯，我去调查一下。"
  npc_override_1@tnm1_DevilTower_menu_morocc_227482: "摩洛骑士领主：真的……刺客公会，我以为你们的使命是平衡世界的力量。"
  npc_override_1@tnm1_DevilTower_menu_morocc_2c7d88: "摩洛骑士领主：所以你想要的只是完成你那该死的使命？……"
  npc_override_1@tnm1_DevilTower_menu_morocc_3c235c: "摩洛骑士领主：咕哇哈哈哈哈。你们这些愚蠢的人类，我要把你们全部杀死作为恶魔的祭品！！"
  npc_override_1@tnm1_DevilTower_menu_morocc_7d5510: "摩洛骑士领主：复活恶魔将带来平衡！即使是最强大的也会成为神的奴隶……"
  npc_override_1@tnm1_DevilTower_menu_morocc_8506f5: "摩洛骑士领主：你知道，真相是，这没用。"
  npc_override_1@tnm1_DevilTower_menu_morocc_a76251: "摩洛骑士领主：人类……做这种蠢事……一个祭品。"
  npc_override_1@tnm1_DevilTower_menu_morocc_afbe1f: "摩洛骑士领主：他们希望这个世界只按照他们的形象存在。我们在哪里适合？！"
  npc_override_1@tnm1_DevilTower_menu_morocc_eb6518: "摩洛骑士领主：哦不……他们应该派比你更好的人来的，刺客先生，为了这个使命。"
  npc_override_1@tnm1_DevilTower_menu_morocc_eec7ee: "摩洛骑士领主：神有自己的计划。你知道神为你或我计划了什么吗？"
  npc_override_1@tnm1_DevilTower_menu_morocc_f704ef: "摩洛骑士领主：所以……那只老鼠是刺客？你来这里送死？"
  npc_override_1@tnm1_DevilTower_menu_officer_09d9f0: "海姆军官：你是谁？"
  npc_override_1@tnm1_DevilTower_menu_officer_40f8b2: "海姆军官：现在有多少士兵幸存？支援队什么时候到？"
  npc_override_1@tnm1_DevilTower_menu_officer_46e024: "海姆军官：援军？那你为什么只是站在这里？"
  npc_override_1@tnm1_DevilTower_menu_officer_47e324: "海姆军官：你在做什么？如果你一个人去你会被杀的！"
  npc_override_1@tnm1_DevilTower_menu_officer_56628d: "海姆军官：你听到了吗？"
  npc_override_1@tnm1_DevilTower_menu_officer_5b8ff1: "海姆军官：他们太不可预测了。你知道发生了什么对吧？支援他们……"
  npc_override_1@tnm1_DevilTower_menu_officer_60b745: "海姆军官：这是紧急情况……情况怎么样了？"
  npc_override_1@tnm1_DevilTower_menu_officer_8aa9bc: "海姆军官：帮助我们处理从楼上下来的恶魔。"
  npc_override_1@tnm1_DevilTower_menu_officer_a4c873: "海姆军官：你怎么知道的？是的，恶魔已经停止了从楼上的攻击。"
  npc_override_1@tnm1_DevilTower_menu_officer_b6e801: "海姆军官：你在嘲笑我吗？"
  npc_override_1@tnm1_DevilTower_menu_officer_bc97ff: "海姆军官：我们不能被困在这里，必须继续前进。恶魔为什么停止攻击？"
  npc_override_1@tnm1_DevilTower_menu_officer_d6b773: "海姆军官：我们的后援来自刺客公会？感谢及时赶到。"
  npc_override_1@tnm1_DevilTower_menu_officer_d8635a: "海姆军官：帮助法玛照顾受伤的士兵。"
  npc_override_1@tnm1_DevilTower_menu_options_eae457: "{0}：他们在哪里？"
  npc_override_1@tnm1_DevilTower_menu_shep_18bb87: "谢普：*叹气*……你……你做到了。"
  npc_override_1@tnm1_DevilTower_menu_shep_1a1910: "谢普：你在叫谁嘿你？你只是一只 dusty little 妖精！"
  npc_override_1@tnm1_DevilTower_menu_shep_34968b: "谢普：请来吧！现在是你可能面对撒旦摩洛克的 infamous 手下本人的机会！"
  npc_override_1@tnm1_DevilTower_menu_shep_3cc765: "谢普：我管你说什么？连我们的孩子都比你们这些小妖精大！"
  npc_override_1@tnm1_DevilTower_menu_shep_6d811f: "谢普：是的，是的，就是你！"
  npc_override_1@tnm1_DevilTower_menu_shep_6f4b6a: "谢普：就因为你是个魔法学者就觉得自己很了不起？"
  npc_override_1@tnm1_DevilTower_menu_shep_96160c: "谢普：没有人自愿，因为大家都说太危险了！"
  npc_override_1@tnm1_DevilTower_menu_shep_ac7d85: "谢普：你好！！！现在招募新成员来探索恶魔之塔！"
  npc_override_1@tnm1_DevilTower_menu_shep_ccb2fe: "谢普：好吧，好吧。我需要一个冒险者来为我们探索这座塔。"
  npc_override_1@tnm1_DevilTower_menu_thanatos_5281a4: "达纳托斯：露西尔！在我召唤护盾挡住他的时候，看好我的背后！"
  npc_override_1@tnm1_DevilTower_menu_thanatos_65282e: "达纳托斯：你如此绝望以至于求我救你。"
  npc_override_1@tnm1_DevilTower_menu_thanatos_8ef2ed: "达纳托斯：无论你尝试多少次都一样！放弃吧，回到恶魔世界！！"
  npc_override_1@tnm1_DevilTower_menu_thanatos_91d1c5: "达纳托斯：阻止他！不要让他靠近！！！"
  npc_override_1@tnm1_DevilTower_menu_thanatos_925443: "达纳托斯：这将是最后一次炫耀！！再见！！！"
  npc_override_1@tnm1_DevilTower_menu_thanatos_b186a5: "达纳托斯：你在做什么！！！你在玩游戏吗？！"
  npc_override_1@tnm1_DevilTower_menu_thanatos_b6c3b7: "达纳托斯：闭嘴！除非我杀了你，否则你永远不会离开这里！"
  npc_override_1@tnm1_DevilTower_menu_young_12a9e4: "年轻女孩：我爸爸绝不会这样……呃……"
  npc_override_1@tnm1_DevilTower_menu_young_216e32: "年轻女孩：看！更多恶魔，它们很快就要淹没城堡了！"
  npc_override_1@tnm1_DevilTower_menu_young_333b79: "年轻女孩：奥丁保佑我！恶魔！！帮帮我！"
  npc_override_1@tnm1_DevilTower_menu_young_5e473f: "年轻女孩：不……！！不要伤害我爸爸！！！"
  npc_override_1@tnm1_DevilTower_menu_young_73ad6b: "年轻女孩：我看到一些穿黑衣服的人进去了。城堡里发生了什么事？"
  npc_override_1@tnm1_DevilTower_menu_young_7c7d89: "年轻女孩：谢谢你救了我……但为什么有恶魔？"
  npc_override_1@tnm1_DevilTower_menu_young_80e26e: "年轻女孩：请跟我一起穿过那个架子后面的通道！"
  npc_override_1@tnm1_DevilTower_menu_young_8bf6a6: "年轻女孩：似乎发生了什么事，我听到楼下有奇怪的声音。"
  npc_override_1@tnm1_DevilTower_menu_young_8cbf8e: "年轻女孩：有些不对劲……"
  npc_override_1@tnm1_DevilTower_menu_young_988625: "年轻女孩：为什么恶魔突然来了，很多守卫都受伤了。"
  npc_override_1@tnm1_DevilTower_menu_young_cc0437: "年轻女孩：通往地下的路沿着这条过道！"
  npc_override_1@tnm1_DevilTower_move_immediately_c179f0: "立即移动。"
  npc_override_1@tnm1_DevilTower_move_now_7a437a: "现在移动"
  npc_override_1@tnm1_DevilTower_msg_9a7b00: "！！！"
  npc_override_1@tnm1_DevilTower_msg_e95f89: "……"
  npc_override_1@tnm1_DevilTower_no_9f92cd: "不是吗？"
  npc_override_1@tnm1_DevilTower_no_hurts_too_much_651e98: "不，太痛了。"
  npc_override_1@tnm1_DevilTower_no_matter_you_obviously_546f5b: "但不管怎样，你显然不应该在这里，现在。"
  npc_override_1@tnm1_DevilTower_no_one_been_volunteering_65de3b: "到目前为止还没有人自愿，所以我开始担心了。"
  npc_override_1@tnm1_DevilTower_notice_b6a240: "！- 注意 -！"
  npc_override_1@tnm1_DevilTower_oh_s_too_bad_80b7a8: "哦，那太糟糕了"
  npc_override_1@tnm1_DevilTower_oh_you_back_29eb24: "哦，你回来了。"
  npc_override_1@tnm1_DevilTower_oh_you_back_so_soon_0fc691: "哦，你这么快就回来了……"
  npc_override_1@tnm1_DevilTower_oh_you_just_arrived_time_6bff9e: "哦。你来得正是时候。"
  npc_override_1@tnm1_DevilTower_ok_i_see_what_happened_a7f194: "好的，我明白发生了什么。"
  npc_override_1@tnm1_DevilTower_ok_i_won_t_cancel_cea639: "好的，我不会取消。"
  npc_override_1@tnm1_DevilTower_okay_a94f23: "这样可以吗？"
  npc_override_1@tnm1_DevilTower_okay_gather_your_party_r_95bc19: "好的，召集你的队伍，记得向我报告你的发现。"
  npc_override_1@tnm1_DevilTower_ones_who_infernally_bles_b3a005: "^4d4dff那些被恶魔地狱祝福的人是无敌的。我们可以用心灵爆破切断祝福。^000000"
  npc_override_1@tnm1_DevilTower_only_thanatos_lucile_eve_e4aa9e: "只有达纳托斯和露西尔曾经进入过上层……"
  npc_override_1@tnm1_DevilTower_papa_papa_please_safe_so_8c9a15: "爸爸……爸爸请平安。*抽泣*"
  npc_override_1@tnm1_DevilTower_party_member_party_s_ent_d985dc: "队伍{1}的成员{0}进入房间{2}"
  npc_override_1@tnm1_DevilTower_perhaps_our_missions_all_57ce94: "也许，我们的使命会在未来再次让我们结盟……"
  npc_override_1@tnm1_DevilTower_please_come_back_tomorro_f0174b: "请明天再来！"
  npc_override_1@tnm1_DevilTower_please_come_me_make_sure_e3c710: "请跟我来确保我爸爸的安全。"
  npc_override_1@tnm1_DevilTower_please_come_me_through_p_7b67b7: "请跟我一起穿过那个架子后面的通道！"
  npc_override_1@tnm1_DevilTower_please_cure_injured_firs_0d6012: "请用这个急救包治疗伤者。"
  npc_override_1@tnm1_DevilTower_please_get_permission_ac_c9e927: "请通过与魔法学者阿尔蒂交谈来获得激活它的许可。"
  npc_override_1@tnm1_DevilTower_please_hold_tight_4546fe: "请抓紧。"
  npc_override_1@tnm1_DevilTower_please_report_anything_y_09c0b8: "请向我报告你在塔里发现的任何事情。"
  npc_override_1@tnm1_DevilTower_please_request_again_if_60006a: "如果用完了请再次请求。"
  npc_override_1@tnm1_DevilTower_please_save_him_d163a1: "请救救他。"
