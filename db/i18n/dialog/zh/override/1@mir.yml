  npc_override_1@mir_RoomOfConsciousness_ymir_s_heart_huge_energy_801b11: "伊米尔之心是一个巨大的能量源。你想用它来做什么？"
  npc_override_1@mir_RoomOfConsciousness_you_d_better_keep_your_d2dd19: "你最好闭上你的嘴！"
