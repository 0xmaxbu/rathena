Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@mir_RoomOfConsciousness_aaarrgghhh_1e3aba: "啊啊啊——！！"
  npc_override_1@mir_RoomOfConsciousness_aaarrghhh_0e3ba9: "啊啊啊——！！！"
  npc_override_1@mir_RoomOfConsciousness_ah_971301: "啊……"
  npc_override_1@mir_RoomOfConsciousness_all_you_want_say_41b79f: "这就是你想说的全部吗？"
  npc_override_1@mir_RoomOfConsciousness_beast_s_blood_flowing_th_eb199c: "流淌在你体内的野兽之血……这就是答案！"
  npc_override_1@mir_RoomOfConsciousness_because_b942f7: "因为……"
  npc_override_1@mir_RoomOfConsciousness_careful_she_s_about_atta_2c9319: "……小心。她要攻击了！"
  npc_override_1@mir_RoomOfConsciousness_chuckles_5ff77d: "~轻笑~"
  npc_override_1@mir_RoomOfConsciousness_chuckles_i_think_you_re_49fa38: "~轻笑~ 我觉得你作为人类还不算太坏。"
  npc_override_1@mir_RoomOfConsciousness_clerics_deserve_die_c27096: "祭司该死！"
  npc_override_1@mir_RoomOfConsciousness_coughs_b94802: "~咳嗽~"
  npc_override_1@mir_RoomOfConsciousness_did_she_save_me_cee65c: "（她救了我吗……？）"
  npc_override_1@mir_RoomOfConsciousness_die_03c27d: "去死！！"
  npc_override_1@mir_RoomOfConsciousness_don_t_drama_queen_as_18935a: "别像个戏剧女王一样，好像你是唯一的受害者。"
  npc_override_1@mir_RoomOfConsciousness_don_t_expect_me_kill_169eb5: "……但别指望我会轻易杀了你……"
  npc_override_1@mir_RoomOfConsciousness_don_t_worry_i_ll_fb1659: "别担心。我会让Himelmez知道你的英勇贡献。别怪我，Bijou。"
  npc_override_1@mir_RoomOfConsciousness_don_t_you_ever_let_cec6c5: "在那之前，别让任何人杀了你，Iris。"
  npc_override_1@mir_RoomOfConsciousness_don_t_you_ever_think_739005: "你永远别想这会改变我的信念！我永远不会，永远不会原谅你！"
  npc_override_1@mir_RoomOfConsciousness_drink_you_ll_come_your_e1b721: "喝了它，你就会清醒过来。"
  npc_override_1@mir_RoomOfConsciousness_evil_laughter_die_871db1: "~邪恶的笑声~ 去死！"
  npc_override_1@mir_RoomOfConsciousness_exhales_i_see_s_right_ca29d9: "~呼气~ 我明白了。没错。"
  npc_override_1@mir_RoomOfConsciousness_fenrir_i_thought_too_muc_a29e7c: "（……Fenrir？我太专注于伊米尔之心，完全忘记了她。如果我的猜测是对的，她一定是……！）"
  npc_override_1@mir_RoomOfConsciousness_final_fatal_blow_you_wah_9dd9df: "这将是给你的最后一击，致命的一击。哇哈哈哈！"
  npc_override_1@mir_RoomOfConsciousness_frost_diver_70ced5: "霜冻之矢！"
  npc_override_1@mir_RoomOfConsciousness_gasps_314034: "……~喘息~"
  npc_override_1@mir_RoomOfConsciousness_gone_now_6b4b71: "就这样吗……？它走了吗？"
  npc_override_1@mir_RoomOfConsciousness_good_idea_i_think_s_5cc687: "好主意，但是……我觉得太晚了。"
  npc_override_1@mir_RoomOfConsciousness_grins_delighted_see_you_98b396: "~咧嘴笑~ 很高兴见到你们所有人。"
  npc_override_1@mir_RoomOfConsciousness_grins_i_look_like_i_5961ff: "~咧嘴笑~ 我看起来有时间对付你这种小角色吗，人类？"
  npc_override_1@mir_RoomOfConsciousness_groans_03afd7: "~呻吟~"
  npc_override_1@mir_RoomOfConsciousness_groans_i_t_believe_nothi_2112a3: "~呻吟~ 我不敢相信似乎什么都没用！"
  npc_override_1@mir_RoomOfConsciousness_grunts_5f5d11: "~咕哝~"
  npc_override_1@mir_RoomOfConsciousness_grunts_they_must_ve_star_c18633: "~咕哝~ 他们一定也开始攻击这个地方了。"
  npc_override_1@mir_RoomOfConsciousness_grunts_valkyrie_destroye_99e17b: "~咕哝~ 那个女武神在拿走伊米尔之心时摧毁了天花板！"
  npc_override_1@mir_RoomOfConsciousness_grunts_when_did_all_legi_26ce46: "~咕哝~ 所有军团成员什么时候到这里的？"
  npc_override_1@mir_RoomOfConsciousness_horribly_painfully_e8b073: "而且极其痛苦地……！！"
  npc_override_1@mir_RoomOfConsciousness_how_could_happen_ef1031: "这怎么可能发生？"
  npc_override_1@mir_RoomOfConsciousness_how_feel_painful_eh_04483e: "感觉如何？痛苦吗，嗯？"
  npc_override_1@mir_RoomOfConsciousness_huh_my_stomach_4e163a: "嗯？……在我的胃里……"
  npc_override_1@mir_RoomOfConsciousness_i_certainly_without_subo_ad8ea5: "我当然不需要一个在这种小事上浪费时间的下属。"
  npc_override_1@mir_RoomOfConsciousness_i_d_better_bid_farewell_fad9d7: "那我最好今天就告辞了。"
  npc_override_1@mir_RoomOfConsciousness_i_didn_t_expect_anyone_702182: "我没料到有人能击败我花了三年时间才完成的Amdarais。"
  npc_override_1@mir_RoomOfConsciousness_i_didn_t_expect_huge_fdbf0d: "我没料到它会这么大……"
  npc_override_1@mir_RoomOfConsciousness_i_didn_t_expect_see_06773b: "我没料到会见到一千年前的英雄！"
  npc_override_1@mir_RoomOfConsciousness_i_didn_t_expect_you_b0c99d: "我没料到你会出现在这里。"
  npc_override_1@mir_RoomOfConsciousness_i_didn_t_let_you_5d9d08: "我没让你活着。"
  npc_override_1@mir_RoomOfConsciousness_i_don_t_know_let_c33601: "我不知道。我们先调查里面吧。"
  npc_override_1@mir_RoomOfConsciousness_i_don_t_think_you_cbd49e: "我不认为你会把它用于任何好的目的。"
  npc_override_1@mir_RoomOfConsciousness_i_iris_dbee11: "我……Iris！！"
  npc_override_1@mir_RoomOfConsciousness_i_let_you_die_soon_c3a57e: "我很快就会让你死。"
  npc_override_1@mir_RoomOfConsciousness_i_ll_let_you_me_e5d400: "在我走之前，让我告诉你我的秘密。"
  npc_override_1@mir_RoomOfConsciousness_i_ll_let_you_taste_86690f: "我会让你尝尝绝望的滋味。"
  npc_override_1@mir_RoomOfConsciousness_i_ll_stop_bijou_taking_e6b8cf: "我会阻止Bijou拿走伊米尔之心。你继续去对付那个巨大的怪物！"
  npc_override_1@mir_RoomOfConsciousness_i_m_adjutant_lord_valkyr_48a7f3: "我是Himelmez女武神大人的副官。"
  npc_override_1@mir_RoomOfConsciousness_i_m_bijou_a87d15: "我是Bijou。"
  npc_override_1@mir_RoomOfConsciousness_i_m_game_bring_3de753: "我奉陪。放马过来！"
  npc_override_1@mir_RoomOfConsciousness_i_m_out_breath_470c8e: "我上气不接下气！"
  npc_override_1@mir_RoomOfConsciousness_i_m_so_relieved_ced50d: "我松了一口气。"
  npc_override_1@mir_RoomOfConsciousness_i_make_sure_you_no_fea808: "下次见面时，我保证让你再也见不到阳光。"
  npc_override_1@mir_RoomOfConsciousness_i_must_say_rather_unexpe_39e258: "我必须说这相当出乎意料。~轻笑~"
  npc_override_1@mir_RoomOfConsciousness_i_should_take_care_downr_c9f608: "我应该先处理这个极其烦人的祭司姑娘。"
  npc_override_1@mir_RoomOfConsciousness_iris_dd2b57: "Iris！！"
  npc_override_1@mir_RoomOfConsciousness_iris_healing_potion_b930d2: "Iris！这是治疗药水。"
  npc_override_1@mir_RoomOfConsciousness_keeps_coughing_9e92a7: "~持续咳嗽~"
  npc_override_1@mir_RoomOfConsciousness_knife_cbdd92: "这把刀……"
  npc_override_1@mir_RoomOfConsciousness_let_me_take_ymir_s_3ce5c2: "让我亲自拿走那颗伊米尔之心……"
  npc_override_1@mir_RoomOfConsciousness_little_chick_because_she_670a70: "……那……那只小鸡……就因为这个吗？因为她是你的妹妹？就因为这个吗？告诉我，Sarah！"
  npc_override_1@mir_RoomOfConsciousness_magic_1b4dae: "这魔法……"
  npc_override_1@mir_RoomOfConsciousness_mark_my_word_835d2c: "记住我的话。"
  npc_override_1@mir_RoomOfConsciousness_me_i_m_only_one_d6910d: "我……我是唯一剩下的……"
  npc_override_1@mir_RoomOfConsciousness_menu_bijou_05e8e2: "Bijou:~轻笑~ Amdarais不会轻易被打倒。"
  npc_override_1@mir_RoomOfConsciousness_menu_bijou_4d035c: "Bijou:嘿……你还活着！"
  npc_override_1@mir_RoomOfConsciousness_menu_bijou_68dbe4: "Bijou:什么……！！"
  npc_override_1@mir_RoomOfConsciousness_menu_bijou_7ae9f9: "Bijou:致Himelmez大人！"
  npc_override_1@mir_RoomOfConsciousness_menu_bijou_a9f358: "Bijou:~呻吟~ 比我想象的更痛……！"
  npc_override_1@mir_RoomOfConsciousness_menu_bijou_be8159: "Bijou:~轻笑~ 你感觉到痛苦了吗？"
  npc_override_1@mir_RoomOfConsciousness_menu_bijou_cc561e: "Bijou:……"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_018703: "Fenrir:我不这么认为。一些残余还在这里。小心！"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_02360e: "Fenrir:呼！我想我们已经完成了。"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_1b4146: "Fenrir:虽然不完美，但我想我们造成了相当严重的伤害！"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_1eed04: "Fenrir:接招！！"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_275c08: "Fenrir:那么轮到我了。~ spirited yell ~"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_43c35f: "Fenrir:我消耗了太多魔法。我要休息一下。接下来就拜托你了！"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_462921: "Fenrir:是的，是核心！攻击它的核心以造成巨大伤害！"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_5a1225: "Fenrir:敌人正在蜂拥而至。我们必须把它们全部消灭！"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_6949f0: "Fenrir:干得好！现在轮到你了，Iris！"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_8829a1: "Fenrir:敌人很快就会出现！做好准备！"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_8b6ad1: "Fenrir:我也这么认为。这次，我还是请你把它引到我这里来。"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_8c25ad: "Fenrir:这个亡灵似乎与其他任何亡灵都不同。"
  npc_override_1@mir_RoomOfConsciousness_menu_fenrir_bb1f8f: "Fenrir:把它引到我这里来！"
  npc_override_1@mir_RoomOfConsciousness_menu_iris_18766c: "Iris:好吧，让我来！我，Iris，想要的是……！"
  npc_override_1@mir_RoomOfConsciousness_menu_iris_3112fa: "Iris:玛比护符！去吧！！"
  npc_override_1@mir_RoomOfConsciousness_menu_iris_602796: "Iris:哦，这个怪物……我觉得不管打多少次它的HP似乎都不会下降。"
  npc_override_1@mir_RoomOfConsciousness_menu_iris_75f732: "Iris:让我们一起战斗，我们会再次获胜！"
  npc_override_1@mir_RoomOfConsciousness_menu_iris_9ac633: "Iris:成功了！"
  npc_override_1@mir_RoomOfConsciousness_menu_iris_c61de5: "Iris:~呼气~ 我们现在把所有敌人都打倒了？"
  npc_override_1@mir_RoomOfConsciousness_menu_my_77ff31: "我的问题是:你还在这里做什么，完全在混日子，还有，为什么你没有解除伊米尔之心的任何封印？"
  npc_override_1@mir_RoomOfConsciousness_mom_dad_every_people_our_974e6b: "妈妈……爸爸……我们镇上的每个人。我要复仇！"
  npc_override_1@mir_RoomOfConsciousness_moment_we_immortal_legio_c83bb7: "从这一刻起，我们Himelmez女武神大人麾下的不朽军团"
  npc_override_1@mir_RoomOfConsciousness_msg_93fcbf: "……"
  npc_override_1@mir_RoomOfConsciousness_msg_b4613f: "！！"
  npc_override_1@mir_RoomOfConsciousness_muffled_sound_259d11: "~闷声~"
  npc_override_1@mir_RoomOfConsciousness_must_19eb2d: "这……这一定是……"
  npc_override_1@mir_RoomOfConsciousness_must_1e9917: "而那一定是……"
  npc_override_1@mir_RoomOfConsciousness_must_high_level_magic_as_866deb: "这一定是我预期的高级魔法。施展它相当困难。"
  npc_override_1@mir_RoomOfConsciousness_no_stop_db173d: "不！住手！！"
  npc_override_1@mir_RoomOfConsciousness_no_valkyrie_s_subordinat_cca4f2: "女武神的下属从未让我失望过，你也不例外。"
  npc_override_1@mir_RoomOfConsciousness_oh_you_woke_up_now_11801f: "哦，你现在醒了？"
  npc_override_1@mir_RoomOfConsciousness_out_pure_mercy_i_ll_45c006: "但是，出于纯粹的仁慈，我会让你稍微尝尝不朽军团的可怕力量。"
  npc_override_1@mir_RoomOfConsciousness_people_say_we_parted_whe_5f9ef5: "人们说我们小时候就分开了……"
  npc_override_1@mir_RoomOfConsciousness_place_cleaned_up_no_time_fe1ff9: "这个地方很快就会被清理干净。你没什么好担心的，Sarah。"
  npc_override_1@mir_RoomOfConsciousness_place_where_first_ymir_s_9693a6: "第一颗伊米尔之心被封印的地方。"
  npc_override_1@mir_RoomOfConsciousness_pow_b65953: "~砰！~"
  npc_override_1@mir_RoomOfConsciousness_prontera_castle_8df8ed: "普隆德拉城堡的……"
  npc_override_1@mir_RoomOfConsciousness_ruining_my_three_year_ef_afbd04: "为了毁了我三年的努力！！"
  npc_override_1@mir_RoomOfConsciousness_rumbling_cf34f2: "~隆隆声~"
  npc_override_1@mir_RoomOfConsciousness_s_sarah_right_1943f4: "是Sarah，对吧？"
  npc_override_1@mir_RoomOfConsciousness_sa_sarah_how_f06b98: "Sa……Sarah……？怎么可能？"
  npc_override_1@mir_RoomOfConsciousness_sarah_21ed06: "Sarah……？"
  npc_override_1@mir_RoomOfConsciousness_sarah_3691c3: "Sarah……"
  npc_override_1@mir_RoomOfConsciousness_sarah_irine_afeb46: "Sarah Irine。"
  npc_override_1@mir_RoomOfConsciousness_scoffs_what_uptight_path_d1f713: "（~嗤笑~ 多么古板、可悲的女武神啊！我不敢相信像你这样的新手竟然和Himelmez受到同等待遇。太不公平了。）"
  npc_override_1@mir_RoomOfConsciousness_screams_1ae095: "~尖叫~"
  npc_override_1@mir_RoomOfConsciousness_sealed_underground_db1b17: "封印在地下"
  npc_override_1@mir_RoomOfConsciousness_she_valkyrie_indeed_oh_w_e5b32f: "（她确实是女武神。哦，你能怎么办呢？）"
  npc_override_1@mir_RoomOfConsciousness_shut_mouth_9d797c: "闭上你的嘴！"
  npc_override_1@mir_RoomOfConsciousness_sighs_74e538: "……~叹息~"
  npc_override_1@mir_RoomOfConsciousness_sighs_way_fenrir_924968: "~叹息~ 顺便说一下，Fenrir！"
  npc_override_1@mir_RoomOfConsciousness_slowly_a14f95: "慢慢地……"
  npc_override_1@mir_RoomOfConsciousness_so_e60826: "就是这样……"
  npc_override_1@mir_RoomOfConsciousness_so_what_s_left_now_90f54b: "那么现在剩下的是……"
  npc_override_1@mir_RoomOfConsciousness_so_what_s_your_plan_bf9174: "……那么你的计划是什么，嗯？为什么……为什么你救了我？！"
  npc_override_1@mir_RoomOfConsciousness_so_you_re_looking_partne_6a0660: "所以你在找搭档，嗯？"
  npc_override_1@mir_RoomOfConsciousness_so_you_woke_up_iris_4de091: "所以你醒了，Iris。"
  npc_override_1@mir_RoomOfConsciousness_stop_9cb289: "住手……"
  npc_override_1@mir_RoomOfConsciousness_take_over_here_9409d6: "将接管这里。"
  npc_override_1@mir_RoomOfConsciousness_then_let_me_serve_you_56a745: "那么，让我以正确的方式侍奉你！~轻笑~"
  npc_override_1@mir_RoomOfConsciousness_they_just_paid_price_wha_f2a269: "他们只是为他们的罪行付出了代价。他们12年前杀死我母亲所犯下的罪。"
  npc_override_1@mir_RoomOfConsciousness_this_7b6848: "这……"
  npc_override_1@mir_RoomOfConsciousness_time_right_d1c17a: "时机正好！"
  npc_override_1@mir_RoomOfConsciousness_trust_me_consider_done_p_02c0b2: "相信我，就当它已经完成。请保持你作为骄傲女武神的自我。"
  npc_override_1@mir_RoomOfConsciousness_umm_08b31a: "嗯……"
  npc_override_1@mir_RoomOfConsciousness_underground_prontera_cas_7383f9: "这是普隆德拉城堡的地下。"
  npc_override_1@mir_RoomOfConsciousness_vomiting_sound_33b4e8: "~呕吐声~"
  npc_override_1@mir_RoomOfConsciousness_we_d_better_get_out_6c2f83: "我们最好也离开这里！这个地方太危险了！"
  npc_override_1@mir_RoomOfConsciousness_well_s_uh_i_did_0fc25a: "嗯，那个……我确实打破了第1个封印，不过。"
  npc_override_1@mir_RoomOfConsciousness_what_96ba6e: "什么？！"
  npc_override_1@mir_RoomOfConsciousness_what_about_ymir_s_heart_068206: "伊米尔之心呢？"
  npc_override_1@mir_RoomOfConsciousness_what_brought_you_all_way_afb6ef: "是什么让你一路来到这里的？"
  npc_override_1@mir_RoomOfConsciousness_what_did_she_just_master_88198f: "（这是什么？！她刚刚掌握了我对她使用的魔法？）"
  npc_override_1@mir_RoomOfConsciousness_what_did_you_give_me_6decc2: "你给了我什么？"
  npc_override_1@mir_RoomOfConsciousness_what_did_you_say_00cb81: "你说什么？！"
  npc_override_1@mir_RoomOfConsciousness_what_earth_there_inside_116347: "里面到底是什么？"
  npc_override_1@mir_RoomOfConsciousness_what_heck_6bb4b9: "这到底是什么？！"
  npc_override_1@mir_RoomOfConsciousness_what_how_dare_you_94074e: "什么？你怎么敢！"
  npc_override_1@mir_RoomOfConsciousness_what_kind_answer_bijou_7799f5: "这是什么答案，Bijou？"
  npc_override_1@mir_RoomOfConsciousness_what_what_s_up_monster_9ef27f: "什么……这个怪物是怎么回事？！"
  npc_override_1@mir_RoomOfConsciousness_what_you_think_you_re_d9b7c3: "你以为你在做什么，Bijou？"
  npc_override_1@mir_RoomOfConsciousness_whoa_close_call_aa7d58: "哇……好险。"
  npc_override_1@mir_RoomOfConsciousness_why_place_shaking_78d42a: "为什么这个地方在摇晃？！"
  npc_override_1@mir_RoomOfConsciousness_why_tell_me_why_137f51: "为什么……？告诉我为什么！"
  npc_override_1@mir_RoomOfConsciousness_yes_i_middle_taking_care_ce9e4b: "是的，我正在处理那些烦人的虫子。"
  npc_override_1@mir_RoomOfConsciousness_ymir_s_heart_750ef9: "伊米尔之心……"
  npc_override_1@mir_RoomOfConsciousness_ymir_s_heart_7ec9ef: "这就是伊米尔之心……"
  npc_override_1@mir_RoomOfConsciousness_ymir_s_heart_a6716c: "伊米尔之心！"
