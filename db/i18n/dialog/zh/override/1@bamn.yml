Header:
  Type: I18N_DIALOG
  Version: 1
Body:
  npc_override_1@bamn_TwilightGarden_activate_tracker_we_got_05a6b4: "激活我们从 Elyumina 那里得到的追踪器。"
  npc_override_1@bamn_TwilightGarden_adventurer_noisy_thing_f_e48460: "冒险者。那个吵闹的东西又在闪烁了吗？让我们检查一下。"
  npc_override_1@bamn_TwilightGarden_adventurer_there_s_intru_07f94e: "冒险者，有入侵者！"
  npc_override_1@bamn_TwilightGarden_adventurer_you_like_almo_34fb33: "冒险者。你喜欢杏仁吗？一位喜欢杏仁的顾客给我取了这个名字。适合我吗？"
  npc_override_1@bamn_TwilightGarden_after_all_they_re_just_b1958d: "毕竟，它们只是自动人偶，对吧？"
  npc_override_1@bamn_TwilightGarden_ah_i_ll_also_escort_f469c3: "啊。我也会护送 Almond。"
  npc_override_1@bamn_TwilightGarden_ahahaha_s_noisy_0d2dba: "啊哈哈哈，好吵啊。"
  npc_override_1@bamn_TwilightGarden_also_almond_said_she_had_175abd: "另外，Almond 说她要出去检查一下什么。"
  npc_override_1@bamn_TwilightGarden_body_manager_beta_hidden_ea5b03: "Manager Beta 的躯体隐藏在景观之下。"
  npc_override_1@bamn_TwilightGarden_careful_9a2d79: "小心！"
  npc_override_1@bamn_TwilightGarden_checking_signal_d1a7b1: "……正在检查信号。"
  npc_override_1@bamn_TwilightGarden_come_me_anytime_a0cc7d: "随时放马过来。"
  npc_override_1@bamn_TwilightGarden_core_part_empty_8d6a56: "核心部分是空的。"
  npc_override_1@bamn_TwilightGarden_core_slot_empty_481447: "核心插槽是空的。"
  npc_override_1@bamn_TwilightGarden_did_guy_think_controllin_d2109c: "这家伙以为控制自动人偶就能帮他争取时间吗？"
  npc_override_1@bamn_TwilightGarden_did_you_42b12c: "你做到了吗？"
  npc_override_1@bamn_TwilightGarden_don_t_worry_i_ll_57796c: "别担心，我会从这里照顾好 Almond。"
  npc_override_1@bamn_TwilightGarden_electricity_bounces_does_840f27: "电流弹跳不动，好像机器坏了一样。"
  npc_override_1@bamn_TwilightGarden_everyone_supposed_mansio_933b6e: "今天所有人应该都在宅邸里。"
  npc_override_1@bamn_TwilightGarden_go_suffer_e47829: "去受苦吧！"
  npc_override_1@bamn_TwilightGarden_guest_there_intruder_720314: "客人，有入侵者！"
  npc_override_1@bamn_TwilightGarden_guy_you_missed_boy_purpl_953336: "你漏掉的那个家伙是个紫发少年，对吧？"
  npc_override_1@bamn_TwilightGarden_hacking_channel_checked_9fdc1a: "……骇入频道检查完毕。"
  npc_override_1@bamn_TwilightGarden_hah_you_think_you_catch_5fb116: "哈！你以为你能抓住我吗？"
  npc_override_1@bamn_TwilightGarden_he_always_ran_so_well_273da4: "但他以前总是跑得很快，这是我第一次好好看到他~"
  npc_override_1@bamn_TwilightGarden_he_probably_went_western_2ded3b: "他可能去了宅邸的西边，往那边去吧。"
  npc_override_1@bamn_TwilightGarden_he_responding_anything_7f09e7: "他对任何东西都没有反应。"
  npc_override_1@bamn_TwilightGarden_heart_hunter_don_t_know_2bfbd5: "心灵猎手不知道我发生了什么事，但是……"
  npc_override_1@bamn_TwilightGarden_hehehe_s_finally_time_re_8f0f78: "嘿嘿嘿……终于到复仇的时候了……嘿嘿嘿……"
  npc_override_1@bamn_TwilightGarden_hey_you_ready_8aecdc: "嘿，你准备好了吗？"
  npc_override_1@bamn_TwilightGarden_hmm_shall_we_cee8ce: "嗯……我们要动手吗？"
  npc_override_1@bamn_TwilightGarden_huh_what_you_carrying_ri_f7e08f: "嗯？你现在带着什么？拿出来给我看看。"
  npc_override_1@bamn_TwilightGarden_i_don_t_know_if_a01aeb: "我不知道该设个陷阱，还是给你一次机会。"
  npc_override_1@bamn_TwilightGarden_i_had_no_choice_blow_cfd4a7: "我别无选择，只能炸掉宅邸的自动人偶……"
  npc_override_1@bamn_TwilightGarden_i_ll_deal_rest_who_f26154: "我来处理躲在花园里的其余家伙。"
  npc_override_1@bamn_TwilightGarden_i_ll_join_you_soon_8459ad: "我很快就来加入你们。"
  npc_override_1@bamn_TwilightGarden_i_ll_let_alpha_know_7f668d: "我稍后会让 Alpha 知道，这样她就可以回收人偶的躯体。"
  npc_override_1@bamn_TwilightGarden_i_ll_look_around_find_2a91fd: "我会四处看看，寻找其他路线。"
  npc_override_1@bamn_TwilightGarden_i_ll_waiting_guesthouse_99fc1f: "我会在客房等你。"
  npc_override_1@bamn_TwilightGarden_i_m_curious_should_we_159058: "我很好奇，我们应该快点走吗？"
  npc_override_1@bamn_TwilightGarden_i_m_like_them_all_10b6e6: "我和它们完全不同，我是个优秀的生物！"
  npc_override_1@bamn_TwilightGarden_i_m_sure_i_ll_ed9f34: "我确定打败你之后我会感觉好多了。"
  npc_override_1@bamn_TwilightGarden_i_passed_out_shock_556b13: "我震惊得晕了过去。"
  npc_override_1@bamn_TwilightGarden_i_place_go_second_21c1da: "我有个地方要去一下。"
  npc_override_1@bamn_TwilightGarden_i_t_understand_e40dd6: "我无法理解。"
  npc_override_1@bamn_TwilightGarden_i_take_care_moving_sweet_e8fce2: "我会负责搬运 Sweety。"
  npc_override_1@bamn_TwilightGarden_i_think_he_fainted_my_3e7d7b: "我想他被我的攻击打昏了。"
  npc_override_1@bamn_TwilightGarden_i_think_rest_members_som_3df6ad: "我觉得其他成员也还不错。"
  npc_override_1@bamn_TwilightGarden_i_thought_might_better_t_a3b430: "我想也许多放些诱饵会更好，所以我去请求自动人偶的帮助。"
  npc_override_1@bamn_TwilightGarden_i_ve_heard_report_you_4d4d30: "我已经听到报告了。你找到了一个看起来像首领的家伙？"
  npc_override_1@bamn_TwilightGarden_i_ve_recovered_core_dba1d5: "我已经回收了核心。"
  npc_override_1@bamn_TwilightGarden_i_won_t_lose_you_41f95c: "这次我不会输给你的！"
  npc_override_1@bamn_TwilightGarden_if_there_s_enemy_causing_a5d867: "如果有敌人在制造骚动，我们应该以更多人数攻击他们。"
  npc_override_1@bamn_TwilightGarden_kakaka_let_s_beat_them_fd0c36: "咔咔咔，让我们一举击溃他们！"
  npc_override_1@bamn_TwilightGarden_kid_while_ago_i_ve_20e639: "刚才那个孩子，我以前见过他。"
  npc_override_1@bamn_TwilightGarden_leave_rest_us_0575e8: "剩下的交给我们。"
  npc_override_1@bamn_TwilightGarden_let_s_get_out_here_c068ff: "我们离开这里吧。"
  npc_override_1@bamn_TwilightGarden_let_s_go_check_repeater_02907b: "我们去检查中继器吧。"
  npc_override_1@bamn_TwilightGarden_let_s_go_next_repeater_da8fb5: "我们去下一个中继器吧~"
  npc_override_1@bamn_TwilightGarden_let_s_go_see_repeater_4d35cb: "我们去看看那个经常被骇入的中继器。"
  npc_override_1@bamn_TwilightGarden_let_s_go_together_whenev_6a569a: "你准备好的时候我们就一起走吧。"
  npc_override_1@bamn_TwilightGarden_let_s_more_quietly_2ed706: "我们安静点行动吧。"
  npc_override_1@bamn_TwilightGarden_let_s_wrap_up_e8ad64: "我们收工吧。"
  npc_override_1@bamn_TwilightGarden_looks_like_he_passed_out_7a45bf: "看起来他昏过去了。"
  npc_override_1@bamn_TwilightGarden_menu_almond_679719: "Almond:Sweety~ 要适度哦~"
  npc_override_1@bamn_TwilightGarden_menu_est_085457: "Est:Elena 说她稍后会加入我们，但很有可能她来不了。"
  npc_override_1@bamn_TwilightGarden_menu_est_308b4f: "Est:我们所要做的就是像巡逻一样四处走动，趁其不备抓住他们。"
  npc_override_1@bamn_TwilightGarden_menu_est_4959d0: "Est:即便如此，也不用担心。其他人已经准备好，正在等待伏击信号。"
  npc_override_1@bamn_TwilightGarden_menu_est_a98a48: "Est:不要四处张望太多，假装你没有戒备，明白了吗？"
  npc_override_1@bamn_TwilightGarden_menu_est_d2e7d0: "Est:好了，我们走吧。"
  npc_override_1@bamn_TwilightGarden_menu_est_e59e29: "Est:天又黑又安静。如果你想执行计划，现在是最佳时机。对吧？"
  npc_override_1@bamn_TwilightGarden_menu_est_e5e8ad: "Est:沿着这条路走到宅邸的主楼。我会潜伏在你身后。"
  npc_override_1@bamn_TwilightGarden_menu_est_f361b7: "Est:你听到这里有巨大的声响吗？"
  npc_override_1@bamn_TwilightGarden_menu_options_1fd1a7: "'{0}:追踪器:咔咔咔咔咔咔！凶手就在附近！他们在我的雷达上！在那边！'"
  npc_override_1@bamn_TwilightGarden_menu_options_6a155a: "'{0}:追踪器:根据伟大的 Elyumina 的直觉……嘟嘟嘟嘟嘟~'"
  npc_override_1@bamn_TwilightGarden_menu_options_8ee85c: "'{0}:追踪器:在那边！！哔！'"
  npc_override_1@bamn_TwilightGarden_menu_options_b90dc2: "'{0}:追踪器:噗哦哦哦哦！在那里！！'"
  npc_override_1@bamn_TwilightGarden_menu_options_e84979: "'{0}:追踪器:噗哦哦哦哦！往那边！噗哦噗哦~！'"
  npc_override_1@bamn_TwilightGarden_menu_repeater_2b33a0: "中继器:(…… .. ..)"
  npc_override_1@bamn_TwilightGarden_menu_repeater_f87e14: "中继器:(…… ??…… ??)"
  npc_override_1@bamn_TwilightGarden_msg_6eae3a: "……"
  npc_override_1@bamn_TwilightGarden_msg_8707ce: "…… ……"
  npc_override_1@bamn_TwilightGarden_nods_2c5590: "……（点头）"
  npc_override_1@bamn_TwilightGarden_now_i_sweety_take_care_5ce41b: "现在，我，Sweety 会收拾那些刚进来的白痴！"
  npc_override_1@bamn_TwilightGarden_now_more_time_yes_no_4aeb73: "现在？再等等……是，不……啊……"
  npc_override_1@bamn_TwilightGarden_oh_there_s_message_stay_64aa40: "哦，有消息。在那里等一下。是的，你好。"
  npc_override_1@bamn_TwilightGarden_pitaya_s_here_cute_they_04afc9: "这里的火龙果很可爱~他们说杏仁很好吃？你以前吃过杏仁吗？"
  npc_override_1@bamn_TwilightGarden_please_deal_him_enough_m_d3add3: "请好好教训他，让他满意。"
  npc_override_1@bamn_TwilightGarden_quietly_surrender_return_3fedea: "乖乖投降，或者回到你来的地方去。"
  npc_override_1@bamn_TwilightGarden_reason_i_d_like_ask_aaf1f4: "因此，我想请你护送 Almond 来这里检查中继器。"
  npc_override_1@bamn_TwilightGarden_recovering_083407: "……恢复中……84%"
  npc_override_1@bamn_TwilightGarden_recovering_7d54f7: "……恢复中……72%"
  npc_override_1@bamn_TwilightGarden_recovering_82496b: "……恢复中……"
  npc_override_1@bamn_TwilightGarden_recovery_completed_4a83e5: "……恢复完成。"
  npc_override_1@bamn_TwilightGarden_repeater_dead_again_s_wh_c3d934: "中继器又坏了。所以我得修理它。"
  npc_override_1@bamn_TwilightGarden_repeater_favorite_target_e62a36: "中继器是入侵者最喜欢的目标，所以我们不能让它一直坏着，对吧？"
  npc_override_1@bamn_TwilightGarden_s_been_while_since_i_44c79c: "我已经很久没有这么舒服了~"
  npc_override_1@bamn_TwilightGarden_s_est_de4bf9: "是 Est！"
  npc_override_1@bamn_TwilightGarden_s_kid_before_right_he_4044f0: "是之前那个孩子，对吧？他是个入侵者。真奇怪，有点像杏仁……"
  npc_override_1@bamn_TwilightGarden_s_little_late_s_over_af221f: "虽然有点晚了，但结束了。"
  npc_override_1@bamn_TwilightGarden_s_loud_thing_b7b548: "那东西真吵。"
  npc_override_1@bamn_TwilightGarden_s_more_quiet_than_i_8c2d06: "比我想象的安静。入侵者去哪儿了？"
  npc_override_1@bamn_TwilightGarden_s_my_job_fix_his_f27cd4: "修复他被摧毁的躯体是我的工作。"
  npc_override_1@bamn_TwilightGarden_s_quite_far_here_ea860f: "但离这里很远。"
  npc_override_1@bamn_TwilightGarden_seeing_he_averts_his_gaz_a25073: "看到他移开目光，他似乎没有完全坏掉。"
  npc_override_1@bamn_TwilightGarden_shall_we_go_faster_there_469b32: "我们要走快点吗？那边有声音传来……"
  npc_override_1@bamn_TwilightGarden_shall_we_go_repeater_422242: "我们去中继器那里吗？"
  npc_override_1@bamn_TwilightGarden_shouldn_t_you_talk_est_666cff: "你不应该和 Est 谈谈吗？看起来她一直在等。"
  npc_override_1@bamn_TwilightGarden_so_did_teachers_2a284f: "老师们也是。"
  npc_override_1@bamn_TwilightGarden_so_far_no_okay_e85c12: "…… ……到目前为止……不？！……好吧……"
  npc_override_1@bamn_TwilightGarden_so_s_you_guy_who_539d2b: "原来是你。在花园里拖拖拉拉的那个家伙。"
  npc_override_1@bamn_TwilightGarden_something_important_came_14adfe: "有重要的事情发生了。这就是为什么我和 Est 在这里。"
  npc_override_1@bamn_TwilightGarden_talk_almond_when_you_re_82871d: "当你准备好行动时，和 Almond 谈谈。"
  npc_override_1@bamn_TwilightGarden_thank_you_showing_yourse_6aef8d: "谢谢你们现身！你们这些混蛋！"
  npc_override_1@bamn_TwilightGarden_then_let_us_go_268790: "那么，我们走吧。"
  npc_override_1@bamn_TwilightGarden_then_shall_we_9a6bfe: "那么，我们开始吧？"
  npc_override_1@bamn_TwilightGarden_there_no_way_find_out_7a1681: "无法查明中继器的状态。通信芯片似乎已正确安装。"
  npc_override_1@bamn_TwilightGarden_there_s_another_intruder_adf662: "还有另一个入侵者！难怪我开始兴奋了~！"
  npc_override_1@bamn_TwilightGarden_there_still_some_intrude_59455b: "外面还有一些入侵者。"
  npc_override_1@bamn_TwilightGarden_they_already_escaped_usi_59ea2e: "他们已经用飞艇逃走了！"
  npc_override_1@bamn_TwilightGarden_they_must_been_waiting_t_5dbda4: "他们一定也在等待。"
  npc_override_1@bamn_TwilightGarden_those_guys_nothing_failu_be5cd9: "但是，那些家伙不过是失败者。"
  npc_override_1@bamn_TwilightGarden_wait_bit_5cb0c8: "等一下。"
  npc_override_1@bamn_TwilightGarden_wait_sec_267d13: "^008800等一下！！"
  npc_override_1@bamn_TwilightGarden_way_43fd4c: "这边走。"
  npc_override_1@bamn_TwilightGarden_way_other_one_92c8fd: "我们在去另一个的路上。"
  npc_override_1@bamn_TwilightGarden_we_ll_take_over_place_117b9a: "我们会接管这个地方，等着瞧吧！"
  npc_override_1@bamn_TwilightGarden_we_re_going_bait_him_9b5f9f: "我们要把他引出来。"
  npc_override_1@bamn_TwilightGarden_well_doesn_t_mean_we_7edac0: "嗯，那不意味着我们会让你回去。"
  npc_override_1@bamn_TwilightGarden_what_52f3d0: "什么……？"
  npc_override_1@bamn_TwilightGarden_what_did_they_ran_move_039695: "什么？他们跑了？！出动！"
  npc_override_1@bamn_TwilightGarden_what_did_you_come_here_634478: "什么，你是来探索花园的吗？"
  npc_override_1@bamn_TwilightGarden_what_happened_repeater_c3fa4f: "中继器怎么了？"
  npc_override_1@bamn_TwilightGarden_what_signal_you_sending_b7fc8f: "你们互相发送什么信号？"
  npc_override_1@bamn_TwilightGarden_what_where_did_other_guy_01b9cd: "什么，其他人去哪儿了？"
  npc_override_1@bamn_TwilightGarden_what_why_389c4d: "什么，为什么？"
  npc_override_1@bamn_TwilightGarden_why_sweety_likes_push_hi_01a07b: "为什么 Sweety 喜欢把身体逼到极限……"
  npc_override_1@bamn_TwilightGarden_yes_s_go_no_two_ca25be: "' ……是……s……走……不……二……'"
  npc_override_1@bamn_TwilightGarden_you_all_right_adventurer_1186b2: "你没事吧，冒险者？那么，我们可以继续了。"
  npc_override_1@bamn_TwilightGarden_you_aware_8dab31: "你意识到了吗？"
  npc_override_1@bamn_TwilightGarden_you_cannot_receive_any_m_5017ef: "你携带的道具太多了，无法再接收更多道具。请减轻负重后再试。^000000"
  npc_override_1@bamn_TwilightGarden_you_elyumina_s_tracker_a_5b51b5: "你有 Elyumina 的追踪器。如果你靠近他，它会激活。"
  npc_override_1@bamn_TwilightGarden_you_elyumina_s_tracker_i_1c0684: "你有 Elyumina 的追踪器，如果你靠近他，它会激活。"
  npc_override_1@bamn_TwilightGarden_you_move_out_first_4f39e8: "你先出动吗？"
  npc_override_1@bamn_TwilightGarden_you_re_looking_boy_purpl_c2b7ed: "你在找一个紫发少年，对吧？他往实验室那边去了。"
  npc_override_1@bamn_TwilightGarden_you_re_one_step_behind_9465fc: "你们慢了一步！你们这群白痴！"
  npc_override_1@bamn_TwilightGarden_you_re_pretty_good_aren_d451b3: "你挺厉害的，不是吗？"
  npc_override_1@bamn_TwilightGarden_you_re_too_late_you_bb5782: "你们太迟了。你们这些白痴！"
  npc_override_1@bamn_TwilightGarden_you_want_wrap_up_now_df28ae: "你想现在收工吗？"
  npc_override_1@bamn_TwilightGarden_you_you_re_reason_i_10b323: "你！你就是我现在没空的原因！下次见面我会杀了你！"
