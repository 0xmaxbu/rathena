  npc_override_prt_in_megingard_seal_menu_keyword_ebe065: "^663300[关键词：^996633第一小队记录^663300]"
  npc_override_prt_in_megingard_seal_menu_make_e5f64f: "制造格莱普尼尔。:取消。"
  npc_override_prt_in_megingard_seal_menu_megingjard_db0668: "^FF0000梅金吉尔德^000000！:^FFFFFF安静地听他说^000000。"
  npc_override_prt_in_megingard_seal_menu_no_9350b3: "不。:是的！"
  npc_override_prt_in_megingard_seal_menu_now_8228c6: "现在我想起来了：他是"
  npc_override_prt_in_megingard_seal_menu_options_0784db: "^0000FF : 雷巴列夫·道格"
  npc_override_prt_in_megingard_seal_menu_options_2c2b08: " : 九号球^000000"
  npc_override_prt_in_megingard_seal_menu_options_5e9e10: " : 夸克·多农"
  npc_override_prt_in_megingard_seal_menu_options_65d612: " : 皇家·米斯特"
  npc_override_prt_in_megingard_seal_menu_options_8f2ee4: " : 艾玛·瑟斯"
  npc_override_prt_in_megingard_seal_menu_options_caec27: " : 赞·华多库"
  npc_override_prt_in_megingard_seal_menu_options_e5cd1d: " : 杰克·O"
  npc_override_prt_in_megingard_seal_menu_rebarev_e7e7c8: "雷巴列夫·道格派我来的！:等等，他在躲藏吗？:只是……好奇。"
  npc_override_prt_in_megingard_seal_menu_record_013f7c: "记录搜索。:退出搜索。:搜索帮助:交谈。"
  npc_override_prt_in_megingard_seal_menu_search_a29cb5: "-用关键词搜索：{0} -"
  npc_override_prt_in_megingard_seal_menu_speak_6c689b: "谈论雷巴列夫·道格。:谈论第一小队。:谈论赌博。:讨论爱好。"
  npc_override_prt_in_megingard_seal_menu_sure_288a2c: "当然，为什么不呢。:抱歉，不行。"
  npc_override_prt_in_megingard_seal_menu_the_2884b4: "第三排："
  npc_override_prt_in_megingard_seal_menu_the_8287c8: "第三连："
  npc_override_prt_in_megingard_seal_menu_the_91c7ec: "第一小队：十字军。"
  npc_override_prt_in_megingard_seal_menu_the_adfd2e: "任务:第一小队的命运:你为什么在尼芙菲姆？:谢谢，我听够了。"
  npc_override_prt_in_megingard_seal_menu_what_127968: "什么事？:我厌倦了做 favors。"
  npc_override_prt_in_megingard_seal_menu_what_14963d: "什么是圣十字？:什么是圣十字审判？:什么是牺牲？:什么是格莱普尼尔？"
  npc_override_prt_in_megingard_seal_menu_where_6b498f: "我应该去哪里？:我要离开了。:你说的最后一次任务是什么意思？"
  npc_override_prt_in_megingard_seal_menu_where_bc5a0c: "我应该去哪里？:我要离开了。"
  npc_override_prt_in_megingard_seal_menu_witch_cb8ad7: "女巫城堡:工具店:武器店:酒馆:取消"
  npc_override_prt_in_megingard_seal_menu_yes_c6fa74: "是的，我介意！:不，我不介意。"
  npc_override_prt_in_megingard_seal_menu_you_7f66bf: "你眼睛不好吗？:我想阅读一些文件。:让我帮你找那些文件……:你在找什么类型的文件？"
  npc_override_prt_in_megingard_seal_menu_you_c8be56: "你要自己探索这个地方？真勇敢，不是吗？只是要小心：在尼芙菲姆，黑暗至高无上。"
  npc_override_prt_in_megingard_seal_might_bad_idea_let_someo_941f76: "让你这样的人和夸克·多农谈谈也许不是坏主意。你看起来不像坏人……"
  npc_override_prt_in_megingard_seal_might_helpful_know_we_cr_ff95bb: "知道我们是^660000十字军第三连第三排第一小队^000000可能对你有帮助。"
  npc_override_prt_in_megingard_seal_military_judge_sadly_eve_5c4c55: "军事法官！遗憾的是，即使是我们十字军也无法幸免于腐败……"
  npc_override_prt_in_megingard_seal_military_system_ee2ac5: "但在军事体系中，"
  npc_override_prt_in_megingard_seal_moisten_sadness_cd93bf: "用悲伤湿润。"
  npc_override_prt_in_megingard_seal_monsters_weak_against_ho_ecaf33: "对神圣弱点的怪物，特别是不死族，会被圣十字的光芒致盲。他们只能等待神圣的审判。"
  npc_override_prt_in_megingard_seal_more_specific_informatio_1ff7d1: "更具体的信息可以通过搜索^996633第一小队^663300找到。"
  npc_override_prt_in_megingard_seal_more_than_e5bf0c: "不止这些……"
  npc_override_prt_in_megingard_seal_most_i_bac7d5: "是。我最多能做的"
  npc_override_prt_in_megingard_seal_most_likely_they_some_sp_f4a8c9: "很可能，他们会有一些备用物品，如果你礼貌地询问，他们愿意与你分享。"
  npc_override_prt_in_megingard_seal_most_members_st_squad_tr_fdee8b: "第一小队的大多数成员被转移到其他小队或退役。他们的前领袖雷巴列夫·道格目前根据皇家法令负责研究神器。^000000"
  npc_override_prt_in_megingard_seal_mourning_my_loss_3248de: "哀悼我的损失。"
  npc_override_prt_in_megingard_seal_ms_leilah_my_idol_e7dd8a: "莱拉小姐是我的偶像，"
  npc_override_prt_in_megingard_seal_msg_032da9: "^0000FF{0}？"
  npc_override_prt_in_megingard_seal_msg_155391: "^663300- …… -^000000"
  npc_override_prt_in_megingard_seal_msg_5a2bae: "………"
  npc_override_prt_in_megingard_seal_msg_6eae3a: "……"
  npc_override_prt_in_megingard_seal_msg_861fa1: "{0}。"
  npc_override_prt_in_megingard_seal_msg_93fcbf: "……"
  npc_override_prt_in_megingard_seal_msg_e95f89: "……"
  npc_override_prt_in_megingard_seal_musta_did_something_me_946d02: "一定对我做了什么……"
  npc_override_prt_in_megingard_seal_my_comrades_907f24: "我的战友们……"
  npc_override_prt_in_megingard_seal_my_family_always_expecte_573ba2: "我的家人总是期望"
  npc_override_prt_in_megingard_seal_my_head_3313c2: "我的头！"
  npc_override_prt_in_megingard_seal_my_head_hurts_8c3a1e: "而且我的头痛。"
  npc_override_prt_in_megingard_seal_my_head_hurts_f3aac5: "我的头痛……"
  npc_override_prt_in_megingard_seal_my_life_6d1ee3: "我的生命是……！"
  npc_override_prt_in_megingard_seal_my_name_emma_searth_righ_2a903a: "我的名字是艾玛·瑟斯。现在，我正在追随我的梦想，申请成为一名卡普拉小姐。所以我挥剑的日子结束了。"
  npc_override_prt_in_megingard_seal_my_name_max_von_shedough_3afa83: "我的名字是马克斯·冯·谢多，军事法官！你有什么事要找我吗？"
  npc_override_prt_in_megingard_seal_my_name_max_von_shedough_497d0f: "我的名字是马克斯·冯·谢多，军事法官！遗憾的是，即使是我们十字军也无法幸免于腐败……"
  npc_override_prt_in_megingard_seal_my_name_max_von_shedough_586ad1: "我的名字是马克斯·冯·谢多，"
  npc_override_prt_in_megingard_seal_my_old_boss_when_i_2d68ed: "但我当十字军时的老老板不想见我姐姐。所以她要请其他流氓帮忙散布一些谣言……"
  npc_override_prt_in_megingard_seal_my_old_comrades_arms_f0f1c9: "我的老战友们。"
  npc_override_prt_in_megingard_seal_my_parents_insisted_2188fa: "我的父母坚持"
  npc_override_prt_in_megingard_seal_my_position_ce99a1: "我的职位。"
  npc_override_prt_in_megingard_seal_my_sister_s_part_comes_aecc7d: "我姐姐所属的部分有时会进来对我大喊大叫。他们都想让我告诉他们一些我应该知道的事情！"
  npc_override_prt_in_megingard_seal_my_sister_told_me_tell_f863f3: "我姐姐告诉我不要告诉任何人，但我要告诉你……"
  npc_override_prt_in_megingard_seal_n_never_mind_6223e2: "没-没关系……"
  npc_override_prt_in_megingard_seal_name_makes_275173: "那个名字让"
  npc_override_prt_in_megingard_seal_named_us_43d1e1: "和我们一起命名？"
  npc_override_prt_in_megingard_seal_naturally_i_opposed_him_9dc3e1: "自然地，我反对他。他明显精神不平衡，让他控制这样的力量将是危险的。这导致了我们之间的一场打斗。"
  npc_override_prt_in_megingard_seal_nd_seal_megingjard_appea_082da1: "[梅金吉尔德]的第2个封印已经出现。"
  npc_override_prt_in_megingard_seal_nd_seal_megingjard_been_d57713: "[梅金吉尔德]的第2个封印已被释放。"
  npc_override_prt_in_megingard_seal_newlyweds_really_need_7863ac: "新婚夫妇真的需要"
  npc_override_prt_in_megingard_seal_niflheim_i_t_quite_move_93f3fc: "在尼芙菲姆。没有她，我无法前往天堂、瓦尔哈拉或任何其他地方。"
  npc_override_prt_in_megingard_seal_no_matter_how_much_i_591234: "无论我解释多少，无知的人永远不会完全理解我们任务的重要性。当我们最意想不到的时候，力量平衡将会改变！"
  npc_override_prt_in_megingard_seal_no_recollection_me_b6721b: "对我没有任何记忆。"
  npc_override_prt_in_megingard_seal_no_result_been_found_b945c9: "未找到结果。"
  npc_override_prt_in_megingard_seal_no_result_been_found_df0bcd: "- 未找到结果。-"
  npc_override_prt_in_megingard_seal_no_there_someone_b2e45c: "有，不，有人"
  npc_override_prt_in_megingard_seal_nothing_useful_over_bb1333: "那边没什么有用的"
  npc_override_prt_in_megingard_seal_now_76c5ab: "现在……"
  npc_override_prt_in_megingard_seal_now_after_all_our_advent_6755f9: "现在，经历了我们所有的冒险和美好时光，我处于最糟糕的境地。"
  npc_override_prt_in_megingard_seal_now_don_t_forget_dad585: "现在，别忘了！"
  npc_override_prt_in_megingard_seal_now_i_cannot_let_anyone_f06b7f: "目前，我不能让没有特殊授权的人查看那个区域。我必须尽快找到那份文件并把它送到普隆特拉军方。"
  npc_override_prt_in_megingard_seal_now_i_get_these_migraine_8dc74e: "但现在每当我试图专注于那些时光的记忆时，我就会偏头痛"
  npc_override_prt_in_megingard_seal_now_i_need_continue_my_5e1ed8: "现在，我需要在陛下的命令下继续我的研究。"
  npc_override_prt_in_megingard_seal_now_i_need_continue_my_7c5928: "现在，我需要在陛下的命令下继续我的研究。再次感谢你的帮助。"
  npc_override_prt_in_megingard_seal_now_i_think_about_b713cc: "现在我想起来了！"
  npc_override_prt_in_megingard_seal_now_i_won_t_d48b31: "现在我不用"
  npc_override_prt_in_megingard_seal_now_if_human_wear_a17b17: "现在，如果一个人类佩戴"
  npc_override_prt_in_megingard_seal_now_rebarev_doug_been_st_93caf0: "现在雷巴列夫·道格一直在研究我们在那次任务中发现的梅金吉尔德碎片，使用王国的研究资金。有一天，他可能能够重建那条腰带。"
  npc_override_prt_in_megingard_seal_now_records_say_mission_931ac1: "现在，记录说任务不令人满意，对吗？那是因为我。"
  npc_override_prt_in_megingard_seal_now_we_secretly_assigned_3ae2b8: "现在，我们被秘密指派"
  npc_override_prt_in_megingard_seal_now_works_inn_feba0f: "现在在一家旅馆工作。"
  npc_override_prt_in_megingard_seal_obsolete_version_90bce8: "过时版本"
  npc_override_prt_in_megingard_seal_off_limits_91a116: "禁止入内！"
  npc_override_prt_in_megingard_seal_oh_78a2fc: "哦……"
  npc_override_prt_in_megingard_seal_oh_adventurer_i_actually_702c6b: "哦，冒险者！我以前实际上从事和你一样的领域。更具体地说，我曾经是一名十字军。"
  npc_override_prt_in_megingard_seal_oh_i_bit_secret_i_187892: "哦，我还有一个秘密……！我听说旅馆老板正在策划某种 shady 生意。这是一个重大项目，但别让任何人知道是我告诉你的！"
  npc_override_prt_in_megingard_seal_oh_i_m_glad_hear_940067: "哦，我很高兴听到"
  npc_override_prt_in_megingard_seal_oh_i_remember_something_3a4c3f: "哦，我确实记得一些事情！"
  npc_override_prt_in_megingard_seal_oh_my_sister_said_she_f30808: "哦，我姐姐说她"
  npc_override_prt_in_megingard_seal_oh_no_i_m_sure_70918a: "哦不。我确定他可能"
  npc_override_prt_in_megingard_seal_oh_oh_god_bc6d79: "哦。哦上帝。"
  npc_override_prt_in_megingard_seal_oh_right_you_mentioned_d_377b54: "哦，对了，你提到过，不是吗？看起来"
  npc_override_prt_in_megingard_seal_oh_you_came_back_206d24: "哦，你回来了。"
  npc_override_prt_in_megingard_seal_oh_you_f77648: "哦，你是……"
  npc_override_prt_in_megingard_seal_oh_you_so_kind_eaa784: "哦，你真好！"
  npc_override_prt_in_megingard_seal_oil_paper_395b30: "1张油纸，"
  npc_override_prt_in_megingard_seal_okay_now_352456: "好的，现在……"
  npc_override_prt_in_megingard_seal_old_coot_must_afraid_dfd6e0: "那个老头一定害怕"
  npc_override_prt_in_megingard_seal_once_mission_completed_r_25056f: "任务完成后，雷巴列夫·道格向普隆特拉军方报告，意图保留大部分梅金吉尔德。"
  npc_override_prt_in_megingard_seal_once_you_said_name_she_59719b: "^3355FF一旦你说出那个名字，她立即靠近你"
  npc_override_prt_in_megingard_seal_one_day_i_happened_see_cc5e25: "有一天，我碰巧在艾尔帕兰看到莱拉小姐工作。她充满自信，光芒四射，即使面对顾客也赢得尊重！"
  npc_override_prt_in_megingard_seal_only_best_crusaders_sele_57379f: "只有最优秀的十字军才能入选第三连的所有小队。第三连小队的调动记录大多不可用。^000000"
  npc_override_prt_in_megingard_seal_only_person_whom_743834: "唯一的人"
  npc_override_prt_in_megingard_seal_only_person_worthy_belt_b7c1cf: "是唯一配得上那条腰带的人，因为他认为自己是世界上最虔诚的人，因此最接近众神。"
  npc_override_prt_in_megingard_seal_only_thing_works_my_head_463604: "是我头痛唯一有效的东西。"
  npc_override_prt_in_megingard_seal_oooh_looks_like_you_ve_551d69: "哦哦，看起来你有一杯美味的饮料我可以享用。哇哈哈哈！给我~！"
  npc_override_prt_in_megingard_seal_other_sections_e52775: "其他区域。"
  npc_override_prt_in_megingard_seal_others_bearing_suffering_ac7007: "他人承受同胞的痛苦。"
  npc_override_prt_in_megingard_seal_others_you_really_should_671f62: "以及你真的不应该的其他人。"
  npc_override_prt_in_megingard_seal_our_final_mission_013d9d: "我们的^0000FF最后一次任务^000000……"
  npc_override_prt_in_megingard_seal_our_old_leader_bdcb81: "我们的老领袖"
  npc_override_prt_in_megingard_seal_our_old_leader_had_huge_268d70: "我们的老领袖和我们中的一个人就我们发现的东西发生了巨大争执。我记得是某种神器，但我不清楚记得是什么。"
  npc_override_prt_in_megingard_seal_our_squad_broke_up_92d7c8: "我们的小队解散了。"
  npc_override_prt_in_megingard_seal_our_squad_says_one_us_6d35c8: "我们的小队，上面写着我们中的一个人因不服从、叛乱或类似原因受到惩罚。那是"
  npc_override_prt_in_megingard_seal_out_date_b94e00: "过时了……"
  npc_override_prt_in_megingard_seal_out_how_my_old_comrades_4a4be9: "我的老战友们"
  npc_override_prt_in_megingard_seal_paradise_resort_f0a426: "天堂度假村！"
  npc_override_prt_in_megingard_seal_phew_8d7b8c: "^333333*呼……*^000000"
  npc_override_prt_in_megingard_seal_place_safe_dangerous_peo_022283: "这个地方远离危险人物，但我不知道能维持多久。"
  npc_override_prt_in_megingard_seal_platoon_records_ac52cf: "^0000FF排记录^000000在"
  npc_override_prt_in_megingard_seal_platoons_please_c7efd6: "4个排。请"
  npc_override_prt_in_megingard_seal_please_come_17b90a: "请"
  npc_override_prt_in_megingard_seal_please_enter_keyword_1f67e6: "- 请输入关键词。 -"
  npc_override_prt_in_megingard_seal_please_get_those_as_soon_b1e855: "请尽快拿到那些，我会在这里做其他准备来复印。"
  npc_override_prt_in_megingard_seal_please_go_back_world_47151e: "请回到世界"
  npc_override_prt_in_megingard_seal_please_i_beg_you_39e4d6: "求你了，我恳求你，"
  npc_override_prt_in_megingard_seal_please_reconsider_40dfd0: "请重新考虑"
  npc_override_prt_in_megingard_seal_please_understand_b7cf94: "请理解"
  npc_override_prt_in_megingard_seal_please_use_ee5d99: "请不要使用"
  npc_override_prt_in_megingard_seal_pleased_when_they_learne_5d3e45: "很高兴得知我想成为一名卡普拉小姐。"
  npc_override_prt_in_megingard_seal_power_crucifix_light_dam_b29967: "光之十字架的力量可以对敌人造成三次伤害。每次打击都将有你普通攻击五倍的力量。"
  npc_override_prt_in_megingard_seal_practicing_what_we_preac_600f07: "在践行我们的教义时，十字军选择保护"
