  npc_override_prt_in_hair_dyer_you_let_me_treat_your_2a9347: "Would you let me treat your hair? Please?"
  npc_override_prt_in_hair_dyer_you_must_like_your_hair_0af479: "You must like your hair color~"
  npc_override_prt_in_hair_dyer_zeny_fee_37af9f: "- 1000 zeny fee."
  npc_override_prt_in_illusion_investigation_actually_i_m_interested_8ccaa8: "Actually, I'm not interested in illusions... I'm busy making a living."
  npc_override_prt_in_illusion_investigation_actually_i_m_one_who_2048f9: "Actually, I'm the one who's more timid than anyone else... heck"
  npc_override_prt_in_illusion_investigation_actually_s_something_i_m_e6dd82: "Actually, it's not something I'm keen on...but I need the money..."
  npc_override_prt_in_illusion_investigation_adventurer_hasn_t_joined_168e8b: "Adventurer hasn't joined the Illusion Investigation Team yet."
  npc_override_prt_in_illusion_investigation_after_entering_kill_mons_0313bc: "After entering, kill 100 monsters of any type."
  npc_override_prt_in_illusion_investigation_after_flowers_wither_win_a65b73: "After the flowers wither in winter, they will bloom again in spring. They always bloom in the place where the flowers withered and fell off."
