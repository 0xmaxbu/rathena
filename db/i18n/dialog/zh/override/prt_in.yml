  npc_override_prt_in_hair_dyer_menu_red_e5f1e1: "Red, please.:Yellow, please.:Violet, please.:Orange, please.:Green, please.:Blue, please.:White, please.:Black, please.:Actually, I like my hair as it is."
  npc_override_prt_in_hair_dyer_menu_yes_141459: "Yes:No"
  npc_override_prt_in_hair_dyer_oh_no_your_hair_damaged_572c33: "Oh, no! Your hair is damaged. It seems as if you may need professional treatment. Come sit over here, please. Come."
  npc_override_prt_in_hair_dyer_okay_choose_color_you_li_48f0a0: "Okay! Choose the color that you would like."
  npc_override_prt_in_hair_dyer_special_place_time_would_6ab213: "For that special place and time, wouldn't you want a hairstyle of your very own? As long as you have the appropriate dyestuffs, I will make your hair look wonderful."
