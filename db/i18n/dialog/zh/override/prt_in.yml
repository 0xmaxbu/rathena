  npc_override_prt_in_illusion_investigation_hello_you_like_some_rese_8cfb1e: "Hello, would you like to do some research with me today??"
  npc_override_prt_in_illusion_investigation_hello_you_only_one_who_fc098d: "Hello, you are the only one who can help me..."
