  npc_override_prt_in_illusion_investigation_you_like_join_us_meaning_fc7861: "Would you like to join us in this meaningful investigation?"
  npc_override_prt_in_illusion_investigation_you_like_participate_dee_19ac0f: "Would you like to participate in this deep sea investigation?"
  npc_override_prt_in_illusion_investigation_you_like_participate_ill_3c49cc: "Would you like to participate in this Illusion Investigation?"
  npc_override_prt_in_illusion_investigation_you_like_participate_inv_5586e9: "Would you like to participate in the investigation of this place?"
  npc_override_prt_in_illusion_investigation_you_like_participate_inv_603d6f: "Would you like to participate in the investigation work here again today??"
  npc_override_prt_in_illusion_investigation_you_like_participate_tas_fb59ce: "Would you like to participate in the task of killing 100 monsters of any type?"
  npc_override_prt_in_illusion_investigation_you_like_something_meani_df3ef8: "Would you like to do something meaningful with me?"
  npc_override_prt_in_illusion_investigation_you_must_come_here_becau_3e4c5a: "You must have come here because your body itches."
  npc_override_prt_in_illusion_investigation_you_must_level_higher_jo_b152e2: "^4d4dff== You must be level 100 or higher to join. ==^000000"
  npc_override_prt_in_illusion_investigation_you_pretended_brave_i_al_d3a151: "You pretended to be brave... but I already noticed"
  npc_override_prt_in_illusion_investigation_you_re_back_safely_b9f5e2: "You're back safely!"
  npc_override_prt_in_illusion_investigation_you_re_fit_research_righ_e24abd: "You're not fit to do research right now."
  npc_override_prt_in_illusion_investigation_you_re_right_person_yet_e7262c: "You're not the right person yet, sorry."
  npc_override_prt_in_illusion_investigation_you_same_thing_as_last_0b6028: "You can do the same thing as last time."
  npc_override_prt_in_illusion_investigation_you_sign_up_going_navi_5ae55e: "You can sign up by going to <NAVI>[Joel]<INFO>prt_in,136,34,</INFO></NAVI>, the Commander in Prontera. Sign up and come here~"
  npc_override_prt_in_illusion_investigation_you_ve_worked_really_har_4160c0: "You've worked really hard. Are there any injuries anywhere?"
  npc_override_prt_in_illusion_investigation_you_worked_hard_then_i_c6c69a: "You worked hard... Then I'll have to go down carefully."
  npc_override_prt_in_illusion_investigation_your_help_same_as_last_89e39e: "Your help is the same as last time~"
  npc_override_prt_in_prontera_aahhhh_i_wish_i_could_0c012b: "啊啊啊～真希望能穿上那样的裙子。哪怕只有一次也好……"
  npc_override_prt_in_prontera_acolytes_priests_trained_b08f3a: "在这座教堂里接受训练的服事和牧师可以治愈人们，解除异常状态，甚至激发其他冒险者的战斗潜力。"
  npc_override_prt_in_prontera_after_all_if_you_spend_385e63: "毕竟，如果你在一个技能上投入太多技能点，你可能就无法学习另一个技能了。没错，你能获得的技能点总数是有限的。"
  npc_override_prt_in_prontera_after_all_only_time_i_6e0cec: "毕竟，我只在主持婚礼的时候见过他。即使没有婚礼，他也在普隆德拉教堂附近闲逛！"
  npc_override_prt_in_prontera_ah_5eceea: "啊……！"
  npc_override_prt_in_prontera_ah_i_just_recall_being_ce0ff7: "啊，我刚想起我曾在迷宫和诡异森林里待过！"
  npc_override_prt_in_prontera_ahh_ded1c5: "啊……"
  npc_override_prt_in_prontera_alright_i_ve_19347b: "好的，我"
  npc_override_prt_in_prontera_also_if_you_keep_learnin_8171e7: "此外，如果你继续学习天使之障壁，最终可以学习^6666CC霸邪之阵^000000。那个技能可以帮你自动闪避初始攻击。"
  npc_override_prt_in_prontera_also_reason_why_i_keep_38fe9d: "这也是我坚持做这份工作的原因。"
  npc_override_prt_in_prontera_although_many_monsters_m_2db75c: "虽然很多怪物看起来可能一样，但要小心！外形基本相同的怪物之间也存在变种。"
  npc_override_prt_in_prontera_anyways_how_i_explored_s_08b2a3: "总之，这就是我探索怪物巢穴那些奇怪地方的方式……"
  npc_override_prt_in_prontera_as_creatures_organized_d_6acad3: "as creatures are organized by the dungeon in which they reside."
  npc_override_prt_in_prontera_as_you_see_numbers_monst_ab0b92: "如你所见，城外怪物的数量大幅增加，给我的供货商按时送货造成了麻烦。"
  npc_override_prt_in_prontera_awesome_knight_c2e2f5: "一个超棒的骑士！"
  npc_override_prt_in_prontera_awesomest_knight_around_28253d: "厉害的骑士！"
  npc_override_prt_in_prontera_basic_ingredients_my_cru_c53ebf: "我的咔嚓咔嚓酸的基本食材是在沙漠蚂蚁地狱里游荡的蚂蚁。"
  npc_override_prt_in_prontera_before_fabres_become_cre_80d178: "但在法布雷变成克瑞米之前，会经历一个蛹的阶段。那时它们会变成深紫色的茧，我们称之为普帕。很简单吧？"
  npc_override_prt_in_prontera_before_you_learn_angelus_4e36b3: "在学习天使之障壁之前，你需要先有^6666CC3级天使之护^000000。"
  npc_override_prt_in_prontera_before_you_learn_blessin_50b78b: "在学习天使之赐福之前，你必须先学会^6666CC5级天使之护^000000。"
  npc_override_prt_in_prontera_behold_d86b02: "看哪……"
  npc_override_prt_in_prontera_better_better_my_busines_bcc4e3: "我的生意越来越好。但是……"
  npc_override_prt_in_prontera_blessing_temporarily_inc_6d9230: "^6666CC天使之赐福^000000暂时增加力量、灵巧和智力。这个技能会给你和朋友在战斗中带来巨大优势！"
  npc_override_prt_in_prontera_but_2e7fce: "不过……"
  npc_override_prt_in_prontera_close_enough_427401: "足够近时，"
  npc_override_prt_in_prontera_come_back_any_time_54225f: "随时欢迎再来～"
  npc_override_prt_in_prontera_considering_i_personally_a42ec3: "考虑到这一点，我个人认为我的工作非常有用且相当讲究。这本身就使一切都值得了。粗糙的布料和粗犷的皮革在染色后焕发出活力和生命力……"
  npc_override_prt_in_prontera_demand_exceeded_supply_t_19080e: "但最近供不应求了。"
  npc_override_prt_in_prontera_demon_bane_damage_your_a_b009d9: "有了^6666CC邪击术^000000，你对不死系怪物的攻击伤害将永久提升。"
  npc_override_prt_in_prontera_demon_bane_increases_dam_d5f711: "^6666CC邪击术^000000永久提升你对不死系怪物的伤害。"
  npc_override_prt_in_prontera_did_you_any_questions_ab_67b8bd: "你对服事和牧师的技能有什么问题吗？"
  npc_override_prt_in_prontera_did_you_know_592d1a: "你知道吗？"
  npc_override_prt_in_prontera_don_t_you_know_there_f41e8d: "你不知道这片森林里住着恶魔吗？！我无法保证你的安全"
  npc_override_prt_in_prontera_eh_why_talk_me_first_181296: "哎～？为什么要来跟我说话？真是个奇怪的人。"
  npc_override_prt_in_prontera_err_haven_t_you_still_46a8f4: "嗯？你还没去普隆德拉外面逛过吗？"
  npc_override_prt_in_prontera_even_city_al_de_baran_269f05: "就连艾尔帕兰这座城市也是一道壮丽的风景线，优雅的建筑和浪漫的运河。"
  npc_override_prt_in_prontera_even_though_our_powers_u_011dc0: "虽然我们的力量通常用于治愈他人，但你实际上可以用^6666CC治愈术^000000技能对不死系怪物造成伤害。"
  npc_override_prt_in_prontera_feel_free_take_your_time_c092ba: "在这里随意放松吧。不过很抱歉我没什么可以招待你的。"
  npc_override_prt_in_prontera_fight_96707d: "战斗……！"
  npc_override_prt_in_prontera_fight_fight_b6114f: "战斗！战斗！"
  npc_override_prt_in_prontera_fight_fight_fight_281957: "战斗战斗战斗！"
  npc_override_prt_in_prontera_fine_i_m_gonna_keep_6e854a: "好吧！但我会继续训练的，我们走着瞧，看谁笑到最后！"
  npc_override_prt_in_prontera_first_i_gotta_swordie_if_3b2e77: "首先，我得成为一个剑士。但如果我不断练习，就能成为超强的剑士。然后……"
  npc_override_prt_in_prontera_first_you_ll_need_learn_539e18: "首先，你需要先学会^6666CC3级天使之护^000000才能学习邪击术，记住这一点。"
  npc_override_prt_in_prontera_first_you_must_learn_ruw_fe5d94: "首先，你必须学会^6666CC光猎^000000技能才能学习瞬间移动。"
  npc_override_prt_in_prontera_first_you_need_learn_ruw_cd4536: "首先，你需要学习^6666CC光猎^000000，它让你看到隐形的怪物。光猎之后，你还需要学习^6666CC瞬间移动^000000技能。"
  npc_override_prt_in_prontera_forewarned_forest_place_be4953: "事先警告你，那森林可不是去野餐的地方。如果你把东西掉在地上，猴子会不知从哪里冒出来，拿走你所有的东西。"
  npc_override_prt_in_prontera_get_such_dazzling_colors_47c383: "要获得那样耀眼的颜色，听说必须使用一种只能在梦罗克买到的染料。但我也听说价格高得难以想象。"
  npc_override_prt_in_prontera_go_ahead_ask_if_you_1b1a51: "如果你对服事和牧师的技能有任何问题，尽管问吧。"
  npc_override_prt_in_prontera_god_war_1a6d81: "战争之神！"
  npc_override_prt_in_prontera_god_wisdom_696d94: "智慧之神！"
  npc_override_prt_in_prontera_h_hey_52c131: "嘿！"
  npc_override_prt_in_prontera_hahaha_seems_you_re_pret_4f139f: "哈哈哈，看来你对自己的实力很有信心嘛？嗯……你为什么不去加入一个公会呢？我是说，所有的硬汉都在加入。"
  npc_override_prt_in_prontera_hard_believe_he_s_such_e586f0: "很难相信他是如此英明能干的领导者。"
  npc_override_prt_in_prontera_headquarters_kafra_corpo_27eb41: "卡普拉公司的总部也设在艾尔帕兰。你真的应该去看看。"
  npc_override_prt_in_prontera_heard_enough_3b04ee: "听够了。"
  npc_override_prt_in_prontera_heh_heh_i_sure_strife_92e1a4: "嘿嘿！我一定会的！'史特拉夫，勇敢的骑士。'听起来很酷吧？"
  npc_override_prt_in_prontera_hello_there_5a8ec9: "你好呀～"
  npc_override_prt_in_prontera_here_eastern_branch_pron_cc91ea: "这里是普隆德拉图书馆东馆，我们提供按属性分类的魔物百科。我们也有关于商人和铁匠技能的书籍。"
  npc_override_prt_in_prontera_here_rune_midgarts_we_se_d9f746: "在卢恩·米德加兹，我们信奉奥丁，这位可怕的神为了获得智慧而牺牲了自己的一只眼睛。"
  npc_override_prt_in_prontera_here_western_branch_pron_91c24c: "Here, in the Western branch of the Prontera Library, "
  npc_override_prt_in_prontera_hey_come_over_let_s_54204b: "嘿，过来喝一杯吧！我有好多有趣的故事要讲！"
  npc_override_prt_in_prontera_hey_f5f220: "嘿……！"
  npc_override_prt_in_prontera_hey_if_you_wanna_become_1721b7: "嘿，如果你想成为剑士，得去依斯鲁得。在那里你可以参加剑士转职考试。第一次的时候，我，嗯，惨败了。但我不会再失败了！"
  npc_override_prt_in_prontera_however_s_very_difficult_692ff7: "不过，这是一个非常难使用的技能，成功率相对较低。但如果这个技能不总是成功，也不要灰心。"
  npc_override_prt_in_prontera_i_almost_died_some_those_a68e84: "我差点死了！有些怪物一直追着我想杀我，尽管我什么都没做！简直疯了。"
  npc_override_prt_in_prontera_i_am_very_proud_my_d2067b: "但我为我的工作感到自豪。你知道这世界变得多艰难吗？"
  npc_override_prt_in_prontera_i_believe_us_humans_clot_48b317: "我相信对我们人类来说，衣着是展示个性、风格和美的少数方式之一。"
  npc_override_prt_in_prontera_i_bet_first_time_you_d83592: "我打赌你第一次看到这座雕像时，一定在想：'^3355FF哦，马上那个肌肉男不错^000000。'"
  npc_override_prt_in_prontera_i_cannot_make_my_ultra_d1553b: "我无法用普通食材制作我的超赞菜单，因为它们是超级特别的！"
  npc_override_prt_in_prontera_i_don_t_enough_time_2b6d17: "我现在没有足够的时间给你染衣服。我有太多订单还在等着完成。"
  npc_override_prt_in_prontera_i_don_t_even_know_33aa58: "我也不知道你是不是不喜欢听命于人，如果是那样的话，你为什么不自己建个公会呢？"
  npc_override_prt_in_prontera_i_don_t_really_any_036a07: "在和帅哥搭话方面我没什么好的建议，但我可以分享一些我了解的战斗技能。"
  npc_override_prt_in_prontera_i_dunno_if_you_ll_3cc1da: "不知道你信不信，但我在^000077下水道^000000里看到了最奇怪的东西……"
  npc_override_prt_in_prontera_i_guess_means_37f52d: "我想这意味着"
  npc_override_prt_in_prontera_i_guess_you_get_away_2298a7: "我想当你恰好是一国之君的时候，很多事情都可以为所欲为吧。"
  npc_override_prt_in_prontera_i_had_pass_forest_way_d3a9a4: "去遗迹的路上必须穿过一片森林，森林里到处都是猴子和浣熊。"
  npc_override_prt_in_prontera_i_know_i_know_a62142: "我知道，我知道……"
  npc_override_prt_in_prontera_i_know_lots_things_about_2b91be: "我对普隆德拉很了解。我看过很多美景，也探索过这城市周围的一些怪物巢穴。"
  npc_override_prt_in_prontera_i_ll_most_c96c2a: "我会成为最"
  npc_override_prt_in_prontera_i_m_gonna_such_885e1c: "我一定会成为"
  npc_override_prt_in_prontera_i_m_so_jealous_e4cfb6: "我好嫉妒！"
  npc_override_prt_in_prontera_i_m_so_sorry_69d63b: "但是……非常抱歉。"
  npc_override_prt_in_prontera_i_m_sorry_inconvenience_2ba520: "很抱歉给你带来不便，你能下次再来吗？"
  npc_override_prt_in_prontera_i_made_up_my_mind_82e4dc: "但我下定决心总有一天要成功探索这个迷宫。"
  npc_override_prt_in_prontera_i_may_appear_drunken_man_227508: "我看起来可能像个醉汉，但我可不是表面看起来那样。"
  npc_override_prt_in_prontera_i_mean_statue_totally_di_e932f4: "我是说，这座雕像和我们心目中的奥丁完全不同。我猜雕刻家太过于自由发挥了。"
  npc_override_prt_in_prontera_i_must_say_most_useful_d5fde8: "I must say, this is a most useful reference for you adventurers. When dealing with beasts, it's good to be informed and understand what you're up against."
  npc_override_prt_in_prontera_i_saw_9266fb: "我发现那是"
  npc_override_prt_in_prontera_i_t_help_you_much_6fccaa: "在像我这样迷人的女性搭话方面，我帮不了你太多，但我可以多告诉你一些战斗技能的事。"
  npc_override_prt_in_prontera_i_t_keep_my_business_f63e68: "没有我的特制菜单'咔嚓咔嚓酸'和'香喷喷yum yum'，我的生意就红火不起来……*叹气*"
  npc_override_prt_in_prontera_i_ve_been_training_rd_7a1c3d: "我在第三层训练了那么久，对那个区域了如指掌。但当我终于去了第四层……"
  npc_override_prt_in_prontera_i_ve_never_seen_thief_abcbe8: "我从没见过会发光的盗虫！天哪，就在你以为什么都见过的时候……"
  npc_override_prt_in_prontera_i_wonder_if_you_interest_cb91c5: "不知道你对派对或裙子感不感兴趣。嘿嘿嘿。最近热门的话题绝对是那些色彩缤纷、华丽绚烂的裙子。"
  npc_override_prt_in_prontera_if_you_go_1bc91b: "如果你进去的话！"
  npc_override_prt_in_prontera_if_you_like_peruse_monst_7d4dee: "If you would like to peruse monster records organized by their properties, please visit the Eastern branch of our library."
  npc_override_prt_in_prontera_if_you_master_warp_porta_6b4b01: "如果你精通了传送之阵技能，最多可以拥有4个不同的传送点。但至少有一个传送点是你通过卡普拉职员设定的存档点。"
  npc_override_prt_in_prontera_if_you_re_acolyte_wants_ac4768: "如果你想学习^6666CC加速术^000000，你需要先学会^6666CC3级治愈术^000000。"
  npc_override_prt_in_prontera_if_you_want_permanently_3a9638: "如果你想永久提升对不死系的防御力，就学习^6666CC天使之护^000000。"
  npc_override_prt_in_prontera_if_you_wish_understand_m_378159: "如果你想了解更多关于服事或牧师技能的事，随时欢迎来找我。"
  npc_override_prt_in_prontera_just_remember_hold_down_dd380e: "记住在对不死系怪物使用痊愈术或治愈术时按住^6666CCShift^000000键。确保是用来伤害怪物，而不是帮助怪物。"
  npc_override_prt_in_prontera_just_so_you_know_you_6f67a9: "提醒你一下，你不能在地下城里保存传送点。哦，别忘了，每次开启传送之阵，你必须消耗1颗^6666CC蓝色魔力矿石^000000作为催化剂。"
  npc_override_prt_in_prontera_kind_benevolent_bb6be5: "特里斯坦三世国王"
  npc_override_prt_in_prontera_king_tristram_iii_80f475: "所统治。"
  npc_override_prt_in_prontera_kingdom_79fbde: "卢恩·米德加兹王国"
  npc_override_prt_in_prontera_large_group_giant_hornet_e113a6: "是一大群巨型黄蜂！更奇怪的是，它们都受一只蜂后的控制，对她的命令言听计从。"
  npc_override_prt_in_prontera_larva_creamy_fabre_so_th_aa9128: "克瑞米的幼虫是法布雷。所以那些绿色的小虫子，其实是那些粉紫色蝴蝶小时候的样子。"
  npc_override_prt_in_prontera_later_if_you_ve_learned_43b6e4: "之后，如果你作为服事学会了^6666CC治愈术^000000，成为牧师后可以学习^6666CC暗之障壁^000000。"
  npc_override_prt_in_prontera_learning_divine_protecti_3f8197: "将天使之护学到一定等级后还能学习其他技能，比如^6666CC天使之障壁^000000和^6666CC天使之赐福^000000，Garnet可以解释这些。"
  npc_override_prt_in_prontera_life_may_gotten_little_b_85c129: "生活可能好了一点，但接到这么多订单？*呼！* 现在的年轻女士们一定很富裕，所以我的服务可能不再是奢侈品了。"
  npc_override_prt_in_prontera_magnum_break_0cc51d: "怪物猛击！"
  npc_override_prt_in_prontera_man_oh_man_68f4d6: "天哪……"
  npc_override_prt_in_prontera_maze_found_inside_forest_207dd1: "迷宫在普隆德拉北部的一个森林里。去看看森林的西北边。"
  npc_override_prt_in_prontera_menu_about_60e6c6: "关于天使之护：关于邪击术：关于缓速术：关于十字驱魔：关于光之障壁：关于光猎：关于瞬间移动：结束对话。"
  npc_override_prt_in_prontera_menu_about_c90e6e: "关于治愈术：关于痊愈术：关于加速术：关于天使之障壁：关于天使之赐福：关于霸邪之阵：关于传送之阵：结束对话"
  npc_override_prt_in_prontera_menu_crunch_4365ed: "'咔嚓咔嚓酸'？：'香喷喷yum yum'？：取消。"
  npc_override_prt_in_prontera_menu_do_3c5f78: "加油吧。：别闹了，小鬼。"
  npc_override_prt_in_prontera_menu_how_37cda3: "你怎么能进怪物巢穴？：取消"
  npc_override_prt_in_prontera_menu_how_4cbf30: "怎么去那里？：取消"
  npc_override_prt_in_prontera_menu_i_e0c99f: "我也想变强！：嗯……加油吧。"
  npc_override_prt_in_prontera_menu_talk_13e12a: "聊天：染衣：取消"
  npc_override_prt_in_prontera_menu_talk_a09878: "聊天：取消"
  npc_override_prt_in_prontera_menu_the_abec13: "迷宫？：诡异森林？：取消"
  npc_override_prt_in_prontera_mighty_odin_6920a8: "伟大的奥丁！"
  npc_override_prt_in_prontera_mmm_good_i_think_i_0760ec: "嗯，不错。我想今晚的派对之前应该能完成。"
  npc_override_prt_in_prontera_most_skills_maximum_leve_3ecb16: "大多数技能的最高等级是10级。完全精通一个技能需要很多点数，很容易让自己焦虑。你该选什么技能呢？！"
  npc_override_prt_in_prontera_msg_2e2536: "12……"
  npc_override_prt_in_prontera_msg_61ce5a: "[{0}]"
  npc_override_prt_in_prontera_msg_a51ad7: "11……"
  npc_override_prt_in_prontera_no_matter_how_hard_work_e6bde4: "不管工作多辛苦，我都不怕做。"
  npc_override_prt_in_prontera_nothing_escape_eyes_holy_123313: "没有什么能逃过圣洁的眼睛！^6666CC光猎^000000让你看到隐藏或隐形的怪物以及其他冒险者。"
  npc_override_prt_in_prontera_now_i_gotta_baaeb8: "现在我得"
  npc_override_prt_in_prontera_now_increase_agi_skill_u_45e2d0: "^6666CC加速术^000000技能可以用在你或你的朋友身上。在一段时间内你的AGI属性会增加，使你攻击更快，更容易闪避怪物的攻击。"
  npc_override_prt_in_prontera_oh_careful_your_way_ruin_12ad8b: "哦，去遗迹的路上要小心，因为有一些奇怪的植物会无缘无故地袭击路人。"
  npc_override_prt_in_prontera_oh_i_didn_t_realize_8c950d: "哦！没注意到有客人来了。有什么我能帮你的吗？"
  npc_override_prt_in_prontera_once_teleport_skill_mast_640625: "一旦精通了瞬间移动技能，你可以传送到你通过卡普拉职员设定的最新存档点。我不知道为什么会这样，但主的工作方式是神秘的。"
  npc_override_prt_in_prontera_once_you_learn_ruwach_yo_d25a1b: "一旦你学会光猎，你就能学习^6666CC瞬间移动^000000技能了。"
  npc_override_prt_in_prontera_once_you_learn_warp_port_ab0015: "一旦你学会^6666CC传送之阵^000000，传送之阵的等级将决定你能记住多少个传送目的地，也就是传送点。"
  npc_override_prt_in_prontera_once_you_reach_level_hea_119578: "当你在服事阶段学会^6666CC2级治愈术^000000后，就可以学习^6666CC痊愈术^000000，用于治疗异常状态。"
  npc_override_prt_in_prontera_one_monster_looks_just_l_72409b: "一种看起来和你已经遇到的温和弱小怪物一模一样的怪物，实际上可能凶猛异常！"
  npc_override_prt_in_prontera_one_time_i_walked_all_858540: "有一次我没用传送，直接一路走到了艾尔帕兰。到处都是怪物，相当危险！"
  npc_override_prt_in_prontera_ooh_other_branch_our_lib_e81359: "噢～！我们图书馆的另一个分馆也有很多有趣的书！如果有机会，你也许想去看看。"
  npc_override_prt_in_prontera_order_become_ready_learn_ba7881: "要学习光之障壁，你必须先完全精通^6666CC传送之阵^000000技能。"
  npc_override_prt_in_prontera_outside_safety_city_ther_1baf87: "在城市安全的区域之外，有一种粉色的小怪兽叫做^000077波利^000000。"
  npc_override_prt_in_prontera_personally_though_i_don_86f34a: "不过我个人嘛，我不认识什么公会，所以你得自己去打听。多认识些人，建立人脉，你懂的。"
  npc_override_prt_in_prontera_pickys_so_cute_when_they_2a67f0: "皮卡里小时候很可爱，但长大后就会变成那种笨拙的大嘴鸟。真可谓是尴尬的青春期啊。"
  npc_override_prt_in_prontera_pneuma_allows_you_genera_f1d9e2: "^6666CC光之障壁^000000让你生成一个屏障，阻挡一定范围内的所有远程攻击，创造一个保护你免受远处怪物攻击的区域。"
  npc_override_prt_in_prontera_priests_use_santuary_cre_62094a: "牧师使用^6666CC暗之障壁^000000创造一个区域，如果你和朋友在其中休息，可以恢复HP。"
  npc_override_prt_in_prontera_prontera_culvert_sewers_20de5a: "普隆德拉下水道已经很久没人管了。现在那个地方到处都是^000077盗虫^000000！"
  npc_override_prt_in_prontera_remember_you_must_first_1fb2da: "记住，如果你想学习缓速术，必须先学会^6666CC2级加速术^000000。"
  npc_override_prt_in_prontera_rumor_numbers_ants_been_f72b06: "据说蚂蚁的数量大幅增加，而且变得更加凶暴，所以没人愿意进那个地方了。"
  npc_override_prt_in_prontera_rumor_they_become_very_v_6f51bf: "据说它们变得非常凶暴，而且蜜蜂也在那里筑了巢，所以没人愿意进去了。"
  npc_override_prt_in_prontera_rune_midgarts_ruled_40b3de: "由仁慈善良的"
  npc_override_prt_in_prontera_s_s_my_most_precious_08cb09: "这……这是我最珍贵的梦想。"
  npc_override_prt_in_prontera_s_so_awesome_24fa1f: "太棒了！"
  npc_override_prt_in_prontera_same_dream_0c1813: "同样的梦想！"
  npc_override_prt_in_prontera_savory_yum_yum_s_basic_f495bb: "香喷喷yum yum的基本食材是在西边森林里蹦跶的蚱蜢。没错，那是有史以来最畅销的菜单。"
  npc_override_prt_in_prontera_sick_tired_killing_monst_f439e2: "已经厌倦了在野外和地下城里杀怪了？拜托……"
  npc_override_prt_in_prontera_sigh_as_more_more_people_77d5a4: "唉……随着越来越多的人来到普隆德拉，"
  npc_override_prt_in_prontera_sigh_i_am_afraid_my_6757a0: "*叹气*……恐怕我的好日子不多了。"
  npc_override_prt_in_prontera_sigh_last_guy_entered_pl_cbb7c5: "*叹气……* 上一个进去的人根本就没回来。他不听我的话，进去采草药还是什么蠢事……"
  npc_override_prt_in_prontera_signum_crusis_skill_lowe_18d6ee: "^6666CC十字驱魔^000000技能降低不死系或暗属性怪物的防御力。它范围很广，威力很强。"
  npc_override_prt_in_prontera_skill_such_life_saver_si_cc9a1e: "这个技能可以救命，因为几乎所有异常状态都可以用痊愈术治疗。记住你需要^6666CC2级治愈术^000000才能学习痊愈术。"
  npc_override_prt_in_prontera_so_i_been_contacting_sup_8b0194: "所以我一直在联系超强的冠军猎人来获取新鲜特别的食材。"
  npc_override_prt_in_prontera_so_if_there_s_something_b6de21: "所以如果地上有你想要的物品，要小心别被波利吞掉了。不过话说回来……波利其实很弱的……"
  npc_override_prt_in_prontera_so_relax_plan_ahead_so_8b45cd: "所以放轻松，提前规划，这样你就能精通你最想精通的所有技能。另外，别把技能点随便乱加。记住要明智地使用技能点。"
  npc_override_prt_in_prontera_so_we_went_there_as_9c42af: "所以我们去了那里，但一进去就困在迷宫里了。"
  npc_override_prt_in_prontera_sometimes_66a906: "但有时候……"
  npc_override_prt_in_prontera_statue_obviously_muscula_5879b4: "但这座雕像显然不够健壮，不够威严，无法公正地代表一位神！也许给他加个光环会好些？"
  npc_override_prt_in_prontera_statue_you_see_behind_me_ea5a91: "我身后的那座雕像就是伟大的奥丁。但遗憾的是，雕像一点也不像。"
  npc_override_prt_in_prontera_streets_too_crowded_thes_79e2c2: "最近街上太拥挤了。*咳嗽* 看看这些灰尘，住在首都也不全是好事。对了，需要帮忙吗？"
  npc_override_prt_in_prontera_take_care_yourself_9e1f99: "保重哦～"
  npc_override_prt_in_prontera_teleport_skill_teleports_e2f528: "^6666CC瞬间移动^000000技能会将你传送到你当前所在的野外或城市中的随机位置。瞬间移动对于快速逃跑很有用，但你最终会到哪里……是无法预测的。"
  npc_override_prt_in_prontera_there_i_saw_shimmering_l_bd23b6: "在那里，我看到了一道闪烁的光。我完全被迷住了，走过去看。那一定是某种美丽的妖精……"
  npc_override_prt_in_prontera_there_no_road_directly_l_72bdda: "没有直接通往遗迹的路。但如果你往北走，然后一直向东，就能到达。"
  npc_override_prt_in_prontera_there_s_another_monster_fe5d43: "还有一种怪物也会经历巨大的变化……皮卡里。"
  npc_override_prt_in_prontera_these_thief_bugs_seem_qu_b2e0e8: "这些盗虫似乎会迅速捡起掉在地上的物品，然后带着跑掉……它们比蟑螂还烦人！！"
  npc_override_prt_in_prontera_they_might_just_bugs_i_946999: "虽然它们只是虫子，但我觉得它们的想法很对。男人真的应该听我们女人的指挥……我们做事才靠谱！"
  npc_override_prt_in_prontera_they_said_they_could_get_d5ccf9: "他们说即使迷宫里到处都是非常强大的怪物，也能从中获得大量稀有物品。"
  npc_override_prt_in_prontera_thief_bug_63e3e7: "一只^000077盗虫^000000！"
  npc_override_prt_in_prontera_though_s_cute_appearance_ad3672: "虽然波利外表可爱，也不会主动攻击人，但波利会把掉在地上的物品吸收进身体里。"
  npc_override_prt_in_prontera_train_even_harder_3a3b88: "更加努力地训练了！"
  npc_override_prt_in_prontera_training_training_gotta_ee71bc: "训练！训练！必须不断训练！你也要变强！等我们都变强了，我们会再相见的！"
  npc_override_prt_in_prontera_using_decrease_agi_monst_7333c2: "对怪物使用^6666CC缓速术^000000会减慢它们的移动速度、攻击速度以及闪避你攻击的频率。这样你就能好好收拾它们了。"
  npc_override_prt_in_prontera_very_hard_tedious_proces_7c690f: "这是一个非常辛苦和乏味的过程，但当衣服完成时你感受到的快乐和喜悦足以弥补所有的辛劳。"
  npc_override_prt_in_prontera_warp_portal_pretty_compl_652491: "^6666CC传送之阵^000000是一个相当复杂的技能，在学习之前你需要先掌握其他技能。"
  npc_override_prt_in_prontera_we_also_mete_swift_merci_bd70c4: "我们也会对邪恶势力施以迅速而无情地惩罚。嗯，净化那些可能变成不死族的可怜灵魂也是另一项职责。"
  npc_override_prt_in_prontera_we_both_share_371233: "我们有着"
  npc_override_prt_in_prontera_we_just_circling_around_c554e6: "我们一直在原地打转，然后决定离开那里。那可真是个地狱般的迷宫。"
  npc_override_prt_in_prontera_we_keep_records_monsters_9f313c: "we keep records of monsters found in various dungeons scattered around the Rune-Midgarts Kingdom."
  npc_override_prt_in_prontera_we_priests_acolytes_only_b3f792: "我们牧师和服事不仅限于减轻同胞的痛苦……"
  npc_override_prt_in_prontera_we_really_owe_prosperity_0d045d: "我们真的要感谢他带来的卢恩·米德加兹的繁荣。他说服了人民欢迎外来者进入普隆德拉，还建立了与天津、昆仑等异国的贸易。"
  npc_override_prt_in_prontera_weather_nice_my_day_off_83b7fe: "休息日天气很好，我和家人去野餐。我们选了一个稍微僻静的地方，在那里我看到了非常有趣的东西……"
  npc_override_prt_in_prontera_welcome_prontera_948cda: "欢迎来到普隆德拉。"
  npc_override_prt_in_prontera_well_i_am_having_hard_0d950c: "嗯，我很难保持食材的充足库存。"
  npc_override_prt_in_prontera_well_i_happened_enter_pl_048a59: "嗯，我碰巧因为帮猎人运送武器或者送东西之类的进了那些地方。"
  npc_override_prt_in_prontera_well_people_like_them_pr_67bff1: "嗯，像她们那样的人可能更追求美和时尚。不过，当然，这只是我的看法。"
  npc_override_prt_in_prontera_well_s_bit_hassle_if_5de6b0: "嗯，这有点麻烦，但如果你想把某个地方设为你的传送点之一，你需要先亲自到那里。然后在命令行中输入^6666CC/memo^000000。"
  npc_override_prt_in_prontera_well_still_i_feel_taking_2cedc2: "不过，我还是觉得走风景路线是值得的。一路上有些景色相当壮观。"
  npc_override_prt_in_prontera_well_you_help_you_get_5e972c: "这个，嗯，给你，帮你变得更强。我想感谢你成为一个好榜样。"
  npc_override_prt_in_prontera_wha_130585: "啥——？"
  npc_override_prt_in_prontera_whaaaat_stupid_guy_why_a_e136ed: "真是个笨蛋。为什么会有人为了一些无聊的草药而丢掉性命呢？"
  npc_override_prt_in_prontera_what_52f3d0: "怎么……？"
  npc_override_prt_in_prontera_what_7d55f0: "你在"
  npc_override_prt_in_prontera_when_i_got_6584ab: "但当我靠得"
  npc_override_prt_in_prontera_when_teleport_mastered_y_aa0818: "精通瞬间移动后，你还可以学习^6666CC传送之阵^000000技能。如果你想了解更多关于传送之阵的事，去问Garnet吧。"
  npc_override_prt_in_prontera_when_work_give_you_great_03e822: "一旦生效，它会给你带来巨大的战斗优势。记住，你需要^6666CC3级邪击术^000000才能获得这个技能。"
  npc_override_prt_in_prontera_when_you_go_outside_pron_37688f: "从普隆德拉出去往东北方向走，你会到达宁静的遗迹。我之前去过那里，给一位牧师送东西。"
  npc_override_prt_in_prontera_when_you_learn_level_dem_fd6de3: "当你学会^6666CC3级邪击术^000000后，你就能学习^6666CC十字驱魔^000000，它可以降低不死系怪物以及暗属性怪物的防御力。"
  npc_override_prt_in_prontera_when_you_learn_level_div_61b9f7: "当你学会^6666CC3级天使之护^000000后，你就能学习^6666CC邪击术^000000技能了。"
  npc_override_prt_in_prontera_whether_s_schmoozing_mem_865cff: "不管是和异性搭讪，还是和怪物战斗，我得说，全靠^333399技能^000000。"
  npc_override_prt_in_prontera_whew_6db0e2: "呼！"
  npc_override_prt_in_prontera_wow_fde8ae: "哇……！"
  npc_override_prt_in_prontera_yeap_careful_when_you_ad_9f1dec: "好的，独自冒险时要小心哦～"
  npc_override_prt_in_prontera_yes_few_days_ago_i_29ec87: "是的。几天前，我跟着一群猎人进入了普隆德拉北部的一个神秘迷宫。"
  npc_override_prt_in_prontera_yes_yes_course_someday_i_420b2c: "是的，当然了！总有一天，我会和你一样强！等那一天到来，我希望我们能一起训练！"
  npc_override_prt_in_prontera_you_came_dye_e07622: "你也来"
  npc_override_prt_in_prontera_you_doing_here_12e3d9: "这里干什么？！"
  npc_override_prt_in_prontera_you_interested_learning_6b531e: "你有兴趣了解更多关于帮助和支援他人的事吗？"
  npc_override_prt_in_prontera_you_know_what_every_skil_258920: "但你知道吗？不是每个技能都要到10级才能精通。有些技能5级就能精通。更好的是，有些技能1级或2级就已经精通了。"
  npc_override_prt_in_prontera_you_ll_find_these_monste_871015: "You'll find that these Monster Encyclopedias are of great convenience,"
  npc_override_prt_in_prontera_you_look_different_now_g_b02db3: "你看起来不一样了。*倒吸一口气* 你变得……^993333更强了^000000。哇，太酷了！"
