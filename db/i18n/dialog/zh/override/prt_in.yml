  npc_override_prt_in_illusion_investigation_ah_i_m_really_proud_165e86: "Ah... I'm really proud of myself... but I need help... Hmm..."
  npc_override_prt_in_illusion_investigation_ah_i_really_hurt_my_8b4012: "Ah... I really hurt my pride... but I need help..."
  npc_override_prt_in_illusion_investigation_ah_i_think_should_enough_3b32a0: "Ah, I think this should be enough for today!!"
  npc_override_prt_in_illusion_investigation_ah_nice_meet_you_you_e2d90e: "Ah, nice to meet you!! Are you here today to help with the investigation??"
  npc_override_prt_in_illusion_investigation_ah_s_enough_today_s_f38220: "Ah, that's enough for today's investigation."
  npc_override_prt_in_illusion_investigation_aigoo_2fb818: "Aigoo..."
  npc_override_prt_in_illusion_investigation_also_i_thought_might_som_592021: "Also... I thought it might have something to do with the dimensional rift."
  npc_override_prt_in_illusion_investigation_also_monsters_illusion_n_fb2135: "Also, the monsters in Illusion are new monsters that have never been discovered before, and the monsters in Illusion are multiplying abnormally."
