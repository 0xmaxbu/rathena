Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_custom_louyang_xmas_rings_event_christmas_karachun_new_y_273586: "^000080圣诞节^000000、^FF0000卡拉楚恩节^000000和^008000除夕^000000！"
  npc_custom_louyang_xmas_rings_event_darn_how_could_poor_chil_b49a46: "该死……穷孩子怎么能比海洋居民更重要呢……我说错了吗？"
  npc_custom_louyang_xmas_rings_event_didn_t_you_know_santa_976e6d: "你不知道圣诞老人的帽子能揭示戒指的真正力量吗？"
  npc_custom_louyang_xmas_rings_event_errr_helloou_there_my_si_ef16e6: "呃……你好啊。我妹妹斯妮薇用信鸽给我传了消息。信被弄湿了，我除了她地址末尾的几个字母外什么都看不清……"
  npc_custom_louyang_xmas_rings_event_gimme_gifts_poor_kids_wa_205ac0: "给我 4 份给穷孩子的礼物……等等，你还没有 4 份！"
  npc_custom_louyang_xmas_rings_event_helloooou_you_know_my_br_e0efef: "你好啊！你知道我的兄弟姐妹吗？怎么会？我哥哥斯诺尔在普隆德拉可是名人！！随便问问那里的孩子都知道。"
  npc_custom_louyang_xmas_rings_event_hi_i_m_waithing_my_f98f13: "……那很让人分心。"
  npc_custom_louyang_xmas_rings_event_hi_two_my_sisters_i_c424e4: "嗨！我和我的两个姐妹正在为全部三个节日准备礼物！"
  npc_custom_louyang_xmas_rings_event_i_d_exchange_gold_magic_278ca3: "我愿意用一个金色魔法戒指换 3 个礼物盒……"
  npc_custom_louyang_xmas_rings_event_i_don_t_see_any_ae912b: "我没看到你身上有任何精美包装的礼物……"
  npc_custom_louyang_xmas_rings_event_i_ll_tell_you_secret_f5d034: "我来告诉你一个关于魔法戒指的秘密。"
  npc_custom_louyang_xmas_rings_event_i_too_need_more_gifts_82ffc1: "但我也需要 3 份礼物给我的海洋朋友……"
  npc_custom_louyang_xmas_rings_event_i_wish_i_had_more_8b5969: "真希望我能有 4 个灰色的礼物盒给当地的孩子……"
  npc_custom_louyang_xmas_rings_event_i_wish_you_find_my_e5d96f: "希望你能尽快找到我的姐妹们……她们需要帮助。"
  npc_custom_louyang_xmas_rings_event_if_you_put_both_rings_2f19f3: "如果你同时戴上两枚戒指，它们的力量会加倍。"
  npc_custom_louyang_xmas_rings_event_karachun_heh_old_pagans_e8db1b: "^FF0000卡拉楚恩节^000000？嘿……这是一个古老的异教节日。你知道，他们在新年和圣诞节出现之前就开始庆祝了。"
  npc_custom_louyang_xmas_rings_event_look_s_something_like_ya_a0abcd: "看，结尾好像有「扬」……嗯……她一定是把「阿尔·杜·博里扬」拼错了……"
  npc_custom_louyang_xmas_rings_event_my_elder_sis_her_name_52dfe3: "我大姐？她叫斯努薇。她航行去了某个绿色岛屿……她在说给海豚准备礼物什么的……"
  npc_custom_louyang_xmas_rings_event_my_sisters_say_all_gifts_e83b94: "我的姐妹们说所有的礼物都应该看起来一样。否则有些孩子可能会为了漂亮的礼物打架！"
  npc_custom_louyang_xmas_rings_event_my_younger_sis_sneewy_s_e1dab7: "我妹妹斯妮薇去了某个遥远的地方为那里的穷孩子准备礼物……我不知道在哪里。你应该问我大姐和她的信鸽。"
  npc_custom_louyang_xmas_rings_event_nice_day_56cb5d: "祝你有美好的一天！"
  npc_custom_louyang_xmas_rings_event_oh_hello_my_brother_snow_3c28d1: "哦，你好。我哥哥斯诺尔都告诉你了吗？"
  npc_custom_louyang_xmas_rings_event_oh_true_you_ve_helped_0fd0a0: "哦……真的吗？你帮助了我妹妹斯妮薇？谢谢你。"
  npc_custom_louyang_xmas_rings_event_oh_whole_marine_folk_sen_896da5: "哦……全体海洋居民向你致谢！他们太喜欢礼物了！！！"
  npc_custom_louyang_xmas_rings_event_oops_you_haven_t_got_42c652: "哎呀！！你身上没有 3 个灰色礼物盒。"
  npc_custom_louyang_xmas_rings_event_pity_i_ve_got_magic_5ca04a: "真遗憾……我有一个魔法圣诞老人戒指……我想用它换 4 个礼物盒……"
  npc_custom_louyang_xmas_rings_event_shuffle_here_you_go_d05a63: "*翻找* 给你。"
  npc_custom_louyang_xmas_rings_event_snoowy_s_sent_me_bird_7d8f0d: "斯努薇用信鸽给我传了消息。她告诉我你帮助了她……"
  npc_custom_louyang_xmas_rings_event_thaank_yoouu_magic_ring_e7f978: "谢谢！！这枚魔法戒指给你！"
  npc_custom_louyang_xmas_rings_event_thank_you_here_s_my_a0b4fa: "谢谢你！这是我的一点心意！"
  npc_custom_louyang_xmas_rings_event_thanks_again_no_children_a88e5a: "再次感谢！没有孩子会在没有礼物的情况下过节了！"
  npc_custom_louyang_xmas_rings_event_they_magic_power_only_de_4023b2: "它们的魔法力量只在 12 月 8 日到 1 月 8 日期间有效。"
  npc_custom_louyang_xmas_rings_event_way_if_you_put_different_a2ca32: "顺便说一句，如果你戴上两枚不同的戒指，你在节日期间升级会更容易！"
  npc_custom_louyang_xmas_rings_event_way_just_put_santa_s_5fdf29: "顺便说一句，戴上圣诞老人的帽子就能发现它们的真正力量。"
  npc_custom_louyang_xmas_rings_event_whole_three_holidays_wel_05e965: "全部三个节日？它们是一个接一个来的！"
  npc_custom_louyang_xmas_rings_event_you_like_me_wrap_your_7cf19b: "你想让我把你的精美礼物盒用灰色纸包起来吗？"
  npc_custom_louyang_xmas_rings_event_you_ve_got_only_gray_24adc6: "你只有灰色盒子。"
  npc_custom_louyang_xmas_rings_event_you_ve_helped_my_sis_db2cb6: "你帮助了我妹妹？真是太棒了！"
