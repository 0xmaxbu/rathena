Body:

  npc_custom_alberta_bandit_beard_al_de_baran_kafra_inc_98263e: "它在艾尔帕兰卡普拉公司的仓库区域。"
  npc_custom_alberta_bandit_beard_also_i_need_you_get_729985: "我还需要你帮我找一些制作胡须的材料。"
  npc_custom_alberta_bandit_beard_animal_skins_a4247f: "^8080FF5 张动物皮^000000"
  npc_custom_alberta_bandit_beard_arggg_i_never_get_my_edb6bf: "ARGGG!! 我的货永远送不到艾尔帕兰！"
  npc_custom_alberta_bandit_beard_as_token_my_gratitude_he_3b563e: "作为感谢，这里有一盒满满的^8080FF丝线^000000。"
  npc_custom_alberta_bandit_beard_beards_get_your_wonderfu_5e248c: "胡须！来买你精美的胡须！"
  npc_custom_alberta_bandit_beard_black_dye_stuff_055293: "^8080FF黑色染料^000000"
  npc_custom_alberta_bandit_beard_counteragent_de5b84: "^8080FF中和剂^000000"
  npc_custom_alberta_bandit_beard_don_t_get_mad_i_c01cb8: "但别生气！我可以为你做一副。"
  npc_custom_alberta_bandit_beard_elastic_band_d23811: "^8080FF橡皮筋^000000"
  npc_custom_alberta_bandit_beard_fine_way_76fd8c: "好吧，随你便！"
  npc_custom_alberta_bandit_beard_good_evening_i_am_master_f34b5c: "晚上好！我是首席裁缝师！"
  npc_custom_alberta_bandit_beard_granpa_beard_12c14d: "^8080FF爷爷胡须^000000"
  npc_custom_alberta_bandit_beard_he_hands_you_finished_be_6f00f1: "^8080FF~他将制作完成的胡须递给你~^000000"
  npc_custom_alberta_bandit_beard_hoho_so_you_want_some_8a84f9: "HoHo~ 原来你想要些胡须。"
  npc_custom_alberta_bandit_beard_i_address_where_i_get_c96e2c: "但我有收货地址。"
  npc_custom_alberta_bandit_beard_i_keep_getting_mobbed_so_2ccb9b: "我总是被一些虫子围攻。"
  npc_custom_alberta_bandit_beard_i_m_selling_df9071: "但我不会卖的。"
  npc_custom_alberta_bandit_beard_i_need_some_thread_beard_e04079: "我需要一些^8080FF丝线^000000来制作胡须。"
  npc_custom_alberta_bandit_beard_if_you_only_just_kill_78cc96: "如果你能消灭那些虫子，我就能完成送货了。"
  npc_custom_alberta_bandit_beard_kill_kill_them_already_232f14: "快！快消灭它们！！！"
  npc_custom_alberta_bandit_beard_let_s_make_you_your_1fdaa8: "让我来为你制作胡须吧！"
  npc_custom_alberta_bandit_beard_matter_fact_i_only_one_6fffdb: "事实上，我只剩最后一副了……"
  npc_custom_alberta_bandit_beard_may_warmer_months_8356a0: "这可能跟天气变暖有关。"
  npc_custom_alberta_bandit_beard_menu_here_9df616: "这是清单："
  npc_custom_alberta_bandit_beard_menu_the_16e157: "地址是：艾尔帕兰 59, 221"
  npc_custom_alberta_bandit_beard_menu_they_83968a: "它们是："
  npc_custom_alberta_bandit_beard_nice_day_56cb5d: "祝你今天愉快！"
  npc_custom_alberta_bandit_beard_now_monsters_been_doing_e654d9: "这些怪物以前不会这样的。"
  npc_custom_alberta_bandit_beard_oh_no_here_they_come_2fcc1a: "哦不！它们来了！！"
  npc_custom_alberta_bandit_beard_oh_thank_gods_95993e: "哦，感谢众神！"
  npc_custom_alberta_bandit_beard_oh_way_thread_merchant_s_21e91b: "哦对了，那个丝线商人在艾尔贝塔60和100附近……"
  npc_custom_alberta_bandit_beard_one_carat_diamond_80b22a: " 以及一颗^8080FF2克拉钻石^000000"
  npc_custom_alberta_bandit_beard_our_shipments_been_put_o_2a5575: "我们的货物在安全之前都会暂停运输。"
  npc_custom_alberta_bandit_beard_please_help_us_out_d30569: "请帮帮我们！"
  npc_custom_alberta_bandit_beard_see_you_later_d94b6f: "回头见。"
  npc_custom_alberta_bandit_beard_sorry_i_only_make_one_33103c: "抱歉，每人我只能制作一副。"
  npc_custom_alberta_bandit_beard_sorry_we_received_any_th_78450d: "抱歉，我们还没有收到任何^8080FF丝线^000000。"
  npc_custom_alberta_bandit_beard_sticky_mucus_7ad86a: "^8080FF100 个粘稠液体^000000"
  npc_custom_alberta_bandit_beard_talk_my_friend_izlude_so_a2b3c6: "去依斯鲁得岛找我的朋友拿一些^8080FF丝线^000000。"
  npc_custom_alberta_bandit_beard_thank_you_again_40fb97: "再次感谢你！"
  npc_custom_alberta_bandit_beard_thank_you_b6d490: "谢谢你！"
  npc_custom_alberta_bandit_beard_thank_you_killing_thief_1d3268: "感谢你消灭了盗虫。"
  npc_custom_alberta_bandit_beard_they_re_empty_8e6f09: "它们是空的。"
  npc_custom_alberta_bandit_beard_they_steal_all_my_suppli_732420: "它们偷走了我所有的补给和^8080FF丝线^000000。"
  npc_custom_alberta_bandit_beard_we_don_t_want_too_c28c58: "我们不需要太多胡须。对吧？"
  npc_custom_alberta_bandit_beard_well_i_give_you_my_5061dd: "嗯，我可以把胡须给你，但它们可不便宜。"
  npc_custom_alberta_bandit_beard_well_i_m_sorry_say_087a0b: "嗯，很抱歉，我的^8080FF丝线^000000已经用完了。"
  npc_custom_alberta_bandit_beard_what_am_i_cf901b: "我该怎么办？"
  npc_custom_alberta_bandit_beard_what_bearded_man_sent_yo_4462bc: "什么？一个胡须男派你来的……"
  npc_custom_alberta_bandit_beard_what_e6c7e1: "该怎么办……"
  npc_custom_alberta_bandit_beard_what_hell_i_t_make_8d1c4b: "搞什么！没有材料我怎么制作胡须！"
  npc_custom_alberta_bandit_beard_what_i_you_3d61cf: "我能为你做些什么？"
  npc_custom_alberta_bandit_beard_you_here_help_me_2a6e83: "你是来帮我的吗？"
  npc_custom_alberta_bandit_beard_you_like_beard_0720fc: "你想要一副胡须吗？"
  npc_custom_alberta_bandit_beard_you_see_him_cutting_sewi_5c43b0: "^8080FF~你看到他正在裁剪和缝制胡须~^000000"
  npc_custom_alberta_bandit_beard_you_see_we_get_our_fd98df: "你知道我们从艾尔贝塔获取^8080FF丝线^000000，但有一只怪物一直在袭击我们的商人。"
