Body:
  npc_custom_yuno_in01_THQS_ChattingNPC_ahh_welcome_fellow_treas_a6c8e8: "啊，欢迎 fellow 寻宝猎人 {0}。"
  npc_custom_yuno_in01_THQS_ChattingNPC_apparently_his_name_baph_1145b0: "显然他的名字是巴风特，他已经在普隆德拉城外的森林迷宫中游荡了相当长一段时间。"
  npc_custom_yuno_in01_THQS_ChattingNPC_did_you_hear_about_brave_8427e6: "你听说那个独自进入克雷斯特汉姆古城的勇敢的人了吗？他一定是疯了。"
  npc_custom_yuno_in01_THQS_ChattingNPC_did_you_hear_about_goat_5cd7d9: "你听说那个在树林里游荡的羊头人了吗？"
  npc_custom_yuno_in01_THQS_ChattingNPC_don_t_you_something_bett_6e80f6: "{0} 你没有更好的事情可以做吗？比如做个任务。"
  npc_custom_yuno_in01_THQS_ChattingNPC_feel_free_become_member_ea7825: "如果你愿意，随时可以成为会员。"
  npc_custom_yuno_in01_THQS_ChattingNPC_feel_free_drop_look_arou_914e7c: "随时欢迎进来参观"
  npc_custom_yuno_in01_THQS_ChattingNPC_how_may_i_help_you_cc1359: "有什么可以帮你的吗？"
  npc_custom_yuno_in01_THQS_ChattingNPC_how_you_reading_609117: "你是怎么读到这个的？？？"
  npc_custom_yuno_in01_THQS_ChattingNPC_membership_applications_7cbccc: "如需申请会员，请与基根交谈"
  npc_custom_yuno_in01_THQS_ChattingNPC_menu_well_3f8034: "嗯，除非你在读代码 :)"
  npc_custom_yuno_in01_THQS_ChattingNPC_oh_man_i_am_so_890b1e: "天哪……我受够了"
  npc_custom_yuno_in01_THQS_ChattingNPC_ok_saved_thank_you_see_f8d544: "好的，保存了。谢谢~ 再见~"
  npc_custom_yuno_in01_THQS_ChattingNPC_sorry_members_only_606b5e: "抱歉，仅限会员。"
  npc_custom_yuno_in01_THQS_ChattingNPC_trading_mr_smile_masks_c_198174: "用笑脸面具换垃圾。"
  npc_custom_yuno_in01_THQS_ChattingNPC_treasure_hunter_guild_ho_80866f: "^FF0000[ 寻宝猎人公会总部 ]^000000"
  npc_custom_yuno_in01_THQS_ChattingNPC_umm_sorry_i_m_gonna_b63646: "嗯抱歉，如果你连会员都不是，我不会浪费时间和你说！"
  npc_custom_yuno_in01_THQS_ChattingNPC_up_stairs_down_hall_1c0cc7: "上楼然后沿着走廊走。"
  npc_custom_yuno_in01_THQS_ChattingNPC_welcome_treasure_hunter_8ce2ec: "欢迎来到寻宝猎人公会。"
  npc_custom_yuno_in01_THQS_ChattingNPC_welcome_treasure_hunter_9832cd: "欢迎来到寻宝猎人公会总部。"
  npc_custom_yuno_in01_THQS_ChattingNPC_well_if_you_think_you_6365a3: "嗯，如果你觉得安全，那很好。"
  npc_custom_yuno_in01_THQS_ChattingNPC_you_ask_me_one_you_6c203e: "你向我要一个，你会发现自己轻了10磅！"
  npc_custom_yuno_in01_THQS_GuildNPC_alright_come_back_when_y_a09735: "好的，等你有空闲时间再来。"
  npc_custom_yuno_in01_THQS_GuildNPC_also_now_you_member_feel_1408dc: "另外，既然你现在是会员了，随时可以使用我们的商店。它们都在这一层。"
  npc_custom_yuno_in01_THQS_GuildNPC_congratulations_36b252: "恭喜！"
  npc_custom_yuno_in01_THQS_GuildNPC_ha_ha_ha_you_already_111c10: "哈哈哈……你已经是会员了。"
  npc_custom_yuno_in01_THQS_GuildNPC_hmmm_you_don_t_seem_8d6eda: "嗯，你似乎没有 ^FF000025,000z^000000 {0}。请有了再来。"
  npc_custom_yuno_in01_THQS_GuildNPC_i_m_sorry_only_members_7fb453: "抱歉，只有会员才能参观我们的私人商店。"
  npc_custom_yuno_in01_THQS_GuildNPC_sorry_you_must_member_tr_3bb4cd: "抱歉，如果你想接任务，你必须是寻宝猎人公会的会员。"
  npc_custom_yuno_in01_THQS_GuildNPC_umm_well_all_you_need_29db2d: "嗯……好吧，这就是你需要做的全部。哈哈哈。"
  npc_custom_yuno_in01_THQS_GuildNPC_we_also_another_shop_mem_7f80bf: "我们还有另一个仅限会员的商店，在那里我们使用叫做寻宝猎人代币的小金属钻石来兑换稀有物品。"
  npc_custom_yuno_in01_THQS_GuildNPC_welcome_guild_treasure_h_ba9106: "欢迎来到寻宝猎人公会。"
  npc_custom_yuno_in01_THQS_GuildNPC_well_if_you_t_afford_bd7a9d: "嗯，如果你连 ^FF000025,000z^000000 都付不起，你还不适合当寻宝猎人。"
  npc_custom_yuno_in01_THQS_GuildNPC_well_if_you_want_treasur_f5bd49: "嗯 {0}，如果你想成为寻宝猎人，首先你必须。"
  npc_custom_yuno_in01_THQS_GuildNPC_well_if_you_wish_take_8b19a3: "嗯 {0}，如果你想接任务，去那边房间找 fellow 寻宝猎人谈谈。"
  npc_custom_yuno_in01_THQS_GuildNPC_what_brings_you_here_som_bb1b7d: "什么风把你吹来了？有什么事要说吗？"
  npc_custom_yuno_in01_THQS_GuildNPC_yes_i_take_you_our_dea8b9: "是的 {0}，我马上就带你去我们的商店！"
  npc_custom_yuno_in01_THQS_GuildNPC_you_even_access_our_excl_cbdafd: "你甚至可以进入我们专属的私人地下城。"
  npc_custom_yuno_in01_THQS_GuildNPC_you_may_now_take_treasur_0e6532: "你现在可以随意接寻宝任务了。"
  npc_custom_yuno_in01_THQS_GuildNPC_you_well_changed_z_basic_bbdad1: "^FF00001.^000000 你将支付 ^FF000025,000z^000000 作为基础培训和会员证明的费用。"
