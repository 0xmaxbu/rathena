Body:
  npc_custom_niflheim_dead_branch_fact_i_know_secret_about_c7dbdb: "事实上，我知道一个关于这些精灵的秘密，或许能在某些方面……帮到你……"
  npc_custom_niflheim_dead_branch_get_me_one_wooden_heart_d43af1: "给我一个木质之心，我就为你制作精灵……"
  npc_custom_niflheim_dead_branch_get_me_three_logs_i_b4b03a: "给我三根原木，我就为你制作精灵……"
  npc_custom_niflheim_dead_branch_heh_careful_now_what_i_3865cb: "嘿……小心点？你死不死的我怎么会关……算了。"
  npc_custom_niflheim_dead_branch_heh_hope_you_fun_tree_29fcbf: "嘿……希望你和树精玩得开心……小心点……"
  npc_custom_niflheim_dead_branch_how_i_make_one_without_d66076: "没有^135445木质瘤结^000000我怎么做得出来？"
