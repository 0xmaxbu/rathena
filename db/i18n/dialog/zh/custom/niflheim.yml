  npc_custom_niflheim_dead_branch_kill_elder_willows_somet_c70bf2: "去杀长老柳树什么的……天哪……连树干都没有哼……真可悲。"
  npc_custom_niflheim_dead_branch_logs_body_i_need_more_65e896: "^135445原木^000000是身体……我需要更多。"
