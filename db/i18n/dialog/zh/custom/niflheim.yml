  npc_custom_niflheim_dead_branch_logs_found_off_tree_gole_ccd5e4: "^135445原木可以从树精身上获得。^000000"
  npc_custom_niflheim_dead_branch_menu_mwehehe_6b8ba9: "唔嘿嘿……我看你想控制树精对吧？好……我需要:"
  npc_custom_niflheim_dead_branch_no_spirit_you_then_go_f95555: "没有精灵给你……那就滚！"
  npc_custom_niflheim_dead_branch_trees_possess_spirits_yo_33f16d: "树木是有灵魂的你知道吗……"
  npc_custom_niflheim_dead_branch_trunk_5e811a: "^1354455根树干^000000"
  npc_custom_niflheim_dead_branch_trunks_seriously_think_w_474ebb: "^135445树干？拜托，想想木头……^000000"
  npc_custom_niflheim_dead_branch_well_let_us_see_what_6f9e4b: "好吧……让我看看你带了什么来……"
  npc_custom_niflheim_dead_branch_what_you_couldn_t_even_d30546: "什么？你连^1354455根树干^000000都找不到？"
  npc_custom_niflheim_dead_branch_wooden_gnarl_683c70: "^1354451个木质瘤结^000000"
