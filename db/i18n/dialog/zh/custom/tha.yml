Body:
  npc_custom_tha_t12_tha_statues_fine_spirits_left_9e3fea: "很好，还剩4个精灵。"
  npc_custom_tha_t12_tha_statues_go_search_nd_statue_33744a: "去搜索第2座雕像！"
  npc_custom_tha_t12_tha_statues_go_search_they_floor_175085: "去搜索，它们就在这一层。"
  npc_custom_tha_t12_tha_statues_go_search_they_t_leave_65fad2: "去搜索，它们无法离开这一层。"
  npc_custom_tha_t12_tha_statues_go_search_they_t_leave_7d71af: "去搜索，它们无法离开这一层。"
  npc_custom_tha_t12_tha_statues_good_bye_fbf3ec: "再见。"
  npc_custom_tha_t12_tha_statues_hmm_seems_throtre_allowe_34970f: "嗯，看来索特雷允许你通过了。"
  npc_custom_tha_t12_tha_statues_however_you_must_show_ho_a44b2f: "然而，你必须向其他精灵展示你的实力。"
  npc_custom_tha_t12_tha_statues_i_am_warping_you_next_d3b579: "我现在将你传送到下一层。"
  npc_custom_tha_t12_tha_statues_i_now_warp_you_steps_979a0a: "我现在将你传送到命运之阶。"
  npc_custom_tha_t12_tha_statues_keep_way_only_left_6ed089: "继续这条路，只剩1个了。"
  npc_custom_tha_t12_tha_statues_keep_way_spirits_remaini_f658e6: "继续这条路，还剩3个精灵！"
  npc_custom_tha_t12_tha_statues_keep_way_there_one_spiri_d27673: "继续这条路，还剩1个精灵。"
  npc_custom_tha_t12_tha_statues_menu_you_a10f63: "你可以在雕像背面读到:"
  npc_custom_tha_t12_tha_statues_oh_well_seems_you_don_b05bcb: "哦，看来你的石头不够。"
  npc_custom_tha_t12_tha_statues_okay_i_am_warping_you_267f0c: "好的，我现在将你传送到下一层。"
  npc_custom_tha_t12_tha_statues_okay_i_am_warping_you_64acee: "好的，我现在将你传送到下一层。"
  npc_custom_tha_t12_tha_statues_order_statues_you_find_w_507d20: "按照雕像的顺序，你将找到路。"
  npc_custom_tha_t12_tha_statues_perfect_seems_other_spir_cc58f3: "完美，看来其他精灵也允许你通过了。"
  npc_custom_tha_t12_tha_statues_perfect_spirit_left_997c94: "完美，还剩1个精灵。"
  npc_custom_tha_t12_tha_statues_sorry_go_back_talk_dox_93ece0: "抱歉，回去和多克斯谈谈。"
  npc_custom_tha_t12_tha_statues_sorry_go_back_talk_hox_d5cb82: "抱歉，回去和霍克斯谈谈。"
  npc_custom_tha_t12_tha_statues_sorry_go_back_talk_nox_0b903d: "抱歉，回去和诺克斯谈谈。"
  npc_custom_tha_t12_tha_statues_sorry_go_back_talk_vox_3f6035: "抱歉，回去和沃克斯谈谈。"
  npc_custom_tha_t12_tha_statues_sorry_you_must_start_ove_92bb34: "抱歉，你必须从头开始。"
  npc_custom_tha_t12_tha_statues_spirit_olds_walls_closed_bc4005: "'以古老精灵之名，墙壁已封闭。"
  npc_custom_tha_t12_tha_statues_thanatos_d22855: "……塔那托斯。'"
  npc_custom_tha_t12_tha_statues_upper_floors_foreign_tab_1961d2: "上层禁止外人进入。"
  npc_custom_tha_t12_tha_statues_we_e398ee: "我们是3个。"
  npc_custom_tha_t12_tha_statues_well_then_you_my_blessin_eb1e4d: "那么我祝福你了，还剩2个精灵。"
  npc_custom_tha_t12_tha_statues_which_perhaps_day_bring_c640de: "或许有一天你会来到我身边。"
  npc_custom_tha_t12_tha_statues_you_did_follow_good_orde_a0c724: "你没有按照正确的顺序，从头再来。"
  npc_custom_tha_t12_tha_statues_you_give_me_red_magic_aff2ee: "你必须给我红色魔法石、黄色魔法石、蓝色魔法石和绿色魔法石。"
  npc_custom_tha_t12_tha_statues_you_good_way_spirits_rem_eace21: "你走对了，还剩2个精灵！"
  npc_custom_tha_t12_tha_statues_you_got_my_authorization_d1064a: "你获得了前往下一层的许可。"
  npc_custom_tha_t12_tha_statues_you_just_passed_test_suc_5fd8c6: "你刚刚成功通过了测试。"
  npc_custom_tha_t12_tha_statues_you_must_find_nd_statue_71f8e3: "你现在必须找到第2座雕像。"
  npc_custom_tha_t12_tha_statues_you_must_find_other_spir_955295: "你现在必须找到其他精灵。"
  npc_custom_tha_t12_tha_statues_you_must_talk_spirit_st_aec4c8: "你必须先和第1座雕像中的精灵交谈。"
  npc_custom_tha_t12_tha_statues_you_seems_lost_go_back_734d88: "你似乎迷路了，回去和梅尔科尔谈谈。"
  npc_custom_tha_t12_tha_statues_you_seems_lost_go_back_853b41: "你似乎迷路了，回去和索特雷谈谈。"
