Body:
  npc_custom_gonryun_may_hats_bills_birds_df21e8: "310 鸟之账单。"
  npc_custom_gonryun_may_hats_bingo_many_people_afraid_ec707d: "宾果！很多人害怕狮子……以至于哑口无言……"
  npc_custom_gonryun_may_hats_clown_noses_ab7c8d: "3 小丑鼻子，"
  npc_custom_gonryun_may_hats_fancy_flowers_3b1e15: "3 精美花朵，"
  npc_custom_gonryun_may_hats_feathers_birds_cdc1c0: "920 鸟之羽毛和"
  npc_custom_gonryun_may_hats_fig_leaves_755c18: "180 无花果叶和"
  npc_custom_gonryun_may_hats_fits_merchant_class_only_005753: "仅适合商人职业。"
  npc_custom_gonryun_may_hats_flower_rings_f1447b: "2 花之戒指和"
  npc_custom_gonryun_may_hats_guess_isn_t_so_plain_0f4f45: "猜它看起来并不那么简单……嗯。"
  npc_custom_gonryun_may_hats_i_make_some_items_you_c4409e: "我可以为你制作一些物品。"
  npc_custom_gonryun_may_hats_i_wish_i_sold_filthy_668c83: "我希望我能快点卖掉这件肮脏的披风……"
  npc_custom_gonryun_may_hats_manteau_93314c: "2 披风[1]和"
  npc_custom_gonryun_may_hats_menu_for_05b53a: "做帽子我需要:"
  npc_custom_gonryun_may_hats_menu_i_4585d4: "我几乎免费给你:"
  npc_custom_gonryun_may_hats_menu_now_4c8b5d: "现在我的库存里全是那些包……所以我会用3朵花和一块粗糙的布料来做:"
  npc_custom_gonryun_may_hats_menu_well_a44d6f: "嗯……我们用一些普通物品来制作:"
  npc_custom_gonryun_may_hats_oh_s_excellent_item_any_8c5368: "哦……这对任何野兽猎人来说都是一件极好的物品。"
  npc_custom_gonryun_may_hats_old_manteaus_f67f86: "10 旧披风，"
  npc_custom_gonryun_may_hats_orange_dyestuffs_470b17: "1 橙色染料，"
  npc_custom_gonryun_may_hats_pirate_bandanas_6030ea: "3 海盗头巾。"
  npc_custom_gonryun_may_hats_ragamuffin_manteau_54941c: "1 流浪者披风。"
  npc_custom_gonryun_may_hats_romantic_flowers_729d48: "3 浪漫之花，"
  npc_custom_gonryun_may_hats_s_fresh_style_accessory_2cc948: "这是新鲜的风格！饰品和包合二为一！你会获得+2力量……和那个破旧的巢穴不一样！"
  npc_custom_gonryun_may_hats_scarlet_dyestuffs_66d2ed: "1 猩红染料，"
  npc_custom_gonryun_may_hats_skull_rings_2425b5: "3 骷髅戒指，"
  npc_custom_gonryun_may_hats_solid_peaches_5433f5: "20 实心桃子。"
  npc_custom_gonryun_may_hats_sombrero_2b2989: "1 宽边帽，"
  npc_custom_gonryun_may_hats_stop_posts_8dccd7: "2 停止柱，"
  npc_custom_gonryun_may_hats_thank_you_very_very_much_bf3779: "非常非常感谢！"
  npc_custom_gonryun_may_hats_they_quite_rare_nowadays_fe1e18: "它们现在相当稀有……"
  npc_custom_gonryun_may_hats_tiger_mask_40ce2a: "1 老虎面具，"
  npc_custom_gonryun_may_hats_tiger_panties_486eb0: "300 老虎内裤。"
  npc_custom_gonryun_may_hats_tiger_s_footskins_208bfb: "10 老虎脚皮，"
  npc_custom_gonryun_may_hats_tiger_skins_4b5adf: "30 老虎皮和"
  npc_custom_gonryun_may_hats_well_well_well_sign_fits_d30fa2: "嗯，嗯，嗯……这个标志适合任何达到一定等级的职业！"
  npc_custom_gonryun_may_hats_you_all_items_b8b605: "你有所有物品吗？"
  npc_custom_gonryun_may_hats_you_lack_items_please_ge_53b398: "你缺少物品。请把所有物品都拿来。"
  npc_custom_gonryun_may_hats_your_foes_d_dazzled_54ae32: "你的敌人会眼花缭乱！"
