Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_custom_geffen_elvenear_ah_elven_ears_quest_35cf8c: "啊，^61B031精灵的耳朵^000000任务！"
  npc_custom_geffen_elvenear_animal_skin_3af867: "和 ^362ED620 张动物皮^000000"
  npc_custom_geffen_elvenear_aw_what_shame_11b37b: "啊，真可惜"
  npc_custom_geffen_elvenear_elder_pixie_mustaches_ab2173: "^362ED620 个长老精灵的胡子^000000"
  npc_custom_geffen_elvenear_give_me_second_0f27ca: "给我一点时间……"
  npc_custom_geffen_elvenear_giving_up_already_dc47e1: "这么快就放弃了？"
  npc_custom_geffen_elvenear_good_good_let_me_just_045001: "好好好，让我检查一下"
  npc_custom_geffen_elvenear_hi_today_s_quest_fb0bb3: "嗨，今天的任务是……"
  npc_custom_geffen_elvenear_kitty_band_dba7eb: "^362ED61 猫猫发带^000000"
  npc_custom_geffen_elvenear_maybe_another_time_e2bdb8: "也许改天？"
  npc_custom_geffen_elvenear_menu_ok_fd6b75: "好的，你只需要收集:"
  npc_custom_geffen_elvenear_oh_well_maybe_you_partic_f80b1f: "哦，好吧，也许你会参加明天的任务。"
  npc_custom_geffen_elvenear_ok_done_2a8877: "我真的应该从你那里收到这个吗？……"
  npc_custom_geffen_elvenear_please_come_back_another_6a1c6f: "请下次再来吧……"
  npc_custom_geffen_elvenear_when_you_done_bring_item_808e93: "当你完成后，把物品带给我。好了，祝你好运找到那些物品。"
  npc_custom_geffen_elvenear_you_don_t_requirements_175446: "你不满足要求。"
  npc_custom_geffen_kahohorn_enjoy_being_god_midgard_ac2117: "享受作为米德加尔特之神吧！"
  npc_custom_geffen_kahohorn_finally_i_ve_worked_hard_1e32d5: "终于，我费尽心血，用上面提到的所有物品为我的主人制作了这对角……"
  npc_custom_geffen_kahohorn_i_also_forgot_mention_th_a8d3a4: "我还忘了提这些……"
  npc_custom_geffen_kahohorn_i_m_big_fan_dolls_c169ed: "我超喜欢玩偶，所以你得给我带这些可爱的小家伙来！"
  npc_custom_geffen_kahohorn_i_t_afford_make_if_dd7645: "如果你不把所有材料都带来，我可做不起这个。请理解，这是为了造福像你这样的英雄！"
  npc_custom_geffen_kahohorn_i_worked_myself_death_tr_f51391: "为了满足卡霍大人对头饰的离谱期待，我差点把自己累死！"
  npc_custom_geffen_kahohorn_if_you_succeed_getting_t_05a88f: "如果你成功弄到这些物品，你将获得不可思议的力量！"
  npc_custom_geffen_kahohorn_menu_sure_91470a: "当然！:这些要求也太离谱了！"
  npc_custom_geffen_kahohorn_menu_you_0f3c32: "你需要以下物品来获得卡霍之角:"
  npc_custom_geffen_kahohorn_now_i_ve_finally_found_641b5f: "既然我终于找到了完美头饰的配方，我愿意分享我的时间和才华。"
  npc_custom_geffen_kahohorn_oh_yeah_9dde5f: "哦对……"
  npc_custom_geffen_kahohorn_please_include_million_z_f5bd9d: "请包括 ^0055FF500万 Zeny^000000 作为我的辛劳费。"
  npc_custom_geffen_kahohorn_we_re_done_yet_sweetie_49ae0e: "还没完呢，亲爱的……"
  npc_custom_geffen_kahohorn_what_i_had_go_through_5a986b: "我所经历的那些才叫离谱……"
  npc_custom_geffen_kahohorn_wow_you_brave_indeed_b0a2bf: "哇！你真是勇敢！"
  npc_custom_geffen_kahohorn_x_695c35: "1 个 ^0055FF{0}^000000"
  npc_custom_geffen_kahohorn_x_d05fb7: "1 个 ^0055FF{0}^000000（来自 {1}）"
  npc_custom_geffen_kahohorn_x_emperium_6d4a4d: "3 个 ^0055FF 华丽金属^000000"
  npc_custom_geffen_kahohorn_you_ready_me_make_specia_5481f9: "你准备好让我制作这件特殊物品了吗？"
