  npc_custom_yuno_in01_THQS_QuestNPC_quest_you_get_see_some_32006e: "在这个任务中你会看到一些行动。"
  npc_custom_yuno_in01_THQS_QuestNPC_quest_you_need_deliver_m_8df2dd: "在这个任务中你需要把一个神秘盒子送给 ^FF0000艾尔帕兰和朱诺之间桥上的弗兰克^000000。"
  npc_custom_yuno_in01_THQS_QuestNPC_recently_there_accident_ff2293: "最近在废矿发生了一起事故。出现了一个巨大的裂缝，释放了一些亡灵邪恶德鲁伊。"
  npc_custom_yuno_in01_THQS_QuestNPC_rumor_goat_man_lurking_h_381aa8: "有传言说一个羊头人在隐藏神殿里出没，隐藏神殿里还有一个名叫扎克的人需要你的帮助来对付这个被称为巴风特的羊头人。"
  npc_custom_yuno_in01_THQS_QuestNPC_sad_widow_709eae: "^FF0000悲伤的寡妇^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_savage_land_311b03: "^FF0000蛮荒之地^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_shame_you_867abe: "真为你感到羞耻。"
  npc_custom_yuno_in01_THQS_QuestNPC_smelly_box_c19760: "^FF0000臭盒子^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_so_friendly_ghost_895d10: "^FF0000不太友好的幽灵^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_so_many_packages_so_litt_b3c23b: "包裹这么多，时间这么少。"
  npc_custom_yuno_in01_THQS_QuestNPC_sohee_s_everywhere_d75d7b: "^FF0000苏姬到处都是！^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_someone_prontera_guild_h_3dc688: "^FF0000普隆德拉公会大厅^000000 里有人要求见我们的一位成员，他的名字叫佐霍尔。"
  npc_custom_yuno_in01_THQS_QuestNPC_something_scary_1e764a: "可怕的东西！"
  npc_custom_yuno_in01_THQS_QuestNPC_sound_gross_some_good_ot_7cace3: "对某些人来说听起来很恶心，对其他人来说很好。"
  npc_custom_yuno_in01_THQS_QuestNPC_sounds_like_another_one_93fc19: "这听起来像是又一个傻女孩的任务……"
  npc_custom_yuno_in01_THQS_QuestNPC_speak_little_school_girl_ec357e: "去斐扬找那个女学生谈谈。"
  npc_custom_yuno_in01_THQS_QuestNPC_special_delivery_886386: "^FF0000特别快递^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_standard_delivery_quest_cd9c9c: "标准快递任务。"
  npc_custom_yuno_in01_THQS_QuestNPC_standard_drop_off_quest_2a5188: "标准投递任务。"
  npc_custom_yuno_in01_THQS_QuestNPC_strange_letter_104cb5: "^FF0000奇怪的信^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_strange_man_came_here_ye_c5b34d: "昨天有个奇怪的人进来，要求我把这封 ^FF0000奇怪的信^000000 送到梦罗克的一个女人那里。了解我们的人都不会问问题，所以你必须负责这次投递。"
  npc_custom_yuno_in01_THQS_QuestNPC_strange_man_marsh_need_y_8ed1d5: "沼泽里的奇怪人需要你的帮助。"
  npc_custom_yuno_in01_THQS_QuestNPC_strange_quest_i_know_lit_2f60c2: "这是个奇怪的任务，我了解不多。"
  npc_custom_yuno_in01_THQS_QuestNPC_strange_thing_about_what_f65ba9: "奇怪的是，里面的孩子们似乎并没有死于火焰。"
  npc_custom_yuno_in01_THQS_QuestNPC_t_say_no_some_good_a0bf95: "好喝的苹果汁谁能拒绝呢。"
  npc_custom_yuno_in01_THQS_QuestNPC_take_archer_archer_villa_4fa310: "把这个送到斐扬外的弓箭手村，给一个弓箭手。"
  npc_custom_yuno_in01_THQS_QuestNPC_take_box_man_alberta_nam_99583a: "把这个盒子送到艾尔贝塔，给一个名叫查尔斯的人。"
  npc_custom_yuno_in01_THQS_QuestNPC_take_box_open_little_gir_3bd2c4: "拿着这个盒子，不要打开！送到姜饼城一个叫奇拉奇的小女孩那里，她应该在圣诞老人附近。"
  npc_custom_yuno_in01_THQS_QuestNPC_take_package_man_morocc_081d6e: "把这个包裹送到梦罗克，给一个名叫凯尔的人。"
  npc_custom_yuno_in01_THQS_QuestNPC_talk_man_outside_entranc_470b9d: "去金字塔入口外面跟一个人谈谈，他似乎有另一个任务给你。"
  npc_custom_yuno_in01_THQS_QuestNPC_talk_man_outside_hidden_b1bdd2: "去'隐藏'猎人公会外面跟一个人谈谈，他需要你的帮助。"
  npc_custom_yuno_in01_THQS_QuestNPC_thats_sad_you_don_t_64350a: "真可惜，你连 ^FF00002500z^000000 都没有。"
  npc_custom_yuno_in01_THQS_QuestNPC_there_been_farmer_keeps_b29b71: "有个农民一直被他地里的 ^FF0000盗虫、波利和疯兔^000000 吃掉所有庄稼，这是我要你做的事。他在普隆德拉东面等着。"
  npc_custom_yuno_in01_THQS_QuestNPC_there_little_girl_troubl_1f12c2: "有个小女孩遇到麻烦了，她的名字叫黛西，她在 ^FF0000普隆德拉喷泉东面^000000。"
  npc_custom_yuno_in01_THQS_QuestNPC_there_little_girl_up_pro_b54b38: "普隆德拉广场喷泉北面有个小女孩，去跟她谈谈。"
  npc_custom_yuno_in01_THQS_QuestNPC_there_nothing_written_bo_6fa3ca: "这个盒子上除了一个要求把它送给一个叫克里格的人的便条外，什么都没写。"
  npc_custom_yuno_in01_THQS_QuestNPC_there_old_widow_prontera_874cfb: "普隆德拉有一位老寡妇，她最近因为怪物袭击失去了丈夫。她要求一位公会成员去普隆德拉墓地跟她谈谈。"
  npc_custom_yuno_in01_THQS_QuestNPC_there_strange_man_forest_0cc90b: "普隆德拉 ^FF0000南1西1^000000 的森林里有个奇怪的人，他需要你的帮助。"
  npc_custom_yuno_in01_THQS_QuestNPC_there_woman_payon_desper_a107f3: "斐扬有个女人急需帮助。"
  npc_custom_yuno_in01_THQS_QuestNPC_there_woman_payon_named_26268c: "斐扬有个叫莫莉的女人，请尽快赶到她那里，她寄来的信听起来像是有人要杀她。"
  npc_custom_yuno_in01_THQS_QuestNPC_thinking_first_43d3c2: "^FF0000三思而后行^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_tony_tiger_crack_destroy_023658: "老虎托尼嗑了药，正在摧毁森林。"
  npc_custom_yuno_in01_THQS_QuestNPC_trouble_coal_mine_47dc7f: "^FF0000废矿的麻烦^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_undead_invaded_payon_cav_082002: "亡灵已经侵占了斐扬洞穴！"
  npc_custom_yuno_in01_THQS_QuestNPC_wander_man_1f0ae9: "^FF0000流浪者^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_we_believe_ruins_underne_f22938: "我们相信是吉芬地下的废墟造成了这个问题，去找吉芬塔里的一个名叫祖祖的巫师，他会给你任务。"
  npc_custom_yuno_in01_THQS_QuestNPC_welcome_treasure_hunters_7dc28e: "欢迎来到宝藏猎人公会，{0}。"
  npc_custom_yuno_in01_THQS_QuestNPC_well_i_don_t_know_041069: "嗯，我对这个不太了解，它跟斐扬洞穴最深处有关，我们不太了解是因为似乎从来没有人活着回来。"
  npc_custom_yuno_in01_THQS_QuestNPC_well_most_what_we_run_3d8e6b: "嗯，我们大部分工作就是跑腿送包裹，这和其他没什么不同。"
  npc_custom_yuno_in01_THQS_QuestNPC_well_no_one_ever_said_af9f2e: "嗯，没人说过卡斯帕在幕后是个好人。"
  npc_custom_yuno_in01_THQS_QuestNPC_well_there_been_reports_cd91b3: "嗯，有报告称一只黄金盗虫在下水道底层出没。去找下水道里的一个骑士谈谈。"
  npc_custom_yuno_in01_THQS_QuestNPC_well_what_we_know_about_53b360: "嗯，关于斐扬我们所知道的是，不久前发生了一场怪火，烧毁了旧学校。"
  npc_custom_yuno_in01_THQS_QuestNPC_well_yah_box_delivering_184042: "嗯，是啊，送盒子需求量很大，懒人太多了。"
  npc_custom_yuno_in01_THQS_QuestNPC_wife_came_asking_us_find_e11d4f: "有个妻子进来要求我们找她的丈夫，她似乎经常来要求我们一遍又一遍地找他。"
  npc_custom_yuno_in01_THQS_QuestNPC_wizard_rd_floor_geffen_t_41bf57: "吉芬塔3楼有个巫师想跟你谈谈这座城市地下古代废墟的事。"
  npc_custom_yuno_in01_THQS_QuestNPC_woman_located_morocc_her_ce3c12: "那个女人位于梦罗克，她的名字叫艾丽卡。"
  npc_custom_yuno_in01_THQS_QuestNPC_you_currently_treasure_t_4436fe: "你目前有 ^FF0000{0}^000000 个宝藏代币！！！"
  npc_custom_yuno_in01_THQS_QuestNPC_you_ever_been_hell_3a77b5: "你去过地狱吗？"
  npc_custom_yuno_in01_THQS_QuestNPC_you_like_me_assign_you_8ad258: "你想让我给你分配一个任务吗？"
  npc_custom_yuno_in01_THQS_QuestNPC_zed_wizard_requested_try_e6de63: "巫师泽德要求试用一根新的未命名法杖原型。你的工作就是把它送给他。泽德通常待在朱诺附近。"
  npc_custom_yuno_in01_THQS_QuestNPC_zombie_attack_651b07: "^FF0000僵尸袭击^000000"
