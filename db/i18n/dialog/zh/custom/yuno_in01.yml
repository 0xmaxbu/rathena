  npc_custom_yuno_in01_THQS_QuestNPC_msg_c07eb5: "^FF0000********^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_msg_f44217: "^FF0000****^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_my_lost_beeds_12ff01: "^FF0000我丢失的珠子^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_mystic_wizard_a55b09: "^FF0000神秘巫师^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_oh_god_please_get_out_bd8720: "天哪，快把这个东西弄走。"
  npc_custom_yuno_in01_THQS_QuestNPC_oh_great_i_smell_stupidi_c337bd: "哦，真棒，我闻到了愚蠢的气息……"
  npc_custom_yuno_in01_THQS_QuestNPC_oh_man_smells_like_someo_0f360b: "天哪，闻起来像有人死在这里了。把这个送到吉芬的魔法学校，快点，啊，这味道熏得我眼睛疼！！！"
  npc_custom_yuno_in01_THQS_QuestNPC_ok_go_east_bash_those_6a7656: "好吧，去东边把那些小混蛋揍个稀巴烂，就像没有明天一样。完成那份名单后你就可以扔掉它，但你不会再得到另一份了！"
  npc_custom_yuno_in01_THQS_QuestNPC_ok_lets_see_what_quest_052c53: "好吧，让我看看今天能给你什么任务。"
  npc_custom_yuno_in01_THQS_QuestNPC_ok_you_couple_quests_don_c0ad62: "好吧，你这里有几个可以做的任务。"
  npc_custom_yuno_in01_THQS_QuestNPC_package_delivery_c1ecb3: "^FF0000包裹快递^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_package_morocc_5a7686: "送往梦罗克的包裹"
  npc_custom_yuno_in01_THQS_QuestNPC_package_thieves_fa6a18: "^FF0000给盗贼的包裹^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_payon_cave_65b940: "^FF0000斐扬洞穴^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_phreeoni_aa3309: "^FF0000菲欧尼^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_prontera_culvert_c4d96a: "^FF0000普隆德拉地下水道^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_prontera_culvert_never_b_b2cc0c: "普隆德拉地下水道已经不再是以前的样子了……"
  npc_custom_yuno_in01_THQS_QuestNPC_prontera_culvert_out_con_f9a369: "^FF0000普隆德拉地下水道^000000 已经失控了！报名成为志愿者来清理一些下水道吧。"
  npc_custom_yuno_in01_THQS_QuestNPC_proto_type_staff_must_de_5dbe89: "必须将一根法杖原型送到巫师泽德手中。"
  npc_custom_yuno_in01_THQS_QuestNPC_pyramid_s_b667e1: "^FF0000金字塔^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_pyramid_s_part_317d88: "^FF0000金字塔 第二部分^000000"
