Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_custom_yuno_in01_THQS_ChattingNPC_ahh_welcome_fellow_treas_a6c8e8: "啊，欢迎，宝藏猎人 {0}。"
  npc_custom_yuno_in01_THQS_ChattingNPC_apparently_his_name_baph_1145b0: "据说他叫巴风特，在普隆德拉外面的森林迷宫里游荡了很长一段时间了。"
  npc_custom_yuno_in01_THQS_ChattingNPC_did_you_hear_about_brave_8427e6: "你听说那个独自进入克雷斯特汉姆的勇敢的人了吗？！他一定是疯了。"
  npc_custom_yuno_in01_THQS_ChattingNPC_did_you_hear_about_goat_5cd7d9: "你听说那个在树林里游荡的羊头人了吗？"
  npc_custom_yuno_in01_THQS_ChattingNPC_don_t_you_something_bett_6e80f6: "{0} 你就没有更好的事可做吗？比如做个任务。"
  npc_custom_yuno_in01_THQS_ChattingNPC_feel_free_become_member_ea7825: "如果你愿意，也可以成为会员。"
  npc_custom_yuno_in01_THQS_ChattingNPC_feel_free_drop_look_arou_914e7c: "随时可以进来看看"
  npc_custom_yuno_in01_THQS_ChattingNPC_how_may_i_help_you_cc1359: "我能帮你什么吗？"
  npc_custom_yuno_in01_THQS_ChattingNPC_how_you_reading_609117: "你是怎么读到的？？？"
  npc_custom_yuno_in01_THQS_ChattingNPC_membership_applications_7cbccc: "会员申请请找基根"
  npc_custom_yuno_in01_THQS_ChattingNPC_menu_well_3f8034: "好吧，除非你在读代码 :)"
  npc_custom_yuno_in01_THQS_ChattingNPC_oh_man_i_am_so_890b1e: "哦天哪……我真的受够了"
  npc_custom_yuno_in01_THQS_ChattingNPC_ok_saved_thank_you_see_f8d544: "好的，已保存。谢谢~回头见~"
  npc_custom_yuno_in01_THQS_ChattingNPC_sorry_members_only_606b5e: "抱歉，仅限会员。"
  npc_custom_yuno_in01_THQS_ChattingNPC_trading_mr_smile_masks_c_198174: "用微笑先生面具换垃圾。"
  npc_custom_yuno_in01_THQS_ChattingNPC_treasure_hunter_guild_ho_80866f: "^FF0000[ 宝藏猎人公会大厅 ]^000000"
  npc_custom_yuno_in01_THQS_ChattingNPC_umm_sorry_i_m_gonna_b63646: "嗯抱歉，如果你连会员都不是，我不打算浪费时间和你说话！"
  npc_custom_yuno_in01_THQS_ChattingNPC_up_stairs_down_hall_1c0cc7: "上楼然后沿着走廊走到底。"
  npc_custom_yuno_in01_THQS_ChattingNPC_welcome_treasure_hunter_8ce2ec: "欢迎来到宝藏猎人公会。"
  npc_custom_yuno_in01_THQS_ChattingNPC_welcome_treasure_hunter_9832cd: "欢迎来到宝藏猎人公会大厅。"
  npc_custom_yuno_in01_THQS_ChattingNPC_well_if_you_think_you_6365a3: "好吧，如果你觉得你安全的话，那很好。"
  npc_custom_yuno_in01_THQS_ChattingNPC_you_ask_me_one_you_6c203e: "你要是敢问我一个，我让你轻 10 磅！"
  npc_custom_yuno_in01_THQS_GuildNPC_alright_come_back_when_y_a09735: "好吧，等你有空闲时间了再来。"
  npc_custom_yuno_in01_THQS_GuildNPC_also_now_you_member_feel_1408dc: "既然你已经是会员了，随时可以使用我们的商店。它们都在这一层。"
  npc_custom_yuno_in01_THQS_GuildNPC_congratulations_36b252: "恭喜！"
  npc_custom_yuno_in01_THQS_GuildNPC_ha_ha_ha_you_already_111c10: "哈哈哈……你已经是会员了。"
  npc_custom_yuno_in01_THQS_GuildNPC_hmmm_you_don_t_seem_8d6eda: "嗯，你似乎没有 ^FF000025,000z^000000 {0}。凑够了再来。"
  npc_custom_yuno_in01_THQS_GuildNPC_i_m_sorry_only_members_7fb453: "抱歉，只有会员才能进入我们的私人商店。"
  npc_custom_yuno_in01_THQS_GuildNPC_sorry_you_must_member_tr_3bb4cd: "抱歉，如果你是宝藏猎人公会的会员才能接取任务。"
  npc_custom_yuno_in01_THQS_GuildNPC_umm_well_all_you_need_29db2d: "嗯……你只需要做这些。哈哈哈。"
  npc_custom_yuno_in01_THQS_GuildNPC_we_also_another_shop_mem_7f80bf: "我们还有另一家会员专用商店，使用称为宝藏猎人代币的小金属钻石来兑换稀有商品。"
  npc_custom_yuno_in01_THQS_GuildNPC_welcome_guild_treasure_h_ba9106: "欢迎来到宝藏猎人公会。"
  npc_custom_yuno_in01_THQS_GuildNPC_well_if_you_t_afford_bd7a9d: "如果你连 ^FF000025,000z^000000 都付不起，那你还不该当宝藏猎人。"
  npc_custom_yuno_in01_THQS_GuildNPC_well_if_you_want_treasur_f5bd49: "嗯 {0}，如果你想成为宝藏猎人，首先你必须……"
  npc_custom_yuno_in01_THQS_GuildNPC_well_if_you_wish_take_8b19a3: "嗯 {0}，如果你想接取任务，去另一个房间找那边的宝藏猎人同事。"
  npc_custom_yuno_in01_THQS_GuildNPC_what_brings_you_here_som_bb1b7d: "什么风把你吹来了？有什么事吗？"
  npc_custom_yuno_in01_THQS_GuildNPC_yes_i_take_you_our_dea8b9: "好的 {0}，我马上带你去我们的商店！"
  npc_custom_yuno_in01_THQS_GuildNPC_you_even_access_our_excl_cbdafd: "你甚至可以进入我们专属的私人地下城。"
  npc_custom_yuno_in01_THQS_GuildNPC_you_may_now_take_treasur_0e6532: "你现在可以按需接取宝藏狩猎任务了。"
  npc_custom_yuno_in01_THQS_GuildNPC_you_well_changed_z_basic_bbdad1: "^FF00001.^000000 你需要支付 ^FF000025,000z^000000 作为基础培训和会员证明。"
  npc_custom_yuno_in01_THQS_QuestNPC_ahh_welcome_fellow_treas_bd0071: "啊，欢迎 fellow 宝藏猎人。"
  npc_custom_yuno_in01_THQS_QuestNPC_alright_maybe_next_time_dd71df: "好吧，也许下次吧，{0}。"
  npc_custom_yuno_in01_THQS_QuestNPC_another_delivery_9dd44e: "^FF0000另一份快递^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_apparently_pyramids_begi_15ce4a: "显然金字塔开始出现亡灵活动的迹象，在金字塔外面会有一个人在等你。他没有告诉我们他的名字，但他要求你快点。"
  npc_custom_yuno_in01_THQS_QuestNPC_apple_juice_6a1754: "^FF0000苹果汁^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_aww_shoot_783ada: "^FF0000哎呀，糟了！^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_banana_juice_730e42: "^FF0000香蕉汁^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_baphomet_4daf5a: "^FF0000巴风特！^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_bee_keepers_hunny_85a4a6: "^FF0000养蜂人的蜂蜜^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_blank_box_c520cc: "^FF0000空白盒子^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_bugs_they_everywhere_6f01f7: "虫子，到处都是虫子！"
  npc_custom_yuno_in01_THQS_QuestNPC_call_hours_later_48831c: "{0} 小时后再来。"
  npc_custom_yuno_in01_THQS_QuestNPC_damn_pixies_6f4518: "^FF0000该死的小妖精！^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_dazzy_local_blond_around_3b2f1f: "吉芬当地的金发女孩黛西要求你把这些花送给她。不知道为什么有人会送花给自己……"
  npc_custom_yuno_in01_THQS_QuestNPC_deliver_box_thieves_guil_3a4756: "把这个盒子送到盗贼公会。"
  npc_custom_yuno_in01_THQS_QuestNPC_delivery_9631af: "^FF0000快递^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_easy_low_payed_quest_c32a49: "这是一个简单且报酬较低的任务。"
  npc_custom_yuno_in01_THQS_QuestNPC_easy_some_very_hard_othe_2bfbbc: "对某些人来说简单，对其他人来说很难。"
  npc_custom_yuno_in01_THQS_QuestNPC_eddga_e278eb: "^FF0000虎王^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_emperium_149cc5: "^FF0000华丽矿石^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_evil_druids_started_turn_876b12: "邪恶的德鲁伊开始把所有工人变成亡灵。我们不知道原因，但我们不想知道，请联系一个名叫鲁道夫的人，他在废矿外面。"
  npc_custom_yuno_in01_THQS_QuestNPC_evil_pirates_982466: "^FF0000邪恶海盗^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_farther_we_go_into_cave_f64132: "我们越往洞穴深处走，情况就越奇怪。"
  npc_custom_yuno_in01_THQS_QuestNPC_female_assassin_quest_yo_8efbd2: "一位女刺客有个任务要交给你，她在幽灵船外面等着。有报告称船内有邪恶的亡灵海盗出没。"
  npc_custom_yuno_in01_THQS_QuestNPC_fun_err_trouble_never_st_7c3524: "乐趣……呃……麻烦在卢恩-米德加尔特永远不会停止。"
  npc_custom_yuno_in01_THQS_QuestNPC_geffenia_f9b95a: "^FF0000吉芬尼亚^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_ghost_ship_washed_up_sho_8a80ed: "一艘幽灵船在依斯鲁得岛外的海岸上搁浅了。"
  npc_custom_yuno_in01_THQS_QuestNPC_giving_up_cost_you_z_d4d65e: "放弃将花费你 ^FF00002500z^000000。"
  npc_custom_yuno_in01_THQS_QuestNPC_golden_thief_bug_413c17: "^FF0000黄金盗虫^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_good_well_get_back_out_d339c3: "很好，那就回去继续吧。"
  npc_custom_yuno_in01_THQS_QuestNPC_guy_just_poped_into_some_662896: "这家伙某天突然掉进了一个洞里，他看起来没那么厉害，但你会大吃一惊的。去找一个名叫卡拉尔的人，他在蚂蚁地狱外面。"
  npc_custom_yuno_in01_THQS_QuestNPC_half_naked_freak_need_ar_aad4d6: "这个半裸的怪物需要一支军队才能打倒，现在这是你的工作了，祝你好运。去找一个名叫杰妮的女孩，她在蚂蚁地狱后门外面。"
  npc_custom_yuno_in01_THQS_QuestNPC_he_always_seems_around_s_d0e530: "但他似乎总是在同一个地方，所以不用怎么找，去普隆德拉西1北1的山区看看。"
  npc_custom_yuno_in01_THQS_QuestNPC_he_big_pink_you_run_9fb3d0: "他又大又粉，你见了就跑！"
  npc_custom_yuno_in01_THQS_QuestNPC_hidden_temple_he_watches_cdb665: "隐藏在神殿里，他注视着并守护着。"
  npc_custom_yuno_in01_THQS_QuestNPC_hit_list_8ee011: "^FF0000暗杀名单^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_hmmm_seems_man_named_jac_c93fbb: "嗯……看来有个叫杰克的人想和你谈谈，他在弓箭手公会屋里。"
  npc_custom_yuno_in01_THQS_QuestNPC_how_ironic_8c2964: "真讽刺。"
  npc_custom_yuno_in01_THQS_QuestNPC_i_know_much_about_quest_fe95a0: "我对这个任务了解不多。"
  npc_custom_yuno_in01_THQS_QuestNPC_i_know_seems_like_there_fd0ba3: "我知道看起来好像杀不完它们，但你杀多少都是有用处的。报名之后，在地下水道里会有一个骑士给你任务。"
  npc_custom_yuno_in01_THQS_QuestNPC_i_m_afraid_there_aren_f8294e: "恐怕目前还没有适合你的任务。"
  npc_custom_yuno_in01_THQS_QuestNPC_i_m_afraid_you_must_da3ef5: "恐怕你必须先加入公会才能接任务！"
  npc_custom_yuno_in01_THQS_QuestNPC_i_remember_when_payon_ca_dd9a1f: "我记得斐扬洞穴曾经是个安全的地方，但现在亡灵僵尸已经侵占了洞穴！请联系 ^FF0000斐扬洞穴外的芙洛拉^000000 并帮助她。"
  npc_custom_yuno_in01_THQS_QuestNPC_its_funny_cause_no_one_197ada: "真有趣，因为没人知道这些是怎么做出来的。"
  npc_custom_yuno_in01_THQS_QuestNPC_its_sad_see_someone_give_cdc515: "看到有人放弃任务真让人难过……"
  npc_custom_yuno_in01_THQS_QuestNPC_jeramiah_ordered_special_88a2ed: "杰拉迈亚在我们武器店订了一把特制短剑。你的工作是把它送到刺客神殿里的他手中。"
  npc_custom_yuno_in01_THQS_QuestNPC_jur_jeramiah_994354: "^FF0000杰拉迈亚的短剑^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_just_another_quest_possi_5a0e11: "这只是另一个可能有不错报酬的任务。"
  npc_custom_yuno_in01_THQS_QuestNPC_just_package_delivery_ru_e26693: "这只是个包裹快递任务，没什么大不了的。"
  npc_custom_yuno_in01_THQS_QuestNPC_little_children_geffen_b_e67ae7: "吉芬的小孩子们一直做着奇怪的梦。"
  npc_custom_yuno_in01_THQS_QuestNPC_little_girl_payon_wants_a715a9: "斐扬有个小女孩想和你谈谈，她的名字叫小花，真是个傻名字，哈哈哈。"
  npc_custom_yuno_in01_THQS_QuestNPC_little_girl_trouble_e34fe3: "有个小女孩遇到麻烦了。"
  npc_custom_yuno_in01_THQS_QuestNPC_look_you_only_quest_time_a506e3: "听着 {0}，你一次只能接一个任务，你应该完成它，除非你放弃了。"
  npc_custom_yuno_in01_THQS_QuestNPC_lost_old_man_6462b2: "^FF0000迷路的老人^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_man_named_lithin_wishes_cbbf36: "一个叫利辛的人想给你任务，你可以在普隆德拉北面的 ^FF0000隐藏神殿^000000 里找到他。"
  npc_custom_yuno_in01_THQS_QuestNPC_man_outside_ant_hell_req_cea118: "一个 ^FF0000蚂蚁地狱^000000 外面的人要求见你，我建议你快点去。"
  npc_custom_yuno_in01_THQS_QuestNPC_master_needs_his_bow_312022: "^FF0000大师需要他的弓^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_maya_26414e: "^FF0000蚁后^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_moonlight_flower_46a8ab: "^FF0000月夜猫^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_more_undead_action_trian_27ea7e: "这个三角区域有更多的亡灵活动！"
  npc_custom_yuno_in01_THQS_QuestNPC_msg_0ed9e5: "^FF0000**************^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_msg_133e3d: "^FF0000*****^000000"
