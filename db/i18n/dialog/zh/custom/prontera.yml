  npc_custom_prontera_umbalian_language_actually_knowledge_umbal_34ba66: "实际上这是乌巴利亚人的知识。他们以某种特殊方式与米德加尔特世界相连，我们只是还无法确认。有一种理论认为他们可能像精灵一样守护着世界树的古树。"
  npc_custom_prontera_umbalian_language_ah_i_heard_her_class_4ae723: "啊，我听说她的课就在那附近……太感谢了！这是给你的一点小意思。"
  npc_custom_prontera_umbalian_language_ah_i_see_if_she_55ab0f: "啊，我明白了，如果她正在学习那我就不打扰她了。不管怎样，谢谢。"
  npc_custom_prontera_umbalian_language_ah_you_ve_done_well_0e532b: "啊，你做得很好，把我的参考资料找回来了。这些文物包含了世界各地遗迹的信息，从岩浆地牢的燃烧地狱，到世界树隐秘森林的神秘诡异。"
  npc_custom_prontera_umbalian_language_argh_my_three_students_r_483963: "啊！我的三个学生带着我的参考资料跑了！嘿！你能帮我拿回来吗？我会好好感谢你的。"
  npc_custom_prontera_umbalian_language_castle_eh_i_don_t_04feed: "城堡啊，我可不想踏进去……就是感觉不是我该去的地方。我不喜欢那种贵族式的重要感。"
  npc_custom_prontera_umbalian_language_enough_talk_you_re_just_8a77a4: "我们位于普隆德拉中央宫殿，如果你有空的话，不妨顺道来坐坐。"
  npc_custom_prontera_umbalian_language_hello_there_something_yo_94859b: "你好，有什么事吗？"
  npc_custom_prontera_umbalian_language_hey_there_i_came_here_99c3e5: "嘿，我来普隆德拉找一个能从插槽中移除卡片的老太太。你知道我在哪里能找到她吗？"
  npc_custom_prontera_umbalian_language_heyyy_there_you_poring_e_ff9f8f: "嘿！你有一个波利蛋和配套的宠物孵化器！那是给我的吗？"
  npc_custom_prontera_umbalian_language_hi_i_came_here_prontera_e3fdc5: "嗨！我来普隆德拉找一个老太太……但是……"
  npc_custom_prontera_umbalian_language_hi_what_you_want_me_6c6d78: "嗨！你想从我这里要什么？"
  npc_custom_prontera_umbalian_language_hmm_i_dunno_why_she_09f1b4: "嗯……我不知道她为什么会在那里……我想我去看看。"
  npc_custom_prontera_umbalian_language_hmm_you_sure_about_4e00c6: "嗯……你确定吗？"
  npc_custom_prontera_umbalian_language_hrrmm_okay_cya_then_7e1285: "嗯好吧？那再见了……"
  npc_custom_prontera_umbalian_language_i_don_t_think_she_0bc08f: "我觉得她不需要去那里，她就住在普隆德拉。"
  npc_custom_prontera_umbalian_language_i_great_wise_man_juno_c42746: "而作为朱诺的伟大智者，我会教你他们的语言！"
  npc_custom_prontera_umbalian_language_i_lost_my_teacher_s_7d08cc: "我把老师的书弄丢了！我该怎么办……"
  npc_custom_prontera_umbalian_language_i_wonder_where_our_sea_010465: "不知道我们的海洋女孩玛丽在哪里？"
  npc_custom_prontera_umbalian_language_job_agency_i_don_t_46d66f: "职业中介？我不这么认为。请不要带着我在普隆德拉到处转！她已经在这里当老师了。"
  npc_custom_prontera_umbalian_language_learned_language_umbalia_4065ea: "^0000FF 学会了乌巴利亚语言！^000000"
  npc_custom_prontera_umbalian_language_mojo_should_somewhere_ne_129f47: "莫乔应该在靠近水的地方……"
  npc_custom_prontera_umbalian_language_o_wow_did_she_become_1126c0: "哦哇，她在普隆德拉变得重要了吗？我觉得她太忙了我没法去拜访。我改天再试试。"
  npc_custom_prontera_umbalian_language_oh_no_i_lost_my_d9673b: "哦不！我把老师的 ^FF0000旧魔法书^000000 弄丢了！"
  npc_custom_prontera_umbalian_language_oh_ok_thanks_anyways_03e74a: "哦……好吧……还是谢谢了。"
  npc_custom_prontera_umbalian_language_oh_pooo_sigh_b2c70a: "哦……呜……叹气……"
  npc_custom_prontera_umbalian_language_oh_wait_i_see_he_5a5fbc: "哦等等，我明白了……他想要回他的参考卷轴对吧？嗯，我还在用呢但是……如果你能给我一个波利蛋和一个孵化器我就还给他。那东西太可爱了！"
  npc_custom_prontera_umbalian_language_oh_yeah_tell_them_i_1c2641: "哦对了，告诉他们是我让你去的"
  npc_custom_prontera_umbalian_language_oh_yeah_tell_them_i_3bb3f5: "哦对了，告诉他们是我让你去的，他们的名字是玛丽、梅森和莫乔。"
  npc_custom_prontera_umbalian_language_oh_you_found_marie_amats_8323c2: "哦……你在天津城找到了玛丽。"
  npc_custom_prontera_umbalian_language_only_thing_she_d_need_132f04: "她在杂货店唯一需要的就是治疗风湿的药。她可能早就离开那里了。"
  npc_custom_prontera_umbalian_language_oooo_could_you_please_te_96b50c: "哦哦，你能告诉我她在哪里吗？我会非常感激的。"
  npc_custom_prontera_umbalian_language_so_mason_s_prontera_now_5e21b3: "那么……梅森现在在普隆德拉……好吧……"
  npc_custom_prontera_umbalian_language_what_am_i_going_those_2d02cd: "我该怎么办……那些愚蠢的巴风特……"
  npc_custom_prontera_umbalian_language_what_he_want_me_c852d5: "他想要我做什么？"
  npc_custom_prontera_umbalian_language_what_i_know_they_re_206471: "据我所知，他们在不同的城镇各自发展。"
  npc_custom_prontera_umbalian_language_where_d_mason_go_then_1e4903: "那梅森去哪了呢……"
  npc_custom_prontera_umbalian_language_why_she_need_go_there_46a99d: "她为什么要去那里？我觉得你可能搞错了。"
  npc_custom_prontera_umbalian_language_wow_i_never_knew_she_803a7d: "哇，我从来不知道她是个信教的人……我会去看看的，谢谢。"
  npc_custom_prontera_umbalian_language_yatta_here_s_lil_somethi_023675: "太好了！这是给你的小回礼。"
  npc_custom_prontera_umbalian_language_yay_i_found_her_thank_7344ff: "耶，我找到她了！非常感谢你的帮助！"
  npc_custom_prontera_umbalian_language_yay_i_love_porings_64e8d9: "耶！我喜欢波利！"
  npc_custom_prontera_umbalian_language_you_saw_mojo_aldebaran_afcd03: "你在艾尔帕兰看到莫乔了？"
  npc_custom_prontera_umbalian_language_you_speak_umbalian_fluen_c33159: "你能流利地说乌巴利亚语！所以你永远不会忘记乌巴利亚的语言！"
  npc_custom_prontera_uneasy_cemetery_alas_we_still_need_more_6623af: "唉！我们还需要 {0} 瓶圣水……你为什么不去找其他人要点额外的圣水呢？"
  npc_custom_prontera_uneasy_cemetery_calm_down_restless_cemet_cb74ef: "要让不安的墓地平静下来，我们应该用圣水浇灌所有的坟墓。但我们的兄弟姐妹们已经用完了。"
  npc_custom_prontera_uneasy_cemetery_could_you_supply_us_holy_39aaab: "你能给我们提供圣水吗？"
  npc_custom_prontera_uneasy_cemetery_due_s_help_we_ll_7b6655: "但多亏了 {0} 的帮助，我们能安稳地休息到下一个午夜！"
  npc_custom_prontera_uneasy_cemetery_i_m_afraid_old_cemetery_047cf1: "恐怕老墓地很快就要失控了……请把你能找到的所有圣水都给我们。"
  npc_custom_prontera_uneasy_cemetery_i_m_afraid_there_s_4f978f: "恐怕我们的老墓地出问题了……"
  npc_custom_prontera_uneasy_cemetery_menu_mother_096f28: "[玛萨娜修女]：以奥丁之名，请消灭这些游荡的亡灵残骸！"
  npc_custom_prontera_uneasy_cemetery_menu_mother_156da2: "[玛萨娜修女]：墓地已经变得不安了！以奥丁之名，快去圣殿！拯救普隆德拉城！"
  npc_custom_prontera_uneasy_cemetery_menu_mother_9d5a07: "[玛萨娜修女]：以奥丁之名，我们宣告美丽的 {0} 为普隆德拉的救世主！"
  npc_custom_prontera_uneasy_cemetery_menu_mother_9d87df: "[玛萨娜修女]：勇敢的 {0} 刚刚杀死了普隆德拉最后一只亡灵！"
  npc_custom_prontera_uneasy_cemetery_menu_mother_cd97d5: "[玛萨娜修女]：女士 {0} 刚刚杀死了普隆德拉最后一只亡灵！"
  npc_custom_prontera_uneasy_cemetery_menu_mother_d5f295: "[玛萨娜修女]：以奥丁之名，我们宣告英俊的 {0} 为普隆德拉的救世主！"
  npc_custom_prontera_uneasy_cemetery_name_odin_we_bless_you_16de6e: "以奥丁之名，我们祝福你，并郑重地送上一份来自马雷乌西斯酒窖的小礼物。"
  npc_custom_prontera_uneasy_cemetery_old_cemetery_going_out_c_70d2cc: "老墓地很快就要失控了……"
  npc_custom_prontera_uneasy_cemetery_our_church_going_thank_y_25a4c6: "我们的教会将亲自感谢你……"
  npc_custom_prontera_uneasy_cemetery_please_name_odin_help_pr_9b1e80: "请以奥丁之名，帮助普隆德拉城。"
