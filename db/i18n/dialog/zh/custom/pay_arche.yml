  npc_custom_pay_arche_THQS_Quests_take_you_these_treasure_08e3b1: "带上这 2 个宝藏代币。"
  npc_custom_pay_arche_THQS_Quests_thank_god_0f2e09: "谢天谢地！"
  npc_custom_pay_arche_THQS_Quests_thank_you_184eb6: "谢谢你！"
  npc_custom_pay_arche_THQS_Quests_thank_you_delivery_fbd6fe: "感谢你送来的货物。"
  npc_custom_pay_arche_THQS_Quests_thank_you_delivery_sorry_9f77fa: "感谢你送来的货物。抱歉有味道，这是一盒蟾蜍舌头。"
  npc_custom_pay_arche_THQS_Quests_thank_you_helping_me_166f79: "感谢你的帮助。"
  npc_custom_pay_arche_THQS_Quests_thank_you_helping_me_i_aa3971: "感谢你的帮助，我猜情况已经最糟了。"
  npc_custom_pay_arche_THQS_Quests_thank_you_so_much_093766: "太感谢你了！"
  npc_custom_pay_arche_THQS_Quests_thank_you_so_much_here_d8456b: "太感谢你了，给你这 3 个公会代币作为奖励。"
  npc_custom_pay_arche_THQS_Quests_thank_you_sooo_much_here_9fc28f: "太感谢你了，给你这 3 个宝藏代币。"
  npc_custom_pay_arche_THQS_Quests_thanks_97cba4: "谢谢"
  npc_custom_pay_arche_THQS_Quests_thanks_these_treasure_to_565d85: "谢谢，给你这 4 个宝藏代币。"
  npc_custom_pay_arche_THQS_Quests_there_also_these_new_mon_3077f2: "还有一些不知从哪里冒出来的新怪物，我们称之为火焰混蛋……如果你还不够强大，千万要小心，它们非常强。"
  npc_custom_pay_arche_THQS_Quests_there_seem_more_ghosts_d_f2d0cf: "下面的鬼魂似乎一天比一天多。我要你下去找到那些我们称为梦魇的怪物。"
