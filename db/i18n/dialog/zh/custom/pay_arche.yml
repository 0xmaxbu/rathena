  npc_custom_pay_arche_THQS_Quests_well_there_been_reports_718f65: "嗯，有报告说地下水道底部有一只黄金盗虫在游荡。"
  npc_custom_pay_arche_THQS_Quests_well_those_bugs_bugger_o_c2961b: "嗯，那些虫子真烦人……"
