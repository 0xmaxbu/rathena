  npc_custom_pay_arche_THQS_Quests_well_what_i_want_you_b72bdb: "嗯，我要你带 50 个灯笼作为你清理了一些它们的证据，你在那里找到的任何战利品除了我要求你给我的之外都可以自己留下。"
  npc_custom_pay_arche_THQS_Quests_well_where_then_a064e0: "嗯，那它在哪？"
  npc_custom_pay_arche_THQS_Quests_well_you_take_crappy_tre_51faff: "好吧，你可以拿着这个破宝藏代币。"
  npc_custom_pay_arche_THQS_Quests_weren_t_you_supposed_del_491c75: "你不是应该给我送个盒子来吗？它在哪？"
  npc_custom_pay_arche_THQS_Quests_what_i_need_you_find_9b7dfe: "我要你帮我找更多的蜂蜜，让这些蜜蜂能度过冬天。我需要大约 20 个蜂蜜。"
