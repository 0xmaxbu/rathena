  npc_custom_pay_arche_THQS_Quests_well_here_take_these_tre_9331be: "好吧，给你这 2 个宝藏代币。"
  npc_custom_pay_arche_THQS_Quests_well_i_don_t_know_ccff4e: "嗯，我对这个不太了解，这关系到斐扬洞穴的最深处。我们不太清楚，因为似乎没有人能活着回来。我们怀疑是一种叫月夜花的怪物。"
