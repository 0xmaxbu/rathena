  npc_custom_pay_arche_THQS_Quests_they_must_filled_you_wha_ad1187: "他们一定告诉了你煤矿下层正在发生的事情，我知道这很令人不安，我们还在试图弄清楚两个邪恶祭司是怎么到那里去的。"
  npc_custom_pay_arche_THQS_Quests_thinking_worse_case_here_bd26f3: "往最坏的情况想，我要报仇！"
