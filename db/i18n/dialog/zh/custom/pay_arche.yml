  npc_custom_pay_arche_THQS_Quests_what_i_want_you_kill_e85923: "我要你去杀一些吉阿斯斯。带 30 个它们的小胡子给我。"
  npc_custom_pay_arche_THQS_Quests_what_i_want_you_kinda_4f9954: "我要你稍微清理一下，每一点都有帮助。"
  npc_custom_pay_arche_THQS_Quests_what_s_you_letter_me_1b25cd: "那是什么？你有信给我！！"
