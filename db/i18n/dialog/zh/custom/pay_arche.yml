  npc_custom_pay_arche_THQS_Quests_treasure_token_dc39c1: "拿着这个宝藏代币"
  npc_custom_pay_arche_THQS_Quests_we_try_kill_him_past_732f24: "我们过去试图杀过他，但那是……嗯……那是个坏主意。我要你到那里去把他的头骨带回来作为你杀死他的证据。"
  npc_custom_pay_arche_THQS_Quests_welcome_724486: "欢迎。"
  npc_custom_pay_arche_THQS_Quests_welcome_back_good_job_yo_47106f: "欢迎回来，干得好，你做到了。（我在想那个火焰混蛋还活着吗）"
