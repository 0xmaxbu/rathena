  npc_custom_pay_arche_THQS_Quests_here_these_treasure_toke_9a9053: "给你这 4 个宝藏代币。"
  npc_custom_pay_arche_THQS_Quests_here_these_treasure_toke_b76200: "给你这 2 个宝藏代币。"
  npc_custom_pay_arche_THQS_Quests_here_treasure_hunter_tok_f80050: "拿着这个宝藏猎人代币。"
  npc_custom_pay_arche_THQS_Quests_hi_mister_person_you_get_71643a: "嗨，这位先生。你能给我买些香蕉汁吗？"
  npc_custom_pay_arche_THQS_Quests_hi_mister_person_you_get_ba8043: "嗨，这位先生。你能给我买些苹果汁吗？"
  npc_custom_pay_arche_THQS_Quests_i_desire_0e2e5d: "我需要 30 个。"
  npc_custom_pay_arche_THQS_Quests_i_had_my_doubts_thank_a59e77: "我本来有所怀疑，但感谢你的帮助。"
  npc_custom_pay_arche_THQS_Quests_i_hope_hole_go_away_42cd23: "我希望这个洞总有一天会消失，也许将来我会有另一个任务给你。"
  npc_custom_pay_arche_THQS_Quests_i_knew_you_looked_strong_c70c32: "我就知道你看起来很厉害，虽然我不知道你是怎么杀死那个怪物的。"
  npc_custom_pay_arche_THQS_Quests_i_know_may_sound_stupid_9c598d: "我知道这听起来很傻，但我从小就一直梦想着拥有一个恩佩利姆……"
  npc_custom_pay_arche_THQS_Quests_i_m_so_happy_see_b32ff6: "看到这些恩佩利姆我太高兴了！谢谢你 {0}。"
  npc_custom_pay_arche_THQS_Quests_i_want_them_472b6e: "我想要 5 个。"
  npc_custom_pay_arche_THQS_Quests_i_wonder_what_happened_m_1948fe: "不知道我的花怎么样了"
  npc_custom_pay_arche_THQS_Quests_if_you_get_me_one_8e7733: "如果你能给我弄到一个，我会奖励你的。"
  npc_custom_pay_arche_THQS_Quests_its_so_boring_when_you_b24a41: "等人真是太无聊了……"
  npc_custom_pay_arche_THQS_Quests_live_doesn_t_get_any_54d153: "我的生活不能再糟了，每天在这个满是虫子的地下水道工作……"
  npc_custom_pay_arche_THQS_Quests_love_chat_i_m_waiting_c2f3b1: "很想聊天，但我在等人。"
  npc_custom_pay_arche_THQS_Quests_management_3ca9be: "- 管理层"
  npc_custom_pay_arche_THQS_Quests_menu_oooooh_268668: "噢噢噢我太喜欢情书了 :D。现在让我打开它。"
  npc_custom_pay_arche_THQS_Quests_msg_6eae3a: "..."
  npc_custom_pay_arche_THQS_Quests_much_thanks_i_you_6acb07: "我非常感谢你。"
  npc_custom_pay_arche_THQS_Quests_much_thanks_you_i_2ff12a: "我非常感谢你。"
  npc_custom_pay_arche_THQS_Quests_must_me_you_shall_ventur_e1deec: "你必须为我做这件事。穿越金字塔。"
  npc_custom_pay_arche_THQS_Quests_my_husbands_grave_i_m_d6d446: "这是我丈夫的坟墓……我只是来探望他一下。"
  npc_custom_pay_arche_THQS_Quests_my_wife_wants_me_home_0f28b6: "我妻子要我回家？！好了，好了……我这就走，我这就走。谢谢你告诉我这个消息。"
  npc_custom_pay_arche_THQS_Quests_oh_dear_god_98b49d: "哦，天哪！！！"
  npc_custom_pay_arche_THQS_Quests_oh_hello_oh_you_my_bd0e1b: "哦你好，哦你拿了我的蜂蜜，我和我的蜜蜂们感谢你。"
  npc_custom_pay_arche_THQS_Quests_oh_thank_you_so_much_88dfae: "哦太感谢你了，但它们还会回来的……"
  npc_custom_pay_arche_THQS_Quests_oh_these_my_flower_bad_ea564e: "哦，这是我的花吗！可惜我不想要了……"
  npc_custom_pay_arche_THQS_Quests_oh_um_well_fuck_bastard_30957f: "哦……嗯……好吧，他妈的，那个混蛋以为他能把我赶出去！！！！！他等着瞧吧！"
  npc_custom_pay_arche_THQS_Quests_ohhh_thank_you_thats_goo_fb0421: "哦哦，谢谢你，这对我来说是个好的开始。"
  npc_custom_pay_arche_THQS_Quests_ok_here_whats_happening_6fff7f: "好的，情况是这样的：我不知道是什么引起的，但有一个奇怪的罗南骷髅在往东 2 张地图的树林里游荡。"
  npc_custom_pay_arche_THQS_Quests_ok_i_don_t_want_276c8c: "好吧，我不想谈这个，但我需要你帮我找 20 个射击草。"
  npc_custom_pay_arche_THQS_Quests_ok_well_my_problem_yah_8aa803: "好吧，我的问题是这样，你看到地上那个洞了吗？那东西几年前突然出现，里面全是那些丑陋的蚂蚁和叫吉阿斯斯的怪物。"
  npc_custom_pay_arche_THQS_Quests_ok_well_start_68b86a: "好吧，这是个开始。"
  npc_custom_pay_arche_THQS_Quests_ok_well_what_i_wanted_df3006: "好吧，我想让你做的是：我旁边的这个坟墓是我丈夫的，我答应过他要和他一起埋葬一些纪念品。问题是我没有纪念品……"
  npc_custom_pay_arche_THQS_Quests_ok_well_where_s_letter_ff052e: "好吧，信在哪？"
  npc_custom_pay_arche_THQS_Quests_one_those_evil_monsters_006c5b: "那些邪恶的怪物中有一只跟着你上来了，杀了它，杀了它！！！"
  npc_custom_pay_arche_THQS_Quests_people_say_baphomet_guil_465d2d: "人们说巴风特守卫着通往冥界的大门，但我不信，杀了巴风特！"
  npc_custom_pay_arche_THQS_Quests_perfect_right_time_now_i_0f5d91: "正好准时，现在我得去放置这个炸弹了……呃，我是说把这个包裹送给我妈妈当生日礼物。"
  npc_custom_pay_arche_THQS_Quests_phreeoni_pink_fluff_terr_b74f4a: "粉色毛球弗里欧尼正在恐吓小初心者们！必须阻止他，杀了他！"
  npc_custom_pay_arche_THQS_Quests_remember_i_need_nail_s_468203: "记住我需要 50 个指甲"
  npc_custom_pay_arche_THQS_Quests_rotten_bandages_i_desire_21ec4a: "我需要 30 个腐烂绷带。"
  npc_custom_pay_arche_THQS_Quests_so_where_my_package_6e63c7: "那我的包裹在哪？"
  npc_custom_pay_arche_THQS_Quests_so_where_s_my_delivery_fe79c6: "那我的货物在哪？"
  npc_custom_pay_arche_THQS_Quests_so_where_s_my_jur_7fc16a: "那我的武士刀在哪？"
  npc_custom_pay_arche_THQS_Quests_so_you_my_packages_8927f4: "所以你有我的包裹了？"
  npc_custom_pay_arche_THQS_Quests_so_your_one_come_help_172fff: "所以你就是来帮助我的人？"
  npc_custom_pay_arche_THQS_Quests_so_your_one_letter_me_df5711: "所以你就是那个给我送信的人？"
  npc_custom_pay_arche_THQS_Quests_so_your_one_supposed_bri_6e370c: "所以你就是那个应该给我送武士刀的人？"
  npc_custom_pay_arche_THQS_Quests_some_my_old_treasure_890d90: "还有一些我以前的财宝……"
  npc_custom_pay_arche_THQS_Quests_sorry_busy_a19361: "抱歉，很忙。"
  npc_custom_pay_arche_THQS_Quests_sorry_i_m_waiting_my_34328e: "抱歉，我在等我的包裹，所以不想说话。"
  npc_custom_pay_arche_THQS_Quests_sorry_i_m_waiting_someon_26c075: "抱歉，我在等一个人，你得稍后再来。"
  npc_custom_pay_arche_THQS_Quests_sorry_i_m_waiting_someon_2b7023: "抱歉，我在等一个人，你得稍后再来。"
  npc_custom_pay_arche_THQS_Quests_sorry_i_m_waiting_someon_360ff8: "抱歉，我在等一个人。你得稍后再来。"
  npc_custom_pay_arche_THQS_Quests_sorry_i_m_waiting_someon_93c54e: "抱歉，我在等一个人，你得稍后再来。"
  npc_custom_pay_arche_THQS_Quests_sorry_inform_you_you_bee_53457e: "很遗憾地通知你，你已被驱逐，请在 3-5 天内搬走。"
  npc_custom_pay_arche_THQS_Quests_sorry_t_talk_i_m_66d3ee: "抱歉不能聊天，我很忙，在等我的包裹。"
  npc_custom_pay_arche_THQS_Quests_sorry_t_talk_i_m_fce8f6: "抱歉不能聊天，我在等人。"
  npc_custom_pay_arche_THQS_Quests_strange_thing_about_what_e1cd17: "奇怪的是，里面的孩子们似乎不是死于火焰。他们已经占领了斐扬洞穴的整个 3 层。"
  npc_custom_pay_arche_THQS_Quests_take_these_treasure_toke_4a1b2e: "拿着这 2 个宝藏代币"
