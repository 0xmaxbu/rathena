Body:
  npc_custom_pay_arche_THQS_Quests_ahh_good_thank_you_your_cccb38: "啊，好的，谢谢你的时间。拿好这个宝藏代币。"
  npc_custom_pay_arche_THQS_Quests_ahh_hello_you_must_treas_93349f: "啊，你好，你一定是宝藏猎人公会来的吧。"
  npc_custom_pay_arche_THQS_Quests_ahh_you_must_treasure_hu_170640: "啊，你一定是宝藏猎人公会来的。你有我的弓吗？？"
  npc_custom_pay_arche_THQS_Quests_another_quest_you_i_e9e9ef: "我还有一个任务给你。"
  npc_custom_pay_arche_THQS_Quests_arrrg_those_bastard_bugs_4a5c95: "啊啊啊！！……那些该死的虫子把所有的东西都吃光了，这里看起来再也不像我的农场了！！"
  npc_custom_pay_arche_THQS_Quests_as_i_know_i_look_6a4f17: "我知道我看起来很老，但我一直没能找到一个。现在我从宝藏猎人公会退休了，再也没有什么刺激的事了……"
  npc_custom_pay_arche_THQS_Quests_bring_back_me_their_wrap_1decbc: "你必须把它们的包裹带回来给我。"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_daenggie_s_c1081f: "给我带回 40 只达拉蛙。"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_nine_tales_3ffed0: "给我带回 1 条九尾狐尾巴！"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_round_shel_c0cdb9: "给我带回 1 个圆形贝壳！"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_there_bone_be7f2a: "你必须把它们的骨头带回来给我。"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_tiger_s_a39294: "给我带回 1 张虎皮！"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_tongue_b9bd04: "给我带回 1 条舌头！"
  npc_custom_pay_arche_THQS_Quests_bring_me_black_hair_e82625: "给我带 20 根黑色毛发。"
  npc_custom_pay_arche_THQS_Quests_bring_me_fabrics_2e7744: "给我带 50 块布料。"
  npc_custom_pay_arche_THQS_Quests_bring_me_glass_beads_23f8cd: "给我带 10 颗玻璃珠。"
  npc_custom_pay_arche_THQS_Quests_bring_me_gold_bar_him_194421: "从他那里给我带 1 块金条。"
  npc_custom_pay_arche_THQS_Quests_bring_me_his_evil_horn_04563e: "把他的邪恶之角带给我！"
  npc_custom_pay_arche_THQS_Quests_bring_me_his_saber_as_d75874: "把他的军刀作为证据带给我！"
  npc_custom_pay_arche_THQS_Quests_bring_me_mementos_please_4bc1c3: "请给我带 15 个纪念品。"
  npc_custom_pay_arche_THQS_Quests_bring_me_worm_peelings_f709bf: "给我带 150 个虫蛹。"
  npc_custom_pay_arche_THQS_Quests_danger_coal_mine_now_hos_6e5080: "危险，煤矿现在是一个敌对区域。"
  npc_custom_pay_arche_THQS_Quests_dear_erika_894343: "亲爱的艾丽卡"
  npc_custom_pay_arche_THQS_Quests_dear_god_took_you_long_c1fe90: "天哪，你这混蛋终于来了！"
  npc_custom_pay_arche_THQS_Quests_eh_t_old_man_walk_6ce16b: "呃！老人就不能安静地散步了吗？！"
  npc_custom_pay_arche_THQS_Quests_eh_whats_cabf75: "呃？那是什么？！"
  npc_custom_pay_arche_THQS_Quests_ever_heard_monster_calle_41f310: "听说过一种叫野猪的怪物吗？它看起来像野猪，但发出的声音非常烦人。"
  npc_custom_pay_arche_THQS_Quests_fighting_mummies_future_103bfb: "与木乃伊战斗是你的未来。"
  npc_custom_pay_arche_THQS_Quests_further_into_pyramid_you_c2b344: "你必须深入金字塔。"
  npc_custom_pay_arche_THQS_Quests_get_out_my_face_you_c7071a: "从我面前滚开，你这废物。"
  npc_custom_pay_arche_THQS_Quests_good_luck_33cd1e: "祝你好运"
  npc_custom_pay_arche_THQS_Quests_good_your_here_ok_there_480a7f: "你来了就好。好的，有报告说一个叫德雷克的老船长在这艘船上出没。杀了他！"
  npc_custom_pay_arche_THQS_Quests_half_naked_freak_need_ar_42482a: "这个半裸的怪胎需要一支军队才能干掉，现在这是你的任务了，祝你好运。"
  npc_custom_pay_arche_THQS_Quests_he_told_me_he_always_926f86: "他告诉我他在下面总是被其他鬼魂欺负，我已经有一阵子没见到他了。"
  npc_custom_pay_arche_THQS_Quests_hello_0f4ebe: "你好 {0}。"
  npc_custom_pay_arche_THQS_Quests_hello_69342c: "你好！"
  npc_custom_pay_arche_THQS_Quests_hello_did_you_bring_me_3da8ba: "你好，你给我带花了吗！？！"
  npc_custom_pay_arche_THQS_Quests_hello_friend_176542: "你好，朋友"
  npc_custom_pay_arche_THQS_Quests_hello_mister_19c2b5: "你好，先生 {0}。"
  npc_custom_pay_arche_THQS_Quests_hello_my_name_erika_ba7448: "你好，我叫艾丽卡。"
  npc_custom_pay_arche_THQS_Quests_hello_my_name_lenith_i_8205f3: "你好，我叫莱尼斯，我有一个任务给你。"
  npc_custom_pay_arche_THQS_Quests_hello_person_8df71b: "你好啊！！"
  npc_custom_pay_arche_THQS_Quests_hello_reason_i_sent_youn_309a5b: "你好，我找一位年轻冒险者来的原因是我们在塔底下遇到了问题。"
  npc_custom_pay_arche_THQS_Quests_hello_reason_why_i_broug_a1ec13: "你好，我找你来的原因是很久以前我交了一个朋友，他碰巧是耳语者。"
  npc_custom_pay_arche_THQS_Quests_hello_reason_why_i_broug_e0e58c: "你好，我找你来的原因是一种叫巴风特的非常奇怪的怪物。"
  npc_custom_pay_arche_THQS_Quests_hello_sorry_i_don_t_c6d6c5: "你好，抱歉我没时间聊天，我在等人。"
  npc_custom_pay_arche_THQS_Quests_hello_we_need_you_invest_d536a4: "你好，我们需要你调查一下斐扬洞穴 3 层的某些垃圾。"
  npc_custom_pay_arche_THQS_Quests_hello_welcome_alberta_8cd350: "你好 {0}，欢迎来到艾尔贝塔。"
  npc_custom_pay_arche_THQS_Quests_hello_welcome_geffen_tow_832d78: "你好，欢迎来到吉芬塔。"
  npc_custom_pay_arche_THQS_Quests_hello_welcome_mage_guild_ed3004: "你好 {0}，欢迎来到魔法师公会。"
  npc_custom_pay_arche_THQS_Quests_hello_welcome_morocc_7bb876: "你好 {0}，欢迎来到梦罗克。"
  npc_custom_pay_arche_THQS_Quests_hello_where_my_box_toad_826943: "你好 {0}，我的那盒蟾蜍舌头在哪？"
  npc_custom_pay_arche_THQS_Quests_hello_you_must_treasure_c6a597: "你好，你一定是宝藏猎人公会来的吧。"
  npc_custom_pay_arche_THQS_Quests_hello_you_seen_my_whispe_da72e6: "你好，你见过我的耳语者朋友吗？"
  npc_custom_pay_arche_THQS_Quests_help_help_i_lost_my_dc4f5d: "救命，救命，我把珠子弄丢了！！我哥哥布什会杀了我的，请帮帮我"
  npc_custom_pay_arche_THQS_Quests_help_well_what_we_know_2a71d5: "救命，嗯，我们对斐扬的了解是，不久前有一场大火烧毁了老学校。"
  npc_custom_pay_arche_THQS_Quests_here_take_these_treasure_5e81c2: "给你这 2 个宝藏代币。"
  npc_custom_pay_arche_THQS_Quests_here_take_these_treasure_5fa93e: "给你这 4 个宝藏代币。"
  npc_custom_pay_arche_THQS_Quests_here_take_these_treasure_655f10: "给你这 2 个宝藏代币。"
