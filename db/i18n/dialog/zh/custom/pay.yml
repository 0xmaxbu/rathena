  npc_custom_pay_arche_THQS_Quests_well_what_i_want_you_b72bdb: "嗯，我要你做的是给我带回50个灯笼，作为你清理了一些怪物的证明，你在下面找到的任何战利品都可以保留，除了我要求你帮我找的东西。"
