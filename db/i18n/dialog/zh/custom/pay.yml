  npc_custom_pay_arche_THQS_Quests_hi_mister_person_you_get_71643a: "嗨，冒险者。你能帮我弄点香蕉汁吗？"
  npc_custom_pay_arche_THQS_Quests_hi_mister_person_you_get_ba8043: "嗨，冒险者。你能帮我弄点苹果汁吗？"
  npc_custom_pay_arche_THQS_Quests_i_desire_0e2e5d: "我需要30个。"
  npc_custom_pay_arche_THQS_Quests_i_had_my_doubts_thank_a59e77: "我原本有些怀疑，但谢谢你的帮助。"
  npc_custom_pay_arche_THQS_Quests_i_hope_hole_go_away_42cd23: "我希望这个洞有一天会消失，也许将来我会有另一个任务给你。"
  npc_custom_pay_arche_THQS_Quests_i_knew_you_looked_strong_c70c32: "我就知道你看起很强，但我不知道你是怎么杀死那个怪物的。"
  npc_custom_pay_arche_THQS_Quests_i_know_may_sound_stupid_9c598d: "我知道这听起来很蠢，但从小我就梦想拥有一个华丽金属……"
  npc_custom_pay_arche_THQS_Quests_i_m_so_happy_see_b32ff6: "我很高兴能看到华丽金属！谢谢你，{0}。"
  npc_custom_pay_arche_THQS_Quests_i_want_them_472b6e: "我要5个。"
  npc_custom_pay_arche_THQS_Quests_i_wonder_what_happened_m_1948fe: "我想知道我的花怎么了"
  npc_custom_pay_arche_THQS_Quests_if_you_get_me_one_8e7733: "如果你能给我弄到一个，我会奖励你。"
  npc_custom_pay_arche_THQS_Quests_its_so_boring_when_you_b24a41: "当你不得不监视别人时，真是太无聊了……"
  npc_custom_pay_arche_THQS_Quests_live_doesn_t_get_any_54d153: "生活对我来说不能再糟了，每天在这个充满虫子的地下水道工作……"
  npc_custom_pay_arche_THQS_Quests_love_chat_i_m_waiting_c2f3b1: "我很想聊天，但我在等人。"
  npc_custom_pay_arche_THQS_Quests_management_3ca9be: "-管理"
  npc_custom_pay_arche_THQS_Quests_menu_oooooh_268668: "噢噢噢，我太喜欢情书了:D。接下来我要在这里打开它。"
  npc_custom_pay_arche_THQS_Quests_msg_6eae3a: "对于所有这些，我可以给你\\n "
  npc_custom_pay_arche_THQS_Quests_much_thanks_i_you_6acb07: "非常感谢你。"
  npc_custom_pay_arche_THQS_Quests_much_thanks_you_i_2ff12a: "非常感谢你。"
  npc_custom_pay_arche_THQS_Quests_must_me_you_shall_ventur_e1deec: "你必须为我做。穿越金字塔。"
  npc_custom_pay_arche_THQS_Quests_my_husbands_grave_i_m_d6d446: "这是我丈夫的坟墓……我只是来看看他。"
  npc_custom_pay_arche_THQS_Quests_my_wife_wants_me_home_0f28b6: "我老婆要我回家？！好吧，好吧……我这就走，我这就走。谢谢你告诉我这个消息。"
  npc_custom_pay_arche_THQS_Quests_oh_dear_god_98b49d: "天哪！！！"
  npc_custom_pay_arche_THQS_Quests_oh_hello_oh_you_my_bd0e1b: "哦，你好，哦，你有我的蜂蜜，我的蜜蜂和我都感谢你。"
  npc_custom_pay_arche_THQS_Quests_oh_thank_you_so_much_88dfae: "哦，非常感谢你，但它们还会回来的……"
  npc_custom_pay_arche_THQS_Quests_oh_these_my_flower_bad_ea564e: "哦，这些是我的花！可惜我不想要它们了……"
  npc_custom_pay_arche_THQS_Quests_oh_um_well_fuck_bastard_30957f: "哦……嗯……好吧，操，那个混蛋以为他能把我赶出去！！！他大错特错了！"
  npc_custom_pay_arche_THQS_Quests_ohhh_thank_you_thats_goo_fb0421: "哦，谢谢你，这对我来说是个好的开始。"
  npc_custom_pay_arche_THQS_Quests_ok_here_whats_happening_6fff7f: "好的，事情是这样的，我不知道是什么引起的，但有一个奇怪的罗南骷髅在这边往东2个地图的树林里游荡。"
  npc_custom_pay_arche_THQS_Quests_ok_i_don_t_want_276c8c: "好吧，我不想谈这个，但我需要你帮我找到20个嫩芽"
  npc_custom_pay_arche_THQS_Quests_ok_well_my_problem_yah_8aa803: "好吧，这就是我的问题，你看到地上的那个洞了吗？是的，那东西是几年前突然冒出来的，里面全是那些丑陋的蚂蚁和一种叫做地精的怪物。"
  npc_custom_pay_arche_THQS_Quests_ok_well_start_68b86a: "好吧，这算是个开始。"
  npc_custom_pay_arche_THQS_Quests_ok_well_what_i_wanted_df3006: "好吧，这是我想要你做的，我旁边的这个坟墓是我丈夫的，我答应过他要把一些纪念品和他一起埋葬，问题是我没有纪念品……"
  npc_custom_pay_arche_THQS_Quests_ok_well_where_s_letter_ff052e: "好吧，信在哪里？"
  npc_custom_pay_arche_THQS_Quests_one_those_evil_monsters_006c5b: "那些邪恶的怪物之一跟着你上来了，杀了它，杀了它！！！"
  npc_custom_pay_arche_THQS_Quests_people_say_baphomet_guil_465d2d: "人们说巴风特守护着通往冥界的大门，但我不信，杀了巴风特！"
  npc_custom_pay_arche_THQS_Quests_perfect_right_time_now_i_0f5d91: "完美，来得正是时候，现在我得去安放这个炸弹……呃，我是说把这个包裹送给我妈妈作为生日礼物。"
  npc_custom_pay_arche_THQS_Quests_phreeoni_pink_fluff_terr_b74f4a: "粉色绒毛菲雷欧尼正在恐吓小初心者！必须阻止它，杀了它！"
  npc_custom_pay_arche_THQS_Quests_remember_i_need_nail_s_468203: "记住我需要50个钉子"
  npc_custom_pay_arche_THQS_Quests_rotten_bandages_i_desire_21ec4a: "我需要30个腐烂的绷带。"
  npc_custom_pay_arche_THQS_Quests_so_where_my_package_6e63c7: "那我的包裹呢？"
  npc_custom_pay_arche_THQS_Quests_so_where_s_my_delivery_fe79c6: "那我的快递呢？"
  npc_custom_pay_arche_THQS_Quests_so_where_s_my_jur_7fc16a: "那我的拳刃呢？"
  npc_custom_pay_arche_THQS_Quests_so_you_my_packages_8927f4: "那你拿到我的包裹了吗？"
  npc_custom_pay_arche_THQS_Quests_so_your_one_come_help_172fff: "你就是那个来帮助我的人吗？"
  npc_custom_pay_arche_THQS_Quests_so_your_one_letter_me_df5711: "你就是那个有信要给我的人吗？"
  npc_custom_pay_arche_THQS_Quests_so_your_one_supposed_bri_6e370c: "你就是那个应该给我带来拳刃的人吗？"
  npc_custom_pay_arche_THQS_Quests_some_my_old_treasure_890d90: "还有一些我以前的宝藏……"
  npc_custom_pay_arche_THQS_Quests_sorry_busy_a19361: "抱歉，很忙。"
  npc_custom_pay_arche_THQS_Quests_sorry_i_m_waiting_my_34328e: "抱歉我在等我的包裹，所以我不想说话。"
  npc_custom_pay_arche_THQS_Quests_sorry_i_m_waiting_someon_26c075: "抱歉我在等人，你得稍后再来"
  npc_custom_pay_arche_THQS_Quests_sorry_i_m_waiting_someon_2b7023: "抱歉我在等人，你得稍后再来"
  npc_custom_pay_arche_THQS_Quests_sorry_i_m_waiting_someon_360ff8: "抱歉我在等人。你得稍后再来。"
  npc_custom_pay_arche_THQS_Quests_sorry_i_m_waiting_someon_93c54e: "抱歉我在等人，你得稍后再来。"
  npc_custom_pay_arche_THQS_Quests_sorry_inform_you_you_bee_53457e: "很抱歉通知你，你已经被驱逐了，请在3-5天内搬出去。"
  npc_custom_pay_arche_THQS_Quests_sorry_t_talk_i_m_66d3ee: "抱歉不能聊天，我是个忙人，我在等我的包裹。"
  npc_custom_pay_arche_THQS_Quests_sorry_t_talk_i_m_fce8f6: "抱歉不能聊天，我在等人。"
  npc_custom_pay_arche_THQS_Quests_strange_thing_about_what_e1cd17: "关于发生的事情，奇怪的是里面的孩子们似乎不是死于火焰。他们已经占领了整个斐扬洞穴第3层。"
