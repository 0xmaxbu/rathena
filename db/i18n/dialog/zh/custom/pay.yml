Body:
  npc_custom_pay_arche_THQS_Quests_ahh_good_thank_you_your_cccb38: "啊，很好，谢谢你的时间。收下这个寻宝猎人代币。"
  npc_custom_pay_arche_THQS_Quests_ahh_hello_you_must_treas_93349f: "啊，你好，你一定是来自寻宝猎人公会的。"
  npc_custom_pay_arche_THQS_Quests_ahh_you_must_treasure_hu_170640: "啊，你一定是来自寻宝猎人事务所的。你把我的弓带来了吗？"
  npc_custom_pay_arche_THQS_Quests_another_quest_you_i_e9e9ef: "我还有另一个任务要交给你。"
  npc_custom_pay_arche_THQS_Quests_arrrg_those_bastard_bugs_4a5c95: "啊！！那些该死的虫子把所有东西都啃光了，这地方看起来都不像我的农场了！！"
  npc_custom_pay_arche_THQS_Quests_as_i_know_i_look_6a4f17: "我知道我看起来很老，但我就是一直找不到一个。现在我从寻宝猎人公会退休了，再也没有刺激的事情可做了……"
  npc_custom_pay_arche_THQS_Quests_bring_back_me_their_wrap_1decbc: "给我把它们的裹尸布带回来。"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_daenggie_s_c1081f: "给我带回40个灯芯草。"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_nine_tales_3ffed0: "给我带回1个九尾狐！"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_round_shel_c0cdb9: "给我带回1个圆壳！"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_there_bone_be7f2a: "给我把那些骨头带回来。"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_tiger_s_a39294: "给我带回1个虎皮！"
  npc_custom_pay_arche_THQS_Quests_bring_me_back_tongue_b9bd04: "给我带回1个舌头！"
  npc_custom_pay_arche_THQS_Quests_bring_me_black_hair_e82625: "给我带回20个黑色头发！"
  npc_custom_pay_arche_THQS_Quests_bring_me_fabrics_2e7744: "给我带回50个布料！"
  npc_custom_pay_arche_THQS_Quests_bring_me_glass_beads_23f8cd: "给我带回10个玻璃珠！"
  npc_custom_pay_arche_THQS_Quests_bring_me_gold_bar_him_194421: "给我从他那里带回1个金条。"
  npc_custom_pay_arche_THQS_Quests_bring_me_his_evil_horn_04563e: "给我带回他的邪恶之角！"
  npc_custom_pay_arche_THQS_Quests_bring_me_his_saber_as_d75874: "给我带回他的军刀作为证明！"
  npc_custom_pay_arche_THQS_Quests_bring_me_mementos_please_4bc1c3: "请给我带回15个纪念品。"
  npc_custom_pay_arche_THQS_Quests_bring_me_worm_peelings_f709bf: "给我带回150个虫蜕。"
  npc_custom_pay_arche_THQS_Quests_danger_coal_mine_now_hos_6e5080: "危险，妙勒尼废矿现在已经是敌对区域了。"
  npc_custom_pay_arche_THQS_Quests_dear_erika_894343: "亲爱的艾丽卡"
  npc_custom_pay_arche_THQS_Quests_dear_god_took_you_long_c1fe90: "天哪，你怎么这么久才来，你这个混蛋！"
  npc_custom_pay_arche_THQS_Quests_eh_t_old_man_walk_6ce16b: "嘿！难道一个老人就不能安静地散步吗？！"
  npc_custom_pay_arche_THQS_Quests_eh_whats_cabf75: "嗯？那是什么？！"
  npc_custom_pay_arche_THQS_Quests_ever_heard_monster_calle_41f310: "听说过一种叫做狂暴野猪的怪物吗？它看起来像一头野猪，但会发出非常烦人的噪音。"
  npc_custom_pay_arche_THQS_Quests_fighting_mummies_future_103bfb: "与木乃伊战斗是你的未来。"
  npc_custom_pay_arche_THQS_Quests_further_into_pyramid_you_c2b344: "你必须更深入金字塔。"
  npc_custom_pay_arche_THQS_Quests_get_out_my_face_you_c7071a: "从我面前消失，你这个废物。"
  npc_custom_pay_arche_THQS_Quests_good_luck_33cd1e: "祝你好运"
  npc_custom_pay_arche_THQS_Quests_good_your_here_ok_there_480a7f: "很好，你来了。好吧，有报告称一位名叫德雷克的旧船长遗弃了这艘船。杀了他！"
  npc_custom_pay_arche_THQS_Quests_half_naked_freak_need_ar_42482a: "这个半裸的疯子需要一支军队才能拿下，现在轮到你了，祝你好运。"
  npc_custom_pay_arche_THQS_Quests_he_told_me_he_always_926f86: "他告诉我他总是在下面被其他幽灵欺负，而且我已经有一段时间没见到他了。"
  npc_custom_pay_arche_THQS_Quests_hello_0f4ebe: "你好{0}。"
  npc_custom_pay_arche_THQS_Quests_hello_69342c: "你好！"
  npc_custom_pay_arche_THQS_Quests_hello_did_you_bring_me_3da8ba: "你好，你给我带花了吗！？"
  npc_custom_pay_arche_THQS_Quests_hello_friend_176542: "你好，朋友"
  npc_custom_pay_arche_THQS_Quests_hello_mister_19c2b5: "你好，{0}先生。"
  npc_custom_pay_arche_THQS_Quests_hello_my_name_erika_ba7448: "你好，我叫艾丽卡。"
  npc_custom_pay_arche_THQS_Quests_hello_my_name_lenith_i_8205f3: "你好，我叫莱尼思，我有一个任务要交给你。"
  npc_custom_pay_arche_THQS_Quests_hello_person_8df71b: "你好，冒险者！！"
  npc_custom_pay_arche_THQS_Quests_hello_reason_i_sent_youn_309a5b: "你好，我派人来找年轻冒险者的原因是因为塔下出现的问题。"
  npc_custom_pay_arche_THQS_Quests_hello_reason_why_i_broug_a1ec13: "你好，我把你叫来的原因是很久以前我交了一个朋友，碰巧是一个低语者。"
  npc_custom_pay_arche_THQS_Quests_hello_reason_why_i_broug_e0e58c: "你好，我把你叫来的原因是因为一种非常奇怪的怪物，叫做巴风特。"
  npc_custom_pay_arche_THQS_Quests_hello_sorry_i_don_t_c6d6c5: "你好，抱歉我没多少时间聊天，我在等人。"
  npc_custom_pay_arche_THQS_Quests_hello_we_need_you_invest_d536a4: "你好，我们需要你去调查斐扬洞穴第3层的一些情况。"
  npc_custom_pay_arche_THQS_Quests_hello_welcome_alberta_8cd350: "你好，{0}，欢迎来到艾尔贝塔。"
  npc_custom_pay_arche_THQS_Quests_hello_welcome_geffen_tow_832d78: "你好，欢迎来到吉芬塔。"
  npc_custom_pay_arche_THQS_Quests_hello_welcome_mage_guild_ed3004: "你好，{0}，欢迎来到魔法师公会。"
  npc_custom_pay_arche_THQS_Quests_hello_welcome_morocc_7bb876: "你好，{0}，欢迎来到梦罗克。"
  npc_custom_pay_arche_THQS_Quests_hello_where_my_box_toad_826943: "你好，{0}，我的蟾蜍舌头盒子呢？"
  npc_custom_pay_arche_THQS_Quests_hello_you_must_treasure_c6a597: "你好，你一定是来自寻宝猎人公会的。"
  npc_custom_pay_arche_THQS_Quests_hello_you_seen_my_whispe_da72e6: "你好，你见过我的低语者朋友吗？"
  npc_custom_pay_arche_THQS_Quests_help_help_i_lost_my_dc4f5d: "救命，救命！我的珠子丢了！！我哥哥布什会杀了我的，请帮帮我"
  npc_custom_pay_arche_THQS_Quests_help_well_what_we_know_2a71d5: "救命，好吧，关于斐扬我们知道的是，不久前发生了一场怪火，烧毁了旧学校。"
  npc_custom_pay_arche_THQS_Quests_here_take_these_treasure_5e81c2: "给你，收下这2个寻宝猎人代币。"
