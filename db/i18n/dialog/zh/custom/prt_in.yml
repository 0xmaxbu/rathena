Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_custom_prt_in_card_remover_alright_come_back_anytim_7b181a: "好的。如果需要我的服务，随时回来找我。"
  npc_custom_prt_in_card_remover_alright_which_piece_equi_4f0629: "好的。你想让我检查哪件装备呢？"
  npc_custom_prt_in_card_remover_although_card_successful_392db7: "虽然成功从装备上取出卡片，但卡片在过程中损坏了。不过装备保住了。"
  npc_custom_prt_in_card_remover_card_s_socketed_spell_re_c4b230: " 张卡片。施展法术需要 "
  npc_custom_prt_in_card_remover_equipment_c7a0e3: "这件装备上镶嵌了 "
  npc_custom_prt_in_card_remover_how_regrettable_card_suc_5f1228: "太遗憾了。卡片被成功取出，但装备本身损坏了。"
  npc_custom_prt_in_card_remover_i_cannot_serve_you_8020e3: "我无法为你服务。"
  npc_custom_prt_in_card_remover_i_charge_fixed_fee_aecd47: "我收取固定费用 "
  npc_custom_prt_in_card_remover_i_unable_remove_card_for_ec3d74: "我未能成功拆除卡片。但幸运的是，装备和卡片都完好无损。"
  npc_custom_prt_in_card_remover_kafra_storage_come_back_79749f: "卡普拉仓库后再来找我吧~"
  npc_custom_prt_in_card_remover_menu_alright_fc02d7: "好的，开始吧。:算了。"
  npc_custom_prt_in_card_remover_menu_before_838bd2: "在开始之前，我必须提醒你——我可能会失败。如果失败，卡片和装备可能都会损坏，我不退款。话说回来，哪一边对你更重要：卡片还是装备？"
  npc_custom_prt_in_card_remover_menu_i_f97ac2: "我改主意了。:保住装备。:保住卡片。"
  npc_custom_prt_in_card_remover_menu_yes_ba3ff9: "是的，请帮忙。:费用是多少？:不用了，谢谢。"
  npc_custom_prt_in_card_remover_nice_meet_you_young_one_ee5468: "很高兴见到你，年轻人。我能为你拆除装备上镶嵌的卡片，需要我帮忙吗？"
  npc_custom_prt_in_card_remover_please_store_your_excess_8a9ebc: "请把多余的物品存放到"
  npc_custom_prt_in_card_remover_please_wait_moment_deaaec: "^3355FF请等一下！"
  npc_custom_prt_in_card_remover_spell_failed_utterly_i_a_b3c9af: "法术彻底失败了。我很抱歉，装备和卡片都损坏了。"
  npc_custom_prt_in_card_remover_spell_success_here_your_a2f39b: "法术成功了。这是你的卡片和装备，请收好。再见。"
  npc_custom_prt_in_card_remover_very_well_i_shall_begin_3288c4: "好的，我开始施法了。"
  npc_custom_prt_in_card_remover_you_carrying_too_many_th_ff0730: "你身上的东西太多了，"
  npc_custom_prt_in_card_remover_you_lack_items_required_9db404: "你缺少施展法术所需的物品，孩子。集齐了再来找我吧。"
  npc_custom_prt_in_card_remover_young_one_there_no_cards_6c2f65: "年轻人... 这件装备上没有镶嵌卡片。恐怕我帮不了你。"
  npc_custom_prt_in_card_remover_young_one_you_nothing_eq_2ac25f: "年轻人... 你身上这个位置没有可以拆除卡片的装备哦。"
  npc_custom_prt_in_card_remover_zeny_one_star_crumb_one_e4f7e8: " Zeny、一颗^0000FF星星的粉末^000000和一颗^0000FF黄宝石^000000。"
  npc_custom_prt_in_card_remover_zeny_per_card_addition_i_4a52c4: " Zeny。此外，还需要一颗星星的粉末和一颗黄宝石来施展法术。"
  npc_custom_prt_in_card_remover_zeny_plus_1b70ad: " Zeny，外加每张卡片 "
  npc_custom_prt_in_item_signer_although_i_work_free_34869d: "虽然我可以免费工作，但是..."
  npc_custom_prt_in_item_signer_as_i_said_i_sign_99bbf2: "如我之前所说，有卡片的装备我不签名。"
  npc_custom_prt_in_item_signer_card_here_c42f59: "一张卡片？在这里？！"
  npc_custom_prt_in_item_signer_done_55823e: "搞定！"
  npc_custom_prt_in_item_signer_goodbye_7468c8: "再见..."
  npc_custom_prt_in_item_signer_i_dare_alter_work_master_525666: "我可不敢改动大师的作品。"
  npc_custom_prt_in_item_signer_i_rather_hear_word_thank_850d7c: "我可不想听到'谢谢'两个字。"
  npc_custom_prt_in_item_signer_i_sign_any_equipment_wea_302a86: "我可以为任何无插槽的装备或武器签名。"
  npc_custom_prt_in_item_signer_i_sign_your_name_onto_529258: "我能为几乎任何稀有装备^0055FF签上你的名字^000000。"
  npc_custom_prt_in_item_signer_menu_i_ae754f: "我需要："
  npc_custom_prt_in_item_signer_menu_more_3f3256: "详细说明...:请帮我签名！"
  npc_custom_prt_in_item_signer_menu_my_974e30: "我的收费标准："
  npc_custom_prt_in_item_signer_menu_yes_52ac8b: "好的！:算了"
  npc_custom_prt_in_item_signer_msg_44c582: " 在哪里...？"
  npc_custom_prt_in_item_signer_msg_5bab61: "^000000 上签名吗？"
  npc_custom_prt_in_item_signer_oh_my_equipment_already_518f56: "哎呀，这件装备已经签过名了。"
  npc_custom_prt_in_item_signer_per_refine_2d037a: "每精炼值 "
  npc_custom_prt_in_item_signer_rather_angry_children_4edf6a: "或者应该说12个生气的孩子"
  npc_custom_prt_in_item_signer_should_i_sign_b6d79c: "要我在 ^0055FF"
  npc_custom_prt_in_item_signer_show_me_equipment_you_wa_6bb9bb: "请把要签名的装备给我看看..."
  npc_custom_prt_in_item_signer_sigh_i_starving_children_a26bae: "唉，我有12个饥饿的孩子"
  npc_custom_prt_in_item_signer_sorry_i_sign_rental_equi_5584c9: "抱歉，租借类装备我不签名！"
  npc_custom_prt_in_item_signer_sorry_i_sign_slotted_equ_a3e62c: "抱歉，有槽的装备我不签名。"
  npc_custom_prt_in_item_signer_there_nothing_equipped_s_050c41: "那个部位没有装备任何物品！"
  npc_custom_prt_in_item_signer_very_angry_wife_1180d6: "和一个很生气的妻子。"
  npc_custom_prt_in_item_signer_very_starving_wife_4d09f0: "和一个很饥饿的妻子..."
  npc_custom_prt_in_item_signer_where_your_9187cd: "你的 "
  npc_custom_prt_in_item_signer_zeny_f460a9: " Zeny"
