Body:
  npc_custom_prt_in_THQS_TTShop_ahh_welcome_official_tre_946ae3: "啊，{0}！欢迎来到官方宝藏猎人公会商店。"
  npc_custom_prt_in_THQS_TTShop_everything_its_own_price_1cc275: "每样东西都有自己的价格，获得代币的唯一方法就是完成分配给你的任务，系统通常是这样的。"
  npc_custom_prt_in_THQS_TTShop_harder_mission_more_toke_5a01c4: "任务越难，你获得的代币就越多。所有红色任务价值 4-8 个代币，其余价值 1-5 个。"
  npc_custom_prt_in_THQS_TTShop_hope_solves_your_problem_c90bda: "希望这能解决你的问题和疑问。"
  npc_custom_prt_in_THQS_TTShop_note_t_stands_treasure_t_c2a47f: "（注：T 代表宝藏代币。）"
  npc_custom_prt_in_THQS_TTShop_ok_here_our_big_list_81ab07: "好的，这是我们的商品大列表。"
  npc_custom_prt_in_THQS_TTShop_well_you_see_here_you_38ea87: "你知道，在这里你可以用宝藏猎人代币兑换 Zeny 或由我们的铁匠打造的稀有武器。"
  npc_custom_prt_in_THQS_TTShop_what_we_offer_a2a346: "这就是我们提供的商品。"
  npc_custom_prt_in_THQS_TTShop_what_we_offer_all_cards_ea4419: "这就是我们提供的商品。所有卡片 300T"
  npc_custom_prt_in_THQS_TTShop_you_currently_treasure_t_4436fe: "你当前有 ^FF0000{0}^000000 个宝藏代币！！！"
  npc_custom_prt_in_THQS_TTShop_you_don_t_enough_tokens_32ea17: "你的代币不够！"
  npc_custom_prt_in_card_remover_alright_come_back_anytim_7b181a: "好的。如果需要我的服务，随时回来找我。"
  npc_custom_prt_in_card_remover_alright_which_piece_equi_4f0629: "好的。你想让我检查哪件装备呢？"
  npc_custom_prt_in_card_remover_although_card_successful_392db7: "虽然成功从装备上取出卡片，但卡片在过程中损坏了。不过装备保住了。"
  npc_custom_prt_in_card_remover_card_s_socketed_spell_re_c4b230: " 张卡片。施展法术需要 "
  npc_custom_prt_in_card_remover_equipment_c7a0e3: "这件装备上镶嵌了 "
  npc_custom_prt_in_card_remover_good_day_young_one_i_110f8d: "日安，年轻人。我有能力移除你已经镶嵌在装备上的卡片。这个主意让你感兴趣吗？"
  npc_custom_prt_in_card_remover_how_regrettable_card_suc_5f1228: "太遗憾了。卡片被成功取出，但装备本身损坏了。"
  npc_custom_prt_in_card_remover_i_cannot_serve_you_8020e3: "我无法为你服务。"
  npc_custom_prt_in_card_remover_i_charge_fixed_fee_aecd47: "我收取固定费用 "
  npc_custom_prt_in_card_remover_i_charge_flat_fee_zeny_c37e27: "我收取固定费用 {0} Zeny，外加从物品上移除每张卡片 {1} Zeny。此外，我还需要一颗星星的角和一颗黄色宝石来施展我的魔法。"
  npc_custom_prt_in_card_remover_i_failed_remove_cards_lu_ff0585: "我未能移除卡片。不过幸运的是，物品和卡片都还完好。"
  npc_custom_prt_in_card_remover_i_t_offer_any_my_31130d: "我无法为你提供任何"
  npc_custom_prt_in_card_remover_i_unable_remove_card_for_ec3d74: "我未能成功拆除卡片。但幸运的是，装备和卡片都完好无损。"
  npc_custom_prt_in_card_remover_item_cards_compounded_pe_2fa31a: "这件物品上镶嵌了 {0} 张卡片。要施展我的魔法，我需要 {1} Zeny、一颗 ^0000FF星星的角^000000 和一颗 ^0000FF黄色宝石^000000。"
  npc_custom_prt_in_card_remover_just_minute_7907cd: "^3355FF请稍等！"
  npc_custom_prt_in_card_remover_kafra_storage_come_again_26ae41: "卡普拉仓库，下次再来吧~"
  npc_custom_prt_in_card_remover_kafra_storage_come_back_79749f: "卡普拉仓库后再来找我吧~"
  npc_custom_prt_in_card_remover_menu_alright_fc02d7: "好的，开始吧。:算了。"
  npc_custom_prt_in_card_remover_menu_before_1ce37a: "在我开始之前，我必须警告你——我可能会失败。如果我失败了，我可能会毁掉卡片、物品，或者两者都毁掉。我不退款。既然如此，哪个对你来说更重要:卡片，还是物品？"
  npc_custom_prt_in_card_remover_menu_before_838bd2: "在开始之前，我必须提醒你——我可能会失败。如果失败，卡片和装备可能都会损坏，我不退款。话说回来，哪一边对你更重要:卡片还是装备？"
  npc_custom_prt_in_card_remover_menu_i_0c0367: "我改变主意了。:物品。:卡片。"
  npc_custom_prt_in_card_remover_menu_i_f97ac2: "我改主意了。:保住装备。:保住卡片。"
  npc_custom_prt_in_card_remover_menu_very_c1b0aa: "很好。开始吧。:算了。"
  npc_custom_prt_in_card_remover_menu_yes_ba3ff9: "是的，请帮忙。:费用是多少？:不用了，谢谢。"
  npc_custom_prt_in_card_remover_menu_yes_cbae6e: "是的，感兴趣。:你怎么收费？:不了，谢谢。"
  npc_custom_prt_in_card_remover_most_unfortunate_i_succe_867bf4: "太不幸了。我成功移除了卡片，但物品本身在这个过程中被摧毁了。"
  npc_custom_prt_in_card_remover_nice_meet_you_young_one_ee5468: "很高兴见到你，年轻人。我能为你拆除装备上镶嵌的卡片，需要我帮忙吗？"
  npc_custom_prt_in_card_remover_please_store_your_excess_8a9ebc: "请把多余的物品存放到"
