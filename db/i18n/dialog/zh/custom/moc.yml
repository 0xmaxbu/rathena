Body:
  npc_custom_moc_fild07_sunglasses_as_you_wish_dafe43: "如你所愿。"
  npc_custom_moc_fild07_sunglasses_carat_diamond_b44610: " - ^0000881个克拉钻石^000000"
  npc_custom_moc_fild07_sunglasses_come_back_me_than_you_7ed5fb: "准备好后再来找我。"
  npc_custom_moc_fild07_sunglasses_come_back_me_when_you_9b55d6: "当你放弃的时候再来找我。哈哈哈……"
  npc_custom_moc_fild07_sunglasses_enjoy_your_slotted_sungl_4d8814: "享受你的^000088带孔太阳镜^000000。"
  npc_custom_moc_fild07_sunglasses_feathers_a0e563: " - ^00008850根羽毛^000000"
  npc_custom_moc_fild07_sunglasses_go_see_maseph_she_somewh_9a4bfe: "去找玛塞夫。她在梦罗克以北的某处。"
  npc_custom_moc_fild07_sunglasses_great_now_listen_careful_46d3f0: "很好。现在，仔细听。"
  npc_custom_moc_fild07_sunglasses_hello_there_95e3ac: "你好。"
  npc_custom_moc_fild07_sunglasses_hello_what_i_you_9589ce: "你好。有什么可以帮你的吗？"
  npc_custom_moc_fild07_sunglasses_here_you_go_my_friend_b8177c: "给你，我的朋友。"
  npc_custom_moc_fild07_sunglasses_i_make_them_i_tell_ff3e85: "我不制作它们，但我可以告诉你哪里能找到制作的人。只要付一点小费……"
  npc_custom_moc_fild07_sunglasses_i_need_one_pair_sunglass_287ab6: "我需要一副^000088太阳镜^000000。当你有一副的时候再来找我。"
  npc_custom_moc_fild07_sunglasses_i_send_her_message_let_ee93b7: "我会给她发个消息，让她知道你要来。"
  npc_custom_moc_fild07_sunglasses_look_someone_named_masep_cdc213: "在梦罗克以北找一个叫玛塞夫的人。"
  npc_custom_moc_fild07_sunglasses_lovely_day_isn_t_96c59d: "天气真好，不是吗？"
  npc_custom_moc_fild07_sunglasses_make_one_i_need_one_a2a13b: "要制作一个，我需要一副^000088太阳镜^000000和400,000z。"
  npc_custom_moc_fild07_sunglasses_menu_alright_685b1e: "好的，给你。:太贵了！"
  npc_custom_moc_fild07_sunglasses_menu_here_ee49c0: "给你。:不，谢谢。"
  npc_custom_moc_fild07_sunglasses_menu_how_1b0cfc: "多少钱？:不可能，我自己去找她！"
  npc_custom_moc_fild07_sunglasses_menu_i_e4389a: "我听说你可以制作^0000FF带孔太阳镜^000000。:没什么，打扰了。"
  npc_custom_moc_fild07_sunglasses_menu_in_1afdb7: "为了让我告诉你关于^0000FF带孔太阳镜^000000的信息，你需要给我带来:"
  npc_custom_moc_fild07_sunglasses_menu_yes_910210: "是:不，打扰了。"
  npc_custom_moc_fild07_sunglasses_off_you_go_then_1ad524: "那你去吧。"
  npc_custom_moc_fild07_sunglasses_only_i_tell_her_you_74dc97: "只有我能告诉她你要来。"
  npc_custom_moc_fild07_sunglasses_suit_yourself_cc0945: "随你便。"
  npc_custom_moc_fild07_sunglasses_suit_yourself_maker_make_b856c9: "随你便，除非她知道你要来，否则制作者不会为你制作^0000FF带孔太阳镜^000000。"
  npc_custom_moc_fild07_sunglasses_thank_you_i_get_right_8ab39d: "谢谢。我马上开始……"
  npc_custom_moc_fild07_sunglasses_there_nothing_more_i_tel_88b26b: "我没什么可以告诉你的了。"
  npc_custom_moc_fild07_sunglasses_you_came_slotted_sunglas_65e983: "你是为了^000088带孔太阳镜^000000来的，对吧？"
  npc_custom_moc_fild07_sunglasses_you_enough_zeny_come_bac_fa3513: "你的Zeny不够。当你有足够的Zeny时再回来找我。"
  npc_custom_moc_fild07_sunglasses_you_re_missing_something_18e06e: "你缺了些什么。当你收集齐所有材料后再回来。"
  npc_custom_moc_fild07_sunglasses_z_392018: " - ^000088100,000z^000000"
