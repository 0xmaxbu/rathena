  npc_override_alberta_in_quests_alberta_one_glance_restore_your_b19e49: "One glance at it can restore your strength, one sniff and your blood boils with vigorous pleasure..."
  npc_override_alberta_in_quests_alberta_one_i_like_most_b34851: "This is the one I like the most."
  npc_override_alberta_in_quests_alberta_one_one_boy_7a7008: "-One by one to the boy-"
  npc_override_alberta_in_quests_alberta_one_s_records_we_able_cf30b0: "By the ^3355FFOne^000000's records, we were able to thoroughly explore all to be seen on Turtle Island. However..."
  npc_override_alberta_in_quests_alberta_one_succeeded_417457: "^3355AA'One,' has succeeded.^000000"
  npc_override_alberta_in_quests_alberta_one_who_dreams_star_sere_a77897: "The one who dreams to be a star of serenity must first hold the comet and three rays of light as one."
  npc_override_alberta_in_quests_alberta_only_half_our_crew_left_cac621: "Only half of our crew is left, and we only have enough food for ten more days. Our condition is truly grave."
  npc_override_alberta_in_quests_alberta_only_one_who_317986: "^FF3355Only one who^000000"
  npc_override_alberta_in_quests_alberta_only_someone_good_heart_441a65: "But only someone with a good heart that's eager for adventure should be able to go to that kind of place."
  npc_override_alberta_in_quests_alberta_oo_o_date_58b212: "OO / O date"
  npc_override_alberta_in_quests_alberta_ooh_let_me_give_you_98ea4f: "Ooh, let me give you something as a little thank you. You see, I hid some candy so I can eat it without telling mommy."
  npc_override_alberta_in_quests_alberta_ooh_ooh_815710: "Ooh ooh!"
  npc_override_alberta_in_quests_alberta_ooh_rocker_doll_9095d4: "Ooh! Rocker Doll!"
  npc_override_alberta_in_quests_alberta_ooh_sun_too_strong_today_c49ece: "Ooh, the sun is too strong today. I'm glad that I brought my hat. I'm going to get a sunburn if my skin is exposed to the sun like this everyday."
  npc_override_alberta_in_quests_alberta_ooog_8da0ea: "Ooog..."
  npc_override_alberta_in_quests_alberta_oooh_216d0d: "Oooh..."
  npc_override_alberta_in_quests_alberta_open_like_drawer_4e9ae1: "it open like a drawer.^000000"
  npc_override_alberta_in_quests_alberta_or_is_it_8cb3ea: "^3355FFOr is it...?^000000"
  npc_override_alberta_in_quests_alberta_order_find_safety_you_gi_c1673e: "In order to find safety, you would give up fun adventures?"
  npc_override_alberta_in_quests_alberta_order_restore_my_youth_i_9c07fa: "In order to restore my youth, I tried all sorts of things, mostly by hearsay, but nothing worked. In the end, I spent so much zeny on miracle cures, I ended up broke."
  npc_override_alberta_in_quests_alberta_oridecon_37811a: "^0000FF2 Oridecon^000000"
  npc_override_alberta_in_quests_alberta_other_lifeforms_just_lik_14eccf: "Other lifeforms just like us..."
  npc_override_alberta_in_quests_alberta_others_folk_say_potion_p_77baa5: "Others folk say a potion that can prolong your lifespan can be found somewhere in Turtle Island. But nobody really knows for sure."
  npc_override_alberta_in_quests_alberta_our_leader_54cda2: "be our leader?!"
  npc_override_alberta_in_quests_alberta_our_spirits_crushed_we_t_382c7a: "Our spirits were crushed!! We tried again and again to leave that place, and spent nearly a year trying to leave but we kept winding up at Turtle Island's shores."
  npc_override_alberta_in_quests_alberta_our_suspicions_confirmed_5942f1: "Our suspicions were confirmed when we found that the animals on Turtle Island wouldn't eat the bananas we found."
  npc_override_alberta_in_quests_alberta_our_task_here_save_peopl_600174: "Our task here is to save people, but when we arrived on Turtle Island, we were attacked by a mob of monsters! So we all got scattered."
  npc_override_alberta_in_quests_alberta_our_weapon_armor_budget_04aaec: "Our weapon and armor budget is always gone after Takuyaka visits a buffet... Why do we have to be so miserable?!"
  npc_override_alberta_in_quests_alberta_outside_43a51a: "...Outside?..."
  npc_override_alberta_in_quests_alberta_outside_city_kingdom_the_7c4015: "Outside this city and this kingdom, there is a bigger world."
  npc_override_alberta_in_quests_alberta_overtime_d7b3db: "overtime for"
  npc_override_alberta_in_quests_alberta_ox_o_date_a8789d: "OX / O date"
