  npc_override_alberta_in_quests_alberta_want_say_me_time_063629: "Want to say to me this time..."
  npc_override_alberta_in_quests_alberta_way_i_don_t_go_2a9c08: "That way I don't have to go out."
  npc_override_alberta_in_quests_alberta_way_i_m_pretty_hungry_2eaafa: "By the way, I'm pretty hungry. Why doesn't Alberta have any good restaurants?! I hear they have good dimsum in Kunlun..."
  npc_override_alberta_in_quests_alberta_we_decided_seal_away_poi_248e6a: "We decided to seal away this poisonous fruit, but learned that it didn't rot, not even after we removed the skin."
  npc_override_alberta_in_quests_alberta_we_finally_found_records_098392: "We finally found the records we have been searching for."
  npc_override_alberta_in_quests_alberta_we_found_some_kind_fruit_4e4c8c: "We found some kind of fruit to eat! It's covered in some sort of yellow skin and looks like a banana!"
  npc_override_alberta_in_quests_alberta_we_had_good_plans_missio_8c63ef: "We had good plans for this mission, made by our second in command, Mudasamu. However, they were executely poorly by the first in command."
  npc_override_alberta_in_quests_alberta_we_having_difficulty_try_a208eb: "We are having difficulty trying to find any records. Is it possible that the first people here wrote nothing of their journey?"
  npc_override_alberta_in_quests_alberta_we_hidden_treasure_we_le_8d8b37: "We have hidden the treasure we have left behind to keep it from getting stolen."
  npc_override_alberta_in_quests_alberta_we_ll_f9c9ee: "We'll..."
  npc_override_alberta_in_quests_alberta_we_no_idea_why_s_91dda2: "We have no idea why it's harmful to eat, or why it never perishes, but it be of some medical or scientific interest."
  npc_override_alberta_in_quests_alberta_we_only_ones_who_did_e60103: "We were the only ones who did not give in to despair, and doggedly held onto our hopes. Still, it was by pure luck that we found a way back to Rune-Midgarts."
  npc_override_alberta_in_quests_alberta_we_re_9b37ff: "we're not"
  npc_override_alberta_in_quests_alberta_we_re_supposed_protect_p_c9be05: "We're supposed to protect the people of Alberta. That's our job as proud Security Knights."
  npc_override_alberta_in_quests_alberta_we_sailed_day_night_drif_5beb51: "We sailed day and night, drifting for weeks, until one day, we were surrounded by an incredibly thick fog. We had no idea of which direction we were going and the mist wouldn't clear."
  npc_override_alberta_in_quests_alberta_we_spent_many_days_searc_b05145: "We have spent many days searching for it, but found not one trace."
  npc_override_alberta_in_quests_alberta_we_spent_month_trying_st_7b1589: "We spent a month trying to steer through that mist. When we finally sailed out of that mist, we saw that we had arrived at the other side of Turtle Island!"
  npc_override_alberta_in_quests_alberta_we_ve_come_here_rescue_dd1876: "We've come here to rescue treasure hunters that might be in trouble. However, our leader is this porky specimen right next to me. So I guess I foresaw that this mission would fail."
  npc_override_alberta_in_quests_alberta_we_ve_found_evidence_oth_41904d: "We've found evidence that other people were here, and that we are not the first to find Turtle Island."
  npc_override_alberta_in_quests_alberta_we_wanted_find_out_if_01fe13: "We wanted to find out if the legends about that island were true, so we left everything behind to learn the truth."
  npc_override_alberta_in_quests_alberta_wear_pride_7df1e4: "wear it with pride~"
  npc_override_alberta_in_quests_alberta_weird_how_d_you_know_6df022: "Weird. How'd you know I make Fashionable Glasses? I guess I must be more famous that I thought."
  npc_override_alberta_in_quests_alberta_well_7b1901: "Well..."
  npc_override_alberta_in_quests_alberta_well_alcohol_pub_here_se_289c0c: "Well, the alcohol in the pub here is second rate, but I gotta admit, it's got a great atmosphere."
  npc_override_alberta_in_quests_alberta_well_as_you_see_i_736bdc: "Well, as you can see, I'm a little older now. These old bones aren't what they used to be."
  npc_override_alberta_in_quests_alberta_well_first_i_think_s_23eefc: "Well, first I think it's fair to warn you that Turtle Island took the lives of my buddies. That's right, I was part of ^3355FFJornadan Niliria^000000's crew."
  npc_override_alberta_in_quests_alberta_well_good_luck_278f8c: "Well, good luck!"
  npc_override_alberta_in_quests_alberta_well_hats_i_me_my_d1d9e8: "Well, the hats I have with me are for my customers. If I use them for myself, I'll have nothing to sell..."
  npc_override_alberta_in_quests_alberta_well_if_spirit_adventure_963f89: "Well, if the spirit of adventure should happen to grab you, I will be here waiting."
  npc_override_alberta_in_quests_alberta_well_if_you_happen_find_6e6dbc: "Well, if you happen to find anyone else in my unit, would you let them know where I am?"
  npc_override_alberta_in_quests_alberta_well_s_fine_although_you_942aa0: "Well that's fine. Although you're a rude prick, I will forgive you. We'll probably speak again..."
  npc_override_alberta_in_quests_alberta_well_s_my_story_you_cba2d3: "Well, that's my story. You know, if you want to learn more about Turtle Island, why don't you speak to the scholar on the eastern port of Alberta?"
  npc_override_alberta_in_quests_alberta_well_then_6f6f3d: "Well, then..."
  npc_override_alberta_in_quests_alberta_well_then_see_you_later_32eefa: "Well then, see you later~"
  npc_override_alberta_in_quests_alberta_well_there_s_lot_folklor_7cc870: "Well, there's a lot of folklore about that place. Some folk say that there's a mountain of treasure there."
  npc_override_alberta_in_quests_alberta_well_wasn_t_exactly_like_b97db1: "Well, it wasn't exactly like the bananas we have in Rune-Midgarts, but it was very similar."
  npc_override_alberta_in_quests_alberta_well_we_sort_did_because_f07ad2: "Well, we sort of did, but that was because it was a direct order from our leader! If a knight is loyal and proud, he will accept his leader's orders without question!"
  npc_override_alberta_in_quests_alberta_well_your_name_sounds_be_15c015: "Well, your name sounds better than mine. And you have more hair on your head as well. Hmmm..."
