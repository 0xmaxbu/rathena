  npc_override_alberta_in_quests_alberta_there_s_no_light_stars_9b9c9b: "There's no light from the stars tonight, and we can't even see a hundred meters ahead of us. The men seem to feel something bad in the air."
  npc_override_alberta_in_quests_alberta_there_seem_more_more_ree_63cee9: "There seem to be more and more reefs to steer around, and they are growing larger as we travel. I wonder if we'll find land soon..."
