  npc_override_alberta_in_quests_alberta_there_lot_stories_about_5d201e: "There are a lot of stories about the amazing wealth that can be found on this island. However, everyone assumed that it was impossible to find Turtle Island."
  npc_override_alberta_in_quests_alberta_there_man_who_had_actual_e7d14f: "There was a man who had actually made it to Turtle Island before us. His records, however, never reached Rune-Midgarts. He was a great swordmaster known simply as ^3355FFOne^000000."
