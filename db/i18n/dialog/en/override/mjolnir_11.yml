Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_mjolnir_11_mjolnir_seal_absent_mindedness_f4bcae: "absent-mindedness!"
  npc_override_mjolnir_11_mjolnir_seal_actually_giant_illusion_9c19f1: "actually a giant. Illusion was used to disguise Thor's opponent, but I forget was it was. Do you know?"
  npc_override_mjolnir_11_mjolnir_seal_after_thor_lost_every_ma_f87a9f: "After Thor lost every match,"
  npc_override_mjolnir_11_mjolnir_seal_ah_971301: "Ah..."
  npc_override_mjolnir_11_mjolnir_seal_ah_i_like_you_already_50c41c: "Ah, I like you already, human! Now why don't you go do some warm ups, and we'll fight when you're ready."
  npc_override_mjolnir_11_mjolnir_seal_ah_i_see_entire_human_a91387: "Ah, I see that the entire human race is not worthy of scorn. Unlike many of your kind, I see that you respect your elders."
  npc_override_mjolnir_11_mjolnir_seal_ah_you_ve_brought_bd00f8: "Ah, you've brought"
  npc_override_mjolnir_11_mjolnir_seal_aims_sudri_s_legs_4c7fb4: "aims for Sudri's legs!"
  npc_override_mjolnir_11_mjolnir_seal_all_you_gain_here_few_cff719: "All you can gain here are a few herbs."
  npc_override_mjolnir_11_mjolnir_seal_alright_perhaps_i_m_mean_6c922c: "Alright. Perhaps I'm meant to help you out, so I'll upgrade a weapon for you. All you need to do is bring me the weapon and material."
  npc_override_mjolnir_11_mjolnir_seal_alright_then_902bbc: "Alright then..."
  npc_override_mjolnir_11_mjolnir_seal_also_means_if_weapon_des_c28666: "That also means that if the weapon is destroyed, any ^FF0000Cards^000000 inserted into the weapon will also be gone."
  npc_override_mjolnir_11_mjolnir_seal_although_alvis_answered_432903: "Although Alvis answered all of Thor's questions, he didn't notice the sun was rising."
  npc_override_mjolnir_11_mjolnir_seal_anything_i_hate_e6ae80: "anything I hate,"
  npc_override_mjolnir_11_mjolnir_seal_armor_a06680: "Armor?!"
  npc_override_mjolnir_11_mjolnir_seal_as_courteously_as_you_01a1e4: "as courteously as you can."
  npc_override_mjolnir_11_mjolnir_seal_as_matter_fact_forged_my_338b35: "As a matter of fact, it was forged by my ancestor. Mjolnir was the perfect weapon, except for one minor flaw."
  npc_override_mjolnir_11_mjolnir_seal_as_you_now_get_out_bd3f34: "as you! Now, get out of my sight!"
  npc_override_mjolnir_11_mjolnir_seal_attack_6cdd9c: "an attack!"
  npc_override_mjolnir_11_mjolnir_seal_attack_crossing_74f435: "attack by crossing"
  npc_override_mjolnir_11_mjolnir_seal_attack_graceful_bc965d: "attack with a graceful"
  npc_override_mjolnir_11_mjolnir_seal_attacks_sudri_s_head_74e39c: "attacks Sudri's head!"
  npc_override_mjolnir_11_mjolnir_seal_bad_things_happen_cc9d85: "Bad things happen"
  npc_override_mjolnir_11_mjolnir_seal_bah_8bc022: "Bah...!"
  npc_override_mjolnir_11_mjolnir_seal_barely_blocked_91c7c3: "barely blocked"
  npc_override_mjolnir_11_mjolnir_seal_battle_against_demons_th_73980a: "In a battle against demons a thousand years ago, Thor struck the earth with Mjolnir. The impact caused the ground to rise, creating this mountain."
  npc_override_mjolnir_11_mjolnir_seal_big_your_goals_ba1b1f: "big your goals are,"
  npc_override_mjolnir_11_mjolnir_seal_blacksmith_work_kind_stu_ea98cf: "Blacksmith work on that kind of stuff! Now, a Dwarf like me needs something that's more of a challenge!"
  npc_override_mjolnir_11_mjolnir_seal_bring_me_level_weapon_me_5db493: "Bring me a Level 4 weapon for me to work on next time, got it?"
  npc_override_mjolnir_11_mjolnir_seal_bring_me_something_064e6f: "Bring me something"
  npc_override_mjolnir_11_mjolnir_seal_bring_oridecon_e27a02: "bring an Oridecon."
  npc_override_mjolnir_11_mjolnir_seal_bwahahah_5d0080: "Bwahahah!"
  npc_override_mjolnir_11_mjolnir_seal_calm_down_380e3a: "Calm down, it"
  npc_override_mjolnir_11_mjolnir_seal_carefully_choose_words_03a969: "Carefully choose words"
  npc_override_mjolnir_11_mjolnir_seal_chest_6ab2ad: "on the chest!"
  npc_override_mjolnir_11_mjolnir_seal_clang_clang_caf003: "^3355FF*Clang Clang!*^000000"
  npc_override_mjolnir_11_mjolnir_seal_come_0b3a3d: "Come on..."
  npc_override_mjolnir_11_mjolnir_seal_come_i_ll_even_let_515ee0: "Come on, I'll even let you have the first hit. Just come to me when you're ready to fight!"
  npc_override_mjolnir_11_mjolnir_seal_come_me_human_f2fbbe: "come to me, human?"
  npc_override_mjolnir_11_mjolnir_seal_cool_let_s_fight_982eb8: "Cool, let's fight!"
  npc_override_mjolnir_11_mjolnir_seal_counter_attacked_620ce9: "counter attacked!"
  npc_override_mjolnir_11_mjolnir_seal_counters_f4f78a: "counters!"
  npc_override_mjolnir_11_mjolnir_seal_course_i_t_remember_ever_7ceaf1: "Of course, I can't remember everything clearly, but it was truly fantastic."
  npc_override_mjolnir_11_mjolnir_seal_critical_damage_97b079: "critical damage"
  npc_override_mjolnir_11_mjolnir_seal_dear_god_no_850255: "Dear God, no!"
  npc_override_mjolnir_11_mjolnir_seal_defeated_8c1756: "Defeated..."
  npc_override_mjolnir_11_mjolnir_seal_despite_minor_flaw_mjoln_20d7e2: "Despite this minor flaw, Mjolnir is still considered the greatest of legendary weapons."
  npc_override_mjolnir_11_mjolnir_seal_didn_t_i_tell_d499b8: "Didn't I tell"
  npc_override_mjolnir_11_mjolnir_seal_dodged_sudri_s_attack_ea_701081: "dodged Sudri's attack at ease."
  npc_override_mjolnir_11_mjolnir_seal_don_t_insult_me_expectin_06eb4f: "Don't insult me by expecting me to work on anything less than a Level 4 weapon."
  npc_override_mjolnir_11_mjolnir_seal_don_t_you_like_idea_dd9e73: "Don't you like the idea of challenging the limit? To me, upgrading feels like climbing unconquered mountains!"
  npc_override_mjolnir_11_mjolnir_seal_don_t_you_understand_14797b: "Don't you understand?"
  npc_override_mjolnir_11_mjolnir_seal_dream_i_traveled_9fca5d: "In this dream, I traveled"
  npc_override_mjolnir_11_mjolnir_seal_during_moment_4acde2: "during a moment of"
  npc_override_mjolnir_11_mjolnir_seal_dwarven_blacksmith_99ecc2: "Dwarven Blacksmith."
  npc_override_mjolnir_11_mjolnir_seal_dwarven_blacksmiths_dc8741: "The Dwarven Blacksmiths"
  npc_override_mjolnir_11_mjolnir_seal_dwarves_lightly_cc1ce8: "Dwarves lightly,"
  npc_override_mjolnir_11_mjolnir_seal_effect_our_world_somethi_ab46c5: "of effect it will have on our world, but something important will happen..."
  npc_override_mjolnir_11_mjolnir_seal_eh_d4552f: "Eh...?"
  npc_override_mjolnir_11_mjolnir_seal_eh_heh_heh_bcccc2: "Eh heh heh~"
  npc_override_mjolnir_11_mjolnir_seal_element_risk_3d035a: "element of risk!"
  npc_override_mjolnir_11_mjolnir_seal_eluniums_oridecons_e905ed: "Eluniums or Oridecons!"
  npc_override_mjolnir_11_mjolnir_seal_even_answer_me_cbd09b: "even answer me!"
  npc_override_mjolnir_11_mjolnir_seal_even_gods_know_we_dwarve_d40bf3: "Even the gods know that we Dwarves are the most talented of artisans! Maybe it doesn't seem that way now, but someday we shall return."
  npc_override_mjolnir_11_mjolnir_seal_even_more_562c9f: "with an even more"
  npc_override_mjolnir_11_mjolnir_seal_even_though_won_t_easy_9d3c4a: "Even though it won't be easy, I have faith that if the Dwarven Blacksmiths do exist, you'll be able to find them."
  npc_override_mjolnir_11_mjolnir_seal_every_good_blacksmith_kn_86af27: "Every good blacksmith knows the value of a good hammer. If you can understand that, I shall consider speaking with you."
  npc_override_mjolnir_11_mjolnir_seal_exchange_ores_you_brough_a6e0d8: "In exchange for the ores that you have brought me, I will give you one of my family treasures."
  npc_override_mjolnir_11_mjolnir_seal_feel_lonesome_c29419: "but feel lonesome..."
  npc_override_mjolnir_11_mjolnir_seal_feels_like_today_s_going_063cca: "It feels like today's going to be a great day."
  npc_override_mjolnir_11_mjolnir_seal_fight_i_think_i_might_33ed11: "a fight, I think I might"
  npc_override_mjolnir_11_mjolnir_seal_fight_me_huh_14507b: "fight with me, huh?"
  npc_override_mjolnir_11_mjolnir_seal_fight_stopped_bd7397: "and the fight has stopped!"
  npc_override_mjolnir_11_mjolnir_seal_fight_stronger_stronger_3f403f: "and fight with stronger and stronger opponents!"
  npc_override_mjolnir_11_mjolnir_seal_fighting_620066: "for fighting..."
  npc_override_mjolnir_11_mjolnir_seal_final_contest_thor_chall_573531: "For the final contest, Thor would challenge an old woman in a wrestling match. At first, Thor thought his victory was assured, but he learned that he could not defeat the old crone."
  npc_override_mjolnir_11_mjolnir_seal_find_suitable_799c70: "to find a suitable"
  npc_override_mjolnir_11_mjolnir_seal_finding_dwarves_a40e1d: "in finding the Dwarves!"
  npc_override_mjolnir_11_mjolnir_seal_fine_whatever_ec3075: "Fine! Whatever!"
  npc_override_mjolnir_11_mjolnir_seal_first_dwarf_you_must_vis_f85236: "The first Dwarf you must visit"
  npc_override_mjolnir_11_mjolnir_seal_first_eating_contest_tho_5f6825: "The first was an eating contest. Thor ate all of the meat on his table, but his opponent, Utgardaloki, ate his meat, the bones and even the plates."
  npc_override_mjolnir_11_mjolnir_seal_found_east_cc4084: "can be found to the East."
  npc_override_mjolnir_11_mjolnir_seal_found_north_0bd4c0: "can be found to the North."
  npc_override_mjolnir_11_mjolnir_seal_four_seals_been_released_e2b4d3: "Four seals have been released at the same time with the seal of [Mjolnir]."
  npc_override_mjolnir_11_mjolnir_seal_frankly_his_treasures_f307f2: "Frankly his treasures were"
  npc_override_mjolnir_11_mjolnir_seal_gained_hp_e18d62: "has gained 10 HP!"
  npc_override_mjolnir_11_mjolnir_seal_get_out_here_before_i_c73208: "Get out of here before I beat you to death! All you can gain over here is a few herbs, anyway!"
  npc_override_mjolnir_11_mjolnir_seal_get_out_here_go_your_1525ca: "Get out of here, and go to your human Blacksmiths if you want equipment upgrades!"
  npc_override_mjolnir_11_mjolnir_seal_giants_their_land_tests_267f85: "the giants of their land in tests of skill and strength."
  npc_override_mjolnir_11_mjolnir_seal_give_me_moment_48a972: "Give me a moment"
  npc_override_mjolnir_11_mjolnir_seal_give_you_useful_informat_af79e8: "give you useful information if you're fortunate enough to encounter the Dwarves."
  npc_override_mjolnir_11_mjolnir_seal_go_back_where_you_belong_5df9bd: "Go back to where you belong before I beat you to death!"
  npc_override_mjolnir_11_mjolnir_seal_go_out_train_some_get_b93e2f: "Go out, train some and get stronger before you even think about coming back!"
  npc_override_mjolnir_11_mjolnir_seal_going_16eb23: "going on!"
  npc_override_mjolnir_11_mjolnir_seal_good_virtuous_life_s_gre_d9c43e: "good and virtuous life. It's great to achieve your desires, but be aware that some desires are not meant to be fulfilled."
  npc_override_mjolnir_11_mjolnir_seal_great_6ead88: "Great...!"
  npc_override_mjolnir_11_mjolnir_seal_great_fight_6c367d: "That was a great fight!"
  npc_override_mjolnir_11_mjolnir_seal_greet_1d29f7: "Do not greet the"
  npc_override_mjolnir_11_mjolnir_seal_grrr_32da28: "Grrr...!"
  npc_override_mjolnir_11_mjolnir_seal_hahahahaha_9e31bd: "Hahahahaha!"
  npc_override_mjolnir_11_mjolnir_seal_hahahahahahahahahaah_7d8b27: "Hahahahahahahahahaah!"
  npc_override_mjolnir_11_mjolnir_seal_hammer_than_shake_earth_299bfc: "The hammer than can shake the earth and tear the sky asunder? Out of all of legendary weapons, Mjolnir is perhaps greatest."
  npc_override_mjolnir_11_mjolnir_seal_he_asked_thor_permission_6bfa5a: "He asked Thor for permission to marry Thrud, but as was expected, Thor refused. Alvis should have given up there, but he didn't."
  npc_override_mjolnir_11_mjolnir_seal_he_fell_love_thrud_thor_5ef772: "He fell in love with Thrud, Thor's first daughter, at first sight."
  npc_override_mjolnir_11_mjolnir_seal_he_too_ambitious_378d1e: "He was too ambitious."
  npc_override_mjolnir_11_mjolnir_seal_head_8dc52b: "on the head!"
  npc_override_mjolnir_11_mjolnir_seal_here_we_587fd2: "Here we are~"
  npc_override_mjolnir_11_mjolnir_seal_hey_44afd2: "Hey..."
  npc_override_mjolnir_11_mjolnir_seal_hilt_mjolnir_forged_shor_3f82c5: "The hilt of Mjolnir was forged shorter than intended. Are you still listening to me?"
  npc_override_mjolnir_11_mjolnir_seal_his_small_yet_svelte_bod_1d9de0: "his small, yet svelte, body."
  npc_override_mjolnir_11_mjolnir_seal_his_stout_arms_6369cb: "his stout arms."
  npc_override_mjolnir_11_mjolnir_seal_hit_8a3336: "hit {0}"
  npc_override_mjolnir_11_mjolnir_seal_hits_8f1aec: "hits {0}"
  npc_override_mjolnir_11_mjolnir_seal_hm_701c55: "Hm...?"
  npc_override_mjolnir_11_mjolnir_seal_hm_didn_t_i_ask_908237: "Hm, didn't I ask you to bring a Red Potion? There's no way I can tell any stories with such a dry throat~"
  npc_override_mjolnir_11_mjolnir_seal_hm_i_sense_you_asked_3fde7c: "Hm? I sense that you were asked to do a favor for that human. If I were you, I'd finish that task as soon as I could. Somehow, that human's fate, as well as that of the Dwarves, are intertwined..."
  npc_override_mjolnir_11_mjolnir_seal_hmm_9c4d28: "Hmm..."
  npc_override_mjolnir_11_mjolnir_seal_hmm_however_i_don_t_8138f6: "Hmm, however, I don't think they'll complain if I exchanged one of the treasures for something else. Let me think..."
  npc_override_mjolnir_11_mjolnir_seal_hmm_perhaps_ambitious_dw_6bedb9: "Hmm... But perhaps an ambitious dwarf can forge something similar to Mjolnir so that it can actually be used by humans. It would have less power, but it'd be perfectly crafted."
  npc_override_mjolnir_11_mjolnir_seal_hmmm_2ac89c: "Hmmm..."
  npc_override_mjolnir_11_mjolnir_seal_ho_ho_ho_167696: "Ho ho ho..."
  npc_override_mjolnir_11_mjolnir_seal_hopefully_someday_i_ll_l_05463d: "Hopefully someday I'll learn the truth about my dreams and about Mjolnir itself."
  npc_override_mjolnir_11_mjolnir_seal_how_about_278219: "How about it?"
  npc_override_mjolnir_11_mjolnir_seal_how_powerful_mjolnir_ebc466: "how powerful Mjolnir is."
  npc_override_mjolnir_11_mjolnir_seal_how_you_survive_1c536c: "How do you survive"
  npc_override_mjolnir_11_mjolnir_seal_however_humans_never_hop_8fca5f: "However, humans can never hope to see or even wield Mjolnir. Only a god can handle that kind of force."
  npc_override_mjolnir_11_mjolnir_seal_however_i_hope_you_under_9cc478: "However, I hope you understand that my family would grow suspicious if one of the treasures were to just go missing."
  npc_override_mjolnir_11_mjolnir_seal_however_while_created_st_93df53: "However, while it was created, a strange fly bit my ancestor on the hand. Because of this interruption, Mjolnir's hilt is a little flawed."
  npc_override_mjolnir_11_mjolnir_seal_huh_6ed1eb: "Huh."
  npc_override_mjolnir_11_mjolnir_seal_huh_80ee84: "Huh..."
  npc_override_mjolnir_11_mjolnir_seal_huh_a78e67: "Huh...?"
  npc_override_mjolnir_11_mjolnir_seal_huh_you_re_different_tha_d79882: "Huh. You're different than other humans. But still, trusting you because you know how to speak respectfully isn't very wise."
  npc_override_mjolnir_11_mjolnir_seal_human_isn_t_one_5e7790: "human? Isn't that one"
  npc_override_mjolnir_11_mjolnir_seal_hurry_up_get_one_1fc7bd: "Hurry up and get one."
  npc_override_mjolnir_11_mjolnir_seal_i_am_charge_northern_par_71721e: "I am in charge of this Northern part of Mount Mjolnir. If you wish to pass, you must first secure my approval!"
  npc_override_mjolnir_11_mjolnir_seal_i_am_nordri_08a9f3: "I am Nordri,"
  npc_override_mjolnir_11_mjolnir_seal_i_believe_976311: "I believe that"
  npc_override_mjolnir_11_mjolnir_seal_i_believe_you_102eb2: "I believe in you."
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_any_37c083: "I don't have any"
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_feel_4411c1: "I don't feel"
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_know_how_1fdf89: "I don't know how I can be much help to an adventurer like you. Aside from being a Blacksmith..."
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_know_how_95d5ca: "I don't know how"
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_much_time_491255: "I don't have much time, so go ahead and continue on your journeys if you can't bring those to me."
  npc_override_mjolnir_11_mjolnir_seal_i_don_t_think_s_3eb6cc: "I don't think that's right. Let me think, maybe I can remember it. Hopefully, it'll come to me sooner or later..."
  npc_override_mjolnir_11_mjolnir_seal_i_excuse_you_aca01a: "I excuse you?"
  npc_override_mjolnir_11_mjolnir_seal_i_feel_great_change_comi_daa6e2: "I feel that a great change is coming. I do not know what kind"
  npc_override_mjolnir_11_mjolnir_seal_i_feel_strange_force_gro_2810c3: "I can feel a strange force growing stronger and stronger, somewhere in Midgard."
  npc_override_mjolnir_11_mjolnir_seal_i_gave_my_all_c68ef9: "I gave it my all!"
  npc_override_mjolnir_11_mjolnir_seal_i_know_you_re_just_8b484c: "I know you're just being careful. Damn, I was just so eager to get"
  npc_override_mjolnir_11_mjolnir_seal_i_ll_waiting_day_when_60d41c: "I'll be waiting for the day when I'll see Thor's thunder for myself. I believe that the dream I've had will come true, one of these days."
  npc_override_mjolnir_11_mjolnir_seal_i_m_impressed_alright_i_1b50ea: "I'm impressed! Alright, I'll tell my friends good things about you. Hopefully, my brothers will give you the help you're looking for."
  npc_override_mjolnir_11_mjolnir_seal_i_m_little_thirsty_you_b16a75: "I'm a little thirsty. Would you bring me a Red Potion. If you do that for me, I will tell you an important story. Heh heh heh~"
  npc_override_mjolnir_11_mjolnir_seal_i_m_sooo_thirsty_be95b7: "I'm sooo thirsty!"
  npc_override_mjolnir_11_mjolnir_seal_i_m_sure_she_d4db30: "I'm sure that she can"
  npc_override_mjolnir_11_mjolnir_seal_i_m_sure_you_ll_2ef06b: "I'm sure you'll like it."
  npc_override_mjolnir_11_mjolnir_seal_i_m_surprised_see_0f4004: "I'm surprised to see"
  npc_override_mjolnir_11_mjolnir_seal_i_m_truly_lucky_meet_b592da: "I'm truly lucky to meet such an adventurer like yourself. I wish you the best of luck."
  npc_override_mjolnir_11_mjolnir_seal_i_m_waiting_day_when_24ea4e: "I'm waiting for the day when I'll finally get to see Thor's thunder for myself. I believe that one of these days, my dream will become reality."
  npc_override_mjolnir_11_mjolnir_seal_i_may_lost_c8f583: "I may have lost, but"
  npc_override_mjolnir_11_mjolnir_seal_i_must_admit_you_re_b497fc: "I must admit that you're a really strong human. Let us fight again when we have a chance. The next time, you may not be so lucky!"
  npc_override_mjolnir_11_mjolnir_seal_i_must_say_blacksmith_s_b36f88: "I must say, a Blacksmith's greatest pride comes when he creates the weapon and armor that can be considered his life's work."
  npc_override_mjolnir_11_mjolnir_seal_i_need_a957b9: "I need"
  npc_override_mjolnir_11_mjolnir_seal_i_no_regrets_when_failur_324e99: "I have no regrets when failure, and I'm always pleased when I'm successful. I'll upgrade everyday to make the best of my life~"
  npc_override_mjolnir_11_mjolnir_seal_i_nothing_cbf242: "I have nothing"
  npc_override_mjolnir_11_mjolnir_seal_i_really_hope_i_meet_5e4568: "I really hope I meet a decent human being next time. So far, I haven't met one useful human."
  npc_override_mjolnir_11_mjolnir_seal_i_regret_nothing_d12b39: "I regret nothing."
  npc_override_mjolnir_11_mjolnir_seal_i_remember_now_ff4161: "I remember now!"
  npc_override_mjolnir_11_mjolnir_seal_i_remembered_d17f05: "I remembered..."
  npc_override_mjolnir_11_mjolnir_seal_i_s_alright_a3e187: "I-It's alright!"
  npc_override_mjolnir_11_mjolnir_seal_i_see_fd141e: "I see..."
  npc_override_mjolnir_11_mjolnir_seal_i_see_i_still_appreciate_351431: "I see. But I still appreciate that you took the time to listen to me."
  npc_override_mjolnir_11_mjolnir_seal_i_seem_recall_i_put_d769f8: "I seem to recall that I put it somewhere around... Hmm."
  npc_override_mjolnir_11_mjolnir_seal_i_sense_change_winds_wha_62145b: "I sense change in the winds, but what that change may be, I cannot tell."
