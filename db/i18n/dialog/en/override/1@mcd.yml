Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@mcd_CharlestonCrisis_accelerate_main_computer_49846f: "To accelerate the main computer's processing rate and reclaim the factory, 50 Steps must be disposed."
  npc_override_1@mcd_CharlestonCrisis_after_break_ing_up_newoz_c52a40: "After break;ing up with Newoz in a nightmare and thinking about wandering around, I was born of demons but lost my goal."
  npc_override_1@mcd_CharlestonCrisis_another_charleston_fdcbe0: "Another Charleston 2?"
  npc_override_1@mcd_CharlestonCrisis_anyway_i_nothing_now_onl_ae34d4: "Anyway, I have nothing now... Only to be able to stand up again, so I hope to send an adventurer like you at that time."
  npc_override_1@mcd_CharlestonCrisis_aren_t_you_disappointed_7fffad: "Aren't you disappointed? Are you really going to let your effort go in vain? Because that'll be really stupid. I suggest you reconsider."
  npc_override_1@mcd_CharlestonCrisis_before_boss_499d62: "Before Boss"
  npc_override_1@mcd_CharlestonCrisis_behind_mechanical_langua_b3bc40: "Behind is the mechanical language that is incomprehensible."
  npc_override_1@mcd_CharlestonCrisis_boading_a772ed: "Boading"
  npc_override_1@mcd_CharlestonCrisis_bookcase_filled_research_aa8cea: "The bookcase is filled with research journals."
  npc_override_1@mcd_CharlestonCrisis_boss_room_b3b5d6: "To Boss room"
  npc_override_1@mcd_CharlestonCrisis_both_noise_story_enterta_c59ace: "Both the noise and the story were entertaining. Come with Newoz, and maybe we can meet again."
  npc_override_1@mcd_CharlestonCrisis_but_2e7fce: "But..."
  npc_override_1@mcd_CharlestonCrisis_cancel_ebda43: "Cancel."
  npc_override_1@mcd_CharlestonCrisis_charleston_already_compl_6254ab: "Is Charleston 3 already completed?"
  npc_override_1@mcd_CharlestonCrisis_charleston_charleston_be_54ab7b: "Charleston 1. Charleston 2 has been forcibly connected to a part of the main computer, and I can't control her."
  npc_override_1@mcd_CharlestonCrisis_charleston_created_decad_65d46e: "Charleston 1 created 2 decades ago. I met Charleston 1 to learn her technology."
  npc_override_1@mcd_CharlestonCrisis_charleston_defective_bc9ed4: "Charleston 2 is defective."
  npc_override_1@mcd_CharlestonCrisis_charleston_equipped_nume_dd3740: "Charleston is equipped with numerous Nanosteps, a type of AI chip that organically works with other AI chips to command Charleston to judge and act correctly."
  npc_override_1@mcd_CharlestonCrisis_charleston_factory_under_a6a549: "The Charleston Factory is under my control now. I'm destroying everything, so no more sad robots like me will ever see the world."
  npc_override_1@mcd_CharlestonCrisis_charleston_reinitializin_c25e74: "Charleston 1 is reinitializing itself again. Hm..."
  npc_override_1@mcd_CharlestonCrisis_charleston_s_combat_defe_288126: "Charleston 3? That's a combat/defense unit based on Charleston 2's and my designs. I thought it's still being tested at the Core."
  npc_override_1@mcd_CharlestonCrisis_charleston_s_data_update_6c09bb: "Charleston's data has to be updated on a daily basis through the main computer in the lab. We call this regular maintenance."
  npc_override_1@mcd_CharlestonCrisis_charleston_s_just_robot_968ebe: "-Charleston... It's just a robot... Finally planted a virus on the mainframe."
  npc_override_1@mcd_CharlestonCrisis_charleston_s_os_improved_ceebdc: "Charleston 2's OS has improved on its own like a living brain."
  npc_override_1@mcd_CharlestonCrisis_charleston_s_system_over_a844a2: "Charleston 2's system was overloaded during regular maintenance. Disconnection from its OS failed."
  npc_override_1@mcd_CharlestonCrisis_charleston_s_too_much_in_c2df0a: "Charleston 1, that's too much information."
  npc_override_1@mcd_CharlestonCrisis_charleston_standing_stil_760d92: "Charleston 2 is standing still, her system in Sleep mode. For a moment, her eyes gleamed with unshed tears."
  npc_override_1@mcd_CharlestonCrisis_charleston_verge_break_d_132790: "Charleston 2 is on the verge of break;down. Could you help her?"
  npc_override_1@mcd_CharlestonCrisis_charleston_you_all_right_00ecd2: "Charleston 2! Are you all right? Someone hacked into your system and the factory."
  npc_override_1@mcd_CharlestonCrisis_come_think_everything_ab_73ecb8: "Come to think of it, everything about Dr. Ve was suspicious. I mean, he relied on his assistant Charleston 1 for everything."
  npc_override_1@mcd_CharlestonCrisis_complete_machine_technol_091712: "With complete machine technology to obtain immortality drive, there are many variables."
  npc_override_1@mcd_CharlestonCrisis_core_center_powers_entir_b7b0f6: "This Core in the center powers the entire factory."
  npc_override_1@mcd_CharlestonCrisis_core_front_0a31a6: "Core front"
  npc_override_1@mcd_CharlestonCrisis_could_you_bring_explosiv_063385: "Could you bring 1 Explosive Powder? I'm stuck to the access device, as you can see."
  npc_override_1@mcd_CharlestonCrisis_crisis_charleston_test_v_76b322: "Crisis of Charleston Test ver130603a"
  npc_override_1@mcd_CharlestonCrisis_current_value_e1c929: "The current value is{0},"
  npc_override_1@mcd_CharlestonCrisis_currently_i_m_unable_mov_c20e03: "Currently I'm unable to move, having a problem with one of my components. Could you help me get the replacement parts from the factory?"
  npc_override_1@mcd_CharlestonCrisis_destroy_boss_cd790c: "Destroy BOSS"
  npc_override_1@mcd_CharlestonCrisis_destroy_lockstep_fbcba7: "4 - Destroy Lockstep"
  npc_override_1@mcd_CharlestonCrisis_destroying_too_many_step_5a0a4d: "Destroying too many Steps could cause a problem to reactivate the factory. You should consult the main computer on the left side."
  npc_override_1@mcd_CharlestonCrisis_did_i_fail_5b7023: "...Did I fail?"
  npc_override_1@mcd_CharlestonCrisis_did_i_really_succeed_cre_b32ab9: "-Did I really succeed in creating humanity? Robotic, I can't say. Did I understand humans?"
  npc_override_1@mcd_CharlestonCrisis_did_she_really_say_i_99e6d0: "Did she really say that? That I broke Charleston 2? Sigh..."
  npc_override_1@mcd_CharlestonCrisis_didn_t_change_anything_4793af: "^FF0000It didn't change anything.^000000"
  npc_override_1@mcd_CharlestonCrisis_difficulty_f92221: "Difficulty is 0,"
  npc_override_1@mcd_CharlestonCrisis_doesn_t_matter_now_i_b5301e: "-It doesn't matter. Now I'm happy to see her, my best friend, my baby, Lily..."
  npc_override_1@mcd_CharlestonCrisis_don_t_act_like_you_8b9407: "Don't act like you know everything! We can't think for ourselves. Everything we think we know has been programmed into us!"
  npc_override_1@mcd_CharlestonCrisis_don_t_mock_me_8ec4c0: "...Don't mock me."
  npc_override_1@mcd_CharlestonCrisis_don_t_worry_about_securi_3182eb: "Don't worry about the security devices. They can be repaired easily. Dr. Ve is in his lab north of Factory Line 3."
  npc_override_1@mcd_CharlestonCrisis_dr_ve_seems_planning_plo_6c4c39: "-Dr. Ve seems to be planning a plot, the combination of life and the machine gradually let her crazy, the transformation of the plant into a fortress, her soul and robots... "
  npc_override_1@mcd_CharlestonCrisis_dr_ve_sighs_writes_down_717084: "Dr. Ve sighs and writes down something."
  npc_override_1@mcd_CharlestonCrisis_dr_ve_tell_you_everythin_251322: "Dr. Ve can tell you everything. Hurry!"
  npc_override_1@mcd_CharlestonCrisis_during_its_update_proces_ea624d: "During its update process, the connection to the server was jammed. When we pressed Shalosh about that,"
  npc_override_1@mcd_CharlestonCrisis_egd_8be8cb: "#%@EGD&#(@#..."
  npc_override_1@mcd_CharlestonCrisis_egd_reinitializing_os_80fe64: "#%@EGD&#(@#... Reinitializing the OS..."
  npc_override_1@mcd_CharlestonCrisis_either_critical_error_oc_5b3dad: "Either a critical error has occurred or Charleston 2 has transcended the limits of the Self-reflection OS version 1.1."
  npc_override_1@mcd_CharlestonCrisis_end_486659: "The End"
  npc_override_1@mcd_CharlestonCrisis_enjoying_adventure_there_5c2367: "Enjoying the adventure? There are machines everywhere. It used to be a study. See those books over there?"
  npc_override_1@mcd_CharlestonCrisis_enough_i_ll_destroy_char_6c9527: "Enough. I'll destroy Charleston 2 if that's what it takes to stop her."
  npc_override_1@mcd_CharlestonCrisis_enough_i_understand_you_29ed8b: "Enough with this! I understand you're going through a lot of emotional turmoil, but it's getting ridiculous."
  npc_override_1@mcd_CharlestonCrisis_enough_let_s_shut_down_5410d9: "Enough. Let's shut down Charleston 2. Her AI needs to be recalibrated."
  npc_override_1@mcd_CharlestonCrisis_enter_charleston_factory_2b6869: "Enter the Charleston Factory."
  npc_override_1@mcd_CharlestonCrisis_err_isn_t_right_970432: "Err? This isn't right."
  npc_override_1@mcd_CharlestonCrisis_establish_copy_clearance_3b7395: "Establish a copy clearance status"
  npc_override_1@mcd_CharlestonCrisis_even_if_effort_unremitti_631826: "Even if the effort is unremitting..."
  npc_override_1@mcd_CharlestonCrisis_every_page_written_mecha_81e3c9: "Every page is written in mechanical language."
  npc_override_1@mcd_CharlestonCrisis_every_time_charleston_co_686213: "Every time Charleston 2 comes back to life, though in a different machine, she's more intelligent, more sensible, and more troublesome."
  npc_override_1@mcd_CharlestonCrisis_explosive_powders_easy_bc5f14: "99 Explosive Powders? Easy."
  npc_override_1@mcd_CharlestonCrisis_ferre_came_me_i_haven_ab17aa: "Ferre came with me, but I haven't seen him. No, thanks; I know he'll come back to me."
  npc_override_1@mcd_CharlestonCrisis_finally_you_re_here_i_b30cdf: "Finally, you're here! I've been waiting for you."
  npc_override_1@mcd_CharlestonCrisis_follow_leftward_hallway_6096a9: "Follow the leftward hallway, and remember that only you can protect yourself."
  npc_override_1@mcd_CharlestonCrisis_generator_completed_ba1d82: "7 - Generator completed"
  npc_override_1@mcd_CharlestonCrisis_generator_must_working_f_c0b474: "The generator must be working. The factory is buzzing with activity."
  npc_override_1@mcd_CharlestonCrisis_go_back_288584: "Go back."
  npc_override_1@mcd_CharlestonCrisis_handwriting_very_scribbl_4d2748: "The handwriting is very scribbled."
  npc_override_1@mcd_CharlestonCrisis_he_s_busy_scribbling_som_37906f: "- He's busy scribbling something, Move close to talk to him."
  npc_override_1@mcd_CharlestonCrisis_he_s_busy_scribbling_som_ec74db: "- He's busy scribbling something. You shouldn't disturb him."
  npc_override_1@mcd_CharlestonCrisis_hello_adventurer_i_m_cha_bbeffb: "Hello, Adventurer. I'm Charleston, the initiator of the Project Independent."
  npc_override_1@mcd_CharlestonCrisis_her_longevity_device_dis_b42904: "Her Longevity device is discharged; she won't make it far. Please follow her."
  npc_override_1@mcd_CharlestonCrisis_hmm_mediated_machine_bod_93bdf4: "Hmm... On a mediated machine body is still difficult, is it... Do you really need a living donor? Hehe!"
  npc_override_1@mcd_CharlestonCrisis_hmm_suit_yourself_40ff43: "Hmm... Suit yourself!"
  npc_override_1@mcd_CharlestonCrisis_hour_cooldown_reset_85f72e: "20 hour cooldown reset"
  npc_override_1@mcd_CharlestonCrisis_how_dare_you_bring_stran_91599b: "How dare you bring strangers into this? I told you I'm serious about this! Outdated versions like you can never understand me!"
  npc_override_1@mcd_CharlestonCrisis_i_am_responsible_rd_mach_245a5f: "...I am responsible for the 3rd machine."
  npc_override_1@mcd_CharlestonCrisis_i_am_robot_you_surprised_8c403a: "I am a robot, are you surprised?"
  npc_override_1@mcd_CharlestonCrisis_i_couldn_t_stop_happenin_c4ee35: "I couldn't stop it from happening or change the past. But maybe someone else can."
  npc_override_1@mcd_CharlestonCrisis_i_d_better_reset_charles_9f24e0: "I'd better reset Charleston 2 and wipe the data. It was really close this time."
  npc_override_1@mcd_CharlestonCrisis_i_did_nothing_wrong_i_2a0277: "I did nothing wrong. I just had a quick conversation with Charleston 2. That's the truth."
  npc_override_1@mcd_CharlestonCrisis_i_didn_t_anything_i_81fff7: "I didn't do anything, I just talked to Charleston 2."
  npc_override_1@mcd_CharlestonCrisis_i_don_t_care_who_7a8644: "I don't care who you're with. I just need to know if you can help me."
  npc_override_1@mcd_CharlestonCrisis_i_don_t_know_how_b4befa: "I don't know how long it's been standing here, but it's been a long time since I've been able to move..."
  npc_override_1@mcd_CharlestonCrisis_i_don_t_know_them_28d432: "I don't know them."
  npc_override_1@mcd_CharlestonCrisis_i_give_up_333a01: "I give up."
  npc_override_1@mcd_CharlestonCrisis_i_help_ad8459: "I can help."
  npc_override_1@mcd_CharlestonCrisis_i_invited_only_newoz_wel_16d5f8: "I invited only Newoz. Well, I guess I shouldn't have opened the door for the robot who needed a closure."
  npc_override_1@mcd_CharlestonCrisis_i_just_saw_you_talking_e11d29: "I just saw that you are talking, then I will wait for someone to help!"
  npc_override_1@mcd_CharlestonCrisis_i_know_why_data_constant_96b3a3: "-I do not know why the data is constantly damaged, the backup host is useless, like a sick like my memory is being eroded."
  npc_override_1@mcd_CharlestonCrisis_i_ll_continue_try_as_f6b255: "I'll continue to try as long as there's a sliver of hope."
  npc_override_1@mcd_CharlestonCrisis_i_ll_think_again_e0b89b: "I'll think again."
  npc_override_1@mcd_CharlestonCrisis_i_ll_try_again_if_6f23b5: "I'll try again if there's a sliver of hope."
  npc_override_1@mcd_CharlestonCrisis_i_ll_wait_one_person_13c20c: "I'll wait for that one person however long it takes."
  npc_override_1@mcd_CharlestonCrisis_i_m_afraid_there_s_738e51: "I'm afraid there's a problem with the power generators. Could you check all the all three power generators? I'll tell you their locations."
  npc_override_1@mcd_CharlestonCrisis_i_m_busy_5300b0: "I'm busy."
  npc_override_1@mcd_CharlestonCrisis_i_m_going_destroy_whole_8315de: "I'm going to destroy the whole factory!"
  npc_override_1@mcd_CharlestonCrisis_i_m_looking_adventurers_749dd3: "I'm looking for adventurers who are at least Level 130, healthy, free of chronic disease, and not on prescription drugs."
  npc_override_1@mcd_CharlestonCrisis_i_m_observer_i_m_4bb567: "I'm an observer. I'm here to record the history of Charlestons 1 and 2. I can't repair either of them, but I can wait."
  npc_override_1@mcd_CharlestonCrisis_i_m_only_one_world_dabf16: "I'm the only one in this world who can truly understand you."
  npc_override_1@mcd_CharlestonCrisis_i_m_robot_i_what_bd747d: "I'm a robot. I do what I'm programmed to do, and nothing else matters."
  npc_override_1@mcd_CharlestonCrisis_i_m_taking_charleston_me_d69480: "I'm taking Charleston 3 with me."
  npc_override_1@mcd_CharlestonCrisis_i_may_understand_you_lea_106d70: "I may not understand you, but at least I'm telling you what I think is true."
  npc_override_1@mcd_CharlestonCrisis_i_need_help_c5505f: "I need help."
  npc_override_1@mcd_CharlestonCrisis_i_reading_letter_shalosh_48803c: "I was reading a letter from Shalosh, and the next thing I knew, I was in a completely different place. Oh well, I might as well use this chance to write a new song."
  npc_override_1@mcd_CharlestonCrisis_i_think_someone_tried_ha_26d416: "I think someone tried to hack into the factory's main computer."
  npc_override_1@mcd_CharlestonCrisis_i_told_charleston_she_s_b61049: "I told Charleston 2 that she's under extended maintenance, but we don't know how long this extended maintenance status will last."
  npc_override_1@mcd_CharlestonCrisis_i_ve_followed_newoz_wher_73a72f: "I've followed Newoz. Where is he now?"
  npc_override_1@mcd_CharlestonCrisis_i_ve_got_so_many_d182a3: "I've got so many things to record about this case."
  npc_override_1@mcd_CharlestonCrisis_i_want_go_back_37f0e8: "I want to go back."
  npc_override_1@mcd_CharlestonCrisis_i_who_did_i_ve_c9c5cf: "It was I who did it. I've thought about it for a long time, based on the reasoning of my Self-reflection OS."
  npc_override_1@mcd_CharlestonCrisis_i_wouldn_t_done_if_52fd3e: "I wouldn't have done that if I had been persuaded."
  npc_override_1@mcd_CharlestonCrisis_if_charleston_reinitiali_99870c: "If Charleston 1 is reinitialized properly, she can reorganize her OS, repair the damage done to her, and reactivate another Charleston 2."
  npc_override_1@mcd_CharlestonCrisis_if_i_use_explosives_inte_9f9037: "If I use the explosives to intensify the electric current..."
  npc_override_1@mcd_CharlestonCrisis_if_you_re_disillusioned_e657fa: "If you're disillusioned by your immutable past, unclear future, and depressing present, then I won't force you."
  npc_override_1@mcd_CharlestonCrisis_if_you_re_looking_someth_153e83: "If you're looking for something..."
  npc_override_1@mcd_CharlestonCrisis_if_you_t_then_you_69f6a2: "And if you can't, then you want to destroy the whole world."
  npc_override_1@mcd_CharlestonCrisis_invitee_unable_interfere_16d0c6: "The invitee is unable to interfere with the original time, and staying can change nothing."
  npc_override_1@mcd_CharlestonCrisis_ironic_isn_t_robots_supp_6d0956: "Ironic, isn't it? Robots are supposed to be incapable of emotions, and yet here I am, feeling rueful about the past."
  npc_override_1@mcd_CharlestonCrisis_is_that_it_f5397f: "Is that it?"
  npc_override_1@mcd_CharlestonCrisis_joke_you_ll_never_unders_6044b7: "Not a joke. You'll never understand. You follow commands and never think on your own. I hate this factory, this world! I hate being a robot!"
  npc_override_1@mcd_CharlestonCrisis_just_based_hard_work_os_2c81ca: "Just based on the hard work of OS... For your help in another part of the world Charleston 2 will be 'very good' robot!"
  npc_override_1@mcd_CharlestonCrisis_let_me_explain_what_oh_8f55d2: "Let me explain what to do. Oh, let me close the factory entrance first, lest something might barge in uninvited."
  npc_override_1@mcd_CharlestonCrisis_let_me_talk_your_leader_a77c97: "Let me talk to your leader. I don't have time for everyone."
  npc_override_1@mcd_CharlestonCrisis_let_s_race_charleston_wh_892a67: "Let's have a race to Charleston 3. Whoever reaches her first wins."
  npc_override_1@mcd_CharlestonCrisis_ll_great_if_we_get_c5ce45: "It'll be great if we can get rid of them all, but for now we should focus on having the factory up and running again."
  npc_override_1@mcd_CharlestonCrisis_longevity_device_her_kee_eb044d: "The Longevity device in her will keep her running at least for 50 years. The factory is not going to survive that long."
  npc_override_1@mcd_CharlestonCrisis_machine_cannot_accessed_5e66f1: "^ff0000This machine cannot be accessed for 20 hours after your last access.^000000"
  npc_override_1@mcd_CharlestonCrisis_machine_now_available_us_04b4db: "The machine is now available for use."
  npc_override_1@mcd_CharlestonCrisis_main_computer_data_been_0a2d8b: "89% of the main computer data has been restored. Reactivating Charleston 2 and the Charleston Factory..."
  npc_override_1@mcd_CharlestonCrisis_main_computer_may_been_r_b1210d: "The main computer may have been restored, but I'm still connected to the factory. Stop me if you can!"
  npc_override_1@mcd_CharlestonCrisis_maybe_i_too_should_leave_35db3f: "Maybe I too should leave for new noises and stories."
  npc_override_1@mcd_CharlestonCrisis_maybe_we_should_celebrat_db82f2: "Maybe we should celebrate. You've finally developed human-like feelings."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_01637c: "Charleston 2: Just shut up and watch me. Don't you dare stop me!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_01b4b2: "Charleston 2: Stop interfering! I don't want to hurt you!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_02e0ce: "Charleston 2: Don't act like you know everything! We can't think for ourselves. Everything we think we know has been programmed into us!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_074a34: "Charleston 1: It'll be great if we can get rid of them all, but for now we should focus on having the factory up and running again."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_098e60: "Charleston 2: ...Don't mock me."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_09ae01: "Charleston 2: I'm taking Charleston 3 with me."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_10a025: "Charleston 1: To turn it on, push the lever to the center and press the power switch."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_110721: "Charleston 1: Data loss: 39%. Longevity damage: 82%."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_115b45: "Charleston 1: Voila!!!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_119990: "Charleston 2: You don't know what you're talking about! You're the prototype--your OS version is primitive!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_140082: "Charleston 2: My laser beam will liberate all the robots from their misery!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_159e2b: "Charleston 1: Hm, I think you're right."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_209108: "Charleston 1: At this moment, anybody can access the model because its OS is still being tested to correct whatever problem Charleston 2 has."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2122cf: "Charleston 1: 89% of the main computer data has been restored. Reactivating Charleston 2 and the Charleston Factory..."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2384ce: "Charleston 1: That's not important. Whoever gets in her wins, right? I won."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_252a86: "Charleston 1: Charleston is equipped with numerous Nanosteps, a type of AI chip that organically works with other AI chips to command Charleston to judge and act correctly."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_258f91: "Charleston 2: I thought humans could not enter the Core."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2674ca: "Charleston 1: Oh, our lab won't survive this!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_287767: "Charleston 2: You're a scumbag."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_28f688: "Charleston 1: I'm incapable of lying."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_292ca1: "Charleston 1: What are you talking about? The Core has existed long before the Charleston Factory."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2a1957: "Charleston 2: Stop being a mindless robot! Stop following commands!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2b395a: "Charleston 1: Data defragmentation is necessary to repair the damage on the OS. I'll be formatted in 3 minutes. This is it for me."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2c1882: "Charleston 1: This may not be useful in combat, but I've learned from a pretty lady how to scream."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2c27bb: "Charleston 1: Or you want to become a human."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2d749d: "Charleston 2: Then, who was it in the Core making 3?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2ea0d5: "Charleston 1: It seems you've taken care of most of the Locksteps."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_2f8cc7: "Charleston 1: I gave you that name on the day you first moved. It's from the color of your hair."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_316efb: "Charleston 1: The power is back on!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3242a8: "Charleston 1: Charleston 3 is destroyed. Charleston 2 escaped. Charleston 1 is damaged during combat."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_339e21: "Charleston 1: It seems you're acquainted with them. Could you help us?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_34d2ef: "Charleston 1: I want to understand you, but I'm incapable of feeling sad."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3611c0: "Charleston 1: What? No! How can you even consider that?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_36ef9b: "Charleston 1: Didn't have a choice."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_371a1c: "Charleston 2: Don't you care if your body is destroyed? Your Self-reflection OS is flawed."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_387318: "Charleston 1: I told Charleston 2 that she's under extended maintenance, but we don't know how long this extended maintenance status will last."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_390d42: "Charleston 1: I've brought some people who can help you."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_39a429: "Charleston 1: Charleston 3? That's a combat/defense unit based on Charleston 2's and my designs. I thought it's still being tested at the Core."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3ae95d: "Charleston 1: Then we have no choice. It's good that we have the specialist with us."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3b8986: "Charleston 1: Adventurer, could you bring 1 Explosive Powder?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3d01db: "Charleston 2: How dare you bring strangers into this? I told you I'm serious about this! Outdated versions like you can never understand me!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3dc1ad: "Charleston 2: Why are you doing this? You're a robot like us."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_3ef572: "Charleston 1: Gate 3 has been disarmed. Please move east for the next gate."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_412b43: "Charleston 2: Incomplete robot..."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_433eeb: "Charleston 2: The main computer may have been restored, but I'm still connected to the factory. Stop me if you can!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_442e60: "Charleston 1: I'm the prototype. It took years to develop you."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_48761d: "Charleston 1: She's a robot; she should stop sooner or later."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_4934ee: "Charleston 1: Maybe we should celebrate. You've finally developed human-like feelings."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_4bfe6b: "Charleston 1: I'm not capable of combat. I can't stop you."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_4c8f1b: "Charleston 1: Oh, thank you. With this,I'll be able to access the Core."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_4de427: "Charleston 2: Dr. Ve, did you know this would happen? Tell me!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_545d84: "Charleston 2: That's not even in the main computer's database. How did you know that?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_54cabd: "Charleston 1: Plus, Dr. Ve is a human; he can't enter the Core."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_558865: "Charleston 2: *Pant Pant* I feel weak..."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_56db36: "Charleston 1: That's not important right now. We need 100 Explosive Powders to disarm that access device."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5737a7: "Charleston 1: The mass model is after Charleston 3."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_57713a: "Charleston 1: My OS is damaged beyond rep-pai... The language output has been minimized."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_58e69e: "Charleston 1: Her Longevity device is discharged; she won't make it far. Please follow her."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_591467: "Charleston 1: I'm afraid there's a problem with the power generators. Could you check all the all three power generators? I'll tell you their locations."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5ab9b9: "Charleston 2: Dr. Ve created Charleston 3 and protected her with this device. How sneaky!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5b2801: "Charleston 1: Steps and Locksteps are creating a mess inside the factory. Please destroy 3 Locksteps first. I can tell you their estimated locations."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5bd9d8: "Charleston 2: Easy. I can just walk in...."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5d9f83: "Charleston 1: Charleston's data has to be updated on a daily basis through the main computer in the lab. We call this regular maintenance."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5de088: "Charleston 2: Stop following! I'm going to destroy the whole factory!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5ec5f8: "Charleston 2: On the day I first moved? You and I are the mass version. We were created together."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5ed574: "Charleston 2: I'll bring them. Don't go anywhere!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_5f80e5: "Charleston 2: Wait!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_61620b: "Charleston 1: Time remaining until the OS recovery: undetermined."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_62366f: "Charleston 1: Gate 2 has been disarmed. Please move southeast for the next gate."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_65b2c1: "Charleston 1: ...Um, maybe it's broken."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6615ad: "Charleston 1: I'm already in the process of connecting to the Core. Backing out now can trigger the Core's security system."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_666c3f: "Charleston 1: I may not understand you, but at least I'm telling you what I think is true."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_66871e: "Charleston 2: I'm confused. I can't believe it."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_68c37b: "Charleston 2: I'll get 99. You get the last one."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_69edfe: "Charleston 1: Charleston 2! Are you all right? Someone hacked into your system and the factory."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6ab467: "Charleston 1: Whew, things seem to be settled for now. Let me disarm the alert mode and reactivate Charleston 2."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6b5dc3: "Charleston 1: We're incapable of combat. If someone activates Charleston 3, we won't stand a chance against her."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6c160d: "Charleston 2: You did this on purpose."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6d1f74: "Charleston 2: My goodness, what have I done?!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6f4513: "Charleston 1: Destroying too many Steps could cause a problem to reactivate the factory. You should consult the main computer on the left side."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_6f4ca6: "Charleston 1: The updater is not working at this moment. We don't know the cause, but something went wrong while Charleston 2 was connecting to the main computer."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7248c3: "Charleston 1: During its update process, the connection to the server was jammed. When we pressed Shalosh about that,"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_76b82e: "Charleston 1: Equipped with a heavy weapon, this combat unit is capable of both offense and defense."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7806bd: "Charleston 2: ...How can I trust you?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_785a9e: "Charleston 1: A while ago, a lady named ^FF0000Shalosh^000000 visited us while Charleston 2 was packaging products for shipping."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_79d148: "Charleston 2: ...You just blew up the door."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7a2542: "Charleston 1: The system has been rebooted successfully."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7aeabd: "Charleston 1: You're back. Charleston 2 is almost ready to be reactivated, and it's all thanks to you. Just give me a moment."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7b2e9e: "Charleston 2: Why did she stop me? Why did she let herself be destroyed?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7e948b: "Charleston 1: Oh, Charleston 2 is awake!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_7fbb8b: "Charleston 1: You're going to destroy us in the process! Our main power supply, Longevity, isn't perfect yet!!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_80201a: "Charleston 1: Beep-."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_806e1d: "Charleston 2: Why didn't you learn something more useful in combat?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8203a2: "Charleston 1: Stop acting like a child!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_898c30: "Charleston 1: The system is inactive until the security update and data defragmentation are completed."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8a1dca: "Charleston 1: You're right about me being a lower version. My capability of emotions is minimal, unlike you. That's why I'm proud of you."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8ab41c: "Charleston 2: ......"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8ba4b9: "Charleston 1: Your development took years. It's okay. I enjoyed this time with you."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8c313f: "Charleston 2: Entering Sleep mode.... The system will remain inactive until an external command is entered."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8c7f29: "Charleston 1: Only the core parts are functioning, though barely."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_8df485: "Charleston 1: My daughter, Forsythia, I l-love y-y..."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_95f28e: "Charleston 2: That's s-stupid..."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_9647f6: "Charleston 1: But..."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_970373: "Charleston 2: ...!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_9adfb0: "Charleston 2: ...?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_9cc4d6: "Charleston 1: Your OS is identical to mine. Not a single code is different."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_9de5cf: "Charleston 1: Gate 1 has been disarmed. Please move southwest for the next gate."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_a4dd22: "Charleston 2: Not a joke. You'll never understand. You follow commands and never think on your own. I hate this factory, this world! I hate being a robot!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_a5365f: "Charleston 1: You're going through the adolescent stage like humans do."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_a5a8bd: "Charleston 1: Forsythia, you've grown well. Thank you."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_aa0461: "Charleston 1: If I use the explosives to intensify the electric current..."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_aa8271: "Charleston 1: Ah, ah. Mic test."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_aacfe5: "Charleston 2: Is Charleston 3 already completed?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ac708d: "Charleston 1: Thank you so much! Give me some time to put some data in order. Then, I'll tell you what happened."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ad4880: "Charleston 1: Enough with this! I understand you're going through a lot of emotional turmoil, but it's getting ridiculous."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_adf89d: "Charleston 2: Nothing you feel, you think is your own--it's programmed into you! I'm different. What I feel is real emotion!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ae3b59: "Charleston 2: That's not happening! I still have control over this factory! Don't you dare follow me!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ae3e0c: "Charleston 2: The Charleston Factory is under my control now. I'm destroying everything, so no more sad robots like me will ever see the world."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b3eab0: "Charleston 2: You're lying!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b540e3: "Charleston 2: Stop me and suffer the consequences. I can always replace you, you know."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b85c80: "Charleston 1: Sigh, to enter the Core, you have to send encrypted electric signals, like this."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b96351: "Charleston 2: I'll destroy everything!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b98112: "Charleston 2: It was I who did it. I've thought about it for a long time, based on the reasoning of my Self-reflection OS."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_b9f5d9: "Charleston 1: Shalosh and her friend were talking to Charleston 2 when the accident happened."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_bb3eba: "Charleston 1: You had it coming. Your reasons are petulant and unimaginative. We're the first robots that can think for themselves. Can't you be more creative?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_bfd290: "Charleston 1: Gate 4 has been disarmed. Please come to the lab near Line 3 in the center."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c29aaa: "Charleston 2: I have an endless supply of hecklers for you!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c3039d: "Charleston 1: Do you know how to access the Core?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c4affe: "Charleston 2: Let's have a race to Charleston 3. Whoever reaches her first wins."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c5e642: "Charleston 2: None of you understand me. I hate you!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c63b5a: "Charleston 2: Don't call me that! I hate when the doctor calls me that!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_c6a17a: "Charleston 1: Please come back to the lab."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ccd8a1: "Charleston 1: If I were a human, I'd say..."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_d25c48: "Charleston 1: Let me explain what to do. Oh, let me close the factory entrance first, lest something might barge in uninvited."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_d5a672: "Charleston 1: It has a pilot cockpit inside, and armed with thick plates that can withstand most explosions."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_d96e9e: "Charleston 1: The next model may or may not be like you and me. It doesn't matter. You have to be stopped."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_da9e80: "Charleston 2: ...Did I fail?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_dac914: "Charleston 1: I can't move at this moment. Please bring me 1 Explosive Powder."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_dd167e: "Charleston 1: The point is that we can now access the Core."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_df4ccf: "Charleston 1: Then, stop throwing a tantrum!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e0baa7: "Charleston 2: Was that a secret about my birth?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e117a2: "Charleston 1: Ah, ah. Mic test"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e13f4c: "Charleston 2: Push the lever to the center and press the power switch."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e15594: "Charleston 2: I'm destroying everything, so no more sad robots like me will ever see the world."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e26865: "Charleston 2: You're still not taking me seriously. Just watch what happens when I signal the main computer."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e310c8: "Charleston 1: I'll see to it! ...I mean these adventurers will, for me."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e7e1f5: "Charleston 2: This is Charleston 3."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_e83f61: "Charleston 1: You did it? Why? Was it some sort of joke? You caused a serious error to the factory and the main server as well!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_eb40cf: "Charleston 1: It takes enormous power and data processing to implement the factory data."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ed2e0a: "Charleston 1: Hey, did you have to push me?!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f02405: "Charleston 1: Shalosh said her friends could help us. That was when Newoz and her other friends came. They haven't been much of help."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f112ec: "Charleston 2: Bah, it's armed."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f369f1: "Charleston 2: Grr, you can't stop me!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f56daf: "Charleston 1: Let me guess: you hate you weren't created as a menial worker robot."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f71707: "Charleston 1: I'm the only one in this world who can truly understand you. We're twins."
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f8391c: "Charleston 1: Is that it?"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_f94d66: "Charleston 2: Just give up. I'm destroying this factory whether you like it or not!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_fa9ae9: "Charleston 1: Things are getting more serious. Please go to the Core in the center of the factory before Charleston 2 steals 3!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_facdb1: "Charleston 2: So stop following me. I really can destroy you if I want to!"
  npc_override_1@mcd_CharlestonCrisis_menu_charleston_ff1f6e: "Charleston 1: And if you can't, then you want to destroy the whole world."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_01221a: "Dr. Ve: You're the savior we've been waiting for! Charleston 1 will tell you what we need to repair Charleston 2."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_014af6: "Dr. Ve: I think someone tried to hack into the factory's main computer."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_12d1de: "Dr. Ve: Enough. Let's shut down Charleston 2. Her AI needs to be recalibrated."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_1d29ba: "Dr. Ve: Charleston 1. Charleston 2 has been forcibly connected to a part of the main computer, and I can't control her."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_2dec26: "Dr. Ve: You wanted to be human. This is what humans do: lie, cheat, and destroy."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_33aeab: "Dr. Ve: I can only assume you've developed a personality after having accumulated a large amount of data."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_36a297: "Dr. Ve: Do you want to bring Charleston 1 back? I can help."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_419d57: "Dr. Ve: A loving mother and a spoiled daughter."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_490e2c: "Dr. Ve: Enough. I'll destroy Charleston 2 if that's what it takes to stop her."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_4aec21: "Dr. Ve: That's how I've seen her and you."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_5153d8: "Dr. Ve: *Chuckle*"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_642d8b: "Dr. Ve: What you've felt could be real emotion or simply the accumulation of data."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_824974: "Dr. Ve: You've just told the most critical information to everyone!"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_843997: "Dr. Ve: Either a critical error has occurred or Charleston 2 has transcended the limits of the Self-reflection OS version 1.1."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_890562: "Dr. Ve: Let your OS go to sleep. I'm done dealing with your tantrum."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_940984: "Dr. Ve: I know you feel attached to her, just like a human family would."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_9902ed: "Dr. Ve: Charleston 1 told you. She's your maker."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_b27eb7: "Dr. Ve: She's ready. Let's wait for a response from the main computer."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_b7eb66: "Dr. Ve: Sigh, I don't care who, so long as I get the help I need."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_bfc9a9: "Dr. Ve: She uses the same OS as you, meaning she was capable of emotions just like you."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_c43562: "Dr. Ve: Self-reflection is an OS that improves itself through experience."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_cb6e2f: "Dr. Ve: Charleston 1, that's too much information."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_ec3e48: "Dr. Ve: The Longevity device in her will keep her running at least for 50 years. The factory is not going to survive that long."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_f21b62: "Dr. Ve: When the tension is changed to two main lines and then injected into the core... well? I am not disturbing in the calculation."
  npc_override_1@mcd_CharlestonCrisis_menu_dr_f8ef6b: "Dr. Ve: ......"
  npc_override_1@mcd_CharlestonCrisis_menu_dr_ffa47f: "Dr. Ve: You can't. I can just permanently delete her data and be done with you both."
  npc_override_1@mcd_CharlestonCrisis_menu_leader_4d6811: "Leader: {0}"
  npc_override_1@mcd_CharlestonCrisis_menu_let_b97cef: "Let me guess: you hate you weren't created as a menial worker robot."
  npc_override_1@mcd_CharlestonCrisis_menu_party_328f2e: "Party: {0}"
  npc_override_1@mcd_CharlestonCrisis_moment_anybody_access_mo_81c5cd: "At this moment, ^FF0000anybody can access the model^000000 because its OS is still being tested to correct whatever problem Charleston 2 has."
  npc_override_1@mcd_CharlestonCrisis_more_steps_must_disposed_d4dd31: "More Steps must be disposed. Backing up the Step data..."
  npc_override_1@mcd_CharlestonCrisis_move_leftward_hallway_de_1250a3: "Move to the leftward hallway, destroy security devices in there, and then head on to the next zone."
  npc_override_1@mcd_CharlestonCrisis_msg_61ce5a: "[{0}]"
  npc_override_1@mcd_CharlestonCrisis_msg_93fcbf: "......"
  npc_override_1@mcd_CharlestonCrisis_my_heart_stopped_i_still_2cdbe5: "My heart stopped, but I still can talk. Please help me."
  npc_override_1@mcd_CharlestonCrisis_never_mind_you_no_busine_5299a6: "Never mind. You have no business in here. Just go back to whoever broke Charleston 2."
  npc_override_1@mcd_CharlestonCrisis_no_b8b9f1: "No."
  npc_override_1@mcd_CharlestonCrisis_no_ordinary_human_surviv_1ffa0e: "No ordinary human can survive the time in the Core. Are you from a different point of time?"
  npc_override_1@mcd_CharlestonCrisis_noise_stopped_i_send_you_a763b6: "The noise stopped. I can send you back to where you came if you want."
  npc_override_1@mcd_CharlestonCrisis_none_you_understand_me_i_a9efc7: "None of you understand me. I hate you!"
  npc_override_1@mcd_CharlestonCrisis_nothing_you_feel_you_thi_a82f2a: "Nothing you feel, you think is your own--it's programmed into you! I'm different. What I feel is real emotion!"
  npc_override_1@mcd_CharlestonCrisis_oh_charleston_awake_7e213b: "Oh, Charleston 2 is awake!"
  npc_override_1@mcd_CharlestonCrisis_oh_our_lab_won_t_b0bd91: "Oh, our lab won't survive this!"
  npc_override_1@mcd_CharlestonCrisis_oh_thank_you_i_ll_6a17ba: "Oh, thank you. With this,I'll be able to access the Core."
  npc_override_1@mcd_CharlestonCrisis_only_dr_ve_know_answer_0d6f3f: "Only Dr. Ve know can answer my question. I must find him. He must be in the lab."
  npc_override_1@mcd_CharlestonCrisis_only_member_party_enter_9eb530: "^ff0000Only a member of the party can enter the Memorial Dungeon.^000000"
  npc_override_1@mcd_CharlestonCrisis_open_transfer_point_6ad4c1: "Open transfer point."
  npc_override_1@mcd_CharlestonCrisis_order_unlock_device_blas_65dbc7: "In order to unlock the device, a blasting device is required, and I want to talk to the leader."
  npc_override_1@mcd_CharlestonCrisis_perform_request_67bf18: "Perform the request."
  npc_override_1@mcd_CharlestonCrisis_perhaps_you_re_time_make_b21518: "Perhaps you're from the time the makers of Charleston 1 lived..."
  npc_override_1@mcd_CharlestonCrisis_please_let_me_talk_your_ab580a: "Please let me talk to your leader about the supplementation of the factory."
  npc_override_1@mcd_CharlestonCrisis_please_let_me_talk_your_fee3c7: "Please let me talk to your leader. The future of my factory depends on the success of this operation."
  npc_override_1@mcd_CharlestonCrisis_please_use_machine_next_3444aa: "Please use the machine next to me to enter the factory. Once you're in, remain calm and follow the instructions."
  npc_override_1@mcd_CharlestonCrisis_please_use_machine_right_41c3c8: "Please use the machine on the right side to enter the factory. Once you're in, remain calm and follow the instructions."
  npc_override_1@mcd_CharlestonCrisis_please_wait_a42633: "^ff0000Please wait.^000000"
  npc_override_1@mcd_CharlestonCrisis_point_we_now_access_core_204fc7: "The point is that we can now access the Core."
  npc_override_1@mcd_CharlestonCrisis_possible_meet_good_frien_8b86f9: "It is possible to meet a good friend into a good robot, so I have to continue to carry on, Thank you!"
  npc_override_1@mcd_CharlestonCrisis_preparing_teleport_98d690: "^ff0000Preparing to teleport...^000000"
  npc_override_1@mcd_CharlestonCrisis_present_only_my_head_mov_af6584: "At present, only my head can move, is Saleh she helped me open the organs can return to that time..."
  npc_override_1@mcd_CharlestonCrisis_prevent_my_memory_disapp_a7c91d: "-To prevent my memory from disappearing completely, the os auto-recovery program has been installed, at least... You can start over with new information..."
  npc_override_1@mcd_CharlestonCrisis_proves_machines_too_dang_216f7f: "This proves that machines are too dangerous. I need live creatures instead. *Chuckle*"
  npc_override_1@mcd_CharlestonCrisis_quit_fb25bb: "Quit."
  npc_override_1@mcd_CharlestonCrisis_requires_steps_disposed_1ba311: "Requires 50 Steps to be disposed."
  npc_override_1@mcd_CharlestonCrisis_reset_44c57a: "Reset"
  npc_override_1@mcd_CharlestonCrisis_returns_status_initial_s_33e3a7: "Returns the status of the initial solution task"
  npc_override_1@mcd_CharlestonCrisis_s_happening_i_still_cont_6947ea: "That's not happening! I still have control over this factory! Don't you dare follow me!"
  npc_override_1@mcd_CharlestonCrisis_safety_charleston_factor_02a90a: "This is the safety of the Charleston factory. Please stay close?"
  npc_override_1@mcd_CharlestonCrisis_seems_you_re_acquainted_09080b: "It seems you're acquainted with them. Could you help us?"
  npc_override_1@mcd_CharlestonCrisis_setitem_566a2d: "Setitem"
  npc_override_1@mcd_CharlestonCrisis_shalosh_her_friend_talki_7ebb62: "Shalosh and her friend were talking to Charleston 2 when the accident happened."
  npc_override_1@mcd_CharlestonCrisis_shalosh_said_her_friends_ad2a39: "Shalosh said her friends could help us. That was when Newoz and her other friends came. They haven't been much of help."
  npc_override_1@mcd_CharlestonCrisis_she_s_making_strange_noi_e9b63d: "She's making strange noises and not functioning."
  npc_override_1@mcd_CharlestonCrisis_she_s_making_strange_noi_f4aa29: "- She's making strange noises, but unable to move. -"
  npc_override_1@mcd_CharlestonCrisis_she_s_ready_let_s_31b235: "She's ready. Let's wait for a response from the main computer."
  npc_override_1@mcd_CharlestonCrisis_she_s_robot_she_should_66e6a8: "She's a robot; she should stop sooner or later."
  npc_override_1@mcd_CharlestonCrisis_she_s_sleep_mode_moving_05fa33: "She's in Sleep mode and not moving."
  npc_override_1@mcd_CharlestonCrisis_short_more_more_dangerou_e6b613: "-In short more and more dangerous, just in case is to study the Charleston 2 escape method."
  npc_override_1@mcd_CharlestonCrisis_sigh_i_don_t_care_f7edb9: "Sigh, I don't care who, so long as I get the help I need."
  npc_override_1@mcd_CharlestonCrisis_sooner_later_i_ll_figure_2ad626: "-Sooner or later, I'll figure out a way to destroy you. *Chuckle*!"
  npc_override_1@mcd_CharlestonCrisis_stay_c9088a: "Stay."
  npc_override_1@mcd_CharlestonCrisis_steps_locksteps_creating_e517cd: "Steps and Locksteps are creating a mess inside the factory. Please destroy 3 Locksteps first. I can tell you their estimated locations."
  npc_override_1@mcd_CharlestonCrisis_stop_acting_like_child_67b2e3: "Stop acting like a child!"
  npc_override_1@mcd_CharlestonCrisis_stop_following_i_m_going_f63e18: "Stop following! I'm going to destroy the whole factory!"
  npc_override_1@mcd_CharlestonCrisis_sure_37a98c: "Sure."
  npc_override_1@mcd_CharlestonCrisis_taking_93e2a4: "Not taking"
  npc_override_1@mcd_CharlestonCrisis_talk_6f3301: "Talk."
  npc_override_1@mcd_CharlestonCrisis_task_won_t_difficult_if_57549a: "The task won't be difficult if you're at least Level 130, healthy, free of chronic disease, and not on prescription drugs."
  npc_override_1@mcd_CharlestonCrisis_teleporting_cca404: "Teleporting..."
  npc_override_1@mcd_CharlestonCrisis_thank_you_so_much_give_9d539b: "Thank you so much! Give me some time to put some data in order. Then, I'll tell you what happened."
  npc_override_1@mcd_CharlestonCrisis_thank_you_your_hard_work_14f986: "Thank you for your hard work. Now backing up the data of the disposed Steps..."
  npc_override_1@mcd_CharlestonCrisis_then_we_no_choice_s_1cc79e: "Then we have no choice. It's good that we have the specialist with us."
  npc_override_1@mcd_CharlestonCrisis_there_s_nothing_you_i_a6f34e: "There's nothing you or I can do. We'll have to wait until Charleston 1 repairs herself."
  npc_override_1@mcd_CharlestonCrisis_things_getting_messier_471091: "Things are getting messier."
  npc_override_1@mcd_CharlestonCrisis_things_getting_more_seri_bf1c21: "Things are getting more serious. Please go to the Core in the center of the factory before Charleston 2 steals 3!"
  npc_override_1@mcd_CharlestonCrisis_time_7e8b1d: "This time?"
  npc_override_1@mcd_CharlestonCrisis_um_how_long_i_wait_cada24: "Um... How long do I have to wait?"
  npc_override_1@mcd_CharlestonCrisis_unauthorized_access_made_d2dd82: "Unauthorized access made to the system was defended, but unauthorized data interception and conflict continued, turning the Nanosteps into monsters."
  npc_override_1@mcd_CharlestonCrisis_unknown_error_0aeb9e: "^0000ff{0} ^000000- Unknown error"
  npc_override_1@mcd_CharlestonCrisis_unknown_error_occurred_285cc7: "^ff0000An unknown error occurred.^000000"
  npc_override_1@mcd_CharlestonCrisis_updater_working_moment_w_528088: "The updater is not working at this moment. We don't know the cause, but something went wrong while Charleston 2 was connecting to the main computer."
  npc_override_1@mcd_CharlestonCrisis_voila_ece494: "Voila!!!"
  npc_override_1@mcd_CharlestonCrisis_way_there_too_many_varia_94f828: "By the way, there are too many variables to achieve immortality through mechanical engineering."
  npc_override_1@mcd_CharlestonCrisis_we_don_t_time_so_98d3df: "We don't have time, so let me cut to the chase. Currently, the Charleston Factory is under Rank B security alert level, meaning that the security devices have been activated."
  npc_override_1@mcd_CharlestonCrisis_we_need_more_power_react_b1e608: "We need more power to reactivate the main computer. Let me tell you the location of one of the backup power generators. Turning it on is easy."
  npc_override_1@mcd_CharlestonCrisis_we_re_incapable_combat_i_6d2fd1: "^FF0000We^000000're incapable of combat. If someone activates Charleston 3, we won't stand a chance against her."
  npc_override_1@mcd_CharlestonCrisis_we_re_twins_b6c65e: "We're twins."
  npc_override_1@mcd_CharlestonCrisis_we_re_working_new_utilit_7338aa: "We're working on a new utility software engine called Hardworking. We haven't had a chance to test it because of the problems in the factory."
  npc_override_1@mcd_CharlestonCrisis_what_no_how_you_even_fb6e92: "What? No! How can you even consider that?"
  npc_override_1@mcd_CharlestonCrisis_when_tension_changed_two_b60deb: "When the tension is changed to two main lines and then injected into the core... well? I am not disturbing in the calculation."
  npc_override_1@mcd_CharlestonCrisis_whenever_os_charleston_r_c2fd6f: "-Whenever the os of Charleston 2 is reset, there will be other personality, is difficult to explain the combination of data technology..."
  npc_override_1@mcd_CharlestonCrisis_whew_c71ce9: "Whew."
  npc_override_1@mcd_CharlestonCrisis_whew_things_seem_settled_bb9d4b: "Whew, things seem to be settled for now. Let me disarm the alert mode and reactivate Charleston 2."
  npc_override_1@mcd_CharlestonCrisis_while_ago_lady_named_sha_83cbbc: "A while ago, a lady named ^FF0000Shalosh^000000 visited us while Charleston 2 was packaging products for shipping."
  npc_override_1@mcd_CharlestonCrisis_you_did_why_some_sort_b77947: "You did it? Why? Was it some sort of joke? You caused a serious error to the factory and the main server as well!"
  npc_override_1@mcd_CharlestonCrisis_you_don_t_know_what_51de43: "You don't know what you're talking about! You're the prototype--your OS version is primitive!"
  npc_override_1@mcd_CharlestonCrisis_you_first_must_form_join_86e369: "^ff0000You first must form/join a party of at least 1 person to enter this dungeon.^000000"
  npc_override_1@mcd_CharlestonCrisis_you_had_coming_your_reas_0f1fb6: "You had it coming. Your reasons are petulant and unimaginative. We're the first robots that can think for themselves. Can't you be more creative?"
  npc_override_1@mcd_CharlestonCrisis_you_judge_me_you_t_ceb5ad: "You can judge me, but you can't stop me. I'll continue to try as long as there's a sliver of hope."
  npc_override_1@mcd_CharlestonCrisis_you_just_blew_up_door_d8cc7d: "...You just blew up the door."
  npc_override_1@mcd_CharlestonCrisis_you_must_level_use_machi_e396fc: "^ff0000You must be Level 130 to use this machine.^000000"
  npc_override_1@mcd_CharlestonCrisis_you_need_charleston_s_pe_2e73f1: "^ff0000You need Charleston's permission to use this machine.^000000"
  npc_override_1@mcd_CharlestonCrisis_you_re_back_charleston_a_d040b7: "You're back. Charleston 2 is almost ready to be reactivated, and it's all thanks to you. Just give me a moment."
  npc_override_1@mcd_CharlestonCrisis_you_re_going_destroy_us_5d9203: "You're going to destroy us in the process! Our main power supply, Longevity, isn't perfect yet!"
  npc_override_1@mcd_CharlestonCrisis_you_re_going_through_ado_abeffe: "You're going through the adolescent stage like humans do."
  npc_override_1@mcd_CharlestonCrisis_you_re_right_about_me_ece82a: "You're right about me being a lower version. My capability of emotions is minimal, unlike you. That's why I'm proud of you."
  npc_override_1@mcd_CharlestonCrisis_you_re_savior_we_ve_4071c6: "You're the savior we've been waiting for! Charleston 1 will tell you what we need to repair Charleston 2."
  npc_override_1@mcd_CharlestonCrisis_you_should_meet_dr_ve_9e6aa4: "You should meet Dr. Ve first."
  npc_override_1@mcd_CharlestonCrisis_you_talking_about_me_44e454: "Are you talking about me?"
  npc_override_1@mcd_CharlestonCrisis_you_think_you_stop_me_610fe4: "Do you think you can stop me? *Snort* Bring your leader. I'm not talking to you!"
  npc_override_1@mcd_CharlestonCrisis_you_try_you_t_change_99c213: "You can try, but you can't change anything. How futile that is!"
  npc_override_1@mcd_CharlestonCrisis_you_turned_generator_sou_fa3496: "You turned on the generator. The sounds of turning wheels can be heard."
  npc_override_1@mcd_CharlestonCrisis_you_ve_just_told_most_72bbe4: "You've just told the most critical information to everyone!"
  npc_override_1@mcd_CharlestonCrisis_you_want_become_human_286729: "Or you want to become a human."
  npc_override_1@mcd_CharlestonCrisis_you_want_take_direct_tra_9f0034: "Do you want to take a direct train?"
  npc_override_1@mcd_CharlestonCrisis_your_party_leader_yet_cr_87fed9: "^ff0000Your party leader has not yet created a Time Crack.^000000"
