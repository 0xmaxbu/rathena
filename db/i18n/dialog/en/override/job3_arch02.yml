Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job3_arch02_archbishop_actually_i_started_bad_d_48a15f: "Actually I started to have a bad dream from the date I was appointed."
  npc_override_job3_arch02_archbishop_admire_odin_s_omniscienc_743a1f: "Admire Odin's omniscience and omnipotence and pray for a wisdom to choose the right path."
  npc_override_job3_arch02_archbishop_after_finishing_all_thes_21e02e: "After finishing all of these prayers, just stand up with a pious mind."
  npc_override_job3_arch02_archbishop_after_making_your_pilgri_0c02ba: "After making your pilgrimage, let's have a drink together and talk about your experience."
  npc_override_job3_arch02_archbishop_after_you_finish_song_yo_1f340c: "- After you finish the song, you feel light and strong with abundant devotion. -"
  npc_override_job3_arch02_archbishop_after_you_summon_my_impe_33b1e9: "After you summon my impersonation, you have to find a ^3131FFBroken pipe^000000."
  npc_override_job3_arch02_archbishop_ah_971301: "Ah..."
  npc_override_job3_arch02_archbishop_ah_archbishop_33de03: "Ah! An Archbishop."
  npc_override_job3_arch02_archbishop_ah_i_go_back_asgard_39c4c0: "Ah! I can go back to Asgard!"
  npc_override_job3_arch02_archbishop_ah_i_m_resentful_so_965f89: "Ah, I'm resentful! so regretful!"
  npc_override_job3_arch02_archbishop_ah_i_m_so_worried_b85b91: "Ah... I'm so worried...."
  npc_override_job3_arch02_archbishop_ah_priest_dayan_ca2924: "Ah, Priest Dayan."
  npc_override_job3_arch02_archbishop_ah_welcome_be5d4c: "Ah, Welcome."
  npc_override_job3_arch02_archbishop_ah_yes_83ae92: "Ah~, yes."
  npc_override_job3_arch02_archbishop_all_ministers_odin_shoul_bee8fe: "All ministers of Odin should be diligent. They should never be too lazy to serve Odin."
  npc_override_job3_arch02_archbishop_also_they_bless_you_beca_debf7a: "^3131FFAnd also they will bless you because you are an existence of joy overcoming an affliction. We call that Aspersio^000000."
  npc_override_job3_arch02_archbishop_anguhilde_valkyrie_who_d_86c68f: "Anguhilde is a Valkyrie who is dead for a long time ago."
  npc_override_job3_arch02_archbishop_anyway_i_feel_my_energy_4becd8: "Anyway I can feel my energy coming back."
  npc_override_job3_arch02_archbishop_anyway_why_you_come_here_994c27: "Anyway, why have you come here?"
  npc_override_job3_arch02_archbishop_aren_t_you_priest_dayan_4b2546: "Aren't you Priest Dayan?"
  npc_override_job3_arch02_archbishop_as_easy_as_i_expected_c785ef: "It was not as easy as I expected."
  npc_override_job3_arch02_archbishop_as_time_went_dream_becam_084a3b: "But, as time went by, the dream became scarier. Now Valkyrie is arrested with chains and then finally she is dashed to pieces."
  npc_override_job3_arch02_archbishop_as_you_rid_yourself_pain_c9ddcb: "As you rid yourself of pain, your mind will suffer less and you will experience the joy of life as you help and console others."
  npc_override_job3_arch02_archbishop_asgard_world_gods_there_7102c3: "And in Asgard, the world of the Gods, there is the Word spring."
  npc_override_job3_arch02_archbishop_aspersio_bf43b7: "- * ASPERSIO ! * -"
  npc_override_job3_arch02_archbishop_assistance_odin_soldiers_fb4ce7: "Assistance of Odin! Soldiers of Valhalla!"
  npc_override_job3_arch02_archbishop_battle_finished_yet_5ff3f5: "But the battle is not finished yet."
  npc_override_job3_arch02_archbishop_because_close_battle_i_c_74db99: "Because of a close battle, I could only get a little energy."
  npc_override_job3_arch02_archbishop_been_long_time_since_i_714037: "It has been a long time since I've seen such a devout minister."
  npc_override_job3_arch02_archbishop_big_tree_called_yggdrasi_13283c: "That big tree is called The ^3131FFYggdrasil^000000."
  npc_override_job3_arch02_archbishop_blessing_91cdb1: "- * BLESSING! * -"
  npc_override_job3_arch02_archbishop_booo_94de6f: "Booo - - - -"
  npc_override_job3_arch02_archbishop_booo_af877b: "Booo - - -"
  npc_override_job3_arch02_archbishop_chord_crashes_out_spring_8d96d6: "A chord crashes out in the spring of Hvergelmir and a waterfall sound gives you a refreshing feeling. -"
  npc_override_job3_arch02_archbishop_come_challenge_again_d58bc3: "- and come for the challenge again. -"
  npc_override_job3_arch02_archbishop_course_i_m_staying_midga_3eb39c: "Of course I'm staying in Midgard, but we are under the yoke of fate that can't coexist in this world."
  npc_override_job3_arch02_archbishop_curdan_bird_which_sits_b_b168aa: "~The Curdan bird which sits on a branch brings me the wisdom of whole world.~"
  npc_override_job3_arch02_archbishop_curdan_wolf_protects_me_f6b9e8: "~The Curdan wolf protects me from all threats in the world.~"
  npc_override_job3_arch02_archbishop_dangerous_so_let_s_go_c6e628: "It can be dangerous, so let's go back."
  npc_override_job3_arch02_archbishop_descendants_heimdal_gath_6cf7a6: "~Descendants of Heimdal gather under the Ash tree Yggdrasil.~"
  npc_override_job3_arch02_archbishop_devil_always_makes_effor_3e9251: "The devil always makes an effort to agitate people's mind."
  npc_override_job3_arch02_archbishop_devils_removed_other_val_a29b44: "The devils were removed by other Valkyries as you wanted."
  npc_override_job3_arch02_archbishop_did_you_collect_all_piec_8784ea: "Did you collect all of the pieces of my horn pipe?"
  npc_override_job3_arch02_archbishop_did_you_find_rest_pieces_16b9f7: "Did you find the rest of the pieces?"
  npc_override_job3_arch02_archbishop_did_you_find_vinue_hugel_5ac7de: "Did you find Vinue in Hugel? How's she doing?"
  npc_override_job3_arch02_archbishop_did_you_meet_priest_daya_a37836: "Did you meet Priest Dayan in Umbala?"
  npc_override_job3_arch02_archbishop_didn_t_you_see_shrine_857311: "Didn't you see a shrine covered by the devil?"
  npc_override_job3_arch02_archbishop_don_t_afraid_pain_necess_b422a6: "Don't be afraid of pain. That is a necessity and will be a first step to enter a way to liquidate past wounds."
  npc_override_job3_arch02_archbishop_don_t_forget_altruistic_986197: "Don't forget an altruistic minister's spirit like today forever."
  npc_override_job3_arch02_archbishop_don_t_make_hasty_general_11567d: "Don't make a hasty generalization."
  npc_override_job3_arch02_archbishop_don_t_worry_11a843: "But don't worry."
  npc_override_job3_arch02_archbishop_don_t_worry_anguhilde_e1371e: "Don't worry, Anguhilde."
  npc_override_job3_arch02_archbishop_don_t_worry_ffc806: "Don't worry."
  npc_override_job3_arch02_archbishop_dream_related_evil_odin_398965: "Is the dream related with the evil in the Odin shrine?"
  npc_override_job3_arch02_archbishop_eh_say_what_d07814: "Eh? Say what?"
  npc_override_job3_arch02_archbishop_eh_you_6036ad: "Eh... are you?"
  npc_override_job3_arch02_archbishop_enter_correct_password_6408fa: "Enter the correct password!"
  npc_override_job3_arch02_archbishop_enter_yggdrasil_76dc09: "Enter the Yggdrasil."
  npc_override_job3_arch02_archbishop_entrust_me_dfe21f: "Entrust me."
  npc_override_job3_arch02_archbishop_even_though_s_different_f9932b: "Even though It's different with reality but now she may be able to rest in peace."
  npc_override_job3_arch02_archbishop_even_though_we_serve_odi_1c27f5: "Even though we serve Odin, we are normal people."
  npc_override_job3_arch02_archbishop_even_though_you_expelled_fe4d1d: "Even though you were expelled because of an incident before, Odin said that he is reconsidering your banishment."
  npc_override_job3_arch02_archbishop_evil_always_watching_our_950d34: "Evil is always watching for our souls."
  npc_override_job3_arch02_archbishop_fact_i_t_anything_my_5d6758: "In fact, I can't do anything with my body now."
  npc_override_job3_arch02_archbishop_father_light_poet_wisdom_d78724: "~The father of light, the poet of wisdom, sing for me.~"
  npc_override_job3_arch02_archbishop_feel_coldness_pitch_blac_61a32d: "And feel the coldness of the pitch-black darkness."
  npc_override_job3_arch02_archbishop_feel_free_ask_me_about_801313: "^3131FFFeel free to ask me about how to pray^000000."
  npc_override_job3_arch02_archbishop_feel_free_visit_here_whe_3ecc07: "Feel free to visit here when you want to pray, {0}"
  npc_override_job3_arch02_archbishop_feel_free_visit_me_if_48e4f5: "Feel free to visit me if you change your mind."
  npc_override_job3_arch02_archbishop_finally_we_finished_all_1492a3: "Finally we finished all the preparations."
  npc_override_job3_arch02_archbishop_first_dream_valkyrie_sad_0a9f20: "At first, it was a dream that Valkyrie was sad and in darkness."
  npc_override_job3_arch02_archbishop_follow_your_steps_purpos_9b4fc9: "Follow your steps with purpose."
  npc_override_job3_arch02_archbishop_fountain_pours_out_end_y_c04dbe: "A fountain pours out from the end of Yggdrasil's roots that spread to every world."
  npc_override_job3_arch02_archbishop_front_almighty_god_odin_666bfe: "In front of the Almighty God Odin,"
  npc_override_job3_arch02_archbishop_globalvar_924ed9: "The GlobalVar is"
  npc_override_job3_arch02_archbishop_go_there_find_priest_day_3371b6: "Go there and find Priest Dayan."
  npc_override_job3_arch02_archbishop_haha_you_going_help_me_56afc1: "Haha! You are going to help me?!"
  npc_override_job3_arch02_archbishop_hahahahaha_66c02c: "hahahahaha."
  npc_override_job3_arch02_archbishop_hanging_down_like_bird_h_e4b7e2: "Hanging down like a bird that had its wings cut."
  npc_override_job3_arch02_archbishop_he_asks_you_go_holy_db722b: "He asks you to go on a Holy Pilgrimage."
  npc_override_job3_arch02_archbishop_he_cups_his_ears_towards_dbe034: "He cups his ears towards you."
  npc_override_job3_arch02_archbishop_he_good_ee8ad6: "Is he good?"
  npc_override_job3_arch02_archbishop_he_s_very_kind_as_5c37ed: "He's very kind. As are you {0}."
  npc_override_job3_arch02_archbishop_he_s_very_old_so_dee421: "He's very old so he is hard of hearing."
  npc_override_job3_arch02_archbishop_he_so_cute_even_though_9c5598: "He is so cute even though he's old."
  npc_override_job3_arch02_archbishop_he_told_me_he_worried_70ef7b: "He told me that he was worried because when he saw you last time, you seemed sad."
  npc_override_job3_arch02_archbishop_he_turns_his_head_toward_ead6ce: "He turns his head towards you."
  npc_override_job3_arch02_archbishop_heavens_sound_pipes_spre_a5b340: "In the heavens the sound of pipes spread out, but a bird that can't fly crawls and finally is crushed to pieces on the ground."
  npc_override_job3_arch02_archbishop_hello_you_priest_dayan_5c8461: "Hello. are you... Priest Dayan?"
  npc_override_job3_arch02_archbishop_here_illusion_anguhilde_34d32c: "Here is an illusion of Anguhilde who doesn't want to be recognized."
  npc_override_job3_arch02_archbishop_hmm_i_wanted_tell_you_afccdc: "Hmm, I wanted to tell you..."
  npc_override_job3_arch02_archbishop_hmm_so_6fb380: "Hmm... so..."
  npc_override_job3_arch02_archbishop_hmm_someone_battling_dev_0414b8: "Hmm, someone is battling the devil in the shrine right now."
  npc_override_job3_arch02_archbishop_hmm_what_did_priest_say_5d7710: "Hmm, what did that priest say to me?"
  npc_override_job3_arch02_archbishop_hmm_what_first_way_2c6bb1: "Hmm... What is the first way?"
  npc_override_job3_arch02_archbishop_hohohoho_e8e33b: "hohohoho."
  npc_override_job3_arch02_archbishop_holy_ceremony_brighten_y_ba30c6: "This holy ceremony will brighten your soul."
  npc_override_job3_arch02_archbishop_holy_pilgrimage_isn_t_di_9a28b0: "A Holy Pilgrimage isn't that difficult."
  npc_override_job3_arch02_archbishop_holy_pilgrimage_means_go_3e9c78: "A Holy Pilgrimage means going to a holy place to pray to the God Odin for protection and grace."
  npc_override_job3_arch02_archbishop_holy_place_god_odin_tain_f969cc: "The holy place of the God Odin is tainted by darkness!"
  npc_override_job3_arch02_archbishop_holy_shrine_tainted_devi_2b0f2a: "The holy shrine was tainted by the devils."
  npc_override_job3_arch02_archbishop_honor_odin_6d6197: "Honor to Odin!"
  npc_override_job3_arch02_archbishop_host_ballascalf_rise_up_24538b: "~The host of ballascalf, rise up from your seat. The whole world shouts for joy.~"
  npc_override_job3_arch02_archbishop_host_glittering_glass_gi_b2a454: "~The host of a glittering glass, give me a holy prediction.~"
  npc_override_job3_arch02_archbishop_how_i_8e6ebf: "How can I do that?"
  npc_override_job3_arch02_archbishop_how_i_become_like_cef9a2: "How do I become like that?"
  npc_override_job3_arch02_archbishop_how_i_get_odin_shrine_5828df: "How do I get to Odin shrine?"
  npc_override_job3_arch02_archbishop_how_long_i_under_dishono_ecf622: "How long do I have to be under this dishonorable fate!"
  npc_override_job3_arch02_archbishop_how_s_going_8e2ed1: "How's it going?"
  npc_override_job3_arch02_archbishop_huh_73fef0: "Huh?"
  npc_override_job3_arch02_archbishop_huhuhuhu_humhum_8d01cb: "huhuhuhu. humhum."
  npc_override_job3_arch02_archbishop_hum_3f61e8: "Hum?"
  npc_override_job3_arch02_archbishop_hum_well_c5d9f0: "Hum... well."
  npc_override_job3_arch02_archbishop_human_answer_me_you_here_ee5540: "Human, answer me. Are you here to sincerely help me?"
  npc_override_job3_arch02_archbishop_human_valkyries_your_deb_6c3a02: "Human, the Valkyries are in your debt. Thank you."
  npc_override_job3_arch02_archbishop_huuuuuu_358014: "Huuuuuu......"
  npc_override_job3_arch02_archbishop_i_already_expelled_asgar_b24398: "I was already expelled from Asgard."
  npc_override_job3_arch02_archbishop_i_came_here_say_hello_b8ca30: "I came here to say hello from Priest Dayan from Prontera."
  npc_override_job3_arch02_archbishop_i_confess_my_guilt_almig_9c4204: "I confess my guilt to the Almighty God Odin."
  npc_override_job3_arch02_archbishop_i_disgraced_island_impor_314a52: "I was disgraced, this island is important as a temple for Odin and the various Gods."
  npc_override_job3_arch02_archbishop_i_don_t_any_energy_eb0514: "I don't have any energy to hold my own, so I have no choice but to trust you."
  npc_override_job3_arch02_archbishop_i_don_t_any_way_b8f51c: "I don't have any way to find out."
  npc_override_job3_arch02_archbishop_i_don_t_know_why_36b73f: "I don't know why they came here and from where they came from."
  npc_override_job3_arch02_archbishop_i_don_t_method_so_d52b4e: "I don't have a method, so I just pray."
  npc_override_job3_arch02_archbishop_i_don_t_think_so_a189ca: "I don't think so."
  npc_override_job3_arch02_archbishop_i_feel_air_around_me_ee4f92: "I can feel the air around me is getting impure."
  npc_override_job3_arch02_archbishop_i_feel_full_grace_e9fe91: "I feel full of grace."
  npc_override_job3_arch02_archbishop_i_feel_light_hearted_lik_a5ac69: "I feel light-hearted. Like I was just reborn..."
  npc_override_job3_arch02_archbishop_i_feel_refreshed_2d8822: "I feel refreshed."
  npc_override_job3_arch02_archbishop_i_feel_you_fresh_energy_825c28: "I can feel that you have a fresh energy."
  npc_override_job3_arch02_archbishop_i_forgot_wear_my_hearing_1083d7: "I forgot to wear my hearing aid. hehe."
  npc_override_job3_arch02_archbishop_i_give_you_necklace_as_c11c4f: "I give you a necklace as a present."
  npc_override_job3_arch02_archbishop_i_guess_i_should_go_7c76fd: "I guess I should go back to Priest Dayan."
  npc_override_job3_arch02_archbishop_i_harmed_freki_one_odin_bed8d9: "But I harmed Freki, one of Odin's wolves, and I was expelled form Asgard without any energy as a Valkyrie with orders to protect this island."
  npc_override_job3_arch02_archbishop_i_hope_air_yggdrasil_hel_b46d28: "I hope the air of Yggdrasil will be helpful to her."
  npc_override_job3_arch02_archbishop_i_hope_my_prayer_weaken_90f0b2: "I hope that my prayer can weaken your agony..."
  npc_override_job3_arch02_archbishop_i_hope_odin_gives_you_603881: "I hope that Odin gives you his protection as well."
  npc_override_job3_arch02_archbishop_i_hope_paves_way_you_86e9c2: "I hope that this paves the way for you to live in the light of Odin."
  npc_override_job3_arch02_archbishop_i_hope_we_see_each_718d70: "I hope we see each other in Valhalla sometime."
  npc_override_job3_arch02_archbishop_i_hope_you_give_happines_675465: "I hope you give happiness and honor to people during your adventures."
  npc_override_job3_arch02_archbishop_i_hope_you_good_time_9a5eae: "I hope you have a good time with the festival here in Hugel."
  npc_override_job3_arch02_archbishop_i_knew_i_couldn_t_420802: "I knew that I couldn't trust a human!"
  npc_override_job3_arch02_archbishop_i_know_you_bent_over_d10328: "I know you bent over backwards to help me, but I can't do anything without 2 pieces of horn pipe."
  npc_override_job3_arch02_archbishop_i_ll_always_here_you_625d3a: "I'll always be here for you."
  npc_override_job3_arch02_archbishop_i_ll_complete_broken_hor_703c99: "I'll complete the broken horn pipe!"
  npc_override_job3_arch02_archbishop_i_ll_go_back_my_9656aa: "I'll go back to my prayers."
  npc_override_job3_arch02_archbishop_i_ll_go_meet_her_efd0c5: "I'll go and meet her."
  npc_override_job3_arch02_archbishop_i_ll_never_forget_your_4c658b: "I'll never forget your warm heart."
  npc_override_job3_arch02_archbishop_i_ll_pray_darkness_stays_b7eb1c: "I'll pray that the darkness stays away."
  npc_override_job3_arch02_archbishop_i_ll_pray_your_safe_0c0037: "I'll pray for your safe return."
  npc_override_job3_arch02_archbishop_i_m_dayan_nice_meet_c68de9: "I'm Dayan. Nice to meet you {0}"
  npc_override_job3_arch02_archbishop_i_m_going_give_new_86db10: "I'm going to give a ^3131FFnew ancient scroll^000000."
  npc_override_job3_arch02_archbishop_i_m_going_give_you_dc58c7: "I'm going to give you a scroll of paper written in an ancient language."
  npc_override_job3_arch02_archbishop_i_m_going_make_them_4118ae: "I'm going to make them ministers worthy of serving Odin."
  npc_override_job3_arch02_archbishop_i_m_here_holy_pilgrimage_13fff4: "'^3131FFI'm here for the Holy Pilgrimage.^000000'"
  npc_override_job3_arch02_archbishop_i_m_here_holy_pilgrimage_9cf1dc: "^FF0000I'm here for the Holy Pilgrimage!^000000"
  npc_override_job3_arch02_archbishop_i_m_just_little_tired_5da560: "I'm just a little tired because of a bad dream."
  npc_override_job3_arch02_archbishop_i_m_minister_who_copes_3bca83: "I'm a minister who copes with lots of asceticism!"
  npc_override_job3_arch02_archbishop_i_m_sure_ll_helpful_034eca: "But I'm not sure that It'll be helpful or not...."
  npc_override_job3_arch02_archbishop_i_m_talking_another_pers_1d00ab: "I'm talking with another person now, so give me a second."
  npc_override_job3_arch02_archbishop_i_normal_valkyrie_lead_s_c1a3cc: "I was a normal Valkyrie that lead soldiers to Valhalla according to the order of Odin."
  npc_override_job3_arch02_archbishop_i_recommend_719908: "But, I recommend this."
  npc_override_job3_arch02_archbishop_i_see_one_beside_you_dcbd54: "I can see this one beside you."
  npc_override_job3_arch02_archbishop_i_see_your_goal_enter_227b8b: "I see, is your goal to enter Valhalla?"
  npc_override_job3_arch02_archbishop_i_t_invite_you_as_4d8de7: "I can't invite you as I want, but the power given by Odin can help you."
  npc_override_job3_arch02_archbishop_i_t_pretend_ignore_siste_096a37: "But I can't pretend to ignore a Sister who is in trouble?"
  npc_override_job3_arch02_archbishop_i_think_good_news_sent_c822ae: "But I think that good news will be sent to you."
  npc_override_job3_arch02_archbishop_i_think_she_exhausted_du_2695c0: "I think she is exhausted due to praying too much."
  npc_override_job3_arch02_archbishop_i_think_you_don_t_d4684c: "I think you don't get it."
  npc_override_job3_arch02_archbishop_i_tried_my_best_protect_959dc6: "I tried to do my best to protect this holy place."
  npc_override_job3_arch02_archbishop_i_ve_been_wanting_pray_fe732a: "I've been wanting to pray at Odin's shrine to make the dream go away. But that shrine became a den of evil a long time ago."
  npc_override_job3_arch02_archbishop_i_ve_lost_all_my_6d1c38: "I've lost all of my energy and my body is sealed so there is no way for me to protect the shrine."
  npc_override_job3_arch02_archbishop_if_odin_doesn_t_abandon_4e4e8f: "If Odin doesn't abandon you, you can reach the beginning of the world at the stem of the Yggdrasil."
  npc_override_job3_arch02_archbishop_if_you_collect_pieces_yo_bb27c2: "If you collect pieces, you can ask other Valkyries for help."
  npc_override_job3_arch02_archbishop_if_you_go_outside_you_85af89: "^3131FFIf you go outside, you can summon a Valkyrie with that scroll.^000000"
  npc_override_job3_arch02_archbishop_if_you_indifferent_prayi_c7db3f: "If you are indifferent to praying, it never misses an opportunity."
  npc_override_job3_arch02_archbishop_if_you_s_wrong_place_294e7a: "If you do, it's the wrong place for you."
