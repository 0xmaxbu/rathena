Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_glast_01_OldGlastHeim_merchants_agi_boots_8c0ecb: "Agi Boots"
  npc_override_glast_01_OldGlastHeim_merchants_all_enchant_refine_rates_1c02c1: "And ^FF0000all enchant or refine rates will be lost if you fail this.^000000"
  npc_override_glast_01_OldGlastHeim_merchants_also_you_don_t_lose_89318d: "Also, you don't lose the item even if the enchant fails, we also guarantee keeping card and refine rate. But we can't initialize enchanting."
  npc_override_glast_01_OldGlastHeim_merchants_anyways_s_all_basic_ench_6bd0b0: "Anyways, that's all for basic enchant information. Now you should see for yourself."
  npc_override_glast_01_OldGlastHeim_merchants_archery_569af0: "Archery"
  npc_override_glast_01_OldGlastHeim_merchants_arrggg_we_failed_better_35ca51: "Arrggg, we failed. Better luck next time."
  npc_override_glast_01_OldGlastHeim_merchants_attack_speed_f33d40: "Attack Speed"
  npc_override_glast_01_OldGlastHeim_merchants_boots_been_upgraded_as_y_56ce8f: "The boots have been upgraded as you want."
  npc_override_glast_01_OldGlastHeim_merchants_bring_me_temporal_crysta_7f6907: "Bring me ^0000FF5 Temporal Crystals^000000, and I will try to put a slot into your advanced Temporal Boots. But, it's possible to ^FF0000fail and break the item^000000. Is that ok?"
  npc_override_glast_01_OldGlastHeim_merchants_bring_temporal_crystal_i_0ef80c: "Bring Temporal Crystal items for various Temporal boots items. Pick something you want."
  npc_override_glast_01_OldGlastHeim_merchants_buy_temporal_boots_need_b5ed38: "Buy Temporal Boots (Need 1 Temporal Crystal)"
  npc_override_glast_01_OldGlastHeim_merchants_cancel_77dfd2: "Cancel"
  npc_override_glast_01_OldGlastHeim_merchants_come_back_anytime_you_wa_a43c1d: "Come back anytime you want."
  npc_override_glast_01_OldGlastHeim_merchants_come_back_whenever_you_w_982cd8: "Come back whenever you want."
  npc_override_glast_01_OldGlastHeim_merchants_cool_let_s_make_deal_9186b7: "Cool, let's make a deal."
  npc_override_glast_01_OldGlastHeim_merchants_course_th_slot_only_you_1ae7e8: "Of course it is for 4th slot only. You can have small effect at the start, and then the effect gets stronger."
  npc_override_glast_01_OldGlastHeim_merchants_course_you_must_cope_big_c72f37: "Of course, you must cope with bigger risk of destruction whenever you'd like to enchant again and again."
  npc_override_glast_01_OldGlastHeim_merchants_dex_boots_a07445: "Dex Boots"
  npc_override_glast_01_OldGlastHeim_merchants_effect_upgrade_239b4e: "Effect Upgrade!"
  npc_override_glast_01_OldGlastHeim_merchants_enchant_order_same_as_hu_bdd1b9: "The enchant order is same as Hugin's magic master's enchantment. Please refer to his explanation."
  npc_override_glast_01_OldGlastHeim_merchants_enchanting_s_th_slot_as_f05f58: "Enchanting ^0000FF{0}^000000's 4th slot as ^0000FF{1}^000000 level effect. Requires ^0000FF{2}^000000 Coagulated Spell items."
  npc_override_glast_01_OldGlastHeim_merchants_enchanting_socket_s_th_s_c9380b: "Enchanting ^0000ff{0} (Socket)^000000's 4th slot as ^0000ff{1}^000000 level effect. Requires ^0000ff{2} {3}, {4} {5}, and {6} z^000000. It has some risk of failing.."
  npc_override_glast_01_OldGlastHeim_merchants_enough_temporal_crystals_992e59: "Not enough Temporal Crystals. You need 5 Temporal Crystals to upgrade your item."
  npc_override_glast_01_OldGlastHeim_merchants_exchange_a47d45: "Exchange for {0}"
  npc_override_glast_01_OldGlastHeim_merchants_fighting_spirit_c3bed0: "Fighting Spirit"
  npc_override_glast_01_OldGlastHeim_merchants_get_final_option_upgrade_77969e: "To get to the final option upgrade, it will require way more Coagulated Spell items. Don't forget that."
  npc_override_glast_01_OldGlastHeim_merchants_give_effect_my_temporal_be1d4d: "Give effect to my Temporal Boots"
  npc_override_glast_01_OldGlastHeim_merchants_hey_you_lot_if_so_005882: "Hey, do you have a lot of {0} or {1}? If so, why don't you trade a nice portrait that I have?"
  npc_override_glast_01_OldGlastHeim_merchants_hmm_you_don_t_enough_261391: "Hmm, you don't have enough Spell now. Go get more."
  npc_override_glast_01_OldGlastHeim_merchants_hmm_you_missing_coagulat_ad970d: "Hmm, you are missing {0} Coagulated Spell items. Go get more, and then we can talk about more enchants."
  npc_override_glast_01_OldGlastHeim_merchants_hmm_you_missing_items_go_60578a: "Hmm, you are missing {0} {1} items. Go get more, and then we can talk about more enchants."
  npc_override_glast_01_OldGlastHeim_merchants_how_enchanting_work_232154: "How does the enchanting work?"
  npc_override_glast_01_OldGlastHeim_merchants_i_am_ok_e4182f: "I am ok with it!"
  npc_override_glast_01_OldGlastHeim_merchants_i_been_collecting_portra_4da73c: "I have been collecting portraits for an year already. Now it's time to show people my collection."
  npc_override_glast_01_OldGlastHeim_merchants_i_deal_temporal_boots_so_491715: "I deal with the Temporal Boots with socket only."
  npc_override_glast_01_OldGlastHeim_merchants_i_don_t_give_out_6c01fe: "I don't give out effect randomly. You can pick which effect you want for the item."
  npc_override_glast_01_OldGlastHeim_merchants_i_enchant_your_temporal_656af2: "I can enchant your Temporal Boots items depands on the amount of that item. ^0000FFNot normal type boots^000000. Only possible for those 6 expanded version boots."
  npc_override_glast_01_OldGlastHeim_merchants_i_need_items_temporal_bo_9c41d7: "I need 4 items. ^0000ff{0}, {1}, {2}, Temporal Boots(Socket) Series^000000. If you don't have any of these, I cannot help you."
  npc_override_glast_01_OldGlastHeim_merchants_i_think_putting_slot_int_44d977: "I think putting a slot into the item would be the best. Even with some risk of failing."
  npc_override_glast_01_OldGlastHeim_merchants_i_understand_try_slot_c8af4e: "I understand. Try to slot it."
  npc_override_glast_01_OldGlastHeim_merchants_int_boots_f6e56e: "Int Boots"
  npc_override_glast_01_OldGlastHeim_merchants_lucky_68bec2: "Lucky"
  npc_override_glast_01_OldGlastHeim_merchants_luk_boots_64478b: "Luk Boots"
  npc_override_glast_01_OldGlastHeim_merchants_magician_always_says_enc_0ac7af: "That Magician always says that enchanting Temporal Boots is the best. But, I think quite different."
  npc_override_glast_01_OldGlastHeim_merchants_ok_come_back_again_when_6150db: "Ok, come back again when you are sure."
  npc_override_glast_01_OldGlastHeim_merchants_ok_come_back_anytime_you_80e331: "Ok, come back anytime you want."
  npc_override_glast_01_OldGlastHeim_merchants_ok_come_back_when_you_f2629f: "Ok, come back when you are ready."
  npc_override_glast_01_OldGlastHeim_merchants_once_again_magician_won_026c93: "Once again, ^FF0000That Magician won't enchant any item with a slot.^000000"
  npc_override_glast_01_OldGlastHeim_merchants_once_th_slot_completes_b_02e576: "Once the 4th slot completes the best option, you get to have a random bonus effect to the 3rd slot. With.. certain payment~"
  npc_override_glast_01_OldGlastHeim_merchants_once_you_put_socket_into_fddc17: "But, once you put a socket into the item, you cannot enchant it. Make sure to remember that."
  npc_override_glast_01_OldGlastHeim_merchants_only_item_you_wearing_up_d18a9f: "Only the item you are wearing can be upgraded."
  npc_override_glast_01_OldGlastHeim_merchants_phew_6a9c9d: "Phew..."
  npc_override_glast_01_OldGlastHeim_merchants_quit_1a2285: "Quit"
  npc_override_glast_01_OldGlastHeim_merchants_remember_only_those_type_960a7d: "Remember, only those 6 types of Temporal Boots are available for enchanting."
  npc_override_glast_01_OldGlastHeim_merchants_right_item_enchant_f4f62d: "This is not the right item for this enchant."
  npc_override_glast_01_OldGlastHeim_merchants_right_item_enchant_remem_b65aa7: "This is not the right item for this enchant. Remember, only those 6 types of Temporal Boots with socket are available for hidden enchanting.."
  npc_override_glast_01_OldGlastHeim_merchants_s_my_small_hobby_enchant_130bf4: "It's my small hobby.. To enchant Socketed Temporal Boots using polluted and coagulated spell."
  npc_override_glast_01_OldGlastHeim_merchants_so_you_came_enchant_temp_d8154b: "So you came to enchant the Temporal Boots. Be aware that Boots with sockets cannot be enchanted, and this upgrade is only possible for the boots you are wearing."
  npc_override_glast_01_OldGlastHeim_merchants_some_risk_failing_76fd7a: "It has some risk of failing.."
  npc_override_glast_01_OldGlastHeim_merchants_something_wrong_happened_801756: "Something wrong happened."
  npc_override_glast_01_OldGlastHeim_merchants_spell_2747aa: "Spell"
  npc_override_glast_01_OldGlastHeim_merchants_st_enchanting_you_need_c_457303: "For the 1st enchanting, you need ^0000FF{0}^000000 Coagulated Spell items."
  npc_override_glast_01_OldGlastHeim_merchants_still_want_proceed_320c47: "Still want to proceed?"
  npc_override_glast_01_OldGlastHeim_merchants_still_want_risk_7b71ae: "Still want to risk it?"
  npc_override_glast_01_OldGlastHeim_merchants_str_boots_72ee1b: "Str Boots"
  npc_override_glast_01_OldGlastHeim_merchants_successful_here_you_go_a206d8: "Successful! Here you go."
  npc_override_glast_01_OldGlastHeim_merchants_sure_04b0c5: "Sure"
  npc_override_glast_01_OldGlastHeim_merchants_take_risk_try_add_slot_1512a4: "Take the risk and try to add a slot"
  npc_override_glast_01_OldGlastHeim_merchants_take_these_temporal_boot_85541d: "Take these Temporal Boots. We can upgrade your Temporal Boots with 5 Temporal Crystals."
  npc_override_glast_01_OldGlastHeim_merchants_th_slot_already_upgraded_bb1c48: "4th slot is already upgraded to the final option. Would you like a random bonus effect for the 3rd slot? You need ^0000ff{0}^000000 Coagulated Spell items."
  npc_override_glast_01_OldGlastHeim_merchants_these_boots_already_pass_c9bb17: "These boots have already passed the enchanting limit. We can't enchant them any more."
  npc_override_glast_01_OldGlastHeim_merchants_think_again_ac047b: "Think again"
  npc_override_glast_01_OldGlastHeim_merchants_trying_2e020a: "Trying for {0}"
  npc_override_glast_01_OldGlastHeim_merchants_upgrade_modified_boots_n_55fcc3: "Upgrade Modified Boots (Need 5 Temporal Crystals)"
  npc_override_glast_01_OldGlastHeim_merchants_upgrade_temporal_boots_n_cf4458: "Upgrade Temporal Boots (Need 5 Temporal Crystals)"
  npc_override_glast_01_OldGlastHeim_merchants_vit_boots_802d6d: "Vit Boots"
  npc_override_glast_01_OldGlastHeim_merchants_vitality_be320b: "Vitality"
  npc_override_glast_01_OldGlastHeim_merchants_want_enchant_37767e: "Want to enchant ^0000FF{0}^000000?"
  npc_override_glast_01_OldGlastHeim_merchants_want_enchant_socket_st_e_777cb3: "Want to enchant ^0000ff{0} (Socket)^000000? For the 1st enchanting, you need ^0000ff{1} {2}, {3} {4}, and {5} zeny^000000."
  npc_override_glast_01_OldGlastHeim_merchants_we_need_advanced_tempora_8191c8: "This is not it! We need ^0000FFAdvanced Temporal Boots^000000 items! The item ^0000FFwith a stat effect and without a slot^000000!"
  npc_override_glast_01_OldGlastHeim_merchants_wear_temporal_boots_you_33a171: "Wear the ^0000FFTemporal Boots^000000 you want to upgrade, and then talk to me once again."
  npc_override_glast_01_OldGlastHeim_merchants_well_ok_come_back_when_48b83d: "Well, OK. Come back when you are ready."
  npc_override_glast_01_OldGlastHeim_merchants_what_you_like_exchange_d638ca: "What would you like in exchange for the {0}?"
  npc_override_glast_01_OldGlastHeim_merchants_yes_i_am_sure_ff8acf: "Yes, I am sure."
  npc_override_glast_01_OldGlastHeim_merchants_you_keep_obtain_coagulat_e81de6: "You can keep obtain ^0000FFCoagulated Spell^000000 through your travel times."
  npc_override_glast_01_OldGlastHeim_merchants_you_like_random_bonus_ef_5b4e24: "Would you like a random bonus effect for the 3rd slot? You need ^0000ff{0} {1}, {2} {3}, and {4} zeny^000000. But it has high risk of failing.."
  npc_override_glast_01_OldGlastHeim_merchants_you_must_bring_temporal_6006c4: "You must bring ^0000FF5 Temporal Crystal items^000000. Nothing is free you know..."
  npc_override_glast_01_OldGlastHeim_merchants_you_must_bring_zeny_noth_c1fbdd: "You must bring ^0000ff{0} zeny^000000. Nothing is free you know..."
  npc_override_glast_01_OldGlastHeim_merchants_you_need_more_temporal_c_68cf86: "You need more Temporal Crystals. Come back when you get some more Temporal Crystals during your travel through Old Glast Heim."
  npc_override_glast_01_OldGlastHeim_merchants_you_seem_carrying_too_ma_d53e5a: "You seem to be carrying too many items. Put some items in storage and come back again."
  npc_override_glast_01_OldGlastHeim_merchants_you_should_ask_hugin_s_c72c10: "You should ask Hugin's magic master all the basic things. I want deeper conversation about enchating work."
  npc_override_glast_01_OldGlastHeim_merchants_you_sure_about_buying_te_538946: "Are you sure about buying Temporal ^FF0000{0}^000000 Boots? There's no refunds."
  npc_override_glast_01_OldGlastHeim_merchants_you_sure_you_wearing_ite_711fb0: "Are you sure you are wearing the item?"
  npc_override_glast_01_OldGlastHeim_merchants_you_sure_you_won_t_152811: "Are you sure that you won't regret it?"
  npc_override_glast_01_OldGlastHeim_merchants_you_trade_temporal_boots_c6d6c8: "You can trade ^0000FF1 Temporal Boots and 5 Temporal Crystals^000000 for 1 of the following items. ^FF0000Previous refine rate will not be retained with these new ones^000000."
  npc_override_glast_01_OldGlastHeim_merchants_you_wearing_item_b79b83: "Are you wearing the item?"
  npc_override_glast_01_OldGlastHeim_merchants_you_wearing_temporal_boo_da34a5: "You are not wearing the Temporal Boots. Talk to me once you're wearing them."
  npc_override_glast_01_OldGlastHeim_merchants_your_bag_too_heavy_reduc_55e070: "Your bag is too heavy. Reduce some weight and come back."
  npc_override_glast_01_quests_glastheim_alright_just_tell_me_whe_ba625a: "Alright, just tell me whenever you want to leave."
  npc_override_glast_01_quests_glastheim_alright_please_come_back_c19388: "Alright, please come back whenever you change your mind. I think you will have lots to talk with me about..."
  npc_override_glast_01_quests_glastheim_i_send_you_two_places_6cea5c: "I can send you to two places. Which place would you like me to send you?"
  npc_override_glast_01_quests_glastheim_i_t_move_between_time_23a111: "I can't move between time and dimensions like master Hugin but I can pretend to."
  npc_override_glast_01_quests_glastheim_menu_cancel_9335a2: "Cancel:Monastery Cemetery (Lv100~130) - 5000z:2nd floor Corridor (Over Lv140) - 10000z"
  npc_override_glast_01_quests_glastheim_menu_i_2453a9: "I didn't mean to talk to you:Please get me out of here"
  npc_override_glast_01_quests_glastheim_menu_i_604908: "I don't care:That is interesting, please tell me more"
  npc_override_glast_01_quests_glastheim_menu_no_f625c3: "No exploration for me:I really want to explore!"
  npc_override_glast_01_quests_glastheim_ok_let_s_get_out_30e7c4: "Ok, let's get out of here."
  npc_override_glast_01_quests_glastheim_sure_free_service_i_get_acc109: "Sure, but this is not a free service! I have to get something in return. Hoho..."
  npc_override_glast_01_quests_glastheim_thanks_hugin_i_found_way_a82eef: "Thanks to Hugin, I found the way to access this Old Glast Heim, which is imbued by such powerful dark forces."
  npc_override_glast_01_quests_glastheim_well_if_you_interested_n_3a5b3e: "Well, if you are not interested in it, never mind."
  npc_override_glast_01_quests_glastheim_what_did_you_expect_serv_7d8a41: "What? Did you expect this service for free?"
  npc_override_glast_01_quests_glastheim_what_s_causing_glast_hei_318b30: "What's causing this Glast Heim to be imbued with such a powerful dark force?"
  npc_override_glast_01_quests_glastheim_what_you_say_you_want_5f7d3d: "What do you say? Do you want to explore there?"
  npc_override_glast_01_quests_glastheim_you_want_return_372aa8: "You want to return?"
