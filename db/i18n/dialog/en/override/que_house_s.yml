  npc_override_que_house_s_homun_s_i_see_c52c6e: "I see."
  npc_override_que_house_s_homun_s_i_see_you_mean_business_82edc8: "I see that you mean business."
  npc_override_que_house_s_homun_s_i_think_i_ve_mistaken_a24beb: "I think I've mistaken you for someone else."
  npc_override_que_house_s_homun_s_i_think_s_good_thing_d899af: "I think it's a good thing."
  npc_override_que_house_s_homun_s_i_think_something_neglig_f8b461: "I think it was something to do with ^006400Negligence of Homunculus in public places^000000."
  npc_override_que_house_s_homun_s_i_think_you_ll_find_3a33d0: "But I think you'll find that pretty satisfying."
  npc_override_que_house_s_homun_s_i_thought_you_here_see_94a8a5: "I thought you were here to see me."
  npc_override_que_house_s_homun_s_i_understand_your_concer_753371: "I understand your concern."
  npc_override_que_house_s_homun_s_i_used_merchant_once_jus_09ba1a: "I used to be a merchant once, just like you."
