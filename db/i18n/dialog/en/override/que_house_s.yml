  npc_override_que_house_s_homun_s_i_ll_waiting_laboratory_68b55f: "I'll be waiting at the ^8B4513Laboratory^000000."
  npc_override_que_house_s_homun_s_i_love_watching_him_jump_25cc66: "I love watching him jump out of his skin.... I look forward to the day."
  npc_override_que_house_s_homun_s_i_m_charge_managing_stra_4e6298: "I'm in charge of managing ^0000FFStrange Embryo^000000 so I'll take care of that for you."
  npc_override_que_house_s_homun_s_i_m_glad_you_re_89d9f2: "I'm glad you're not upset."
  npc_override_que_house_s_homun_s_i_m_researching_homuncul_4ea33c: "I'm researching on ^FF4800Homunculus^000000."
