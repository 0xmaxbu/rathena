  npc_override_que_house_s_homun_s_i_know_how_important_1ab475: "I know how important it is"
  npc_override_que_house_s_homun_s_i_know_s_little_abrupt_0e6b62: "I know it's a little abrupt, but..."
  npc_override_que_house_s_homun_s_i_lack_any_investors_sup_217cee: "That and I lack any investors to support my research at the moment."
