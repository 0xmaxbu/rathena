  npc_override_nyd_dun02_quests_13_2_as_matter_fact_we_trying_23d958: "As a matter of fact, we are trying not to have any contact with the giants of Manuk so we stay away from each other's territory."
  npc_override_nyd_dun02_quests_13_2_as_our_conversation_reac_d21937: "and as our conversation has reached this point, you should have an idea of my request, right?"
  npc_override_nyd_dun02_quests_13_2_as_soon_as_you_done_37d266: "As soon as you are done collecting the berries, bring them to the Sapha Village right away!!!"
