  npc_override_nyd_dun02_quests_13_2_anyway_fairy_now_prison_3cc395: "Anyway, that fairy is now in prison."
  npc_override_nyd_dun02_quests_13_2_anyway_my_name_gill_bfec60: "Anyway my name is ^0000FFGill^000000."
