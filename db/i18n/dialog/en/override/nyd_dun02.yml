  npc_override_nyd_dun02_quests_13_2_alfheim_open_seed_325b09: "Alfheim open with the seed."
  npc_override_nyd_dun02_quests_13_2_all_58daf2: "Is that all?"
  npc_override_nyd_dun02_quests_13_2_all_grown_laphine_one_591523: "All grown Laphine have one."
  npc_override_nyd_dun02_quests_13_2_all_i_could_keep_tapping_aac6b1: "- All I could do was to keep tapping his shoulder... as he quietly sobbed... -"
  npc_override_nyd_dun02_quests_13_2_all_over_room_so_wrapped_3c380b: "- all over the room and so wrapped up -"
  npc_override_nyd_dun02_quests_13_2_all_preperation_done_all_76b8b6: "With all preperation done, allow me about one hour to finish this thing."
  npc_override_nyd_dun02_quests_13_2_all_these_marvelous_feat_3a81f4: "With all these marvelous features, it's just 39,900 zeny....!!!"
  npc_override_nyd_dun02_quests_13_2_alliance_research_group_683e83: "The Alliance Research Group has great interest in other intelligent life. Each country's secret agents are making every effort to communicate with those two races, there's just not enough information."
  npc_override_nyd_dun02_quests_13_2_also_they_looking_someth_2cc251: "Also, they were looking for something that can cure a wounded Laphine..."
  npc_override_nyd_dun02_quests_13_2_although_i_don_t_much_cccf8b: "Although I don't have much to offer, please accept these coins."
  npc_override_nyd_dun02_quests_13_2_amount_mineral_627303: "But the amount of the mineral"
  npc_override_nyd_dun02_quests_13_2_ancient_rune_midgarts_ki_0ed1f2: "The Ancient Rune-Midgarts Kingdom used some kind of magic on a magical gem to store large amounts of information... Using a gem as storage..."
  npc_override_nyd_dun02_quests_13_2_ancient_rune_midgarts_ki_d06203: "Ancient Rune-Midgarts Kingdom used a some kind of magic onto a magical gem to store large information...Using a gem as a storage..."
