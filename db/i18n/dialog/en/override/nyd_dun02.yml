Body:
  npc_override_nyd_dun02_quests_13_2_according_expedition_cam_e932c9: "According to the Expedition Camp's investigation, there is a different ethnic race that is similar to fairy's, along with a different ethnic race that is similar to giants."
  npc_override_nyd_dun02_quests_13_2_actually_residents_villa_804f85: "Actually, residents of this village continued to offer resistance. So I shall save your location at Midgards Allied Forces Post for your safety."
  npc_override_nyd_dun02_quests_13_2_actually_s_going_too_wel_46fc2d: "Actually, it's going TOO well..."
  npc_override_nyd_dun02_quests_13_2_additional_services_plea_73291f: "For additional services, please consult Agent Gyaruk."
  npc_override_nyd_dun02_quests_13_2_aewrf_sd_fsd_iyu_ed6e71: "Aewrf sd fsd iyu. "
  npc_override_nyd_dun02_quests_13_2_after_laphine_gained_her_2a726a: "- After the Laphine gained her full consciousness, she gazed around and spoke in shaky voice. -"
  npc_override_nyd_dun02_quests_13_2_after_quite_while_fairy_519143: "After quite a while, that fairy came."
  npc_override_nyd_dun02_quests_13_2_after_you_ve_finished_se_bee95c: "After you've finished searching bring that note back to me."
  npc_override_nyd_dun02_quests_13_2_again_you_slip_through_m_18443f: "Again, you slip through the muddy roots."
  npc_override_nyd_dun02_quests_13_2_agoltas_me_0e2cd7: "Agoltas Me..."
  npc_override_nyd_dun02_quests_13_2_ah_8fcb71: "Ah!!!"
  npc_override_nyd_dun02_quests_13_2_ah_ah_stop_right_there_8af55a: "Ah~Ah~Stop right there..."
  npc_override_nyd_dun02_quests_13_2_ah_anyway_you_look_like_07821b: "Ah...anyway..you look like you're having some trouble. What happened?"
  npc_override_nyd_dun02_quests_13_2_ah_don_t_worry_about_003f0d: "Ah... and don't worry about the title of the note."
  npc_override_nyd_dun02_quests_13_2_ah_finally_i_ve_been_4aace4: "Ah, finally. I've been speaking with Terra while we waited for you."
  npc_override_nyd_dun02_quests_13_2_ah_here_um_f9e862: "Ah....here.....um..."
  npc_override_nyd_dun02_quests_13_2_ah_i_told_you_s_3e58db: "Ah, I told you it's not possible Snorren!"
  npc_override_nyd_dun02_quests_13_2_ah_i_ve_heard_our_5a8ef5: "Ah~ I've heard from our Commander about you. You've done much for the Midgard Alliance Camp. Anyways, what brings you here?"
  npc_override_nyd_dun02_quests_13_2_ah_isn_t_much_s_6f540c: "Ah... this isn't much, but it's a coin that the giants use."
  npc_override_nyd_dun02_quests_13_2_ah_just_moment_ago_you_660b2a: "Ah...but just a moment ago, you were having a hard time with something. Is something wrong?"
  npc_override_nyd_dun02_quests_13_2_ah_just_time_3784eb: "Ah! Just in time!"
  npc_override_nyd_dun02_quests_13_2_ah_looks_like_you_ve_a7a461: "Ah, Looks like you've succeeded."
  npc_override_nyd_dun02_quests_13_2_ah_must_fate_we_met_c49203: "Ah~ It must be fate that we met~"
  npc_override_nyd_dun02_quests_13_2_ah_no_no_s_nothing_633e33: "Ah, No, No, It's nothing."
  npc_override_nyd_dun02_quests_13_2_ah_please_keep_secret_ot_80a4cf: "Ah, and please keep this a secret from the other Laphines."
  npc_override_nyd_dun02_quests_13_2_ah_quick_49a13c: "Ah, that was quick."
  npc_override_nyd_dun02_quests_13_2_ah_right_41361b: "Ah, right. {0}!"
  npc_override_nyd_dun02_quests_13_2_ah_right_i_heard_rune_dc9dee: "Ah, right, I heard that a ^0000ffRune-Midgarts Magician^000000 knows a way to conduct research based on a sample of language, would you go and ask him to help me?"
  npc_override_nyd_dun02_quests_13_2_ah_ruffthus_neash_man_ne_6f24c9: "ah..RuffThus NeAsh. man nesAsh OdesAlah ?"
  npc_override_nyd_dun02_quests_13_2_ah_see_here_1dfa7d: "Ah... see here..."
  npc_override_nyd_dun02_quests_13_2_ah_taab_isn_t_flexible_b8e08d: "Ah, Taab isn't flexible at all."
  npc_override_nyd_dun02_quests_13_2_ah_thor_thorosa_yee_lu_2d3fd1: "..ah..Thor..ThorOsa Yee Lu..ung..."
  npc_override_nyd_dun02_quests_13_2_ah_we_even_understand_ea_399aa9: "Ah, Do we even understand each other?"
  npc_override_nyd_dun02_quests_13_2_ah_well_met_35e706: "Ah, Well met!"
  npc_override_nyd_dun02_quests_13_2_ah_well_s_as_easy_a4cdcd: "Ah! Well, It's not as easy as I thought. These languages can't be heard anywhere on the Midgard Continent. No known phonetic rules seem to apply here."
  npc_override_nyd_dun02_quests_13_2_ah_you_here_ff9c67: "Ah, You are here."
  npc_override_nyd_dun02_quests_13_2_ah_you_ve_returned_a7d661: "Ah! You've returned!"
  npc_override_nyd_dun02_quests_13_2_aha_now_i_understand_fa7e8a: "Aha! Now I understand..."
  npc_override_nyd_dun02_quests_13_2_ahh_feeling_much_better_507a98: "Ahh! Feeling much better!"
  npc_override_nyd_dun02_quests_13_2_ahh_feels_like_home_327adf: "Ahh! Feels like at home!!"
  npc_override_nyd_dun02_quests_13_2_ahh_foreign_visitor_47e153: "Ahh! A foreign visitor!"
  npc_override_nyd_dun02_quests_13_2_ahhhhhhh_cb3522: "Ahhhhhhh!!!!!!!!"
