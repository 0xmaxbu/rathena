  npc_override_nyd_dun02_quests_13_2_anyways_i_favor_ask_you_fe702f: "Anyways, I have a favor to ask you. Is it okay?"
  npc_override_nyd_dun02_quests_13_2_anyways_now_we_ve_got_98923a: "Anyways, now we've got the idea, I will give you this first piece of work."
  npc_override_nyd_dun02_quests_13_2_anyways_shortly_after_og_5bed37: "Anyways, shortly after Ogen went missing the fairy appears... this is too suspicious..."
  npc_override_nyd_dun02_quests_13_2_apeu_hjsu_opuer_37fd77: "Apeu hjsu opuer "
  npc_override_nyd_dun02_quests_13_2_apparently_these_people_3a6945: "Apparently these people are speaking in a strange languages that we humans can't understand...but no one seems to be able to remember how their languages sound like."
  npc_override_nyd_dun02_quests_13_2_appears_like_s_holding_s_c52bd5: "And it appears like it's holding something in its arms..."
  npc_override_nyd_dun02_quests_13_2_approximate_location_eba27e: "The approximate location is..."
  npc_override_nyd_dun02_quests_13_2_arc_asked_me_find_you_08b25a: "Arc asked me to find you. So I came here."
  npc_override_nyd_dun02_quests_13_2_arc_cf7f15: "Arc?"
