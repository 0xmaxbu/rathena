  npc_override_payon_26-40_s_shaped_like_insect_bla_146e6a: "It's shaped like an insect with black sleek skin and it has a giant horn it's head."
  npc_override_payon_26-40_thank_you_very_much_god_0d634e: "Thank you very much. God bless you!"
