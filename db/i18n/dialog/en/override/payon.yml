  npc_override_payon_26-40_please_check_your_quest_4755aa: "Please check your Quest Window by pressing 'alt + u'."
  npc_override_payon_26-40_porings_steal_items_if_t_1e998e: "Porings steal items if they see them on the ground. However, Marin has no interest in dropped items. So I was wondering, how come Marin doesn't pay attention to gathering items even though they are the same kind of monster as Porings."
  npc_override_payon_26-40_really_hmm_oh_right_you_8cd9f0: "Really? Hmm, oh right. You don't look sophisticated."
