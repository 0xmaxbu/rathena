  npc_override_payon_26-40_arrived_much_faster_than_cbce5d: "It arrived much faster than I thought. I want to test them right away!"
  npc_override_payon_26-40_bigfoot_around_north_gef_c55f76: "Bigfoot is around the north of Geffen field or the southeast of Payon field."
