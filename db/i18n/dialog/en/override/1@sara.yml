Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@sara_SaraMemory_after_being_given_flower_ec58de: "After being given the flowers the Doyen's mood seems to greatly improve."
  npc_override_1@sara_SaraMemory_ahh_sara_i_just_looking_cfa0af: "Ahh Sara! I was just looking for you..."
  npc_override_1@sara_SaraMemory_alright_my_princess_wher_32ed2b: "Alright my princess, where should we go now?"
  npc_override_1@sara_SaraMemory_as_they_wander_off_you_4b7f46: "As they wander off you hear strange voices from around the corner..."
  npc_override_1@sara_SaraMemory_as_you_about_call_out_5a2488: "As you are about to call out to Sara, a sudden blow knocks you down from behind."
  npc_override_1@sara_SaraMemory_as_you_explore_you_start_fb2f3d: "As you explore it you start to see cracks in space and time. Each one covered by a dimensional device."
  npc_override_1@sara_SaraMemory_as_you_fall_ground_two_c9f1dd: "As you fall to the ground, two dark figures approach Sara."
  npc_override_1@sara_SaraMemory_before_you_enter_you_nee_0b9622: "Before you enter you need to organize a party! Don't you know how? Type /organize PARTYNAMEHERE."
  npc_override_1@sara_SaraMemory_before_you_go_playing_ar_f5bd74: "Before you go playing around with that; Why don't you come over here and talk to me?"
  npc_override_1@sara_SaraMemory_course_silly_daddy_b6515f: "Of course silly daddy!"
  npc_override_1@sara_SaraMemory_daddy_40b1d5: "Daddy!"
  npc_override_1@sara_SaraMemory_daddy_why_2486c5: "Daddy why?!"
  npc_override_1@sara_SaraMemory_dimensional_device_boots_9f9845: "^FF0000The dimensional device boots up cleanly. Use the device to enter the crack in space and time.^000000"
  npc_override_1@sara_SaraMemory_don_t_say_sweetheart_who_ead657: "Don't say that sweetheart... Who is this with you?"
  npc_override_1@sara_SaraMemory_door_opens_reveal_woman_e926a0: "The door opens to reveal a woman near death laying on the floor and the Doyen standing over the woman with a bloody sword."
  npc_override_1@sara_SaraMemory_doyen_irene_draws_blade_bf51be: "Doyen Irene draws this blade!"
  npc_override_1@sara_SaraMemory_doyen_irene_fallen_608d4c: "Doyen Irene has fallen."
  npc_override_1@sara_SaraMemory_doyen_irene_stares_you_f_7ec6b2: "Doyen Irene stares at you with fire in his eyes."
  npc_override_1@sara_SaraMemory_doyen_turns_around_notic_27e3ec: "The Doyen turns around and notices Sara."
  npc_override_1@sara_SaraMemory_escape_sara_78a45c: "Escape with Sara."
  npc_override_1@sara_SaraMemory_example_i_think_i_caught_c239df: "For example, I think I have caught glimpses of Payon through the one closest to us. But it doesn't seem right. Almost like it is a little bit older than it should be."
  npc_override_1@sara_SaraMemory_excuse_my_rudeness_i_am_3e3069: "Excuse my rudeness! I am Pon de Leon, the famous adventurer!"
  npc_override_1@sara_SaraMemory_gem_rolls_woman_s_hand_1df194: "A gem rolls from the woman's hand and comes to a rest in front of Sara. Unconsciously Sara reaches down and picks up the gem."
  npc_override_1@sara_SaraMemory_girl_full_betrayal_despa_82c01f: "A girl full of betrayal, despair, and hate. We will guide you to your ultimate fate."
  npc_override_1@sara_SaraMemory_guards_guards_there_murd_4aedf4: "Guards! GUARDS!! There is a murderer here! Catch him!"
  npc_override_1@sara_SaraMemory_guards_must_defeated_gai_e07a45: "The guards must be defeated to gain access to the next area."
  npc_override_1@sara_SaraMemory_hah_ok_hold_onto_me_781dcf: "Hah! Ok, hold onto me tight!"
  npc_override_1@sara_SaraMemory_hello_village_payon_you_badc6e: "Hello! This is the village of Payon. You don't seem to be from around here..."
  npc_override_1@sara_SaraMemory_here_you_go_daddy_7d20f2: "Here you go daddy!"
  npc_override_1@sara_SaraMemory_hey_you_too_young_playin_a52f9a: "Hey! You are too young to be playing with that! Come back when you are at least ^0000FFLevel 99^000000!"
  npc_override_1@sara_SaraMemory_hi_daddy_e56ebc: "Hi Daddy!"
  npc_override_1@sara_SaraMemory_hrumph_sara_irene_she_s_dc70b5: "Hrumph, Sara Irene?! She's one of the 12 Valkyries. I didn't know her story was that tragic..."
  npc_override_1@sara_SaraMemory_i_am_getting_too_old_fae682: "I am getting too old for this sh-"
  npc_override_1@sara_SaraMemory_i_am_glad_hear_maybe_349bdc: "I am glad to hear that! Maybe someday you can be as brave as old Leon the Lion!"
  npc_override_1@sara_SaraMemory_i_am_here_give_flowers_adbf3e: "I am here to give flowers to my mommy!"
  npc_override_1@sara_SaraMemory_i_am_just_adventurer_who_afe8a6: "I am just an adventurer who was passing through. I heard some strange men plotting their deaths and needed to intervene."
  npc_override_1@sara_SaraMemory_i_am_sure_you_fully_663446: "I am not sure you have fully explored the crack in space and time yet. Perhaps you should look a bit further into it."
  npc_override_1@sara_SaraMemory_i_am_waiting_my_father_06e546: "I am waiting for my father. He said that he will be here soon."
  npc_override_1@sara_SaraMemory_i_been_looking_you_sara_d5766f: "I have been looking for you Sara. Please come with daddy, it is very dangerous here!"
  npc_override_1@sara_SaraMemory_i_feel_sara_s_power_566bc9: "I can feel Sara's power growing. We cannot just stand by and let her achieve her full potential!"
  npc_override_1@sara_SaraMemory_i_hate_those_old_fogeys_482d35: "I hate those old fogeys."
  npc_override_1@sara_SaraMemory_i_revenge_sara_s_mom_9ed0b0: "I will have revenge for Sara's mom !!"
  npc_override_1@sara_SaraMemory_i_think_about_hours_afte_4b390b: "I think in about 20 hours after you last entered the rift, it will be stable enough for you to transverse it again."
  npc_override_1@sara_SaraMemory_i_want_explore_my_old_ac29ad: "I want to explore it, but with my old age and my knees I don't seem to be quite up to the task."
  npc_override_1@sara_SaraMemory_i_won_t_let_you_2dc97e: "I won't let you take Sara!"
  npc_override_1@sara_SaraMemory_if_you_assassin_sent_kil_103e32: "If... you are the not the assassin sent to kill my wife and daughter, who are you?"
  npc_override_1@sara_SaraMemory_if_you_telling_truth_for_bc8997: "If... you are telling the truth... forgive me. I thought you were one of them."
  npc_override_1@sara_SaraMemory_memorial_dungeon_exist_b126a8: "The memorial dungeon {0} does not exist."
  npc_override_1@sara_SaraMemory_menu_okay_a81b9e: "Okay:Give up"
  npc_override_1@sara_SaraMemory_menu_party_2e5e7f: "Party Name: {0}"
  npc_override_1@sara_SaraMemory_menu_party_8c7899: "Party Leader: {0}"
  npc_override_1@sara_SaraMemory_menu_yes_141459: "Yes:No"
  npc_override_1@sara_SaraMemory_mom_dad_look_what_i_8c5197: "Mom! Dad! Look what I found!"
  npc_override_1@sara_SaraMemory_mommy_11cfd2: "...Mommy"
  npc_override_1@sara_SaraMemory_mommy_5b9cf0: "Mommy!"
  npc_override_1@sara_SaraMemory_mommy_ac1692: "Not mommy!"
  npc_override_1@sara_SaraMemory_mommy_no_f5c93f: "Mommy NO!!!!!!!!!!"
  npc_override_1@sara_SaraMemory_msg_5a2bae: "........."
  npc_override_1@sara_SaraMemory_msg_61ce5a: "[{0}]"
  npc_override_1@sara_SaraMemory_msg_6eae3a: "..."
  npc_override_1@sara_SaraMemory_murderer_here_guards_we_d99629: "The murderer is here! Guards! We will finish him once and for all!"
  npc_override_1@sara_SaraMemory_my_father_doyen_village_c80007: "My father is doyen of this village! I just take after my mother."
  npc_override_1@sara_SaraMemory_my_friends_call_me_leon_0debb2: "My friends call me Leon the Lion! For my tough appearance and attitude. Plus I have quite the bite!"
  npc_override_1@sara_SaraMemory_no_1d59ae: "No!"
  npc_override_1@sara_SaraMemory_nooooo_1b8e0d: "Nooooo..."
  npc_override_1@sara_SaraMemory_oh_daddy_lets_go_top_112a6a: "Oh daddy! Lets go to the top of that hill over there!"
  npc_override_1@sara_SaraMemory_oh_hello_again_i_remembe_b6eb92: "Oh! Hello again! I remember you, what's up?"
  npc_override_1@sara_SaraMemory_oh_i_am_sorry_uh_1f8117: "Oh! I am sorry! Uh... Why are you standing out here all alone?"
  npc_override_1@sara_SaraMemory_oh_sara_may_i_them_c70150: "Oh Sara, may I have them?"
  npc_override_1@sara_SaraMemory_okay_302ca1: "...okay."
  npc_override_1@sara_SaraMemory_old_men_wander_off_seems_1c52cf: "The old men wander off. It seems Sara might be in danger. We have to do something!"
  npc_override_1@sara_SaraMemory_older_man_exits_house_sa_f25467: "An older man exits the house. Sara's face brightens at the sight of him."
  npc_override_1@sara_SaraMemory_one_cloaked_strangers_co_29ea86: "One of the cloaked strangers covers Sara with their cloak and all three figures disappear."
  npc_override_1@sara_SaraMemory_only_registered_members_5e6e47: "Only the registered members can enter the instance {0}."
  npc_override_1@sara_SaraMemory_party_leader_did_boot_up_103392: "^FF0000The party leader did not boot up the dimensional device.^000000"
  npc_override_1@sara_SaraMemory_party_leader_did_generat_5a6394: "The party leader did not generate the dungeon yet."
  npc_override_1@sara_SaraMemory_payon_4b6889: "For Payon !!"
  npc_override_1@sara_SaraMemory_please_don_t_tell_anyone_397f2f: "Please don't tell anyone about your time travelling adventure. We can't have anyone thinking you more important than old Leon. Plus they wouldn't believe such a story anyway."
  npc_override_1@sara_SaraMemory_please_venture_through_d_98ca7d: "Please venture through the dimensional device and report to me what you find within."
  npc_override_1@sara_SaraMemory_reservation_failed_b861ab: "^0000ff{0} ^000000- Reservation Failed!"
  npc_override_1@sara_SaraMemory_sara_bc09a2: "Sara..."
  npc_override_1@sara_SaraMemory_sara_believes_you_killed_8b1aff: "Sara believes that you killed her mother. We need to tell her the truth!"
  npc_override_1@sara_SaraMemory_sara_continues_run_away_3cc3b5: "Sara continues to run away! You think she went in the 12 O'clock direction!"
  npc_override_1@sara_SaraMemory_sara_irene_he_make_your_42702e: "Sara Irene, 'he' will make your dreams come true."
  npc_override_1@sara_SaraMemory_sara_leaps_forward_open_6e202d: "Sara leaps forward to open the door, flowers at the ready."
  npc_override_1@sara_SaraMemory_sara_ran_away_again_you_256918: "Sara ran away again! You think she went in the 2 O'clock direction!"
  npc_override_1@sara_SaraMemory_sara_ran_away_yet_again_808641: "Sara ran away yet again! *sigh* You think she went in the 12 O'clock direction!"
  npc_override_1@sara_SaraMemory_sara_ran_away_yet_again_adbb84: "Sara ran away yet again! You think she went in the 5 O'clock direction!"
  npc_override_1@sara_SaraMemory_sara_ru_away_c3a185: "Sara...Ru-...away..."
  npc_override_1@sara_SaraMemory_sara_run_save_yourself_5ac57d: "Sara... run! Save yourself!"
  npc_override_1@sara_SaraMemory_sara_runs_away_sound_gua_055ca5: "Sara runs away and the sound of the guards is getting closer..."
  npc_override_1@sara_SaraMemory_sara_s_memories_cooldown_6d5b08: "^0000FF[ Sara's Memories ] Cooldown has been cleared. It is now possible to use the dimensional device again.^000000"
  npc_override_1@sara_SaraMemory_sara_starts_humming_sing_c0056c: "Sara starts humming and singing softly to herself. She picks some wild flowers nearby and presents them to the Doyen."
  npc_override_1@sara_SaraMemory_seems_you_caused_huge_mi_e1bf4e: "It seems that you caused a huge misunderstanding between her and her father."
  npc_override_1@sara_SaraMemory_several_groups_guards_fo_533c43: "Several groups of guards have formed to fight you!"
  npc_override_1@sara_SaraMemory_she_born_under_bad_sign_23c049: "She was born under a bad sign and her mother isn't even one of us!"
  npc_override_1@sara_SaraMemory_she_cough_had_already_be_29aeec: "She *cough* had already been stabbed by an assassin. I slew him *hack* that is why my blade was covered in blood..."
  npc_override_1@sara_SaraMemory_so_i_like_ask_something_775b2b: "So, I would like to ask something of you."
  npc_override_1@sara_SaraMemory_someday_she_cause_blood_9e29d9: "Someday she will cause blood to flow in our streets."
  npc_override_1@sara_SaraMemory_sound_many_pairs_boots_h_334003: "The sound of many pairs of boots can be heard running outside!"
  npc_override_1@sara_SaraMemory_strange_men_i_bet_they_b5a2e0: "Strange men? ...I bet they were some of the village elders. Ugh..."
  npc_override_1@sara_SaraMemory_sweetheart_i_am_sorry_i_e23ce3: "Sweetheart, I am sorry I made you wait so long. The meeting with the village elders took longer than expected."
  npc_override_1@sara_SaraMemory_sweetheart_you_look_so_h_a38ae8: "Sweetheart you look so happy."
  npc_override_1@sara_SaraMemory_there_might_more_assassi_f2284d: "There might be more assassins so we have to find Sara as fast as we can!"
  npc_override_1@sara_SaraMemory_thinking_back_you_seem_r_9d018b: "Thinking back, you seem to recall another body laying in the left corner of the room. Maybe that was the assassin the Doyen is talking about."
  npc_override_1@sara_SaraMemory_though_i_should_warn_you_05c03d: "Though I should warn you. It might be unstable. Make sure you enter as soon as you can."
  npc_override_1@sara_SaraMemory_though_i_should_warn_you_1ba83e: "Though; I should warn you. It might be unstable. Make sure you enter as soon as you can."
  npc_override_1@sara_SaraMemory_time_travellers_cannot_i_a23185: "The time travellers cannot interfere any longer. You cannot stop us from meeting Sara."
  npc_override_1@sara_SaraMemory_unknown_error_occurred_58bda4: "An unknown error has occurred."
  npc_override_1@sara_SaraMemory_we_must_find_sara_you_823b92: "We must find Sara. You seem to remember her running in the 8 O'clock direction."
  npc_override_1@sara_SaraMemory_we_must_our_best_find_4b7ffe: "We must do our best to find her. Lets split up and search for her. Please help me find my daughter and explain everything to her."
  npc_override_1@sara_SaraMemory_we_see_i_look_forward_06c80c: "We will see... I look forward to hearing the bad news that has befallen her..."
  npc_override_1@sara_SaraMemory_we_something_before_holy_294805: "We have to do something before the Holy creatures select her. I asked 'HIM' to take care of it."
  npc_override_1@sara_SaraMemory_well_i_t_force_you_e6a89c: "Well... I can't force you. But if you ever find the courage please talk to me again."
  npc_override_1@sara_SaraMemory_what_did_you_see_there_b51588: "What did you see in there?!"
  npc_override_1@sara_SaraMemory_what_you_talking_about_w_b134c2: "What are you talking about? We saw you standing over Sara's mother with your sword COVERED in blood!"
  npc_override_1@sara_SaraMemory_where_am_i_006e21: "Where am I?"
  npc_override_1@sara_SaraMemory_why_daddy_d23422: "Why daddy?"
  npc_override_1@sara_SaraMemory_why_hack_you_trying_kill_794d24: "Why... *hack* are you trying to kill my wife and daughter?"
  npc_override_1@sara_SaraMemory_why_hurt_so_much_4c2666: "Why does it hurt so much?"
  npc_override_1@sara_SaraMemory_why_why_bbea2a: "Why... why?"
  npc_override_1@sara_SaraMemory_yes_i_born_here_my_6c8003: "Yes! I was born here! My name is Sara, Sara Irene!"
  npc_override_1@sara_SaraMemory_you_here_you_don_t_e8f2eb: "Are you from here? You don't seem to quite match the locals either."
  npc_override_1@sara_SaraMemory_you_know_place_doesn_t_33f9d1: "You know... this place doesn't seem to be safe for you. Please return to me once you have achieved ^0000FFLevel 99^000000 or higher."
  npc_override_1@sara_SaraMemory_you_know_such_strange_lo_fb2352: "You know, this is such a strange location..."
  npc_override_1@sara_SaraMemory_you_said_you_come_back_5ef62b: "You said you would come back soon! I waited for you and you lied!"
  npc_override_1@sara_SaraMemory_you_should_blame_yoursel_9d891e: "You should not blame yourself for what occurred, or all the blood that was spilled. It seems that the events that day were fated to happen no matter who was there."
  npc_override_1@sara_SaraMemory_you_should_go_back_time_eda888: "You should go back to the time where you belong."
  npc_override_1@sara_SaraMemory_you_think_i_killed_sara_44efe8: "You... think I killed Sara's mother?"
  npc_override_1@sara_SaraMemory_you_too_strong_me_d1c074: "You... were too strong for me."
  npc_override_1@sara_SaraMemory_you_wish_relive_past_aga_ad2f8e: "You wish to relive the past again?"
