  npc_override_alberta_alberta_admission_875177: "The admission"
  npc_override_alberta_alberta_ah_captain_i_miss_our_677a91: "AH~ Captain. I miss our cap'n more than anything... No foe survived before cap'n's sword."
  npc_override_alberta_alberta_ah_ol_days_if_only_fb662a: "Ah~ The ol'days. If only... If only we hadn't run into that STORM...^666666*hiccup*^000000"
