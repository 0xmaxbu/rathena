Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_alberta_alberta_admission_875177: "The admission"
  npc_override_alberta_alberta_ah_captain_i_miss_our_677a91: "AH~ Captain. I miss our cap'n more than anything... No foe survived before cap'n's sword."
  npc_override_alberta_alberta_ah_ol_days_if_only_fb662a: "Ah~ The ol'days. If only... If only we hadn't run into that STORM...^666666*hiccup*^000000"
  npc_override_alberta_alberta_ahoy_mate_618393: "Ahoy mate,"
  npc_override_alberta_alberta_ain_t_no_way_yer_ae2661: "Ain't no way yer getting there without the 500 zeny first!"
  npc_override_alberta_alberta_alberta_harbour_13a048: "Alberta harbour."
  npc_override_alberta_alberta_alright_6ceaec: "Alright..."
  npc_override_alberta_alberta_alright_let_s_see_what_9fa3f9: "Alright, let's see what ya got..."
  npc_override_alberta_alberta_alright_then_see_you_nex_df4543: "Alright then, see you next time."
  npc_override_alberta_alberta_alright_well_7884aa: "Alright, well..."
  npc_override_alberta_alberta_as_many_as_i_get_9316c1: "As many as I can get, please"
  npc_override_alberta_alberta_as_many_as_i_please_8d61cb: "As many as I can, please."
  npc_override_alberta_alberta_bastard_captain_fighting_dc6814: "The bastard the captain was fighting, and anyone of his friends near him, were surrounded in flame!"
  npc_override_alberta_alberta_business_341748: "to do business."
  npc_override_alberta_alberta_captain_hiccup_he_swing_0eb19b: "CAPTAIN~!!! ^666666*HICCUP~*^000000 He would swing his sword like this, then... THEN!!"
  npc_override_alberta_alberta_carrots_please_81ff20: "Carrots please."
  npc_override_alberta_alberta_catch_ya_later_8ace61: "Catch'ya later."
  npc_override_alberta_alberta_derelict_ship_a29b3c: "a derelict ship"
  npc_override_alberta_alberta_discount_skill_we_buy_go_6f3f18: "With the Discount skill, we can buy goods really cheap from the stores in towns and load them into the cart we rent."
  npc_override_alberta_alberta_drifted_into_2e8dc1: "drifted into"
  npc_override_alberta_alberta_exploration_team_295246: "exploration team"
  npc_override_alberta_alberta_fee_only_b2cb9d: "fee is only"
  npc_override_alberta_alberta_go_away_41df5b: "Go AWAY~"
  npc_override_alberta_alberta_good_day_5017a8: "Good day~"
  npc_override_alberta_alberta_hahahaha_hiccup_you_ve_g_a0b2cb: "Hahahaha ^666666*hiccup*^000000... You've got some nerve. I may look worthless now, but I used to be a sailor on the 'Going Mary.'"
  npc_override_alberta_alberta_hell_you_doing_here_439faa: "The hell are you doing here?"
  npc_override_alberta_alberta_hey_now_don_t_try_7026b9: "Hey now, don't try to cheat me! I said 250 zeny!"
  npc_override_alberta_alberta_hey_pansy_ass_i_said_2ba7d2: "Hey pansy ass, I said 100 at most, no more than that! I'm not going to break my back for the likes of you!"
  npc_override_alberta_alberta_hey_weren_t_you_listenin_64a5cb: "Hey! Weren't you listening? I said 10 Jellopies for 1 Red Potion.. are ya deaf?"
  npc_override_alberta_alberta_hey_what_d_i_say_b91997: "Hey, what'd I say? 100 at a time at most, you're trying to kill me aren't you!"
  npc_override_alberta_alberta_hey_you_know_one_time_a88e98: "Hey, you know, this one time I was walking through the forest and I saw this little green stem moving around."
  npc_override_alberta_alberta_hmm_bad_4ccb16: "Hmm, not bad..."
  npc_override_alberta_alberta_hmm_look_pansy_ass_i_9f0f61: "Hmm, look pansy ass, I said 3 Jellopies for 1 Carrot.. got it?"
  npc_override_alberta_alberta_hmm_looks_like_you_don_632bff: "Hmm, it looks like you don't have enough. Go get more Jellopies if you want anything else from me."
  npc_override_alberta_alberta_hmm_so_why_don_t_eeabb7: "Hmm, so why don't you bring me 10 Jellopies and I will give 1 potion. How's that sound?"
  npc_override_alberta_alberta_hmm_you_want_exchange_je_f736ad: "Hmm.. you want to exchange Jellopies for Red Potions or some Carrots eh? Well.. which one?"
  npc_override_alberta_alberta_hoping_save_any_survivor_83c640: "Hoping to save any survivors, some of the townspeople ventured into the ship. However, they all ran out terrified, saying that corpses were walking around inside the ship."
  npc_override_alberta_alberta_how_many_potions_6ca056: "How many potions"
  npc_override_alberta_alberta_how_many_you_want_9e4d82: "How many do you want?"
  npc_override_alberta_alberta_i_changed_my_mind_6d6bab: "I changed my mind."
  npc_override_alberta_alberta_i_ll_around_f5a828: "I'll be around"
  npc_override_alberta_alberta_i_lucky_i_didn_t_88a59a: "I was lucky I didn't upset it. Even the smallest animal can be dangerous if angered."
  npc_override_alberta_alberta_i_m_giving_you_more_f8c826: "I'm not giving you more than 100 at a time so don't bother, OK? If you don't want any, just say '0'."
  npc_override_alberta_alberta_i_m_guessing_s_some_1d329e: "I'm guessing it's some sort of fad or scam, where they make you collect all the cards or whatever. I mean, how can a card really hold the power of a monster?!"
  npc_override_alberta_alberta_i_once_saw_pack_wolves_2d7b24: "I once saw a pack of wolves take on one of those huge, lazy bears!"
  npc_override_alberta_alberta_i_want_many_6cc551: "I want this many."
  npc_override_alberta_alberta_i_went_see_what_when_bbbd46: "I went to see what it was and when I went to touch it. The stem actually slapped my hand!"
  npc_override_alberta_alberta_i_wonder_21ad65: "I wonder..."
  npc_override_alberta_alberta_if_any_a696a7: "If any of that"
  npc_override_alberta_alberta_if_i_buy_lot_them_6ce73b: "If I buy a lot of them in bulk, and then resell them here for a higher price..."
  npc_override_alberta_alberta_if_s_too_hard_your_63de8e: "Or if that's too hard for your pansy ass, 3 Jellopies for 1 Carrot."
  npc_override_alberta_alberta_if_you_change_72fca7: "if you change"
  npc_override_alberta_alberta_if_you_re_interested_my_28ecfd: "If you're interested in my offer, get me the stuff I mentioned."
  npc_override_alberta_alberta_izlude_marina_zeny_2a0dd2: "Izlude Marina -> 500 zeny."
  npc_override_alberta_alberta_join_494e2d: "to join the"
  npc_override_alberta_alberta_just_fun_i_threw_rock_6b0c98: "Just for fun, I threw a rock at it and all of sudden it rushed at me! I was sooooo scared, I started to run away, then BAM!!!"
  npc_override_alberta_alberta_landlubber_66b3e3: "Landlubber."
  npc_override_alberta_alberta_leave_him_alone_00545a: "Leave him alone."
  npc_override_alberta_alberta_let_s_see_80b633: "Let's see"
  npc_override_alberta_alberta_man_sword_must_had_some_5ddfa8: "Man, that sword must have had some sort of mysterious power, or the captain was just that good...!"
  npc_override_alberta_alberta_man_when_you_travel_all_fd30b7: "Man... When you travel all around the world, you'll hear of some crazy things."
  npc_override_alberta_alberta_menu_i_8381d9: "I'd think twice if you ever want to fight one when others of its kind are around. Be careful: don't get ganged up on!"
  npc_override_alberta_alberta_much_obliged_come_again_907e6e: "Much obliged, come again anytime."
  npc_override_alberta_alberta_never_heard_a0288b: "Never heard of it."
  npc_override_alberta_alberta_never_heard_everybody_kn_e22fd6: "Never heard of it?! Everybody knows th'notorious pirate ship 'Going Mary!' ^666666*Hiccup~*^000000"
  npc_override_alberta_alberta_never_mind_8721eb: "Never mind."
  npc_override_alberta_alberta_never_mind_i_like_my_edffcc: "Never mind, I like my jellopy."
  npc_override_alberta_alberta_no_problem_2160d2: "No problem,"
  npc_override_alberta_alberta_oh_6cc234: "Oh...!"
  npc_override_alberta_alberta_oh_before_you_join_i_527da8: "Oh! Before you join, I must warn you. If you're not that strong, you may not want to go."
  npc_override_alberta_alberta_once_i_heard_there_cards_fe0343: "Once, I heard that there are Cards which contain the power of monsters. If someone happens to get their hands on a card, they'll be able to use that monster's power."
  npc_override_alberta_alberta_open_roadside_stands_fe4bbd: "open roadside stands"
  npc_override_alberta_alberta_pardon_me_if_i_seem_a7475e: "Pardon me if I seem distracted. I'm milling about, trying to make a plan. You see, I hear that there is a store in Geffen that sells armor that is resistant to magic."
  npc_override_alberta_alberta_people_also_say_babies_a_427e0f: "People also say that babies are assembled by the storks before delivery, girls dig guys who act like jerks, and that Santa Claus exists! But only in Lutie."
  npc_override_alberta_alberta_people_say_legendary_wea_cccdde: "People say the legendary weapon Gungnir never misses its target. I wonder if it's possibly true..."
  npc_override_alberta_alberta_phew_sob_sob_god_i_026cff: "Phew~~ ^666666*Sob* *Sob...*^000000 God, I miss everyone! Now I'm depressed! Please, go away now."
  npc_override_alberta_alberta_please_reduce_amount_ite_cd9169: "Please reduce the amount of items,"
  npc_override_alberta_alberta_possibly_9378dc: "is possibly"
  npc_override_alberta_alberta_ran_into_low_tree_branch_cf9fa1: "It ran into a low tree branch and knocked itself out! I swear, I'll never provoke an animal for fun again!"
  npc_override_alberta_alberta_really_no_kidding_9eb37b: "Really? No kidding!"
  npc_override_alberta_alberta_red_potions_please_c6a80d: "Red Potions please."
  npc_override_alberta_alberta_right_i_m_giving_you_f60f4c: "Right I'm not giving you more than 100 at a time so don't bother, okay? If you don't want any, just say '0'."
  npc_override_alberta_alberta_s_more_than_just_yelling_5b3474: "It's more than just yelling 'You'll have to give more money please!' You need to have charisma, and master rhetoric!"
  npc_override_alberta_alberta_s_right_ddafea: "That's right!"
  npc_override_alberta_alberta_s_right_nobody_meshes_cr_f917d8: "That's right! NOBODY meshes with the crew of the 'Going Mary!' And nobody can beat out cap'n in a sword fight!"
  npc_override_alberta_alberta_say_nothing_51b0af: "Say nothing."
  npc_override_alberta_alberta_see_you_next_time_f1ab5e: "see you next time."
  npc_override_alberta_alberta_seems_you_don_t_enough_a53915: "Seems you don't have enough. Go get some more if you want anything else."
  npc_override_alberta_alberta_seems_you_don_t_money_d31bf9: "It seems you don't have the money, my friend. But please come back when you're able to pay."
  npc_override_alberta_alberta_seriously_1fb5b3: "Seriously..."
  npc_override_alberta_alberta_ship_also_packed_dangero_864b93: "The ship was also packed with dangerous marine organisms, and they couldn't get inside, even if they wanted to."
  npc_override_alberta_alberta_sign_me_up_c8aa6c: "Sign me up!"
  npc_override_alberta_alberta_sign_up_861d69: "to sign up?"
  npc_override_alberta_alberta_so_might_good_experience_fe62f9: "So it might be a good experience for a young person like yourself to be a recruit. But, it's still not worth risking your life if you're not strong enough."
  npc_override_alberta_alberta_so_want_3f2fc6: "So, want"
  npc_override_alberta_alberta_so_you_wanna_head_back_162a50: "So you wanna head back to the mainland in Alberta, eh?"
  npc_override_alberta_alberta_some_time_ago_387aac: "Some time ago,"
  npc_override_alberta_alberta_staring_get_lost_76f66b: "staring at? Get lost!!"
  npc_override_alberta_alberta_startled_me_so_i_jumped_27e9a1: "It startled me, so I jumped back a bit and then I realized it wasn't a stem, but a very small animal."
  npc_override_alberta_alberta_sunken_ship_1d0c8e: "of the Sunken Ship?"
  npc_override_alberta_alberta_sunken_ship_zeny_8fb2db: "Sunken Ship -> 250 zeny."
  npc_override_alberta_alberta_then_afterwards_we_trave_5a68ee: "Then afterwards, we can travel anywhere, and sells our goods to make a profit!"
  npc_override_alberta_alberta_then_come_see_me_again_20c06b: "then come see me again."
  npc_override_alberta_alberta_there_nothing_you_get_fr_cd4474: "There is nothing you can get for free on this ship, if you want somethin', work for it!!"
  npc_override_alberta_alberta_there_you_go_as_i_48710d: "There you go~! As I promised. Try not to stuff yer face."
  npc_override_alberta_alberta_there_you_go_as_i_e04af5: "There you go! As I promised. Don't go suckin' them all down at once."
  npc_override_alberta_alberta_too_bad_pansy_428ef7: "Not too bad pansy..."
  npc_override_alberta_alberta_true_d21373: "true..."
  npc_override_alberta_alberta_uh_no_thanks_36bb66: "Uh, no thanks."
  npc_override_alberta_alberta_wait_moment_980524: "Wait a moment!!"
  npc_override_alberta_alberta_wanna_go_63a2b5: "wanna go?"
  npc_override_alberta_alberta_way_business_more_conven_0e6155: "This way, business is more convenient and safe. Don't fall asleep, although it's too easy to do that."
  npc_override_alberta_alberta_we_couldn_t_anything_abo_7d7601: "We couldn't do anything about that ominous looking ship, and just left it as it was. Nowadays, exploration teams try to enter that ship and wipe out its monsters."
  npc_override_alberta_alberta_we_get_up_more_zeny_1a3f93: "We can get up to 24 % more zeny with this incredible skill. But remember to train hard to acquire it!!"
  npc_override_alberta_alberta_we_merchants_7b14c7: "We Merchants can"
  npc_override_alberta_alberta_we_merchants_our_own_neg_603584: "We Merchants have our own negotiating skill when we sell goods. This skill can get us more money than when other people sell goods."
  npc_override_alberta_alberta_welcome_alberta_a33ad4: "Welcome to Alberta,"
  npc_override_alberta_alberta_wh_what_you_9857cf: "Wh-what are you"
  npc_override_alberta_alberta_what_cha_got_3b6433: "what'cha got..."
  npc_override_alberta_alberta_where_d_ya_7ec179: "where'd ya"
  npc_override_alberta_alberta_wolves_much_more_coopera_9ee947: "Wolves are much more cooperative than they may seem. If one of them is attacked, then any nearby wolves will run to help."
  npc_override_alberta_alberta_yes_please_37ebb8: "Yes please."
  npc_override_alberta_alberta_you_brought_too_many_thi_df3efe: "You have brought too many things!"
  npc_override_alberta_alberta_you_cannot_accept_any_mo_82606b: "You cannot accept any more items!"
  npc_override_alberta_alberta_you_know_those_lazy_look_3ef898: "You know those lazy looking bears that live in the forest on the way to Payon?"
  npc_override_alberta_alberta_you_like_bb1111: "Would you like"
  npc_override_alberta_alberta_you_want_get_256eed: "do you want to get?"
  npc_override_alberta_alberta_young_adventurer_ac6cd8: "young adventurer!"
  npc_override_alberta_alberta_your_mind_9c9203: "your mind."
  npc_override_alberta_alberta_zeny_9724d8: "200 Zeny."
