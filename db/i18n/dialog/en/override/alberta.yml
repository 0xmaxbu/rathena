  npc_override_alberta_alberta_discount_skill_we_buy_go_6f3f18: "With the Discount skill, we can buy goods really cheap from the stores in towns and load them into the cart we rent."
  npc_override_alberta_alberta_drifted_into_2e8dc1: "drifted into"
  npc_override_alberta_alberta_exploration_team_295246: "exploration team"
  npc_override_alberta_alberta_fee_only_b2cb9d: "fee is only"
  npc_override_alberta_alberta_go_away_41df5b: "Go AWAY~"
  npc_override_alberta_alberta_good_day_5017a8: "Good day~"
  npc_override_alberta_alberta_hahahaha_hiccup_you_ve_g_a0b2cb: "Hahahaha ^666666*hiccup*^000000... You've got some nerve. I may look worthless now, but I used to be a sailor on the 'Going Mary.'"
  npc_override_alberta_alberta_hell_you_doing_here_439faa: "The hell are you doing here?"
  npc_override_alberta_alberta_hey_now_don_t_try_7026b9: "Hey now, don't try to cheat me! I said 250 zeny!"
  npc_override_alberta_alberta_hey_pansy_ass_i_said_2ba7d2: "Hey pansy ass, I said 100 at most, no more than that! I'm not going to break my back for the likes of you!"
  npc_override_alberta_alberta_hey_weren_t_you_listenin_64a5cb: "Hey! Weren't you listening? I said 10 Jellopies for 1 Red Potion.. are ya deaf?"
  npc_override_alberta_alberta_hey_what_d_i_say_b91997: "Hey, what'd I say? 100 at a time at most, you're trying to kill me aren't you!"
  npc_override_alberta_alberta_hey_you_know_one_time_a88e98: "Hey, you know, this one time I was walking through the forest and I saw this little green stem moving around."
  npc_override_alberta_alberta_hmm_bad_4ccb16: "Hmm, not bad..."
  npc_override_alberta_alberta_hmm_look_pansy_ass_i_9f0f61: "Hmm, look pansy ass, I said 3 Jellopies for 1 Carrot.. got it?"
  npc_override_alberta_alberta_hmm_looks_like_you_don_632bff: "Hmm, it looks like you don't have enough. Go get more Jellopies if you want anything else from me."
  npc_override_alberta_alberta_hmm_so_why_don_t_eeabb7: "Hmm, so why don't you bring me 10 Jellopies and I will give 1 potion. How's that sound?"
  npc_override_alberta_alberta_hmm_you_want_exchange_je_f736ad: "Hmm.. you want to exchange Jellopies for Red Potions or some Carrots eh? Well.. which one?"
  npc_override_alberta_alberta_hoping_save_any_survivor_83c640: "Hoping to save any survivors, some of the townspeople ventured into the ship. However, they all ran out terrified, saying that corpses were walking around inside the ship."
  npc_override_alberta_alberta_how_many_potions_6ca056: "How many potions"
  npc_override_alberta_alberta_how_many_you_want_9e4d82: "How many do you want?"
  npc_override_alberta_alberta_i_changed_my_mind_6d6bab: "I changed my mind."
  npc_override_alberta_alberta_i_ll_around_f5a828: "I'll be around"
  npc_override_alberta_alberta_i_lucky_i_didn_t_88a59a: "I was lucky I didn't upset it. Even the smallest animal can be dangerous if angered."
  npc_override_alberta_alberta_i_m_giving_you_more_f8c826: "I'm not giving you more than 100 at a time so don't bother, OK? If you don't want any, just say '0'."
  npc_override_alberta_alberta_i_m_guessing_s_some_1d329e: "I'm guessing it's some sort of fad or scam, where they make you collect all the cards or whatever. I mean, how can a card really hold the power of a monster?!"
  npc_override_alberta_alberta_i_once_saw_pack_wolves_2d7b24: "I once saw a pack of wolves take on one of those huge, lazy bears!"
  npc_override_alberta_alberta_i_want_many_6cc551: "I want this many."
  npc_override_alberta_alberta_i_went_see_what_when_bbbd46: "I went to see what it was and when I went to touch it. The stem actually slapped my hand!"
  npc_override_alberta_alberta_i_wonder_21ad65: "I wonder..."
  npc_override_alberta_alberta_if_any_a696a7: "If any of that"
  npc_override_alberta_alberta_if_i_buy_lot_them_6ce73b: "If I buy a lot of them in bulk, and then resell them here for a higher price..."
  npc_override_alberta_alberta_if_s_too_hard_your_63de8e: "Or if that's too hard for your pansy ass, 3 Jellopies for 1 Carrot."
  npc_override_alberta_alberta_if_you_change_72fca7: "if you change"
  npc_override_alberta_alberta_if_you_re_interested_my_28ecfd: "If you're interested in my offer, get me the stuff I mentioned."
  npc_override_alberta_alberta_izlude_marina_zeny_2a0dd2: "Izlude Marina -> 500 zeny."
  npc_override_alberta_alberta_join_494e2d: "to join the"
  npc_override_alberta_alberta_just_fun_i_threw_rock_6b0c98: "Just for fun, I threw a rock at it and all of sudden it rushed at me! I was sooooo scared, I started to run away, then BAM!!!"
  npc_override_alberta_alberta_landlubber_66b3e3: "Landlubber."
  npc_override_alberta_alberta_leave_him_alone_00545a: "Leave him alone."
  npc_override_alberta_alberta_let_s_see_80b633: "Let's see"
  npc_override_alberta_alberta_man_sword_must_had_some_5ddfa8: "Man, that sword must have had some sort of mysterious power, or the captain was just that good...!"
  npc_override_alberta_alberta_man_when_you_travel_all_fd30b7: "Man... When you travel all around the world, you'll hear of some crazy things."
  npc_override_alberta_alberta_menu_i_8381d9: "I'd think twice if you ever want to fight one when others of its kind are around. Be careful: don't get ganged up on!"
  npc_override_alberta_alberta_much_obliged_come_again_907e6e: "Much obliged, come again anytime."
  npc_override_alberta_alberta_never_heard_a0288b: "Never heard of it."
  npc_override_alberta_alberta_never_heard_everybody_kn_e22fd6: "Never heard of it?! Everybody knows th'notorious pirate ship 'Going Mary!' ^666666*Hiccup~*^000000"
  npc_override_alberta_alberta_never_mind_8721eb: "Never mind."
  npc_override_alberta_alberta_never_mind_i_like_my_edffcc: "Never mind, I like my jellopy."
  npc_override_alberta_alberta_no_problem_2160d2: "No problem,"
  npc_override_alberta_alberta_oh_6cc234: "Oh...!"
  npc_override_alberta_alberta_oh_before_you_join_i_527da8: "Oh! Before you join, I must warn you. If you're not that strong, you may not want to go."
  npc_override_alberta_alberta_once_i_heard_there_cards_fe0343: "Once, I heard that there are Cards which contain the power of monsters. If someone happens to get their hands on a card, they'll be able to use that monster's power."
  npc_override_alberta_alberta_open_roadside_stands_fe4bbd: "open roadside stands"
  npc_override_alberta_alberta_pardon_me_if_i_seem_a7475e: "Pardon me if I seem distracted. I'm milling about, trying to make a plan. You see, I hear that there is a store in Geffen that sells armor that is resistant to magic."
  npc_override_alberta_alberta_people_also_say_babies_a_427e0f: "People also say that babies are assembled by the storks before delivery, girls dig guys who act like jerks, and that Santa Claus exists! But only in Lutie."
  npc_override_alberta_alberta_people_say_legendary_wea_cccdde: "People say the legendary weapon Gungnir never misses its target. I wonder if it's possibly true..."
  npc_override_alberta_alberta_phew_sob_sob_god_i_026cff: "Phew~~ ^666666*Sob* *Sob...*^000000 God, I miss everyone! Now I'm depressed! Please, go away now."
