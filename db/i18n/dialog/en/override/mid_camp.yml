  npc_override_mid_camp_quests_13_1_accidentally_hits_drops_d4b23c: "accidentally hits and drops the"
  npc_override_mid_camp_quests_13_1_according_his_descriptio_942583: "According to his description, the monster is suspected to be a member of the long-haired Cat family. I'd like to see it with my own eyes, but..."
  npc_override_mid_camp_quests_13_1_according_report_origina_d19b6b: "According to the report, The original weather condition of Ash Vacuum is cold and dry, just like the land on the right side."
  npc_override_mid_camp_quests_13_1_actually_hansenne_one_wh_44c9b8: "... Actually... Hansenne is not the one who ruined that cake."
  npc_override_mid_camp_quests_13_1_actually_i_m_here_study_01e92a: "Actually I'm here to study this strange phenomenon."
  npc_override_mid_camp_quests_13_1_actually_we_don_t_make_7d0733: "Actually, we don't have to make this situation bigger than it already is."
  npc_override_mid_camp_quests_13_1_additional_services_plea_73291f: "For additional services, please consult Agent Gyaruk."
  npc_override_mid_camp_quests_13_1_adventurer_i_ve_be3e9a: "from this adventurer. I've"
  npc_override_mid_camp_quests_13_1_adventurer_i_ve_come_her_a8ad6c: "adventurer. I've come here"
  npc_override_mid_camp_quests_13_1_adventurers_ash_vacuum_a_ca0131: "The adventurers for Ash-vacuum! The alliance for the three kingdoms! Rune-Midgarts, Schwarzwald, Arunafeltz!"
  npc_override_mid_camp_quests_13_1_adventurers_like_you_003579: "Adventurers like you"
  npc_override_mid_camp_quests_13_1_after_all_just_cake_7519ae: "After all, it was just a cake..."
  npc_override_mid_camp_quests_13_1_after_all_ll_you_who_6b4d6c: "After all, it'll be you who'd be in trouble."
  npc_override_mid_camp_quests_13_1_after_all_they_re_reason_ce4dae: "After all, they're the reason why the three countries decided to cooperate."
  npc_override_mid_camp_quests_13_1_after_you_lose_some_weig_0f3785: "- after you lose some weight. -"
  npc_override_mid_camp_quests_13_1_again_later_meow_4878db: "again later, meow?"
  npc_override_mid_camp_quests_13_1_again_thank_you_so_much_2be9bc: "Again, thank you so much."
