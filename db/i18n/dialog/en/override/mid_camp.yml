  npc_override_mid_camp_quests_13_1_ago_come_yet_a7a9b3: "ago come yet?"
  npc_override_mid_camp_quests_13_1_ah_8b7bcd: "Ah?"
  npc_override_mid_camp_quests_13_1_ah_971301: "Ah..."
  npc_override_mid_camp_quests_13_1_ah_ah_right_e4c94f: "Ah?! Ah! Right!"
  npc_override_mid_camp_quests_13_1_ah_ahh_i_see_147edc: "...Ah.. Ahh, I see."
  npc_override_mid_camp_quests_13_1_ah_cf07cb: "Ah!"
  npc_override_mid_camp_quests_13_1_ah_did_you_lose_letter_9271ee: "Ah, did you lose the letter?"
  npc_override_mid_camp_quests_13_1_ah_f5ad63: "...Ah..."
  npc_override_mid_camp_quests_13_1_ah_he_wrote_letter_you_93e8ae: "Ah, and he wrote this letter for you."
  npc_override_mid_camp_quests_13_1_ah_hello_98e865: "Ah, hello!"
  npc_override_mid_camp_quests_13_1_ah_hello_adventurer_610aba: "Ah, hello adventurer!"
  npc_override_mid_camp_quests_13_1_ah_i_am_sorry_3552f2: "Ah, I am sorry but..."
  npc_override_mid_camp_quests_13_1_ah_i_forgot_say_thank_e5171c: "Ah, I forgot to say thank you."
  npc_override_mid_camp_quests_13_1_ah_i_got_bc2e36: "Ah, I got it!"
  npc_override_mid_camp_quests_13_1_ah_i_know_what_you_804086: "Ah, I know what you can do!"
  npc_override_mid_camp_quests_13_1_ah_i_m_so_embarrassed_18900b: "Ah. I'm so embarrassed."
  npc_override_mid_camp_quests_13_1_ah_i_mean_9de18a: "Ah... I mean..."
  npc_override_mid_camp_quests_13_1_ah_i_need_tell_you_a96247: "Ah, I need to tell you about the alliance, but first, may I ask something?"
  npc_override_mid_camp_quests_13_1_ah_i_ve_received_report_150d0f: "Ah, and... I've received a report that you fought hard against the enemy to protect the report from them."
  npc_override_mid_camp_quests_13_1_ah_i_ve_received_report_e87b68: "Ah, and... I've received a report that you tried to hand out the report to our enemy when the situation happened."
  npc_override_mid_camp_quests_13_1_ah_journal_yes_i_should_5d019a: "Ah..the journal..Yes, I should record this incident onto the journal."
  npc_override_mid_camp_quests_13_1_ah_just_forget_what_i_9d64dc: "Ah, just forget what I said. That was out of line."
  npc_override_mid_camp_quests_13_1_ah_meeting_room_everythi_17b276: "Ah..... That... in that meeting room... Is.. everything alright now?"
  npc_override_mid_camp_quests_13_1_ah_nothing_c27044: "Ah, nothing..."
  npc_override_mid_camp_quests_13_1_ah_oh_my_908b1d: "Ah, oh my."
  npc_override_mid_camp_quests_13_1_ah_place_protected_5bae07: "Ah, that place is protected"
  npc_override_mid_camp_quests_13_1_ah_s_you_adventurer_fd8382: "Ah, it's you adventurer."
  npc_override_mid_camp_quests_13_1_ah_s_you_again_so_6de91b: "Ah, it's you again. So, are you accustomed to this area now?"
  npc_override_mid_camp_quests_13_1_ah_supplies_0feb56: "Ah! Supplies."
  npc_override_mid_camp_quests_13_1_ah_there_cdc1db: "...Ah, there it is."
  npc_override_mid_camp_quests_13_1_ah_there_s_possibility_m_7c78c4: "Ah, and there's the possibility of mutation caused by the environment."
  npc_override_mid_camp_quests_13_1_ah_they_always_push_me_71e006: "Ah! They always push me,"
  npc_override_mid_camp_quests_13_1_ah_welcome_back_b8caf2: "Ah, welcome back!"
  npc_override_mid_camp_quests_13_1_ah_ya_work_tough_c567ea: "Ah, ya work is tough."
  npc_override_mid_camp_quests_13_1_ah_yeah_you_re_right_45756f: "Ah yeah... you're right."
  npc_override_mid_camp_quests_13_1_ah_you_2aba3b: "Ah!!! You have it?"
  npc_override_mid_camp_quests_13_1_ah_you_4ea2e5: "Ah, you are"
  npc_override_mid_camp_quests_13_1_ah_you_came_back_211271: "Ah, you came back."
  npc_override_mid_camp_quests_13_1_ah_you_member_alliance_d_bba45f: "Ah, you are a member of the alliance that discovered the dimensional rift? Welcome. Everything is prepared. Just enter and find the camp when you pass through the rift."
  npc_override_mid_camp_quests_13_1_ah_you_must_one_who_6bdf8e: "Ah! You must be the one who came to help us track down that Satan Morocc, the bastard who made the giant hole and then was gone like the wind."
  npc_override_mid_camp_quests_13_1_ah_you_must_talking_abou_0516bb: "Ah, you must be talking about~?"
  npc_override_mid_camp_quests_13_1_ah_you_re_back_1d15f4: "Ah! You're back!"
  npc_override_mid_camp_quests_13_1_ah_you_sure_you_want_503525: "Ah, are you sure you want to exchange?"
  npc_override_mid_camp_quests_13_1_ah_your_sweet_potatoes_n_063bd2: "Ah, your sweet potatoes are now roasted very well."
  npc_override_mid_camp_quests_13_1_aha_dfd557: "Aha!"
  npc_override_mid_camp_quests_13_1_aha_yeah_i_just_remember_d80eda: "Aha, yeah, I just remembered. You people from Schwarzwald don't ever appreciate food at all, right?"
  npc_override_mid_camp_quests_13_1_ahahaha_e3f373: "Ahahaha!"
  npc_override_mid_camp_quests_13_1_ahahahahaha_hahahahaha_27a275: "Ahahahahaha. Hahahahaha."
  npc_override_mid_camp_quests_13_1_ahem_ahem_i_see_i_5add6d: "*Ahem Ahem* I see. I've been too busy to read all the reports. So what brings you here? A reward?"
  npc_override_mid_camp_quests_13_1_ahem_ahem_thank_you_brin_b014a4: "*Ahem Ahem* Thank you for bringing me the report. I guess I was wrong about the commander. This report is actually very well done."
  npc_override_mid_camp_quests_13_1_ahh_5af867: "Ahh...."
  npc_override_mid_camp_quests_13_1_ahh_i_sensed_i_get_4b6558: "Ahh... I sensed that I would get your request."
  npc_override_mid_camp_quests_13_1_ahhh_a4d1c6: "Ahhh..."
  npc_override_mid_camp_quests_13_1_ahhh_i_m_sick_person_ef2220: "Ahhh~ I'm a sick person. I need to rest!"
  npc_override_mid_camp_quests_13_1_ahhh_my_body_542c63: "Ahhh, my body..."
  npc_override_mid_camp_quests_13_1_ahhh_one_i_left_meeting_4c2654: "Ahhh... the one I left in the meeting room..."
  npc_override_mid_camp_quests_13_1_ahhh_s_exciting_a0d2ea: "Ahhh, it's exciting~"
  npc_override_mid_camp_quests_13_1_ahhh_wait_i_didn_t_5abffd: "Ahhh, wait. I didn't finish reading it."
  npc_override_mid_camp_quests_13_1_ahhhh_2ce1ef: "Ahhhh!"
  npc_override_mid_camp_quests_13_1_ahhhhh_7e6194: "Ahhhhh..."
  npc_override_mid_camp_quests_13_1_ahhhhhh_i_guess_we_shoul_a820d9: "Ahhhhhh! I guess we should call it a day now! Thanks for comingm all of you. Ok, let's go. Dismissed!"
  npc_override_mid_camp_quests_13_1_ahhhhhkk_64a42a: "Ahhhhhkk!"
  npc_override_mid_camp_quests_13_1_alas_head_office_keeps_p_336ccc: "Alas, the head office keeps pushing me to submit a report... As if I could perform miracles!"
  npc_override_mid_camp_quests_13_1_alas_there_s_no_one_eff6b4: "Alas! There's no one I can trust!"
  npc_override_mid_camp_quests_13_1_alberto_entrance_198d46: "Alberto at the entrance"
  npc_override_mid_camp_quests_13_1_all_course_promotional_s_385e83: "All of this of course, the Promotional Staff can tell you, but they're not that reliable. So, let me explain to you. Just listen carefully."
  npc_override_mid_camp_quests_13_1_all_done_e6aa44: "All done."
  npc_override_mid_camp_quests_13_1_all_done_here_you_go_21a91b: "All done. Here you go."
  npc_override_mid_camp_quests_13_1_all_i_wanted_let_those_4f4335: "All I wanted was to let those people be closter to each other, become more friendly. But, problems come up every single time."
  npc_override_mid_camp_quests_13_1_all_we_wanted_just_shake_911d3e: "All we wanted was just to shake up the town just a little bit,"
  npc_override_mid_camp_quests_13_1_all_you_instructed_go_ti_f34144: "All of you are instructed to go to the Time-Gap of Dimension on Rune-Midgarts!"
  npc_override_mid_camp_quests_13_1_alliance_first_step_peac_29319c: "This alliance is a first step for peace among the three kingdoms. You know they are all for themselves, so this needs harmony. That's the one thing to pursue, as head of an alliance."
  npc_override_mid_camp_quests_13_1_almost_half_town_been_de_9c6ba1: "Almost half of this town has been destroyed,"
  npc_override_mid_camp_quests_13_1_almost_prepared_good_sta_e6edeb: "and almost prepared for a good start... Hm-hmm..."
  npc_override_mid_camp_quests_13_1_alone_world_far_away_428b68: "alone in this world far away"
  npc_override_mid_camp_quests_13_1_alright_alright_gosh_you_1c746b: "Alright, alright. gosh will you stop yelling at me?"
  npc_override_mid_camp_quests_13_1_alright_alright_i_know_w_2294bf: "Alright, alright. I know why you've come to see me."
  npc_override_mid_camp_quests_13_1_alright_how_about_8c0cb9: "Alright, how about this?"
  npc_override_mid_camp_quests_13_1_alright_i_m_ryosen_rune_7cd9d0: "Alright. I'm Ryosen from Rune-Midgarts. We're certain that Satan Morocc came to this place through the crack of dimension, however, we failed to find any traces within the area we inspected."
  npc_override_mid_camp_quests_13_1_alright_if_you_say_so_81def1: "Alright, if you say so."
  npc_override_mid_camp_quests_13_1_alright_then_i_ll_tell_1d26da: "...Alright then, I'll tell you."
  npc_override_mid_camp_quests_13_1_alright_then_you_rather_afb1a6: ".Alright, then. Would you rather capture reincarnations of Morocc and collect their remnants?"
  npc_override_mid_camp_quests_13_1_alright_you_come_b11b68: "Alright, you can come"
  npc_override_mid_camp_quests_13_1_alright_you_don_t_any_0b1466: "Alright, you don't have any."
  npc_override_mid_camp_quests_13_1_also_heard_rumor_d6a1b4: "also heard a rumor that the"
  npc_override_mid_camp_quests_13_1_although_seal_wasn_t_bro_80e838: "and although the seal wasn't broken, he succeeded in weakening it."
  npc_override_mid_camp_quests_13_1_always_careful_get_lost_036448: "Always be careful not to get lost."
  npc_override_mid_camp_quests_13_1_always_open_you_2a5caa: "This is always open to you."
  npc_override_mid_camp_quests_13_1_am_i_exaggerating_d13d7a: "Am I exaggerating?"
  npc_override_mid_camp_quests_13_1_am_i_right_449c27: "Am I right?"
  npc_override_mid_camp_quests_13_1_amazing_wasn_t_9a1829: "It was amazing, wasn't it?"
  npc_override_mid_camp_quests_13_1_and_10ca01: "...And..."
  npc_override_mid_camp_quests_13_1_and_bb881c: "and..."
  npc_override_mid_camp_quests_13_1_and_f0fa6b: "And..."
  npc_override_mid_camp_quests_13_1_animal_mainland_771386: "animal on the mainland,"
  npc_override_mid_camp_quests_13_1_animals_feed_95a43a: "the animals' feed or by"
  npc_override_mid_camp_quests_13_1_another_day_started_back_345776: "Another day has started, back to work!"
  npc_override_mid_camp_quests_13_1_another_personality_hidd_251a73: "but another personality hidden inside of him."
  npc_override_mid_camp_quests_13_1_answer_lies_satan_morocc_96679b: "The answer lies with Satan Morocc."
  npc_override_mid_camp_quests_13_1_any_assistance_now_0de907: "any assistance for now..."
  npc_override_mid_camp_quests_13_1_any_more_brutal_grotesqu_47827e: "any more brutal or grotesque"
  npc_override_mid_camp_quests_13_1_anymore_1e979b: "anymore."
  npc_override_mid_camp_quests_13_1_anything_64b581: "Anything?"
  npc_override_mid_camp_quests_13_1_anything_except_things_w_5c78f5: "Anything except things which are not found on Rune-Midgarts... keep them hidden. Just let us know of whatever you are holding."
  npc_override_mid_camp_quests_13_1_anyway_7479d2: "Anyway..."
  npc_override_mid_camp_quests_13_1_anyway_give_me_327a61: "Anyway, give it to me."
  npc_override_mid_camp_quests_13_1_anyway_go_marian_a4cf77: "Anyway, Go to Marian,"
  npc_override_mid_camp_quests_13_1_anyway_i_am_sure_there_45822d: "Anyway, I am sure that there are many opportunities for fame and fortune there..."
  npc_override_mid_camp_quests_13_1_anyway_i_believe_my_frie_e41551: "Anyway, I believe that my friend can assist me well."
  npc_override_mid_camp_quests_13_1_anyway_i_m_supposed_info_4af1af: "Anyway, I'm supposed to inform many adventurers about it."
  npc_override_mid_camp_quests_13_1_anyway_i_promised_tell_y_2512a0: "Anyway, I promised to tell you about the three kingdoms... This is kind of a long story, so please listen carefully."
  npc_override_mid_camp_quests_13_1_anyway_i_told_you_about_45ea60: "Anyway, I told you about Ash-Vacuum. What I know about it all. Though you still don't know much about it, that's all I can tell you."
  npc_override_mid_camp_quests_13_1_anyway_just_go_back_77be70: "Anyway, just go back to the"
  npc_override_mid_camp_quests_13_1_anyway_just_go_back_recr_527579: "Anyway, just go back to the recruiter."
  npc_override_mid_camp_quests_13_1_anyway_what_brings_you_h_bc62f7: "Anyway, what brings you here again?"
  npc_override_mid_camp_quests_13_1_anyway_what_meeting_abou_37c996: "Anyway, what is this meeting about?"
  npc_override_mid_camp_quests_13_1_anyway_who_you_place_res_1f9dfa: "Anyway, who are you? This place is restricted."
  npc_override_mid_camp_quests_13_1_anyway_you_did_first_ste_3836cc: "Anyway you did the first step."
  npc_override_mid_camp_quests_13_1_anyways_according_your_c_330a08: "Anyways, according to your conclusion, the hat must have been given to them by someone else, or they could have picked it up after another creature dropped it."
  npc_override_mid_camp_quests_13_1_anyways_as_i_said_i_2678dd: "Anyways, as I said, I've got a lot of Nepenthes specimens."
  npc_override_mid_camp_quests_13_1_anyways_ec35f1: "Anyways..."
  npc_override_mid_camp_quests_13_1_anyways_i_took_some_time_cfbe23: "Anyways, I took some time to check your background and reports of your accomplishments."
  npc_override_mid_camp_quests_13_1_anyways_i_wonder_if_you_01f4b3: "Anyways.. I wonder if you have seen a ^0000ffPeaked Hat^000000. I heard the monster, 'Tatacho' has that hat."
  npc_override_mid_camp_quests_13_1_anyways_one_soldiers_cap_4873f1: "...Anyways, one of the soldiers that captured Nepentheses for me has given me some interesting information."
  npc_override_mid_camp_quests_13_1_anyways_please_bring_pag_60a1c7: "Anyways, please bring the pages of the report in ^0000FFincrements of 10^000000 whenever you find them. I'll try to put them in order."
  npc_override_mid_camp_quests_13_1_anyways_please_deliver_j_491ce0: "Anyways, please deliver the journal to her safely."
  npc_override_mid_camp_quests_13_1_anyways_s_alright_you_do_30f249: "Anyways... It's alright. You don't have to feel bad. I understand you didn't mean it this way."
  npc_override_mid_camp_quests_13_1_apparently_extremely_int_df3b52: "Apparently, an extremely intelligent creature inhabits Ash Vaccum."
  npc_override_mid_camp_quests_13_1_appears_been_crushed_dea_f1781c: "that appears to have been crushed to death."
  npc_override_mid_camp_quests_13_1_appears_tree_first_glanc_83d496: "It appears to be a tree at first glance, but it turns out to be a giant that is half tree and half man."
  npc_override_mid_camp_quests_13_1_approaches_me_39e25a: "approaches me"
  npc_override_mid_camp_quests_13_1_area_92cf92: "in this area."
  npc_override_mid_camp_quests_13_1_aren_t_allowed_leave_bc38ed: "aren't allowed to leave,"
  npc_override_mid_camp_quests_13_1_aren_t_different_e03445: "aren't that different from the"
  npc_override_mid_camp_quests_13_1_aren_t_they_quite_savage_784abb: "Aren't they quite savage-"
  npc_override_mid_camp_quests_13_1_aren_t_you_feeling_bad_1e3606: "Aren't you feeling bad? It's unfair!"
  npc_override_mid_camp_quests_13_1_aren_t_you_leaving_i_2c9190: "...Aren't you leaving? I think you should."
  npc_override_mid_camp_quests_13_1_argh_0fba86: "Argh...!"
  npc_override_mid_camp_quests_13_1_argh_43ffb4: "Argh!"
  npc_override_mid_camp_quests_13_1_argh_658e94: "Argh..."
  npc_override_mid_camp_quests_13_1_argh_i_m_still_recoverin_e3b150: "..Argh.. I'm still recovering .. I'm not supposed to move~"
  npc_override_mid_camp_quests_13_1_argh_i_t_move_all_fc2936: "Argh.. I can't move at all..."
  npc_override_mid_camp_quests_13_1_argh_my_head_hurts_cd4e6c: "Argh.. My head hurts..."
  npc_override_mid_camp_quests_13_1_argh_s_too_dark_see_7cee2f: "Argh! It's too dark to see...!"
  npc_override_mid_camp_quests_13_1_argh_why_you_doing_bada6a: "Argh... Why are you doing this?!"
  npc_override_mid_camp_quests_13_1_argh_you_96243f: "Argh... You..."
  npc_override_mid_camp_quests_13_1_argh_you_alright_report_5cdef9: "Argh... {0}, are you alright? The report... The report..."
  npc_override_mid_camp_quests_13_1_around_as_my_pets_8f9048: "around as my pets."
  npc_override_mid_camp_quests_13_1_around_here_a06d12: "from around here."
  npc_override_mid_camp_quests_13_1_around_here_ee109d: "around here?"
  npc_override_mid_camp_quests_13_1_around_here_watching_me_c9f5d3: "around here is watching me."
  npc_override_mid_camp_quests_13_1_around_morocc_95b829: "around Morocc and"
  npc_override_mid_camp_quests_13_1_arrow_pointing_southwest_77e196: "but it is an arrow pointing southwest."
