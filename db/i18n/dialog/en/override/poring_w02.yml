  npc_override_poring_w02_poring_war_menu_equip_f9f52a: "Equip War Badge.:Cancel."
  npc_override_poring_w02_poring_war_menu_marvelous_5a0c6b: "Marvelous Medal - 4 P.Co:Union of Tribe - 20 P.Co:Poring Box - 30 P.Co:Next"
  npc_override_poring_w02_poring_war_menu_mr_020313: "Mr. Doppel: Each member of the team must join the group, and the leader will register their team name."
  npc_override_poring_w02_poring_war_menu_mr_067ff8: "Mr. Doppel: Allow me to offer a souvenir to the humans that fought bravely for the Porings! Please, speak to Devi."
  npc_override_poring_w02_poring_war_menu_mr_20f39d: "Mr. Doppel: You have 50 seconds. Join the group, register it's name and go to the battlefield."
  npc_override_poring_w02_poring_war_menu_mr_216d41: "Mr. Doppel: Deviling Team of party {0} won the battle!"
  npc_override_poring_w02_poring_war_menu_mr_2e1d3b: "Mr. Doppel: Welcome to all the warriors that have come to fight the battle."
  npc_override_poring_w02_poring_war_menu_mr_35faa4: "Mr. Doppel: The Deviling on the 1st base has been revived! 1 point gained!!"
  npc_override_poring_w02_poring_war_menu_mr_423793: "Mr. Doppel: The Angeling on the 2nd base has been revived! 1 point gained!!"
  npc_override_poring_w02_poring_war_menu_mr_4ef683: "Mr. Doppel: Time is up. The rules will be explained shortly before the battle."
  npc_override_poring_w02_poring_war_menu_mr_57330e: "Mr. Doppel: The Angeling on the 1st base has been killed! 1 point lost!!"
  npc_override_poring_w02_poring_war_menu_mr_5eaa73: "Mr. Doppel: The deviling on the 2nd base has been killed! 1 point lost!!"
  npc_override_poring_w02_poring_war_menu_mr_7a87a5: "Mr. Doppel: The Angeling Team has to protect 2 Angelings on their bases and, at the same time, eliminate the Devilings on their Deviling Team bases, and vice-versa."
  npc_override_poring_w02_poring_war_menu_mr_811a22: "Mr. Doppel: Also know that those Porings are furious and will attack everybody, it doesnt matter to what team they belong."
  npc_override_poring_w02_poring_war_menu_mr_8b0efd: "Mr. Doppel: You still have 30 seconds. Join the group, register it's name and go to the battlefield."
  npc_override_poring_w02_poring_war_menu_mr_9c00c8: "Mr. Doppel: Basically, the Porings are natural enemies of the humans, so the attack is innevitable, even if both are on the same team."
  npc_override_poring_w02_poring_war_menu_mr_a6c8fe: "Mr. Doppel: Your team wins if you eliminate the 2 monsters of the enemy team. The rules are as simple as that."
  npc_override_poring_w02_poring_war_menu_mr_b25ea0: "Mr. Doppel: All ready? Let me explain the battle rules."
  npc_override_poring_w02_poring_war_menu_mr_c6e6eb: "Mr. Doppel: Time is up! Let me teleport you."
  npc_override_poring_w02_poring_war_menu_mr_db6cf8: "Mr. Doppel: In certain areas, you will need War Badges that are obtained by eliminating members of the other team. Alright, lets begin!"
  npc_override_poring_w02_poring_war_menu_mr_db900c: "Mr. Doppel: The Angeling on the 2nd base has been killed! 1 point lost!!"
  npc_override_poring_w02_poring_war_menu_mr_e1fa80: "Mr. Doppel: The deviling on the 2nd base has been revived! 1 point gained!!"
  npc_override_poring_w02_poring_war_menu_mr_e6dabf: "Mr. Doppel: The Angeling on the 1st base has been revived! 1 point gained!!"
  npc_override_poring_w02_poring_war_menu_mr_e7bf5d: "Mr. Doppel: Angeling Team of party {0} won the battle!"
  npc_override_poring_w02_poring_war_menu_mr_eee89f: "Mr. Doppel: But the Angelings or the Devilings return to life after a certain period of time, so it's important to eliminate the other Poring quickly, after you have eliminated the first."
  npc_override_poring_w02_poring_war_menu_mr_ef3a0f: "Mr. Doppel: Time is up. Soon, you will be teleported to the Winners Stage."
  npc_override_poring_w02_poring_war_menu_mr_f1b090: "Mr. Doppel: The Deviling on the 1st base has been killed! 1 point lost!!"
  npc_override_poring_w02_poring_war_menu_no_5d9ac0: "No! Wait!:Go to the staging area."
  npc_override_poring_w02_poring_war_menu_no_7678a8: "No! You're wrong.:Yes. I would like to register that name.:Cancel"
