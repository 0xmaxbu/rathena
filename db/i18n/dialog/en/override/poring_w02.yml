  npc_override_poring_w02_poring_war_maybe_next_time_c71159: "... Maybe next time..."
  npc_override_poring_w02_poring_war_menu_alright_530904: "Alright, I'm with you!:What's that?:Ignore"
  npc_override_poring_w02_poring_war_menu_am_2f8aaa: "Am I qualified to join?:How do I join the war?:Cancel:Let me out of here, please!"
  npc_override_poring_w02_poring_war_menu_angeling_9e0380: "Angeling: We got no time to wait, stupid Deviling! The battle has been cancelled, ring!"
  npc_override_poring_w02_poring_war_menu_deviling_0ed886: "Deviling: You can't leave us waiting for ever!! We're going to cancel the battle, ring!"
