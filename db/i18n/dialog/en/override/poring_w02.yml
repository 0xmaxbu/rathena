  npc_override_poring_w02_poring_war_also_means_battle_needs_5b543a: "This also means that the battle needs the total of 10 members."
  npc_override_poring_w02_poring_war_also_s_totally_up_you_afc3bd: "Also, it's totally up to you which team you want to fight for~"
  npc_override_poring_w02_poring_war_amazing_ee5d85: "Amazing!"
  npc_override_poring_w02_poring_war_angeling_team_recruitmen_2fdbe5: "Angeling Team Recruitment is complete. The battle will be canceled automatically if the Deviling Team Recruitment isn't ready in 1 minute."
  npc_override_poring_w02_poring_war_angeling_team_recruitmen_6f28e8: "Angeling Team Recruitment failed. The battle will be canceled shortly."
  npc_override_poring_w02_poring_war_anyway_human_you_want_jo_bda5fe: "Anyway, human. Do you want to join our Poring War?"
  npc_override_poring_w02_poring_war_battle_been_canceled_sin_ef0a18: "The battle has been canceled since not all teams are full!!"
  npc_override_poring_w02_poring_war_battle_cancelled_if_memb_1050f8: "The battle will be cancelled if the members aren't recruited in one minute!!"
  npc_override_poring_w02_poring_war_battle_proud_porings_rin_3a3c55: "This battle is the proud of the porings! Ring! Join the Angeling Team!!"
  npc_override_poring_w02_poring_war_booooo_boo_boooo_e9cee2: "Booooo~ Boo~ Boooo~"
  npc_override_poring_w02_poring_war_cancel_ebda43: "Cancel."
  npc_override_poring_w02_poring_war_carefull_allow_enemy_tak_986008: "Be carefull to not allow the enemy to take and equip your War Badge here."
  npc_override_poring_w02_poring_war_click_item_came_out_mout_846d5e: "Click~ The item came out of the mouth of the Poring with a rumbling sound."
  npc_override_poring_w02_poring_war_clock_ticking_make_up_yo_f1b345: "The clock is ticking. Make up your mind and register as soon as you can."
  npc_override_poring_w02_poring_war_come_join_us_5166c0: "Come! Join us!"
  npc_override_poring_w02_poring_war_currently_you_re_carryin_73594b: "- Currently you're carrying -"
  npc_override_poring_w02_poring_war_d_e_v_i_l_8a5e29: "D,E,V,I,L,I,N,G! Deviling Team! Come and Join us!!"
  npc_override_poring_w02_poring_war_d_e_v_i_l_910da7: "D,E,V,I,L,I,N,G! Deviling Team! Come and join us!"
  npc_override_poring_w02_poring_war_deviling_team_recruitmen_5c287c: "Deviling Team Recruitment is complete. The battle will be canceled automatically if the Angeling Team Recruitment isn't ready in 1 minute."
  npc_override_poring_w02_poring_war_deviling_team_recruitmen_920353: "Deviling Team Recruitment failed. The battle will be canceled shortly."
  npc_override_poring_w02_poring_war_dex_extra_effct_atk_when_c6aeef: " DEX + 1, extra effct of ATK + 10 when equipped by Archer classes."
  npc_override_poring_w02_poring_war_diffeent_kinds_figures_s_e61db6: "1 of 7 diffeent kinds of figures will be selected."
  npc_override_poring_w02_poring_war_don_t_forget_let_all_3c5de3: "Don't forget to let all the members join the party. Only the members of a registered party can join the battle."
  npc_override_poring_w02_poring_war_each_team_composed_peopl_6c46a0: "Each team is composed of 5 people. As soon as 5 members are collected, the battle starts."
  npc_override_poring_w02_poring_war_each_team_should_try_kil_a4c0c3: "Each team should try killing both Porings in the other team's base. After killing one Poring, you have a limited time to kill the other Poring. Otherwise, the one you killed will come back alive."
  npc_override_poring_w02_poring_war_enough_coins_5715fa: "Not enough coins."
  npc_override_poring_w02_poring_war_even_so_thanks_coming_fi_40d8a0: "Even so, thanks for coming to fight for us. Please, accept this Poring Coin."
  npc_override_poring_w02_poring_war_figures_except_novice_al_f46c92: "Figures except for Novice are all ^4d4dffCharacter bound items^000000."
  npc_override_poring_w02_poring_war_figures_st_job_class_cha_302006: "Figures of 1st Job Class Characters including Novice are finally on sale!"
  npc_override_poring_w02_poring_war_finally_s_time_us_teach_b918ee: "Finally, it's time for us to teach those stupid pigs a lesson!!"
  npc_override_poring_w02_poring_war_first_lets_register_your_3159ee: "First, lets register your party name, after, we'll check the members."
  npc_override_poring_w02_poring_war_first_make_sure_all_memb_dde891: "First, make sure all the members are in your party."
  npc_override_poring_w02_poring_war_gate_activated_36d6ec: "Gate Activated."
  npc_override_poring_w02_poring_war_get_out_now_leave_34cf23: "Get out now! Leave!!"
  npc_override_poring_w02_poring_war_good_time_ring_79d0f1: "Have a good time, ring."
  npc_override_poring_w02_poring_war_good_work_085bd7: "Good work!"
  npc_override_poring_w02_poring_war_goodbye_my_human_friend_098f3c: "Goodbye, my human friend."
  npc_override_poring_w02_poring_war_gotta_hide_hide_right_0847b2: "Gotta hide, hide, right~!"
  npc_override_poring_w02_poring_war_greatest_battle_all_time_c6d128: "The greatest battle of all time, the recruitment for the Deviling Team is over, ring!"
  npc_override_poring_w02_poring_war_haven_t_you_finished_par_56cb92: "Haven't you finished the party registration yet?"
  npc_override_poring_w02_poring_war_hehehee_i_feel_kinda_shy_98afe4: "Hehehee, I feel kinda shy now."
  npc_override_poring_w02_poring_war_hey_hey_there_hu_humans_258358: "Hey.. Hey, there. Hu.. Humans..."
  npc_override_poring_w02_poring_war_hey_human_don_t_you_bf2e8f: "Hey, human. Don't you wanna fight for Deviling, the noble of darkness? What do you say?!"
  npc_override_poring_w02_poring_war_hey_human_how_about_figh_d9d3bf: "Hey, human. How about fighting for us Porings on Angeling's side??!"
  npc_override_poring_w02_poring_war_hey_i_don_t_all_fb9934: "Hey, I don't have all day! Make your mind and register as fast as you can."
  npc_override_poring_w02_poring_war_hey_s_life_ring_we_6e1066: "Hey, that's life, ring. We need zeny too you know~!"
  npc_override_poring_w02_poring_war_hmm_i_see_6d9115: "hmm, I see."
  npc_override_poring_w02_poring_war_how_come_so_many_humans_940b86: "How come so many humans want to join our Poring War these days?"
  npc_override_poring_w02_poring_war_hp_extra_effect_hp_when_5d7637: " HP + 70, extra effect of HP + 30 when equipped by a Novices."
  npc_override_poring_w02_poring_war_huhhhh_hu_humans_so_cold_f8570b: "Huhhhh! Hu.. Humans are so cold and cruel!!!"
  npc_override_poring_w02_poring_war_hwak_9f2dc8: "Hwak!!"
  npc_override_poring_w02_poring_war_i_allow_you_return_your_a32603: "I will allow you to return to your human world."
  npc_override_poring_w02_poring_war_i_cant_give_you_anything_910e5c: "I cant give you anything, since we lost and everything..."
  npc_override_poring_w02_poring_war_i_i_ve_got_some_37b718: "I.. I've got some interesting work for ya.. Would you be interested?"
  npc_override_poring_w02_poring_war_i_ll_check_again_after_49f443: "I'll check again and, after the registeration of the party name, you'll be sent to the battlefield."
  npc_override_poring_w02_poring_war_i_ll_send_you_back_e5700f: "I'll send you back to your savepoint."
  npc_override_poring_w02_poring_war_i_ll_send_you_battlefiel_24c59d: "I'll send you to the battlefield as soon as I confirm your party."
  npc_override_poring_w02_poring_war_i_ll_transfer_you_battle_bde5cf: "I'll transfer you to the battle staging area."
  npc_override_poring_w02_poring_war_i_never_forgive_you_b78ad7: "I will never forgive you!"
  npc_override_poring_w02_poring_war_i_see_empty_slots_equip_7201f0: "I can see the empty slots to equip the Badges."
  npc_override_poring_w02_poring_war_i_ts_shame_battle_tied_43719b: "I' ts a shame the battle was tied..."
  npc_override_poring_w02_poring_war_if_you_aren_t_registered_a0573e: "If you aren't a registered member of the party, you can't join the battle."
  npc_override_poring_w02_poring_war_if_you_don_t_get_c776ec: "If you don't get there in time, you won't make it to the battle."
  npc_override_poring_w02_poring_war_if_you_re_member_angelin_2d0dd5: "If you're a member of the Angeling Team, your goal is to kill the Devilings at the other team's base and vice versa."
  npc_override_poring_w02_poring_war_if_you_really_want_fight_443f2e: "If you really want to fight in the war or whatever.. the Team recruiter's right there."
  npc_override_poring_w02_poring_war_im_sorry_rules_rules_i_ecf89b: "Im sorry, but rules are rules. I can't help you if your party ain't registered."
  npc_override_poring_w02_poring_war_insert_poring_coin_pull_118e56: "Insert the Poring coin and pull the lever."
  npc_override_poring_w02_poring_war_int_extra_effct_sp_when_76364b: " INT + 1, extra effct of SP + 50 when equipped by Acolyte classes."
  npc_override_poring_w02_poring_war_int_extra_sp_recovery_in_77ab81: " INT + 1, an extra SP Recovery increase by 5% when equipped by Mage classes."
  npc_override_poring_w02_poring_war_item_name_poring_coin_p_83ed1a: "Item name - Poring Coin(P.Co)"
  npc_override_poring_w02_poring_war_item_name_price_poring_c_0cd67f: "Item name - Price Poring Coin(P.Co)"
  npc_override_poring_w02_poring_war_join_proud_angeling_team_3339dc: "Join the proud Angeling Team with angel wings!!"
  npc_override_poring_w02_poring_war_let_s_go_let_s_00abc0: "Let's go! Let's fight! Let's win, win, win!!!"
  npc_override_poring_w02_poring_war_let_s_go_let_s_5d90c6: "Let's go! Let's fight! Fight for Triumph!!!!"
  npc_override_poring_w02_poring_war_let_s_teach_them_lesson_419d91: "Let's teach them a lesson, ring!"
  npc_override_poring_w02_poring_war_lets_see_name_party_fb52e2: "Lets see... The name of the party is..."
