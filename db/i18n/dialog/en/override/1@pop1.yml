Body:
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_according_recent_investi_e724d7: "According to a recent investigation report, it was due to the influence of Kthullanax that it was given a weak magical power."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_143715: "Adventurer ..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_59e18c: "Adventurer? But ..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_come_us_3de680: "Adventurer, come with us."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_hostle_target_611c3f: "The adventurer is a hostle target. Eliminate him with prejudice!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_please_follow_160d9e: "Adventurer, please follow me ..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_please_help_m_922b42: "Adventurer, please....help me."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_what_pope_s_d_31732d: "Adventurer, what was the Pope's dream state like?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_you_came_than_da9b03: "Adventurer, you came. Thank you so much for taking the time while you are busy."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_adventurer_you_mind_if_i_0ca762: "Adventurer, do you mind if I were to ask for another favour?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_after_all_i_think_you_d77eab: "After all, I think you are trustworthy, so I will trust you and tell you."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_after_waking_up_she_sad_5b6704: "After waking up, she has a sad expression, often immersed in other thoughts, and shows a loss of concentration. And she just goes back to sleep."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_after_you_appeared_we_ha_825b57: "After you appeared, we had high priests and guards coming for us.... We even got separated from our parents!!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_agreed_s_easier_way_54f8d6: "Agreed, it's easier that way~"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_ah_9f5525: "Ah ..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_all_you_restrain_pope_4fcd43: "All of you, restrain the Pope!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_all_you_shut_up_b13166: "All of you! Shut up!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_also_blasphemy_freyja_ho_1a640a: "It is also a blasphemy of Freyja to not honour one's time. Please act with discretion."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_am_i_just_vessel_goddess_7ba600: "Am I just a vessel of the Goddess?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_annoying_adventurer_soon_72399d: "The annoying adventurer will soon be gone!!!!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_anyone_who_disagrees_dea_973cf7: "Anyone who disagrees will be dealt with by force."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_arghh_think_just_mere_mo_b0e53f: "Arghh...... To think that this was just a mere mortal...! What a disgrace...!!!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_as_adventurer_speculates_ed73e8: "As the adventurer speculates, a small problem recently occurred with the Pope."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_as_current_pope_s_sleep_96ede2: "As the current Pope's sleep time is getting slower, it is speculated that someone is trying to hold onto her or that the Pope does not want to wake herself up."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_as_situation_continues_l_eaf9f7: "As the situation continues like this, words of mouth are starting to spread out little by little even inside the temple."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_as_today_s_time_you_c109aa: "As for today, it's time for you to relax comfortably."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_aye_aye_sir_c30e2a: "Aye Aye Sir !!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_before_coming_here_i_tol_92affc: "Before coming here, I was told by Niren."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_begone_5d7ece: "Begone!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_behold_birth_our_new_pop_0c232f: "Behold, the birth of our new Pope!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_both_you_become_popes_37d4a9: "Both of you can become Popes!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_boy_same_citeria_knows_n_b4588b: "A boy with the same citeria but knows nothing is useless..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_boy_white_hair_pale_comp_21b221: "A boy with white hair and a pale complexion appeared."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_190ca1: "Brother ..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_74cea9: "Brother."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_a8afa6: "Brother...?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_b14266: "Brother?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_don_t_say_advent_f8ca17: "Brother, don't say that. The Adventurer has been a trustful companion."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_f7a05c: "Brother..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_frozen_ice_cave_cc7e27: "Brother...was frozen in the Ice Cave."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_look_looks_delic_9c3294: "Brother! Look at that! It looks delicious."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_brother_place_1ad7d8: "Brother, this is the place...?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_but_2e7fce: "But..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_but_6f5c5d: "But ..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_but_bda5a6: "But?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_bye_749de5: "Bye!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_bye_c74845: "Bye ~"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_cannot_confirmed_possibl_95ce9c: "It cannot be confirmed, but it is possible."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_certainly_pope_please_st_0f2924: "Certainly, Pope. Please stand behind me."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_certainly_shall_we_raise_6ec5f5: "Certainly! Shall we raise him together as our pet?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_changing_clothes_14425a: "Changing clothes ...?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_citizens_arunafeltz_find_99503e: "Citizens of Arunafeltz find comfort, inspiration and hope in the Pope."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_come_closer_me_5bba0b: "Come closer to me...!!!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_come_let_us_go_together_45b76b: "Come on, let us go together."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_come_we_get_out_here_ae72ee: "Come on, we have to get out of here."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_come_we_need_get_out_04286c: "Come on, we need to get out of here."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_could_i_raise_4b6f03: "Could I raise it?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_could_you_accompany_pope_d5a8ae: "Could you accompany the Pope in her dream again? She...needs company."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_crack_time_safe_enough_p_020024: "The crack in time is not safe enough to pass back and forth. Please come back again when the after effect timer has passed."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_cute_17d8e8: "Cute!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_cute_puppy_2aae67: "Cute puppy."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_d_amn_what_s_noise_0b7726: "D-amn, what's this noise here. What's going on..?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dangerous_you_sure_about_8c7417: "This is dangerous. Are you sure about leaving...?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_did_you_just_heard_f10caf: "Did you just heard?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_doesn_t_matter_now_we_e77d6e: "It doesn't matter now. We will always be together from now on."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_bother_me_72e327: "Don't bother with me."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_go_don_t_b5b7d5: "Don't go! Don't leave me just like that..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_listen_don_t_b7a77a: "Don't listen to that. Don't even think about that!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_luwmin_frozen_move_d7daa7: "Don't do that. Luwmin is frozen and can not move."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_stand_still_pope_172220: "Don't stand still Pope, and make a stand!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_worry_i_m_11c798: "Don't worry. I'm fine."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_worry_s_as_e6cb9d: "Don't worry, it's not as if I will be sleeping forever."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_you_dare_interfere_2bdaa9: "Don't you dare interfere!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_don_t_you_understand_whe_197a86: "Don't you understand where we are...?!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_9ad308: "Dream ...?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_ad96ef: "This is a dream!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_b1b32d: "This is a dream ...?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_ff293a: "Dream...?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_having_my_brother_4c32c5: "...and a dream of having my brother by my side..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_dream_realm_created_luwm_f2d260: "This was a dream realm created by Luwmin, shared by the Pope. The fate of twins simultaneously made this dream possible."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_duty_us_priests_ensure_s_1fce69: "It is the duty of us priests to ensure the safety of the Pope."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_even_so_make_me_very_eaa723: "Even so, that would...make me very happy."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_exit_appeared_east_direc_212643: "An exit has appeared in the east direction."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_face_eyes_you_luwmin_4e2a5d: "This face...and eyes. Are you Luwmin?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fair_skin_white_hair_eye_b8cf52: "Fair skin, white hair, eyes of different colours. There is no doubt."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_first_all_forgive_me_giv_539cd0: "First of all, forgive me for giving you the request."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_first_she_started_go_bed_071f25: "At first, she started to go to bed early in the evening, then she started to get up much later in the morning, and now she goes to bed more often."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_forever_2d77c3: "Forever."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_forever_nobody_find_a8beee: "Forever ... Nobody will find ..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fortunate_60da11: "That is fortunate."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fountain_same_as_i_imagi_06270c: "This fountain is the same as I imagined. That tree too. And... that doll!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_freyja_s_reincarnated_su_0e371f: "It is Freyja's will, to be reincarnated in such a vessel."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fun_i_never_want_forget_868400: "It was fun, I would never want to forget it. I was so happy. Still, it was a happy dream and it can also be terrible nightmare."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fun_meeting_you_guys_aft_e21c3b: "It was fun meeting you guys after all this while."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_fuzzy_d04fe3: "Fuzzy ..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_girl_undoubtly_true_pope_3adc4b: "This girl is undoubtly the true Pope."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_go_back_288584: "Go back."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_go_back_where_you_belong_11abfb: "Go back to where you belong!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_go_back_where_you_belong_6bcb08: "Go back to where you belong."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_going_together_ec932b: "Going together."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_good_bye_160c87: "Good bye !!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_good_idea_30e5e3: "Good idea!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_got_promise_e103ac: "........ got promise..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_guards_gone_we_need_hurr_55210b: "The guards are gone. We need to hurry!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_guards_sieze_boy_c70b07: "Guards, sieze that boy!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_h_how_did_you_get_38472e: "H-How... did you get out?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_halt_4d1bb4: "Halt!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_halt_afc326: "Halt!!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_halt_cdcf60: "Halt !!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_halt_who_goes_there_0d2f46: "Halt! Who goes there?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_he_looks_same_as_pope_0a9a4f: "He looks the same as Pope."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_he_s_frozen_9aece1: "He's frozen?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_he_white_hair_aafff8: "He has white hair..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_head_south_a9466f: "Head south..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hehe_let_s_go_23761a: "Hehe. Let's go~."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hello_i_am_pathway_dream_85e5d6: "Hello, I am a pathway to dreams. How can I help you?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hence_i_looked_into_cons_928519: "Hence I looked into the consciousness of Luwmin."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_here_f17d0b: "Here."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_here_owner_ice_cave_c586da: "This here is the owner of the Ice Cave."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hey_how_about_we_go_2b32f8: "Hey, how about we go the Ra's place next?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hide_seek_605cda: "Or hide-and-seek?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_high_priest_your_enemes_9e31c2: "High Priest, your enemes have sent children assassins to harm you!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_historical_moment_639393: "This is a historical moment!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_hmmm_indeed_my_fortune_w_394340: "Hmmm, this is indeed my fortune to witness such an event!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_home_our_new_pope_52095a: "This is the home of our new Pope."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_house_where_new_pope_661461: "This is the house where the new Pope is from....?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_house_where_new_pope_a8d428: "This is the house where the new Pope....?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_about_we_head_home_1d5862: "How about we head home first?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_about_we_just_play_12f843: "How about we just play hide-and-seek tommorow?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_dare_you_5c3286: "How dare you...!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_dare_you_interfere_e80bec: "How dare you interfere with this...!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_did_help_you_c20a00: "How did it help you?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_upsetting_must_havin_a80b83: "How upsetting it must be having their leader in slumber... deep slumber."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_you_get_into_someone_99994b: "But how do you get into someone else's dream?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_you_know_my_name_f14544: "How do you know my...name? Is this Freyja's will?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_how_your_dream_24bd12: "How was your dream?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_however_82ccaf: "However..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_however_as_dream_i_know_8a2dc5: "However, as it is a dream, I do not know what there might be. No one knows what the Pope will show or how she will react."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_however_even_if_situatio_cdef42: "However, even if this is the situation and the adventurer sees me as a reliable person, listen to what I have to say from now on, and whether you accept the request or not, you must keep today's dialogue absolutely confidential."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_however_method_rather_un_5d96c5: "However, that method is rather unlikely due to the high probability of getting caught."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_however_true_current_pop_50bb2b: "However, it is true that the current Pope lacks qualities."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_huh_i_ll_waiting_you_d83615: "Huh? I'll be waiting for you there."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_humans_carrying_fire_odi_2432a0: "Humans carrying the fire of Odin threatening me to keep this child frozen here..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_accompany_her_a0fff8: "I will accompany her."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_always_wanted_my_broth_49ee9f: "I always wanted to be with my brother."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_adventurer_03f0b4: "I am the adventurer, {0}."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_charge_741049: "I am in charge."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_escorting_pope_c85235: "I am escorting the Pope."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_incomplete_ed346b: "I am incomplete."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_late_ecd132: "I am late."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_needed_ae3fee: ".......... I am not needed....?"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_pope_arunafeltz_10042a: "I am the Pope of Arunafeltz."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_still_capable_some_40694a: "I am still capable of some compassion to humans."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_very_pleased_such_1fb6ce: "I am very pleased to have such a child!"
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_am_you_a4b2f0: "I am you."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_appointment_i_meet_com_823393: "I have an appointment. I have to meet. Come on, we have to get out of here."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_appointment_i_meet_f6e5a1: "I have an appointment. I have to meet."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_asked_meet_you_like_c5eaa1: "I asked to meet you like this because I have something to ask of the adventurer."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_came_find_child_who_a40cfc: "I came to find a child who meets the criteria for a new Pope."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_cannot_hide_a7d4a9: "I cannot hide."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_could_see_what_transpi_b504c9: "I could see what transpired back then..."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_couldn_t_sneak_out_892781: "I couldn't sneak out."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_decided_help_luwmin_wa_d7d2cd: "I decided to help Luwmin. It was a way to help him."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_didn_t_any_qualificati_d26e74: "I didn't have any qualifications from the beginning."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_don_t_really_know_953fa7: "I don't really know."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_don_t_think_right_fa7b44: "...I don't think that this is right."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_don_t_wanna_go_c8e85b: "I don't wanna go back. This is where I belong."
  npc_override_1@pop1_EddaHalfMoonInTheDaylight_i_don_t_want_go_6dba23: "I don't want to go. I hate it. Please! Mom...? Dad...? Adventurer...? Save me...!!"
