Body:
  npc_override_socket_enchant_socket_enchant_adding_slots_may_seem_si_fd2907: "Adding Slots may seem simple, but it's far more complicated than it looks."
  npc_override_socket_enchant_socket_enchant_after_you_lose_some_weig_0f3785: "- after you lose some weight. -"
  npc_override_socket_enchant_socket_enchant_again_only_carry_one_equ_18d0ee: "Again, ^FF0000only carry one of the equipment to which you want me to add a Slot^000000."
  npc_override_socket_enchant_socket_enchant_ah_don_t_forget_bring_aef22f: "Ah, and don't forget to bring that "
  npc_override_socket_enchant_socket_enchant_all_other_equipment_same_7624cb: "All other equipment with the same name should be placed in your Kafra Storage, got it?"
  npc_override_socket_enchant_socket_enchant_alright_average_equipmen_2432f7: "Alright, this is the average equipment category."
  npc_override_socket_enchant_socket_enchant_alright_i_understand_2b4ff9: "Alright, I can understand."
  npc_override_socket_enchant_socket_enchant_alright_let_me_know_armo_98db25: "Alright... Let me know the Armor to which you'd like to add a Slot, and I'll tell what I need to try it."
  npc_override_socket_enchant_socket_enchant_alright_please_bring_me_ba5504: "Alright, please bring me "
  npc_override_socket_enchant_socket_enchant_alright_then_let_work_be_fac966: "Alright then, let the work begin!"
  npc_override_socket_enchant_socket_enchant_alright_which_armor_you_c93f1c: "Alright, which armor would you like me to try adding a Slot?"
  npc_override_socket_enchant_socket_enchant_alright_which_weapon_you_50a4bb: "Alright, which weapon would you like me to try adding a Slot?"
  npc_override_socket_enchant_socket_enchant_armor_divided_into_diffe_c14419: "Armor is divided into 4 different classes, depending on the work difficulty."
  npc_override_socket_enchant_socket_enchant_armor_you_said_1fdee0: "Armor, you said?"
  npc_override_socket_enchant_socket_enchant_b_class_57bcaf: "B Class?"
  npc_override_socket_enchant_socket_enchant_before_i_must_warn_you_216264: "But before that, I must warn you of the risk."
  npc_override_socket_enchant_socket_enchant_c_class_armor_eh_2ea49d: "C Class Armor, eh?"
  npc_override_socket_enchant_socket_enchant_c_class_easiest_one_s_7f5ace: "C Class is the easiest one, and S Class he hardest one."
  npc_override_socket_enchant_socket_enchant_c_class_eh_92829c: "C Class, eh?"
  npc_override_socket_enchant_socket_enchant_crazy_huh_1fe2ed: "Crazy. Huh?"
  npc_override_socket_enchant_socket_enchant_currently_you_re_carryin_73594b: "- Currently you're carrying -"
  npc_override_socket_enchant_socket_enchant_d_near_miracle_if_i_35ef25: "It'd be a near miracle if I can actually pull this off."
  npc_override_socket_enchant_socket_enchant_don_t_get_too_excited_8b4fdd: "But don't get too excited."
  npc_override_socket_enchant_socket_enchant_don_t_so_disappointed_tr_55bc2a: "Don't be so disappointed, and try next time."
  npc_override_socket_enchant_socket_enchant_great_seems_successful_9ae288: "Great, it seems to be successful."
  npc_override_socket_enchant_socket_enchant_however_i_am_completely_2f2fd8: "However, I am completely innocent."
  npc_override_socket_enchant_socket_enchant_however_you_should_know_809353: "However, you should know that there's a chance that I might fail."
  npc_override_socket_enchant_socket_enchant_i_categorize_weapons_the_05d813: "I categorize weapons by their difficulty in adding a Slot, C Class being easiest and S Class the most difficult."
  npc_override_socket_enchant_socket_enchant_i_d_like_go_ahead_6e79ea: "I'd like to go ahead with this Slot Addition attempt, but you're missing a few things."
  npc_override_socket_enchant_socket_enchant_i_m_considering_becoming_5a5a95: "I'm considering becoming a Slotting Engineer."
  npc_override_socket_enchant_socket_enchant_i_m_engineer_specializes_567e4d: "I'm an engineer that specializes in adding Slots to normal Weapons and Armor."
  npc_override_socket_enchant_socket_enchant_i_try_add_slot_now_56bfcb: "I can try to add a slot now if you have the required items and zeny."
  npc_override_socket_enchant_socket_enchant_i_wish_you_good_luck_7933ae: "I wish you good luck next time!"
  npc_override_socket_enchant_socket_enchant_if_attempt_add_slot_your_7399cd: "If this attempt to add a Slot to your Weapon fails, then the ^FF0000Weapon^000000, ^FF0000and any Cards compounded to it will be destroyed^000000."
  npc_override_socket_enchant_socket_enchant_if_attempt_add_slot_your_a2d6c5: "If this attempt to add a Slot to your Armor fails, then the ^FF0000Armor^000000, ^FF0000it's upgrades^000000 ^FF0000and any Cards compounded to it will be destroyed^000000."
  npc_override_socket_enchant_socket_enchant_if_you_all_required_mate_d73741: "If you have all the required materials, my zeny service fee and the Armor, then we can go ahead with the Slot Addition attempt."
  npc_override_socket_enchant_socket_enchant_if_you_ask_me_add_843ea9: "If you ask me to add a Slot to something, make sure that you don't have multiples of it in your inventory."
  npc_override_socket_enchant_socket_enchant_if_you_ever_want_try_a81d68: "If you ever want to try adding a Slot to some of your equipment, come back and let me know."
  npc_override_socket_enchant_socket_enchant_if_you_re_interested_my_52e7d1: "If you're interested in my service, let me know."
  npc_override_socket_enchant_socket_enchant_isn_t_really_peculiar_a78097: "isn't that really peculiar?"
  npc_override_socket_enchant_socket_enchant_just_remember_careful_5147fc: "Just remember to be careful."
  npc_override_socket_enchant_socket_enchant_just_remember_life_s_no_f456a3: "Just remember that life's no fun if you're always playing it safe~"
  npc_override_socket_enchant_socket_enchant_looks_pretty_well_done_c_84ca11: "It looks pretty well done. Congratulations!"
  npc_override_socket_enchant_socket_enchant_menu_add_47f78e: "Add Slot to Weapon:Add Slot to Armor:Slot Attempt Info:Cancel"
  npc_override_socket_enchant_socket_enchant_menu_attempt_9f2ced: "Attempt Slot Addition:Cancel"
  npc_override_socket_enchant_socket_enchant_menu_c_a81efd: "C Class:B Class:A Class:S Class"
  npc_override_socket_enchant_socket_enchant_menu_chain_29863f: "Chain:Gladius:Gakkung Bow:Pike:Haedonggum:Lute:Wire:Waghnakh:Arbalest Bow"
  npc_override_socket_enchant_socket_enchant_menu_gemmed_1ecbf1: "Gemmed Sallet:Bucket Hat:Memory Book:Tights:Legion Plate Armor:Full Plate:Thief Clothes:Greaves:Coif:Manteau:Helm:Ninja Suit:Orc Helm:Ancient Cape:Monk Hat:Golden Gear:Brooch:Munak Hat"
  npc_override_socket_enchant_socket_enchant_menu_gungnir_cb0678: "Gungnir:Poison Knife:Ice Pick:Sucsamad:Ginnungagap:Cutlas:Crescent Scythe:Survivor's Rod(DEX)"
  npc_override_socket_enchant_socket_enchant_menu_here_6b33b7: "Here's an example: if you have a +7 Manteau and a normal Manteau in your inventory, then I will randomly pick one of them for my Slot Addition attempt."
  npc_override_socket_enchant_socket_enchant_menu_hunter_c93d82: "Hunter Bow:Survivor's Rod(INT):Zweihander:Flamberge:Infiltrator:Ballista:Stunner:Berserk:Claymore"
  npc_override_socket_enchant_socket_enchant_menu_majestic_8693cb: "Majestic Goat:Spiky Band:Bone Helm:Corsair:Crown:Tiara:Sphinx Hat:Robe of Cast:Earring:Ring:Bow Thimble"
  npc_override_socket_enchant_socket_enchant_menu_mantle_0dc658: "Mantle:Coat:Circlet:Biretta"
  npc_override_socket_enchant_socket_enchant_menu_mirror_ed1380: "Mirror Shield:Chain Mail:Saint Robe:Silk Robe:Boots:Shoes:Muffler:Guard:Buckler:Shield:Bongun Hat"
  npc_override_socket_enchant_socket_enchant_menu_trident_fd2b00: "Trident:Rope:Violin"
  npc_override_socket_enchant_socket_enchant_msg_0ab831: "!"
  npc_override_socket_enchant_socket_enchant_msg_5bab61: "?"
  npc_override_socket_enchant_socket_enchant_my_bdadcc: "and my ^FF0000"
  npc_override_socket_enchant_socket_enchant_my_service_fee_required_f61f99: "My service fee, the required materials and the chance of success all depend on the specific item I'm working on."
  npc_override_socket_enchant_socket_enchant_need_some_time_think_abo_6ab721: "Need some time to think about it, huh?"
  npc_override_socket_enchant_socket_enchant_now_i_only_upgrade_certa_6122ce: "Now, I can only upgrade certain equipment in that class, so please choose one of the following items, so we can try to add a Slot to it."
  npc_override_socket_enchant_socket_enchant_oh_there_s_also_somethin_d5afba: "Oh, there's also something really important that you should know."
  npc_override_socket_enchant_socket_enchant_okay_which_weapon_shall_0f2a05: "Okay... Which weapon shall we try adding a Slot to?"
  npc_override_socket_enchant_socket_enchant_only_certain_equipment_h_86e991: "Only certain equipment can handle the addition of two extra Slots."
  npc_override_socket_enchant_socket_enchant_ooh_class_3f37cb: "Ooh, A Class."
  npc_override_socket_enchant_socket_enchant_other_towns_opposite_tru_85f044: "In other towns, the opposite is true."
  npc_override_socket_enchant_socket_enchant_please_choose_weapon_whi_e0e75b: "Please choose the weapon to which you'd like me to try to add a Slot."
  npc_override_socket_enchant_socket_enchant_please_try_again_cefdd7: "- Please try again -"
  npc_override_socket_enchant_socket_enchant_s_class_alright_6c779d: "S class? Alright..."
  npc_override_socket_enchant_socket_enchant_s_new_field_where_you_6cf66b: "It's a new field where you can add Slots to equipment, and it'd be cool if I can work in such a lucrative career."
  npc_override_socket_enchant_socket_enchant_s_so_complicated_i_d_20959c: "It's so complicated that I'd be lying if I told you that I knew every factor that affected the process."
  npc_override_socket_enchant_socket_enchant_see_you_again_buddy_bd76e1: "See you again, buddy!"
  npc_override_socket_enchant_socket_enchant_seeya_395801: "Seeya~"
  npc_override_socket_enchant_socket_enchant_so_what_kind_armor_you_15e298: "So, what kind of armor do you have?"
  npc_override_socket_enchant_socket_enchant_some_high_risk_territory_86524f: "This is some high risk territory!"
  npc_override_socket_enchant_socket_enchant_some_towns_slot_addition_b1b448: "In some towns, Slot addition attempts are more successful for equipment with fewer upgrades."
  npc_override_socket_enchant_socket_enchant_sounds_reasonable_b2ae49: "Sounds reasonable."
  npc_override_socket_enchant_socket_enchant_still_i_notice_few_trend_d7f3f0: "Still, I do notice a few trends..."
  npc_override_socket_enchant_socket_enchant_sure_no_problem_7a8730: "Sure, no problem."
  npc_override_socket_enchant_socket_enchant_take_easy_adventurer_c6a442: "Take it easy, adventurer."
  npc_override_socket_enchant_socket_enchant_there_s_huge_element_luc_a3d001: "There's a huge element of luck involved in successfully adding Slots from what I can understand."
  npc_override_socket_enchant_socket_enchant_there_s_so_much_more_4ea295: "There's so much more I have to learn before I can even be an apprentice..."
  npc_override_socket_enchant_socket_enchant_therefore_i_need_give_yo_22d581: "Therefore, I need to give you a fair warning..."
  npc_override_socket_enchant_socket_enchant_too_many_items_you_fc968e: "- too many items with you. -"
  npc_override_socket_enchant_socket_enchant_um_s_class_11d0a5: "Um... S Class?"
  npc_override_socket_enchant_socket_enchant_wah_i_am_so_sorry_312782: "Wah! ...I am so sorry, it failed."
  npc_override_socket_enchant_socket_enchant_wait_minute_17efa5: "- Wait a minute !! -"
  npc_override_socket_enchant_socket_enchant_well_i_haven_t_really_afdaa3: "Well, I haven't really refined the art of Slot Addition."
  npc_override_socket_enchant_socket_enchant_which_armor_you_like_try_a5f46e: "Which armor would you like to try adding a Slot?"
  npc_override_socket_enchant_socket_enchant_which_class_you_like_try_0461cb: "Which class would you like to try?"
  npc_override_socket_enchant_socket_enchant_whoa_whoa_whoa_c79d6d: "Whoa, whoa, whoa..."
  npc_override_socket_enchant_socket_enchant_you_chosen_average_b_cla_2966c2: "You have chosen average B Class."
  npc_override_socket_enchant_socket_enchant_you_d_better_pray_succes_11e95f: "You'd better pray for a successful result."
  npc_override_socket_enchant_socket_enchant_you_fail_sometimes_if_yo_a11f5e: "You fail sometimes, but if you're super lucky, you can add two Slots."
  npc_override_socket_enchant_socket_enchant_you_still_want_try_add_361ab2: "Do you still want to try to add a Slot?"
  npc_override_socket_enchant_socket_enchant_you_sure_about_62d3d8: "You sure about this?"
  npc_override_socket_enchant_socket_enchant_you_sure_you_equipment_r_fa2b17: "You sure that you have the equipment, required materials and the zeny?"
  npc_override_socket_enchant_socket_enchant_you_want_add_slot_ca60a1: "You want to add a Slot to a "
  npc_override_socket_enchant_socket_enchant_you_want_add_slot_weapon_f32d9c: "You want to add a Slot to a weapon?"
  npc_override_socket_enchant_socket_enchant_your_luck_destined_god_o_9dd7b7: "This is your luck, and it is destined by god, okay?"
  npc_override_socket_enchant_socket_enchant_zeny_service_fee_eefe4f: " zeny^000000 service fee."
