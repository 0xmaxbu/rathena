Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job_prist_priest_acolyte_you_don_t_any_373af0: "...Acolyte, you don't have any business with me here."
  npc_override_job_prist_priest_acolytes_reached_job_lev_01d18c: "Acolytes that have reached Job Level 50 will be exempt from the First Trial, the pilgrimage, as they have already demonstrated their enthusiasm and devotion."
  npc_override_job_prist_priest_afford_take_your_time_59b8c1: "afford to take your time."
  npc_override_job_prist_priest_after_meeting_father_rub_24bbeb: "After meeting Father Rubalkabara, please visit Sister Mathilda and Father Yosuke. You can check your quest progress with me if you have any questions later."
  npc_override_job_prist_priest_after_you_become_priest_d7507f: "After you become a Priest, your travels may take you to the Morocc Pyramids. I hope that you may release the Undead there from the evil to which they are bound."
  npc_override_job_prist_priest_ah_971301: "Ah..."
  npc_override_job_prist_priest_ah_i_see_i_let_7d18bd: "Ah, I see. I will let you know the order of pilgrimage again, and hope that you will have a safe journey."
  npc_override_job_prist_priest_ah_i_sense_you_warrior_5ce290: "Ah, I sense that you are a warrior that has been to Valhalla. You who have been reborn... We are here to look after you."
  npc_override_job_prist_priest_ah_s_good_idea_helping_080706: "Ah, that's a good idea. Helping young Acolytes should also be one of a Priest's priorities."
  npc_override_job_prist_priest_ah_yes_so_you_re_6935ea: "Ah yes, so you're the young Acolyte who wishes to become a Priest."
  npc_override_job_prist_priest_ah_you_8321c8: "Ah, are you"
  npc_override_job_prist_priest_ah_you_ve_started_your_f754ee: "Ah, you've started your pilgrimage. Please do your best to accomplish this first trial."
  npc_override_job_prist_priest_all_doom_darkness_despai_68cf27: "^330033All is doom, darkness and despair! Those who love you will betray you, and all that will be left is grieving and fury!^000000"
  npc_override_job_prist_priest_all_your_ability_you_pla_494413: "With all of your ability, you will play an important role in towns and dungeons."
  npc_override_job_prist_priest_alright_alright_old_time_4eeb17: "Alright, alright, for old time's sake, I'll let you pass me. But only this once. But I better not catch you again! This is evil turf, you hear?!"
  npc_override_job_prist_priest_also_if_you_chance_pleas_a98462: "Also, if you have a chance, please visit this abbey again. It's a sacred place for our Church."
  npc_override_job_prist_priest_although_there_still_two_8348ad: "Although there are still two trials awaiting you, I have faith that you will be able to accomplish your goal of becoming a Priest..."
  npc_override_job_prist_priest_although_you_cannot_rece_89eeff: "Although you cannot receive their help throughout all of the testing, they can at least help you during the spiritual training."
  npc_override_job_prist_priest_am_good_health_471ed5: "and am in good health."
  npc_override_job_prist_priest_anything_more_814740: "anything more."
  npc_override_job_prist_priest_anyway_let_me_give_you_ba3430: "Anyway, let me give you a brief explanation of the spiritual training. Are you familiar with what the spiritual training is for Priests?"
  npc_override_job_prist_priest_area_near_morocc_southwe_c8d7f3: "an area near Morocc, Southwest of Prontera."
  npc_override_job_prist_priest_as_we_help_others_we_474947: "As we help others, we must not expect to treat us in a similar fashion. To be a great Priest is your choice and responsibility, not anyone else's."
  npc_override_job_prist_priest_as_you_wish_19fe90: "as you wish."
  npc_override_job_prist_priest_aw_god_won_t_grant_eb0291: "Aw...? God won't grant you the power of holiness if your goals aren't just and pure. Meditate on your motivations for a while, and then come back to me."
  npc_override_job_prist_priest_aw_how_could_you_give_981287: "Aw...? How could you give me that kind of answer? I assume you're not ready to be a Priest yet..."
  npc_override_job_prist_priest_become_priest_48f892: "and become a Priest!"
  npc_override_job_prist_priest_besides_god_also_given_p_0bdc69: "Besides, God has also given Priests the resurrection power. Think about the meaning of life and death again, and then come back to me."
  npc_override_job_prist_priest_besides_none_your_busine_7ff6bc: "Besides, this is none of your business. Whether or not this Acolyte becomes a Priest isn't up to you. Now get out of here, before I get violent."
  npc_override_job_prist_priest_bless_you_c1ea40: "bless you..."
  npc_override_job_prist_priest_bless_you_e77ca3: "bless you."
  npc_override_job_prist_priest_book_you_i_hope_aid_4f8614: "This book is for you. I hope it will aid you in spreading God's message on earth."
  npc_override_job_prist_priest_brother_6157cf: "Brother {0}!"
  npc_override_job_prist_priest_brother_e79f70: "Brother {0},"
  npc_override_job_prist_priest_brother_f96663: "Brother {0}..."
  npc_override_job_prist_priest_bwahahahahahah_1c8541: "BWAHAHAHAHAHAH!"
  npc_override_job_prist_priest_bwahahahahahahaha_34fbbb: "BWAHAHAHAHAHAHAHA!"
  npc_override_job_prist_priest_card_5dfeef: "This card can"
  npc_override_job_prist_priest_cease_foolishness_pursui_526f34: "Cease this foolishness of pursuing the Priesthood. Make a contract with me. The entire world is yours for the taking."
  npc_override_job_prist_priest_choose_become_servant_go_c747ae: "^330033To choose to become a servant of God is to choose eternal pain!"
  npc_override_job_prist_priest_commemoration_your_job_c_5510f8: "In commemoration of your job change, I am giving you a bible. This will lighten your way to the path of righteousness."
  npc_override_job_prist_priest_complete_trial_quickly_174f2e: "Complete this trial quickly,"
  npc_override_job_prist_priest_completed_1f6290: "completed."
  npc_override_job_prist_priest_completed_within_4a528a: "completed within"
  npc_override_job_prist_priest_congratulations_04ece6: "Congratulations."
  npc_override_job_prist_priest_congratulations_you_comp_b223d4: "Congratulations, you have completed the trials required of all Priests. Let me promote you to the position of Priest right away."
  npc_override_job_prist_priest_continue_your_training_88b0ba: "continue your training."
  npc_override_job_prist_priest_contract_my_b22b16: "contract in my"
  npc_override_job_prist_priest_course_i_ll_let_you_2ba973: "Of course, I'll let you redistribute your stat points by your base level. Now, isn't that a sweet deal...?"
  npc_override_job_prist_priest_course_sometimes_i_want_fa4e5a: "Of course, sometimes I want to devote myself to training like those other Priests, but I have my duty to assist those Acolytes applying for the Priest job."
  npc_override_job_prist_priest_course_you_also_head_fie_12dc74: "Of course, you can also head 1 field East from Prontera, then go 1 field north, and then go 2 fields East..."
  npc_override_job_prist_priest_cross_again_ec2f96: "will cross again."
  npc_override_job_prist_priest_cutest_thing_you_ve_19132c: "cutest thing you've"
  npc_override_job_prist_priest_did_9ba500: "Did..."
  npc_override_job_prist_priest_did_you_just_tell_3ff395: "Did you just tell"
  npc_override_job_prist_priest_doing_back_here_7a5316: "doing back here?"
  npc_override_job_prist_priest_don_t_ever_come_back_af90f5: "^330033Don't ever come back!^000000"
  npc_override_job_prist_priest_enter_through_warp_end_h_ad772a: "Enter through the warp at the end of the hall, where you will be lead to the next test hall."
  npc_override_job_prist_priest_even_if_looks_like_you_ca40a4: "Even if it looks like you are aiding your party members, such action results in bad karma. Please reflect on that for a while."
  npc_override_job_prist_priest_ever_seen_huh_6a37c1: "ever seen, huh?"
  npc_override_job_prist_priest_excellent_choice_now_nev_be74b6: "Excellent choice. Now, never return to this place. I shall return your job to Novice as you wish."
  npc_override_job_prist_priest_father_rubalkabara_entra_739975: "Father Rubalkabara will be at the entrance of the Prontera Ruins. Be careful. That place is a habitat for aggressive Chocos."
  npc_override_job_prist_priest_final_trial_you_promise_a89335: "In the Final Trial, you will promise your devotion to God. Your willingness to sacrifice yourself will also be questioned."
  npc_override_job_prist_priest_finally_now_time_you_mee_12482e: "Finally, it is now time for you to meet Father Yosuke. He is doing penance somewhere around a field Northwest of Prontera. Please seek him out, and then return here to me."
  npc_override_job_prist_priest_fine_get_going_d27b42: "Fine, get going."
  npc_override_job_prist_priest_first_meet_father_rubalk_68fc09: "First, meet Father Rubalkabara. He's at the Northeast of the Prontera ruins."
  npc_override_job_prist_priest_first_please_visit_fathe_895104: "First, please visit Father"
  npc_override_job_prist_priest_first_priest_you_must_me_3d1012: "The first Priest you must meet is Father Rubalkabara. He is in the ruins Northeast of Prontera."
  npc_override_job_prist_priest_first_trial_you_make_pil_7b02a2: "For the First Trial, you will make a pilgrimage, and visit three acscetic Priests in a specific order."
  npc_override_job_prist_priest_follow_me_f3c136: "Follow me."
  npc_override_job_prist_priest_foolish_human_737a0c: "Foolish human..."
  npc_override_job_prist_priest_frail_mortal_you_4a4419: "For a frail mortal, you"
  npc_override_job_prist_priest_get_joke_cd5d7f: "GET THE JOKE!?"
  npc_override_job_prist_priest_give_your_life_god_4b8d98: "to give your life to God?"
  npc_override_job_prist_priest_go_59d7de: "Go for it!"
  npc_override_job_prist_priest_go_821b3f: "Go..."
  npc_override_job_prist_priest_go_ahead_god_bless_0217aa: "go ahead. God bless"
  npc_override_job_prist_priest_go_as_your_acolyte_enter_8774b7: "Go for it! As your Acolyte enters, the test will begin. Now, I will send you to the testing area."
  npc_override_job_prist_priest_go_back_5486bd: "Go back!"
  npc_override_job_prist_priest_go_earn_yourself_fc5ae9: "Go and earn it yourself!"
  npc_override_job_prist_priest_go_observe_adventurers_f_1d4efe: "Go and observe the adventurers that are fighting for peace in this world. They will teach you what you must do in order to help them."
  npc_override_job_prist_priest_go_think_about_value_suf_d1b0aa: "Go and think about the value of suffering and the meaning of sacrifice. When you think you understand more about helping those in need, come back to me."
  npc_override_job_prist_priest_god_grant_your_power_you_c66408: "God, grant your power to your servant standing before you."
  npc_override_job_prist_priest_god_please_look_after_yo_074a85: "God, please look after your poor children. Help them overcome their hardships and difficulties. Refresh their spirits..."
  npc_override_job_prist_priest_god_safety_dbdfd5: "God for safety"
  npc_override_job_prist_priest_good_choice_5aba52: "Good choice~"
  npc_override_job_prist_priest_good_choice_998be2: "Good choice!"
  npc_override_job_prist_priest_good_i_send_you_training_6c4c9d: "Good. I will send you to the training ground. Please ask for help from Brother Peter."
  npc_override_job_prist_priest_good_i_send_you_training_766bed: "Good. I will send you to the training ground. When you get there, please speak to Brother Peter who is in charge of the training."
  npc_override_job_prist_priest_good_see_you_again_broth_eddea1: "It is good to see you again, Brother {0}. Once again, God's grace has caused our paths to cross."
  npc_override_job_prist_priest_good_see_you_once_again_40974c: "It is good to see you once again, Sister {0}. The grace of God has brought you once more before me."
  npc_override_job_prist_priest_good_you_0e34ea: "Good for you!"
  npc_override_job_prist_priest_greetings_21e190: "Greetings."
  npc_override_job_prist_priest_haha_i_like_you_never_bc5c4f: "Haha, I like you! But it never hurts to have too much information. The more well informed you are, the more easily you'll pass the test!"
  npc_override_job_prist_priest_halt_human_eb169e: "^330033Halt, human."
  npc_override_job_prist_priest_happy_being_priest_1ebd03: "happy being a Priest?"
  npc_override_job_prist_priest_he_doing_alright_d5f5f2: "Is he doing alright"
  npc_override_job_prist_priest_hello_little_aco_abe389: "Hello little Aco."
  npc_override_job_prist_priest_hereby_first_a39784: "Hereby, the first of"
  npc_override_job_prist_priest_hm_701c55: "Hm...?"
  npc_override_job_prist_priest_hm_what_you_need_4f478f: "Hm? What is it you need?"
  npc_override_job_prist_priest_hmm_8ee499: "Hmm."
  npc_override_job_prist_priest_hmm_9c4d28: "Hmm..."
  npc_override_job_prist_priest_hmm_you_haven_t_made_6a46bd: "Hmm? You haven't made your oath yet...? Without the conviction of an oath to God, you may be tempted by evil at anytime."
  npc_override_job_prist_priest_hmpf_i_admire_f81461: "Hmpf. I admire"
  npc_override_job_prist_priest_hold_there_acolyte_28f61a: "Hold on there, Acolyte."
  npc_override_job_prist_priest_hopefully_our_paths_41c656: "Hopefully, our paths"
  npc_override_job_prist_priest_how_about_now_isn_t_3e443d: "But how about this...? Now, isn't this an attractive sight? A nice, shiny new card. Mint condition. Not too many people have this you know. But I happen to have soooo many, my pockets hurt."
  npc_override_job_prist_priest_how_my_buddy_paul_01aa46: "How is my buddy Paul?"
  npc_override_job_prist_priest_how_you_say_no_s_83cb80: "How can you say no...? That's one of the basic principles of Priesthood. You must value the welfare of others over your own safety."
  npc_override_job_prist_priest_however_point_your_pilgr_b41b12: "However, at this point in your pilgrimage, I am not the person that you should be visiting."
  npc_override_job_prist_priest_however_there_certain_th_8eb9cc: "However, there are certain things that an Acolyte must do alone. All Acolytes must complete their divine test by themselves."
  npc_override_job_prist_priest_however_those_who_receiv_30ac30: "However, those who receive should be polite. You should give an outstanding example, but you should also have your limits as a human."
  npc_override_job_prist_priest_i_also_know_deviruchi_do_1b8130: "I also know that Deviruchi, Doppelganger and the Dark Lord have all failed to convince you to turn away from the Priesthood."
  npc_override_job_prist_priest_i_am_bishop_paul_cervant_f38a79: "I am Bishop Paul Cervantes, and am in charge of the Prontera Parish."
  npc_override_job_prist_priest_i_am_doing_fine_867e2e: "I am doing fine"
  npc_override_job_prist_priest_i_am_glad_meet_person_52bc5b: "I am glad to meet a person as eager and devoted to God such as yourself."
  npc_override_job_prist_priest_i_am_glad_you_ve_0c8b2f: "I am glad that you've done well with the spiritual training. Congratulations. You are now qualified to be called a Priest."
  npc_override_job_prist_priest_i_assure_you_you_won_877834: "I assure you... You won't be happy at all to see me."
  npc_override_job_prist_priest_i_believe_cff34c: "I believe."
  npc_override_job_prist_priest_i_believe_god_s_work_d37b12: "But I believe this is God's will, and that this is the work he has intended me to do as his servant. Have a safe journey, and come back safely."
  npc_override_job_prist_priest_i_cannot_let_you_know_61317e: "I cannot let you know the specific details, but as long as you believe in yourself and have faith in all that is good, you will succeed."
  npc_override_job_prist_priest_i_congratulate_you_dee2d0: "I congratulate you"
  npc_override_job_prist_priest_i_don_t_any_business_f9ff96: "I don't have any business with you, servant of God. Just pass through."
  npc_override_job_prist_priest_i_don_t_think_you_2233a8: "I don't think you understood what I just offered. Think about it again. I mean, this is your one and only chance to undo your life mistakes. I mean, becoming an Acolyte?"
  npc_override_job_prist_priest_i_give_you_exactly_minut_5afb3a: "I will give you exactly 5 minutes! You must proceed slowly and eliminate the Zombies."
  npc_override_job_prist_priest_i_grant_you_any_treasure_7448c8: "I can grant you any treasure you desire and infinite power at your fingertips. Powerful weapons that humans have never before seen..."
  npc_override_job_prist_priest_i_guess_i_m_49590c: "I guess I'm not the"
  npc_override_job_prist_priest_i_hate_348714: "I hate"
  npc_override_job_prist_priest_i_here_988a75: "I will be here"
  npc_override_job_prist_priest_i_hope_i_explained_enoug_310493: "I hope I explained enough of the class. Why don't you go outside and talk to some of the other Priests if you want to learn more about our way of life?"
  npc_override_job_prist_priest_i_hope_my_invocation_eas_c02196: "I hope my invocation has eased your pain. Now please go forth and spread God's message. May God be with you..."
  npc_override_job_prist_priest_i_hope_you_assist_acolyt_567b97: "I hope you will assist this Acolyte in becoming a Priest."
  npc_override_job_prist_priest_i_hope_you_assist_your_db5b28: "I hope you will assist your Acolyte friend in the second test, the spiritual training."
  npc_override_job_prist_priest_i_hope_you_continue_go_0cbb92: "I hope you will continue to go on your mission as God's servant, brother."
  npc_override_job_prist_priest_i_hope_you_continue_go_2e3295: "I hope you will continue to go on your mission as God's servant, sister."
  npc_override_job_prist_priest_i_hope_you_find_someone_31b3dc: "I hope that you find someone who has already become a Priest to help during the spiritual training. Good luck, and have faith."
  npc_override_job_prist_priest_i_hope_you_ve_reflected_32d154: "I hope that you've reflected on what you've said last time, and that you now have the attitude to become a Priest."
  npc_override_job_prist_priest_i_know_who_you_35051f: "I know who you are."
  npc_override_job_prist_priest_i_m_like_deviruchi_b7a74f: "I'm not like Deviruchi,"
  npc_override_job_prist_priest_i_m_pleased_see_you_7a53c2: "I'm pleased to see that you are continuing to lead the children of God on the right path. Is there anything I can help you with today?"
  npc_override_job_prist_priest_i_mean_people_always_cry_d2f958: "I mean, people are always crying to Priests for help no matter where they are. And Priests never get anything in return..."
  npc_override_job_prist_priest_i_no_doubt_you_good_c68d5e: "I have no doubt that you will do a good job by yourself. However, it will be easier with the aid of a Brother or Sister that has already become a Priest."
  npc_override_job_prist_priest_i_no_idea_what_brought_a12d06: "I have no idea what brought you here, but please excuse me."
  npc_override_job_prist_priest_i_now_send_you_training_b7eebd: "I will now send you to the training place for Acolytes. Please send my regards to Brother Peter..."
  npc_override_job_prist_priest_i_recommend_getting_help_40f84b: "I recommend getting help from a Priest if you can."
  npc_override_job_prist_priest_i_see_fd141e: "I see..."
  npc_override_job_prist_priest_i_see_great_effort_you_90c3d4: "I can see the great effort you have exerted to reach job level 50. You have been a loyal servant to God."
  npc_override_job_prist_priest_i_see_so_you_wish_f3eddb: "I see. So you wish to be a Priest. God will be delighted by your decision and will bless you."
  npc_override_job_prist_priest_i_see_still_if_you_d62d29: "I see. But still, if you have any questions, you may wish to ask Sister Cecilia. She will address any of your concerns."
  npc_override_job_prist_priest_i_see_take_your_time_1d9983: "I see, take your time. Don't forget to bring a ^0000FFRosary^000000..."
  npc_override_job_prist_priest_i_see_well_feel_free_ce4a45: "I see. Well, feel free to relax and make yourself at home. Nowhere on earth is safer than the Prontera Sanctuary."
  npc_override_job_prist_priest_i_see_you_returned_your_31f5b8: "I see you have returned from your meeting with Father Rubalkabara. How is he doing? I am worried about his health, since he's been there all alone... "
  npc_override_job_prist_priest_i_see_you_returned_your_cc69e1: "I see that you have returned from your journey to meet Sister Mathilda. She has been meditating in the hot, dry desert for a long time."
  npc_override_job_prist_priest_i_see_you_ve_devoted_a9e112: "I see. You've devoted yourself to God. Many Acolytes wish to become Priests to continue on their personal journey towards holiness."
  npc_override_job_prist_priest_i_shall_personally_see_m_18e253: "I shall personally see to that, mortal.^000000"
  npc_override_job_prist_priest_i_shall_pray_97ce96: "I shall pray to"
  npc_override_job_prist_priest_i_shall_preparing_my_tro_fae05d: "I shall be preparing my troops for you. The day will come when I shall enjoy watching you writhe in agony as my fiends slowly devour you."
  npc_override_job_prist_priest_i_shall_return_your_34a0ad: "I shall return your"
  npc_override_job_prist_priest_i_strongly_recommend_you_9ff36a: "I strongly recommend that you use all of these skill points before you apply for the Priest job change test."
  npc_override_job_prist_priest_i_told_you_go_back_0fd5c9: "I told you to go back to church."
  npc_override_job_prist_priest_i_understand_i_suppose_y_8d656a: "I understand. I suppose you have some important reason or business that you must attend to. Come back whenever you can."
  npc_override_job_prist_priest_i_ve_been_supporting_man_4604c3: "I've been supporting many people in becoming Priests ever since I joined the Prontera Parish. That is one of my main responsibilities."
  npc_override_job_prist_priest_i_ve_received_message_bi_1b0bf3: "I've received the message from Bishop Paul. Since you made the pilgrimage, I hope you accomplish your goal of becoming a Priest."
  npc_override_job_prist_priest_i_won_t_say_29e5b8: "I won't say"
  npc_override_job_prist_priest_i_yours_summon_anytime_a_a35c42: "I will be yours to summon at anytime. All other humans will dread making you their enemy. You will become the most powerful person in all of history!"
  npc_override_job_prist_priest_if_chance_we_meet_again_ac1f87: "But if by chance we meet again,"
  npc_override_job_prist_priest_if_you_close_priest_you_ade258: "If you are close to a Priest, you'd better ask him to assist you during this trial. Now, are you ready?"
  npc_override_job_prist_priest_if_you_experience_proble_969fe1: "If you experience a problem during any of your trials, feel free to visit me. I will help you as much as I can."
  npc_override_job_prist_priest_if_you_know_somebody_who_57dba4: "If you know somebody who has already become a Priest, ask them to help you during your spiritual training."
  npc_override_job_prist_priest_if_you_pass_test_you_685a2b: "If you pass the test, you will be able to use more powerful skills that will be effective against Demon and Undead creatures..."
