Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@exsh_DeepForest_ask_them_let_you_468306: "Ask them to let you in."
  npc_override_1@exsh_DeepForest_go_back_288584: "Go back."
  npc_override_1@exsh_DeepForest_hyunrok_told_me_bring_su_735d15: "Hyunrok told me not to bring in suspicious people!!"
  npc_override_1@exsh_DeepForest_leave_deep_forest_f909d9: "Leave Deep Forest."
  npc_override_1@exsh_DeepForest_menu_admiral_299f41: "Admiral Lee Daegam : Kwang Saeng, I think you've gone too deep, so why don't you leave this to your servants?"
  npc_override_1@exsh_DeepForest_menu_admiral_746859: "Admiral Lee Daegam : What the hell is this!"
  npc_override_1@exsh_DeepForest_menu_admiral_9235ad: "Admiral Lee Daegam : A man with horns!!!"
  npc_override_1@exsh_DeepForest_menu_admiral_bc15b6: "Admiral Lee Daegam : Where are we?"
  npc_override_1@exsh_DeepForest_menu_admiral_c4d231: "Admiral Lee Daegam : Why are the beasts dressed?"
  npc_override_1@exsh_DeepForest_menu_admiral_e31b7d: "Admiral Lee Daegam : Oops!"
  npc_override_1@exsh_DeepForest_menu_admiral_eefaf1: "Admiral Lee Daegam : Aaaah!!!"
  npc_override_1@exsh_DeepForest_menu_chulho_0689c2: "Chulho : Argh!! I can't do this!!!"
  npc_override_1@exsh_DeepForest_menu_chulho_09cd64: "Chulho : You've only been watching!!!"
  npc_override_1@exsh_DeepForest_menu_chulho_11b5e9: "Chulho : I've been looking for you for a long time!"
  npc_override_1@exsh_DeepForest_menu_chulho_27e226: "Chulho : Then he's near the north main building!"
  npc_override_1@exsh_DeepForest_menu_chulho_35d5d8: "Chulho : But why are you attacking me!"
  npc_override_1@exsh_DeepForest_menu_chulho_5c6ed4: "Chulho : This is the front door, so let's hurry up and go in."
  npc_override_1@exsh_DeepForest_menu_chulho_5c83f9: "Chulho : He smells just like me!!!"
  npc_override_1@exsh_DeepForest_menu_chulho_7e1647: "Chulho : What are you talking about!"
  npc_override_1@exsh_DeepForest_menu_chulho_7ec50e: "Chulho : Ch--"
  npc_override_1@exsh_DeepForest_menu_chulho_7f46f3: "Chulho : I'll have to look for Hyunrok."
  npc_override_1@exsh_DeepForest_menu_chulho_82979d: "Chulho : Aaaah!!!"
  npc_override_1@exsh_DeepForest_menu_chulho_832687: "Chulho : Don't just ignore what I said!"
  npc_override_1@exsh_DeepForest_menu_chulho_97209b: "Chulho : I thought I was going to die..."
  npc_override_1@exsh_DeepForest_menu_chulho_975ba5: "Chulho : This is not the time to sit back!"
  npc_override_1@exsh_DeepForest_menu_chulho_99ecf4: "Chulho : You followed me right away!"
  npc_override_1@exsh_DeepForest_menu_chulho_a652dd: "Chulho : Thank you!"
  npc_override_1@exsh_DeepForest_menu_chulho_b342cc: "Chulho : Am I going to end up like that!!!"
  npc_override_1@exsh_DeepForest_menu_chulho_b38fb7: "Chulho : Then you can keep playing with me!"
  npc_override_1@exsh_DeepForest_menu_chulho_bd8495: "Chulho : What?!"
  npc_override_1@exsh_DeepForest_menu_chulho_c1a2ff: "Chulho : Don't just say that and help me!"
  npc_override_1@exsh_DeepForest_menu_chulho_c6616a: "Chulho : Argh!! Why are you hitting me all of a sudden!!!"
  npc_override_1@exsh_DeepForest_menu_chulho_ca6c6c: "Chulho : What if I become a monster like that!"
  npc_override_1@exsh_DeepForest_menu_chulho_d1ccbc: "Chulho : Arrgggg!!! It's gross!!!!!"
  npc_override_1@exsh_DeepForest_menu_chulho_d47103: "Chulho : What's happening!"
  npc_override_1@exsh_DeepForest_menu_chulho_dab572: "Chulho : This man is a tiger like me!"
  npc_override_1@exsh_DeepForest_menu_chulho_dd5ec2: "Chulho : Oh my!"
  npc_override_1@exsh_DeepForest_menu_chulho_f3dcff: "Chulho : That's where you were!"
  npc_override_1@exsh_DeepForest_menu_chulho_f55112: "Chulho : It seems that Hyunrok is very angry, given that there is an air of ferocity."
  npc_override_1@exsh_DeepForest_menu_chulho_f75246: "Chulho : Let's calm this guy down and go into the woods!!!"
  npc_override_1@exsh_DeepForest_menu_chulho_fcd689: "Chulho : It's me!! It's me!! It's Chulho!!!"
  npc_override_1@exsh_DeepForest_menu_chulho_fe53a6: "Chulho : Then let's have a party since we scolded the bad guy!"
  npc_override_1@exsh_DeepForest_menu_guard_06c7d1: "Guard : You'll have to deal with us if you don't want go back!!!!"
  npc_override_1@exsh_DeepForest_menu_guard_2977b1: "Guard : I told you to go back!!!"
  npc_override_1@exsh_DeepForest_menu_hyunrok_0ed739: "Hyunrok : How did you get into this place?"
  npc_override_1@exsh_DeepForest_menu_hyunrok_14f597: "Hyunrok : Back off!!! How dare you!"
  npc_override_1@exsh_DeepForest_menu_hyunrok_292dfb: "Hyunrok : Chulho, Kisul. You're back."
  npc_override_1@exsh_DeepForest_menu_hyunrok_311ebd: "Hyunrok : It was reckless to try to win this forest with that amount of strength."
  npc_override_1@exsh_DeepForest_menu_hyunrok_3b5e80: "Hyunrok : Even the slightest trace seems too much for you, but I hope the life of the trace will be an opportunity to reflect on your sins."
  npc_override_1@exsh_DeepForest_menu_hyunrok_401b3a: "Hyunrok : He's not a part of the forest like us, he's a forester, he's a forester."
  npc_override_1@exsh_DeepForest_menu_hyunrok_5289c6: "Hyunrok : You'd better get back to where you belong."
  npc_override_1@exsh_DeepForest_menu_hyunrok_58da38: "Hyunrok : Anyway, I think anyone who lives outside the forest should go back to the outside."
  npc_override_1@exsh_DeepForest_menu_hyunrok_692052: "Hyunrok : I was out only for a moment I think."
  npc_override_1@exsh_DeepForest_menu_hyunrok_70fb25: "Hyunrok : That is not possible."
  npc_override_1@exsh_DeepForest_menu_hyunrok_7bebff: "Hyunrok : The people who have disturbed the forest are approaching again."
  npc_override_1@exsh_DeepForest_menu_hyunrok_7ef493: "Hyunrok : Let me send you back now."
  npc_override_1@exsh_DeepForest_menu_hyunrok_86bbe3: "Hyunrok : Please..."
  npc_override_1@exsh_DeepForest_menu_hyunrok_8c6f78: "Hyunrok : Aaah!!"
  npc_override_1@exsh_DeepForest_menu_hyunrok_9a9b00: "Hyunrok : How rude can you be!!!"
  npc_override_1@exsh_DeepForest_menu_hyunrok_a2e8a6: "Hyunrok : We can't just sit back."
  npc_override_1@exsh_DeepForest_menu_hyunrok_a49d68: "Hyunrok : I left a small letter in front of the forest when you return, so please take a look before you leave."
  npc_override_1@exsh_DeepForest_menu_hyunrok_bf1cdd: "Hyunrok : So go back before you're obsessed with this place."
  npc_override_1@exsh_DeepForest_menu_hyunrok_cdadb8: "Hyunrok : Have a safe journey home..."
  npc_override_1@exsh_DeepForest_menu_hyunrok_d47e69: "Hyunrok : Oh my!!!"
  npc_override_1@exsh_DeepForest_menu_hyunrok_de7d2c: "Hyunrok : And {0}, thank you very much for helping us despite my rudeness."
  npc_override_1@exsh_DeepForest_menu_hyunrok_f16404: "Hyunrok : What are you talking about?"
  npc_override_1@exsh_DeepForest_menu_hyunrok_f1b6b5: "Hyunrok : But the person next to you is...?"
  npc_override_1@exsh_DeepForest_menu_hyunrok_f265ee: "Hyunrok : Even though there are some similarities with you Chulho..."
  npc_override_1@exsh_DeepForest_menu_kisul_166e9a: "Kisul : Don't stand like that and move."
  npc_override_1@exsh_DeepForest_menu_kisul_27880b: "Kisul : It's because I'm still young, so please understand~"
  npc_override_1@exsh_DeepForest_menu_kisul_3cc3d9: "Kisul : Oh my~"
  npc_override_1@exsh_DeepForest_menu_kisul_455fa0: "Kisul : Didn't I tell you not to eat anything?"
  npc_override_1@exsh_DeepForest_menu_kisul_4d61de: "Kisul : The smell doesn't disappear, so it's natural to be considered suspicious!"
  npc_override_1@exsh_DeepForest_menu_kisul_5aef02: "Kisul : Let's see..."
  npc_override_1@exsh_DeepForest_menu_kisul_5efb47: "Kisul : If it's Hyunrok, he's always there."
  npc_override_1@exsh_DeepForest_menu_kisul_6cfb9e: "Kisul : Hmm..."
  npc_override_1@exsh_DeepForest_menu_kisul_745162: "Kisul : Well, let's put the monsters to sleep and talk again."
  npc_override_1@exsh_DeepForest_menu_kisul_7fd842: "Kisul : It's been a long time since I've seen something interesting~"
  npc_override_1@exsh_DeepForest_menu_kisul_828fa4: "Kisul : He's got a lot of horns!"
  npc_override_1@exsh_DeepForest_menu_kisul_915d9d: "Kisul : Hahahahaha!!!"
  npc_override_1@exsh_DeepForest_menu_kisul_99cb20: "Kisul : It's beginning to smell ominous, so you'd better hurry up and look for Hyunrok."
  npc_override_1@exsh_DeepForest_menu_kisul_9a1069: "Kisul : You won't change like other wild animals after taking that medicine."
  npc_override_1@exsh_DeepForest_menu_kisul_9aebaa: "Kisul : It won't be difficult, so try your best."
  npc_override_1@exsh_DeepForest_menu_kisul_af13a5: "Kisul : I thought it was weird, but you didn't know?!"
  npc_override_1@exsh_DeepForest_menu_kisul_bb6f53: "Kisul : Are you trying to do something annoying again?"
  npc_override_1@exsh_DeepForest_menu_kisul_bb7800: "Kisul : It's good to have a feast, but if you stay in the forest for too long, you won't be able to go back."
  npc_override_1@exsh_DeepForest_menu_kisul_bffec1: "Kisul : Hahahahaha!"
  npc_override_1@exsh_DeepForest_menu_kisul_d5fd64: "Kisul : Ah~"
  npc_override_1@exsh_DeepForest_menu_kisul_dc69cd: "Kisul : Things are going more interesting than I thought."
  npc_override_1@exsh_DeepForest_menu_kisul_f03faf: "Kisul : It's hard to you fluster like that..."
  npc_override_1@exsh_DeepForest_menu_kisul_f74f69: "Kisul : Calm down and stay put."
  npc_override_1@exsh_DeepForest_menu_kwang_17c828: "Kwang Saeng : Arg!!"
  npc_override_1@exsh_DeepForest_menu_kwang_5d4347: "Kwang Saeng : Eheheheh!!!"
  npc_override_1@exsh_DeepForest_menu_kwang_72910a: "Kwang Saeng : The mysterious beasts of the Deep Forest that no man can enter!!!!"
  npc_override_1@exsh_DeepForest_menu_kwang_92d559: "Kwang Saeng : Because all the animals that have taken my medicine have no choice but to listen to my orders."
  npc_override_1@exsh_DeepForest_menu_kwang_9b4bf9: "Kwang Saeng : A legendary animal in front of my eyes that can be immortalized by cutting and sweetening those horns!!!!"
  npc_override_1@exsh_DeepForest_menu_kwang_b074f0: "Kwang Saeng : You won't be able to stop me with the beasts of the forest!"
  npc_override_1@exsh_DeepForest_menu_kwang_bf47ed: "Kwang Saeng : Oh!!!!"
  npc_override_1@exsh_DeepForest_menu_kwang_ee54e7: "Kwang Saeng : Why!!!"
  npc_override_1@exsh_DeepForest_menu_kwang_f29c30: "Kwang Saeng : Arg!!!!!"
  npc_override_1@exsh_DeepForest_menu_kwang_f5906b: "Kwang Saeng : I finally found it!!!"
  npc_override_1@exsh_DeepForest_menu_options_0e7117: "??? : Who is it!!! It smells fishy!!!"
  npc_override_1@exsh_DeepForest_menu_options_7141ee: "?????? : Arrgggg!!!"
  npc_override_1@exsh_DeepForest_menu_options_778c24: "??? : Get out of this forest right now!!"
  npc_override_1@exsh_DeepForest_menu_options_858d73: "??? : I've never smelled anything like that!!!"
  npc_override_1@exsh_DeepForest_menu_options_9e4251: "?????? : That's too much!!!"
  npc_override_1@exsh_DeepForest_menu_options_ea0788: "?????? : Huhh!!!!"
  npc_override_1@exsh_DeepForest_something_mysterious_see_eac113: "- Something mysterious seems to be blocking the way. Let's talk to Chulho first. -"
  npc_override_1@exsh_DeepForest_stay_c9088a: "Stay."
  npc_override_1@exsh_DeepForest_you_t_pass_through_here_829d24: "You can't pass through here."
