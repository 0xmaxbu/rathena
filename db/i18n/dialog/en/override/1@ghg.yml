Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@ghg_WaterGarden_accordance_gardeners_pla_009c5e: "In accordance with the Gardeners' plant cultivation and herbicide plans. Admission to the water garden is limited once per day for both the normal and hard water garden."
  npc_override_1@ghg_WaterGarden_after_move_papilla_maze_695c6a: "After the move... Papilla in the maze... Please prune all of them."
  npc_override_1@ghg_WaterGarden_also_some_gardeners_dest_7640f1: "Also some of the gardeners were destroyed by the intruders."
  npc_override_1@ghg_WaterGarden_attack_range_varies_depe_1e48d0: "The attack range varies depending on the color of the Papilla."
  npc_override_1@ghg_WaterGarden_careful_papila_s_halluci_466c60: "Be careful of the papila's hallucinogens."
  npc_override_1@ghg_WaterGarden_careful_papillas_other_t_52792b: "Be careful, Papillas' and other type of Papillas seems to be wandering around."
  npc_override_1@ghg_WaterGarden_cleanup_complete_please_81170e: "Cleanup is complete. Please proceed to the next area."
  npc_override_1@ghg_WaterGarden_don_t_forget_go_out_793080: "Don't forget to go out and talk to Seiyu to ^0000CDReceive your rewards^000000 from todays work."
  npc_override_1@ghg_WaterGarden_end_garden_there_manager_378d08: "At the end of the garden, there is a manager waiting to open the next area, so please speak to her when you reach there."
  npc_override_1@ghg_WaterGarden_enter_8017fb: "Enter the ^CC0000{0}^000000."
  npc_override_1@ghg_WaterGarden_enter_water_garden_14e07a: "^0000CDEnter Water Garden"
  npc_override_1@ghg_WaterGarden_enter_water_garden_hard_6f8e0c: "Enter Water Garden Hard^000000"
  npc_override_1@ghg_WaterGarden_error_occurred_89cb9e: "An error... has occurred."
  npc_override_1@ghg_WaterGarden_final_garden_opened_i_fo_19c728: "The final garden opened. But... I forgot what should I do..."
  npc_override_1@ghg_WaterGarden_final_garden_opened_plea_34e49b: "The final garden has opened. Please proceed to the next area."
  npc_override_1@ghg_WaterGarden_garden_entrance_723898: "^0000CDGarden Entrance^000000"
  npc_override_1@ghg_WaterGarden_guest_i_d_like_you_4ae4ba: "Guest, I'd like you to please prune the plants and animals."
  npc_override_1@ghg_WaterGarden_guest_you_already_move_n_0d6718: "Guest, you can already move to the next area."
  npc_override_1@ghg_WaterGarden_guests_welcome_water_gar_451b4d: " Guests, welcome to the water garden,"
  npc_override_1@ghg_WaterGarden_guests_welcome_water_gar_794210: "Guests, welcome to the water garden. Are you going to see Papilla? Papilla's been very sensitive about the intruders lately..."
  npc_override_1@ghg_WaterGarden_hello_guest_1ea10d: "Hello, guest."
  npc_override_1@ghg_WaterGarden_i_warned_you_advanced_ca_3324c4: "I warned you on advanced, but be careful. Pruning all overgrown plants and animals opens the door to the next area at 3 o'clock."
  npc_override_1@ghg_WaterGarden_i_warned_you_advanced_ca_3bdbd1: "I warned you on advanced, but be careful."
  npc_override_1@ghg_WaterGarden_if_gardeners_ever_attack_2376de: "If the gardeners ever attack the guest, they're all broken gardeners, so don't hesitate to take it down."
  npc_override_1@ghg_WaterGarden_if_papilla_shows_up_duri_f375ec: "If a Papilla shows up during the battle, make it follow you to the pillar of the same color."
  npc_override_1@ghg_WaterGarden_if_papilla_touches_light_11cbc8: "If the Papilla touches the light, it will take damage and die."
  npc_override_1@ghg_WaterGarden_if_they_ever_attack_gues_333a94: "If they ever attack the guest, they're all broken gardeners, so don't hesitate to take it down."
  npc_override_1@ghg_WaterGarden_if_you_safely_stop_silva_31917b: "If you can safely stop Silva Papilla, we will handle the rest!"
  npc_override_1@ghg_WaterGarden_instance_been_created_ye_d31305: "The instance has not been created yet."
  npc_override_1@ghg_WaterGarden_magic_papilla_s_activate_fec7d7: "The magic of the Papilla's has activated. Be careful!"
  npc_override_1@ghg_WaterGarden_md_level_above_f498bd: "- This MD is for level 180 or above. -"
  npc_override_1@ghg_WaterGarden_next_garden_portal_creat_99b542: "Next garden... portal creation complete... Move into the 12 o'clock direction... to use... Thank you..."
  npc_override_1@ghg_WaterGarden_obstructions_now_gone_yo_662587: "The obstructions is now gone, you can not move to the next area."
  npc_override_1@ghg_WaterGarden_oh_i_forgot_make_regular_226f0f: "Oh, I forgot to make regular contact! I'll get in touch. Would you like a cookie while you're here?"
  npc_override_1@ghg_WaterGarden_papilla_s_returned_9d3a82: "The Papilla's has returned!"
  npc_override_1@ghg_WaterGarden_papillas_playing_around_297871: "Papillas are playing around here and there. They use psychedelic materials from their wings to make short distance movements or use a dangerous magic over them."
  npc_override_1@ghg_WaterGarden_papillas_playing_around_f234d5: "Papillas are playing around here and there."
  npc_override_1@ghg_WaterGarden_party_entering_d3d912: "{0} of the party, {1}, is entering the {2}."
  npc_override_1@ghg_WaterGarden_party_leader_who_receive_96bd19: "^FF0000The party leader who received the quest for the 'Water Garden' or 'Water Garden Hard' must enter the instance to proceed. In the case of party leader changes, the instance will be cancelled and you may not proceed.^000000"
  npc_override_1@ghg_WaterGarden_place_docks_54f4e2: "This place is the docks."
  npc_override_1@ghg_WaterGarden_please_check_07b3fc: "Please check it."
  npc_override_1@ghg_WaterGarden_please_note_any_abnormal_2a12ea: "^FF0000Please note that, any abnormal monster handling inside the instance such as taming, is not considered normal.^000000"
  npc_override_1@ghg_WaterGarden_please_take_enough_rest_f730a5: "Please take enough rest and come back again after dawn!"
  npc_override_1@ghg_WaterGarden_pruning_all_overgrown_pl_1f92a5: "Pruning all overgrown plants and animals opens the door to the next area at 3 o'clock."
  npc_override_1@ghg_WaterGarden_reservation_instance_fai_f7a70c: "The reservation of the instance '{0}' has failed due to an active instance."
  npc_override_1@ghg_WaterGarden_rose_garden_very_beautif_f6dcaa: "The rose garden is a very beautiful place, but recently, we are having trouble maintaining it because of the swarms of animals and plants that appeared in groups."
  npc_override_1@ghg_WaterGarden_s_dangerous_inside_you_t_e068fb: "But it's dangerous inside. You can't enter right now."
  npc_override_1@ghg_WaterGarden_s_little_slow_so_you_c721ed: "It's a little slow, so you might have to wait, but... the next area will definitely open."
  npc_override_1@ghg_WaterGarden_s_strange_i_forgot_yeste_2f9d4e: "That's strange, I forgot it yesterday, but I forgot it today as well."
  npc_override_1@ghg_WaterGarden_ship_only_run_once_day_62a2a9: "The ship only run once a day!"
  npc_override_1@ghg_WaterGarden_thank_you_your_understan_8a3b2c: "Thank you for your understanding."
  npc_override_1@ghg_WaterGarden_then_i_ll_burn_incense_17a217: "Then, I'll burn the incense that calls out Silva Papilla..."
  npc_override_1@ghg_WaterGarden_then_i_ll_show_you_cce968: "Then, I'll show you the way outside again!"
  npc_override_1@ghg_WaterGarden_they_use_psychedelic_mat_a0e443: "They use psychedelic materials from their wings to make short distance movements or use a dangerous magic over them."
  npc_override_1@ghg_WaterGarden_wait_sec_267d13: "^008800Wait a sec!!"
  npc_override_1@ghg_WaterGarden_we_don_t_any_ships_381ce5: "We don't have any ships operating right now. But the scenery is nice, feel free to take a look around for a while!"
  npc_override_1@ghg_WaterGarden_when_md_opened_please_sp_e19181: "When the {0} MD has opened, please speak to me again and select ^0000CDEnter {1}^000000."
  npc_override_1@ghg_WaterGarden_worry_i_already_contacte_6ba7c1: "Do not worry, I already contacted Alpha. Hehe."
  npc_override_1@ghg_WaterGarden_you_cannot_receive_any_m_5017ef: "You cannot receive any more items because you're carrying too many items. Please try again after you lighten up.^000000"
  npc_override_1@ghg_WaterGarden_you_didn_t_forget_your_e50c91: "You didn't forget your request from Seiyu, and came in here, right?"
  npc_override_1@ghg_WaterGarden_you_eliminated_all_obstr_01e2b2: "You have eliminated all the obstructions. Please proceed to the next area."
  npc_override_1@ghg_WaterGarden_you_enter_water_garden_a_723ba8: "- You can enter the water garden after the party leader has entered the MD. -"
  npc_override_1@ghg_WaterGarden_you_going_see_papilla_pa_861bdc: "Are you going to see Papilla? Papilla's been very sensitive about the intruders lately..."
  npc_override_1@ghg_WaterGarden_you_like_take_ride_water_5dfc9d: "Would you like to take a ride to the water garden?"
  npc_override_1@ghg_WaterGarden_you_tell_me_if_you_8dffe5: "You can tell me if you want to enter the water garden."
