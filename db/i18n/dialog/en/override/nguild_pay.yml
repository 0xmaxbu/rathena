Body:
  npc_override_nguild_pay_nguild_dunsw_menu_pull_7414f9: "Pull.:Do not."
  npc_override_nguild_pay_nguild_dunsw_nothing_happened_4501ec: " Nothing happened."
  npc_override_nguild_pay_nguild_dunsw_one_who_overcome_ordeal_2c6a9e: " ' The one who can overcome an ordeal and show true bravery... will find the way... ' "
  npc_override_nguild_pay_nguild_dunsw_only_one_who_show_true_433e8c: " ' Only the one who can show true bravery can take this test. '"
  npc_override_nguild_pay_nguild_dunsw_there_s_small_lever_you_e840a3: "There's a small lever. Will you pull it?"
  npc_override_nguild_pay_nguild_kafras_i_am_contracted_provide_045215: "I am contracted to provide service only for the ^ff0000{0}^000000 Guild. Please use another Kafra Corporation staff member around here. I am Sorry for your inconvenience."
  npc_override_nguild_pay_nguild_managers_as_you_wish_master_5a4c04: "As you wish, master."
  npc_override_nguild_pay_nguild_managers_as_you_wish_master_i_806c21: "As you wish Master.  But I suggest we get a Kafra as soon as possible!"
  npc_override_nguild_pay_nguild_managers_goods_produced_everyday_77d2e3: "The goods are produced everyday."
  npc_override_nguild_pay_nguild_managers_how_you_i_m_here_ea742a: "How do you do? I'm here to provide you with helpful service! I'll do the best I can to serve you."
  npc_override_nguild_pay_nguild_managers_i_am_here_follow_s_4c14a6: "I am here to follow ^5533FF{0}^000000's command! Hey! Your not even a part of the guild!!"
  npc_override_nguild_pay_nguild_managers_i_am_waiting_my_master_4b40ee: "I am waiting for my master.  Brave adventurer, follow your destiny!"
  npc_override_nguild_pay_nguild_managers_i_done_anything_wrong_if_4f8ed6: "Have I done anything wrong? If I did, will you please forgive me?"
  npc_override_nguild_pay_nguild_managers_i_think_kafra_staff_bene_e381d6: "I think the Kafra Staff will benefit our guild members."
  npc_override_nguild_pay_nguild_managers_kafra_been_dismissed_we_992a5d: "The Kafra has been dismissed.  But... we should really get a Kafra as soon as possible!"
  npc_override_nguild_pay_nguild_managers_master_i_think_you_shoul_c51d86: "Master, I think you should keep the current Kafra Staff because she is already trying her best to serve us"
  npc_override_nguild_pay_nguild_managers_master_you_don_t_contrac_2e58da: "Master, you don't have a contract with the Kafra Staff Company."
  npc_override_nguild_pay_nguild_managers_master_you_enough_money_75aa30: "Master, you do not have enough money to employ a Kafra. Employment has been cancelled."
  npc_override_nguild_pay_nguild_managers_order_hire_kafra_you_mus_ff28d0: "In order to hire a Kafra, you must first learn the Guild skill ^5533FFContract With Kafra^000000."
  npc_override_nguild_pay_nguild_managers_please_follow_me_through_12288d: "Please follow me through the secret passage way."
  npc_override_nguild_pay_nguild_managers_s_unfortunate_i_won_t_54e25a: "It's unfortunate that I won't be able to serve your guild anymore...."
  npc_override_nguild_pay_nguild_managers_thank_you_master_i_ll_763138: "Thank you master, I'll do my best! ^^."
  npc_override_nguild_pay_nguild_managers_welcome_master_i_assist_b26228: "Welcome Master ^5533FF{0}^000000 ! I will assist you in any way I can!"
  npc_override_nguild_pay_nguild_managers_where_guardians_destroy_809717: "Where are the guardians? Destroy these intruders!"
  npc_override_nguild_pay_nguild_managers_you_created_contract_kaf_475afd: "You have created a contract with the Kafra Staff Company."
  npc_override_nguild_pay_nguild_managers_you_go_our_treasure_room_7d425d: "Would you to go to our Treasure Room? Only you, the Guild Master, are allowed to enter this room."
  npc_override_nguild_pay_nguild_managers_you_like_dismiss_current_5f5c00: "Would you like to dismiss the current Kafra?"
  npc_override_nguild_pay_nguild_managers_you_like_employ_services_7df2f2: "Would you like to employ the services of a Kafra? You will need ^5533FF10,000 Zeny^000000 to do so... "
  npc_override_nguild_pay_nguild_managers_you_must_pull_down_secre_62e645: "You must pull down on the secret switch in order to get out."
  npc_override_nguild_pay_nguild_managers_you_re_i_am_here_781f91: "You're not ^5533FF{0}^000000! I am here to follow ^5533FF{1}^000000's command only"
  npc_override_nguild_pay_nguild_managers_you_should_get_them_when_aecc98: "You should get them whenever you can because they might dissapear if you take them at the wrong time."
  npc_override_nguild_pay_nguild_treas_all_treasure_boxes_been_a8c751: "All of the treasure boxes have been opened.  You must wait untill the next day for them to appear again."
  npc_override_nguild_pay_nguild_treas_menu_pull_7414f9: "Pull.:Do not."
  npc_override_nguild_pay_nguild_treas_there_s_small_lever_you_e840a3: "There's a small lever. Will you pull it?"
  npc_override_nguild_pay_nguild_treas_treasure_chest_broken_op_8244b6: "Treasure Chest Broken Open"
