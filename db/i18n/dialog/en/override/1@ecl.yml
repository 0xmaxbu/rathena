Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@ecl_EclageInterior_all_laphines_think_orb_a_2e9bdd: "All Laphines think of the Orb as something natural as air and water, but he was the first one to make me perceive it differently and investigate its origin."
  npc_override_1@ecl_EclageInterior_all_probablility_you_da7844: "In all probablility,{0}it will be you."
  npc_override_1@ecl_EclageInterior_although_you_re_detained_7f7dc3: "Although you're detained on suspicion of being responsible for the recent incident in the lighting room,"
  npc_override_1@ecl_EclageInterior_anyway_guy_guilty_7461d4: "Anyway, this guy is not guilty."
  npc_override_1@ecl_EclageInterior_bah_da9552: "...Bah."
  npc_override_1@ecl_EclageInterior_battle_cannot_avoided_6e47ba: "A battle cannot be avoided!"
  npc_override_1@ecl_EclageInterior_because_my_sons_74e09a: "Is it because of my sons?"
  npc_override_1@ecl_EclageInterior_both_you_karr_won_t_a5e845: "but both you and Karr won't be able to avoid your responsibility."
  npc_override_1@ecl_EclageInterior_chief_staff_laphine_who_012a1b: "The Chief of Staff is a Laphine who stayed with us for a long time! He can't be..."
  npc_override_1@ecl_EclageInterior_closed_shut_c5d594: "It is closed shut."
  npc_override_1@ecl_EclageInterior_current_quest_held_memor_f4cf48: "This current quest will be held at Memorial dungeon."
  npc_override_1@ecl_EclageInterior_did_something_happen_you_e73bb6: "Did something happen to you?"
  npc_override_1@ecl_EclageInterior_doesn_t_matter_1a693c: "It doesn't matter."
  npc_override_1@ecl_EclageInterior_don_t_worry_about_us_2c5c12: "Don't worry about us."
  npc_override_1@ecl_EclageInterior_door_connects_plaza_s_ce_2ad57a: "This door connects to the plaza's ceiling."
  npc_override_1@ecl_EclageInterior_empty_room_nothing_insid_270ffb: "An empty room with nothing inside."
  npc_override_1@ecl_EclageInterior_farewell_then_12f614: "Farewell, then!"
  npc_override_1@ecl_EclageInterior_given_tight_internal_sec_baea91: "Given the tight internal security, you should prepare yourself."
  npc_override_1@ecl_EclageInterior_group_unidentifiable_cre_dc5d85: "A group of unidentifiable creatures is approaching threateningly."
  npc_override_1@ecl_EclageInterior_ha_hahaha_4d43be: "Ha...hahaha..."
  npc_override_1@ecl_EclageInterior_hah_e59629: "Hah..."
  npc_override_1@ecl_EclageInterior_he_might_been_under_infl_ed16f0: "He might have been under the influence for a good while."
  npc_override_1@ecl_EclageInterior_hehehe_hahahhaha_ahahaha_f001eb: "hehehe...hahahhaha ahahahahha"
  npc_override_1@ecl_EclageInterior_hey_look_who_s_here_b3584e: "Hey, look who's here!"
  npc_override_1@ecl_EclageInterior_his_power_enbales_him_co_1d505a: "His power enbales him to control another person directly or mentally influence that person indirectly through a part of his body."
  npc_override_1@ecl_EclageInterior_hmm_room_60db3c: "Hmm? This room?"
  npc_override_1@ecl_EclageInterior_hopefully_d4a70f: "...hopefully."
  npc_override_1@ecl_EclageInterior_how_powerful_shenime_e56fe0: "This is how powerful Shenime is."
  npc_override_1@ecl_EclageInterior_i_also_believe_you_re_7d36f1: "but I also believe you're not guilty."
  npc_override_1@ecl_EclageInterior_i_didn_t_expect_9586c7: "I didn't expect this."
  npc_override_1@ecl_EclageInterior_i_doing_research_power_o_8169b9: "I was doing a research on the power of the Orb on my own."
  npc_override_1@ecl_EclageInterior_i_don_t_know_details_eea171: "I don't know the details,"
  npc_override_1@ecl_EclageInterior_i_don_t_think_s_4662a0: "I don't think it's a big deal."
  npc_override_1@ecl_EclageInterior_i_don_t_understand_word_ae6059: "I don't understand a word you're saying."
  npc_override_1@ecl_EclageInterior_i_fought_monsters_4a14e0: "I fought with monsters."
  npc_override_1@ecl_EclageInterior_i_ll_move_you_treatment_69314d: "I'll move you to the treatment room since this seems like a severe wound."
  npc_override_1@ecl_EclageInterior_i_m_so_angry_about_601d3b: "...I'm so angry about the fact that I just realized how he used me, but what's even worse is that I've done something horrible to our people."
  npc_override_1@ecl_EclageInterior_i_prove_4e6dc7: "I can prove it."
  npc_override_1@ecl_EclageInterior_i_should_sure_hope_you_2b0bd0: "I should sure hope that you aren't the disturbance they're looking for, right?"
  npc_override_1@ecl_EclageInterior_i_started_questioning_pr_441eb7: "and I started questioning the principle of the Orb's power since we all benefit from it."
  npc_override_1@ecl_EclageInterior_i_started_thinking_about_406ce4: "I started from thinking about the beauty of the Orb and went on to wondering what kind of power is accumulated inside the Orb..."
  npc_override_1@ecl_EclageInterior_i_swear_name_guardian_yg_04f6fe: "I swear by the name of the guardian of Yggdrasil, too."
  npc_override_1@ecl_EclageInterior_i_think_i_m_pretty_c811ac: "I think I'm pretty irritated now."
  npc_override_1@ecl_EclageInterior_i_think_you_should_talk_f4c990: "I think you should talk to Hisie first."
  npc_override_1@ecl_EclageInterior_i_thought_just_my_imagin_cf146d: "I thought it was just my imagination and ignored it...maybe that's when he..."
  npc_override_1@ecl_EclageInterior_if_you_favor_mayor_you_d320b9: "If you favor Mayor, you should be cautious here."
  npc_override_1@ecl_EclageInterior_immediately_after_you_th_1a9dfe: "Immediately after that, you were thrown here."
  npc_override_1@ecl_EclageInterior_inner_core_stolen_ce91a7: "The inner core is stolen."
  npc_override_1@ecl_EclageInterior_just_coincidence_309589: "Or is it just a coincidence?"
  npc_override_1@ecl_EclageInterior_karr_waiting_you_c0d740: "Karr is waiting for you."
  npc_override_1@ecl_EclageInterior_keheehehehe_816ec5: "Keheehehehe......"
  npc_override_1@ecl_EclageInterior_king_domons_after_orb_527d06: "Is the King of Domons after the Orb?"
  npc_override_1@ecl_EclageInterior_kkwaaa_e816bd: "Kkwaaa!"
  npc_override_1@ecl_EclageInterior_kyaarr_ke_keryarya_0429a2: "Kyaarr...Ke...Keryarya!!"
  npc_override_1@ecl_EclageInterior_kyaarr_keraahhh_2fe74d: "Kyaarr...Keraahhh!!!"
  npc_override_1@ecl_EclageInterior_let_s_go_18400d: "Let's go.{0}."
  npc_override_1@ecl_EclageInterior_let_s_go_i_ll_fdca6f: "Let's go. I'll guide you."
  npc_override_1@ecl_EclageInterior_light_coming_out_circula_4ed0f4: "a light is coming out of a circular equipment in the middle of the room."
  npc_override_1@ecl_EclageInterior_loki_s_palm_there_rested_377137: "On Loki's palm, there rested a small, thin, and dried piece of thorn."
  npc_override_1@ecl_EclageInterior_looks_like_soldiers_insi_9da2be: "Looks like the soldiers inside are really tense."
  npc_override_1@ecl_EclageInterior_me_avant_all_people_haha_284cda: "Me, Avant, of all the people?! Hahahaha!"
  npc_override_1@ecl_EclageInterior_menu_enter_d64ea8: "Enter it.:Forget it."
  npc_override_1@ecl_EclageInterior_menu_it_cce57d: "It's all because of you!:Shenime said..."
  npc_override_1@ecl_EclageInterior_menu_what_6cc1ea: "What...?:I fought monsters off!"
  npc_override_1@ecl_EclageInterior_monsters_subordinates_mo_741d14: "Monsters? Subordinates of Morocc?"
  npc_override_1@ecl_EclageInterior_msg_61ce5a: "[{0}]"
  npc_override_1@ecl_EclageInterior_msg_93fcbf: "......"
  npc_override_1@ecl_EclageInterior_never_mind_don_t_worry_5ee9ac: "Never mind. Don't worry about it."
  npc_override_1@ecl_EclageInterior_no_way_b23888: "No...way!!!"
  npc_override_1@ecl_EclageInterior_nobody_knows_orb_s_inner_f26c0f: "Nobody knows that the Orb's inner core is gone,"
  npc_override_1@ecl_EclageInterior_none_them_died_fortunate_4f23dd: "None of them died fortunately, but most of them are wounded severely."
  npc_override_1@ecl_EclageInterior_now_i_think_about_c63eae: "Now that I think about it..."
  npc_override_1@ecl_EclageInterior_now_you_became_betrayer_e20d2d: "Now you became a betrayer."
  npc_override_1@ecl_EclageInterior_oh_what_s_going_here_fb0518: "Oh, what's going on here?"
  npc_override_1@ecl_EclageInterior_only_party_leader_enter_976520: "Only the party leader will enter. Please create your party."
  npc_override_1@ecl_EclageInterior_ooh_so_s_what_happened_724f57: "Ooh...so that's what happened."
  npc_override_1@ecl_EclageInterior_our_target_morocc_king_d_d8950a: "Our target is Morocc, the King of Demons."
  npc_override_1@ecl_EclageInterior_place_set_up_lighting_or_06083f: "This place is set up with lighting for Orb."
  npc_override_1@ecl_EclageInterior_pretty_difficult_guide_o_86f2d2: "It is pretty difficult to guide an outsider like you."
  npc_override_1@ecl_EclageInterior_right_before_coming_here_2949f4: "Right before coming here, Shenime reached his hand out to me and I felt a spark when I held his hand."
  npc_override_1@ecl_EclageInterior_right_shenime_he_excited_9db3d7: "Right...Shenime. He excited my curiosity on purpose."
  npc_override_1@ecl_EclageInterior_s_also_place_where_light_59e336: "It's also a place where the lighting is set up to make Orb seem more beautiful."
  npc_override_1@ecl_EclageInterior_s_because_2128ba: "It's because of this."
  npc_override_1@ecl_EclageInterior_s_easy_task_feedb3: "It's not an easy task."
  npc_override_1@ecl_EclageInterior_s_fun_anymore_i_m_5e2168: "It's not fun anymore. I'm no longer interested in you."
  npc_override_1@ecl_EclageInterior_s_good_enough_we_found_c8f34e: "It's good enough that we found an evidence here."
  npc_override_1@ecl_EclageInterior_s_no_fun_f38717: "It's no fun."
  npc_override_1@ecl_EclageInterior_s_why_karr_didn_t_de8c63: "and that's why Karr didn't make it here."
  npc_override_1@ecl_EclageInterior_seems_like_guy_next_me_50b7c4: "It seems like this guy next to me has a lot more to say than I do."
  npc_override_1@ecl_EclageInterior_seems_like_there_s_visit_2e6dd5: "Seems like there's a visitor."
  npc_override_1@ecl_EclageInterior_seems_like_they_going_st_905567: "It seems like they are going to start attacking any minute."
  npc_override_1@ecl_EclageInterior_seems_like_you_ve_rested_b48344: "It seems like you've rested enough. Let's get going."
  npc_override_1@ecl_EclageInterior_shenime_chief_staff_d282ad: "Shenime, the Chief of Staff?"
  npc_override_1@ecl_EclageInterior_shenime_just_urged_me_pe_ab9772: "But Shenime just urged me persistently."
  npc_override_1@ecl_EclageInterior_shenime_one_subordinates_e93067: "Shenime is one of the subordinates of Morocc."
  npc_override_1@ecl_EclageInterior_situation_very_good_righ_3da082: "The situation is not very good right now."
  npc_override_1@ecl_EclageInterior_so_you_re_saying_he_78f6b0: "So you're saying that he deceived us all?"
  npc_override_1@ecl_EclageInterior_so_you_re_saying_shenime_4a95a3: "So you're saying that Shenime was after the Orb?"
  npc_override_1@ecl_EclageInterior_someone_take_responsibil_33f3b9: "Someone has to take the responsibility here then."
  npc_override_1@ecl_EclageInterior_stimulate_person_who_was_f04b09: "Stimulate a person who wasn't aware of air and water, and make him recognize and carry on investigating!"
  npc_override_1@ecl_EclageInterior_t_you_organize_your_stor_a95134: "Can't you organize your story? Don't you know 'five W's and one H' rule?"
  npc_override_1@ecl_EclageInterior_thank_you_your_help_3a7d59: "Thank you for your help."
  npc_override_1@ecl_EclageInterior_there_some_soldiers_disp_900deb: "There are some soldiers dispatched by Mayor not too long ago."
  npc_override_1@ecl_EclageInterior_there_some_witnesses_pro_de1b78: "there are some witnesses to prove your innocence."
  npc_override_1@ecl_EclageInterior_there_subtle_magical_ech_482980: "There was a subtle and magical echo to it."
  npc_override_1@ecl_EclageInterior_these_two_gentlemen_here_25c6ad: "......these two gentlemen here cleared up all charges related to the Orb,"
  npc_override_1@ecl_EclageInterior_they_destroyed_additiona_4883e5: "They destroyed additional troops that Mayor sent?"
  npc_override_1@ecl_EclageInterior_they_kill_me_9d5966: "They will kill me!"
  npc_override_1@ecl_EclageInterior_they_look_as_if_they_79f6bf: "They look as if they are incarnation of Morocc."
  npc_override_1@ecl_EclageInterior_they_seemed_surprised_al_34eeb0: "They seemed surprised, and although Bifrost's will still holds, it's hard to communicate."
  npc_override_1@ecl_EclageInterior_they_use_wicked_tricks_e0a6b9: "They use wicked tricks."
  npc_override_1@ecl_EclageInterior_things_got_out_control_a89bc6: "But things got out of control."
  npc_override_1@ecl_EclageInterior_thorn_here_probably_clou_e68dad: "This thorn here probably has clouded your judgement."
  npc_override_1@ecl_EclageInterior_unknown_error_occurred_58bda4: "An unknown error has occurred."
  npc_override_1@ecl_EclageInterior_upon_eliminating_intrude_f730c4: "Upon eliminating the intruders near the Orb, another strange-looking creatures appeared."
  npc_override_1@ecl_EclageInterior_wait_here_minute_d05c45: "Wait here for a minute."
  npc_override_1@ecl_EclageInterior_warning_f1907f: "-! Warning !-"
  npc_override_1@ecl_EclageInterior_we_cannot_help_fighting_5076c8: "We cannot help fighting them!"
  npc_override_1@ecl_EclageInterior_we_couldn_t_communicate_40b345: "We couldn't communicate with them either, and one of them seemed furious after looking around and finding out that its fellows are defeated."
  npc_override_1@ecl_EclageInterior_we_take_off_now_e34e51: "We will take off now."
  npc_override_1@ecl_EclageInterior_well_then_i_t_blame_ff90bd: "Well, then, I can't blame you too much."
  npc_override_1@ecl_EclageInterior_well_well_did_he_get_c8113d: "Well, well...did he get me, too?"
  npc_override_1@ecl_EclageInterior_well_well_isn_t_interest_43543a: "Well, well...isn't that interesting!"
  npc_override_1@ecl_EclageInterior_what_earth_happened_ther_64bce5: "What on earth happened there?"
  npc_override_1@ecl_EclageInterior_what_happened_orb_ebbc13: "What happened to the Orb?"
  npc_override_1@ecl_EclageInterior_what_kind_person_you_thi_606f0e: "What kind of a person do you think I am, seriously!"
  npc_override_1@ecl_EclageInterior_what_s_more_several_sold_02716d: "And what's more, several soldiers are injured because of you."
  npc_override_1@ecl_EclageInterior_what_strange_chance_brou_6e3999: "What a strange chance it is that has brought us together here!"
  npc_override_1@ecl_EclageInterior_what_you_mean_c0ce14: "What do you mean?"
  npc_override_1@ecl_EclageInterior_what_you_trying_kill_our_4f5885: "What you were trying to kill were our soldiers, the Laphines!!"
  npc_override_1@ecl_EclageInterior_what_you_two_26cbbd: "What will you two do?"
  npc_override_1@ecl_EclageInterior_why_don_t_you_explain_5205d7: "Why don't you explain to him first?"
  npc_override_1@ecl_EclageInterior_why_he_related_ec086c: "Why is he related to this?"
  npc_override_1@ecl_EclageInterior_you_had_conscience_7af48e: "You had a conscience?"
  npc_override_1@ecl_EclageInterior_you_ll_catch_shenime_dc966e: "you'll have to catch Shenime."
  npc_override_1@ecl_EclageInterior_you_re_friend_my_son_132ac7: "You're a friend of my son, right?"
  npc_override_1@ecl_EclageInterior_you_re_probably_right_4c6636: "You're probably right."
  npc_override_1@ecl_EclageInterior_you_tell_me_exactly_what_176f18: "Can you tell me exactly what happened?"
  npc_override_1@ecl_EclageInterior_your_job_ends_here_2a4e1c: "Your job ends here."
