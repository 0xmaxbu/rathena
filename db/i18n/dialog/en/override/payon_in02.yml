Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_payon_in02_archer_ah_items_arrived_product_205974: "Ah, items have arrived from the Production Department. Here, take these! These are all yours!"
  npc_override_payon_in02_archer_ah_you_must_been_be46e3: "Ah, you must have been"
  npc_override_payon_in02_archer_alright_see_you_later_988307: "Alright, see you later."
  npc_override_payon_in02_archer_although_archer_ragnarok_5073cc: "Although an Archer in Ragnarok has lower HP, he or she has high accuracy and attack rate so that the archer can kill monsters before they get close to an Archer."
  npc_override_payon_in02_archer_although_archer_weaker_h_26fd83: "Although an Archer has weaker HP, he or she can shoot enemies at a long range,"
  npc_override_payon_in02_archer_although_there_s_no_spec_8d7afd: "Although there's no special"
  npc_override_payon_in02_archer_archer_change_jobs_hunte_941885: "^8C2121An Archer can change jobs to a Hunter.^000000"
  npc_override_payon_in02_archer_archer_skills_using_bow_9f8188: "An Archer has skills using a bow and has various talents."
  npc_override_payon_in02_archer_because_archer_needs_ext_a4567f: "Because an Archer needs extremely high concentration, so we do not accept those who have little patience."
  npc_override_payon_in02_archer_before_didn_t_you_427cbd: "before, didn't you?"
  npc_override_payon_in02_archer_bye_e17e76: "Bye."
  npc_override_payon_in02_archer_congratulations_you_now_6398af: "Congratulations! You are now an Archer! Also, we hope that you actively participate in many programs for the revival of the Archer Guild."
  npc_override_payon_in02_archer_err_cb8e49: "Err..."
  npc_override_payon_in02_archer_greatest_ability_archer_e1492b: "The greatest ability of an Archer is attacking enemies from a long distance."
  npc_override_payon_in02_archer_haha_you_kidding_me_acaa42: "Haha, you are kidding me..."
  npc_override_payon_in02_archer_having_bow_arrows_now_yo_98fdae: "Having a bow and arrows, now you became a real Archer."
  npc_override_payon_in02_archer_hey_i_know_you_141307: "Hey, I know you."
  npc_override_payon_in02_archer_hey_what_64dbe3: "Hey, what are"
  npc_override_payon_in02_archer_hm_so_you_now_ready_e795d6: "....Hm~~ so you are now ready to be an Archer. I will take the step right away."
  npc_override_payon_in02_archer_i_feel_sorry_only_novice_97f86a: "I feel sorry but only Novices can change their job."
  npc_override_payon_in02_archer_i_know_you_ll_make_c20aca: "I know you'll make a great Archer..."
  npc_override_payon_in02_archer_i_tell_you_re_cut_57a41c: "I can tell that you're not cut out to be an Archer. It sort of feels like you're meant to do"
  npc_override_payon_in02_archer_if_you_any_questions_fee_14c044: "If you have any questions, feel free to come and ask me."
  npc_override_payon_in02_archer_if_you_open_arrow_contai_73fe5a: "If you open the arrow container, there are arrows in it and then you can equip them."
  npc_override_payon_in02_archer_menu_i_baa458: "I want to be an Archer.:I need the requirements, please.:Nothing, thanks."
  npc_override_payon_in02_archer_need_say_anything_else_42b3b2: "need to say anything else."
  npc_override_payon_in02_archer_nice_meet_you_how_may_e45c8c: "Nice to meet you. How may I help you?"
  npc_override_payon_in02_archer_oh_6a4011: "Oh...?"
  npc_override_payon_in02_archer_other_than_hunter_if_you_a0edb3: "^8C2121Other than Hunter, if you are a man, you can change your job to Bard and if you are a woman, you can change your job to Dancer.^000000"
  npc_override_payon_in02_archer_reward_you_time_i_hope_2f2fe5: "reward for you this time, I hope you understand. Take care of yourself."
  npc_override_payon_in02_archer_so_archer_safer_real_bat_4f5389: "so an Archer is safer in a real battle."
  npc_override_payon_in02_archer_something_else_ded8a4: "something else..."
  npc_override_payon_in02_archer_valhalla_been_reborn_df8050: "to Valhalla and been reborn."
  npc_override_payon_in02_archer_well_i_expect_hear_bette_9b2be7: "Well, I expect to hear better news from you. It's time to say goodbye."
  npc_override_payon_in02_archer_well_then_i_don_t_32ed7c: "Well then. I don't"
  npc_override_payon_in02_archer_well_you_re_right_skill_80fff4: "Well, you're not at the right skill level."
  npc_override_payon_in02_archer_wow_s_so_impressive_a84468: "Wow, that's so impressive!"
  npc_override_payon_in02_archer_you_already_your_own_dec_9744dc: "You already have your own decent job, don't you?"
  npc_override_payon_in02_archer_you_d_better_learn_all_6e6cc8: "You'd better learn all the Basic Skills first before you can become an Archer."
  npc_override_payon_in02_archer_you_doing_here_03ba8a: "you doing here...?"
  npc_override_payon_in02_archer_you_took_test_af2996: "You took this test"
  npc_override_payon_in02_archer_your_basic_skill_now_eno_ca7f9e: "Your Basic Skill is now enough.."
  npc_override_payon_in02_archer_your_job_level_must_leas_ddbcdb: "Your job level must be at least ^4A4AFF10^000000 and your Basic Skill level should reach ^4A4AFFlevel 9"
