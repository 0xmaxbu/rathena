Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_payon_in02_archer_ah_items_arrived_product_205974: "Ah, items have arrived from the Production Department. Here, take these! These are all yours!"
  npc_override_payon_in02_archer_ah_you_must_been_be46e3: "Ah, you must have been"
  npc_override_payon_in02_archer_ah_your_bow_arrived_bow_8e6838: "Ah, your bow has arrived from the Bow Production Department. Here, take it! It's yours~"
  npc_override_payon_in02_archer_alright_let_me_check_d38fc5: "Alright, let me check."
  npc_override_payon_in02_archer_alright_see_you_later_988307: "Alright, see you later."
  npc_override_payon_in02_archer_although_archer_ragnarok_5073cc: "Although an Archer in Ragnarok has lower HP, he or she has high accuracy and attack rate so that the archer can kill monsters before they get close to an Archer."
  npc_override_payon_in02_archer_although_archer_weaker_h_26fd83: "Although an Archer has weaker HP, he or she can shoot enemies at a long range,"
  npc_override_payon_in02_archer_although_there_s_no_spec_8d7afd: "Although there's no special"
  npc_override_payon_in02_archer_anyway_whatever_you_you_461304: "Anyway, whatever you are, you can't choose a job as an Archer because you have a job already."
  npc_override_payon_in02_archer_archer_change_jobs_hunte_941885: "^8C2121An Archer can change jobs to a Hunter.^000000"
  npc_override_payon_in02_archer_archer_needs_extremely_h_6c9f2b: "An Archer needs extremely high concentration and reflexes, so we do not accept those who have little patience."
  npc_override_payon_in02_archer_archer_skills_using_bow_9f8188: "An Archer has skills using a bow and has various talents."
  npc_override_payon_in02_archer_because_archer_needs_ext_a4567f: "Because an Archer needs extremely high concentration, so we do not accept those who have little patience."
  npc_override_payon_in02_archer_before_didn_t_you_427cbd: "before, didn't you?"
  npc_override_payon_in02_archer_but_2e7fce: "But..."
  npc_override_payon_in02_archer_bye_e17e76: "Bye."
  npc_override_payon_in02_archer_congratulations_36b252: "Congratulations!"
  npc_override_payon_in02_archer_congratulations_you_now_6398af: "Congratulations! You are now an Archer! Also, we hope that you actively participate in many programs for the revival of the Archer Guild."
  npc_override_payon_in02_archer_course_we_expect_you_hel_3545b1: "Of course, we expect that you will help contribute towards the future of the Archer Guild with your efforts."
  npc_override_payon_in02_archer_err_cb8e49: "Err..."
  npc_override_payon_in02_archer_excellent_80519c: "Excellent!"
  npc_override_payon_in02_archer_excellent_congratulation_ff2082: "Excellent! Congratulations!"
  npc_override_payon_in02_archer_first_all_you_job_level_b23737: "First of all, you have to the Job Level 9 as a Novice, and know all of the Basic Skills."
  npc_override_payon_in02_archer_good_day_how_may_i_9e89da: "Good day. How may I help you?"
  npc_override_payon_in02_archer_greatest_ability_archer_e1492b: "The greatest ability of an Archer is attacking enemies from a long distance."
  npc_override_payon_in02_archer_haha_you_kidding_me_acaa42: "Haha, you are kidding me..."
  npc_override_payon_in02_archer_having_bow_arrows_now_yo_98fdae: "Having a bow and arrows, now you became a real Archer."
  npc_override_payon_in02_archer_hey_i_know_you_141307: "Hey, I know you."
  npc_override_payon_in02_archer_hey_what_64dbe3: "Hey, what are"
  npc_override_payon_in02_archer_hm_so_you_now_ready_e795d6: "....Hm~~ so you are now ready to be an Archer. I will take the step right away."
  npc_override_payon_in02_archer_hmm_9c4d28: "Hmm..."
  npc_override_payon_in02_archer_i_appraise_value_various_be5539: "I will appraise the value of the various types of Trunks, needed to produce a Bow, that you've brought."
  npc_override_payon_in02_archer_i_explain_requirements_b_31b8b7: "I will explain the requirements for being an Archer."
  npc_override_payon_in02_archer_i_feel_sorry_only_novice_97f86a: "I feel sorry but only Novices can change their job."
  npc_override_payon_in02_archer_i_know_you_ll_make_c20aca: "I know you'll make a great Archer..."
  npc_override_payon_in02_archer_i_ll_transfer_these_trun_936582: "I'll transfer these Trunks to our Bow Production Department. Now that you've met the requirements, let me promote you right away!"
  npc_override_payon_in02_archer_i_tell_you_re_cut_57a41c: "I can tell that you're not cut out to be an Archer. It sort of feels like you're meant to do"
  npc_override_payon_in02_archer_i_understand_my_guest_if_2c4d02: "I understand. Be my guest if you want to look at the requirements."
  npc_override_payon_in02_archer_if_so_you_need_fill_797fdb: "If so, you need to fill out this application form."
  npc_override_payon_in02_archer_if_you_any_questions_fee_14c044: "If you have any questions, feel free to come and ask me."
  npc_override_payon_in02_archer_if_you_open_arrow_contai_73fe5a: "If you open the arrow container, there are arrows in it and then you can equip them."
  npc_override_payon_in02_archer_if_you_think_you_ve_c8e9ea: "If you think you've met them already, we can check that now."
  npc_override_payon_in02_archer_less_than_you_get_grade_0a2eab: "Less than 25!? You have to get a grade of at least 25! Come on, try harder!"
  npc_override_payon_in02_archer_let_s_see_1f0bb6: "let's see..."
  npc_override_payon_in02_archer_menu_apply_6b4a4c: "Apply.:Cancel"
  npc_override_payon_in02_archer_menu_grade_66b72a: " Grade S : {0} ea, Grade: {1} . "
  npc_override_payon_in02_archer_menu_grade_846221: " Grade A : {0} ea, Grade : {1} . "
  npc_override_payon_in02_archer_menu_grade_c35f13: " Grade B : {0} ea, Grade : {1} . "
  npc_override_payon_in02_archer_menu_grade_cb8844: " Grade C : {0} ea, Grade : {1} . "
  npc_override_payon_in02_archer_menu_i_baa458: "I want to be an Archer.:I need the requirements, please.:Nothing, thanks."
  npc_override_payon_in02_archer_menu_total_b9b289: "Total Grades: ^FF0000{0}^000000 / 40"
  npc_override_payon_in02_archer_menu_yes_668f8f: "Yes, I am.:No, not yet."
  npc_override_payon_in02_archer_more_than_nice_job_64c0e3: "More than 30! Nice job!"
  npc_override_payon_in02_archer_need_say_anything_else_42b3b2: "need to say anything else."
  npc_override_payon_in02_archer_nice_meet_you_how_may_e45c8c: "Nice to meet you. How may I help you?"
  npc_override_payon_in02_archer_now_off_you_go_hunt_b30281: "Now, off you go. Hunt with pride, knowing you were trained by one of the best!"
  npc_override_payon_in02_archer_now_then_637e96: "Now then,"
  npc_override_payon_in02_archer_oh_6a4011: "Oh...?"
  npc_override_payon_in02_archer_okay_sign_here_alright_u_d26f39: "Okay, sign here. Alright, um, I'll promote you once you meet the requirements."
  npc_override_payon_in02_archer_order_become_archer_you_691f48: "In order to become an Archer, you must receive a grade of at least ^0000FF25^000000 points out of 40. You can get Trunks from 'Willow,' the tree. Be careful, though. They can be tough monsters."
  npc_override_payon_in02_archer_other_than_hunter_if_you_a0edb3: "^8C2121Other than Hunter, if you are a man, you can change your job to Bard and if you are a woman, you can change your job to Dancer.^000000"
  npc_override_payon_in02_archer_reward_you_time_i_hope_2f2fe5: "reward for you this time, I hope you understand. Take care of yourself."
  npc_override_payon_in02_archer_see_you_next_time_fea506: "See you next time."
  npc_override_payon_in02_archer_sigh_well_you_just_barel_78e3c9: "*Sigh* Well, you just barely passed... Anyway, well done."
  npc_override_payon_in02_archer_so_archer_safer_real_bat_4f5389: "so an Archer is safer in a real battle."
  npc_override_payon_in02_archer_so_yeah_no_real_reason_f916cd: "So...Yeah...no real reason to tell you the requirements..."
  npc_override_payon_in02_archer_something_else_ded8a4: "something else..."
  npc_override_payon_in02_archer_um_b716d0: "Um..."
  npc_override_payon_in02_archer_unfortunately_you_didn_t_430406: "Unfortunately you didn't bring any of the required items. There's nothing for me to appraise."
  npc_override_payon_in02_archer_valhalla_been_reborn_df8050: "to Valhalla and been reborn."
  npc_override_payon_in02_archer_wait_second_you_ve_chose_4207bf: "Wait a second. You've chosen a different job already. You don't need to know this~"
  npc_override_payon_in02_archer_well_alright_ec4e13: "Well, alright."
  npc_override_payon_in02_archer_well_i_expect_hear_bette_9b2be7: "Well, I expect to hear better news from you. It's time to say goodbye."
  npc_override_payon_in02_archer_well_then_i_don_t_32ed7c: "Well then. I don't"
  npc_override_payon_in02_archer_well_you_re_right_job_22bb34: "Well, you're not at the right job level. Please check the requirements again."
  npc_override_payon_in02_archer_well_you_re_right_skill_80fff4: "Well, you're not at the right skill level."
  npc_override_payon_in02_archer_wow_more_than_009636: "Wow! More than 40!"
  npc_override_payon_in02_archer_wow_s_so_impressive_a84468: "Wow, that's so impressive!"
  npc_override_payon_in02_archer_you_a2f86b: "Are you...{0}?"
  npc_override_payon_in02_archer_you_already_your_own_dec_9744dc: "You already have your own decent job, don't you?"
  npc_override_payon_in02_archer_you_also_gather_trunks_t_e9cb4b: "You also have to gather ^FF0000Trunks^000000. There are 4 different types of Trunks, each of differing quality. You'll be given different grades for your Trunks, depending on their quality."
  npc_override_payon_in02_archer_you_d_better_learn_all_6e6cc8: "You'd better learn all the Basic Skills first before you can become an Archer."
  npc_override_payon_in02_archer_you_doing_here_03ba8a: "you doing here...?"
  npc_override_payon_in02_archer_you_don_t_look_much_0d3e65: "You don't look much like a Novice at all..."
  npc_override_payon_in02_archer_you_now_archer_a487fe: "You are now an Archer!"
  npc_override_payon_in02_archer_you_re_already_archer_yo_8138e5: "You're already an Archer. You should know these already..."
  npc_override_payon_in02_archer_you_ready_b68a42: "Are you ready?"
  npc_override_payon_in02_archer_you_right_e12152: "You are... {0}, right?"
  npc_override_payon_in02_archer_you_took_test_af2996: "You took this test"
  npc_override_payon_in02_archer_you_ve_already_become_ar_c1ef7a: "You've already become an Archer..."
  npc_override_payon_in02_archer_you_want_archer_cd3449: "Do you want to be an Archer?"
  npc_override_payon_in02_archer_your_basic_skill_now_eno_ca7f9e: "Your Basic Skill is now enough.."
  npc_override_payon_in02_archer_your_job_level_must_leas_b64032: "Your job level must be at least 10, and don't forget you should learn all of the Basic Skills. Once you've done that, come back."
  npc_override_payon_in02_archer_your_job_level_must_leas_ddbcdb: "Your job level must be at least ^4A4AFF10^000000 and your Basic Skill level should reach ^4A4AFFlevel 9"
