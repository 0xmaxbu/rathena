  npc_override_yuno_in01_quests_yuno_unfortunately_they_happe_33b5b8: "Unfortunately, they happened to abuse that great power and somehow destroyed themselves."
  npc_override_yuno_in01_quests_yuno_until_time_comes_prepare_3a0edb: "Until that time comes, prepare yourself. And stay alive."
  npc_override_yuno_in01_quests_yuno_used_part_old_book_conta_c8872f: "It used to be a part of an old book that contained a lot of ancient knowledge about Juno, but somehow, became a monster. Isn't that peculiar?"
