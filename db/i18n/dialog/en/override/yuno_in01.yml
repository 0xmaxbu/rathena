  npc_override_yuno_in01_quests_yuno_there_many_great_scienti_fd8977: "There are many great scientists in this city, but being in the top three is a true honor. Don't you agree?"
  npc_override_yuno_in01_quests_yuno_there_one_old_song_juno_bf1d8f: "There is one old song in Juno, about ^3355FF'The Doomed Sword'^000000 that you may have been looking for."
