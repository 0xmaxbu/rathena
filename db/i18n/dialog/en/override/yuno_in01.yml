  npc_override_yuno_in01_quests_yuno_well_i_think_i_ve_171695: "Well, I think I've bragged a little too much now, what can I do for you?"
  npc_override_yuno_in01_quests_yuno_well_if_you_already_know_ec1e0a: "Well, if you already know a little bit about Juno, you'd know that Juno consists of 3 islands that represent propsperity, knowledge and honor."
