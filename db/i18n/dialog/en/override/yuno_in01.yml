  npc_override_yuno_in01_quests_yuno_what_you_mean_tell_me_0fd86b: "What? You mean to tell me that the very thing I need to continue my research, the mighty Great Z, has been destroyed?!!"
  npc_override_yuno_in01_quests_yuno_whatever_i_really_didn_t_3d4b99: "Whatever, I really didn't have the necessary parts to help him anyway. I guess, either way, he would not have had a chance."
  npc_override_yuno_in01_quests_yuno_when_i_young_i_learned_9b872c: "When I was young, I learned about a legendary stamp ink related to this statue. But at the time, it made no sense to me. Just how legendary can stamp ink be?"
  npc_override_yuno_in01_quests_yuno_when_you_go_east_entranc_c90299: "When you go East from the entrance of Juno, you will find the Street of Book Stores. If you have some time, please visit ^3355FFSir Yklah^000000 who is one of 3 well-known sages in Juno."
  npc_override_yuno_in01_quests_yuno_when_you_go_north_al_0b7cae: "When you go north from Al De Baran, you will arrive at 'Elmeth Plateau,' a place covered with molten rock."
  npc_override_yuno_in01_quests_yuno_while_studying_patterns_37bc3a: "While studying patterns one day, he happened to find a magic circle that connected this world to another world."
  npc_override_yuno_in01_quests_yuno_who_me_what_kind_malicio_94be73: "Who would do this to me? What kind of malicious person would shatter a man's dreams??"
  npc_override_yuno_in01_quests_yuno_who_you_who_you_carrying_b1799f: "Who are you...? Who are you carrying this legendary item for?"
  npc_override_yuno_in01_quests_yuno_why_don_t_you_take_fd6afa: "Why don't you take it? Oh,"
  npc_override_yuno_in01_quests_yuno_woon_woon_1a42eb: "^3355FF*Woon Woon*^000000"
  npc_override_yuno_in01_quests_yuno_write_down_if_you_need_116d1f: "Write it down if you need to."
  npc_override_yuno_in01_quests_yuno_yeah_872dd3: "Yeah..."
  npc_override_yuno_in01_quests_yuno_yes_s_sort_difficult_son_c43748: "Yes, it's sort of a difficult song to understand, but it's supposed to express how Sages in ancient times feel about obtaining the doomed swords."
  npc_override_yuno_in01_quests_yuno_yklah_gave_me_idea_about_335cca: "Yklah gave me an idea about the Stamp of Muriniel you've brought, so we'll try it out as well."
