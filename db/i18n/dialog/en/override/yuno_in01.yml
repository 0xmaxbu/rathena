  npc_override_yuno_in01_quests_yuno_wagan_said_my_idea_crazy_83d394: "^FF0000Wagan^000000 said that my idea was crazy and impossible. But I am no fool, I won't be swayed by his words of mockery!"
  npc_override_yuno_in01_quests_yuno_wait_i_need_0ffb22: "Wait, I need..."
