Body:
  npc_override_yuno_in01_THQS_ChattingNPC_ahh_welcome_fellow_treas_a6c8e8: "Ahh welcome fellow Treasure Hunter {0}."
  npc_override_yuno_in01_THQS_ChattingNPC_apparently_his_name_baph_1145b0: "Apparently his name is Baphomet and he has been running around the Forest Maze out side of Prontera for quite some time now."
  npc_override_yuno_in01_THQS_ChattingNPC_did_you_hear_about_brave_8427e6: "Did you hear about that brave man that went into Glast Heim alone?! He must be crazy."
  npc_override_yuno_in01_THQS_ChattingNPC_did_you_hear_about_goat_5cd7d9: "Did you hear about that goat man running around in the trees?"
  npc_override_yuno_in01_THQS_ChattingNPC_don_t_you_something_bett_6e80f6: "{0} don't you have something better you could be doing? Like a quest."
  npc_override_yuno_in01_THQS_ChattingNPC_feel_free_become_member_ea7825: "and feel free to become a member if you wish."
  npc_override_yuno_in01_THQS_ChattingNPC_feel_free_drop_look_arou_914e7c: "Feel free to drop in and look around"
  npc_override_yuno_in01_THQS_ChattingNPC_how_may_i_help_you_cc1359: "How may I help you?"
  npc_override_yuno_in01_THQS_ChattingNPC_how_you_reading_609117: "How are you reading this???"
  npc_override_yuno_in01_THQS_ChattingNPC_membership_applications_7cbccc: "For membership applications please talk to Keegan"
  npc_override_yuno_in01_THQS_ChattingNPC_menu_well_3f8034: "Well unless you are reading the code :)"
  npc_override_yuno_in01_THQS_ChattingNPC_oh_man_i_am_so_890b1e: "Oh man...I am so sick of"
  npc_override_yuno_in01_THQS_ChattingNPC_ok_saved_thank_you_see_f8d544: "Ok, saved. Thank you ~ See you soon~"
  npc_override_yuno_in01_THQS_ChattingNPC_sorry_members_only_606b5e: "Sorry, members only."
  npc_override_yuno_in01_THQS_ChattingNPC_trading_mr_smile_masks_c_198174: "trading Mr. Smile masks for crap."
  npc_override_yuno_in01_THQS_ChattingNPC_treasure_hunter_guild_ho_80866f: "^FF0000[ Treasure Hunter Guild House ]^000000"
  npc_override_yuno_in01_THQS_ChattingNPC_umm_sorry_i_m_gonna_b63646: "Umm sorry I'm not gonna waste my time talking to you if you aren't even a member!"
  npc_override_yuno_in01_THQS_ChattingNPC_up_stairs_down_hall_1c0cc7: "up the stairs and down the hall."
  npc_override_yuno_in01_THQS_ChattingNPC_welcome_treasure_hunter_8ce2ec: "Welcome to The Treasure Hunter Guild."
  npc_override_yuno_in01_THQS_ChattingNPC_welcome_treasure_hunter_9832cd: "Welcome to the Treasure Hunter's Guild House."
  npc_override_yuno_in01_THQS_ChattingNPC_well_if_you_think_you_6365a3: "Well if you think you are safe, good on you."
  npc_override_yuno_in01_THQS_ChattingNPC_you_ask_me_one_you_6c203e: "You ask me for one and you'll find yourself 10 pounds lighter!"
  npc_override_yuno_in01_THQS_GuildNPC_alright_come_back_when_y_a09735: "Alright come back when you have the free time to spare."
  npc_override_yuno_in01_THQS_GuildNPC_also_now_you_member_feel_1408dc: "Also now that you are a member feel free to use our shops anytime you wish.They are all located on this floor."
  npc_override_yuno_in01_THQS_GuildNPC_congratulations_36b252: "Congratulations!"
  npc_override_yuno_in01_THQS_GuildNPC_ha_ha_ha_you_already_111c10: "Ha ha ha...you are already a member."
  npc_override_yuno_in01_THQS_GuildNPC_hmmm_you_don_t_seem_8d6eda: "Hmmm you don't seem to have ^FF000025,000z^000000 {0}. Please come back when you do."
  npc_override_yuno_in01_THQS_GuildNPC_i_m_sorry_only_members_7fb453: "I'm sorry only members may visit our private shop."
  npc_override_yuno_in01_THQS_GuildNPC_sorry_you_must_member_tr_3bb4cd: "Sorry you must be a member of the Treasure Hunter Guild if you wish to take a quest."
  npc_override_yuno_in01_THQS_GuildNPC_umm_well_all_you_need_29db2d: "Umm... Well that is all you need to do. Hahaha."
  npc_override_yuno_in01_THQS_GuildNPC_we_also_another_shop_mem_7f80bf: "We also have another shop for members only,in which we use little metal diamonds called Treasure Hunter Tokens to exchange for rare goods."
  npc_override_yuno_in01_THQS_GuildNPC_welcome_guild_treasure_h_ba9106: "Welcome to the Guild of Treasure Hunters."
  npc_override_yuno_in01_THQS_GuildNPC_well_if_you_t_afford_bd7a9d: "Well if you can't afford a small ^FF000025,000z^000000 you shouldn't be a Treasure Hunter yet."
  npc_override_yuno_in01_THQS_GuildNPC_well_if_you_want_treasur_f5bd49: "Well {0} if you want to be a Treasure Hunter first you must."
  npc_override_yuno_in01_THQS_GuildNPC_well_if_you_wish_take_8b19a3: "Well {0} if you wish to take a quest go talk to the fellow Treasure Hunter in the other room there."
  npc_override_yuno_in01_THQS_GuildNPC_what_brings_you_here_som_bb1b7d: "What brings you here? Have something to say?"
  npc_override_yuno_in01_THQS_GuildNPC_yes_i_take_you_our_dea8b9: "Yes {0} I will take you to our shop right away!"
  npc_override_yuno_in01_THQS_GuildNPC_you_even_access_our_excl_cbdafd: "You will even have access to our exclusive personal Dungeon."
  npc_override_yuno_in01_THQS_GuildNPC_you_may_now_take_treasur_0e6532: "You may now take a Treasure Hunting Quest as you see fit."
  npc_override_yuno_in01_THQS_GuildNPC_you_well_changed_z_basic_bbdad1: "^FF00001.^000000 You well be changed ^FF000025,000z^000000 for basic training and your proof of being a member."
  npc_override_yuno_in01_quests_yuno_a_511348: "A..."
  npc_override_yuno_in01_quests_yuno_acorn_486a64: "^3355FF10 Acorn^000000 and"
  npc_override_yuno_in01_quests_yuno_acorn_4b0539: "10 Acorn..."
  npc_override_yuno_in01_quests_yuno_acorn_9b1e8f: "^3355FF10 Acorn^000000, and"
  npc_override_yuno_in01_quests_yuno_addition_you_79c0f6: "In addition to this, you "
  npc_override_yuno_in01_quests_yuno_after_you_lose_some_weig_0f3785: "- after you lose some weight. -"
  npc_override_yuno_in01_quests_yuno_afterwards_he_then_took_32e423: "^3355FFAfterwards, he then took a strangely shaped capsule from his pocket, sprinkled some liquid from it, and began to chant a spell...^000000"
  npc_override_yuno_in01_quests_yuno_ahhh_success_0d7f14: "AHHH, it is a success!"
  npc_override_yuno_in01_quests_yuno_as_i_thinking_how_wonder_c9fa8a: "As I was thinking of how wonderfully poetic that image was, that paper suddenly attacked me! Me, one of Juno's greatest Sages!"
  npc_override_yuno_in01_quests_yuno_as_one_three_i_serve_f25473: "As one of the three, I will serve as one of your guides in this part of your journey for the doomed sword."
  npc_override_yuno_in01_quests_yuno_as_you_already_possess_s_bc8b7d: "As you already possess the Stamp of Muriniel, I am more than willing to help you."
  npc_override_yuno_in01_quests_yuno_believing_people_obstacl_42c2db: "Believing that people were obstacles to his study of patterns, he lived in seclusion, studying alone."
  npc_override_yuno_in01_quests_yuno_brigan_df5d20: "^3355FF2 Brigan^000000 and"
  npc_override_yuno_in01_quests_yuno_bring_me_b31d0b: "Bring me..."
  npc_override_yuno_in01_quests_yuno_bring_them_me_again_hehe_2ce1cf: "bring them to me again. Heheheh."
  npc_override_yuno_in01_quests_yuno_burnt_tree_coal_4b4a9a: "^FF00005 Burnt Tree^000000 , ^FF00005 Coal^000000,"
  npc_override_yuno_in01_quests_yuno_bzzzt_0d3bf2: "^3355FF*Bzzzt!*"
  npc_override_yuno_in01_quests_yuno_bzzzzzzt_5b55e2: "*Bzzzzzzt--*^000000"
  npc_override_yuno_in01_quests_yuno_calm_down_f71999: "To calm down..."
  npc_override_yuno_in01_quests_yuno_case_you_384499: "In case you"
  npc_override_yuno_in01_quests_yuno_chime_bell_across_valley_e91ac0: "'The chime of the bell from across the valley cannot be held in your hand.'"
  npc_override_yuno_in01_quests_yuno_circle_totally_different_123df8: "That circle was totally different from ones used by Mages, Wizards or sages. This pattern had the power to summon an evil creature from the other world."
  npc_override_yuno_in01_quests_yuno_claw_desert_wolf_826b0f: "^3355FF3 Claw of Desert Wolf^000000"
  npc_override_yuno_in01_quests_yuno_click_click_41e728: "*Click Click*^000000"
  npc_override_yuno_in01_quests_yuno_click_d38d7f: "^3355FF*Click*"
  npc_override_yuno_in01_quests_yuno_course_my_research_priva_c22480: "Of course, my research is private and confidential. But is there anything I can do for you?"
  npc_override_yuno_in01_quests_yuno_crank_crank_005aba: "^3355FF*Crank Crank*^000000"
  npc_override_yuno_in01_quests_yuno_currently_you_re_carryin_73594b: "- Currently you're carrying -"
  npc_override_yuno_in01_quests_yuno_day_age_we_f3b0fe: "in this day and age. We would be"
  npc_override_yuno_in01_quests_yuno_decayed_nail_1021ef: "^3355FF5 Decayed Nail^000000."
  npc_override_yuno_in01_quests_yuno_decayed_nail_4f717c: "5 Decayed Nail..."
  npc_override_yuno_in01_quests_yuno_direction_compass_pointi_17c340: "^3355FFIn the direction the compass is pointing, some words are engraved...^000000"
  npc_override_yuno_in01_quests_yuno_doo_de_doo_de_dah_6bacb1: "Doo de doo de~ Dah dah dah Dan dan dan Dah dah dah! Nu ha nu ha nu hahaha... Moo hee moo hee moo hee~"
  npc_override_yuno_in01_quests_yuno_even_if_you_re_running_e31f4e: "'Even if you're running toward a light on the other side of the mist, you can't reach it.'"
  npc_override_yuno_in01_quests_yuno_even_though_i_am_one_0b3d8b: "Even though I am one of the three great Sages of Juno, I've never even seen this item before."
  npc_override_yuno_in01_quests_yuno_even_though_i_ve_learned_f096aa: "But even though I've learned how to make this special stamping ink, it is too difficult for me to collect the materials that are necessary to create it."
  npc_override_yuno_in01_quests_yuno_expect_great_things_youn_1d33fb: "Expect great things, young friend. Muahahahha."
  npc_override_yuno_in01_quests_yuno_feat_i_don_t_know_312377: "this feat. I don't know how"
  npc_override_yuno_in01_quests_yuno_fine_sand_rough_elunium_82265f: "^FF00005 Fine Sand^000000, ^FF00003 Rough Elunium^000000,"
  npc_override_yuno_in01_quests_yuno_forgot_these_df0472: "forgot, these are the"
  npc_override_yuno_in01_quests_yuno_genius_you_say_how_you_ecd872: "A genius you say? How can you say that in a city full of wise men? That's nothing special."
  npc_override_yuno_in01_quests_yuno_gm_0a4a58: "GM?"
  npc_override_yuno_in01_quests_yuno_go_bring_323e68: "and go bring..."
  npc_override_yuno_in01_quests_yuno_godspeed_47ebed: "Godspeed."
  npc_override_yuno_in01_quests_yuno_good_luck_cf5d5e: "Good Luck..."
  npc_override_yuno_in01_quests_yuno_good_s_everything_200fde: "Good, that's everything!"
  npc_override_yuno_in01_quests_yuno_good_work_now_while_i_6c2d6a: "Good work. Now, while I make the body of the compass, you can go and bring me the rest of the items I'll need."
  npc_override_yuno_in01_quests_yuno_grateful_your_assistance_bd7075: "grateful for your assistance."
  npc_override_yuno_in01_quests_yuno_great_sages_juno_helped_fb935e: "The great Sages in Juno have helped me to install this magical system in my cottage to leave my message to you, adventurer in the future."
  npc_override_yuno_in01_quests_yuno_grooves_547ee1: "in the grooves .^000000"
  npc_override_yuno_in01_quests_yuno_h_he_said_i_should_82a2d3: "H-he said I should rename my invention to 'Lame Z?' *Sniff* I... I don't believe it... *Sob*"
  npc_override_yuno_in01_quests_yuno_ha_ha_ha_88fbe9: "Ha! Ha! Ha!"
  npc_override_yuno_in01_quests_yuno_hahaha_92a828: "Hahaha...!"
  npc_override_yuno_in01_quests_yuno_haooooh_2418a5: "Haooooh..."
  npc_override_yuno_in01_quests_yuno_he_able_tell_you_more_ba3f46: "He will be able to tell you more about where to use this stamp. However, be careful. He is the most fastidious sage among all of us."
  npc_override_yuno_in01_quests_yuno_he_only_sees_me_as_90a137: "He only sees me as an assistant and is going to steal all the credit for our discoveries?!"
  npc_override_yuno_in01_quests_yuno_he_s_justifying_his_beha_f8bc04: "And he's justifying his behavior under the excuse of research! He's a crazy fellow who's taken it too far!"
  npc_override_yuno_in01_quests_yuno_he_s_talkative_so_if_b5d593: "He's talkative, so if you approach him, he'll tell you all you need to know."
  npc_override_yuno_in01_quests_yuno_he_then_ground_red_herbs_5ae7f4: "^3355FFHe then ground the red herbs and placed them into the stone mold.^000000"
  npc_override_yuno_in01_quests_yuno_he_thinks_i_owe_him_0be059: "He thinks that I owe him an apology?! For what? Why should I apologize...?!"
  npc_override_yuno_in01_quests_yuno_heh_heh_s_right_making_6a1879: "Heh heh. That's right, making the Compass of Muriniel will be my test for you."
  npc_override_yuno_in01_quests_yuno_heh_you_don_t_look_f4e529: "Heh, you don't look like much. But even though you're ordinary looking, you possess the legendary item!"
  npc_override_yuno_in01_quests_yuno_here_items_we_02b83b: "Here are the items that we will be"
  npc_override_yuno_in01_quests_yuno_hm_701c55: "Hm...?"
  npc_override_yuno_in01_quests_yuno_hm_metto_said_he_doesn_ca01d7: "Hm? Metto said that he doesn't need my Riding Engine theory?! Hmpf, what an ingrate!"
  npc_override_yuno_in01_quests_yuno_hmm_9c4d28: "Hmm..."
  npc_override_yuno_in01_quests_yuno_hmm_e777ce: "Hmm?"
  npc_override_yuno_in01_quests_yuno_hmm_good_job_you_brought_0e62df: "Hmm! Good job, you brought all of the items. Try inserting them in the grooves."
  npc_override_yuno_in01_quests_yuno_hmmm_2ac89c: "Hmmm..."
  npc_override_yuno_in01_quests_yuno_hmmm_i_admire_your_zeal_975ef0: "Hmmm... I admire your zeal, but how do you expect to accomplish anything without a plan?"
  npc_override_yuno_in01_quests_yuno_hold_just_second_19b3a0: "Hold on for just a second!"
  npc_override_yuno_in01_quests_yuno_honest_i_thought_about_b_f37558: "To be honest, I thought about it before, but this is the first time that I'll actually try this experiment. Go ahead, I want to see what happens!"
  npc_override_yuno_in01_quests_yuno_hope_7b0065: "have hope!"
  npc_override_yuno_in01_quests_yuno_how_depressing_681ad1: "^3355FFHow depressing!^000000"
  npc_override_yuno_in01_quests_yuno_how_goes_your_work_metto_9a64d4: "How goes your work with Metto? Hopefully the plan is going well. I'm sorry to bother you with such a task."
  npc_override_yuno_in01_quests_yuno_how_happen_times_row_its_79244e: "How can this happen 3 times in a row? Its true, the Gods have forsaken me! I'm ruined... RUINED!!!"
  npc_override_yuno_in01_quests_yuno_how_you_plan_go_about_619d37: "But how do you plan to go about doing this? I'm guessing it's harder than it sounds..."
  npc_override_yuno_in01_quests_yuno_however_s_my_job_test_3713c8: "However, it's my job to test whether or not you are truly qualified to possess it."
  npc_override_yuno_in01_quests_yuno_however_you_must_first_p_bae9f0: "However, you must first prove that you are qualified to wield the great power of the doomed sword."
  npc_override_yuno_in01_quests_yuno_huh_piece_seems_fit_stam_ab90b9: "Huh?! That piece seems to fit to the stamp you have. Why don't you try joining them together?"
  npc_override_yuno_in01_quests_yuno_i_am_interested_research_35af6a: "I am interested in researching artificial intelligence. You know, like robots."
  npc_override_yuno_in01_quests_yuno_i_am_one_scientists_city_f0f5e7: "I am one of the scientists in this city. My name is Stangckle."
  npc_override_yuno_in01_quests_yuno_i_am_scientist_artificia_36979b: "I am a scientist of Artificial Intelligence and Robotics."
  npc_override_yuno_in01_quests_yuno_i_am_scientist_researchi_a50a06: "I am a scientist researching all sorts of things."
  npc_override_yuno_in01_quests_yuno_i_believe_he_may_take_e9e566: "I believe he may take some special interest in the Stamp you are carrying."
  npc_override_yuno_in01_quests_yuno_i_better_get_going_check_c80748: "I better get going to check this new thing out. What are you still doing here? I'll be leaving in a bit."
  npc_override_yuno_in01_quests_yuno_i_d_like_you_bring_db7c6f: "I'd like you to bring the slate to Snotora, the island of knowledge, that is a part of Juno. You will find a Statue of the Goddess Snotora somewhere on the island."
  npc_override_yuno_in01_quests_yuno_i_don_t_any_need_7d9aa4: "I don't have any need for this."
  npc_override_yuno_in01_quests_yuno_i_don_t_know_if_ea68fc: "I don't know if we can do anything else,"
  npc_override_yuno_in01_quests_yuno_i_don_t_specific_project_2ade5e: "I don't have a specific project right now, but my latest creation, the 'Great Z,' is truly a product of sheer and utter genius."
  npc_override_yuno_in01_quests_yuno_i_don_t_understand_what_020a1f: "I don't understand what you're talking about. But there's an ancient Juno song about this GM you speak of..."
  npc_override_yuno_in01_quests_yuno_i_faith_you_you_should_9c81ec: "I have faith in you. You should know that he believes in fate. Use that to your advantage."
  npc_override_yuno_in01_quests_yuno_i_feel_much_better_knowi_50f840: "I feel much better knowing you will take care of this little problem..."
  npc_override_yuno_in01_quests_yuno_i_got_idea_historical_le_3f057f: "I got the idea from a historical legend. I figure that if it's been done before, this project is definitely possible."
  npc_override_yuno_in01_quests_yuno_i_guess_if_stangckle_doe_4bac75: "I guess if Stangckle doesn't want to help me, he can have it his way. I must continue my research, whether or not he helps me."
  npc_override_yuno_in01_quests_yuno_i_half_mind_teach_him_2628d6: "I have half a mind to teach him a little something about true science and intelligent research."
  npc_override_yuno_in01_quests_yuno_i_hereby_grant_you_colum_d06a2a: "^3355FFI hereby grant you this column of light. The Three Sages of Juno will be your guide^000000."
  npc_override_yuno_in01_quests_yuno_i_hope_you_bring_me_b4192b: "I hope you will bring me what I need to make the 'Stamp of Muriniel' ink soon."
  npc_override_yuno_in01_quests_yuno_i_if_my_invention_no_3c776e: "I-If my invention is no good, then I guess I should destroy my Great Z... *sigh*"
  npc_override_yuno_in01_quests_yuno_i_know_i_ve_disappointed_d4eb62: "I know I've disappointed you, but please, forget all about me."
  npc_override_yuno_in01_quests_yuno_i_know_very_difficult_fe_7da17b: "I know it a very difficult feat to accomplish, but where there's a will, there's a way."
  npc_override_yuno_in01_quests_yuno_i_know_you_seek_more_380e2f: "I know that you seek more power by obtaining a doomed sword. But not just anyone can handle the might of a doomed sword."
  npc_override_yuno_in01_quests_yuno_i_m_glad_honest_trustwor_4fbea3: "I'm glad that an honest, trustworthy person such as yourself had the guts to tell me. Thank you."
  npc_override_yuno_in01_quests_yuno_i_m_going_ask_my_e4e889: "I'm going to ask my colleague ^FF0000Stangckle^000000 to help me. I am sure he will be more than willing to help out an old friend."
  npc_override_yuno_in01_quests_yuno_i_m_sure_people_juno_1ff096: "I'm sure the people of Juno are very thankful. Here is a little token of our appreciation..."
  npc_override_yuno_in01_quests_yuno_i_m_sure_you_know_1a560a: "I'm sure that you know our city has been living off our research for many years."
  npc_override_yuno_in01_quests_yuno_i_m_tired_i_think_ef08d6: "I'm tired of this. I think that the time has come for me to give up. It's all over. Please don't be too disappointed..."
  npc_override_yuno_in01_quests_yuno_i_need_dbca4d: "I will need..."
  npc_override_yuno_in01_quests_yuno_i_need_get_ready_you_8247a2: "I need to get ready! You go ahead and take off, I'll be going out soon."
  npc_override_yuno_in01_quests_yuno_i_needed_thank_you_so_ef6708: "that I needed. Thank you so much."
  npc_override_yuno_in01_quests_yuno_i_now_51f9cc: "I do now?!"
  npc_override_yuno_in01_quests_yuno_i_remember_watching_harm_5f4b15: "I remember watching a harmless"
  npc_override_yuno_in01_quests_yuno_i_shall_give_you_item_5cdd91: "I shall give you an item that promises you of the quest I will give you in the future. Return to this place when the trees begin to shed their leaves..."
  npc_override_yuno_in01_quests_yuno_i_shudder_think_what_hap_b5a42a: "And I shudder to think what would happen if such power were to fall into evil hands. The test I have prepared cannot begin until Autumn follows a hot summer."
  npc_override_yuno_in01_quests_yuno_i_still_5e86be: "I still"
  npc_override_yuno_in01_quests_yuno_i_t_believe_my_eyes_655d34: "...I can't believe my eyes! Only a chosen few can possess the Stamp of Muriniel..."
  npc_override_yuno_in01_quests_yuno_i_think_s_all_i_67e11b: "I think that's all I need. Anyway, I believe that gathering these items shouldn't be a difficult task for you. Good luck to you."
  npc_override_yuno_in01_quests_yuno_i_think_we_need_someone_9db71b: "I think we need someone a bit harsher to help us out. I think it would be a little too much for a Novice."
