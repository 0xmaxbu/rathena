  npc_override_yuno_in01_quests_yuno_strong_adventurer_6dbdfe: "a strong adventurer"
  npc_override_yuno_in01_quests_yuno_suddenly_stamp_muriniel_21b23d: "^3355FFSuddenly, the Stamp of Muriniel and the Compass of Muriniel break open to reveal a small, shining object.^000000"
