  npc_override_yuno_in01_quests_yuno_stamp_muriniel_f58b3f: "Can it be the Stamp of Muriniel?"
  npc_override_yuno_in01_quests_yuno_stamp_muriniel_what_surp_c0c172: "The ^3355FFStamp of Muriniel^000000? What a surprise!"
  npc_override_yuno_in01_quests_yuno_stamping_ink_muriniel_be_d4fc5d: "^3355FFThe Stamping Ink of Muriniel has been created, and has been given to you by the sage Syklah.^000000"
  npc_override_yuno_in01_quests_yuno_stone_49555e: "^3355FF5 Stone^000000 and"
  npc_override_yuno_in01_quests_yuno_stone_heart_104837: "^3355FF1 Stone Heart^000000."
  npc_override_yuno_in01_quests_yuno_stone_heart_used_as_bott_202a55: "The Stone Heart will be used as a bottle to hold this special ink."
  npc_override_yuno_in01_quests_yuno_stories_i_ve_been_told_761818: "From the stories that I've been told by great Sages, I've figured exactly which items you'll need to place into those grooves."
  npc_override_yuno_in01_quests_yuno_strong_adventurer_6dbdfe: "a strong adventurer"
  npc_override_yuno_in01_quests_yuno_suddenly_stamp_muriniel_21b23d: "^3355FFSuddenly, the Stamp of Muriniel and the Compass of Muriniel break open to reveal a small, shining object.^000000"
  npc_override_yuno_in01_quests_yuno_supposedly_he_s_pretty_d_07f720: "Supposedly, he's pretty dangerous, and is always immersing himself in some kind of research."
  npc_override_yuno_in01_quests_yuno_thank_you_helping_me_out_092509: "Thank you for helping me out."
  npc_override_yuno_in01_quests_yuno_thank_you_letting_me_kno_4598d3: "Thank you for letting me know. I know it wasn't easy to tell me."
  npc_override_yuno_in01_quests_yuno_thank_you_your_help_beca_e0caf1: "Thank you for your help. Because of your work in ridding us of Metto, we have one less worry."
  npc_override_yuno_in01_quests_yuno_thanks_offer_i_don_t_6a58c3: "Thanks for the offer, but I don't think this is something that you could do..."
  npc_override_yuno_in01_quests_yuno_there_juno_tradition_whi_d91878: "There is a Juno tradition in which the three best Sages are chosen to represent each of Juno's islands."
  npc_override_yuno_in01_quests_yuno_there_many_great_scienti_8511e3: "There are many great scientists here, but being in the top three is a true honor, wouldn't you agree?"
  npc_override_yuno_in01_quests_yuno_there_many_great_scienti_fd8977: "There are many great scientists in this city, but being in the top three is a true honor. Don't you agree?"
  npc_override_yuno_in01_quests_yuno_there_one_old_song_juno_bf1d8f: "There is one old song in Juno, about ^3355FF'The Doomed Sword'^000000 that you may have been looking for."
  npc_override_yuno_in01_quests_yuno_there_s_finished_2b8b20: "There, it's finished."
  npc_override_yuno_in01_quests_yuno_there_those_few_bad_appl_4c0ff0: "But there are those few bad apples that just drive me crazy..."
  npc_override_yuno_in01_quests_yuno_they_gathered_all_necess_bf5f87: "they gathered all the necessary materials...."
  npc_override_yuno_in01_quests_yuno_things_around_here_seem_070d9b: "Things around here seem much more peaceful without that Metto around. Thanks for your help."
  npc_override_yuno_in01_quests_yuno_think_i_really_respected_951e67: "And to think, I really respected that traitor! I can't even stand to see that guy's face anymore."
  npc_override_yuno_in01_quests_yuno_through_air_fb058d: "through the air..."
  npc_override_yuno_in01_quests_yuno_time_we_created_c1f19e: "but this time we have created"
  npc_override_yuno_in01_quests_yuno_time_we_created_c47f08: "but this time we have created {0}"
  npc_override_yuno_in01_quests_yuno_too_many_items_you_fc968e: "- too many items with you. -"
  npc_override_yuno_in01_quests_yuno_tooth_bat_e28ff8: "^3355FF10 Tooth of Bat^000000"
  npc_override_yuno_in01_quests_yuno_top_mountain_connected_p_338f55: "On the top of a mountain connected to the plateau, you can find a bridge which leads you to this place!, ^3355FFJuno,^000000 the city of Sages."
  npc_override_yuno_in01_quests_yuno_true_metto_doesn_t_think_cd6cbe: "Is that true?? Metto doesn't think of me as a colleague, but still wants me to help him?!"
