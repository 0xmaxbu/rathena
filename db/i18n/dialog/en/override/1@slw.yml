Body:
  npc_override_1@slw_WernerLaboratoryCentralRoom_about_central_room_i_am_bc6c2a: "About the central room, {0} I am counting on you!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_according_design_drawing_fa8999: "According to the design drawing, this part is connected to the central room... But I only see a suspicious gate."
  npc_override_1@slw_WernerLaboratoryCentralRoom_after_activating_gate_we_b2199b: "After activating the gate, we have to guard it from outside."
  npc_override_1@slw_WernerLaboratoryCentralRoom_after_looking_around_her_1d4ae7: "After looking around here, what do you think?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_after_moment_i_divided_s_f63cb3: "After this moment, ^4d4dffI will be divided and scattered.^000000 again."
  npc_override_1@slw_WernerLaboratoryCentralRoom_after_transplanting_dumm_14f538: "After transplanting the dummy of Ymir's Heart, the body could not endure the power and eventually collapsed."
  npc_override_1@slw_WernerLaboratoryCentralRoom_ah_8011cc: ".. Ah..."
  npc_override_1@slw_WernerLaboratoryCentralRoom_ah_s_right_9771bc: "Ah~. That's right."
  npc_override_1@slw_WernerLaboratoryCentralRoom_all_i_now_strong_transfe_712bde: "All I have now is the strong will to transfer something on and on."
  npc_override_1@slw_WernerLaboratoryCentralRoom_all_you_want_say_41b79f: "Is that all you want to say?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_already_activated_d7dd60: "It is already activated."
  npc_override_1@slw_WernerLaboratoryCentralRoom_although_scrap_s_heart_f_4107e1: "Although it is a scrap, it's the heart fragment of Ymir."
  npc_override_1@slw_WernerLaboratoryCentralRoom_any_case_energy_goes_int_0c2353: "In any case, the energy goes into the experimental subject... Using that power, I've adjusted their time."
  npc_override_1@slw_WernerLaboratoryCentralRoom_anyway_you_dead_meat_93f7db: "A... anyway, you are dead meat."
  npc_override_1@slw_WernerLaboratoryCentralRoom_aren_t_you_curious_about_b90716: "Aren't you curious about it?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_as_eisen_said_s_no_ff55f4: "As Eisen said, it's no longer important whether I'm Seyren or not."
  npc_override_1@slw_WernerLaboratoryCentralRoom_beeee_prepared_48c74c: "Beeee prepared!!!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_beyond_wall_there_someth_1c8624: "Beyond this wall, there will be something you have come to obtain."
  npc_override_1@slw_WernerLaboratoryCentralRoom_cannot_compared_imitatio_d48dc5: "It cannot be compared to an imitation."
  npc_override_1@slw_WernerLaboratoryCentralRoom_cannot_progress_quest_be_044ff3: "- Cannot progress with quest because you have too many items in your possession. -"
  npc_override_1@slw_WernerLaboratoryCentralRoom_case_we_use_expression_s_33f5cd: "In that case, we use an expression such as this."
  npc_override_1@slw_WernerLaboratoryCentralRoom_certainly_some_them_get_7ee68f: "... Certainly, some of them get killed due to chapped cells. Ha ha!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_certainly_you_ll_die_her_e7bff9: "Certainly. You'll die here."
  npc_override_1@slw_WernerLaboratoryCentralRoom_chairman_i_mean_person_o_81a58a: "The chairman... I mean, that person is obsessed with the past."
  npc_override_1@slw_WernerLaboratoryCentralRoom_change_blue_red_s_389ef2: "And change ^4d4dffblue^000000 to ^ff0000red^000000. That's it."
  npc_override_1@slw_WernerLaboratoryCentralRoom_change_red_blue_789edd: "Change ^ff0000red^000000 to ^4d4dffblue^000000."
  npc_override_1@slw_WernerLaboratoryCentralRoom_continuous_division_crea_02260f: "The continuous division created countless copies of myself."
  npc_override_1@slw_WernerLaboratoryCentralRoom_damn_b323b7: "Damn!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_damn_werner_why_did_you_a33b80: ".. Damn Werner. Why did you mix me with a wolf?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_dang_how_did_you_get_3d9886: ".. Dang, how did you get in here?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_device_been_initialized_57ce04: "The device has been initialized."
  npc_override_1@slw_WernerLaboratoryCentralRoom_did_you_enjoy_my_work_6f0447: "Did you enjoy my work?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_die_here_me_7d2640: "Die here? Me?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_don_t_you_remember_how_9a2846: "Don't you remember how much I struggled to bring you here out of that hell?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_during_process_its_memor_c7c63c: "During that process, its memory, consciousness, soul, mind and ego were all scattered like sand. They became meaningless."
  npc_override_1@slw_WernerLaboratoryCentralRoom_easier_than_you_thought_0e841f: "Easier than you thought?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_eisen_right_seyren_winds_6ea542: "Eisen is right. ^4d4dffSeyren Windsor is no longer in this world.^000000"
  npc_override_1@slw_WernerLaboratoryCentralRoom_eisen_werner_205af0: "... Eisen Werner."
  npc_override_1@slw_WernerLaboratoryCentralRoom_eisen_werner_let_me_ask_254508: "... Eisen Werner. Let me ask you again. Is it the end of your will?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_eisen_you_abandoned_ever_59cbbe: "... Eisen. You have abandoned everything like this."
  npc_override_1@slw_WernerLaboratoryCentralRoom_end_your_12dc3c: "...... Is it the end of your will?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_energy_extracted_flows_i_fb5b18: "The energy extracted from this flows into the magic circle on the ground... Ha ha ha. Of course, this magic circle has been reinterpreted magically."
  npc_override_1@slw_WernerLaboratoryCentralRoom_enter_now_2c6c87: "Enter now."
  npc_override_1@slw_WernerLaboratoryCentralRoom_event_proceeded_memorial_e6d841: "^4d4dffThis event is proceeded to the Memorial."
  npc_override_1@slw_WernerLaboratoryCentralRoom_fellow_among_delegation_60d72c: "This fellow was among the delegation of that silly royal family."
  npc_override_1@slw_WernerLaboratoryCentralRoom_fools_kingdom_cannot_eve_f048f3: "... The fools in the kingdom cannot even utilize the power they already have."
  npc_override_1@slw_WernerLaboratoryCentralRoom_forget_your_duty_seyren_a52def: "Do not forget your duty, Seyren."
  npc_override_1@slw_WernerLaboratoryCentralRoom_gate_malfunctioning_now_7984b8: "The gate is malfunctioning now. It's dangerous like this ..."
  npc_override_1@slw_WernerLaboratoryCentralRoom_gate_now_activated_865b3b: "The gate is now activated."
  npc_override_1@slw_WernerLaboratoryCentralRoom_go_07415e: "Go in."
  npc_override_1@slw_WernerLaboratoryCentralRoom_great_now_i_got_bf6c7a: "Great, now I got it."
  npc_override_1@slw_WernerLaboratoryCentralRoom_great_see_you_end_84f058: "It was great to see you at the end."
  npc_override_1@slw_WernerLaboratoryCentralRoom_great_turning_point_vivo_a4d018: "It was a great turning point for the In Vivo Experiments."
  npc_override_1@slw_WernerLaboratoryCentralRoom_guy_stopped_now_616c25: "That guy has stopped now."
  npc_override_1@slw_WernerLaboratoryCentralRoom_haha_they_let_us_open_5b49dc: "Haha, they let us open the gate of the central room!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_he_activate_gate_central_c4b628: "He will activate the gate to the central room."
  npc_override_1@slw_WernerLaboratoryCentralRoom_heart_fragment_ymir_hold_dc1660: "It is the heart fragment of Ymir that holds the fundamental power to constitute the world. It also holds the origin of life."
  npc_override_1@slw_WernerLaboratoryCentralRoom_here_comes_main_characte_17f0bf: "Here comes the main character."
  npc_override_1@slw_WernerLaboratoryCentralRoom_hey_baby_you_t_me_a473b1: "Hey, baby? You can't do this to me."
  npc_override_1@slw_WernerLaboratoryCentralRoom_hmm_e777ce: "Hmm?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_hmm_i_see_s_way_94d8e4: "Hmm, I see. That's the way to operate it."
  npc_override_1@slw_WernerLaboratoryCentralRoom_hmm_s_because_you_re_49550e: "Hmm, that's because you're going to die here anyway."
  npc_override_1@slw_WernerLaboratoryCentralRoom_honestly_i_m_impressed_i_843287: "Honestly, I'm impressed. I never expected you would come all the way here."
  npc_override_1@slw_WernerLaboratoryCentralRoom_how_dare_you_come_you_1037ea: "How dare you come in! You're so brave!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_how_many_copies_myself_b_836837: "How many copies of myself have been created so far?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_how_you_like_gift_i_de0d78: "How do you like the gift I've prepared?!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_huge_sensation_458ee2: "With a huge sensation."
  npc_override_1@slw_WernerLaboratoryCentralRoom_huhuhuhuhu_810600: "Huhuhuhuhu...."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_am_here_d7c94a: "I am here."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_asked_him_whether_he_c3092f: "I asked him whether he knows the paths here, and his answer was yes. So I brought him here."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_don_t_need_loser_8c90fb: "I don't need a loser either."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_feel_like_i_ve_30a83e: "I feel like I've woken up from a long sleep."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_feel_like_i_ve_45e174: "I feel like I've woken up from a long sleep. Maybe it was for this day."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_guard_gate_central_roo_76dd23: "I will have to guard the gate of the central room again."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_guide_you_c793cc: "I will guide you."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_haven_t_been_waiting_7ae13e: "I haven't been waiting with empty hands."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_know_you_ve_come_43d935: "I know you've come here for the affair of Rune-Midgarts kingdom."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_lost_ego_after_continu_5014d1: "I lost the ego after continuous division, but was regenerated as the previous shape. I don't think it was a coincidence."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_lucky_show_my_last_83a257: "I was lucky to show my last will in front of you."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_mean_if_only_he_c3dcae: "I mean, if only he stopped..."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_never_expected_0620fc: "I never expected this!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_never_imagined_done_al_9654c3: "I never imagined that it would be done all of a sudden like this."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_realized_after_looking_84af76: "And I realized it after looking at ^4d4dffTerra Gloria^000000."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_really_don_t_more_cffc61: "I really don't have more time."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_sent_silly_guys_back_318daf: "I sent the silly guys back to start over."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_thought_there_must_bee_06a588: "I thought there must have been a reason."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_told_you_i_d_a0d386: "I told you I'd prepared a gift."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_trying_apply_many_kind_b536e4: "I was trying to apply it to many kinds of stuff."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_ve_been_waiting_you_702ea7: "I've been waiting for you for a long time. As Eisen said, it's no longer important whether I'm Seyren or not."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_ve_been_waiting_you_d17c1e: "I've been waiting for you for a long time."
  npc_override_1@slw_WernerLaboratoryCentralRoom_i_ve_given_up_saving_c15b5b: "I've given up saving this laboratory anyway."
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_only_kid_had_gone_2bfd91: "If only that kid had gone back, he would not have ended that way..."
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_there_gate_already_be_ec9a6d: "If there is a gate that has already been activated, you can see it."
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_time_goes_biologicall_b3b53e: "If time goes biologically, it means someone gets older."
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_you_entering_now_i_d71a39: "If you are entering now, I will activate the gate."
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_you_looked_my_work_3ed133: "If you looked at my work properly, you'll understand what I am saying."
  npc_override_1@slw_WernerLaboratoryCentralRoom_if_you_want_replay_story_b23d30: "If you want to replay the story of Seyren Windsor, please select ^4d4dffProceed with the story^000000. If you want to see the masterpiece of Eisen Werner, please select ^4d4dffProceed with the battle^000000."
  npc_override_1@slw_WernerLaboratoryCentralRoom_isn_t_amazing_71a82e: "Isn't it amazing?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_isn_t_world_funny_place_873884: "Isn't this world a funny place? Ha ha ha ha ha"
  npc_override_1@slw_WernerLaboratoryCentralRoom_its_flow_relative_60ddf7: "Its flow is relative."
  npc_override_1@slw_WernerLaboratoryCentralRoom_just_imitating_main_body_426c93: "Just imitating the main body, they are even growing inside it."
  npc_override_1@slw_WernerLaboratoryCentralRoom_laboratory_i_built_refer_451114: "That is the laboratory I built by referring to it."
  npc_override_1@slw_WernerLaboratoryCentralRoom_land_gone_only_star_rema_14482e: "... The land is gone and only the star remains."
  npc_override_1@slw_WernerLaboratoryCentralRoom_let_me_ask_you_again_018202: "Let me ask you again. Is it the end of your will?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_let_me_finish_you_6f312e: "Let me finish you!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_let_me_tell_you_once_351c89: "Let me tell you once again. Don't be surprised."
  npc_override_1@slw_WernerLaboratoryCentralRoom_let_s_call_day_856523: "But let's call it a day."
  npc_override_1@slw_WernerLaboratoryCentralRoom_let_s_move_next_zone_19e05c: "Let's move to the next zone."
  npc_override_1@slw_WernerLaboratoryCentralRoom_look_carefully_ddda59: "Look at this carefully."
  npc_override_1@slw_WernerLaboratoryCentralRoom_look_carefully_what_you_a07fdb: "Look at this carefully. What you've come to reclaim is doing something marvelous!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_look_good_825e9c: "Does it look good?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_magic_field_been_activat_2ad43b: "The Magic field has been activated."
  npc_override_1@slw_WernerLaboratoryCentralRoom_magic_field_been_elimina_b929b3: "The Magic field has been eliminated. An entrance has been created."
  npc_override_1@slw_WernerLaboratoryCentralRoom_make_things_worse_uncont_f060a8: "To make things worse, it was an uncontrollable creature that was filled only with fury."
  npc_override_1@slw_WernerLaboratoryCentralRoom_maybe_bit_made_me_exist_46448e: "Maybe that bit of will made me exist."
  npc_override_1@slw_WernerLaboratoryCentralRoom_maybe_day_29d499: "Maybe it was for this day."
  npc_override_1@slw_WernerLaboratoryCentralRoom_md_only_party_leader_ent_7d09f7: "^4d4dffMD Only the party leader can enter [Central room] now.^000000"
  npc_override_1@slw_WernerLaboratoryCentralRoom_me_all_my_companions_die_2da41e: "^4d4dffMe and all my companions died long ago."
  npc_override_1@slw_WernerLaboratoryCentralRoom_menu_experiment_c9a10c: "Experiment_number: {0}"
  npc_override_1@slw_WernerLaboratoryCentralRoom_menu_options_2dee71: "{0} : Are you talking about the In Vivo Experiment?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_menu_options_8b600b: "{0} : Is that all you want to say?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_menu_options_bd1e2a: "{0} : ... Seyren?!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_0b0c6f: "^ff0000{0}^000000"
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_61ce5a: "[{0}]"
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_79ef7f: "...."
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_93fcbf: "......"
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_c77c95: "......."
  npc_override_1@slw_WernerLaboratoryCentralRoom_msg_e95f89: "....."
  npc_override_1@slw_WernerLaboratoryCentralRoom_my_type_fce846: "It was my type."
  npc_override_1@slw_WernerLaboratoryCentralRoom_never_think_i_m_finished_257816: "Never think that I'm finished here."
  npc_override_1@slw_WernerLaboratoryCentralRoom_next_security_devices_si_bf7f8d: "The next security devices are similar, so I won't have to explain again."
  npc_override_1@slw_WernerLaboratoryCentralRoom_no_i_d_glad_if_a40d24: "No, I'd be glad if you were surprised."
  npc_override_1@slw_WernerLaboratoryCentralRoom_no_never_0fc4e7: "No! Never!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_no_wonder_looked_like_th_cfaf74: "No wonder it looked like they had something to back them up."
  npc_override_1@slw_WernerLaboratoryCentralRoom_now_i_much_more_urgent_e89eb1: "Now, I have a much more urgent message for you rather than for Eisen."
  npc_override_1@slw_WernerLaboratoryCentralRoom_now_take_look_gift_i_9869b2: "Now, take a look at the gift I've prepared."
  npc_override_1@slw_WernerLaboratoryCentralRoom_oh_2eba04: "Oh...."
  npc_override_1@slw_WernerLaboratoryCentralRoom_oh_i_turn_every_time_efb7c0: "Oh ... I have to turn it on every time. It's so inconvenient!"
  npc_override_1@slw_WernerLaboratoryCentralRoom_once_identified_appropri_0c41f2: "Once it is identified appropriately, I might ask you for a settlement ..."
  npc_override_1@slw_WernerLaboratoryCentralRoom_only_party_leader_procee_c83874: "^4d4dffOnly the party leader can proceed with this event.^000000"
  npc_override_1@slw_WernerLaboratoryCentralRoom_only_successful_experime_7b513a: "And the only successful experiment is you. We call you Seyren now."
  npc_override_1@slw_WernerLaboratoryCentralRoom_operated_security_device_a5fcc3: "Operated the security device."
  npc_override_1@slw_WernerLaboratoryCentralRoom_otherwise_please_ask_you_987b65: "Otherwise, please ask your party leader for entrance."
  npc_override_1@slw_WernerLaboratoryCentralRoom_parallel_world_3c1f45: "Is it a parallel world?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_party_entering_d3d912: "{0} of the party, {1}, is entering the {2}."
  npc_override_1@slw_WernerLaboratoryCentralRoom_perhaps_there_strong_exp_0d5e2c: "Perhaps there was a strong experimental subject left inside."
  npc_override_1@slw_WernerLaboratoryCentralRoom_place_core_laboratory_co_03b879: "This place is the core of the laboratory, and contains everything of my research."
  npc_override_1@slw_WernerLaboratoryCentralRoom_please_don_t_waste_your_692285: "Please don't waste your affections on the bodies that are already dead.^000000"
  npc_override_1@slw_WernerLaboratoryCentralRoom_please_give_them_our_fam_76837d: "Please give them to our families."
  npc_override_1@slw_WernerLaboratoryCentralRoom_please_go_ahead_50bc89: "Please, go ahead."
  npc_override_1@slw_WernerLaboratoryCentralRoom_please_speak_me_again_on_0fbbb6: "Please speak to me again once you are ready to go in here."
  npc_override_1@slw_WernerLaboratoryCentralRoom_please_try_again_after_o_8beedb: "Please try again after organizing a party.^000000"
  npc_override_1@slw_WernerLaboratoryCentralRoom_please_wait_while_45e30e: "Please wait for a while."
  npc_override_1@slw_WernerLaboratoryCentralRoom_power_entwined_dummy_ymi_2b27a3: "The power entwined with the dummy of Ymir's Heart, which responded to my will and that of my companions. They wanted to unite, but kept dividing themselves over and over."
  npc_override_1@slw_WernerLaboratoryCentralRoom_proceed_story_86adc9: "Proceed with the story."
  npc_override_1@slw_WernerLaboratoryCentralRoom_really_then_i_bring_rese_c4ec73: "Really? Then I will bring this researcher to the squadron outside."
  npc_override_1@slw_WernerLaboratoryCentralRoom_reason_why_god_gave_me_bac477: "The reason why the god gave me this opportunity."
  npc_override_1@slw_WernerLaboratoryCentralRoom_replaying_story_f95702: "Replaying the story."
  npc_override_1@slw_WernerLaboratoryCentralRoom_right_thing_you_carved_i_671e4c: "Right. That thing you carved into a gem and used as a decoration on the crown."
  npc_override_1@slw_WernerLaboratoryCentralRoom_s_over_now_de5176: "But it's over now."
  npc_override_1@slw_WernerLaboratoryCentralRoom_security_device_l_been_a_696ad2: "Security device L-02 has been activated."
  npc_override_1@slw_WernerLaboratoryCentralRoom_security_device_l_been_a_f8a787: "Security device L-01 has been activated."
  npc_override_1@slw_WernerLaboratoryCentralRoom_security_device_r_been_a_06881a: "Security device R-02 has been activated."
  npc_override_1@slw_WernerLaboratoryCentralRoom_security_device_r_been_a_a94ea1: "Security device R-01 has been activated."
  npc_override_1@slw_WernerLaboratoryCentralRoom_seems_like_there_one_mor_191304: "Seems like there is one more security device."
  npc_override_1@slw_WernerLaboratoryCentralRoom_setting_central_room_bee_d2cd98: "The setting of the central room has been initialized."
  npc_override_1@slw_WernerLaboratoryCentralRoom_seyren_escort_these_gues_697504: "Seyren, escort these guests to hell."
  npc_override_1@slw_WernerLaboratoryCentralRoom_seyren_windsor_knight_pr_28e1ce: "Seyren Windsor, the knight of Prontera failed in the task."
  npc_override_1@slw_WernerLaboratoryCentralRoom_shall_we_use_explosive_b_447d84: "Shall we use an explosive and blow it up?"
  npc_override_1@slw_WernerLaboratoryCentralRoom_since_i_had_ability_thin_4beb02: "Since I had the ability to think, I didn't know who I was nor why I existed."
  npc_override_1@slw_WernerLaboratoryCentralRoom_since_s_simple_device_i_88c4fa: "Since it's a simple device, I guess you can."
