Body:
  npc_override_moc_prydb1_thief_ah_971301: "Ah..."
  npc_override_moc_prydb1_thief_ah_guide_told_me_about_03774b: "Ah, the guide told me about you. So, let me check your mushrooms..."
  npc_override_moc_prydb1_thief_ah_i_see_you_now_053bc6: "Ah, I see that you are now a Thief. I always knew you'd join us."
  npc_override_moc_prydb1_thief_ahem_welcome_guild_comra_80344a: "*Ahem* Welcome to the Guild, comrade! I'm Brad, and I'm in charge of human resources here."
  npc_override_moc_prydb1_thief_alright_i_ll_let_you_0925c2: "Alright, I'll let you in..."
  npc_override_moc_prydb1_thief_alright_i_looked_your_fe_d12a99: "Alright. I looked at your Felony Record, and you seem to have a very interesting history. You might have what it takes to be a Thief."
  npc_override_moc_prydb1_thief_alright_let_me_inform_yo_2d7cb7: "Alright, let me inform you then. Listen carefully. This test decides if you are worthy of becoming a Thief."
  npc_override_moc_prydb1_thief_alright_tell_725b24: "Alright, tell"
  npc_override_moc_prydb1_thief_alright_tell_me_your_nam_e6c8b2: "Alright, tell me your name. Huh? What?"
  npc_override_moc_prydb1_thief_alright_you_must_passed_0d245b: "Alright. You must have passed the job interview, huh?"
  npc_override_moc_prydb1_thief_alright_your_registratio_e84145: "Alright, your registration has been processed. Okay, you can begin your test if you're ready."
  npc_override_moc_prydb1_thief_alright_your_test_you_go_7389f3: "Alright, for your test, you gotta steal Mushrooms from his farm. Don't worry, that guy deserves to be robbed."
  npc_override_moc_prydb1_thief_alright_your_test_you_go_c4d9ff: "Alright, for your test, you gotta steal Mushrooms from a farm. Don't worry, the guy who owns the farm deserves to be robbed."
  npc_override_moc_prydb1_thief_am_i_dying_3d208a: "Am I dying?"
  npc_override_moc_prydb1_thief_any_fun_46607e: "Have any fun?"
  npc_override_moc_prydb1_thief_anyway_i_expect_you_grea_c7cef1: "'Anyway, I expect you to be a great thief.'"
  npc_override_moc_prydb1_thief_anyway_outside_world_nev_41eb60: "Anyway, in the outside world, never say that you want to be a Thief!!"
  npc_override_moc_prydb1_thief_apply_become_e215d2: "apply to become"
  npc_override_moc_prydb1_thief_archers_playing_141477: "Archers be playing"
  npc_override_moc_prydb1_thief_awesome_ed5dbb: "Awesome!"
  npc_override_moc_prydb1_thief_because_i_feel_like_i_0f9f7e: "Because I feel like it, I now decree that you have passed this interview. Good work!"
  npc_override_moc_prydb1_thief_big_sword_a1f07a: "a big sword."
  npc_override_moc_prydb1_thief_bring_your_total_d13eeb: "bring your total to..."
  npc_override_moc_prydb1_thief_buddy_3f693b: "...Buddy?"
  npc_override_moc_prydb1_thief_careful_since_there_mons_2f5a79: "Be careful, since there are monsters are the farm that are there to protect the Mushrooms. So this will be no walk in the park."
  npc_override_moc_prydb1_thief_come_hurry_ee369b: "Come on, hurry and"
  npc_override_moc_prydb1_thief_congratulations_becoming_b18dcd: "Congratulations on becoming a Thief! From now, be an honorable representative of the Thief's Guild."
  npc_override_moc_prydb1_thief_congratulations_becoming_c7d21c: "'Congratulations on becoming a Thief.'"
  npc_override_moc_prydb1_thief_definitely_less_than_poi_139eb9: "Definitely less than the 25 points you need to pass. Go out there and get me more Mushrooms!"
  npc_override_moc_prydb1_thief_did_you_pass_interview_149c21: "Did you pass the interview?"
  npc_override_moc_prydb1_thief_didn_t_you_use_one_f20d05: "Didn't you use to be one of us?! Man, you changed. You seem real dangerous now..."
  npc_override_moc_prydb1_thief_don_t_forget_make_plans_c6c2e6: "Don't forget to make plans and prepare yourself before you go inside the Mushroom Farm. Move as quickly as you can and try not to get killed, alright?"
  npc_override_moc_prydb1_thief_each_orange_net_mushroom_624281: "Each Orange Net Mushroom gets you 3 points, and you get 1 point for each Orange Gooey Mushroom. You need a total of 25 points to pass the test."
  npc_override_moc_prydb1_thief_eh_me_me_5ed1df: "Eh..? me? me?"
  npc_override_moc_prydb1_thief_ehh_seems_like_beloved_r_e0c4b5: "Ehh... Seems like a beloved {0} of a rich family, but why are you here in this dirty place?"
  npc_override_moc_prydb1_thief_exactly_points_2f77ef: "Exactly 25 points!"
  npc_override_moc_prydb1_thief_field_i_think_his_coordi_6101b2: "On that field, I think his coordinates are '^FF0000141, 125^000000.' Just type ^3355FF/where^000000 in the right side of your chat box to check your present coordinates."
  npc_override_moc_prydb1_thief_first_let_me_check_orang_90c4ba: "First, let me check the Orange Net Mushrooms you got."
  npc_override_moc_prydb1_thief_forest_131aef: "in the forest"
  npc_override_moc_prydb1_thief_get_outta_here_9d45da: "get outta here~"
  npc_override_moc_prydb1_thief_get_outta_here_a2274b: "Get outta here!"
  npc_override_moc_prydb1_thief_gimme_your_money_063d58: "Gimme your money."
  npc_override_moc_prydb1_thief_give_me_534002: "Give me"
  npc_override_moc_prydb1_thief_go_outside_keep_going_ah_ad4cbf: "Go outside and keep going ahead toward the Eastern Field of the Pyramids. Then you will see one of our comrades between two columns."
  npc_override_moc_prydb1_thief_good_i_ll_accept_you_a92c7b: "Good. I'll accept you."
  npc_override_moc_prydb1_thief_ha_ha_ha_go_put_a0192b: "'Ha ha ha! Go put up a banner that says 'I will be a proud thief who steals other people's stuff.'"
  npc_override_moc_prydb1_thief_hahahahaha_9fae04: "Hahahahaha~!"
  npc_override_moc_prydb1_thief_hahahahahahah_046978: "Hahahahahahah!"
  npc_override_moc_prydb1_thief_heee_yaaaa_congratulatio_8d823a: "Heee~Yaaaa~! Congratulations! My friend."
  npc_override_moc_prydb1_thief_heh_heh_s_good_attitude_9a676d: "Heh heh! That's a good attitude. In our line of work, you gotta enjoy getting your hands dirty, one way or another."
  npc_override_moc_prydb1_thief_heh_i_like_your_confiden_ae9542: "Heh, I like your confidence. Still, you know being a Thief isn't all what it's cracked up to be."
  npc_override_moc_prydb1_thief_here_rathole_32b248: "here to this rathole?"
  npc_override_moc_prydb1_thief_here_small_subsidy_newbi_703d16: "Here is a small subsidy for a Newbie like you. Spend it whereever you want. Alright then, I'll see you around~"
  npc_override_moc_prydb1_thief_here_talk_other_guy_righ_bc2668: "Here, talk to the other guy right next to me. He's the one in charge of checking your Mushrooms."
  npc_override_moc_prydb1_thief_hey_baby_28fe86: "Hey, baby."
  npc_override_moc_prydb1_thief_hey_baby_67a745: "Hey, baby~"
  npc_override_moc_prydb1_thief_hey_brother_2ddb9c: "Hey, brother."
  npc_override_moc_prydb1_thief_hey_dude_909091: "Hey, dude."
  npc_override_moc_prydb1_thief_hey_hey_you_re_novice_8d507b: "Hey~ Hey~ You're not a novice or a thief!"
  npc_override_moc_prydb1_thief_hey_if_you_any_trouble_226616: "Hey~ if you have any trouble, get it out to me anytime, huh?"
  npc_override_moc_prydb1_thief_hey_lady_9ece52: "Hey, lady."
  npc_override_moc_prydb1_thief_hey_novice_why_don_t_5e0af3: "Hey Novice! Why don't you join the ranks of the Thief Guild? You newbies are always welcome to join us and our selfish cause."
  npc_override_moc_prydb1_thief_hey_whaddya_doin_here_ar_f27260: "Hey, whaddya doin' here? Aren't you supposed to be gathering Mushrooms? Or did you need it explained to you again?"
  npc_override_moc_prydb1_thief_hey_you_look_too_goody_ad3ced: "...Hey! You look too goody-goody to want to be a Thief!! Now scram, I'm busy. Next!"
  npc_override_moc_prydb1_thief_hmm_9c4d28: "Hmm..."
  npc_override_moc_prydb1_thief_hmm_i_found_your_interes_7e69f0: "Hmm.... I found your interesting criminal records from the data of the detective agency. Well you seem to have what it takes to be a good thief."
  npc_override_moc_prydb1_thief_hmmm_d3b3a2: "Hmmm?"
  npc_override_moc_prydb1_thief_hmmm_degrees_multiplied_69148a: "Hmmm. {0} degrees, multiplied by the speed of light, divided by the integral of pi times height plus the absolute value of politics..."
  npc_override_moc_prydb1_thief_ho_why_novice_like_you_4ef079: "Ho? Why is a novice like you visiting here?"
  npc_override_moc_prydb1_thief_how_you_40c324: "How can you"
  npc_override_moc_prydb1_thief_huh_6ed1eb: "Huh."
  npc_override_moc_prydb1_thief_huh_i_know_you_s_7ca9eb: "Huh? Do I know you? It's creepy that you seem so familiar. You don't have a twin, do you?"
  npc_override_moc_prydb1_thief_huh_second_there_i_thoug_9468c3: "Huh. For a second there, I thought you had something really important to tell me."
  npc_override_moc_prydb1_thief_huh_them_08d564: "Huh, {0} of them."
  npc_override_moc_prydb1_thief_huh_you_blockhead_be11f6: "Huh... you are a {0}, blockhead!"
  npc_override_moc_prydb1_thief_i_could_use_good_hard_f7fa4d: "I could use a good, hard drink."
  npc_override_moc_prydb1_thief_i_don_t_any_special_4ad674: "I don't have any special events now. So go on your way and come back later."
  npc_override_moc_prydb1_thief_i_got_18756a: "I got it."
  npc_override_moc_prydb1_thief_i_had_no_choice_time_0351f5: "I had no choice at the time. It was either steal or starve. But it's not like I need to give you my life story."
  npc_override_moc_prydb1_thief_i_m_sure_now_you_cfc6a5: "I'm not sure for now but you'll have more chances to see me later on."
  npc_override_moc_prydb1_thief_i_now_declare_you_passed_9e8afd: "{0}. I now declare that you have passed the job interview!"
  npc_override_moc_prydb1_thief_i_see_ae6f79: "I can see that."
  npc_override_moc_prydb1_thief_i_see_your_strong_become_97ab73: "I can see your strong will to become a Thief......"
  npc_override_moc_prydb1_thief_i_ve_got_nothing_say_7fdc63: "I've got nothing to say to you. Would you mind leaving me alone?"
  npc_override_moc_prydb1_thief_if_you_bring_disgrace_ou_fd5e35: "If you bring disgrace to our guild, you will be killed. I expect you to bring our comrades pride."
  npc_override_moc_prydb1_thief_if_you_bring_us_any_394537: "'If you bring us any disgrace by breaking our rules, you better watch your back.'"
  npc_override_moc_prydb1_thief_if_you_here_thief_ask_a6b8f7: "If you are here to be a Thief, ask the nasty-tempered lady right next to me."
  npc_override_moc_prydb1_thief_if_you_problem_feel_free_02e732: "If you have a problem, feel free to speak to me anytime, alright?"
  npc_override_moc_prydb1_thief_if_you_want_become_thief_180c5a: "If you want to become a Thief, ask the sharp-eyed guy next to me."
  npc_override_moc_prydb1_thief_if_you_want_become_thief_c2167b: "If you want to become a Thief, ask the guy next to me."
  npc_override_moc_prydb1_thief_isn_t_cute_i_see_88dd37: "Isn't that cute? I can see you're ambitious, but you gotta learn all of the Basic Skills before you can become a Thief."
  npc_override_moc_prydb1_thief_kidding_i_m_off_clock_a92028: "Kidding, I'm off the clock."
  npc_override_moc_prydb1_thief_let_s_begin_job_changing_738eb6: "Let's begin the job-changing ceremony of our guild!"
  npc_override_moc_prydb1_thief_like_thief_f9ac90: "like a Thief."
  npc_override_moc_prydb1_thief_man_shouldn_t_you_1c997a: "Man, shouldn't you"
  npc_override_moc_prydb1_thief_man_you_got_real_cool_afee07: "Man, you got real cool all of a sudden! You must have some skills I can only dream of!"
  npc_override_moc_prydb1_thief_me_bf0d7e: "Me...?"
  npc_override_moc_prydb1_thief_me_your_name_b70468: "me your name."
  npc_override_moc_prydb1_thief_menu_anyway_9c5057: "Anyway, you gotta gather two kinds of Mushrooms: ^0000FFOrange Net Mushrooms^000000 and ^0000FFOrange Gooey Mushrooms^000000."
  npc_override_moc_prydb1_thief_menu_hey_e8d6bb: "Hey, I came here to be a Thief!:Nah, I'm just looking around."
  npc_override_moc_prydb1_thief_menu_i_37541c: "I want to be a Thief.:Nothing."
  npc_override_moc_prydb1_thief_menu_yeah_2d26f5: "Yeah, kinda Cool.:It was horrible."
  npc_override_moc_prydb1_thief_menu_yeah_4d9d17: "Yeah, I'm ready.:No, I'm not ready yet."
  npc_override_moc_prydb1_thief_menu_yeah_5610e3: "Yeah.:No, just wasting your time.:Why did you become a Thief?"
  npc_override_moc_prydb1_thief_menu_yes_3f30e3: "Yes.:No, that's okay."
  npc_override_moc_prydb1_thief_menu_yes_cd0f63: "Yes, I do.:No."
  npc_override_moc_prydb1_thief_menu_yes_d63417: "Yes, I do.:Sorry, I don't."
  npc_override_moc_prydb1_thief_menu_yes_f999a4: "Yes.:No.:How about you?"
  npc_override_moc_prydb1_thief_menu_yes_fbca31: "Yes, I will.:I'm too scared to be a Thief!"
  npc_override_moc_prydb1_thief_msg_032da9: "{0}?"
  npc_override_moc_prydb1_thief_msg_842d61: "'{0}.'"
  npc_override_moc_prydb1_thief_mushroom_farm_29cb81: "Mushroom Farm?"
  npc_override_moc_prydb1_thief_my_name_brad_i_m_96c2a2: "My name is 'Brad'. I'm in charge of human resources here."
  npc_override_moc_prydb1_thief_now_i_ll_just_check_0b4ea7: "Now I'll just check your Orange Gooey Mushrooms. That's {0} you gathered."
  npc_override_moc_prydb1_thief_now_keep_rules_our_guild_f8329e: "'From now on, keep the rules of our guild and be an honorable member.'"
  npc_override_moc_prydb1_thief_now_s_31fe97: "Now, that's"
  npc_override_moc_prydb1_thief_now_your_actual_abilitie_2ddbb6: "Now, your actual abilities will need to be tested. Do you know anything about the test?"
  npc_override_moc_prydb1_thief_oh_my_god_5232c8: "Oh my God..."
  npc_override_moc_prydb1_thief_oh_please_c0068b: "Oh, please...!"
  npc_override_moc_prydb1_thief_oh_wait_4e95a3: "Oh wait,"
  npc_override_moc_prydb1_thief_oh_yeah_well_makes_thing_a775ff: "Oh yeah? Well, this makes things a lot easier."
  npc_override_moc_prydb1_thief_oh_you_huh_well_i_dcb775: "Oh, do you...? Huh.. well... I do live and learn to see strange people like you."
  npc_override_moc_prydb1_thief_okay_512623: "Okay!"
  npc_override_moc_prydb1_thief_okay_6fb660: "Okay..."
  npc_override_moc_prydb1_thief_okay_i_ve_done_what_a19d59: "Okay, I've done what I can do to you, so go on your way. I'm quite a busy man."
  npc_override_moc_prydb1_thief_one_second_019768: "one second."
  npc_override_moc_prydb1_thief_only_your_you_cannot_mak_736021: "But only with your will, you cannot make it in a real fight, can you?"
  npc_override_moc_prydb1_thief_passed_test_yet_008e7c: "passed the test yet?"
  npc_override_moc_prydb1_thief_ready_3d7d14: "Not ready?"
  npc_override_moc_prydb1_thief_ready_c960de: "not be ready?!"
  npc_override_moc_prydb1_thief_ready_try_again_2f0861: "ready to try again?"
  npc_override_moc_prydb1_thief_really_380a14: "Really..."
  npc_override_moc_prydb1_thief_right_why_you_244ded: "right? Why are you"
  npc_override_moc_prydb1_thief_s_d4f703: "it's not..."
  npc_override_moc_prydb1_thief_s_hilarious_5c79d1: "That's hilarious!"
  npc_override_moc_prydb1_thief_s_like_you_re_begging_4a2c6b: "It's like you're begging"
  npc_override_moc_prydb1_thief_see_you_again_21444b: "See you again."
  npc_override_moc_prydb1_thief_sigh_look_there_s_really_0079f3: "*Sigh* Look, there's really no need for you to be in this kind of place. You oughta go where you ought to go."
  npc_override_moc_prydb1_thief_sigh_well_there_s_always_3f3fad: "*Sigh* Well, there's always one in the bunch. Alright, listen carefully."
  npc_override_moc_prydb1_thief_since_you_ve_become_thie_91e67e: "Since you've become a Thief, live as a Thief. Now, go for it! Next~"
  npc_override_moc_prydb1_thief_so_424d0d: "So that would"
  npc_override_moc_prydb1_thief_so_c7572d: "So..."
  npc_override_moc_prydb1_thief_so_go_reach_least_basic_883716: "So go and reach at least Basic Skill Level 9."
  npc_override_moc_prydb1_thief_so_how_351176: "So how was the"
  npc_override_moc_prydb1_thief_so_right_34220a: "{0}. So {1}, right...?"
  npc_override_moc_prydb1_thief_so_you_want_apply_being_5e2f6f: "So, do you want to apply for being a Thief?"
  npc_override_moc_prydb1_thief_so_you_want_d3d224: "So do you want to"
  npc_override_moc_prydb1_thief_something_273305: "or something?"
  npc_override_moc_prydb1_thief_speak_guy_he_ll_take_0b3548: "Speak to that guy, and he'll take you to the farm through the backdoor."
  npc_override_moc_prydb1_thief_stealing_mushroom_farm_t_0d8bc2: "Stealing from a Mushroom farm is too easy for you now. You should build up your skills and master our craft."
  npc_override_moc_prydb1_thief_still_fd8d00: "Still..."
  npc_override_moc_prydb1_thief_take_your_time_learn_all_ee07f6: "Take your time and learn all the Basic Skills, will you? Well then, see you later~!"
  npc_override_moc_prydb1_thief_than_points_593240: "than 25 points!"
  npc_override_moc_prydb1_thief_then_what_you_waiting_5c1699: "Then what are you waiting for?"
  npc_override_moc_prydb1_thief_then_why_you_here_you_4a6ab5: "Then why are you here? Do you think you can become a thief so easily?"
  npc_override_moc_prydb1_thief_there_strange_smell_comi_c71fe2: "There is this strange smell coming from... You. Now why would that be?"
  npc_override_moc_prydb1_thief_thief_a00854: "a Thief or not?"
  npc_override_moc_prydb1_thief_thief_bb35df: "a Thief?"
  npc_override_moc_prydb1_thief_thief_test_right_f72a57: "the Thief test, right?"
  npc_override_moc_prydb1_thief_thieves_88d49d: "of Thieves?!"
  npc_override_moc_prydb1_thief_those_who_ready_moonligh_c14142: "'For those who are ready, the moonlight shall open the way. Now you are fully ready, I now officially allow you to become a member of the Thief Guild.'"
  npc_override_moc_prydb1_thief_today_looks_like_good_da_158962: "Today looks like a good day to go to the pyramids and hunt with some of my friends."
  npc_override_moc_prydb1_thief_too_scared_ed8af9: "Too scared?!?"
  npc_override_moc_prydb1_thief_trying_make_3d7b04: "Trying to make"
  npc_override_moc_prydb1_thief_um_b716d0: "Um..."
  npc_override_moc_prydb1_thief_up_something_366cc3: "up for something"
  npc_override_moc_prydb1_thief_us_steal_you_e453e0: "us to steal from you!"
  npc_override_moc_prydb1_thief_walking_into_den_7ef611: "walking into a den"
  npc_override_moc_prydb1_thief_want_e9f954: "want to be"
  npc_override_moc_prydb1_thief_we_don_t_any_special_452be6: "We don't have any special events yet. Come some other time when there's news, alright?"
  npc_override_moc_prydb1_thief_well_i_got_feeling_like_768231: "Well, I got this feeling like you've been through a lifetime of fighting, so I'm promoting you to a Thief right this minute. I better give you tough guys what you want..."
  npc_override_moc_prydb1_thief_well_i_just_fit_well_a8f43b: "Well... I just fit well to being a thief... characteristically... I don't mind this silly matter."
  npc_override_moc_prydb1_thief_well_i_m_charge_making_cb3dc6: "Well, I'm not in charge of making you a Thief. I just accept applications, get it?"
  npc_override_moc_prydb1_thief_well_what_you_want_go_3d1f6b: "Well... do what you want to do~ Go your way~"
  npc_override_moc_prydb1_thief_well_you_proud_616253: "Well, are you that proud of it?"
  npc_override_moc_prydb1_thief_what_brings_you_down_8a3e25: "What brings you down"
  npc_override_moc_prydb1_thief_what_heck_52429c: "What the heck are"
  npc_override_moc_prydb1_thief_what_heck_58b76f: "What the heck...?"
