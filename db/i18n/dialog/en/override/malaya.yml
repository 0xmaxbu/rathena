Body:
  npc_override_malaya_guides_malaya_check_your_mini_map_91e6e6: "Check your mini-map."
  npc_override_malaya_guides_malaya_i_hope_you_enjoy_your_24c6f6: "I hope you enjoy your journey."
  npc_override_malaya_guides_malaya_i_ll_remove_all_marks_02e4d3: "I'll remove all marks from your mini-map."
  npc_override_malaya_guides_malaya_marked_your_mini_map_eabbe5: "marked on your mini-map."
  npc_override_malaya_guides_malaya_menu_kafra_e29ae5: "[ Kafra Employees ]:[ Inn & Tavern ]:[ Weapon & Armor Shop ]:[ Tool Shop ]:[ Hospital ]:[ Park ]:[ Harbor ]:Remove marks from Mini-Map:Cancel"
  npc_override_malaya_guides_malaya_the_376b0c: "The {0} {1}"
  npc_override_malaya_guides_malaya_there_anything_else_i_yo_8fdf01: "Is there anything else I can do for you?"
  npc_override_malaya_guides_malaya_welcome_port_malaya_brea_4aa7aa: "Welcome to ^8B4513Port Malaya^000000, the Breathing Village."
  npc_override_malaya_guides_malaya_where_cultures_legends_c_103656: "Where cultures and legends come to life!"
  npc_override_malaya_guides_malaya_you_need_help_navigating_10d126: "Do you need help navigating the village?"
  npc_override_malaya_kafras_dewata_island_f18d49: "on Dewata Island"
  npc_override_malaya_kafras_glast_heim_1b32f5: "in Glast Heim"
  npc_override_malaya_kafras_i_only_offer_storage_ed3dd0: "I only offer Storage!"
  npc_override_malaya_kafras_kafra_corporation_20c94e: "Kafra Corporation."
  npc_override_malaya_kafras_kafra_employee_df8212: "[Kafra Employee]"
  npc_override_malaya_kafras_lutie_ab6d6c: "in Lutie"
  npc_override_malaya_kafras_port_malaya_d411a3: "in Port Malaya"
  npc_override_malaya_kafras_welcome_c8f06d: "Welcome to the"
  npc_override_malaya_malaya_adventurers_these_days_a_327919: "Adventurers these days act like they are busy. Come back when you have the time and we could go visit Port Malaya together."
  npc_override_malaya_malaya_around_here_let_me_tell_1bf048: "Not from around here? Let me tell you why even a foreigner like you should be careful."
  npc_override_malaya_malaya_as_time_goes_their_venge_82f507: "But as time goes by and their vengeance grows, they sit on top of you until you suffocate."
  npc_override_malaya_malaya_back_outside_9f30a3: "Back outside"
  npc_override_malaya_malaya_bakonawa_also_known_as_m_ef5c6a: "Bakonawa is also known as the 'monster that swallows the moon' in Port Malaya."
  npc_override_malaya_malaya_because_strange_things_h_b4b135: "Because strange things happen if logs from trees that Bangungot lived in are used as building pillars."
  npc_override_malaya_malaya_beware_mongkukurums_need_4f88cd: "Beware of Mongkukurums needle, foreigner."
  npc_override_malaya_malaya_boy_fairies_prettier_why_ad52ab: "But boy fairies are prettier. Why is that?"
  npc_override_malaya_malaya_buwaya_don_t_come_villag_443eb6: "Buwaya don't come to the village often but there are cases when they snatch people in the boxes they carry at night."
  npc_override_malaya_malaya_careful_night_1e4657: "Be careful at night!"
  npc_override_malaya_malaya_careful_walking_around_v_c13a25: "Be careful walking around the village at night. {0} was taken down by Wokwok."
  npc_override_malaya_malaya_carry_drum_around_you_yo_ce34c5: "Carry a drum around with you. You'll find it handy."
  npc_override_malaya_malaya_come_rest_lodging_zeny_05dfc6: "Come for a rest? Lodging will be 5,000 Zeny."
  npc_override_malaya_malaya_door_closed_seems_keepin_24bb37: "Door is closed. It seems to be keeping its eyes on you."
  npc_override_malaya_malaya_encan_encan_fairies_live_6ec7a6: "Encan'to! Encan'to fairies live in big trees or rocks in the forest. There are boy fairies and girl fairies..."
  npc_override_malaya_malaya_father_said_i_won_t_254f68: "Father said I won't catch skin diseases once I'm friends with the fairy from the forest."
  npc_override_malaya_malaya_foreigners_welcomed_much_9f1b1c: "Foreigners are not welcomed that much when our village is chaotic like these days."
  npc_override_malaya_malaya_great_91bb26: "Great!"
  npc_override_malaya_malaya_great_let_s_leave_now_5a28a3: "Great! Let's leave now for Alberta!!"
  npc_override_malaya_malaya_ha_ha_ha_there_no_e3d100: "Ha ha ha. There are no Bangungots in normal pillars, so don't lose sleep over it."
  npc_override_malaya_malaya_ha_ha_ha_there_way_dd951f: "Ha ha ha. There is a way to stop Bakonawa from swallowing a person."
  npc_override_malaya_malaya_happiness_never_lasts_fo_c17336: "But happiness never lasts forever, right? The baby was miscarried from an accident..."
  npc_override_malaya_malaya_hat_my_mom_washed_yester_21e326: "The hat my mom washed yesterday disappeared. Our neighbor's hat also disappeared a few days ago."
  npc_override_malaya_malaya_he_he_father_said_i_796cd2: "He he. Father said I can visit the fairy in the forest when the village calms down."
  npc_override_malaya_malaya_he_he_i_like_funny_8441bb: "He he... I do like funny stories but a bit difficult for my taste."
  npc_override_malaya_malaya_he_he_i_never_thought_010399: "He he. But I never thought of going outside of Port Malaya."
  npc_override_malaya_malaya_he_he_isn_t_fun_2ce0b8: "He he. Isn't it fun?"
  npc_override_malaya_malaya_he_he_isn_t_fun_8cb254: "He he. Isn't it fun? {0} seems like a fun person."
  npc_override_malaya_malaya_he_sensitive_noise_so_wh_f5d22f: "He is sensitive to noise so when he's about to swallow the moon!!"
  npc_override_malaya_malaya_heading_port_malaya_50831e: "Heading for Port Malaya!!"
  npc_override_malaya_malaya_hear_either_tik_tik_wak_96ed22: "And hear either tik-tik or wak-wak, be cautious because that is the sound of Meoneonuncle's wings flapping."
  npc_override_malaya_malaya_heard_there_follows_meon_e31a15: "Heard there is this {0} that follows Meoneonuncle around."
  npc_override_malaya_malaya_hey_there_30dcdc: "Hey, there!"
  npc_override_malaya_malaya_hmm_time_careful_witches_06a84d: "Hmm... is it time to be careful of the witches' curse?"
  npc_override_malaya_malaya_hmm_you_think_jejeling_t_0467f6: "Hmm... do you think Jejeling took it?"
  npc_override_malaya_malaya_hope_you_enjoy_your_stay_2b2631: "Hope you enjoy your stay."
  npc_override_malaya_malaya_huh_says_here_monster_na_81777f: "Huh?! And it says here that a monster named Wokwok especially visits the village often at night and should be avoided."
  npc_override_malaya_malaya_huh_you_re_captain_you_1da8f9: "Huh? You're not the captain? You scared me. Shoot! Ah, right! I received an official document for travelers."
  npc_override_malaya_malaya_huk_then_isn_t_dangerous_a1c860: "Huk! Then isn't it dangerous?"
  npc_override_malaya_malaya_i_cheer_their_forbidden_28e1f1: "I will cheer for their forbidden love."
  npc_override_malaya_malaya_i_close_coming_back_cozy_ebe5f4: "I was this close to not coming back to cozy Alberta again."
  npc_override_malaya_malaya_i_couldn_t_visit_village_c02ab6: "I couldn't visit the village because they had some issues there but now it seems all is clear!"
  npc_override_malaya_malaya_i_don_t_anything_share_840fb5: "I don't have anything to share with you."
  npc_override_malaya_malaya_i_don_t_know_sure_510593: "I don't know for sure but it was a village that's like a comfortable and cozy park."
  npc_override_malaya_malaya_i_heard_someone_took_jej_affed4: "I heard someone took Jejelings hat in Baryo Mahiwaga."
  npc_override_malaya_malaya_i_heard_there_outsider_h_b29085: "I heard there is an outsider that is helping the village."
  npc_override_malaya_malaya_i_know_bakonawa_could_al_f1aa06: "But I know that Bakonawa could also 'swallow people', too."
  npc_override_malaya_malaya_i_like_fun_stories_oh_481feb: "I like fun stories. Oh by the way! {0}, love is photogenic. Don't you agree?"
  npc_override_malaya_malaya_i_like_fun_stories_so_623ac7: "I like fun stories. Not so long ago, {0} came and told me a funny story."
  npc_override_malaya_malaya_i_m_afraid_jeepney_full_2d1463: "I'm afraid the Jeepney is full."
  npc_override_malaya_malaya_i_m_scared_i_visit_43f7d0: "I'm scared but I have to visit the fairy in the forest."
  npc_override_malaya_malaya_i_m_sorry_how_about_19f5b4: "I'm sorry but how about some other Jeepney?"
  npc_override_malaya_malaya_i_m_sure_you_ll_eb1bf6: "I'm sure you'll feel the same once you reach Port Malaya."
  npc_override_malaya_malaya_i_m_worried_about_my_0a295a: "I'm worried about my pregnant daughter-in-law. Hope Meoneonuncle won't bother her."
  npc_override_malaya_malaya_i_m_worried_because_my_d23364: "I'm worried because my daughter-in-law is pregnant. I hope nothing goes wrong."
  npc_override_malaya_malaya_i_planted_pair_pear_tree_d4a7dc: "'I planted a pair of pear trees in the yard.'"
  npc_override_malaya_malaya_i_think_nameless_adventu_9808f3: "I think a nameless adventurer helped take a load off the villagers' minds. Yahoo! Would you like to go back to Alberta?"
  npc_override_malaya_malaya_i_think_someone_stealing_07fb77: "I think someone is stealing all the hats in the village."
  npc_override_malaya_malaya_i_think_village_saved_na_7e0417: "I think the village was saved by a nameless adventurer."
  npc_override_malaya_malaya_i_think_village_still_bu_6eaa9c: "I think the village is still busy. Done with your visit? There is always a ship heading for Alberta."
  npc_override_malaya_malaya_i_visited_friend_baryo_m_2b3287: "I visited a friend in Baryo Mahiwaga and he said he saw Jejeling wearing the missing hat..."
  npc_override_malaya_malaya_if_fluttering_sound_smal_24eec9: "But if the fluttering sound is small or if you don't hear anything, let's just say you should prepare for attack and wish for luck."
  npc_override_malaya_malaya_if_you_ever_walk_around_d2be46: "If you ever walk around Port Malaya at night..."
  npc_override_malaya_malaya_if_you_hear_baby_crying_65b36a: "If you hear a baby crying from the forest outside of the village, never go near it."
  npc_override_malaya_malaya_if_you_plan_go_out_5f90d1: "If you plan to go out of the village, be careful of Tiucknuc. {0} is said to be tricked by Tiucknuc and had to go to the hospital."
  npc_override_malaya_malaya_im_worried_about_childre_f74b51: "Im worried about the children. I hope they aren't terrified from whats going on in the village."
  npc_override_malaya_malaya_kafra_employee_i_m_frien_6a4f87: "A Kafra Employee I'm friends with told me a story about a customer."
  npc_override_malaya_malaya_kafra_wise_never_marry_w_7a3886: "'Kafra, the wise never marry and when they marry, they become otherwise.'"
  npc_override_malaya_malaya_little_while_ago_came_to_f636ae: "A little while ago {0} came and told me a fun story."
  npc_override_malaya_malaya_menu_about_da2564: "About Port Malaya.:Go to Port Malaya.:Cancel."
  npc_override_malaya_malaya_menu_board_92a130: "Board [Passenger {0}/{1}]:Jeepney?:Are there any other Jeepneys?:Ah... Yes..."
  npc_override_malaya_malaya_menu_i_6c1fce: "I see.:Is there any way to prevent them from coming?"
  npc_override_malaya_malaya_menu_i_761075: "I'd like to know where the 12 passenger car is.:I'd like to know where the 30 passenger car is.:I'd like to know where the 60 passenger car is."
  npc_override_malaya_malaya_menu_return_9c4e26: "Return.:Do not return."
  npc_override_malaya_malaya_menu_store_08dc2d: "Store.:Lodge. - 5,000z:Cancel."
  npc_override_malaya_malaya_meoneonuncle_97c4cc: "Meoneonuncle?"
  npc_override_malaya_malaya_meoneonuncle_then_starte_0761cf: "Meoneonuncle then started to appear in spirit and take away babies from pregnant women in the village."
  npc_override_malaya_malaya_meoneonuncle_woman_who_l_764081: "Meoneonuncle was a woman who lived in Port Malaya long ago. She married a decent man and also had a baby."
  npc_override_malaya_malaya_mongkukurum_400674: "Mongkukurum?"
  npc_override_malaya_malaya_mongkukurum_makes_doll_o_f1ee83: "Mongkukurum makes a doll out of the people it sees and curses it with needles."
  npc_override_malaya_malaya_monster_also_called_witc_3ef751: "A monster that is also called witch. Looks like a person and also wears clothes."
  npc_override_malaya_malaya_my_aunt_stepped_ant_15df14: "'My aunt stepped on an ant.'"
  npc_override_malaya_malaya_my_mom_told_me_i_a44d87: "My mom told me I can play but only in Port Malaya."
  npc_override_malaya_malaya_my_mom_told_me_play_22838a: "My mom told me not to play outside because its dangerous. Why?"
  npc_override_malaya_malaya_needs_darkness_develop_4d520e: "It needs darkness to develop."
  npc_override_malaya_malaya_never_ever_stare_into_th_3a6b88: "Never ever stare into their eyes for too long."
  npc_override_malaya_malaya_nice_day_ed51dd: "Have a nice day."
  npc_override_malaya_malaya_nice_trip_4d4053: "Have a nice trip."
  npc_override_malaya_malaya_oh_god_df182b: "Oh God!!"
  npc_override_malaya_malaya_oh_gosh_65e94f: "Oh, gosh..."
  npc_override_malaya_malaya_oh_my_visiting_cb9247: "Oh my! Visiting?"
  npc_override_malaya_malaya_oh_other_jeepneys_operat_d93387: "Oh! Other Jeepneys are in operation, of course."
  npc_override_malaya_malaya_oh_wait_suppose_secret_s_7b93d9: "Oh wait! This was suppose to be a secret. Shsh! Please pretend you didn't hear me."
  npc_override_malaya_malaya_phew_i_thought_bakonawa_e810bf: "Phew... I thought Bakonawa appeared again."
  npc_override_malaya_malaya_port_malaya_s_best_inn_d5dd03: "This is Port Malaya's best inn, 'Cabin in the City'."
  npc_override_malaya_malaya_port_malaya_small_villag_271561: "Port Malaya is a small village you could reach by sailing southwest from Alberta."
  npc_override_malaya_malaya_port_malaya_there_passen_dda5b8: "In Port Malaya there are 12, 30 and 60 passenger Jeepneys with 3 each operating."
  npc_override_malaya_malaya_s_okay_come_here_if_e4a9ba: "That's okay. Come here if you ever want to go back to Alberta."
  npc_override_malaya_malaya_s_your_chance_doesn_t_7f704a: "That's your chance!! It doesn't matter what kind of noise!! Whether it's a caldron, symbol, drum, pot or fry pan, just keep on making noise."
  npc_override_malaya_malaya_s_zeny_go_port_malaya_5ce139: "It's 10,000 Zeny to go to Port Malaya. Interested?"
  npc_override_malaya_malaya_sad_story_d8809c: "That is a sad story."
  npc_override_malaya_malaya_says_travelers_should_ca_89774b: "It says that travelers should be careful of monsters when walking in the village at night."
  npc_override_malaya_malaya_she_eventually_passed_aw_3295ec: "She eventually passed away after grieving over her lost baby for days."
  npc_override_malaya_malaya_so_you_adventurer_villag_e56da1: "So you are the adventurer villagers are talking about? I reopened my inn thanks to you. Thank you."
  npc_override_malaya_malaya_sorry_i_think_you_bit_10fbd5: "Sorry. I think you are a bit short."
  npc_override_malaya_malaya_sounds_like_sneaky_monst_31dd6e: "Sounds like a sneaky monster."
  npc_override_malaya_malaya_successfully_stored_see_467487: "Successfully stored. See you next time."
  npc_override_malaya_malaya_then_bakonawa_get_surpri_0fca1d: "Then Bakonawa will get surprised, spit out the moon and run away!"
  npc_override_malaya_malaya_then_my_daughter_law_saf_17287c: "Then my daughter-in-law will be safe."
  npc_override_malaya_malaya_there_monster_named_tiuc_5810b2: "There is a monster named Tiucknuc that roams around outside of the village and cries after transforming himself into a baby."
  npc_override_malaya_malaya_there_one_way_all_mongku_f8c81f: "There is one way. All Mongkukurum have red eyes."
  npc_override_malaya_malaya_there_rumor_monster_came_970edf: "There is rumor that the monster came from the soul of a baby that never been born. So sad."
  npc_override_malaya_malaya_there_way_recognize_mons_b7610e: "Is there a way to recognize this monster?"
  npc_override_malaya_malaya_they_say_you_attack_buwa_820969: "They say you can attack Buwaya's weak point inside the box they carry if you ever get caught in one."
  npc_override_malaya_malaya_tool_store_ill_buy_needl_f33bd0: "At the Tool Store, 'Ill buy the needle and thread! You buy the hay to lose the needle in.'"
  npc_override_malaya_malaya_tsk_tsk_must_person_isn_b66a2a: "Tsk, tsk... Must be a person that isn't worthy of a Jellopy."
  npc_override_malaya_malaya_ugh_s_just_like_time_923369: "Ugh... it's just like that time before..."
  npc_override_malaya_malaya_unidentified_creature_ge_100cb2: "The unidentified creature gets a glimpse of you and disappears."
  npc_override_malaya_malaya_unidentified_creature_ge_550239: "The unidentified creature gets a glimpse of you, blushes and then disappears."
  npc_override_malaya_malaya_unidentified_creature_lo_33294c: "The unidentified creature looks at you and runs away."
  npc_override_malaya_malaya_village_chaotic_these_da_8ac4d4: "The village is chaotic these days. If you see someone with red eyes, try not to stare at their eyes."
  npc_override_malaya_malaya_village_chaotic_these_da_dc1c62: "The village is chaotic these days. Looks like Mongkukurum is back in the village."
  npc_override_malaya_malaya_village_chaotic_these_da_ef0acf: "The village is chaotic these days. Is it okay for me to be off like this?"
  npc_override_malaya_malaya_village_somewhat_stable_561c31: "The village is somewhat stable now but you should still be careful walking around at night."
  npc_override_malaya_malaya_welcome_724486: "Welcome."
  npc_override_malaya_malaya_welcome_port_malaya_fore_906bba: "Welcome to Port Malaya, foreigner.."
  npc_override_malaya_malaya_well_bangungot_means_los_0b52ec: "Well, for a Bangungot, it means losing its home so they get vengeful."
  npc_override_malaya_malaya_what_bad_timing_village_bf9c60: "What bad timing. The village is a bit unorganized at the moment so I'm actually closed. Sorry."
  npc_override_malaya_malaya_what_document_4ac7cc: "What document?"
  npc_override_malaya_malaya_what_fairy_52a247: "What is this fairy?"
  npc_override_malaya_malaya_what_happens_df8922: "What happens?"
  npc_override_malaya_malaya_what_port_all_clear_8d45e6: "What!! Port all clear!!"
  npc_override_malaya_malaya_when_kind_travelers_pick_2c2caf: "But when kind travelers pick up the baby, it turns back into its original form and attacks."
  npc_override_malaya_malaya_when_moon_swallowed_argh_4269b2: "When the moon was swallowed. Argh!"
  npc_override_malaya_malaya_when_you_try_sleep_near_08a336: "When you try to sleep near the pillar, it will keep awake by playing pranks at first."
  npc_override_malaya_malaya_where_you_like_go_049d91: "Where would you like to go?"
  npc_override_malaya_malaya_why_d77989: "Why?"
  npc_override_malaya_malaya_why_someone_steal_monste_6ad34b: "Why would someone steal a monster's hat? {0} must be desperate."
  npc_override_malaya_malaya_why_you_putting_flour_fl_e1d2fc: "'Why are you putting flour on that flower?'"
  npc_override_malaya_malaya_wow_what_7d8c01: "Wow. What is it?"
  npc_override_malaya_malaya_yes_monster_bad_trick_ki_ddb2e1: "Yes, this monster is bad to trick the kindness of travelers but..."
  npc_override_malaya_malaya_yes_there_weakness_even_7db092: "Yes, there is a weakness to even the worst monster that swallowed 6 moons already."
  npc_override_malaya_malaya_you_captivated_mongkukur_9e27a1: "You will be captivated by Mongkukurum if you stare at their eyes too long."
  npc_override_malaya_malaya_you_don_t_know_how_e5bbbd: "You don't know how far it is from here. Of course it's not free. Please come back with 10,000 Zeny. Sorry!"
  npc_override_malaya_malaya_you_eat_chili_chilly_day_e61bd5: "'You eat chili on a chilly day.'"
  npc_override_malaya_malaya_you_ever_seen_bongisungi_f348e4: "Have you ever seen Bongisungisu? I heard {0} is hunting down Bongisungisus."
  npc_override_malaya_malaya_you_like_go_back_alberta_2292a1: "Would you like to go back to Alberta with me?"
  npc_override_malaya_malaya_you_like_know_location_o_3584fd: "Would you like to know the location of other cars?"
  npc_override_malaya_malaya_you_must_also_look_out_410e52: "You must also look out to see if Bangungot lives in a tree you are about to cut down."
  npc_override_malaya_malaya_you_out_luck_visiting_vi_912552: "You are out of luck visiting the village at a time like this and not being welcomed."
  npc_override_malaya_malaya_you_re_around_here_take_e8da1d: "You're not from around here? Take care of yourself."
  npc_override_malaya_malaya_you_recognize_them_their_857348: "You can recognize them by their eyes but! You must remember one thing."
  npc_override_malaya_malaya_you_should_run_into_near_0b8505: "And you should run into the nearest building when you hear Wokwoks wings fluttering from afar."
  npc_override_malaya_quests_malaya_about_hospital_44e7d0: "About the hospital"
  npc_override_malaya_quests_malaya_about_monster_7736cb: "About the monster"
  npc_override_malaya_quests_malaya_about_monster_two_heads_6138a1: "About a monster with two heads"
  npc_override_malaya_quests_malaya_about_what_i_discovered_4df49e: "about what I discovered."
  npc_override_malaya_quests_malaya_according_legend_470617: "According to the legend,"
  npc_override_malaya_quests_malaya_according_legend_buwaya_802b89: "According to the legend, Buwaya kidnaps people and puts them in the sack on its back and then eats them later."
  npc_override_malaya_quests_malaya_according_what_i_ve_hear_174c4e: "According to what I've heard"
  npc_override_malaya_quests_malaya_acquire_inside_out_shirt_5998b0: "Acquire an ^4d4dffInside-out Shirt^000000 and give it to my daughter."
  npc_override_malaya_quests_malaya_add_npc_7a5da3: "Add an NPC."
  npc_override_malaya_quests_malaya_adjust_accumulated_value_372d2e: "Adjust the accumulated value of the Silver Cross."
  npc_override_malaya_quests_malaya_adjust_accumulated_value_7b2e12: "Adjust the accumulated value for the Dyestuff."
  npc_override_malaya_quests_malaya_adjust_accumulated_value_807c86: "Adjust the accumulated value for the Lesser Agimat."
