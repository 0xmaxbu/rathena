  npc_override_alde_gld_agit_main_te_invest_castle_defenses_0a57d7: "Invest in Castle Defenses"
  npc_override_alde_gld_agit_main_te_invest_commercial_growth_dba9f7: "Invest in commercial growth"
  npc_override_alde_gld_agit_main_te_materials_jormungand_bb2df9: "Materials for Jormungand"
  npc_override_alde_gld_agit_main_te_quit_fb25bb: "Quit."
  npc_override_alde_gld_agit_main_te_rent_pushcart_1aaad6: "Rent a Pushcart"
  npc_override_alde_gld_agit_main_te_rental_item_provided_d57f99: "Rental item provided"
  npc_override_alde_gld_agit_main_te_summon_guardian_a87722: "Summon Guardian"
  npc_override_alde_gld_agit_main_te_use_teleport_service_a7ef96: "Use Teleport Service"
  npc_override_alde_gld_guides_woe_te_ah_if_you_think_i_2d5aaf: "Ah if you think I'm mad because my name is missing from Kafragarten and if my way of speaking is a little stiff because of that"
  npc_override_alde_gld_guides_woe_te_also_their_buff_effects_cfa092: "Also, their buff effects get eliminated here."
  npc_override_alde_gld_guides_woe_te_also_we_lend_variety_bat_25ce08: "Also, we lend a variety of battlegears that you use only in corresponding regions for free."
  npc_override_alde_gld_guides_woe_te_also_we_prepared_variety_4afc5d: "Also, we have prepared a variety of battlegears, which are available anytime upon your request."
  npc_override_alde_gld_guides_woe_te_although_looks_very_simi_c66713: "Although it looks very similar to Luina"
  npc_override_alde_gld_guides_woe_te_although_rental_period_r_012e8f: "Although the rental period is relatively short, it's all free. So, don't miss the chance!"
  npc_override_alde_gld_guides_woe_te_as_they_say_action_speak_f07e9d: "As they say, 'action speaks louder than words.'"
  npc_override_alde_gld_guides_woe_te_been_named_honor_seven_r_c0723d: "It has been named in honor of the seven royal families and the kingdom."
  npc_override_alde_gld_guides_woe_te_course_primary_secondary_198ebb: "Of course, primary and secondary job classes are included as well."
  npc_override_alde_gld_guides_woe_te_different_rules_applied_5c5f0e: "Different rules are applied, and sufficient supports are provided since its atmosphere is similar to that of a gymnasium."
  npc_override_alde_gld_guides_woe_te_finally_kafra_service_es_5d4be6: "Finally, Kafra Service has established its own fortress!"
  npc_override_alde_gld_guides_woe_te_fortress_provided_kafra_e49f16: "This is a fortress provided by Kafra Service in cooperation with the royal family of Rune-Midgarts."
  npc_override_alde_gld_guides_woe_te_gloria_afb0c0: "Gloria?"
  npc_override_alde_gld_guides_woe_te_hehe_doesn_t_mean_i_4338f7: "Hehe doesn't it mean that I'm superior to Tailing?"
  npc_override_alde_gld_guides_woe_te_if_you_wish_return_valky_0abc0e: "If you wish to return to Valkyrie Realm, you can travel through warp."
  npc_override_alde_gld_guides_woe_te_job_classes_allowed_part_dcd679: "Job classes that are allowed to participate in siege battles at the fortresses in Kafragarten and Gloria regions are limited to ^4d4dffprimary and secondary job classes as well as those without expanded levels.^000000"
  npc_override_alde_gld_guides_woe_te_kafra_service_hopes_you_b6eb4a: "Kafra Service hopes that you would gain valuable experience in this new fortress."
  npc_override_alde_gld_guides_woe_te_kafra_service_its_utmost_8d3b28: "Kafra Service will do its utmost to bring joy to your life through Kafragarten."
  npc_override_alde_gld_guides_woe_te_kafragarten_aldebaran_ma_da1dff: "In Kafragarten of Aldebaran, managed by Gloria and Kafra Service, we have special rules that are slightly different from the existing ones."
  npc_override_alde_gld_guides_woe_te_kafragarten_built_region_91d8ac: "Kafragarten is built in the region of Luina, and in Valkyrie Realm, the royal family's Gloria is founded."
  npc_override_alde_gld_guides_woe_te_kafragarten_gloria_regio_56d027: "In Kafragarten and Gloria regions, you get separate missions."
  npc_override_alde_gld_guides_woe_te_kafragarten_like_mirrore_d4920e: "Kafragarten is like a mirrored image of Luina, so its structure is exactly the same as that of Luina."
  npc_override_alde_gld_guides_woe_te_make_good_use_7f2148: "Make good use of it"
  npc_override_alde_gld_guides_woe_te_may_biggest_difference_59255f: "This may be the biggest difference."
  npc_override_alde_gld_guides_woe_te_may_endless_glory_kingdo_ebdf9b: "May the endless glory be with the Kingdom of Rune-Midgarts and its seven royal families!"
  npc_override_alde_gld_guides_woe_te_may_glory_royal_family_o_d5ab4d: "May the glory of the royal family and Odin's protection be with you!"
  npc_override_alde_gld_guides_woe_te_means_kafra_s_garden_45c033: "It means 'Kafra's garden.'"
  npc_override_alde_gld_guides_woe_te_moreover_your_convenienc_80b191: "Moreover, for your convenience, we lend a variety of items that you can use only inside the corresponding fortress. So, take advantage of this opportunity."
  npc_override_alde_gld_guides_woe_te_msg_0c5466: "... ."
  npc_override_alde_gld_guides_woe_te_msg_3a286c: "... .."
  npc_override_alde_gld_guides_woe_te_new_stage_prepared_royal_a853ac: "It is a new stage prepared by the royal family in order to let more people participate in siege battles."
  npc_override_alde_gld_guides_woe_te_no_way_w_no_better_89c3c9: "No way. W is no better than me..hahaha."
  npc_override_alde_gld_guides_woe_te_novice_primary_secondary_af5504: "^4d4dffNovice, primary, and secondary job classes are allowed to participate as well as extra job class.^000000"
  npc_override_alde_gld_guides_woe_te_now_go_see_yourself_98d0df: "Now, go and see for yourself~"
  npc_override_alde_gld_guides_woe_te_obviously_they_re_only_v_6b122c: "But obviously, they're only valid in the regions of Kafragarten and Gloria."
  npc_override_alde_gld_guides_woe_te_oh_my_f009ab: "Oh my."
  npc_override_alde_gld_guides_woe_te_other_than_much_differen_22a5cd: "Other than that, it is not much different from the existing siege battles."
  npc_override_alde_gld_guides_woe_te_other_words_tertiary_job_c2afe3: "In other words, tertiary job class and jobs with expanded levels such as Kagerou and Oboro are not allowed."
  npc_override_alde_gld_guides_woe_te_please_keep_mind_you_sup_de27dd: "Please keep in mind that you are supposed to travel through warps here."
  npc_override_alde_gld_guides_woe_te_primary_secondary_extra_4ec1d6: "Primary, secondary, and extra job classes without expanded levels as well as primary and secondary job classes are allowed to participate only."
  npc_override_alde_gld_guides_woe_te_really_true_5c2787: "Is that really true?"
  npc_override_alde_gld_guides_woe_te_region_kafragarten_1906ac: "This is the region of Kafragarten."
  npc_override_alde_gld_guides_woe_te_royal_family_kafra_servi_b5c7d4: "The royal family and Kafra Service have prepared a variety of retal items for you."
  npc_override_alde_gld_guides_woe_te_s_been_newly_established_972ade: "It's been newly established in an effort to allow more users to gain experience through siege battles."
  npc_override_alde_gld_guides_woe_te_s_like_training_stage_so_ba7401: "It's like a training stage, so to speak."
  npc_override_alde_gld_guides_woe_te_should_fine_since_s_serv_f94760: "It should be fine since it's servicing different users."
  npc_override_alde_gld_guides_woe_te_siege_battle_te_siege_ba_7d79ff: "Siege Battle TE is ^4d4dffsiege battles designed for primary and secondary job classes only, ruling out tertiary job class.^000000"
  npc_override_alde_gld_guides_woe_te_siege_battles_regions_ka_58bb22: "In siege battles in the regions of Kafragarten and Gloria, only primary and secondary job classes as well as users without expanded levels are allowed to participate."
  npc_override_alde_gld_guides_woe_te_so_you_should_pay_close_02ae53: "So you should pay close attention."
  npc_override_alde_gld_guides_woe_te_some_them_related_emperi_508002: "Some of them are not related to Emperiums, so challenge yourself!"
  npc_override_alde_gld_guides_woe_te_tertiary_job_class_users_52117e: "^4d4dffTertiary job class and users with expanded levels are not allowed in Gloria and Kafragarten regions, where Siege Battle TE rules are applied.^000000"
  npc_override_alde_gld_guides_woe_te_warp_gate_here_let_you_c682eb: "This warp gate here will let you go into Gloria region."
  npc_override_alde_gld_guides_woe_te_we_call_siege_battle_te_709daa: "We call it Siege Battle TE."
  npc_override_alde_gld_guides_woe_te_welcome_gloria_c797a9: "Welcome to Gloria."
  npc_override_alde_gld_guides_woe_te_welcome_gloria_fortress_90026e: "Welcome to Gloria, the fortress in Siege Battle TE. We provide services in cooperation with Kafra and the major royal families of the kingdom."
  npc_override_alde_gld_guides_woe_te_welcome_kafra_service_we_f1a0a3: "Welcome to Kafra Service~ We always provide the best to our customers."
  npc_override_alde_gld_guides_woe_te_what_kafragarten_74eb94: "What is Kafragarten?"
  npc_override_alde_gld_guides_woe_te_who_took_castle_named_af_1d92d1: "Who took the castle that was named after me, W?"
  npc_override_alde_gld_guides_woe_te_whole_city_closely_resem_9f8c73: "The whole city closely resembles Valkyrie Realm, and here resides the aspirations of the royal family for everyone."
  npc_override_alde_gld_guides_woe_te_you_now_fortress_gloria_224f1a: "You are now at the fortress in Gloria."
  npc_override_alde_gld_guides_woe_te_you_should_troubles_unde_da82aa: "You should not have troubles understanding the new rules since it is simply about setting a limit on qualifications for participation."
  npc_override_alde_gld_guides_woe_te_you_travel_kafragarten_u_7060c4: "You can travel to Kafragarten using warp."
  npc_override_alde_gld_guides_woe_te_you_travel_luina_using_w_4318ed: "You can travel to Luina using this warp here."
  npc_override_alde_gld_guides_woe_te_you_travel_these_warps_h_eb3704: "You can travel by these warps here."
