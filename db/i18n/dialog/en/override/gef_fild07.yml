Body:
  npc_override_gef_fild07_quest_fabre_ah_ok_i_think_you_fa3a43: "Ah, ok I think you can help me out by hunting some Fabres."
  npc_override_gef_fild07_quest_fabre_amazing_you_did_speed_6cc3cd: "Amazing, you did that with speed."
  npc_override_gef_fild07_quest_fabre_any_progress_you_ve_made_b3e247: "Any progress that you've made will be erased"
  npc_override_gef_fild07_quest_fabre_come_back_when_you_ve_44350c: "Come back when you've finished your task and I will give you a small reward."
  npc_override_gef_fild07_quest_fabre_complete_community_servi_6b32e8: "complete this community service project."
  npc_override_gef_fild07_quest_fabre_hello_my_name_langry_525019: "Hello, my name is Langry."
  npc_override_gef_fild07_quest_fabre_hmm_i_don_t_think_1d8eb5: "Hmm, I don't think you've hunted 100 yet..."
  npc_override_gef_fild07_quest_fabre_hmm_i_don_t_think_2144d7: "Hmm, I don't think you've hunted 50 yet..."
  npc_override_gef_fild07_quest_fabre_hmm_i_don_t_think_5d960b: "Hmm, I don't think you've hunted 150 yet..."
  npc_override_gef_fild07_quest_fabre_how_many_you_like_hunt_7fc82d: "How many would you like to hunt?"
  npc_override_gef_fild07_quest_fabre_i_complete_community_ser_cf4547: "I have to complete this community service, but I am just too lazy."
  npc_override_gef_fild07_quest_fabre_i_need_collect_fluff_7a1d4d: "I need to collect ^0000CE25 Fluff^000000 to"
  npc_override_gef_fild07_quest_fabre_i_need_fluff_f72e12: "I need ^00CE0025 Fluff^000000."
  npc_override_gef_fild07_quest_fabre_i_see_no_fluff_wait_762d2b: "I see no Fluff, wait yea I do it's the lies coming from your mouth."
  npc_override_gef_fild07_quest_fabre_if_you_change_your_mind_3f2210: "If you change your mind, please come back."
  npc_override_gef_fild07_quest_fabre_menu_fabres_af6f6c: "50 Fabres:100 Fabres:150 Fabres"
  npc_override_gef_fild07_quest_fabre_menu_gather_f0e7ee: "Gather Items:Hunt Fabres:Cancel"
  npc_override_gef_fild07_quest_fabre_menu_i_dd528a: "I have some Fluff:What was that again?"
  npc_override_gef_fild07_quest_fabre_menu_sure_859d29: "Sure:No"
  npc_override_gef_fild07_quest_fabre_menu_yes_141459: "Yes:No"
  npc_override_gef_fild07_quest_fabre_menu_yes_755efb: "Yes:No:I want to quit"
  npc_override_gef_fild07_quest_fabre_oh_here_you_go_should_c91e12: "Oh and here you go, this should help you get stronger, faster!"
  npc_override_gef_fild07_quest_fabre_ok_then_well_come_back_0e1574: "Ok then, well come back here if you change your mind."
  npc_override_gef_fild07_quest_fabre_please_5c273b: "Please?"
  npc_override_gef_fild07_quest_fabre_please_kill_fabres_5450df: "Please kill 50 Fabres."
  npc_override_gef_fild07_quest_fabre_please_kill_fabres_83e310: "Please kill 100 Fabres."
  npc_override_gef_fild07_quest_fabre_please_kill_fabres_e9fd86: "Please kill 150 Fabres."
  npc_override_gef_fild07_quest_fabre_really_1acc34: "Really?!"
  npc_override_gef_fild07_quest_fabre_remember_i_need_help_hun_301c05: "Remember, I need help hunting Fabres so go and hunt 100 of them."
  npc_override_gef_fild07_quest_fabre_remember_i_need_help_hun_3a73f4: "Remember, I need help hunting Fabres so go and hunt 150 of them."
  npc_override_gef_fild07_quest_fabre_remember_i_need_help_hun_4abe80: "Remember, I need help hunting Fabres so go and hunt 50 of them."
  npc_override_gef_fild07_quest_fabre_s_great_82bb27: "That's great!"
  npc_override_gef_fild07_quest_fabre_thank_you_fluff_helps_me_cf7aaf: "Thank you for the Fluff. This helps me out greatly."
  npc_override_gef_fild07_quest_fabre_you_finished_hunting_fab_309e16: "Have you finished hunting the 150 Fabres?"
  npc_override_gef_fild07_quest_fabre_you_finished_hunting_fab_c86b3b: "Have you finished hunting the 50 Fabres?"
  npc_override_gef_fild07_quest_fabre_you_know_what_i_even_5d8e9c: "You know what? I can even reward you a little for helping me."
  npc_override_gef_fild07_quest_fabre_you_may_just_most_unlike_85ba09: "You may just be the most unlikely person ever, recycle a few Fabres and come back."
  npc_override_gef_fild07_quest_fabre_you_sure_you_want_stop_507e20: "Are you sure that you want to stop hunting?"
  npc_override_gef_fild07_quest_fabre_you_think_you_help_me_63549e: "Do you think you can help me?"
