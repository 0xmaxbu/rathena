Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_mjolnir_01_StPatrick_2008_after_cloud_dust_smoke_d_f68925: "After A cloud of dust and smoke has dissipated,"
  npc_override_mjolnir_01_StPatrick_2008_ah_well_rested_i_hope_45da66: "Ah, well rested I hope?"
  npc_override_mjolnir_01_StPatrick_2008_aye_i_understand_3fd88e: "Aye, I understand."
  npc_override_mjolnir_01_StPatrick_2008_boom_fec1ac: "*BOOM!*"
  npc_override_mjolnir_01_StPatrick_2008_box_must_contain_o_riley_54c61f: "This box must contain O'Riley's valuables."
  npc_override_mjolnir_01_StPatrick_2008_climb_mountain_until_nor_4f649e: "Climb the mountain until north ye can travel no farther."
  npc_override_mjolnir_01_StPatrick_2008_come_here_me_now_come_cce2ba: "Come here to me now, come here and I'll tell ya something."
  npc_override_mjolnir_01_StPatrick_2008_course_ye_need_great_num_1a526a: "Course, Ye would need a great number of them, Ye would need at least ^FF0000200 Firecreackers^000000"
  npc_override_mjolnir_01_StPatrick_2008_fair_bounty_ill_gotten_c_9fa3d5: "It be a fair bounty for the ill-gotten coins."
  npc_override_mjolnir_01_StPatrick_2008_find_my_treasure_true_a21a54: "To find my treasure it be true."
  npc_override_mjolnir_01_StPatrick_2008_go_ahead_b1f554: "Go ahead."
  npc_override_mjolnir_01_StPatrick_2008_hidden_mountain_side_me_d9c709: "Hidden in the mountain side, me treasure is there."
  npc_override_mjolnir_01_StPatrick_2008_hidden_secret_place_trea_452838: "Hidden in a secret place the treasure would be safe until I returned to the world the following year."
  npc_override_mjolnir_01_StPatrick_2008_hmm_9c4d28: "Hmm..."
  npc_override_mjolnir_01_StPatrick_2008_i_am_so_happy_3e96ae: "I am so happy,"
  npc_override_mjolnir_01_StPatrick_2008_i_ask_ye_ya_help_c586f6: "I will ask ye, will ya help get me treasure back?"
  npc_override_mjolnir_01_StPatrick_2008_i_even_begun_brewing_me_27f44b: "I have not even begun brewing me famous green ale on account of this mess."
  npc_override_mjolnir_01_StPatrick_2008_i_ll_reward_ye_one_b5ae15: "I'll reward ye with one jug of ale for ^0000FF1 Golden Coins^000000, ^0000FF5 Silver Coins^000000, or ^0000FF10 Bronze Coins^000000."
  npc_override_mjolnir_01_StPatrick_2008_i_ll_starting_up_me_eef0df: "I'll be starting up me brew right away"
  npc_override_mjolnir_01_StPatrick_2008_i_made_safe_place_hide_159905: "I made a safe place to hide me treasure."
  npc_override_mjolnir_01_StPatrick_2008_i_pulled_i_heaved_pushed_456108: "I pulled and I heaved and pushed, but the hiding place would not budge."
  npc_override_mjolnir_01_StPatrick_2008_i_so_generous_give_you_1804dd: "I would be so generous to give you some of my famous brew if you would bring me the ill-gotten gains carried by those vile snakes"
  npc_override_mjolnir_01_StPatrick_2008_i_thought_meself_i_am_590b18: "I thought to meself, I am very clever to hide the treasure from the snakes."
  npc_override_mjolnir_01_StPatrick_2008_i_traveled_me_cache_gold_1c3e24: "I traveled to me cache of gold I found it to be safe and undisturbed."
  npc_override_mjolnir_01_StPatrick_2008_i_understanding_if_you_t_8b2802: "I be understanding if you can't get to it to be sure to be sure."
  npc_override_mjolnir_01_StPatrick_2008_i_ve_learned_me_lesson_12c0e8: "I've learned me lesson and will never forget how those vile snakes have wronged me."
  npc_override_mjolnir_01_StPatrick_2008_if_you_find_one_treasure_9c78c3: "And if you find one of the treasures of my kin please bring me those coins so that the snakes don't get them."
  npc_override_mjolnir_01_StPatrick_2008_if_you_moment_spare_cc3814: "If you have a moment to spare."
  npc_override_mjolnir_01_StPatrick_2008_let_s_bring_box_o_0b886c: "Let's bring the box to O'Riley."
  npc_override_mjolnir_01_StPatrick_2008_make_journey_city_magici_960a70: "Make the journey to the city of magicians."
  npc_override_mjolnir_01_StPatrick_2008_maybe_o_riley_knows_way_992aeb: "Maybe O'Riley knows a way to move the rocks."
  npc_override_mjolnir_01_StPatrick_2008_me_gratitude_knows_no_bo_3752e5: "Me gratitude knows no bounds!"
  npc_override_mjolnir_01_StPatrick_2008_me_hiding_spot_might_har_14b45f: "Me hiding spot is a might hard to crack."
  npc_override_mjolnir_01_StPatrick_2008_menu_bronze_6c0099: "Bronze Coins:Silver Coins:Gold Coins:Quit."
  npc_override_mjolnir_01_StPatrick_2008_menu_sure_a7d180: "Sure, I can help you.:I'm too busy."
  npc_override_mjolnir_01_StPatrick_2008_menu_use_304223: "Use Firecrackers.:Ignore"
  npc_override_mjolnir_01_StPatrick_2008_my_hiding_place_too_clev_0167e8: "My hiding place was too clever."
  npc_override_mjolnir_01_StPatrick_2008_my_treasure_i_give_my_9149dc: "To my treasure I give my secret to you."
  npc_override_mjolnir_01_StPatrick_2008_oh_0fd77a: "Oh?"
  npc_override_mjolnir_01_StPatrick_2008_oh_i_fool_still_cce93d: "Oh, but I was a fool still."
  npc_override_mjolnir_01_StPatrick_2008_oh_welcome_back_7e1550: "Oh, welcome back!"
  npc_override_mjolnir_01_StPatrick_2008_over_bridge_across_water_151a3a: "Over the bridge and across the water"
  npc_override_mjolnir_01_StPatrick_2008_passed_stone_steps_set_i_0a3851: "Passed the stone steps set into the air."
  npc_override_mjolnir_01_StPatrick_2008_rocks_won_t_budge_d75d66: "The rocks won't budge."
  npc_override_mjolnir_01_StPatrick_2008_seems_snakes_returned_ye_4972b2: "It seems that the snakes have returned this year and are here to steal my treasure again."
  npc_override_mjolnir_01_StPatrick_2008_snakes_carry_coins_my_ki_569a84: "The snakes carry the coins of my kinsmen and must be punished."
  npc_override_mjolnir_01_StPatrick_2008_snakes_carry_coins_my_ki_df82a0: "The snakes carry the coins of my kindsmen and must be punished."
  npc_override_mjolnir_01_StPatrick_2008_snakes_carry_too_many_me_a823d1: "The snakes carry too many of me kinsmen's coin I be passing out pints of me brew as reward for their return."
  npc_override_mjolnir_01_StPatrick_2008_so_listen_well_make_no_1c013d: "So, listen well and make no omissions."
  npc_override_mjolnir_01_StPatrick_2008_so_once_again_i_am_d55551: "So once again, I am without treasure this year."
  npc_override_mjolnir_01_StPatrick_2008_so_what_kind_coin_ye_320a8b: "So, what kind of coin have ye brought?"
  npc_override_mjolnir_01_StPatrick_2008_thank_you_coming_again_3e827f: "Thank you for coming by again."
  npc_override_mjolnir_01_StPatrick_2008_thank_you_here_s_your_0fbe76: "Thank you. Here's your ale~"
  npc_override_mjolnir_01_StPatrick_2008_thank_you_listening_me_t_01e136: "Thank you for listening to me tale."
  npc_override_mjolnir_01_StPatrick_2008_thank_you_returning_me_t_7d368d: "Thank you for returning me treasure!"
  npc_override_mjolnir_01_StPatrick_2008_these_past_years_i_ve_8a508b: "These past years I've come to see the world and each time the snakes have stolen me treasure."
  npc_override_mjolnir_01_StPatrick_2008_tis_fine_day_a2bc6d: "Tis a fine day it be."
  npc_override_mjolnir_01_StPatrick_2008_what_did_you_341410: "What did you do?"
  npc_override_mjolnir_01_StPatrick_2008_what_happened_e9ef65: "What happened?"
  npc_override_mjolnir_01_StPatrick_2008_when_ye_had_moment_rest_d0c0f5: "When ye have had a moment to rest ye legs, come talk to me again and we may speak again"
  npc_override_mjolnir_01_StPatrick_2008_ye_fine_folks_land_been_e37100: "Ye fine folks of this land have been so gracious to recover me treasure again and again."
  npc_override_mjolnir_01_StPatrick_2008_ye_had_long_journey_whic_8e2c8e: "But ye have had a long journey, for which I am very grateful."
  npc_override_mjolnir_01_StPatrick_2008_ye_might_try_some_firecr_c62d16: "Ye might try some Firecrackers."
  npc_override_mjolnir_01_StPatrick_2008_ye_must_find_way_break_ed3fab: "Ye must find a way to break it open."
  npc_override_mjolnir_01_StPatrick_2008_ye_need_mighty_explosion_448c7a: "Ye will need a mighty explosion to free the cache to be sure."
  npc_override_mjolnir_01_StPatrick_2008_year_i_made_me_journey_0d3898: "This year, I have made me journey to see the outside world once again."
  npc_override_mjolnir_01_StPatrick_2008_you_buried_firecrackers_1686a4: "You buried 200 Firecrackers under the pile of rocks."
  npc_override_mjolnir_01_StPatrick_2008_you_found_me_treasure_ye_7980e8: "Have you found me treasure yet, have you?"
  npc_override_mjolnir_01_StPatrick_2008_you_light_fuse_cd0d3a: "You light the fuse."
  npc_override_mjolnir_01_StPatrick_2008_you_ve_found_box_between_34a1eb: "You've found a box between the rocks and soil."
  npc_override_mjolnir_01_StPatrick_2008_you_ve_found_pile_rocks_fa2569: "- You've found a pile of rocks covered with soil. -"
