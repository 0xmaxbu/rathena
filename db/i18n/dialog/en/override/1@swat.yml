Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@swat_HeartHunterWarBase_after_follow_instruction_f01eae: "After that, follow the instruction of the chief of your unit. Once the gate to the base is opened, talk to the Striker Unit Commander over there and start."
  npc_override_1@swat_HeartHunterWarBase_all_remaining_force_oute_808fda: "All the remaining force has in outer boundary has been cleaned up."
  npc_override_1@swat_HeartHunterWarBase_any_case_most_operation_3b41bc: "In any case, most of the operation must be anti-personnel damage and the base facilities have to be maintained whenever possible."
  npc_override_1@swat_HeartHunterWarBase_attack_base_detected_eve_0d5297: "Attack to the base detected. Everyone, start a defense tactic."
  npc_override_1@swat_HeartHunterWarBase_doesn_t_hurt_me_334577: "It doesn't hurt me..."
  npc_override_1@swat_HeartHunterWarBase_enemies_approaching_nd_d_3d9a9a: "Enemies are approaching the 2nd defensive base. Phase 2 is announced."
  npc_override_1@swat_HeartHunterWarBase_enemies_disabled_third_s_8d5c40: "Enemies disabled the Third security system. Base defense failed."
  npc_override_1@swat_HeartHunterWarBase_enemies_reached_section_ba51f0: "Enemies reached Section 2. Security system disabled."
  npc_override_1@swat_HeartHunterWarBase_enemies_reached_st_secur_9a1e1b: "Enemies reached the 1st security system. Security system is disabled."
  npc_override_1@swat_HeartHunterWarBase_enter_door_front_you_03932c: "Enter the door in front of you."
  npc_override_1@swat_HeartHunterWarBase_entry_also_impossible_if_d7750b: "^ff0000The entry is also impossible if the Memorial Dungeon has not been created as an operation field.^000000"
  npc_override_1@swat_HeartHunterWarBase_explain_situation_me_a4cc66: "Explain the situation to me."
  npc_override_1@swat_HeartHunterWarBase_field_operation_check_wh_23919c: "The field of operation is {0} Check whether the operation was applied properly."
  npc_override_1@swat_HeartHunterWarBase_five_minutes_until_main_529190: "Five minutes until the main unit arrives."
  npc_override_1@swat_HeartHunterWarBase_give_him_gunpowder_ea936f: "Give him the gunpowder"
  npc_override_1@swat_HeartHunterWarBase_goint_outer_boundary_hea_e47c10: "^ff0000Goint to the outer boundary of Heart Hunter War Base without clearing the Heart Hunter War Base is prohibited. Also, you cannot enter the Heart Hunter War Base that has already been cleared. Please check your operation point^000000"
  npc_override_1@swat_HeartHunterWarBase_gunpowder_ready_b36ee8: "Is the gunpowder ready?"
  npc_override_1@swat_HeartHunterWarBase_hey_who_s_there_255907: "Hey, who's there?"
  npc_override_1@swat_HeartHunterWarBase_hmm_engineers_need_repai_799abb: "Hmm. The engineers need to repair the occupied base. It's time for battle force step outside."
  npc_override_1@swat_HeartHunterWarBase_hmm_good_job_let_us_04d703: "Hmm. Good job. Let us leave the training ground. The gateway is upstairs. Go up the stairs behind me."
  npc_override_1@swat_HeartHunterWarBase_hmm_great_let_s_start_1dc721: "Hmm. Great. Let's start right away."
  npc_override_1@swat_HeartHunterWarBase_hmm_you_haven_t_received_bf3f07: "Hmm, you haven't received a briefing yet? Since we don't have enough time, let me explain briefly."
  npc_override_1@swat_HeartHunterWarBase_hmm_you_our_troop_since_27ab3b: "Hmm, you are our troop? Since the scouting is not over yet, don't wander around here carelessly."
  npc_override_1@swat_HeartHunterWarBase_i_am_executing_my_missio_61ba1a: "I am executing my mission with the Rebellion unit."
  npc_override_1@swat_HeartHunterWarBase_i_got_i_asked_little_65a02d: "I got it. I asked a little too much."
  npc_override_1@swat_HeartHunterWarBase_i_m_ready_7bbf8d: "I'm ready."
  npc_override_1@swat_HeartHunterWarBase_i_m_talking_your_leader_8b22df: "I'm talking to your leader now {0}."
  npc_override_1@swat_HeartHunterWarBase_i_never_push_suspicious_8f99f9: "I never push a suspicious button."
  npc_override_1@swat_HeartHunterWarBase_i_repeat_intruders_detec_f46ae5: "I repeat. Intruders detected in the restricted area. Heart Hunters, heighten the security!"
  npc_override_1@swat_HeartHunterWarBase_i_see_c52c6e: "I see."
  npc_override_1@swat_HeartHunterWarBase_i_see_since_we_hurry_438a02: "I see. Since we are in a hurry, complete your preparation quickly and let me know."
  npc_override_1@swat_HeartHunterWarBase_if_necessary_we_reinforc_3544b9: "If necessary, we can reinforce our firearms using the terrain features in the field... But it must be minimized."
  npc_override_1@swat_HeartHunterWarBase_if_you_activate_device_t_b234a1: "If you activate the device, they will open a narrow passage you can barely go through."
  npc_override_1@swat_HeartHunterWarBase_if_you_deal_monsters_arb_addcd3: "^ff0000If you deal with monsters arbitrarily inside a dungeon, such as Monster taming, it will not be regarded as a normal progress. Please be aware of it.^000000"
  npc_override_1@swat_HeartHunterWarBase_if_you_find_enemy_don_044a5a: "If you find an enemy, don't forget to kill it without reporting me."
  npc_override_1@swat_HeartHunterWarBase_if_you_ready_i_let_af9526: "If you are ready, I will let you know the attack time."
  npc_override_1@swat_HeartHunterWarBase_ignore_47715f: "Ignore it"
  npc_override_1@swat_HeartHunterWarBase_intruders_detected_deep_6893d0: "Intruders detected deep in the Section 3. Heart Hunters, protect the base at all cost!"
  npc_override_1@swat_HeartHunterWarBase_intruders_detected_restr_f6073c: "Intruders detected in the restricted area. Heart Hunters, heighten the security!"
  npc_override_1@swat_HeartHunterWarBase_intruders_detected_secti_b27e1c: "Intruders detected in Section 2. Heart Hunters, heighten the security!"
  npc_override_1@swat_HeartHunterWarBase_julian_we_check_her_litt_40f883: "Julian We have to check her a little longer..."
  npc_override_1@swat_HeartHunterWarBase_just_thought_96acbc: "Just a thought."
  npc_override_1@swat_HeartHunterWarBase_let_me_fcf34b: "Let me do it."
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_094545: "Ebel: Am I... being disposed?"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_28bed3: "Ebel: Then..."
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_2b7abf: "Ebel: Sorry, no escape."
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_37b385: "Ebel: I will stop him."
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_4dc4e0: "Ebel: Running away?"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_505639: "Ebel: Then you are not disposing me?"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_71a8c2: "Ebel: What was that thing you used just now?"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_aa3017: "Ebel: I don't remember. Has he come to destroy this place?"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_aec004: "Ebel: Why didn't you kill me?"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_c4d24b: "Ebel: Ebel follows Julian's instruction."
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_caec8c: "Ebel: ... Who are you?"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_d5c100: "Ebel: Has he come to destroy this place?"
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_e0cd85: "Ebel: Meal..."
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_e5ecf4: "Ebel: Did I miss..."
  npc_override_1@swat_HeartHunterWarBase_menu_ebel_fa80fb: "Ebel: Julian, is that an enemy?"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_02f313: "Julian: Now, move out!"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_076d35: "Julian: As before, please attack without mercy, just like in a real combat."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_089576: "Julian: This time, the defensive force and great number of force upgraded during the battle will be input."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_08c171: "Julian: This is the girl we captured last time."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_0e2257: "Julian: Good. Put her in a jail. She is a research object so handle her with care."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_117c85: "Julian: Wait!"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_155a04: "Julian: over your ears to protect your eardrum! I am exploding it now!"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_1f9441: "Julian: Since we occupied the communication room, it is practically our victory. We don't seem to have taken much damage."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_2162e0: "Julian: It's almost done! Stick to it!"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_2bc954: "Julian: Was it too easy? In Section 2, we also have a training for the annihilation operation."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_2c10e2: "Julian: Section 1 taken. Those in charge of Section 1's defense must assemble behind the barrack later."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_2c4ac3: "Julian: Stop nagging. The training is over, get ready for the meal. It's time to eat."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_2c7a25: "Julian: If you come through the narrow passage and annihilate half of the force, I will judge that the defense has failed."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_31e5ad: "Julian: Please help us in the remaining training."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_3259c3: "Julian: Great. We have finished making the explosive."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_3dc415: "Julian: Yes. Go and change into casual clothes."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_3f1d4d: "Julian: If you operate the controller in front of me, the 3rd course begins."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_46f65b: "Julian: Oh, how many trainings have we had so far?"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_478c40: "Julian: I have constructed an automatic defense system by extensively installing the security system of Heart Hunter guys."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_4a4990: "Julian: You go up and check if there is any remaining force or threat."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_4b5973: "Julian: I didn't want to kill our people at the same time. Besides... You are an unknown force to us"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_4c2f09: "Julian: Hey! I will back you up from a long range. Hang on until then!"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_4e583e: "Julian: Excellent. Let's go forward."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_50d32d: "Julian: What are you talking about? Disposing is only for machines."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_5119b7: "Julian: Damn, escaping will be tough."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_51d41a: "Julian: Great. Well done, Ebel. No, don't kick the dog... He's not an enemy."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_559727: "Julian: You might find this place unfamiliar."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_5ab533: "Julian: What? Remaining force?"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_5c5474: "Julian: But I don't think Ebel is using 100% of her power."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_5d23a8: "Julian: We still have some time until our main unit arrives. Keep the caution and standby."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_5f1d9d: "Julian: Now, let me blow them away!"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_621fc3: "Julian: The goal is to check how we can block enemies when we use the automatic devices and forces together in our defense tactic."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_629009: "Julian: You have easily annihilated the upgraded force in Section 2. I'd better change our defensive tactic."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_63c881: "Julian: We don't know who she is and where she is from. All we know is her name, Ebel..."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_68a774: "Julian: Don't worry about this place. I can handle it with the remaining gunpowder."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_6e0907: "Julian: She is in such a mechanical status that it is difficult to see a human in her. But she doesn't attack anyone, unless judged as an enemy."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_6e8fb4: "Julian: This might be the last security system. But we ran out of gunpowder."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_70ce0e: "Julian: The battle can start while you are finding gunpowder. Prepare for it."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_783db0: "Julian: Well, it's a nice gunpowder."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_843ad9: "Julian: There is a security system being operated in front of this. If you take one step ahead, you will be riddled with bullets."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_871ad8: "Julian: Let me go first. I have to deal with the obstacles in front."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_874e92: "Julian: According to the estimation, there must be a greeting here. But there is nothing."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_903d5a: "Julian: These might be sharpshooters around, so do not gather. Accomplish the operation individually."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_94ae8a: "Julian: Without any previous memory or rationality, only the intention to protect the base is left in her."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_954f45: "Julian: I am not trying to underestimate your combat ability"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_966bb9: "Julian: It's a sort of defense training. It is to understand how much force we require to defend this area."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_9cbbf8: "Julian: We are in trouble from the beginning."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_9d5271: "Julian: You have to help me in finding out her potential ability."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_a1e66a: "Julian: Although we cannot use it to move our troops, it is a perfect location to experience a mock combat."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_a840d0: "Julian: Now, please attack without mercy, just like in a real battle."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_a8e0c9: "Julian: By the way, the defensive device left in front of you will be quite different from those you have faced so far."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_a96fc7: "Julian: So we remodeled it as a training ground to have a mock combat similar to the previous combat."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_ba813a: "Julian: From here, we split. Each of us will find the weak spots and annihilate the enemies."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_c13a78: "Julian: Great! Stay away from her! Let me give a big shop to her!"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_c8fdd4: "Julian: Don't take your time and move out"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_cc5d2f: "Julian: This is good enough to get rid of the security system and the Heart Hunter guys who rushed a moment ago."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_d4f691: "Julian: Hang on for a minute. I am getting ready to suppress her"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_d6508b: "Julian: We must secure a path for the cleanup party. Find gunpowder nearby."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_d6dccc: "Julian: Evade foe now! She is not an ordinary human."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_d7166d: "Julian: Great. Shall we go now!"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_d89695: "Julian: Well, looks like they started the battle against our members who had scattered. We might be in danger soon."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_dd39f5: "Julian: I'm glad you're all safe."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_e1d96f: "Julian: Something is coming!! Evade!!"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_e53b33: "Julian: Well... Sort of."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_e59859: "Julian: There was a pretty large space behind the zone that we had occupied."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_e6bd7b: "Julian: You will play the role of the invaders. Our troops will disguise as Heart Hunters and defend."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_e90b7c: "Julian: Oh, the person in front of you is your enemy only for a while."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_eeb9a2: "Julian: Ebel~ You confronted this fellow last time. Do you remember?"
  npc_override_1@swat_HeartHunterWarBase_menu_julian_ef328a: "Julian: We must capture you alive and find out about you."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_f39f9e: "Julian: Hmm. Good job. Let us leave the training ground. The gateway is upstairs. Go up the stairs behind me."
  npc_override_1@swat_HeartHunterWarBase_menu_julian_fef0c8: "Julian: It's a paralyzing shot. When it hits someone, it creates a confusion in the nerve system."
  npc_override_1@swat_HeartHunterWarBase_menu_options_720bb4: "???: Who's there...?"
  npc_override_1@swat_HeartHunterWarBase_menu_security_7f3b9a: "Security system: Emergency situation is discharged. Terminating the automatic defense device."
  npc_override_1@swat_HeartHunterWarBase_menu_security_f42165: "Security system: Phase 2 of the emergency situation is announced. Automatic defensive device is activated."
  npc_override_1@swat_HeartHunterWarBase_menu_voice_073ae0: "Voice communication: We have occupied the communication room of Heart Hunter. The battle seems to have ended. All unit members defend the occupied strongholds and standby."
  npc_override_1@swat_HeartHunterWarBase_msg_04aa49: "-----------------------"
  npc_override_1@swat_HeartHunterWarBase_msg_6eae3a: "..."
  npc_override_1@swat_HeartHunterWarBase_msg_e78ceb: "---------------------"
  npc_override_1@swat_HeartHunterWarBase_no_don_t_look_me_6f3421: "No, don't look at me like that. This girl would never talk to other guys. So I became in charge of her."
  npc_override_1@swat_HeartHunterWarBase_oh_isn_t_first_time_1149a1: "Oh, isn't this the first time I tell you this? I would be glad if you can examine the facilities. What do you think?"
  npc_override_1@swat_HeartHunterWarBase_once_we_ready_operation_4bf5c5: "Once we are ready for the operation, you will get in there with me."
  npc_override_1@swat_HeartHunterWarBase_only_party_leader_talk_j_723ba1: "^ff0000Only the party leader can talk to Julian in detail.^000000"
  npc_override_1@swat_HeartHunterWarBase_open_soon_once_gate_base_a5d966: "It will open soon. Once the gate to the base is opened, talk to the Striker Unit Commander over there and start."
  npc_override_1@swat_HeartHunterWarBase_our_advance_party_secure_948171: "Our advance party has secured the boundary surface in the southern base. We will take that route to move to the central part. And each striker unit will move in an individual route."
  npc_override_1@swat_HeartHunterWarBase_party_entering_d3d912: "{0} of the party, {1}, is entering the {2}."
  npc_override_1@swat_HeartHunterWarBase_place_dangerous_you_must_acfbd0: "This place is dangerous and you must leave quickly. We are near the enemy base."
  npc_override_1@swat_HeartHunterWarBase_push_b69d1c: "^ff0000[Do not push]^000000"
  npc_override_1@swat_HeartHunterWarBase_red_button_e64a36: "red button."
  npc_override_1@swat_HeartHunterWarBase_remaining_defensive_forc_be02db: "Remaining defensive force {0}%"
  npc_override_1@swat_HeartHunterWarBase_remaining_heart_hunter_23dff6: "Remaining {0} Heart Hunter"
  npc_override_1@swat_HeartHunterWarBase_s_real_ad3a6d: "... It's real."
  npc_override_1@swat_HeartHunterWarBase_sake_mobility_we_abandon_d8fa15: "For the sake of mobility, we abandoned heavy firearms. Since our top priority mission is to occupy the base without destroying it much, most of explosive weapons have been excluded as well."
  npc_override_1@swat_HeartHunterWarBase_security_system_here_con_e7fa62: "This security system here controls plenty of system devices over there."
  npc_override_1@swat_HeartHunterWarBase_seems_like_adventurer_wi_c2586e: "^0000ffSeems like an adventurer without his/her unit (party) cannot enter.^000000"
  npc_override_1@swat_HeartHunterWarBase_seems_like_base_been_arr_aac834: "^0000ffSeems like the base has been arranged inside. ^000000"
  npc_override_1@swat_HeartHunterWarBase_sounds_cool_you_like_for_703078: "Sounds cool. You are like a foreign legion, so stay beside me during the operation."
  npc_override_1@swat_HeartHunterWarBase_stop_812f80: "Stop it."
  npc_override_1@swat_HeartHunterWarBase_stop_which_unit_you_acco_985243: "Stop, which unit are you from? According to your answer, we may have to suppress you using an armed force."
  npc_override_1@swat_HeartHunterWarBase_takes_some_time_assembli_140bdc: "It takes some time in assembling the explosive. You go up and check if there is any threat."
  npc_override_1@swat_HeartHunterWarBase_there_broad_vacant_land_9cd8c0: "There is a broad vacant land on the outer boundary of the base we have occupied. We built a training ground there, but the facilities are imperfect. I need elite personnel who can examine it."
  npc_override_1@swat_HeartHunterWarBase_there_intruder_restricte_fc52c0: "There is an intruder in the restricted area. All unit members assemble."
  npc_override_1@swat_HeartHunterWarBase_there_warning_written_re_90ea0b: "There is a warning written in red color."
  npc_override_1@swat_HeartHunterWarBase_took_me_more_than_week_5fe373: "It took me more than a week until I was able to talk to her. Now she speaks well."
  npc_override_1@swat_HeartHunterWarBase_unknown_error_occurred_58bda4: "An unknown error has occurred."
  npc_override_1@swat_HeartHunterWarBase_unless_you_activate_devi_1fb1ad: "Unless you activate the device, the defensive training does not start. Activate it when you are ready."
  npc_override_1@swat_HeartHunterWarBase_wait_while_we_proceed_on_09fc30: "Wait for a while {0} we will proceed once your unit leader comes."
  npc_override_1@swat_HeartHunterWarBase_way_did_you_receive_brie_e3cf3a: "By the way, did you receive a briefing from the general Julian? Come back after receiving the briefing."
  npc_override_1@swat_HeartHunterWarBase_we_arranging_situation_i_528036: "We are arranging the situation inside the base. We cannot let you in yet."
  npc_override_1@swat_HeartHunterWarBase_we_arranging_situation_i_562852: "We are arranging the situation inside the base. You cannot enter yet."
  npc_override_1@swat_HeartHunterWarBase_we_don_t_enough_forces_74cca3: "We don't have enough forces to strike the base."
  npc_override_1@swat_HeartHunterWarBase_we_don_t_time_joke_fc24a9: "We don't have time to joke"
