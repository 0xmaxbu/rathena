  npc_override_aldebaran_aldebaran_go_through_door_34b6e8: "To go through this door"
  npc_override_aldebaran_aldebaran_going_work_because_card_4b2bdd: "it is not going to work because the card only can be inserted to"
  npc_override_aldebaran_aldebaran_good_day_5d2195: "have a good day."
  npc_override_aldebaran_aldebaran_good_luck_finding_phraco_afdb61: "Good luck with finding Phracons!"
  npc_override_aldebaran_aldebaran_good_mercenary_soldier_m_7d2a30: "A good mercenary soldier must have the wet nose"
  npc_override_aldebaran_aldebaran_good_yaaaaaay_now_you_cac624: "good! Yaaaaaay~ Now you"
  npc_override_aldebaran_aldebaran_gosh_abfcaa: "Gosh!"
  npc_override_aldebaran_aldebaran_greatest_among_potions_u_c730f5: "The greatest among potions! Use it before you fall into faint~"
  npc_override_aldebaran_aldebaran_hahahaha_chill_out_i_jus_8b2bc0: "Hahahaha...chill out, I was just joking."
  npc_override_aldebaran_aldebaran_hat_oh_well_3ec71f: "this hat is. Oh well..."
  npc_override_aldebaran_aldebaran_he_became_so_popular_his_1d49c1: "He became so popular for his exciting play,"
  npc_override_aldebaran_aldebaran_he_c04d0c: "He..."
  npc_override_aldebaran_aldebaran_he_great_man_he_argh_7101c3: "He was a great man. He... Argh! I can't remember!"
  npc_override_aldebaran_aldebaran_he_keeps_talking_himself_ef3f12: "He keeps talking to himself loud and it gives me a headache..."
  npc_override_aldebaran_aldebaran_he_still_bed_61110e: "He is still in bed."
  npc_override_aldebaran_aldebaran_headquarters_9511f1: "Headquarters."
  npc_override_aldebaran_aldebaran_hearsay_when_used_once_df5827: "By hearsay When used once,"
  npc_override_aldebaran_aldebaran_hello_hello_c7f047: "Hello, hello!!"
  npc_override_aldebaran_aldebaran_here_kafra_corporation_w_fa6194: "Here at Kafra Corporation, we are all doing our very best to give you the excellent service that you expect from us."
  npc_override_aldebaran_aldebaran_here_you_exchange_358e19: "Here, you can exchange"
  npc_override_aldebaran_aldebaran_hey_44afd2: "Hey..."
  npc_override_aldebaran_aldebaran_hey_there_9fc049: "Hey there!"
  npc_override_aldebaran_aldebaran_hey_you_don_t_come_f16ea0: "Hey, you don't come inside someone else's house without permission."
  npc_override_aldebaran_aldebaran_highest_recommendation_w_3e4bed: "highest recommendation. We"
  npc_override_aldebaran_aldebaran_hint_sarcasm_your_voice_305611: "Was that a hint of sarcasm in your voice when you said that?"
  npc_override_aldebaran_aldebaran_his_amazingly_fast_legs_4188d2: "for his amazingly fast legs..."
  npc_override_aldebaran_aldebaran_hm_f_fourth_prize_4466ee: "Hm? F-fourth prize?"
  npc_override_aldebaran_aldebaran_hmm_9c4d28: "Hmm..."
  npc_override_aldebaran_aldebaran_hmm_i_already_felt_you_a64914: "Hmm! I already felt that you are not an Ordinary person,"
  npc_override_aldebaran_aldebaran_hmmm_2ac89c: "Hmmm..."
  npc_override_aldebaran_aldebaran_homeland_alchemy_aldebar_eafb55: "Homeland of Alchemy, Aldebaran!"
  npc_override_aldebaran_aldebaran_honey_bees_butterflies_m_2a5e64: "Honey Bees, Butterflies and Moths seem like simple creatures, but that doesn't mean you should underestimate them."
  npc_override_aldebaran_aldebaran_hooray_f58bd8: "Hooray!"
  npc_override_aldebaran_aldebaran_hope_you_enjoy_your_new_d15097: "hope you enjoy your new shoes~"
  npc_override_aldebaran_aldebaran_how_dare_you_come_inside_89d4ef: "How dare you to come inside of my house and talk to me as if that is a normal thing to do?"
  npc_override_aldebaran_aldebaran_how_many_times_a3f585: "How many times"
  npc_override_aldebaran_aldebaran_however_canals_over_here_3c3da2: "However, the canals over here are just for show. If we needed to transport anything, we just use the Kafra Corporation Teleport service!"
  npc_override_aldebaran_aldebaran_however_equip_tab_each_e_43f7a0: "However, in the Equip tab, each and every single item takes up its own Slot. I guess that's because each and every single equipment can be uniquely upgraded by forging or through Cards."
  npc_override_aldebaran_aldebaran_however_i_hope_you_afrai_34041a: "however, I hope you will not be afraid of me. I am as humane as you are."
  npc_override_aldebaran_aldebaran_however_overdose_good_yo_fd810a: "However, overdose is not good for your body~"
  npc_override_aldebaran_aldebaran_however_there_nothing_la_98797f: "However, there is nothing last forever..."
  npc_override_aldebaran_aldebaran_however_time_they_ve_alr_7e1b79: "However, by this time, they've already spent what little zeny they had to open their Storage. But they don't have enough to access their Storage again!"
  npc_override_aldebaran_aldebaran_huge_mountains_surroundi_2395a9: "The huge mountains surrounding this town"
  npc_override_aldebaran_aldebaran_i_also_hear_they_create_4a79f6: "I also hear that they create all sorts of Potions, and can even summon certain monsters! It seems that their studies have all sorts of nifty applications."
  npc_override_aldebaran_aldebaran_i_am_my_brother_s_df8abc: "I am my brother's only hope and the future of Al De Baran!"
  npc_override_aldebaran_aldebaran_i_am_only_child_my_f38743: "I am only child in my family, so I have been thinking of my little chicken as my brother!"
  npc_override_aldebaran_aldebaran_i_apologize_inconvenienc_1d4ed6: "I apologize for inconvenience~"
  npc_override_aldebaran_aldebaran_i_assume_you_feel_someth_366ed2: "I assume you would feel something unusual"
  npc_override_aldebaran_aldebaran_i_been_charged_committee_7421b8: "I have been charged by the Committee of 'Heaven on Earth' to guard this entrance of the Clock Tower."
  npc_override_aldebaran_aldebaran_i_came_all_way_here_3e3876: "I came all the way here from Prontera because I heard the Kafra Main Office was somewhere here in Al De Baran."
  npc_override_aldebaran_aldebaran_i_don_t_think_you_c64b35: "I don't think you can keep the received items~"
