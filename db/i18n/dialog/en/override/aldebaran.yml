  npc_override_aldebaran_aldebaran_fighter_751523: " not a fighter."
  npc_override_aldebaran_aldebaran_first_prize_c1602e: "First Prize!"
  npc_override_aldebaran_aldebaran_five_thousand_eight_hund_15ef88: "FIVE THOUSAND AND EIGHT HUNDRED YEARS?! THAT'S INSANE!"
  npc_override_aldebaran_aldebaran_flaaaaaavaaaaah_aa5d4c: "Flaaaaaavaaaaah~^000000"
  npc_override_aldebaran_aldebaran_g_u_e_s_s_503cc8: "G~ U~ E~ S~ S~ W~ H~ A~ T~"
  npc_override_aldebaran_aldebaran_gate_his_own_accdf7: "This Gate with his own will!"
  npc_override_aldebaran_aldebaran_gatekeeper_creatures_9cf226: "by Gatekeeper Creatures."
  npc_override_aldebaran_aldebaran_general_if_you_want_hit_646e03: "In general, if you want to hit monsters that are as fast, or even faster, than you are, you're going to need some DEX."
