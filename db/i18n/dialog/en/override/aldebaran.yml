Body:
  npc_override_aldebaran_aldebaran_aaaaarrrggghhh_i_am_trou_9f9e9c: "Aaaaarrrggghhh...I AM IN TROUBLE!"
  npc_override_aldebaran_aldebaran_about_free_units_0d1116: "have about ^FF00001,100^000000 free units"
  npc_override_aldebaran_aldebaran_access_go_through_89bd8f: "Will have access to go through"
  npc_override_aldebaran_aldebaran_after_next_year_s_athlet_213ec3: "After the next year's athletic competition, I will go on a round-the-world tour with my brother."
  npc_override_aldebaran_aldebaran_after_receiving_070ae0: "After receiving this"
  npc_override_aldebaran_aldebaran_ah_let_me_tell_you_3594f6: "Ah, let me tell you how you can insert a card to an item."
  npc_override_aldebaran_aldebaran_ah_now_i_remember_just_040842: "Ah, now I remember! Just a few days ago, I saw a really interesting looking monster! It was a Poring with Angel's wings!"
  npc_override_aldebaran_aldebaran_ah_so_you_like_intellect_6c60fe: "Ah, so you like the intellectual type. That's good, that's good."
  npc_override_aldebaran_aldebaran_ah_so_you_tend_like_266f2d: "Ah, so you tend to like active, spontaneous types. I can understand that..."
  npc_override_aldebaran_aldebaran_ah_you_total_d1ab3a: "Ah, you have a total of"
  npc_override_aldebaran_aldebaran_al_de_baran_3fe037: "Al De Baran"
  npc_override_aldebaran_aldebaran_al_de_baran_512d12: "Al De Baran."
  npc_override_aldebaran_aldebaran_al_de_baran_known_world_6c9e6e: "Al De Baran is known world wide as the City of Canals. The waterways really add a sophisticated, romantic touch to our fair city."
  npc_override_aldebaran_aldebaran_al_de_baran_such_wonderf_c3feab: "Al De Baran is such a wonderful place with its romantic canals and classic architecture. I love nothing more than to stroll through this city with my beautiful girlfriend."
  npc_override_aldebaran_aldebaran_alchemists_one_nd_jobs_a_b6372a: "Alchemists, one of the 2nd Jobs, are able to create items out of several materials using knowledge from the ancient age of Al De Baran."
  npc_override_aldebaran_aldebaran_alchemists_specialize_ch_9bf975: "Alchemists specialize in chemical research in order to create useful items out of various things."
  npc_override_aldebaran_aldebaran_almost_every_armor_items_37f0ab: "Almost every armor items that are being sold"
  npc_override_aldebaran_aldebaran_alright_here_we_go_90e644: "Alright, here we go!"
  npc_override_aldebaran_aldebaran_alright_then_ca7fd5: "Alright, then!"
  npc_override_aldebaran_aldebaran_alright_then_i_tell_you_bd35e1: "Alright then, I will tell you a story about monster cards and item slots."
  npc_override_aldebaran_aldebaran_alright_then_please_95a4d3: "Alright then. Please"
  npc_override_aldebaran_aldebaran_also_d_really_impractica_90ed7f: "Also, it'd be really impractical to rent carts out to people who couldn't create or sell goods."
  npc_override_aldebaran_aldebaran_also_kafra_girls_alone_t_85ea8c: "Also, the Kafra girls alone can't teleport our customers. We just receive and process your teleportation request."
  npc_override_aldebaran_aldebaran_also_when_you_mouse_over_11f492: "Also, when you mouse over equipment in the Item Window or Vending Window, the name of the item will be followed by the number of its Slots in brackets."
  npc_override_aldebaran_aldebaran_although_assassins_benef_fde7c1: "Although Assassins benefit from being very quick and having lots of AGI, they should still have some DEX."
  npc_override_aldebaran_aldebaran_although_lacks_strength_bb4050: "Although it lacks the strength of other metals, it's easy to find and obtain. You can get Phracons by killing monsters or by buying them in Forging Shops in towns."
  npc_override_aldebaran_aldebaran_always_here_serve_you_2898db: "always here to serve you."
  npc_override_aldebaran_aldebaran_always_your_side_7cf7e6: "always on your side."
  npc_override_aldebaran_aldebaran_amazing_picky_most_wonde_7afb51: "'Amazing Picky' is the most wonderful and the most unique name"
  npc_override_aldebaran_aldebaran_ambernite_50b59c: "Ambernite is"
  npc_override_aldebaran_aldebaran_ambernite_e70508: "of Ambernite?"
  npc_override_aldebaran_aldebaran_ancient_alchemists_0ed6e5: "Ancient Alchemists"
  npc_override_aldebaran_aldebaran_and_c5ad1f: "And .."
  npc_override_aldebaran_aldebaran_any_kafra_passes_d41ec9: "have any Kafra Passes."
  npc_override_aldebaran_aldebaran_any_means_654fc2: "By any means,"
  npc_override_aldebaran_aldebaran_anyway_i_hope_you_enjoy_985113: "Anyway, I hope you enjoy your visit here in the Kafra Corporation Headquarters."
  npc_override_aldebaran_aldebaran_aren_t_level_weapons_coo_3e9c69: "Aren't level 4 weapons cool!"
  npc_override_aldebaran_aldebaran_aren_t_we_straying_off_0494dd: "Aren't we straying off topic a little bit? Ah, you must be one of those adventurers!"
  npc_override_aldebaran_aldebaran_armor_items_2c1e81: "armor items."
  npc_override_aldebaran_aldebaran_arrive_here_prontera_gef_a97576: "To arrive here from Prontera or Geffen, you've got to cross the Mjolnir Mountains."
  npc_override_aldebaran_aldebaran_arrrrghh_shut_up_listen_72ab66: "Arrrrghh! Shut up and listen! It took me a week to memorize all this! My memory isn't as good as the other Kafra Employees...!"
  npc_override_aldebaran_aldebaran_as_i_saying_kafra_corpor_de90d2: "As I was saying, the Kafra Corporation was founded eight thousand, five hundred years ago by, um, Emilio Alexander Kafra... Inventor of the word 'Kafra'?"
  npc_override_aldebaran_aldebaran_as_long_as_ancient_alche_e94b75: "As long as Ancient Alchemists"
  npc_override_aldebaran_aldebaran_as_reason_certain_policy_73182b: "As for the reason for this certain policy, we've had problems with young, fresh faced Novices that would put everything into their Storage."
  npc_override_aldebaran_aldebaran_as_super_novices_well_we_df36fb: "As for Super Novices, well, we're really not supposed to rent carts to them since the Super Novice Society in Al De Baran doesn't have a contract with us."
  npc_override_aldebaran_aldebaran_as_you_already_know_if_1f74ce: "As you already know, if you ever have obtained a monster card before,"
  npc_override_aldebaran_aldebaran_as_you_may_know_kafra_327190: "As you may know, the Kafra Corporation has a special relationship with the Merchant Guild, as well as the Blacksmith and Alchemist guilds in Midgard."
  npc_override_aldebaran_aldebaran_as_you_probably_already_a9d4fe: "As you probably already know, our customers must have at least Basic Skill level 6 in order to use the Kafra Storage."
  npc_override_aldebaran_aldebaran_as_you_see_fc43df: "As you can see,"
  npc_override_aldebaran_aldebaran_awakening_potion_better_30596c: "An awakening potion is better than a concentration potion!"
  npc_override_aldebaran_aldebaran_awww_daa9b8: "Awww..."
  npc_override_aldebaran_aldebaran_back_after_storing_some_b2f182: "back after storing some of"
  npc_override_aldebaran_aldebaran_back_then_people_gave_hi_2854b6: "Back then, people gave him a nickname, 'Al De Baran's Peco Peco',"
  npc_override_aldebaran_aldebaran_because_shows_soldier_hi_18ce2e: "because it shows that the soldier is at his best in health condition."
  npc_override_aldebaran_aldebaran_behind_scenes_skilled_pr_43d53c: "Behind the scenes, skilled professionals and technicians are working 24 hours a day to ensure that you teleport quickly and safely to your destination."
  npc_override_aldebaran_aldebaran_believe_4aa129: "believe that!"
  npc_override_aldebaran_aldebaran_best_mercenary_soldier_t_3c0166: "The best mercenary soldier has thin ankles and a white neck!"
  npc_override_aldebaran_aldebaran_better_mercenary_soldier_f48661: "Better mercenary soldier you want, more money you have to pay, you know?"
  npc_override_aldebaran_aldebaran_bit_more_impunity_fc25b8: "with a bit more impunity~"
  npc_override_aldebaran_aldebaran_blacksmith_s_family_live_11da5a: "This Blacksmith's family lives here, since his wife is sick and weak. Because of her condition, she needs to take medicinal herbs that grow near Al de Baran."
  npc_override_aldebaran_aldebaran_blocks_people_outside_co_fe2a6b: "blocks people from outside to come into this town."
  npc_override_aldebaran_aldebaran_blossom_strikes_me_as_gi_ba3e9e: "Blossom strikes me as the girl-next-door type. So I guess that's the type of girl you're attracted to, eh?"
  npc_override_aldebaran_aldebaran_blue_potions_d069a6: "3 Blue Potions~"
  npc_override_aldebaran_aldebaran_boing_boing_clink_b1baa3: "'Boing.. Boing.. Clink!'"
  npc_override_aldebaran_aldebaran_boooo_red_potions_bbc517: "Boooo! 100 Red Potions."
  npc_override_aldebaran_aldebaran_both_those_places_tough_6d0bcf: "Both of those places are tough"
  npc_override_aldebaran_aldebaran_brand_new_shiny_pair_f5e46e: "A brand new shiny pair"
  npc_override_aldebaran_aldebaran_bruke_seimer_e625af: "Bruke Seimer"
  npc_override_aldebaran_aldebaran_butterfly_wings_8ef527: "4 Butterfly Wings~"
  npc_override_aldebaran_aldebaran_came_out_let_s_see_e47721: "came out! Let's see"
  npc_override_aldebaran_aldebaran_cancel_77dfd2: "Cancel"
  npc_override_aldebaran_aldebaran_candidate_number_curly_s_d87ef7: "Candidate Number (6) ^AAAA00Curly Sue^000000 !!"
  npc_override_aldebaran_aldebaran_cap_hmmm_474d68: "A... Cap? Hmmm,"
  npc_override_aldebaran_aldebaran_check_its_nose_if_clean_87377e: "Check its nose if it is clean and wet."
  npc_override_aldebaran_aldebaran_chika_chika_chika_de56dd: "^3355FFChika chika chika"
  npc_override_aldebaran_aldebaran_choose_category_test_you_e53007: "Choose a category to test your luck."
  npc_override_aldebaran_aldebaran_choose_your_favorite_kaf_bb762f: "Choose your favorite Kafra Lady!"
  npc_override_aldebaran_aldebaran_city_forests_38abf7: "the City of Forests."
  npc_override_aldebaran_aldebaran_clock_tower_5e73ab: "This Clock Tower"
  npc_override_aldebaran_aldebaran_collect_more_more_81e5ce: "collect more and more"
  npc_override_aldebaran_aldebaran_collect_more_more_specia_0cd59a: "Collect more~ and more~ special reserve points~"
  npc_override_aldebaran_aldebaran_comes_into_your_possessi_b26b7b: "Comes into your possession,"
  npc_override_aldebaran_aldebaran_complicated_0a5277: "It is not that complicated, is it?"
  npc_override_aldebaran_aldebaran_congratulations_28d864: "Congratulations~~"
  npc_override_aldebaran_aldebaran_congratulations_you_got_d541e4: "Congratulations~~ You got the 1st prize~"
  npc_override_aldebaran_aldebaran_consists_mysterious_anci_cec0e1: "Consists of Mysterious Ancient Magics."
  npc_override_aldebaran_aldebaran_currently_we_kafra_cente_d44894: "Currently, we, Kafra Center is having a special event for our customers."
  npc_override_aldebaran_aldebaran_defense_i_m_so_435b78: "Defense, but I'm not so"
  npc_override_aldebaran_aldebaran_dex_especially_important_8b8ac6: "DEX is especially important if you want to hit monsters with wings. Those monsters are quick moving and fast in attacking."
  npc_override_aldebaran_aldebaran_disappeared_e27188: "And be disappeared."
  npc_override_aldebaran_aldebaran_don_t_belittle_livings_m_22201f: "Don't belittle the livings in the Mt. Mjolnir."
  npc_override_aldebaran_aldebaran_don_t_forget_check_soldi_575cef: "And don't forget to check the soldier's ankle."
  npc_override_aldebaran_aldebaran_don_t_grant_you_819ebc: " Don't grant you."
  npc_override_aldebaran_aldebaran_don_t_so_ridiculous_383d04: "Don't be so ridiculous!"
  npc_override_aldebaran_aldebaran_don_t_too_disappointed_t_e2c39f: "Don't be too disappointed that there's only one person in your welcome wagon!"
  npc_override_aldebaran_aldebaran_drinking_your_friends_6e35e8: "drinking with your friends~"
  npc_override_aldebaran_aldebaran_drrrrrr_drrrrrr_d4d026: "'Drrrrrr~ Drrrrrr~'"
  npc_override_aldebaran_aldebaran_drrrrrrrrrrrrrrrrrr_1d05be: "^3355FFDrrrrrrrrrrrrrrrrrr..."
  npc_override_aldebaran_aldebaran_due_change_customer_supp_444fc9: "Due to a change in customer support policy, we no longer accept Kafra Passes. However, we are offering refunds for our customers who still possess these passes."
  npc_override_aldebaran_aldebaran_durability_comes_our_45e78a: "and durability comes with our"
  npc_override_aldebaran_aldebaran_each_upgrade_level_attac_b1ab45: "For each upgrade level, attack strength increases by 2 for level 1 weapons. On level 2 weapons, 3 attack strength is added."
  npc_override_aldebaran_aldebaran_enough_special_reserve_2124e4: "enough Special Reserve"
  npc_override_aldebaran_aldebaran_enough_these_31e480: "With enough of these,"
  npc_override_aldebaran_aldebaran_enter_gate_dbe2ea: "To enter this Gate .."
  npc_override_aldebaran_aldebaran_equipment_dropped_monste_70e652: "Equipment that is dropped by monsters can't be equipped right away."
  npc_override_aldebaran_aldebaran_even_better_rewards_a32c60: "for even better rewards."
  npc_override_aldebaran_aldebaran_even_strong_swordman_ins_7eaae6: "Even to a strong Swordman, the Insects or Mt. Mjolnir pose a considerable threat. You've got to know your enemy before engaging it in battle!"
  npc_override_aldebaran_aldebaran_even_though_people_fasci_ee24d3: "Even though people are fascinated by the scenic beauty of Mt. Mjolnir, it's full of dangerous monsters!"
  npc_override_aldebaran_aldebaran_even_though_there_interc_fbcd9e: "Even though there are interconnecting warps everywhere in the Clock Tower, beware the 'Random Warp.'"
  npc_override_aldebaran_aldebaran_even_without_blacksmith_1eef63: "Even without a Blacksmith, Alchemist or Merchant in your party, you can appraise your equipment! Of course, a Magnifier is consumed each time you use one..."
  npc_override_aldebaran_aldebaran_every_feature_clocktower_8e96cd: "Every feature of This Clocktower "
  npc_override_aldebaran_aldebaran_every_floor_tower_connec_30a222: "Every floor of this tower is connected to each other by a certain device we like to call 'Warp Gear.'"
  npc_override_aldebaran_aldebaran_evil_creatures_human_ene_0c4965: "From Evil Creatures and Human Enemies."
  npc_override_aldebaran_aldebaran_example_shield_slot_when_878afe: "For example, a Shield with 1 Slot, when moused over, would display the name 'Shield [1]'."
