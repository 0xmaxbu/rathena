Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_2@nyd_NydhoggsNest_about_hours_later_all_me_69ca8c: "About 3 hours later, all 18 members returned without any problem, and each man and woman shared the information that they had collected."
  npc_override_2@nyd_NydhoggsNest_after_establishment_rune_cf05a0: "After the establishment of the Rune-Midgarts Kingdom and Arunafeltz, the rumors have spread in secret about their tribes, myths, etc."
  npc_override_2@nyd_NydhoggsNest_after_nidhoggur_s_shadow_3d4eb6: "After Nidhoggur's Shadow disappears, at least 3 days is needed for stabilizing."
  npc_override_2@nyd_NydhoggsNest_after_we_arrived_here_kn_3f943f: "After we have arrived here knowing the facts, the World Tree was already in a very bad state due to the many factories built by the Sapha tribe."
  npc_override_2@nyd_NydhoggsNest_after_we_received_report_a5eb41: "After we received reports from our spy about the World Tree's strange symptoms, we recgnized the Manuk's existence."
  npc_override_2@nyd_NydhoggsNest_after_what_happened_i_do_6e34e5: "After what happened, I don't think they know what else they can do. Let me explain."
  npc_override_2@nyd_NydhoggsNest_ah_easy_decision_you_fri_61dc21: "Ah, it is not an easy decision. You frighten me."
  npc_override_2@nyd_NydhoggsNest_ah_here_s_message_about_01db8d: "Ah, here's the message about you. He's said to share the information on research and reports."
  npc_override_2@nyd_NydhoggsNest_ah_how_tricky_you_testin_d12378: "Ah... How tricky... Are you testing us?"
  npc_override_2@nyd_NydhoggsNest_ah_i_see_29680f: "Ah...I...see..."
  npc_override_2@nyd_NydhoggsNest_ah_if_you_re_done_1e35a2: "Ah... if you're done moving those, then these should go in shelf 3 row B."
  npc_override_2@nyd_NydhoggsNest_ah_um_i_am_bd32c4: "Ah...um..I...am..."
  npc_override_2@nyd_NydhoggsNest_ah_you_d_go_as_df29f1: "Ah...you'd go as far as saying that. What good will it do for you, helping the Laphine tribe?"
  npc_override_2@nyd_NydhoggsNest_ah_you_said_there_strang_9713db: "Ah, you said that there is a strange power blocking the entrance to the Guardian's nest, right?"
  npc_override_2@nyd_NydhoggsNest_ah_you_ve_come_proper_d37df4: "Ah, you've come at a proper time. I found a curious thing while looking for reports from Arunafeltz."
  npc_override_2@nyd_NydhoggsNest_all_i_you_2d6255: "This is... all I can do for you..."
  npc_override_2@nyd_NydhoggsNest_all_nidhoggur_s_guardian_644c6c: "All of Nidhoggur's Guardians have been defeated!"
  npc_override_2@nyd_NydhoggsNest_all_s_left_ugly_shadow_7c26b5: "All that's left, is the ugly Shadow of the Guardian of Nidhoggur...the Shadow that is going mad."
  npc_override_2@nyd_NydhoggsNest_all_we_needed_you_what_ab7b38: "This is all we needed from you...What is left is business between us and the Laphine tribe."
  npc_override_2@nyd_NydhoggsNest_alright_i_ll_approve_you_352b50: "Alright, I'll approve of your request, and let you investigate the secret the Laphine tribe has hidden inside the cave."
  npc_override_2@nyd_NydhoggsNest_alright_now_we_cooperate_1ab3dc: "Alright, from now on, we will cooperate with you, and allow you to directly communicate with the Laphine prisoner."
  npc_override_2@nyd_NydhoggsNest_alright_s_as_you_assumed_a634f8: "Alright...it's as you have assumed, a place connecting to the World Tree. It's also the Guardian's Nest."
  npc_override_2@nyd_NydhoggsNest_also_remember_spell_s_ne_fdd382: "Also, remember this spell, it's needed to open the gate of the Guardian."
  npc_override_2@nyd_NydhoggsNest_although_they_ignore_you_80c1cb: "Although they ignore your track record, still, one should be careful..."
  npc_override_2@nyd_NydhoggsNest_amanvilshar_ie_dorlushar_84d5da: "AmanVilShar Ie DorLuShar Mu Re"
  npc_override_2@nyd_NydhoggsNest_anomardu_ha_odesudenver_e68e2e: "AnomarDu Ha OdesUdenVer Ie "
  npc_override_2@nyd_NydhoggsNest_anyway_i_m_just_exhauste_83e943: "Anyway... I'm just exhausted during this useless and nerve-wracking situation... Sigh."
  npc_override_2@nyd_NydhoggsNest_anyway_i_should_make_sur_c94671: "Anyway, I should make sure that you read all these books, and I'll just keep doing my work."
  npc_override_2@nyd_NydhoggsNest_anyway_let_s_try_contact_5e8be8: "Anyway, let's try to contact them first, to be clear about any caves or treasures."
  npc_override_2@nyd_NydhoggsNest_arioss_please_compensate_4e8902: "Arioss, please compensate this strange one for the help. I need to go rest..."
  npc_override_2@nyd_NydhoggsNest_as_i_expected_cave_entra_55fce8: "As I expected, the cave is the entrance to go to one of Yggdrasil's roots..."
  npc_override_2@nyd_NydhoggsNest_as_i_put_my_hands_c4b611: "As I put my hands on the stone gate, a voice sounded from the depth of my heart."
  npc_override_2@nyd_NydhoggsNest_as_leader_sapha_tribe_i_b8378f: "As the leader of the Sapha tribe, I have something very important to tell you. That is why I asked for you..."
  npc_override_2@nyd_NydhoggsNest_as_you_seen_neither_saph_bae6a2: "As you have seen, neither the Sapha tribe nor the Laphine tribe is at fault for the weakening of the World Tree. It's all because of the Guardian's Shadow..."
  npc_override_2@nyd_NydhoggsNest_ask_laphines_about_explo_0b208f: "To ask the Laphines about exploring..."
  npc_override_2@nyd_NydhoggsNest_assassins_terrible_past_5f9a94: "The Assassins have a terrible past with Satan Morocc, so they gathered 18 members to chase him down."
  npc_override_2@nyd_NydhoggsNest_because_angry_leave_guar_732bc8: "But because of the angry leave of the Guardian, his shadow is wreaking havoc on the World Tree?"
  npc_override_2@nyd_NydhoggsNest_because_his_disppearance_1c4338: "And because of his disppearance, the Guardian's Shadow is currently destorying the roots of the World Tree...?"
  npc_override_2@nyd_NydhoggsNest_because_those_many_unexp_68cc07: "Because of those many unexpected reasons, the Guardian's nest, which was meant to stay hidden deep underground, has been discovered by your race..."
  npc_override_2@nyd_NydhoggsNest_because_war_against_laph_9c34e5: "Because of the war against the Laphine tribe, everything is a mess. But even then, we cannot allow a foreign race to interfere."
  npc_override_2@nyd_NydhoggsNest_before_we_captured_broug_683ba9: "Before we were captured and brought here, there were 3 servants including me. Our task was to heal the World Tree."
  npc_override_2@nyd_NydhoggsNest_before_you_go_back_docto_94a249: "Before you go back to the Doctor, you had better read these books. So, I will go back to work."
  npc_override_2@nyd_NydhoggsNest_below_gorgeous_stones_st_5350b3: "From below the gorgeous stones, a strange breeze is forming."
  npc_override_2@nyd_NydhoggsNest_better_go_back_camp_info_14b133: "It would be better to go back to camp and inform the others and ask for help."
  npc_override_2@nyd_NydhoggsNest_better_if_you_returned_a_8b7f21: "It would be better if you returned after reading all of them. That's very basic data of what we should do for the future."
  npc_override_2@nyd_NydhoggsNest_birth_world_fiction_odin_d45049: "'Birth of the World', 'The Fiction of Odin's Myth', 'God's Battle Then After', 'Dreams of the Tribes'. There are a variety of books..."
  npc_override_2@nyd_NydhoggsNest_both_sides_act_ambiguous_617805: "Both sides act ambiguously, so... I'm getting worried..."
  npc_override_2@nyd_NydhoggsNest_bring_him_neat_etorr_all_ea7e1a: "Bring him to Neat Etorr. All soldiers be prepared."
  npc_override_2@nyd_NydhoggsNest_browse_around_take_look_9bb954: "Browse around, to take a look at the books."
  npc_override_2@nyd_NydhoggsNest_calm_down_sir_i_throw_f01a4a: "Calm down, sir. I will throw this outsider into prison."
  npc_override_2@nyd_NydhoggsNest_captive_only_reference_o_a3767e: "That captive is the only reference for our tribe, so we have taken good care of her. She is related to your current investigation."
  npc_override_2@nyd_NydhoggsNest_careful_careful_shadow_s_42e86d: "And... Be careful... Be careful of the shadow's power."
  npc_override_2@nyd_NydhoggsNest_cautious_your_actions_we_48fd91: "Be cautious of your actions. We already have lots of problems with the Sapha tribe as it is."
  npc_override_2@nyd_NydhoggsNest_combat_odin_vs_gods_god_bfa052: "The combat of Odin vs. the Gods, and the God's sons and their purpose... The Doctor has researched this his whole life."
  npc_override_2@nyd_NydhoggsNest_come_least_more_servant_077d85: "Come with at least 1 more servant... Only party leaders can accept admission to Nidhoggur's Nest."
  npc_override_2@nyd_NydhoggsNest_command_officers_make_su_eaaec3: "But the command officers make sure that there's something hidden in there."
  npc_override_2@nyd_NydhoggsNest_commander_agip_want_talk_5a420f: "Does Commander Agip want to talk to me? Let's listen to his story."
  npc_override_2@nyd_NydhoggsNest_commander_b56794: "Commander..."
  npc_override_2@nyd_NydhoggsNest_commander_we_need_alert_f37ea1: "Commander... do we need to alert the rest of the tribe...?"
  npc_override_2@nyd_NydhoggsNest_commander_you_sure_we_do_557313: "Commander...are you sure of this? We don't even know if they're friend or foe..."
  npc_override_2@nyd_NydhoggsNest_continuously_adventurers_9bb68e: "Continuously, adventurers from Rune-Midgarts have attacked him and he is slowly losing his power. He would need more time to resurrect completely."
  npc_override_2@nyd_NydhoggsNest_cooperate_investigate_wh_c29c1e: "Cooperate and investigate? What do you mean?"
  npc_override_2@nyd_NydhoggsNest_course_a9667f: "But of course!"
  npc_override_2@nyd_NydhoggsNest_course_be6167: "Of course."
  npc_override_2@nyd_NydhoggsNest_course_we_don_t_know_55ceae: "But of course...we don't know if they're reasonable enough...hehe."
  npc_override_2@nyd_NydhoggsNest_currently_one_sapha_trib_f09e4a: "Currently, one of the Sapha tribe has been discovered from beyond the Dimensional Gorge."
  npc_override_2@nyd_NydhoggsNest_darkness_took_over_guard_8e78e8: "Darkness took over the Guardian and destroyed all living things... now this place has become the cursed home of monsters."
  npc_override_2@nyd_NydhoggsNest_day_timer_removed_when_y_9e60c3: "The 3 day timer will be removed when you close this dialog."
  npc_override_2@nyd_NydhoggsNest_defeat_all_nidhoggur_s_g_aeb255: "Defeat all of Nidhoggur's guardians and go through the waterfall into the nest... and stop Nidhoggur's Shadow there."
  npc_override_2@nyd_NydhoggsNest_defeat_nidhoggur_s_shado_75adfb: "With the defeat of Nidhoggur's Shadow, the roots of the World Tree Yggdrasil are also affected."
  npc_override_2@nyd_NydhoggsNest_did_you_find_anything_ab_866ed7: "Did you find anything about the Sapha and Laphine?"
  npc_override_2@nyd_NydhoggsNest_did_you_find_cave_fairy_77009b: "Did you find the cave that the fairy tribes treat as a holy place? You are a really tough cookie. What did you find?"
  npc_override_2@nyd_NydhoggsNest_doctor_never_ever_tries_a9d708: "The doctor never ever tries to come back, and there're too many things to do... How can I do it all..."
  npc_override_2@nyd_NydhoggsNest_doctor_said_he_pick_up_dfaf29: "The Doctor said he will pick up the books through another person. Besides, don't you need the basic information on what to do?"
  npc_override_2@nyd_NydhoggsNest_don_t_attract_too_much_70163d: "Don't attract too much attention because that would make your people look bad."
  npc_override_2@nyd_NydhoggsNest_don_t_misunderstand_rece_1bdcf6: "Don't misunderstand... Recently, we have talked about your particular species and our commanders feel grateful to you."
  npc_override_2@nyd_NydhoggsNest_don_t_you_see_i_14a129: "Don't you see that I'm too busy? Don't dawdle, just go!"
  npc_override_2@nyd_NydhoggsNest_don_t_you_see_i_20a115: "Don't you see I am too busy? Don't hesitate. Just do it."
  npc_override_2@nyd_NydhoggsNest_during_out_last_battle_s_1452a1: "During out last battle with the Sapha tribe... they caught me and took me prisoner."
  npc_override_2@nyd_NydhoggsNest_during_time_your_people_3009eb: "During this time, your people have travelled through the space-time gap to this land."
  npc_override_2@nyd_NydhoggsNest_end_they_harmed_part_wor_c792ff: "In the end, they have harmed a part of the World Tree's root that lies very close to their mine, and thus, the World Tree became very ill."
  npc_override_2@nyd_NydhoggsNest_enter_password_69b805: "Enter the password."
  npc_override_2@nyd_NydhoggsNest_enter_password_exactly_6f3b0d: "Enter the password exactly."
  npc_override_2@nyd_NydhoggsNest_even_caring_about_single_0e9a40: "Not even caring about this a single bit? What a stupid woman..."
  npc_override_2@nyd_NydhoggsNest_even_if_i_don_t_8e1880: "Even if I don't say anything, my situation will not change."
  npc_override_2@nyd_NydhoggsNest_even_though_i_seen_my_a59887: "Even though I have not seen it with my own eyes, this does explain why we lost communication with the great World Tree Yggdrasil."
  npc_override_2@nyd_NydhoggsNest_even_though_long_time_we_f95b04: "Even though, for a long time, we have been attacking the Sapha tribe, trying to force them to leave, they are not so easily defeated, leading to this stalemate."
  npc_override_2@nyd_NydhoggsNest_ever_since_years_ago_he_0e4872: "Ever since 5 years ago, he has been curious about how the world started, and so he began his search for the God of creation."
  npc_override_2@nyd_NydhoggsNest_explain_about_guardian_n_972a3d: "Explain about the guardian Nidhoggur's leave."
  npc_override_2@nyd_NydhoggsNest_explain_professor_magnif_534e58: "Explain Professor Magnifier's theory."
  npc_override_2@nyd_NydhoggsNest_explain_sudden_leave_gua_464981: "Explain the sudden leave of the Guardian."
  npc_override_2@nyd_NydhoggsNest_exploring_what_choose_yo_13c5c9: "Exploring what? Choose your words wisely?"
  npc_override_2@nyd_NydhoggsNest_finding_another_line_wor_391902: "Finding another line of work might make for a really worthy job, but only a historian gets to know the world over.."
  npc_override_2@nyd_NydhoggsNest_finished_removing_quest_57df74: "Finished removing Quest Timer."
  npc_override_2@nyd_NydhoggsNest_first_report_commander_a_072fbd: "First, report to Commander Agip, then act according to the situation. Let me organize my research findings..."
  npc_override_2@nyd_NydhoggsNest_firstly_we_should_find_o_f240fa: "Firstly, we should find out more about the place. I expect we can, but... we can't do much without help from others."
  npc_override_2@nyd_NydhoggsNest_frankly_i_don_t_think_6c1904: "Frankly, I don't think of you or any Sapha is our enemy. Sigh..."
  npc_override_2@nyd_NydhoggsNest_gate_open_soon_go_defeat_50456c: "The gate will open soon. Go defeat all of the guardians."
  npc_override_2@nyd_NydhoggsNest_gate_open_soon_go_defeat_f46f39: "The gate will open soon. Go defeat all of the guardians... you must kill them all in 30 minutes before the gate opens..."
  npc_override_2@nyd_NydhoggsNest_give_up_request_ask_laph_cf81d3: "Give up request, and ask Laphine tribe for help instead."
  npc_override_2@nyd_NydhoggsNest_go_find_fairy_guarding_g_0573d6: "Go find the fairy guarding the gate, and say this spell."
  npc_override_2@nyd_NydhoggsNest_gosh_where_where_did_ugh_75ebda: "Gosh! Where is-? Where did-? Ugh! It's so difficult!"
  npc_override_2@nyd_NydhoggsNest_great_stone_gate_stands_845978: "A great stone gate stands before you. The sculpture of a terrible dragon spreads its powerful looking wings."
  npc_override_2@nyd_NydhoggsNest_guardian_nidhoggur_he_s_6aeac4: "The Guardian Nidhoggur... he's not in the nest."
  npc_override_2@nyd_NydhoggsNest_guardian_s_insanity_caus_55da8a: "The Guardian's insanity...is caused by powers unknown to us... You must tell this to everyone."
  npc_override_2@nyd_NydhoggsNest_guardian_s_nest_c86914: "Guardian's Nest?"
  npc_override_2@nyd_NydhoggsNest_guardian_seems_wish_alon_be18dc: "The Guardian seems to wish to be alone. I will go in and check, please wait out here."
  npc_override_2@nyd_NydhoggsNest_guardian_something_s_wro_e6fb4b: "The guardian... something's wrong with the guardian. I don't know what made him like this."
  npc_override_2@nyd_NydhoggsNest_guest_other_world_please_614bad: "Guest from the other world, please excuse our rudeness..."
  npc_override_2@nyd_NydhoggsNest_he_asked_me_bring_some_7ad273: "He asked me to bring some reports. Didn't he say anything?"
  npc_override_2@nyd_NydhoggsNest_he_proof_spell_confirm_y_d1231d: "he proof and the spell will confirm that you are one of the Guardian's servants."
  npc_override_2@nyd_NydhoggsNest_he_researches_combat_bet_09d7da: "He researches combat between Odin and the Gods, and about the Gods' origins and life."
  npc_override_2@nyd_NydhoggsNest_he_said_he_send_message_1bd8eb: "He said that he would send a message to you... didn't you get it?"
  npc_override_2@nyd_NydhoggsNest_he_sent_me_mail_over_1bdb8e: "He has sent me mail over 20 times. I did not know that..."
  npc_override_2@nyd_NydhoggsNest_he_some_reason_abandoned_9b8566: "He...for some reason abandoned his own shadow, and left."
  npc_override_2@nyd_NydhoggsNest_here_outsider_arioss_exp_50bbd6: "Here, outsider. Arioss will explain the situation with the giants. Talk with him..."
  npc_override_2@nyd_NydhoggsNest_heterogenous_phenomenon_d67069: "The heterogenous phenomenon needed to be studied thoroughly and carefully in order to under the relationship between thair world and ours."
  npc_override_2@nyd_NydhoggsNest_hey_outsider_step_away_p_f18f2a: "Hey, outsider! Step away from the prisoner!"
  npc_override_2@nyd_NydhoggsNest_hey_you_please_move_thes_ccfe7a: "Hey, you. Please move these books. Put them into shelf 3 row B."
  npc_override_2@nyd_NydhoggsNest_his_highness_world_tree_fc158d: "His Highness, the World Tree Yggdrasil, said that?"
  npc_override_2@nyd_NydhoggsNest_his_sons_grew_as_well_a62cdb: "But, his sons grew as well and he was killed by Odin, Vili, and Ve; 3 brothers, Gods, that attacked from different sides."
  npc_override_2@nyd_NydhoggsNest_hm_good_job_maybe_i_3753e9: "Hm, good job. Maybe I don't need to check anything else, right?"
  npc_override_2@nyd_NydhoggsNest_hmm_i_haven_t_seen_79b05d: "Hmm... I haven't seen him in over a year! What's he doing now?"
  npc_override_2@nyd_NydhoggsNest_hmph_even_if_i_don_833345: "Hmph...even if I don't cooperate, I know you will find other means to get in..."
  npc_override_2@nyd_NydhoggsNest_how_world_organized_way_c02ba5: "How this world is organized... and the way of the future! With our studies of the past and present we can predict what is to come."
  npc_override_2@nyd_NydhoggsNest_hurry_leave_leave_place_f23e7f: "Hurry... and leave... leave this place before it's too late."
  npc_override_2@nyd_NydhoggsNest_i_accept_your_entrance_t_e82474: "I accept your entrance through the Guardian's gate. You are now considered a faithful servant of the Guardian Nidhoggur."
  npc_override_2@nyd_NydhoggsNest_i_already_told_you_every_38cf40: "I have already told you everything you wanted to hear. If you have any other requests, please let me know."
  npc_override_2@nyd_NydhoggsNest_i_already_told_you_what_507a8e: "I have already told you what you wanted to know... If you need anything else, just let me know."
  npc_override_2@nyd_NydhoggsNest_i_check_mailbox_wait_min_576b45: "I will check the mailbox, wait a minute. If you get bored read those books."
  npc_override_2@nyd_NydhoggsNest_i_definitely_help_you_fi_6db4a6: "I will definitely help you find a way to enter the World Tree directly so, just believe in me! Okay~!!"
  npc_override_2@nyd_NydhoggsNest_i_don_t_know_exactly_9028ba: "I don't know exactly how to explain it, but it's like it has a bad mood. There are lots of terrible monsters there."
  npc_override_2@nyd_NydhoggsNest_i_don_t_know_what_6e1422: "I don't know what others think about it... but we've had some trouble with our attitude against the Sapha tribes."
  npc_override_2@nyd_NydhoggsNest_i_give_you_my_proof_d5962a: "I will give you my proof. Don't worry, I'm just temporarily marking you as a guardian's servant."
  npc_override_2@nyd_NydhoggsNest_i_heard_about_recent_exp_a1d261: "I have heard about recent expeditions of adventurers that have tried to contact the tribes... Have you heard anything about this?"
  npc_override_2@nyd_NydhoggsNest_i_heard_you_search_any_bd7ad9: "I heard that you are to search for any treasure in the closed cave to the north."
  npc_override_2@nyd_NydhoggsNest_i_hope_your_people_becar_e88456: "I hope that your people will becareful of your actions on this land, and terminate any unnecessary interventions."
  npc_override_2@nyd_NydhoggsNest_i_i_am_world_tree_dca5fa: "I... I am the World Tree Yggdrasil, servant of the Guardian of Nidhoggur, as well as the High Priest leading the Laphine Tribe."
  npc_override_2@nyd_NydhoggsNest_i_just_want_say_if_45f516: "I just want to say this...if the Sapha tribe intrude that place, we will never forgive them!"
  npc_override_2@nyd_NydhoggsNest_i_known_recently_time_br_7c3647: "I have known that, recently, time has broken... so, you're here exploring for a solution, no?"
  npc_override_2@nyd_NydhoggsNest_i_ll_also_keep_searching_1d63e4: "I'll also keep searching here. If you find anything, come back and let me know."
  npc_override_2@nyd_NydhoggsNest_i_m_guarding_laphine_pri_657ef8: "I'm guarding this Laphine prisoner. Leave me alone."
  npc_override_2@nyd_NydhoggsNest_i_m_just_following_order_bd660f: "I'm just following orders"
  npc_override_2@nyd_NydhoggsNest_i_must_explore_cave_c4c4a4: "I must explore the cave."
  npc_override_2@nyd_NydhoggsNest_i_represent_entire_laphi_d7953a: "I represent the entire Laphine tribe, and show you our gratitude. This must all be very hard for our commander..."
  npc_override_2@nyd_NydhoggsNest_i_send_message_my_assist_690146: "I will send a message to my assistant who is in the Prontera Library. So, help her find more information."
  npc_override_2@nyd_NydhoggsNest_i_sent_you_figure_out_7c8c1c: "I sent you to figure out which basic materials will be needed for the jobs ahead of us. You should bring research reports..."
  npc_override_2@nyd_NydhoggsNest_i_shouldn_t_say_anymore_2bd791: "I shouldn't say anymore. Please don't take this as being rude but, please go now!"
  npc_override_2@nyd_NydhoggsNest_i_t_sure_he_thought_7bc252: "I can't be sure, but he thought someday it would occur. It broke out earlier than he expected though."
  npc_override_2@nyd_NydhoggsNest_i_thank_you_deeply_your_34d478: "I thank you deeply for your decision. I will use what is left of my powers to open up the path towards the Guardian's Nest."
  npc_override_2@nyd_NydhoggsNest_i_ve_recorded_your_reque_2fef51: "I've recorded your request, are you ready to go inside?"
  npc_override_2@nyd_NydhoggsNest_i_ve_taken_great_risk_532523: "I've taken a great risk in allowing you in here. So be wary."
  npc_override_2@nyd_NydhoggsNest_i_ve_talked_too_much_50622f: "I've talked too much... Anyway, as you know through my report, you've found a great thing!"
  npc_override_2@nyd_NydhoggsNest_i_waiting_you_s_good_843db9: "I was waiting for you. It's good that you're safe. Did you find anything?"
  npc_override_2@nyd_NydhoggsNest_i_waiting_you_you_came_465214: "I was waiting for you. You came back safe, that's good news. Did you find anything?"
  npc_override_2@nyd_NydhoggsNest_if_our_tribe_really_trus_268884: "If our tribe were to really trust in the Sapha tribe...I don't know."
  npc_override_2@nyd_NydhoggsNest_if_s_true_you_ve_1a2655: "If that's true, you've found the greatest discovery since the harnessing of mana. Isn't this exciting?"
  npc_override_2@nyd_NydhoggsNest_if_wasn_t_i_wouldn_732d4d: "If it wasn't for that... I wouldn't survive here..."
  npc_override_2@nyd_NydhoggsNest_if_we_help_you_anything_c82804: "If we can help you with anything in the future, we will do all we can to assist you. Once again, thank you."
  npc_override_2@nyd_NydhoggsNest_if_what_you_re_saying_8978c4: "If what you're saying is true, then there is no more reason for us to continue fighting the Laphine tribe..."
  npc_override_2@nyd_NydhoggsNest_if_you_cautious_your_act_bce0e5: "If you are cautious with your actions, I won't place any harm on you. Fare well."
  npc_override_2@nyd_NydhoggsNest_if_you_don_t_accept_0a2deb: "If you don't accept our request, then do not expect any cooperations between our races in the future."
  npc_override_2@nyd_NydhoggsNest_if_you_dungeon_generated_ac0bd6: "If you have the dungeon generated already, you can enter it."
  npc_override_2@nyd_NydhoggsNest_if_you_like_enter_again_3ff930: "If you would like to enter again, please register with me."
  npc_override_2@nyd_NydhoggsNest_if_you_promise_share_all_fd3a3d: "If you promise to share all of your research results and findings, we will accept your request."
  npc_override_2@nyd_NydhoggsNest_if_you_ready_i_allow_44ef6a: "If you are ready, I will allow you to enter."
  npc_override_2@nyd_NydhoggsNest_if_you_t_follow_rule_f0cc7c: "If you can't follow this rule, I will stop associating with you and ban all of your people from here."
  npc_override_2@nyd_NydhoggsNest_incorrect_password_b68db3: "Incorrect password."
  npc_override_2@nyd_NydhoggsNest_input_variable_number_6c77a2: "Input the variable number"
  npc_override_2@nyd_NydhoggsNest_ins_nyd_032365: "ins_nyd2 is at {0}."
  npc_override_2@nyd_NydhoggsNest_ins_nyd_8b4d1f: "ins_nyd is at {0}."
  npc_override_2@nyd_NydhoggsNest_ins_nyd_set_ins_nyd_b455e6: "ins_nyd set to 200 ins_nyd2 set to 0"
  npc_override_2@nyd_NydhoggsNest_invasion_harsh_word_i_am_884f7e: "Invasion is a harsh word. I am allowing them entrance. Better them than a dirty giant. It might just save our lives..."
  npc_override_2@nyd_NydhoggsNest_just_our_powers_s_imposs_0a74af: "With just our powers, it's impossible to figure out what the Laphine is up to. I think the past has proven that."
  npc_override_2@nyd_NydhoggsNest_just_when_expected_impos_4b1996: "Just when it was expected to be impossible to travel into a different world, the first page of a new chapter was opened."
  npc_override_2@nyd_NydhoggsNest_klekod_oi_thekd_pheid_ok_aa5357: "Klekod Oi Thekd Pheid Okei."
  npc_override_2@nyd_NydhoggsNest_laphine_tribe_charged_ma_c8d54d: "The Laphine tribe was charged with the management of Yggdrasil, to establish their lands close to Asgard, and to protect the balance of Yggdrasil's magic power."
  npc_override_2@nyd_NydhoggsNest_laphine_tribe_never_cont_f4e1d1: "The Laphine tribe has never contacted anyone outside of Asgard. But since they found that Yggdrasil's power if weakening..."
  npc_override_2@nyd_NydhoggsNest_laphine_tribes_gathered_6259e6: "The Laphine tribes gathered as well for an expedition to explore the time-space gap and figure out the World Tree's strange symptoms and perharps a cure method."
  npc_override_2@nyd_NydhoggsNest_laphines_protected_yggdr_7f0900: "The Laphines have protected the Yggdrasil World Tree for generations."
  npc_override_2@nyd_NydhoggsNest_last_thing_tested_send_a_caa3dd: "The last thing to be tested... was to send adventurers who volunteered to explore the new world."
  npc_override_2@nyd_NydhoggsNest_least_we_also_think_we_133fe0: "At least we also think that we must use the Laphine prisoner to get information."
  npc_override_2@nyd_NydhoggsNest_let_s_report_commander_a_f42c72: "Let's report to Commander Agip about the situation so far. Then, we wait on his decision."
  npc_override_2@nyd_NydhoggsNest_let_s_see_book_no_06db6f: "Let's see... This book... No... this one...? Hmm... Maybe this..."
  npc_override_2@nyd_NydhoggsNest_liek_quekdk_ohei_vue_d7888c: "Liek QUekdk Ohei Vue."
  npc_override_2@nyd_NydhoggsNest_long_ago_there_wasn_t_6e706d: "Long ago, there wasn't a sun, moon, or stars; just empty earth... and Ymir was born. Then, by making sons, Ymir grew."
  npc_override_2@nyd_NydhoggsNest_long_ago_we_heard_you_7098fa: "Not long ago, We have heard that you have found remains in an abandoned cave in the north, and have been conducting investigations and researches regarding it."
  npc_override_2@nyd_NydhoggsNest_looking_current_situatio_95f46d: "Looking at the current situation of the Laphine tribe, we do not have enough power to surround the Manuk fields, and chase the giants away."
  npc_override_2@nyd_NydhoggsNest_loyal_servants_guardian_8a6c3e: "The loyal servants of the Guardian... what can I do for you?"
  npc_override_2@nyd_NydhoggsNest_lright_s_as_you_assumed_a1c280: "lright...it's as you have assumed, a place connecting to the World Tree. It's also the Guardian's Nest."
  npc_override_2@nyd_NydhoggsNest_make_sure_if_you_find_999206: "And make sure that if you find anything out of the ordinary in there, that you share it with us!"
  npc_override_2@nyd_NydhoggsNest_man_currently_under_arre_9a8c79: "That man is currently under arrest."
  npc_override_2@nyd_NydhoggsNest_may_i_ask_why_you_d01598: "But may I ask why you want to do this?"
  npc_override_2@nyd_NydhoggsNest_maybe_our_command_office_75d456: "Maybe... our command officers don't want to accept other species different than us..."
  npc_override_2@nyd_NydhoggsNest_maybe_you_found_central_d2af73: "Maybe you found the central line to enter into the World Tree Yggdrasil!"
  npc_override_2@nyd_NydhoggsNest_means_you_ignoring_my_wa_39aa50: "That means... that you are ignoring my warning? Is this your decision or are you just following orders?"
  npc_override_2@nyd_NydhoggsNest_menu_discovery_a3b072: "Discovery of Heterogeneity:Report of Indigenous Tribes"
  npc_override_2@nyd_NydhoggsNest_menu_generate_f544f5: "Generate Purification Stone:Remove Purification Stone:Turn Entrance NPC OFF:Turn Entrance NPC On:Cancel"
  npc_override_2@nyd_NydhoggsNest_menu_guardian_672673: "'Guardian's spell'!:Take a step back."
  npc_override_2@nyd_NydhoggsNest_menu_i_13486e: "I want to go in.:I want to leave."
  npc_override_2@nyd_NydhoggsNest_menu_ins_12748b: "ins_nyd:ins_nyd2"
  npc_override_2@nyd_NydhoggsNest_menu_leave_726604: "Leave it to us.:We can't do it."
  npc_override_2@nyd_NydhoggsNest_menu_leave_7e577b: "Leave quietly.:Don't know what he's talking about, and ask for details."
  npc_override_2@nyd_NydhoggsNest_menu_look_307112: "Look busy, and take a step back.:Help her just this once."
  npc_override_2@nyd_NydhoggsNest_menu_move_95c699: "Move closer to look more carefully.:Step back."
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_25e666: "Nidhoggur's Shadow : Destroy... everything..."
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_2e55dc: "Nidhoggur's Shadow : I will devour all of you... you and the World Tree Yggdrasil."
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_3647d9: "Nidhoggur's Shadow : Sleep for eternity in an empty illusion."
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_387536: "Nidhoggur's Shadow : You're not bad... but I will be your opponent this time."
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_524849: "Nidhoggur's Shadow : World Tree Yggdrasil's guardian... his powers are disappearing..."
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_8c9014: "Nidhoggur's Shadow : I need... I need the World Tree Yggdrasil's powers..."
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_957c43: "Nidhoggur's Shadow : No more... I can't stand this anymore..."
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_c386f6: "Nidhoggur's Shadow : In this chaos... your blood is just what I need."
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_c93039: "Nidhoggur's Shadow : I'll let you enjoy the pain of dying slowly."
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_d90da6: "Nidhoggur's Guardian : Protect the Guardian's Sanctuary. Get rid of the intruders."
  npc_override_2@nyd_NydhoggsNest_menu_nidhoggur_e5d512: "Nidhoggur's Shadow : I will freeze every last drop of your blood."
  npc_override_2@nyd_NydhoggsNest_menu_no_736a42: "No. Nothing. We can talk later.:I intend to stay. For good reasons."
  npc_override_2@nyd_NydhoggsNest_menu_not_941d93: "Not yet.:I read all the stories."
  npc_override_2@nyd_NydhoggsNest_menu_please_139b81: "Please let me out.:I want to look around for a while."
  npc_override_2@nyd_NydhoggsNest_menu_please_70408b: "Please allow me to enter.:I want to go in.:I want to leave."
  npc_override_2@nyd_NydhoggsNest_menu_reset_172fe2: "Reset variables to allow entrance to Nidhoggur:change variable 'ins_nyd':Remove 3 day timer 3135:Confirm variable number"
  npc_override_2@nyd_NydhoggsNest_menu_what_9438b8: "What happened to you?:What's in the cave to the north?:Tell me about your tribe.:I will leave you alone."
  npc_override_2@nyd_NydhoggsNest_menu_what_c4e306: "What's with the cave up north?:Who are the Sapha tribesmen?:Hmm. We can talk later."
  npc_override_2@nyd_NydhoggsNest_menu_who_faa426: "Who are you?:What do you mean?"
  npc_override_2@nyd_NydhoggsNest_menu_world_072448: "World Tree Yggdrasil : There's not much time left. Please hurry."
  npc_override_2@nyd_NydhoggsNest_menu_world_3fe5ad: "World Tree Yggdrasil : I'm... almost at my limit... please hurry up."
  npc_override_2@nyd_NydhoggsNest_menu_world_46b7cd: "World Tree Yggdrasil : My powers are slowly disappearing. Please hurry."
  npc_override_2@nyd_NydhoggsNest_menu_world_58f081: "World Tree Yggdrasil : You did good. Have everyone go to the Magic Circle in the middle, and get ready for the destruction of the nest."
  npc_override_2@nyd_NydhoggsNest_menu_world_cb3c28: "World Tree Yggdrasil : You've failed... but I will use what power I have left... to send you out of here."
  npc_override_2@nyd_NydhoggsNest_message_let_s_see_i_99a5c6: "Message? ...Let's see... I never expected him to write a message..."
  npc_override_2@nyd_NydhoggsNest_might_those_sapha_tribes_4651b6: "Might be... those Sapha tribesmen have dug in the cave before... They do have a special talent for digging."
  npc_override_2@nyd_NydhoggsNest_minutes_s_limit_my_power_a8e237: "30 minutes... that's the limit of my powers. Please hurry."
  npc_override_2@nyd_NydhoggsNest_modeled_after_morocc_the_7a1d45: "Modeled after Morocc, their appearance made it difficult to go around the time-space gap."
  npc_override_2@nyd_NydhoggsNest_most_surprising_thing_fl_a461ec: "The most surprising thing is the flow of time. The 18 assassins had stayed for about 2 weeks in there, yet they returned within 3 hours after departing."
  npc_override_2@nyd_NydhoggsNest_msg_6eae3a: "..."
  npc_override_2@nyd_NydhoggsNest_msg_8707ce: "... ..."
  npc_override_2@nyd_NydhoggsNest_must_reported_reported_h_3dc57e: "This must be reported... reported to the High Priest of Alfheim... Unbelievable."
  npc_override_2@nyd_NydhoggsNest_my_soul_been_trapped_her_3335ad: "My soul... it has been trapped here. You're the only ones I can trust now."
  npc_override_2@nyd_NydhoggsNest_mysterious_power_prevent_25cd00: "A mysterious power prevents you from getting too close. It looks like there is something strong beyond the door..."
  npc_override_2@nyd_NydhoggsNest_name_yggdrasiliad_i_acce_1e0715: "In the name of Yggdrasiliad, I will accept you as a servant of the Guardian."
  npc_override_2@nyd_NydhoggsNest_near_bottom_gate_laphine_f4ccf3: "Near the bottom of the gate, Laphine tribeswomen have been turned to stone and now look like they are part of the great door."
  npc_override_2@nyd_NydhoggsNest_neat_etorr_s_order_pleas_8906a9: "This is Neat Etorr's order. Please come with us to see him."
  npc_override_2@nyd_NydhoggsNest_never_give_attention_um_5ef5b0: "Never give attention to... um... a blunt woman..."
  npc_override_2@nyd_NydhoggsNest_new_world_could_support_782c6d: "The new world could support 3 completely different eco-systems dependant upon the race of people that lived there."
  npc_override_2@nyd_NydhoggsNest_nidhoggur_s_shadow_295ecc: "Nidhoggur's Shadow?"
  npc_override_2@nyd_NydhoggsNest_nidhoggur_s_shadow_came_868869: "Nidhoggur's Shadow came to exist in this world, and harmed the roots of the World Tree... what a disaster."
  npc_override_2@nyd_NydhoggsNest_no_i_t_tell_you_73f130: "No... I can't tell you... It's the secret of our tribe..."
  npc_override_2@nyd_NydhoggsNest_no_let_s_hear_explanatio_b55b97: "No. Let's hear an explanation. Good? Now, if you want..."
  npc_override_2@nyd_NydhoggsNest_no_longer_nest_guardian_21b47a: "This... this is no longer the nest of the Guardian of the World Tree Yggdrasil."
  npc_override_2@nyd_NydhoggsNest_no_no_wait_ok_i_ac1a58: "No... No, wait. Ok, I will accept it. I can accept your admission into the Holy Sekos."
  npc_override_2@nyd_NydhoggsNest_no_wait_sapha_tribesmen_046d11: "No, wait... The Sapha tribesmen know the meaning of that place? Did you ask to associate with them?"
  npc_override_2@nyd_NydhoggsNest_now_allow_me_escort_you_6cbe69: "Now... Allow me to escort you out of the cursed nest."
  npc_override_2@nyd_NydhoggsNest_now_i_am_almost_done_19e1cd: "Now, I am almost done... Who are you? Are you a new assistant to Dr. Magnifier?"
  npc_override_2@nyd_NydhoggsNest_now_if_you_understand_in_5cf479: "Now, if you understand this, inform your friends."
  npc_override_2@nyd_NydhoggsNest_now_s_too_late_hurry_1c3599: "Now's not too late, hurry and get out... tell the Laphine Tribe about this... tell the commanders of Alfheim..."
  npc_override_2@nyd_NydhoggsNest_now_vile_nidhoggur_s_sha_fbe906: "Now the vile Nidhoggur's Shadow is wreaking havoc here..."
  npc_override_2@nyd_NydhoggsNest_now_we_acknowledged_your_5f5504: "For now, we have acknowledged your race, and have been tolerant towards your activities."
  npc_override_2@nyd_NydhoggsNest_now_we_don_t_need_b0389b: "Now, we don't need to talk much about this, so just go back where you came from."
  npc_override_2@nyd_NydhoggsNest_now_we_need_talk_about_74ddbd: "From now on, we need to talk about this with the Laphine tribe."
  npc_override_2@nyd_NydhoggsNest_now_you_try_contact_saph_76852a: "For now, you try to contact the Sapha and Laphine tribes, and try to extract more information."
  npc_override_2@nyd_NydhoggsNest_now_you_try_contact_saph_efb251: "For now, you try to contact the Sapha and Laphine tribes, and try to extract information from them."
  npc_override_2@nyd_NydhoggsNest_now_you_understand_how_s_a33939: "Now you understand how serious this situation is. Because of the Sapha tribe, we are no longer able to approach the Guardian, and seek his teachings of wisdom."
  npc_override_2@nyd_NydhoggsNest_nowadays_world_turned_un_3e03be: "Nowadays, the world has turned unstable. I can't even fly comfortably anymore."
  npc_override_2@nyd_NydhoggsNest_obtain_more_minerals_the_75bf46: "To obtain more minerals, they started to dig with madness."
  npc_override_2@nyd_NydhoggsNest_oh_because_them_we_been_86f441: "Oh! It is because of them that we have been living here, a lowdown and dirty city, for over one hundred years."
  npc_override_2@nyd_NydhoggsNest_oh_here_world_tree_yggdr_7f930c: "Oh, here it is! World Tree Yggdrasil and God's tribes... This is their book!"
  npc_override_2@nyd_NydhoggsNest_oh_sorry_i_took_so_f2949f: "Oh, sorry I took so long. There was too much mail, so it took me a while to find stuff."
  npc_override_2@nyd_NydhoggsNest_okay_if_already_become_l_8a8ede: "Okay, if it has already become like this, I will help you. There are no dead-ends. If you keep going, you will find a solution."
  npc_override_2@nyd_NydhoggsNest_okay_if_you_servant_yggd_8ea32f: "Okay. If you are a servant of the Yggdrasil as you claim to be, I will allow you admission. But I am not responsible for your actions."
  npc_override_2@nyd_NydhoggsNest_okay_let_s_try_contact_2ff605: "Okay, let's try to contact them first, to be clear about any caves or treasures."
  npc_override_2@nyd_NydhoggsNest_once_ugly_shadow_leaves_dc0c0d: "Once the ugly Shadow leaves here to steal power from the other World Yggdrasil Trees, there will be great destruction. This world will become hell."
  npc_override_2@nyd_NydhoggsNest_one_going_mad_guardian_h_d01024: "But the one going mad is not the Guardian, but his dark Shadow...maybe we can trap him here..."
  npc_override_2@nyd_NydhoggsNest_one_killed_our_last_war_6b56a2: "One was killed in our last war with the Sapha tribe... and the other has been taken captive."
  npc_override_2@nyd_NydhoggsNest_one_killed_our_last_war_d87e66: "One was killed in our last war with the Sapha tribe...and I have been taken captive."
  npc_override_2@nyd_NydhoggsNest_only_beginning_we_quite_f20370: "This is only the beginning...we will be quite busy from now on."
  npc_override_2@nyd_NydhoggsNest_only_hvergelmir_sapha_tr_c01424: "Only Hvergelmir of the Sapha tribe escaped from this flooding of blood. And he swore vengeance in Jotunheim, which is covered with foggy snow."
  npc_override_2@nyd_NydhoggsNest_only_marked_guardian_s_s_3f93e2: "Only a marked guardian's servant from the Laphine tribe is allowed to enter."
  npc_override_2@nyd_NydhoggsNest_only_representative_you_aee77d: "And only 1 representative of you needs to talk to me, so don't annoy me..."
  npc_override_2@nyd_NydhoggsNest_opening_gate_failed_bdcc3b: "Opening of the Gate has failed."
  npc_override_2@nyd_NydhoggsNest_other_than_sapha_tribe_t_06e0e7: "Other than the Sapha tribe, there was another tribe beyond the time-space gap, known as the Laphine."
  npc_override_2@nyd_NydhoggsNest_our_academics_religion_t_4c2be7: "Our academics are not a religion. And they too have curiosity about this world's history."
  npc_override_2@nyd_NydhoggsNest_our_current_powers_impos_0a0b26: "With our current powers...it is impossible to defeat the Guardian."
  npc_override_2@nyd_NydhoggsNest_our_hatred_towards_them_898a26: "Our hatred towards them has already reached an abnormal level..."
  npc_override_2@nyd_NydhoggsNest_our_tribe_respected_you_2cda90: "Our tribe has respected you, so just forget about the searching and exploring around here."
  npc_override_2@nyd_NydhoggsNest_outsider_arioss_here_exp_8d9ab1: "Outsider. Arioss here will explain the situation with the giants, talk with him..."
  npc_override_2@nyd_NydhoggsNest_outsider_welcome_manuk_v_4c7b4a: "Outsider. Welcome to Manuk, the village of the Sapha. I am its representative, Neat Etorr."
  npc_override_2@nyd_NydhoggsNest_outsider_welcome_manuk_v_8287e8: "Outsider. Welcome to the Manuk village of Sapha. I am its representative, Neat Etorr."
  npc_override_2@nyd_NydhoggsNest_pass_along_world_tree_yg_8bb45a: "Pass along World Tree Yggdrasil's words."
  npc_override_2@nyd_NydhoggsNest_pass_along_world_tree_yg_aeffbf: "Pass along the World Tree Yggdrasil's message."
  npc_override_2@nyd_NydhoggsNest_path_guardian_s_nest_jus_6d808a: "The path to the Guardian's Nest is just past the waterfall by the large World Tree Yggdrasil to the North."
  npc_override_2@nyd_NydhoggsNest_path_guardian_s_nest_jus_e7ba1b: "The path to the Guardian's Nest is just past the waterfall by the large World Tree Yggdrasil to the North. The defensive mechanisms will start immediately."
  npc_override_2@nyd_NydhoggsNest_path_guardian_s_nest_jus_f1fd7d: "The path to the Guardian's Nest is just past the waterfall by the large World Tree Yggdrasil to the North. The defensive mechanisms of the Sanctuary will start immediately."
  npc_override_2@nyd_NydhoggsNest_perhaps_there_s_great_hi_eb798f: "Perhaps there's a great hidden secret beyond the gate, beyond expectation."
  npc_override_2@nyd_NydhoggsNest_place_banned_order_laphi_9ce951: "That place is banned by order of the Laphine tribe. So, people can't just go there without permission."
  npc_override_2@nyd_NydhoggsNest_place_initially_closed_o_482a61: "That place was initially closed off from the public, but then the giants of the Sapha tribe turned things around..."
  npc_override_2@nyd_NydhoggsNest_please_allow_me_investig_a0953a: "Please allow me to investigate the cave."
  npc_override_2@nyd_NydhoggsNest_please_bring_news_all_sp_252a89: "Please. Bring this news to all of Splendide. Send someone to save me... or they might kill me."
  npc_override_2@nyd_NydhoggsNest_please_enter_password_99d476: "Please enter the password"
  npc_override_2@nyd_NydhoggsNest_please_go_report_those_c_ad9e72: "Please go and report this to those in charge of Splendide and Manuk."
  npc_override_2@nyd_NydhoggsNest_please_meet_guardian_com_760f1d: "Please meet the Guardian, and come back with an answer to everything. I believe in you."
  npc_override_2@nyd_NydhoggsNest_please_meet_guardian_com_edcde1: "Please meet the Guardian, and come back with an answer to everything. And tell the answer to..."
  npc_override_2@nyd_NydhoggsNest_please_meet_guardian_tak_162c96: "Please meet with the Guardian and take a wise answer from him. I will trust you."
  npc_override_2@nyd_NydhoggsNest_please_talk_my_people_sp_a7a384: "Please, talk to my people in Splendide. They will come to help me."
  npc_override_2@nyd_NydhoggsNest_problem_been_root_our_co_90ebd3: "This problem has been the root of our conflicts with the Laphine tribe. Of course, it may also be an opportunity to resolve them."
  npc_override_2@nyd_NydhoggsNest_promised_words_guardian_3aa826: "Promised words... Guardian's spell... proof of their existence."
  npc_override_2@nyd_NydhoggsNest_proof_spell_confirm_you_14094b: "The proof and the spell will confirm that you are one of the Guardian's servants."
  npc_override_2@nyd_NydhoggsNest_protect_yggdrasil_s_laph_5d8b0b: "To protect the Yggdrasil! That's the Laphine's fate. Can you say that about yourself?"
  npc_override_2@nyd_NydhoggsNest_purification_stone_been_21caf0: "Purification stone has been created and will stay on for 30 minutes."
  npc_override_2@nyd_NydhoggsNest_purification_stone_been_5040c0: "The Purification Stone has been destroyed."
  npc_override_2@nyd_NydhoggsNest_purification_stone_destr_33ef8e: "The Purification Stone will be destroyed in one minute."
  npc_override_2@nyd_NydhoggsNest_quest_erased_844a8b: "quest 3135 erased."
  npc_override_2@nyd_NydhoggsNest_reason_behind_all_becaus_9ed54b: "The reason behind all of this... is not because of the Sapha tribe, but because of the sudden leave of the Guardian? And the Guardian has given up on his identity?"
  npc_override_2@nyd_NydhoggsNest_reason_we_don_t_allow_3e16ae: "The reason we don't allow anyone to enter that site is because it's full of suspicions."
  npc_override_2@nyd_NydhoggsNest_received_invitation_saph_67f755: "Received invitation from the Sapha tribe to cooperate and investigate."
  npc_override_2@nyd_NydhoggsNest_recently_because_you_und_5c47c3: "Recently, because you do not understand the current situations, you have done some things that I, as a leader, can't ignore any longer."
  npc_override_2@nyd_NydhoggsNest_records_after_effect_rel_f63281: "^0000FFThe records and after-effect related to the Nidhoggur's Nest have been removed. You can generate and enter the dungeon again.^000000"
  npc_override_2@nyd_NydhoggsNest_remualaash_mu_modtasan_y_513c70: "remuAlaAsh Mu ModtasAn Yu Dur"
  npc_override_2@nyd_NydhoggsNest_report_commander_hibba_a_41062b: "Report to Commander Hibba Agip about what we have discovered, since time is dependent on his decision."
  npc_override_2@nyd_NydhoggsNest_reports_these_adventurer_204a90: "The reports of these adventurers have been sent to representatives of all kingdoms, and an expedition team has been created to find out more information."
  npc_override_2@nyd_NydhoggsNest_right_now_we_standing_pa_d0249e: "Right now, we are standing on part of one of the roots of the World Tree Yggdrasil."
  npc_override_2@nyd_NydhoggsNest_rune_midgarts_approved_r_b82be7: "But Rune-Midgarts approved this research?"
  npc_override_2@nyd_NydhoggsNest_s_about_dr_magnifier_s_66065f: "It's about Dr. Magnifier's report..."
  npc_override_2@nyd_NydhoggsNest_s_all_over_servants_guar_2f8b43: "It's all over... servants of the Guardian... Hurry up and leave this place."
  npc_override_2@nyd_NydhoggsNest_s_because_only_ones_chos_5f23e6: "That's because only the ones chosen by the Guardian may enter."
  npc_override_2@nyd_NydhoggsNest_s_like_commander_they_sp_28083b: "It's not like that, Commander, they speak the truth."
  npc_override_2@nyd_NydhoggsNest_s_lot_please_as_token_1adc4e: "It's not a lot, but please this as a token of our appreciation."
  npc_override_2@nyd_NydhoggsNest_s_our_intention_a3b63b: "It's our intention."
  npc_override_2@nyd_NydhoggsNest_s_s_better_if_you_8e89ac: "It's...it's better if you don't believe the one called Etorr...the minds of the Sapha tribe is unpredictable."
  npc_override_2@nyd_NydhoggsNest_s_surprising_you_able_ob_a5a79f: "It's surprising that you are able to obtain such results. We also have a similar theory."
  npc_override_2@nyd_NydhoggsNest_s_too_messy_due_lots_b54bf5: "It's too messy due to lots of stacked books and files. Dr. Magnifier looks like he has a ton of reports."
  npc_override_2@nyd_NydhoggsNest_s_unbelievable_you_must_44f2b5: "That's unbelievable. You must be insulting the Guardian's and our pride. I did not provide you with our help for that."
  npc_override_2@nyd_NydhoggsNest_s_very_insulting_our_pri_9a275e: "It's very insulting to our pride... but if you can help us enter that place again, and speak to the Guardian, maybe we can find a solution..."
  npc_override_2@nyd_NydhoggsNest_s_why_he_sent_you_7d47e0: "That's why he sent you here. By the way, this isn't the first time I've heard this."
  npc_override_2@nyd_NydhoggsNest_s_why_war_started_i_721f3b: "That's why the war started. But I don't want to fight with the Sapha tribe anymore..."
  npc_override_2@nyd_NydhoggsNest_sapha_tribe_attacked_fir_bad256: "The Sapha tribe attacked first. They are destroying the World Tree."
  npc_override_2@nyd_NydhoggsNest_sapha_tribe_went_as_far_b938b2: "The sapha tribe went as far as cooperating with an unknown race?"
  npc_override_2@nyd_NydhoggsNest_satan_morocc_known_he_di_00d50b: "Satan Morocc has known that he didn't resurrect normally or by himself."
  npc_override_2@nyd_NydhoggsNest_satan_morocc_stopped_des_e3b2d2: "Satan Morocc stopped to destroy the city of Morocc, turning it into a ruined desert, then started to rip the world apart."
  npc_override_2@nyd_NydhoggsNest_satan_morocc_worried_abo_385646: "Satan Morocc was worried about those who would give chase, so he created Morocc clones to keep watch behind him."
  npc_override_2@nyd_NydhoggsNest_schwarzwald_republic_req_72a889: "The Schwarzwald Republic requested approval to find the source of the new metal, and since Rune-Midgarts couldn't complete the test themselves, they finally accepted."
  npc_override_2@nyd_NydhoggsNest_scientists_schwarzwald_c_d87d0f: "The scientists of Schwarzwald created a combination metal, using fragments of metals found in the dimensional gorge."
  npc_override_2@nyd_NydhoggsNest_seems_like_you_did_under_34b913: "It seems like you did not understand what I said. What are you thinking?"
  npc_override_2@nyd_NydhoggsNest_selarsmar_di_marthusvil_0b5dba: "SeLarsmar Di marThusVil U SeMushVohl"
  npc_override_2@nyd_NydhoggsNest_shadow_sucked_all_nutrie_f5fe4b: "The Shadow sucked all the nutrients from the World Tree Yggdrasil, and has gone mad when there is nothing more left to obtain. Now, he wants this land."
  npc_override_2@nyd_NydhoggsNest_sheesh_i_prepared_these_cc445e: "Sheesh~ I prepared these stories for you carefully, but you didn't bother to check anything out did you?"
  npc_override_2@nyd_NydhoggsNest_shouldn_t_i_filed_books_ca11ac: "Shouldn't I have filed the books?"
  npc_override_2@nyd_NydhoggsNest_sigh_since_s_commander_l_4940de: "Sigh, since it's Commander Lebiordirr's wish, I will cooperate with you..."
  npc_override_2@nyd_NydhoggsNest_sir_i_drag_pest_out_fcd83b: "Sir, I can drag this pest out right now."
  npc_override_2@nyd_NydhoggsNest_sir_i_get_rid_rude_96b4d6: "Sir, I can get rid of this rude outsider if you wish?"
  npc_override_2@nyd_NydhoggsNest_sir_you_sure_invasion_ho_764e4d: "Sir... are you sure? This is an invasion of the Holy Sekos..."
  npc_override_2@nyd_NydhoggsNest_so_did_he_already_know_179bf2: "So, did he already know that the Rebirth of Satan Morocc has occurred before?"
  npc_override_2@nyd_NydhoggsNest_so_did_you_read_whole_ae8b68: "So, did you read the whole story that I have prepared?"
  npc_override_2@nyd_NydhoggsNest_so_far_nothing_s_come_bb3560: "So far, nothing's come up... Was it that somebody attacked you?"
  npc_override_2@nyd_NydhoggsNest_so_i_ll_around_if_0cbac1: "Is that so... I'll be around if you want to leave."
  npc_override_2@nyd_NydhoggsNest_so_s_how_we_right_ceef10: "So that's how it is... we were right about some parts of it... it's called the Guardian's Nest."
  npc_override_2@nyd_NydhoggsNest_so_s_nest_guardian_world_20391b: "So... that's the nest of the Guardian of the World Tree, the sacred grounds for the Laphine tribe."
  npc_override_2@nyd_NydhoggsNest_so_since_i_agreed_allow_e2ddf2: "So... since I have agreed to allow your exploration... Arioss, help them, and take the results."
  npc_override_2@nyd_NydhoggsNest_so_we_dispatched_expedit_df82bb: "So we dispatched an expedition here. Soonafter, the war with the Sapha began..."
  npc_override_2@nyd_NydhoggsNest_so_what_i_care_about_f61a15: "So... What do I care about an outsider's report?"
  npc_override_2@nyd_NydhoggsNest_so_you_re_priestess_laph_8c1fe5: "So you're not priestess of the Laphine Tribe... How did you get in? No, there's no time to answer that."
  npc_override_2@nyd_NydhoggsNest_somehow_truth_come_out_w_79c866: "Somehow, the truth will come out, but we should be careful of shocking the natives if we go there unannounced and they're not prepared for our arrival."
  npc_override_2@nyd_NydhoggsNest_sometimes_dispatched_res_c7ebc1: "Sometimes, the dispatched researchers hang around here... I feel bad that there's nothing to see... without any reason..."
  npc_override_2@nyd_NydhoggsNest_speak_his_highness_world_84cf18: "Do not speak of His Highness, the World Tree Yggdrasil's name so lightly."
  npc_override_2@nyd_NydhoggsNest_splendide_office_don_t_a_742d3f: "This is the Splendide office. Don't act impolitely."
  npc_override_2@nyd_NydhoggsNest_spot_connected_world_tre_4a68a9: "This spot is connected to World Tree by the root. I think we can expect confrontations between the Sapha and Laphine here eventually, don't you think?"
  npc_override_2@nyd_NydhoggsNest_still_adventurers_gave_c_876a2f: "Still the adventurers gave chase. They came from all over the world, trying to approach the Dimensional Gorge."
  npc_override_2@nyd_NydhoggsNest_strange_one_thank_you_he_e8f33e: "Strange one, thank you for helping us in the time of need. I will never forget your kindness."
  npc_override_2@nyd_NydhoggsNest_strange_one_thank_you_yo_2c62bc: "Strange one, thank you for your cooperation in such situations... Please forget what has happened today..."
  npc_override_2@nyd_NydhoggsNest_strange_one_we_hope_our_b9ba03: "Strange one, we hope our cooperation will be a good one. Now please go interrogate the Laphine prisoner."
  npc_override_2@nyd_NydhoggsNest_strange_power_slowly_sur_b82577: "The strange power slowly surrounds your body, the dimension is starting to shift."
  npc_override_2@nyd_NydhoggsNest_strange_sensation_surrou_106d98: "The strange sensation surrounding your body has disappeared"
  npc_override_2@nyd_NydhoggsNest_sure_mainland_also_lots_184061: "Sure, the mainland also has lots of interesting adventures... Hello, I am Magnifier, a historian dispatched from the Prontera royal court."
  npc_override_2@nyd_NydhoggsNest_t_compare_effort_you_put_cc3ecf: "It can't compare with the effort you have put in for us... but please accept our token of friendship."
  npc_override_2@nyd_NydhoggsNest_talsehrdur_so_cyaremush_6b72cc: "TalsehrDur So CyaReMush Di DielAlaWos Ie RuffserIman Ie "
  npc_override_2@nyd_NydhoggsNest_thank_you_helping_us_suc_04cc96: "Thank you for helping us with such a huge problem. You may forget about it now."
  npc_override_2@nyd_NydhoggsNest_thank_you_you_re_saviour_ec64de: "Thank you. You're the saviour of humans and the Laphine Tribe."
  npc_override_2@nyd_NydhoggsNest_then_i_ll_ask_sapha_03e1cc: "Then I'll ask the Sapha for help."
  npc_override_2@nyd_NydhoggsNest_then_we_ll_leave_you_b031a3: "Then we'll leave it to you. As for your request, I will do my best to cooperate."
  npc_override_2@nyd_NydhoggsNest_there_45f1b0: "There is..."
  npc_override_2@nyd_NydhoggsNest_there_flood_adventurer_a_d2aac9: "There was a flood of adventurer applications. Lots of volunteers disappeared over the dimensional gorge, and they brought back new data."
  npc_override_2@nyd_NydhoggsNest_there_no_way_resolve_com_c64756: "Is there no way to resolve this by communicating? There's no meaning in useless combat! Geez."
  npc_override_2@nyd_NydhoggsNest_there_nothing_else_we_022b67: "Is there nothing else we can do?"
  npc_override_2@nyd_NydhoggsNest_therefore_s_more_reason_47b8b3: "Therefore, it's more of a reason to depend on our own powers. There is no room for you to interfere. Please give up."
  npc_override_2@nyd_NydhoggsNest_they_associated_together_7102b5: "They associated together to gather volunteers. The Assassin Guild was the first to volunteer."
  npc_override_2@nyd_NydhoggsNest_they_declared_they_atten_2b67db: "They have declared they will attend to the high courts for the first time in 1000 human years, since the end of the battles of Gods vs. Magicians."
  npc_override_2@nyd_NydhoggsNest_they_don_t_care_if_03eb3e: "They don't care if there's trouble with the Yggdrasil."
  npc_override_2@nyd_NydhoggsNest_they_had_discovered_anot_81ab3e: "They had discovered another world with a definitively different nature and environment. And indeed, people could also live there."
  npc_override_2@nyd_NydhoggsNest_they_mining_metal_so_doi_e2f6c4: "They are mining metal, and in so doing, destroying the World Tree's roots..."
  npc_override_2@nyd_NydhoggsNest_they_surely_full_bad_ide_4b779f: "They are surely full of bad ideas, so... they have destroyed the Yggdrasil's root."
  npc_override_2@nyd_NydhoggsNest_they_whisper_each_other_abbeee: "They whisper to each other, so... something is there... But I don't care..."
  npc_override_2@nyd_NydhoggsNest_things_actually_become_l_c1e826: "Things have actually become like this... as priests of the Guardian, it's our responsibility..."
  npc_override_2@nyd_NydhoggsNest_those_giants_they_really_2e5cd9: "Those giants...can they really be trusted?"
  npc_override_2@nyd_NydhoggsNest_those_obnoxious_dwarves_bf1c70: "Those obnoxious dwarves offended our right of living, and are trying to get rid of us."
  npc_override_2@nyd_NydhoggsNest_those_reports_haven_t_co_2f162a: "But those reports haven't come out yet. Have they?"
  npc_override_2@nyd_NydhoggsNest_those_who_want_taint_sac_ce2cba: "Those who want to taint the sacred Sanctuary of the Guardian... Get out."
  npc_override_2@nyd_NydhoggsNest_thusdurnah_ra_sharveldiy_96066d: "ThusDurnah Ra SharVeldIyaz U UorAmanDur Yee neaOsaAdor Yee "
  npc_override_2@nyd_NydhoggsNest_thusdurnah_ra_sharveldiy_b8cf35: "ThusDurnah Ra SharVeldIyaz U UorAmanDur Yee neaOsaAdor Yee..."
  npc_override_2@nyd_NydhoggsNest_time_limit_enter_dungeon_970f47: "The time limit to enter the dungeon has expired. You must wait for the World Tree to stabilize its power before trying to re-enter."
  npc_override_2@nyd_NydhoggsNest_time_ymir_s_fall_his_de23f8: "At that time of Ymir's fall his blood flooded the world... killing all in it's path."
  npc_override_2@nyd_NydhoggsNest_tkeh_likek_ohek_qekhlhkl_e14af3: "Tkeh likek Ohek QekhlHkl PkedlioH."
  npc_override_2@nyd_NydhoggsNest_two_tribes_some_trouble_7ac85f: "The two tribes have some trouble amongst their top leaders. It's not anything official, but..."
  npc_override_2@nyd_NydhoggsNest_unknown_error_occurred_58bda4: "An unknown error has occurred."
  npc_override_2@nyd_NydhoggsNest_unless_you_any_messages_6082b1: "Unless you have any messages for me...? Your face says you do..."
  npc_override_2@nyd_NydhoggsNest_use_your_powers_destroy_d9b124: "Use your powers... and destroy the vile Shadow..."
  npc_override_2@nyd_NydhoggsNest_vohllarsmar_ha_dielcyata_fc095e: "VohlLarsmar Ha DielCyatas"
  npc_override_2@nyd_NydhoggsNest_voice_disappeared_dark_p_32d09b: "The voice has disappeared, and the dark power is calming down from behind the stone gate."
  npc_override_2@nyd_NydhoggsNest_wait_second_i_brilliant_1fbc42: "Wait a second... I have a brilliant idea."
  npc_override_2@nyd_NydhoggsNest_we_been_guardian_s_serva_e44840: "We have been the Guardian's servants for generations, and have been protecting the World Tree ever since."
  npc_override_2@nyd_NydhoggsNest_we_captured_laphine_trib_aed38f: "We have captured a Laphine tribe priest during the last war, and we have heard that you have had contact with said captive."
  npc_override_2@nyd_NydhoggsNest_we_didn_t_try_solve_c27cea: "We didn't try to solve the problems with talk. We attacked them first."
  npc_override_2@nyd_NydhoggsNest_we_don_t_know_if_1a0453: "We don't know if the monsters there are strong, so we never checked it out. But on a personal level, nobody wants to go there..."
  npc_override_2@nyd_NydhoggsNest_we_expecting_lot_you_exp_120d10: "We are expecting a lot from you, expert adventurer. So, if you find anything... just tell me."
  npc_override_2@nyd_NydhoggsNest_we_gained_large_amount_k_b7cc23: "We have gained a large amount of knowledge today, but..."
  npc_override_2@nyd_NydhoggsNest_we_here_make_sure_sapha_417ab1: "We are here to make sure that the Sapha don't make things worse."
  npc_override_2@nyd_NydhoggsNest_we_just_small_village_no_77eee7: "We are just a small village, nothing special... but rest comfortably."
  npc_override_2@nyd_NydhoggsNest_we_live_different_time_d_d02df1: "We live in a... different time, different land... we came for an expedition."
  npc_override_2@nyd_NydhoggsNest_we_need_lot_more_informa_c60334: "But we need a lot more information... Are they refusing you admission?"
  npc_override_2@nyd_NydhoggsNest_we_really_just_letting_t_a20768: "Are we really just letting these people go after they have stirred up problems on our land?"
  npc_override_2@nyd_NydhoggsNest_we_recently_started_susp_dea58a: "But we have recently started to suspect you of being the Laphine tribe's eyes and ears."
  npc_override_2@nyd_NydhoggsNest_we_still_unstable_relati_fbd34f: "We still have an unstable relationship with the Sapha, we usually don't worry about outsiders."
  npc_override_2@nyd_NydhoggsNest_we_understand_each_other_78fc88: "Do we not understand each other? What do you want?"
  npc_override_2@nyd_NydhoggsNest_welcome_laphine_camp_spl_b9de41: "Welcome to the Laphine camp in Splendide, outsider... I am Lebiordirr. I am in charge here."
  npc_override_2@nyd_NydhoggsNest_well_i_m_sure_we_ed1eee: "Well... I'm not sure, but we have avoided going to that area."
  npc_override_2@nyd_NydhoggsNest_what_doctor_s_area_exper_c3ae5d: "What is the Doctor's area of expertise?"
  npc_override_2@nyd_NydhoggsNest_what_guardian_his_nest_1772a8: "What? The Guardian is not in his nest...?"
  npc_override_2@nyd_NydhoggsNest_what_huge_discovery_so_n_40bef0: "What a huge discovery... So Nidhoggur is no longer the Guardian of the World Tree...?"
  npc_override_2@nyd_NydhoggsNest_what_i_tell_you_disrespe_866047: "From what I can tell, you are disrespecting my request. Is this your intention, or your people's intention?"
  npc_override_2@nyd_NydhoggsNest_what_if_you_wander_aroun_ee8cf8: "What? If you wander around there... you might return with injuries."
  npc_override_2@nyd_NydhoggsNest_what_priest_guardian_sai_67af1a: "Is that what the priest of the Guardian said?"
  npc_override_2@nyd_NydhoggsNest_what_s_happening_let_s_97d1e7: "What's happening? Let's go check it out."
  npc_override_2@nyd_NydhoggsNest_what_s_woman_laphine_tri_b638cc: "What's a woman from the Laphine Tribe doing here..."
  npc_override_2@nyd_NydhoggsNest_what_they_re_doing_right_b5afc5: "What they're doing right now could potentially lead us to a solution."
  npc_override_2@nyd_NydhoggsNest_what_we_figured_out_how_b5efab: "What we have figured out... how is it going to influence mankind? It's so unpredictable..."
  npc_override_2@nyd_NydhoggsNest_what_you_expect_when_man_ceec9e: "What can you expect when Manuk giants start to dig into the world to destroy the Yggdrasil..."
  npc_override_2@nyd_NydhoggsNest_what_you_need_59dbe5: "What do you need to do?"
  npc_override_2@nyd_NydhoggsNest_what_you_saying_arioss_f_dbf3a6: "What are you saying? Arioss, do not forget your place as the Guardian's priest."
  npc_override_2@nyd_NydhoggsNest_what_you_talking_about_o_1178f5: "What are you talking about, outsider?"
  npc_override_2@nyd_NydhoggsNest_what_your_purpose_why_yo_eb47cf: "What is your purpose? Why do you want to know what that place is?"
  npc_override_2@nyd_NydhoggsNest_when_faint_light_enters_12a552: "When a faint light enters your heart, a voice sounds in your head."
  npc_override_2@nyd_NydhoggsNest_when_we_finished_combat_498947: "When will we be finished with this combat with the Sapha? Ugghhhh..."
  npc_override_2@nyd_NydhoggsNest_when_you_touch_stone_gat_9af664: "When you touch the stone gate, you hear a commanding voice."
  npc_override_2@nyd_NydhoggsNest_where_other_servants_so_d6347d: "Where are the other servants, so you can work together? Each servant cannot be admitted here individually..."
  npc_override_2@nyd_NydhoggsNest_which_variable_you_want_c321d8: "Which variable do you want to change?"
  npc_override_2@nyd_NydhoggsNest_while_ago_while_you_tran_f07596: "But a while ago, while you were tranferring reports from Commander Agip to the mainland, you lost those reports... remember?"
  npc_override_2@nyd_NydhoggsNest_why_you_come_back_outsid_4d5fcd: "Why have you come back, outsider?"
  npc_override_2@nyd_NydhoggsNest_why_you_standing_there_g_5eb2e2: "Why are you standing there? Go to my assistant in the Prontera Library!"
  npc_override_2@nyd_NydhoggsNest_why_you_want_explore_bet_72b652: "Why do you want to explore? It better be a very good reason."
  npc_override_2@nyd_NydhoggsNest_wingless_one_our_promise_2a5c4f: "Wingless one... Our promised words..."
  npc_override_2@nyd_NydhoggsNest_world_tree_yggdrasil_sta_a70421: "The World Tree Yggdrasil has stabilized. Would you like to enter Nidhoggur's Nest again?"
  npc_override_2@nyd_NydhoggsNest_worst_thing_strange_thin_f9b075: "And the worst thing is... that strange things are strutting along the streets of the towns..."
  npc_override_2@nyd_NydhoggsNest_yes_i_heard_your_convers_bd59cf: "Yes...I heard your conversation with the Sapha tribe..."
  npc_override_2@nyd_NydhoggsNest_yes_s_nest_nidhoggur_gua_3735df: "Yes, that's the nest of Nidhoggur, the Guardian of the World Tree..."
  npc_override_2@nyd_NydhoggsNest_yes_you_what_you_think_12a270: "Yes, you... What do you think about the way the government is handling this...?"
  npc_override_2@nyd_NydhoggsNest_yggdrasil_gatekeeper_nyd_69b737: "The Yggdrasil Gatekeeper at nyd_dun02 100 201 is now On."
  npc_override_2@nyd_NydhoggsNest_yggdrasil_gatekeeper_nyd_f3ff3a: "The Yggdrasil Gatekeeper at nyd_dun02 100 201 is now OFF."
  npc_override_2@nyd_NydhoggsNest_you_any_proof_your_birth_152b6c: "Do you have any proof of your birth with Odin and Yggdrasil's blessings?"
  npc_override_2@nyd_NydhoggsNest_you_d_better_behave_aide_ee51cd: "You'd better behave, Aide Arioss says that different races shall be treated the same way."
  npc_override_2@nyd_NydhoggsNest_you_didn_t_ask_admitted_3af3e2: "You didn't ask to be admitted... You should accept admission first before entering."
  npc_override_2@nyd_NydhoggsNest_you_don_t_need_worry_198c82: "You don't need to worry about this, Arioss. As commander, I will handle it. You just pretend nothing happened..."
  npc_override_2@nyd_NydhoggsNest_you_ever_come_contact_la_1c15e0: "Have you ever come in contact with the Laphine tribe? Have you ever been to Splendide?"
  npc_override_2@nyd_NydhoggsNest_you_finally_showed_your_122bb8: "You finally showed your true face. I knew you were a spy from the Laphine tribe!"
  npc_override_2@nyd_NydhoggsNest_you_heard_all_now_please_f3deb7: "You have heard it all, now please report back to your race."
  npc_override_2@nyd_NydhoggsNest_you_ll_obtain_others_tru_306080: "You'll have to obtain the others trust in the expendition camp by working hard."
  npc_override_2@nyd_NydhoggsNest_you_look_like_you_lot_856c41: "You look like you have a lot on your mind... Your face is full of curiosity and questions."
  npc_override_2@nyd_NydhoggsNest_you_might_complain_about_e6dfd2: "You might complain about why I didn't bring any myself... That's because I trust your abilities, don't ever take anything for granted."
  npc_override_2@nyd_NydhoggsNest_you_must_tell_commanders_cfd024: "You must... tell the commanders of Alfheim about this, and come up with a plan. Only them..."
  npc_override_2@nyd_NydhoggsNest_you_need_me_something_st_e0097d: "Do you need me for something, strange one?"
  npc_override_2@nyd_NydhoggsNest_you_sapha_tribe_you_outs_d3c898: "You... are not of the Sapha tribe... Are you... an outsider?"
  npc_override_2@nyd_NydhoggsNest_you_should_already_seen_6ef40d: "You should have already seen what is going on. We have been at war with the Laphine tribe for a very long time."
  npc_override_2@nyd_NydhoggsNest_you_should_cautious_our_68d687: "You should be cautious. Our tribe has respected the existence of you humans but..."
  npc_override_2@nyd_NydhoggsNest_you_trying_insult_me_pur_3025a4: "Are you trying to insult me on purpose, outsider?"
  npc_override_2@nyd_NydhoggsNest_you_ve_come_back_good_1c5992: "You've come back... Good, how's Naomi? Actually, I don't need to worry about her. She is always cheerful. Haha."
  npc_override_2@nyd_NydhoggsNest_you_ve_defeated_nidhoggu_401391: "You've defeated Nidhoggur's Shadow. But...It's not gone for good. Its powers are merely put to sleep."
  npc_override_2@nyd_NydhoggsNest_you_want_go_there_find_d65508: "You want to go there to find out exactly what that place is?"
  npc_override_2@nyd_NydhoggsNest_you_willing_accept_missi_0dd461: "Are you willing to accept this mission? Even if it means to pay with your life?"
  npc_override_2@nyd_NydhoggsNest_you_won_us_plenty_time_586f9e: "But you have won us plenty of time. This is great."
  npc_override_2@nyd_NydhoggsNest_you_you_one_collecting_i_e684de: "Are you...? Are you the one collecting information from my soldiers...?"
  npc_override_2@nyd_NydhoggsNest_your_people_who_no_direc_153d66: "For your people, who have no direct connections, it is not a place to satisfy your curiosity. I hope that you stop your investigations, and mind your own business."
  npc_override_2@nyd_NydhoggsNest_your_people_who_no_direc_dedf2f: "For your people, who have no direct connections, it is not a place satisfy your curiosity. I hope that you stop your investigations, and mind your own business."
  npc_override_2@nyd_NydhoggsNest_your_race_come_land_long_769a48: "Your race has come to this land not long ago through the space-time gap."
