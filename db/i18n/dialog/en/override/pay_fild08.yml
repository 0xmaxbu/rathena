Body:
  npc_override_pay_fild08_spirit_handler_aaaah_7a612c: "Aaaah!!!"
  npc_override_pay_fild08_spirit_handler_aaaah_b2af69: "Aaaah~~"
  npc_override_pay_fild08_spirit_handler_aaah_2a86dc: "Aaah!!!"
  npc_override_pay_fild08_spirit_handler_about_delicious_smell_edeaaf: "About the delicious smell."
  npc_override_pay_fild08_spirit_handler_about_food_fell_street_5d3ad3: "About the food that fell on the street."
  npc_override_pay_fild08_spirit_handler_about_lee_daegam_c8b979: "About Lee Daegam."
  npc_override_pay_fild08_spirit_handler_about_request_b4473b: "About the request."
  npc_override_pay_fild08_spirit_handler_about_wild_animals_82525f: "About wild animals."
  npc_override_pay_fild08_spirit_handler_adventurer_base_lv_job_l_04b95f: "Adventurer of ^dd5555Base LV200/Job LV60^000000 or higher."
  npc_override_pay_fild08_spirit_handler_all_right_441c8d: "All right."
  npc_override_pay_fild08_spirit_handler_animals_seem_moved_strai_6b8f41: "- The animals seem to have moved straight down the road to the firewood workshop. -"
  npc_override_pay_fild08_spirit_handler_anyway_adventurer_took_o_bef246: "Anyway, the adventurer took over the job, so I can see some clues!"
  npc_override_pay_fild08_spirit_handler_around_box_animal_footpr_4aa8fa: "- Around the box, animal footprints are imprinted in disorder, and as the Carpenter Firewood said, they appear to be herbivorous footprints. -"
  npc_override_pay_fild08_spirit_handler_as_chulho_said_i_wanted_75ae5c: "As Chulho said, I wanted to at least hold a feast to repay you, but staying in this Deep Forest for a long time is dangerous to those outside the forest, so I feel heavy to send them back in a hurry without even telling them a proper goodbye."
  npc_override_pay_fild08_spirit_handler_as_you_ve_heard_before_94e7aa: "As you've heard before, he is a great leader, ^123456Lee Daegam^000000, who left this job to me."
  npc_override_pay_fild08_spirit_handler_barn_door_locked_well_i_148f92: "The barn door was locked well, I was in the yard the whole time and no one passed by."
  npc_override_pay_fild08_spirit_handler_besides_those_things_you_01f788: "Besides, those are things you shouldn't eat!"
  npc_override_pay_fild08_spirit_handler_boss_out_office_right_no_9e7ad3: "The boss is out of the office right now."
  npc_override_pay_fild08_spirit_handler_cannot_complete_quest_12713b: "cannot complete the quest."
  npc_override_pay_fild08_spirit_handler_carpentry_request_fdc54a: "The carpentry request..."
  npc_override_pay_fild08_spirit_handler_chief_fc87c0: "Chief?"
  npc_override_pay_fild08_spirit_handler_closer_look_broken_tools_92761f: "- A closer look at the broken tools shows a blurry stain. -"
  npc_override_pay_fild08_spirit_handler_contains_broken_tools_bd3a5c: "- It contains broken tools. -"
  npc_override_pay_fild08_spirit_handler_could_you_wait_moment_pl_43419f: "Could you wait a moment, please~?"
  npc_override_pay_fild08_spirit_handler_dear_c6bbcc: "Dear {0}."
  npc_override_pay_fild08_spirit_handler_did_lee_daegam_send_you_019682: "Did Lee Daegam send you?"
  npc_override_pay_fild08_spirit_handler_doesn_t_look_much_differ_6d5df1: "It doesn't look much different from yesterday."
  npc_override_pay_fild08_spirit_handler_eddga_told_me_he_coming_4baddd: "Eddga told me he was coming..."
  npc_override_pay_fild08_spirit_handler_eheh_efae0b: "Eheh~~!!"
  npc_override_pay_fild08_spirit_handler_eheheh_3979e1: "Eheheh!"
  npc_override_pay_fild08_spirit_handler_first_all_call_person_in_e28c30: "First of all, call a person to investigate the barn quietly. Next, tell them to go to the kitchen and prepare a meal quickly because they need food for immediate use."
  npc_override_pay_fild08_spirit_handler_font_size_aaah_font_90bc91: "<FONT SIZE = 16>Aaah~~!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_after_everyone_448eff: "<FONT SIZE = 14>After everyone left, there were no delicious fruits left, but there were footprints everywhere. So... I followed them here.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_ahem_font_629047: "<FONT SIZE = 16>Ahem!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_although_hyunr_209dc5: "<FONT SIZE = 14>Although Hyunrok won't come out!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_as_expected_hy_b74d45: "<FONT SIZE = 14>As expected, Hyunrok seems to have noticed!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_b_ah_b_265597: "<FONT SIZE = 18><B>Ah!!!!!!!!!</B></FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_b_why_b_a39757: "<FONT SIZE = 18><B>Why?</B></FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_churup_font_55637c: "<FONT SIZE = 16>Churup...</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_course_forest_f75b63: "<FONT SIZE = 14>Of course the forest is fun too!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_cute_font_bead72: "<FONT SIZE = 14>Cute!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_did_he_go_257e16: "<FONT SIZE = 10>Did he go to the forest again!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_doesn_t_matter_6fae41: "<FONT SIZE = 14>But it doesn't matter if it smells good and it's bitter, angry, and gives a stomachache.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_even_friends_w_e9045a: "<FONT SIZE = 14>Even the friends who followed the food here went home angry!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_follow_me_font_4411f0: "<FONT SIZE = 14>Follow me.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_gasp_font_f491d2: "<FONT SIZE = 14>Gasp!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_gentleman_out_eab9f4: "<FONT SIZE = 14>This gentleman is out and gone again!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_go_ahead_read_4857b8: "<FONT SIZE = 14>Go ahead and read it!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_good_boy_font_85bf75: "<FONT SIZE = 18>Good boy!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_here_font_dec6ca: "<FONT SIZE = 14>Here it is!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_hmph_font_80613b: "<FONT SIZE = 18>Hmph!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_how_delicious_476be0: "<FONT SIZE = 14>How delicious was it to eat it without a trace?</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_huh_font_214b32: "<FONT SIZE = 14>Huh...</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_huh_font_db8433: "<FONT SIZE = 14>Huh?</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_hurry_up_font_27e135: "<FONT SIZE = 16>Hurry up!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_hyunrok_always_9d3570: "<FONT SIZE = 14>Hyunrok always says things that are hard to understand!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_hyunrok_big_tr_d4b12c: "<FONT SIZE = 14>Hyunrok will be in big trouble if he finds out that he gave strange medicine to his friends as well as digging through the forest to make something weird!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_am_chulho_b69ed9: "<FONT SIZE = 14>I am Chulho.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_didn_t_1c169c: "<FONT SIZE = 14>I didn't want it!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_don_t_70676e: "<FONT SIZE = 14>I don't know who it is, but I better not catch you stealing in my barn!!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_followed_you_ab31e0: "<FONT SIZE = 14>I followed you because I thought something interesting happened and you were walking so excitedly.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_i_m_18a164: "<FONT SIZE = 14>I~~ I'm a spirit from the forest.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_just_drooled_48b3f2: "<FONT SIZE = 14>I just drooled!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_just_out_e4de74: "<FONT SIZE = 14>I was just out playing.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_m_angry_81eb84: "<FONT SIZE = 16>I'm angry!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_m_trouble_dd759e: "<FONT SIZE = 14>I'm in trouble!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_saved_becaus_8749f4: "<FONT SIZE = 14>I saved it because it was a fun item, but I'll give it to you!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_t_work_bc4b42: "<FONT SIZE = 14>I can't work because the tools keep breaking down!!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_i_ve_been_c0de83: "<FONT SIZE = 14>I've been waiting!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_if_boss_asked_007b60: "<FONT SIZE = 10>If the boss asked you to do it, you should've told me!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_if_you_re_76f245: "<FONT SIZE = 14>If you're here to tease me, you're just disturbing me, so go back!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_kisul_nice_fon_7c63c4: "<FONT SIZE = 14>Kisul is nice!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_kwang_saeng_fo_50ef43: "<FONT SIZE = 16>Kwang Saeng!!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_let_s_go_f3974d: "<FONT SIZE = 16>Let's go!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_let_s_hurry_48ff5a: "<FONT SIZE = 14>Let's hurry up, go in and stop Hyunrok.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_my_stomach_hur_744921: "<FONT SIZE = 18>My stomach hurts!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_font_47e2a8: "<FONT SIZE = 17>Oh!!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_i_i_b4e78f: "<FONT SIZE = 14>Oh... I... I...!!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_letter_hyun_0b80ca: "<FONT SIZE = 14>Oh, and this is a letter from Hyunrok!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_my_font_0dfdb5: "<FONT SIZE = 14>Oh my!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_no_font_bee669: "<FONT SIZE = 16>Oh no!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_no_font_c602f7: "<FONT SIZE = 14>Oh no!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_oh_old_man_a596ee: "<FONT SIZE = 14>Oh, that old man!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_road_over_ther_819bb7: "<FONT SIZE = 14>The road over there smells delicious, but that road is on the way to the village, so we, the mountain animals, will be in trouble if we go that way!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_s_delicious_de_5e29d8: "<FONT SIZE = 14>It's delicious! Delicious!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_s_hard_come_4a81d1: "<FONT SIZE = 14>It's hard to come to the Deep Forest now, but come to think of it, I just have to come out to play!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_s_much_better_e01da5: "<FONT SIZE = 14>It's much better than the strawberries I ate in the forest!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_s_right_font_8b0b21: "<FONT SIZE = 14>That's right!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_s_right_font_cd3660: "<FONT SIZE = 16>That's right!!!!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_see_you_again_7c8663: "<FONT SIZE = 14>See you again</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_sir_font_7f139b: "<FONT SIZE = 16>Sir!!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_sir_font_91e2ec: "<FONT SIZE = 16>Sir!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_smell_front_fo_65e4d2: "<FONT SIZE = 14>The smell from the front of the forest is connected to the road to the village.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_smells_delicio_99553e: "<FONT SIZE = 14>It smells delicious, but it makes you sick.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_smells_so_bad_e56dac: "<FONT SIZE = 14>It smells so bad here!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_sorry_font_b9a96b: "<FONT SIZE = 14>Sorry!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_take_too_font_449973: "<FONT SIZE = 14>And take this, too!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_then_i_saw_7f8a18: "<FONT SIZE = 14>Then I saw an unusually ripe fruit on the floor, so I looked away for a moment and everyone left.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_there_many_fri_d5d4f6: "<FONT SIZE = 14>There are many friends in the forest!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_there_s_anothe_0dae8a: "<FONT SIZE = 14>There's another great snake strawberry!!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_there_s_so_0f8cce: "<FONT SIZE = 14>There's so much fun outside the forest!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_things_i_ate_e1bc5d: "<FONT SIZE = 14>The things I ate in the forest were sweet and delicious, but the snake strawberries I picked up earlier were bitter!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_today_i_m_ac768e: "<FONT SIZE = 14>Today, I'm playing in the forest waving branches, and other friends are flocking along the road.</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_walking_everyo_98dc8d: "<FONT SIZE = 14>Walking with everyone, it was quite fun because there were ^dd5555fruits and grains^000000. Things that were hard to see in the forest on the floor!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_we_re_trouble_2e7527: "<FONT SIZE = 16>We're in trouble!!!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_welcome_custom_3981f1: "<FONT SIZE = 14>Welcome~ Customer~!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_did_say_a86210: "<FONT SIZE = 14>What did it say?</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_font_7d577d: "<FONT SIZE = 10>What?</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_font_82829e: "<FONT SIZE = 14>What!?</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_if_we_799004: "<FONT SIZE = 14>What if we're in big trouble?</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_s_hideous_72a0d4: "<FONT SIZE = 14>What's this hideous atmosphere!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_what_you_givin_86af1a: "<FONT SIZE = 14>What are you giving me?</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_factory_fo_941dcf: "<FONT SIZE = 14>Do you have a factory~</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_finished_r_7aaa19: "<FONT SIZE = 14>Have you finished reading the letter?</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_gave_me_cc5733: "<FONT SIZE = 14>You gave me delicious food, so I'll take you to the place you're curious about, with the delicious smell!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_really_giv_4eebb6: "<FONT SIZE = 14>Are you really giving it to me?!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_t_eat_ebe4a7: "<FONT SIZE = 14>You can't eat that!</FONT>"
  npc_override_pay_fild08_spirit_handler_font_size_you_worried_ab_221780: "<FONT SIZE = 14>Are you worried about your stomachache?</FONT>"
  npc_override_pay_fild08_spirit_handler_food_seems_piled_up_f885a3: "- The food seems to be piled up."
  npc_override_pay_fild08_spirit_handler_footprints_showing_way_ab10d3: "- Footprints are showing the way."
  npc_override_pay_fild08_spirit_handler_footprints_similar_those_48e75b: "Footprints similar to those found next to the toolbox are stamped. -"
  npc_override_pay_fild08_spirit_handler_free_up_some_space_7908ba: "- Free up some space -"
  npc_override_pay_fild08_spirit_handler_fun_see_footprints_ebf9e7: "Is it fun to see footprints?"
  npc_override_pay_fild08_spirit_handler_give_him_strawberry_b2b3db: "Give him a strawberry."
  npc_override_pay_fild08_spirit_handler_given_large_deep_footpri_f401a2: "Given the large and deep footprints, it seems to be a huge herbivore. -"
  npc_override_pay_fild08_spirit_handler_good_animals_d38b6b: "Good with animals."
  npc_override_pay_fild08_spirit_handler_haha_f71aba: "Haha."
  npc_override_pay_fild08_spirit_handler_he_grumpy_gentleman_he_w_05d416: "He was a grumpy gentleman, but he wasn't that bad of a person, so what happened..."
  npc_override_pay_fild08_spirit_handler_he_s_already_over_his_88a235: "He's already in over his head, so wouldn't he take care of it?"
  npc_override_pay_fild08_spirit_handler_he_s_only_disturbing_me_785924: "He's only disturbing me, let alone helping me with what I've entrusted with you."
  npc_override_pay_fild08_spirit_handler_hehehe_0a5b10: "Hehehe."
  npc_override_pay_fild08_spirit_handler_hm_5ea458: "Hm..."
  npc_override_pay_fild08_spirit_handler_hold_second_here_ca4fa2: "- Hold on a second here!! -"
  npc_override_pay_fild08_spirit_handler_how_could_someone_throw_6d8f63: "How could someone throw food on the street? Food is precious, it's such a waste!!"
  npc_override_pay_fild08_spirit_handler_how_did_you_get_here_109f1b: "How did you get here so soon?!"
  npc_override_pay_fild08_spirit_handler_how_long_been_since_you_478f44: "How long has it been since you roasted it? Are you sending someone here again?!"
  npc_override_pay_fild08_spirit_handler_how_world_could_happen_53705d: "How in the world could that happen..."
  npc_override_pay_fild08_spirit_handler_huh_80ee84: "Huh..."
  npc_override_pay_fild08_spirit_handler_i_came_out_while_because_4386a0: "I came out for a while because I didn't have any progress on my work and I was so frustrated, but I didn't expect a customer to visit me."
  npc_override_pay_fild08_spirit_handler_i_came_quickly_because_y_4d7d49: "I came quickly because you said you were looking for me in a hurry."
  npc_override_pay_fild08_spirit_handler_i_came_request_92f63d: "I came for the request."
  npc_override_pay_fild08_spirit_handler_i_came_scold_those_who_0aa7bd: "I came to scold those who sprayed strange things because it was <FONT SIZE = 14><B>annoying</B></FONT> to keep coming."
  npc_override_pay_fild08_spirit_handler_i_don_t_know_when_c3ceb9: "I don't know when he'll be back."
  npc_override_pay_fild08_spirit_handler_i_don_t_think_s_f91b5a: "I don't think it's from the woodworking shop, but it's a personal request from the owner~"
  npc_override_pay_fild08_spirit_handler_i_found_another_trace_369297: "- I found another trace. -"
  npc_override_pay_fild08_spirit_handler_i_found_another_trace_4a6182: "- I found another trace."
  npc_override_pay_fild08_spirit_handler_i_got_information_there_ad7842: "- I got information that there was something to eat on the way the wild animals passed by."
  npc_override_pay_fild08_spirit_handler_i_heard_voice_again_i_6f1f4a: "- I heard a voice again, but I couldn't see anything. -"
  npc_override_pay_fild08_spirit_handler_i_ll_call_boss_93ab8c: "I'll call the boss..."
  npc_override_pay_fild08_spirit_handler_i_ll_get_you_some_ea9607: "I'll get you some medicines."
  npc_override_pay_fild08_spirit_handler_i_ll_making_vacation_spo_6ee3fe: "I'll be making a vacation spot for young people around here! What do you say!"
  npc_override_pay_fild08_spirit_handler_i_looked_around_sudden_v_3ce188: "- I looked around at the sudden voice, but I couldn't see anyone. -"
  npc_override_pay_fild08_spirit_handler_i_m_completely_blown_awa_a4b480: "I'm completely blown away today! I messed up!!!"
  npc_override_pay_fild08_spirit_handler_i_m_glad_fed_some_15faab: "I'm glad it fed some wild animals, but..."
  npc_override_pay_fild08_spirit_handler_i_m_here_see_if_3882b4: "I'm here to see if everything is going well~"
  npc_override_pay_fild08_spirit_handler_i_m_preparing_medicine_b_c41d04: "I'm preparing medicine ^123456because^000000 Lee Daegam asked me to, but isn't the construction of the forest done by Lee Daegam himself?"
  npc_override_pay_fild08_spirit_handler_i_m_sorry_327b84: "I'm sorry!"
  npc_override_pay_fild08_spirit_handler_i_m_sorry_customer_c9f0a3: "I'm sorry~ Customer."
  npc_override_pay_fild08_spirit_handler_i_m_sorry_s_confirmed_19ce68: "I'm sorry, but it's confirmed that there's no request from our woodwork."
  npc_override_pay_fild08_spirit_handler_i_m_sure_you_ll_304990: "I'm sure you'll understand because I did it for you."
  npc_override_pay_fild08_spirit_handler_i_never_forget_grace_hel_1dfdf5: "I will never forget the grace that helped us in danger even though we did not see the relationship properly and were disrespectful in the immediate event."
  npc_override_pay_fild08_spirit_handler_i_put_barn_food_all_2425bb: "I put it in the barn... The...the food is all gone!"
  npc_override_pay_fild08_spirit_handler_i_think_i_need_look_256ebf: "I think I need to look around a little more."
  npc_override_pay_fild08_spirit_handler_i_told_you_construction_4ae467: "I told you that construction would be difficult because it was an area full of monsters, but who knew that even wild animals would be such a problem?"
  npc_override_pay_fild08_spirit_handler_i_ve_been_playing_little_6284b0: "I've been playing a little trick on you to see the faces of the old white guys who bothered me."
  npc_override_pay_fild08_spirit_handler_i_wondered_if_there_big_2b437e: "I wondered if there was a big reason, but it was a boring reason."
