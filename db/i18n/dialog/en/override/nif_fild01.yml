Body:
  npc_override_nif_fild01_quest_disguiseloliruri_amazing_you_did_speed_6cc3cd: "Amazing, you did that with speed."
  npc_override_nif_fild01_quest_disguiseloliruri_any_progress_you_ve_made_b3e247: "Any progress that you've made will be erased"
  npc_override_nif_fild01_quest_disguiseloliruri_currently_situation_stab_f6b69f: "Currently the Situation is stable and i'm not in need of your help anymore to kill them."
  npc_override_nif_fild01_quest_disguiseloliruri_great_i_knew_moment_i_68640f: "Great! I knew the moment i saw you that i can count on you!"
  npc_override_nif_fild01_quest_disguiseloliruri_hmm_i_don_t_think_a129f3: "Hmm, I don't think you've hunted 50 yet."
  npc_override_nif_fild01_quest_disguiseloliruri_i_need_you_reduce_amount_0099ee: "I need you to reduce the Amount of Monsters which are currently rampaging on this Map!"
  npc_override_nif_fild01_quest_disguiseloliruri_if_i_don_t_know_b9bf89: "If not, i don't know what to do with the Monsters in this Place!"
  npc_override_nif_fild01_quest_disguiseloliruri_if_you_change_your_mind_3f2210: "If you change your mind, please come back."
  npc_override_nif_fild01_quest_disguiseloliruri_kill_those_disguise_let_0c9a81: "Kill 50 of those Disguise and let me know when you're done. I will reward you for your efforts."
  npc_override_nif_fild01_quest_disguiseloliruri_kill_those_loli_ruri_let_848939: "Kill 50 of those Loli Ruri and let me know when you're done. I will reward you for your efforts."
  npc_override_nif_fild01_quest_disguiseloliruri_menu_disguise_1adca4: "Disguise:Loli Ruri:Cancel"
  npc_override_nif_fild01_quest_disguiseloliruri_menu_sure_859d29: "Sure:No"
  npc_override_nif_fild01_quest_disguiseloliruri_menu_yes_141459: "Yes:No"
  npc_override_nif_fild01_quest_disguiseloliruri_menu_yes_755efb: "Yes:No:I want to quit"
  npc_override_nif_fild01_quest_disguiseloliruri_oh_boy_oh_boy_5c1386: "Oh boy, Oh boy!"
  npc_override_nif_fild01_quest_disguiseloliruri_oh_great_d1d990: "Oh great!"
  npc_override_nif_fild01_quest_disguiseloliruri_ok_then_well_come_back_0e1574: "Ok then, well come back here if you change your mind."
  npc_override_nif_fild01_quest_disguiseloliruri_please_kill_disguise_ord_8a4f34: "Please kill 50 Disguise in order to make this a Place were people can go to and gather Experience."
  npc_override_nif_fild01_quest_disguiseloliruri_please_kill_loli_ruri_or_6f8169: "Please kill 50 Loli Ruri in order to make this a Place were people can go to and gather Experience."
  npc_override_nif_fild01_quest_disguiseloliruri_remember_i_need_help_hun_02c329: "Remember, I need help hunting Disguise so go and hunt 50 of them."
  npc_override_nif_fild01_quest_disguiseloliruri_remember_i_need_help_hun_cdf05b: "Remember, I need help hunting Loli Ruri so go and hunt 50 of them."
  npc_override_nif_fild01_quest_disguiseloliruri_so_which_those_monsters_06a1c0: "So, which of those Monsters would you like to hunt for me?"
  npc_override_nif_fild01_quest_disguiseloliruri_sorry_i_t_talk_right_0c7fbb: "Sorry I can't talk right now I am in a world of pain here, these darn Disguise and Loli Ruri are going to kill me."
  npc_override_nif_fild01_quest_disguiseloliruri_thank_you_your_great_hel_7b860b: "Thank you for your great help with the Loli Ruri!"
  npc_override_nif_fild01_quest_disguiseloliruri_thank_you_your_great_hel_d113ce: "Thank you for your great help with the Disguise!"
  npc_override_nif_fild01_quest_disguiseloliruri_there_many_disguise_loli_91a5ac: "There are to many Disguise and Loli Ruri around, which makes it impossible for the lower level players to gain good experience here."
  npc_override_nif_fild01_quest_disguiseloliruri_you_finished_hunting_dis_94d435: "Have you finished hunting the 50 Disguise?"
  npc_override_nif_fild01_quest_disguiseloliruri_you_finished_hunting_lol_4eeed9: "Have you finished hunting the 50 Loli Ruri?"
  npc_override_nif_fild01_quest_disguiseloliruri_you_here_help_me_right_7f9109: "You are here to help me right?"
  npc_override_nif_fild01_quest_disguiseloliruri_you_sure_you_want_stop_507e20: "Are you sure that you want to stop hunting?"
