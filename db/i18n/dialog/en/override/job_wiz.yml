Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job_wiz_wizard_about_monster_questions_a47835: "And about the monster questions."
  npc_override_job_wiz_wizard_after_test_over_cd2775: "After that, the test is over."
  npc_override_job_wiz_wizard_after_these_three_rooms_7dc67f: "After these three rooms are clear, the testing is over."
  npc_override_job_wiz_wizard_ah_i_know_what_you_e953e7: "Ah...I know what you're about to say. You want to change jobs to a Wizard, right?"
  npc_override_job_wiz_wizard_all_testing_status_broad_54607a: "All testing status will be broadcasted, and will begin as soon as the previous tester has gone through."
  npc_override_job_wiz_wizard_also_if_you_like_know_07b8b5: "Also, if you would like to know anything about the job change process, I can explain."
  npc_override_job_wiz_wizard_also_only_mages_who_reac_71bdd3: "Also only mages who have reached a job level of 40 or higher are qualified for these quests."
  npc_override_job_wiz_wizard_among_one_these_tests_we_efd1d8: "Among one of these tests, we exempt those who are at job level 50."
  npc_override_job_wiz_wizard_anyways_always_try_your_f30ded: "But anyways, always try your best."
  npc_override_job_wiz_wizard_anyways_as_questions_abo_c8e52f: "Anyways, as for the questions about magic..."
  npc_override_job_wiz_wizard_anyways_i_like_welcome_y_51cbfc: "Anyways, I would like to welcome you. I will assist you in becoming a Wizard."
  npc_override_job_wiz_wizard_anyways_try_your_best_f541bc: "Anyways, try your best."
  npc_override_job_wiz_wizard_as_i_thought_i_knew_e710c1: "As I thought, I knew you'd be able to do it, I could smell it in yah! *Woof*"
  npc_override_job_wiz_wizard_as_you_wish_let_s_a809a9: "As you wish, let's begin the final test!"
  npc_override_job_wiz_wizard_bark_bark_bark_don_t_072342: "*Bark* *bark* *bark* Don't state the obvious! Alright, I know I'm a dog!"
  npc_override_job_wiz_wizard_bark_bark_bark_i_m_195ae3: "...*BARK* *BARK* *BARK*... I'm upset, but whatever!! You seem busy so I'll just drop it."
  npc_override_job_wiz_wizard_bark_get_lost_b7c1f0: "*Bark* Get lost!"
  npc_override_job_wiz_wizard_bark_s_common_you_see_e732a3: "*Bark* It's not common that you see a Dog talking I suppose. bark~"
  npc_override_job_wiz_wizard_bark_well_reason_i_becam_3eb258: "*Bark* Well, the reason I became a dog is...I was helping my boyfriend in experimenting to prepare for his Final for his Magic Degree. Well, *Grrrr* he accidentally turned me into a dog."
  npc_override_job_wiz_wizard_bark_what_why_you_lookin_c1141d: "...*bark*...? What is it?? Why are you looking at me like that?!"
  npc_override_job_wiz_wizard_bark_you_gave_up_5f4fff: "*BARK*...you gave up?"
  npc_override_job_wiz_wizard_basics_being_wizard_67e4e5: "This is the basics of being a Wizard."
  npc_override_job_wiz_wizard_because_you_mage_f5eb9b: "Because you are a Mage."
  npc_override_job_wiz_wizard_best_even_dream_about_li_1c6a1b: "Best not to even dream about life as a Wizard. Graa...Greaa...*sneeze* Greater Magic wasn't meant for humans to use!"
  npc_override_job_wiz_wizard_blue_gemstone_each_6884ee: "^3355FFBlue Gemstone^000000 10 each,"
  npc_override_job_wiz_wizard_careful_greater_magic_al_68fad5: "And be careful! Greater Magic will always be after you..."
  npc_override_job_wiz_wizard_careful_we_lost_many_mag_b7daf7: "Be careful. We have lost many Mages due to the difficulty of the exams."
  npc_override_job_wiz_wizard_choose_monster_different_234ee0: "1. Choose the monster with a different attribute than the others."
  npc_override_job_wiz_wizard_choose_monster_looting_o_200826: "2. Choose the monster that is not a looting one."
  npc_override_job_wiz_wizard_choose_monster_move_b264a2: "5. Choose the monster that can move."
  npc_override_job_wiz_wizard_choose_monster_s_differe_218b17: "9. Choose the monster that's of a different species."
  npc_override_job_wiz_wizard_choose_monster_weak_agai_c82652: "7. Choose the monster that is weak against a fire attribute attack."
  npc_override_job_wiz_wizard_choose_one_relate_mage_d23688: "3. Choose the one that does not relate to a Mage."
  npc_override_job_wiz_wizard_choose_spell_efficient_a_ca66a7: "4. Choose the spell that would be efficient against a Marine Sphere."
  npc_override_job_wiz_wizard_comming_you_thats_some_d_a61535: "Comming from you, thats some darn good thinking. That's more a fit for you anyways. Hahahahahahahahaha~"
  npc_override_job_wiz_wizard_complete_yourself_thats_23be6a: "Complete it yourself. Thats the best way."
  npc_override_job_wiz_wizard_complete_yourself_thats_2cf0b1: "Complete it yourself, thats the best way."
  npc_override_job_wiz_wizard_condors_picky_s_sometime_3e9c8e: "Condors, Picky's, and sometimes monsters like Golem's drop them."
  npc_override_job_wiz_wizard_congratulations_always_g_fbc32d: "Congratulations. Always give your best at everything, no matter what."
  npc_override_job_wiz_wizard_congratulations_congrats_35d9c2: "Congratulations, congrats, congrats! Wooopiiieeeee! ~Hehehehehehe"
  npc_override_job_wiz_wizard_congratulations_good_luc_f47ec4: "Congratulations and good luck with your life!"
  npc_override_job_wiz_wizard_congratulations_you_pass_7e4d8e: "Congratulations, {0}. You have passed the job change test."
  npc_override_job_wiz_wizard_cornutus_kukre_marina_va_7186e0: "Cornutus, Kukre, Marina, Vadon...these monsters drop them frequently."
  npc_override_job_wiz_wizard_cornutus_vadon_monsters_e49a27: "Cornutus, Vadon, and monsters like Mars can drop those Gems."
  npc_override_job_wiz_wizard_cough_cough_as_you_wish_1d4004: "*Cough* *cough* As you wish, we shall begin the final test!"
  npc_override_job_wiz_wizard_cough_cough_did_you_real_367e8a: "*cough* *cough* Did you really think you could become a Wizard with such a mediocre level like yours?"
  npc_override_job_wiz_wizard_cough_cough_let_s_see_2fc889: "*Cough* *cough* Let's see how well you live as a Wizard. ~Hahahahhaha"
  npc_override_job_wiz_wizard_cough_cough_no_point_cry_ad9a08: "*Cough* *cough* No point in crying after dying..."
  npc_override_job_wiz_wizard_cough_cough_sneeze_i_don_2ade86: "*cough* *cough* *sneeze* I don't know who you are and what you do, but I don't have any business with you."
  npc_override_job_wiz_wizard_cough_cough_then_here_go_4fd7f3: "*Cough* *cough* Then here go the questions!"
  npc_override_job_wiz_wizard_cough_cough_then_i_shall_85e8bb: "*Cough* *cough* Then I shall explain."
  npc_override_job_wiz_wizard_cough_cough_well_done_yo_cd6309: "*cough* *Cough* Well done, you passed the second test."
  npc_override_job_wiz_wizard_cough_cough_what_you_wan_811663: "*Cough* *cough* what do you want?"
  npc_override_job_wiz_wizard_cough_cough_you_give_up_cb8d0d: "*Cough* *cough* You can give up and go back to town! Just forget about the Greater Magic and live a normal life. What do yah say?"
  npc_override_job_wiz_wizard_cough_cough_you_must_ve_997e18: "*Cough* *cough*...You must've passed the first test."
  npc_override_job_wiz_wizard_cough_cough_you_want_tak_ab764c: "*Cough* Cough* Do you want to take the test again? Or did you bring the ^3355FFWorn Out Scroll^000000?"
  npc_override_job_wiz_wizard_cough_if_you_t_pass_47cd7f: "*Cough* If you can't pass the battle test, then do a good job with this one. Hahahahahahah~"
  npc_override_job_wiz_wizard_course_you_get_blue_gems_db54fd: "Of course you can get blue Gemstones at the magic shop here in town..."
  npc_override_job_wiz_wizard_crystal_blue_each_f8607d: "^3355FFCrystal Blue^000000 5 each,"
  npc_override_job_wiz_wizard_crystsal_blue_each_0ba39d: "^3355FFCrystsal Blue^000000 5 each,"
  npc_override_job_wiz_wizard_dang_i_hope_you_fail_03068b: "Dang it! I hope you FAIL!! Go get lost!!"
  npc_override_job_wiz_wizard_did_you_get_all_items_2f69ca: "Did you get all the items?"
  npc_override_job_wiz_wizard_dog_talking_so_amusing_y_977898: "Is a Dog talking so amusing to you?"
  npc_override_job_wiz_wizard_don_t_come_any_closer_6a965c: "Don't come any closer, just leave!"
  npc_override_job_wiz_wizard_don_t_forget_them_time_9fc7df: "Don't forget them this time and gather the correct ones, ok? See you soon..."
  npc_override_job_wiz_wizard_don_t_forget_time_bring_c37faf: "Don't forget this time, and bring all the items, ok?..."
  npc_override_job_wiz_wizard_don_t_forget_wizards_gro_4dd47c: "Don't forget that Wizards grow and improve in power each and every day."
  npc_override_job_wiz_wizard_don_t_get_too_laid_b1e302: "Don't get too laid back though, there are still 2 more tests left."
  npc_override_job_wiz_wizard_don_t_go_about_casting_69631d: "Don't go about casting spells in town for no reason, or bother others with spells that are in their own battle."
  npc_override_job_wiz_wizard_don_t_live_dishonestly_i_0810fe: "Don't live dishonestly, or impolitely, or else one day you'll be caught in a spell you can't control, and BOOM, your dead!"
  npc_override_job_wiz_wizard_don_t_pretend_weak_just_e70e27: "Don't pretend to be weak just because you're a girl. Look at me! I did it, and so can you. You can't ask for sympathy."
  npc_override_job_wiz_wizard_don_t_too_relieved_just_01869b: "Don't be too relieved just after the first test."
  npc_override_job_wiz_wizard_don_t_weak_mind_woof_b7e544: "Don't have a weak mind, *woof* and go back! *Bark* *Bark* Right this moment! *BARK*"
  npc_override_job_wiz_wizard_each_person_may_take_app_48326b: "Each person may take approximately 5 to 10 minutes."
  npc_override_job_wiz_wizard_each_room_there_monsters_5f1930: "In each room, there are monsters of certain attributes."
  npc_override_job_wiz_wizard_earth_room_job_change_te_5694cb: "Earth Room; The job change test will now proceed."
  npc_override_job_wiz_wizard_eh_did_you_leave_middle_47449b: "Eh, did you leave in the middle of the test?"
  npc_override_job_wiz_wizard_eh_soso_a67245: "Eh, soso..."
  npc_override_job_wiz_wizard_eh_what_s_i_don_1628e2: "Eh, what's this? I don't think you have everything?"
  npc_override_job_wiz_wizard_elder_willows_metallers_d96842: "Elder Willows, Metallers or Scorpions found in the desert would work well too."
  npc_override_job_wiz_wizard_eliminate_all_monster_wi_466479: "Eliminate all monster within the time limit."
  npc_override_job_wiz_wizard_end_test_next_candidate_ad9ff9: "This is the end of the test. Next candidate, please stand by."
  npc_override_job_wiz_wizard_end_time_293c9f: "End time."
  npc_override_job_wiz_wizard_enough_prove_us_effort_t_95947c: "It is enough to prove to us the effort it will take to become a Wizard if a mage has learned that much already."
  npc_override_job_wiz_wizard_even_though_your_grade_w_f97dd8: "Even though your not Grade A Wizard material, I can tell your serious about wanting the Greater Magic. I'll tell Catherine that you passed. Hahahahahahahahah~"
  npc_override_job_wiz_wizard_excuse_me_i_am_wondering_ad9d06: "? Excuse me, I am wondering if we have met before...?"
  npc_override_job_wiz_wizard_fighting_them_yourself_l_87ca63: "Fighting them yourself and learning is the best way to go about that."
  npc_override_job_wiz_wizard_final_test_total_parts_4745ea: "The final test has a total of 3 parts."
  npc_override_job_wiz_wizard_finding_them_yourself_mu_222065: "But, finding them yourself would be much more rewarding and helpful later in the test."
  npc_override_job_wiz_wizard_fire_room_job_change_tes_3864be: "Fire Room; The job change test shall now proceed."
  npc_override_job_wiz_wizard_first_get_red_gemstones_155ffc: "First, to get Red Gemstones, go to Culverts in Prontera."
  npc_override_job_wiz_wizard_first_test_collecting_ma_91222c: "The first test is collecting magic items."
  npc_override_job_wiz_wizard_geez_what_lame_person_930665: "Geez, what a lame person."
  npc_override_job_wiz_wizard_geez_you_already_failed_2acf31: "Geez...you already failed the battle test! Hahahahahahahaha~ So you like magic that much, eh?"
  npc_override_job_wiz_wizard_get_lost_hahahahaha_1ec72c: "Get lost! ~Hahahahaha"
  npc_override_job_wiz_wizard_get_lost_if_you_wizard_86bff0: "Get lost! If you were a Wizard right now, the monsters I deal with would eat you up in no time!"
  npc_override_job_wiz_wizard_get_lost_if_you_wizard_994580: "Get lost! If you were a Wizard right now, the monsters that I fight, would eat you up in no time!"
  npc_override_job_wiz_wizard_gloomy_laurel_corner_cha_b02ca4: "The gloomy Laurel in the corner is in charge of that part."
  npc_override_job_wiz_wizard_go_away_get_lost_3839f2: "Go away! Get lost!"
  npc_override_job_wiz_wizard_go_away_one_who_works_009ee2: "Go away, one who works for the Church!"
  npc_override_job_wiz_wizard_go_back_live_easy_life_f67a02: "Go back and live a easy life, Greater Magic is a force that should not be wield by types like yourself."
  npc_override_job_wiz_wizard_go_back_live_quiet_peace_f756f2: "Go back and live a quiet and peaceful life!"
  npc_override_job_wiz_wizard_go_finish_rest_tests_spi_f79c3c: "Go finish the rest of the tests with that spirit!"
  npc_override_job_wiz_wizard_go_go_become_wizard_you_b843fb: "Go! Go and become the Wizard you really want to be."
  npc_override_job_wiz_wizard_go_join_parties_others_k_417745: "Go join parties with others and keep training."
  npc_override_job_wiz_wizard_go_talk_catherine_she_ll_067f33: "Go talk to Catherine. She'll help you."
  npc_override_job_wiz_wizard_go_talk_guy_corner_rest_9c1451: "Go talk to the guy in the corner for the rest of the tests."
  npc_override_job_wiz_wizard_go_talk_guy_corner_take_a3d8bc: "Go talk to that guy in the corner to take the rest of the tests."
  npc_override_job_wiz_wizard_go_talk_man_corner_he_d346c1: "Go talk to the man in the corner and he will give you the remaining exams."
  npc_override_job_wiz_wizard_go_visit_mage_guild_aa12ed: "Go visit the ^0000FFMage^000000 guild."
  npc_override_job_wiz_wizard_going_there_studying_bit_6c7ad8: "Going there and studying a bit more would work too."
  npc_override_job_wiz_wizard_good_job_you_finished_an_d756ab: "Good job, you finished answered all the questions... Go buy yourself some potions or something if you have the Zeny. Haha..."
  npc_override_job_wiz_wizard_good_thinking_better_cho_f6929a: "Good thinking. This is a better choice for you. Hahahahah~"
  npc_override_job_wiz_wizard_good_you_ve_passed_first_a52ed3: "Good. You've passed the first test now."
  npc_override_job_wiz_wizard_good_you_you_passed_firs_b35061: "Good for you! You passed the first test."
  npc_override_job_wiz_wizard_granted_you_re_mage_how_cdefc7: "Granted you're a mage, but how could a guy be so weak?!"
  npc_override_job_wiz_wizard_green_live_each_a47db0: "^3355FFGreen Live^000000 5 each,"
  npc_override_job_wiz_wizard_grrr_anyways_continue_te_ea798c: "*Grrr* Anyways, continue the test."
  npc_override_job_wiz_wizard_guard_monster_appeared_y_d2c387: "The guard monster has appeared. You have 1 minute."
  npc_override_job_wiz_wizard_guard_monster_appeared_y_ef88d9: "The guard monster has appeared. You have 2 minutes."
  npc_override_job_wiz_wizard_gulp_gulp_gulp_haaaaaah_64de60: "Gulp gulp gulp... Haaaaaah... ~Hehe"
  npc_override_job_wiz_wizard_hahaha_ok_least_you_some_850958: "Hahaha~ Ok, at least you have some spirit."
  npc_override_job_wiz_wizard_hahaha_since_you_only_mi_d64a79: "Hahaha~ Since you only missed one problem, you passed the second test."
  npc_override_job_wiz_wizard_hahaha_sneeze_good_choic_1e8e4b: "Hahaha~ *sneeze* Good choice...*cough* *cough*~"
  npc_override_job_wiz_wizard_hahaha_you_look_frighten_52bf63: "Hahaha~ You look frightened. You know, it's not too late to turn back and live an easy life."
  npc_override_job_wiz_wizard_hahahaha_don_t_relax_jus_fb9312: "Hahahaha~ Don't relax just yet, there's still the third test."
  npc_override_job_wiz_wizard_hahahaha_i_ll_let_you_d44006: "Hahahaha~ I'll let you slide by since you only missed one problem. You passed the second test."
  npc_override_job_wiz_wizard_hahahaha_surprising_comm_5effc4: "Hahahaha~ Surprising, comming from you, that's a very wise choice...*cough* *cough*"
  npc_override_job_wiz_wizard_hahahaha_you_desperate_s_ed2365: "Hahahaha~ Are you that desperate? *sneeze* What a pain in the arse..."
  npc_override_job_wiz_wizard_hahahaha_you_don_t_know_869ed8: "Hahahaha~ You don't know how dangerous it is...to deal with Greater Magic."
  npc_override_job_wiz_wizard_hahahaha_you_re_one_want_5a6075: "Hahahaha~ You're the one that wants to become a Wizard?!"
  npc_override_job_wiz_wizard_hahahahaha_yeah_go_bring_ab973d: "Hahahahaha~ yeah! Go bring me a ^3355FFWorn Out Scroll^000000."
  npc_override_job_wiz_wizard_hahahahaha_you_look_frig_453894: "Hahahahaha~ You look frightened. It's not too late you know."
  npc_override_job_wiz_wizard_hahahahahaha_cough_cough_60194d: "Hahahahahaha~ *Cough* *cough* If you can answer all these questions correctly, how is it you can't do well in battles??"
  npc_override_job_wiz_wizard_hahahahahaha_i_ve_never_1711a1: "Hahahahahaha~ I've never seen anyone so...sooo...*sneeze* tenacious as you."
  npc_override_job_wiz_wizard_hahahahahahah_well_done_994dde: "Hahahahahahah~ Well done, you passed the second test."
  npc_override_job_wiz_wizard_hahahahahahaha_now_there_bb46bb: "Hahahahahahaha~ Now there's a foolish one right here!"
  npc_override_job_wiz_wizard_hahahahahahahaha_cough_c_a9799d: "Hahahahahahahaha~ *Cough* *cough* So you ended up bringing one of these eh? Good job..."
  npc_override_job_wiz_wizard_he_always_looks_so_grung_5102d6: "He always looks so grungy because he doesn't take care of himself...*sigh*...pity, he could be a regular lady killer. ~tehehehe"
  npc_override_job_wiz_wizard_he_asks_three_types_ques_6ed290: "He asks three types of questions."
  npc_override_job_wiz_wizard_he_s_waiting_10b3bc: "He's waiting!"
  npc_override_job_wiz_wizard_he_s_waiting_you_0bf42f: "He's waiting for you!"
  npc_override_job_wiz_wizard_here_you_go_i_hope_f8e3a1: "Here you go. I hope you'll make good use of it when you need it. ~tehehe"
  npc_override_job_wiz_wizard_hey_hey_weren_t_you_375292: "Hey hey, weren't you listening to me?"
  npc_override_job_wiz_wizard_hey_what_don_t_you_5102de: "Hey, what don't you get it?"
  npc_override_job_wiz_wizard_hey_what_s_umm_i_2ed968: "Hey, what's this? Umm...I don't think you have everything yet!"
  npc_override_job_wiz_wizard_hey_you_changed_lot_so_f7270d: "Hey~ you have changed a lot! So, what happened?"
  npc_override_job_wiz_wizard_hmm_come_think_you_re_e10a95: "Hmm, come to think of it, you're at job level 50!?"
  npc_override_job_wiz_wizard_hmmm_good_job_you_finish_eb3ed1: "Hmmm...Good job, you finished answering all the questions, go buy yourself some potions or something, thats IF you have the Zeny. Hahahahahahahah~"
  npc_override_job_wiz_wizard_how_much_sp_consumed_how_5cbeb1: "8. How much SP is consumed and how many times can you avoid attacks when using Safety Wall Lv 6?"
  npc_override_job_wiz_wizard_how_much_sp_needed_when_27c01e: "9. How much SP is needed when using Lv 10 Thunderstorm?"
  npc_override_job_wiz_wizard_how_you_think_trying_bec_1111cb: "How can you think of trying to become a Wizard when you can't even answer those simple questions?"
  npc_override_job_wiz_wizard_huh_what_brings_you_such_68bc2b: "Huh? what brings you to such a high place...?"
  npc_override_job_wiz_wizard_huh_what_you_doing_way_c35c66: "Huh? What are you doing way up here...?"
  npc_override_job_wiz_wizard_hurry_he_s_waiting_you_fdb9e7: "Hurry, he's waiting for you!"
  npc_override_job_wiz_wizard_i_advise_you_rest_bit_157e44: "I advise you to rest a bit while the final test is prepared. Your gonna need it. Hahahahaha~"
  npc_override_job_wiz_wizard_i_agree_difficult_point_7a410d: "I agree that it is difficult, but not to the point of giving up."
  npc_override_job_wiz_wizard_i_don_t_time_people_6c5c00: "I don't have time for people like you!"
  npc_override_job_wiz_wizard_i_feel_you_become_so_f36bdf: "I feel you have become so much powerful, eh?"
  npc_override_job_wiz_wizard_i_gave_them_you_as_9d57cc: "I gave them to you as a present, so don't go out and sell it. Use it for yourself, ok?"
  npc_override_job_wiz_wizard_i_heard_there_s_nice_40dde8: "I heard there's a nice place you can refer to that's very well organized."
  npc_override_job_wiz_wizard_i_ll_give_you_questions_9524b3: "I'll give you 10 questions so give me the right answers."
  npc_override_job_wiz_wizard_i_ll_happily_waiting_heh_df7ef7: "I'll be happily waiting. ~Hehe."
  npc_override_job_wiz_wizard_i_ll_let_you_retake_ba37df: "I'll let you retake the test."
  npc_override_job_wiz_wizard_i_ll_send_you_again_9999a1: "I'll send you in again, try dying once more will yah? Hahahahahahahahaha~"
  npc_override_job_wiz_wizard_i_ll_waiting_so_go_2b5743: "I'll be waiting, so go now."
