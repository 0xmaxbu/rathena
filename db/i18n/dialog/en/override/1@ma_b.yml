Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@ma_b_BakonawaLake_aww_i_almost_brought_him_5adfbd: "AWW... I almost brought him out."
  npc_override_1@ma_b_BakonawaLake_bakonawa_becomes_invinci_6c1423: "Bakonawa becomes invincible at some point. When that time comes, listen to my guides carefully. Just trust me and all will be good."
  npc_override_1@ma_b_BakonawaLake_civilians_cannot_enter_8eeec6: "Civilians cannot enter."
  npc_override_1@ma_b_BakonawaLake_found_bakonawa_s_corpse_16f6f3: "This was found from Bakonawa's corpse. It would be better if you take this."
  npc_override_1@ma_b_BakonawaLake_heehee_i_could_join_bako_f43419: "Heehee, I could join the Bakonawa hunt, but I'd rather hide behind that rock and cheer you guys on."
  npc_override_1@ma_b_BakonawaLake_hey_too_dangerous_place_e4467c: "Hey. This is too dangerous a place for you. You cannot keep yourself safe. Get out of here and go to the village right now!"
  npc_override_1@ma_b_BakonawaLake_hmm_we_almost_got_him_bf4dd6: "HMM. We almost got him but he is one fast creature..."
  npc_override_1@ma_b_BakonawaLake_i_am_dropping_albopal_li_4b3e0a: "I am dropping Albopal like I did a while ago. I hope it pisses him off..."
  npc_override_1@ma_b_BakonawaLake_i_am_dropping_alpopal_ma_d1a4ef: "I am dropping the Alpopal to make Bakonawa mad. Bakonawa can be a good source of protein once we get him."
  npc_override_1@ma_b_BakonawaLake_isn_t_there_any_company_7d3e20: "Isn't there any company who can go with you? Or even if you wanna go alone, come after organizing a party."
  npc_override_1@ma_b_BakonawaLake_menu_hold_add534: "Hold on a sec!:Of course! We cannot stand back now!"
  npc_override_1@ma_b_BakonawaLake_menu_hold_f99cf9: "Hold on! I'm not ready yet!:Let's do it!"
  npc_override_1@ma_b_BakonawaLake_menu_options_60f35e: ":Now I will go down.:Cancel."
  npc_override_1@ma_b_BakonawaLake_menu_please_8716e0: "Please weave a rope.:Now I will go down.:Cancel."
  npc_override_1@ma_b_BakonawaLake_my_name_minky_5b9efd: "My name is Minky."
  npc_override_1@ma_b_BakonawaLake_now_i_m_weaving_so_61bd8d: "Now I'm weaving, so you can go down when I'm done."
  npc_override_1@ma_b_BakonawaLake_now_i_make_bakonawa_spri_2bfe2b: "Now I will make Bakonawa spring out from the lake."
  npc_override_1@ma_b_BakonawaLake_oh_alright_tell_me_when_dc7172: "Oh... alright... tell me when you are ready."
  npc_override_1@ma_b_BakonawaLake_oh_rope_got_dropped_i_e233e8: "Oh, the rope got dropped. I have to make a new one."
  npc_override_1@ma_b_BakonawaLake_once_bakonawa_tastes_he_f63ca8: "Once Bakonawa tastes this, he will surface..."
  npc_override_1@ma_b_BakonawaLake_rope_hasn_t_been_weaved_0348e5: "The rope hasn't been weaved yet. Wait a little."
  npc_override_1@ma_b_BakonawaLake_rope_used_getting_lake_a_72ee3b: "The rope used for getting to the Lake is already broken. We are now cleaning up the surroundings so come back after some time."
  npc_override_1@ma_b_BakonawaLake_s_all_cleaned_up_around_88b634: "It's all cleaned up around here. Now you can go down again after getting a rope."
  npc_override_1@ma_b_BakonawaLake_seems_you_already_carryi_76f3e4: "It seems you are already carrying items of too much weight. Please try again after reducing the weight."
  npc_override_1@ma_b_BakonawaLake_seems_you_carrying_too_m_105803: "It seems you are carrying too many different kinds of items. Please try again after reducing it."
  npc_override_1@ma_b_BakonawaLake_then_i_drop_drop_albopal_5b8137: "Then I will drop a drop of Albopal to this lake."
  npc_override_1@ma_b_BakonawaLake_then_i_use_albopal_once_107f9c: "Then I will use Albopal once again to the lake."
  npc_override_1@ma_b_BakonawaLake_then_let_s_use_rope_a0ffec: "Then let's use to the rope to go up!"
  npc_override_1@ma_b_BakonawaLake_unknown_error_occurred_285cc7: "An unknown error occurred."
  npc_override_1@ma_b_BakonawaLake_we_about_see_bakonawa_in_173ac8: "We are about to see Bakonawa with intenser anger..."
  npc_override_1@ma_b_BakonawaLake_we_better_hurry_get_out_659eb7: "We better hurry and get out of this place. This place is still dangerous even without Bakonawa..."
  npc_override_1@ma_b_BakonawaLake_we_going_try_again_116ff0: "Are we going to try again?"
  npc_override_1@ma_b_BakonawaLake_we_gonna_killed_all_bako_4eb500: "We are gonna be killed all by that Bakonawa. Ah, we must slay him but unfortunately we are not prepared."
  npc_override_1@ma_b_BakonawaLake_you_came_slaying_bakonaw_88df8d: "You came for slaying Bakonawa. The leader of your party has to help me weaving the rope for going down."
  npc_override_1@ma_b_BakonawaLake_you_carrying_too_many_it_dd17f4: "You are carrying too many items. Come back after taking off some of them."
  npc_override_1@ma_b_BakonawaLake_you_carrying_too_much_we_04640e: "You are carrying too much weight. Come back after reducing the weight."
  npc_override_1@ma_b_BakonawaLake_you_leader_bakonawa_slay_7be0b7: "Are you the leader of the Bakonawa slayers? The road is not well so we have to go down the cliff with a rope, is that OK?"
