Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_prt_fild03_acolyte_acolyte_applicant_5fdc86: "Acolyte applicant."
  npc_override_prt_fild03_acolyte_acolyte_applicants_7023f8: "Acolyte applicants...?"
  npc_override_prt_fild03_acolyte_acolyte_applicants_d39fe0: "of the Acolyte applicants."
  npc_override_prt_fild03_acolyte_ah_5eceea: "Ah...!"
  npc_override_prt_fild03_acolyte_ah_i_sense_you_endured_dcc648: "Ah, I sense you have endured"
  npc_override_prt_fild03_acolyte_ah_you_must_one_acolyte_a1f037: "Ah, you must be one of the Acolyte applicants. I sincerely welcome you."
  npc_override_prt_fild03_acolyte_always_remember_thankful_c30872: "Always remember to be thankful to God, who takes care of us all the time. In chaos and times of difficulty, face your hardships with unwavering faith."
  npc_override_prt_fild03_acolyte_back_valhalla_5a886d: "back from Valhalla and"
  npc_override_prt_fild03_acolyte_bad_all_you_ve_made_376c0a: "Not bad at all, you've made it all the way here from Prontera. So what's your name, kid?"
  npc_override_prt_fild03_acolyte_bad_bad_you_withstood_pe_1a46aa: "Not bad, not bad. You withstood the penance trial pretty well."
  npc_override_prt_fild03_acolyte_farewell_5260b4: "Farewell."
  npc_override_prt_fild03_acolyte_first_you_reach_least_no_4390c4: "First, you have to reach at least Novice Job Level 9 and learn all of the Basic Skills."
  npc_override_prt_fild03_acolyte_good_now_i_give_you_a21cbc: "Good. Now I will give you the qualification to become an Acolyte."
  npc_override_prt_fild03_acolyte_greetings_21e190: "Greetings."
  npc_override_prt_fild03_acolyte_hello_there_5a8ec9: "Hello there~"
  npc_override_prt_fild03_acolyte_hey_44afd2: "Hey..."
  npc_override_prt_fild03_acolyte_hey_5a8841: "Hey."
  npc_override_prt_fild03_acolyte_hmm_9c4d28: "Hmm..."
  npc_override_prt_fild03_acolyte_hmm_your_job_level_enoug_18d773: "Hmm... your job level is enough..."
  npc_override_prt_fild03_acolyte_how_your_practice_coming_a54150: "How is your practice coming along? I certainly hope you're enjoying living in the grace of God."
  npc_override_prt_fild03_acolyte_however_i_tell_you_suite_f8c80d: "However, I can tell that you are not suited to be an Acolyte. Please remember who you were in your past life and find your path."
  npc_override_prt_fild03_acolyte_huh_bfd2a5: "{0}, huh?"
  npc_override_prt_fild03_acolyte_huh_what_brings_you_here_1e2490: "Huh? What brings you here? This is a very dangerous place for a Novice like yourself!"
  npc_override_prt_fild03_acolyte_huh_why_isn_t_your_32585f: "{0}, huh? Why isn't your name on my list?"
  npc_override_prt_fild03_acolyte_i_believe_you_ve_been_71a6c3: "I believe you've been told much about Acolytes from Friar Mareusis. Plus, there's plenty of helpful people in the Prontera Sanctuary."
  npc_override_prt_fild03_acolyte_i_don_t_any_replies_826678: "I don't any replies."
  npc_override_prt_fild03_acolyte_i_don_t_think_your_f4d2dc: "I don't think your name"
  npc_override_prt_fild03_acolyte_i_guess_there_s_really_30732e: "I guess there's really no need for me to teach you much. Besides, I'm sure your someone from your generation may have trouble listening to an old man like me. Hahaha~"
  npc_override_prt_fild03_acolyte_i_m_sorry_seems_you_512c63: "I'm sorry but it seems you already have your own job, aren't you?"
  npc_override_prt_fild03_acolyte_i_pray_god_hope_you_946dd4: "I will pray to God, and hope that you become an Acolyte soon."
  npc_override_prt_fild03_acolyte_i_send_carrier_pigeon_pr_62eb99: "I will send a carrier pigeon to the Prontera Sanctuary. When you return, the Priest there should already have received my message."
  npc_override_prt_fild03_acolyte_i_send_message_sanctuary_dc39f9: "I will send a message to the Sanctuary confirming that you, {0} visited me and completed your penance."
  npc_override_prt_fild03_acolyte_i_sense_you_endured_past_efc20d: "I sense that you have endured a past life experience. You must have learned many things before entering Valhalla."
  npc_override_prt_fild03_acolyte_i_sincerely_welcome_you_d258c5: "I sincerely welcome you."
  npc_override_prt_fild03_acolyte_i_ve_sent_carrier_pigeon_9c17fc: "I've sent a carrier pigeon with a message. I hope it will arrive there safely..."
  npc_override_prt_fild03_acolyte_i_wait_until_25cb35: "I will wait until"
  npc_override_prt_fild03_acolyte_if_you_like_come_sit_9d2a18: "If you like, come sit here with me and meditate the great truths. God's majesty is truly inspiring..."
  npc_override_prt_fild03_acolyte_lastly_i_want_sincerely_24cb3c: "Lastly, I want to sincerely congratulate you on persevering through your trial of penance."
  npc_override_prt_fild03_acolyte_let_s_see_4d37ed: "Let's see..."
  npc_override_prt_fild03_acolyte_let_s_see_7d5528: "{0}? Let's see..."
  npc_override_prt_fild03_acolyte_let_s_see_whether_you_51fe4d: "Let's see whether you are ready for it or not... Hmm..."
  npc_override_prt_fild03_acolyte_may_god_5c1e1c: "May God"
  npc_override_prt_fild03_acolyte_may_god_afb834: "May God be"
  npc_override_prt_fild03_acolyte_meantime_64149e: "In the meantime,"
  npc_override_prt_fild03_acolyte_menu_change_6ae975: "Change your job to acolyte.:Ask the requirements to be an acolyte.:Quit it."
  npc_override_prt_fild03_acolyte_most_basic_thing_so_you_aec17b: "This is the most basic thing to do, so you need to regard it as the way of training yourself."
  npc_override_prt_fild03_acolyte_msg_6eae3a: "..."
  npc_override_prt_fild03_acolyte_my_list_b99fa2: "is not on my list..."
  npc_override_prt_fild03_acolyte_my_list_hmmm_b001ab: "is on my list. Hmmm..."
  npc_override_prt_fild03_acolyte_new_life_s_journey_a55106: "new life's journey."
  npc_override_prt_fild03_acolyte_novice_de4787: "Novice."
  npc_override_prt_fild03_acolyte_now_go_back_santuary_fin_342f67: "Now go back to the Santuary and finish becoming an Acolyte, kid."
  npc_override_prt_fild03_acolyte_now_venture_forth_seek_p_ee6af2: "Now, venture forth to seek people who need your help. May God enlighten your way."
  npc_override_prt_fild03_acolyte_now_venture_forth_seek_t_45a370: "Now, venture forth and seek those who need your help. May God light your path."
  npc_override_prt_fild03_acolyte_now_what_your_name_e3e276: "Now, what is your name?"
  npc_override_prt_fild03_acolyte_now_your_name_right_exce_96feca: "Now, your name was {0}, right? Excellent, thank you for visiting me."
  npc_override_prt_fild03_acolyte_oh_78a2fc: "Oh..."
  npc_override_prt_fild03_acolyte_oh_ho_2a847d: "Oh ho..."
  npc_override_prt_fild03_acolyte_oh_my_you_haven_t_51c87c: "Oh my?! You haven't accomplished the basic practice yet?! You have a long way to go! Come again after increasing your job level!"
  npc_override_prt_fild03_acolyte_oh_you_must_one_who_219b67: "Oh...? You must be the one who aspires to become an Acolyte. I've already received news from the Sanctuary that you might be coming."
  npc_override_prt_fild03_acolyte_okay_i_ll_send_message_fbf3aa: "Okay. I'll send a message to the Sanctuary that you, {0}, came to visit me."
  npc_override_prt_fild03_acolyte_past_life_experience_you_21f232: "a past life experience. You must have learned many things before entering Valhalla."
  npc_override_prt_fild03_acolyte_perhaps_you_should_retur_e187e8: "Perhaps you should return to the Prontera Sanctuary and check the destination for your penance trial once again."
  npc_override_prt_fild03_acolyte_please_return_prontera_s_9721d6: "Please return to the Prontera Sanctuary and speak to the Priest in charge."
  npc_override_prt_fild03_acolyte_please_take_care_they_sh_fce1e0: "Please take care. They should know that you've met me by the time you arrive at the Prontera Sanctuary."
  npc_override_prt_fild03_acolyte_right_d016e9: "Right?"
  npc_override_prt_fild03_acolyte_seems_your_name_1f25d2: "It seems your name"
  npc_override_prt_fild03_acolyte_so_what_s_your_name_02fb09: "So what's your name?"
  npc_override_prt_fild03_acolyte_still_lessons_may_come_p_ddaa43: "Still, lessons may come from the places you'd least expect. God loves to teach his children in strange ways. You'll see."
  npc_override_prt_fild03_acolyte_then_you_must_fulfill_fo_b0ac7d: "Then, you must fulfill the following requirements thinking those are the practices given by God."
  npc_override_prt_fild03_acolyte_there_something_89eb1e: "There something"
  npc_override_prt_fild03_acolyte_unfortunately_i_don_t_th_839768: "Unfortunately, I don't think you're ready to become an Acolyte yet. Please finish learning all of the Basic Skills first."
  npc_override_prt_fild03_acolyte_welcome_deep_feel_free_s_b82422: "Welcome to the Deep. Feel free to sit and contemplate God's message with me. This place is beautiful, even if danger accompanies its sense of serenity..."
  npc_override_prt_fild03_acolyte_well_i_ll_send_message_2cbdb8: "Well, I'll send the message telling them that you've come to visit me. So, you may now return to the Prontera Sanctuary."
  npc_override_prt_fild03_acolyte_well_i_welcome_you_f14a78: "Well, I welcome you"
  npc_override_prt_fild03_acolyte_what_be65b9: "What?"
  npc_override_prt_fild03_acolyte_what_you_seek_ffeba9: "What is it that you seek?"
  npc_override_prt_fild03_acolyte_what_your_name_let_s_9974c2: "What is your name? {0}? Let's see... Ah, you're on my list."
  npc_override_prt_fild03_acolyte_whatever_you_9dd7d9: "Whatever you are,"
  npc_override_prt_fild03_acolyte_when_you_think_you_fulfi_e43f12: "When you think you fulfilled this requirement, then come back to me again. Then you will have a holy job in which you can spread God's will."
  npc_override_prt_fild03_acolyte_whoever_you_please_take_5d5cfb: "Whoever you are, please take care of yourself. The monsters in here are shockingly strong, contrary to their cute appearance."
  npc_override_prt_fild03_acolyte_why_don_t_you_go_ef5a42: "Why don't you go back to the Prontera Sanctuary and check again?"
  npc_override_prt_fild03_acolyte_wish_you_luck_your_79cf57: "wish you luck on your"
  npc_override_prt_fild03_acolyte_you_17664a: "be with you..."
  npc_override_prt_fild03_acolyte_you_73b785: "with you."
  npc_override_prt_fild03_acolyte_you_any_more_business_me_74e1f2: "Have you any more business with me?! You don't! Go back to the Sanctuary now!"
  npc_override_prt_fild03_acolyte_you_anything_say_because_800ece: "Do you have anything to say? Because unfortunately for you,"
  npc_override_prt_fild03_acolyte_you_c09be9: "You..."
  npc_override_prt_fild03_acolyte_you_come_into_deep_here_26bc3e: "Have you come into the Deep here for training? Or are you just a Wanderer?"
  npc_override_prt_fild03_acolyte_you_feeling_okay_today_i_e10ebb: "Are you feeling okay today? I can tell by your attire that you are already an Acolyte. You're not joking around, are you?"
  npc_override_prt_fild03_acolyte_you_look_like_acolyte_ap_145600: "You look like an Acolyte Applicant. Am I right?"
  npc_override_prt_fild03_acolyte_you_look_like_e00e24: "you look like an"
  npc_override_prt_fild03_acolyte_you_must_one_4b935d: "You must be one"
  npc_override_prt_fild03_acolyte_you_one_7bbfc3: "Are you one of the"
  npc_override_prt_fild03_acolyte_you_probably_made_mistak_c441dd: "You probably made a mistake. Go back to the Santuary, and check with the Bishop."
  npc_override_prt_fild03_acolyte_you_ready_c9a0a2: "you are ready."
  npc_override_prt_fild03_acolyte_you_truly_wish_become_se_8d5074: "Do you truly wish to become a servant of God?"
  npc_override_prt_fild03_acolyte_you_wanna_tell_me_ca0940: "you wanna tell me?"
  npc_override_prt_fild03_acolyte_you_wish_become_acolyte_3ea9e9: "Do you wish to become an Acolyte?"
  npc_override_prt_fild03_acolyte_your_name_ce3cd6: "Your name is {0}?"
