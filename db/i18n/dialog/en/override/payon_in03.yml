  npc_override_payon_in03_fortune_knight_values_honor_more_136f1d: " A knight values honor more than fortune. They consider discussing wealth itself dirty not worthy. How would you be able to ask such a knight a fortune about wealth? "
  npc_override_payon_in03_fortune_knight_wants_you_proud_y_e3ca27: " The knight wants you to be proud of yourself. "
  npc_override_payon_in03_fortune_knight_warning_you_botto_fa2b99: " This knight is warning you from the bottom of his heart, "
  npc_override_payon_in03_fortune_knight_warning_you_cruel_8f8c51: " The knight is warning you of cruelty. It could be yours or that of someone around you. "
  npc_override_payon_in03_fortune_knight_warning_you_lonel_bdbcbb: " This knight is warning you of loneliness. He doesn't have a person to help his horse, "
  npc_override_payon_in03_fortune_knight_warning_you_reckl_8af30e: " The knight is warning you of reckless driving. Do you ride a Pecopeco by any chance? "
  npc_override_payon_in03_fortune_knights_fight_money_they_5dbf28: " Knights do not fight for money. they did, they would be a mercenary. A knight reaches for something higher. What the knight wants to tell you is the way to live. "
  npc_override_payon_in03_fortune_know_love_know_thyself_65c33c: " Know love and know thyself! "
  npc_override_payon_in03_fortune_know_your_position_right_9d2702: " To know your position right now and where to aim in the future. "
  npc_override_payon_in03_fortune_knowing_crisis_crisis_mo_70acc3: " Not knowing that a crisis is a crisis is the most dangerous of all. "
  npc_override_payon_in03_fortune_lantern_its_back_even_it_d5afe9: " It has a lantern on its back and even in its hand.. it believes one light is insufficient. "
  npc_override_payon_in03_fortune_laziness_cause_you_lose_6d1ead: " That laziness will cause you to lose your life in an instant. "
  npc_override_payon_in03_fortune_laziness_more_dangerous_afebc2: " Laziness is more dangerous than the monster in front of you. Don't forget about this warning. "
  npc_override_payon_in03_fortune_lean_against_wall_await_90535e: " Lean against a wall and await your love! *Boom* Love will appear! "
  npc_override_payon_in03_fortune_learn_how_accept_others_ab0af4: " Learn how to accept others' opinions. How about starting from accepting the Orc Lord's? "
  npc_override_payon_in03_fortune_leave_your_future_marina_8630a7: " Leave your future to the Marina. The Marina treasures its precious ocean. The sea will be of great significance in your future, too. "
  npc_override_payon_in03_fortune_life_may_seem_like_hot_9a7c1a: " Life may seem like a hot and dry desert, but in the future, delicious juice and rest awaits you! "
  npc_override_payon_in03_fortune_lightens_attacks_pickaxe_96fe55: " That lightens and attacks with a pickaxe! You must aggressively move forward. What do you think? Your fortune is a good one. "
  npc_override_payon_in03_fortune_little_things_life_bring_6ccadd: " Little things in life will bring you happiness and joy in the future! Even more than now! "
  npc_override_payon_in03_fortune_live_future_strong_teeth_62c171: " To live the future with strong teeth?! "
  npc_override_payon_in03_fortune_loneliness_simply_sadnes_e7c983: " Loneliness is not simply sadness. It is a formless devil eating your life. Stay away from loneliness. "
  npc_override_payon_in03_fortune_look_around_you_course_l_1b27e3: " Look around you. Of course, look for anyone you might have spited.. "
  npc_override_payon_in03_fortune_look_love_different_pers_e3b9be: " Look at love from a different perspective. You never know when you'll be able to discover something. "
  npc_override_payon_in03_fortune_look_sohee_s_hairstyle_i_94c3a3: " Look at Sohee's hairstyle. Isn't it splendid. "
  npc_override_payon_in03_fortune_losing_money_isn_t_joke_13e31c: " But losing money isn't a joke now, is it? You should be careful. "
  npc_override_payon_in03_fortune_love_afraid_show_differe_687614: " But that is not love. Do not be afraid to show different sides of yourself to your loved one.. "
  npc_override_payon_in03_fortune_love_bending_yourself_so_d854b6: " Love is bending yourself for someone! Service! Sacrifice! "
  npc_override_payon_in03_fortune_love_blossom_totally_dif_5c72ca: " Love will blossom with a totally different person! Wow, so cool! "
  npc_override_payon_in03_fortune_love_blossoms_foundation_4971c8: " Love blossoms from the foundation! Be true to the basics! "
  npc_override_payon_in03_fortune_love_indeed_subject_deal_305c71: " Love is indeed a subject to be dealt with prudence. Keep that in mind young one. "
  npc_override_payon_in03_fortune_love_like_juice_forest_r_445d39: " Love is like juice in the forest! It is refreshing! Take care of your loved one! "
  npc_override_payon_in03_fortune_love_meant_so_hard_46cb11: " Love is not meant to be so hard. "
  npc_override_payon_in03_fortune_love_must_pushed_forward_2965f8: " Love must be pushed forward! "
  npc_override_payon_in03_fortune_love_requires_health_str_b7301a: " Love requires health and strength! Exercise to become stronger! Power and love! "
  npc_override_payon_in03_fortune_love_requires_preparatio_a1f0d5: " Love requires preparation as well! "
  npc_override_payon_in03_fortune_love_s_form_obscure_95d2ca: " Love's form is obscure. "
  npc_override_payon_in03_fortune_love_supposed_about_cont_768b3e: " Love is not supposed to be about controlling and restraining~ mm~ "
  npc_override_payon_in03_fortune_love_sweet_careful_get_c_bcec50: " Love is sweet! Be careful not to get cavities! "
  npc_override_payon_in03_fortune_lover_something_wrong_he_47f526: " the lover does something wrong he pokes them with a needle. How scary.. "
  npc_override_payon_in03_fortune_make_opportunity_alone_e_a6c650: " Make an opportunity to be alone with each other! It will bring much happiness! "
  npc_override_payon_in03_fortune_make_yourself_stronger_a_fa3512: " Make yourself stronger in any form. In the future, you will need it. "
  npc_override_payon_in03_fortune_making_yourself_look_pre_d26c20: " Making yourself look presentable is just as important as keeping a good heart. "
  npc_override_payon_in03_fortune_many_hardships_await_you_00f633: " Many hardships await you in the future! But you can overcome them! "
  npc_override_payon_in03_fortune_marina_doesn_t_really_th_f82ca4: " The Marina doesn't really think about anything else.. But it will say one thing. Food. The Marina loves food. "
  npc_override_payon_in03_fortune_marina_doesn_t_think_its_9a8d3c: " The Marina doesn't think of its future.. but I can tell you one thing. Freedom. The Marina swims freely. "
  npc_override_payon_in03_fortune_marina_gathers_money_qui_a92669: " The Marina gathers money quietly, little by little, and freely roaming at the same time. That's the real way to make money. The Marina is suggesting this method to you. "
  npc_override_payon_in03_fortune_marina_interested_money_a30d73: " The Marina is not interested in money. The card suggests that you will resemble these traits as well. You will enjoy life apart from money. "
  npc_override_payon_in03_fortune_marina_prefers_clean_fun_801198: " Marina prefers clean funds. It hates suspicious money. Your possessions should be clean as well. "
  npc_override_payon_in03_fortune_marina_think_its_future_19667f: " The Marina does not think of its future.. But I can tell you one thing. Survival. The Marina only thinks about survival and life. "
  npc_override_payon_in03_fortune_marina_warning_about_big_f496f8: " The Marina is warning about a big belly. It's not happy because it resembles itself.. How about losing some weight? "
  npc_override_payon_in03_fortune_marina_warning_about_laz_69001a: " The Marina is warning about a lazy lifestyle. It says such a lifestyle will lead to something like itself. "
  npc_override_payon_in03_fortune_marina_warning_hot_sting_e64a57: " The Marina is warning of a hot stinging poison. Be cautious of poison. "
  npc_override_payon_in03_fortune_marionette_believes_pres_8f4e88: " The Marionette believes the present is more important than the future. Basically, asking about the future is pointless. "
  npc_override_payon_in03_fortune_marionette_devotes_every_8132d5: " The Marionette devotes everything into the present. It suggests that type of attitude to you, too. "
  npc_override_payon_in03_fortune_marionette_emphasizing_p_ed8667: " The Marionette is emphasizing a proper diet. Don't rely too much on meat. "
  npc_override_payon_in03_fortune_marionette_likes_shiny_m_b7392e: " The Marionette likes shiny money. Not dull money, but the shiny kind. "
  npc_override_payon_in03_fortune_marionette_marionette_fo_d5fc4b: " A Marionette is a Marionette forever. Its past and future never changes. Its present is its future. Don't you think it is rather sad? "
  npc_override_payon_in03_fortune_marionette_requires_lots_8fb788: " The Marionette requires lots of money. Its expenditures are enormous. You must have many expenditures ahead of you. "
  npc_override_payon_in03_fortune_marionette_restrained_ho_8d4061: " A Marionette is restrained but it has hope that it will be freed one day. "
  npc_override_payon_in03_fortune_marionette_s_eyes_warnin_d2f954: " The Marionette's eyes are warning about your falsehood. Lies, deceit, fake calculations and actions.. The Marionette is warning about all of them. "
  npc_override_payon_in03_fortune_marionette_says_you_must_304c34: " The Marionette says that you must not rely on violence and to use a different method. "
  npc_override_payon_in03_fortune_marionette_treasures_art_643041: " The Marionette treasures art over wealth. Bear that in mind. Honor over assets. "
  npc_override_payon_in03_fortune_marionette_uses_lot_mone_d76886: " The Marionette uses a lot of money. There is someone around you that is like that, too. "
  npc_override_payon_in03_fortune_marionette_warning_about_c5ee2a: " The Marionette is warning about ominous activities. If you did something recently, you should settle it soon. "
  npc_override_payon_in03_fortune_may_difficult_if_you_cau_e8d81f: " It may be difficult if you are caught up with one situation. In good times, prepare for the bad, and in bad times look forward to good luck. "
  npc_override_payon_in03_fortune_maybe_means_he_sees_type_a79348: " Maybe it means he sees that type of arrogance in you? Since the Baphomet is warning you.. "
  npc_override_payon_in03_fortune_maybe_you_being_troubles_8d3e49: " Maybe you are being troublesome? Make an effort to relax a little more. "
  npc_override_payon_in03_fortune_maybe_you_discouraged_li_a387cf: " Maybe you are discouraged a little too much right now. Be brave and daring young one. "
  npc_override_payon_in03_fortune_maybe_you_using_love_as_d4a9cd: " Maybe you are using love as an excuse to work? The card is saying to try observing love from a different perspective. "
  npc_override_payon_in03_fortune_meaning_your_future_beco_445477: " Meaning your future will become a battle between happiness and frustration.. "
  npc_override_payon_in03_fortune_means_if_you_go_after_c5ba72: " This means that if you go after fame and eternal life, tragedy awaits you in the end. They are not the important things in life. "
  npc_override_payon_in03_fortune_means_now_time_wait_how_c1ca2a: " This means now is a time to wait. How about it, would you like to wait a while? "
  npc_override_payon_in03_fortune_medusa_enjoy_playing_mon_f11726: " The Medusa does not enjoy playing with money. you are attempting to use money other than the way it should be used, you should stop. Why? "
  npc_override_payon_in03_fortune_medusa_punishes_those_wh_e8b301: " The Medusa punishes those who challenge it without warning. Unexpected punishment. "
  npc_override_payon_in03_fortune_medusa_s_warning_very_st_b6fbf9: " The Medusa's warning is very stern. Take a close look around you. "
  npc_override_payon_in03_fortune_medusa_says_there_great_e49931: " The Medusa says that there will be great chaos in the future. Chaos... I'm not sure what type of chaos it means, but it is definitely something that has never happened before. "
  npc_override_payon_in03_fortune_medusa_strongly_recommen_c0d531: " The Medusa is strongly recommending saving. This card is telling you to save. It says to put many savings accounts in your hair and make yourself resemble its head shape. "
  npc_override_payon_in03_fortune_medusa_symbolizes_absolu_77889e: " The Medusa symbolizes the absolute one who accepts everyone's challenge. Your future will be in a position that is challenged by many. "
  npc_override_payon_in03_fortune_medusa_symbolizes_absolu_ad3d1d: " The Medusa symbolizes the absolute one who accepts everyone's challenge. Your future must be filled with challenges! "
  npc_override_payon_in03_fortune_medusa_warning_about_per_84dd8a: " The Medusa is warning about a person near you. Of their existence.. and the relationship, "
  npc_override_payon_in03_fortune_medusa_warning_you_nice_d705f9: " The Medusa is warning you to be nice to others, or else it will turn you into stone."
  npc_override_payon_in03_fortune_medusa_warning_you_retur_980ba2: " The Medusa is warning you to return anything you borrow on time. "
  npc_override_payon_in03_fortune_medusa_you_should_carefu_7b7a66: " That is a Medusa. You should be careful. The warning ended a long time ago. "
  npc_override_payon_in03_fortune_menu_i_949774: "I would like a tarot card reading.:What's a tarot card reading?"
  npc_override_payon_in03_fortune_menu_i_9c69b8: " I would like a Poring card reading. : What is a Poring card reading? "
  npc_override_payon_in03_fortune_menu_i_a7133e: " (I'm curious about love!) : (I would like to do well in school!) : (Will my friendship be intact?) : (I want to know about my future self!) : (Will I make a lot of money?) "
  npc_override_payon_in03_fortune_menu_love_1e9844: " Love must have two things: great strength and the will to live. Have you thought about whether or not you can overcome this with your current self? "
  npc_override_payon_in03_fortune_menu_the_f45023: " The moth's warning: 'Dangerous!'. A very simple, yet obvious warning. "
  npc_override_payon_in03_fortune_menu_yes_716132: " Yes. : I would like to think about it once more. "
  npc_override_payon_in03_fortune_menu_yes_d6109a: "Yes.:I would like to think it over once more."
  npc_override_payon_in03_fortune_menu_you_bd7b28: " You need to think of an ideal more noble than money. The fortune the knight suggests is this: Knights never speak of ways to make money. "
  npc_override_payon_in03_fortune_might_seem_funny_bull_lo_a4270c: " It might seem funny that a bull will look into the future, but the bull is looking into your future right now. "
  npc_override_payon_in03_fortune_misfortune_shown_knight_6cc6a1: " The misfortune shown in the knight card is hastiness. That is also what takes away a knight's life, too. "
  npc_override_payon_in03_fortune_mmm_long_awaited_time_co_e6ef00: " Mmm! The long awaited time has come! Asking a question about money to the cute Poring! "
  npc_override_payon_in03_fortune_mmm_you_both_gone_crazy_f4ec3c: " Mmm! You both have gone crazy. You must overcome it through conversations! "
  npc_override_payon_in03_fortune_mmph_you_re_dying_study_3d1c13: " Mmph! You're dying not to study! At times like this, a break is the best! "
  npc_override_payon_in03_fortune_money_automatically_come_382526: " Money does not automatically come to one without effort! No matter how good the fortune, you must work diligently! "
  npc_override_payon_in03_fortune_money_like_clouds_instea_dd89fc: " Money is like clouds! Instead of money, think about a happy life! "
  npc_override_payon_in03_fortune_money_like_sand_even_you_873cfe: " Money is like sand. Even you save it, once the wind blows, it disappears. This card shows the emptiness of money. "
  npc_override_payon_in03_fortune_monster_card_reading_use_35cc45: " Monster card reading uses the cards of familiar monsters around us to get advice about our future, love, and many other things. "
  npc_override_payon_in03_fortune_most_people_curious_abou_76bb0a: " Most people are curious about money. "
  npc_override_payon_in03_fortune_moth_flies_around_withou_4b5106: " The moth flies around without worrying about the future. It is telling you to fly freely rather than getting anxious about the future.. "
  npc_override_payon_in03_fortune_moth_says_time_think_abo_da9415: " The moth says that this is not a time to think about wealth and prosperity. It says that someone important has appeared near you. "
  npc_override_payon_in03_fortune_moth_used_when_caterpill_17294e: " The moth is used when it is a caterpillar and ignored after it becomes a moth, by humans. "
  npc_override_payon_in03_fortune_moth_warning_you_you_sho_72e1bd: " The moth is warning you of this. You should be careful. "
  npc_override_payon_in03_fortune_msg_6eae3a: "..."
  npc_override_payon_in03_fortune_must_you_love_one_hair_62bb8c: " Must you love the one that has hair of snakes? Reconsider this love and think about it earnestly. "
  npc_override_payon_in03_fortune_necessary_reflect_upon_p_4f3b89: " It is necessary to reflect upon the past and present in order to look into the future. This card says to look carefully into your past. "
  npc_override_payon_in03_fortune_need_i_say_more_s_7a99cc: " Need I say more? That's a dangerous thought!! "
  npc_override_payon_in03_fortune_newton_discovered_gravit_4901b2: " Newton discovered gravity through a falling apple! Be wary of even the little things in your surroundings! "
  npc_override_payon_in03_fortune_next_time_you_meet_them_ac4291: " Next time you meet them, give them a massage. Start with the little things. "
  npc_override_payon_in03_fortune_nice_cup_cold_juice_unde_e83e31: " A nice cup of cold juice under the hot sun! Studying should be done like that, too! "
  npc_override_payon_in03_fortune_no_always_return_change_c63d4c: " No can do! Always return the change. "
  npc_override_payon_in03_fortune_no_matter_how_fearful_bu_aa990b: " No matter how fearful the bull may be, it has a nose ring, it has already been tamed by humans. No matter how astonishing that person may be, taming is your responsibility. "
  npc_override_payon_in03_fortune_no_matter_how_little_amo_fec70e: " No matter how little the amount, you must not just keep it. Sohee greatly dislikes it. "
  npc_override_payon_in03_fortune_no_matter_how_romantic_b_7a83c5: " No matter how romantic and beautiful love is, it is not rightful, it is undesirable.. "
  npc_override_payon_in03_fortune_no_matter_what_other_peo_33a5eb: " No matter what other people say, run towards your loved one! One-track love! "
  npc_override_payon_in03_fortune_no_matter_what_person_ph_4143e0: " No matter what a person does, physical strength is the most important. Exercise and get stronger. "
  npc_override_payon_in03_fortune_no_matter_what_stealing_0f7eb6: " No matter what, stealing is wrong! Even a Drake blesses you in the name of pirates! Stealing is forbidden! "
  npc_override_payon_in03_fortune_no_need_worry_about_oste_69eb39: " No need to worry about osteoporosis! Wasn't it a good thing to eat so much calcium? Oops! This isn't about money?! "
  npc_override_payon_in03_fortune_no_smoking_even_friend_s_d5c4ce: " No smoking, even with a friend! Stop smoking for your health! "
  npc_override_payon_in03_fortune_no_your_heart_about_leav_47c82e: " No! Your heart is about to leave your love! Catch it! "
  npc_override_payon_in03_fortune_nobody_tell_me_anything_7ef308: "but nobody will tell me anything~"
  npc_override_payon_in03_fortune_noooooooo_stealing_f57c66: " Noooooooo stealing! "
  npc_override_payon_in03_fortune_nope_ee47a2: "Nope!"
  npc_override_payon_in03_fortune_nope_i_read_cards_you_986747: "Nope, I can read cards for you!"
  npc_override_payon_in03_fortune_nor_lover_awaiting_him_s_a7a09e: " nor a lover awaiting him, so loneliness hits him in the heart. "
  npc_override_payon_in03_fortune_normal_worker_one_great_ad1184: " Not a normal worker, but one that has great strength and might.. "
  npc_override_payon_in03_fortune_northwest_you_like_try_y_c09fd4: " The northwest? Would you like to try your luck in that direction? "
  npc_override_payon_in03_fortune_nyangnyangnyang_53c6a0: "NyangNyangNyang~"
  npc_override_payon_in03_fortune_nyanyangnyanyag_f74d25: "NyaNyangNyaNyag~"
  npc_override_payon_in03_fortune_nyanyangnyanyang_8c75ec: "NyaNyangNyaNyang~"
  npc_override_payon_in03_fortune_oh_no_person_your_friend_2ce8a2: "Oh no?! This person is not your friend, but an enemy! You must be careful! "
  npc_override_payon_in03_fortune_oh_no_you_confident_abou_44c84c: " Oh no! You are not confident about the future! Trust yourself a little more! Hope! "
  npc_override_payon_in03_fortune_oh_no_you_lost_your_5ece43: " Oh no! You lost your loved one. And, nobody similar around you. Cheer up! "
  npc_override_payon_in03_fortune_oh_no_you_re_missing_51e567: " Oh, no! You're missing the main points! Figure out the essentials! "
  npc_override_payon_in03_fortune_oh_no_your_friend_ignori_0004d6: " Oh no! Your friend is ignoring you! Offer a bottle of juice to your friend! Your friendship may come back? "
  npc_override_payon_in03_fortune_oh_no_your_love_danger_2334e4: " Oh no! Your love is in danger! Run away from the menace! "
  npc_override_payon_in03_fortune_oh_you_keep_thinking_abo_458d94: " Oh! Do you keep on thinking about your death in the future! First, forget about death and live your life! "
  npc_override_payon_in03_fortune_oh_your_lover_about_leav_a1ced4: " Oh! Your lover is about to leave your side! Hold on tight! "
  npc_override_payon_in03_fortune_ohh_cute_love_fortune_he_8e5b1b: " Ohh! Cute love fortune! Heh! Lets look at the cards! "
  npc_override_payon_in03_fortune_ok_keep_mind_933254: " Ok? Keep that in mind~ "
  npc_override_payon_in03_fortune_ok_let_s_try_c4a49f: " Ok! Let's try it! "
  npc_override_payon_in03_fortune_ok_then_come_again_next_354940: " Ok then! Come again next time! We'll do a good job! Bye-bye~! "
  npc_override_payon_in03_fortune_ok_then_young_adventurer_97299d: " Ok then. Young adventurer, may luck be with you... "
  npc_override_payon_in03_fortune_once_sohee_didn_t_get_7a30cc: " Once, Sohee didn't get her change back when she asked a baby ghost to run an errand. "
  npc_override_payon_in03_fortune_once_you_emptied_your_mi_64c3fd: "Once you have emptied your mind, think of the thing you most wish to know."
  npc_override_payon_in03_fortune_once_you_type_willpower_3dadc9: " Once you have that type of willpower, the road to the future will be very broad and promising. "
  npc_override_payon_in03_fortune_one_cannot_live_as_knigh_9af40c: " One cannot live as a knight without being proud of that type of future. "
  npc_override_payon_in03_fortune_one_day_when_you_wake_f4325b: " One day, when you wake up, your loved one will leave a present! Be happy! "
  npc_override_payon_in03_fortune_one_more_thing_adad83: " And... one more thing. "
  npc_override_payon_in03_fortune_one_person_left_out_amon_2a7a24: " One person is left out amongst your friends! Be more friendly! "
  npc_override_payon_in03_fortune_one_thing_sure_you_very_9faf37: " One thing for sure is that you will be very happy! Congratulations young one! "
  npc_override_payon_in03_fortune_one_warning_sandman_resp_b731b4: " One warning from the Sandman, respect your parents. "
  npc_override_payon_in03_fortune_one_you_love_give_you_5d99c7: " The one you love will give you a kiss of death. "
  npc_override_payon_in03_fortune_only_small_part_your_fut_129ba1: " This is only a small part of your future! You must discover the rest! "
  npc_override_payon_in03_fortune_ooh_something_about_your_cd6919: " Ooh... something about your fortune is starting to show... "
  npc_override_payon_in03_fortune_oooh_stern_warning_about_8dbc8e: " Oooh, a stern warning about the future! Young one, bear this in mind. "
  npc_override_payon_in03_fortune_orc_lord_expressing_oppo_c6d2ab: " The Orc Lord is expressing opposition in being too curious about the future. "
  npc_override_payon_in03_fortune_orc_lord_likes_gold_all_a5756f: " The Orc Lord likes gold. Of all the treasures, gold is the best. Closely watch gold. "
  npc_override_payon_in03_fortune_orc_lord_possesses_much_034b78: " The Orc Lord possesses much wealth. It's because of greed. Greed is essential in collecting money. The desire and greediness to make money is not something to be ashamed about. Be diligent and go make money. "
  npc_override_payon_in03_fortune_orc_lord_says_dairy_farm_044dc8: " The Orc Lord says that dairy farming will develop in the future. Why don't you invest in it as well? "
  npc_override_payon_in03_fortune_orc_lord_says_love_your_028ad9: " The Orc Lord says that love for your companions will become great strength in the future. "
  npc_override_payon_in03_fortune_orc_lord_says_you_need_f3d467: " The Orc Lord says you need great strength in the future. Strength that is three, four times greater than now. "
  npc_override_payon_in03_fortune_orc_lord_starts_drooling_a59839: " The Orc Lord starts drooling about anything involving money. He targets anybody with money. "
  npc_override_payon_in03_fortune_orc_lord_warning_about_d_373f85: " The Orc Lord is warning about destruction. He knows destruction very well because he is a master of destruction. "
  npc_override_payon_in03_fortune_orc_lord_warning_you_abo_707d4d: " The Orc Lord is warning you about freedom. Isn't freedom a good thing? "
  npc_override_payon_in03_fortune_orc_lord_warning_you_opp_97e152: " The Orc Lord warning you of the opposite sex. Yes. They are poisonous. Keep your distance. "
  npc_override_payon_in03_fortune_orc_lord_warning_you_sel_073b6a: " The Orc Lord is warning you of self-righteousness. It is the most dangerous noxious bug that will feed on you. "
  npc_override_payon_in03_fortune_passion_love_like_raging_719720: " The passion of love like a raging wave... You can't even hide it. "
  npc_override_payon_in03_fortune_passion_love_like_raging_c1ec59: " The passion of love like a raging wave.. You can't even hide it. "
  npc_override_payon_in03_fortune_passionate_love_nearby_g_5d2d29: " Passionate love is nearby. It is a good sign. "
  npc_override_payon_in03_fortune_pattern_clothes_symboliz_591ded: " The pattern of the clothes symbolizes a warning. It is saying to be careful of love. "
  npc_override_payon_in03_fortune_pay_little_more_attentio_cb8ce6: " Pay a little more attention to the present. "
  npc_override_payon_in03_fortune_perhaps_person_you_belie_2cfe60: " Perhaps the person you believe to be a butterfly is actually a moth. This fortune is awaiting a prudent judgement. "
  npc_override_payon_in03_fortune_person_s_heart_like_card_d8d247: " A person's heart is like this card. you flip it over nobody can tell what is behind it. Try turning the person's card over. "
  npc_override_payon_in03_fortune_pick_job_where_you_work_1485a1: " Pick a job where you can work with other people! It will be very rewarding, right? "
  npc_override_payon_in03_fortune_pirate_warning_you_your_0c7056: " The pirate is warning you of your beauty. Don't show off your beauty too much. Pirates are very jealous of appearance, as well. "
  npc_override_payon_in03_fortune_pirates_betrayal_means_t_833763: " To pirates, betrayal means tragic death. Be careful of betrayals. "
  npc_override_payon_in03_fortune_pirates_future_doesn_t_m_12ee9f: " Pirates do not have a future. That doesn't mean you do not have one. But.. you simply need to make more prudent decisions. "
  npc_override_payon_in03_fortune_pirates_give_warnings_ab_e60b25: " Pirates give warnings about many things. But right now, this card is speaking of betrayal. "
  npc_override_payon_in03_fortune_pirates_remembered_as_pi_0f0d2c: " Pirates are remembered as pirates even after they pass away. A person's name is beyond the matter of life and death. "
  npc_override_payon_in03_fortune_please_pay_your_fee_all_ab3dfb: "Please pay your fee with all of your sincerity."
  npc_override_payon_in03_fortune_point_where_challenge_ch_67dc9c: " ...to the point where that challenge will change your life. "
  npc_override_payon_in03_fortune_poke_poke_they_tell_you_ce056e: " Poke~poke~ they tell you your fortune! It is not traditional, but the liveliness is the best! "
  npc_override_payon_in03_fortune_poring_card_readings_foc_2045c3: " Poring card readings focus on cards with cute Porings..! "
  npc_override_payon_in03_fortune_poring_fortunetelling_wo_c81a10: " Poring fortunetelling works very well when it is about friendship! "
  npc_override_payon_in03_fortune_praising_type_love_alway_a31754: " This is praising the type of love that is always there, yet barely has a form as it does not exist. "
  npc_override_payon_in03_fortune_prepare_event_love_they_65a0fc: " Prepare an event of love! They will be flying with happiness! "
  npc_override_payon_in03_fortune_prepare_hat_cover_your_f_9565c4: " Prepare a hat to cover your friend's large head! They will be moved by your care! "
  npc_override_payon_in03_fortune_prepare_present_your_lov_715a00: " Prepare a present for your love! They might get a heart attack because they will be overwhelmed with happiness! "
  npc_override_payon_in03_fortune_reason_person_may_seem_c_c20222: " The reason the person may seem capricious or cunning is partially because they are born like that. "
  npc_override_payon_in03_fortune_reason_pirates_indulge_o_190162: " The reason pirates indulge in others assets in the vast rough ocean, is because it is the only way to let the people of the land know of their existence. "
  npc_override_payon_in03_fortune_relationships_among_frie_ad13c0: " Relationships among friends is more difficult than people think! Let's use the cards to try and solve this complicated puzzle of friendship! "
  npc_override_payon_in03_fortune_respect_his_opinion_youn_f5e974: " Respect his opinion young one. You have nothing to lose. "
  npc_override_payon_in03_fortune_rid_yourselves_shadow_th_eb4c66: " Rid yourselves of that shadow. Then the doll will smile as well. "
  npc_override_payon_in03_fortune_romance_best_part_love_1ac0e9: " Romance is the best part of love~ "
  npc_override_payon_in03_fortune_romance_lays_ahead_your_63fbf1: " Romance lays ahead in your future! Relax yourself and prepare yourself! "
  npc_override_payon_in03_fortune_rough_sea_called_world_o_53caf6: " In the rough sea called the world, only pirates, the outlaws of love, are the law. "
  npc_override_payon_in03_fortune_s_bad_you_punished_1f446b: " That's bad! You will be punished! "
  npc_override_payon_in03_fortune_s_fortune_marina_card_8bee4e: " That's the fortune from a Marina card. "
  npc_override_payon_in03_fortune_s_good_sign_congratulati_9933f0: " It's a good sign! Congratulations! "
  npc_override_payon_in03_fortune_s_hard_make_money_isn_eed252: " It's hard to make money, isn't it? But don't forget the good deeds in life! "
  npc_override_payon_in03_fortune_s_uneasy_fortune_you_rea_30e895: " It's an uneasy fortune. Are you ready? "
  npc_override_payon_in03_fortune_s_why_future_unexpected_56a8c5: " That's why it is the future. Unexpected things happen every once in a while in the future. Lala~ "
  npc_override_payon_in03_fortune_s_why_he_knows_about_d5eb85: " That's why he knows about the danger and misfortune destruction brings. Don't destroy thoughtlessly. You will end up destroying yourself as well. "
  npc_override_payon_in03_fortune_s_why_those_who_controll_5e50e7: " That's why those who are controlled by fools consider the other a fool, too. "
  npc_override_payon_in03_fortune_s_why_you_should_more_c106af: " That's why you should be more careful about it. "
  npc_override_payon_in03_fortune_sadness_failure_darkness_299b58: " Sadness, failure, darkness, loneliness.. you may feel all of these emotions, but they are not fatal. Don't worry. "
  npc_override_payon_in03_fortune_sadness_natural_feeling_dfe52f: " Sadness is a natural feeling, but don't let that put you down. "
  npc_override_payon_in03_fortune_same_concept_you_ready_a_3745f0: " It is the same concept. you are ready, any type of love is possible. There is no such thing as impossible. "
  npc_override_payon_in03_fortune_same_goes_humans_wary_th_510069: " Same goes for humans. Be wary of those who are avaricious like the Orc Lord. "
  npc_override_payon_in03_fortune_same_life_17ca89: " It is the same in life. "
  npc_override_payon_in03_fortune_sand_dune_changes_its_sh_0bd8ce: " A sand dune changes its shape even after a day. The Sandman card is speaking of a future with many changes. "
  npc_override_payon_in03_fortune_sand_instant_cure_athlet_741df1: " Sand is an instant cure of athlete's foot. He says to beware of athlete's foot and that he hates those rubbing their infected feet into his body. "
  npc_override_payon_in03_fortune_sand_s_future_simply_san_2a26b6: " A sand's future is simply sand. Not a rock, nor mud. Some things just don't change young one. "
  npc_override_payon_in03_fortune_sandman_cries_sadness_wh_ae377e: " The Sandman cries with sadness when money comes up. It is sad because money does not possess love or affection. "
  npc_override_payon_in03_fortune_sandman_likes_save_too_e_b6adb5: " The Sandman likes to save, too. Even a monster likes to save, but when a human doesn't... "
  npc_override_payon_in03_fortune_sandman_s_body_empty_ins_237a63: " The Sandman's body is empty inside. Your wallet seems to be emtpy, too. You should save up some money. "
  npc_override_payon_in03_fortune_sandman_s_warning_very_s_a0cb47: " A Sandman's warning is very stern. Wash your feet regularly, young one. "
  npc_override_payon_in03_fortune_sandman_says_over_sleepe_f57d2c: " The Sandman says over-sleepers will be punished by society! "
  npc_override_payon_in03_fortune_sandman_says_watch_out_b_3779ec: " The Sandman says to watch out before you become like a chicken. "
  npc_override_payon_in03_fortune_sandman_screaming_becaus_a8c0cd: " The Sandman is screaming because it saw too much money. It saw the money in the hands of your future. I wonder what all that money is? "
  npc_override_payon_in03_fortune_saying_careful_burn_your_aeca6a: " It is saying to be careful not to burn your mustache with a cigarette. When you do something, something is always at risk.. It is probably warning about that. "
  npc_override_payon_in03_fortune_saying_daring_action_nec_367a75: " It is saying that daring action is necessary, such as that of the Hode that strikes up from the sand. "
  npc_override_payon_in03_fortune_saying_forgive_those_who_33e6ba: " Saying it will not forgive those who use other's things like a black hole.. borrowing and never returning "
  npc_override_payon_in03_fortune_saying_studying_dark_nig_b2bb09: " It is saying studying in the dark night can be dangerous! Careful when studying at night! "
  npc_override_payon_in03_fortune_saying_type_behavior_sur_476ab5: " Saying that, that type of behavior will surely bring upon monsters' curses. "
  npc_override_payon_in03_fortune_says_became_like_because_07975c: " It says it became like that because of a bad eating habit. "
  npc_override_payon_in03_fortune_says_better_i_no_idea_6846c5: " It says to do better.. I have no idea what it means. "
  npc_override_payon_in03_fortune_says_nothing_you_particu_b53375: " It says nothing for you in particular. Nothing ominous. "
  npc_override_payon_in03_fortune_says_say_one_thing_you_37ec3d: " It says it will say one thing for you. Dark clouds can be seen beyond the clear skies. "
  npc_override_payon_in03_fortune_says_there_no_set_path_7febef: " It says that there is no set path in the future. Isn't a relief in a way? "
  npc_override_payon_in03_fortune_says_too_caught_up_prese_8db06a: " It says not to be too caught up with the present, because the future is always changing. "
  npc_override_payon_in03_fortune_says_what_you_need_pride_4c2952: " It says what you need is pride. Not honor, wealth, or love.. but pride. "
  npc_override_payon_in03_fortune_says_you_might_tempted_s_e603f5: " It says you might be tempted to do something bad to gather money! Don't forget about a kind heart! "
  npc_override_payon_in03_fortune_scariest_thing_hammer_no_5ddd6e: " The scariest thing is not the hammer nor horn. It is the massive legs that support its heavy weight. Nobody can survive a hit by those legs. The person is also probably hiding the most dangerous part. "
  npc_override_payon_in03_fortune_scrumptious_ice_cream_co_c5d678: " Scrumptious ice cream that could even be eaten in heaven! Challenge yourself and get involved in a job making things of that sort! "
  npc_override_payon_in03_fortune_scythe_baphomet_holding_ae8611: " The scythe the Baphomet is holding signifies the strong will to conquer the future. "
  npc_override_payon_in03_fortune_scythe_baphomet_means_st_6577a6: " The scythe of the Baphomet means a strong tool to gather wealth. you have a strong tool like his, it should be easy to gather wealth. "
  npc_override_payon_in03_fortune_scythe_may_seem_burdenso_171a2d: " A scythe may seem burdensome but a strong Baphomet can freely use it. "
  npc_override_payon_in03_fortune_seeing_he_warning_about_c99f00: " Seeing that he is warning about hatred. Don't you think it's a good idea to avoid his eyes at a time like this? "
  npc_override_payon_in03_fortune_seeing_hode_spits_out_sa_d0094f: " Seeing that the Hode spits out sand to those who bother them, you must have done something to bother the person somehow. "
  npc_override_payon_in03_fortune_seeing_you_work_so_hard_9e4313: " Seeing that you work so hard, seems like you will make lots of money! Congratz~! "
  npc_override_payon_in03_fortune_seems_as_if_your_friend_0b41a9: " It seems as if your friend will give you many presents! Look forward to it! "
  npc_override_payon_in03_fortune_seems_like_darkness_its_864de5: " It seems like darkness is on its way. Be careful, this darkness isn't ordinary. "
  npc_override_payon_in03_fortune_seems_like_he_wants_tell_bcc9f7: " It seems like he wants to tell you this. "
  npc_override_payon_in03_fortune_seems_like_jack_worried_dbc1b0: " It seems like Jack is worried about excessive jokes. "
  npc_override_payon_in03_fortune_seems_like_you_two_lucky_99f8a8: " It seems like you will have two lucky offerings! Don't miss these two opportunities! "
  npc_override_payon_in03_fortune_serious_problem_your_lif_7b1e76: " It is a serious problem. It is your life, so ponder about it young one. "
  npc_override_payon_in03_fortune_set_goal_higher_than_mon_5348c4: " Set a goal higher than money and wealth. Do you understand, young one? "
  npc_override_payon_in03_fortune_share_your_bone_your_fri_af4724: " Share your bone with your friend! Sacrifices in friendship are beautiful! "
  npc_override_payon_in03_fortune_shouldn_t_you_reconsider_bbf8d4: " Shouldn't you reconsider working against your will just for money? "
  npc_override_payon_in03_fortune_shovel_5434bd: " A shovel..? "
  npc_override_payon_in03_fortune_shoveling_requires_skill_929d22: " Shoveling requires skills as well. "
  npc_override_payon_in03_fortune_skeleton_ability_dig_whe_35ef1d: " The Skeleton has the ability to dig where it feels the future, rather than looking into it. "
  npc_override_payon_in03_fortune_skeleton_card_gray_tone_7d9be3: " The skeleton card has a gray tone. If you read the grey, you can see the darkness. "
  npc_override_payon_in03_fortune_skeleton_encouraging_you_de6dbf: " The Skeleton is encouraging you to not lose your light even in a life in dark and damp places. "
  npc_override_payon_in03_fortune_skeleton_s_pickaxe_very_ab9cca: " The skeleton's pickaxe is very strong. Even though its body seems weak, with the right tools, it can do great things. "
  npc_override_payon_in03_fortune_skeleton_says_you_make_m_2f2cd6: " The Skeleton says that you can make money by going north. Go north. "
  npc_override_payon_in03_fortune_skeleton_warning_you_abo_0b6297: " The skeleton is warning you about an irregular eating pattern. "
  npc_override_payon_in03_fortune_small_territory_ensure_g_14429b: " A small territory will ensure great happiness. "
  npc_override_payon_in03_fortune_smoking_mine_imprudent_l_a5b4c6: " Smoking in a mine is an imprudent, life-threatening thing to do. You are wasting your precious life with that kind of behavior. "
  npc_override_payon_in03_fortune_so_7fe8c6: "Is that so...?"
  npc_override_payon_in03_fortune_so_cursed_make_effort_le_263aaa: " So, to not be cursed, make an effort to leave your name in history. "
