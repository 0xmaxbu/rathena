Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_payon_in03_fortune_act_little_more_wisdom_y_44a027: " Act with a little more wisdom for your future. "
  npc_override_payon_in03_fortune_act_wisely_you_ll_troubl_bb66ea: " Act wisely! You'll be in trouble you are tricked easily! "
  npc_override_payon_in03_fortune_agh_don_t_die_studying_468c63: " Agh! Don't die from studying! Take breaks while you're at it! You need some rest! "
  npc_override_payon_in03_fortune_agh_someone_after_your_p_0c1e33: "Agh! Someone is after your possessions! Be careful! "
  npc_override_payon_in03_fortune_agh_you_re_about_give_f94416: " Agh! You're about to give your soul to your loved one! Take it down a notch! "
  npc_override_payon_in03_fortune_agh_you_suffering_becaus_810783: " Agh! You are suffering because of your friend! Try opening your heart and be more lenient! "
  npc_override_payon_in03_fortune_ah_f23635: "Ah...?!"
  npc_override_payon_in03_fortune_ah_sexy_rival_appeared_d_e52f32: " Ah! A sexy rival has appeared! Don't get sidetracked! "
  npc_override_payon_in03_fortune_ah_so_05dae4: " Ah~ is that so! "
  npc_override_payon_in03_fortune_ah_there_noble_person_up_1a9e49: " Ah.. there is a noble person up north. North it is. This direction will never change. "
  npc_override_payon_in03_fortune_ah_your_friend_gone_craz_3dcad0: " Ah! Your friend has gone crazy! They need the heal of friendship! "
  npc_override_payon_in03_fortune_all_all_big_fortune_righ_166302: " All in all, a big fortune is right in front of your eyes. I'll be looking forward to it. "
  npc_override_payon_in03_fortune_all_you_young_one_theref_54e94d: " This is all for you young one. Therefore, follow this fortune and rid yourself of falsehood. "
  npc_override_payon_in03_fortune_also_bad_influence_your_d14cc7: " Also, it can have a bad influence on your life, too! "
  npc_override_payon_in03_fortune_always_challenge_others_63e09e: " Always challenge others! It is alright to fail, since challenge itself will become life. "
  npc_override_payon_in03_fortune_always_too_much_freedom_3f5823: " Not always! Too much freedom can lead to self-indulgence! "
  npc_override_payon_in03_fortune_am_i_cheesy_i_m_e7483c: " Am I cheesy? I'm just like that! Then, bye~~~~ye~~~ye~~~~!! "
  npc_override_payon_in03_fortune_anger_only_exhausts_you_8b5798: " Anger only exhausts you. Keep your distance from anger and befriend jokes. Jack's word. "
  npc_override_payon_in03_fortune_anubis_doesn_t_like_foul_957b95: " The Anubis doesn't like foul language. You don't have a foul mouth, do you? "
  npc_override_payon_in03_fortune_anubis_giving_warning_we_36199b: " The Anubis is giving a warning of the west. There is a being there that can break away your wealth. "
  npc_override_payon_in03_fortune_anubis_god_death_express_a9e2b3: " The Anubis is the god of death, but it expresses more interest in the future than death. "
  npc_override_payon_in03_fortune_anubis_hates_those_who_t_34129c: " The Anubis hates those who try to gather money for his death. He believes it's a waste of money. Don't make the mistake of gathering money for death. "
  npc_override_payon_in03_fortune_anubis_likes_comedy_desp_4da231: " The Anubis likes comedy despite people's expectations. It looks forward to comedy. Comedy must be important in the future. "
  npc_override_payon_in03_fortune_anubis_must_like_being_b_2218d6: " The Anubis must not like being busy these days. "
  npc_override_payon_in03_fortune_anubis_says_careful_dark_54cefb: " The Anubis says to be careful of darkness. In darkness, death lingers in the dark. "
  npc_override_payon_in03_fortune_anubis_says_no_interest_dc4893: " The Anubis says it has no interest in you. It is a good sign. "
  npc_override_payon_in03_fortune_anubis_very_interested_s_1e2c43: " The Anubis is very interested in the sacrifices offered. The offerings he likes are youth and effort. "
  npc_override_payon_in03_fortune_anubis_warning_you_hatre_dd8f38: " The Anubis is warning you of hatred. Hatred only brings upon death. "
  npc_override_payon_in03_fortune_any_ideas_who_may_8490d4: " Any ideas who that may be? "
  npc_override_payon_in03_fortune_anyhow_cruelty_harm_you_78caca: " Anyhow, cruelty will harm you for sure. Be cautious of it. "
  npc_override_payon_in03_fortune_anyhow_you_should_avoid_e3763d: " Anyhow, you should avoid reckless driving.. If a knight is saying that, it is a big problem. "
  npc_override_payon_in03_fortune_anything_your_friend_all_1f9966: " Do anything for your friend! With all your heart and soul! Your friend will be delighted! "
  npc_override_payon_in03_fortune_anyways_he_jealous_human_ce5cbc: " Anyways, he is jealous of the humans that leave their name in history. "
  npc_override_payon_in03_fortune_anyways_search_type_mone_cf2304: " Anyways, search for that type of money. "
  npc_override_payon_in03_fortune_approach_them_more_since_57b827: " Approach them with more sincerity and consideration. "
  npc_override_payon_in03_fortune_approach_then_affection_54b03b: " Approach then with affection. "
  npc_override_payon_in03_fortune_aren_t_you_already_caugh_4be965: " Aren't you already caught in love that you cannot run away from? Look around you. "
  npc_override_payon_in03_fortune_arrogance_takes_away_res_1a0bf5: " Arrogance takes away that respect. The Baphomet hates that type of arrogance. "
  npc_override_payon_in03_fortune_as_jack_s_advice_says_b2f268: " As Jack's advice says, stay closer to light money. It is safer and better. "
  npc_override_payon_in03_fortune_as_you_quench_your_thirs_38fa5c: " As you can quench your thirst in the dry desert, you can gather money even in this difficult world! "
  npc_override_payon_in03_fortune_attack_love_you_need_str_f0a525: " To attack with love.. you will need a stronger attack.. Mmm.. "
  npc_override_payon_in03_fortune_attitude_reflecting_upon_64443c: " ..with the attitude of reflecting upon yourself. What do you think? Don't you think you lived too much looking into the future? "
  npc_override_payon_in03_fortune_aware_wings_wings_symbol_24917b: " Be aware of the wings. Wings symbolize flight, adventure, and fickleness of a player. "
  npc_override_payon_in03_fortune_bad_result_may_come_your_146cd8: " A bad result may come your way. "
  npc_override_payon_in03_fortune_bah_don_t_laugh_about_6c2e46: " Bah, don't laugh about it! This is a solemn warning. "
  npc_override_payon_in03_fortune_bah_isn_t_time_think_178b1a: " Bah! This isn't a time to think about money. Calm down and put your mind at ease! "
  npc_override_payon_in03_fortune_baphomet_doesn_t_care_ab_dd0d30: " The Baphomet doesn't care about a human's future. They simply observe quietly. Hmm... It seems like it has nothing to say about your future as well... "
  npc_override_payon_in03_fortune_baphomet_facing_future_n_b3e92e: " The Baphomet is facing the future. No matter how much effort you put in, without an eye that looks towards the future, it is pointless. "
  npc_override_payon_in03_fortune_baphomet_like_tribute_he_d44a71: " The Baphomet would like a tribute. He is saying that you do, he will return great benefits. "
  npc_override_payon_in03_fortune_baphomet_looks_as_having_7afb50: " This Baphomet looks as it is having a hard time. The person must be exhausted even it may not seem so. "
  npc_override_payon_in03_fortune_baphomet_says_beware_whe_b922ea: " The Baphomet says to beware when intervening with others' issues. "
  npc_override_payon_in03_fortune_baphomet_says_humans_no_6eba44: " The Baphomet says that humans have no future. It says that their greed and selfishness shows no hope. "
  npc_override_payon_in03_fortune_baphomet_says_nothing_sa_638c66: " The Baphomet says it has nothing to say. I wonder why? Isn't it a very good sign?!! "
  npc_override_payon_in03_fortune_baphomet_telling_you_loo_6ee773: " The Baphomet is telling you to look towards the future. "
  npc_override_payon_in03_fortune_baphomet_warning_about_a_49d8de: " The Baphomet is warning about arrogance. Even a strong and wise warrior must show respect to a Baphomet, "
  npc_override_payon_in03_fortune_baphomet_warning_about_l_b7baa8: " The Baphomet is warning about the laziness that stops one from sharpening the scythe. "
  npc_override_payon_in03_fortune_bear_mind_7113ca: " Bear that in mind. "
  npc_override_payon_in03_fortune_bear_mind_then_until_we_69adbd: " Bear that in mind! Then, until we meet again.. *poof*! "
  npc_override_payon_in03_fortune_beauty_only_skin_deep_4dd873: " Beauty is only skin deep. "
  npc_override_payon_in03_fortune_because_there_curse_medu_052432: " Because there can be a curse of the Medusa. "
  npc_override_payon_in03_fortune_because_they_find_their_98ae71: " Because they find their meaning of life in the process. Young one, how about searching for the meaning of your life? "
  npc_override_payon_in03_fortune_become_lord_you_need_col_d3ac3a: " To become a Lord, you will need colleagues. You should take the Orc Lord's advice! "
  npc_override_payon_in03_fortune_become_pirate_love_simpl_2813ff: " Become a pirate of love! It is a simple, yet strong fortune! "
  npc_override_payon_in03_fortune_become_rich_you_must_wor_d79990: " To become rich, you must work hard as you became a skeleton. The Skeleton is saying to work hard until you become a skeleton. "
  npc_override_payon_in03_fortune_before_bulls_used_though_84b47f: " Before, bulls used to be thought of as foolishly honest workers, but these days bulls are great strong fighters. "
  npc_override_payon_in03_fortune_being_close_friends_desp_25ffe6: " Being close friends despite differences is true friendship! Shelter each other's differences! "
  npc_override_payon_in03_fortune_being_greedy_taking_care_829a55: " Not being greedy and taking care of your share is the wisest way to manage your wealth. "
  npc_override_payon_in03_fortune_bull_honest_worker_cries_7b9db8: " A bull is an honest worker that cries even while it works. It knows that it must not be lazy about what it needs to do, even when expressing sadness. "
  npc_override_payon_in03_fortune_bull_s_thought_your_fort_f9d645: " This is the bull's thought and your fortune. "
  npc_override_payon_in03_fortune_bull_thinks_happiness_aw_96e668: " The bull thinks of the happiness awaiting in the future, but it doesn't like reduced efficiency because of that happiness. "
  npc_override_payon_in03_fortune_bull_warning_about_ignor_b2259f: " The bull is warning about ignorance about a crisis. "
  npc_override_payon_in03_fortune_bull_warning_about_meat_379d81: " The bull is warning about meat from watered cows. "
  npc_override_payon_in03_fortune_bull_warning_something_m_8bd865: " The bull is warning of something that will make life sad. "
  npc_override_payon_in03_fortune_bull_warns_corruption_la_165f9e: " The Bull warns of corruption. A lazy hedonist that is not diligent. "
  npc_override_payon_in03_fortune_bulls_continue_work_even_745c57: " Bulls continue to work even on gloomy days. Then they can gather a lot of things. "
  npc_override_payon_in03_fortune_bulls_leave_leather_when_427c19: " Do bulls leave leather when they pass away? Or was it the tiger? "
  npc_override_payon_in03_fortune_bulls_like_working_money_26dc4c: " Bulls do not like working for money. They are disgruntled when others consider labor as money. "
  npc_override_payon_in03_fortune_bulls_only_know_how_work_f9c98d: " Bulls only know how to work, but the bull itself has a lot to offer. Meat, leather, horn.. "
  npc_override_payon_in03_fortune_business_looking_into_fu_048066: " A business looking into the future? "
  npc_override_payon_in03_fortune_calls_its_loved_one_they_06c0f8: " it calls its loved one, but they cannot hear.. "
  npc_override_payon_in03_fortune_card_expects_something_l_3e2e37: " The card expects something like that from you. "
  npc_override_payon_in03_fortune_card_only_shows_gaunt_bo_134fc4: " The card only shows gaunt bones, but notice how it has all the necessary tools?"
  npc_override_payon_in03_fortune_card_reading_only_readin_adcd2b: " A card reading is only a reading... No matter how extraordinary the result may be, don't get too caught up with it. Bear that in mind. "
  npc_override_payon_in03_fortune_card_saying_3f87b4: " The card is saying this. "
  npc_override_payon_in03_fortune_card_says_you_should_too_de6d28: " The card says that you should not be too greedy, for that may cause you to dig your own grave. "
  npc_override_payon_in03_fortune_card_supports_strong_lov_b86a39: " This card supports strong love. "
  npc_override_payon_in03_fortune_card_telling_me_fly_your_6ee4bd: " The card is telling me, 'Fly to your loved one as you were a butterfly and shoot at it as you were a star.' "
  npc_override_payon_in03_fortune_card_warning_you_treat_y_efa4a0: " This card is warning you to not treat your loved one like a puppet. "
  npc_override_payon_in03_fortune_careful_kind_cell_stuck_11850a: " Be careful to not have that kind of cell stuck on you. "
  npc_override_payon_in03_fortune_careful_lose_your_assets_3c92f9: " Be careful not to lose your assets. Take good care of your wallet. "
  npc_override_payon_in03_fortune_careful_shoveling_you_mi_5a0447: " 'Be careful of shoveling'.. You might get hit by a shovel. Should you be careful around a construction site? "
  npc_override_payon_in03_fortune_careful_when_jack_speaks_281044: " Be careful. When Jack speaks like this, he playfulness is gone. "
  npc_override_payon_in03_fortune_careful_word_god_death_f41436: " Be careful. It is the word of the god of death. "
  npc_override_payon_in03_fortune_carefully_worn_their_hea_3af128: " it is carefully worn, their heart for you can be seen in it as well.. "
  npc_override_payon_in03_fortune_cautious_9580bb: "Be cautious. "
  npc_override_payon_in03_fortune_cautious_death_death_you_e0dc6d: " Be cautious of death.. death that can be your turn, or maybe someone else. "
  npc_override_payon_in03_fortune_charisma_sweetest_poison_d8f61d: " Charisma... is the sweetest poison. "
  npc_override_payon_in03_fortune_check_see_if_there_aspec_916d90: " Check to see if there is an aspect of your life that is like the moth. "
  npc_override_payon_in03_fortune_chicken_puts_sand_its_mo_276b62: " A chicken puts sand in its mouth to aid its insufficient digestion system. "
  npc_override_payon_in03_fortune_choose_job_involves_flyi_953553: " Choose a job that involves flying! You show potential! "
  npc_override_payon_in03_fortune_clear_your_mind_88bbc3: "Clear your mind... "
  npc_override_payon_in03_fortune_compared_life_they_belie_f4c6c7: " Compared to life, they believe money is foolish. The knight would like to understand these ideas of life. "
  npc_override_payon_in03_fortune_could_also_good_thing_me_603549: " But that could also be a good thing. This is the meaning of a Marionette. "
  npc_override_payon_in03_fortune_could_good_bad_also_very_d773ff: " It could be good and bad. It is also a very tiring position. "
  npc_override_payon_in03_fortune_cut_you_filled_uncertain_16d269: " Cut! You are filled with uncertainty about the future! Let's get rid of this! Wee! It's gone! "
  npc_override_payon_in03_fortune_deep_sleep_brings_happin_f3da65: " Deep sleep brings happiness and dreams. I think what you need right now is sleep. "
  npc_override_payon_in03_fortune_delicate_treatment_atten_79ad60: " Delicate treatment and attention is the best in love. "
  npc_override_payon_in03_fortune_delightful_preparation_i_d23ac9: " Delightful preparation? I don't understand.. I suppose I am too old. Maybe young ones get it.. "
  npc_override_payon_in03_fortune_devote_energy_love_1e5032: " Devote that energy to love..! "
  npc_override_payon_in03_fortune_devoted_myself_training_7d17e5: "and devoted myself to training."
  npc_override_payon_in03_fortune_did_you_know_moth_s_374dac: " Did you know that a moth's wings has infinite amounts of powder on it? A moth symbolizes wealth in the sense that it can gather wealth just as the powder on its wings. "
  npc_override_payon_in03_fortune_did_you_like_next_time_eff3de: " Did you like it? Next time invite your friend! Then byebye!! "
  npc_override_payon_in03_fortune_did_you_something_absurd_bf846b: " Did you do something absurd to that person? Are you sure? Think about it~ "
  npc_override_payon_in03_fortune_digging_east_right_now_h_c9f086: " It is digging in the east right now. How about it, won't you try going there? "
  npc_override_payon_in03_fortune_doesn_t_seem_like_there_30fdd6: " Doesn't it seem like there should be money in the small wallet? You will have some small income! Save money wisely! "
  npc_override_payon_in03_fortune_doll_craving_attention_l_bba0a2: " The doll is craving attention. A lot of attention. "
  npc_override_payon_in03_fortune_dolls_become_accustomed_8df26a: " Dolls become accustomed to the owner the more they are handled. Give your doll more attention. "
  npc_override_payon_in03_fortune_dolls_understand_human_s_2eef62: " Dolls understand a human's heart more than a human. Try treating your loved one as they were a doll. "
  npc_override_payon_in03_fortune_don_t_blame_environment_d00100: " Don't blame the environment. That excuse is only for whiners. "
  npc_override_payon_in03_fortune_don_t_eat_anything_night_38825d: " Don't eat anything at night. Your stomach will hurt. "
  npc_override_payon_in03_fortune_don_t_eat_too_much_db94b9: " And don't eat too much spicy and salty food, alcohol, etc. What a thoughtful Sandman. "
  npc_override_payon_in03_fortune_don_t_focus_too_much_c3e695: " Don't focus too much on money. Just work at it. It's saying that it is the best method. "
  npc_override_payon_in03_fortune_don_t_forget_you_must_6e43db: " Don't forget that you must think about yorsrelf the most. "
  npc_override_payon_in03_fortune_don_t_forget_your_friend_696dcf: " Don't forget your friend in heaven! Friendship is eternal! "
  npc_override_payon_in03_fortune_don_t_get_disturbed_mark_289a90: " Don't get disturbed by the mark of death. It's merely a Joker's joke. "
  npc_override_payon_in03_fortune_don_t_get_fooled_tricks_90003b: " Don't get fooled by tricks. They are a person, too. They know how to lie once in a while. Search for the trick calmly and carefully. "
  npc_override_payon_in03_fortune_don_t_get_lazy_about_158918: " Don't get lazy about studying wherever you go! Seek the road of truth and go down it to find the answer! "
  npc_override_payon_in03_fortune_don_t_get_malicious_thou_a63e79: " Don't get malicious thoughts. Keep a kind heart. "
  npc_override_payon_in03_fortune_don_t_get_sidetracked_lo_20254c: " Don't get sidetracked and look elsewhere! You will be cursed! "
  npc_override_payon_in03_fortune_don_t_get_too_greedy_b22448: " Don't get too greedy about things. "
  npc_override_payon_in03_fortune_don_t_measure_friendship_d2b323: " Don't measure friendship with money! If you do, be careful for there will be a crack in your friendship! "
  npc_override_payon_in03_fortune_don_t_neglect_trivial_th_17a0d6: " Don't neglect the trivial things on the floor! If you keep an open heart like that, you will be able to collect money! "
  npc_override_payon_in03_fortune_don_t_picky_about_days_ccb998: " Don't be picky about the days you work. You will be able to make more money. "
  npc_override_payon_in03_fortune_don_t_prepare_future_car_617b1f: " Don't prepare for the future carelessly. A loose measure is worse than a prepared adventure. "
  npc_override_payon_in03_fortune_don_t_run_forward_carele_7124c1: " Don't run forward carelessly. Raise your sword and wait for your chance. "
  npc_override_payon_in03_fortune_don_t_shy_front_your_f42507: " Don't be shy in front of your loved one! Love transcends everything! "
  npc_override_payon_in03_fortune_don_t_think_them_too_1821a2: " Don't think of them too much. A crisis is simply a crisis. "
  npc_override_payon_in03_fortune_don_t_think_your_head_0ed1bb: " Don't think that your head is empty! Because, you are smart! You can do it! "
  npc_override_payon_in03_fortune_don_t_try_gaze_straight_e1fa09: " Don't try to gaze straight them. Make an effort to approach them. "
  npc_override_payon_in03_fortune_don_t_you_think_you_b13b81: " Don't you think you are infatuated by outer appearance and gambling with love? You might have to be more careful about it this time. "
  npc_override_payon_in03_fortune_don_t_your_troubles_disa_12f0ca: " Don't your troubles disappear watching a poring smile? Your future must be filled with good things! "
  npc_override_payon_in03_fortune_dracula_brings_money_may_9ecb99: " Dracula brings in money. Maybe it is the moral influence from when it was a count. It is expensive to be a vampire, but I've never seen a poor one before. "
  npc_override_payon_in03_fortune_dracula_mocks_human_s_mo_3bcab9: " Dracula mocks human's money. To him it is worthless. "
  npc_override_payon_in03_fortune_dracula_money_important_e2a0c7: " To Dracula, money is not important. Blood is more valuable. To you, money must not be that important. You don't need to be concerned about money. "
  npc_override_payon_in03_fortune_dracula_says_brush_your_44c859: " Dracula says, 'Brush your teeth 3 times a day.' Make sure you brush your teeth! "
  npc_override_payon_in03_fortune_dracula_says_careful_str_33ccec: " Dracula says, 'Be careful in the streets at night.' "
  npc_override_payon_in03_fortune_dracula_says_don_t_too_146064: " Dracula says, 'Don't be too picky.' "
  npc_override_payon_in03_fortune_dracula_says_study_impor_16e9f8: " Dracula says, 'Study the important points first.' Cramming will not work! "
  npc_override_payon_in03_fortune_dracula_says_true_presen_d43f74: " The Dracula says to be true to the present. Indeed, thinking and being true to the present is much more important than trying to figure out your future. "
  npc_override_payon_in03_fortune_dustiness_symbolizes_haz_52a462: " Dustiness symbolizes a hazy future. It is similar to your mind right now. It says it is obvious. "
  npc_override_payon_in03_fortune_dustiness_teeth_very_str_c54fda: " Dustiness teeth are very strong. This means.. "
  npc_override_payon_in03_fortune_dustiness_teeth_very_str_cd2e0b: " Dustiness' teeth are very strong. This means... "
  npc_override_payon_in03_fortune_eat_right_food_right_tim_503f45: " Eat the right food at the right time. That's the only way your body will survive. You can't afford to become like a skeleton. "
  npc_override_payon_in03_fortune_eating_good_wild_dangero_7b6b4a: " Eating is good, but the wild is a dangerous place. Leave your stomach partially empty. "
  npc_override_payon_in03_fortune_eating_happiness_same_go_87170e: " Eating is happiness. Same goes for humans as well. Value food and enjoy eating. "
  npc_override_payon_in03_fortune_effort_into_oneself_puts_a16098: " Effort into oneself puts great power into the mere existence of one. "
  npc_override_payon_in03_fortune_eh_what_kind_friendship_08021d: " Eh!? What kind of friendship is this?! Hurry up and make up! "
