  npc_override_payon_in03_fortune_its_pure_eyes_look_loved_fee9cd: " Its pure eyes look at a loved one but cannot recognize them, the wings flutter towards the loved one, but it helplessly stays in one place, "
  npc_override_payon_in03_fortune_its_youth_gone_after_lif_ae7a5b: " Its youth is gone after a lifetime of chasing after gold. It became a monster with only bones left. No matter how much you like money and your work, look after your life as well. "
  npc_override_payon_in03_fortune_jack_asking_money_don_t_55b5cc: " Jack is asking for money. Don't be stingy about paying those who bring entertainment and fun. "
  npc_override_payon_in03_fortune_jack_jealous_because_spl_6742e5: " Jack is jealous because a splendid person is headed your way in the future. "
  npc_override_payon_in03_fortune_jack_likes_fun_money_he_3c8b91: " Jack likes fun money. He detests sad and burdensome money. "
  npc_override_payon_in03_fortune_jack_makes_money_through_6648b7: " Jack makes money through jokes. Others' happiness is the key to his wealth. "
  npc_override_payon_in03_fortune_jack_says_order_prepare_d5a520: " Jack says, in order to prepare for the future, a delightful preparation is necessary. "
  npc_override_payon_in03_fortune_jack_says_something_inte_548a96: " Jack says something interesting will happen in the future. According to him, the future will be more fun than the present. "
  npc_override_payon_in03_fortune_jack_says_you_may_frustr_c89ceb: " Jack says you may be frustrated in the future. "
  npc_override_payon_in03_fortune_jack_thinks_money_as_foo_8f139e: " Jack thinks of money as a foolish item. But somehow he makes that kind of money. "
  npc_override_payon_in03_fortune_jack_warning_you_about_o_0c2a58: " Jack is warning you about others' anger and that anger takes away happiness and kills a joke. "
  npc_override_payon_in03_fortune_jack_warning_you_lame_jo_847232: " Jack is warning you of lame jokes. When he finds one saying them, he tends to hit them with his stick. "
  npc_override_payon_in03_fortune_joker_enjoys_giving_oppo_8432a3: " Joker enjoys giving opposite warnings. "
  npc_override_payon_in03_fortune_joker_offers_nice_insura_c50688: " Joker offers a nice insurance and says to prepare for the future, but most of it is a waste of time. "
  npc_override_payon_in03_fortune_joker_says_you_let_him_6a45c2: " The Joker says you let him borrow money, he will repay you with more. You're going to refuse, right? But the Joker's temptation does not end after one try. "
  npc_override_payon_in03_fortune_joker_t_use_any_his_ee05cd: " The joker can't use any of his strength because he is tied to a card. Perhaps the person is caught in something and can't show their true merit? "
  npc_override_payon_in03_fortune_joker_trying_trick_you_c_ef9c1c: " The Joker is trying to trick you. This card has all different types of ominous fortunes. "
  npc_override_payon_in03_fortune_jokers_don_t_just_appear_19ff90: " Jokers don't just appear and go away. They come back in the future. "
  npc_override_payon_in03_fortune_jokers_enjoy_giving_oppo_26525a: " Jokers enjoy giving opposite warnings. He says to enjoy sleeping in."
  npc_override_payon_in03_fortune_jokers_enjoy_giving_oppo_a60930: " Jokers enjoy giving opposite warnings. He says to enjoy a midnight snack. "
  npc_override_payon_in03_fortune_jokers_enjoy_giving_oppo_c26ed5: " Jokers enjoy giving opposite warnings. "
  npc_override_payon_in03_fortune_jokers_exist_one_form_th_b04944: " Jokers do not exist in one form. They will aim for your money in several different ways. "
  npc_override_payon_in03_fortune_jokers_like_they_ability_e4560b: " Jokers are like that. They have the ability to turn a small mistake into a big calamity. "
  npc_override_payon_in03_fortune_jokers_sly_just_because_4a5706: " Jokers are sly, but that is just because it is their habit. "
  npc_override_payon_in03_fortune_jokes_fun_too_much_turn_c2c084: " Jokes are fun, but too much will turn you into a ghost like him. "
  npc_override_payon_in03_fortune_just_like_bull_eeb7f7: " Just like a bull. "
  npc_override_payon_in03_fortune_just_like_juice_inside_n_7af3e9: " Just like the juice inside the needles of a cactus, you can still gather wealth though you may be in anguish. You can do it! "
  npc_override_payon_in03_fortune_keep_eye_out_foreign_cur_82fd6a: " Keep an eye out for foreign currency. It will bring you luck. "
  npc_override_payon_in03_fortune_keep_righteous_heart_min_60db06: " Keep a righteous heart and mind. "
  npc_override_payon_in03_fortune_kek_your_mind_goes_blank_bf60e1: " Kek! Your mind goes blank when you think about money! Think of other thoughts! Forget about money for a while! "
  npc_override_payon_in03_fortune_kiss_me_a31909: "Kiss me~~"
  npc_override_payon_in03_fortune_kissy_me_aaeeeb: "Kissy me~"
  npc_override_payon_in03_fortune_knight_commenting_about_74f947: " A knight commenting about a person's future is very rare. "
  npc_override_payon_in03_fortune_knight_horse_fantasy_eve_a4afa7: " A knight on a horse is a fantasy in every person's heart. Make it so that this fantasy becomes real. "
