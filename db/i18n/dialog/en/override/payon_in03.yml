  npc_override_payon_in03_fortune_indeed_sad_love_might_ha_547a7c: " Indeed, it is sad love... it might be hard to overcome. "
  npc_override_payon_in03_fortune_indication_you_prosper_n_ab2a85: " It is an indication that you will prosper! No need to worry now! "
  npc_override_payon_in03_fortune_irresistable_kiss_up_you_b16417: " The irresistable kiss.. It is up to you to decide whether to avoid it or not. "
  npc_override_payon_in03_fortune_isn_t_better_than_curse_bc655f: " But isn't it better than a curse. Just think of it as that and forget about it. "
