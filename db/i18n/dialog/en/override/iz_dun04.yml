  npc_override_iz_dun04_iz_dun_what_brings_you_here_adv_a4f22b: "What brings you here, Adventurer?"
  npc_override_iz_dun04_iz_dun_you_must_beware_kraken_3b580b: "And you must beware of the Kraken!"
  npc_override_iz_dun04_iz_dun_you_re_braver_than_i_bf78eb: "You're braver than I thought."
  npc_override_iz_dun04_iz_dun_you_re_going_b04204: "You're not going?"
  npc_override_iz_dun04_iz_dun_you_think_you_re_up_686e4c: "Do you think you're up to the challenge?"
