Body:
  npc_override_iz_dun04_iz_dun_cautious_good_luck_16e574: "Be cautious and good luck."
  npc_override_iz_dun04_iz_dun_come_back_when_you_re_26a06f: "Come back when you're ready to go."
  npc_override_iz_dun04_iz_dun_halt_4d1bb4: "Halt!"
  npc_override_iz_dun04_iz_dun_if_you_see_kraken_sure_721215: "If you see the Kraken be sure you have your friends to help or do what we do and run."
  npc_override_iz_dun04_iz_dun_menu_release_369d4a: "Release the Kraken!:I'll stay here."
  npc_override_iz_dun04_iz_dun_menu_yes_d739fb: "Yes!:No, I'll stay."
  npc_override_iz_dun04_iz_dun_monsters_here_between_le_a43f43: "The monsters here are between levels 110 and 124."
  npc_override_iz_dun04_iz_dun_s_always_best_prepared_b_7353a2: "It's always best to be prepared before exploring a new area."
  npc_override_iz_dun04_iz_dun_safe_adventurer_2e6d8c: "Be safe, adventurer."
