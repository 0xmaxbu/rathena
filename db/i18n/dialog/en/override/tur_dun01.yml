Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_tur_dun01_flute_as_i_see_you_already_29f61d: "As I can see you already have a Falcon Flute!"
  npc_override_tur_dun01_flute_as_s_now_i_may_bca69b: "As it's for now, I may never have a Falcon."
  npc_override_tur_dun01_flute_bamboo_cut_obtained_kaph_8aaa27: "^4d4dffBamboo Cut can be obtained from Kapha or Karakasa.^000000"
  npc_override_tur_dun01_flute_course_you_ll_need_skill_c8c1a0: "Of course, you'll need the Skill ^ff0000Falcon Mastery^000000."
  npc_override_tur_dun01_flute_currently_i_t_help_you_1949cf: "Currently I can't help you,"
  npc_override_tur_dun01_flute_don_t_worry_my_young_af2c32: "Don't worry, my young friend, once you've purchased the Falcon Flute you won't need to do so again"
  npc_override_tur_dun01_flute_eeehh_you_ranger_9f9ebd: "Eeehh? You are not a Ranger?"
  npc_override_tur_dun01_flute_flute_only_crafted_me_3d2683: "The flute can only be crafted by me."
  npc_override_tur_dun01_flute_ha_ha_ha_aabfe5: "Ha ha ha!"
  npc_override_tur_dun01_flute_hello_young_one_ed4429: "Hello, young one!"
  npc_override_tur_dun01_flute_here_s_new_wolf_flute_b7dece: "Here's the new Wolf Flute."
  npc_override_tur_dun01_flute_here_take_flute_e42280: "Here, take this flute."
  npc_override_tur_dun01_flute_hope_you_ready_use_3dd8d7: "Hope you are ready to use it."
  npc_override_tur_dun01_flute_i_don_t_skill_so_6a9329: "I don't have the Skill, so I don't know how to handle Falcons."
  npc_override_tur_dun01_flute_i_m_sorry_you_don_f40333: "I'm sorry but you don't have enough money to buy a Falcon Flute, please come back when you have more money!"
  npc_override_tur_dun01_flute_i_make_money_since_i_44f0c4: "I have to make money since i also need to eat!"
  npc_override_tur_dun01_flute_i_t_give_you_one_ef331e: "But I can't give you one for free!"
  npc_override_tur_dun01_flute_if_you_need_falcon_flute_971093: "If you need a Falcon Flute I will sell them for 12,500 zeny. Or is that too expensive?"
  npc_override_tur_dun01_flute_if_you_summon_wolf_then_928130: "If you do not summon a wolf, then you don't need the Wolf Flute."
  npc_override_tur_dun01_flute_if_you_want_craft_new_bff6a8: "If you want to craft a new Wolf Flute, I need you to bring me ^4d4dff1 Bamboo Cut and 100,000 zeny.^000000"
  npc_override_tur_dun01_flute_isn_t_beautiful_day_toda_dd295a: "Isn't it a beautiful day today?"
  npc_override_tur_dun01_flute_isn_t_right_2c61c4: "Isn't that right?"
  npc_override_tur_dun01_flute_just_little_matter_me_cr_c83b28: "It is just a little matter for me to craft another flute!!"
  npc_override_tur_dun01_flute_just_reminder_8c9913: "Just a reminder."
  npc_override_tur_dun01_flute_magical_flute_you_call_y_44c2b3: "With a magical Flute, you can call your Falcon from anywhere!"
  npc_override_tur_dun01_flute_menu_don_ac4493: "Don't buy one:Buy a Falcon Flute"
  npc_override_tur_dun01_flute_menu_please_7cba8e: "Please give me a new Wolf Flute.:No."
  npc_override_tur_dun01_flute_new_wolf_flute_d00ce6: "A new Wolf Flute?"
  npc_override_tur_dun01_flute_rangers_however_i_specia_b1b103: "For Rangers, however, I have a special price of 10,000 zeny!"
  npc_override_tur_dun01_flute_s_because_i_no_clue_d48095: "It's because I have no clue how they work."
  npc_override_tur_dun01_flute_s_good_enough_a9083d: "That's good enough."
  npc_override_tur_dun01_flute_s_marvelous_isn_t_ha_d2bbab: "It's marvelous, isn't it? Ha ha ha!"
  npc_override_tur_dun01_flute_s_too_bad_if_you_67f8cc: "That's too bad. If you need one, come back!"
  npc_override_tur_dun01_flute_since_falcon_flute_won_t_ac83c6: "since the Falcon Flute won't disappear upon usage, isn't that great?"
  npc_override_tur_dun01_flute_then_flute_totally_usele_c73146: "Then this flute is totally useless for you!"
  npc_override_tur_dun01_flute_why_don_t_you_return_3b5bd0: "but why don't you return to me when you've become a great Hunter and learned how to handle Falcons properly?"
  npc_override_tur_dun01_flute_why_i_m_selling_these_051b0f: "Why I'm selling these Falcon Flutes?"
  npc_override_tur_dun01_flute_wolf_flute_you_crafted_m_e28134: "The Wolf Flute you have is crafted by myself, with wood."
  npc_override_tur_dun01_flute_wow_all_your_materials_b_e9e21f: "Wow! All your materials are not bad!"
  npc_override_tur_dun01_flute_you_brought_all_material_99d4f6: "Have you brought all the materials?"
  npc_override_tur_dun01_flute_you_come_back_here_find_39a86a: "You can come back here and find me if you lose your Wolf flute!"
  npc_override_tur_dun01_flute_you_come_back_here_find_db5222: "You can come back here and find me if you change your mind."
  npc_override_tur_dun01_flute_you_need_anything_80d6e0: "Do you need anything?"
  npc_override_tur_dun01_flute_you_need_falcon_0fb715: "Do you need a Falcon?"
  npc_override_tur_dun01_flute_you_need_skill_falcon_ma_84f468: "You need the Skill ^ff0000Falcon Mastery^000000 in order to use it!"
  npc_override_tur_dun01_flute_you_whistle_your_falcon_8abb47: "With it you can whistle for your Falcon from anywhere."
