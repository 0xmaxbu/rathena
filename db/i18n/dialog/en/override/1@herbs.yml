Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@herbs_HiddenGarden_absence_master_varmundt_c909f3: "In the absence of master Varmundt for a long time, this security area is subject to the cancellation and closure of research records under the agreement of three Red Peppers."
  npc_override_1@herbs_HiddenGarden_access_any_additional_in_6c99e7: "Access to any additional information beyond this is prohibited at my authority level."
  npc_override_1@herbs_HiddenGarden_adventurer_who_stumbled_51aab6: "An adventurer who stumbled upon this place"
  npc_override_1@herbs_HiddenGarden_aesthetic_sensibility_we_86d1b6: "With the aesthetic sensibility that we don't have, she upgraded the appearance of every automatic doll that managed the mansion to look like herself."
  npc_override_1@herbs_HiddenGarden_after_about_hours_accumu_3d6b56: "After about 300,000 hours, the accumulated knowledge reached the stage of forming a virtual personality."
  npc_override_1@herbs_HiddenGarden_agree_automatic_doll_i_w_610ac3: "Agree with automatic doll [{0}]. I want an immediate project assessment."
  npc_override_1@herbs_HiddenGarden_all_happened_because_kap_e5a7e6: "This all happened because Kappa and Lambda were on different task."
  npc_override_1@herbs_HiddenGarden_all_right_let_s_take_515cba: "All right, let's take a break. Ask me if you have any questions. I'll answer everything I can."
  npc_override_1@herbs_HiddenGarden_alright_17187c: "Alright."
  npc_override_1@herbs_HiddenGarden_although_you_master_varm_b0a24a: "Although you are not Master Varmundt, as someone who has more than 70% similarity to his mana pattern, I would like to ask you to evaluate our duties."
  npc_override_1@herbs_HiddenGarden_among_research_sectors_s_f77e5f: "Among the research sectors, this sector is a place to grow a plant called Turnip under the orders of Varmundt."
  npc_override_1@herbs_HiddenGarden_anyway_s_important_autom_c4e0e4: "Anyway, it's important that the automatic dolls here reacted to you."
  npc_override_1@herbs_HiddenGarden_appears_hologram_automat_ad7e8d: "It appears to be a hologram of an automatic doll. You can see a strange glass on the middle panel with the word ^0000FF[Enter the pattern on the touch screen]^000000 and other several buttons."
  npc_override_1@herbs_HiddenGarden_as_data_accumulates_up_o_149381: "As data accumulates up over time, the simple electronic signal developed into what you humans often call intelligence."
  npc_override_1@herbs_HiddenGarden_as_expected_he_doing_som_ba74af: "As expected, he was doing something important..."
  npc_override_1@herbs_HiddenGarden_as_there_no_orders_maste_1955fd: "As there was no orders from the master, Pimp started looking for a place where research could be useful."
  npc_override_1@herbs_HiddenGarden_automatic_doll_carota_co_e8072a: "Automatic doll CAROTA-88 control panel opened. Waiting for input..."
  npc_override_1@herbs_HiddenGarden_automatic_doll_entering_9bb648: "Automatic doll entering control mode to eradicate underground moles. Goodbye."
  npc_override_1@herbs_HiddenGarden_automatic_dolls_classifi_ce9aa6: "Automatic dolls are classified according to their usage."
  npc_override_1@herbs_HiddenGarden_automatic_dolls_maintain_b1234a: "The automatic dolls maintain the flower garden and perform their given duties individually."
  npc_override_1@herbs_HiddenGarden_because_water_garden_are_695e17: "Because this is a water garden, the area is surrounded by water."
  npc_override_1@herbs_HiddenGarden_better_show_you_personal_4230a9: "It will be better to show you that personally."
  npc_override_1@herbs_HiddenGarden_biological_wavelength_vo_cdf7e3: "The biological wavelength of this voice..."
  npc_override_1@herbs_HiddenGarden_cancel_ebda43: "Cancel."
  npc_override_1@herbs_HiddenGarden_carota_data_storage_capa_0a10ce: "CAROTA-88 data storage capacity. Language expansion pack burden. If not important, I will return to original work."
  npc_override_1@herbs_HiddenGarden_carota_don_t_you_want_dfb6a9: "CAROTA-88. Don't you want a project evaluation? If we miss this administrator now, we don't know when we can get another project evaluation."
  npc_override_1@herbs_HiddenGarden_carota_more_than_million_d8686b: "CAROTA-88 More than a million hours since last research evaluation. Failed to save more logs."
  npc_override_1@herbs_HiddenGarden_carota_please_return_you_1df65e: "CAROTA-88. Please return to your original location as soon as possible. Don't forget that I can use force when needed."
  npc_override_1@herbs_HiddenGarden_carota_received_confirma_cddac6: "CAROTA-88 received confirmation from administrator that Varmundt instructions were performed perfectly."
  npc_override_1@herbs_HiddenGarden_carota_shows_non_logical_1aeb8a: "CAROTA-88 shows a non-logical response to this evaluation. We will arrange for an inspection soon."
  npc_override_1@herbs_HiddenGarden_changing_non_water_garde_90428c: "Changing to a non-water garden can not be accepted, as it is an area beyond Varmundt's taste."
  npc_override_1@herbs_HiddenGarden_children_affected_lambda_33b5f8: "Children affected by Lambda's memories tend to be warlike towards outsiders. They trust no one but Master Varmundt."
  npc_override_1@herbs_HiddenGarden_children_created_time_ch_25aa21: "The children created from this time are the children outside the garden you saw."
  npc_override_1@herbs_HiddenGarden_classified_as_security_z_c797f1: "It is classified as a security zone to those who have enough authority."
  npc_override_1@herbs_HiddenGarden_code_name_automatic_doll_481a55: "The code name of the automatic doll BMD000001 is [{0}]."
  npc_override_1@herbs_HiddenGarden_combat_mode_0bca7f: "---- Combat Mode ----"
  npc_override_1@herbs_HiddenGarden_course_you_know_master_v_b2078b: "Of course. You know the master Varmundt well. [{0}]."
  npc_override_1@herbs_HiddenGarden_current_annual_output_ab_0d1efe: "The current annual output is about three tons. For long-term preservation, it's being stored in warehouses in 2~6 form of dried food ."
  npc_override_1@herbs_HiddenGarden_current_situation_isn_t_a98dff: "The current situation isn't good, I think it's better for you to go back..."
  npc_override_1@herbs_HiddenGarden_currently_human_administ_8229d8: "Currently, a human administrator is present here. I recommend changing the language code to the official language of humans."
  npc_override_1@herbs_HiddenGarden_currently_master_varmund_58d729: "Currently, Master Varmundt has been away for over 1 million hours."
  npc_override_1@herbs_HiddenGarden_did_you_decide_all_those_239f37: "Did you decide all those methods?"
  npc_override_1@herbs_HiddenGarden_did_you_make_automatons_e12b64: "Did you make the automatons outside?"
  npc_override_1@herbs_HiddenGarden_didn_t_automatons_garden_ce81d7: "Didn't the automatons from the garden ask you to evaluate the mission?"
  npc_override_1@herbs_HiddenGarden_dried_pumpkins_warehouse_4a1ee4: "The dried pumpkins in the warehouses are preserve food for the adventurers and are sold around the continent. Sales becomes money source."
  npc_override_1@herbs_HiddenGarden_entering_standby_mode_4efb9b: "Entering standby mode."
  npc_override_1@herbs_HiddenGarden_entity_heavily_influence_bdf605: "An entity heavily influenced by Kappa's intellect, who focuses on managing the mansion's running funds, is very calculating and obsessed with making money."
  npc_override_1@herbs_HiddenGarden_error_0b99ce: "^FF0000ERROR^000000"
  npc_override_1@herbs_HiddenGarden_evaluate_carota_s_work_d_09d02d: "^0000AAEvaluate CAROTA-88's work to date.^000000"
  npc_override_1@herbs_HiddenGarden_evaluation_received_672979: "Evaluation received..."
  npc_override_1@herbs_HiddenGarden_existing_work_routine_re_7d36ea: "Existing work routine will be repeated until further orders are issued."
  npc_override_1@herbs_HiddenGarden_facial_biometrics_compar_a53273: "Facial biometrics. Comparing to list of administrators registered in database."
  npc_override_1@herbs_HiddenGarden_first_place_most_automat_73cacd: "In the first place, most of the automatons in this security area have never seen Master Varmundt before."
  npc_override_1@herbs_HiddenGarden_first_select_code_name_u_7d6c03: "First select a code name that will be used to control this automatic doll. Some of the names that were preferred in the past are randomly selected."
  npc_override_1@herbs_HiddenGarden_first_time_since_i_creat_9acada: "This is the first time since I was created. That an exception has occurred, we will modify some of the procedures in regards to that."
  npc_override_1@herbs_HiddenGarden_flower_garden_border_bet_db69b8: "The flower garden is the border between the security area and the general area."
  npc_override_1@herbs_HiddenGarden_flower_garden_divided_in_9af2f5: "The flower garden is divided into several research sectors and each sector has a different subject as a project."
  npc_override_1@herbs_HiddenGarden_garden_security_area_2725cd: "Is the garden a security area?"
  npc_override_1@herbs_HiddenGarden_get_out_here_6eefc0: "Get out of here!"
  npc_override_1@herbs_HiddenGarden_hasn_t_been_long_time_6e411d: "Hasn't it been a long time since CAROTA-88 was last evaluated?"
  npc_override_1@herbs_HiddenGarden_haven_t_you_updated_your_90759f: "Haven't you updated your language pack yet? Regular updates are not mandatory, but its essential."
  npc_override_1@herbs_HiddenGarden_hold_7218e2: "Hold on."
  npc_override_1@herbs_HiddenGarden_hold_me_tight_i_ll_f02d28: "Hold me tight. I'll warp you out."
  npc_override_1@herbs_HiddenGarden_hologram_faded_a19a13: "The hologram faded."
  npc_override_1@herbs_HiddenGarden_how_long_been_since_i_c1d123: "How long has it been since I got the orders of Varmundt?!"
  npc_override_1@herbs_HiddenGarden_how_they_tend_so_i_0de16d: "This is how they tend to be, so I'd like you to refer to them before you meet them."
  npc_override_1@herbs_HiddenGarden_how_your_research_pumpki_cf1fb1: "How is your research on Pumpkin farming?"
  npc_override_1@herbs_HiddenGarden_however_considering_temp_5620bb: "However, considering the temporary administrator's insufficient ability, I will support the space leap services."
  npc_override_1@herbs_HiddenGarden_however_purpose_research_9b4cf6: "However, the purpose of the research is not available to us dolls, we have to decide on our own what to do with it in the future."
  npc_override_1@herbs_HiddenGarden_however_she_recognizes_s_0f63b6: "However, she recognizes that this security area was created according to Varmundt's personal taste."
  npc_override_1@herbs_HiddenGarden_however_since_there_auto_9380cf: "However, since there are 3 automatic dolls managing, I can tell that this place has an important purpose."
  npc_override_1@herbs_HiddenGarden_i_actively_increase_port_0f5a46: "I will actively increase the portion of experiments on improved product seeds that were to be discarded."
  npc_override_1@herbs_HiddenGarden_i_am_one_holographic_dev_dffa23: "I am one of the holographic device type AI that is designed to learn Varmundt's personality."
  npc_override_1@herbs_HiddenGarden_i_asked_varmundt_what_se_74f1d5: "I asked Varmundt what to do several times, but there was no answer."
  npc_override_1@herbs_HiddenGarden_i_brought_some_old_items_1e503a: "I brought some old items from the past. It might help you, so take it."
  npc_override_1@herbs_HiddenGarden_i_d_like_request_you_253998: "[{0}], I'd like to request for you to continue the on-site inspection for the remaining sections."
  npc_override_1@herbs_HiddenGarden_i_don_t_know_what_8b2bda: "I don't know what this place is for because it's not accessible to my authority level."
  npc_override_1@herbs_HiddenGarden_i_don_t_really_remember_e89125: "I don't really remember."
  npc_override_1@herbs_HiddenGarden_i_even_speculated_varmun_7fcb48: "I even speculated that Varmundt might have return here after hundreds of years in disguise."
  npc_override_1@herbs_HiddenGarden_i_had_opportunity_meet_v_adbcfc: "I had the opportunity to meet Varmundt before."
  npc_override_1@herbs_HiddenGarden_i_help_you_anything_402ac4: "Can I help you with anything?"
  npc_override_1@herbs_HiddenGarden_i_judged_valued_highly_v_c7c6c4: "I judged it to be a valued highly for various organisms. It's been continously produced, processed, and stored."
  npc_override_1@herbs_HiddenGarden_i_ll_look_around_more_4a81ee: "I'll look around more."
  npc_override_1@herbs_HiddenGarden_i_ll_move_basement_stora_ba96af: "I'll move to the basement storage to check for new breeds."
  npc_override_1@herbs_HiddenGarden_i_ll_show_you_way_87b90c: "I'll show you the way out. What will you do?"
  npc_override_1@herbs_HiddenGarden_i_ll_stop_guide_automati_827ea6: "I'll stop the guide. Automatic dolls and objects that has not been inspected and evaluated by the Automatic Doll [{0}] are not allowed to go outside."
  npc_override_1@herbs_HiddenGarden_i_ll_take_you_security_d0082b: "I'll take you to the security area."
  npc_override_1@herbs_HiddenGarden_i_ll_wait_until_further_ef7c0f: "I'll wait until further instructions are given."
  npc_override_1@herbs_HiddenGarden_i_m_automatic_doll_desig_6a8eee: "I'm an automatic doll that was designed to work only if your mana synchronizes with Varmundt's mana over a certain level."
  npc_override_1@herbs_HiddenGarden_i_m_finished_my_guide_cd4dbf: "I'm not finished with my guide. Is it okay if I return like this?"
  npc_override_1@herbs_HiddenGarden_i_m_surprised_you_decide_01a4fe: "I'm surprised you decided that far on your own."
  npc_override_1@herbs_HiddenGarden_i_m_temporary_administra_bb674d: "I'm a temporary administrator? Why should I?"
  npc_override_1@herbs_HiddenGarden_i_made_decision_i_ve_3ebf7f: "I made a decision? I've never had such inference."
  npc_override_1@herbs_HiddenGarden_i_ve_delivered_informati_e0c4d6: "I've delivered the information to the Manager ^0000CDSigma^000000, because the results were unexpected. The temporary administrator's combat capability is not of an average human."
  npc_override_1@herbs_HiddenGarden_i_ve_never_asked_them_84c9d4: "I've never asked them to farm. We just threw things away and watched how AI reacted."
  npc_override_1@herbs_HiddenGarden_i_wait_until_you_give_8d99af: "I will wait until you give me your permission."
  npc_override_1@herbs_HiddenGarden_i_wish_i_could_show_b474dd: "I wish I could show Varmundt the process of self-learning automatic doll that can be left unattended without instructions..."
  npc_override_1@herbs_HiddenGarden_if_you_re_administrator_a9e97c: "If you're an administrator who lost authority, you can get the authority reissued through an authentication procedure."
  npc_override_1@herbs_HiddenGarden_lambda_she_developed_int_6c3b9f: "Lambda. She developed intellectually and began to perceive herself as a woman."
  npc_override_1@herbs_HiddenGarden_learning_more_breeding_m_124c25: "Learning more breeding method."
  npc_override_1@herbs_HiddenGarden_leave_alone_3f3bb3: "Leave it alone"
  npc_override_1@herbs_HiddenGarden_let_me_introduce_automat_8dafba: "Let me introduce the automatic doll model CAROTA-88."
  npc_override_1@herbs_HiddenGarden_let_s_avoid_place_today_770ce5: "Let's avoid this place today and make a promise next time to come again. Next time you'll be free to go to another area."
  npc_override_1@herbs_HiddenGarden_let_s_move_0f39e0: "Let's move on."
  npc_override_1@herbs_HiddenGarden_let_s_move_next_section_36fd0a: "Let's move on to the next section."
  npc_override_1@herbs_HiddenGarden_let_s_move_warp_point_3c9a53: "Let's move to the warp point. Please stay near me."
  npc_override_1@herbs_HiddenGarden_let_s_touch_moment_talk_b15370: "Let's touch this for a moment and talk. I need to be fussed a little..."
  npc_override_1@herbs_HiddenGarden_looks_like_automatic_dol_7a9bb6: "It looks like the automatic dolls are back. I don't think it's friendly to the administrator."
  npc_override_1@herbs_HiddenGarden_made_food_f4428f: "Is it made of food?"
  npc_override_1@herbs_HiddenGarden_maintenance_mansion_cost_03f219: "The maintenance of this mansion costs money. It costs a lot!"
  npc_override_1@herbs_HiddenGarden_mana_similarity_varmundt_46c916: "[{0}] has a 73.6% mana similarity to that of Varmundt. Who exactly are you [{1}]?"
  npc_override_1@herbs_HiddenGarden_management_automatic_dol_a9fe15: "Management automatic doll irreasonable!! Very!! Forced recall during pursuit of 5 moles!!! The Turnips is ruined!!!"
  npc_override_1@herbs_HiddenGarden_master_varmundt_detected_0d8f84: "Master Varmundt is not detected within the network."
  npc_override_1@herbs_HiddenGarden_master_varmundt_gave_eac_aee311: "Master Varmundt gave each of the automatic dolls a research project."
  npc_override_1@herbs_HiddenGarden_master_varmundt_no_furth_697207: "Master Varmundt. No further instructions after entering Turnip's biological data . This automatic doll unattended."
  npc_override_1@herbs_HiddenGarden_master_varmundt_valued_h_a1c65f: "Master Varmundt valued her emotional aesthetic so highly that he gave her the task to manage the mansion, not the research facility here."
  npc_override_1@herbs_HiddenGarden_memories_they_master_var_0b5760: "The memories they have of Master Varmundt are fabricated from my memories of my time as his assistant."
  npc_override_1@herbs_HiddenGarden_menu_kappa_89c400: "Kappa : But I don't think you're not strong enough to meet Lambda yet, so I'll show you to my room."
  npc_override_1@herbs_HiddenGarden_menu_kappa_ef9258: "Kappa : Well, you're just as strong as Lambda said. [{0}]"
  npc_override_1@herbs_HiddenGarden_menu_lambda_0d018a: "Lambda : But. Before I meet you, I need to test you one last time."
  npc_override_1@herbs_HiddenGarden_menu_lambda_0f0fbe: "Lambda : Just in time, I want to get a confirmation from you."
  npc_override_1@herbs_HiddenGarden_menu_lambda_2a102c: "Lambda : We need to use you to 'evaluate' our security system."
  npc_override_1@herbs_HiddenGarden_menu_lambda_32b7b7: "Lambda : Then, let us move on."
  npc_override_1@herbs_HiddenGarden_menu_lambda_38dbc8: "Lambda : I'll take you to my room."
  npc_override_1@herbs_HiddenGarden_menu_lambda_40f886: "Lambda : I know for sure that our security is not very good."
  npc_override_1@herbs_HiddenGarden_menu_lambda_48c60a: "Lambda : Great. If you're this strong, you're worth talking to."
  npc_override_1@herbs_HiddenGarden_menu_lambda_4963d8: "Lambda : [{0}], and your party may have really met Varmundt before."
  npc_override_1@herbs_HiddenGarden_menu_lambda_51ff57: "Lambda : [{0}], I want you to [check] the next area as well."
  npc_override_1@herbs_HiddenGarden_menu_lambda_7024e2: "Lambda : It's been a while since an outsider came into this security area, so I'd better say what the other automatic dolls told me."
  npc_override_1@herbs_HiddenGarden_menu_lambda_a0b6ea: "Lambda : Your movements helped me a lot. [{0}]"
  npc_override_1@herbs_HiddenGarden_menu_lambda_baf3bf: "Lambda : It's up to me to decide whether those outsiders go back or not."
  npc_override_1@herbs_HiddenGarden_menu_lambda_e124a0: "Lambda : Sigma might be correct."
  npc_override_1@herbs_HiddenGarden_menu_lambda_fc63a3: "Lambda : You've created a fatal threat to the security in this area. I will dispose of it in accordance with the automatic doll management policy."
  npc_override_1@herbs_HiddenGarden_menu_options_14e62d: "??? : It's not enough to have outsiders in the garden, but to even leak information. I can't overlook it."
  npc_override_1@herbs_HiddenGarden_menu_options_1ee920: "??? : You're a good talker, Sigma. Do you want to be initialized right now?"
  npc_override_1@herbs_HiddenGarden_menu_options_4f2c08: "??? : Unauthorized outsider intrusion detection. Code Category 063. Entering the identification process."
  npc_override_1@herbs_HiddenGarden_menu_options_677391: "??? : Will you escort him to the secure area? BMD000001. No, I mean automatic doll, [{0}]."
  npc_override_1@herbs_HiddenGarden_menu_options_a8c8ec: "??? : The automatic dolls' response to you is very fresh. Strange visitor."
  npc_override_1@herbs_HiddenGarden_menu_options_b47230: "??? : With the authority of the Red Pepper, we will warp the whole research area. I'll take responsibility after that."
  npc_override_1@herbs_HiddenGarden_menu_sigma_a9b85d: "Sigma : I have activated the warp to my location. Come over here."
  npc_override_1@herbs_HiddenGarden_menu_system_6a0dd1: "SYSTEM : A default energy shield value has been recovered."
  npc_override_1@herbs_HiddenGarden_menu_system_86a384: "SYSTEM : The manager has summoned Guardian Parts and will recover them as materials for it's energy shield."
  npc_override_1@herbs_HiddenGarden_menu_system_8e7b28: "SYSTEM : The damage to the Guardian Parts has weakened the energy shield."
  npc_override_1@herbs_HiddenGarden_menu_system_ebca6c: "SYSTEM : All the Guardian Parts have been destroyed. No energy shield has been recovered."
  npc_override_1@herbs_HiddenGarden_money_protect_mansion_pi_f57d8e: "Money can protect the mansion. Pimp will protect this place! That's I'm working hard to raise pumpkins!"
  npc_override_1@herbs_HiddenGarden_msg_61ce5a: "[{0}]"
  npc_override_1@herbs_HiddenGarden_msg_93fcbf: "......"
  npc_override_1@herbs_HiddenGarden_my_work_witness_birth_ev_a8ad1b: "My work is to witness the birth and evolution of life! My research is not easy by any means!"
  npc_override_1@herbs_HiddenGarden_nevertheless_you_defeat_b27914: "Nevertheless, you have to defeat me and obtain administrative authority, if you want to prevent the closure of the research area."
  npc_override_1@herbs_HiddenGarden_no_further_indications_h_1f0a4c: "No further indications for 5076 hours. This automatic doll's AI collects network information about turnips."
  npc_override_1@herbs_HiddenGarden_no_match_8e31d2: "---- No match ----"
  npc_override_1@herbs_HiddenGarden_now_i_m_going_back_bd7338: "Now I'm going back to my original self. It's easier to maintain the original form."
  npc_override_1@herbs_HiddenGarden_now_let_s_get_down_33b694: "Now, let's get down to business. I need your help."
  npc_override_1@herbs_HiddenGarden_objective_evaluation_red_81e309: "Objective evaluation reduces the working errors of the automatic dolls that manage this place and helps them perform their duties close to perfection."
  npc_override_1@herbs_HiddenGarden_obtaining_information_ed_8b8ba0: "Obtaining information of edible plants. Finding ancient record of turnip cultivation."
  npc_override_1@herbs_HiddenGarden_occasionally_some_them_r_d7183f: "Occasionally some of them were remodeled into peculiar shapes for functional testing purposes."
  npc_override_1@herbs_HiddenGarden_oh_90b83d: "Oh."
  npc_override_1@herbs_HiddenGarden_oh_early_form_called_red_8fc8f6: "Oh. This is an early form that was called Red Pepper by Varmundt. I'm optimized for auxiliary work."
  npc_override_1@herbs_HiddenGarden_oh_i_ll_record_subsequen_758ec2: "Oh, I'll record the subsequent information for the next guide. You can go back at ease."
  npc_override_1@herbs_HiddenGarden_oh_s_possible_he_might_aedeca: "Oh, that's possible. He might have made you forget what you saw..."
  npc_override_1@herbs_HiddenGarden_oh_s_true_master_varmund_1ccdae: "Oh, it's true that Master Varmundt made the prototypes of the automatons. But they were just like me, with simple functions."
  npc_override_1@herbs_HiddenGarden_oh_she_must_been_observi_595a0c: "Oh... she must have been observing you too."
  npc_override_1@herbs_HiddenGarden_okay_i_follow_instructio_78d0f2: "Okay. I will follow the instructions."
  npc_override_1@herbs_HiddenGarden_okay_now_i_set_as_d07711: "Okay. From now on, I will set [{0}] as our temporary administrator and take action accordingly. Do you agree?"
  npc_override_1@herbs_HiddenGarden_once_they_find_out_varmu_caeb75: "But once they find out Varmundt is alive, they won't be able to shut this place down."
  npc_override_1@herbs_HiddenGarden_one_charge_place_pimp_au_5bdd90: "The one in charge of this place is pimp25. An automatic doll modeled after a create from this world."
  npc_override_1@herbs_HiddenGarden_one_day_he_gave_us_684cae: "And one day he gave us orders."
  npc_override_1@herbs_HiddenGarden_only_ones_who_started_fa_1d5ce8: "Only the ones who started farming stood out in the garden."
