Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@herbs_HiddenGarden_adventurer_who_stumbled_51aab6: "An adventurer who stumbled upon this place"
  npc_override_1@herbs_HiddenGarden_alright_17187c: "Alright."
  npc_override_1@herbs_HiddenGarden_appears_hologram_automat_ad7e8d: "It appears to be a hologram of an automatic doll. You can see a strange glass on the middle panel with the word ^0000FF[Enter the pattern on the touch screen]^000000 and other several buttons."
  npc_override_1@herbs_HiddenGarden_automatic_dolls_classifi_ce9aa6: "Automatic dolls are classified according to their usage."
  npc_override_1@herbs_HiddenGarden_cancel_ebda43: "Cancel."
  npc_override_1@herbs_HiddenGarden_did_you_decide_all_those_239f37: "Did you decide all those methods?"
  npc_override_1@herbs_HiddenGarden_did_you_make_automatons_e12b64: "Did you make the automatons outside?"
  npc_override_1@herbs_HiddenGarden_entering_standby_mode_4efb9b: "Entering standby mode."
  npc_override_1@herbs_HiddenGarden_error_0b99ce: "^FF0000ERROR^000000"
  npc_override_1@herbs_HiddenGarden_evaluate_carota_s_work_d_09d02d: "^0000AAEvaluate CAROTA-88's work to date.^000000"
  npc_override_1@herbs_HiddenGarden_garden_security_area_2725cd: "Is the garden a security area?"
  npc_override_1@herbs_HiddenGarden_hold_7218e2: "Hold on."
  npc_override_1@herbs_HiddenGarden_hold_me_tight_i_ll_f02d28: "Hold me tight. I'll warp you out."
  npc_override_1@herbs_HiddenGarden_hologram_faded_a19a13: "The hologram faded."
  npc_override_1@herbs_HiddenGarden_how_your_research_pumpki_cf1fb1: "How is your research on Pumpkin farming?"
  npc_override_1@herbs_HiddenGarden_i_brought_some_old_items_1e503a: "I brought some old items from the past. It might help you, so take it."
  npc_override_1@herbs_HiddenGarden_i_don_t_really_remember_e89125: "I don't really remember."
  npc_override_1@herbs_HiddenGarden_i_had_opportunity_meet_v_adbcfc: "I had the opportunity to meet Varmundt before."
  npc_override_1@herbs_HiddenGarden_i_help_you_anything_402ac4: "Can I help you with anything?"
  npc_override_1@herbs_HiddenGarden_i_ll_look_around_more_4a81ee: "I'll look around more."
  npc_override_1@herbs_HiddenGarden_i_ll_show_you_way_87b90c: "I'll show you the way out. What will you do?"
  npc_override_1@herbs_HiddenGarden_i_ll_wait_until_further_ef7c0f: "I'll wait until further instructions are given."
  npc_override_1@herbs_HiddenGarden_i_m_surprised_you_decide_01a4fe: "I'm surprised you decided that far on your own."
  npc_override_1@herbs_HiddenGarden_i_m_temporary_administra_bb674d: "I'm a temporary administrator? Why should I?"
  npc_override_1@herbs_HiddenGarden_i_ve_delivered_informati_e0c4d6: "I've delivered the information to the Manager ^0000CDSigma^000000, because the results were unexpected. The temporary administrator's combat capability is not of an average human."
  npc_override_1@herbs_HiddenGarden_if_you_re_administrator_a9e97c: "If you're an administrator who lost authority, you can get the authority reissued through an authentication procedure."
  npc_override_1@herbs_HiddenGarden_lambda_she_developed_int_6c3b9f: "Lambda. She developed intellectually and began to perceive herself as a woman."
  npc_override_1@herbs_HiddenGarden_leave_alone_3f3bb3: "Leave it alone"
  npc_override_1@herbs_HiddenGarden_let_s_avoid_place_today_770ce5: "Let's avoid this place today and make a promise next time to come again. Next time you'll be free to go to another area."
  npc_override_1@herbs_HiddenGarden_made_food_f4428f: "Is it made of food?"
  npc_override_1@herbs_HiddenGarden_msg_61ce5a: "[{0}]"
  npc_override_1@herbs_HiddenGarden_oh_90b83d: "Oh."
  npc_override_1@herbs_HiddenGarden_only_party_leader_start_306d85: "Only the party leader can start the identity verification. Let's leave it up to person in charge."
  npc_override_1@herbs_HiddenGarden_pattern_match_1af414: "^FF0000Pattern does not match.^000000"
  npc_override_1@herbs_HiddenGarden_pattern_recognized_226121: "^0000FFPattern recognized.^000000"
  npc_override_1@herbs_HiddenGarden_please_evaluate_landscap_da24ac: "Please evaluate the landscape, water quality, and other overall layout of the garden."
  npc_override_1@herbs_HiddenGarden_please_rest_your_body_da_c5d39d: "Please rest your body for a day as Sigma ordered."
  npc_override_1@herbs_HiddenGarden_product_full_good_shape_c90338: "The product is full and good shape."
  npc_override_1@herbs_HiddenGarden_quit_stand_back_f2bae1: "Quit and Stand Back."
  npc_override_1@herbs_HiddenGarden_report_your_work_details_5e6a26: "Report your work details."
  npc_override_1@herbs_HiddenGarden_requested_evaluation_26039a: "Have requested an evaluation."
  npc_override_1@herbs_HiddenGarden_reservation_instance_fai_f7a70c: "The reservation of the instance '{0}' has failed due to an active instance."
  npc_override_1@herbs_HiddenGarden_running_sleep_mode_relea_b35580: "Running the sleep mode release protocol. Pattern input by ^0000CD{0}^000000 has been recognized."
  npc_override_1@herbs_HiddenGarden_s_big_problem_she_s_d91523: "It's a big problem, she's about to make a leap here."
  npc_override_1@herbs_HiddenGarden_s_one_three_most_privile_641119: "It's one of the three most privileged control systems in this mansion."
  npc_override_1@herbs_HiddenGarden_section_managed_three_au_9a2a1d: "This section is managed by three automatic dolls. Shall we continue with the guide?"
  npc_override_1@herbs_HiddenGarden_since_they_recover_after_5f1428: "Since they will recover after some time, I think you will need to continue fighting them until Master Varmundt returns."
  npc_override_1@herbs_HiddenGarden_stand_back_366640: "Stand back."
  npc_override_1@herbs_HiddenGarden_take_recognition_code_co_bb76c6: "Take this. A recognition code that could lead to other areas of this secret garden."
  npc_override_1@herbs_HiddenGarden_then_who_you_90f121: "Then, who are you?"
  npc_override_1@herbs_HiddenGarden_there_s_approximately_ch_993d14: "There's an approximately 82% chance you'll lose your life in her radical suppression before we let her know that Master Varmundt is alive."
  npc_override_1@herbs_HiddenGarden_there_someone_who_decide_7bc81c: "Is there someone who decided for your research?"
  npc_override_1@herbs_HiddenGarden_unit_attacked_initial_ve_6015a3: "The unit that attacked [{0}] is the initial version of Class 4 combat-type automatic dolls. It's combat strength is equivalent to 20 adult humans."
  npc_override_1@herbs_HiddenGarden_unregistered_guest_been_ce9ff3: "An unregistered guest has been detected."
  npc_override_1@herbs_HiddenGarden_varmundt_why_you_here_9df6b7: "Varmundt? Why are you here?"
  npc_override_1@herbs_HiddenGarden_wait_sec_267d13: "^008800Wait a sec!!"
  npc_override_1@herbs_HiddenGarden_what_difference_make_66f26d: "What difference would it make?"
  npc_override_1@herbs_HiddenGarden_what_s_difference_betwee_a33502: "What's the difference between your tasks?"
  npc_override_1@herbs_HiddenGarden_who_0d59a8: "Who was that?"
  npc_override_1@herbs_HiddenGarden_who_s_3a5109: "Who's that??"
  npc_override_1@herbs_HiddenGarden_why_flower_garden_exist_305489: "Why does the flower garden exist?"
  npc_override_1@herbs_HiddenGarden_wise_choice_caf5f5: "A wise choice."
  npc_override_1@herbs_HiddenGarden_you_cannot_proceed_next_0c974f: "You cannot proceed to the next step, if you do not have the authority of the party leader."
  npc_override_1@herbs_HiddenGarden_you_cannot_receive_any_m_5017ef: "You cannot receive any more items because you're carrying too many items. Please try again after you lighten up.^000000"
  npc_override_1@herbs_HiddenGarden_you_did_great_making_the_3d6ada: "You did great making them surrender, but I don't think you were granted any administrator rights."
  npc_override_1@herbs_HiddenGarden_you_found_874a38: "Have you found it?"
  npc_override_1@herbs_HiddenGarden_you_just_entered_securit_ea6bb3: "You just entered the security area."
  npc_override_1@herbs_HiddenGarden_you_only_move_place_when_01b4e9: "You can only move to the place when the party manager has completed all permits. Please re-check your issued access area."
  npc_override_1@herbs_HiddenGarden_your_identity_been_ident_125367: "Your identity been identified. You may enter the security area. How may I help you?"
