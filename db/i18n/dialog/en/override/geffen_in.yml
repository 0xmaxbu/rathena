  npc_override_geffen_in_geffen_there_some_new_fashions_a6fc6d: "There are some new fashions floating around the Rune-Midgarts Kingdom!"
  npc_override_geffen_in_geffen_they_re_hard_working_peo_8d44e2: "But they're hard working people. Also, the ores they refine and the weapons they create are high in demand."
  npc_override_geffen_in_geffen_they_ve_plagued_humans_l_db3432: "They've plagued humans for a long time, but were completely annihilated in a great war between mankind and the monsters."
  npc_override_geffen_in_geffen_those_kinds_concepts_mig_70a6bf: "Those kinds of concepts might be too high brow for a rookie like you."
