  npc_override_geffen_in_geffen_well_i_wouldn_t_know_aabbda: "Well, I wouldn't know. I've been studying too hard to become a Mage. I've been staying up all night, agonizing over anything that's magical."
  npc_override_geffen_in_geffen_well_juno_monster_museum_c4e226: "Well, the Juno Monster Museum is now open to the public. They have a fascinating exhibit and various monsters are now on display!"
  npc_override_geffen_in_geffen_well_well_well_aren_t_a7497e: "Well, well, well. Aren't you a pretty girl. Today just happens to be your lucky day!"
  npc_override_geffen_in_geffen_well_you_need_money_live_23571e: "Well, you need money to live, but having money alone isn't living. Don't forget that there are other important things. And try not to stress out, okay?"
