  npc_override_geffen_in_geffen_well_7b1901: "Well..."
  npc_override_geffen_in_geffen_well_any_case_concentrat_63ac47: "Well, in any case, concentrating on your studies is tough, but it can be rewarding. I hope you do well in whatever you choose to do~"
  npc_override_geffen_in_geffen_well_as_you_may_already_56baff: "Well, as you may already know, since Wizards and Mages train in Geffen, monsters tend to stay away from the city. So tired adventurers are welcome to rest here."
  npc_override_geffen_in_geffen_well_i_guess_you_thank_bca9a1: "Well, I guess you can thank the Blacksmiths for the economy here in Geffen. Sure, they always dirty, sweaty, smelly and talk kind of rudely..."
  npc_override_geffen_in_geffen_well_i_hope_i_settled_e722d7: "Well, I hope I settled any doubts you've had about the future. That is, after all, my job as a professional psychic consultant. Come back anytime~"
