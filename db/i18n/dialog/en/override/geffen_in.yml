  npc_override_geffen_in_geffen_taking_our_jobs_censorin_3a714b: "Taking our jobs, censoring the media, ruining our education system, causing air pollution, starting wars, making rap music..."
  npc_override_geffen_in_geffen_tell_me_about_eb61e0: "Tell me about it."
  npc_override_geffen_in_geffen_tend_you_know_6d91cc: "tend to be, you know..."
  npc_override_geffen_in_geffen_thanks_number_internet_w_ee8bdc: "Thanks to the number of internet web journals, this brain becomes peaceful, and decides not to take over the world as it originally planned."
  npc_override_geffen_in_geffen_them_time_dfea5c: "them at a time."
  npc_override_geffen_in_geffen_there_item_protect_caste_5622b4: "But there is an item that can protect the caster from ill consequence, allowing the safe use of certain magics. These are the shining, mystical stones known as Gemstones."
  npc_override_geffen_in_geffen_there_s_magic_school_nor_19f5c7: "There's a Magic School in the NorthWest part of the city for Novices interested in becoming Mages. There, they can learn the basics of magic."
  npc_override_geffen_in_geffen_there_s_no_way_you_4866f2: "There's no way you can pass this up! Now, how many do you want?"
