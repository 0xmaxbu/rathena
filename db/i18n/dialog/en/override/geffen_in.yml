Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_geffen_in_geffen_a_511348: "A..."
  npc_override_geffen_in_geffen_actually_i_m_wizard_d0fb68: "Actually, I'm a Wizard."
  npc_override_geffen_in_geffen_actually_sir_i_m_sage_293ca1: "Actually, sir, I'm a Sage."
  npc_override_geffen_in_geffen_adventurer_bf45b3: "an adventurer?"
  npc_override_geffen_in_geffen_adventurers_pay_blacksmi_ba1e0b: "Adventurers pay Blacksmiths lots of their hard earned zeny for the high quality weapons that only they can create."
  npc_override_geffen_in_geffen_after_becoming_well_expe_c5ae1b: "After becoming well experienced in the use of magic, Mages can become qualified to become Wizards."
  npc_override_geffen_in_geffen_after_i_realized_i_neede_d336e0: "After that, I realized I needed some sort of weapon to counter long-ranged attacks from enemies. Something that can attack from a distance..."
  npc_override_geffen_in_geffen_after_no_one_could_ever_8e9bbf: "After that, no one could ever see"
  npc_override_geffen_in_geffen_ah_971301: "Ah..."
  npc_override_geffen_in_geffen_ah_duuuuuude_you_re_brea_403535: "Ah duuuuuude~ You're breakin' my heart! I mean, at these prices, I'm practically performing charity!"
  npc_override_geffen_in_geffen_ah_old_flame_return_i_c58f66: "Ah! An old flame will return! I don't know if they'll fall in love with you again, ask you for money, or if that person's back for revenge..."
  npc_override_geffen_in_geffen_ah_yes_jellopy_f01345: "Ah yes, Jellopy."
  npc_override_geffen_in_geffen_ah_yes_let_me_contact_a6bc8b: "Ah yes. Let me contact the spirit world. They usually have sound financial advice, despite the fact that don't have any sort of economy over there."
  npc_override_geffen_in_geffen_ah_yes_they_telling_me_fb37b3: "Ah yes. They are telling me that it's best to be moderate in all things. Certainly, you must make sure that your expenditures don't exceed your budget."
  npc_override_geffen_in_geffen_ah_you_into_potions_eh_544fbb: "Ah, you into Potions, eh?"
  npc_override_geffen_in_geffen_al_de_baran_who_had_341948: "in Al De Baran who had 4 sons."
  npc_override_geffen_in_geffen_all_8c0bbc: "have it all!"
  npc_override_geffen_in_geffen_all_they_seem_know_f9743e: "All they seem to know"
  npc_override_geffen_in_geffen_alright_i_got_2c0713: "Alright, I got it!"
  npc_override_geffen_in_geffen_alright_i_got_something_803807: "Alright, I got something. Ummmm, you will live to be very, very old. How old you ask?"
  npc_override_geffen_in_geffen_also_you_ll_always_succe_df8ded: "Also, you'll always be successful. You'll successfully win in life and you'll successfully lose in life!"
  npc_override_geffen_in_geffen_although_pressure_may_hi_fd5688: "Although the pressure may be high, remember that any decision made in excitement is usually a bad decision. Take a deep breath and relax."
  npc_override_geffen_in_geffen_although_you_formally_tr_93320e: "Although you are not formally trained in the use of magic, you use skills which draw upon otherworldly energies, whether you know it or not..."
  npc_override_geffen_in_geffen_although_you_may_able_us_2dcf3b: "Although you may not be able to use magic or any other kind of powerful skills for now, this knowledge may be helpful in the future, young Novice..."
  npc_override_geffen_in_geffen_anyone_could_as_strong_a_9864c9: "With that, anyone could be as strong as Hercules... Even a weakling like me! Hahahahahah,"
  npc_override_geffen_in_geffen_anything_04126e: "with anything?"
  npc_override_geffen_in_geffen_anyway_7479d2: "Anyway..."
  npc_override_geffen_in_geffen_aren_t_you_going_give_dd2ecf: "Aren't you going to give me a sheath too?"
  npc_override_geffen_in_geffen_arrrrrgh_fb4e48: "ARRRRRGH~!"
  npc_override_geffen_in_geffen_artistic_my_taste_284059: "artistic for my taste."
  npc_override_geffen_in_geffen_atmosphere_87d511: "atmosphere."
  npc_override_geffen_in_geffen_awfully_lazy_today_dde960: "awfully lazy today."
  npc_override_geffen_in_geffen_awww_daa9b8: "Awww..."
  npc_override_geffen_in_geffen_back_when_boring_9e5f12: "back when it was boring. "
  npc_override_geffen_in_geffen_bargain_c11154: "for a bargain?"
  npc_override_geffen_in_geffen_because_incident_weapon_5fc015: "Because of the incident, the weapon smith"
  npc_override_geffen_in_geffen_boy_awkward_bc90b1: "...Boy, this is awkward."
  npc_override_geffen_in_geffen_boy_you_bc7782: "The boy that you"
  npc_override_geffen_in_geffen_but_2e7fce: "But..."
  npc_override_geffen_in_geffen_buuuurns_86c2ca: "IT BUUUURNS!"
  npc_override_geffen_in_geffen_c_come_again_1e80b5: "C-come again?"
  npc_override_geffen_in_geffen_c_mon_dude_latest_red_5ad2b0: "C'mon dude. This is the latest Red Potion. I got it from a close friend of a friend, you know, a real dependable source, and it's real cheap too. You can't pass this up!"
  npc_override_geffen_in_geffen_certainly_fe2665: "Certainly has"
  npc_override_geffen_in_geffen_city_magic_6936d8: "the City of Magic!"
  npc_override_geffen_in_geffen_clearly_deal_century_so_a14c1b: "Clearly, this is the deal of the century. So how many do you want?"
  npc_override_geffen_in_geffen_collected_patience_6a6b1d: "collected patience"
  npc_override_geffen_in_geffen_come_true_4e199d: "will come true!"
  npc_override_geffen_in_geffen_come_wouldn_t_you_agree_1ffe44: "Come on, wouldn't you agree? Cowboy Hats look great on Super Novices!"
  npc_override_geffen_in_geffen_cough_cb8189: "*Cough*"
  npc_override_geffen_in_geffen_cough_ty_nine_years_old_7793b5: "^333333*cough!*^000000ty-nine years old. Isn't that good news? That's a ripe old age, and you have plenty of blissful years left to enjoy."
  npc_override_geffen_in_geffen_course_doing_kind_experi_86418f: "Of course, doing that kind of experimentation just seems dangerous. You might be able to unleash some really scary monsters into the world..."
  npc_override_geffen_in_geffen_course_every_popular_sty_dc5b6f: "Of course, not every popular style suits my taste. I mean, I saw someone walking around with a Mushroom on their head. And I hear someone has been making hats made out of Fish?"
  npc_override_geffen_in_geffen_course_i_m_sure_exactly_93eddd: "Of course, I'm not sure exactly which dreams will come true, but hopefully the good dreams that you've had will become reality, rather than any of your weird nightmares."
  npc_override_geffen_in_geffen_course_might_too_expensi_4d74af: "Of course, that might be too expensive for most people, but you get the idea."
  npc_override_geffen_in_geffen_cowboy_hats_very_popular_87d8f3: "That Cowboy Hats will be very popular among female"
  npc_override_geffen_in_geffen_crraaaap_b6092e: "crraaaap!"
  npc_override_geffen_in_geffen_currently_seeing_e491ef: "are currently seeing"
  npc_override_geffen_in_geffen_currently_seeing_perfect_e44200: "are currently seeing is perfect for you if you want to live the rest of your life in utter misery!"
  npc_override_geffen_in_geffen_day_today_79fa06: "day today?"
  npc_override_geffen_in_geffen_decagon_7a449c: "Decagon?"
  npc_override_geffen_in_geffen_did_you_happen_be6dc2: "Did you happen"
  npc_override_geffen_in_geffen_don_t_know_3b379d: "Don't know the"
  npc_override_geffen_in_geffen_don_t_tell_me_you_36f46d: "Don't tell me! You've come to have your fortune told, yes? I know,"
  npc_override_geffen_in_geffen_down_flu_8ccd96: "down with the flu!"
  npc_override_geffen_in_geffen_drink_9252e3: "Drink?"
  npc_override_geffen_in_geffen_economy_c9b868: "The economy...?"
  npc_override_geffen_in_geffen_economy_town_649f78: "economy in this town!"
  npc_override_geffen_in_geffen_education_really_importa_4bb2da: "An education is really important, but don't be discouraged if your grades aren't as good as you'd like."
  npc_override_geffen_in_geffen_effort_d04e7b: "In Effort!"
  npc_override_geffen_in_geffen_eric_you_d578ed: "for Eric, are you?"
  npc_override_geffen_in_geffen_even_if_you_break_up_95158b: "But even if you break up, do it as soon as possible and try to be good friends after the matter."
  npc_override_geffen_in_geffen_even_if_you_re_running_8b1628: "Even if you're running out of time, it's better to slowly plan things out so that you don't waste any of your efforts, or make costly mistakes."
  npc_override_geffen_in_geffen_eventually_they_create_t_1c9eb5: "Eventually, they create trees that grow celebrity impersonators. Today, it looks like a miracle of science, and a threat to Hollywood starlets."
  npc_override_geffen_in_geffen_everyone_knows_wizards_a_61bad8: "Everyone knows Wizards are all intelligence and no strength! Come on, smart man! Show me how tough you are!"
  npc_override_geffen_in_geffen_f_minus_0f4d96: "^FF0000F MINUS^000000!"
  npc_override_geffen_in_geffen_fashion_c9023e: "Fashion...?"
  npc_override_geffen_in_geffen_father_survived_alone_tr_24a481: "The father survived alone from the tragedy."
  npc_override_geffen_in_geffen_feathered_bonnet_s_suppo_15b6f4: "Or was it the Feathered Bonnet that's supposed to skyrocket in popularity? Both of those hats are just sooo stylish, especially on Bards..."
  npc_override_geffen_in_geffen_feels_nice_wear_expensiv_eff71f: "It feels nice to wear expensive headgears! And it's nice to wear fancy clothing too! But remember..."
  npc_override_geffen_in_geffen_first_off_accountable_yo_7ffaaf: "First off, be accountable for your own money and use a budget that works for you. A good rule of thumb? For every ten zeny you earn, put one zeny aside and either save it or invest it for later."
  npc_override_geffen_in_geffen_fish_530538: "A... Fish?"
  npc_override_geffen_in_geffen_forgive_me_cb3ce5: "Forgive me!"
  npc_override_geffen_in_geffen_french_dagger_match_your_9b3960: "^FF3333French Dagger^000000 to match your beauty and elegance."
  npc_override_geffen_in_geffen_future_believe_internet_b0b191: "In the future, believe it or not, the internet will be replaced by a giant brain. I don't know how, but trust me, this brain's huge."
  npc_override_geffen_in_geffen_future_i_thought_implied_0d1810: "The future? I thought it was implied that any fortune I tell you is about the future in the specific field that you choose."
  npc_override_geffen_in_geffen_future_sex_violence_rock_2621e7: "In the future, Sex, Violence, and Rock and Roll are completely abolished. Mankind experiences an era of complete peace and utter boredom."
  npc_override_geffen_in_geffen_future_they_genetically_1beb71: "In the future, they genetically engineer all sorts of plants."
  npc_override_geffen_in_geffen_geffen_sure_strange_wort_ac81b3: "This Geffen sure is strange. But it was worth it to travel here all the way from the Schwarzwald Republic."
  npc_override_geffen_in_geffen_gemstone_42e4f3: "Gemstone..."
  npc_override_geffen_in_geffen_get_all_scary_b58061: "get all scary?!^000000"
  npc_override_geffen_in_geffen_girl_you_5a071a: "The girl that you"
  npc_override_geffen_in_geffen_god_rest_his_soul_95d805: "God rest his soul, is"
  npc_override_geffen_in_geffen_good_5219c6: "Good..."
  npc_override_geffen_in_geffen_good_heavens_863401: "...Good Heavens!"
  npc_override_geffen_in_geffen_goodness_you_must_so_str_077902: "Goodness, you must be so strong!"
  npc_override_geffen_in_geffen_gossip_6c5806: "Gossip...?"
  npc_override_geffen_in_geffen_gossip_eh_a459c2: "Gossip, eh?"
  npc_override_geffen_in_geffen_h_hey_you_3cfbbb: "H-Hey you!"
  npc_override_geffen_in_geffen_haha_what_you_saying_you_7230f2: "Haha! What are you saying? You don't need drawstrings! The space age Rayon and Nylon and Krypton fibers keep the Hood secure on your head!"
  npc_override_geffen_in_geffen_hahahahaah_f3256f: "Hahahahaah!"
  npc_override_geffen_in_geffen_hahahahahahaha_b419ba: "Hahahahahahaha~!"
  npc_override_geffen_in_geffen_haw_haw_ac55cb: "Haw haw!"
  npc_override_geffen_in_geffen_hear_any_bb27eb: "to hear any of that?"
  npc_override_geffen_in_geffen_hello_69342c: "Hello!"
  npc_override_geffen_in_geffen_hello_efda05: "Hello~!"
  npc_override_geffen_in_geffen_hello_hello_e20b0e: "Hello hello."
  npc_override_geffen_in_geffen_hello_i_m_resident_exper_fb2a1f: "Hello, I'm the resident expert of Monsterology here in Geffen. Is there anything in particular that you're curious about?"
  npc_override_geffen_in_geffen_hello_there_5a8ec9: "Hello there~"
  npc_override_geffen_in_geffen_help_meeeee_341f1c: "Help meeeee!"
  npc_override_geffen_in_geffen_her_voice_46e834: "Her voice was"
  npc_override_geffen_in_geffen_here_high_quality_red_po_33ce0f: "Here it is! High quality Red Potion! It starts working right away once you take it. Once it hits your lips, you can't stop. This stuff is that good."
  npc_override_geffen_in_geffen_hey_there_tough_guy_you_59c2fb: "Hey there tough guy. You look smart enough to recognize a bargain when it's right in front of your eyes."
  npc_override_geffen_in_geffen_hey_you_sex_crazed_basta_b34f4b: "^990000Hey you sex crazed bastard!! Stop looking at my daughter like that before I rip out your eyes, and eat them with pasta!^000000"
  npc_override_geffen_in_geffen_hm_all_spirits_said_did_2a099f: "Hm? All the spirits said was 'Did you study?' Well, I guess I answered your question with yet another question!"
  npc_override_geffen_in_geffen_hmm_9c4d28: "Hmm..."
  npc_override_geffen_in_geffen_hmm_spirits_being_awfull_a8d182: "Hmm. The spirits are being awfully rude today. They're saying, 'If you're so worried about your grades, why don't you ask your teacher?'"
  npc_override_geffen_in_geffen_hmmm_2ac89c: "Hmmm..."
  npc_override_geffen_in_geffen_hmmm_i_sense_you_experie_e11bf1: "Hmmm... I sense that you are experiencing a loss of direction in life. Should you prioritize security or happiness?"
  npc_override_geffen_in_geffen_hmmmm_well_7d8b5c: "Hmmmm, well..."
  npc_override_geffen_in_geffen_hood_no_drawstrings_2c748a: "This hood has no drawstrings...? "
  npc_override_geffen_in_geffen_hood_wearing_one_those_q_03a584: "A Hood! Wearing one of those is the quickest way to win respect these days!"
  npc_override_geffen_in_geffen_hornets_living_grassland_eadb31: "Hornets living in the grasslands spend their lives gathering nectar at the Queen Bee's command. Honey is made from the nectar they gather."
  npc_override_geffen_in_geffen_how_dare_you_try_pick_01594b: "^990000How dare you try to pick up on my precious daughter! Do you wish to taste an angry father's fury?!^000000"
  npc_override_geffen_in_geffen_how_did_she_edc243: "How did she"
  npc_override_geffen_in_geffen_how_sad_father_ff9bc7: "How sad it will be for the father..."
  npc_override_geffen_in_geffen_however_as_balance_natur_27bd47: "However, as the balance of nature has changed, the monsters have inevitably returned. Not too many people know this, but most monsters were gentle creatures at one time. It's sad, really..."
  npc_override_geffen_in_geffen_however_people_who_buy_t_e5857b: "However, the people who buy these trees are the same kind who wear those really tacky shirts..."
  npc_override_geffen_in_geffen_however_you_should_also_0f26f1: "However, you should also avoid gambling with your money. By that, I mean you should save and invest carefully. Don't be tempted into risky get-rich-quick schemes!"
  npc_override_geffen_in_geffen_huh_73fef0: "Huh?"
  npc_override_geffen_in_geffen_huh_a78e67: "Huh...?"
  npc_override_geffen_in_geffen_huh_total_bummer_7125ba: "Huh. Total bummer."
  npc_override_geffen_in_geffen_huuurts_e198f5: "It huuurts..."
  npc_override_geffen_in_geffen_i_call_7b0a23: "I call it..."
  npc_override_geffen_in_geffen_i_did_forget_all_about_a502e0: "I did, forget all about it,"
  npc_override_geffen_in_geffen_i_didn_t_say_anything_fdc78f: "I didn't say anything. But if"
  npc_override_geffen_in_geffen_i_don_t_know_how_8d06cb: "I don't know how far in the future that will occur, but it better not happen soon!"
  npc_override_geffen_in_geffen_i_don_t_know_much_396a92: "I don't know much about magic, but do you know what tastes magical? ^CC6600Honey^000000!"
  npc_override_geffen_in_geffen_i_don_t_know_what_1baa24: "I don't know what that is. But I guess it can't be half as bad as a Mage."
  npc_override_geffen_in_geffen_i_don_t_like_stereotype_16f1dc: "I don't like to stereotype people, but haven't you noticed that Swordsmen and Knights"
  npc_override_geffen_in_geffen_i_don_t_think_sons_9d0939: "I don't think that 4 sons of him"
  npc_override_geffen_in_geffen_i_especially_worry_about_00f49f: "I especially worry about all the drawbacks to using magic."
  npc_override_geffen_in_geffen_i_find_something_44a05e: "I find something"
  npc_override_geffen_in_geffen_i_guess_8d1d83: "I guess..."
  npc_override_geffen_in_geffen_i_guess_those_641c44: "I guess those"
  npc_override_geffen_in_geffen_i_guess_you_want_know_fc8bd4: "I guess you want to know about the future in general. Let me commune with the spirits, and we'll see what they have to say, okay?"
  npc_override_geffen_in_geffen_i_hear_orcs_their_own_2a5c73: "I hear that Orcs have their own culture and language, supposedly just like us humans. Does that mean Orcs go on dates...?"
  npc_override_geffen_in_geffen_i_hear_originally_called_e2e514: "I hear that it was originally called the Rune-Midgarts Kingdom, after our continent. However, for some reason, the name was changed to 'Rune-Midgarts.'"
  npc_override_geffen_in_geffen_i_hear_there_s_person_de9fe1: "I hear there's this person somewhere in Rune-Midgarts..."
  npc_override_geffen_in_geffen_i_help_you_9dd552: "Can I help you"
  npc_override_geffen_in_geffen_i_i_t_think_anything_47b0b7: "I, I can't think of anything. E-everything feels so fuzzy..."
  npc_override_geffen_in_geffen_i_just_saved_you_lifetim_f459a6: "But I just saved you a lifetime's worth of lottery tickets! That could be quite a hefty sum of money!"
  npc_override_geffen_in_geffen_i_know_i_see_future_bc4c1b: "I know... I can see the future! So what kind of fortune do you want?"
  npc_override_geffen_in_geffen_i_m_girl_65d664: "But, But I'm a girl!"
  npc_override_geffen_in_geffen_i_m_girl_99b475: "I'm a girl!"
  npc_override_geffen_in_geffen_i_m_glad_hear_you_f06792: "I'm glad to hear you've come this way to help out that young fellow."
  npc_override_geffen_in_geffen_i_m_no_exception_d5b9ab: "And I'm no exception."
  npc_override_geffen_in_geffen_i_m_seeing_something_1bfd23: "I'm seeing something..."
  npc_override_geffen_in_geffen_i_m_so_jealous_e4cfb6: "I'm so jealous!"
  npc_override_geffen_in_geffen_i_m_so_scared_dca263: "I'm so scared!"
  npc_override_geffen_in_geffen_i_m_so_sorry_2f9418: "I'm so sorry!"
  npc_override_geffen_in_geffen_i_mean_all_these_new_6417bf: "I mean, all these new cities are being discovered by explorers, so import and export trade is really booming!"
  npc_override_geffen_in_geffen_i_mean_i_ve_read_e2c37f: "I mean, I've read about all sorts of monsters in the Prontera and Juno Libraries, and encountered a few in the wild, but now I get a chance to see some strong monsters in real life!"
  npc_override_geffen_in_geffen_i_mean_they_re_being_ffa1d0: "I mean, they're being paid to help you. And well, my service is free. So... Yeah."
  npc_override_geffen_in_geffen_i_must_78a2d6: "I must have it!"
  npc_override_geffen_in_geffen_i_must_coming_2b8ace: "I must be coming"
  npc_override_geffen_in_geffen_i_now_predict_sombrero_c_bcb393: "I now predict that the Sombrero will be come very popular when a mass group of Bards form a guild in which the members only wear Sombreros."
  npc_override_geffen_in_geffen_i_only_use_140edc: "I can only use"
  npc_override_geffen_in_geffen_i_predict_38f1ef: "I predict..."
  npc_override_geffen_in_geffen_i_really_had_no_idea_d848b3: "I really had no idea whether or not Priests could marry, but since King Tristram III was there himself,"
  npc_override_geffen_in_geffen_i_reeeeally_want_able_vi_1c3b7f: "I reeeeally want to be able to visit that place where they serve real drinks. I hear it's just like paradise!"
  npc_override_geffen_in_geffen_i_remember_geffen_813e39: "I remember Geffen"
  npc_override_geffen_in_geffen_i_see_you_wield_holy_e9a829: "I see that you wield holy power in one way or another. I suppose Holy power may be considered one form of mystical energy."
  npc_override_geffen_in_geffen_i_sense_presence_mighty_b32a10: "I sense the presence of a mighty spirit. Can it be you...?"
  npc_override_geffen_in_geffen_i_sense_you_may_about_fbad40: "I sense that you may be about to make a rash decision that you might regret. I must advise you to slow down and think first."
  npc_override_geffen_in_geffen_i_sense_you_soon_receivi_48b5c1: "I sense that you will soon be receiving straight A's..."
  npc_override_geffen_in_geffen_i_sense_you_ve_had_6244b0: "I sense that you've had a quarrel with someone close to you. Someone for whom you care for dearly."
  npc_override_geffen_in_geffen_i_suggest_you_think_full_1cd1d1: "I suggest that you think fully and carefully before deciding what path is best for you. And remember, you can only learn from your mistakes."
  npc_override_geffen_in_geffen_i_suppose_s_okay_0d11d5: "I suppose that it's okay!"
  npc_override_geffen_in_geffen_i_t_let_you_buy_e243b1: "I can't let you buy that many. I mean, it's not like, you know, there's a trace impurity in these Potions or anything like that..."
  npc_override_geffen_in_geffen_i_t_sell_many_daggers_8e8f20: "I can't sell that many Daggers! That'll attract the Prontera Chiv--I mean, um, I was gonna donate some Daggers to... Hungry children?"
  npc_override_geffen_in_geffen_i_t_sell_you_many_d38f10: "I can't sell you that many! What are you trying to do, take advantage of me?"
  npc_override_geffen_in_geffen_i_thought_only_members_o_83a5a5: "But I thought only members of the Orc Tribe could wear those?"
  npc_override_geffen_in_geffen_i_went_down_prontera_san_286c0d: "I went down to the Prontera Sanctuary, and I could have sworn"
  npc_override_geffen_in_geffen_i_you_117253: "I do for you?"
