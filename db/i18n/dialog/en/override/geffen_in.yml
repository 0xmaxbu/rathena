  npc_override_geffen_in_mage_what_you_interested_mage_c01875: "What, are you interested in the Mage guild? I didn't want to tell you this, but you don't belong here."
  npc_override_geffen_in_mage_whoa_long_time_no_see_7b758a: "Whoa, long time no see! But weren't you supposed to be dead?"
  npc_override_geffen_in_mage_wow_some_reason_you_look_083ffd: "Wow, for some reason, you look way better than you did before. Anyway, I believe you will do a better job being a Mage as well."
  npc_override_geffen_in_magic_books_according_humans_informa_42df66: "^660066According to Humans' information, this essence constitutes one of the four natural elements.^000000"
  npc_override_geffen_in_magic_books_afterwards_create_bring_ec64ff: "Afterwards, create and bring me the artifact. We'll talk about creating the Magic Book afterwards."
  npc_override_geffen_in_magic_books_ah_i_ll_get_myself_52a407: "Ah, I'll get myself in trouble if I stay here any longer. Maybe I'm already in..."
  npc_override_geffen_in_magic_books_ah_so_you_want_intermedi_b88582: "Ah, so you want the Intermediate Magic Books. If you pay a ^4d4dffloan deposit of 100,000z^000000, we will lend you an Intermediate Magic Books."
  npc_override_geffen_in_magic_books_ah_there_s_silver_lining_5cc73e: "Ah, but there's a silver lining!"
  npc_override_geffen_in_magic_books_all_depends_your_ability_237570: "That all depends on your ability to control your spells. You'll have to try and experience Magic Binding after you first learn it to really understand."
  npc_override_geffen_in_magic_books_alright_then_let_s_get_f210fa: "Alright then, let's get started!"
  npc_override_geffen_in_magic_books_anything_useful_836cc1: "anything useful?"
  npc_override_geffen_in_magic_books_as_i_said_earlier_spells_cdd5de: "As I said earlier, spells in Magic Books tend to go back to what they are."
  npc_override_geffen_in_magic_books_as_you_know_four_element_c12d8e: "As you know, the four elements are Fire, Water, Wind, and Earth. Being able to employ them freely is the essential principle of magic."
  npc_override_geffen_in_magic_books_aw_you_don_t_s_254bf3: "Aw, you don't? It's disappointing, but there's nothing I can do. Come back when you have enough money, okay?"
  npc_override_geffen_in_magic_books_book_t_used_just_anyone_af625a: "That book can't be used by just anyone, you know?"
  npc_override_geffen_in_magic_books_carrying_globes_four_ele_d09f29: "Carrying the globes of the four elements is also related to Magic Binding."
  npc_override_geffen_in_magic_books_circles_magic_work_organ_1bf7b3: "Circles of magic work organically with each other. When you use the Freezing Spell to bind a spell, the spell won't activate until you cast the release spell."
  npc_override_geffen_in_magic_books_congratulations_entering_b29c8f: "Congratulations on entering a brand new world of magic."
  npc_override_geffen_in_magic_books_course_binding_spell_con_a9af1f: "Of course, binding a spell continuously consumes your mana, but it consumes less mana than conventional magic spells."
  npc_override_geffen_in_magic_books_did_did_you_just_say_40e790: "Did... Did you just say the Ultimate Magic Book?"
  npc_override_geffen_in_magic_books_did_old_man_recommend_me_e478e7: "did the old man recommend me to you?"
  npc_override_geffen_in_magic_books_documents_container_aren_b81433: "The documents in this container aren't legible. It's no use trying to read them."
  npc_override_geffen_in_magic_books_documents_making_you_fee_1d8d8e: "The documents are making you feel nauseous. You should come back later after your stomach settles."
  npc_override_geffen_in_magic_books_don_t_try_out_just_b9bec7: "Don't try it out just to see what happens for yourself! Falling asleep while casting a spell? There's nothing more humiliating than that to magic practitioners like us."
  npc_override_geffen_in_magic_books_don_t_you_know_how_a6321a: "Don't you know how many others would want the book you already have? It's a bit selfish to want more than one, you know."
  npc_override_geffen_in_magic_books_essence_flame_refined_st_ffbd1b: "^660066The essence of flame can be refined on stable ground on the 1st floor of the Thor's Volcano Dungeon. 10 Love Coals are necessary to refine the essence.^000000"
  npc_override_geffen_in_magic_books_even_if_you_create_one_6ceed5: "Even if you create one, its power will be beyond your capacity."
  npc_override_geffen_in_magic_books_few_scholars_midgard_con_8985d8: "A few scholars in the Midgard Continent once tried to collect ancient Magic Books and reproduce that book, but..."
  npc_override_geffen_in_magic_books_frankly_i_m_only_interes_e00593: "Frankly, I'm only interested in creating the Ultimate Magic Book."
  npc_override_geffen_in_magic_books_frankly_i_ve_never_even_ba83d1: "Frankly, I've never even seen the Ultimate Magic Book."
  npc_override_geffen_in_magic_books_freezing_spell_used_magi_ec256a: "The Freezing Spell is used for Magic Binding. It helps you to insert a magic spell to a circle."
  npc_override_geffen_in_magic_books_galfos_near_expedition_c_2621ff: "Galfos is near the Expedition Camp beyond the Dimensional Rift."
  npc_override_geffen_in_magic_books_ha_ha_d039c4: "Ha ha..."
  npc_override_geffen_in_magic_books_ha_ha_i_m_sorry_98d4ea: "Ha ha, I'm sorry, but you should focus on strengthening your body rather than creating Magic Books."
  npc_override_geffen_in_magic_books_ha_ha_you_also_seeking_717d59: "Ha ha, are you also seeking new knowledge?"
  npc_override_geffen_in_magic_books_hah_you_re_silly_fb7879: "Hah! You're silly."
  npc_override_geffen_in_magic_books_he_s_been_taking_great_f89918: "He's been taking a great interest in the ancient Magic Books."
  npc_override_geffen_in_magic_books_hey_what_did_i_tell_a73fa3: "Hey, what did I tell you? I can't buy the tools to make the book without money!"
  npc_override_geffen_in_magic_books_his_name_galfos_72f429: "His name is Galfos."
  npc_override_geffen_in_magic_books_how_may_i_help_you_cc1359: "How may I help you?"
  npc_override_geffen_in_magic_books_huh_you_looking_ultimate_dcec4e: "Huh, are you looking for the Ultimate Magic Book? Who sent you?"
  npc_override_geffen_in_magic_books_i_able_refine_essence_fo_a0e9e7: "^660066I was able to refine the essence of fossil from old rocks on the 2nd floor of the Mine Dungeon. So far, that place is the most stable among all the testing grounds."
  npc_override_geffen_in_magic_books_i_better_forget_equip_my_a1e10f: "I better not forget to equip my ring."
  npc_override_geffen_in_magic_books_i_didn_t_know_someone_627bf9: "I didn't know someone would actually take an interest in that book. Yes, I'm studying that magic book. How did you find that out?"
  npc_override_geffen_in_magic_books_i_didn_t_support_him_1446c7: "I didn't support him or give him any advice for his research since I thought he'd give on it pretty quickly, but..."
  npc_override_geffen_in_magic_books_i_heard_you_ve_studied_a08dd7: "I heard that you've studied the Ultimate Magic Book."
  npc_override_geffen_in_magic_books_i_m_good_using_magic_4722c3: "I'm not good at using magic, not to mention that I prefer fists in fighting. Nevertheless, I find Magic Books to be incredibly intriguing."
  npc_override_geffen_in_magic_books_i_m_here_babysit_get_60ef3d: "I'm not here to babysit. Get lost!"
  npc_override_geffen_in_magic_books_i_m_sorry_could_you_aec874: "I'm sorry, but could you ask someone else? I'm kind of busy right now."
  npc_override_geffen_in_magic_books_i_m_sorry_i_don_8f4c63: "I'm sorry, but I don't talk to people that aren't even ready for this."
  npc_override_geffen_in_magic_books_i_m_sorry_i_only_38aca1: "I'm sorry, but I only have Magic Books for beginners, but they're obviously not suitable for you. Do you still want one?"
  npc_override_geffen_in_magic_books_i_m_sorry_i_t_70bda7: "I'm sorry that I can't help you more than that."
  npc_override_geffen_in_magic_books_i_m_sorry_my_knowledge_962042: "I'm sorry, but my knowledge doesn't concern you."
  npc_override_geffen_in_magic_books_i_m_sorry_our_management_25487c: "I'm sorry, but our management has recently decided to limit the availability of Magic Books for Multi Circlers. It's because their numbers are increasing more quickly than we expected."
  npc_override_geffen_in_magic_books_i_m_sorry_there_s_8da08a: "I'm sorry, but there's not much information left about the Ultimate Magic Book."
  npc_override_geffen_in_magic_books_i_need_least_zeny_buy_8f0767: "I need at least ^0000aa500,000 zeny^000000 to buy all the necessary tools. Do you have the money?"
  npc_override_geffen_in_magic_books_i_need_solve_one_last_6f2b41: "and I need to solve one last problem to create the Magic Book."
  npc_override_geffen_in_magic_books_i_succeeded_refining_ess_9e492c: "^660066I succeeded in refining the essence of glacier deep inside the 3rd floor of the Ice Cave. If you'd like to try, prepare 10 Ice Hearts and go to the following location.^000000"
  npc_override_geffen_in_magic_books_i_t_believe_someone_actu_38b47d: "I can't believe someone actually wants that book."
  npc_override_geffen_in_magic_books_i_ve_heard_he_s_3680a1: "I've heard that he's near the Expedition Camp beyond the Dimensional Rift to seek information about the ancient Magic Books."
  npc_override_geffen_in_magic_books_i_ve_perfectly_restored_91ad15: "I've perfectly restored the spells based on the ancient documents, but I still have no information about the necessary artifact."
  npc_override_geffen_in_magic_books_if_he_s_discovered_anyth_2508f8: "If he's discovered anything useful, maybe it can helpful to you."
  npc_override_geffen_in_magic_books_if_our_management_releas_e1b6f1: "If our management releases the restriction, you'll be the first one to know. Don't worry."
  npc_override_geffen_in_magic_books_if_you_d_like_try_03aef5: "If you'd like to try, prepare 10 Jubilees and go to the dungeon. Good luck.^000000"
  npc_override_geffen_in_magic_books_if_you_want_see_him_0bc97f: "If you want to see him, you should prepare for a long journey."
  npc_override_geffen_in_magic_books_intermediate_superior_ma_1cc642: "The Intermediate and Superior Magic Books must be returned upon borrowing the Ultimate Magic Book. Remember that you're just borrowing them, so make sure you take good care of those books."
  npc_override_geffen_in_magic_books_learn_spell_first_i_ve_7a49f7: "Learn the spell first. I've got so many things to tell you."
  npc_override_geffen_in_magic_books_let_s_compare_spell_scro_b55a5e: "Let's compare a spell on a scroll to a wire. When the wire is used to open a door or do something else, it's bent and crushed, losing its original shape. A spell from a Magic Book is more like a shape memory alloy."
  npc_override_geffen_in_magic_books_like_alloy_spell_magic_b_9572b0: "Like the alloy, a spell on a Magic Book remains after a use, although reusing the spell has a downtime for its restoration."
  npc_override_geffen_in_magic_books_loan_deposit_z_deposit_a_1d9d38: "The ^4d4dffloan deposit is 100,000z^000000. The deposit has adjusted as the Magic Book has changed."
  npc_override_geffen_in_magic_books_loan_deposit_z_deposit_a_c20012: "The ^4d4dffloan deposit is 500,000z^000000. The deposit has adjusted as the Magic Book has changed."
  npc_override_geffen_in_magic_books_magic_binding_becomes_mo_6b0468: "Magic Binding becomes more difficult when you use more powerful magic spells."
  npc_override_geffen_in_magic_books_magic_books_advanced_typ_b95572: "Magic Books are an advanced type of magic scroll. While spells on scrolls disappear after one use, the ones in Magic Books can be cast multiple times."
  npc_override_geffen_in_magic_books_make_ancient_ultimate_ma_c693e9: "To make the ancient Ultimate Magic Book, I need an artifact and some spells to fuse into it."
  npc_override_geffen_in_magic_books_man_i_almost_lost_my_f33263: "Man, I almost lost my control to the incredible magic energy! Here's your Magic Book."
  npc_override_geffen_in_magic_books_master_velofos_asked_me_ad0cbd: "Master Velofos asked me to bring his Magic Book."
  npc_override_geffen_in_magic_books_maybe_s_place_find_some_9e92f8: "Maybe that's the place to find some information about the artifact for this Ultimate Magic Book."
  npc_override_geffen_in_magic_books_menu_heh_46ed4b: "Heh! Your timing couldn't be better: I was looking for a test object."
  npc_override_geffen_in_magic_books_menu_huh_a98aa1: "Huh, don't you now what shape memory alloy is? Eh, just remember this: a wire made from shape memory alloy restores its shape over time."
  npc_override_geffen_in_magic_books_menu_i_8c3a1e: "I've discovered everything about Comet.:I've mastered the zenith of Tetra Vortex."
  npc_override_geffen_in_magic_books_menu_let_8af21d: "Let me think.:Magic Book (Drain Life):Magic Book (Jack Frost):Magic Book (Earth Strain):Magic Book (Crimson Rock):Magic Book (Chain Lightning)"
  npc_override_geffen_in_magic_books_menu_let_9da37c: "Let me think.:Magic Book (Storm Gust):Magic Book (Lord of Vermillion):Magic Book (Meteor Storm)"
  npc_override_geffen_in_magic_books_menu_let_e7d8b3: "Let me think.:I want the Intermediate Magic Books.:I want the Superior Magic Books.:I want the Ultimate Magic Books."
  npc_override_geffen_in_magic_books_menu_nothing_ceab5a: "Nothing.:Do you know the Reading Spell Book?:What's the Freezing Spell?:Can I have a Magic Book?:Can I use the Reading Spell Book without the Freezing Spell?:About the Ultimate Magic Book"
  npc_override_geffen_in_magic_books_menu_of_04d73f: "Of course, the damage won't be severe: you'll fall asleep or be thrown into confusion. This is all because there's a conflict between your Magic Book and the force of Magic Binding when you're trying to summon and hold a unlearned spell."
  npc_override_geffen_in_magic_books_menu_sure_e5c7f5: "Sure thing.:Where can I find advanced books?"
  npc_override_geffen_in_magic_books_menu_there_344a70: "There's one problem, though: I'm so broke that I don't even have enough money to buy the tools to make the book."
  npc_override_geffen_in_magic_books_menu_there_97c9f1: "There's one downside though: Magic Books cannot be used for spells that you haven't learned."
  npc_override_geffen_in_magic_books_menu_well_c3beb3: "Well, you've met all the qualifications except one: you need the Release spell."
  npc_override_geffen_in_magic_books_menu_wh_eaa225: "Wh-what? No!:Sure."
  npc_override_geffen_in_magic_books_menu_yes_cac114: "Yes, I do.:No, I don't."
  npc_override_geffen_in_magic_books_ms_lea_ab20b6: "Ms. Lea."
  npc_override_geffen_in_magic_books_my_brother_just_like_you_1943a6: "My brother is just like you. He's very interested in recreating the Ultimate Magic Book."
  npc_override_geffen_in_magic_books_my_research_almost_done_3bd4da: "My research is almost done,"
  npc_override_geffen_in_magic_books_my_right_arm_feels_hot_1b9b92: "My right arm feels hot while my left arm feels cold. I can never get used to this weird weather!"
  npc_override_geffen_in_magic_books_no_problem_be5b78: "No problem."
  npc_override_geffen_in_magic_books_nothing_document_looks_u_6b8fe3: "Nothing in this document looks useful."
  npc_override_geffen_in_magic_books_nothing_happen_when_you_88be42: "Nothing will happen when you try to bind magic without using Magic Binding because you have nothing to hold magic."
  npc_override_geffen_in_magic_books_nothing_here_looks_speci_660f63: "Nothing here looks special."
  npc_override_geffen_in_magic_books_now_we_re_getting_somewh_5645ca: "(Now we're getting somewhere!)"
  npc_override_geffen_in_magic_books_oh_did_you_find_0b684a: "Oh, did you find"
  npc_override_geffen_in_magic_books_oh_i_didn_t_mean_f9d913: "...Oh, I didn't mean to talk for too long. Anyways, you can use Magic Books to cast spells that you've learned. Its concept is different from normal spells."
  npc_override_geffen_in_magic_books_oh_my_071888: "Oh, my...."
  npc_override_geffen_in_magic_books_oh_my_i_sense_incredible_508d9b: "Oh my, I sense incredible energy coming from you. This is great! Now we're ready to make the Ultimate Magic Book."
  npc_override_geffen_in_magic_books_oh_yes_perhaps_he_might_ed9ed9: "Oh yes, perhaps he might know something."
  npc_override_geffen_in_magic_books_oh_you_want_superior_mag_36ca49: "Oh, do you want the Superior Magic Books? The policy has been changed to accept loan deposits unconditionally, instead of the existing demanding loan conditions."
  npc_override_geffen_in_magic_books_order_create_essence_lav_722dd3: "^660066In order to create the essence of lava, you must refine 40 Burning Hearts at the hottest place on the 2nd floor of the Thor's Volcano Dungeon.^000000"
  npc_override_geffen_in_magic_books_order_obtain_ultimate_ma_eed0bd: "In order to obtain the Ultimate Magic Book, you must reach Level 140 and learn Tetera Bolt and Comet."
  npc_override_geffen_in_magic_books_order_refine_essence_sto_805b7c: "^660066In order to refine the essence of storm, I visited the Hermit's Checkerboard in Kunlun where the spirit of the wind resides."
  npc_override_geffen_in_magic_books_order_use_reading_spell_3fc028: "In order to use the Reading Spell Book, you must learn the Freezing Spell to bind magic."
  npc_override_geffen_in_magic_books_please_don_t_say_you_476845: "Please don't say that you don't have it."
  npc_override_geffen_in_magic_books_please_go_talk_lea_archi_3e9ea7: "Please go talk to [Lea] in the Archive. Tell her that you need one of the Magic Books that I've stored in there."
  npc_override_geffen_in_magic_books_please_lighten_your_bag_95aebb: "Please lighten your bag."
  npc_override_geffen_in_magic_books_problem_i_t_use_ultimate_71eb00: "The problem is that I can't use the Ultimate Magic Book, even if I made one. That's why I can't really test it on my own."
  npc_override_geffen_in_magic_books_problem_when_you_try_for_b38b1b: "The problem is when you try to forcefully cast a spell that you haven't learned. It'll definitely backfire on you."
  npc_override_geffen_in_magic_books_reading_spell_book_liter_1f50f6: "Reading Spell Book literally means 'read a spell book.' Do you know how to use Magic Books?"
  npc_override_geffen_in_magic_books_refining_process_easy_i_61bad6: "The refining process was easy, but I had a hard time finding the catalyst, Dragon Teeth.^000000"
  npc_override_geffen_in_magic_books_s_good_question_s_relate_c15cdd: "That's a good question. It's related to Magic Binding."
  npc_override_geffen_in_magic_books_s_like_water_needs_bowl_ae03c1: "It's like water that needs a bowl to stay in place."
  npc_override_geffen_in_magic_books_s_right_4b5ef4: "That's right."
  npc_override_geffen_in_magic_books_s_why_i_ve_been_de231a: "That's why I've been waiting for a true magic practitioner like you that can help me test my Ultimate Magic Book."
  npc_override_geffen_in_magic_books_s_why_we_use_magic_f0fb6a: "That's why we use Magic Books to reduce that burden. It helps summon pre-cast spells while you're focusing on binding their magic power."
  npc_override_geffen_in_magic_books_said_as_circler_you_cann_961e0b: "That said, as a Circler, you cannot change or create spells in Magic Books."
  npc_override_geffen_in_magic_books_since_you_ve_learned_rel_99d5b7: "Since you've learned Release, you're capable of using Magic Binding as well. Well, let's talk about that later."
  npc_override_geffen_in_magic_books_someone_already_used_are_780260: "Someone already used this area."
  npc_override_geffen_in_magic_books_superior_magic_book_loan_e3c2cb: "The Superior Magic Book ^4d4dffloan deposit is 500,000z^000000."
  npc_override_geffen_in_magic_books_surprising_he_never_took_042190: "This is surprising. He never took my research very seriously. I'm glad that he finally changed his mind."
  npc_override_geffen_in_magic_books_test_object_7dd359: "A test object?"
  npc_override_geffen_in_magic_books_thank_you_making_my_drea_191f22: "Thank you for making my dream come true. Feel free to come back if you need another one of these books."
  npc_override_geffen_in_magic_books_thank_you_your_deposit_b_e7c792: "Thank you for your deposit. The book's return date is written on the lending card on the back cover of the book. Please try not to lose or damage the book and avoid paying compensation."
  npc_override_geffen_in_magic_books_there_anything_else_you_80fb41: "Is there anything else you need?"
  npc_override_geffen_in_magic_books_there_s_great_archive_el_2087ed: "There's a great archive in El Dicastes, the Capital City of the Evil Giants, where all knowledge in this world is stored."
  npc_override_geffen_in_magic_books_those_activities_may_dif_8ef0e7: "Those activities may differ from magic, but both are the same in the sense of employing the four elements."
  npc_override_geffen_in_magic_books_wait_minute_d99a41: "Wait a minute,"
  npc_override_geffen_in_magic_books_way_what_brings_you_me_b2732a: "By the way, what brings you to me today?"
  npc_override_geffen_in_magic_books_we_endure_great_hardship_9d85d2: "We endure great hardship and pain to achieve what we want. When we finally do, the sense of accomplishment defies description. That's why both you and I have chosen the way of magic."
  npc_override_geffen_in_magic_books_we_humans_use_torches_ke_fa409a: "We Humans use torches to keep fire, fans to blow wind, and bowls to hold water. We also use clay to make earthenware."
  npc_override_geffen_in_magic_books_we_magic_practitioners_a_5b00ec: "We magic practitioners are always thirsty for new knowledge and power."
  npc_override_geffen_in_magic_books_weak_spells_you_bind_two_ab31c0: "For weak spells, you can bind two to three of them with your circle. For more powerful spells, maybe one or two is possible."
  npc_override_geffen_in_magic_books_welcome_magic_archive_yo_0bab76: "Welcome to the Magic Archive. You can read and borrow books from here under certain conditions."
  npc_override_geffen_in_magic_books_welcome_my_friend_bbd420: "Welcome, my friend."
  npc_override_geffen_in_magic_books_well_then_you_don_t_06b326: "Well then, you don't need an additional lecture."
  npc_override_geffen_in_magic_books_well_why_don_t_you_f6909a: "Well... why don't you practice a little longer before that?"
  npc_override_geffen_in_magic_books_what_13b8ee: "But what?"
  npc_override_geffen_in_magic_books_what_brings_you_me_59dba8: "What brings you to me?"
  npc_override_geffen_in_magic_books_what_he_talking_about_173299: "(What is he talking about?)"
  npc_override_geffen_in_magic_books_what_kind_magic_book_you_82fa55: "What kind of Magic Book do you want?"
  npc_override_geffen_in_magic_books_what_s_difference_d5e0c2: "What's the difference?"
  npc_override_geffen_in_magic_books_what_you_baby_e0ea35: "What are you, a baby?"
  npc_override_geffen_in_magic_books_when_you_approach_docume_191cb0: "When you approach the documents, an Evil Giant that looks like the archive manager tries to call Guard Galton. You should get out of here quickly."
  npc_override_geffen_in_magic_books_when_you_fail_bind_such_b2d382: "When you fail to bind such powerful magic spells or fail to control them, you can receive irreparable damage to your mind and body."
  npc_override_geffen_in_magic_books_when_you_use_complex_mag_6199ff: "When you use complex magic spells to summon a storm, drop lightning, or burn an area, that consumes a lot of your energy, both physically and mentally."
  npc_override_geffen_in_magic_books_where_s_galfos_now_703d7a: "Where's Galfos now?"
  npc_override_geffen_in_magic_books_why_you_interested_too_c69438: "Why, are you interested too?"
  npc_override_geffen_in_magic_books_why_you_write_your_exist_8890a1: "Why do you have to write your existing spells in Magic Books, you asked?"
  npc_override_geffen_in_magic_books_wow_bb4aa6: "Wow!"
  npc_override_geffen_in_magic_books_yes_i_knew_coming_b418af: "Yes, I knew this was coming!"
  npc_override_geffen_in_magic_books_yes_i_m_galfos_velofos_1ee0f7: "Yes, I'm Galfos, and Velofos is my brother."
