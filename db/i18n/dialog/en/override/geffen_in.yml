  npc_override_geffen_in_geffen_still_if_you_want_go_ce2559: "Still, if you want to go sightseeing, I personally recommend that you visit my hometown of Juno. It's quite beautiful, you know."
  npc_override_geffen_in_geffen_still_if_you_want_seek_61bdc3: "Still, if you want to seek out strong monsters, you can cross the bridge to the West and fight Kobolds."
  npc_override_geffen_in_geffen_still_may_us_believe_the_e34a4d: "Still, may of us believe that there might be some relation to Jellopy and monsters, although it may be hard to believe that there is any."
  npc_override_geffen_in_geffen_still_people_manage_get_43724c: "Still, people manage to get drunk off the imitation drinks that we serve here. I guess it's all psychological."
