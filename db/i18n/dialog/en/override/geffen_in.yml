  npc_override_geffen_in_geffen_you_sure_like_ask_imposs_bc647b: "You sure like to ask for the impossible. Well, let me tell you right now. No other Merchant in the world sells the goods only I can offer."
  npc_override_geffen_in_geffen_you_t_even_you_00cd19: "But you can't even do that, can you?"
