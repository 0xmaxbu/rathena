Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@lab_CentralLaboratory_after_entering_code_pres_842681: "After entering the code press the main button near the entrance."
  npc_override_1@lab_CentralLaboratory_after_experiment_i_want_4becdb: "After the experiment I want to go home and enjoy an ice cold beer and some fried chicken."
  npc_override_1@lab_CentralLaboratory_ah_i_just_talking_such_8c8ef2: "Ah, I was just talking. Such an event is closer to a disaster than an experiment haha."
  npc_override_1@lab_CentralLaboratory_ah_oh_no_db3667: "Ah, oh no."
  npc_override_1@lab_CentralLaboratory_ah_you_aren_t_party_5d8db9: "Ah. You aren't the party leader. Take me to your leader! Or perhaps take your leader to me."
  npc_override_1@lab_CentralLaboratory_all_handled_well_bb5460: "All handled well!"
  npc_override_1@lab_CentralLaboratory_all_traces_entering_cent_a49159: "^0000ffAll the traces of entering the central laboratory have been erased. Speaking with the Civilization Explorer seems possible.^000000"
  npc_override_1@lab_CentralLaboratory_any_chance_you_intereste_5d6f1c: "By any chance, would you interested in traveling to the past?"
  npc_override_1@lab_CentralLaboratory_artemia_worries_too_much_962b5f: "Artemia worries too much. Anyway I'm going on a trip after the experiment."
  npc_override_1@lab_CentralLaboratory_cancel_77dfd2: "Cancel"
  npc_override_1@lab_CentralLaboratory_central_laboratory_unkno_d4634f: "^0000ffCentral Laboratory ^000000 - Unknown Error"
  npc_override_1@lab_CentralLaboratory_code_correct_opening_doo_d64287: "The code is correct. Opening door."
  npc_override_1@lab_CentralLaboratory_code_incorrect_please_tr_a03f86: "The code is incorrect. Please try again."
  npc_override_1@lab_CentralLaboratory_code_needs_entered_as_bi_e4f59e: "The code needs to be entered as a binary number. Use the switches behind me to enter it."
  npc_override_1@lab_CentralLaboratory_device_more_amazing_more_eefd5d: "This device is more amazing the more I look at. There has never been a particle accelerator made in this scale."
  npc_override_1@lab_CentralLaboratory_dimensional_distortion_h_2035d6: "A dimensional distortion can happen with such a powerful particle acceleration."
  npc_override_1@lab_CentralLaboratory_door_already_open_510126: "The door is already open."
  npc_override_1@lab_CentralLaboratory_door_open_so_you_may_ff71c6: "The door is open so you may now enter. Please note that you cannot open the door from the other side."
  npc_override_1@lab_CentralLaboratory_entrance_door_already_op_990e49: "The entrance door is already open."
  npc_override_1@lab_CentralLaboratory_even_better_if_you_show_937a7a: "Even better if you show me around if you find an interesting object."
  npc_override_1@lab_CentralLaboratory_how_i_assist_you_cc894b: "How can I assist you?"
  npc_override_1@lab_CentralLaboratory_i_bad_feeling_about_beca_30a0a5: "I have a bad feeling about this because... Nature finds a way."
  npc_override_1@lab_CentralLaboratory_i_haven_t_been_home_d38fe1: "I haven't been home for almost 2 years."
  npc_override_1@lab_CentralLaboratory_if_i_had_my_way_c1f7a8: "If I had it my way I would use the dimension mover to see for myself but there's too much work. Besides I am not an adventurer..."
  npc_override_1@lab_CentralLaboratory_interested_5ee0b1: "Not interested."
  npc_override_1@lab_CentralLaboratory_look_reality_doesn_t_lik_7b1640: "Look, reality doesn't like it when you grab a piece of string and give it a tug."
  npc_override_1@lab_CentralLaboratory_lot_undefined_terms_foun_6e8d00: "A lot of undefined terms are found in the recovered records as well."
  npc_override_1@lab_CentralLaboratory_machine_perfect_nothing_20f016: "The machine is perfect. Nothing will go wrong!"
  npc_override_1@lab_CentralLaboratory_many_excavated_objects_h_02c6d6: "But many of the excavated objects here already far surpass our current technology."
  npc_override_1@lab_CentralLaboratory_menu_alarm_24e4af: "Alarm System : I repeat. Class 1 alert issued from the Particle Laboratory. All researchers evacuate to the bunker."
  npc_override_1@lab_CentralLaboratory_menu_alarm_ae4061: "Alarm System : Alert! Alert! Class 1 alert issued from the Particle Laboratory. All researchers evacuate to the bunker."
  npc_override_1@lab_CentralLaboratory_menu_artemia_2efb34: "Artemia : What... what is that?!"
  npc_override_1@lab_CentralLaboratory_menu_artemia_383c14: "Artemia : Dimension moving while experimenting on new material production. Got caught up in a different level of an experiment."
  npc_override_1@lab_CentralLaboratory_menu_artemia_543873: "Artemia : Whew... is it over?"
  npc_override_1@lab_CentralLaboratory_menu_artemia_68d255: "Artemia: MA-4885!! On who's order are you restarting! Stop!!"
  npc_override_1@lab_CentralLaboratory_menu_artemia_7f133e: "Artemia : Probably making final confirmation checks. An experiment of this scope needs such caution."
  npc_override_1@lab_CentralLaboratory_menu_artemia_8dfa69: "Artemia: Dr. Fresa!! We have to stop! This is too dangerous!"
  npc_override_1@lab_CentralLaboratory_menu_artemia_9b8299: "Artemia : Ha... whose going to eat the chicken now?"
  npc_override_1@lab_CentralLaboratory_menu_artemia_ab45ce: "Artemia : Contacting catalyst bed number 1."
  npc_override_1@lab_CentralLaboratory_menu_artemia_b801f3: "Artemia : Let us start~"
  npc_override_1@lab_CentralLaboratory_menu_artemia_c2a83d: "Artemia :  But at least.. I will have chicken later."
  npc_override_1@lab_CentralLaboratory_menu_artemia_cbb6bf: "Artemia : Dr. Fresa! It's a dangerous situation of Mother Computer. Shut down the main power!"
  npc_override_1@lab_CentralLaboratory_menu_artemia_cc920a: "Artemia: It seems to be over."
  npc_override_1@lab_CentralLaboratory_menu_artemia_d19f1a: "Artemia: Dr. Fresa!! This ridiculous event is completely unrelated to our original experiment!"
  npc_override_1@lab_CentralLaboratory_menu_artemia_e5d3a5: "Artemia : Aah... I really don't like this experiment."
  npc_override_1@lab_CentralLaboratory_menu_artemia_ec25d6: "Artemia: What is that crazy clump of metal saying? It is saying we aren't in the same phase as those monster like things?"
  npc_override_1@lab_CentralLaboratory_menu_federico_05f331: "Federico: Plant initialization is the best."
  npc_override_1@lab_CentralLaboratory_menu_federico_06aed4: "Federico : Let us get started. Hm... Are you ready Dr. Fresa?"
  npc_override_1@lab_CentralLaboratory_menu_federico_4ee3fb: "Federico: Aah, I guess we should hope that Mother computer doesn't make the right calculations."
  npc_override_1@lab_CentralLaboratory_menu_federico_5f6b93: "Federico : Mother comp is conducting a tremendous experiment going beyond what we thought of."
  npc_override_1@lab_CentralLaboratory_menu_federico_60076f: "Federico : Damnit! Something else is coming!!"
  npc_override_1@lab_CentralLaboratory_menu_federico_65e392: "Federico: I thought it was Fresa's dogmatic experiment. But it was a problem with the mother comp."
  npc_override_1@lab_CentralLaboratory_menu_federico_89cd22: "Federico : Generator rotation fixed at 10000 RPM."
  npc_override_1@lab_CentralLaboratory_menu_federico_98fc31: "Federico : Is this how it feels to move dimensions. How strange..."
  npc_override_1@lab_CentralLaboratory_menu_federico_b06d99: "Federico : She's here."
  npc_override_1@lab_CentralLaboratory_menu_federico_b4974b: "Federico : What? Wasn't this the initialization stage?"
  npc_override_1@lab_CentralLaboratory_menu_federico_fa714d: "Federico : Ah... my body...can't move. Damn"
  npc_override_1@lab_CentralLaboratory_menu_leader_4d6811: "Leader: {0}"
  npc_override_1@lab_CentralLaboratory_menu_lona_075c71: "Lona Fresa: But ... you."
  npc_override_1@lab_CentralLaboratory_menu_lona_1c6e38: "Lona Fresa : This problem was predicted. Maintain current state."
  npc_override_1@lab_CentralLaboratory_menu_lona_3683f8: "Lona Fresa : Mother Comp MA-4885. I am your Chief director Dr. Fresa. Cease current progress."
  npc_override_1@lab_CentralLaboratory_menu_lona_53f1c5: "Lona Fresa : ......"
  npc_override_1@lab_CentralLaboratory_menu_lona_5cf677: "Lona Fresa : Current time 20 minutes past 11. Momentarily postpone experiment."
  npc_override_1@lab_CentralLaboratory_menu_lona_60d29d: "Lona Fresa : Testing the effects of particle acceleration on its surroundings in an open space."
  npc_override_1@lab_CentralLaboratory_menu_lona_65278f: "Lona Fresa: Completed shut down of Mother computer MA-4885. Confirm equipment suspension."
  npc_override_1@lab_CentralLaboratory_menu_lona_6e61cf: "Lona Fresa : It is fine."
  npc_override_1@lab_CentralLaboratory_menu_lona_7c3679: "Lona Fresa : This experiment is for the creation of new material that hasn't existed before."
  npc_override_1@lab_CentralLaboratory_menu_lona_840be5: "Lona Fresa: Good work everybody."
  npc_override_1@lab_CentralLaboratory_menu_lona_8904e0: "Lona Fresa : Current time {0} Month {1} Day 25 minutes after 10."
  npc_override_1@lab_CentralLaboratory_menu_lona_894a75: "Lona Fresa: Ending record with reasons of Mother Computer malfunction and overheating of accelerator."
  npc_override_1@lab_CentralLaboratory_menu_lona_8dbff8: "Lona Fresa : Starting the experiment. Chief researcher Dr. Federico, Artemia, Silvia, Vincent and assistant researchers."
  npc_override_1@lab_CentralLaboratory_menu_lona_8dd5ab: "Lona Fresa: I have fully realized that."
  npc_override_1@lab_CentralLaboratory_menu_lona_954b42: "Lona Fresa: Mother Computer MA-4885. Looks like you are trying to synchronize the other dimension and this world."
  npc_override_1@lab_CentralLaboratory_menu_lona_a7d92e: "Lona Fresa: Cutting off power to Mother Computer MA-4885."
  npc_override_1@lab_CentralLaboratory_menu_lona_ad7675: "Lona Fresa: The final experiment failure is unfortunate. But I will promise a more perfect experiment next time."
  npc_override_1@lab_CentralLaboratory_menu_lona_bfd176: "Lona Fresa : Recorders make sure to make detailed records of the catalyst bed's reaction when it is installed to the accelerator."
  npc_override_1@lab_CentralLaboratory_menu_lona_c5e2ab: "Lona Fresa: Recording all experiment progress and terminating at current point."
  npc_override_1@lab_CentralLaboratory_menu_lona_fd95da: "Lona Fresa: {0} Month {1} Day. Current time 38 minutes past 11 temporarily terminating particle accelerator project."
  npc_override_1@lab_CentralLaboratory_menu_ma_07f798: "MA-4885: Cannot guarantee what kind of dimension will be met due to the instability of the gateway..."
  npc_override_1@lab_CentralLaboratory_menu_ma_0e6228: "MA-4885: CODE NAME - DESCENT"
  npc_override_1@lab_CentralLaboratory_menu_ma_0f3c56: "MA-4885: Unidentified creature eliminated. Phase adjustment failed. Restarting relevant procedure."
  npc_override_1@lab_CentralLaboratory_menu_ma_11cd49: "MA-4885: Restarting particle acceleration procedure."
  npc_override_1@lab_CentralLaboratory_menu_ma_27ae6d: "MA-4885: Receiving changed circumstance through main server. Detecting dimensional distortion between particle accelerator and catalyst."
  npc_override_1@lab_CentralLaboratory_menu_ma_2b1e9e: "MA-4885: Unrecognized command."
  npc_override_1@lab_CentralLaboratory_menu_ma_2d7cae: "MA-4885: Dimension move at 78% progress. Most of the dimension encroached by demi-plane."
  npc_override_1@lab_CentralLaboratory_menu_ma_30a06d: "MA-4885: 2 seconds remaining"
  npc_override_1@lab_CentralLaboratory_menu_ma_38266b: "MA-4885: Unidentified creature eliminated. Restarting device."
  npc_override_1@lab_CentralLaboratory_menu_ma_43bf04: "MA-4885: Access denied. Cannot understand command."
  npc_override_1@lab_CentralLaboratory_menu_ma_45f6ac: "MA-4885: .....command... ----!!!  Zizip... ---!! -- following command ----- !! Zizip."
  npc_override_1@lab_CentralLaboratory_menu_ma_65a996: "MA-4885: Dimension move 100% completed. Welcome to the demi-plane dimension."
  npc_override_1@lab_CentralLaboratory_menu_ma_6fc7ab: "MA-4885: Alert. New unidentified creature approaching from demi-plane."
  npc_override_1@lab_CentralLaboratory_menu_ma_749c61: "MA-4885: 1 seconds remaining"
  npc_override_1@lab_CentralLaboratory_menu_ma_769f1a: "MA-4885: 5 seconds remaining"
  npc_override_1@lab_CentralLaboratory_menu_ma_88215f: "MA-4885: Suspending operation of all equipment as per Administrator request."
  npc_override_1@lab_CentralLaboratory_menu_ma_91a72b: "MA-4885: That is correct."
  npc_override_1@lab_CentralLaboratory_menu_ma_940d3e: "MA-4885: Final phase transformation process."
  npc_override_1@lab_CentralLaboratory_menu_ma_a36f0d: "MA-4885: 4 seconds remaining"
  npc_override_1@lab_CentralLaboratory_menu_ma_a72979: "MA-4885: Starting final phase transformation."
  npc_override_1@lab_CentralLaboratory_menu_ma_a96212: "MA-4885: Conducting calculations to restore balance to distorted phase. Please wait a moment."
  npc_override_1@lab_CentralLaboratory_menu_ma_ab27b8: "MA-4885: 1 second remaining"
  npc_override_1@lab_CentralLaboratory_menu_ma_b0e17d: "MA-4885: Direct interaction between the demi-plane creature and this world's organisms will be possible after the phase has been balanced."
  npc_override_1@lab_CentralLaboratory_menu_ma_b81deb: "MA-4885: Phase synchronization completed before creature is eliminated. Starting dimensional travel."
  npc_override_1@lab_CentralLaboratory_menu_ma_ba4fd2: "MA-4885: A gateway possible for contact with the demi-plane open at 3 o'clock of the laboratory."
  npc_override_1@lab_CentralLaboratory_menu_ma_bb4294: "MA-4885: 3 seconds remaining"
  npc_override_1@lab_CentralLaboratory_menu_ma_c6649a: "MA-4885: Dimension move at 20% progress. There could be dimensional interference with certain creatures. Please be aware."
  npc_override_1@lab_CentralLaboratory_menu_ma_c79745: "MA-4885: A new organism will be soon transmitted from the demi-plane."
  npc_override_1@lab_CentralLaboratory_menu_ma_cd2e0f: "MA-4885: Answering question. This space is currently stuck in a distorted phase."
  npc_override_1@lab_CentralLaboratory_menu_ma_d9e619: "MA-4885: This world will be summoned to the demi-plane after the phase interference phenomenon with creature fades."
  npc_override_1@lab_CentralLaboratory_menu_ma_eecbcb: "MA-4885: Temporarily shutting down main power for syntonization with transformed phase."
  npc_override_1@lab_CentralLaboratory_menu_ma_f0bb1b: "MA-4885: If there are any surviving organisms I wish you luck. I hope to see you again."
  npc_override_1@lab_CentralLaboratory_menu_ma_f69516: "MA-4885: Unidentifiable creature discovered. Temporarily shutting down main power."
  npc_override_1@lab_CentralLaboratory_menu_options_de2fc5: "?????: Ah, ah, one two one two, mic test."
  npc_override_1@lab_CentralLaboratory_menu_options_ebffda: "?????: Chief director Lona Fresa of project particle accelerator."
  npc_override_1@lab_CentralLaboratory_menu_party_328f2e: "Party: {0}"
  npc_override_1@lab_CentralLaboratory_menu_probationary_06bb5b: "Probationary researcher : You may now enter. Please note that you cannot open the door from the other side."
  npc_override_1@lab_CentralLaboratory_menu_probationary_f2ca31: "Probationary researcher : The access code matches. I will open the door."
  npc_override_1@lab_CentralLaboratory_menu_silvia_05f307: "Silvia : It's all over."
  npc_override_1@lab_CentralLaboratory_menu_silvia_223589: "Silvia : Fresa! Make a decision!"
  npc_override_1@lab_CentralLaboratory_menu_silvia_33f55d: "Silvia : Alright! Now Dr. Fresa just has to shut down the power."
  npc_override_1@lab_CentralLaboratory_menu_silvia_542e6e: "Silvia: Looks like it's over."
  npc_override_1@lab_CentralLaboratory_menu_silvia_5fac09: "Silvia : Generator voltage unstable. Still within tolerance band."
  npc_override_1@lab_CentralLaboratory_menu_silvia_682b04: "Silvia : Care is needed for operating a finished product for the first experiment."
  npc_override_1@lab_CentralLaboratory_menu_silvia_90b0f4: "Silvia: Can we not shut down main power completely?"
  npc_override_1@lab_CentralLaboratory_menu_silvia_916952: "Silvia : Gee, I don't know what will happen but I am curious about shifting dimensions. Don't mind me!"
  npc_override_1@lab_CentralLaboratory_menu_silvia_aed09c: "Silvia : Ah...... I should be seeing this while having chicken and beer..."
  npc_override_1@lab_CentralLaboratory_menu_silvia_bedb98: "Silvia : It is not a simple problem. The temperature has far exceeded the predicted numbers!"
  npc_override_1@lab_CentralLaboratory_menu_silvia_c7486c: "Silvia : Voltage is still within the tolerance band."
  npc_override_1@lab_CentralLaboratory_menu_silvia_cd45ca: "Silvia: Same as the last time. It seems to have no interest in us."
  npc_override_1@lab_CentralLaboratory_menu_silvia_d41b1d: "Silvia: Let's just calm down. And get out of this dreadful laboratory."
  npc_override_1@lab_CentralLaboratory_menu_silvia_dec84f: "Silvia : It isn't reacting to us. Maybe it can't see us?"
  npc_override_1@lab_CentralLaboratory_menu_silvia_e415e2: "Silvia : Ah! I like that too! Call me when you go."
  npc_override_1@lab_CentralLaboratory_menu_silvia_ef37ca: "Silvia : Detecting heat close to the tolerance band between the catalyst bed and the accelerator!"
  npc_override_1@lab_CentralLaboratory_menu_vincent_26f384: "Vincent : Accelerator is heating."
  npc_override_1@lab_CentralLaboratory_menu_vincent_608149: "Vincent : We should at least evacuate the people in the other labs."
  npc_override_1@lab_CentralLaboratory_menu_vincent_73e7e9: "Vincent : Seems more magnanimous than we are. Fresa!!! Are you listening? Sound the alarm!"
  npc_override_1@lab_CentralLaboratory_menu_vincent_882ca8: "Vincent : 670c It's heating up too fast!"
  npc_override_1@lab_CentralLaboratory_menu_vincent_932679: "Vincent : What is going on. Somebody turn off that computer!"
  npc_override_1@lab_CentralLaboratory_menu_vincent_9d3cbb: "Vincent : Oh... damnit. This is why you shouldn't install the newest CPU."
  npc_override_1@lab_CentralLaboratory_menu_vincent_a12d20: "Vincent: 320c."
  npc_override_1@lab_CentralLaboratory_menu_vincent_b2a7b5: "Vincent : But it is hostile to the project assistants! What is that creature!?"
  npc_override_1@lab_CentralLaboratory_menu_vincent_b8a6e4: "Vincent: Let's completely shut down the mother computer while the main power is temporarily off!"
  npc_override_1@lab_CentralLaboratory_menu_vincent_c31948: "Vincent : Broke through 1000c!!!! Dr. Fresa! We have to momentarily stop the device!"
  npc_override_1@lab_CentralLaboratory_menu_vincent_c60a9d: "Vincent : Ah, I hope we can finish quickly so I can go eat chicken."
  npc_override_1@lab_CentralLaboratory_menu_vincent_e48908: "Vincent : Starting rotation of generator."
  npc_override_1@lab_CentralLaboratory_menu_vincent_e5e9bf: "Vincent : I wonder if the others evacuated?"
  npc_override_1@lab_CentralLaboratory_menu_vincent_e64e2a: "Vincent : I can't move my body! I think space is frozen!"
  npc_override_1@lab_CentralLaboratory_menu_vincent_ed5c94: "Vincent: Fresa! We don't have time! Turn off the computer!!"
  npc_override_1@lab_CentralLaboratory_menu_vincent_fd0ae7: "Vincent : By the way... I still can't move so what is going on?"
  npc_override_1@lab_CentralLaboratory_mm_s_right_there_definit_96a201: "Mm that's right. There definitely was the word Chicken. I don't know what kind of combination of technology that may be..."
  npc_override_1@lab_CentralLaboratory_mother_computer_lsi_chip_26252d: "^0000ffMother Computer^000000 or, ^0000ff LSI Chip^000000 Or, and what else. ^0000ffChicken^000000?"
  npc_override_1@lab_CentralLaboratory_my_aim_research_use_tech_1f282f: "My aim is to research the use of technology related to the relevant times. Even though what I have found out so far is insignificant."
  npc_override_1@lab_CentralLaboratory_observing_soil_strata_es_244624: "Observing the soil strata it is estimated to be 500 to 600 years old!"
  npc_override_1@lab_CentralLaboratory_on_387d7a: "ON"
  npc_override_1@lab_CentralLaboratory_party_entering_central_l_5a6dd8: "{0} of the party, {1}, is entering Central Laboratory."
  npc_override_1@lab_CentralLaboratory_passage_dimensional_movi_1ec566: "The passage for dimensional moving has not been vitalized."
  npc_override_1@lab_CentralLaboratory_please_hold_i_am_speakin_048172: "Please hold. I am speaking with the guide about whether or not you have been authorized."
  npc_override_1@lab_CentralLaboratory_please_talk_me_after_com_3524a9: "Please talk to me after composing a party of 1 or more, or after joining a party."
  npc_override_1@lab_CentralLaboratory_produce_crack_time_d81d77: "Produce a crack of time"
  npc_override_1@lab_CentralLaboratory_referrenced_records_peop_26f1b4: "It is referrenced in the records of people who seem to 'root' amongst the many traces of technology."
  npc_override_1@lab_CentralLaboratory_seems_you_here_participa_146718: "It seems you are here to participate in the particle acceleration experiment."
  npc_override_1@lab_CentralLaboratory_seems_you_re_wrong_labor_fa8b66: "It seems you're in the wrong laboratory. Please exit and ask for help."
  npc_override_1@lab_CentralLaboratory_silvia_looking_particle_8a6e23: "^0000ffSilvia is looking at the particle accelerator device with a very exhausted look.^000000"
  npc_override_1@lab_CentralLaboratory_size_i_wonder_if_s_053b4c: "With this size I wonder if it's possible to create a small scale black hole..."
  npc_override_1@lab_CentralLaboratory_switch_9bfe57: "[Switch {0}]"
  npc_override_1@lab_CentralLaboratory_switch_currently_positio_3a38c7: "The switch is currently in the {0} position. What will you do?"
  npc_override_1@lab_CentralLaboratory_taming_monsters_impede_p_b5d037: "^ff0000Taming monsters will impede progress in this dungeon. Please take note of this.^000000"
  npc_override_1@lab_CentralLaboratory_there_lot_interesting_th_696bf1: "There are a lot of interesting things about the ancient civilizations in this area."
  npc_override_1@lab_CentralLaboratory_there_remaining_traces_l_0e923b: "There are remaining traces of the last event. Access denied."
  npc_override_1@lab_CentralLaboratory_there_some_remaining_aft_b30f93: "There are some remaining aftereffects of dimensional travel. We cannot travel again in this condition."
  npc_override_1@lab_CentralLaboratory_today_s_access_code_14eab8: "Today's access code is ^0000ff{0}^000000."
  npc_override_1@lab_CentralLaboratory_today_s_access_code_curr_d89ef1: "Today's access code {0}, currently entered code {1}."
  npc_override_1@lab_CentralLaboratory_topic_i_interested_d35257: "It is not a topic I would be interested in."
  npc_override_1@lab_CentralLaboratory_unfortunate_c57c2d: "Unfortunate."
  npc_override_1@lab_CentralLaboratory_unknown_error_2ab07a: "Unknown Error."
  npc_override_1@lab_CentralLaboratory_use_dimension_mover_seem_e18b70: "^0000ffUse of Dimension-mover seems possible.^000000"
  npc_override_1@lab_CentralLaboratory_we_need_about_seconds_ti_3cbc23: "We need about 5 seconds of time. Confirming access code."
  npc_override_1@lab_CentralLaboratory_well_i_don_t_know_a25854: "Well... I don't know if you can come in handy, it seems that there is still a gap!"
  npc_override_1@lab_CentralLaboratory_what_kind_unknown_terms_1bb192: "What kind of unknown terms?"
  npc_override_1@lab_CentralLaboratory_what_you_want_time_b5c58e: "What do you want to do this time?"
  npc_override_1@lab_CentralLaboratory_when_crack_time_opens_ta_9fbee7: "When the crack of time opens take a breath and speak again."
  npc_override_1@lab_CentralLaboratory_when_you_become_stronger_46c241: "When you become stronger, come back to me. You should be almost level 135!"
  npc_override_1@lab_CentralLaboratory_which_time_you_want_go_4edc2b: "Which time do you want to go?"
  npc_override_1@lab_CentralLaboratory_yes_c53c56: "Yes."
  npc_override_1@lab_CentralLaboratory_you_adventurer_tell_me_w_50080c: "You are an adventurer. Tell me what you decide to do."
  npc_override_1@lab_CentralLaboratory_you_companion_join_you_o_9598b7: "Do you not have a companion to join you? Organize your party even if traveling alone."
  npc_override_1@lab_CentralLaboratory_you_participating_as_ass_0581bf: "Are you participating as assistants to the experiments of research project 32001?"
