Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@lab_CentralLaboratory_after_entering_code_pres_842681: "After entering the code press the main button near the entrance."
  npc_override_1@lab_CentralLaboratory_after_experiment_i_want_4becdb: "After the experiment I want to go home and enjoy an ice cold beer and some fried chicken."
  npc_override_1@lab_CentralLaboratory_ah_i_just_talking_such_8c8ef2: "Ah, I was just talking. Such an event is closer to a disaster than an experiment haha."
  npc_override_1@lab_CentralLaboratory_ah_oh_no_db3667: "Ah, oh no."
  npc_override_1@lab_CentralLaboratory_ah_you_aren_t_party_5d8db9: "Ah. You aren't the party leader. Take me to your leader! Or perhaps take your leader to me."
  npc_override_1@lab_CentralLaboratory_all_handled_well_bb5460: "All handled well!"
  npc_override_1@lab_CentralLaboratory_all_traces_entering_cent_a49159: "^0000ffAll the traces of entering the central laboratory have been erased. Speaking with the Civilization Explorer seems possible.^000000"
  npc_override_1@lab_CentralLaboratory_any_chance_you_intereste_5d6f1c: "By any chance, would you interested in traveling to the past?"
  npc_override_1@lab_CentralLaboratory_artemia_worries_too_much_962b5f: "Artemia worries too much. Anyway I'm going on a trip after the experiment."
  npc_override_1@lab_CentralLaboratory_cancel_77dfd2: "Cancel"
  npc_override_1@lab_CentralLaboratory_central_laboratory_unkno_d4634f: "^0000ffCentral Laboratory ^000000 - Unknown Error"
  npc_override_1@lab_CentralLaboratory_code_needs_entered_as_bi_e4f59e: "The code needs to be entered as a binary number. Use the switches behind me to enter it."
  npc_override_1@lab_CentralLaboratory_device_more_amazing_more_eefd5d: "This device is more amazing the more I look at. There has never been a particle accelerator made in this scale."
  npc_override_1@lab_CentralLaboratory_dimensional_distortion_h_2035d6: "A dimensional distortion can happen with such a powerful particle acceleration."
  npc_override_1@lab_CentralLaboratory_door_open_so_you_may_ff71c6: "The door is open so you may now enter. Please note that you cannot open the door from the other side."
  npc_override_1@lab_CentralLaboratory_entrance_door_already_op_990e49: "The entrance door is already open."
  npc_override_1@lab_CentralLaboratory_even_better_if_you_show_937a7a: "Even better if you show me around if you find an interesting object."
  npc_override_1@lab_CentralLaboratory_how_i_assist_you_cc894b: "How can I assist you?"
  npc_override_1@lab_CentralLaboratory_i_bad_feeling_about_beca_30a0a5: "I have a bad feeling about this because... Nature finds a way."
  npc_override_1@lab_CentralLaboratory_i_haven_t_been_home_d38fe1: "I haven't been home for almost 2 years."
  npc_override_1@lab_CentralLaboratory_if_i_had_my_way_c1f7a8: "If I had it my way I would use the dimension mover to see for myself but there's too much work. Besides I am not an adventurer..."
  npc_override_1@lab_CentralLaboratory_interested_5ee0b1: "Not interested."
  npc_override_1@lab_CentralLaboratory_look_reality_doesn_t_lik_7b1640: "Look, reality doesn't like it when you grab a piece of string and give it a tug."
  npc_override_1@lab_CentralLaboratory_lot_undefined_terms_foun_6e8d00: "A lot of undefined terms are found in the recovered records as well."
  npc_override_1@lab_CentralLaboratory_machine_perfect_nothing_20f016: "The machine is perfect. Nothing will go wrong!"
  npc_override_1@lab_CentralLaboratory_many_excavated_objects_h_02c6d6: "But many of the excavated objects here already far surpass our current technology."
  npc_override_1@lab_CentralLaboratory_menu_leader_4d6811: "Leader: {0}"
  npc_override_1@lab_CentralLaboratory_menu_party_328f2e: "Party: {0}"
  npc_override_1@lab_CentralLaboratory_mm_s_right_there_definit_96a201: "Mm that's right. There definitely was the word Chicken. I don't know what kind of combination of technology that may be..."
  npc_override_1@lab_CentralLaboratory_mother_computer_lsi_chip_26252d: "^0000ffMother Computer^000000 or, ^0000ff LSI Chip^000000 Or, and what else. ^0000ffChicken^000000?"
  npc_override_1@lab_CentralLaboratory_my_aim_research_use_tech_1f282f: "My aim is to research the use of technology related to the relevant times. Even though what I have found out so far is insignificant."
  npc_override_1@lab_CentralLaboratory_observing_soil_strata_es_244624: "Observing the soil strata it is estimated to be 500 to 600 years old!"
  npc_override_1@lab_CentralLaboratory_on_387d7a: "ON"
  npc_override_1@lab_CentralLaboratory_passage_dimensional_movi_1ec566: "The passage for dimensional moving has not been vitalized."
  npc_override_1@lab_CentralLaboratory_please_hold_i_am_speakin_048172: "Please hold. I am speaking with the guide about whether or not you have been authorized."
  npc_override_1@lab_CentralLaboratory_please_talk_me_after_com_3524a9: "Please talk to me after composing a party of 1 or more, or after joining a party."
  npc_override_1@lab_CentralLaboratory_produce_crack_time_d81d77: "Produce a crack of time"
  npc_override_1@lab_CentralLaboratory_referrenced_records_peop_26f1b4: "It is referrenced in the records of people who seem to 'root' amongst the many traces of technology."
  npc_override_1@lab_CentralLaboratory_seems_you_here_participa_146718: "It seems you are here to participate in the particle acceleration experiment."
  npc_override_1@lab_CentralLaboratory_seems_you_re_wrong_labor_fa8b66: "It seems you're in the wrong laboratory. Please exit and ask for help."
  npc_override_1@lab_CentralLaboratory_silvia_looking_particle_8a6e23: "^0000ffSilvia is looking at the particle accelerator device with a very exhausted look.^000000"
  npc_override_1@lab_CentralLaboratory_size_i_wonder_if_s_053b4c: "With this size I wonder if it's possible to create a small scale black hole..."
  npc_override_1@lab_CentralLaboratory_switch_9bfe57: "[Switch {0}]"
  npc_override_1@lab_CentralLaboratory_switch_currently_positio_3a38c7: "The switch is currently in the {0} position. What will you do?"
  npc_override_1@lab_CentralLaboratory_taming_monsters_impede_p_b5d037: "^ff0000Taming monsters will impede progress in this dungeon. Please take note of this.^000000"
  npc_override_1@lab_CentralLaboratory_there_lot_interesting_th_696bf1: "There are a lot of interesting things about the ancient civilizations in this area."
  npc_override_1@lab_CentralLaboratory_there_remaining_traces_l_0e923b: "There are remaining traces of the last event. Access denied."
  npc_override_1@lab_CentralLaboratory_there_some_remaining_aft_b30f93: "There are some remaining aftereffects of dimensional travel. We cannot travel again in this condition."
  npc_override_1@lab_CentralLaboratory_today_s_access_code_14eab8: "Today's access code is ^0000ff{0}^000000."
  npc_override_1@lab_CentralLaboratory_topic_i_interested_d35257: "It is not a topic I would be interested in."
  npc_override_1@lab_CentralLaboratory_unfortunate_c57c2d: "Unfortunate."
  npc_override_1@lab_CentralLaboratory_unknown_error_2ab07a: "Unknown Error."
  npc_override_1@lab_CentralLaboratory_use_dimension_mover_seem_e18b70: "^0000ffUse of Dimension-mover seems possible.^000000"
  npc_override_1@lab_CentralLaboratory_we_need_about_seconds_ti_3cbc23: "We need about 5 seconds of time. Confirming access code."
  npc_override_1@lab_CentralLaboratory_well_i_don_t_know_a25854: "Well... I don't know if you can come in handy, it seems that there is still a gap!"
  npc_override_1@lab_CentralLaboratory_what_kind_unknown_terms_1bb192: "What kind of unknown terms?"
  npc_override_1@lab_CentralLaboratory_what_you_want_time_b5c58e: "What do you want to do this time?"
  npc_override_1@lab_CentralLaboratory_when_crack_time_opens_ta_9fbee7: "When the crack of time opens take a breath and speak again."
  npc_override_1@lab_CentralLaboratory_when_you_become_stronger_46c241: "When you become stronger, come back to me. You should be almost level 135!"
  npc_override_1@lab_CentralLaboratory_which_time_you_want_go_4edc2b: "Which time do you want to go?"
  npc_override_1@lab_CentralLaboratory_yes_c53c56: "Yes."
  npc_override_1@lab_CentralLaboratory_you_adventurer_tell_me_w_50080c: "You are an adventurer. Tell me what you decide to do."
  npc_override_1@lab_CentralLaboratory_you_companion_join_you_o_9598b7: "Do you not have a companion to join you? Organize your party even if traveling alone."
  npc_override_1@lab_CentralLaboratory_you_participating_as_ass_0581bf: "Are you participating as assistants to the experiments of research project 32001?"
