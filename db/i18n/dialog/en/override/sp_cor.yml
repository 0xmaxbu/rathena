  npc_override_sp_cor_quests_17_1_carefully_closed_box_aga_668b08: "- Carefully closed the box again. -"
  npc_override_sp_cor_quests_17_1_catch_aphids_eb6b73: "Catch aphids."
  npc_override_sp_cor_quests_17_1_certainly_papers_i_ve_re_f9fab9: "This is certainly not in the papers I've received. There were only mentions of departures and few transfers. All the details were missing."
