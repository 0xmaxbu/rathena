  npc_override_sp_cor_quests_17_1_awkward_5d2e7c: "This is awkward."
  npc_override_sp_cor_quests_17_1_bad_listen_don_t_bother_a161be: "Is it bad to listen? Don't bother with them it's not worth your time."
