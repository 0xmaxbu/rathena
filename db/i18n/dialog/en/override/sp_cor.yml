  npc_override_sp_cor_quests_17_1_day_incident_midnight_gu_588484: "On the day of the incident, at midnight, the guards changed uniform for something unusual."
  npc_override_sp_cor_quests_17_1_daytime_our_team_charge_62c7f0: "In the daytime, our team is in charge of patrols and security. At nighttime, the security guards of Schlein take over."
  npc_override_sp_cor_quests_17_1_dear_adventurer_you_forg_7d17ff: "Dear adventurer, have you forgotten who's been helping you now? The Rebellion has been roaming these areas."
