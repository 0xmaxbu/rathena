  npc_override_sp_cor_quests_17_1_if_we_re_going_raid_f4c15a: "If we're going to have a raid next time, we'll have to be thorough."
  npc_override_sp_cor_quests_17_1_if_we_refuse_comply_what_78aa8d: "If we refuse to comply, what's gonna happen? Are you going to shoot us?"
