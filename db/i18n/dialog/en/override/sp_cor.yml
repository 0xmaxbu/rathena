  npc_override_sp_cor_quests_17_1_don_t_take_too_personal_8b6633: "Don't take it too personal. Who in the world only has one name?"
  npc_override_sp_cor_quests_17_1_don_t_worry_about_me_f7c190: "Don't worry about me."
  npc_override_sp_cor_quests_17_1_don_t_worry_i_belong_c256c7: "Don't worry I belong to the Secret Wing."
  npc_override_sp_cor_quests_17_1_don_t_worry_s_alright_c80e33: "Don't worry, it's alright. You know it's all true."
  npc_override_sp_cor_quests_17_1_don_t_worry_you_won_57938c: "Don't worry, you won't die."
  npc_override_sp_cor_quests_17_1_don_t_you_go_headquarter_47e060: "Don't you have to go the headquarters to investigate?"
  npc_override_sp_cor_quests_17_1_don_t_you_know_who_88401e: "Don't you know who I am? I'm Schwarzwald's--no, the continent's greatest machine learning researcher. I bet you all have seen my serviceroids."
  npc_override_sp_cor_quests_17_1_don_t_you_know_why_4e3752: "Don't you know why we're called the Rebellion in the first place?"
