  npc_override_sp_cor_quests_17_1_mansion_s_manager_stayin_c9c8f5: "The mansion's manager is staying near the garden. be sure to meet them first."
  npc_override_sp_cor_quests_17_1_many_missing_people_schw_d45863: "Many of the missing people of Schwarzwald would end up here. Are you going to investigate every single one of them? If you had enough time, it wouldn't be a bad thing."
