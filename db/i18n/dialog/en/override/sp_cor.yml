  npc_override_sp_cor_quests_17_1_as_lazy_saying_even_if_348f23: "As Lazy was saying... Even if you called Lazy by Shit, Lazy would still be Lazy."
  npc_override_sp_cor_quests_17_1_as_lazy_saying_i_think_a4890b: "As Lazy was saying, I think Rekenber has used these people because of their desperation."
  npc_override_sp_cor_quests_17_1_as_now_rekenber_now_dedi_0ce3f2: "As of now, Rekenber will now ^0000FFdedicate itself to cooperate with the investigation.^000000 Please tell me everything you need. We'll support you anyway we can."
