  npc_override_sp_cor_quests_17_1_chief_researchers_here_k_b371a1: "The chief researchers here know all the details. I honestly didn't know they would just leave like that. I thought they were like a family to me..."
  npc_override_sp_cor_quests_17_1_chief_told_me_pack_my_25e6ad: "The chief told me to pack my bags because there was a disturbance outside. I was hesitating because I had to take care of my crops, but then everyone had already left."
  npc_override_sp_cor_quests_17_1_citizen_s_safety_threate_140c63: "The citizen's safety is threatened,"
  npc_override_sp_cor_quests_17_1_clusters_small_green_gra_1ce0bf: "Clusters of small green grapes are hanging from the healthy-looking grapevines."
  npc_override_sp_cor_quests_17_1_clusters_small_green_gra_d777fe: "Clusters of small green grapes are hanging from the rejuvenated grapevines."
