  npc_override_sp_cor_quests_17_1_anyway_i_m_looking_navi_a0e4cc: "Anyway, I'm looking for a <NAVI>[person]<INFO>sp_cor,151,180,0,101,0</INFO></NAVI> to do my laundry. It's been a while and my feet are dirty."
  npc_override_sp_cor_quests_17_1_anyway_i_m_looking_navi_cd956b: "Anyway, I'm looking for a <NAVI>[person]<INFO>sp_cor,151,180,0,000,0</INFO></NAVI> to do my laundry. It's been a while and my feet are dirty."
  npc_override_sp_cor_quests_17_1_anyway_i_should_go_beyon_9d6aaf: "Anyway, I should go beyond the barrier to get satisfying information for Tes?"
  npc_override_sp_cor_quests_17_1_anyway_if_you_re_looking_35ca37: "Anyway, if you're looking for someone in particular, you should ^0000FFask the researchers.^000000 Most of them already ran away, but a few stayed behind."
  npc_override_sp_cor_quests_17_1_anyway_if_you_want_know_6b06ce: "Anyway, if you want to know more, check out the <NAVI>[incinerator]<INFO>sp_cor,70,263,0,101,0</INFO></NAVI>."
