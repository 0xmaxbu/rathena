  npc_override_sp_cor_quests_17_1_if_something_suspicious_5e1e19: "If something suspicious comes up, Leave it to me!"
  npc_override_sp_cor_quests_17_1_if_there_s_nothing_speci_191f35: "If there's nothing special, I'll just leave. But if there is something there at all, Should I use my full strength?"
  npc_override_sp_cor_quests_17_1_if_there_s_problem_how_2e9d24: "If there's a problem on how things are going, please let us know. From his childhood, he's always been listening closely and he can fix anything."
