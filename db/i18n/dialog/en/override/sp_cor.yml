  npc_override_sp_cor_quests_17_1_look_like_your_sister_ma_244c6d: "It look like your sister has made some kind of deal with the president."
  npc_override_sp_cor_quests_17_1_look_over_here_strange_af1524: "Look over here, is it not strange?"
  npc_override_sp_cor_quests_17_1_look_s_all_nice_good_57768f: "Look, that's all nice and good to have ^0000CDfacts^000000. But this is not even something you can use as a firepower."
  npc_override_sp_cor_quests_17_1_looks_better_than_barrie_cd0c62: "It looks better than the barrier."
  npc_override_sp_cor_quests_17_1_looks_like_livestock_stu_5c3f47: "It looks like livestock study."
  npc_override_sp_cor_quests_17_1_looks_like_navi_aas_info_5dbd5b: "It looks like <NAVI>[Aas]<INFO>sp_cor,135,147,0,101,0</INFO></NAVI> is concerned about the wounded people. Let's hear what she wants to talk about."
  npc_override_sp_cor_quests_17_1_looks_like_navi_aas_info_edaa8d: "It looks like <NAVI>[Aas]<INFO>sp_cor,135,147,0,101,0</INFO></NAVI> is concerned about the injured. Let's go see what she wants to talk about."
  npc_override_sp_cor_quests_17_1_looks_like_there_aren_t_d8d28e: "It looks like there aren't enough to go inside..."
