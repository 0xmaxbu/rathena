  npc_override_sp_cor_quests_17_1_come_think_your_name_was_f62887: "Come to think of it, your name wasn't on the employee list from the company."
  npc_override_sp_cor_quests_17_1_company_doesn_t_investig_fdce82: "The company doesn't investigate private matters. It's private for a reason. Ask yourself if you'd want someone else to look into your private matters."
