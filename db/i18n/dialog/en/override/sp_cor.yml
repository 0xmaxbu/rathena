  npc_override_sp_cor_quests_17_1_i_m_fine_957b0a: "I'm fine."
  npc_override_sp_cor_quests_17_1_i_m_fine_daisy_s_39075f: "I'm fine with Daisy's idea. It makes the most sense."
  npc_override_sp_cor_quests_17_1_i_m_first_arrive_ac0e72: "I'm the first to arrive..."
  npc_override_sp_cor_quests_17_1_i_m_glad_hear_all_629169: "I'm glad to hear not all of you are bad people."
  npc_override_sp_cor_quests_17_1_i_m_glad_we_re_3c4edf: "I'm glad that we're able to open it and move inside."
  npc_override_sp_cor_quests_17_1_i_m_going_back_my_374102: "I'm going back to my laboratory and do some research."
  npc_override_sp_cor_quests_17_1_i_m_going_inside_afe5a4: "I'm going inside."
  npc_override_sp_cor_quests_17_1_i_m_going_make_sure_47a7c5: "I'm going to make sure of what I saw by going back up!"
  npc_override_sp_cor_quests_17_1_i_m_going_rudus_155b93: "I'm going to Rudus."
  npc_override_sp_cor_quests_17_1_i_m_going_try_find_de3013: "I'm going to try and find more information about the new laboratories."
  npc_override_sp_cor_quests_17_1_i_m_heading_back_cat_b30745: "I'm heading back to Cat on Bullet and I'll be resting a bit."
  npc_override_sp_cor_quests_17_1_i_m_investigating_missin_2547d5: "I'm investigating missing people."
  npc_override_sp_cor_quests_17_1_i_m_joking_s_dangerous_dbd875: "I'm not joking, it's dangerous."
  npc_override_sp_cor_quests_17_1_i_m_little_too_excited_3fde92: "I'm a little too excited. I'll shut up. Tes, explain it please."
  npc_override_sp_cor_quests_17_1_i_m_looking_patrick_kauf_ab60c9: "I'm looking for Patrick Kaufmann."
  npc_override_sp_cor_quests_17_1_i_m_looking_person_ab78b9: "I'm looking for a person."
  npc_override_sp_cor_quests_17_1_i_m_okay_others_033c57: "I'm okay, but the others..."
  npc_override_sp_cor_quests_17_1_i_m_quite_serious_don_be16ba: "I'm quite serious, don't you believe me VIP?"
  npc_override_sp_cor_quests_17_1_i_m_sick_too_if_a2194e: "I'm sick too! If I sleep, it will be cured in a day!"
  npc_override_sp_cor_quests_17_1_i_m_so_curious_what_4e5dfd: "I'm so curious what the inside looks like~"
  npc_override_sp_cor_quests_17_1_i_m_sorry_i_got_d079ae: "I'm sorry, I got worked up."
  npc_override_sp_cor_quests_17_1_i_m_sorry_i_t_903d95: "I'm sorry I can't help you anymore."
  npc_override_sp_cor_quests_17_1_i_m_sorry_keep_asking_60db47: "I'm sorry to keep asking these hard task for you. If you can bring me their bracelets, I will reward you."
  npc_override_sp_cor_quests_17_1_i_m_sorry_you_re_b0f787: "I'm sorry, but you're not allowed to go inside."
  npc_override_sp_cor_quests_17_1_i_m_sure_employees_don_c8695d: "I'm sure the employees don't come visit their home during their vacations. Isn't it a ^0000FFprivacy matter^000000 that is none of our business?"
  npc_override_sp_cor_quests_17_1_i_m_sure_rebellions_who_85c58c: "but I'm sure the rebellions who entered the mansion, is fine."
  npc_override_sp_cor_quests_17_1_i_m_telling_you_s_6b6cff: "I'm telling you it's common sense~"
  npc_override_sp_cor_quests_17_1_i_m_too_busy_glaring_c4ca8f: "(I'm too busy glaring right now!)"
  npc_override_sp_cor_quests_17_1_i_m_too_sure_about_f928d8: "I'm not too sure about the locks on the inside, so I don't know yet."
  npc_override_sp_cor_quests_17_1_i_m_usually_these_places_1bac1f: "I'm usually not in these places, we should continue this meeting in the Vice President's office."
  npc_override_sp_cor_quests_17_1_i_m_watch_duty_here_a0ce9a: "I'm on watch duty here, to keep strangers away."
  npc_override_sp_cor_quests_17_1_i_mean_how_you_think_d34461: "I mean, how do you think the researchers have brainwashed these people over the years?"
  npc_override_sp_cor_quests_17_1_i_mean_if_document_credi_9229dd: "I mean, if this document is credible at anyway, then you're calling me a liar, Vice President!"
  npc_override_sp_cor_quests_17_1_i_need_find_out_what_1ef0fe: "I need to find out what's beyond the barrier."
  npc_override_sp_cor_quests_17_1_i_need_guard_i_came_fb6932: "I do not need a guard. I came here by myself the first time around. I will be just fine this time too."
  npc_override_sp_cor_quests_17_1_i_need_know_more_about_00fe08: "I need to know more about the current situation."
  npc_override_sp_cor_quests_17_1_i_need_know_why_they_1d9ae6: "I need to know why they broke the contract rules."
  npc_override_sp_cor_quests_17_1_i_need_some_time_sort_65f01a: "I need some time to sort out the bracelets that you've brought earlier."
  npc_override_sp_cor_quests_17_1_i_need_witness_future_0a8743: "I will need a witness in the future."
  npc_override_sp_cor_quests_17_1_i_never_called_you_liar_e3b020: "I never called you a liar..."
  npc_override_sp_cor_quests_17_1_i_never_hurt_you_guys_cb359f: "I would never hurt you guys."
  npc_override_sp_cor_quests_17_1_i_never_said_0796e5: "I never said that."
  npc_override_sp_cor_quests_17_1_i_no_intention_debating_f6c1f8: "I have no intention of debating this further with you, so I'll talk to the person in charge."
  npc_override_sp_cor_quests_17_1_i_one_who_made_all_0cf8f6: "I was the one who made all this stuff and never once questioned it..."
  npc_override_sp_cor_quests_17_1_i_only_waiting_you_come_8539bb: "I was only waiting for you to come."
  npc_override_sp_cor_quests_17_1_i_opened_entrance_here_l_534203: "I opened the entrance here last night."
  npc_override_sp_cor_quests_17_1_i_prefer_going_outside_f_554860: "I prefer going outside on the field and learn with my own eyes."
  npc_override_sp_cor_quests_17_1_i_pulled_weeds_around_gr_0f50ed: "I pulled weeds around the grapes."
  npc_override_sp_cor_quests_17_1_i_pulled_weeds_around_gr_389860: "I pulled weeds around the green beans."
  npc_override_sp_cor_quests_17_1_i_pulled_weeds_around_pu_151d29: "I pulled weeds around the pumpkin vines."
  npc_override_sp_cor_quests_17_1_i_rather_my_life_cut_4c9af5: "I would have rather have my life cut off short than living just a second as a monster. Got it?"
  npc_override_sp_cor_quests_17_1_i_rather_use_force_than_b1c4d9: "I would rather use force than make compromises."
  npc_override_sp_cor_quests_17_1_i_realized_papers_easy_t_ccd56e: "I realized that papers are easy tools to deceive someone who's only sitting at a desk and doing their own thing."
  npc_override_sp_cor_quests_17_1_i_really_appreciate_2fbe7a: "I would really appreciate it."
  npc_override_sp_cor_quests_17_1_i_really_don_t_know_57b1f8: "... I really don't know what the others did in their rooms."
  npc_override_sp_cor_quests_17_1_i_really_late_what_all_9668da: "Was I really this late? What is all of this, why is everyone wounded?"
  npc_override_sp_cor_quests_17_1_i_really_like_here_don_ae340c: "I really like it here. Don't forget about the adventure, there's nothing to worry about."
  npc_override_sp_cor_quests_17_1_i_really_t_believe_they_2c8eab: "I really can't believe they did illegal experiments on this place. Why does it look so nice?"
  npc_override_sp_cor_quests_17_1_i_refused_left_only_watc_29af1d: "I refused and left, only to watch more guards suffering."
  npc_override_sp_cor_quests_17_1_i_rest_shouldn_t_i_42fdc3: "Can I rest? Shouldn't I get back to work? If I don't work, my family will starve."
  npc_override_sp_cor_quests_17_1_i_said_your_bodies_weren_307e22: "I said your bodies weren't healthy, but who said anything about dying?"
  npc_override_sp_cor_quests_17_1_i_say_common_sense_front_57da8d: "I can say common sense in front of people who have studied hard~"
  npc_override_sp_cor_quests_17_1_i_searched_ground_found_3f92ec: "I searched the ground and found a note someone buried."
  npc_override_sp_cor_quests_17_1_i_see_fd141e: "I see..."
  npc_override_sp_cor_quests_17_1_i_see_there_entrance_6b7d45: "I see... There was an entrance..."
  npc_override_sp_cor_quests_17_1_i_see_what_purpose_who_b381e0: "I see, what is the purpose. And... who are you again?"
  npc_override_sp_cor_quests_17_1_i_see_you_again_dawn_618682: "I will see you again at dawn."
  npc_override_sp_cor_quests_17_1_i_seem_like_joke_you_0272c4: "Do I seem like a joke to you VIP?"
  npc_override_sp_cor_quests_17_1_i_send_everything_085597: "I would send everything."
  npc_override_sp_cor_quests_17_1_i_sent_person_pick_perso_1450e6: "I sent a person to pick the person in charge. We are the Advance Squad who was sent here to search and recon this place, but as you can see..."
  npc_override_sp_cor_quests_17_1_i_should_able_handle_the_9080ba: "I should be able to handle them quickly."
  npc_override_sp_cor_quests_17_1_i_should_checked_if_you_f8d75c: "I should have checked if you talked to the others before you talked to us. Now, it's too late."
  npc_override_sp_cor_quests_17_1_i_should_go_explain_situ_bfe892: "I should go and explain the situation in more details..."
  npc_override_sp_cor_quests_17_1_i_should_looked_them_mor_63f761: "I should have looked at them more, but I don't have enough resources..."
  npc_override_sp_cor_quests_17_1_i_should_probably_use_mo_dd54c6: "I should probably use it more often from now on?"
  npc_override_sp_cor_quests_17_1_i_so_close_transplanting_81b3a2: "I was so close to transplanting human minds into my machines."
  npc_override_sp_cor_quests_17_1_i_so_many_things_talk_a03eba: "I have so many things to talk about. I can talk about them all day long."
  npc_override_sp_cor_quests_17_1_i_something_ask_you_083a23: "I have something to ask you."
  npc_override_sp_cor_quests_17_1_i_something_i_must_you_ab3cab: "I have something I must do. You do what you have to do on your end."
  npc_override_sp_cor_quests_17_1_i_sound_weird_when_i_db249c: "Do I sound weird when I say stuff like that? I think I'm losing it a little."
  npc_override_sp_cor_quests_17_1_i_spread_fertilizer_arou_1b8675: "I spread fertilizer around the green beans."
  npc_override_sp_cor_quests_17_1_i_spread_fertilizer_arou_e2e62e: "I spread fertilizer around the grapes."
  npc_override_sp_cor_quests_17_1_i_spread_fertilizer_pump_ad4e66: "I spread fertilizer on the pumpkin vines."
  npc_override_sp_cor_quests_17_1_i_still_cannot_conclude_61a638: "I still cannot conclude that they're missing."
  npc_override_sp_cor_quests_17_1_i_still_keep_bargain_4ff198: "...Can I still keep the bargain?"
  npc_override_sp_cor_quests_17_1_i_t_believe_area_disguis_056a6b: "I can't believe this area is disguised as an abandoned mine."
  npc_override_sp_cor_quests_17_1_i_t_chief_researcher_att_cb5a44: "I can't... the chief researcher attacked us."
  npc_override_sp_cor_quests_17_1_i_t_control_them_complet_d6f8d0: "I can't control them! ... This is completely unexpected."
  npc_override_sp_cor_quests_17_1_i_t_get_through_them_de8ccb: "I can't get through to them just with words."
  npc_override_sp_cor_quests_17_1_i_t_go_now_when_c0a740: "I can't go now, but when I'm old enough, I'll go and work. I don't have time to play."
  npc_override_sp_cor_quests_17_1_i_t_help_we_re_d1670b: "I can't help it. We're wasting our time with them, why bother? What's wrong? Do you have nothing to say?"
  npc_override_sp_cor_quests_17_1_i_t_keep_working_as_fba964: "I can't keep working as the Vice President while the Enterprise is in this state."
  npc_override_sp_cor_quests_17_1_i_t_say_anything_about_e4fc7a: "I can't say anything about that."
  npc_override_sp_cor_quests_17_1_i_t_stand_now_i_4bd08c: "I can't stand now, I was soaked in blood earlier. I would have followed them but I couldn't stand."
  npc_override_sp_cor_quests_17_1_i_t_thank_you_enough_e7c8ab: "I can't thank you enough."
  npc_override_sp_cor_quests_17_1_i_talked_other_captains_44658b: "I talked to the other captains of the Rebellion, and have decided to evacuate everyone in this area and release our elite troops for his search."
  npc_override_sp_cor_quests_17_1_i_think_greatly_help_if_edbe4b: "I think it would greatly help if you joined her team too.."
  npc_override_sp_cor_quests_17_1_i_think_i_heard_as_7f964c: "I think I heard as much as I need to here. We'll find the rest of the information in the headquarters."
  npc_override_sp_cor_quests_17_1_i_think_i_may_take_acb268: "I think I may have to take Peter's place instead."
  npc_override_sp_cor_quests_17_1_i_think_lab_also_been_54b686: "I think this lab has also been doing illegal experiments. So... could I ask you a favor?"
  npc_override_sp_cor_quests_17_1_i_think_laboratory_where_de6fad: "I think this is the laboratory where the ^0000FFmissing people were sent to.^000000 Besides the people in this area, there might be other that we can't see right now."
  npc_override_sp_cor_quests_17_1_i_think_may_turn_into_741234: "I think it may turn into a messy fight."
  npc_override_sp_cor_quests_17_1_i_think_others_went_navi_a156be: "I think the others went to the <NAVI>[Conference Room]<INFO>lhz_in01,162,257,0,000,0</INFO></NAVI>, where the meetings are held. Shouldn't you be going?"
  npc_override_sp_cor_quests_17_1_i_think_people_coming_6e3f55: "I think people are coming."
  npc_override_sp_cor_quests_17_1_i_think_s_conscious_deci_14a8bf: "I think it's a conscious decision from Schlein to have left these documents."
  npc_override_sp_cor_quests_17_1_i_think_s_entrance_their_e0c1be: "I think it's the entrance to their main base."
  npc_override_sp_cor_quests_17_1_i_think_we_should_fight_72fb63: "I think we should fight again soon, but for now let's take a break."
  npc_override_sp_cor_quests_17_1_i_think_we_should_hurry_14f95a: "I think we should hurry."
  npc_override_sp_cor_quests_17_1_i_think_you_re_just_3bf378: "I think you're just ignorant people who don't know anything."
  npc_override_sp_cor_quests_17_1_i_thought_here_lazy_must_f316f9: "I thought it was here. Lazy must be wondering ^0000FFwhat this means.^000000 I only saw the world from sitting at my desk. I believed my view was true."
  npc_override_sp_cor_quests_17_1_i_thought_they_assign_th_d0c409: "I thought they would assign them to their department directly."
  npc_override_sp_cor_quests_17_1_i_thought_vip_said_there_cfb72d: "I thought the VIP said there were only two conditions? Besides, everyone has already heard me."
  npc_override_sp_cor_quests_17_1_i_thought_you_investigat_fe7938: "I thought you were investigating with Lazy, it looks like you didn't get great results."
  npc_override_sp_cor_quests_17_1_i_told_kaya_story_about_d6823a: "- I told Kaya the story about the researcher you met at Rudus and about the experiments. -"
  npc_override_sp_cor_quests_17_1_i_told_you_you_alone_25ee00: "I told you, you have to do this alone."
  npc_override_sp_cor_quests_17_1_i_took_picture_me_let_5a611d: "- I took the picture with me, let's give it back to Dien. -"
  npc_override_sp_cor_quests_17_1_i_tried_get_while_ago_40b321: "I tried to get in a while ago, but it was blocked by wire mesh. I could see suspicious movements from the outside."
  npc_override_sp_cor_quests_17_1_i_tried_keep_him_around_bee8bf: "I tried to keep him around longer, but they took him to the lab."
  npc_override_sp_cor_quests_17_1_i_tried_send_emergency_r_9f1506: "I tried to send an emergency request to get a response team, but they are extraordinarily strong..."
  npc_override_sp_cor_quests_17_1_i_trust_you_i_don_ad4fcf: "I trust you, but I don't know about your friends. Please come back in a ^0000Cdparty of 1^000000."
  npc_override_sp_cor_quests_17_1_i_understand_40038e: "I understand."
  npc_override_sp_cor_quests_17_1_i_understand_if_we_don_974e9c: "I understand. If we don't go over there, there will be only controversy with our reports."
  npc_override_sp_cor_quests_17_1_i_understand_what_they_r_86512c: "I understand what they're saying."
  npc_override_sp_cor_quests_17_1_i_understand_what_you_me_57e965: "I understand what you mean, But Daisy's logic ^0000CDis too much^000000. I cannot doubt the ^0000CDcredibility of official documents,^000000 that's not just possible."
  npc_override_sp_cor_quests_17_1_i_understand_what_you_re_deba1c: "I understand what you're saying, but you're wrong. We are telling you the truth and you're assuming we are lying."
  npc_override_sp_cor_quests_17_1_i_understand_why_est_so_43c56b: "I can understand why Est was so angry."
  npc_override_sp_cor_quests_17_1_i_understood_moment_i_he_f16fe5: "I understood the moment I heard the Vice President talking. I worked with pride, but I was only making consumables for my senior researcher in the end."
  npc_override_sp_cor_quests_17_1_i_ve_already_been_there_0c2131: "I've already been there."
  npc_override_sp_cor_quests_17_1_i_ve_already_decided_sen_cfdc48: "I've already decided to send a support unit."
  npc_override_sp_cor_quests_17_1_i_ve_already_seen_place_c87fad: "I've already seen this place. Let's look elsewhere."
  npc_override_sp_cor_quests_17_1_i_ve_already_used_all_dcc82c: "I've already used all the guys I brought along, so I needed some back up."
  npc_override_sp_cor_quests_17_1_i_ve_been_agent_long_9879c7: "I've been an agent for a long time, I know these things. There's an official way to handle these, but I can't tell you that information."
  npc_override_sp_cor_quests_17_1_i_ve_been_contacted_tes_c085aa: "I've been contacted by Tes."
  npc_override_sp_cor_quests_17_1_i_ve_been_some_discussio_97c2a5: "I've been in some discussions with the Schwarz's government, so I'll be busy for a while..."
  npc_override_sp_cor_quests_17_1_i_ve_been_told_we_a9579a: "I've been told we are not allowed to transfer people until at least a whole year, but what is the reason why Kaufmann was transferred?"
  npc_override_sp_cor_quests_17_1_i_ve_been_waiting_you_760466: "I've been waiting for you."
  npc_override_sp_cor_quests_17_1_i_ve_came_here_purge_826aeb: "I've came here to purge the evil from the Enterprise."
  npc_override_sp_cor_quests_17_1_i_ve_delivered_informati_c9bd48: "I've delivered the information!"
  npc_override_sp_cor_quests_17_1_i_ve_found_where_go_0dbe15: "I've found where to go next. Let's go over to the<NAVI>[slums]<INFO>lighthalzen,336,266,0,101,0</INFO></NAVI> next."
  npc_override_sp_cor_quests_17_1_i_ve_met_heart_hunters_6614a7: "I've met Heart Hunters too..."
  npc_override_sp_cor_quests_17_1_i_ve_never_seen_anyone_fc1e4d: "I've never seen anyone go onside..."
  npc_override_sp_cor_quests_17_1_i_ve_never_seen_room_dd3189: "I've never seen that in the room."
  npc_override_sp_cor_quests_17_1_i_ve_said_few_times_09465e: "I've said it a few times already."
  npc_override_sp_cor_quests_17_1_i_ve_sent_help_requests_34d0f9: "I've sent help requests here and there, but I haven't gotten a good replies yet."
  npc_override_sp_cor_quests_17_1_i_ve_tended_all_crops_c733ad: "I've tended to all the crops. I should go back to the Farmhand."
  npc_override_sp_cor_quests_17_1_i_very_legitimate_way_be_e145c5: "I have to do it in very legitimate way, Because I told him I would do it without causing friction."
  npc_override_sp_cor_quests_17_1_i_want_gather_more_comba_bfad94: "I want to gather more combat data if possible."
  npc_override_sp_cor_quests_17_1_i_want_get_battle_inform_fda7e4: "I want to get battle information."
  npc_override_sp_cor_quests_17_1_i_wasn_t_able_reach_af4dfd: "I wasn't able to reach him, and then I came here looking for what was left for me."
  npc_override_sp_cor_quests_17_1_i_went_top_watchtower_5f2763: "I went on top of it, the watchtower!"
  npc_override_sp_cor_quests_17_1_i_wish_we_could_talk_333b02: "I wish we could talk more in-depth about this operation."
  npc_override_sp_cor_quests_17_1_i_won_t_say_twice_cec609: "I won't say it twice."
  npc_override_sp_cor_quests_17_1_i_wonder_how_valuable_th_ed149e: "I wonder how valuable these things are. How much do they cost? I want to touch and smell them. They smell and feel like valuables, I bet!"
  npc_override_sp_cor_quests_17_1_i_wonder_if_those_streng_d328af: "I wonder if those were strengthened through the experimentation in this lab?"
  npc_override_sp_cor_quests_17_1_i_wonder_whether_i_shoul_e7d18b: "I wonder whether or not I should go to the company and ask for him directly, I'm busy at work and I can't contact him."
  npc_override_sp_cor_quests_17_1_identification_bracelet_c2dda5: "This is an identification bracelet."
  npc_override_sp_cor_quests_17_1_if_adventurer_poor_famil_55973d: "If the adventurer is from a poor family, and you have to support it, would you spare money for your meals?"
  npc_override_sp_cor_quests_17_1_if_anyone_ask_me_about_65d1a4: "If anyone would ask me about the future of Rune-Midgard, I'd bet my life it would be the brilliant city of Yuno."
