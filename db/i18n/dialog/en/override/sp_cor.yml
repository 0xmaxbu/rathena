  npc_override_sp_cor_quests_17_1_am_i_dead_7c4e2b: "Am I... dead?"
  npc_override_sp_cor_quests_17_1_am_i_problem_you_you_ebc0ae: "Am I a problem to you? Do you think I'll give up easily? I will keep coming until I find Marcus!"
