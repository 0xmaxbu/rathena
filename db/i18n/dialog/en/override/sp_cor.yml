  npc_override_sp_cor_quests_17_1_detailed_records_found_i_a367de: "The detailed records can be found inside the lab he is in, or another lab perhaps."
  npc_override_sp_cor_quests_17_1_did_he_use_all_his_cb58ef: "Did he use all of his vacations as well?"
  npc_override_sp_cor_quests_17_1_did_i_change_definition_fc72c4: "Did I change the definition without knowing about it?"
  npc_override_sp_cor_quests_17_1_did_tes_send_you_if_e8b818: "Did Tes send you? If you want more information, you'll have to find it yourself."
  npc_override_sp_cor_quests_17_1_did_vip_know_about_disap_298c86: "Did the VIP know about the disappearance of his employees until I pushed to investigate about it?"
  npc_override_sp_cor_quests_17_1_did_you_find_cdff47: "Did you find it?"
  npc_override_sp_cor_quests_17_1_did_you_go_navi_cat_4ba061: "Did you go to <NAVI>[Cat on Bullet]<INFO>pub_cat,93,105,0,000,0</INFO></NAVI> yet?"
  npc_override_sp_cor_quests_17_1_did_you_go_there_yoursel_1c08eb: "Did you go there yourself?"
  npc_override_sp_cor_quests_17_1_did_you_hear_all_as_165ebe: "Did you hear all of that? As stated in the documents, they never even got a call after he joined the Enterprise. Well, I don't like seeing them like that, but I have to keep my first tourist promise."
  npc_override_sp_cor_quests_17_1_did_you_hear_s_smart_d9d74f: "Did you hear that? That's smart."
  npc_override_sp_cor_quests_17_1_did_you_know_vip_there_ea2589: "Did you know this VIP? was there anything about this in your documents? Why did the lab only take healthy and you people?"
  npc_override_sp_cor_quests_17_1_did_you_see_any_more_475062: "Did you see any more Heart Hunters?"
  npc_override_sp_cor_quests_17_1_didn_t_tes_tell_you_e7e87d: "Didn't Tes tell you to take action? If you aren't prepared, you should do that now."
  npc_override_sp_cor_quests_17_1_didn_t_you_come_here_7db586: "Didn't you come here to find Daisy?"
  npc_override_sp_cor_quests_17_1_didn_t_you_know_they_e0b123: "didn't you know they might get you in trouble one day?"
  npc_override_sp_cor_quests_17_1_didn_t_you_say_vice_5d5937: "Didn't you say the Vice President of Rekenber was going to convince them? What do you want to talk to me about?"
  npc_override_sp_cor_quests_17_1_didn_t_you_say_we_881685: "Didn't you say we were about to die?"
  npc_override_sp_cor_quests_17_1_didn_t_you_see_navi_fe966d: "Didn't you see <NAVI>[Aas]<INFO>sp_cor,135,147,0,101,0</INFO></NAVI> going with the Vice President? I'm worried about the wounded people."
  npc_override_sp_cor_quests_17_1_dien_having_cup_tea_seco_9ecf58: "Dien is having a cup of tea on the second floor, in her room."
  npc_override_sp_cor_quests_17_1_dien_s_room_81ad55: "Dien's room?"
  npc_override_sp_cor_quests_17_1_difficult_get_3e02f8: "It will be difficult to get it."
  npc_override_sp_cor_quests_17_1_discovery_century_ahaha_25f388: "This is the discovery of the century. Ahaha!"
  npc_override_sp_cor_quests_17_1_dodge_9595e7: "Dodge it!"
  npc_override_sp_cor_quests_17_1_doesn_t_even_door_fbb473: "It doesn't even have a door."
  npc_override_sp_cor_quests_17_1_don_t_change_his_name_6cf370: "Don't change his name!"
  npc_override_sp_cor_quests_17_1_don_t_disappointed_95f1e2: "Don't be disappointed!"
  npc_override_sp_cor_quests_17_1_don_t_look_me_like_99b4bc: "Don't look at me like that. The poorer you are, the better off your family is, we would be fools to not take advantage of these people. At least that's what I thought back then."
