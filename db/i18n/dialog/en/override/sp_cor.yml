  npc_override_sp_cor_quests_17_1_marcus_holzman_lighthalz_51f606: "Marcus Holzman from Lighthalzen?"
  npc_override_sp_cor_quests_17_1_marcus_never_me_my_marcu_7b752b: "Marcus would never do that to me! My Marcus... Marcus..."
  npc_override_sp_cor_quests_17_1_may_hard_you_please_inve_e810c7: "This may be hard for you, but please investigate the entrance first."
  npc_override_sp_cor_quests_17_1_maybe_goni_i_stand_back_ca5b56: "but maybe Goni and I can stand in the back, glaring daggers at him."
  npc_override_sp_cor_quests_17_1_maybe_he_doesn_t_like_65591a: "Maybe he doesn't like us anymore... ^0000FFOn my first vacation^000000, I just came back to my family and talked to them."
  npc_override_sp_cor_quests_17_1_maybe_he_doesn_t_want_4d8610: "Maybe he doesn't want to contact you anymore?"
  npc_override_sp_cor_quests_17_1_maybe_if_he_worked_here_ed179c: "Maybe if he worked here, the others might know something about it."
  npc_override_sp_cor_quests_17_1_maybe_illusions_intended_d3ef2d: "Maybe the Illusions intended to open it... because the inside is full of experiments..."
  npc_override_sp_cor_quests_17_1_maybe_last_chance_we_ll_b00c9c: "Maybe... this is the last chance we'll have to find Patrick after all."
  npc_override_sp_cor_quests_17_1_maybe_party_leader_hasn_bdd3f1: "Maybe the ^FF0000party leader^000000 hasn't opened the gate yet?"
  npc_override_sp_cor_quests_17_1_maybe_s_time_you_should_c2eaf7: "Maybe it's time you should take more interest. We want you to talk."
  npc_override_sp_cor_quests_17_1_maybe_there_another_reas_446974: "But... maybe... was there another reason for the transfers? What..."
  npc_override_sp_cor_quests_17_1_maybe_there_connection_p_b9d610: "Maybe there is a connection with the previous incident. There maybe additional information we can send to Rune-Midgard."
  npc_override_sp_cor_quests_17_1_maybe_you_ll_find_someth_d09844: "Maybe you'll find something out."
  npc_override_sp_cor_quests_17_1_mcdonald_lab_located_sec_553765: "McDonald lab is located at ^0000FFSector 01 - Section 95-146 in the Einbroch Mountains^000000 and Sinclair's lab is located at Zone 11 - Sector 45-156 in the Einbroch Mountains."
  npc_override_sp_cor_quests_17_1_me_rebellions_stay_outsi_6b543f: "Me and the Rebellions will stay outside. Aas will be inside."
  npc_override_sp_cor_quests_17_1_me_well_i_m_responsible_e2ce54: "Me? Well... I'm responsible for making and delivering foods to the people working here."
  npc_override_sp_cor_quests_17_1_mean_there_s_no_way_53b359: "Does that mean there's no way for a single person to cross on the other side?"
  npc_override_sp_cor_quests_17_1_meantime_i_help_out_my_798dfb: "In the meantime, I have to help out my team."
  npc_override_sp_cor_quests_17_1_meantime_i_try_learn_mor_46f6d0: "In the meantime, I will try and learn more about Lighthalzen."
  npc_override_sp_cor_quests_17_1_meet_navi_rebellion_crew_6f61c7: "Meet with a <NAVI>[Rebellion Crew]<INFO>ein_fild03,278,269,0,101,0</INFO></NAVI> member at the North-West region of Einbroch."
  npc_override_sp_cor_quests_17_1_menu_a_643066: "A 1:2 ratio might better... No it's better not to experiment. I think you're right."
  npc_override_sp_cor_quests_17_1_menu_dig_70b59a: "Dig.:Quit."
  npc_override_sp_cor_quests_17_1_menu_find_099855: "Find a meal for Morning.:Chat with Morning."
  npc_override_sp_cor_quests_17_1_menu_i_3c232e: "I'll look into it.:I have something else to do right now."
  npc_override_sp_cor_quests_17_1_menu_i_57a76c: "I think this lab is the same.:I don't know"
  npc_override_sp_cor_quests_17_1_menu_i_828986: "I'll bring it.:Something urgent happened."
  npc_override_sp_cor_quests_17_1_menu_i_f4d0a6: "I'm going back to Rudus.:Is there anything I can help with?"
  npc_override_sp_cor_quests_17_1_menu_jump_5d09b9: "Jump over the barrier.:Go back."
  npc_override_sp_cor_quests_17_1_menu_jump_8ff589: "Jump the barrier.:Go back."
  npc_override_sp_cor_quests_17_1_menu_let_faf49c: "Let's do it.:That sounds like trouble."
  npc_override_sp_cor_quests_17_1_menu_oh_fd7882: "Oh wow, look at the attitude change. All we had to do was say the magic words : Vice President."
  npc_override_sp_cor_quests_17_1_menu_open_a26668: "Open the gate.:Go inside.:Quit."
  npc_override_sp_cor_quests_17_1_menu_take_626072: "Take a look.:Just take it.:Leave it."
  npc_override_sp_cor_quests_17_1_menu_the_3379a3: "The ratio of mixture is 1:3... what are you doing?, it should be 1:4. Do you want the lab to explode?"
  npc_override_sp_cor_quests_17_1_menu_yes_24ea61: "Yes. I'll be going.:I can't go today."
  npc_override_sp_cor_quests_17_1_menu_yes_b6ef50: "Yes.:Not yet."
  npc_override_sp_cor_quests_17_1_mina_said_you_come_back_e4316b: "Mina said you can come back later. It's too early for his lovely children to be up and about."
  npc_override_sp_cor_quests_17_1_mm_adventurer_don_t_act_b2c4b8: "Mm? Adventurer, don't act on your own. I know I can trust you, but the others don't."
  npc_override_sp_cor_quests_17_1_mm_i_m_sorry_hear_6b1344: "Mm, I'm sorry to hear that. Adventurer, if you'd like to join the operation, then as the leader of the party, please select Ready."
  npc_override_sp_cor_quests_17_1_mm_mina_doesn_t_think_19e069: "Mm? Mina doesn't think you can do this alone. Please come back in a party, Adventurer."
  npc_override_sp_cor_quests_17_1_mm_sure_why_if_you_25019a: "Mm... Sure, why not? If you cooperate with us as best as you can, then we can let the minor details slide."
  npc_override_sp_cor_quests_17_1_money_welfare_paychecks_470450: "With the money and the welfare paychecks, isn't it easier to just make someone disappear from a vulnerable family and then make their voices unheard?"
  npc_override_sp_cor_quests_17_1_monsters_c9c5a6: "The monsters!?"
  npc_override_sp_cor_quests_17_1_monsters_came_out_842e63: "The monsters came out."
  npc_override_sp_cor_quests_17_1_more_i_learn_about_truth_d86856: "The more I learn about the truth, the less I understand what's going on."
  npc_override_sp_cor_quests_17_1_most_armed_forced_join_s_2cba71: "Most of the armed forced join with Schlein, and they started calling themselves Heart Hunters."
  npc_override_sp_cor_quests_17_1_most_colleagues_who_went_a134fe: "Most of the colleagues who went in first cleaned up already."
  npc_override_sp_cor_quests_17_1_most_my_crew_suffered_hu_1c1694: "Most of my crew suffered huge casualties, as I just stood by in shame..."
  npc_override_sp_cor_quests_17_1_most_people_slums_hired_f2fa08: "Most of the people from the slums that are hired by the Rekenber ^0000FFcannot be reached anymore.^000000"
  npc_override_sp_cor_quests_17_1_move_behind_me_now_a27eaf: "Move behind me! Now!"
  npc_override_sp_cor_quests_17_1_mr_lazy_please_bring_out_4f4543: "Mr. Lazy, please bring out the prisoner."
  npc_override_sp_cor_quests_17_1_msg_00d9a9: "............"
  npc_override_sp_cor_quests_17_1_msg_44c582: "...?"
  npc_override_sp_cor_quests_17_1_msg_61ce5a: "[{0}]"
  npc_override_sp_cor_quests_17_1_msg_6eae3a: "..."
  npc_override_sp_cor_quests_17_1_msg_79ef7f: "...."
  npc_override_sp_cor_quests_17_1_msg_8707ce: "... ..."
  npc_override_sp_cor_quests_17_1_msg_93fcbf: "......"
  npc_override_sp_cor_quests_17_1_msg_babd0c: "...................."
  npc_override_sp_cor_quests_17_1_msg_e0b936: "... ... ..."
  npc_override_sp_cor_quests_17_1_msg_e95f89: "....."
  npc_override_sp_cor_quests_17_1_msg_f0e1ca: "........"
  npc_override_sp_cor_quests_17_1_must_been_one_devices_il_73f87b: "It must have been one of the devices of the Illusion and Heart Hunters to keep the entrance shut."
  npc_override_sp_cor_quests_17_1_my_angela_i_ll_finally_60bac1: "My Angela... I'll finally be able to see my Angela again...."
  npc_override_sp_cor_quests_17_1_my_coworkers_i_don_t_9ecbe1: "My coworkers? I don't care about those lunatics."
  npc_override_sp_cor_quests_17_1_my_crew_working_securing_0efd41: "My crew is working on securing the doorway first. If you open it, go check out the other side."
  npc_override_sp_cor_quests_17_1_my_eyes_now_wide_opened_8a5fb8: "My eyes are now wide opened."
  npc_override_sp_cor_quests_17_1_my_name_kaya_i_work_47ee9e: "My name is Kaya. I work with the Rekenber Division."
  npc_override_sp_cor_quests_17_1_my_only_goal_being_succe_962822: "My only goal is being successful, and I've done all sort of things."
  npc_override_sp_cor_quests_17_1_my_research_nothing_comp_a0da39: "My research is nothing compared to the childish works of Vor, Wer, whatever their names were."
  npc_override_sp_cor_quests_17_1_name_just_name_if_i_2d69a8: "A name is just a name. If I was called Shit, would I become Shit when talking to the Vice President?"
  npc_override_sp_cor_quests_17_1_navi_cat_bullet_info_ein_05749a: "<NAVI>[Cat on Bullet]<INFO>einbroch,302,329,0,101,0</INFO></NAVI>. Don't you think it's a cute name for a pub?"
  npc_override_sp_cor_quests_17_1_navi_guard_info_sp_cor_beadfd: "The <NAVI>[guard]<INFO>sp_cor,135,147,0,101,0</INFO></NAVI> seems to have something to say to the VIP. Is it a problem with the wounded people?"
  npc_override_sp_cor_quests_17_1_navi_mcdonald_laboratory_695cb3: "<NAVI>[McDonald Laboratory]<INFO>ein_fild01,95,146,0,000,0</INFO></NAVI> is located in Einbroch, at the outer zone. Please be careful, it is a dangerous area."
  npc_override_sp_cor_quests_17_1_navi_researcher_info_sp_f3d550: "The <NAVI>[researcher]<INFO>sp_cor,224,77,0,101,0</INFO></NAVI> right next to the crops. Do you see her?"
  npc_override_sp_cor_quests_17_1_navi_rudus_info_ein_fild_74e918: "<NAVI>[Rudus]<INFO>ein_fild05,158,284,0,101,0</INFO></NAVI> is at Einbroch North-East field."
  npc_override_sp_cor_quests_17_1_navi_tents_info_sp_cor_5052ac: "The <NAVI>[tents]<INFO>sp_cor,159,220,0,101,0</INFO></NAVI> in the northwest are dangerous. Please stay away from them. The same goes for the <NAVI>[waterway]<INFO>sp_cor,236,275,0,101,0</INFO></NAVI> in the northeast."
  npc_override_sp_cor_quests_17_1_new_facility_i_must_find_57bb2a: "A new facility... I must find out where it is. There might be more things we don't know about."
  npc_override_sp_cor_quests_17_1_new_laboratory_92acc9: "This is the new laboratory."
  npc_override_sp_cor_quests_17_1_new_laboratory_i_couldn_4731ff: "A new laboratory... I couldn't investigate it. It's a new laboratory that needs a lot of people, but I wasn't able to find it. What do you think? Can you smell us getting closer?"
  npc_override_sp_cor_quests_17_1_nice_meet_you_i_m_7509ac: "Nice to meet you, I'm Kaya Tos."
  npc_override_sp_cor_quests_17_1_no_i_don_t_actually_b349fc: "No, I don't actually go there myself. There's a specialized department in charge of that. They use the rails with the wagons because the materials are toxic or too large."
  npc_override_sp_cor_quests_17_1_no_i_m_heading_waste_d623b1: "No. But I'm heading to the waste area."
  npc_override_sp_cor_quests_17_1_no_let_me_go_now_aa7a1a: "No! Let me go! Now! I can't believe we can't avoid that kind of weapon! Let me go! Let me go!!"
  npc_override_sp_cor_quests_17_1_no_matter_how_much_i_1ce833: "No matter how much I tried to persuade them, they didn't listen. It's not easy to change someone's mind. I should discuss it with Tes."
  npc_override_sp_cor_quests_17_1_no_matter_how_stupid_you_3469d9: "No matter how stupid you are, it's always better to have your hands on your wrists, right?"
  npc_override_sp_cor_quests_17_1_no_matter_what_truth_i_54b100: "No matter what the truth is, I don't know a third person with the same issue as yours."
  npc_override_sp_cor_quests_17_1_no_need_report_me_now_634294: "But no need to report to me now. My men already did on your behalf."
  npc_override_sp_cor_quests_17_1_no_no_adventurer_you_don_0b7984: "No, no, Adventurer. You don't have to do such a thing. You just need to report the situation to me and do it the way I told you."
  npc_override_sp_cor_quests_17_1_no_really_just_little_bi_e59724: "No, really, just a little bit, I'm late am I? What is this all about, is it drugs?"
  npc_override_sp_cor_quests_17_1_no_s_i_just_t_811bc4: "No that's not it, I just can't believe it. Ugh, I'm so tired..."
  npc_override_sp_cor_quests_17_1_no_s_if_such_facility_337ec0: "No that's not it. If it was such a facility, Tes wouldn't have known about it."
  npc_override_sp_cor_quests_17_1_no_s_okay_i_i_3fc9b8: "No, it's not okay. I have to... I need to work."
  npc_override_sp_cor_quests_17_1_no_s_you_re_requesting_6193a7: "No that's not it. You're requesting our cooperation, and asking us to trust you completely without any real evidence. How can we believe you?"
  npc_override_sp_cor_quests_17_1_no_something_definitely_413e12: "No, something is definitely not right! He's not the type of person that would ^0000FFjust stop contacting us.^000000"
  npc_override_sp_cor_quests_17_1_no_way_we_done_anything_041cff: "No way! have we done anything wrong?"
  npc_override_sp_cor_quests_17_1_no_way_we_know_where_4702ae: "No way... we know where to catch the fishes... where the good mushrooms are... where the best spots for the bathroom are... you guy don't know any of that."
  npc_override_sp_cor_quests_17_1_no_we_didn_t_catch_6a85e2: "No, we didn't catch Mina's machines. They've been in hiding, sleeping."
  npc_override_sp_cor_quests_17_1_no_well_s_alright_me_8cedca: "No? Well that's alright with me."
  npc_override_sp_cor_quests_17_1_no_who_you_really_how_2caf23: "No, who are you, really? How do you know Eva Mueller? Did Eva send you? How is she doing? Oh my god! Eva! How is Eva doing?"
  npc_override_sp_cor_quests_17_1_no_wouldn_t_been_necessa_612804: "No, it wouldn't have been necessary to make such a deal if the right people were governing in the first place!"
  npc_override_sp_cor_quests_17_1_nobody_money_pay_first_c_135306: "Nobody has the money to pay First Class except the VIP. He can just bring us along."
  npc_override_sp_cor_quests_17_1_nod_604a29: "*Nod*"
  npc_override_sp_cor_quests_17_1_nope_8fe984: "... Nope."
  npc_override_sp_cor_quests_17_1_normally_we_d_all_issued_a592f7: "Normally, we'd all be issued a pass to go around freely, but we don't have time for now this is the best I've managed to prepare."
  npc_override_sp_cor_quests_17_1_nothing_special_here_fde04c: "- Nothing special here. -"
  npc_override_sp_cor_quests_17_1_now_as_you_know_conversa_d3d338: "Now, as you know, this conversation is business meeting, aren't the Vice President's underlings standing right behind you?"
  npc_override_sp_cor_quests_17_1_now_even_if_you_actively_57299f: "Now, even if you actively cooperate with me, it's hard for me to like trust this arrangement."
  npc_override_sp_cor_quests_17_1_now_good_luck_adventurer_8462d9: "Now, good luck, Adventurer! We'll contact you if we come across new information!"
  npc_override_sp_cor_quests_17_1_now_here_s_what_really_d4234a: "Now here's what really matters. If you do not tell the truth about what really happened, you'll not be able to get their cooperation."
  npc_override_sp_cor_quests_17_1_now_i_formally_introduce_84b650: "Now I can formally introduce myself."
  npc_override_sp_cor_quests_17_1_now_i_t_think_anything_799ea7: "Now I can't think of anything else, I'm in a bad mood. I'll get back to work soon..."
  npc_override_sp_cor_quests_17_1_now_i_think_about_her_34c395: "Now that I think about it, her eyes were not normal. She looks like a crazy person."
  npc_override_sp_cor_quests_17_1_now_let_s_all_go_c82b76: "Now, let's all go to <NAVI>[Lighthalzen]<INFO>lighthalzen,259,215,0,101,0</INFO></NAVI>."
  npc_override_sp_cor_quests_17_1_now_let_s_get_down_bc7e1e: "Now, let's get down to the business, shall we? Please send him here, Mr. Lazy."
  npc_override_sp_cor_quests_17_1_now_let_s_head_these_36f716: "Now let's head to these new laboratories. There's probably a lot more we can find out over there."
  npc_override_sp_cor_quests_17_1_now_look_pile_documents_533cdc: "Now, look at this ^0000CDpile of documents^000000 over here. You don't have to read it too carefully. Just look at the cover."
  npc_override_sp_cor_quests_17_1_now_my_foot_like_other_fb0c3b: "For now, my foot is like this, but the other leg will change soon."
  npc_override_sp_cor_quests_17_1_now_s_finally_elena_volk_15371e: "Now, it's finally Elena Volkova's time to shine!"
  npc_override_sp_cor_quests_17_1_now_turned_into_matter_t_ee8596: "Now this has turned into a matter of trust, not merely a question about people missing!"
  npc_override_sp_cor_quests_17_1_now_we_all_go_together_f7d14b: "Now, can we all go together and find Pat? Lighthalzen is to the east. It is often said to be a ^0000CDslum^000000. Of course, our VIP knows all about this already, right?"
  npc_override_sp_cor_quests_17_1_now_we_know_what_place_a94ebb: "Now that we know what that place is, we can't leave it alone."
  npc_override_sp_cor_quests_17_1_now_we_should_go_navi_6d5da3: "Now we should go to the <NAVI>[slums]<INFO>lighthalzen,336,266,0,101,0</INFO></NAVI> next."
  npc_override_sp_cor_quests_17_1_now_we_t_get_because_2adc21: "But for now, we can't get in because the gate is shut."
  npc_override_sp_cor_quests_17_1_now_you_know_let_him_5ee847: "But now that you know, let him handle the rest."
  npc_override_sp_cor_quests_17_1_now_you_re_going_too_f8fc44: "Now you're going too far!"
  npc_override_sp_cor_quests_17_1_oh_5235ff: "Oh!"
  npc_override_sp_cor_quests_17_1_oh_78a2fc: "Oh..."
  npc_override_sp_cor_quests_17_1_oh_about_you_need_profes_94a8f8: "Oh. About that. You need professional treatment and care."
  npc_override_sp_cor_quests_17_1_oh_adventurer_long_time_e15bec: "Oh, Adventurer! Long time, no see! Actually, I'd like to ask you something. It's about Mina."
  npc_override_sp_cor_quests_17_1_oh_aren_t_you_vip_1be6f3: "Oh, aren't you a ^0000CDVIP^000000?"
  npc_override_sp_cor_quests_17_1_oh_did_you_come_pick_9963dd: "Oh... did you come to pick up the materials? I have arranged it as best as I could, but I cannot classify it because I don't know what it is."
  npc_override_sp_cor_quests_17_1_oh_don_t_worry_about_e1cd42: "Oh, that? Don't worry about it, it's the name I use to distract people. There, now you know me. Oh by the way... never mind, you don't need to know that."
  npc_override_sp_cor_quests_17_1_oh_don_t_worry_s_be8268: "Oh, don't worry it's kind of a free pass for our agents. Of course, you don't need to know more."
  npc_override_sp_cor_quests_17_1_oh_economical_what_s_wro_099f36: "Oh? Is it not economical? What's wrong, we'll save time using the name."
  npc_override_sp_cor_quests_17_1_oh_he_s_one_who_db1818: "Oh, he's the one who's been searching for Patrick a while ago."
  npc_override_sp_cor_quests_17_1_oh_hello_there_my_name_bb5b59: "Oh, hello there! My name is Aas from the Rekenber Security."
  npc_override_sp_cor_quests_17_1_oh_huh_i_thought_vice_24b6dd: "Oh... huh, I thought the Vice President told you to put them to rest?"
  npc_override_sp_cor_quests_17_1_oh_i_don_t_know_8b4ae1: "Oh, that? I don't know yet, but I came here with the Vice President to find out."
  npc_override_sp_cor_quests_17_1_oh_i_know_wasn_t_7376fc: "Oh I know! Wasn't it agricultural research?"
  npc_override_sp_cor_quests_17_1_oh_i_ll_let_you_8d75fb: "Oh! I'll let you know what I found here."
  npc_override_sp_cor_quests_17_1_oh_i_see_so_you_0af5ef: "Oh I see, so you don't believe me?"
  npc_override_sp_cor_quests_17_1_oh_i_thought_vice_presid_486ce6: "Oh..., I thought the Vice President told you to put them to rest?"
  npc_override_sp_cor_quests_17_1_oh_i_thought_you_rebelli_64f110: "Oh... I thought you were a rebellion member too."
  npc_override_sp_cor_quests_17_1_oh_i_ve_been_hit_f42b60: "Oh, I've been hit! We should escape!"
  npc_override_sp_cor_quests_17_1_oh_i_when_i_m_15c75a: "Oh, I can do that when I'm at work!"
  npc_override_sp_cor_quests_17_1_oh_my_i_t_believe_bfea13: "Oh my~ I can't believe it. Thank you so much. I'm afraid it will be hard for us to contact you..."
  npc_override_sp_cor_quests_17_1_oh_my_thank_you_609b74: "Oh my... thank you...."
  npc_override_sp_cor_quests_17_1_oh_my_vice_president_wha_d7cd95: "Oh my, Vice President. What are you doing in such a place... oh, what do you want to know?"
  npc_override_sp_cor_quests_17_1_oh_no_you_still_think_b4c85c: "Oh no~ you still think I'm a liar."
  npc_override_sp_cor_quests_17_1_oh_place_so_peaceful_acf21b: "Oh, this place is so peaceful."
  npc_override_sp_cor_quests_17_1_oh_really_i_didn_t_98ed30: "Oh, really? I didn't know because I had never seen your face before."
  npc_override_sp_cor_quests_17_1_oh_reporting_site_wasn_t_ccc8f5: "Oh! The reporting site wasn't looking too good!"
  npc_override_sp_cor_quests_17_1_oh_sorry_i_m_senior_04606f: "Oh, sorry, I'm senior Rekenber security officer, Aas."
  npc_override_sp_cor_quests_17_1_oh_sudden_should_i_seek_b2a7ca: "Oh... this is sudden. Should I seek the cooperation of the Vice President after I've been called a liar?"
  npc_override_sp_cor_quests_17_1_oh_sure_i_lunch_menu_dc2e23: "Oh sure, I have a lunch menu survey from the people in the neighborhood... is that what you want to use as facts?"
  npc_override_sp_cor_quests_17_1_oh_there_i_found_16c186: "Oh, there it is. I found it."
  npc_override_sp_cor_quests_17_1_oh_there_they_cd92d7: "Oh, there they are."
  npc_override_sp_cor_quests_17_1_oh_there_you_gather_arou_e9b0cd: "Oh, there you are! Gather around!"
  npc_override_sp_cor_quests_17_1_oh_they_re_just_busy_dd29a0: "Oh, they're just busy!"
  npc_override_sp_cor_quests_17_1_oh_wait_minute_297089: "Oh, that? Wait a minute..."
  npc_override_sp_cor_quests_17_1_oh_welcome_back_823ae6: "Oh! Welcome back!"
  npc_override_sp_cor_quests_17_1_oh_welcome_back_adventur_bbcaa7: "Oh, welcome back adventurer. Come. Kaufmann, did you find him?"
  npc_override_sp_cor_quests_17_1_oh_what_coincidence_he_s_8faa2e: "Oh, what a coincidence. He's also from the Lighthalzen slums!"
  npc_override_sp_cor_quests_17_1_oh_woah_hello_s_ok_a4c724: "Oh, woah, hello?? It's ok I don't mind!"
  npc_override_sp_cor_quests_17_1_oh_you_re_adventurer_did_4ffe05: "Oh you're the adventurer? Did Tes call you?"
  npc_override_sp_cor_quests_17_1_oh_you_re_going_navi_6d22c2: "Oh, you're going to the <NAVI>[waste area]<INFO>sp_rudus,227,351,0,101,0</INFO></NAVI>? Huh, good luck. I think you'll need it."
  npc_override_sp_cor_quests_17_1_oh_you_re_here_i_35b892: "Oh you're here. I heard that the recon team has taken control over the railroad transport route."
  npc_override_sp_cor_quests_17_1_oh_you_saved_us_my_423034: "Oh, you saved us! My name is Marcus. What are you doing here?"
  npc_override_sp_cor_quests_17_1_okay_thank_you_very_much_9bda6b: "Okay, thank you very much, VIP."
  npc_override_sp_cor_quests_17_1_okay_then_we_ll_get_76cb27: "Okay. Then we'll get going!"
  npc_override_sp_cor_quests_17_1_one_employee_here_said_o_08033a: "One of the employee here said that one of my very distant relative passed away and left a big legacy."
  npc_override_sp_cor_quests_17_1_one_responsible_schlein_697ff0: "And the one responsible for this was Schlein, showing up in a new uniform."
  npc_override_sp_cor_quests_17_1_only_adventurers_you_mus_179a3a: "Is it only for adventurers? You must be feeling bad, huh? Ha-ha-ha-ha"
  npc_override_sp_cor_quests_17_1_only_more_guards_ended_u_dce04c: "Only more guards ended up being sacrificed and we didn't have any success."
  npc_override_sp_cor_quests_17_1_only_part_s_legal_course_f22577: "Only the part that's legal, of course. But we'll make sure you can keep it. So, tell us everything you know about this place and your coworkers."
  npc_override_sp_cor_quests_17_1_only_person_who_you_you_948289: "And the only person who can do it is you. You beat the EL1_A17T. Of course, I'll go with you, but I'll only be there to collect new data from them."
  npc_override_sp_cor_quests_17_1_only_solution_i_think_ex_76358a: "The only solution I can think of is to exhaust their batteries until they stop working."
  npc_override_sp_cor_quests_17_1_only_we_access_more_data_66d6ef: "Not only would we have access to more data, but the quality would be much higher than what's available to an outsider."
  npc_override_sp_cor_quests_17_1_ooh_you_cannot_transferr_a976d8: "Ooh.. You cannot be transferred at least until a whole year, unless you are given ^0000FFan unusual request.^000000"
  npc_override_sp_cor_quests_17_1_oooh_i_tell_grapes_happy_8980b6: "Oooh, I can tell the grapes are happy now!"
  npc_override_sp_cor_quests_17_1_oooh_i_tell_green_beans_87e993: "Oooh, I can tell the green beans are happy now!"
  npc_override_sp_cor_quests_17_1_oooh_i_tell_pumpkins_hap_58bf61: "Oooh, I can tell the pumpkins are happy now!"
  npc_override_sp_cor_quests_17_1_oops_sorry_now_rookie_go_af9b16: "Oops, sorry. Now, Rookie, good luck to you."
  npc_override_sp_cor_quests_17_1_operation_we_ve_only_pic_49dc4a: "For this operation, we've only picked the soldiers who are strong enough to fend for themselves, such as me. Please come back in a ^0000Cdparty of 1^000000."
  npc_override_sp_cor_quests_17_1_other_rebellion_members_10df67: "Other rebellion members are already looking for an entry point. If you don't mind, can you check on them?"
  npc_override_sp_cor_quests_17_1_other_rebellion_members_c9d027: "Other rebellion members have already entered."
  npc_override_sp_cor_quests_17_1_other_rebellion_members_d1bc60: "Other rebellion members are already looking for an entry point. If you don't mind, look for them adventurer."
  npc_override_sp_cor_quests_17_1_our_adventurer_asked_goo_c8e13b: "Our adventurer asked a good question. They are almost all from the slums. In Rekenber, they offer you accommodations, with meals and lodging, you hardly have to spend any money at all."
  npc_override_sp_cor_quests_17_1_our_crops_good_now_messi_20f853: "Our crops are good for now. Messin' with them too often ain't good for them. They may not look it, but they're pretty sensitive."
  npc_override_sp_cor_quests_17_1_our_crops_need_tended_ev_83324b: "Our crops need to be tended every day. Please come back and help us again."
  npc_override_sp_cor_quests_17_1_our_guard_here_vip_imagi_a69a71: "Our guard here and the VIP are not imaginative? I know you don't see to look at what's in front of you, but look at the reality of the situation here."
  npc_override_sp_cor_quests_17_1_our_only_job_8d2757: "This is our only job!"
  npc_override_sp_cor_quests_17_1_our_operation_also_inclu_89ea37: "Our operation also includes you, Adventurer. I know how good you are, so I've recommended you to the others. You'll do this with us, won't you?"
  npc_override_sp_cor_quests_17_1_our_plan_action_i_believ_e58248: "With our plan in action, I believe we have a better future ahead of us."
  npc_override_sp_cor_quests_17_1_our_plan_i_m_cooperating_228f06: "That was our plan. I'm cooperating with these people."
  npc_override_sp_cor_quests_17_1_our_vip_chosen_very_suit_3737bd: "Our VIP has chosen a very suitable candidate for our investigation. I applaud you. It was a good idea."
  npc_override_sp_cor_quests_17_1_pa_patrick_kaufmann_patr_25c5b4: "Pa... Patrick Kaufmann... Patrick... Well... Ah! I remember!"
  npc_override_sp_cor_quests_17_1_pa_who_patrick_kaufmann_61c8e9: "Pa... who? Patrick Kaufmann? Who is that? I don't know... oh! have you asked <NAVI>[Sammy]<INFO>rgsr_in,12,46,0,000,0</INFO></NAVI>?"
  npc_override_sp_cor_quests_17_1_pat_didn_t_get_neither_b4ed78: "But Pat didn't get neither one of these reasons. Is it really a laboratory?"
  npc_override_sp_cor_quests_17_1_pat_probably_worked_hard_b54367: "Pat probably worked hard to get a chance out of poverty and live a better life. He wanted to start anew."
  npc_override_sp_cor_quests_17_1_pat_s_home_where_pat_d21726: "This is Pat's home. This is where Pat first got into contact with Rekenber and met a staff member."
  npc_override_sp_cor_quests_17_1_path_we_took_you_adventu_2543e2: "The path we took with you adventurer is a fresh feeling for me."
  npc_override_sp_cor_quests_17_1_patrick_facility_mainten_28bed9: "Patrick is in the Facility Maintenance Department? That I didn't know. Nobody here worked as their usual job. When I got here, I was assigned a different job."
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_don_t_y_830e99: "Patrick Kaufmann? Don't you mean Patrick Young?"
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_facilit_6a5e84: "Patrick Kaufmann. Facility Maintenance Officer."
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_i_know_2537fe: "Patrick Kaufmann... I know him. He's a good friend of mine. He has rough hands but his work is fast and accurate."
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_no_you_892985: "Patrick Kaufmann...? No, but you mean Patrick Young, right?"
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_s_brace_046a1c: "This is Patrick Kaufmann's bracelet... let's go back to <NAVI>[Kaya]<INFO>sp_cor,136,146,0,101,0</INFO></NAVI>."
  npc_override_sp_cor_quests_17_1_patrick_kaufmann_transfe_965e4e: "Patrick Kaufmann. Transfer Code 12-4332."
  npc_override_sp_cor_quests_17_1_patrick_same_department_89bc21: "Patrick was from the same department, so maybe it was the same for him."
  npc_override_sp_cor_quests_17_1_payments_also_confirmed_9eb4fc: "Payments are also confirmed to be monthly basis."
  npc_override_sp_cor_quests_17_1_people_materials_left_be_524537: "The people and the materials that are left behind in the rush of escaping are likely the good people left."
  npc_override_sp_cor_quests_17_1_people_who_healthy_body_25c8f9: "People who have healthy body and no families. Among them, why would they only pick the poorest?"
  npc_override_sp_cor_quests_17_1_people_who_made_these_do_6a1b48: "The people who made these documents don't know anything about Pat. It's not just one or two persons on this list. Should you really listen to one person?"
  npc_override_sp_cor_quests_17_1_people_your_team_kind_pe_e550da: "The people in your team are the kind of people who don't go missing."
  npc_override_sp_cor_quests_17_1_perfect_i_had_hoped_you_13637d: "Perfect, I had hoped you'd say that. I'm glad to see you're not angry anymore. So open your mind~ don't get angry~ breath slowly~ exhale~"
  npc_override_sp_cor_quests_17_1_perform_last_unit_check_2594c3: "Perform a last unit check before the search."
  npc_override_sp_cor_quests_17_1_perhaps_someone_didn_t_w_a4edbb: "Perhaps someone didn't want you to learn the truth and deliberately removed those details. Otherwise it would have been shown in the original documents."
  npc_override_sp_cor_quests_17_1_perhaps_they_escaped_man_b3ed55: "Perhaps they ^0000FFescaped to the mansion.^000000"
  npc_override_sp_cor_quests_17_1_perhaps_you_don_t_know_4cdaf4: "Perhaps you don't know, but this ^0000FFlab was doing illegal experiments.^000000"
  npc_override_sp_cor_quests_17_1_person_front_me_8dfa9e: "The person in front of me?"
  npc_override_sp_cor_quests_17_1_person_responsible_all_ae5dc0: "Is this the person responsible for all of this?"
  npc_override_sp_cor_quests_17_1_person_who_abandoned_me_28742d: "The person who abandoned me here didn't think I'd still be alive."
  npc_override_sp_cor_quests_17_1_pick_names_list_randomly_413749: "Pick on of the names on the list randomly. If I select one, you'd say I manipulated the results later otherwise."
  npc_override_sp_cor_quests_17_1_place_adults_only_3873e5: "This place is for adults only."
  npc_override_sp_cor_quests_17_1_place_bit_chaotic_rebell_959332: "This place is a bit chaotic, but the Rebellions rather like it here."
  npc_override_sp_cor_quests_17_1_place_filled_so_many_unp_a46db5: "This place is filled with so many unpleasant surprises that I'm constantly reminding myself to be wary of everything I see."
  npc_override_sp_cor_quests_17_1_place_inappropriate_vice_b019b5: "This place is inappropriate for the Vice President. It's hard to guard. People can easily flock together."
  npc_override_sp_cor_quests_17_1_place_incredibly_nice_lo_00d3de: "This place is incredibly nice looking, it's hard to believe they do experiments here. Even I would want to live in a place like this."
  npc_override_sp_cor_quests_17_1_place_just_dump_b4cbcc: "This place is just a dump."
  npc_override_sp_cor_quests_17_1_place_memorial_dungeon_1e1353: "^4D4DFFThis place is a memorial dungeon."
  npc_override_sp_cor_quests_17_1_place_restricted_outside_f375f7: "This place is restricted from outsiders, please leave."
  npc_override_sp_cor_quests_17_1_place_seems_like_dead_en_a4a0e0: "This place seems like a dead end."
  npc_override_sp_cor_quests_17_1_place_used_as_base_while_f02d10: "This place will be used as a base while you carry out your other duties."
  npc_override_sp_cor_quests_17_1_place_very_dangerous_com_bda86e: "This place is very dangerous. Come back when you're strong enough to protect your own body."
  npc_override_sp_cor_quests_17_1_places_like_prone_accide_09cd30: "Places like this are prone to accidents that the regular members of the Rebellion can't handle."
  npc_override_sp_cor_quests_17_1_plan_i_told_our_soldiers_0523cf: "That was the plan. I told our soldiers to not harm anyone, and to keep a lookout. They won't fight carelessly."
  npc_override_sp_cor_quests_17_1_please_before_he_gives_m_91dc7b: "Please! Before he gives me a coronary!"
  npc_override_sp_cor_quests_17_1_please_careful_i_know_yo_97240c: "Please be careful. I know you will do well."
  npc_override_sp_cor_quests_17_1_please_come_back_after_d_4d56a9: "Please come back after dawn when Mina's children wake up and get ready for another energetic day!"
  npc_override_sp_cor_quests_17_1_please_come_back_after_d_81bd08: "Please come back after dawn. Thank you."
  npc_override_sp_cor_quests_17_1_please_contact_operation_8b3e98: "Please contact the Operation Team."
  npc_override_sp_cor_quests_17_1_please_excuse_me_26d67e: "Please excuse me."
  npc_override_sp_cor_quests_17_1_please_form_party_try_ag_b47945: "Please form a party and try again.^000000"
  npc_override_sp_cor_quests_17_1_please_gather_around_let_218f05: "Please gather around~ Let's check the number of people! Kaya Tos! Kaya Tos?"
  npc_override_sp_cor_quests_17_1_please_give_me_few_minut_3d27cc: "... Please give me a few minutes to consider my options."
  npc_override_sp_cor_quests_17_1_please_handle_heart_hunt_df74aa: "Please handle 15 ^0000FFHeart Hunter Bellares and  Heart Hunter Sanares.^000000"
  npc_override_sp_cor_quests_17_1_please_honey_you_re_aski_a31666: "Please honey! You're not asking the important questions. Is there any regulation prohibiting my son from contacting us? I haven't contacted since the day my child was hired, I can't even contact him myself..."
  npc_override_sp_cor_quests_17_1_please_hunt_down_each_he_a41195: "Please hunt down 15 of each Heart Hunters."
  npc_override_sp_cor_quests_17_1_please_look_if_you_need_02f39e: "Please have a look. If you need anything, let me know!"
  npc_override_sp_cor_quests_17_1_please_make_sure_you_all_4f3b0b: "Please make sure you do all these."
  npc_override_sp_cor_quests_17_1_please_note_any_abnormal_3139a0: "^FF0000Please note that, any abnormal monster handling inside the instance such as taming is not considered normal and may hinder the instance progress.^000000"
  npc_override_sp_cor_quests_17_1_please_note_you_t_clear_4a50c5: "^ff0000Please note that you can't clear this dungeon if you try to tame monsters or perform any other irrelevant monster-related activities.^000000"
  npc_override_sp_cor_quests_17_1_please_reconsider_vice_p_03dcae: "Please reconsider, Vice President."
  npc_override_sp_cor_quests_17_1_please_return_back_soon_447945: "Please return back soon."
  npc_override_sp_cor_quests_17_1_please_say_yes_let_me_974ae0: "Please say yes. Let me follow you. I can't wait to get away from this guy."
  npc_override_sp_cor_quests_17_1_please_stay_here_i_check_4b843a: "Please stay here, I will check the surroundings."
  npc_override_sp_cor_quests_17_1_please_take_care_cce3d8: "Please take care."
  npc_override_sp_cor_quests_17_1_please_talk_85a23e: "Please talk."
  npc_override_sp_cor_quests_17_1_please_tell_lucky_4442d1: "Please tell Lucky."
  npc_override_sp_cor_quests_17_1_please_think_kaufmann_wh_d7ec2f: "But please think of Kaufmann when you can."
  npc_override_sp_cor_quests_17_1_please_think_over_vice_p_8238d8: "Please think it over, Vice President!"
  npc_override_sp_cor_quests_17_1_please_wait_minute_4fef14: "Please wait a minute."
  npc_override_sp_cor_quests_17_1_please_wait_moment_lazy_1a3c8a: "Please wait a moment, Lazy"
  npc_override_sp_cor_quests_17_1_plus_we_might_able_get_2d4056: "Plus we might not be able to get back right away, so it might get complicated."
  npc_override_sp_cor_quests_17_1_preparation_operation_ye_ce63b2: "The preparation for the operation is not yet complete or your party is performing another operation."
  npc_override_sp_cor_quests_17_1_president_gave_me_his_fu_cd7ba7: "The president gave me his full authority on this matter."
  npc_override_sp_cor_quests_17_1_president_give_you_permi_016635: "The President will give you permission."
  npc_override_sp_cor_quests_17_1_prison_jail_s_prisoners_8ba255: "A prison. A jail. It's for prisoners... What is this place?!"
  npc_override_sp_cor_quests_17_1_problem_we_t_use_force_773f09: "The problem is. We can't use force on them. What should we do?"
  npc_override_sp_cor_quests_17_1_processing_refining_vege_4c1977: "Processing and refining the vegetables... with these... what were they trying to do?? Did they try solve the hunger problems?"
  npc_override_sp_cor_quests_17_1_provide_us_information_a_66f603: "and provide us information about your coworkers who were only your business partners. In this case, you'll get to keep your research, though in a limited capacity."
  npc_override_sp_cor_quests_17_1_put_simply_our_affiliate_93af85: "To put it simply, our affiliated Enterprise research institute, Regenschirm, is occupied by a large group of enemies."
  npc_override_sp_cor_quests_17_1_quite_strange_unfamiliar_e09f07: "This is quite strange and unfamiliar to me."
  npc_override_sp_cor_quests_17_1_ready_20c7c5: "Ready"
  npc_override_sp_cor_quests_17_1_really_help_if_someone_a_55e345: "It really help if someone as strong as you joined us."
  npc_override_sp_cor_quests_17_1_really_you_d_me_if_e0be83: "Really... you'd do that for me.... if we had meet sooner, we'd have been long life friends. If you need help with anything, let me know."
  npc_override_sp_cor_quests_17_1_regenschirm_lab_back_rek_dbbb7d: "The Regenschirm lab, back at Rekenber, was involved with similar experiments and it caused a turmoil."
  npc_override_sp_cor_quests_17_1_rekenber_explain_68a409: "Rekenber, ^0000FFexplain!^000000"
  npc_override_sp_cor_quests_17_1_rekenber_missing_list_d68cf1: "Rekenber... missing list..?"
  npc_override_sp_cor_quests_17_1_rekenber_roads_wide_glea_0c1e13: "The Rekenber roads are wide and gleaming~ everyone knows about the Schwarzwald Republic~"
  npc_override_sp_cor_quests_17_1_related_laboratory_s_sec_e7c616: "Is it related to the laboratory's security."
  npc_override_sp_cor_quests_17_1_requesting_help_analyzin_63d99a: "Requesting help and analyzing paperwork are separate matters."
  npc_override_sp_cor_quests_17_1_requires_large_workforce_ac6a94: "It requires a large workforce and a lot of materials to build a research facility. Even after its construction, materials should still be constantly coming in."
  npc_override_sp_cor_quests_17_1_research_experimentation_ca3f85: "Research and experimentation are not always safe. I thought I would be okay, but I couldn't avoid it in the end."
  npc_override_sp_cor_quests_17_1_researcher_named_elyumin_c8904f: "That researcher named ^0000CDElyumina^000000 must have done it. We'll go after him right away!"
  npc_override_sp_cor_quests_17_1_rest_waiting_they_ll_com_885dd7: "The rest will be waiting, and they'll come in and when we give the signal."
  npc_override_sp_cor_quests_17_1_results_same_no_matter_h_b74162: "The results will be the same no matter how many times we check them. We have a lot of other work to do."
  npc_override_sp_cor_quests_17_1_right_fbc63d: "Right."
  npc_override_sp_cor_quests_17_1_right_isn_t_weird_you_9454ee: "Right? Isn't it weird for you too?"
  npc_override_sp_cor_quests_17_1_right_otherwise_vice_pre_131b47: "Right? Otherwise, the Vice President wouldn't have brought the Rebellions, but the guards instead."
  npc_override_sp_cor_quests_17_1_roger_then_i_discuss_str_daefe8: "Roger. Then I will discuss strategies with Est."
  npc_override_sp_cor_quests_17_1_romance_thrills_hehe_we_019d4e: "Romance and thrills, hehe. We've always waited for this dream to happen."
  npc_override_sp_cor_quests_17_1_rookie_did_great_job_i_4dcbc6: "Rookie did a great job. I didn't know he was so good at persuasion."
  npc_override_sp_cor_quests_17_1_rookie_president_s_soldi_3da310: "Rookie and the President's soldiers called the Wings something are getting ready to interrogate him."
  npc_override_sp_cor_quests_17_1_route_hasn_t_been_secure_a9abdb: "The route hasn't been secured yet. Why don't you ask your party leader to prepare the route?"
  npc_override_sp_cor_quests_17_1_s_all_information_about_04e149: "That's all the information about Pat."
  npc_override_sp_cor_quests_17_1_s_already_known_our_neig_4815df: "It's already known to our neighbors that Rekenber was performing illegal experiments. Maybe the people on this list could have also been involved."
  npc_override_sp_cor_quests_17_1_s_alright_you_need_take_5f7596: "It's alright, you need to take breaks as well, adventurer."
  npc_override_sp_cor_quests_17_1_s_also_very_good_deceive_8c99cc: "It's also very good to deceive others. Why would suspect a tourist? Right?"
  npc_override_sp_cor_quests_17_1_s_another_day_let_s_90f57a: "But that's for another day. Let's focus on the mission at hand."
  npc_override_sp_cor_quests_17_1_s_because_angry_research_35af5a: "It's because of that angry researcher who ran away. As you can see, we haven't found him. He's as slippery as an eel."
  npc_override_sp_cor_quests_17_1_s_because_i_m_only_139bb8: "That's because I'm the only mechanic in the lab. I don't care about anything other than my own machines..."
  npc_override_sp_cor_quests_17_1_s_been_while_since_i_77eb49: "It's been a while since I have been this excited."
  npc_override_sp_cor_quests_17_1_s_building_top_left_our_0f16c0: "It's the building at the top left of our Headquarters, in <NAVI>[Lighthalzen]<INFO>lighthalzen,56,270,0,101,0</INFO></NAVI>."
  npc_override_sp_cor_quests_17_1_s_closed_inside_856b3a: "It's closed from the inside."
  npc_override_sp_cor_quests_17_1_s_common_person_list_a69a40: "It's not a common person on the list."
  npc_override_sp_cor_quests_17_1_s_correct_2a48a0: "That's correct."
  npc_override_sp_cor_quests_17_1_s_dangerous_go_alone_6200df: "It's dangerous to go alone."
  npc_override_sp_cor_quests_17_1_s_dangerous_here_move_ov_b6893f: "It's dangerous here. Move over to the safe area!"
  npc_override_sp_cor_quests_17_1_s_dangerous_moment_becau_b8835b: "It's dangerous at the moment because the mine is closed."
  npc_override_sp_cor_quests_17_1_s_dangerous_you_place_li_6cb1c6: "It's dangerous for you to be in a place like this. Even for experienced people. Please come back next time."
  npc_override_sp_cor_quests_17_1_s_easy_recognize_person_d5302d: "It's easy to recognize a person from their personality and their tone of voice. It's easy for anyone to know, but I can see it just by looking at your face."
  npc_override_sp_cor_quests_17_1_s_elyumina_i_t_they_cccdf5: "It's Elyumina, and I can't do it! They're equipped with a high-tech machine learning module."
  npc_override_sp_cor_quests_17_1_s_elyumina_s_elyumina_s_517fd2: "It's Elyumina's! Elyumina's machines! And traps! ... They go stealth in low power mode in case of emergency. And it's time that they show back up and start rampaging again."
  npc_override_sp_cor_quests_17_1_s_est_9528da: "That's not it, Est."
  npc_override_sp_cor_quests_17_1_s_familiar_name_patrick_f09c68: "It's a familiar name... Patrick... Patrick... Are you talking about Pat who was cleaning the labs?"
  npc_override_sp_cor_quests_17_1_s_get_out_get_out_86eabb: "That's it! Get out! Get out now!"
  npc_override_sp_cor_quests_17_1_s_giant_sewer_if_you_9815be: "It's a giant sewer. If you walk along the sewer, you'll find a huge sewage treatment plant inside."
  npc_override_sp_cor_quests_17_1_s_good_hear_8b7c6f: "That's good to hear."
  npc_override_sp_cor_quests_17_1_s_good_idea_then_me_568543: "That's a good idea. Then me and you will go to Sinclair's laboratory together."
  npc_override_sp_cor_quests_17_1_s_how_we_re_able_0a88e3: "It's how we're able to provide for Pat. But it's strange we haven't heard back from him yet."
  npc_override_sp_cor_quests_17_1_s_i_only_categorize_larg_637e40: "That's not it. I only categorize large materials or technical equipment."
  npc_override_sp_cor_quests_17_1_s_illegal_laboratory_you_0cf295: "It's an illegal laboratory. You know what an illegal laboratory is?"
  npc_override_sp_cor_quests_17_1_s_impressive_how_they_ve_15c288: "It's impressive how they've managed to make this meeting inside the pub will all of us, and now a Rebellion unit is helping out the Enterprise."
  npc_override_sp_cor_quests_17_1_s_joke_i_think_i_cf9fff: "It's a joke, I think I need more time to properly investigate this area."
  npc_override_sp_cor_quests_17_1_s_just_common_sense_why_35234a: "It's just common sense, why would a company go out their way to pay a salary to an unemployed person?"
  npc_override_sp_cor_quests_17_1_s_just_speculation_time_f59204: "It's not just speculation this time, the evidence is clear now."
  npc_override_sp_cor_quests_17_1_s_locked_64a009: "- It's locked. -"
  npc_override_sp_cor_quests_17_1_s_locked_inside_even_gon_bb7923: "But it's locked from the inside. Even Goni couldn't open it, and he's the strongest of us all. That's what I find interesting."
  npc_override_sp_cor_quests_17_1_s_more_amazing_than_you_fcd870: "It's more amazing than you think."
  npc_override_sp_cor_quests_17_1_s_more_important_block_o_edba1b: "It's more important to block out all the exits so that nobody escapes."
  npc_override_sp_cor_quests_17_1_s_more_secure_than_i_2dd343: "It's more secure than I thought."
  npc_override_sp_cor_quests_17_1_s_nice_here_quiet_if_787c94: "It's nice here and quiet. If only I could get a day off..."
  npc_override_sp_cor_quests_17_1_s_nice_suddenly_so_much_20a6b7: "It's nice to suddenly have so much work to do... But I won't be able to do everything on my own..."
  npc_override_sp_cor_quests_17_1_s_okay_i_d_surprised_930212: "It's okay. I'd be surprised too if I saw myself. I try not to look in the mirrors."
  npc_override_sp_cor_quests_17_1_s_okay_you_don_t_22f4da: "It's okay, you don't have to look right now. There are other urgent matters to take care of."
  npc_override_sp_cor_quests_17_1_s_old_picture_people_you_4e285a: "- It's an old picture with people you've met before. -"
  npc_override_sp_cor_quests_17_1_s_probably_what_their_fa_24ed39: "It's not probably what their family would have wanted, but it's dangerous outside for them. You know what I mean?"
  npc_override_sp_cor_quests_17_1_s_proper_ending_me_don_e8ccda: "That's a proper ending for me don't you think?"
  npc_override_sp_cor_quests_17_1_s_purpose_tour_now_let_5e92e2: "That's the purpose of this tour. Now let's go, we don't have much time."
  npc_override_sp_cor_quests_17_1_s_railway_carry_minerals_691918: "It's a railway to carry minerals, but they've built a barrier on top."
  npc_override_sp_cor_quests_17_1_s_really_strange_us_as_f0c3cc: "It's really strange for us as well, are you aware of what's going on adventurer?"
  npc_override_sp_cor_quests_17_1_s_right_s_right_guy_dc1c59: "That's right, that's right! The guy who looked tall and big. I wanted to be his friend because we came from the same place. I couldn't see him one day. Then I was moved."
  npc_override_sp_cor_quests_17_1_s_right_you_feel_bad_8f356b: "That's right. Do you feel bad? It's the truth though. Only mouth to mouth reveal true facts."
  npc_override_sp_cor_quests_17_1_s_room_over_there_s_11e1b1: "It's that room over there. It's a place where only rebellions leaders can go in or out."
  npc_override_sp_cor_quests_17_1_s_safe_here_even_if_e8c9f7: "It's safe here. Even if it's a big place, they won't attack randomly."
  npc_override_sp_cor_quests_17_1_s_second_floor_clana_nem_0d2cd1: "It's on the second floor of Clana Nemieri."
  npc_override_sp_cor_quests_17_1_s_small_bar_next_train_72e79a: "It's a small bar next to the train station of Einbroch."
  npc_override_sp_cor_quests_17_1_s_so_trusting_ca2e6c: "But that's so... not trusting..."
  npc_override_sp_cor_quests_17_1_s_something_i_tell_you_81c89e: "It's not something I can tell you here, so please come over <NAVI>[here]<INFO>sp_cor,135,147,0,101,0</INFO></NAVI>."
  npc_override_sp_cor_quests_17_1_s_somewhere_einbroch_s_o_654ac6: "It's somewhere at the ^0000FFEinbroch's outer zone.^000000 I've heard many new facilities involve dangerous experiments that can't be done in the city, so workforce is sent outside."
  npc_override_sp_cor_quests_17_1_s_souvenir_us_when_we_535f1a: "It's a souvenir of us when we were children."
  npc_override_sp_cor_quests_17_1_s_system_based_their_pla_c971e5: "It's a system based on their ^0000FFplace of origin^000000. There are many people who are not familiar with the corporate culture. After many trials and errors, the new employees are now required to go through OT."
  npc_override_sp_cor_quests_17_1_s_these_guards_let_schle_e708a5: "It's these guards, let by Schlein,"
  npc_override_sp_cor_quests_17_1_s_time_mina_s_children_d00b3e: "It's time Mina's children are up and about, Adventurer."
  npc_override_sp_cor_quests_17_1_s_time_operation_yet_jus_d59209: "It's not time for the operation yet, just rest for now."
  npc_override_sp_cor_quests_17_1_s_too_bad_168b79: "That's too bad."
  npc_override_sp_cor_quests_17_1_s_too_bad_they_won_837eb4: "It's too bad that they won't be used."
  npc_override_sp_cor_quests_17_1_s_triple_edged_door_i_9e1bb3: "It's a triple-edged door. I'm having a hard time opening it up."
  npc_override_sp_cor_quests_17_1_s_valid_argument_i_need_e3a776: "That's valid argument. But do I need to go too? I would prefer talking to you."
  npc_override_sp_cor_quests_17_1_s_we_want_protect_civili_068a9d: "That's not it! We want to protect the civilians and make things right!"
  npc_override_sp_cor_quests_17_1_s_weird_9c674b: "That's weird~"
  npc_override_sp_cor_quests_17_1_s_what_i_m_saying_1c14af: "That's not what I'm saying VIP. The secretary here knows too. Do you really not know? Are you pretending?"
  npc_override_sp_cor_quests_17_1_s_what_i_m_trying_e914f1: "That's what I'm trying to define adventurer. How can I set a destination when we have a VIP with us?"
  npc_override_sp_cor_quests_17_1_s_what_i_said_all_36d2d9: "That's not what I said at all..."
  npc_override_sp_cor_quests_17_1_s_where_they_throw_away_b7b927: "It's where they throw away their failed experiments."
  npc_override_sp_cor_quests_17_1_s_why_i_don_t_f09da3: "That's why ^0000CDI don't do desk jobs^000000."
  npc_override_sp_cor_quests_17_1_s_your_operation_you_no_d39c4f: "It's your operation. Do you have no support available?"
  npc_override_sp_cor_quests_17_1_safe_me_stay_here_96315e: "Is it safe for me to stay here?"
  npc_override_sp_cor_quests_17_1_sammy_know_more_he_manag_3e4470: "Sammy would know more. He manages the workforce here. You should go meet him."
  npc_override_sp_cor_quests_17_1_says_director_mcdonald_c_692d95: "It says the director, McDonald, came here directly and gave a list of people to transfer."
  npc_override_sp_cor_quests_17_1_schlein_only_gathers_str_72be10: "Schlein only gathers the strongest people after all."
  npc_override_sp_cor_quests_17_1_scientists_researchers_e_292651: "Scientists, researchers, everyone here just pretends things are fine."
  npc_override_sp_cor_quests_17_1_second_i_want_reliable_p_14eef6: "... and second, I want a ^0000CDreliable person^000000 in your party."
  npc_override_sp_cor_quests_17_1_security_devices_traps_s_bb9b2e: "... The security devices and traps that summon monsters are still in low power mode. Leave them alone, or they can get easily overheated."
  npc_override_sp_cor_quests_17_1_see_i_knew_who_wouldn_f0b866: "See? I knew it. Who wouldn't do that? Okay sure. Maybe one guy out of ten."
  npc_override_sp_cor_quests_17_1_see_i_told_you_persuadin_8c5086: "See I told you. Persuading him is a waste of time. If you don't cooperate with me, there's no way I can report back to the President."
  npc_override_sp_cor_quests_17_1_see_my_family_now_why_e97a62: "See, this is my family now. Why do I have to carry such a heavy load? It's a hundred times easier to give up hope than to be alive elsewhere isn't it?"
  npc_override_sp_cor_quests_17_1_see_why_you_sticking_you_cadb03: "See! Why are you sticking your nose into other people's business?"
  npc_override_sp_cor_quests_17_1_seems_been_made_intentio_3db6b1: "It seems to have been made with the intention of 'throwing in'."
  npc_override_sp_cor_quests_17_1_seems_group_pretended_pa_78fb34: "It seems it was from the group that pretended to be part of the security personnel and then attacked the laboratory."
  npc_override_sp_cor_quests_17_1_seems_i_ve_picked_up_2c6669: "It seems I've picked up bad customers, but with the adventurer's help it shouldn't be a problem."
  npc_override_sp_cor_quests_17_1_seems_lazy_something_tel_61edfe: "And it seems Lazy has something to tell you."
  npc_override_sp_cor_quests_17_1_seems_like_animal_dug_ho_a9eaeb: "It seems like an animal has dug this hole and made a little cave."
  npc_override_sp_cor_quests_17_1_seems_like_their_equipme_5c7872: "It seems like their equipment or abilities have increased in various ways."
  npc_override_sp_cor_quests_17_1_seems_me_they_like_arran_56d51b: "It seems to me they like this arrangement."
  npc_override_sp_cor_quests_17_1_seems_place_cover_up_uns_b6f2c7: "It seems to be a place to cover up unsuccessful experiments."
  npc_override_sp_cor_quests_17_1_seems_power_plant_suppor_2dfdbd: "It seems that power plant supports the entire mansion."
  npc_override_sp_cor_quests_17_1_seems_they_poisoned_whil_9f416c: "It seems they were ^0000FFpoisoned^000000 while moving waste materials and their clothes were contaminated by various dangerous substances used in the lab because they didn't have safety equipment."
  npc_override_sp_cor_quests_17_1_separate_matter_because_fcb611: "Is it a separate matter because you said so? When did you decide that?"
  npc_override_sp_cor_quests_17_1_sewage_plant_quite_compl_e13796: "The sewage plant is quite complicated and you could get lost."
  npc_override_sp_cor_quests_17_1_shall_we_go_31432c: "Shall we go?"
  npc_override_sp_cor_quests_17_1_she_didn_t_even_follow_05be3e: "She didn't even follow basic safety rules. How many have been poisoned?"
  npc_override_sp_cor_quests_17_1_she_didn_t_want_come_877a84: "She didn't want to come back..."
  npc_override_sp_cor_quests_17_1_she_s_right_nobody_else_b7279b: "She's right! Nobody else knows this place as much as we do."
  npc_override_sp_cor_quests_17_1_she_said_he_saw_vip_da2ce5: "She said he saw the VIP..."
  npc_override_sp_cor_quests_17_1_she_worries_because_she_ae706b: "She worries because she hasn't been contacted."
  npc_override_sp_cor_quests_17_1_shh_ae6177: "Shh!"
  npc_override_sp_cor_quests_17_1_shifts_scheduled_day_cam_334423: "The shifts scheduled for that day came in wearing new uniforms, it was a mistake for me to believe it was an experimental outfit."
  npc_override_sp_cor_quests_17_1_should_i_investigate_fur_c7aa4b: "Should I investigate further?"
  npc_override_sp_cor_quests_17_1_should_we_charge_d86713: "Should we charge in?"
  npc_override_sp_cor_quests_17_1_should_we_really_go_head_aff15b: "Should we really do that? Go to the headquarters and investigate?"
  npc_override_sp_cor_quests_17_1_shouldn_t_happened_087472: "This shouldn't have happened."
  npc_override_sp_cor_quests_17_1_shouldn_t_we_listen_what_9e7223: "Shouldn't we listen to what Daisy have to say?"
  npc_override_sp_cor_quests_17_1_show_me_way_out_09e85e: "Show me the way out!"
  npc_override_sp_cor_quests_17_1_sigh_i_don_t_know_59116e: "Sigh.. I don't know why we're so hostile with each other."
  npc_override_sp_cor_quests_17_1_sigh_wait_dfc011: "Sigh, wait."
  npc_override_sp_cor_quests_17_1_simply_because_s_more_tr_7344c4: "Simply because it's more troublesome to make a guard disappear. It makes more noises."
  npc_override_sp_cor_quests_17_1_since_day_they_used_data_fd7db8: "Since that day, they used data about you, their most powerful enemy, and they've used it to grow rapidly."
  npc_override_sp_cor_quests_17_1_since_he_child_he_pick_e7883d: "Since he was a child, he would pick things up and fix them, and then resell. It's a talent that's been lost nowadays."
  npc_override_sp_cor_quests_17_1_since_i_m_type_who_35dd76: "Since I'm the type who prefers force over talking to get the answer she wants, I probably won't have anything to do there,"
  npc_override_sp_cor_quests_17_1_since_important_interrog_7168b5: "Since this is an important interrogation, there should be as many government agents present as the others, to prevent miscommunication later."
  npc_override_sp_cor_quests_17_1_since_incident_many_memb_d0f1e0: "But since this incident, many members in our staff have requested a transfer, leaving us short-staffed. Would you be so kind as to help us tend to our crops?"
  npc_override_sp_cor_quests_17_1_since_you_came_along_i_b0c2b2: "Since you came along, I've been havin' more things to do, and there's only so much one man can do."
  npc_override_sp_cor_quests_17_1_since_you_re_stranger_i_7db646: "But since you're not a stranger, I'll let you pass."
  npc_override_sp_cor_quests_17_1_small_fussy_leaves_grown_4a3268: "Small, fussy leaves have grown out of the healthy-looking pumpkin vines."
  npc_override_sp_cor_quests_17_1_small_fussy_leaves_grown_803f8f: "Small, fussy leaves have grown out of the rejuvenated pumpkin vines."
  npc_override_sp_cor_quests_17_1_small_green_beans_hangin_d611e5: "Small green beans are hanging from the rejuvenated beanstalks."
  npc_override_sp_cor_quests_17_1_small_green_beans_hangin_f4ddfe: "Small green beans are hanging from the healthy-looking beanstalks."
  npc_override_sp_cor_quests_17_1_small_hole_so_small_huma_2f3c4b: "A Small Hole so small, that a human couldn't have pass it? Ahaha..."
  npc_override_sp_cor_quests_17_1_small_report_s_just_admi_db52b7: "A small report~ It's not just to admire and do nothing, right?"
  npc_override_sp_cor_quests_17_1_so_22a9d6: "So {0},"
  npc_override_sp_cor_quests_17_1_so_either_you_re_lying_3d8fc5: "So either you're lying here, or I'm the one lying. Adventurer, am I the one lying?"
  npc_override_sp_cor_quests_17_1_so_far_i_believe_trick_f6c122: "So far, I believe it was a trick from the Enterprise, from those who sit back at the company."
  npc_override_sp_cor_quests_17_1_so_first_things_first_op_bba412: "So first things first, this operation is meant to gather more information, and then we'll launch a full attack later..."
  npc_override_sp_cor_quests_17_1_so_he_knows_he_t_cecf0c: "So, he knows he can't take us head-on. He's using guerrilla tactics."
  npc_override_sp_cor_quests_17_1_so_here_s_real_question_085063: "So here's the real question! How can we really cooperate with you if we don't have trust between us?"
  npc_override_sp_cor_quests_17_1_so_laboratory_probably_s_fe90ad: "So the laboratory is probably still in Schwarzwald. The materials can't be transported in the open,"
  npc_override_sp_cor_quests_17_1_so_let_s_start_einbroch_598be9: "So let's start with ^0000CDEinbroch^000000 at the <NAVI>[Airport]<INFO>einbroch,42,208,0,101,0</INFO></NAVI>."
  npc_override_sp_cor_quests_17_1_so_loud_05ec97: "Not so loud!!"
  npc_override_sp_cor_quests_17_1_so_now_rest_us_doing_b8b0c2: "So now, the rest of us are doing our best to shutdown Regenschirm..."
  npc_override_sp_cor_quests_17_1_so_s_why_est_so_044e18: "So that's why Est was so nervous."
  npc_override_sp_cor_quests_17_1_so_these_gunmen_think_th_cf171e: "So these gunmen think they can just come here and suddenly start a commotion!"
  npc_override_sp_cor_quests_17_1_so_we_believe_unconditio_366313: "So we have to believe it unconditionally. Isn't that strange? Do you have no evidence?"
  npc_override_sp_cor_quests_17_1_so_we_look_secret_locati_a0ae33: "so we have to look for a secret location, I guess it's going to be in one of those locations."
  npc_override_sp_cor_quests_17_1_so_what_s_going_0623da: "So what's going on?"
  npc_override_sp_cor_quests_17_1_so_what_when_you_your_fcd8c6: "So what? When you do your investigations, do you think it's a game?"
  npc_override_sp_cor_quests_17_1_so_when_i_met_kaya_63c229: "So when I met Kaya, I asked him to cooperate with me. You can help us in the yard, right?"
  npc_override_sp_cor_quests_17_1_so_when_pat_came_here_25c184: "So when Pat came here, I thought he was also a transfer. Especially at the time, because of the new research facility, the maintenance and logistic department teams..."
  npc_override_sp_cor_quests_17_1_so_where_kaufmann_right_4b3166: "So where is Kaufmann right now?"
  npc_override_sp_cor_quests_17_1_so_you_hiding_purpose_yo_500b70: "So you were hiding on purpose. Can you tell what this was all about?"
  npc_override_sp_cor_quests_17_1_so_you_know_who_s_5d51b4: "So, do you know who's in charge of moving the workforce from one department to another? Is it someone you trust?"
  npc_override_sp_cor_quests_17_1_so_you_mean_say_patrick_20b4f6: "So you mean to say Patrick wouldn't even come visit us?"
  npc_override_sp_cor_quests_17_1_so_you_searched_into_ent_158b1f: "So you searched into the Enterprise very thoroughly and your information is ^0000CD100% reliable.^000000"
  npc_override_sp_cor_quests_17_1_some_reason_there_s_been_e355cc: "For some reason, there's been no accident on the outside. Tsk."
  npc_override_sp_cor_quests_17_1_some_rebellions_already_70f1dd: "Some of the rebellions have already entered the mansion."
  npc_override_sp_cor_quests_17_1_some_researchers_their_d_36514b: "Some of the researchers or their devices can remain. Stay with the others in the areas we've cleared."
  npc_override_sp_cor_quests_17_1_some_should_stay_here_wa_d2d552: "Some should stay here to watch out in case they come back, the rest of us will head to the <NAVI>[safe place]<INFO>sp_cor,122,141,0,101,0</INFO></NAVI>!"
  npc_override_sp_cor_quests_17_1_some_time_ago_rekenber_s_91122e: "Some time ago, the Rekenber's laboratories have been under investigation because of their illegal experiments."
  npc_override_sp_cor_quests_17_1_someone_enough_suspiciou_e15dc0: "someone with enough suspicious would have figured out the truth."
  npc_override_sp_cor_quests_17_1_someone_seems_already_du_724608: "Someone seems to have already dug this place."
  npc_override_sp_cor_quests_17_1_something_doesn_t_feel_r_1195d0: "Something doesn't feel right here though."
  npc_override_sp_cor_quests_17_1_sometimes_strange_beasts_55269d: "Sometimes strange beasts roam by."
  npc_override_sp_cor_quests_17_1_soon_my_security_devices_629459: "... Soon, my security devices and traps will come out of their low power mode and become mobile again."
  npc_override_sp_cor_quests_17_1_sorry_i_m_busy_i_f33052: "Sorry, I'm busy. I don't think you city people want to be here because it smells like fertilizer. Why don't you go over there and join the others where the researchers used to be?"
  npc_override_sp_cor_quests_17_1_sorry_trouble_3985ae: "Sorry for the trouble."
  npc_override_sp_cor_quests_17_1_sounds_like_good_idea_7b48eb: "That sounds like a good idea."
  npc_override_sp_cor_quests_17_1_southeast_there_s_navi_p_7b467a: "In the southeast, there's the <NAVI>[plantation]<INFO>sp_cor,243,84,0,101,0</INFO></NAVI> that we believe to exist for food supply and research purposes."
  npc_override_sp_cor_quests_17_1_speaking_personalities_i_b84510: "Speaking of personalities, I'm like a guard myself and our spirits can't be broken. You can't break me like a wheel, I'll fight back."
  npc_override_sp_cor_quests_17_1_special_forces_lookout_a_00c8e3: "Special forces are on the lookout already, but they haven't found a laboratory..."
