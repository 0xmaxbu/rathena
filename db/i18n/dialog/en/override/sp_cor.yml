  npc_override_sp_cor_quests_17_1_cooperate_us_we_ll_help_6d4a9b: "Cooperate with us, and we'll help you continue with it."
  npc_override_sp_cor_quests_17_1_cooperating_them_0d8413: "Cooperating.. with them..?!"
  npc_override_sp_cor_quests_17_1_couldn_t_you_just_said_8dbc6a: "Couldn't you just have said that?"
