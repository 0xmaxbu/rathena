  npc_override_sp_cor_quests_17_1_like_spy_novel_411c0e: "This is like a spy novel!"
  npc_override_sp_cor_quests_17_1_list_missing_people_i_ne_95138c: "The list of missing people. I need to double check with who we have here."
  npc_override_sp_cor_quests_17_1_listen_carefully_as_i_sa_03bb51: "Listen carefully. As I said before, joining Rekenber is the envy of most people in the slums. If you can't imagine how excited it is for them, then maybe you can't think."
