  npc_override_sp_cor_quests_17_1_you_who_you_i_ve_a5ab05: "You, who are you... ? I've seen that face before... are you...?"
  npc_override_sp_cor_quests_17_1_you_you_re_adventurer_ca_da858a: "You... you're the adventurer that came with the gunmen. Am I in trouble? I didn't know anything about these illegal experiments or the institute."
