  npc_override_sp_cor_quests_17_1_alright_then_please_care_4d5484: "Alright, then please be careful."
  npc_override_sp_cor_quests_17_1_alright_we_re_going_foll_c561ee: "Alright! We're going to follow up with Pat, so the tour's next place will be at the <NAVI>[Headquarters]<INFO>lighthalzen,107,165,0,101,0</INFO></NAVI>."
  npc_override_sp_cor_quests_17_1_alright_we_re_going_foll_e29a86: "Alright! We're going to follow up with Pat, so the tour's next location will be at the <NAVI>[Headquarters]<INFO>lighthalzen,107,165,0,101,0</INFO></NAVI>."
  npc_override_sp_cor_quests_17_1_alright_you_re_elite_eli_84bde2: "Alright, you're the elite of the elites in the Rebellion, especially picked to capture this researcher who's been attacking everyone in this area, friend and foe alike."
  npc_override_sp_cor_quests_17_1_also_codename_we_use_amo_c45058: "Also this will be a codename we can use among ourselves when refer to this scientist."
  npc_override_sp_cor_quests_17_1_also_s_really_economical_5c8b48: "Also, it's really economical. Quick decision making, I like it."
