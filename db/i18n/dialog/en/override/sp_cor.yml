  npc_override_sp_cor_quests_17_1_arthur_don_t_touch_these_7dc6c2: "Arthur, don't touch these or your hands will melt."
  npc_override_sp_cor_quests_17_1_as_general_soldier_schwa_fa5ad3: "But as a general soldier in the Schwartz Republic, it was too difficult to handle it ourselves and eventually we took advantage of the Rebellion and the adventurer's strength."
  npc_override_sp_cor_quests_17_1_as_i_told_you_before_ecea6f: "As I told you before, I work around the clock... there are many laboratories here and there, I'm not sure which ones are still operational or not."
