  npc_override_sp_cor_quests_17_1_course_they_being_paid_w_c47ecf: "Of course. They are being paid for work. If you leave, you wouldn't get paid anymore, right?"
  npc_override_sp_cor_quests_17_1_course_we_re_just_gettin_57d492: "Of course not. We're just getting attacked by you, rebellions."
  npc_override_sp_cor_quests_17_1_course_you_also_use_magi_3cc21a: "Of course you can also use magic to get out... Ahaha."
  npc_override_sp_cor_quests_17_1_course_you_never_gave_hi_5f9668: "Of course not. You never gave him a chance."
  npc_override_sp_cor_quests_17_1_course_you_really_think_b3ee63: "Of course. But do you really think there's something of value in there? They would have taken it before leaving."
  npc_override_sp_cor_quests_17_1_create_e5eb84: "Create '{0}'"
  npc_override_sp_cor_quests_17_1_create_party_following_c_01572f: "To create a party with the following command ^4D4DFF'/organize PARTY NAME'.^000000"
