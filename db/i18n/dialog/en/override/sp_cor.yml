Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_sp_cor_enchan_illusion_17_1_along_few_others_around_25aa01: "Along with a few others around it."
  npc_override_sp_cor_enchan_illusion_17_1_alright_right_you_really_6a8d6f: "Alright, {0}, right? Do you really want to trade it for 50 Cor Cores?"
  npc_override_sp_cor_enchan_illusion_17_1_argh_why_you_keep_asking_ea8e52: "Argh! Why do you keep asking for me when I need to focus on my research? I'm busy, alright? If you're bored, go bring me more damaged weapons!"
  npc_override_sp_cor_enchan_illusion_17_1_attempting_upgrade_slot_3ee71c: "Attempting to upgrade the slot ^990000{0}^000000 of the equipment."
  npc_override_sp_cor_enchan_illusion_17_1_capabilities_module_ench_da7e6d: "The capabilities of this module can be enchanted up to {0} {1}. It seems that the module threshold is already at it's limit."
  npc_override_sp_cor_enchan_illusion_17_1_cor_cores_50c11a: "5 Cor Cores"
  npc_override_sp_cor_enchan_illusion_17_1_did_you_bring_damaged_we_b65745: "Did you bring Damaged Weapons? Would you like to see that science criminal? He's in there. Want me to call him for you?"
  npc_override_sp_cor_enchan_illusion_17_1_didn_t_you_come_weapons_8882fb: "Didn't you come for weapons or armor? Your bag is full. I don't have time to wait for you while you rummage through your bag. Come back later."
  npc_override_sp_cor_enchan_illusion_17_1_each_module_requires_mys_4f458e: "Each Module requires 30 Mysterious Components and 5 Cor Cores. You don't have them all. Please check."
  npc_override_sp_cor_enchan_illusion_17_1_equipment_needs_checked_62a2a9: "The equipment needs to be checked. That thing is not something this device can work with."
  npc_override_sp_cor_enchan_illusion_17_1_exchange_5dfc87: "Exchange."
  npc_override_sp_cor_enchan_illusion_17_1_exchange_os_weapon_a56254: "Exchange OS Weapon."
  npc_override_sp_cor_enchan_illusion_17_1_feel_feel_talk_me_if_9de0dc: "Feel feel to talk to me if you want Armor Modification Modules."
  npc_override_sp_cor_enchan_illusion_17_1_hello_9b56d5: "Hello."
  npc_override_sp_cor_enchan_illusion_17_1_here_take_i_bet_s_630e1d: "Here, take this {0}. I bet it's probably the best armor you've ever had. You really ought to be grateful."
  npc_override_sp_cor_enchan_illusion_17_1_hey_nice_meet_you_415d1e: "Hey, nice to meet you."
  npc_override_sp_cor_enchan_illusion_17_1_hey_you_kidding_me_hey_2e6c96: "Hey, are you kidding me? Hey, I tried to be nice!"
  npc_override_sp_cor_enchan_illusion_17_1_hey_you_kidding_me_you_293bff: "Hey, are you kidding me? You don't have all the Cor Cores! Hey, I tried to be nice!"
  npc_override_sp_cor_enchan_illusion_17_1_i_don_t_like_we_883069: "I don't like that we're working with the President and the company, but it still feels good to be busy with something."
  npc_override_sp_cor_enchan_illusion_17_1_i_gave_you_armor_modific_12a01c: "I gave you an Armor Modification Module."
  npc_override_sp_cor_enchan_illusion_17_1_i_gave_you_best_i_d5ba9c: "I gave you the best I had left."
  npc_override_sp_cor_enchan_illusion_17_1_i_going_call_her_she_368d1b: "... I was going to call her, but she's already here."
  npc_override_sp_cor_enchan_illusion_17_1_i_guide_you_exchange_ite_6a7b7c: "I will guide you to exchange items according to your job."
  npc_override_sp_cor_enchan_illusion_17_1_i_ll_give_you_whatever_940c26: "I'll give you whatever kind I want to give you, among the ones I have. Why should I let you pick?"
  npc_override_sp_cor_enchan_illusion_17_1_i_m_latest_hologram_tech_8b36c1: "^0000FF# I'm the latest hologram technology perfected to show natural responses and gestures. #^000000"
  npc_override_sp_cor_enchan_illusion_17_1_i_m_locked_up_here_305b54: "I'm locked up in here, fixing toys, because of you. You can deal with this, right?"
  npc_override_sp_cor_enchan_illusion_17_1_i_m_selling_you_want_6826d9: "I'm selling {0}, do you want to buy it?"
  npc_override_sp_cor_enchan_illusion_17_1_i_m_stopping_here_a878d6: "I'm stopping here."
  npc_override_sp_cor_enchan_illusion_17_1_i_randomly_give_you_82769e: "I can randomly give you a {0},"
  npc_override_sp_cor_enchan_illusion_17_1_i_told_you_bring_me_dd45d3: "I told you, bring me 1 Damaged Weapon and 50 Mysterious Components. You should listen when people talk."
  npc_override_sp_cor_enchan_illusion_17_1_if_you_bring_illusion_eq_9daa45: "If you bring Illusion equipment with strengthening modules, I will improve them as you desire."
  npc_override_sp_cor_enchan_illusion_17_1_if_you_want_illusion_arm_236282: "If you want Illusion armor, bring me 50 {0}. I'll give you a piece."
  npc_override_sp_cor_enchan_illusion_17_1_if_you_want_refine_navi_bdd154: "If you want to refine it, the <NAVI>[Tin Can]<INFO>sp_cor,106,136,0,101,0</INFO></NAVI> next to me can take good care of you."
  npc_override_sp_cor_enchan_illusion_17_1_if_you_want_weapon_you_29a5e5: "If you want a weapon, you can talk to Elyumina."
  npc_override_sp_cor_enchan_illusion_17_1_illusion_armor_614422: "Illusion Armor"
  npc_override_sp_cor_enchan_illusion_17_1_kind_you_get_randomly_de_9e3bf7: "The kind you get is randomly decided."
  npc_override_sp_cor_enchan_illusion_17_1_let_s_see_ooh_when_989347: "Let's see... Ooh, when did I make so many varieties? Alright, I feel generous. What do you want?"
  npc_override_sp_cor_enchan_illusion_17_1_looks_like_equipment_you_5530f4: "Looks like the equipment you're trying to strengthen is already at it's limit."
  npc_override_sp_cor_enchan_illusion_17_1_menu_axe_568ae2: "Axe: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_book_a69f1b: "Book: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_bow_9baba0: "Bow: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_cancel_c51c57: "Cancel.:Normal Grade.:Rare Grade.:Unique Grade.:Legendary Grade."
  npc_override_sp_cor_enchan_illusion_17_1_menu_crossbow_a57a7f: "Crossbow: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_dagger_0f676e: "Dagger: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_explore_eacfd3: "Explore the devices.:Enchant Illusion Armor.:Enchant Illusion Engine Wing.:Enchant Illusion Leg.:Enchant Illusion Accessory [R]:Enchant Illusion Accessory [L]"
  npc_override_sp_cor_enchan_illusion_17_1_menu_i_d00b61: "I'll think about it more...:Let's proceed."
  npc_override_sp_cor_enchan_illusion_17_1_menu_katar_a41655: "Katar: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_knuckle_49e08a: "Knuckle: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_lance_51d5ae: "Lance: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_mace_c13dd2: "Mace: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_sniper_33f1ec: "Sniper Rifle: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_staff_b2a4b2: "Staff: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_sword_5d9404: "Sword: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_menu_two_bc3705: "Two-handed Sword: {0}"
  npc_override_sp_cor_enchan_illusion_17_1_module_needs_checked_dev_28a76a: "The module needs to be checked. This device cannot detect it."
  npc_override_sp_cor_enchan_illusion_17_1_msg_6e4401: "------------------"
  npc_override_sp_cor_enchan_illusion_17_1_my_end_course_you_check_cae6db: "Not on my end, of course. This is on you. Check if your bag is full or you have all the materials you need."
  npc_override_sp_cor_enchan_illusion_17_1_my_technology_only_found_eda070: "My technology can only be found in future cities. I am RS26, a Regenschirm robotic machine."
  npc_override_sp_cor_enchan_illusion_17_1_okay_enjoy_your_conversa_6d69b1: "Okay, enjoy your conversation."
  npc_override_sp_cor_enchan_illusion_17_1_or_95f32b: "or {0}."
  npc_override_sp_cor_enchan_illusion_17_1_os_weapons_i_ll_handle_4b2e64: "OS weapons? I'll handle that if you bring me 1 {0} and 50 {1}."
  npc_override_sp_cor_enchan_illusion_17_1_please_come_back_if_you_7a7bca: "Please come back if you need my help~"
  npc_override_sp_cor_enchan_illusion_17_1_please_organize_your_ite_01b3c7: "Please organize your items and try again."
  npc_override_sp_cor_enchan_illusion_17_1_rebellion_using_building_8319b7: "The Rebellion is using this building for the moment."
  npc_override_sp_cor_enchan_illusion_17_1_request_armor_modificati_ea09b9: "Request Armor Modification Module."
  npc_override_sp_cor_enchan_illusion_17_1_request_os_weapon_c9a2dd: "Request OS Weapon."
  npc_override_sp_cor_enchan_illusion_17_1_request_weapon_modificat_77006d: "Request Weapon Modification Device (Physical)."
  npc_override_sp_cor_enchan_illusion_17_1_see_elyumina_723de2: "See Elyumina."
  npc_override_sp_cor_enchan_illusion_17_1_selected_module_enchante_cbb0b3: "The selected module can be enchanted up to ^0000FF{0} {1}^000000 on the equipment. This equipment is currently enchanted with this module by ^0000FF{2}."
  npc_override_sp_cor_enchan_illusion_17_1_since_these_modules_work_c54864: "Since these modules work with the standard equipment, they will not destroy the items. However, the number of upgrades can vary depending on the equipment."
  npc_override_sp_cor_enchan_illusion_17_1_so_you_received_message_197479: "So, you received the message. The Captains are having a meeting on the inside. Captain Elena Volkova must have called you."
  npc_override_sp_cor_enchan_illusion_17_1_then_please_visit_me_aga_465f60: "Then, please visit me again when you need my help~"
  npc_override_sp_cor_enchan_illusion_17_1_there_if_you_want_anothe_8e4607: "There. If you want another, then bring me more Damaged Weapons and Mysterious Components."
  npc_override_sp_cor_enchan_illusion_17_1_there_seems_problem_plea_5fe3ed: "There seems to be a problem. Please check if your bag has enough free space, and you have all the exchange materials you need."
  npc_override_sp_cor_enchan_illusion_17_1_took_long_time_coax_him_395db2: "It took a long time to coax him, but he eventually agreed to modify our weapons and armor. He's pretty good at it, too. He's been working all day, every day."
  npc_override_sp_cor_enchan_illusion_17_1_tsk_tsk_i_said_everythin_d60a7a: "Tsk, tsk. I said everything I make is good. Do you really have to choose? Alright, then listen up."
  npc_override_sp_cor_enchan_illusion_17_1_we_grace_equipment_excha_3ba789: "We have ^4d4dffGrace^000000 equipment that can be exchanged for {0}."
  npc_override_sp_cor_enchan_illusion_17_1_we_haven_t_been_busy_262c40: "We haven't been this busy for a long time."
  npc_override_sp_cor_enchan_illusion_17_1_welcome_welcome_14ecc0: "Welcome, Welcome!"
  npc_override_sp_cor_enchan_illusion_17_1_what_so_important_you_ha_53ee82: "What is it so important that you had to interrupt my research? This had better be important."
  npc_override_sp_cor_enchan_illusion_17_1_what_there_s_problem_d451e6: "... What the? There's a problem."
  npc_override_sp_cor_enchan_illusion_17_1_which_one_f9b0a1: "Which one?"
  npc_override_sp_cor_enchan_illusion_17_1_which_one_you_cor_cores_7eabb1: "Which one do you have, 5 Cor Cores or 1 million Zeny?"
  npc_override_sp_cor_enchan_illusion_17_1_you_business_me_i_exchan_1f7533: "Or do you have business with me? I can exchange Weapon Modification Devices and Armor Modification Modules."
  npc_override_sp_cor_enchan_illusion_17_1_you_don_t_enough_cor_96d366: "You don't have enough Cor Cores. Please check your bag again."
  npc_override_sp_cor_enchan_illusion_17_1_you_don_t_enough_zeny_490313: "You don't have enough Zeny. Please check your wallet again."
  npc_override_sp_cor_enchan_illusion_17_1_you_need_module_matches_85c6c7: "You need to have a module that matches the efficacy to proceed with enhancement."
  npc_override_sp_cor_enchan_illusion_17_1_you_selected_b0bd49: "^0000FFYou have selected {0} {1}^000000"
  npc_override_sp_cor_enchan_illusion_17_1_you_t_proceed_conversati_381a25: "You can't proceed with the conversation because you have a large quantity of items."
  npc_override_sp_cor_enchan_illusion_17_1_you_want_armor_modificat_5e11c7: "Do you want an Armor Modification Module? It's 30 {0} and 5 {1}."
  npc_override_sp_cor_enchan_illusion_17_1_you_want_proceed_c927ea: "Do you want to proceed?"
  npc_override_sp_cor_enchan_illusion_17_1_you_want_weapon_modifica_5a25fe: "Do you want a Weapon Modification Device? It's 5 {0} or 1 million Zeny."
  npc_override_sp_cor_enchan_illusion_17_1_your_bag_full_please_mak_018609: " - Your bag is full. Please make some room, and then talk to me again. -"
  npc_override_sp_cor_enchan_illusion_17_1_your_bag_full_please_mak_4abc9c: "Your bag is full. Please make some room first."
  npc_override_sp_cor_quests_17_1_aaaaah_researcher_s_us_w_d0e137: "Aaaaah!! Researcher! It's us! We're here too!"
  npc_override_sp_cor_quests_17_1_aaaah_i_haven_t_finished_e75064: "Aaaah... I haven't finished yet."
  npc_override_sp_cor_quests_17_1_aaah_how_contact_you_no_5fda94: "Aaah~ how to contact you! No matter what! Please contact us again, even if we're busy!"
  npc_override_sp_cor_quests_17_1_aaah_yes_right_right_vic_f95018: "Aaah! Yes, right, right!!! ...Vice President? Oh, hello!"
  npc_override_sp_cor_quests_17_1_aah_s_you_did_you_cddb1e: "Aah, that's you! Did you meet... with Pat?"
  npc_override_sp_cor_quests_17_1_aah_you_re_alive_adventu_0ac92e: "Aah! You're alive! Adventurer! Is anyone with you?"
  npc_override_sp_cor_quests_17_1_aah_you_want_meet_them_2f2fc1: "Aah~ Do you want to meet with them for a few more minutes~ Will the VIP come here again?"
  npc_override_sp_cor_quests_17_1_aas_est_went_look_around_19500d: "Aas and Est went to look around this area."
  npc_override_sp_cor_quests_17_1_aas_oh_my_really_you_111487: "Aas? Oh my, is it really you Aas? Are you okay? What are you doing here? Are you go to question someone who's betrayed us and changed sides?"
  npc_override_sp_cor_quests_17_1_aas_told_me_you_had_61f61a: "Aas told me you had something to deliver."
  npc_override_sp_cor_quests_17_1_aas_what_you_doing_here_de2bb1: "Aas? What are you doing here...?"
  npc_override_sp_cor_quests_17_1_abandoned_mine_beyond_ba_550454: "The abandoned mine is beyond this barrier. Be careful."
  npc_override_sp_cor_quests_17_1_about_dien_14a684: "About Dien."
  npc_override_sp_cor_quests_17_1_absolutely_nothing_946002: "Absolutely nothing."
  npc_override_sp_cor_quests_17_1_ack_what_9b06fb: "Ack, what was that?"
  npc_override_sp_cor_quests_17_1_actually_i_don_t_know_448ee2: "Actually, I don't know. Maybe you do."
  npc_override_sp_cor_quests_17_1_advanced_team_difficulty_e26455: "The Advanced Team has difficulty searching everything on its own,"
  npc_override_sp_cor_quests_17_1_adventurer_adventurer_he_21649a: "Adventurer? Adventurer!! Hey, I haven't died yet!! Never been better!!"
  npc_override_sp_cor_quests_17_1_adventurer_could_i_speak_680297: "Adventurer. Could I speak with you for a moment please?"
  npc_override_sp_cor_quests_17_1_adventurer_first_class_f_2a5be3: "Does the adventurer not have a First Class fake pass?"
  npc_override_sp_cor_quests_17_1_adventurer_go_mcdonald_s_263d09: "The adventurer will go to McDonald's laboratory with the VIP. When we finish the investigation, we'll meet you back over at McDonald's lab."
  npc_override_sp_cor_quests_17_1_adventurer_let_s_go_quic_ba0d22: "Adventurer, let's go quickly? Let's go together."
  npc_override_sp_cor_quests_17_1_adventurer_listen_me_lis_98ea28: "Adventurer! Listen to me! Listen to me and you'll be the judge of who's right. You know what these guys have been saying?"
  npc_override_sp_cor_quests_17_1_adventurer_rebellion_kee_b87435: "Adventurer, the Rebellion will keep this place surrounded and investigate the perimeter."
  npc_override_sp_cor_quests_17_1_adventurer_return_cat_bu_3066ae: "Adventurer, return to Cat on Bullet and tell Tes what happened here."
  npc_override_sp_cor_quests_17_1_adventurer_s_dangerous_h_d338c3: "Adventurer, it's dangerous here. Proceed to the safe location."
  npc_override_sp_cor_quests_17_1_adventurer_s_help_apprec_9d630b: "the adventurer's help would be appreciated! Please join the Search Team on the <NAVI>[left]<INFO>sp_cor,108,130,0,101,0</INFO></NAVI>!"
  npc_override_sp_cor_quests_17_1_adventurer_should_come_a_265723: "The adventurer should come after me."
  npc_override_sp_cor_quests_17_1_adventurer_should_take_b_a027c8: "The adventurer should take a break."
  npc_override_sp_cor_quests_17_1_adventurer_you_ll_first_046822: "Adventurer, you'll be the first one to know I have news."
  npc_override_sp_cor_quests_17_1_adventurer_you_re_here_w_49cb4e: "Adventurer! You're here! Who else would it be?"
  npc_override_sp_cor_quests_17_1_after_all_i_blinded_my_c2c7ef: "After all, I was blinded by my own ego. I didn't realize anything of what was happening."
  npc_override_sp_cor_quests_17_1_after_all_they_all_disap_8ce441: "After all, they all disappeared in a similar fashion. So once we figure out what happened to one of them, we'll know what happened to the rest too."
  npc_override_sp_cor_quests_17_1_after_memorial_dungeon_c_36bee0: "And after the Memorial dungeon is created and all your party members select Enter, you can select Enter to start the operation."
  npc_override_sp_cor_quests_17_1_age_he_received_special_525c65: "At the age 21, he received a special award for low-income families. It caused a lot of envy from the people around him."
  npc_override_sp_cor_quests_17_1_ah_adventurer_long_time_34f14a: "Ah, Adventurer! Long time, no see! Didn't you miss me?"
  npc_override_sp_cor_quests_17_1_ah_adventurer_you_too_go_fe34b5: "Ah, Adventurer, you too. Good job!"
  npc_override_sp_cor_quests_17_1_ah_argh_i_m_gonna_e15d6c: "Ah.. argh!! I'm... gonna die!!"
  npc_override_sp_cor_quests_17_1_ah_frustrating_14bcc7: "Ah, this is frustrating!"
  npc_override_sp_cor_quests_17_1_ah_i_see_you_re_e1ce51: "Ah! I see. You're looking for Patrick Kaufmann's transfer logs?"
  npc_override_sp_cor_quests_17_1_ah_i_understand_thanks_y_4e3f32: "Ah, I understand. Thanks to you guys, I've got more things to do with fewer men to do them with, but I'm alright."
  npc_override_sp_cor_quests_17_1_ah_man_i_think_i_d75494: "Ah, man. I think this is, but I can't open it. Is it too rusty or what?"
  npc_override_sp_cor_quests_17_1_ah_mm_yes_4164a6: "Ah... Mm, yes."
  npc_override_sp_cor_quests_17_1_ah_nice_meet_you_my_a4a2c2: "Ah! Nice to meet you. My name is Daisy. I'm an old friend of the Vice President."
  npc_override_sp_cor_quests_17_1_ah_right_elyumina_also_k_0b876b: "Ah, right. Elyumina will also be kept here for a while."
  npc_override_sp_cor_quests_17_1_ah_s_you_i_m_a1b324: "Ah!! That's you, I'm so sorry! I'll do my best!"
  npc_override_sp_cor_quests_17_1_ah_well_done_i_wanted_d7f66d: "Ah! Well done. I wanted to introduce her to you. She's the fiance of ^0000FFanother missing person^000000 on the list."
  npc_override_sp_cor_quests_17_1_ah_yes_you_re_right_4f6611: "Ah yes, you're right. For the special talented people, they must go through OT first and then they are assigned to their own respective department."
  npc_override_sp_cor_quests_17_1_ah_you_came_early_i_445c6b: "Ah, you came early. I thought you'd come later after a break."
  npc_override_sp_cor_quests_17_1_ah_you_re_done_yet_dd8ebb: "Ah, you're not done yet."
  npc_override_sp_cor_quests_17_1_ah_you_re_so_cold_bccf3f: "Ah, you're so cold, Adventurer. Don't be like that."
  npc_override_sp_cor_quests_17_1_ah_you_want_try_thank_c221c0: "Ah, you want to try? Thank you, Goni."
  npc_override_sp_cor_quests_17_1_ahah_a6f4d1: "Ahah..."
  npc_override_sp_cor_quests_17_1_ahah_i_polite_enough_our_861e05: "Ahah! Was I not polite enough? Our VIP is getting angry~ But the adventurer and I have gone to many places before, we know these things."
  npc_override_sp_cor_quests_17_1_ahahaha_courtesy_courtes_a36255: "Ahahaha! Courtesy, courtesy! Let's be polite to our VIP!"
  npc_override_sp_cor_quests_17_1_all_captains_inside_d3d6bd: "All the captains are inside."
  npc_override_sp_cor_quests_17_1_all_employees_go_through_6890aa: "Do all employees go through OT?"
  npc_override_sp_cor_quests_17_1_all_future_work_handled_63e9d3: "All future work will be handled through ^0000FFAas over here^000000. I will hand the bracelets to Aas."
  npc_override_sp_cor_quests_17_1_all_garbage_incinerated_2065db: "Is all the garbage incinerated here?"
  npc_override_sp_cor_quests_17_1_all_started_because_trai_e69215: "It all started because of the traitor within the guards."
  npc_override_sp_cor_quests_17_1_all_went_so_fast_069fba: "It all went so fast."
  npc_override_sp_cor_quests_17_1_already_you_ve_been_ther_ebff71: "Already? You've been there for a while today, right? I know it's not easy,You should take a break."
  npc_override_sp_cor_quests_17_1_alright_a5b0b1: "Alright!"
  npc_override_sp_cor_quests_17_1_alright_i_m_glad_hear_a11516: "Alright, I'm glad to hear it, and I will gladly accept your cooperation."
  npc_override_sp_cor_quests_17_1_alright_i_see_let_s_2de25c: "Alright, I see. Let's call it a problem, not a missing person. Do you feel better then? If it makes it easier for you, I'll call it that. Do you even want to solve this problem in a positive light?"
  npc_override_sp_cor_quests_17_1_alright_if_md_activated_1d13ac: "Alright, if MD is activated, talk to me again and select ^0000CDEnter^000000. Our operation will begin as soon as you enter."
