  npc_override_sp_cor_quests_17_1_leave_me_5e48dd: "Leave it to me."
  npc_override_sp_cor_quests_17_1_leaving_place_don_t_i_79525a: "Leaving this place? Don't, I'm dying. It's the gruesome truth. I know my body well. It's what I studied."
