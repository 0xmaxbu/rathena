  npc_override_sp_cor_quests_17_1_you_threatening_us_now_77c11c: "Are you threatening us now?"
  npc_override_sp_cor_quests_17_1_you_tired_already_there_9eea5f: "Are you tired already? There are people like this everyday. As your people suffer, more people suffer, so much that you can't even recognize pain."
