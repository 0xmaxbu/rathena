  npc_override_sp_cor_quests_17_1_if_you_look_around_close_044847: "If you look around closely, you'll understand."
  npc_override_sp_cor_quests_17_1_if_you_mean_your_illegal_4b8b83: "If you mean your illegal experimentation results,"
  npc_override_sp_cor_quests_17_1_if_you_pressured_above_y_5a3909: "But if you are pressured from above, you have to abide and give them the workforce, right?"
  npc_override_sp_cor_quests_17_1_if_you_re_adventurer_if_402900: "If you're an adventurer, if you're interested, it's managed by Captain Volkova's <NAVI>[subordinates]<INFO>sp_cor,108,130,0,101,0</INFO></NAVI>, so go and ask."
