Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@os_a_OsOccupation_ask_about_fallen_mutant_ebbafc: "Ask about the fallen mutant."
  npc_override_1@os_a_OsOccupation_ask_about_miguel_fb379b: "Ask about Miguel"
  npc_override_1@os_a_OsOccupation_ask_about_records_fd33fd: "Ask about the records."
  npc_override_1@os_a_OsOccupation_before_i_die_i_always_a26e9c: "Before I die... I always wanted to see my old colleagues... You fulfilled my wish."
  npc_override_1@os_a_OsOccupation_coordinates_received_d14c98: "## Coordinates Received ##"
  npc_override_1@os_a_OsOccupation_enter_message_input_6702bb: "## Enter Message Input ##"
  npc_override_1@os_a_OsOccupation_est_9b0231: "... Est?"
  npc_override_1@os_a_OsOccupation_est_last_thing_i_ll_9ad1bc: "... Est, the last thing I'll see... is your face... That's a relief."
  npc_override_1@os_a_OsOccupation_est_rebellion_ghost_squa_643e0b: "Est... Rebellion Ghost Squad... Do you remember uncle Miguel?"
  npc_override_1@os_a_OsOccupation_est_you_still_big_heart_97c796: "Est... you still have a big heart... that kind of feeling... on the battlefield... I taught you..."
  npc_override_1@os_a_OsOccupation_even_though_s_cp_rated_395c34: "Even though it's a CP7 Rated, sorry I couldn't give you more experience."
  npc_override_1@os_a_OsOccupation_find_everything_you_ll_k_3c5c35: "Find everything... and you'll know what happened to me... you'll see things that can't be explained here."
  npc_override_1@os_a_OsOccupation_focus_briefing_e19f09: "Focus on the briefing."
  npc_override_1@os_a_OsOccupation_get_identification_tag_h_e8bdfc: "Get the identification tag and hand it to Est."
  npc_override_1@os_a_OsOccupation_ha_haha_you_still_rememb_bb925a: "Ha... haha... you still remember."
  npc_override_1@os_a_OsOccupation_here_supplies_experience_3c9a42: "Here are the supplies and experience given to the troops that joined the operation. Take it."
  npc_override_1@os_a_OsOccupation_how_you_know_my_name_dd7e9b: "How do you know my name? Who are you! I'll finish you painlessly, so be honest."
  npc_override_1@os_a_OsOccupation_how_you_know_name_a81a9e: "How do you know that name..."
  npc_override_1@os_a_OsOccupation_i_checked_northeast_sect_6ad483: "I checked the northeast section and saw a place over the railway that seemed to be a research facility."
  npc_override_1@os_a_OsOccupation_i_don_t_think_there_b9b9c7: "I don't think there will be anything else to do here."
  npc_override_1@os_a_OsOccupation_i_think_he_stopped_breat_871a38: "^0000FFI think he stopped breathing.^000000"
  npc_override_1@os_a_OsOccupation_i_want_go_back_37f0e8: "I want to go back."
  npc_override_1@os_a_OsOccupation_identification_tag_mutan_f020b1: "^0000FFThe identification tag on the mutant's neck stands out.^000000"
  npc_override_1@os_a_OsOccupation_intermediate_point_secur_17db25: "Intermediate point secured."
  npc_override_1@os_a_OsOccupation_krrr_i_guess_you_re_deebff: "Krrr. I guess you're not someone of Regenschirm. Can you move aside, I have something to say to that person."
  npc_override_1@os_a_OsOccupation_let_s_go_out_now_8efb7c: "Let's go out now. We need to prepare for repairs quickly."
  npc_override_1@os_a_OsOccupation_maybe_research_miguel_ta_acbb18: "Maybe the research Miguel was talking about... is somewhere in there. I'm going to have to start another operation right away."
  npc_override_1@os_a_OsOccupation_menu_alpha_4b11ec: "Alpha : It's an ambush! Current coordinates are are Oscar Sierra 9...@$%**!"
  npc_override_1@os_a_OsOccupation_menu_alpha_5280fa: "Alpha : ---- Tchhhhhhh ----"
  npc_override_1@os_a_OsOccupation_menu_alpha_673a1e: "Alpha : The drainage channel is now clear of mutants. Residual biological experiments were confirmed. We are preparing for the second engagement."
  npc_override_1@os_a_OsOccupation_menu_alpha_cb52b2: "Alpha : Alpha is approaching south. We found a number of mutants heading north towards Echo."
  npc_override_1@os_a_OsOccupation_menu_alpha_cf6e54: "Alpha : Alpha found a number of mutants on southern drainage. We're going to engage in battle."
  npc_override_1@os_a_OsOccupation_menu_chemical_150564: "Chemical Treatment Unit : The biogas facilities locked has been completed. The residual gas will continue for the next few minutes."
  npc_override_1@os_a_OsOccupation_menu_est_021870: "Est : Alpha Team, start searching around the southern waterway."
  npc_override_1@os_a_OsOccupation_menu_est_17679d: "Est : It's time. We're moving. {0}'s unit is a support team, wait here and respond to communications."
  npc_override_1@os_a_OsOccupation_menu_est_239fc1: "Est : {0}, are you still alive?"
  npc_override_1@os_a_OsOccupation_menu_est_262911: "Est : {0}, can you hear me?"
  npc_override_1@os_a_OsOccupation_menu_est_26ff2b: "Est : Alpha, roger. Echo, status report."
  npc_override_1@os_a_OsOccupation_menu_est_39a0a8: "Est : There isn't much information, so it's our duty to create those information. From now on, we'll split into 3 groups and subdue this place."
  npc_override_1@os_a_OsOccupation_menu_est_3a67d3: "Est : ---Roger."
  npc_override_1@os_a_OsOccupation_menu_est_3b1a31: "Est : Echo's reception is not smooth. Re-transmit the message."
  npc_override_1@os_a_OsOccupation_menu_est_41313c: "Est : We shouldn't have situations where we'll ask for support, but if such situation occurs, the Echo team will be called."
  npc_override_1@os_a_OsOccupation_menu_est_4f8c06: "Est : {0} can you hear me? If you can, please respond."
  npc_override_1@os_a_OsOccupation_menu_est_52bb5e: "Est : The Echo team is in charge of backups under the command of {0}. You will block this place and prevent individuals from going outside."
  npc_override_1@os_a_OsOccupation_menu_est_69d7a3: "Est : {0}, check if there are any traces around there."
  npc_override_1@os_a_OsOccupation_menu_est_6c8917: "Est : I wish the same for Team Echo."
  npc_override_1@os_a_OsOccupation_menu_est_7638fa: "Est : If you get too close, you'll die immediately, so don't move until the treatment is finished..."
  npc_override_1@os_a_OsOccupation_menu_est_7e939e: "Est : Reception sensitivity is good, Echo prepare for response, and report when anything occurs."
  npc_override_1@os_a_OsOccupation_menu_est_8a2568: "Est : Bravo has completed the search on the east side."
  npc_override_1@os_a_OsOccupation_menu_est_92a819: "Est : Alpha is unresponsive. {0} please support them. The coordinates are Oscar Sierra 32 356"
  npc_override_1@os_a_OsOccupation_menu_est_9d0c82: "Est : Alpha, send a transmission after you're done with the engagement."
  npc_override_1@os_a_OsOccupation_menu_est_9dc7a6: "Est : Bravo Team, you will be sweeping with me before the eastern boundary."
  npc_override_1@os_a_OsOccupation_menu_est_a3198b: "Est : We are going to move south. I'll transmit the new coordinates. Please prepare yourselves for an engagement."
  npc_override_1@os_a_OsOccupation_menu_est_a619ef: "Est : I will send the estimated coordinates of their last contact point using the radio. Please send support after getting the information on the radio."
  npc_override_1@os_a_OsOccupation_menu_est_b2bb57: "Est : I have confirmed that there's biogas spreading at the front and it's currently under treatment."
  npc_override_1@os_a_OsOccupation_menu_est_b6fbf5: "Est : Alpha retransmit your coordinates. Alpha!!! Please respond!!."
  npc_override_1@os_a_OsOccupation_menu_est_be5fe6: "Est : Damn!... Echo, check if you can get support to Alpha's coordinates."
  npc_override_1@os_a_OsOccupation_menu_est_c1d0db: "Est : Engagement on our side has ended."
  npc_override_1@os_a_OsOccupation_menu_est_c82d04: "Est : If you see a mutant who can communicate, immediately capture it. Other than that... You can subdue them all."
  npc_override_1@os_a_OsOccupation_menu_est_cc7e9d: "Est : {0}!! Response your current situation!!"
  npc_override_1@os_a_OsOccupation_menu_est_d09bfc: "Est : I transmitted the second search coordinates. Be careful not to lose your records."
  npc_override_1@os_a_OsOccupation_menu_est_d536c4: "Est : Bravo is also moving towards there, we're skipping the eastern point."
  npc_override_1@os_a_OsOccupation_menu_est_e068b4: "Est : {0}! Check Alpha's coordinates if it's available!"
  npc_override_1@os_a_OsOccupation_menu_est_ed69b1: "Est : First, we need to establish bases here. We don't know how many individuals are lurking around."
  npc_override_1@os_a_OsOccupation_menu_est_f10d75: "Est : {0}. Please look around if there are any traces left."
  npc_override_1@os_a_OsOccupation_menu_look_27eba6: "Look around more.:Go Out"
  npc_override_1@os_a_OsOccupation_menu_operation_1d5fa4: "Operation Officer : It is said that it's combat ability is stronger than of ordinary mutants, avoid combat unless you are willing to fight."
  npc_override_1@os_a_OsOccupation_menu_operation_1f7db8: "Operation Officer : Sector 4 is said to be a confidential documents storage room."
  npc_override_1@os_a_OsOccupation_menu_operation_303a88: "Operation Officer : Be careful when dealing with CP4 or higher grade mutants."
  npc_override_1@os_a_OsOccupation_menu_operation_311d4b: "Operation Officer : Alpha, Charlie, Delta team should also be careful. Don't get surrounded by CP6 Grade mutants!"
  npc_override_1@os_a_OsOccupation_menu_operation_37293f: "Operation Officer : Charlie, and Delta Team, if there is an engagement situation, immediately go into battle without reporting."
  npc_override_1@os_a_OsOccupation_menu_operation_52f8b8: "Operation Officer : There are no civilian in the main search area, so you can safely subdue any moving creatures."
  npc_override_1@os_a_OsOccupation_menu_operation_65b5a7: "Operation Officer : We received a precaution within this area."
  npc_override_1@os_a_OsOccupation_menu_operation_832b19: "Operation Officer : The advanced team already searched the area, but there was nothing special, so focus on the battle and be careful to not get surrounded."
  npc_override_1@os_a_OsOccupation_menu_operation_94e67e: "Operation Officer : Guess I'm a little late!"
  npc_override_1@os_a_OsOccupation_menu_operation_ae116e: "Operation Officer : The Alpha team should be prepare to fight the moment you felt a Mutant's reaction near you."
  npc_override_1@os_a_OsOccupation_menu_operation_b371e8: "Operation Officer : They are the same type as CP1, but their destructive power increases with their grade. Be careful not to be surrounded."
  npc_override_1@os_a_OsOccupation_menu_operation_ca5eba: "Operation Officer : Bravo Team. Is engaged with CP6 Mutants. Their offense is very powerful."
  npc_override_1@os_a_OsOccupation_menu_operation_cdf8b5: "Operation Officer : A mutant labeled with A013 is a independent mutant unrelated to its base."
  npc_override_1@os_a_OsOccupation_menu_operation_eb93df: "Operation Officer : Be careful, it's difficult to deal with mutants with high CP grade!"
  npc_override_1@os_a_OsOccupation_menu_operation_fd3aa6: "Operation Officer : To all team. If you find an S-Class mutant, please engage in the battle immediately."
  npc_override_1@os_a_OsOccupation_menu_options_0b3906: "?????? : Echo-coordinates mutant artillery support is complete."
  npc_override_1@os_a_OsOccupation_menu_options_2bf6ea: "?????? : Foxtrot reporting, coordinates received. Please be careful to hit only the mutants."
  npc_override_1@os_a_OsOccupation_menu_options_311240: "???? : Grrr..."
  npc_override_1@os_a_OsOccupation_menu_options_34703b: "?????? : This is Foxtrot. Ground artillery support has been prepared. Please send the coordinates that needs support."
  npc_override_1@os_a_OsOccupation_menu_options_7a4bf2: "?????? : In 3 seconds, the mutant only ground artillery will be sent on the side of Echo."
  npc_override_1@os_a_OsOccupation_mi_guel_51605c: "Mi... guel...?"
  npc_override_1@os_a_OsOccupation_msg_6eae3a: "..."
  npc_override_1@os_a_OsOccupation_mutant_who_s_life_runnin_33ab85: "^0000FFThe mutant who's life is running out is trying to say something.^000000"
  npc_override_1@os_a_OsOccupation_no_communication_status_47a453: "## No Communication Status ##"
  npc_override_1@os_a_OsOccupation_nothing_particular_1a82bd: "Nothing in particular."
  npc_override_1@os_a_OsOccupation_received_message_1f6567: "## Received Message ##"
  npc_override_1@os_a_OsOccupation_remaining_mutant_survivo_49c49d: "Remaining Mutant Survivor - {0}"
  npc_override_1@os_a_OsOccupation_sector_secured_bcdcab: "Sector {0} secured."
  npc_override_1@os_a_OsOccupation_send_message_input_986d87: "## Send Message Input ##"
  npc_override_1@os_a_OsOccupation_so_don_t_delay_too_ed59db: "Is that so? Don't delay it for too long."
  npc_override_1@os_a_OsOccupation_somewhere_here_mad_resea_a05605: "Somewhere in here... the mad research results of Regenschirm... can be found somewhere in here."
  npc_override_1@os_a_OsOccupation_team_alpha_s_last_commun_f4a253: "## Team Alpha's last communication was at Oscar Sierra 52 177 ##"
  npc_override_1@os_a_OsOccupation_there_no_trace_alpha_onl_1c40a9: "There is no trace of alpha. Only the radio."
  npc_override_1@os_a_OsOccupation_ugh_i_don_t_much_09dba0: "Ugh... I don't have much time left... Listen carefully, Est."
  npc_override_1@os_a_OsOccupation_uncle_miguel_how_did_hap_7dd4c9: "Uncle Miguel!? How did this happen!"
  npc_override_1@os_a_OsOccupation_uncle_uncle_2d2066: "Uncle! Uncle!!"
  npc_override_1@os_a_OsOccupation_uncle_wake_up_let_s_bd06bb: "Uncle! Wake up!! Let's go out. If we go out, we can save you!"
  npc_override_1@os_a_OsOccupation_uncle_what_what_happened_214312: "Uncle! What is this! What happened to you?"
  npc_override_1@os_a_OsOccupation_well_even_if_you_ask_387001: "Well, even if you ask me... it's the first time that I'll talk to a mutant."
  npc_override_1@os_a_OsOccupation_you_ve_dealt_cp_mutant_137274: "You've dealt with a CP7 Mutant by yourself... did the battle went well?"
