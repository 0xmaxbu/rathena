  npc_override_que_qaru01_okolnir_menu_piamette_057581: "Piamette : Whooping fun times are back! Now, Go! I'll get back to!!"
  npc_override_que_qaru01_okolnir_menu_piamette_1e9d3f: "Piamette : Silly birds! Silly Teo! Why can't you put away the cage at once?!"
  npc_override_que_qaru01_okolnir_menu_piamette_28d2bc: "Piamette : All the keeper of keys are dead now? Who freed my birds? Teo, who did it?"
  npc_override_que_qaru01_okolnir_menu_piamette_2f9c62: "Piamette mumblings : Ha! They are caged in."
  npc_override_que_qaru01_okolnir_menu_piamette_414bd7: "Piamette : All of them are caught!"
  npc_override_que_qaru01_okolnir_menu_piamette_6b5ad9: "Piamette mumblings : ...Shh.. Teo. The birds have returned..Are they birds that ran away before...? Or breakers who disguises themselves as good adventurers?"
  npc_override_que_qaru01_okolnir_menu_piamette_acda86: "Piamette : The keeper of the key is protecting my cage."
  npc_override_que_qaru01_okolnir_menu_piamette_c93558: "Piamette mumblings : ..There were six birds, Teo. But one is...."
  npc_override_que_qaru01_okolnir_menu_piamette_caaa7a: "Piamette : I'm pissed off now!"
  npc_override_que_qaru01_okolnir_menu_piamette_df7fc1: "Piamette : Teo, Catch the birds! Put the cage away from here!"
  npc_override_que_qaru01_okolnir_menu_piamette_ed8ae7: "Piamette : Let's call out the keeper of the key not to let the birds go far away."
  npc_override_que_qaru01_okolnir_menu_sure_d1d739: "Sure let's go there.:No."
  npc_override_que_qaru01_okolnir_menu_we_9346a9: "We are ready.:We need more time."
  npc_override_que_qaru01_okolnir_menu_wish_1357fb: "Wish Maiden : ... Okolnir will soon disappear... I will send you back to where you originally came from."
  npc_override_que_qaru01_okolnir_menu_wish_405ff1: "Wish Maiden: ..Have courage ... and await your chance again... "
  npc_override_que_qaru01_okolnir_menu_wish_48b272: "Wish Maiden: But it's the end. There will be summoned monsters coming soon..."
  npc_override_que_qaru01_okolnir_menu_wish_577989: "Wish Maiden : I sincerely welcome all your best efforts!"
  npc_override_que_qaru01_okolnir_menu_wish_640e9d: "Wish Maiden : You guys reached here.. Are your guardians dead...?"
  npc_override_que_qaru01_okolnir_menu_wish_7b1f71: "Wish Maiden: The gate of Okolnir is open! Don't forget you only have one hour."
  npc_override_que_qaru01_okolnir_menu_wish_9086b4: "Wish Maiden: ... You will fall into a deep sleep within Okolnir... "
  npc_override_que_qaru01_okolnir_menu_wish_b21672: "Wish Maiden: So come here to me safely..."
  npc_override_que_qaru01_okolnir_menu_wish_b39ae5: "Wish Maiden : Do your best, Okolnir will disappear in one hour!"
  npc_override_que_qaru01_okolnir_menu_wish_c5a7f0: "Wish Maiden: How does it feel to see shadows of the past. This is only the beginning."
  npc_override_que_qaru01_okolnir_menu_wish_ca6232: "Wish Maiden: Did you have a good time with Piamette?"
  npc_override_que_qaru01_okolnir_menu_wish_d2afbb: "Wish Maiden: The things you seeing are not real, don't be caught in the Mystic garden."
  npc_override_que_qaru01_okolnir_menu_wish_ef571d: "Wish Maiden : ..Good, you deserve the Goddess' shine."
