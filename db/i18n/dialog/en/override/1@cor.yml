Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@cor_CorOperation_after_summoning_monsters_50793d: "After summoning monsters, it constantly releases chemical poison, making it even more difficult to remove the monster."
  npc_override_1@cor_CorOperation_after_summoning_monsters_8c2d71: "After summoning the monsters, it summons a bio-battery to strengthen the monsters and explodes."
  npc_override_1@cor_CorOperation_after_you_ve_cleared_fou_5c744f: "After you've cleared the four traps, EL1_A17T will come out, and this lady here will bring you to the same place as last time."
  npc_override_1@cor_CorOperation_alright_let_me_know_when_fd7c38: "Alright, let me know when you're ready to go out."
  npc_override_1@cor_CorOperation_avoid_chemical_poison_ki_0061a7: "Avoid the Chemical Poison and kill the monsters!"
  npc_override_1@cor_CorOperation_briefing_criminal_here_o_b575e5: "The briefing... the criminal here will be the one to do it."
  npc_override_1@cor_CorOperation_cause_explosion_unknown_a47753: "The cause of the explosion is unknown, but I've found this suspicious box at the site. It seems to be some type of mechanism."
  npc_override_1@cor_CorOperation_come_i_about_open_96a9a3: "Come on, I was about to open it."
  npc_override_1@cor_CorOperation_destroy_biological_batte_9aeeee: "Destroy the Biological Battery and kill the monsters!"
  npc_override_1@cor_CorOperation_did_i_tell_you_i_0c7e32: "Did I tell you that I'm really happy working with the Secret Wing? Thanks to them, I was chosen for this operation."
  npc_override_1@cor_CorOperation_did_you_just_call_those_be5c36: "Did you just call those scraps children?"
  npc_override_1@cor_CorOperation_didn_t_i_say_call_120e8f: "Didn't I say not to call it scrap of metal?! You idiot!"
  npc_override_1@cor_CorOperation_divide_into_teams_everyo_76e3d6: "Divide into 4 teams, everyone at their own locations and start suppressing the leads. If any team finds Elyumina, let us know immediately."
  npc_override_1@cor_CorOperation_don_t_worry_about_those_49d10f: "Don't worry about those already at the front, they adjust to any situation."
  npc_override_1@cor_CorOperation_everyone_your_position_s_92ae4a: "Everyone, to your position! Start the operation!"
  npc_override_1@cor_CorOperation_fast_expected_my_kids_wo_7564a1: "That was fast... It was expected that my kids wouldn't win though."
  npc_override_1@cor_CorOperation_give_me_signal_when_you_339b14: "Give me a signal when you're ready to get in. I'll tell the squad to let you in."
  npc_override_1@cor_CorOperation_go_ahead_touch_traps_tra_fe161d: "Go ahead and touch the traps. The traps will activate and my lovely children will appear."
  npc_override_1@cor_CorOperation_good_job_s_funny_we_600fbc: "Good job. It's funny that we have to do this again tomorrow. See you tomorrow."
  npc_override_1@cor_CorOperation_good_work_we_ll_clearing_58bcd7: "Good work. We'll be clearing things up here, you can take a break. I'm going to interrogate her. Take a break and then come back to me."
  npc_override_1@cor_CorOperation_haha_isn_t_your_job_08e58d: "Haha! Isn't that your job? Do it properly. Why are you leaving the briefing to me?"
  npc_override_1@cor_CorOperation_hahaha_yes_let_s_work_84d143: "Hahaha! Yes. Let's work hard. Gather more battle data for me!"
  npc_override_1@cor_CorOperation_heh_i_ll_explaining_beca_0835c0: "Heh, I'll do the explaining because I want to take care of my children!"
  npc_override_1@cor_CorOperation_hello_adventurer_04c899: "Hello adventurer."
  npc_override_1@cor_CorOperation_here_take_map_informatio_29b3ea: "Here, take the map. The information will also be delivered to the party members as well."
  npc_override_1@cor_CorOperation_i_already_know_you_adven_90bc89: "I already know you adventurer, but please be careful."
  npc_override_1@cor_CorOperation_i_ask_you_act_separately_38cd95: "I ask you to act separately adventurer. Please check your ^0000CDminimap^000000 to organize the situation as quickly as possible. Join the team if they need support!"
  npc_override_1@cor_CorOperation_i_haven_t_seen_you_74c859: "I haven't seen you in a while adventurer."
  npc_override_1@cor_CorOperation_i_ll_conversation_crimin_7ee543: "...I'll have a conversation with this criminal in a bit... Anyways. I'm counting on you, adventurers!"
  npc_override_1@cor_CorOperation_i_ll_start_explaining_op_8b0aaf: "I'll start explaining the operation. First of all..."
  npc_override_1@cor_CorOperation_i_ran_away_also_s_3c96bf: "I ran away also, It's quite embarrassing since you knocked down that huge scrap of metal. I also captured something mesmerizing."
  npc_override_1@cor_CorOperation_i_ve_been_waiting_you_faf2cb: "I've been waiting for you. I've found the crazy researcher."
  npc_override_1@cor_CorOperation_if_you_take_care_machine_4c98ea: "If you take care of the machine, the other search parties will take care of finding Elyumina."
  npc_override_1@cor_CorOperation_if_you_touch_chemical_po_155f1b: "If you touch the chemical poison, it will spread like bomb. You shouldn't get any closer."
  npc_override_1@cor_CorOperation_if_you_want_handle_just_1af396: "If you want to handle it, just destroy it. It's good because it's a simple solution."
  npc_override_1@cor_CorOperation_let_s_go_support_another_5ed186: "- Let's go support another team. -"
  npc_override_1@cor_CorOperation_let_s_show_them_what_f64624: "Let's show them what we're all about, and that we're good guys."
  npc_override_1@cor_CorOperation_looks_like_you_ve_found_91c26b: "It looks like you've found something interesting here. You should check out the other teams!"
  npc_override_1@cor_CorOperation_menu_give_ed428c: "Give signal.:Not yet."
  npc_override_1@cor_CorOperation_menu_go_945b71: "Go back.:Stay for a moment."
  npc_override_1@cor_CorOperation_menu_go_d9aab1: "Go in.:Don't go in yet."
  npc_override_1@cor_CorOperation_menu_have_fb6fc8: "Have you done this already?:Are you still silent?"
  npc_override_1@cor_CorOperation_menu_i_16238d: "I'm going right back.:I'll stay here for a bit"
  npc_override_1@cor_CorOperation_msg_e95f89: "....."
  npc_override_1@cor_CorOperation_my_children_start_settin_7e7cbf: "My children will start setting up traps in <TIPBOX>[four places]<INFO>8086</INFO></TIPBOX>."
  npc_override_1@cor_CorOperation_nice_part_squad_we_ve_bdd66c: "It was nice to be part of this squad, we've already taken care of this box."
  npc_override_1@cor_CorOperation_nods_nods_0fa2ab: "*Nods, nods*"
  npc_override_1@cor_CorOperation_now_you_run_wild_43f34b: "...... now you can run wild."
  npc_override_1@cor_CorOperation_oh_yes_you_ve_worked_d7537d: "Oh, yes. You've worked hard again this time. It's quite tough! How long do we have to use that scrap of metal for it to stop?"
  npc_override_1@cor_CorOperation_okay_s_almost_time_e60428: "... Okay, it's almost time."
  npc_override_1@cor_CorOperation_okay_watch_out_i_opened_2eaaf6: "Okay, watch out! I opened the portal so that you can go in. It's a one way entry, so make sure you're prepared!"
  npc_override_1@cor_CorOperation_order_control_such_machi_71f741: "In order to control such a machine in such a fine manner, Elyumina must be around."
  npc_override_1@cor_CorOperation_other_guys_surrounding_p_80c2ce: "The other guys are surrounding the place."
  npc_override_1@cor_CorOperation_place_we_ll_enter_o_717c37: "The place we'll enter will be at 9 o'clock. I confirmed that nobody was hiding there, and we blocked the exits."
  npc_override_1@cor_CorOperation_possible_me_handle_machi_a38a79: "It would be possible for me to handle this machine, but then I wouldn't be able to catch Elyumina."
  npc_override_1@cor_CorOperation_rebellion_squad_well_coo_b6de13: "The Rebellion squad is well coordinated, this work will be best suited for us. So leave that task to us."
  npc_override_1@cor_CorOperation_s_awful_interesting_devi_d02b64: "It's an awful but interesting device. It wasn't a device meant to summon monsters."
  npc_override_1@cor_CorOperation_s_explanation_now_get_wo_7d7a07: "That's it for the explanation. Now, get to work! Muscle idiots! Ahahaha!"
  npc_override_1@cor_CorOperation_s_hard_babysit_criminals_62c8f8: "It's hard to babysit criminals."
  npc_override_1@cor_CorOperation_s_quite_sudden_i_m_b6f840: "It's quite sudden but, I'm changing the operation."
  npc_override_1@cor_CorOperation_s_what_he_said_you_4f3ede: "That, that's what he said... are you afraid that I'll be scared!"
  npc_override_1@cor_CorOperation_scrap_metal_s_masterpiec_5eb460: "Scrap metal! It's a masterpiece! My great child!"
  npc_override_1@cor_CorOperation_smoke_rising_suspicious_292e29: "- Smoke is rising from the suspicious box. -"
  npc_override_1@cor_CorOperation_so_looks_like_over_i_7b34bf: "So, it looks like this is over, I'll go join another team! You should too."
  npc_override_1@cor_CorOperation_so_noisy_before_we_get_2ddaa5: "So noisy. Before we get started. Are you part of the USU now?"
  npc_override_1@cor_CorOperation_something_seems_exploded_0b260b: "Something seems to have exploded over there. The flames have risen from the front!"
  npc_override_1@cor_CorOperation_sorry_late_analysis_wasn_c44c0f: "Sorry for the late analysis. It wasn't a device to summon monsters."
  npc_override_1@cor_CorOperation_there_identified_locatio_ff6f20: "There are 4 identified locations these explosion came from! I have ^FF0000shown them on your minimap.^000000"
  npc_override_1@cor_CorOperation_there_s_lot_more_trouble_2a3c6b: "There's a lot more trouble going on up there~"
  npc_override_1@cor_CorOperation_there_signal_being_trans_de0d67: "There is a signal being transmitted from the inside... Huh, be careful. Something's happening!"
  npc_override_1@cor_CorOperation_there_suspicious_box_sig_9dddbf: "There is a suspicious box! A signal is being transmitted from the inside, it's currently being decrypted!"
  npc_override_1@cor_CorOperation_these_machines_uses_chem_4462aa: "These machines uses chemical poison, be careful."
  npc_override_1@cor_CorOperation_we_now_conduct_our_searc_ee908e: "We will now conduct our search, until the signal comes. Adventurer, be careful!"
  npc_override_1@cor_CorOperation_well_done_operation_succ_ce482f: "Well done, {0}. The operation was a success!"
  npc_override_1@cor_CorOperation_well_looks_like_over_f5a1eb: "Well, it looks like this is over...."
  npc_override_1@cor_CorOperation_well_your_children_proba_30d9a3: "Well, your children are probably good. Then let's go pay the price for your children's mistakes."
  npc_override_1@cor_CorOperation_what_you_going_now_24d08d: "What are you going to do now {0}?"
  npc_override_1@cor_CorOperation_yeah_yeah_wasn_t_scrap_d8c623: "Yeah yeah, it wasn't a scrap metal at first. But now we've caught it, it's scrap metal. Anyway, you've worked hard. You go back and rest now."
  npc_override_1@cor_CorOperation_yes_s_dangerous_opponent_6a3c7b: "Yes it's a dangerous opponent to face. I'm sorry to have to leave you alone to fight. Let me know when you're ready."
  npc_override_1@cor_CorOperation_you_aren_t_alone_right_d7a2ef: "You aren't alone right? You know my children are powerful?"
  npc_override_1@cor_CorOperation_you_going_straight_my_el_01e336: "... are you going straight for my EL1-A17T?"
  npc_override_1@cor_CorOperation_you_remember_how_traps_w_9ab686: "You do remember how the traps work, right?"
  npc_override_1@cor_CorOperation_you_you_hurt_my_child_926fcf: "You! You... hurt my child! You destroyed my child!"
