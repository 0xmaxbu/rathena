Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_card_separation_card_separation_addition_oil_so_useful_s_3239d6: "In addition, this oil is so useful to separate relics from equipped weapons that we can't buy Premium Lubricant and Ordinary Lubricant with Zeny."
  npc_override_card_separation_card_separation_all_results_card_separat_703720: "That is all for the results of the card separation. Please come again."
  npc_override_card_separation_card_separation_card_been_damaged_unreco_4909af: "Card has been damaged. ^ff0000Unrecoverable.^000000"
  npc_override_card_separation_card_separation_card_equipped_you_want_c_d7c415: "The card is not equipped. Do you want to check again?"
  npc_override_card_separation_card_separation_card_separation_succeede_c6b28c: "^0000ffCard separation has succeeded.^000000"
  npc_override_card_separation_card_separation_crack_occurred_during_ca_83188a: "Crack has occurred during the card separation process."
  npc_override_card_separation_card_separation_crack_occurred_during_ca_f9d78d: "Crack has not occurred during the card separation process."
  npc_override_card_separation_card_separation_equipment_been_damaged_u_21ae27: "Equipment has been damaged. ^ff0000Unrecoverable.^000000"
  npc_override_card_separation_card_separation_equipment_contains_preci_86f185: "This equipment contains a precious MVP card. This card can't be separated with lubricant. If you bring the super surfactant ^0000ffSillit Pong^000000, I will be able to work."
  npc_override_card_separation_card_separation_equipment_separation_nor_a1097b: "^0000FFEquipment separation is normal.^000000"
  npc_override_card_separation_card_separation_erosion_surface_occurred_48c6d3: "Erosion of surface has occurred during the card separation process."
  npc_override_card_separation_card_separation_erosion_surface_occurred_c66675: "Erosion of surface has not occurred during the card separation process."
  npc_override_card_separation_card_separation_generally_fee_zeny_durin_49eaa8: "Generally the fee is 1,000,000 Zeny. During the card separation, you can use ^990000special items that reduce the rate of destroying equipment or cards^000000. We don't charge additional zeny for this."
  npc_override_card_separation_card_separation_hehe_everyone_loves_ther_5ae4cd: "Hehe... Everyone loves it. But there were some problems before."
  npc_override_card_separation_card_separation_however_after_revitalizi_c87c39: "However, after a revitalizing refining process, this fish oil became valuable to use for old equipment care and industrial lubricant."
  npc_override_card_separation_card_separation_i_knew_well_limited_666de3: "I knew that well. Is it that limited?"
  npc_override_card_separation_card_separation_i_learned_new_skill_sepa_39935e: "I have learned a new skill that separates cards from Armor, Shoes, Garment and Headgear. Do you want to try it?"
  npc_override_card_separation_card_separation_i_m_sure_about_quality_f434ed: "I'm not sure about the quality of success. Anyway, this is so cheap, right?"
  npc_override_card_separation_card_separation_if_you_use_ordinary_lubr_a3ff0f: "If you use the Ordinary Lubricant, the rate of destruction will be decreased highly, but I can't give you a 100% guarantee. Are you sure you want to continue?"
  npc_override_card_separation_card_separation_if_you_use_premium_lubri_e7ccd7: "If you use the Premium Lubricant, the rate of destruction will be decreased highly, but I can't give you a 100% guarantee. Are you sure you want to continue?"
  npc_override_card_separation_card_separation_jeremy_stretching_his_sh_eb6dfc: "^000099Jeremy is stretching his shoulders and hands. He might be waiting for someone to talk with him.^000000"
  npc_override_card_separation_card_separation_long_time_no_see_a118c8: "Long time no see~"
  npc_override_card_separation_card_separation_may_i_continue_d56a10: "May I continue?"
  npc_override_card_separation_card_separation_menu_except_1ad0e1: "Except cards, ^ff0000all enchanted effects will disappear.^000000 If you agree to this, please choose the work type:"
  npc_override_card_separation_card_separation_menu_next_67cc4c: "Next time...:I have a Sillit Pong."
  npc_override_card_separation_card_separation_menu_next_bdbee2: "Next time...:{0}"
  npc_override_card_separation_card_separation_menu_next_f68c59: "Next time...:Continue"
  npc_override_card_separation_card_separation_menu_stop_73fe84: "Stop the work:{0}"
  npc_override_card_separation_card_separation_menu_stop_978f4e: "Stop the work:{0}:{1}"
  npc_override_card_separation_card_separation_msg_e58d6d: "-------------------"
  npc_override_card_separation_card_separation_no_fish_any_problem_prob_36e945: "No, the fish does not have any problem. The problem is lots of fish oil produced after processing. That is such an industrial waste."
  npc_override_card_separation_card_separation_part_there_nothing_9874dc: "In this part, there is nothing?"
  npc_override_card_separation_card_separation_please_choose_working_fe_1e777b: "Please choose the working fee."
  npc_override_card_separation_card_separation_pretty_old_equipment_the_6857ea: "This is pretty old equipment. There is a high rate of destroying the cards or equipment during the work. Are you sure you want to continue?"
  npc_override_card_separation_card_separation_problems_there_any_fault_2fa9ac: "Problems? Is there any faulty fish?"
  npc_override_card_separation_card_separation_result_card_separation_02a1eb: "-- Result of Card Separation --"
  npc_override_card_separation_card_separation_silly_jeremy_want_touch_0cc8fc: "Silly Jeremy does not want to touch weapons and shields because of picking several cards that might be damaged. That is why I prepared a card separaion skill for weapons and shields..."
  npc_override_card_separation_card_separation_socket_equipped_any_card_6d46b1: "This socket is not equipped with any card. Why don't you check again?"
  npc_override_card_separation_card_separation_t_continue_because_you_t_3c4e30: "Can't continue because you have too many heavy objects. Let's try to continue after reducing the weight."
  npc_override_card_separation_card_separation_there_nothing_part_b19986: "There is nothing on that part?"
  npc_override_card_separation_card_separation_there_possibility_destro_a56825: "There is a possibility of destroying them even using a special item. Also, ^ff0000the refine level might be lost^000000. Do you have any equipment to separate?"
  npc_override_card_separation_card_separation_well_don_t_worry_about_e4df5f: "Well, don't worry about money. Surely the Premium Lubricant is expensive. If you pay some zeny, I can give you cheaper lubricant."
  npc_override_card_separation_card_separation_whenever_you_need_work_p_998378: "Whenever you need to work, please come to me."
  npc_override_card_separation_card_separation_whenever_you_need_work_v_d6b13b: "Whenever you need the work, visit me here."
  npc_override_card_separation_card_separation_which_number_socket_you_d3bae7: "Which number socket do you want to separate the card? From the left socket, they are sorted 1,2,3,4."
  npc_override_card_separation_card_separation_you_don_t_enough_zeny_ec3808: "You don't have enough zeny. Please come back with enough fees."
  npc_override_card_separation_card_separation_you_don_t_ordinary_lubri_322df6: "You don't have Ordinary Lubricant."
  npc_override_card_separation_card_separation_you_don_t_premium_lubric_58b7ba: "You don't have Premium Lubricant."
  npc_override_card_separation_card_separation_you_don_t_sillit_pong_2b14c1: "You don't have Sillit Pong."
  npc_override_card_separation_card_separation_you_know_malangdo_s_spec_7713dc: "Do you know that Malangdo's specialty is canned food?"
  npc_override_card_separation_card_separation_you_too_many_kinds_objec_6d01b2: "You have too many kinds of objects. Let's try to continue after reducing those objects."
  npc_override_card_separation_card_separation_you_wonder_what_so_speci_ad7220: "You wonder what is so special. Well, I hate to give only a guide, so let me tell you the story..."
