Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_grademk_enchantgrade_adventurer_may_potential_18acaf: "The adventurer may have a potential that is unknown to him."
  npc_override_grademk_enchantgrade_anyway_if_you_use_etheri_f2edd5: "Anyway, if you use this etheric gem, you can enhance the weapon you are using."
  npc_override_grademk_enchantgrade_easy_move_magical_power_494b84: "It is not easy to move the magical power of jewels."
  npc_override_grademk_enchantgrade_enhance_equipment_s_grad_e7c4f5: "Enhance the equipment's grade."
  npc_override_grademk_enchantgrade_etel_dust_jewels_base_if_f08516: "Etel Dust, the jewels that will be the base, and if you give me a small fee I'll exchange it for Etel jewels."
  npc_override_grademk_enchantgrade_explosions_may_also_occu_024433: "Explosions may also occur in the process of dealing with magical powers."
  npc_override_grademk_enchantgrade_hello_dear_customer_who_22d9c8: "Hello, dear customer who walked in, let's hope for a miracle today."
  npc_override_grademk_enchantgrade_how_i_help_you_13e773: "How can I help you?"
  npc_override_grademk_enchantgrade_i_decided_call_such_gems_669823: "I decided to call such gems etheric gems."
  npc_override_grademk_enchantgrade_i_ll_still_8e4b01: "I'll still do it!"
  npc_override_grademk_enchantgrade_i_suribell_my_best_0d1ce3: "I, Suribell, will do my best!"
  npc_override_grademk_enchantgrade_i_wish_good_luck_our_4b18fd: "I wish good luck to our courageous customers!"
  npc_override_grademk_enchantgrade_if_you_combine_etel_dust_25770f: "If you combine Etel Dust and jewels to make it, it is fine! An Etel jewel for adventurers is complete!"
  npc_override_grademk_enchantgrade_let_s_hold_hands_faith_bb52ec: "Let's hold hands and have faith! Try clenching your teeth!"
  npc_override_grademk_enchantgrade_magical_power_etheric_ge_fac9b4: "The magical power of etheric gems sometimes awakens the hidden potential of equipment."
  npc_override_grademk_enchantgrade_magical_power_explode_sp_50af27: "Magical power can explode on the spot."
  npc_override_grademk_enchantgrade_may_good_luck_always_you_5ea702: "May good luck always be with you!"
  npc_override_grademk_enchantgrade_occasionally_unstable_je_ce03db: "Occasionally, unstable jewels with a lot of pure magical power are found."
  npc_override_grademk_enchantgrade_okay_let_s_drink_glass_1759e4: "Okay! Let's drink a glass of cold water!"
  npc_override_grademk_enchantgrade_our_customer_you_want_en_81cc87: "Our customer. You want to enhance the grade of equipment."
  npc_override_grademk_enchantgrade_performance_gets_better_6951e7: "Performance gets better. We call this grade enhancement."
  npc_override_grademk_enchantgrade_s_delicate_so_if_you_8610be: "It's delicate, so if you aren't careful, pop! It will explode."
  npc_override_grademk_enchantgrade_still_if_you_re_trying_52aea3: "Still, if you're trying to enhance your grade... !"
  npc_override_grademk_enchantgrade_then_weapon_inherit_magi_b73ea5: "Then the weapon that will inherit the magical power also explodes!"
  npc_override_grademk_enchantgrade_there_risk_destroyed_if_58b758: "There is a risk that it can be destroyed if done wrong, but try it with faith!"
  npc_override_grademk_enchantgrade_these_jewels_used_enhanc_f1c355: "These are jewels used to enhance grades."
  npc_override_grademk_enchantgrade_we_call_grade_enhancemen_b90ce3: "We call it grade enhancement because it goes up one tier!"
  npc_override_grademk_enchantgrade_we_call_these_etheric_ge_addf94: "We call these etheric gems, right?"
  npc_override_grademk_enchantgrade_we_people_who_assist_s_d34960: "We are the people who assist it. It's a bit risky, though. ahahaha."
  npc_override_grademk_enchantgrade_welcome_paramarket_s_gra_719aa0: "Welcome to Paramarket's Grade Enhancement Center~"
  npc_override_grademk_enchantgrade_whenever_you_courage_cha_493e87: "Whenever you have the courage to challenge, please come back."
  npc_override_grademk_enchantgrade_who_i_am_suribell_db03d1: "Who? I am Suribell!"
  npc_override_grademk_enchantgrade_you_like_combine_jewels_23f5f1: "Would you like to combine jewels and Etel Dust?"
  npc_override_grademk_enchantgrade_you_need_etheric_gems_en_f163d8: "You need etheric gems to enhance grades!"
  npc_override_grademk_enchantgrade_you_too_wouldn_t_you_41c697: "You too, wouldn't you be happy if the weapons you love grow one step further?"
  npc_override_grademk_enchantgrade_you_transfer_magical_pow_67f555: "You can transfer the magical power of the etheric gem to other weapons, but of course there is some risk."
  npc_override_grademk_enchantgrade_you_want_unlock_potentia_3be610: "Do you want to unlock the potential of your favorite equipment?"
