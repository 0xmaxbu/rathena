Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@os_b_SealedOs_adventurer_here_too_d1e92c: "The adventurer is here too!"
  npc_override_1@os_b_SealedOs_ah_sorry_13c71e: "Ah... Sorry.."
  npc_override_1@os_b_SealedOs_alright_17187c: "Alright."
  npc_override_1@os_b_SealedOs_argh_43ffb4: "Argh!"
  npc_override_1@os_b_SealedOs_better_just_go_around_do_d33130: "It would be better to just go around the door."
  npc_override_1@os_b_SealedOs_didn_t_you_just_did_0e62e3: "Didn't you just did now?"
  npc_override_1@os_b_SealedOs_excuse_me_471adf: "Excuse me."
  npc_override_1@os_b_SealedOs_finally_a39786: "Finally.."
  npc_override_1@os_b_SealedOs_go_back_my_room_look_2f801b: "^FF0000Go back to my room and look for a chest on the left side of the window, near a vase."
  npc_override_1@os_b_SealedOs_hello_0f4ebe: "Hello {0}."
  npc_override_1@os_b_SealedOs_how_did_you_sneak_here_f53d5c: "How did you sneak in here anyway?"
  npc_override_1@os_b_SealedOs_how_you_always_fight_lik_98f9d5: "How do you always fight like that?"
  npc_override_1@os_b_SealedOs_huh_efd3bc: "Huh!"
  npc_override_1@os_b_SealedOs_i_contact_few_people_any_4e08ff: "I have to contact a few people anyway, and Dien won't go anywhere until she gets her protection charm."
  npc_override_1@os_b_SealedOs_i_don_t_see_adventurer_efe97c: "I don't see the adventurer either~"
  npc_override_1@os_b_SealedOs_i_don_t_think_i_869783: "I don't think I heard that wrong. Did I?"
  npc_override_1@os_b_SealedOs_i_eager_explore_area_bey_4cdd37: "I eager to explore the area beyond here."
  npc_override_1@os_b_SealedOs_i_get_nervous_if_i_8c1f22: "I get nervous if I don't have it with me."
  npc_override_1@os_b_SealedOs_i_m_hurry_what_you_bc0f63: "I'm in a hurry, what are you doing here?"
  npc_override_1@os_b_SealedOs_i_m_so_excited_about_8c2c00: "I'm so excited about this~ I'm getting old and I'm tired of fighting."
  npc_override_1@os_b_SealedOs_i_m_tired_b38b05: "I'm tired!"
  npc_override_1@os_b_SealedOs_i_m_tired_fighting_let_acea8c: "I'm tired of fighting, let's go back to work."
  npc_override_1@os_b_SealedOs_i_think_i_ve_left_ab8e35: "I think I've left it."
  npc_override_1@os_b_SealedOs_i_want_go_home_6cdaff: "I want to go home."
  npc_override_1@os_b_SealedOs_if_you_close_your_eyes_0bdceb: "If you close your eyes for a second, you may run into an accident."
  npc_override_1@os_b_SealedOs_if_you_cross_door_cff175: "If you cross this door..."
  npc_override_1@os_b_SealedOs_if_you_don_t_break_82b68d: "If you don't break the machine on the other side, we will not be able pass it!"
  npc_override_1@os_b_SealedOs_if_you_go_right_i_e9d7c3: "If you go to the right, I think you can go back on the railroad without having to break the door."
  npc_override_1@os_b_SealedOs_if_you_keep_secret_you_bcb0d3: "If you keep it a secret that you saw us..."
  npc_override_1@os_b_SealedOs_left_what_1ff5fd: "Left what?"
  npc_override_1@os_b_SealedOs_let_s_head_back_now_0942bc: "Let's head back now before they gather more troops."
  npc_override_1@os_b_SealedOs_machine_stopped_strange_41a1ef: "- The machine stopped with a strange noise when the pipe was broken. -"
  npc_override_1@os_b_SealedOs_menu_crush_8e0670: "Crush it.:Put it down."
  npc_override_1@os_b_SealedOs_msg_5bab61: "?"
  npc_override_1@os_b_SealedOs_msg_6eae3a: "..."
  npc_override_1@os_b_SealedOs_my_protection_charm_81e182: "My protection charm!"
  npc_override_1@os_b_SealedOs_nothing_happened_d3225d: "- Nothing happened. -"
  npc_override_1@os_b_SealedOs_oh_0fd77a: "Oh?"
  npc_override_1@os_b_SealedOs_oh_5235ff: "Oh!"
  npc_override_1@os_b_SealedOs_oh_78a2fc: "Oh..."
  npc_override_1@os_b_SealedOs_oh_9f7455: "Oh~"
  npc_override_1@os_b_SealedOs_oh_gate_too_hard_19f4b9: "Oh, is this gate too hard?"
  npc_override_1@os_b_SealedOs_oh_my_i_think_s_df0c0c: "Oh my! I think it's precise device that's placed here in the abandoned mine."
  npc_override_1@os_b_SealedOs_oh_my_oh_my_bd4b12: "Oh my, oh my!"
  npc_override_1@os_b_SealedOs_oh_my_what_s_thing_ef4ca5: "Oh my! What's that thing in the front?"
  npc_override_1@os_b_SealedOs_only_surveillance_routin_61e0ca: "This is only a surveillance routine."
  npc_override_1@os_b_SealedOs_please_go_back_enjoy_you_be8900: "Please go back and enjoy your tea gracefully."
  npc_override_1@os_b_SealedOs_please_me_favor_604ac7: "Please do me a favor."
  npc_override_1@os_b_SealedOs_please_stop_fighting_83fbd4: "Please stop fighting."
  npc_override_1@os_b_SealedOs_road_open_now_d852da: "The road is open now."
  npc_override_1@os_b_SealedOs_s_dangerous_go_through_r_8eebc3: "It's dangerous to go through right now, so let's turn around and go where the device is!"
  npc_override_1@os_b_SealedOs_s_dangerous_so_please_co_764ab4: "It's dangerous, so please come with us."
  npc_override_1@os_b_SealedOs_s_good_sometimes_take_qu_45ea5f: "It's good sometimes to take a quick walk like this~"
  npc_override_1@os_b_SealedOs_s_hard_me_get_back_1f0cd4: "It's hard for me to get it back because it's far..."
  npc_override_1@os_b_SealedOs_should_easy_get_since_we_18f8f1: "It should be easy to get since we're here."
  npc_override_1@os_b_SealedOs_shouldn_t_we_tell_them_2eb04a: "Shouldn't we tell them where we are?"
  npc_override_1@os_b_SealedOs_sister_2af148: "Sister~~"
  npc_override_1@os_b_SealedOs_sister_tell_me_where_dc7e6f: "Sister, tell me where it is."
  npc_override_1@os_b_SealedOs_so_10b991: "Is that so?"
  npc_override_1@os_b_SealedOs_so_what_now_f1a367: "So what now?"
  npc_override_1@os_b_SealedOs_t_helped_9e9cd2: "It can't be helped~~"
  npc_override_1@os_b_SealedOs_take_some_time_break_6f671a: "It will take some time to break it~"
  npc_override_1@os_b_SealedOs_thank_you_so_much_24f75a: "Thank you so much for that"
  npc_override_1@os_b_SealedOs_there_pipe_going_through_22ef49: "- There is a pipe going through the floor. -"
  npc_override_1@os_b_SealedOs_we_go_adventurer_c26430: "We have to go with the adventurer."
  npc_override_1@os_b_SealedOs_we_re_already_inside_794a67: "We're already inside."
  npc_override_1@os_b_SealedOs_we_re_trouble_f15c1f: "We're in trouble~~"
  npc_override_1@os_b_SealedOs_we_t_anyone_know_we_7d838f: "We can't have anyone know we're here~~"
  npc_override_1@os_b_SealedOs_we_ve_came_here_somethin_907a0f: "We've came here to do something... It was too troublesome to tell the youngsters."
  npc_override_1@os_b_SealedOs_what_makes_you_think_we_5fa2a8: "What makes you think we need your help?"
  npc_override_1@os_b_SealedOs_what_should_we_88dcb0: "What should we do!"
  npc_override_1@os_b_SealedOs_what_you_doing_here_74351b: "What are you doing here?"
  npc_override_1@os_b_SealedOs_what_you_talking_about_i_6e9f37: "What are you talking about, I don't see the adventurer!"
  npc_override_1@os_b_SealedOs_while_we_open_last_door_213521: "While we open the last door, would you mind going back to ^FF0000Clana Nemieri^000000?"
  npc_override_1@os_b_SealedOs_why_d77989: "Why?"
  npc_override_1@os_b_SealedOs_why_what_s_going_0458e0: "Why, what's going on?"
  npc_override_1@os_b_SealedOs_why_you_scared_21da46: "Why are you scared!"
  npc_override_1@os_b_SealedOs_yeah_2fce79: "Yeah?"
  npc_override_1@os_b_SealedOs_yeah_3e2b3d: "Yeah~"
  npc_override_1@os_b_SealedOs_you_two_really_ee98a7: "You two really~"
  npc_override_1@os_b_SealedOs_you_ve_been_fine_so_073882: "You've been fine so far without it?!"
