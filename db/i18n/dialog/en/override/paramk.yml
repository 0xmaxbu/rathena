  npc_override_paramk_eden_market_limited_collection_only_907b07: "A limited collection, only available on fiery Friday, Saturday and Sunday!"
  npc_override_paramk_eden_market_limited_item_collection_f9f6b1: "Limited item collection, only available on weekends!"
  npc_override_paramk_eden_market_look_other_items_our_sto_8f1bda: "Look at other items in our store."
