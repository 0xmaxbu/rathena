  npc_override_paramk_eden_market_i_am_person_go_if_74a7ad: "I am the person to go to if you want cooking ingredients."
  npc_override_paramk_eden_market_i_am_thrann_s_colleague_4b69b1: "I am Thrann's colleague and I like being a cleaner at this store. I can be as lazy as I want and still get paid."
  npc_override_paramk_eden_market_i_am_waiting_weapon_sold_264143: "I am waiting for the weapon that will be sold on the weekends. I heard that if I come by on the right day, both the red version and the blue version would be offered."
  npc_override_paramk_eden_market_i_been_waiting_hours_alr_086409: "I have been waiting for hours already and the cook is still not taking orders. Ah, I am so hungry that I might drop dead."
  npc_override_paramk_eden_market_i_came_two_days_ago_156b7b: "I came two days ago, yesterday, and today too. The pasta they serve here is amazing. The only problem is that it's so hard to order here."
  npc_override_paramk_eden_market_i_cannot_tell_you_what_d1d168: "I cannot tell you what items individual shops sell, because they are all different."
  npc_override_paramk_eden_market_i_come_here_when_i_191530: "I come here when I need a break. I love this place. Comfortable, and lots of interesting items around."
  npc_override_paramk_eden_market_i_deal_plants_shockingly_f94345: "I deal with plants that are shockingly bitter when you chew on them."
  npc_override_paramk_eden_market_i_don_t_enough_keys_887eef: "I don't have enough keys yet."
  npc_override_paramk_eden_market_i_don_t_mean_common_1039f0: "And I don't mean common stuff like Jellopy, which you can acquire anywhere. Here, we only deal in real goods."
  npc_override_paramk_eden_market_i_don_t_skill_so_6a9329: "I don't have the Skill, so I don't know how to handle Falcons."
  npc_override_paramk_eden_market_i_even_seen_beb494: "I have even seen an "
  npc_override_paramk_eden_market_i_feel_like_throwing_up_2d6a86: "I feel like throwing up. Surrounded by the smell of herbs all week."
  npc_override_paramk_eden_market_i_gather_sell_keys_clock_9d39b6: "I gather and sell the keys for the clock tower all by myself..."
  npc_override_paramk_eden_market_i_heard_owner_restaurant_2a7fab: "I heard that the owner of this restaurant went on a trip to a faraway land, and the new cook is running this place. I heard that his cooking skill is amazing."
  npc_override_paramk_eden_market_i_m_here_provide_rune_a97264: "I'm here to provide Rune Knights and Royal Guards with riding creatures."
  npc_override_paramk_eden_market_i_m_sorry_you_don_f40333: "I'm sorry but you don't have enough money to buy a Falcon Flute, please come back when you have more money!"
  npc_override_paramk_eden_market_i_made_few_dishes_just_c984a0: "I made a few dishes just to shut up the complaining customers, but this is getting out of hand!"
  npc_override_paramk_eden_market_i_make_money_since_i_83cdd9: "I have to make money since I also need to eat!"
  npc_override_paramk_eden_market_i_make_them_each_day_ef2d82: "I make 100 of them each day... yes... just me."
  npc_override_paramk_eden_market_i_may_any_stock_left_9051fa: "I may not have any stock left since I sell only a handful of items."
  npc_override_paramk_eden_market_i_may_some_extra_keys_67f043: "I may have some extra keys for the clock tower?.."
  npc_override_paramk_eden_market_i_only_get_one_per_664107: "I can only get one per day, but I will sell it."
  npc_override_paramk_eden_market_i_see_then_great_day_279268: "I see. Then have a great day."
  npc_override_paramk_eden_market_i_selected_these_babies_de3dea: "I selected these babies from the farm myself. Very potent when made into meds."
  npc_override_paramk_eden_market_i_sell_coins_i_collected_2986c5: "I sell coins that I have collected from alternate dimensions."
  npc_override_paramk_eden_market_i_show_you_62fb05: "I will show you "
  npc_override_paramk_eden_market_i_show_you_collection_ou_172d31: "I will show you a collection of our superior potions if you come back tomorrow, okay?"
  npc_override_paramk_eden_market_i_spend_hours_here_drink_8c16a6: "I spend hours here drinking coffee in peace, though I am technically at work, pretending to clean. They don't even kick me out."
  npc_override_paramk_eden_market_i_started_working_pay_of_07b03f: "I started working to pay off my college tuition..."
  npc_override_paramk_eden_market_i_t_give_you_one_ef331e: "But I can't give you one for free!"
  npc_override_paramk_eden_market_i_take_break_too_994eb8: "I will take a break, too."
  npc_override_paramk_eden_market_i_take_them_off_your_4ce233: "I will take them off your hands and pay you a hefty price."
  npc_override_paramk_eden_market_i_take_you_somewhere_nic_f2fab5: "I can take you to somewhere nice. Are you interested?"
  npc_override_paramk_eden_market_i_wish_i_could_something_cd5577: "I wish I could do something about the employees."
