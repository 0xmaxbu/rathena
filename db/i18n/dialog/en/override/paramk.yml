  npc_override_paramk_eden_market_late_saturday_afternoon_5f2f2e: "Late Saturday afternoon would be perfect."
  npc_override_paramk_eden_market_let_me_make_clear_i_2ba714: "Let me make this clear! I am not the cook! Don't wait around to be served! I am NOT making any more dishes!"
  npc_override_paramk_eden_market_let_us_show_you_strong_972422: "Let us show you the 'Strong Friends' special collection."
