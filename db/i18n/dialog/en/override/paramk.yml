  npc_override_paramk_eden_market_if_everything_sold_out_328999: "If not, everything is sold out!"
  npc_override_paramk_eden_market_if_s_product_i_deal_0ceabf: "If it's a product I deal in, I will purchase them from you at a reasonable price."
  npc_override_paramk_eden_market_if_there_nothing_means_e_2364ad: "^4d4dffIf there is nothing, it means everything is sold out^000000, please be aware."
  npc_override_paramk_eden_market_if_there_nothing_means_w_3b0608: "If there is nothing, that means we are sold out. Come back tomorrow."
  npc_override_paramk_eden_market_if_there_s_nothing_means_0fc5c2: "If there's nothing, it means that we are sold out."
  npc_override_paramk_eden_market_if_you_come_tomorrow_we_ad1b67: "If you come by tomorrow, we would be happy to offer you our range of products that will make your weapons more powerful!"
  npc_override_paramk_eden_market_if_you_don_t_see_7d349a: "If you don't see anything, that means everything is sold out."
  npc_override_paramk_eden_market_if_you_don_t_see_93e114: "If you don't see anything, that means everything is sold out!"
  npc_override_paramk_eden_market_if_you_need_cooking_ingr_f08b57: "If you need cooking ingredients, you have come to the right place."
  npc_override_paramk_eden_market_if_you_need_falcon_flute_971093: "If you need a Falcon Flute I will sell them for 12,500 zeny. Or is that too expensive?"
  npc_override_paramk_eden_market_if_you_need_iron_steel_82ae94: "If you need iron, steel, coal, or iron ores, look around."
  npc_override_paramk_eden_market_if_you_need_rare_ores_2bf8b4: "If you need rare ores or anvils, come on weekends."
  npc_override_paramk_eden_market_if_you_open_chest_there_a75ea8: "If you open the chest and there's nothing there, "
  npc_override_paramk_eden_market_if_you_see_anything_mean_e66129: "If you do not see anything, it means we are sold out. Come back on next weekend~"
  npc_override_paramk_eden_market_if_you_see_nothing_means_1db80b: "If you see nothing, that means everything is sold out."
  npc_override_paramk_eden_market_if_you_see_nothing_means_e1c1a2: "If you see nothing, that means all the potions are sold out."
  npc_override_paramk_eden_market_immortal_hearts_stems_ma_05627a: "Immortal Hearts, Stems, and many other ingredients from various dungeons"
  npc_override_paramk_eden_market_ingredients_gems_magic_4ed5ee: "Ingredients and gems for magic, "
  npc_override_paramk_eden_market_ingredients_make_medicat_fbc3ef: "ingredients to make medication"
  npc_override_paramk_eden_market_ingredients_make_reagent_b9d67d: "Ingredients to make reagents, potions, "
  npc_override_paramk_eden_market_instead_monsters_e7d9a5: "instead of monsters~"
  npc_override_paramk_eden_market_isn_t_worth_paying_visit_f0d26c: "Isn't it worth paying a visit?"
  npc_override_paramk_eden_market_just_reminder_8c9913: "Just a reminder."
  npc_override_paramk_eden_market_just_saying_674674: "Just saying."
  npc_override_paramk_eden_market_just_your_information_0ecf6f: "Just for your information."
  npc_override_paramk_eden_market_keep_mind_0b30f4: "Keep that in mind."
  npc_override_paramk_eden_market_keep_mind_limited_quanti_eafb99: "Keep in mind that limited quantity items will never go on sale!"
  npc_override_paramk_eden_market_keep_mind_most_special_p_f47ebf: "Keep in mind that most special products are of ^4d4dfflimited quantity^000000. If you are late, they might be sold out."
