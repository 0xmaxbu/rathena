  npc_override_paramk_eden_market_how_about_interested_fd35af: "How about it? Interested?"
  npc_override_paramk_eden_market_how_you_eden_market_grou_57e880: "How are you? This is the Eden Market Group."
  npc_override_paramk_eden_market_however_depending_owner_a6bd3b: "However, depending on the owner's wishes, and the type of items being offered, some shops remain partially open even on the holiday."
  npc_override_paramk_eden_market_huh_i_wonder_how_long_5ea887: "Huh. I wonder how long they would make me wait..."
  npc_override_paramk_eden_market_hunting_money_96e082: "hunting money"
  npc_override_paramk_eden_market_i_am_called_sobok_sobokr_0d9b90: "I am called Sobok, of the Sobokru, Eden Market Group's leading restaurant."
  npc_override_paramk_eden_market_i_am_going_talk_owner_bd77fc: "I am going to talk to the owner once he comes back from his trip. Tell him to fire his employees there at the back."
