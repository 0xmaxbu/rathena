Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@mir_RoomOfConsciousness_aaarrghhh_0e3ba9: "Aaarrghhh---!!!"
  npc_override_1@mir_RoomOfConsciousness_ah_971301: "Ah..."
  npc_override_1@mir_RoomOfConsciousness_all_you_want_say_41b79f: "Is that all you want to say?"
  npc_override_1@mir_RoomOfConsciousness_beast_s_blood_flowing_th_eb199c: "That beast's blood flowing through your body...That was the answer!"
  npc_override_1@mir_RoomOfConsciousness_because_b942f7: "Because..."
  npc_override_1@mir_RoomOfConsciousness_careful_she_s_about_atta_2c9319: "...Be careful. She's about to attack!"
  npc_override_1@mir_RoomOfConsciousness_chuckles_5ff77d: "~Chuckles~"
  npc_override_1@mir_RoomOfConsciousness_chuckles_i_think_you_re_49fa38: "~Chuckles~ I think you're not that bad for a human."
  npc_override_1@mir_RoomOfConsciousness_clerics_deserve_die_c27096: "Clerics deserve to die!"
  npc_override_1@mir_RoomOfConsciousness_coughs_b94802: "~Coughs~"
  npc_override_1@mir_RoomOfConsciousness_did_she_save_me_cee65c: "(Did she save me...?)"
  npc_override_1@mir_RoomOfConsciousness_die_03c27d: "Die!!"
  npc_override_1@mir_RoomOfConsciousness_don_t_drama_queen_as_18935a: "Don't be a drama queen as if you're the only victim here."
  npc_override_1@mir_RoomOfConsciousness_don_t_expect_me_kill_169eb5: "...But don't expect me to kill you that easily..."
  npc_override_1@mir_RoomOfConsciousness_don_t_worry_i_ll_fb1659: "Don't worry. I'll let Himelmez know of your brave contribution. Don't blame me, Bijou."
  npc_override_1@mir_RoomOfConsciousness_don_t_you_ever_let_cec6c5: "Don't you ever let anyone kill you until then, Iris."
  npc_override_1@mir_RoomOfConsciousness_don_t_you_ever_think_739005: "Don't you ever think this will ever change my belief! I will never, ever forgive you!"
  npc_override_1@mir_RoomOfConsciousness_drink_you_ll_come_your_e1b721: "Drink it and you'll come to your senses."
  npc_override_1@mir_RoomOfConsciousness_evil_laughter_die_871db1: "~Evil laughter~ Die!"
  npc_override_1@mir_RoomOfConsciousness_exhales_i_see_s_right_ca29d9: "~Exhales~ I see. That's right."
  npc_override_1@mir_RoomOfConsciousness_fenrir_i_thought_too_muc_a29e7c: "(...Fenrir? I thought too much about Ymir's Heart and totally forgot about her. If my guess is right, she must be...!)"
  npc_override_1@mir_RoomOfConsciousness_final_fatal_blow_you_wah_9dd9df: "This will be the final, fatal blow to you. Wahahaha!"
  npc_override_1@mir_RoomOfConsciousness_frost_diver_70ced5: "Frost Diver!"
  npc_override_1@mir_RoomOfConsciousness_gasps_314034: "....~Gasps~"
  npc_override_1@mir_RoomOfConsciousness_gone_now_6b4b71: "Was that it...? Has it gone now?"
  npc_override_1@mir_RoomOfConsciousness_good_idea_i_think_s_5cc687: "Good idea, but...I think it's too late."
  npc_override_1@mir_RoomOfConsciousness_grins_delighted_see_you_98b396: "~Grins~ Delighted to see you all."
  npc_override_1@mir_RoomOfConsciousness_grins_i_look_like_i_5961ff: "~Grins~ Do I look like I have the time to deal with a petty thing like you, human?"
  npc_override_1@mir_RoomOfConsciousness_groans_03afd7: "~Groans~"
  npc_override_1@mir_RoomOfConsciousness_groans_i_t_believe_nothi_2112a3: "~Groans~ I can't believe nothing seems to work!"
  npc_override_1@mir_RoomOfConsciousness_grunts_5f5d11: "~Grunts~"
  npc_override_1@mir_RoomOfConsciousness_grunts_they_must_ve_star_c18633: "~Grunts~ They must've started attacking this place, too."
  npc_override_1@mir_RoomOfConsciousness_grunts_valkyrie_destroye_99e17b: "~Grunts~ That Valkyrie destroyed the ceiling when taking Ymir's Heart!"
  npc_override_1@mir_RoomOfConsciousness_grunts_when_did_all_legi_26ce46: "~Grunts~ When did all the legionnaires get here?"
  npc_override_1@mir_RoomOfConsciousness_horribly_painfully_e8b073: "And horribly painfully...!!"
  npc_override_1@mir_RoomOfConsciousness_how_could_happen_ef1031: "How could this happen?"
  npc_override_1@mir_RoomOfConsciousness_how_feel_painful_eh_04483e: "How does it feel? Painful, eh?"
  npc_override_1@mir_RoomOfConsciousness_huh_my_stomach_4e163a: "Huh?...In my stomach..."
  npc_override_1@mir_RoomOfConsciousness_i_certainly_without_subo_ad8ea5: "I can certainly do without a subordinate who wastes time for this kind of petty job."
  npc_override_1@mir_RoomOfConsciousness_i_d_better_bid_farewell_fad9d7: "I'd better bid farewell for today, then."
  npc_override_1@mir_RoomOfConsciousness_i_didn_t_expect_anyone_702182: "I didn't expect anyone to defeat Amdarais that I spent three good years to complete."
  npc_override_1@mir_RoomOfConsciousness_i_didn_t_expect_huge_fdbf0d: "I didn't expect it to be this huge..."
  npc_override_1@mir_RoomOfConsciousness_i_didn_t_expect_see_06773b: "I didn't expect to see the hero from a thousand years ago!"
  npc_override_1@mir_RoomOfConsciousness_i_didn_t_expect_you_b0c99d: "I didn't expect you would show up here."
  npc_override_1@mir_RoomOfConsciousness_i_didn_t_let_you_5d9d08: "I didn't let you live."
  npc_override_1@mir_RoomOfConsciousness_i_don_t_know_let_c33601: "I don't know. Let's investigate the inside, first."
  npc_override_1@mir_RoomOfConsciousness_i_don_t_think_you_cbd49e: "I don't think you'd use it for any good cause."
  npc_override_1@mir_RoomOfConsciousness_i_iris_dbee11: "I...Iris!!"
  npc_override_1@mir_RoomOfConsciousness_i_let_you_die_soon_c3a57e: "I will let you die soon."
  npc_override_1@mir_RoomOfConsciousness_i_ll_let_you_me_e5d400: "I'll let you in on me before I go."
  npc_override_1@mir_RoomOfConsciousness_i_ll_let_you_taste_86690f: "I'll let you taste what despair feels like."
  npc_override_1@mir_RoomOfConsciousness_i_ll_stop_bijou_taking_e6b8cf: "I'll stop Bijou from taking Ymir's Heart. You go ahead and take care of that huge monster!"
  npc_override_1@mir_RoomOfConsciousness_i_m_adjutant_lord_valkyr_48a7f3: "I'm the adjutant to Lord Valkyrie Himelmez."
  npc_override_1@mir_RoomOfConsciousness_i_m_bijou_a87d15: "I'm Bijou."
  npc_override_1@mir_RoomOfConsciousness_i_m_game_bring_3de753: "I'm game. Bring it on!"
  npc_override_1@mir_RoomOfConsciousness_i_m_out_breath_470c8e: "I'm out of breath!"
  npc_override_1@mir_RoomOfConsciousness_i_m_so_relieved_ced50d: "I'm so relieved."
  npc_override_1@mir_RoomOfConsciousness_i_make_sure_you_no_fea808: "I make sure you no longer see the light of day the next time when we meet."
  npc_override_1@mir_RoomOfConsciousness_i_must_say_rather_unexpe_39e258: "I must say it was rather unexpected. ~Chuckles~"
  npc_override_1@mir_RoomOfConsciousness_i_should_take_care_downr_c9f608: "I should take care of this downright annoying cleric gal first."
  npc_override_1@mir_RoomOfConsciousness_iris_dd2b57: "Iris!!"
  npc_override_1@mir_RoomOfConsciousness_iris_healing_potion_b930d2: "Iris! This is a healing potion."
  npc_override_1@mir_RoomOfConsciousness_keeps_coughing_9e92a7: "~Keeps coughing~"
  npc_override_1@mir_RoomOfConsciousness_knife_cbdd92: "This knife..."
  npc_override_1@mir_RoomOfConsciousness_let_me_take_ymir_s_3ce5c2: "Let me take that Ymir's Heart...myself."
  npc_override_1@mir_RoomOfConsciousness_little_chick_because_she_670a70: "...That...that little chick...Was that it? Because she's your sister? Was that it? Tell me, Sarah!"
  npc_override_1@mir_RoomOfConsciousness_magic_1b4dae: "This magic..."
  npc_override_1@mir_RoomOfConsciousness_mark_my_word_835d2c: "Mark my word."
  npc_override_1@mir_RoomOfConsciousness_me_i_m_only_one_d6910d: "Me...I'm the only one left..."
  npc_override_1@mir_RoomOfConsciousness_menu_my_77ff31: "My question was: what are you still doing here, totally goofing off, and, why didn't you break any sealing off of Ymir's Heart?"
  npc_override_1@mir_RoomOfConsciousness_mom_dad_every_people_our_974e6b: "Mom...Dad...Every people in our town. I'm going to revenge!"
  npc_override_1@mir_RoomOfConsciousness_moment_we_immortal_legio_c83bb7: "From this moment on, we the Immortal Legion by Lord Valkyrie Himelmez"
  npc_override_1@mir_RoomOfConsciousness_msg_93fcbf: "......"
  npc_override_1@mir_RoomOfConsciousness_msg_b4613f: "!!"
  npc_override_1@mir_RoomOfConsciousness_muffled_sound_259d11: "~Muffled sound~"
  npc_override_1@mir_RoomOfConsciousness_must_19eb2d: "This...this must be..."
  npc_override_1@mir_RoomOfConsciousness_must_1e9917: "And that must be..."
  npc_override_1@mir_RoomOfConsciousness_must_high_level_magic_as_866deb: "This must be high-level magic as I expected. It's pretty tough to cast it."
  npc_override_1@mir_RoomOfConsciousness_no_stop_db173d: "No! Stop!!"
  npc_override_1@mir_RoomOfConsciousness_no_valkyrie_s_subordinat_cca4f2: "No Valkyrie's subordinates ever disappointed me and neither did you."
  npc_override_1@mir_RoomOfConsciousness_oh_you_woke_up_now_11801f: "Oh, you woke up now?"
  npc_override_1@mir_RoomOfConsciousness_out_pure_mercy_i_ll_45c006: "But, out of pure mercy, I'll let you taste the fearful power of the Immortal Legion just a little bit."
  npc_override_1@mir_RoomOfConsciousness_people_say_we_parted_whe_5f9ef5: "People say we parted when we were little..."
  npc_override_1@mir_RoomOfConsciousness_place_cleaned_up_no_time_fe1ff9: "This place will be cleaned up in no time. There is nothing for you to worry about, Sarah."
  npc_override_1@mir_RoomOfConsciousness_place_where_first_ymir_s_9693a6: "The place where the first Ymir's Heart is sealed."
  npc_override_1@mir_RoomOfConsciousness_pow_b65953: "~POW!~"
  npc_override_1@mir_RoomOfConsciousness_prontera_castle_8df8ed: "of the Prontera Castle..."
  npc_override_1@mir_RoomOfConsciousness_ruining_my_three_year_ef_afbd04: "for ruining my three-year efforts!!"
  npc_override_1@mir_RoomOfConsciousness_rumbling_cf34f2: "~Rumbling~"
  npc_override_1@mir_RoomOfConsciousness_s_sarah_right_1943f4: "It's Sarah, right?"
  npc_override_1@mir_RoomOfConsciousness_sa_sarah_how_f06b98: "Sa...Sarah...? How?"
  npc_override_1@mir_RoomOfConsciousness_sarah_21ed06: "Sarah...?"
  npc_override_1@mir_RoomOfConsciousness_sarah_3691c3: "Sarah..."
  npc_override_1@mir_RoomOfConsciousness_sarah_irine_afeb46: "Sarah Irine."
  npc_override_1@mir_RoomOfConsciousness_scoffs_what_uptight_path_d1f713: "(~Scoffs~ What an uptight, pathetic Valkyrie she is! I can't believe a greenhorn like you are treated the same as Himelmez. That is so unfair.)"
  npc_override_1@mir_RoomOfConsciousness_sealed_underground_db1b17: "Sealed in the underground"
  npc_override_1@mir_RoomOfConsciousness_she_valkyrie_indeed_oh_w_e5b32f: "(She is Valkyrie, indeed. Oh, what can you do about that?)"
  npc_override_1@mir_RoomOfConsciousness_shut_mouth_9d797c: "Shut that mouth!"
  npc_override_1@mir_RoomOfConsciousness_sighs_74e538: "....~Sighs~"
  npc_override_1@mir_RoomOfConsciousness_sighs_way_fenrir_924968: "~Sighs~ By the way, Fenrir!"
  npc_override_1@mir_RoomOfConsciousness_slowly_a14f95: "Slowly..."
  npc_override_1@mir_RoomOfConsciousness_so_e60826: "So this is it..."
  npc_override_1@mir_RoomOfConsciousness_so_what_s_left_now_90f54b: "So what's left now is..."
  npc_override_1@mir_RoomOfConsciousness_so_what_s_your_plan_bf9174: "...So what's your plan, huh? Why...why did you save me?!"
  npc_override_1@mir_RoomOfConsciousness_so_you_re_looking_partne_6a0660: "So you're looking for a partner, eh?"
  npc_override_1@mir_RoomOfConsciousness_so_you_woke_up_iris_4de091: "So you woke up, Iris."
  npc_override_1@mir_RoomOfConsciousness_stop_9cb289: "Stop it..."
  npc_override_1@mir_RoomOfConsciousness_take_over_here_9409d6: "will take over here."
  npc_override_1@mir_RoomOfConsciousness_then_let_me_serve_you_56a745: "Then, let me serve you the right way! ~Chuckles~"
  npc_override_1@mir_RoomOfConsciousness_they_just_paid_price_wha_f2a269: "They just paid the price for what they sinned. The sin that they committed by killing my mother 12 years ago."
  npc_override_1@mir_RoomOfConsciousness_this_7b6848: "This..."
  npc_override_1@mir_RoomOfConsciousness_time_right_d1c17a: "The time is right!"
  npc_override_1@mir_RoomOfConsciousness_trust_me_consider_done_p_02c0b2: "Trust me and consider it done. Please be yourself as proud Valkyrie."
  npc_override_1@mir_RoomOfConsciousness_umm_08b31a: "Umm...."
  npc_override_1@mir_RoomOfConsciousness_underground_prontera_cas_7383f9: "This is the underground of Prontera Castle."
  npc_override_1@mir_RoomOfConsciousness_vomiting_sound_33b4e8: "~Vomiting sound~"
  npc_override_1@mir_RoomOfConsciousness_we_d_better_get_out_6c2f83: "We'd better get out of here, too! This place is too dangerous!"
  npc_override_1@mir_RoomOfConsciousness_well_s_uh_i_did_0fc25a: "Well, that's uh...I did break the 1st seal, though."
  npc_override_1@mir_RoomOfConsciousness_what_96ba6e: "What?!"
  npc_override_1@mir_RoomOfConsciousness_what_about_ymir_s_heart_068206: "What about Ymir's Heart?"
  npc_override_1@mir_RoomOfConsciousness_what_brought_you_all_way_afb6ef: "What brought you all the way up here?"
  npc_override_1@mir_RoomOfConsciousness_what_did_she_just_master_88198f: "(What is this?! Did she just master the magic that I used on her?)"
  npc_override_1@mir_RoomOfConsciousness_what_did_you_give_me_6decc2: "What did you give to me?"
  npc_override_1@mir_RoomOfConsciousness_what_did_you_say_00cb81: "What did you say?!"
  npc_override_1@mir_RoomOfConsciousness_what_earth_there_inside_116347: "What on earth is there inside?"
  npc_override_1@mir_RoomOfConsciousness_what_heck_6bb4b9: "What the heck is this?!"
  npc_override_1@mir_RoomOfConsciousness_what_how_dare_you_94074e: "What? How dare you!"
  npc_override_1@mir_RoomOfConsciousness_what_kind_answer_bijou_7799f5: "What kind of answer is that, Bijou?"
  npc_override_1@mir_RoomOfConsciousness_what_what_s_up_monster_9ef27f: "What...what's up with this monster?!"
  npc_override_1@mir_RoomOfConsciousness_what_you_think_you_re_d9b7c3: "What do you think you're doing here, Bijou?"
  npc_override_1@mir_RoomOfConsciousness_whoa_close_call_aa7d58: "Whoa...That was a close; call."
  npc_override_1@mir_RoomOfConsciousness_why_place_shaking_78d42a: "Why is this place shaking?!"
  npc_override_1@mir_RoomOfConsciousness_why_tell_me_why_137f51: "Why...? Tell me why!"
  npc_override_1@mir_RoomOfConsciousness_yes_i_middle_taking_care_ce9e4b: "Yes, I was in the middle of taking care of the annoying bugs."
  npc_override_1@mir_RoomOfConsciousness_ymir_s_heart_750ef9: "Ymir's Heart..."
  npc_override_1@mir_RoomOfConsciousness_ymir_s_heart_7ec9ef: "This is Ymir's Heart..."
  npc_override_1@mir_RoomOfConsciousness_ymir_s_heart_a6716c: "Ymir's Heart!"
  npc_override_1@mir_RoomOfConsciousness_ymir_s_heart_comes_first_5c60c2: "Ymir's Heart comes first, no matter what."
  npc_override_1@mir_RoomOfConsciousness_ymir_s_heart_huge_energy_801b11: "Ymir's Heart is a huge energy source. For what do you want to use it anyway?"
  npc_override_1@mir_RoomOfConsciousness_you_d_better_keep_your_d2dd19: "You'd better keep your mouth shut!"
  npc_override_1@mir_RoomOfConsciousness_you_don_t_need_know_9bca1f: "You don't need to know. You're going to be wiped out soon anyway."
  npc_override_1@mir_RoomOfConsciousness_you_must_become_paralyze_9386bf: "You must become paralyzed by now."
  npc_override_1@mir_RoomOfConsciousness_you_must_out_your_mind_d0ee11: "You must be out of your mind, Bijou...There is no Himelmez here."
  npc_override_1@mir_RoomOfConsciousness_you_pay_acb1b5: "You will pay"
  npc_override_1@mir_RoomOfConsciousness_you_think_you_get_away_6708a7: "But do you think you can get away from this, again? Wake up, my underlings!"
  npc_override_1@mir_RoomOfConsciousness_you_ve_got_kidding_me_893fdc: "You've got to be kidding me!"
  npc_override_1@mir_RoomOfConsciousness_you_want_me_tell_you_4fcfe1: "Do you want me to tell you the truth? Those 'loved ones' you're incessantly talking about...Our great elder and the people in our town were actually..."
  npc_override_1@mir_RoomOfConsciousness_your_soul_been_set_free_a1a3dc: "Your soul has been set free, Bijou."
  npc_override_1@mir_RoomOfConsciousness_yuck_bitter_f6fe08: "Yuck! Is this bitter!"
