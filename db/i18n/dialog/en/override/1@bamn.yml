Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@bamn_TwilightGarden_activate_tracker_we_got_05a6b4: "Activate the tracker that we got from Elyumina."
  npc_override_1@bamn_TwilightGarden_adventurer_noisy_thing_f_e48460: "Adventurer. Is that noisy thing flickering again? Let us check it for a second."
  npc_override_1@bamn_TwilightGarden_adventurer_there_s_intru_07f94e: "Adventurer, there's an intruder!"
  npc_override_1@bamn_TwilightGarden_adventurer_you_like_almo_34fb33: "Adventurer. Do you like Almonds? A customer who liked almonds named me. Does it suit me?"
  npc_override_1@bamn_TwilightGarden_after_all_they_re_just_b1958d: "After all, they're just automatic dolls, right?"
  npc_override_1@bamn_TwilightGarden_ah_i_ll_also_escort_f469c3: "Ah. I'll also escort Almond."
  npc_override_1@bamn_TwilightGarden_ahahaha_s_noisy_0d2dba: "Ahahaha, it's noisy."
  npc_override_1@bamn_TwilightGarden_also_almond_said_she_had_175abd: "Also, Almond said she had to go out and check something."
  npc_override_1@bamn_TwilightGarden_body_manager_beta_hidden_ea5b03: "The body of Manager Beta is hidden under the landscapes."
  npc_override_1@bamn_TwilightGarden_careful_9a2d79: "Be careful!"
  npc_override_1@bamn_TwilightGarden_checking_signal_d1a7b1: "...checking the signal."
  npc_override_1@bamn_TwilightGarden_come_me_anytime_a0cc7d: "Come at me anytime."
  npc_override_1@bamn_TwilightGarden_core_part_empty_8d6a56: "The core part is empty."
  npc_override_1@bamn_TwilightGarden_core_slot_empty_481447: "The core slot is empty."
  npc_override_1@bamn_TwilightGarden_did_guy_think_controllin_d2109c: "Did this guy think that controlling the automatic dolls will help him buy time?"
  npc_override_1@bamn_TwilightGarden_did_you_42b12c: "Did you do it?"
  npc_override_1@bamn_TwilightGarden_don_t_worry_i_ll_57796c: "Don't worry, I'll take care of Almond from here."
  npc_override_1@bamn_TwilightGarden_electricity_bounces_does_840f27: "The electricity bounces and doesn't move, as if the machine is broken."
  npc_override_1@bamn_TwilightGarden_everyone_supposed_mansio_933b6e: "Everyone was supposed to be in the mansion today."
  npc_override_1@bamn_TwilightGarden_go_suffer_e47829: "Go suffer!"
  npc_override_1@bamn_TwilightGarden_guest_there_intruder_720314: "Guest, there is an intruder!"
  npc_override_1@bamn_TwilightGarden_guy_you_missed_boy_purpl_953336: "The guy you missed is a boy with purple hair, right?"
  npc_override_1@bamn_TwilightGarden_hacking_channel_checked_9fdc1a: "...hacking channel checked."
  npc_override_1@bamn_TwilightGarden_hah_you_think_you_catch_5fb116: "Hah! Do you think you can catch me?"
  npc_override_1@bamn_TwilightGarden_he_always_ran_so_well_273da4: "But he always ran so well, It's the first time I've seen him properly~"
  npc_override_1@bamn_TwilightGarden_he_probably_went_western_2ded3b: "He probably went to the western part of the mansion, so head over there."
  npc_override_1@bamn_TwilightGarden_he_responding_anything_7f09e7: "He is not responding to anything."
  npc_override_1@bamn_TwilightGarden_heart_hunter_don_t_know_2bfbd5: "The heart hunter don't know what happened to me, but..."
  npc_override_1@bamn_TwilightGarden_hehehe_s_finally_time_re_8f0f78: "Hehehe... It's finally time for revenge... Hehehe..."
  npc_override_1@bamn_TwilightGarden_hey_you_ready_8aecdc: "Hey, are you ready?"
  npc_override_1@bamn_TwilightGarden_hmm_shall_we_cee8ce: "Hmm... Shall we do this?"
  npc_override_1@bamn_TwilightGarden_huh_what_you_carrying_ri_f7e08f: "Huh? What are you carrying right now? Take it out and show it to me."
  npc_override_1@bamn_TwilightGarden_i_don_t_know_if_a01aeb: "I don't know if we should set a trap, or give you a chance."
  npc_override_1@bamn_TwilightGarden_i_had_no_choice_blow_cfd4a7: "I had no choice but to blow the automatic dolls of the mansion..."
  npc_override_1@bamn_TwilightGarden_i_ll_deal_rest_who_f26154: "I'll deal with the rest who's hiding in the garden."
  npc_override_1@bamn_TwilightGarden_i_ll_explore_garden_firs_d63cc8: "I'll explore the garden first."
  npc_override_1@bamn_TwilightGarden_i_ll_join_you_soon_8459ad: "I'll join you soon."
  npc_override_1@bamn_TwilightGarden_i_ll_let_alpha_know_7f668d: "I'll let Alpha know later so she can retrieve the doll's body."
  npc_override_1@bamn_TwilightGarden_i_ll_look_around_find_2a91fd: "I'll look around and find other routes."
  npc_override_1@bamn_TwilightGarden_i_ll_waiting_guesthouse_99fc1f: "I'll be waiting at the guesthouse."
  npc_override_1@bamn_TwilightGarden_i_m_curious_should_we_159058: "I'm curious, should we go quickly?"
  npc_override_1@bamn_TwilightGarden_i_m_like_them_all_10b6e6: "I'm not like them at all, I'm an excellent creature!"
  npc_override_1@bamn_TwilightGarden_i_m_sure_i_ll_ed9f34: "I'm sure I'll feel better once I beat you."
  npc_override_1@bamn_TwilightGarden_i_passed_out_shock_556b13: "I passed out from the shock."
  npc_override_1@bamn_TwilightGarden_i_place_go_second_21c1da: "I have a place to go for a second."
  npc_override_1@bamn_TwilightGarden_i_t_understand_e40dd6: "I can't understand."
  npc_override_1@bamn_TwilightGarden_i_take_care_moving_sweet_e8fce2: "I will take care of moving Sweety."
  npc_override_1@bamn_TwilightGarden_i_think_he_fainted_my_3e7d7b: "I think he fainted from my attacks."
  npc_override_1@bamn_TwilightGarden_i_think_rest_members_som_3df6ad: "I think the rest of the members are somewhat good too."
  npc_override_1@bamn_TwilightGarden_i_thought_might_better_t_a3b430: "I thought it might be better to throw in more bait, so I went to ask for the help of the automatic dolls."
  npc_override_1@bamn_TwilightGarden_i_ve_heard_report_you_4d4d30: "I've heard the report. You found a guy who looked like the leader?"
  npc_override_1@bamn_TwilightGarden_i_ve_recovered_core_dba1d5: "I've recovered the core."
  npc_override_1@bamn_TwilightGarden_i_won_t_lose_you_41f95c: "I won't lose to you this time!"
  npc_override_1@bamn_TwilightGarden_if_there_s_enemy_causing_a5d867: "If there's an enemy causing commotion, we should attack them with more numbers."
  npc_override_1@bamn_TwilightGarden_kakaka_let_s_beat_them_fd0c36: "Kakaka, Let's beat them down with a blast!"
  npc_override_1@bamn_TwilightGarden_kid_while_ago_i_ve_20e639: "That kid a while ago, I've seen him before."
  npc_override_1@bamn_TwilightGarden_leave_rest_us_0575e8: "Leave the rest to us."
  npc_override_1@bamn_TwilightGarden_let_s_get_out_here_c068ff: "Let's get out of here."
  npc_override_1@bamn_TwilightGarden_let_s_go_208616: "Let's go!"
  npc_override_1@bamn_TwilightGarden_let_s_go_check_repeater_02907b: "Let's go check the repeater."
  npc_override_1@bamn_TwilightGarden_let_s_go_next_repeater_da8fb5: "Let's go to the next repeater~"
  npc_override_1@bamn_TwilightGarden_let_s_go_see_repeater_4d35cb: "Let's go see the Repeater that is oftenly hacked."
  npc_override_1@bamn_TwilightGarden_let_s_go_together_whenev_6a569a: "Let's go together whenever you're ready."
  npc_override_1@bamn_TwilightGarden_let_s_more_quietly_2ed706: "Let's do this more quietly."
  npc_override_1@bamn_TwilightGarden_let_s_wrap_up_e8ad64: "Let's wrap up."
  npc_override_1@bamn_TwilightGarden_looks_like_he_passed_out_7a45bf: "Looks like he passed out."
  npc_override_1@bamn_TwilightGarden_menu_almond_679719: "Almond: Sweety~ Do it in moderation~"
  npc_override_1@bamn_TwilightGarden_menu_est_085457: "Est : Elena said she'd join us later, but there's a good chance she won't able to join."
  npc_override_1@bamn_TwilightGarden_menu_est_308b4f: "Est : All we have to do is walk around like a patrol and catch them off guard."
  npc_override_1@bamn_TwilightGarden_menu_est_4959d0: "Est : Even so, there's no need to worry. The others are prepared and waiting for the ambush signal."
  npc_override_1@bamn_TwilightGarden_menu_est_a98a48: "Est : Don't look around too much, and pretend you're not vigilant, got it?"
  npc_override_1@bamn_TwilightGarden_menu_est_d2e7d0: "Est : Now, let's go."
  npc_override_1@bamn_TwilightGarden_menu_est_e59e29: "Est : It's dark and quiet. If you want to execute the plan, now's the perfect time. Right?"
  npc_override_1@bamn_TwilightGarden_menu_est_e5e8ad: "Est : Go along the road to the main building of the mansion. I'll lurk behind you."
  npc_override_1@bamn_TwilightGarden_menu_est_f361b7: "Est: Did you hear a loud noise from here?"
  npc_override_1@bamn_TwilightGarden_menu_options_1fd1a7: "{0} : Tracker : Kakakakakakakil! The culprit is around! They're on my radar! It's that way!"
  npc_override_1@bamn_TwilightGarden_menu_options_6a155a: "{0} : Tracker : According to the intuition of the great Elyumina... Too Doo Too Doo Too~"
  npc_override_1@bamn_TwilightGarden_menu_options_8ee85c: "{0} : Tracker : Over there!! Beep!"
  npc_override_1@bamn_TwilightGarden_menu_options_b90dc2: "{0} : Tracker : Pyo-o-o-o-o! There!!"
  npc_override_1@bamn_TwilightGarden_menu_options_e84979: "{0} : Tracker : Pyo-o-o-o-o! That way! Pyo-pyo~!"
  npc_override_1@bamn_TwilightGarden_menu_repeater_2b33a0: "Repeater : (... .. ..)"
  npc_override_1@bamn_TwilightGarden_menu_repeater_f87e14: "Repeater : (... ??... ??)"
  npc_override_1@bamn_TwilightGarden_msg_6eae3a: "..."
  npc_override_1@bamn_TwilightGarden_msg_8707ce: "... ..."
  npc_override_1@bamn_TwilightGarden_nods_2c5590: "...(Nods)"
  npc_override_1@bamn_TwilightGarden_now_i_sweety_take_care_5ce41b: "Now, I, Sweety will take care of the idiots that just came in!"
  npc_override_1@bamn_TwilightGarden_now_more_time_yes_no_4aeb73: "Now? More time... Yes, no... Ah..."
  npc_override_1@bamn_TwilightGarden_oh_there_s_message_stay_64aa40: "Oh, there's a message. Stay there for a while. Yes, Hello."
  npc_override_1@bamn_TwilightGarden_pitaya_s_here_cute_they_04afc9: "The Pitaya's here is cute~ They say Almonds is delicious? Have you eaten almonds before?"
  npc_override_1@bamn_TwilightGarden_please_deal_him_enough_m_d3add3: "Please deal with him enough to make him satisfied."
  npc_override_1@bamn_TwilightGarden_quietly_surrender_return_3fedea: "Quietly surrender or return back to where you came from."
  npc_override_1@bamn_TwilightGarden_reason_i_d_like_ask_aaf1f4: "For that reason, I'd like to ask you to escort Almon here to check the repeater."
  npc_override_1@bamn_TwilightGarden_recovering_083407: "...recovering...84%"
  npc_override_1@bamn_TwilightGarden_recovering_7d54f7: "...recovering...72%"
  npc_override_1@bamn_TwilightGarden_recovering_82496b: "...recovering..."
  npc_override_1@bamn_TwilightGarden_recovery_completed_4a83e5: "...recovery completed."
  npc_override_1@bamn_TwilightGarden_repeater_dead_again_s_wh_c3d934: "The repeater is dead again. That's why I have to fix it."
  npc_override_1@bamn_TwilightGarden_repeater_favorite_target_e62a36: "The repeater is the favorite target of the intruders, so we can't just leave it broken, right?"
  npc_override_1@bamn_TwilightGarden_s_been_while_since_i_44c79c: "It's been a while since I've been this comfortable~"
  npc_override_1@bamn_TwilightGarden_s_est_de4bf9: "It's Est!"
  npc_override_1@bamn_TwilightGarden_s_kid_before_right_he_4044f0: "It's the kid from before, right? He's an intruder. That's weird, kind of like almonds..."
  npc_override_1@bamn_TwilightGarden_s_little_late_s_over_af221f: "It's a little late, but it's over."
  npc_override_1@bamn_TwilightGarden_s_loud_thing_b7b548: "That's a loud thing."
  npc_override_1@bamn_TwilightGarden_s_more_quiet_than_i_8c2d06: "It's more quiet than I thought. Where did the intruders go?"
  npc_override_1@bamn_TwilightGarden_s_my_job_fix_his_f27cd4: "And it's my job to fix his destroyed body."
  npc_override_1@bamn_TwilightGarden_s_quite_far_here_ea860f: "But it's quite far from here."
  npc_override_1@bamn_TwilightGarden_seeing_he_averts_his_gaz_a25073: "Seeing that he averts his gaze, he doesn't seem completely broken."
  npc_override_1@bamn_TwilightGarden_shall_we_go_faster_there_469b32: "Shall we go faster? There's a sound coming from over there..."
  npc_override_1@bamn_TwilightGarden_shall_we_go_repeater_422242: "Shall we go to the repeater?"
  npc_override_1@bamn_TwilightGarden_shouldn_t_you_talk_est_666cff: "Shouldn't you talk to Est? Looks like she've been waiting."
  npc_override_1@bamn_TwilightGarden_so_did_teachers_2a284f: "So did the teachers."
  npc_override_1@bamn_TwilightGarden_so_far_no_okay_e85c12: "... ... so far... no?!... Okay..."
  npc_override_1@bamn_TwilightGarden_so_s_you_guy_who_539d2b: "So that's you. The guy who was dragging his feet in the garden."
  npc_override_1@bamn_TwilightGarden_something_important_came_14adfe: "Something important came up. That's why I'm here with Est."
  npc_override_1@bamn_TwilightGarden_talk_almond_when_you_re_82871d: "Talk to Almond, when you're ready to move."
  npc_override_1@bamn_TwilightGarden_thank_you_showing_yourse_6aef8d: "Thank you for showing yourselves! You bastards!"
  npc_override_1@bamn_TwilightGarden_then_let_us_go_268790: "Then, let us go."
  npc_override_1@bamn_TwilightGarden_then_shall_we_9a6bfe: "Then, shall we?"
  npc_override_1@bamn_TwilightGarden_there_no_way_find_out_7a1681: "There is no way to find out what the state of the repeater is. The communication chip seems to be properly installed."
  npc_override_1@bamn_TwilightGarden_there_s_another_intruder_adf662: "There's another intruder! No wonder I'm starting to get excited~!"
  npc_override_1@bamn_TwilightGarden_there_still_some_intrude_59455b: "There is still some intruders out there."
  npc_override_1@bamn_TwilightGarden_they_already_escaped_usi_59ea2e: "They already escaped using the airships!"
  npc_override_1@bamn_TwilightGarden_they_must_been_waiting_t_5dbda4: "They must have been waiting too."
  npc_override_1@bamn_TwilightGarden_those_guys_nothing_failu_be5cd9: "But, those guys are nothing but failures."
  npc_override_1@bamn_TwilightGarden_wait_bit_5cb0c8: "Wait a bit."
  npc_override_1@bamn_TwilightGarden_wait_sec_267d13: "^008800Wait a sec!!"
  npc_override_1@bamn_TwilightGarden_way_43fd4c: "This way."
  npc_override_1@bamn_TwilightGarden_way_other_one_92c8fd: "Were on the way to the other one."
  npc_override_1@bamn_TwilightGarden_we_ll_take_over_place_117b9a: "We'll take over this place, just watch!"
  npc_override_1@bamn_TwilightGarden_we_re_going_bait_him_9b5f9f: "We're going to bait him out."
  npc_override_1@bamn_TwilightGarden_well_doesn_t_mean_we_7edac0: "Well, that doesn't mean we'll let you go back."
  npc_override_1@bamn_TwilightGarden_what_52f3d0: "What...?"
  npc_override_1@bamn_TwilightGarden_what_did_they_ran_move_039695: "What? Did they ran?! Move out!"
  npc_override_1@bamn_TwilightGarden_what_did_you_come_here_634478: "What, did you come here to explore the garden?"
  npc_override_1@bamn_TwilightGarden_what_happened_repeater_c3fa4f: "What happened to the repeater?"
  npc_override_1@bamn_TwilightGarden_what_signal_you_sending_b7fc8f: "What signal are you sending to each other?"
  npc_override_1@bamn_TwilightGarden_what_where_did_other_guy_01b9cd: "What, where did the other guys go?"
  npc_override_1@bamn_TwilightGarden_what_why_389c4d: "What, why?"
  npc_override_1@bamn_TwilightGarden_why_sweety_likes_push_hi_01a07b: "Why Sweety likes to push his body to the limit..."
  npc_override_1@bamn_TwilightGarden_yes_s_go_no_two_ca25be: " ... yes ... s ... go ... no ... two ..."
  npc_override_1@bamn_TwilightGarden_you_all_right_adventurer_1186b2: "Are you all right, adventurer? Then, we can keep going."
  npc_override_1@bamn_TwilightGarden_you_aware_8dab31: "Are you aware of it?"
  npc_override_1@bamn_TwilightGarden_you_cannot_receive_any_m_5017ef: "You cannot receive any more items because you're carrying too many items. Please try again after you lighten up.^000000"
  npc_override_1@bamn_TwilightGarden_you_elyumina_s_tracker_a_5b51b5: "You have Elyumina's tracker. It will activate, if you get near him."
  npc_override_1@bamn_TwilightGarden_you_elyumina_s_tracker_i_1c0684: "You have Elyumina's tracker, if you get near him, it will activate."
  npc_override_1@bamn_TwilightGarden_you_move_out_first_4f39e8: "Will you move out first?"
  npc_override_1@bamn_TwilightGarden_you_re_looking_boy_purpl_c2b7ed: "You're looking for a boy with purple hair, right? He went towards the labs."
  npc_override_1@bamn_TwilightGarden_you_re_one_step_behind_9465fc: "You're one step behind! You bunch of idiots!"
  npc_override_1@bamn_TwilightGarden_you_re_pretty_good_aren_d451b3: "You're pretty good, aren't you?"
  npc_override_1@bamn_TwilightGarden_you_re_too_late_you_bb5782: "You're too late. You idiots!"
  npc_override_1@bamn_TwilightGarden_you_want_wrap_up_now_df28ae: "Do you want to wrap up now?"
  npc_override_1@bamn_TwilightGarden_you_you_re_reason_i_10b323: "You! You're the reason I don't have time right now! I'll kill you the next time we meet!"
