Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@infi_InfiniteSpace_ah_no_i_didn_t_446c09: "Ah, no, I didn't meant to go inside. I didn't meant to violate any laws."
  npc_override_1@infi_InfiniteSpace_all_right_just_one_thing_0ba845: "All right, Just one thing, I'm inexperienced and a novice adventurer. So I'll help you explore down there by guiding you from somewhere safe."
  npc_override_1@infi_InfiniteSpace_because_its_depth_seemin_6c23a3: "Because its depth is seemingly endless, the people here became afraid of this place and started calling it Infinite Space."
  npc_override_1@infi_InfiniteSpace_good_shall_we_go_now_79884b: "Good. Shall we go now?"
  npc_override_1@infi_InfiniteSpace_ha_d228a2: "Ha?"
  npc_override_1@infi_InfiniteSpace_hmm_you_one_royal_palace_9ca481: "Hmm, are you one of the Royal Palace's suppression squad?"
  npc_override_1@infi_InfiniteSpace_i_know_some_people_who_bf9b07: "I know some people who sneaked in and made a fortune. That's why I'm going to give it a try, are you interested?"
  npc_override_1@infi_InfiniteSpace_i_ll_keep_separate_recor_666eee: "I'll keep a separate record of this expedition. If you've been lucky, you might have gotten a decent reward from your expedition."
  npc_override_1@infi_InfiniteSpace_i_m_adventure_tour_you_1b53fb: "I'm an adventure tour, and you can explore it yourself. Aren't we compatible with each other? Then, let's get started when you're ready."
  npc_override_1@infi_InfiniteSpace_i_m_just_ordinary_woman_184d13: "I'm just an ordinary woman who's out for a walk. And this is the end of my walk, and I'm going to..."
  npc_override_1@infi_InfiniteSpace_i_m_ordinary_adventurer_7ecdd3: "I'm an ordinary adventurer."
  npc_override_1@infi_InfiniteSpace_i_ve_never_soon_you_fe7342: "I've never soon you before, so I thought you are one of the suppression squad of the palace."
  npc_override_1@infi_InfiniteSpace_i_went_out_place_many_b5719c: "I have went in and out of this place many times and figured out a way to provoke the monsters in here. You can get more rewards if you're going to deal with heated ones."
  npc_override_1@infi_InfiniteSpace_menu_i_1070b7: "I'm not interested.:Yes."
  npc_override_1@infi_InfiniteSpace_menu_i_87d1a6: "I want to proceed normally:I want to proceed with something difficult"
  npc_override_1@infi_InfiniteSpace_menu_prepare_148ae7: "Prepare to enter Infinite Space:Cancel"
  npc_override_1@infi_InfiniteSpace_menu_what_422da3: "What if I am one of the suppression squad?:What's the matter?"
  npc_override_1@infi_InfiniteSpace_oh_your_whole_body_shout_0c6afa: "Oh, your whole body is shouting that it's tired. You can't go down there like this."
  npc_override_1@infi_InfiniteSpace_once_passage_opens_take_348f75: "Once the passage opens, take a breath for a while and talk to me again."
  npc_override_1@infi_InfiniteSpace_paros_lighthouse_here_co_1d69b5: "The Paros Lighthouse here collapsed for some unknown reason some time ago, and there's a lot of stuff underneath it."
  npc_override_1@infi_InfiniteSpace_passage_yet_activated_95e226: "The passage is not yet activated."
  npc_override_1@infi_InfiniteSpace_phew_s_relief_9a9ddf: "Phew~ That's a relief."
  npc_override_1@infi_InfiniteSpace_please_note_any_abnormal_3139a0: "^FF0000Please note that, any abnormal monster handling inside the instance such as taming is not considered normal and may hinder the instance progress.^000000"
  npc_override_1@infi_InfiniteSpace_reservation_instance_fai_f7a70c: "The reservation of the instance '{0}' has failed due to an active instance."
  npc_override_1@infi_InfiniteSpace_s_impossible_alone_you_l_6286fc: "It's impossible alone. Would you like to organize a party at least one person or join another party and come back?"
  npc_override_1@infi_InfiniteSpace_s_unfortunate_come_back_0a9c8c: "That's unfortunate. Come back whenever you change your mind. I'll welcome you anytime."
  npc_override_1@infi_InfiniteSpace_she_moved_close_me_2e9aed: "^777700(She moved close to me)^000000"
  npc_override_1@infi_InfiniteSpace_so_shall_we_get_out_b0d9c1: "So, shall we get out of here?"
  npc_override_1@infi_InfiniteSpace_some_restoration_workers_e2ca4a: "Some of the restoration workers and guards that were sent to the palace went missing. Rumors has it that monsters are crawling down there."
  npc_override_1@infi_InfiniteSpace_what_you_talking_about_fb4e69: "What are you talking about?"
  npc_override_1@infi_InfiniteSpace_what_you_think_you_like_ff56b7: "What do you think? Would you like to try something challenging?"
  npc_override_1@infi_InfiniteSpace_you_come_back_me_after_e9d84f: "Will you come back to me after getting a little bit stronger? How about getting to level 100 first?"
  npc_override_1@infi_InfiniteSpace_you_going_there_again_ti_a5849b: "Are you going in there again this time?"
  npc_override_1@infi_InfiniteSpace_you_heard_about_paros_li_b9f7e7: "Have you heard about the Paros Lighthouse collapse?"
