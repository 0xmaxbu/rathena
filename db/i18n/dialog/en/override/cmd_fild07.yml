Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_cmd_fild07_InfiniteSpace_merchants_choose_type_equipment_yo_35cc13: "Choose the type of equipment that you want to purchase. You can purchase as many as you want, as long as you have {0}."
  npc_override_cmd_fild07_InfiniteSpace_merchants_come_back_anytime_512848: "Come back anytime"
  npc_override_cmd_fild07_InfiniteSpace_merchants_did_you_take_off_your_16720e: "Did you take off your equipment?"
  npc_override_cmd_fild07_InfiniteSpace_merchants_equipment_suitable_encha_7906cc: "This equipment is not suitable for enchanting. Don't forget that only the infinite equipment series can be enchanted."
  npc_override_cmd_fild07_InfiniteSpace_merchants_give_me_one_0b0037: "Give me one"
  npc_override_cmd_fild07_InfiniteSpace_merchants_good_deal_need_more_b17b6b: "It was a good deal. Need more?"
  npc_override_cmd_fild07_InfiniteSpace_merchants_hey_isn_t_hard_walk_42181f: "Hey, isn't it hard to walk in and out of here every time? For just ^0000ff20,000^000000 Zeny, you can have a scroll that will take you directly to the entrance of the ruins, what do you think?"
  npc_override_cmd_fild07_InfiniteSpace_merchants_hm_way_i_don_t_c9ad33: "Hm. By the way, I don't think you were listening, you don't have enough {0}."
  npc_override_cmd_fild07_InfiniteSpace_merchants_hm_well_done_check_your_66a161: "Hm. It was well done. Check your equipment at once."
  npc_override_cmd_fild07_InfiniteSpace_merchants_i_don_t_think_so_bbad85: "I don't think so"
  npc_override_cmd_fild07_InfiniteSpace_merchants_i_ll_make_sure_gets_44fc5b: "I'll make sure it gets enchanted without a problem."
  npc_override_cmd_fild07_InfiniteSpace_merchants_i_lot_stuff_over_here_3ad425: "I have a lot of stuff over here, of course, not for free."
  npc_override_cmd_fild07_InfiniteSpace_merchants_i_only_enchant_rd_th_e6ffe0: "I can only enchant the 3rd and the 4th slot."
  npc_override_cmd_fild07_InfiniteSpace_merchants_i_only_enchant_up_third_4b7d9f: "I can only enchant up to the third slot. Your equipment can't be further enchanted."
  npc_override_cmd_fild07_InfiniteSpace_merchants_if_you_change_your_mind_b8d405: "If you change your mind, just return to me."
  npc_override_cmd_fild07_InfiniteSpace_merchants_if_you_re_looking_streng_20ebc2: "If you're looking to strengthen the equipment that you've obtained in the Infinite Space, you have come to the right place."
  npc_override_cmd_fild07_InfiniteSpace_merchants_material_i_reinforce_equ_c2388f: "For that material, I can reinforce the equipment that you got from the Infinite Space."
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_cancel_9c2fca: "Cancel:Purchase"
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_cancel_be4413: "Cancel:Weapons:Armors"
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_cancel_f5a301: "Cancel:Weapon:Armor:Shoes:Garment:Helm"
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_how_4d9928: "How do I enchant my equipment?:Enchant equipment.:Initialize equipment's enchant."
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_i_648ebb: "I'll return later.:Please proceed."
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_quit_19ed20: "Quit:Proceed"
  npc_override_cmd_fild07_InfiniteSpace_merchants_menu_quit_275c1f: "Quit:Physical:Magical:Range"
  npc_override_cmd_fild07_InfiniteSpace_merchants_okay_let_s_begin_first_b49895: "Okay, let's begin the first enchantment."
  npc_override_cmd_fild07_InfiniteSpace_merchants_okay_let_s_proceed_secon_5e56cd: "Okay, let's proceed with the second enchantment."
  npc_override_cmd_fild07_InfiniteSpace_merchants_please_come_back_wheneve_b4314d: "Please come back whenever you want~"
  npc_override_cmd_fild07_InfiniteSpace_merchants_please_organize_your_ite_01b3c7: "Please organize your items and try again."
  npc_override_cmd_fild07_InfiniteSpace_merchants_please_select_equipment_df2e4a: "Please select the equipment that you want to enchant."
  npc_override_cmd_fild07_InfiniteSpace_merchants_thank_you_your_trust_ple_02576b: "Thank you for your trust. Please come back again next time."
  npc_override_cmd_fild07_InfiniteSpace_merchants_then_come_visit_me_when_93d45b: "Then come visit me when you want to enchant the equipment."
  npc_override_cmd_fild07_InfiniteSpace_merchants_there_chance_your_infini_52c7b4: "There is a chance that your infinite space equipment will be destroyed on the initializion process. Are you still willing to proceed?"
  npc_override_cmd_fild07_InfiniteSpace_merchants_there_no_chance_equipmen_b15194: "There is no chance of the equipment being destroyed during the enchanting process, but there's a high probability that it will be destroyed when initializing the enchants."
  npc_override_cmd_fild07_InfiniteSpace_merchants_well_i_did_warn_you_127053: "Well, I did warn you. You aren't lucky, eh?"
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_any_90f9da: "Do you have any {0}?"
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_choose_types_enchant_cfd017: "You can choose 3 types of enchant, and the enchant fee is {0} {1}."
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_don_t_enough_purchas_c84a4d: "You don't have enough {0} to purchase this item."
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_don_t_seem_any_424dc5: "You don't seem to have any more money. A scroll costs 20,000 Zeny."
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_ll_able_obtain_if_53a0ed: "You'll be able to obtain {0}, if you explore the space under the Paros Lighthouse."
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_need_purchase_889371: "You need ^0000FF{0}^000000 {1} to purchase the {2}~"
  npc_override_cmd_fild07_InfiniteSpace_merchants_you_t_proceed_conversati_381a25: "You can't proceed with the conversation because you have a large quantity of items."
  npc_override_cmd_fild07_InfiniteSpace_merchants_your_equipment_doesn_t_a_50fecb: "Your equipment doesn't have any enchant on it."
  npc_override_cmd_fild07_comodo_i_see_no_monsters_here_898c50: "I see no monsters here..."
  npc_override_cmd_fild07_comodo_i_want_go_explore_inside_a8783b: "I want to go explore inside..."
  npc_override_cmd_fild07_comodo_if_you_tell_me_go_db6fe1: "If you tell me to not go in, isn't it going to make me want to go inside even more? But it doesn't look like there's anything interesting to see."
  npc_override_cmd_fild07_comodo_kind_smells_like_212c3f: "It kind of smells like it..."
  npc_override_cmd_fild07_comodo_no_i_m_just_passing_60edd3: "No... I'm just passing by. I don't want to go inside..."
  npc_override_cmd_fild07_comodo_rumors_been_spreading_th_1350c7: "Rumors have been spreading that there are monsters living here. People claim to hear the ground rumbling because of them..."
  npc_override_cmd_fild07_comodo_you_think_there_s_going_277ee6: "Do you think there's going to be treasure inside this place?"
