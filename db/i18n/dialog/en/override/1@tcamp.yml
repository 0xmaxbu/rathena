Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@tcamp_ThorGunsuBase_all_kinds_documents_all_077ba6: "All kinds of documents are all mixed up."
  npc_override_1@tcamp_ThorGunsuBase_all_weapons_firearms_the_bb6da5: "All of the weapons and firearms that these people disposed of have less than a year left before their expiration date."
  npc_override_1@tcamp_ThorGunsuBase_anyway_what_information_518b1d: "Anyway, what information did you get?"
  npc_override_1@tcamp_ThorGunsuBase_as_expected_you_talented_c0e3c2: "As expected, you are talented, adventurer. I used all my connections to find out the location."
  npc_override_1@tcamp_ThorGunsuBase_as_expected_your_skills_abac25: "As expected, your skills are good. I used all my connections to find out the location, but you found it right away."
  npc_override_1@tcamp_ThorGunsuBase_better_proceed_caution_c904e3: "It would be better to proceed with caution."
  npc_override_1@tcamp_ThorGunsuBase_careful_explore_inside_173df6: "Be careful and explore inside."
  npc_override_1@tcamp_ThorGunsuBase_document_weapon_sales_re_9da84b: "This document is a weapon sales record. Please show it to me."
  npc_override_1@tcamp_ThorGunsuBase_even_date_very_recent_th_ec516b: "Even the date is very recent. There is also a record of handing over a large amount of weapons to Mr. Dandelion."
  npc_override_1@tcamp_ThorGunsuBase_get_out_bag_put_your_5b30f5: "Get it out of the bag. Put it on your head."
  npc_override_1@tcamp_ThorGunsuBase_how_did_you_adventurer_d_00cf83: "How did you and the adventurer dig this far?"
  npc_override_1@tcamp_ThorGunsuBase_i_also_something_deliver_0a2ea5: "I also have something to deliver to Rachel, so Miriam, let's go together."
  npc_override_1@tcamp_ThorGunsuBase_i_didn_t_know_miriam_c65949: "I didn't know Miriam would be here. Right, adventurer?"
  npc_override_1@tcamp_ThorGunsuBase_i_guess_s_point_time_660c8d: "...But I guess it's at this point in time."
  npc_override_1@tcamp_ThorGunsuBase_i_ll_dig_little_deeper_37af68: "I'll have to dig a little deeper, but that's my guess for now."
  npc_override_1@tcamp_ThorGunsuBase_i_ll_relay_what_i_475693: "I'll have to relay what I found out to my adoptive father."
  npc_override_1@tcamp_ThorGunsuBase_i_tell_you_shortcut_get_81b4e0: "I will tell you a shortcut to get out, so would you, adventurer, tell Suad what you found out here?"
  npc_override_1@tcamp_ThorGunsuBase_i_think_s_isolated_corru_6d5a50: "I think it's an isolated corruption at the lowest level, the weapons leak incident."
  npc_override_1@tcamp_ThorGunsuBase_i_took_one_out_middle_2ccebe: "I took one out from the middle and saw... a map of the security guards at the military base?"
  npc_override_1@tcamp_ThorGunsuBase_i_took_out_few_pages_62afca: "I took out a few pages from the middle and found that they were weapons expiration dates and sales records."
  npc_override_1@tcamp_ThorGunsuBase_i_wondering_if_really_po_859e65: "I was wondering if it would really pop out at a time like this."
  npc_override_1@tcamp_ThorGunsuBase_if_s_isolated_corruption_6cbd12: "If it's an isolated corruption, there's a chance that even my adoptive father doesn't know about it yet."
  npc_override_1@tcamp_ThorGunsuBase_if_s_your_adoptive_fathe_eda4a0: "If it's your adoptive father, is it Priest Amal?"
  npc_override_1@tcamp_ThorGunsuBase_if_weapon_properly_maint_9068e0: "If a weapon is not properly maintained, it may not function properly."
  npc_override_1@tcamp_ThorGunsuBase_if_you_get_caught_watcht_02e98b: "If you get caught by the watchtower, soldiers will appear, so be careful not to get caught."
  npc_override_1@tcamp_ThorGunsuBase_if_you_get_caught_you_abf959: "If you get caught, you might be attacked, so if you can't break through, we'll meet again here."
  npc_override_1@tcamp_ThorGunsuBase_intruder_detected_7d2d97: "Intruder detected !!"
  npc_override_1@tcamp_ThorGunsuBase_intruder_found_intruder_c07953: "Intruder found, intruder found. Ruled out immediately."
  npc_override_1@tcamp_ThorGunsuBase_just_moment_i_m_reading_b53268: "...Just a moment, I'm reading the document."
  npc_override_1@tcamp_ThorGunsuBase_let_s_careful_caught_gua_92d541: "Let's be careful not to be caught by the guards and explore the inside."
  npc_override_1@tcamp_ThorGunsuBase_let_s_something_about_ri_eac709: "Let's do something about it, right, adventurer?"
  npc_override_1@tcamp_ThorGunsuBase_let_s_try_go_while_5c81c5: "Let's try to go in while avoiding the guard tower as much as possible."
  npc_override_1@tcamp_ThorGunsuBase_look_document_here_1b70db: "Look at this document here."
  npc_override_1@tcamp_ThorGunsuBase_looking_date_s_long_time_ec3a3f: "Looking at the date, it's a long time ago document."
  npc_override_1@tcamp_ThorGunsuBase_looks_like_he_left_behin_4c3534: "It looks like he left behind only unimportant documents. Let's take care of them for now."
  npc_override_1@tcamp_ThorGunsuBase_looks_like_i_found_what_402d6d: "It looks like I found what I was looking for. I put the documents in my arms."
  npc_override_1@tcamp_ThorGunsuBase_looks_like_menu_been_set_663eca: "It looks like the menu has been set on fried fish covered in sauce...."
  npc_override_1@tcamp_ThorGunsuBase_looks_like_you_found_adv_ab12a3: "It looks like you found the adventurer and Maram right away."
  npc_override_1@tcamp_ThorGunsuBase_menu_caution_f3b056: "^FF0000Caution : If you perform arbitrary processing within the dungeon, such as monster taming, it will not be considered normal progress.^000000"
  npc_override_1@tcamp_ThorGunsuBase_menu_leader_4d6811: "Leader: {0}"
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_06bdf1: "Maram: This building looks quite suspicious, right? There must be a surveillance system in here too."
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_7243a4: "Maram: Looks like we're in pretty deep. We should be able to safely find what we need."
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_73dd24: "Maram: Let's explore carefully this time, being careful not to get caught."
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_7d5d33: "Maram: Ha, this is really fun."
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_82fa20: "Maram: Well, we can pass now!"
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_9866db: "Maram: Shall we wish you good luck?"
  npc_override_1@tcamp_ThorGunsuBase_menu_maram_ed59b2: "Maram: Please wait a moment. I know how to open it."
  npc_override_1@tcamp_ThorGunsuBase_menu_miriam_7061ef: "Miriam: Oh, adventurer? Maram, you too!?"
  npc_override_1@tcamp_ThorGunsuBase_menu_party_328f2e: "Party: {0}"
  npc_override_1@tcamp_ThorGunsuBase_msg_c77c95: "......."
  npc_override_1@tcamp_ThorGunsuBase_no_miriam_how_you_here_97f38c: "No, Miriam! How are you here?"
  npc_override_1@tcamp_ThorGunsuBase_oh_please_give_me_docume_a454d5: "Oh, please give me the documents. I'll take them as evidence."
  npc_override_1@tcamp_ThorGunsuBase_one_military_bases_manag_a59684: "This is one of the military bases managed by my adoptive father."
  npc_override_1@tcamp_ThorGunsuBase_one_year_long_expiration_2710da: "One year is not a long expiration date, but it is not too tight."
  npc_override_1@tcamp_ThorGunsuBase_only_member_party_enter_9eb530: "^ff0000Only a member of the party can enter the Memorial Dungeon.^000000"
  npc_override_1@tcamp_ThorGunsuBase_party_entering_3748ac: "{0} of the party, {1}, is entering {2}."
  npc_override_1@tcamp_ThorGunsuBase_please_read_these_docume_f0d242: "Please read these documents. They contain what we are looking for."
  npc_override_1@tcamp_ThorGunsuBase_quality_all_weapons_comi_f21094: "The quality of all weapons coming out of the back hole is the same."
  npc_override_1@tcamp_ThorGunsuBase_rather_than_having_me_ex_d5b283: "Rather than having me explain everything to you, I think it would be better for you to see it for yourself."
  npc_override_1@tcamp_ThorGunsuBase_really_isolated_case_cor_4261c6: "Is this really an isolated case of corruption? That is something that bothers me."
  npc_override_1@tcamp_ThorGunsuBase_s_right_adventurer_when_cea166: "That's right, adventurer. When I looked at the ledger, it doesn't seem like my adoptive father was involved."
  npc_override_1@tcamp_ThorGunsuBase_seems_like_real_deal_aft_ae5d0b: "It seems like this is the real deal after all. The security here is different from what it has been so far...."
  npc_override_1@tcamp_ThorGunsuBase_seems_like_you_haven_t_084150: "It seems like you haven't created the dungeon yet. Please check again in a moment."
  npc_override_1@tcamp_ThorGunsuBase_still_what_i_gained_proc_bcc685: "Still, what I gained from the process was different, so I guess it has some meaning."
  npc_override_1@tcamp_ThorGunsuBase_thank_you_coming_all_way_5a60f4: "Thank you for coming all the way here."
  npc_override_1@tcamp_ThorGunsuBase_then_i_guess_i_ll_42c344: "Then I guess I'll have to leave for a while."
  npc_override_1@tcamp_ThorGunsuBase_there_wouldn_t_been_need_0226c1: "There wouldn't have been a need to dispose of it right away."
  npc_override_1@tcamp_ThorGunsuBase_they_moved_separately_en_d528ad: "They moved separately, but ended up in the same place."
  npc_override_1@tcamp_ThorGunsuBase_they_said_they_conduct_s_2fedef: "They said they would conduct a separate investigation!"
  npc_override_1@tcamp_ThorGunsuBase_top_chapter_if_you_feed_4bdf4c: "The top chapter is... ��If you feed a magmaring a potato and then hunt it after a while, should it drop a baked potato?'"
  npc_override_1@tcamp_ThorGunsuBase_top_page_battle_decide_m_3e74c9: "On the top page... is it a battle to decide the menu for lunch?"
  npc_override_1@tcamp_ThorGunsuBase_try_move_away_security_g_bd5351: "Try to move away from the security guard's line of sight as much as possible."
  npc_override_1@tcamp_ThorGunsuBase_unknown_error_0aeb9e: "^0000ff{0} ^000000- Unknown error"
  npc_override_1@tcamp_ThorGunsuBase_unknown_error_occurred_285cc7: "^ff0000An unknown error occurred.^000000"
  npc_override_1@tcamp_ThorGunsuBase_we_follow_shortly_so_ple_0e6356: "We will follow shortly, so please go and tell us first."
  npc_override_1@tcamp_ThorGunsuBase_well_if_you_find_anythin_05d695: "Well, if you find anything, please contact me!"
  npc_override_1@tcamp_ThorGunsuBase_what_i_heard_dandelion_e_f5dabb: "From what I heard from Dandelion earlier, there aren't many people, but there are watchtowers here and there that monitor a fairly wide area."
  npc_override_1@tcamp_ThorGunsuBase_what_kind_picture_s_real_fa8bb8: "What kind of picture is this? And it's really well drawn...."
  npc_override_1@tcamp_ThorGunsuBase_when_application_complet_acead6: "When the application is complete, talk to me again and select ^0000CD{0} entry^000000"
  npc_override_1@tcamp_ThorGunsuBase_when_i_pulled_one_out_e3975b: "When I pulled one out from the middle... I found an illustration of the Pope drawn with Pope cookie icing using a pen."
  npc_override_1@tcamp_ThorGunsuBase_why_did_pour_out_moment_1e38ff: "Why did it pour out at this moment when we were preparing for the protest?"
  npc_override_1@tcamp_ThorGunsuBase_why_here_i_m_curious_d6df46: "...Why is this here? But I'm curious about the results!"
  npc_override_1@tcamp_ThorGunsuBase_you_sell_weapons_like_so_91052a: "You sell weapons like this so recklessly."
  npc_override_1@tcamp_ThorGunsuBase_you_ve_arrived_adventure_2ecff2: "You've arrived, adventurer!"
