  npc_override_prt_castle_quests_morocc_eh_what_s_about_bazerald_50ddf5: "Eh?... What's this about?... A Bazerald of Walter family?...Why?"
  npc_override_prt_castle_quests_morocc_eigen_ahrum_exception_he_12864d: "Eigen Ahrum can be the exception. He is not polite, but he makes sense from others with exact confirmation."
