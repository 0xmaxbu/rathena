  npc_override_prt_castle_quests_morocc_he_so_serious_about_ever_6d5a4f: "He is so serious about everything. He doesn't make trouble or have outbursts... He can be kind of weird."
  npc_override_prt_castle_quests_morocc_he_soft_personality_thin_e823ab: "He has a soft personality and thinks too long about things, but I admit many merits to him. I can say he is a fairly high-standard candidate."
  npc_override_prt_castle_quests_morocc_he_tries_deal_things_too_3c7a94: "He tries to deal with things too tough that sometimes makes things into a problem. But even at those moments, he is willing to listen to my words; so we seldom seem to be in serious trouble."
