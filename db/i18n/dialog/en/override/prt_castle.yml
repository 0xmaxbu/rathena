  npc_override_prt_castle_quests_morocc_how_goes_i_don_t_ec5c55: "How goes it? I don't think it is easy to meet seven candidates and appraise them."
  npc_override_prt_castle_quests_morocc_how_going_40433e: "How is it going?"
  npc_override_prt_castle_quests_morocc_how_i_deal_stress_damn_a151be: "How can I deal with this stress? Damn! Hell!"
