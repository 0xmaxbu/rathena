  npc_override_prt_castle_brisingamen_seal_you_took_book_shelf_whil_3fc13d: "^3355FFYou took the book from the shelf while the librarian was dozing. According to the Crusader Personnel Records, there's only one recruit that was named Lowen Ellenen."
  npc_override_prt_castle_kings_items_as_promised_here_my_0a180b: "As promised, here is my {0}"
