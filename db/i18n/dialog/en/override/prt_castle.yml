  npc_override_prt_castle_quests_morocc_erm_actually_2f1531: "...Erm, actually..."
  npc_override_prt_castle_quests_morocc_ern_killed_villain_here_a26142: "Ern killed a villain here who bullied around.. I had no chance... He showed decisive action, and that will deserve him the right to be king..."
