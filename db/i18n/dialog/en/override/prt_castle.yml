  npc_override_prt_castle_quests_morocc_hi_how_you_873e88: "Hi, how are you?"
  npc_override_prt_castle_quests_morocc_higher_lower_9d4996: "from higher and lower."
  npc_override_prt_castle_quests_morocc_hm_i_agree_your_words_1d12a5: "Hm! I can agree with your words, the world is obscene, but you cannot bring me down to that level! I cannot forgive your words! Never, ever!"
