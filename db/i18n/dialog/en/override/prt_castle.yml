  npc_override_prt_castle_quests_morocc_how_you_give_encourageme_577fdd: "How do you give encouragement to others, usually?"
  npc_override_prt_castle_quests_morocc_huh_f77dfa: "Huh...~"
  npc_override_prt_castle_quests_morocc_huhu_all_i_just_wanted_809f4a: "Huhu... Not at all. I just wanted to kill you... That's it... Good job, Ern... This is legal, self-defense; killing a villain... right?"
  npc_override_prt_castle_quests_morocc_huhu_all_i_just_wanted_bab2fb: "Huhu... Not at all. I just wanted to kill you... That's it... Good job, Ern... This is legal self-defense, killing a villain... right?"
  npc_override_prt_castle_quests_morocc_huhu_you_don_t_need_f12faa: "Huhu...You don't need to know that. By the way, you kept your promise... You should be king... But if you are lost, and stray, I will come kill you at any time... from hell!!"
