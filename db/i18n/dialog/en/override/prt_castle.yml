  npc_override_prt_castle_kings_items_fine_then_hmph_ae77fd: "FINE THEN! Hmph!!"
  npc_override_prt_castle_kings_items_he_s_king_prontera_he_73547a: "He's the King of Prontera. He should be able to get me ANYTHING!!!"
  npc_override_prt_castle_kings_items_hello_you_help_me_e09654: "Hello, can you help me?"
  npc_override_prt_castle_kings_items_hmph_i_hate_my_dad_5360e2: "Hmph, I hate my dad right now!!"
  npc_override_prt_castle_kings_items_i_ll_give_my_5858cc: "I'll give my {0}"
  npc_override_prt_castle_kings_items_i_ll_give_you_my_1dfecf: "I'll give you my crown or my sword as a reward."
  npc_override_prt_castle_kings_items_if_you_get_her_these_0740bb: "If you get her these items I'm sure she'll calm down."
  npc_override_prt_castle_kings_items_menu_crown_ef6466: "Crown:Sword"
  npc_override_prt_castle_kings_items_menu_if_8ef6cd: "If you could get me:"
  npc_override_prt_castle_kings_items_menu_sure_c1cf97: "Sure, what can I do?:Sorry, I'm busy."
  npc_override_prt_castle_kings_items_menu_what_476462: "What do you need?:I have the items!:Forget it."
  npc_override_prt_castle_kings_items_menu_why_351ed0: "Why?:Whatever..."
  npc_override_prt_castle_kings_items_ok_s_fine_i_m_1d1677: "Ok, that's fine, I'm sure someone else will help."
  npc_override_prt_castle_kings_items_surely_calm_her_down_3df088: "This will surely calm her down."
  npc_override_prt_castle_kings_items_thank_you_soo_much_bf5d95: "THANK YOU SOO MUCH!!"
  npc_override_prt_castle_kings_items_thank_you_well_my_daught_9f92bd: "Thank you. Well, my daughter next to me is a little rowdy..."
  npc_override_prt_castle_kings_items_well_he_won_t_give_73ba7c: "Well, he won't give me what I want!!"
  npc_override_prt_castle_kings_items_what_item_you_want_74299a: "What item do you want?"
  npc_override_prt_castle_kings_items_x_f2bf86: " ~ ^0055FF{0}^000000x {1}"
  npc_override_prt_castle_kings_items_you_re_missing_something_ccbb1f: "You're missing something."
  npc_override_prt_castle_quests_morocc_aahh_boring_boring_dff58c: "Aahh...boring, boring."
  npc_override_prt_castle_quests_morocc_about_i_don_t_make_b1a103: "about this, but I don't make an issue in any case. Such a fastidious jerk."
  npc_override_prt_castle_quests_morocc_above_all_i_want_5a1bc6: "Above all, I want to"
  npc_override_prt_castle_quests_morocc_accordingly_i_take_benef_8ba849: "Accordingly, I will take benefits away from the difference of classes. It is not an equality issue, but for the ascension of national power."
  npc_override_prt_castle_quests_morocc_adventurer_appraiser_ful_5d1bdd: "adventurer appraiser fully."
  npc_override_prt_castle_quests_morocc_after_beating_knights_ab_a02bdf: "After beating the knights of abyss"
  npc_override_prt_castle_quests_morocc_after_getting_reins_d83a04: "after getting the 2 Reins."
  npc_override_prt_castle_quests_morocc_after_long_time_sufferin_42eb43: "...after a long time of suffering acutely from illness."
  npc_override_prt_castle_quests_morocc_ah_971301: "Ah..."
  npc_override_prt_castle_quests_morocc_ah_appraiser_come_3caaa1: "Ah, the appraiser has come."
  npc_override_prt_castle_quests_morocc_ah_c927a2: "Ah, is that it?"
  npc_override_prt_castle_quests_morocc_ah_course_middle_number_6c505c: "Ah, of course, 7 is the middle number. 7 means no success or no failure. The goal of this game is to give the right answer 2 times in a row. Let's begin!"
  npc_override_prt_castle_quests_morocc_ah_hold_moment_brother_a_41df33: "Ah. Hold on a moment Brother! Ahrum!"
  npc_override_prt_castle_quests_morocc_ah_i_heard_person_walter_47e22b: "Ah, I heard person from Walter came in here. Have you seen him?"
  npc_override_prt_castle_quests_morocc_ah_now_i_am_going_afbd7d: "Ah, now I am going to have a plan with Bro Ahrum"
  npc_override_prt_castle_quests_morocc_ah_please_leave_here_47b3b1: "...Ah, please leave here."
  npc_override_prt_castle_quests_morocc_ah_prince_735fb2: "Ah, Prince!"
  npc_override_prt_castle_quests_morocc_ah_those_last_words_ae80f1: "Ah, those last words"
  npc_override_prt_castle_quests_morocc_ah_you_ve_spent_long_fa082f: "Ah, you've spent a long time with me. You must be very tired. Before starting work, if you need some preparation, take off now and come back to me later. I will be waiting here for you."
  npc_override_prt_castle_quests_morocc_ahh_appraiser_you_know_w_732a3c: "Ahh... Appraiser, do you know what you have to do? Be mindful of your words. About what you saw, what you heard... You must not tell all of your experience to the inspector."
  npc_override_prt_castle_quests_morocc_ahh_i_see_777785: "Ahh, I see."
  npc_override_prt_castle_quests_morocc_ahh_mmm_i_8d4438: "Ahh... mmm... I..."
  npc_override_prt_castle_quests_morocc_ahh_you_came_meet_me_09a9cd: "Ahh, you came to meet me before huh? I guess you've already been to Glastheim."
  npc_override_prt_castle_quests_morocc_ahrum_ahrum_66ee1a: "Ahrum... Ahrum..."
  npc_override_prt_castle_quests_morocc_ahrum_blushes_f32cc3: "-Ahrum blushes"
  npc_override_prt_castle_quests_morocc_ahrum_casually_throws_ba_68b3db: "- Ahrum casually throws a Bazerald to Ernst.-"
  npc_override_prt_castle_quests_morocc_ahrum_elected_once_termi_f3671b: "Ahrum will be elected, once the termination of prince Ernst happens, and then..."
  npc_override_prt_castle_quests_morocc_ahrum_getting_weird_fde2f2: "Ahrum is getting weird."
  npc_override_prt_castle_quests_morocc_ahrum_grins_vague_feelin_6bd432: "-Ahrum grins with a vague feeling towards an irritated Helmut, and leaves the room.-"
  npc_override_prt_castle_quests_morocc_ahrum_help_me_supplement_b312ed: "Ahrum will help me to supplement any shortcomings. Not only Ahrum, but all ministers and cabinet members; and the public is my master."
  npc_override_prt_castle_quests_morocc_ahrum_seems_out_his_mind_b4419d: "-Ahrum, seems to be out of his mind, as he approaches the door-"
  npc_override_prt_castle_quests_morocc_ahrum_shows_gloomy_facia_b6dfa3: "-Ahrum shows a gloomy facial expression and leaves the room.-"
  npc_override_prt_castle_quests_morocc_ahrum_strides_out_room_g_7b606b: "-Ahrum strides out of the room, grumbling...-"
  npc_override_prt_castle_quests_morocc_ahrum_totally_neglects_6cb730: "-Ahrum totally neglects the"
  npc_override_prt_castle_quests_morocc_ahrum_what_s_wrong_you_d29240: "...Ahrum, what's wrong with you? You are not the Ahrum I know. What's made you like this?"
  npc_override_prt_castle_quests_morocc_akk_i_cannot_stand_such_502acd: "Akk! I cannot stand this! Such low behavior and words ...? You are no prince. I don't want to face you anymore! Get out of here!"
  npc_override_prt_castle_quests_morocc_all_glory_be3d28: "All for the glory"
  npc_override_prt_castle_quests_morocc_all_glory_rune_midgarts_08bd6a: "All the glory for Rune-Midgarts..."
  npc_override_prt_castle_quests_morocc_all_means_witness_agreem_e2b3ca: "By all means, be the witness of this agreement. You cannot say no. Because it is a very good thing, in some respects, for your work, isn't it?"
  npc_override_prt_castle_quests_morocc_alright_19c82d: "Alright,"
  npc_override_prt_castle_quests_morocc_alright_alright_don_t_7eff53: "Alright, alright. Don't"
  npc_override_prt_castle_quests_morocc_alright_good_you_proved_97a01c: "Alright, good. You proved your strength for yourself. Now you passed one exam. All but one."
  npc_override_prt_castle_quests_morocc_alright_up_you_5d3989: "Alright, up to you."
  npc_override_prt_castle_quests_morocc_also_you_ve_had_52395d: "but also you've had a"
  npc_override_prt_castle_quests_morocc_although_ahrum_strong_ca_fd429c: "Although Ahrum is a strong candidate, the prince of Gaebolg has a high reputation for his virtues too. For sure, it is better to confirm things."
  npc_override_prt_castle_quests_morocc_although_all_these_ab8ea1: "Although all these"
  npc_override_prt_castle_quests_morocc_although_i_ve_skipped_so_7e0c9a: "Although I've skipped some lessons in life, I can back up missing lessons easily. Who cares who can swear to me as King! This is how I am."
  npc_override_prt_castle_quests_morocc_although_you_may_ask_som_0e5b16: "Although you may ask something, you will not hear anything special from him now."
  npc_override_prt_castle_quests_morocc_anyhow_thanks_your_good_63805f: "Anyhow, thanks for your good work. I really feel sorry about bothering you with trifle things. This is my sense of gratitude. Don't feel so much burden and take this."
  npc_override_prt_castle_quests_morocc_anyway_we_got_little_bit_80eee8: "Anyway, we got a little bit more time. Keep the secret thoroughly; not to tell anyone."
  npc_override_prt_castle_quests_morocc_appraiser_335ef9: "Appraiser."
  npc_override_prt_castle_quests_morocc_as_i_expressed_very_impo_357986: "As I have expressed, this is a very important issue for the Rune-Midgarts kingdom. Although I've stressed this point repeateadly, I cannot stress it enough."
  npc_override_prt_castle_quests_morocc_as_leader_hunt_party_0e691d: "as a leader of a hunt party?"
  npc_override_prt_castle_quests_morocc_as_you_please_f1f0a2: "as you please."
  npc_override_prt_castle_quests_morocc_as_you_said_d3de7c: "As you said."
  npc_override_prt_castle_quests_morocc_assumption_1fdf6f: "It is an assumption."
  npc_override_prt_castle_quests_morocc_b_bro_brother_b0628d: "B... bro, brother!"
  npc_override_prt_castle_quests_morocc_b_bro_c78156: "B...bro?"
  npc_override_prt_castle_quests_morocc_b_brother_even_now_too_b585c9: "B..Brother... even now it is not too late! If you go to a medic, you can be restored!"
  npc_override_prt_castle_quests_morocc_b_brother_how_how_could_ae0469: "B..Brother....How...how could you?!"
  npc_override_prt_castle_quests_morocc_b_you_live_as_you_39d147: "B-but, you can live as you are! As if nothing happened. You are just needed to return to the way you were before. Brother, let me help you. Tell me everything you hide..."
  npc_override_prt_castle_quests_morocc_bbb_brother_you_told_me_66f1d1: "Bbb... Brother?... You... told me you would kill me... You just wanted to be killed by me??... Bbb...brother?..."
  npc_override_prt_castle_quests_morocc_bbb_brother_you_told_me_b5cdba: "Bbb... Brother?... You... told me "
  npc_override_prt_castle_quests_morocc_beautiful_613e5f: "...It is not beautiful."
  npc_override_prt_castle_quests_morocc_because_her_words_helped_e05253: "Because her words helped me much. Nothing special, but maybe a small bunch of flowers."
  npc_override_prt_castle_quests_morocc_because_resurrection_dev_320a98: "Because of the resurrection of the devil Satan Morocc, people are too uneasy to follow regular announcements, and the atmosphere of the kingdom is not stable."
  npc_override_prt_castle_quests_morocc_because_unknown_girl_s_l_bc20cb: "It is because of an unknown girl's letter..."
  npc_override_prt_castle_quests_morocc_before_everything_else_l_f71e10: "Before everything else, it is luck and glory for me, that I could be born in Walter, a distinguished noble family."
  npc_override_prt_castle_quests_morocc_before_getting_into_his_b9434d: "before getting into his room"
  npc_override_prt_castle_quests_morocc_before_going_into_his_ro_fecb25: "before going into his room"
  npc_override_prt_castle_quests_morocc_behind_soldier_you_find_23d25e: "Behind the soldier, you can find a secret door. If you talk to the soldier, the soldier will allow you to get in."
  npc_override_prt_castle_quests_morocc_best_country_world_helpi_b192f0: "the best country in the world, by helping each other."
  npc_override_prt_castle_quests_morocc_better_next_time_3d1404: "Do better next time."
  npc_override_prt_castle_quests_morocc_birth_king_s_family_what_9060cf: "Birth?... King's family? ...What's all that about?"
  npc_override_prt_castle_quests_morocc_both_family_lead_country_532142: "both family will lead this country, huhuhu."
  npc_override_prt_castle_quests_morocc_both_normal_public_promi_99d000: "Both normal public and prominent people take charge of the society that gathers that wisdom is easier than doing things on your own."
  npc_override_prt_castle_quests_morocc_br_brother_you_keep_insi_63787c: "Br...Brother, will you keep insisting on this? Our relationship is this short?"
  npc_override_prt_castle_quests_morocc_br_brother_you_way_too_0298ff: "Br...Brother. You are way too suppressive. Our appraiser must have his own position and opinion."
  npc_override_prt_castle_quests_morocc_bring_beer_beer_1607f5: "Bring beer! Beer!"
  npc_override_prt_castle_quests_morocc_bring_reins_ed5cda: "bring 2 ^ff0000Reins^000000."
  npc_override_prt_castle_quests_morocc_bro_tell_me_again_you_b8f940: "Bro, tell me again. You just said something?"
  npc_override_prt_castle_quests_morocc_brother_3875fa: "Brother?!"
  npc_override_prt_castle_quests_morocc_brother_ahrum_0c3c52: "Brother, Ahrum...?"
  npc_override_prt_castle_quests_morocc_brother_ahrum_142a1b: "...Brother Ahrum..."
  npc_override_prt_castle_quests_morocc_brother_ahrum_been_blami_bdc0a4: "Brother Ahrum has been blaming me for that, I think unnecessarily too long. But he listens to me and acts as I advise."
  npc_override_prt_castle_quests_morocc_brother_ahrum_ef3fee: "Brother Ahrum..."
  npc_override_prt_castle_quests_morocc_brother_brother_why_why_cc62a3: "...Brother...Brother... Why... Why... How can your face look so satisfied? How...? Brother..."
  npc_override_prt_castle_quests_morocc_brother_ernst_my_family_0aa21d: "To brother Ernst, from my family. It's sin. And I am a part of the sin. As a part of the family. Family's sin. Equal to my sin."
  npc_override_prt_castle_quests_morocc_brother_f7a05c: "Brother..."
  npc_override_prt_castle_quests_morocc_brother_i_don_t_know_c72c09: "Brother! I don't know why you are suffering so much! Are you this weak a creature?!"
  npc_override_prt_castle_quests_morocc_brother_if_you_want_92c15e: "...brother, if you want..."
  npc_override_prt_castle_quests_morocc_brother_what_s_wrong_you_a2ed8c: "Brother, what's wrong? Are you insane?"
  npc_override_prt_castle_quests_morocc_brother_you_think_about_5819a3: "Brother, you think about hell."
  npc_override_prt_castle_quests_morocc_brother_you_think_about_cccd6a: "Brother, you think about hell. It will never happen, so... Don't talk that way."
  npc_override_prt_castle_quests_morocc_brotherrrrrrrr_aed3a1: "Brotherrrrrrrr!!!"
  npc_override_prt_castle_quests_morocc_bu_6290b4: "Bu...but!"
  npc_override_prt_castle_quests_morocc_business_appraiser_b42941: "business, appraiser?"
  npc_override_prt_castle_quests_morocc_buzzzz_you_wrong_there_t_ecd832: "Buzzzz. You are wrong. There is a thing that is meaningless itself. Clearly speaking, the action becomes meaningless without knowing its meaning..."
  npc_override_prt_castle_quests_morocc_calbern_f0b4f7: "Calbern."
  npc_override_prt_castle_quests_morocc_calm_prudent_decision_412dcb: "with a calm and prudent decision."
  npc_override_prt_castle_quests_morocc_candidates_prince_536c47: "of the candidates for prince,"
  npc_override_prt_castle_quests_morocc_check_someone_s_quality_aec8e7: "To check someone's quality"
  npc_override_prt_castle_quests_morocc_checking_your_qualificat_f39eb9: "Checking your qualification is a matter that concerns me."
  npc_override_prt_castle_quests_morocc_child_what_heck_happened_d76552: "Child... What the heck happened to you?..."
  npc_override_prt_castle_quests_morocc_childhood_brought_envy_j_70250c: "childhood brought envy and jealousy from men, and endless proposals from women. I felt sick with it, so I came to be away from people."
  npc_override_prt_castle_quests_morocc_ciao_54d571: "Ciao..."
  npc_override_prt_castle_quests_morocc_come_here_b35a35: "Come here."
  npc_override_prt_castle_quests_morocc_coming_age_people_talk_a_9abff5: "In the coming age, people will talk about me as Eigen Ahrum from the Walter family, not Eigen Ahrum of Walter."
  npc_override_prt_castle_quests_morocc_coming_inside_abca07: "It was coming from inside.-"
  npc_override_prt_castle_quests_morocc_coming_think_my_family_m_19ae62: "Coming to think of my family, my people are so conservative and not flexible."
  npc_override_prt_castle_quests_morocc_concise_facts_him_9e3411: "and concise facts to him.-"
  npc_override_prt_castle_quests_morocc_conspiracy_two_families_993271: "(Is this the conspiracy of two families? What the hell..)"
  npc_override_prt_castle_quests_morocc_corrupt_3c37f8: "corrupt."
  npc_override_prt_castle_quests_morocc_country_5407ed: "in this country?"
  npc_override_prt_castle_quests_morocc_course_even_autopsy_find_da78a5: "Of course. Even an autopsy will not find it. ... You don't have to worry."
