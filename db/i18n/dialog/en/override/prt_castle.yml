  npc_override_prt_castle_quests_morocc_harmonious_23587a: "will not be harmonious"
  npc_override_prt_castle_quests_morocc_haven_t_you_seen_somethi_0fb01a: "Haven't you seen something mysterious? Or heard some gossip?"
  npc_override_prt_castle_quests_morocc_he_always_says_results_c_c3beeb: "He always says that results cannot be everything that matter."
  npc_override_prt_castle_quests_morocc_he_doesn_t_like_classy_2356bf: "He doesn't like classy costumes either. He didn't even bring a dress suit here. And as soon as he got here, he was immersed in making a lock and key, like that."
  npc_override_prt_castle_quests_morocc_he_doesn_t_seem_suprised_eeea32: "(He doesn't seem to be suprised too much.. Could there be a reason? Now I am suspicious...)"
