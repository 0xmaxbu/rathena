  npc_override_prt_castle_quests_morocc_hmm_higher_d37638: "Hmm... higher?..."
  npc_override_prt_castle_quests_morocc_hmm_hmm_ca463a: "Hmm-hmm."
  npc_override_prt_castle_quests_morocc_hmm_i_don_t_any_fa3473: "Hmm...I don't have any more words to say. Moreover, Ahrum seems to be strange these days. I worry about that. I hope it's not a big deal."
