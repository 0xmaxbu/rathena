  npc_override_prt_castle_quests_morocc_hmmm_they_smell_really_g_d66879: "Hmmm~ They smell really good."
  npc_override_prt_castle_quests_morocc_hmph_some_thing_nothing_c0cbec: "Hmph..The some thing. Nothing. It's meaningless. Reality, that's all. It was nice talking to you. Bye-bye, and live like what you used to live like, ever after."
