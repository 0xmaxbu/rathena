  npc_override_prt_castle_quests_morocc_i_am_ernst_prince_geobor_d5cabf: "I am Ernst, prince of Geoborg."
  npc_override_prt_castle_quests_morocc_i_am_glad_girl_liked_12552a: "I am glad that the girl liked it. Once I got cured, I wanted to go meet with her."
  npc_override_prt_castle_quests_morocc_i_am_helmut_roewenburg_708e14: "I am Helmut from Roewenburg."
  npc_override_prt_castle_quests_morocc_i_am_just_fed_up_b4ebda: "I am just fed up with you. Even a jerk like you is a candidate for king? I feel sick and nauseated about this king succession."
  npc_override_prt_castle_quests_morocc_i_am_messenger_royal_cou_02eada: "I am a messenger from the Royal court, sent to find a reliable adventurer. This is all about the very important issues of our nation."
  npc_override_prt_castle_quests_morocc_i_am_messenger_rune_midg_295536: "I am a messenger of Rune-Midgarts."
  npc_override_prt_castle_quests_morocc_i_am_mission_now_i_e54bf7: "I am on a mission now. I think you may be looking for a different location. Ask others."
  npc_override_prt_castle_quests_morocc_i_am_peter_family_heine_6e03a9: "I am Peter, from the family of Heine. I am glad to meet you."
  npc_override_prt_castle_quests_morocc_i_am_prince_if_you_ecc680: "I am the prince; if you grumble, you become prince! I feel tiresome with this kind of questioning."
  npc_override_prt_castle_quests_morocc_i_am_prince_richard_fami_01b9ee: "I am the prince of the Richard family. Remember me, and be my supporter..."
  npc_override_prt_castle_quests_morocc_i_am_real_penance_right_bbac6e: "I am in real penance right now!"
  npc_override_prt_castle_quests_morocc_i_am_sensitive_i_think_334f61: "But I am not sensitive to that, and I think a good king should neglect those trifles."
  npc_override_prt_castle_quests_morocc_i_am_servant_prince_helm_d457e0: "I am the servant of Prince Helmut..."
  npc_override_prt_castle_quests_morocc_i_am_so_sorry_2cf9fd: "I... am so, sorry!"
  npc_override_prt_castle_quests_morocc_i_am_trying_swear_words_031c68: "...I am not trying to be, but swear words don't make me feel very good. What's wrong with you all of a sudden?"
  npc_override_prt_castle_quests_morocc_i_am_very_sorry_i_93d03b: "I am very sorry, but I want to be left alone. Leave me alone, right now!"
  npc_override_prt_castle_quests_morocc_i_answer_your_questions_1beccc: "I will answer your questions first."
  npc_override_prt_castle_quests_morocc_i_apologize_my_redundant_c5e209: "I apologize for my redundant words, hahaha."
  npc_override_prt_castle_quests_morocc_i_back_later_b4c132: "I will be back later."
  npc_override_prt_castle_quests_morocc_i_became_timid_gradually_79f05a: "I became timid, gradually, in phases. I feel awe from men and women both, regardless of sexuality."
  npc_override_prt_castle_quests_morocc_i_been_acting_brother_ki_a71d0f: "I have been acting for Brother and Kingdom, and I will be the same ever after."
  npc_override_prt_castle_quests_morocc_i_believe_ahrum_restored_d09f7b: "I believe Ahrum will be restored as he was. However, I don't feel good."
  npc_override_prt_castle_quests_morocc_i_cannot_accept_never_ne_88a0fb: "I cannot accept it. Never. Never!"
  npc_override_prt_castle_quests_morocc_i_cannot_cover_anymore_e_9d78c8: "I cannot... cover it anymore... Ern... I hope even you..."
  npc_override_prt_castle_quests_morocc_i_cannot_qualification_i_5606f9: "I cannot have that qualification. I was raised in such a dirty place. I was so ignorant!"
  npc_override_prt_castle_quests_morocc_i_could_hear_ahrum_s_ee3d29: "- I could hear Ahrum's voice "
  npc_override_prt_castle_quests_morocc_i_could_know_about_you_35fb04: "I could know about you with shown cards, very well, but let me share my hidden card this time! Ask me whatever you want to know."
  npc_override_prt_castle_quests_morocc_i_d_like_ask_about_fe0460: "I'd like to ask about..."
  npc_override_prt_castle_quests_morocc_i_don_t_care_what_60118d: "I don't care what it is!"
  npc_override_prt_castle_quests_morocc_i_don_t_give_importance_d0f14e: "I don't give it importance at all, so I can't remember it clearly..."
  npc_override_prt_castle_quests_morocc_i_don_t_know_how_67c27d: "I don't know how others react but, I feel very uptight with your question. I shouldn't, but, I don't have a different view!"
  npc_override_prt_castle_quests_morocc_i_don_t_know_king_7c6589: "I... don't know! King... you!"
  npc_override_prt_castle_quests_morocc_i_don_t_know_what_7432e8: "...I don't know what you are talking about, but meaningless things do not exist. I don't think you know about that."
  npc_override_prt_castle_quests_morocc_i_don_t_quality_af60ce: "I don't have quality!!"
  npc_override_prt_castle_quests_morocc_i_don_t_think_439787: "I don't think"
  npc_override_prt_castle_quests_morocc_i_don_t_think_i_58cba2: "I don't think I have the proper expression for you... I don't think I have something special to say about him to you. You can just appraise him as you see him..."
  npc_override_prt_castle_quests_morocc_i_don_t_think_you_1312e5: "I don't think you are"
  npc_override_prt_castle_quests_morocc_i_don_t_think_you_98b5e0: "I don't think you deserve"
  npc_override_prt_castle_quests_morocc_i_don_t_think_you_da1ae6: "I don't think you are eligible"
  npc_override_prt_castle_quests_morocc_i_don_t_want_bothered_873ee7: "I don't want to be bothered by my family."
