  npc_override_prt_castle_quests_morocc_i_also_love_talk_ahrum_01883a: "And I also love to talk with Ahrum. Ahrum is clever enough to generate new ideas that I can follow."
  npc_override_prt_castle_quests_morocc_i_am_as_i_usually_b13322: "I am as I usually am, Ernst. Just, reality is dirty, and I realized that I am trapped in the crap. I can't get out of here."
