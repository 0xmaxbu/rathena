  npc_override_prt_castle_quests_morocc_how_absurd_you_ask_i_6ec904: "How absurd that you ask that!! I already told you clearly that King Tristan died of illness, didn't I?"
  npc_override_prt_castle_quests_morocc_how_could_you_appear_so_e5a065: "How could you appear so suddenly? Ern and I were in the middle of conversation."
