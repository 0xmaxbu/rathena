Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@face_FacewormsNest_anyway_we_got_married_wh_5c0728: "Anyway, we got married when we became old enough to marry. He used to say sorry for not being able to afford to buy a ring for me."
  npc_override_1@face_FacewormsNest_anyways_i_activate_passa_34156c: "Anyways, I can activate the passage for you if you're a party leader."
  npc_override_1@face_FacewormsNest_been_years_since_we_marr_adf430: "It has been 40 years since we were married and he still says ^0000ff'Darling~ Do you want to have a ring?'^000000."
  npc_override_1@face_FacewormsNest_best_time_belongs_advent_600059: "Best time belongs to adventurer ^ff0044{0}^000000{1}."
  npc_override_1@face_FacewormsNest_big_one_just_right_befor_6ed6cd: "The big one, just right before..."
  npc_override_1@face_FacewormsNest_big_one_just_right_befor_f17c34: "The big one just right before we saw is a boss here?"
  npc_override_1@face_FacewormsNest_bracelet_keaton_ab181d: "It is the bracelet of Keaton!!^000000"
  npc_override_1@face_FacewormsNest_canyon_i_am_feeling_good_1eeea2: "This canyon. I am not feeling good here. I don't want to stay anymore."
  npc_override_1@face_FacewormsNest_chaos_good_friend_even_t_30c390: "Chaos is a good friend even though he's only able to use Magnum Break..."
  npc_override_1@face_FacewormsNest_crack_time_safe_enough_p_1ea063: "The crack in time is not safe enough to pass back and forth. Please come back again if the after effect timer has passed."
  npc_override_1@face_FacewormsNest_current_record_time_260e3a: "Current record time is ^0000ff{0}^000000."
  npc_override_1@face_FacewormsNest_dangerous_hehehe_a0a1b3: "That was dangerous. Hehehe..."
  npc_override_1@face_FacewormsNest_dol_seoi_standing_absent_5145bd: "Dol-Seoi is standing absent-mindedly clutching the Old Pill. Let's leave him alone now."
  npc_override_1@face_FacewormsNest_faceworm_12be62: "Faceworm?"
  npc_override_1@face_FacewormsNest_faceworm_i_ve_never_hear_9d7c81: "Faceworm? I've never heard about it."
  npc_override_1@face_FacewormsNest_faceworm_s_nest_records_8e1679: "-- Faceworm's Nest Records --"
  npc_override_1@face_FacewormsNest_fortune_fame_important_m_08d03e: "Fortune or fame is not important. The most important thing is family."
  npc_override_1@face_FacewormsNest_gentle_energy_surrounds_6a6a94: "^0000ffA gentle energy surrounds Sergio.^000000"
  npc_override_1@face_FacewormsNest_he_begins_weep_like_woun_27a41f: "^0000ffHe begins to weep like a wounded Muka. She must have meant a lot to him...^000000"
  npc_override_1@face_FacewormsNest_he_had_came_back_since_30234a: "He had not came back since he left home to buy a ring."
  npc_override_1@face_FacewormsNest_hew_puddle_weird_85ff83: "Hew. This puddle is weird."
  npc_override_1@face_FacewormsNest_hmm_you_pretty_good_i_1d4d27: "Hmm.. You are pretty good, I am impressed."
  npc_override_1@face_FacewormsNest_i_am_researching_dimensi_be3d49: "I am researching the dimensional cracks in space here."
  npc_override_1@face_FacewormsNest_i_am_still_living_memory_b452a4: "I am still living in the memory. Make more memories..."
  npc_override_1@face_FacewormsNest_i_blurry_memory_when_i_150cf7: "I have a blurry memory of when I used to travel with my father's armed-merchant group."
  npc_override_1@face_FacewormsNest_i_feel_gentle_energy_aro_a421f8: "^0000ffI feel gentle energy around Dol-Seoi.^000000"
  npc_override_1@face_FacewormsNest_i_had_lost_my_family_e8905f: "I had lost my family at that time. I do not clearly remember even their faces."
  npc_override_1@face_FacewormsNest_i_just_stopped_town_poss_cb8b0d: "I just stopped by this town to possibly find a record of my family and the armed-merchant group but so far I've found nothing."
  npc_override_1@face_FacewormsNest_i_killed_snake_bb0306: "I killed a snake..."
  npc_override_1@face_FacewormsNest_i_know_what_about_i_e03152: "I do not know what this is about, but I'm talking to your leader so please wait for a while ok?"
  npc_override_1@face_FacewormsNest_i_searched_everywhere_no_c5ca05: "I searched everywhere but no one could get that pill for me so eventually my lady passed away. If it wasn't for that slithering..."
  npc_override_1@face_FacewormsNest_i_should_stopped_him_i_13dbea: "I should have stopped him. I still remember his face early."
  npc_override_1@face_FacewormsNest_i_told_him_what_good_a7707e: "I told him.. What good is a ring for an old lady?"
  npc_override_1@face_FacewormsNest_i_used_get_pill_group_39edb7: "I used to get the pill from a group of armed-merchants but I heard that they were attacked by a snake and that's when I couldn't get any more pills."
  npc_override_1@face_FacewormsNest_i_used_servant_very_weal_867d4a: "I used to be a servant to a very wealthy lady. She was always kind to me but she suffered from a severe cough that wouldn't go away unless she took a special pill."
  npc_override_1@face_FacewormsNest_i_used_tease_his_peco_4bbb9b: "I used to tease his Peco Peco and wanted him to notice that I was interested. This went on and on for a while."
  npc_override_1@face_FacewormsNest_i_vaguely_remember_every_4e916c: "I vaguely remember everyone of the group were scattered after being attacked by a giant snake-like creature."
  npc_override_1@face_FacewormsNest_jeum_sun_my_darling_flow_bba5ff: "[Jeum-sun, my darling flower]^000000"
  npc_override_1@face_FacewormsNest_keaton_56d3cb: "^999999[Keaton]"
  npc_override_1@face_FacewormsNest_keaton_died_long_time_ag_06a236: "Keaton has died long time ago. Keaton is not bad.^000000"
  npc_override_1@face_FacewormsNest_keaton_glad_defeat_bad_s_2a6124: "Keaton...glad. Defeat bad snake!!^000000"
  npc_override_1@face_FacewormsNest_keaton_go_after_snake_fi_7d99dc: "Keaton, will go after a snake to find a bracelet. The bad snake killed keaton.^000000"
  npc_override_1@face_FacewormsNest_keaton_good_speaking_fdef65: "Keaton... Not good at speaking.^000000"
  npc_override_1@face_FacewormsNest_keaton_need_bracelet_imp_4e742e: "Keaton... Need bracelet, that is important. Keaton's friend gave the bracelet.^000000"
  npc_override_1@face_FacewormsNest_keaton_s_soul_seems_smil_b6acf0: "Keaton's soul seems to be smiling. Best to give him whatever peace he can have for now."
  npc_override_1@face_FacewormsNest_keaton_seems_shine_brigh_a07e8b: "^0000ffKeaton seems to shine brighter.^000000"
  npc_override_1@face_FacewormsNest_keaton_very_sad_maybe_be_0b99bf: "Keaton is very sad maybe it is because the bracelet was broken. Bring him any other Rusty Bracelets found in the Faceworm's Nest."
  npc_override_1@face_FacewormsNest_lady_keeps_crying_over_o_dafd47: "The lady keeps crying over and over holding a ring. It seems to be no use talking to her right now."
  npc_override_1@face_FacewormsNest_lady_read_inscription_in_1248a6: "^0000ffThe lady read an inscription inside the ring and started weeping."
  npc_override_1@face_FacewormsNest_looks_like_dead_soul_you_2033e9: "^0000ffIt looks like a dead soul but you don't feel maliciousness from it. His thoughts have been delivered piece by piece so it isn't easy to understand.^000000"
  npc_override_1@face_FacewormsNest_menu_cancel_b77347: "Cancel:1st Stage Start:2nd Stage Start:3rd Stage Start:4th Stage Start:Boss Start:Treasures"
  npc_override_1@face_FacewormsNest_menu_cancel_f66b59: "Cancel:1st Boss:2nd Boss:3rd Boss:4th Boss:Final Boss"
  npc_override_1@face_FacewormsNest_menu_reserve_edb23e: "Reserve Faceworm's Nest:What are you doing here?:Stop Talking."
  npc_override_1@face_FacewormsNest_menu_stop_130240: "Stop talking.:Show him the Rusty Bracelet."
  npc_override_1@face_FacewormsNest_menu_stop_44b0a7: "Stop talking.:Show him the Old Pill."
  npc_override_1@face_FacewormsNest_menu_stop_c9c361: "Stop talking.:Show him the Old Photo Album"
  npc_override_1@face_FacewormsNest_menu_stop_cb9dd8: "Stop talking.:Show the ring from the Faceworm's Nest."
  npc_override_1@face_FacewormsNest_menu_stop_d9c239: "Stop:Return to Dimensional Gap"
  npc_override_1@face_FacewormsNest_msg_61ce5a: "[{0}]"
  npc_override_1@face_FacewormsNest_msg_6eae3a: "..."
  npc_override_1@face_FacewormsNest_my_research_stabilize_sp_22d99c: "My research is to stabilize the space here with magic to utilize it for dimensional travel."
  npc_override_1@face_FacewormsNest_no_i_think_you_re_0b24b5: "No! I think you're mistaken! We are not bounty hunters..."
  npc_override_1@face_FacewormsNest_no_no_need_make_excuse_e48aba: "No, No need to make an excuse... The faceworm belongs to nobody."
  npc_override_1@face_FacewormsNest_no_party_please_come_bac_e15385: "No party? Please come back again after creating a party even if you've come alone."
  npc_override_1@face_FacewormsNest_no_t_faceworm_queen_30519e: "No~~ It can't be the faceworm queen."
  npc_override_1@face_FacewormsNest_now_i_ve_made_my_2d085d: "Now I've made my own armed-merchant group and got my life back. But the memory of my past keeps haunting me."
  npc_override_1@face_FacewormsNest_oh_darling_5fa243: "Oh... Darling~"
  npc_override_1@face_FacewormsNest_oh_my_there_other_pictur_aa2810: "Oh my... There are other pictures here too..."
  npc_override_1@face_FacewormsNest_oh_you_level_yet_i_c5d93c: "Oh are you level 140 yet? I won't talk to any weak adventurers."
  npc_override_1@face_FacewormsNest_okay_i_got_please_come_06f00b: "Okay, I got it. Please come back again if you change your mind."
  npc_override_1@face_FacewormsNest_old_lady_turned_her_face_f1bb23: "^0000ffThe old lady turned her face down with reddened eyes.^000000"
  npc_override_1@face_FacewormsNest_oops_my_hands_slip_off_b3787b: "Oops, my hands are slip off. It is required to activate the craks again."
  npc_override_1@face_FacewormsNest_particular_crack_space_g_3b3bf2: "This particular crack in space goes to a memory of the past. Many adventurers have been in there but no one will tell me what is in there..."
  npc_override_1@face_FacewormsNest_passage_space_travel_act_d95922: "The passage for space travel is not activated yet."
  npc_override_1@face_FacewormsNest_pill_my_lady_if_i_06713d: "This pill... My lady, if I had this pill..."
  npc_override_1@face_FacewormsNest_please_wait_minute_308721: "Please wait for a minute."
  npc_override_1@face_FacewormsNest_really_i_didn_t_know_b299e1: "Really? I didn't know that a bounty hunter was coming here."
  npc_override_1@face_FacewormsNest_sadly_woman_seem_remembe_2cbd29: "Sadly, this woman does not seem to remember the past because of abrupt emotional changes. Let's talk carefully and listen to her story."
  npc_override_1@face_FacewormsNest_sergio_keeps_looking_pho_520f8b: "Sergio keeps looking at the photo album. Let's leave him alone."
  npc_override_1@face_FacewormsNest_smile_lonely_satisfactio_6fe82f: "^0000ffA smile of lonely satisfaction spreads over the face of Sergio while looking at a photo album.^000000"
  npc_override_1@face_FacewormsNest_something_seems_fishy_ar_e203ef: "Something seems fishy around here. It's dangerous."
  npc_override_1@face_FacewormsNest_sorry_i_enjoy_gentle_bre_bd23eb: "Sorry~ I enjoy a gentle breeze so talk to me next time."
  npc_override_1@face_FacewormsNest_spaces_under_control_39ff8b: "The spaces are under control."
  npc_override_1@face_FacewormsNest_then_we_started_dating_s_9de86f: "Then we started dating somehow. It's still embarrasing to talk about it."
  npc_override_1@face_FacewormsNest_there_s_no_sign_because_b8e59d: "There's no sign because no one updates the record."
  npc_override_1@face_FacewormsNest_there_s_strange_sign_her_7797d8: "And there's this strange sign here that records names and times on it which I can only assume belongs to those adventurers."
  npc_override_1@face_FacewormsNest_trace_dimensional_space_25a152: "^0000ffThe trace of dimensional space travelling has disappeared. You can now move between dimensions.^000000"
  npc_override_1@face_FacewormsNest_traces_recent_space_trav_e9b409: "Traces of recent space travel have been detected. Access is denied."
  npc_override_1@face_FacewormsNest_unknown_error_occurred_58bda4: "An unknown error has occurred."
  npc_override_1@face_FacewormsNest_unless_you_re_level_i_6535dd: "Unless you're level 140, I won't have a real conversation with you."
  npc_override_1@face_FacewormsNest_wait_s_misunderstanding_dfbf35: "Wait! It's a misunderstanding."
  npc_override_1@face_FacewormsNest_wait_where_did_you_get_5e056d: "Wait! Where did you get this?"
  npc_override_1@face_FacewormsNest_warm_energy_inspired_you_6727af: "The warm energy has inspired you with strength."
  npc_override_1@face_FacewormsNest_well_7b1901: "Well..."
  npc_override_1@face_FacewormsNest_what_about_ring_217e73: "What about this ring?"
  npc_override_1@face_FacewormsNest_what_happened_him_8ff970: "What happened to him?"
  npc_override_1@face_FacewormsNest_what_i_you_3d61cf: "What can I do for you?"
  npc_override_1@face_FacewormsNest_what_time_you_like_retur_9b0a6a: "What time would you like to return?"
  npc_override_1@face_FacewormsNest_when_i_young_girl_many_eed521: "When I was a young girl many years ago there was a man who I had crush on. I didn't know to tell him how I felt..."
  npc_override_1@face_FacewormsNest_wow_you_re_fast_enough_29f9a0: "Wow, you're fast enough to follow me."
  npc_override_1@face_FacewormsNest_yes_i_nothing_snake_i_0a7c55: "Yes... But, I have nothing to do with that snake. I am just a worthless servant who once served for my lady."
  npc_override_1@face_FacewormsNest_yes_i_remembered_one_who_326eaa: "Yes! I remembered. This is the one who used to work for my father's armed-merchant group."
  npc_override_1@face_FacewormsNest_you_allowed_access_devic_59b39c: "You are not allowed to access the device."
  npc_override_1@face_FacewormsNest_you_catch_glimpse_compli_7ab515: "^0000ffYou catch a glimpse of complicated rage and sorrow in his eyes.^000000"
  npc_override_1@face_FacewormsNest_you_don_t_party_please_0b3764: "You don't have a party? Please come back again after creating a party even if you've come alone."
  npc_override_1@face_FacewormsNest_you_least_level_yet_c686d5: "Are you at least level 140 yet?"
  npc_override_1@face_FacewormsNest_you_qualified_enough_ent_86aff3: "You are not qualified enough to enter here. How about visiting other places until you become level 140."
  npc_override_1@face_FacewormsNest_you_re_pretty_good_you_58728e: "You're pretty good! But you have to be careful from now on. This narrow canyon seems to be full of dangers."
  npc_override_1@face_FacewormsNest_you_sense_warm_energy_em_2e15ae: "^0000ffYou sense a warm energy emanating. Maybe this is the wish of the man who made this ring.^000000"
  npc_override_1@face_FacewormsNest_you_talk_dol_seoi_again_b77ae5: "You can talk to Dol-Seoi again if you get another Old Pill from the Faceworm's Nest."
  npc_override_1@face_FacewormsNest_you_talk_sergio_again_wh_7368cd: "You can talk to Sergio again when you pick up a new photo album from the Faceworm's Nest."
  npc_override_1@face_FacewormsNest_you_too_many_kind_belong_123624: "You have too many kind of belongings. Let's try again after reducing the kind of items."
  npc_override_1@face_FacewormsNest_you_too_many_types_belon_037d7c: "You have too many types of belongings. Let's try again after reducing the types of items."
  npc_override_1@face_FacewormsNest_you_touched_seeing_satis_eb3be7: "You are touched by seeing the satisfaction on Sergio's face."
  npc_override_1@face_FacewormsNest_you_want_revenge_296b5e: "Do you want to revenge?"
  npc_override_1@face_FacewormsNest_your_belongings_too_heav_c257d5: "Your belongings are too heavy to continue. Let's try again after reducing the weight."
  npc_override_1@face_FacewormsNest_your_power_level_high_en_fd7372: "Your power level is not high enough to travel the space. Please come back again when you reach at least level 140."
  npc_override_1@face_FacewormsNest_your_time_finished_here_5cec03: "Your time is finished here. You may look arround or go leave. What do you want to do?"
