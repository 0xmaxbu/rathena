Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_lhz_dun_n_lhz_dun_n_menu_voice_0bb034: "Voice of Reaper: See you soon."
  npc_override_lhz_dun_n_lhz_dun_n_menu_voice_2f0736: "Voice of Reaper: It's been a while."
  npc_override_lhz_dun_n_nightmare_biolab_aargh_ah_urgh_e53c68: "Aargh... Ah... Urgh..."
  npc_override_lhz_dun_n_nightmare_biolab_acquire_energy_fragments_8792eb: "Acquire Energy Fragments."
  npc_override_lhz_dun_n_nightmare_biolab_additional_aspd_when_you_5f2c56: "(Additional ASPD + 1 when your character's refinement level reaches 10.)"
  npc_override_lhz_dun_n_nightmare_biolab_additional_atk_per_each_4c3f8a: "(Additional ATK + 2 per each refinement level increase)"
  npc_override_lhz_dun_n_nightmare_biolab_additional_matk_per_each_f9aa07: "(Additional MATK + 3 per each refinement level increase)"
  npc_override_lhz_dun_n_nightmare_biolab_additional_per_each_refi_1c5c74: "(Additional 1% per each refinement level increase)"
  npc_override_lhz_dun_n_nightmare_biolab_additional_per_refinemen_d6d6b4: "(Additional 1% per 2 refinement level increase)"
  npc_override_lhz_dun_n_nightmare_biolab_additional_when_refineme_b087ea: "Additional 4% when refinement level reaches 10)"
  npc_override_lhz_dun_n_nightmare_biolab_additional_when_refineme_d903e2: "(Additional 3% when refinement level reaches 8,"
  npc_override_lhz_dun_n_nightmare_biolab_after_many_adventurers_e_d1ab69: "After that, many adventurers entered this dangerous place through this crevice after hearing the rumor. I hardly found any adventurers coming out of this crevice again. Since then, this place has been called the tomb of honor."
  npc_override_lhz_dun_n_nightmare_biolab_after_such_terrible_thin_a1bb7e: "After such... a terrible thing.. you... did"
  npc_override_lhz_dun_n_nightmare_biolab_all_enchantments_applied_e8e1e2: "All enchantments applied to the helmet, except for the smelting level of equipment and 1 slot card, will be reset.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_all_personnel_should_act_848fd1: "All personnel should act in accordance with the emergency rules."
  npc_override_lhz_dun_n_nightmare_biolab_all_state_dab934: "^006400All State + 1^000000"
  npc_override_lhz_dun_n_nightmare_biolab_all_state_mdef_61e9fb: "^006400All State + 1 MDEF+ 5.^000000"
  npc_override_lhz_dun_n_nightmare_biolab_all_state_mdef_8ea17c: "^006400All State + 1 MDEF+ 5^000000"
  npc_override_lhz_dun_n_nightmare_biolab_all_state_mdef_c39e36: "^006400All State + 1, MDEF+ 5^000000"
  npc_override_lhz_dun_n_nightmare_biolab_alright_now_i_received_z_422924: "Alright. Now that I received the Zeny, I'll open the crevice."
  npc_override_lhz_dun_n_nightmare_biolab_aren_t_you_afraid_god_c8148e: "Aren't... you afraid of... God's... wrath?..."
  npc_override_lhz_dun_n_nightmare_biolab_as_you_know_equipment_re_36e2ef: "As you know, this equipment requires a large amount of material, so all guild members had no choice but to be stuck in the dungeon and forced to work."
  npc_override_lhz_dun_n_nightmare_biolab_ask_him_about_tomb_honor_08caef: "Ask him about the tomb of honor."
  npc_override_lhz_dun_n_nightmare_biolab_aspd_per_refinement_leve_961905: "^006400ASPD + 1 per 5 refinement level increase^000000"
  npc_override_lhz_dun_n_nightmare_biolab_atk_cri_per_each_refinem_636dc9: "^006400ATK + 4, CRI + 2 per each refinement level increase.^000000"
  npc_override_lhz_dun_n_nightmare_biolab_atk_matk_per_each_refine_72ec96: "^006400ATK + 4, MATK + 4 per each refinement level increase.^000000"
  npc_override_lhz_dun_n_nightmare_biolab_atk_per_refinement_level_e478fe: "^006400ATK + 4 per 1 refinement level increase^000000"
  npc_override_lhz_dun_n_nightmare_biolab_atk_when_your_character_c70638: "ATK + 10 when your character's pure STR reaches 90."
  npc_override_lhz_dun_n_nightmare_biolab_attack_delay_additionall_9afb00: "(Attack delay additionally decreased by 1% per 2 refinement level increase)"
  npc_override_lhz_dun_n_nightmare_biolab_attempts_enchantment_nd_2c443a: "^FF0000*Attempts enchantment to 2nd slot."
  npc_override_lhz_dun_n_nightmare_biolab_attempts_enchantment_rd_2a05fc: "^FF0000*Attempts enchantment to 3rd slot. One of 6 statuses is randomly enchanted.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_attempts_enchantment_th_baecd1: "^FF0000*Attempts enchantment to 4th slot. One of 6 statuses is randomly enchanted.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_axe_mace_book_ad7c62: "Axe, Mace, Book"
  npc_override_lhz_dun_n_nightmare_biolab_bow_a17942: "Bow"
  npc_override_lhz_dun_n_nightmare_biolab_bring_their_wandering_ve_164996: "Bring their... wandering {0}, {1}... the vessel to hold the soul and... the dark energy... filling up this place..."
  npc_override_lhz_dun_n_nightmare_biolab_check_amount_cursed_frag_bcf2e3: "Check the amount of Cursed Fragments you possess.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_check_amount_sentimental_1add07: "Check the amount of Sentimental Fragments that you possess.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_complete_evasion_per_ref_5f53a2: "^006400Complete evasion +1 per 3 refinement level increase.^000000"
  npc_override_lhz_dun_n_nightmare_biolab_congratulation_you_ve_su_75a767: "^FF0000*Congratulation. You've succeeded in enchantment.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_continue_exchange_b11f22: "Continue with the exchange."
  npc_override_lhz_dun_n_nightmare_biolab_countless_subjects_minds_6a48e8: "Countless... subjects'... minds..."
  npc_override_lhz_dun_n_nightmare_biolab_course_amount_exchange_d_cd0200: "Of course, the amount of exchange was decided by the guild master emphasizing"
  npc_override_lhz_dun_n_nightmare_biolab_current_required_cool_do_6a9939: "... Current... Required... Cool.. Down..Time.."
  npc_override_lhz_dun_n_nightmare_biolab_cursed_fragments_needed_8444f4: "Cursed... Fragments...{0} are... needed... I wonder... whether... you can afford... them?... kk... kk..."
  npc_override_lhz_dun_n_nightmare_biolab_dear_odin_fd743e: "Dear Odin..."
  npc_override_lhz_dun_n_nightmare_biolab_destroy_destroy_e40340: "Destroy it... Destroy it..."
  npc_override_lhz_dun_n_nightmare_biolab_disagree_6d1d82: "Disagree with it."
  npc_override_lhz_dun_n_nightmare_biolab_don_t_ask_me_why_ec632b: "Don't ask me why I need it. Just bring me 10 research charts. Then, I'll send you to the tomb of honor for nothing. What you do think?"
  npc_override_lhz_dun_n_nightmare_biolab_don_t_exit_dungeon_1a9670: "Don't exit the dungeon."
  npc_override_lhz_dun_n_nightmare_biolab_don_t_go_back_0c0e74: "Don't go back."
  npc_override_lhz_dun_n_nightmare_biolab_due_enchantment_failure_134662: "^FF0000*Due to enchantment failure, it has been downgraded one level down.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_emergency_protocol_activ_1c40f8: "Emergency Protocol activated. The user will be able to run RT-223."
  npc_override_lhz_dun_n_nightmare_biolab_emergency_protocol_activ_ba4a9e: "Emergency Protocol... Activated.. to.. RT..017... Cooldown... 1 hour......"
  npc_override_lhz_dun_n_nightmare_biolab_enchantment_cursed_fragm_5d8ed0: "^FF0000*In enchantment, Cursed Fragment(s) 10 item(s) is(are) required."
  npc_override_lhz_dun_n_nightmare_biolab_enchantment_cursed_fragm_fd7b2f: "^FF0000*In enchantment, {0} Cursed Fragment(s) is(are) required.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_enchantment_proceeded_or_d25771: "^FF0000*Enchantment is proceeded in the order of 4, 3, 2 slots. You need 10 Cursed Fragments when you enchant each slot for the first time.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_enchantment_using_cursed_6187cc: "^FF0000*Enchantment using Cursed Fragments is only possible in the Old Helmet.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_enchantment_using_cursed_ebf150: "^FF0000*Enchantment using Cursed Fragment is only possible in the Old Helmet.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_end_conversation_a707c7: "End the conversation."
  npc_override_lhz_dun_n_nightmare_biolab_equipment_smelting_level_fb2a19: "^FF0000*Equipment smelting level, card, equipment loss doesn't occur. However, the enchantment level may be downgraded, depending on the success or failure.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_even_after_i_die_my_e8fcf9: "Even after I die... or in my dream..."
  npc_override_lhz_dun_n_nightmare_biolab_exchange_192dee: "Do not exchange."
  npc_override_lhz_dun_n_nightmare_biolab_exchange_5dfc87: "Exchange."
  npc_override_lhz_dun_n_nightmare_biolab_exchanged_energy_pieces_005df3: "^3300661 {0}^000000 is exchanged with ^CC3333{1} Energy Pieces^000000."
  npc_override_lhz_dun_n_nightmare_biolab_exit_dungeon_d81b25: "Exit the dungeon."
  npc_override_lhz_dun_n_nightmare_biolab_exit_outside_wall_43c460: "The exit is outside of the wall."
  npc_override_lhz_dun_n_nightmare_biolab_failed_a4a158: "^006400{0}^000000... failed..."
  npc_override_lhz_dun_n_nightmare_biolab_filled_e10291: "is filled..."
  npc_override_lhz_dun_n_nightmare_biolab_fine_i_ll_reset_enchantm_a75708: "Fine!... I'll... reset... the enchantment... of the old helmet... I think... we may be able to absorb... a strong mind..."
  npc_override_lhz_dun_n_nightmare_biolab_forever_5513fd: "Forever..."
  npc_override_lhz_dun_n_nightmare_biolab_go_back_lighthalzen_36175a: "Go back to Lighthalzen."
  npc_override_lhz_dun_n_nightmare_biolab_go_back_previous_menu_6438b6: "Go back to the previous menu."
  npc_override_lhz_dun_n_nightmare_biolab_go_back_previous_menu_b7a464: "Go back to previous menu."
  npc_override_lhz_dun_n_nightmare_biolab_go_hell_all_you_9799f6: "Go to hell...all of you..."
  npc_override_lhz_dun_n_nightmare_biolab_god_protect_you_if_you_df18ac: "God... will protect... you... if you... repent... your sin... just now..."
  npc_override_lhz_dun_n_nightmare_biolab_good_you_everything_i_ll_7b87a1: "Good. You have everything. I'll take you there."
  npc_override_lhz_dun_n_nightmare_biolab_hand_over_grudge_grudge_48832c: "Hand over... grudge... grudge..."
  npc_override_lhz_dun_n_nightmare_biolab_hand_over_research_chart_01908d: "Hand over 10 research charts."
  npc_override_lhz_dun_n_nightmare_biolab_hand_over_soul_142282: "Hand over the soul."
  npc_override_lhz_dun_n_nightmare_biolab_hand_over_weapon_d298f8: "Hand over the weapon."
  npc_override_lhz_dun_n_nightmare_biolab_he_kept_asking_me_show_3738d8: "He kept asking me to show him how to get there. I felt reluctant to let him know about this crevice because I didn't want others to know about it. But I traded this info for 100,000 Zeny."
  npc_override_lhz_dun_n_nightmare_biolab_he_kept_muttering_himsel_d49826: "He kept muttering to himself about biomedical research, labs something like that."
  npc_override_lhz_dun_n_nightmare_biolab_hello_anyone_there_0323fb: "Hello... Is anyone there...?"
  npc_override_lhz_dun_n_nightmare_biolab_helmet_enchanted_so_cann_f7192e: "^FF0000*This helmet is not enchanted, so it cannot be reset.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_here_a2cac1: "Here is... ^006400{0}^000000..."
  npc_override_lhz_dun_n_nightmare_biolab_hey_buddy_you_some_remai_1f1e81: "Hey, buddy. Do you have some remaining Energy pieces? I'll exchange them with something appropriate if you want."
  npc_override_lhz_dun_n_nightmare_biolab_hmm_hmm_anyway_give_me_3ff700: "Hmm hmm... Anyway, give me 100,000 Zeny. Then, I'll open the door which leads to the crevice for adventurers like you..."
  npc_override_lhz_dun_n_nightmare_biolab_hmm_hmm_d58a5e: "hmm... hmm..."
  npc_override_lhz_dun_n_nightmare_biolab_hmm_quite_unexpected_36986f: "Hmm... this is quite unexpected."
  npc_override_lhz_dun_n_nightmare_biolab_hmm_then_any_chance_you_e3d590: "Hmm... Then... by any chance, you have a research chart?"
  npc_override_lhz_dun_n_nightmare_biolab_how_about_we_begin_light_494f48: "How about... we begin... lightly?... Test... your luck... Kr..hehe..."
  npc_override_lhz_dun_n_nightmare_biolab_how_you_0a52f0: "How... would... you do it?"
  npc_override_lhz_dun_n_nightmare_biolab_however_before_happens_i_ccc387: "However...before that happens... I need to check... whether or not you have... sufficient Cursed Fragments... "
  npc_override_lhz_dun_n_nightmare_biolab_however_he_holding_sever_4b4cc6: "However, he was holding several items. At first glance, they looked so powerful that even I felt scared."
  npc_override_lhz_dun_n_nightmare_biolab_hush_speak_quietly_peopl_f4c8aa: "Hush, speak quietly. People around here may hear us. Do you have it or not?"
  npc_override_lhz_dun_n_nightmare_biolab_i_am_so_scared_scared_9b2a13: "I am so scared....scared...."
  npc_override_lhz_dun_n_nightmare_biolab_i_am_sorry_i_leave_071b30: "I am sorry... I will leave now... thank you..."
  npc_override_lhz_dun_n_nightmare_biolab_i_asked_collect_some_kin_d3ae6c: "I was asked to collect some kind of research charts..."
  npc_override_lhz_dun_n_nightmare_biolab_i_don_t_get_why_e61d2f: "I don't get it. Why...me?..."
  npc_override_lhz_dun_n_nightmare_biolab_i_don_t_mind_0fbc5a: "I don't mind."
  npc_override_lhz_dun_n_nightmare_biolab_i_don_t_much_time_7d51d5: "I... don't have much time left... to stay here."
  npc_override_lhz_dun_n_nightmare_biolab_i_dug_ground_find_someth_988d0a: "I dug in the ground to find something to eat and I found something even better."
  npc_override_lhz_dun_n_nightmare_biolab_i_earned_some_money_than_8d853a: "I earned some money thanks to them, though."
  npc_override_lhz_dun_n_nightmare_biolab_i_entered_crevice_first_3f2c0c: "I entered this crevice for the first time and guess what? It led to a place where there are so many monsters swarming around."
  npc_override_lhz_dun_n_nightmare_biolab_i_found_place_first_time_8c2d12: "I found this place for the first time, so its ownership belongs to me as well! You got a problem with that?"
  npc_override_lhz_dun_n_nightmare_biolab_i_gave_heads_up_one_4a33ca: "I gave a heads up to one adventurer I know. Then, he showed a high interest in it!"
  npc_override_lhz_dun_n_nightmare_biolab_i_got_critical_damage_mi_3f59cd: "- I got critical damage - - by mind's powerful wavelength - - which seeped into my body. -"
  npc_override_lhz_dun_n_nightmare_biolab_i_got_critical_damage_mi_e5ccde: "- I got critical damage - - by the mind's powerful wavelength - - which seeped into my body. -"
  npc_override_lhz_dun_n_nightmare_biolab_i_guess_we_take_care_d63e68: "I guess we can take care of it quickly if he adjusts it to a low amount. (sigh)... That's what happened."
  npc_override_lhz_dun_n_nightmare_biolab_i_hear_somebody_talking_41d540: "- I hear somebody talking - - remote communication -"
  npc_override_lhz_dun_n_nightmare_biolab_i_hope_you_come_back_7c7b85: "I hope you can come back alive!..."
  npc_override_lhz_dun_n_nightmare_biolab_i_hoped_you_could_see_a5f6ae: "I hoped that... you could... see... other things... as well..."
  npc_override_lhz_dun_n_nightmare_biolab_i_like_exchange_blood_th_34f600: "I would like to exchange 1 Blood Thirst with 200 energy pieces."
  npc_override_lhz_dun_n_nightmare_biolab_i_like_exchange_ghost_ch_b09f10: "I would like to exchange 1 Ghost Chill with 300 energy pieces."
  npc_override_lhz_dun_n_nightmare_biolab_i_like_exchange_warrior_012c24: "I would like to exchange 1 Will of Warrior for 200 energy pieces."
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_curse_you_even_f4c94d: "I'll... curse you... even after... I die..."
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_immediately_report_cc18d7: "I'll immediately report the information related to the laboratory as a top priority."
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_make_all_members_73b9e2: "'^1F294DI'll make all members in all guilds wear the Cloak of the Fallen Soldier!!^000000'."
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_munch_you_into_cf579e: "I'll munch you... into pieces..."
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_never_accept_if_f67f7b: "'^1F294DI'll never accept it if it's below this amount!!^000000'..."
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_send_you_crevice_93a749: "I'll send you to the crevice as promised."
  npc_override_lhz_dun_n_nightmare_biolab_i_ll_wait_you_if_8aab4e: "I'll... wait for... you... If you need me to... I'll wait for you... forever... kkk..."
  npc_override_lhz_dun_n_nightmare_biolab_i_m_innocent_i_don_0addd5: "I'm innocent... I... don't deserve this..."
  npc_override_lhz_dun_n_nightmare_biolab_i_m_sorry_i_ve_a075a5: "I'm sorry, but I've got nothing to say. I'm just doing this because I can earn lots of money."
  npc_override_lhz_dun_n_nightmare_biolab_i_m_taking_you_there_4734d0: "But... I'm taking you there for money... you should be careful."
  npc_override_lhz_dun_n_nightmare_biolab_i_made_energy_fragment_r_202bbc: "I have made... Energy... Fragment... by restoring ^006400{0}^000000..."
  npc_override_lhz_dun_n_nightmare_biolab_i_need_01e666: "I need 1 {0}, {1} {2}... {3} {4}.."
  npc_override_lhz_dun_n_nightmare_biolab_i_need_grudge_s_grudge_17129b: "I need... grudge's... grudge's... strong... power... It will help... both me... and you... all... Kkk..."
  npc_override_lhz_dun_n_nightmare_biolab_i_never_forgive_you_7aa1f5: "I will never forgive you...!"
  npc_override_lhz_dun_n_nightmare_biolab_i_nothing_1b790a: "I have...nothing..."
  npc_override_lhz_dun_n_nightmare_biolab_i_ran_away_since_so_71e2ab: "I ran away since so many dead men tried to kill me."
  npc_override_lhz_dun_n_nightmare_biolab_i_send_you_there_a4ecd2: "I... will... send you there..."
  npc_override_lhz_dun_n_nightmare_biolab_i_so_scared_became_clear_59de12: "I was so scared but.. it became clear that it's a popular place for adventurers to visit."
  npc_override_lhz_dun_n_nightmare_biolab_i_take_you_there_if_21cc0d: "I can take you there if you want. You will need ^0000cd20 Sentimental Fragment and 150K Zeny^000000."
  npc_override_lhz_dun_n_nightmare_biolab_i_take_you_there_if_6801c5: "I will take you there if you give me the money and items."
  npc_override_lhz_dun_n_nightmare_biolab_i_turned_off_machine_so_490677: "I turned off the machine so no one can use it, but I'll let you use it as my special treat."
  npc_override_lhz_dun_n_nightmare_biolab_i_want_go_home_e55c4d: "I want to... go... home..."
  npc_override_lhz_dun_n_nightmare_biolab_i_want_you_alive_see_fb5132: "I want you alive. See you again!"
  npc_override_lhz_dun_n_nightmare_biolab_i_wish_you_come_back_214d87: "...I wish... you... can come back... to me again..."
  npc_override_lhz_dun_n_nightmare_biolab_if_times_s_collected_you_6224d0: "If 5 times of {0} and {1}s are collected... you... will never fail..."
  npc_override_lhz_dun_n_nightmare_biolab_if_you_bring_cursed_frag_d5d82d: "^FF0000*If you bring Cursed Fragment, you can enchant it into the Old Helmet.*^000000"
  npc_override_lhz_dun_n_nightmare_biolab_if_you_bring_grudge_s_d4cf27: "If you... bring grudge's... power... I'll... give you... great power..."
  npc_override_lhz_dun_n_nightmare_biolab_if_you_bring_one_i_ac1d23: "If you... bring... one... I'll restore... it... to energy... pieces..."
  npc_override_lhz_dun_n_nightmare_biolab_if_you_change_your_mind_af1e3f: "If you change your mind, come back to me again!"
  npc_override_lhz_dun_n_nightmare_biolab_if_you_hand_over_our_268ac7: "If you hand over... our soul...I'll make something... filled with... special powers.. using a combination..."
  npc_override_lhz_dun_n_nightmare_biolab_if_you_maybe_i_give_909d0e: "If you... can... do it... maybe... I can... give... you guys... what... you need..."
  npc_override_lhz_dun_n_nightmare_biolab_if_you_maybe_i_give_90cefc: "If you... can... do it... maybe... I can... give... you guys help..."
