Body:
  npc_override_1@lost_LostFarm_absorbs_moisture_air_pho_d4bf4c: "It absorbs moisture from the air and photosyntheses it even without the roots."
  npc_override_1@lost_LostFarm_according_luina_s_instru_2aa164: "According to Luina's instructions, what's left now is..."
  npc_override_1@lost_LostFarm_after_processing_harvest_450e4f: "After processing it, the harvested Pitaya tail goes up to the table."
  npc_override_1@lost_LostFarm_again_don_t_worry_about_12206b: "Again, don't worry about my location..."
  npc_override_1@lost_LostFarm_all_thanks_your_help_tha_d9692f: "This is all thanks to your help... Thank you so much."
  npc_override_1@lost_LostFarm_am_i_angry_guest_no_eca1cc: "Am I angry? to the guest? no..."
  npc_override_1@lost_LostFarm_anyway_help_me_next_harv_98ba58: "Anyway, help me with the next harvest! Hey, guys~ It's time to eat~~"
  npc_override_1@lost_LostFarm_as_expected_joy_comes_pr_9ed1e6: "As expected... Joy comes with a price."
  npc_override_1@lost_LostFarm_as_expected_you_talent_i_93057b: "As expected, you have a talent for this! I was right!"
  npc_override_1@lost_LostFarm_automatic_doll_i_angry_h_f7ebd5: "The automatic doll... can I be angry? ...Hmmm..."
  npc_override_1@lost_LostFarm_automatic_doll_make_joke_c59cee: "Does an automatic doll make jokes? Oh, you're pretty good at joking. I always mean it."
  npc_override_1@lost_LostFarm_big_meow_taking_nap_17436b: "-- Big meow is taking a nap. --"
  npc_override_1@lost_LostFarm_bite_well_9fbdd9: "...will bite well...?"
  npc_override_1@lost_LostFarm_boss_kitty_3d9183: "Boss Kitty?"
  npc_override_1@lost_LostFarm_boss_meow_8d1aaa: "Boss Meow?"
  npc_override_1@lost_LostFarm_boss_meow_a2920a: "Boss Meow...!"
  npc_override_1@lost_LostFarm_breathing_normal_eyes_st_2f731e: "Breathing is normal. Eyes stability normal."
  npc_override_1@lost_LostFarm_cancel_77dfd2: "Cancel"
  npc_override_1@lost_LostFarm_cat_cried_high_pitch_sou_c65858: "- The cat cried with a high pitch sound as if it's excited. -"
  npc_override_1@lost_LostFarm_cat_hid_behind_luina_bef_95f701: "-- The cat hid behind Luina before she reached it. --"
  npc_override_1@lost_LostFarm_cats_bite_you_f9ef92: "Do 'Cats' bite you?"
  npc_override_1@lost_LostFarm_checking_registration_in_7ed077: "Checking registration information..."
  npc_override_1@lost_LostFarm_cluck_ae6dd1: "Cluck...!"
  npc_override_1@lost_LostFarm_cluck_ccd0c0: "Cluck."
  npc_override_1@lost_LostFarm_come_out_now_273ced: "Come out for now."
  npc_override_1@lost_LostFarm_come_way_cece24: ".... come this way."
  npc_override_1@lost_LostFarm_croak_118a60: "*Croak*"
  npc_override_1@lost_LostFarm_dear_guest_dfccf5: "Dear guest..."
  npc_override_1@lost_LostFarm_deep_breaths_deep_breath_372b25: "Deep breaths... Deep Breaths..."
  npc_override_1@lost_LostFarm_did_you_come_see_farming_cd1800: "Did you come to see farming facility?"
  npc_override_1@lost_LostFarm_did_you_fun_b7cab0: "Did you have fun?"
  npc_override_1@lost_LostFarm_did_younglings_came_play_122c8a: "Did the younglings came to play with you?"
  npc_override_1@lost_LostFarm_doll_looked_me_up_down_5541f8: "- The doll looked at me up and down, and as if she look satisfied. -"
  npc_override_1@lost_LostFarm_doll_looked_me_up_down_d38423: "- The doll looked at me up and down, and turn its head. -"
  npc_override_1@lost_LostFarm_don_t_go_out_a54c6e: "Don't go out."
  npc_override_1@lost_LostFarm_don_t_mind_my_location_0736e8: "Don't mind my location..."
  npc_override_1@lost_LostFarm_eeek_save_me_f72bc4: "Eeek... Save me!"
  npc_override_1@lost_LostFarm_ehem_64588f: "Ehem."
  npc_override_1@lost_LostFarm_enjoy_s_cuteness_i_m_189382: "To enjoy it's cuteness, I'm ready to give my arms and legs...!"
  npc_override_1@lost_LostFarm_enjoy_s_cuteness_i_m_762ce0: "To enjoy it's cuteness, I'm ready to give it not only arms and legs but also my colleagues...!"
  npc_override_1@lost_LostFarm_enter_dungeon_ed41f4: "Enter the dungeon."
  npc_override_1@lost_LostFarm_even_if_s_right_come_789ba7: "Even if it's right to come over to play, at least not with me."
  npc_override_1@lost_LostFarm_facility_as_you_see_conv_28c3e4: "This facility... As you can see, this is a convenient breeding ground for our scaled friends."
  npc_override_1@lost_LostFarm_farming_facility_where_k_6d987f: "This is the farming facility, where Kitty and the others live."
  npc_override_1@lost_LostFarm_faster_hold_play_just_li_c03a9e: "But it would be faster to hold it and play with it just like you did, rather than petting it for 5 minutes."
  npc_override_1@lost_LostFarm_feed_hug_five_minutes_ea_2171ec: "Feed and hug for five minutes each? How do I pet them, when they keep showing their teeth?"
  npc_override_1@lost_LostFarm_go_out_0a8067: "Go out."
  npc_override_1@lost_LostFarm_growl_e3eca5: "*Growl*"
  npc_override_1@lost_LostFarm_guest_huh_3c9b72: "Guest... Huh..."
  npc_override_1@lost_LostFarm_haa_haa_i_so_scared_e60b79: "Haa, haa... I was so scared..."
  npc_override_1@lost_LostFarm_harvested_tail_necessari_9c7d23: "The harvested tail is not necessarily enough to eat."
  npc_override_1@lost_LostFarm_harvesting_actually_bit_0a1971: "Harvesting is actually a bit difficult, so my colleague, 'Silk', will guide you."
  npc_override_1@lost_LostFarm_heart_rate_blood_pressur_c26544: "Heart rate, blood pressure, and body temperature is all normal."
  npc_override_1@lost_LostFarm_hello_c8e1e0: "Hello, {0}?"
  npc_override_1@lost_LostFarm_hello_d949c6: "Hello, {0}."
  npc_override_1@lost_LostFarm_here_s_token_promise_e6c420: "Here... it's a token of promise."
  npc_override_1@lost_LostFarm_hey_guys_s_time_bars_f5e5ee: "Hey... Guys, it's time for bars and rice~"
  npc_override_1@lost_LostFarm_hmm_9c4d28: "Hmm..."
  npc_override_1@lost_LostFarm_hold_while_i_ll_process_a5ca3e: "Hold on for a while. I'll process the explanation."
  npc_override_1@lost_LostFarm_how_about_dear_guest_e6639d: "How about it... Dear guest?"
  npc_override_1@lost_LostFarm_huh_6ed1eb: "Huh."
  npc_override_1@lost_LostFarm_i_am_charge_farm_facilit_fe8e1c: "I am in charge of the farm facility here."
  npc_override_1@lost_LostFarm_i_did_great_job_sob_3871be: "I did a great job... *sob*"
  npc_override_1@lost_LostFarm_i_don_t_know_if_5c3247: "I don't know if it's weird, but I'm not a Pitaya, but I'm good at listening."
  npc_override_1@lost_LostFarm_i_don_t_tail_7c6699: "I don't have a tail."
  npc_override_1@lost_LostFarm_i_don_t_want_afraid_379250: "...I don't want to be afraid."
  npc_override_1@lost_LostFarm_i_explain_everything_you_f2d36e: "I will explain everything to you."
  npc_override_1@lost_LostFarm_i_fix_plants_give_fertil_cce916: "I fix the plants, give it fertilizer and feed kitty here and his friends."
  npc_override_1@lost_LostFarm_i_guess_fb9b24: "I guess."
  npc_override_1@lost_LostFarm_i_heard_s_pleasant_peopl_663ce0: "I heard it's not pleasant for people, how about breathing?"
  npc_override_1@lost_LostFarm_i_just_call_him_he_487160: "I just call him that, He is a little different from the other, it's hiding in a place that's hard to see."
  npc_override_1@lost_LostFarm_i_know_s_little_hard_81d058: "I know it's a little hard for you, but... if you lend us a hand, we will properly compensate you."
  npc_override_1@lost_LostFarm_i_ll_prepare_food_today_efa451: "I'll prepare the food for today."
  npc_override_1@lost_LostFarm_i_ll_take_care_please_9b2aa3: "I'll take care of that, please."
  npc_override_1@lost_LostFarm_i_ll_talk_leader_guests_96aca7: "I'll talk to the leader of the guests!"
  npc_override_1@lost_LostFarm_i_ll_wait_you_so_b98a76: "I'll wait for you, so please tell me when you want to go out~"
  npc_override_1@lost_LostFarm_i_m_one_charge_harvest_d3e929: "I'm the one in charge of the harvest, so please talk to me anytime you want!"
  npc_override_1@lost_LostFarm_i_m_worried_92bf5c: "I'm worried..."
  npc_override_1@lost_LostFarm_i_now_courage_again_go_830e67: "^0000FFI now have the courage again to go back into the farming facility again.^000000"
  npc_override_1@lost_LostFarm_i_saw_guests_again_i_a1101c: "I saw the guests again. I respect you. Oh, of course, it was admirable from the beginning."
  npc_override_1@lost_LostFarm_i_smell_sniff_sniff_04ee4f: "Do I smell...? Sniff, sniff."
  npc_override_1@lost_LostFarm_i_think_s_little_differe_226d0d: "I think it's a little different from geting used to a guest and getting used to this kind of work."
  npc_override_1@lost_LostFarm_i_think_s_right_them_297284: "I think it's right for them. I told you before, they'll only produce tails if they're in a good mood."
  npc_override_1@lost_LostFarm_i_think_so_25f2e7: "I think so."
  npc_override_1@lost_LostFarm_i_think_they_should_play_568725: "But I think they should be playing with you! That's right!"
  npc_override_1@lost_LostFarm_i_understand_why_luina_a_a2c9dd: "I understand why Luina asked for more worker because she couldn't harvest quickly herself."
  npc_override_1@lost_LostFarm_i_ve_met_eyes_automatic_398ddc: "- I've met eyes with the automatic doll in front of the farming facility. -"
  npc_override_1@lost_LostFarm_i_wish_you_help_me_e837ab: "I wish you can help me with the harvest..."
  npc_override_1@lost_LostFarm_if_condition_being_cute_dc6f72: "If the condition of being cute is biting, then boss meow would be cutest and better at biting as much as the others..."
  npc_override_1@lost_LostFarm_if_you_give_me_pitaya_cb1482: "If you give me the Pitaya tail you have collected, today's farm experience is over! Come on, let's go outside!"
  npc_override_1@lost_LostFarm_if_you_look_kitty_right_e7d81a: "If you look at Kitty right now, He doesn't have roots, right?"
  npc_override_1@lost_LostFarm_if_you_re_confident_your_92779f: "If you're confident in your combat skills, I'd like you to help with the harvest."
  npc_override_1@lost_LostFarm_if_you_re_free_talk_1cd45e: "If you're free, talk to 'Cotton' here, she's the play manager, and she'll let you know what to do."
  npc_override_1@lost_LostFarm_if_you_want_see_him_107347: "If you want to see him around, you'll have to sprink the food and make it a little noisy around the farm."
  npc_override_1@lost_LostFarm_ingredients_dessert_come_eb4ade: "The ingredients for the dessert that comes out from the cafeteria is harvested here."
  npc_override_1@lost_LostFarm_just_some_fertilizer_som_09f3fa: "Just some fertilizer... and some foods."
  npc_override_1@lost_LostFarm_just_talk_me_if_you_27b854: "Just talk to me, if you're interested."
  npc_override_1@lost_LostFarm_kitty_0fd592: "Kitty."
  npc_override_1@lost_LostFarm_kitty_butterfly_happy_so_20d074: "Kitty, Butterfly, Happy, and so on."
  npc_override_1@lost_LostFarm_kitty_cutest_pitaya_over_edf93f: "Kitty is the cutest, the pitaya over here is Kitty."
  npc_override_1@lost_LostFarm_kitty_here_plant_called_7c2b6f: "Kitty here is a plant called a Pitaya. It's an improved ancient species that lived somewhere on this island."
  npc_override_1@lost_LostFarm_kitty_hold_still_minute_1b56e2: "Kitty, hold still for a minute. Good boy~"
  npc_override_1@lost_LostFarm_let_s_look_your_talent_cc8f38: "Let's look at your talent and spread the food! Guys~~ It's time to eat~~~"
  npc_override_1@lost_LostFarm_let_s_move_next_habitat_79273a: "Let's move on to the next habitat, it's around here. Ready? Here we go!"
  npc_override_1@lost_LostFarm_let_s_move_next_location_603e98: "Let's move on to the next location!"
  npc_override_1@lost_LostFarm_let_s_see_how_many_22757a: "Let's see... How many did you collect?"
  npc_override_1@lost_LostFarm_let_s_talk_about_details_edfd16: "Let's talk about the details when you want to help."
  npc_override_1@lost_LostFarm_luina_held_pitaya_demo_h_b1498c: "- Luina held the Pitaya, demo to on how to pull the tail and put it down. -"
  npc_override_1@lost_LostFarm_luina_i_finished_extensi_93c6c3: "Luina... I finished the extension report, please say something to the guest after this!"
  npc_override_1@lost_LostFarm_luina_s_face_became_comp_5513ed: "- Luina's face became complex with a satisfied expression while petting the cat. -"
  npc_override_1@lost_LostFarm_luina_stroked_pitaya_9c4301: "- Luina stroked the Pitaya. -"
  npc_override_1@lost_LostFarm_lungs_come_think_how_pit_ae1a47: "Not with lungs, but... Come to think of it, how does Pitaya make a sounds?"
  npc_override_1@lost_LostFarm_may_been_small_greenhous_c213db: "It may have been a small greenhouse from the outside, but it's an illusion. Look at the ceiling... It's really high, right?"
  npc_override_1@lost_LostFarm_maybe_just_maybe_4640f3: "Maybe... just maybe?"
  npc_override_1@lost_LostFarm_memorial_dungeon_hasn_t_f0db16: "^FF0000The memorial dungeon hasn't been created yet.^000000"
  npc_override_1@lost_LostFarm_menu_big_11b285: "Big Meow : Grrrrrrr."
  npc_override_1@lost_LostFarm_menu_big_915f71: "Big Meow : *Sneeze*"
  npc_override_1@lost_LostFarm_menu_cotton_7f6b63: "Cotton : I wish it's a little higher..."
  npc_override_1@lost_LostFarm_menu_options_05553a: "{0} : I think so."
  npc_override_1@lost_LostFarm_menu_options_0e5f64: "{0} : Boss Meow?"
  npc_override_1@lost_LostFarm_menu_options_147d09: "{0} : Are you sure that you're not playing right now?"
  npc_override_1@lost_LostFarm_menu_options_649665: "{0} : Did you have fun?"
  npc_override_1@lost_LostFarm_menu_options_834e5b: "{0} : Are you okay?"
  npc_override_1@lost_LostFarm_menu_options_a68dbf: "{0} : Come out for now."
  npc_override_1@lost_LostFarm_menu_options_c79f8d: "{0} : Is there another one?"
  npc_override_1@lost_LostFarm_menu_silk_005f42: "Silk : But it would be faster to hold it and play with it just like you did, rather than petting it for 5 minutes."
  npc_override_1@lost_LostFarm_menu_silk_021a51: "Silk : ...I don't want to be afraid."
  npc_override_1@lost_LostFarm_menu_silk_04433a: "Silk : There is a reason why I always guide guests."
  npc_override_1@lost_LostFarm_menu_silk_06257d: "Silk : Here~~ You can have my arm~~"
  npc_override_1@lost_LostFarm_menu_silk_06cdd0: "Silk : Ahhhhhhhhhhhh! Save me!!"
  npc_override_1@lost_LostFarm_menu_silk_131ed0: "Silk : Kyaaah!"
  npc_override_1@lost_LostFarm_menu_silk_1631aa: "Silk : But I think they should be playing with you! That's right!"
  npc_override_1@lost_LostFarm_menu_silk_17101a: "Silk : ....."
  npc_override_1@lost_LostFarm_menu_silk_17b526: "Silk : Sigh..."
  npc_override_1@lost_LostFarm_menu_silk_19d4e6: "Silk : Let's see, Luina's record... I need to wake up a Big Meow. To get there..."
  npc_override_1@lost_LostFarm_menu_silk_19f2f1: "Silk : This is all thanks to your help... Thank you so much."
  npc_override_1@lost_LostFarm_menu_silk_1eac19: "Silk : Does an automatic doll make jokes? Oh, you're pretty good at joking. I always mean it."
  npc_override_1@lost_LostFarm_menu_silk_1fb137: "Silk : Anyway, help me with the next harvest! Hey, guys~ It's time to eat~~"
  npc_override_1@lost_LostFarm_menu_silk_21ece6: "Silk : The next one is a playground with rocks and sand. When I harvest, I'll have to shake off the sand first..."
  npc_override_1@lost_LostFarm_menu_silk_22ad33: "Silk : That's okay, I have a good eyesight, so if you get there and give me a signal, I'll take care of it! Now, for the closest one, I'll show you the coordinates on the map..."
  npc_override_1@lost_LostFarm_menu_silk_259055: "Silk : I think it's right for them. I told you before, they'll only produce tails if they're in a good mood."
  npc_override_1@lost_LostFarm_menu_silk_2789c4: "Silk : Thank you for saving my life! According to Luina, the Pitaya are a gentle creature!"
  npc_override_1@lost_LostFarm_menu_silk_2807ce: "Silk : Is there a condition that requires you to bite people to be cute?"
  npc_override_1@lost_LostFarm_menu_silk_2a3cce: "Silk : So let's move on... The Pitayas here are sleepyheads, so the responses may be a little different. Now, guys...Come here..."
  npc_override_1@lost_LostFarm_menu_silk_2d18d9: "Silk : ...it will bite well...?"
  npc_override_1@lost_LostFarm_menu_silk_2ddd18: "Silk : Let's move on to the next habitat, it's around here. Ready? Here we go!"
  npc_override_1@lost_LostFarm_menu_silk_2e05ca: "Silk : ...so, two Big Meow... Boss Meow and Big Meow have a hierarchy, so they have a specific location for napping before mealtime..."
  npc_override_1@lost_LostFarm_menu_silk_2e2106: "Silk : ...Is it over?"
  npc_override_1@lost_LostFarm_menu_silk_30a9a0: "Silk : Only Boss Meow..."
  npc_override_1@lost_LostFarm_menu_silk_331ca4: "Silk : Save the automatic doll!"
  npc_override_1@lost_LostFarm_menu_silk_35d5ed: "Silk : So let me call the Pitayas around here..."
  npc_override_1@lost_LostFarm_menu_silk_3832bc: "Silk : By the way... Today's quota is finally over half."
  npc_override_1@lost_LostFarm_menu_silk_3a143b: "Silk : Hey... Guys, it's time for bars and rice~"
  npc_override_1@lost_LostFarm_menu_silk_3a437c: "Silk : ...fine~~~~~"
  npc_override_1@lost_LostFarm_menu_silk_3adebe: "Silk : Now I'm going to sprinkle some food here, too. Let's get this over with... I'll go hide."
  npc_override_1@lost_LostFarm_menu_silk_3fec5c: "Silk : As expected... Joy comes with a price."
  npc_override_1@lost_LostFarm_menu_silk_40a03a: "Silk : How about it... Dear guest?"
  npc_override_1@lost_LostFarm_menu_silk_40b704: "Silk : What do you think? I think you're doing good for a first timer."
  npc_override_1@lost_LostFarm_menu_silk_41c597: "Silk : Shall we go?"
  npc_override_1@lost_LostFarm_menu_silk_435273: "Silk : Don't come this waaaaaay!"
  npc_override_1@lost_LostFarm_menu_silk_498e72: "Silk : We are all the same, but I can't do the same job as Luina..."
  npc_override_1@lost_LostFarm_menu_silk_4a3382: "Silk : ... though I can't hold onto it."
  npc_override_1@lost_LostFarm_menu_silk_4f3997: "Silk : To enjoy it's cuteness, I'm ready to give my arms and legs...!"
  npc_override_1@lost_LostFarm_menu_silk_4ff8d7: "Silk : Next up is near the entrance, but according to Luina's information, it's a sleepy area. You think he's about to wake up?"
  npc_override_1@lost_LostFarm_menu_silk_512aff: "Silk : ........... what's the difference!"
  npc_override_1@lost_LostFarm_menu_silk_526ab3: "Silk : .... come this way."
  npc_override_1@lost_LostFarm_menu_silk_52b422: "Silk : Ca-calm Boss Meow down~~~"
  npc_override_1@lost_LostFarm_menu_silk_5391f3: "Silk : Do I smell...? Sniff, sniff."
  npc_override_1@lost_LostFarm_menu_silk_5559c0: "Silk : As expected, you have a talent for this! I was right!"
  npc_override_1@lost_LostFarm_menu_silk_562b36: "Silk : ..."
  npc_override_1@lost_LostFarm_menu_silk_5b82c0: "Silk : Don't mind my location..."
  npc_override_1@lost_LostFarm_menu_silk_5c15e6: "Silk : Haa, haa... I was so scared..."
  npc_override_1@lost_LostFarm_menu_silk_639b89: "Silk : ...not now, but I feel like I can... hmmm."
  npc_override_1@lost_LostFarm_menu_silk_671cc8: "Silk : You must play with all the Pitayas on your way here."
  npc_override_1@lost_LostFarm_menu_silk_68a474: "Silk : ...Oh, my..."
  npc_override_1@lost_LostFarm_menu_silk_6b8d4b: "Silk : Guest... Huh..."
  npc_override_1@lost_LostFarm_menu_silk_6ba6d6: "Silk : Boss Meow...!"
  npc_override_1@lost_LostFarm_menu_silk_70136b: "Silk : Well, I'm telling you~~~~~~~~ Ugh!"
  npc_override_1@lost_LostFarm_menu_silk_735527: "Silk : Hey, guys~ Not me~"
  npc_override_1@lost_LostFarm_menu_silk_753e43: "Silk : Don't come! Don't comeee!"
  npc_override_1@lost_LostFarm_menu_silk_77c96c: "Silk : Phew..."
  npc_override_1@lost_LostFarm_menu_silk_7a00ef: "Silk : By the way, shall we move on to the next location...? We're not done yet, so..."
  npc_override_1@lost_LostFarm_menu_silk_7b18d7: "Silk : The automatic doll... can I be angry? ...Hmmm..."
  npc_override_1@lost_LostFarm_menu_silk_7b195c: "Silk : Even if it's right to come over to play, at least not with me."
  npc_override_1@lost_LostFarm_menu_silk_85082c: "Silk : It may have been a small greenhouse from the outside, but it's an illusion. Look at the ceiling... It's really high, right?"
  npc_override_1@lost_LostFarm_menu_silk_869f74: "Silk : To enjoy it's cuteness, I'm ready to give it not only arms and legs but also my colleagues...!"
  npc_override_1@lost_LostFarm_menu_silk_8a168e: "Silk : I've spread the food, so they'll show up soon!"
  npc_override_1@lost_LostFarm_menu_silk_8bf12a: "Silk : I saw the guests again. I respect you. Oh, of course, it was admirable from the beginning."
  npc_override_1@lost_LostFarm_menu_silk_8d8d0f: "Silk : There's no distinction between us, but how canthey tell us apart?"
  npc_override_1@lost_LostFarm_menu_silk_905f3f: "Silk : This is... it's not fear, it's more like resentment..."
