  npc_override_verus04_enchan_verus_hello_i_help_you_934115: "Hello! Can I help you?"
  npc_override_verus04_enchan_verus_hello_i_m_mars_explorati_42247e: "Hello! I'm MARS_01, an exploration robot. Currently, I have entered hibernation mode to save power. The related functions are set as follows."
  npc_override_verus04_enchan_verus_hey_did_you_just_talk_7e0270: "Hey! Did you just talk to that piece of junk? Or am I losing my sight?"
  npc_override_verus04_enchan_verus_humans_learn_their_mista_7d723e: "And that Humans learn from their mistakes and failures. I read that from those paper memory devices called ^FF0000books^000000 in the factory."
  npc_override_verus04_enchan_verus_i_already_talked_about_p_8ee6c5: "I have already talked about the production equipment needs ^0000ff10 {0} and 5 {1}^000000, you don't have enough."
  npc_override_verus04_enchan_verus_i_also_provide_wider_sel_aaddae: "I also provide a wider selection of Upgrade options for Charleston Equipment at ^ff0000+9^000000 or above."
  npc_override_verus04_enchan_verus_i_don_t_know_if_c79677: "I don't know if the new Charleston is Charleston 1 or 2. I can't even tell what it misses or remembers the most."
  npc_override_verus04_enchan_verus_i_don_t_know_where_8867c4: "I don't know where you can find Charleston Components,"
  npc_override_verus04_enchan_verus_i_don_t_mean_depreciate_7a12e7: "I don't mean to depreciate myself, but mass versions are mass versions; they're cost-effective and practical, but never as good as the high-end versions."
  npc_override_verus04_enchan_verus_i_feel_so_congested_os_4c2361: "I feel so congested in the OS that I ranted. Perhaps I need to defragment my memory."
