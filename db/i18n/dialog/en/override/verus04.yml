  npc_override_verus04_enchan_verus_i_ll_see_you_next_17f1d7: "I'll see you next time!"
  npc_override_verus04_enchan_verus_i_ll_think_about_6080d6: "I'll think about it..."
  npc_override_verus04_enchan_verus_i_ll_upgrading_first_abi_f1c163: "I'll be Upgrading the first ability. The existing Upgrade level and cards will not be damaged. Do you want to continue?"
  npc_override_verus04_enchan_verus_i_ll_upgrading_rd_abilit_f88b8c: "I'll be Upgrading the 3rd ability. This highest Upgrade stage incurs a  chance of ^990000destroying the Equipment or resetting its existing Upgrade level.^000000 Do you want to continue?"
  npc_override_verus04_enchan_verus_i_ll_upgrading_second_ab_74e546: "I'll be Upgrading the second ability. The existing Upgrade level and cards will not be damaged."
  npc_override_verus04_enchan_verus_i_m_interested_equipment_6d3933: "I'm not interested in this Equipment."
  npc_override_verus04_enchan_verus_i_m_mass_version_charles_d6f40c: "I'm a mass version Charleston. I wasn't even given a serial number. Who knows how many copies of me were made? It could be a hundred, maybe even a thousand."
  npc_override_verus04_enchan_verus_i_m_sorry_equipment_been_cb4614: "I'm sorry but the equipment has been destroyed."
  npc_override_verus04_enchan_verus_i_still_remember_charles_c4479f: "I can still remember Charlestons 1 and 2 destroying Dr. Ve's numerous creatures like it was yesterday."
  npc_override_verus04_enchan_verus_i_suggest_you_reconsider_cc8bfe: "I suggest you reconsider."
  npc_override_verus04_enchan_verus_i_upgrade_charleston_fac_d2b3ee: "I can upgrade the Charleston Factory products. Let me know if you're interested."
