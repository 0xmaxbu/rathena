  npc_override_ein_fild01_quest_demonpungus_ok_then_well_come_back_0e1574: "Ok then, well come back here if you change your mind."
  npc_override_ein_fild01_quest_demonpungus_please_kill_demon_pungus_027b1f: "Please kill 150 Demon Pungus."
  npc_override_ein_fild01_quest_demonpungus_please_kill_demon_pungus_aef318: "Please kill 100 Demon Pungus."
  npc_override_ein_fild01_quest_demonpungus_please_kill_demon_pungus_f21e9f: "Please kill 50 Demon Pungus."
  npc_override_ein_fild01_quest_demonpungus_remember_i_need_help_hun_37bfc8: "Remember, I need help hunting Demon Pungus so go and hunt 150 of them."
  npc_override_ein_fild01_quest_demonpungus_remember_i_need_help_hun_6a006c: "Remember, I need help hunting Demon Pungus so go and hunt 50 of them."
  npc_override_ein_fild01_quest_demonpungus_remember_i_need_help_hun_8c22c7: "Remember, I need help hunting Demon Pungus so go and hunt 100 of them."
  npc_override_ein_fild01_quest_demonpungus_um_um_i_don_t_6225cd: "Um, um. I don't think.."
