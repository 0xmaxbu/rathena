  npc_override_ein_fild01_quest_demonpungus_you_think_you_help_me_2c14d6: "Do you think you can help me with something?"
  npc_override_ein_fild01_quest_demonpungus_your_back_crush_you_come_d8fffe: "your back will crush you. Come back"
