Body:
  npc_override_ein_fild01_quest_demonpungus_after_you_lost_some_weig_b89d61: "after you have lost some weight."
  npc_override_ein_fild01_quest_demonpungus_ah_ok_i_think_you_79cab9: "Ah, ok I think you can help me out by hunting some Demon Pungus."
  npc_override_ein_fild01_quest_demonpungus_amazing_you_did_speed_6cc3cd: "Amazing, you did that with speed."
  npc_override_ein_fild01_quest_demonpungus_any_progress_you_ve_made_b3e247: "Any progress that you've made will be erased"
  npc_override_ein_fild01_quest_demonpungus_come_back_when_you_ve_44350c: "Come back when you've finished your task and I will give you a small reward."
  npc_override_ein_fild01_quest_demonpungus_doesn_t_look_like_you_4ba0e4: "It doesn't look like you have enough."
  npc_override_ein_fild01_quest_demonpungus_hey_looks_like_weight_7817f7: "Hey, it looks like that the weight on"
  npc_override_ein_fild01_quest_demonpungus_hey_you_there_yeah_you_cc1ea8: "Hey, you there. Yeah you!"
  npc_override_ein_fild01_quest_demonpungus_hmm_i_don_t_think_1d8eb5: "Hmm, I don't think you've hunted 100 yet..."
  npc_override_ein_fild01_quest_demonpungus_hmm_i_don_t_think_2144d7: "Hmm, I don't think you've hunted 50 yet..."
  npc_override_ein_fild01_quest_demonpungus_hmm_i_don_t_think_5d960b: "Hmm, I don't think you've hunted 150 yet..."
  npc_override_ein_fild01_quest_demonpungus_how_many_you_like_hunt_7fc82d: "How many would you like to hunt?"
  npc_override_ein_fild01_quest_demonpungus_i_am_trying_make_my_88485e: "I am trying to make my way through but I can't seem to get past these Demon Pungus."
  npc_override_ein_fild01_quest_demonpungus_i_had_my_doubts_you_c8449c: "I had my doubts, but you have proven me wrong."
  npc_override_ein_fild01_quest_demonpungus_i_just_wish_i_could_263cad: "I just wish I could get through this all."
  npc_override_ein_fild01_quest_demonpungus_i_need_see_you_gathered_aa4625: "I need to see that you have gathered ^FF000050 Bacillus^000000, and then I can reward you."
  npc_override_ein_fild01_quest_demonpungus_i_reward_you_helping_cle_1c3116: "I will reward you for helping clear this out for me."
  npc_override_ein_fild01_quest_demonpungus_if_you_change_your_mind_3f2210: "If you change your mind, please come back."
  npc_override_ein_fild01_quest_demonpungus_its_amazing_truly_e71eaf: "Its amazing, truly it is."
