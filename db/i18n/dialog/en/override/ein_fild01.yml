  npc_override_ein_fild01_quest_demonpungus_you_finished_hunting_dem_b6ef68: "Have you finished hunting the 150 Demon Pungus?"
  npc_override_ein_fild01_quest_demonpungus_you_finished_hunting_dem_bd908e: "Have you finished hunting the 50 Demon Pungus?"
  npc_override_ein_fild01_quest_demonpungus_you_help_collecting_baci_d515e1: "Can you help by collecting ^FF0000Bacillus^000000?"
