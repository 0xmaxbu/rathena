Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_ecl_in01_guides_eclage_all_your_pain_weariness_9b22dc: "All your pain and weariness melt away in the arms of nature. Restore your mind and body at Eclage Clinic."
  npc_override_ecl_in01_guides_eclage_follow_path_your_left_7a15ef: "Follow the path on your left."
  npc_override_ecl_in01_guides_eclage_haven_t_you_seen_our_766598: "Haven't you seen our decorations for Yai? Take a trip outside. You'll see our residential area."
  npc_override_ecl_in01_guides_eclage_menu_palace_f6b789: "Palace:Orb:Store:Prison:Clinic:Residential Area:Finish the conversation"
  npc_override_ecl_in01_guides_eclage_orb_behind_me_like_symbo_0bf5f9: "The Orb behind me is like a symbol of us Laphines."
  npc_override_ecl_in01_guides_eclage_our_great_king_courageou_94d2fd: "Our great king, courageous generals, and scholars are all staying at the palace."
  npc_override_ecl_in01_guides_eclage_palace_located_top_eclag_4af2f9: "The palace is located at the top of Eclage. We usually fly there, but I see you don't have wings. Follow the path on your right then. It will lead you to the palace."
  npc_override_ecl_in01_guides_eclage_plaza_eclage_you_ll_find_2bada2: "This is the plaza of Eclage. You'll find everything you need around here."
  npc_override_ecl_in01_guides_eclage_prison_place_criminals_w_169962: "Prison is a place for criminals. Why would an adventurer like you go there?"
  npc_override_ecl_in01_guides_eclage_s_filled_great_mysteriou_74719d: "It's filled with great and mysterious power. We always keep an eye on it and guard it carefully."
  npc_override_ecl_in01_guides_eclage_welcome_adventurer_plaza_0d1fd5: "Welcome, Adventurer. This is the plaza of Eclage, a great and sacred tree. How can I help you?"
  npc_override_ecl_in01_guides_eclage_well_s_little_suspicious_937b11: "Well, it's a little suspicious...but I'll tell you the location. Follow the path on your left. They don't let anyone in though."
  npc_override_ecl_in01_quests_14_3_ack_i_hate_guy_224deb: "Ack, I hate that guy."
  npc_override_ecl_in01_quests_14_3_ah_971301: "Ah..."
  npc_override_ecl_in01_quests_14_3_ah_cf07cb: "Ah!"
  npc_override_ecl_in01_quests_14_3_argh_43ffb4: "Argh!"
  npc_override_ecl_in01_quests_14_3_avant_may_repulsive_ecd7b0: "Avant may be repulsive,"
  npc_override_ecl_in01_quests_14_3_avant_s_new_teleporter_r_fb0250: "Was Avant's new teleporter really featured in it?"
  npc_override_ecl_in01_quests_14_3_cancel_ebda43: "Cancel."
  npc_override_ecl_in01_quests_14_3_demon_god_s_hideout_fc8e95: "Demon God's hideout?"
  npc_override_ecl_in01_quests_14_3_did_you_read_latest_issu_34cb1b: "Did you read the latest issue of the Door to Verities magazine?"
  npc_override_ecl_in01_quests_14_3_evil_must_nipped_butt_9fab74: "Evil must be nipped in the butt."
  npc_override_ecl_in01_quests_14_3_finally_his_hideout_been_8b9a9b: "And it was; finally his hideout has been discovered."
  npc_override_ecl_in01_quests_14_3_goodbye_619bc3: "Goodbye."
  npc_override_ecl_in01_quests_14_3_he_dealt_either_banished_8a143a: "He has to be dealt with, either banished back to his realm or destroyed."
  npc_override_ecl_in01_quests_14_3_he_s_best_what_he_9c2249: "but he's the best at what he does."
  npc_override_ecl_in01_quests_14_3_hey_human_5a4adb: "Hey, Human."
  npc_override_ecl_in01_quests_14_3_his_traces_his_demon_sol_fb93f2: "His traces and his demon soldiers are sighted mainly around the giant hill in the center."
  npc_override_ecl_in01_quests_14_3_hmm_9c4d28: "Hmm..."
  npc_override_ecl_in01_quests_14_3_how_may_i_help_you_cc1359: "How may I help you?"
  npc_override_ecl_in01_quests_14_3_i_agree_f24f08: "That, I agree."
  npc_override_ecl_in01_quests_14_3_i_didn_t_quite_understan_15ec74: "I didn't quite understand it all."
  npc_override_ecl_in01_quests_14_3_i_hope_i_return_one_5fba95: "I hope I can return in one piece."
  npc_override_ecl_in01_quests_14_3_i_hope_interdimensional_9660fa: "I hope the Interdimensional Device won't take a heavy toll on the world."
  npc_override_ecl_in01_quests_14_3_i_m_nervous_6a787a: "I'm nervous."
  npc_override_ecl_in01_quests_14_3_i_must_been_out_my_1ada88: "I must have been out of my mind when I decided to join the army. Sigh, why does the Door to Verities have to be so high up there?"
  npc_override_ecl_in01_quests_14_3_i_only_guess_something_m_d65148: "I can only guess it has something to do with the Mayor's birth."
  npc_override_ecl_in01_quests_14_3_i_wanted_ask_more_he_612593: "I wanted to ask more, but he looked down his nose at me."
  npc_override_ecl_in01_quests_14_3_i_wonder_if_means_avant_6060b9: "I wonder if this means Avant has finally decided to pursue his interest in research activities."
  npc_override_ecl_in01_quests_14_3_if_you_cause_doom_oursel_3fe344: "If you  are the cause doom to ourselves OR Yggdrasil, then we won't hesitate to fight you."
  npc_override_ecl_in01_quests_14_3_if_you_re_curious_then_f78d0a: "If you're curious, then use that teleporter to the hideout over there."
  npc_override_ecl_in01_quests_14_3_if_you_want_join_expedit_1fe727: "If you want to join the Expedition to defeat the Demon God, then use this teleporter."
  npc_override_ecl_in01_quests_14_3_if_you_want_more_details_47160c: "If you want more details, then you should visit the actual site."
  npc_override_ecl_in01_quests_14_3_just_use_teleporter_over_0822e5: "Just use the teleporter over there."
  npc_override_ecl_in01_quests_14_3_lemony_you_really_need_w_a686f6: "Lemony, you really need to work on improving your personality."
  npc_override_ecl_in01_quests_14_3_ll_destroyed_once_our_op_9bcd55: "It'll be destroyed once our operation is over, but for now it's something we cannot live without."
  npc_override_ecl_in01_quests_14_3_ll_send_you_directly_exp_dd969c: "It'll send you directly to the Expedition Camp."
  npc_override_ecl_in01_quests_14_3_many_warrior_already_lef_7ee2f1: "Many a warrior already left to the hideout."
  npc_override_ecl_in01_quests_14_3_may_yggdrasil_bless_you_410c17: "May Yggdrasil bless you."
  npc_override_ecl_in01_quests_14_3_menu_commander_0d8d24: "Commander: Soldiers, finally it's time to put your training to use!"
  npc_override_ecl_in01_quests_14_3_menu_commander_2de352: "Commander: Stay focused! We're going to finish off the Demon God!"
  npc_override_ecl_in01_quests_14_3_menu_commander_5cd966: "Commander: Don't disappoint your comrades at the Splendide advance base!"
  npc_override_ecl_in01_quests_14_3_menu_commander_a82c51: "Commander: Ah, suddenly I can't see..."
  npc_override_ecl_in01_quests_14_3_menu_commander_c5054d: "Commander: Did someone just whimper?"
  npc_override_ecl_in01_quests_14_3_move_demon_god_s_hideout_25db9b: "Move to the Demon God's hideout."
  npc_override_ecl_in01_quests_14_3_move_eclage_751c14: "Move to Eclage."
  npc_override_ecl_in01_quests_14_3_msg_6eae3a: "..."
  npc_override_ecl_in01_quests_14_3_mwa_hah_hah_s_time_731577: "Mwa hah hah, it's time for me to shine!"
  npc_override_ecl_in01_quests_14_3_oh_just_so_you_know_bce8d8: "Oh, just so you know, you might be throwing away your life. *Giggle*"
  npc_override_ecl_in01_quests_14_3_oh_right_you_too_going_985c65: "Oh, right. Are you too going there?"
  npc_override_ecl_in01_quests_14_3_only_he_could_pull_off_2ec116: "Only he could pull off this kind of teleporter."
  npc_override_ecl_in01_quests_14_3_only_those_allowed_enter_f77f63: "Only those allowed to enter the hideout can use this teleporter."
  npc_override_ecl_in01_quests_14_3_originally_crack_created_41422a: "Originally the Crack was created by the Demon God to aid in his escape,"
  npc_override_ecl_in01_quests_14_3_quit_fb25bb: "Quit."
  npc_override_ecl_in01_quests_14_3_s_connected_recently_dis_2c9c28: "It's connected to the recently discovered hideout the of Demon God."
  npc_override_ecl_in01_quests_14_3_s_scientifically_designe_3be399: "It's scientifically designed to send its user directly to the Dimensional Crack where his hideout is."
  npc_override_ecl_in01_quests_14_3_shush_c38fed: "Shush."
  npc_override_ecl_in01_quests_14_3_sigh_s_unfair_such_jerk_e988a7: "Sigh, it's unfair such a jerk is considered the best in magical science."
  npc_override_ecl_in01_quests_14_3_so_d_been_thought_invest_1d3b22: "so it'd been thought investigating the Crack could locate him."
  npc_override_ecl_in01_quests_14_3_so_long_as_morocc_exists_08a2fc: "So long as Morocc exists, Yggdrasil is not safe. I'm going to join the Expedition."
  npc_override_ecl_in01_quests_14_3_teleporter_connected_ecl_8fd02f: "This teleporter is connected to Eclage."
  npc_override_ecl_in01_quests_14_3_teleporter_connected_rec_a0df8c: "This teleporter is connected to the recently discovered hideout of the Demon God."
  npc_override_ecl_in01_quests_14_3_there_quite_spectacle_wa_18a288: "There will be quite a spectacle to watch."
  npc_override_ecl_in01_quests_14_3_tsk_tsk_26ac45: "Tsk, tsk."
  npc_override_ecl_in01_quests_14_3_turns_out_demon_god_ran_69c027: "It turns out Demon God ran from Morocc to hide out in our dimension."
  npc_override_ecl_in01_quests_14_3_use_teleporter_414d33: "Do not use the teleporter."
  npc_override_ecl_in01_quests_14_3_use_teleporter_move_demo_6538ba: "Use the teleporter to move to the Demon God's hideout."
  npc_override_ecl_in01_quests_14_3_use_teleporter_move_ecla_513ff8: "Use the teleporter to move to Eclage."
  npc_override_ecl_in01_quests_14_3_way_avant_never_fails_am_5d5797: "By the way, Avant never fails to amaze me."
  npc_override_ecl_in01_quests_14_3_we_now_use_those_passage_d17896: "We can now use those passageways to explore inside the Crack."
  npc_override_ecl_in01_quests_14_3_what_s_teleporter_849d26: "What's that teleporter?"
  npc_override_ecl_in01_quests_14_3_when_i_asked_him_he_553e3d: "When I asked him, he mumbled something about repentance."
  npc_override_ecl_in01_quests_14_3_why_he_helping_mayor_any_79574c: "Why is he helping the Mayor, anyway?"
  npc_override_ecl_in01_quests_14_3_why_so_crowded_here_f5e993: "Why is it so crowded in here?"
  npc_override_ecl_in01_quests_14_3_yeah_yeah_d1a3e7: "Yeah, yeah."
  npc_override_ecl_in01_quests_14_3_yes_just_basic_principle_b61be8: "Yes, just the basic principles and the information relevant to the Humans."
  npc_override_ecl_in01_quests_14_3_you_always_study_hard_be_dafb6e: "You can always study hard to beat him."
  npc_override_ecl_in01_quests_14_3_you_eavesdropping_us_wel_71574d: "Were you eavesdropping on us? Well, though it wasn't like we're discussing secrets."
  npc_override_ecl_in01_quests_14_3_you_know_dimensional_cra_e5a26b: "You know the Dimensional Crack, don't you? Recently it's been revealed that the Crack is made up of dimensional passageways."
  npc_override_ecl_in01_quests_14_3_you_know_hideout_demon_g_059468: "You know, the hideout of the Demon God who created some of the Space Time Dimensional Cracks has recently been discovered."
  npc_override_ecl_in01_quests_14_3_you_re_unexpected_visito_2dfdf7: "You're unexpected visitors from the Midgard Continent."
  npc_override_ecl_in01_quests_14_3_you_want_use_a0fe34: "Do you want to use it?"
