  npc_override_1@md_gef_FridayDungeon_darn_1770dd: "Darn it..."
  npc_override_1@md_gef_FridayDungeon_each_hollow_sockets_seem_ade669: "Each of the 10 hollow sockets seem to perfectly fit a craft stone."
  npc_override_1@md_gef_FridayDungeon_first_day_i_curiously_pu_e33bf3: "On the first day, I curiously put my hand on the slab of a strange Sculpture nearby."
  npc_override_1@md_gef_FridayDungeon_friday_memorial_dungeon_4668a6: "The Friday Memorial Dungeon does not exist."
  npc_override_1@md_gef_FridayDungeon_however_if_accessory_ran_a3daae: "However ^0000FFif the accessory has a random option, the random option will be removed after enchantment.^000000"
  npc_override_1@md_gef_FridayDungeon_i_awokened_something_i_s_9edc9e: "...and I awokened something that I should not have."
  npc_override_1@md_gef_FridayDungeon_i_cannot_accessory_81fd22: "I cannot {0} this {1} accessory."
  npc_override_1@md_gef_FridayDungeon_i_cannot_reset_accessory_1abf12: "I cannot reset this accessory."
  npc_override_1@md_gef_FridayDungeon_i_cannot_work_any_furthe_941868: "I cannot work on this any further."
  npc_override_1@md_gef_FridayDungeon_i_could_make_my_own_0ed3e8: "I could make my own choice, but each person handles it differently based on their abilities."
  npc_override_1@md_gef_FridayDungeon_i_failed_accessory_been_1609b5: "I have failed and the accessory has been destroyed. I'm so sorry."
  npc_override_1@md_gef_FridayDungeon_i_hope_see_you_when_518265: "I hope to see you when Friday arrives~"
  npc_override_1@md_gef_FridayDungeon_i_ll_back_later_0bf5f3: "I'll be back later"
  npc_override_1@md_gef_FridayDungeon_i_need_x_zeny_b15116: "I need 10 x {0} and 100,000 Zeny."
  npc_override_1@md_gef_FridayDungeon_i_need_zeny_c3745f: "I need 100,000 zeny!"
  npc_override_1@md_gef_FridayDungeon_i_succeeded_6be758: "I have succeeded."
  npc_override_1@md_gef_FridayDungeon_i_trade_expensive_stones_556151: "I trade expensive stones from the dungeon in exchange for my craftsmanship. I'm still a beginner, but my skills are passable."
  npc_override_1@md_gef_FridayDungeon_i_ve_heard_before_b587e7: "I've heard this before."
  npc_override_1@md_gef_FridayDungeon_if_accessory_random_opti_214ccf: "^0000FFIf the accessory has a random option, the random option will be removed after initialization.^000000"
  npc_override_1@md_gef_FridayDungeon_if_you_any_monster_proce_a5fad7: "^ff0000If you do any monster processing, such as monster taming within the dungeon, it won't count towards your progress. Please take note.^000000"
  npc_override_1@md_gef_FridayDungeon_if_you_bring_me_i_184976: "If you bring me a {0}, I can enchant a wonderful effect on your accessory!"
  npc_override_1@md_gef_FridayDungeon_if_you_see_suspicious_sl_01ffd5: "If you do see a suspicious slab, do not show any interest and pass by it."
  npc_override_1@md_gef_FridayDungeon_ignore_98f55d: "Ignore"
  npc_override_1@md_gef_FridayDungeon_its_maximum_enchantment_d0b2ef: "The {0} is not at its maximum enchantment."
  npc_override_1@md_gef_FridayDungeon_looking_hastily_scribble_9a0c22: "Looking at a hastily scribbled note in his pocket, perhaps the adventurer's name was Walter."
  npc_override_1@md_gef_FridayDungeon_memorial_dungeon_been_cr_a43d8a: "The Memorial Dungeon has been created."
  npc_override_1@md_gef_FridayDungeon_memorial_dungeon_just_re_9f2894: "The memorial dungeon is just ready to be opened."
  npc_override_1@md_gef_FridayDungeon_menu_friday_cf5068: "^0000FFFriday 00:00 ~ Friday 23:59^000000"
  npc_override_1@md_gef_FridayDungeon_menu_my_7894a2: "My success rate is:"
  npc_override_1@md_gef_FridayDungeon_menu_other_003d46: "Other Accessory: 20%"
  npc_override_1@md_gef_FridayDungeon_menu_royal_d8d45e: "Royal Ring: 80%"
  npc_override_1@md_gef_FridayDungeon_menu_the_4da1d1: "The dungeon will be open during:"
  npc_override_1@md_gef_FridayDungeon_my_name_walter_adventure_065eb0: "My name is Walter. For the adventurers who will visit this place in the future, I'm leaving this so that you don't make the same mistake again."
  npc_override_1@md_gef_FridayDungeon_nothing_else_happened_95e32d: "But nothing else happened."
  npc_override_1@md_gef_FridayDungeon_off_you_go_027c81: "Off you go!"
  npc_override_1@md_gef_FridayDungeon_oh_curious_onlooker_i_m_b8f9bc: "Oh, a curious onlooker? I'm Marry Jay, the person in charge of Fridays among the days of the week."
  npc_override_1@md_gef_FridayDungeon_one_thing_certain_he_kil_52d920: "One thing is certain, he will kill me."
  npc_override_1@md_gef_FridayDungeon_only_party_members_enter_a72ce3: "Only party members can enter this Memorial dungeon."
  npc_override_1@md_gef_FridayDungeon_perhaps_he_died_while_wa_19b301: "Perhaps he died while wandering in this place on the search for treasure."
  npc_override_1@md_gef_FridayDungeon_perhaps_he_no_memories_h_e21aff: "Perhaps he has no memories of his previous life."
  npc_override_1@md_gef_FridayDungeon_physical_919b82: "Physical"
  npc_override_1@md_gef_FridayDungeon_please_bring_me_x_505e0a: "Please bring me 10 x {0}"
  npc_override_1@md_gef_FridayDungeon_please_bring_me_x_658314: "Please bring me 10 x {0}."
  npc_override_1@md_gef_FridayDungeon_please_equip_your_access_2bcab5: "Please equip your accessory."
  npc_override_1@md_gef_FridayDungeon_please_select_enchantmen_00ed72: "Please select an enchantment type~"
  npc_override_1@md_gef_FridayDungeon_please_take_care_me_adadc3: "Please take care of me."
  npc_override_1@md_gef_FridayDungeon_reset_possible_i_t_say_962d02: "A reset is possible, but I can't say that I'm experienced."
  npc_override_1@md_gef_FridayDungeon_right_now_revived_ancien_966657: "Right now the revived ancient king is wandering in front of me."
  npc_override_1@md_gef_FridayDungeon_seems_like_sockets_t_use_ea1081: "Seems like the sockets can't be used for a while."
  npc_override_1@md_gef_FridayDungeon_several_craft_stones_fal_c24253: "Several craft stones fall from his body. They were probably collected while exploring this place."
  npc_override_1@md_gef_FridayDungeon_so_10b991: "Is that so?"
  npc_override_1@md_gef_FridayDungeon_some_point_accumulated_d_e3f344: "At some point, the accumulated dust scatters, and 10 hollow holes are visible on the slab under the sculpture."
  npc_override_1@md_gef_FridayDungeon_something_seems_changed_9d5cd7: "Something seems to have changed in the air around me."
  npc_override_1@md_gef_FridayDungeon_sorry_entry_period_expir_e49eb9: "Sorry, but the entry period to the {0} has expired."
  npc_override_1@md_gef_FridayDungeon_strange_sculpture_lot_du_4a30db: "It is a strange sculpture with a lot of dust piled up. I don't see anything suspicious."
  npc_override_1@md_gef_FridayDungeon_stranger_s_corpse_e98c87: "It is a stranger's corpse."
  npc_override_1@md_gef_FridayDungeon_t_continue_because_you_t_040296: "Can't continue because you have too many heavy objects. Reduce your total weight by clearing your inventory."
  npc_override_1@md_gef_FridayDungeon_t_really_help_i_guess_312813: "Can't really help it I guess"
  npc_override_1@md_gef_FridayDungeon_take_rest_while_waiting_818f88: "Take a rest while waiting for the dungeon to be available again."
  npc_override_1@md_gef_FridayDungeon_there_chance_success_acc_eccb0e: "^FF0000There is a {0}% chance of success. The accessory will be destroyed if the reset fails!^000000"
  npc_override_1@md_gef_FridayDungeon_there_no_chance_failure_422806: "^0000FFThere is a no chance of failure^000000."
  npc_override_1@md_gef_FridayDungeon_there_no_failure_enchant_8b05f1: "There is no failure in the enchantment process."
  npc_override_1@md_gef_FridayDungeon_there_no_memorial_dungeo_2643a1: "There is no Memorial Dungeon registered."
  npc_override_1@md_gef_FridayDungeon_unknown_error_occurred_285cc7: "An unknown error occurred."
  npc_override_1@md_gef_FridayDungeon_using_craft_stone_i_ench_42a774: "By using the Craft Stone, I can enchant one of your accessories with abilities."
