  npc_override_1@md_gef_FridayDungeon_when_opening_time_59e170: "When is the opening time?"
  npc_override_1@md_gef_FridayDungeon_when_you_insert_craft_st_dcc858: "When you insert a craft stone into a hole, it emits a bright light and melts."
  npc_override_1@md_gef_FridayDungeon_yes_please_proceed_32b89f: "Yes, please proceed"
  npc_override_1@md_gef_FridayDungeon_you_came_just_time_072e02: "You came just in time."
