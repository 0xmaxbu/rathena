Body:
  npc_override_1@md_gef_FridayDungeon_adventurers_who_visit_pl_f22de0: "To the adventurers who will visit this place in the future, I hope you do not make the same mistake as me."
  npc_override_1@md_gef_FridayDungeon_again_never_touch_slab_w_76240a: "Again, never touch the slab. Whatever temptation you may have."
