  npc_override_1@md_gef_FridayDungeon_you_respect_dead_decided_9814a8: "You respect the dead and decided to leave the body alone."
  npc_override_1@md_gef_FridayDungeon_you_sure_enhance_d98e84: "Are you sure to enhance the {0}?"
  npc_override_1@md_gef_FridayDungeon_you_sure_you_want_enhanc_c99e61: "Are you sure you want to enhance the {0}?"
  npc_override_1@md_gef_FridayDungeon_you_t_choose_difficulty_a180a1: "You can't choose this difficulty, because your base level is below 200."
  npc_override_1@md_gef_FridayDungeon_you_too_many_kinds_objec_abc37a: "You have too many kinds of objects. Clear your inventory."
  npc_override_1@md_gef_FridayDungeon_your_base_level_too_low_19f1d0: "Your base level is too low to select this, you need to be level {0} or above."
  npc_override_1@md_gef_FridayDungeon_your_base_level_too_low_a225a5: "Your base level is too low, come back when you hit level 130."
  npc_override_1@md_gef_FridayDungeon_your_party_leader_yet_cr_67dc26: "Your party leader has not yet created the Memorial dungeon."
