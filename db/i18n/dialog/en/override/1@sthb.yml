  npc_override_1@sthb_SkyFortress_menu_earnest_db55bd: "Earnest: I'm angry... It's noisy... I'll wipe them all up..."
  npc_override_1@sthb_SkyFortress_menu_immortal_2405d5: "Immortal Cursed Knight: I can't...I can't seem to control the power!"
  npc_override_1@sthb_SkyFortress_menu_immortal_51fe05: "Immortal Wind Ghost: Foolish human...You're praying for death..."
  npc_override_1@sthb_SkyFortress_menu_immortal_5f2a35: "Immortal Wind Ghost: The power boiling inside my body...It sure feels good..."
  npc_override_1@sthb_SkyFortress_menu_immortal_609316: "Immortal Wind Ghost: I feel more power filling up inside..."
  npc_override_1@sthb_SkyFortress_menu_immortal_668f05: "Immortal Cursed Knight: The perishable is nothing but a handful of ash before the Immortal Knight!"
