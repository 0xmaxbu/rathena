  npc_override_1@sthb_SkyFortress_menu_immortal_94ecd5: "Immortal Cursed Knight: Doom to the petty thief coveting the treasure at the fortress..."
  npc_override_1@sthb_SkyFortress_menu_immortal_a995d7: "Immortal Wind Ghost: I will kill you slowly...from the deep side of your lung..."
  npc_override_1@sthb_SkyFortress_menu_immortal_b81a13: "Immortal Cursed Knight: What kind of intruder is trying to wake me up..."
