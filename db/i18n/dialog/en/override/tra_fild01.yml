Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_tra_fild01_TrainingZone123_aaaah_stop_stop_i_m_9a98b8: "Aaaah- Stop! Stop! I'm not a monster. Don't attack me."
  npc_override_tra_fild01_TrainingZone123_basic_skill_level_eff4ec: "Basic Skill Level 6 to"
  npc_override_tra_fild01_TrainingZone123_dad_told_me_dummys_staff_4493da: "Dad told me! The Dummys with staff icons above their heads are strong against magic!"
  npc_override_tra_fild01_TrainingZone123_dummies_training_grounds_7ae794: "Dummies in the training grounds that are strong against physical attacks have a sword icon above their heads, and dummies that are strong against magic attacks have a staff icon above their heads."
  npc_override_tra_fild01_TrainingZone123_enter_basic_training_gro_0ae5fb: "��Enter Basic Training Ground"
  npc_override_tra_fild01_TrainingZone123_fee_zeny_9bca12: "The fee is 1000 Zeny."
  npc_override_tra_fild01_TrainingZone123_gororong_01ed0b: "Gororong-"
  npc_override_tra_fild01_TrainingZone123_guild_storage_only_avail_edb3e5: "The guild storage is only available for guild members."
  npc_override_tra_fild01_TrainingZone123_hi_weather_really_nice_i_5b7afb: "Hi! The weather is really nice, isn't it? I came to check out the new training grounds."
  npc_override_tra_fild01_TrainingZone123_hohoho_seeing_young_peop_793cca: "Hohoho- Seeing the young people sweating and working hard makes me feel a bit energized."
  npc_override_tra_fild01_TrainingZone123_i_am_afraid_someone_else_90b72d: "I am afraid someone else is using the warehouse right now."
  npc_override_tra_fild01_TrainingZone123_i_am_afraid_you_enough_d2bacb: "I am afraid you do not have enough money to settle the fee."
  npc_override_tra_fild01_TrainingZone123_i_ll_send_you_basic_314ec2: "I'll send you to the Basic Training Ground."
  npc_override_tra_fild01_TrainingZone123_i_ll_send_you_training_4c77da: "I'll send you to the 1/10 Training Ground."
  npc_override_tra_fild01_TrainingZone123_i_ll_send_you_training_8d9ca4: "I'll send you to the 1/100 Training Ground."
  npc_override_tra_fild01_TrainingZone123_i_m_definitely_practicin_63d25c: "I'm definitely not practicing here after getting beat up by a passing Doram. Remember!"
  npc_override_tra_fild01_TrainingZone123_i_m_sorry_you_3aa10c: "I'm sorry, but you"
  npc_override_tra_fild01_TrainingZone123_i_open_guild_storage_you_32b256: "I will open the guild storage for you then. Have a memorable time!"
  npc_override_tra_fild01_TrainingZone123_if_you_know_you_ll_0a786d: "If you know this, you'll be able to hit them harder, right?"
  npc_override_tra_fild01_TrainingZone123_if_you_visit_rockridge_y_282610: "If you visit RockRidge, you can meet our living, breathing Cacti, the Cactus. Come visit. Hahaha."
  npc_override_tra_fild01_TrainingZone123_if_you_want_go_prontera_a173b6: "If you want to go to Prontera, you can exit through the guards located throughout the area or through the warp portals at 3 and 9 o'clock. Seriously."
  npc_override_tra_fild01_TrainingZone123_menu_there_34ec25: "There are three training grounds: the basic training ground, the 1/10 training ground, and the 1/100 training ground. I'll leave the differences between each training ground for you to discover for yourself."
  npc_override_tra_fild01_TrainingZone123_meow_823296: "Meow-"
  npc_override_tra_fild01_TrainingZone123_msg_5bab61: "?"
  npc_override_tra_fild01_TrainingZone123_my_friend_said_bone_icon_6a48cd: "My friend said it has a bone icon above its head...? You have to see it first."
  npc_override_tra_fild01_TrainingZone123_need_move_different_area_5a8073: "Need to move to a different area within the training ground? Please select the location you'd like to move to."
  npc_override_tra_fild01_TrainingZone123_need_novice_s_68e5c0: "need the Novice's"
  npc_override_tra_fild01_TrainingZone123_oh_right_move_another_tr_7b4f24: "Oh, right! To move to another training ground, you can use the warp portals at 3 o'clock and 9 o'clock. Remember!"
  npc_override_tra_fild01_TrainingZone123_oh_way_did_you_know_371571: "Oh, by the way. Did you know that?"
  npc_override_tra_fild01_TrainingZone123_old_training_grounds_wer_cdc1ae: "The old training grounds weren't bad, but they were actually renting space that beginners had been using for a long time, so there were some inconveniences."
  npc_override_tra_fild01_TrainingZone123_please_come_back_after_c_c20cd8: "Please come back after checking the guild skill and the permission to access the warehouse."
  npc_override_tra_fild01_TrainingZone123_please_try_again_after_w_8e8536: "Please try again after a while."
  npc_override_tra_fild01_TrainingZone123_prontera_4f98c0: "��To Prontera"
  npc_override_tra_fild01_TrainingZone123_remember_once_you_ve_cho_9fe73b: "Remember! Once you've chosen a name, it's hard to change, so choose wisely."
  npc_override_tra_fild01_TrainingZone123_royal_court_set_up_train_d228c4: "The royal court has set up a training ground for adventurers who wish to test their skills. If you wish to test your skills under various conditions, we will send you to the training ground."
  npc_override_tra_fild01_TrainingZone123_seems_yet_possible_your_db9d21: "It seems that it is not yet possible for your guild to use the guild warehouse or you do not have access permissions for the warehouse."
  npc_override_tra_fild01_TrainingZone123_so_if_you_defeat_those_4acf1d: "So... if you can defeat those Dummys with magic, you're truly strong, right?!"
  npc_override_tra_fild01_TrainingZone123_storage_1329c8: "�� Storage 1"
  npc_override_tra_fild01_TrainingZone123_they_re_building_such_sp_42282c: "But they're building such a spacious and nice new training ground. It seems like they're quite financially sound these days!"
  npc_override_tra_fild01_TrainingZone123_they_say_training_dummys_a7e159: "They say training with the Dummys with cat icons above them will help you fight Doram in PvP."
  npc_override_tra_fild01_TrainingZone123_use_storage_service_03f6ae: "use the Storage Service."
  npc_override_tra_fild01_TrainingZone123_way_where_s_undead_dummy_c1fccb: "By the way, where's the Undead Dummy?"
  npc_override_tra_fild01_TrainingZone123_whew_thank_you_some_peop_33c6ee: "Whew- Thank you. Some people often mistake me for the monster Mukka, but I'm a cactus from a place called RockRidge."
  npc_override_tra_fild01_TrainingZone123_whoosh_cha_whoosh_cha_d90bcf: "Whoosh- Cha-Whoosh- Cha-"
  npc_override_tra_fild01_TrainingZone123_you_like_use_storage_zen_701e21: "Would you like to use the Storage? 1000 Zeny is required to use the training ground Storage. Please select the Storage you wish to use."
  npc_override_tra_fild01_TrainingZone123_your_first_time_training_0c4d70: "Is this your first time at the training grounds? I'll explain myself, as a veteran."
  npc_override_tra_fild01_TrainingZone123_zeny_required_use_traini_3ceed5: "^4d4dff1000 Zeny is required to use the training grounds Storage.^000000"
