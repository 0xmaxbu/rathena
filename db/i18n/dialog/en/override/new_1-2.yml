Body:
  npc_override_new_1-2_novice_about_party_system_401cac: "about the Party System."
  npc_override_new_1-2_novice_about_passive_skills_0d4b60: "about the Passive Skills."
  npc_override_new_1-2_novice_above_use_emoticons_89fd69: "or above to use emoticons."
  npc_override_new_1-2_novice_above_use_party_system_52dbfc: "or above to use the Party System."
  npc_override_new_1-2_novice_above_you_open_your_own_e7f664: "or above, you can open your own Chat Room. You can either click"
  npc_override_new_1-2_novice_according_your_personal_5e4c53: "according to your personal needs, so ask about the Status you wish to better understand. First, open your Status Window by using the '^3355FFAlt^000000 + ^3355FFA^000000' keys."
  npc_override_new_1-2_novice_acolyte_s_support_abilit_a1dfba: "The Acolyte's support abilities make them a welcome addition to any party. In difficult situations, the Acolyte's skills will ensure the survival of the party, allowing other members to focus on offense."
  npc_override_new_1-2_novice_active_skills_assigned_h_698873: "active skills can be assigned to a Hotkey and dragged to the Hotkey bar. Active Skills have colored, square shaped icons that can be double-clicked and used."
  npc_override_new_1-2_novice_active_skills_like_first_1f6a5e: "Active skills, like First Aid, require a certain amount of SP to use them. The First Aid skill is useful for Novices, since it refills a little bit of HP."
  npc_override_new_1-2_novice_active_skills_unlike_pas_f47305: "Active Skills, unlike Passive Skills which don't use any SP, require SP each time that"
  npc_override_new_1-2_novice_addition_merchants_may_r_70efdc: "In addition, Merchants may rent"
  npc_override_new_1-2_novice_adorable_novice_de6ddf: "An adorable Novice"
  npc_override_new_1-2_novice_adventurer_s_suit_c67656: "^0000331 Adventurer's Suit^000000"
  npc_override_new_1-2_novice_adventures_throughout_3e19ad: "adventures throughout the"
  npc_override_new_1-2_novice_after_all_5f3290: "After all..."
  npc_override_new_1-2_novice_after_learning_some_stro_300482: "After learning some strong attack skills, the Swordman is almost unbeatable in a melee fight."
  npc_override_new_1-2_novice_after_you_receive_all_su_23b0f1: "After you receive all the supplies, I'll teleport you to the Mage town."
  npc_override_new_1-2_novice_after_you_receive_all_su_2416cb: "After you receive all the supplies, I'll teleport you to the Archer town."
  npc_override_new_1-2_novice_after_you_receive_all_su_360138: "After you receive all the supplies, I will teleport you to the merchant town."
  npc_override_new_1-2_novice_after_you_receive_all_su_5a072d: "After you receive all the supplies, I'll teleport you behind the Sanctuary."
  npc_override_new_1-2_novice_after_you_receive_all_su_67a866: "After you receive all the supplies, I'll teleport you to the Thief town."
  npc_override_new_1-2_novice_after_you_receive_all_su_7db01f: "After you receive all the supplies, I will teleport you to the Swordman Association."
  npc_override_new_1-2_novice_afterwards_person_21efff: "Afterwards, that person will"
  npc_override_new_1-2_novice_against_monsters_don_t_y_b2b389: "against monsters, don't you?"
  npc_override_new_1-2_novice_agility_affects_your_fle_955c12: "Agility affects your Flee Rate and Attack Speed. The higher your Flee Rate, the better chance you have of avoiding enemy attacks."
  npc_override_new_1-2_novice_agility_agi_f195cc: "on to Agility (AGI)."
  npc_override_new_1-2_novice_ah_i_must_say_d59fc8: "Ah~ I must say,"
  npc_override_new_1-2_novice_ah_i_see_df4b54: "Ah, I see."
  npc_override_new_1-2_novice_ah_right_7a003b: "Ah, right."
  npc_override_new_1-2_novice_ah_right_right_067c4c: "Ah! Right, right."
  npc_override_new_1-2_novice_ah_you_ve_applied_old_b8aa25: "Ah, {0}, you've applied for an old training course that we no longer provide for our trainees. Let me issue a new proof of registration for you."
  npc_override_new_1-2_novice_alberta_port_city_where_845e29: "^003399Alberta^000000, the port city, is where the Merchant Guild is located. You must also go to Alberta if you wish to travel by sea."
  npc_override_new_1-2_novice_all_items_you_carrying_m_dd5077: "All of the items you are carrying must be quite a burden. Where did you get so much things? Please lighten your weight by getting rid of things you don't need."
  npc_override_new_1-2_novice_allow_you_attack_monster_676af8: "This will allow you to attack monsters by using the Heal skill without holding the shift key. Handy, huh?"
  npc_override_new_1-2_novice_allowed_use_your_9af894: "allowed to use your"
  npc_override_new_1-2_novice_allows_you_chat_dcc845: "allows you to chat with"
  npc_override_new_1-2_novice_alright_let_me_start_st_764642: "Alright, let me start the 1st personality test. Please relax"
  npc_override_new_1-2_novice_alright_practice_makes_p_902895: "Alright, practice makes perfect! Let me send you to the guys at Field Combat Training. Take care!"
  npc_override_new_1-2_novice_alright_then_meantime_yo_681632: "Alright then. In the meantime, you might want to speak to the assistant tutors, as the basic information taught in the essential courses may not be enough for new adventurers."
  npc_override_new_1-2_novice_also_affect_your_attack_8018c7: "have will also affect your attack accuracy. Attack accuracy is calculated by the number of your Base Level added to your DEX."
  npc_override_new_1-2_novice_also_each_weapon_its_str_4be060: "Also, each weapon has its strengths and weaknesses. The size of the weapon will affect the damage it will deal to monsters."
  npc_override_new_1-2_novice_also_equipment_consumabl_bdc8d5: "Also, equipment and consumable items can also be assigned to a Hotkey through the Hotkey bar."
  npc_override_new_1-2_novice_also_known_as_stats_5842bd: "Also known as 'Stats,'"
  npc_override_new_1-2_novice_also_provided_fc0a71: "is also provided by"
  npc_override_new_1-2_novice_also_there_experience_be_b2e505: "Also, there is the experience benefit for party play which allows you to gain more experience points than playing solo. You can take advantage of this system for faster leveling."
  npc_override_new_1-2_novice_also_you_register_charac_b5894a: "Also you can register that character as your friend in the same way. If you are the master"
  npc_override_new_1-2_novice_alt_l_click_each_icon_bb9535: "('^3355FFAlt^000000' + '^3355FFL^000000') and click each icon to see the command to display"
  npc_override_new_1-2_novice_alt_s_5b7ad5: "('^3355FFAlt^000000' + '^3355FFS^000000')"
  npc_override_new_1-2_novice_alt_s_you_check_descript_2edf6a: "('^3355FFAlt^000000' + '^3355FFS^000000'), you can check the descriptions of the skills, but I've prepared this lesson for"
  npc_override_new_1-2_novice_alt_v_a31972: "is '^3355FFAlt^000000 + ^3355FFV^000000.'"
  npc_override_new_1-2_novice_although_similar_your_fl_7e75d7: "Although similar to your Flee Rate, Perfect Dodge is a separate factor in attack evasion that is calculated differently."
  npc_override_new_1-2_novice_although_you_ll_0804aa: "Although you'll"
  npc_override_new_1-2_novice_although_you_re_very_str_cbce7a: "Although you're very straight forward and simple minded, you"
  npc_override_new_1-2_novice_always_your_side_7cf7e6: "always on your side."
  npc_override_new_1-2_novice_among_following_93c2b6: "among the following."
  npc_override_new_1-2_novice_amount_dex_you_6bdfff: "The amount of DEX that you"
  npc_override_new_1-2_novice_amount_job_experience_3d8a39: "amount of Job experience.^000000"
  npc_override_new_1-2_novice_amount_sp_required_f3f49c: "The amount of SP required"
  npc_override_new_1-2_novice_another_benefit_increasi_b96f26: "Another benefit to increasing AGI is that your Attack Speed (ASPD) will also increase, meaning the time between your melee attacks will be reduced."
  npc_override_new_1-2_novice_any_questions_05ed1b: "any questions,"
  npc_override_new_1-2_novice_any_questions_23673f: "have any questions."
  npc_override_new_1-2_novice_anymore_oh_they_6e555e: "anymore! Oh! They"
  npc_override_new_1-2_novice_anyway_merchants_blacksm_47bd34: "Anyway, Merchants, Blacksmiths and Alchemists must also learn the ^3355FFPush Cart^000000 skill in order to be able to rent a cart."
  npc_override_new_1-2_novice_anyway_you_48f0ed: "Anyway, you are"
  npc_override_new_1-2_novice_archer_class_experts_usi_44272a: "The Archer class are experts in using Bow weapons, and are useful in parties for their long range attacks."
  npc_override_new_1-2_novice_archer_guild_located_nor_155a72: "The Archer Guild is located to the NorthWest in Payon. Please remember this."
  npc_override_new_1-2_novice_area_if_you_re_bored_9462e7: "this area if you're bored."
  npc_override_new_1-2_novice_as_i_expected_60d8bf: "As I expected,"
  npc_override_new_1-2_novice_as_name_implies_7b08ff: "As the name implies, the"
  npc_override_new_1-2_novice_as_you_check_b4a598: "As you check"
  npc_override_new_1-2_novice_as_you_cute_602830: "as you are cute~!"
  npc_override_new_1-2_novice_as_you_gain_experience_550a5d: "As you gain experience,"
  npc_override_new_1-2_novice_as_you_go_window_shoppin_714988: "As you go window shopping,"
  npc_override_new_1-2_novice_ask_me_if_you_357af6: "ask me if you"
  npc_override_new_1-2_novice_aspd_however_5662a3: "ASPD, however,"
  npc_override_new_1-2_novice_assistant_tutors_don_t_y_651696: "assistant tutors, don't you?"
  npc_override_new_1-2_novice_assistant_tutors_room_ri_9ebf0b: "The assistant tutors in the room to the right possess useful knowledge. There are also a few interesting places hidden within this area. Good luck!"
  npc_override_new_1-2_novice_base_level_dex_2fb7cb: "Base Level 40 and have 20 DEX,"
  npc_override_new_1-2_novice_base_level_displays_job_4dfa7d: "Base Level displays the Job level of your character. When you just start a job, you will be at"
  npc_override_new_1-2_novice_basic_info_window_135ede: "of the Basic Info window,"
  npc_override_new_1-2_novice_basic_info_window_568a42: "Basic Info window."
  npc_override_new_1-2_novice_basic_info_window_ce6d6f: "the Basic Info Window,"
  npc_override_new_1-2_novice_basic_info_window_series_1d8c4d: "Basic Info Window is a series of buttons that will open other interface windows. Click them one by one, and check what you can do with them."
  npc_override_new_1-2_novice_basic_info_window_your_c_b382a8: "In the Basic Info window, your current experience points are displayed in the Base Level experience bar."
  npc_override_new_1-2_novice_basic_interfaces_973228: "Basic Interfaces..."
  npc_override_new_1-2_novice_basic_interfaces_you_sho_960608: "the Basic Interfaces, you should remember these terms, just because we'll be using them frequently."
  npc_override_new_1-2_novice_basic_skill_917125: "'^3355FFBasic Skill^000000.'"
  npc_override_new_1-2_novice_basic_skill_level_2e2293: "^4d4dffBasic Skill Level 7^000000"
  npc_override_new_1-2_novice_basic_skill_level_5e5a66: "^4D4DFFBasic Skill Level 2^000000"
  npc_override_new_1-2_novice_basic_skill_level_above_fe42b9: "at ^4D4DFFBasic Skill Level 6^000000 or above."
  npc_override_new_1-2_novice_basic_skills_8cc9c1: "The Basic Skills are"
  npc_override_new_1-2_novice_basically_character_who_1abd76: "Basically, a character who deals the most damage on a monster receives the most experience points from the monster."
  npc_override_new_1-2_novice_basically_you_must_enter_d29a5f: "Basically, you must enter the castle in order to start your adventures."
  npc_override_new_1-2_novice_battle_axe_e548cc: "^0000331 Battle Axe^000000"
  npc_override_new_1-2_novice_battle_practice_e8be74: "With this battle practice,"
  npc_override_new_1-2_novice_because_your_drive_desir_f95283: "Because of your drive and desire to succeed, ^696969Merchant^000000 is the most suitable job for you."
  npc_override_new_1-2_novice_become_acolyte_36041d: "to become an Acolyte."
  npc_override_new_1-2_novice_become_archer_793f7e: "to become an Archer."
  npc_override_new_1-2_novice_become_mage_b42230: "to become a Mage."
  npc_override_new_1-2_novice_become_merchant_f245a7: "to become a Merchant."
  npc_override_new_1-2_novice_become_nice_player_31a19c: "become a nice player,"
  npc_override_new_1-2_novice_become_swordsman_660e69: "to become a Swordsman."
  npc_override_new_1-2_novice_become_thief_697b12: "to become a Thief."
  npc_override_new_1-2_novice_before_we_begin_your_a0e6aa: "before we begin your"
  npc_override_new_1-2_novice_before_we_start_talking_d341a1: "Before we start talking about"
  npc_override_new_1-2_novice_best_i_wish_you_91fad7: "best, and I wish you"
  npc_override_new_1-2_novice_best_luck_c3bd07: "the best of luck!"
  npc_override_new_1-2_novice_best_matches_you_6c5197: "that best matches you from"
  npc_override_new_1-2_novice_between_hotkey_sets_a2b216: "between Hotkey sets by"
  npc_override_new_1-2_novice_bit_trouble_0b5ea3: "a bit of trouble"
  npc_override_new_1-2_novice_bottom_basic_info_window_189d5d: "At the bottom of the Basic Info Window, you will see two different experience gauge bars. The top bar is for your current Base Level, and the bottom one displays experience for your current Job Level."
  npc_override_new_1-2_novice_bottom_right_chat_window_2dbae3: "At the bottom right of the Chat Window, you should see 2 blue buttons. The left button allows you to change your chatting options."
  npc_override_new_1-2_novice_bridge_located_f3b977: "the bridge located"
  npc_override_new_1-2_novice_bruce_189c1e: "to Bruce for"
  npc_override_new_1-2_novice_but_2e7fce: "But..."
  npc_override_new_1-2_novice_button_cf20ee: "this button?"
  npc_override_new_1-2_novice_calm_down_shion_fb9c61: "Calm down Shion."
  npc_override_new_1-2_novice_careful_6ec846: "be careful!"
  npc_override_new_1-2_novice_careful_get_42ba59: "be careful, it can get"
  npc_override_new_1-2_novice_cart_greatly_expands_the_b205b6: "a Cart that greatly expands their carrying capacity and allows them to open shops with their own items and prices."
  npc_override_new_1-2_novice_cart_rental_service_2f0474: "The Cart Rental service"
  npc_override_new_1-2_novice_case_ghost_property_mons_47ec7e: "In the case of Ghost property monsters, normal weapons cannot do any harm. However, a weapon with any other property will be able to deal out some damage."
  npc_override_new_1-2_novice_case_you_receive_whole_e_535b10: "In this case, you will receive 2//3 of the whole experience points that monster can give you, the other one will receive 1//3."
  npc_override_new_1-2_novice_castle_94cb9b: "of the castle is"
  npc_override_new_1-2_novice_character_statuses_stren_756f23: "the Character Statuses are Strength, Agility, Vitality, Intelligence, Dexterity and Luck."
  npc_override_new_1-2_novice_charge_db867f: "charge of the"
  npc_override_new_1-2_novice_charge_differ_b0f6d0: "charge will differ from"
  npc_override_new_1-2_novice_chat_button_basic_info_w_6651ba: "the ^3355FFchat^000000 button in the Basic Info Window or just press '^3355FFAlt^000000' + '^3355FFC^000000.'"
  npc_override_new_1-2_novice_chat_window_80a0d9: "The ^3355FFChat Window^000000 is"
  npc_override_new_1-2_novice_check_if_you_first_aid_4b3e90: "and check if you have the ^3355FFFirst Aid^000000 skill icon. To use it, you need to double-click that skill icon."
  npc_override_new_1-2_novice_check_out_commands_even_c265c9: "To check out the commands for even more emoticons, type the command ^4d4dff//emotion^000000 into your Chat Window to see the list~"
  npc_override_new_1-2_novice_choose_subject_you_1498cc: "Choose the subject you"
  npc_override_new_1-2_novice_choose_whether_accept_yo_2c495a: "choose whether or not to accept your request. If your trade request is accepted, the Trade Window will appear."
  npc_override_new_1-2_novice_chosen_town_b3877f: "to the chosen town."
  npc_override_new_1-2_novice_city_magic_geffen_where_bd4644: "The city of magic, ^993300Geffen^000000, is where people go to become Mages and Wizards."
  npc_override_new_1-2_novice_class_explanation_6bc137: "'Class Explanation'"
  npc_override_new_1-2_novice_click_equip_button_afb21a: "Click the ^3355FFequip^000000 button"
  npc_override_new_1-2_novice_click_when_you_press_mou_fcc4f8: "that is a click. When you press the mouse button twice in a row, that's a double-click."
  npc_override_new_1-2_novice_clicking_friend_button_b_bb00c7: "by clicking the ^3355FFfriend^000000 button in the Basic Info window. The shortcut for the Party Window is '^3355FFAlt^000000 + ^3355FFZ^000000.' You can use this window to check on the members of your party."
  npc_override_new_1-2_novice_clicking_these_menu_butt_6e4eb1: "Clicking these Menu buttons will open other Interface Windows, such as the Inventory Window"
  npc_override_new_1-2_novice_cliff_you_d_feel_4755df: "a cliff, you'd feel"
  npc_override_new_1-2_novice_come_2cd911: "Come in!"
  npc_override_new_1-2_novice_come_me_when_you_0b7cd6: "Come to me when you"
  npc_override_new_1-2_novice_comes_happy_go_lucky_sen_d428e3: "comes a happy-go-lucky sense of adventure, and a desire to explore."
  npc_override_new_1-2_novice_common_monster_propertie_59c036: "Common monster properties include Water, Wind, Earth, Fire, Shadow, Ghost and Holy. If you attack a monster with an opposing property, you can inflict additional damage~"
  npc_override_new_1-2_novice_competing_other_people_8f6845: "competing with other people..."
  npc_override_new_1-2_novice_composite_bow_186812: "^0000331 Composite Bow^000000"
  npc_override_new_1-2_novice_congratulations_36b252: "Congratulations!"
  npc_override_new_1-2_novice_cotton_shirt_8d1cb2: "a Cotton Shirt."
  npc_override_new_1-2_novice_course_skill_we_very_con_704af8: "Of course for this skill, we do have a very convenient option for lazy people too. Type the command ^E79E29//ns^000000 in your Chat Window."
  npc_override_new_1-2_novice_course_you_cf4421: "Of course, you"
  npc_override_new_1-2_novice_course_you_type_bawi_bo_021c11: "Of course, you can type ^4D4DFF//bawi^000000, ^4D4DFF//bo^000000 and ^4D4DFF//gawi^000000, which mean rock, paper, scissors in Korean, into your Chat Window."
  npc_override_new_1-2_novice_critical_attack_flee_rat_fd766b: "for a critical attack, the Flee Rate and a small amount of damage you deal to monsters."
  npc_override_new_1-2_novice_critical_attack_start_va_cd0ab4: "For a critical attack, the start value is 1 for everyone and it's increased by^4d4dff 1^000000 for every ^4d4dff3 LUK^000000."
  npc_override_new_1-2_novice_current_weight_items_you_0dc177: "The current weight of the items you are carrying will be displayed next to your maximum weight limit."
  npc_override_new_1-2_novice_cute_little_novice_ef294f: "cute little Novice~!"
  npc_override_new_1-2_novice_cutter_2ce239: "^0000331 Cutter^000000"
  npc_override_new_1-2_novice_despite_being_physically_cc91a7: "Despite being physically weaker, Archers possess high accuracy with powerful long range bows. This allows them to attack and kill monsters from a safe distance."
  npc_override_new_1-2_novice_despite_their_physical_w_0e6931: "Despite their physical weakness, they are able to do massive damage with their powerful spells. This fact alone attracts many people to join this class."
  npc_override_new_1-2_novice_dexterity_dex_b87e74: "is Dexterity (DEX)"
  npc_override_new_1-2_novice_dexterity_mainly_affects_c0dbae: "Dexterity mainly affects your accuracy, attack speed (ASPD)"
  npc_override_new_1-2_novice_did_you_need_more_help_342769: "Did you need more help?"
  npc_override_new_1-2_novice_did_you_see_943fd9: "Did you see...?"
  npc_override_new_1-2_novice_die_power_8c74af: "and die for power!"
  npc_override_new_1-2_novice_different_subject_2fe882: "a different subject?"
  npc_override_new_1-2_novice_differs_job_class_c1bf55: "differs by Job Class,"
  npc_override_new_1-2_novice_displayed_your_defense_d_5d1cea: "displayed in your Defense is the defense calculated from your Equipment and Armor."
  npc_override_new_1-2_novice_distribution_exp_items_p_d31fa7: "the distribution of EXP and items to the party. You can also check the location of your party members on the Mini-Map."
  npc_override_new_1-2_novice_distribution_items_distr_e10fcc: "the distribution of items or the distribution of experience which party members have gained together, but it's that you try that out on your own later on."
  npc_override_new_1-2_novice_don_t_worry_6aa96e: "Don't worry,"
  npc_override_new_1-2_novice_don_t_worry_ll_short_3af0de: "Don't worry, it'll be short."
  npc_override_new_1-2_novice_don_t_worry_so_much_fec600: "But don't worry so much,"
  npc_override_new_1-2_novice_don_t_you_please_00175d: "don't you? Please"
  npc_override_new_1-2_novice_don_t_you_worry_about_258cb6: "Don't you worry about the Steal skill causing you to not find any items after you kill them. Using the Steal skill does not at all affect the item drop rate for monsters once they're killed."
  npc_override_new_1-2_novice_double_click_30547b: "double-click"
  npc_override_new_1-2_novice_dragging_when_you_move_y_ad44fd: "Dragging is when you move your Mouse while holding down the"
  npc_override_new_1-2_novice_dungeon_you_run_21a25e: "a dungeon, you run"
  npc_override_new_1-2_novice_easy_kill_careful_a87d44: "and easy to kill. But be careful,"
  npc_override_new_1-2_novice_effort_come_here_ca4a2a: "an effort to come here."
