  npc_override_wolfvill_quests_18_i_m_saying_i_because_8e95bf: "I'm saying I can do it because I can do it. Everybody, get out of the way."
  npc_override_wolfvill_quests_18_i_m_so_exhausted_355b20: "I'm so exhausted..."
  npc_override_wolfvill_quests_18_i_m_someone_who_discrimi_ef773c: "I'm not someone who discriminates against natives, but they lack responsibility, so if I scold them, I might just leave it at that."
  npc_override_wolfvill_quests_18_i_m_sorry_00dca6: "I'm sorry."
  npc_override_wolfvill_quests_18_i_m_sorry_34a96e: "I'm sorry..."
  npc_override_wolfvill_quests_18_i_m_sorry_burdening_you_cdcee6: "I'm sorry for burdening you with this annoying task."
  npc_override_wolfvill_quests_18_i_m_sorry_could_we_6b9b51: "I'm sorry, {0} but could we leave after I quickly buy something?"
  npc_override_wolfvill_quests_18_i_m_sorry_i_ll_73d885: "I'm sorry. I'll be there soon!"
  npc_override_wolfvill_quests_18_i_m_sorry_items_we_643267: "I'm sorry, but the items we have here are all low in stock..."
  npc_override_wolfvill_quests_18_i_m_sorry_keeping_you_428bfd: "I'm sorry for keeping you busy. Thank you so much!"
  npc_override_wolfvill_quests_18_i_m_sorry_okay_if_3eb085: "{0}, I'm sorry, but would it be okay if I just quickly buy the items and then leave?"
  npc_override_wolfvill_quests_18_i_m_sorry_sir_i_7d41c6: "...I'm sorry, sir. I've got a little something going on right now, and I have to go."
  npc_override_wolfvill_quests_18_i_m_sorry_we_don_1b7110: "I'm sorry, but we don't have much stock at the moment."
  npc_override_wolfvill_quests_18_i_m_sure_9b3436: "I'm not sure?"
  npc_override_wolfvill_quests_18_i_m_sure_everyone_their_fd29ce: "I'm sure everyone has their own thoughts, but I'd say this."
  npc_override_wolfvill_quests_18_i_m_sure_higher_ups_076500: "I'm sure the higher-ups will reprimand me for being indulgent, but I can't turn my eyes away from a monster problem!"
  npc_override_wolfvill_quests_18_i_m_sure_how_much_f81dd3: "I'm not sure how much you know about Arunafeltz, but..."
  npc_override_wolfvill_quests_18_i_m_sure_if_he_3ee2de: "I'm not sure if he's still at the plaza, but maybe we could ask the people there to find out where Maram went?"
  npc_override_wolfvill_quests_18_i_m_sure_if_he_936e56: "I'm not sure if he'll agree to meet us though..."
  npc_override_wolfvill_quests_18_i_m_sure_if_i_1e33cf: "I'm not sure if I have everything you need."
  npc_override_wolfvill_quests_18_i_m_sure_my_deputy_ffe93a: "I'm not sure, but my deputy... No, I need to go and confirm it myself."
  npc_override_wolfvill_quests_18_i_m_sure_what_exactly_b35e1e: "I'm not sure what exactly is causing the dissatisfaction."
  npc_override_wolfvill_quests_18_i_m_sure_where_my_07df6e: "I'm not sure where my belongings went either."
  npc_override_wolfvill_quests_18_i_m_sure_you_ll_80e967: "I'm sure you'll be happy because I didn't abandon you."
  npc_override_wolfvill_quests_18_i_m_tired_hearing_things_11af93: "I'm tired of hearing things like 'Do you even know who I am?' when it comes to my native background."
  npc_override_wolfvill_quests_18_i_m_trying_keep_out_f8fe61: "I'm trying to keep it out of the way so it doesn't affect anything else, but I guess that doesn't work either."
  npc_override_wolfvill_quests_18_i_m_upset_there_s_e1cb39: "I'm upset, but there's no chance of winning now. Let's fix it and try again"
  npc_override_wolfvill_quests_18_i_m_very_grateful_someon_bc9e2c: "I'm very grateful to have someone to listen. Blessings upon them."
  npc_override_wolfvill_quests_18_i_may_know_much_about_20a7e8: "I may not know much about this kind of thing, but from my limited perspective, won't they continue like this in the future? Shouldn't we arm ourselves just in case?"
  npc_override_wolfvill_quests_18_i_may_representative_vil_a0f1aa: "I may not be a representative at the village meetings... but we'll show some courtesy."
  npc_override_wolfvill_quests_18_i_mean_78bd9a: "I mean it!"
  npc_override_wolfvill_quests_18_i_mean_amethyst_fragment_cb8dad: "I mean, the Amethyst Fragment."
  npc_override_wolfvill_quests_18_i_mean_i_t_mention_aebf77: "I mean, I can't mention it."
  npc_override_wolfvill_quests_18_i_mean_we_re_going_f5fe48: "I mean, we're not going to live the way we do now, even if we do reclaim our land. We already live differently than we used to."
  npc_override_wolfvill_quests_18_i_might_get_scolded_tomo_38f90b: "I might get scolded tomorrow, but honestly, I'm happier that I finally got my salary."
  npc_override_wolfvill_quests_18_i_must_succeed_here_aeb042: "I must succeed here."
  npc_override_wolfvill_quests_18_i_need_few_days_so_c2a6fe: "I need it in a few days, so I can't buy it in bulk~"
  npc_override_wolfvill_quests_18_i_need_go_top_a68bba: "I need it to go to the top"
  npc_override_wolfvill_quests_18_i_need_move_expedition_c_640c92: "I need to move the expedition carriage back to the village first. We should gather the remaining supplies and apologize for the inconvenience.."
  npc_override_wolfvill_quests_18_i_need_place_return_81c48e: "But I need a place to return to."
  npc_override_wolfvill_quests_18_i_need_steel_very_unusua_7c2c33: "I would need 1 Steel and 10 Very Unusual Crystal, and the Very Unusual Crystal can be obtained from the Gray Wolf."
  npc_override_wolfvill_quests_18_i_never_imagined_youth_s_f52d20: "I never imagined Youth would do such a thing."
  npc_override_wolfvill_quests_18_i_never_left_village_sin_f4d33d: "I have never left this village since I was born."
  npc_override_wolfvill_quests_18_i_no_interest_their_powe_432199: "I have no interest in their power struggle."
  npc_override_wolfvill_quests_18_i_no_objections_cc83d2: "I have no objections."
  npc_override_wolfvill_quests_18_i_nowhere_else_go_either_1ca9f8: "I have nowhere else to go either, so can I just start acting however I want?"
  npc_override_wolfvill_quests_18_i_nowhere_else_go_here_287dd7: "I have nowhere else to go but here."
  npc_override_wolfvill_quests_18_i_once_dreamed_being_adv_8cd773: "I once dreamed of being an adventurer myself. But then I took an arrow to the knee and now I'm stuck in the city."
  npc_override_wolfvill_quests_18_i_once_dreamed_being_adv_9fefea: "I once dreamed of being an adventurer myself. But then I took an arrow to the knee and got stuck in the city."
  npc_override_wolfvill_quests_18_i_only_see_future_just_ff918a: "I can only see a future ^e5555ejust the three of us went and our things were taken away on the spot^000000."
  npc_override_wolfvill_quests_18_i_owe_him_favor_helping_517b6c: "I owe him a favor for helping earlier, so I'll ask ^e5555eSuad^000000."
  npc_override_wolfvill_quests_18_i_projected_my_original_f9f81d: "I projected my original form because it seems like a story you all need to hear together."
  npc_override_wolfvill_quests_18_i_promised_pay_all_once_cb9864: "I promised to pay it all at once next month, but using my favorite adventurer."
  npc_override_wolfvill_quests_18_i_really_dislike_hearing_314716: "I really dislike hearing the phrase 'they must have done something wrong.' What exactly does 'something wrong' mean?"
  npc_override_wolfvill_quests_18_i_really_don_t_understan_b76bf2: "I really don't understand!"
  npc_override_wolfvill_quests_18_i_really_enjoy_reading_i_5cfcc3: "I really enjoy reading interesting stories."
  npc_override_wolfvill_quests_18_i_really_i_really_want_2124fe: "I really... I really want to go there."
  npc_override_wolfvill_quests_18_i_really_like_adventurer_261d5c: "I really like adventurers!"
  npc_override_wolfvill_quests_18_i_really_no_way_get_d8ccb1: "But I really have no way to get there."
  npc_override_wolfvill_quests_18_i_remember_having_conver_116f90: "I remember having a conversation with my father about Jormungand."
  npc_override_wolfvill_quests_18_i_repay_kindness_making_000a0e: "I will repay this kindness by making a good storybook."
  npc_override_wolfvill_quests_18_i_said_didn_t_i_22f4ad: "I said that, didn't I? I told you a hundred times. You didn't listen again, did you? You just believe what you want to believe, right?"
  npc_override_wolfvill_quests_18_i_said_everything_i_coul_4255e4: "I said everything I couldn't say when I left."
  npc_override_wolfvill_quests_18_i_saw_myself_what_eeb142: "I saw it myself, what~"
  npc_override_wolfvill_quests_18_i_saw_yesterday_2eb0ba: "I saw it yesterday."
  npc_override_wolfvill_quests_18_i_see_anyway_some_level_c65095: "I see. Anyway, some level of armament is necessary for the protest."
  npc_override_wolfvill_quests_18_i_see_i_understand_ae4f91: "I see... I understand it."
  npc_override_wolfvill_quests_18_i_see_our_position_becom_c61e68: "I see. Our position has become extremely unfavorable. There haven't been any major moves yet, but public opinion is not in our favor."
  npc_override_wolfvill_quests_18_i_see_rather_than_just_e1729b: "I see. Rather than just waiting for God's word and forcing it, we need to listen to people's stories."
  npc_override_wolfvill_quests_18_i_see_seems_there_s_0bc212: "I see, it seems that there's currently a lot of tension and conflict between the immigrants and the native, especially with growing dissatisfaction towards me."
  npc_override_wolfvill_quests_18_i_see_there_connection_a4a3f4: "I see. Was there a connection?"
  npc_override_wolfvill_quests_18_i_see_you_re_someone_08f7c8: "I see... You're someone who doesn't care about the safety of a poor gatekeeper's life..."
  npc_override_wolfvill_quests_18_i_see_you_ve_recently_ebeb19: "I see you've recently received some <ITEM>[Amethyst Fragment]<INFO>1000405</INFO></ITEM> in the village, right?"
  npc_override_wolfvill_quests_18_i_seem_like_scholar_you_2d3d8f: "...Do I seem like a scholar to you?"
  npc_override_wolfvill_quests_18_i_should_also_try_harder_d0aefa: "I should also try harder to behave like a human."
  npc_override_wolfvill_quests_18_i_should_probably_just_g_9f157b: "I should probably just go home..."
  npc_override_wolfvill_quests_18_i_sincerely_apologize_ev_c1761d: "I sincerely apologize to everyone. And, it wasn't my mentor who forced me; I insisted on the expedition against their advice."
  npc_override_wolfvill_quests_18_i_sleep_comfortably_toni_146f6e: "I can sleep comfortably tonight."
  npc_override_wolfvill_quests_18_i_some_beautiful_amethys_37857d: "I have some beautiful amethyst fragments I found lying around. I'll give them to you."
  npc_override_wolfvill_quests_18_i_some_medicines_medical_c7dc7d: "I have some medicines and medical supplies from Rachel, but they are scarce, and I'm not in the right place to use them."
  npc_override_wolfvill_quests_18_i_some_potions_here_so_ec3f4d: "I have some potions here, so drink this and return to the village first."
  npc_override_wolfvill_quests_18_i_something_i_d_like_e369c1: "I have something I'd like to ask for a moment. Is it okay?"
  npc_override_wolfvill_quests_18_i_something_i_want_inves_e97506: "I have something I want to investigate on the other side, rather than confronting those people directly."
  npc_override_wolfvill_quests_18_i_still_need_handle_prot_10b3df: "I still need to handle the protest and do some coordination work."
  npc_override_wolfvill_quests_18_i_suffered_lot_because_t_e35b2f: "I suffered a lot because there was no compromise on the wage increase for the natives."
  npc_override_wolfvill_quests_18_i_t_00f432: "I can't."
  npc_override_wolfvill_quests_18_i_t_disclose_as_s_62b8af: "I can't disclose that as it's personal information. Why do you ask?"
  npc_override_wolfvill_quests_18_i_t_disclose_destination_3189b0: "I can't disclose the destination yet, so just follow me."
  npc_override_wolfvill_quests_18_i_t_even_afford_buy_442439: "I can't even afford to buy tomorrow's meal like this."
  npc_override_wolfvill_quests_18_i_t_even_run_away_f45ccd: "I can't even run away anywhere."
  npc_override_wolfvill_quests_18_i_t_give_up_i_f3c5b4: "But I can't give up, and I'm glad you're willing to come back and talk about it, but before then, I need to get a group of like-minded people together and get ready to convince them."
  npc_override_wolfvill_quests_18_i_t_let_you_go_f9acbc: "I can't let you go alone. How can I send you to such a dangerous place alone? Of course, I know you can handle a walk by yourself, but I'm worried."
  npc_override_wolfvill_quests_18_i_t_made_wrong_choice_f9fd56: "I can't have made the wrong choice in coming here...?"
  npc_override_wolfvill_quests_18_i_t_stand_anymore_11a3aa: "I can't stand it anymore."
  npc_override_wolfvill_quests_18_i_t_take_anymore_4dfd2b: "I can't take it anymore..."
  npc_override_wolfvill_quests_18_i_talked_directly_dina_a_a3dc23: "I talked directly to Dina about the unfair aspect, but it was in vain."
  npc_override_wolfvill_quests_18_i_think_helpful_sure_par_df2d34: "I think it would be helpful for sure to participate in the meeting...."
  npc_override_wolfvill_quests_18_i_think_i_invested_half_074562: "I think I invested half of my money into making this practice Half Flower when I started my business."
  npc_override_wolfvill_quests_18_i_think_i_m_going_604401: "I think I'm going to be very busy from now on."
  npc_override_wolfvill_quests_18_i_think_i_said_well_5c1934: "I think I said it well enough for everyone to understand. There is no need to build a clinic, and you should not build one."
  npc_override_wolfvill_quests_18_i_think_i_saw_him_9040cc: "I think I saw him around the ^e5555eplaza^000000 on my way to the temple earlier..."
  npc_override_wolfvill_quests_18_i_think_might_little_say_e3445e: "I think it might be a little to say that it's not a change, but an attitude, and the world is changing. There is no one who doesn't change."
  npc_override_wolfvill_quests_18_i_think_s_because_accide_1a8b7e: "I think it's because of the accident a while ago..."
  npc_override_wolfvill_quests_18_i_think_situation_improv_6ea382: "I think the situation will improve if we can receive a little help from the outside."
  npc_override_wolfvill_quests_18_i_think_weight_items_i_a70dbf: "^ff0000 I think the weight of the items I have is too much. Please organize Tori once.^000000"
  npc_override_wolfvill_quests_18_i_thought_about_doing_wh_af5d10: "I thought about doing what they said, but I can't. I don't know what else to do, but this is something I need to do."
  npc_override_wolfvill_quests_18_i_thought_mosquito_ecab5f: "I thought it was a mosquito...?"
  npc_override_wolfvill_quests_18_i_thought_relatively_cle_d738d5: "I thought it was relatively clean water, but when I put a holy object in it, it glowed brightly and gave me a somewhat sacred feeling."
  npc_override_wolfvill_quests_18_i_thought_you_kind_perso_bb2adc: "I thought you were a kind person."
  npc_override_wolfvill_quests_18_i_told_him_we_need_b99aae: "I told him that we need a clinic, but we can't just push it through because the elderly people who have lived here for a long time are against it, so we have to convince them."
  npc_override_wolfvill_quests_18_i_told_you_i_going_440c67: "I told you I was going to build a clinic here. When I came here, there was no decent clinic, so I build one."
  npc_override_wolfvill_quests_18_i_tried_when_i_visited_31a3d6: "I tried it when I visited Rachel before and it was so delicious that I always make sure to visit this place whenever I'm here."
  npc_override_wolfvill_quests_18_i_understand_40038e: "I understand."
  npc_override_wolfvill_quests_18_i_understand_i_understan_61bbdc: "I understand, I understand. You need some time alone. Honestly, I feel the same way. In the end, we're all alone in this world. So let's live well on our own while still living together."
  npc_override_wolfvill_quests_18_i_understand_we_t_just_23de34: "I understand... but we can't just meet casually."
  npc_override_wolfvill_quests_18_i_understand_well_yuseh_0c06c7: "I understand well that Yuseh got caught up in the illusion's ploy and tried to summon a goddess but ended up self-destructing."
  npc_override_wolfvill_quests_18_i_understand_what_you_me_0cb580: "I understand what you mean."
  npc_override_wolfvill_quests_18_i_understand_what_you_re_9e158f: "I understand what you're saying! But stupid Scania doesn't know that! Even a complete stranger like you understands my heart so well!"
  npc_override_wolfvill_quests_18_i_used_live_rachel_i_68e1f6: "I used to live in Rachel, but I couldn't stand it anymore, so..."
  npc_override_wolfvill_quests_18_i_used_recognized_techni_b6aa36: "I used to be a recognized technician in the past."
  npc_override_wolfvill_quests_18_i_ve_analyzed_too_those_69ec3b: "I've analyzed it too. Those weapons are classified as anti-personnel, meaning they're for warfare."
  npc_override_wolfvill_quests_18_i_ve_been_getting_some_86ec51: "I've been getting some strange looks on the way here. I'm sure my guest felt it too..."
  npc_override_wolfvill_quests_18_i_ve_been_guarding_templ_41071c: "I've been guarding the temple for quite a long time."
  npc_override_wolfvill_quests_18_i_ve_been_hearing_strang_9c6f16: "I've been hearing a strange noise coming from the holy ground recently."
  npc_override_wolfvill_quests_18_i_ve_been_pushing_sir_bccc7f: "I've been pushing Sir Amal's wheelchair around, so I've been everywhere."
  npc_override_wolfvill_quests_18_i_ve_been_traveling_vari_453c05: "I've been traveling to various villages to test the strength of my accumulated martial arts skills. After breaking many dojos, I settled here in Rachel quite a while ago."
  npc_override_wolfvill_quests_18_i_ve_collected_enough_th_88ca0d: "I've collected enough things caught in the traps today."
  npc_override_wolfvill_quests_18_i_ve_come_find_those_2561a6: "I've come to find those who are connected to them..."
  npc_override_wolfvill_quests_18_i_ve_decided_wait_now_07724e: "I've decided to wait for now, as Maram and other senior members are currently discussing ways to address this issue and find a solution."
  npc_override_wolfvill_quests_18_i_ve_done_my_fair_f95cf1: "I've done my fair share of work, but during the training period, I can't just let you off the hook for this and that."
  npc_override_wolfvill_quests_18_i_ve_got_plenty_drinking_09bfe0: "I've got plenty of drinking water for a while."
  npc_override_wolfvill_quests_18_i_ve_got_see_newcomers_e55d74: "I've got to see the newcomers."
  npc_override_wolfvill_quests_18_i_ve_had_people_interrup_1cfd89: "I've had people interrupt me like that."
  npc_override_wolfvill_quests_18_i_ve_heard_817ed4: "I've heard"
  npc_override_wolfvill_quests_18_i_ve_heard_so_many_213454: "I've heard so many stories, but now there are some that I've forgotten..."
  npc_override_wolfvill_quests_18_i_ve_heard_some_disagree_aa9971: "I've heard some disagreements to some extent, but... I may have been wrong to think that they would naturally resolve if we lived together, got to know each other, and understood each other."
  npc_override_wolfvill_quests_18_i_ve_heard_story_if_e309f4: "I've heard the story. If he's the one who brought you, you can trust him. Get in here."
  npc_override_wolfvill_quests_18_i_ve_never_even_heard_350b6a: "I've never even heard of a sauce with that name before."
  npc_override_wolfvill_quests_18_i_ve_never_heard_before_ac5c17: "I've never heard of this before?"
  npc_override_wolfvill_quests_18_i_ve_never_seen_anyone_c9817b: "I've never seen anyone who was neither an intruder nor a guest, but I know that those masked people are suspicious."
  npc_override_wolfvill_quests_18_i_ve_never_seen_anything_ea88eb: "I've never seen anything like it."
  npc_override_wolfvill_quests_18_i_ve_never_seen_them_941a4f: "I've never seen them before. Who on earth are they?"
  npc_override_wolfvill_quests_18_i_ve_noticed_people_ofte_2102d3: "I've noticed that people often exchange them, considering them symbols of luck or something."
  npc_override_wolfvill_quests_18_i_ve_obtained_rough_info_2c2e5d: "^ff0000I've obtained rough information about where the cargo taken by Camille was headed.^000000"
  npc_override_wolfvill_quests_18_i_ve_only_just_returned_37779f: "I've only just returned to Rachel, so I don't know, but..."
  npc_override_wolfvill_quests_18_i_ve_promised_listen_sto_ccbe00: "I've promised to listen to the stories of one child, one young person, and one grandmother from the village."
  npc_override_wolfvill_quests_18_i_ve_received_signal_you_cd9a6a: "I've received a signal that you've arrived at your local coordinates."
  npc_override_wolfvill_quests_18_i_ve_seen_some_people_938228: "I've seen some people doing this kind of stump speech lately..."
  npc_override_wolfvill_quests_18_i_ve_told_suad_lava_8a2af9: "I've told Suad that the lava has reached this far, and below here, the ground has already melted a lot, making it even more dangerous, so don't go down."
  npc_override_wolfvill_quests_18_i_want_drink_sweet_tea_08154b: "I want to drink sweet tea with lots of ice."
  npc_override_wolfvill_quests_18_i_want_help_find_ymir_853ed9: "I want to help find Ymir's heart fragment."
  npc_override_wolfvill_quests_18_i_want_live_without_any_2e3e1d: "I want to live without any trouble.."
  npc_override_wolfvill_quests_18_i_want_you_get_me_1fd40a: "I want you to get me some things that can only be made in Rachel's Temple of Sessrumnir."
  npc_override_wolfvill_quests_18_i_want_you_quiet_now_503a5a: "I want you to be quiet now."
  npc_override_wolfvill_quests_18_i_wanted_try_camping_45fe6a: "I wanted to try camping~"
  npc_override_wolfvill_quests_18_i_wasn_t_aware_seems_0d3cbe: "I wasn't aware of it, but it seems that the tension between the native and immigrants has escalated recently, judging by the current situation."
  npc_override_wolfvill_quests_18_i_wish_i_could_sit_d8c119: "I wish I could sit somewhere cool and have some iced tea with dried fruit."
  npc_override_wolfvill_quests_18_i_won_t_discipline_you_613171: "I won't discipline you for this incident, but please tell <NAVI>[Amodipin]<INFO>rachel,181,51,0,101,0</INFO></NAVI> to come to work properly."
  npc_override_wolfvill_quests_18_i_wonder_if_i_should_b04334: "I wonder if I should leave Rachel after all...?"
  npc_override_wolfvill_quests_18_i_wonder_when_miriam_arr_307af5: "I wonder when Miriam will arrive~"
  npc_override_wolfvill_quests_18_i_wonder_where_they_came_d52948: "I wonder where they came from."
  npc_override_wolfvill_quests_18_i_wondering_if_you_could_bb55a6: "...I was wondering if you could direct me there."
