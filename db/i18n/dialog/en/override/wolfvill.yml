  npc_override_wolfvill_quests_18_some_people_even_though_b5b421: "Some people, even though we try to reconcile their opinions, accuse us of being heretics and cause disturbances, while others ask how long we will tolerate these heretics. It's not easy for us to resolve these situations."
  npc_override_wolfvill_quests_18_some_people_found_unacce_c5d404: "Some people found this unacceptable and ^e5555ediscriminated against us^000000, calling us the Gray Children. But my mother hoped that we would become bridges between immigrants and natives."
