Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_wolfvill_quests_18_aaaaaah_i_m_dying_f3e31f: "Aaaaaah!!! I'm dying!!!"
  npc_override_wolfvill_quests_18_about_800b4c: "About that..."
  npc_override_wolfvill_quests_18_about_intruder_fa736f: "About the intruder."
  npc_override_wolfvill_quests_18_about_manners_ahab_df2cc4: "This is about manners, Ahab."
  npc_override_wolfvill_quests_18_about_villa_6a7b1f: "And about that villa."
  npc_override_wolfvill_quests_18_above_all_fact_i_closest_2e1717: "Above all, the fact that I was closest and still didn't notice is the worst..."
  npc_override_wolfvill_quests_18_accept_3e1999: "Accept."
  npc_override_wolfvill_quests_18_accept_bb54db: "Accept"
  npc_override_wolfvill_quests_18_accept_request_2bcb4c: "Accept the request"
  npc_override_wolfvill_quests_18_access_prohibited_except_34b12b: "Access is prohibited except for officials."
  npc_override_wolfvill_quests_18_accident_8c120c: "Accident?"
  npc_override_wolfvill_quests_18_accompanying_currently_p_aef380: "Accompanying is not currently possible. Please check if your accompanying party member has applied for MD."
  npc_override_wolfvill_quests_18_accumulate_wealth_i_now_66f5a9: "To accumulate the wealth I have now, I have always acted strategically and pragmatically."
  npc_override_wolfvill_quests_18_accustoming_your_body_co_977fc6: "Accustoming your body to comfort makes an uncomfortable life unbearable. Live with satisfaction within the minimum life they provide."
  npc_override_wolfvill_quests_18_ackoooo_welcome_freyja_s_0fbbc7: "Ackoooo! Welcome! Freyja's favor be with you!"
  npc_override_wolfvill_quests_18_actually_672c01: "Actually..."
  npc_override_wolfvill_quests_18_actually_font_size_b_mer_8e417e: "Actually, <FONT SIZE = 14><B>this merchant here</FONT></B> is the one."
  npc_override_wolfvill_quests_18_actually_i_didn_t_think_128d14: "Actually, I didn't think there was any need for a raise, but I hated fighting with my husband more."
  npc_override_wolfvill_quests_18_actually_i_heard_group_r_5a6d95: "Actually, I heard that the group raided the headquarters of the migrants. They took everything the headquarters had."
  npc_override_wolfvill_quests_18_actually_i_m_here_6614c4: "Actually, I'm here to..."
  npc_override_wolfvill_quests_18_actually_miriam_i_helpin_e6063e: "Actually, Miriam and I are ^e5555eHelping indigenous people struggling in another area^000000."
  npc_override_wolfvill_quests_18_add_grams_77f8e3: "Add 2 grams."
  npc_override_wolfvill_quests_18_advanced_stages_however_43b337: "In the advanced stages, however, the angle at which the stems are cut, the number of leaves removed depending on the location where the Half Flowers are blooming, and the amount of water and secret powder in the container may vary..."
  npc_override_wolfvill_quests_18_adventurer_2439c4: "Adventurer?"
  npc_override_wolfvill_quests_18_adventurer_a643af: "Adventurer."
  npc_override_wolfvill_quests_18_adventurer_c303ce: "Adventurer..."
  npc_override_wolfvill_quests_18_adventurer_help_you_righ_7571bc: "The Adventurer will help you, right?"
  npc_override_wolfvill_quests_18_adventurer_here_taken_ca_c4569d: "The adventurer here has taken care of the carriage wheels. Please express our gratitude."
  npc_override_wolfvill_quests_18_adventurer_hold_second_5c4cd9: "Adventurer, hold on a second."
  npc_override_wolfvill_quests_18_adventurer_how_about_hea_629ba4: "Adventurer, how about hearing people's opinions in advance before coming?"
  npc_override_wolfvill_quests_18_adventurer_how_s_going_i_c379ec: "Adventurer, how's it going, can I start my construction?"
  npc_override_wolfvill_quests_18_adventurer_i_am_responsi_7db3a9: "Adventurer. I am responsible for this ascent. If the adventurer solves the cart wheel, we will pay the adventurer the appropriate experience points based on the vision of our clan"
  npc_override_wolfvill_quests_18_adventurer_i_came_time_o_f69b2f: "Adventurer, I came on time for our walk. But Aisha didn't show up..."
  npc_override_wolfvill_quests_18_adventurer_leave_find_he_5417a8: "And the adventurer will leave to find the heart."
  npc_override_wolfvill_quests_18_adventurer_marum_miriam_597cae: "Adventurer, Marum, and Miriam. With a few exceptions, let's disband for now."
  npc_override_wolfvill_quests_18_adventurer_me_favor_we_r_73669a: "Adventurer, do me a favor, we really need a modern clinic here, even if it's not as big as the one from Rachel."
  npc_override_wolfvill_quests_18_adventurer_please_come_u_533c62: "Adventurer, please come with us!"
  npc_override_wolfvill_quests_18_adventurer_since_you_re_e8e77e: "Adventurer, since you're strong, would you accompany me to ^e5555eOz Labyrinth when you have some free time^000000?"
  npc_override_wolfvill_quests_18_adventurer_thank_you_so_9d7fb2: "Adventurer, thank you so much for your help. This is what I got when I got settled here, and I don't need anything... I'll give it to you, Adventurer, as a token of my appreciation."
  npc_override_wolfvill_quests_18_adventurer_then_please_g_f55a07: "Adventurer, then, please go and return safely! I'll take my leave for now too!"
  npc_override_wolfvill_quests_18_adventurer_what_did_you_b2bcb2: "Adventurer, what did you say earlier at the Temple of Sethrunir?"
  npc_override_wolfvill_quests_18_adventurer_why_you_retur_a06df3: "Adventurer? Why have you returned already? Didn't you go to investigate the origin of the weapon with Miriam?"
  npc_override_wolfvill_quests_18_adventurer_why_you_think_288a92: "Adventurer, why are you thinking so deeply?"
  npc_override_wolfvill_quests_18_adventurer_you_ever_dbb992: "Adventurer, have you ever..."
  npc_override_wolfvill_quests_18_adventurer_you_mind_catc_07ed90: "Adventurer, would you mind catching only 30 {0} for me?"
  npc_override_wolfvill_quests_18_adventurer_you_re_back_954922: "Adventurer, you're back."
  npc_override_wolfvill_quests_18_adventurer_you_smell_lik_c60ef4: "Adventurer, you smell like volcanic ash."
  npc_override_wolfvill_quests_18_adventurer_you_ve_done_u_734759: "Adventurer, you've done us a service once again."
  npc_override_wolfvill_quests_18_adventurer_you_ve_worked_35423b: "Adventurer, you've worked hard. I think our dog is also satisfied. Did you have a good meal time? Then, please try again tomorrow!"
  npc_override_wolfvill_quests_18_adventurer_you_ve_worked_a48206: "Adventurer, you've worked hard. I'm always grateful. I'll take a break today and see you again after dawn!"
  npc_override_wolfvill_quests_18_adventurers_participate_8ca93e: "Can adventurers participate in the event too?"
  npc_override_wolfvill_quests_18_adventurers_who_already_7798f5: "Adventurers who have already completed it can only enter to accompany fellow adventurers."
  npc_override_wolfvill_quests_18_adventures_investigate_v_374539: "Adventures, investigate the villa with Miriam."
  npc_override_wolfvill_quests_18_after_all_what_i_living_f724a0: "After all, this is what I do for a living."
  npc_override_wolfvill_quests_18_after_retreating_frontli_5f94f3: "After retreating from the frontline because of that, he's been scheming something like this from behind."
  npc_override_wolfvill_quests_18_after_setback_my_deputy_6591bb: "After the setback, my deputy, who had been languishing, suddenly regained vigor and became enthusiastic. Since then, tensions between the natives and immigrants of Arunafeltz have gradually escalated."
  npc_override_wolfvill_quests_18_after_working_together_y_f09c0b: "But after working together, you'll see for yourself."
  npc_override_wolfvill_quests_18_after_you_go_grandma_sha_069923: "After that, you can go to Grandma Shania and write down her story."
  npc_override_wolfvill_quests_18_after_you_loose_some_wei_468fb8: "- after you loose some weight. -"
  npc_override_wolfvill_quests_18_after_you_ve_hunted_them_c14563: "After you've hunted them all, please come back and let me know. I'll prepare a small reward for you!"
  npc_override_wolfvill_quests_18_ah_2d0cf1: "Ah~"
  npc_override_wolfvill_quests_18_ah_971301: "Ah..."
  npc_override_wolfvill_quests_18_ah_adventurer_1353b7: "...Ah, adventurer."
  npc_override_wolfvill_quests_18_ah_alright_anyway_suad_s_bb03d2: "Ah, alright! Anyway, Suad seems to be worried a lot."
  npc_override_wolfvill_quests_18_ah_before_becomes_troubl_e8d6ec: "Ah, before it becomes troublesome, let's bail."
  npc_override_wolfvill_quests_18_ah_cf07cb: "Ah!"
  npc_override_wolfvill_quests_18_ah_course_adventurer_you_c316e2: "Ah, of course! Adventurer! Would you care to go? Explore this place, take in the sights, and perhaps make a lasting impression on the locals as well."
  npc_override_wolfvill_quests_18_ah_difficult_right_now_s_164ea2: "Ah, is it difficult right now? It's okay, we can do it later."
  npc_override_wolfvill_quests_18_ah_fists_flying_fists_fl_6cad75: "Ah, fists are flying, fists are flying. Just try hitting me."
  npc_override_wolfvill_quests_18_ah_grodra_s_errand_you_8e6ee6: "Ah, Grodra's errand? You came to hear an old tale, didn't you?"
  npc_override_wolfvill_quests_18_ah_hiding_things_doesn_t_1f3cd5: "Ah, hiding things doesn't suit my nature, so I'll just be honest."
  npc_override_wolfvill_quests_18_ah_i_am_priest_junok_d0bbe9: "Ah, I am Priest Junok. I have returned to Sessrumnir this time."
  npc_override_wolfvill_quests_18_ah_i_gave_him_some_5eda9d: "Ah.. I gave him some freedom with the money, but I didn't give him too much freedom, so it was quite satisfying. I thought it would last."
  npc_override_wolfvill_quests_18_ah_i_got_little_excited_870b69: "Ah... I got a little excited. Whenever my dad talks about this, it stresses me out."
  npc_override_wolfvill_quests_18_ah_i_knew_you_come_b8653f: "Ah, I knew you would come to the competition after all."
  npc_override_wolfvill_quests_18_ah_i_know_so_what_bba7cd: "Ah... I know! So what!"
  npc_override_wolfvill_quests_18_ah_i_m_hungry_thirsty_0779d7: "Ah, I'm hungry and thirsty from playing."
  npc_override_wolfvill_quests_18_ah_i_see_since_i_22d1b1: "Ah... I see. Since I've listened to your advice."
  npc_override_wolfvill_quests_18_ah_i_see_you_re_5f7270: "Ah... I see... You're busy. Well, then there's nothing to be done about it."
  npc_override_wolfvill_quests_18_ah_last_time_you_went_0ef8b8: "Ah, the last time you went to the top, didn't you?"
  npc_override_wolfvill_quests_18_ah_oiger_sauce_let_me_4149e0: "Ah, Oiger Sauce! Let me see... Here it is."
  npc_override_wolfvill_quests_18_ah_outsider_5c0411: "Ah, an outsider..."
  npc_override_wolfvill_quests_18_ah_right_outsiders_often_1cb872: "Ah, right! Outsiders often like these sorts of things. Do you like it, adventurer? Even if you don't, you can exchange it for something you like with someone who does. Take it with you."
  npc_override_wolfvill_quests_18_ah_s_troubling_there_s_95c771: "Ah, it's troubling. There's a bothersome issue."
  npc_override_wolfvill_quests_18_ah_seems_there_various_r_f9b465: "Ah~ It seems there are various rumors circulating about me in a negative light, right?"
  npc_override_wolfvill_quests_18_ah_seriously_because_i_m_2d6b41: "Ah, seriously, because I'm a man who works for a living."
  npc_override_wolfvill_quests_18_ah_size_doesn_t_matter_916b5b: "Ah, the size doesn't matter."
  npc_override_wolfvill_quests_18_ah_um_bf88a3: "Ah... um..."
  npc_override_wolfvill_quests_18_ah_unlucky_isn_t_dealing_c8fdf7: "Ah.. unlucky, isn't it? Dealing with a mere native."
  npc_override_wolfvill_quests_18_ah_well_007c8b: "Ah, well..."
  npc_override_wolfvill_quests_18_ah_why_i_talk_only_741fb4: "Ah, why do I have to talk only about this with adventurers?"
  npc_override_wolfvill_quests_18_ah_you_quite_interesting_164c0e: "Ah... you have quite an interesting skill, don't you?"
  npc_override_wolfvill_quests_18_ah_you_re_ones_who_bbd1a0: "Ah, you're the ones who came looking for my mother last time."
  npc_override_wolfvill_quests_18_ah_your_name_so_dandelio_f405c2: "Ah, your name is... So, it was Dandelion."
  npc_override_wolfvill_quests_18_ahab_ahab_no_you_boastin_c04ff6: "Ahab? Ahab? No, are you boasting because you ran an errand now!"
  npc_override_wolfvill_quests_18_ahem_enough_since_depart_8f9e40: "Ahem, enough of this. Since the departure is delayed, go and prepare to set out again."
  npc_override_wolfvill_quests_18_ahem_hmm_efc360: "Ahem... hmm"
  npc_override_wolfvill_quests_18_ahhh_if_only_we_had_556f7f: "Ahhh... If only we had the right equipment... I could have done it faster... I can't help it."
  npc_override_wolfvill_quests_18_aisha_why_you_here_did_633dd7: "Aisha? Why are you here? Did you come to return the wolf?"
  npc_override_wolfvill_quests_18_aja_aja_987aaa: "Aja, aja!"
  npc_override_wolfvill_quests_18_alas_you_ve_heard_rumors_2f9640: "Alas, you've heard the rumors~"
  npc_override_wolfvill_quests_18_aligns_roughly_time_when_55878e: "That aligns roughly with the time when the Heart Hunters escaped from the mansion."
  npc_override_wolfvill_quests_18_all_adventurers_thanks_y_ab1190: "All adventurers, thanks to you."
  npc_override_wolfvill_quests_18_all_noise_monsters_makin_50e6bd: "With all the noise the monsters are making these days, I thought there might be someone in danger and came down to check."
  npc_override_wolfvill_quests_18_all_temples_like_temple_04c94a: "All temples like the Temple of Freya must be destroyed!"
  npc_override_wolfvill_quests_18_all_you_check_horim_doin_45a9f6: "All you have to do is check that Horim is doing well."
  npc_override_wolfvill_quests_18_alone_unforgivable_he_al_18b1c8: "That alone is unforgivable, but he also caused pain to the gods and innocent people for that."
  npc_override_wolfvill_quests_18_already_gone_let_s_catch_ccfda5: "Already gone. Let's catch Ashling!!"
  npc_override_wolfvill_quests_18_alright_a5b0b1: "Alright!"
  npc_override_wolfvill_quests_18_alright_calm_down_ira_7ccbc6: "Alright, calm down, Ira."
  npc_override_wolfvill_quests_18_alright_i_ll_open_storag_e55f80: "Alright, I'll open the Storage."
  npc_override_wolfvill_quests_18_alright_i_ll_sell_you_745bf0: "Alright. I'll sell you anything at a reasonable price."
  npc_override_wolfvill_quests_18_alright_i_m_sorry_af33ef: "Alright... I'm sorry."
  npc_override_wolfvill_quests_18_alright_let_me_explain_q_d793ed: "Alright. Let me explain quickly."
  npc_override_wolfvill_quests_18_alright_let_s_hear_your_040d08: "Alright, let's hear your precious words then!"
  npc_override_wolfvill_quests_18_alright_let_s_stop_s_294ed3: "Alright, let's stop. It's pitiful~ Let's stop saying we don't have money."
  npc_override_wolfvill_quests_18_alright_now_s_settled_le_c3a65d: "Alright, now that it's settled, let's hurry. Let's meet at <NAVI>[in front of the temple]<INFO>rachel,169,245,0,101,0</INFO></NAVI>"
  npc_override_wolfvill_quests_18_alright_shall_we_go_work_905b7e: "Alright. Shall we go to work, adventurer?"
  npc_override_wolfvill_quests_18_alright_situation_countr_b07e0c: "Alright. The situation in this country is actually beyond my knowledge, but it seems to have been resolved well."
  npc_override_wolfvill_quests_18_alright_then_3ea654: "Alright then."
  npc_override_wolfvill_quests_18_alright_you_need_go_thro_1614c8: "Alright. You need to go through the gap between those trees."
  npc_override_wolfvill_quests_18_also_story_our_grandfath_8e2999: "This is also a story our grandfather told us, some gods are still..."
  npc_override_wolfvill_quests_18_although_everyone_could_17816a: "Although not everyone could attend this gathering, I am truly grateful to those who could join us and illuminate this occasion."
  npc_override_wolfvill_quests_18_although_looks_fine_ther_ef7f0f: "^0000ffAlthough it looks fine, there is a worn-out carriage wheel..^000000"
  npc_override_wolfvill_quests_18_although_my_boss_pretend_944938: "Although my boss pretends to listen to me, if it's advice from a famous adventurer like yourself, I think he'll pay attention."
  npc_override_wolfvill_quests_18_although_s_called_discri_919f13: "Although it's called ^e5555eDiscrimination and Persecution^000000, in reality, it's almost like escaping from ^e5555eHardliners or Extremists^000000."
  npc_override_wolfvill_quests_18_although_time_passes_bui_89c827: "Although time passes and the building disappears, the adventurer's will will remain forever."
  npc_override_wolfvill_quests_18_am_i_alive_am_i_f58886: "Am I alive?? Am I alive?? Is my leg okay??"
  npc_override_wolfvill_quests_18_amethyst_shop_c64390: "Amethyst shop?"
  npc_override_wolfvill_quests_18_amira_s_stories_include_2c7b79: "Amira's stories include many myths familiar to me as well."
  npc_override_wolfvill_quests_18_among_gray_wolves_gray_w_211835: "Among the gray wolves in the Gray Wolf Forest, there was one that seemed like the leader..."
  npc_override_wolfvill_quests_18_among_locals_pride_no_on_903223: "Among the locals, it was a pride that no one was as successful as me."
  npc_override_wolfvill_quests_18_amount_acceptable_store_49368f: "Is this amount acceptable at this store?"
  npc_override_wolfvill_quests_18_amount_just_right_937efa: "The amount is just right!"
  npc_override_wolfvill_quests_18_analysis_results_indicat_74233d: "The analysis results indicate that the risk of the stored gunpowder and unmanaged weapons is approximately 9.72%."
  npc_override_wolfvill_quests_18_anything_s_fine_just_hun_99228b: "Anything's fine. Just hunt some monsters nearby."
  npc_override_wolfvill_quests_18_anyway_even_though_s_ser_c9efd7: "Anyway, even though it's a service, seeing as they say it will be delivered right before departure, I think I'd like to check ^e5555edirectly at the top^000000."
  npc_override_wolfvill_quests_18_anyway_i_ll_tell_you_933737: "Anyway, I'll tell you the next story."
  npc_override_wolfvill_quests_18_anyway_i_m_glad_there_0dce27: "Anyway, I'm glad there seems to be some compromise."
  npc_override_wolfvill_quests_18_anyway_i_need_talk_villa_6888f5: "Anyway... I need to talk to the villagers about the cub. Our little one is safe! Let's go, little cub!"
  npc_override_wolfvill_quests_18_anyway_i_promised_tell_s_5d4dfc: "Anyway, I promised to tell the story I heard from our grandfather before we came to the Gray Wolf Forest."
  npc_override_wolfvill_quests_18_anyway_i_think_s_case_768967: "Anyway, I think that's the case. Even though I said it in a nice way, you still don't understand."
  npc_override_wolfvill_quests_18_anyway_no_matter_what_yo_e76e88: "Anyway, no matter what you say!"
  npc_override_wolfvill_quests_18_anyway_oz_labyrinth_situ_0370aa: "Anyway, ^e5555eOz Labyrinth situation is getting worse^000000."
  npc_override_wolfvill_quests_18_anyway_please_go_talk_mr_248f92: "Anyway, please do it. Go and talk to Mr. Ahap. "
  npc_override_wolfvill_quests_18_anyway_seems_like_we_tal_3d3bee: "Anyway... it seems like we can talk a bit more quietly here."
  npc_override_wolfvill_quests_18_anyway_since_seems_you_d_01e7a5: "Anyway, since it seems you didn't bring separate carriers, just let us know when you're leaving town, and we'll deliver it to the town entrance."
  npc_override_wolfvill_quests_18_anyway_stubbornness_51d62d: "Anyway, stubbornness..."
  npc_override_wolfvill_quests_18_anyway_thanks_coming_tal_d6f74f: "Anyway, thanks for coming to talk instead of immediately chasing me away."
  npc_override_wolfvill_quests_18_anyway_they_came_here_se_002012: "Anyway, they came here to see you because they have something to say to you."
  npc_override_wolfvill_quests_18_anyway_we_re_going_long_798b6f: "Anyway, we're not going to have a long-term business relationship, are we? "
  npc_override_wolfvill_quests_18_anyway_what_s_going_a45af6: "Anyway, what's going on!"
  npc_override_wolfvill_quests_18_anyway_you_go_see_them_c8c86a: "Anyway, you have to go in and see them eventually. Why not pay a visit while you're here?"
  npc_override_wolfvill_quests_18_anyway_you_re_so_stubbor_d8148e: "Anyway, you're so stubborn..."
  npc_override_wolfvill_quests_18_approach_while_pretendin_3df70c: "Approach while pretending to be interested in a deal, just to be safe."
  npc_override_wolfvill_quests_18_aren_t_you_angry_course_e6816a: "Aren't you angry? Of course, I am."
  npc_override_wolfvill_quests_18_aren_t_you_scared_61f8bb: "Aren't you scared?"
  npc_override_wolfvill_quests_18_argument_we_prepared_mea_57fd2d: "The argument that we are not prepared is meaningless."
  npc_override_wolfvill_quests_18_armed_conflict_dangerous_47cd63: "But armed conflict is dangerous. If we fail, it will be irreparable."
  npc_override_wolfvill_quests_18_armor_b1fc5d: "Armor"
  npc_override_wolfvill_quests_18_arrgghh_0c25a5: "Arrgghh..."
  npc_override_wolfvill_quests_18_arrived_meeting_place_6f52a3: "Arrived at the meeting place."
  npc_override_wolfvill_quests_18_artificial_life_forms_be_1d8092: "Artificial life forms are beautiful. Depending on the alchemist who nurtures them, they can take on hundreds of different forms."
  npc_override_wolfvill_quests_18_as_adventurer_you_see_th_77e481: "As an adventurer, you see things like this all the time."
  npc_override_wolfvill_quests_18_as_dragon_summoned_giant_1b99e1: "As the dragon summoned the giant tower of metal for the last time, the fairy confronted it by summoning the giant spirit of fire..."
  npc_override_wolfvill_quests_18_as_elder_said_i_don_4e7dac: "As the elder said, I don't think I can go down any further, so let's go back to ^e5555eVillage^00000."
  npc_override_wolfvill_quests_18_as_far_as_i_see_fd5744: "As far as I can see, this country lacks communication."
  npc_override_wolfvill_quests_18_as_i_mentioned_before_be_a21403: "And as I mentioned before, being armed is necessary. We'll need to find new sources while keeping what we've already acquired. That's why I wanted to discuss it with you all"
  npc_override_wolfvill_quests_18_as_inspirational_said_i_641bfb: "As Inspirational said, I don't think I can handle going further down, so let's go back to the ^e5555evillage^000000."
  npc_override_wolfvill_quests_18_as_journey_long_let_s_cefcb5: "As the journey is long, let's depart for now.."
  npc_override_wolfvill_quests_18_as_lifetime_request_i_m_1e27b3: "Do it as a lifetime request. I'm saving it for when I get a lover."
  npc_override_wolfvill_quests_18_as_light_subsides_water_f6a8b6: "As the light subsides, the water looks clean."
  npc_override_wolfvill_quests_18_as_long_as_you_re_fa07e9: "As long as you're careful, there's nothing to worry about."
