Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_2@orcs_OrcsMemory_according_my_research_mi_3d9e5a: "According to my research, the minerals found there have enormous power inside them!"
  npc_override_2@orcs_OrcsMemory_after_making_reservation_c9abc5: "After making a reservation, you have to select 'Enter the Dungeon' from the menu if you wish to enter the {0}."
  npc_override_2@orcs_OrcsMemory_all_records_after_effect_eef994: "^0000ffAll records and after-effects related to the Orc's Memory Dungeon are deleted. You can now regenerate or re-enter the dungeon.^000000"
  npc_override_2@orcs_OrcsMemory_attempting_book_entrance_994357: "^0000ff{0}^000000- Attempting to book an entrance"
  npc_override_2@orcs_OrcsMemory_chances_they_ll_just_giv_6d5c65: "Chances are they'll just give you lots of instructions once they see you, so just wing it! They're always saying the same thing, to the point where I memorized them!"
  npc_override_2@orcs_OrcsMemory_coughing_b22b5e: "*Coughing*"
  npc_override_2@orcs_OrcsMemory_don_t_move_you_wounded_078fce: "Don't move! You are wounded!"
  npc_override_2@orcs_OrcsMemory_haha_no_orcs_coming_near_8897a3: "Haha, no Orcs are coming near me!"
  npc_override_2@orcs_OrcsMemory_hey_since_when_did_somet_63968e: "Hey, since when did something so interesting have to be legal!? How about it! You can talk to the Orcs! C'mon!"
  npc_override_2@orcs_OrcsMemory_hmm_put_your_hand_monemu_d1ed27: "Hmm? Put your hand on that Monemus Statue if you want to experience traveling through dimensions!"
  npc_override_2@orcs_OrcsMemory_i_created_combination_ou_4820c8: "I have created it with a combination of our technology and the unlimited energy I discovered from the Gorge! Want to try it?"
  npc_override_2@orcs_OrcsMemory_i_i_just_couldn_t_7a5816: "I.. I just couldn't kill my own daughter..."
  npc_override_2@orcs_OrcsMemory_i_used_study_dimensional_f974fc: "I used to study the Dimensional Gorge discovered near Morocc."
  npc_override_2@orcs_OrcsMemory_kruger_about_say_somethi_b77e51: "Kruger was about to say something more, but he breathed his last breath before he could..."
  npc_override_2@orcs_OrcsMemory_kruger_seemed_relieved_a_a5afd3: "Kruger seemed to be relieved as he hears of the death of the Shaman, but you notice the bitter expression on his face."
  npc_override_2@orcs_OrcsMemory_mad_scientist_doesn_t_se_da3b63: "The Mad Scientist doesn't seem to notice you and keeps mumbling to himself..."
  npc_override_2@orcs_OrcsMemory_memorial_dungeon_been_de_e49813: "Memorial Dungeon has been destroyed by the Party Leader, or because of the time limit. Please try again after 2 hours."
  npc_override_2@orcs_OrcsMemory_memorial_dungeon_orc_s_m_88b3de: "Memorial Dungeon Orc's Memory does not exist."
  npc_override_2@orcs_OrcsMemory_menu_alright_389c73: "Alright... What do I do?:Umm, maybe not."
  npc_override_2@orcs_OrcsMemory_menu_caution_234a24: "Caution: You have been discovered by Shaman Cargalache. Kruger's plan to assassinate the Shaman has failed. You must defeat Cargalache and find traces of Kruger."
  npc_override_2@orcs_OrcsMemory_menu_caution_9c1faf: "Caution: The army's starting to concentrate at Zone No. 4."
  npc_override_2@orcs_OrcsMemory_menu_caution_b356c4: "Caution: The Forces have started to concentrate at the Shaman's Altar."
  npc_override_2@orcs_OrcsMemory_menu_depraved_5177ee: "Depraved Orc Spirit: I smell flesh! Hungry! Wanna try some human meat!!"
  npc_override_2@orcs_OrcsMemory_menu_depraved_fc84a6: "Depraved Orc Hero: Whatever you say, my lord."
  npc_override_2@orcs_OrcsMemory_menu_enter_98e531: "Enter the Dungeon {0}:Cancel"
  npc_override_2@orcs_OrcsMemory_menu_high_6dd132: "High Orc: We need more defenses! Get more people here!"
  npc_override_2@orcs_OrcsMemory_menu_high_e0e7eb: "High Orc: Attack them from behind! Cut off their support!"
  npc_override_2@orcs_OrcsMemory_menu_kruger_12eabe: "Kruger: Darn it.. They'll be here any minute. Ok. Listen to me now."
  npc_override_2@orcs_OrcsMemory_menu_kruger_225400: "Kruger's Whisper: Of course those monsters won't let you touch the braziers that easily."
  npc_override_2@orcs_OrcsMemory_menu_kruger_3040c2: "Kruger's Whisper: The Orcs here used to be my companions. They just lost their will ever since the Orc Shaman started to control them with her magic."
  npc_override_2@orcs_OrcsMemory_menu_kruger_3d54a1: "Kruger's Whisper: Only the Party Leader can strengthen the flames, so protect your leader."
  npc_override_2@orcs_OrcsMemory_menu_kruger_44610a: "Kruger's Whisper: But still, try keep the battles not too noticable so the Shaman won't guard the altar with her army squad."
  npc_override_2@orcs_OrcsMemory_menu_kruger_5d9b03: "Kruger's Whisper: Do you see the braziers that light the path? Unseal the next zone by strengthening their flames."
  npc_override_2@orcs_OrcsMemory_menu_kruger_6b8d05: "Kruger: Find those Enchanted Orcs and get rid of them to move to the next zone."
  npc_override_2@orcs_OrcsMemory_menu_kruger_84182d: "Kruger: Try to avoid encountering Orcs other then the Enchanted ones. Everytime you kill a normal Orc, High Orcs will gather at the last path to the 2nd floor."
  npc_override_2@orcs_OrcsMemory_menu_kruger_852dc7: "Kruger's Whisper: I'll tell you how to get to the Shaman's altar."
  npc_override_2@orcs_OrcsMemory_menu_kruger_a57f10: "Kruger: In the worst case, the path to the 2nd floor could be completely blocked. For your own sake, you should be as sneaky as possible."
  npc_override_2@orcs_OrcsMemory_menu_kruger_a5f178: "Kruger's Whisper: I saw the bodies of our tribe. It seems that the Orc Shaman used those Orcs for her rituals."
  npc_override_2@orcs_OrcsMemory_menu_kruger_ac630b: "Kruger's Whisper: ... It all has to do with me. I am responsible for this evil."
  npc_override_2@orcs_OrcsMemory_menu_kruger_b8ba02: "Kruger's Whisper: There's nothing we can do but to defeat the Orc Shaman if we want to save the remaining tribes."
  npc_override_2@orcs_OrcsMemory_menu_kruger_bc330a: "Kruger: My plan was to let our comrades open the gate, but it's all ruined since I got busted by the Orc Shaman."
  npc_override_2@orcs_OrcsMemory_menu_kruger_c432c7: "Kruger: The Orc Shaman has sealed the 1st basement by dividing it into 4 zones. Each zone has one Enchanted Orc who has the power to unseal the next zone."
  npc_override_2@orcs_OrcsMemory_menu_kruger_fce560: "Kruger: Damn... What took you so long!! I don't have all day!!"
  npc_override_2@orcs_OrcsMemory_menu_mission_275148: "Mission: Unseal the zone by lighting the braziers. They can only be lit in a certain order, so be careful."
  npc_override_2@orcs_OrcsMemory_menu_mission_892614: "Mission: Sneak in and get rid of the 'Enchanted Orcs'. Avoiding battles with other Orcs is the best way of getting into the 2nd floor."
  npc_override_2@orcs_OrcsMemory_menu_orc_90463d: "Orc Sniper: Hah! Pretty impressive that you made it this far, but your foolish little trip ends here..."
  npc_override_2@orcs_OrcsMemory_menu_orcs_2c9352: "Orcs don't attack you?:You wish!"
  npc_override_2@orcs_OrcsMemory_menu_party_2e5e7f: "Party Name: {0}"
  npc_override_2@orcs_OrcsMemory_menu_party_8c7899: "Party Leader: {0}"
  npc_override_2@orcs_OrcsMemory_menu_reserve_c74979: "Reserve the {0}:Enter the Dungeon:Cancel"
  npc_override_2@orcs_OrcsMemory_menu_shaman_51f6a7: "Shaman Cargalache: How... How could this be... How could someone like you...!!"
  npc_override_2@orcs_OrcsMemory_menu_shaman_7ec759: "Shaman Cargalache: My loyal slave, go get those intruders!"
  npc_override_2@orcs_OrcsMemory_menu_shaman_88cb08: "Shaman Cargalache: How is it that I've been overpowered by mere humans!"
  npc_override_2@orcs_OrcsMemory_menu_shaman_92eab0: "Shaman Cargalache: I... Can't die... Yet...!"
  npc_override_2@orcs_OrcsMemory_menu_shaman_c990bf: "Shaman Cargalache: Hahaha!! So, you finally made it here. The assassin you sent was just terrible. That stupid Orc is getting cold under my feet."
  npc_override_2@orcs_OrcsMemory_menu_shaman_e80c41: "Shaman Cargalache: Defeated by these fools... It can't be happening...!"
  npc_override_2@orcs_OrcsMemory_menu_shaman_eb494a: "Shaman Cargalache: This... This can't be the end..."
  npc_override_2@orcs_OrcsMemory_menu_shouts_05a869: "Shouts of the Chief Orc of Safeguards: Looks like this will take longer than expected. Summon the Stalactic Golems!"
  npc_override_2@orcs_OrcsMemory_menu_shouts_a02346: "Shouts of the Chief Orc of Safeguards: I smell a rat.. Send some patrols to the entrance!!"
  npc_override_2@orcs_OrcsMemory_menu_the_8dfe15: "The Chief Orc of Safeguards: Oh!! Looks like I have company. Defeat me if you can!!"
  npc_override_2@orcs_OrcsMemory_menu_voice_e830ac: "Voice from somewhere: Foolish... Do you really think the altar would fall like that?"
  npc_override_2@orcs_OrcsMemory_menu_warning_2fabbb: "Warning: Orc Archer teams are gathering near the altar."
  npc_override_2@orcs_OrcsMemory_menu_warning_b16210: "Warning: High Orcs are gathering near area 3."
  npc_override_2@orcs_OrcsMemory_msg_61ce5a: "[{0}] "
  npc_override_2@orcs_OrcsMemory_msg_79ef7f: "...."
  npc_override_2@orcs_OrcsMemory_oh_fine_way_b2cfd6: "Oh fine, be that way!"
  npc_override_2@orcs_OrcsMemory_oh_like_what_travel_alte_785416: "Oh? Like what, travel to alternate space?"
  npc_override_2@orcs_OrcsMemory_only_member_party_enter_9eb530: "Only a member of the party can enter the Memorial Dungeon."
  npc_override_2@orcs_OrcsMemory_only_users_between_level_d1f3af: "Only users between Levels ^ff000030 ~ 80^000000 can enter this Dungeon."
  npc_override_2@orcs_OrcsMemory_order_generate_dungeon_y_dfc0d3: "In order to generate a dungeon you must be the Party Leader and have at least 2 members in the party."
  npc_override_2@orcs_OrcsMemory_party_status_confirmed_y_3fd108: "Party status confirmed. Would you like to book entrance to the {0}?"
  npc_override_2@orcs_OrcsMemory_please_hang_there_e52b22: "Please, hang in there!"
  npc_override_2@orcs_OrcsMemory_power_dimensional_gorge_52aaad: "The power of the Dimensional Gorge is undefeatable!!"
  npc_override_2@orcs_OrcsMemory_reservation_failed_bb49ab: "^0000ff{0} ^000000 - Reservation Failed."
  npc_override_2@orcs_OrcsMemory_s_all_right_i_m_75571c: "It's... all right.. I'm dying..."
  npc_override_2@orcs_OrcsMemory_s_you_e616fa: "{0}, it's you..."
  npc_override_2@orcs_OrcsMemory_shaman_s_dead_now_who_b11f47: "The Shaman's dead now. Who was that Shaman really?"
  npc_override_2@orcs_OrcsMemory_shaman_what_about_shaman_834dbb: "The Shaman? What about the Shaman?"
  npc_override_2@orcs_OrcsMemory_stalactic_golems_digging_54199d: "Stalactic Golems are digging out of the deep underground."
  npc_override_2@orcs_OrcsMemory_thank_you_i_m_sure_15c1eb: "Thank you, I'm sure she's finally free from the nightmare that used to choke her soul."
  npc_override_2@orcs_OrcsMemory_um_doesn_t_sound_legal_2a1088: "...Um, that doesn't sound legal?"
  npc_override_2@orcs_OrcsMemory_unknown_error_occurred_58bda4: "An unknown error has occurred."
  npc_override_2@orcs_OrcsMemory_very_good_just_sit_hands_e8ffb4: "Very good! Just sit in the hands of this statue! And try to act natural when you're in there!"
  npc_override_2@orcs_OrcsMemory_very_smart_i_actually_ju_93fc4b: "Very smart! I have actually just done that! See that statue over there? It's not your normal Monolith!"
  npc_override_2@orcs_OrcsMemory_we_ll_get_some_rest_0e1566: "We'll get some rest when we get to the 2nd basement after passing through here."
  npc_override_2@orcs_OrcsMemory_where_high_orcs_get_them_4d2780: "Where are the High Orcs!? Get them to stop the enemies!"
  npc_override_2@orcs_OrcsMemory_yeah_yeah_i_know_s_8eb033: "Yeah, yeah.. I know it's hard to belive. I don't blame ya."
  npc_override_2@orcs_OrcsMemory_you_enter_dungeon_if_bee_5f5363: "You can enter the Dungeon if it has been generated."
  npc_override_2@orcs_OrcsMemory_you_pretty_distrustful_p_70a8d7: "You are a pretty distrustful person, huh?"
  npc_override_2@orcs_OrcsMemory_you_see_dead_body_kruger_c0eb83: "You can see the dead body of Kruger, peacefully lying on the ground."
