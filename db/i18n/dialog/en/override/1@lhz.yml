Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@lhz_WolfchevLaboratory_aaaaaah_thank_you_so_muc_d3705c: "aaaaaah, {0} Thank you so much to remove my boys who had gone mad. Not a big gift but I wish you don't deny, I don't need this anymore."
  npc_override_1@lhz_WolfchevLaboratory_access_denial_been_deact_168100: "^FF0000Access denial has been deactivated.^000000"
  npc_override_1@lhz_WolfchevLaboratory_actually_funny_rumor_64c2b9: "Actually, it is not a funny rumor."
  npc_override_1@lhz_WolfchevLaboratory_actually_you_did_because_41bc93: "But actually, you did that because you was lonely,.. you just concentrated on that for this reason, huh?"
  npc_override_1@lhz_WolfchevLaboratory_after_you_left_i_fixing_b2229f: "After you left, I was fixing some system parts. And then suddenly strange thing happened."
  npc_override_1@lhz_WolfchevLaboratory_again_s_time_say_goodbye_ae69d3: "Again.. it's time to say goodbye."
  npc_override_1@lhz_WolfchevLaboratory_ah_hey_man_ee5c72: "Ah! Hey! Man!"
  npc_override_1@lhz_WolfchevLaboratory_ah_i_send_you_out_c59790: "Ah... and I can send you out of my laboratory. Do you want?"
  npc_override_1@lhz_WolfchevLaboratory_ah_if_emergency_system_a_f965f5: "Ah! If the emergency system is activating, only the leader of party should control everything. It is a lot of pressure I understand."
  npc_override_1@lhz_WolfchevLaboratory_ah_lady_may_heard_rumor_4f5676: "Ah... Lady may not have heard of the rumor."
  npc_override_1@lhz_WolfchevLaboratory_ahh_lady_shopping_slum_y_e42128: "Ahh.. Lady.. Shopping in the slum!!.. Are you a type who needs to look around every single shop?"
  npc_override_1@lhz_WolfchevLaboratory_ahh_lady_you_so_graceful_589845: "Ahh.. Lady, you are so graceful even when you are just walking....."
  npc_override_1@lhz_WolfchevLaboratory_ahh_secret_just_some_peo_1169cd: "Ahh!! And this is a secret that just SOME PEOPLE know. I heard that from Rekenber Lab.,.. a person named...um...Wol...."
  npc_override_1@lhz_WolfchevLaboratory_all_those_boss_creatures_56ccba: "All those boss creatures you took care of started to regenerate themselves.."
  npc_override_1@lhz_WolfchevLaboratory_alright_i_marked_lan_ent_a3cef0: "Alright! I have marked lan entering system code as"
  npc_override_1@lhz_WolfchevLaboratory_any_warnings_f22501: "Any warnings?"
  npc_override_1@lhz_WolfchevLaboratory_anyway_research_got_fire_813dec: "Anyway!! that research got fired from the lab. I think he must be involved with this rumor."
  npc_override_1@lhz_WolfchevLaboratory_anyway_scientist_named_w_944105: "Anyway!! A scientist named Wolf.. something suddenly got sacked. and he must be related with this rumor, I think..."
  npc_override_1@lhz_WolfchevLaboratory_anyway_since_i_realized_3d5bc0: "Anyway, since I realized that Rekenber betrayed me, I cannot just let them do what they want."
  npc_override_1@lhz_WolfchevLaboratory_as_you_see_you_only_160206: "As you can see, you are the only one I can trust. Would you and your party help me once again deactivating those creatures?"
  npc_override_1@lhz_WolfchevLaboratory_awwww_you_running_away_a_b48475: "Awwww!! You!! running away again..... Stop!"
  npc_override_1@lhz_WolfchevLaboratory_below_there_comes_grueso_b01005: "From below, there comes a gruesome sound mingling with the wind."
  npc_override_1@lhz_WolfchevLaboratory_boss_creature_ce4fc5: "Boss creature?"
  npc_override_1@lhz_WolfchevLaboratory_button_supposed_pressed_cb7f75: "The button was supposed to be pressed for an emergency case...but.."
  npc_override_1@lhz_WolfchevLaboratory_careful_lady_809c5b: "Be careful, Lady."
  npc_override_1@lhz_WolfchevLaboratory_check_up_your_inventory_5bca6a: "^FF0000 Check up your inventory. You got too many items to carry out the quest. ^000000"
  npc_override_1@lhz_WolfchevLaboratory_clockwise_c75ac6: "Clockwise"
  npc_override_1@lhz_WolfchevLaboratory_course_yea_if_i_m_b767fb: "Of course..... Yea... If I'm a womanizer, all the men on earth are too! I'm just Casanova. umhahahaha."
  npc_override_1@lhz_WolfchevLaboratory_creatures_organically_co_b2f48c: "Creatures are ^9f6077organically connected with same job field^000000."
  npc_override_1@lhz_WolfchevLaboratory_dangerous_rumors_c79afc: "Dangerous rumors?"
  npc_override_1@lhz_WolfchevLaboratory_di_rit_di_di_dit_ddf508: "Di Rit- Di- Di- Dit-"
  npc_override_1@lhz_WolfchevLaboratory_don_t_worry_i_didn_abffbf: "Don't worry. I didn't mean anything."
  npc_override_1@lhz_WolfchevLaboratory_door_opened_6b5780: "-Door opened-"
  npc_override_1@lhz_WolfchevLaboratory_door_which_connects_lab_fde482: "The door which connects to the Lab No.2 is now open."
  npc_override_1@lhz_WolfchevLaboratory_entrance_towards_wolfche_29b785: "This is an entrance towards Wolfchev's laboratory. Something is howling over the entrance."
  npc_override_1@lhz_WolfchevLaboratory_error_error_cf8a82: "^FF0000Error! Error!^000000"
  npc_override_1@lhz_WolfchevLaboratory_everyone_desire_stronger_b60dcd: "Everyone has a desire to be stronger and wants to dominate others so those other people obey and admire you. Do you not have that desire?"
  npc_override_1@lhz_WolfchevLaboratory_excuse_me_human_experime_e77a84: "Excuse me?! human experimentation?"
  npc_override_1@lhz_WolfchevLaboratory_excuse_me_i_think_i_180368: "Excuse me. But I think I lost my heart. Could you please borrow me yours?"
  npc_override_1@lhz_WolfchevLaboratory_finally_result_whom_did_bfc711: "Finally. is this the result?? For whom did I experiment? Did they cheat me?"
  npc_override_1@lhz_WolfchevLaboratory_first_all_i_gotta_handle_c28746: "First of all, I gotta handle those guinea pigs!"
  npc_override_1@lhz_WolfchevLaboratory_forbidden_personnel_ca4486: "^FF0000Forbidden personnel^000000"
  npc_override_1@lhz_WolfchevLaboratory_gasping_pshaw_you_still_87a67f: "(Gasping) Pshaw... you are still following me. Hey, why do you keep following me?"
  npc_override_1@lhz_WolfchevLaboratory_get_around_little_more_9a7340: "Get around a little more..."
  npc_override_1@lhz_WolfchevLaboratory_give_me_map_please_get_6d74a9: "Give me a map please.. To get a way....I'm fallen in your eyes."
  npc_override_1@lhz_WolfchevLaboratory_go_inside_8c72d1: "Go inside"
  npc_override_1@lhz_WolfchevLaboratory_go_wolfchev_s_lab_o_92b7ba: "Go to '^0000FFWolfchev's Lab^000000' at the 12 o'clock direction..."
  npc_override_1@lhz_WolfchevLaboratory_good_news_boss_creatures_f40a6b: "Good news is that boss creatures are not set up to wake up all at once, even though slaves are."
  npc_override_1@lhz_WolfchevLaboratory_guy_e6604a: "....a guy....?"
  npc_override_1@lhz_WolfchevLaboratory_haa_you_any_woman_your_e72966: "Haa.. Do you....? not have any woman but your sister and mother around you?"
  npc_override_1@lhz_WolfchevLaboratory_hahahaha_loneliness_you_1c47d6: "HAHAHAHA. Loneliness... you say?"
  npc_override_1@lhz_WolfchevLaboratory_he_happens_research_into_1df1ff: "He happens to research into Human 'Homunculus' without telling that to Rekenber Corp., and there was a whistle-blower who reported to the corp. so he was fired."
  npc_override_1@lhz_WolfchevLaboratory_hey_dude_anyway_let_s_e39f3b: "Hey Dude! Anyway let's get out of here first! Isn't there any place where they cannot reach?"
  npc_override_1@lhz_WolfchevLaboratory_hey_excuse_me_i_m_b5176b: "Hey.. Excuse me!!! but I'm not a 'Womanizer', I am just a person who adores ladies."
  npc_override_1@lhz_WolfchevLaboratory_hey_lady_7e4483: "Hey, lady?"
  npc_override_1@lhz_WolfchevLaboratory_hey_there_any_way_stop_4c402a: "Hey, is there any way to stop those creatures? You should know something, you made those things!"
  npc_override_1@lhz_WolfchevLaboratory_hey_wolfchev_e7a7eb: "Hey! Wolfchev!!"
  npc_override_1@lhz_WolfchevLaboratory_hey_wolfchev_where_boss_a1e105: "Hey! Wolfchev! Where is that ^46B951Boss creature^000000?"
  npc_override_1@lhz_WolfchevLaboratory_hey_you_get_out_my_94a6d8: "Hey you, get out of my way then.."
  npc_override_1@lhz_WolfchevLaboratory_hey_you_i_met_bad_46a39c: "Hey... You and I met by a bad connection...."
  npc_override_1@lhz_WolfchevLaboratory_hit_him_wake_him_up_e93742: "- Hit him to wake him up -"
  npc_override_1@lhz_WolfchevLaboratory_hm_you_sound_suspicious_750a34: "Hm.... You sound suspicious, dude! huh?"
  npc_override_1@lhz_WolfchevLaboratory_hmm_lab_entering_system_416104: "Hmm.. Lab entering system is a bit weird. Would wait for me to check the system?"
  npc_override_1@lhz_WolfchevLaboratory_hmm_those_boss_creatures_1c05c4: "Hmm.. Those boss creatures regenerating once again.."
  npc_override_1@lhz_WolfchevLaboratory_how_come_beauty_here_pla_d79c7c: "How come a beauty is here, in a place with dangerous rumor?"
  npc_override_1@lhz_WolfchevLaboratory_how_dare_you_come_back_87bb83: "How dare you come back to me after you did that. Kihihih"
  npc_override_1@lhz_WolfchevLaboratory_how_i_get_into_wolfchev_be6cb7: "How can I get into the Wolfchev's laboratory?"
  npc_override_1@lhz_WolfchevLaboratory_human_kaahaha_people_ten_b39568: "A Human! kaahaha. People tend to hate this place, why are you here?"
  npc_override_1@lhz_WolfchevLaboratory_i_am_also_completely_los_e6b84f: "I am also completely lost here.. But, this should not be happening.."
  npc_override_1@lhz_WolfchevLaboratory_i_am_so_sorry_you_c85eb1: "I am so sorry but, can you kiss with a person who just met?? Noo? Ok then let me introduce myself."
  npc_override_1@lhz_WolfchevLaboratory_i_am_sure_9832ca: "I am not sure"
  npc_override_1@lhz_WolfchevLaboratory_i_am_telling_you_because_634e08: "And I am telling you this because I'm just worried about you. You need to get out of this town which is full of disappearance cases."
  npc_override_1@lhz_WolfchevLaboratory_i_arrived_research_facil_d7d542: "I arrived at a research facility which seems it has been used till these days."
  npc_override_1@lhz_WolfchevLaboratory_i_arrived_wolfchev_s_lab_ce29f2: "I arrived at '^0000FFWolfchev's Lab^000000'."
  npc_override_1@lhz_WolfchevLaboratory_i_didn_t_know_pressing_1b9225: "I didn't know pressing the emergency alarm would cause such problem. The management system seems to be changed to emergency mode."
  npc_override_1@lhz_WolfchevLaboratory_i_don_t_feel_like_55d028: "I don't feel like talking about my precious ladies making fun of them. You do it with your friends."
  npc_override_1@lhz_WolfchevLaboratory_i_feel_good_see_human_ccdb7e: "I feel good to see a human"
  npc_override_1@lhz_WolfchevLaboratory_i_figured_something_out_6b2803: "I figured something out... and there's a system error which doesn't let us come and go freely, so you could help me in 72 hours... Go somewhere to rest before you come back."
  npc_override_1@lhz_WolfchevLaboratory_i_giacomo_girolamo_casan_1598c3: "I, Giacomo Girolamo Casanova de Seingalt am never interested in guys like you though!!"
  npc_override_1@lhz_WolfchevLaboratory_i_heard_rekenber_doing_h_e13312: "and I heard that Rekenber was doing human experimentation with those missing people. Hope you don't get me wrong."
  npc_override_1@lhz_WolfchevLaboratory_i_help_you_get_laborator_180584: "I will help you get in the laboratory right away."
  npc_override_1@lhz_WolfchevLaboratory_i_help_you_get_there_e3acde: "I will help you get in there."
  npc_override_1@lhz_WolfchevLaboratory_i_just_hope_lady_gets_eb4c5a: "I just hope that the lady gets out of this town with dangerous rumors.."
  npc_override_1@lhz_WolfchevLaboratory_i_listen_you_you_wanna_78d028: "but I can listen to you...you wanna say anything to me?"
  npc_override_1@lhz_WolfchevLaboratory_i_looked_wolfchev_again_2ee675: "I looked at Wolfchev again before leaving his lab. and I could feel that he was not obsessed anymore.."
  npc_override_1@lhz_WolfchevLaboratory_i_looking_system_don_t_895be3: "I was looking at the system.... don't know who made this..... but it's so complicated to get..no idea..."
  npc_override_1@lhz_WolfchevLaboratory_i_m_so_happy_doing_8ad455: "I'm so happy doing experiments pursuing for a perfection, I never feel lonely."
  npc_override_1@lhz_WolfchevLaboratory_i_m_so_lost_here_36b7a6: "I'm so lost here since it's the first time. Can you let me know which is the way to your heart?"
  npc_override_1@lhz_WolfchevLaboratory_i_m_sorry_seems_you_736cbc: "I'm sorry, but it seems you still cannot enter to the laboratory yet. Will you come back later? The system is kind of tricky you know."
  npc_override_1@lhz_WolfchevLaboratory_i_might_said_so_what_af987a: "I might have said that.... so what?"
  npc_override_1@lhz_WolfchevLaboratory_i_promise_i_your_everyth_f8bfd4: "I promise that I will be your everything in any case, in any difficult situation."
  npc_override_1@lhz_WolfchevLaboratory_i_say_again_thank_you_1b414f: "I say again, {0} Thank you so much to remove my boys who had gone mad. Not a big gift but I wish you don't deny, I don't need this anymore."
  npc_override_1@lhz_WolfchevLaboratory_i_see_i_understand_why_88d00b: "I see. I understand why you are hesitating, and don't want to press you any more. But, still I'm not sure why you want go there anyways,"
  npc_override_1@lhz_WolfchevLaboratory_i_see_you_still_committi_5fa047: "And I see that you are still committing that!!!"
  npc_override_1@lhz_WolfchevLaboratory_i_still_something_wolfch_9929a3: "I still have something to do with Wolfchev."
  npc_override_1@lhz_WolfchevLaboratory_i_suppose_you_then_under_a9a39e: "I suppose you can then understand the story faster... I am sure that he's involved in the rumor. I swear."
  npc_override_1@lhz_WolfchevLaboratory_if_you_come_me_experimen_de90dc: "If you come to me for the experimentation, I can treat you better."
  npc_override_1@lhz_WolfchevLaboratory_if_you_could_deactivate_08e784: "If you could deactivate that creature, all ^A1BB44slave creatures^000000 walking around here will stop moving right away."
  npc_override_1@lhz_WolfchevLaboratory_if_you_hope_you_come_32e87b: "And, if you can...hope you to come back often, especially with your friends. I want the place to be with human heart again so the sadness in here gets disappear."
  npc_override_1@lhz_WolfchevLaboratory_if_you_want_save_yoursel_bc8ed8: "If you want to save yourself, should stop following me. Bugger off."
  npc_override_1@lhz_WolfchevLaboratory_inside_laboratory_should_d2788d: "Inside.. of laboratory.. It should be waken up now. It's sad to destroy my life of work, but I can't take this any more.. ..."
  npc_override_1@lhz_WolfchevLaboratory_just_so_you_know_please_038533: "And just so you know, please do not touch random things out of curiosity. I don't want you to get hurt."
  npc_override_1@lhz_WolfchevLaboratory_kakakaah_thank_you_you_h_44b750: "kakakaah.. Thank you. You handled those Boss creatures well..."
  npc_override_1@lhz_WolfchevLaboratory_khahaha_see_you_again_yo_fc6cfa: "Khahaha, See you again. Do you want to get out of here now?"
  npc_override_1@lhz_WolfchevLaboratory_kihihihi_i_see_you_know_7d297c: "Kihihihi. I can see that you know something about me. Is that you who accused me?"
  npc_override_1@lhz_WolfchevLaboratory_laboratory_entrance_syst_f39b0c: "Laboratory entrance system [{0}] member [{1}] access granted.."
  npc_override_1@lhz_WolfchevLaboratory_lady_you_dignified_lady_e6a2bc: "Lady. You are a dignified lady even if you hang out in this poor town..."
  npc_override_1@lhz_WolfchevLaboratory_left_valve_emergency_acc_3c51bb: "This is the left valve for the emergency access."
  npc_override_1@lhz_WolfchevLaboratory_let_your_party_leader_ha_81abc4: "Let your party leader handle the valve."
  npc_override_1@lhz_WolfchevLaboratory_long_time_i_gotta_go_a16363: "in a long time, but I gotta go. Kihihihi."
  npc_override_1@lhz_WolfchevLaboratory_menu_kid_4dc0a5: "Kid's whisper: Bawwww~ Where am I? Mama......aaaa...."
  npc_override_1@lhz_WolfchevLaboratory_menu_man_38fdde: "Man's whisper: Pl.. please.. save me.. I don't wanna die.. wouaaaa.."
  npc_override_1@lhz_WolfchevLaboratory_menu_oldman_1219e1: "Oldman's whisper: Kirk...hel...help......"
  npc_override_1@lhz_WolfchevLaboratory_menu_woman_fcc051: "Woman's whisper: .. Save.. aaaah.. us..."
  npc_override_1@lhz_WolfchevLaboratory_metal_sound_b555e4: "-A metal sound-"
  npc_override_1@lhz_WolfchevLaboratory_might_seen_like_you_isn_6eec60: "It might be seen like that to you. But, it isn't. Loneliness is just a good and easy excuse of the losers."
  npc_override_1@lhz_WolfchevLaboratory_msg_61ce5a: "[{0}]"
  npc_override_1@lhz_WolfchevLaboratory_msg_77c88e: "... .... ... ...."
  npc_override_1@lhz_WolfchevLaboratory_msg_e22a7c: "... .... ..."
  npc_override_1@lhz_WolfchevLaboratory_need_more_preparation_pl_266604: "Need more preparation? Please, we don't have all day."
  npc_override_1@lhz_WolfchevLaboratory_no_abb4fe: "No..?"
  npc_override_1@lhz_WolfchevLaboratory_no_don_t_come_me_cf158a: "No! Don't come to me! Don't!!"
  npc_override_1@lhz_WolfchevLaboratory_north_so_far_here_c31917: "to the north....... . Not so far from here.."
  npc_override_1@lhz_WolfchevLaboratory_nothing_happened_4501ec: "Nothing happened."
  npc_override_1@lhz_WolfchevLaboratory_now_i_leave_them_alone_03655c: "For now, I will leave them alone, but I will make them cry and regret for trying to remove Wolfchev."
  npc_override_1@lhz_WolfchevLaboratory_now_your_party_free_pass_f493e2: "Now, your party is free to pass the entrance."
  npc_override_1@lhz_WolfchevLaboratory_oh_man_you_seem_know_12fd3f: "Oh! Man..! You seem to know pretty much! By any chance, are you concerned with Rekenber??"
  npc_override_1@lhz_WolfchevLaboratory_oh_my_what_happened_9ab345: "Oh my,... What happened?"
  npc_override_1@lhz_WolfchevLaboratory_oh_sorry_i_got_your_e17b56: "Oh...... sorry.. I got your point...."
  npc_override_1@lhz_WolfchevLaboratory_oh_wait_fea8ce: "Oh.. Wait!"
  npc_override_1@lhz_WolfchevLaboratory_oh_what_beautiful_lady_fed523: "Oh! What a beautiful lady!!"
  npc_override_1@lhz_WolfchevLaboratory_ohhhh_yeah_wolfchev_s_ri_e4b5b8: "Ohhhh?! yeah Wolfchev!! That's right, the name was Wolfchev.. The mad scientist.."
  npc_override_1@lhz_WolfchevLaboratory_only_those_beautiful_lad_2a5ab8: "Only those beautiful ladies are the reason of my life~!"
  npc_override_1@lhz_WolfchevLaboratory_oooops_then_my_my_lab_4a0fc1: "Oooops.. then my....my lab....to my lab..."
  npc_override_1@lhz_WolfchevLaboratory_order_investigate_human_f5322f: "In order to investigate human experimentation, I had to go down whilst I didn't want to because of gruesome sound."
  npc_override_1@lhz_WolfchevLaboratory_please_hold_7e4add: "Please hold on..."
  npc_override_1@lhz_WolfchevLaboratory_please_try_again_83a6fd: "^FF0000Please try again.^000000"
  npc_override_1@lhz_WolfchevLaboratory_pretend_you_know_nothing_678e2f: "Pretend you know nothing."
  npc_override_1@lhz_WolfchevLaboratory_really_i_ve_ever_heard_7020c7: "Not really. I've ever heard of his name, but I don't know anything about him.."
  npc_override_1@lhz_WolfchevLaboratory_recently_some_people_tow_5230f1: "Recently, some people from this town, actually from the slum...and some adventurers are missing..."
  npc_override_1@lhz_WolfchevLaboratory_s_laboratory_member_only_12e8df: "'^0000FF****'s laboratory member only^000000'"
  npc_override_1@lhz_WolfchevLaboratory_says_46bfe4: "It says,"
  npc_override_1@lhz_WolfchevLaboratory_seems_experimental_creat_646289: "It seems experimental creatures cannot come near the laboratory, just like Wolfchev said."
  npc_override_1@lhz_WolfchevLaboratory_seems_pretty_serious_mat_508342: "............ It seems a pretty serious matter."
  npc_override_1@lhz_WolfchevLaboratory_should_investigate_lab_w_12efb1: "Should investigate the lab where the experiment was carried out."
  npc_override_1@lhz_WolfchevLaboratory_so_please_lady_please_do_d965f6: "So, please, lady. Please don't be in a place like this and stay in safe ways."
  npc_override_1@lhz_WolfchevLaboratory_so_please_prepare_your_p_57b51f: "So, please prepare your party members, and take care of those boss creatures. I'm not sure how long this place can hold."
  npc_override_1@lhz_WolfchevLaboratory_still_really_dangerous_s_fd6312: "But still, it is really dangerous since we don't know when they will escape from there."
  npc_override_1@lhz_WolfchevLaboratory_stop_wondering_here_your_98c1e5: "Stop wondering here, and be on your way. Will you? Khh Khh."
  npc_override_1@lhz_WolfchevLaboratory_system_denied_your_entra_7d5573: "The system denied your entrance."
  npc_override_1@lhz_WolfchevLaboratory_take_care_yourself_don_t_990354: "Take care yourself and don't disappear!"
  npc_override_1@lhz_WolfchevLaboratory_thank_you_52d280: "Thank you. {0}"
  npc_override_1@lhz_WolfchevLaboratory_thank_you_very_much_2926a8: "Thank you very much. {0}"
  npc_override_1@lhz_WolfchevLaboratory_then_i_send_you_out_e394f8: "Then I will send you out."
  npc_override_1@lhz_WolfchevLaboratory_then_rumor_came_up_since_233458: "and then the rumor came up, since disappearance cases happen pretty often, that Rekenber is committing a horrible human experimentation in their secret lab."
  npc_override_1@lhz_WolfchevLaboratory_then_tell_me_when_you_b14c0a: "Then tell me when you want to."
  npc_override_1@lhz_WolfchevLaboratory_there_lot_rumors_horribl_031a8a: "There are a lot of rumors that horrible human experimentation is actually performed, but these people in the slum....don't want to believe that due to the welfare movement from Rekenber."
  npc_override_1@lhz_WolfchevLaboratory_there_one_special_creatu_9c7d9a: "There is one special creature being their ^46B951boss position^000000..."
  npc_override_1@lhz_WolfchevLaboratory_there_so_many_systems_se_f71afd: "There are so many systems set up inside of the laboratory, so eve I cannot be sure how systems are twisted by now."
  npc_override_1@lhz_WolfchevLaboratory_there_some_destroyed_par_ca61fd: "There are some destroyed part, but the basic facility seem fine."
  npc_override_1@lhz_WolfchevLaboratory_there_valve_manual_sheet_5b35ba: "There are valve manual sheets littered on the floor."
