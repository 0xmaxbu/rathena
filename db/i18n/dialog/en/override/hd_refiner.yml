Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_hd_refiner_hd_refiner_aaaaaaaaaaak_123235: "Aaaaaaaaaaak!!!"
  npc_override_hd_refiner_hd_refiner_ah_blacksmith_blessing_1a59bd: "Ah! Is it the ^0000ffBlacksmith Blessing^000000?"
  npc_override_hd_refiner_hd_refiner_aiya_i_am_faceless_now_44476d: "Aiya! I am faceless now. HmHm."
  npc_override_hd_refiner_hd_refiner_already_been_refined_pre_526beb: "This {0} has already been refined pretty high."
  npc_override_hd_refiner_hd_refiner_best_blacksmith_world_li_f0c776: "The best blacksmith in the world like me..."
  npc_override_hd_refiner_hd_refiner_blacksmith_blessing_equi_40d896: "With the Blacksmith Blessing, the equipment won't vanish if the refine fails!"
  npc_override_hd_refiner_hd_refiner_bring_out_item_so_i_b9e2f6: "Bring out the item so I can refine it!"
  npc_override_hd_refiner_hd_refiner_challenging_all_could_al_3f7644: "Not challenging at all could also be a kind of wisdom in life."
  npc_override_hd_refiner_hd_refiner_come_back_when_you_them_ae467c: "Come back when you have them all."
  npc_override_hd_refiner_hd_refiner_compared_other_blacksmit_8e8920: "Compared to other blacksmiths, the risk is smaller."
  npc_override_hd_refiner_hd_refiner_damn_b27375: "Damn it!"
  npc_override_hd_refiner_hd_refiner_didn_t_you_just_say_7e4fba: "Didn't you just say you had everything ready?"
  npc_override_hd_refiner_hd_refiner_doesn_t_guarantee_succes_bb0416: "doesn't guarantee 100% success~"
  npc_override_hd_refiner_hd_refiner_equipment_refine_unit_s_baade2: "For +{0} equipment, refine with^316AC5 {1} unit(s) Blacksmith Blessing^000000 can prevent the equipment from vanishing. Do you want use it to refine?"
  npc_override_hd_refiner_hd_refiner_even_best_blacksmith_wor_93e33c: "Even the best blacksmith in the world doesn't guarantee 100% success!"
  npc_override_hd_refiner_hd_refiner_even_i_cannot_refine_ite_4c6b80: "Even I cannot refine this item. There's no way."
  npc_override_hd_refiner_hd_refiner_great_nicely_done_183cb8: "Great! Nicely done!!"
  npc_override_hd_refiner_hd_refiner_haven_t_i_told_you_24589c: "Haven't I told you? I only refine equipment that are +10 and above."
  npc_override_hd_refiner_hd_refiner_here_only_decrease_level_695e8c: "Here it can only decrease by 1 level."
  npc_override_hd_refiner_hd_refiner_here_refine_succeeded_fl_91855d: "Here, have it. Refine succeeded flawlessly!"
  npc_override_hd_refiner_hd_refiner_hmm_one_you_want_refine_954a06: "Hmm... is this the one you want to refine?"
  npc_override_hd_refiner_hd_refiner_hmm_you_didn_t_bring_7378f2: "Hmm... You didn't bring all the materials needed."
  npc_override_hd_refiner_hd_refiner_huh_what_you_want_me_9e1a9a: "Huh? What do you want me to do?"
  npc_override_hd_refiner_hd_refiner_i_am_different_blacksmit_7e2a54: "I am different from the blacksmiths in others places."
  npc_override_hd_refiner_hd_refiner_i_am_sure_person_like_38b80c: "I am sure a person like you would never blame me for a decrease in refine level by 1. Hmm."
  npc_override_hd_refiner_hd_refiner_i_don_t_provide_normal_ab2cca: "But I don't provide a normal refine service."
  npc_override_hd_refiner_hd_refiner_i_ll_better_next_time_3fe5cf: "I'll do better next time! Don't worry!"
  npc_override_hd_refiner_hd_refiner_i_m_best_blacksmith_whol_d26081: "I'm the best Blacksmith in the whole world, Basta."
  npc_override_hd_refiner_hd_refiner_i_m_blacksmith_hairstyli_b3dc2a: "I'm a blacksmith, not a hairstylist."
  npc_override_hd_refiner_hd_refiner_i_only_handle_items_refi_395de8: "I only handle items with refine levels from +7 to +9."
  npc_override_hd_refiner_hd_refiner_i_only_refine_equipment_1f60d6: "I only refine equipment ^CC0000over +10^000000."
  npc_override_hd_refiner_hd_refiner_i_really_am_best_blacksm_21f883: "I really am the best blacksmith in the whole wide world!"
  npc_override_hd_refiner_hd_refiner_i_refine_only_items_0556e8: "I refine only items that are ^CC0000+7 to +9^000000."
  npc_override_hd_refiner_hd_refiner_i_t_make_you_smart_235ef6: "I can't make you smart. Go see a school teacher for that."
  npc_override_hd_refiner_hd_refiner_i_ve_given_all_precautio_2df75a: "I've given all precautions. Do you want to try it?"
  npc_override_hd_refiner_hd_refiner_i_wait_until_you_ready_a662be: "I will wait until you are ready."
  npc_override_hd_refiner_hd_refiner_if_you_try_refine_more_b6f26f: "If you try to refine it more, the refine level could decrease."
  npc_override_hd_refiner_hd_refiner_if_you_want_refine_your_293cdd: "If you want to refine your feet, don't come to me, try running a marathon."
  npc_override_hd_refiner_hd_refiner_impossible_refine_level_8de291: "It is impossible that the refine level will drop by, say, 3 or 4... that sounds scary."
  npc_override_hd_refiner_hd_refiner_item_t_refined_e2b347: "This item can't be refined."
  npc_override_hd_refiner_hd_refiner_looks_like_item_likely_f_aa4188: "It looks like this item will likely fail to be refined."
  npc_override_hd_refiner_hd_refiner_making_artificial_hands_31cae5: "Making artificial hands is not my specialty."
  npc_override_hd_refiner_hd_refiner_menu_yes_141459: "Yes:No"
  npc_override_hd_refiner_hd_refiner_my_hammer_i_make_you_8efa3d: "With my hammer, I will make you a star of the sky."
  npc_override_hd_refiner_hd_refiner_my_specialty_even_if_my_4947b9: "My specialty is that even if my refining fails, the refine level decreases by 1 without losing the gear. Isn't it great?"
  npc_override_hd_refiner_hd_refiner_need_unit_s_blacksmith_b_892756: "For +{0} {1} need ^316AC5{2} unit(s) Blacksmith Blessing^000000 can prevent the equipment from vanishing. Do you want to refine with Blacksmith Blessing?"
  npc_override_hd_refiner_hd_refiner_okay_if_s_what_you_81d42c: "Okay. If that's what you want..."
  npc_override_hd_refiner_hd_refiner_only_those_who_overcome_2fefc8: "Only those who overcome fear of failure will obtain a masterpiece."
  npc_override_hd_refiner_hd_refiner_oops_8bf1f6: "Oops!!"
  npc_override_hd_refiner_hd_refiner_order_refine_gear_you_se_b80b0a: "In order to refine the gear you selected you need ^ff9999{0}^000000 and 20,000 zeny as a fee."
  npc_override_hd_refiner_hd_refiner_pow_pow_pow_pow_f40f82: "Pow! Pow! Pow! Pow!"
  npc_override_hd_refiner_hd_refiner_refine_equipment_i_need_beb65b: "To refine this equipment, I need 1 ^ff9999{0}^000000 and {1} zeny as a fee."
  npc_override_hd_refiner_hd_refiner_refining_failed_e8bb24: "Refining has failed!"
  npc_override_hd_refiner_hd_refiner_refining_failed_refine_l_4b85b6: "Refining has failed and refine level has decreased!"
  npc_override_hd_refiner_hd_refiner_so_lets_kick_into_overdr_ddbf50: "So lets kick this into overdrive, what d' ya say? What item do you want to refine?"
  npc_override_hd_refiner_hd_refiner_sound_refreshes_my_mind_9251fc: "The sound refreshes my mind every time I hear it."
  npc_override_hd_refiner_hd_refiner_tac_tac_tac_7d9030: "Tac! Tac! Tac!"
  npc_override_hd_refiner_hd_refiner_too_bad_503d43: "Too bad."
  npc_override_hd_refiner_hd_refiner_unlike_others_i_am_black_5b4c20: "Unlike others, I am a blacksmith who refines a very limited number of items."
  npc_override_hd_refiner_hd_refiner_wait_second_2c0252: "Wait a second..."
  npc_override_hd_refiner_hd_refiner_weapon_perfect_no_need_r_9ccb0d: "This weapon is perfect, no need to refine it anymore~"
  npc_override_hd_refiner_hd_refiner_weapon_refine_unit_s_bla_f245a5: "For +{0} weapon, refine with^316AC5 {1} unit(s) Blacksmith Blessing^000000 can prevent the equipment from vanishing. Do you want use it to refine?"
  npc_override_hd_refiner_hd_refiner_well_cef2f0: "Well~"
  npc_override_hd_refiner_hd_refiner_well_even_if_fails_only_779849: "Well, even if it fails, it only decreases by 1 refine level."
  npc_override_hd_refiner_hd_refiner_well_i_don_t_see_21a0f9: "Well... I don't see any equipment worth refining."
  npc_override_hd_refiner_hd_refiner_what_321343: "What?!!"
  npc_override_hd_refiner_hd_refiner_what_you_want_me_b08d7a: "What do you want me to do?"
  npc_override_hd_refiner_hd_refiner_what_you_want_me_refine_280df6: "What do you want me to refine?"
  npc_override_hd_refiner_hd_refiner_where_accessory_a72c54: "Where is the accessory?"
  npc_override_hd_refiner_hd_refiner_where_foot_odor_coming_4086a6: "Where is this foot odor coming from?"
  npc_override_hd_refiner_hd_refiner_which_equipment_you_want_3eda9d: "Which equipment do you want to refine?"
  npc_override_hd_refiner_hd_refiner_woah_blacksmith_blessing_d20ed2: "Woah~ Is it the ^316AC5Blacksmith Blessing^000000? It is difficult to get~ But, you have it!"
  npc_override_hd_refiner_hd_refiner_you_even_know_what_robe_e22f9d: "Do you even know what a robe is?"
  npc_override_hd_refiner_hd_refiner_you_like_continue_refini_15de69: "Would you like to continue refining?"
  npc_override_hd_refiner_hd_refiner_you_really_want_refine_fb852d: "Do you really want to refine this?"
  npc_override_hd_refiner_hd_refiner_you_switched_item_while_1c504a: "You switched the item while I wasn't looking! Get out of here!"
  npc_override_hd_refiner_hd_refiner_you_them_ready_dc4fb3: "Do you have them ready?"
  npc_override_hd_refiner_hd_refiner_you_think_i_m_stupid_9a90ed: "Do you think I'm stupid?!"
  npc_override_hd_refiner_hd_refiner_your_head_equipment_3edd8d: "Is your head an equipment?"
