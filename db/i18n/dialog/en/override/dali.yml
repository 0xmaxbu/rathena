  npc_override_dali_dimensional_gap_mayor_asked_us_cooperate_1a2ede: "The Mayor has asked us to cooperate as best we can instead of fighting, so I'm under orders not to do anything.  Since we have a common enemy we won't fight the Sapha... for now..."
