  npc_override_dali_dimensional_gap_anyone_who_become_lost_h_4c5baa: "Anyone who has become lost here has yet to return."
  npc_override_dali_dimensional_gap_anything_you_want_ac6329: "Anything you want!"
  npc_override_dali_dimensional_gap_apple_grape_orange_a99eb1: "Apple, grape, orange~"
  npc_override_dali_dimensional_gap_as_you_know_we_ve_976b5f: "As you know we've already entered through the Dimensional Rift to get to Ash Vacuum right?  The Dimensional Gap is an expansion of that initial discovery."
