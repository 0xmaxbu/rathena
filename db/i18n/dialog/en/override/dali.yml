  npc_override_dali_dimensional_gap_desperate_help_92500c: "was desperate for help."
  npc_override_dali_dimensional_gap_dimensional_rift_connect_27944f: "This dimensional rift is connected to the southern area of the ^0000FFKamidal Mountains^000000 in El Dicastes.  I just dropped by for my research, but it is incredible."
  npc_override_dali_dimensional_gap_dimensional_rift_connect_434662: "This dimensional rift is connected to the Allied Forces ^0000FFExpedition Camp^000000 in Jotunheim."
  npc_override_dali_dimensional_gap_dimensional_rift_connect_5b8e47: "This dimensional rift is connected to the south of ^0000FFBifrost^000000.  It enables quick travel to the Splendide frontline."
  npc_override_dali_dimensional_gap_dimensional_rift_connect_885a22: "This dimensional rift is connected to ^0000FFMorocc^000000 back in Midgard."
  npc_override_dali_dimensional_gap_don_t_you_know_2b691a: "Don't you know?"
  npc_override_dali_dimensional_gap_establish_base_here_9d030c: "establish a base here for the"
  npc_override_dali_dimensional_gap_fastest_gateway_back_our_e418de: "This is the fastest gateway back to our world.  The area is still destroyed but restoration efforts will soon be on the way."
  npc_override_dali_dimensional_gap_get_outta_my_turf_67a875: "Get outta my turf!"
