Body:
  npc_override_job3_guil01_3rd_trader_after_you_lose_some_weig_0f3785: "- after you lose some weight. -"
  npc_override_job3_guil01_3rd_trader_currently_you_re_carryin_73594b: "- Currently you're carrying -"
  npc_override_job3_guil01_3rd_trader_enter_if_you_want_cancel_305c25: "Enter '0' if you want to cancel."
  npc_override_job3_guil01_3rd_trader_good_i_ve_received_money_88fd0a: "Good. I've received the money and the special item."
  npc_override_job3_guil01_3rd_trader_hey_come_back_when_you_08085d: "Hey, come back when you have all the requirements for the exchange."
  npc_override_job3_guil01_3rd_trader_how_many_you_want_9e4d82: "How many do you want?"
  npc_override_job3_guil01_3rd_trader_i_wander_around_world_co_250e73: "I wander around the world and collect rare poison herbs. Recently, I started dealing in the herb called Izidor. If you are interested, you can buy them."
  npc_override_job3_guil01_3rd_trader_i_wander_around_world_co_63b7f8: "I wander around the world and collect rare poison herbs. But I don't feel like selling my herbs to a person like you... ha ha ha..."
  npc_override_job3_guil01_3rd_trader_menu_how_ca995e: "How can I buy them?:Exchange it for Animal Blood:Exchange it for a Bitter Herb:Exchange it for a Deadly Noxious Herb:Exchange it for a Frozen Rose:Exchange it for Ment:Exchange it for Hinalle"
  npc_override_job3_guil01_3rd_trader_number_must_less_than_fa63f0: "The number must be less than 2,000!"
  npc_override_job3_guil01_3rd_trader_please_try_again_cefdd7: "- Please try again -"
  npc_override_job3_guil01_3rd_trader_there_several_types_rune_da9f61: "There are several types of runes."
  npc_override_job3_guil01_3rd_trader_too_many_items_you_fc968e: "- too many items with you. -"
  npc_override_job3_guil01_3rd_trader_wait_minute_17efa5: "- Wait a minute !! -"
  npc_override_job3_guil01_3rd_trader_why_i_ask_money_s_7e1900: "Why do I ask money? That's just to pay a little respect to a collector like me. Ha ha ha..."
  npc_override_job3_guil01_3rd_trader_you_buy_them_zeny_one_604700: "You can buy them for 10,000 zeny and one of these rare items, Animal Blood, Bitter Herb, Deadly Noxious Herb, Frozen Rose, Ment or an Hinalle."
  npc_override_job3_guil01_3rd_trader_you_element_each_propert_e6f397: "Do you have an element for each property?"
  npc_override_job3_guil01_3rd_trader_you_need_poison_0266d5: "Do you need poison?"
  npc_override_job3_guil01_3rd_trader_you_only_buy_maximum_ea_be7595: "You can only buy a maximum of '2000' ea."
  npc_override_job3_guil01_3rd_trader_you_ve_cancelled_trade_f003bf: "You've cancelled the trade."
