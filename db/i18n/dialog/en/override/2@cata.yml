Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_2@cata_SealedShrine_all_apostles_baphomet_de_26c9a9: "All apostles of Baphomet are dead!"
  npc_override_2@cata_SealedShrine_alright_i_ll_help_you_75feed: "Alright... I'll help you again."
  npc_override_2@cata_SealedShrine_anyone_who_fights_good_k_6fee71: "Anyone who fights for good will know, deep inside, that evil is threatening to conquer this world..."
  npc_override_2@cata_SealedShrine_apostles_cloning_themsel_92a9b9: "The apostles are cloning themselves to fill the shrine with their evil energy. They are the monsters here in this catacomb."
  npc_override_2@cata_SealedShrine_as_we_speak_satan_morocc_5bcefa: "But... As we speak Satan Morocc is marshalling his powerful magic in order to affect all life on this continent."
  npc_override_2@cata_SealedShrine_as_you_know_we_don_c7c5d5: "As you know... We don't have much time. You can't stop Baphomet by yourselves. The power of the devil has strengthened over the years."
  npc_override_2@cata_SealedShrine_baphomet_also_awakened_p_ebaa0b: "Baphomet also... has awakened and is preparing for his revival, into this world, by weakening the power of the seal through the power of Satan Morocc..."
  npc_override_2@cata_SealedShrine_baphomet_name_devil_i_th_093e72: "Baphomet... is the name of the Devil... I think you have heard of his name."
  npc_override_2@cata_SealedShrine_baphomet_s_power_about_b_f0ae9e: "Baphomet's power is about to break the seal that we made. If you don't reactivate them... Baphomet's revival will only be a matter of time."
  npc_override_2@cata_SealedShrine_bottom_main_altar_trembl_6471a3: "The bottom of the Main Altar trembles furiously."
  npc_override_2@cata_SealedShrine_called_gigantic_magestic_0d08d0: "It is called the ^4d4dffGigantic Magestic Goat^000000. You'll realize that the Magestic Goat you're familiar with is nothing in comparison."
  npc_override_2@cata_SealedShrine_complicated_magical_rune_ed3a3b: "Complicated Magical Rune letters blink rapidly, attempting to suppress the dreadful power within."
  npc_override_2@cata_SealedShrine_cool_i_ll_help_you_a1c58d: "Cool... I'll help you make the evil doll useful. What? What can I do?"
  npc_override_2@cata_SealedShrine_curse_baphomet_disappear_0ddc7a: "The curse of Baphomet disappears after a certain amount of time after you entered."
  npc_override_2@cata_SealedShrine_cursed_baphomet_doll_mag_730227: "^0000FFCursed Baphomet Doll, Magestic Goat, 30 Crystal of Darkness, 50 Fragment of Darkness^000000, and the most important, production cost is ^0000FF990000^000000 Zeny."
  npc_override_2@cata_SealedShrine_cursed_baphomet_doll_mos_bcb7d4: "The Cursed Baphomet Doll is the most important ingredient... I'll make you if you want. What would you like to do?"
  npc_override_2@cata_SealedShrine_did_you_bring_all_ingred_810891: "Did you bring all of the ingredients?"
  npc_override_2@cata_SealedShrine_did_you_find_pendant_4186aa: "Did you find the pendant?"
  npc_override_2@cata_SealedShrine_did_you_get_essence_fire_47d8e3: "Did you get 10 ^0000FFEssence of Fire^000000 and ^0000FFToken of Apostle^000000?"
  npc_override_2@cata_SealedShrine_enter_dangerous_place_yo_d1801b: "To enter this dangerous place, you can't go alone. Come again after you join a party."
  npc_override_2@cata_SealedShrine_evil_power_too_terrible_69b3e5: "An evil power, too terrible to describe, lies under the great altar radiating a violet color."
  npc_override_2@cata_SealedShrine_example_skills_like_safe_c0387d: "For example, the skills like ^0000FFSafety Wall and Assumptio^000000... So you'd better prepare before entering the shrine."
  npc_override_2@cata_SealedShrine_go_ahead_warriors_719503: "Go ahead, warriors."
  npc_override_2@cata_SealedShrine_go_see_rust_blackhand_wh_30dab0: "Go to see ^0000FFRust Blackhand^000000 who is near the main building of the monastery... He will make this doll helpful to you."
  npc_override_2@cata_SealedShrine_good_job_my_descendants_127795: "Good job, my descendants... You've finished the long-cherished task that me and my bretheren could not complete."
  npc_override_2@cata_SealedShrine_grand_appearance_heat_fi_c946d4: "The grand appearance and heat of the fire makes me step back... But I pluck up my courage and reach out to pick up the torch."
  npc_override_2@cata_SealedShrine_gravestone_carving_wicke_edfcfc: "This gravestone has a carving of a wicked devil with large horns. It arouses an ominous feeling."
  npc_override_2@cata_SealedShrine_gravestone_trembling_eca995: "The gravestone is trembling..."
  npc_override_2@cata_SealedShrine_haaaaaaap_hocus_pocus_wi_55b50f: "Haaaaaaap... Hocus Pocus Wingardium Abracadabra!!!!!"
  npc_override_2@cata_SealedShrine_haaaaaaap_wingardium_lev_f8fd11: "Haaaaaaap... Wingardium Leviosa Expecto Patronum !!!!!"
  npc_override_2@cata_SealedShrine_hmm_s_been_such_long_f958e1: "Hmm... It's been such a long time since I last saw these wicked horns... kkk... Let me start..."
  npc_override_2@cata_SealedShrine_however_baphomet_never_g_46b3ce: "However, Baphomet never gave up. He continuously strengthened his power. And his power has brought new life to this shrine."
  npc_override_2@cata_SealedShrine_huge_torch_appearing_as_31bdb1: "A huge torch appearing as if it can burn everything is bobbing up and down in front of me.."
  npc_override_2@cata_SealedShrine_huge_torch_appearing_as_4a38d0: "A huge torch appearing as if it can burn everything is bobbing up and down in front of me."
  npc_override_2@cata_SealedShrine_huh_don_t_you_know_a42cf5: "Huh... Don't you know? This is St. Capitolina Monastery where the Brothers who wish to become monks train and pray."
  npc_override_2@cata_SealedShrine_huh_you_whatever_you_wan_8c8dbe: "Huh... Do you? Do whatever you want... Do you really want to let this opportunity go to waste?"
  npc_override_2@cata_SealedShrine_huu_s_over_now_i_832f51: "Huu... It's over. Now that I've released Baphomet's Curse, you can enter again."
  npc_override_2@cata_SealedShrine_huu_s_over_now_i_c8ead6: "Huu... It's over. Now I released all of the curses on you. You can enter again."
  npc_override_2@cata_SealedShrine_huu_you_don_t_understand_cc33af: "Huu... You don't understand what I said. You cannot make anything with these ingredients."
  npc_override_2@cata_SealedShrine_i_don_t_accept_complaint_46f157: "I don't accept complaints or A/S requests, so use it with care. I must go..."
  npc_override_2@cata_SealedShrine_i_feel_power_altar_came_11b866: "I can feel the power of the altar came back by adding magical power."
  npc_override_2@cata_SealedShrine_i_feel_something_odd_gra_00dc6b: "I can feel something odd at the grave. It's like someone is calling out silently..."
  npc_override_2@cata_SealedShrine_i_feel_voice_becoming_fa_c020aa: "I can feel the voice becoming faint."
  npc_override_2@cata_SealedShrine_i_ll_complete_opening_se_eef31b: "I'll complete opening the sealed gate when your representative tells me that you're ready."
  npc_override_2@cata_SealedShrine_i_ll_give_token_inherito_6dcf5b: "I'll give the token of the Inheritor of Faith to the party leader. Only the party leader can collect the ^0000FFEssence of Fire^000000."
  npc_override_2@cata_SealedShrine_i_ll_tell_you_ingredient_a14192: "I'll tell you the ingredients one more time, so please gather them correctly."
  npc_override_2@cata_SealedShrine_i_ll_tell_you_ingredient_f42233: "I'll tell you the ingredients again. So, do you want to make?"
  npc_override_2@cata_SealedShrine_i_m_sure_you_get_4597b7: "I'm sure that you can get the ingredients because you sealed the real Baphomet. Can't you? kkk..."
  npc_override_2@cata_SealedShrine_i_make_strong_large_horn_89a70e: "I can make the strong and large horns of the wicked devil Baphomet for you. A helm that has his immense power."
  npc_override_2@cata_SealedShrine_i_moved_my_soul_s_2d5cf1: "I moved my soul's essence to my pendant, so that I could remain in this world. That's when I became this grave's guardian."
  npc_override_2@cata_SealedShrine_i_must_substantialized_w_948351: "I must be substantialized within the next hour. To reach the Main Altar underground, you must help me perform the ceremony for opening each seal."
  npc_override_2@cata_SealedShrine_i_nothing_say_you_983f92: "I have nothing to say to you..."
  npc_override_2@cata_SealedShrine_i_one_warriors_stop_baph_81c305: "I was one of the warriors to stop Baphomet like you. Now, I'm dead and only my soul remains..."
  npc_override_2@cata_SealedShrine_i_only_feel_gloom_graves_477266: "I can only feel gloom from this Gravestone."
  npc_override_2@cata_SealedShrine_i_really_appreciate_your_715382: "I really appreciate your help."
  npc_override_2@cata_SealedShrine_i_think_pendant_21b02d: "I think this is the pendant..."
  npc_override_2@cata_SealedShrine_i_waited_waited_brave_ad_358bc2: "I have waited and waited for a brave adventurer like you who will come back here again..."
  npc_override_2@cata_SealedShrine_i_want_talk_representati_6da69a: "I want to talk to ^0000FFa representative among your party^000000. Everyone else, wait here."
  npc_override_2@cata_SealedShrine_if_baphomet_perceives_yo_3f4923: "If Baphomet perceives you when you pass through the sealed gate, he may release his tremendous magical power. Then, this abbey will be demolished."
  npc_override_2@cata_SealedShrine_if_each_party_member_pos_449971: "If each party member possesses a ^0000FFToken of Apostle^000000, Baphomet will not be able to perceive your entrance to the Main Altar underground."
  npc_override_2@cata_SealedShrine_if_you_don_t_business_fa2bcf: "If you don't have business with me, go away! As you see, I make equipment for the Brothers at the monastery, not for adventurers like you. Do you understand?"
  npc_override_2@cata_SealedShrine_if_you_leave_please_say_dad8f9: "If you leave, please say hello to Patrick for me."
  npc_override_2@cata_SealedShrine_if_you_want_make_doll_268474: "If you want to make the doll into a ^4d4dffGigantic Magestic Goat^000000 again, I can make you another."
  npc_override_2@cata_SealedShrine_if_your_party_leader_bri_441ea5: "If your ^0000FFparty leader^000000 brings me the pendant, my soul can be substantialized. So, hurry up."
  npc_override_2@cata_SealedShrine_just_dangerous_useless_t_943cd2: "It is just a dangerous and useless thing if you do nothing with it... I'll introduce someone who can help you... Do you want to see him?"
  npc_override_2@cata_SealedShrine_kill_apostles_baphomet_f_eb8b41: "Kill the Apostles of Baphomet and find their ^0000FFToken of Apostle^000000."
  npc_override_2@cata_SealedShrine_kill_apostles_get_token_eb1cbb: "Kill the apostles and get the ^0000FFToken of Apostle^000000."
  npc_override_2@cata_SealedShrine_kill_apostles_they_only_f0bc20: "Kill the Apostles. They can only be distinguished from their clones because they will possess a ^0000FFToken of Apostle^000000..."
  npc_override_2@cata_SealedShrine_kkk_yes_wise_men_take_33fe5d: "kkk... Yes, wise men take their chances when the opportunity comes. I'll tell you the ingredients. Don't forget, and bring them all."
  npc_override_2@cata_SealedShrine_kkk_you_prepared_ingredi_29a9e7: "kkk... You prepared the ingredients well. Why don't you leave it there and wait?"
  npc_override_2@cata_SealedShrine_krrrr_krrrr_7d25d5: "'Krrrr... Krrrr...'"
  npc_override_2@cata_SealedShrine_let_me_see_needless_say_444fef: "Let me see... Needless to say, Patric must have sent you here to deal with the doll, right?"
  npc_override_2@cata_SealedShrine_make_sure_you_listened_a_c52a56: "Make sure that you have listened to all that I have to say before saying that you are ready."
  npc_override_2@cata_SealedShrine_make_sure_your_party_lea_d8be20: "Make sure that your party leader has listened to my explanation of what you and your companions must do."
  npc_override_2@cata_SealedShrine_may_difficult_i_wish_you_f32247: "It may be difficult but I wish you luck braving the perils of this catacomb."
  npc_override_2@cata_SealedShrine_member_party_entered_sea_4c2728: "[{0}] member of the [{1}] party has entered the Sealed Shrine."
  npc_override_2@cata_SealedShrine_menu_about_5ae3f1: "About the Cursed Baphomet Doll:Stop talking."
  npc_override_2@cata_SealedShrine_menu_ancient_00524f: "Ancient Hero's Soul : We failed... However... We still have a chance. I hope you will train yourselves until the time comes."
  npc_override_2@cata_SealedShrine_menu_ancient_019290: "Ancient Hero's Soul : The magical power of the seal at 10 o'clock is running out. Go to 10 o'clock and put the magical power in the seal."
  npc_override_2@cata_SealedShrine_menu_ancient_32b9b8: "Ancient Hero's Soul : Don't be discouraged, Baphomet can still be defeated!"
  npc_override_2@cata_SealedShrine_menu_ancient_3deb8a: "Ancient Hero's Soul : The seal of the Main Altar is running out. Strengthen the Main Altar's seal!"
  npc_override_2@cata_SealedShrine_menu_ancient_4922ad: "Ancient Hero's Soul : I'll wait for you in front of the altar of fire located at the center"
  npc_override_2@cata_SealedShrine_menu_ancient_59da1a: "Ancient Hero's Soul : We have only 1 hour to stop Baphomet. If time runs out, the power of the seals will be useless."
  npc_override_2@cata_SealedShrine_menu_ancient_61ecb8: "Ancient Hero's Soul : The magical power of the central seal is running out. Go to the central seal and put the magical power."
  npc_override_2@cata_SealedShrine_menu_ancient_70bc2a: "Ancient Hero's Soul : We don't have enough time! Hurry up!"
  npc_override_2@cata_SealedShrine_menu_ancient_7dcfd5: "Ancient Hero's Soul : My descendants... Listen carefully to what I'm going to say."
  npc_override_2@cata_SealedShrine_menu_ancient_7eae9a: "Ancient Hero's Soul : The magical power of the seal at 8 o'clock is running out. Go to 8 o'clock and put the magical power in the seal."
  npc_override_2@cata_SealedShrine_menu_ancient_a692b8: "Ancient Hero's Soul : You should lure Baphomet to the unsealed Altars. Otherwise, your efforts will be futile."
  npc_override_2@cata_SealedShrine_menu_ancient_b60ba0: "Ancient Hero's Soul : Once the seals recover their power, Baphomet will be vulnerable."
  npc_override_2@cata_SealedShrine_menu_ancient_b9fe64: "Ancient Hero's Soul : Go to the altars and activate their seals."
  npc_override_2@cata_SealedShrine_menu_ancient_c12675: "Ancient Hero's Soul : Find these altars and activate their seals before Baphomet revives."
  npc_override_2@cata_SealedShrine_menu_ancient_c88149: "Ancient Hero's Soul : Now you can go to the Main Altar's gate. It is located in the Southeast"
  npc_override_2@cata_SealedShrine_menu_ancient_c9f25a: "Ancient Hero's Soul : My body is disappearing... Hurry up!"
  npc_override_2@cata_SealedShrine_menu_ancient_dd136d: "Ancient Hero's Soul : Everything is over... There is no other way but to wait for the next chance..."
  npc_override_2@cata_SealedShrine_menu_ancient_e7485e: "Ancient Hero's Soul : The magical power of the seal at 2 o'clock is running out. Go to 2 o'clock and put the magical power in the seal."
  npc_override_2@cata_SealedShrine_menu_ancient_ef6304: "Ancient Hero's Soul : The altars that control the Main Altar's power are located in the Northeast, Southeast, Southwest and Northwest corners of this room."
  npc_override_2@cata_SealedShrine_menu_ancient_f777ac: "Ancient Hero's Soul : The magical power of the seal at 4 o'clock is running out. Go to 4 o'clock and put the magical power in the seal."
  npc_override_2@cata_SealedShrine_menu_ancient_fc4552: "Ancient Hero's Soul : My God! The seal of the Main Altar is weakening!"
  npc_override_2@cata_SealedShrine_menu_ancient_fd76bd: "Ancient Hero's Soul : We can't stop Baphomet with the magical power of the seals anymore. Now everything depends on God..."
  npc_override_2@cata_SealedShrine_menu_apostle_2ac698: "Apostle of Baphomet : Hurry up and release the seals of the altars! Our Master's return is upon us!"
  npc_override_2@cata_SealedShrine_menu_apostle_c44669: "Apostle of Baphomet : Kill the humans! Don't let them interrupt the revival of our Master!"
  npc_override_2@cata_SealedShrine_menu_apostle_d12ea6: "Apostle of Baphomet : Kill the humans! Do not stop the revival of our Master!"
  npc_override_2@cata_SealedShrine_menu_apostle_fa8074: "Apostle of Baphomet : Humans! Humans have invaded our sanctum!"
  npc_override_2@cata_SealedShrine_menu_baphomet_0ebe97: "Baphomet : No! Nonono! How dare these weaklings defeat me!... No!!..."
  npc_override_2@cata_SealedShrine_menu_baphomet_1a372c: "Baphomet : No one can harm me here. You will be my first sacrifice."
  npc_override_2@cata_SealedShrine_menu_baphomet_2a3334: "Baphomet : krrrr... Now you can't stop me with the seals. All you can do is wait for death!"
  npc_override_2@cata_SealedShrine_menu_baphomet_4cf562: "Baphomet : It's too late, weaklings... Now, you'll feel the despair of death!"
  npc_override_2@cata_SealedShrine_menu_baphomet_5d9990: "Baphomet : Humans... interfering again..."
  npc_override_2@cata_SealedShrine_menu_baphomet_7ff819: "Baphomet : It's useless. Make more seals. I'll crush them all. None of you will survive!"
  npc_override_2@cata_SealedShrine_menu_i_0e8c5e: "I want to make one!:I don't need one."
  npc_override_2@cata_SealedShrine_menu_i_62e625: "I want.:No, I don't want."
  npc_override_2@cata_SealedShrine_menu_let_1d34ce: "Let me leave the shrine.:Stop talking."
  npc_override_2@cata_SealedShrine_menu_tell_a76c4f: "Tell me more.:Stop talking."
  npc_override_2@cata_SealedShrine_menu_touch_24d2d7: "Touch the stone.:Step back."
  npc_override_2@cata_SealedShrine_menu_what_86bef3: "What is this place?:I want to enter.:About the Cursed Baphomet Doll.:Cancel."
  npc_override_2@cata_SealedShrine_menu_what_eb2e2a: "What is this place?:I want to enter.:Cancel."
  npc_override_2@cata_SealedShrine_menu_what_f4f010: "What is Essence of Fire?:What is a Token of Apostle?:What should I do?:I am ready."
  npc_override_2@cata_SealedShrine_menu_who_65cf94: "Who are you?:Waited for me?:Cancel."
  npc_override_2@cata_SealedShrine_might_better_kill_all_th_acdaf6: "It might be better to kill all of them because there is no way to differentiate them from their clones."
  npc_override_2@cata_SealedShrine_msg_6eae3a: "..."
  npc_override_2@cata_SealedShrine_msg_8707ce: "... ..."
  npc_override_2@cata_SealedShrine_msg_e0b936: "... ... ..."
  npc_override_2@cata_SealedShrine_name_leader_591aa7: "Name of the leader is {0}..."
  npc_override_2@cata_SealedShrine_now_i_ll_carve_you_d61dcc: "Now I'll carve you the symbol which shows you're a inheritor of faith. Be aware that no one in your party but you can collect the Essence of Fire."
  npc_override_2@cata_SealedShrine_now_i_ll_tell_you_ab0a01: "Now I'll tell you what should you do. First, collect ^0000FFEssence of Fire^000000 from the torches on the graves..."
  npc_override_2@cata_SealedShrine_now_i_m_looking_someone_ebf0b1: "Now... I'm looking for someone brave enough to reseal Baphomet in its shrine... as we once did many years ago..."
  npc_override_2@cata_SealedShrine_now_i_substantialize_my_e447c4: "Now I can substantialize my soul. I'll wait for you in front of the altar of fire located at the center of this grave. Let's meet there."
  npc_override_2@cata_SealedShrine_now_you_go_main_altar_78ccb9: "Now you can go to the main altar. It is located in the bottom right corner of this floor."
  npc_override_2@cata_SealedShrine_numerous_brave_men_broth_cb6117: "Numerous brave men and brothers have trained in this monastery..."
  npc_override_2@cata_SealedShrine_okay_i_ll_adjust_shrine_71e40a: "Okay... I'll adjust the shrine's seal so that you and your group can enter."
  npc_override_2@cata_SealedShrine_okay_i_ll_let_you_bf708e: "Okay. I'll let you and your group leave here safely."
  npc_override_2@cata_SealedShrine_okay_you_ve_done_your_5d0780: "Okay. You've done your work. Tell your representative to check your companions and come to me when everyone has finished their work."
  npc_override_2@cata_SealedShrine_okay_you_ve_done_your_e85875: "Okay. You've done your work. Now check your companions and tell me when everyone has finished their work."
  npc_override_2@cata_SealedShrine_once_party_leader_permit_31202b: "Once the party leader is permitted, the rest of the party can enter. This is a rule of this monastery, so please understand."
  npc_override_2@cata_SealedShrine_one_more_thing_cursed_ar_c67c89: "And one more thing... In this cursed area, some skills, which are protected by outer physical power are prohibited by the effect of the seal."
  npc_override_2@cata_SealedShrine_one_thing_you_must_remem_72d3ff: "One thing you must remember is... ^0000FFEssence of Fire^000000 can only be collected by the Inheritor of Faith."
  npc_override_2@cata_SealedShrine_one_thing_you_should_rem_97ad6e: "One thing that you should remember is... Anyone who enters this shrine will be cursed by Baphomet and cannot enter or leave while they are cursed."
  npc_override_2@cata_SealedShrine_open_entrance_you_must_s_d38d45: "To open the entrance, you must substantialize my soul. I'll open the entrance and reactivate the weakened seals after I am substantilized."
  npc_override_2@cata_SealedShrine_open_sealed_underground_c64a9d: "To open the sealed underground gate, I must be purified by the ^0000FFEssence of Fire^000000 which has the power of Thor. Collect ^0000FF10 Essence of Fire^000000 from the torches."
  npc_override_2@cata_SealedShrine_our_souls_finally_rest_p_b790d1: "Our souls can finally rest in peace..."
  npc_override_2@cata_SealedShrine_party_name_770034: "Party name is {0}..."
  npc_override_2@cata_SealedShrine_past_my_companions_i_sea_b257b9: "In the past, my companions and I sealed Baphomet at the altar located on the 2nd basement and blocked the entrance."
  npc_override_2@cata_SealedShrine_peace_world_cannot_last_e2a68f: "The peace of this world cannot last forever... The hands of Evil are reaching into the world again..."
  npc_override_2@cata_SealedShrine_place_what_i_say_yes_577b05: "And this place is... What can I say... Yes. It's the grave of the Devil. Grave..."
  npc_override_2@cata_SealedShrine_please_train_more_come_a_444571: "Please train more and come again."
  npc_override_2@cata_SealedShrine_ready_yet_you_should_pre_81b477: "Not ready yet? You should prepare 10 ^0000FFEssence of Fire^000000 and ^0000FFToken of Apostle^000000."
  npc_override_2@cata_SealedShrine_ready_yet_you_should_pre_dc98c9: "Not ready yet? You should prepare ^0000FFToken of Apostle^000000."
  npc_override_2@cata_SealedShrine_remember_you_need_collec_4bf072: "Remember, you need to collect ^0000FF10 Essence of Fire^000000 from the torches and the ^0000FFToken of Apostle^000000 from the Apostles of Baphomet."
  npc_override_2@cata_SealedShrine_remind_you_again_i_must_189bde: "To remind you again, I must be substantialized within the next hour. So everyone, finish your work within that time!"
  npc_override_2@cata_SealedShrine_remind_you_again_i_subst_801085: "To remind you again, I can be substantialized for the next hour. So everyone, finish your work within that time."
  npc_override_2@cata_SealedShrine_s_cold_touch_doesn_t_e89eb8: "It's cold to the touch. It doesn't respond."
  npc_override_2@cata_SealedShrine_s_correct_i_feel_baphome_eba92d: "That's correct... I can feel Baphomet's evil inside... So, what will you do with the doll?"
  npc_override_2@cata_SealedShrine_s_done_you_may_excited_c40590: "It's done. You may be excited, of course. I understand..."
  npc_override_2@cata_SealedShrine_seal_activated_putting_m_ad80ff: "The seal activated by putting magical power into the altar."
  npc_override_2@cata_SealedShrine_second_all_members_who_e_64c662: "Second, all members who will enter the underground must carry a symbol, called the Token of Apostle."
  npc_override_2@cata_SealedShrine_seems_you_entered_shrine_04ce6a: "It seems you have entered this shrine recently... You cannot reenter because the curse of Baphomet still remains."
  npc_override_2@cata_SealedShrine_seems_you_entered_shrine_1c5725: "It seems you have entered this shrine recently... You cannot reenter because Baphomet's Curse still remains. Baphomet's Curse disappears only after a certain amount of time has passed."
  npc_override_2@cata_SealedShrine_small_object_shining_und_36e38a: "A small object is shining under a leaning grave."
  npc_override_2@cata_SealedShrine_some_these_monsters_magi_fee3b4: "Some of these monsters have magical powers. Baphomet calls them his 'Apostles'."
  npc_override_2@cata_SealedShrine_struggle_peace_world_nev_79a250: "The struggle for peace on this world will never end. But... my role here is finally over because there are brave heroes like you."
  npc_override_2@cata_SealedShrine_substantialize_my_soul_y_4e3060: "To substantialize my soul, you should find my pendant. You can find my body near a grave here."
  npc_override_2@cata_SealedShrine_symbol_inheritor_shines_39994e: "The symbol of inheritor shines. Then a small crystal falls into my hand from the torch."
  npc_override_2@cata_SealedShrine_time_impossible_get_rid_2aa39a: "At that time, it was impossible to get rid of Devil Baphomet by ourselves. After numerous heroes sacrificed their lives, we could barely seal him under this Abbey."
  npc_override_2@cata_SealedShrine_train_more_use_your_skil_de053b: "Train more and use your skills to protect the world from evil's looming presence..."
  npc_override_2@cata_SealedShrine_tut_tut_i_don_t_a05339: "Tut, tut... I don't care if the wicked doll threatens your life all the time!"
  npc_override_2@cata_SealedShrine_umm_i_recognize_your_cou_fa89f7: "Umm... I recognize your courage, but... I can't permit anyone to enter this place. I can only permit the leader of a party to enter first."
  npc_override_2@cata_SealedShrine_umm_seems_baphomet_s_cur_68f27b: "Umm... It seems that Baphomet's Curse has weakened. I can remove it now."
  npc_override_2@cata_SealedShrine_umm_seems_curse_baphomet_fdcbdf: "Umm... It seems the curse of Baphomet weakened. I'll clear the bad curse."
  npc_override_2@cata_SealedShrine_umm_seems_there_problem_159fdd: "Umm... But it seems that there is a problem here... I'll check quickly. Please wait."
  npc_override_2@cata_SealedShrine_umm_you_should_train_mor_ac556f: "Umm... You should train more to enter this dangerous place... You should reach at least Lv 75 to enter here."
  npc_override_2@cata_SealedShrine_under_gravestone_front_y_f1c785: "Under this gravestone in front of you... Baphomet is sealed."
  npc_override_2@cata_SealedShrine_very_place_where_great_d_32b357: "The very place where the great Devil who once demolished this world is sleeping."
  npc_override_2@cata_SealedShrine_villainous_doll_you_hold_8c64c9: "That is... the villainous doll that you are holding... Let me see it."
  npc_override_2@cata_SealedShrine_watch_out_something_some_5ac631: "Watch out! Something... Something is coming."
  npc_override_2@cata_SealedShrine_what_brought_you_place_67bedd: "What brought you to this place?"
  npc_override_2@cata_SealedShrine_what_dull_boy_he_huh_c9d3cc: "What a dull boy he is... huh..."
  npc_override_2@cata_SealedShrine_what_hmmm_did_you_get_7f54ea: "What?... Hmmm... Did you get the doll? You're pretty good, unlike your appearance..."
  npc_override_2@cata_SealedShrine_what_you_again_what_you_214098: "What?... You again? What do you want this time?"
  npc_override_2@cata_SealedShrine_what_you_doing_entrance_4e3421: "What are you doing? The entrance of the main altar is opened now, go and fight! The entrance is near the bottom right side of this floor."
  npc_override_2@cata_SealedShrine_what_you_got_another_dol_e25b5b: "What? You got another doll from the wicked devil? Umm... You're much better than I thought..."
  npc_override_2@cata_SealedShrine_when_all_you_ready_go_30f4e6: "When all of you are ready to go, let me know. I'll open the sealed gate when you're ready."
  npc_override_2@cata_SealedShrine_when_touching_gravestone_a5f3e8: "When touching the gravestone, I hear a voice."
  npc_override_2@cata_SealedShrine_when_you_see_sign_put_75bc0a: "When you see the sign, put your hands on the gravestone... Then you can move inside."
  npc_override_2@cata_SealedShrine_where_your_token_apostle_f33aff: "Where is your Token of Apostle? I said you should carry the Token of Apostle to pass this gate."
  npc_override_2@cata_SealedShrine_who_you_what_you_want_4901f5: "Who are you? What do you want me for?"
  npc_override_2@cata_SealedShrine_why_you_hanging_around_h_db7fb5: "Why are you hanging around here? If you don't want a ^4d4dffGigantic Magestic Goat^000000, go away."
  npc_override_2@cata_SealedShrine_yes_my_pendant_6063d3: "Yes... This is... My pendant..."
  npc_override_2@cata_SealedShrine_you_don_t_need_collect_b05d28: "You don't need to collect Essence of Fire anymore."
  npc_override_2@cata_SealedShrine_you_essence_fire_already_353ba8: "You have 10 Essence of Fire already, so you don't need to collect any more."
  npc_override_2@cata_SealedShrine_you_find_my_body_near_2e98cd: "You can find my body near a grave here. Go and get my pendant there."
  npc_override_2@cata_SealedShrine_you_get_magestic_goat_we_24d5c6: "You can get the Magestic Goat from the weak Baphomet in the Labyrinth Forest. Crystal of Darkness and Fragment of Darkness are from the Incarnation of Morocc."
  npc_override_2@cata_SealedShrine_you_inheritor_faith_dese_e36d09: "You are not a inheritor of faith. Do not desecrate the Essence of Fire with your disrespectful hands."
  npc_override_2@cata_SealedShrine_you_ll_never_know_how_5130e0: "You'll never know how great this hat is until you get one. If you understood, go and get the ingredients."
  npc_override_2@cata_SealedShrine_you_look_like_leader_par_f9fb44: "You look like the leader of this party. You need to go and get ^0000FF10 Essence of Fire^000000 from the torches."
  npc_override_2@cata_SealedShrine_you_mean_you_ll_go_c95aff: "Do you mean you'll go to the shrine and reseal Baphomet?"
  npc_override_2@cata_SealedShrine_you_re_monk_then_what_669dca: "You're not a monk, then what do you want?"
  npc_override_2@cata_SealedShrine_you_ready_b68a42: "Are you ready?"
  npc_override_2@cata_SealedShrine_you_ready_go_then_i_11d37a: "Are you ready to go? Then I'll open this sealed gate now."
  npc_override_2@cata_SealedShrine_you_ready_i_opened_seale_10d6ba: "Are you ready? I opened the sealed gate. To pass the gate, you should carry a ^0000FFToken of Apostle^000000."
  npc_override_2@cata_SealedShrine_you_see_sign_when_seal_b03dad: "You will see a sign when the seal has broken. Please wait until the sign appears..."
  npc_override_2@cata_SealedShrine_you_see_torches_here_the_ba1915: "You can see the torches here and there. These torches are the essence of Thor, the god of Thunder. They are inherited from our predecessors to stop the darkness of Baphomet..."
  npc_override_2@cata_SealedShrine_you_should_also_carry_to_f3e442: "You should also carry a ^0000FFToken of Apostle^000000, so find one for yourself too."
  npc_override_2@cata_SealedShrine_you_still_something_here_57db7b: "Do you still have something to do here? If you're done I'll let you leave safely..."
  npc_override_2@cata_SealedShrine_you_still_there_bring_ba_0f9572: "Are you still there? Bring back my pendant as soon as possible."
  npc_override_2@cata_SealedShrine_you_t_use_your_magic_da42e2: "But you can't use your magic for 3 minutes because you used your SP on the altar."
  npc_override_2@cata_SealedShrine_you_token_apostle_8b6bdc: "Do you have a ^0000FFToken of Apostle^000000?"
  npc_override_2@cata_SealedShrine_you_ve_failed_open_seal_d89200: "You've failed to open the seal of main altar."
  npc_override_2@cata_SealedShrine_your_help_my_soul_substa_c04c3a: "With your help, my soul can be substantialized. I want to talk more, but we do not have enough time..."
  npc_override_2@cata_SealedShrine_your_real_battle_begin_i_a4d170: "Your real battle will begin... I'll follow you soon and find a way to help you."
  npc_override_2@cata_SealedShrine_your_sp_recovered_yet_yo_d148d6: "Your SP has not recovered yet. You lost your SP on the altar, but it seems the power of the seal has returned."
