Body:
  npc_override_1@air1_AirshipAssault_after_dimension_device_f_0405cb: "^ff0000After dimension device has formed^000000"
  npc_override_1@air1_AirshipAssault_ah_argh_8017b0: "Ah.. Argh!!"
  npc_override_1@air1_AirshipAssault_ah_argh_help_me_26baf9: "Ah... Argh! Help me!!"
  npc_override_1@air1_AirshipAssault_ah_iris_you_trying_kill_c3a4cc: "Ah...Iris!! Are you trying to kill me~!!"
  npc_override_1@air1_AirshipAssault_ahahahahaha_1aa2e5: "Ahahahahaha!!"
  npc_override_1@air1_AirshipAssault_ahhhhhh_3a2c01: "Ahhhhhh~"
  npc_override_1@air1_AirshipAssault_alert_alert_large_wyvern_6bd343: "Alert!! Alert!! A large Wyvern unit at 7 o'clock!!"
  npc_override_1@air1_AirshipAssault_all_enemies_floor_been_d_af5d1a: "All the enemies on this floor have been defeated. Go down to the next floor."
  npc_override_1@air1_AirshipAssault_all_enemies_floor_been_d_ce795e: "All the enemies on this floor have been defeated. Go up to the deck."
  npc_override_1@air1_AirshipAssault_all_enemies_floor_been_d_d3c04d: "All the enemies on this floor have been defeated. Head to the engine room entrance."
  npc_override_1@air1_AirshipAssault_all_enemies_one_floor_de_5ca3f9: "All the enemies on one floor have to be defeated in order to progress."
  npc_override_1@air1_AirshipAssault_all_engines_confirmed_ha_333608: "All engines confirmed halted!!"
  npc_override_1@air1_AirshipAssault_all_honesty_overstatemen_63596a: "In all honesty it is not an overstatement to say a rock the size of a thumb is moving this ship. It possesses an incredible power."
  npc_override_1@air1_AirshipAssault_argh_aaah_62a376: "Argh! Aaah~!!"
  npc_override_1@air1_AirshipAssault_argh_rear_engine_number_01c135: "Argh!! Rear engine number 1!!"
  npc_override_1@air1_AirshipAssault_argh_rune_engine_engine_51f602: "Argh! The Rune Engine!! The engine room has exploded!! Fire suppression team! Put out the fire!!"
  npc_override_1@air1_AirshipAssault_arrgh_en_engine_ca5091: "Arrgh... the en..engine!"
  npc_override_1@air1_AirshipAssault_as_expected_our_intuitio_da71af: "As expected. Our intuition wasn't wrong. It was fruitful to have followed the wave of evil and come this far."
  npc_override_1@air1_AirshipAssault_as_expected_you_freyja_s_97cb1e: "As expected. You are Freyja's pawn?"
  npc_override_1@air1_AirshipAssault_as_you_see_we_heat_517110: "As you can see, we heat the large boiler to boil water then use the pressure of the steam to move the pistons which turns the cogwheel and moves the turbine to turn the propeller."
  npc_override_1@air1_AirshipAssault_b_i_n_g_o_c155a1: "B.I.N.G.O. ~"
  npc_override_1@air1_AirshipAssault_babang_bang_004d41: "- Babang! Bang!"
  npc_override_1@air1_AirshipAssault_bang_babang_bang_9e1d60: "- Bang! Babang! Bang!"
  npc_override_1@air1_AirshipAssault_bastards_die_die_21ec40: "Bastards! Die! Die!"
  npc_override_1@air1_AirshipAssault_beautiful_sorceress_arca_69d8b7: "Beautiful sorceress Arcana's surprise airborne monster show!!"
  npc_override_1@air1_AirshipAssault_better_end_party_now_wha_e71cbc: "It would be better to end this party now... What is this? Did Freyja send you?"
  npc_override_1@air1_AirshipAssault_board_lifeboats_passenge_4198f7: "Board the lifeboats with the passengers being first priority! Release the lifeboats that have completed boarding!"
  npc_override_1@air1_AirshipAssault_boom_0d2fb4: "- Boom!!!"
  npc_override_1@air1_AirshipAssault_bothersome_pests_8fc5c2: "Bothersome pests..."
  npc_override_1@air1_AirshipAssault_cancel_77dfd2: "Cancel"
  npc_override_1@air1_AirshipAssault_cap_captain_serious_d7aac6: "Cap..Captain! This is serious!"
  npc_override_1@air1_AirshipAssault_captain_there_no_need_so_8b15a0: "Captain. There is no need to be so agitated."
  npc_override_1@air1_AirshipAssault_careful_if_you_keep_goin_d09835: "...Careful. If you keep going on like that..."
  npc_override_1@air1_AirshipAssault_chaos_1b0641: "Chaos..."
  npc_override_1@air1_AirshipAssault_chaos_7b045f: "...?? Chaos?"
  npc_override_1@air1_AirshipAssault_click_enter_again_743a0f: "^ff0000click to enter again.^000000"
  npc_override_1@air1_AirshipAssault_could_turn_out_fun_party_2cf862: "This could turn out to be a fun party~"
  npc_override_1@air1_AirshipAssault_could_wyvern_s_breath_57c021: "Could it be... Wyvern's Breath?!!"
  npc_override_1@air1_AirshipAssault_course_7d6b19: "Of course!"
  npc_override_1@air1_AirshipAssault_course_they_got_sense_ou_7acdca: "Of course!! They got a sense of our skill!! Hohoho~"
  npc_override_1@air1_AirshipAssault_creation_failed_2e1f8c: "^0000ff{0}^000000 - Creation failed!"
  npc_override_1@air1_AirshipAssault_damn_912bd3: "Damn..."
  npc_override_1@air1_AirshipAssault_damn_if_only_i_had_1a77e5: "Damn... if only I had my weapon..."
  npc_override_1@air1_AirshipAssault_damn_s_dangerous_here_le_6bd5d9: "Damn it!! It's dangerous here! Let's get out of here first! Iris, hurry!!"
  npc_override_1@air1_AirshipAssault_damn_there_too_many_them_d74cd3: "Damn... There are too many of them! The engine room could get overrun!!"
  npc_override_1@air1_AirshipAssault_damn_they_already_reache_4b367d: "Damn... They have already reached this far! Thanks to you the Rune Engine was defended."
  npc_override_1@air1_AirshipAssault_damn_where_did_i_put_b1d659: "Damn it... Where did I put my weapon..."
  npc_override_1@air1_AirshipAssault_die_villains_huuma_metal_a244a7: "Die villains!! Huuma Metal Shuriken!!"
  npc_override_1@air1_AirshipAssault_different_i_don_t_any_2533ed: "...that is different. I don't have any more information..."
  npc_override_1@air1_AirshipAssault_doing_our_work_us_hm_2b2a28: "Doing our work for us. Hm, I guess this is enough?"
  npc_override_1@air1_AirshipAssault_eeek_17832f: "Eeek!!"
  npc_override_1@air1_AirshipAssault_eek_looks_like_we_ll_4f21c5: "Eek!! Looks like we'll fall!!"
  npc_override_1@air1_AirshipAssault_eek_there_still_more_the_7ed806: "Eek! There are still more of these!!"
  npc_override_1@air1_AirshipAssault_eh_so_s_how_big_9b0408: "Eh... So that's how this big ship floats... but now the feeling of the mystery is gone. I thought there would be some mystical device... a little disappointed..."
  npc_override_1@air1_AirshipAssault_end_b302c2: "...is this the end?"
  npc_override_1@air1_AirshipAssault_enemies_suddenly_appeare_16e6f7: "Enemies have suddenly appeared and are attempting to destroy the Airship."
  npc_override_1@air1_AirshipAssault_enter_you_must_create_jo_6852e2: "^ff0000To enter, you must create or join a party of 1 or more members.^000000"
  npc_override_1@air1_AirshipAssault_entrance_engine_room_sto_a498e3: "This is the entrance to the engine room. Stop them from getting in!"
  npc_override_1@air1_AirshipAssault_even_exploding_ship_incr_de9ebc: "Even the exploding ship is incredible~ Whoa~"
  npc_override_1@air1_AirshipAssault_everybody_get_lifeboats_5ffc60: "Everybody get on the lifeboats!"
  npc_override_1@air1_AirshipAssault_flying_air_through_stren_0de630: "Flying in the air through with the strength of machinery... the development of technology is truly marvelous."
  npc_override_1@air1_AirshipAssault_found_my_weapon_hehehehe_9bbe43: "Found it! My weapon! Hehehehe"
  npc_override_1@air1_AirshipAssault_glad_there_aren_t_any_9676ed: "...Glad there aren't any of those pesky things here..."
  npc_override_1@air1_AirshipAssault_go_bottom_airship_defeat_0a3a25: "Go to the bottom of the Airship and defeat the enemy."
  npc_override_1@air1_AirshipAssault_grab_4c52e0: "...Grab on"
  npc_override_1@air1_AirshipAssault_gre_gremlins_gremlins_la_262790: "Gre...Gremlins!! Gremlins have landed from the Wyvern!!"
  npc_override_1@air1_AirshipAssault_gremlins_all_over_ship_4a3c32: "Gremlins are all over the ship!!"
  npc_override_1@air1_AirshipAssault_gremlins_just_monsters_t_d57f5b: "Gremlins are just monsters that tinker with machines. Rather..."
  npc_override_1@air1_AirshipAssault_guardian_heroines_fd4937: "Guardian Heroines!!"
  npc_override_1@air1_AirshipAssault_hahahaha_you_waited_long_79edcf: "Hahahaha~ You have waited long!!"
  npc_override_1@air1_AirshipAssault_hehehehehehehehe_3cfcf7: "Hehehehehehehehe!"
  npc_override_1@air1_AirshipAssault_hey_don_t_touch_my_2bbc34: "Hey! Don't touch my cards!"
  npc_override_1@air1_AirshipAssault_hey_humans_block_nuisanc_bbb076: "Hey humans!! Block that nuisance while I go to the captain's room to look for my weapon!!"
  npc_override_1@air1_AirshipAssault_hey_no_horsing_around_sh_99c665: "Hey!! No horsing around on the ship!!"
  npc_override_1@air1_AirshipAssault_hey_where_you_going_argh_5df633: "Hey! Where are you going! Argh!!"
  npc_override_1@air1_AirshipAssault_hm_5ea458: "Hm..."
  npc_override_1@air1_AirshipAssault_hm_after_several_days_ob_09528a: "Hm...after several days of observation, this place seems to be a device imprinted with the memories of an airship."
  npc_override_1@air1_AirshipAssault_hm_no_no_everybody_just_ee1809: "Hm, no, no. Everybody is just captivated by our great entrance."
  npc_override_1@air1_AirshipAssault_hm_what_now_c83ca6: "Hm... What is this now?"
  npc_override_1@air1_AirshipAssault_hm_what_s_reaction_every_6a26e8: "Hm? What's with the reaction? Everybody is kind of a lukewarm... Was it too much?"
  npc_override_1@air1_AirshipAssault_hooray_we_flying_through_d2ccef: "Hooray~ we are flying through the sky! For free on top of that!"
  npc_override_1@air1_AirshipAssault_how_dare_mere_lowly_huma_463d34: "How dare a mere lowly human say Freyja's name."
  npc_override_1@air1_AirshipAssault_how_dare_you_interrupt_m_a586ce: "How dare you interrupt my precious meal time! Guard! Where are you!"
  npc_override_1@air1_AirshipAssault_how_we_stop_him_maybe_834d5a: "How can we stop him? ...Maybe he will regain his senses if you beat him just enough to not die... I'm counting on you!!"
  npc_override_1@air1_AirshipAssault_how_you_like_ab5279: "How do you like that!!"
  npc_override_1@air1_AirshipAssault_however_i_share_fate_shi_decc72: "However I will share fate with this ship. This ship and I are one!"
  npc_override_1@air1_AirshipAssault_huh_75a82a: "......huh?"
  npc_override_1@air1_AirshipAssault_huh_868104: "Huh..?!"
  npc_override_1@air1_AirshipAssault_huh_hey_837145: "Huh? Hey!!"
  npc_override_1@air1_AirshipAssault_huh_s_good_question_34d723: "Huh? That's a good question."
  npc_override_1@air1_AirshipAssault_humph_i_don_t_care_fa97c7: "Humph! I don't care if you die or not..."
  npc_override_1@air1_AirshipAssault_humph_s_what_you_get_8a572a: "Humph! That's what you get for being absent-minded!"
  npc_override_1@air1_AirshipAssault_humph_you_don_t_know_431346: "Humph. You don't know what you're talking about!"
  npc_override_1@air1_AirshipAssault_huuma_metal_shuriken_hiy_8e4b42: "Huuma Metal Shuriken!! Hiyah!"
  npc_override_1@air1_AirshipAssault_i_catch_you_i_kill_6ce28f: "I will catch you. I will kill you!!"
  npc_override_1@air1_AirshipAssault_i_defend_place_no_matter_087bf8: "...I will defend this place no matter what. Go down into the airship...!!"
  npc_override_1@air1_AirshipAssault_i_end_my_specially_manuf_9337d8: "I will end this with my specially manufactured Exodus Joker XIII Doom Rifle!"
  npc_override_1@air1_AirshipAssault_i_face_them_here_chaos_481b8e: "I will face them here. Chaos, go down to the lower floor of the airship with Iris!"
  npc_override_1@air1_AirshipAssault_i_feel_larger_wave_evil_e3a778: "I can feel a larger wave of evil."
  npc_override_1@air1_AirshipAssault_i_feel_there_s_power_9b23f4: "But I feel there's a power of some kind... I think this airship won't be able to fly solely just by technology."
  npc_override_1@air1_AirshipAssault_i_just_getting_feel_thes_8fabfb: "I was just getting a feel for this and these monsters show up?! Are you trying to steal my money because I won a little? Huh?!"
  npc_override_1@air1_AirshipAssault_i_show_you_what_happens_2915c1: "I will show you what happens when you attack my ship!"
  npc_override_1@air1_AirshipAssault_if_i_catch_you_next_1dc972: "If I catch you next time I will make sure you die!! Be nervous!! You got it?! Be ready, you yokels!!"
  npc_override_1@air1_AirshipAssault_if_we_keep_stalling_rest_86bb85: "If we keep stalling the rest will be in danger!! It's too bad but we have done all we can!"
  npc_override_1@air1_AirshipAssault_iris_come_here_5a59f2: "Iris!! Come here!!"
  npc_override_1@air1_AirshipAssault_iris_let_s_go_down_682569: "Iris!! Let's go down to the engine room! Loki and Fenrir, hold this place!"
  npc_override_1@air1_AirshipAssault_just_just_minute_8e41b0: "Just.. just a minute..."
  npc_override_1@air1_AirshipAssault_just_look_their_clothes_750662: "Just look at their clothes!!"
  npc_override_1@air1_AirshipAssault_let_me_introduce_447593: "Let me introduce..."
  npc_override_1@air1_AirshipAssault_let_s_leave_these_little_033f7a: "Let's leave these little ones to them. Let's go!"
  npc_override_1@air1_AirshipAssault_let_s_quickly_find_fenri_a4bcbd: "Let's quickly find Fenrir and Loki and get out of here!!"
  npc_override_1@air1_AirshipAssault_little_thing_5a693a: "That little thing...!!!"
  npc_override_1@air1_AirshipAssault_lo_ki_1460a4: "Lo...ki?"
  npc_override_1@air1_AirshipAssault_loki_38e793: "...?! Loki!!"
  npc_override_1@air1_AirshipAssault_marvelous_how_huge_ship_1b43a9: "Is it not marvelous how this huge ship can fly without the use of magic? Chaos?"
  npc_override_1@air1_AirshipAssault_member_party_entered_ins_a03ae5: "{0}, member of the party {1} entered the instance {2}."
  npc_override_1@air1_AirshipAssault_memorial_dungeon_cannot_b007f7: "^ff0000Memorial Dungeon cannot be reentered within 23 hours after your last entrance.^000000"
  npc_override_1@air1_AirshipAssault_memorial_dungeon_only_pe_b0631d: "^ff0000This Memorial Dungeon is only for 1 person. Only the party leader can enter.^000000"
  npc_override_1@air1_AirshipAssault_menu_character_e7418a: "Character name: {0}"
  npc_override_1@air1_AirshipAssault_menu_party_0eb6cf: "Party name: {0}"
  npc_override_1@air1_AirshipAssault_msg_61ce5a: "[{0}]"
  npc_override_1@air1_AirshipAssault_msg_93fcbf: "......"
  npc_override_1@air1_AirshipAssault_msg_abb326: "...!!"
  npc_override_1@air1_AirshipAssault_muhahahaha_ce304b: "Muhahahaha!"
  npc_override_1@air1_AirshipAssault_muhahahaha_dbda8a: "Muhahahaha!!"
  npc_override_1@air1_AirshipAssault_muhahahahaha_4f4c8f: "Muhahahahaha"
  npc_override_1@air1_AirshipAssault_my_new_clothes_ruined_acfe43: "My new clothes are ruined..."
  npc_override_1@air1_AirshipAssault_no_no_ship_0ccef9: "No... no!! The ship!!"
  npc_override_1@air1_AirshipAssault_note_i_leave_you_take_c4d1ff: "On that note I will leave you to take care of the aftermath. I'm off!!"
  npc_override_1@air1_AirshipAssault_note_one_last_huuma_meta_fcbf76: "On that note, one last Huuma Metal Shuriken!!"
  npc_override_1@air1_AirshipAssault_now_let_us_get_started_199a7f: "Now... Let us get started! Gremlins~!!"
  npc_override_1@air1_AirshipAssault_off_your_hands_neck_4aec6c: "Off with your hands and neck!"
  npc_override_1@air1_AirshipAssault_oh_gee_f6ceed: "Oh? Gee!"
  npc_override_1@air1_AirshipAssault_oh_okay_alright_let_s_aa90a9: "Oh...okay! Alright... Let's go!!"
  npc_override_1@air1_AirshipAssault_oh_there_basara_looks_li_73ea24: "Oh? ... There, Basara. Looks like they are retreating."
  npc_override_1@air1_AirshipAssault_oh_you_no_fear_ff3908: "Oh. You have no fear."
  npc_override_1@air1_AirshipAssault_okay_i_show_you_somethin_cf0424: "Okay~ I will show you something good. Something to cool your heads."
  npc_override_1@air1_AirshipAssault_ones_who_denigrate_conde_0562bb: "The ones who denigrate and condemn the path of righteousness... We should mercilessly hand down righteous judgment, right?"
  npc_override_1@air1_AirshipAssault_ooh_you_threw_back_wyver_cde685: "Ooh.. you threw back Wyvern's Breath... an unexpected outcome. But can you withstand this one?"
  npc_override_1@air1_AirshipAssault_oops_i_shooting_like_cra_92c875: "Oops.. I was shooting like crazy. Looks like a lot of the Gremlins are gone? Hehehehe"
  npc_override_1@air1_AirshipAssault_oops_way_captain_how_big_714fa4: "Oops... By the way captain, how does this big airship fly through the sky? It is so marvelous!"
  npc_override_1@air1_AirshipAssault_party_leader_used_device_b1d762: "^ff0000The party leader has not used the device.^000000"
  npc_override_1@air1_AirshipAssault_place_i_t_reach_like_7c8769: "...A place I can't reach like before..."
  npc_override_1@air1_AirshipAssault_pop_pop_pop_987901: "- Pop! Pop pop!"
  npc_override_1@air1_AirshipAssault_power_up_device_3d016c: "Power Up the Device"
  npc_override_1@air1_AirshipAssault_pu_4da9b6: "Pu...."
  npc_override_1@air1_AirshipAssault_puhahahahahahahahaha_cd964f: "Puhahahahahahahahaha"
  npc_override_1@air1_AirshipAssault_remaining_people_preciou_cbe254: "But the remaining people are precious lives as well! You're going to leave them?!! Huh?!!"
  npc_override_1@air1_AirshipAssault_right_right_much_product_4c91f5: "Right, right. This much production for a hero's entrance is a bit too much!!"
  npc_override_1@air1_AirshipAssault_roger_basara_let_s_end_2a7903: "Roger, Basara! Let's end it with a swift attack!!"
  npc_override_1@air1_AirshipAssault_roger_ranger_flying_form_60df83: "Roger!! Ranger Flying form!!"
  npc_override_1@air1_AirshipAssault_rune_engine_what_5693ab: "Rune Engine? What is that?"
  npc_override_1@air1_AirshipAssault_s_device_uses_magical_st_28fb3e: "It's a device that uses a magical stone."
  npc_override_1@air1_AirshipAssault_s_going_explode_go_over_fc49d6: "It's going to explode! Have to go over... I have to go over to that Airship on the other side!!"
  npc_override_1@air1_AirshipAssault_s_party_time_70733c: "It's PARTY TIME~!!"
  npc_override_1@air1_AirshipAssault_s_right_big_ship_t_ae2bd7: "That's right. This big ship can't be in the sky with just steam. So it uses an amplifier called a 'Rune Engine'."
  npc_override_1@air1_AirshipAssault_sage_kadmon_d7efb3: ".....Sage Kadmon.."
  npc_override_1@air1_AirshipAssault_serious_they_heading_tow_9b01ee: "...This is serious! They are heading towards the engine room! We have to protect the Rune Engine!!"
  npc_override_1@air1_AirshipAssault_serves_you_right_let_s_f73694: "Serves you right~!! Let's go!!"
  npc_override_1@air1_AirshipAssault_ship_damaged_because_you_bd30e8: "The ship is damaged because of you!!"
  npc_override_1@air1_AirshipAssault_ship_going_fall_51254d: "Is this ship.. going to fall.."
  npc_override_1@air1_AirshipAssault_shiva_basara_laksmi_51f309: "Shiva! Basara! Laksmi!"
  npc_override_1@air1_AirshipAssault_should_i_cut_them_all_0bfc94: "Should I cut them all down? ...No it is not enough money for me to be involved..."
  npc_override_1@air1_AirshipAssault_snore_zzz_b6e68e: "....Snore...Zzz"
  npc_override_1@air1_AirshipAssault_something_about_fallen_f_933339: "Something about fallen fragments of a broken heart according to the legends... a ridiculous legend but that doesn't matter..."
  npc_override_1@air1_AirshipAssault_something_coming_way_754277: "Something is coming this way..."
  npc_override_1@air1_AirshipAssault_squeak_27c7fc: "Squeak..!!"
  npc_override_1@air1_AirshipAssault_squeak_kooar_40fd55: "Squeak... Kooar~!!"
  npc_override_1@air1_AirshipAssault_stone_so_called_tear_ymi_091875: "The stone is the so-called 'Tear of Ymir.' If put in junction with locomotive engines like steam engines, the rune exuded from the stone amplifies the energy."
  npc_override_1@air1_AirshipAssault_then_s_time_us_slip_0eb66b: "Then it's time for us to slip away..."
  npc_override_1@air1_AirshipAssault_there_s_nothing_we_7e96d6: "There's nothing we can do!"
  npc_override_1@air1_AirshipAssault_these_bastards_just_keep_f307fa: "...These bastards just keep coming."
  npc_override_1@air1_AirshipAssault_they_might_look_menacing_a31484: "They might look menacing but those monsters are also customers to my cafeteria."
  npc_override_1@air1_AirshipAssault_those_stage_costumes_the_e0ff36: "Are those stage costumes? Are they celebrities and not heroes?"
  npc_override_1@air1_AirshipAssault_time_us_facing_these_tri_bf5d55: "It is not the time for us to be facing these trivial Gremlins."
  npc_override_1@air1_AirshipAssault_too_short_t_reach_8a396a: "...too short... Can't reach..."
  npc_override_1@air1_AirshipAssault_ugh_getting_drunk_hiccup_378109: "Ugh... Getting drunk... hiccup"
  npc_override_1@air1_AirshipAssault_uh_oh_there_s_gremlin_17fff5: "Uh...oh!! There's a gremlin heading towards the engine room!!"
  npc_override_1@air1_AirshipAssault_unexpected_ally_e2b2a8: "An unexpected ally?"
  npc_override_1@air1_AirshipAssault_unknown_error_occurred_58bda4: "An unknown error has occurred."
