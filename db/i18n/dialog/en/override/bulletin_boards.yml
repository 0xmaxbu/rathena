Body:
  npc_override_bulletin_boards_bulletin_boards_docks_you_may_take_ship_759134: "At the docks, you may take a ship and travel to ^003399Alberta^000000 or ^660000Byalan Island^000000."
  npc_override_bulletin_boards_bulletin_boards_izlude_prontera_located_64f103: "From Izlude, ^3355FFProntera^000000 is located to the Northwest, and ^006600Payon^000000 is located to the South. Enjoy your travels in the Rune-Midgarts Kingdom."
  npc_override_bulletin_boards_bulletin_boards_main_buildings_here_acco_afaece: "The main buildings here are to accomodate the growth of the Cryptura Academy."
  npc_override_bulletin_boards_bulletin_boards_points_interest_include_021908: "Points of interest include the Swordman Association building which allows adventurers to change their job to Swordman, and the Battle Area that is East of Izlude."
  npc_override_bulletin_boards_bulletin_boards_welcome_izlude_satellite_deeb31: "Welcome to Izlude, the satellite of Prontera. Izlude was built to support Prontera's defense and to accomodate its burgeoning population."
