  npc_override_job_cru_crusader_menu_yes_1b71fa: "Yes, I do.:I'd like to think about it."
  npc_override_job_cru_crusader_minutes_go_forth_78cb69: "4 minutes. Go forth"
  npc_override_job_cru_crusader_mmm_56bb18: "Mmm...?"
  npc_override_job_cru_crusader_mmm_i_t_discern_whether_821b48: "Mmm. I can't discern whether or not you have the heart to become a Crusader. However, if you have the will and put forth the effort, you may have what it takes."
  npc_override_job_cru_crusader_monsters_appear_ca2fe8: "the monsters that appear."
  npc_override_job_cru_crusader_moorenak_others_like_him_08923e: "Moorenak and others like him will test the limits of your capabilities and help you find your path. Return to me after you have completed their tests..."
  npc_override_job_cru_crusader_more_capable_men_20dd7f: "for more capable men and"
  npc_override_job_cru_crusader_msg_320ec7: "10 ^3355FF{0}^000000"
  npc_override_job_cru_crusader_msg_546a7c: "{0}...?"
  npc_override_job_cru_crusader_msg_cbe866: "..............."
  npc_override_job_cru_crusader_my_name_bliant_piyord_i_3d424a: "My name is Bliant Piyord and I too, am preparing for the Holy War. It must've been quite a hassle to come all this way."
  npc_override_job_cru_crusader_my_name_gabriel_valentin_f2d5a6: "My name is Gabriel Valentine. I, too, am preparing for the Holy War. For the time being, I act as guard for this church."
  npc_override_job_cru_crusader_my_test_you_bring_me_09b3b6: "This is my test for you. Bring me the following items and prove your determination to me."
  npc_override_job_cru_crusader_never_forget_holy_war_ap_961af3: "Never forget that the Holy War is approaching. We must be prepare for the inevitable tide of evil that will sweep this world. Now, go forth and fight for the principles of freedom and justice!"
  npc_override_job_cru_crusader_no_matter_what_you_kill_1f12bb: "No matter what you do, do not kill any of the monsters. This time, think carefully before you draw your sword."
  npc_override_job_cru_crusader_nobody_knows_when_holy_w_af8b2e: "Nobody knows when the Holy War will come. We must prepare in advance and cannot afford to slacken"
  npc_override_job_cru_crusader_novice_4a1925: "A Novice...?"
  npc_override_job_cru_crusader_now_76c5ab: "Now..."
  npc_override_job_cru_crusader_now_time_377791: "It is now time"
  npc_override_job_cru_crusader_now_you_fbe363: "Now you are"
  npc_override_job_cru_crusader_odin_s_6a320d: "by Odin's will."
  npc_override_job_cru_crusader_once_again_i_m_going_6a3469: "Once again, I'm going"
  npc_override_job_cru_crusader_one_us_98535f: "one of us!"
  npc_override_job_cru_crusader_only_one_person_take_tes_108c00: "Only one person can take the test at a time. If someone else is already testing, please wait until the testing area is made available once again."
  npc_override_job_cru_crusader_our_training_17bbd7: "our training."
  npc_override_job_cru_crusader_place_b30da5: "to this place?"
