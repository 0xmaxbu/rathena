Body:
  npc_override_job_cru_crusader_about_c7fb90: "about it."
  npc_override_job_cru_crusader_advised_continue_practic_dad022: "Be advised to continue practicing yourself."
  npc_override_job_cru_crusader_after_obtaining_those_it_b15e4f: "After obtaining those items and passing our tests, you too, can become a Crusader."
  npc_override_job_cru_crusader_ah_971301: "Ah..."
  npc_override_job_cru_crusader_ah_well_done_39eaca: "Ah, well done."
  npc_override_job_cru_crusader_ah_you_still_completed_t_e528b7: "Ah, you still have not completed the task I have given to you. Bring me the following items, and prove your will to become a Crusader to me..."
  npc_override_job_cru_crusader_all_other_tests_86531b: "all the other tests."
  npc_override_job_cru_crusader_all_tests_9834aa: "all the tests to"
  npc_override_job_cru_crusader_answer_them_correctly_b99637: "Answer them correctly."
  npc_override_job_cru_crusader_appear_e6817b: "that appear in"
  npc_override_job_cru_crusader_as_happened_one_thousand_15bd4e: "As it happened one thousand years ago, evil forces will one day attack in droves in an attempt to take over the world once again."
  npc_override_job_cru_crusader_as_woman_sword_you_must_f8c6b4: "As a woman of the sword, you must train diligently and constantly. Prepare yourself, for no one knows when the Holy War may be coming."
  npc_override_job_cru_crusader_aspiring_crusader_817a80: "an aspiring Crusader..."
  npc_override_job_cru_crusader_battle_test_please_prepa_d64c3f: "For the battle test, please prepare one ^3355FFHoly water^000000."
  npc_override_job_cru_crusader_become_crusader_e097c4: "become a Crusader."
  npc_override_job_cru_crusader_become_crusader_you_must_842e49: "To become a Crusader, you must train until you are Job Level 40. For more details, please speak with our leader inside."
  npc_override_job_cru_crusader_becoming_crusader_634a4e: "in becoming a Crusader?"
  npc_override_job_cru_crusader_begin_right_away_1d10fe: "begin right away?"
  npc_override_job_cru_crusader_behold_ebc8fc: "Behold...!"
  npc_override_job_cru_crusader_brother_f98f81: "...Brother."
  npc_override_job_cru_crusader_but_2e7fce: "But..."
  npc_override_job_cru_crusader_carelessly_losing_things_b8aa73: "Carelessly losing things is an attitude for mere Swordsmen. If you really want to retake the test, you must respect the Crusader traditions."
  npc_override_job_cru_crusader_chaos_one_day_arise_chal_d8b7b2: "Chaos will one day arise to challenge our principles of peace, justice and order. Until we have eliminated evil and created our ideal world, we must not cease training."
  npc_override_job_cru_crusader_choose_correct_answer_6c5759: "choose the correct answer."
  npc_override_job_cru_crusader_come_3d448e: "that is to come."
  npc_override_job_cru_crusader_come_back_after_taking_f55355: "Come back after taking"
  npc_override_job_cru_crusader_come_back_take_5fce63: "Come back and take"
  npc_override_job_cru_crusader_come_me_once_you_re_d293a9: "and come to me once you're"
  npc_override_job_cru_crusader_coming_along_7a46db: "coming along?"
  npc_override_job_cru_crusader_coming_holy_war_cc19cc: "coming Holy War."
  npc_override_job_cru_crusader_comrade_aea7ab: "...Comrade."
  npc_override_job_cru_crusader_congratulations_04ece6: "Congratulations."
  npc_override_job_cru_crusader_congratulations_completi_b7cadc: "Congratulations on completing all of your tests. You are truly worthy of fighting alongside side us in the Holy War as a Crusader."
  npc_override_job_cru_crusader_crusader_545728: "a Crusader."
  npc_override_job_cru_crusader_crusader_7f1fe0: "a Crusader...?"
  npc_override_job_cru_crusader_cured_cure_skill_61ec97: "cured with the Cure skill?"
  npc_override_job_cru_crusader_defeat_monsters_bb6079: "Defeat the monsters"
  npc_override_job_cru_crusader_develop_your_faith_faith_dc4b95: "Develop your faith. From faith springs strength and discipline. Day after day, train yourself and become a great Crusader."
  npc_override_job_cru_crusader_did_you_prepare_b68bf0: "Did you prepare"
  npc_override_job_cru_crusader_did_you_well_555765: "Did you do well"
  npc_override_job_cru_crusader_don_t_give_me_reason_768afe: "Don't give me a reason to doubt you, and show me your patience. You must endure my test with your patience if you wish to become a Crusader."
  npc_override_job_cru_crusader_don_t_linger_around_plac_3c5c3b: "Don't linger around in a place like this and forge your own path towards discovering your own strengths. The day that we will join hands in battle will come soon."
  npc_override_job_cru_crusader_don_t_stress_you_need_82903a: "Don't stress, you need to know a lot in order to pass this test. In any case, I'll be waiting right here. When you think you're ready, come back, alright?"
  npc_override_job_cru_crusader_each_person_get_minutes_00b327: "Each person will get 4 minutes to complete the test. If you wish to leave in the middle of the test, please disconnect from the game."
  npc_override_job_cru_crusader_easy_as_sounds_3c8f52: "easy as it sounds."
  npc_override_job_cru_crusader_even_these_relatively_pe_701be7: "Even in these relatively peaceful times, our training is ceaseless. We must be ready for the day with the tides of darkness shall rush against mankind..."
  npc_override_job_cru_crusader_fight_holy_war_4b0004: "to fight in the Holy War."
  npc_override_job_cru_crusader_finish_those_other_tests_445424: "Finish those other tests,"
  npc_override_job_cru_crusader_foretold_holy_war_b1a44f: "foretold Holy War"
  npc_override_job_cru_crusader_get_prepares_come_back_h_d627ed: "Get prepares and come back to here."
  npc_override_job_cru_crusader_give_you_questions_8ef3a8: "to give you 10 questions"
  npc_override_job_cru_crusader_go_enter_93a75b: "Go and enter"
  npc_override_job_cru_crusader_go_forth_defeat_all_aea31e: "Go forth and defeat all"
  npc_override_job_cru_crusader_go_prontera_castle_f34fe7: "Go to Prontera Castle"
  npc_override_job_cru_crusader_go_prontera_castle_meet_5182f8: "Go to the Prontera Castle and meet Bliant Piyord."
  npc_override_job_cru_crusader_go_study_some_more_80600f: "Go study some more and"
  npc_override_job_cru_crusader_go_talk_our_6f579d: "Go talk to our"
  npc_override_job_cru_crusader_go_train_yourself_prepar_0516f5: "Go and train yourself in preparation for the holy war that is coming. Victory will be in the hands of those who are most ready to receive it."
  npc_override_job_cru_crusader_good_luck_703764: "Good luck."
  npc_override_job_cru_crusader_good_work_0f1ee8: "Good work~"
  npc_override_job_cru_crusader_he_testing_you_next_65b9ac: "he will be testing you next."
  npc_override_job_cru_crusader_highest_hp_252eea: "has the highest HP?"
  npc_override_job_cru_crusader_hm_you_no_business_place_3f453a: "Hm. You have no business in a place like this. Please leave, and do not interrupt my training."
  npc_override_job_cru_crusader_hmm_9c4d28: "Hmm..."
  npc_override_job_cru_crusader_hmm_seems_like_you_did_7c3dc4: "Hmm, seems like you did well. It shouldn't have been too hard. You no longer have any business"
  npc_override_job_cru_crusader_hmm_you_wish_become_crus_6ab23b: "Hmm. You wish to become a Crusader, but do not wear a Rosary? I have no business with you if you cannot uphold our customs."
  npc_override_job_cru_crusader_hmmm_2ac89c: "Hmmm..."
  npc_override_job_cru_crusader_hmmm_what_pity_7deb31: "Hmmm... What a pity."
  npc_override_job_cru_crusader_holy_water_16aa6b: "1 Holy Water."
  npc_override_job_cru_crusader_holy_water_used_purify_y_4a220f: "1 ^3355FFHoly Water^000000. This will be used to purify you prior to taking the test."
  npc_override_job_cru_crusader_holy_water_you_prepared_1734df: "Holy Water you prepared."
  npc_override_job_cru_crusader_how_goes_019340: "How goes"
  npc_override_job_cru_crusader_how_much_sp_level_heal_fe90fb: "8. How much SP does Level 7 Heal use?"
  npc_override_job_cru_crusader_how_your_training_28bda1: "How is your training"
  npc_override_job_cru_crusader_hurry_now_go_take_next_191a7a: "Hurry now and go take the next test."
  npc_override_job_cru_crusader_i_am_michael_halig_i_fa3bd8: "I am Michael Halig. I am one of but many Crusaders preparing for the Holy War. We continuously train ourselves with sincere faith and endless loyalty."
  npc_override_job_cru_crusader_i_am_preparing_00df88: "I am preparing for the"
  npc_override_job_cru_crusader_i_conducting_your_next_t_a53535: "I will be conducting your next test."
  npc_override_job_cru_crusader_i_don_t_know_what_075f73: "I don't know what type of person you are right now though. But"
  npc_override_job_cru_crusader_i_give_639f1a: "I will give"
  npc_override_job_cru_crusader_i_hope_you_train_yoursel_56f371: "I hope you will train yourself in preparation for the future as well."
  npc_override_job_cru_crusader_i_inform_him_07b5c2: "I will inform him that"
  npc_override_job_cru_crusader_i_inform_him_prepare_nex_dd4614: "I will inform him to prepare the next test."
  npc_override_job_cru_crusader_i_ll_let_you_retake_28c1aa: "I'll let you retake the test as much as you like. But if you continuously fail, there's an inherent problem with your"
  npc_override_job_cru_crusader_i_ll_see_you_later_78ca74: "I'll see you later~"
  npc_override_job_cru_crusader_i_ll_see_you_soon_21479e: "I'll see you soon."
  npc_override_job_cru_crusader_i_must_acknowledge_your_4ae821: "I must acknowledge your efforts and determination. You may now proceed to take the next test."
  npc_override_job_cru_crusader_i_see_you_been_called_360a34: "I see that you have been called to become a Crusader. We are assured of your will, but now we must test your capabilities."
  npc_override_job_cru_crusader_i_shall_53603b: "I shall be"
  npc_override_job_cru_crusader_i_shall_test_you_if_943bac: "I shall test you if you desire. Are you willing to endure these tests in preparation for the Holy War?"
  npc_override_job_cru_crusader_i_shall_test_you_see_943911: "I shall test you to see if you are fit to become a Crusader."
  npc_override_job_cru_crusader_i_test_see_if_you_55b2a4: "I will test to see if you have acquired the knowledge that is necessary to become a Crusader."
  npc_override_job_cru_crusader_i_told_you_just_purify_e39788: "I told you just to purify the candidates."
  npc_override_job_cru_crusader_i_understand_if_you_easi_10fd37: "I can understand if you are easily frustrated, but you must overcome your frustration to pass this test."
  npc_override_job_cru_crusader_i_wait_you_abd4bd: "I will wait for you."
  npc_override_job_cru_crusader_i_wish_improve_sense_ser_7ba2c8: "I wish to improve the sense of serenity in my heart in preparation for the Holy War that is to come. So please, do not disturb me."
  npc_override_job_cru_crusader_if_monster_level_undead_02264e: "2. If the monster is a Level 2 Undead, how much more damage does a Holy attack do compared to Fire?"
  npc_override_job_cru_crusader_if_you_feel_participatin_e7a797: "If you feel that participating in the Holy War is your calling, please come back right away and take the test to become"
  npc_override_job_cru_crusader_if_you_interested_becomi_9e92dc: "If you are interested in becoming a Crusader, you must train first as a Swordman. Come and visit us again when you believe that you have learned enough as a Swordman..."
  npc_override_job_cru_crusader_if_you_like_become_crusa_8e2cb7: "If you would like to become a Crusader, please speak with our leader in the Prontera Central Palace."
  npc_override_job_cru_crusader_if_you_no_business_here_e9d727: "If you have no business here,"
  npc_override_job_cru_crusader_if_you_put_forth_effort_d015a5: "If you put forth the effort, you'll be able to accomplish this task. May Odin protect you on your journeys."
  npc_override_job_cru_crusader_if_you_ready_b1e6aa: "If you are ready for"
  npc_override_job_cru_crusader_if_you_too_man_sword_2f608b: "If you, too, are a man of the sword, constantly train and prepare yourself. No one knows when the Holy War may begin."
  npc_override_job_cru_crusader_if_you_wish_join_us_c87679: "If you wish to join us, you must first learn the Swordsman discipline and train yourself thoroughly..."
  npc_override_job_cru_crusader_if_your_int_including_in_79b94d: "2. If your INT is 30, including INT bonuses from quipment, at level 55, how much HP does Level 5 Heal recover?"
  npc_override_job_cru_crusader_instructed_until_then_62994d: "instructed. Until then,"
  npc_override_job_cru_crusader_job_level_become_b303e6: "Job Level 40 to become"
  npc_override_job_cru_crusader_joining_us_as_842873: "Joining us is not as"
  npc_override_job_cru_crusader_just_focus_467a08: "Just focus..."
  npc_override_job_cru_crusader_just_second_you_rosary_e_525876: "Just a second, you do not have a Rosary equipped. As a Crusader, you must always have a Rosary on your person."
  npc_override_job_cru_crusader_last_test_here_083743: "the last test here."
  npc_override_job_cru_crusader_leader_inside_501f00: "leader inside."
  npc_override_job_cru_crusader_let_me_assure_you_i_85906d: "Let me assure you that I'm no criminal. I'm here merely to train myself. Perhaps as you become stronger, you will understand."
  npc_override_job_cru_crusader_let_me_take_67aadc: "Let me take"
  npc_override_job_cru_crusader_let_s_begin_869d3b: "Let's begin."
  npc_override_job_cru_crusader_let_s_see_4d37ed: "Let's see..."
  npc_override_job_cru_crusader_let_s_try_again_64b4e1: "Let's try again,"
  npc_override_job_cru_crusader_level_divine_protection_e56d03: "3. With Level 7 Divine Protection, by how much is your defense against the Undead increased?"
  npc_override_job_cru_crusader_like_i_mentioned_before_de2d22: "Like I mentioned before, you should go to Prontera Castle and meet with Bliant Piyord to take your next test. Good luck, and become a Crusder soon, alright?"
  npc_override_job_cru_crusader_listen_carefully_57ef81: "Listen carefully, and"
  npc_override_job_cru_crusader_look_your_face_df5219: "a look at your face."
  npc_override_job_cru_crusader_look_your_results_eb8a3a: "look at your results."
  npc_override_job_cru_crusader_may_odin_3f5e68: "May Odin"
  npc_override_job_cru_crusader_may_odin_s_blessings_c4d6e9: "May Odin's blessings"
  npc_override_job_cru_crusader_me_5e20cf: "with me."
  npc_override_job_cru_crusader_me_man_sword_63f69c: "with me, man of the sword?"
  npc_override_job_cru_crusader_me_woman_sword_de45bb: "with me, woman of the sword?"
  npc_override_job_cru_crusader_meet_bliant_piyord_16221e: "and meet Bliant Piyord."
  npc_override_job_cru_crusader_meet_moorenak_miyol_who_ebb583: "Meet with Moorenak Miyol who is training in the underground dungeon of the Prontera Castle. Go, and speak with him first."
  npc_override_job_cru_crusader_meet_you_ffe043: "to meet you."
