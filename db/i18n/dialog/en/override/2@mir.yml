Body:
  npc_override_2@mir_RitualOfBlessing_after_i_left_banquet_hal_87c547: "After I left the Banquet Hall"
  npc_override_2@mir_RitualOfBlessing_all_my_fault_11902a: "...This... Is all... My fault..."
  npc_override_2@mir_RitualOfBlessing_all_seem_well_b4f173: "All seem well."
  npc_override_2@mir_RitualOfBlessing_been_taken_them_cfa08d: "Has it been taken by them?"
  npc_override_2@mir_RitualOfBlessing_crown_passed_down_palace_8c825c: "It is the crown passed down in the palace of Rune-Midgarts."
  npc_override_2@mir_RitualOfBlessing_don_t_get_out_now_1475ae: "Don't get out now."
  npc_override_2@mir_RitualOfBlessing_everyone_all_right_da27bd: "Is everyone all right..."
  npc_override_2@mir_RitualOfBlessing_i_ll_see_you_out_bd8a4d: "I'll see you out there."
  npc_override_2@mir_RitualOfBlessing_i_shall_get_going_brothe_34244e: "...I shall get going. The brothers don't look so good."
  npc_override_2@mir_RitualOfBlessing_i_ve_been_wondering_when_c7c5b5: "I've been wondering when you would arrive."
  npc_override_2@mir_RitualOfBlessing_let_s_get_out_here_20981b: "Let's get out of here now."
  npc_override_2@mir_RitualOfBlessing_let_s_meet_past_memories_fac78e: "Let's meet at the Past Memories of the Royal Family."
  npc_override_2@mir_RitualOfBlessing_mean_3f5c27: "Does it mean..."
  npc_override_2@mir_RitualOfBlessing_means_more_than_ordinary_261b34: "It means more than an ordinary crown."
  npc_override_2@mir_RitualOfBlessing_msg_61ce5a: "[{0}]"
  npc_override_2@mir_RitualOfBlessing_msg_79ef7f: "...."
  npc_override_2@mir_RitualOfBlessing_no_never_mind_ca009b: "....No, never mind."
  npc_override_2@mir_RitualOfBlessing_nothing_good_heard_if_we_18645e: "Nothing good can be heard if we keep them waiting for any longer. Let's get going."
  npc_override_2@mir_RitualOfBlessing_nyhill_you_should_come_u_cd42d4: "Nyhill, you should come with us!"
  npc_override_2@mir_RitualOfBlessing_other_people_get_out_the_627f9a: "Other people will get out on their own!"
  npc_override_2@mir_RitualOfBlessing_people_other_families_al_a0ea29: "The people from other families all have taken their seats."
  npc_override_2@mir_RitualOfBlessing_peter_been_wounded_41ca39: "Peter has been wounded."
  npc_override_2@mir_RitualOfBlessing_peter_critical_condition_c7525b: "Peter is in a critical condition."
  npc_override_2@mir_RitualOfBlessing_phew_let_s_get_out_c36eab: "Phew, let's get out of here."
  npc_override_2@mir_RitualOfBlessing_room_consciousness_close_ef65df: "The Room of Consciousness will be closed for a while!"
  npc_override_2@mir_RitualOfBlessing_sis_let_s_get_out_801840: "Sis, let's get out!"
  npc_override_2@mir_RitualOfBlessing_terra_gloria_7fa120: "Terra Gloria?"
  npc_override_2@mir_RitualOfBlessing_terra_gloria_missing_f903ee: ".... ^4d4dffTerra Gloria^000000 is missing..."
  npc_override_2@mir_RitualOfBlessing_there_much_left_use_find_8e945e: "There is much left for use to find out."
  npc_override_2@mir_RitualOfBlessing_there_seat_left_next_lor_4de9ea: "^4d4dffThere is a seat left next to Lord Richard. It must be the seat reserved for an observer.^000000"
  npc_override_2@mir_RitualOfBlessing_there_seems_no_one_dead_6fb0b1: "...There seems to be no one dead."
  npc_override_2@mir_RitualOfBlessing_way_f0f918: "By the way........."
  npc_override_2@mir_RitualOfBlessing_we_need_move_him_fast_5e800f: "We need to move him fast."
  npc_override_2@mir_RitualOfBlessing_we_shall_leave_place_fir_03ccae: "We shall leave this place first."
  npc_override_2@mir_RitualOfBlessing_we_should_watch_ritual_b_d97975: "We should watch the Ritual of Blessing."
  npc_override_2@mir_RitualOfBlessing_welcome_e52e5e: "Welcome!"
  npc_override_2@mir_RitualOfBlessing_well_first_things_first_c2fa9d: "...Well, first things first, There are things to find out."
  npc_override_2@mir_RitualOfBlessing_well_let_s_go_5b10c6: "Well, let's go."
  npc_override_2@mir_RitualOfBlessing_what_earth_11972d: "What on earth...!"
  npc_override_2@mir_RitualOfBlessing_what_going_541517: "What is going on..."
  npc_override_2@mir_RitualOfBlessing_what_hidden_here_known_a_95784c: "What is hidden here is not known to anyone... Except the seven royal families...!"
  npc_override_2@mir_RitualOfBlessing_whoever_left_here_clear_25b538: "Whoever left here, clear out with the wounded near you!"
  npc_override_2@mir_RitualOfBlessing_you_here_230369: "You are here!"
  npc_override_2@mir_RitualOfBlessing_you_leave_through_door_y_bb7d08: "You can leave through the door you have entered."
  npc_override_2@mir_RitualOfBlessing_you_mind_fighting_agains_234352: "...Would you mind fighting against the intruder for us?"
