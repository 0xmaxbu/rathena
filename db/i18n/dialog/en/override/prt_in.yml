  npc_override_prt_in_illusion_investigation_although_place_full_mons_d23181: "Although this place is full of monsters, I still feel comfortable here."
  npc_override_prt_in_illusion_investigation_anyway_i_m_charge_invest_bba2a7: "Anyway... I'm in charge of investigating this place."
  npc_override_prt_in_illusion_investigation_because_nobody_figured_o_99965d: "Because nobody has figured it out yet"
  npc_override_prt_in_illusion_investigation_because_speed_which_mons_b165f8: "Because the speed at which monster objects recover is very fast, it is a good opportunity for me to check the 'object persistence' required by the Illusion Investigation Team and whether or not they are reincarnated."
  npc_override_prt_in_illusion_investigation_been_officially_announce_203570: "It has been officially announced by Commander Joel that the Illusion is a phenomenon caused by a dimensional rift."
  npc_override_prt_in_illusion_investigation_been_proven_phenomenon_a_417272: "It has been proven that this phenomenon also occurs in illusions, so I decided to join the Illusion Investigation Team."
