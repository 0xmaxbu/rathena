  npc_override_prt_in_prontera_you_doing_here_12e3d9: "you doing here?!"
  npc_override_prt_in_prontera_you_interested_learning_6b531e: "Are you interested in learning more about helping and supporting other people?"
  npc_override_prt_in_prontera_you_know_what_every_skil_258920: "But you know what? Not every skill is mastered at level 10. You can master some skills at only level 5. And even better, some skills are already mastered at level 1 or 2."
  npc_override_prt_in_prontera_you_look_different_now_g_b02db3: "You look different now. *Gasp* You've gotten... ^993333stronger^000000. Wow, that's so coooool!"
  npc_override_prt_in_prontera_you_might_think_me_as_b02784: "You might think of me as a mere delivery guy,"
  npc_override_prt_in_prontera_you_recover_your_own_hp_6c5fcc: "You can recover your own HP with the ^6666CCHeal^000000 skill. Healing is one of the most important ways you can help your friends in battle."
  npc_override_prt_in_prontera_you_tell_these_kinds_mon_5c1198: "You can tell these kinds of monsters apart by their body color. Wilder and more powerful monsters have more dangerous looking colors."
  npc_override_prt_in_prontera_you_use_angelus_increase_74d929: "You can use ^6666CCAngelus^000000 to increase your Defense, as well as the Defense of other party members. Remember though, you can only use ^6666CCAngelus^000000 on other people if they are in your party."
