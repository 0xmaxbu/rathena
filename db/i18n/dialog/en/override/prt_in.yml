  npc_override_prt_in_hair_dyer_oh_no_your_hair_damaged_572c33: "Oh, no! Your hair is damaged. It seems as if you may need professional treatment. Come sit over here, please. Come."
  npc_override_prt_in_hair_dyer_okay_choose_color_you_li_48f0a0: "Okay! Choose the color that you would like."
