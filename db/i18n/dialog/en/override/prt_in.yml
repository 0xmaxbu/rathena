  npc_override_prt_in_illusion_investigation_aigoo_2fb818: "Aigoo..."
  npc_override_prt_in_illusion_investigation_also_i_thought_might_som_592021: "Also... I thought it might have something to do with the dimensional rift."
  npc_override_prt_in_illusion_investigation_also_monsters_illusion_n_fb2135: "Also, the monsters in Illusion are new monsters that have never been discovered before, and the monsters in Illusion are multiplying abnormally."
