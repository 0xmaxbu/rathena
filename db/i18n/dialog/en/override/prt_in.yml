  npc_override_prt_in_prontera_yes_few_days_ago_i_29ec87: "Yes. Few days ago, I have entered a mysterious maze following a group of hunters at the north of Prontera."
  npc_override_prt_in_prontera_yes_yes_course_someday_i_420b2c: "Yes, yes of course! Someday, I'll even be as strong as you! When that day comes, I hope that we can train together!"
