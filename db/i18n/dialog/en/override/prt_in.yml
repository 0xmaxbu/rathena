  npc_override_prt_in_illusion_investigation_come_back_after_day_a5388c: "Come back after a day!!"
  npc_override_prt_in_illusion_investigation_come_back_when_you_re_c20428: "Come back when you're a little hotter."
  npc_override_prt_in_illusion_investigation_content_same_as_last_tim_3ef87e: "The content is the same as last time."
  npc_override_prt_in_illusion_investigation_contents_executed_same_a_433a24: "The contents to be executed are the same as last time."
  npc_override_prt_in_illusion_investigation_core_theory_reincarnatio_a2a766: "This is the core of the theory of reincarnation, and it takes a very long time to observe and investigate it."
  npc_override_prt_in_illusion_investigation_despite_many_adventurers_698384: "Despite many adventurers hunting the monsters that exist in Illusion to obtain materials, the reason for the very rapid recovery of the population has not been identified."
  npc_override_prt_in_illusion_investigation_destroy_monsters_any_typ_0e7c0b: "Destroy 100 monsters of any type in the bleak Archery."
  npc_override_prt_in_illusion_investigation_did_you_hear_investigati_f81c3c: "Did you hear that this is an investigation into how the monster population is maintained? Many adventurers come here to hunt, but it's a bit lacking."
  npc_override_prt_in_illusion_investigation_dispatched_investigator_a703a7: "A dispatched investigator will guide you."
  npc_override_prt_in_illusion_investigation_enough_today_s_investiga_ab47b5: "This is enough for today's investigation."
  npc_override_prt_in_illusion_investigation_even_isn_t_easy_i_e1e6f0: "But even that isn't easy... I've been waiting for an investigator like you to come because I think it's going to be very difficult on my own."
  npc_override_prt_in_illusion_investigation_every_new_discovery_take_b7e389: "Every new discovery takes a lot of time for us to adapt to it"
  npc_override_prt_in_illusion_investigation_go_beat_up_about_them_e55975: "Go and beat up about 100 of them, and come, it doesn't matter what type, blow them up as you see them!!"
