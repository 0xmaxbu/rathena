  npc_override_prt_in_prontera_when_work_give_you_great_03e822: "When it does work, it will give you a great battle advantage. Remember, you will ^6666CCLevel 3 Demon Bane^000000 to acquire this skill."
  npc_override_prt_in_prontera_when_you_go_outside_pron_37688f: "When you go outside of Prontera heading to north east, you will arrive at the peaceful ruins. I have been there a while ago, to deliver something to a priest."
  npc_override_prt_in_prontera_when_you_learn_level_dem_fd6de3: "When you learn ^6666CCLevel 3 Demon Bane^000000, you will be able to learn ^6666CCSignum Crusis^000000, which lowers the Defense of Undead monsters, as well as monsters with the Dark property."
  npc_override_prt_in_prontera_when_you_learn_level_div_61b9f7: "When you learn ^6666CCLevel 3 Divine Protection^000000, you will then be able to learn the ^6666CCDemon Bane^000000 skill."
  npc_override_prt_in_prontera_whether_s_schmoozing_mem_865cff: "Whether it's schmoozing with a member of the opposite sex, or battling monsters, I gotta say, it's all about ^333399skills^000000."
