Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_prt_in_Emperium_Seller_as_part_3ef810: "As part of that,"
  npc_override_prt_in_Emperium_Seller_emperium_distributed_gui_b5e628: "The Emperium to be distributed to the guild office today has arrived. If you want to purchase, please put as many as you want~"
  npc_override_prt_in_Emperium_Seller_menu_from_f94782: "from ^0000ff18:00 to 23:59^000000 from ^0000ffMonday to Saturday^000000."
  npc_override_prt_in_Emperium_Seller_our_guild_office_activel_6c6d10: "Our guild office actively supports the smooth gathering of adventurers."
  npc_override_prt_in_Emperium_Seller_please_note_our_guild_of_02133d: "Please note that our guild office does not sell all the time because we have to run around to supply Emperium outside of the hours."
  npc_override_prt_in_Emperium_Seller_seems_many_people_lookin_d92f96: "It seems that many people are looking for Emperium today. It's just a personal feeling."
  npc_override_prt_in_Slot_Move_Card_Sales_howdy_4d3db0: "Howdy."
  npc_override_prt_in_Slot_Move_Card_Sales_i_sell_limited_quantity_569bd9: "I sell it in a limited quantity every week, so if you don't see anything,"
  npc_override_prt_in_Slot_Move_Card_Sales_means_all_items_sold_out_c5e066: "it means all of the items are sold out, so please come back next time."
  npc_override_prt_in_Slot_Move_Card_Sales_you_change_slot_position_d264b6: "You can ^4d4dffchange the slot position of a character using the card^000000."
  npc_override_prt_in_clans_ah_you_need_time_think_ff5c09: "Ah, do you need time to think about this? No problem."
  npc_override_prt_in_clans_all_clans_accept_all_cla_aa82e3: "All the Clans accept all classes. You can choose the one that suits your needs best."
  npc_override_prt_in_clans_all_no_questions_41552a: "That is all. No questions."
  npc_override_prt_in_clans_all_right_then_i_m_2c1a14: "All right then. I'm just going to go have some fun."
  npc_override_prt_in_clans_arc_wand_clan_mainly_sup_cbb739: "The ^3131FFArc Wand Clan^000000 mainly supports offensive Mage classes."
  npc_override_prt_in_clans_as_i_told_you_earlier_a630a6: "As I told you earlier, Clans cannot join the Siege because they already belong to the Kingdom."
  npc_override_prt_in_clans_because_kingdom_runs_cla_613154: "Because the Kingdom runs the Clan, there is no Siege participation, but at least the members are given ^3131FFstat bonuses^000000."
  npc_override_prt_in_clans_berman_call_me_when_you_e34009: "Berman, call me when you can!~"
  npc_override_prt_in_clans_berman_enough_explanatio_5406ca: "Berman, enough with the explanation. Let's go hang out in Glast Heim."
  npc_override_prt_in_clans_berman_let_s_go_hang_52a2d3: "Berman, let's go hang out in Glast Heim."
  npc_override_prt_in_clans_brother_you_re_scaring_p_b7b849: "Brother, you're scaring a potential member, be nice."
  npc_override_prt_in_clans_case_you_wonder_if_cross_18e865: "In case you wonder if the ^3131FFCrossbow Clan^000000 only recruits Archers, no, it doesn't."
  npc_override_prt_in_clans_clan_masters_exist_reaso_70a136: "Clan masters exist for reason, like I."
  npc_override_prt_in_clans_clans_adventurers_hate_b_8fdc8e: "The Clans are for adventurers that hate being tied down."
  npc_override_prt_in_clans_clans_allowed_participat_eca7dd: "The Clans are not allowed to participate in the Siege; you should join a private guild instead for Siege."
  npc_override_prt_in_clans_clans_established_kingdo_a13ee3: "The ^3131FFClans^000000 are established by the Kingdom to help adventurers connect and share information."
  npc_override_prt_in_clans_clans_established_rune_m_32648b: "The Clans were established by the Rune-Midgarts Kingdom to..."
  npc_override_prt_in_clans_clans_help_lone_adventur_b1c7b0: "The Clans help lone adventurers connect with each other and share information."
  npc_override_prt_in_clans_clans_ran_kingdom_privat_554462: "The ^3131FFClans^000000 are ran by the Kingdom, not privately like others."
  npc_override_prt_in_clans_clans_type_guild_ran_kin_50e747: "The ^3131FFClans^000000 are a type of guild ran by the Kingdom."
  npc_override_prt_in_clans_clansmen_cannot_particip_fc7854: "^3131FFClansmen^000000 cannot participate in the Siege."
  npc_override_prt_in_clans_clansmen_t_participate_s_2f2576: "^3131FFClansmen^000000 can't participate in the Siege."
  npc_override_prt_in_clans_come_back_anytime_golden_b44e72: "Come back anytime to the ^3131FFGolden Mace Clan^000000. I'll be here."
  npc_override_prt_in_clans_come_back_join_after_you_81d400: "Come back to join after you leave your current guild."
  npc_override_prt_in_clans_come_back_work_guys_9ec9b8: "Come on, back to work guys."
  npc_override_prt_in_clans_crossbow_clan_ideal_rang_85c191: "The ^3131FFCrossbow Clan^000000 is ideal for ranged classes."
  npc_override_prt_in_clans_did_you_finish_things_up_aa5a57: "Did you finish things up with your guild?"
  npc_override_prt_in_clans_did_you_sleep_class_gosh_ec3b1c: "Did you sleep in class? Gosh."
  npc_override_prt_in_clans_differences_variety_crea_a000f5: "Differences in variety creates the fun."
  npc_override_prt_in_clans_don_t_feel_pressured_jus_89f6ae: "Don't feel pressured, just count on me!"
  npc_override_prt_in_clans_don_t_mess_me_s_0eca86: "Don't mess with me, it's not cool!"
  npc_override_prt_in_clans_don_t_pick_fights_other_60362d: "Don't pick fights with other clansmen. Be social."
  npc_override_prt_in_clans_eh_oh_you_re_clan_a50180: "Eh? Oh, you're in a Clan."
  npc_override_prt_in_clans_eh_you_re_already_clan_a6bbad: "Eh, you're already in a Clan. Hey, this isn't funny."
  npc_override_prt_in_clans_error_occurred_4e9dbd: "An error has occurred."
  npc_override_prt_in_clans_excited_join_me_hahah_b32a3f: "Excited to join me? Hahah!"
  npc_override_prt_in_clans_get_over_me_devon_don_f07dab: "Get over me, Devon! Don't spread rumors!"
  npc_override_prt_in_clans_golden_mace_clan_mainly_529c92: "The ^3131FFGolden Mace Clan^000000 mainly helps supportive classes."
  npc_override_prt_in_clans_good_let_me_invite_you_a0a3ec: "Good, let me invite you in."
  npc_override_prt_in_clans_good_write_your_name_her_32d1b8: "Good, write your name here."
  npc_override_prt_in_clans_gosh_listen_policy_again_fd8f8d: "Gosh, listen to the policy again."
  npc_override_prt_in_clans_great_91bb26: "Great!"
  npc_override_prt_in_clans_great_sign_your_name_her_48ce73: "Great, sign your name here to register."
  npc_override_prt_in_clans_ha_got_thank_you_captain_2136e3: "A-ha, got it! Thank you, Captain!"
  npc_override_prt_in_clans_hah_hah_i_apologize_thei_dec410: "Hah hah, I apologize for their bickering."
  npc_override_prt_in_clans_haha_stop_you_two_making_f52068: "Haha. Stop it. You two are making a scene."
  npc_override_prt_in_clans_hey_e8e668: "... Hey."
  npc_override_prt_in_clans_hey_shaam_rumi_6659bb: "...Hey, Shaam Rumi."
  npc_override_prt_in_clans_hey_talk_your_guild_mast_c9d84c: "Hey, talk to your guild master if you want to leave."
  npc_override_prt_in_clans_hi_i_m_raffam_master_5559ee: "Hi! I'm Raffam, master of the ^3131FFSword Clan^000000 in the Rune-Midgarts Kingdom."
  npc_override_prt_in_clans_hi_there_i_m_shaam_17458b: "Hi, there! I'm Shaam, master of the ^3131FFCrossbow Clan^000000"
  npc_override_prt_in_clans_hmpf_327fc9: "...Hmpf!"
  npc_override_prt_in_clans_i_hope_you_enjoyed_your_00e515: "I hope you enjoyed your time in the ^3131FFGolden Mace Clan^000000."
  npc_override_prt_in_clans_i_ll_process_your_withdr_c236ec: "I'll process your withdrawal."
  npc_override_prt_in_clans_i_m_also_older_brother_398402: "I'm also the older brother of Devon Aire. Devon looks tough, but he's kind hearted."
  npc_override_prt_in_clans_i_m_devon_master_arc_738cc6: "I'm Devon, master of the ^3131FFArc Wand Clan^000000."
  npc_override_prt_in_clans_i_m_disappointed_s_your_ba058a: "I'm disappointed, but it's your call. Let me process your withdrawal."
  npc_override_prt_in_clans_i_m_sorry_i_t_677925: "I'm sorry, but I can't remove you from another Clan..."
  npc_override_prt_in_clans_i_manage_one_them_f720e9: "And I manage one of them."
  npc_override_prt_in_clans_i_t_let_you_leave_053adb: "I can't let you leave--you're not even in my Clan!"
  npc_override_prt_in_clans_i_understand_s_about_sie_5b06d2: "I understand, it's about Sieges. If not, why are..Never mind.."
  npc_override_prt_in_clans_i_wish_we_could_join_ab73b5: "I wish we could join the Siege. I'd love flying over on my dragon and burning everyone in my way!"
  npc_override_prt_in_clans_if_you_ever_miss_us_42007d: "If you ever miss us, don't hesitate to come back, alright?"
  npc_override_prt_in_clans_if_you_like_siege_then_28d934: "If you like the Siege, then go join a regular guild."
  npc_override_prt_in_clans_if_you_need_help_you_48c126: "If you need help, you can always whisper me, okay? See you around!"
  npc_override_prt_in_clans_if_you_re_tired_travelin_f1a213: "If you're tired of traveling alone, join us! You can join and leave the Clan anytime you want."
  npc_override_prt_in_clans_if_you_want_siege_then_dbb988: "If you want to be in the Siege, then I recommend you join a regular guild."
  npc_override_prt_in_clans_join_free_str_vit_mhp_67966b: "Join for free ^FF0000<STR+1, VIT+1, MHP+30, MSP+10>^000000!"
  npc_override_prt_in_clans_join_if_you_seeking_plac_4ddc49: "Join if you are seeking a place to fit in. We give ^3131FFfree bonus stats^000000. But no Siege participation."
  npc_override_prt_in_clans_join_us_if_no_clan_535f4f: "Join us, if no Clan suits your taste."
  npc_override_prt_in_clans_leave_your_guild_first_j_5c9fc4: "Leave your guild first to join my Clan, duh."
  npc_override_prt_in_clans_let_me_register_you_368487: "Let me register you."
  npc_override_prt_in_clans_let_s_check_clan_policy_0542b2: "Let's check the Clan policy then to begin admission procedures."
  npc_override_prt_in_clans_listen_crossbow_clan_s_m_99fb1f: "Listen, Crossbow Clan's master is evil."
  npc_override_prt_in_clans_meeting_there_parting_5ab607: "With meeting, there is parting."
  npc_override_prt_in_clans_melee_stats_offered_as_n_2dd40d: "Melee stats are offered as the name ^3131FFSword Clan^000000 suggests, but not all members are Melee classes."
  npc_override_prt_in_clans_menu_as_2a1b17: "As our new member, you'll receive the following stat bonuses: ^FF0000<DEX+1, AGI+1, MHP+30, MSP+10>^000000."
  npc_override_prt_in_clans_menu_as_3045b4: "As our new member, you'll receive the following stat bonuses: ^FF0000<INT+1, LUK+1, MHP+30, MSP+10>^000000."
  npc_override_prt_in_clans_menu_clan_a92d12: "Clan Information:Join.:Leave."
  npc_override_prt_in_clans_menu_continue_fdac98: "Continue.:Cancel."
  npc_override_prt_in_clans_menu_eh_448dd5: "Eh, let me check the Clan manual. Ah, and we offer stat bonuses to new members: ^FF0000<DEX+1, AGI+1, MHP+30, MSP+10>^000000."
  npc_override_prt_in_clans_menu_new_0e8b14: "New members are given these stat bonuses: ^FF0000<INT+1, DEX+1, MHP+30, MSP+10>^000000."
  npc_override_prt_in_clans_menu_new_342c92: "New members are given these stat bonuses: ^FF0000<STR+1, VIT+1, MHP+30, MSP+10>^000000."
  npc_override_prt_in_clans_menu_what_155d7a: "What are Clans?:About the Crossbow Clan:Cancel."
  npc_override_prt_in_clans_menu_what_23bdd7: "What are Clans?:About the Arc Wand Clan:Cancel."
  npc_override_prt_in_clans_menu_what_693536: "What are Clans?:About the Sword Clan:Cancel."
  npc_override_prt_in_clans_menu_what_853999: "What are Clans?:About the Golden Mace Clan:Cancel."
  npc_override_prt_in_clans_menu_yes_de2097: "Yes.:No."
  npc_override_prt_in_clans_most_members_offensive_m_99b8cc: "Most members are offensive Mage classes as the name ^3131FFArc Wand Clan^000000 suggests, but that's no requirement."
  npc_override_prt_in_clans_msg_6eae3a: "..."
  npc_override_prt_in_clans_name_just_help_you_easil_4582cf: "The name is just to help you easily choose your Clan."
  npc_override_prt_in_clans_naughty_children_deserve_5cc3e5: "Naughty children deserve a good Jupitel Thunder."
  npc_override_prt_in_clans_new_members_given_free_s_ff925c: "New members are given ^3131FFfree stat bonuses^000000."
  npc_override_prt_in_clans_nice_having_you_0a1e54: "It was nice having you!"
  npc_override_prt_in_clans_nice_meet_you_i_m_23bf5c: "Nice to meet you. I'm Berman Aire, master of the ^3131FFGolden Mace Clan^000000."
  npc_override_prt_in_clans_no_problem_i_hope_you_f97137: "No problem. I hope you'll find a more suitable Clan."
  npc_override_prt_in_clans_now_come_meet_masters_ki_471ff8: "Now, come on in and meet the masters of the Kingdom's best clans!"
  npc_override_prt_in_clans_now_leave_i_don_t_a93862: "Now leave. I don't feel like talking anymore."
  npc_override_prt_in_clans_now_please_write_your_na_054d74: "Now, please write your name here."
  npc_override_prt_in_clans_now_should_i_process_you_9241ea: "Now, should I process your withdrawal?"
  npc_override_prt_in_clans_oh_i_funny_too_fire_036a33: "Oh, I can be funny, too--FIRE PILLAR!"
  npc_override_prt_in_clans_oh_no_1d60d9: "Oh, no."
  npc_override_prt_in_clans_oh_yeah_good_choice_cde902: "Oh, yeah? Good choice!"
  npc_override_prt_in_clans_oh_you_ll_join_good_8e5d83: "Oh, you'll join? Good choice!"
  npc_override_prt_in_clans_okay_s_done_let_s_f4e022: "Okay, it's done. But let's not be strangers, okay?"
  npc_override_prt_in_clans_okay_then_ed8e82: "Okay, then..."
  npc_override_prt_in_clans_ooh_scary_you_re_so_f56cbe: "Ooh, scary! You're so protective of your brother."
  npc_override_prt_in_clans_ooh_you_re_scaring_me_10e5d8: "Ooh, you're scaring me."
  npc_override_prt_in_clans_oops_too_thrilled_bed98d: "Oops, too thrilled!"
  npc_override_prt_in_clans_order_join_you_first_lea_c78d60: "In order to join, you first have to leave your current guild."
  npc_override_prt_in_clans_please_remember_few_prec_b80062: "Please remember the few precautions I gave you, and enjoy your Clan activities!"
  npc_override_prt_in_clans_question_74b74a: "A question?"
  npc_override_prt_in_clans_raffam_why_our_clans_mad_ec422e: "Raffam, why were our ^3131FFclans^000000 made?"
  npc_override_prt_in_clans_ready_withdrawal_09bf9c: "Ready for withdrawal?"
  npc_override_prt_in_clans_remember_no_siege_partic_e4cda5: "Remember, no Siege participation."
  npc_override_prt_in_clans_run_kingdom_itself_clans_0fa039: "Run by the Kingdom itself, the Clans are not allowed to participate in the Siege, but the good news is that the members are given some ^3131FFstat bonuses^000000."
  npc_override_prt_in_clans_s_all_visit_often_expell_d326a0: "That's all. Visit often or be expelled. Dismissed."
  npc_override_prt_in_clans_s_done_e69f0b: "It's done."
  npc_override_prt_in_clans_s_processed_ffe74f: "It's processed."
  npc_override_prt_in_clans_should_cover_everything_0ef1a8: "That should cover everything there is to know."
  npc_override_prt_in_clans_sign_your_name_here_5d78d6: "Sign your name here."
  npc_override_prt_in_clans_so_don_t_bother_me_eaecb0: "So don't bother me later."
  npc_override_prt_in_clans_sorry_i_don_t_meddle_695d8e: "Sorry, but I don't meddle with other Clans' business."
  npc_override_prt_in_clans_stat_bonuses_small_very_62062d: "The stat bonuses are small, but can be very useful for beginning adventurers."
  npc_override_prt_in_clans_stop_hitting_my_brother_ff6d0f: "Stop hitting on my brother and get to work."
  npc_override_prt_in_clans_sword_clan_mainly_suppor_48ac82: "The ^3131FFSword Clan^000000 mainly supports Melee adventurers."
  npc_override_prt_in_clans_t_find_perfect_guild_you_35c511: "Can't find the perfect guild for yourself?"
  npc_override_prt_in_clans_then_i_don_t_want_f15404: "Then I don't want you."
  npc_override_prt_in_clans_these_odd_bunches_never_a2e48f: "These odd bunches never bore me in the party."
  npc_override_prt_in_clans_they_don_t_participate_s_4fda2f: "They don't participate in the Siege, so members are free to join/leave anytime."
  npc_override_prt_in_clans_ugh_your_penmanship_need_6ca0bf: "Ugh, your penmanship needs work. Let me process your application."
  npc_override_prt_in_clans_uh_oh_let_s_go_4b5059: "Uh, oh. Let's go back to the beginning."
  npc_override_prt_in_clans_understood_70be59: "Understood?"
  npc_override_prt_in_clans_wait_you_re_us_grr_e1a8f2: "Wait, you're not with us! Grr, don't make me breathe fire at you!"
  npc_override_prt_in_clans_want_leave_huh_21cbeb: "Want to leave, huh?"
  npc_override_prt_in_clans_we_offer_int_dex_mhp_26c284: "We offer ^FF0000<INT+1, DEX+1, MHP+30, MSP+10>^000000 to new members. Don't ask for more; it's the Kingdom's rule."
  npc_override_prt_in_clans_we_offer_int_luk_mhp_92ff5f: "We offer ^FF0000<INT+1, LUK+1, MHP+30, MSP+10>^000000 to new members."
  npc_override_prt_in_clans_we_re_named_golden_mace_54a53d: "We're named the ^3131FFGolden Mace Clan^000000, but we don't discriminate against applicants based on their classes."
  npc_override_prt_in_clans_welcome_crossbow_clan_750a97: "Welcome to the ^3131FFCrossbow Clan^000000!"
  npc_override_prt_in_clans_welcome_golden_mace_clan_2988ca: "Welcome to the ^3131FFGolden Mace Clan^000000!"
  npc_override_prt_in_clans_welcome_sword_clan_41b0a5: "Welcome to the ^3131FFSword Clan^000000!"
  npc_override_prt_in_clans_what_i_you_3d61cf: "What can I do for you?"
  npc_override_prt_in_clans_what_s_look_you_got_c1babc: "What's with that look? You got a problem?"
  npc_override_prt_in_clans_whatever_b567aa: "Whatever!"
  npc_override_prt_in_clans_who_knows_you_might_meet_8d4cd7: "And who knows you might meet your soul mate in the Clan? Hahah!"
  npc_override_prt_in_clans_why_did_you_find_better_410e1c: "Why, did you find a better Clan?"
  npc_override_prt_in_clans_you_agree_1e179b: "Do you agree?"
  npc_override_prt_in_clans_you_agree_maintain_good_7139ee: "Do you agree to maintain good standing in the Clan?"
  npc_override_prt_in_clans_you_c09be9: "You..."
  npc_override_prt_in_clans_you_heard_too_right_800f09: "You heard that too, right?"
  npc_override_prt_in_clans_you_join_leave_clan_anyt_e8e55a: "You can join and leave a Clan anytime, but if you don't login for ^FF0000more than 2 weeks^000000, you'll be ^FF0000expelled^000000."
  npc_override_prt_in_clans_you_join_leave_clans_fre_f03d96: "You can join or leave clans freely! Just join!"
  npc_override_prt_in_clans_you_joined_arc_wand_clan_cfea5b: "You have joined the ^3131FFArc Wand Clan^000000."
  npc_override_prt_in_clans_you_me_so_far_c754ac: "You with me so far?"
  npc_override_prt_in_clans_you_promise_you_ll_maint_8cfa95: "Do you promise you'll maintain good standing?"
  npc_override_prt_in_clans_you_question_c2988d: "Do you have a question?"
  npc_override_prt_in_clans_you_re_already_clan_c8fd9b: "You're already in a Clan."
  npc_override_prt_in_clans_you_re_already_clan_you_9f7f19: "You're already in a Clan. You joking?!"
  npc_override_prt_in_clans_you_re_barking_up_wrong_902742: "You're barking up the wrong tree. Go to your Clan master."
  npc_override_prt_in_clans_you_re_just_confused_rig_1bf81a: "You're just confused, right?"
  npc_override_prt_in_clans_you_review_clan_info_ctr_390813: "You can review Clan info with ^3131FFCtrl+G^000000."
  npc_override_prt_in_clans_you_should_contact_other_3e27d1: "You should contact other guilds for Siege."
  npc_override_prt_in_clans_you_t_leave_clan_without_e22654: "You can't leave the Clan without joining it first."
  npc_override_prt_in_clans_you_understand_what_clan_6d8160: "Do you understand what the Clans are about now?"
  npc_override_prt_in_clans_you_want_build_connectio_52008f: "Do you want to build connections without being in a guild?"
  npc_override_prt_in_clans_you_want_leave_7b4564: "You want to leave?"
  npc_override_prt_in_clans_you_withdrawn_clan_b1d8ad: "You are withdrawn from the Clan."
  npc_override_prt_in_clans_your_service_d80c6f: "At your service!"
  npc_override_prt_in_clothes_dyer_although_process_very_te_501736: "Although the process is very tedious and time consuming, the joy and happiness I feel when a dress is finished more than makes up for all of the hard work!!"
