  npc_override_prt_in_illusion_investigation_i_don_t_like_feeling_879f8e: "I don't like the feeling of being crowded, so it was hard to bear... I guess meeting a lot of people was stressful for my personality."
  npc_override_prt_in_illusion_investigation_i_don_t_like_get_71a95c: "I don't like to get involved with people. Before I joined the investigation team, I ran a shop in Prontera..."
  npc_override_prt_in_illusion_investigation_i_feel_you_much_more_2b0d2f: "I feel that you have much more power than me."
  npc_override_prt_in_illusion_investigation_i_finish_rest_work_soon_b2959d: "I will finish the rest of the work soon and report it to the investigation team. Thank you for your hard work."
  npc_override_prt_in_illusion_investigation_i_guessing_some_extent_i_99e64d: "I was guessing to some extent that the illusions appearing everywhere had something to do with the power of the dimensional rift."
  npc_override_prt_in_illusion_investigation_i_heard_one_investigator_925f50: "I heard that one of the investigators is coming to help... is that you?"
  npc_override_prt_in_illusion_investigation_i_hope_everyone_who_work_3c7e71: "I hope that everyone who is working hard at this time will return safely without any incident."
  npc_override_prt_in_illusion_investigation_i_joined_illusion_invest_5b0b62: "I joined the Illusion Investigation Team because I wanted to see it with my own eyes, and now I am here."
