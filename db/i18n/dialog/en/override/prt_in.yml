  npc_override_prt_in_illusion_investigation_enough_today_s_investiga_ab47b5: "This is enough for today's investigation."
  npc_override_prt_in_illusion_investigation_even_isn_t_easy_i_e1e6f0: "But even that isn't easy... I've been waiting for an investigator like you to come because I think it's going to be very difficult on my own."
  npc_override_prt_in_illusion_investigation_every_new_discovery_take_b7e389: "Every new discovery takes a lot of time for us to adapt to it"
  npc_override_prt_in_illusion_investigation_go_beat_up_about_them_e55975: "Go and beat up about 100 of them, and come, it doesn't matter what type, blow them up as you see them!!"
