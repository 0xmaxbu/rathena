  npc_override_prt_in_prontera_aahhhh_i_wish_i_could_0c012b: "Aahhhh~ I wish I could wear such a dress. Even if it's just once..."
  npc_override_prt_in_prontera_acolytes_priests_trained_b08f3a: "The Acolytes and Priests trained in this church can heal people, cure them of certain conditions, and even awaken the battle potential of other adventurers."
  npc_override_prt_in_prontera_after_all_if_you_spend_385e63: "After all, if you spend too many skill points on one skill, you might not be able to learn another. That's right, there's a limit to the number of total skill points you can earn."
  npc_override_prt_in_prontera_after_all_only_time_i_6e0cec: "After all, the only time I see him is when he's conducting weddings. Even if a wedding isn't going on, he's still kind of loitering around the Prontera church!"
  npc_override_prt_in_prontera_ah_5eceea: "Ah...!"
  npc_override_prt_in_prontera_ah_i_just_recall_being_ce0ff7: "Ah, I just recall being inside the maze and the spooky forest!"
  npc_override_prt_in_prontera_ahh_ded1c5: "Ahh..."
  npc_override_prt_in_prontera_alright_i_ve_19347b: "Alright, I've"
  npc_override_prt_in_prontera_also_if_you_keep_learnin_8171e7: "Also, if you keep learning Angelus, you'll eventually be able to learn ^6666CCKyrie Eleison^000000. That skill helps you evade initial attacks automatically."
  npc_override_prt_in_prontera_also_reason_why_i_keep_38fe9d: "That is also a reason why I keep my job."
  npc_override_prt_in_prontera_although_many_monsters_m_2db75c: "Although many monsters may look the same, be careful! There are variations among monsters that have the same basic form."
  npc_override_prt_in_prontera_anyways_how_i_explored_s_08b2a3: "Anyways, that is how I have explored some strange places like monster lairs..."
  npc_override_prt_in_prontera_as_creatures_organized_d_6acad3: "as creatures are organized by the dungeon in which they reside."
  npc_override_prt_in_prontera_as_you_see_numbers_monst_ab0b92: "As you see, the numbers of the monsters outside of town has been greatly increased and they have caused trouble to my suppliers to deliver the goods at a right time."
  npc_override_prt_in_prontera_awesome_knight_c2e2f5: "an awesome Knight!"
  npc_override_prt_in_prontera_awesomest_knight_around_28253d: "awesomest Knight around!"
  npc_override_prt_in_prontera_basic_ingredients_my_cru_c53ebf: "The basic ingredients of my Crunch Crunch Sour are the ants roaming inside the Ant Hell in the desert."
  npc_override_prt_in_prontera_before_fabres_become_cre_80d178: "But before Fabres can become Creamys, they go into a pupa stage. When that happens, they turn into these dark purple cocoons we call Pupa. Simple, huh?"
  npc_override_prt_in_prontera_before_you_learn_angelus_4e36b3: "Before you can learn Angelus, you will need to have ^6666CCLevel 3 Divine Protection^000000."
  npc_override_prt_in_prontera_before_you_learn_blessin_50b78b: "Before you can learn Blessing, you must first learn ^6666CCLevel 5 Divine Protection^000000."
  npc_override_prt_in_prontera_behold_d86b02: "Behold..."
  npc_override_prt_in_prontera_better_better_my_busines_bcc4e3: "better and better my business has become nowadays. But..."
  npc_override_prt_in_prontera_blessing_temporarily_inc_6d9230: "^6666CCBlessing^000000 temporarily increases STR, DEX and INT. This skill will give you and your friends a great advantage in battle!"
  npc_override_prt_in_prontera_but_2e7fce: "But..."
  npc_override_prt_in_prontera_close_enough_427401: "close enough,"
  npc_override_prt_in_prontera_come_back_any_time_54225f: "Come back any time~"
  npc_override_prt_in_prontera_considering_i_personally_a42ec3: "Considering this, I personally think my job is very helpful and rather fancy. This in itself makes it all worthwhile. Coarse fabric and rough leather burst with energy and life when colored..."
  npc_override_prt_in_prontera_demand_exceeded_supply_t_19080e: "But the demand has exceeded the supply in these days."
  npc_override_prt_in_prontera_demon_bane_damage_your_a_b009d9: "With ^6666CCDemon Bane^000000, the damage of your attacks against the Undead will be increased. Permanently."
  npc_override_prt_in_prontera_demon_bane_increases_dam_d5f711: "^6666CCDemon Bane^000000 increases the damage you will inflict upon the Undead. Permanently."
  npc_override_prt_in_prontera_did_you_any_questions_ab_67b8bd: "Did you have any questions about Acolyte and Priest skills?"
  npc_override_prt_in_prontera_did_you_know_592d1a: "Did you know?"
  npc_override_prt_in_prontera_don_t_you_know_there_f41e8d: "Don't you know there's a Demon living in this forest?! I can't guarantee your safety"
  npc_override_prt_in_prontera_eh_why_talk_me_first_181296: "Eh~? Why talk to me in the first place? What a strange person."
  npc_override_prt_in_prontera_err_haven_t_you_still_46a8f4: "Err? Haven't you still toured the outside of Prontera?"
  npc_override_prt_in_prontera_even_city_al_de_baran_269f05: "Even the city of Al de Baran is a splendid vision to the eyes, with its elegant architecture and romantic canal."
  npc_override_prt_in_prontera_even_though_our_powers_u_011dc0: "Even though our powers are usually used to heal others, you can actually use the ^6666CCHeal^000000 skill to hurt Undead monsters."
  npc_override_prt_in_prontera_feel_free_take_your_time_c092ba: "Feel free to take your time and relax here. I apologize that I have nothing to serve you, though."
  npc_override_prt_in_prontera_fight_96707d: "Fight...!"
  npc_override_prt_in_prontera_fight_fight_b6114f: "Fight! Fight!"
  npc_override_prt_in_prontera_fight_fight_fight_281957: "Fight Fight FIGHT!"
  npc_override_prt_in_prontera_fine_i_m_gonna_keep_6e854a: "Fine! But I'm gonna keep on training, and we'll see who gets the last laugh!"
  npc_override_prt_in_prontera_first_i_gotta_swordie_if_3b2e77: "First, I gotta be a Swordie. But if I keep practicing, I can become an awesome Swordie. And then after that..."
  npc_override_prt_in_prontera_first_you_ll_need_learn_539e18: "First, you'll need to learn ^6666CCLevel 3 Divine Protection^000000 to be able to learn Demon Bane, so keep that in mind."
  npc_override_prt_in_prontera_first_you_must_learn_ruw_fe5d94: "First, you must learn the ^6666CCRuwach^000000 skill in order to learn how to Teleport."
  npc_override_prt_in_prontera_first_you_need_learn_ruw_cd4536: "First, you need to learn ^6666CCRuwach^000000 which lets you see invisible monsters. After Ruwach, you will need to learn the ^6666CCTeleport^000000 skill."
  npc_override_prt_in_prontera_forewarned_forest_place_be4953: "Be forewarned that the forest is not a place to go on a picnic. If you drop something on the ground, the monkeys come out from nowhere and take away all of your possessions."
  npc_override_prt_in_prontera_get_such_dazzling_colors_47c383: "To get such dazzling colors, I heard you have to use a dye that you can only get in Morocc. But I also heard that the price is beyond imagination."
  npc_override_prt_in_prontera_go_ahead_ask_if_you_1b1a51: "Go and ahead and ask if you have any questions about skills for Acolytes and Priests."
  npc_override_prt_in_prontera_god_war_1a6d81: "God of war!"
  npc_override_prt_in_prontera_god_wisdom_696d94: "God of wisdom!"
  npc_override_prt_in_prontera_h_hey_52c131: "H-hey!"
  npc_override_prt_in_prontera_hahaha_seems_you_re_pret_4f139f: "Hahaha, it seems you're pretty confident of your strength, huh? Hmm... Why don't you go join a guild? I mean, all the tough guys are going it."
  npc_override_prt_in_prontera_hard_believe_he_s_such_e586f0: "It can be hard to believe he's such a brilliant and capable leader."
  npc_override_prt_in_prontera_headquarters_kafra_corpo_27eb41: "The headquarters of Kafra Corporation is also located in Al de Baran. You should really stop by and check it out for yourself."
  npc_override_prt_in_prontera_heard_enough_3b04ee: "heard enough."
  npc_override_prt_in_prontera_heh_heh_i_sure_strife_92e1a4: "Heh heh! I will for sure! 'Strife, the courageous Knight.' It sounds cool, doesn't it?"
  npc_override_prt_in_prontera_hello_there_5a8ec9: "Hello there~"
  npc_override_prt_in_prontera_here_eastern_branch_pron_cc91ea: "Here in the Eastern branch of the Prontera Library, we provide Monster Encyclopedias in which creatures are organized by their properties. We also have books on Merchant and Blacksmith skills."
  npc_override_prt_in_prontera_here_rune_midgarts_we_se_d9f746: "Here, in Rune-Midgarts, we serve Odin, the fearsome god who sacrificed one of his eyes in order to acquire wisdom."
  npc_override_prt_in_prontera_here_western_branch_pron_91c24c: "Here, in the Western branch of the Prontera Library, "
  npc_override_prt_in_prontera_hey_come_over_let_s_54204b: "Hey, come on over and let's drink! I have lots of interesting stories to tell!"
  npc_override_prt_in_prontera_hey_f5f220: "Hey...!"
  npc_override_prt_in_prontera_hey_if_you_wanna_become_1721b7: "Hey, if you wanna become a Swordie, you gotta go to Izlude. There, you can go ahead and take the Swordman job test. The first time, I, um, failed miserably. But I won't fail again!"
  npc_override_prt_in_prontera_however_s_very_difficult_692ff7: "However, it's a very difficult skill to use, and it has a relatively low success rate. But, do not despair if this skill is not successful all the time."
  npc_override_prt_in_prontera_i_almost_died_some_those_a68e84: "I almost died! Some of those monsters just kept following me and trying to kill me, even though I did nothing to them! It was pretty crazy."
  npc_override_prt_in_prontera_i_am_very_proud_my_d2067b: "But I am very proud of my job. You know how tough the world has become?"
  npc_override_prt_in_prontera_i_believe_us_humans_clot_48b317: "I believe for us humans, clothes are one of the few ways to show our personality, style, and beauty."
  npc_override_prt_in_prontera_i_bet_first_time_you_d83592: "I bet the first time you saw this statue, you thought, '^3355FFOh, what a nice muscle man on a horse^000000.'"
  npc_override_prt_in_prontera_i_cannot_make_my_ultra_d1553b: "I cannot make my ultra nice menus with common ingredients because they are super special!"
  npc_override_prt_in_prontera_i_don_t_enough_time_2b6d17: "I don't have enough time to dye your clothes right now. I have so many orders that are still waiting to be done."
  npc_override_prt_in_prontera_i_don_t_even_know_33aa58: "I don't even know if you don't like taking orders, but if that's the case, why don't you make your own guild?"
  npc_override_prt_in_prontera_i_don_t_really_any_036a07: "I don't really have any advice for skills when it comes to talking to a cute guy, but I can let you in on what I know about skills that help in battle."
  npc_override_prt_in_prontera_i_dunno_if_you_ll_3cc1da: "I dunno if you'll believe me, but I saw the weirdest thing down in the ^000077Culvert Sewers^000000..."
  npc_override_prt_in_prontera_i_guess_means_37f52d: "I guess that means"
  npc_override_prt_in_prontera_i_guess_you_get_away_2298a7: "I guess you can get away with a lot of things when you happen to be lord and ruler of an entire nation."
  npc_override_prt_in_prontera_i_had_pass_forest_way_d3a9a4: "I had to pass a forest on the way to the ruins, and the forest was filled with monkeys and raccoons."
  npc_override_prt_in_prontera_i_know_i_know_a62142: "I know, I know..."
  npc_override_prt_in_prontera_i_know_lots_things_about_2b91be: "I know lots of things about Prontera. I have seen many fine views and I also have explored some monster lairs around this city."
  npc_override_prt_in_prontera_i_ll_most_c96c2a: "I'll be the most"
  npc_override_prt_in_prontera_i_m_gonna_such_885e1c: "I'm gonna be such"
  npc_override_prt_in_prontera_i_m_so_jealous_e4cfb6: "I'm so jealous!"
  npc_override_prt_in_prontera_i_m_so_sorry_69d63b: "But... I'm so sorry."
  npc_override_prt_in_prontera_i_m_sorry_inconvenience_2ba520: "I'm sorry for the inconvenience, but could you come back again next time?"
  npc_override_prt_in_prontera_i_made_up_my_mind_82e4dc: "But I made up my mind that I would successfully explore the maze one day."
  npc_override_prt_in_prontera_i_may_appear_drunken_man_227508: "I may appear to be a drunken man but I am more than meets the eye."
  npc_override_prt_in_prontera_i_mean_statue_totally_di_e932f4: "I mean, this statue is totally different from our image of Odin. I guess the sculptor took too many artistic liberties."
  npc_override_prt_in_prontera_i_must_say_most_useful_d5fde8: "I must say, this is a most useful reference for you adventurers. When dealing with beasts, it's good to be informed and understand what you're up against."
  npc_override_prt_in_prontera_i_saw_9266fb: "I saw it was"
  npc_override_prt_in_prontera_i_t_help_you_much_6fccaa: "I can't help you much when it comes to the subject of talking to attractive women such as myself, but I can tell you a little more about skills that help in battle."
  npc_override_prt_in_prontera_i_t_keep_my_business_f63e68: "I can't keep my business busy without my special menu 'Crunch Crunch Sour' and 'Savory Yum Yum'...*Sigh*"
  npc_override_prt_in_prontera_i_ve_been_training_rd_7a1c3d: "I've been training in the 3rd level for so long that there isn't anything that I don't know about in that area. But when I finally went to the 4th level..."
  npc_override_prt_in_prontera_i_ve_never_seen_thief_abcbe8: "I've never seen a Thief Bug shining with light before! Man, just when you think you've seen it all..."
  npc_override_prt_in_prontera_i_wonder_if_you_interest_cb91c5: "I wonder if you are interested in parties or dresses. Hehehe. These days, the hot topic is definitely the colorful, extravagant, magnificent dresses you can wear."
  npc_override_prt_in_prontera_if_you_go_1bc91b: "if you go in!"
  npc_override_prt_in_prontera_if_you_like_peruse_monst_7d4dee: "If you would like to peruse monster records organized by their properties, please visit the Eastern branch of our library."
  npc_override_prt_in_prontera_if_you_master_warp_porta_6b4b01: "If you master the Warp Portal skill, you can have a maximum of 4 different Warp Points. But at least one Warp Point is designated as the Save Point that you've made with a Kafra Employee."
  npc_override_prt_in_prontera_if_you_re_acolyte_wants_ac4768: "If you're an Acolyte that wants to learn ^6666CCIncrease AGI^000000, you need to learn ^6666CCLevel 3 Heal^000000 first."
  npc_override_prt_in_prontera_if_you_want_permanently_3a9638: "If you want to permanently improve your Defense against the Undead, learn ^6666CCDivine Protection^000000."
  npc_override_prt_in_prontera_if_you_wish_understand_m_378159: "If you wish to understand more about an Acolyte or Priest skill, you are welcome to visit me at any time."
  npc_override_prt_in_prontera_just_remember_hold_down_dd380e: "Just remember to hold down the ^6666CCShift^000000 key when you use Cure or Heal on Undead monsters. Just be sure to hurt the monsters though, and don't use it to help monsters."
  npc_override_prt_in_prontera_just_so_you_know_you_6f67a9: "Just so you know, you can't save a Warp Point inside of a dungeon. Oh, and don't forget, each time you make a Warp Portal, you must use 1 ^6666CCBlue Gemstone^000000 as a Catalyst."
  npc_override_prt_in_prontera_kind_benevolent_bb6be5: "by kind and benevolent"
  npc_override_prt_in_prontera_king_tristram_iii_80f475: "King Tristram III."
  npc_override_prt_in_prontera_kingdom_79fbde: "The kingdom of"
  npc_override_prt_in_prontera_large_group_giant_hornet_e113a6: "It was a large group of Giant Hornets! What was even weirder was that they were all controlled by this one Queen Bee, following her every command."
  npc_override_prt_in_prontera_larva_creamy_fabre_so_th_aa9128: "The larva of Creamy is Fabre. So, those green little wormy things are actually the babies of those pinkish, purply butterfly things you see around."
  npc_override_prt_in_prontera_later_if_you_ve_learned_43b6e4: "Later, if you've learned ^6666CCHeal^000000 as an Acolyte, you can learn ^6666CCSanctuary^000000 if you become a Priest."
  npc_override_prt_in_prontera_learning_divine_protecti_3f8197: "Learning Divine Protection to certain levels will also allow you to learn other skills, like ^6666CCAngelus^000000 and ^6666CCBlessing^000000, which Garnet can explain."
  npc_override_prt_in_prontera_life_may_gotten_little_b_85c129: "Life may have gotten a little better, but receiving all these orders? *Whew!* Young ladies these days must be very well off, so my services may no longer be a luxury."
  npc_override_prt_in_prontera_magnum_break_0cc51d: "MAGNUM BREAK!"
  npc_override_prt_in_prontera_man_oh_man_68f4d6: "Man oh man..."
  npc_override_prt_in_prontera_maze_found_inside_forest_207dd1: "The maze can be found inside a forest at the north of Prontera. Go check the north west side of the forest."
  npc_override_prt_in_prontera_menu_about_60e6c6: "About Divine Protection:About Demon Bane:About Decrease AGI:About Signum Crusis :About Pneuma:About Ruwach:About Teleport:End conversation."
  npc_override_prt_in_prontera_menu_about_c90e6e: "About Heal:About Cure:About Increase AGI:About Angelus:About Blessing:About Warp Portal:End Conversation"
  npc_override_prt_in_prontera_menu_crunch_4365ed: "'Crunch Crunch Sour'?:'Savory Yum Yum'?:Cancel."
  npc_override_prt_in_prontera_menu_do_3c5f78: "Do your best.:Quit it, kid."
  npc_override_prt_in_prontera_menu_how_37cda3: "How could you enter monster lairs?:Cancel"
  npc_override_prt_in_prontera_menu_how_4cbf30: "How can I get there?:Cancel"
  npc_override_prt_in_prontera_menu_i_e0c99f: "I wanna be strong too!:Um... Do your best."
  npc_override_prt_in_prontera_menu_talk_13e12a: "Talk:Dye Clothing:Cancel"
  npc_override_prt_in_prontera_menu_talk_a09878: "Talk:Cancel"
  npc_override_prt_in_prontera_menu_the_abec13: "The Maze?:The Spooky Forest?:Cancel"
  npc_override_prt_in_prontera_mighty_odin_6920a8: "Mighty Odin!"
  npc_override_prt_in_prontera_mmm_good_i_think_i_0760ec: "Mmm, good. I think I'll be able to finish before tonight's party."
  npc_override_prt_in_prontera_most_skills_maximum_leve_3ecb16: "For most skills, the maximum level is level 10. It's easy to stress yourself out, since it takes so many points to completely master a skill. What skills should you choose?!"
  npc_override_prt_in_prontera_msg_2e2536: "12..."
  npc_override_prt_in_prontera_msg_61ce5a: "[{0}]"
  npc_override_prt_in_prontera_msg_a51ad7: "11..."
  npc_override_prt_in_prontera_no_matter_how_hard_work_e6bde4: "No matter how hard a work is, I am not afraid of doing that."
  npc_override_prt_in_prontera_nothing_escape_eyes_holy_123313: "Nothing can escape the eyes of the Holy! ^6666CCRuwach^000000 allows you to see monsters, as well as other adventurers, that are hidden or invisible."
  npc_override_prt_in_prontera_now_i_gotta_baaeb8: "that now, I gotta"
  npc_override_prt_in_prontera_now_increase_agi_skill_u_45e2d0: "Now, the ^6666CCIncrease AGI^000000 skill can be used on you or your friends. For a while your AGI stat is increased, making you attack faster and dodge monster attacks more easily."
  npc_override_prt_in_prontera_oh_careful_your_way_ruin_12ad8b: "Oh, be careful on your way to the ruins because there are some weird plant things that assault passersby for no reason."
  npc_override_prt_in_prontera_oh_i_didn_t_realize_8c950d: "Oh! I didn't realize I had a guest. How may I help you?"
  npc_override_prt_in_prontera_once_teleport_skill_mast_640625: "Once the Teleport skill is mastered, you can Teleport to the latest Save Point that you have made with a Kafra Employee. I do not know why it is that way, but the Lord works in mysterious ways."
  npc_override_prt_in_prontera_once_you_learn_ruwach_yo_d25a1b: "Once you learn Ruwach, you will be able to learn the ^6666CCTeleport^000000 skill."
  npc_override_prt_in_prontera_once_you_learn_warp_port_ab0015: "Once you learn ^6666CCWarp Portal^000000, the level of the Warp Portal skill will determine how many warp destinations, or Warp Points, you can memorize."
  npc_override_prt_in_prontera_once_you_reach_level_hea_119578: "Once you reach ^6666CCLevel 2 Heal^000000 as an Acolyte, you can learn ^6666CCCure^000000, which can be used to treat abnormal statuses."
  npc_override_prt_in_prontera_one_monster_looks_just_l_72409b: "One monster, that looks just like a peaceful and weak one that you've already encountered, may actually be wild and ferocious!"
  npc_override_prt_in_prontera_one_time_i_walked_all_858540: "One time I walked all the way to Al de Baran, instead of taking a warp. It was pretty dangerous with all those monsters!"
  npc_override_prt_in_prontera_ooh_other_branch_our_lib_e81359: "Ooh~! The other branch of our library also has many interesting things to read! So if you get a chance, you just might want to visit."
  npc_override_prt_in_prontera_order_become_ready_learn_ba7881: "In order to become ready to learn Pneuma, you must first completely master the ^6666CCWarp Portal^000000 skill."
  npc_override_prt_in_prontera_outside_safety_city_ther_1baf87: "Outside the safety of the city, there is a pink beast known as ^000077Poring^000000."
  npc_override_prt_in_prontera_personally_though_i_don_86f34a: "Personally though, I don't know any guilds, so you'll have to ask around. Make some contacts, connections, you know, networking."
  npc_override_prt_in_prontera_pickys_so_cute_when_they_2a67f0: "Pickys are so cute when they're young, but when they grow up, they turn into those big, gawky looking Peco Pecos. Talk about awkward puberty."
  npc_override_prt_in_prontera_pneuma_allows_you_genera_f1d9e2: "The ^6666CCPneuma^000000 allows you to generate a barrier that will block all long-range attacks in a certain range, creating a zone that will protect you from monsters that attack from a distance."
  npc_override_prt_in_prontera_priests_use_santuary_cre_62094a: "Priests use ^6666CCSantuary^000000 to create an area which will restore the HP of you and your friends if you rest within the Sanctuary's area."
  npc_override_prt_in_prontera_prontera_culvert_sewers_20de5a: "The Prontera Culvert sewers have been left unattended for a long time. Now that place is infested with ^000077Thief Bugs^000000!"
  npc_override_prt_in_prontera_remember_you_must_first_1fb2da: "Remember, you must first learn ^6666CCLevel 2 Increase AGI^000000 if you want to be able to learn the Decrease AGI skill."
  npc_override_prt_in_prontera_rumor_numbers_ants_been_f72b06: "Rumor has it that the numbers of the ants have been greatly increased and they have become more violent, so that no one wants to get in the place."
  npc_override_prt_in_prontera_rumor_they_become_very_v_6f51bf: "Rumor has it that they have become very violent and Bees have built their habitat in the place, so that no one wants to get in there."
  npc_override_prt_in_prontera_rune_midgarts_ruled_40b3de: "Rune-Midgarts is ruled"
  npc_override_prt_in_prontera_s_s_my_most_precious_08cb09: "It's... It's my most precious dream."
  npc_override_prt_in_prontera_s_so_awesome_24fa1f: "That's so awesome!"
  npc_override_prt_in_prontera_same_dream_0c1813: "same dream!"
  npc_override_prt_in_prontera_savory_yum_yum_s_basic_f495bb: "Savory Yum Yum's basic ingredients are the grasshoppers romping in a place over the west forest. Yeah, it is the best selling menu ever."
  npc_override_prt_in_prontera_sick_tired_killing_monst_f439e2: "Sick and tired of killing monsters on fields and in dungeons already? Come on..."
  npc_override_prt_in_prontera_sigh_as_more_more_people_77d5a4: "Sigh...as more and more people coming into Prontera,"
  npc_override_prt_in_prontera_sigh_i_am_afraid_my_6757a0: "*Sigh*...I am afraid that my business days are numbered now."
  npc_override_prt_in_prontera_sigh_last_guy_entered_pl_cbb7c5: "*Sigh...* The last guy that entered this place haven't come back at all. He didn't listen to me and went in to gather Herbs or something dumb like that..."
  npc_override_prt_in_prontera_signum_crusis_skill_lowe_18d6ee: "The ^6666CCSignum Crusis^000000 skill lowers the Defense of monsters with the Undead or Dark properties. It has a wide range and can be quite powerful."
  npc_override_prt_in_prontera_skill_such_life_saver_si_cc9a1e: "This skill can be such a life saver, since almost every abnormal status can be cured with the Cure skill. Just remember that you need ^6666CCLevel 2 Heal^000000 before you can learn Cure."
  npc_override_prt_in_prontera_so_i_been_contacting_sup_8b0194: "So I have been contacting super heavy champion hunters for fresh and special ingredients."
  npc_override_prt_in_prontera_so_if_there_s_something_b6de21: "So if there's something on the ground that you want to pick up, be careful lest it be consumed by a Poring. Then again... Porings are pretty weak..."
  npc_override_prt_in_prontera_so_relax_plan_ahead_so_8b45cd: "So relax and plan ahead, so you can master all the skills that you really want to master the most. Also, don't just put skill points into anything. Remember to use your skill points wisely."
  npc_override_prt_in_prontera_so_we_went_there_as_9c42af: "So we went there but as soon as we entered, we were just stuck inside the maze, you know."
  npc_override_prt_in_prontera_sometimes_66a906: "But sometimes..."
  npc_override_prt_in_prontera_statue_obviously_muscula_5879b4: "But this statue is obviously not muscular enough, not godly enough to fairly represent a god! Maybe if he had a halo?"
  npc_override_prt_in_prontera_statue_you_see_behind_me_ea5a91: "The statue you see behind of me is a sculpture of mighty Odin. But, it's a shame because it's such a bad likeness."
  npc_override_prt_in_prontera_streets_too_crowded_thes_79e2c2: "The streets are too crowded these days. *Cough Cough* Look at all this dust, not everything about living in the capital city is good. Anyway, may I help you?"
  npc_override_prt_in_prontera_take_care_yourself_9e1f99: "Take care of yourself~."
  npc_override_prt_in_prontera_teleport_skill_teleports_e2f528: "The ^6666CCTeleport^000000 skill teleports you to a random location in the field or city which you are currently in. Teleport will prove useful for quick escapes, but where you may end up is... unpredictable."
  npc_override_prt_in_prontera_there_i_saw_shimmering_l_bd23b6: "There, I saw a shimmering light. I was completely captivated and went to approach it. It must have been some sort of beautiful fairy..."
  npc_override_prt_in_prontera_there_no_road_directly_l_72bdda: "There is no road directly leads to the ruins. But if you go north and keep heading to east, you will get there."
  npc_override_prt_in_prontera_there_s_another_monster_fe5d43: "There's another monster that goes through a really big change... Pickys."
  npc_override_prt_in_prontera_these_thief_bugs_seem_qu_b2e0e8: "These Thief Bugs seem to quickly grab items dropped on the ground, and then run away with them... They're even more annoying than cockroaches!!"
  npc_override_prt_in_prontera_they_might_just_bugs_i_946999: "They might just be bugs, but I think they've got the right idea. Men really ought to take commands from us women... We do things right!"
  npc_override_prt_in_prontera_they_said_they_could_get_d5ccf9: "They said that they could get lots and lots of rare items from the maze even if the maze was filled with awfully strong monsters."
  npc_override_prt_in_prontera_thief_bug_63e3e7: "a ^000077Thief Bug^000000!"
  npc_override_prt_in_prontera_though_s_cute_appearance_ad3672: "Though it's cute in appearance and does not actively harm people, Poring is known to absorb items that are on the ground into its own body."
  npc_override_prt_in_prontera_train_even_harder_3a3b88: "train even harder!"
  npc_override_prt_in_prontera_training_training_gotta_ee71bc: "Training! Training! Gotta keep training! You need to be strong too! Once we both get stronger, we'll meet again!"
  npc_override_prt_in_prontera_using_decrease_agi_monst_7333c2: "Using ^6666CCDecrease AGI^000000 on monsters will slow their movement, attack speed, and the rate at which they can evade your own attacks. That way, you can maim them properly."
  npc_override_prt_in_prontera_very_hard_tedious_proces_7c690f: "It is a very hard and tedious process, but the happiness and delight you feel when your clothes are done makes up for all the hard work."
  npc_override_prt_in_prontera_warp_portal_pretty_compl_652491: "^6666CCWarp Portal^000000 is a pretty complex skill, and you need to know some other skills before you can learn it."
  npc_override_prt_in_prontera_we_also_mete_swift_merci_bd70c4: "We also mete swift and merciless punishment to the forces of evil. Well, purifying any poor souls that may have been turned into the Undead is also another duty."
  npc_override_prt_in_prontera_we_both_share_371233: "We both share the"
  npc_override_prt_in_prontera_we_just_circling_around_c554e6: "We were just circling around and then we decided to leave the place. That was one hell of the maze."
  npc_override_prt_in_prontera_we_keep_records_monsters_9f313c: "we keep records of monsters found in various dungeons scattered around the Rune-Midgarts Kingdom."
  npc_override_prt_in_prontera_we_priests_acolytes_only_b3f792: "We Priests and Acolytes are not only limited to easing the suffering of our fellow man..."
  npc_override_prt_in_prontera_we_really_owe_prosperity_0d045d: "We really owe the prosperity of Rune-Midgarts to him. He was able to convince the people to welcome outsiders into Prontera, as well as establish trade to foreign lands, like Amatsu and Kunlun."
  npc_override_prt_in_prontera_weather_nice_my_day_off_83b7fe: "The weather was nice on my day off so my family and I went for a picnic. We chose to go to a slightly secluded area where I saw something really interesting..."
  npc_override_prt_in_prontera_welcome_prontera_948cda: "Welcome to Prontera."
  npc_override_prt_in_prontera_well_i_am_having_hard_0d950c: "Well, I am having a hard time to keep a good stock of food ingredients."
  npc_override_prt_in_prontera_well_i_happened_enter_pl_048a59: "Well, I happened to enter the places for carrying weapons for hunters or for delivering stuffs and whatsoever."
  npc_override_prt_in_prontera_well_people_like_them_pr_67bff1: "Well, people like them probably further the pursuit of beauty and fashion. But, of course, that's only my opinion."
  npc_override_prt_in_prontera_well_s_bit_hassle_if_5de6b0: "Well, it's a bit of hassle, but if you want to make a certain place one of your Warp Points, you need to be physically there first. Then, type in ^6666CC/memo^000000 into the command prompt."
  npc_override_prt_in_prontera_well_still_i_feel_taking_2cedc2: "Well, still, I feel that taking the scenic route was worth it. There were some pretty magnificent sights on the way."
  npc_override_prt_in_prontera_well_you_help_you_get_5e972c: "This is, well, for you to help you get even stronger. I guess I want to thank you for being such a good example."
  npc_override_prt_in_prontera_wha_130585: "Wha--?"
  npc_override_prt_in_prontera_whaaaat_stupid_guy_why_a_e136ed: "Whaaaat a stupid guy. Why would anyone want to throw his life away just to collect some silly Herbs?"
