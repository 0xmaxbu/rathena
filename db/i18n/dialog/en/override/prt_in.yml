  npc_override_prt_in_illusion_investigation_i_m_always_working_hard_ce878e: "I'm always working hard, but I don't think Master still approves of me."
  npc_override_prt_in_illusion_investigation_i_m_elysia_illusion_inve_62ed51: "I'm Elysia from the Illusion Investigation Team~"
  npc_override_prt_in_illusion_investigation_i_m_joining_500fea: "I'm joining"
  npc_override_prt_in_illusion_investigation_i_m_machoko_illusion_inv_98f7b6: "I'm Machoko from the Illusion Investigation Team~"
  npc_override_prt_in_illusion_investigation_i_m_neglected_like_s_bd3dd8: "I'm neglected like this... It's wrong to be acknowledged by Master..."
  npc_override_prt_in_illusion_investigation_i_m_orian_contract_worke_618612: "I'm Orian, a contract worker in the Illusion Investigation Corps."
  npc_override_prt_in_illusion_investigation_i_m_sent_such_dreary_eccbe2: "I'm sent to such a dreary place, and honestly, I'm very afraid"
  npc_override_prt_in_illusion_investigation_i_m_sure_master_happy_3b8df0: "I'm sure Master would be happy if we could get even a little bit more information about the deep sea here as part of the investigation team!!!"
  npc_override_prt_in_illusion_investigation_i_m_terrian_illusion_inv_363d69: "I'm a Terrian from the Illusion Investigation Corps."
  npc_override_prt_in_illusion_investigation_i_need_help_my_research_11afbb: "I need help with my research work, so I'm looking for a suitable helper."
  npc_override_prt_in_illusion_investigation_i_need_investigate_furth_81a855: "I need to investigate further to see if the phenomenon here is also affected by the dimensional rift."
  npc_override_prt_in_illusion_investigation_i_never_thought_i_sent_065c84: "I never thought I would be sent to such a dangerous place alone... I wanted to come with Jirocker..."
  npc_override_prt_in_illusion_investigation_i_ran_into_little_proble_d0b41d: "But I ran into a little problem..."
  npc_override_prt_in_illusion_investigation_i_really_wanted_dispatch_325254: "I really wanted to be dispatched to this place, but I was lucky."
  npc_override_prt_in_illusion_investigation_i_see_you_finished_quick_e79ef7: "I see... you finished quickly and came back."
  npc_override_prt_in_illusion_investigation_i_should_able_get_back_789d77: "I should be able to get back to work tomorrow, could you talk to me again then??"
  npc_override_prt_in_illusion_investigation_i_t_even_move_here_5dba25: "I... can't even move... Here... I'll wait..."
  npc_override_prt_in_illusion_investigation_i_think_fine_tomorrow_yo_c6ccc7: "I think it will be fine by tomorrow, can you come back after tomorrow?"
  npc_override_prt_in_illusion_investigation_i_think_investigation_mu_d8468a: "I think the investigation will be much easier thanks to you, adventurer."
  npc_override_prt_in_illusion_investigation_i_thought_i_could_all_0b09da: "I thought I could do it all by myself... I took it too lightly... Huh..."
  npc_override_prt_in_illusion_investigation_i_thought_my_fighting_po_222998: "I thought my fighting power would be enough to investigate here... but I guess I made a mistake."
  npc_override_prt_in_illusion_investigation_i_unknowingly_vigorously_4ea7e7: "I unknowingly and vigorously attacked and came back with a lot of beating... I almost died..."
  npc_override_prt_in_illusion_investigation_i_usually_pretended_brav_1cb185: "I usually pretended to be brave, but I think I was conscious of Elysia, the member I have a crush on."
  npc_override_prt_in_illusion_investigation_i_ve_always_been_interes_65654c: "But I've always been interested in the phenomenon of illusion, and when the investigation team was founded, I actively applied for membership."
  npc_override_prt_in_illusion_investigation_i_ve_been_paying_attenti_a364dd: "I've been paying attention to the phenomenon of dimensional rifts for a long time. Clearly, despite many subjugations, monsters are constantly appearing."
  npc_override_prt_in_illusion_investigation_i_ve_been_speculating_mi_f377e0: "I've been speculating that it might be related to the dimensional rift for a long time, but with the results of this investigation, it's clear."
  npc_override_prt_in_illusion_investigation_i_ve_been_waiting_you_e637fb: "I've been waiting for you... finish quickly and come back..."
  npc_override_prt_in_illusion_investigation_if_current_trend_i_think_736a2e: "If the current trend, I think we can resume the investigation in a day or so. Please come then."
  npc_override_prt_in_illusion_investigation_if_no_one_sets_foot_bbb476: "If no one sets foot there, it's very dangerous because the monsters can go beyond saturation and invade other areas."
  npc_override_prt_in_illusion_investigation_if_you_come_after_tomorr_f401fa: "If you come after tomorrow, you'll have something else to do~"
  npc_override_prt_in_illusion_investigation_if_you_don_t_mind_39989c: "If you don't mind, please apply for membership with the Commander <NAVI>[Joel]<INFO>prt_in,136,34,</INFO></NAVI> in Prontera."
  npc_override_prt_in_illusion_investigation_if_you_don_t_mind_b2eb14: "If you don't mind, please apply for membership with the Commander <NAVI>[Joel]<INFO>prt_in,136,34,</INFO></NAVI> in Prontera and come!"
  npc_override_prt_in_illusion_investigation_if_you_don_t_mind_b84c76: "If you don't mind, why don't you join the Illusionary Survey Corps? Then you can help me!!!"
  npc_override_prt_in_illusion_investigation_if_you_interested_please_00d2f8: "If you are interested, please meet <NAVI>[Joel]<INFO>prt_in,136,34,</INFO></NAVI>, the Commander in Prontera, and join the Investigation Team and come back."
  npc_override_prt_in_illusion_investigation_if_you_kill_monsters_any_27fb51: "If you kill 100 monsters of any type, would you like to participate?"
  npc_override_prt_in_illusion_investigation_if_you_kill_monsters_any_de17c8: "If you kill 100 monsters of any type, would you like to participate"
  npc_override_prt_in_illusion_investigation_if_you_like_sign_up_5af419: "If you would like to sign up, please go see Commander <NAVI>[Joel]<INFO>prt_in,136,34,</INFO></NAVI> in Prontera."
  npc_override_prt_in_illusion_investigation_if_you_re_adventurer_you_3d6ce9: "And if you're an adventurer, you seem to be strong enough for that role..."
  npc_override_prt_in_illusion_investigation_if_you_time_during_your_d75630: "If you have time during your adventure, I would like you to stop by the Illusions located in various places and help me with the investigation."
  npc_override_prt_in_illusion_investigation_if_you_wish_join_illusio_980403: "If you wish to join the Illusion Investigation Corps, you're lacking in skills yet."
  npc_override_prt_in_illusion_investigation_illumination_investigati_aec4fb: "The Illumination Investigation Team is a newly formed organization, so it must have been a little understaffed. I saw an announcement that they would hire part-time contract workers."
  npc_override_prt_in_illusion_investigation_illusion_investigation_c_b7eeda: "The Illusion Investigation Corps is getting bigger little by little."
  npc_override_prt_in_illusion_investigation_investigate_ecosystem_mo_dd4221: "Investigate the ecosystem of monsters in Illusion..."
  npc_override_prt_in_illusion_investigation_investigate_i_became_mem_e12111: "To investigate it, I became a member of the Illusion Investigation Team."
  npc_override_prt_in_illusion_investigation_investigation_least_help_3f4c29: "This investigation will at least help reduce that time."
  npc_override_prt_in_illusion_investigation_investigation_preparatio_0ab132: "Investigation preparations are complete, now I'm waiting for someone who can adjust the monsters' levels."
  npc_override_prt_in_illusion_investigation_jirocker_doing_his_inves_ab8b32: "Is Jirocker doing his investigation safely in the abandoned village? I'm worried."
  npc_override_prt_in_illusion_investigation_just_kill_monsters_any_t_7084ab: "Just kill 100 monsters of any type that exist here."
  npc_override_prt_in_illusion_investigation_just_kill_monsters_any_t_fc21fe: "Just kill 100 monsters of any type here."
  npc_override_prt_in_illusion_investigation_just_time_illusion_inves_32b744: "Just in time, the Illusion Investigation Team said they needed to investigate the deep sea here, so I quickly applied."
  npc_override_prt_in_illusion_investigation_just_what_you_did_last_1dd741: "Just do what you did last time!"
  npc_override_prt_in_illusion_investigation_kill_monsters_any_type_f50c0d: "Kill 100 monsters of any type."
