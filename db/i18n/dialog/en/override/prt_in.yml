  npc_override_prt_in_illusion_investigation_actually_i_m_one_who_2048f9: "Actually, I'm the one who's more timid than anyone else... heck"
  npc_override_prt_in_illusion_investigation_actually_s_something_i_m_e6dd82: "Actually, it's not something I'm keen on...but I need the money..."
