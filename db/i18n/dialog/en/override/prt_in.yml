  npc_override_prt_in_novice_skills_you_use_about_sp_convert_cfe3cf: "you will use about 3 SP and convert"
  npc_override_prt_in_novice_skills_you_want_bandage_learn_f_bc0fb0: "You want to have a bandage to learn first aid?"
