  npc_override_un_bk_q_quests_15_2_i_only_say_i_survived_c6fafd: "I can only say I would not have survived if I stayed at that place."
  npc_override_un_bk_q_quests_15_2_i_only_watch_490cd6: "I can only watch on..."
  npc_override_un_bk_q_quests_15_2_i_only_watch_since_only_86632b: "I can only watch on since the only thing I know how to do is wash clothes."
  npc_override_un_bk_q_quests_15_2_i_pray_his_heart_okay_a85b1e: "I pray that his heart is okay..."
