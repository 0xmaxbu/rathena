  npc_override_un_bk_q_quests_15_2_i_invited_you_come_3c5d38: "I invited you to come."
  npc_override_un_bk_q_quests_15_2_i_just_don_t_want_f0ad80: "I just.. Don't want to let it be known I am there.."
  npc_override_un_bk_q_quests_15_2_i_just_need_moment_b4ff55: "I just need a moment."
  npc_override_un_bk_q_quests_15_2_i_just_sent_out_signal_681d32: "I just sent out the signal so the others will arrive soon."
  npc_override_un_bk_q_quests_15_2_i_just_wanted_hear_one_9fc043: "I just wanted to hear one apology..."
