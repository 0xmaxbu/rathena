  npc_override_un_bk_q_quests_15_2_i_assessed_as_being_too_02fb54: "I assessed it as not being too dangerous."
  npc_override_un_bk_q_quests_15_2_i_ate_fresh_grapes_since_170193: "I ate fresh grapes and since I don't have anything to do anything to do, I'm going to sleep early."
  npc_override_un_bk_q_quests_15_2_i_ate_lot_different_thin_32b6b0: "I ate a lot of different things from adventuring places."
  npc_override_un_bk_q_quests_15_2_i_been_investigating_day_165c14: "I have been investigating this for 30 days already but I do not know what it is."
  npc_override_un_bk_q_quests_15_2_i_been_investigating_day_5e0be6: "I have been investigating this for 32 days already but I do not know what it is."
  npc_override_un_bk_q_quests_15_2_i_been_investigating_day_f85bac: "I have been investigating this for 40 days already."
  npc_override_un_bk_q_quests_15_2_i_blindly_went_around_ju_2efb47: "I blindly went around Juperos."
  npc_override_un_bk_q_quests_15_2_i_busy_here_so_i_386204: "I was busy here so I haven't been able to go down to the underground bunker they say is right underneath."
  npc_override_un_bk_q_quests_15_2_i_cannot_endure_shame_my_928450: "I cannot endure the shame of my past for considering him a mere successful project.'"
  npc_override_un_bk_q_quests_15_2_i_cannot_figure_out_here_620a0d: "I cannot figure out from here where they are and what they are doing."
  npc_override_un_bk_q_quests_15_2_i_cannot_tell_how_long_10a8fc: "I cannot tell how long it has been since I entered this place."
  npc_override_un_bk_q_quests_15_2_i_clung_juperos_like_mad_9b6d70: "I clung to Juperos like a mad man."
  npc_override_un_bk_q_quests_15_2_i_committed_discourtesy_3669a6: "I have committed that discourtesy that the time."
  npc_override_un_bk_q_quests_15_2_i_cook_now_i_am_4a666c: "I will cook now! I am salivating at the thought of the flavor!"
  npc_override_un_bk_q_quests_15_2_i_count_you_fc49e4: "I will count on you."
  npc_override_un_bk_q_quests_15_2_i_decide_report_directly_91efb6: "I will decide to report directly or not through you."
  npc_override_un_bk_q_quests_15_2_i_did_die_because_i_5b1b11: "I did not die because I was made of machines so I just watched over Verus."
  npc_override_un_bk_q_quests_15_2_i_did_promise_no_choice_7fc1d4: "I did promise. No choice. Where was I?"
  npc_override_un_bk_q_quests_15_2_i_didn_t_even_know_c44e8e: "I didn't even know how much time has passed."
  npc_override_un_bk_q_quests_15_2_i_didn_t_send_signal_6dd03f: "I didn't send the signal yet but did you come here because you also got a strange feeling?"
  npc_override_un_bk_q_quests_15_2_i_didn_t_share_much_963e3d: "I didn't share that much but the guy next to me must be drunk because he keeps clinging on to me."
  npc_override_un_bk_q_quests_15_2_i_didn_t_think_such_3215e8: "I didn't think such a space would exist inside a bunker..."
  npc_override_un_bk_q_quests_15_2_i_don_t_feel_great_1a3bc8: "I don't feel that great but work is work."
  npc_override_un_bk_q_quests_15_2_i_don_t_know_details_7c04f4: "I don't know the details but the air pollution level outside of the shelter was measured."
  npc_override_un_bk_q_quests_15_2_i_don_t_know_how_04f7e3: "I don't know how this will affect your position but..."
  npc_override_un_bk_q_quests_15_2_i_don_t_know_how_752ebb: "I don't know how many years it has been."
  npc_override_un_bk_q_quests_15_2_i_don_t_know_reason_66ef07: "I don't know the reason, but Fresa assigned me here."
  npc_override_un_bk_q_quests_15_2_i_don_t_know_what_20de24: "I don't know what is happening."
  npc_override_un_bk_q_quests_15_2_i_don_t_know_what_e4b271: "I don't know what brings you here but please don't touch anything."
  npc_override_un_bk_q_quests_15_2_i_don_t_know_who_c92413: "I don't know who equipped the air-raid shelter. But it surely is well made and sturdy."
  npc_override_un_bk_q_quests_15_2_i_don_t_know_why_0b04e3: "I don't know why everybody is rejecting a device that can move heavy objects."
  npc_override_un_bk_q_quests_15_2_i_don_t_see_any_558098: "I don't see any problematic symptoms. Fortunate."
  npc_override_un_bk_q_quests_15_2_i_don_t_think_helped_b0f59e: "I don't think it can be helped that people will worry. The last veteran reporter, Grizzly Grylls! Designated survival reporter!"
  npc_override_un_bk_q_quests_15_2_i_don_t_think_so_14b651: "I don't think so?"
  npc_override_un_bk_q_quests_15_2_i_don_t_think_there_3a4485: "I don't think there is no such time left for me.."
  npc_override_un_bk_q_quests_15_2_i_don_t_want_die_2f140a: ".I don't want to die. Whimper.."
  npc_override_un_bk_q_quests_15_2_i_don_t_want_leave_e799cf: "I don't want to leave this kind of stuff on the record..."
  npc_override_un_bk_q_quests_15_2_i_don_t_want_like_9ca7f7: "I don't want to be like them!!"
  npc_override_un_bk_q_quests_15_2_i_done_if_i_knew_daee37: "I would not have done that if I knew you were a descendant of Lasse."
  npc_override_un_bk_q_quests_15_2_i_expecting_you_bring_ba_7f76b9: "I will be expecting you to bring back lots of fun stuff."
  npc_override_un_bk_q_quests_15_2_i_feel_great_evil_design_8aedef: "I feel a great evil design from this piece."
