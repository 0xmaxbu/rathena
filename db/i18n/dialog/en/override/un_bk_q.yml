  npc_override_un_bk_q_quests_15_2_i_find_myself_pathetic_b_40190d: "I find myself pathetic for becoming a burden much less of help."
  npc_override_un_bk_q_quests_15_2_i_formally_introduce_you_f66ad6: "I will formally introduce you."
  npc_override_un_bk_q_quests_15_2_i_found_myself_motel_roo_815260: "I found myself in a motel room in Juno when I came to."
  npc_override_un_bk_q_quests_15_2_i_found_while_looking_ar_38446d: "I found this while looking around the air-raid shelter"
  npc_override_un_bk_q_quests_15_2_i_get_so_go_along_d4e7b5: "I get it so go on along now."
  npc_override_un_bk_q_quests_15_2_i_give_you_equipment_ret_056203: "I will give you equipment in return for 17 intact machine components!"
  npc_override_un_bk_q_quests_15_2_i_give_you_small_reward_980cd3: "{0} I will give you a small reward."
  npc_override_un_bk_q_quests_15_2_i_give_you_sole_rights_a2aa76: "I will give you sole rights to the Memory Records."
  npc_override_un_bk_q_quests_15_2_i_go_excavation_site_rec_91ce1a: "I will go to the excavation site with the record player."
  npc_override_un_bk_q_quests_15_2_i_got_we_need_take_20f4ff: "I got it. We need to take measures."
  npc_override_un_bk_q_quests_15_2_i_guess_i_did_good_471429: "I guess I did a good thing by giving you eternal life."
  npc_override_un_bk_q_quests_15_2_i_guess_i_should_satisfi_0358af: "I guess I should be satisfied at even having this kind of opportunity."
  npc_override_un_bk_q_quests_15_2_i_guess_looking_situatio_0b7107: "I guess looking at the situation it's not a shock to see everybody's state."
  npc_override_un_bk_q_quests_15_2_i_guess_we_no_choice_5fe0a4: "I guess we have no choice to gather as much information as possible?"
  npc_override_un_bk_q_quests_15_2_i_guess_you_know_results_9e1d96: "I guess you know the results of the outside exploration team? I am going to live outside."
  npc_override_un_bk_q_quests_15_2_i_guide_you_inside_56d100: "I will guide you inside."
  npc_override_un_bk_q_quests_15_2_i_hate_these_access_prot_ee8fc3: "I hate these access protocols."
  npc_override_un_bk_q_quests_15_2_i_haven_t_been_able_c01fe9: "I haven't been able to eat at all from all the running away. All day! I noticed these bugs that eat metal."
  npc_override_un_bk_q_quests_15_2_i_haven_t_been_bewildere_b13227: "I haven't been that bewildered by simultaneously convulsing patients before.."
