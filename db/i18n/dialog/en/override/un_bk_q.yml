Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_un_bk_q_quests_15_2_aaarghhhh_288ae6: "Aaarghhhh!!!!"
  npc_override_un_bk_q_quests_15_2_aah_i_don_t_know_1fceb2: "Aah- I don't know the reason but the control room is"
  npc_override_un_bk_q_quests_15_2_aahh_looking_after_wareh_089ee0: "Aahh- Looking after the warehouse is annoying."
  npc_override_un_bk_q_quests_15_2_aarrghhhh_a299e2: "Aarrghhhh!!!"
  npc_override_un_bk_q_quests_15_2_about_last_exploration_284455: "About the Last Exploration"
  npc_override_un_bk_q_quests_15_2_above_all_i_worry_about_dfb08a: "Above all I worry about you being left alone."
  npc_override_un_bk_q_quests_15_2_accept_3e1999: "Accept."
  npc_override_un_bk_q_quests_15_2_access_temporary_clinic_d43c0c: "Access to the temporary clinic is restricted to quarantine convulsing patients."
  npc_override_un_bk_q_quests_15_2_accident_cannot_helped_o_34dfd1: "This is an accident that cannot be helped by one individual though."
  npc_override_un_bk_q_quests_15_2_according_aures_he_blind_c53d48: "According to Aures he blindly clung onto Juperos.."
  npc_override_un_bk_q_quests_15_2_according_biotechnology_dc98af: "According to the biotechnology managers harvest is possible at least once every 2 weeks"
  npc_override_un_bk_q_quests_15_2_according_chemical_subst_79d0fc: "According to the Chemical Substance Specialists the situation is hopeless."
  npc_override_un_bk_q_quests_15_2_according_ebrik_e0b800: "According to Ebrik."
  npc_override_un_bk_q_quests_15_2_according_facilities_man_aeee7b: "According to the Facilities managers it will be later used as a Clinic."
  npc_override_un_bk_q_quests_15_2_adventure_move_air_clean_a3111e: "An adventure to move the air cleaner?"
  npc_override_un_bk_q_quests_15_2_adventurer_delivered_air_decfb5: "Has the adventurer not delivered the air cleaning unit yet? Uh?! It's here. Hurry.. the air cleaning unit.."
  npc_override_un_bk_q_quests_15_2_adventurer_s_blood_boili_b7062c: "The Adventurer's blood is boiling and wanting to explore places but there isn't much to do."
  npc_override_un_bk_q_quests_15_2_adventurers_been_deploye_6b55e6: "And Adventurers have been deployed to suppress the convulsing people because a lot of the weak researchers are wounded."
  npc_override_un_bk_q_quests_15_2_after_evaluating_oxygen_29181d: "After evaluating that oxygen levels were low the Mechanicians have started to assemble Air cleaning units."
  npc_override_un_bk_q_quests_15_2_after_i_chased_after_ill_747b45: "...After that, I chased after an illusion I wasn't sure was a dream or hallucination."
  npc_override_un_bk_q_quests_15_2_after_long_discussion_re_ce83f6: "After a long discussion, the research staff of Dr. Fresa seem to have decided to"
  npc_override_un_bk_q_quests_15_2_after_midnight_remaining_9a960d: "After midnight the remaining Chemical Substance Specialists assessed that they were dead and everybody had a brief moment of silence."
  npc_override_un_bk_q_quests_15_2_after_silently_working_s_2014c7: "After silently working for several days the Bioengineers have good news."
  npc_override_un_bk_q_quests_15_2_agree_help_4d4d65: "Agree to help."
  npc_override_un_bk_q_quests_15_2_ah_617d80: "Ah......."
  npc_override_un_bk_q_quests_15_2_ah_971301: "Ah..."
  npc_override_un_bk_q_quests_15_2_ah_ah_c337de: "Ah...Ah..."
  npc_override_un_bk_q_quests_15_2_ah_ah_chief_director_exp_459e9e: "Ah?! Ah!! The chief director of the experiment was ^0000FF Lona Fresa^000000."
  npc_override_un_bk_q_quests_15_2_ah_ah_fresa_i_met_5930d1: "Ah! Ah! Fresa? I have met her a few times at plenary sessions."
  npc_override_un_bk_q_quests_15_2_ah_ah_one_two_three_19f310: "Ah ah- One two three test- test-"
  npc_override_un_bk_q_quests_15_2_ah_air_cleaning_unit_doe_08f00b: "Ah the air cleaning unit doesn't belong here."
  npc_override_un_bk_q_quests_15_2_ah_al_up_there_might_a5a063: "Ah! Al up there might know. Go to Al."
  npc_override_un_bk_q_quests_15_2_ah_also_51a0c2: "Ah also..."
  npc_override_un_bk_q_quests_15_2_ah_ba60a0: "Ah, that..?"
  npc_override_un_bk_q_quests_15_2_ah_come_seems_there_lot_90e981: "Ah! Come on in. It seems there are a lot of visitors today because of the broadcast this morning."
  npc_override_un_bk_q_quests_15_2_ah_course_s_hehehehe_5681aa: "Ah, of course not. It's not but hehehehe"
  npc_override_un_bk_q_quests_15_2_ah_cozy_snug_fe_el_b880b7: "Ah- This cozy and snug fe...el.....ling"
  npc_override_un_bk_q_quests_15_2_ah_dr_fresa_sent_you_8187f6: "Ah! Dr. Fresa sent you to check the conditions of survivor assignments?"
  npc_override_un_bk_q_quests_15_2_ah_f5ad63: "...Ah..."
  npc_override_un_bk_q_quests_15_2_ah_geez_there_no_other_305861: "Ah geez! There is no other issues yet but why is he saying he's dizzy?"
  npc_override_un_bk_q_quests_15_2_ah_got_hit_again_my_e22585: "Ah.. Got hit again. My..zizizip.. hurts... zizizip"
  npc_override_un_bk_q_quests_15_2_ah_grape_good_i_want_d2b28f: "Ah.. the grape was good, I want it again. Did they say harvest was possible once every 2 weeks?"
  npc_override_un_bk_q_quests_15_2_ah_he_s_starving_being_609e4e: "Ah....He's not starving and being weak is he? Huh?"
  npc_override_un_bk_q_quests_15_2_ah_i_m_going_get_42cd9b: "Ah! This was on? I'm going to get in trouble for leaving it on too long.."
  npc_override_un_bk_q_quests_15_2_ah_no_one_founders_janet_f5b646: "Ah, No. One of the founders, Janet Zerter knows of this as well."
  npc_override_un_bk_q_quests_15_2_ah_s_just_rumor_rumor_a6a962: "Ah! It's just a rumor! A Rumor!!"
  npc_override_un_bk_q_quests_15_2_ah_so_fresa_you_say_488976: "Ah! Is that so? Fresa you say? It hasn't been long since my department was placed here."
  npc_override_un_bk_q_quests_15_2_ah_sorry_i_go_work_b37ce2: "Ah.. sorry. I have to go to work. I will do more when I have the chance."
  npc_override_un_bk_q_quests_15_2_ah_tell_fresa_your_way_024afa: "Ah! Tell Fresa on your way that we are checking for hazardous substances within the air-raid shelter according to emergency protocol."
  npc_override_un_bk_q_quests_15_2_ah_test_test_oh_works_7fb761: "Ah test test.. oh.. it works?"
  npc_override_un_bk_q_quests_15_2_ah_thinking_like_isn_t_1dd89f: "..Ah thinking like this isn't my thing."
  npc_override_un_bk_q_quests_15_2_ah_what_s_important_e94d83: "Ah! That is not what's important."
  npc_override_un_bk_q_quests_15_2_ah_what_should_i_should_0424d2: "Ah.. What should I do.. Should I go since most of the goods are moved?"
  npc_override_un_bk_q_quests_15_2_ah_yes_kid_he_follow_6aac43: "Ah, yes. That kid. He would follow me around annoyingly."
  npc_override_un_bk_q_quests_15_2_ah_you_adventurer_who_s_0d61d6: "Ah! Are you the Adventurer who's helping with moving the newly made air cleaning unit?"
  npc_override_un_bk_q_quests_15_2_ah_you_adventurer_who_s_226b54: "Ah?! Are you the Adventurer who's delivering air cleaning units?"
  npc_override_un_bk_q_quests_15_2_ah_you_here_isn_t_7fb094: "Ah! You are here. Isn't the interior of the shelter a bit complicated? The favor I asked of you.."
  npc_override_un_bk_q_quests_15_2_ah_you_member_atnad_exca_90bfd3: "Ah. You are a member of the Atnad excavation team."
  npc_override_un_bk_q_quests_15_2_ah_you_re_adventurer_you_bf5da1: "Ah!! You're the adventurer. You could check out the farm."
  npc_override_un_bk_q_quests_15_2_aha_indeed_so_4c9984: "Aha! Indeed so."
  npc_override_un_bk_q_quests_15_2_aha_now_i_think_tatio_528e33: "Aha. Now I think Tatio is also not a member of the main project so is here with me in the Research facilities."
  npc_override_un_bk_q_quests_15_2_ahh_why_did_i_travel_9704de: "Ahh.. Why did I travel here.."
  npc_override_un_bk_q_quests_15_2_air_raid_shelter_residen_78cfc0: "The air-raid shelter residents are throwing a small party to celebrate the successful harvest."
  npc_override_un_bk_q_quests_15_2_air_raid_shelter_so_larg_9ade65: "The air-raid shelter is so large that I had no idea where they were but thanks to that I became friends with some of the Adventurers, especially Castle and Blat."
  npc_override_un_bk_q_quests_15_2_all_audible_information_b8d089: "All audible information in the Memory Record has been played."
  npc_override_un_bk_q_quests_15_2_all_letters_sent_back_be_e91cbb: "All the letters were sent back because the address wasn't clear!"
  npc_override_un_bk_q_quests_15_2_all_sorts_documents_offi_117975: "All sorts of documents and office supplies are piled up in a heap."
  npc_override_un_bk_q_quests_15_2_all_traces_place_erased_bf88fe: "^FF0000All traces in this place will be erased if you go back to your original time.^000000"
  npc_override_un_bk_q_quests_15_2_alright_all_ready_563692: "Alright, all ready."
  npc_override_un_bk_q_quests_15_2_alright_go_back_bb6da1: "Alright. Go back."
  npc_override_un_bk_q_quests_15_2_alright_let_s_move_cargo_1ee280: "Alright- let's move the cargo to Zone Z-2 first."
  npc_override_un_bk_q_quests_15_2_alright_then_034971: "Alright then...."
  npc_override_un_bk_q_quests_15_2_also_if_you_find_out_334aba: "Also, if you find out anything let me know. You don't need to tell anybody else."
  npc_override_un_bk_q_quests_15_2_also_one_descendants_ver_d80078: "Also one of the descendants of Verus City."
  npc_override_un_bk_q_quests_15_2_although_i_did_make_some_f2a41e: "Although I did make some preparations."
  npc_override_un_bk_q_quests_15_2_although_i_think_he_safe_46fc5b: "Although I think he will be safe... can you find out where about he is? He probably ran to the ruins there..."
  npc_override_un_bk_q_quests_15_2_although_might_uncomfort_0aa132: "Although it might uncomfortable to sit on the corporation toilet."
  npc_override_un_bk_q_quests_15_2_although_most_data_been_bc4a3c: "Although most of the data has been lost by accident..."
  npc_override_un_bk_q_quests_15_2_although_my_childhood_me_b7fa47: "Although it is my childhood memories, the grandfathers had a lot of secrets."
  npc_override_un_bk_q_quests_15_2_although_open_verus_city_2225b2: "Although open, Verus City is still something you want to protect ..I see."
  npc_override_un_bk_q_quests_15_2_although_some_these_find_139c8a: "Although some of these findings are repeating the same content."
  npc_override_un_bk_q_quests_15_2_although_there_small_pro_694f85: "Although there was a small problem of the Mechanicians destroying one grape tree"
  npc_override_un_bk_q_quests_15_2_although_underground_bun_2125bd: "Although it is an underground bunker, the scale is not a joke!"
  npc_override_un_bk_q_quests_15_2_although_unfortunate_acc_75f68e: "Although an unfortunate accident turned it the way it is now."
  npc_override_un_bk_q_quests_15_2_although_we_operated_mos_a8d8c8: "Although we operated mostly as a broker between clients and implementers"
  npc_override_un_bk_q_quests_15_2_always_honest_his_feelin_129aad: "Always honest in his feelings, unchanging...."
  npc_override_un_bk_q_quests_15_2_am_i_generous_d5ddf1: "Am I not generous?"
  npc_override_un_bk_q_quests_15_2_amazing_427497: "Amazing!!!"
  npc_override_un_bk_q_quests_15_2_amazing_there_bugs_gnaw_9ada64: "Amazing that there are bugs that gnaw at metal! But they must be a good source of precious protein and high in nutrition!"
  npc_override_un_bk_q_quests_15_2_amusing_see_those_two_to_dc07d6: "It is amusing to see those two together."
  npc_override_un_bk_q_quests_15_2_annoying_clean_up_eed027: "Annoying to clean up.."
  npc_override_un_bk_q_quests_15_2_another_female_voice_ah_50290c: "(Another Female Voice) Ah...... I should be seeing this while having chicken and beer.... zizizip--"
  npc_override_un_bk_q_quests_15_2_anyway_7479d2: "Anyway..."
  npc_override_un_bk_q_quests_15_2_anyway_9438d6: "Anyway!!"
  npc_override_un_bk_q_quests_15_2_anyway_adventurer_assuri_c3fbe5: "Anyway, Adventurer~ Assuring and the best!"
  npc_override_un_bk_q_quests_15_2_anyway_current_number_us_6ba1fb: "Anyway the current number of us facilities managers is ^FF0000{0}^000000."
  npc_override_un_bk_q_quests_15_2_anyway_i_enjoy_grape_you_a8d920: "Anyway I will enjoy this grape you delivered. This is a reward."
  npc_override_un_bk_q_quests_15_2_anyway_i_record_content_c81c11: "Anyway I will record this content separately and deliver it to the old man."
  npc_override_un_bk_q_quests_15_2_anyway_isn_t_secretary_m_34de05: "An..anyway isn't that secretary the main instigator of this whole incident?"
  npc_override_un_bk_q_quests_15_2_anyway_seems_everybody_h_357b65: "Anyway it seems everybody is here so let's go in."
  npc_override_un_bk_q_quests_15_2_anyway_since_you_permitt_98f096: "Anyway, since you are permitted you may enter freely from now on."
  npc_override_un_bk_q_quests_15_2_anyway_thanks_i_prepared_3c087c: "Anyway thanks. I prepared this for compensation."
  npc_override_un_bk_q_quests_15_2_anyway_we_received_air_c_d13970: "Anyway we have received the air cleaning unit."
  npc_override_un_bk_q_quests_15_2_anyway_why_did_you_come_4158b1: "Anyway, why did you come?"
  npc_override_un_bk_q_quests_15_2_anyway_young_lady_3d4110: "Anyway that young lady..."
  npc_override_un_bk_q_quests_15_2_apparently_related_havin_a7433c: "Apparently it is related to having gone outside."
  npc_override_un_bk_q_quests_15_2_apparently_some_contamin_4d478f: "Apparently some contaminated substance got inside the air-raid shelter."
  npc_override_un_bk_q_quests_15_2_area_currently_open_town_63ee0b: "The area currently open are the town and plaza."
  npc_override_un_bk_q_quests_15_2_aren_t_you_refreshing_9f06e9: "Aren't you refreshing!!"
  npc_override_un_bk_q_quests_15_2_argh_another_convulsing_7bf5fa: "Argh!! Another convulsing patient."
  npc_override_un_bk_q_quests_15_2_argh_e047e4: "Argh!!!"
  npc_override_un_bk_q_quests_15_2_argh_i_told_you_scribble_0dab2d: "Argh- I told you not to scribble on the floor while pretending to sleep."
  npc_override_un_bk_q_quests_15_2_arwhat_why_didn_t_you_7277e1: "Arwhat!! Why didn't you bring it. Bring it now, okay?"
  npc_override_un_bk_q_quests_15_2_as_adventurer_who_eats_p_30caa4: "As an Adventurer who eats and plays as much as he works, I cannot stand the itching for action. Urgh"
  npc_override_un_bk_q_quests_15_2_as_collecting_laboratori_244a8b: "As for collecting the laboratories Memory Records, we decided to do it only once a day, right?"
  npc_override_un_bk_q_quests_15_2_as_collecting_research_f_7e521f: "As for collecting the Research Facilities Memory Records, we decided to do it only once a day, right?"
  npc_override_un_bk_q_quests_15_2_as_expected_51d50d: "As expected.."
  npc_override_un_bk_q_quests_15_2_as_i_hope_somebody_remem_a60853: "As I hope somebody will remember how we were instead."
  npc_override_un_bk_q_quests_15_2_as_i_thought_i_am_acf8c8: "As I thought. I am glad he is at least safe. If it's okay can you find my colleague Sunny Kim as well?"
  npc_override_un_bk_q_quests_15_2_as_you_know_there_infect_ac7d1a: "As you know there are infectees who are suddenly showing strange phenomena.."
  npc_override_un_bk_q_quests_15_2_as_you_try_eject_memory_383d1b: "As you try to eject the Memory Record, the connecting part breaks with a cracking sound and returns to it's disassembled form."
  npc_override_un_bk_q_quests_15_2_as_you_wish_3a6b51: "Do as you wish."
  npc_override_un_bk_q_quests_15_2_as_you_wish_dafe43: "As you wish."
  npc_override_un_bk_q_quests_15_2_as_your_working_excavati_6217f5: "And, as your working with the excavation team ^4d4dffask about the Last Exploration^000000."
  npc_override_un_bk_q_quests_15_2_ask_if_safe_5468a4: "Ask if safe"
  npc_override_un_bk_q_quests_15_2_ate_you_check_minute_7fe12a: "..Ate! Can you check this for a minute?"
  npc_override_un_bk_q_quests_15_2_atk_matk_if_helmet_refin_00e62c: "ATK and MATK + 50. If helmet refinement is at 9, it has an affect of MSP + 50%, MHP + 10%."
  npc_override_un_bk_q_quests_15_2_atnad_555dda: "..Atnad?"
  npc_override_un_bk_q_quests_15_2_atnad_excavators_permitt_74388b: "Atnad excavators are permitted access."
  npc_override_un_bk_q_quests_15_2_atnad_lasse_atnad_great_06a2d9: "And Atnad is Lasse Atnad, the great-grandfather of Dr. Atnad."
  npc_override_un_bk_q_quests_15_2_attacking_you_juperos_al_9d8b14: "Attacking you at Juperos was all because I wanted to."
  npc_override_un_bk_q_quests_15_2_aures_secretary_giving_e_4e8625: "Aures and the secretary giving embarrassed looks."
  npc_override_un_bk_q_quests_15_2_baang_4eb4a5: "-------Baang-----"
  npc_override_un_bk_q_quests_15_2_bad_proposition_honestly_4b5df4: "Not a bad proposition. Honestly it's a good opportunity."
  npc_override_un_bk_q_quests_15_2_bang_cb5bc9: "--------Bang-----"
  npc_override_un_bk_q_quests_15_2_basically_you_re_partici_68b829: "Basically you're participating in the site excavation work but"
  npc_override_un_bk_q_quests_15_2_because_although_i_know_08db04: "And because although I do not know the reason the energy storms disappeared and"
  npc_override_un_bk_q_quests_15_2_because_contaminant_ther_567873: "Is it because of the contaminant? There are patients who suddenly convulse and attack others."
  npc_override_un_bk_q_quests_15_2_because_doctor_saw_somet_f70e3f: "That is.. because the doctor saw something he shouldn't have at the time."
  npc_override_un_bk_q_quests_15_2_because_nickname_surviva_a1cf72: "Because of the nickname survival king, I thought Grizzly was good in combat but he is really just good at surviving. As soon as monsters showed up he disappeared like the wind."
  npc_override_un_bk_q_quests_15_2_because_she_already_owne_db48c8: "Because she already was the owner of my heart..."
  npc_override_un_bk_q_quests_15_2_because_someone_leave_be_47c3e8: "because someone has to leave behind the memories of this terrible accident."
  npc_override_un_bk_q_quests_15_2_because_vague_memories_t_bfbe69: "Because of the vague memories of that time.."
  npc_override_un_bk_q_quests_15_2_because_we_helped_i_thou_91cc87: "Is it because we helped? I thought I saw a faint smile on her face."
  npc_override_un_bk_q_quests_15_2_been_decided_move_all_eq_59e0a0: "It has been decided to move all equipment and necessities to the less contaminated Zone Z-2"
  npc_override_un_bk_q_quests_15_2_before_you_said_you_stuc_2986d5: "Before you said you were stuck somewhere for a week!"
  npc_override_un_bk_q_quests_15_2_being_attacked_machines_ba4b84: "being attacked by machines like the plaza, so access is limited only to the excavation team."
  npc_override_un_bk_q_quests_15_2_better_abandon_me_7507b0: "It would be better to abandon me..."
  npc_override_un_bk_q_quests_15_2_better_if_wasn_t_my_a14191: "... It would better if it wasn't for my damn father."
  npc_override_un_bk_q_quests_15_2_bioengineers_30111c: "20 Bioengineers"
  npc_override_un_bk_q_quests_15_2_bioengineers_alone_enoug_b5d091: "Bioengineers alone do not have enough hands to harvest the amount of grapes we need to provide all the people inside the air-raid shelter."
  npc_override_un_bk_q_quests_15_2_bioengineers_succeeded_c_ee0dcf: "The Bioengineers succeeded in cultivating grapes right?"
  npc_override_un_bk_q_quests_15_2_biotechnology_engineers_86fd70: "Biotechnology engineers, mechanical engineers, facility managers.. we have everybody we need."
  npc_override_un_bk_q_quests_15_2_booom_zizizizip_882529: "Booom! Zizizizip"
  npc_override_un_bk_q_quests_15_2_boss_goal_jackpot_advent_14dec1: "The boss' goal is that. Not the jackpot for an Adventurer but let's make a magazine that can provide sweet info! That's kind of the purpose apparently."
  npc_override_un_bk_q_quests_15_2_break_d3553f: "Break it."
  npc_override_un_bk_q_quests_15_2_brigan_44fdba: "Brigan"
  npc_override_un_bk_q_quests_15_2_bring_back_memory_record_935252: "Bring back the Memory Records of the laboratories you want to play."
  npc_override_un_bk_q_quests_15_2_brings_memory_record_pla_3e1e94: "Brings the Memory Record player!"
  npc_override_un_bk_q_quests_15_2_broken_chip_int_if_equip_1da757: "Broken Chip 2 has INT + 4. If equipped with Broken Chip 1, it has a STR + 8, INT+ 8 affect."
  npc_override_un_bk_q_quests_15_2_broken_chip_str_if_equip_cf1e7c: "Broken Chip 1 has STR + 4. If equipped with Broken Chip 2, it has a STR + 8, INT+ 8 affect."
  npc_override_un_bk_q_quests_15_2_brother_run_774287: "Brother- Run~"
  npc_override_un_bk_q_quests_15_2_bug_gnaws_away_metal_i_4413b6: "A bug that gnaws away metal. I wonder how it tastes. I am so curious! This is why I can't quit being a reporter."
  npc_override_un_bk_q_quests_15_2_bzz_07a8ab: "Bzz.."
  npc_override_un_bk_q_quests_15_2_bzz_bzz_80f30d: "Bzz..bzz"
  npc_override_un_bk_q_quests_15_2_cafeteria_food_good_thou_8dd975: "The Cafeteria food is good though."
