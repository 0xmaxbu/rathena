  npc_override_un_bk_q_quests_15_2_hurk_you_so_true_one_9a4e9f: "Hurk.. You. So it was true. It was a one way crush as ever."
  npc_override_un_bk_q_quests_15_2_hurts_hurts_9622ba: "Hurts.. It hurts.."
