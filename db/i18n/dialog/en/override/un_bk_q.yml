  npc_override_un_bk_q_quests_15_2_i_am_asking_you_work_1894ee: "I am not asking you to work for free either!"
  npc_override_un_bk_q_quests_15_2_i_am_belief_danger_shoul_dd77f0: "I am of the belief danger should be avoided but my friends Castle and Blat volunteered."
  npc_override_un_bk_q_quests_15_2_i_am_busy_person_myself_5c89a3: "I am a busy person myself."
  npc_override_un_bk_q_quests_15_2_i_am_chairman_rekenber_4407b7: "I am the chairman of Rekenber."
  npc_override_un_bk_q_quests_15_2_i_am_charge_interviews_a_348124: "I am in charge of interviews and arranging stories and my colleague is photographs. Veteran senior acts as a guide. As a magazine specializing in Adventure we go to cover dangerous places a lot."
  npc_override_un_bk_q_quests_15_2_i_am_coming_atnad_excava_24f436: "I am coming from the atnad excavation"
  npc_override_un_bk_q_quests_15_2_i_am_crazy_funny_s_3ede5a: "I am not crazy, this is funny! It's because it's funny."
  npc_override_un_bk_q_quests_15_2_i_am_dorothy_florence_i_c01d30: "I am Dorothy Florence. I picked up a Memory Record in the Monitoring room today."
  npc_override_un_bk_q_quests_15_2_i_am_enjoying_adventure_8404a9: "I am enjoying an adventure! Tell her to not worry. I am a little hungry though..."
  npc_override_un_bk_q_quests_15_2_i_am_fighting_hard_becom_a92051: "I am fighting hard to become a specialized survival reporter! Even though...not now but please come back later, if that's okay with you!"
  npc_override_un_bk_q_quests_15_2_i_am_itching_adventure_s_3a839f: "I am itching for an adventure but safety outside isn't confirmed so don't think of going outside."
  npc_override_un_bk_q_quests_15_2_i_am_little_busy_cooking_0be98f: "I am a little busy cooking these bugs. You want a bite as well?"
  npc_override_un_bk_q_quests_15_2_i_am_monthly_brigan_s_751f1b: "I am Monthly Brigan's senior reporter Krotzel! As this place is revealed to the many, many Adventurers are gathering here."
  npc_override_un_bk_q_quests_15_2_i_am_most_worried_about_144120: "I am most worried about the Probationary member. He is still new so won't know anything. It is highly possible he followed the veteran senior. If it is okay, can you find him?"
  npc_override_un_bk_q_quests_15_2_i_am_playing_around_you_2e635d: "I am playing around for you left alone in the city."
  npc_override_un_bk_q_quests_15_2_i_am_sorry_about_7c598b: "......I am sorry about that."
  npc_override_un_bk_q_quests_15_2_i_am_sorry_isn_t_e90f05: "I am sorry but. Isn't that enough?"
  npc_override_un_bk_q_quests_15_2_i_am_sorry_only_permitte_c63e21: "I am sorry, only permitted excavation team members are permitted access."
  npc_override_un_bk_q_quests_15_2_i_am_sorry_right_now_49d99c: "I am sorry. Right now I am a little busy with several problems. Can we speak later?"
  npc_override_un_bk_q_quests_15_2_i_am_sorry_you_cannot_125301: "I am sorry but you cannot enter further without approval."
  npc_override_un_bk_q_quests_15_2_i_am_sorry_you_report_41bba9: "I am sorry but can you report this to Fresa on your way? You know who Fresa is?"
  npc_override_un_bk_q_quests_15_2_i_am_sorry_you_report_60cc65: "I am sorry but can you report this to Fresa on your way? This is a favor."
  npc_override_un_bk_q_quests_15_2_i_am_sure_content_itself_24094b: "I am not sure but the content itself should be fine."
  npc_override_un_bk_q_quests_15_2_i_am_sure_maybe_you_2a1a4f: "I am not sure. Maybe you can ask Al over there?"
  npc_override_un_bk_q_quests_15_2_i_am_sure_what_you_123437: "I am not sure what you're talking about but.."
  npc_override_un_bk_q_quests_15_2_i_am_tatio_memory_record_7aae89: "I am the Tatio in the Memory Records you have discovered."
  npc_override_un_bk_q_quests_15_2_i_am_too_proud_ask_b378f1: "I am too proud to ask somebody."
  npc_override_un_bk_q_quests_15_2_i_am_type_shove_people_b04549: "I am not the type to shove people around."
  npc_override_un_bk_q_quests_15_2_i_am_worried_people_sudd_0a7002: "I am worried of the people suddenly attacking."
  npc_override_un_bk_q_quests_15_2_i_as_well_bb6703: "I as well."
  npc_override_un_bk_q_quests_15_2_i_ask_you_favor_even_6e4a76: "I ask you for this favor even though it won't be easy in this large and complex shelter."
  npc_override_un_bk_q_quests_15_2_i_ask_your_understanding_5641ac: "I ask for your understanding."
