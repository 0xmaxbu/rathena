  npc_override_un_bk_q_quests_15_2_i_knew_you_d_say_b7e14d: "I knew you'd say that."
  npc_override_un_bk_q_quests_15_2_i_like_grapes_i_want_b19a61: "I like grapes. I want to eat more."
  npc_override_un_bk_q_quests_15_2_i_like_if_you_left_405896: "I would like it if you left immediately."
  npc_override_un_bk_q_quests_15_2_i_like_you_work_excavati_6819cf: "I would like you to work in an excavation team Rahim introduces."
  npc_override_un_bk_q_quests_15_2_i_loathe_fighting_fun_se_8b6f0b: "I loathe fighting but.. It is fun to see them together. Yes."
  npc_override_un_bk_q_quests_15_2_i_look_around_area_you_c0b6a0: "I will look around in this area. You don't have to bring him. Even though it's the Probationary period he should know how to work by himself! Just let me know where he is when you find him."
  npc_override_un_bk_q_quests_15_2_i_looked_around_air_raid_c5a4fd: "I looked around the air-raid shelter but whoever designed it has not one artistic hair on him."
  npc_override_un_bk_q_quests_15_2_i_looking_forward_as_wel_2ea8d4: "I will be looking forward to it as well."
  npc_override_un_bk_q_quests_15_2_i_m_fine_they_re_e39d5e: "I'm fine. They're making a fuss for no reason."
  npc_override_un_bk_q_quests_15_2_i_m_going_participate_so_a6c0ac: "I'm going to participate so bring the Memory Records to me next time."
  npc_override_un_bk_q_quests_15_2_i_m_going_there_myself_56a49b: "I'm not going there myself because of curiosity."
  npc_override_un_bk_q_quests_15_2_i_m_kind_popular_side_29c46b: "I'm kind of on the popular side. Haha."
  npc_override_un_bk_q_quests_15_2_i_m_listening_zerter_ah_3c515f: "I'm listening. Zerter. .. Ah! You. Your voice got in this!"
  npc_override_un_bk_q_quests_15_2_i_m_looking_forward_hear_6897a1: "I'm looking forward to hear about my ancestors again."
  npc_override_un_bk_q_quests_15_2_i_m_saying_we_want_201e7a: "I'm saying we want to use your manpower. Aren't we pros at introducing human resources? Ahahahahaha~"
  npc_override_un_bk_q_quests_15_2_i_m_starting_think_s_891312: "I'm starting to think it's made like this on purpose."
  npc_override_un_bk_q_quests_15_2_i_made_isn_t_awesome_fe3666: "I made that. Isn't it awesome?"
  npc_override_un_bk_q_quests_15_2_i_manipulated_his_memory_33d026: "I manipulated his memory a bit."
  npc_override_un_bk_q_quests_15_2_i_may_reached_my_limits_3f617e: "I may have reached my limits."
  npc_override_un_bk_q_quests_15_2_i_mean_air_cleaning_unit_0e6ad7: "I mean the air cleaning unit you are moving now."
  npc_override_un_bk_q_quests_15_2_i_mean_collecting_labora_836b13: "I mean ^4d4dffcollecting 5 laboratories Memory Records in the underground facility of laboratories^000000."
  npc_override_un_bk_q_quests_15_2_i_mean_laboratories_memo_2f4a90: "I mean the laboratories Memory Records."
  npc_override_un_bk_q_quests_15_2_i_must_blame_my_overtaxe_538410: "I must blame my overtaxed body for not listening to me now."
  npc_override_un_bk_q_quests_15_2_i_mustered_some_courage_09a509: "I mustered some courage and followed him but it was dangerous. If it's okay can you help me?"
  npc_override_un_bk_q_quests_15_2_i_need_least_five_1ecbcc: "I need at least five."
  npc_override_un_bk_q_quests_15_2_i_need_taste_these_bugs_4c6546: "I need to taste these bugs. I think it will be a good news story as well! The survival king's roasted metal bugs! That's the headline!"
