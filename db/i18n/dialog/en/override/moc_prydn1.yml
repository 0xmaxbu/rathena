Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_moc_prydn1_quests_morocc_ahh_just_follow_me_8c1bba: "Ahh, just follow me!"
  npc_override_moc_prydn1_quests_morocc_alright_target_number_go_5f939a: "Alright, the target number is 20! Good luck!"
  npc_override_moc_prydn1_quests_morocc_ancient_mummies_caught_m_f6c6c0: "But Ancient Mummies caught me off guard and hit my head before I knew it!"
  npc_override_moc_prydn1_quests_morocc_ancient_mummy_wouldn_t_d_d39826: "That Ancient Mummy wouldn't dare come around here for a while, right? Muhahah!"
  npc_override_moc_prydn1_quests_morocc_bah_what_s_up_old_159563: "Bah, what's up with this old money... you don't have anything sparkly or shiny?!"
  npc_override_moc_prydn1_quests_morocc_bah_you_re_so_cold_609291: "Bah, you're so cold-hearted."
  npc_override_moc_prydn1_quests_morocc_come_they_re_so_strange_40a952: "But come on, they're so strange! They're mummies! Just mummies, you know? They shouldn't be that strong!"
  npc_override_moc_prydn1_quests_morocc_come_think_weakling_like_5e99ca: "^FF0000But come to think of it, a weakling like you won't survive there. Maybe for a second if you're lucky?^000000"
  npc_override_moc_prydn1_quests_morocc_did_you_know_cats_dogs_91a677: "Did you know that cats and dogs don't get along?"
  npc_override_moc_prydn1_quests_morocc_don_t_ask_why_i_75538d: "Don't ask why! I'm sure you wouldn't want those beautiful treasures to be hidden in the dark either!"
  npc_override_moc_prydn1_quests_morocc_fighting_ancient_mummies_b31a14: "Is fighting Ancient Mummies going well?"
  npc_override_moc_prydn1_quests_morocc_good_i_ll_make_good_8081f1: "Good, I'll make a good use of the time you gained! But I gotta do something about this stomachache first....."
  npc_override_moc_prydn1_quests_morocc_good_keep_up_good_work_a7326c: "Good. Keep up the good work!"
  npc_override_moc_prydn1_quests_morocc_good_target_number_good_36426e: "Good, the target number is 20! Good luck!"
  npc_override_moc_prydn1_quests_morocc_gosh_i_could_scratched_h_b4ec8c: "Gosh, I could have scratched his face so hard if it wasn't for my stomachache!"
  npc_override_moc_prydn1_quests_morocc_gosh_you_don_t_even_014ad6: "Gosh, you don't even have 5000 Zeny, do you?"
  npc_override_moc_prydn1_quests_morocc_haha_s_secret_184dd6: "Haha, it's a secret."
  npc_override_moc_prydn1_quests_morocc_hey_s_because_i_m_dfd378: "Hey, it's not because I'm afraid of Majoruros!"
  npc_override_moc_prydn1_quests_morocc_hey_you_re_actually_usef_374814: "Hey, you're actually useful! Good job!"
  npc_override_moc_prydn1_quests_morocc_hmm_if_you_insist_just_90040c: "Hmm... but if you insist, just give me 5000 Zeny. I'll lead you."
  npc_override_moc_prydn1_quests_morocc_i_found_out_while_i_0b722c: "I found out while I was stealing... No, I mean, just walking through the pyramid."
  npc_override_moc_prydn1_quests_morocc_i_ll_send_you_field_178a76: "I'll send you to the field shortly."
  npc_override_moc_prydn1_quests_morocc_i_m_sure_mummy_s_b2f575: "I'm sure the mummy's precious treasures are hidden in the second basement level."
  npc_override_moc_prydn1_quests_morocc_i_m_sure_they_re_41d8c3: "I'm sure they're trying to stop me from finding the treasures by decreasing my superior brain cells!!"
  npc_override_moc_prydn1_quests_morocc_i_see_c52c6e: "I see."
  npc_override_moc_prydn1_quests_morocc_i_t_believe_mummy_could_e91cff: "I can't believe a mummy could do this to me. Oh man, it hurts. Nobody should find out about this...."
  npc_override_moc_prydn1_quests_morocc_if_you_really_want_go_5fb233: "If you really want to go to the next area, you'll be responsible for your own safety."
  npc_override_moc_prydn1_quests_morocc_if_you_want_go_home_b782f6: "If you want to go home, you'd better beat up that ugly doggie! Otherwise, he'll bite you!"
  npc_override_moc_prydn1_quests_morocc_look_him_so_greedy_drool_38e795: "Look at him, so greedy and drooly... I don't like the way he breathes, either. I can't stand how he's making those gobbling sounds..."
  npc_override_moc_prydn1_quests_morocc_look_ugly_hideous_verit_7570cb: "Look at that ugly and hideous Verit. He's scowling, wagging his tail and trying to come closer."
  npc_override_moc_prydn1_quests_morocc_look_verit_he_s_afraid_bba602: "Look at that Verit, he's afraid of us! Kyaahaha! We're safe, at least for a while!"
  npc_override_moc_prydn1_quests_morocc_menu_go_57cca7: "Go back to Thief Guild:Eliminate Verit:Eliminate Ancient Mummy:It's nothing"
  npc_override_moc_prydn1_quests_morocc_menu_help_034271: "Help him:Stay away"
  npc_override_moc_prydn1_quests_morocc_menu_i_73cb54: "I would like to go, too.:End the conversation."
  npc_override_moc_prydn1_quests_morocc_menu_mummy_b890ec: "Mummy? What happened?:Pretend not to know anything."
  npc_override_moc_prydn1_quests_morocc_menu_nevermind_b6feef: "Nevermind.:Enter the Field."
  npc_override_moc_prydn1_quests_morocc_menu_pay_db2353: "Pay 5,000 zeny and set out.:Forget it."
  npc_override_moc_prydn1_quests_morocc_menu_strong_e88a43: "Strong mummies? Where are they?:End the conversation."
  npc_override_moc_prydn1_quests_morocc_menu_sure_eaf5d8: "Sure.:I want to stop."
  npc_override_moc_prydn1_quests_morocc_no_way_i_spent_so_159b76: "No way! I spent so much time finding that path!!"
  npc_override_moc_prydn1_quests_morocc_oh_you_don_t_tail_f08603: "Oh, you don't have a tail, right? He thinks I'm a thorn in his side, and he's trying to start a fight now!"
  npc_override_moc_prydn1_quests_morocc_pah_you_don_t_care_1efd88: "Pah! You don't care about me? Fine, you traitor!"
  npc_override_moc_prydn1_quests_morocc_precious_treasures_suppo_c20b56: "Precious treasures are supposed to be hidden in the deep secret places here!"
  npc_override_moc_prydn1_quests_morocc_right_right_let_s_go_3a67cb: "Right right... let's go back."
  npc_override_moc_prydn1_quests_morocc_s_so_obvious_he_s_1a967d: "It's so obvious that he's waiting to attack me from behind."
  npc_override_moc_prydn1_quests_morocc_safe_journey_0e1277: "Have a safe journey."
  npc_override_moc_prydn1_quests_morocc_stupid_mummy_slapped_me_30b2d0: "That stupid mummy slapped me again while you were looking away! Sniff sniff... Let's go back, meow!"
  npc_override_moc_prydn1_quests_morocc_they_t_stop_me_let_c9817e: "They can't stop me! Let's go get rid of Ancient Mummies!!"
  npc_override_moc_prydn1_quests_morocc_verit_s_training_going_w_0d48e2: "Is Verit's training going well?"
  npc_override_moc_prydn1_quests_morocc_verit_wouldn_t_dare_come_a610ba: "That Verit wouldn't dare come around here for a while, right? Muhahah!"
  npc_override_moc_prydn1_quests_morocc_we_ve_received_orders_he_dee905: "We've received orders from Headquarters to block access to this area since an unusual space-time phenomenon has been detected."
  npc_override_moc_prydn1_quests_morocc_well_s_none_my_business_8f1004: "Well, it's none of my business. But I warned you anyway!"
  npc_override_moc_prydn1_quests_morocc_whaaat_you_don_t_want_834a6a: "Whaaat~ you don't want to hear my story? Fine! You'd better not mention my name anywhere else!"
  npc_override_moc_prydn1_quests_morocc_what_don_t_give_me_652066: "What~? Don't give me that look! Do you have any idea how hard it is for a cat to survive in Midgard!"
  npc_override_moc_prydn1_quests_morocc_what_you_re_so_irrespons_5ef1d5: "What? You're so irresponsible!"
  npc_override_moc_prydn1_quests_morocc_when_i_saw_mummy_coming_0e1f07: "When I saw a mummy coming toward me, I was like 'whatever' and didn't care. But then he knocked me down with a slap in the face! How could he do that to a cute cat like me! You bandaged freak... you just wait and see!"
  npc_override_moc_prydn1_quests_morocc_where_you_think_you_re_ec9ceb: "Where do you think you're going! You're so broke!"
  npc_override_moc_prydn1_quests_morocc_wise_choice_ea1f08: "Wise choice."
  npc_override_moc_prydn1_quests_morocc_you_caught_me_darn_i_8d3df8: "You caught me! Darn it...I didn't expect my reputation as a tomb raider would get damaged like this..."
