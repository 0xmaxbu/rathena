Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_har_in01_enchan_rockridge_accessory_right_slot_d08e7c: "Accessory (Right Slot)"
  npc_override_har_in01_enchan_rockridge_ah_didn_t_turn_out_94ded0: "Ah, that didn't turn out well."
  npc_override_har_in01_enchan_rockridge_ah_we_met_before_i_541c71: "Ah, have we met before? I meet so many people every day that I can't remember all of their faces. Let me catch you up to speed."
  npc_override_har_in01_enchan_rockridge_ah_you_coins_adbbbe: "Ah, you have the coins."
  npc_override_har_in01_enchan_rockridge_ah_you_re_interested_027c48: "Ah, you're interested in the"
  npc_override_har_in01_enchan_rockridge_all_equipment_zeny_regar_6c76dd: "All the equipment is ^0000CD1,500,000 Zeny^000000 regardless of its type."
  npc_override_har_in01_enchan_rockridge_all_equipment_zeny_regar_771764: "All the equipment is ^0000CD3,000,000 Zeny^000000 regardless of its type."
  npc_override_har_in01_enchan_rockridge_all_my_bullets_finest_qu_d21f93: "All my bullets are of the finest quality."
  npc_override_har_in01_enchan_rockridge_all_my_products_hard_fin_20394a: "But ^0000CDall my products are hard to find elsewhere^000000. Why don't you take a look at them?"
  npc_override_har_in01_enchan_rockridge_alright_come_back_if_you_3c4bd6: "Alright, come back if you change your mind."
  npc_override_har_in01_enchan_rockridge_armor_b1fc5d: "Armor"
  npc_override_har_in01_enchan_rockridge_armor_bulkier_than_weapo_e0e1a4: "Armor is bulkier than weapons, so I can only have a set number of products delivered every week."
  npc_override_har_in01_enchan_rockridge_armor_dealer_brings_new_791379: "The armor dealer brings in new stock every Friday, and it's sold almost as soon as it's in, every time."
  npc_override_har_in01_enchan_rockridge_as_i_told_you_s_f97c54: "As I told you, it's ^0000CD{0} Zeny^000000. Do you want to buy it?"
  npc_override_har_in01_enchan_rockridge_because_what_413bac: "Because of what?"
  npc_override_har_in01_enchan_rockridge_been_enchanted_maximum_l_18808e: "This has been enchanted to the maximum limit. Maybe you should reset it."
  npc_override_har_in01_enchan_rockridge_bullets_7509c5: "Bullets"
  npc_override_har_in01_enchan_rockridge_cancel_77dfd2: "Cancel"
  npc_override_har_in01_enchan_rockridge_cancel_ebda43: "Cancel."
  npc_override_har_in01_enchan_rockridge_chuckle_sure_young_peopl_1fa4b4: "*Chuckle* Sure, young people always look good, no matter what they wear."
  npc_override_har_in01_enchan_rockridge_click_name_detailed_desc_c2e044: "Click the name for the detailed description."
  npc_override_har_in01_enchan_rockridge_come_again_9c3015: "Come again."
  npc_override_har_in01_enchan_rockridge_come_back_if_you_want_e6accd: "Come back if you want more equipment. I'll always be here. *Chuckle*"
  npc_override_har_in01_enchan_rockridge_did_you_just_try_switch_e0f9e9: "Did you just try to switch equipment?"
  npc_override_har_in01_enchan_rockridge_done_check_out_211e96: "Done. Check it out."
  npc_override_har_in01_enchan_rockridge_each_every_piece_equipme_c98681: "Each and every piece of this equipment has a story to tell, and it might hold a grudge if you don't take it with you."
  npc_override_har_in01_enchan_rockridge_elemental_cape_048615: "Elemental Cape"
  npc_override_har_in01_enchan_rockridge_enchant_contraband_items_c733e0: "Enchant contraband items."
  npc_override_har_in01_enchan_rockridge_err_you_re_carrying_lot_51cc46: "Err, you're carrying a lot of things."
  npc_override_har_in01_enchan_rockridge_garment_cd2d27: "Garment"
  npc_override_har_in01_enchan_rockridge_golden_scarf_6e7558: "Golden Scarf"
  npc_override_har_in01_enchan_rockridge_hello_how_may_i_help_7c4b97: "Hello. How may I help you today?"
  npc_override_har_in01_enchan_rockridge_hello_welcome_rock_ridge_8d2070: "Hello. Welcome to the Rock Ridge Armor Shop."
  npc_override_har_in01_enchan_rockridge_hippie_feather_17c0c5: "Hippie Feather"
  npc_override_har_in01_enchan_rockridge_hm_you_don_t_coins_c7b744: "Hm, you don't have the coins."
  npc_override_har_in01_enchan_rockridge_hmpf_don_t_act_like_bcb8a8: "Hmpf, don't act like you don't know. I'm talking about the special equipment you can buy in Rock Ridge."
  npc_override_har_in01_enchan_rockridge_huh_so_i_wasted_my_ea292e: "Huh. So I wasted my breath on someone who doesn't want to buy."
  npc_override_har_in01_enchan_rockridge_i_am_5bf3c4: "I am."
  npc_override_har_in01_enchan_rockridge_i_carry_shotguns_revolve_87c6bc: "I carry shotguns, revolvers, and bullets."
  npc_override_har_in01_enchan_rockridge_i_charge_rock_ridge_coin_21375d: "I charge 2 Rock Ridge Coins for this service. Bring them to me."
  npc_override_har_in01_enchan_rockridge_i_charge_rock_ridge_coin_743dce: "I charge 2 Rock Ridge Coins per socket for both enchanting and resetting."
  npc_override_har_in01_enchan_rockridge_i_don_t_handle_items_e9e748: "I don't handle items like this."
  npc_override_har_in01_enchan_rockridge_i_enchant_equipment_you_bbf69b: "I can enchant the equipment that you can buy with Rock Ridge Coins, for up to 3 sockets for Armor and Garments and up to 2 sockets for Accessories."
  npc_override_har_in01_enchan_rockridge_i_ll_come_back_later_19e43d: "I'll come back later."
  npc_override_har_in01_enchan_rockridge_i_ll_show_you_list_244f61: "I'll show you the list of available items. ^0000CDIf it's blank, then everything's sold out^000000."
  npc_override_har_in01_enchan_rockridge_i_m_carrying_too_many_468846: "I'm carrying too many types of items. I should lighten my bag first."
  npc_override_har_in01_enchan_rockridge_i_m_closed_today_e3dca0: "I'm closed today."
  npc_override_har_in01_enchan_rockridge_i_m_overweight_i_d_50e3b6: "I'm overweight. I'd better lighten my bag first."
  npc_override_har_in01_enchan_rockridge_i_no_idea_what_you_fd6bf5: "I have no idea what you're talking about."
  npc_override_har_in01_enchan_rockridge_i_suggest_you_don_t_9f4ceb: "I suggest you don't tell anyone else about it,"
  npc_override_har_in01_enchan_rockridge_i_ve_just_brought_few_630976: "I've just brought in a few good models."
  npc_override_har_in01_enchan_rockridge_if_you_made_up_your_01b6e7: "If you have made up your mind, then please talk to me again."
  npc_override_har_in01_enchan_rockridge_if_you_want_lighten_your_1204d3: "If you want to lighten your bag, there's a Kafra employee in the direction of the sheriff's office."
  npc_override_har_in01_enchan_rockridge_if_you_want_something_sp_26b6f3: "But if you want something special, go check the armor shop."
  npc_override_har_in01_enchan_rockridge_let_me_show_you_some_54f254: "Let me show you some good models."
  npc_override_har_in01_enchan_rockridge_let_s_788324: "Let's do it."
  npc_override_har_in01_enchan_rockridge_lighten_your_bag_first_26c929: "lighten your bag first?"
  npc_override_har_in01_enchan_rockridge_ll_rock_ridge_coins_c02ca1: "That'll be {0} Rock Ridge Coins."
  npc_override_har_in01_enchan_rockridge_make_them_better_how_7a4c0e: "Make them better? How?"
  npc_override_har_in01_enchan_rockridge_menu_chuckle_6118d0: "*Chuckle* Which one do you want: one for your ^0000CDshoulders^000000, ^0000CDneck, or chest^000000?"
  npc_override_har_in01_enchan_rockridge_mine_worker_backpack_f3c0c5: "Mine Worker Backpack"
  npc_override_har_in01_enchan_rockridge_msg_6dd69d: "[{0}]."
  npc_override_har_in01_enchan_rockridge_my_neck_chest_33f4af: "For my neck or chest"
  npc_override_har_in01_enchan_rockridge_my_shoulders_174196: "For my shoulders"
  npc_override_har_in01_enchan_rockridge_no_b8b9f1: "No."
  npc_override_har_in01_enchan_rockridge_oh_note_these_contraband_de1629: "Oh, and note that these contraband items are prone to destruction, especially when they are reset."
  npc_override_har_in01_enchan_rockridge_oh_you_really_want_reset_c255cc: "Oh, do you really want to reset it? As I told you before, contraband Vigilante Badges are prone to destruction."
  npc_override_har_in01_enchan_rockridge_once_week_i_close_my_9492ff: "Once a week, I close my shop and spend the day being thankful for what I have."
  npc_override_har_in01_enchan_rockridge_oops_i_guess_you_re_38d395: "Oops, I guess you're too innocent to hear what I just said."
  npc_override_har_in01_enchan_rockridge_people_often_let_their_p_e61a03: "People often let their preconceived notions fool them. Most people don't think an old woman like me would sell such special items."
  npc_override_har_in01_enchan_rockridge_pick_one_you_like_i_73cf83: "Pick one you like, and I'll tell you about it."
  npc_override_har_in01_enchan_rockridge_please_bring_more_ac9bca: "Please bring more."
  npc_override_har_in01_enchan_rockridge_please_go_lighten_your_b_33dfc5: "Please go lighten your bag first."
  npc_override_har_in01_enchan_rockridge_promise_me_you_ll_back_ce4019: "and promise me you'll be back. I'll keep the equipment for you."
  npc_override_har_in01_enchan_rockridge_reset_contraband_item_en_94e849: "Reset contraband item Enchantment level."
  npc_override_har_in01_enchan_rockridge_revolvers_6c545e: "Revolvers"
  npc_override_har_in01_enchan_rockridge_s_enchanted_what_you_exp_03eea4: "It's not enchanted. What do you expect me to reset?"
  npc_override_har_in01_enchan_rockridge_s_same_day_no_deliveries_8ed7c5: "...And it's the same day that no deliveries come."
  npc_override_har_in01_enchan_rockridge_same_reason_i_t_give_dcaa7a: "And for that same reason, I can't give ^0000CDspecial discounts^000000."
  npc_override_har_in01_enchan_rockridge_sell_items_da520e: "Sell items."
  npc_override_har_in01_enchan_rockridge_shotguns_981c5e: "Shotguns"
  npc_override_har_in01_enchan_rockridge_show_me_what_you_ve_6b8592: "Show me what you've got."
  npc_override_har_in01_enchan_rockridge_so_you_here_because_67841d: "So, are you here because of ^0000CDit^000000?"
  npc_override_har_in01_enchan_rockridge_something_wrong_happened_801756: "Something wrong happened."
  npc_override_har_in01_enchan_rockridge_sure_here_s_your_fa1843: "Sure. Here's your {0}."
  npc_override_har_in01_enchan_rockridge_sure_if_you_things_i_1da900: "Sure, if you have things I can sell."
  npc_override_har_in01_enchan_rockridge_take_look_around_see_if_347536: "Take a look around and see if there's something you want."
  npc_override_har_in01_enchan_rockridge_tell_me_what_kind_item_c4101d: "Tell me what kind of item you want, and I'll show you a list."
  npc_override_har_in01_enchan_rockridge_thank_you_helping_rock_r_a6f866: "Thank you for helping Rock Ridge."
  npc_override_har_in01_enchan_rockridge_there_you_go_enjoy_6a921b: "There you go. Enjoy!"
  npc_override_har_in01_enchan_rockridge_today_stock_c48539: "Today,{0}are in stock."
  npc_override_har_in01_enchan_rockridge_uh_oh_you_don_t_4fa6db: "Uh-oh, you don't have enough money to buy this."
  npc_override_har_in01_enchan_rockridge_um_anything_3701b2: "Um, anything."
  npc_override_har_in01_enchan_rockridge_vigilante_badge_bd38e8: "Vigilante Badge"
  npc_override_har_in01_enchan_rockridge_well_just_my_luck_6a369f: "Well, just my luck."
  npc_override_har_in01_enchan_rockridge_what_you_like_6df180: "What would you like to have?"
  npc_override_har_in01_enchan_rockridge_why_don_t_you_collect_62cd0b: "Why don't you collect them first?"
  npc_override_har_in01_enchan_rockridge_why_don_t_you_come_00c775: "Why don't you come back later? I'll always be here."
  npc_override_har_in01_enchan_rockridge_why_don_t_you_go_e5771c: "Why don't you go"
  npc_override_har_in01_enchan_rockridge_why_you_wasting_my_time_295585: "Why are you wasting my time? Go wear your equipment first."
  npc_override_har_in01_enchan_rockridge_yes_c53c56: "Yes."
  npc_override_har_in01_enchan_rockridge_you_certain_you_want_ite_b8e7f0: "Are you certain you want this item?"
  npc_override_har_in01_enchan_rockridge_you_don_t_enough_coins_c68021: "You don't have enough coins."
  npc_override_har_in01_enchan_rockridge_you_must_really_strong_c_47b76f: "You must be really strong to carry so much with you."
  npc_override_har_in01_enchan_rockridge_you_re_adventurer_i_like_5d4e8a: "You're an adventurer. I like people like you who have passion."
  npc_override_har_in01_enchan_rockridge_you_re_carrying_too_much_a3ebb9: "You're carrying too much to buy anything."
  npc_override_har_in01_enchan_rockridge_you_re_carrying_too_much_a4ef02: "You're carrying too much to buy weapons."
  npc_override_har_in01_enchan_rockridge_you_re_silly_1ae11f: "You're silly."
  npc_override_har_in01_enchan_rockridge_you_should_forget_your_o_9a4ca6: "You should forget it, for your own good."
  npc_override_har_in01_enchan_rockridge_you_tried_buy_some_contr_505f7f: "Have you tried to buy some contraband items with Rock Ridge Coins? I can make your contraband items better."
  npc_override_har_in01_enchan_rockridge_you_want_browse_revolver_f98b5f: "You want to browse revolvers? I see."
  npc_override_har_in01_enchan_rockridge_you_want_browse_shotguns_ad8ac4: "You want to browse shotguns? I see."
  npc_override_har_in01_enchan_rockridge_you_want_bullets_i_see_0dd394: "You want bullets, I see."
