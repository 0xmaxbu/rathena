  npc_override_que_ba_quests_morocc_if_you_re_here_request_ffc2ca: "If you're here for the request that we made earlier, you can just forget about it."
  npc_override_que_ba_quests_morocc_if_you_re_interested_fee_9ee755: "If you're interested, feel free to drop by that library as well."
