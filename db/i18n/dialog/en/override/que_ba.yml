  npc_override_que_ba_quests_morocc_i_know_what_you_re_333e33: "I know what you're gonna talk about. You want the Magic Glasses from me, riiiiight?"
  npc_override_que_ba_quests_morocc_i_let_you_d05129: "I will let you"
  npc_override_que_ba_quests_morocc_i_live_nowhere_i_don_5e3ad6: "- I live nowhere, and I don't have parents. -"
  npc_override_que_ba_quests_morocc_i_ll_ask_you_help_4f4262: "I'll ask you for a help some other time."
  npc_override_que_ba_quests_morocc_i_ll_let_live_just_c17908: "I'll let live just a little longer. You'll never find me through this time-space gap!"
  npc_override_que_ba_quests_morocc_i_ll_let_you_if_ae8f07: "I'll let you in if you buy me a drink."
  npc_override_que_ba_quests_morocc_i_ll_send_you_field_4fe0b4: "I'll send you to the field shortly. Please use the warp at the field entrance to come back to this area."
  npc_override_que_ba_quests_morocc_i_looking_thing_shining_c20414: "I was looking at the thing shining under the cover of the bag!"
