  npc_override_que_ba_quests_morocc_i_m_like_other_outsiders_9ebcc1: "'I'm not like other outsiders... Ahchoo!"
  npc_override_que_ba_quests_morocc_i_m_looking_book_called_f2ed86: "I'm looking for a book called <The Crow of the Fate> written by Oliver Hilpert... Ahchoo!"
  npc_override_que_ba_quests_morocc_i_m_messenger_dispatched_72c8d3: "I'm a messenger dispatched here to {0} from the Morocc Continental Guard Headquarters. My duty is to deliver this important message to as many renowned adventurers as I can. I'm glad that I was finally able to find you, {1}."
  npc_override_que_ba_quests_morocc_i_m_messenger_morocc_con_112b02: "I'm a messenger from the Morocc Continental Guards Headquarters, and I've come here to {0} with an urgent message for everyone here in Rune-Midgarts Kingdom."
  npc_override_que_ba_quests_morocc_i_m_ready_accept_end_c5ba26: "But I'm ready to accept the end... Of everything..."
  npc_override_que_ba_quests_morocc_i_m_really_stressed_out_747301: "I'm really stressed out right now."
  npc_override_que_ba_quests_morocc_i_m_so_sorry_being_837b43: "I'm so sorry for not being much help."
  npc_override_que_ba_quests_morocc_i_m_sorry_i_m_8c4287: "I'm sorry, but I'm too busy checking through all these applications for future Continental Guards to greet you adventurers one by one."
  npc_override_que_ba_quests_morocc_i_m_sorry_inexperienced_9e4ea2: "I'm sorry, but inexperienced adventurers would just get in our way. I hope you understand. If you really want to help us, then please focus on your training for now."
  npc_override_que_ba_quests_morocc_i_m_sorry_you_ve_1f009a: "I'm sorry you've come this far for nothing."
  npc_override_que_ba_quests_morocc_i_m_stationed_here_assis_fc923e: "I'm stationed here to assist adventurers who wish to volunteer and help the Continental Guard fight Satan Morocc."
  npc_override_que_ba_quests_morocc_i_m_still_convinced_you_f3f082: "I'm still not convinced that you're good enough to join us. Let me think... Hmm..."
  npc_override_que_ba_quests_morocc_i_m_surprised_story_book_7fd215: "I'm surprised that the story in this book is... It's similar to my life story. Very similar."
  npc_override_que_ba_quests_morocc_i_m_talking_about_c4e0c4: "I'm talking about!"
  npc_override_que_ba_quests_morocc_i_no_longer_had_worry_cf520e: "I no longer had to worry about starving, but my life as a 'human' ended that day."
  npc_override_que_ba_quests_morocc_i_normal_man_once_povert_b205c1: "I was a normal man once, but poverty made me lose my pride, self-esteem, and identity."
  npc_override_que_ba_quests_morocc_i_only_serve_two_175854: "I only serve two"
  npc_override_que_ba_quests_morocc_i_problem_1ecc63: "I have a problem...."
  npc_override_que_ba_quests_morocc_i_really_need_read_book_261940: "I really need to read that book and tell her that I'm here for her, but I don't even have the time to regain my breath because of this situation in our hands!"
  npc_override_que_ba_quests_morocc_i_really_want_buy_your_1267b2: "I really want to buy your book!"
  npc_override_que_ba_quests_morocc_i_remember_mr_zid_saying_c4d8f1: "I remember Mr. Zid saying Eva had left a black feather behind her."
  npc_override_que_ba_quests_morocc_i_riding_carriage_last_n_0e4377: "- I was riding a carriage last night, and found you lying in the street. My name is Haeji. You may call me Mr. Haeji, son.-"
  npc_override_que_ba_quests_morocc_i_said_go_away_you_391a83: "I said go away, you stupid bird!"
  npc_override_que_ba_quests_morocc_i_see_keep_up_your_3413a3: "I see. Keep up your good work in fighting Satan Morocc. Don't forget that the future of the continent is in our hands."
  npc_override_que_ba_quests_morocc_i_see_well_then_your_f94ee7: "I see. Well then, for your safety, please leave this dangerous area as soon as possible."
