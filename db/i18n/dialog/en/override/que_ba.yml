  npc_override_que_ba_quests_morocc_looks_like_you_came_some_ced4ad: "Looks like you came for some reasons, but don't even dream of getting my help, meow!!"
  npc_override_que_ba_quests_morocc_looks_like_you_t_afford_c5b9ca: "it looks like you can't afford"
