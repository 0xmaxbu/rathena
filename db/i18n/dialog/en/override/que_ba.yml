  npc_override_que_ba_quests_morocc_i_strongly_recommend_you_0f370d: "I strongly recommend that you just think about your own safety for now. When the final battle comes, I am sure that no place will be safe."
  npc_override_que_ba_quests_morocc_i_strongly_resent_my_fat_a2961b: "I strongly resent my fate..."
  npc_override_que_ba_quests_morocc_i_t_believe_happening_88a939: "I can't believe this is happening!"
  npc_override_que_ba_quests_morocc_i_t_give_you_anything_089fcf: "I can't give you anything"
  npc_override_que_ba_quests_morocc_i_t_leave_him_here_917ce8: "-I can't leave him here!-"
  npc_override_que_ba_quests_morocc_i_think_when_crow_hit_d69b01: "I think when the crow was hit by the pebble, its wisdom must have turned into disaster."
  npc_override_que_ba_quests_morocc_i_think_you_ve_dropped_ac4ea5: "I think you've dropped this."
  npc_override_que_ba_quests_morocc_i_told_great_writers_usu_a02e77: "I was told great writers usually find their inspiration from their dreams. I guess I was born to be one of them. Hahaha!"
  npc_override_que_ba_quests_morocc_i_trying_drive_away_beca_a8cce3: "I was trying to drive it away because... It feels ominous somehow."
