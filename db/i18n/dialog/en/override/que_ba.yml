  npc_override_que_ba_quests_morocc_i_m_afraid_you_so_3a98c2: "I'm not afraid of you, so bring it on!"
  npc_override_que_ba_quests_morocc_i_m_going_see_her_2431c7: "I'm going to see her tomorrow as soon as the morning comes! Mammi, I'm coming!"
