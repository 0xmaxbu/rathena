  npc_override_que_ba_quests_morocc_i_ve_got_nothing_say_e4be85: "I've got nothing to say if this's about the request sent to each guild."
  npc_override_que_ba_quests_morocc_i_ve_got_perfect_thing_2a2c06: "I've got the perfect thing to help you appeal to Mammi. Do you want to see?"
