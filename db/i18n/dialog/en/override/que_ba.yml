  npc_override_que_ba_quests_morocc_look_around_they_witness_b31e8a: "Look around! They are the witnesses of mankind. And everyday, we have new ones joining them."
  npc_override_que_ba_quests_morocc_look_i_understand_your_e_9c5646: "Look, I understand your enthusiasm, but you're mistaken if you think you can help us. I don't have time to fully explain the danger that we're all facing."
  npc_override_que_ba_quests_morocc_look_s_picture_book_mamm_fe3edc: "Look, it's the picture book of Mammi I told you about."
  npc_override_que_ba_quests_morocc_looking_lustrous_feather_bb72eb: "Looking at the lustrous feather somehow made you feel so happy, as if you had obtained treasure.^000000"
  npc_override_que_ba_quests_morocc_looks_like_cover_s_round_d85567: "Looks like the cover's rounded with a red strap,"
