  npc_override_que_ba_quests_morocc_i_ve_no_doubt_if_3f4ee0: "I've no doubt that if left unchecked, Satan Morocc will take over the entire Midgard Continent. We've got to stop him right now before the entire world suffers."
  npc_override_que_ba_quests_morocc_i_ve_prepared_few_things_843953: "I've prepared a few things to give as a reward for you. Let's see... I have three items. Which one do you like to receive?"
  npc_override_que_ba_quests_morocc_i_ve_read_his_trace_3924d3: "I've read his <The Trace of the Fate> at least several times. I mean, that book is so captivating that I can never get tired of reading it."
  npc_override_que_ba_quests_morocc_i_wonder_if_he_threw_bc98e9: "I wonder if he threw rocks at crows like the library master..."
  npc_override_que_ba_quests_morocc_if_i_another_dream_i_719094: "If I have another dream, I'll deal with it then~"
  npc_override_que_ba_quests_morocc_if_i_want_read_news_af9aab: "If I want to read news articles about fires, which section should I go to?"
  npc_override_que_ba_quests_morocc_if_oliver_dreaming_exact_7d9241: "If Oliver was dreaming exactly the same things as you, that might mean he and you are sharing dreams. Then again, you've discovered the cave village in the book actually exists."
  npc_override_que_ba_quests_morocc_if_you_been_invited_our_9af9ef: "If you have been invited by our messenger, or are confident in your skills, we encourage you to volunteer for the Continental Guards and bring peace back to this continent."
  npc_override_que_ba_quests_morocc_if_you_d_like_i_26f66c: "If you'd like, I can send you there directly."
  npc_override_que_ba_quests_morocc_if_you_d_like_know_cb6057: "If you'd like to know more information, I suggest that you speak to the Continental Guard in charge of the accident site in Morocc Village."
  npc_override_que_ba_quests_morocc_if_you_don_t_really_bb21e0: "If you don't really like that book, why don't you sell it to me?"
  npc_override_que_ba_quests_morocc_if_you_help_me_i_8b9085: "If you help me, I'll show you a limited picture book edition of Mammi... Once. Hehehehe."
