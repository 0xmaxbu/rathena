  npc_override_que_ba_quests_morocc_i_believe_she_s_reincarn_2e6dc2: "I believe she's the reincarnation of the Wisdom Goddess who was expelled to the Midgard Continent by jealous goddesses."
  npc_override_que_ba_quests_morocc_i_d_better_give_him_5a39d2: "I'd better give him this note back."
  npc_override_que_ba_quests_morocc_i_didn_t_think_you_2dac5e: "I didn't think you would accept me so easily. I'm ready. Ask me whatever you want."
  npc_override_que_ba_quests_morocc_i_don_t_care_what_6ed057: "I don't care what you say, I'm coming in!!!"
  npc_override_que_ba_quests_morocc_i_don_t_know_why_93cc1c: "I don't know why, but... I believe Eva no longer exists..."
  npc_override_que_ba_quests_morocc_i_don_t_time_go_64ba87: "I don't have time for this! Go away!"
  npc_override_que_ba_quests_morocc_i_feel_so_excited_think_7de9cb: "I feel so excited to think about having a deep conversation with Mammi about literature! Yay!"
  npc_override_que_ba_quests_morocc_i_flew_over_rune_midgart_1d2087: "I flew over to the Rune-Midgarts Kingdom on the earliest airship"
  npc_override_que_ba_quests_morocc_i_found_giant_black_feat_17f395: "I found ^3131FFa giant black feather^000000 in her room after she left."
  npc_override_que_ba_quests_morocc_i_goal_achieve_here_ahch_6bbf2a: "I have a goal to achieve in here... Ahchoo!"
  npc_override_que_ba_quests_morocc_i_going_charge_you_c7eb0f: "I was going to charge you"
  npc_override_que_ba_quests_morocc_i_got_book_him_as_621573: "I got that book from him as a gift. He may have more rare books of her... Ahchoo!"
  npc_override_que_ba_quests_morocc_i_guarantee_you_d_just_d0f2cd: "I guarantee that you'd just drag my soldiers down with you. You'd only be a threat to Satan Morocc in your dreams. Just give it up."
  npc_override_que_ba_quests_morocc_i_guess_everyone_make_be_5fc2d7: "I guess not everyone can make bestselling books, huh?"
  npc_override_que_ba_quests_morocc_i_guess_he_won_t_e548b6: "I guess he won't be able to see or hear me, just like the others."
  npc_override_que_ba_quests_morocc_i_guess_s_just_old_e70b5d: "I guess it's just an old memory... Why should I care? Why should anyone?"
  npc_override_que_ba_quests_morocc_i_guess_s_stupid_idea_dd2699: "I guess it's a stupid idea."
  npc_override_que_ba_quests_morocc_i_guess_so_630c8f: "I guess so."
  npc_override_que_ba_quests_morocc_i_guess_you_d_benefit_29aa85: "I guess you'd benefit from a full situational briefing. Shall I brief you now?"
  npc_override_que_ba_quests_morocc_i_guess_you_seriously_wo_38747f: "I guess you seriously wounded Satan Morocc, and it retreated to a time-space gap. No doubt it's trying to recoup its strength."
  npc_override_que_ba_quests_morocc_i_gurantee_you_you_ll_185dd1: "I gurantee you that you'll get better quickly."
  npc_override_que_ba_quests_morocc_i_happened_hear_monsters_3b872b: "I happened to hear that the monsters in the Lava Dungeon have everlasting flame which would solve our bonfire problems. I want you to gather those flames for us."
  npc_override_que_ba_quests_morocc_i_haven_t_had_chance_32fe73: "I haven't had a chance to open it, but my publisher said it has something very rare inside. I hope that it's enough to pay you for your book."
  npc_override_que_ba_quests_morocc_i_hope_you_keep_mind_eff268: "I hope you keep in mind that our battle is far from over. Our enemy is the king of demons... I fear that Satan Morocc will return someday soon."
  npc_override_que_ba_quests_morocc_i_hope_you_ll_also_c17c97: "I hope you'll also like my next book. Then I must go... Thank you for the picture book!"
  npc_override_que_ba_quests_morocc_i_i_don_t_know_e2aa17: "I... I don't know how to apologize..."
  npc_override_que_ba_quests_morocc_i_i_see_d75a32: "I... I see..."
  npc_override_que_ba_quests_morocc_i_just_told_you_0b337a: "I just told you"
  npc_override_que_ba_quests_morocc_i_just_want_know_out_3e4db0: "...I just want to know it out of curiosity...^000000'"
  npc_override_que_ba_quests_morocc_i_knew_d_too_tough_ba4704: "I knew that'd be too tough for you. I'm glad you finally realized your limits before it was too late. It takes wisdom to recognize your weakness."
