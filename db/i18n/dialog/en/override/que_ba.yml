  npc_override_que_ba_quests_morocc_if_you_really_want_enter_1b83dd: "If you really want to enter,"
  npc_override_que_ba_quests_morocc_if_you_really_want_read_1edaed: "If you really want to read the book, you should try Juno Library."
  npc_override_que_ba_quests_morocc_if_you_say_so_thank_865e64: "If you say so, thank you for your understanding."
  npc_override_que_ba_quests_morocc_if_you_want_i_ll_376c0e: "If you want, I'll recommend"
