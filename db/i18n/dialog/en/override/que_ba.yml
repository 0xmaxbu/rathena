  npc_override_que_ba_quests_morocc_luckily_feather_gone_so_b01646: "Luckily the feather is gone, so hopefuly I won't suffer any more disaster."
  npc_override_que_ba_quests_morocc_maaaammmiii_44a685: "Maaaammmiii!"
  npc_override_que_ba_quests_morocc_macmillan_s_post_worksho_36f439: "MacMillan's ^3355FFPost^000000 Workshop."
  npc_override_que_ba_quests_morocc_main_character_writer_s_e42406: "The main character is a writer, and it's so touching that this guy writes a story of his mistress..."
  npc_override_que_ba_quests_morocc_main_reason_because_sata_734b30: "The main reason for this is because Satan Morocc has been sighted in Sograt Desert, but there's another important reason."
  npc_override_que_ba_quests_morocc_make_sure_0cc2e3: "Make sure that this"
  npc_override_que_ba_quests_morocc_make_sure_you_cash_348951: "make sure you have the cash!"
