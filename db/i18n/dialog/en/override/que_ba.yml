Body:
  npc_override_que_ba_quests_morocc_about_his_fiancee_sake_h_2670a1: "about his fiancee for the sake of her safety."
  npc_override_que_ba_quests_morocc_accessory_980944: "Accessory!"
  npc_override_que_ba_quests_morocc_according_employee_reken_d570de: "According to an employee of Rekenber Corporation,"
  npc_override_que_ba_quests_morocc_according_juno_soldier_a_6c2e6b: "According to the Juno soldier that arrested them,"
  npc_override_que_ba_quests_morocc_adventurer_you_must_enth_749e5b: "Adventurer, you must be an enthusiastic fan of her as well. Where did you find this rare picture book?"
  npc_override_que_ba_quests_morocc_after_all_god_trifled_me_1aa84f: "After all, God has trifled with me..."
  npc_override_que_ba_quests_morocc_after_hours_later_since_8b8317: "After 6 hours later since the death time, it will be reset."
  npc_override_que_ba_quests_morocc_again_later_meow_4878db: "again later, meow?"
  npc_override_que_ba_quests_morocc_ah_ahchoo_726c52: "Ah... Ahchoo!"
  npc_override_que_ba_quests_morocc_ah_ahchoo_mr_hilpert_you_0decb7: "Ah... Ahchoo! Mr. Hilpert, are you interested in my bag? It's just a simple bag I got from the Novice Training Grounds..."
  npc_override_que_ba_quests_morocc_ah_i_remember_one_s_dbeecb: "Ah, I remember that one... It's the one most frequently left in the cart."
  npc_override_que_ba_quests_morocc_ah_i_see_df4b54: "Ah, I see."
  npc_override_que_ba_quests_morocc_ah_i_think_you_re_c36b8e: "Ah.. I think you're little too late."
  npc_override_que_ba_quests_morocc_ah_i_ve_got_idea_ce0145: "Ah, I've got an idea. Now, because this is an allied operation, we've accepted some mercenary soldiers from the Schwarzwald Republic to join the Continental Guard."
  npc_override_que_ba_quests_morocc_ah_look_picture_her_wear_692f8a: "Ah... Look at this picture of her wearing the rolled-up puppy ears! Doesn't she look like a sad puppy wandering Comodo, the City of Lovers, all by herself?!"
  npc_override_que_ba_quests_morocc_ah_luckily_there_s_one_0fe8ff: "Ah, luckily there's one... Ahchoo!"
  npc_override_que_ba_quests_morocc_ah_mammi_e34959: "Ah... Mammi..."
  npc_override_que_ba_quests_morocc_ah_one_best_sellers_josh_242b6b: "Ah! This is one of the best sellers of Joshua Vansei's."
  npc_override_que_ba_quests_morocc_ah_place_protected_5bae07: "Ah, that place is protected"
  npc_override_que_ba_quests_morocc_ah_very_well_i_extremely_5bc41f: "Ah, very well. I have an extremely important message for you."
  npc_override_que_ba_quests_morocc_ah_why_i_m_love_9397f4: "Ah... This is why I'm in love with Lady Mammi."
  npc_override_que_ba_quests_morocc_ah_you_re_adventurer_wor_b831c4: "Ah, you're an adventurer working for the Continental Guard. Nice to meet you. Feel free to ask me if you need my assistance."
  npc_override_que_ba_quests_morocc_ahchoo_ahchoo_gosh_ad1f21: "Ahchoo! Ahchoo! Gosh..."
  npc_override_que_ba_quests_morocc_ahchoo_fef93b: "...Ahchoo!"
  npc_override_que_ba_quests_morocc_ahchoo_thanks_you_i_coul_a4e406: "Ahchoo! Thanks to you, I couldn't find it from the library. So I travelled all the way up to Schwarzwald... Ahchoo!"
  npc_override_que_ba_quests_morocc_ahchoo_you_also_mammi_fa_3de605: "Ahchoo! Are you also a Mammi fan?"
  npc_override_que_ba_quests_morocc_ain_t_0070c0: "Ain't that"
  npc_override_que_ba_quests_morocc_al_8e04c9: "-......Al.-"
  npc_override_que_ba_quests_morocc_all_b2ff06: "Not at all."
  npc_override_que_ba_quests_morocc_all_because_dude_called_b78ea6: "Is this all because of that dude called Raiyan Moore or More.. or.. blar?"
  npc_override_que_ba_quests_morocc_all_death_suffering_anyw_06f5c1: "All of the death and suffering... Anywhere else must seem like heaven compared to what's happening in and around Morocc."
  npc_override_que_ba_quests_morocc_all_i_m_asking_check_b9d9a8: "All I'm asking is to check out a book from Prontera Library for me. It sounds easy, doesn't it?"
  npc_override_que_ba_quests_morocc_all_requests_cancelled_t_f5eb84: "All the requests were cancelled and there's nothing left for you to do."
  npc_override_que_ba_quests_morocc_all_these_books_piled_up_59aa5a: "All these books piled up in the cart make me feel so frustrated, you know? Sigh..."
  npc_override_que_ba_quests_morocc_allowed_here_2f0286: "allowed to be in here."
  npc_override_que_ba_quests_morocc_almost_done_then_you_bro_d503a9: "It was almost done, but then you broke all of them -- even ^FF00FFBEEP^000000 and ^FF00FFBEEP^000000 -- and were hiding in here."
  npc_override_que_ba_quests_morocc_already_lucky_here_e96ca0: "already lucky to be here."
  npc_override_que_ba_quests_morocc_alright_17187c: "Alright."
  npc_override_que_ba_quests_morocc_alright_how_about_8c0cb9: "Alright, how about this?"
  npc_override_que_ba_quests_morocc_alright_let_me_see_7feaab: "Alright, let me see..."
  npc_override_que_ba_quests_morocc_alright_you_come_b11b68: "Alright, you can come"
  npc_override_que_ba_quests_morocc_also_bestseller_2bf95b: "That was also a bestseller."
  npc_override_que_ba_quests_morocc_also_female_assistant_tu_2264ed: "Also, the female assistant turned into a crow flying away, and then the crow feather made me sneeze and cough."
  npc_override_que_ba_quests_morocc_also_informed_us_they_639610: "and also informed us that they are"
  npc_override_que_ba_quests_morocc_although_you_bit_intimid_4cc376: "^660000Although you a bit intimidated by this guard, and your sneezing definitely not helping, you continue.^000000"
  npc_override_que_ba_quests_morocc_although_you_re_bit_inti_cede9c: "^660000Although you're a bit intimidated by this guard, and your sneezing definitely not helping, you continue.^000000"
  npc_override_que_ba_quests_morocc_ancient_weapon_some_kind_dc46d3: "^3131FFAncient weapon = Some kind of power source^000000"
  npc_override_que_ba_quests_morocc_anyway_thank_you_coming_4e0f6d: "Anyway, thank you for coming by 'MacMillan's Workshop.' But think about buying something next time, will ya?"
  npc_override_que_ba_quests_morocc_anyways_thank_you_bringi_b2a182: "Anyways, thank you for bringing the Live Coals. I guess you're stronger than I thought."
  npc_override_que_ba_quests_morocc_area_meow_if_you_don_486607: "area, meow! If you don't"
  npc_override_que_ba_quests_morocc_argggghhhhhhh_412544: "Argggghhhhhhh!!"
  npc_override_que_ba_quests_morocc_argh_43ffb4: "Argh!"
  npc_override_que_ba_quests_morocc_argh_658e94: "Argh..."
  npc_override_que_ba_quests_morocc_argh_all_because_library_8cb15e: "Argh, that was all because of the library master!"
  npc_override_que_ba_quests_morocc_argh_i_t_breathe_i_33e38a: "Argh... I can't breathe... I have to get out..."
  npc_override_que_ba_quests_morocc_as_i_told_you_earlier_56b3ee: "As I told you earlier, it's something I'm willing to cross continents to get. Please?"
  npc_override_que_ba_quests_morocc_as_soon_as_he_finished_586464: "^660000As soon as he finished, he returned to escaping reality by indulging himself in his dreams of Mammi.^000000"
  npc_override_que_ba_quests_morocc_as_soon_as_he_talked_560622: "^660000As soon as he talked to you, he went back to his writing and became completely absorbed in his work.^000000"
  npc_override_que_ba_quests_morocc_as_soon_as_news_spread_89ea94: "As soon as the news spread,"
  npc_override_que_ba_quests_morocc_as_soon_as_you_heard_0428e5: "^660000As soon as you heard her voice,"
  npc_override_que_ba_quests_morocc_as_you_left_library_you_0aeedb: "^660000As you left the library, you thought that thinking Mr. Oliver is your half would be a better idea.^000000"
  npc_override_que_ba_quests_morocc_as_you_see_situation_t_970e4f: "As you can see, the situation can't be worse. The village and the surrounding area were irreparably damaged by Satan Morocc's resurrection."
  npc_override_que_ba_quests_morocc_ask_you_enjoy_106a9e: "ask you for 800. Enjoy it,"
  npc_override_que_ba_quests_morocc_assassins_i_charge_f7cb9c: "For Assassins, I charge"
  npc_override_que_ba_quests_morocc_assassins_must_live_alon_3a0308: "Assassins must live alone under the shadows.'"
  npc_override_que_ba_quests_morocc_awed_time_space_gap_wher_6c0079: "Awed by the time-space gap where darkness is given life, you instinctively step back."
  npc_override_que_ba_quests_morocc_baaaadddd_279da8: "Baaaadddd !!"
  npc_override_que_ba_quests_morocc_bar_another_living_soul_b49f65: "bar to another living soul."
  npc_override_que_ba_quests_morocc_because_only_book_leanin_58da13: "because it was the only book leaning against the wall of an empty shelf.^000000"
  npc_override_que_ba_quests_morocc_been_already_passed_minu_ba0cee: "It has been already passed 30 minutes after Morocc's death, so warriors can not continue the quest even if they click the Time Space Gap."
  npc_override_que_ba_quests_morocc_been_especially_made_e4437e: "been especially made"
  npc_override_que_ba_quests_morocc_beep_e42d9b: "^FF0000-- BEEP --^000000"
  npc_override_que_ba_quests_morocc_behalf_continental_guard_742df1: "On behalf of the Continental Guard, I thank you for your efforts. Now, let me see if I've received any news from Headquarters that you should know..."
  npc_override_que_ba_quests_morocc_believe_what_i_just_said_15b51f: "believe what I just said?"
  npc_override_que_ba_quests_morocc_benjamin_seems_huge_fan_f982e2: "^660000This Benjamin seems to be a huge fan of a female celebrity called Mammi. He didn't shut his mouth and worshipped her beauty for a while, but then he suddenly stopped and looked depressed.^000000"
  npc_override_que_ba_quests_morocc_besides_first_things_fir_b0054c: "Besides, first things first. The restoration work for the city is the most urgent."
  npc_override_que_ba_quests_morocc_binoculars_803d8e: "Binoculars !"
  npc_override_que_ba_quests_morocc_blame_hot_weather_people_0c075d: "Blame the hot weather, people!"
  npc_override_que_ba_quests_morocc_book_become_so_popular_y_6d7ec2: "The book has become so popular that you can't even find it from Schwarzwald, the author's country."
  npc_override_que_ba_quests_morocc_book_interesting_i_m_sur_85cb94: "The book was interesting, but I'm sure that guy, Oliver, experienced the same thing that happened to you."
  npc_override_que_ba_quests_morocc_book_isn_t_you_you_13c79d: "^660000The book isn't for you, but you believe in 100% customer satisfaction. Let's go to Juno Library now.^000000"
  npc_override_que_ba_quests_morocc_book_s_cover_seriously_d_3447fe: "^660000The book's cover was seriously damaged, considering its recent publishing date. Many people must have turned its pages.^000000"
  npc_override_que_ba_quests_morocc_book_soon_selected_as_es_975ac8: "This book will be soon selected as an essential academic book of"
  npc_override_que_ba_quests_morocc_books_tagged_as_bestsell_e51575: "^660000Books tagged as 'Bestseller of The Month' are stored in the middle of the shelf that's at your eye level.^000000"
  npc_override_que_ba_quests_morocc_books_telling_exact_scen_c2261c: "^660000The books was telling the exact scene that you have seen in your dream.^000000"
  npc_override_que_ba_quests_morocc_bowwow_fb7b67: "Bowwow!"
  npc_override_que_ba_quests_morocc_boy_ran_away_when_he_07064f: "That boy ran away when he was about 10. I guess he hit puberty... You know boys and girls at that age."
  npc_override_que_ba_quests_morocc_boys_show_guy_door_684bbf: "Boys, show this guy the door!!"
  npc_override_que_ba_quests_morocc_breathe_word_about_172de0: "breathe a word about this"
  npc_override_que_ba_quests_morocc_built_test_duplicate_god_581768: "It was built to test and duplicate God's power of creation."
  npc_override_que_ba_quests_morocc_buy_water_here_oh_boy_b5e47a: "buy water here. Oh boy..."
  npc_override_que_ba_quests_morocc_care_drink_cd3409: "Care for a drink?"
  npc_override_que_ba_quests_morocc_careful_catch_cold_eb305d: "Be careful to not catch cold!"
  npc_override_que_ba_quests_morocc_careless_behavior_seems_e5c74f: "careless behavior, and it seems"
  npc_override_que_ba_quests_morocc_cause_accident_04d6b3: "the cause of the accident."
  npc_override_que_ba_quests_morocc_clear_out_your_inventory_bc5468: "Clear out your inventory!"
  npc_override_que_ba_quests_morocc_cold_up_there_i_guess_852a72: "Was it cold up there? I guess it is since Schwarzwald is located up north from here."
  npc_override_que_ba_quests_morocc_come_what_38fb2b: "Come on, what are"
  npc_override_que_ba_quests_morocc_contaminating_nature_so_d6c030: "that are contaminating nature so that she can purify the water."
  npc_override_que_ba_quests_morocc_continental_guard_been_f_642aab: "The Continental Guard has been on full alert around this village and the desert. We need to be prepared in case Satan Morocc storms our defenses."
  npc_override_que_ba_quests_morocc_continental_guard_curren_a44291: "The Continental Guard is currently planning an array of countermeasures to suppress Satan Morocc under the order of the kingdom."
  npc_override_que_ba_quests_morocc_continental_guard_headqu_53b3b0: "The Continental Guard Headquarters is located near the center palace of Morocc, so please go speak to the chief as soon as you can."
  npc_override_que_ba_quests_morocc_continental_guards_769a5d: "^3131FF<Continental Guards>^000000"
  npc_override_que_ba_quests_morocc_cough_cough_908a66: "Cough, cough!"
  npc_override_que_ba_quests_morocc_cough_fire_cough_f3b0da: "Cough! Fire... Cough!"
  npc_override_que_ba_quests_morocc_cough_i_m_looking_book_0cabc3: "Cough... I'm looking for a book called <The Crow of the Fate> written by Oliver Hilpert."
  npc_override_que_ba_quests_morocc_cough_no_i_m_fa_0b471c: "Cough, no, I'm not a fa..."
  npc_override_que_ba_quests_morocc_could_you_please_leave_m_362e78: "Could you please leave me alone? I have a bad headache."
  npc_override_que_ba_quests_morocc_countless_number_books_f_e1968b: "^660000The countless number of books filling this room tell you why this place is called the Greatest Library of Juno, the City of Scholars.^000000"
  npc_override_que_ba_quests_morocc_course_just_dream_still_1cc74f: "^660000Of course, it was just a dream, but still was a very mysterious experience.^000000"
  npc_override_que_ba_quests_morocc_course_ll_incredibly_dif_17d5c3: "Of course, it'll be incredibly difficult... We'll need to make sacrifices... I'm not even sure if we can win. Still, the fate of the world is at stake, and we've got to do something. Dark times have truly fallen upon us..."
  npc_override_que_ba_quests_morocc_crow_fate_498053: "^660000The Crow of the Fate^000000?"
  npc_override_que_ba_quests_morocc_crow_fate_c95fbd: "<The Crow of the Fate>^000000!"
  npc_override_que_ba_quests_morocc_crow_fate_sold_out_even_9a99e6: "^3131FFThe Crow of the Fate^000000 was sold out even before we got a hold of one copy. You won't be able to find the book anywhere in the Rune-Midgarts Kingdom."
  npc_override_que_ba_quests_morocc_crumbling_12218a: "- Crumbling -"
  npc_override_que_ba_quests_morocc_culture_page_37cc58: "- Culture Page -"
  npc_override_que_ba_quests_morocc_current_state_ea4b11: "Current State"
  npc_override_que_ba_quests_morocc_damage_satan_morocc_s_re_a593bc: "The damage that Satan Morocc's resurrection has caused is obvious just by taking a look around this area."
  npc_override_que_ba_quests_morocc_day_tao_really_wanted_bi_19fc96: "That day, Tao really wanted a Big Ribbon, meow."
  npc_override_que_ba_quests_morocc_deeply_as_you_life_419ea9: "deeply as you would life."
  npc_override_que_ba_quests_morocc_deja_vu_am_i_having_2c8c6d: "Deja Vu? Am I having Deja Vu?"
  npc_override_que_ba_quests_morocc_demanding_you_must_encas_0712e3: "demanding that you must encase the book so it would not be damaged.^000000"
  npc_override_que_ba_quests_morocc_desert_around_morocc_als_9f8e06: "The desert around Morocc has also turned into a land of death after it was claimed by Satan Morocc and his powerful doppelgangers and underlings."
  npc_override_que_ba_quests_morocc_did_you_change_your_mind_93bd4a: "Did you change your mind about selling Lady Mammi's picture book to me?"
  npc_override_que_ba_quests_morocc_did_you_just_say_eva_e506bb: "Did you just say Eva?"
  npc_override_que_ba_quests_morocc_did_you_notice_our_villa_2ef5a4: "Did you notice that our villagers look different?"
  npc_override_que_ba_quests_morocc_didn_t_you_just_call_71a37a: "^660000Didn't you just call me an adventurer that runs around on meaningless errands for others...?^000000"
  npc_override_que_ba_quests_morocc_didn_t_you_know_satan_d5b010: "Didn't you know? Satan Morocc has resurrected and broke out of Morocc Village where he was confined."
  npc_override_que_ba_quests_morocc_die_haha_e50ba0: "Die? ...Haha."
  npc_override_que_ba_quests_morocc_difficult_find_crow_fate_f77441: "^660000It was not that difficult to find 'The Crow of the Fate'"
  npc_override_que_ba_quests_morocc_disabled_enter_moc_fild_65ac8e: "Disabled to enter to moc_fild21 from outside of the field."
  npc_override_que_ba_quests_morocc_disgrace_me_3b4a93: "disgrace me!!!"
  npc_override_que_ba_quests_morocc_dog_barking_loudly_front_f88d97: "^660000A dog is barking loudly at the front of the library.^000000"
  npc_override_que_ba_quests_morocc_don_t_ever_low_estimate_6df2e0: "Don't ever low estimate, meow!"
  npc_override_que_ba_quests_morocc_don_t_look_my_face_489174: "Don't look at my face..."
  npc_override_que_ba_quests_morocc_don_t_peep_something_you_3afaa2: "Don't peep at something you shouldn't look at. Well, at least try not to."
  npc_override_que_ba_quests_morocc_don_t_you_better_things_ff60b8: "Don't you have better things to do? You'd better go to the shelter and save your ass."
  npc_override_que_ba_quests_morocc_don_t_you_dare_706bf3: "on in. But don't you dare"
  npc_override_que_ba_quests_morocc_don_t_you_enjoy_drink_b494e9: "don't you enjoy a drink?"
  npc_override_que_ba_quests_morocc_don_t_you_think_you_dd7ec3: "Don't you think you're little too late?"
  npc_override_que_ba_quests_morocc_dream_10b583: "Dream?"
  npc_override_que_ba_quests_morocc_dream_again_d7f191: "A dream again."
  npc_override_que_ba_quests_morocc_dream_f1ef44: "Was it a dream?"
  npc_override_que_ba_quests_morocc_dream_seems_pretty_meani_d02709: "This dream seems pretty meaningful somehow."
  npc_override_que_ba_quests_morocc_dreamy_eyes_man_looking_a13c2b: "With dreamy eyes, the man is looking down at a book in his hand."
  npc_override_que_ba_quests_morocc_drink_if_you_don_t_e9b932: "to drink if you don't have"
  npc_override_que_ba_quests_morocc_drinks_if_you_want_40db59: "drinks. If you want"
  npc_override_que_ba_quests_morocc_due_dangers_area_i_hereb_beabb2: "'Due to the dangers of this area, I hereby prohibit members of the Continental Guard to investigate the area alone. You must organize a party of at least 2 members to carry out your missions from now on.'"
  npc_override_que_ba_quests_morocc_due_time_space_gaps_sogr_1c2e07: "Due to the time-space gaps, Sograt Desert's terrain has changed, and some parts of the desert have disappeared."
  npc_override_que_ba_quests_morocc_e_eva_no_a4e91b: "E...Eva, no!"
  npc_override_que_ba_quests_morocc_each_book_tells_you_stor_6866ed: "Each book tells you a story of life, wisdom, happiness, and sensation."
  npc_override_que_ba_quests_morocc_eh_oh_i_m_sorry_ea1823: "Eh? Oh, I'm sorry, I was"
  npc_override_que_ba_quests_morocc_einbech_mine_collapsed_fc3331: "Einbech Mine Collapsed (2)"
  npc_override_que_ba_quests_morocc_else_you_could_oh_who_876754: "Or, else.... You could?.. Oh, who knows, meow.."
  npc_override_que_ba_quests_morocc_enable_enter_moc_fild_fi_1518d7: "Enable to enter to moc_fild21 field."
  npc_override_que_ba_quests_morocc_end_sooty_fog_chaotic_sc_429787: "<....at the end of the sooty fog and chaotic screams, there was a creature that looked too outrageous to be a human...>"
  npc_override_que_ba_quests_morocc_enjoy_your_victory_ever_ebe229: "Enjoy your victory, but be ever watchful and vigilant. I will always be here to help and reward you for your service."
  npc_override_que_ba_quests_morocc_enough_items_c2299e: "enough items!!!!"
  npc_override_que_ba_quests_morocc_enough_zeny_ae7fe8: "have enough zeny to"
  npc_override_que_ba_quests_morocc_enter_0098bd: "to enter."
  npc_override_que_ba_quests_morocc_errr_9ab0ce: "Errr?!"
  npc_override_que_ba_quests_morocc_eva_couldn_t_forget_him_737e16: "Eva couldn't forget him. She was waiting for his return inside this dark cave. For a while, he was sending letters without his address, but then they stopped coming. That's when Eva disappeared."
  npc_override_que_ba_quests_morocc_eva_i_able_escape_before_41addb: "Eva and I were able to escape before we could be found, and then settled down here. After all, we can't just mingle with ordinary humans."
  npc_override_que_ba_quests_morocc_eva_managed_save_one_tes_517b94: "Eva managed to save one of the test subjects which actually grew up into a normal looking human, but he was actually perfect."
  npc_override_que_ba_quests_morocc_eva_one_them_although_sh_bdc8e0: "Eva was one of them... Although she wasn't kind, she at least sympathized for me because I sold myself out of poverty."
  npc_override_que_ba_quests_morocc_eva_we_don_t_time_0c2a67: "Eva!! We don't have time to save all of them! Come here!"
  npc_override_que_ba_quests_morocc_eva_we_won_t_die_1773b6: "^3131FF'Eva'^000000, we won't die... We were never exactly alive to begin with."
  npc_override_que_ba_quests_morocc_eva_what_you_doing_come_e3b94e: "<- Eva, what are you doing? Come over here! Hurry!-"
  npc_override_que_ba_quests_morocc_even_if_he_something_eva_a500fb: "Even if he has something to do with Eva, it's too late to do anything for her."
