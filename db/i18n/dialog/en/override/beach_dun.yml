Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_beach_dun_beach_dun_menu_ancient_11a5df: "Ancient Wootan Defender: Listen to all Wootans! Leave now and commit to the next one."
  npc_override_beach_dun_beach_dun_menu_ancient_18037b: "Ancient Tao Gunka: Is it time to show off your megalithic power?"
  npc_override_beach_dun_beach_dun_menu_ancient_189f7c: "Ancient Tao Gunka: We'll grow stronger as we unhook and step out into the world."
  npc_override_beach_dun_beach_dun_menu_ancient_31ce30: "Ancient Wootan Defender: Ugh.. Quite a dangerous wound.."
  npc_override_beach_dun_beach_dun_menu_ancient_b5b9d2: "Ancient Tao Gunka: Crouch. When you crouch, you megalith."
  npc_override_beach_dun_beach_dun_menu_ancient_c710f3: "Ancient Wootan Defender: You pushed me, a warrior of the Wootan tribe, this far. It's pretty good. It's a pity, but I'm going to step down now."
  npc_override_beach_dun_beach_dun_menu_ancient_f1e6e5: "Ancient Tao Gunka: Megaliths, it's time to crouch and hold your breath."
  npc_override_beach_dun_beach_dun_menu_ancient_faa3eb: "Ancient Wootan Defender: I guess I'll have to step in after all these useless guys."
