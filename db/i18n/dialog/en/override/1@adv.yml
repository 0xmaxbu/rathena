Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@adv_VillaofHighPriest_a_0a8a42: "..a.."
  npc_override_1@adv_VillaofHighPriest_adventurer_came_far_help_89cd18: "The adventurer came this far to help us."
  npc_override_1@adv_VillaofHighPriest_adventurer_didn_t_you_co_27f2ee: "adventurer... didn't you come alone?"
  npc_override_1@adv_VillaofHighPriest_adventurer_please_find_a_ca71b4: "Adventurer, please find another employee and ask him about the mansion."
  npc_override_1@adv_VillaofHighPriest_adventurer_please_let_me_af1757: "Adventurer, please let me know if the identity of the Twisted God is revealed after the investigation is complete."
  npc_override_1@adv_VillaofHighPriest_adventurers_always_seek_4c11e5: "Adventurers always seek strength."
  npc_override_1@adv_VillaofHighPriest_appears_several_villa_s_c36a81: "It appears that several of the Villa's employees are trapped inside."
  npc_override_1@adv_VillaofHighPriest_apply_7c4cb4: "Apply for '{0}'."
  npc_override_1@adv_VillaofHighPriest_atmosphere_so_heavy_i_co_28fb19: "The atmosphere was so heavy that I couldn't even ask."
  npc_override_1@adv_VillaofHighPriest_bagot_please_continue_ri_9cd3f7: "Bagot, please continue with the ritual."
  npc_override_1@adv_VillaofHighPriest_being_vessel_god_descend_4d6a56: "Being a vessel for God to descend on is no problem for this bar!"
  npc_override_1@adv_VillaofHighPriest_bow_down_feet_god_reborn_423500: "Bow down at the feet of God and be reborn as a servant of God!"
  npc_override_1@adv_VillaofHighPriest_chapel_been_sealed_off_18cc2e: "The chapel has been sealed off."
  npc_override_1@adv_VillaofHighPriest_chapel_reached_going_up_93a4a3: "The chapel can be reached by going up the central stairs and past the banquet hall."
  npc_override_1@adv_VillaofHighPriest_coming_far_normal_f2c785: "Coming this far is not normal."
  npc_override_1@adv_VillaofHighPriest_could_pope_359d7a: "Could it be the Pope?!"
  npc_override_1@adv_VillaofHighPriest_doesn_t_matter_93045b: "But it doesn't matter."
  npc_override_1@adv_VillaofHighPriest_don_t_worry_about_me_1b5517: "Don't worry about me. I'll stay near the door and leave immediately if it's dangerous."
  npc_override_1@adv_VillaofHighPriest_door_won_t_budge_4b4aa5: "The door won't budge."
  npc_override_1@adv_VillaofHighPriest_embryo_fell_out_331ae8: "This Embryo fell out."
  npc_override_1@adv_VillaofHighPriest_entrance_villa_key_entra_b3436a: "The entrance to the villa? The key is at the entrance."
  npc_override_1@adv_VillaofHighPriest_feels_like_strong_magica_0d097d: "It feels like a strong magical force is blocking the door."
  npc_override_1@adv_VillaofHighPriest_firmly_locked_door_6cbf4d: "Firmly Locked Door."
  npc_override_1@adv_VillaofHighPriest_first_all_you_adventurer_a3167d: "First of all, are you THE adventurer?"
  npc_override_1@adv_VillaofHighPriest_first_shall_we_get_some_1ac09e: "First, shall we get some information from the villa employees?"
  npc_override_1@adv_VillaofHighPriest_go_up_central_stairs_pas_efe922: "Go up the central stairs, pass the banquet hall, and you will reach the chapel."
  npc_override_1@adv_VillaofHighPriest_ha_didn_t_i_clearly_8a8c73: "Ha... didn't I clearly tell you to clear everything? Why are there still rats?"
  npc_override_1@adv_VillaofHighPriest_he_s_talent_you_don_62fca2: "He's a talent you don't want to miss."
  npc_override_1@adv_VillaofHighPriest_here_s_key_side_door_5ce83d: "Here's the key to the side door."
  npc_override_1@adv_VillaofHighPriest_here_s_proof_miracle_4b6bd7: "Here's the proof. Miracle~"
  npc_override_1@adv_VillaofHighPriest_hm_could_you_please_chec_483484: "Hm? Could you please check if the party leader has requested entrance to the villa?"
  npc_override_1@adv_VillaofHighPriest_how_about_joining_hands_33558d: "How about joining hands with us?"
  npc_override_1@adv_VillaofHighPriest_how_dare_you_017252: "How dare you!"
  npc_override_1@adv_VillaofHighPriest_how_rude_you_my_masterpi_74ef52: "How rude are you to my masterpiece?!"
  npc_override_1@adv_VillaofHighPriest_huh_73fef0: "Huh?"
  npc_override_1@adv_VillaofHighPriest_i_also_heard_someone_tel_737c7c: "I also heard someone tell me to leave a little while ago. Is this a sign of mass layoff!?"
  npc_override_1@adv_VillaofHighPriest_i_descend_being_form_god_4fcf34: "I will descend a being in the form of a god!"
  npc_override_1@adv_VillaofHighPriest_i_didn_t_think_you_148b8f: "I didn't think you were this fool."
  npc_override_1@adv_VillaofHighPriest_i_feel_sharp_presence_be_f9b4d4: "I feel a sharp presence beyond the central stairs."
  npc_override_1@adv_VillaofHighPriest_i_feel_unknown_magical_p_d751da: "I feel an unknown magical power."
  npc_override_1@adv_VillaofHighPriest_i_hope_you_live_forever_37e38f: "I hope you live forever~"
  npc_override_1@adv_VillaofHighPriest_i_ll_analysis_here_82f2cf: "I'll do the analysis here."
  npc_override_1@adv_VillaofHighPriest_i_ll_go_employee_80f589: "I'll go to that employee."
  npc_override_1@adv_VillaofHighPriest_i_ll_go_so_adventurer_b05084: "I'll go~ So adventurer? Hello~!"
  npc_override_1@adv_VillaofHighPriest_i_ll_guard_so_go_92e4aa: "I'll be on guard, so go in."
  npc_override_1@adv_VillaofHighPriest_i_m_worried_about_missin_053c27: "I'm worried about the missing piece of Ymir's heart."
  npc_override_1@adv_VillaofHighPriest_i_made_promise_so_i_d82888: "I made a promise, so I will keep it. Do you understand?"
  npc_override_1@adv_VillaofHighPriest_i_need_take_care_my_72486d: "I need to take care of my father, so let's get out of here."
  npc_override_1@adv_VillaofHighPriest_i_see_c52c6e: "I see."
  npc_override_1@adv_VillaofHighPriest_i_see_male_employee_over_147a5a: "I see a male employee over there."
  npc_override_1@adv_VillaofHighPriest_i_show_miracles_arrogant_6f24c3: "I will show miracles to the arrogant servants of Odin."
  npc_override_1@adv_VillaofHighPriest_i_spare_key_because_door_e1a28d: "I have a spare key because this is the door I usually use to deliver food."
  npc_override_1@adv_VillaofHighPriest_i_take_care_my_father_8fe596: "I will take care of my father."
  npc_override_1@adv_VillaofHighPriest_i_take_those_people_evac_cbf09e: "I will take those people and evacuate them."
  npc_override_1@adv_VillaofHighPriest_i_think_i_communicate_be_48ee5e: "I think I can communicate better than that stubborn guy."
  npc_override_1@adv_VillaofHighPriest_i_think_i_should_check_1f698b: "I think I should check to see if there are other employees and go up to the second floor."
  npc_override_1@adv_VillaofHighPriest_i_used_spare_key_4f449f: "I used a spare key."
  npc_override_1@adv_VillaofHighPriest_if_s_about_inciting_trou_a6bca2: "If it's about inciting trouble, what happened at the temple is enough."
  npc_override_1@adv_VillaofHighPriest_if_we_leave_like_all_6b9b0d: "If we leave it like this, all of these people will be disposed."
  npc_override_1@adv_VillaofHighPriest_if_you_companions_i_reco_d9e1a8: "If you have companions, I recommend going together."
  npc_override_1@adv_VillaofHighPriest_if_you_look_embryo_falle_67acc9: "If you look at the Embryo that has fallen, it must have been something created by someone named Bagot."
  npc_override_1@adv_VillaofHighPriest_if_you_re_ready_shall_798145: "If you're ready, shall I guide you to the villa?"
  npc_override_1@adv_VillaofHighPriest_if_you_re_stubborn_guy_298074: "If you're a stubborn guy, what do you mean?"
  npc_override_1@adv_VillaofHighPriest_if_you_try_go_down_69bc91: "If you try to go down the wrong path again, I have to stop him."
  npc_override_1@adv_VillaofHighPriest_indeed_c8b181: "Indeed..."
  npc_override_1@adv_VillaofHighPriest_investigate_chapel_somet_6abe58: "Investigate the chapel! Something definitely suspicious here!"
  npc_override_1@adv_VillaofHighPriest_k_f64a43: "k.."
  npc_override_1@adv_VillaofHighPriest_kind_name_talent_who_bec_46f7c3: "It was that kind of name. A talent who can become stronger if he just changes his old-fashioned personality."
  npc_override_1@adv_VillaofHighPriest_kyaaaaaaaaaaa_79949c: "Kyaaaaaaaaaaa-!"
  npc_override_1@adv_VillaofHighPriest_let_s_get_out_here_5ea330: "Let's get out of here first."
  npc_override_1@adv_VillaofHighPriest_like_temple_too_ef8466: "It was like that at the temple too."
  npc_override_1@adv_VillaofHighPriest_looks_doesn_t_look_like_1574a8: "From the looks of it, it doesn't look like you'll accept our offer huh."
  npc_override_1@adv_VillaofHighPriest_looks_like_they_blinded_b8611b: "It looks like they blinded my father too."
  npc_override_1@adv_VillaofHighPriest_lowly_servant_witnessed_c05625: "A lowly servant has witnessed the miracles of God!"
  npc_override_1@adv_VillaofHighPriest_magic_splendid_knight_al_e99548: "The magic of the splendid knight has already disappeared."
  npc_override_1@adv_VillaofHighPriest_meantime_i_kept_my_promi_4653b1: "In the meantime, I kept my promise because I let you live with ^4d4dffstrong taste^000000."
  npc_override_1@adv_VillaofHighPriest_memorial_dungeon_request_3c4dd9: "Memorial dungeon requests must be made as a party leader.^000000"
  npc_override_1@adv_VillaofHighPriest_memorial_event_215b18: "^4d4dff This is a memorial event."
  npc_override_1@adv_VillaofHighPriest_menu_a_0eb707: "A Being Called God: ..a.."
  npc_override_1@adv_VillaofHighPriest_menu_a_5892c7: "A Being Called God: kkigig...? kkigigi kkyahahahahahahaha!!"
  npc_override_1@adv_VillaofHighPriest_menu_a_7d0097: "A Being Called God: kkigigigi aaaaa!!!!"
  npc_override_1@adv_VillaofHighPriest_menu_a_84de34: "A Being Called God: kyahahahahahahaha!!"
  npc_override_1@adv_VillaofHighPriest_menu_a_98e1db: "A Being Called God: kkigigig kikikig kkigigig"
  npc_override_1@adv_VillaofHighPriest_menu_a_b149e3: "A Being Called God: ....."
  npc_override_1@adv_VillaofHighPriest_menu_a_c10c19: "A Being Called God: ...."
  npc_override_1@adv_VillaofHighPriest_menu_a_f515bc: "A Being Called God: ..We.."
  npc_override_1@adv_VillaofHighPriest_menu_a_f7b197: "A Being Called God: k..."
  npc_override_1@adv_VillaofHighPriest_menu_a_fc6624: "A Being Called God: kikikig kikikig ...."
  npc_override_1@adv_VillaofHighPriest_menu_amal_00c2ae: "Amal: Nonsense! Miriam, get out of the way!"
  npc_override_1@adv_VillaofHighPriest_menu_amal_0f55c4: "Amal: A lowly servant has witnessed the miracles of God!"
  npc_override_1@adv_VillaofHighPriest_menu_amal_35b3ba: "Amal: Oh.. .Oooh...! Beautiful Freyja... ! Are you my God?"
  npc_override_1@adv_VillaofHighPriest_menu_amal_48c0de: "Amal: They will personally witness Freyja's miracles. Bow down and be reborn as a servant of God!"
  npc_override_1@adv_VillaofHighPriest_menu_amal_51fac2: "Amal's Voice: Oh God--!!!"
  npc_override_1@adv_VillaofHighPriest_menu_amal_56fcba: "Amal: Oh... Frejya! Please punish these heretics!"
  npc_override_1@adv_VillaofHighPriest_menu_amal_61ab60: "Amal: ....? What's wrong my God? Your lowly servant is ready to hear the prophecy..."
  npc_override_1@adv_VillaofHighPriest_menu_amal_8beb98: "Amal: These abominable heretics somehow managed to come this far. But you will soon kneel before the Supreme Divinity."
  npc_override_1@adv_VillaofHighPriest_menu_amal_99d4ba: "Amal: I will show miracles to the arrogant servants of Odin. Bagot, please continue with the ritual."
  npc_override_1@adv_VillaofHighPriest_menu_amal_a9cabf: "Amal: ...Oh my... It can't be like this..."
  npc_override_1@adv_VillaofHighPriest_menu_amal_b60c79: "Amal: Oh.. .Oooh...! My beautiful Goddess Freyja... !"
  npc_override_1@adv_VillaofHighPriest_menu_amal_c9734d: "Amal: ...I don't feel any divine power...? why...?"
  npc_override_1@adv_VillaofHighPriest_menu_amal_dab5ae: "Amal: This can't be happening! Let go of me, Miriam!"
  npc_override_1@adv_VillaofHighPriest_menu_amal_f481b4: "Amal: How can God punish me, a loyal servant of Freyja?"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_0d4839: "Bagot: What? Did you save him? Did you see the priest? What did Baggot say? I said it would be possible."
  npc_override_1@adv_VillaofHighPriest_menu_bagot_500bd2: "Bagot: I hope you live forever~"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_511e8f: "Bagot: Are you afraid of my ability to even create a vessel for God to descend on?"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_5ed53b: "Bagot: Being a vessel for God to descend on is no problem for this bar!"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_62ebc8: "Bagot: Ta-da~ The essence of science and magic is right here!"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_718acd: "Bagot: Are you even listening? Schulang is a bit of a waste, but that's the end of his role."
  npc_override_1@adv_VillaofHighPriest_menu_bagot_992189: "Bagot: Are you THE adventurer? Would you like to take a look at my work?"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_a97ff7: "Bagot: You're not listening to me. Then what is it? Oh~! Yes, a miracle."
  npc_override_1@adv_VillaofHighPriest_menu_bagot_aacac9: "Bagot: What kind of sound is that?"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_b1b13a: "Bagot: Since I summoned your god as promised, I will take the Heart with me."
  npc_override_1@adv_VillaofHighPriest_menu_bagot_bb74ca: "Bagot: Wow... the way you talk.. such inspiration. Anyway, I made a promise, so I will keep it."
  npc_override_1@adv_VillaofHighPriest_menu_bagot_d24406: "Bagot: I have kept my promise since I have been able to live with the 'strong taste' for a while. So adventurer? Hello~!"
  npc_override_1@adv_VillaofHighPriest_menu_bagot_f87432: "Bagot: It feels great to be able to check the results of the experiment right away."
  npc_override_1@adv_VillaofHighPriest_menu_crying_8739f6: "Crying Voice: Oh my! Why are you like this! Help me!"
  npc_override_1@adv_VillaofHighPriest_menu_hans_2dcb9d: "Hans: Miss! Please take me with you!"
  npc_override_1@adv_VillaofHighPriest_menu_hans_380bad: "Hans: The atmosphere of the villa is unusual. All of the attendant priests were armed."
  npc_override_1@adv_VillaofHighPriest_menu_ira_1ad8b4: "Ira: They seem to be armed."
  npc_override_1@adv_VillaofHighPriest_menu_ira_2d0993: "Ira: Find the key to the 2nd floor banquet hall. There must be something beyond that!"
  npc_override_1@adv_VillaofHighPriest_menu_ira_59fe80: "Ira: Here it is. It should be okay since only users go to the first floor."
  npc_override_1@adv_VillaofHighPriest_menu_ira_a0c420: "Ira: Don't worry about me. Be careful, you two."
  npc_override_1@adv_VillaofHighPriest_menu_ira_f844bf: "Ira: Bunch of priests are staying there. I don't know if they're really a priest."
  npc_override_1@adv_VillaofHighPriest_menu_leader_4d6811: "Leader: {0}"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_0b8ec9: "Miriam: You just almost died. Look straight ahead. Which part of that vile being is God?"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_0bc322: "Miriam: Now there's screaming! What's happening?"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_1856ad: "Miriam: Adventurer, please enter first. Mr. Hans, let's go together."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_1eb772: "Miriam: Father!"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_232952: "Miriam: Adventurer, shall we all share our tasks?"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_283b73: "Miriam: Ira!!"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_39ea4b: "Miriam: It seems like you need to open your eyes. Father."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_518d1f: "Miriam: Adventurer! Please stop them! I'll take care of this and evacuate everyone!"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_530bcf: "Miriam: I'm worried about the missing Ymir's heart. What happened at the temple is enough."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_537212: "Miriam: Please leave this to me and deal with the Heart Hunter on the second floor."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_555464: "Miriam: Leave this to me and take care of the Heart Hunter on the 2nd floor."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_5bfcc8: "Miriam: What are you doing!!!!"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_5df66c: "Miriam: I'll go to that employee. Adventurer, please find another employee."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_6d0041: "Miriam: People inside. I will escort you. Let's go out."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_74b39c: "Miriam: I guess something happened. Let's go to Ira."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_7a1bcf: "Miriam: Adventurer, I will take care of this."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_8be7d7: "Miriam: If my father has another plan and goes down the wrong path, I have to stop him."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_9106c6: "Miriam: Then I will come and see if Ira and the others are safe."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_943adc: "Miriam: I think I should check to see if there are other employees and go up to the second floor."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_a15fd9: "Miriam: First, shall we get some information from the remaining employees?"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_a61255: "Miriam: After all, it must be a Heart Hunter disguised as a priest, right?"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_a749b9: "Miriam: I'll go to the right hallway. Adventurer, please search the left side."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_afd3c0: "Miriam: I will guard the entrance, so please search the inside of the room."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_b28b0f: "Miriam: Find another employee."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_ceee48: "Miriam: I feel a fierce presence. Probably the Heart Hunter."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_d06987: "Miriam: The door is locked. Shall we split up and search for it?"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_d0895d: "Miriam: Adventurer, please break through the lobby. Let's process it separately."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_e010f2: "Miriam: Okay. Thanks for the guidance. We'll do the inside search."
  npc_override_1@adv_VillaofHighPriest_menu_miriam_e4adc3: "Miriam: This is not the time. You must leave it! That's not God!"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_f22e39: "Miriam: What about the second floor?"
  npc_override_1@adv_VillaofHighPriest_menu_miriam_f364b1: "Miriam: Then let's go up carefully."
  npc_override_1@adv_VillaofHighPriest_menu_options_036179: "{0} : I found a small silver key."
  npc_override_1@adv_VillaofHighPriest_menu_options_2cf7c3: "{0} : Let's find another device."
  npc_override_1@adv_VillaofHighPriest_menu_options_42a69a: "{0} : Nonsense."
  npc_override_1@adv_VillaofHighPriest_menu_options_4b2470: "{0} : I need a Silver Key."
  npc_override_1@adv_VillaofHighPriest_menu_options_55e615: "{0} : I found a small golden key."
  npc_override_1@adv_VillaofHighPriest_menu_options_76e44c: "{0} : Could it be the Pope?!"
  npc_override_1@adv_VillaofHighPriest_menu_options_8cbde3: "{0} : I need a key."
  npc_override_1@adv_VillaofHighPriest_menu_options_cee24a: "{0} : Is there a chapel at the villa?"
  npc_override_1@adv_VillaofHighPriest_menu_options_f8b30f: "{0} : What's in it for me?"
  npc_override_1@adv_VillaofHighPriest_menu_party_328f2e: "Party: {0}"
  npc_override_1@adv_VillaofHighPriest_menu_schulang_7a87ee: "Schulang: You must die here for the greater good."
  npc_override_1@adv_VillaofHighPriest_menu_schulang_d779ae: "Schulang: You can no longer enter."
  npc_override_1@adv_VillaofHighPriest_menu_villa_589588: "Villa Employee: Are we really going to die?"
  npc_override_1@adv_VillaofHighPriest_menu_villa_6c75cf: "Villa Employee: You can open the door with the spare key."
  npc_override_1@adv_VillaofHighPriest_menu_villa_85f727: "Villa Employee: Please let me out of here..."
  npc_override_1@adv_VillaofHighPriest_menu_youth_6616da: "Youth: Don't touch me! Profane things!"
  npc_override_1@adv_VillaofHighPriest_miriam_catch_insolent_fo_c1a10d: "Miriam! Catch that insolent fool!"
  npc_override_1@adv_VillaofHighPriest_most_suddenly_fired_619613: "Most were suddenly fired."
  npc_override_1@adv_VillaofHighPriest_msg_79ef7f: "...."
