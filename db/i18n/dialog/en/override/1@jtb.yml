Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@jtb_NightmarishJitterbug_accordance_guild_policy_27fa9d: "In accordance with the Guild Policy, Article 8, I'm now the master of this guild, and you're just a member."
  npc_override_1@jtb_NightmarishJitterbug_adventuring_always_fun_g_cc2bc2: "Adventuring is always fun. Be a great adventurer, okay?"
  npc_override_1@jtb_NightmarishJitterbug_after_while_i_had_give_8d54e6: "After a while, I had to give up on tracing him. I was just wasting time."
  npc_override_1@jtb_NightmarishJitterbug_after_you_lose_some_weig_0f3785: "- after you lose some weight. -"
  npc_override_1@jtb_NightmarishJitterbug_agreed_he_s_violent_dirt_4041cb: "Agreed. He's violent, dirty..."
  npc_override_1@jtb_NightmarishJitterbug_ah_combining_items_fun_1c5d79: "Ah, combining items is fun."
  npc_override_1@jtb_NightmarishJitterbug_ah_i_m_getting_hungry_4e530c: "Ah, I'm getting hungry. The monsters can screw themselves. Shaloshi, let's go!"
  npc_override_1@jtb_NightmarishJitterbug_aigu_runane_good_1702ee: "Aigu and Runane are good."
  npc_override_1@jtb_NightmarishJitterbug_aigu_runane_showed_up_25bd08: "Aigu and Runane showed up."
  npc_override_1@jtb_NightmarishJitterbug_aigu_rune_midgarts_hotte_ba45e6: "Aigu is the Rune-Midgarts' hottest singer at this moment!"
  npc_override_1@jtb_NightmarishJitterbug_aigu_s_debut_song_lost_d2f3fe: "Aigu's debut song- Lost Poring"
  npc_override_1@jtb_NightmarishJitterbug_aigu_s_single_only_i_fc0f5d: "Aigu's single- Only I Didn't Know about the Card Album"
  npc_override_1@jtb_NightmarishJitterbug_air_smells_different_thi_6805a1: "The air smells different, and things look less... perceptible."
  npc_override_1@jtb_NightmarishJitterbug_all_right_let_me_think_21bd50: "All right! Let me think about what I want to give you..."
  npc_override_1@jtb_NightmarishJitterbug_all_righty_c73a91: "All righty!"
  npc_override_1@jtb_NightmarishJitterbug_all_while_foreign_energy_52558a: "All the while, the foreign energy I've been sensing is growing stronger. This is bad."
  npc_override_1@jtb_NightmarishJitterbug_almost_no_taste_9e793f: "It has almost no taste."
  npc_override_1@jtb_NightmarishJitterbug_am_i_only_one_happy_e65412: "Am I the only one not happy about this conversation?"
  npc_override_1@jtb_NightmarishJitterbug_arang_let_s_go_s_f9c0b8: "Arang, let's go. It's time for an adventure!"
  npc_override_1@jtb_NightmarishJitterbug_arang_shaloshi_71c6b7: "Arang! Shaloshi!"
  npc_override_1@jtb_NightmarishJitterbug_arang_why_aren_t_you_9725df: "Arang, why aren't you drinking it?"
  npc_override_1@jtb_NightmarishJitterbug_argh_43ffb4: "Argh!"
  npc_override_1@jtb_NightmarishJitterbug_argh_there_ghost_am_i_0f0d41: "Argh, is there a ghost? Or am I hearing things?"
  npc_override_1@jtb_NightmarishJitterbug_ask_many_questions_57369e: "Ask many questions."
  npc_override_1@jtb_NightmarishJitterbug_atk_matk_all_stats_261711: "ATK +6%. MATK +6%. All stats +1."
  npc_override_1@jtb_NightmarishJitterbug_awesome_indeed_ed136b: "Awesome, indeed!"
  npc_override_1@jtb_NightmarishJitterbug_aww_runane_you_re_cute_e2d055: "Aww, Runane. You're cute!"
  npc_override_1@jtb_NightmarishJitterbug_before_aigu_runane_2f20ee: "Before Aigu and Runane,"
  npc_override_1@jtb_NightmarishJitterbug_before_two_give_each_oth_34e71a: "- Before the two give each other a high five, Aigu and Mingmin slap them on their backs. -"
  npc_override_1@jtb_NightmarishJitterbug_better_get_rid_him_quick_9d05a0: "Better get rid of him quickly."
  npc_override_1@jtb_NightmarishJitterbug_bite_b40f9d: "Have a bite."
  npc_override_1@jtb_NightmarishJitterbug_blow_8fa604: "*Blow*"
  npc_override_1@jtb_NightmarishJitterbug_bye_e17e76: "Bye."
  npc_override_1@jtb_NightmarishJitterbug_bye_friends_i_hope_we_de4f1a: "Bye, friends. I hope we'll meet again soon."
  npc_override_1@jtb_NightmarishJitterbug_calm_down_s_just_woman_a9d382: "Calm down. It's just a woman."
  npc_override_1@jtb_NightmarishJitterbug_cancel_ebda43: "Cancel."
  npc_override_1@jtb_NightmarishJitterbug_chica_chica_4d075b: "Chica, chica~"
  npc_override_1@jtb_NightmarishJitterbug_chuckle_i_messing_you_wo_5eb3db: "*Chuckle* I was messing with you--it worked!"
  npc_override_1@jtb_NightmarishJitterbug_combine_9caf6c: "Combine."
  npc_override_1@jtb_NightmarishJitterbug_combining_process_really_45643f: "The combining process is really simple. I just place the Pendant of Harmony on the ground, then throw the Pendant of Chaos at it... like this!"
  npc_override_1@jtb_NightmarishJitterbug_comes_natural_veteran_th_5c407b: "It comes natural for veteran thieves like me to hide themselves in potential enemy territories."
  npc_override_1@jtb_NightmarishJitterbug_comrades_should_best_fri_a69532: "Comrades should be best friends!"
  npc_override_1@jtb_NightmarishJitterbug_comrades_should_fight_ea_686479: "Comrades should not fight with each other. Got it."
  npc_override_1@jtb_NightmarishJitterbug_comrades_should_fight_ea_a0efdc: "Comrades should not fight with each other."
  npc_override_1@jtb_NightmarishJitterbug_comrades_who_we_re_just_10d0e2: "Comrades, who? We're just a bunch of strangers hell-bent on saving a lost girl!"
  npc_override_1@jtb_NightmarishJitterbug_considering_time_money_w_e3b53d: "Considering the time and money we wasted on you, you deserve to be fed a basket full of poisonous mushrooms."
  npc_override_1@jtb_NightmarishJitterbug_cool_99e51d: "Not cool."
  npc_override_1@jtb_NightmarishJitterbug_could_she_lost_her_memor_46e7c9: "Could she have lost her memory? It seems she doesn't understand danger, it seems."
  npc_override_1@jtb_NightmarishJitterbug_could_supernatural_25adeb: "Could it be supernatural?"
  npc_override_1@jtb_NightmarishJitterbug_course_now_s_called_um_d4ce36: "Of course! Now it's called... Um..."
  npc_override_1@jtb_NightmarishJitterbug_crack_thing_entrance_as_a71845: "That Crack thing, or the entrance as you might call it, has vanished. If you really want to leave, then follow Aigu."
  npc_override_1@jtb_NightmarishJitterbug_cross_8524ee: "CROSS!!!"
  npc_override_1@jtb_NightmarishJitterbug_currently_you_re_carryin_73594b: "- Currently you're carrying -"
  npc_override_1@jtb_NightmarishJitterbug_dance_6c3c32: "Dance..."
  npc_override_1@jtb_NightmarishJitterbug_danger_no_825fcd: "Danger, no."
  npc_override_1@jtb_NightmarishJitterbug_decline_e87fe0: "Decline."
  npc_override_1@jtb_NightmarishJitterbug_delicate_flashlight_lumi_1c75f6: "Delicate Flashlight, Lumiere Dupleix!"
  npc_override_1@jtb_NightmarishJitterbug_did_you_63ea9c: "Did you?"
  npc_override_1@jtb_NightmarishJitterbug_did_you_get_lost_yoursel_2ab8f5: "Did you get lost by yourself again?"
  npc_override_1@jtb_NightmarishJitterbug_did_you_take_care_them_e1ad27: "Did you take care of them already? I wanted to take part in it!"
  npc_override_1@jtb_NightmarishJitterbug_dimensional_portal_canno_4c5df8: "^ff0000This dimensional portal cannot be accessed for 20 hours after your last access.^000000"
  npc_override_1@jtb_NightmarishJitterbug_dimwit_only_interested_a_ce3c83: "That dimwit is only interested in adventuring."
  npc_override_1@jtb_NightmarishJitterbug_doesn_t_anything_when_yo_89f196: "It doesn't do anything when you're not poisoned. We just didn't want to waste a good potion."
  npc_override_1@jtb_NightmarishJitterbug_don_t_call_my_hero_70d7b7: "Don't call my hero that! ...But I agree with you."
  npc_override_1@jtb_NightmarishJitterbug_don_t_care_9d05d4: "Don't care."
  npc_override_1@jtb_NightmarishJitterbug_don_t_let_yourself_delud_6f6eeb: "Don't let yourself be deluded by rumors! I'm the Stag of the Southern Gate, the most powerful Bishop in exorcist history!"
  npc_override_1@jtb_NightmarishJitterbug_don_t_listen_him_he_2ee7c4: "Don't listen to him. He doesn't need encouragement for his bad jokes."
  npc_override_1@jtb_NightmarishJitterbug_don_t_look_me_exit_15d420: "Don't look at me. Is that an exit?"
  npc_override_1@jtb_NightmarishJitterbug_don_t_mistake_anything_m_10c05a: "Don't mistake this for anything more than what it is--babysitting!"
  npc_override_1@jtb_NightmarishJitterbug_don_t_put_too_much_45276e: "Don't put too much faith in this kid. I'd better go look for Newoz."
  npc_override_1@jtb_NightmarishJitterbug_don_t_worry_children_gro_84e8b6: "Don't worry. Children grow by fighting."
  npc_override_1@jtb_NightmarishJitterbug_don_t_you_dare_i_fd18a6: "Don't you dare--I called dibs on him first!"
  npc_override_1@jtb_NightmarishJitterbug_don_t_you_dare_take_3e8b64: "Don't you dare take away my Newoz!"
  npc_override_1@jtb_NightmarishJitterbug_dorky_23b1df: "Dorky."
  npc_override_1@jtb_NightmarishJitterbug_dream_low_voice_dream_wh_9488c3: "A dream. A low voice in a dream. What kind of dream?"
  npc_override_1@jtb_NightmarishJitterbug_drink_drink_79ef48: "DRINK! DRINK!"
  npc_override_1@jtb_NightmarishJitterbug_enjoy_your_item_bring_mo_3a1f96: "Enjoy your item. Bring more Jitterbug Teeth if you want more items."
  npc_override_1@jtb_NightmarishJitterbug_enough_he_s_just_idiot_bcca4a: "Enough. He's just an idiot with no sense of direction."
  npc_override_1@jtb_NightmarishJitterbug_enough_stop_being_disres_da1f5f: "Enough! Stop being disrespectful to Newoz!"
  npc_override_1@jtb_NightmarishJitterbug_enter_ef7e6e: "Enter {0}."
  npc_override_1@jtb_NightmarishJitterbug_everything_about_her_scr_175a52: "Everything about her screams suspicious."
  npc_override_1@jtb_NightmarishJitterbug_except_you_you_mean_c659e5: "Except you, you mean."
  npc_override_1@jtb_NightmarishJitterbug_exchange_ae0aa9: "Exchange 50."
  npc_override_1@jtb_NightmarishJitterbug_ferre_angry_3b5fd7: "Ferre is angry."
  npc_override_1@jtb_NightmarishJitterbug_ferre_b8488b: "Ferre..."
  npc_override_1@jtb_NightmarishJitterbug_ferre_created_space_crac_adc659: "Ferre created this space in the Crack for me. If he loses his mind or perishes, this space will disappear with everything in it."
  npc_override_1@jtb_NightmarishJitterbug_ferre_e2a160: "Ferre?"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_729298: "Ferre, ferre!"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_d3e13a: "FERRE! FERRE!"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_fe_b0f637: "Ferre, ferre, fe-!"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_ferre_3f5adf: "Ferre, ferre, ferre!"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_ferre_ferre_26bc20: "Ferre, ferre, ferre, ferre-!"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_ferre_ferre_4f1f40: "FERRE- FERRE- FERRE- FERRE-!!"
  npc_override_1@jtb_NightmarishJitterbug_ferre_ferre_ferre_ffcb0b: "FERRE, FERRE, FERRE-!"
  npc_override_1@jtb_NightmarishJitterbug_ferre_really_angry_e581b8: "Ferre is really angry."
  npc_override_1@jtb_NightmarishJitterbug_ferre_transformed_into_i_3ebc5e: "Ferre has transformed into its true form!"
  npc_override_1@jtb_NightmarishJitterbug_ferre_you_don_t_65fcdb: "Ferre, you don't have to do this!"
  npc_override_1@jtb_NightmarishJitterbug_ferres_angry_055e50: "The Ferres are angry."
  npc_override_1@jtb_NightmarishJitterbug_ferres_don_t_bite_me_7ae12a: "Ferres don't bite me."
  npc_override_1@jtb_NightmarishJitterbug_ferres_showed_up_first_428b4e: "The Ferres showed up first."
  npc_override_1@jtb_NightmarishJitterbug_fighting_essential_adven_0976a2: "Fighting is essential to adventurer training. Divide and conquer!"
  npc_override_1@jtb_NightmarishJitterbug_fog_cleared_up_aae1aa: "The fog cleared up."
  npc_override_1@jtb_NightmarishJitterbug_follow_roter_gelka_0c035c: "Follow Roter and Gelka."
  npc_override_1@jtb_NightmarishJitterbug_formidable_enemy_appeare_cf58f6: "^FF0000A formidable enemy has appeared!^000000"
  npc_override_1@jtb_NightmarishJitterbug_friends_rivalry_4400dd: "(Friends... Rivalry...)"
  npc_override_1@jtb_NightmarishJitterbug_friends_rivalry_comrades_54b76e: "Friends... Rivalry... Comrades..."
  npc_override_1@jtb_NightmarishJitterbug_gelka_get_ready_c7db0a: "Gelka, get ready!"
  npc_override_1@jtb_NightmarishJitterbug_gelka_style_mental_stren_25e470: "Gelka-style Mental Strength! Iron Physique!"
  npc_override_1@jtb_NightmarishJitterbug_gimmie_five_d7f5f2: "Gimmie five!"
  npc_override_1@jtb_NightmarishJitterbug_give_up_74474e: "Give up."
  npc_override_1@jtb_NightmarishJitterbug_given_situation_my_promi_43f3ec: "But given the situation, my promise to you still stands."
  npc_override_1@jtb_NightmarishJitterbug_gods_gelka_you_re_awesom_52126e: "By the gods, Gelka, you're awesome!"
  npc_override_1@jtb_NightmarishJitterbug_good_ferre_56fa72: "This is not good. Ferre..."
  npc_override_1@jtb_NightmarishJitterbug_green_potion_07e9b8: "Green Potion"
  npc_override_1@jtb_NightmarishJitterbug_green_potion_a87957: "Green Potion!"
  npc_override_1@jtb_NightmarishJitterbug_green_potion_ca8aac: "Green Potion?"
  npc_override_1@jtb_NightmarishJitterbug_green_potion_such_bitter_a93a2b: "Green Potion is such a bitter... Um, Green Potion you said?"
  npc_override_1@jtb_NightmarishJitterbug_grunt_why_did_i_get_e4f01e: "*Grunt* Why did I get myself into this mess?"
  npc_override_1@jtb_NightmarishJitterbug_guess_so_we_ve_been_579286: "Guess so. We've been circling around the same place, by the way."
  npc_override_1@jtb_NightmarishJitterbug_guildsmen_bicker_each_ot_6e5f77: "Guildsmen can bicker with each other, but they're still family."
  npc_override_1@jtb_NightmarishJitterbug_h_hello_my_name_roel_34051a: "H-hello, my name is Roel. Runane and I've joined the guild together. Nice to meet you."
  npc_override_1@jtb_NightmarishJitterbug_haap_3c400b: "Haap!"
  npc_override_1@jtb_NightmarishJitterbug_hah_hah_don_t_worry_00d84a: "Hah hah, don't worry, little ladies. I'll protect you."
  npc_override_1@jtb_NightmarishJitterbug_hah_hah_embarassing_than_23fcef: "Hah hah, this is embarassing, but thank you."
  npc_override_1@jtb_NightmarishJitterbug_hah_hah_i_ll_teach_fee7c6: "Hah hah, I'll teach you how to do it later, Shaloshi."
  npc_override_1@jtb_NightmarishJitterbug_hah_hah_you_re_cute_6b7956: "Hah hah, you're cute. I'll sing for you later."
  npc_override_1@jtb_NightmarishJitterbug_hate_green_potions_97baa8: "Hate Green Potions~"
  npc_override_1@jtb_NightmarishJitterbug_having_you_two_me_brings_207137: "Having you two with me brings back a lot of memories."
  npc_override_1@jtb_NightmarishJitterbug_he_didn_t_know_because_5dfc94: "He didn't know because he doesn't think, ever."
  npc_override_1@jtb_NightmarishJitterbug_he_s_bad_news_trouble_1886e3: "He's bad news. Trouble follows him wherever he goes."
  npc_override_1@jtb_NightmarishJitterbug_he_s_born_irritable_0441d5: "He's born irritable."
  npc_override_1@jtb_NightmarishJitterbug_he_s_dead_guys_i_204a4d: "He's not dead. Guys, I understand you're new, but you can't make mistakes like this."
  npc_override_1@jtb_NightmarishJitterbug_he_s_just_being_lazy_edb4fa: "He's just being lazy. He's not so weak."
  npc_override_1@jtb_NightmarishJitterbug_heh_my_instincts_told_me_9f43d4: "Heh, my instincts told me to slow down because danger was ahead."
  npc_override_1@jtb_NightmarishJitterbug_heh_sci_fi_there_s_e006fb: "Heh, Sci-Fi. There's a mechanical tool that works..."
  npc_override_1@jtb_NightmarishJitterbug_hello_arang_how_s_ariran_7a5146: "Hello, Arang. How's Arirang? Heh. What brings you here?"
  npc_override_1@jtb_NightmarishJitterbug_her_name_shaloshi_i_aske_496942: "Her name is Shaloshi? I asked her several times, and she didn't tell me."
  npc_override_1@jtb_NightmarishJitterbug_here_they_come_851357: "Here they come..."
  npc_override_1@jtb_NightmarishJitterbug_here_we_go_3c6dcf: "Here we go!"
  npc_override_1@jtb_NightmarishJitterbug_hey_come_me_c44e3b: "Hey, come with me!"
  npc_override_1@jtb_NightmarishJitterbug_hey_what_you_been_readin_d4ffb8: "Hey, what have you been reading these days?"
  npc_override_1@jtb_NightmarishJitterbug_heya_b4a936: "Heya!"
  npc_override_1@jtb_NightmarishJitterbug_hi_nice_meet_you_i_41d791: "Hi, nice to meet you. I'm honored to meet the famous Newoz in person."
  npc_override_1@jtb_NightmarishJitterbug_hm_5ea458: "Hm..."
  npc_override_1@jtb_NightmarishJitterbug_hm_82ab28: "Hm?"
  npc_override_1@jtb_NightmarishJitterbug_hm_each_his_own_b51556: "Hm, to each his own."
  npc_override_1@jtb_NightmarishJitterbug_hm_getting_pretty_awkwar_0356c1: "Hm, getting pretty awkward here."
  npc_override_1@jtb_NightmarishJitterbug_hm_good_enough_gelka_don_53338b: "Hm, not good enough, Gelka. Don't let the guild business distract you from practice."
  npc_override_1@jtb_NightmarishJitterbug_hmpf_i_hate_girls_i_4f59ee: "Hmpf, I hate girls. I get the feeling we'll be seeing even more monsters."
  npc_override_1@jtb_NightmarishJitterbug_hmpf_just_know_i_m_b9c334: "Hmpf, just know I'm keeping my promise to you only because you've got what I want."
  npc_override_1@jtb_NightmarishJitterbug_how_about_i_your_friend_190b6e: "How about I be your friend?"
  npc_override_1@jtb_NightmarishJitterbug_how_about_when_you_playe_c72032: "How about when you played with Dead Branch to death? Or when you and your Sorcerer buddies killed yourselves playing Hocus Pocus?"
  npc_override_1@jtb_NightmarishJitterbug_how_about_you_adventurer_eeb82e: "How about you, Adventurer? How are things with your significant other?"
  npc_override_1@jtb_NightmarishJitterbug_how_did_we_get_you_3a3f74: "How did we get in, you asked?"
  npc_override_1@jtb_NightmarishJitterbug_how_long_i_shimmy_my_7489ad: "How long do I have to shimmy my shoulders~"
  npc_override_1@jtb_NightmarishJitterbug_how_s_released_yet_c5b229: "But how...?! It's not released yet."
  npc_override_1@jtb_NightmarishJitterbug_hurry_106683: "Hurry."
  npc_override_1@jtb_NightmarishJitterbug_i_agree_clearing_neither_01c0a1: "I agree. And this clearing is neither compact nor spacious."
  npc_override_1@jtb_NightmarishJitterbug_i_agree_jack_everything_932158: "I agree with Jack. Everything about this place--from the air to the soil--screams unnatural."
  npc_override_1@jtb_NightmarishJitterbug_i_always_love_singing_f685d3: "I always love singing."
  npc_override_1@jtb_NightmarishJitterbug_i_as_stubborn_as_mule_b4bbf3: "I was as stubborn as a mule and busy pretending like I knew what I was doing."
  npc_override_1@jtb_NightmarishJitterbug_i_bake_knit_my_spare_f643b0: "I bake and knit in my spare time. I'm very domestic. Ho ho ho!"
  npc_override_1@jtb_NightmarishJitterbug_i_believe_you_master_45f6be: "I believe in you, Master!"
  npc_override_1@jtb_NightmarishJitterbug_i_didn_t_know_what_bc30fb: "I didn't know what friends meant, but it sounded good. I wanted it."
  npc_override_1@jtb_NightmarishJitterbug_i_didn_t_quite_understan_bd84a9: "I didn't quite understand her, but Runane said the portal to the place she Memorized is based on time instead of space."
  npc_override_1@jtb_NightmarishJitterbug_i_don_t_care_i_e81606: "I don't care. I'm staying with Newoz."
  npc_override_1@jtb_NightmarishJitterbug_i_don_t_know_why_dc3a5d: "I don't know why, but things are losing their shape as if they're fading away."
  npc_override_1@jtb_NightmarishJitterbug_i_don_t_mind_healthy_052c63: "I don't mind healthy rivalry, but I prefer friendship, however long it lasts."
  npc_override_1@jtb_NightmarishJitterbug_i_don_t_think_he_700c83: "I don't think he knows that. Do you, Newoz?"
  npc_override_1@jtb_NightmarishJitterbug_i_enjoyed_your_company_i_eff612: "I enjoyed your company. If we meet again... Will we be enemies?"
  npc_override_1@jtb_NightmarishJitterbug_i_feel_great_my_first_54d905: "I feel great--this is my first adventure in a long time since I was charged with caring for other adventurers. Plus I've met my hero Newoz!"
  npc_override_1@jtb_NightmarishJitterbug_i_feel_like_something_s_22820c: "I feel like something's going to appear in front of our eyes with a loud pop."
  npc_override_1@jtb_NightmarishJitterbug_i_feeling_newoz_up_no_fa7a10: "I have a feeling Newoz is up to no good."
  npc_override_1@jtb_NightmarishJitterbug_i_find_her_i_talk_5d13ee: "I have to find her. I have to talk to her."
  npc_override_1@jtb_NightmarishJitterbug_i_guess_jobs_don_t_7ecd0f: "I guess jobs don't matter so long as you can sing and play, huh?"
  npc_override_1@jtb_NightmarishJitterbug_i_had_almost_expired_gre_50830a: "I had an almost expired Green Potion, so we decided to play Rock-paper-scissors and feed it to the loser."
  npc_override_1@jtb_NightmarishJitterbug_i_hope_s_formidable_mons_4c00eb: "I hope it's a formidable monster!"
  npc_override_1@jtb_NightmarishJitterbug_i_hope_shaloshi_recover_ef0830: "I hope Shaloshi will recover her memory soon."
  npc_override_1@jtb_NightmarishJitterbug_i_hope_there_lots_things_a3096d: "I hope there are lots of things to study."
  npc_override_1@jtb_NightmarishJitterbug_i_hope_today_won_t_2c4efc: "I hope today won't be the last day I play my instrument..."
  npc_override_1@jtb_NightmarishJitterbug_i_hope_you_ll_teach_7f74d8: "I hope you'll teach me too, Roter."
  npc_override_1@jtb_NightmarishJitterbug_i_hope_you_re_wrong_53f4a3: "I hope you're wrong."
  npc_override_1@jtb_NightmarishJitterbug_i_i_ll_practice_harder_d76cd4: "I will! I'll practice harder, too!"
  npc_override_1@jtb_NightmarishJitterbug_i_just_don_t_like_a0933c: "I just don't like the name."
  npc_override_1@jtb_NightmarishJitterbug_i_keep_losing_others_the_bee182: "I keep losing the others. They were right in front of me."
  npc_override_1@jtb_NightmarishJitterbug_i_knew_happen_aigu_didn_3563b2: "I knew this would happen, and Aigu didn't listen to me!"
  npc_override_1@jtb_NightmarishJitterbug_i_know_he_ll_say_064a91: "I know--he'll say no if I ask him out."
  npc_override_1@jtb_NightmarishJitterbug_i_know_you_don_t_8599fc: "I know. You don't have to remind me."
  npc_override_1@jtb_NightmarishJitterbug_i_like_his_spirit_though_6b0ed5: "I like his spirit, though I can see he's getting exhausted."
  npc_override_1@jtb_NightmarishJitterbug_i_ll_exchange_jitterbug_0aee3f: "I'll exchange 50 Jitterbug Teeth with ^FF0000a random item.^000000"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_explain_everything_d86639: "I'll explain everything. And enough with the poisonous mushrooms. I can't eat mushrooms at all."
  npc_override_1@jtb_NightmarishJitterbug_i_ll_follow_you_guys_88a783: "I'll follow you guys to the ends of the world."
  npc_override_1@jtb_NightmarishJitterbug_i_ll_kill_you_both_87cddf: "I'll kill you both before the monster."
  npc_override_1@jtb_NightmarishJitterbug_i_ll_never_able_speak_667f6e: "I'll never be able to speak that name. Aigu, are you sure you want to stick with these guys?"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_never_again_let_e24a9f: "I'll never again let you go, Newoz!"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_show_you_my_f6ed06: "I'll show you my charismatic leadership as the guild master!"
  npc_override_1@jtb_NightmarishJitterbug_i_ll_sing_again_later_c88154: "I'll sing again later."
  npc_override_1@jtb_NightmarishJitterbug_i_ll_study_you_later_54d1bb: "I'll have to study you later, girl."
  npc_override_1@jtb_NightmarishJitterbug_i_m_afraid_place_falling_3411cc: "I'm afraid this place is falling down around us."
  npc_override_1@jtb_NightmarishJitterbug_i_m_all_right_rot_2b457a: "I'm all right. Rot, were you worried about me?"
  npc_override_1@jtb_NightmarishJitterbug_i_m_alone_7459c9: "I'm not alone."
  npc_override_1@jtb_NightmarishJitterbug_i_m_alone_e169b8: "But I'm not alone."
  npc_override_1@jtb_NightmarishJitterbug_i_m_detecting_electromag_0e1e3a: "I'm detecting electromagnetic waves up ahead. At least Grade E monsters."
  npc_override_1@jtb_NightmarishJitterbug_i_m_experienced_adventur_832c1b: "I'm not experienced in adventuring, but it's quite fun."
  npc_override_1@jtb_NightmarishJitterbug_i_m_fan_c6131e: "I'm not a fan of it."
  npc_override_1@jtb_NightmarishJitterbug_i_m_fine_i_told_d43e31: "I'm fine. I told you to be careful, kiddo!"
  npc_override_1@jtb_NightmarishJitterbug_i_m_following_newoz_9a2725: "I'm following Newoz."
  npc_override_1@jtb_NightmarishJitterbug_i_m_glad_mushroom_poison_f6a52e: "I'm glad the mushroom is not poisonous."
  npc_override_1@jtb_NightmarishJitterbug_i_m_guild_master_i_1c4a3e: "I'm the guild master! I name it whatever I want!"
  npc_override_1@jtb_NightmarishJitterbug_i_m_hiding_because_my_ab4985: "I'm not hiding because my sprite is not yet ready!"
  npc_override_1@jtb_NightmarishJitterbug_i_m_interested_kid_90c0ba: "I'm not interested in that kid."
  npc_override_1@jtb_NightmarishJitterbug_i_m_just_going_leave_859c44: "I'm just going to leave you guys to..."
  npc_override_1@jtb_NightmarishJitterbug_i_m_leaving_be1eaa: "That does it! I'm leaving!"
  npc_override_1@jtb_NightmarishJitterbug_i_m_member_if_you_5d2ddf: "I'm not a member, but if you ask me, that name..."
  npc_override_1@jtb_NightmarishJitterbug_i_m_okay_first_time_c9f5dd: "I'm okay. Not the first time."
  npc_override_1@jtb_NightmarishJitterbug_i_m_okay_least_i_fe553d: "I'm okay. At least I can protect Shaloshi. Feeling protective of someone is nice."
  npc_override_1@jtb_NightmarishJitterbug_i_m_roel_new_guildsman_f2a009: "I'm Roel, new guildsman. Nice to meet you."
  npc_override_1@jtb_NightmarishJitterbug_i_m_roel_new_member_00127f: "I'm Roel, new member of the White Wings Guild. Roter had me search everywhere for Newoz, and I've found some clues as to his whereabouts."
  npc_override_1@jtb_NightmarishJitterbug_i_m_scared_8ff779: "I'm not scared!"
  npc_override_1@jtb_NightmarishJitterbug_i_m_shaloshi_demon_mind_f703ab: "I'm Shaloshi, a demon mind reader and the third agent of Morocc's."
  npc_override_1@jtb_NightmarishJitterbug_i_m_shaloshi_sing_me_925f7e: "I'm Shaloshi. Sing for me."
  npc_override_1@jtb_NightmarishJitterbug_i_m_telling_you_we_5545b6: "I'm telling you, we've been circling around the same place."
  npc_override_1@jtb_NightmarishJitterbug_i_m_your_master_anymore_f28ed3: "I'm not your master anymore. You don't have to follow me."
  npc_override_1@jtb_NightmarishJitterbug_i_mingmin_drank_poison_b_1b06f5: "I can! Mingmin drank the Poison Bottle I found on the street and died; I told you it was expensive, and I didn't say anything about it being good for your health."
  npc_override_1@jtb_NightmarishJitterbug_i_miss_delectable_combin_4dfa54: "I miss the delectable combination of beef and acorns called Bifrost Roast Beef."
  npc_override_1@jtb_NightmarishJitterbug_i_never_slack_my_trainin_691c18: "I never slack on my training."
  npc_override_1@jtb_NightmarishJitterbug_i_practice_hard_so_i_9d7ba1: "I practice hard, so I can shine in times of danger."
  npc_override_1@jtb_NightmarishJitterbug_i_remembered_few_things_227aca: "I remembered a few things."
  npc_override_1@jtb_NightmarishJitterbug_i_said_green_potion_3d7fab: "I said Green Potion!"
  npc_override_1@jtb_NightmarishJitterbug_i_see_what_made_you_4fedee: "I can see what has made you become so irritable, Master."
  npc_override_1@jtb_NightmarishJitterbug_i_should_plenty_time_bef_d08d97: "I should have plenty of time before that to get rid of you. I'll show you why I'm called the Bad Boy of the Exorcist World."
  npc_override_1@jtb_NightmarishJitterbug_i_should_try_one_6a6cac: "I should try one."
  npc_override_1@jtb_NightmarishJitterbug_i_shouldn_t_led_you_93c603: "I shouldn't have led you here, but I really wanted some friends."
  npc_override_1@jtb_NightmarishJitterbug_i_t_tell_you_just_924678: "I can't tell you just yet, but they're useful to me. Bring them to me, and I'll give you some booty Newoz has hoarded in return."
  npc_override_1@jtb_NightmarishJitterbug_i_think_i_ability_take_56246c: "I think I have the ability to take people with me, wherever I go. Or you wouldn't have followed me this far."
  npc_override_1@jtb_NightmarishJitterbug_i_think_i_fit_pendant_d94fe2: "I think I can fit Pendant of Harmony and Pendant of Chaos together."
  npc_override_1@jtb_NightmarishJitterbug_i_think_she_305a92: "I think she has."
  npc_override_1@jtb_NightmarishJitterbug_i_think_someone_made_my_e14a30: "I think someone made my wish come true."
  npc_override_1@jtb_NightmarishJitterbug_i_thought_someone_made_m_f3dad1: "I thought someone made my wish come true."
  npc_override_1@jtb_NightmarishJitterbug_i_thought_you_d_gotten_fb861a: "And I thought you'd have gotten used to having me around invisible."
  npc_override_1@jtb_NightmarishJitterbug_i_told_you_newoz_we_10ab54: "I told you, Newoz. We can't just let this go."
  npc_override_1@jtb_NightmarishJitterbug_i_tried_some_trace_him_8627e8: "I tried to some trace of him, but to no avail."
  npc_override_1@jtb_NightmarishJitterbug_i_turned_my_eyes_other_346a1f: "I turned my eyes to the Other World, and there I met some eyewitnesses. They led me to the last place Newoz had been seen."
  npc_override_1@jtb_NightmarishJitterbug_i_ve_followed_aigu_all_d6eb25: "I've followed Aigu all the way here."
  npc_override_1@jtb_NightmarishJitterbug_i_ve_found_so_much_72050d: "I've found so much inspiration through this adventure. I'm hopeful I can write some good songs."
  npc_override_1@jtb_NightmarishJitterbug_i_ve_harvested_few_mushr_24a130: "I've harvested a few mushrooms to taste."
  npc_override_1@jtb_NightmarishJitterbug_i_ve_joined_guild_meet_c26942: "I've joined this guild to meet you, Newoz. Do you have a girlfriend?"
  npc_override_1@jtb_NightmarishJitterbug_i_ve_learned_best_002c6c: "I've learned from the best."
  npc_override_1@jtb_NightmarishJitterbug_i_ve_stolen_few_strands_b75375: "I've stolen a few strands of hair from Shaloshi, thinking it'd come in handy someday. I want to analyze them, though I already know the results."
  npc_override_1@jtb_NightmarishJitterbug_i_ve_trained_enough_i_0a00c2: "I've trained enough. I can be useful."
  npc_override_1@jtb_NightmarishJitterbug_i_ve_waited_you_because_b12497: "I've waited for you because I wanted to talk."
  npc_override_1@jtb_NightmarishJitterbug_i_want_dance_as_well_f98281: "I want to dance as well as Aigu."
  npc_override_1@jtb_NightmarishJitterbug_i_want_go_home_i_524955: "I want to go home. I really want to take a shower and eat some bread."
  npc_override_1@jtb_NightmarishJitterbug_i_want_stay_as_bard_023d2d: "I want to stay as a Bard for a while."
  npc_override_1@jtb_NightmarishJitterbug_i_wish_these_monsters_as_dbb921: "I wish these monsters were as cute and helpless as those Porings for the Taekwon mission."
  npc_override_1@jtb_NightmarishJitterbug_i_won_t_accept_anything_69e888: "I won't accept anything less than 50 Jitterbug Teeth."
  npc_override_1@jtb_NightmarishJitterbug_i_won_t_take_no_4f8f91: "I won't take no for an answer!"
  npc_override_1@jtb_NightmarishJitterbug_i_wonder_what_might_wait_93dab4: "I wonder what might wait for us at the end of this passage. The anticipation is killing me!"
  npc_override_1@jtb_NightmarishJitterbug_if_i_results_incredible_185a03: "And if I do, the results will be incredible!"
  npc_override_1@jtb_NightmarishJitterbug_if_i_take_ferre_me_0c26ba: "If I take Ferre with me to a different space, then a number of exits will appear in the loosened rift in spacetime."
  npc_override_1@jtb_NightmarishJitterbug_if_my_description_combin_dc140b: "If my description of the combination results is strangely familiar to you, I wouldn't know. But that's how I picture the results. If you find both the pendants, bring them to me, yeah?"
  npc_override_1@jtb_NightmarishJitterbug_if_you_find_my_joke_566581: "If you find my joke funny, don't try to hide it. Just laugh."
  npc_override_1@jtb_NightmarishJitterbug_if_you_re_interested_joi_27667c: "If you're interested in joining us, please talk to Runane. We have an exciting adventure ahead of us."
  npc_override_1@jtb_NightmarishJitterbug_if_you_re_interested_joi_dcc64f: "If you're interested in joining us, please talk to Runane."
  npc_override_1@jtb_NightmarishJitterbug_if_you_want_use_my_a37953: "^ff0000If you want to use my dimensional portal, then you first have to talk to Roel. The portal is not open for everyone.^000000"
  npc_override_1@jtb_NightmarishJitterbug_if_you_want_you_go_609bc1: "If you want, you can go back in time and experience the same events. Do you want to embark on an adventure again?"
  npc_override_1@jtb_NightmarishJitterbug_impenetrable_defense_roe_9f0bb8: "Impenetrable defense! Roel-style Guard!"
  npc_override_1@jtb_NightmarishJitterbug_isn_t_good_time_chit_00143c: "This isn't a good time for chit-chat. I'm sensing something from the very floor where you're standing and where I'm hiding."
  npc_override_1@jtb_NightmarishJitterbug_its_interior_looked_like_4c751a: "Its interior looked like that of a forest, then changed to that of a cave. How strange."
  npc_override_1@jtb_NightmarishJitterbug_jack_why_you_re_hiding_b03c6c: "Jack, is that why you're hiding like a coward?"
  npc_override_1@jtb_NightmarishJitterbug_jitterbug_tooth_e13920: "Jitterbug Tooth"
  npc_override_1@jtb_NightmarishJitterbug_just_trust_me_drink_766fb3: "Just trust me and drink it!"
  npc_override_1@jtb_NightmarishJitterbug_keep_name_i_m_out_62c09e: "Keep the name. I'm out."
  npc_override_1@jtb_NightmarishJitterbug_kind_5fad66: "Kind."
  npc_override_1@jtb_NightmarishJitterbug_laggi_s_self_composed_so_1be7ab: "Laggi's Self-composed song- Accidental Moonlight"
  npc_override_1@jtb_NightmarishJitterbug_last_bastion_54f748: "Last bastion!"
  npc_override_1@jtb_NightmarishJitterbug_later_i_heard_newoz_sing_3c008c: "Later I heard Newoz singing while waiting for his friends. His voice warmed me."
  npc_override_1@jtb_NightmarishJitterbug_leave_him_7e6a2c: "Leave him."
  npc_override_1@jtb_NightmarishJitterbug_let_me_go_look_possible_16d752: "Let me go look for possible threats."
  npc_override_1@jtb_NightmarishJitterbug_let_s_begin_d8e4b0: "Let's begin!"
  npc_override_1@jtb_NightmarishJitterbug_let_s_go_d7f55d: "Let's go."
  npc_override_1@jtb_NightmarishJitterbug_let_s_make_truce_now_2e421a: "Let's make a truce for now. But make no mistake--Newoz is mine the moment I find him vulnerable."
  npc_override_1@jtb_NightmarishJitterbug_let_s_move_before_they_bbf38c: "Let's move before they forget about us."
  npc_override_1@jtb_NightmarishJitterbug_listen_humans_monsters_t_eaaafc: "Listen, humans and monsters can't be friends. At least that's what I think."
  npc_override_1@jtb_NightmarishJitterbug_little_girl_strange_plac_b977a7: "A little girl in this strange place, by herself? Hm, doesn't it sound strange to you?"
  npc_override_1@jtb_NightmarishJitterbug_love_your_song_7fc676: "Love your song."
  npc_override_1@jtb_NightmarishJitterbug_magic_attacks_enemies_ca_53d057: "Magic attacks from enemies cast Level 1 Auto Spell Maelstrom."
  npc_override_1@jtb_NightmarishJitterbug_man_singing_voice_84623d: "Man with the singing voice."
  npc_override_1@jtb_NightmarishJitterbug_master_bd3b20: "Master!"
  npc_override_1@jtb_NightmarishJitterbug_master_come_me_a4eb4a: "Master, come with me!"
  npc_override_1@jtb_NightmarishJitterbug_master_please_ebfec6: "Master, please!"
  npc_override_1@jtb_NightmarishJitterbug_maybe_newoz_interested_d_15b6c1: "Maybe Newoz is not interested in dating."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_0360c4: "Aigu: That dimwit is only interested in adventuring."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_070060: "Aigu: Aww, Runane. You're cute!"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_0d9100: "Aigu: It's easy. Just smile."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_1587c7: "Aigu: You seem to be fond of Roel."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_191b5b: "Aigu: One moment, I had Shaloshi's hand in my hand, and the next, she's gone."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_223cd2: "Aigu: You'd better be more reliable than someone I know."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_231702: "Aigu: Pam, pam, pam, pam~"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_2520f6: "Aigu: Newoz, you can't eat anything but meat. Sigh, I'm glad you're safe."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_2bd4eb: "Aigu: It's calloused because I dance. Heh heh."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_34e4b3: "Aigu: Green Potion!"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_4b3bc6: "Aigu: Did you?"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_5164c0: "Aigu: Over my dead body!"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_57d78f: "Aigu: That's strange. She told Newoz straight from the start."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_6234c0: "Aigu: ..."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_69b6e1: "Aigu: I hope you're wrong."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_6c4542: "Aigu: Tell me something I don't know."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_6c6668: "Aigu: I had an almost expired Green Potion, so we decided to play Rock-paper-scissors and feed it to the loser."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_6dd620: "Aigu: Well, I didn't..."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_6ec8c5: "Aigu: Don't you dare--I called dibs on him first!"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_712a59: "Aigu: DRINK! DRINK!"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_79a617: "Aigu: Okay. Take my hand."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_7cc95b: "Aigu: Newoz, are you all right?"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_8846d4: "Aigu: Newoz, I'm coming with you!"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_8b8adc: "Aigu: Monsters started appearing, and their number is growing quickly."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_8ebd05: "Aigu: I don't care. I'm staying with Newoz."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_8f3834: "Aigu: What are you talking about? Why can't you just follow us? Where's Runane? I saw her next to me a moment ago."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_9387e9: "Aigu: Oh, I'm sorry, but I'm on the verge of bursting into tears."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_97a240: "Aigu: How about you, Adventurer? How are things with your significant other?"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_9c86c0: "Aigu: Unrequited love is painful. You'd better let it go before it breaks you."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_a42fd5: "Aigu: Newoz! Where did you go this time?"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_aaeb97: "Aigu: Stop goofing around. Shaloshi, talk to us."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_ac1840: "Aigu: Are you serious? Even people like you have found their love. What about me?!"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_b71828: "Aigu: MONSTER-! ...Um, it's just a woman."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_b98f44: "Aigu: We didn't have to be here if it weren't for someone."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_ba4b15: "Aigu: You've met him today, but you should know unless you're stupid."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_c0bcda: "Aigu: Calm down. It's just a woman."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_caebfa: "Aigu: Wait, we're not finished here!"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_d0960a: "Aigu: You'd run before everyone else in here. Well, we can't stay here. Let's move on."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_dbc644: "Aigu: She may have not remembered everything, but this is an improvement. Let's wait until she's ready to talk more."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_dd6a23: "Aigu: Oh, you're right!"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_df7366: "Aigu: How did we get in, you asked?"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_e55d70: "Aigu: How long do I have to shimmy my shoulders~"
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_e7b5a5: "Aigu: That sounds lame."
  npc_override_1@jtb_NightmarishJitterbug_menu_aigu_f836f7: "Aigu: I don't mind healthy rivalry, but I prefer friendship, however long it lasts."
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_244389: "Arang: *Snort* You said the same thing about the Prontera Culvert."
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_29c054: "Arang: You'll be okay, Aigu, so long as you stick with us... Um, where's everyone?"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_303414: "Arang: Where have you been? We just had an awesome monster here!"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_32ab1a: "Arang: Guildsmen can bicker with each other, but they're still family."
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_379083: "Arang: But it's awfully bitter."
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_56cfda: "Arang: Are they competing over Newoz? I want in, too!"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_6567e4: "Arang: All righty!"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_848739: "Arang: No, his adventurer instincts have gotten rusty."
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_88353c: "Arang: Newoz, I love you!"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_a379cc: "Arang: Not cool."
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_a466bf: "Arang: Yippee! Let's go!"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_a60e5b: "Arang: Ugh, I don't want to drink this!"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_ab4c25: "Arang: Wow, Newoz! Your eyes look puffier than ever."
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_bbbc2e: "Arang: Agreed. He's violent, dirty..."
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_d15f42: "Arang: What?"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_e63575: "Arang: Roel, can't you drink it for your sister?"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_ee1780: "Arang: I hope it's a formidable monster!"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_eff7e7: "Arang: Jack, is that why you're hiding like a coward?"
  npc_override_1@jtb_NightmarishJitterbug_menu_arang_f684e0: "Arang: Have you seen Shaloshi? Where is she?"
  npc_override_1@jtb_NightmarishJitterbug_menu_def_df0b18: "DEF: 0 Weight: 10 Required Level: 130"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_278ab6: "Ferre: Ferre, ferre, fe-!"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_9ee293: "Ferre: Ferre, ferre, ferre, ferre-!"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_a16140: "Ferre: FERRE, FERRE, FERRE-!"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_bbb63a: "Ferre: Ferre, ferre!"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_be0952: "Ferre: Ferre, ferre, ferre!"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_c95b1c: "Ferre: FERRE- FERRE- FERRE- FERRE-!!"
  npc_override_1@jtb_NightmarishJitterbug_menu_ferre_dda2e9: "Ferre: Ferre..."
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_09b9ef: "Gelka: Here we go!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_1825fd: "Gelka: Scene 8: Heroes are surrounded by a horde of enemies. Roel, let's choreograph what we've practiced today, shall we?"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_18ff9d: "Gelka: Scatter--Thousand Flashlights!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_1b6fca: "Gelka: Heh, Sci-Fi. There's a mechanical tool that works..."
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_1cfdba: "Gelka: Ooh, this will be like reenacting a scene from the book, where monsters are rampaging."
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_26fd45: "Gelka: I'm detecting electromagnetic waves up ahead. At least Grade E monsters."
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_28d947: "Gelka: Oh, the instincts of a great adventurer!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_33b0f0: "Gelka: Master!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_3bc2e3: "Gelka: Gelka-style Mental Strength! Iron Physique!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_3ee505: "Gelka: !!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_5410af: "Gelka: Special skills are all about their names. Shouting impressive names is enough to intimidate your enemies."
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_5baaf1: "Gelka: You're a spoilsport, you know that?"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_6b162c: "Gelka: Ruinous Twelve Heaven's Nets!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_709885: "Gelka: Rot? Is that your pet name, Master? Are you two friends?"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_76f01b: "Gelka: Master, please!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_77c9b3: "Gelka: ...Whew."
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_8f5df4: "Gelka: CROSS!!!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_9047c0: "Gelka: Last bastion!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_9c35a4: "Gelka: I can see what has made you become so irritable, Master."
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_a20704: "Gelka: You're the famous Newoz! Nice to meet you. My master told me many great things..."
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_d0dcf9: "Gelka: Yes, Master!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_d53b5c: "Gelka, Ultra Special Skill No. 8: Wild Dance!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_e4adce: "Gelka: Master, come with me!"
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_fae96b: "Gelka: Um, the conversation seems to have gone..."
  npc_override_1@jtb_NightmarishJitterbug_menu_gelka_fbffe1: "Gelka: I've learned from the best."
  npc_override_1@jtb_NightmarishJitterbug_menu_i_44045b: "...I'm free now, but that doesn't change who I am: a demon."
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_34488d: "Lagi: I want to stay as a Bard for a while."
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_35c499: "Lagi: Gimmie five!"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_38ecec: "Lagi: She said she did."
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_429614: "Lagi: Roel, I think we should move too."
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_579346: "Lagi: Oh, both of them left."
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_608ce4: "Lagi: She can change subjects more quickly than an Arclouse can cast Increase AGI."
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_640e3c: "Lagi: Hey, come with me!"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_6a745d: "Lagi: Um, are you trying to whistle?"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_82d110: "Lagi: Could it be supernatural?"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_852cd5: "Lagi: But how...?! It's not released yet."
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_901406: "Lagi: I'm just going to leave you guys to..."
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_927aaa: "Lagi: We've met again."
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_a01ee5: "Lagi: Waiting for snow~"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_ad0184: "Lagi: !!!"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_aeed02: "Lagi: I'll never be able to speak that name. Aigu, are you sure you want to stick with these guys?"
  npc_override_1@jtb_NightmarishJitterbug_menu_lagi_bb4ea0: "Lagi: Something else is showing up."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_145e5b: "Melody-Jack: It comes natural for veteran thieves like me to hide themselves in potential enemy territories."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_1e5fa3: "Melody-Jack: You're smart and capable of teleportation. Roter, we can't let her go."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_1f4ce3: "Melody-Jack: Newoz, I've known you're weird in the head, but she's..."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_2cc66f: "Melody-Jack: I'm not a member, but if you ask me, that name..."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_3f1036: "Melody-Jack: All the while, the foreign energy I've been sensing is growing stronger. This is bad."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_41c5e2: "Melody-Jack: Guess so. We've been circling around the same place, by the way."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_5fd661: "Melody-Jack: Newoz, your contract has expired at the time you returned to the guild."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_692802: "Melody-Jack: Better get rid of him quickly."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_6bd255: "Melody-Jack: I've waited for you because I wanted to talk."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_70cbc2: "Melody-Jack: What did you expect? All he thinks about is adventure, monsters, and treasure."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_82f44a: "Melody-Jack: Newoz."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_908a19: "Melody-Jack: And I thought you'd have gotten used to having me around invisible."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_919c3a: "Melody-Jack: He didn't know because he doesn't think, ever."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_998c47: "Melody-Jack: I'm afraid this place is falling down around us."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_99c165: "Melody-Jack: But given the situation, my promise to you still stands."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_b957df: "Melody-Jack: Wow, this place is not going to last long--look how violently the ground is shaking! We really need to get out like yesterday, Newoz."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_ba1077: "Melody-Jack: Let's move before they forget about us."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_bba14b: "Melody-Jack: I'm not hiding because my sprite is not yet ready!"
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_bf0bd3: "Melody-Jack: You moron, that's worth nothing. Your contract has expired, but a promise is a promise and I intend to keep it."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_f69fba: "Melody-Jack: This isn't a good time for chit-chat. I'm sensing something from the very floor where you're standing and where I'm hiding."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_f85e01: "Melody-Jack: Hmpf, just know I'm keeping my promise to you only because you've got what I want."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_fdc6cb: "Melody-Jack: ..."
  npc_override_1@jtb_NightmarishJitterbug_menu_melody_fdc917: "Melody-Jack: I'm telling you, we've been circling around the same place."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_00832a: "Mingmin: A dream. A low voice in a dream. What kind of dream?"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_00ad6e: "Mingmin: I should try one."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_03bbbe: "Mingmin: We'll talk again the moment we're out of here."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_0488fa: "Mingmin: It has almost no taste."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_0c8bdf: "Mingmin: Except you, you mean."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_165751: "Mingmin: It doesn't do anything when you're not poisoned. We just didn't want to waste a good potion."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_18bfd8: "Mingmin: We'll know soon enough."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_32c50c: "Mingmin: Then let's get out of here. We're in serious danger right now."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_32f46c: "Mingmin: Oh, we've got new members, huh? Great, I have a few mushrooms that I've wanted to sample..."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_390996: "Mingmin: Hm..."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_397f23: "Mingmin: He's born irritable."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_3a36b9: "Mingmin: ...Sorry to bother you guys, but I think something's over there."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_3b35a5: "Mingmin: Just trust me and drink it!"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_3f0e25: "Mingmin: Wow, you can even hear what monsters think?"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_41279a: "Mingmin: Stop thinking and just keep the old name."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_48cdb5: "Mingmin: Do you really have to ask? Who's that girl? Is she yours?"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_492c0a: "Mingmin: Newoz!"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_4957da: "Mingmin: I hope there are lots of things to study."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_551f9a: "Mingmin: I won't take no for an answer!"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_64e219: "Mingmin: I agree. And this clearing is neither compact nor spacious."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_690eda: "Mingmin: You speak like a grown-up now, all smooth and clear."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_69ed97: "Mingmin: Strange plants growing on stranger terrains. Everything looks out of place."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_6cc4e9: "Mingmin: I agree with Jack. Everything about this place--from the air to the soil--screams unnatural."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_6cf7c1: "Mingmin: DRINK! DRINK!"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_6d49e2: "Mingmin: It's your call, new master."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_70001e: "Mingmin: No. I'm just saying the environmental changes are too drastic, almost like the mood swings of a bipolar person."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_7062be: "Mingmin: That Crack thing, or the entrance as you might call it, has vanished. If you really want to leave, then follow Aigu."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_849e23: "Mingmin: Do you remember when you two fought over that florist girl at the southern gate of Prontera? Or when the doll merchant at the eastern gate whupped you for bickering and driving his customers away?"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_8bfdcf: "Mingmin: I've harvested a few mushrooms to taste."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_8cc427: "Mingmin: You're braver than I thought."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_8ff06a: "Mingmin: You can talk and you can hear other people's thoughts. Brilliant."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_92c284: "Mingmin: Considering the time and money we wasted on you, you deserve to be fed a basket full of poisonous mushrooms."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_9cd2fb: "Mingmin: Oh, I remember! That was funny!"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_a11b0e: "Mingmin: How about when you played with Dead Branch to death? Or when you and your Sorcerer buddies killed yourselves playing Hocus Pocus?"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_a4afe7: "Mingmin: No, I'm not! You don't want me to get angry at you, girl."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_abcb9a: "Mingmin: Sheesh, this was a waste of time. You should go first. There's one more thing I want to look at."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_ac30a1: "Mingmin: Keep the name. I'm out."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_aeafab: "Mingmin: Push, push~"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_b070bc: "Mingmin: Are we ready? Let's go!"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_b19898: "Mingmin: A little girl in this strange place, by herself? Hm, doesn't it sound strange to you?"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_b8b74c: "Mingmin: ..."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_b8cce8: "Mingmin: This mushroom is poisonous, but not life threatening. Do you want to have a bite?"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_b96d33: "Mingmin: I'll have to study you later, girl."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_bcd2ed: "Mingmin: Its interior looked like that of a forest, then changed to that of a cave. How strange."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_c111e1: "Mingmin: I don't know why, but things are losing their shape as if they're fading away."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_d90038: "Mingmin: The air smells different, and things look less perceptible."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_d94a2f: "Mingmin: You're not reacting. Maybe the mushroom is not poisonous after all. Maybe I should try one..."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_dab64a: "Mingmin: Green Potion"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_db08d6: "Mingmin: I feel like something's going to appear in front of our eyes with a loud pop."
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_ec95e4: "Mingmin: Chica, chica~"
  npc_override_1@jtb_NightmarishJitterbug_menu_mingmin_f7fdb0: "Mingmin: Hm?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_075aaf: "Newoz: Wah! Jeez!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_08d2b1: "Newoz: Whew, it's you Jack. Long time, no see, everyone."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_10cfca: "Newoz: Do you think it's meaningless for us to go deeper?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_127bf7: "Newoz: Thanks. I'm glad my contingency plan is still in place."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_12c8ce: "Newoz: Weren't you in danger?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_1bbcc4: "Newoz: This was my first adventure with my old friends in a long time. I hope we can do this again soon."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_20702f: "Newoz: I have to find her. I have to talk to her."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_24c867: "Newoz: Um, how did I manage to lose the others again?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_2f6065: "Newoz: Hah hah, you're cute. I'll sing for you later."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_2f8892: "Newoz: Bye."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_31d87d: "Newoz: I like his spirit, though I can see he's getting exhausted."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_3402d6: "Newoz: We have to find Shaloshi!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_34e672: "Newoz: Hm, to each his own."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_396e7c: "Newoz: We should find her."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_3a52c8: "Newoz: Don't worry. I'll help you!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_3aacae: "Newoz: Ah, I'm getting hungry. The monsters can screw themselves. Shaloshi, let's go!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_3c2b97: "Newoz: I'm all right. Rot, were you worried about me?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_3c401e: "Newoz: Thanks."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_413491: "Newoz: The pitch darkness... Don't you remember anything else?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_4215ee: "Newoz: Gimmie five!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_45eb7d: "Newoz: Well, if I can't talk him out of this, then we'll have to duke it out."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_4ade72: "Newoz: Hah hah, don't worry, little ladies. I'll protect you."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_53df38: "Newoz: Oh, that's right. Since I'm no longer the master, my contract has expired naturally."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_541703: "Newoz: The pitch darkness... The cave is bright throughout, aside from the fog."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_58fe92: "Newoz: {0}, do you have a favorite song?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_59fc46: "Newoz: And you have them. Us."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_5b6804: "Newoz: So I was right about this place being maze-like. Ugh, I'm getting hungry again."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_5c08f4: "Newoz: Heh, my instincts told me to slow down because danger was ahead."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_5f7dc5: "Newoz: !!!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_5fda0a: "Newoz: The seasons are changing once again~ yet I haven't had a chance to dye my nails with garden balsam~"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_665ad1: "Newoz: I can! Mingmin drank the Poison Bottle I found on the street and died; I told you it was expensive, and I didn't say anything about it being good for your health."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_6dda71: "Newoz: No, Shaloshi. As of today, you're a new member of Newoz's White Wings Guild."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_6eaeef: "Newoz: Arang! Shaloshi!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_71622a: "Newoz: Strange... The atmosphere has changed."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_72836e: "Newoz: A voice before my singing. It's possible someone else might be in here."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_72e68a: "Newoz: Let's begin!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_77787c: "Newoz: The monster?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_7d541d: "Newoz: Yeah, you don't have to tell me that."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_80126a: "Newoz: Oh, congratulations, Master."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_8bed94: "Newoz: Hah hah, this is embarassing, but thank you."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_8f6d8e: "Newoz: Aigu is the Rune-Midgarts' hottest singer at this moment!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_90828b: "Newoz: Did you take care of them already? I wanted to take part in it!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_964bc2: "Newoz: Sorry. This place is like a maze. There are so many offshoots and clearings that I've lost count."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_986a75: "Newoz: It seems everyone's here."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_994876: "Newoz: What did the farmer say to the green pumpkin? Why orange you orange?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_9f2009: "Newoz: *Pant Pant* I'm glad you didn't make it too far."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_b1258a: "Newoz: What? Did you change the guild name?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_b5db1d: "Newoz: Oh, hello. May I ask who you are, little lady?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_b98f5d: "Newoz: These monsters don't stop coming. But where are all the big, rare, beautiful ones?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_bc51bb: "Newoz: Are we still in danger?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c035a5: "Newoz: Having you two with me brings back a lot of memories."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c2519a: "Newoz: Oh, do you mean this ukulele?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c3e6b5: "Newoz: I keep losing the others. They were right in front of me."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c419d6: "Newoz: Shaloshi, do you have a favorite song?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c62008: "Newoz: *Pant Pant* I've found you, Shaloshi."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_c9587d: "Newoz: Oh, I remember! Ah, good times!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ccfff0: "Newoz: Hello, Arang. How's Arirang? Heh. What brings you here?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_cfb644: "Newoz: I know. You don't have to remind me."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_d09730: "Newoz: Where are the others? Hey new guys, help me out here. That Ferre looks like he can pack a punch."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_d60679: "Newoz: Arang, let's go. It's time for an adventure!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_dc6b84: "Newoz: That reminds me, when Rot was younger..."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_dd17da: "Newoz: You're Lagi, right? I like the way you think. I'd love to work with you sometime."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_e32e52: "Newoz: You don't have to get upset. I'm not here to take your friend away. I just want..."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_e6b84c: "Newoz: W-whazza...?! Don't be ridiculous. I just found her now."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_e8223b: "Newoz: I guess jobs don't matter so long as you can sing and play, huh?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ea6b74: "Newoz: You have good taste. This just came to my mind. Listen."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_eb2577: "Newoz: You know her debut song. You're a fan of her, huh?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ed1e10: "Newoz: What does a nosy pepper do? Gets jalapeno business!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ed6eb3: "Newoz: Or otherworldly."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ed9acc: "Newoz: You're good. You'll make great a Gypsy and Minstrel."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_ee3e41: "Newoz: Why do bananas wear suntan lotion? Because they peel!"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_f1895e: "Newoz: Yeah, what's up?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_f2f936: "Newoz: I'm not your master anymore. You don't have to follow me."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_f4b5fb: "Newoz: Argh, is there a ghost? Or am I hearing things?"
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_f88592: "Newoz: I'll explain everything. And enough with the poisonous mushrooms. I can't eat mushrooms at all."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_f8b736: "Newoz: Hah hah, I'll teach you how to do it later, Shaloshi."
  npc_override_1@jtb_NightmarishJitterbug_menu_newoz_fa94e8: "Newoz: Right, that's what she said."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_0037b3: "{0} : We're happy."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_163774: "{0} : You don't even know if I have one."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_17f24e: "{0} : I like Aigu's debut song, Lost Poring."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_207369: "???: ......"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_3e9f89: "{0} : I like Aigu's single, Only I Didn't Know about the Card Album."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_458093: "???: ..."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_4d0af3: "???: Can't remember a thing."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_510d06: "{0} : My love is unrequited."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_5a17f7: "{0} : I like your Red Potion (feat. Muka)."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_7efbaa: "???: Voice of a man..."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_8588c7: "???: But I'm not alone."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_8e6bb9: "{0} : Awesome, indeed!"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_98101b: "{0} : You just made up those words to look cool!"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_aab0d1: "{0} : Maybe she heard her own thoughts."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_adbe9e: "???: Dance..."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_b14955: "{0} : Maybe she was talking with someone."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_b7c197: "???: Aigu and Runane are good."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_be6ff2: "???: Ask many questions."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_c1da29: "???: The one who sings."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_c27e15: "???: What is it?"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_d4b99c: "???: Your hand is... warm."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_d79052: "???: No idea. How did you get in?"
  npc_override_1@jtb_NightmarishJitterbug_menu_options_e8e4f1: "???: I'm not alone."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_ed441a: "{0} : I like your Laggi's self-composed song, Accidental Moonlight."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_f2a07b: "???: Kind."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_f39449: "???: Man with the singing voice."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_fb32fd: "???: I'm okay. Not the first time."
  npc_override_1@jtb_NightmarishJitterbug_menu_options_feb88c: "???: Can't answer."
  npc_override_1@jtb_NightmarishJitterbug_menu_party_2e5e7f: "Party Name: {0}"
  npc_override_1@jtb_NightmarishJitterbug_menu_party_8c7899: "Party Leader: {0}"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_0076b4: "Roel: But you're singing a strange song, and... Green Potion?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_23418f: "Roel: She could have had her eyes closed. Perhaps she's sleeping."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_2439e8: "Roel: ..."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_268473: "Roel: Green Potion?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_351c82: "Roel: Let me go look for possible threats."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_3de954: "Roel: Sorry. I won't disappoint you again."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_43fb27: "Roel: H-hello, my name is Roel. Runane and I've joined the guild together. Nice to meet you."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_44e243: "Roel: What are you trying to feed this child? What's in this green bottle? ...No..."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_4e8bdd: "Roel: CROSS!!!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_60b548: "Roel: We've practiced hard."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_675223: "Roel: How about I be your friend?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_740455: "Roel: Shaloshi, I don't care who you are. You're my friend, and I'm yours."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_8a451e: "Roel: Gelka, get ready!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_8c4d61: "Roel: But now..."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_8e63ef: "Roel: Last bastion!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_8ec3da: "Roel: They look cute, but they're ferocious."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_928233: "Roel: I hope you'll teach me too, Roter."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_9972f4: "Roel: Comrades should not fight with each other."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_a375c5: "Roel: Impenetrable defense! Roel-style Guard!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_b08e81: "Roel: Ferre?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_b2da90: "Roel: By the gods, Gelka, you're awesome!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_c72bf3: "Roel: Newoz, did you know this would happen? You're lucky to have such good friends."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_d07ff1: "Roel: Could she have lost her memory? It seems she doesn't understand danger, it seems."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_d35363: "Roel: She could have been terrified."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_d8dc27: "Roel: (She's kind!)"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_e020df: "Roel: I'm not a fan of it."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_e879c7: "Roel: Perhaps it's monsters. Do you want me to go check?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_ea0852: "Roel: But it stayed long enough for us to lose each other."
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_ec0346: "Roel: Green Potion is such a bitter... Um, Green Potion you said?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_f24875: "Roel: (She's hawt when she's angry!)"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_f46a2c: "Roel: Worry not--I'll protect you!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_f9e1bc: "Roel: (She's just my type!)"
  npc_override_1@jtb_NightmarishJitterbug_menu_roel_ff1479: "Roel: Let's go."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_020b9d: "Roter: MOROCC?!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_0488ed: "Roter: Oh, shut it, both of you!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_0ade04: "Roter: Who says you can invite her? I'm not taking in a demon!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_0f1fab: "Roter: Stop pretending you care about me! I can take care of myself!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_14c1df: "Roter: ..."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_1e992e: "Roter: Don't look at me. Is that an exit?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_2d399c: "Roter: Can't you think of a nice memory?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_36a498: "Roter: Shush! We've had enough for a day. You all are dismissed! This concludes the adventure of Roter's Super Critical Guild!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_391318: "Roter: Of course! Now it's called... Um..."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_418584: "Roter: Enough. He's just an idiot with no sense of direction."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_43699e: "Roter: Nope, I'm going to call it Roter's Super Critical Guild!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_46781e: "Roter: Scatter--Thousand Flashlights!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_468fc0: "Roter: It seems as though we're underwater, yet I don't feel it."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_4fdcf9: "Roter: He's just being lazy. He's not so weak."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_5238fb: "Roter: We'll split into two teams. Be careful not to lose your way in the maze-like offshoots."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_57d4f7: "Roter: Am I the only one not happy about this conversation?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_5ff0d1: "Roter: NEWOZ!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_78bcd2: "Roter: I told you, Newoz. We can't just let this go."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_798237: "Roter: Hey, what have you been reading these days?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_7fde07: "Roter: Newoz. Need I remind you this guild is no longer called Newoz's White Wings?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_84248f: "Roter: I'm the guild master! I name it whatever I want!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_86aa8d: "Roter: Newoz, you're like a magnet for crazy."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_87197d: "Roter: Argh!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_896d38: "Roter: I was as stubborn as a mule and busy pretending like I knew what I was doing."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_929002: "Roter: Do you not have any good memories of us?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_9c05a2: "Roter: ...That wasn't what I expected. Aren't you upset at all?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_a314d7: "Roter: We're going to be buried in here. Let's find an exit."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_a37666: "Roter: He's not dead. Guys, I understand you're new, but you can't make mistakes like this."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_a50383: "Roter: Newoz, you're alive! Good, because I'm going to kill..."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_a5e76c: "Roter: In accordance with the Guild Policy, Article 8, I'm now the master of this guild, and you're just a member."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_aac83e: "Roter: We'll find Newoz and Shaloshi. And when we do, I'm going to kill both of them."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_b1e2fd: "Roter: Stop talking and get ready to practice your special skills."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_b6f968: "Roter: Newoz, do you know how long you've been missing? We even recruited new guildsmen to find you, and..."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_b91ad3: "Roter: Hm, not good enough, Gelka. Don't let the guild business distract you from practice."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_ceb4e9: "Roter: CROSS!!!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_cfef9c: "Roter: Protect you from what?"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_d19727: "Roter: Where are the others? This is definitely not a run-of-the-mill cave."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_d3fa59: "Roter: I'll kill you both before the monster."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_dcc64b: "Roter: Gelka, Ultra Special Skill No. 8: Wild Dance!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_df234a: "Roter: Delicate Flashlight, Lumiere Dupleix!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_e5af4a: "Roter: You can't do that!"
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_f0650f: "Roter: I should have plenty of time before that to get rid of you. I'll show you why I'm called the Bad Boy of the Exorcist World."
  npc_override_1@jtb_NightmarishJitterbug_menu_roter_f6f8aa: "Roter: That does it! I'm leaving!"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_0685e7: "Runane: You stay here, kiddo. I'll go."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_091958: "Runane: *Blow*"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_0a1ba4: "Runane: Don't put too much faith in this kid. I'd better go look for Newoz."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_0daed6: "Runane: There's nothing about you I like."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_1c5ec5: "Runane: I'm fine. I told you to be careful, kiddo!"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_1cae58: "Runane: I know--he'll say no if I ask him out."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_20e814: "Runane: There's something! SOMETHING!"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_225486: "Runane: Stop making things awkward! We're about the same age, so we're friends already."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_34506a: "Runane: The fog cleared up."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_356b28: "Runane: That's right. I like you better when you listen to me."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_371741: "Runane: I said Green Potion!"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_4a9141: "Runane: Her name is Shaloshi? I asked her several times, and she didn't tell me."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_4f9c60: "Runane: Push, push~"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_53b8bc: "Runane: I've joined this guild to meet you, Newoz. Do you have a girlfriend?"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_583fe7: "Runane: Hmpf, I hate girls. I get the feeling we'll be seeing even more monsters."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_5dbf09: "Runane: Do you know Newoz? Let's take him out of here."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_620c52: "Runane: Pam, pam, pam~"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_627201: "Runane: I think she has."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_733f6f: "Runane: Don't call my hero that! ...But I agree with you."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_754e35: "Runane: Don't mistake this for anything more than what it is--babysitting!"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_812400: "Runane: I don't think he knows that. Do you, Newoz?"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_83f252: "Runane: Um, I have a feeling something might spring out of nowhere to attack us."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_89a23e: "Runane: Let's make a truce for now. But make no mistake--Newoz is mine the moment I find him vulnerable."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_8c6e58: "Runane: I'm not interested in that kid."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_8cabd3: "Runane: Maybe Newoz is not interested in dating."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_8e5c74: "Runane: But you haven't tried to talk to him. I mean seriously, have you?"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_9cfcfe: "Runane: I just don't like the name."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_a7dbbc: "Runane: Listen, humans and monsters can't be friends. At least that's what I think."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_ac330f: "Runane: We got lost and now we're in a rift in spacetime. How did this happen?"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_b108a0: "Runane: *Shriek*"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_b153df: "Runane: Don't you dare take away my Newoz!"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_bbd50b: "Runane: *Snort* Then he's fair game!"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_cd1043: "Runane: No, they're not. Friends don't attack each other!"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_cfe802: "Runane: Dorky."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_d7876f: "Runane: Hi, nice to meet you. I'm honored to meet the famous Newoz in person."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_d97e48: "Runane: !!!"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_e49262: "Runane: They're monsters, not your friends. Be careful."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_f20bb8: "Runane: Where's everyone? Have they gone somewhere else? Let's go in that direction."
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_f2f049: "Runane: Comrades, who? We're just a bunch of strangers hell-bent on saving a lost girl!"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_fa3116: "Runane: Enough! Stop being disrespectful to Newoz!"
  npc_override_1@jtb_NightmarishJitterbug_menu_runane_fc797e: "Runane: Are you drinking it yet?"
  npc_override_1@jtb_NightmarishJitterbug_menu_scene_3ca5ad: "Scene 8: Heroes are surrounded by a horde of enemies. Roel, let's choreograph what we've practiced today, shall we?"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_00ed07: "Shaloshi: Comrades should not fight with each other. Got it."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_03688a: "Shaloshi: Roel and Runane are hurt."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_068960: "Shaloshi: NO! He's my friend!"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_06e998: "Shaloshi: I'm Shaloshi. Sing for me."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_07d884: "Shaloshi: You just thought, 'take me, too!'"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_0c6779: "Shaloshi: I thought someone made my wish come true."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_0d6ebe: "Shaloshi: I remembered a few things."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_17a647: "Shaloshi: Here they come..."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_17e139: "Shaloshi: This is not good. Ferre..."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_1f5b0d: "Shaloshi: I shouldn't have led you here, but I really wanted some friends."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_21b4e6: "Shaloshi: The Ferres are angry."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_2306c7: "Shaloshi: ...Thank you."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_25a237: "Shaloshi: ...I'm free now, but that doesn't change who I am: a demon."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_32b229: "Shaloshi: (Friends... Rivalry...)"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_3a8310: "Shaloshi: Okay."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_48c5a3: "Shaloshi: Ferre is angry."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_4d4768: "Shaloshi: She's not happy with him, but she still treats him really well."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_52c9de: "Shaloshi: Monsters..."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_558531: "Shaloshi: Ferre created this space in the Crack for me. If he loses his mind or perishes, this space will disappear with everything in it."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_562d0d: "Shaloshi: They're my friends."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_589e6a: "Shaloshi: Runane sings even whistles good, too."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_62f93c: "Shaloshi: Newoz, did you just think everyone except Rot is mediocre?"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_63fc78: "Shaloshi: In the pitch darkness, I heard a voice. It was low, but it was ringing for a while."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_6bcc15: "Shaloshi: They emit 'ferre, ferre,' so I call them Ferres."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_6cda6c: "Shaloshi: No, no!"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_6d95f9: "Shaloshi: Now I should be honest with you. I remember everything now. Let me introduce myself again."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_76a4c6: "Shaloshi: You're strange."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_7735a9: "Shaloshi: Ferre?"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_7a3d00: "Shaloshi: Ferre, you don't have to do this!"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_7fc673: "Shaloshi: I think I have the ability to take people with me, wherever I go. Or you wouldn't have followed me this far."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_819d49: "Shaloshi: I enjoyed your company. If we meet again... Will we be enemies?"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_84acf5: "Shaloshi: My instincts just told me Newoz is not strong."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_8779ce: "Shaloshi: Thank you. If only I knew how to express my feelings..."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_9688d0: "Shaloshi: You promised. You're kind."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_9f0dd0: "Shaloshi: Danger, no."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_9f67a7: "Shaloshi: Love your song."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_a1d1ad: "Shaloshi: Before Aigu and Runane,"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_a4dfe4: "Shaloshi: Ferre is really angry."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_a88fa0: "Shaloshi: Ferre has transformed into its true form!"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_ac1e83: "Shaloshi: They did nothing but croaked."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_ac8f41: "Shaloshi: ..."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_b28e46: "Shaloshi: (Can't be friends.)"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_be2adc: "Shaloshi: The Ferres showed up first."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_c2d764: "Shaloshi: She's blushing."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_c415b2: "Shaloshi: You protect me. You're kind."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_cd55a2: "Shaloshi: They're just trying to protect me."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_d85164: "Shaloshi: Small friends follow us. Not cute."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_d9e7c4: "Shaloshi: ...Thank you, Adventurer Newoz. If I find some interesting place, can I invite you over?"
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_df8e7f: "Shaloshi: Later I heard Newoz singing while waiting for his friends. His voice warmed me."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_e05a3c: "Shaloshi: I'm Shaloshi, a demon mind reader and the third agent of Morocc's."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_e1cf57: "Shaloshi: No."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_e3da25: "Shaloshi: Can't be friends."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_e98d92: "Shaloshi: Newoz..."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_e9c669: "Shaloshi: Aigu and Runane showed up."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_ed022c: "Shaloshi: They're my friends. They don't bite or hurt me."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_edcf10: "Shaloshi: I didn't know what friends meant, but it sounded good. I wanted it."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_fbba67: "Shaloshi: If I take Ferre with me to a different space, then a number of exits will appear in the loosened rift in spacetime."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_fbd5a8: "Shaloshi: From what Rot is thinking."
  npc_override_1@jtb_NightmarishJitterbug_menu_shaloshi_fca32d: "Shaloshi: Bye, friends. I hope we'll meet again soon."
  npc_override_1@jtb_NightmarishJitterbug_menu_slot_f2ea87: "Slot: 1"
  npc_override_1@jtb_NightmarishJitterbug_mingmin_shoves_mushroom_c406ba: "- Mingmin shoves a mushroom into your mouth. -"
  npc_override_1@jtb_NightmarishJitterbug_mingmin_thinks_phenomeno_439dc6: "Mingmin thinks the phenomenon has something to do with the Dimensional Crack and Shaloshi's ability."
  npc_override_1@jtb_NightmarishJitterbug_monster_649f1b: "The monster?"
  npc_override_1@jtb_NightmarishJitterbug_monster_um_s_just_woman_11d5c3: "MONSTER-! ...Um, it's just a woman."
  npc_override_1@jtb_NightmarishJitterbug_monsters_d0060b: "Monsters..."
  npc_override_1@jtb_NightmarishJitterbug_monsters_started_appeari_e6da31: "Monsters started appearing, and their number is growing quickly."
  npc_override_1@jtb_NightmarishJitterbug_morocc_61cb82: "MOROCC?!"
  npc_override_1@jtb_NightmarishJitterbug_msg_61ce5a: "[{0}]"
  npc_override_1@jtb_NightmarishJitterbug_msg_6eae3a: "..."
  npc_override_1@jtb_NightmarishJitterbug_msg_9a7b00: "!!!"
  npc_override_1@jtb_NightmarishJitterbug_msg_b4613f: "!!"
  npc_override_1@jtb_NightmarishJitterbug_mushroom_poisonous_life_c85500: "This mushroom is poisonous, but not life threatening. Do you want to have a bite?"
  npc_override_1@jtb_NightmarishJitterbug_my_first_adventure_as_me_002278: "It was my first adventure as a member of White Wings. I can't wait for the next one!"
  npc_override_1@jtb_NightmarishJitterbug_my_first_adventure_my_ol_edaa38: "This was my first adventure with my old friends in a long time. I hope we can do this again soon."
  npc_override_1@jtb_NightmarishJitterbug_my_instincts_just_told_m_c9f093: "My instincts just told me Newoz is not strong."
  npc_override_1@jtb_NightmarishJitterbug_my_love_unrequited_99f6f8: "My love is unrequited."
  npc_override_1@jtb_NightmarishJitterbug_never_let_your_guard_dow_d46330: "Never let your guard down while exploring, or you can get hurt."
  npc_override_1@jtb_NightmarishJitterbug_newoz_2646e2: "NEWOZ!"
  npc_override_1@jtb_NightmarishJitterbug_newoz_33987e: "Newoz!"
  npc_override_1@jtb_NightmarishJitterbug_newoz_9bad02: "Newoz."
  npc_override_1@jtb_NightmarishJitterbug_newoz_avid_adventurer_wh_cc4e9b: "Newoz is an avid adventurer who never stays in one place long enough; a lot of people claimed they saw him, yet none of them remembered where he went."
  npc_override_1@jtb_NightmarishJitterbug_newoz_df8c68: "Newoz..."
  npc_override_1@jtb_NightmarishJitterbug_newoz_did_you_just_think_83c86e: "Newoz, did you just think everyone except Rot is mediocre?"
  npc_override_1@jtb_NightmarishJitterbug_newoz_did_you_know_happe_138d65: "Newoz, did you know this would happen? You're lucky to have such good friends."
  npc_override_1@jtb_NightmarishJitterbug_newoz_i_love_you_dc6ed9: "Newoz, I love you!"
  npc_override_1@jtb_NightmarishJitterbug_newoz_i_m_coming_you_76f1f9: "Newoz, I'm coming with you!"
  npc_override_1@jtb_NightmarishJitterbug_newoz_i_ve_known_you_0bcd54: "Newoz, I've known you're weird in the head, but she's..."
  npc_override_1@jtb_NightmarishJitterbug_newoz_need_i_remind_you_5ffa41: "Newoz. Need I remind you this guild is no longer called Newoz's White Wings?"
  npc_override_1@jtb_NightmarishJitterbug_newoz_never_tactful_dc3bd0: "Newoz is never tactful."
  npc_override_1@jtb_NightmarishJitterbug_newoz_s_enthusiasm_adven_b9fe53: "Newoz's enthusiasm for adventure went overboard. Again. I can't say I hate that about him, though."
  npc_override_1@jtb_NightmarishJitterbug_newoz_s_hand_hot_70b9a3: "Newoz's hand... hot."
  npc_override_1@jtb_NightmarishJitterbug_newoz_s_red_potion_feat_12e38a: "Newoz's Red Potion (feat. Muka)"
  npc_override_1@jtb_NightmarishJitterbug_newoz_where_did_you_go_40d99f: "Newoz! Where did you go this time?"
  npc_override_1@jtb_NightmarishJitterbug_newoz_you_all_right_9b8740: "Newoz, are you all right?"
  npc_override_1@jtb_NightmarishJitterbug_newoz_you_know_how_long_d6d562: "Newoz, do you know how long you've been missing? We even recruited new guildsmen to find you, and..."
  npc_override_1@jtb_NightmarishJitterbug_newoz_you_re_alive_good_1fc6e4: "Newoz, you're alive! Good, because I'm going to kill..."
  npc_override_1@jtb_NightmarishJitterbug_newoz_you_re_like_magnet_a88ba0: "Newoz, you're like a magnet for crazy."
  npc_override_1@jtb_NightmarishJitterbug_newoz_you_t_eat_anything_2c32d5: "Newoz, you can't eat anything but meat. Sigh, I'm glad you're safe."
  npc_override_1@jtb_NightmarishJitterbug_newoz_your_contract_expi_be07d1: "Newoz, your contract has expired at the time you returned to the guild."
  npc_override_1@jtb_NightmarishJitterbug_no_b8b9f1: "No."
  npc_override_1@jtb_NightmarishJitterbug_no_he_s_my_friend_72a98b: "NO! He's my friend!"
  npc_override_1@jtb_NightmarishJitterbug_no_his_adventurer_instin_0bdfb5: "No, his adventurer instincts have gotten rusty."
  npc_override_1@jtb_NightmarishJitterbug_no_i_m_just_saying_15483e: "No. I'm just saying the environmental changes are too drastic, almost like the mood swings of a bipolar person."
  npc_override_1@jtb_NightmarishJitterbug_no_i_m_you_don_662135: "No, I'm not! You don't want me to get angry at you, girl."
  npc_override_1@jtb_NightmarishJitterbug_no_idea_how_did_you_302a91: "No idea. How did you get in?"
  npc_override_1@jtb_NightmarishJitterbug_no_no_16db2c: "No, no!"
  npc_override_1@jtb_NightmarishJitterbug_no_shaloshi_as_today_you_edd392: "No, Shaloshi. As of today, you're a new member of Newoz's White Wings Guild."
  npc_override_1@jtb_NightmarishJitterbug_no_they_re_friends_don_529607: "No, they're not. Friends don't attack each other!"
  npc_override_1@jtb_NightmarishJitterbug_nope_i_m_going_call_fbc3ce: "Nope, I'm going to call it Roter's Super Critical Guild!"
  npc_override_1@jtb_NightmarishJitterbug_now_d74887: "But now..."
  npc_override_1@jtb_NightmarishJitterbug_now_i_should_honest_you_e6e026: "Now I should be honest with you. I remember everything now. Let me introduce myself again."
  npc_override_1@jtb_NightmarishJitterbug_oh_both_them_left_ed2d7b: "Oh, both of them left."
  npc_override_1@jtb_NightmarishJitterbug_oh_congratulations_maste_b8178a: "Oh, congratulations, Master."
  npc_override_1@jtb_NightmarishJitterbug_oh_did_i_fail_51b25c: "Oh, did I fail?"
  npc_override_1@jtb_NightmarishJitterbug_oh_he_famous_newoz_17784b: "Oh, is he the famous Newoz?"
  npc_override_1@jtb_NightmarishJitterbug_oh_hello_may_i_ask_1ceeb0: "Oh, hello. May I ask who you are, little lady?"
  npc_override_1@jtb_NightmarishJitterbug_oh_i_m_sorry_i_875981: "Oh, I'm sorry, but I'm on the verge of bursting into tears."
  npc_override_1@jtb_NightmarishJitterbug_oh_i_remember_ah_good_83d78c: "Oh, I remember! Ah, good times!"
  npc_override_1@jtb_NightmarishJitterbug_oh_i_remember_funny_10427a: "Oh, I remember! That was funny!"
  npc_override_1@jtb_NightmarishJitterbug_oh_instincts_great_adven_8388fe: "Oh, the instincts of a great adventurer!"
  npc_override_1@jtb_NightmarishJitterbug_oh_s_right_since_i_d8141a: "Oh, that's right. Since I'm no longer the master, my contract has expired naturally."
  npc_override_1@jtb_NightmarishJitterbug_oh_shut_both_you_2e67c9: "Oh, shut it, both of you!"
  npc_override_1@jtb_NightmarishJitterbug_oh_we_ve_got_new_6f757f: "Oh, we've got new members, huh? Great, I have a few mushrooms that I've wanted to sample..."
  npc_override_1@jtb_NightmarishJitterbug_oh_you_mean_ukulele_b85a3e: "Oh, do you mean this ukulele?"
  npc_override_1@jtb_NightmarishJitterbug_oh_you_re_right_72661b: "Oh, you're right!"
  npc_override_1@jtb_NightmarishJitterbug_okay_4371ac: "Okay."
  npc_override_1@jtb_NightmarishJitterbug_okay_take_my_hand_036c7d: "Okay. Take my hand."
  npc_override_1@jtb_NightmarishJitterbug_one_moment_i_had_shalosh_bd90a2: "One moment, I had Shaloshi's hand in my hand, and the next, she's gone."
  npc_override_1@jtb_NightmarishJitterbug_one_my_friends_once_set_f93881: "One of my friends once set me up on a blind date in Izlude."
  npc_override_1@jtb_NightmarishJitterbug_one_who_sings_408656: "The one who sings."
  npc_override_1@jtb_NightmarishJitterbug_ooh_like_reenacting_scen_88c949: "Ooh, this will be like reenacting a scene from the book, where monsters are rampaging."
  npc_override_1@jtb_NightmarishJitterbug_oooh_you_ve_got_some_0f5267: "Oooh, you've got some nice pendants. Do you want to combine them? It's failproof, I guarantee."
  npc_override_1@jtb_NightmarishJitterbug_otherworldly_ca91cc: "Or otherworldly."
  npc_override_1@jtb_NightmarishJitterbug_our_adventure_hasn_t_sta_c7f4a0: "Our adventure hasn't started yet, and I'm already hungry."
  npc_override_1@jtb_NightmarishJitterbug_our_deal_done_let_me_5bbae4: "Our deal is done. Let me think about what I want in return..."
  npc_override_1@jtb_NightmarishJitterbug_over_my_dead_body_061f90: "Over my dead body!"
  npc_override_1@jtb_NightmarishJitterbug_pam_pam_pam_7f971f: "Pam, pam, pam~"
  npc_override_1@jtb_NightmarishJitterbug_pam_pam_pam_pam_aa31c3: "Pam, pam, pam, pam~"
  npc_override_1@jtb_NightmarishJitterbug_pant_pant_i_m_glad_9bae3a: "*Pant Pant* I'm glad you didn't make it too far."
  npc_override_1@jtb_NightmarishJitterbug_pant_pant_i_ve_found_dea207: "*Pant Pant* I've found you, Shaloshi."
  npc_override_1@jtb_NightmarishJitterbug_party_entering_d3d912: "{0} of the party, {1}, is entering the {2}."
  npc_override_1@jtb_NightmarishJitterbug_perhaps_s_monsters_you_w_9bb1d3: "Perhaps it's monsters. Do you want me to go check?"
  npc_override_1@jtb_NightmarishJitterbug_pitch_darkness_cave_brig_1ffb09: "The pitch darkness... The cave is bright throughout, aside from the fog."
  npc_override_1@jtb_NightmarishJitterbug_pitch_darkness_don_t_you_28ade3: "The pitch darkness... Don't you remember anything else?"
  npc_override_1@jtb_NightmarishJitterbug_pitch_darkness_i_heard_v_9e9a60: "In the pitch darkness, I heard a voice. It was low, but it was ringing for a while."
  npc_override_1@jtb_NightmarishJitterbug_place_full_mysteries_b597df: "A place full of mysteries."
  npc_override_1@jtb_NightmarishJitterbug_place_gives_me_heebie_je_957a96: "This place gives me the heebie-jeebies."
  npc_override_1@jtb_NightmarishJitterbug_place_like_maze_there_so_4ed813: "This place is like a maze. There are so many offshoots and clearings that I've lost count."
  npc_override_1@jtb_NightmarishJitterbug_place_still_full_things_1be910: "This place is still full of things to study."
  npc_override_1@jtb_NightmarishJitterbug_please_don_t_talk_me_5f6a9b: "Please don't talk to me--I'm hiding for a reason."
  npc_override_1@jtb_NightmarishJitterbug_please_let_there_no_more_ff078e: "Please, let there be no more surprises."
  npc_override_1@jtb_NightmarishJitterbug_please_note_portal_canno_253299: "^ff0000Please note that this portal cannot be accessed for 23 hours after your last access.^000000"
  npc_override_1@jtb_NightmarishJitterbug_please_try_again_cefdd7: "- Please try again -"
  npc_override_1@jtb_NightmarishJitterbug_please_wait_a42633: "^ff0000Please wait.^000000"
  npc_override_1@jtb_NightmarishJitterbug_portal_now_available_use_2636fb: "The portal is now available for use."
  npc_override_1@jtb_NightmarishJitterbug_preparing_dimensional_po_b9f5c3: "^ff0000Preparing the dimensional portal...^000000"
