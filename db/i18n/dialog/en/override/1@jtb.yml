  npc_override_1@jtb_NightmarishJitterbug_where_you_think_newoz_ti_1e9dcd: "Where do you think Newoz is this time?"
  npc_override_1@jtb_NightmarishJitterbug_where_you_think_shaloshi_8d4381: "Where do you think Shaloshi is by now? The space where we met Shaloshi is caught in a time loop, repeating the same events again and again."
  npc_override_1@jtb_NightmarishJitterbug_whew_e64576: "...Whew."
  npc_override_1@jtb_NightmarishJitterbug_whew_s_you_jack_long_2e3395: "Whew, it's you Jack. Long time, no see, everyone."
  npc_override_1@jtb_NightmarishJitterbug_who_says_you_invite_her_1b9b06: "Who says you can invite her? I'm not taking in a demon!"
  npc_override_1@jtb_NightmarishJitterbug_whole_process_painful_if_3b0d94: "The whole process was painful. If it weren't for Runane, we couldn't have Memorized his last location or gotten out of it."
  npc_override_1@jtb_NightmarishJitterbug_worry_i_ll_protect_you_683f00: "Worry not--I'll protect you!"
  npc_override_1@jtb_NightmarishJitterbug_wow_newoz_your_eyes_look_239446: "Wow, Newoz! Your eyes look puffier than ever."
  npc_override_1@jtb_NightmarishJitterbug_wow_place_going_last_lon_c368ea: "Wow, this place is not going to last long--look how violently the ground is shaking! We really need to get out like yesterday, Newoz."
  npc_override_1@jtb_NightmarishJitterbug_wow_you_even_hear_what_19aa07: "Wow, you can even hear what monsters think?"
  npc_override_1@jtb_NightmarishJitterbug_yap_yap_e04a8e: "Yap! Yap!"
  npc_override_1@jtb_NightmarishJitterbug_yeah_what_s_up_bdd438: "Yeah, what's up?"
  npc_override_1@jtb_NightmarishJitterbug_yeah_you_don_t_tell_b184c7: "Yeah, you don't have to tell me that."
  npc_override_1@jtb_NightmarishJitterbug_yes_c53c56: "Yes."
  npc_override_1@jtb_NightmarishJitterbug_yes_master_c5874f: "Yes, Master!"
  npc_override_1@jtb_NightmarishJitterbug_yippee_let_s_go_8a73a2: "Yippee! Let's go!"
  npc_override_1@jtb_NightmarishJitterbug_you_any_good_memories_us_108dbd: "Do you not have any good memories of us?"
  npc_override_1@jtb_NightmarishJitterbug_you_d_better_more_reliab_3cf0fd: "You'd better be more reliable than someone I know."
  npc_override_1@jtb_NightmarishJitterbug_you_d_run_before_everyon_96a52f: "You'd run before everyone else in here. Well, we can't stay here. Let's move on."
  npc_override_1@jtb_NightmarishJitterbug_you_don_t_even_know_dcadf3: "You don't even know if I have one."
  npc_override_1@jtb_NightmarishJitterbug_you_don_t_get_upset_6a6d0a: "You don't have to get upset. I'm not here to take your friend away. I just want..."
  npc_override_1@jtb_NightmarishJitterbug_you_drinking_yet_9ba70b: "Are you drinking it yet?"
  npc_override_1@jtb_NightmarishJitterbug_you_favorite_song_f682b4: "{0}, do you have a favorite song?"
  npc_override_1@jtb_NightmarishJitterbug_you_feel_good_possibly_s_4bc5c5: "- You feel good, possibly a side effect of eating the mushroom. -"
  npc_override_1@jtb_NightmarishJitterbug_you_first_must_form_join_86e369: "^ff0000You first must form/join a party of at least 1 person to enter this dungeon.^000000"
  npc_override_1@jtb_NightmarishJitterbug_you_good_taste_just_came_442bfa: "You have good taste. This just came to my mind. Listen."
  npc_override_1@jtb_NightmarishJitterbug_you_haven_t_tried_talk_e7f703: "But you haven't tried to talk to him. I mean seriously, have you?"
  npc_override_1@jtb_NightmarishJitterbug_you_jitterbug_teeth_d81d70: "Do you have Jitterbug Teeth?"
  npc_override_1@jtb_NightmarishJitterbug_you_just_made_up_those_ba7c9c: "You just made up those words to look cool!"
  npc_override_1@jtb_NightmarishJitterbug_you_just_thought_take_me_6dd2b2: "You just thought, 'take me, too!'"
  npc_override_1@jtb_NightmarishJitterbug_you_know_her_debut_song_d6f081: "You know her debut song. You're a fan of her, huh?"
  npc_override_1@jtb_NightmarishJitterbug_you_know_newoz_let_s_4d290c: "Do you know Newoz? Let's take him out of here."
  npc_override_1@jtb_NightmarishJitterbug_you_ll_okay_aigu_so_ae6e4d: "You'll be okay, Aigu, so long as you stick with us... Um, where's everyone?"
  npc_override_1@jtb_NightmarishJitterbug_you_look_new_around_here_6a95f6: "You look new around here. Nice to meet ya!"
  npc_override_1@jtb_NightmarishJitterbug_you_made_sound_so_diffic_731188: "You made it sound so difficult, when you could just say, 'give and take.'"
  npc_override_1@jtb_NightmarishJitterbug_you_might_different_expe_e75cc7: "You might have a different experience this time in this place full of unfathomable mysteries. Please ask Runane to open the portal for you."
  npc_override_1@jtb_NightmarishJitterbug_you_moron_s_worth_nothin_ad8fdd: "You moron, that's worth nothing. Your contract has expired, but a promise is a promise and I intend to keep it."
  npc_override_1@jtb_NightmarishJitterbug_you_must_level_dc71e3: "^ff0000You must be Level 120.^000000"
  npc_override_1@jtb_NightmarishJitterbug_you_promised_you_re_kind_eb1407: "You promised. You're kind."
  npc_override_1@jtb_NightmarishJitterbug_you_protect_me_you_re_7f78e0: "You protect me. You're kind."
  npc_override_1@jtb_NightmarishJitterbug_you_re_braver_than_i_bf78eb: "You're braver than I thought."
  npc_override_1@jtb_NightmarishJitterbug_you_re_famous_newoz_nice_04d84f: "You're the famous Newoz! Nice to meet you. My master told me many great things..."
  npc_override_1@jtb_NightmarishJitterbug_you_re_good_you_ll_cddfe3: "You're good. You'll make great a Gypsy and Minstrel."
  npc_override_1@jtb_NightmarishJitterbug_you_re_lagi_right_i_5e8e61: "You're Lagi, right? I like the way you think. I'd love to work with you sometime."
  npc_override_1@jtb_NightmarishJitterbug_you_re_prospect_now_work_7167aa: "You're a prospect for now. Work hard for the guild, and I might promote you one day."
  npc_override_1@jtb_NightmarishJitterbug_you_re_reacting_maybe_mu_573007: "You're not reacting. Maybe the mushroom is not poisonous after all. Maybe I should try one..."
  npc_override_1@jtb_NightmarishJitterbug_you_re_singing_strange_s_d47767: "But you're singing a strange song, and... Green Potion?"
  npc_override_1@jtb_NightmarishJitterbug_you_re_smart_capable_tel_cbb7be: "You're smart and capable of teleportation. Roter, we can't let her go."
  npc_override_1@jtb_NightmarishJitterbug_you_re_spoilsport_you_kn_0b53f2: "You're a spoilsport, you know that?"
  npc_override_1@jtb_NightmarishJitterbug_you_re_strange_b1a877: "You're strange."
  npc_override_1@jtb_NightmarishJitterbug_you_ready_yet_you_give_2d8f1c: "Are you ready yet? You can give up if you're not confident."
  npc_override_1@jtb_NightmarishJitterbug_you_really_ask_who_s_41849a: "Do you really have to ask? Who's that girl? Is she yours?"
  npc_override_1@jtb_NightmarishJitterbug_you_remember_when_you_tw_d5abbf: "Do you remember when you two fought over that florist girl at the southern gate of Prontera? Or when the doll merchant at the eastern gate whupped you for bickering and driving his customers away?"
  npc_override_1@jtb_NightmarishJitterbug_you_seem_fond_roel_f8c7a7: "You seem to be fond of Roel."
  npc_override_1@jtb_NightmarishJitterbug_you_seen_pendant_b600de: "Have you seen this pendant?"
  npc_override_1@jtb_NightmarishJitterbug_you_seen_shaloshi_where_cdb20b: "Have you seen Shaloshi? Where is she?"
  npc_override_1@jtb_NightmarishJitterbug_you_serious_even_people_e8fd2e: "Are you serious? Even people like you have found their love. What about me?!"
  npc_override_1@jtb_NightmarishJitterbug_you_speak_like_grown_up_353bba: "You speak like a grown-up now, all smooth and clear."
  npc_override_1@jtb_NightmarishJitterbug_you_stay_here_kiddo_i_83a32f: "You stay here, kiddo. I'll go."
  npc_override_1@jtb_NightmarishJitterbug_you_t_a9f406: "You can't do that!"
  npc_override_1@jtb_NightmarishJitterbug_you_talk_you_hear_other_bc87c8: "You can talk and you can hear other people's thoughts. Brilliant."
  npc_override_1@jtb_NightmarishJitterbug_you_them_us_fae0e0: "And you have them. Us."
  npc_override_1@jtb_NightmarishJitterbug_you_think_s_meaningless_657045: "Do you think it's meaningless for us to go deeper?"
  npc_override_1@jtb_NightmarishJitterbug_you_ve_met_him_today_f1436a: "You've met him today, but you should know unless you're stupid."
  npc_override_1@jtb_NightmarishJitterbug_your_hand_warm_abeb99: "Your hand is ... warm."
  npc_override_1@jtb_NightmarishJitterbug_your_party_leader_yet_cr_87fed9: "^ff0000Your party leader has not yet created a Time Crack.^000000"
