  npc_override_1@jtb_NightmarishJitterbug_what_89511a: "What is it?"
  npc_override_1@jtb_NightmarishJitterbug_what_be65b9: "What?"
  npc_override_1@jtb_NightmarishJitterbug_what_did_you_change_guil_d913c6: "What? Did you change the guild name?"
  npc_override_1@jtb_NightmarishJitterbug_what_did_you_expect_all_fcda21: "What did you expect? All he thinks about is adventure, monsters, and treasure."
  npc_override_1@jtb_NightmarishJitterbug_what_difficult_task_i_se_691940: "What a difficult task. I searched from this end to that end of the world, and could find neither hide nor hair of him."
  npc_override_1@jtb_NightmarishJitterbug_what_exactly_am_i_offeri_b34669: "What exactly am I offering? Gigantic Bow, Storm Bow, and ^FF0000other valuable things found in this space.^000000 If you want them, bring me at least 50 Jitterbug Teeth."
