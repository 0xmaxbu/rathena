Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_te_prtcas01_te_goditem_prt01_ah_master_ccdda3: "Ah... Master."
  npc_override_te_prtcas01_te_goditem_prt01_ah_stop_following_me_aro_a71bd7: "Ah stop following me around!"
  npc_override_te_prtcas01_te_goditem_prt01_also_keep_mind_fact_i_755e93: "Also, keep in mind the fact that I can only do this once a week."
  npc_override_te_prtcas01_te_goditem_prt01_also_place_where_you_fin_65140f: "Also, a place where you can find materials for {0}..."
  npc_override_te_prtcas01_te_goditem_prt01_although_i_managed_escap_b2ede4: "... Although I managed to escape from them again..."
  npc_override_te_prtcas01_te_goditem_prt01_am_i_having_some_kind_738bf7: "Am I having some kind of a health problem?"
  npc_override_te_prtcas01_te_goditem_prt01_before_girls_find_us_eca310: "Before the girls find us..."
  npc_override_te_prtcas01_te_goditem_prt01_bronze_bars_magical_powe_fc9d6f: "4 Bronze bars with magical power"
  npc_override_te_prtcas01_te_goditem_prt01_commerce_level_gets_decr_ace11d: "Commerce Level gets decreased to 0 since current level is lower than 30."
  npc_override_te_prtcas01_te_goditem_prt01_could_you_check_again_i_af210c: "Could you check again? I'll give you the list of what we need."
  npc_override_te_prtcas01_te_goditem_prt01_course_i_ll_make_jormung_6c090e: "and of course, I'll make Jormungand as soon as we gather all the materials needed."
  npc_override_te_prtcas01_te_goditem_prt01_did_you_hear_news_c50e92: "Did you hear the news?"
  npc_override_te_prtcas01_te_goditem_prt01_don_t_worry_about_me_f7c190: "Don't worry about me."
  npc_override_te_prtcas01_te_goditem_prt01_essence_rune_6b8236: "For Essence of Rune,"
  npc_override_te_prtcas01_te_goditem_prt01_essence_rune_you_need_co_477ac5: "For Essence of Rune, you need to ^4d4dffcombine 200 Ancient Rough Runestones and 100 Mystic Rough Runestones^000000."
  npc_override_te_prtcas01_te_goditem_prt01_essential_material_makin_0bc62c: "It is an essential material for making Hervor and Jormungand."
  npc_override_te_prtcas01_te_goditem_prt01_even_if_refinement_level_d8b3ec: "^ff0000Even if the refinement level and cards have been applied, the process requires any one of the Valkyrja's Shields you may have."
  npc_override_te_prtcas01_te_goditem_prt01_girls_ad8bc1: "The girls... ?"
  npc_override_te_prtcas01_te_goditem_prt01_girls_coming_750ac5: "The girls are coming."
  npc_override_te_prtcas01_te_goditem_prt01_go_away_a5fb7a: "Go away"
  npc_override_te_prtcas01_te_goditem_prt01_great_power_comes_great_9df890: "With great power comes great responsibility and duty."
  npc_override_te_prtcas01_te_goditem_prt01_hands_d1f891: "at the hands of {0}."
  npc_override_te_prtcas01_te_goditem_prt01_he_s_babbling_now_e1c213: "He's babbling now."
  npc_override_te_prtcas01_te_goditem_prt01_here_7f5577: "Here it is."
  npc_override_te_prtcas01_te_goditem_prt01_hervor_one_most_powerful_1d16bf: "Hervor is one of the most powerful battlegears I make and you deserve to receive something like that from me..."
  npc_override_te_prtcas01_te_goditem_prt01_hervor_shield_blacksmith_8c36c9: "Hervor, a shield that Blacksmith Velund made for his wife Hervor, is finally made"
  npc_override_te_prtcas01_te_goditem_prt01_hervor_shield_named_afte_e831f5: "Hervor is a shield named after Hervor the Valkyrie."
  npc_override_te_prtcas01_te_goditem_prt01_however_okay_if_i_said_8f58aa: "However, would it be okay if I said something?"
  npc_override_te_prtcas01_te_goditem_prt01_however_seems_like_we_ne_24bf39: "However, it seems like we need more materials."
  npc_override_te_prtcas01_te_goditem_prt01_however_you_won_t_able_92996a: "However, you won't be able to find Velund's items."
  npc_override_te_prtcas01_te_goditem_prt01_i_couldn_t_stand_so_0840dc: "I couldn't stand it, so I ran away... but they're here..."
  npc_override_te_prtcas01_te_goditem_prt01_i_didn_t_know_fortress_a0b111: "I didn't know this fortress would have the items that used to belong to Velund, a husband of Hervor..."
  npc_override_te_prtcas01_te_goditem_prt01_i_don_t_think_i_9250d1: "... I don't think I can do anything for a while, whether it's producing or smithing or whatever it is."
  npc_override_te_prtcas01_te_goditem_prt01_i_feel_so_grateful_all_a814f5: "I feel so grateful all the time about you letting me stay here."
  npc_override_te_prtcas01_te_goditem_prt01_i_feel_so_thankful_all_7b6508: "I feel so thankful all the time."
  npc_override_te_prtcas01_te_goditem_prt01_i_finally_breathe_now_d1194e: "I can finally breathe now."
  npc_override_te_prtcas01_te_goditem_prt01_i_had_run_away_because_26267a: "I had to run away because of them..."
  npc_override_te_prtcas01_te_goditem_prt01_i_hope_i_find_way_d2b13f: "I hope I can find that way here."
  npc_override_te_prtcas01_te_goditem_prt01_i_hope_things_stay_as_13defb: "... I hope things stay as peaceful as they are now."
  npc_override_te_prtcas01_te_goditem_prt01_i_like_you_master_basics_26c419: "I would like you to master the basics first."
  npc_override_te_prtcas01_te_goditem_prt01_i_like_you_minimum_quali_ba3073: "but I would like you to have the minimum qualification at least."
  npc_override_te_prtcas01_te_goditem_prt01_i_ll_make_essence_rune_69591b: "I'll make Essence of Rune with the materials you've prepared."
  npc_override_te_prtcas01_te_goditem_prt01_i_ll_make_muspellium_ess_a3c35c: "I'll make Muspellium and Essence of Rune anytime upon your request,"
  npc_override_te_prtcas01_te_goditem_prt01_i_ll_make_muspellium_mat_b8d78b: "I'll make Muspellium with the materials you've prepared."
  npc_override_te_prtcas01_te_goditem_prt01_i_ll_make_you_hervor_214a38: "I'll make you Hervor afterward."
  npc_override_te_prtcas01_te_goditem_prt01_i_ll_start_making_hervor_774396: "I'll start making Hervor as promised."
  npc_override_te_prtcas01_te_goditem_prt01_i_m_all_exhausted_hahaha_ac6873: "I'm all exhausted. Hahaha..."
  npc_override_te_prtcas01_te_goditem_prt01_i_m_also_master_who_bfc2dc: "I'm also a master who pursues the ultimate way."
  npc_override_te_prtcas01_te_goditem_prt01_i_m_glad_i_least_a5b7bf: "I'm glad I can at least do this for you."
  npc_override_te_prtcas01_te_goditem_prt01_i_m_so_exhausted_i_669934: "I'm so exhausted that I can't do anything."
  npc_override_te_prtcas01_te_goditem_prt01_i_m_sorry_i_ll_4fd88d: "I'm sorry. I'll take a break."
  npc_override_te_prtcas01_te_goditem_prt01_i_m_sorry_i_m_988ea0: "I'm sorry that I'm causing you troubles, but my hands are tied."
  npc_override_te_prtcas01_te_goditem_prt01_i_m_sure_he_s_b51a95: "I'm sure he's doing fine just like I am."
  npc_override_te_prtcas01_te_goditem_prt01_i_m_sure_they_re_6c48ce: "I'm sure they're coming to get Hervor."
  npc_override_te_prtcas01_te_goditem_prt01_i_m_tired_little_bit_35fa8f: "I'm tired a little bit."
  npc_override_te_prtcas01_te_goditem_prt01_i_may_look_just_fine_6318b1: "I may look just fine, but I was mentally very tired."
  npc_override_te_prtcas01_te_goditem_prt01_i_mean_if_guild_master_3d2119: "I mean if the guild master wants it."
  npc_override_te_prtcas01_te_goditem_prt01_i_my_reasons_ffa4c5: "I have my reasons."
  npc_override_te_prtcas01_te_goditem_prt01_i_see_you_ve_developed_6df2e0: "I see that you've developed the fortress as you promised."
  npc_override_te_prtcas01_te_goditem_prt01_i_so_overwhelmed_felt_as_53e74d: "I was so overwhelmed that it felt as short as a moment."
  npc_override_te_prtcas01_te_goditem_prt01_i_t_believe_i_m_470013: "I can't believe I'm finally touching these materials myself..."
  npc_override_te_prtcas01_te_goditem_prt01_i_t_tell_how_i_cde1c0: "I can't tell how I feel."
  npc_override_te_prtcas01_te_goditem_prt01_i_think_i_should_rest_267ac8: "I think I should rest for a few days."
  npc_override_te_prtcas01_te_goditem_prt01_if_we_use_them_we_3d8149: "If we use them, we could make Hervor."
  npc_override_te_prtcas01_te_goditem_prt01_if_you_could_just_get_20b537: "If you could just get rid of them... Hervor, that's right! I'll make you Hervor!"
  npc_override_te_prtcas01_te_goditem_prt01_initialize_a459df: "Initialize"
  npc_override_te_prtcas01_te_goditem_prt01_instruction_507ada: "^4d4dff!- Instruction -!"
  npc_override_te_prtcas01_te_goditem_prt01_just_wait_he_ll_calm_101b54: "Just wait and he'll calm down."
  npc_override_te_prtcas01_te_goditem_prt01_leave_me_5e48dd: "Leave it to me."
  npc_override_te_prtcas01_te_goditem_prt01_let_me_give_you_list_e5a4f4: "Let me give you the list of materials if you want."
  npc_override_te_prtcas01_te_goditem_prt01_life_just_so_hard_dc0ccb: "life is... just so hard."
  npc_override_te_prtcas01_te_goditem_prt01_like_dream_place_me_too_4f48eb: "this is like a dream place for me, too."
  npc_override_te_prtcas01_te_goditem_prt01_lower_commerce_level_762bba: "Lower Commerce Level by 30"
  npc_override_te_prtcas01_te_goditem_prt01_make_hervor_325baf: "Make Hervor."
  npc_override_te_prtcas01_te_goditem_prt01_manage_fortress_well_rai_0304c9: "Manage this fortress well and raise ^4d4dffits commerce level by 30 or more^000000."
  npc_override_te_prtcas01_te_goditem_prt01_menu_current_2fcb1a: "Current Status: {0}"
  npc_override_te_prtcas01_te_goditem_prt01_menu_current_94c9ab: "Current Commerce Level of the Fortress:{0}"
  npc_override_te_prtcas01_te_goditem_prt01_menu_modified_00d279: "Modified Commerce Level:{0}"
  npc_override_te_prtcas01_te_goditem_prt01_menu_options_06b634: "3: Quest failed"
  npc_override_te_prtcas01_te_goditem_prt01_menu_options_112cfe: "4: Able to produce items , 5: Items produced successfully."
  npc_override_te_prtcas01_te_goditem_prt01_menu_options_a03d81: "2: Quest in progress"
  npc_override_te_prtcas01_te_goditem_prt01_menu_options_b22cdb: "0: Able to proceed with the quest"
  npc_override_te_prtcas01_te_goditem_prt01_menu_options_cbbc1b: "1: Proceed with the quest. 10-minute wait"
  npc_override_te_prtcas01_te_goditem_prt01_menu_princess_482061: "Princess Status: {0}"
  npc_override_te_prtcas01_te_goditem_prt01_merciless_girls_399964: "The merciless girls!!!"
  npc_override_te_prtcas01_te_goditem_prt01_moreover_you_ve_found_ve_1fc8a7: "Moreover, you've found Velund's items..."
  npc_override_te_prtcas01_te_goditem_prt01_msg_61ce5a: "[{0}]"
  npc_override_te_prtcas01_te_goditem_prt01_muspellium_026a49: "Muspellium"
  npc_override_te_prtcas01_te_goditem_prt01_muspellium_essence_rune_279c62: "1 Muspellium and Essence of Rune, respectively^000000"
  npc_override_te_prtcas01_te_goditem_prt01_no_right_8304d8: "No, right?"
  npc_override_te_prtcas01_te_goditem_prt01_now_actually_right_time_990f57: "Now is actually the right time to make it."
  npc_override_te_prtcas01_te_goditem_prt01_now_i_ll_stay_here_57d937: "From now on, I'll stay here quietly and not interrupt anyone until the siege ends."
  npc_override_te_prtcas01_te_goditem_prt01_now_i_m_scared_girls_e3913d: "Now I'm scared of girls in general... and I'm too scared to do anything..."
  npc_override_te_prtcas01_te_goditem_prt01_oh_no_bdec23: "Oh, no... !"
  npc_override_te_prtcas01_te_goditem_prt01_oh_thank_you_cd310c: "Oh... thank you."
  npc_override_te_prtcas01_te_goditem_prt01_order_make_muspellium_3c2bbc: "In order to make Muspellium,"
  npc_override_te_prtcas01_te_goditem_prt01_order_make_muspellium_yo_f6fe60: "In order to make Muspellium, you need to ^4d4dffcombine 50 Eluniums and 50 Oridecons^000000."
  npc_override_te_prtcas01_te_goditem_prt01_organize_possessions_e92975: "Organize possessions."
  npc_override_te_prtcas01_te_goditem_prt01_password_83fa6b: "password?"
  npc_override_te_prtcas01_te_goditem_prt01_people_say_they_definite_0d5959: "... but people say they definitely appear to those who truly want it. I wish you all the luck."
  npc_override_te_prtcas01_te_goditem_prt01_please_lighten_your_load_73e172: "Please lighten your load and try again."
  npc_override_te_prtcas01_te_goditem_prt01_please_pretend_see_me_4eb328: "Please, pretend not to see me."
  npc_override_te_prtcas01_te_goditem_prt01_please_stop_them_me_196207: "Please, stop them for me!"
  npc_override_te_prtcas01_te_goditem_prt01_please_try_again_after_o_9c762a: "Please try again after organizing your possessions.^000000"
  npc_override_te_prtcas01_te_goditem_prt01_proceed_212bf6: "Do not proceed"
  npc_override_te_prtcas01_te_goditem_prt01_raise_commerce_level_c3ce20: "Raise Commerce Level by 30"
  npc_override_te_prtcas01_te_goditem_prt01_rune_characters_secret_8deda3: "1 Rune characters' Secret"
  npc_override_te_prtcas01_te_goditem_prt01_s_hard_ac1f0c: "it's hard."
  npc_override_te_prtcas01_te_goditem_prt01_s_like_dream_come_true_b652a4: "It's like a dream come true for me... my hands are shaking."
  npc_override_te_prtcas01_te_goditem_prt01_s_nothing_special_if_you_9d111e: "It's nothing special... but if you want, I'll make you tools that could be of use."
  npc_override_te_prtcas01_te_goditem_prt01_s_strange_7be6c3: "It's strange."
  npc_override_te_prtcas01_te_goditem_prt01_shouldn_t_take_long_fbd446: "It shouldn't take long."
  npc_override_te_prtcas01_te_goditem_prt01_since_i_owe_you_big_b3619f: "Since I owe you big time, I'll help you with anything anytime."
  npc_override_te_prtcas01_te_goditem_prt01_so_let_s_get_work_54d858: "... so..let's get the work done."
  npc_override_te_prtcas01_te_goditem_prt01_so_nice_you_say_77ee29: "That is so nice of you to say that."
  npc_override_te_prtcas01_te_goditem_prt01_something_uncurable_a57dd0: "Is it something uncurable?"
  npc_override_te_prtcas01_te_goditem_prt01_soon_girls_after_try_inv_d6d59c: "Soon, 7 girls that are after {0} will try to invade the fortress."
  npc_override_te_prtcas01_te_goditem_prt01_soon_they_started_threat_82e1bd: "soon they started threatening us saying that they need something more powerful in order to become Valkyries."
  npc_override_te_prtcas01_te_goditem_prt01_stop_them_please_d4bfe6: "Stop them. Please!"
  npc_override_te_prtcas01_te_goditem_prt01_surely_takes_lot_07cf2f: "Surely, it takes a lot..."
  npc_override_te_prtcas01_te_goditem_prt01_tell_me_whenever_you_nee_d289fe: "Tell me whenever you need it."
  npc_override_te_prtcas01_te_goditem_prt01_thank_you_edacb9: "Thank you..."
  npc_override_te_prtcas01_te_goditem_prt01_they_always_go_around_gr_12574e: "and they always go around in groups of seven."
  npc_override_te_prtcas01_te_goditem_prt01_they_always_threatened_m_be7d3c: "They always threatened my younger brother Cano and me."
  npc_override_te_prtcas01_te_goditem_prt01_they_girls_who_want_valk_1c3052: "... They are the girls who want to be Valkyries..."
  npc_override_te_prtcas01_te_goditem_prt01_they_ll_get_here_any_d7a822: "They'll get here any minute since they've declared war already."
  npc_override_te_prtcas01_te_goditem_prt01_they_re_here_829e5e: "They're here..!!"
  npc_override_te_prtcas01_te_goditem_prt01_they_satisfied_basic_wea_d2d17e: "They were satisfied with basic weapons at first, but"
  npc_override_te_prtcas01_te_goditem_prt01_time_next_emperium_appea_5d305e: "By the time next Emperium appears, there won't be any chances left."
  npc_override_te_prtcas01_te_goditem_prt01_valkyrja_s_shield_f3662f: "1 Valkyrja's Shield"
  npc_override_te_prtcas01_te_goditem_prt01_valkyrja_s_shield_needed_0f0872: "^ff0000Valkyrja's Shield is needed in the process of making Hervor."
  npc_override_te_prtcas01_te_goditem_prt01_velund_s_anvil_6f186c: "1 Velund's Anvil"
  npc_override_te_prtcas01_te_goditem_prt01_velund_s_bracelet_bc05bc: "3 of Velund's Bracelet"
  npc_override_te_prtcas01_te_goditem_prt01_velund_s_hammer_891702: "^4d4dff2 of Velund's Hammer"
  npc_override_te_prtcas01_te_goditem_prt01_wasn_t_fast_although_we_8baad5: "Wasn't it fast although we had to go through many steps?"
  npc_override_te_prtcas01_te_goditem_prt01_way_i_wonder_how_my_cdd78a: "By the way, I wonder how my younger brother Cano is doing?"
  npc_override_te_prtcas01_te_goditem_prt01_way_muspellium_essence_r_2eafe3: "By the way, Muspellium and Essence of Rune need to be made separately with additional materials."
  npc_override_te_prtcas01_te_goditem_prt01_we_need_as_many_material_6d3a6b: "We need as many materials as these."
  npc_override_te_prtcas01_te_goditem_prt01_we_should_all_materials_881942: "We should have all the materials ready, right?"
  npc_override_te_prtcas01_te_goditem_prt01_what_i_m_doing_never_06a657: "What I'm doing is never enough compared to what you've done for me."
  npc_override_te_prtcas01_te_goditem_prt01_what_they_want_powerful_850052: "What they want is a powerful battlegear..."
  npc_override_te_prtcas01_te_goditem_prt01_when_actual_attack_start_776bdf: "When the actual attack starts, the doorway of Emperium region will be blocked up for protection.^000000"
  npc_override_te_prtcas01_te_goditem_prt01_when_they_ever_stop_foll_d594a5: "When will they ever stop following me..."
  npc_override_te_prtcas01_te_goditem_prt01_whew_i_don_t_think_5e2dfe: "Whew.. I don't think I can work for a while."
  npc_override_te_prtcas01_te_goditem_prt01_which_material_you_want_40a573: "Which material do you want to make?"
  npc_override_te_prtcas01_te_goditem_prt01_yeah_there_some_girls_49e820: "... yeah, there were some girls.."
  npc_override_te_prtcas01_te_goditem_prt01_you_careful_since_they_f_d0709f: "You have to be careful since they found out that materials for Hervor are here."
  npc_override_te_prtcas01_te_goditem_prt01_you_don_t_look_familiar_00d9b3: "You... don't look familiar to me... ?"
  npc_override_te_prtcas01_te_goditem_prt01_you_get_rid_those_girls_e9c3d0: "You have to get rid of those girls first."
  npc_override_te_prtcas01_te_goditem_prt01_you_going_threaten_me_3fefef: "Are you going to threaten me?"
  npc_override_te_prtcas01_te_goditem_prt01_you_need_ancient_rough_r_e7532b: "^4d4dffyou need 200 Ancient Rough Runestones and 100 Mystic Rough Runestones.^000000"
  npc_override_te_prtcas01_te_goditem_prt01_you_need_eluniums_oridec_30dfca: "^4d4dffyou need 50 Eluniums and 50 Oridecons.^000000"
  npc_override_te_prtcas01_te_goditem_prt01_you_protect_hour_31fbd2: "You have to protect {0} for 1 hour.^000000"
  npc_override_te_prtcas01_te_goditem_prt01_you_should_possess_any_o_bea10b: "You should not possess any other items except for Valkyrja's Shields in order to proceed with the quest.^ff0000"
  npc_override_te_prtcas01_te_goditem_prt01_you_too_many_items_proce_bd5e7d: "You have too many items to proceed with the quest."
  npc_override_te_prtcas01_te_goditem_prt01_you_ve_decided_keep_valk_b91c3a: "You've decided to keep Valkyrja's Shields only."
