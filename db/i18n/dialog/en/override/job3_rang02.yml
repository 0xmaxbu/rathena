Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job3_rang02_ranger_ah_wait_before_8addf9: "Ah wait, before that."
  npc_override_job3_rang02_ranger_aha_you_ve_failed_middle_2863f9: "Aha... You've failed the middle!"
  npc_override_job3_rang02_ranger_all_right_441c8d: "All right."
  npc_override_job3_rang02_ranger_all_right_careful_good_a31251: "All right. To be careful is good."
  npc_override_job3_rang02_ranger_all_tests_become_ranger_9e1e79: "All the tests to become a Ranger are going to be done with practical means."
  npc_override_job3_rang02_ranger_among_st_nd_rd_practical_c218a8: "Among the 1st, 2nd, and 3rd practical tests, which one's test method are you curious of?"
  npc_override_job3_rang02_ranger_anyway_you_ve_passed_nd_b1e5db: "Anyway you've passed the 2nd test very well."
  npc_override_job3_rang02_ranger_area_ranger_job_change_t_d6c701: "This area is for the Ranger Job Change test!"
  npc_override_job3_rang02_ranger_as_you_don_t_any_4d5f08: "As you don't have any equipment on, be careful of the monsters in the field."
  npc_override_job3_rang02_ranger_attendant_receives_bombr_37d98e: "The attendant receives 10 'Bombring Capsules'. When you consume the Bombring Capsule, a Bombring is summoned near and after the summoning when you reach a certain time, the Bombring explodes."
  npc_override_job3_rang02_ranger_awooo_yumyum_3411ab: "Awooo. Yumyum."
  npc_override_job3_rang02_ranger_because_you_ve_disappear_b7a0e9: "Because you've disappeared suddenly, the Ranger Master was looking for you."
  npc_override_job3_rang02_ranger_become_ranger_we_shall_m_45bc79: "Become a Ranger and we shall meet again."
  npc_override_job3_rang02_ranger_before_taking_practical_e449c6: "Before taking the practical test, I want to eat something."
  npc_override_job3_rang02_ranger_before_taking_practical_f4ad32: "Before taking a practical test, I want to eat something."
  npc_override_job3_rang02_ranger_before_you_change_into_r_2e2e2f: "Before you change into a Ranger, I'll need to evaluate your pure abilities."
  npc_override_job3_rang02_ranger_before_you_change_into_r_364404: "Before you change into a Ranger, even though you reached the highest level of a Hunter, it is not the best evaluation of your abilities."
  npc_override_job3_rang02_ranger_before_you_change_into_r_ea2df8: "Before you change into a Ranger, even though you reached the highest level of a Sniper, it is not the best evaluation of your abilities."
  npc_override_job3_rang02_ranger_before_you_job_change_di_994f5f: "Before you do a job change ^0000ffdismiss your Falcon^000000, and check if you've used all of your ^0000ffSkill Points^000000."
  npc_override_job3_rang02_ranger_bombring_capsules_given_c6563d: "The 'Bombring Capsules' can be given again only for the one who used it all, so please keep that in mind."
  npc_override_job3_rang02_ranger_bombring_explosion_affec_58694d: "^0000ffThe Bombring explosion affects you, so be careful not to get involved in the explosion. You need to get rid of the monster by using the Bombring Capsule, accomplish the mission and come out alive.^000000"
  npc_override_job3_rang02_ranger_come_again_when_you_abso_020493: "Come again when you are absolutely ready."
  npc_override_job3_rang02_ranger_come_back_when_you_ready_67d3d7: "Come back when you are ready."
  npc_override_job3_rang02_ranger_come_come_near_nearer_ne_4f5a6a: "Come, come near, nearer, nearer!!"
  npc_override_job3_rang02_ranger_come_see_me_again_4d4745: "Come and see me again!"
  npc_override_job3_rang02_ranger_come_when_you_ready_daee0c: "Come when you are ready."
  npc_override_job3_rang02_ranger_congrats_passing_nd_prac_7c2d27: "Congrats for passing the 2nd practical test! I am the 3rd practical test supervisor Freeze!"
  npc_override_job3_rang02_ranger_congratulations_36b252: "Congratulations!"
  npc_override_job3_rang02_ranger_congratulations_becoming_1c8f9d: "Congratulations on becoming a Ranger~"
  npc_override_job3_rang02_ranger_consider_as_extension_su_9e04aa: "Consider this as an extension of the survival power test."
  npc_override_job3_rang02_ranger_didn_t_rust_give_you_d3a72b: "Didn't Rust give you something?"
  npc_override_job3_rang02_ranger_didn_t_you_dismiss_your_695740: "Didn't you dismiss your falcon??"
  npc_override_job3_rang02_ranger_different_monsters_appea_5eaa7e: "Different monsters will appear in 8 places. Kill only the monster named 'Poring' and you get a point, when you reach a certain mark, then you pass. Easy, huh?"
  npc_override_job3_rang02_ranger_disabled_waiting_room_cd32fb: "Disabled Waiting Room"
  npc_override_job3_rang02_ranger_don_t_hang_around_here_ee7ba5: "Don't hang around here doing nothing. This is my area!"
  npc_override_job3_rang02_ranger_don_t_lose_dignity_as_96deee: "Don't lose the dignity as a Ranger wherever you go."
  npc_override_job3_rang02_ranger_don_t_you_need_any_c668e3: "Don't you need any explanation?"
  npc_override_job3_rang02_ranger_easy_right_d03f92: "Easy, right?"
  npc_override_job3_rang02_ranger_eeeeei_ha_afd08c: "eeeeei~ ha!"
  npc_override_job3_rang02_ranger_eh_what_you_looking_c196dd: "Eh? What are you looking at?"
  npc_override_job3_rang02_ranger_enabled_waiting_room_113bf1: "Enabled Waiting Room"
  npc_override_job3_rang02_ranger_enough_experience_d0d4c8: "enough experience."
  npc_override_job3_rang02_ranger_enter_into_chat_room_wai_ede756: "Enter into the chat room and wait for the order and take the job change practical test."
  npc_override_job3_rang02_ranger_even_after_passing_throu_fcd6d3: "Even after passing through all the rough practical tests, you don't want to become a ranger... are you sure?"
  npc_override_job3_rang02_ranger_excuse_me_how_did_you_f6343a: "Excuse me, but how did you get in?"
  npc_override_job3_rang02_ranger_first_all_let_me_tell_7cd098: "First of all, let me tell you the job change qualifications to be a Ranger."
  npc_override_job3_rang02_ranger_first_test_test_how_keen_f328e0: "The first test is to test of how keen your eyes are."
  npc_override_job3_rang02_ranger_get_rid_monsters_mission_bf0908: "Get rid of monsters and do the mission by using only the provided traps, and you pass. Just be careful not to be engulfed by the explosion."
  npc_override_job3_rang02_ranger_go_away_32baea: "Go away."
  npc_override_job3_rang02_ranger_good_bdc919: "Good."
  npc_override_job3_rang02_ranger_good_goooooo_650952: "Good to goooooo!!!!!!!"
  npc_override_job3_rang02_ranger_good_gooooooooooooooo_eb2ca4: "Good to gooooooooooooooo!!!!!!"
  npc_override_job3_rang02_ranger_good_luck_703764: "Good luck."
  npc_override_job3_rang02_ranger_good_no_falcon_you_ve_412dd0: "Good. No falcon and you've used up all your skill points."
  npc_override_job3_rang02_ranger_good_now_you_re_qualifie_04399c: "Good, for now you're qualified for the practical test."
  npc_override_job3_rang02_ranger_good_see_you_c1c48d: "It was good to see you."
  npc_override_job3_rang02_ranger_good_then_i_ll_start_5e8068: "Good! Then I'll start the test right now!"
  npc_override_job3_rang02_ranger_ha_ha_11174d: "Ha ~ ha."
  npc_override_job3_rang02_ranger_ha_what_you_doing_47d798: "Ha? What are you doing?"
  npc_override_job3_rang02_ranger_haaaaaaaah_a838d2: "Haaaaaaaah!!"
  npc_override_job3_rang02_ranger_having_done_test_normall_85b040: "Having done the test normally, you would have adjusted your weight to 0, and hold the items provided by Rescue!"
  npc_override_job3_rang02_ranger_hey_what_you_hiding_ther_b8f72e: "Hey, what are you hiding there?"
  npc_override_job3_rang02_ranger_hey_you_kidding_after_al_7ad58a: "Hey. You were kidding after all?"
  npc_override_job3_rang02_ranger_hey_you_look_great_2ee6e7: "Hey, you look great."
  npc_override_job3_rang02_ranger_hmm_oh_my_oh_my_72fa4e: "Hmm? Oh my, oh my, I've shown you my sloppiness."
  npc_override_job3_rang02_ranger_hmm_s_doubtful_506848: "Hmm. It's doubtful..."
  npc_override_job3_rang02_ranger_hmmmm_s_still_hot_d096cd: "Hmmmm, it's still hot?!"
  npc_override_job3_rang02_ranger_ho_having_come_far_means_0bef7f: "Ho, having come this far, it means you've passed the first survival test."
  npc_override_job3_rang02_ranger_ho_who_s_903271: "Ho. Who's this~"
  npc_override_job3_rang02_ranger_how_come_you_weigh_so_2d57ac: "But, how come you weigh so much?"
  npc_override_job3_rang02_ranger_how_could_you_ranger_if_3deee7: "How could you be a Ranger if you can't even recognize what's in front of you? Get out of here!"
  npc_override_job3_rang02_ranger_how_did_you_find_me_3c2b18: "How did you find me?"
  npc_override_job3_rang02_ranger_huh_73fef0: "Huh?"
  npc_override_job3_rang02_ranger_huh_d88905: "... ...Huh?"
  npc_override_job3_rang02_ranger_huh_there_s_no_wolf_cbc429: "Huh?! There's no wolf, no Test Flute, where did you get rid of them?!"
  npc_override_job3_rang02_ranger_huh_what_you_where_you_1e6b32: "Huh? What are you? Where are you from?"
  npc_override_job3_rang02_ranger_huh_where_s_bow_i_eb6ec3: "Huh? Where's the bow that I gave you for the practical tests?"
  npc_override_job3_rang02_ranger_huh_who_you_what_you_fe14cc: "Huh? Who are you? What are you doing here, you baby archer."
  npc_override_job3_rang02_ranger_hurry_up_finish_test_ce1fd1: "Hurry up and finish the test."
  npc_override_job3_rang02_ranger_i_am_running_away_so_1dd756: "I am not running away so take your time."
  npc_override_job3_rang02_ranger_i_consider_as_cheating_f403a6: "I consider this as cheating!"
  npc_override_job3_rang02_ranger_i_don_t_smell_any_93ce84: "I don't smell any signs of cheating. For now..."
  npc_override_job3_rang02_ranger_i_don_t_think_you_fcf5e1: "I don't think you have the time for that."
  npc_override_job3_rang02_ranger_i_knew_77e5f1: "I knew it."
  npc_override_job3_rang02_ranger_i_know_very_basic_way_f5ccbd: "I know that the very basic way to survive might be raising the strength of one's own body. But, I find that sending adventurers is easier for me."
  npc_override_job3_rang02_ranger_i_ll_cancel_job_change_7505f2: "I'll cancel the job change request from {0}."
  npc_override_job3_rang02_ranger_i_ll_explain_paths_test_24a279: "I'll explain the paths for the test."
  npc_override_job3_rang02_ranger_i_ll_explain_ranger_job_254ebc: "I'll explain the Ranger job change practical test."
  npc_override_job3_rang02_ranger_i_ll_explain_simply_2a2898: "I'll explain it simply."
  npc_override_job3_rang02_ranger_i_ll_give_you_bombring_1aadc3: "I'll give you the 'Bombring Capsules."
  npc_override_job3_rang02_ranger_i_ll_give_you_one_9790d7: "I'll give you one more time specially, so hold yourself together!"
  npc_override_job3_rang02_ranger_i_m_hungry_597298: "I'm hungry."
  npc_override_job3_rang02_ranger_i_m_sorry_you_already_5c8bd0: "I'm sorry, but you already have the 'Bombring Capsules', so I cannot provide you with more."
  npc_override_job3_rang02_ranger_i_tell_just_looking_you_714fb2: "I can tell just by looking at you that you seem to be inexperienced."
  npc_override_job3_rang02_ranger_i_think_i_know_you_3953ff: "I think I know. You were going to send this to Caution, right?"
  npc_override_job3_rang02_ranger_i_think_you_need_learn_c24d38: "I think you need to learn more."
  npc_override_job3_rang02_ranger_i_ve_already_checked_fir_e8b5a9: "I've already checked the first qualification that you've experienced enough to make an aura as a Hunter or a Sniper."
  npc_override_job3_rang02_ranger_i_ve_been_avoiding_him_5c1cc4: "I've been avoiding him so much!!"
  npc_override_job3_rang02_ranger_i_ve_never_imagined_coul_602ab4: "I've never imagined this could be a test..."
  npc_override_job3_rang02_ranger_i_ve_pointed_out_several_55155d: "I've pointed it out for several times, you should not even think to go in there secretly with anything other than the provided items!"
  npc_override_job3_rang02_ranger_i_want_see_real_power_0762a6: "I want to see the real power of survival, even if you fall down and get beat up."
  npc_override_job3_rang02_ranger_i_wish_you_luck_your_a1ba30: "I wish you luck in your future!"
  npc_override_job3_rang02_ranger_if_you_cover_rice_s_545a30: "If you cover it with rice, it's like roasted seaweed, very tasty and delicious."
  npc_override_job3_rang02_ranger_if_you_determined_then_t_e38cfa: "If you are determined, then there's nothing to wait for."
  npc_override_job3_rang02_ranger_if_you_don_t_cancel_5ff933: "If you don't cancel the mercenary, you cannot get into the test field! Cancel it first!"
  npc_override_job3_rang02_ranger_if_you_don_t_make_b91162: "If you don't make your weight 0, you wouldn't be able to take the test."
  npc_override_job3_rang02_ranger_if_you_don_t_return_e3b078: "If you don't return it, I can't cancel you job change request."
  npc_override_job3_rang02_ranger_if_you_get_passing_mark_04f77e: "If you get a passing mark over three tests, you'll be on your way to becoming a Ranger."
  npc_override_job3_rang02_ranger_if_you_give_up_here_395b13: "If you give up here, your job change request will be cancelled. Do you really want to give up the job change to a Ranger?"
  npc_override_job3_rang02_ranger_if_you_here_job_change_c6e7f9: "If you are not here for the job change test, please leave."
  npc_override_job3_rang02_ranger_if_you_hold_such_thing_f2cb36: "If you hold such thing it would disturb your practical test so I'll take this."
  npc_override_job3_rang02_ranger_if_you_run_out_provided_633cda: "If you run out of the provided items, we cannot support you more so take care."
  npc_override_job3_rang02_ranger_if_you_run_out_provided_e4af2e: "If you run out of the provided items, we cannot support more so take care."
  npc_override_job3_rang02_ranger_if_you_succeed_survival_da464a: "If you succeed with this survival power test, you will receive the first qualification."
  npc_override_job3_rang02_ranger_if_you_want_change_job_f63552: "If you want to change a job to a Ranger, first talk to Survival Instructor Rescue."
  npc_override_job3_rang02_ranger_if_you_want_continue_pra_f42145: "If you want to continue with the practical test, please enter into the chat room."
  npc_override_job3_rang02_ranger_isn_t_so_easy_2a645f: "Isn't that so easy?"
  npc_override_job3_rang02_ranger_keep_mind_you_need_remov_51f60f: "Keep in mind! You need to remove the egg bomb before it gets exploded by only using a wolf!"
  npc_override_job3_rang02_ranger_little_tough_so_careful_42aafd: "little tough so be careful."
  npc_override_job3_rang02_ranger_looks_like_you_a7b25d: "It looks like you have"
  npc_override_job3_rang02_ranger_make_sure_your_weight_eq_8cf523: "Make sure that your weight equals 0 to continue."
  npc_override_job3_rang02_ranger_make_sure_your_weight_eq_b9003c: "Make sure that your weight equals '0' to continue."
  npc_override_job3_rang02_ranger_may_i_tell_you_one_9a2b50: "May I tell you one thing?"
  npc_override_job3_rang02_ranger_menu_don_80818e: "Don't go:Go"
  npc_override_job3_rang02_ranger_menu_egg_9fe06a: "Egg Bomb : {0}"
  npc_override_job3_rang02_ranger_menu_egg_e3aeb1: "Egg Bomb : Ughhhhhhhhhhhhhh!!! So what did I say!!"
  npc_override_job3_rang02_ranger_menu_enable_ea6921: "Enable Waiting Room:Disable Waiting Room:Enable 1st Test:Disable 1st Test:Enable 2nd Test:Disable 2nd Test:Enable 3rd Test:Disable 3rd Test:Cancel"
  npc_override_job3_rang02_ranger_menu_i_7e825b: "I'll think about it more:I'll take the test"
  npc_override_job3_rang02_ranger_menu_i_961cc8: "I just came by:Please let me be out"
  npc_override_job3_rang02_ranger_menu_i_b12121: "I'll think about it more.:I want to be a Ranger already."
  npc_override_job3_rang02_ranger_menu_i_c32f62: "I came here to become to a Ranger.:I just came to look around."
  npc_override_job3_rang02_ranger_menu_no_05ecab: "No, I'll try again:I give up!"
  npc_override_job3_rang02_ranger_menu_no_455d46: "No:Yes!"
  npc_override_job3_rang02_ranger_menu_no_e42662: "No, I'll continue with the test:I give up the Ranger job change"
  npc_override_job3_rang02_ranger_menu_oh_e077c2: "Oh, just eat up:..."
  npc_override_job3_rang02_ranger_menu_please_f8e97e: "Please wait a little:Let's go to the practical test field!"
  npc_override_job3_rang02_ranger_menu_ranger_8ef13c: "Ranger practical test building?:I came for the test."
  npc_override_job3_rang02_ranger_menu_st_4eb3e7: "1st Test:2nd Test:3rd Test:Cancel"
  npc_override_job3_rang02_ranger_menu_tell_67acfa: "Tell me the mission again.:I just wanted to talk."
  npc_override_job3_rang02_ranger_menu_test_02e75e: "Test Supervisor, Caution : Whilst progressing, if you complete the mission given by an staff member come and see me, then you will pass the 2nd practical test!"
  npc_override_job3_rang02_ranger_menu_test_039808: "Test Supervisor, Caution : 4 Seconds remaining!!"
  npc_override_job3_rang02_ranger_menu_test_0440c2: "Test Supervisor, Notice : Then let's begin the test. Good luck."
  npc_override_job3_rang02_ranger_menu_test_0c2021: "Test Supervisor, Freeze : Why aren't you starting the test?"
  npc_override_job3_rang02_ranger_menu_test_106314: "Test Supervisor, Freeze : Your score is ...{0} out of 20!"
  npc_override_job3_rang02_ranger_menu_test_15bdca: "Test Supervisor, Freeze : Well let's see the result?!"
  npc_override_job3_rang02_ranger_menu_test_188c3c: "Test Supervisor, Freeze : You weren't on time for the test, so I am ending the 3rd practical test!"
  npc_override_job3_rang02_ranger_menu_test_18c07e: "Test Supervisor, Notice : The test method is, to kill monsters named 'Poring' amongst the random spawned monsters on 8 locations."
  npc_override_job3_rang02_ranger_menu_test_288e40: "Test explanation:Cancel:I give up the Ranger test"
  npc_override_job3_rang02_ranger_menu_test_2a36b1: "Test Supervisor, Freeze : The test is ooooooooooooooveeeeerrr!!!!!!!!!!!!!!!!!!!!!!!!!!"
  npc_override_job3_rang02_ranger_menu_test_2e9af1: "Test Supervisor, Caution : If you want to blame something, blame your own stupidness! Start over from the beginning! You fool!"
  npc_override_job3_rang02_ranger_menu_test_31c22f: "Test Supervisor, Caution : 3 Minutes have passed! 3 Minutes!!!! I'll be a little easy on you, so hurry up!!!!!!"
  npc_override_job3_rang02_ranger_menu_test_35575c: "Test Supervisor, Freeze : It's too bad, but you'll need to retake the test from the beginning! Please go back!"
  npc_override_job3_rang02_ranger_menu_test_368b50: "Test Supervisor, Caution : Come here, you don't have to rush your test, but why are you delaying the test?"
  npc_override_job3_rang02_ranger_menu_test_3a2331: "Test Supervisor, Caution : The test period will take 3 minutes in total! Copmplete the mission in 3 minutes and stay alive! Then come to see me!"
  npc_override_job3_rang02_ranger_menu_test_3a30c6: "Test Supervisor, Notice : I'll announce the test result. The number of Porings you killed out of 20 is ...{0}!"
  npc_override_job3_rang02_ranger_menu_test_3c3b21: "Test Supervisor, Freeze : From now on, every 3 seconds an 'Egg Bomb' will appear! Look at it carefully, and have your wolf attack the egg bomb to dismantle it!"
  npc_override_job3_rang02_ranger_menu_test_3cd3ba: "Test Supervisor, Caution : You couldn't get here on time, therefore the 2nd practical test ends here!"
  npc_override_job3_rang02_ranger_menu_test_3f378a: "Test Supervisor, Notice : The 1st test is to test your eyesight and accuracy."
  npc_override_job3_rang02_ranger_menu_test_3f4330: "Test Supervisor, Caution : Ugh... What are you doing? Your time is up!"
  npc_override_job3_rang02_ranger_menu_test_402e04: "Test Supervisor, Notice : The adventurer's 1st test ends now. Please make yourself more capable. Goodbye."
  npc_override_job3_rang02_ranger_menu_test_45a24d: "Test Supervisor, Caution : 1 Minute has passed. You are coming to see me, right?"
  npc_override_job3_rang02_ranger_menu_test_52df0d: "Test Supervisor, Caution : When the test begins, you'll recive 'Bombring Caspule's' from a staff member near you, and kill the monsters in your way."
  npc_override_job3_rang02_ranger_menu_test_5ad391: "Test Supervisor, Freeze : You can control the wolf by pressing the alt key and left click the surface, the wolf then moves to that point! Then you target the bomb and click on more time, it will then attack it!"
  npc_override_job3_rang02_ranger_menu_test_5e2776: "Test Supervisor, Notice : Correct Target! You have very good eyesight!"
  npc_override_job3_rang02_ranger_menu_test_67daf6: "Test Supervisor, Freeze : You have been successful so far! You've passed all practical tests! Let's move to the waitingroom!!!!!"
  npc_override_job3_rang02_ranger_menu_test_6b68a8: "Test Supervisor, Freeze : Welcome to the 3rd practical test field! I am the 3rd practical Test Supervisor Freeze!"
  npc_override_job3_rang02_ranger_menu_test_6e3de0: "Test Supervisor, Freeze : Don't hesitate and let's begin!"
  npc_override_job3_rang02_ranger_menu_test_6ef131: "Test Supervisor, Freeze : It's too bad but you couldn't pass the 10 points, so you failed!!!!"
  npc_override_job3_rang02_ranger_menu_test_751f54: "Test Supervisor, Caution : 2 Minutes have passed. Getting here on time should be your top priority.?"
  npc_override_job3_rang02_ranger_menu_test_79851b: "Test Supervisor, Caution : 3 Seconds remaining!!"
  npc_override_job3_rang02_ranger_menu_test_7ee6f0: "Test Supervisor, Notice : {0} Wave! Kill the Poring!"
  npc_override_job3_rang02_ranger_menu_test_89c9df: "Test Supervisor, Notice : The test progression time would be around 3 minutes. You need to get 15 points or more to qualify for the next test."
  npc_override_job3_rang02_ranger_menu_test_8e4f4d: "Test Supervisor, Caution : 2 Seconds remaining!!"
  npc_override_job3_rang02_ranger_menu_test_94f5dc: "Test Supervisor, Notice : Whatever it may look like, you need to kill the monster named 'Poring' to get a point, and if you kill others you will lose points, so be careful."
  npc_override_job3_rang02_ranger_menu_test_954a59: "Test Supervisor, Caution : However, you need to be alive in order to make the time limit, right? Please watch out."
  npc_override_job3_rang02_ranger_menu_test_9a80b1: "Test Supervisor, Caution : 2 Minutes and 30 Seconds have passed. There's not much time left!"
