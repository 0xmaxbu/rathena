Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@xm_d_HorrorToyFactory_aaa_you_going_go_into_324b6b: "Aaa.. Are you going to go into there?"
  npc_override_1@xm_d_HorrorToyFactory_ah_no_i_don_t_ad6953: "Ah, no. I don't blame her! I just want to know what happened to the doll craftsman on that day."
  npc_override_1@xm_d_HorrorToyFactory_ah_wait_please_wait_good_03a87f: "Ah, wait! Please wait. This is not a good place for a promising young {0} like you!"
  npc_override_1@xm_d_HorrorToyFactory_ask_her_continue_da9651: "Ask her to continue."
  npc_override_1@xm_d_HorrorToyFactory_box_your_hands_you_canno_59f8f4: "^009900The box is in your hands. You cannot carry more than one box.^000000"
  npc_override_1@xm_d_HorrorToyFactory_breathe_as_much_as_you_7b07b1: "Breathe as much as you can. It'll be the last breath you take."
  npc_override_1@xm_d_HorrorToyFactory_cautious_taming_other_wa_81d3c1: "^ff0000Be cautious taming or other ways than hunting monsters are not considered as normal killing counts.^000000"
  npc_override_1@xm_d_HorrorToyFactory_celine_kimi_her_phantom_769a96: "Celine Kimi and her phantom have shared their strength. They will be stronger than ever!"
  npc_override_1@xm_d_HorrorToyFactory_day_when_factory_decided_094ed0: "On the day when the factory is decided to be closed, the doll maker dressed the last doll he made and shed tears."
  npc_override_1@xm_d_HorrorToyFactory_did_he_give_doll_name_186dad: "Did he give a doll a name?"
  npc_override_1@xm_d_HorrorToyFactory_did_kimi_d66075: "Did Kimi do that?"
  npc_override_1@xm_d_HorrorToyFactory_did_you_come_here_as_cd5121: "Did you come here as well? Why are all of the humans so anxious to destroy what we built?"
  npc_override_1@xm_d_HorrorToyFactory_don_t_afraid_me_now_8806a9: "Do.. Don't be afraid of me. Now I look ugly, but I wasn't like this before."
  npc_override_1@xm_d_HorrorToyFactory_done_let_me_try_open_29833f: "Done. Let me try to open the closed door."
  npc_override_1@xm_d_HorrorToyFactory_door_opened_soon_you_wai_e24512: "Door will be.. opened soon.. Would you wait for a moment?"
  npc_override_1@xm_d_HorrorToyFactory_eh_give_me_second_i_57a760: "Eh.. Give me a second. I am talking to the person in charge. Please wait a little bit."
  npc_override_1@xm_d_HorrorToyFactory_eh_give_me_second_i_91e12c: "Eh.. Give me a second. I am talking to the person in charge. Please wait."
  npc_override_1@xm_d_HorrorToyFactory_even_if_no_one_owns_c4f502: "Even if no one owns it, its not right to steal it from everyone."
  npc_override_1@xm_d_HorrorToyFactory_everyone_afraid_me_what_67c098: "Everyone is afraid of me! What have I done so wrong?!"
  npc_override_1@xm_d_HorrorToyFactory_everyone_their_mortal_co_7e8135: "Everyone is in their mortal corruptible state right?"
  npc_override_1@xm_d_HorrorToyFactory_frankly_i_don_t_like_2eaccc: "Frankly, I don't like fire."
  npc_override_1@xm_d_HorrorToyFactory_gateway_dimensional_shif_af33eb: "The gateway for dimensional shifting has not been activated."
  npc_override_1@xm_d_HorrorToyFactory_he_named_last_doll_celin_689c22: "He named the last doll ^0000ffCeline Kimi^000000 and stopped all the lines in the factory."
  npc_override_1@xm_d_HorrorToyFactory_heh_you_me_favor_9c85bf: "Heh? You would do me a favor?"
  npc_override_1@xm_d_HorrorToyFactory_hey_santa_stop_being_stu_b58089: "Hey, Santa. Stop being stuffy, you old man. Fair is fair after all, kekeke."
  npc_override_1@xm_d_HorrorToyFactory_hold_i_am_talking_your_e6f55d: "Hold on~ I am talking to your manager, so please wait."
  npc_override_1@xm_d_HorrorToyFactory_huh_what_happened_67ea51: "Huh? What happened?"
  npc_override_1@xm_d_HorrorToyFactory_hurry_up_carry_gift_box_20a1f5: "Hurry up! Carry ^ff0000the gift box over there^000000 and move to the east."
  npc_override_1@xm_d_HorrorToyFactory_i_am_very_helpful_you_5a107f: "I am not very helpful to you."
  npc_override_1@xm_d_HorrorToyFactory_i_burn_you_hell_s_d84b3c: "I will burn you with hell's inferno."
  npc_override_1@xm_d_HorrorToyFactory_i_could_feel_her_slender_cf6155: "^0000ffI could feel her slender jawbone is trembling due to the subtle change of her emotion.^000000"
  npc_override_1@xm_d_HorrorToyFactory_i_couldn_t_even_imagine_48fc5e: "I couldn't even imagine, seeing this mood..."
  npc_override_1@xm_d_HorrorToyFactory_i_don_t_know_she_ddc1d7: "I don't know.. She would do it, or it could be a different problem. I have no memory of it."
  npc_override_1@xm_d_HorrorToyFactory_i_don_t_think_scene_e4b532: "I don't think the scene I saw was everything. However, getting into the factory again is.. Re-entering there is..."
  npc_override_1@xm_d_HorrorToyFactory_i_don_t_want_deserted_936423: "I don't want to be deserted. I don't want to be abandoned."
  npc_override_1@xm_d_HorrorToyFactory_i_guess_his_earnestness_d27c81: "I guess his earnestness breathed life to Kimi."
  npc_override_1@xm_d_HorrorToyFactory_i_i_ve_decided_won_76766c: "I.. I've decided. It won't be a great help to you, but I can simply let you know the directions."
  npc_override_1@xm_d_HorrorToyFactory_i_keep_you_entering_unti_88db95: "I will keep you from entering until the scent of preservative is completely gone."
  npc_override_1@xm_d_HorrorToyFactory_i_m_very_busy_working_4c49d1: "I'm very busy with working, so could you stop chatting?"
  npc_override_1@xm_d_HorrorToyFactory_i_m_working_now_i_868bab: "I'm working now! I'm very busy!"
  npc_override_1@xm_d_HorrorToyFactory_i_one_who_worked_as_16f21d: "I was the one who worked as an assistant beside the doll craftsman who made dolls to the end."
  npc_override_1@xm_d_HorrorToyFactory_i_shouldn_t_ec02f7: "I shouldn't have, but..."
  npc_override_1@xm_d_HorrorToyFactory_i_t_find_other_workers_9c50a7: "I can't find the other workers. We don't have time for dawdling. Children are waiting for presents."
  npc_override_1@xm_d_HorrorToyFactory_if_you_must_come_back_f17086: "If you must, come back later after you become far stronger. Hmmm.. I would say.. Lv.140?"
  npc_override_1@xm_d_HorrorToyFactory_kimi_s_soul_still_stayin_ce24ad: "Kimi's soul is still staying in this ground. When I can let her rest in peace..."
  npc_override_1@xm_d_HorrorToyFactory_kimi_you_mean_kimi_e8a2d4: "Kimi, you mean Kimi.."
  npc_override_1@xm_d_HorrorToyFactory_let_s_get_into_factory_3cc6e4: "Let's get into the factory."
  npc_override_1@xm_d_HorrorToyFactory_long_story_you_mind_if_0eb367: "This is a long story.. Would you mind if I talk to you? If you waste your time on someone like me?"
  npc_override_1@xm_d_HorrorToyFactory_lucky_you_got_here_safel_da54b3: "Lucky you got here safely."
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_32ac81: "Antonio: Hey, human. You can follow me if you'd like to help. I'm okay unless you disturb me!"
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_5fe8a2: "Antonio: Listen to me, Santa~ I mean, I like this factory."
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_c57855: "Antonio: Oh! Wohuhu! A bunch of presents are delayed. Let's have a party today?!"
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_e5c287: "Antonio: No one owns it~ And there are a number of things I can use."
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_e86185: "Antonio: Hmm..."
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_f289f7: "Antonio: Hey, is this a big deal if I have surplus presents? I don't know about that~"
  npc_override_1@xm_d_HorrorToyFactory_menu_antonio_f3c342: "Antonio: Maybe... I will be happy?! Anyway, that's a present, kekekeke."
  npc_override_1@xm_d_HorrorToyFactory_menu_cancel_c2629b: "Cancel:Factory No.1 Complete:Factory No.2 Complete:Factory No.3 Complete:Boss Start:Boss Complete"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_03b8b9: "Captured Santa: Whew... Okay, but think about that how children feel when they got them."
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_04cb7e: "Captured Santa: Its not right to steal from the community!"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_1501c0: "Captured Santa: Tha.. That dude has no ethics!"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_2896d5: "Captured Santa: You silly! Just to be sure, I followed you. Now you steal from everyones factory!"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_3921ed: "Captured Santa: Hey, would you go kick that Antonio out? He might run away if you hit several times."
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_d32a17: "Captured Santa: How they feel if they know you distributed the masterless things to them?"
  npc_override_1@xm_d_HorrorToyFactory_menu_captured_f831a7: "Captured Santa: Who said the present itself is the problem! You'd better stop this theft, Antonio!"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_018a44: "Catherine Jet Johnson: I will find my way around here. Let's meet near the second production line. Cheer up, it's a toy factory. It can't be all that bad!!"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_0b7304: "Catherine Jet Johnson: Ah, they are behind me. You'd better change into the uniform. Fortunately, I still have my employee card."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_0c2776: "Catherine Jet Johnson: Ah, maybe we should restore those toys and gift boxes to their original condition."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_0d10a5: "Catherine Jet Johnson: If you see a worker toy on duty while searching here, would you ask it about the doll maker?"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_0ef527: "Catherine Jet Johnson's yell: Are you okay? Flee to the south emergency exit!"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_13b485: "Catherine Jet Johnson: I think other spirits have inhabited the empty factory for too long."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_1660ef: "Catherine Jet Johnson: How can I say.. There were lots of very scary, but awfully sad, looking souls."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_1a34c3: "Catherine Jet Johnson: Thanks to you, everything that I have wondered is completely resolved. Please call me again if you are going to send her to Heaven next time."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_25d068: "Catherine Jet Johnson: Kimi, I heard about you from dolls here. The doll maker adored you so much!"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_2fa3a0: "Catherine Jet Johnson: Anyway, even Kimi hates everyone and has collected her recollections here a lot."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_512a3e: "Catherine Jet Johnson: Ah.. We have explored here before? Okay, let's meet at the same spot again."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_518a4c: "Catherine Jet Johnson: Sorry that I can't be a big help to you. See you in a minute."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_53861c: "Catherine Jet Johnson: If you find all clues, search other places. I will look for the spot where I met the doll maker last time I was here."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_5e3e43: "Catherine Jet Johnson: How pitiful they are, but please make them rest if they attack you. Fortunately, they won't come at me."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_66dcb8: "Catherine Jet Johnson: I will end this thing safely even if her soul will return and she won't be disappointed."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_67d96c: "Catherine Jet Johnson: It has become serious. Kimi is suffering. It would be dangerous under this condition!"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_6b85b3: "Catherine Jet Johnson: Yes, when you start to move, he was so plea..."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_791b11: "Catherine Jet Johnson: Eh? I... I mean... To return them as they were.. Yes... We need to fight them? I don't know how exactly."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_8d3451: "Catherine Jet Johnson: No, don't listen to it, Kimi! He really cherished you."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_8f63c2: "Catherine Jet Johnson: Unfortunately, I have failed to persuade Kimi."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_93c322: "Catherine Jet Johnson: Wh.. What happened? Toys and dolls are wandering instead of human workers. As if they are employees..."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_a3a9b7: "Catherine Jet Johnson: I will find the emergency exit to escape. Run away, adventurer!"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_afa8f0: "Catherine Jet Johnson: But, it's not the time to be happy. Once we find the last factory area, we will need to halt all production lines."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_b2cec8: "Catherine Jet Johnson: Kimi! Listen to me. I didn't come here to blame you."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_b64a79: "Catherine Jet Johnson: I will open the exit way out. I will go outside first, so just follow me."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_bd627e: "Catherine Jet Johnson: This area was Factory No.1. It used to be the place where the toys and dolls were stored before given as presents."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_c00777: "Catherine Jet Johnson: What was the voice of that phantom? Why does it torment Kimi so harshly..."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_c8c12f: "Catherine Jet Johnson: Everyone is in their mortal corruptible state right?"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_d6d712: "Catherine Jet Johnson: It used to be filled with people, but now it isn't."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_d74452: "Catherine Jet Johnson: He might be sent to Heaven if they recall the memory of doll maker. That's the best hope."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_dfea93: "Catherine Jet Johnson: Ah, I realized something while coming here. Some...Children..."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_e615b2: "Catherine Jet Johnson: It's just like when humans worked here."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_e9ae62: "Catherine Jet Johnson: This place was Factory No.2."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_ebdeff: "Catherine Jet Johnson: Good heavens, I hope the guards are still human. There were boxes of uniforms near here in the past.."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_f45a6c: "Catherine Jet Johnson: Ah, I remember several things. If someone wasn't in the employee's uniform, the guards used to come and scold them...."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_f471a8: "Catherine Jet Johnson: By the way..."
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_fc2521: "Catherine Jet Johnson: No, Kimi! I've realized that. I misunderstood you. He was sick!"
  npc_override_1@xm_d_HorrorToyFactory_menu_catherine_fdab4d: "Catherine Jet Johnson: I guess that the curse of my face was from the unidentified voice."
  npc_override_1@xm_d_HorrorToyFactory_menu_caution_18ad56: "CAUTION: The plant manger is coming to inspect. Wipe out the outsiders."
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_045ae9: "Celine Kimi: D.. Did I.. kill him?..."
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_19b2e6: "Celine Kimi: Don't lie. If that's true, why didn't he see me with love in his eyes?"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_21b807: "Celine Kimi: You also... came here to kill me?"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_3978ec: "Celine Kimi: I... I..."
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_40bfd9: "Celine Kimi: Because of me, grandpa is dead..."
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_79c171: "Celine Kimi: It is no use to defeat me! My body will be restored."
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_79cfb4: "Celine Kimi: Did he... cherish me?"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_8797b9: "Celine Kimi: Why didn't he say my name? [Kimi] [Kimi!] I was anxious to hear the Grandpa's voice."
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_8ea686: "Celine Kimi: Everyone hates me!... You don't like me as well? This ugly and creepy doll likes me..."
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_c7eca1: "Celine Kimi: No! I should keep my place!"
  npc_override_1@xm_d_HorrorToyFactory_menu_celine_f0fcf6: "Celine Kimi: D.. Di.. Did I... kill... him?"
  npc_override_1@xm_d_HorrorToyFactory_menu_coordinator_3a4401: "Coordinator: This kind of thing happens a lot these days..."
  npc_override_1@xm_d_HorrorToyFactory_menu_coordinator_bbf85f: "Coordinator's announcement: Huh? Where's everyone! How dare the workers be absent from their line and muck around!"
  npc_override_1@xm_d_HorrorToyFactory_menu_coordinator_bffb47: "Coordinator: Guard! Where is a guard! Humans are invading!!"
  npc_override_1@xm_d_HorrorToyFactory_menu_coordinator_e2b277: "Coordinator's announcement: Huh? Where's everyone! How dare workers be absent from the line!"
  npc_override_1@xm_d_HorrorToyFactory_menu_coordinator_f73d37: "Coordinator: Hurry up! Carry the gift box over there and move to the east."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_05d5ad: "Factory announcement: Wake up, toy factory working time has come..."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_223db4: "Factory announcement: Outsiders, hold up your hands and surrender. Otherwise, I will shoot you."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_22e8d9: "Factory announcement: Not good news. Outside creatures are detected. Guards, please mobilize."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_65d7ea: "Factory announcement: The sending preparations have finished in Factory No.3."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_71be45: "Factory announcement: Everyone has gone home. The line is shut down and the employee's lounge is open."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_8ab759: "Factory announcement: All employees must wear a proper uniform and identification. Please check with security if you do not have yours."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_8e5c9a: "Factory announcement: Let's make presents for every child's dream today."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_9bb233: "Factory announcement: Delivery employees, please stand by."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_a6d947: "Factory announcement: Outsiders are spotted on the product line. Guards, please move out immediately."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_b45d62: "Factory announcement: Okay that's it, party's over! Get out of my house!"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_b8e32e: "Factory announcement: Outsiders or invaders are obstacles to factory's operation. You can kill them if necessary."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_c46aeb: "Factory announcement: Please start product line No.1. Don't forget to wear a safety helmet! This means you Bob!"
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_c5feee: "Factory announcement: Waste and other debris should be kept clear from work areas. This is to keep you safe at all times."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_e6f255: "Factory announcement: Now there are {0} people on the packaging line. Take care of yourself."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_f0ba56: "Factory announcement: Dispatch the guards. Suppress the invaders."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_f3ab42: "Factory announcement: Invaders have been identified. Distinction Code AX0829. Type: Human. Chase them away."
  npc_override_1@xm_d_HorrorToyFactory_menu_factory_faf074: "Factory announcement: Exist in {0} - {1}."
  npc_override_1@xm_d_HorrorToyFactory_menu_guard_a66452: "Guard's announcement: Please leave here immediately, outsiders."
  npc_override_1@xm_d_HorrorToyFactory_menu_guard_f3c70d: "Guard's announcement: Invaders are spotted! They seem human! I will blip them off!"
  npc_override_1@xm_d_HorrorToyFactory_menu_options_d19784: "???: I won't harm you if you leave quietly without spoiling it for me."
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_0db2c7: "Phantom's yell: Yes, Kimi~ Father was frightened! He was scared of you~"
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_28dd2d: "Phantom's yell: Lie!"
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_54b631: "Phantom's yell: See how you look, Kimi~ See the mirror~ How do yo feel? "
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_8daf97: "Phantom's yell: Rage~ Sorrow~ No one cries for you, Kimi~"
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_98dd67: "Phantom's yell: Don't you agree you are frightening? No one loves you, Kimi~"
  npc_override_1@xm_d_HorrorToyFactory_menu_phantom_bfebf2: "Phantom's yell: He was scared of your appearance and his heart stopped, Kimi~ You killed him!"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_0862a3: "Worker: Oh, Kimi.. My dear.. She thought the doll maker passed away because she startled him."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_15cfb8: "Worker: Perhaps Grandpa's affection made her move and become alive. Ahah.. I'm sleepy.."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_16df99: "Worker: Grandpa... I miss him. Grandpa, Grandpa..."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_20ec1e: "Worker: And what she first saw was his death. What a misery."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_2d0262: "Worker: Ah! Grandpa? He's a real good man. He oiled us everyday and cleaned the dust very often."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_2e3bac: "Worker: Ah.. Did you do something to me? I feel strange..."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_4ba151: "Worker: He could see a living doll for a while. That's what Kimi first did."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_4f6689: "Worker: Kimi didn't hurt Grandpa! Kimi's wanted to save Grandpa! People are scared of Kimi, but Kimi is kind! Kimi is a good girl!"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_541631: "Worker: Kimi didn't move at all for sometime and sat down like ordinary dolls."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_587e3e: "Worker: Grandpa was a good man! Pity on Kimi! Kimi loved Grandpa! But Grandpa died. I'm sad!"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_641152: "Worker: Guard! Guard!!"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_65215e: "Worker: Grandpa was just very pleased that Kimi was moving.."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_68e2a5: "Worker: Guard, Guard! Where are you?! Humans are here!!"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_7aef54: "Worker: Ah... B.. By the way, why my does my body become..."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_89d438: "Worker: Anyhow, why my is my body... It's likely to float in the air.... Something strange."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_b1318d: "Worker: Kimi was able to hear the Grandpa's voice and feel before she was indwelled."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_b5c6b2: "Worker: I wish he wouldn't pass away. Ah... Ahah... I feel better."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_bc5e16: "Worker: He was so amazed to see Kimi's opening eyes and his heart... It became like that."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_c3c82d: "Worker: He had a chronic cardiac disease, but it was so sudden when it started and he died. Kimi found him and gave him first aid, but.."
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_c7287d: "Worker: Did Kimi kill the craftsman grandpa? Who said that? That's not true. Kimi was going to save him!"
  npc_override_1@xm_d_HorrorToyFactory_menu_worker_f8043f: "Worker: She was about to fly her soul forever... Like me now... Oh, my... What happened to me?"
  npc_override_1@xm_d_HorrorToyFactory_mmm_where_should_i_start_85b9c1: "Mmm.. Where should I start.. The story of this town first?..."
  npc_override_1@xm_d_HorrorToyFactory_no_nothing_special_7cf04f: "No, nothing special"
  npc_override_1@xm_d_HorrorToyFactory_oh_dear_let_me_know_2c4e9c: "Oh, dear. Let me know when you are ready."
  npc_override_1@xm_d_HorrorToyFactory_okay_take_care_yourself_26ef4f: "Okay, take care of yourself. And don't ever come near that odd entrance."
  npc_override_1@xm_d_HorrorToyFactory_perhaps_he_thought_he_wo_3ff2e3: "Perhaps he thought he wouldn't make dolls anymore."
  npc_override_1@xm_d_HorrorToyFactory_please_wait_until_transf_8879a5: "Please wait until the transformation is finished. You cannot move to another area until you become normal."
  npc_override_1@xm_d_HorrorToyFactory_quit_fb25bb: "Quit."
  npc_override_1@xm_d_HorrorToyFactory_quit_story_4580cb: "Quit the story"
  npc_override_1@xm_d_HorrorToyFactory_s_boiling_bear_if_you_e7479c: "It's boiling!... Bear it if you can."
  npc_override_1@xm_d_HorrorToyFactory_s_end_i_outside_when_dbdfa9: "That's the end. I was outside when I woke up again after I had blacked out. My face has become like this."
  npc_override_1@xm_d_HorrorToyFactory_she_thinking_about_somet_081110: "^0000ffShe is thinking about something intently with gaping eyes.^000000"
  npc_override_1@xm_d_HorrorToyFactory_sigh_girl_begins_speak_s_993e9b: "^0000ffWith a sigh, the girl begins to speak in a subdued tone like a bard who tells an old story.^000000"
  npc_override_1@xm_d_HorrorToyFactory_skull_faced_girl_front_y_0c0b78: "^0000ffThe skull-faced girl in front of you is speaking in a tearful voice. Void holes where there should be eyes are staring at you.^000000"
  npc_override_1@xm_d_HorrorToyFactory_smell_preservative_facto_3441cb: "The smell of preservative from the factory has not gone away. You cannot enter under this state."
  npc_override_1@xm_d_HorrorToyFactory_smell_preservative_gone_7e053e: "^0000ffThe smell of preservative has gone away. You can talk to Catherine Jet Johnson.^000000"
  npc_override_1@xm_d_HorrorToyFactory_sometimes_so_much_work_g_04bae8: "Sometimes so much work goes into a doll as if it were their child to doll makers. Kimi was the one for him."
  npc_override_1@xm_d_HorrorToyFactory_stop_machine_c4fd8c: "Stop the machine."
  npc_override_1@xm_d_HorrorToyFactory_take_look_around_ae764e: "Take a look around"
  npc_override_1@xm_d_HorrorToyFactory_thank_you_listening_me_h_208f49: "Thank you for.. for listening to me. Hope you will enjoy your trip.."
  npc_override_1@xm_d_HorrorToyFactory_there_some_work_study_pr_8437cb: "There are some work study programs as monster workers during the Horror Toy Factory tour. Therefore, ^ff0000you are unable to enter when you are transformed.^000000"
  npc_override_1@xm_d_HorrorToyFactory_there_toy_factory_town_a_121fe5: "There was a toy factory in this town. All of the people in this town work there and I was one of the employees."
  npc_override_1@xm_d_HorrorToyFactory_trail_dimensional_shifti_d25691: "^0000ffThe trail of dimensional shifting disappeared. You are allowed to use Factory Dimension Teleporter.^000000"
  npc_override_1@xm_d_HorrorToyFactory_unknown_error_occurred_58bda4: "An unknown error has occurred."
  npc_override_1@xm_d_HorrorToyFactory_unlock_horror_toy_factor_c70ab8: "Unlock Horror Toy Factory"
  npc_override_1@xm_d_HorrorToyFactory_wa_watch_out_kimi_isn_52b49a: "Wa.. Watch out! Kimi isn't under the normal status."
  npc_override_1@xm_d_HorrorToyFactory_wait_please_wait_until_i_5d50ca: "Wait, please wait until I am prepared. I can guide you when I am ready."
  npc_override_1@xm_d_HorrorToyFactory_we_all_happy_beginning_w_b34f4b: "We all were happy in the beginning. We used to gather around together and have a friendly chat having gingerbread and hot tea after work."
  npc_override_1@xm_d_HorrorToyFactory_we_well_i_cannot_help_7886cc: "We.. Well, I cannot help you at all except for providing you with directions. Besides, this can be very dangerous to you."
  npc_override_1@xm_d_HorrorToyFactory_what_humans_8219af: "What!? Humans!!!"
  npc_override_1@xm_d_HorrorToyFactory_what_s_wrong_your_face_0ca72e: "What's wrong with your face?"
  npc_override_1@xm_d_HorrorToyFactory_what_time_you_like_retur_9b0a6a: "What time would you like to return?"
  npc_override_1@xm_d_HorrorToyFactory_what_you_one_us_9137f2: "What!? You are not one of us!!"
  npc_override_1@xm_d_HorrorToyFactory_when_i_first_saw_her_0af8de: "When I first saw her, she was standing beside the doll maker who died and collapsed. She stood there with a bare expression."
  npc_override_1@xm_d_HorrorToyFactory_why_you_hanging_around_c_7251b5: "Why are you hanging around! Carry ^ff0000the gift box over here^000000 and move to the east."
  npc_override_1@xm_d_HorrorToyFactory_yes_because_we_couldn_t_c32db0: "Yes, because we couldn't earn a living by packaging toys forever. The situations got tough after the villagers left in ones and twos."
  npc_override_1@xm_d_HorrorToyFactory_yes_i_am_scared_reluctan_f4f3ef: "Yes, I am scared and reluctant to do it. If there's someone who can help me.."
  npc_override_1@xm_d_HorrorToyFactory_yes_she_became_living_cr_89a2d1: "Yes, ^0000ffShe^000000 became a living creature. I don't know how, but she is striding in the toy factory with heavy sorrow and rage."
  npc_override_1@xm_d_HorrorToyFactory_you_already_trail_dimens_9089e1: "You already have a trail of dimensional shifting. Your access has been denied."
  npc_override_1@xm_d_HorrorToyFactory_you_also_came_here_kill_971d6c: "You also... came here to kill me?"
  npc_override_1@xm_d_HorrorToyFactory_you_bear_flame_010422: "Will you bear this flame?!"
  npc_override_1@xm_d_HorrorToyFactory_you_blame_her_3a9656: "Do you blame her?"
  npc_override_1@xm_d_HorrorToyFactory_you_cannot_come_here_if_1191b0: "You cannot come here if you are under the effect of a monster transformation."
  npc_override_1@xm_d_HorrorToyFactory_you_cannot_use_uniform_b_a97018: "You cannot use the uniform box when already transformed.^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_carrying_packaged_pr_5ba6b2: "^0000ffYou are carrying the packaged present.^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_changed_into_uniform_073426: "^0000ff>You changed into uniform.^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_d_better_release_you_872375: "You'd better release your transformation if you'd like to enter. It could be dangerous in some ways."
  npc_override_1@xm_d_HorrorToyFactory_you_don_t_any_support_8b1fae: "You don't have any support? Please organize a party and come again if you go in alone."
  npc_override_1@xm_d_HorrorToyFactory_you_eligible_dimensional_25eb6d: "You are not eligible for dimensional shifting. You should be at least Lv.140."
  npc_override_1@xm_d_HorrorToyFactory_you_exit_a60e89: "Will you exit?"
  npc_override_1@xm_d_HorrorToyFactory_you_mean_doll_alive_b72a55: "Do you mean the doll is alive?"
  npc_override_1@xm_d_HorrorToyFactory_you_need_organize_party_64ac19: "^0000ffYou need to organize a party having more than one member to get into Horror Toy Factory.^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_put_factory_uniform_eca280: "^0000ffYou put on a factory uniform. There still seems to be a few uniforms left in the box.^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_reunite_kimi_t_you_42aea5: "You can reunite with Kimi, can't you?"
  npc_override_1@xm_d_HorrorToyFactory_you_t_seem_put_uniform_c9bd7e: "You can't seem to put on the uniform over your fangs.^000000"
  npc_override_1@xm_d_HorrorToyFactory_you_transformation_521e7b: "^ff0000You are in transformation."
  npc_override_1@xm_d_HorrorToyFactory_you_transformed_into_dif_823b02: "^ff0000You transformed into a different form."
  npc_override_1@xm_d_HorrorToyFactory_you_uniform_coordinator_fb4d08: "^ff0000You are not in uniform. The Coordinator won't let you pick it up.^000000"
