  npc_override_ba_maison_quests_17_2_i_apologize_bath_house_c_315168: "I apologize, but the bath house is currently closed due to an internal condition, and we cannot assure the reopening time. Please come back later. If you would like a quiet bath, please use the private bathroom provided with your guest room."
  npc_override_ba_maison_quests_17_2_i_apologize_causing_you_d5cd96: "I apologize for causing you trouble. Forgive me. But do you know friendships become stonger after a quarrel? We are not the same guests of Varmundt."
  npc_override_ba_maison_quests_17_2_i_apologize_could_you_wa_bbd03a: "I apologize, but could you wait a little longer? I have to check which area is the problem and manually forward the updated guest list."
  npc_override_ba_maison_quests_17_2_i_apologize_listening_yo_3b7049: "I apologize for not listening to your plead."
  npc_override_ba_maison_quests_17_2_i_apologize_varmundt_man_a930be: "I apologize. It is Varmundt Mansion's policy to keep guests from ^0000CDdangerous situations^000000. Please wait a little longer."
  npc_override_ba_maison_quests_17_2_i_arrived_crux_prontera_0e8788: "I arrived with Crux to the Prontera Palace, the palace was filled with a strange excitement."
  npc_override_ba_maison_quests_17_2_i_as_you_say_e0df5b: "I will do as you say."
  npc_override_ba_maison_quests_17_2_i_ask_your_understanding_5641ac: "I ask for your understanding."
  npc_override_ba_maison_quests_17_2_i_assumed_there_problem_c8bc96: "I assumed there was a problem in the garden, since the connectivity to the other gardener was often cut off."
  npc_override_ba_maison_quests_17_2_i_avoid_them_some_extent_e3d581: "I can avoid them to some extent, but I'm worried because there are too many of them. If they attacked all at once, even the strongest dolls will be destroyed in no time."
  npc_override_ba_maison_quests_17_2_i_been_abandoned_like_re_78b5a8: "Would I have been abandoned like the rest of them, if it wasn't for my genius brain?"
  npc_override_ba_maison_quests_17_2_i_been_informed_dolls_sa_9f7205: "I have been informed that the dolls are safe. I guess it simply forgot to make regular contact."
  npc_override_ba_maison_quests_17_2_i_believe_adventurer_24c538: "I believe in the adventurer."
  npc_override_ba_maison_quests_17_2_i_believe_what_adventure_e1f7fa: "I can believe what the adventurer done so far."
  npc_override_ba_maison_quests_17_2_i_believe_you_78d31c: "I believe you will."
  npc_override_ba_maison_quests_17_2_i_believe_you_keep_your_d4c423: "I believe that you will keep your promise."
  npc_override_ba_maison_quests_17_2_i_brought_all_here_let_8cf6a1: "I brought it all here. Let me see... here it is."
  npc_override_ba_maison_quests_17_2_i_call_hamster_i_read_e070d9: "I call it a hamster. I read it in a book. It said that everything that diligently picks up things and puts it in the mouth is a hamster. And, a hamster is cuter than a cleaning robot, right?"
  npc_override_ba_maison_quests_17_2_i_came_here_get_mansion_435454: "I came here to get the mansion's blueprint and the ingredients for the restaurant. Did you come here in person because you don't trust me? If that's the case, please don't worry."
  npc_override_ba_maison_quests_17_2_i_came_here_pick_you_623737: "I came here to pick you up."
  npc_override_ba_maison_quests_17_2_i_came_rebellions_some_g_e486c4: "I came with the Rebellions and some government officials."
  npc_override_ba_maison_quests_17_2_i_check_moment_don_t_502c5f: "I will check it for a moment. Don't move from your spot."
  npc_override_ba_maison_quests_17_2_i_checked_collection_pot_f2b490: "I checked the collection of 10 potato chips. Please process the biochip."
  npc_override_ba_maison_quests_17_2_i_clean_often_there_many_2666ba: "I clean often, but there are many of them."
  npc_override_ba_maison_quests_17_2_i_collect_information_li_37dbc4: "I can collect information like vision and hearing and communicate like an avatar using my own resources."
  npc_override_ba_maison_quests_17_2_i_confirm_population_dec_3cc24c: "I can confirm that the population has decreased."
  npc_override_ba_maison_quests_17_2_i_confirmed_completion_r_9d1ab6: "I have confirmed the completion of the request."
  npc_override_ba_maison_quests_17_2_i_confirmed_you_complete_d5aded: "I have confirmed that you completed this request. Thank you very much."
  npc_override_ba_maison_quests_17_2_i_couldn_t_destroy_him_9dc902: "I couldn't destroy him because this kid has a brain of a 'human child'."
  npc_override_ba_maison_quests_17_2_i_cured_his_injures_well_41d438: "I, cured his injures... Well, since we haven't done anything to each other, why don't we end it up like this?"
  npc_override_ba_maison_quests_17_2_i_d_better_talk_him_594c2f: "- I'd better not talk to him right now. -"
  npc_override_ba_maison_quests_17_2_i_d_grateful_if_you_f46c68: "I'd be grateful if you would come with us too, adventurer."
  npc_override_ba_maison_quests_17_2_i_d_happy_948737: "I'd be happy to."
  npc_override_ba_maison_quests_17_2_i_d_happy_escort_you_bcd777: "I'd be happy to escort you."
  npc_override_ba_maison_quests_17_2_i_d_happy_if_you_98d27c: "But... I'd be happy if you could help me with one thing. Are you interested?"
  npc_override_ba_maison_quests_17_2_i_d_like_get_permission_af4e9b: "I'd like to get permission."
  npc_override_ba_maison_quests_17_2_i_d_like_know_where_e93380: "I'd like to know where's the place. So I can turn it to ashes."
  npc_override_ba_maison_quests_17_2_i_d_like_talk_you_160889: "I'd like to talk to you."
  npc_override_ba_maison_quests_17_2_i_d_like_tell_you_4056b6: "I'd like to tell you something what I have found out on my side."
  npc_override_ba_maison_quests_17_2_i_d_rather_call_security_73b088: "I'd rather call the security."
  npc_override_ba_maison_quests_17_2_i_d_rather_find_another_132c67: "I'd rather find another way, instead of wasting my time doing something contradictory."
  npc_override_ba_maison_quests_17_2_i_d_reassured_if_could_4401a4: "I'd be reassured if could take a look at the <NAVI>[garden]<INFO>ba_maison,103,92,0,101,0</INFO></NAVI>."
  npc_override_ba_maison_quests_17_2_i_decided_better_visit_p_252321: "I decided it would be better to visit in person as soon as possible."
  npc_override_ba_maison_quests_17_2_i_delivered_them_all_afb96b: "I delivered them all."
  npc_override_ba_maison_quests_17_2_i_didn_t_even_know_2c1260: "I didn't even know there was something like this."
  npc_override_ba_maison_quests_17_2_i_didn_t_expect_all_2297a9: "I didn't expect at all that it would turn out like this."
  npc_override_ba_maison_quests_17_2_i_didn_t_expect_we_5d7703: "I didn't expect that we'll meet like this."
  npc_override_ba_maison_quests_17_2_i_didn_t_expect_you_aafc03: "I didn't expect you to say that."
  npc_override_ba_maison_quests_17_2_i_didn_t_hear_because_fb386b: "I didn't hear it because it was too far."
  npc_override_ba_maison_quests_17_2_i_didn_t_think_there_42d696: "I didn't think there would be any humans visiting the warehouse. Usually the humans that come all the way here were usually thieves."
  npc_override_ba_maison_quests_17_2_i_didn_t_want_kill_678d2a: "I didn't want to kill anyone."
  npc_override_ba_maison_quests_17_2_i_disagree_if_you_lived_7638f7: "I disagree. If you have lived in a particular place for a long time, that property should belong to you. That's how everyone lives."
  npc_override_ba_maison_quests_17_2_i_don_t_anything_say_44e80f: "I don't have anything to say to you, so just let me go."
  npc_override_ba_maison_quests_17_2_i_don_t_care_about_02abb7: "I don't care about books... you should look around."
  npc_override_ba_maison_quests_17_2_i_don_t_expect_you_010ebc: "I don't expect you to interpret even a single line of the great master's will, but... If you don't know, you can just go search everywhere. Then go ahead and come back."
  npc_override_ba_maison_quests_17_2_i_don_t_feel_like_882e75: "I don't feel like I belong there anyway. I only stayed because they supported my research."
  npc_override_ba_maison_quests_17_2_i_don_t_know_3ab076: "I don't know?"
  npc_override_ba_maison_quests_17_2_i_don_t_know_he_7f6e46: "I don't know... he said he was injured but he didn't mean it, and he's a guest at this mansion."
  npc_override_ba_maison_quests_17_2_i_don_t_know_if_d38f3d: "But, I don't know if the gardeners will let you enter."
  npc_override_ba_maison_quests_17_2_i_don_t_know_what_0c74a0: "I don't know what it is yet. As you know, the moment we entered the mansion, everyone scattered to check the facilities."
  npc_override_ba_maison_quests_17_2_i_don_t_know_what_1deb09: "I don't know what all the hints mean, but you adventurer are a human like our master. You might be interpret them."
  npc_override_ba_maison_quests_17_2_i_don_t_know_what_6e6339: "I don't know what you're planning, but I Elena Bolkova will take you."
  npc_override_ba_maison_quests_17_2_i_don_t_know_what_8339e5: "I don't know what it's like. In the worst case scenario, it might come up from the basement and destroy us. Is that correct?"
  npc_override_ba_maison_quests_17_2_i_don_t_know_what_c17008: "I don't know what the humans want."
  npc_override_ba_maison_quests_17_2_i_don_t_know_who_18a9a3: "I don't know who you are, but since you don't have a place to run away, you'd better not think about it. This place is surrounded by three party. Denny, Magenta. Check Gonie."
  npc_override_ba_maison_quests_17_2_i_don_t_luxury_listen_0bacb7: "I don't have the luxury, to listen to your stories."
  npc_override_ba_maison_quests_17_2_i_don_t_remember_exact_3c0920: "I don't remember the exact time since its some quite time ago already... and Varmundt haven't showed up for a long time."
  npc_override_ba_maison_quests_17_2_i_don_t_think_all_0dc29e: "I don't think all of that is too much."
  npc_override_ba_maison_quests_17_2_i_don_t_think_s_3f9c83: "But, I don't think that's not the choice right now. It would be more valuable if I sacrifice myself for something more important."
  npc_override_ba_maison_quests_17_2_i_don_t_think_so_cfc79d: "I don't think so. Didn't you think ever think we'd notice it first, if it was?"
  npc_override_ba_maison_quests_17_2_i_don_t_think_we_ca8050: "I don't think we can enter..."
  npc_override_ba_maison_quests_17_2_i_don_t_understand_what_5c7ff8: "I don't understand what you're saying? Did you just speak a human language just now?"
  npc_override_ba_maison_quests_17_2_i_don_t_understand_your_e5cc27: "I don't understand your criteria, but I understood them anyway."
  npc_override_ba_maison_quests_17_2_i_don_t_want_help_fd0527: "I don't want to help an intruder!"
  npc_override_ba_maison_quests_17_2_i_don_t_want_wander_2066c9: "I don't want to wander around this crappy garden anymore."
  npc_override_ba_maison_quests_17_2_i_everything_i_need_here_d3d412: "I have everything I need here to avenge the disgrace of my life. Why can't I use it?"
  npc_override_ba_maison_quests_17_2_i_excited_explain_about_98b1be: "I was excited to explain about boilers. But I didn't know that they would steal it. I~ really didn't know. Is humans famous for acting on a whim?"
  npc_override_ba_maison_quests_17_2_i_excluded_you_079e47: "I excluded you."
  npc_override_ba_maison_quests_17_2_i_feel_like_i_m_1c837e: "I feel like I'm wearing someone else's clothes..."
  npc_override_ba_maison_quests_17_2_i_fully_understand_what_339cb7: "I fully understand what you're trying to say. But the procedure..."
  npc_override_ba_maison_quests_17_2_i_gave_him_back_wasn_481f80: "I gave him back. Wasn't that what you're aiming for? If you let me go, you'll be blessed in the future."
  npc_override_ba_maison_quests_17_2_i_give_you_69ab2f: "I will give this to you."
  npc_override_ba_maison_quests_17_2_i_give_you_coordinate_pl_c24ef4: "I will give you the coordinate. Please follow this <NAVI>[guide]<INFO>ba_maison,357,291,0,101,0</INFO></NAVI>."
