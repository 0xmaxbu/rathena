  npc_override_ba_maison_quests_17_2_i_think_i_ll_able_39fa6c: "I think I'll be able to treat the first power plant, if you're able to take care of 44 Elite Bellare, Magical Dolor, and Unleashed Magic."
  npc_override_ba_maison_quests_17_2_i_think_i_ll_delayed_8e2386: "I think I'll be delayed a little because of the broken cleaning robots. It's an automatic robot that was hacked by the intruders. I'm thinking of how to clean the mess it made."
  npc_override_ba_maison_quests_17_2_i_think_i_should_start_33e320: "I think I should start with this ^0000CDsteam^000000."
  npc_override_ba_maison_quests_17_2_i_think_i_ve_finally_afa1cc: "... I think I've finally calm down."
  npc_override_ba_maison_quests_17_2_i_think_i_ve_seen_2a7eb9: "I think I've seen a fluorescent liquid in the sewage treatment plant, you can get it if you catch a black colored heart hunter scout."
  npc_override_ba_maison_quests_17_2_i_think_little_awkward_i_4bd16c: "I think it would be a little awkward if we all went."
  npc_override_ba_maison_quests_17_2_i_think_mr_h_why_7b1c34: "I think it was Mr. H. Why would he do such a thing."
  npc_override_ba_maison_quests_17_2_i_think_perfect_oh_s_1c4622: "I think this will be perfect. Oh... it's not perfect, but it's useful."
  npc_override_ba_maison_quests_17_2_i_think_s_basement_if_678610: "I think it's from the basement. If it's really from the basement, it's a big deal."
  npc_override_ba_maison_quests_17_2_i_think_s_better_let_badd43: "I think it's better to let the human guests in and search themselves."
  npc_override_ba_maison_quests_17_2_i_think_s_main_point_60c085: "I think that's the main point of what I want to say...?"
  npc_override_ba_maison_quests_17_2_i_think_s_out_s_1ba70c: "I think it's in and out of it's mind, that automatic doll......"
  npc_override_ba_maison_quests_17_2_i_think_so_c5dd19: "I think... so?"
  npc_override_ba_maison_quests_17_2_i_think_they_re_working_3cc1c6: "I think they're working after the sun goes down, but they're in trouble in many ways."
  npc_override_ba_maison_quests_17_2_i_think_while_avoiding_t_f9b444: "I can think while avoiding them. Or I can ask him to name me when he comes back."
  npc_override_ba_maison_quests_17_2_i_thought_goverment_medi_28b0af: "I thought that the goverment will mediate in the case of an incident, but it's as if we didn't exist in the goverment's eyes."
  npc_override_ba_maison_quests_17_2_i_thought_i_could_find_7e5e19: "I thought I could find a new book..."
  npc_override_ba_maison_quests_17_2_i_thought_i_going_die_e20f43: "I thought I was going to die!"
  npc_override_ba_maison_quests_17_2_i_thought_our_teamwork_g_d710ac: "I thought our teamwork was good, but we're not as good as our enemies?"
  npc_override_ba_maison_quests_17_2_i_thought_you_one_intrud_7bb56a: "I thought you were one of the intruder."
  npc_override_ba_maison_quests_17_2_i_thought_you_saw_lettuc_60c873: "I thought you saw the lettuce flying to you."
  npc_override_ba_maison_quests_17_2_i_told_alpha_analysisabl_516aa0: "I told Alpha that the analysisable data in the current state is over."
  npc_override_ba_maison_quests_17_2_i_told_you_go_anywhere_504f1f: "I told you not to go anywhere!!!!!"
  npc_override_ba_maison_quests_17_2_i_told_you_touch_boiler_d32f7f: "I told you not to touch the boiler."
  npc_override_ba_maison_quests_17_2_i_turned_upside_down_s_f2a302: "- I turned it upside down and it's stopped because of a little paper envelope stucked in it. -"
  npc_override_ba_maison_quests_17_2_i_used_big_skill_my_527857: "I used a big skill and my wound hurts..."
  npc_override_ba_maison_quests_17_2_i_usually_go_mission_alo_0d5e05: "I usually go on a mission alone, but this is the first time I haven't heard from him in so long. That's why everyone is looking for him anxiously. Something happened. Think about it quickly."
  npc_override_ba_maison_quests_17_2_i_ve_already_searched_lo_86a5e7: "I've already searched a lot of places in the mansion, and all of it were empty."
  npc_override_ba_maison_quests_17_2_i_ve_already_told_you_faf356: "I've already told you,\tbut now is not a good time to make vague promises."
  npc_override_ba_maison_quests_17_2_i_ve_asked_someone_dispo_315dd1: "I've asked someone to 'dispose' of the government personnel to prevent contact with the mercenaries... And I told him to break inside Varmundt Mansion and steal Varmundt's research data..."
  npc_override_ba_maison_quests_17_2_i_ve_been_asleep_long_f1a644: "I've been asleep for a long time. It was too loud recently, that's why I woke up."
  npc_override_ba_maison_quests_17_2_i_ve_been_building_somet_cdf525: "I've been building something before to protect myself from those hearthunters."
  npc_override_ba_maison_quests_17_2_i_ve_been_charge_warehou_5f677b: "I've been in charge of the warehouse for a very long time, I can quickly old or very small items that have been stored."
  npc_override_ba_maison_quests_17_2_i_ve_been_collecting_the_cf271f: "I've been collecting these, I'll let you have it, adventurer."
  npc_override_ba_maison_quests_17_2_i_ve_been_hearing_news_35cdd0: "I've been hearing news occasionally through the court wizard..."
  npc_override_ba_maison_quests_17_2_i_ve_been_looking_him_617240: "I've been looking for him for a while, but..."
  npc_override_ba_maison_quests_17_2_i_ve_been_out_place_68dc05: "I've been in and out of this place for a long time, but it's been a hassle for me to keep doing that. So let me own this place."
  npc_override_ba_maison_quests_17_2_i_ve_been_shrine_all_c0ab0a: "I've been with Shrine all this time. The adventurer met with the fake and almost went to the lake."
  npc_override_ba_maison_quests_17_2_i_ve_been_staying_water_b5e5c5: "I've been staying on the water around here. Then I met Varmundt who was taking a walk outside the mansion."
  npc_override_ba_maison_quests_17_2_i_ve_been_wandering_away_612e46: "I've been wandering away from home. That's how Varmundt was able to let me use the mansion's bathhouse without anyone contacting him about me."
  npc_override_ba_maison_quests_17_2_i_ve_been_wondering_sinc_990c55: "I've been wondering since a while ago, we're in a same group but, how do you distinguish the intruder from the guests?"
  npc_override_ba_maison_quests_17_2_i_ve_come_here_see_267f31: "I've come here to see what's wrong, and looks like a rat appeared."
  npc_override_ba_maison_quests_17_2_i_ve_eaten_all_potato_d0eae9: "- I've eaten all of the potato chips without a single leftover. -"
  npc_override_ba_maison_quests_17_2_i_ve_finished_all_heap_056d05: "- I've finished all the heap of potato chips that in front of Europa!! -"
  npc_override_ba_maison_quests_17_2_i_ve_got_notice_alp_1bf570: "I've got a notice from Alp... that they found the door on their way back, so let's get up there before it gets any more dangerous."
  npc_override_ba_maison_quests_17_2_i_ve_got_someone_wait_2fda6f: "I've got someone to wait, let's split up here."
  npc_override_ba_maison_quests_17_2_i_ve_got_temporary_assig_b26425: "I've got a temporary assignment from Alpha and I'm requesting assistance from other adventurers."
  npc_override_ba_maison_quests_17_2_i_ve_heard_news_those_499109: "I've heard the news. Those bastards."
  npc_override_ba_maison_quests_17_2_i_ve_heard_similar_story_aee858: "I've heard a similar story from Alpha, and I would never thought it was you."
  npc_override_ba_maison_quests_17_2_i_ve_heard_sometimes_hum_3af973: "I've heard that sometimes humans are reckless in challenging things beyond their abilities."
  npc_override_ba_maison_quests_17_2_i_ve_heard_too_must_5955ab: "I've heard it too. It must have been those corporate guys! We musn't stay here and clean up out there."
  npc_override_ba_maison_quests_17_2_i_ve_heard_your_opinions_177172: "I've heard your opinions."
  npc_override_ba_maison_quests_17_2_i_ve_met_eyes_automatic_8594ed: "- I've met eyes with the automatic doll in front of the breeding area. -"
  npc_override_ba_maison_quests_17_2_i_ve_once_read_book_475577: "I've once read a book about a training where the trainer knocks down the trainee whenever they try to get up, isn't it common?"
  npc_override_ba_maison_quests_17_2_i_ve_recovered_core_dba1d5: "I've recovered the core."
  npc_override_ba_maison_quests_17_2_i_ve_recovered_enough_co_98f06d: "I've recovered enough cores."
  npc_override_ba_maison_quests_17_2_i_ve_seen_all_before_a91e74: "I've seen it all before."
  npc_override_ba_maison_quests_17_2_i_ve_seen_everything_s_1c4515: "I've seen everything that's happened."
  npc_override_ba_maison_quests_17_2_i_waiting_your_return_233a1e: "I was waiting for your return."
  npc_override_ba_maison_quests_17_2_i_want_ask_about_past_253929: "I want to ask about past records."
  npc_override_ba_maison_quests_17_2_i_want_ask_why_you_608c7a: "I want to ask. Why are you trying to save that person?"
  npc_override_ba_maison_quests_17_2_i_want_save_person_tell_31d60f: "I want to save this person. Tell me how!"
  npc_override_ba_maison_quests_17_2_i_want_study_analyze_if_fe5b8e: "I want to study and analyze... If only this dizziness goes away..."
  npc_override_ba_maison_quests_17_2_i_went_into_second_power_703418: "I went into the second power plant myself and retrieved the chips, but there was no way for me to deal with them, and it became difficult situation because of the network failure."
  npc_override_ba_maison_quests_17_2_i_wish_i_two_wow_7cafb5: "I wish I were two. Wow... wouldn't it be nice? If there were two of me, this would be the best boiler room."
  npc_override_ba_maison_quests_17_2_i_won_t_fall_your_9d9a93: "I won't fall for your tricks, even if you look at me like that."
  npc_override_ba_maison_quests_17_2_i_won_t_let_heart_bfc243: "I won't let the Heart Hunters ruin this wonderful place!"
  npc_override_ba_maison_quests_17_2_i_won_t_lose_though_cd3311: "I won't lose though."
  npc_override_ba_maison_quests_17_2_i_wonder_how_many_magic_58f99e: "I wonder how many magic books are there!"
  npc_override_ba_maison_quests_17_2_i_wonder_if_doll_s_7bd6a1: "I wonder if that doll's data was engraved in some unknown way. In this boiler."
  npc_override_ba_maison_quests_17_2_i_wonder_if_s_really_eb5a06: "I wonder if it's really just a gem."
  npc_override_ba_maison_quests_17_2_i_wouldn_t_gone_far_4707b7: "I wouldn't have gone this far too if I didn't protect my own life."
  npc_override_ba_maison_quests_17_2_i_wouldn_t_lie_you_1ca9f5: "I wouldn't lie to you."
  npc_override_ba_maison_quests_17_2_if_automatic_dolls_human_9ea47a: "If automatic dolls or human go in and mess with a dangerous object by mistake."
  npc_override_ba_maison_quests_17_2_if_communication_lost_s_e7f5e1: "If communication is lost, it's just a puppet."
  npc_override_ba_maison_quests_17_2_if_continue_like_i_ll_089a0c: "If it continue like this, I'll probably end up malfunctioning again. I need your help."
  npc_override_ba_maison_quests_17_2_if_goes_wrong_i_ll_f05a36: "If this goes wrong, I'll hold you responsible!"
  npc_override_ba_maison_quests_17_2_if_government_asking_me_f9dfe2: "If the government is asking me to believe the lies they've been building until now, then I can't cooperate with you."
  npc_override_ba_maison_quests_17_2_if_government_doesn_t_co_398638: "If the government doesn't come forward at times like this, someone has to step up and advance the government forward."
  npc_override_ba_maison_quests_17_2_if_he_s_here_now_d6b105: "If he's here now, he would have solve all the problems. Or maybe the problem itself didn't occur."
  npc_override_ba_maison_quests_17_2_if_i_had_five_senses_43e1ed: "If I had five senses like humans, I could have understand humans better. Why didn't the master gave us that?"
  npc_override_ba_maison_quests_17_2_if_i_said_i_you_78fb5d: "If I said I would, you wouldn't believe me."
  npc_override_ba_maison_quests_17_2_if_ise_case_catastrophe_ddbe9a: "If that ise the case, the catastrophe that the automatic doll will bring is no longer a concern."
  npc_override_ba_maison_quests_17_2_if_last_one_please_repor_71d2bb: "If this is the last one, please report back to <NAVI>[Alpha]<INFO>ba_maison,74,150,0,0,0</INFO></NAVI>. Also... Welcome to the Varmundt's Mansion. If you need assistance, feel free to ask any automatic doll."
  npc_override_ba_maison_quests_17_2_if_last_one_please_repor_72c155: "If this is the last one, please report back to <NAVI>[Alpha]<INFO>ba_maison,74,150,0,0,0</INFO></NAVI>."
  npc_override_ba_maison_quests_17_2_if_mr_h_hadn_t_f4d131: "If Mr.H hadn't asked us to come here, we'd all be dead by now."
  npc_override_ba_maison_quests_17_2_if_only_chip_detected_i_7d172e: "If only the 'chip' was detected, I wouldn't have come in here, and I would never have met a con like you."
  npc_override_ba_maison_quests_17_2_if_person_found_injured_bddb06: "If a person is found injured, please check the signs of life and conduct a quick rescue operation."
  npc_override_ba_maison_quests_17_2_if_really_underground_s_e168b2: "If this is really from the underground, and that's a sound of an automatic doll, only destruction awaits us."
  npc_override_ba_maison_quests_17_2_if_s_broken_automatic_do_2145bf: "If it's a broken automatic doll, you know this mansion well, so you'll have to listen to the bath managers first. I'll do this one."
  npc_override_ba_maison_quests_17_2_if_so_i_come_back_029f03: "If so, I would come back earlier. Even if it's not, I'm sure I'll get a contact from a crew, who are scattered around the mansion."
  npc_override_ba_maison_quests_17_2_if_so_then_eaf858: "If so, then..."
  npc_override_ba_maison_quests_17_2_if_there_s_anything_i_4683db: "And if there's anything I can do, I'll cooperate on catching them."
  npc_override_ba_maison_quests_17_2_if_there_s_automatic_dol_392c2f: "If there's an automatic doll attacking us, we'll take it out of course."
  npc_override_ba_maison_quests_17_2_if_wasn_t_you_i_15410c: "If it wasn't for you, I'd wake up at the Prontera Church!"
  npc_override_ba_maison_quests_17_2_if_we_found_out_more_5299bc: "If we found out more about 'H. Luckenberg' at that time..."
  npc_override_ba_maison_quests_17_2_if_we_leave_now_776775: "If we leave now..."
  npc_override_ba_maison_quests_17_2_if_we_make_too_much_c97af7: "If we make too much noise, that thing in the basement might come up here. Please come back after dawn."
  npc_override_ba_maison_quests_17_2_if_we_re_lucky_we_9a7fc5: "If we're lucky, we might be able to locate the airship route that the 'Illusions' used to ran away."
  npc_override_ba_maison_quests_17_2_if_you_answer_me_i_74f349: "If you answer me, I am willing to cooperate with you in response."
  npc_override_ba_maison_quests_17_2_if_you_any_inconvenience_ce0d07: "If you have any inconvenience in the mansion, please feel free to tell any automatic dolls. Please take this Barmeal Ticket, as a token of appreciation for your hard work."
  npc_override_ba_maison_quests_17_2_if_you_apologized_bring_c291d8: "If you apologized, will it bring the dead back?"
  npc_override_ba_maison_quests_17_2_if_you_come_any_closer_9569e7: "If you come any closer, I'll attack you!!!"
  npc_override_ba_maison_quests_17_2_if_you_guest_mansion_ple_9acfe0: "If you are a guest to the mansion, please complete a guest registration first. Please understand that we are not responsible for any mishap that is caused by mistaking you as an intruder."
  npc_override_ba_maison_quests_17_2_if_you_here_301130: "If you do this here..."
  npc_override_ba_maison_quests_17_2_if_you_leave_alone_wande_4b10d9: "If you leave it alone, it will wander around the mansion and destroy it, so you'll have to deal with it quickly as you can."
  npc_override_ba_maison_quests_17_2_if_you_need_any_more_f1e279: "If you need any more records, please do not hesitate to ask."
  npc_override_ba_maison_quests_17_2_if_you_need_anything_ple_05dcc0: "If you need anything, please feel free to visit us. It was unintentionally rude to you, too."
  npc_override_ba_maison_quests_17_2_if_you_need_poison_i_6f7e4a: "If you need a poison, I will provide you......"
  npc_override_ba_maison_quests_17_2_if_you_no_objection_we_b12de9: "If you have no objection, we'll proceed as it is."
  npc_override_ba_maison_quests_17_2_if_you_power_before_you_a3cf10: "If you have power before you truly had power, you'd just break down and lose it."
  npc_override_ba_maison_quests_17_2_if_you_promise_help_me_f9658f: "If you promise to help me with this, I'll open the water garden for you."
  npc_override_ba_maison_quests_17_2_if_you_re_already_decide_7ae841: "If you're already decided, I would like talk with the representative more clearly."
  npc_override_ba_maison_quests_17_2_if_you_re_free_please_c4e61c: "If you're free, please help me. I'm short on hands. The valve and the boiler needs to be fixed. But I'm alone and the other dolls are busy."
  npc_override_ba_maison_quests_17_2_if_you_re_looking_high_02d47e: "If you're looking for a high-quality tea, this mansion is the place you're looking for."
  npc_override_ba_maison_quests_17_2_if_you_re_new_please_76ac5b: "If you're new, please come this way. I'll officially register you as a guest of the mansion."
  npc_override_ba_maison_quests_17_2_if_you_re_schedule_open_429510: "If you're schedule is open, won't you come with me to the Prontera Palace?"
  npc_override_ba_maison_quests_17_2_if_you_say_055b3e: "That... If you say that..."
  npc_override_ba_maison_quests_17_2_if_you_say_so_then_7cfc17: "If you say so, then I'll believe in you."
  npc_override_ba_maison_quests_17_2_if_you_see_monster_while_68333c: "If you see a monster while inside the bath, please don't rush to make contact with it and tell the dolls around you. Please let me know if you need any help finding the missing persons."
  npc_override_ba_maison_quests_17_2_if_you_send_signal_recei_596018: "If you send a signal, the receiver will~"
  npc_override_ba_maison_quests_17_2_if_you_such_distinguishe_c61b59: "If you were such a distinguished guest, I should have received your information much earlier."
  npc_override_ba_maison_quests_17_2_if_you_take_look_you_d7c84f: "If you take a look, you'll be to understand this evidence."
  npc_override_ba_maison_quests_17_2_if_you_tell_nearest_auto_a663e4: "If you tell the nearest automatic doll, we'll take care of it right away."
  npc_override_ba_maison_quests_17_2_if_you_think_outside_box_700136: "If you think outside of the box, all creatures that can talk and rationally are human beings."
  npc_override_ba_maison_quests_17_2_if_you_time_i_d_c90cc0: "If you have time, I'd like to ask for your help again ^0000CDafter dawn^000000, If you don't mind please come again tomorrow."
  npc_override_ba_maison_quests_17_2_if_you_told_me_as_141410: "If you told me as soon as the incident happened, that would've been great."
  npc_override_ba_maison_quests_17_2_if_you_use_without_regis_a0566a: "If you use it without registering, it may cause unnecessary misunderstanding to other guests, so you should atleast register. The master is also not here for consultation."
  npc_override_ba_maison_quests_17_2_if_you_want_any_informat_3c4598: "If you want any information from me, bring me a decent Illusion member."
  npc_override_ba_maison_quests_17_2_if_you_want_battle_you_888f7e: "If you want to battle, you're welcome anytime!"
  npc_override_ba_maison_quests_17_2_if_you_want_combat_train_f5eea0: "If you want to do a combat training, just tell me."
  npc_override_ba_maison_quests_17_2_if_you_want_read_about_0119bb: "If you want to read about the record, I will prepare it for you."
  npc_override_ba_maison_quests_17_2_if_you_want_relay_inform_b77ab1: "If you want to relay an information to anywhere in the mansion. Use the repeater to relay the information to all automatic dolls."
  npc_override_ba_maison_quests_17_2_ignition_break_b79eda: "Ignition Break...!!!"
  npc_override_ba_maison_quests_17_2_illegal_extortion_acquir_ee4acc: "It is illegal extortion to acquire real estate of an object whose intention cannot be expressed."
  npc_override_ba_maison_quests_17_2_illusion_alliance_s_like_1dbede: "The Illusion is an alliance, but it's like a structure of thought. The official members has a 'chip' planted in their body, it's use to recognize traitors like you."
  npc_override_ba_maison_quests_17_2_incident_record_confirme_719800: "Incident, record 5872, confirmed."
  npc_override_ba_maison_quests_17_2_information_enough_becau_b6569e: "The information is enough. Because this person's life is in danger! You said <NAVI>[Water Garden]<INFO>ba_maison,239,47,0,101,0</INFO></NAVI>, right?"
  npc_override_ba_maison_quests_17_2_intruder_took_step_back_032d9e: "The intruder took a step back however they're not completely gone yet. Therefore, the cleaner dolls had no choice but to remain the strengthened form. So be careful when coming into contact during cleaning time."
  npc_override_ba_maison_quests_17_2_invaders_didn_t_last_lon_2b5947: "The invaders didn't last long, but they threw the mansion into chaos in that brief moment. They took the machines in the mansion, the automatic dools, everything that seemed useful to them were removed out of place."
  npc_override_ba_maison_quests_17_2_invaders_which_guests_ca_2b7787: "The 'invaders' which the 'guests' calls the 'Illusions' has a 99.9% chance that they made modifications on the system."
  npc_override_ba_maison_quests_17_2_isn_t_gonie_there_two_ac0ae8: "Isn't that Gonie? And there are... two Lucky?"
  npc_override_ba_maison_quests_17_2_isn_t_great_i_survived_ed4392: "But isn't it great that I survived?"
