  npc_override_ba_maison_quests_17_2_nameless_spring_5bfa59: "^006600��Nameless Spring��^000000"
  npc_override_ba_maison_quests_17_2_navi_pavilion_info_ba_ma_8427cc: "The <NAVI>[pavilion]<INFO>ba_maison,334,143,0,101,0</INFO></NAVI> is this way. Automatic doll over there will take care of the broken repeater if you deliver it."
  npc_override_ba_maison_quests_17_2_navi_spinning_world_info_1b3b0e: "<NAVI>[Spinning World]<INFO>ba_2whs01,110,217,0,101,0</INFO></NAVI>. He said all the truth is beneath it. Try to find a place with such an item."
  npc_override_ba_maison_quests_17_2_nearly_exact_coordinates_b3324b: "The nearly exact coordinates of the signal's origin are..."
  npc_override_ba_maison_quests_17_2_necessary_ll_heal_up_no_b6d785: "Is that necessary? It'll heal up in no time, I just need to spray water here and a few slap on the cheek."
  npc_override_ba_maison_quests_17_2_needless_say_i_also_reme_e361de: "Needless to say, I also remember where the blueprint is."
  npc_override_ba_maison_quests_17_2_neither_mr_h_we_so_f1aebf: "Neither Mr.H and we are not so bled up back then."
  npc_override_ba_maison_quests_17_2_network_check_automatic_64906c: "Network check, automatic error correction. Reconfirming packets......"
  npc_override_ba_maison_quests_17_2_network_mansion_been_res_ce7731: "The network of the mansion has been restored and the signals in all areas are being sent and received clearly."
  npc_override_ba_maison_quests_17_2_network_working_fine_a9974f: "Is the network working fine?"
  npc_override_ba_maison_quests_17_2_never_come_empty_handed_efc1e2: "Never come empty-handed you hear!"
  npc_override_ba_maison_quests_17_2_next_use_smoke_bomb_blan_343aa8: "Next, use a smoke bomb and blank bombs while moving from one side to another. Be careful not get the ammunition wet, there's a lot of water and steam in here. And lastly do not damage the facility here."
  npc_override_ba_maison_quests_17_2_nice_see_you_again_f1237b: "Nice to see you again."
  npc_override_ba_maison_quests_17_2_no_b8b9f1: "No."
  npc_override_ba_maison_quests_17_2_no_c03f1e: "No..."
  npc_override_ba_maison_quests_17_2_no_did_you_wuss_out_504338: "No, did you wuss out just now?"
  npc_override_ba_maison_quests_17_2_no_don_t_broken_robot_63804c: "No. Don't. The broken robot will just move to another place."
  npc_override_ba_maison_quests_17_2_no_even_if_you_told_311bfe: "No, even if you told us to cover..."
  npc_override_ba_maison_quests_17_2_no_how_you_may_even_f13254: "No! How! You may not even know the dangers that lurks in their management!"
  npc_override_ba_maison_quests_17_2_no_i_just_t_stand_6dae54: "No, I just can't stand being harassed like this just because I'm a traitor, right?"
  npc_override_ba_maison_quests_17_2_no_i_ll_receive_my_dd91c6: "No! I'll receive my next orders soon!"
  npc_override_ba_maison_quests_17_2_no_i_ve_never_seen_89053a: "No, I've never seen it before."
  npc_override_ba_maison_quests_17_2_no_intermittent_signal_b_e508a3: "No intermittent signal has been received yet."
  npc_override_ba_maison_quests_17_2_no_joke_caa03a: "This is no joke!!!"
  npc_override_ba_maison_quests_17_2_no_lucky_you_re_best_3ca8e2: "No!! Lucky you're the best! The best!! You know we really can't live without Lucky! But..."
  npc_override_ba_maison_quests_17_2_no_matter_how_good_your_5029a2: "No matter how good your recovery skills are, you cannot recover hair or clothes..."
  npc_override_ba_maison_quests_17_2_no_matter_how_much_we_01b77e: "No matter how much we use that record with mixed opinions, we won't be able to reach an agreement."
  npc_override_ba_maison_quests_17_2_no_mercenaries_didn_t_ev_576fa6: "No, the mercenaries didn't even know it was a person from the government. Even the body was found late."
  npc_override_ba_maison_quests_17_2_no_need_grand_feel_free_8d2795: "^006600No need to be grand. Feel free to go and soak your feet.^000000"
  npc_override_ba_maison_quests_17_2_no_no_i_m_here_c2cca7: "No, no, I'm here too. Am a bit late?"
  npc_override_ba_maison_quests_17_2_no_one_even_knows_what_1aa148: "No one even knows what's where."
  npc_override_ba_maison_quests_17_2_no_one_hurt_they_found_ac9404: "No one was hurt but they found a lot of blood stains. The leaders are still investigating it."
  npc_override_ba_maison_quests_17_2_no_one_s_stepping_up_a80734: "But no one's stepping up. The government is not like a real government, it's not moving forward at all."
  npc_override_ba_maison_quests_17_2_no_regular_signals_been_567a01: "No regular signals have been received yet."
  npc_override_ba_maison_quests_17_2_no_s_56a33f: "No, it's not......"
  npc_override_ba_maison_quests_17_2_no_s_enough_measure_f26bee: "No, It's enough measure, but..."
  npc_override_ba_maison_quests_17_2_no_tatio_i_ve_sent_d663b1: "No, Tatio! I've sent you a call through Grey, but I didn't expect you to arrive this soon!"
  npc_override_ba_maison_quests_17_2_no_there_wasn_t_anything_5ba50e: "No, there wasn't anything here. It was completely empty. You brought him in with you on your way in."
  npc_override_ba_maison_quests_17_2_no_what_am_i_seeing_2d8416: "No, what am I seeing?!!!"
  npc_override_ba_maison_quests_17_2_no_worries_998327: "No worries."
  npc_override_ba_maison_quests_17_2_no_you_really_member_ill_015ad3: "No, are you really a member of the Illusion?"
  npc_override_ba_maison_quests_17_2_no_you_t_master_left_0b0632: "No, you can't. The master left me here. So I have to stay here. Until the master returns."
  npc_override_ba_maison_quests_17_2_nom_nom_nom_nom_crunch_5128de: "Nom nom nom nom... crunch crunch... wobble wobble........"
  npc_override_ba_maison_quests_17_2_normal_operation_high_si_9b1d2f: "In normal operation. High signal strength."
  npc_override_ba_maison_quests_17_2_nothing_s_wrong_yet_no_9cd337: "Nothing's wrong yet. But no one knows how long it will last. Don't let your guard down"
  npc_override_ba_maison_quests_17_2_now_as_guest_honor_you_c3b4e7: "From now on. {0}, As a guest of honor, you are free to use the facilities in this mansion. If you have any question, please feel free to contact the nearest automatic dolls."
  npc_override_ba_maison_quests_17_2_now_c0bb1b: "Now!!"
  npc_override_ba_maison_quests_17_2_now_go_after_remnant_hea_a0262a: "Now, with this, go after the remnant of the Heart Hunter and the traitors."
  npc_override_ba_maison_quests_17_2_now_gonie_there_s_two_44ab72: "Now, Gonie... there's two of them."
  npc_override_ba_maison_quests_17_2_now_how_you_like_solve_0f388b: "Now, how would you like to solve this problem? {0}, going down to the basement with his arms and legs, with good intention to finish it's body."
  npc_override_ba_maison_quests_17_2_now_i_m_back_alpha_6c33a2: "Now I'm back at Alpha's request."
  npc_override_ba_maison_quests_17_2_now_i_make_my_own_56f216: "Now, I have to make my own move."
  npc_override_ba_maison_quests_17_2_now_i_see_i_don_4c7d6f: "Now that I see it, I don't know why I mistaken you as an intruder. You're different."
  npc_override_ba_maison_quests_17_2_now_i_start_my_job_a50f2a: "Now, I can start my job."
  npc_override_ba_maison_quests_17_2_now_i_think_about_i_de0ee7: "Now that I think about it, I deeply regret it."
  npc_override_ba_maison_quests_17_2_now_show_us_evidence_91021b: "Now, show us the evidence."
  npc_override_ba_maison_quests_17_2_now_tell_us_about_facts_161893: "Now, tell us about the facts that you've heard."
  npc_override_ba_maison_quests_17_2_now_we_open_bathhouse_ou_0d52c9: "From now on, we will open the bathhouse to our guests. Please pay special attention while conducting the search, as there are circumstances and testimonies suspecting the existence of unidentified creatures."
  npc_override_ba_maison_quests_17_2_now_you_re_safe_all_8d781c: "Now you're safe, and all you have to do is chase those traitors to the end."
  npc_override_ba_maison_quests_17_2_now_you_use_all_faciliti_def9c7: "Now, you can use all the facilities of the mansion as an official guest."
  npc_override_ba_maison_quests_17_2_number_items_your_posses_fd42dc: "The number of items in your possession is too high, so you cannot proceed with the conversation."
  npc_override_ba_maison_quests_17_2_oh_5235ff: "Oh!"
  npc_override_ba_maison_quests_17_2_oh_adventurer_here_too_i_23676e: "Oh, the adventurer is here too. If you're here for a bath, I'm afraid you can't use it for a while. Look at that. The automatic doll is blocking the entrance."
  npc_override_ba_maison_quests_17_2_oh_adventurer_here_you_dbb806: "Oh, adventurer, here you are."
  npc_override_ba_maison_quests_17_2_oh_am_i_wrong_intruder_e88025: "Oh, am I wrong? The intruder was very interested in the boiler and the supply system. They stealed the other boiler without my knowledge."
  npc_override_ba_maison_quests_17_2_oh_antidote_d6bef5: "Oh..., Is that it. The antidote."
  npc_override_ba_maison_quests_17_2_oh_any_chance_did_you_fee147: "Oh, by any chance did you come to bring me a spare communication chips for the repeater?"
  npc_override_ba_maison_quests_17_2_oh_before_you_looked_aro_dc7704: "Oh, before that... {0}, have you looked around the mansion?"
  npc_override_ba_maison_quests_17_2_oh_cleaning_robot_course_3d7ea9: "Oh, a cleaning robot? Of course, some managers call it that, but......"
  npc_override_ba_maison_quests_17_2_oh_did_our_hawk_bit_f62548: "Oh, did our hawk bit you? It's been going on since he was attacked by the ^0000CDintruders^000000. I already fixed it before, but Wary always come out and does this..."
  npc_override_ba_maison_quests_17_2_oh_doll_288eeb: "Oh, to a doll..."
  npc_override_ba_maison_quests_17_2_oh_here_you_way_lucky_e2b7aa: "Oh, here you are, this way, is Lucky not here yet?"
  npc_override_ba_maison_quests_17_2_oh_i_am_f87901: "Oh, I am..."
  npc_override_ba_maison_quests_17_2_oh_i_forgot_tell_you_8b7d5b: "Oh, I forgot to tell you this."
  npc_override_ba_maison_quests_17_2_oh_i_ll_also_take_07a19a: "Oh, I'll also take the Radar."
  npc_override_ba_maison_quests_17_2_oh_i_m_feeling_little_a629ec: "Oh... I'm feeling a little bit better now. Intruder or whatever. All I have to do is cross that river, ahahaha..."
  npc_override_ba_maison_quests_17_2_oh_i_m_so_sick_442514: "Oh, I'm so sick of it..."
  npc_override_ba_maison_quests_17_2_oh_my_god_guy_so_a90ee8: "Oh, my God. This guy is so..."
  npc_override_ba_maison_quests_17_2_oh_no_even_automatic_dol_30f639: "Oh no... even an automatic doll..."
  npc_override_ba_maison_quests_17_2_oh_no_wonder_network_sto_7f5e57: "Oh, no wonder! The network stopped working suddenly. The repeater is not functioning! Then why isn't Alpha coming?"
  npc_override_ba_maison_quests_17_2_oh_one_who_went_search_fbd598: "Oh! The one who went to search are coming back. Talk to them."
  npc_override_ba_maison_quests_17_2_oh_ran_away_just_grab_69c12d: "Oh, it ran away! Just grab another broken one and bring it to me."
  npc_override_ba_maison_quests_17_2_oh_really_i_didn_t_f8c23d: "Oh, really? I didn't know because it's been so long since I saw a human being."
  npc_override_ba_maison_quests_17_2_oh_really_then_go_ahead_0c377f: "Oh, really? Then go ahead to the <NAVI>[pavilion]<INFO>ba_maison,334,143,0,0,0</INFO></NAVI> first. It's the closest one here. Just follow this road over here."
  npc_override_ba_maison_quests_17_2_oh_s_because_everytime_t_55654e: "Oh, it's because of that! Everytime time I find something broken, I'll repair it, but as you can see, even if I take my eyes out for a moment, Wary comes out and break it like this."
  npc_override_ba_maison_quests_17_2_oh_s_dangerous_161d5e: "Oh, it's dangerous!"
  npc_override_ba_maison_quests_17_2_oh_s_mochi_aren_t_0e45de: "Oh, it's not mochi? Aren't you the guy I met before? Then, meat? Do you like meat? You like meat, don't you? I've never seen anyone who doesn't like meat. I'll give you all the meat I have."
  npc_override_ba_maison_quests_17_2_oh_s_right_dbe0d9: "Oh~~ That's right!"
  npc_override_ba_maison_quests_17_2_oh_s_right_he_also_9b8ad1: "Oh, that's right! He also told me to go to the lake too!"
  npc_override_ba_maison_quests_17_2_oh_s_serious_situation_06899e: "Oh. It's a serious situation."
  npc_override_ba_maison_quests_17_2_oh_s_working_there_eithe_04ec82: "Oh, it's not working there either."
  npc_override_ba_maison_quests_17_2_oh_she_s_princess_her_e5e0b1: "Oh, she's not a princess. Her name is Princess"
