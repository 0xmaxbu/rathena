  npc_override_ba_maison_quests_17_2_menu_ridsh_3dd0db: "Ridsh : Are you fine, Mr. Kaya?"
  npc_override_ba_maison_quests_17_2_menu_ridsh_6b0ae7: "Ridsh : The corporate guy wants to say something."
  npc_override_ba_maison_quests_17_2_menu_ridsh_94cdcc: "Ridsh : Tell the president to come out!"
  npc_override_ba_maison_quests_17_2_menu_ridsh_a3178a: "Ridsh : I have nothing to say right now."
  npc_override_ba_maison_quests_17_2_menu_ridsh_d815c2: "Ridsh : Would you like some tea? There's a snack here if you want."
  npc_override_ba_maison_quests_17_2_menu_rookie_12407c: "Rookie : Let's listen to the corporate representative."
  npc_override_ba_maison_quests_17_2_menu_rookie_32bf05: "Rookie : Ah, Mina is so weak, I can't get used to it~!"
  npc_override_ba_maison_quests_17_2_menu_rookie_32db15: "Rookie : I'm a sinner for letting you suffer alone. We should have went there too."
  npc_override_ba_maison_quests_17_2_menu_rookie_34a4c8: "Rookie : Then I'll be back!"
  npc_override_ba_maison_quests_17_2_menu_rookie_83f293: "Rookie : Well, at this point, I'd rather refrain from speaking, right?"
  npc_override_ba_maison_quests_17_2_menu_rookie_be9c57: "Rookie : I don't know how I ended up with these two people."
  npc_override_ba_maison_quests_17_2_menu_rookie_c243bf: "Rookie : Well, we made a lot of progress. It's all thanks to your help adventurer."
  npc_override_ba_maison_quests_17_2_menu_rookie_cc6124: "Rookie: So it's a place name, huh?"
  npc_override_ba_maison_quests_17_2_menu_rookie_e723c6: "Rookie : Let's listen to Ridsh."
  npc_override_ba_maison_quests_17_2_menu_rookie_f6d737: "Rookie: Did you call me?"
  npc_override_ba_maison_quests_17_2_menu_security_61ec75: "Security Office : ..."
  npc_override_ba_maison_quests_17_2_menu_security_64b972: "Security Office : This is area 4, over."
  npc_override_ba_maison_quests_17_2_menu_security_a4122f: "Security Office : Currently, all intruders have been repelled. Patrolling is not required anymore, over."
  npc_override_ba_maison_quests_17_2_menu_tatio_23ed44: "Tatio : I will humbly listen to anything."
  npc_override_ba_maison_quests_17_2_menu_tess_5101ad: "Tess : Please pay attention to Ridsh."
  npc_override_ba_maison_quests_17_2_menu_tess_d63f2e: "Tess : Thank you for all your help, adventurer."
  npc_override_ba_maison_quests_17_2_menu_tess_f51214: "Tess : I think Kaya Toss has something to say."
  npc_override_ba_maison_quests_17_2_menu_tess_f99d4a: "Tess : All of us were playing in the hands of the corporate."
  npc_override_ba_maison_quests_17_2_mercenaries_culprit_29f8ec: "But, the mercenaries are not the culprit."
  npc_override_ba_maison_quests_17_2_mercenaries_perspective_99209e: "From the mercenaries' perspective, he was suspicious."
