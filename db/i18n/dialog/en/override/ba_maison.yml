  npc_override_ba_maison_quests_17_2_i_ll_go_ahead_register_668c68: "I'll go ahead and register first."
  npc_override_ba_maison_quests_17_2_i_ll_go_boiler_room_a15bb1: "I'll go to the Boiler Room."
  npc_override_ba_maison_quests_17_2_i_ll_go_check_you_934770: "I'll go and check for you."
  npc_override_ba_maison_quests_17_2_i_ll_happy_ask_your_72ad3f: "I'll be happy to ask for your help again."
