  npc_override_ba_maison_quests_17_2_i_ll_get_touch_my_31d956: "I'll get in touch with my secretary, please continue without me."
  npc_override_ba_maison_quests_17_2_i_ll_give_you_barmeal_94d32a: "I'll give you this Barmeal Ticket in return."
  npc_override_ba_maison_quests_17_2_i_ll_give_you_some_78a500: "I'll give you some Barmeal Tickets in return for your help. You can use it freely at the mansion's restaurant."
