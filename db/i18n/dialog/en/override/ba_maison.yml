Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_ba_maison_ba_maison_menu_luina_58c88f: "Luina : Just a moment, If you want to get in there, I need to talk to you first..."
  npc_override_ba_maison_ba_maison_there_still_some_work_do_3cddcd: "There is still some work to be done here. Let's look around more."
  npc_override_ba_maison_quests_17_2_a_e88955: "(-_-a);;;"
  npc_override_ba_maison_quests_17_2_aaaaaaah_6a55a7: "Aaaaaaah!!!"
  npc_override_ba_maison_quests_17_2_aaaaaah_2867f6: "Aaaaaah!!!"
  npc_override_ba_maison_quests_17_2_about_mercenary_named_h_8fc4f3: "About a mercenary named H."
  npc_override_ba_maison_quests_17_2_accept_3e1999: "Accept."
  npc_override_ba_maison_quests_17_2_accept_bb54db: "Accept"
  npc_override_ba_maison_quests_17_2_accept_request_ad9c99: "Accept Request."
  npc_override_ba_maison_quests_17_2_accommodations_signal_re_314f0c: "Accommodations... Signal received..."
  npc_override_ba_maison_quests_17_2_according_analysis_s_one_6d58f1: "According to the analysis, it's a one-way reception."
  npc_override_ba_maison_quests_17_2_according_definition_she_2e74fb: "According to the definition, she is definitely not a colleague."
  npc_override_ba_maison_quests_17_2_ack_e24c27: "- Ack! -"
  npc_override_ba_maison_quests_17_2_act_against_corporate_s_530705: "Act against the corporate's interest, I'm always working for the benefit of the corporate."
  npc_override_ba_maison_quests_17_2_actually_cleaning_dolls_b14395: "Actually, the cleaning dolls wasn't as strong as it is now. The measure was taken inevitably because of the intruders."
  npc_override_ba_maison_quests_17_2_addition_broken_automati_2217fd: "In addition, the broken automatic dolls is wandering around and keeps destroying the repeaters, doubling the supply needed."
  npc_override_ba_maison_quests_17_2_addition_guest_525161: "In addition... a guest?"
  npc_override_ba_maison_quests_17_2_addition_there_facility_e8f46b: "In addition, there is a facility for body washing located in the basement of the mansion. We encourage guests who visits the mansion, to visit Meditatio, the great bathhouse."
  npc_override_ba_maison_quests_17_2_addition_they_also_state_53975c: "In addition, they have also stated that, you have come here to ^0000CDcatch the intruders^000000 who are making a disturbance inside the mansion."
  npc_override_ba_maison_quests_17_2_adventurer_chuckles_64e358: "Adventurer, *Chuckles*"
  npc_override_ba_maison_quests_17_2_adventurer_cleaning_robo_c3cb37: "Adventurer, cleaning robots only response to what people say."
  npc_override_ba_maison_quests_17_2_adventurer_could_you_get_0e2549: "Adventurer, could you get us the Fluorescent Liquids and Broken Swords?"
  npc_override_ba_maison_quests_17_2_adventurer_could_you_go_1cef8d: "Adventurer, could you go in the second horsepower plant and collect 10 ^0000CDPotato Chips^000000?"
  npc_override_ba_maison_quests_17_2_adventurer_could_you_go_b85d33: "Adventurer, could you go inside and get the leaves of the Silva Papilla?"
  npc_override_ba_maison_quests_17_2_adventurer_hey_mr_kaya_q_609f6d: "Adventurer, Hey. Mr. Kaya was quite depressed. do you mind checking on Mr. Kaya?"
  npc_override_ba_maison_quests_17_2_adventurer_let_s_go_navi_f606f2: "Adventurer, let's go to the <NAVI>[lounge]<INFO>ba_bath,203,58,0,101,0</INFO></NAVI>."
  npc_override_ba_maison_quests_17_2_adventurer_long_time_no_2c2b1b: "Adventurer! Long time no see!"
  npc_override_ba_maison_quests_17_2_adventurer_meet_other_ma_c41d28: "Adventurer meet with the other managers like me to check if there's anything suspicious about the other automatic dolls. I have to get the blueprints first."
  npc_override_ba_maison_quests_17_2_adventurer_movement_illu_d6516d: "Adventurer! The movement of the Illusions has been confirmed inside the mansion. Soon we're going to form a team, figure out the structure of the mansion, and start the operation."
  npc_override_ba_maison_quests_17_2_adventurer_please_go_man_85c0de: "Adventurer, please go to the managers of the mansion and find out what happened about the time when the mercenaries stayed here in Varmundt Mansion."
  npc_override_ba_maison_quests_17_2_adventurer_quiet_i_t_cau_4bcc54: "Adventurer, be quiet! I can't be caught here alone!"
  npc_override_ba_maison_quests_17_2_adventurer_take_these_fr_aa84f0: "Adventurer, take these ^0000CDfreezing trap^000000. Please plant it in every marked ?? <NAVI>[places]<INFO>ba_bath,55,55,0,101,0</INFO></NAVI>. You just have to plant it in place and keep it steady. Please hurry."
  npc_override_ba_maison_quests_17_2_adventurer_there_s_no_wa_43364e: "Adventurer, there's no way that you'd think Mina is still an Illusion, right?"
  npc_override_ba_maison_quests_17_2_adventurer_what_s_1932f5: "Adventurer, what's that?"
  npc_override_ba_maison_quests_17_2_adventurer_whenever_you_68ef5c: "Adventurer, whenever you're free please come to the Boiler Room. I'll you for one thing."
  npc_override_ba_maison_quests_17_2_adventurer_you_arrived_j_d249b5: "Adventurer, you arrived just in time."
  npc_override_ba_maison_quests_17_2_adventurer_you_here_help_964610: "Adventurer, are you here to help me again?"
  npc_override_ba_maison_quests_17_2_adventurer_you_re_only_o_27ad26: "Adventurer, you're the only one that the elders will believe."
  npc_override_ba_maison_quests_17_2_adventurer_you_set_up_al_a1737c: "Adventurer, have you set up all the traps? It already started over there. Hurry and go."
  npc_override_ba_maison_quests_17_2_adventurer_you_which_one_193509: "Adventurer, do you which one is the real one?"
  npc_override_ba_maison_quests_17_2_after_all_you_re_alone_8998b3: "After all, you're not alone."
  npc_override_ba_maison_quests_17_2_after_master_had_destroy_3a8bf1: "After the master had destroyed this place, I have been doing something else for a while, but..."
  npc_override_ba_maison_quests_17_2_again_i_m_sorry_f7d114: "Again, I'm sorry."
  npc_override_ba_maison_quests_17_2_again_trouble_dba040: "Again... trouble..."
  npc_override_ba_maison_quests_17_2_ah_again_another_steam_87b8bb: "Ah! Again, another steam!!!"
  npc_override_ba_maison_quests_17_2_ah_ahhhhhh_dear_guest_yo_bb9d57: "Ah, ahhhhhh! Dear guest, are you hurt? Where? How? How much?!"
  npc_override_ba_maison_quests_17_2_ah_driving_me_crazy_hey_b1a2c4: "Ah, this is driving me crazy. Hey, when's the antidote going to be finished?"
  npc_override_ba_maison_quests_17_2_ah_ef9ee9: "...Ah!!"
  npc_override_ba_maison_quests_17_2_ah_guesthouse_we_current_917a48: "Ah, the guesthouse. We are currently using it as a prison."
  npc_override_ba_maison_quests_17_2_ah_i_confirmed_edf331: "Ah, I confirmed."
  npc_override_ba_maison_quests_17_2_ah_i_new_body_16c7ec: "Ah. I have a new body..."
  npc_override_ba_maison_quests_17_2_ah_i_see_df4b54: "Ah, I see."
  npc_override_ba_maison_quests_17_2_ah_mina_her_face_looks_4d2e4a: "Ah, Mina. Her face looks blue, isn't it? Adventurer, please tell them to get ready quickly!"
  npc_override_ba_maison_quests_17_2_ah_she_came_you_re_6c643d: "Ah~ She came! You're the one who requested that!"
  npc_override_ba_maison_quests_17_2_ah_since_when_you_been_acbd20: "Ah, {0}, since when have you been here? I've shown you a shameful side of me."
  npc_override_ba_maison_quests_17_2_ah_there_s_lot_you_25add1: "Ah! There's a lot of {0} on you... Ah, you've been playing with the Pitayas."
  npc_override_ba_maison_quests_17_2_ah_yeah_conversation_lit_45473e: "Ah, yeah. This conversation is a little awkward..."
  npc_override_ba_maison_quests_17_2_ah_yes_mansion_managers_f2254c: "Ah, yes. The mansion managers would remember it!"
  npc_override_ba_maison_quests_17_2_ah_you_talking_about_sec_fc2b07: "Ah... Are you talking about the secretary?"
  npc_override_ba_maison_quests_17_2_aha_ha_ha_don_t_3fb0da: "Aha ha ha... don't get too excited, anyway."
  npc_override_ba_maison_quests_17_2_ahh_aa7d86: "Ahh!"
  npc_override_ba_maison_quests_17_2_ahhhhhhhhhhhh_ae56b2: "Ahhhhhhhhhhhh!!"
  npc_override_ba_maison_quests_17_2_all_automatic_dolls_mans_92245e: "All the automatic dolls in the mansion are connected to a wireless network."
  npc_override_ba_maison_quests_17_2_all_b2ff06: "Not at all."
  npc_override_ba_maison_quests_17_2_all_contextual_material_4f2cc3: "All contextual, and material evidence evidence leads to the corporate."
  npc_override_ba_maison_quests_17_2_all_right_39e51b: "All right..."
  npc_override_ba_maison_quests_17_2_all_right_441c8d: "All right."
  npc_override_ba_maison_quests_17_2_all_right_all_right_whet_4311ce: "All right, All right. Whether it's revenge play or a romance novel, we should make an antidote first and talk after you get better."
  npc_override_ba_maison_quests_17_2_all_right_give_leaves_si_73a502: "All right. Give the leaves of Silva Papilla to me."
  npc_override_ba_maison_quests_17_2_all_right_i_won_t_3e5024: "All right. I won't fall for your provocation. Instead I'll ask you one thing."
  npc_override_ba_maison_quests_17_2_all_right_over_there_c0552b: "All right, over there!"
  npc_override_ba_maison_quests_17_2_all_sudden_b57acc: "All of a sudden?"
  npc_override_ba_maison_quests_17_2_all_you_boil_water_well_6ff3dc: "All you have to do is boil the water well."
  npc_override_ba_maison_quests_17_2_almond_didn_t_understand_cb5bc4: "Almond didn't understand half of what Sweety was saying."
  npc_override_ba_maison_quests_17_2_alpha_asked_me_bring_s_3ba52d: "Alpha asked me to bring it's 'Core'."
  npc_override_ba_maison_quests_17_2_alpha_busy_right_now_65af87: "Alpha is busy right now."
  npc_override_ba_maison_quests_17_2_alpha_going_some_more_re_0a5dbd: "Alpha is going to do some more research on the airship hangar, so go check it out."
  npc_override_ba_maison_quests_17_2_alpha_said_sweety_s_body_220306: "Alpha said that sweety's body's base is the same as ours."
  npc_override_ba_maison_quests_17_2_alpha_said_we_fix_anythi_864999: "Alpha said that we can fix anything that's broken, but there's a bigger problem..."
  npc_override_ba_maison_quests_17_2_alpha_said_we_use_force_d0d41a: "Alpha said that we will have to use force to automatic dolls like that."
  npc_override_ba_maison_quests_17_2_alpha_too_busy_come_no_a3d231: "Alpha is too busy to come? No way. Oh, were you trying to help me voluntarily? What an unusual guest. Come to think of it, there was a^0000CDcustomer like that before^000000."
  npc_override_ba_maison_quests_17_2_alright_as_mercenary_who_fd8293: "Alright, ^0000CDas a mercenary who came here as a guest of Varmundt!!!^000000"
  npc_override_ba_maison_quests_17_2_also_146dab: "This also..."
  npc_override_ba_maison_quests_17_2_also_1aca05: "Also..."
  npc_override_ba_maison_quests_17_2_also_being_hated_such_cu_795c49: "Also being hated by such cute, smart, automatic dolls... is not so bad."
  npc_override_ba_maison_quests_17_2_also_help_us_broken_auto_608693: "It also help us with the broken automatic dolls roaming around the mansion. Please take care of any Broken Betas roaming around the mansion and bring it's communication chips with you."
  npc_override_ba_maison_quests_17_2_also_help_us_broken_auto_915714: "It also help us with the broken automatic dolls roaming around the mansion. Please take care of any Broken Betas roaming around the mansion and bring its communication chips with you."
  npc_override_ba_maison_quests_17_2_also_if_you_need_help_769224: "Also, if you need help cleaning up and information about the intruders in the mansion, we will fully cooperate."
  npc_override_ba_maison_quests_17_2_also_order_us_job_correc_13c8a2: "Also, in order for us to do the job correctly, it would be better to accompany not only us, but also the people of the president."
  npc_override_ba_maison_quests_17_2_also_s_much_please_accep_423ed1: "Also, it's not much but please accept this as an apology."
  npc_override_ba_maison_quests_17_2_also_s_small_amount_i_c1d0a6: "Also, it's a small amount but I'll give you some Barmeal Tickets. I got it from the automatic dolls here."
  npc_override_ba_maison_quests_17_2_also_we_t_risk_our_a2ea97: "Also, we can't risk our guests into such thing."
  npc_override_ba_maison_quests_17_2_also_what_goverment_hopi_94ca00: "This is also what the goverment is hoping for."
  npc_override_ba_maison_quests_17_2_also_while_your_way_plea_66e94c: "Also, while on your way, please go out to the garden and pick up the 'cores' of the broken automatic dolls."
  npc_override_ba_maison_quests_17_2_although_looks_complex_w_371713: "Although it looks complex from what the eyes see, It's really not that complicated because everything is organized according to it classification."
  npc_override_ba_maison_quests_17_2_although_s_repaired_upon_0096f8: "Although it's repaired upon discovery, it's a problem that occurs continuously. The necessary communication chips demand are difficult to supply."
  npc_override_ba_maison_quests_17_2_although_we_still_don_t_e0fdee: "Although we still don't know the whereabouts of Master's Collection No. 3, we need to continue to gather information coming in from here..."
  npc_override_ba_maison_quests_17_2_althought_he_master_gran_3632b1: "Althought he master has granted you access to the bathhouse and have been generous as you have said, you should show some sincerity to it."
  npc_override_ba_maison_quests_17_2_ammunition_fighting_isn_198c8e: "Ammunition fighting isn't right for anyone who usually stays in the underwater. So you'd rather ask the adventurer over here for help rather than us."
  npc_override_ba_maison_quests_17_2_among_what_you_said_most_d85882: "Among what you have said, the most suspicious is the action of the intruders."
  npc_override_ba_maison_quests_17_2_another_person_they_part_c63d8c: "Another person. Are they a part of your party?"
  npc_override_ba_maison_quests_17_2_another_suspicious_trace_7bf90e: "Another suspicious trace was found near the mansion."
  npc_override_ba_maison_quests_17_2_any_guess_357f77: "Any guess?"
  npc_override_ba_maison_quests_17_2_any_record_incidents_acc_0d7d89: "Any record of incidents and accidents."
  npc_override_ba_maison_quests_17_2_any_record_mercenaries_b_347151: "Any record of mercenaries is a bell."
  npc_override_ba_maison_quests_17_2_anyway_alpha_said_we_dea_e3c4ca: "Anyway, Alpha said, we have to deal with the automatic robots who are not able to distinguish identification code and recover the cores."
  npc_override_ba_maison_quests_17_2_anyway_future_let_me_kno_627980: "Anyway, in the future, let me know if you have time."
  npc_override_ba_maison_quests_17_2_anyway_i_fix_repeater_le_8024e9: "Anyway, I have to fix the repeater. Let me see..."
  npc_override_ba_maison_quests_17_2_anyway_i_m_going_get_a806c0: "Anyway, I'm not going to get involved with those idiots again. I promise."
  npc_override_ba_maison_quests_17_2_anyway_if_we_lot_guests_852e7f: "Anyway, If we have a lot of guests, they'll be coming to eat soon. I've got to prepare. It's been a long time since I've had guests."
  npc_override_ba_maison_quests_17_2_anyway_let_me_know_if_928a0e: "Anyway, let me know if you have time."
  npc_override_ba_maison_quests_17_2_anyway_machine_such_curi_618713: "Anyway, a machine with such curiosity, it's so attractive. I want to know more about your way of thinking."
  npc_override_ba_maison_quests_17_2_anyway_please_get_me_som_1ca039: "Anyway, Please get me some materials that I need while I'm trying to rip off this guy. what's this guy called again, Eisen?"
  npc_override_ba_maison_quests_17_2_anyway_s_really_suspicio_3e89f9: "Anyway, that's really suspicious. What the hell is going on?"
  npc_override_ba_maison_quests_17_2_anyway_thank_you_checkin_dc27a6: "Anyway, thank you for checking. Have some cookies. They say it's delicious. It's a cookie that nourishes the animals and plants in the garden, but guests also like it when I give it to them."
  npc_override_ba_maison_quests_17_2_anyway_who_intruder_041f8d: "Anyway, who...? An intruder? ...Is it not?"
  npc_override_ba_maison_quests_17_2_anyways_apart_terrible_s_b62b95: "anyways, apart from that terrible story... you saved me here..."
  npc_override_ba_maison_quests_17_2_anyways_exploded_while_i_8f1127: "Anyways, it exploded while I was working on it, and the other automatic doll was burned down. Maybe it's that automatic doll."
  npc_override_ba_maison_quests_17_2_anyways_you_thank_you_ge_46029f: "Anyways, you, {0}. Thank you for getting me the antidote."
  npc_override_ba_maison_quests_17_2_appears_collecting_repor_998cb4: "It appears to be collecting reports from the outside..."
  npc_override_ba_maison_quests_17_2_apply_battle_a70149: "Apply for battle."
  npc_override_ba_maison_quests_17_2_area_where_laboratory_se_363499: "This area is where the laboratory sewage is discharged into and it's very dangerous for skin contact or ingestion, which can lead to immediate death, so we recommend for everyone to stay away from it."
  npc_override_ba_maison_quests_17_2_aren_t_you_middle_operat_b66259: "Aren't you in a middle of an operation?"
  npc_override_ba_maison_quests_17_2_aren_t_you_one_who_7112b7: "Aren't you the one who saved us when we thought we're all going to die?"
  npc_override_ba_maison_quests_17_2_argh_my_hand_f82dee: "Argh!!!! My hand!!"
  npc_override_ba_maison_quests_17_2_argh_what_hell_i_almost_a1c99a: "Argh! What the hell is this? I almost died! I can't believe you did it in such a lovely way. You're all wet!"
  npc_override_ba_maison_quests_17_2_around_navi_here_info_ra_8c2f1d: "around <NAVI>[here]<INFO>rachel,182,176,0,101,0</INFO></NAVI> or so."
  npc_override_ba_maison_quests_17_2_as_always_you_did_great_1e13b5: "As always, you did great."
  npc_override_ba_maison_quests_17_2_as_expected_0c29c3: "As expected..."
  npc_override_ba_maison_quests_17_2_as_expected_heart_hunter_7257d8: "As expected of the Heart Hunters..."
  npc_override_ba_maison_quests_17_2_as_expected_someone_whom_4e02ec: "As expected of someone whom I recognize as my rival!"
  npc_override_ba_maison_quests_17_2_as_expected_you_know_som_ed247c: "As expected, you know something!!! It's the great sage Varmundt!!! He's a legend, that no one has ever surpassed him during and after his time."
  npc_override_ba_maison_quests_17_2_as_fast_as_possible_trac_2d53b3: "'As fast as possible (Traces of erased memo) lead them to the mansion'"
  npc_override_ba_maison_quests_17_2_as_guest_requested_i_ll_f521aa: "As the guest requested. I'll deliver random selection of record about mercenaries in the database."
  npc_override_ba_maison_quests_17_2_as_i_mentioned_illusion_a58463: "As I mentioned, the Illusion, ^0000CDMagic Poisoned Sanare^000000, are still installing the jamming chips that I mentioned in the second horsepower plant. If I went in like this, I'll probably end up malfunctioning again."
  npc_override_ba_maison_quests_17_2_as_i_said_before_i_5de6fa: "As I said before, I have a duty to exclude the intruder."
  npc_override_ba_maison_quests_17_2_as_long_as_you_promise_0b8098: "As long as you promise to not disturb or harm other people, we're going to step down at this point. What do you say?"
  npc_override_ba_maison_quests_17_2_as_result_happened_a54160: "...as a result, this happened."
  npc_override_ba_maison_quests_17_2_as_vice_president_i_feel_dbd88a: "As the Vice President, I feel responsible for all of this."
  npc_override_ba_maison_quests_17_2_as_you_already_know_plan_36e484: "As you already know, a plant called Grand Papilla lives in the deepest part of the water garden."
  npc_override_ba_maison_quests_17_2_as_you_already_know_plan_ca1f6a: "As you already know, a plant called Silva Papilla lives in the deepest part of the water garden."
  npc_override_ba_maison_quests_17_2_as_you_know_rekenber_alr_68481d: "As you know, Rekenber has already taken a step forward."
  npc_override_ba_maison_quests_17_2_as_you_like_adventurer_i_a6ed12: "As you like adventurer, I'll wait outside."
  npc_override_ba_maison_quests_17_2_attack_did_i_attack_i_019493: "Attack? Did I attack? I only responded according to the intruder response manual. Oh, did you felt like you were attacked?"
  npc_override_ba_maison_quests_17_2_auditorium_signal_receiv_4f6042: "Auditorium... Signal received..."
  npc_override_ba_maison_quests_17_2_augmenting_bath_house_du_2fe7f7: "Augmenting the bath house due to his interest in various bathing methods, the bath house has expanded to today's size. The guests to the mansion have used the bath house and have praised its facilities."
  npc_override_ba_maison_quests_17_2_automatic_doll_806303: "Is it an automatic doll?"
  npc_override_ba_maison_quests_17_2_automatic_doll_human_42b091: "Is it an automatic doll? or human?"
  npc_override_ba_maison_quests_17_2_automatic_doll_okay_thou_1f9a4c: "The automatic doll is okay though."
  npc_override_ba_maison_quests_17_2_automatic_dolls_cleaning_33da4c: "Automatic dolls for cleaning sweeps foreign substances and dirt all over the place. This basic policy is to send all the guests out of the bathhouse when cleaning, but if the guest want to continue taking a bath, we shouldn't bother them and wait."
  npc_override_ba_maison_quests_17_2_b_24d9d5: "(*'��'*)b"
  npc_override_ba_maison_quests_17_2_bang_c19c59: "Bang!!!"
  npc_override_ba_maison_quests_17_2_barmeal_ticket_you_use_m_a25e21: "This is a ^0000CDBarmeal Ticket^000000, you can use it in the mansion's restaurant."
  npc_override_ba_maison_quests_17_2_based_data_collected_ove_fb7f40: "Based on the data collected overtime, human beings are a species that hurts each other if necessary."
  npc_override_ba_maison_quests_17_2_based_their_behavior_so_638b30: "Based on their behavior so far, they seem to be working in the dark when the sun sets."
  npc_override_ba_maison_quests_17_2_basically_your_life_risk_eed7bc: "Basically, your life is at risk!"
  npc_override_ba_maison_quests_17_2_bathhouse_hygiene_should_d16815: "This is a bathhouse. Hygiene should be the top priority. The cleaner automatic dolls are strengthened because of that."
