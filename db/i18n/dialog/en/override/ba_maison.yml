  npc_override_ba_maison_quests_17_2_i_ll_05a7aa: "I'll do that."
  npc_override_ba_maison_quests_17_2_i_ll_also_take_emergency_0f1042: "I'll also take the emergency key back."
  npc_override_ba_maison_quests_17_2_i_ll_also_take_opportuni_adc0d3: "I'll also take the opportunity to turn them over and join you later."
  npc_override_ba_maison_quests_17_2_i_ll_ask_alpha_clone_8c9ef4: "I'll ask Alpha to clone me. I don't know if it's possible, but logically, it's more efficient if there's two of me."
  npc_override_ba_maison_quests_17_2_i_ll_ask_your_help_6d911c: "I'll ask for your help again next time, if you have the time."
