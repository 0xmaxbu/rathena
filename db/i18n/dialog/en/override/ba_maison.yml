  npc_override_ba_maison_quests_17_2_i_go_pick_up_blueprint_0e66a7: "I have to go pick up the blueprint and ingredients while the broken automatic dolls is organized."
  npc_override_ba_maison_quests_17_2_i_going_treat_fainted_ma_32a773: "I was going to treat the fainted man and let him out nicely, but then you guys just came in and..."
  npc_override_ba_maison_quests_17_2_i_got_18756a: "I got it."
  npc_override_ba_maison_quests_17_2_i_got_already_da9bcd: "I got it already."
  npc_override_ba_maison_quests_17_2_i_guess_everyone_learn_s_5d855d: "I guess everyone learn such cliche lines from somewhere. It's all the same."
  npc_override_ba_maison_quests_17_2_i_guess_you_t_hear_4fafc2: "I guess you can't hear us because you're too absorbed in the new machines and the automatic doll. You're like a kid with a new toy, Ms. Criminal Scientist."
  npc_override_ba_maison_quests_17_2_i_had_figure_out_what_135752: "I had to figure out what was really inside, whether it was the Illusion's weird prank, that's why this time ^0000CDGonie^000000 went in. It's perfect to move quietly by yourself."
  npc_override_ba_maison_quests_17_2_i_haven_t_had_any_6637a5: "I haven't had any guests in the restaurant for a long time. I had no customer when I was cooking. The intruders... when they got here. My eyes change and I took them away. They were not guests."
  npc_override_ba_maison_quests_17_2_i_heard_hawks_wander_aro_e30588: "I heard the hawks wander around the mansion and ruin it."
  npc_override_ba_maison_quests_17_2_i_heard_humans_developed_2d25d4: "I heard that humans have developed senses and emotions. And the thinking ability to put it all together."
  npc_override_ba_maison_quests_17_2_i_heard_noise_here_8a9ada: "I heard a noise from here."
  npc_override_ba_maison_quests_17_2_i_heard_slighly_clearer_0586b9: "- I heard a slighly clearer sound than I heard at the entrance. But I can't go down and check because I have no key. Let's go back and ask. -"
  npc_override_ba_maison_quests_17_2_i_heard_varmundt_s_mansi_494521: "I heard that the Varmundt's mansion was burned down during the uprising of mercenaries... I think it's a lot different from what's written in the books."
  npc_override_ba_maison_quests_17_2_i_help_9d30c9: "Can I help?"
  npc_override_ba_maison_quests_17_2_i_here_since_i_born_3cf50c: "I was here since I was born. The only thing I know is the stories that my master told me."
  npc_override_ba_maison_quests_17_2_i_hope_book_interesting_619f56: "I hope this book is interesting."
  npc_override_ba_maison_quests_17_2_i_hope_s_big_deal_1e2b3d: "I hope it's not a big deal..."
  npc_override_ba_maison_quests_17_2_i_hope_we_solve_problem_c73c45: "I hope we can solve the problem."
  npc_override_ba_maison_quests_17_2_i_hope_you_find_pleasure_3d889d: "I hope you find pleasure on it."
  npc_override_ba_maison_quests_17_2_i_hope_you_re_thinking_d1f8f6: "I hope you're not thinking that we're stuck."
  npc_override_ba_maison_quests_17_2_i_hope_you_safe_comforta_c8f624: "I hope you have safe and comfortable time here."
  npc_override_ba_maison_quests_17_2_i_hope_you_stay_safe_4f35eb: "I hope you stay safe and have a comfortable time."
  npc_override_ba_maison_quests_17_2_i_just_about_check_look_26a5cb: "I was just about to check it, look here, the adventurer here is going with me."
  npc_override_ba_maison_quests_17_2_i_just_happen_nearby_tim_eeacb7: "I just happen to be nearby at the time and somehow pull her out from that predicament."
  npc_override_ba_maison_quests_17_2_i_just_realized_my_way_c3e658: "I just realized, My way of thinking is wrong. This guy called Varmundt isn't he amazing?"
  npc_override_ba_maison_quests_17_2_i_knew_you_d_stand_09acfa: "I knew you'd stand in the way of the future, you're not assertive and knows how to seek help."
