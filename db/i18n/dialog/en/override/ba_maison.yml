  npc_override_ba_maison_quests_17_2_i_know_i_ll_take_b27ef3: "I know!! I'll take a look! At the ceiling! and drains!"
  npc_override_ba_maison_quests_17_2_i_know_s_just_apparition_8a4e5b: "I know, it's just an apparition that's grumbling,"
  npc_override_ba_maison_quests_17_2_i_know_what_you_want_61a315: "I know what you want hear, but I can't simply decide everything here."
  npc_override_ba_maison_quests_17_2_i_know_why_you_re_8638a0: "I know why you're here. But why did you attack people? You could have known that he didn't mean to hurt you."
  npc_override_ba_maison_quests_17_2_i_known_if_i_had_9fedce: "I would have known if I had a doubt and poked more into it."
  npc_override_ba_maison_quests_17_2_i_laughed_so_hard_made_b800ae: "I laughed so hard, that it made my stomach hurt!!!"
