  npc_override_alde_alche_2004_headgears_sombrero_you_ll_look_lik_2f7684: "With this Sombrero, you'll look like you have all kinds of style. Adios, cool guy~"
  npc_override_alde_alche_2004_headgears_some_may_think_grotesque_f0048a: "Some may think it grotesque, but wouldn't you agree that sporting a mushroom, grown from your head, would start an art revolution?"
