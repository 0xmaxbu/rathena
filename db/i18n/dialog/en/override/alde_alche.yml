  npc_override_alde_alche_2004_headgears_so_i_am_trying_research_747cdf: "So I am trying to research a method to reproduce Ruimetto, except in a smaller form for the human body. If I'm successful, it would be a medical miracle!"
  npc_override_alde_alche_2004_headgears_so_i_got_cutesy_present_b2a42f: "So, I got the cutesy present junk down. You know, instead of like, spending money on like a real gift, I make these little hairpin thingees."
  npc_override_alde_alche_2004_headgears_so_i_learned_issue_funti_8a5ddc: "So I learned from an issue of 'Funtime Kid Science' at Juno Library that different colors absorb or reflect sunlight."
  npc_override_alde_alche_2004_headgears_so_i_let_you_experience_c9b3ad: "so that I can let you experience my amazing magic for yourself~!"
  npc_override_alde_alche_2004_headgears_so_i_reading_some_issues_448ce8: "So I was reading some issues of 'Funtime Kid Science' at the Juno Library, and read about animals that take naps under the sun when they feel really hot."
