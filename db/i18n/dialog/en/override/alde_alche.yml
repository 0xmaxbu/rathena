Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_alde_alche_2004_headgears_about_stellar_ee25dd: "About the Stellar..."
  npc_override_alde_alche_2004_headgears_accessories_typically_wo_d1af13: "Accessories typically worn by monsters are now available for adventurers to wear!"
  npc_override_alde_alche_2004_headgears_accessory_you_b21a24: "accessory you are"
  npc_override_alde_alche_2004_headgears_acknowledge_someone_31d1dc: "acknowledge someone"
  npc_override_alde_alche_2004_headgears_acorn_4ef876: "1000 ^ff0000Acorn^000000,"
  npc_override_alde_alche_2004_headgears_actually_belonged_one_ou_a6a769: "It actually belonged to one of our Orc Lords who was defeated by a human. He was so furious about losing that he broke the middle horn and threw it away!"
  npc_override_alde_alche_2004_headgears_adios_amigo_df7518: "^3355FFAdios Amigo^000000"
  npc_override_alde_alche_2004_headgears_after_some_intense_think_9071c5: "After some intense thinking, and reading some 'Funtime Kid Science' magazines in Juno, I realized that the color black absorbs sunlight and heat, and that the color white reflects it."
  npc_override_alde_alche_2004_headgears_after_you_lose_some_weig_0f3785: "- after you lose some weight. -"
  npc_override_alde_alche_2004_headgears_again_human_you_confound_caedb9: "Again, human, you confound me with your stubborness. I see that humans are masochists. Or just like to annoy Orcs by making them count a thousand Jellopies."
  npc_override_alde_alche_2004_headgears_again_tomorrow_797b94: "again tomorrow."
  npc_override_alde_alche_2004_headgears_ah_298394: "Ah...."
  npc_override_alde_alche_2004_headgears_ah_971301: "Ah..."
  npc_override_alde_alche_2004_headgears_ah_band_aid_943c9f: "Ah, a ^3131FFBand Aid^000000!"
  npc_override_alde_alche_2004_headgears_ah_claw_desert_wolf_d8d815: "Ah, a Claw of Desert Wolf~!"
  npc_override_alde_alche_2004_headgears_ah_i_got_ee63d0: "Ah! I got it!"
  npc_override_alde_alche_2004_headgears_ah_i_see_you_brought_180ee7: "Ah! I see you brought everything. Alright! Do you want me to make you a Straw Hat now?"
  npc_override_alde_alche_2004_headgears_ah_i_tell_you_already_a641ef: "Ah, I can tell that you already have a ^8C1717'Model Training Hat'^000000. I see that using it has corrected your posture."
  npc_override_alde_alche_2004_headgears_ah_i_ve_piqued_your_a87cab: "Ah...I've piqued your curiosity I see."
  npc_override_alde_alche_2004_headgears_ah_right_1e4aa7: "Ah... Right."
  npc_override_alde_alche_2004_headgears_ah_s_done_2340a8: "Ah... It's done!"
  npc_override_alde_alche_2004_headgears_ah_spoken_like_true_warr_887880: "Ah, spoken like a true warrior. Alright then, go forth and do battle with others of my tribe, and bring me 10,000 Orcish Vouchers."
  npc_override_alde_alche_2004_headgears_ah_yes_now_here_s_dd914e: "Ah yes. Now here's a classy hat for mariachi heroes and Latin lovers. You can't deny the sex appeal that just pours from someone wearing a Sombrero."
  npc_override_alde_alche_2004_headgears_ah_yes_we_talking_about_de3702: "Ah yes, we were talking about Orc Heroes. Now, unlike Orc Heroes who are blessed with might from the day they were born, there are older, seasoned warriors that have managed to survive many years of combat."
  npc_override_alde_alche_2004_headgears_ah_you_brought_everythin_1e81ee: "Ah! You brought everything already. Alright! How about I make you that Beanie right now?"
  npc_override_alde_alche_2004_headgears_ah_you_brought_everythin_920aa3: "Ah! You brought everything already. Excellent. Do you want me to make a Cowboy Hat now?"
  npc_override_alde_alche_2004_headgears_ah_you_brought_everythin_d0e8b7: "Ah! You brought everything already. Alright! Do you want me to make you a Sombrero right away?"
  npc_override_alde_alche_2004_headgears_aha_ae0e52: "Aha~"
  npc_override_alde_alche_2004_headgears_aha_good_good_good_ce6595: "Aha~ Good good good."
  npc_override_alde_alche_2004_headgears_ahahaha_775053: "Ahahaha~"
  npc_override_alde_alche_2004_headgears_alarm_mask_4b0302: "...this Alarm Mask!"
  npc_override_alde_alche_2004_headgears_alarms_their_ruimento_ma_dc0b94: "The Alarms, and their 'Ruimento,' are made from an ancient mysterious technology. You can only find these in the Clock Tower."
  npc_override_alde_alche_2004_headgears_all_i_need_make_cacb09: "All I need to make this is..."
  npc_override_alde_alche_2004_headgears_all_i_want_bring_her_541183: "All I want is to bring her back to life, no matter what the cost. That's why I'm swallowing my pride and asking you for help."
  npc_override_alde_alche_2004_headgears_all_you_gotta_bring_me_da8bf5: "All you gotta do is bring me the stuff to make it. And if that hairpin's for yourself, well, I'm down with that jive too."
  npc_override_alde_alche_2004_headgears_all_you_humans_so_foolis_36dc9c: "Are all you humans so foolish?!"
  npc_override_alde_alche_2004_headgears_allow_me_introduce_mysel_83f858: "Allow me to introduce myself. My name is Hatbyr Mhore, a travelling Blacksmith."
  npc_override_alde_alche_2004_headgears_alright_6ceaec: "Alright..."
  npc_override_alde_alche_2004_headgears_alright_belongs_orc_lord_ecef77: "Alright, that belongs to the Orc Lord. I mean, even though it's now yours, it was given to you by mistake."
  npc_override_alde_alche_2004_headgears_alright_gimmie_minute_ye_ee3a1f: "Alright, gimmie a minute, yeah?"
  npc_override_alde_alche_2004_headgears_alright_i_m_done_9bbe23: "Alright, I'm done!"
  npc_override_alde_alche_2004_headgears_alright_let_s_get_work_1145e4: "Alright, let's get to work."
  npc_override_alde_alche_2004_headgears_alright_s_time_roll_7a55f6: "Alright, it's time to roll!"
  npc_override_alde_alche_2004_headgears_also_i_disassemble_model_601d82: "Also, I can disassemble the Model Training Hat into its original materials. So if you want the original items back, bring the Model Training Hat and the arrow I gave you."
  npc_override_alde_alche_2004_headgears_also_please_only_one_cor_97cc99: "^FF0000Also, please only have one Coronet in your inventory to make the Crown of Mistress. We are not responsible for any loss."
  npc_override_alde_alche_2004_headgears_although_doesn_t_look_di_13b777: "Although it doesn't look different from the others, please keep this with care. You can only be recognized as an Orc warrior with this."
  npc_override_alde_alche_2004_headgears_although_doesn_t_look_di_3e8a99: "Although it doesn't look different from the others, I hope you will keep it with care. You can only be recognized as an Orc Hero with this token."
  npc_override_alde_alche_2004_headgears_although_e16902: "Although..."
  npc_override_alde_alche_2004_headgears_although_i_don_t_like_31f418: "Although I don't like to admit it, there are cowardly Orcs that run away from battle, or fight using dishonorable methods."
  npc_override_alde_alche_2004_headgears_although_i_really_enjoy_f2c3af: "Although I really enjoy traveling more than staying in my shop, I'm still a Blacksmith at heart and I always gotta be making something. It's been a while since I've made my last creation..."
  npc_override_alde_alche_2004_headgears_although_s_clear_you_ve_7a7faf: "Although it's clear that you've got '^3355FFthe look^000000,' we can't accept any students at the moment."
  npc_override_alde_alche_2004_headgears_although_street_fashion_e109ad: "Although it can be a street fashion, Beanies also look really cute on some people."
  npc_override_alde_alche_2004_headgears_although_we_t_offer_any_4c6f0c: "Although we can't offer any classes at this time, I can create a special 'Model Training Hat' for you. That way, you can practice the glamourous way of walking down the catwalk on your own."
  npc_override_alde_alche_2004_headgears_although_you_may_learnin_5d29ba: "Although you may be learning theory by talking with me, you must experience our way of life for yourself."
  npc_override_alde_alche_2004_headgears_although_you_re_58924e: "Although you're a"
  npc_override_alde_alche_2004_headgears_although_you_re_human_yo_2f1c83: "Although you're a human, you're an Orc Hero amongst us now, so you should have a helm suitable for your position..."
  npc_override_alde_alche_2004_headgears_am_called_zhenbolt_1e6219: "am called ^FF0000Zhenbolt^000000!!"
  npc_override_alde_alche_2004_headgears_am_i_bored_69ea70: "Am I bored~!"
  npc_override_alde_alche_2004_headgears_among_those_well_experie_445dfe: "Among those well-experienced warriors, the greatest one of all is given the title of Orc Lord, and is given our respect as the leader of our tribe."
  npc_override_alde_alche_2004_headgears_angel_wing_6e703e: "1 Angel Wing"
  npc_override_alde_alche_2004_headgears_angel_wing_b22077: "1 Angel Wing,"
  npc_override_alde_alche_2004_headgears_angel_wing_ears_1d9252: "'Angel Wing Ears!'"
  npc_override_alde_alche_2004_headgears_animals_don_t_take_naps_9f5634: "Animals that don't take naps under the sun must never feel hot?"
  npc_override_alde_alche_2004_headgears_anyway_i_ve_got_bone_3d9b48: "Anyway, I've got a bone to pick with you humans. You're an aggressive and greedy race, always killing things and taking stuff. And despite all the hunting, you never seem to be satisfied."
  npc_override_alde_alche_2004_headgears_anyway_now_you_wear_mush_9cb198: "Anyway, now you can wear that mushroom at a rakish angle, the way it's supposed to be worn. Stay cool, you fashion rebel, you."
  npc_override_alde_alche_2004_headgears_anyway_what_i_need_make_ecc181: "Anyway, this is what I need to make a Beanie..."
  npc_override_alde_alche_2004_headgears_anyway_what_i_need_make_f9f3fd: "Anyway, this is what I need to make a Party Hat..."
  npc_override_alde_alche_2004_headgears_anyways_i_need_all_these_5c44f1: "Anyways, I need all these to make you a Straw Hat..."
  npc_override_alde_alche_2004_headgears_apple_archer_686d19: "^0000FF1 Apple of Archer^000000 and"
  npc_override_alde_alche_2004_headgears_argh_648b06: "Argh~!"
  npc_override_alde_alche_2004_headgears_as_being_suave_well_i_03ccff: "As for being suave? Well, I do have this yo-yo..."
  npc_override_alde_alche_2004_headgears_as_i_told_you_i_6b40c4: "As I told you, I will give you this really nifty ^0000FFAlarm Mask^000000 for those items, as well as do any sort of pose for you."
  npc_override_alde_alche_2004_headgears_as_my_mom_taught_me_80c3b5: "As my mom taught me,"
  npc_override_alde_alche_2004_headgears_as_orc_warrior_011006: "As an Orc Warrior,"
  npc_override_alde_alche_2004_headgears_as_proof_their_status_or_5142b4: "As proof of their status, Orc Heroes are given Vouchers of Orcish Hero, as well as special swords that are only allowed to be used by our heroes."
  npc_override_alde_alche_2004_headgears_as_we_all_know_you_fcc4f0: "And, as we all know, you wear no colors if you're invisible, or when you're completely nude. I've already conducted my nudity experiment with sad and pitiable results..."
  npc_override_alde_alche_2004_headgears_as_you_now_one_who_25658e: "As you are now one who feels the true intent of the opponent after endless battles, I will now return you to the battleground."
  npc_override_alde_alche_2004_headgears_attitude_sometimes_880919: "attitude. Sometimes,"
  npc_override_alde_alche_2004_headgears_awww_daa9b8: "Awww..."
  npc_override_alde_alche_2004_headgears_awwww_12081b: "Awwww~"
  npc_override_alde_alche_2004_headgears_bad_572d5a: "not bad..."
  npc_override_alde_alche_2004_headgears_bad_all_0e9921: "Not bad at all."
  npc_override_alde_alche_2004_headgears_bah_humans_built_their_o_29be9b: "Bah! Humans have built their own towns and cities. Do they keep their senseless killing amongst each other?! NO! Humans have to rampage and ravage everything!!"
  npc_override_alde_alche_2004_headgears_band_aid_eh_bef429: "Band Aid, eh?"
  npc_override_alde_alche_2004_headgears_bandana_white_dyestuffs_bcdc37: "1 ^FF0000Bandana^000000 and 1 ^FF0000White Dyestuffs^000000."
  npc_override_alde_alche_2004_headgears_bang_bang_ping_ping_7a4d44: "^3355FF*Bang Bang Ping Ping*^000000"
  npc_override_alde_alche_2004_headgears_battles_032cac: "10,000 battles"
  npc_override_alde_alche_2004_headgears_battles_won_vigor_passio_907b01: "Battles are won with vigor and passion!"
  npc_override_alde_alche_2004_headgears_beanie_2ab53c: "A Beanie...!"
  npc_override_alde_alche_2004_headgears_beanie_871549: "A Beanie!"
  npc_override_alde_alche_2004_headgears_beautiful_227c2e: "Beautiful..."
  npc_override_alde_alche_2004_headgears_beautiful_day_a84f59: "a beautiful day"
  npc_override_alde_alche_2004_headgears_because_0109fe: "Because...!"
  npc_override_alde_alche_2004_headgears_before_i_start_create_it_ff7ba3: "Before I start to create the item, I'm obligated to warn you..."
  npc_override_alde_alche_2004_headgears_behalf_903002: "On behalf of"
  npc_override_alde_alche_2004_headgears_behalf_comodo_indians_i_8ba934: "On behalf of the Comodo Indians, I give reverence to all Indian Tribes!"
  npc_override_alde_alche_2004_headgears_besides_nothing_says_reb_e932b2: "Besides, nothing says 'rebel without a cause' like a mushroom growing out of your head! You would look soooo cool, independent and countercultured!"
  npc_override_alde_alche_2004_headgears_best_way_understanding_o_c5da37: "The best way of understanding the Orc tribe is to do battle with them. By competing in power and skills, eventually you will understand and respect your opponent."
  npc_override_alde_alche_2004_headgears_big_ribbon_0b6c18: "1 ^FF0000Big Ribbon^000000,"
  npc_override_alde_alche_2004_headgears_black_bear_skin_6b41e6: "^0000FF300 Black Bear Skin^000000."
  npc_override_alde_alche_2004_headgears_black_cat_doll_cd533f: "and 300 ^ff0000Black Cat Doll^000000."
  npc_override_alde_alche_2004_headgears_black_cat_ears_d57acc: "Black Cat Ears"
  npc_override_alde_alche_2004_headgears_black_dyestuffs_486219: "1 ^FF0000Black Dyestuffs^000000,"
  npc_override_alde_alche_2004_headgears_black_dyestuffs_974b74: "1 ^ff0000Black Dyestuffs^000000"
  npc_override_alde_alche_2004_headgears_blue_fish_hat_617c99: "a 'Blue Fish' hat?"
  npc_override_alde_alche_2004_headgears_book_5c157b: "^0000FF1 Book^000000."
  npc_override_alde_alche_2004_headgears_boys_aren_t_supposed_mak_382da5: "Boys aren't supposed to make flowers."
  npc_override_alde_alche_2004_headgears_bravery_honor_a95710: "bravery and honor..."
  npc_override_alde_alche_2004_headgears_bring_me_5a6104: "Bring me"
  npc_override_alde_alche_2004_headgears_bring_me_alcohol_416e6e: "Bring me ^FF00001 Alcohol^000000 and"
  npc_override_alde_alche_2004_headgears_bring_me_b31d0b: "Bring me..."
  npc_override_alde_alche_2004_headgears_bring_me_f4de78: "bring me..."
  npc_override_alde_alche_2004_headgears_bring_me_jellopy_dae0df: "bring me ^FF00001000 Jellopy^000000"
  npc_override_alde_alche_2004_headgears_bring_me_those_items_27d12d: "Bring me those items..."
  npc_override_alde_alche_2004_headgears_bringing_everything_8ab54c: "bringing everything."
  npc_override_alde_alche_2004_headgears_burning_heart_dd4cb1: "300 ^FF0000Burning Heart^000000,"
  npc_override_alde_alche_2004_headgears_burning_horseshoe_73869f: "4 ^3355FFBurning Horseshoe^000000."
  npc_override_alde_alche_2004_headgears_but_2e7fce: "But..."
  npc_override_alde_alche_2004_headgears_bwahahahahahha_43cc41: "Bwahahahahahha~!"
  npc_override_alde_alche_2004_headgears_bwahahahahhahahahahahaha_1dfab7: "Bwahahahahhahahahahahaha!"
  npc_override_alde_alche_2004_headgears_cactus_needle_ec729a: "50 ^3355FFCactus Needle^000000 and"
  npc_override_alde_alche_2004_headgears_cap_90091c: "1 ^3355FFCap^000000 and"
  npc_override_alde_alche_2004_headgears_certain_opponents_f13992: "certain opponents."
  npc_override_alde_alche_2004_headgears_chikachikachoom_729d0b: "*Chikachikachoom*"
  npc_override_alde_alche_2004_headgears_chomp_chomp_082976: "*Chomp chomp...*"
  npc_override_alde_alche_2004_headgears_clang_clang_scrape_scrap_2b23e8: "^3355FF* Clang Clang! Scrape Scrape! Jingle Jingle! *^000000"
  npc_override_alde_alche_2004_headgears_claw_desert_wolf_6b7c39: "108 ^3355FFClaw of Desert Wolf^000000,"
  npc_override_alde_alche_2004_headgears_clik_clak_clik_clak_pam_874e5e: "^3355FF*Clik-clak Clik-clak Pam Pam Pam Pam*^000000"
  npc_override_alde_alche_2004_headgears_cling_dee835: "......*Cling*"
  npc_override_alde_alche_2004_headgears_cling_f6e99b: ".......*Cling*"
  npc_override_alde_alche_2004_headgears_clock_hand_9868ac: "^0000FF3000 Clock Hand^000000 and"
  npc_override_alde_alche_2004_headgears_come_af9fd7: "Come on!"
  npc_override_alde_alche_2004_headgears_come_back_anytime_when_y_9f1539: "Come back anytime when you have those materials."
  npc_override_alde_alche_2004_headgears_come_back_anytime_you_wa_a43c1d: "Come back anytime you want."
  npc_override_alde_alche_2004_headgears_come_back_as_70cd4f: "Come back as"
  npc_override_alde_alche_2004_headgears_come_back_soon_adventure_b3e457: "Come back soon, adventurer!"
  npc_override_alde_alche_2004_headgears_come_take_rest_here_90b280: "Come take a rest here."
  npc_override_alde_alche_2004_headgears_compliment_anyone_2c21d0: "compliment anyone"
  npc_override_alde_alche_2004_headgears_considering_stories_abou_ceee3e: "Considering the stories about my tribe, it's enough for me if you just listen. However, merely listening is totally different from having the experience as your own."
  npc_override_alde_alche_2004_headgears_continue_use_hat_c25df7: "continue to use that hat"
  npc_override_alde_alche_2004_headgears_continue_your_efforts_ac3a03: "continue your efforts"
  npc_override_alde_alche_2004_headgears_cool_0336bf: "Cool~!"
  npc_override_alde_alche_2004_headgears_cool_come_back_soon_as_9f2dec: "Cool~! Come back soon as you can~!"
  npc_override_alde_alche_2004_headgears_coronet_emperium_gold_2cfad1: "^3355FF1 Coronet, 1 Emperium, 3 Gold^000000 and"
  npc_override_alde_alche_2004_headgears_coronet_making_item_471b9e: "Coronet for making this item,"
  npc_override_alde_alche_2004_headgears_course_i_make_item_4a2b83: "Of course, I can make an item"
  npc_override_alde_alche_2004_headgears_course_since_we_re_trial_b9ecd7: "Of course, since we're on a trial period, we can only provide 3 monster accessories to our fans. However, according to your response, we may add more monster accessories in the future."
  npc_override_alde_alche_2004_headgears_cowboy_hat_very_popular_1f63fc: "A Cowboy Hat! This is a very popular that brings up images of frontier life and gunplay."
  npc_override_alde_alche_2004_headgears_creating_angel_wing_ears_57f030: "For creating Angel Wing Ears, I need 1 ^4d4dffAngel Wing^000000,"
  npc_override_alde_alche_2004_headgears_creating_devil_wing_ears_55da08: "For creating Devil Wing Ears,"
  npc_override_alde_alche_2004_headgears_crown_imitation_one_worn_b84865: "This crown is an imitation of the one worn by the 'Mistress' monster. Wearing this will give you a look of brusque authority."
  npc_override_alde_alche_2004_headgears_crown_inspired_one_worn_92e254: "This crown is inspired by the one worn by the 'Isis' monster. It has an elegant look fitting for ancient royalty."
  npc_override_alde_alche_2004_headgears_crunch_chew_chew_chew_545272: "^3355FF*Crunch Chew Chew Chew*^000000"
  npc_override_alde_alche_2004_headgears_crunch_crunch_tap_tap_5ffb95: "^3355FF*Crunch Crunch Tap Tap*^000000"
  npc_override_alde_alche_2004_headgears_currently_you_carrying_c90181: "- Currently you are carrying -"
  npc_override_alde_alche_2004_headgears_currently_you_re_carryin_73594b: "- Currently you're carrying -"
  npc_override_alde_alche_2004_headgears_currently_you_re_over_we_290edc: "- Currently you're over weight -"
  npc_override_alde_alche_2004_headgears_curse_placed_those_disho_20e359: "A curse is placed on those dishonorable Orcs so that they can be singled out by the tribe and banished from the village."
  npc_override_alde_alche_2004_headgears_curse_you_human_788d4e: "Curse you, human."
  npc_override_alde_alche_2004_headgears_damn_130b0e: "Damn...!"
  npc_override_alde_alche_2004_headgears_decided_if_you_bring_me_dce39c: "It is decided! If you bring me the following items, I will give you the famous symbol of battle by which villains fear Zhenbolt."
  npc_override_alde_alche_2004_headgears_demonstrated_incredible_24abaf: "demonstrated incredible"
  npc_override_alde_alche_2004_headgears_devil_wing_a3c843: "1 Devil Wing"
  npc_override_alde_alche_2004_headgears_did_you_already_forget_10b1e3: "Did you already forget?!"
  npc_override_alde_alche_2004_headgears_did_you_already_forget_a35331: "Did you already forget?"
  npc_override_alde_alche_2004_headgears_did_you_already_forget_b7ebed: "Did you already forget!?"
  npc_override_alde_alche_2004_headgears_difference_between_you_h_f8672d: "The difference between you humans and us is that we would never tolerate foul play in battle. But more importantly, Orcs never, ever retreat. An Orc will always fight till the last breath..."
  npc_override_alde_alche_2004_headgears_ding_ding_ding_dan_dan_73b234: "^3355FFDing Ding Ding Dan Dan Dan^000000"
  npc_override_alde_alche_2004_headgears_doesn_t_seem_you_ve_0315b7: "It doesn't seem that you've accomplished your goal yet, but I do not expect you to defeat 10,000 Orc Warriors so easily."
  npc_override_alde_alche_2004_headgears_don_t_forget_bring_me_c28c48: "Don't forget to bring me more Mr.Screams and clock hands if you find more of them!"
  npc_override_alde_alche_2004_headgears_don_t_give_up_005469: "Don't give up."
