  npc_override_alde_alche_2004_headgears_how_sound_6ebf32: "How does that sound?"
  npc_override_alde_alche_2004_headgears_however_i_need_help_comp_11d18a: "However, I need help in completing my research. Hence, the reason I've told you my story, adventurer."
  npc_override_alde_alche_2004_headgears_however_you_made_decisio_ec5d36: "However, you made the decision to go through with this test! Still, there's no need to rush it. Life is an endless series of battles, so the combat will come."
  npc_override_alde_alche_2004_headgears_huh_what_s_think_about_c1c709: "Huh. What's to think about?! I was gonna use all of my skill to create something special for you. Ah well..."
  npc_override_alde_alche_2004_headgears_human_accomplishing_such_293dfd: "For a human, accomplishing such a feat is truly astonishing. Through all of that fighting, I'm sure that you have learned both good and bad things about my tribe."
  npc_override_alde_alche_2004_headgears_human_i_like_you_90b1dc: "human, I like you."
  npc_override_alde_alche_2004_headgears_human_what_you_doing_my_4a4471: "Human, what are you doing in my home?!"
  npc_override_alde_alche_2004_headgears_human_who_better_underst_db765a: "A human who has a better understanding than other humans. One who showed others power regardless of the race, I leave you to the future of Chaos."
  npc_override_alde_alche_2004_headgears_human_you_e8ee8a: "human, you have"
  npc_override_alde_alche_2004_headgears_humans_always_invading_o_362d72: "Humans are always invading our village, intruding on our land! They kill our warriors not out of honor, but for selfish human reasons!!"
  npc_override_alde_alche_2004_headgears_humans_may_built_cities_c41ddd: "Humans may have built cities and towns, but we Orcs have also created our own cave complexes and canals!"
  npc_override_alde_alche_2004_headgears_humans_such_annoying_bas_5c1faf: "Humans... such annoying bastards!"
  npc_override_alde_alche_2004_headgears_hungry_blood_9c8f74: "hungry for blood...?"
  npc_override_alde_alche_2004_headgears_hunting_parties_21da2d: "And hunting parties?"
  npc_override_alde_alche_2004_headgears_hurrumph_db429a: "Hurrumph."
  npc_override_alde_alche_2004_headgears_i_am_proud_say_my_045603: "I am proud to say this is my masterpiece. Please take this item. I call it... 'Devil Wing Ears!'"
  npc_override_alde_alche_2004_headgears_i_am_proud_say_my_734b23: "I am proud to say this is my masterpiece. Please take this item. I call it..."
  npc_override_alde_alche_2004_headgears_i_am_proud_say_my_99be47: "I am proud to say this is my masterpiece. Please take this item. I call it... 'Angel Wing Ears!'"
  npc_override_alde_alche_2004_headgears_i_collect_these_things_m_d8dd59: "I would collect these things myself but everytime I go up to the Clock Tower, I can't bear to break the Alarms, and just stare in awe at their mechanical, masculine physiques."
  npc_override_alde_alche_2004_headgears_i_cut_mr_smile_way_5d3968: "I cut Mr. Smile this way~."
  npc_override_alde_alche_2004_headgears_i_d9b4ac: "I..."
  npc_override_alde_alche_2004_headgears_i_d_wear_myself_if_f6d74b: "I'd wear it myself, if it weren't for the fact that people never look at my face anyway. Everyone I meet seems to be fixated on my chiseled form. But trust me, this mask is pretty cool."
  npc_override_alde_alche_2004_headgears_i_decided_make_hat_one_94da33: "I decided to make a hat of that one perfect beast that was immune to the sun, never having to succumb its power."
  npc_override_alde_alche_2004_headgears_i_desperately_need_mater_a8046f: "I desperately need materials to continuing testing so that I can develop a prototype. I'll need ^0000FFClock Hand^000000 from Alarms and ^0000FFMr. Scream^000000 in order to continue my research."
  npc_override_alde_alche_2004_headgears_i_did_good_job_didn_417b67: "I did a good job, didn't I?"
  npc_override_alde_alche_2004_headgears_i_don_t_anything_make_8f8f8d: "But I don't have anything to make paper flowers out of."
  npc_override_alde_alche_2004_headgears_i_don_t_care_how_0374d3: "I don't care how many times you've upgraded the items you brought, but please ^4d4dff carry only items that you need to create this item.^000000 I can't mess up my artwork because of some mistake you might make."
  npc_override_alde_alche_2004_headgears_i_don_t_know_if_673753: "I don't know if everyone will obey your commands while wearing this, but at least you can feel beautifully regal."
  npc_override_alde_alche_2004_headgears_i_don_t_like_way_f0f2b9: "I don't like the way it's tilting. It should have grown in the ^FF3333other^000000 direction."
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_401fe4: "I don't take 9,000 jellopies you have given to me seriously."
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_496d6f: "I don't take the 3,000 jellopies you have given to me seriously."
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_77f5ba: "I don't take the 4,000 jellopies you have given to me seriously."
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_7c9ccf: "I don't take the 5,000 jellopies you have given to me seriously."
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_80544f: "I don't take the 7,000 jellopies you have given to me seriously."
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_a7519b: "I don't take the 8,000 jellopies you have given to me seriously."
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_efc5bc: "I don't take the 2,000 jellopies you have given to me seriously!!"
  npc_override_alde_alche_2004_headgears_i_don_t_take_jellopies_f1ad98: "I don't take the 6,000 jellopies you have given to me that seriously."
  npc_override_alde_alche_2004_headgears_i_don_t_think_there_a36974: "I don't think there is a curse which transforms humans into a totally ugly creature depending on their deeds. So it is difficult to tell which humans are honorable..."
  npc_override_alde_alche_2004_headgears_i_don_t_understand_why_3190e0: "I don't understand why I am sharing this story about my tribe."
  npc_override_alde_alche_2004_headgears_i_expect_great_things_yo_d7cc60: "I expect great things of you!"
  npc_override_alde_alche_2004_headgears_i_expected_you_quit_now_e03598: "I expected you to quit by now. But I was wrong, because you're here once again. We made a deal and I will keep my promise."
  npc_override_alde_alche_2004_headgears_i_forget_how_breathtakin_c5e769: "I forget how breathtaking the sheer majesty of my body can be. It's alright, take your time, savor the visual pleasure..."
  npc_override_alde_alche_2004_headgears_i_forgot_tell_you_i_5a6ce7: "I forgot to tell you that I can not only put together a 'Model Training Hat,' I can disassemble it into its original parts."
  npc_override_alde_alche_2004_headgears_i_give_you_kitsune_mask_6b2e76: "I will give you this ^0000FFKitsune Mask^000000 if you bring me what I asked. How does that sound? Remember, ^0000FF999 ^FF0000Nine Tail^000000."
  npc_override_alde_alche_2004_headgears_i_guess_8d1d83: "I guess..."
  npc_override_alde_alche_2004_headgears_i_guess_being_life_party_0cb27b: "I guess being the life of the party is a bit too much for you, eh? Hmpf. Well, I know a good library in Juno where you can hang out..."
  npc_override_alde_alche_2004_headgears_i_guess_i_must_pumped_d073d8: "I guess I must have pumped one of these glorious biceps on accident."
  npc_override_alde_alche_2004_headgears_i_guess_i_need_practice_6ca775: "I guess... I need to practice transformation more often. *Sigh*"
  npc_override_alde_alche_2004_headgears_i_guess_we_should_make_889d01: "I guess we should make that mushroom into a headband so that you can adjust it to your style."
  npc_override_alde_alche_2004_headgears_i_guess_you_decided_come_418230: "I guess you decided to come inside, thinking no one was around, to rest after killing others of my kind."
  npc_override_alde_alche_2004_headgears_i_guess_you_don_t_17e53a: "I guess you don't know what's so special about this particular helm..."
  npc_override_alde_alche_2004_headgears_i_guess_you_just_don_5b6194: "I guess you just don't appreciate the value of cowboy heroes, do you?"
  npc_override_alde_alche_2004_headgears_i_happened_come_juno_whi_372a9d: "I happened to come to Juno while I was traveling around the world. Being someplace up in the clouds makes me a little nervous, but still, the scenery looks great from up here."
  npc_override_alde_alche_2004_headgears_i_hate_humans_fact_all_8f5acb: "I hate humans! In fact, all Orcs hate humans! Hate you hate you hate you with a passion!"
  npc_override_alde_alche_2004_headgears_i_haven_t_been_able_7b6d20: "I haven't been able to try it yet, because Smokies are pretty heavy and I've got to build up my neck muscles before I can strap a Smokie to my head."
  npc_override_alde_alche_2004_headgears_i_haven_t_gotten_work_7a534b: "I haven't gotten it to work the way I want to yet. But it's a big leaf! It'll offer some shade."
  npc_override_alde_alche_2004_headgears_i_hope_you_8b614a: "I hope you will"
  npc_override_alde_alche_2004_headgears_i_hope_you_a682cd: "I hope you"
  npc_override_alde_alche_2004_headgears_i_hope_you_know_meaning_3ce1cd: "I hope you know the meaning of returning my Emblem. I expect that we will meet again on the battlefield."
  npc_override_alde_alche_2004_headgears_i_hope_you_re_having_852881: "I hope you're having a good time here in Morocc. If you ever question the special abilities of animals, just think of the majestic Desert Wolf that's able to thrive in the harsh Morocc deserts."
  npc_override_alde_alche_2004_headgears_i_just_wanted_show_you_3fc19d: "But I just wanted to show you how good I am..."
  npc_override_alde_alche_2004_headgears_i_knew_you_succeed_c4ff38: "I knew you would succeed!"
  npc_override_alde_alche_2004_headgears_i_know_how_you_humans_d284a8: "I know how you humans think..."
  npc_override_alde_alche_2004_headgears_i_know_i_know_a62142: "I know, I know..."
  npc_override_alde_alche_2004_headgears_i_know_i_know_having_201d5b: "I know, I know, having a Racoon on your head sounds ridiculous, but it makes a certain sort of sense if you'll just hear me out."
  npc_override_alde_alche_2004_headgears_i_know_i_know_wearing_199666: "I know, I know, wearing a big ol' Leaf on top of your head sounds impractical. But, it makes a certain sort of sense if you'll just hear me out."
  npc_override_alde_alche_2004_headgears_i_know_putting_fish_top_271930: "I know putting a Fish on top of your head doesn't sound like the best idea, but it makes a certain sort of sense if you'll just hear me out."
  npc_override_alde_alche_2004_headgears_i_know_you_brought_every_7e47e4: "I know you brought everything you need for me to make you a hat, but you're carrying too much stuff. Why don't you put some of your things in Kafra Storage?"
  npc_override_alde_alche_2004_headgears_i_know_you_d34b05: "Do I know you?..."
  npc_override_alde_alche_2004_headgears_i_let_you_either_eleganc_0fe956: "I will let you have either the elegance of an angel or the charisma of a demon with the wearables only I can craft."
  npc_override_alde_alche_2004_headgears_i_like_folding_paper_mak_dc3bb3: "I like folding paper and making origami. I made my mommy a big paper boat, and she gave me a big smile and patted my head!"
  npc_override_alde_alche_2004_headgears_i_like_joke_you_played_39a828: "I do not like this joke you have played on me human. Still, I refuse to believe that you have really brought ^FF00001000 Jellopy^000000."
  npc_override_alde_alche_2004_headgears_i_like_you_b41823: "I like you,"
  npc_override_alde_alche_2004_headgears_i_live_here_i_should_0e4b17: "I live here, I should know. Still, nothing can beat the Morocc sunset."
  npc_override_alde_alche_2004_headgears_i_ll_come_back_later_d7a0da: "I'll come back later, kid."
  npc_override_alde_alche_2004_headgears_i_ll_just_here_enjoying_62fd99: "I'll just be here enjoying the view."
  npc_override_alde_alche_2004_headgears_i_ll_need_f4f8ab: "I'll need..."
  npc_override_alde_alche_2004_headgears_i_ll_right_here_when_0e58cc: "I'll be right here when you decide that you want the perfect hat for laid back, kick back moods. Be cool~"
  npc_override_alde_alche_2004_headgears_i_ll_right_here_when_df04ca: "I'll be right here when you decide to crank your life up a notch with a Party Hat."
  npc_override_alde_alche_2004_headgears_i_m_always_here_scenic_984b3d: "I'm always here at this scenic spot so I can enjoy the view. Just come back whenever you feel like it."
  npc_override_alde_alche_2004_headgears_i_m_da_house_b937fc: "I'm in da house!"
  npc_override_alde_alche_2004_headgears_i_m_done_8884e6: "I'm done!"
  npc_override_alde_alche_2004_headgears_i_m_down_2d94f1: "I'm down with that."
  npc_override_alde_alche_2004_headgears_i_m_finished_6c49fc: "I'm finished!"
  npc_override_alde_alche_2004_headgears_i_m_gonna_make_one_1eb3c7: "I'm gonna make one for my little sister~! And everybody I love!"
  npc_override_alde_alche_2004_headgears_i_m_good_boy_14666f: "I'm a good boy!"
  npc_override_alde_alche_2004_headgears_i_m_little_disappointed_f7be2f: "I'm a little disappointed, but you probably already have a nice hat to keep the sun out of your eyes. Well, if you change your mind, I'll be here."
  npc_override_alde_alche_2004_headgears_i_m_mad_hatter_well_49722d: "I'm the 'Mad Hatter.' Well, at least that's what I call myself."
  npc_override_alde_alche_2004_headgears_i_m_master_creating_stuf_cfbefd: "I'm a master of creating stuffed animals, which make great presents. As we all know, everyone loves to hug cute and cuddly stuffed animals."
  npc_override_alde_alche_2004_headgears_i_m_sorry_buddy_i_2e7df3: "I'm sorry buddy, but I can't make this item without having the things I need. Remember, I need 1 Devil Wing, 1 Elven Ears and 20,000 zeny."
  npc_override_alde_alche_2004_headgears_i_m_sorry_buddy_i_53ac24: "I'm sorry buddy, but I can't make this item without the stuff I need. Remember I need 1 Devil Wing, 1 Elven Ears and 20,000 zeny."
  npc_override_alde_alche_2004_headgears_i_m_sorry_buddy_i_63ae27: "I'm sorry buddy, but I can't make this item without having the things I need. Remember, I need 1 Angel Wing, 1 Elven Ears and 20,000 zeny."
  npc_override_alde_alche_2004_headgears_i_m_too_tired_kill_160acb: "I'm too tired to kill you today, but keep silent! If you're wounded, you can bleed quietly on the floor and die with some honor I suppose."
  npc_override_alde_alche_2004_headgears_i_made_hat_all_my_e811c4: "I made this hat with all my heart, so you gotta promise me you will take care of this, okay?"
  npc_override_alde_alche_2004_headgears_i_make_drooping_cat_righ_432653: "I will make a Drooping Cat right away when you bring all of those items."
  npc_override_alde_alche_2004_headgears_i_must_say_very_cheap_1bc09f: "I must say this is a very cheap price considering the item I will make for you. But before I start, I should tell you..."
  npc_override_alde_alche_2004_headgears_i_must_say_very_cheap_216ad6: "I must say this is a very cheap price to pay for such a great item. But before I start, I should tell you..."
  npc_override_alde_alche_2004_headgears_i_need_8e627a: "I need..."
  npc_override_alde_alche_2004_headgears_i_need_devil_wing_635641: "I need 1 ^4d4dffDevil Wing^000000,"
  npc_override_alde_alche_2004_headgears_i_need_raccoon_hat_smoki_a84530: "I need ^0000FF1 Raccoon Hat^000000 and ^0000FF1 Smokie Leaf^000000 so I can make a ^4D4DFFSea-Otter Hat^000000 for you."
  npc_override_alde_alche_2004_headgears_i_need_stellar_ddd192: "I need ^FF00001 Stellar^000000"
  npc_override_alde_alche_2004_headgears_i_need_these_items_make_49d513: "I need these items to make a Cowboy Hat..."
  npc_override_alde_alche_2004_headgears_i_neeeeed_ce6b5d: "I neeeeed..."
  npc_override_alde_alche_2004_headgears_i_now_give_you_7ad03e: "I will now give you"
  npc_override_alde_alche_2004_headgears_i_put_together_raccoon_h_e20fc6: "I have to put together ^0000FF1 Raccoon Hat^000000 and ^0000FF1 Smokie Leaf^000000 to make a ^4D4DFFSea-Otter Hat^000000 for you, though."
  npc_override_alde_alche_2004_headgears_i_really_disappointed_yo_ac17bd: "I will be really disappointed in you if you quit in a challenge you have undertaken."
  npc_override_alde_alche_2004_headgears_i_refuse_c18d8d: "I refuse to"
  npc_override_alde_alche_2004_headgears_i_refuse_speak_you_until_4eadd2: "I refuse to speak to you until I've finished counting all of this Jellopy."
  npc_override_alde_alche_2004_headgears_i_see_as_you_wish_03b2c8: "I see, do as you wish."
  npc_override_alde_alche_2004_headgears_i_see_c52c6e: "I see."
  npc_override_alde_alche_2004_headgears_i_see_df1185: "I see~"
  npc_override_alde_alche_2004_headgears_i_see_i_force_you_b4092d: "I see. I will not force you to choose what I wish to see you do. I respect your decision."
  npc_override_alde_alche_2004_headgears_i_see_jellopy_your_hands_41e4d5: "I can see the Jellopy in your hands, and I'm pretty sure you've brought a thousand again, so let's get this over with."
  npc_override_alde_alche_2004_headgears_i_see_you_must_brought_ac405c: "I see. You must have brought items with cards or upgrades that you didn't want to lose. Feel free to come back anytime when you are ready."
  npc_override_alde_alche_2004_headgears_i_see_your_eyes_you_61eb5f: "I see in your eyes that you have seen many a skirmish. To have survived this long, you must know the secret to victory..."
  npc_override_alde_alche_2004_headgears_i_see_your_eyes_you_956883: "I see in your eyes that you also fight with a heart of purity, a heart of passion!"
  npc_override_alde_alche_2004_headgears_i_sense_you_adventurer_g_9c1314: "I sense that you are an adventurer with a good heart, and that a sweet girl like you deserves a nice gift."
  npc_override_alde_alche_2004_headgears_i_sense_you_adventurer_p_e79ebc: "But I sense that you are an adventurer with a pure heart and would not use the Teddybear Hat for selfish gain."
  npc_override_alde_alche_2004_headgears_i_set_work_immediately_l_7f37d0: "I set to work immediately, listing all the animals I know that don't take naps in the sun. Then, I removed any animals from the list that I didn't like, especially the ones with really long names."
  npc_override_alde_alche_2004_headgears_i_shall_grant_you_true_accad2: "I shall grant you true"
  npc_override_alde_alche_2004_headgears_i_suggest_you_you_experi_ec085a: "I suggest you that you experience more battles with the many different Orcs out there. That's the best way of understanding and learning about the Orc tribe."
  npc_override_alde_alche_2004_headgears_i_take_western_grace_add_00b518: "I take a Western Grace, add some manliness, um, do some finangling, and Voila~! A Cowboy Hat!"
  npc_override_alde_alche_2004_headgears_i_think_you_endure_much_80a56d: "I do not think that you can endure much more of this torture."
  npc_override_alde_alche_2004_headgears_i_think_you_need_hat_95f0a7: "I think you need this hat more than I thought. You have got to learn to just chill and relax~!"
  npc_override_alde_alche_2004_headgears_i_thinking_eac452: "I was thinking..."
  npc_override_alde_alche_2004_headgears_i_told_somehow_ended_han_d079f7: "I was told that it somehow ended in the hands of a human, but I didn't know it was you, the human Orc Hero."
  npc_override_alde_alche_2004_headgears_i_took_orcish_voucher_yo_51493d: "I took 100 Orcish Voucher from you now. Now, fight and fight until you have defeated 10,000 more Orc Warriors so that the whole tribe will have to recognize you!"
  npc_override_alde_alche_2004_headgears_i_understand_40038e: "I understand."
  npc_override_alde_alche_2004_headgears_i_using_items_you_ve_511871: "I will be using the items you've given me so I can continue my work in spreading Indian Headbands, and paying homage to the tribes of Midgard."
  npc_override_alde_alche_2004_headgears_i_ve_created_magic_spell_a1adeb: "I've created a magic spell that can make mushrooms grow anywhere! Anyplace you can imagine, I can make a mushroom grow there."
  npc_override_alde_alche_2004_headgears_i_ve_ever_met_de2b28: "I've ever met."
  npc_override_alde_alche_2004_headgears_i_ve_talked_too_much_30a9b3: "...I've talked too much already."
  npc_override_alde_alche_2004_headgears_i_wished_other_orcs_see_5a31c3: "I wished for other Orcs to see and understand that not all humans are wicked and selfish."
  npc_override_alde_alche_2004_headgears_i_you_want_efaba2: "I can do it you want!"
  npc_override_alde_alche_2004_headgears_i_zhenbolt_dc7b8e: "It is I, Zhenbolt."
  npc_override_alde_alche_2004_headgears_if_any_chance_you_angel_04617b: "If by any chance, you have an Angel Wing or Evil Wing, and"
  npc_override_alde_alche_2004_headgears_if_book_apple_archer_ite_77ad91: "If the ^FF0000'Book' and 'Apple of Archer' items you have brought to make a 'Model Training Hat' was ^FF0000upgraded^000000, after I create the hat out of the book, ^FF0000these upgrades, including compounded cards, will be lost.^000000"
  npc_override_alde_alche_2004_headgears_if_cap_you_use_make_5b83c9: "If the Cap you use to make this Beanie was upgraded, any cards or upgrades will be lost once I make this hat!"
  npc_override_alde_alche_2004_headgears_if_everyone_lutie_wearin_d0734e: "If everyone in Lutie was wearing a fuzzy Sea-Otter cap, it would look so so cute!"
  npc_override_alde_alche_2004_headgears_if_i_had_some_materials_f3e9dc: "If I had some materials, I think I could put together some pretty amazing stuff."
  npc_override_alde_alche_2004_headgears_if_i_only_knew_more_d12580: "If I only knew more tricks with this yo-yo. Then I could really impress the ladies."
  npc_override_alde_alche_2004_headgears_if_i_somehow_connected_s_d5aa6d: "If I somehow connected a Smokie to me, would I become invisible when he becomes invisible?"
  npc_override_alde_alche_2004_headgears_if_sakkat_you_use_create_c0fd0f: "If the Sakkat you use to create this hat was upgraded, any cards, slots or upgrades will disappear once I make a new hat out of it."
  npc_override_alde_alche_2004_headgears_if_santa_hat_you_use_6fcecf: "If the Santa Hat you use to create this hat was upgraded or compounded with a card, all those upgrades will be lost. So, to be safe, I suggest you put everything in your inventory, other than the things to make the Party Hat, into Kafra Storage."
  npc_override_alde_alche_2004_headgears_if_straw_hat_you_use_e0bd41: "If the Straw Hat you use to creating this hat was upgraded, any cards or upgrades in this hat will be lost once I make the Sombrero."
  npc_override_alde_alche_2004_headgears_if_western_grace_you_use_0f1703: "If the Western Grace you use to create this hat was upgraded, any cards or upgrades will be lost once I make a new hat out of it."
  npc_override_alde_alche_2004_headgears_if_you_bring_me_any_666061: "^FF0000If you bring me any upgraded items, or items compounded with cards, those cards and upgrades will be lost once I create the new item for you. So please don't forget that!^000000"
  npc_override_alde_alche_2004_headgears_if_you_d_like_me_34bf7a: "If you'd like me to make another one, please come again. Thank you for visiting the Monster Museum."
  npc_override_alde_alche_2004_headgears_if_you_d_like_me_5c2e47: "If you'd like me to make you another one, please come again. Thank you for visiting the Monster Museum."
  npc_override_alde_alche_2004_headgears_if_you_give_me_any_e87cea: "If you give me any equipment compounded with cards or with upgrades, ^ff0000any upgraded abilities and cards in those items will be lost after I make something out of them.^000000 So, please keep that in mind."
  npc_override_alde_alche_2004_headgears_if_you_give_me_model_c92520: "If you give me ^0000FF1 'Model Training Hat'^000000 and ^0000FF1 'Arrow'^000000, I give you ^8C17171 'Apple of Archer'^000000 and ^8C17171 'Book'^000000. So, would you like to disassemble the items?"
  npc_override_alde_alche_2004_headgears_if_you_give_me_some_1ca181: "If you give me some stuff, I can renovate some of your old hats so that they really show your personality. Whether you're laid back or a party animal, I'll be able to make a hat just for you!"
  npc_override_alde_alche_2004_headgears_if_you_help_me_out_4173d6: "If you help me out, I promise to give you, um..."
  npc_override_alde_alche_2004_headgears_if_you_use_upgraded_stel_94a620: "^CE3100If you use an upgraded Stellar to make this item, any upgrades will be lost. That okay with you?^000000"
  npc_override_alde_alche_2004_headgears_if_you_ve_spent_enough_d78dbb: "If you've spent enough time in the Morocc desert, I'm sure you also appreciate the value of a high quality hat to beat the heat."
  npc_override_alde_alche_2004_headgears_if_you_want_7673bb: "If you want"
  npc_override_alde_alche_2004_headgears_if_you_want_956a41: "If you want to"
  npc_override_alde_alche_2004_headgears_if_you_want_fight_go_fd00eb: "If you want to fight, go outside!"
  npc_override_alde_alche_2004_headgears_if_you_want_i_make_93b19d: "If you want, I can make one for you too for a small price."
  npc_override_alde_alche_2004_headgears_if_you_want_make_6a8a88: "If you want to make a"
  npc_override_alde_alche_2004_headgears_if_you_want_see_me_a2bd8f: "If you want to see me make another one, just bring more Scarlet Dyestuffs and Mr.Smile, okay? Bye bye~!"
  npc_override_alde_alche_2004_headgears_if_you_want_some_kinda_8a62aa: "If you want some kinda hairpin, just come back. I'll just be here, looking ^FF3333suaaave^000000 with this yo-yo."
  npc_override_alde_alche_2004_headgears_if_you_want_talk_d95e37: "if you want to talk."
  npc_override_alde_alche_2004_headgears_if_you_wish_challenge_me_110ec5: "If you wish to challenge me, wait inside the forest at the west. I'm not in the mood to deal with humans right now."
  npc_override_alde_alche_2004_headgears_if_you_wish_you_may_c74edc: "If you wish, you may rest here. {0} victories over Orc Warriors are recognized by our tribe."
  npc_override_alde_alche_2004_headgears_iiiyiyiyiyiyiyiiiiii_09f78e: "iiiyiyiyiyiyiyiiiiii~~!"
  npc_override_alde_alche_2004_headgears_impress_ladies_7e864c: "Impress the ladies...?"
  npc_override_alde_alche_2004_headgears_improve_your_posture_4f79db: "to improve your posture"
  npc_override_alde_alche_2004_headgears_indian_fillet_de546c: "1 ^FF0000Indian Fillet^000000,"
  npc_override_alde_alche_2004_headgears_indian_spirit_forever_d7f7f2: "Indian spirit, forever~!"
  npc_override_alde_alche_2004_headgears_insanely_hot_0eb43c: "But insanely hot."
  npc_override_alde_alche_2004_headgears_interested_50d9bf: "interested in."
  npc_override_alde_alche_2004_headgears_interesting_3c01f4: "interesting."
  npc_override_alde_alche_2004_headgears_interesting_3fdcc9: "Interesting!"
  npc_override_alde_alche_2004_headgears_ipore_pours_mushroom_spo_af793b: "Ipore pours the Mushroom Spores onto your head.^000000"
  npc_override_alde_alche_2004_headgears_isn_t_orc_warrior_s_d32f21: "Isn't that an Orc Warrior's Helm...?"
  npc_override_alde_alche_2004_headgears_isn_t_such_2c4b64: "Isn't it such"
  npc_override_alde_alche_2004_headgears_it_454889: "It..."
  npc_override_alde_alche_2004_headgears_item_you_create_out_coro_59478b: "the item you create out of the Coronet"
  npc_override_alde_alche_2004_headgears_items_i_need_1d99f3: "The items I need are..."
  npc_override_alde_alche_2004_headgears_its_upgraded_status_adc1da: "will not have its upgraded status.^000000"
  npc_override_alde_alche_2004_headgears_jellopy_13486e: "^FF00001000 Jellopy^000000!"
  npc_override_alde_alche_2004_headgears_jellopy_again_196b8b: "^FF00001000 Jellopy^000000 again!"
  npc_override_alde_alche_2004_headgears_jellopy_again_tomorrow_075b60: "^FF00001000 Jellopy^000000 again tomorrow."
  npc_override_alde_alche_2004_headgears_jellopy_bf84fa: "^FF00001000 Jellopy^000000"
  npc_override_alde_alche_2004_headgears_juno_library_i_read_issu_0eb7a0: "At the Juno Library, I read in this issue of 'Funtime Kid Science' that all cats, whether they're wild or domesticated, are hunters that have mastered the art of saving their energy."
  npc_override_alde_alche_2004_headgears_just_bring_me_55b52a: "Just bring me"
  npc_override_alde_alche_2004_headgears_just_come_ask_me_75e94a: "Just come ask me"
  npc_override_alde_alche_2004_headgears_just_remember_02b9f0: "Just remember..."
  npc_override_alde_alche_2004_headgears_just_remember_if_you_bri_26299d: "^FF0000Just remember, if you bring me any item that has a card inserted, or has been upgraded, the additional abilities of the item will disappear after I have used them. So please keep that in mind."
  npc_override_alde_alche_2004_headgears_just_think_s_perfect_fus_f600cd: "Just think! It's the perfect fusion of magic and art, fashion and living life..."
  npc_override_alde_alche_2004_headgears_kitty_band_f0159b: "1 ^FF0000Kitty Band^000000,"
  npc_override_alde_alche_2004_headgears_knit_939610: "Knit this on...."
  npc_override_alde_alche_2004_headgears_last_time_we_097473: "Last time, we were"
  npc_override_alde_alche_2004_headgears_lately_our_director_been_6afc15: "Lately, our director has been gone, and we aren't sure when he'll come back. ^333333*Sigh* I can't even remember the last time we got paid.^000000"
  npc_override_alde_alche_2004_headgears_lazy_smokie_7bd541: "a 'Lazy Smokie?'"
  npc_override_alde_alche_2004_headgears_leave_all_your_extra_bag_49cc32: "Leave all your extra baggage somewhere else and come back."
  npc_override_alde_alche_2004_headgears_lemme_make_046f35: "Lemme make"
  npc_override_alde_alche_2004_headgears_let_me_create_one_you_1d2dc1: "Let me create one for you right away. Please have a seat and make yourself comfortable."
  npc_override_alde_alche_2004_headgears_let_me_give_you_2de962: "let me give you"
  npc_override_alde_alche_2004_headgears_let_me_give_you_2f435e: "Let me give you"
  npc_override_alde_alche_2004_headgears_let_me_make_your_hat_b458e4: "Let me make your hat."
