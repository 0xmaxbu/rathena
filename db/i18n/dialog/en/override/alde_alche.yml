  npc_override_alde_alche_2004_headgears_straw_hat_made_out_sakka_14e8d5: "A Straw Hat! Made out of a Sakkat with bamboo and tough vines, it gives you a relaxed, rustic feeling when you wear it."
  npc_override_alde_alche_2004_headgears_straw_hat_shades_you_hea_35fbc1: "A Straw Hat! It shades you from the heat of the sun and keeps farmers cool when they're working on the fields. It's a hat for cool, relaxed types and the hat of choice for some famous heroes!"
  npc_override_alde_alche_2004_headgears_striped_hairband_d46168: "1 ^FF0000Striped Hairband^000000,"
  npc_override_alde_alche_2004_headgears_struggling_you_0db27d: "Struggling, are you?"
  npc_override_alde_alche_2004_headgears_stuff_great_faking_injur_1d1a63: "That stuff is great for faking injuries, or hiding a bald spot. Handy to have when you wanna ditch school."
  npc_override_alde_alche_2004_headgears_such_beautiful_hair_i_m_400406: "Such beautiful hair! I'm sorry, it's just that I love pretty hairstyles, and accessories!"
  npc_override_alde_alche_2004_headgears_sushi_0898c4: "50 Sushi,"
  npc_override_alde_alche_2004_headgears_swish_swish_7dafe0: "*Swish swish...*"
  npc_override_alde_alche_2004_headgears_swish_swish_rustle_rustl_4cc3bd: "^3355FF*Swish Swish Rustle Rustle*^000000"
  npc_override_alde_alche_2004_headgears_sword_only_given_our_her_7beccf: "This is a sword only given to our heroes. I am not sure if you can use this or not, but as an Orc Hero, you're obligated to carry this with you always."
  npc_override_alde_alche_2004_headgears_sword_tear_sky_sever_ear_cfd68f: "That sword can tear the sky, sever the earth and make a waterfall flow backwards."
  npc_override_alde_alche_2004_headgears_tah_dah_8c1c8e: "Tah dah~!"
  npc_override_alde_alche_2004_headgears_tah_dah_a41181: "Tah dah!"
  npc_override_alde_alche_2004_headgears_take_72f14a: "Take this..."
  npc_override_alde_alche_2004_headgears_take_ebbb81: "Take this"
  npc_override_alde_alche_2004_headgears_take_items_you_brought_v_ae138f: "Take this! The items you have brought will be very useful for continuing my work in spreading headbands around Midgard."
  npc_override_alde_alche_2004_headgears_take_much_time_make_hat_9e91c5: "It will not take that much time to make this hat, so please wait a moment."
  npc_override_alde_alche_2004_headgears_takes_mad_skill_3f833b: "It takes mad skill."
  npc_override_alde_alche_2004_headgears_talk_humans_931529: "Talk with humans?!"
  npc_override_alde_alche_2004_headgears_talk_me_again_after_you_8e53b8: "Talk to me again after you've freed up some of your inventory space by putting some of your things into the Kafra Storage."
  npc_override_alde_alche_2004_headgears_talking_about_our_7198c0: "talking about our"
  npc_override_alde_alche_2004_headgears_tap_tap_aea95e: "*Tap tap...*"
  npc_override_alde_alche_2004_headgears_tear_off_f06a1f: "Tear this off..."
  npc_override_alde_alche_2004_headgears_teddybear_hat_t_worn_jus_d60a40: "The 'Teddybear Hat' can't be worn by just anyone, since it's cuddling powers are easily abused."
  npc_override_alde_alche_2004_headgears_tell_me_when_you_re_78f461: "Tell me when you're ready!"
  npc_override_alde_alche_2004_headgears_tell_me_when_you_re_d13469: "Tell me when you're ready, yeah?"
  npc_override_alde_alche_2004_headgears_tell_you_what_i_ve_7e7870: "Tell you what. I've learned a lot studying about animals, so if you give me the right materials, I'll make you a ^3355FFtruly great hat^000000."
  npc_override_alde_alche_2004_headgears_thank_you_174534: "Thank you."
  npc_override_alde_alche_2004_headgears_thank_you_744018: "Thank you for"
  npc_override_alde_alche_2004_headgears_thank_you_945f29: "Thank you~"
  npc_override_alde_alche_2004_headgears_thank_you_using_my_servi_68faed: "Thank you for using my service~!"
  npc_override_alde_alche_2004_headgears_that_e4eb67: "That..."
  npc_override_alde_alche_2004_headgears_then_i_fashion_model_tra_1ddb29: "Then I can fashion a 'Model Training Hat' for you right away."
  npc_override_alde_alche_2004_headgears_then_i_m_sure_you_32b3e8: "Then, I'm sure you can be granted status as a real Orc warrior. But, make sure you are fighting for honorable purposes, and that you have no other motive."
  npc_override_alde_alche_2004_headgears_then_i_make_you_tiiiiny_0b91f3: "Then I can make you a tiiiiny little flower."
  npc_override_alde_alche_2004_headgears_then_suddenly_dazzling_l_6efb26: "^FF0000Then, suddenly with a dazzling light, the Raccoon Hat turned blue and slowly transformed into a Sea-Otter Hat.^000000"
  npc_override_alde_alche_2004_headgears_then_you_may_leave_now_f2dff4: "Then, you may leave now...."
  npc_override_alde_alche_2004_headgears_there_901a05: "...There."
  npc_override_alde_alche_2004_headgears_there_battles_ahead_you_7f2ade: "There are {0} battles ahead of you before you reach your goal. I understand the difficulty of this challenge, but I hope you make it."
  npc_override_alde_alche_2004_headgears_there_old_saying_everyth_2e7f9a: "There is an old saying, 'Everything comes to those who wait.' Oh, are you freezing? Why don't you rub your hands together?"
  npc_override_alde_alche_2004_headgears_there_s_no_doubt_you_079fb0: "There's no doubt that you'll be the talk of the town sporting these fashionable things."
  npc_override_alde_alche_2004_headgears_there_too_many_wicked_hu_dcd27c: "There are too many wicked humans that have pursued wealth and fame at any cost. They don't understand ideals like honor and loyalty, and use any means to get whatever they want."
  npc_override_alde_alche_2004_headgears_there_you_go_19b809: "There you go."
  npc_override_alde_alche_2004_headgears_there_you_go_buddy_82837c: "There you go, buddy."
  npc_override_alde_alche_2004_headgears_there_you_go_buddy_i_f4968a: "There you go, buddy. I am proud to say this is my masterpiece. I call it... 'Devil Wing Ears!'"
  npc_override_alde_alche_2004_headgears_there_you_go_here_s_e095c4: "There you go. Here's your beautiful Golden Bell. I doubt it will jingle if you shake your head, though."
  npc_override_alde_alche_2004_headgears_there_you_go_i_marked_bb3e44: "There you go. I marked a small indication on it. So wear this helm from now on. Do you understand? My human Orc Hero."
  npc_override_alde_alche_2004_headgears_there_you_go_phew_ed727b: "There you go. *Phew~*"
  npc_override_alde_alche_2004_headgears_there_you_go_your_very_8c209b: "There you go! Your very own Beanie! Cute, but still 'dope!'"
  npc_override_alde_alche_2004_headgears_these_526678: "With these..."
  npc_override_alde_alche_2004_headgears_these_orchish_vouchers_y_49f985: "These Orchish Vouchers you have been collecting are the true token of Orc warriors. We recognize an Orc who won over 1,000 battles as a true Orc Warrior."
  npc_override_alde_alche_2004_headgears_they_best_warriors_orc_t_3e143e: "They are the best warriors of the Orc tribe, and are known to you as Orc Heroes. Not only are they the strongest ones among us, but they also our leaders in battle."
  npc_override_alde_alche_2004_headgears_they_could_endure_battle_6280b3: "They could endure in battle for at least few days without axes. When you get to a certain fighting skill level, weapons can actually become a burden..."
  npc_override_alde_alche_2004_headgears_think_all_sex_appeal_you_fd9c87: "But think of all the sex appeal you're missing out on. Come on, you know you need a Sombrero."
  npc_override_alde_alche_2004_headgears_those_don_t_sound_like_bf97e5: "Those don't sound like hat-making noises...^000000"
  npc_override_alde_alche_2004_headgears_those_hateful_humans_sta_7ec20e: "Those hateful humans started to get rid of every obstacle that stood between them and what they wanted, not caring if friend or foe stood in their way."
  npc_override_alde_alche_2004_headgears_those_i_able_continue_my_39ba0b: "With those, I will be able to continue my research, at least for a while. As I told you, I will give you this awesome ^0000FFAlarm Mask^000000 for those items!"
  npc_override_alde_alche_2004_headgears_those_old_warriors_shown_264458: "Those old warriors have shown outstanding fighting abilities, even without the use of weapons."
  npc_override_alde_alche_2004_headgears_those_orcs_come_back_ali_17b7cd: "Those Orcs that come back alive are recognized as true members of the tribe. The strongest males are chosen to become Orc Warriors, and the strongest females are chosen as Orc Ladies."
  npc_override_alde_alche_2004_headgears_though_i_must_admit_you_942128: "Though, I must admit that you have courage to enter an Orc's home."
  npc_override_alde_alche_2004_headgears_thousand_72ecb5: "...A thousand."
  npc_override_alde_alche_2004_headgears_three_f317d4: "Three..."
  npc_override_alde_alche_2004_headgears_today_a1df98: "today?"
  npc_override_alde_alche_2004_headgears_today_school_i_learned_h_ce919f: "Today at school, I learned how to make a paper flower! The flower was sort of hard, but now I can do it! Then I made a tiny tiny flower and put in on my head~"
  npc_override_alde_alche_2004_headgears_too_many_items_you_fc968e: "- too many items with you. -"
  npc_override_alde_alche_2004_headgears_top_human_head_858642: "On top of the human head..."
  npc_override_alde_alche_2004_headgears_tough_dcd510: "Tough!"
  npc_override_alde_alche_2004_headgears_tough_vines_a11d09: "300 ^3355FFTough Vines^000000 and"
  npc_override_alde_alche_2004_headgears_trying_figure_out_animal_b48b35: "Trying to figure out the Animal Kingdom's secrets of dealing with the heat."
  npc_override_alde_alche_2004_headgears_uh_oh_d55db3: "Uh oh..."
  npc_override_alde_alche_2004_headgears_uh_uh_2b40d9: "Uh! Uh!"
  npc_override_alde_alche_2004_headgears_uk_uk_uk_uk_uhoh_b0ffde: "^3355FF*Uk Uk Uk Uk Uhoh Uhoh*^000000"
  npc_override_alde_alche_2004_headgears_um_i_know_how_about_3547a5: "Um, I know! How about I make you a cute, warm and fuzzy Sea-Otter hat?"
  npc_override_alde_alche_2004_headgears_umm_7aaf3b: "Umm...?"
  npc_override_alde_alche_2004_headgears_umm_okay_a2a9c2: "Umm, okay..."
  npc_override_alde_alche_2004_headgears_understanding_orc_16a6a2: "in understanding the Orc"
  npc_override_alde_alche_2004_headgears_unfortunately_i_don_t_an_e7188c: "Unfortunately, I don't have any material to make the headgear right now. But if you bring the materials, I will make you a 'Teddybear Hat' for free."
  npc_override_alde_alche_2004_headgears_unleash_your_fighting_sp_372f7c: "Unleash your fighting spirit upon the villains of the world!"
  npc_override_alde_alche_2004_headgears_up_scram_6a6035: "up and scram!!"
  npc_override_alde_alche_2004_headgears_us_orcs_victory_battle_g_abd7bb: "For us Orcs, victory in battle is the greatest honor."
  npc_override_alde_alche_2004_headgears_usually_we_zeny_service_4f48c6: "Usually we have a zeny service charge, but since you've got ^3355FFthe look^000000, I'll waive it."
  npc_override_alde_alche_2004_headgears_very_least_we_could_trai_413ef2: "At the very least, we could train you to improve your posture so that you can walk with regal poise."
  npc_override_alde_alche_2004_headgears_victory_me_5a087c: "victory with me?"
  npc_override_alde_alche_2004_headgears_vouchers_1f68b0: "with the vouchers?"
  npc_override_alde_alche_2004_headgears_waaaaaaah_d424eb: "Waaaaaaah~!"
  npc_override_alde_alche_2004_headgears_wah_665f96: "Wah~~~~~!"
  npc_override_alde_alche_2004_headgears_wait_f241ee: "Wait..."
  npc_override_alde_alche_2004_headgears_wait_minute_17efa5: "- Wait a minute !! -"
  npc_override_alde_alche_2004_headgears_wait_minute_d3d0a0: "- Wait a minute! -"
  npc_override_alde_alche_2004_headgears_wait_moment_1a7242: "- Wait a moment! -"
  npc_override_alde_alche_2004_headgears_wait_second_2c0252: "Wait a second..."
  npc_override_alde_alche_2004_headgears_want_talk_me_102409: "want to talk to me."
  npc_override_alde_alche_2004_headgears_warrior_a8d66a: "Warrior..."
  npc_override_alde_alche_2004_headgears_warrior_may_fresh_light_ab585f: "Warrior, may a fresh light be with you in battle. Show your opponents your indomitable spirit. Take pride in being a human that has been given the title of Orc Warrior!"
  npc_override_alde_alche_2004_headgears_warrior_might_79dc5e: "Warrior of Might!"
  npc_override_alde_alche_2004_headgears_warrior_where_did_you_le_001cfc: "Warrior, where did you leave your sword? Without the sword, I cannot recognize you as an Orc Hero. Please find it and keep it with you anywhere you go."
  npc_override_alde_alche_2004_headgears_warrior_where_did_you_le_d5e9cc: "Warrior, where did you leave your Heroic Emblem? Without the token, I cannot recognize you as an Orc Hero. Please find it and keep it with you anywhere you go."
  npc_override_alde_alche_2004_headgears_warriors_b08ffd: "warriors..."
  npc_override_alde_alche_2004_headgears_wasn_t_too_difficult_i_f423c0: "That wasn't too difficult. I hope you wear this hat everyday to improve your posture."
  npc_override_alde_alche_2004_headgears_wataaaaa_7b1d84: "*Wataaaaa~!*"
  npc_override_alde_alche_2004_headgears_way_if_you_use_upgraded_6f5427: "^FF0000By the way, if you use an upgraded"
  npc_override_alde_alche_2004_headgears_way_life_through_battle_047066: "way of life through battle."
  npc_override_alde_alche_2004_headgears_we_call_these_cursed_orc_1860a9: "We call these cursed Orcs Zenorc. They are forced to live inside of caves or dungeons, away from from honorable Orcs. It's difficult to believe that Zenorcs were once one of us..."
  npc_override_alde_alche_2004_headgears_we_could_play_games_snow_3450f5: "We could play games in the snow, and play with real Sea Otters and have them give us rides and..."
  npc_override_alde_alche_2004_headgears_we_fight_boldly_fearless_e522d4: "We fight boldly and fearlessly with our opponent, giving our all in hopes of a fair victory. We would die for victory in battle."
  npc_override_alde_alche_2004_headgears_we_only_select_strongest_bbdef5: "We only select the strongest of our tribe to become warriors. When Orcs reach adulthood, they are sent to the forest to survive alone in its environment."
  npc_override_alde_alche_2004_headgears_we_orcs_invented_many_us_f75802: "We Orcs have invented many useful things! Of course, now we've had to keep these things to ourselves. Why? Because of the stupidity and greed of humans!!"
  npc_override_alde_alche_2004_headgears_we_orcs_once_constructed_76528d: "We Orcs have once constructed a tower for a human, but were then trapped and enslaved there. Needless to say, humans are deserving of our wrath and fury."
  npc_override_alde_alche_2004_headgears_we_orcs_proud_race_i_5277ee: "We Orcs are a proud race, and I shall oblige."
  npc_override_alde_alche_2004_headgears_we_orcs_proud_race_like_279d01: "We Orcs are a proud race and do not like to admit when we are wrong."
  npc_override_alde_alche_2004_headgears_we_orcs_special_training_ceee95: "We Orcs have a special training course called 'The Trial of Fire.' If any Orc Warrior passes this course, he will be protected by our fire god..."
  npc_override_alde_alche_2004_headgears_wearing_cowboy_hat_make_fbcde1: "Wearing a Cowboy Hat will make guys look tougher and more heroic, and will add untamed cuteness to the ladies."
  npc_override_alde_alche_2004_headgears_wearing_one_color_makes_0d4c4e: "Wearing one color makes you feel warmer, and another makes you feel cooler on a hot day."
  npc_override_alde_alche_2004_headgears_welcome_handsome_charm_m_efcc12: "Welcome to the Handsome Charm Modeling School. May I help you?"
  npc_override_alde_alche_2004_headgears_well_074932: "But well..."
  npc_override_alde_alche_2004_headgears_well_good_day_261596: "Well, have a good day."
  npc_override_alde_alche_2004_headgears_well_humans_rarely_get_c_63ceed: "Well, humans rarely get the chance to see this helmet unless they're in battle with an Orc Hero themselves..."
  npc_override_alde_alche_2004_headgears_well_i_made_these_myself_b78ee3: "Well, I made these myself."
  npc_override_alde_alche_2004_headgears_well_i_see_66067e: "Well, I see."
  npc_override_alde_alche_2004_headgears_well_if_you_want_one_ab2172: "Well, if you want one, I'll make it. But I want you should pay me some royalties for my services. It's pretty hard to attach a flower to a hairpin, you know?"
  npc_override_alde_alche_2004_headgears_well_orc_hero_held_high_2e11fc: "Well, Orc Hero is held in high regard by other Orcs for their great power. As a human, you will probably have difficulty in dealing with him."
  npc_override_alde_alche_2004_headgears_well_s_supposed_seeeecre_94b8e5: "Well, it's supposed to be a seeeecret, but my mommy taught me some magic to make Sea-Otter hats with Raccoon hats."
  npc_override_alde_alche_2004_headgears_well_then_farewell_a94edc: "Well then... Farewell!"
  npc_override_alde_alche_2004_headgears_well_we_orcs_proud_race_5cc4f8: "Well! We Orcs are a proud race!"
  npc_override_alde_alche_2004_headgears_western_grace_fbc7ec: "1 ^3355FFWestern Grace^000000,"
  npc_override_alde_alche_2004_headgears_whaddup_broham_hat_keeps_5e0fc1: "Whaddup, broham. This hat keeps your head toasty, but let's you play things cool with your homeys. And, um, fly girls."
  npc_override_alde_alche_2004_headgears_what_336de9: "WHAT?!"
  npc_override_alde_alche_2004_headgears_what_brings_you_lutie_to_1d6441: "What brings you to Lutie, town of goodwill and year round Christmas cheer?"
  npc_override_alde_alche_2004_headgears_what_don_t_you_know_26e3c6: "What the...! Don't you know when to stop? I do not believe a human would like to hear about Orcs so much. But..."
  npc_override_alde_alche_2004_headgears_what_great_attitude_warr_9be4c2: "What a great attitude for a warrior...! It will be a model to other Orcs to show respect to opponents that you have defeated!"
  npc_override_alde_alche_2004_headgears_what_happens_if_you_re_4bba0f: "What happens if you're wearing no colors? If my ^333333*ahem*^000000 hypothesis is correct, you wouldn't feel any heat if you were invisible!"
  npc_override_alde_alche_2004_headgears_what_if_i_had_no_f5d2ba: "What if I had no colors?"
  npc_override_alde_alche_2004_headgears_what_s_5b8716: "What's that"
  npc_override_alde_alche_2004_headgears_what_s_efcba8: "What's this?!"
  npc_override_alde_alche_2004_headgears_what_you_doing_so_much_4e1010: "What are you doing with so much Jellopy?!"
  npc_override_alde_alche_2004_headgears_when_i_realized_i_decide_32ba95: "When I realized this, I decided to help these people and began to research technology for artificial limbs. My studies have lead me to Alarms and their own mechanical limbs known as 'Ruimento.'"
  npc_override_alde_alche_2004_headgears_when_you_decide_represen_a7a193: "When you decide to represent yo' hood, come to me with the stuff. I'll hook you up."
  npc_override_alde_alche_2004_headgears_when_you_re_ready_6d9a32: "when you're ready."
  npc_override_alde_alche_2004_headgears_whether_you_plan_go_hous_806cff: "Whether you plan to go to a house party, get your groove back, or be as fresh as a prince, you'll be chillin' with this fly style."
  npc_override_alde_alche_2004_headgears_whew_a0bff9: "*Whew~!*"
  npc_override_alde_alche_2004_headgears_whirling_tempest_0bc972: "Whirling Tempest"
  npc_override_alde_alche_2004_headgears_whoa_99ff0f: "Whoa~"
  npc_override_alde_alche_2004_headgears_whoa_lady_b32907: "Whoa~! A lady..."
  npc_override_alde_alche_2004_headgears_whoa_why_you_carrying_so_e95a4f: "Whoa, why are you carrying so many items with you?"
  npc_override_alde_alche_2004_headgears_why_don_t_i_make_221276: "Why don't I make you..."
  npc_override_alde_alche_2004_headgears_why_don_t_i_make_7e5478: "Why don't I make..."
  npc_override_alde_alche_2004_headgears_why_don_t_you_go_3ac7ae: "Why don't you go take a picture with Mistress? That would be funny to see if she wasn't too busy trying to maul you."
  npc_override_alde_alche_2004_headgears_why_you_carrying_so_many_adffd4: "Why are you carrying so many items with you? Leave all your extra baggage somewhere else and come back."
  npc_override_alde_alche_2004_headgears_will_have_a_34788d: "will have a"
  npc_override_alde_alche_2004_headgears_woman_t_you_i_m_bed936: "Woman, can't you that I'm a man?"
  npc_override_alde_alche_2004_headgears_woohoo_44136e: "(Woohoo~!)"
  npc_override_alde_alche_2004_headgears_worst_7bd270: "Was the worst"
  npc_override_alde_alche_2004_headgears_wouldn_t_some_kinda_flow_c9cd67: "Wouldn't some kinda... ^3131FFFlower Hairpin^000000 be a hit with chicks? So I tried making one, and it seemed to be pretty popular among my lady friends."
  npc_override_alde_alche_2004_headgears_wow_213d95: "Wow~"
  npc_override_alde_alche_2004_headgears_wow_did_you_really_gathe_5c09f8: "Wow! Did you really gather these 300 Mushroom Spores all by yoruself? Nice! Now it's time to use my magic~"
  npc_override_alde_alche_2004_headgears_wow_you_re_really_cute_bd0f39: "Wow, you're really cute! Tell you what..."
  npc_override_alde_alche_2004_headgears_wow_you_re_so_stubborn_c755cd: "Wow, you're so stubborn! Just treat the helm with care, and wear it with respect. Recognize that it has a long history..."
  npc_override_alde_alche_2004_headgears_x_hairpin_07d1e1: "X Hairpin!"
  npc_override_alde_alche_2004_headgears_yarn_76e160: "500 ^3355FFYarn^000000."
  npc_override_alde_alche_2004_headgears_yay_4cbc9f: "Yay~"
  npc_override_alde_alche_2004_headgears_yay_you_ve_got_great_09c560: "Yay! You've got a great looking crown!"
