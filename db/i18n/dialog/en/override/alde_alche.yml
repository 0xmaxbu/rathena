  npc_override_alde_alche_2004_headgears_so_when_you_decide_give_720ffc: "So when you decide to give your life a boost with rustic style, come back to me with those items so I can make you a Cowboy Hat."
  npc_override_alde_alche_2004_headgears_so_you_like_create_model_abafc5: "So would you like to create the Model Training Hat right now?"
  npc_override_alde_alche_2004_headgears_so_you_think_you_get_29a4c0: "So, do you think you can get all of them? I will be here waiting for you."
