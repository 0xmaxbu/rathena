  npc_override_alde_alche_2004_headgears_hm_701c55: "Hm...?"
  npc_override_alde_alche_2004_headgears_hm_well_you_humans_we_848e87: "Hm, well to you humans, we may all look the same, but we Orcs can tell each other apart. How about you, human? Do I look the same as every Warrior outside to you?"
  npc_override_alde_alche_2004_headgears_hm_you_don_t_seem_ed6ff0: "Hm? You don't seem to understand our way of life completely. It's strange that you are so curious about other races, human."
  npc_override_alde_alche_2004_headgears_hm_you_don_t_think_b56501: "Hm? You don't think you cannot come back to where you originally came, just because now you're an Orc Warrior, do you? Hahahahaha!"
  npc_override_alde_alche_2004_headgears_hm_you_human_granted_sta_31d73c: "Hm, are you the human that was granted status as an Orc Hero?"
  npc_override_alde_alche_2004_headgears_hm_you_human_who_granted_5534ae: "Hm, are you the human who was granted status as an Orc Hero?"
