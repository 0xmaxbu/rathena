Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job_sword1_swordman_ah_yes_your_application_b4b7f5: "Ah, yes. Your application will be reviewed as soon as possible."
  npc_override_job_sword1_swordman_ah_youth_8b2149: "Ah, youth!"
  npc_override_job_sword1_swordman_alright_then_feel_free_c_9acdc8: "Alright then. Feel free to come back whenever you are ready. All you have to do now is meet our requirements. Good luck to you."
  npc_override_job_sword1_swordman_amongst_first_class_jobs_dd7810: "Amongst the First Class jobs, the Swordman is the best melee fighter for three reasons."
  npc_override_job_sword1_swordman_applicant_pass_course_76342a: "Applicant {0}. Pass the {1} course."
  npc_override_job_sword1_swordman_applicant_quit_test_bb06da: "Applicant {0} quit the test.."
  npc_override_job_sword1_swordman_applicant_quit_test_ce8a26: "Applicant {0} quit the test."
  npc_override_job_sword1_swordman_applicant_you_successful_ca7c2c: "Applicant {0}. You successfully passed the test."
  npc_override_job_sword1_swordman_applicant_you_surrender_1befc8: "Applicant {0}. Do you surrender??"
  npc_override_job_sword1_swordman_as_you_travel_through_th_07bff5: "As you travel through the three courses, you may fall to a random, underground area. The course is designed so that you can still find your way back."
  npc_override_job_sword1_swordman_bravo_go_again_088c5f: "Bravo! Go for it again!"
  npc_override_job_sword1_swordman_brings_you_us_eeeea8: "brings you to us?"
  npc_override_job_sword1_swordman_check_point_cheer_up_1c3b6b: "This is the {0} check point! Cheer up!"
  npc_override_job_sword1_swordman_check_requirements_job_c_00a2e5: "Check the requirements for job change again, and come back when you are ready."
  npc_override_job_sword1_swordman_come_back_me_when_you_56a696: "Come back to me when you have finished learning the Basic Novice Skills."
  npc_override_job_sword1_swordman_don_t_ever_give_up_5d54ca: "Don't ever give up! Now retesting!"
  npc_override_job_sword1_swordman_enter_room_my_right_so_1b3bce: "Enter the room to my right so that you can take the test. You'll need to speak to my right so you can enter the examination area."
  npc_override_job_sword1_swordman_excellent_let_me_promote_858371: "Excellent! Let me promote you to a Swordman right away!"
  npc_override_job_sword1_swordman_first_swordman_benefit_a_e17e6a: "First, Swordman has the benefit of additional HP. Second, Swordman generally have access to a wider selection fo weapons than the other First Class jobs."
  npc_override_job_sword1_swordman_first_you_must_learn_all_9f3f32: "First, you must learn all 9 of the Basic Skills. If you can't complete this requirement, you won't be able to change to any job."
  npc_override_job_sword1_swordman_good_good_4a58b4: "Good, good."
  npc_override_job_sword1_swordman_ha_ha_ha_aabfe5: "Ha ha ha!"
  npc_override_job_sword1_swordman_haha_oh_boy_i_m_e40809: "Haha! Oh boy. I'm flattered, but you already have another job! Still, I can't blame you..."
  npc_override_job_sword1_swordman_hahaha_congratulations_n_186b9c: "Hahaha! Congratulations! Now you are fully qualified to be a real Swordman! I will transform you right away!"
  npc_override_job_sword1_swordman_hey_you_need_talk_swordm_55afe2: "Hey. You need to talk to the Swordman in the center of the room, not me."
  npc_override_job_sword1_swordman_hm_701c55: "Hm...?"
  npc_override_job_sword1_swordman_hm_alright_come_back_whe_dfe269: "Hm? Alright, come back whenever you change your mind. The world can always use another Swordman!"
  npc_override_job_sword1_swordman_hm_how_did_you_get_94c26a: "Hm? How did you get inside? You're not supposed to be in here, so please leave now."
  npc_override_job_sword1_swordman_hm_you_still_haven_t_4d48bc: "Hm, you still haven't learned all of the Basic Skills. You need to do that before you can become a Swordman."
  npc_override_job_sword1_swordman_hm_you_ve_learned_all_134380: "Hm, you've learned all of the Basic Skills but didn't take the test yet. You must first pass the exam before you can change your job to Swordman."
  npc_override_job_sword1_swordman_hmm_ah_you_must_first_341954: "Hmm? Ah, you must first master the Basic Skills before you are ready to become a Swordman."
  npc_override_job_sword1_swordman_hmm_you_look_like_well_9c09ee: "Hmm... You look like a well-experienced Swordman. Still, I'm sure that you must train to improve your skills and gain strength!"
  npc_override_job_sword1_swordman_hmmm_2ac89c: "Hmmm..."
  npc_override_job_sword1_swordman_however_careful_as_waste_efde6c: "However, be careful, as this will waste your time! Godspeed to you."
  npc_override_job_sword1_swordman_i_already_sent_your_test_83dde6: "I already sent your test result to the Job Department. Please inquire at the Officer in Centre.Thank you."
  npc_override_job_sword1_swordman_i_see_you_re_retreading_892a34: "I see you're retreading the path of the Swordman! Once you've gotten used to brandishing a sword, you can never go back!!"
  npc_override_job_sword1_swordman_i_sencerely_congratulate_fbd466: "I sencerely congratulate you for passing the test!"
  npc_override_job_sword1_swordman_i_tell_you_about_test_485115: "I will tell you about the Test! Listen carefully, I won't repeat myself."
  npc_override_job_sword1_swordman_i_you_9378ca: "I can do for you."
  npc_override_job_sword1_swordman_if_you_already_met_requi_95f886: "If you have already met the requirements, you can take an interview right now. Would you like to?"
  npc_override_job_sword1_swordman_if_you_choose_surrender_41f23d: "If you choose to 'Surrender,' or if you run out of time, you will not pass the test."
  npc_override_job_sword1_swordman_if_you_complete_these_re_87bb59: "If you can complete these 2 requirements, you can change to a Swordman anytime you want."
  npc_override_job_sword1_swordman_if_you_find_you_strong_bccbff: "If you find that you are not strong enough to pass the test, head to the entrance of the course and talk to the checkpoint manager."
  npc_override_job_sword1_swordman_it_454889: "It..."
  npc_override_job_sword1_swordman_job_change_muhahaha_you_57a49e: "Job change? Muhahaha! But you're already a Swordman! Be proud and be strong!"
  npc_override_job_sword1_swordman_menu_job_d92c09: "Job Change:About Swordman.:About the Job requirements.:Cancel."
  npc_override_job_sword1_swordman_menu_sign_ee5f59: "Sign up.:Cancel."
  npc_override_job_sword1_swordman_menu_yes_de2097: "Yes.:No."
  npc_override_job_sword1_swordman_now_let_s_see_3052a1: "Now, let's see..."
  npc_override_job_sword1_swordman_once_again_congratulatio_f514dd: "Once again, congratulations. I expect that you will be a good representative of the Swordman Association."
  npc_override_job_sword1_swordman_purpose_test_confirm_whe_a7d13d: "The purpose of this test is to confirm whether or not you are qualified to be a Swordman. As you know, a Swordman needs physical strength and spirit!"
  npc_override_job_sword1_swordman_retesting_try_worry_abou_97dacd: "Retesting? Try not to worry about it. It's good that you don't back down from a challenge! Here, take these and cheer up!"
  npc_override_job_sword1_swordman_s_too_late_you_become_97b656: "It's too late for you to become a Swordman. You already have another job. Still, there's no harm in telling you..."
  npc_override_job_sword1_swordman_second_you_must_pass_swo_5cb8e1: "Second, you must pass the Swordman Test. Inquire the Test Manager located in the waiting room of the Swordman Test."
  npc_override_job_sword1_swordman_seems_being_06471b: "It seems that being"
  npc_override_job_sword1_swordman_seems_there_nothing_70af98: "but it seems there is nothing"
  npc_override_job_sword1_swordman_so_c7572d: "So..."
  npc_override_job_sword1_swordman_so_you_one_who_wants_7fea0a: "So are you the one who wants to be a Swordman? Alright! You look reliable!"
  npc_override_job_sword1_swordman_so_you_wish_become_proud_df8e1f: "So you wish to become a proud Swordman? By all means, please sign up!"
  npc_override_job_sword1_swordman_so_you_wish_know_more_8e4f2f: "So you wish to know more about the mighty Swordman job? Well, then..."
  npc_override_job_sword1_swordman_sorry_guy_i_only_allow_72fcfa: "Sorry guy, but I can only allow Novices to enter the Test Hall."
  npc_override_job_sword1_swordman_stop_i_t_let_you_905b40: "Stop! I can't let you in until you learn all of the Basic Skills. The Test Hall isn't for goofing off!"
  npc_override_job_sword1_swordman_stop_if_you_want_take_163053: "Stop! If you want to take the Swordman Test, you'll need to fill out an application first."
  npc_override_job_sword1_swordman_swordman_association_a86d9c: "Swordman Association!"
  npc_override_job_sword1_swordman_swordman_center_room_hel_8b7e75: "The Swordman in the center of the room can help you with that, got it?"
  npc_override_job_sword1_swordman_swordman_part_071d18: "a Swordman is not part"
  npc_override_job_sword1_swordman_t_a021d3: "Can't be..."
  npc_override_job_sword1_swordman_there_reasons_why_swordy_fac20b: "There are 3 reasons why Swordy is the best to approch a fight!"
  npc_override_job_sword1_swordman_there_s_no_need_tell_b0217b: "But there's no need to tell you the requirements. You've met them and already became a Swordman! Well, anyway..."
  npc_override_job_sword1_swordman_third_most_swordman_skil_c68007: "And third, most of the Swordman skills are crushing physical attacks! In my opinion, being a Swordman is the best job ever!"
  npc_override_job_sword1_swordman_try_relax_your_best_cour_d371bc: "Try to relax and do your best. This course isn't so difficult."
  npc_override_job_sword1_swordman_warrior_aren_t_you_158d6a: "warrior, aren't you?"
  npc_override_job_sword1_swordman_welcome_c8f06d: "Welcome to the"
  npc_override_job_sword1_swordman_what_business_eb746a: "What business"
  npc_override_job_sword1_swordman_who_hell_you_nobody_othe_c158a0: "Who the hell are you?! Nobody, other than Novices, is permitted to come in here!"
  npc_override_job_sword1_swordman_who_you_place_swordman_t_5296d8: "Who are you?! This place is for the Swordman Test! You're not allowed to be in here! Leave now!"
  npc_override_job_sword1_swordman_without_those_you_won_t_dba347: "Without those, you won't be able to become a Swordman. Now, the conditions for completing this test are very simple."
  npc_override_job_sword1_swordman_you_re_reborn_50537a: "You're a reborn"
  npc_override_job_sword1_swordman_you_surrender_5077a8: "Do you surrender?"
  npc_override_job_sword1_swordman_you_travel_through_three_1c1a81: "You will travel through three courses and must reach the final checkpoint within ^FF000010 minutes^000000."
  npc_override_job_sword1_swordman_you_ve_been_reborn_haven_5ebfe3: "You've been reborn, haven't you?"
  npc_override_job_sword1_swordman_your_destiny_i_m_sorry_71d0f0: "of your destiny. I'm sorry,"
