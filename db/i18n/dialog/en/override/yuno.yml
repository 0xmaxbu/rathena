  npc_override_yuno_pile_bunker_about_then_ce2314: "about it then."
  npc_override_yuno_pile_bunker_bring_me_steel_flexible_771b4d: "Bring me 200 Steel, 30 Flexible Tubes, and 1 Brocca. I could make what I just described with those materials."
  npc_override_yuno_pile_bunker_combination_weight_volum_c1fe09: "Combination of weight, volume and look at its color and gloss. It catches my heart!"
  npc_override_yuno_pile_bunker_doesn_t_look_fancy_i_8f7fdf: "It doesn't look fancy, but I've designed a spring-loaded device to attack with great strength."
  npc_override_yuno_pile_bunker_flexible_tubes_more_rare_f3a4c0: "Flexible Tubes are more rare, dropped by Metalings around Einbroch and Lighthalzen."
  npc_override_yuno_pile_bunker_forced_something_you_don_a43f41: "Forced to do something you don't like, there is nothing more miserable than that."
  npc_override_yuno_pile_bunker_huh_i_m_saying_i_b6a0e5: "Huh? I'm not saying I have any complaints about this work."
  npc_override_yuno_pile_bunker_i_habit_giving_up_what_f4d61d: "I have a habit of giving up what I've been making and trying to make new things when the inspiration comes up."
  npc_override_yuno_pile_bunker_i_m_retired_mechanic_i_3a2dca: "I'm a retired Mechanic and I don't think I have any business with you."
  npc_override_yuno_pile_bunker_i_t_wait_see_action_7fb464: "I can't wait to see it in action!"
  npc_override_yuno_pile_bunker_if_you_imagine_how_good_0f396a: "If you were to imagine how good this kind of weapon could be, I will make it come true."
  npc_override_yuno_pile_bunker_lastly_finding_brocca_ve_aa85ec: "Lastly, finding a Brocca is very hard, but you should be able to do something about it. Haha, go get it!"
  npc_override_yuno_pile_bunker_makes_me_feel_good_i_942f05: "That makes me feel good and I am about to make a new gear. I want you to help me. What do you say?"
  npc_override_yuno_pile_bunker_me_i_retired_long_time_823cac: "Me? I retired a long time ago. Because I got into an accident... got badly hurt and won't be able to ride again. I am upset about it."
  npc_override_yuno_pile_bunker_menu_i_85d2b2: "I am not that interested.:What are you going to make?:Where do you get the materials?:I brought the materials."
  npc_override_yuno_pile_bunker_msg_b1a5f2: "..........."
  npc_override_yuno_pile_bunker_nothing_i_881f25: "Nothing I can do"
  npc_override_yuno_pile_bunker_oh_i_ve_been_waiting_05e9f6: "Oh, I've been waiting. You didn't come on time, so I was wondering if you forgot about it. Please wait there a little bit."
  npc_override_yuno_pile_bunker_oh_turns_out_i_didn_49b881: "Oh, and it turns out that I didn't need all that Steel after all. So here, take most of it back."
  npc_override_yuno_pile_bunker_s_concealed_so_when_you_0c1692: "It's concealed, so when you find a chance, one shot could put an opponent in critical condition!"
  npc_override_yuno_pile_bunker_s_done_what_you_think_29b7e8: "It's done. What do you think? Not bad, eh? Although I made it myself, I have to say it's pretty decently done."
  npc_override_yuno_pile_bunker_s_something_s_allowed_th_cdb14b: "It's something that's not allowed for those who failed to seek out their own path."
  npc_override_yuno_pile_bunker_see_you_next_time_e863c1: "See you next time!"
  npc_override_yuno_pile_bunker_so_how_s_pilebuncker_wor_a74ef7: "So how's that Pilebuncker working out for you?"
  npc_override_yuno_pile_bunker_so_i_ve_decided_stay_c07d06: "So I've decided to stay here forging gears for Madogear."
  npc_override_yuno_pile_bunker_so_what_feel_like_madoge_c9d83a: "So? What does it feel like to be on a Madogear?"
  npc_override_yuno_pile_bunker_there_people_who_happy_j_3c9a63: "There are people who are happy just being props, you know, like being the wall for someone to lean on."
  npc_override_yuno_pile_bunker_uh_little_improvement_co_15f63b: "Uh, with little improvement, it could be mass produced and delivered. I'm sure I can make more of these so I will give this one to you."
  npc_override_yuno_pile_bunker_um_huge_metal_stick_coul_002cf7: "Um, a huge metal stick that could smash an opponent in one hit!"
  npc_override_yuno_pile_bunker_you_carrying_so_much_dro_a9b90f: "You are carrying so much. Drop off some of your luggage and come back to me."
  npc_override_yuno_pile_bunker_you_d_better_hurry_1643b2: "You'd better hurry!"
  npc_override_yuno_pile_bunker_you_haven_t_brought_all_65f91f: "You haven't brought all of the materials that I asked for."
  npc_override_yuno_pile_bunker_you_should_able_get_stee_80c32a: "You should be able get steel from many monsters like Kobolds."
  npc_override_yuno_yuno_about_juno_airship_which_6de376: "about the Juno Airship which"
  npc_override_yuno_yuno_ahhh_bc9dd9: "Ahhh~"
  npc_override_yuno_yuno_airship_we_re_developing_00b703: "The Airship we're developing will provide you with convenient travel to any town. You can also enjoy the sights while aloft in the sky. Unique products from various areas will also be provided."
  npc_override_yuno_yuno_although_juno_known_as_c_bbc9e3: "Although Juno is known as a city of Sages, I hope you understand that ordinary people live and prosper here as well. Please enjoy the unique atmosphere that Juno has to offer."
  npc_override_yuno_yuno_amazing_travel_experienc_7264d2: "amazing travel experience"
  npc_override_yuno_yuno_among_sage_s_weapons_the_844667: "Among the Sage's weapons, there is a 'Dagger of Counter.'"
  npc_override_yuno_yuno_apocalypse_6a55be: "^3355FFApocalypse^000000..."
  npc_override_yuno_yuno_as_adventurer_s_possible_b41a22: "As an adventurer, it's possible that you may see him in your travels. Be careful..."
  npc_override_yuno_yuno_as_you_chosen_you_forget_9c3553: "As you have chosen, you will forget everything, and remain in this virtual reality."
  npc_override_yuno_yuno_attacks_using_its_strong_4743a7: "It attacks using its strong bill and many Peco Pecos follow it. There's quite a difference in power between Peco Peco and the Grand Peco."
  npc_override_yuno_yuno_because_its_artificial_i_213133: "Because its artificial intelligence has corrupted over the years, it can no longer distinguish comrades from enemies. Sadly, that android is nothing but a mindless monster now."
  npc_override_yuno_yuno_city_sages_6c9299: "The city of Sages,"
  npc_override_yuno_yuno_complete_testing_however_fc2b22: "to complete testing. However,"
  npc_override_yuno_yuno_development_we_ve_yet_15f5fd: "development, and we've yet"
  npc_override_yuno_yuno_don_t_fooled_its_appeara_ba46db: "Don't be fooled by its appearance, or you'll find yourself in trouble."
  npc_override_yuno_yuno_eager_customers_know_our_6d8ba6: "eager customers know of our"
  npc_override_yuno_yuno_even_if_you_manage_dodge_799642: "Even if you manage to dodge to its horns, you still need to be wary of its powerful legs."
  npc_override_yuno_yuno_fighter_who_f7cc57: "the fighter who"
  npc_override_yuno_yuno_geographer_6aff92: "Geographer..."
  npc_override_yuno_yuno_giggle_8ec405: "*Giggle*"
  npc_override_yuno_yuno_giggle_giggle_6c9072: "*Giggle giggle*"
  npc_override_yuno_yuno_goat_monster_antelope_li_950269: "'Goat' is a monster that was an antelope living in the high mountains that was somehow turned into a monster."
  npc_override_yuno_yuno_goat_s_legs_so_strong_02ae99: "Goat's legs are so strong because it's always climbing cliffs when it's not busy slaughtering the innocent."
  npc_override_yuno_yuno_good_day_i_am_here_b1d402: "Good day, I am here to inform you"
  npc_override_yuno_yuno_granny_hands_you_some_ca_d55940: "^3355FFGranny hands you some candy^000000."
  npc_override_yuno_yuno_he_rumored_high_sorcerer_c8291a: "He was rumored to be a high sorcerer that used his power to curse innocents. It is said that he is still around, placing his curses on people."
  npc_override_yuno_yuno_here_s_zeny_c970a8: "Here's ^3355FF1,000 zeny^000000."
  npc_override_yuno_yuno_hmm_i_m_sorry_say_00b333: "Hmm. I'm sorry to say you just missed a fortunate chance. However, I can tell you don't have enough wealth to bring this fortune to fruition."
  npc_override_yuno_yuno_however_rumored_only_few_295216: "However it is rumored that only a few chosen Crusaders are able to obtain those items due of their rarity."
  npc_override_yuno_yuno_i_am_old_sage_granny_d082d2: "I am an old Sage granny who foresees everything..."
  npc_override_yuno_yuno_i_regret_say_you_enough_ceb3da: "I regret to say that you do not have enough zeny with you."
  npc_override_yuno_yuno_i_tell_you_about_grand_85a51b: "I will tell you about ^3355FFGrand Peco^000000 which is a high level Peco Peco. Grand Peco is faster than Peco Peco and is quite aggressive."
  npc_override_yuno_yuno_i_wish_i_could_eat_cbfe71: "I wish I could eat a bit of Rice Cake right now."
  npc_override_yuno_yuno_its_use_limited_sage_cla_e99c65: "Its use is limited to the Sage class, and it increases the chance of inflicting critical attacks. So, for Sages, that dagger can be very useful, as well as make them look stylish in battle."
  npc_override_yuno_yuno_juno_kept_aloft_air_anci_acb45e: "^3355FFJuno^000000 is kept aloft in the air by an ancient and mysterious force."
  npc_override_yuno_yuno_juno_made_cbbca5: "^3355FFJuno,^000000 is made of"
  npc_override_yuno_yuno_lava_dripping_its_body_s_97640b: "The lava dripping from its body is so hot that it can melt down armor and weapons made out of high quality steel."
  npc_override_yuno_yuno_let_me_suggest_holy_guar_ab96c7: "Let me suggest the ^3355FFHoly Guard^000000 and ^3355FFHoly Avenger^000000 which are special items for Crusaders."
  npc_override_yuno_yuno_location_each_island_2a4585: "The location of each island is"
  npc_override_yuno_yuno_look_my_hand_i_am_78d3fc: "Look in my hand. I am holding two different kinds of herbs."
  npc_override_yuno_yuno_looks_like_simple_scroll_d21893: "It looks like a simple scroll marked with concentric circles and a star. Although the ^FF3355Worn-Out Magic Scroll^000000 is very old, it's wanted by many Sages for research purposes."
  npc_override_yuno_yuno_menu_about_25d8b1: "About Powerful Equipment:About Unique Items:About Authentic Food:End Conversation"
  npc_override_yuno_yuno_menu_accept_7cf63b: "Accept:Do not accept"
  npc_override_yuno_yuno_menu_choose_bc52aa: "Choose ^FF3355Red Herb^000000:Choose ^3355FFBlue Herb^000000."
  npc_override_yuno_yuno_menu_north_5e7180: "North-west : Solomon"
  npc_override_yuno_yuno_menu_north_71af05: "North-east : Snotora"
  npc_override_yuno_yuno_menu_prontera_d014ac: "Prontera:Izlude:Geffen:Morocc:Payon:Alberta:Comodo:Cancel"
  npc_override_yuno_yuno_menu_south_8603cd: "South : Mineta."
  npc_override_yuno_yuno_monster_looks_like_flowe_40373b: "That monster looks like a flower blooming from the ground."
  npc_override_yuno_yuno_mumble_mumble_cc26eb: "*Mumble mumble...*"
  npc_override_yuno_yuno_my_name_sergiof_f8bcc5: "My name is Sergiof,"
  npc_override_yuno_yuno_name_android_used_guard_ec4a5a: "It is the name of an android that used to guard Juno long ago."
  npc_override_yuno_yuno_name_monster_originated_a7a890: "The name of this monster originated from a story about a poor geographer who, unfortunately, was eaten by this monster while he was immersed in his studies."
  npc_override_yuno_yuno_near_juno_there_exists_f_d59c46: "Near Juno, there exists a fallen angel named 'False Angel.' It feigns innocence, pretending to bless adventurers and then stabbing them in the back without any warning."
  npc_override_yuno_yuno_oh_hello_there_let_me_5c441d: "Oh, hello there. Let me introduce myself. I am an artisan who tries to succeed the rights and duties of item makers in Juno."
  npc_override_yuno_yuno_once_airship_39411e: "once the Airship is in"
  npc_override_yuno_yuno_one_blue_herb_which_make_c6350f: "One is a ^3355FFBlue Herb^000000 which will make you forget about reality and keep you in this virtual reality^000000."
  npc_override_yuno_yuno_open_your_eyes_stop_bein_1c9cf5: "Open your eyes! Stop being manipulated by virtual reality!"
  npc_override_yuno_yuno_operation_meantime_a75727: "operation. In the meantime,"
  npc_override_yuno_yuno_other_red_herb_which_rev_1c6b1a: "The other is a ^FF3355Red Herb^000000 which will reveal to you what is true and real."
  npc_override_yuno_yuno_please_check_amount_zeny_9389b6: "Please check the amount of zeny that you have."
  npc_override_yuno_yuno_power_said_come_relic_an_6c9be5: "This power is said to come from a relic from an ancient civilization called ^3355FFJuperos^000000 which existed here long before Juno."
  npc_override_yuno_yuno_progress_7155de: "progress."
  npc_override_yuno_yuno_research_revealed_juno_s_10ec8f: "Research revealed that Juno's power source based on ^3355FFPieces of Ymir's Heart^000000. I hear that this power source is found where Juperos used to exist."
  npc_override_yuno_yuno_rice_cake_yes_s_traditio_e58608: "^3355FFRice Cake^000000! Yes, it's a traditional food that's favored by a lot of people. There's a lot of nostalgic memories of old fashioned markets that are connected to the Rice Cake."
  npc_override_yuno_yuno_rumored_realm_dead_bring_0b2b26: "It is rumored to be from the realm of the dead. It brings many undead monsters with it, intending to lead living creatures to its cold and icy realm."
  npc_override_yuno_yuno_s_hard_believe_2c3af1: "It's hard to believe"
  npc_override_yuno_yuno_s_long_narrow_shield_ang_90efd9: "It's a long and narrow shield with an angel wing engraved in the center of the front side. Against Devil and Undead monsters, it is especially powerful."
  npc_override_yuno_yuno_see_you_cbb095: "See you ~"
  npc_override_yuno_yuno_seems_you_use_item_when_e43d97: "It seems you can use that item when you chant a high-level magic spell."
  npc_override_yuno_yuno_seen_large_jellopy_5e493b: "seen a Large Jellopy?"
  npc_override_yuno_yuno_serves_granny_5f0ba6: "serves Granny."
  npc_override_yuno_yuno_shining_jellopy_even_exi_ebc062: "shining jellopy even exists!"
  npc_override_yuno_yuno_since_many_scholars_been_4cd979: "Since many scholars have been coming to Juno to study and research this power source, our city is basically a well known mecca for scholars."
  npc_override_yuno_yuno_so_you_enjoy_candy_3e3305: "So, do you enjoy candy?"
  npc_override_yuno_yuno_strangely_extend_its_bod_ca326e: "Strangely, it can extend its body a long distance. Even if you're far away from it, it can still pose a threat."
