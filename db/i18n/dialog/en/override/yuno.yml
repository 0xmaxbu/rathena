  npc_override_yuno_yuno_you_ve_already_chosen_do_5e7ff6: "You've already chosen. It doesn't matter whether or not you get this candy. That doesn't matter at all. You have to understand why it's happened."
  npc_override_yuno_yuno_you_very_lucky_me_tell_96981c: "You are very lucky to have me tell you this story. This only happens by ^FF33551 out of a 1,000 chance^000000."
