  npc_override_yuno_yuno_you_ever_heard_egyptian_6e0f16: "Have you ever heard of an Egyptian king who was once believed to be a son of a god? His name is ^3355FFPharoah^000000."
  npc_override_yuno_yuno_you_heard_boss_monster_b_e8cb2b: "Have you heard of a boss monster that has been around Juno for a long time? It's known only as the ^FF3355Lord of the Dead^000000."
