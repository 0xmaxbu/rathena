  npc_override_yuno_yuno_whichever_one_you_choose_e6497b: "Whichever one you choose, you must spend ^3355FF5,000 zeny^000000. Now, please select one."
  npc_override_yuno_yuno_world_you_experiencing_a_186047: "This world you are experiencing is actually fabricated! It's time for you to see reality for what it is!"
  npc_override_yuno_yuno_yes_s_right_now_you_9ece5a: "Yes, that's right. Now you must ask yourself why you didn't accept the candy I offered."
