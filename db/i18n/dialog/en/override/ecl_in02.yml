Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_ecl_in02_eclage_clinic_been_set_as_your_59821b: "Clinic has been set as your save point. Be careful though~"
  npc_override_ecl_in02_eclage_looks_like_you_don_t_75d0dd: "Looks like you don't have enough resources to proceed. Do you mind checking your account again?"
  npc_override_ecl_in02_eclage_make_yourself_home_90fe12: "Make yourself at home~"
  npc_override_ecl_in02_eclage_menu_pay_941b01: "Pay with Splendide Coin:Pay with Zeny:Forget it"
  npc_override_ecl_in02_eclage_menu_save_7c0b70: "Save Location:Rest:Finish the conversation"
  npc_override_ecl_in02_eclage_msg_93fcbf: "......"
  npc_override_ecl_in02_eclage_north_prison_2e8838: "[North] Prison"
  npc_override_ecl_in02_eclage_ooww_0971d2: "Ooww..."
  npc_override_ecl_in02_eclage_other_words_you_injured_1205ad: "In other words, you injured your wing. The arrow went through the most critical part in the wing."
  npc_override_ecl_in02_eclage_path_take_you_lower_part_a22411: "This path will take you to the lower parts of Eclage. You'll find a prison and a clinic there."
  npc_override_ecl_in02_eclage_restore_your_mind_body_o_a4d67a: "Restore your mind and body at our clinic. It's filled with Eclage's clean energy."
  npc_override_ecl_in02_eclage_seems_like_you_don_t_cc221b: "It seems like you don't have enough coins. Would you check your account again, please?"
  npc_override_ecl_in02_eclage_umm_arrow_damaged_your_w_7456fb: "Umm...the arrow damaged your wing pretty badly..."
  npc_override_ecl_in02_eclage_we_charge_splendide_coin_cb46ee: "We charge 1 Splendide Coin normally, but we offer a special discount for travelers. Your total is 5,000 zeny. "
  npc_override_ecl_in02_eclage_we_stopped_bleeding_cast_aab2ab: "We stopped the bleeding and cast emergency spells."
  npc_override_ecl_in02_eclage_welcome_eclage_clinic_68dcf4: "Welcome to Eclage Clinic."
  npc_override_ecl_in02_eclage_well_i_going_tell_you_a1a2e8: "Well...I was going to tell you after you recover, but you should know. You can't decorate the Yai anymore. "
  npc_override_ecl_in02_eclage_west_clinic_0b01b8: "[West] Clinic"
  npc_override_ecl_in02_eclage_what_no_i_i_don_b6125f: "What, no, I...I don't feel anything...what's going on?"
  npc_override_ecl_in02_eclage_what_no_way_please_docto_8577f5: "What? No way...please...doctor!! No!!"
  npc_override_ecl_in02_eclage_what_you_mean_82db02: "...what do you mean?"
  npc_override_ecl_in02_eclage_where_am_i_d5161a: "Where...am...I?"
  npc_override_ecl_in02_eclage_you_bleeding_lot_close_y_a499a8: "You were bleeding a lot. That was close, you know."
  npc_override_ecl_in02_eclage_you_re_clinic_don_t_cc7ddd: "You're at a clinic. Don't worry."
