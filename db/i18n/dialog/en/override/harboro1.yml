  npc_override_harboro1_quests_rockridge_yes_those_clumps_gas_the_5111d7: "Yes, those clumps of gas. They make me sneeze something fierce,"
  npc_override_harboro1_quests_rockridge_yes_usually_s_closed_onl_12be30: "Yes. Usually it's closed, and only those who have business in the basement can use it,"
  npc_override_harboro1_quests_rockridge_yes_we_people_supposed_t_9290ef: "Yes, we can. People are supposed to trust each other. You didn't know that, did you? Now that he's here, he's one of us now. And I told you, everyone's born good."
