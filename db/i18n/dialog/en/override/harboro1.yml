  npc_override_harboro1_quests_rockridge_you_calm_down_we_re_84adfb: "You calm down. We're losing money every hour just by sitting around."
  npc_override_harboro1_quests_rockridge_you_came_all_way_here_a57382: "You came all the way here to tell me this. Why?"
  npc_override_harboro1_quests_rockridge_you_came_back_hunting_i_8a5674: "You came back from hunting. I'm not burdening you with this, am I?"
  npc_override_harboro1_quests_rockridge_you_came_back_quickly_ah_1dfc2e: "You came back quickly. Ah, I miss being young."
