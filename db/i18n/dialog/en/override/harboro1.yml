  npc_override_harboro1_quests_rockridge_grandpa_said_we_shouldn_e28ea4: "Grandpa said we shouldn't follow strangers, or they'd pluck all our thorns. What if he was telling me the truth?"
  npc_override_harboro1_quests_rockridge_groan_alright_then_i_d_2768a9: "*Groan* Alright, then I'd better look for someone else."
  npc_override_harboro1_quests_rockridge_groan_what_i_b17bfe: "*Groan* What do I do?"
  npc_override_harboro1_quests_rockridge_groundwater_keeps_wellin_b305c9: "Groundwater keeps welling up"
  npc_override_harboro1_quests_rockridge_grr_i_t_believe_you_2629ee: "Grr, I can't believe you! You're getting only half your dinner tonight!"
  npc_override_harboro1_quests_rockridge_grr_if_i_get_out_7dd5a0: "Grr, if I get out of here..."
  npc_override_harboro1_quests_rockridge_grr_you_re_jerk_i_3246f8: "Grr, you're a jerk. I don't have time for this. Get out of here!"
  npc_override_harboro1_quests_rockridge_grr_you_senile_coot_41c2a6: "Grr, you senile coot!"
  npc_override_harboro1_quests_rockridge_hah_hah_hah_497a2c: "Hah hah hah!"
  npc_override_harboro1_quests_rockridge_hah_hah_hah_doesn_t_bcd86c: "Hah hah hah! That doesn't make sense. You're tall and have a mustache. Babies don't have mustaches."
  npc_override_harboro1_quests_rockridge_hah_hah_i_my_daughter_8e125c: "Hah, hah! I can do this for my daughter!"
  npc_override_harboro1_quests_rockridge_hah_hah_i_see_957df6: "Hah hah, I see."
  npc_override_harboro1_quests_rockridge_hah_hah_s_boring_job_12013c: "Hah hah, it's a boring job, sure."
  npc_override_harboro1_quests_rockridge_hah_hah_thank_you_your_6cabd9: "Hah hah, thank you for your interest, but we're not desperate enough to need help from little kids like you."
  npc_override_harboro1_quests_rockridge_hah_i_don_t_want_a663dd: "Hah! I don't want to do this to Wyatt, but I'm just going to leave Rock Ridge on the next ship."
  npc_override_harboro1_quests_rockridge_hang_there_2dc21b: "Hang in there!"
  npc_override_harboro1_quests_rockridge_having_sacrifice_d0c000: "having to sacrifice"
  npc_override_harboro1_quests_rockridge_having_something_blessin_19e489: "Having something to do is a blessing."
  npc_override_harboro1_quests_rockridge_he_could_just_tell_us_2f5eb3: "He could just tell us where the ores are, and walk out of here free."
  npc_override_harboro1_quests_rockridge_he_couldn_t_gone_too_07e67e: "But he couldn't have gone too far because he came back to me pretty quickly. Why don't you walk along the fence and look for holes with white hair floating around them?"
  npc_override_harboro1_quests_rockridge_he_d_better_e7f4e6: "He'd better."
  npc_override_harboro1_quests_rockridge_he_d_probably_say_someth_12e963: "He'd probably say something stupid, like ^4d4dffpaying them a million Zeny or so for the ores^000000."
  npc_override_harboro1_quests_rockridge_he_doesn_t_carry_as_6447d9: "He doesn't carry as wide a selection of products as his father, but he has an assortment of well-chosen models."
  npc_override_harboro1_quests_rockridge_he_doesn_t_seem_venture_575d45: "And he doesn't seem to venture out too far. It's probably because he's still young. I've marked three possible locations in the middle of your map. You don't have to look further than those locations."
  npc_override_harboro1_quests_rockridge_he_doesn_t_want_let_8b6275: "He doesn't want to let go of a criminal in exchange for a pile of ores."
  npc_override_harboro1_quests_rockridge_he_even_offered_us_tell_d8255f: "He even offered us to tell us where the ores are in exchange for his freedom."
  npc_override_harboro1_quests_rockridge_he_gave_up_location_beca_babf76: "He gave up the location because he thought you were dead."
  npc_override_harboro1_quests_rockridge_he_got_off_ship_mainland_dccff6: "He got off a ship from the mainland in that heavy mining gear, and then one look at that rock, he turned into a pickax-swinging maniac."
  npc_override_harboro1_quests_rockridge_he_least_made_inmate_dep_3b4c6e: "Has he at least made an inmate deposit for you?"
  npc_override_harboro1_quests_rockridge_he_ll_let_you_5b90e8: "He'll let you"
  npc_override_harboro1_quests_rockridge_he_looks_more_like_coyot_2e86ca: "- He looks more like a coyote than a dog. -"
  npc_override_harboro1_quests_rockridge_he_may_come_buildings_i_2500c3: "He may not come to buildings, but I want to go sit in one."
  npc_override_harboro1_quests_rockridge_he_must_waiting_johnny_s_5e111f: "He must be waiting for Johnny's execution, so he could become the leader of his gang."
  npc_override_harboro1_quests_rockridge_he_passed_you_note_e5a1a8: "Has he passed you a note?"
  npc_override_harboro1_quests_rockridge_he_probably_hasn_t_heard_9d87ea: "He probably hasn't heard."
  npc_override_harboro1_quests_rockridge_he_probably_thought_albe_86f101: "He probably thought Albert betrayed him."
  npc_override_harboro1_quests_rockridge_he_s_asleep_covered_dirt_51ea16: "- He's asleep, covered in dirt as if he rolled around in it. I shouldn't wake him up. -"
  npc_override_harboro1_quests_rockridge_he_s_been_following_me_8e21d1: "He's been following me around since then."
  npc_override_harboro1_quests_rockridge_he_s_full_mining_gear_bf89ac: "He's in full mining gear, but he can't tell a normal rock from a mineral vein. How stupid is that?"
  npc_override_harboro1_quests_rockridge_he_s_happy_why_you_1e2fda: "He's happy. Why are you sighing?"
  npc_override_harboro1_quests_rockridge_he_s_helping_us_catch_acf92b: "He's helping us catch Albert."
  npc_override_harboro1_quests_rockridge_he_s_here_only_because_9725a2: "He's here only because HQ is keeping him here."
  npc_override_harboro1_quests_rockridge_he_s_here_see_when_8a111c: "He's here to see when you'd finally be hanged."
  npc_override_harboro1_quests_rockridge_he_s_shedding_lot_hair_be3136: "- He's shedding a lot of hair. He must be leaving white hair all over the place wherever he goes. -"
  npc_override_harboro1_quests_rockridge_he_s_stupid_even_he_791201: "He's stupid, but even he'd know what that means."
  npc_override_harboro1_quests_rockridge_he_s_turning_everyone_el_83ee79: "and that he's turning everyone else against him to become their leader."
  npc_override_harboro1_quests_rockridge_he_s_useless_as_hostage_d389dc: "He's useless as a hostage."
  npc_override_harboro1_quests_rockridge_he_said_he_d_sell_1e2f56: "He said he'd sell the ores to us for a million Zeny."
  npc_override_harboro1_quests_rockridge_he_said_he_something_imp_1e97e0: "He said he has something important to tell you."
  npc_override_harboro1_quests_rockridge_he_still_hasn_t_told_8f8dd8: "He still hasn't told us where the stolen ores are."
  npc_override_harboro1_quests_rockridge_he_t_even_trust_his_788070: "he can't even trust his own people, can he?"
  npc_override_harboro1_quests_rockridge_he_thinks_you_ve_betraye_ab3321: "He thinks you've betrayed him since? You know? You ran without him."
  npc_override_harboro1_quests_rockridge_he_told_us_where_ores_7b8e01: "He told us where the ores were, yes, but we haven't held up our end of the bargain yet."
  npc_override_harboro1_quests_rockridge_he_wants_johnny_hanged_a_9ce35c: "He wants Johnny to be hanged for all the world to see."
  npc_override_harboro1_quests_rockridge_he_wants_solve_everythin_ca969f: "He wants to solve everything with money? Other people's money."
  npc_override_harboro1_quests_rockridge_he_way_place_changed_lot_fd99f6: "Does he? By the way, this place has changed a lot."
  npc_override_harboro1_quests_rockridge_hear_our_office_severely_d77919: "Hear that? Our office is severely understaffed."
  npc_override_harboro1_quests_rockridge_hell_they_re_reason_vill_1a7a5d: "Hell, they're the reason this village exists."
  npc_override_harboro1_quests_rockridge_hello_9b56d5: "Hello."
  npc_override_harboro1_quests_rockridge_hello_there_problem_b7f9d5: "Hello. Is there a problem?"
  npc_override_harboro1_quests_rockridge_hello_up_coming_adventur_befd88: "Hello, up-and-coming adventurer!"
  npc_override_harboro1_quests_rockridge_hello_you_new_place_you_096ca1: "Hello. Are you new to this place? You should be ^FF0000at least Level 100^000000 to stay here comfortably?"
  npc_override_harboro1_quests_rockridge_help_a92107: "Help."
  npc_override_harboro1_quests_rockridge_help_him_5f1f0d: "Help him."
  npc_override_harboro1_quests_rockridge_help_me_again_e6a266: "help me again?"
  npc_override_harboro1_quests_rockridge_help_your_village_get_se_a8afd9: "help your village get settled first."
  npc_override_harboro1_quests_rockridge_her_gifts_d2fbdf: "for her gifts,"
  npc_override_harboro1_quests_rockridge_here_pick_one_you_like_675077: "Here, pick one you like."
  npc_override_harboro1_quests_rockridge_here_s_rock_ridge_coin_3914ff: "Here's the Rock Ridge Coin we promised. Thank you for searching the wasteland for us."
  npc_override_harboro1_quests_rockridge_here_take_238729: "Here, take it."
  npc_override_harboro1_quests_rockridge_here_you_ve_earned_a063e0: "Here, you've earned it."
  npc_override_harboro1_quests_rockridge_hey_buddy_you_look_prett_3f285c: "Hey, buddy. You look pretty strong. You're here to work, right?"
  npc_override_harboro1_quests_rockridge_hey_come_i_m_finished_dfc085: "Hey, come on! I'm not finished!"
  npc_override_harboro1_quests_rockridge_hey_did_you_just_get_9f7b57: "Hey, did you just get released? So are we! In fact, we've met there. I've met most of my best friends while we were in the system."
  npc_override_harboro1_quests_rockridge_hey_don_t_you_see_ab7b2a: "Hey, don't you see the line over there? I don't care who you are? go stand in line if you want to eat."
  npc_override_harboro1_quests_rockridge_hey_hey_cb8cdd: "Hey, hey!"
  npc_override_harboro1_quests_rockridge_hey_jamie_how_many_more_455696: "Hey, Jamie! How many more workers did you say we need in the culvert?"
  npc_override_harboro1_quests_rockridge_hey_kid_asking_you_quest_cda4ff: "Hey, a kid is asking you a question. He looks so curious that I'm worried he might die if you don't tell him."
  npc_override_harboro1_quests_rockridge_hey_kiddo_how_d_you_e7cd4f: "Hey, kiddo. How'd you like to join us in business?"
  npc_override_harboro1_quests_rockridge_hey_kiddo_s_very_nice_ae2b1d: "Hey, kiddo! It's very nice to see you again. The bomb I made with the materials you brought is in the aging process. Did you know wine and bombs get better the older they are?"
  npc_override_harboro1_quests_rockridge_hey_kiddo_you_mind_helpi_768d69: "Hey kiddo, do you mind helping me again tomorrow? I need more than one bomb to throw a firework party."
  npc_override_harboro1_quests_rockridge_hey_look_c536ee: "Hey look,"
  npc_override_harboro1_quests_rockridge_hey_we_re_hiring_6323df: "Hey, we're not hiring."
  npc_override_harboro1_quests_rockridge_hey_welcome_back_75cd33: "Hey, welcome back."
  npc_override_harboro1_quests_rockridge_hey_why_t_you_give_29c20e: "Hey, why can't you give me a loan?"
  npc_override_harboro1_quests_rockridge_hey_you_crazy_3a0461: "Hey, are you crazy?!"
  npc_override_harboro1_quests_rockridge_hiccups_cheers_nya_nya_f1a77a: "*Hiccups* Cheers! Nya-nya!"
  npc_override_harboro1_quests_rockridge_hiccups_i_drink_beer_all_31f2a4: "*Hiccups* I can drink beer all day long!"
  npc_override_harboro1_quests_rockridge_hiccups_they_robbed_me_c_721346: "*Hiccups* They robbed me clean. I don't even have enough money left to have a glass of Kahluna Milk."
  npc_override_harboro1_quests_rockridge_his_spy_outside_window_e_ad73ba: "His spy outside the window even pointed his fingers like guns at me!"
  npc_override_harboro1_quests_rockridge_hm_i_don_t_think_b9704c: "Hm, I don't think you have enough money to pay the fare."
  npc_override_harboro1_quests_rockridge_hm_i_meant_as_joke_3c20d5: "Hm, I meant that as a joke, but maybe she really is scared."
  npc_override_harboro1_quests_rockridge_hm_i_understand_4f6188: "Hm... I understand."
  npc_override_harboro1_quests_rockridge_hm_you_don_t_cb4b2f: "Hm, you don't have"
  npc_override_harboro1_quests_rockridge_hm_you_ve_brought_7cf3b7: "Hm, you've brought"
  npc_override_harboro1_quests_rockridge_hmm_isn_t_bad_idea_212748: "Hmm, this isn't a bad idea."
  npc_override_harboro1_quests_rockridge_hmpf_40a0b0: "Hmpf."
  npc_override_harboro1_quests_rockridge_hmpf_we_may_lost_battle_c42527: "Hmpf, we may have lost this battle with you,"
  npc_override_harboro1_quests_rockridge_hmpf_why_you_so_heartles_414adb: "Hmpf, why are you so heartless?"
  npc_override_harboro1_quests_rockridge_hmpf_you_re_working_hard_c6b046: "Hmpf, you're not working hard enough. Tsk, tsk."
  npc_override_harboro1_quests_rockridge_ho_ho_ho_there_s_dae39c: "Ho ho ho, there's not a single fishing net in the village that hasn't been handled by me."
  npc_override_harboro1_quests_rockridge_hold_rail_if_you_don_ca6fce: "Hold on to the rail if you don't want to get swept away by the waves!"
  npc_override_harboro1_quests_rockridge_honey_did_spotty_take_my_ec9538: "Honey! Did Spotty take my watch?"
  npc_override_harboro1_quests_rockridge_honey_you_even_listening_c61878: "HONEY! Are you even listening to me?!"
  npc_override_harboro1_quests_rockridge_honey_you_should_least_f_b1496a: "Honey, you should at least follow the adventurer to the gates, so you could tell him where to look."
  npc_override_harboro1_quests_rockridge_house_sank_little_little_1269e2: "This house sank little by little, until the ground couldn't hold its weight anymore."
  npc_override_harboro1_quests_rockridge_houses_closer_beach_alwa_ee75d8: "The houses closer to the beach have always been prone to sinking, long before the first level was buried."
  npc_override_harboro1_quests_rockridge_how_about_i_show_you_ee6f96: "How about I show you the list of things you could do for us? If you're interested, come back later. I promise I'll pay you generously."
  npc_override_harboro1_quests_rockridge_how_did_go_560715: "How did it go?"
  npc_override_harboro1_quests_rockridge_how_did_negotiation_go_9b480d: "How did the negotiation go?"
  npc_override_harboro1_quests_rockridge_how_did_you_know_passwor_3ff04d: "How did you know the password only the Boss and I know?"
  npc_override_harboro1_quests_rockridge_how_exorbitant_4a23fb: "How exorbitant!"
  npc_override_harboro1_quests_rockridge_how_getting_rid_sea_anem_e95fae: "How was it, getting rid of sea anemones?"
  npc_override_harboro1_quests_rockridge_how_i_get_mine_e50ea4: "How can I get to the mine?"
  npc_override_harboro1_quests_rockridge_how_i_help_a40ffb: "- How can I help?"
  npc_override_harboro1_quests_rockridge_how_long_we_wait_around_c22267: "How long do we have to wait around?"
  npc_override_harboro1_quests_rockridge_how_many_gasters_did_you_acfb8b: "How many Gasters did you hunt?"
  npc_override_harboro1_quests_rockridge_how_many_times_i_tell_469e4f: "How many times do I have to tell you to keep your dog away from our things? Do you really want me to send it away on a ship?"
  npc_override_harboro1_quests_rockridge_how_s_albert_01d522: "How's Albert?"
  npc_override_harboro1_quests_rockridge_how_s_going_8e2ed1: "How's it going?"
  npc_override_harboro1_quests_rockridge_how_tomorrow_sound_day_a_0028c0: "How does tomorrow sound? Or the day after tomorrow?"
  npc_override_harboro1_quests_rockridge_hq_decided_dccdb8: "HQ has decided"
  npc_override_harboro1_quests_rockridge_huh_no_4e21e5: "Huh? No."
  npc_override_harboro1_quests_rockridge_huh_sure_no_problem_1d110d: "Huh? Sure, no problem."
  npc_override_harboro1_quests_rockridge_huh_yes_way_i_guess_1529db: "Huh? Yes, in a way, I guess."
  npc_override_harboro1_quests_rockridge_huh_you_want_help_us_eaf7bd: "Huh? You want to help us. Thank you, but no, thanks. We can't pay you."
  npc_override_harboro1_quests_rockridge_hunt_gasters_before_i_ge_865a5f: "Hunt ^FF000020 Gasters^000000 before I get in there."
  npc_override_harboro1_quests_rockridge_hunt_just_gasters_there_3e5224: "Hunt just 15 Gasters. There's no rush. You can take your time. Just come back before the end of the day today. I want to see you again."
  npc_override_harboro1_quests_rockridge_hurting_nature_should_ne_466463: "Hurting nature should never be a game. These adventurers only hunt enough coyotes to keep us safe from them."
  npc_override_harboro1_quests_rockridge_i_583fdb: "Was I?"
  npc_override_harboro1_quests_rockridge_i_a5260d: "I have {0}"
  npc_override_harboro1_quests_rockridge_i_agree_our_heart_our_bd03a0: "I agree that our heart is our chapel."
  npc_override_harboro1_quests_rockridge_i_already_know_what_he_8ccda9: "I already know what he's going to say, but he's the mayor; at least he needs to know what's going on."
  npc_override_harboro1_quests_rockridge_i_another_lock_your_mane_debd81: "Can I have another lock of your mane?"
  npc_override_harboro1_quests_rockridge_i_applaud_you_your_brave_4e86e8: "I applaud you for your bravery and wisdom."
  npc_override_harboro1_quests_rockridge_i_asked_52bc07: "I asked."
  npc_override_harboro1_quests_rockridge_i_asked_yes_no_oh_741782: "I asked yes or no. Oh well, I'll take that as a yes."
  npc_override_harboro1_quests_rockridge_i_asked_you_hunt_coyotes_6bc17f: "I asked you to hunt 30 Coyotes. How many did you hunt?"
  npc_override_harboro1_quests_rockridge_i_assume_you_came_all_6303cf: "I assume you came all the way here from the mainland for a reason."
  npc_override_harboro1_quests_rockridge_i_barely_understand_his_059999: "(I can barely understand his English.)"
  npc_override_harboro1_quests_rockridge_i_believe_one_small_chan_19f695: "But I believe one small change a day can eventually make a huge difference."
  npc_override_harboro1_quests_rockridge_i_believe_universe_broug_b04048: "I believe the universe has brought you to us as an act of Providence. Do you mind if I ask you one more favor?"
  npc_override_harboro1_quests_rockridge_i_came_here_because_i_7e437d: "I came here because I heard I could become rich quickly, nya."
  npc_override_harboro1_quests_rockridge_i_came_here_first_invite_2972e4: "I came here first and invited her over here."
  npc_override_harboro1_quests_rockridge_i_came_negotiate_you_7f5396: "I came to negotiate with you."
  npc_override_harboro1_quests_rockridge_i_came_tell_you_a6d293: "I came to tell you this."
  npc_override_harboro1_quests_rockridge_i_came_tell_you_what_192f87: "I came to tell you what HQ has decided."
  npc_override_harboro1_quests_rockridge_i_come_here_when_i_be3948: "Is it? I come here when I miss the old days, but it's too dark. By the way, why has it become so wet?"
  npc_override_harboro1_quests_rockridge_i_cook_pumpkin_stew_i_e5f46c: "I have to cook a pumpkin stew, but I don't have pumpkins. This is the equivalent of making toast without bread."
  npc_override_harboro1_quests_rockridge_i_could_always_use_help_18a207: "I could always use help getting rid of sea anemones."
  npc_override_harboro1_quests_rockridge_i_d417f8: "But I will"
  npc_override_harboro1_quests_rockridge_i_d_better_get_involved_fc7e49: "(I'd better not get involved. I'm tired of taking care of other people's mess.)"
  npc_override_harboro1_quests_rockridge_i_d_better_get_rid_2aa5be: "I'd better get rid of Buffalo Bandits, enough to scare Albert Ford."
  npc_override_harboro1_quests_rockridge_i_d_better_lighten_my_105d81: "- I'd better lighten my bag and talk to him again. -"
  npc_override_harboro1_quests_rockridge_i_d_better_train_our_8e2e34: "I'd better train our vigilantes harder."
  npc_override_harboro1_quests_rockridge_i_d_hate_go_back_ad26ec: "I'd hate to go back home empty-handed again."
  npc_override_harboro1_quests_rockridge_i_d_like_thank_you_b791db: "I'd like to thank you on behalf of Rock Ridge and my company."
  npc_override_harboro1_quests_rockridge_i_d_like_you_3aa532: "I'd like you to"
  npc_override_harboro1_quests_rockridge_i_didn_t_know_there_eff902: "I didn't know there was no grass here."
  npc_override_harboro1_quests_rockridge_i_don_t_box_ores_4e8789: "I don't have a box of ores to show to Albert Ford."
  npc_override_harboro1_quests_rockridge_i_don_t_care_how_95a92a: "I don't care how you do it, as long as you do it."
  npc_override_harboro1_quests_rockridge_i_don_t_care_if_d5b863: "I don't care. If I can't work tomorrow, then I'll walk out of here!"
  npc_override_harboro1_quests_rockridge_i_don_t_enough_brown_a9273a: "(I don't have enough Brown Mufflers and Bandit's Scarves to threaten Albert Ford with.)"
  npc_override_harboro1_quests_rockridge_i_don_t_feel_good_33e3ab: "I don't feel good about"
  npc_override_harboro1_quests_rockridge_i_don_t_know_i_6dff45: "I don't know, but I'm tired of twiddling my thumbs. This can't be the end of our journey!"
  npc_override_harboro1_quests_rockridge_i_don_t_know_i_ecf95e: "I don't know, and I don't care!"
  npc_override_harboro1_quests_rockridge_i_don_t_know_much_c2252b: "I don't know much, except that the city needs help from capable adventurers."
  npc_override_harboro1_quests_rockridge_i_don_t_know_what_ffc662: "I don't know what they'd demand in exchange for the ores,"
  npc_override_harboro1_quests_rockridge_i_don_t_like_waiting_a3ead5: "I don't like waiting."
  npc_override_harboro1_quests_rockridge_i_don_t_need_5ea6ec: "and I don't need it."
  npc_override_harboro1_quests_rockridge_i_don_t_need_more_51b37c: "I don't need more ores."
  npc_override_harboro1_quests_rockridge_i_don_t_need_so_9f3504: "but I don't need so many."
  npc_override_harboro1_quests_rockridge_i_don_t_search_farther_5dfd1e: "- I don't have to search farther than this. -"
  npc_override_harboro1_quests_rockridge_i_don_t_think_bandits_4273f7: "And I don't think the bandits know about it."
  npc_override_harboro1_quests_rockridge_i_don_t_use_right_9a4b6e: "I don't have to use this right now."
  npc_override_harboro1_quests_rockridge_i_don_t_want_impose_a048ae: "I don't want to impose on your kindness, but could you hunt ^0000CD30^000000 ^0000CDCoyotes^000000?"
  npc_override_harboro1_quests_rockridge_i_don_t_want_talk_5e80bb: "I don't want to talk about it. I made so many stupid mistakes, which wasn't like me at all. That's why we were hiding out in this dark, dank place."
  npc_override_harboro1_quests_rockridge_i_doubt_you_could_find_70d37b: "I doubt you could find all 7 packs. At least a couple of them must be torn and spilled by now."
  npc_override_harboro1_quests_rockridge_i_e38e9f: "I do."
  npc_override_harboro1_quests_rockridge_i_fbf810: "I can do that."
  npc_override_harboro1_quests_rockridge_i_feel_as_if_i_b6a5ea: "I feel as if I should help them make a snowman."
  npc_override_harboro1_quests_rockridge_i_feel_happy_just_lookin_b0f1f9: "I feel happy just by looking at the train station. It's the symbol of our village, you know."
  npc_override_harboro1_quests_rockridge_i_fought_tooth_nail_prot_75c2fc: "I fought tooth and nail to protect my groceries. I managed to save most of my stuff except the agave drink mix that my son loves."
  npc_override_harboro1_quests_rockridge_i_go_5f240e: "I can go."
  npc_override_harboro1_quests_rockridge_i_going_tell_you_about_5e7cc8: "I was going to tell you about a new continent, but if you don't want to know, that's fine by me."
  npc_override_harboro1_quests_rockridge_i_got_ship_rock_ridge_96ab89: "I got on a ship to Rock Ridge as soon as I got off the ship from Pa-sta."
  npc_override_harboro1_quests_rockridge_i_guess_i_ll_stay_c25a08: "I guess I'll have to stay at the dock for a little longer."
  npc_override_harboro1_quests_rockridge_i_had_my_favorite_bean_3da0d6: "I had my favorite bean dish for breakfast today. I can't lose it. I want it to become part of me."
  npc_override_harboro1_quests_rockridge_i_had_so_much_fun_39db19: "I had so much fun as a child, but my child never got to experience any of that. Nowadays, everyone's just too busy to gather or stay up all night, singing and dancing."
  npc_override_harboro1_quests_rockridge_i_haven_t_been_able_fa42e0: "I haven't been able to feed my child well. I can't remember the last time he had a decent meal."
  npc_override_harboro1_quests_rockridge_i_help_ad8459: "I can help."
  npc_override_harboro1_quests_rockridge_i_hid_entrance_just_case_bdc3fe: "I hid the entrance, just in case."
  npc_override_harboro1_quests_rockridge_i_hope_i_understand_him_8d6840: "I hope I can understand him better when I grow as tall as he."
  npc_override_harboro1_quests_rockridge_i_hope_my_opinion_helpfu_8538d9: "I hope my opinion will be helpful to you!"
  npc_override_harboro1_quests_rockridge_i_hope_things_village_se_6f683d: "I hope things in the village will settle soon, starting with this line."
  npc_override_harboro1_quests_rockridge_i_hope_you_ll_enjoy_8f0f4d: "I hope you'll enjoy exploring this wonderful place."
  npc_override_harboro1_quests_rockridge_i_hope_you_ll_find_25e756: "I hope you'll find your opportunity in this land of dreams."
  npc_override_harboro1_quests_rockridge_i_hope_you_ll_lose_a1f63d: "I hope you'll not lose it this time."
  npc_override_harboro1_quests_rockridge_i_hope_you_ll_make_780775: "I hope you'll make the right decision."
  npc_override_harboro1_quests_rockridge_i_i_ll_counting_you_2c8493: "I-I'll be counting on you, Adventurer."
  npc_override_harboro1_quests_rockridge_i_i_love_working_loading_433eab: "I-I love working at this loading dock. It's the best job I've ever had!"
  npc_override_harboro1_quests_rockridge_i_i_m_captain_adventurer_2af605: "I-I'm Captain Adventurer! I'm going to hunt a hundred-hundred-hundred-hundred coyotes!"
  npc_override_harboro1_quests_rockridge_i_imagine_how_buffaloes_28de03: "I can imagine how the buffaloes would react."
  npc_override_harboro1_quests_rockridge_i_joking_f37c78: "I was joking."
  npc_override_harboro1_quests_rockridge_i_knew_d_you_instead_801bdc: "I knew it'd be you instead of him."
  npc_override_harboro1_quests_rockridge_i_knocked_signaling_rock_06afb2: "I knocked on the signaling rock, and Albert Ford came out running."
  npc_override_harboro1_quests_rockridge_i_know_about_buffalo_ban_152583: "I know about the Buffalo Bandits."
  npc_override_harboro1_quests_rockridge_i_know_costello_still_yo_336de8: "I know Costello is still your mayor because I checked!"
  npc_override_harboro1_quests_rockridge_i_know_fact_no_one_4c6402: "And I know for a fact that no one offers help for free anymore."
  npc_override_harboro1_quests_rockridge_i_know_litis_i_m_17970b: "I know, Litis. I'm just being a stubborn old mule."
  npc_override_harboro1_quests_rockridge_i_know_you_mean_well_a8b120: "I know you mean well,"
  npc_override_harboro1_quests_rockridge_i_like_being_new_places_7ac7b1: "I like being in new places and talking to the residents. I can learn many things from the way they live."
  npc_override_harboro1_quests_rockridge_i_liked_food_too_i_4044f2: "I liked the food, too. I hated beans until I went to jail. All the beans I've eaten aren't half as good as those I ate in there."
  npc_override_harboro1_quests_rockridge_i_ll_alright_we_all_c6098f: "I'll be alright. We all look alike? They won't know I'm not one of them."
  npc_override_harboro1_quests_rockridge_i_ll_appreciate_if_you_378faa: "I'll appreciate if you can help me every day, starting from today."
  npc_override_harboro1_quests_rockridge_i_ll_check_pulley_we_c73c63: "I'll check the pulley that we need to use to go back up."
  npc_override_harboro1_quests_rockridge_i_ll_counting_you_a444e1: "I'll be counting on you!"
  npc_override_harboro1_quests_rockridge_i_ll_counting_you_strang_0e4a30: "I'll be counting on you, stranger."
  npc_override_harboro1_quests_rockridge_i_ll_give_shawn_c4be78: "I'll give it to Shawn."
  npc_override_harboro1_quests_rockridge_i_ll_give_you_special_c650c8: "I'll give you a special discount. This feather accessory here is just two million Zeny. This handkerchief here is - oh, wow! - just five million!"
  npc_override_harboro1_quests_rockridge_i_ll_go_while_everyone_8a5c5a: "I'll go while everyone's in bed."
  npc_override_harboro1_quests_rockridge_i_ll_here_somewhere_case_217f7f: "I'll be here somewhere in case you need me."
  npc_override_harboro1_quests_rockridge_i_ll_let_sheriff_warp_fbc74b: "I'll let Sheriff Warp take care of this."
  npc_override_harboro1_quests_rockridge_i_ll_let_you_come_bc8c4b: "I'll let you come and go, if you promise me not to tell anyone above the ground about us. Promise?"
  npc_override_harboro1_quests_rockridge_i_ll_let_you_handle_1f83e8: "I'll let you handle the negotiation with Albert."
  npc_override_harboro1_quests_rockridge_i_ll_meet_you_here_954267: "I'll meet you here again later."
  npc_override_harboro1_quests_rockridge_i_ll_move_rest_someplace_437bbd: "I'll move the rest someplace else."
  npc_override_harboro1_quests_rockridge_i_ll_pay_you_good_9ec31e: "I'll pay you good. You welcomes all the time."
  npc_override_harboro1_quests_rockridge_i_ll_really_appreciate_i_f663d9: "I'll really appreciate if you can help for a little longer. You inspire me to try harder to make a better life for my son."
  npc_override_harboro1_quests_rockridge_i_ll_repay_you_please_416aa5: "I'll repay you. Please?"
  npc_override_harboro1_quests_rockridge_i_ll_talk_costello_09e20a: "I'll talk to Costello."
  npc_override_harboro1_quests_rockridge_i_ll_tell_you_password_1fe56e: "I'll tell you the password you can use to call him out of hiding."
  npc_override_harboro1_quests_rockridge_i_ll_tell_you_where_0820ef: "I'll tell you where the ores are afterward."
  npc_override_harboro1_quests_rockridge_i_ll_tell_you_where_a8f3c1: "I'll tell you where the ores are"
  npc_override_harboro1_quests_rockridge_i_ll_use_every_ounce_c4fd44: "I'll use every ounce of energy in me to spread his teachings to the people of this new land!"
  npc_override_harboro1_quests_rockridge_i_ll_wait_here_828546: "I'll wait here."
  npc_override_harboro1_quests_rockridge_i_ll_waiting_bc318a: "I'll be waiting."
  npc_override_harboro1_quests_rockridge_i_love_agave_flavored_ju_5ed7de: "I love agave-flavored juice. I want to drink it every day."
  npc_override_harboro1_quests_rockridge_i_love_these_new_musical_8977f4: "I love these new musical instruments!"
  npc_override_harboro1_quests_rockridge_i_love_traveling_i_had_3b3295: "I love traveling. I had fun traveling in Pa-sta, and I'm determined to spend the rest of my life traveling in Rune-Midgarts and other cities and villages that I can reach from the kingdom."
  npc_override_harboro1_quests_rockridge_i_m_abraham_iven_hudin_c8ba74: "I'm Abraham Iven Hudin. I'm originally from different country."
  npc_override_harboro1_quests_rockridge_i_m_adventurer_i_m_91d2ca: "I'm an adventurer, and I'm here on her behalf."
  npc_override_harboro1_quests_rockridge_i_m_adventurer_i_wonderi_538e47: "I'm an adventurer. I was wondering if you needed help."
  npc_override_harboro1_quests_rockridge_i_m_as_resolved_complete_a3653a: "But I'm as resolved to complete my mission as I was the first day I arrived here."
  npc_override_harboro1_quests_rockridge_i_m_ashamed_6e6f73: "- and I'm ashamed of it."
  npc_override_harboro1_quests_rockridge_i_m_best_coyote_hunting_2ee835: "I'm the best coyote-hunting adventurer! I'm going to hunt a hundred coyotes!"
  npc_override_harboro1_quests_rockridge_i_m_busy_5300b0: "I'm busy."
  npc_override_harboro1_quests_rockridge_i_m_carrying_too_many_468846: "I'm carrying too many types of items. I should lighten my bag first."
  npc_override_harboro1_quests_rockridge_i_m_cautious_because_i_e313c6: "I'm cautious because I don't want the bandits to find out about this entrance."
  npc_override_harboro1_quests_rockridge_i_m_charge_case_ec08a9: "I'm in charge of this case."
  npc_override_harboro1_quests_rockridge_i_m_costello_mayor_rock_60ba91: "I'm Costello, mayor of Rock Ridge."
  npc_override_harboro1_quests_rockridge_i_m_crouched_horse_656773: "I'm Crouched Horse,"
  npc_override_harboro1_quests_rockridge_i_m_dock_personal_safety_9babca: "I'm at the dock for personal safety issues,"
  npc_override_harboro1_quests_rockridge_i_m_glad_i_too_d9c6c2: "I'm glad I was too scared to have it loaded. Spotty wouldn't have come back home if he smelled gunpowder."
  npc_override_harboro1_quests_rockridge_i_m_glad_you_came_e71803: "I'm glad you came here safely."
  npc_override_harboro1_quests_rockridge_i_m_going_back_home_17831b: "I'm not going back home until I become a millionaire!"
  npc_override_harboro1_quests_rockridge_i_m_going_let_my_cf9455: "I'm not going to let my physical exhaustion get in the way."
  npc_override_harboro1_quests_rockridge_i_m_going_talk_sheriff_4a2182: "I'm going to talk to Sheriff Warp about you."
  npc_override_harboro1_quests_rockridge_i_m_going_tell_costello_cad973: "I'm going to tell Costello to recruit more adventurers like you!"
  npc_override_harboro1_quests_rockridge_i_m_going_tell_you_bb0943: "But I'm not going to tell you the location of the ores until we get rid of him."
  npc_override_harboro1_quests_rockridge_i_m_guessing_albert_ford_4e1f7b: "I'm guessing Albert Ford would want to talk to us soon."
  npc_override_harboro1_quests_rockridge_i_m_headquarters_6b08c4: "I'm from Headquarters."
  npc_override_harboro1_quests_rockridge_i_m_here_because_i_f9cc2e: "I'm here because I have nowhere else to go, but I'll go back up once those who took up residence in the mine are gone."
  npc_override_harboro1_quests_rockridge_i_m_here_c66f6d: "I'm here."
  npc_override_harboro1_quests_rockridge_i_m_here_eat_638ad0: "I'm not here to eat."
  npc_override_harboro1_quests_rockridge_i_m_here_her_behalf_b8b64b: "I'm here on her behalf. If you keep being stubborn,"
  npc_override_harboro1_quests_rockridge_i_m_i_m_14e6ba: "I'm in! I'm in!"
  npc_override_harboro1_quests_rockridge_i_m_joking_you_d_23028f: "...I'm joking. But you'd better lighten your bag. Unless you have family to feed, carrying so much is counterproductive."
  npc_override_harboro1_quests_rockridge_i_m_just_passersby_d01d24: "I'm just a passersby."
  npc_override_harboro1_quests_rockridge_i_m_looking_into_how_80beaa: "I'm looking into how we can go ahead and use this place."
  npc_override_harboro1_quests_rockridge_i_m_messing_you_breathe_15f1ca: "I'm messing with you. Breathe."
  npc_override_harboro1_quests_rockridge_i_m_okay_as_long_4ff974: "I'm okay, as long as you don't want to be mayor."
  npc_override_harboro1_quests_rockridge_i_m_overweight_i_d_50e3b6: "I'm overweight. I'd better lighten my bag first."
  npc_override_harboro1_quests_rockridge_i_m_pretty_little_too_7130c5: "I'm pretty and little, too."
  npc_override_harboro1_quests_rockridge_i_m_pretty_sure_i_49e975: "I'm pretty sure I haven't seen you around. You're carrying a really heavy bag. Why, do you need something to keep you rooted because it's so windy?"
  npc_override_harboro1_quests_rockridge_i_m_pretty_sure_i_8682c9: "I'm pretty sure I haven't seen you around. What brings you to this village?"
  npc_override_harboro1_quests_rockridge_i_m_pretty_sure_you_b40ccb: "But I'm pretty sure you do."
  npc_override_harboro1_quests_rockridge_i_m_ready_go_patrol_ce2c5b: "I'm ready to go on patrol. Let me know when you're done."
  npc_override_harboro1_quests_rockridge_i_m_ready_meeting_8a1e58: "I'm ready for the meeting."
  npc_override_harboro1_quests_rockridge_i_m_really_good_my_6b7e06: "I'm really good with my hands, and I like fireworks. What do you think would be the best job for someone like me?"
  npc_override_harboro1_quests_rockridge_i_m_really_grateful_ever_9a199f: "I'm really grateful for everything you've done, and... and..."
  npc_override_harboro1_quests_rockridge_i_m_responsible_all_tran_3c4fb1: "I'm responsible for all transaction errors caused by misidentification. Please, you have to understand me."
  npc_override_harboro1_quests_rockridge_i_m_running_out_103de0: "I'm running out of"
  npc_override_harboro1_quests_rockridge_i_m_safe_as_long_71763d: "I'm safe as long as you're acting mayor."
  npc_override_harboro1_quests_rockridge_i_m_saying_you_should_75eb37: "I'm saying you should be nice to them like you are to your friends."
  npc_override_harboro1_quests_rockridge_i_m_sorry_guys_i_76df19: "I'm sorry, guys. I should've never taken you here..."
  npc_override_harboro1_quests_rockridge_i_m_sorry_i_d_5bdb06: "I'm sorry. I'd love to help, but I've got enough on my plate."
  npc_override_harboro1_quests_rockridge_i_m_sorry_i_didn_7c9e68: "I'm sorry, I didn't mean to get angry with you."
  npc_override_harboro1_quests_rockridge_i_m_sorry_i_said_daae3d: "I'm sorry I said that. That was thoughtless."
  npc_override_harboro1_quests_rockridge_i_m_sorry_lecter_i_1e4d17: "...I'm sorry, Lecter, but I don't have any agave-flavored juice today."
  npc_override_harboro1_quests_rockridge_i_m_sorry_s_zeny_3c647f: "I'm sorry, but it's 5,000 Zeny to get a room."
  npc_override_harboro1_quests_rockridge_i_m_sure_you_find_60cacc: "I'm sure you can find Costello by the dock, as usual."
  npc_override_harboro1_quests_rockridge_i_m_telling_you_truth_fc56e2: "I'm telling you the truth."
  npc_override_harboro1_quests_rockridge_i_m_thinking_we_should_b1c9ff: "I'm thinking we should wait until Albert contacts us for a meeting,"
  npc_override_harboro1_quests_rockridge_i_m_tired_being_surround_e0c582: "I'm tired of being surrounded by so much water! It's the reason we constantly have to repair the ground and buildings standing on it."
  npc_override_harboro1_quests_rockridge_i_m_too_busy_myself_845156: "I'm not too busy myself either, thanks to you."
  npc_override_harboro1_quests_rockridge_i_m_trying_blame_you_533d74: "I'm not trying to blame you."
  npc_override_harboro1_quests_rockridge_i_m_trying_wake_up_ce6de1: "I'm not trying to wake up late!"
  npc_override_harboro1_quests_rockridge_i_m_waiting_my_sister_6172c6: "I'm waiting for my sister. She's supposed to be on the next ship."
  npc_override_harboro1_quests_rockridge_i_m_worried_we_miners_cb2d1a: "I'm worried we miners might not be able to work for a long time,"
  npc_override_harboro1_quests_rockridge_i_manage_underground_wat_741077: "I manage the underground water pump"
  npc_override_harboro1_quests_rockridge_i_may_able_give_my_4091fc: "I may not be able to give my son real agave juice, but I at least want to be able to go buy things he wants."
  npc_override_harboro1_quests_rockridge_i_mean_e46962: "I mean,"
  npc_override_harboro1_quests_rockridge_i_might_weapon_you_could_0b0561: "I might have a weapon you could use against one of them, Albert Ford."
  npc_override_harboro1_quests_rockridge_i_miss_smell_stone_floor_bed50b: "I miss the smell of the stone floor. And the coolness."
  npc_override_harboro1_quests_rockridge_i_moved_close_picked_up_bf70e3: "- I moved close and picked up the pouch. It has the juice mix brand logo on it. Fortunately, it's not torn. -"
  npc_override_harboro1_quests_rockridge_i_my_way_back_rock_1f3008: "I was on my way back from the Rock Ridge Market today when I got attacked by some coyotes."
  npc_override_harboro1_quests_rockridge_i_need_deadly_poison_pow_364244: "I need 10 Deadly Poison Powders and.. let me see.. 1 Explosive Powder."
  npc_override_harboro1_quests_rockridge_i_need_help_0dae58: "that I need help."
  npc_override_harboro1_quests_rockridge_i_need_make_some_arrange_f23d0d: "I need to make some arrangements. I'll meet you there."
  npc_override_harboro1_quests_rockridge_i_need_time_ce66b2: "I need time."
  npc_override_harboro1_quests_rockridge_i_never_said_i_wanted_ed40af: "I never said I wanted to work with you."
  npc_override_harboro1_quests_rockridge_i_no_chance_get_out_836d84: "Do I have no chance to get out of here?"
  npc_override_harboro1_quests_rockridge_i_no_use_anymore_f7015d: "I have no use for this anymore."
  npc_override_harboro1_quests_rockridge_i_picked_up_pouch_sweet_236475: "- I picked up the pouch. Sweet-smelling powder started pouring out through the tears at the bottom. -"
  npc_override_harboro1_quests_rockridge_i_picked_up_spotty_waste_168b00: "I picked up Spotty in the wasteland. Maybe that's why he loves spending time there so much. But he never ventures so far out that he can't make it home before it's mealtime. At least, not yet."
  npc_override_harboro1_quests_rockridge_i_pride_myself_protectin_51922c: "I pride myself in protecting cargo here."
  npc_override_harboro1_quests_rockridge_i_probably_said_as_i_6a6786: "I probably said it as I went along with the conversation."
  npc_override_harboro1_quests_rockridge_i_really_repay_you_time_f71930: "I can really repay you this time. Please let me know if you change your mind."
  npc_override_harboro1_quests_rockridge_i_recommend_you_follow_c_e4e28e: "I recommend you follow the central road to the eastern gate of the village and move a little bit farther south."
  npc_override_harboro1_quests_rockridge_i_removed_plate_bottom_e_b97c59: "I removed the plate from the bottom of the elevator and found boxes of ores underneath it."
  npc_override_harboro1_quests_rockridge_i_saw_run_wasteland_go_39330b: "I saw it run to the wasteland. Go find my ring. You'd better not come back home without it!"
  npc_override_harboro1_quests_rockridge_i_say_we_should_go_9e13e3: "I say we should go with our plan for now."
  npc_override_harboro1_quests_rockridge_i_see_c52c6e: "I see."
  npc_override_harboro1_quests_rockridge_i_see_da0f97: "...I see."
  npc_override_harboro1_quests_rockridge_i_shook_sand_off_pouch_c2b5d4: "- I shook the sand off the pouch and put it in my bag. -"
  npc_override_harboro1_quests_rockridge_i_should_go_he_s_052402: "I should go. He's just being stubborn."
  npc_override_harboro1_quests_rockridge_i_should_go_tell_wyatt_cf9115: "I should go tell Wyatt that Costello wants to hear what the bandits have to say.^000000"
  npc_override_harboro1_quests_rockridge_i_should_take_me_now_def856: "I should take it with me for now. -"
  npc_override_harboro1_quests_rockridge_i_shouldn_t_put_banana_e9d4a9: "I shouldn't have put that banana bread on the menu. Who knew they wouldn't arrive in time?"
  npc_override_harboro1_quests_rockridge_i_so_excited_come_here_3b63c5: "I was so excited to come here that I got aboard the ship in full mining gear!"
  npc_override_harboro1_quests_rockridge_i_still_flower_my_head_e80771: "Do I still have the flower on my head?"
  npc_override_harboro1_quests_rockridge_i_swear_i_m_lying_74a67d: "I swear I'm not lying."
  npc_override_harboro1_quests_rockridge_i_t_believe_boss_thinks_72bd7f: "I can't believe the Boss thinks so little of me..."
  npc_override_harboro1_quests_rockridge_i_t_live_like_anymore_5a02a9: "I can't live like this anymore! Guess what Spotty stole this time? My ring!"
