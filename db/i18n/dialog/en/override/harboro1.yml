  npc_override_harboro1_quests_rockridge_let_s_try_make_him_a8098a: "Let's try to make him believe that Albert has betrayed him, and his only chance to get out of here is talking to us."
  npc_override_harboro1_quests_rockridge_let_s_wait_bandit_train_6023b2: "Let's wait for the bandit by the train."
  npc_override_harboro1_quests_rockridge_let_s_wait_daddy_he_98bd53: "Let's wait for Daddy. He'll be back with food."
  npc_override_harboro1_quests_rockridge_let_spy_see_you_talk_cff58b: "Let the spy see you talk to Johnny."
  npc_override_harboro1_quests_rockridge_like_shawn_said_go_secon_fc3183: "Like Shawn said, go to the second level in the mine, get an ore, and show it to Albert."
  npc_override_harboro1_quests_rockridge_listen_what_he_say_9564aa: "Listen to what he has to say."
  npc_override_harboro1_quests_rockridge_little_bit_white_hair_sc_dd50f8: "It has a little bit of white hair scattered inside it. -"
  npc_override_harboro1_quests_rockridge_little_kids_like_him_ful_00e90c: "Little kids like him are full of curiosity. You'd better tell him before he starts crying."
  npc_override_harboro1_quests_rockridge_ll_bad_both_us_da5ac8: "That'll be bad for both of us."
  npc_override_harboro1_quests_rockridge_ll_just_you_me_right_2673fb: "It'll be just you and me, right?"
  npc_override_harboro1_quests_rockridge_ll_make_things_easier_bo_6f1a8f: "That'll make things easier for both parties."
  npc_override_harboro1_quests_rockridge_ll_show_those_bandits_th_c994ce: "And that'll show those bandits they've been wasting their time squatting in the mine."
  npc_override_harboro1_quests_rockridge_ll_take_many_you_wimps_d6cd66: "It'll take many of you wimps to lift the elevator."
  npc_override_harboro1_quests_rockridge_ll_tame_him_further_c7ac6f: "That'll tame him further."
  npc_override_harboro1_quests_rockridge_long_time_9df567: "And for a long time,"
  npc_override_harboro1_quests_rockridge_look_around_while_you_hu_3135c7: "Look around while you hut, will you? Thank you."
  npc_override_harboro1_quests_rockridge_look_i_still_left_some_14e1d2: "But look, I still have left some of the materials you brought me yesterday. I can't use all these."
  npc_override_harboro1_quests_rockridge_look_those_people_been_w_ad3288: "Look at that. Those people have been waiting for their food for hours. How can I tell them that I don't have enough ingredients to cook for them?"
  npc_override_harboro1_quests_rockridge_look_who_s_still_breathi_c9dcf9: "Look who's still breathing now!"
  npc_override_harboro1_quests_rockridge_looking_place_stay_you_c_574ec4: "Looking for a place to stay? You came to the right place!"
  npc_override_harboro1_quests_rockridge_lucas_you_want_me_kill_38b12c: "Lucas! Do you want me to kill you? Stop doing that!"
  npc_override_harboro1_quests_rockridge_make_him_think_he_no_cd7c2d: "and make him think that he has no bargaining chip."
  npc_override_harboro1_quests_rockridge_make_sense_you_i_don_45a314: "Does that make sense to you? I don't believe there's prison food worth committing a crime for."
  npc_override_harboro1_quests_rockridge_make_sure_you_ore_you_50dc18: "Make sure you have the ore with you."
  npc_override_harboro1_quests_rockridge_many_023695: "for many,"
  npc_override_harboro1_quests_rockridge_many_generations_49e588: "many generations."
  npc_override_harboro1_quests_rockridge_many_people_already_floc_508e2b: "and many people already have flocked there, wanting a share of gold that the new land has to offer."
  npc_override_harboro1_quests_rockridge_many_people_know_about_b_7bf7dc: "Not many people know about it because it doesn't have many branches yet."
  npc_override_harboro1_quests_rockridge_many_people_village_jobl_ab8567: "Many people in the village are jobless, and all available jobs are given to adventurers."
  npc_override_harboro1_quests_rockridge_may_i_talk_you_second_27b571: "May I talk to you for a second?"
  npc_override_harboro1_quests_rockridge_may_sun_earth_70a8b7: "May the sun and earth"
  npc_override_harboro1_quests_rockridge_may_sun_earth_bless_you_ebcb32: "May the sun and earth bless you!"
  npc_override_harboro1_quests_rockridge_maybe_costello_could_hir_6da476: "Maybe Costello could hire you to work at the mine."
  npc_override_harboro1_quests_rockridge_maybe_grownups_our_villa_09af10: "Maybe the grownups in our village should go out and hunt coyotes, too."
  npc_override_harboro1_quests_rockridge_maybe_he_s_waiting_somet_d96932: "Or maybe he's waiting for something."
  npc_override_harboro1_quests_rockridge_maybe_i_should_deal_buff_5c093c: "Maybe I should deal with the Buffalo Bandits myself."
  npc_override_harboro1_quests_rockridge_maybe_i_should_join_vigi_d9bc67: "Maybe I should join the Vigilantes."
  npc_override_harboro1_quests_rockridge_maybe_i_should_take_gian_948cae: "Maybe I should take a giant fan with me."
  npc_override_harboro1_quests_rockridge_maybe_i_should_ve_opened_e9f104: "Maybe I should've opened an inn myself."
  npc_override_harboro1_quests_rockridge_maybe_i_should_yell_scar_1e0d34: "- Maybe I should yell and scare it away. What should I yell? -"
  npc_override_harboro1_quests_rockridge_maybe_we_should_explore_4d8c65: "Maybe we should explore beyond the mine, and go deep as far as we can."
  npc_override_harboro1_quests_rockridge_maybe_we_should_go_back_99437e: "Maybe we should go back to the mainland."
  npc_override_harboro1_quests_rockridge_maybe_you_could_help_me_f8fee1: "maybe you could help me."
  npc_override_harboro1_quests_rockridge_maybe_you_could_meet_him_f924b3: "Or maybe you could meet him instead, pretending to be someone from Headquarters. I'll go with you."
  npc_override_harboro1_quests_rockridge_maybe_you_re_right_did_0b1090: "...Maybe you're right. Did you come here as soon as you were done with him?"
  npc_override_harboro1_quests_rockridge_mayor_costell_s_solution_bbf1e8: "Mayor Costell's solution was to bury the first level and build a new village on top of it. And now what used to be the first floor is the basement. The second floor is actually the first."
  npc_override_harboro1_quests_rockridge_mean_you_re_willing_go_99523c: "Does this mean you're willing to go downstairs?"
  npc_override_harboro1_quests_rockridge_means_we_bargaining_chip_e84b0b: "This means we have a bargaining chip now."
  npc_override_harboro1_quests_rockridge_meantime_i_ll_check_pull_bd37cd: "In the meantime, I'll check the pulley that we need to use to go back up."
  npc_override_harboro1_quests_rockridge_meantime_i_ll_prepare_me_144b72: "In the meantime, I'll prepare for the meeting."
  npc_override_harboro1_quests_rockridge_meantime_i_ll_scare_john_64b585: "In the meantime, I'll scare Johnny a little bit further."
  npc_override_harboro1_quests_rockridge_menu_ah_1b5ee7: "Ah, Adventurer. Did you hunt ^FF00003 bandits of each kind: yellow, black, and white mane^000000?"
  npc_override_harboro1_quests_rockridge_menu_ah_7ffe7b: "Ah, Adventurer. Shhh! Please keep your voice down: the Buffalo Bandits might hear us."
  npc_override_harboro1_quests_rockridge_menu_and_a04742: "And guess who I met there: this guy. He was caught in the explosion that blew up the train, and those heartless buffaloes left him to die."
  npc_override_harboro1_quests_rockridge_menu_as_b68fda: "As I told you before, we've got something for you this time: ^0000CD1 Rock Ridge Coin^000000. Say, could you help us?"
  npc_override_harboro1_quests_rockridge_menu_as_c69e01: "As usual, please hunt ^FF00003 bandits of each kind: yellow, black, and white mane^000000."
  npc_override_harboro1_quests_rockridge_menu_cancel_f5ab26: "Cancel:{0}"
  npc_override_harboro1_quests_rockridge_menu_close_1ddc7c: "Close, but I make something stronger: ^0000cdbombs^000000. And mines are just about the best thing that could happen to people like me."
  npc_override_harboro1_quests_rockridge_menu_could_d5b9b3: "Could you come back again? If you're not busy, you're welcome anytime after 4:00 a.m each day."
  npc_override_harboro1_quests_rockridge_menu_he_bfe921: "He's an angel when he's in sleep, but... sigh... I already have a headache, just thinking about what he might do when he wakes up ^FF0000after 4:00 a.m.^000000"
  npc_override_harboro1_quests_rockridge_menu_let_744093: "Let me see what time it is... It's not past ^FF00004:00 a.m.^000000 yet. Could you come back later?"
  npc_override_harboro1_quests_rockridge_menu_now_1c6c67: "Now, here's the lowdown: get ^0000cd10 Deadly Poison Powders and 1 Explosive Powder^000000, and ^0000cdhunt 15 Gasters^000000. Got it?"
  npc_override_harboro1_quests_rockridge_menu_since_e81614: "Since there's no way of knowing exactly who scared Spotty, I'd like you to hunt 3 bandits of each kind: yellow, black, and white mane."
  npc_override_harboro1_quests_rockridge_menu_spotty_5017ac: "Spotty tired itself out and fell asleep. Could you come back tomorrow after 4:00 a.m.? We'll have something to give you next time."
  npc_override_harboro1_quests_rockridge_menu_thanks_07d9e1: "Thanks, but I only have to patrol once a day. Why don't you come back tomorrow after 4:00 a.m.?"
  npc_override_harboro1_quests_rockridge_menu_the_8788c4: "The only thing I can cook with the ingredients I have is mushroom soup, but I don't have the main ingredient: mushrooms."
  npc_override_harboro1_quests_rockridge_menu_this_a8cf4d: "This is just a rumor, but the founder of GC Bank named his bank after what he loved the most: gold coins."
  npc_override_harboro1_quests_rockridge_menu_warning_833feb: "^0000ffWarning: This place is not for the weak or faint-hearted.^000000"
  npc_override_harboro1_quests_rockridge_menu_we_485eae: "We should do this just once a day. They would know something is amiss if we get rid of too many of them at once. Please come back tomorrow after 4:00 a.m."
  npc_override_harboro1_quests_rockridge_mine_pretty_far_village_d12a65: "The mine was pretty far from the village, so transporting ores was a big problem in the beginning."
  npc_override_harboro1_quests_rockridge_miners_use_signal_others_03c672: "The miners use it to signal the others inside the mine."
  npc_override_harboro1_quests_rockridge_mister_what_you_doing_he_49cf04: "Mister, what are you doing here?"
  npc_override_harboro1_quests_rockridge_mm_87f9eb: "Mm, and..."
  npc_override_harboro1_quests_rockridge_mm_adventurer_let_me_tak_fe1480: "Mm, Adventurer, let me take back what I just said. Please help us."
  npc_override_harboro1_quests_rockridge_mm_how_about_we_just_286f4e: "Mm, how about we just pay them ^4d4dffa million Zeny or so^000000 for the ores?"
  npc_override_harboro1_quests_rockridge_mm_i_don_t_know_07c751: "Mm, I don't know what else to say."
  npc_override_harboro1_quests_rockridge_mm_i_m_pretty_sure_00766a: "Mm? I'm pretty sure I haven't seen you around."
  npc_override_harboro1_quests_rockridge_mm_mm_agave_juice_best_9a5ecb: "Mm, mm! Agave juice is the best thing I've tasted in Rock Ridge."
  npc_override_harboro1_quests_rockridge_mm_no_oh_he_gave_ad0878: "Mm? No? Oh, he gave it to you."
  npc_override_harboro1_quests_rockridge_mm_no_she_hunts_them_ab0a51: "Mm, no. She hunts them only when we need their fur and meat."
  npc_override_harboro1_quests_rockridge_mm_now_239243: "Mm, not now."
  npc_override_harboro1_quests_rockridge_mm_then_i_ll_become_e4a96a: "Mm... Then I'll become the second-best netter in the village!"
  npc_override_harboro1_quests_rockridge_mm_wait_did_costello_sen_c075fe: "Mm? Wait, did Costello send you?"
  npc_override_harboro1_quests_rockridge_mm_what_you_said_b61770: "Mm? What have you said?"
  npc_override_harboro1_quests_rockridge_mm_where_they_things_you_496e3e: "Mm? Where are they? The things you said will give me."
  npc_override_harboro1_quests_rockridge_mm_who_s_there_you_487f23: "Mm? Who's there? Is it you, Charlie?"
  npc_override_harboro1_quests_rockridge_mm_you_look_too_strong_bf18a9: "Mm? But you look too strong to be a simple passersby."
  npc_override_harboro1_quests_rockridge_mm_you_mind_helping_us_32c76c: "And, mm... Do you mind helping us again tomorrow? Spotty keeps taking things from the house to the wasteland, and we need them back."
  npc_override_harboro1_quests_rockridge_mm_you_re_adventurer_rig_2517c6: "Mm, you're an adventurer, right? Then just move past that door and go straight ahead."
  npc_override_harboro1_quests_rockridge_mm_you_re_one_us_80e46a: "Mm? You're not one of us. If you need a job, then you should look elsewhere."
  npc_override_harboro1_quests_rockridge_mm_you_want_your_things_4ca95d: "Mm, do you want your things back?"
  npc_override_harboro1_quests_rockridge_mm_your_logic_isn_t_08fde6: "Mm... Your logic isn't completely flawless, but at least it proves that you know Cacturon and Lecter."
  npc_override_harboro1_quests_rockridge_mom_said_she_d_bring_1f088d: "Mom said she'd bring me agave-flavored juice. My agave-flavored juice..."
  npc_override_harboro1_quests_rockridge_mommy_i_m_okay_9940c2: "Mommy, I'm okay."
  npc_override_harboro1_quests_rockridge_mommy_when_we_live_above_cc083e: "Mommy, when can we live above ground again?"
  npc_override_harboro1_quests_rockridge_more_than_f9c07b: "more than"
  npc_override_harboro1_quests_rockridge_more_than_we_need_80c77c: "more than we need."
  npc_override_harboro1_quests_rockridge_most_buildings_made_wood_f6bc14: "Most of the buildings were made of wood and prone to rotting. It took a lot of money and effort to fill them thoroughly, so our new ground level wouldn't sink in."
  npc_override_harboro1_quests_rockridge_mother_nature_allows_wee_ae90ca: "Mother Nature allows weeds to grow. She's allowing them to stay here."
  npc_override_harboro1_quests_rockridge_move_80510d: "Move."
  npc_override_harboro1_quests_rockridge_move_north_center_mine_y_0e53e4: "Move to the north from the center of the mine, and you'll see the broken elevator."
  npc_override_harboro1_quests_rockridge_mr_chairman_i_ve_just_f43b50: "^000077Mr. Chairman, I've just got a call from the basement. Five more workers have been attacked by monsters.^000000"
  npc_override_harboro1_quests_rockridge_mr_future_mayor_7222be: "Mr. Future Mayor."
  npc_override_harboro1_quests_rockridge_mr_karam_pucci_sent_me_9d9bf3: "Mr. Karam Pucci sent me."
  npc_override_harboro1_quests_rockridge_mr_midnight_they_used_yo_552714: "But, Mr. Midnight, they used to be your..."
  npc_override_harboro1_quests_rockridge_mr_wyatt_warp_sheriff_vi_633d30: "Mr. ^4d4dffWyatt Warp^000000 is the sheriff of this village, and he can tell you more about the bandits."
  npc_override_harboro1_quests_rockridge_msg_44c582: "...?"
  npc_override_harboro1_quests_rockridge_msg_61ce5a: "[{0}]"
  npc_override_harboro1_quests_rockridge_msg_6eae3a: "..."
  npc_override_harboro1_quests_rockridge_msg_82ba6b: "...!"
  npc_override_harboro1_quests_rockridge_must_boring_those_sea_an_1ee601: "But it must not be boring to those sea anemones"
  npc_override_harboro1_quests_rockridge_must_signaling_rock_john_1e83a8: "This must be the signaling rock Johnny James told me about."
  npc_override_harboro1_quests_rockridge_must_what_mr_mcphy_looki_6c76cc: "- This must be what Mr. McPhy is looking for. I should bring it to her. -"
  npc_override_harboro1_quests_rockridge_mwa_hah_hah_9c721a: "Mwa hah hah!"
  npc_override_harboro1_quests_rockridge_mwa_hah_hah_hah_35a9f7: "Mwa hah hah hah!"
  npc_override_harboro1_quests_rockridge_my_clementine_so_old_c57924: "My Clementine is not so old!"
  npc_override_harboro1_quests_rockridge_my_company_pink_rose_stu_3e6bcb: "My company, Pink Rose, stumbled across it while looking for new markets."
  npc_override_harboro1_quests_rockridge_my_dad_works_train_stati_c38e27: "My dad works at the train station."
  npc_override_harboro1_quests_rockridge_my_father_so_strong_he_5684cf: "My father is so strong, he can carry many boxes at once!"
  npc_override_harboro1_quests_rockridge_my_gramps_best_cactus_i_f98e15: "My gramps is the best Cactus I know!"
  npc_override_harboro1_quests_rockridge_my_husband_i_look_around_733429: "My husband and I will look around the village, just in case. If you find something, please come back here."
  npc_override_harboro1_quests_rockridge_my_job_make_sure_36e52a: "My job is to make sure"
  npc_override_harboro1_quests_rockridge_my_job_protect_against_r_1e2c81: "My job is to protect it against rain, wind, and of course thieves."
  npc_override_harboro1_quests_rockridge_my_lovely_clementine_i_p_fec202: "My lovely Clementine... I proposed to her here."
  npc_override_harboro1_quests_rockridge_my_mom_better_hunting_co_ee46f9: "My mom is better at hunting coyotes than any adventurer. I can hunt them, too!"
  npc_override_harboro1_quests_rockridge_my_mom_gave_me_ring_ec865e: "My mom gave me that ring before I left for this foreign land. I was keeping it for a rainy day, and that mongrel stole it from me!"
  npc_override_harboro1_quests_rockridge_my_name_donovan_9886f0: "My name is Donovan,"
  npc_override_harboro1_quests_rockridge_my_office_filled_thieves_61769c: "My office is filled with thieves. Everyone expects to be paid? Without doing their job!"
  npc_override_harboro1_quests_rockridge_my_own_sake_353c55: "for my own sake."
  npc_override_harboro1_quests_rockridge_my_wife_i_decided_check_bd4ab4: "My wife and I decided to check the village separately, but I'm not sure if we'd be done before you're back."
  npc_override_harboro1_quests_rockridge_my_wife_said_spotty_went_7fd054: "My wife said Spotty went out the back door and ran straight past the barbed-wire fence."
  npc_override_harboro1_quests_rockridge_my_wife_says_she_d_05ddcf: "My wife says she'd throw him out, but she doesn't mean it. She never raises her hand no matter how angry she is with him either, and she always remembers to feed him vitamins and get him vaccinated."
  npc_override_harboro1_quests_rockridge_my_wife_sent_me_here_eeee27: "My wife sent me here to give you directions, but I have no idea where he might have been."
  npc_override_harboro1_quests_rockridge_need_taken_care_first_921a89: "need to be taken care of first."
  npc_override_harboro1_quests_rockridge_negotiation_off_table_mo_f60909: "The negotiation was off the table the moment you took the Boss by surprise."
  npc_override_harboro1_quests_rockridge_never_mind_me_i_complete_1465a9: "Never mind me. I completely understand. Aww, I've been standing on my feet for so long, I can barely move my legs!"
  npc_override_harboro1_quests_rockridge_next_time_feab17: "Next time,"
  npc_override_harboro1_quests_rockridge_next_time_we_meet_we_929b80: "Next time we meet, we'll meet at Johnny's funeral, got it?"
  npc_override_harboro1_quests_rockridge_nice_meet_you_55c5a3: "Nice to meet you!"
  npc_override_harboro1_quests_rockridge_nice_meet_you_64753c: "Nice to meet you."
  npc_override_harboro1_quests_rockridge_nice_meet_you_my_name_db1b8f: "Nice to meet you! My name's Shawn McCurdy, and I'm a foreman at the mine."
  npc_override_harboro1_quests_rockridge_no_because_there_s_way_804f2c: "No. Because there's a way to get to the second floor of the mine."
  npc_override_harboro1_quests_rockridge_no_east_side_overrun_buf_f5c0f1: "No. The east side is overrun with the Buffalo Bandits. We should wait until the situation with them is resolved."
  npc_override_harboro1_quests_rockridge_no_hasn_t_s_just_6fd043: "No, it hasn't. It's just the same as when we left it."
  npc_override_harboro1_quests_rockridge_no_i_couldn_t_stood_c93ab0: "No, I couldn't have stood my ground. You weren't there. Anyway, those buffaloes used my bombs to blow up the ore train and take over the mine. Guess what happened to me afterward."
  npc_override_harboro1_quests_rockridge_no_i_didn_t_say_3a536b: "^990000No, I didn't say that! It's just taking a little longer to cook today. Stop panicking!^000000"
  npc_override_harboro1_quests_rockridge_no_i_m_asking_you_e5ab08: "No. I'm asking you to be in on our great plan. Anyway, you know the mine east of here? It used to belong to Gold Moon?"
  npc_override_harboro1_quests_rockridge_no_i_m_just_tourist_760796: "No. I'm just a tourist."
  npc_override_harboro1_quests_rockridge_no_i_m_worried_about_2643b6: "No, I'm not worried about them, but I am worried about us. If this goes wrong?"
  npc_override_harboro1_quests_rockridge_no_matter_how_hard_i_7f062d: "no matter how hard I try"
  npc_override_harboro1_quests_rockridge_no_no_then_everyone_find_69863a: "No. No, then everyone will find out."
  npc_override_harboro1_quests_rockridge_no_one_else_cares_about_4c7eca: "that no one else cares about their own sewer system right now."
  npc_override_harboro1_quests_rockridge_no_problem_i_don_t_b49202: "No problem. I don't mind staying here for a little longer."
  npc_override_harboro1_quests_rockridge_no_technically_speaking_8056c8: "No. Technically speaking, we'd ^0000cdreclaim the mine^000000. Have you seen what's going in the village? Since those buffaloes took over the mine, most of the people lost their jobs."
  npc_override_harboro1_quests_rockridge_no_thank_you_giving_me_46abae: "No. Thank you for giving it to me."
  npc_override_harboro1_quests_rockridge_no_there_s_couple_native_13d292: "No. There's a couple of native tribes."
  npc_override_harboro1_quests_rockridge_no_they_re_necessary_pun_33a688: "No, but they're necessary for punishing Johnny."
  npc_override_harboro1_quests_rockridge_no_wasn_t_1616f7: "- No, it wasn't."
  npc_override_harboro1_quests_rockridge_no_we_just_stay_strong_948562: "No. We just have to stay strong until this is over. There'll be an opportunity for us afterward."
  npc_override_harboro1_quests_rockridge_no_why_i_give_you_eff18b: "No. Why would I give you something Cacturon has lost?"
  npc_override_harboro1_quests_rockridge_no_why_should_i_he_a49b26: "No. Why should I? He asked you. Plus, kids usually give me heartburn."
  npc_override_harboro1_quests_rockridge_no_you_re_going_get_42f2d8: "No. You're going to get caught and ruin our plan before it even begins."
  npc_override_harboro1_quests_rockridge_noise_could_wake_them_up_b812e3: "But the noise could wake them up. There'll be guards, too."
  npc_override_harboro1_quests_rockridge_none_these_guys_come_bac_3ad055: "None of these guys would come back alive, let alone earn their keep. And then we'd have to go out there to collect their remains, which is doubly bad for us."
  npc_override_harboro1_quests_rockridge_normally_d_first_thing_c_2e90f4: "Normally, that'd be the first thing to come to mind."
  npc_override_harboro1_quests_rockridge_nothing_go_83b393: "Nothing. Go on."
