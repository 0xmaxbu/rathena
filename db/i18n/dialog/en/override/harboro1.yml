Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_harboro1_quests_rockridge_about_what_you_get_i_5897e0: "about what you get, I see."
  npc_override_harboro1_quests_rockridge_according_letter_bandit_fcb008: "but according to that letter, the bandit leader ^4d4dffJohnny James^000000 wants to talk to someone from our side, one on one."
  npc_override_harboro1_quests_rockridge_ack_even_agave_8a1bfd: "Ack, does it even have agave in it?"
  npc_override_harboro1_quests_rockridge_actual_development_rock_34801d: "The actual development of Rock Ridge began after the train system was finally introduced."
  npc_override_harboro1_quests_rockridge_actually_672c01: "Actually..."
  npc_override_harboro1_quests_rockridge_actually_they_used_two_s_770796: "Actually, they used to be two stories before the basement was created. The owners must miss having two stories."
  npc_override_harboro1_quests_rockridge_adventurer_all_way_here_cb5ad2: "An adventurer? All the way here in Rock Ridge?"
  npc_override_harboro1_quests_rockridge_adventurer_cold_heart_773652: "Adventurer have a cold heart!"
  npc_override_harboro1_quests_rockridge_adventurer_get_purple_or_cb7678: "Adventurer, get ^4d4dff1 Purple Ore^000000."
  npc_override_harboro1_quests_rockridge_adventurer_i_ve_been_wai_444db4: "Adventurer, I've been waiting for you! You came to avenge Spotty on the Buffalo Bandits, right?"
  npc_override_harboro1_quests_rockridge_adventurer_thank_you_che_6b602a: "Adventurer, thank you for checking that dangerous area for my wife's gold ring."
  npc_override_harboro1_quests_rockridge_adventurer_thank_you_com_072b1f: "Adventurer, thank you for coming back. We've checked all the holes Spotty dug inside the village, but we couldn't find what we were looking for. He must have taken it to the wasteland."
  npc_override_harboro1_quests_rockridge_adventurer_we_ve_found_r_b38200: "Adventurer, we've found the ring!"
  npc_override_harboro1_quests_rockridge_adventurer_where_did_you_b77f53: "Adventurer, where did you leave that big, beautiful ore you had? Did you lose it?"
  npc_override_harboro1_quests_rockridge_adventurer_who_took_care_b5bfed: "the adventurer who took care of the Buffalo Bandits!"
  npc_override_harboro1_quests_rockridge_adventurers_like_you_roc_fb3ec8: "For adventurers like you, and for Rock Ridge, of course."
  npc_override_harboro1_quests_rockridge_after_all_time_we_spent_fd40d9: "After all the time we spent searching the village, we've found it inside his house."
  npc_override_harboro1_quests_rockridge_agave_drink_mix_012754: "Agave drink mix?"
  npc_override_harboro1_quests_rockridge_agave_drink_mix_comes_se_88680f: "The ^0000CDagave drink mix^000000 comes in a set of 7 packs. I lost the whole set, and I doubt you could find the whole set intact. I'll be happy if you could find just ^0000CD5 packs^000000."
  npc_override_harboro1_quests_rockridge_agave_flavored_juice_did_1e352e: "Is this agave-flavored juice? Did you find this agave-flavored juice for me? Yippee! Lecter wants to drink it now!"
  npc_override_harboro1_quests_rockridge_agave_juice_you_mean_my_695b23: "Agave juice? Do you mean my favorite agave-flavored juice?"
  npc_override_harboro1_quests_rockridge_ah_adventurer_let_s_keep_860027: "Ah, adventurer. Let's keep this just between you and me, okay?"
  npc_override_harboro1_quests_rockridge_ah_adventurer_welcome_ba_95d19a: "Ah, Adventurer, welcome back."
  npc_override_harboro1_quests_rockridge_ah_adventurer_you_like_b_6522e9: "Ah, adventurer. Would you like to buy some souvenirs?"
  npc_override_harboro1_quests_rockridge_ah_come_don_t_like_31a930: "Ah, come on, don't be like that. Help this poor man out here."
  npc_override_harboro1_quests_rockridge_ah_course_albert_ran_s_68deb6: "Ah, of course, Albert ran. That's so he could bring his friends with him."
  npc_override_harboro1_quests_rockridge_ah_fool_johnny_550680: "Ah, to fool Johnny!"
  npc_override_harboro1_quests_rockridge_ah_guys_please_calm_down_6ba567: "Ah, guys, please calm down."
  npc_override_harboro1_quests_rockridge_ah_i_m_busy_i_3d551f: "Ah, I'm busy, and I wouldn't mind being busier!"
  npc_override_harboro1_quests_rockridge_ah_i_should_ve_known_c70296: "Ah, I should've known"
  npc_override_harboro1_quests_rockridge_ah_i_t_move_i_9d79d4: "Ah, I can't move. I'm aching all over."
  npc_override_harboro1_quests_rockridge_ah_i_ve_talked_too_232c75: "Ah, I've talked too much. I'm sorry I took up your time, Adventurer."
  npc_override_harboro1_quests_rockridge_ah_i_want_beat_drum_7e2b3c: "Ah, I want to beat this drum! I'd love to hear its sound!"
  npc_override_harboro1_quests_rockridge_ah_kiddo_speaking_which_cb6898: "Ah kiddo, speaking of which, could you cull some Gasters? That'll help us set up bombs later."
  npc_override_harboro1_quests_rockridge_ah_price_adventurers_onl_20e5d1: "Ah, that price is for adventurers only."
  npc_override_harboro1_quests_rockridge_ah_s_brother_maurice_32a339: "Ah, that's it, Brother Maurice!"
  npc_override_harboro1_quests_rockridge_ah_s_you_213c50: "Ah, it's you."
  npc_override_harboro1_quests_rockridge_ah_shop_closed_sanders_o_0e3e9e: "Ah, the shop is closed. Sanders, the owner, went out to the desert, swinging a gun, to hunt the Buffalo Bandits himself. Then he fell and hurt his back."
  npc_override_harboro1_quests_rockridge_ah_so_he_told_you_be1075: "Ah, so he told you about the bandits."
  npc_override_harboro1_quests_rockridge_ah_so_you_re_as_f378b3: "Ah, so you're not as snobbish as I thought."
  npc_override_harboro1_quests_rockridge_ah_stranger_you_came_hel_b7b93e: "Ah, stranger! You came to help again, right?"
  npc_override_harboro1_quests_rockridge_ah_welcome_back_b8caf2: "Ah, welcome back!"
  npc_override_harboro1_quests_rockridge_ah_yes_sheriff_s_office_cd6cce: "Ah, yes, this is the sheriff's office. Do you have to wait in line, you ask?"
  npc_override_harboro1_quests_rockridge_ah_you_adventurer_please_69cd4d: "Ah, are you an adventurer? Please, help me stop that madman!"
  npc_override_harboro1_quests_rockridge_ah_you_must_forgotten_ab_4a2d44: "Ah, you must have forgotten about your payment. Please go ^FF0000make some room in your bag^000000 for it."
  npc_override_harboro1_quests_rockridge_ah_you_point_s_more_a63490: "Ah, you have a point. And that's more plausible, isn't it?"
  npc_override_harboro1_quests_rockridge_ah_you_re_adventurer_who_5c0540: "Ah, you're the adventurer who just arrived in these parts. Hah hah, don't be so surprised. I know because"
  npc_override_harboro1_quests_rockridge_ah_you_re_back_c1ae73: "Ah, you're back."
  npc_override_harboro1_quests_rockridge_ahem_yes_him_14c392: "*Ahem* Yes, this is him."
  npc_override_harboro1_quests_rockridge_akuha_nahari_where_they_530043: "Akuha! Nahari! Where have they gone?"
  npc_override_harboro1_quests_rockridge_albert_ford_hit_roof_if_f2fc12: "^4d4dffAlbert Ford^000000 will hit the roof if he sees this."
  npc_override_harboro1_quests_rockridge_albert_new_leader_your_g_1b17e3: "Albert is the new leader of your gang now."
  npc_override_harboro1_quests_rockridge_albert_ran_once_already_97db0b: "Albert ran once already."
  npc_override_harboro1_quests_rockridge_albert_s_mane_74b8d7: "Albert's mane?"
  npc_override_harboro1_quests_rockridge_albert_s_spy_been_going_2400c2: "Albert's spy has been going in and out of the basement."
  npc_override_harboro1_quests_rockridge_albert_wants_us_pay_him_ca9f15: "Albert wants us to pay him for the ores."
  npc_override_harboro1_quests_rockridge_albert_you_re_no_use_b2fda0: "Albert, you're no use for us anymore, but I'll leave you alone. For now."
  npc_override_harboro1_quests_rockridge_all_buildings_smell_like_1778a3: "All the buildings smell like fresh paint, and I hear the sound of hammering everywhere I go. This village is alive!"
  npc_override_harboro1_quests_rockridge_all_i_just_wait_cdcfa9: "All I have to do is just wait."
  npc_override_harboro1_quests_rockridge_all_i_want_sneeze_ccd022: "and all I want to do is sneeze..."
  npc_override_harboro1_quests_rockridge_all_right_104f98: "All right!"
  npc_override_harboro1_quests_rockridge_all_them_00e75f: "all of them."
  npc_override_harboro1_quests_rockridge_all_times_81d673: "at all times,"
  npc_override_harboro1_quests_rockridge_all_you_ac7fbd: "All you have to do is"
  npc_override_harboro1_quests_rockridge_alright_come_back_if_you_2fcd18: "Alright, but come back if you change your mind."
  npc_override_harboro1_quests_rockridge_alright_go_talk_johnny_o_b1e5d2: "Alright, go talk to Johnny one last time."
  npc_override_harboro1_quests_rockridge_alright_go_your_way_bf6b5f: "Alright, go on your way."
  npc_override_harboro1_quests_rockridge_alright_i_ll_tell_you_82d143: "Alright, I'll tell you where the ores are."
  npc_override_harboro1_quests_rockridge_alright_let_me_hear_f8fff5: "Alright, let me hear it."
  npc_override_harboro1_quests_rockridge_alright_let_me_rephrase_01fcc0: "Alright, let me rephrase that."
  npc_override_harboro1_quests_rockridge_alright_let_s_go_back_7cd3d8: "Alright, let's go back up."
  npc_override_harboro1_quests_rockridge_alright_makes_sense_64d243: "Alright, that makes sense."
  npc_override_harboro1_quests_rockridge_alright_should_you_know_218f9a: "Alright, this should do. You know what I need, right? Are you sure you could sneak in? Maybe I should go."
  npc_override_harboro1_quests_rockridge_alright_take_your_time_8bc792: "Alright, take your time."
  npc_override_harboro1_quests_rockridge_alright_then_go_meet_alb_babad0: "Alright, then go meet with Albert."
  npc_override_harboro1_quests_rockridge_alright_then_go_talk_him_fb2884: "Alright, then go talk to him."
  npc_override_harboro1_quests_rockridge_alright_then_i_ll_let_c35e1f: "Alright, then I'll let Shawn handle this."
  npc_override_harboro1_quests_rockridge_alright_then_let_s_i_41bfa2: "Alright, then let's do this. I'll jot down everything I need. Can you bring them from Midgard?"
  npc_override_harboro1_quests_rockridge_alright_up_we_go_348bdd: "Alright, up we go!"
  npc_override_harboro1_quests_rockridge_alright_we_re_going_worr_053ba4: "...Alright, we're not going to worry about that traitor anymore."
  npc_override_harboro1_quests_rockridge_alright_what_i_you_8cde89: "- Alright, what can I do for you?"
  npc_override_harboro1_quests_rockridge_also_mine_doesn_t_c602a1: "It also has to do with the mine, doesn't it?"
  npc_override_harboro1_quests_rockridge_am_i_going_die_here_ac36d7: "Am I going to die here?"
  npc_override_harboro1_quests_rockridge_and_efa20a: "and {0}."
  npc_override_harboro1_quests_rockridge_anyway_desalination_syst_4d3e2c: "Anyway, the desalination system itself is in good order, but the cobweb of pipes that forms the system is prone to erosion and breakage. They need constant maintenance."
  npc_override_harboro1_quests_rockridge_anyway_i_ll_appreciate_i_c4ea50: "Anyway, I'll appreciate if you can take care of the Buffalo Bandits."
  npc_override_harboro1_quests_rockridge_anyway_i_looking_things_91a020: "Anyway, I looking for things that can only find in this place. If you found them, gimme them."
  npc_override_harboro1_quests_rockridge_anyway_johnny_james_more_50d779: "Anyway, Johnny James is more stubborn than I thought."
  npc_override_harboro1_quests_rockridge_anyway_kiddo_you_sure_yo_df6094: "Anyway, kiddo, are you sure you can help us? There are monsters inside the mine that looks like cotton balls. Hunt them, and they'll leave behind deadly poisonous powder and explosive powder."
  npc_override_harboro1_quests_rockridge_anyway_what_we_you_9c9fa5: "Anyway, what can we do for you?"
  npc_override_harboro1_quests_rockridge_anyway_wyatt_you_attend_b28c04: "...Anyway, Wyatt and you can attend the meeting without me."
  npc_override_harboro1_quests_rockridge_area_desert_desalinating_730e4f: "This area is a desert. Desalinating is cheaper than importing water."
  npc_override_harboro1_quests_rockridge_aren_t_you_tired_pipes_b71327: "Aren't you tired? The pipes don't need cleaning at this moment. Why don't you go take care of whatever else you have to do?"
  npc_override_harboro1_quests_rockridge_as_always_i_m_grateful_8f11b0: "As always, I'm grateful for your help, but you need to come back in the morning. Thanks."
  npc_override_harboro1_quests_rockridge_as_always_please_hunt_co_e33ac5: "As always, please hunt ^0000CD30 Coyotes^000000 for me."
  npc_override_harboro1_quests_rockridge_as_help_me_something_59e268: "as to help me with something?"
  npc_override_harboro1_quests_rockridge_as_i_get_older_s_384bd8: "As I get older, it's getting more difficult to stand outside all day, spreading his words."
  npc_override_harboro1_quests_rockridge_as_if_wasn_t_enough_6d52fc: "And as if that wasn't enough, they took up residence inside our mine. Now I can't produce any profits and the company is not happy with me."
  npc_override_harboro1_quests_rockridge_as_many_as_i_ask_68a0e1: "as many as I ask."
  npc_override_harboro1_quests_rockridge_as_soon_as_you_re_7a1b96: "as soon as you're done."
  npc_override_harboro1_quests_rockridge_as_usual_get_deadly_pois_621662: "As usual, get ^0000cd10 Deadly Poison Powders and 1 Explosive Powder^000000, and ^0000cdhunt 15 Gasters^000000. Got it?"
  npc_override_harboro1_quests_rockridge_as_you_see_rock_ridge_c0d827: "As you see, Rock Ridge is a village of pioneers built on a wasteland."
  npc_override_harboro1_quests_rockridge_aside_main_gate_there_fe_45e7e8: "Aside from the main gate, there are are a few more entrances that only we know, and we guard one of them."
  npc_override_harboro1_quests_rockridge_ask_if_he_s_seen_9608cf: "Ask if he's seen a juice mix package."
  npc_override_harboro1_quests_rockridge_aww_here_s_list_ingredie_8497a3: "Aww, here's the list of ingredients I need. Bring them quickly, will you?"
  npc_override_harboro1_quests_rockridge_aww_i_m_too_scared_c12fb2: "Aww, I'm too scared to talk about this anymore."
  npc_override_harboro1_quests_rockridge_aww_just_one_look_them_205cbc: "Aww, just one look at them,"
  npc_override_harboro1_quests_rockridge_aww_s_getting_chilly_let_d6ebbd: "Aww, it's getting chilly. Let's go back up."
  npc_override_harboro1_quests_rockridge_bah_alright_then_i_won_2662a2: "Bah! Alright, then I won't force you."
  npc_override_harboro1_quests_rockridge_bandits_didn_t_bother_ch_cc8d4b: "and the bandits didn't bother checking so deep."
  npc_override_harboro1_quests_rockridge_bandits_might_stand_guar_8bc533: "The bandits might stand guard around the mine."
  npc_override_harboro1_quests_rockridge_bandits_only_first_floor_35b2fd: "The bandits are only on the first floor. We could sneak into the second floor and continue to mine."
  npc_override_harboro1_quests_rockridge_bandits_stole_them_compa_389c86: "And the bandits stole them from the company."
  npc_override_harboro1_quests_rockridge_basement_haunted_you_don_ed0e4f: "The basement is haunted. You don't really believe that, do you?"
  npc_override_harboro1_quests_rockridge_basement_village_ebdfba: "from the basement of the village,"
  npc_override_harboro1_quests_rockridge_beautiful_isn_t_fd0b34: "Beautiful, isn't it?"
  npc_override_harboro1_quests_rockridge_because_bandits_right_8f17bf: "This is because of the bandits, right?"
  npc_override_harboro1_quests_rockridge_because_he_s_made_offer_1c76ca: "Because he's made this offer official, we can't ignore it."
  npc_override_harboro1_quests_rockridge_because_his_spy_just_poi_860660: "Because his spy just pointed his fingers like guns at me."
  npc_override_harboro1_quests_rockridge_because_lecter_stop_cryi_c5622d: "Because Lecter... Stop crying. Smart Cactus children don't cry so easily!"
  npc_override_harboro1_quests_rockridge_because_they_spring_up_e_6021a7: "because they spring up every day,"
  npc_override_harboro1_quests_rockridge_because_we_re_greedy_7aeb11: "- Because we're greedy,"
  npc_override_harboro1_quests_rockridge_been_212bdb: "has been"
  npc_override_harboro1_quests_rockridge_being_such_dangerous_pla_42e053: "Being in such a dangerous place is making me nervous."
  npc_override_harboro1_quests_rockridge_besides_johnny_given_up_dbf2c2: "Besides Johnny has given up."
  npc_override_harboro1_quests_rockridge_besides_we_also_want_min_5ab2b1: "Besides, we also want the mine back. We're not at all comfortable making a deal with him."
  npc_override_harboro1_quests_rockridge_best_i_i_hope_you_88a05f: "This is the best I can do. I hope you'll like it. I'd like to thank you for your help on behalf of my family."
  npc_override_harboro1_quests_rockridge_best_netter_village_mrs_98d795: "The best netter in the village is Mrs. Soft Feather."
  npc_override_harboro1_quests_rockridge_biggest_threat_fields_ar_f8fc17: "The biggest threat in the fields around here is the Buffalo Bandits. They're smart and ruthless, and they won't listen to reason."
  npc_override_harboro1_quests_rockridge_bless_you_e77ca3: "bless you."
  npc_override_harboro1_quests_rockridge_blood_blood_i_don_t_842383: "Blood will have blood, and I don't want that. You can have the package, stranger."
  npc_override_harboro1_quests_rockridge_bodies_workers_who_went_2042c2: "The bodies of the workers who went missing in the basement have been found. They were mangled so badly that even their families had a hard time recognizing them."
  npc_override_harboro1_quests_rockridge_boohoo_grandma_boohoo_fc568a: "Boohoo! Grandma! Boohoo!"
  npc_override_harboro1_quests_rockridge_boohoo_where_hell_sherif_943616: "Boohoo! Where the hell is the sheriff's office? My money! Moneeeyyy!"
  npc_override_harboro1_quests_rockridge_boring_though_8599b1: "- It was boring, though."
  npc_override_harboro1_quests_rockridge_boss_betrayed_us_7ccd67: "The Boss has betrayed us?"
  npc_override_harboro1_quests_rockridge_both_badges_worn_us_vigi_3ddcb0: "Both badges are worn by us Vigilantes, but they provide different effects."
  npc_override_harboro1_quests_rockridge_box_7e79ff: "That box!"
  npc_override_harboro1_quests_rockridge_boy_s_loud_here_somethin_abd819: "(Boy, it's loud here. Is something going on?)"
  npc_override_harboro1_quests_rockridge_brave_warrior_cacti_dcd9f4: "a brave warrior of the Cacti."
  npc_override_harboro1_quests_rockridge_bring_lots_friends_you_n_e9682a: "But bring lots of friends with you next time, alright?"
  npc_override_harboro1_quests_rockridge_bring_me_bastard_s_mane_3180ae: "Bring me that bastard's mane!"
  npc_override_harboro1_quests_rockridge_bring_me_his_mane_as_e1d2f2: "And bring me ^4d4dffhis mane^000000 as proof."
  npc_override_harboro1_quests_rockridge_bring_me_midgard_you_buy_580881: "Bring me 60 {0} from Midgard. You can buy them from merchants in big cities."
  npc_override_harboro1_quests_rockridge_bring_me_midgard_you_buy_9fd633: "Bring me 160 {0} from Midgard. You can buy them from merchants in big cities."
  npc_override_harboro1_quests_rockridge_bring_me_midgard_you_buy_b8b3f9: "Bring me {0} {1} from Midgard. You can buy them from merchants in big cities."
  npc_override_harboro1_quests_rockridge_bring_me_midgard_you_buy_f4f34b: "Bring me 50 {0} from Midgard. You can buy them from merchants in big cities."
  npc_override_harboro1_quests_rockridge_bring_them_me_eec95f: "bring them to me."
  npc_override_harboro1_quests_rockridge_broken_elevator_north_ce_9cddf1: "The broken elevator is to the north from the center of this mine."
  npc_override_harboro1_quests_rockridge_buffalo_bandits_87e38b: "and the Buffalo Bandits."
  npc_override_harboro1_quests_rockridge_buffalo_bandits_e60c54: "The Buffalo Bandits"
  npc_override_harboro1_quests_rockridge_buffalo_bandits_mine_jus_dd73bf: "the Buffalo Bandits, the mine, just to name a couple?"
  npc_override_harboro1_quests_rockridge_buffalo_bandits_want_mak_ee572e: "The Buffalo Bandits want to make a bargain with us."
  npc_override_harboro1_quests_rockridge_buffaloes_get_out_mine_w_e5858d: "The buffaloes would get out of the mine when the fireworks starts, but those clumps of gas could trigger chain reaction and blow up the entire mine. Hunt 15 of them for now. Can you do it?"
  npc_override_harboro1_quests_rockridge_cacti_members_village_go_101a52: "The Cacti and the members of this village are on good terms, and recently more coyotes have been seen along the road that leads to their village."
  npc_override_harboro1_quests_rockridge_cacti_we_people_rock_rid_dece9a: "The Cacti and we the people of Rock Ridge call them the ^4d4dffBuffalo Bandits^000000."
  npc_override_harboro1_quests_rockridge_cacturon_should_ashamed_6b8289: "But Cacturon should be ashamed of herself for trusting thugs like you."
  npc_override_harboro1_quests_rockridge_call_help_4e6bc1: "to call for help."
  npc_override_harboro1_quests_rockridge_called_gasters_inside_mi_950727: "called Gasters inside the mine?"
  npc_override_harboro1_quests_rockridge_carrying_limit_helper_11ab39: "^0000ff[Carrying Limit Helper]^000000"
  npc_override_harboro1_quests_rockridge_charlie_t_come_here_he_4b5071: "Charlie can't come here. He lives across the sea."
  npc_override_harboro1_quests_rockridge_check_location_ores_brin_249e7c: "Check the location of the ores, and bring only ^4d4dff1 Ore Box^000000 with you."
  npc_override_harboro1_quests_rockridge_check_my_bank_account_6d128b: "Check my bank account."
  npc_override_harboro1_quests_rockridge_check_out_exquisite_fini_2f5619: "Check out the exquisite finish around the drum skin, and the well-balanced, full-bodied sound from the barrel."
  npc_override_harboro1_quests_rockridge_check_what_s_going_e41856: "Check what's going on."
  npc_override_harboro1_quests_rockridge_cheers_our_great_village_94f031: "Cheers for our great village! Cheers!"
  npc_override_harboro1_quests_rockridge_children_they_as_cute_as_e440b7: "Children? Are they as cute as Leaf?"
  npc_override_harboro1_quests_rockridge_chuckle_483441: "*Chuckle*"
  npc_override_harboro1_quests_rockridge_chuckle_i_ll_make_you_df81a2: "*Chuckle* I'll make you pay for humiliating me."
