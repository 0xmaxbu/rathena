  npc_override_harboro1_quests_rockridge_we_should_talk_mayor_cos_16c7c0: "We should talk to Mayor Costello first."
  npc_override_harboro1_quests_rockridge_we_start_teach_our_young_3f10fe: "We start to teach our young how to hunt early on,"
  npc_override_harboro1_quests_rockridge_we_still_pump_out_water_0685e9: "We still have to pump out water on a daily basis to prevent flooding, but that's just a minor setback?we took one step back to move two steps forward. Rock Ridge will continue to grow."
  npc_override_harboro1_quests_rockridge_we_t_afford_012a53: "and we can't afford that."
  npc_override_harboro1_quests_rockridge_we_t_anything_until_we_9797cb: "We can't do anything until we get our supplies."
  npc_override_harboro1_quests_rockridge_we_t_completely_fill_up_384ed9: "We can't completely fill up the basement because it's where our desalination system is."
  npc_override_harboro1_quests_rockridge_we_t_make_him_things_dd28ce: "We can't make him do things for us without explanation. He has the right to know what he's getting himself into."
  npc_override_harboro1_quests_rockridge_we_t_work_yet_we_ebcc79: "We can't work, and yet we're not allowed to leave. How unfair is that?"
  npc_override_harboro1_quests_rockridge_we_take_care_between_us_24a9f1: "We can take care of this between us two, but the mayor needs to know what's going on in his village."
  npc_override_harboro1_quests_rockridge_we_taurases_take_pride_o_9533c4: "But we Taurases take pride in our physical superiority. How can I tell the others that I can't do my job because I'm allergic to some gas?"
  npc_override_harboro1_quests_rockridge_we_ve_been_having_hard_141847: "we've been having a hard time"
