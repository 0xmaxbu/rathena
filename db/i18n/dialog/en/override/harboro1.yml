  npc_override_harboro1_quests_rockridge_yip_8d0af3: "YIP!"
  npc_override_harboro1_quests_rockridge_yo_tell_him_3e5df9: "Yo tell him."
  npc_override_harboro1_quests_rockridge_you_1e9a84: "You do that."
  npc_override_harboro1_quests_rockridge_you_805a59: "You."
  npc_override_harboro1_quests_rockridge_you_bdb6ef: "But you do."
  npc_override_harboro1_quests_rockridge_you_being_stranger_distr_fb1a51: "You being a stranger has distracted them more effectively than we thought."
  npc_override_harboro1_quests_rockridge_you_believe_some_people_82cdd4: "Can you believe some people actually live here? People above ground don't care about them. Officially, this place is vacant, even though it's not."
