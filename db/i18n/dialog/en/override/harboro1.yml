  npc_override_harboro1_quests_rockridge_we_no_use_them_you_ff522b: "We have no use for them, and you're stuck with them."
  npc_override_harboro1_quests_rockridge_we_people_rock_ridge_her_27c2e3: "But we the people of Rock Ridge are not here to give in, we're here to conquer!"
