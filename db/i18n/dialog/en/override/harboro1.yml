  npc_override_harboro1_quests_rockridge_yes_his_name_fb1864: "Yes, that was his name."
  npc_override_harboro1_quests_rockridge_yes_i_did_2856c4: "- Yes, I did."
  npc_override_harboro1_quests_rockridge_yes_i_ll_teach_you_cf0541: "Yes, I'll teach you how to net. For now, let me teach you how to make pretty knots with grass blades."
