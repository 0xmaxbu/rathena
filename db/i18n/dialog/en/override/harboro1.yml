  npc_override_harboro1_quests_rockridge_yes_i_m_home_mm_528425: "Yes, I'm home. Mm, Lecter, I have something to tell you."
  npc_override_harboro1_quests_rockridge_yes_leaf_good_cactus_he_beeaa7: "Yes. Leaf is a good Cactus and he loves his gramps."
  npc_override_harboro1_quests_rockridge_yes_some_guys_i_sent_9be2bc: "Yes. Some guys I sent on a patrol duty didn't come back, and some of our ores?"
