  npc_override_harboro1_quests_rockridge_s_good_we_ve_caught_f5697b: "It's good we've caught it,"
  npc_override_harboro1_quests_rockridge_s_heartless_688c54: "That's heartless."
  npc_override_harboro1_quests_rockridge_s_interesting_phenomenon_858710: "It's an interesting phenomenon. I think the signboards are supposed to make the buildings look like they have two stories, at least on the front."
  npc_override_harboro1_quests_rockridge_s_jail_cell_b849da: "It's a jail cell."
  npc_override_harboro1_quests_rockridge_s_job_just_one_man_469888: "and it's not a job for just one man."
  npc_override_harboro1_quests_rockridge_s_johnny_we_ve_wanted_af1af5: "And that it's Johnny that we've wanted all this time."
  npc_override_harboro1_quests_rockridge_s_just_a81584: "It's just that"
  npc_override_harboro1_quests_rockridge_s_just_safe_us_too_7a4d51: "It's just not safe for us to have too many coyotes around. That's why we asked the adventurers for help."
  npc_override_harboro1_quests_rockridge_s_just_temporary_ecdd66: "But that's just temporary."
  npc_override_harboro1_quests_rockridge_s_just_things_haven_t_b747cd: "It's just that... things haven't been good."
  npc_override_harboro1_quests_rockridge_s_like_those_buffaloes_w_624ca6: "It's not like those buffaloes have a way to confirm that."
  npc_override_harboro1_quests_rockridge_s_lot_contrary_what_most_29e144: "And that's not a lot, contrary to what most people think."
  npc_override_harboro1_quests_rockridge_s_mineral_vein_decorativ_5a5bb6: "It's not a mineral vein but a decorative rock that we villagers moved together. I told him that, but he doesn't care!"
  npc_override_harboro1_quests_rockridge_s_mineral_vein_s_decorat_b91dc5: "That's not a mineral vein, it's a decorative rock! Get that pickax away from it, now!"
  npc_override_harboro1_quests_rockridge_s_more_like_anyway_we_4da425: "That's more like it. Anyway, we're going to rob the ^0000cdmine^000000."
  npc_override_harboro1_quests_rockridge_s_mrs_cacturon_lost_let_4ae665: "That's it. Mrs. Cacturon has lost it. Let me bring it back to her."
  npc_override_harboro1_quests_rockridge_s_mrs_cacturon_s_let_92674f: "It's Mrs. Cacturon's. Let me bring it back to her."
  npc_override_harboro1_quests_rockridge_s_none_my_business_i_53fb99: "- That's none of my business. I'm just going to pass. -"
  npc_override_harboro1_quests_rockridge_s_o_clock_direction_when_961297: "It's in the 3 o'clock direction when you open the map."
  npc_override_harboro1_quests_rockridge_s_only_filled_dust_185920: "It's only filled with dust. -"
  npc_override_harboro1_quests_rockridge_s_perfect_day_visit_rock_e2d40d: "It's a perfect day to visit Rock Ridge, isn't it?"
  npc_override_harboro1_quests_rockridge_s_possible_3a9d79: "That's possible."
  npc_override_harboro1_quests_rockridge_s_possible_bandits_know_496dec: "But it's possible the bandits know we're searching the mine for the box."
  npc_override_harboro1_quests_rockridge_s_real_i_see_17c634: "That's real, I see."
  npc_override_harboro1_quests_rockridge_s_right_seeds_distrust_b_ad2fbc: "That's right. The seeds of distrust have been planted. All we have to do now is"
  npc_override_harboro1_quests_rockridge_s_right_we_reclaim_mine_55aa13: "That's right. We have to reclaim the mine too."
  npc_override_harboro1_quests_rockridge_s_secret_96342d: "It's a secret."
  npc_override_harboro1_quests_rockridge_s_should_i_uh_mm_e0d667: "S-should I? Uh, mm... Okay."
  npc_override_harboro1_quests_rockridge_s_something_citizens_han_ef039d: "and it's not something the citizens can handle."
  npc_override_harboro1_quests_rockridge_s_sweetheart_you_shouldn_797892: "S-sweetheart, you shouldn't be outside when it's so windy. Let's go in."
  npc_override_harboro1_quests_rockridge_s_time_af4b09: "it's time to"
  npc_override_harboro1_quests_rockridge_s_time_threaten_them_2bd625: "It's time to threaten them."
  npc_override_harboro1_quests_rockridge_s_too_sweet_me_though_bc1212: "It's too sweet for me, though. Well, that's not important."
  npc_override_harboro1_quests_rockridge_s_usable_i_ll_just_4f3734: "- It's not usable. I'll just have to leave it and look for another one. -"
  npc_override_harboro1_quests_rockridge_s_weapon_i_talking_about_5d5026: "And that's the weapon I was talking about."
  npc_override_harboro1_quests_rockridge_s_what_cacti_call_wastel_cb48c6: "That's what the Cacti call the wasteland. Anyway, there's an ^4d4dffunmoving freight train^000000 on the north side of the desert."
  npc_override_harboro1_quests_rockridge_s_where_those_who_did_f7ce5c: "It's where those who did something that they shouldn't come in handcuffs."
  npc_override_harboro1_quests_rockridge_s_why_his_spy_hasn_8ad6dd: "That's why his spy hasn't heard about his death."
  npc_override_harboro1_quests_rockridge_s_why_place_always_busy_622825: "That's why this place is always busy. A delay here causes a delay everywhere else in Rock Ridge."
  npc_override_harboro1_quests_rockridge_s_why_you_ve_been_0092a0: "And that's why you've been invited to Rock Ridge."
  npc_override_harboro1_quests_rockridge_s_worthless_abandoned_812740: "It's worthless and abandoned."
  npc_override_harboro1_quests_rockridge_save_2c489a: "Save."
  npc_override_harboro1_quests_rockridge_saved_please_come_again_0482de: "Saved. Please come again."
  npc_override_harboro1_quests_rockridge_say_could_you_0c8d20: "Say, could you"
  npc_override_harboro1_quests_rockridge_say_good_enough_motivati_4cb8af: "Say, is that good enough motivation for you? If you still don't want to help us, I won't force you."
  npc_override_harboro1_quests_rockridge_say_how_d_you_like_b21d80: "Say, how'd you like to work for me? I'll pay you generously."
  npc_override_harboro1_quests_rockridge_say_you_5a361d: "Say, can you do that?"
  npc_override_harboro1_quests_rockridge_say_you_want_help_them_5ef25d: "Say you want to help them find the ring."
  npc_override_harboro1_quests_rockridge_second_look_you_re_too_b6778b: "On second look, you're too weak to go there, anyway."
  npc_override_harboro1_quests_rockridge_see_those_sea_anemones_t_16fbc4: "See those sea anemones? They keep clogging up the sewer pipes, so we get rid of them on a regular basis. I like sitting here and watching them move. And when I do, time goes by so quickly."
  npc_override_harboro1_quests_rockridge_seems_all_strangers_gree_59f32a: "It seems all strangers are greedy, and you're not an exception."
  npc_override_harboro1_quests_rockridge_seems_we_wouldn_t_workin_e0a568: "It seems we wouldn't be working today, just like yesterday and the day before."
  npc_override_harboro1_quests_rockridge_sent_me_adventurers_bcd5c2: "It sent me adventurers."
  npc_override_harboro1_quests_rockridge_settled_bd3ab8: "has settled."
  npc_override_harboro1_quests_rockridge_sewage_system_71cdbb: "and sewage system."
  npc_override_harboro1_quests_rockridge_sewer_system_manager_17b8c1: "sewer system manager."
  npc_override_harboro1_quests_rockridge_shakes_his_head_hah_hah_2609d9: "*Shakes his head* Hah hah hah."
  npc_override_harboro1_quests_rockridge_shameless_f8a5c7: "or shameless."
  npc_override_harboro1_quests_rockridge_shawn_right_ba76af: "Shawn was right."
  npc_override_harboro1_quests_rockridge_shawn_said_you_d_bring_99affa: "Shawn said you'd bring the ore box. Where is it?"
  npc_override_harboro1_quests_rockridge_she_didn_t_say_anything_9b1244: "She didn't say anything when I quit my job because I was too scared of the Buffalo Bandits. She's a good woman."
  npc_override_harboro1_quests_rockridge_she_ll_happy_see_me_e03416: "She'll be happy to see me doing well."
  npc_override_harboro1_quests_rockridge_she_worried_sick_when_i_0e4e6d: "She was worried sick when I decided to leave for this continent a year ago."
  npc_override_harboro1_quests_rockridge_sheriff_always_wanted_hi_1f7ff3: "But the Sheriff has always wanted him."
  npc_override_harboro1_quests_rockridge_sheriff_been_so_busy_dea_866789: "The sheriff has been so busy dealing with the Buffalo Bandits that he doesn't have time for anything else. I've been here waiting for him for hours."
  npc_override_harboro1_quests_rockridge_sheriff_even_care_about_0f1e0c: "Does the sheriff even care about this situation?"
  npc_override_harboro1_quests_rockridge_sheriff_s_office_06966e: "This is the sheriff's office."
  npc_override_harboro1_quests_rockridge_sheriff_s_office_3d069a: "At the sheriff's office."
  npc_override_harboro1_quests_rockridge_sheriff_s_office_shop_bu_885ee5: "The sheriff's office and shop buildings are west of this plaza. The inn and the port are farther west."
  npc_override_harboro1_quests_rockridge_sheriff_s_office_those_u_235680: "The sheriff's office. Those in the underground jail are fed three times a day, and the food is so great that some people actually commit a misdemeanor for it."
  npc_override_harboro1_quests_rockridge_sheriff_s_office_underst_effa39: "The sheriff's office is understaffed. I've been waiting in line all day, and the line is as long as it was when I first arrived. I've been hearing strange noises from my basement, and I really need someone to come and check them."
  npc_override_harboro1_quests_rockridge_sheriff_traced_bombs_bac_28984d: "The sheriff traced the bombs back to me and dragged me with him."
  npc_override_harboro1_quests_rockridge_sheriff_warp_determined_110a93: "Sheriff Warp is determined to hang him."
  npc_override_harboro1_quests_rockridge_sheriff_warp_doesn_t_wan_3d99d6: "But Sheriff Warp doesn't want that."
  npc_override_harboro1_quests_rockridge_sheriff_warp_only_smiles_32963e: "Sheriff Warp only smiles at me."
  npc_override_harboro1_quests_rockridge_sheriff_warp_told_you_ev_e9b9e9: "Sheriff Warp told you everything, right?"
  npc_override_harboro1_quests_rockridge_sheriffs_no_better_than_4407b9: "And the sheriffs were no better than them. They just left him bleeding all over the cell. What could I do? I couldn't let anyone die if I could help it, so I treated him."
  npc_override_harboro1_quests_rockridge_sheriffs_throw_us_jail_i_6ded8d: "The sheriffs will throw us in jail if the bandits don't kill us. But it's okay. I like the beans there."
  npc_override_harboro1_quests_rockridge_should_enough_day_today_9874e2: "This should be enough for the day today."
  npc_override_harboro1_quests_rockridge_should_enough_i_d_better_5efafd: "This should be enough. I'd better end; to the village and report to her."
  npc_override_harboro1_quests_rockridge_should_enough_i_d_better_d97e44: "This should be enough. I'd better return to the village and report to her."
  npc_override_harboro1_quests_rockridge_show_him_his_mane_d002bb: "Show him his mane."
  npc_override_harboro1_quests_rockridge_show_him_ore_550324: "Show him the ore."
  npc_override_harboro1_quests_rockridge_show_their_mufflers_scar_f5e701: "and show their ^4d4dffmufflers and scarves to Albert.^000000"
  npc_override_harboro1_quests_rockridge_show_what_s_your_hand_f676be: "Show what's in your hand."
  npc_override_harboro1_quests_rockridge_shows_your_experience_as_36f79e: "This shows your experience as an adventurer."
  npc_override_harboro1_quests_rockridge_sigh_a02d05: "Sigh..."
  npc_override_harboro1_quests_rockridge_sigh_how_long_we_wait_02015e: "Sigh... How long do we have to wait?"
  npc_override_harboro1_quests_rockridge_sigh_i_miss_my_mom_173340: "Sigh... I miss my mom."
  npc_override_harboro1_quests_rockridge_sigh_then_there_s_nothin_ea2f41: "Sigh, then there's nothing here we could sell. Where should we go now?"
  npc_override_harboro1_quests_rockridge_sigh_when_last_ship_day_a73892: "...Sigh. When the last ship of the day enters the dock, I'll buy you lemonade, limeade, whatever you want."
  npc_override_harboro1_quests_rockridge_since_bandits_set_up_sho_4a774a: "Since the bandits set up shop in the mine, most of the experienced miners left."
  npc_override_harboro1_quests_rockridge_since_elevator_started_o_087665: "Since the elevator started operating, we stopped using the passage,"
  npc_override_harboro1_quests_rockridge_since_more_disappeared_y_980b69: "^000077Since 2 more disappeared yesterday, 15. No one wants to go down there.^000000"
  npc_override_harboro1_quests_rockridge_since_you_brought_back_m_c4aec8: "Since you brought back my wife's gold ring, I've been taking odd jobs to supplement our income. We can afford to repay you now."
  npc_override_harboro1_quests_rockridge_since_you_opened_mine_c5c121: "Since you opened the mine,"
  npc_override_harboro1_quests_rockridge_sister_loretta_my_legs_h_b8b687: "Sister Loretta, my legs hurt. *Whine*"
  npc_override_harboro1_quests_rockridge_sly_bastard_he_betrayed_030fb3: "That sly bastard, he betrayed me!"
  npc_override_harboro1_quests_rockridge_small_animal_bone_inside_376ee7: "It has a small animal bone inside it. -"
  npc_override_harboro1_quests_rockridge_small_insect_scuttling_a_4e30ab: "A small insect is scuttling around inside it. -"
  npc_override_harboro1_quests_rockridge_sniff_sniff_doesn_t_plac_b3395f: "*Sniff Sniff* Doesn't this place smell good to you? I love its salty, dank, musty smell! I could live here for the rest of my life!"
  npc_override_harboro1_quests_rockridge_sniffle_how_many_days_i_46c800: "*Sniffle* How many days do I have to wait to get my agave-flavored juice? Lecter doesn't want to wa... wait... BOOHOO!"
  npc_override_harboro1_quests_rockridge_sniffle_yes_s_as_pretty_61d89a: "*Sniffle* Yes, it's as pretty as the last time I checked."
  npc_override_harboro1_quests_rockridge_snort_b64258: "*Snort*"
  npc_override_harboro1_quests_rockridge_snort_these_yeah_we_thou_76ca34: "*Snort* These? Yeah, we thought they were good enough until we realized how strong the monsters out there were."
  npc_override_harboro1_quests_rockridge_snort_you_d_better_d8a06a: "*Snort* You'd better."
  npc_override_harboro1_quests_rockridge_snort_you_think_i_m_4ac127: "*Snort* Do you think I'm stupid? If you're a thief, you wouldn't be here by the time I come back from the village."
  npc_override_harboro1_quests_rockridge_so_anyway_buffalo_bandit_6222cd: "So, anyway, the Buffalo Bandits realized how lucrative the mine was and took up residence in there."
  npc_override_harboro1_quests_rockridge_so_c7572d: "So..."
  npc_override_harboro1_quests_rockridge_so_how_much_did_karam_88bf21: "So how much did Karam tell you?"
  npc_override_harboro1_quests_rockridge_so_i_m_thinking_a09389: "So I'm thinking"
  npc_override_harboro1_quests_rockridge_so_i_m_thinking_we_428aa6: "So I'm thinking we should sneak into the second floor and gather ores."
  npc_override_harboro1_quests_rockridge_so_i_ve_heard_cb0755: "So I've heard."
  npc_override_harboro1_quests_rockridge_so_mine_useless_moment_7d5c65: "So the mine is useless at the moment."
  npc_override_harboro1_quests_rockridge_so_mission_dd9635: "So this is a mission."
  npc_override_harboro1_quests_rockridge_so_most_its_citizens_min_a2a4a2: "so most of its citizens are miners and merchants."
  npc_override_harboro1_quests_rockridge_so_now_act_like_god_26f4f1: "So for now, act like the god's servant that you are."
  npc_override_harboro1_quests_rockridge_so_we_had_drill_vents_e5c75f: "so we had to drill the vents and the workers' passage directly from the ground level."
  npc_override_harboro1_quests_rockridge_so_we_ve_been_discussing_2b0520: "So we've been discussing our next move."
  npc_override_harboro1_quests_rockridge_so_what_i_help_ef1a01: "So, what can I do to help?"
  npc_override_harboro1_quests_rockridge_so_you_could_prepare_you_79b2e1: "So you could prepare yourself for your punishment."
  npc_override_harboro1_quests_rockridge_so_you_d_scared_want_3df43f: "So you'd be scared and want to stay away."
  npc_override_harboro1_quests_rockridge_so_you_re_strong_enough_6299ed: "So, you're strong enough to"
  npc_override_harboro1_quests_rockridge_so_you_things_i_might_cade42: "So you have things that I might have interest in on buying?"
  npc_override_harboro1_quests_rockridge_some_cacti_don_t_like_16c226: "Some Cacti don't like the pioneers, but, Leaf, remember they're also children of Mother Nature."
  npc_override_harboro1_quests_rockridge_some_come_out_you_eventu_45266d: "Some of it has to come out of you eventually. Poor beans. They'd be angry to be eaten by jerks like you."
  npc_override_harboro1_quests_rockridge_some_items_cannot_delete_0b90ff: "Some of the items cannot be deleted."
  npc_override_harboro1_quests_rockridge_some_miners_reported_us_681746: "Some miners have reported to us about gas-like monsters that spread a neurotoxin."
  npc_override_harboro1_quests_rockridge_some_workers_went_down_b_f1b0e4: "Some workers went down to the basement for repair work and heard strange rustling noises."
  npc_override_harboro1_quests_rockridge_someone_must_piled_mound_dd90c8: "- Someone must have piled this mound of sand. -"
  npc_override_harboro1_quests_rockridge_someone_needs_convince_a_f08b1e: "Someone needs to convince Albert that Johnny isn't worth a dime as a hostage,"
  npc_override_harboro1_quests_rockridge_something_inside_8e0018: "It has something inside it. -"
  npc_override_harboro1_quests_rockridge_something_shining_inside_d5fab4: "It has something shining inside it,"
  npc_override_harboro1_quests_rockridge_sometimes_he_says_things_eb5cbd: "Sometimes he says things that I can't understand, but it's okay."
  npc_override_harboro1_quests_rockridge_soon_he_ll_tried_court_8d047c: "Soon he'll be tried in a court of law."
  npc_override_harboro1_quests_rockridge_soon_i_m_going_take_e9f58d: "Soon, I'm going to take a few miners who recovered enough to work on the second floor of the mine."
  npc_override_harboro1_quests_rockridge_soon_when_daddy_go_work_115498: "Soon. When Daddy can go work at the mine again. When Mommy and Daddy make enough money to buy back the house."
  npc_override_harboro1_quests_rockridge_sorry_i_lock_your_mane_1bcbd9: "Sorry, but can I have a lock of your mane?"
  npc_override_harboro1_quests_rockridge_sorry_we_need_someone_st_2320a1: "Sorry, but we need someone stronger than you."
  npc_override_harboro1_quests_rockridge_souvenirs_i_ve_got_souve_85bd62: "Souvenirs! I've got souvenirs!"
  npc_override_harboro1_quests_rockridge_spotty_digs_holes_buries_d9f4a9: "Spotty digs holes and buries things in them every day. If you find holes in the wasteland, please look inside them."
  npc_override_harboro1_quests_rockridge_spotty_perfect_dog_if_he_0a39d6: "Spotty would be a perfect dog if he doesn't take things out of the house. Sigh..."
  npc_override_harboro1_quests_rockridge_spotty_you_alright_don_t_6d9898: "Spotty, are you alright? Don't be scared. Daddy's with you."
  npc_override_harboro1_quests_rockridge_spotty_you_want_treat_hm_2b265c: "Spotty, do you want a treat? Hmm?"
  npc_override_harboro1_quests_rockridge_stand_tall_travel_world_e608cb: "Stand tall and travel the world like you own it!"
  npc_override_harboro1_quests_rockridge_startled_coyote_scuttled_c36f33: "- Startled, the coyote scuttled backward. I moved close to check what it dropped. It's a juice mix package! -"
  npc_override_harboro1_quests_rockridge_still_i_t_help_think_c5da70: "But still I can't help but think that everything's happening too fast."
  npc_override_harboro1_quests_rockridge_stop_looking_outside_win_78a8db: "Stop looking outside the window."
  npc_override_harboro1_quests_rockridge_stop_lying_4466ff: "Stop lying!"
  npc_override_harboro1_quests_rockridge_stop_whining_like_wimps_e9dbd6: "Stop whining like wimps. Be proud to be part of the team and work harder!"
  npc_override_harboro1_quests_rockridge_strange_adventurer_i_ve_7504c4: "Strange Adventurer. I've asked you to hunt ^0000CD30 Coyotes^000000. How are you doing with it?"
  npc_override_harboro1_quests_rockridge_strange_adventurer_thank_093507: "Strange Adventurer, thank you for coming back."
  npc_override_harboro1_quests_rockridge_strange_adventurer_you_s_996d91: "Strange adventurer, would you be so kind as to find the agave drink mix I lost in the wasteland?"
  npc_override_harboro1_quests_rockridge_stranger_8855be: "Stranger..."
  npc_override_harboro1_quests_rockridge_strangers_lost_battle_se_0ee232: "The strangers lost the battle with the sea and relinquished their homes. I thought they'd leave, but they're as resilient as weeds; they built another village on top of their old homes."
  npc_override_harboro1_quests_rockridge_stupid_bandits_i_t_belie_65c22a: "Stupid bandits, I can't believe they broke the elevator just to hide the ores."
  npc_override_harboro1_quests_rockridge_stupid_buffaloes_7dc3ed: "Stupid buffaloes."
  npc_override_harboro1_quests_rockridge_sure_37a98c: "Sure."
  npc_override_harboro1_quests_rockridge_sure_i_9fe937: "Sure, I can do that."
  npc_override_harboro1_quests_rockridge_sure_i_you_want_me_e46f36: "Sure, I can do that. You want me to ^0000CDfind 5 Agave Juice Mixes and hunt 30 Coyotes^000000, right?"
  npc_override_harboro1_quests_rockridge_sure_thing_da4966: "Sure thing."
  npc_override_harboro1_quests_rockridge_sure_why_d9c786: "Sure, why not?"
  npc_override_harboro1_quests_rockridge_swamp_arclouzes_fast_car_7d3dec: "Swamp Arclouzes are fast, carnivorous insects living down there, and their number has been increasing at such an alarming rate that workers now refuse to go in there to work."
  npc_override_harboro1_quests_rockridge_sweet_potato_croquettes_1354d5: "Sweet potato croquettes are on the menu today, and I can't make them because I didn't get the regular shipment from the mainland."
  npc_override_harboro1_quests_rockridge_sweetheart_please_calm_d_7b57f4: "Sweetheart, please calm down. Is it possible you left it where he could reach it?"
  npc_override_harboro1_quests_rockridge_t_you_get_water_elsewher_9d45a9: "Can't you get water elsewhere?"
  npc_override_harboro1_quests_rockridge_t_you_just_attend_meetin_41bdb9: "Can't you just attend the meeting, maybe pretend to be someone from HQ?"
  npc_override_harboro1_quests_rockridge_t_you_see_big_beautiful_c3f981: "Can't you see the big beautiful gold coin on the roof of this building?"
  npc_override_harboro1_quests_rockridge_take_care_bandits_7f86b4: "take care of the bandits."
  npc_override_harboro1_quests_rockridge_take_more_things_a0ed22: "take more things"
  npc_override_harboro1_quests_rockridge_take_your_time_37b967: "Take your time."
  npc_override_harboro1_quests_rockridge_takes_up_lot_my_time_10c167: "takes up a lot of my time."
  npc_override_harboro1_quests_rockridge_talking_4dc1e6: "by talking to"
  npc_override_harboro1_quests_rockridge_tattered_fabric_pouch_ha_00fc8d: "- A tattered fabric pouch is half buried in the mound of sand, but I'm carrying too much to examine it. I'd better lighten my bag first. -"
  npc_override_harboro1_quests_rockridge_tattered_fabric_pouch_ha_66babc: "- A tattered fabric pouch is half buried in the mound of sand. It could be Mrs. Cacturon's juice mix package. -"
  npc_override_harboro1_quests_rockridge_tattered_fabric_pouch_ha_adf8f7: "- A tattered fabric pouch is half buried in the mound of sand. I think it's just trash. -"
  npc_override_harboro1_quests_rockridge_tell_him_d6dfdc: "Tell him"
  npc_override_harboro1_quests_rockridge_tell_him_longer_they_sta_ba745a: "Tell him the longer they stay inside the mine, the slimmer their chances of living."
  npc_override_harboro1_quests_rockridge_tell_johnny_albert_other_fc440d: "tell Johnny that Albert and the others have abandoned him. Albert is their leader now!"
  npc_override_harboro1_quests_rockridge_tell_me_what_job_entails_269ea5: "Tell me what this job entails."
  npc_override_harboro1_quests_rockridge_tell_them_you_d_talk_36db3f: "and tell them you'd have to talk to the Headquarters first."
  npc_override_harboro1_quests_rockridge_tell_us_where_ores_3d58f6: "Tell us where the ores are."
  npc_override_harboro1_quests_rockridge_temporary_passage_connec_26d3a6: "That temporary passage is connected to the farthest corner on the second floor,"
  npc_override_harboro1_quests_rockridge_temporary_passage_drille_ca76b7: "The temporary passage drilled for development purposes will stay useful."
  npc_override_harboro1_quests_rockridge_temporary_passage_isn_t_0dec21: "And the temporary passage isn't safe, not since it was re-drilled."
  npc_override_harboro1_quests_rockridge_than_what_you_need_93a1b3: "than what you need."
  npc_override_harboro1_quests_rockridge_thank_you_174534: "Thank you."
  npc_override_harboro1_quests_rockridge_thank_you_doing_me_0bc9e6: "Thank you for doing this for me."
  npc_override_harboro1_quests_rockridge_thank_you_doing_me_findi_da76a3: "Thank you for doing this for me. And finding ^0000CD5 juice mixes^000000. Things would've been a lot more difficult if it weren't for you. Thank you."
  npc_override_harboro1_quests_rockridge_thank_you_helping_us_c148fd: "Thank you for helping us."
  npc_override_harboro1_quests_rockridge_thank_you_hunting_coyote_44f993: "Thank you for hunting coyotes for me. By the way, haven't you seen some ^0000CDjuice mix packages^000000 around them?"
  npc_override_harboro1_quests_rockridge_thank_you_please_take_s_ed329f: "Thank you. Please take this. It's not much, but I hope you'll like it."
  npc_override_harboro1_quests_rockridge_thank_you_your_help_3a7d59: "Thank you for your help."
  npc_override_harboro1_quests_rockridge_thank_you_your_time_f99122: "Thank you for your time."
  npc_override_harboro1_quests_rockridge_thank_you_your_understan_b6942b: "Thank you for your understanding. Have a good day."
  npc_override_harboro1_quests_rockridge_thanks_a8b40f: "But thanks."
  npc_override_harboro1_quests_rockridge_thanks_here_take_f63a9b: "Thanks! Here, take this."
  npc_override_harboro1_quests_rockridge_thanks_them_i_ve_got_c9858c: "But thanks to them, I've got a lucrative job."
  npc_override_harboro1_quests_rockridge_then_again_you_could_lyi_408a21: "But then again, you could be lying to me."
  npc_override_harboro1_quests_rockridge_then_few_years_ago_7eede2: "Then a few years ago"
  npc_override_harboro1_quests_rockridge_then_i_ll_use_force_9a68bf: "then I'll have to use force."
  npc_override_harboro1_quests_rockridge_then_i_saw_you_you_f9b250: "Then I saw you, and you stood out like a wolf among sheep. That is, you've passed! Congratulations!"
  npc_override_harboro1_quests_rockridge_then_let_s_go_0b4b79: "Then let's go."
  npc_override_harboro1_quests_rockridge_then_let_s_go_3d4232: "Then let's go!"
  npc_override_harboro1_quests_rockridge_then_some_time_ago_monst_2dd36d: "Then some time ago, monsters started showing up in the basement, and now our workers are too scared to work. That's the situation we're in right now."
  npc_override_harboro1_quests_rockridge_then_we_re_all_right_468a35: "Then we're all right. Let's just keep moving, and we'll meet Grandma soon."
  npc_override_harboro1_quests_rockridge_then_what_you_waiting_5c1699: "Then what are you waiting for?"
  npc_override_harboro1_quests_rockridge_then_why_don_t_you_cc2751: "Then why don't you let me bring it back to its owner? Mrs. Cacturon's child is upset because he can't have his favorite juice. I only want him to be happy."
  npc_override_harboro1_quests_rockridge_there_81b5ac: "There."
  npc_override_harboro1_quests_rockridge_there_aren_t_many_people_be19ef: "There aren't many people in this restaurant."
  npc_override_harboro1_quests_rockridge_there_lot_ores_buried_fl_cf52ad: "There are a lot of ores buried in that floor, so we've been producing several times the amount we did on the first floor."
  npc_override_harboro1_quests_rockridge_there_many_things_189550: "There are many things to do."
  npc_override_harboro1_quests_rockridge_there_only_one_floor_ins_a41092: "There was only one floor inside the mine,"
  npc_override_harboro1_quests_rockridge_there_only_sand_rocks_ou_17f511: "But there are only sand and rocks out there, and nothing edible. I can't believe I thought I could run a kitchen in a place like this."
  npc_override_harboro1_quests_rockridge_there_others_who_make_go_b1ed78: "There are others who make good nets, but I'm the one who gives the nets their finishing touch."
  npc_override_harboro1_quests_rockridge_there_s_7bd232: "that there's"
  npc_override_harboro1_quests_rockridge_there_s_broken_elevator_037d6c: "There's a broken elevator."
  npc_override_harboro1_quests_rockridge_there_s_hole_ground_a47856: "- There's a hole in the ground."
  npc_override_harboro1_quests_rockridge_there_s_nice_looking_roc_43038c: "There's a nice-looking rock! Alley-oop!"
  npc_override_harboro1_quests_rockridge_there_s_no_way_he_a87a5a: "There's no way he'd want to go there."
  npc_override_harboro1_quests_rockridge_there_s_nothing_we_could_a3e341: "There's nothing we could do. The Buffalo Bandits stole our last shipment, and it won't be the last time they do it."
  npc_override_harboro1_quests_rockridge_there_s_something_weird_7b94b8: "- There's something weird about this mound of sand, but but I'm carrying too much to examine it. I'd better lighten my bag first. -"
  npc_override_harboro1_quests_rockridge_there_s_time_everything_8a3b70: "There's a time for everything."
  npc_override_harboro1_quests_rockridge_there_so_many_mouths_fee_ee9a98: "There are so many mouths to feed, and yet I've got no meat? This is disaster!"
  npc_override_harboro1_quests_rockridge_there_so_many_problems_6a7979: "There are so many problems"
  npc_override_harboro1_quests_rockridge_there_so_many_them_would_0fd703: "But there are so many of them that this wouldn't even leave a dent on them. I want to take it further."
  npc_override_harboro1_quests_rockridge_there_so_many_things_78f8c0: "There are so many things to do"
  npc_override_harboro1_quests_rockridge_there_some_juice_mixes_s_2eb67c: "There have to be some juice mixes still left in there. I'll appreciate if you can just find 5."
  npc_override_harboro1_quests_rockridge_there_trees_growing_sea_4af250: "There are trees growing on the sea, and they all look alike."
  npc_override_harboro1_quests_rockridge_there_you_meet_people_wh_9510e0: "There, you can meet people who offer jobs and meals."
  npc_override_harboro1_quests_rockridge_these_ores_worthless_unl_44fc60: "These ores are worthless unless they're processed,"
  npc_override_harboro1_quests_rockridge_these_tauruses_warlike_p_9b7930: "These Tauruses are warlike, and pillaging is their only way of living."
  npc_override_harboro1_quests_rockridge_they_could_buried_ground_1e82ca: "^FF0000They could be buried in the ground, picked up by someone, or found by coyotes.^000000"
  npc_override_harboro1_quests_rockridge_they_d_patrol_around_ele_41b7a8: "they'd patrol around the elevator."
  npc_override_harboro1_quests_rockridge_they_don_t_want_know_b309cc: "They don't want to know or care. You have to be in a pretty bad situation to end up here."
  npc_override_harboro1_quests_rockridge_they_keep_guard_over_und_e74d71: "They keep guard over it under Sheriff Warp's command."
  npc_override_harboro1_quests_rockridge_they_ll_help_create_situ_4f92b3: "They'll help create the situation Sheriff Warp wants."
  npc_override_harboro1_quests_rockridge_they_must_lost_their_min_53ddd2: "They must have lost their minds!"
  npc_override_harboro1_quests_rockridge_they_re_as_thin_as_2cdaea: "They're as thin as fingers, and once I almost put my fingers into a stew instead of them."
  npc_override_harboro1_quests_rockridge_they_re_begging_c7d192: "They're begging."
  npc_override_harboro1_quests_rockridge_they_re_eager_all_right_ad3ca8: "They're eager, all right, but none of them is strong enough to be useful."
  npc_override_harboro1_quests_rockridge_they_re_first_floor_so_3fd143: "They're on the first floor, so we're just going to block the elevator."
  npc_override_harboro1_quests_rockridge_they_re_middle_ranking_o_6ddc26: "They're the middle-ranking officers of masked buffaloes. I want you to get rid of 10 ^0000ffBuffalo Bandits wearing green masks^000000."
  npc_override_harboro1_quests_rockridge_they_re_middle_ranking_o_f331e9: "They're the middle-ranking officers of rifle buffaloes. I want you to get rid of 10 ^0000ffrifle Buffalo Bandits with glowing blue eyes^000000."
  npc_override_harboro1_quests_rockridge_they_re_middle_ranking_o_fc6081: "They're the middle-ranking officers of sword buffaloes. I want you to get rid of 10 ^0000ffBuffalo Bandits wearing an eye patch and a pale green vest^000000."
  npc_override_harboro1_quests_rockridge_they_re_purple_monsters_3eb35b: "They're purple monsters named Gasters. They don't attack unless they're provoked, but they still pose a threat."
  npc_override_harboro1_quests_rockridge_they_re_under_elevator_s_cfae40: "They're ^4d4dffunder the elevator on the second floor of the mine^000000."
  npc_override_harboro1_quests_rockridge_they_re_very_good_friend_2c74ed: "They're very good friends to us."
  npc_override_harboro1_quests_rockridge_they_t_even_come_up_2fe262: "They can't even come up with their own signals."
  npc_override_harboro1_quests_rockridge_they_think_they_re_smart_d23fdf: "They think they're smart,"
  npc_override_harboro1_quests_rockridge_they_ve_been_invading_vi_937c88: "And they've been invading this village every so often, as if to test how long we could last."
  npc_override_harboro1_quests_rockridge_they_want_bargain_over_o_6e23c6: "They want to bargain over the ores that they've stolen."
  npc_override_harboro1_quests_rockridge_they_want_talk_me_wyatt_a28323: "And they want to talk to me and Wyatt and no one else."
  npc_override_harboro1_quests_rockridge_think_about_your_future_c89e88: "Think about your future."
  npc_override_harboro1_quests_rockridge_those_darn_buffalo_bandi_ff946c: "Those darn Buffalo Bandits!"
  npc_override_harboro1_quests_rockridge_those_days_my_whole_fami_fd04f4: "On those days, my whole family would gather around and make agave juice together. We'd also grill steaks wrapped in agave leaves, and sometimes relatives from far away would also visit us to play music and dance together all night."
  npc_override_harboro1_quests_rockridge_those_evil_bandits_how_c_07a6b6: "Those evil bandits, how could they shoot their guns near puppies?"
  npc_override_harboro1_quests_rockridge_those_goddamn_ores_reaso_dea17a: "Those goddamn ores are the reason why we're in this mess."
  npc_override_harboro1_quests_rockridge_threaten_him_9ff582: "Threaten him."
  npc_override_harboro1_quests_rockridge_time_5e2772: "Not this time."
  npc_override_harboro1_quests_rockridge_today_spotty_took_could_c91591: "Today Spotty took a {0}. Could you look for it? It may be easily replaceable, but I can't keep buying things every time Spotty takes something."
  npc_override_harboro1_quests_rockridge_too_much_handle_i_don_e422c0: "But this is too much to handle. I don't think I can do this anymore."
  npc_override_harboro1_quests_rockridge_train_brings_ores_mine_b_74661e: "The train brings ores from the mine, and brings supplies for the miners from this dock."
  npc_override_harboro1_quests_rockridge_traitor_thought_he_d_liv_58b49d: "That traitor thought he'd live longer than I would."
  npc_override_harboro1_quests_rockridge_try_stay_right_track_7ccd6c: "Try to stay in the right track."
  npc_override_harboro1_quests_rockridge_tumbleweed_rolling_aroun_329a29: "It has a tumbleweed rolling around inside it. -"
  npc_override_harboro1_quests_rockridge_turn_into_weeping_drooli_884c81: "and turn into a weeping, drooling, sniffling mess. *Shudder*"
  npc_override_harboro1_quests_rockridge_ugh_their_staring_eyes_m_6d4f5b: "Ugh, their staring eyes are making me feel too uncomfortable to eat."
  npc_override_harboro1_quests_rockridge_uh_oh_i_d_better_17c7fd: "Uh-oh, I'd better go take care of that situation. Come back if you change your mind."
  npc_override_harboro1_quests_rockridge_um_what_s_hair_your_c7a369: "Um? What's that hair in your hand?"
  npc_override_harboro1_quests_rockridge_under_village_there_s_sh_be168c: "And under the village, there's?*Shudder* let's not go there."
  npc_override_harboro1_quests_rockridge_unless_you_re_going_expl_5f7067: "Unless you're going to explain it yourself, just shut up and let me do it!"
  npc_override_harboro1_quests_rockridge_unoccupied_until_you_arr_7e20ff: "Was it unoccupied until you arrived?"
  npc_override_harboro1_quests_rockridge_unprocessed_ores_just_li_f009b8: "Unprocessed ores. Just like the ones that the bandits stole from us."
  npc_override_harboro1_quests_rockridge_up_we_go_db4e4e: "Up we go!"
  npc_override_harboro1_quests_rockridge_us_a830ea: "for us."
  npc_override_harboro1_quests_rockridge_usually_ship_fare_zeny_o_87fff6: "Usually, the ship fare is ^4d4dff10,000 Zeny^000000 for a one-way trip,"
  npc_override_harboro1_quests_rockridge_vigilante_badge_l_a7ae60: "Vigilante Badge (L)"
  npc_override_harboro1_quests_rockridge_vigilantes_sheriff_had_e_869e95: "The Vigilantes and the Sheriff have had enough with them, now that they started robbing the train."
  npc_override_harboro1_quests_rockridge_village_run_out_drinking_c51d0e: "This village will run out of drinking water. Someone has to do this. Believe it or not, I'm doing doing this entirely for profit."
  npc_override_harboro1_quests_rockridge_wah_geez_who_you_07790c: "Wah! Geez, who are you?"
  npc_override_harboro1_quests_rockridge_wah_my_agave_flavored_ju_aa4e09: "Wah! My agave-flavored juice! Wah!"
  npc_override_harboro1_quests_rockridge_wah_wah_my_agave_flavore_9c0a0f: "Wah! WAH! My agave-flavored juice!"
  npc_override_harboro1_quests_rockridge_wah_who_you_64cf41: "Wah! Who are you?"
  npc_override_harboro1_quests_rockridge_wait_1ae604: "WAIT!"
  npc_override_harboro1_quests_rockridge_wait_did_you_just_say_cec21a: "^990000Wait, did you just say you have no ingredients? You ran out of them?^000000"
  npc_override_harboro1_quests_rockridge_wait_honey_you_should_th_d94f5c: "Wait, honey. You should think again. You and I are too afraid of the Buffalo Bandits to go out to the wasteland."
  npc_override_harboro1_quests_rockridge_wait_then_why_you_bother_3a83fe: "Wait, then why are you bothering me? Can't you see I'm upset because of the missing shipment?"
  npc_override_harboro1_quests_rockridge_wait_today_s_better_s_c73931: "Wait, today's better. It's a perfect day to hang a buffalo!"
  npc_override_harboro1_quests_rockridge_wait_what_my_husband_fee_aea1fe: "Wait, what is my husband feeding that dog? Honey! That was our dinner!"
  npc_override_harboro1_quests_rockridge_wait_yes_5409af: "Wait. Yes."
  npc_override_harboro1_quests_rockridge_wait_you_781627: "Wait! ...You!"
  npc_override_harboro1_quests_rockridge_wait_you_re_stranger_f9b680: "Wait, you're the stranger"
  npc_override_harboro1_quests_rockridge_wasn_t_factory_made_powd_b2f365: "It wasn't factory-made powder. Real agave juice took so much time and effort to make that we only drank it on special occasions."
  npc_override_harboro1_quests_rockridge_wasn_t_too_difficult_2802d7: "It wasn't too difficult, was it?"
  npc_override_harboro1_quests_rockridge_watch_your_feet_577a57: "Watch your feet."
  npc_override_harboro1_quests_rockridge_watching_him_so_happy_dr_3ccd43: "Watching him so happy to drink that fake juice reminds me of the real agave juice I used to drink when I was young."
  npc_override_harboro1_quests_rockridge_way_what_s_shining_thing_6d0f6b: "By the way, what's that shining thing in your hand?"
  npc_override_harboro1_quests_rockridge_way_where_s_costello_he_d36cf6: "By the way, where's Costello? He's the mayor? He can't disappear on me at a critical time like this!"
  npc_override_harboro1_quests_rockridge_way_you_ve_declared_war_bd2dda: "By the way, you've declared war against Albert Ford."
  npc_override_harboro1_quests_rockridge_way_you_ve_grown_pretty_3740ee: "By the way, you've grown pretty strong."
  npc_override_harboro1_quests_rockridge_we_broke_elevator_so_we_239e29: "We broke the elevator, so we could hide them underneath it."
  npc_override_harboro1_quests_rockridge_we_built_house_scratch_o_c8d62d: "We built this house from scratch, on our own from the foundation stones to the roofing."
  npc_override_harboro1_quests_rockridge_we_cacti_don_t_hunt_fb4e7f: "But we Cacti don't hunt for pleasure. Teaching that to our children is challenging while adventurers are around them constantly."
  npc_override_harboro1_quests_rockridge_we_cacti_want_preserve_o_9a7b4a: "But we Cacti want to preserve our traditions as best we can, to teach them to our children."
  npc_override_harboro1_quests_rockridge_we_call_him_quiet_joe_2755ed: "We call him Quiet Joe."
  npc_override_harboro1_quests_rockridge_we_could_always_invade_y_7e2604: "We could always invade your village and bring the Boss back with us!"
  npc_override_harboro1_quests_rockridge_we_could_become_pathfind_22e8a9: "Or we could become the pathfinders of an unknown world!"
  npc_override_harboro1_quests_rockridge_we_could_tell_him_albert_3c48b0: "We could tell him Albert has given up on him,"
  npc_override_harboro1_quests_rockridge_we_could_use_convince_ba_0b8364: "We could use it to convince the bandits that the mine is not as useful as they think it is."
  npc_override_harboro1_quests_rockridge_we_couldn_t_built_rock_0b1d28: "We couldn't have built Rock Ridge if it weren't for them."
  npc_override_harboro1_quests_rockridge_we_d_better_bring_more_be1efa: "We'd better bring in more adventurers, so we could get rid of the bandits at once!"
  npc_override_harboro1_quests_rockridge_we_dig_mines_build_house_942fd6: "We dig mines, build houses! No seawater or sandstorms can stop us!"
  npc_override_harboro1_quests_rockridge_we_don_t_even_know_17b7ee: "But we don't even know where we are."
  npc_override_harboro1_quests_rockridge_we_don_t_need_chapel_462c72: "We don't need a chapel. Odin doesn't come to buildings, he comes to our hearts."
  npc_override_harboro1_quests_rockridge_we_don_t_need_ores_dd48d3: "we don't need the ores"
  npc_override_harboro1_quests_rockridge_we_don_t_pay_him_f19284: "But we don't have to pay him if you tell us where they are."
  npc_override_harboro1_quests_rockridge_we_don_t_take_407ef3: "and we don't take"
  npc_override_harboro1_quests_rockridge_we_don_t_time_argue_2a0a49: "We don't have time to argue."
  npc_override_harboro1_quests_rockridge_we_great_pioneers_rock_r_e32f66: "We are the great pioneers of Rock Ridge! Hey, ho!"
  npc_override_harboro1_quests_rockridge_we_haven_t_worked_days_8eb730: "We haven't worked for days. Can you believe that?"
  npc_override_harboro1_quests_rockridge_we_just_t_work_because_eddc2e: "We just can't work because of the bandits squatting in the mine."
  npc_override_harboro1_quests_rockridge_we_keep_rifle_house_self_c247f4: "We keep a rifle in the house for self-defense purposes, and the other day I noticed Spotty trembled like a leaf when he saw it."
  npc_override_harboro1_quests_rockridge_we_know_another_passage_593217: "We know another passage leads to the second floor of the mine."
  npc_override_harboro1_quests_rockridge_we_lived_harmony_nature_b3d618: "we lived in harmony with nature."
  npc_override_harboro1_quests_rockridge_we_ll_attack_your_villag_821138: "We'll attack your village and raze it to the ground!"
  npc_override_harboro1_quests_rockridge_we_ll_careful_course_sin_af47f5: "We'll have to be careful, of course, since the bandits are still inside the mine."
  npc_override_harboro1_quests_rockridge_we_ll_counting_you_adven_0062ce: "We'll be counting on you, Adventurer!"
  npc_override_harboro1_quests_rockridge_we_ll_counting_you_kiddo_9e97bd: "We'll be counting on you, kiddo!"
  npc_override_harboro1_quests_rockridge_we_ll_counting_you_kiddo_eaa483: "We'll be counting on you, kiddo! I'll repay you generously when you come back. I was able to nab a few things while in jail at the sheriff's office. Now, off you go!"
  npc_override_harboro1_quests_rockridge_we_ll_hang_you_all_dd7ff6: "We'll hang you? All of you!"
  npc_override_harboro1_quests_rockridge_we_ll_last_laugh_7affbb: "We'll have the last laugh!"
  npc_override_harboro1_quests_rockridge_we_ll_wait_him_train_3ab570: "We'll wait for him by the train."
  npc_override_harboro1_quests_rockridge_we_made_hurry_so_s_442fa1: "We made it in a hurry, so it's a bit unsafe sometimes. Hah hah."
  npc_override_harboro1_quests_rockridge_we_need_lot_people_const_4cf774: "We need a lot of people at a construction site. It's... a little bit dangerous down there, but you look like you know how to deal with danger."
  npc_override_harboro1_quests_rockridge_we_need_ore_fool_albert_852c65: "We need an ore to fool Albert and the other bandits. Do you want to go get it now?"
  npc_override_harboro1_quests_rockridge_we_no_one_else_turn_81f3d5: "We have no one else to turn to, and I can't think of a better way than this. Let's take a chance on this adventurer."
