  npc_override_harboro1_quests_rockridge_we_ve_got_great_plan_8de1db: "We've got a great plan."
  npc_override_harboro1_quests_rockridge_we_ve_saved_lot_ores_33de5a: "We've saved a lot of ores, enough not to miss the tiny amount you've stolen from us."
