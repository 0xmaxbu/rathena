Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@dth3_IsleOfBios_cancel_ebda43: "Cancel."
  npc_override_1@dth3_IsleOfBios_characters_below_level_c_b8f731: "^ff0000Characters below Level 160 cannot enter this dungeon.^000000"
  npc_override_1@dth3_IsleOfBios_created_memorial_dungeon_f07943: "^ff0000Created the Memorial dungeon.^000000"
  npc_override_1@dth3_IsleOfBios_enter_isle_bios_d7cd53: "Enter Isle of Bios."
  npc_override_1@dth3_IsleOfBios_hero_token_accident_ad1146: "this Hero Token by accident."
  npc_override_1@dth3_IsleOfBios_i_came_a59a6e: "I came by"
  npc_override_1@dth3_IsleOfBios_i_couldn_t_shake_off_c84480: "I couldn't shake off the vivid images I saw in that nightmare. I've wandered off and around like a madman and finally arrived here."
  npc_override_1@dth3_IsleOfBios_i_don_t_know_when_f59cab: "I don't know when it began..."
  npc_override_1@dth3_IsleOfBios_i_m_afraid_you_re_246b72: "I'm afraid you're not up for this yet."
  npc_override_1@dth3_IsleOfBios_i_saw_place_my_dream_303d15: "I saw this place in my dream. It's where Demon God Morocc awakens from his slumber. My dream was showing me a possible future."
  npc_override_1@dth3_IsleOfBios_i_want_give_you_you_6b8f87: "I want to give it to you. You deserve it."
  npc_override_1@dth3_IsleOfBios_if_my_dream_really_premo_f36d7b: "If my dream really is a premonition, the forces of Demon God Morocc's are within that yellow seed."
  npc_override_1@dth3_IsleOfBios_let_s_get_out_creepy_341a87: "Let's get out of this creepy place!"
  npc_override_1@dth3_IsleOfBios_memorial_dungeon_cannot_018e49: "^ff0000This Memorial Dungeon cannot be accessed for 23 hours after your last visit.^000000"
  npc_override_1@dth3_IsleOfBios_menu_grim_01a451: "Grim Reaper Ankou: Feel the fear of death!"
  npc_override_1@dth3_IsleOfBios_menu_grim_08f64b: "Grim Reaper Ankou: Ahead of you is an army of the immortal."
  npc_override_1@dth3_IsleOfBios_menu_grim_1ce0c1: "Grim Reaper Ankou: *Chuckle* At least one of you has a good head on his shoulders."
  npc_override_1@dth3_IsleOfBios_menu_grim_2e3d12: "Grim Reaper Ankou: That's right. It's time for you to experience death."
  npc_override_1@dth3_IsleOfBios_menu_grim_33810b: "Grim Reaper Ankou: Right back at you, bigmouth."
  npc_override_1@dth3_IsleOfBios_menu_grim_44741f: "Grim Reaper Ankou: Are you curious about your next adversaries?"
  npc_override_1@dth3_IsleOfBios_menu_grim_468a0b: "Grim Reaper Ankou: *Chuckle* This is the Isle of Bios, a place I conjured up in my mind."
  npc_override_1@dth3_IsleOfBios_menu_grim_47d194: "Grim Reaper Ankou: *Chuckle*"
  npc_override_1@dth3_IsleOfBios_menu_grim_4be5f6: "Grim Reaper Ankou: Lord Morocc will return soon."
  npc_override_1@dth3_IsleOfBios_menu_grim_58e4cf: "Grim Reaper Ankou: I want to watch you die slowly and painfully. *Chuckle*"
  npc_override_1@dth3_IsleOfBios_menu_grim_5bb417: "Grim Reaper Ankou: I'll teach you how terrifying it is to be helpless in the face of horror!"
  npc_override_1@dth3_IsleOfBios_menu_grim_95e9c2: "Grim Reaper Ankou: I underestimated you, or my soldiers aren't as strong as I thought."
  npc_override_1@dth3_IsleOfBios_menu_grim_9994f4: "Grim Reaper Ankou: You must have noticed my soldiers have grown up before the sunset."
  npc_override_1@dth3_IsleOfBios_menu_grim_9c0cd4: "Grim Reaper Ankou: Don't tempt me, human."
  npc_override_1@dth3_IsleOfBios_menu_grim_9c2f72: "Grim Reaper Ankou: You've walked into the trap, making yourself willing sacrifices for my Lord Morocc. Aren't you afraid of dying?"
  npc_override_1@dth3_IsleOfBios_menu_grim_9d2c9e: "Grim Reaper Ankou: You're strong..."
  npc_override_1@dth3_IsleOfBios_menu_grim_a8d6a2: "Grim Reaper Ankou: But my goal has been accomplished... Don't think this is over."
  npc_override_1@dth3_IsleOfBios_menu_grim_b0fa03: "Grim Reaper Ankou: After nightfall, they've reached the final stage of their development: life beyond death."
  npc_override_1@dth3_IsleOfBios_menu_grim_b1419b: "Grim Reaper Ankou: You're still talking. I'll just kill you myself and get it over with!"
  npc_override_1@dth3_IsleOfBios_menu_grim_c05c6c: "Grim Reaper Ankou: Soon Lord Morocc will return. *Chuckle* The fear of death will follow you wherever you go."
  npc_override_1@dth3_IsleOfBios_menu_grim_c7c989: "Grim Reaper Ankou: Get ready to feel the fear of death! *Chuckle*"
  npc_override_1@dth3_IsleOfBios_menu_grim_cec92a: "Grim Reaper Ankou: Is this the best you can do? Such weak creatures, you humans."
  npc_override_1@dth3_IsleOfBios_menu_grim_dfa1ea: "Grim Reaper Ankou: On the Isle of Bios, each day is a lifetime."
  npc_override_1@dth3_IsleOfBios_menu_grim_f758f1: "Grim Reaper Ankou: *Chuckle* Come out, my soldiers!"
  npc_override_1@dth3_IsleOfBios_menu_i_f9ad0d: "I tried to enter the seed, but to no avail: I'm just too old and weak. But perhaps you can."
  npc_override_1@dth3_IsleOfBios_menu_options_c01e87: "???: *Chuckle* Do you want to know where you are?"
  npc_override_1@dth3_IsleOfBios_menu_system_64fcd7: "System: {0} monsters remain on the island."
  npc_override_1@dth3_IsleOfBios_menu_system_90001a: "System: You have eliminated all the monsters. Use the exit at 3 o'clock to move on to the next area."
  npc_override_1@dth3_IsleOfBios_menu_system_98ae33: "System: Eliminate all the enemies on the island and exit through the door on the other side to move on to the next area."
  npc_override_1@dth3_IsleOfBios_menu_system_b3ae78: "System: 1 last monster remains on the island."
  npc_override_1@dth3_IsleOfBios_menu_vrid_024bd3: "Vrid: If it weren't for Zeith, I'd still be in there, wandering. Thanks, Zeith."
  npc_override_1@dth3_IsleOfBios_menu_vrid_0678de: "Vrid: Damn it, the undead are coming, but I can't fight because I can't move my feet!"
  npc_override_1@dth3_IsleOfBios_menu_vrid_093117: "Vrid: I want to give you something for saving our lives. Talk to me again when you're ready to accept it."
  npc_override_1@dth3_IsleOfBios_menu_vrid_12c712: "Vrid: Um, I think you're right."
  npc_override_1@dth3_IsleOfBios_menu_vrid_1455c2: "Vrid: Let's chase him! Zeith, hurry!"
  npc_override_1@dth3_IsleOfBios_menu_vrid_16dab8: "Vrid: Ugh! W-what's going on?! I-I can't move!"
  npc_override_1@dth3_IsleOfBios_menu_vrid_1bdf41: "Vrid: Damn it, I can't move..."
  npc_override_1@dth3_IsleOfBios_menu_vrid_266965: "Vrid: To me, that sounds natural. What are you worried about?"
  npc_override_1@dth3_IsleOfBios_menu_vrid_319911: "Vrid: Ack, I'm sorry we can't help."
  npc_override_1@dth3_IsleOfBios_menu_vrid_3640a9: "Vrid: You're cheating! Release us and fight fairly!"
  npc_override_1@dth3_IsleOfBios_menu_vrid_47b8e6: "Vrid: Ah, finally I can move!"
  npc_override_1@dth3_IsleOfBios_menu_vrid_48ebf8: "Vrid: Err, what's this place? I just touched the seed, and suddenly the scenery changed."
  npc_override_1@dth3_IsleOfBios_menu_vrid_4bb677: "Vrid: Pah! If I was I wouldn't have come willingly, would I?"
  npc_override_1@dth3_IsleOfBios_menu_vrid_5511ed: "Vrid: Holy cow, are we flying in the sky?!"
  npc_override_1@dth3_IsleOfBios_menu_vrid_5a4350: "Vrid: What's up?"
  npc_override_1@dth3_IsleOfBios_menu_vrid_623b7e: "Vrid: You again?"
  npc_override_1@dth3_IsleOfBios_menu_vrid_6a16a3: "Vrid: I'm Vrid and this is Zeith, from Prontera. We've been traveling around the world, fighting for justice."
  npc_override_1@dth3_IsleOfBios_menu_vrid_6aa8ca: "Vrid: Ah, someone else has come to join us."
  npc_override_1@dth3_IsleOfBios_menu_vrid_6d02c4: "Vrid: I hope that really was the last of them."
  npc_override_1@dth3_IsleOfBios_menu_vrid_758080: "Vrid: Who's he? Is he trying to resurrect Morocc? "
  npc_override_1@dth3_IsleOfBios_menu_vrid_8e7c5b: "Vrid: They're all small in the beginning, and then we faced bigger and stronger ones over time."
  npc_override_1@dth3_IsleOfBios_menu_vrid_91b114: "Vrid: Ack, I don't want to die!"
  npc_override_1@dth3_IsleOfBios_menu_vrid_9dc558: "Vrid: Don't mind him. He's not so quiet when there are only two of us."
  npc_override_1@dth3_IsleOfBios_menu_vrid_a988ce: "Vrid: Whew, that reaper was much stronger than me and Zeith combined."
  npc_override_1@dth3_IsleOfBios_menu_vrid_b00429: "Vrid: Hey, Zeith. Say something."
  npc_override_1@dth3_IsleOfBios_menu_vrid_b029ce: "Vrid: I'll get rid of you myself!"
  npc_override_1@dth3_IsleOfBios_menu_vrid_dcf48d: "Vrid: Shut up, you fiend! We don't have time for your lackeys!"
  npc_override_1@dth3_IsleOfBios_menu_vrid_dd7aa5: "Vrid: You cheater, fight fairly!"
  npc_override_1@dth3_IsleOfBios_menu_vrid_e07aca: "Vrid: Did you also come to stop Morocc's resurrection?"
  npc_override_1@dth3_IsleOfBios_menu_vrid_e52394: "Vrid: We could have died if it weren't for you."
  npc_override_1@dth3_IsleOfBios_menu_vrid_e57727: "Vrid: Whoever you are, we'll kill you before you do!"
  npc_override_1@dth3_IsleOfBios_menu_vrid_e7c5c8: "Vrid: Wow, you're amazing! Did you kill them all?"
  npc_override_1@dth3_IsleOfBios_menu_vrid_f2025f: "Vrid: You're lucky to be here. I got totally lost the moment I entered that maze."
  npc_override_1@dth3_IsleOfBios_menu_vrid_f9780d: "Vrid: We only came because the old geezer down below kept rambling about Morocc's resurrection."
  npc_override_1@dth3_IsleOfBios_menu_zeith_029239: "Zeith: Whether they're stronger versions of their original selves, or something completely different."
  npc_override_1@dth3_IsleOfBios_menu_zeith_20a8b3: "Zeith: Hmpf, I'm ashamed of myself for being so weak..."
  npc_override_1@dth3_IsleOfBios_menu_zeith_29c72e: "Zeith: Well, I'm curious about the monster we'll face now."
  npc_override_1@dth3_IsleOfBios_menu_zeith_2c3e46: "Zeith: ...Ack."
  npc_override_1@dth3_IsleOfBios_menu_zeith_52f235: "Zeith: Ugh... I feel so helpless..."
  npc_override_1@dth3_IsleOfBios_menu_zeith_59f79e: "Zeith: I'm Zeith."
  npc_override_1@dth3_IsleOfBios_menu_zeith_6abc31: "Zeith: Just like children growing up into adults."
  npc_override_1@dth3_IsleOfBios_menu_zeith_6bc06e: "Zeith: That guy Ankou smells dangerous. You better move once he starts using a skill."
  npc_override_1@dth3_IsleOfBios_menu_zeith_7d9a89: "Zeith: Not yet. More are coming!"
  npc_override_1@dth3_IsleOfBios_menu_zeith_8659c7: "Zeith: ...Ugh..."
  npc_override_1@dth3_IsleOfBios_menu_zeith_8b3e14: "Zeith: ...You talk enough for both of us."
  npc_override_1@dth3_IsleOfBios_menu_zeith_a9c9f6: "Zeith: ...Something's been bothering me."
  npc_override_1@dth3_IsleOfBios_menu_zeith_b1c35d: "Zeith: I hate running."
  npc_override_1@dth3_IsleOfBios_menu_zeith_d6caca: "Zeith: ..."
  npc_override_1@dth3_IsleOfBios_menu_zeith_d866ee: "Zeith: I've got the feeling that the monsters were growing stronger with time."
  npc_override_1@dth3_IsleOfBios_menu_zeith_d97e34: "Zeith: Nope, we aren't so lucky--more is on the way!"
  npc_override_1@dth3_IsleOfBios_menu_zeith_eaaebd: "Zeith: N-neither can I! I can't move my feet!"
  npc_override_1@dth3_IsleOfBios_menu_zeith_ee2e1e: "Zeith: Who's there?!"
  npc_override_1@dth3_IsleOfBios_msg_6eae3a: "..."
  npc_override_1@dth3_IsleOfBios_my_nightmare_demon_king_a54d00: "In my nightmare, Demon King Morocc awakens from his century-long slumber and fills the world with darkness and horror."
  npc_override_1@dth3_IsleOfBios_party_entering_isle_bios_655f6b: "{0} of the party, {1}, is entering Isle of Bios."
  npc_override_1@dth3_IsleOfBios_please_click_press_enter_784c9b: "^ff0000Please click and press Enter again.^000000"
  npc_override_1@dth3_IsleOfBios_please_investigate_yello_be76f3: "Please investigate that yellow seed."
  npc_override_1@dth3_IsleOfBios_please_note_memorial_dun_06da1c: "^ff0000Please note that This Memorial Dungeon cannot be accessed for 23 hours after your last visit.^000000"
  npc_override_1@dth3_IsleOfBios_s_too_dangerous_you_go_57c747: "It's too dangerous for you to go alone. You should take at least one comrade with you."
  npc_override_1@dth3_IsleOfBios_same_nightmare_been_plag_c4ac01: "The same nightmare has been plaguing me for a long time."
  npc_override_1@dth3_IsleOfBios_where_am_i_3b8935: "...Where am I?"
  npc_override_1@dth3_IsleOfBios_you_first_must_form_join_86e369: "^ff0000You first must form/join a party of at least 1 person to enter this dungeon.^000000"
  npc_override_1@dth3_IsleOfBios_you_first_must_meet_wand_966c20: "^ff0000You first must meet Wandering Old Man to gain access to this dungeon.^000000"
  npc_override_1@dth3_IsleOfBios_you_least_level_39a950: "You have to be at least Level 160."
  npc_override_1@dth3_IsleOfBios_your_party_leader_yet_cr_111a32: "^ff0000Your party leader has not yet created a Crack of Time.^000000"
