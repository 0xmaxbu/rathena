  npc_override_ba_in01_quests_17_2_menu_options_233e89: "{0} : Looks like it can be used as a body. I'll take it. Let's look for the arms next."
  npc_override_ba_in01_quests_17_2_menu_options_33b641: "{0} : Now that you've found all the emergency keys, let's go open the locked door."
  npc_override_ba_in01_quests_17_2_menu_options_3a5111: "{0} : Let's go find the other emergency key."
  npc_override_ba_in01_quests_17_2_menu_options_3b71b4: "{0} : She said there's an emergency key over here... {1}"
  npc_override_ba_in01_quests_17_2_menu_options_45924e: "{0} : I'm so eager to..."
  npc_override_ba_in01_quests_17_2_menu_options_475f88: "{0} : Arm... arm... I wonder which is suitable..."
  npc_override_ba_in01_quests_17_2_menu_options_50a707: "{0} : I think I've heard enough stories. Should I go back to the teahouse now?"
