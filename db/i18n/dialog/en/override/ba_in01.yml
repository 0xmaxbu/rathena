Body:
  npc_override_ba_in01_enchan_sage_legacy_17_2_automatic_accessories_ex_4b6041: "The ^FF0000Automatic Accessories^000000 can be exchanged for ^0000CDIllusion Accessories and 1500 Barmeal Tickets^000000."
  npc_override_ba_in01_enchan_sage_legacy_17_2_automatic_equipment_alre_0af9d8: "This automatic equipment is already at its maximum capacity."
  npc_override_ba_in01_enchan_sage_legacy_17_2_automatic_equipment_alre_9e1449: "This automatic equipment has already maximized the enhancement from this module."
  npc_override_ba_in01_enchan_sage_legacy_17_2_bag_full_please_check_we_f5d9b3: "The bag is full. Please check the weight and number of items in your possession before talking again."
  npc_override_ba_in01_enchan_sage_legacy_17_2_bring_only_one_equipment_1e9d99: "^FF0000Bring only one equipment that you want to exchange and proceed.^000000"
  npc_override_ba_in01_enchan_sage_legacy_17_2_cancel_77dfd2: "Cancel"
  npc_override_ba_in01_enchan_sage_legacy_17_2_done_according_specifica_f63966: "This is done according to the specification module, so the equipment will not be destroyed. However, the number of upgrades can vary depending on the module."
  npc_override_ba_in01_enchan_sage_legacy_17_2_equipment_you_want_excha_b9c4df: "The equipment you want to exchange must be in your inventory and talk to me."
  npc_override_ba_in01_enchan_sage_legacy_17_2_exchange_5dfc87: "Exchange."
  npc_override_ba_in01_enchan_sage_legacy_17_2_exchange_barmeal_ticket_983bd1: "Exchange for Barmeal Ticket."
  npc_override_ba_in01_enchan_sage_legacy_17_2_exchange_barmeal_ticket_b4db71: "Exchange Barmeal Ticket."
  npc_override_ba_in01_enchan_sage_legacy_17_2_exchange_information_cf749f: "Exchange Information"
  npc_override_ba_in01_enchan_sage_legacy_17_2_explore_devices_bfd7b1: "Explore Devices"
  npc_override_ba_in01_enchan_sage_legacy_17_2_fun_your_new_friend_33e555: "Have fun with your new friend!"
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchange_magical_autom_cd6a7f: "I will exchange ^FF00001 Magical Automatic Improvement Device^000000 for {0} {1} or {2} Zeny."
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchange_physical_auto_d295f3: "I will exchange ^FF00001 Physical Automatic Improvement Device^000000 for {0} {1} or {2} Zeny."
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchange_random_automa_b25375: "I will exchange 1 random Automatic Module excluding the epic grade modules for {0} {1}."
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchanged_one_random_a_6f53ec: "I exchanged it for one random Automatic Module."
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchanged_one_random_m_627ced: "I exchanged it for one random Magical Automatic Improvement Device."
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_exchanged_one_random_p_2658c1: "I exchanged it for one random Physical Automatic Improvement Device."
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_m_also_providing_physi_4d61b7: "I'm also providing ^FF0000Physical Automatic Improvement Device and Magical Automatic Improvement Device^000000. You can exchange it for ^0000CD45 Barmeal Tickets^000000, or ^0000CD1500000 Zeny^000000."
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_provide_you_automatic_7d3272: "I can provide you an Automatic Module, Physical Automatic Improvement Device, and Magical Automatic Improvement Device. It will help you the improve abilites of your automatic equipments."
  npc_override_ba_in01_enchan_sage_legacy_17_2_i_whole_bunch_little_stu_90b374: "I have a whole bunch of little stuffs!"
  npc_override_ba_in01_enchan_sage_legacy_17_2_if_there_multiple_equipm_b4a9d8: "If there are multiple equipments in your inventory, it will be exchanged randomly if it meets the condition."
  npc_override_ba_in01_enchan_sage_legacy_17_2_if_you_bring_automatic_e_a56b2a: "If you bring automatic equipment and reinforcement modules, we can enchant the appropriate module on the equipment."
  npc_override_ba_in01_enchan_sage_legacy_17_2_if_you_want_play_little_379cf2: "If you want to play with the little manager, it would cost you 30 Barmeal Tickets."
  npc_override_ba_in01_enchan_sage_legacy_17_2_like_i_said_if_you_7572a7: "Like I said, if you want to play with the little manager, you'll need 30 Barmeal Tickets!"
  npc_override_ba_in01_enchan_sage_legacy_17_2_little_manager_855c9d: "Little Manager"
  npc_override_ba_in01_enchan_sage_legacy_17_2_more_information_24dbab: "More information."
  npc_override_ba_in01_enchan_sage_legacy_17_2_nice_day_dear_guest_5a6712: "Have a nice day, dear guest~"
  npc_override_ba_in01_enchan_sage_legacy_17_2_please_clear_your_invent_2b71b2: "Please clear your inventory and try again. -"
  npc_override_ba_in01_enchan_sage_legacy_17_2_please_make_sure_you_equ_d2c60c: "Please make sure you have equipped the proper automatic equipment that you want to enhance."
  npc_override_ba_in01_enchan_sage_legacy_17_2_please_select_grade_modu_56e421: "Please select the grade of module that you want to use."
  npc_override_ba_in01_enchan_sage_legacy_17_2_please_try_another_autom_538b60: "Please try another automatic equipment."
  npc_override_ba_in01_enchan_sage_legacy_17_2_please_try_another_modul_b358d8: "Please try another module."
  npc_override_ba_in01_enchan_sage_legacy_17_2_seems_type_weight_item_y_373530: "^ff0000It seems that the type or weight of the item you have is too much. Please organize your inventory.^000000"
  npc_override_ba_in01_enchan_sage_legacy_17_2_sorry_registration_requi_971790: "Sorry. Registration is required to purchase butterflies."
  npc_override_ba_in01_enchan_sage_legacy_17_2_stopping_conversation_80338d: "Stopping conversation."
  npc_override_ba_in01_enchan_sage_legacy_17_2_then_combat_specialized_661649: "Then, combat-specialized guest, do safely improve your abilities."
  npc_override_ba_in01_enchan_sage_legacy_17_2_then_please_visit_again_ba9c60: "Then please visit again when you need help~"
  npc_override_ba_in01_enchan_sage_legacy_17_2_then_s_time_me_play_70d18b: "Then, it's time for me to play!"
  npc_override_ba_in01_enchan_sage_legacy_17_2_transaction_ended_b41ecb: "Transaction ended."
  npc_override_ba_in01_enchan_sage_legacy_17_2_unknown_error_occurred_0db2bf: "Unknown error has occurred."
  npc_override_ba_in01_enchan_sage_legacy_17_2_varmundt_no_doubt_best_m_3bec3e: "Varmundt is no doubt the best man in the world!"
  npc_override_ba_in01_enchan_sage_legacy_17_2_wait_don_t_f8e10f: "Wait... Don't"
  npc_override_ba_in01_enchan_sage_legacy_17_2_we_accept_barmeal_ticket_6e2e54: "We accept Barmeal Tickets for upgrading your Illusion Equipment into Automatic Requipments."
  npc_override_ba_in01_enchan_sage_legacy_17_2_we_offering_reinforcemen_a37c3e: "We are offering reinforcement cubes that will refine your ^0000CD+4^000000 Illusion and Automatic Equipment to ^FF0000+7^000000 in an instant!"
  npc_override_ba_in01_enchan_sage_legacy_17_2_welcome_724486: "Welcome."
  npc_override_ba_in01_enchan_sage_legacy_17_2_welcome_welcome_dfc093: "Welcome welcome~"
  npc_override_ba_in01_enchan_sage_legacy_17_2_what_you_like_exchange_ac3018: "What would you like to exchange?"
  npc_override_ba_in01_enchan_sage_legacy_17_2_woaaaah_i_feel_power_you_45efe6: "Woaaaah~ I can feel the power of your automatic equipment already~!"
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_don_t_enough_barmeal_d18188: "You don't have enough Barmeal tickets for the exchange."
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_don_t_enough_zeny_9544d2: "You don't have enough Zeny for the exchange."
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_enchant_module_autom_249cdf: "You can not enchant this module to this automatic equipment."
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_exchange_your_illusi_ecd976: "You can exchange your ^0000CD+9 Illusion Armor, Engine, or Leg and 900 Barmeal Tickets^000000 to ^FF0000Automatic Armor, Engine, or Leg^000000."
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_get_automatic_module_b734dc: "You can get an ^FF0000automatic module^000000 for ^0000CD90 Barmeal Tickets^000000. I will give you a random automatic module excluding the epic grade modules."
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_must_possess_module_7be46f: "You must possess a module in your inventory that matches the efficacy to proceed with the enhancement."
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_need_wings_move_barm_fcfe13: "Do you need wings to move to Barmund Mansion?"
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_sure_you_want_enchan_9f6056: "Are you sure you want to enchance your ^FF0000{0}^000000 with ^0000CD{1}^000000? This process cannot be reversed."
  npc_override_ba_in01_enchan_sage_legacy_17_2_you_too_many_items_e50381: "- You have too many items."
