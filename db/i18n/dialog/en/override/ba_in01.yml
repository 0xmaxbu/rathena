  npc_override_ba_in01_quests_17_2_menu_options_5922c6: "{0} : Would he be satisfied with a leg like this? Let's go back."
  npc_override_ba_in01_quests_17_2_menu_options_7a3db1: "{0} : I already found something useful for the arm. Now, let's go find a leg."
  npc_override_ba_in01_quests_17_2_menu_options_7bfa04: "{0} : Let's see... What's worth using as the body..."
  npc_override_ba_in01_quests_17_2_menu_options_962a27: "{0} : Isn't this dangerous?"
  npc_override_ba_in01_quests_17_2_menu_options_a30774: "{0} : I'm saying the truth..."
  npc_override_ba_in01_quests_17_2_menu_options_b43a11: "{0} : Is this good enough for the arm? Will it be okay? Let's just take it for now. Now all we have to do is find a leg."
  npc_override_ba_in01_quests_17_2_menu_options_b4b765: "{0} : I've found it!!!"
  npc_override_ba_in01_quests_17_2_menu_options_cddc73: "{0} : I set the trap securely in the marked position. Let's move to the next location."
  npc_override_ba_in01_quests_17_2_menu_options_eab5dc: "{0} : I've finally set all the traps securely. Where should I go now?"
  npc_override_ba_in01_quests_17_2_menu_options_f8b8dc: "{0} : This must be the place. The cold air started to flow when the trap was set. Let's move to the next location."
  npc_override_ba_in01_quests_17_2_menu_options_fa0923: "{0} : I already found everything. Let's go back."
  npc_override_ba_in01_quests_17_2_menu_options_fac386: "{0} : I set the trap where Lucky asked me too. Let's move to the next location."
  npc_override_ba_in01_quests_17_2_menu_options_face08: "{0} : I already found something useful for the body. Now, let's go find an arm."
