  npc_override_izlude_HelpMeShorty_you_see_box_where_you_d356b2: "^0000cdDo you see a box where you can select an area^000000 in the upper left? If you select an area you want to check out then you will see it marked with a red box the map with ^0000cdthe name of the main dungeon^000000 written on it."
  npc_override_izlude_HelpMeShorty_you_see_message_window_b_bdb1ba: "Can you see the message window at the bottom? You can chat with other people by entering your message there or you can also send other message types there as well."
