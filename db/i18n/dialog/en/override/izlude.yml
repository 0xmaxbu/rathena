  npc_override_izlude_HelpMeShorty_you_sure_you_want_anothe_2c68d6: "Are you sure you want to be with another person for the rest of your life? Then you can start a ^0000cdfamily^000000."
  npc_override_izlude_HelpMeShorty_you_take_boat_izlude_if_8b29f9: "^0000cdYou can take the boat^000000 from Izlude. If you have Canned Malangdo that can be obtained in a special way, you can use it to travel to there."
