Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_izlude_HelpMeShorty_addition_regular_dungeon_b79c3d: "In addition to the regular dungeons, there are also special dungeons. Usually, they say that it is a special place created by an unknown power in this world."
  npc_override_izlude_HelpMeShorty_addition_sense_belonging_d09018: "In addition to the sense of belonging, the guild can enjoy various benefits such as the guild's own skills and dedicated warehouse."
  npc_override_izlude_HelpMeShorty_adoption_requires_wedded_5034aa: "Adoption requires a wedded couple's level to be 70 or higher and the child to be adopted is a Novice or a first class."
  npc_override_izlude_HelpMeShorty_after_arriving_here_firs_87a339: "After arriving here for the first time you didn't know anything, right? I'll teach you everything I know. ^0000cdAsk me anything!^000000"
  npc_override_izlude_HelpMeShorty_after_selecting_area_you_9ee7ce: "After selecting the area you want to see, check the ^0000cdmonster tab^000000 in the upper right corner or press the ^0000cdTab key^000000, you will see the name and level of the monster most distributed in that area."
  npc_override_izlude_HelpMeShorty_after_some_quests_traini_b33ae4: "After some quests and training, they gave me equipment."
  npc_override_izlude_HelpMeShorty_ah_you_go_boat_alberta_3fe06f: "^0000cdAh! You can go by boat from Alberta^000000! Let's go later! Master! It's a new adventure!"
  npc_override_izlude_HelpMeShorty_alas_acorns_muk_muk_acor_2ea4d3: "Alas! Acorns! Muk-muk, acorn jelly! What do you do with acorns? You eat acorn jelly~"
  npc_override_izlude_HelpMeShorty_all_penguin_penguin_you_d83b9d: "Is this all? Penguin? Penguin? Do you like penguins better than me?"
  npc_override_izlude_HelpMeShorty_amatsu_kunlun_moscovia_b_be74b8: "Amatsu, Kunlun, Moscovia, Brasilis, Ayothaya, Dewata, Port Malaya, Rock Ridge, etc. The unknown world is waiting for you."
  npc_override_izlude_HelpMeShorty_arrows_bullets_only_equi_e63e8a: "Arrows and bullets can only be equipped by dragging them from the inventory to the character in the equipment window."
  npc_override_izlude_HelpMeShorty_arunafelz_church_worship_fd67b7: "^0000cdArunafelz^000000. This is a church that worships a goddess. So, there is a Pope. Of course, you can't meet anyone, but is it possible? Maybe we can meet at least once."
  npc_override_izlude_HelpMeShorty_arunafelz_temple_capital_768528: "Arunafelz has a temple capital, Rachel, and a canyon town, Veins."
  npc_override_izlude_HelpMeShorty_attack_click_target_atta_290d5a: "^0000cd<Attack>^000000 - Click the target ^0000cdto attack with the mouse^000000."
  npc_override_izlude_HelpMeShorty_aww_i_m_shorty_what_f6b4dc: "Aww!!! I'm Shorty! What's my master's name?"
  npc_override_izlude_HelpMeShorty_base_expeditionary_force_8a1ff3: "From the base of the Expeditionary Forces of the Three Kingdoms, you can go to Splendid, Eclage, Manuk or El Dicastes."
  npc_override_izlude_HelpMeShorty_basic_operation_a3a6f5: "Basic Operation"
  npc_override_izlude_HelpMeShorty_because_simplifies_trans_265093: "Because it simplifies the transfer process. What greater reason could there be than this?"
  npc_override_izlude_HelpMeShorty_before_reaching_level_yo_2f897a: "^EE0000Before reaching level 31, you can send Shorty away at any time via the ^0000cd<Let's Break Up>^EE0000 menu, but you will never be able to make Shorty your ally again after that."
  npc_override_izlude_HelpMeShorty_better_go_adventure_plac_81c97c: "It would be better to go on an adventure to a place that matches the level of master. If there is ^0000cda lot of level difference with monsters^000000, you can't get 100% of the experience. You have to calculate the level difference as well, right?"
  npc_override_izlude_HelpMeShorty_biggest_characteristic_g_d7ecb7: "The biggest characteristic of a guild is a battle over a hideout. It is also called a siege."
  npc_override_izlude_HelpMeShorty_building_lower_left_corn_b434c9: "^0000cdThe building in the lower left corner of Prontera Central Fountain^000000 is the Clan Headquarters, so take a look."
  npc_override_izlude_HelpMeShorty_buy_sell_stalls_click_mo_c609c9: "<Buy and sell stalls> - Click the mouse on the stalls window."
  npc_override_izlude_HelpMeShorty_call_me_anytime_if_you_7c9048: "Call me anytime if you have any questions. I'll look around a bit and get back into the bag."
  npc_override_izlude_HelpMeShorty_capital_prontera_satelli_5fa88f: "The capital is Prontera, the satellite city of Izlude, Geffen where wizards gather, Payon to the east, Alberta where you can go travel to different regions, Aldebaran with the clock tower, and Morroc."
  npc_override_izlude_HelpMeShorty_case_make_party_together_60590b: "In that case, make a party and do it together."
  npc_override_izlude_HelpMeShorty_case_you_use_catalog_cur_4b9a0b: "In that case, you can use the ^0000cdcatalog^000000. Currently, it is said that ^0000cdvending machines in Paradise or Alberta's merchant^000000 are selling it."
  npc_override_izlude_HelpMeShorty_check_skill_click_skill_b79347: "<Check skill> - Click the ^0000cdskill icon in the main menu located at the top left corner^000000."
  npc_override_izlude_HelpMeShorty_check_status_click_statu_5e7a7d: "<Check status> - Click the ^0000cdstatus icon in the main menu located at the top left corner^000000."
  npc_override_izlude_HelpMeShorty_click_navi_alberta_info_c3591e: "Click on <NAVI>[Alberta]<INFO>alberta,124,67,0,101,0</INFO></NAVI> to find it."
  npc_override_izlude_HelpMeShorty_click_navi_geffen_info_g_1796c7: "Click on <NAVI>[Geffen]<INFO>geffen,132,66,0,101,0</INFO></NAVI> to find it."
  npc_override_izlude_HelpMeShorty_click_navi_payon_info_pa_485296: "Click on <NAVI>[Payon]<INFO>payon,177,111,0,101,0</INFO></NAVI> to find it."
  npc_override_izlude_HelpMeShorty_click_navi_prontera_info_9616da: "Click on <NAVI>[Prontera]<INFO>prontera,124,76,0,101,0</INFO></NAVI> to find it."
  npc_override_izlude_HelpMeShorty_click_quest_icon_main_me_2521c1: "Click the ^0000cdquest icon in the main menu located in the upper left corner."
  npc_override_izlude_HelpMeShorty_continent_full_festivals_89e902: "The continent is full of festivals all year round. How about participating in the festival when master is also free?"
  npc_override_izlude_HelpMeShorty_conversation_click_targe_ddc16c: "<Conversation> - Click the target ^0000cdto chat with the mouse^000000."
  npc_override_izlude_HelpMeShorty_course_s_free_you_solve_2369c0: "Of course, it's not free, but you have to solve a simple quest from Paradise. Besides, they also rent out shadow equipment."
  npc_override_izlude_HelpMeShorty_cute_a26748: "Cute."
  npc_override_izlude_HelpMeShorty_details_322302: "For details"
  npc_override_izlude_HelpMeShorty_did_you_fun_without_me_296fa8: "Did you have fun without me? Did you have fun without me..."
  npc_override_izlude_HelpMeShorty_did_you_know_quick_item_b1c1ae: "Did you know that quick item use and equipment replacement are essential for effective combat?"
  npc_override_izlude_HelpMeShorty_doesn_t_make_your_heart_c676c4: "Doesn't it make your heart flutter just by hearing the words? See you later, master."
  npc_override_izlude_HelpMeShorty_don_t_forget_skill_activ_d04af9: "Don't forget! The skill has to be activated by double clicking the icon you want to use and is casted by pressing the left mouse button once!"
  npc_override_izlude_HelpMeShorty_don_t_worry_too_much_00b394: "Don't worry too much if you think you've raised your skills incorrectly."
  npc_override_izlude_HelpMeShorty_don_t_worry_too_much_64a871: "Don't worry too much if you think you've raised your status incorrectly."
  npc_override_izlude_HelpMeShorty_dorams_lot_magical_talen_a70439: "Dorams have a lot of magical talents, so if you go to ^0000cdMalangdo^000000 you will have a good time."
  npc_override_izlude_HelpMeShorty_drag_skill_icon_item_the_0037fe: "Drag the skill icon or item there. If you release it, you can use skills and icons quickly and easily by simply pressing the ^0000cdshortcut button^000000. It's really convenient."
  npc_override_izlude_HelpMeShorty_enough_c635b3: "Is this enough?"
  npc_override_izlude_HelpMeShorty_equip_unequip_equipment_405a28: "<Equip and unequip equipment> - Click the ^0000cdequipment icon in the main menu located at the top left corner^000000."
  npc_override_izlude_HelpMeShorty_equipment_obtained_speci_217030: "Equipment obtained from a specific dungeon or a specific area can only be ^0000cdenchanted^000000 from in that area."
  npc_override_izlude_HelpMeShorty_errands_why_ed5930: "Errands? Why?"
  npc_override_izlude_HelpMeShorty_family_division_prontera_2dc956: "The Family Division of the Prontera District Office says that you can purchase items necessary for a wedding or check with family-related matters, so if you need it, go check it out."
  npc_override_izlude_HelpMeShorty_far_star_continent_port_ea02f5: "In the Far-Star Continent, the port city ^0000cdLasagna^000000 is the most famous. I want to go there too."
  npc_override_izlude_HelpMeShorty_field_hunting_guide_015c18: "Field Hunting Guide"
  npc_override_izlude_HelpMeShorty_find_navi_inn_info_payon_c482af: "find the <NAVI>[Inn]<INFO>payon_in01,193,23,0,101,0</INFO></NAVI> in Payon."
  npc_override_izlude_HelpMeShorty_first_person_you_meet_sh_f3c1c8: "The first person you meet should be called Master."
  npc_override_izlude_HelpMeShorty_general_quest_f54ce5: "General Quest"
  npc_override_izlude_HelpMeShorty_get_here_take_boat_malan_cc1b05: "To get here, take the boat from Malangdo or Izlude. Do you remember where we got off?"
  npc_override_izlude_HelpMeShorty_go_master_4b3c1a: "Go! Master!!"
  npc_override_izlude_HelpMeShorty_go_navi_morroc_paradise_c5ffcb: "Go to <NAVI>[Morroc Paradise]<INFO>morocc,206,285,0,101,0</INFO></NAVI>."
  npc_override_izlude_HelpMeShorty_go_register_lime_ivenor_7083c5: "^0000cdGo and register with Lime Ivenor first^000000, and then talk to the Boyana Ur and Paradise Logistics staff on either side."
  npc_override_izlude_HelpMeShorty_go_register_lime_ivenor_820aa6: "Go and register with Lime Ivenor first, then check the bulletin board next to it."
  npc_override_izlude_HelpMeShorty_good_job_if_you_need_31a546: "Good job. If you need my help in the future, you can call me like this."
  npc_override_izlude_HelpMeShorty_good_luck_future_568387: "Good luck in the future!"
  npc_override_izlude_HelpMeShorty_he_said_if_you_don_a5f67c: "He said that if you don't need the hats or clothes you got at the academy, you can exchange them for useful stuff at the ^0000cdvending machine at the job change office for each job^000000."
  npc_override_izlude_HelpMeShorty_hey_where_you_coming_we_6690f4: "Hey! Where are you coming from? We came to see Salty, why did you send Salty away~"
  npc_override_izlude_HelpMeShorty_hm_alright_master_let_s_8b192e: "Hm.. Alright. Master, let's go too. To the Coco's nest."
  npc_override_izlude_HelpMeShorty_how_i_get_there_bc596f: "How do I get there?"
  npc_override_izlude_HelpMeShorty_how_simple_right_you_als_f8bc68: "How is it? Simple, right? You can also move the viewpoint by holding down the right mouse button and rotating it."
  npc_override_izlude_HelpMeShorty_how_you_help_me_26cf4c: "How can you help me?"
  npc_override_izlude_HelpMeShorty_however_all_equipment_en_1a8d3e: "However, not all equipment can be enchanted, so you should check the conditions carefully."
  npc_override_izlude_HelpMeShorty_huh_uh_huh_shorty_ca61b1: "Huh? Uh-huh??? Shorty!!!!!!!!!!"
  npc_override_izlude_HelpMeShorty_i_came_find_salty_i_0891b6: "I came to find Salty.. I came, but there is no Salty."
  npc_override_izlude_HelpMeShorty_i_didn_t_force_anyone_d22fe1: "I didn't force anyone to come, and I pulled Zug's head and rolled it over. So I sent him out."
  npc_override_izlude_HelpMeShorty_i_don_t_know_how_879077: "I don't know how it was with you, but I enjoyed our time together."
  npc_override_izlude_HelpMeShorty_i_fit_your_bag_what_0e252a: "I can fit in your bag. What are you so surprised about? It won't be long. I'll be leaving soon."
  npc_override_izlude_HelpMeShorty_i_heard_taekwon_you_shou_cc6416: "I heard that for Taekwon, you should raise mainly Str, Agi, and Dex. For more information,"
  npc_override_izlude_HelpMeShorty_i_heard_there_quite_few_223a10: "I heard that there are quite a few dungeons that even a young adventurer like yourself can go too."
  npc_override_izlude_HelpMeShorty_i_heard_there_winter_hun_6f65e8: "I heard that there will be a winter hunting contest hosted by the royal family at the royal palace! want to do a hunting contest! I want to do it! Fight monsters!!! Let's go to Prontera!!!!"
  npc_override_izlude_HelpMeShorty_i_heard_there_winter_hun_741d42: "I heard that there will be a winter hunting contest hosted by the royal family at the royal palace! I want to do a hunting contest! I want to do it! Fight monsters!!! Let's go to Prontera!!!!"
  npc_override_izlude_HelpMeShorty_i_learned_over_shoulder_d88a23: "But I learned this over the shoulder, and once I do it, my soul gets tired, so I can't give it indefinitely. Although it can take me half an hour to refresh myself."
  npc_override_izlude_HelpMeShorty_i_ll_definitely_take_you_f9dcfb: "I'll definitely take you with me, okay?"
  npc_override_izlude_HelpMeShorty_i_ll_give_you_thanks_1cc74f: "I'll give this to you. Thanks for taking care of Shorty! Shorty, let's go!"
  npc_override_izlude_HelpMeShorty_i_ll_provide_you_various_2651f9: "And I'll provide you with various good ^0000cdservices^000000 to help you with hunting."
  npc_override_izlude_HelpMeShorty_i_ll_tell_you_later_acc6fa: "I'll tell you later. I want to rest for now."
  npc_override_izlude_HelpMeShorty_i_m_bored_i_sent_8b9c1e: "I'm bored. I sent her to get some jelly and acorns."
  npc_override_izlude_HelpMeShorty_i_m_curious_about_skills_2d736b: "I'm curious about skills."
  npc_override_izlude_HelpMeShorty_i_miss_salty_let_s_d6bd88: "I miss Salty. Let's go see Salty."
  npc_override_izlude_HelpMeShorty_i_need_pick_some_acorn_74f7fb: "I need to pick some acorn and jelly today."
  npc_override_izlude_HelpMeShorty_i_say_thank_you_looks_7c37fe: "I have to say thank you. It looks like you were carrying Shorty in that little bag."
  npc_override_izlude_HelpMeShorty_i_think_i_saw_one_5477d1: "I think I saw one ^0000cd<Thinking Archer>^000000 teacher near the entrance to Izlude, but he seemed to have a lot of thoughts. Why don't you go and ask what's going on? Let's go, let's go~"
  npc_override_izlude_HelpMeShorty_i_use_function_register_cb65c0: "I use this function to register frequently used commands."
  npc_override_izlude_HelpMeShorty_i_want_go_shopping_today_a3525a: "I want to go shopping today too."
  npc_override_izlude_HelpMeShorty_i_went_payon_came_here_349491: "I went to Payon and came here because the grandmother who cooks muk said you went here."
  npc_override_izlude_HelpMeShorty_i_wonder_where_fa280a: "I wonder where.."
  npc_override_izlude_HelpMeShorty_if_joining_guild_burdens_67753d: "If joining a guild is burdensome, then a ^0000cdclan^000000 would be good. It may be difficult to feel as close to others like in a guild, but the clan also has various benefits."
  npc_override_izlude_HelpMeShorty_if_master_becomes_mercha_ebf5f9: "If master becomes a Merchant, you can pull a cart, which can be borrowed from the Kafra Staff in each town."
  npc_override_izlude_HelpMeShorty_if_there_quest_you_want_b2b8a1: "If there is a quest you do not want to see in the list of quests, place the mouse pointer over the title and press the right mouse button to send it to the pending tab."
  npc_override_izlude_HelpMeShorty_if_you_any_questions_go_ce7ecb: "If you have any questions, go to the Paradise Office."
  npc_override_izlude_HelpMeShorty_if_you_check_item_view_d59389: "If you check the item ^0000cd<View skill description> in the upper right corner^000000, you can view the description of the skill when you hover the mouse over the skill icon."
  npc_override_izlude_HelpMeShorty_if_you_choose_accompany_78898a: "^EE0000If you choose to accompany Shorty, the item ^0000cd<Help Me Shorty>^EE0000 will be automatically placed in your inventory."
  npc_override_izlude_HelpMeShorty_if_you_click_circle_left_324119: "If you click the circle on the left in the chat window at the bottom, you can designate a chat partner, and you can send a message only to party members there, so it's useful."
  npc_override_izlude_HelpMeShorty_if_you_curious_go_cash_5682f6: "If you are curious, go to ^0000cd<cash sales guide>^000000 in each town. They will guide you there."
  npc_override_izlude_HelpMeShorty_if_you_don_t_like_c40595: "If you don't like me in the bag, take me to ^0000cdSalty^000000. That's my destination, so when the time comes, I will leave ^0000cdyour bag^000000."
  npc_override_izlude_HelpMeShorty_if_you_drag_drop_items_c9c276: "If you drag and drop items that are not used frequently or should not be sold to NPCs, put them in the ^0000cd<Personal tab>, and press the trade lock button^000000 at the bottom, you will not accidentally sell these items."
  npc_override_izlude_HelpMeShorty_if_you_fight_me_3abaf8: "If you fight for me."
  npc_override_izlude_HelpMeShorty_if_you_interested_changi_70e8d9: "If you are not interested in changing jobs or transcending..."
  npc_override_izlude_HelpMeShorty_if_you_interested_gettin_a3edaf: "If you are interested in getting married, go to the Church of Prontera or the Wedding Hall of Lasagna. You will need some supplies before you can marry. The Church of Prontera can only marry humans."
  npc_override_izlude_HelpMeShorty_if_you_press_town_you_ae7a28: "If you press the town you want to go to, the navigation menu will appear. Press the ^0000cd<Guide to the target> button at the bottom^000000 and exit the map to get guidance."
  npc_override_izlude_HelpMeShorty_if_you_re_hurry_you_5ae70f: "If you're in a hurry, you can help. You can find the"
  npc_override_izlude_HelpMeShorty_if_you_re_interested_tra_1284d6: "If you're not interested in transcending, you can just change jobs. But he said that it's better to pass it on when you think about the future."
  npc_override_izlude_HelpMeShorty_if_you_take_me_i_1f4eb0: "If you take me, ^0000cdI'll help too^000000. I'll really help you in many ways! I'll teach you ^0000cda lot of things^000000!!"
  npc_override_izlude_HelpMeShorty_if_you_use_help_me_ec7545: "If you use the <Help Me Shorty> item in your ^EE0000inventory, you can summon Shorty and get ^0000cdhelp and advice^EE0000 from it."
  npc_override_izlude_HelpMeShorty_if_you_want_chat_small_f0de00: "If you want to chat with a small number of people who are neither party nor guild members, you can open a chat window."
  npc_override_izlude_HelpMeShorty_if_you_want_feel_atmosph_50fe5c: "If you want to feel the atmosphere of a foreign country, you should go to that ^0000cdlocal region^000000. ^0000cdIf you go to Alberta's dock^000000, you can meet the sailors who send people to each local region."
  npc_override_izlude_HelpMeShorty_if_you_want_know_when_cf4fa1: "If you want to know when you can get it again, open the quest window with ALT+U and check the time displayed at the bottom."
  npc_override_izlude_HelpMeShorty_if_you_want_make_your_1dd37a: "If you want to make your equipment stronger or give it a special ability, why not try to ^0000cdenchant^000000 it?"
  npc_override_izlude_HelpMeShorty_if_you_want_succeed_find_d9d003: "If you want to succeed, find a person named"
  npc_override_izlude_HelpMeShorty_if_your_job_level_you_2bdff0: "^0000cdIf your job level is 40 you can change your job to a secondary job^000000, but it is recommended that you change jobs when you reach level 50."
  npc_override_izlude_HelpMeShorty_illusion_dungeon_db43b2: "^0000cdIllusion Dungeon^000000"
  npc_override_izlude_HelpMeShorty_last_letter_salty_said_p_ffb5e4: "The last letter from Salty said it was from ^0000cdPayon's inn^000000."
  npc_override_izlude_HelpMeShorty_let_s_go_b9a2ff: "Let's go"
  npc_override_izlude_HelpMeShorty_let_s_go_our_separate_f184ba: "Let's go our separate ways."
  npc_override_izlude_HelpMeShorty_let_s_help_each_other_81275d: "Let's help each other a little bit more. Okay?"
  npc_override_izlude_HelpMeShorty_let_s_leave_after_checki_fd335c: "Let's leave after checking where the hunt was. There may be monster cards left."
  npc_override_izlude_HelpMeShorty_let_s_see_master_ffd54a: "Let's see, master..."
  npc_override_izlude_HelpMeShorty_location_information_11d539: "Location Information"
  npc_override_izlude_HelpMeShorty_lot_experienced_adventur_7fd344: "A lot of experienced adventurers usually go, but they say there are a few low-level places that can be reached with a little training. Either in Orc Village or Rachel..."
  npc_override_izlude_HelpMeShorty_lot_life_information_con_0af9e3: "A lot of life information is contained in this. Whenever I'm bored, I read these."
  npc_override_izlude_HelpMeShorty_malangdo_item_mall_seyab_817aa6: "^0000cd<Malangdo>, <Item Mall>^000000, or ^0000cd<Seyablem> and <Leyablem>^000000 which can be found in major towns, are mainly doing this."
  npc_override_izlude_HelpMeShorty_many_people_thought_ther_8aee82: "Many people thought that there was only the continent of Midgard on this land, but one day, people appeared in the form of ^0000cdcats^000000. No one knew where they came from."
  npc_override_izlude_HelpMeShorty_master_currently_skill_p_bc0d6c: "Master currently has {0} skill point {1}."
  npc_override_izlude_HelpMeShorty_master_did_you_know_besi_195bb1: "Master, did you know that besides the Midgard continent known to us, you can go to new and mysterious places by boat? Mainly Al... Al... Allegro?"
  npc_override_izlude_HelpMeShorty_master_doesn_t_want_succ_3d269d: "Master doesn't want to succeed? Salty says she's training hard because she wants to succeed."
  npc_override_izlude_HelpMeShorty_master_even_if_lot_time_7d83bf: "Master, even if a lot of time passes, don't forget me and become a great adventurer who makes a name for yourself on the continent!"
  npc_override_izlude_HelpMeShorty_master_f89f31: "Master?"
  npc_override_izlude_HelpMeShorty_master_hasn_t_even_been_d68c90: "Master, it hasn't even been 30 minutes yet. I'm still struggling. I'll give you more strength if you get up, so please wait."
  npc_override_izlude_HelpMeShorty_master_i_ll_give_you_51d61d: "Master, I'll give you the help I promised you before. Increased agility and blessing."
  npc_override_izlude_HelpMeShorty_master_i_ll_tell_you_626d0f: "Master, I'll tell you the basics, but literally just the basics."
  npc_override_izlude_HelpMeShorty_master_know_about_skill_674cc9: "Does master know about the skill tree? If master hovers the mouse over the skill they want to learn, the skills and skill levels to learn first will appear."
  npc_override_izlude_HelpMeShorty_master_ready_i_really_wa_ac9d6b: "Is master ready? I really want to go!"
  npc_override_izlude_HelpMeShorty_master_sometimes_when_yo_fff13c: "Master, sometimes when you want to buy something from a street vendor, you may wonder if they are selling it now and who is selling it."
  npc_override_izlude_HelpMeShorty_master_thank_you_so_much_1117d4: "Master, thank you so much."
  npc_override_izlude_HelpMeShorty_master_what_you_re_sayin_1ae0a7: "Master, what you're saying? Anyway, underground waterways, Payon's caves, ant dungeons, and shipwrecks. Don't you want to become the ruler of the dungeon, master?"
  npc_override_izlude_HelpMeShorty_master_you_bored_then_yo_63b290: "Master, are you bored? Then you can chat with the people around you."
  npc_override_izlude_HelpMeShorty_master_you_ever_pressed_da9c46: "Master, have you ever pressed the ^0000cdF12 key^000000? Small white squares will float around."
  npc_override_izlude_HelpMeShorty_master_you_know_conversa_220b8b: "Master, do you know that conversation isn't just about words? Appropriate use of emotion makes the conversation richer."
  npc_override_izlude_HelpMeShorty_master_you_should_save_y_717087: "Master, you should save your body because you only have one life."
  npc_override_izlude_HelpMeShorty_memorial_dungeon_2e3e4e: "^0000cdMemorial Dungeon^000000"
  npc_override_izlude_HelpMeShorty_menu_click_c841bc: "Click on <NAVI>[Morroc: Paradise Space Traveler]<INFO>morocc,161,97,0,101,0</INFO></NAVI> to find it."
  npc_override_izlude_HelpMeShorty_menu_go_2f08b5: "Go to <NAVI>[Izlude: The Hypnotist]<INFO>izlude,127,175,0,101,0</INFO></NAVI> for guidance."
  npc_override_izlude_HelpMeShorty_menu_please_e776a2: "please visit <NAVI>[Payon: Ahri]<INFO>payon,245,295,0,101,0</INFO></NAVI>."
  npc_override_izlude_HelpMeShorty_menu_refer_8eb28b: "refer to <URL>[Guild Guide]<INFO>http://ro.gnjoy.com/guide/systeminfo/systemGuild1.asp,1024,768</INFO></URL>"
  npc_override_izlude_HelpMeShorty_menu_refer_905765: "Refer to <URL>[guide]<INFO>http://ro.gnjoy.com/guide/systeminfo/,1024,768</INFO></URL> for the Basic."
  npc_override_izlude_HelpMeShorty_menu_shortcut_12015d: "Shortcut: ^0000cdAlt+A^000000"
  npc_override_izlude_HelpMeShorty_menu_shortcut_1c6f63: "Shortcut: ^0000cdAlt+U^000000"
  npc_override_izlude_HelpMeShorty_menu_shortcut_300ae9: "Shortcut: ^0000cdAlt+S^000000"
  npc_override_izlude_HelpMeShorty_menu_shortcut_b3603a: "Shortcut: ^0000cdAlt+Q^000000"
  npc_override_izlude_HelpMeShorty_menu_url_a78915: "<URL>[Family]<INFO>http://ro.gnjoy.com/guide/systeminfo/systemLovers1.asp,1024,768</INFO></URL> for more details."
  npc_override_izlude_HelpMeShorty_menu_url_d1a811: "<URL>[Rune Midgarts Library]<INFO>http://ro.gnjoy.com/guide/runemidgarts/,1024,768</INFO></URL>"
  npc_override_izlude_HelpMeShorty_menu_url_deaff6: "<URL>[Rune Midgarts Library]<INFO>http://ro.gnjoy.com/guide/runemidgarts/questlist.asp,1024,768</INFO></URL>"
  npc_override_izlude_HelpMeShorty_midgard_continent_80e6c6: "Midgard Continent"
  npc_override_izlude_HelpMeShorty_midgard_continent_said_g_10142e: "^0000cdMidgard Continent^000000 is said to have the greatest influence of the three kingdoms of Arunafelts, Schwaldzwald, and Rune-Midgarts. Each continent has an airship you can readily use."
  npc_override_izlude_HelpMeShorty_more_information_82e0be: "For more information"
  npc_override_izlude_HelpMeShorty_more_information_quests_def1ba: "For more information on quests"
  npc_override_izlude_HelpMeShorty_morroc_where_paradise_so_319d7e: "Morroc is where Paradise is, so wouldn't it be ok to walk around?"
  npc_override_izlude_HelpMeShorty_move_attack_051b94: "Move and Attack"
  npc_override_izlude_HelpMeShorty_move_click_place_you_wan_1a6129: "^0000cd<Move>^000000 - Click the place you want to go ^0000cdwith the mouse^000000."
  npc_override_izlude_HelpMeShorty_msg_93fcbf: "......"
  npc_override_izlude_HelpMeShorty_my_name_10a387: "My name is {0}."
  npc_override_izlude_HelpMeShorty_my_name_shorty_271592: "My name is Shorty!!"
  npc_override_izlude_HelpMeShorty_navi_coco_s_nest_info_f54486: "<NAVI>[Coco's nest]<INFO>prt_fild10,318,191,0,101,0</INFO></NAVI> in the south-southwest of Prontera. You can get a bunch of acorns from Coco."
  npc_override_izlude_HelpMeShorty_navi_metheus_sylph_info_16c9f5: "<NAVI>[Metheus Sylph]<INFO>yuno_in02,88,164,0,101,0</INFO></NAVI> ^0000cdat Sage Academy in Yuno^000000, and he will guide you."
  npc_override_izlude_HelpMeShorty_nice_go_around_towns_fie_4e9553: "It would be nice to go around towns and fields to find and help people in need. Those who need help will find it easier to find with a <!> sign above their heads."
  npc_override_izlude_HelpMeShorty_nightmare_dungeon_62555d: "^0000cdNightmare Dungeon^000000"
  npc_override_izlude_HelpMeShorty_no_one_knows_what_kind_c5b62f: "No one knows what kind of dungeon these dungeons are. I guess it's something like a dream or a fantasy. There is a special stone that only comes from here, and everyone says that they aim for the stone and fight for it. They say that the stone can be exchanged for powerful weapons. "
  npc_override_izlude_HelpMeShorty_no_s_b4ac4b: "No, that's not it..."
  npc_override_izlude_HelpMeShorty_no_s_originally_i_bought_15fa82: "No, it's not... Originally I bought it in Paros to remember you, but now that I think about it, you're not a penguin, so I just kept it. Isn't it cute?"
  npc_override_izlude_HelpMeShorty_now_76c5ab: "Now..."
  npc_override_izlude_HelpMeShorty_now_did_you_get_idea_209534: "Now did you get that idea?"
  npc_override_izlude_HelpMeShorty_now_master_shorty_galapa_0594a4: "Not now, master. This Shorty, from the Galapagos knows grace. When you can take off your starter tee and start the adventure on your own, Shorty then goes away."
  npc_override_izlude_HelpMeShorty_oh_besides_smelter_each_b7352f: "Oh, besides the smelter in each town, I heard that the^0000cd<Item Mall>^000000 offers a higher success chance of smelting."
  npc_override_izlude_HelpMeShorty_oh_yeah_shorty_what_s_e00b34: "Oh yeah? But Shorty! What's going on here?"
  npc_override_izlude_HelpMeShorty_okay_i_m_verge_going_526b74: "Okay! I'm on the verge of going too, but let's stop at Prontera for a while and then go to Payon. Let's go pack up some stuff and travel the continent!"
  npc_override_izlude_HelpMeShorty_okay_then_69f05e: "Okay then."
  npc_override_izlude_HelpMeShorty_okay_then_i_ll_look_4bc3f7: "Okay? Then I'll look around a bit and get back into the bag."
  npc_override_izlude_HelpMeShorty_okay_well_said_master_ev_24241e: "Okay. Well said, master. Even if I get stuck in the bag, I'll get out of it quickly."
  npc_override_izlude_HelpMeShorty_one_thing_aware_there_sa_fa7354: "One thing to be aware of is that there is a safe refinement level in smelting, and if you proceed with refining above a certain level, the equipment has a chance to be destroyed. You must have good luck."
  npc_override_izlude_HelpMeShorty_only_thing_i_increase_ag_ee3e76: "The only thing I can do is ^0000cdincrease agility^000000 to move quickly, and ^0000cdblessing^000000 to increase strength, dexterity and intelligence, but it will definitely help, right?"
  npc_override_izlude_HelpMeShorty_open_item_window_you_see_a22025: "Open the item window and you will see ^0000cdfour tabs^000000. Can you see it?"
  npc_override_izlude_HelpMeShorty_other_than_okay_try_para_6ddd78: "Other than that, it would be okay to try ^0000cdParadise's quest^000000. Do you want to go to Paradise? They say they will give you a weapon if you go."
  npc_override_izlude_HelpMeShorty_other_words_s_evolution_19a346: "In other words, it's evolution. People who have passed down say that there are many advantages to getting the job of the past again."
  npc_override_izlude_HelpMeShorty_our_relationship_end_her_836369: "Our relationship will not end here. Remember that you met me. Salty, is there anything else? Something to remember."
  npc_override_izlude_HelpMeShorty_paramarket_place_sells_i_784a24: "Paramarket is a place that sells items that are hard to find in the market or street stalls in limited quantities and for a limited time. It is a very good place to do business."
  npc_override_izlude_HelpMeShorty_party_60b18f: "Party"
  npc_override_izlude_HelpMeShorty_party_window_easily_open_8f4392: "The party window can be easily opened and with the ^0000cdAlt+Z keys^000000. When evenly distributing experience for hunting, the difference of ^0000cdlevel between party members^000000 can be equal to or less than 15."
  npc_override_izlude_HelpMeShorty_path_novice_adventurer_753aff: "The path of a novice adventurer!"
  npc_override_izlude_HelpMeShorty_phew_i_m_glad_we_92ba84: "Phew- I'm glad. Are we friends now?"
  npc_override_izlude_HelpMeShorty_press_alt_e_see_inside_146369: "Press ^0000cdALT+E^000000 to see the inside of the bag, press the consumption tab and I will be right there."
  npc_override_izlude_HelpMeShorty_press_alt_l_keys_view_23c70c: "Press the ^0000cdAlt+L keys^000000 to view and use the list of emotions and shortcut commands."
  npc_override_izlude_HelpMeShorty_press_alt_m_keys_registe_870bb6: "Press the ^0000cdAlt+M keys^000000 to register frequently used shortcut commands~"
  npc_override_izlude_HelpMeShorty_press_alt_s_keys_bring_dd64f3: "Press the ^0000cdAlt+S keys^000000 to bring up the skill list window."
  npc_override_izlude_HelpMeShorty_press_alt_y_keys_check_47d24b: "Press the ^0000cdAlt+Y keys^000000 to check the command list and turn it ON/OFF."
  npc_override_izlude_HelpMeShorty_press_ctrl_keys_open_map_adad13: "Press the ^0000cdCtrl+` keys^000000 to open a map."
  npc_override_izlude_HelpMeShorty_press_f_key_register_con_824ed6: "Press the ^0000cdF12 key^000000 to register consumption items, skills, and equipment by dragging them to the shortcut window."
  npc_override_izlude_HelpMeShorty_pressing_ctrl_open_map_3c66e3: "Pressing ^0000cdCtrl+`^000000 will open the map."
  npc_override_izlude_HelpMeShorty_prontera_2d98d8: "Prontera"
  npc_override_izlude_HelpMeShorty_rune_midgarts_kingdom_ru_d5d802: "^0000cdRune-Midgarts^000000. A kingdom ruled by seven royal families and the power of magic prevails."
  npc_override_izlude_HelpMeShorty_s_easy_name_say_you_e5a15b: "It's an easy name to say. Do you have a bag? That's the one you wear around your waist. It's just the right size for me to fit in."
  npc_override_izlude_HelpMeShorty_s_right_i_t_even_685761: "That's right. I can't even look through all the stalls."
  npc_override_izlude_HelpMeShorty_s_skill_tree_however_ski_43a2e3: "That's the skill tree. However, the skill points consumed when learning a skill are limited, so you can't learn all the skills."
  npc_override_izlude_HelpMeShorty_said_dungeon_much_more_d_f02eae: "It is said that it is a dungeon that is much more difficult of a challenge than a normal dungeon. Even the monsters are not like the monsters we know of. When you find the dungeon, if someone suspicious tells you that it will send you to a more difficult place, try it out."
  npc_override_izlude_HelpMeShorty_said_located_villages_ge_8237a6: "It is said to be located in villages and general fields, and there are many places called Dimensional Rifts."
  npc_override_izlude_HelpMeShorty_salty_ah_you_re_talking_988e91: "Salty? Ah, you're talking about the woman who is staying in the room. I sent her on an errand."
  npc_override_izlude_HelpMeShorty_salty_also_used_very_wel_1d86c9: "Salty also used it very well. I would like clams if possible."
  npc_override_izlude_HelpMeShorty_salty_salty_i_m_here_99b65e: "Salty! Salty~ I'm here~ Did you wait? Did you wait a long time?"
  npc_override_izlude_HelpMeShorty_salty_salty_my_friend_i_1992df: "Salty! Salty is my friend. I'm here to meet Salty. So you must take me to Salty."
  npc_override_izlude_HelpMeShorty_salty_salty_salty_where_70828a: "Salty, Salty? Salty? Where have you been Salty?"
  npc_override_izlude_HelpMeShorty_save_me_hug_me_quickly_b52a90: "Save me! Hug me quickly! Save me!"
  npc_override_izlude_HelpMeShorty_schwaldzwald_republic_as_5bd3c0: "^0000cdSchwaldzwald^000000 Republic. As the name suggests, there is a president. The capital city, Yuno, is floating in the air, so it's worth a visit. It must be spectacular."
  npc_override_izlude_HelpMeShorty_see_also_f7fac5: "see also"
  npc_override_izlude_HelpMeShorty_shorty_why_you_here_one_4b25f3: "Shorty, why are you here? One day I received a letter saying you were leaving!!!"
  npc_override_izlude_HelpMeShorty_smelting_requires_specia_821c00: "Smelting requires special items and zeny. It depends on the type and level of the equipment."
  npc_override_izlude_HelpMeShorty_so_what_basic_info_you_650e3c: "So, what basic info do you want to know?"
  npc_override_izlude_HelpMeShorty_sometimes_some_dungeons_164227: "Sometimes, some dungeons can only be entered through special quests, so you need to gather information as well, alright?"
  npc_override_izlude_HelpMeShorty_sometimes_you_get_close_c18754: "Sometimes you have to get close to talk to someone."
  npc_override_izlude_HelpMeShorty_sometimes_you_like_your_c9e232: "Sometimes you would like to be with your friends, if they fight in dungeons, enjoy adventures together, or sometimes just sit and chat."
  npc_override_izlude_HelpMeShorty_sometimes_you_want_belon_a9c3a1: "Sometimes you will want to belong somewhere and feel a bond with someone. In that case, you just need to belong to a ^0000cdguild or clan^000000."
  npc_override_izlude_HelpMeShorty_stay_healthy_i_bid_you_5912fa: "Stay healthy and I bid you well. I hope master will not forget that Galapago was there."
  npc_override_izlude_HelpMeShorty_store_trade_click_mercha_59a7e3: "<Store Trade> - Click on the merchant NPC ^0000cdto trade^000000."
  npc_override_izlude_HelpMeShorty_take_me_you_take_respons_6a025a: "Take me! You have to take responsibility for me for making eye contact!"
  npc_override_izlude_HelpMeShorty_talk_paramarket_windman_393ea1: "Talk to the Paramarket Windman in ^0000cdParadise Corridor^000000 and he will send you there."
  npc_override_izlude_HelpMeShorty_then_check_monster_tab_u_490865: "Then check the ^0000cdmonster tab in the upper right corner or press the Tab key^000000 to display the level of the dungeon."
  npc_override_izlude_HelpMeShorty_then_i_wait_here_0984ec: "Then can I wait here?"
  npc_override_izlude_HelpMeShorty_then_you_won_t_take_652912: "Then you won't take me to ^0000cdSalty^000000? Salty will be grateful of you for taking me there. I'll pay thanks because Salty knows grace."
  npc_override_izlude_HelpMeShorty_there_anything_you_didn_cef653: "Is there anything you didn't like? Was I not quiet in my bag? Oh, that's what you didn't like, yes... Then there's nothing I can do."
  npc_override_izlude_HelpMeShorty_there_lighthalzen_where_21a120: "And there is Lighthalzen, where the headquarters of Rekenberg is located, there is the mining town of Einbroch, the mines of Einbech, and there is also the rural village of Hugel."
  npc_override_izlude_HelpMeShorty_there_lot_memorial_dunge_96be2a: "There are a lot of memorial dungeons, nightmare dungeons, illusion dungeons...etc."
  npc_override_izlude_HelpMeShorty_there_many_quests_waitin_94e0fd: "There are many quests waiting for master. Besides, they also provide equipment for beginners."
  npc_override_izlude_HelpMeShorty_there_many_statuses_abov_60ba27: "There are many statuses, and above all, if you have a secondary job, you can increase your ^0000cdjob level to 70^000000. You will be able to use more skills."
  npc_override_izlude_HelpMeShorty_there_number_circumstanc_39fcbe: "There are a number of circumstances. This situation will be explained by my master here."
  npc_override_izlude_HelpMeShorty_there_other_utan_village_90833f: "There are other Utan villages such as Umbala, or Niflheim, the land of the dead. It's a place I've always wanted to visit!"
  npc_override_izlude_HelpMeShorty_there_total_skill_points_fdb803: "There are a total of 49 skill points that can be used for learning before master changes to a higher job. This condition is called stagnation."
  npc_override_izlude_HelpMeShorty_these_people_called_dora_65e748: "These people, called Doram, are from a place far across the sea, the ^0000cdFar-Star Continent^000000. They said that the road was opened for them only recently."
  npc_override_izlude_HelpMeShorty_they_say_you_gain_specia_4146f0: "They say that you can gain special marriage skills to use as a family."
  npc_override_izlude_HelpMeShorty_time_even_if_you_hold_4d1b2a: "At that time, even if you hold on to me and cry, I will leave you. Before that, you have to increase your level to about ^0000cdlevel 31^000000. Until then, let's do our best in the future."
  npc_override_izlude_HelpMeShorty_tip_day_81d5b4: "Tip of the Day"
  npc_override_izlude_HelpMeShorty_tradition_being_born_aga_02b97f: "The tradition is ^0000cdbeing born again in Valhalla and returning to Novice^000000. But it's not a normal Novice, it's called a High Novice."
  npc_override_izlude_HelpMeShorty_try_using_220b1e: "try using"
  npc_override_izlude_HelpMeShorty_turns_out_while_sailing_c8977d: "It turns out that while sailing in a faraway place called the Far-Star continent, they met a storm and fell to a place called Malangdo. Literally, the ship fell from the sky."
  npc_override_izlude_HelpMeShorty_type_h_chat_window_81cf22: "Type ^0000cd/h^000000 in the chat window."
  npc_override_izlude_HelpMeShorty_type_tip_chat_window_55134d: "Type ^0000cd/tip^000000 in the chat window."
  npc_override_izlude_HelpMeShorty_uh_huh_something_like_b8a2b8: "Uh-huh, something like that."
  npc_override_izlude_HelpMeShorty_uh_i_know_here_if_be6767: "Uh, I know, here. If you go through the eastern part of Morroc or talk to Agent Catson in Paradise, they'll send you there."
  npc_override_izlude_HelpMeShorty_user_transaction_right_c_ff3989: "<User Transaction> - Right-click the player you want to trade with and select ^0000cdTrade^000000."
  npc_override_izlude_HelpMeShorty_usually_you_equip_disarm_fb947e: "Usually, you can equip and disarm by double-clicking the left mouse button in the inventory or equipment window."
  npc_override_izlude_HelpMeShorty_valuable_tip_salty_taugh_009385: "This is a valuable tip that Salty taught me~ Do you have a monster card?"
  npc_override_izlude_HelpMeShorty_way_what_s_those_eyes_5ed6f3: "By the way, what's with those eyes...? Are you afraid of me? I was doing this to stand out, wait a minute..."
  npc_override_izlude_HelpMeShorty_we_met_izlude_rune_midga_2839be: "We met at Izlude in Rune-Midgarts Kingdom. Remember? Also Payon with Salty, and Paros from where I left. They're all in Rune-Midgats."
  npc_override_izlude_HelpMeShorty_well_let_s_go_together_4ec788: "Well, let's go together."
  npc_override_izlude_HelpMeShorty_well_then_let_s_go_333102: "Well then, let's go!!!"
  npc_override_izlude_HelpMeShorty_well_then_let_s_go_6e3230: "Well then, let's go!"
  npc_override_izlude_HelpMeShorty_well_then_master_goodbye_e5d867: "Well then, master, goodbye. Goodbye!"
  npc_override_izlude_HelpMeShorty_what_information_you_cur_cd90c7: "What information are you curious about?"
  npc_override_izlude_HelpMeShorty_what_master_what_let_s_d2caaa: "What...? Master...? What? Let's break up? Here? Now? Are you serious?"
  npc_override_izlude_HelpMeShorty_what_quest_you_curious_a_6fbceb: "What quest are you curious about?"
  npc_override_izlude_HelpMeShorty_what_where_46717d: "What is it? Where is it?"
  npc_override_izlude_HelpMeShorty_what_you_curious_about_00a14d: "What are you curious about?"
  npc_override_izlude_HelpMeShorty_what_you_curious_about_s_0930a3: "What are you curious about with status and skills?"
  npc_override_izlude_HelpMeShorty_what_you_kidnapped_our_s_1e7425: "What? You kidnapped our Shorty??"
  npc_override_izlude_HelpMeShorty_what_you_like_learn_abou_fa7ffe: "What would you like to learn about master?"
  npc_override_izlude_HelpMeShorty_what_your_name_21eb49: "What is your name?"
  npc_override_izlude_HelpMeShorty_when_business_over_just_c5c2aa: "And when the business is over, just leave me be. I'll look around for you and go in the bag. I follow along very well."
  npc_override_izlude_HelpMeShorty_when_master_receives_que_afe734: "When master receives a quest, the quest information is briefly displayed on the right side of the screen, so you can check it."
  npc_override_izlude_HelpMeShorty_when_you_going_find_some_9d9828: "When are you going to find someone named Salty?"
  npc_override_izlude_HelpMeShorty_when_you_reach_level_hig_76ee3c: "^EE0000When you reach level 31 or higher, you can receive a quest that takes you to Shorty. Completing this quest will send you away and receive a reward at the same time."
  npc_override_izlude_HelpMeShorty_when_you_want_call_me_ad68d5: "When you want to call me, press ^0000cd<Help Me Shorty>^000000 twice quickly and I'll come out of your bag and help you. How about it? Isn't it great?"
  npc_override_izlude_HelpMeShorty_where_person_f37a1e: "Where is that person?"
  npc_override_izlude_HelpMeShorty_where_you_curious_1a82b2: "Where are you curious?"
  npc_override_izlude_HelpMeShorty_where_you_want_go_write_a6726f: "Where do you want to go? Write /place in the chat window and compare your current location with the map that appears by pressing the ^0000cdCtrl+` keys^^000000. Where is the nearest?"
  npc_override_izlude_HelpMeShorty_where_you_want_go_write_e6c89f: "Where do you want to go? Write ^0000cd/place^000000 in the chat window and compare your current location with the map that appears by pressing the ^0000cdCtrl+` keys^000000."
  npc_override_izlude_HelpMeShorty_who_you_talking_about_75843b: "Who are you talking about?"
  npc_override_izlude_HelpMeShorty_who_you_who_you_talking_5911c5: "Who are you? Who are you talking to me? I don't like people I don't know talking to or touching me."
  npc_override_izlude_HelpMeShorty_why_am_i_so_stupid_0bcae2: "Why am I so stupid!"
  npc_override_izlude_HelpMeShorty_why_don_t_you_meet_2e1065: "^0000cdWhy don't you meet Paul and Anne at^000000 the outside Prontera's West Gate? As I was passing by, I heard that they needed help."
  npc_override_izlude_HelpMeShorty_why_don_t_you_meet_57e29b: "Why don't you meet Paul and Anne at the outside ^0000cdProntera's West Gate ^000000? As I was passing by, I heard that they needed help."
  npc_override_izlude_HelpMeShorty_why_don_t_you_try_99261f: "Why don't you try the underground waterway first? The Swordsman Guild is always recruiting, but I heard it's good for beginner adventurers to gain experience."
  npc_override_izlude_HelpMeShorty_why_listen_anxious_middl_7068da: "Or why not listen to the anxious middle-aged man in ^0000cdPayon^000000?"
  npc_override_izlude_HelpMeShorty_why_listen_anxious_middl_7b2846: "Or why not listen to the anxious middle-aged man from ^0000cdPayon^000000?"
  npc_override_izlude_HelpMeShorty_why_you_here_f3f3c0: "Why are you here?"
  npc_override_izlude_HelpMeShorty_yeah_if_you_call_me_2a5c84: "Yeah! If you call me and don't say anything for a minute, I'll go back into the bag."
  npc_override_izlude_HelpMeShorty_yeah_master_adventures_w_4f022f: "Yeah! Master, the adventures we had together were fun!"
