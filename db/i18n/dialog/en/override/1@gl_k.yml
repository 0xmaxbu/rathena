Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@gl_k_OldGlastHeim_aaarrrrrhhhh_cc497b: "Aaarrrrrhhhh"
  npc_override_1@gl_k_OldGlastHeim_actually_dimensional_tim_adaa6a: "Actually, dimensional time travel is possible but I'm too afraid to go there."
  npc_override_1@gl_k_OldGlastHeim_after_time_gap_opens_ple_e8e945: "After the time gap opens, please tell me again."
  npc_override_1@gl_k_OldGlastHeim_ah_i_m_sorry_i_cfddf6: "Ah, I'm sorry. I'm muttering in front of a stranger."
  npc_override_1@gl_k_OldGlastHeim_ah_yes_i_am_herico_c37b52: "Ah yes, I am. Herico told me to meet you."
  npc_override_1@gl_k_OldGlastHeim_all_i_could_just_hide_32e626: "All I could do was... Just hide in here... Nothing, nothing I could do..."
  npc_override_1@gl_k_OldGlastHeim_all_traces_access_old_gl_1e8c85: "^0000ffAll traces of access to Old Glast Heim have been removed. Now you can talk with Hugin again.^000000"
  npc_override_1@gl_k_OldGlastHeim_amazing_you_made_all_way_3eec02: "That is amazing ~ you made it all the way here. May I say thank you?"
  npc_override_1@gl_k_OldGlastHeim_amdarais_hp_reach_090efd: "Amdarais HP {0}% reach!"
  npc_override_1@gl_k_OldGlastHeim_anyway_important_gap_tim_4cf1e7: "Anyway, that is not important. The gap of time will be closed so we need to get out of here."
  npc_override_1@gl_k_OldGlastHeim_aren_t_you_adventurer_ca_f88c7c: "Aren't you the adventurer that came along with Varmundt?"
  npc_override_1@gl_k_OldGlastHeim_arrgg_my_body_20355a: "Arrgg... My body"
  npc_override_1@gl_k_OldGlastHeim_chamberlains_monks_they_a79d77: "Chamberlains... monks... They all turned into monsters. I couldn't do anything."
  npc_override_1@gl_k_OldGlastHeim_crack_looks_suspicious_n_9fc855: "The crack looks suspicious but nothing more to check."
  npc_override_1@gl_k_OldGlastHeim_dead_go_where_dead_belon_f7a4c2: "The dead go where the dead belong! Everyone go back!"
  npc_override_1@gl_k_OldGlastHeim_dead_man_s_valkyrie_hime_30391b: "Dead man's Valkyrie, Himelmez is coming to take the Ymir's Heart piece hidden inside this castle!"
  npc_override_1@gl_k_OldGlastHeim_demolition_death_090c61: "Demolition... Death!..."
  npc_override_1@gl_k_OldGlastHeim_die_you_shall_die_b6bb03: "Die!! You shall die!!!"
  npc_override_1@gl_k_OldGlastHeim_doesn_t_castle_seem_weir_c5a8b5: "Doesn't this castle seem weird all of a sudden? Something's not quite right."
  npc_override_1@gl_k_OldGlastHeim_don_t_leave_me_alone_253e71: "Don't leave me alone, help me."
  npc_override_1@gl_k_OldGlastHeim_don_t_look_me_nervous_751e5d: "Don't look at me nervous like that. It will be over soon..."
  npc_override_1@gl_k_OldGlastHeim_east_passage_alone_how_8c4ec9: "To the east passage? Alone? How?"
  npc_override_1@gl_k_OldGlastHeim_echoing_comes_deep_insid_5941d6: "An echoing comes from deep inside of the knight's shrine."
  npc_override_1@gl_k_OldGlastHeim_eeeeee_eee_die_die_4619eb: "Eeeeee...eee...die... die..."
  npc_override_1@gl_k_OldGlastHeim_even_if_you_don_t_4924f3: "Even if you don't believe me..."
  npc_override_1@gl_k_OldGlastHeim_evil_forces_appearing_ar_400f82: "Evil Forces are appearing in this area."
  npc_override_1@gl_k_OldGlastHeim_evil_presence_teleported_f51aef: "An evil presence has teleported into this area."
  npc_override_1@gl_k_OldGlastHeim_gerhalt_s_body_changing_5bb8cb: "Gerhalt's body is changing."
  npc_override_1@gl_k_OldGlastHeim_grrrrrrhh_8893e2: "Grrrrrrhh~~~"
  npc_override_1@gl_k_OldGlastHeim_haha_funny_you_really_th_81f3c3: "Haha. Funny. Do you really think that is possible?"
  npc_override_1@gl_k_OldGlastHeim_heinrich_you_castle_now_6169d8: "Heinrich, you are in the castle now..."
  npc_override_1@gl_k_OldGlastHeim_here_s_weapon_just_close_78e481: "Here's a weapon. Just close your eye and swing for those monsters."
  npc_override_1@gl_k_OldGlastHeim_herico_didn_t_tell_you_f0b350: "Herico didn't tell you?"
  npc_override_1@gl_k_OldGlastHeim_himelmez_6dbb5f: "Himelmez..."
  npc_override_1@gl_k_OldGlastHeim_himelmez_i_never_forget_95d94c: "Himelmez... I will never forget what you've done to my men."
  npc_override_1@gl_k_OldGlastHeim_himelmez_s_closed_space_3e1908: "Himelmez's closed space covers everywhere..."
  npc_override_1@gl_k_OldGlastHeim_himelmez_s_curse_getting_96fd20: "Himelmez's curse is getting weaker. Find any survivors!"
  npc_override_1@gl_k_OldGlastHeim_himelmez_s_invasion_7e7673: "Himelmez's invasion..."
  npc_override_1@gl_k_OldGlastHeim_hm_you_very_well_first_03f124: "Hm, you are very well. First of all, let me give you some loot from Amdarais."
  npc_override_1@gl_k_OldGlastHeim_hold_you_only_survivor_e0193a: "Hold on! Are you the only survivor?"
  npc_override_1@gl_k_OldGlastHeim_how_many_times_i_done_753a4e: "How many times have I done this job? In my dream, I did it over and over again..."
  npc_override_1@gl_k_OldGlastHeim_how_you_know_varmundt_i_33b73f: "How do you know Varmundt? I heard that he's not really a friendly man..."
  npc_override_1@gl_k_OldGlastHeim_however_we_never_overloo_301fd7: "However, we will never overlook his behavior now and forever..."
  npc_override_1@gl_k_OldGlastHeim_hurry_report_sir_heinric_083269: "Hurry! Report to Sir. Heinrich about Himelmez. I must check the defense barrier here!"
  npc_override_1@gl_k_OldGlastHeim_i_am_so_thirsty_ca047e: "I am so thirsty."
  npc_override_1@gl_k_OldGlastHeim_i_don_t_care_about_ba685e: "I don't care about history"
  npc_override_1@gl_k_OldGlastHeim_i_don_t_want_i_33f253: "I don't want... I don't want to kill anyone. Uhuuuuuh"
  npc_override_1@gl_k_OldGlastHeim_i_feel_sick_my_stomach_497697: "I feel sick to my stomach urrgg"
  npc_override_1@gl_k_OldGlastHeim_i_give_you_weapon_e7305a: "I will give you a weapon."
  npc_override_1@gl_k_OldGlastHeim_i_guess_i_trust_you_15ea61: "I guess I can trust you. Let's leave right away."
  npc_override_1@gl_k_OldGlastHeim_i_guess_impossible_stop_2cb46d: "I guess this is it. Is it impossible to stop the time traveler's will?!"
  npc_override_1@gl_k_OldGlastHeim_i_had_weird_dream_last_f84cf3: "I had a weird dream last night. My mom was in it... Wonder if she is ok..."
  npc_override_1@gl_k_OldGlastHeim_i_knew_you_understand_wh_940ddd: "I knew that you would understand what I said. Well, please tell me what you want to do."
  npc_override_1@gl_k_OldGlastHeim_i_like_chat_during_work_d5b9f3: "I do not like to chat during work."
  npc_override_1@gl_k_OldGlastHeim_i_m_kidding_sir_heinrich_d30172: "I'm not kidding, Sir Heinrich. If I'm correct, then she will be here very soon."
  npc_override_1@gl_k_OldGlastHeim_i_m_sure_i_trust_94b7e3: "I'm sure I can trust you. Let's leave right away."
  npc_override_1@gl_k_OldGlastHeim_i_miss_my_sister_bf3ce4: "I miss my sister..."
  npc_override_1@gl_k_OldGlastHeim_i_t_make_you_believe_6ad977: "I can't make you believe me, but there's no time to argue!"
  npc_override_1@gl_k_OldGlastHeim_i_ve_seen_you_910a25: "I've seen you, {0}."
  npc_override_1@gl_k_OldGlastHeim_item_extraordinary_aura_f472d4: "This item has an extraordinary aura with it. Can be very useful for someone special."
  npc_override_1@gl_k_OldGlastHeim_kkkrrrruughgh_02a0de: "Kkkrrrruughgh..."
  npc_override_1@gl_k_OldGlastHeim_long_time_ago_castle_did_6b54b1: "A long time ago, this castle did not look like this."
  npc_override_1@gl_k_OldGlastHeim_maybe_level_9a0338: "Maybe, level 130."
  npc_override_1@gl_k_OldGlastHeim_maybe_poor_time_traveler_a3afb0: "Maybe this poor time traveler will try to stop Glast Heim's tragedy from happening."
  npc_override_1@gl_k_OldGlastHeim_memorial_dungeon_old_gla_365245: "Memorial Dungeon, 'Old Glast Heim' is already in progress."
  npc_override_1@gl_k_OldGlastHeim_menu_altar_11713f: "Altar boy Domun: Chamberlains... monks... They all turned into monsters. I couldn't do anything."
  npc_override_1@gl_k_OldGlastHeim_menu_altar_1fd50a: "Altar boy Domun: All I could do was... Just hide in here... Nothing, nothing I could do..."
  npc_override_1@gl_k_OldGlastHeim_menu_altar_c372f6: "Altar boy Domun: Ok, I... I'll try."
  npc_override_1@gl_k_OldGlastHeim_menu_altar_ce534d: "Altar boy Domun: To the east passage? Alone? How?"
  npc_override_1@gl_k_OldGlastHeim_menu_gerhalt_4b5c4a: "Gerhalt: Commandant... Come on, you need to run away from here... Ugh."
  npc_override_1@gl_k_OldGlastHeim_menu_gerhalt_5d18f1: "Gerhalt: Kkkkah! Run away! I can't endure anymore!"
  npc_override_1@gl_k_OldGlastHeim_menu_gerhalt_ee215e: "Gerhalt: You can make my body but you can't take my soul, Himelmez!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_07d803: "Heinrich: Himelmez! We will not let you get away from us!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_095b1a: "Heinrich: What are you doing to my soldier Himelmez!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_205e53: "Heinrich: Varmundt is right. Now is not the time for mourning."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_2fb3dc: "Heinrich: It is inexcusable behavior."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_345e28: "Heinrich: But, there might still be survivors here."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_37f6ba: "Heinrich: Varmundt and I will chase Himelmez."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_3abf1e: "Heinrich: She probably already knows where the Ymir's heart piece is."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_3e34e8: "Heinrich: I'll never let you get away Himelmez!!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_419db0: "Heinrich: What... These are!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_45298f: "Heinrich: I'll never forgive you."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_4abd2f: "Heinrich: And now you are trying to trick me, what has happened to him?!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_5b2235: "Heinrich: Thank you for the help. But we don't even have our king with us right now."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_5cd0f9: "Heinrich: I have a request to you followers."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_5fcf59: "Heinrich: What?"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_65f724: "Heinrich: Haha. Funny. Do you really think that is possible?"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_679662: "Heinrich: I already exterminated all my soldiers and maybe more..."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_72bd7f: "Heinrich: Sir Varmundt! Help those adventurers. I will go after Himelmez!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_94f619: "Heinrich: Let him go! I don't need to see anyone else suffer!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_97eb47: "Heinrich: Himelmez can turn living beings into monsters."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_9824b5: "Heinrich: Gerhalt!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_a3503b: "Heinrich: Who are you?"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_a3f422: "Heinrich: I'm so sorry..."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_a775b7: "Heinrich: Destroy the monsters and find any survivors."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_a9b89f: "Heinrich: Aren't you a little too feminine to be the Ruler of death? We are not afraid of you..."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_aa6568: "Heinrich: We tried to break it down but it's really strong."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_c081de: "Heinrich: We cannot risk moving the heart just because some stranger says so."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_d7c976: "Heinrich: ..."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_d8a9f7: "Heinrich: I am sorry, my knights! Forgive me!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_dbb7a1: "Heinrich: I killed my own men..."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_dbdfe0: "Heinrich: My men... This can't be happening!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_e53f74: "Heinrich: What is it? Something wrong with the castle?"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_e8210f: "Heinrich: Very well, Varmundt. Let's find Himelmez."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_e8cfda: "Heinrich: Himelmez! You already made what you wanted so there is no more need for a sacrifice!"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_e9442c: "Heinrich: Aren't you the adventurer that came along with Varmundt?"
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_ecf281: "Heinrich: All Khalitzburg and White Knights should follow me now..."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_f385b6: "Heinrich: My king is visiting the Rune-Midgarts royal family. He's not back yet."
  npc_override_1@gl_k_OldGlastHeim_menu_heinrich_fb51e8: "Heinrich: This structure was not in the castle before!"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_0a6bfa: "Himelmez: Hmm, now I have your attention do I not?"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_0fa0b1: "Himelmez: If he did not bother me it would have been faster."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_10c154: "Himelmez: He made life difficult for me."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_1c2ea7: "Himelmez: You don't want the king's position, just wait for him to come back. I like your purity."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_21e345: "Himelmez: Fare well~, hope to see you again sometime, Heinrich."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_289c25: "Himelmez: Hoo hoo, I already found a piece of Ymir's heart, Heinrich."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_2d3f3a: "Himelmez: Really? What makes you think so?"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_3dccc7: "Himelmez: Anyway, we will have a chance to see because we need to talk more."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_479cd0: "Himelmez: My name is Lisa Kahn Himelmez. Master of Dullahan, Dead man's Valkyrie, that's what they call me."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_59ad84: "Himelmez: Guess you are either lucky or powerful to make it this far."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_5ab906: "Himelmez: Well~ I would love to sit down and explain for you, but I'm kind of busy today~"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_6661b1: "Himelmez: It's a pity to meet you in a situation like this."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_6ae749: "Himelmez: I will go on my way while my new toy entertains you."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_6e199f: "Himelmez: Amazing~ I thought that you were not even close to getting here..."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_75ab88: "Himelmez: But it doesn't matter."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_a649e8: "Himelmez: I'll wait for you at the north of the castle. I want to see how lucky you are."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_a7fd75: "Himelmez: Not bad. Thought you would be dead by now by my creatures~"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_af029d: "Himelmez: I have business to take care of. My minions will treat you well enough for me~"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_b53d1b: "Himelmez: Ha ha ha, worry about yourself. You think I am alone here?"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_b6cc3b: "Himelmez: Uh uh~ I'm so scared."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_ca996b: "Himelmez: So long boys."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_d19303: "Himelmez: Let's see if you can relax like that after you find out where your king is."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_e0fb8c: "Himelmez: He is perfectly fit for my new creation Amdarais."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_e478ed: "Himelmez: Well well~ Am I interrupting you? Weren't you expecting me?"
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_ee8e01: "Himelmez: Besides, this is your last surviving soldier, Heinrich."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_eee5ca: "Himelmez: Let him go? I think... No..."
  npc_override_1@gl_k_OldGlastHeim_menu_himelmez_f8f0d2: "Himelmez: You will all die here."
  npc_override_1@gl_k_OldGlastHeim_menu_holgren_1f73bc: "Holgren the Destroyer: Die!! You shall die!!!"
  npc_override_1@gl_k_OldGlastHeim_menu_holgren_3db221: "Holgren the Destroyer: It's only me."
  npc_override_1@gl_k_OldGlastHeim_menu_holgren_987843: "Holgren the Destroyer: It's ok. You've already done enough. I can help myself. Good luck to you too."
  npc_override_1@gl_k_OldGlastHeim_menu_holgren_bb8a3d: "Holgren the Destroyer: Yes, I can move. I need to get out of here."
  npc_override_1@gl_k_OldGlastHeim_menu_let_97710d: "Let me look around more:Please let me out"
  npc_override_1@gl_k_OldGlastHeim_menu_options_07d8f1: "???: Do not come here! It's a trap... Kkkkah!!!"
  npc_override_1@gl_k_OldGlastHeim_menu_party_2e5e7f: "Party Name: {0}"
  npc_override_1@gl_k_OldGlastHeim_menu_party_8c7899: "Party Leader: {0}"
  npc_override_1@gl_k_OldGlastHeim_menu_s_6e55ad: "????'s: Muahahahaha~!"
  npc_override_1@gl_k_OldGlastHeim_menu_sir_49e846: "Sir Heinrich: Death to all!"
  npc_override_1@gl_k_OldGlastHeim_menu_sir_7a0584: "Sir Heinrich: Go back to the darkness!"
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_005382: "Varmundt: Hurry! Report to Sir. Heinrich about Himelmez. I must check the defense barrier here!"
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_09b72c: "Varmundt's Ghost: If you don't want to be attacked by Amdarais' zombie, come to me and get more power!"
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_207f83: "Varmundt: Sir Heinrich, they're all monsters. You need to give them rest!"
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_2540a2: "Varmundt: Our enemy is not human."
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_2cfa87: "Varmundt: If you hurry now, there's a chance!"
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_2dc6a6: "Varmundt: I'm not kidding, Sir Heinrich. If I'm correct, then she will be here very soon."
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_4304c2: "Varmundt: Wait, I don't have time to go around the castle and clear a path. I will open a portal that can be tracked as quickly as possible."
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_491502: "Varmundt: Step back. Let me try to dispel the magic."
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_4d4342: "Varmundt: Sir Heinrich! I sense something strange and strong coming!"
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_4ea8ba: "Varmundt: She is the Ruler of Death, Dead man's Valkyrie. Himelmez is looking to take the heart of Ymir from us."
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_596f39: "Varmundt's Ghost: If you don't want to be attacked by Amdarais's power, come to me and get more power!"
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_5e7895: "Varmundt: Commander..."
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_62df0f: "Varmundt: She might even destroy this whole castle if she wanted to."
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_68cff8: "Varmundt: Himelmez!! Already!"
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_739e9e: "Varmundt: But we can't recognize who has a stone chain so we have to purify everything."
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_7533f5: "Varmundt: Herico didn't tell you?"
  npc_override_1@gl_k_OldGlastHeim_menu_varmundt_75c27f: "Varmundt: Himelmez hides stone chains in undead people's body."
