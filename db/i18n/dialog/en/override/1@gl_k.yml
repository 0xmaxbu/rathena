Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@gl_k_OldGlastHeim_actually_dimensional_tim_adaa6a: "Actually, dimensional time travel is possible but I'm too afraid to go there."
  npc_override_1@gl_k_OldGlastHeim_after_time_gap_opens_ple_e8e945: "After the time gap opens, please tell me again."
  npc_override_1@gl_k_OldGlastHeim_ah_i_m_sorry_i_cfddf6: "Ah, I'm sorry. I'm muttering in front of a stranger."
  npc_override_1@gl_k_OldGlastHeim_ah_yes_i_am_herico_c37b52: "Ah yes, I am. Herico told me to meet you."
  npc_override_1@gl_k_OldGlastHeim_all_i_could_just_hide_32e626: "All I could do was... Just hide in here... Nothing, nothing I could do..."
  npc_override_1@gl_k_OldGlastHeim_all_traces_access_old_gl_1e8c85: "^0000ffAll traces of access to Old Glast Heim have been removed. Now you can talk with Hugin again.^000000"
  npc_override_1@gl_k_OldGlastHeim_amazing_you_made_all_way_3eec02: "That is amazing ~ you made it all the way here. May I say thank you?"
  npc_override_1@gl_k_OldGlastHeim_anyway_important_gap_tim_4cf1e7: "Anyway, that is not important. The gap of time will be closed so we need to get out of here."
  npc_override_1@gl_k_OldGlastHeim_aren_t_you_adventurer_ca_f88c7c: "Aren't you the adventurer that came along with Varmundt?"
  npc_override_1@gl_k_OldGlastHeim_chamberlains_monks_they_a79d77: "Chamberlains... monks... They all turned into monsters. I couldn't do anything."
  npc_override_1@gl_k_OldGlastHeim_crack_looks_suspicious_n_9fc855: "The crack looks suspicious but nothing more to check."
  npc_override_1@gl_k_OldGlastHeim_dead_man_s_valkyrie_hime_30391b: "Dead man's Valkyrie, Himelmez is coming to take the Ymir's Heart piece hidden inside this castle!"
  npc_override_1@gl_k_OldGlastHeim_die_you_shall_die_b6bb03: "Die!! You shall die!!!"
  npc_override_1@gl_k_OldGlastHeim_doesn_t_castle_seem_weir_c5a8b5: "Doesn't this castle seem weird all of a sudden? Something's not quite right."
  npc_override_1@gl_k_OldGlastHeim_don_t_look_me_nervous_751e5d: "Don't look at me nervous like that. It will be over soon..."
  npc_override_1@gl_k_OldGlastHeim_east_passage_alone_how_8c4ec9: "To the east passage? Alone? How?"
  npc_override_1@gl_k_OldGlastHeim_even_if_you_don_t_4924f3: "Even if you don't believe me..."
  npc_override_1@gl_k_OldGlastHeim_haha_funny_you_really_th_81f3c3: "Haha. Funny. Do you really think that is possible?"
  npc_override_1@gl_k_OldGlastHeim_heinrich_you_castle_now_6169d8: "Heinrich, you are in the castle now..."
  npc_override_1@gl_k_OldGlastHeim_here_s_weapon_just_close_78e481: "Here's a weapon. Just close your eye and swing for those monsters."
  npc_override_1@gl_k_OldGlastHeim_herico_didn_t_tell_you_f0b350: "Herico didn't tell you?"
  npc_override_1@gl_k_OldGlastHeim_himelmez_6dbb5f: "Himelmez..."
  npc_override_1@gl_k_OldGlastHeim_himelmez_i_never_forget_95d94c: "Himelmez... I will never forget what you've done to my men."
  npc_override_1@gl_k_OldGlastHeim_himelmez_s_closed_space_3e1908: "Himelmez's closed space covers everywhere..."
  npc_override_1@gl_k_OldGlastHeim_himelmez_s_invasion_7e7673: "Himelmez's invasion..."
  npc_override_1@gl_k_OldGlastHeim_hm_you_very_well_first_03f124: "Hm, you are very well. First of all, let me give you some loot from Amdarais."
  npc_override_1@gl_k_OldGlastHeim_hold_you_only_survivor_e0193a: "Hold on! Are you the only survivor?"
  npc_override_1@gl_k_OldGlastHeim_how_many_times_i_done_753a4e: "How many times have I done this job? In my dream, I did it over and over again..."
  npc_override_1@gl_k_OldGlastHeim_how_you_know_varmundt_i_33b73f: "How do you know Varmundt? I heard that he's not really a friendly man..."
  npc_override_1@gl_k_OldGlastHeim_however_we_never_overloo_301fd7: "However, we will never overlook his behavior now and forever..."
  npc_override_1@gl_k_OldGlastHeim_hurry_report_sir_heinric_083269: "Hurry! Report to Sir. Heinrich about Himelmez. I must check the defense barrier here!"
  npc_override_1@gl_k_OldGlastHeim_i_don_t_care_about_ba685e: "I don't care about history"
  npc_override_1@gl_k_OldGlastHeim_i_give_you_weapon_e7305a: "I will give you a weapon."
  npc_override_1@gl_k_OldGlastHeim_i_guess_i_trust_you_15ea61: "I guess I can trust you. Let's leave right away."
  npc_override_1@gl_k_OldGlastHeim_i_guess_impossible_stop_2cb46d: "I guess this is it. Is it impossible to stop the time traveler's will?!"
  npc_override_1@gl_k_OldGlastHeim_i_had_weird_dream_last_f84cf3: "I had a weird dream last night. My mom was in it... Wonder if she is ok..."
  npc_override_1@gl_k_OldGlastHeim_i_knew_you_understand_wh_940ddd: "I knew that you would understand what I said. Well, please tell me what you want to do."
  npc_override_1@gl_k_OldGlastHeim_i_like_chat_during_work_d5b9f3: "I do not like to chat during work."
  npc_override_1@gl_k_OldGlastHeim_i_m_kidding_sir_heinrich_d30172: "I'm not kidding, Sir Heinrich. If I'm correct, then she will be here very soon."
  npc_override_1@gl_k_OldGlastHeim_i_m_sure_i_trust_94b7e3: "I'm sure I can trust you. Let's leave right away."
  npc_override_1@gl_k_OldGlastHeim_i_t_make_you_believe_6ad977: "I can't make you believe me, but there's no time to argue!"
  npc_override_1@gl_k_OldGlastHeim_i_ve_seen_you_910a25: "I've seen you, {0}."
  npc_override_1@gl_k_OldGlastHeim_item_extraordinary_aura_f472d4: "This item has an extraordinary aura with it. Can be very useful for someone special."
  npc_override_1@gl_k_OldGlastHeim_long_time_ago_castle_did_6b54b1: "A long time ago, this castle did not look like this."
  npc_override_1@gl_k_OldGlastHeim_maybe_level_9a0338: "Maybe, level 130."
  npc_override_1@gl_k_OldGlastHeim_maybe_poor_time_traveler_a3afb0: "Maybe this poor time traveler will try to stop Glast Heim's tragedy from happening."
  npc_override_1@gl_k_OldGlastHeim_menu_let_97710d: "Let me look around more:Please let me out"
  npc_override_1@gl_k_OldGlastHeim_menu_party_2e5e7f: "Party Name: {0}"
  npc_override_1@gl_k_OldGlastHeim_menu_party_8c7899: "Party Leader: {0}"
  npc_override_1@gl_k_OldGlastHeim_might_possible_you_d40bfa: "It might be possible for you!"
  npc_override_1@gl_k_OldGlastHeim_msg_61ce5a: "[{0}]"
  npc_override_1@gl_k_OldGlastHeim_msg_6eae3a: "..."
  npc_override_1@gl_k_OldGlastHeim_my_name_hugin_i_m_aac4fe: "My name is Hugin. I'm studying the dimensional gap between time and space."
  npc_override_1@gl_k_OldGlastHeim_my_work_shift_over_soon_d93f3d: "My work shift will be over soon, but the next crew is not coming."
  npc_override_1@gl_k_OldGlastHeim_no_thanks_ee1214: "No, thanks."
  npc_override_1@gl_k_OldGlastHeim_now_let_me_remove_your_55df60: "Now let me remove your memory. If you see me again it will be someone new."
  npc_override_1@gl_k_OldGlastHeim_oh_my_afc6f5: "Oh, my..."
  npc_override_1@gl_k_OldGlastHeim_oh_well_i_05dfdb: "Oh. Well I..."
  npc_override_1@gl_k_OldGlastHeim_ohh_04c84b: "Ohh {0}"
  npc_override_1@gl_k_OldGlastHeim_ok_i_i_ll_try_450ec1: "Ok, I... I'll try."
  npc_override_1@gl_k_OldGlastHeim_omit_moderately_545894: "Omit moderately."
  npc_override_1@gl_k_OldGlastHeim_oops_i_almost_distorted_1f6b24: "Oops. I almost distorted the time gap. Come over here. We need to go out!"
  npc_override_1@gl_k_OldGlastHeim_orders_please_778e17: "Orders please."
  npc_override_1@gl_k_OldGlastHeim_please_make_mess_here_02170a: "Please do not make a mess here."
  npc_override_1@gl_k_OldGlastHeim_portal_seems_appeared_no_56db4f: "A portal seems to have appeared to the north."
  npc_override_1@gl_k_OldGlastHeim_pull_together_99b83a: "Pull it together!"
  npc_override_1@gl_k_OldGlastHeim_really_hmm_please_come_b_739da7: "Really? Hmm, please come back later when you are interested then."
  npc_override_1@gl_k_OldGlastHeim_really_jumping_gigawatts_11e99c: "Really? But, jumping gigawatts, this is such a great opportunity."
  npc_override_1@gl_k_OldGlastHeim_really_place_break_down_48aaa5: "Really? This place will be break down soon. Please look around quickly."
  npc_override_1@gl_k_OldGlastHeim_relax_i_am_human_you_edd748: "Relax! I am Human. Are you alone? Is anyone else here?"
  npc_override_1@gl_k_OldGlastHeim_relax_i_m_monster_680b24: "Relax! I'm not a monster!"
  npc_override_1@gl_k_OldGlastHeim_s_dangerous_here_0184f5: "It's dangerous here..."
  npc_override_1@gl_k_OldGlastHeim_s_dangerous_here_you_kno_cb018e: "It's dangerous here. You know the way to the middle passage? Can you move?"
  npc_override_1@gl_k_OldGlastHeim_s_ok_you_ve_already_a78a00: "It's ok. You've already done enough. I can help myself. Good luck to you too."
  npc_override_1@gl_k_OldGlastHeim_s_only_me_4bc3f5: "It's only me."
  npc_override_1@gl_k_OldGlastHeim_safe_2d6a74: "Be safe..."
  npc_override_1@gl_k_OldGlastHeim_save_me_save_me_55b3a3: "Save me! Save me!!!"
  npc_override_1@gl_k_OldGlastHeim_save_me_save_me_please_03b462: "Save me, save me, please..."
  npc_override_1@gl_k_OldGlastHeim_seems_like_you_too_many_0ead20: "^ff0000It seems like you have too many types or weights of items. Please organize your inventory.^000000"
  npc_override_1@gl_k_OldGlastHeim_seems_you_did_receive_re_b4de14: "^0000ffIt seems that you did not receive a reward for clearing the first floor. Talk to Varmundt and receive your reward.^000000"
  npc_override_1@gl_k_OldGlastHeim_she_might_even_destroy_w_c3f538: "She might even destroy this whole castle if she wanted to."
  npc_override_1@gl_k_OldGlastHeim_she_ruler_death_dead_man_c4fa86: "She is the Ruler of Death, Dead man's Valkyrie. Himelmez is looking to take the heart of Ymir from us."
  npc_override_1@gl_k_OldGlastHeim_sir_heinrich_varmundt_d3dc71: "Sir Heinrich. Varmundt..."
  npc_override_1@gl_k_OldGlastHeim_sir_heinrich_you_know_wh_b13219: "Sir Heinrich. Do you know what is happening in the castle now?"
  npc_override_1@gl_k_OldGlastHeim_something_you_want_tell_add4c7: "Something you want to tell me?"
  npc_override_1@gl_k_OldGlastHeim_sorry_i_t_go_you_aea375: "Sorry, I can't go with you."
  npc_override_1@gl_k_OldGlastHeim_staying_healthy_importan_70e74c: "Staying healthy is important, so please take a break and come back again later."
  npc_override_1@gl_k_OldGlastHeim_t_take_off_bridle_f18011: "Can't take off this bridle..."
  npc_override_1@gl_k_OldGlastHeim_thank_you_help_we_don_abf667: "Thank you for the help. But we don't even have our king with us right now."
  npc_override_1@gl_k_OldGlastHeim_there_king_named_shumich_d0f38b: "There was a King named Shumiche who was known as a tyrant in the history of the Rune-Midgarts Kingdom."
  npc_override_1@gl_k_OldGlastHeim_there_s_something_like_h_8303c1: "There's something like that here?"
  npc_override_1@gl_k_OldGlastHeim_there_something_you_need_ae04a2: "Is there something you need?"
  npc_override_1@gl_k_OldGlastHeim_time_gap_yet_open_c7c9a6: "The time gap is not yet open."
  npc_override_1@gl_k_OldGlastHeim_time_reveal_true_answers_11109b: "Time will reveal the true answers if we look in the right places."
  npc_override_1@gl_k_OldGlastHeim_umm_did_you_see_me_ed822d: "Umm? Did you see me at another place? I don't think so. What about this time?"
  npc_override_1@gl_k_OldGlastHeim_unknown_error_occurred_58bda4: "An unknown error has occurred."
  npc_override_1@gl_k_OldGlastHeim_uuuuu_khhhah_just_run_aw_c1ed69: "Uuuuu... Khhhah! Just run away with the commander."
  npc_override_1@gl_k_OldGlastHeim_varmundt_s_time_stopped_e5a18f: "Varmundt's time is stopped by me."
  npc_override_1@gl_k_OldGlastHeim_wake_up_kid_go_east_a895cb: "Wake up kid! Go east and find the middle passage to the outside! It is safe there!"
  npc_override_1@gl_k_OldGlastHeim_we_cannot_risk_moving_he_4b1aaa: "We cannot risk moving the heart just because some stranger says so."
  npc_override_1@gl_k_OldGlastHeim_we_don_t_much_time_f30c60: "We don't have much time. We must report to Sir Heinrich about Himelmez's invasion."
  npc_override_1@gl_k_OldGlastHeim_we_met_before_no_way_0283c5: "Have we met before? No way. It's my first time seeing you. What do you want?"
  npc_override_1@gl_k_OldGlastHeim_we_must_hide_heart_piece_39e00d: "We must hide the heart piece in a safe place before Himelmez's attack starts!"
  npc_override_1@gl_k_OldGlastHeim_what_did_you_say_just_051ed8: "What did you say just before?"
  npc_override_1@gl_k_OldGlastHeim_what_i_you_3d61cf: "What can I do for you?"
  npc_override_1@gl_k_OldGlastHeim_what_something_wrong_cas_fdad50: "What is it? Something wrong with the castle?"
  npc_override_1@gl_k_OldGlastHeim_what_you_putting_himelme_bd456d: "What are you putting on Himelmez!"
  npc_override_1@gl_k_OldGlastHeim_where_s_your_leader_i_c80b69: "Where's your leader? I need his help."
  npc_override_1@gl_k_OldGlastHeim_where_your_leader_i_must_1535fe: "Where is your leader? I must talk to him."
  npc_override_1@gl_k_OldGlastHeim_who_himelmez_9124a8: "Who is Himelmez?"
  npc_override_1@gl_k_OldGlastHeim_why_don_t_you_come_2cb17e: "Why don't you come back after becoming stronger?"
  npc_override_1@gl_k_OldGlastHeim_why_don_t_you_make_3b3e5f: "Why don't you make a party with more than 1 person and talk to me again?"
  npc_override_1@gl_k_OldGlastHeim_yes_i_move_i_need_dc7f93: "Yes, I can move. I need to get out of here."
  npc_override_1@gl_k_OldGlastHeim_you_ever_wondered_about_a7bdff: "Have you ever wondered about the history of Glast Heim?"
  npc_override_1@gl_k_OldGlastHeim_you_human_33c6c4: "You human?"
  npc_override_1@gl_k_OldGlastHeim_you_just_me_a7de1c: "You were just with me..."
  npc_override_1@gl_k_OldGlastHeim_you_one_herico_sent_help_1902e7: "Are you the one ^0000ffHerico^000000 sent to help me?"
  npc_override_1@gl_k_OldGlastHeim_you_previous_clear_recor_f5c45f: "You have a previous clear record. You can skip the scenario and proceed accordingly."
  npc_override_1@gl_k_OldGlastHeim_you_still_after_effects_cf45bb: "You still have after-effects of time travel. You can't travel again with this condition."
  npc_override_1@gl_k_OldGlastHeim_you_varmundt_commander_w_d32527: "Are you with Varmundt? Commander is waiting for you."
  npc_override_1@gl_k_OldGlastHeim_you_want_time_travel_469fed: "Do you want to time travel?"
  npc_override_1@gl_k_OldGlastHeim_your_body_fit_enter_time_418b0b: "Your body is not fit to enter the time gap. You won't be able to get in if you're not in a party."
  npc_override_1@gl_k_OldGlastHeim_your_time_distorted_soon_c2558f: "And your time will be distorted soon."
