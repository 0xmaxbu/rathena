  npc_override_prt_cas_quests_16_1_so_ae8946: "...So..."
  npc_override_prt_cas_quests_16_1_so_beautiful_i_couldn_t_907267: "It was so beautiful that I couldn't take my eyes off them."
  npc_override_prt_cas_quests_16_1_so_c7572d: "So..."
