  npc_override_prt_cas_quests_16_1_i_wonder_where_they_they_c9d2b9: "I wonder where they are. They are so scattered that it is difficult to locate each one of them. Hahaha!"
  npc_override_prt_cas_quests_16_1_i_wonder_you_know_candid_eb9c9d: "I wonder of you know this, ^0000cdthe candidate from our family was involved in an unfortunate incident^000000 in the ^0000cdprevious Royal Assembly^000000."
