  npc_override_prt_cas_quests_16_1_if_one_our_descendants_h_c1d268: "If one of our descendants happen to read this record,"
  npc_override_prt_cas_quests_16_1_if_our_family_turns_out_37d668: "If our family turns out a king, much of our fortune will be spent. Once, our family has really suffered from it."
  npc_override_prt_cas_quests_16_1_if_so_he_over_there_f68b54: "If so, he is over there. You can find him there."
