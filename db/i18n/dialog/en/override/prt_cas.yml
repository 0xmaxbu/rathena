  npc_override_prt_cas_quests_16_1_so_you_should_go_see_7e53b7: "So you should go see Spica."
  npc_override_prt_cas_quests_16_1_so_you_supposed_adventur_04a3cf: "So you are supposed to be an adventurer invited to the banquet, right?"
  npc_override_prt_cas_quests_16_1_some_discussed_idea_duri_feeaa0: "Some discussed the idea during the meeting to ask the famous adventurer to handle the problem at the restricted area. No approval was given to it, but I'll see what I can do with my authority."
