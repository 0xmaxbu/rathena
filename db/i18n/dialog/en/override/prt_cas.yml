  npc_override_prt_cas_quests_16_1_simple_prove_your_streng_a356e5: "Simple. Prove your strength. You will know ^0000cdMajoruros^000000, I think."
  npc_override_prt_cas_quests_16_1_since_ashbacuum_been_tak_bf81c3: "Since Ashbacuum has been taken care of, I want to go home and take a nap. However, they are holding me here."
