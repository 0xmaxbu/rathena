  npc_override_prt_cas_quests_16_1_so_i_told_them_i_41afeb: "So I told them I would gracefully let them pass with their wings and, in return, they should give me that blue gems."
  npc_override_prt_cas_quests_16_1_so_if_he_hasn_t_b275f0: "So if he hasn't changed much, that means he's not going to make a problem. I'm relieved to hear that."
  npc_override_prt_cas_quests_16_1_so_losing_beloved_ones_m_d527f9: "So losing beloved ones, my children and I came to live together."
  npc_override_prt_cas_quests_16_1_so_my_goal_unify_contine_cd2b8c: "So, my goal was to unify the continent and make my power reached at every corner of the continent. So I trained and trained myself."
  npc_override_prt_cas_quests_16_1_so_our_new_king_acknowle_5c4854: "So that our new king is acknowledged by all the people of this land."
  npc_override_prt_cas_quests_16_1_so_please_get_me_i_e7e8f7: "So please get me ^0000cd5 {0}^000000. I think that amount of star dusts can decorate the entire dress."
  npc_override_prt_cas_quests_16_1_so_please_me_course_you_d2c894: "So, please do it for me. Of course, you may refuse it. But I wonder I can find a reliable person like you."
  npc_override_prt_cas_quests_16_1_so_princes_must_been_poi_fb095e: "...So the princes must have been poisoned..."
  npc_override_prt_cas_quests_16_1_so_queen_who_handling_al_249f6f: "So is the queen who is handling all the matters of the palace now?"
  npc_override_prt_cas_quests_16_1_so_s_shame_sure_come_79a703: "Is that so? That's a shame. Be sure to come back again if you have the time..."
  npc_override_prt_cas_quests_16_1_so_then_what_i_help_70d451: "Is that so... Then what can I do to help you? I'll do whatever I can do to reveal the truth."
