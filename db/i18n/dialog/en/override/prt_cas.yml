  npc_override_prt_cas_quests_16_1_if_gets_out_my_family_2e92bd: "If it gets out, my family can deny it."
  npc_override_prt_cas_quests_16_1_if_he_doesn_t_try_aa6ac5: "If he doesn't try to do anything to you, it must be the best that could ever happen."
