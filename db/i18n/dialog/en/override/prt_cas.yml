  npc_override_prt_cas_quests_16_1_sorry_about_all_trouble_37593f: "Sorry about all the trouble."
  npc_override_prt_cas_quests_16_1_sorry_about_difficult_re_b0059e: "Sorry about the difficult request. I guess I should go there myself. You may be able to see the news that the heir of the Wigner family has been crushed to death by his followers on Daily Rune-Midgarts tomorrow morning."
