  npc_override_prt_cas_quests_16_1_i_worried_about_as_well_d5090f: "I was worried about it as well. Please, dear adventurer, help us. The loving relationship among us depends on you."
  npc_override_prt_cas_quests_16_1_i_wouldn_t_let_go_9a676b: "I wouldn't let it go without them! I won't! I'll tell people that there is an adventurer who frames an innocent person! He!"
  npc_override_prt_cas_quests_16_1_i_wouldn_t_mind_862839: "I wouldn't mind."
  npc_override_prt_cas_quests_16_1_if_anything_goes_missing_104f4b: "If anything goes missing, it is always us, the ordinary people, who are suspected. Do you know that it is just a prejudice?"
