  npc_override_prt_cas_quests_16_1_when_i_reported_contribu_1540c4: "When I was reported of the contributions you made, a question came to my mind. What if a free roaming adventure take part in the strict training system? What would happen? I got curious."
  npc_override_prt_cas_quests_16_1_when_i_see_person_i_091a11: "When I see a person, I need to identify the position of the wallet, any weapon in possession, the target's wits and how fast the target can run in a moment. This job required such a special quality."
  npc_override_prt_cas_quests_16_1_when_i_think_front_threa_be2eaf: "But when I think of the front threatened by the monster, I feel heavy-hearted. Of course, I believe that my men are doing well to protect the territory."
  npc_override_prt_cas_quests_16_1_when_i_told_him_i_e37069: "When I told him that I would fill her spot, he said there were enough male chamberlains and ^0000cdhe needed a maid^000000 who would work in the kitchen and run cleaning duties."
