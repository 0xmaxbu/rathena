  npc_override_prt_cas_quests_16_1_everyone_dresses_so_fanc_2bbd64: "Everyone dresses so fancy..."
  npc_override_prt_cas_quests_16_1_everyone_else_looks_so_n_275369: "Everyone else looks so nice, and I feel rather underdressed."
