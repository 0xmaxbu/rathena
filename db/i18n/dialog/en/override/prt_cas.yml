  npc_override_prt_cas_quests_16_1_if_i_really_sad_i_0d9141: "If not, I will be really sad. I'm skipping meals to wear the pretty dress. So I'm so sensitive now."
  npc_override_prt_cas_quests_16_1_if_i_show_my_face_3398e9: "If I show my face, it may just disturb their concentration. I'd rather go without seeing them."
  npc_override_prt_cas_quests_16_1_if_katrin_son_i_gladly_b637fd: "If Katrin was a son, I would have gladly leave everything to her."
