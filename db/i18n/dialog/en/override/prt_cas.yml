Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_prt_cas_prontera_go_back_nillem_2146c4: "Go back to Nillem."
  npc_override_prt_cas_prontera_let_s_first_reply_servan_1266d5: "Let's first reply to the servant that the invitation will be accepted."
  npc_override_prt_cas_prontera_locked_e389af: "It is locked."
  npc_override_prt_cas_prontera_there_more_find_out_598afb: "There are more to find out."
  npc_override_prt_cas_prontera_you_cannot_go_way_5a9606: "You cannot go that way."
  npc_override_prt_cas_quests_16_1_aaarrgghh_ad9eed: "Aaarrgghh--!!"
  npc_override_prt_cas_quests_16_1_aaarrgghhh_87d662: "Aaarrgghhh--!!"
  npc_override_prt_cas_quests_16_1_aarghh_darkness_about_st_cd0566: "Aarghh!! Darkness is about to stomp around!"
  npc_override_prt_cas_quests_16_1_about_6351fe: "This is about it."
  npc_override_prt_cas_quests_16_1_about_confinement_ok_as_771dbe: "And about the confinement, it is OK as long as I stay in the western wing of the royal villa..."
  npc_override_prt_cas_quests_16_1_about_disappeared_terra_6a570e: "And about disappeared ^4d4dffTerra Gloria^000000"
  npc_override_prt_cas_quests_16_1_about_star_blessing_they_c25496: "And about the Star of Blessing... They said..."
  npc_override_prt_cas_quests_16_1_about_what_our_children_fb2201: "Is it about what our children have asked you?"
  npc_override_prt_cas_quests_16_1_about_wolf_6e608c: "Is it about Wolf?"
  npc_override_prt_cas_quests_16_1_accept_quest_before_you_f53b76: "Accept a quest before you customize the setting."
  npc_override_prt_cas_quests_16_1_accidents_happen_when_yo_c94f38: "Accidents happen when you let your guard down. Always make sure to watch out."
  npc_override_prt_cas_quests_16_1_actually_they_alive_just_fd785f: "Actually, they were alive just before they were found. But, the access was delayed and they had to die in pains."
  npc_override_prt_cas_quests_16_1_actually_what_they_need_5eff52: "But actually what they need was education, but warm heart."
  npc_override_prt_cas_quests_16_1_adds_some_sparkles_dish_69a8a5: "It adds some sparkles to the dish."
  npc_override_prt_cas_quests_16_1_adventurer_helped_us_i_g_63b27e: "The adventurer helped us. I guess those were the times when we were the closest to one another. Look at this."
  npc_override_prt_cas_quests_16_1_adventurer_how_did_your_1baa95: "Adventurer, how did your meeting with the Guardian Knight in Alberta go? Not that I expect too much..."
  npc_override_prt_cas_quests_16_1_adventurer_i_guess_you_n_280807: "An adventurer? I guess you need to try harder now."
  npc_override_prt_cas_quests_16_1_adventurer_what_brought_9f437a: "Adventurer? What brought you here?"
  npc_override_prt_cas_quests_16_1_adventurer_you_back_how_68bc61: "Adventurer, you are back. How did it go?"
  npc_override_prt_cas_quests_16_1_after_collecting_all_hon_222113: "After collecting all the Honor Marks, I'll take that build a castle on the shore and spend the rest of my life there with that stubborn Arner."
  npc_override_prt_cas_quests_16_1_after_coming_home_myer_d_1d9c48: "After coming home, Myer was doing well for a while. But he left us with a note. Only Agnes has been growing well without a problem."
  npc_override_prt_cas_quests_16_1_after_consulting_my_moth_627277: "After consulting my mother, I decided to work here pretending as if I was my sister. Since everyone was so busy, no one paid attention to me who was working quietly in this corner."
  npc_override_prt_cas_quests_16_1_after_discussion_our_fam_fca5de: "After discussion, our family decided not to take part in the ^0000cdRoyal Assembly^000000 this time."
  npc_override_prt_cas_quests_16_1_after_long_sleep_i_am_1a38a2: "After a long sleep, I am waken up before such a mess."
  npc_override_prt_cas_quests_16_1_after_long_time_i_heard_e3a13d: "After a long time, I heard the rumor about the violent behavior which caused Isenarm to be killed."
  npc_override_prt_cas_quests_16_1_after_removing_all_those_9512f7: "Not this, not that... After removing all those things, there aren't many left for the aristocrats other than paper work and socializing."
  npc_override_prt_cas_quests_16_1_after_royal_assembly_ove_ff3f28: "After the Royal Assembly is over, the queen may turn over the throne to the new king, and go to the castle of Scarlet."
  npc_override_prt_cas_quests_16_1_again_i_really_hoped_he_65aad4: "Again... I really hoped he would have given up by today... I guess it must have been a vain hope."
  npc_override_prt_cas_quests_16_1_agnes_don_t_say_appropri_51784b: "Agnes, don't say that. it is not appropriate. We are telling the adventurer of the story of the Roegenburg..."
  npc_override_prt_cas_quests_16_1_agnes_our_favored_child_8471ce: "Agnes was our favored child in the family. She was the only little sister."
  npc_override_prt_cas_quests_16_1_agnes_right_both_you_ple_64ffd8: "Agnes is right. Both of you, please stop fighting."
  npc_override_prt_cas_quests_16_1_ah_971301: "Ah..."
  npc_override_prt_cas_quests_16_1_ah_a2d82f: "Ah, it is...."
  npc_override_prt_cas_quests_16_1_ah_anyway_i_am_sorry_810fa8: "Ah, anyway, I am sorry that we showed you an unpleasant family affairs."
  npc_override_prt_cas_quests_16_1_ah_b9cc35: "Ah....!"
  npc_override_prt_cas_quests_16_1_ah_he_also_said_he_5b48e7: "Ah, he also said he would come after the banquet is finished."
  npc_override_prt_cas_quests_16_1_ah_how_i_fit_pearl_429a35: "Ah, how can I fit the pearl necklace and look nice with my partner?"
  npc_override_prt_cas_quests_16_1_ah_i_am_sorry_talk_1fba61: "Ah, I am sorry to talk too much on our family. I have become talkative as I get old."
  npc_override_prt_cas_quests_16_1_ah_i_am_sorry_you_35d540: "Ah, I am sorry that you saw"
  npc_override_prt_cas_quests_16_1_ah_i_i_had_some_f53e1d: "Ah, do I? I had to do some errands to find the rumor."
  npc_override_prt_cas_quests_16_1_ah_i_know_story_all_01706b: "Ah!, I know that story! All of us know it!"
  npc_override_prt_cas_quests_16_1_ah_i_m_sorry_i_f7fcf7: "Ah, I'm sorry. I got angry suddenly."
  npc_override_prt_cas_quests_16_1_ah_i_need_handkerchief_t_c9a76d: "Ah, I need a handkerchief. There are so many things to do and I'm so busy."
  npc_override_prt_cas_quests_16_1_ah_i_see_df4b54: "Ah, I see."
  npc_override_prt_cas_quests_16_1_ah_i_wish_she_here_efad62: "Ah, I wish that she was here!"
  npc_override_prt_cas_quests_16_1_ah_myer_brother_brother_a140be: "Ah, Myer, brother! brother!"
  npc_override_prt_cas_quests_16_1_ah_no_if_you_feel_f9c72a: "Ah, no it is not. If you feel unpleasant, I am sorry. I just don't have reliable person."
  npc_override_prt_cas_quests_16_1_ah_sector_h_bursts_into_2110c2: "Ah, Sector H! ~Bursts into laughter~ Is he still a whiner?"
  npc_override_prt_cas_quests_16_1_ah_sorry_i_couldn_t_705d77: "Ah, sorry, I couldn't clean myself for a few days."
  npc_override_prt_cas_quests_16_1_ah_talk_then_17647c: "Ah. have a talk then."
  npc_override_prt_cas_quests_16_1_ah_there_he_comes_jonath_5609ee: "Ah, there he comes!, Jonathan! We have a guest."
  npc_override_prt_cas_quests_16_1_ah_you_dear_adventurer_p_b117cf: "Ah, it was you, dear adventurer. Please excuse me."
  npc_override_prt_cas_quests_16_1_ahem_anyways_all_been_pr_59eeae: "Ahem. Anyways, it has all been prepared."
  npc_override_prt_cas_quests_16_1_all_adventurers_count_th_b5f4ad: "Do all the adventurers count on their hunch like that? This could be dangerous. It is no matter to approach with a hunch."
  npc_override_prt_cas_quests_16_1_all_calls_available_addi_09b567: "All calls are available, but additional charge may apply to each service."
  npc_override_prt_cas_quests_16_1_all_cutting_delivery_wor_22b948: "All the cutting and delivery work will break my back."
  npc_override_prt_cas_quests_16_1_all_gorgeous_pieces_furn_61f9d0: "All the gorgeous pieces of furniture and carpets... I have never seen tiger skin as white and huge as that one in there."
  npc_override_prt_cas_quests_16_1_all_hp_sp_recovered_bd6eb2: "^4d4dff All HP and SP are recovered!"
  npc_override_prt_cas_quests_16_1_all_i_been_enjoying_conv_2844a5: "Not at all. I have been enjoying the conversation."
  npc_override_prt_cas_quests_16_1_all_jurgen_seemed_grown_faaf1b: "Not at all. Jurgen seemed to have grown since my last visit."
  npc_override_prt_cas_quests_16_1_all_let_us_give_you_a0cbf8: "Not at all. Let us give you the official invitation next time."
  npc_override_prt_cas_quests_16_1_all_my_son_supposed_lear_e69cfd: "Not at all. My son is supposed to be learning from your smart grandson. Haha."
  npc_override_prt_cas_quests_16_1_all_nobility_who_charge_5bac09: "All the nobility who are in charge of the market in Rune Midgarts are here. We, the Cat Hand Services, shouldn't miss this chance."
  npc_override_prt_cas_quests_16_1_all_please_come_nonsense_4d8ca6: "Not at all. Please come in. It is a nonsense that you cannot clean the room because of the people inside."
  npc_override_prt_cas_quests_16_1_all_quests_related_under_1b5479: "All quests related with the underground dungeon will be reset."
  npc_override_prt_cas_quests_16_1_all_staff_i_trust_doing_3c2d8b: "All staff I can have trust in are doing other jobs and I have no person except you."
  npc_override_prt_cas_quests_16_1_all_theses_things_thanks_96253b: "All theses things are thanks to you. I feel safe now that everyone has their right places and will work hard for the family and country."
  npc_override_prt_cas_quests_16_1_all_they_sort_out_puppet_fc6a37: "...All they can do is to sort out the puppets infiltrated into the palace."
  npc_override_prt_cas_quests_16_1_all_we_give_you_now_35f78c: "That is all we can give you for now as the reward."
  npc_override_prt_cas_quests_16_1_all_women_i_seen_so_8ed23c: "All the women I have seen so far are like flowers in the greenhouse. However, she resembles a wild flower in the field."
  npc_override_prt_cas_quests_16_1_all_you_helmut_wolf_myer_3fc1f2: "All of you, Helmut, Wolf and Myer."
  npc_override_prt_cas_quests_16_1_all_your_own_good_1ed21e: "It is all for your own good!"
  npc_override_prt_cas_quests_16_1_almost_impossible_meet_t_66dcf0: "It is almost impossible to meet them usually. What a great chance you have to be able to visit them officially."
  npc_override_prt_cas_quests_16_1_already_happened_we_need_74830c: "It has already happened. We need to prepare for the future."
  npc_override_prt_cas_quests_16_1_already_time_hear_news_o_aafc20: "Is it already that time to hear the news from the old fellow of mine?"
  npc_override_prt_cas_quests_16_1_alright_then_what_should_147e7e: "Alright, then! What should we talk about first?"
  npc_override_prt_cas_quests_16_1_alright_whatever_i_ll_le_352f41: "Alright, whatever. I'll let you in on it just this once."
  npc_override_prt_cas_quests_16_1_also_impossible_meet_ern_2d2f39: "Also, it is impossible to meet ^0000cdErnst Geoborg^000000."
  npc_override_prt_cas_quests_16_1_also_only_rumor_i_am_bf522e: "This is also only a rumor. I am sure it is true. Anyway I heard that they were murdered,"
  npc_override_prt_cas_quests_16_1_also_south_east_central_b3c45b: "Also, in the south east of the central fountain,"
  npc_override_prt_cas_quests_16_1_also_story_guardian_knig_218fae: "And also the story of the Guardian Knight who betrayed his master..."
  npc_override_prt_cas_quests_16_1_although_adventurers_may_d432b1: "Although the adventurers may care less about the palace affairs, the Richard family is in charge of the military force of Rune-Midgarts."
  npc_override_prt_cas_quests_16_1_although_banquet_held_qu_d6eeab: "Although the banquet will be held for quite a while, don't take too much time to get there."
  npc_override_prt_cas_quests_16_1_although_i_feel_reluctan_f5bb4a: "Although I feel reluctant to reveal somewhat embarrassing part of the royal family to you,"
  npc_override_prt_cas_quests_16_1_although_i_may_look_like_a091d3: "Although I may look like this now, I used to be called the man with the hand of minus out there. It is quite dangerous stuff. You'd better stay away."
  npc_override_prt_cas_quests_16_1_although_shedhar_current_98f907: "Although Shedhar, the current head of the family, is not here, Spica has all the actual power."
  npc_override_prt_cas_quests_16_1_although_there_direct_ga_7fe943: "Although there are direct gates installed in the palace for convenience,"
  npc_override_prt_cas_quests_16_1_although_there_document_298747: "Although there is a document saying that some crusader lost the document containing the charge and the sentence made..."
  npc_override_prt_cas_quests_16_1_although_us_walther_fami_92230a: "Although us, the Walther family did not attend the Royal Assembly, we won't sit back and watch this matter!"
  npc_override_prt_cas_quests_16_1_although_walther_family_1c83c6: "Although ^0000cdthe Walther family doesn't participate in the Royal Assembly^000000, we are attending the banquet as one of the seven royal families."
  npc_override_prt_cas_quests_16_1_although_we_going_discus_ce5cd4: "Although we are going to discuss about it in the official meeting, I don't think the result would be different."
  npc_override_prt_cas_quests_16_1_always_great_joy_listen_e12b66: "It is always a great joy to listen to the stories of the people who have gone through a lot of experiences."
  npc_override_prt_cas_quests_16_1_always_my_pleasure_atten_54b0ef: "It is always my pleasure to attend a banquet. Traveling and learning about different cultures are always interesting. It just makes it better to have good music and delicious food."
  npc_override_prt_cas_quests_16_1_always_tiring_attend_ban_6cf86c: "It is always tiring to attend a banquet. I am still tired from the trip, it is just too painful to mingle with people... Phew..."
  npc_override_prt_cas_quests_16_1_am_i_bad_actress_0d71a5: "Am I a bad actress?"
  npc_override_prt_cas_quests_16_1_am_i_because_those_eyes_6a51f7: "Am I? Because those eyes look so gorgeous."
  npc_override_prt_cas_quests_16_1_am_i_drunk_e1c355: "...Am I drunk?"
  npc_override_prt_cas_quests_16_1_am_i_going_killed_now_a57afb: "Am I going to be killed now?"
  npc_override_prt_cas_quests_16_1_am_i_suspect_here_d81e9a: "Am I a suspect here?"
  npc_override_prt_cas_quests_16_1_am_i_too_late_96a9dc: "Am I too late?"
  npc_override_prt_cas_quests_16_1_among_three_us_must_been_b77fdb: "Among the three of us, it must have been the hardest for our sister."
  npc_override_prt_cas_quests_16_1_and_f0fa6b: "And..."
  npc_override_prt_cas_quests_16_1_anyone_such_power_c0a170: "Not anyone can have such power."
  npc_override_prt_cas_quests_16_1_anyone_without_credentia_128d48: "Anyone without credentials cannot hear good stories. Go back."
  npc_override_prt_cas_quests_16_1_anything_else_give_me_d6332a: "Anything else to give me?"
  npc_override_prt_cas_quests_16_1_anything_happened_there_69e3f3: "Has anything happened in there?"
  npc_override_prt_cas_quests_16_1_anything_happened_you_f58d1f: "Has anything happened to you?"
  npc_override_prt_cas_quests_16_1_anytime_you_want_1acb3b: "anytime you want."
  npc_override_prt_cas_quests_16_1_anyway_he_means_well_c87236: "Anyway, he means well."
  npc_override_prt_cas_quests_16_1_anyway_house_goes_well_w_05c0b2: "Anyway, this house goes well without me. I don't worry about the family, but I am only worried about my grandfather, as he is quite old."
  npc_override_prt_cas_quests_16_1_anyway_i_am_sorry_i_e6dd22: "Anyway, I am sorry that I can't be of any help to you."
  npc_override_prt_cas_quests_16_1_anyway_i_am_sorry_put_99e24b: "Anyway, I am sorry to put you in the difficult situation again today."
  npc_override_prt_cas_quests_16_1_anyway_i_think_i_visit_b8a4f5: "Anyway, I think I have to visit the house. The house has been annoying, but I think that it will be interesting. Please tell my family that I will help them here while I am doing my job."
  npc_override_prt_cas_quests_16_1_anyway_i_think_we_make_173c86: "Anyway, I think we have to make preparation to welcome him seriously."
  npc_override_prt_cas_quests_16_1_anyway_let_s_wait_see_b8b360: "Anyway, let's wait and see, as they are trying to think like adults."
  npc_override_prt_cas_quests_16_1_anyway_life_short_what_m_2b4ec3: "Anyway life is short. What moves people is heart, not money or power."
  npc_override_prt_cas_quests_16_1_anyway_relief_hear_he_ha_d4aa8e: "Anyway, it is a relief to hear he hasn't caused any trouble there."
  npc_override_prt_cas_quests_16_1_anyway_there_no_document_80a4d9: "Anyway, there is no document left about them ? for what they were charged or sentences confirmed against them."
  npc_override_prt_cas_quests_16_1_anyway_who_we_need_worry_6f61cd: "Anyway, who we need to worry about is our sister. Has she ever been mad at us? What should we do when she is upset?"
  npc_override_prt_cas_quests_16_1_anyways_i_am_filling_spi_a8dbf3: "Anyways, I am filling in for Spica who has left to run some errands now."
  npc_override_prt_cas_quests_16_1_anyways_i_found_shabby_m_479ba8: "Anyways, I found a shabby man who seemed so defenseless in the market there. His wallet was fat. So I took it and went off."
  npc_override_prt_cas_quests_16_1_anyways_i_guess_we_warn_c8e512: "...Anyways, I guess we have to warn the elders about this."
  npc_override_prt_cas_quests_16_1_anyways_if_you_need_help_264183: "Anyways, if you need help, please let me know anytime."
  npc_override_prt_cas_quests_16_1_anyways_isaac_seems_busy_ec665e: "Anyways, Isaac seems busy doing something these days. Do you know what he is doing?"
  npc_override_prt_cas_quests_16_1_anyways_my_profession_re_18d2b7: "Anyways, my profession required a sharp eye to catch whatever is significant at a glance. That's how I thrive in this field."
  npc_override_prt_cas_quests_16_1_anyways_sure_seems_suspi_74cdcc: "Anyways, it sure seems suspicious. Thank you for your information."
  npc_override_prt_cas_quests_16_1_anyways_we_invited_honor_b9776f: "Anyways, we are invited to an honorable place like this thanks to Orint."
  npc_override_prt_cas_quests_16_1_anyways_we_managed_find_c78197: "Anyways, we have managed to find this dining room where aren't many people. But we need to go back soon."
  npc_override_prt_cas_quests_16_1_anyways_what_i_want_say_ab82e3: "Anyways, what I want to say is that"
  npc_override_prt_cas_quests_16_1_apart_well_i_am_supposed_2a330b: "Apart from it, well, I am not supposed to be curious about this kind of things..."
  npc_override_prt_cas_quests_16_1_apologies_making_you_unc_a711c3: "Apologies for making you uncomfortable. I am sorry again but can you do me a favor?"
  npc_override_prt_cas_quests_16_1_approach_closer_a30922: "Approach closer."
  npc_override_prt_cas_quests_16_1_appropriate_talk_about_f_7ffdb5: "It is not appropriate to talk about the family matter in front of the guest."
  npc_override_prt_cas_quests_16_1_archduke_been_waiting_yo_2e4e75: "The archduke has been waiting for you."
  npc_override_prt_cas_quests_16_1_archduke_grantz_been_wai_c25176: "Archduke Grantz has been waiting for you for a while."
  npc_override_prt_cas_quests_16_1_archduke_please_don_t_to_338261: "...Archduke, please don't be too harsh on Nyhill."
  npc_override_prt_cas_quests_16_1_aren_t_they_nerius_siste_af1b5b: "Aren't they the Nerius sisters who are from that famous family led by a woman?"
  npc_override_prt_cas_quests_16_1_aren_t_we_heading_out_0e7aba: "Aren't we heading out?"
  npc_override_prt_cas_quests_16_1_aren_t_you_adventurer_wh_023d99: "Aren't you the adventurer who was at the Wigner residence?"
  npc_override_prt_cas_quests_16_1_aren_t_you_curious_43accf: "Aren't you curious?"
  npc_override_prt_cas_quests_16_1_aren_t_you_following_him_3f1678: "...Aren't you following him?"
  npc_override_prt_cas_quests_16_1_aren_t_you_going_execute_ccf23c: "Aren't you going to execute me?"
  npc_override_prt_cas_quests_16_1_aren_t_you_one_who_b736ad: "Aren't you the one who has infiltrated the room before? You don't have to run hiding your face! Come back here!"
  npc_override_prt_cas_quests_16_1_argh_43ffb4: "Argh!"
  npc_override_prt_cas_quests_16_1_argh_again_i_am_terrifie_3aeb03: "Argh! Not again! I am terrified!"
  npc_override_prt_cas_quests_16_1_argh_again_i_am_terrifie_8f2339: "Argh! Not again! I am terrified! But I would be safe as long as I am locked in here."
  npc_override_prt_cas_quests_16_1_argh_how_dare_3f4565: "Argh... How dare...!"
  npc_override_prt_cas_quests_16_1_argh_i_never_been_place_d7fdfa: "Argh... I have never been to a place like this..."
  npc_override_prt_cas_quests_16_1_argh_my_arms_there_anyon_cba8bb: "Argh... My arms... Was there anyone else in the room?"
  npc_override_prt_cas_quests_16_1_argh_those_undead_bastar_6bbfce: "Argh... Those undead bastards... I'll kill them all..."
  npc_override_prt_cas_quests_16_1_argh_those_undead_e8a263: "Argh.... Those undead..."
  npc_override_prt_cas_quests_16_1_argh_undead_bring_965397: "Argh! The undead! Bring it on!"
  npc_override_prt_cas_quests_16_1_argh_what_waste_be8d2b: "Argh, what a waste."
  npc_override_prt_cas_quests_16_1_argh_why_she_upset_9a8803: "Argh! Why is she upset?"
  npc_override_prt_cas_quests_16_1_arghhhh_a17c9c: "Arghhhh!"
