  npc_override_prt_cas_quests_16_1_if_he_king_material_he_167aaf: "If he is a king material, he will be. If not, he doesn't have to be the king. I don't want to stress him out for that."
  npc_override_prt_cas_quests_16_1_if_helmut_roegenburg_bec_b30916: "if Helmut Roegenburg becomes a king...., Ah by the way, do you know a rumor about the Roegenburg, especially the rumor on the ^0000cddeath of the four children^000000."
  npc_override_prt_cas_quests_16_1_if_i_don_t_show_3ab765: "If I don't show up, come to the ^4d4dffPast Memories of the Royal Family^000000 right away."
  npc_override_prt_cas_quests_16_1_if_i_follow_him_like_8fe823: "If I follow him like this, everyone will find me strange."
  npc_override_prt_cas_quests_16_1_if_i_get_busted_i_ec2b2f: "^0000cdIf I get busted, I would be in trouble^000000. We don't have the money to pay the compensation."
  npc_override_prt_cas_quests_16_1_if_i_go_out_get_beda0e: "If I go out to get a dress, I may be the first princess in Rune-Midgarts who dies for a dress. So would you please save me from this situation?"
