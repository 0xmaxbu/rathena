  npc_override_prt_cas_quests_16_1_there_zero_monster_begin_0ae52f: "There was zero monster in the beginning for sure, but, out of the total blue, they started to appear in the underground dungeons."
  npc_override_prt_cas_quests_16_1_therefore_i_told_my_gran_7210d2: "Therefore, I told my grandfather that I want to have some more dresses to prepare for all situations, but he said that what I have now is enough. Does it make sense?"
