  npc_override_prt_cas_quests_16_1_i_am_waiting_ship_izlude_c86238: "I am waiting for the ship to Izlude. I will rush to the ship when it comes here."
  npc_override_prt_cas_quests_16_1_i_am_way_go_hide_c0d5cf: "I am on the way to go hide in the shelter nearby. Would you come with me?"
  npc_override_prt_cas_quests_16_1_i_am_well_taken_care_3ce4e1: "I am well taken care of by Crux."
  npc_override_prt_cas_quests_16_1_i_am_willing_so_cf34ba: "I am willing to do so."
  npc_override_prt_cas_quests_16_1_i_am_worried_about_conse_ea03a2: "I am worried about the consequences if anything goes wrong."
  npc_override_prt_cas_quests_16_1_i_am_worried_about_repre_1f3f90: "I am worried about the representative of our family wandering around like this."
  npc_override_prt_cas_quests_16_1_i_am_worried_helmut_left_9feb5c: "I am worried that ^0000cdHelmut left without a word^000000, as there are many eyes watching him. He is the heir of our family."
  npc_override_prt_cas_quests_16_1_i_am_your_service_0cf79f: "I am at your service."
  npc_override_prt_cas_quests_16_1_i_apologize_behalf_heine_4ec39d: "I apologize on the behalf of the Heine family."
  npc_override_prt_cas_quests_16_1_i_appreciate_what_you_us_dbb546: "I appreciate what you do for us, adventurer."
  npc_override_prt_cas_quests_16_1_i_appreciate_your_effort_addf14: "I appreciate your efforts for the royal family."
  npc_override_prt_cas_quests_16_1_i_appreciate_your_help_t_e4d65d: "I appreciate your help though. I am desperate enough to accept your favor. However, I don't think you wouldn't hear much from the Guardian Knight though."
  npc_override_prt_cas_quests_16_1_i_ask_you_bring_more_3a2b54: "Can I ask you to bring more? I need lots of dresses."
  npc_override_prt_cas_quests_16_1_i_ask_you_get_more_c8ec88: "And Can I ask you to get more? I am afraid that cloth is not sufficient."
  npc_override_prt_cas_quests_16_1_i_asked_what_had_happene_859bd6: "I asked what had happened to the children, but they didn't tell me."
  npc_override_prt_cas_quests_16_1_i_assumed_people_who_all_3bdaa6: "I assumed that the people who have all the money in the world and have seen all the good things in the world must have a keen eye. I stand corrected."
  npc_override_prt_cas_quests_16_1_i_away_long_time_just_12fb6f: "I was away for a long time and have just came back. It is right, isn't?"
  npc_override_prt_cas_quests_16_1_i_b4d4eb: "I can do it."
  npc_override_prt_cas_quests_16_1_i_been_alone_these_days_3ef380: "I have been alone these days as no one has visited the library due to the banquet."
  npc_override_prt_cas_quests_16_1_i_been_asked_your_husban_1fc5e3: "I have been asked by your husband."
  npc_override_prt_cas_quests_16_1_i_been_badgered_head_che_a5365e: "I have been badgered by the Head Chef too much... Haha..."
  npc_override_prt_cas_quests_16_1_i_been_digging_around_li_1340dd: "I have been digging around a little, and I guess we can come here anytime when we want..."
  npc_override_prt_cas_quests_16_1_i_been_seeing_too_many_da3b01: "I have been seeing too many people these days that I am even confused about the familiar faces now."
  npc_override_prt_cas_quests_16_1_i_been_telling_people_we_6ac958: "I have been telling people that we are in costumes. I guess our outfits are not very appropriate for this kind of occasion in Prontera."
  npc_override_prt_cas_quests_16_1_i_been_waiting_you_4ab8e7: "I have been waiting for you."
  npc_override_prt_cas_quests_16_1_i_believe_how_story_got_37209f: "I believe it is how the story got out."
  npc_override_prt_cas_quests_16_1_i_believe_i_haven_t_ecd92d: "I believe I haven't met you before. Are you here to see my father?"
  npc_override_prt_cas_quests_16_1_i_believe_i_most_thoroug_6829eb: "I believe that I have the most thorough knowledge when it comes to the crack of dimension!"
  npc_override_prt_cas_quests_16_1_i_believe_lord_heine_fam_ad408f: "I believe the lord of the Heine family would make a good friend too."
  npc_override_prt_cas_quests_16_1_i_believe_me_806eff: "I believe it was me."
  npc_override_prt_cas_quests_16_1_i_believe_most_important_42d9e8: "I believe the most important thing to a warrior is the spirit of challenge. The challenge to move on to the next level... It is the most important thing."
  npc_override_prt_cas_quests_16_1_i_believe_our_superiors_69ea98: "I believe our superiors will order us to do so."
  npc_override_prt_cas_quests_16_1_i_believe_so_74da35: "I believe so."
  npc_override_prt_cas_quests_16_1_i_believe_someone_pretty_d778c2: "I believe someone with pretty eyes like you should forgive me. So..."
  npc_override_prt_cas_quests_16_1_i_believe_there_guest_he_d07734: "I believe there was a guest here..."
  npc_override_prt_cas_quests_16_1_i_believe_wolf_must_alre_f62e1a: "I believe that Wolf must already have the plan about the next business item in his mind."
  npc_override_prt_cas_quests_16_1_i_believe_you_handle_cle_f5ed4f: "I believe that you can handle cleaning perfectly even without me!"
  npc_override_prt_cas_quests_16_1_i_believe_you_just_fine_6ebd32: "I believe you will do just fine."
  npc_override_prt_cas_quests_16_1_i_believe_you_more_produ_9b5110: "I believe that you would have more productive time with them."
  npc_override_prt_cas_quests_16_1_i_brightest_star_banquet_011276: "I will be the brightest star in the banquet."
  npc_override_prt_cas_quests_16_1_i_brought_them_you_d_ba0121: "I brought them. You'd better not to press an angry person so impatiently like that, you know."
  npc_override_prt_cas_quests_16_1_i_called_simon_alberta_i_749c09: "I called Simon from Alberta. I need to gather all the help I can get now."
  npc_override_prt_cas_quests_16_1_i_came_here_bring_lord_99d4e6: "I came here to bring Lord Helmut. Your grandfather is very worried about you. He said you are away from home in an important time."
  npc_override_prt_cas_quests_16_1_i_came_here_just_minute_819f17: "I came here just a minute ago. However, I heard what you said. So, do you think it's my fault to hear such things?"
  npc_override_prt_cas_quests_16_1_i_cannot_believe_i_am_a00376: "I cannot believe that I am able to cook with the Head Chef!"
  npc_override_prt_cas_quests_16_1_i_cannot_believe_my_brot_dc495a: "I cannot believe that my brother has acted violently. Even if he did, there must have been a ^0000cdreason.^000000"
  npc_override_prt_cas_quests_16_1_i_cannot_believe_myer_di_3c8ec5: "I cannot believe that Myer did that."
  npc_override_prt_cas_quests_16_1_i_cannot_eat_horrible_fo_f95aed: "I cannot eat the horrible food here much so I keep thinking about the food out there."
  npc_override_prt_cas_quests_16_1_i_cannot_go_back_as_27bbc8: "I cannot go back. As a matter of fact, I resent the people who left my parents die since I became mature."
  npc_override_prt_cas_quests_16_1_i_cannot_leave_now_010eb9: "I cannot leave now."
  npc_override_prt_cas_quests_16_1_i_cannot_let_slide_8c640b: "I cannot let it slide."
  npc_override_prt_cas_quests_16_1_i_cannot_point_out_i_0b6211: "I cannot point it out, but I think I have given you enough clues."
  npc_override_prt_cas_quests_16_1_i_cannot_see_helmut_did_5575e8: "I cannot see Helmut. Did he refuse to come?"
  npc_override_prt_cas_quests_16_1_i_cannot_stop_stirring_s_b1b189: "I cannot stop stirring the sauce. You can bring me the ingredient as I say the name."
  npc_override_prt_cas_quests_16_1_i_cannot_use_name_walthe_4a3cb5: "I cannot use the name, Walther, anymore."
  npc_override_prt_cas_quests_16_1_i_cannot_wait_know_what_a8dd9e: "I cannot wait to know what rumor is circulating about our family."
  npc_override_prt_cas_quests_16_1_i_carry_banquet_whatever_b54012: "I carry this to the banquet whatever I wear. And can ask you do me a favor one more?"
  npc_override_prt_cas_quests_16_1_i_come_deliver_you_messa_d6ad4c: "I have come to deliver you the message that there is a mission for you."
  npc_override_prt_cas_quests_16_1_i_come_here_payon_meet_efa12e: "I have come here from Payon to meet Jurgen!"
  npc_override_prt_cas_quests_16_1_i_come_prontera_attend_b_34b3b6: "I have come to Prontera to attend the banquet from Amatsu. It sure feels totally different from Amatsu. Hahaha."
  npc_override_prt_cas_quests_16_1_i_consulted_varmunt_grea_22f36a: "I consulted Varmunt the Great Sage about this."
  npc_override_prt_cas_quests_16_1_i_could_cut_air_knife_46c625: "I could cut the air with a knife earlier. Let's get out now."
  npc_override_prt_cas_quests_16_1_i_couldn_t_find_what_075e95: "But I couldn't find what turned the blue eyes into the red ones."
  npc_override_prt_cas_quests_16_1_i_couldn_t_risk_letting_03b49f: "I couldn't risk letting a lady of the Jaha family pretend to know about the Geoborg family. I couldn't just take a rest."
  npc_override_prt_cas_quests_16_1_i_couldn_t_shake_hands_b4cdca: "I couldn't shake hands with Jurgen! Oh, it's too hot!"
  npc_override_prt_cas_quests_16_1_i_couldn_t_stop_thinking_571a06: "I couldn't stop thinking about her even while you were gone."
  npc_override_prt_cas_quests_16_1_i_curious_how_skia_react_63ddca: "I was curious how Skia would react."
  npc_override_prt_cas_quests_16_1_i_d_better_i_go_ef422a: "I'd better I go down there myself."
  npc_override_prt_cas_quests_16_1_i_d_like_go_get_10415d: "I'd like to go get them myself or ask other people to do it. But, I feel a little uncomfortable since it is a family matter."
  npc_override_prt_cas_quests_16_1_i_d_like_hear_your_a37caa: "I'd like to hear your stories for that."
  npc_override_prt_cas_quests_16_1_i_d_like_invite_them_66be9a: "I'd like to invite them to the royal villa for my party."
  npc_override_prt_cas_quests_16_1_i_d_like_know_myself_c6e203: "I'd like know that myself."
  npc_override_prt_cas_quests_16_1_i_d_like_take_rest_d98621: "I'd like to take a rest now."
  npc_override_prt_cas_quests_16_1_i_d_rather_you_pretend_657054: "I'd rather you pretend I didn't say it."
  npc_override_prt_cas_quests_16_1_i_damned_if_i_waste_6d9c19: "I will be damned if I waste more time here."
  npc_override_prt_cas_quests_16_1_i_dealt_too_many_people_7b3016: "I have dealt with too many people..."
  npc_override_prt_cas_quests_16_1_i_didn_t_come_here_66c51b: "I didn't come here for any new rumor. I am looking for the person who told you the story."
  npc_override_prt_cas_quests_16_1_i_didn_t_expect_all_badee6: "I didn't expect at all that a rumor will be circulating."
  npc_override_prt_cas_quests_16_1_i_didn_t_know_all_1029c2: "I didn't know that... At all.."
  npc_override_prt_cas_quests_16_1_i_didn_t_know_anyway_45b784: "I didn't know that. Anyway, I remember there was something else next to the stone."
  npc_override_prt_cas_quests_16_1_i_didn_t_know_how_7283b5: "I didn't know how painful it was to love someone. I did know how I would be fidgety about a word or gesture of her."
  npc_override_prt_cas_quests_16_1_i_didn_t_know_i_2ab81b: "I didn't know that and I was only strict on them."
  npc_override_prt_cas_quests_16_1_i_didn_t_know_imir_cfdc6a: "I didn't know that the Imir Heart in the Room of Consciousness was stolen by the Valkyrie!"
  npc_override_prt_cas_quests_16_1_i_didn_t_know_servant_cdc06c: "I didn't know a servant has no right to meet with the prisoner keepers. My apology."
  npc_override_prt_cas_quests_16_1_i_didn_t_know_there_263230: "I didn't know there is a rumor about our family circulating"
  npc_override_prt_cas_quests_16_1_i_didn_t_know_women_70ef0d: "I didn't know that women were so strong before."
  npc_override_prt_cas_quests_16_1_i_didn_t_like_human_4b175c: "I didn't like the human servant last time. He was too weak. I don't know about you."
  npc_override_prt_cas_quests_16_1_i_didn_t_mean_cheat_128ca1: "I didn't mean to cheat you. But you speak frankly of what you want. First I looked down on you as you are children."
  npc_override_prt_cas_quests_16_1_i_didn_t_recognize_when_48ff05: "I didn't recognize when I served Helmut on the front but here, he seems a little away as I feel that he is the heir of a royal family."
  npc_override_prt_cas_quests_16_1_i_didn_t_say_anything_b42a52: "I didn't say anything wrong."
  npc_override_prt_cas_quests_16_1_i_didn_t_such_thing_9bac15: "I didn't do such a thing on purpose."
  npc_override_prt_cas_quests_16_1_i_didn_t_tell_children_0d8280: "I didn't tell the children about the attack, but I had to confess the death of their parents."
  npc_override_prt_cas_quests_16_1_i_didn_t_think_you_964fdb: "I didn't think you would let me out. I just got it out loud."
  npc_override_prt_cas_quests_16_1_i_don_t_believe_so_cc6f1d: "I don't believe so."
  npc_override_prt_cas_quests_16_1_i_don_t_care_who_176b07: "I don't care who becomes the heir as long as he leads the family well."
  npc_override_prt_cas_quests_16_1_i_don_t_dream_becoming_f63133: "I don't dream of becoming rich overnight, but I do want to have some honor since I am a man."
  npc_override_prt_cas_quests_16_1_i_don_t_even_want_a7c38b: "I don't even want to imagine anyone else sees it though..."
  npc_override_prt_cas_quests_16_1_i_don_t_get_beauty_75ee80: "I don't get it. Beauty is a good thing. Everyone likes it."
  npc_override_prt_cas_quests_16_1_i_don_t_go_back_42a4e7: "I don't go back. ^0000cdI belong here, the front^000000. Please tell my grandfather so."
  npc_override_prt_cas_quests_16_1_i_don_t_know_how_04366f: "I don't know how to thank you. It is the most accurate to hear the rumor from children. I heard that children gather in a ^0000cdlarge open space^000000 in Prontera.."
  npc_override_prt_cas_quests_16_1_i_don_t_know_if_bed0b4: "I don't know if is the best idea. I don't want her to feel that we are suspecting her."
  npc_override_prt_cas_quests_16_1_i_don_t_know_such_d9a18f: "I don't know such name."
  npc_override_prt_cas_quests_16_1_i_don_t_know_what_45f05a: "I don't know what you are talking about. Please tell me slowly and in detail?"
  npc_override_prt_cas_quests_16_1_i_don_t_know_what_e6efe9: "I don't know what she sees in the pretty boy with no substance."
  npc_override_prt_cas_quests_16_1_i_don_t_know_when_a6cc53: "I don't know when, but it is the ^4d4dffPast Memories of the Royal Family^000000!"
  npc_override_prt_cas_quests_16_1_i_don_t_know_whereabouts_93c32b: "I don't know the whereabouts of ^0000cdKain Walther Walker^000000 who used to be the Guardian Knight of Isenarm, unfortunately."
  npc_override_prt_cas_quests_16_1_i_don_t_know_which_03fb46: "...I don't know which family you are from, but you need to strop."
  npc_override_prt_cas_quests_16_1_i_don_t_know_who_c6aa3b: "I don't know who he is. I was working as always. You know you have to work to make ends meet."
  npc_override_prt_cas_quests_16_1_i_don_t_know_why_51254c: "I don't know why but Scarlet and Lidion have been on bad terms for a long time."
  npc_override_prt_cas_quests_16_1_i_don_t_know_you_9560c1: "I don't know. Have you ever tried to countervail someone's anger?"
  npc_override_prt_cas_quests_16_1_i_don_t_leave_my_fb3b0b: "I don't leave my friends. Do what they want. If you don't, you will lose credentials."
  npc_override_prt_cas_quests_16_1_i_don_t_like_crowded_3764b7: "...I don't like a crowded place like this, but I cannot help it when I am on a mission."
  npc_override_prt_cas_quests_16_1_i_don_t_like_how_c15c38: "I don't like how things have been going these days."
  npc_override_prt_cas_quests_16_1_i_don_t_mean_i_840bd8: "But, I don't mean that I don't want him to become a king."
  npc_override_prt_cas_quests_16_1_i_don_t_much_money_fce5f7: "I don't have much money, but I know where to spend it. I guess I should turn down the deal. Goodbye then."
  npc_override_prt_cas_quests_16_1_i_don_t_much_say_8545fd: "I don't have much to say about him because all I saw about him was sleeping. Well, I think you can make good friends with him."
  npc_override_prt_cas_quests_16_1_i_don_t_need_hear_a62293: "I don't need to hear of some personal impression by you. Although I am caught, I am roaming the prison freely thanks to the warder over there."
  npc_override_prt_cas_quests_16_1_i_don_t_offer_monthly_500d5a: "I don't offer a monthly installment plan. I only take cash. I only accept currencies older than 2 years. I'll spend it meaningfully when I get out here in the future."
  npc_override_prt_cas_quests_16_1_i_don_t_perform_reset_ea796d: "I don't perform the reset anytime. I'll do it when the 2 slots are enhanced for that you cannot enhance the item anymore. And... Then..."
  npc_override_prt_cas_quests_16_1_i_don_t_remember_b3ff47: "I don't remember."
  npc_override_prt_cas_quests_16_1_i_don_t_smell_greasy_fc9665: "I don't smell the greasy dumplings and fresh salad at all."
  npc_override_prt_cas_quests_16_1_i_don_t_tell_you_5bb9e4: "I don't have to tell you the rest of the story, right? Whoa... I thought I was fighting three men at the same time. His fist was like...! Phew... When he was punching me, I saw it."
  npc_override_prt_cas_quests_16_1_i_don_t_tend_bear_5d8892: "I don't tend to bear a grudge against the Heine family for this."
  npc_override_prt_cas_quests_16_1_i_don_t_think_entirely_c95ab2: "I don't think it is entirely your fault. It was our parents who have created you like that."
  npc_override_prt_cas_quests_16_1_i_don_t_think_good_3eb12d: "I don't think it would be a good idea. You shouldn't tell this to anyone. Please keep the secret."
  npc_override_prt_cas_quests_16_1_i_don_t_think_good_77dcd3: "I don't think that is a good idea..."
  npc_override_prt_cas_quests_16_1_i_don_t_think_i_990c11: "I don't think I am to blame, but I am sorry that I have taken your stuff without telling you."
  npc_override_prt_cas_quests_16_1_i_don_t_think_s_2916f0: "I don't think that's going to happen."
  npc_override_prt_cas_quests_16_1_i_don_t_think_true_44ead4: "I don't think that is true. She is not that kind of person."
  npc_override_prt_cas_quests_16_1_i_don_t_understand_2bcea9: "I don't understand."
  npc_override_prt_cas_quests_16_1_i_don_t_understand_why_21d9fc: "I don't understand why Isenarm who has behaved so well acted that way though..."
  npc_override_prt_cas_quests_16_1_i_don_t_understand_why_877759: "I don't understand why you spread such a rumor and do all these things."
  npc_override_prt_cas_quests_16_1_i_don_t_want_anything_351ee8: "I don't want anything big..."
  npc_override_prt_cas_quests_16_1_i_don_t_want_break_1dff9e: "I don't want to break in, but many people are afraid of wars,"
  npc_override_prt_cas_quests_16_1_i_don_t_want_experience_3ba2eb: "I don't want to experience such thing again."
  npc_override_prt_cas_quests_16_1_i_don_t_want_hear_013f7c: "I don't want to hear it! Why are you scaring an innocent furniture delivery man for some missing box?"
  npc_override_prt_cas_quests_16_1_i_don_t_want_waste_3109c4: "I don't want to waste time here."
  npc_override_prt_cas_quests_16_1_i_dragged_here_force_18d448: "I was dragged here by force..."
  npc_override_prt_cas_quests_16_1_i_embarrassed_death_1f00e1: "I would be embarrassed to death."
  npc_override_prt_cas_quests_16_1_i_endure_59f2d5: "I have to endure it!"
  npc_override_prt_cas_quests_16_1_i_enhance_three_items_fl_42dcb0: "I enhance the three items, Flattery Robe, Invective Robe and Prontera Badge for Honor Mark."
  npc_override_prt_cas_quests_16_1_i_enough_dresses_last_my_68c85a: "I have enough dresses to last my lifetime. Why do they keep making them..."
  npc_override_prt_cas_quests_16_1_i_expected_you_agree_as_569625: "I expected you would agree as a woman like me."
  npc_override_prt_cas_quests_16_1_i_explained_what_happene_a6fdd3: "- I explained what happened to his fellow. -"
  npc_override_prt_cas_quests_16_1_i_explained_why_i_came_45c402: "- I explained why I came here. -"
  npc_override_prt_cas_quests_16_1_i_feel_attractive_offer_7954bc: "I feel that it is an attractive offer. Would you challenge the warrior training system of the Richard family?"
  npc_override_prt_cas_quests_16_1_i_feel_darkness_inside_g_38a6b0: "I can feel darkness inside is getting under control."
  npc_override_prt_cas_quests_16_1_i_feel_dizzy_4d9db0: "...I feel dizzy..."
  npc_override_prt_cas_quests_16_1_i_feel_earth_shaking_2210fd: "I can feel the earth is shaking."
  npc_override_prt_cas_quests_16_1_i_feel_rather_overwhelme_f02e15: "I feel rather overwhelmed... And there is the social class issue as well..."
  npc_override_prt_cas_quests_16_1_i_feel_safe_my_grandfath_a21c16: "But I feel safe that my grandfather stays with me."
  npc_override_prt_cas_quests_16_1_i_feel_sorry_been_great_d99268: "I feel sorry. It would have been a great chance for me to impress my family."
  npc_override_prt_cas_quests_16_1_i_feel_sorry_first_thing_8fde58: "I feel sorry for that ^0000cdthe first thing he has ever wanted to get happens to be fake^000000."
  npc_override_prt_cas_quests_16_1_i_feel_very_sorry_about_2bee8b: "I feel very sorry about it."
  npc_override_prt_cas_quests_16_1_i_feel_you_must_raring_417d66: "I feel that you must be raring to get some action. I guess it is the time to proceed with the next training."
  npc_override_prt_cas_quests_16_1_i_feeling_everything_tur_bc868a: "I have a feeling that everything will turn out great if you send it for me."
  npc_override_prt_cas_quests_16_1_i_fell_love_her_i_21cb4c: "I fell in love with her. I love her dignified and calm voice. Unaffected behaviors That tone of voice reflecting strong will..."
  npc_override_prt_cas_quests_16_1_i_finally_strawberry_cak_2c8ef2: "I finally have the strawberry cake no one has ever touched."
  npc_override_prt_cas_quests_16_1_i_forgot_you_great_warri_f0a4d7: "I forgot you are a great warrior. Please forgive my rudeness."
  npc_override_prt_cas_quests_16_1_i_found_court_mage_who_746d4f: "I found a Court Mage who specialized in that field."
  npc_override_prt_cas_quests_16_1_i_get_see_you_again_30824a: "I get to see you again."
  npc_override_prt_cas_quests_16_1_i_get_see_you_again_f394b1: "I get to see you again. {0}."
  npc_override_prt_cas_quests_16_1_i_given_up_wars_am_67d10e: "That I have given up wars and am looking for better solution and that if he can, visit the family and see the people."
  npc_override_prt_cas_quests_16_1_i_go_around_banquet_hall_94ded4: "I will go around the banquet hall like a sleek cat, concealing everything underneath the black dress."
  npc_override_prt_cas_quests_16_1_i_going_help_knights_def_dabae8: "I was going to help the knights defending the knight's building since I heard that many residents had been fled there. However, there seem to be enough troops here."
  npc_override_prt_cas_quests_16_1_i_grew_children_live_up_e32bcd: "I grew the children to live up to the name of Roegenburg."
  npc_override_prt_cas_quests_16_1_i_guarantee_you_monsters_d45493: "I guarantee you that the monsters in the outer world and those in the dungeon must be different beings from each other."
  npc_override_prt_cas_quests_16_1_i_guess_adventurers_inte_661880: "I guess the adventurers were not that interested; however, there were many members of the royal family participating in the subjugation of the dark lord. I have been reported of your work from them."
  npc_override_prt_cas_quests_16_1_i_guess_all_i_you_1dbb12: "I guess this is all I can do you now."
  npc_override_prt_cas_quests_16_1_i_guess_end_up_failure_3d1217: "I guess this would end up a failure again, though."
  npc_override_prt_cas_quests_16_1_i_guess_he_could_looking_de6c86: "I guess he could be looking for blueprints of some sort which interest him."
  npc_override_prt_cas_quests_16_1_i_guess_he_obeyed_queen_bb63e2: "...I guess he obeyed the will of the queen."
  npc_override_prt_cas_quests_16_1_i_guess_i_am_about_d6d71c: "...I guess I am about to stop holding it down."
  npc_override_prt_cas_quests_16_1_i_guess_i_don_t_d4285c: "I guess I don't need to explain about it anymore. Just bring the equipment you want to enhance to me."
  npc_override_prt_cas_quests_16_1_i_guess_i_no_choice_d76378: "I guess I have no choice."
  npc_override_prt_cas_quests_16_1_i_guess_i_should_go_7a239c: "I guess I should go back and tell him the truth."
  npc_override_prt_cas_quests_16_1_i_guess_i_should_nicer_042abb: "I guess I should be nicer to the people who like me."
  npc_override_prt_cas_quests_16_1_i_guess_isenarm_didn_t_cc28dc: "I guess Isenarm didn't want you to be involved. If anything happened to him, you would have been the one in the biggest trouble."
  npc_override_prt_cas_quests_16_1_i_guess_make_my_life_a2735f: "I guess it would make my life much easier if I just give up."
  npc_override_prt_cas_quests_16_1_i_guess_no_accident_inev_901da0: "...I guess it was no accident; it was inevitable..."
  npc_override_prt_cas_quests_16_1_i_guess_no_such_informat_baaa52: "I guess no such information is shared among the pickpockets. Get lost if you don't want to be sent to prison."
  npc_override_prt_cas_quests_16_1_i_guess_offer_hasn_t_f032bc: "I guess the offer hasn't been attractive to you. I am sorry, but come back later when you change your mind."
  npc_override_prt_cas_quests_16_1_i_guess_other_families_m_5b8a6b: "I guess other families must be ready by now and about to move soon."
  npc_override_prt_cas_quests_16_1_i_guess_so_630c8f: "I guess so."
  npc_override_prt_cas_quests_16_1_i_guess_so_i_help_9acb41: "I guess so. I will help you to the best of my ability."
  npc_override_prt_cas_quests_16_1_i_guess_some_shady_chara_7e1f13: "I guess some shady characters must have mixed in with the bunch of temporary employees hired for the banquet."
  npc_override_prt_cas_quests_16_1_i_guess_somewhat_similar_ad0b5b: "I guess it was somewhat similar to what has just happened. She said something about comparison then..."
  npc_override_prt_cas_quests_16_1_i_guess_there_been_soldi_04b76c: "I guess there has been a soldier on vacation during such a difficult time. I had been ignorant of it before I got the report."
  npc_override_prt_cas_quests_16_1_i_guess_there_many_stori_c03d2a: "I guess that there are many stories about Royal Assembly or banquet. I am now in the capital city. To read the mood here, I think I should hear those stories."
  npc_override_prt_cas_quests_16_1_i_guess_those_intruders_7fa3de: "I guess those intruders must have taken it during the explosion."
  npc_override_prt_cas_quests_16_1_i_guess_we_picked_right_b29041: "I guess we have picked the right time to be here-"
  npc_override_prt_cas_quests_16_1_i_guess_we_should_finish_4089c7: "...I guess we should finish what we have been doing!"
  npc_override_prt_cas_quests_16_1_i_guess_we_should_finish_ebb8ea: "I guess we should finish what we have been doing!"
  npc_override_prt_cas_quests_16_1_i_guess_we_won_t_89e3d2: "I guess we won't be able to return to the head house anytime soon."
  npc_override_prt_cas_quests_16_1_i_guess_what_you_done_d93c07: "I guess what you have done for us is just that priceless."
  npc_override_prt_cas_quests_16_1_i_guess_where_been_dropp_2b55e5: "I can guess where it has been dropped..."
  npc_override_prt_cas_quests_16_1_i_guess_you_hero_palace_a70be4: "I guess you will be the hero of the palace."
  npc_override_prt_cas_quests_16_1_i_guess_you_out_luck_93a4b9: "I guess you are out of luck. The equipment is broken. Tut tut."
  npc_override_prt_cas_quests_16_1_i_guide_you_exchange_ite_6a7b7c: "I will guide you to exchange items according to your job."
  npc_override_prt_cas_quests_16_1_i_had_start_gather_infor_7418b4: "I had to start gather information earlier. I couldn't because I was busy due to others."
  npc_override_prt_cas_quests_16_1_i_happen_eavesdrop_fishy_462ae1: "I happen to eavesdrop on a fishy conversation."
  npc_override_prt_cas_quests_16_1_i_happen_see_someone_str_976b41: "I happen to see someone with a strong set of arms... Those arms... What brought you here?"
  npc_override_prt_cas_quests_16_1_i_hate_admit_darkness_st_8a3f40: "I hate to admit this but darkness is stomping around. I need something to bring it under control."
  npc_override_prt_cas_quests_16_1_i_hate_admit_we_haven_a6e953: "I hate to admit, but we haven't even identified where these monsters come from."
  npc_override_prt_cas_quests_16_1_i_hate_wars_too_f43c2b: "I hate wars too."
  npc_override_prt_cas_quests_16_1_i_haven_t_met_bloke_e9bd7b: "I haven't met that bloke in that sector yet, but one of my fellows appointed to that area did say he can be pretty ferocious."
  npc_override_prt_cas_quests_16_1_i_hear_voices_somewhere_6c37bd: "I hear voices from somewhere."
  npc_override_prt_cas_quests_16_1_i_heard_adventurer_who_m_ee974a: "I heard the adventurer who made the significant contribution to defeating Devil King Morocc has been invited to the royal banquet."
  npc_override_prt_cas_quests_16_1_i_heard_found_beach_thes_7856a4: "I have heard that it is not found on the beach these days. Instead, you can get it by killing the ^0000cdMedusa inside the cave in the west of Comodo^000000."
  npc_override_prt_cas_quests_16_1_i_heard_he_doing_somethi_48f25e: "I heard that he is doing something with the third son of the Roegenburg family. You don't need to worry about Isaac. He knows how to take care of himself."
  npc_override_prt_cas_quests_16_1_i_heard_my_grandson_unde_f3643f: "I have heard that my grandson is under indebtedness to your son these days."
  npc_override_prt_cas_quests_16_1_i_heard_myer_he_sorry_510077: "I heard from Myer that he is sorry that he cannot come with me to the banquet. He said that he would send a handsome guy as my partner instead him."
  npc_override_prt_cas_quests_16_1_i_heard_news_his_death_122369: "I heard the news of his death after few days. I wanted to go back, but I couldn't because of his last order. I couldn't even be there by his side..."
  npc_override_prt_cas_quests_16_1_i_heard_po_next_head_081feb: "I heard from Po the next head of the family that you are going to try the Richard battle training program."
  npc_override_prt_cas_quests_16_1_i_heard_so_much_about_bc4f03: "I heard so much about you. I'm a huge fan!"
  npc_override_prt_cas_quests_16_1_i_heard_soldier_cathedra_13fb62: "I heard from the soldier in the cathedral that you saved the couple, Eryus and Ellie."
  npc_override_prt_cas_quests_16_1_i_heard_soldier_dispatch_23cde4: "I heard from the soldier dispatched to the village office that a soldier on his vacation has been fled here."
  npc_override_prt_cas_quests_16_1_i_heard_soldier_dispatch_9c3d73: "I heard from the soldier dispatched to the area near the village office that you helped the villagers."
  npc_override_prt_cas_quests_16_1_i_heard_soldiers_dispatc_db7fcd: "I heard from the soldiers dispatched to the Knights' building that you saved Lowen."
  npc_override_prt_cas_quests_16_1_i_heard_story_briefly_sk_e9429d: "I have heard the story briefly from Skia."
  npc_override_prt_cas_quests_16_1_i_heard_story_my_father_639b4e: "I have heard the story from my father."
  npc_override_prt_cas_quests_16_1_i_heard_strange_gossip_s_4ca37c: "I heard a ^0000cdstrange gossip^000000 from some of the knights there when I escorted Isenhonor to the palace."
  npc_override_prt_cas_quests_16_1_i_heard_there_hot_hair_8bae0a: "I heard that there is the ^0000cdhot hair^000000 that looks burning but not hot at all, though the name sounds contradictory."
  npc_override_prt_cas_quests_16_1_i_heard_there_royal_fami_eb1e47: "I heard that there are royal families ^0000cdwho do not attend the Royal Assembly^000000. Who's that?"
  npc_override_prt_cas_quests_16_1_i_heard_you_attended_ban_13a049: "I have heard that you have attended the banquet safely."
  npc_override_prt_cas_quests_16_1_i_heard_you_one_who_9325ac: "I have heard that you are the one who would attend the ritual."
  npc_override_prt_cas_quests_16_1_i_heard_you_saw_person_d7f365: "I heard that you saw a person of the Walther family in a foreign country. Where did you see him? How did you know that he was from the Walther family?"
  npc_override_prt_cas_quests_16_1_i_heard_your_name_you_fbb2a3: "I have heard your name for that {0}, you are the hero in the subjugation of Morocc"
  npc_override_prt_cas_quests_16_1_i_hope_able_cook_you_07aa00: "I hope to be able to cook with you again!"
  npc_override_prt_cas_quests_16_1_i_hope_able_get_away_95e1f0: "I hope to be able to get away from the preparation duty for the banquet."
  npc_override_prt_cas_quests_16_1_i_hope_deal_goes_well_b93c5f: "I hope the deal goes well, buddy."
  npc_override_prt_cas_quests_16_1_i_hope_everything_ok_8e344f: "I hope everything is OK."
  npc_override_prt_cas_quests_16_1_i_hope_helps_e3e2f2: "I hope it helps."
  npc_override_prt_cas_quests_16_1_i_hope_i_see_you_916905: "I hope I will see you later."
  npc_override_prt_cas_quests_16_1_i_hope_queen_ernst_take_1afac8: "I hope the queen and Ernst can take some rest now."
  npc_override_prt_cas_quests_16_1_i_hope_we_get_share_7f445b: "I hope we get to share more stories sometime."
  npc_override_prt_cas_quests_16_1_i_hope_wolf_lead_everyth_9eac6c: "But I hope that Wolf will lead everything. When the Royal Assembly is closed, please tell Wolf that I will ^0000cdtransfer the position of heir to him^000000."
  npc_override_prt_cas_quests_16_1_i_hope_works_time_12109e: "I hope it works this time."
  npc_override_prt_cas_quests_16_1_i_hope_you_don_t_a17f8b: "I hope you don't waste your talent."
  npc_override_prt_cas_quests_16_1_i_hope_you_enjoy_banquet_e22b1f: "I hope you enjoy the banquet since it is held for you."
  npc_override_prt_cas_quests_16_1_i_hope_you_good_time_ed25bd: "I hope you have a good time there, dear hero."
  npc_override_prt_cas_quests_16_1_i_hope_you_like_6326cc: "I hope you like it."
  npc_override_prt_cas_quests_16_1_i_hope_you_visit_wigner_130ecb: "I hope you will visit the Wigner and bring a thing from ^0000cdIsaac Wigner^000000."
  npc_override_prt_cas_quests_16_1_i_hoped_he_stay_time_7d57d4: "I hoped that he would stay for the time being, but I am sad that he left all of sudden."
  npc_override_prt_cas_quests_16_1_i_hunch_something_big_ab_304e48: "I have a hunch that something big is about to happen."
  npc_override_prt_cas_quests_16_1_i_i_see_4d3ef9: "I... I see."
  npc_override_prt_cas_quests_16_1_i_invited_you_no_special_cee716: "I invited you for no special reason."
  npc_override_prt_cas_quests_16_1_i_just_giving_my_sister_ed271d: "I was just giving my sister a push in the back."
  npc_override_prt_cas_quests_16_1_i_just_noticed_certain_d_9c7b7b: "I just noticed certain differences."
  npc_override_prt_cas_quests_16_1_i_just_sent_message_magi_f7fbaf: "I have just sent a message. The magician will arrive here soon."
  npc_override_prt_cas_quests_16_1_i_just_thought_crusaders_cc3dcc: "I just thought the Crusaders released them to disrupt the prisoners' peaceful break."
  npc_override_prt_cas_quests_16_1_i_keep_thinking_about_wh_9ca948: "I keep thinking about what a great responsibility it is, how harder I should try and all..."
  npc_override_prt_cas_quests_16_1_i_knew_he_been_hanging_6fa465: "I knew it. He has been hanging out with that punk from the third-rate family too long..."
  npc_override_prt_cas_quests_16_1_i_knew_nothing_about_uni_ae8302: "I knew nothing about unification, but I wished that no war would break out."
  npc_override_prt_cas_quests_16_1_i_knew_something_when_he_1f4cbb: "I knew something when Helmut left, but I didn't expect that he would give up the successorship."
  npc_override_prt_cas_quests_16_1_i_knew_talk_about_poor_4a57fe: "I knew it. Talk about poor service!"
  npc_override_prt_cas_quests_16_1_i_knew_you_come_again_0cf383: "I knew you would come again!"
  npc_override_prt_cas_quests_16_1_i_knew_you_give_up_13185f: "I knew it. You give up too easily. You are still young, you know."
  npc_override_prt_cas_quests_16_1_i_knew_you_i_been_313a6c: "I knew you would! I have been right about you!"
  npc_override_prt_cas_quests_16_1_i_know_almost_impossible_aea44e: "...I know it is almost impossible to change the past."
  npc_override_prt_cas_quests_16_1_i_know_as_much_as_270b7e: "I know as much as you do."
  npc_override_prt_cas_quests_16_1_i_know_banquet_held_some_f2f6f6: "I know this banquet is held for someone else. However, it still is a great opportunity for me to meet someone I can spend my life with."
  npc_override_prt_cas_quests_16_1_i_know_emergency_i_d_277108: "I know it is an emergency, but I'd like to comfort the soul of my colleague."
  npc_override_prt_cas_quests_16_1_i_know_few_things_about_33fe89: "I know a few things about the Sector E, actually."
  npc_override_prt_cas_quests_16_1_i_know_how_troubling_you_8c440c: "I know how it is troubling you, but please help us. You have not forgotten what to bring, have you?"
  npc_override_prt_cas_quests_16_1_i_know_i_m_prisoner_b4eacc: "I know I'm a prisoner here, but I don't understand why they have to lock me in this place that is so dirty and humid."
  npc_override_prt_cas_quests_16_1_i_know_no_one_around_304674: "I know no one around me who can access the palace and book stores do not sell it. Please get it for me."
  npc_override_prt_cas_quests_16_1_i_know_s_lot_things_f6938c: "I know that's a lot of things to bring, but I believe we need them all to make our sister feel better."
  npc_override_prt_cas_quests_16_1_i_know_story_too_i_f81bbb: "I know the story too. But I'm not sure that it is right or not to tell you the story."
  npc_override_prt_cas_quests_16_1_i_know_unlikely_helmut_b_0cf8c4: "But I know it is unlikely that Helmut becomes a king and so leave them to do as they like."
  npc_override_prt_cas_quests_16_1_i_know_what_you_mean_8ddd37: "I know what you mean."
  npc_override_prt_cas_quests_16_1_i_know_you_come_here_9bb1a4: "I know you have come here to spy on us this time."
  npc_override_prt_cas_quests_16_1_i_learned_hide_fight_9814bf: "I learned to hide and fight."
  npc_override_prt_cas_quests_16_1_i_let_children_as_they_f4c52c: "I have let the children do as they want but I wanted to avoid a war."
  npc_override_prt_cas_quests_16_1_i_let_elders_know_about_88d16e: "I have to let the elders know about this anyway."
  npc_override_prt_cas_quests_16_1_i_let_you_as_you_a96b6a: "I have let you do as you want to do, but this time I hope that you will follow what Agnes said. I want to avoid wars if possible."
  npc_override_prt_cas_quests_16_1_i_like_anything_pretty_65fb24: "I like anything pretty!"
  npc_override_prt_cas_quests_16_1_i_like_banquet_hall_leas_f048f4: "I would like to be in the Banquet Hall at least."
  npc_override_prt_cas_quests_16_1_i_like_black_dress_remin_6f10c0: "I like a black dress that reminds of dark night. A dress so elegant and beautiful that makes people to admire in silence."
  npc_override_prt_cas_quests_16_1_i_like_give_you_reward_53de0e: "I would like to give you a reward, but I'm afraid I don't have much. I would've given you a world of treasures if it were my golden days."
  npc_override_prt_cas_quests_16_1_i_like_go_find_myself_12d461: "I would like to go find it myself, but I am not in the situation to do that..."
  npc_override_prt_cas_quests_16_1_i_like_how_you_refuse_ff2fcb: "I like how you refuse so flatly"
  npc_override_prt_cas_quests_16_1_i_like_make_fairy_dress_dbf964: "I would like to make a fairy dress! A dress so shining in golden light that anyone should admire it."
  npc_override_prt_cas_quests_16_1_i_like_make_handsome_pay_7c13e7: "I would like to make a handsome payment if a renowned adventurer like you helps us."
  npc_override_prt_cas_quests_16_1_i_like_prepare_myself_i_1067a7: "I would like to prepare it myself but I am just a Scrub Sponge."
  npc_override_prt_cas_quests_16_1_i_like_talk_manager_some_b20113: "I would like to talk to the manager, not some normal clerk!"
  npc_override_prt_cas_quests_16_1_i_like_use_pearls_make_5df9f0: "I would like to use pearls to make a necklace and bracelet. You can get pearls from monsters. Can you get them for me?"
  npc_override_prt_cas_quests_16_1_i_like_way_now_though_f0089f: "I like the way it is now though."
  npc_override_prt_cas_quests_16_1_i_ll_after_you_quietly_28fd03: "I'll be after you quietly."
  npc_override_prt_cas_quests_16_1_i_ll_contact_you_again_bc6565: "I'll contact you again when the darkness inside of me starts to stomp around."
  npc_override_prt_cas_quests_16_1_i_ll_decide_what_make_feaa8b: "I'll decide what to make next after completing this."
  npc_override_prt_cas_quests_16_1_i_ll_enhance_one_flatter_781e8c: "I'll enhance one of the Flattery Robe or Invective Robe slot for 20 Honor Marks. I can enhance up to 2 slots. And I take 10 Honor Marks for the reset. Do you follow me so far?"
  npc_override_prt_cas_quests_16_1_i_ll_exchange_rune_magic_120eeb: "I'll ^0000ffexchange 30 Rune Magic Powders for 1 Mysterious Blue Box^000000. How do you like that? It is such a sweet deal, isn't it?"
  npc_override_prt_cas_quests_16_1_i_ll_get_approval_you_320c5b: "I'll get the approval for you to visit the Past Memories of the Royal Family everyday."
  npc_override_prt_cas_quests_16_1_i_ll_get_over_232de1: "I'll get over it!"
  npc_override_prt_cas_quests_16_1_i_ll_go_bdfa8f: "I'll go."
  npc_override_prt_cas_quests_16_1_i_ll_go_my_own_fe0746: "I'll go on my own."
  npc_override_prt_cas_quests_16_1_i_ll_hang_there_just_b3f5be: "I'll hang in there. Just don't be too late..."
  npc_override_prt_cas_quests_16_1_i_ll_here_immediately_li_3ca0e6: "I'll be here immediately like a flash of lightning-"
  npc_override_prt_cas_quests_16_1_i_ll_i_ll_make_feace4: "I'll... I'll make sure to defend this place."
