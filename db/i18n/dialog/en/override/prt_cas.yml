  npc_override_prt_cas_quests_16_1_time_you_need_stronger_c_4d2adb: "This time, you need stronger credentials..."
  npc_override_prt_cas_quests_16_1_today_s_main_dish_grille_828751: "Today's main dish is the Grilled Griffon with the special sauce. The crust should be crunchy while the inside is juicy!"
