  npc_override_prt_cas_quests_16_1_something_happened_our_c_091d05: "Has something happened to our child, I mean, Katrin?"
  npc_override_prt_cas_quests_16_1_something_like_never_hap_9143d9: "Something like this never would have happened if was more careful..."
  npc_override_prt_cas_quests_16_1_sometimes_i_stand_forwar_aa5243: "Sometimes, I stand forward instead of Spica."
  npc_override_prt_cas_quests_16_1_sometimes_i_wonder_why_w_1adad0: "But sometimes I wonder why we have become this estranged."
