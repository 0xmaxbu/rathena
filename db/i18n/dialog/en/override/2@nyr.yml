Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_2@nyr_Wolves_aaahhh_1e9cc1: "Aaahhh!!!"
  npc_override_2@nyr_Wolves_acknowledge_6736a0: "Acknowledge it!"
  npc_override_2@nyr_Wolves_acknowledge_us_e5ebde: "Acknowledge us!"
  npc_override_2@nyr_Wolves_addition_dealing_intrude_3ceaec: "In addition to dealing with intruders, I have another task for you."
  npc_override_2@nyr_Wolves_adventurer_2439c4: "Adventurer?"
  npc_override_2@nyr_Wolves_adventurer_f822b4: "Adventurer!"
  npc_override_2@nyr_Wolves_adventurer_party_enter_f_a46be7: "Adventurer {0} of the {1} party will enter {2} first. All wolves, gather sequentially."
  npc_override_2@nyr_Wolves_adventurer_please_safe_93702c: "Adventurer, please be safe."
  npc_override_2@nyr_Wolves_adventurer_thank_you_par_3f87f0: "Adventurer, thank you for participating in the cleansing operation!"
  npc_override_2@nyr_Wolves_adventurer_thank_you_you_7cfa03: "Adventurer, thank you for your assistance."
  npc_override_2@nyr_Wolves_adventurer_welcome_0467bb: "Adventurer, welcome."
  npc_override_2@nyr_Wolves_adventurer_welcome_thank_5a8185: "Adventurer, welcome. Thank you for joining us on this cleansing operation."
  npc_override_2@nyr_Wolves_adventurer_why_you_here_5f2f07: "Adventurer...? Why are you here, Adventurer?"
  npc_override_2@nyr_Wolves_adventurer_why_you_here_61bdfc: "Adventurer? Why are you here?"
  npc_override_2@nyr_Wolves_adventurer_you_safe_d8a005: "Adventurer, are you safe?"
  npc_override_2@nyr_Wolves_adventurers_thank_you_yo_fbc681: "Adventurers, thank you for your hard work as well! Until we meet again!"
  npc_override_2@nyr_Wolves_after_you_loose_some_wei_468fb8: "- after you loose some weight. -"
  npc_override_2@nyr_Wolves_ah_971301: "Ah..."
  npc_override_2@nyr_Wolves_ah_i_m_intoxicated_intox_3000e2: "Ah~ I'm intoxicated~ Intoxicated by the magic of the heart~"
  npc_override_2@nyr_Wolves_ah_i_saw_something_like_a08601: "Ah! I saw something like that in Prontera. Everyone was hitting eggs there, right?"
  npc_override_2@nyr_Wolves_ah_seems_like_something_0f39c0: "Ah, it seems like something is coming~"
  npc_override_2@nyr_Wolves_ah_you_said_there_enemie_130735: "Ah...! You said there would be enemies among the Temple Guards, so we'll have to pick out the ones we trust first."
  npc_override_2@nyr_Wolves_all_hands_formation_faed55: "All hands in formation!"
  npc_override_2@nyr_Wolves_all_sectors_cleared_gath_0c2651: "All sectors cleared! Gather at the exit!"
  npc_override_2@nyr_Wolves_all_zones_cleared_gather_07a31b: "All zones cleared! Gather at the entrance of the temple!"
  npc_override_2@nyr_Wolves_alright_i_ll_send_signal_3d17fb: "Alright. I'll send the signal."
  npc_override_2@nyr_Wolves_also_our_duty_enact_godd_68a2b0: "It is also our duty to enact the will of the goddess upon them!"
  npc_override_2@nyr_Wolves_am_i_also_getting_shocke_d66fab: "Am I also getting shocked? Is there something wrong with my body too?"
  npc_override_2@nyr_Wolves_area_under_maintenance_a_08aed7: "This area is under maintenance and access is prohibited. It's dangerous. Please step back."
  npc_override_2@nyr_Wolves_area_under_maintenance_a_66d3de: "This area is under maintenance and access is prohibited."
  npc_override_2@nyr_Wolves_aren_t_you_least_secure_172648: "... Aren't you at least this secure?"
  npc_override_2@nyr_Wolves_argh_argh_temple_guard_g_b22363: "Argh!!!! Argh!!! The temple guard grabs a man!!!"
  npc_override_2@nyr_Wolves_as_expected_you_smack_ma_0dfbd7: "As expected, you have to smack a malfunctioning machine!"
  npc_override_2@nyr_Wolves_ask_if_s_okay_back_2521a6: "Ask if it's okay to back out."
  npc_override_2@nyr_Wolves_awaiting_security_code_r_2ac2dd: "Awaiting security code reset. Please input the new security code."
  npc_override_2@nyr_Wolves_awaiting_security_code_r_71f635: "Awaiting security code reset"
  npc_override_2@nyr_Wolves_back_off_a44d9b: "Back off!"
  npc_override_2@nyr_Wolves_because_we_don_t_look_ad8ee7: "Is it because we don't look human?"
  npc_override_2@nyr_Wolves_because_we_look_so_easy_9ce66e: "Is it because we look so easy?"
  npc_override_2@nyr_Wolves_beep_a25744: "Beep-"
  npc_override_2@nyr_Wolves_beep_vault_unlock_protoc_27545a: "Beep - Vault unlock protocol activated"
  npc_override_2@nyr_Wolves_beware_allies_may_distin_eac1de: "Beware, allies may not be distinguishable from foes in the darkness! Exercise caution to avoid attacking our own!"
  npc_override_2@nyr_Wolves_cancel_input_8e6f7b: "Cancel input"
  npc_override_2@nyr_Wolves_careful_fa18ab: "Be careful."
  npc_override_2@nyr_Wolves_clean_up_your_mess_167ca8: "Clean up your mess."
  npc_override_2@nyr_Wolves_could_you_input_changed_a1ae95: "Could you input the changed security code? Then we'll all be truly happy."
  npc_override_2@nyr_Wolves_currently_you_re_carryin_73594b: "- Currently you're carrying -"
  npc_override_2@nyr_Wolves_did_you_find_what_kind_3ac1e7: "Did you find it? What kind of a place is this?"
  npc_override_2@nyr_Wolves_didn_t_party_leader_deci_8577d3: "Didn't the party leader decide to come?"
  npc_override_2@nyr_Wolves_doesn_t_look_good_i_661592: "This doesn't look good. I need to get Suad, but where's the deputy?"
  npc_override_2@nyr_Wolves_doesn_t_look_like_they_451a2e: "Doesn't it look like they're looking for a specific book?"
  npc_override_2@nyr_Wolves_don_t_you_see_we_416a19: "Don't you see? We're breaking into a library. There must be a lot of secrets of the settlers in here."
  npc_override_2@nyr_Wolves_drop_your_weapon_ea2b9a: "Drop your weapon!!"
  npc_override_2@nyr_Wolves_end_library_227f4f: "Is this the end of the library?"
  npc_override_2@nyr_Wolves_enter_0abb0f: "Enter."
  npc_override_2@nyr_Wolves_even_most_secretive_libr_e22590: "Even the most secretive of libraries wouldn't just leave a book like that lying around."
  npc_override_2@nyr_Wolves_events_inside_temple_adcee8: "- The events inside the temple. -"
  npc_override_2@nyr_Wolves_everyone_assembled_af7354: "Is everyone assembled?"
  npc_override_2@nyr_Wolves_everyone_gathered_over_t_ddcd79: "Everyone is gathered over there."
  npc_override_2@nyr_Wolves_everyone_lay_down_your_w_1f0086: "Everyone lay down your weapons and raise your hands!"
  npc_override_2@nyr_Wolves_everyone_you_may_now_dis_13711a: "Everyone, you may now disperse!"
  npc_override_2@nyr_Wolves_examine_carefully_could_f94e61: "Examine it carefully. It could be tampered with."
  npc_override_2@nyr_Wolves_father_80d4f8: "...Father??"
  npc_override_2@nyr_Wolves_father_father_ab1c03: "Father! Father!!!"
  npc_override_2@nyr_Wolves_father_who_praises_you_n_3bb5e7: "A father who praises you but never loves you?"
  npc_override_2@nyr_Wolves_four_6e2150: "Four!!"
  npc_override_2@nyr_Wolves_four_bed031: "Four!"
  npc_override_2@nyr_Wolves_give_back_67b451: "Give it back!"
  npc_override_2@nyr_Wolves_give_land_back_its_right_ec8a62: "Give this land back to its rightful owner! Give it back!!"
  npc_override_2@nyr_Wolves_give_right_back_owner_la_499573: "Give the right back to the owner of this land! Give it back!!"
  npc_override_2@nyr_Wolves_go_home_miriam_i_m_0eb5f0: "Go home, Miriam. I'm not going to cooperate with your stuffy behavior anymore."
  npc_override_2@nyr_Wolves_good_s_fortunate_otherwi_a9caf7: "Good. It's fortunate. Otherwise, we might have quarreled among ourselves, right?"
  npc_override_2@nyr_Wolves_good_timing_then_we_ll_4f1757: "Good timing. Then we'll say goodbye!"
  npc_override_2@nyr_Wolves_ha_hah_adventurer_you_al_a1e99c: "Ha... Hah... Adventurer, are you all right?"
  npc_override_2@nyr_Wolves_hah_now_s_life_saver_69c25c: "Hah- now that's a life saver."
  npc_override_2@nyr_Wolves_halt_identify_yourself_dd089f: "Halt! Identify Yourself."
  npc_override_2@nyr_Wolves_he_s_always_been_like_ca1345: "He's always been like that... Is there something ominous about that?"
  npc_override_2@nyr_Wolves_heart_f3671a: "The... heart...."
  npc_override_2@nyr_Wolves_heart_hunters_undercover_0fc271: "The Heart Hunters were undercover."
  npc_override_2@nyr_Wolves_hearthunter_you_re_worki_7b5e6a: "Hearthunter... you're working with those mad scientists you were talking about... from the very beginning...!"
  npc_override_2@nyr_Wolves_hehe_did_you_like_your_e7621b: "Hehe - did you like your impersonation? Give us a pat on the back."
  npc_override_2@nyr_Wolves_hello_adventurer_agent_t_a48952: "Hello, adventurer. An agent from a temple has been waiting for you."
  npc_override_2@nyr_Wolves_hello_did_you_get_good_fd13f7: "Hello! Did you get a good rest? I would be grateful if you could help me today. Please note that the operation can be done once a day."
  npc_override_2@nyr_Wolves_here_s_what_2dd421: "Here's what..."
  npc_override_2@nyr_Wolves_here_we_go_good_luck_19c706: "Here we go!!! Good luck! Let's go, boys!"
  npc_override_2@nyr_Wolves_here_we_go_intruder_here_376d69: "Here we go! The intruder is here!!!"
  npc_override_2@nyr_Wolves_hey_exhilarating_735aff: "Hey! This is exhilarating~"
  npc_override_2@nyr_Wolves_hey_mr_genius_don_t_92a5f6: "Hey, Mr. Genius, don't you know how to make an irony?! Tight security is not synonymous with cumbersome and demanding procedures, right?"
  npc_override_2@nyr_Wolves_hey_one_s_amazing_0ff299: "Hey!! This one's amazing!!!"
  npc_override_2@nyr_Wolves_hey_place_my_great_great_f772f1: "Hey, that place was my great-great-grandmother's land!"
  npc_override_2@nyr_Wolves_hey_strange_no_matter_ho_b2d685: "Hey! This is strange. No matter how I manipulate it, the magic of the heart isn't emitting."
  npc_override_2@nyr_Wolves_hey_there_other_people_o_274b1e: "Hey, there are other people over there, what do they say?"
  npc_override_2@nyr_Wolves_hey_there_you_1d3b04: "Hey! There you are!!"
  npc_override_2@nyr_Wolves_hey_who_s_handling_machi_b4511b: "Hey! Who's handling the machine like that?"
  npc_override_2@nyr_Wolves_hi_let_me_formally_intro_45c752: "Hi, let me formally introduce ourselves. We're the Heart Hunters, and we're about to bury you here."
  npc_override_2@nyr_Wolves_high_priest_what_even_me_56bb2d: "High Priest?? What does that even mean?"
  npc_override_2@nyr_Wolves_hmm_my_mood_feels_exhila_e5a36f: "Hmm, my mood feels exhilarating for once."
  npc_override_2@nyr_Wolves_hold_adventurer_5fd2fb: "Hold on, Adventurer!"
  npc_override_2@nyr_Wolves_how_far_we_there_ce05b8: "How far are we from there?"
  npc_override_2@nyr_Wolves_how_high_priest_we_ll_c51c7c: "How is that... High Priest...? We'll have to investigate."
  npc_override_2@nyr_Wolves_how_i_fbb7db: "How do I do this?"
  npc_override_2@nyr_Wolves_how_s_taste_repression_48cf3a: "How's that for a taste of repression?"
  npc_override_2@nyr_Wolves_huh_a78e67: "Huh...?"
  npc_override_2@nyr_Wolves_i_didn_t_give_you_25b1cb: "I didn't give you any instructions. Are you trying to act on your own?"
  npc_override_2@nyr_Wolves_i_don_t_even_remember_08a9f2: "I don't even remember getting my praise. Um... Ah! I don't remember because I never got it.!"
  npc_override_2@nyr_Wolves_i_don_t_know_let_4d0d7b: "I don't know. Let's just find it."
  npc_override_2@nyr_Wolves_i_don_t_think_good_166a25: "I don't think this is a good situation. I need to get closer."
  npc_override_2@nyr_Wolves_i_don_t_think_party_0b9b94: "I don't think the party has arrived yet."
  npc_override_2@nyr_Wolves_i_feel_chill_down_my_71723b: "I feel a chill down my spine... Like someone's watching...?"
  npc_override_2@nyr_Wolves_i_heard_fight_somewhere_8eb97c: "I heard a fight somewhere?"
  npc_override_2@nyr_Wolves_i_know_f18215: "I know..."
  npc_override_2@nyr_Wolves_i_know_they_must_real_d0557e: "I know. They must have a real secret library."
  npc_override_2@nyr_Wolves_i_ll_evacuate_people_fbae7a: "I'll evacuate the people."
  npc_override_2@nyr_Wolves_i_ll_give_you_exactly_ec6f34: "I'll give you exactly 30 minutes! Go back within the time limit!"
  npc_override_2@nyr_Wolves_i_ll_go_s_probably_e572fa: "I'll go. That's probably my father's, because I have a pretty good idea of where it might have gone."
  npc_override_2@nyr_Wolves_i_ll_proceed_f246e8: "I'll proceed."
  npc_override_2@nyr_Wolves_i_ll_track_them_down_c36efd: "I'll track them down, and you, Adventurer, take care of these guys!"
  npc_override_2@nyr_Wolves_i_m_bit_believer_dc9528: "I'm a bit of a believer."
  npc_override_2@nyr_Wolves_i_m_going_burn_out_be860f: "I'm going to burn out my fingers."
  npc_override_2@nyr_Wolves_i_m_going_talk_forever_5aacbb: "I'm not going to talk forever. Let's go."
  npc_override_2@nyr_Wolves_i_m_just_following_behin_f6a6fc: "I'm just following behind, why do I need a group? I'm good enough on my own. You stay here, I'll signal if anything happens."
  npc_override_2@nyr_Wolves_i_m_miriam_daughter_high_4f2e09: "I'm Miriam, the daughter of High Priest Amal. We've been following a suspicious group of people into this area.."
  npc_override_2@nyr_Wolves_i_m_sure_there_instigato_79fd51: "I'm sure there are instigators lurking in the crowd outside, planted by the bad guys..."
  npc_override_2@nyr_Wolves_i_recall_seeing_last_tim_636b2f: "I recall seeing this last time, but how did we deal with it again..."
  npc_override_2@nyr_Wolves_i_sent_suad_don_t_148eea: "I was sent by Suad. Don't worry too much about it."
  npc_override_2@nyr_Wolves_i_still_don_t_understand_4faa71: "I still don't understand. What's going on?"
  npc_override_2@nyr_Wolves_i_still_mission_pending_a8de74: "I still have a mission pending!"
  npc_override_2@nyr_Wolves_i_think_my_father_involv_fcac4c: "I think my father is involved in this."
  npc_override_2@nyr_Wolves_i_thought_killing_me_2dc437: "I thought it was killing me!"
  npc_override_2@nyr_Wolves_i_told_you_find_first_a5d0be: "I told you to find it in the first place, not just come to me because it's there."
  npc_override_2@nyr_Wolves_i_ve_heard_you_ll_da4db5: "I've heard that you'll also be joining us for a separate cleansing operation inside the temple. We'll be counting on you!"
  npc_override_2@nyr_Wolves_i_ve_received_rendezvous_e167ef: "I've received the rendezvous point. You can join immediately through this emergency exit. When you're ready, proceed to enter."
  npc_override_2@nyr_Wolves_i_wish_i_could_found_eb82e4: "I wish I could have found the book, but I can't. They've done their work, so we're out of here."
  npc_override_2@nyr_Wolves_i_wish_i_had_suad_c9ef18: "I wish I had Suad here with me. I wish I could've helped him out sometime."
  npc_override_2@nyr_Wolves_i_wish_leader_tell_me_3e0cc8: "I wish the leader would tell me as a representative."
  npc_override_2@nyr_Wolves_if_i_knew_i_wouldn_bd3a70: "If I knew that, I wouldn't be here. I'd be like, 'Bring me anything that looks like that.' Go find it."
  npc_override_2@nyr_Wolves_if_s_case_then_there_0817d4: "If that's the case, then there's nothing we can do. I'll see you next time!"
  npc_override_2@nyr_Wolves_if_you_dismiss_now_we_b3fcbb: "If you dismiss now, we will not charge you for trespassing on the temple!"
  npc_override_2@nyr_Wolves_if_you_get_any_closer_035dde: "If you get any closer, we will take action."
  npc_override_2@nyr_Wolves_if_you_t_step_aside_78912a: "If you can't do it, step aside. I'll handle it."
  npc_override_2@nyr_Wolves_illusion_23387f: "That would be Illusion."
  npc_override_2@nyr_Wolves_information_leaked_other_9ae3fa: "Or the information was leaked. Otherwise, we wouldn't have been prepared."
  npc_override_2@nyr_Wolves_inspect_all_facilities_e_3ece5b: "Inspect all the facilities and ensure security. Anyone attempting to breach and gain power must be dealt with!"
  npc_override_2@nyr_Wolves_intruder_argh_df6e8c: "Intruder...! Argh!!!"
  npc_override_2@nyr_Wolves_isn_t_end_line_139cbb: "Isn't this the end of the line?"
  npc_override_2@nyr_Wolves_isn_t_only_magic_permitt_151335: "Isn't this the only magic permitted by the kingdom?"
  npc_override_2@nyr_Wolves_isn_t_party_leader_arriv_4c8296: "Isn't the party leader arrived yet?"
  npc_override_2@nyr_Wolves_jing_clap_b6de4d: "Jing- Clap-"
  npc_override_2@nyr_Wolves_just_any_heart_hunter_he_b8d399: "Not just any heart hunter. He's a really, really good Heart Hunter."
  npc_override_2@nyr_Wolves_keep_your_guard_up_de8ccf: "Keep your guard up!"
  npc_override_2@nyr_Wolves_last_library_i_don_t_872946: "This is the last library, but I don't think it's here."
  npc_override_2@nyr_Wolves_leave_irrelevant_books_a_a4fd79: "Leave the irrelevant books alone. That's not what we're looking for."
  npc_override_2@nyr_Wolves_leave_one_me_a17914: "Leave this one to me!"
  npc_override_2@nyr_Wolves_let_me_explain_ff77ea: "Let me explain."
  npc_override_2@nyr_Wolves_let_s_go_too_7ff8cf: "Let's go in too."
  npc_override_2@nyr_Wolves_looks_like_issue_riot_to_5f2231: "Looks like the issue with the riot on top is a big one."
  npc_override_2@nyr_Wolves_looks_like_s_short_circu_852d19: "Looks like it's short-circuiting! It's emitting light from it!"
  npc_override_2@nyr_Wolves_looks_like_they_re_headi_77d922: "Looks like they're heading for the temple."
  npc_override_2@nyr_Wolves_luckily_there_s_adventur_e6f7a6: "Luckily, there's an adventurer here. Perfect timing."
  npc_override_2@nyr_Wolves_main_forces_infiltrated_488e2a: "The main forces that infiltrated the temple have escaped, but we still have trouble with the temple guards who defected to the Heart Hunters and remnants of the Heart Hunters themselves who are after the heart."
  npc_override_2@nyr_Wolves_memorial_dungeon_exist_e702fe: "The memorial dungeon does not exist."
  npc_override_2@nyr_Wolves_menu_leader_4d6811: "Leader: {0}"
  npc_override_2@nyr_Wolves_menu_options_190dec: "{0} : Let me catch up."
  npc_override_2@nyr_Wolves_menu_options_44d1e4: "???: Wait."
  npc_override_2@nyr_Wolves_menu_options_caeeb2: "{0} : Who's the intruder?"
  npc_override_2@nyr_Wolves_menu_options_d04073: "{0} : Leave these people to me."
  npc_override_2@nyr_Wolves_menu_options_d90653: "???: Did you find the item?"
  npc_override_2@nyr_Wolves_menu_party_328f2e: "Party: {0}"
  npc_override_2@nyr_Wolves_menu_we_654733: "We have blocked off four areas from this point onwards: three garden zones and one entrance to the temple. Let us purify them sequentially."
  npc_override_2@nyr_Wolves_miriam_adventurer_little_aa665b: "Miriam, Adventurer. A little further over here."
  npc_override_2@nyr_Wolves_miriam_did_miriam_anythi_4c5886: "Miriam? Did Miriam have anything to do with this?"
  npc_override_2@nyr_Wolves_miriam_you_ve_come_far_333d13: "Miriam, You've come this far. You've done your part, now go home."
  npc_override_2@nyr_Wolves_miriam_you_your_friends_3a49a5: "Miriam, you and your friends have helped me complete this picture of the riot. Thank you so much!"
  npc_override_2@nyr_Wolves_mole_where_16182b: "A mole? Where?"
  npc_override_2@nyr_Wolves_more_preparation_needed_d001f1: "More preparation is needed."
  npc_override_2@nyr_Wolves_msg_61ce5a: "[{0}]"
  npc_override_2@nyr_Wolves_msg_93fcbf: "......"
  npc_override_2@nyr_Wolves_msg_abb326: "...!!"
  npc_override_2@nyr_Wolves_my_father_foreign_power_a192e6: "My father and a foreign power conspired to divide Arunafeltz and oppress the natives..."
  npc_override_2@nyr_Wolves_nice_know_book_title_27bd91: "It would be nice to know the book title."
  npc_override_2@nyr_Wolves_no_further_entry_allowed_f98cfb: "No further entry is allowed!"
  npc_override_2@nyr_Wolves_no_further_entry_permitt_75d900: "No further entry is permitted. Surrender to your arrest."
  npc_override_2@nyr_Wolves_no_illegal_protests_disb_ef04c5: "No illegal protests! Disband now!"
  npc_override_2@nyr_Wolves_no_need_investigate_ymir_b257da: "No need to investigate, Ymir's heart shard is missing. It's supposed to be there."
  npc_override_2@nyr_Wolves_no_one_here_suspicious_y_5f99b6: "No one here is suspicious. You may leave now."
  npc_override_2@nyr_Wolves_no_why_7660a4: "No? Why?"
  npc_override_2@nyr_Wolves_no_you_mean_hey_what_6d88bd: "No, you mean this? Hey! What are you looking for? For what purpose?"
  npc_override_2@nyr_Wolves_now_2d67b2: "Is it now?"
  npc_override_2@nyr_Wolves_now_4c0c77: "Now!"
  npc_override_2@nyr_Wolves_now_let_s_begin_mission_3a3da0: "Now, let's begin the mission!"
  npc_override_2@nyr_Wolves_now_time_follow_me_quiet_92ac52: "Now is the time. Follow me quietly."
  npc_override_2@nyr_Wolves_now_you_ve_been_praised_9d360f: "Now that you've been praised, you can go home, wash off your feet, and sleep.."
