  npc_override_2@nyr_Wolves_what_you_talking_about_h_a9aca3: "What are you talking about, a handful of impulsive protests to the temple?"
  npc_override_2@nyr_Wolves_what_you_talking_about_i_3218c9: "What are you talking about? This isn't permitted by the kingdom either. Have you forgotten?"
