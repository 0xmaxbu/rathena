Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_2@nyr_Wolves_acknowledge_us_e5ebde: "Acknowledge us!"
  npc_override_2@nyr_Wolves_adventurer_party_enter_f_a46be7: "Adventurer {0} of the {1} party will enter {2} first. All wolves, gather sequentially."
  npc_override_2@nyr_Wolves_adventurer_thank_you_you_7cfa03: "Adventurer, thank you for your assistance."
  npc_override_2@nyr_Wolves_adventurer_why_you_here_5f2f07: "Adventurer...? Why are you here, Adventurer?"
  npc_override_2@nyr_Wolves_after_you_loose_some_wei_468fb8: "- after you loose some weight. -"
  npc_override_2@nyr_Wolves_ah_971301: "Ah..."
  npc_override_2@nyr_Wolves_ah_you_said_there_enemie_130735: "Ah...! You said there would be enemies among the Temple Guards, so we'll have to pick out the ones we trust first."
  npc_override_2@nyr_Wolves_all_hands_formation_faed55: "All hands in formation!"
  npc_override_2@nyr_Wolves_alright_i_ll_send_signal_3d17fb: "Alright. I'll send the signal."
  npc_override_2@nyr_Wolves_area_under_maintenance_a_08aed7: "This area is under maintenance and access is prohibited. It's dangerous. Please step back."
  npc_override_2@nyr_Wolves_area_under_maintenance_a_66d3de: "This area is under maintenance and access is prohibited."
  npc_override_2@nyr_Wolves_aren_t_you_least_secure_172648: "... Aren't you at least this secure?"
  npc_override_2@nyr_Wolves_argh_argh_temple_guard_g_b22363: "Argh!!!! Argh!!! The temple guard grabs a man!!!"
  npc_override_2@nyr_Wolves_ask_if_s_okay_back_2521a6: "Ask if it's okay to back out."
  npc_override_2@nyr_Wolves_awaiting_security_code_r_2ac2dd: "Awaiting security code reset. Please input the new security code."
  npc_override_2@nyr_Wolves_beep_a25744: "Beep-"
  npc_override_2@nyr_Wolves_cancel_input_8e6f7b: "Cancel input"
  npc_override_2@nyr_Wolves_careful_fa18ab: "Be careful."
  npc_override_2@nyr_Wolves_clean_up_your_mess_167ca8: "Clean up your mess."
  npc_override_2@nyr_Wolves_currently_you_re_carryin_73594b: "- Currently you're carrying -"
  npc_override_2@nyr_Wolves_did_you_find_what_kind_3ac1e7: "Did you find it? What kind of a place is this?"
  npc_override_2@nyr_Wolves_doesn_t_look_good_i_661592: "This doesn't look good. I need to get Suad, but where's the deputy?"
  npc_override_2@nyr_Wolves_doesn_t_look_like_they_451a2e: "Doesn't it look like they're looking for a specific book?"
  npc_override_2@nyr_Wolves_don_t_you_see_we_416a19: "Don't you see? We're breaking into a library. There must be a lot of secrets of the settlers in here."
  npc_override_2@nyr_Wolves_drop_your_weapon_ea2b9a: "Drop your weapon!!"
  npc_override_2@nyr_Wolves_end_library_227f4f: "Is this the end of the library?"
  npc_override_2@nyr_Wolves_enter_0abb0f: "Enter."
  npc_override_2@nyr_Wolves_even_most_secretive_libr_e22590: "Even the most secretive of libraries wouldn't just leave a book like that lying around."
  npc_override_2@nyr_Wolves_events_inside_temple_adcee8: "- The events inside the temple. -"
  npc_override_2@nyr_Wolves_everyone_lay_down_your_w_1f0086: "Everyone lay down your weapons and raise your hands!"
  npc_override_2@nyr_Wolves_father_80d4f8: "...Father??"
  npc_override_2@nyr_Wolves_father_father_ab1c03: "Father! Father!!!"
  npc_override_2@nyr_Wolves_father_who_praises_you_n_3bb5e7: "A father who praises you but never loves you?"
  npc_override_2@nyr_Wolves_four_bed031: "Four!"
  npc_override_2@nyr_Wolves_go_home_miriam_i_m_0eb5f0: "Go home, Miriam. I'm not going to cooperate with your stuffy behavior anymore."
  npc_override_2@nyr_Wolves_good_timing_then_we_ll_4f1757: "Good timing. Then we'll say goodbye!"
  npc_override_2@nyr_Wolves_ha_hah_adventurer_you_al_a1e99c: "Ha... Hah... Adventurer, are you all right?"
  npc_override_2@nyr_Wolves_hah_now_s_life_saver_69c25c: "Hah- now that's a life saver."
  npc_override_2@nyr_Wolves_he_s_always_been_like_ca1345: "He's always been like that... Is there something ominous about that?"
  npc_override_2@nyr_Wolves_heart_hunters_undercover_0fc271: "The Heart Hunters were undercover."
  npc_override_2@nyr_Wolves_hearthunter_you_re_worki_7b5e6a: "Hearthunter... you're working with those mad scientists you were talking about... from the very beginning...!"
  npc_override_2@nyr_Wolves_hello_adventurer_agent_t_a48952: "Hello, adventurer. An agent from a temple has been waiting for you."
  npc_override_2@nyr_Wolves_hello_did_you_get_good_fd13f7: "Hello! Did you get a good rest? I would be grateful if you could help me today. Please note that the operation can be done once a day."
  npc_override_2@nyr_Wolves_here_s_what_2dd421: "Here's what..."
  npc_override_2@nyr_Wolves_here_we_go_intruder_here_376d69: "Here we go! The intruder is here!!!"
  npc_override_2@nyr_Wolves_hey_mr_genius_don_t_92a5f6: "Hey, Mr. Genius, don't you know how to make an irony?! Tight security is not synonymous with cumbersome and demanding procedures, right?"
  npc_override_2@nyr_Wolves_hi_let_me_formally_intro_45c752: "Hi, let me formally introduce ourselves. We're the Heart Hunters, and we're about to bury you here."
  npc_override_2@nyr_Wolves_high_priest_what_even_me_56bb2d: "High Priest?? What does that even mean?"
  npc_override_2@nyr_Wolves_hold_adventurer_5fd2fb: "Hold on, Adventurer!"
  npc_override_2@nyr_Wolves_how_far_we_there_ce05b8: "How far are we from there?"
  npc_override_2@nyr_Wolves_how_high_priest_we_ll_c51c7c: "How is that... High Priest...? We'll have to investigate."
  npc_override_2@nyr_Wolves_how_i_fbb7db: "How do I do this?"
  npc_override_2@nyr_Wolves_i_didn_t_give_you_25b1cb: "I didn't give you any instructions. Are you trying to act on your own?"
  npc_override_2@nyr_Wolves_i_don_t_even_remember_08a9f2: "I don't even remember getting my praise. Um... Ah! I don't remember because I never got it.!"
  npc_override_2@nyr_Wolves_i_don_t_know_let_4d0d7b: "I don't know. Let's just find it."
  npc_override_2@nyr_Wolves_i_know_f18215: "I know..."
  npc_override_2@nyr_Wolves_i_know_they_must_real_d0557e: "I know. They must have a real secret library."
  npc_override_2@nyr_Wolves_i_ll_evacuate_people_fbae7a: "I'll evacuate the people."
  npc_override_2@nyr_Wolves_i_ll_give_you_exactly_ec6f34: "I'll give you exactly 30 minutes! Go back within the time limit!"
  npc_override_2@nyr_Wolves_i_ll_go_s_probably_e572fa: "I'll go. That's probably my father's, because I have a pretty good idea of where it might have gone."
  npc_override_2@nyr_Wolves_i_m_going_talk_forever_5aacbb: "I'm not going to talk forever. Let's go."
  npc_override_2@nyr_Wolves_i_m_just_following_behin_f6a6fc: "I'm just following behind, why do I need a group? I'm good enough on my own. You stay here, I'll signal if anything happens."
  npc_override_2@nyr_Wolves_i_m_miriam_daughter_high_4f2e09: "I'm Miriam, the daughter of High Priest Amal. We've been following a suspicious group of people into this area.."
  npc_override_2@nyr_Wolves_i_m_sure_there_instigato_79fd51: "I'm sure there are instigators lurking in the crowd outside, planted by the bad guys..."
  npc_override_2@nyr_Wolves_i_think_my_father_involv_fcac4c: "I think my father is involved in this."
  npc_override_2@nyr_Wolves_i_told_you_find_first_a5d0be: "I told you to find it in the first place, not just come to me because it's there."
  npc_override_2@nyr_Wolves_i_ve_heard_you_ll_da4db5: "I've heard that you'll also be joining us for a separate cleansing operation inside the temple. We'll be counting on you!"
  npc_override_2@nyr_Wolves_i_ve_received_rendezvous_e167ef: "I've received the rendezvous point. You can join immediately through this emergency exit. When you're ready, proceed to enter."
  npc_override_2@nyr_Wolves_i_wish_i_could_found_eb82e4: "I wish I could have found the book, but I can't. They've done their work, so we're out of here."
  npc_override_2@nyr_Wolves_i_wish_i_had_suad_c9ef18: "I wish I had Suad here with me. I wish I could've helped him out sometime."
  npc_override_2@nyr_Wolves_if_i_knew_i_wouldn_bd3a70: "If I knew that, I wouldn't be here. I'd be like, 'Bring me anything that looks like that.' Go find it."
  npc_override_2@nyr_Wolves_if_s_case_then_there_0817d4: "If that's the case, then there's nothing we can do. I'll see you next time!"
  npc_override_2@nyr_Wolves_if_you_dismiss_now_we_b3fcbb: "If you dismiss now, we will not charge you for trespassing on the temple!"
  npc_override_2@nyr_Wolves_if_you_get_any_closer_035dde: "If you get any closer, we will take action."
  npc_override_2@nyr_Wolves_illusion_23387f: "That would be Illusion."
  npc_override_2@nyr_Wolves_information_leaked_other_9ae3fa: "Or the information was leaked. Otherwise, we wouldn't have been prepared."
  npc_override_2@nyr_Wolves_intruder_argh_df6e8c: "Intruder...! Argh!!!"
  npc_override_2@nyr_Wolves_isn_t_end_line_139cbb: "Isn't this the end of the line?"
  npc_override_2@nyr_Wolves_keep_your_guard_up_de8ccf: "Keep your guard up!"
  npc_override_2@nyr_Wolves_leave_irrelevant_books_a_a4fd79: "Leave the irrelevant books alone. That's not what we're looking for."
  npc_override_2@nyr_Wolves_leave_one_me_a17914: "Leave this one to me!"
  npc_override_2@nyr_Wolves_let_me_explain_ff77ea: "Let me explain."
  npc_override_2@nyr_Wolves_let_s_go_too_7ff8cf: "Let's go in too."
  npc_override_2@nyr_Wolves_looks_like_issue_riot_to_5f2231: "Looks like the issue with the riot on top is a big one."
  npc_override_2@nyr_Wolves_looks_like_they_re_headi_77d922: "Looks like they're heading for the temple."
  npc_override_2@nyr_Wolves_main_forces_infiltrated_488e2a: "The main forces that infiltrated the temple have escaped, but we still have trouble with the temple guards who defected to the Heart Hunters and remnants of the Heart Hunters themselves who are after the heart."
  npc_override_2@nyr_Wolves_memorial_dungeon_exist_e702fe: "The memorial dungeon does not exist."
  npc_override_2@nyr_Wolves_menu_leader_4d6811: "Leader: {0}"
  npc_override_2@nyr_Wolves_menu_party_328f2e: "Party: {0}"
  npc_override_2@nyr_Wolves_miriam_did_miriam_anythi_4c5886: "Miriam? Did Miriam have anything to do with this?"
  npc_override_2@nyr_Wolves_miriam_you_ve_come_far_333d13: "Miriam, You've come this far. You've done your part, now go home."
  npc_override_2@nyr_Wolves_miriam_you_your_friends_3a49a5: "Miriam, you and your friends have helped me complete this picture of the riot. Thank you so much!"
  npc_override_2@nyr_Wolves_mole_where_16182b: "A mole? Where?"
  npc_override_2@nyr_Wolves_msg_61ce5a: "[{0}]"
  npc_override_2@nyr_Wolves_msg_abb326: "...!!"
  npc_override_2@nyr_Wolves_my_father_foreign_power_a192e6: "My father and a foreign power conspired to divide Arunafeltz and oppress the natives..."
  npc_override_2@nyr_Wolves_nice_know_book_title_27bd91: "It would be nice to know the book title."
  npc_override_2@nyr_Wolves_no_further_entry_permitt_75d900: "No further entry is permitted. Surrender to your arrest."
  npc_override_2@nyr_Wolves_no_need_investigate_ymir_b257da: "No need to investigate, Ymir's heart shard is missing. It's supposed to be there."
  npc_override_2@nyr_Wolves_no_one_here_suspicious_y_5f99b6: "No one here is suspicious. You may leave now."
  npc_override_2@nyr_Wolves_no_why_7660a4: "No? Why?"
  npc_override_2@nyr_Wolves_no_you_mean_hey_what_6d88bd: "No, you mean this? Hey! What are you looking for? For what purpose?"
  npc_override_2@nyr_Wolves_oh_i_m_late_e731f9: "Oh... I'm late...!"
  npc_override_2@nyr_Wolves_oh_my_god_i_don_b493b2: "Oh, my God, I don't want to embarrass you."
  npc_override_2@nyr_Wolves_oh_no_i_m_sorry_6d99da: "Oh, no~ I'm sorry we've crossed paths, we got dirty, so let's not meet again?"
  npc_override_2@nyr_Wolves_oh_there_you_go_again_09839b: "Oh, there you go again! Why are you eavesdropping? As if you have something shady to share."
  npc_override_2@nyr_Wolves_oh_you_don_t_know_b2e05f: "Oh, you don't know, do you? His wish is to drive all the natives out of Arunafeltz. We helped a little with that, but not for free."
  npc_override_2@nyr_Wolves_once_you_ve_got_covered_f452c7: "Once you've got it covered, move fast. They're waiting for you at the safe house."
  npc_override_2@nyr_Wolves_once_you_ve_got_what_92f2ec: "... Once you've got what you need, let's move on."
  npc_override_2@nyr_Wolves_one_we_cc6291: "One! We have..."
  npc_override_2@nyr_Wolves_only_member_party_enter_9eb530: "^ff0000Only a member of the party can enter the Memorial Dungeon.^000000"
  npc_override_2@nyr_Wolves_our_demands_as_follows_ec7f07: "Our demands are as follows."
  npc_override_2@nyr_Wolves_our_land_486830: "This is Our Land!"
  npc_override_2@nyr_Wolves_our_land_if_owner_wants_f4dff4: "This is our land! If the owner wants to enter into their own land, why should anyone be stopping them?"
  npc_override_2@nyr_Wolves_our_old_face_ah_those_1580f1: "Was it our old face? Ah, those are the small fries that are said to be tracking you. I heard the news."
  npc_override_2@nyr_Wolves_party_leader_did_generat_5a6394: "The party leader did not generate the dungeon yet."
  npc_override_2@nyr_Wolves_payment_we_don_t_get_d6a1f5: "Payment? We don't get that, do we?"
  npc_override_2@nyr_Wolves_place_off_limits_e51a03: "This place is off-limits."
  npc_override_2@nyr_Wolves_plan_next_operation_hasn_6502f9: "The plan for the next operation hasn't been completed yet. Since it's conducted only once a day, we need to be cautious. Please rest until then, adventurer."
  npc_override_2@nyr_Wolves_please_take_rest_your_jo_de8397: "Please take a rest from your journey now! See you again!"
  npc_override_2@nyr_Wolves_please_try_again_cefdd7: "- Please try again -"
  npc_override_2@nyr_Wolves_point_let_s_go_first_b3f794: "At this point, let's go in first!!!"
  npc_override_2@nyr_Wolves_quest_available_level_on_35b76e: "- This quest is available from level 170 onward. -"
  npc_override_2@nyr_Wolves_raid_defected_temple_gua_48372a: "Raid on the defected temple guards.Is that so? Understood."
  npc_override_2@nyr_Wolves_really_hurts_man_don_t_10962e: "That really hurts, man. Don't you realize that we're trying to make a good thing out of this? Can't you understand that we're trying to make a better life for everyone?"
  npc_override_2@nyr_Wolves_return_land_rightful_own_c51564: "Return the land to the rightful owners of the land!"
  npc_override_2@nyr_Wolves_right_adventurers_also_e_af82b6: "Right. Adventurers are also essential forces, so let's wait until they're ready."
  npc_override_2@nyr_Wolves_s_action_s_discussed_bef_21ee73: "It's an action that's not discussed beforehand. I already have a history, and that's not a good thing, is it? I'm going to have to tread quietly, I don't know what else I'm going to do.."
  npc_override_2@nyr_Wolves_s_also_among_temple_guar_1fd007: "It's also among the Temple Guard."
  npc_override_2@nyr_Wolves_s_basically_quick_count_9a37cc: "That's basically a quick count, right? Okay, let's make it quick and get on with it."
  npc_override_2@nyr_Wolves_s_good_s_spiraling_out_dabd05: "It's not good. It's spiraling out of control. The temple is coming down hard on us. They're recommending we disband. We're running out of time. We're preparing to evacuate."
  npc_override_2@nyr_Wolves_s_looking_good_right_now_8ba28e: "It's not looking good right now. I think... The armed guards increasing their security.."
  npc_override_2@nyr_Wolves_s_more_accurate_say_they_b0703f: "It's more accurate to say they're gone into hiding than traitorous. They were never on our side to begin with."
  npc_override_2@nyr_Wolves_s_necessary_you_guys_sho_9bf557: "That's not necessary. You guys should get out of here and let the new guys take over."
  npc_override_2@nyr_Wolves_s_obscured_so_i_m_3e9149: "It's obscured, so I'm not sure..."
  npc_override_2@nyr_Wolves_s_really_really_really_s_437ed0: "It's really, really, really secure. I'm just saying."
  npc_override_2@nyr_Wolves_s_riot_put_down_464e33: "It's a riot! Put it down!"
  npc_override_2@nyr_Wolves_schulang_you_secured_yet_325e88: "Schulang, have you secured it yet? This Bagot is about to lose patience."
  npc_override_2@nyr_Wolves_security_code_reset_prog_cb0f7b: "Security code reset in progress. Please enter the new security code."
  npc_override_2@nyr_Wolves_see_those_guys_over_ther_605072: "See those guys over there? They're moving cautiously. That's the group that did the attack on the top."
  npc_override_2@nyr_Wolves_seems_like_weird_twist_f_8c6d9e: "It seems like a weird twist of fate, huh? The Temple Guards have been bought off. We need to find out what's going on..."
  npc_override_2@nyr_Wolves_seems_resonate_heart_ymi_7a0ac4: "It seems to resonate with the heart of Ymir here."
  npc_override_2@nyr_Wolves_seems_you_re_already_eng_c23dc5: "It seems you're already engaged in a mission. Very well, please take care of it."
  npc_override_2@nyr_Wolves_shhh_hold_second_cc9bdf: "Shhh-hold on a second."
  npc_override_2@nyr_Wolves_signal_arrived_so_let_s_9eafbe: "The signal has arrived, so let's move. Let's enter the rendezvous point right away."
  npc_override_2@nyr_Wolves_signal_come_so_let_s_d82532: "The signal has come, so let's move. Let's enter right away."
  npc_override_2@nyr_Wolves_since_we_ve_sent_signal_0ddc0d: "Since we've sent the signal, the emergency passage will open soon. Let us know when you're ready. We'll enter immediately."
  npc_override_2@nyr_Wolves_so_there_another_secret_538b4a: "So is there another secret library within the secret library?"
  npc_override_2@nyr_Wolves_so_we_almost_middle_orga_3d579b: "So we were almost in the middle of an organized riot from the start?"
  npc_override_2@nyr_Wolves_so_what_mission_did_you_bcc254: "Is that so? What mission did you miss?"
  npc_override_2@nyr_Wolves_someone_sniffed_out_wolf_20f51a: "Someone sniffed out the wolf and decided to follow us. We'll take care of it soon."
  npc_override_2@nyr_Wolves_something_s_right_people_33847c: "Something's not right. People are getting too aggressive."
  npc_override_2@nyr_Wolves_soon_protest_outside_tur_eb19e1: "Soon the protest outside will turn into a riot, and then your wish will be granted, and then you'll make another wish, and then we'll get paid again?"
  npc_override_2@nyr_Wolves_specific_book_just_book_d031e2: "A specific book...? Not just a book to exploit weaknesses?"
  npc_override_2@nyr_Wolves_suad_did_you_give_any_64ecb6: "Suad, did you give any specific instructions to the people who were rioting at the top?"
  npc_override_2@nyr_Wolves_suad_first_all_give_us_b557bf: "Suad, first of all, give us an overview of the situation here. It sounds like we're on the verge of a riot, is that right? Oh, hello, Priest Zhed."
  npc_override_2@nyr_Wolves_t_help_then_you_adventur_30b02b: "...Can't help it, then. Can you, Adventurer?"
  npc_override_2@nyr_Wolves_take_care_all_intruders_6dcff6: "Take care of all intruders!"
  npc_override_2@nyr_Wolves_thank_you_your_cooperati_195ebc: "Thank you for your cooperation. Let me know when you're ready."
  npc_override_2@nyr_Wolves_then_me_favor_i_ll_fec97e: "Then do me a favor, I'll leave a trail so you can find me.."
  npc_override_2@nyr_Wolves_then_please_let_me_know_8a04ad: "Then please let me know when you're ready."
  npc_override_2@nyr_Wolves_there_few_people_i_don_96e0fa: "There are a few people I don't recognize."
  npc_override_2@nyr_Wolves_there_intruder_7b219d: "There, intruder!"
  npc_override_2@nyr_Wolves_there_s_mole_among_us_a39faa: "There's a mole among us... but who's the impostor?"
  npc_override_2@nyr_Wolves_there_s_reason_first_let_715a33: "There's a reason for that, but first, let's talk about the situation, Suad?"
  npc_override_2@nyr_Wolves_there_still_lot_heart_hu_6f3bda: "There are still a lot of Heart Hunters remodeled with Ymir's heart left, right?"
  npc_override_2@nyr_Wolves_there_you_i_brought_alon_5a08dd: "There you are. I brought along Priest Zhed."
  npc_override_2@nyr_Wolves_they_ll_never_know_how_10f28d: "They'll never know how much we care. It's about time you showed up, by the way..."
  npc_override_2@nyr_Wolves_they_say_they_re_only_d82fe3: "They say that they're only following, but there's no telling what they might be doing. Even if they're unarmed, they might be hiding something..."
  npc_override_2@nyr_Wolves_time_they_ve_infiltrated_d076ae: "This is not the time. They've infiltrated the temple as well, so we have to take on both sides.."
  npc_override_2@nyr_Wolves_too_many_items_you_fc968e: "- too many items with you. -"
  npc_override_2@nyr_Wolves_understood_8e574a: "Understood."
  npc_override_2@nyr_Wolves_understood_i_ll_wait_f31d39: "Understood. I'll wait."
  npc_override_2@nyr_Wolves_unknown_error_occurred_285cc7: "^ff0000An unknown error occurred.^000000"
  npc_override_2@nyr_Wolves_vault_security_code_been_0790c0: "Vault security code has been reset."
  npc_override_2@nyr_Wolves_voice_3b0b6c: "This voice is..."
  npc_override_2@nyr_Wolves_wait_82d113: "Wait!!!"
  npc_override_2@nyr_Wolves_wait_am_i_seeing_things_ff0ac5: "Wait, am I seeing things? That's Miriam and the Adventurer."
  npc_override_2@nyr_Wolves_wait_minute_17efa5: "- Wait a minute !! -"
  npc_override_2@nyr_Wolves_watch_out_they_re_modifi_dcaa0b: "Watch out, they're modified."
  npc_override_2@nyr_Wolves_we_all_gathered_now_db63e8: "Are we all gathered now?"
  npc_override_2@nyr_Wolves_we_come_claim_our_rightf_8f0b31: "We have come to claim our rightful place as the longtime inhabitants of this land."
  npc_override_2@nyr_Wolves_we_conducting_raids_inde_933143: "We are conducting raids independently, but we would appreciate your assistance, adventurer. Please note that raids are conducted once a day."
  npc_override_2@nyr_Wolves_we_haven_t_sent_signal_d3adf3: "We haven't sent the signal yet. Once everyone is ready, we'll send the signal immediately."
  npc_override_2@nyr_Wolves_we_keep_1edac0: "But do we have to keep this on?"
  npc_override_2@nyr_Wolves_we_ll_talk_about_when_c1803b: "We'll talk about that when we get outside, because it's not looking good out there."
  npc_override_2@nyr_Wolves_we_longtime_owners_land_0808bf: "We are the longtime owners of this land and have been displaced from our homes by the settlers."
  npc_override_2@nyr_Wolves_we_mole_among_us_2461b4: "We have a mole among us."
  npc_override_2@nyr_Wolves_we_need_move_quickly_a0c7e6: "We need to move quickly."
  npc_override_2@nyr_Wolves_we_need_stop_brute_force_290264: "We need to stop the brute-force attackers."
  npc_override_2@nyr_Wolves_we_re_alive_we_here_b79b79: "We're alive! We are here!!"
  npc_override_2@nyr_Wolves_we_re_almost_there_now_331168: "We're almost there now."
  npc_override_2@nyr_Wolves_we_re_going_need_major_f814a1: "We're going to need to do a major overhaul...first we need to figure out what we've been doing here, making sure there's nothing dangerous, and nothing is lost... even among the Temple Guards."
  npc_override_2@nyr_Wolves_we_re_outnumbered_let_s_5f529d: "We're outnumbered, let's deal with it."
  npc_override_2@nyr_Wolves_we_think_about_later_now_f905ac: "We can think about that later. For now. Go back. Your actions now could put us in more danger.."
  npc_override_2@nyr_Wolves_welcome_adventurer_you_v_8cc1ff: "Welcome, adventurer. You've been through a lot."
  npc_override_2@nyr_Wolves_well_done_everyone_clean_65edc3: "Well done, everyone! The cleansing will continue daily! Let's disband for today and take a rest!"
  npc_override_2@nyr_Wolves_well_s_relief_i_t_583a78: "Well, that's a relief. I can't make any hasty moves here. Miriam left a trace. Now do me a favor and just follow the trace."
  npc_override_2@nyr_Wolves_what_happened_people_you_cfc77a: "What happened to the people you followed?"
  npc_override_2@nyr_Wolves_what_heck_they_re_going_93ab4a: "What the heck they're going to do with it... I can't even imagine."
  npc_override_2@nyr_Wolves_what_hell_give_back_our_a3303b: "What the hell, give it back!! Our land!!"
  npc_override_2@nyr_Wolves_what_hell_you_doing_349d95: "What the hell are you doing??"
  npc_override_2@nyr_Wolves_what_s_going_c28e59: "What's going on?"
  npc_override_2@nyr_Wolves_what_s_going_here_someth_20325e: "What's going on here? Does it have something to do with the people who have flocked here? Or, is there something inside the temple that's causing this..."
  npc_override_2@nyr_Wolves_what_s_going_you_said_6e9629: "What's going on? You said it's something urgent."
  npc_override_2@nyr_Wolves_what_s_whistle_s_our_0991ee: "What's that whistle? It's not our signal."
  npc_override_2@nyr_Wolves_what_there_something_els_bacb95: "What is it? Is there something else?"
  npc_override_2@nyr_Wolves_what_we_done_we_re_b6265a: "What have we done? We're not supposed to be in here!"
  npc_override_2@nyr_Wolves_what_we_should_doing_we_3d16a3: "This is not what we should be doing, we need to tell the truth and track them down...!!"
  npc_override_2@nyr_Wolves_what_what_s_all_fuss_41e0a5: "What, what's all the fuss about?"
  npc_override_2@nyr_Wolves_what_what_s_going_why_da1bfb: "What, what's going on? Why did my dad... What did you do?"
  npc_override_2@nyr_Wolves_what_you_doing_here_74351b: "What are you doing here?"
  npc_override_2@nyr_Wolves_what_you_doing_how_many_4722fd: "What are you doing? How many people are there? I can't see much from here."
  npc_override_2@nyr_Wolves_what_you_doing_my_father_ded64b: "What are you doing to my father?"
  npc_override_2@nyr_Wolves_what_you_going_624170: "What are you going to do?"
  npc_override_2@nyr_Wolves_what_you_mean_what_you_f098d5: "What do you mean? What are you doing...?"
  npc_override_2@nyr_Wolves_what_you_talking_about_h_a9aca3: "What are you talking about, a handful of impulsive protests to the temple?"
  npc_override_2@nyr_Wolves_when_we_enter_here_we_1d646d: "When we enter here, we can go towards the side entrance of the temple. We'll enter when we receive a response after sending the signal over there. Adventure, can you send the signal?"
  npc_override_2@nyr_Wolves_where_did_they_all_go_30d7de: "But where did they all go?"
  npc_override_2@nyr_Wolves_where_s_party_leader_d89dd0: "Where's the party leader?"
  npc_override_2@nyr_Wolves_who_cares_you_came_far_46a1f5: "Who cares? You came this far. Do as you please."
  npc_override_2@nyr_Wolves_who_you_guys_talking_82da6e: "Who are you guys talking to?"
  npc_override_2@nyr_Wolves_who_you_what_you_these_2983c4: "Who are you? What do you have to do with these people?"
  npc_override_2@nyr_Wolves_whoa_what_hell_you_doing_3bca4d: "Whoa! What the hell are you doing here, with an Adventurer?"
  npc_override_2@nyr_Wolves_why_high_priest_here_876b15: "Why is the High Priest here?"
  npc_override_2@nyr_Wolves_why_you_re_taking_clothe_d8d6b5: "Why you're taking clothes off??"
  npc_override_2@nyr_Wolves_work_help_my_father_here_d4a14f: "Work... help...? Is my father here?"
  npc_override_2@nyr_Wolves_wow_you_got_praised_your_5770e6: "Wow, you got praised by your dad. That's great. Compliments for good parenting, it's important."
  npc_override_2@nyr_Wolves_yeah_everyone_s_ready_we_bbc52a: "Yeah, everyone's ready. We just need to signal our people scattered around and enter the temple."
  npc_override_2@nyr_Wolves_yes_7b21e8: "Yes, it is."
  npc_override_2@nyr_Wolves_yes_e20739: "Yes!!"
  npc_override_2@nyr_Wolves_yes_i_ll_handle_you_2d8b95: "Yes. I'll handle it, you go after them."
  npc_override_2@nyr_Wolves_yet_i_don_t_think_d79317: "Not yet. I don't think it's on this side. Oh, wait... The High Priest's...?"
  npc_override_2@nyr_Wolves_you_catch_them_make_them_5fc2fa: "You have to catch them and make them open their mouths...!"
  npc_override_2@nyr_Wolves_you_don_t_need_cautious_4cf99d: "You don't need to be cautious. This person is an adventurer who is with us."
  npc_override_2@nyr_Wolves_you_going_alone_5600a1: "Are you going alone?"
  npc_override_2@nyr_Wolves_you_guys_451724: "You guys...!"
  npc_override_2@nyr_Wolves_you_guys_paid_02325c: "Are you guys paid to do this?"
  npc_override_2@nyr_Wolves_you_here_help_high_pries_b66cd4: "Are you here to help the High Priest with his work?"
  npc_override_2@nyr_Wolves_you_here_join_protest_yo_c848d8: "Are you here to join the protest? But you don't seem like an experienced protester."
  npc_override_2@nyr_Wolves_you_know_them_36a908: "Do you know them?"
  npc_override_2@nyr_Wolves_you_must_least_baselevel_8f4c5a: "You must be at least BaseLevel 170 for this instance."
  npc_override_2@nyr_Wolves_you_re_all_good_go_10c7ca: "You're all good to go."
  npc_override_2@nyr_Wolves_you_re_going_arrest_ever_f1c38f: "You're going to arrest everyone and put them in jail, right?"
  npc_override_2@nyr_Wolves_you_re_ones_who_illegall_9b0a9b: "You're the ones who are illegally occupying it!"
  npc_override_2@nyr_Wolves_you_re_ones_who_sneaked_ee9764: "You're the ones who sneaked in with the shady stuff, remember? What's the book you're looking for?"
  npc_override_2@nyr_Wolves_you_re_same_league_as_b8b2c7: "You're in the same league as my father.?"
  npc_override_2@nyr_Wolves_you_ready_i_send_join_51c41f: "Are you ready? I will send the join signal."
  npc_override_2@nyr_Wolves_you_shouldn_t_here_right_13cd03: "You shouldn't be here right now. If the Temple finds out, it will only make things more difficult for us."
  npc_override_2@nyr_Wolves_you_sure_there_aren_t_743338: "Are you sure there aren't any suspicious people coming in? They've obviously gotten into this place, give me a second and I'll check it out quickly."
  npc_override_2@nyr_Wolves_you_think_makes_sense_c069a2: "Do you think that makes sense?"
  npc_override_2@nyr_Wolves_you_threatening_us_now_77c11c: "Are you threatening us now?"
  npc_override_2@nyr_Wolves_you_ve_been_tracking_col_fe7091: "You've been tracking a colleague who's been acting suspiciously, and it turns out they're actually a mole."
