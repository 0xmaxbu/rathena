Body:
  npc_override_gef_fild04_quest_pupa_amazing_you_found_so_man_d25b96: "Amazing you found so many that fast."
  npc_override_gef_fild04_quest_pupa_any_progress_you_ve_made_b3e247: "Any progress that you've made will be erased"
  npc_override_gef_fild04_quest_pupa_hmm_i_don_t_think_16ac8a: "Hmm, I don't think you've gotten rid of 50 Pupa yet..."
  npc_override_gef_fild04_quest_pupa_hmm_i_don_t_think_c8a55e: "Hmm, I don't think you've gotten rid of 100 Pupa yet..."
  npc_override_gef_fild04_quest_pupa_hmm_i_don_t_think_eac787: "Hmm, I don't think you've gotten rid of 150 Pupa yet..."
  npc_override_gef_fild04_quest_pupa_how_many_you_like_get_3e24fe: "How many would you like to get rid of?"
  npc_override_gef_fild04_quest_pupa_i_know_i_could_ve_ba293e: "I know that I could've probably done this myself but it's not easy to be standing here all of the time."
  npc_override_gef_fild04_quest_pupa_i_need_chrysalis_ea53a3: "I need ^00CE0025 Chrysalis^000000."
  npc_override_gef_fild04_quest_pupa_i_need_chrysalis_no_less_621bc4: "I need ^00CE0025 Chrysalis^000000 and no less please."
  npc_override_gef_fild04_quest_pupa_if_you_change_your_mind_3f2210: "If you change your mind, please come back."
  npc_override_gef_fild04_quest_pupa_if_you_get_rid_those_422601: "If you can get rid of 150 of those Pupa from the field I will be grateful."
  npc_override_gef_fild04_quest_pupa_if_you_get_rid_those_abe57f: "If you can get rid of 100 of those Pupa from the field I will be grateful."
  npc_override_gef_fild04_quest_pupa_if_you_get_rid_those_db8d3b: "If you can get rid of 50 of those Pupa from the field I will be grateful."
  npc_override_gef_fild04_quest_pupa_lets_honest_you_pretties_e0a239: "And lets be honest, you are not the prettiest looking face I've seen."
  npc_override_gef_fild04_quest_pupa_like_i_promised_give_me_133e0e: "Like I promised, give me the Chrysalis and I will reward you with my wisdom."
  npc_override_gef_fild04_quest_pupa_menu_gather_c0af3a: "Gather Items:Get rid of Pupa:Cancel"
  npc_override_gef_fild04_quest_pupa_menu_i_8b4a09: "I have Chrysalis:What did you need?"
  npc_override_gef_fild04_quest_pupa_menu_pupa_7dcfa6: "50 Pupa:100 Pupa:150 Pupa"
  npc_override_gef_fild04_quest_pupa_menu_sure_fa2cd4: "Sure, I don't mind:No"
  npc_override_gef_fild04_quest_pupa_menu_yes_141459: "Yes:No"
  npc_override_gef_fild04_quest_pupa_menu_yes_755efb: "Yes:No:I want to quit"
  npc_override_gef_fild04_quest_pupa_new_here_you_4d7fad: "New here are you?"
  npc_override_gef_fild04_quest_pupa_none_less_my_daughter_th_aa3c7e: "None-the-less my daughter thought it would be fun to gather pupa around this field and it's becoming unsightly."
  npc_override_gef_fild04_quest_pupa_oh_thank_you_so_much_fcb780: "Oh thank you so much."
  npc_override_gef_fild04_quest_pupa_ok_then_well_come_back_0e1574: "Ok then, well come back here if you change your mind."
  npc_override_gef_fild04_quest_pupa_please_return_me_when_yo_1cbb99: "Please return to me when you are a little stronger."
  npc_override_gef_fild04_quest_pupa_really_what_you_like_hel_c8760f: "Really? What would you like to do to help?"
  npc_override_gef_fild04_quest_pupa_remember_get_rid_those_p_81c5e4: "Remember, get rid of 100 of those Pupa from the field."
  npc_override_gef_fild04_quest_pupa_remember_get_rid_those_p_85e3ab: "Remember, get rid of 50 of those Pupa from the field."
  npc_override_gef_fild04_quest_pupa_remember_get_rid_those_p_9967d1: "Remember, get rid of 150 of those Pupa from the field."
  npc_override_gef_fild04_quest_pupa_thank_you_so_much_093766: "Thank you so much!"
  npc_override_gef_fild04_quest_pupa_well_look_i_like_helping_af3806: "Well look, I like helping new faces around here."
  npc_override_gef_fild04_quest_pupa_you_collect_chrysalis_re_2b6f53: "Can you collect ^00CE0025 Chrysalis^000000 and return them to me, I promise to reward you well."
  npc_override_gef_fild04_quest_pupa_you_could_probably_easil_b82a40: "You could probably easily help me out, but I want to give charity to those who are not as strong as you."
  npc_override_gef_fild04_quest_pupa_you_gotten_rid_pupa_5ab6d7: "Have you gotten rid of the Pupa?"
  npc_override_gef_fild04_quest_pupa_you_mind_helping_me_get_792ee6: "Do you mind helping me get rid of some Pupa to clear out this field?"
  npc_override_gef_fild04_quest_pupa_you_sure_you_want_stop_507e20: "Are you sure that you want to stop hunting?"
