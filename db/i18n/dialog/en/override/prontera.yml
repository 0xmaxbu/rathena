Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_prontera_clothing_buff_removal_come_back_me_if_you_2d0b91: "Come back to me, if you change your mind."
  npc_override_prontera_clothing_buff_removal_keep_d9f369: "Keep it"
  npc_override_prontera_clothing_buff_removal_removal_been_completed_m_fd6ef0: "Removal has been completed. Make sure you can move freely now."
  npc_override_prontera_clothing_buff_removal_while_looks_good_you_als_b8d4c7: "While it looks good on you, it can also get really annoying. I can get rid of it with a single hand gesture!! I will arrange it neatly. If you are ready, choose your option!"
  npc_override_prontera_clothing_buff_removal_you_unable_participate_b_d22703: "Are you unable to participate in battle because of clothing buffs? It has to be annoying."
  npc_override_prontera_enchan_arm_cards_gone_a67c9e: "and Cards will be GONE."
  npc_override_prontera_enchan_arm_case_enchantment_may_app_458464: "In that case, the Enchantment may be applied to an item which you didn't mean to Enchant. So just bring ^5555ffONE Armor^000000 you want enchanted to be safe..."
  npc_override_prontera_enchan_arm_enchanting_awesome_skill_19dfd9: "Enchanting is an awesome skill that infuses a mysterious status powers into the armor's hidden socket."
  npc_override_prontera_enchan_arm_existing_refine_level_ar_10b96a: "Existing Refine Level of the Armor"
  npc_override_prontera_enchan_arm_first_most_importantly_da4778: "First and most importantly."
  npc_override_prontera_enchan_arm_hmm_there_s_nothing_ench_c54c71: "Hmm? There's nothing to be enchanted!"
  npc_override_prontera_enchan_arm_however_you_keep_mind_if_61b8bc: "However, you have to keep in mind that if there are two armors of the same kind in your possession, the Enchantment will be applied in the order they are placed in your inventory."
  npc_override_prontera_enchan_arm_i_am_charge_enchanting_a_665341: "I am in charge of Enchanting Armors. Simply put, I've been studying ways to power-up armor."
  npc_override_prontera_enchan_arm_i_m_responsible_what_hap_cc4d7b: "I'm not responsible for what would happen if you have more than one of the same kind in your inventory."
  npc_override_prontera_enchan_arm_i_ve_been_studying_ways_a04325: "I've been studying ways to enhance an armor to maximize its capability."
  npc_override_prontera_enchan_arm_if_any_chance_you_want_b89ad0: "If by any chance, you would want to enchant your armor, bring me 400,000 zeny and the armor you want to enchant and you are all set to go."
  npc_override_prontera_enchan_arm_menu_hmm_665066: "Hmm... Let me think it over.:Go ahead."
  npc_override_prontera_enchan_arm_menu_non_400944: "Non Slotted Armor.:Slotted Armor.:High Grade Armor.:Maybe next time."
  npc_override_prontera_enchan_arm_now_you_nice_day_56ee4d: "Now you have a nice day."
  npc_override_prontera_enchan_arm_please_come_back_just_on_637071: "Please come back with just ONE equipment to be enchanted."
  npc_override_prontera_enchan_arm_please_come_back_when_yo_388598: "Please come back when you have any interest in enchanting your armor."
  npc_override_prontera_enchan_arm_quite_adventurer_huh_wel_bee83b: "Quite of an adventurer huh? Well, shall we?"
  npc_override_prontera_enchan_arm_requested_equipment_fail_6b511e: "The requested equipment has failed to enchant."
  npc_override_prontera_enchan_arm_socket_enchant_cost_you_ba1669: "Socket enchant will cost you 400,000 zeny. And there will be a random option enchanted. Of course, there is a chance of breaking your armor."
  npc_override_prontera_enchan_arm_sorry_you_don_t_enough_78a7df: "Sorry, but you don't have enough zeny."
  npc_override_prontera_enchan_arm_well_i_t_blame_you_462845: "Well, I can't blame you. Safety first, eh?"
  npc_override_prontera_enchan_arm_well_s_too_bad_d8c71e: "Well that's too bad."
  npc_override_prontera_enchan_arm_you_still_want_try_encha_1f22a0: "Do you still want to try an Enchant?"
  npc_override_prontera_enchan_illusion_dungeons_adventurer_you_illusion_6fdb68: "Adventurer, do you have ^0000cdIllusion Stones^000000? If you have a ^0000cdweapon, a piece armor^000000, or ^0000cdan accessory at Refining Level 9 or higher^000000, "
  npc_override_prontera_enchan_illusion_dungeons_ah_illusion_stones_truly_cae215: "Ah, Illusion Stones are truly mysterious..."
  npc_override_prontera_enchan_illusion_dungeons_ah_unfortunate_well_you_cb30bf: "Ah, that was unfortunate. Well, you can't always be lucky."
  npc_override_prontera_enchan_illusion_dungeons_alright_then_i_ll_add_d9b87b: "Alright, then I'll add you to my member list. I hope you'll have some Illusion equipment next time I see you."
  npc_override_prontera_enchan_illusion_dungeons_anyway_after_i_couldn_t_2e4782: "Anyway, after that, I couldn't find a way to go back."
  npc_override_prontera_enchan_illusion_dungeons_anyway_i_enchant_equipme_6627d6: "Anyway, I can enchant equipment that is exchanged for or purchased with Illusion Stones. I call them the Illusion equipment."
  npc_override_prontera_enchan_illusion_dungeons_as_material_you_bring_ex_c27506: "As a material, you can bring ^0000CDexisting equipment that have been refined to +9 or higher.^000000"
  npc_override_prontera_enchan_illusion_dungeons_as_you_may_guessed_your_c3a835: "As you may have guessed, your equipment will transform into something new after this."
  npc_override_prontera_enchan_illusion_dungeons_bear_wanting_459608: "[Bear Wanting {0}]"
  npc_override_prontera_enchan_illusion_dungeons_benefits_both_us_i_need_a8eeb8: "This benefits both of us. I need Illusion Stones for my studies, and you need powerful equipment for your adventures."
  npc_override_prontera_enchan_illusion_dungeons_benefits_both_us_let_me_5e0e24: "This benefits both of us. Let me know if you're interested in my proposition."
  npc_override_prontera_enchan_illusion_dungeons_best_all_illusion_equipm_a7c47f: "This is the best of all Illusion equipment. There's no technology available in this day and age that can enchant it. Even the most skilled enchanter can't do that."
  npc_override_prontera_enchan_illusion_dungeons_bring_piece_refined_equi_a0a552: "Bring ^0000cda piece of refined equipment, Illusion Stones^000000, and various materials that are only found in this place. I'll ^0000cdupgrade the equipment, weapon, armor, or accessory?^000000for you."
  npc_override_prontera_enchan_illusion_dungeons_cave_very_mysterious_i_m_afe0d7: "This cave is very mysterious, but I'm not strong enough to explore it by myself."
  npc_override_prontera_enchan_illusion_dungeons_come_back_if_interested_eded0a: "Come back if interested."
  npc_override_prontera_enchan_illusion_dungeons_conversation_cannot_proc_50b03f: "Conversation cannot proceed because you have too many items."
  npc_override_prontera_enchan_illusion_dungeons_course_we_re_giving_you_f812e1: "Of course, we're giving you new equipment, so don't forget that all the existing ^0000CDsmelting and enchantments^000000 will disappear."
  npc_override_prontera_enchan_illusion_dungeons_did_you_find_anything_yo_783cfc: "Did you find anything you liked? If you need anything, please let me know at any time."
  npc_override_prontera_enchan_illusion_dungeons_enchanting_never_fails_r_8b33af: "Enchanting never fails, but resetting sometimes failes. Even modern science can't change that."
  npc_override_prontera_enchan_illusion_dungeons_equipment_already_enchan_6238d1: "This equipment is already enchanted to the maximum limit."
  npc_override_prontera_enchan_illusion_dungeons_equipment_least_responds_0791b3: "This equipment at least responds positively to Illusion Stones, or it has the potential to be enchanted successfully."
  npc_override_prontera_enchan_illusion_dungeons_equipment_world_fantasti_b7f6ab: "This equipment is not from a world of fantastic illusions. I'm offended that you even showed it to me."
  npc_override_prontera_enchan_illusion_dungeons_every_good_thing_you_nee_fa30ef: "For every good thing you need another good thing."
  npc_override_prontera_enchan_illusion_dungeons_exchange_i_ll_improve_yo_7c800a: "In exchange, I'll improve your equipment."
  npc_override_prontera_enchan_illusion_dungeons_exchange_illusion_equipm_694653: "Exchange illusion equipment"
  npc_override_prontera_enchan_illusion_dungeons_explore_worlds_illusions_a9ede5: "Explore the worlds of illusions, collect Illusion Stones, and exchange them for equipment. I can enchant the equipment for you."
  npc_override_prontera_enchan_illusion_dungeons_first_let_me_tell_you_93f662: "First, let me tell you that I can only enchant certain types of Illusion equipment."
  npc_override_prontera_enchan_illusion_dungeons_get_them_me_i_ll_359e59: "Get them for me, and I'll improve your equipment in exchange. Just so you know, I can only improve certain types."
  npc_override_prontera_enchan_illusion_dungeons_he_no_sense_when_comes_1aeb8e: "(He has no sense when it comes to names.)"
  npc_override_prontera_enchan_illusion_dungeons_hello_if_you_rare_materi_9c854d: "Hello. If you have rare materials from this place, I can enhance your equipment."
  npc_override_prontera_enchan_illusion_dungeons_here_we_re_getting_resea_ec5c72: "Here, we're getting research materials from adventurers with {0}, and I'm offering enhanced equipment instead."
  npc_override_prontera_enchan_illusion_dungeons_how_much_you_charge_aa436b: "How much do you charge?"
  npc_override_prontera_enchan_illusion_dungeons_i_came_ruined_village_b7de3d: "I came to the ruined village,"
  npc_override_prontera_enchan_illusion_dungeons_i_didn_t_know_here_fa040f: "I didn't know it was here!"
  npc_override_prontera_enchan_illusion_dungeons_i_don_t_any_s_68425b: "I don't have any {0}s!"
  npc_override_prontera_enchan_illusion_dungeons_i_don_t_care_about_0128c9: "I don't care about trends."
  npc_override_prontera_enchan_illusion_dungeons_i_don_t_know_i_82b5fb: "I don't know but I want some!"
  npc_override_prontera_enchan_illusion_dungeons_i_don_t_know_why_f91bce: "I don't know why...!"
  npc_override_prontera_enchan_illusion_dungeons_i_enchant_illusion_equip_2e464c: "I can enchant Illusion equipment."
  npc_override_prontera_enchan_illusion_dungeons_i_feel_like_i_m_8a584d: "I feel like I'm going crazy."
  npc_override_prontera_enchan_illusion_dungeons_i_hope_you_like_6326cc: "I hope you like it."
  npc_override_prontera_enchan_illusion_dungeons_i_ll_come_back_later_19e43d: "I'll come back later."
  npc_override_prontera_enchan_illusion_dungeons_i_ll_help_you_if_214380: "I'll help you if you get a lot here."
  npc_override_prontera_enchan_illusion_dungeons_i_ll_try_enchant_ability_2c0431: "I'll try to enchant the {0} ability for your item. ^ff0000Its existing Refining level and cards will not be damaged. It will not be destroyed, even if this attempt fails.^000000 Do you want to continue?"
  npc_override_prontera_enchan_illusion_dungeons_i_m_chemist_specializing_0f6a70: "I'm a chemist specializing in the study of Illusion Stones, which have been circulating among adventurers."
  npc_override_prontera_enchan_illusion_dungeons_i_m_here_find_some_74dc89: "I'm here to find some Illusion Stones that I need for my research."
  npc_override_prontera_enchan_illusion_dungeons_i_m_one_who_researches_afb396: "I'm the one who researches {0} to enhance armors and weapons."
  npc_override_prontera_enchan_illusion_dungeons_i_m_overweight_i_d_50e3b6: "I'm overweight. I'd better lighten my bag first."
  npc_override_prontera_enchan_illusion_dungeons_i_m_selling_two_random_81c795: "I'm selling two random optional weapon grant scrolls that I made myself. You can choose the payment method you like."
  npc_override_prontera_enchan_illusion_dungeons_i_m_working_how_use_84d293: "I'm working on how to use an {0} to strengthen equipment."
  npc_override_prontera_enchan_illusion_dungeons_i_need_illusion_stones_s_67063c: "And I need ^0000FFIllusion Stones and some other materials^000000 to upgrade your equipment."
  npc_override_prontera_enchan_illusion_dungeons_i_need_some_other_materi_c85e3c: "And I need some ^0000CD{0} and other materials.^000000"
  npc_override_prontera_enchan_illusion_dungeons_i_only_know_they_re_bf3bae: "I only know they're rare and can only be found in some special places, and I'm here to collect them for my clients."
  npc_override_prontera_enchan_illusion_dungeons_i_proposition_you_i_want_a84ec5: "I have a proposition for you. I want some materials that can only be found in this place."
  npc_override_prontera_enchan_illusion_dungeons_i_think_i_met_girl_d46638: "I think I met a girl..."
  npc_override_prontera_enchan_illusion_dungeons_i_ve_also_rolled_up_6b4f68: "I've also rolled up my sleeves for the adventurers who work hard for the village. Can I make your equipment stronger? Is there anything on the list you want?"
  npc_override_prontera_enchan_illusion_dungeons_i_ve_decided_stick_aroun_2b80f5: "I've decided to stick around for a little while. Figured I'd be safe so long as I stay close to this soldier."
  npc_override_prontera_enchan_illusion_dungeons_i_went_go_place_where_086306: "I went to go to the place where {0} was found, and I barely got back.."
  npc_override_prontera_enchan_illusion_dungeons_if_you_give_me_i_bfc606: "If you give me an {0}, I'll do something nice for you!"
  npc_override_prontera_enchan_illusion_dungeons_if_you_give_me_some_7e0d55: "If you give me some equipment and some materials, I'll exchange them for my reinforced equipment."
  npc_override_prontera_enchan_illusion_dungeons_if_you_go_there_could_f09d00: "If you go in there, could you procure some things for me?"
  npc_override_prontera_enchan_illusion_dungeons_if_you_materials_i_need_9a394a: "If you have the materials I need for my research, wouldn't you hand them over?"
  npc_override_prontera_enchan_illusion_dungeons_if_you_re_interested_how_a9e591: "If you're interested, how'd you like to get a membership for my service? You can get discounts that way!"
  npc_override_prontera_enchan_illusion_dungeons_if_you_re_interested_we_f9e5f9: "If you're interested, we can discuss the details of our bargain."
  npc_override_prontera_enchan_illusion_dungeons_if_you_want_refine_your_8efa02: "If you want to refine your equipment, then go to the <NAVI>Illusion Enchanter<INFO>prontera,90,115,000,0,</INFO></NAVI> near the Town Office."
  npc_override_prontera_enchan_illusion_dungeons_if_you_want_well_bring_420a91: "If you want to do well, bring equipment refined to ^ff0000+9 or higher. It'll all disappear... haha?^000000"
  npc_override_prontera_enchan_illusion_dungeons_illusion_stones_1ff140: "Illusion Stones?"
  npc_override_prontera_enchan_illusion_dungeons_item_requires_you_don_t_956aed: "This item requires {0} {1}, and you don't have all that I need from you."
  npc_override_prontera_enchan_illusion_dungeons_less_stronger_fe3713: "Less... stronger..."
  npc_override_prontera_enchan_illusion_dungeons_look_illusion_equipment_5d1b79: "Look at the illusion equipment"
  npc_override_prontera_enchan_illusion_dungeons_looking_some_materials_t_57d78b: "looking for some materials. Touched some strange light, and now I'm here."
  npc_override_prontera_enchan_illusion_dungeons_make_sure_you_re_equippe_beb6bf: "Make sure you're ^0000FFequipped with the item that you want to improve.^000000"
  npc_override_prontera_enchan_illusion_dungeons_make_sure_your_equipment_003017: "Make sure ^0000FFyour equipment is refined to at least +9^000000 before bringing it to me."
  npc_override_prontera_enchan_illusion_dungeons_makes_you_good_what_you_aeb1b8: "Makes you good with what you have!"
  npc_override_prontera_enchan_illusion_dungeons_melee_e00694: "Melee"
  npc_override_prontera_enchan_illusion_dungeons_my_clients_want_figure_o_493015: "My clients want to figure out what these stones are. They're paying me a lot of money,"
  npc_override_prontera_enchan_illusion_dungeons_no_i_don_t_even_acfc25: "No. I don't even know what Illusion equipment is."
  npc_override_prontera_enchan_illusion_dungeons_no_problem_come_back_if_5d4270: "No problem. Come back if you change your mind."
  npc_override_prontera_enchan_illusion_dungeons_oh_you_illusion_equipmen_73d5fa: "Oh, do you have Illusion equipment?"
  npc_override_prontera_enchan_illusion_dungeons_okay_6fb660: "Okay..."
  npc_override_prontera_enchan_illusion_dungeons_okay_let_me_know_if_e22d94: "Okay, but let me know if you change your mind."
  npc_override_prontera_enchan_illusion_dungeons_only_fully_enchanted_ite_2efb77: "Only fully enchanted items can be reset. Please enchant it twice, and if you still want to reset it, then bring it to me."
  npc_override_prontera_enchan_illusion_dungeons_oops_i_m_sorry_i_661154: "Oops, I'm sorry. I should've introduced myself first."
  npc_override_prontera_enchan_illusion_dungeons_other_teddy_bears_line_s_2f90e3: "The other teddy bears were in line, so I was in line too!"
  npc_override_prontera_enchan_illusion_dungeons_other_words_ll_lose_its_a5ef06: "In other words, ^4d4dffit'll lose its current Refining and Upgrade levels.^000000"
  npc_override_prontera_enchan_illusion_dungeons_other_words_ll_lose_its_bbc7b5: "In other words, ^0000FFIt'll lose its current refining levels, cards and enchantments.^000000"
  npc_override_prontera_enchan_illusion_dungeons_otherwise_i_t_evaluate_i_5cd8de: "Otherwise, I can't evaluate its condition."
  npc_override_prontera_enchan_illusion_dungeons_pick_item_you_want_i_12e9d7: "Pick an item you want. I'll tell you what I need."
  npc_override_prontera_enchan_illusion_dungeons_pick_item_you_want_i_dae2ea: "Pick an item you want and I'll tell you what I need."
  npc_override_prontera_enchan_illusion_dungeons_please_clean_up_your_inv_17999b: "Please clean up your inventory and try again."
  npc_override_prontera_enchan_illusion_dungeons_please_come_later_just_b_055641: "Please come later. Just bring the ingredients and I'll make it for you."
  npc_override_prontera_enchan_illusion_dungeons_purchase_zeny_b50e1b: "Purchase with Zeny."
  npc_override_prontera_enchan_illusion_dungeons_random_options_checked_e_8ece13: "^ff0000Random options are checked for that equipment. The equipment cannot be enchanted.^000000"
  npc_override_prontera_enchan_illusion_dungeons_reason_being_here_1ca99f: "Reason for being here"
  npc_override_prontera_enchan_illusion_dungeons_resetting_requires_diffe_1f82e9: "Resetting requires a different amount of Zeny depending on the success chance you choose. Select the menu if you'd like to see the available payment options."
  npc_override_prontera_enchan_illusion_dungeons_right_handed_weapon_e40340: "Right-handed Weapon"
  npc_override_prontera_enchan_illusion_dungeons_s_because_my_mood_i_7d93a0: "It's because of my mood. I'm human and it's not like you're mistaken."
  npc_override_prontera_enchan_illusion_dungeons_s_done_please_check_047eb1: "It's done. Please check."
  npc_override_prontera_enchan_illusion_dungeons_s_just_hard_get_5d9fba: "It's just hard to get.."
  npc_override_prontera_enchan_illusion_dungeons_s_minimum_requirement_my_589866: "That's the minimum requirement for my upgrade service to have any visible effects on your equipment."
  npc_override_prontera_enchan_illusion_dungeons_said_my_service_free_req_624460: "That said, my service is not for free. It requires a few Illusion Stones and Zeny."
  npc_override_prontera_enchan_illusion_dungeons_seems_illusion_stones_po_4cc017: "It seems Illusion Stones are a popular topic everywhere. Everyone wants to know about what they are."
  npc_override_prontera_enchan_illusion_dungeons_so_i_could_offer_adventu_916053: "so I could offer adventurers like you ^0000cdexpensive equipment in exchange for the stones^000000, and still fetch a profit."
  npc_override_prontera_enchan_illusion_dungeons_so_what_kind_weapon_you_b53c43: "So, what kind of weapon do you want?"
  npc_override_prontera_enchan_illusion_dungeons_so_what_you_want_6554aa: "So, what do you want?"
  npc_override_prontera_enchan_illusion_dungeons_so_you_want_reinforce_eq_58058e: "So, you want to reinforce the equipment you get. You're thorough. I like that!"
  npc_override_prontera_enchan_illusion_dungeons_strong_8a1948: "Strong!"
  npc_override_prontera_enchan_illusion_dungeons_sure_113540: "Sure!"
  npc_override_prontera_enchan_illusion_dungeons_teddy_bear_fc72af: "A teddy bear with an {0}!"
  npc_override_prontera_enchan_illusion_dungeons_their_atomic_structure_u_6a64c1: "and their atomic structure is unlike any mineral I've seen. *Blah Blah* ...Their chemical chains... *Blah Blah*"
  npc_override_prontera_enchan_illusion_dungeons_then_i_exchange_somethin_8d65c5: "then I can exchange it for something better at the cost of some Illusion Stones and other materials."
  npc_override_prontera_enchan_illusion_dungeons_there_many_types_so_take_04e250: "There are many types, so take your time. If you want something, I can enhance it right away."
  npc_override_prontera_enchan_illusion_dungeons_uh_oh_he_s_zoning_1cb272: "(Uh-oh, he's zoning out!)"
  npc_override_prontera_enchan_illusion_dungeons_up_sockets_enchanted_enc_51423c: "Up to 2 sockets can be enchanted, and enchanting each socket requires 5 Illusion Stones. You can reset enchanted Illusion equipment at any time."
  npc_override_prontera_enchan_illusion_dungeons_use_well_come_see_me_67137b: "Use it well and come see me later if you find more Illusion Stones! *Chuckle*"
  npc_override_prontera_enchan_illusion_dungeons_well_unless_he_s_willing_1ca96c: "Well, not unless he's willing to risk his mental and physical health."
  npc_override_prontera_enchan_illusion_dungeons_what_equipment_i_exchang_d39911: "What are the equipment I can exchange? Wait a minute. I'll let you know."
  npc_override_prontera_enchan_illusion_dungeons_what_illusion_stones_you_ed3d4c: "What are ^0000cdIllusion Stones^000000, you ask? Well... I don't think anyone knows exactly what they are."
  npc_override_prontera_enchan_illusion_dungeons_what_kind_effect_you_lik_7a305c: "What kind of effect would you like to add?"
  npc_override_prontera_enchan_illusion_dungeons_what_s_968841: "What are {0}s?"
  npc_override_prontera_enchan_illusion_dungeons_what_you_doing_here_74351b: "What are you doing here?"
  npc_override_prontera_enchan_illusion_dungeons_what_you_say_a2c9eb: "What do you say?"
  npc_override_prontera_enchan_illusion_dungeons_while_ago_adventurer_who_e1ba9b: "A while ago, an adventurer who passed through this place told me that a chemist in Prontera refines the Illusion equipment in exchange for Illusion Stones."
  npc_override_prontera_enchan_illusion_dungeons_who_knows_maybe_someday_6c9dea: "But who knows? Maybe someday you'll meet someone who is talented enough to handle this precious equipment."
