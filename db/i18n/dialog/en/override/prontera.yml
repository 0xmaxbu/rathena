Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_prontera_MemorialDay_2008_ah_thank_you_your_hard_1f1fe2: "Ah, thank you for your hard work you've brought all of them."
  npc_override_prontera_MemorialDay_2008_ah_you_fluffy_new_towel_7348b0: "Ah, you have fluffy new towel now I even put your name on it"
  npc_override_prontera_MemorialDay_2008_although_no_sculptured_m_071952: "-Although no sculptured marble should rise to their memory,-"
  npc_override_prontera_MemorialDay_2008_arthur_ashe_f7f062: "- Arthur Ashe -"
  npc_override_prontera_MemorialDay_2008_best_thing_giving_you_bo_dabccc: "A best thing would be giving you both of them, but..."
  npc_override_prontera_MemorialDay_2008_bring_me_fabric_fluffs_fbec2c: "Bring me ^FF000030 Fabric and 20 Fluffs^000000."
  npc_override_prontera_MemorialDay_2008_daniel_webster_03712f: "-Daniel Webster-"
  npc_override_prontera_MemorialDay_2008_don_t_come_crying_me_8ff6e2: "Don't come crying to me if someone decides to build a highway through your home!"
  npc_override_prontera_MemorialDay_2008_don_t_panic_a0daab: "Don't panic!"
  npc_override_prontera_MemorialDay_2008_douglas_adams_ac4bec: "- Douglas Adams.-"
  npc_override_prontera_MemorialDay_2008_excellent_you_ve_brought_9ae69b: "Excellent; you've brought them all."
  npc_override_prontera_MemorialDay_2008_fine_unprepared_cef8ed: "Fine, be unprepared!"
  npc_override_prontera_MemorialDay_2008_give_me_moment_d69717: "Give me a moment."
  npc_override_prontera_MemorialDay_2008_go_help_grast_then_come_ecfea6: "Go help Grast, and then come back."
  npc_override_prontera_MemorialDay_2008_go_plaque_o_clock_direct_3701d0: "Go to the plaque at 12 o'clock direction in Prontera for your journey!"
  npc_override_prontera_MemorialDay_2008_good_way_you_even_know_0f4705: "Good. By the way, do you even know what the towel is for?"
  npc_override_prontera_MemorialDay_2008_great_91bb26: "Great!"
  npc_override_prontera_MemorialDay_2008_hahaha_db0ba3: "Hahaha!"
  npc_override_prontera_MemorialDay_2008_hahahahahaha_cough_cough_e21b62: "HAHAHAHAHAHA!!!! cough cough"
  npc_override_prontera_MemorialDay_2008_here_s_gift_you_7815e2: "Here's the gift for you."
  npc_override_prontera_MemorialDay_2008_hey_yo_91d54c: "Hey, yo!"
  npc_override_prontera_MemorialDay_2008_hmm_i_think_you_need_d0fe4b: "Hmm, I think you need just a little bit more."
  npc_override_prontera_MemorialDay_2008_hmm_you_need_some_more_1dd6b2: "Hmm, you will need some more things still..."
  npc_override_prontera_MemorialDay_2008_how_you_like_test_your_96bf3d: "How do you like to test your luck, {0}?"
  npc_override_prontera_MemorialDay_2008_how_you_supposed_go_your_e46d0a: "How are you supposed to go on your trip without your towel!?"
  npc_override_prontera_MemorialDay_2008_i_crushed_all_items_toge_5a56c5: "I crushed all the items together into a more compact form for you."
  npc_override_prontera_MemorialDay_2008_i_hope_you_ll_learn_0cfcca: "I hope you'll learn a valuable lesson while gathering these materials."
  npc_override_prontera_MemorialDay_2008_i_hope_you_ll_remember_245f63: "I hope you'll remember your freedom and happiness are built on thousands of lives sacrificed in war."
  npc_override_prontera_MemorialDay_2008_i_like_give_you_small_5dd8af: "I like to give you a small gift for your service."
  npc_override_prontera_MemorialDay_2008_i_ll_waiting_your_return_979478: "I'll be waiting for your return."
  npc_override_prontera_MemorialDay_2008_i_m_so_glad_meet_bd04c5: "I'm so glad to meet someone who understands the meaning of Memorial Day."
  npc_override_prontera_MemorialDay_2008_i_may_gone_where_i_6f9149: "-I may not have gone where I intended to go,-"
  npc_override_prontera_MemorialDay_2008_i_provide_you_all_materi_12eb4e: "I can provide you all the materials."
  npc_override_prontera_MemorialDay_2008_i_think_i_ended_up_353385: "-but I think I have ended up where I needed to be.-"
  npc_override_prontera_MemorialDay_2008_i_told_you_go_speak_b6e19b: "I told you to go speak to Grast in Prontera!"
  npc_override_prontera_MemorialDay_2008_i_wonder_how_many_people_cbf8d8: "I wonder how many people remember them..."
  npc_override_prontera_MemorialDay_2008_if_i_provide_you_all_163746: "If I provide you all materials, however, I won't have to thank you for your service."
  npc_override_prontera_MemorialDay_2008_if_you_bring_me_material_fd6ced: "If you bring me the materials, I can make you a towel."
  npc_override_prontera_MemorialDay_2008_if_you_feel_too_burdened_6db0ec: "If you feel too burdened to gather them all,"
  npc_override_prontera_MemorialDay_2008_if_you_feel_too_burdened_bdbdd4: "If you feel too burdened to gather them all, I can provide you all the materials."
  npc_override_prontera_MemorialDay_2008_if_you_like_go_journey_93c5eb: "If you like to go on a journey to pay a tribute to Memorial Day, you should bring me some materials I ask."
  npc_override_prontera_MemorialDay_2008_if_you_like_pay_tribute_28abc4: "But if you like to pay a tribute to great soldiers, I will help you ready yourself."
  npc_override_prontera_MemorialDay_2008_if_you_think_just_anothe_77624c: "If you think this is just another holiday, I'm not going to waste my breath."
  npc_override_prontera_MemorialDay_2008_last_message_19465e: "-This is the last message.-"
  npc_override_prontera_MemorialDay_2008_let_s_dust_off_towel_919def: "'Let's dust it off with the towel.'"
  npc_override_prontera_MemorialDay_2008_life_like_grapefruit_5b61f4: "Life... is like a grapefruit."
  npc_override_prontera_MemorialDay_2008_listen_closely_6d97fd: "Listen closely."
  npc_override_prontera_MemorialDay_2008_mad_sago_lauds_appears_m_71bca5: "***Mad Sago Lauds appears to be muttering to himself***"
  npc_override_prontera_MemorialDay_2008_memorial_day_sad_yet_glo_997cd0: "Memorial Day is a sad and yet glorious day."
  npc_override_prontera_MemorialDay_2008_menu_i_362b44: "I guess so...:Are you crazy or something?"
  npc_override_prontera_MemorialDay_2008_menu_i_68501c: "I'll gather the rest.:Give me the materials."
  npc_override_prontera_MemorialDay_2008_menu_left_9bc81d: "Left hand.:Right hand."
  npc_override_prontera_MemorialDay_2008_menu_sure_df458f: "Sure.:No, I'm Busy."
  npc_override_prontera_MemorialDay_2008_mistake_think_you_solve_1bd80a: "It is a mistake to think you can solve any major problems just with potatoes."
  npc_override_prontera_MemorialDay_2008_msg_65f284: "42!"
  npc_override_prontera_MemorialDay_2008_must_what_lauds_talking_a2a47f: "'This must be what Lauds was talking about.'"
  npc_override_prontera_MemorialDay_2008_my_what_da433a: "My what?"
  npc_override_prontera_MemorialDay_2008_no_problem_i_ll_give_7dc3dc: "No problem; I'll give you all the supplies..."
  npc_override_prontera_MemorialDay_2008_nor_engraved_stone_bear_b880cc: "-nor engraved stone bear record of their deeds,-"
  npc_override_prontera_MemorialDay_2008_now_before_you_pay_tribu_424ca2: "Now before you can pay tribute to the fallen soldiers you must be properly equipped."
  npc_override_prontera_MemorialDay_2008_now_go_visit_plaque_o_47617a: "Now is to go visit the plaque at 12 o'clock direction in Prontera."
  npc_override_prontera_MemorialDay_2008_now_please_bring_all_the_0ac0d7: "Now, please bring all these materials to Lauds."
  npc_override_prontera_MemorialDay_2008_oh_i_see_i_guess_ad7c79: "Oh, I see. I guess you're quite busy nowadays, huh?"
  npc_override_prontera_MemorialDay_2008_oh_isn_t_towel_memory_eab3ac: "Oh, isn't that a Towel of Memory?"
  npc_override_prontera_MemorialDay_2008_oh_you_ve_brought_everyt_e24ecb: "Oh, you've brought everything I asked."
  npc_override_prontera_MemorialDay_2008_oh_you_ve_brought_materi_2a4e2d: "Oh, you've brought the materials I asked."
  npc_override_prontera_MemorialDay_2008_oh_you_ve_brought_them_3f975c: "Oh, you've brought them all."
  npc_override_prontera_MemorialDay_2008_okay_which_hand_you_like_476f59: "Okay, which hand would you like to pick?"
  npc_override_prontera_MemorialDay_2008_one_each_pet_incubator_f_9fb6ec: "^FF0000one of each Pet Incubator, Firecracker, Poring Doll and Bouquet"
  npc_override_prontera_MemorialDay_2008_one_each_red_potion_gree_fc6a30: "^FF0000one of each Red Potion, Green Potion, Awakening Potion, and Butteryfly Wing^000000."
  npc_override_prontera_MemorialDay_2008_one_each_trap_yggdrasil_f8f667: "^FF0000one of each Trap, Yggdrasil Leaf, Blue Gemstone, Crystal Mirror, Meat, and Carrot^000000."
  npc_override_prontera_MemorialDay_2008_oops_you_haven_t_brought_fc72cc: "Oops, you haven't brought all materials."
  npc_override_prontera_MemorialDay_2008_please_bring_me_one_each_3a57e3: "Please bring me ^FF0000one of each Trap, Yggdrasil Leaf, Blue Gemstone, Crystal Mirror, Meat, and Carrot.^000000"
  npc_override_prontera_MemorialDay_2008_please_bring_me_one_each_61b766: "Please bring me ^FF0000one of each Red Potion, Green Potion, Awakening Potion, and Butterfly Wing^000000."
  npc_override_prontera_MemorialDay_2008_please_bring_me_one_each_94884f: "Please bring me ^FF0000one of each Pet Incubator, Firecracker, Poring Doll, and Bouquet^000000."
  npc_override_prontera_MemorialDay_2008_please_bring_them_lauds_02d34b: "Please bring them to Lauds."
  npc_override_prontera_MemorialDay_2008_please_don_t_alarmed_eve_b62be9: "Please don't be alarmed even if he starts babbling."
  npc_override_prontera_MemorialDay_2008_please_give_them_me_than_30f80a: "Please give them to me. Thank you for your hard work, by the way."
  npc_override_prontera_MemorialDay_2008_please_make_sure_you_ll_ba7e15: "Please make sure you'll have to bring me"
  npc_override_prontera_MemorialDay_2008_please_make_sure_you_nee_0f9128: "Please make sure you need to bring me"
  npc_override_prontera_MemorialDay_2008_s_dusty_old_plaque_9273ce: "- It's a dusty old plaque.-"
  npc_override_prontera_MemorialDay_2008_s_good_idea_0ebfe8: "That's a good idea."
  npc_override_prontera_MemorialDay_2008_s_orange_squishy_few_pip_0393b6: "It's orange and squishy, and has a few pips in it, and some folks have half a one for breakfast."
  npc_override_prontera_MemorialDay_2008_s_very_important_date_fcee86: "It's a very important date!"
  npc_override_prontera_MemorialDay_2008_s_your_call_fbb58d: "It's your call, {0}."
  npc_override_prontera_MemorialDay_2008_say_how_you_like_go_9c4137: "Say, how do you like to go on a journey to pay a tribute to Memorial Day?"
  npc_override_prontera_MemorialDay_2008_say_you_learned_anything_6bc973: "Say, have you learned anything from the journey?"
  npc_override_prontera_MemorialDay_2008_seems_you_re_just_carryi_5fb0ea: "It seems you're just carrying it without understanding its meaning."
  npc_override_prontera_MemorialDay_2008_sigh_i_really_tell_you_2e25dd: "*Sigh* Do I really have to tell you again?!"
  npc_override_prontera_MemorialDay_2008_so_did_you_bring_towel_db766d: "So, did you bring the towel materials?"
  npc_override_prontera_MemorialDay_2008_stop_trying_give_me_your_f8b6a6: "Stop trying to give me your garbage!"
  npc_override_prontera_MemorialDay_2008_then_i_ll_waiting_your_dae1e3: "Then I'll be waiting for your return."
  npc_override_prontera_MemorialDay_2008_then_i_shall_make_you_dccd07: "Then I shall make you a Towel of Memory as I promised."
  npc_override_prontera_MemorialDay_2008_then_listen_me_carefully_66612a: "Then listen to me carefully."
  npc_override_prontera_MemorialDay_2008_there_point_story_tempor_80761e: "There was a point to this story, but it has temporarily escaped the chronicler's mind."
  npc_override_prontera_MemorialDay_2008_there_s_another_message_d6ec8a: "-There's another message.-"
  npc_override_prontera_MemorialDay_2008_there_you_go_19b809: "There you go."
  npc_override_prontera_MemorialDay_2008_there_you_go_b7b297: "There you go!"
  npc_override_prontera_MemorialDay_2008_they_last_batch_material_99ec5f: "They are the last batch of materials."
  npc_override_prontera_MemorialDay_2008_those_items_useful_me_al_4ba369: "Those items are not useful to me at all."
  npc_override_prontera_MemorialDay_2008_towel_about_most_massive_71c605: "A towel is about the most massively useful thing an adventurer can have."
  npc_override_prontera_MemorialDay_2008_true_heroism_remarkably_8b339f: "-True heroism is remarkably sober, very undramatic.-"
  npc_override_prontera_MemorialDay_2008_urge_serve_others_whatev_73e77a: "- but the urge to serve others at whatever cost. -"
  npc_override_prontera_MemorialDay_2008_urge_surpass_all_others_ae2d46: "-It is not the urge to surpass all others at whatever cost,-"
  npc_override_prontera_MemorialDay_2008_very_important_date_reme_d6cbb1: "A very important date to remember!"
  npc_override_prontera_MemorialDay_2008_very_important_know_what_eede2d: "It is very important to know what we're celebrating today, don't you think?"
  npc_override_prontera_MemorialDay_2008_way_he_had_unfortunate_a_94f7ad: "By the way, he had an unfortunate accident, and has kind of lost his mind."
  npc_override_prontera_MemorialDay_2008_what_d7df74: "What is this!?"
  npc_override_prontera_MemorialDay_2008_what_shame_you_should_go_9bec28: "What a shame! You should go speak to ^FF0000Grast in Prontera^000000."
  npc_override_prontera_MemorialDay_2008_what_these_they_aren_t_f41744: "What are these? They aren't enough?!"
  npc_override_prontera_MemorialDay_2008_what_why_you_giving_me_1d0981: "What? Why are you giving me your garbage!"
  npc_override_prontera_MemorialDay_2008_what_you_doing_there_f9a337: "What are you doing there!?"
  npc_override_prontera_MemorialDay_2008_what_you_mean_you_just_3ffa18: "What do you mean you were just there?"
  npc_override_prontera_MemorialDay_2008_what_you_still_doing_her_243233: "What are you still doing here?"
  npc_override_prontera_MemorialDay_2008_where_your_towel_845f9d: "Where is your towel!?"
  npc_override_prontera_MemorialDay_2008_without_your_towel_you_l_4e43b6: "Without your towel you will be lost!"
  npc_override_prontera_MemorialDay_2008_yet_their_remembrance_as_2796b1: "-yet will their remembrance be as lasting as the land they honored.-"
  npc_override_prontera_MemorialDay_2008_you_brought_materials_i_d42b6c: "Have you brought the materials I asked?"
  npc_override_prontera_MemorialDay_2008_you_know_what_day_ce083e: "Do you know what day it is!?"
  npc_override_prontera_MemorialDay_2008_you_ll_bring_me_more_421842: "You'll have to bring me more materials afterwards."
  npc_override_prontera_MemorialDay_2008_you_met_lauds_863fae: "Have you met Lauds?"
  npc_override_prontera_MemorialDay_2008_you_rue_day_f57af4: "^FF0000YOU WILL RUE THE DAY!^000000"
  npc_override_prontera_MemorialDay_2008_you_see_i_two_different_7e71a3: "You see, I have two different gifts in my each hand."
  npc_override_prontera_MemorialDay_2008_you_see_message_cleaned_2aaf2d: "- You see a message from the cleaned plaque.-"
  npc_override_prontera_MemorialDay_2008_you_should_going_plaque_a05e47: "You should be going to the plaque!"
  npc_override_prontera_MemorialDay_2008_you_thank_me_later_extra_0d8451: "You can thank me later for that extra service."
  npc_override_prontera_MemorialDay_2008_you_ve_selected_my_left_4bf142: "You've selected my left hand."
  npc_override_prontera_MemorialDay_2008_you_ve_selected_my_right_1a49ff: "You've selected my right hand."
  npc_override_prontera_RWC_2011_adios_d4c747: "ADIOS!"
  npc_override_prontera_RWC_2011_agent_muttered_something_aa0c80: "- Agent muttered something to himself. -"
  npc_override_prontera_RWC_2011_arrgg_you_ignoring_me_be_513eff: "Arrgg!! Are you ignoring me because I'm new? Usually people listen..."
  npc_override_prontera_RWC_2011_cannot_achieved_all_alon_b1ed00: "But this cannot be achieved all alone. Your friends will have a huge role in the competition."
  npc_override_prontera_RWC_2011_eventually_my_patience_r_92f73a: "But eventually, my patience and restrained personality motivated me to become an agent for RWC2011!"
  npc_override_prontera_RWC_2011_first_i_start_attaching_0d3258: "First, I will start attaching cards you found... I'll take the rest of cards tomorrow."
  npc_override_prontera_RWC_2011_good_luck_e80771: "Good Luck!"
  npc_override_prontera_RWC_2011_he_looks_you_imploring_e_e47a00: "- He looks at you with imploring eyes. -"
  npc_override_prontera_RWC_2011_he_thought_something_the_920c1f: "- He thought of something and then looked at your eyes. -"
  npc_override_prontera_RWC_2011_here_gifts_i_promised_le_c7eef4: "Here are the gifts I promised... Let's see..."
  npc_override_prontera_RWC_2011_his_brimming_small_eyes_bd9c91: "- His brimming small eyes seem to tell you something. ^FF0000Please talk to me again...^000000 -"
  npc_override_prontera_RWC_2011_his_twinkling_small_eyes_ebe57f: "- His twinkling small eyes seem to tell you something. ^FF0000Please talk to me again...^000000 -"
  npc_override_prontera_RWC_2011_huh_b1cd39: "... huh...?"
  npc_override_prontera_RWC_2011_i_afraid_being_attacked_55466b: "I was afraid of being attacked by monsters when attaching the blue cards for RWC2011 in the streets."
  npc_override_prontera_RWC_2011_i_am_adventurer_i_don_8aec77: "I am not an adventurer and I don't even know how to buy/sell things. Sometimes I'm just very happy to see adventurers. You know... I am just an ordinary boy."
  npc_override_prontera_RWC_2011_i_am_new_agent_8bcec3: "I am... a new agent."
  npc_override_prontera_RWC_2011_i_am_supposed_attach_blu_dcd09c: "I am supposed to attach blue cards with the letters RWC2011 all over the world to promote the event. But... but..."
  npc_override_prontera_RWC_2011_i_had_turned_off_light_7152aa: "I had turned off the light and was trying to get some sleep, then I saw this bright light through the window."
  npc_override_prontera_RWC_2011_i_m_just_saying_out_0e2707: "I'm just saying that out of concern for you. You need TWO ^FF0000Blue 1 Card^000000. It's \"2011\"... Got it?"
  npc_override_prontera_RWC_2011_i_must_keep_promoting_ev_2b568e: "I must keep on promoting the event so I want to ask you again~!"
  npc_override_prontera_RWC_2011_i_see_78d1e8: "...I see..."
  npc_override_prontera_RWC_2011_i_so_happy_i_couldn_ef3708: "I was so happy that I couldn't sleep! I would finally have a chance to meet lots of adventurers and get to know them."
  npc_override_prontera_RWC_2011_i_so_shocked_i_tried_a001dc: "I was so shocked, I tried to calm down and think... I had neither heard about nor seen any shining poring!"
  npc_override_prontera_RWC_2011_i_spend_my_life_suburb_ffa5c9: "I would spend my life in a suburb."
  npc_override_prontera_RWC_2011_i_still_lots_cards_find_3aaeb9: "I still have lots of cards to find so if you have time, please come back and help again."
  npc_override_prontera_RWC_2011_i_used_very_normal_boy_cd97d7: "I used to be a very normal boy in Morocc."
  npc_override_prontera_RWC_2011_if_i_ruin_promotion_i_879ab4: "If I ruin this promotion, I might lose the job and have to go back to where I used to live alone..."
  npc_override_prontera_RWC_2011_if_you_re_interested_fes_eb81a4: "If you're interested in this festival, start looking for friends you can trust!"
  npc_override_prontera_RWC_2011_if_you_see_golden_poring_a975b7: "If you see the Golden Poring, could you please find the precious blue cards for me?"
  npc_override_prontera_RWC_2011_it_0db04a: "It?"
  npc_override_prontera_RWC_2011_many_events_organized_rw_996eb7: "Many events are organized for RWC promotion every year."
  npc_override_prontera_RWC_2011_menu_ok_3955df: "Ok, I will help you!:How much money can you offer me?"
  npc_override_prontera_RWC_2011_menu_ok_ac1f8f: "Ok!:I'm busy now."
  npc_override_prontera_RWC_2011_menu_sure_e7724d: "Sure, let me hear it.:No, thank you."
  npc_override_prontera_RWC_2011_menu_what_e7052f: "What is RWC?:Are you a New Agent?:I don't care."
  npc_override_prontera_RWC_2011_mission_so_important_me_b81fe8: "This mission was so important to me,"
  npc_override_prontera_RWC_2011_mmmm_yet_we_re_short_b7dbb0: "Mmmm~ not yet? We're short-handed... Please help me."
  npc_override_prontera_RWC_2011_msg_93fcbf: "......"
  npc_override_prontera_RWC_2011_my_first_mission_people_73f0d0: "This is my first mission but people's reaction is not good."
  npc_override_prontera_RWC_2011_new_agent_looking_you_pi_e191ab: "- New Agent is looking at you with pitiable eyes. -"
  npc_override_prontera_RWC_2011_people_used_tell_me_sinc_63372b: "People used to tell me that since I was very shy."
  npc_override_prontera_RWC_2011_please_come_back_tomorro_fe4d7c: "Please come back tomorrow."
  npc_override_prontera_RWC_2011_please_help_me_out_my_4c2b52: "Please help me out!! My life is in your hands!"
  npc_override_prontera_RWC_2011_really_happened_f13fd0: "^FF0000It really happened!^000000"
  npc_override_prontera_RWC_2011_rwc_festival_where_those_91b2e3: "The RWC is the festival where those adventurers can compete with each other and find out who is the best!"
  npc_override_prontera_RWC_2011_s_much_please_keep_haha_3f5461: "It's not much but please keep it! Haha, we still have lots of cards to be found. I hope you can help me tomorrow as well."
  npc_override_prontera_RWC_2011_s_rwc_time_69e8da: "It's RWC time!"
  npc_override_prontera_RWC_2011_s_same_mission_as_before_f65a70: "It's the same mission as before."
  npc_override_prontera_RWC_2011_seems_you_ve_traveled_qu_d12970: "It seems you've traveled quite enough but you're not good with hearing the news around the world."
