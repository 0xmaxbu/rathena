Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_prontera_RWC_2011_adios_d4c747: "ADIOS!"
  npc_override_prontera_RWC_2011_agent_muttered_something_aa0c80: "- Agent muttered something to himself. -"
  npc_override_prontera_RWC_2011_arrgg_you_ignoring_me_be_513eff: "Arrgg!! Are you ignoring me because I'm new? Usually people listen..."
  npc_override_prontera_RWC_2011_cannot_achieved_all_alon_b1ed00: "But this cannot be achieved all alone. Your friends will have a huge role in the competition."
  npc_override_prontera_RWC_2011_eventually_my_patience_r_92f73a: "But eventually, my patience and restrained personality motivated me to become an agent for RWC2011!"
  npc_override_prontera_RWC_2011_first_i_start_attaching_0d3258: "First, I will start attaching cards you found... I'll take the rest of cards tomorrow."
  npc_override_prontera_RWC_2011_good_luck_e80771: "Good Luck!"
  npc_override_prontera_RWC_2011_he_looks_you_imploring_e_e47a00: "- He looks at you with imploring eyes. -"
  npc_override_prontera_RWC_2011_he_thought_something_the_920c1f: "- He thought of something and then looked at your eyes. -"
  npc_override_prontera_RWC_2011_here_gifts_i_promised_le_c7eef4: "Here are the gifts I promised... Let's see..."
  npc_override_prontera_RWC_2011_his_brimming_small_eyes_bd9c91: "- His brimming small eyes seem to tell you something. ^FF0000Please talk to me again...^000000 -"
  npc_override_prontera_RWC_2011_his_twinkling_small_eyes_ebe57f: "- His twinkling small eyes seem to tell you something. ^FF0000Please talk to me again...^000000 -"
  npc_override_prontera_RWC_2011_huh_b1cd39: "... huh...?"
  npc_override_prontera_RWC_2011_i_afraid_being_attacked_55466b: "I was afraid of being attacked by monsters when attaching the blue cards for RWC2011 in the streets."
  npc_override_prontera_RWC_2011_i_am_adventurer_i_don_8aec77: "I am not an adventurer and I don't even know how to buy/sell things. Sometimes I'm just very happy to see adventurers. You know... I am just an ordinary boy."
  npc_override_prontera_RWC_2011_i_am_new_agent_8bcec3: "I am... a new agent."
  npc_override_prontera_RWC_2011_i_am_supposed_attach_blu_dcd09c: "I am supposed to attach blue cards with the letters RWC2011 all over the world to promote the event. But... but..."
  npc_override_prontera_RWC_2011_i_had_turned_off_light_7152aa: "I had turned off the light and was trying to get some sleep, then I saw this bright light through the window."
  npc_override_prontera_RWC_2011_i_m_just_saying_out_0e2707: "I'm just saying that out of concern for you. You need TWO ^FF0000Blue 1 Card^000000. It's \"2011\"... Got it?"
  npc_override_prontera_RWC_2011_i_must_keep_promoting_ev_2b568e: "I must keep on promoting the event so I want to ask you again~!"
  npc_override_prontera_RWC_2011_i_see_78d1e8: "...I see..."
  npc_override_prontera_RWC_2011_i_so_happy_i_couldn_ef3708: "I was so happy that I couldn't sleep! I would finally have a chance to meet lots of adventurers and get to know them."
  npc_override_prontera_RWC_2011_i_so_shocked_i_tried_a001dc: "I was so shocked, I tried to calm down and think... I had neither heard about nor seen any shining poring!"
  npc_override_prontera_RWC_2011_i_spend_my_life_suburb_ffa5c9: "I would spend my life in a suburb."
  npc_override_prontera_RWC_2011_i_still_lots_cards_find_3aaeb9: "I still have lots of cards to find so if you have time, please come back and help again."
  npc_override_prontera_RWC_2011_i_used_very_normal_boy_cd97d7: "I used to be a very normal boy in Morocc."
  npc_override_prontera_RWC_2011_if_i_ruin_promotion_i_879ab4: "If I ruin this promotion, I might lose the job and have to go back to where I used to live alone..."
  npc_override_prontera_RWC_2011_if_you_re_interested_fes_eb81a4: "If you're interested in this festival, start looking for friends you can trust!"
  npc_override_prontera_RWC_2011_if_you_see_golden_poring_a975b7: "If you see the Golden Poring, could you please find the precious blue cards for me?"
  npc_override_prontera_RWC_2011_it_0db04a: "It?"
  npc_override_prontera_RWC_2011_many_events_organized_rw_996eb7: "Many events are organized for RWC promotion every year."
  npc_override_prontera_RWC_2011_menu_ok_3955df: "Ok, I will help you!:How much money can you offer me?"
  npc_override_prontera_RWC_2011_menu_ok_ac1f8f: "Ok!:I'm busy now."
  npc_override_prontera_RWC_2011_menu_sure_e7724d: "Sure, let me hear it.:No, thank you."
  npc_override_prontera_RWC_2011_menu_what_e7052f: "What is RWC?:Are you a New Agent?:I don't care."
  npc_override_prontera_RWC_2011_mission_so_important_me_b81fe8: "This mission was so important to me,"
  npc_override_prontera_RWC_2011_mmmm_yet_we_re_short_b7dbb0: "Mmmm~ not yet? We're short-handed... Please help me."
  npc_override_prontera_RWC_2011_msg_93fcbf: "......"
  npc_override_prontera_RWC_2011_my_first_mission_people_73f0d0: "This is my first mission but people's reaction is not good."
  npc_override_prontera_RWC_2011_new_agent_looking_you_pi_e191ab: "- New Agent is looking at you with pitiable eyes. -"
  npc_override_prontera_RWC_2011_people_used_tell_me_sinc_63372b: "People used to tell me that since I was very shy."
  npc_override_prontera_RWC_2011_please_come_back_tomorro_fe4d7c: "Please come back tomorrow."
  npc_override_prontera_RWC_2011_please_help_me_out_my_4c2b52: "Please help me out!! My life is in your hands!"
  npc_override_prontera_RWC_2011_really_happened_f13fd0: "^FF0000It really happened!^000000"
  npc_override_prontera_RWC_2011_rwc_festival_where_those_91b2e3: "The RWC is the festival where those adventurers can compete with each other and find out who is the best!"
  npc_override_prontera_RWC_2011_s_much_please_keep_haha_3f5461: "It's not much but please keep it! Haha, we still have lots of cards to be found. I hope you can help me tomorrow as well."
  npc_override_prontera_RWC_2011_s_rwc_time_69e8da: "It's RWC time!"
  npc_override_prontera_RWC_2011_s_same_mission_as_before_f65a70: "It's the same mission as before."
  npc_override_prontera_RWC_2011_seems_you_ve_traveled_qu_d12970: "It seems you've traveled quite enough but you're not good with hearing the news around the world."
  npc_override_prontera_RWC_2011_shining_poring_ate_all_b_3f8c1e: "It was a shining poring! And it ate all blue cards I had prepared in less than a second!"
  npc_override_prontera_RWC_2011_suddenly_window_broken_a_73b509: "Suddenly, the window was broken and it appeared!"
  npc_override_prontera_RWC_2011_thank_you_i_continue_wor_bf9afa: "Thank you!! I can continue working now. Nothing is impossible when we have great adventurers like you in this world!"
  npc_override_prontera_RWC_2011_thanks_last_time_5f8d37: "Thanks for the last time."
  npc_override_prontera_RWC_2011_thanks_last_time_we_stil_6208cf: "Thanks for the last time! We still have lots of cards to find. Could you help me out?"
  npc_override_prontera_RWC_2011_there_few_adventurers_mi_4fcf44: "There are few adventurers in Midgard whose lives are dedicated to battle, who never skip their training, live in seclusion, and are experts in their art."
  npc_override_prontera_RWC_2011_try_gather_blue_cards_ma_786bbb: "Try to gather blue cards and make the word, ^FF0000R W C 2 0 1 1 ^000000."
  npc_override_prontera_RWC_2011_try_gather_remaining_car_887bb7: "Try to gather remaining cards until you make the word, 'RWC2011'."
  npc_override_prontera_RWC_2011_wasn_t_dream_when_i_3b95a1: "But it wasn't a dream. When I woke up, I realized all the blue cards were gone..."
  npc_override_prontera_RWC_2011_what_you_looking_large_c_b03dc6: "What you are looking for are large cards with the letters ^FF0000RWC2011^000000. Some of them might already be digested though."
  npc_override_prontera_RWC_2011_wow_finally_s_season_we_8b3eb0: "Wow~ Finally!! It's the season we've all been waiting for!"
  npc_override_prontera_RWC_2011_wow_you_bring_light_my_6190a5: "Wow~ You bring light in my life again!"
  npc_override_prontera_RWC_2011_year_special_mission_bee_8b4a94: "And this year, a special mission has been entrusted to a new agent... myself!"
  npc_override_prontera_RWC_2011_yes_must_dream_s_conclus_ac9f04: "^FF0000Yes! It must be a dream!^000000 That's the conclusion I came up with and went back to sleep."
  npc_override_prontera_RWC_2011_you_decided_help_me_well_d202bd: "Have you decided to help me? Well, I will prepare some gifts. I'm sure you'll like them."
  npc_override_prontera_RWC_2011_you_gathered_all_cards_ef3d79: "Have you gathered all the cards?"
  npc_override_prontera_RWC_2011_you_know_what_37f73d: "And you know what?"
  npc_override_prontera_RWC_2011_you_like_listen_my_story_c72ac3: "Would you like to listen to my story?"
  npc_override_prontera_RWC_2011_you_must_new_adventurer_ad4012: "You must be a new adventurer. I will kindly explain it to you."
  npc_override_prontera_RWC_2011_you_serious_41017e: "Are you serious!?"
  npc_override_prontera_RWC_2011_you_too_many_items_pleas_b3fb2f: "You have too many items. Please make room in your inventory and come back."
  npc_override_prontera_RWC_2011_you_ve_come_again_4c7da8: "You've come again~"
  npc_override_prontera_christmas_2008_ah_971301: "Ah..."
  npc_override_prontera_christmas_2008_ah_cf07cb: "Ah!"
  npc_override_prontera_christmas_2008_ah_music_box_useful_065eaf: "Ah, a music box is useful."
  npc_override_prontera_christmas_2008_all_children_world_5c79e0: "For all of the children of this world!!!"
  npc_override_prontera_christmas_2008_all_over_world_blessed_t_deb3c1: "All over the world will be blessed tonight!"
  npc_override_prontera_christmas_2008_all_right_isn_t_wonderfu_be6b96: "All right! Isn't it wonderful?"
  npc_override_prontera_christmas_2008_all_right_we_start_make_76d41a: "All right! We can start to make our music box with crystal fragments."
  npc_override_prontera_christmas_2008_all_right_what_comes_you_854224: "All right, what comes to your mind when you think about Christmas?"
  npc_override_prontera_christmas_2008_all_right_you_re_cool_945703: "All right, you're cool!!"
  npc_override_prontera_christmas_2008_another_present_christma_ff6691: "Another present is a Christmas cake especially shaped like your name!"
  npc_override_prontera_christmas_2008_anyway_did_you_know_3f608b: "Anyway, did you know..."
  npc_override_prontera_christmas_2008_anyway_let_those_adventu_52cdb6: "Anyway let those adventurers try to catch him, I have a small game for you."
  npc_override_prontera_christmas_2008_anyway_thanks_lot_your_h_7de0af: "Anyway, thanks a lot for your help."
  npc_override_prontera_christmas_2008_anyway_you_bring_me_some_2b6688: "Anyway, can you bring me some stuff?"
  npc_override_prontera_christmas_2008_artist_louise_kim_1142c3: "Artist, Louise Kim!!!"
  npc_override_prontera_christmas_2008_artist_louise_kim_6e9e44: "By artist, Louise Kim!"
  npc_override_prontera_christmas_2008_as_i_heard_antonio_quite_11e272: "As I heard, this Antonio is quite different from before."
  npc_override_prontera_christmas_2008_aww_don_t_afraid_766c29: "Aww, don't be afraid."
  npc_override_prontera_christmas_2008_aww_maybe_next_time_bb46be: "Aww maybe next time..."
  npc_override_prontera_christmas_2008_bad_bad_5fbda3: "Bad! Bad!"
  npc_override_prontera_christmas_2008_bad_santa_ruins_us_good_bcf194: "A bad Santa ruins us good Santa's reputations!"
  npc_override_prontera_christmas_2008_blacksmith_hammers_trunk_b1606b: "Blacksmith hammers on trunk... and we shape the frame."
  npc_override_prontera_christmas_2008_breating_life_into_62753d: "Breating life into it!"
  npc_override_prontera_christmas_2008_careful_9a2d79: "Be careful!"
  npc_override_prontera_christmas_2008_caroller_s_hot_news_ha_799051: "Caroller's hot news! Ha!"
  npc_override_prontera_christmas_2008_carolling_s_good_8e9eaa: "Carolling! That's good!"
  npc_override_prontera_christmas_2008_cheer_goodwill_721f80: "-cheer and goodwill!-"
  npc_override_prontera_christmas_2008_christmas_comes_around_db1072: "Christmas comes around!"
  npc_override_prontera_christmas_2008_christmas_season_af98af: "In this Christmas season!!"
  npc_override_prontera_christmas_2008_come_me_later_if_you_f4f334: "Come to me later if you want to get the mission."
  npc_override_prontera_christmas_2008_count_your_blessings_sin_2e9810: "-Count your blessings and sing!-"
  npc_override_prontera_christmas_2008_did_you_bring_all_materi_fbc2e8: "Did you bring all the materials?"
  npc_override_prontera_christmas_2008_doesn_t_sound_cool_1053d6: "Doesn't that sound cool!?"
  npc_override_prontera_christmas_2008_don_t_cry_don_t_74dc06: "Don't cry, don't cry!"
  npc_override_prontera_christmas_2008_don_t_worry_about_missio_e8d70b: "Don't worry about this mission."
  npc_override_prontera_christmas_2008_don_t_worry_tastes_good_5e6ee5: "Don't worry, it tastes good."
  npc_override_prontera_christmas_2008_dye_grateful_hearts_a3f643: "-and dye it for grateful hearts.-"
  npc_override_prontera_christmas_2008_even_shirt_goes_5a00be: "-even the shirt goes in!-"
  npc_override_prontera_christmas_2008_every_year_adventurers_c_0828bc: "Every year, adventurers challenge to attack Antonio the fake Santa, but there's no way to catch up to him due to his hat and costume!"
  npc_override_prontera_christmas_2008_first_let_me_shuffle_up_0b21cb: "First let me shuffle up these cards... Ok!!!"
  npc_override_prontera_christmas_2008_furthermore_he_put_bad_m_201e73: "Furthermore, he has put bad magic on the gifts so that they become monsters!"
  npc_override_prontera_christmas_2008_gift_box_sounds_good_4c955a: "A gift box! That sounds good!"
  npc_override_prontera_christmas_2008_gift_boxes_all_right_49a2c6: "Gift boxes?! All right!"
  npc_override_prontera_christmas_2008_gift_boxes_been_changing_423d37: "The gift boxes have been changing into monsters since Antonio placed some magic on them, so the monsters ate up the crystal fragments!"
  npc_override_prontera_christmas_2008_go_brag_about_these_wond_e52df8: "Go brag about these wonderful clothes. There wouldn't be any without me, Louise Kim."
  npc_override_prontera_christmas_2008_go_please_f8d375: "Go on please!"
  npc_override_prontera_christmas_2008_good_e42ce7: "Good!"
  npc_override_prontera_christmas_2008_good_holiday_season_064a36: "Have a good holiday season!"
  npc_override_prontera_christmas_2008_good_job_thanks_playing_883f04: "Good job! Thanks for playing the card game with me!"
  npc_override_prontera_christmas_2008_guess_which_card_i_pick_79a3be: "Guess which card I pick and you're a winner!"
  npc_override_prontera_christmas_2008_he_isn_t_alone_anymore_843c5c: "And he isn't alone anymore... is what I heard..."
  npc_override_prontera_christmas_2008_he_seems_quite_resolved_4351b8: "He seems to be quite resolved with himself since he ran away from people before."
  npc_override_prontera_christmas_2008_he_stolen_my_gifts_as_92cbc0: "He has stolen my gifts, as well as attacked adventurers around Toy and Lutie field."
  npc_override_prontera_christmas_2008_her_great_skill_fd48ce: "-with her great skill.-"
  npc_override_prontera_christmas_2008_here_s_secret_5c7e69: "Here's a secret!"
  npc_override_prontera_christmas_2008_here_you_f51fb7: "Here you are."
  npc_override_prontera_christmas_2008_hey_boy_what_comes_mind_311a87: "Hey, boy! What comes to mind when"
  npc_override_prontera_christmas_2008_hey_girl_what_comes_mind_29b1dc: "Hey, girl! What comes to mind when"
  npc_override_prontera_christmas_2008_hey_loosers_05d871: "Hey loosers!"
  npc_override_prontera_christmas_2008_hey_we_treat_you_good_5db4e4: "Hey, we treat you good..."
  npc_override_prontera_christmas_2008_hey_you_what_comes_mind_49cc8c: "Hey! You! What comes to mind when you think about Christmas?"
  npc_override_prontera_christmas_2008_ho_ho_ho_what_good_b8b2c3: "Ho ho ho! What a good boy!"
  npc_override_prontera_christmas_2008_ho_ho_ho_what_good_f3d49e: "Ho ho ho! What a good girl!"
  npc_override_prontera_christmas_2008_hooked_needle_feb65a: "-with a hooked needle-"
  npc_override_prontera_christmas_2008_hotness_right_23ce03: "Hotness, right?"
  npc_override_prontera_christmas_2008_i_ain_t_envious_designer_4922a6: "I ain't envious of Designer Pierre."
  npc_override_prontera_christmas_2008_i_always_thought_about_h_6063f5: "I always thought about how boring Santa Claus is wearing a too boring costume."
  npc_override_prontera_christmas_2008_i_am_genius_world_1ee0ae: "I am a genius of the world."
  npc_override_prontera_christmas_2008_i_am_so_devastated_since_797efe: "I am so devastated, since the Singing Crystal has been the hope of many children around the villages."
  npc_override_prontera_christmas_2008_i_am_supposed_get_paid_a10973: "I am supposed to get paid well, however I will just let it be free, since this is Christmas!"
  npc_override_prontera_christmas_2008_i_bake_you_cake_i_5cfe23: "I can bake you a cake, and I can carve your name on the cake, if you want!"
  npc_override_prontera_christmas_2008_i_blessed_them_good_luck_b1610e: "I blessed them with good luck!"
  npc_override_prontera_christmas_2008_i_could_make_glamorous_s_30def4: "I could make a glamorous style for him!"
  npc_override_prontera_christmas_2008_i_give_you_small_gift_89ff85: "I will give you a small gift if you beat me!"
  npc_override_prontera_christmas_2008_i_got_them_f5cd31: "I got them!"
  npc_override_prontera_christmas_2008_i_know_we_good_controlli_3ead58: "I know that we are not good at controlling stuff, but our rewards are good, right?"
  npc_override_prontera_christmas_2008_i_louise_kim_am_generous_934b93: "I, Louise Kim, am generous enough to accept you next time."
  npc_override_prontera_christmas_2008_i_m_happy_see_you_c8b37a: "I'm happy to see you again."
  npc_override_prontera_christmas_2008_i_m_only_need_some_e40c10: "I'm only in need of some materials. Things that are beyond my ability..."
  npc_override_prontera_christmas_2008_i_m_picking_up_only_4c4067: "I'm picking up only one!"
  npc_override_prontera_christmas_2008_i_made_cake_shaped_like_50c0e1: "I made this cake shaped like your name!"
  npc_override_prontera_christmas_2008_i_once_made_costume_noto_e96373: "I once made a costume for the notorious figure Antonio!"
  npc_override_prontera_christmas_2008_i_show_you_my_limitless_37f270: "I will show you my limitless ability."
  npc_override_prontera_christmas_2008_i_stay_here_throughout_c_29fd52: "I will stay here throughout the Christmas season, just visit me when you change your mind."
  npc_override_prontera_christmas_2008_i_ve_been_waiting_when_64867a: "I've been waiting for this for when"
  npc_override_prontera_christmas_2008_if_you_bring_me_all_15c032: "If you were to bring me all the stuff, I would make you a wonderful costume, for free..."
  npc_override_prontera_christmas_2008_if_you_bring_me_all_af0565: "If you bring me all that stuff, I can make you a glamorous Santa costume."
  npc_override_prontera_christmas_2008_if_you_get_singing_cryst_511f11: "If you can get ^0000FFSinging Crystal Pieces^000000, give them to me please?"
  npc_override_prontera_christmas_2008_if_you_guess_right_times_34aa6a: "If you guess right 3 times out of 5, I will give you a gift."
  npc_override_prontera_christmas_2008_if_you_ve_been_little_432a76: "If you've been a little naughty this year I won't stuff your stockings with coal."
  npc_override_prontera_christmas_2008_if_you_win_over_santa_fdc84f: "If you win over Santa, you can get a gift. Would you go for it?"
  npc_override_prontera_christmas_2008_isn_t_amazing_71a82e: "Isn't it amazing?"
  npc_override_prontera_christmas_2008_isn_t_big_news_aa30c8: "Isn't that big news?"
  npc_override_prontera_christmas_2008_isn_t_easy_8a34b8: "Isn't that easy?"
  npc_override_prontera_christmas_2008_isn_t_thrilling_open_gif_5ce856: "Isn't it thrilling to open gifts over your head!!"
  npc_override_prontera_christmas_2008_jerk_antonio_broke_cryst_1f6581: "but that jerk Antonio broke the crystal!"
  npc_override_prontera_christmas_2008_jingle_all_way_6955fd: "jingle all the way!"
  npc_override_prontera_christmas_2008_jingle_bells_jingle_bell_053e93: "Jingle Bells! Jingle Bells! Jingle all the way!"
  npc_override_prontera_christmas_2008_jingle_bells_jingle_bell_97ae2e: "Jingle bells, jingle bells,"
  npc_override_prontera_christmas_2008_just_luck_a49533: "This is just luck."
  npc_override_prontera_christmas_2008_just_stay_there_every_ch_fe358b: "And just stay there, every Christmas, for your whole life?"
  npc_override_prontera_christmas_2008_last_step_732b12: "The last step...!"
  npc_override_prontera_christmas_2008_let_me_explain_how_play_36fb5c: "Let me explain how to play this game."
  npc_override_prontera_christmas_2008_let_me_try_again_54e80a: "Let me try again!!"
  npc_override_prontera_christmas_2008_let_s_care_about_others_0aa318: "Let's care about others around you on this Christmas season!"
  npc_override_prontera_christmas_2008_let_s_count_together_b6c4d0: "Let's count together!"
  npc_override_prontera_christmas_2008_let_s_delay_2463c8: "Let's not delay."
  npc_override_prontera_christmas_2008_let_s_get_started_754db3: "Let's get started!"
  npc_override_prontera_christmas_2008_let_s_see_0f3925: "Let's see!!"
  npc_override_prontera_christmas_2008_light_weight_fashionable_acd462: "Light-weight, fashionable, and keeps you warm!"
  npc_override_prontera_christmas_2008_many_adventurers_try_cat_b5411d: "Many adventurers try to catch up to him, but he is not easy to catch."
