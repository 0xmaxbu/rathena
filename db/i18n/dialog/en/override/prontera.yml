  npc_override_prontera_xmas_rings_event_snoowy_s_sent_me_bird_7d8f0d: "Snoowy's sent me a bird with a message. She told me about your help..."
  npc_override_prontera_xmas_rings_event_thaank_yoouu_magic_ring_e7f978: "Thaank yoouu! Have this magic ring!"
  npc_override_prontera_xmas_rings_event_thank_you_here_s_my_a0b4fa: "Thank you! Here's my li'l something for you!"
