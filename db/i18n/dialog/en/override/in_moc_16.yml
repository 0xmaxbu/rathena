Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_in_moc_16_assassin_abandon_ego_6f08de: "to abandon the ego."
  npc_override_in_moc_16_assassin_abandon_such_worldly_2e4a9f: "to abandon such worldly"
  npc_override_in_moc_16_assassin_about_assassin_skills_edb87c: "about Assassin skills."
  npc_override_in_moc_16_assassin_about_you_huey_95ebfc: "about you, Huey?"
  npc_override_in_moc_16_assassin_above_all_else_we_value_680f02: "Above all else, we value our dignity. We're Assassins, after all and people will need us."
  npc_override_in_moc_16_assassin_ah_yeah_5f5e35: "Ah yeah..."
  npc_override_in_moc_16_assassin_all_a10e81: "Is that all...?"
  npc_override_in_moc_16_assassin_all_assassins_must_respe_46a23e: "All Assassins must respect the enemies they slay, the blood that they spill, and above all, maintain their sense of dignity!"
  npc_override_in_moc_16_assassin_all_depends_your_mind_an_7cdbac: "It all depends on your mind. Any place could be the best to level up according to your mind state."
  npc_override_in_moc_16_assassin_all_huey_2e2748: "That is all, Huey."
  npc_override_in_moc_16_assassin_all_if_you_re_sure_f22145: "all that? If you're sure of your ability as a Thief, you won't have to worry."
  npc_override_in_moc_16_assassin_along_keeping_your_pride_3f768c: "Along with keeping your pride,"
  npc_override_in_moc_16_assassin_alright_6ceaec: "Alright..."
  npc_override_in_moc_16_assassin_alright_a5b0b1: "Alright!"
  npc_override_in_moc_16_assassin_alright_next_trial_test_fa474a: "Alright. This next trial will test your ability to quickly find your target."
  npc_override_in_moc_16_assassin_alright_thanks_c14873: "Alright, thanks."
  npc_override_in_moc_16_assassin_alright_then_3ea654: "Alright then."
  npc_override_in_moc_16_assassin_alright_then_4d6d9f: "Alright then,"
  npc_override_in_moc_16_assassin_also_make_your_attacks_p_c17543: "This will also make your attacks poison the enemy by chance. You can also use this skill to enchant the weapons of your party members..."
  npc_override_in_moc_16_assassin_although_i_am_heartless_b7cd35: "Although I am heartless,"
  npc_override_in_moc_16_assassin_although_i_trust_you_now_a63bff: "Although I do not trust you for now, I will give you a chance..."
  npc_override_in_moc_16_assassin_although_looks_too_mello_a31eda: "Although {0} looks too mellow and gentle, kind of like a pussycat, {1} has the stuff."
  npc_override_in_moc_16_assassin_although_s_used_7ab358: "Although it's used,"
  npc_override_in_moc_16_assassin_although_skills_circumst_f3f0a0: "Although skills can have circumstantial applications, I will tell you about the basic concepts."
  npc_override_in_moc_16_assassin_among_following_skills_w_bdac5f: "6. Among the following skills, which allows you to walk while invisible?"
  npc_override_in_moc_16_assassin_and_f0fa6b: "And..."
  npc_override_in_moc_16_assassin_anonymous_one_126527: "The Anonymous One"
  npc_override_in_moc_16_assassin_anonymous_one_aee888: "the Anonymous One."
  npc_override_in_moc_16_assassin_answer_my_questions_corr_81ad45: "answer my questions correctly. Very difficult questions that only an Assassin can answer."
  npc_override_in_moc_16_assassin_appreciate_them_caring_a_c3a8d3: "Appreciate them for caring about you, even when you're alone."
  npc_override_in_moc_16_assassin_aren_t_you_scared_you_a88dc6: "Aren't you scared that you can't see me? I could kill you at any time and it would be so easy..."
  npc_override_in_moc_16_assassin_as_assassin_find_job_you_6d82a8: "As an Assassin, find a job that you can do for them without them knowing.."
  npc_override_in_moc_16_assassin_as_far_as_i_know_fd2ce8: "As far as I know, a Goblin carrying a hammer possesses the Earth property. Keep in mind that Fire overcomes the Earth property."
  npc_override_in_moc_16_assassin_as_i_told_you_before_003d3b: "But, as I told you before, we have comrades. I recommend having at least one comrade to back up you when you're on a mission."
  npc_override_in_moc_16_assassin_as_long_as_you_stick_7f8192: "As long as you stick close to the shadows, by walls and things like that, Cloaking will hide you from sight perfectly! Unless some bastard uses a certain detecting skill, you know."
  npc_override_in_moc_16_assassin_as_you_ve_been_told_6b176a: "As you've been told before, find and only kill monsters named 'Job change target!'"
  npc_override_in_moc_16_assassin_assassin_aren_t_you_23a1e4: "an Assassin, aren't you?"
  npc_override_in_moc_16_assassin_assassin_equals_2d9d90: "an Assassin equals"
  npc_override_in_moc_16_assassin_assassin_s_pride_7dea89: "An Assassin's pride..."
  npc_override_in_moc_16_assassin_assassins_agility_agi_mo_db05bd: "For Assassins, Agility, or AGI, is the most important stat."
  npc_override_in_moc_16_assassin_assassins_as_much_ea0d2f: "of Assassins as much"
  npc_override_in_moc_16_assassin_assassins_don_t_toy_arou_448a6f: "Assassins don't toy around. We are not into a style or trend, and we never will be."
  npc_override_in_moc_16_assassin_attachments_d40e38: "attachments..."
  npc_override_in_moc_16_assassin_bad_all_0e9921: "Not bad at all."
  npc_override_in_moc_16_assassin_bad_you_fulfilled_our_re_3b5b73: "Not bad. You fulfilled our requirements. Not bad at all. Now are you done filling out the form?"
  npc_override_in_moc_16_assassin_because_you_re_required_8bffa6: "Because you're required to perfectly hide yourself to use this skill, you must first learn Level 2 Cloaking before you can learn Grimtooth."
  npc_override_in_moc_16_assassin_become_undetectable_only_009ffb: "To become undetectable can only be done by the greatest Assassins!"
  npc_override_in_moc_16_assassin_beholder_what_11b0ca: "'Beholder,' what"
  npc_override_in_moc_16_assassin_being_assassin_means_ea6377: "Being an Assassin means"
  npc_override_in_moc_16_assassin_being_assassin_never_mak_f35334: "Being an Assassin never makes you a different person. And don't rely on chance."
  npc_override_in_moc_16_assassin_best_luck_faae4f: "Best of luck~"
  npc_override_in_moc_16_assassin_best_luck_you_22d6c8: "best of luck to you!"
  npc_override_in_moc_16_assassin_blocked_e41938: "is blocked."
  npc_override_in_moc_16_assassin_bwahahahahaha_8cd765: "Bwahahahahaha!"
  npc_override_in_moc_16_assassin_bwahahahahahah_c27408: "Bwahahahahahah!"
  npc_override_in_moc_16_assassin_cannot_cute_pet_c5e419: "cannot be a Cute Pet?"
  npc_override_in_moc_16_assassin_careful_lest_you_become_855dc4: "Be careful lest you become one of them once you become an Assassin. The responsibility rests solely on your shoulders..."
  npc_override_in_moc_16_assassin_challenge_f7f6a6: "a challenge?"
  npc_override_in_moc_16_assassin_choose_card_affect_agi_s_01668b: "5. Choose a card that does not affect the AGI stat."
  npc_override_in_moc_16_assassin_choose_card_typically_be_8339f5: "10. Choose a card that would typically benefit an Assassin the least."
  npc_override_in_moc_16_assassin_choose_condition_unrelat_6b6c60: "7. Choose the condition that is unrelated to Venom Splasher."
  npc_override_in_moc_16_assassin_choose_correct_amount_ma_1d75a5: "1. Choose the correct amount of the maximum dodge rate increase from the 'Increase Dodge' skill when at level 10."
  npc_override_in_moc_16_assassin_choose_correct_specialty_daff33: "6. Choose the correct specialty of the Assassin class."
  npc_override_in_moc_16_assassin_choose_group_weapons_can_1893ec: "3. Choose a group of weapons that cannot be used by an Assassin at once."
  npc_override_in_moc_16_assassin_choose_item_assassin_can_b5722c: "8. Choose the item that an Assassin cannot equip."
  npc_override_in_moc_16_assassin_choose_job_change_item_t_b58be3: "9. Choose the job change item for Thief."
  npc_override_in_moc_16_assassin_choose_maximum_agi_bonus_1d35f2: "7. Choose the maximum AGI bonus an Assassin can get at job level 50."
  npc_override_in_moc_16_assassin_choose_monster_f5dff9: "10. Choose the monster"
  npc_override_in_moc_16_assassin_choose_monster_fire_prop_a3b71f: "7. Choose a monster that Fire property Daggers work the best on."
  npc_override_in_moc_16_assassin_choose_monster_which_det_9b143f: "2. Choose a monster which detects hiding/cloaking Thieves and Assassins."
  npc_override_in_moc_16_assassin_choose_skill_required_le_e3d6fb: "1. Choose skill that is not required to learn Grimtooth."
  npc_override_in_moc_16_assassin_choose_town_where_thieve_cf162a: "4. Choose the town where Thieves can change their jobs."
  npc_override_in_moc_16_assassin_choose_weapon_which_kata_4c0fea: "4. Choose the weapon which is not in the Katar class."
  npc_override_in_moc_16_assassin_city_desert_i_miss_my_2337f2: "City of desert... I miss my hometown, Morocc. I haven't been there for a long time. I feel like I became a Thief a few days ago. Time flies so fast..."
  npc_override_in_moc_16_assassin_come_back_when_b665df: "But come back when"
  npc_override_in_moc_16_assassin_come_closer_i_prefer_tal_810933: "Come closer. I prefer to talk to people face to face. It really irritates me if I have to raise my voice, just so you can hear me."
  npc_override_in_moc_16_assassin_comrades_whom_you_die_050828: "Comrades for whom you would die for..."
  npc_override_in_moc_16_assassin_could_use_break_c5b8b1: "could use a break..."
  npc_override_in_moc_16_assassin_course_damage_affected_s_2d5eb1: "Of course, the damage is affected by STR and weapon damage. You'll understand how this skill works when you reach Level 4 Katar Mastery."
  npc_override_in_moc_16_assassin_damn_you_look_like_you_9981ff: "Damn...! You look like you're in a lot of pain. ^666666*Sigh*^000000 Give me a second, let me try to restore your HP and SP..."
  npc_override_in_moc_16_assassin_decent_e89c3b: "is decent."
  npc_override_in_moc_16_assassin_did_other_assassins_tell_307e8f: "Did other Assassins tell you that...?"
  npc_override_in_moc_16_assassin_did_you_finish_form_alri_7beeb4: "Did you finish the form? Alright, go ahead and give it to me. Give me a second and I'll transport you to the Test Hall."
  npc_override_in_moc_16_assassin_did_you_hear_anonymous_o_188118: "Did you hear that Anonymous one?! 'I beg you, give me hints.' Hahahah!"
  npc_override_in_moc_16_assassin_didn_t_you_just_1995f3: "Didn't you just"
  npc_override_in_moc_16_assassin_don_t_act_recklessly_afe4f7: "Don't act recklessly..."
  npc_override_in_moc_16_assassin_don_t_force_yourself_too_68af28: "Don't force yourself too much."
  npc_override_in_moc_16_assassin_don_t_forget_6b8f13: "Don't forget..."
  npc_override_in_moc_16_assassin_done_filling_out_89921c: "done filling it out."
  npc_override_in_moc_16_assassin_door_next_room_coordinat_f70094: "The door to the next room, at coordinates 87 137, has opened."
  npc_override_in_moc_16_assassin_double_attack_haven_t_yo_5e5420: "Double attack ...Haven't you tried it? It allows you to attack an enemy twice at a time."
  npc_override_in_moc_16_assassin_double_attack_need_c3b178: "Double Attack need?"
  npc_override_in_moc_16_assassin_drops_slotted_jur_c75ee4: "drops a slotted Jur?"
  npc_override_in_moc_16_assassin_drops_slotted_katar_209337: "drops a slotted Katar?"
  npc_override_in_moc_16_assassin_eager_travel_all_around_350985: "Eager to travel all around the world, I hope your real identity is found in your journeys..."
  npc_override_in_moc_16_assassin_eh_17ae65: "Eh?"
  npc_override_in_moc_16_assassin_eh_1aa004: "Eh...?!"
  npc_override_in_moc_16_assassin_eh_get_outta_here_d49718: "Eh, get outta here."
  npc_override_in_moc_16_assassin_ehhh_0933ae: "Ehhh?"
  npc_override_in_moc_16_assassin_enchant_poison_skill_all_18dbba: "The ^3355FFEnchant Poison^000000 skill allows you to enchant poison on the weapon you're using. This will temporarily give the weapon the Poison property."
  npc_override_in_moc_16_assassin_end_maze_627b47: "at the end of maze."
  npc_override_in_moc_16_assassin_endless_practice_893e33: "Endless Practice..."
  npc_override_in_moc_16_assassin_enough_kid_526470: "enough, kid."
  npc_override_in_moc_16_assassin_even_14cbaa: "Even on the"
  npc_override_in_moc_16_assassin_even_though_you_re_drive_a4177c: "Even though you're driven by personal revenge, I hope it will go away as you train..."
  npc_override_in_moc_16_assassin_even_though_you_re_enamo_f01197: "Even though you're enamored with Assassins superficially, I believe you will realize the real value of the Assassin job sooner or later."
  npc_override_in_moc_16_assassin_even_though_your_main_co_e945cb: "Even though your main concern for now is being a rich, I'm sure you'll pursue something even greater..."
  npc_override_in_moc_16_assassin_exploring_places_you_ve_2d0c14: "Exploring places you've never seen before. But know that being an Assassin never makes you a different person."
  npc_override_in_moc_16_assassin_fill_out_application_for_2fe909: "Fill out the application form with your name and job level."
  npc_override_in_moc_16_assassin_financial_reasons_i_won_181a44: "Financial reasons...? I won't deny that we all need money to live. But being Assassin means living for a higher purpose."
  npc_override_in_moc_16_assassin_first_all_grimtooth_skil_6d84c1: "First of all, Grimtooth is ...A skill specifically for the Katar. Therefore, it doesn't require any skills related to Dagger weapons."
  npc_override_in_moc_16_assassin_first_katar_mastery_skil_796bd7: "First, ^3355FFKatar Mastery^000000. This skill increases the damage of Katar class weapons. The higher the skill level, the more damage is increased."
  npc_override_in_moc_16_assassin_first_off_what_you_think_94f040: "First off, what do you think is the priority of an Assassin?"
  npc_override_in_moc_16_assassin_get_out_493749: "Get out!"
  npc_override_in_moc_16_assassin_girl_named_markie_aac0a5: "a girl named Markie?"
  npc_override_in_moc_16_assassin_gladius_69b332: "A Gladius..."
  npc_override_in_moc_16_assassin_go_651d5f: "go for it!"
  npc_override_in_moc_16_assassin_go_ahead_give_38b71e: "Go ahead and give"
  npc_override_in_moc_16_assassin_go_ask_khai_guy_who_937c67: "Go ask 'Khai,' the guy who takes care of your test application, maybe he will help you."
  npc_override_in_moc_16_assassin_good_choice_998be2: "Good choice!"
  npc_override_in_moc_16_assassin_good_choice_there_you_i_eb4b3a: "Good choice. There you are. I hope it will serve you well."
  npc_override_in_moc_16_assassin_good_idea_03f6d7: "Good idea..."
  npc_override_in_moc_16_assassin_good_idea_traveling_arou_f9318d: "Good idea. Traveling around the world will allow you to broaden your experiences."
  npc_override_in_moc_16_assassin_good_luck_703764: "Good luck."
  npc_override_in_moc_16_assassin_good_luck_8e30d6: "Good luck!"
  npc_override_in_moc_16_assassin_good_luck_e86318: "Good luck..."
  npc_override_in_moc_16_assassin_good_luck_out_there_38836c: "Good luck out there."
  npc_override_in_moc_16_assassin_good_one_examine_oneself_e32584: "It is good for one to examine oneself. I can understand that you will be excited by the great change in your ability."
  npc_override_in_moc_16_assassin_good_way_improve_yoursel_6e5ccc: "That is a good way to improve yourself. I've seen many people who know how to be strong physically but not in their mental state."
  npc_override_in_moc_16_assassin_great_e405de: "Great..."
  npc_override_in_moc_16_assassin_great_effort_bbb72f: "great effort."
  npc_override_in_moc_16_assassin_great_effort_cb4175: "great effort..."
  npc_override_in_moc_16_assassin_grimtooth_allows_you_att_740f15: "^3355FFGrimtooth^000000 allows you to attack enemies while hiding under the ground. As you master it, you'll be able to attack foes from a distance."
  npc_override_in_moc_16_assassin_grrrrr_c6ef2e: "Grrrrr..."
  npc_override_in_moc_16_assassin_guards_f65150: "...Guards!"
  npc_override_in_moc_16_assassin_haaahahahaha_8016e7: "Haaahahahaha!!!"
  npc_override_in_moc_16_assassin_hah_1bc943: "HAH!"
  npc_override_in_moc_16_assassin_haha_needs_body_sometime_a3ee93: "Haha, the needs of the body are sometimes hard to ignore. It's best to accept that part of human nature."
  npc_override_in_moc_16_assassin_hahahah_i_m_just_joking_5db4c1: "Hahahah~! I'm just joking, don't take it seriously. But I do need to check this necklace with the guildmaster first."
  npc_override_in_moc_16_assassin_hahahahah_a1573f: "Hahahahah~!"
  npc_override_in_moc_16_assassin_hahahahahahah_046978: "Hahahahahahah!"
  npc_override_in_moc_16_assassin_hard_stay_alive_43f706: "Is it that hard to stay alive?"
  npc_override_in_moc_16_assassin_having_problems_1cd1e9: "Having problems"
  npc_override_in_moc_16_assassin_heh_i_remember_my_thief_5ad0f4: "Heh. I remember my Thief quest. I was so damn nervous when I broke into the farm to get Mushrooms..."
  npc_override_in_moc_16_assassin_hell_you_e13fe5: "hell are you?"
  npc_override_in_moc_16_assassin_here_soon_905dd8: "be here soon."
  npc_override_in_moc_16_assassin_here_you_f51fb7: "Here you are."
  npc_override_in_moc_16_assassin_hey_don_t_too_hard_ccae19: "Hey, don't be too hard"
  npc_override_in_moc_16_assassin_hey_i_m_thomas_i_1c473d: "Hey, I'm Thomas. I'm in charge of testing your use of the hiding skill. Think you're up to it?"
  npc_override_in_moc_16_assassin_hey_i_remember_you_46a690: "Hey, I remember you~"
  npc_override_in_moc_16_assassin_hey_newbie_you_should_re_888ff1: "Hey Newbie. You should really get out of here as soon as you can. I can't guarantee your safety."
  npc_override_in_moc_16_assassin_hey_what_happened_how_co_09a5da: "Hey, what happened...? How come you didn't bring the ^006699Necklace of Oblivion^000000? You're supposed to carry that with you, so where is it?"
  npc_override_in_moc_16_assassin_hm_b88b2e: "...Hm."
  npc_override_in_moc_16_assassin_hm_bad_you_re_almost_43db3b: "Hm? Not bad. You're almost here."
  npc_override_in_moc_16_assassin_hm_you_a188fe: "Hm? You....?"
  npc_override_in_moc_16_assassin_hmm_8ee499: "Hmm."
  npc_override_in_moc_16_assassin_hmm_9c4d28: "Hmm..."
  npc_override_in_moc_16_assassin_hmm_i_like_your_attitude_967075: "Hmm. I like your attitude. You should keep your pride as a Thief. Sorry for laughing at your mistakes. I think you'll do better next time."
  npc_override_in_moc_16_assassin_hmm_if_you_re_exhausted_d7cf6e: "Hmm, if you're exhausted, I'm willing to bring you back. Of course, if you leave, you'll have to take the job test over again. So what do you want to do?"
  npc_override_in_moc_16_assassin_hmm_stats_bfe5c7: "Hmm, Stats..."
  npc_override_in_moc_16_assassin_hmm_well_okay_18ccf7: "Hmm. Well, okay."
  npc_override_in_moc_16_assassin_hmpf_40a0b0: "Hmpf."
  npc_override_in_moc_16_assassin_hmpf_if_you_really_don_aed51b: "Hmpf, if you really don't have a clue, I will give you a little advice."
  npc_override_in_moc_16_assassin_hmpf_now_time_test_your_6548ac: "Hmpf. It is now time to test your knowledge. You are not allowed to miss more than one question."
  npc_override_in_moc_16_assassin_ho_ho_ho_167696: "Ho ho ho..."
  npc_override_in_moc_16_assassin_ho_job_level_you_must_da2645: "Ho? Job Level {0}?! You must have been training really hard. The bosses will like that for sure..."
  npc_override_in_moc_16_assassin_honest_i_want_grant_you_8710db: "To be honest, I want to grant you the job change without any other condition. Too many pathetic people don't even have the basic knowledge to be Assassins..."
  npc_override_in_moc_16_assassin_how_come_you_re_here_ff828b: "How come you're in here...?"
  npc_override_in_moc_16_assassin_how_could_you_expect_ass_5fee13: "How could you expect to be an Assassin with this score? Keep training and come back when you're ready."
  npc_override_in_moc_16_assassin_how_dare_you_think_tryin_36035a: "How dare you think of trying to trick me with a fake! Are you stupid or what!? I should kill you..."
  npc_override_in_moc_16_assassin_how_hell_did_534869: "How the hell did"
  npc_override_in_moc_16_assassin_how_level_right_hand_mas_8c92f3: "3. How does Level 4 Right Hand Mastery work?"
  npc_override_in_moc_16_assassin_how_much_sp_4a245d: "9. How much SP does"
  npc_override_in_moc_16_assassin_how_you_understand_conce_893278: "How can you not understand the concept of dignity? You just showed some to me just now!"
  npc_override_in_moc_16_assassin_however_another_test_awa_6a0700: "However, another test awaits you. When you go inside the next area, you will receive your instructions..."
  npc_override_in_moc_16_assassin_however_if_you_don_t_05c928: "However, if you don't want to use two Daggers, you won't need this skill. You will see how 'Left Hand Mastery' works as soon as you reach 'Right Hand Mastery' Level 2."
  npc_override_in_moc_16_assassin_however_keep_mind_we_all_4f90ff: "However, keep in mind that we are not allowed to be emotionally attached. Carry out your duties without question. That is our way."
  npc_override_in_moc_16_assassin_however_what_reason_you_288090: "However, for what reason do you wish for more power? To show off? Personal revenge? For what purpose will you use this power?"
  npc_override_in_moc_16_assassin_huh_6ed1eb: "Huh."
  npc_override_in_moc_16_assassin_huh_80ee84: "Huh..."
  npc_override_in_moc_16_assassin_huh_a78e67: "Huh...?"
  npc_override_in_moc_16_assassin_huh_you_must_lot_self_aca455: "Huh. You must have a lot of self confidence to be a Thief nowadays."
  npc_override_in_moc_16_assassin_huh_you_re_qualified_bec_a730e4: "Huh. You're not qualified to become an Assassin yet. There are requirements you need to meet first, you know."
  npc_override_in_moc_16_assassin_hunt_a9e09c: "Hunt..."
  npc_override_in_moc_16_assassin_i_agree_e79cea: "I agree with"
  npc_override_in_moc_16_assassin_i_am_here_d7c94a: "I am here."
  npc_override_in_moc_16_assassin_i_am_here_test_your_e5ba39: "I am here to test your knowledge, as well as your capacity for heartlessness. Those are both necessary to become an Assassin."
  npc_override_in_moc_16_assassin_i_am_necessarily_cruel_b_ff51c1: "I am not necessarily cruel. Before we proceed, is there anything you wish to know?"
  npc_override_in_moc_16_assassin_i_am_perfectly_hidden_fca47c: "I am perfectly hidden!"
  npc_override_in_moc_16_assassin_i_apologize_0d2c2b: "I apologize for"
  npc_override_in_moc_16_assassin_i_apologize_laughing_you_17098c: "I apologize for laughing at you earlier. I want you to remember to keep that sense of pride and dignity as an Assassin."
  npc_override_in_moc_16_assassin_i_ask_khai_one_who_0796ee: "I would ask 'Khai,' the one who processed your application, for advice."
  npc_override_in_moc_16_assassin_i_believe_you_stand_out_089bc7: "I believe you stand out amongst them..."
  npc_override_in_moc_16_assassin_i_cannot_give_you_better_f45ec8: "I cannot give you better advice than that in regards to Stats. You should research and see which stats suit you, and decide what kind of Assassin you want to be."
  npc_override_in_moc_16_assassin_i_changed_my_mind_05272f: "I changed my mind!"
  npc_override_in_moc_16_assassin_i_don_t_think_i_3de5fc: "I don't think I like the way you're looking at me... Punk."
  npc_override_in_moc_16_assassin_i_don_t_think_you_2f0ef6: "I don't think you're going the right way."
  npc_override_in_moc_16_assassin_i_feel_irritated_when_so_e9ea09: "I feel irritated when somebody talks to me behind my back."
  npc_override_in_moc_16_assassin_i_feel_your_steps_near_35dae4: "I can feel your steps near me."
  npc_override_in_moc_16_assassin_i_guess_you_2908f4: "I guess you"
  npc_override_in_moc_16_assassin_i_hope_you_become_excell_8ea61c: "I hope you will become an excellent Assassin. And when you reach a certain level, you must guide newbies as your trainers have."
  npc_override_in_moc_16_assassin_i_hope_you_re_hypocrite_53a3c9: "I hope you're not a hypocrite. Spiritual discipline is the best way for you to survive."
  npc_override_in_moc_16_assassin_i_keep_watching_you_a03601: "...I will keep watching you."
  npc_override_in_moc_16_assassin_i_know_0cbf73: "I know it will"
  npc_override_in_moc_16_assassin_i_know_some_people_care_1101a3: "I know some people care only about their physical training, but"
  npc_override_in_moc_16_assassin_i_like_listen_your_opini_b962fc: "I would like to listen to your opinion of {0} for the job change test."
  npc_override_in_moc_16_assassin_i_ll_judge_dacb5a: "I'll be the judge of that!"
  npc_override_in_moc_16_assassin_i_ll_transport_you_6e4b68: "I'll transport you"
  npc_override_in_moc_16_assassin_i_look_forward_523bfc: "I look forward"
  npc_override_in_moc_16_assassin_i_m_allowed_give_you_c56d1e: "I'm not allowed to give you hints, I can tell you more about being an Assassin..."
  npc_override_in_moc_16_assassin_i_m_bit_worried_about_f819eb: "I'm a bit worried about you. I hope you realize that once you become an Assassin, there's no turning back..."
  npc_override_in_moc_16_assassin_i_m_bringing_you_back_35ecb2: "I'm bringing you back... *Sigh...*"
  npc_override_in_moc_16_assassin_i_m_going_give_you_40fe3a: "I'm going to give you a simple test. Please find your way through this maze and come to me. It is this maze that protects our guild from intruders."
  npc_override_in_moc_16_assassin_i_m_gonna_give_you_a5cf5f: "I'm not gonna give you any hints after all. Hee hee hee~"
  npc_override_in_moc_16_assassin_i_m_surprised_you_even_53280e: "I'm surprised that you were even able to become a Thief. Go away, and come back only when you know what the hell you're doing."
  npc_override_in_moc_16_assassin_i_once_knew_person_who_b91fed: "I once knew a person who had goals. Long ago, I met someone on assignment who wanted to keep from getting killed before becoming a level 54 knight."
  npc_override_in_moc_16_assassin_i_saw_your_resume_just_266639: "I saw your resume just now. You're well known as a Thief with guts. Rarely do we receive potential Assassins of your stature."
  npc_override_in_moc_16_assassin_i_see_fd141e: "I see..."
  npc_override_in_moc_16_assassin_i_see_you_re_carrying_536eef: "I see you're carrying a ^006699Necklace of Oblivion^000000... You want to become an Assassin, don't you? Let me check it..."
  npc_override_in_moc_16_assassin_i_see_you_want_use_87f500: "I see. You want to use both hands. Here, take your Main Gauche."
  npc_override_in_moc_16_assassin_i_sense_you_re_different_3de98a: "I sense that you're different than most people..."
  npc_override_in_moc_16_assassin_i_think_0596d6: "I think"
  npc_override_in_moc_16_assassin_i_think_you_what_takes_9b6c62: "I think you have what it takes. Is there a reason you want to be an Assassin?"
  npc_override_in_moc_16_assassin_i_thought_something_smel_249a26: "I thought something smelled funny. What's a servant of God doing in this place? You don't belong here."
  npc_override_in_moc_16_assassin_i_understand_why_their_p_4e1258: "I can understand why their pride and dignity would be so important to them. Now, for what reason do you wish to become an Assassin?"
  npc_override_in_moc_16_assassin_i_ve_always_wanted_frog_1e7786: "I've always wanted a frog as a pet. But it's impossible!"
  npc_override_in_moc_16_assassin_i_ve_heard_baphomet_jr_e3fd56: "I've heard that the Baphomet Jr. Card adds +3 points to Agility and +1 point on Critical Attack..."
  npc_override_in_moc_16_assassin_i_ve_met_such_big_cf5e6a: "I've met such a big failure."
  npc_override_in_moc_16_assassin_i_ve_never_met_anyone_1f50e2: "I've never met anyone as intimidating as you! For some reason, I don't like you. I think you should leave!"
  npc_override_in_moc_16_assassin_i_want_you_respect_blood_f6ada0: "I want that you respect the blood that may stain your Katar or Dagger."
  npc_override_in_moc_16_assassin_if_people_close_you_some_91b783: "If people are close to you in some way, they might not understand what I'm saying. We're born to be loners due to our nature."
  npc_override_in_moc_16_assassin_if_s_alright_you_i_dddbc9: "If it's alright with you, I'd like to get back to my job."
  npc_override_in_moc_16_assassin_if_you_fail_you_ll_d6aa62: "If you fail, you'll have to restart this test. Go to the room above"
  npc_override_in_moc_16_assassin_if_you_re_going_assassin_322673: "If you're going to be an Assassin, we need to determine whether or not you can distinguish friend from foe in an instant."
  npc_override_in_moc_16_assassin_if_you_run_away_get_17ef26: "If you run away, get a nose bleed and pass out or something like that, I'll fail ya'. Enough talk. Let's see what you got."
  npc_override_in_moc_16_assassin_imagine_if_lover_friend_17e54a: "Imagine if a lover or a friend saw the blood on your hands. There's a chance that they might not stay with you."
  npc_override_in_moc_16_assassin_increase_dodge_allows_yo_d1cac5: "'Increase Dodge' allows you to have +3% flee rate per skill lvl."
  npc_override_in_moc_16_assassin_insects_detect_hiding_cl_ede556: "Insects detect hiding/cloaking skills. Their feelers never fail to find targets."
  npc_override_in_moc_16_assassin_job_change_target_monste_5bb126: "6 ^008800Job change target^000000 monsters!"
  npc_override_in_moc_16_assassin_job_change_target_monste_b08731: "6 ^008800Job change target^000000 monsters. They're intermingled among similar looking monsters, so you need to be careful..."
