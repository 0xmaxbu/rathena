  npc_override_in_moc_16_assassin_katar_2bc9f0: "A Katar..."
  npc_override_in_moc_16_assassin_know_everything_you_a05a73: "Know everything do you?!"
  npc_override_in_moc_16_assassin_known_better_c13534: "known better."
  npc_override_in_moc_16_assassin_learn_cloaking_you_must_02896c: "To learn ^3355FFCloaking^000000, you must learn Level 2 Hiding. Then you will be able to move while hiding if you are close to a wall."
  npc_override_in_moc_16_assassin_learning_skills_comes_na_fa17ea: "Learning skills comes naturally with the Assassin job. But don't think of skills as the best value of your training."
  npc_override_in_moc_16_assassin_left_hand_mastery_right_b5dc4c: "^3355FFLeft Hand Mastery^000000 and ^3355FFRight Hand Mastery^000000. Assassins can equip different weapons in each hand when using Dagger class weapons."
