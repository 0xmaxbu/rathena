  npc_override_in_moc_16_assassin_love_your_beloved_foreve_506f73: "Love your beloved forever, even if you can't openly express it. Sometimes, life doesn't allow you to find true love more than once."
  npc_override_in_moc_16_assassin_main_goal_test_find_kill_0ff652: "The main goal of this test is to find and kill as many monsters named ^008800Job change target^000000 as possible."
