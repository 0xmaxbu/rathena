  npc_override_moc_ruins_guides_morroc_and_fc118a: "and {0}"
  npc_override_moc_ruins_guides_morroc_currently_7f1530: "Currently the {0}"
  npc_override_moc_ruins_guides_morroc_let_me_mark_entrance_34c003: "Let me mark the entrance to the {0}"
  npc_override_moc_ruins_guides_morroc_located_e33a33: "The {0} is located"
  npc_override_moc_ruins_guides_morroc_the_0a9eb8: "The {0}"
  npc_override_moc_ruins_guides_morroc_the_is_c9d21b: "The {0} is"
  npc_override_moc_ruins_morocc_aah_s_s_still_ringing_c3bea7: "Aah!!! It's... It's still ringing in my ears!!! Aahhhhh!!!!"
  npc_override_moc_ruins_morocc_actuality_4f3ed7: "In actuality,"
  npc_override_moc_ruins_morocc_adventurers_union_pronte_233f8c: "Adventurers' Union and Prontera Kingdom are putting their efforts on restorations as well as restraints of the original cause of the disaster."
  npc_override_moc_ruins_morocc_after_terrible_incident_f12bdd: "After that terrible incident wiped out the entire Morocc, Rune-Midgarts Kingdom has gathered us volunteers to help restorations."
  npc_override_moc_ruins_morocc_against_kind_damage_955af5: "against that kind of damage!"
  npc_override_moc_ruins_morocc_against_those_adventurer_7b6558: "Against those adventurers,"
  npc_override_moc_ruins_morocc_ah_i_kinda_wanna_see_fce42c: "Ah... I kinda wanna see that Satan with my own eyes, but! I really shouldn't. I shouldn't even dream of seeing that Satan in person."
  npc_override_moc_ruins_morocc_all_happened_so_fast_oas_d7c429: "All happened so fast. The Oasis of the Castle was all dried up and the town was destroyed. And... and that voice... I heard a voice."
  npc_override_moc_ruins_morocc_all_we_know_tons_monster_30af2c: "All we know is that tons of monsters live inside those weird buildings. You might wanna stay away from those really dangerous places."
  npc_override_moc_ruins_morocc_allows_assassins_fa7d8e: "and allows Assassins"
  npc_override_moc_ruins_morocc_also_sonic_blow_skill_fe74bd: "Also, the ^663399Sonic Blow^000000 skill"
  npc_override_moc_ruins_morocc_also_without_dagger_9c1791: "Also, without a dagger"
  npc_override_moc_ruins_morocc_andre_colored_ivory_yell_1a46cf: "Andre is colored in Ivory, Yellowish Green is Piere, and the Red one is Deniro."
  npc_override_moc_ruins_morocc_andre_weakest_piere_comp_b250cc: "Andre is the weakest, Piere is comparatively average, and Deniro is the strongest Ant. Keep that in mind so you can fight the Ants suitable to your level."
  npc_override_moc_ruins_morocc_angeling_high_level_mons_7a8418: "Angeling is a high level monster with Holy property, so it's immune to most magic, aside from spells that have Neutral or Shadow attack properties."
  npc_override_moc_ruins_morocc_angelings_rarely_seen_fo_9b29ec: "Angelings are rarely seen, but can be found among large groups of Porings living in one of the fields south of Prontera."
  npc_override_moc_ruins_morocc_ant_hell_swarming_ant_mo_59be5e: "Ant Hell is swarming with Ant monsters. You'll notice that they all classed with different names..."
  npc_override_moc_ruins_morocc_anyone_buy_basic_set_kat_db8162: "Anyone can buy a basic set of Katars"
  npc_override_moc_ruins_morocc_anything_dceb18: "anything that has"
  npc_override_moc_ruins_morocc_anyway_you_know_where_we_6ba5c4: "Anyway, do you know where we are? I just had a little drink at a tavern, but all of a sudden, the whole town's disappeared when I got out.. or, some five hundred years have passed???!"
  npc_override_moc_ruins_morocc_anyways_don_t_you_think_3e679c: "Anyways, don't you think the Satan Morocc is so cruel?"
  npc_override_moc_ruins_morocc_anyways_isn_t_crib_i_7a4064: "Anyways, isn't that a crib? I think I heard something like that before.."
  npc_override_moc_ruins_morocc_approach_their_enemies_s_04c88f: "to approach their enemies stealthily,"
  npc_override_moc_ruins_morocc_as_bad_as_seems_we_6bc700: "As bad as it seems, we can't even ask for more support."
  npc_override_moc_ruins_morocc_as_important_as_seems_ev_0a10e0: "As important as it seems, everyone's being careful but there are always some that really don't realize the situation, don't you think?"
  npc_override_moc_ruins_morocc_as_well_as_51c0a1: " as well as"
  npc_override_moc_ruins_morocc_aside_daggers_8d2860: "aside from daggers,"
  npc_override_moc_ruins_morocc_assassin_clan_954e6a: "the Assassin clan"
  npc_override_moc_ruins_morocc_assassin_one_advanced_jo_d04aed: "Assassin is one of the advanced jobs for Thief, and specializes in fighting with Neutral and Poison property attacks."
  npc_override_moc_ruins_morocc_assassins_fde0de: "Assassins .."
  npc_override_moc_ruins_morocc_assassins_trained_f8a76a: "...Assassins are trained"
  npc_override_moc_ruins_morocc_assassins_which_very_pro_05f1e3: "to Assassins, which is very professional"
  npc_override_moc_ruins_morocc_before_performing_their_464283: "before performing their duties."
  npc_override_moc_ruins_morocc_believe_me_19ece5: "believe me,"
  npc_override_moc_ruins_morocc_blood_blood_what_takes_p_cb8cf0: "Blood... Blood is what it takes to pay for the soul... and that dark sound of laughter..."
  npc_override_moc_ruins_morocc_cave_sure_dangerous_hell_d9eeba: "That cave is sure a dangerous hell, sticky and all... There are 2 underground levels."
  npc_override_moc_ruins_morocc_compared_dual_daggers_fffb38: "Compared to Dual Daggers,"
  npc_override_moc_ruins_morocc_course_1a6601: "Of course,"
  npc_override_moc_ruins_morocc_course_only_assassins_us_efab39: "Of course, only Assassins can use them."
  npc_override_moc_ruins_morocc_cracking_time_space_3ee634: "Cracking the time and the space,"
  npc_override_moc_ruins_morocc_crying_727ebe: "-Crying-"
  npc_override_moc_ruins_morocc_d_better_disturb_him_any_8e45d9: "- It'd be better not to disturb him anymore -"
  npc_override_moc_ruins_morocc_damage_only_caused_ghost_81352a: "Damage can only be caused to Ghostring through magic spells or weapons with an a specific property."
  npc_override_moc_ruins_morocc_damn_you_515879: "Damn you!"
  npc_override_moc_ruins_morocc_day_i_saw_bloody_moon_a74e75: "... That day... I saw the bloody moon in the sky. It was too silent that it felt so spooky."
  npc_override_moc_ruins_morocc_desert_morocc_highest_av_f8b702: "The desert of Morocc has the highest average temperature in Midgard. You might as well think twice before you sit on the sand in the middle of the desert, cause your ass will be toasted."
  npc_override_moc_ruins_morocc_different_kinds_daggers_04363d: "2 different kinds of Daggers"
  npc_override_moc_ruins_morocc_don_t_drink_too_much_171640: "but don't drink too much."
  npc_override_moc_ruins_morocc_don_t_even_think_about_5c9e8c: "Don't even think about drinking if you don't have 1,000 zeny."
  npc_override_moc_ruins_morocc_double_attack_skill_26024d: "the ^663399Double Attack^000000 skill."
  npc_override_moc_ruins_morocc_dragon_fly_special_one_s_b6a861: "The Dragon Fly is a special one that stays in the North-east of the town."
  npc_override_moc_ruins_morocc_dual_daggers_21de29: "Dual Daggers"
  npc_override_moc_ruins_morocc_due_low_annual_rainfall_14ff42: "Due to low annual rainfall, low humidity and high evaporation rate, little vegetation can be found in the desert."
  npc_override_moc_ruins_morocc_enables_you_equip_efc982: "enables you to equip"
  npc_override_moc_ruins_morocc_even_after_hundreds_thou_0fc2c0: "But even after hundreds and thousands of trying,"
  npc_override_moc_ruins_morocc_even_whistle_dry_wind_ai_336631: "Not even a whistle of dry wind, and the air so heavy and stuffy, I could hardly breathe."
  npc_override_moc_ruins_morocc_failed_reborn_same_place_b8fc51: "Failed to be reborn at the same place,"
  npc_override_moc_ruins_morocc_fields_rune_midgarts_inf_40e30f: "The fields of Rune-Midgarts are infested with wild and dangerous monsters..But, you've got to admit a bunch of them are soooo cute!"
  npc_override_moc_ruins_morocc_fight_set_katars_e0c89a: "or fight with a set of Katars!"
  npc_override_moc_ruins_morocc_fly_lord_445eee: "The Fly Lord?!"
  npc_override_moc_ruins_morocc_forbidden_harm_innocent_bd8f83: "is forbidden to harm innocent people,"
  npc_override_moc_ruins_morocc_fruits_major_ingredients_fe665d: "Fruits are major ingredients,"
  npc_override_moc_ruins_morocc_ghostring_evil_ghost_por_365016: "Ghostring is an evil ghost Poring. It's rarely seen, but can be found among mass groups of Porings living in one of the fields south of Prontera."
  npc_override_moc_ruins_morocc_ghostring_high_leveled_m_49857c: "Ghostring is a high-leveled monster with the Ghost property, so it can withstand all physical attacks."
  npc_override_moc_ruins_morocc_good_all_rune_midgarts_16a893: "for the good of all Rune-Midgarts."
  npc_override_moc_ruins_morocc_gotta_try_harder_harder_7d8156: "Gotta try harder and harder, never ever give up,"
  npc_override_moc_ruins_morocc_great_satan_morocc_t_rev_afe8f2: "The great Satan of Morocc can't revive~"
  npc_override_moc_ruins_morocc_haw_whew_ugh_a5c6d0: "Haw.... Whew... Ugh..."
  npc_override_moc_ruins_morocc_heh_heh_let_me_tell_069564: "Heh heh~ Let me tell you a story. You know I just got out of that Tavern, there, huh?"
  npc_override_moc_ruins_morocc_hehe_don_t_you_think_5bad05: "Hehe~ Don't you think I know a lot about Porings? I love them soooo much"
  npc_override_moc_ruins_morocc_hehe_don_t_you_think_b69d55: "Hehe~ Don't you think I know a lot about Porings? I love them soooo much~"
  npc_override_moc_ruins_morocc_hehe_poring_hee_cf5724: "Hehe... Poring... Hee......"
  npc_override_moc_ruins_morocc_hehe_poring_teehee_e80d51: "Hehe... Poring... Teehee......"
  npc_override_moc_ruins_morocc_here_there_d3c093: "Here and there!"
  npc_override_moc_ruins_morocc_here_you_go_688fd3: "Here you go."
  npc_override_moc_ruins_morocc_hey_you_did_you_cross_bf31a8: "Hey, you. Did you cross the desert?"
  npc_override_moc_ruins_morocc_hey_you_stop_there_5fb013: "Hey, you! Stop there."
  npc_override_moc_ruins_morocc_heyyy_you_re_being_too_cb8361: "Heyyy, you're being too harsh, Senorita. Your fist may be as fragile as you are, but it sure can hurt somebody."
  npc_override_moc_ruins_morocc_hic_516766: "Hic!"
  npc_override_moc_ruins_morocc_hmm_9c4d28: "Hmm..."
  npc_override_moc_ruins_morocc_hmmm_82c2a4: "Hmmm.........."
  npc_override_moc_ruins_morocc_hmmm_you_shouldn_t_here_fe6879: "Hmmm... you shouldn't be here....."
  npc_override_moc_ruins_morocc_hopefully_0318c5: "Hopefully"
  npc_override_moc_ruins_morocc_how_come_s_never_possibl_a6aae4: "How come it's never possible to know its value while it's still around?"
  npc_override_moc_ruins_morocc_how_little_picky_wears_t_3adaf8: "Or, how little Picky wears that tiny egg shell sometimes?.."
  npc_override_moc_ruins_morocc_however_now_satan_revive_a1aeaf: "However, now that the Satan has revived, no one's sure of what changes would be made in the life cycles of Morocc."
  npc_override_moc_ruins_morocc_however_we_no_longer_so_944e7c: "However, we no longer do so,"
  npc_override_moc_ruins_morocc_i_hear_assassins_practic_d325ca: "I hear Assassins practice killing people, quietly and stealthfully.."
  npc_override_moc_ruins_morocc_i_hear_coolest_assassin_486213: "And I hear the coolest Assassin of them all is the Assassin Cross! But, that's even a bigger mystery~ You won't be able to see them unless you're a great thief!"
  npc_override_moc_ruins_morocc_i_heard_satan_morocc_rev_88bfc2: "I heard the Satan Morocc has revived. It just got out of cracking the time and the space blar... hic~"
  npc_override_moc_ruins_morocc_i_hunch_hot_dry_climate_cd5ff6: "I have a hunch that this hot and dry climate in Morocc is because of that Satan sealed deeper underground for so long."
  npc_override_moc_ruins_morocc_i_i_really_saw_fly_8ff9ae: "I... I really saw it.... The Fly Lord gets shattered in pieces in a blink of an eye..."
  npc_override_moc_ruins_morocc_i_know_s_time_worry_8de80d: "I know it's not the time to worry about some gemstones but.. this.. was my everything.."
  npc_override_moc_ruins_morocc_i_left_home_three_years_27b0e1: "I left home three years ago, and have been searching for their secret base ever since..."
  npc_override_moc_ruins_morocc_i_ll_tell_you_what_3150e5: "I'll tell you what it is!"
  npc_override_moc_ruins_morocc_i_m_really_wondered_how_bb190d: "I'm really wondered how those entrances are after the horrible destruction, but I can't go out.. If you ever hear anything about it, please get me informed."
  npc_override_moc_ruins_morocc_i_m_so_scared_i_a0646b: "I'm so scared... I just wanna ease my mind watching over those cute little Porings..."
  npc_override_moc_ruins_morocc_i_m_so_scared_where_696f8d: "I'm so scared! Where's mom and dad...! hhooooo... Where's our house..."
  npc_override_moc_ruins_morocc_i_m_sure_how_cow_066a34: "I'm not sure how the cow's milk comes out of some bird's egg..."
  npc_override_moc_ruins_morocc_i_m_sure_largest_pyramid_0a805c: "I'm sure that the largest pyramid contains the tomb of the ancient king, Osiris! I'm willing to stake my life on it!"
  npc_override_moc_ruins_morocc_i_may_man_science_how_b7f942: "I may not be a man of science, but how is that even possible?."
  npc_override_moc_ruins_morocc_i_mean_did_milk_come_cb62a0: "I mean, did the Milk come prepackaged with the egg, or did it get in there somehow?.."
  npc_override_moc_ruins_morocc_i_remember_i_said_bandit_4ac9b4: "I remember I said the bandits of desert are the desert wolves.. Those bastards always roam around in a bunch and they would get so cruel and outrageous if one of them got attacked."
  npc_override_moc_ruins_morocc_i_t_anymore_ec312c: "But I can't do that anymore."
  npc_override_moc_ruins_morocc_i_t_believe_what_just_c1af04: "I can't believe what just has happened.. Our town used to be the one with those cute little monsters, not that kinda of vicious dreadful Evil sleeping in! Whew..."
  npc_override_moc_ruins_morocc_i_think_there_d_nothing_9d3caa: "But I think there'd be nothing to lose if you, a person of bravery, who came through the wile desert try to find it, don't you think? Teehee~ Don't forget to buy me a drink when you find it!"
  npc_override_moc_ruins_morocc_i_ve_devoted_my_life_667be8: "I've devoted my life to researching the mysterious pyramids near Morocc. I haven't been able to concretely confirm anything yet, but..."
  npc_override_moc_ruins_morocc_i_wish_i_knew_how_5d7ac8: "I wish I knew how bad the damage is, but we can't even estimate it. It's like shovelling sand against the tide.."
  npc_override_moc_ruins_morocc_i_work_trading_business_cc1918: "I work in the trading business, so I always have to cross the hot, dry Morocc Desert on business."
  npc_override_moc_ruins_morocc_if_you_ever_55ccb6: "If you ever,"
  npc_override_moc_ruins_morocc_if_you_ever_could_cross_6f63cd: "If you ever, could cross the desert without any disturbances from the Satan..."
  npc_override_moc_ruins_morocc_if_you_find_them_clan_5d613d: "If you find them, and the clan master thinks you're qualified, you can become an Assassin! Or, at least, I think.."
  npc_override_moc_ruins_morocc_if_you_re_assassin_606a0e: "If you're an Assassin,"
  npc_override_moc_ruins_morocc_importance_e47e9d: "the importance of"
  npc_override_moc_ruins_morocc_infiltrators_murderers_979d90: "infiltrators and murderers"
  npc_override_moc_ruins_morocc_inflicts_continuous_hits_32f1a4: "that inflicts 8 continuous hits of"
  npc_override_moc_ruins_morocc_just_head_east_till_you_8727ef: "Just head East till you see the bridge which connects to the Payon Forest."
  npc_override_moc_ruins_morocc_katars_faster_attack_spe_70b733: "Katars have faster attack speed."
  npc_override_moc_ruins_morocc_lacking_attack_speed_437f31: "be lacking in attack speed."
  npc_override_moc_ruins_morocc_later_i_learned_wasn_t_e850fa: "Later, I learned that it wasn't a normal cactus I found, but the monster we call 'Muka.'"
  npc_override_moc_ruins_morocc_least_3384b8: "or at least,"
  npc_override_moc_ruins_morocc_let_s_stop_crying_eliese_e82cdb: "............... Let's stop crying, Eliese..."
  npc_override_moc_ruins_morocc_level_katar_mastery_b3cda1: "at ^663399Level 4 Katar Mastery^000000."
  npc_override_moc_ruins_morocc_like_one_time_while_i_256459: "Like this one time, while I was in the middle of the desert, I got so thirsty that I caught a cactus.. but before I was able to cut it, it slapped me! Then it shot me in the arse with all these needles..."
  npc_override_moc_ruins_morocc_look_hardest_stone_world_1de543: "But look! The hardest stone in the world got broken in two!"
  npc_override_moc_ruins_morocc_look_our_targets_eye_78e433: "look our targets in the eye."
  npc_override_moc_ruins_morocc_many_factors_determine_i_a9dd7c: "Many factors determine its value, but the most important thing is its size."
  npc_override_moc_ruins_morocc_map_right_before_bridge_32a808: "In the map right before that bridge, head north to find the entrance to Ant Hell, though I'm not sure if it's still there."
  npc_override_moc_ruins_morocc_may_commonly_known_as_73f803: "may be commonly known as"
  npc_override_moc_ruins_morocc_menu_about_5efb8a: "About the desert sands:About the remedy for Fatigue:End Conversation"
  npc_override_moc_ruins_morocc_menu_about_714fe4: "About 'Ant Hell':About Ants:End Conversation"
  npc_override_moc_ruins_morocc_menu_notion_e00c6b: "Notion of Assassin:Quit Conversation"
  npc_override_moc_ruins_morocc_menu_options_f12b57: "?????:Where I can find the Assassin clan?:End Conversation"
  npc_override_moc_ruins_morocc_menu_specialty_e18250: "Specialty of Katar:Specialty of Dual Daggers:Quit Conversation"
  npc_override_moc_ruins_morocc_menu_tell_e86188: "Tell me about the desert.:Quit Conversation"
  npc_override_moc_ruins_morocc_menu_tropical_49cd30: "Tropical Sograt:Vermilion on the Beach:Nothing."
  npc_override_moc_ruins_morocc_menu_what_9a2652: "What about Angeling?:How about Ghostring?:Quit Conversation"
  npc_override_moc_ruins_morocc_mirage_tower_head_buildi_9f114e: "The 'Mirage Tower,' the head building of Sograt Desert, is supposed to appear in this awesome sandstorm! But, I still haven't found it."
  npc_override_moc_ruins_morocc_mom_dad_now_0eb004: "Mom and Dad are now..."
  npc_override_moc_ruins_morocc_morocc_located_extremely_5ffa24: "Morocc is located in an extremely dry region, surrounded by desert."
  npc_override_moc_ruins_morocc_morocc_somewhere_973fa8: "in Morocc somewhere."
  npc_override_moc_ruins_morocc_msg_f0e1ca: "........"
  npc_override_moc_ruins_morocc_my_stupid_button_men_use_9035d3: "My stupid button men are useless,"
  npc_override_moc_ruins_morocc_neutral_damage_227ccf: "Neutral damage."
  npc_override_moc_ruins_morocc_no_no_mommy_daddy_d2647c: "No! No... Mommy... Daddy...."
  npc_override_moc_ruins_morocc_no_no_way_sure_7935c6: "No, No way!? It,, sure is not!"
  npc_override_moc_ruins_morocc_no_noooooo_58646e: "No...... noooooo..."
  npc_override_moc_ruins_morocc_no_place_world_as_hot_3c2d2c: "No place in the world is as hot as Morocc."
  npc_override_moc_ruins_morocc_nonetheless_there_few_ha_02eec6: "Nonetheless, there are a few hardy plants that can survive and grow in the desert."
  npc_override_moc_ruins_morocc_nooooooo_mommy_daddy_9b166e: "Nooooooo... Mommy... Daddy....!!"
  npc_override_moc_ruins_morocc_now_i_come_think_fun_e6481a: "Now I come to think of it, it was fun as much as dangerous."
  npc_override_moc_ruins_morocc_now_i_come_think_maybe_4db72f: "Now I come to think of it, maybe the reason why Morocc has exceptionally high average temperature is because that Satan is sealed within."
  npc_override_moc_ruins_morocc_now_i_t_i_kind_f174fd: "Now that I can't, I kind of miss the old days."
  npc_override_moc_ruins_morocc_now_whole_town_s_destroy_667943: "Now that the whole town's destroyed... I don't even care what happens next..."
  npc_override_moc_ruins_morocc_oh_i_curse_you_desert_c3ea86: "Oh, I curse you, the desert of Morocc!!"
  npc_override_moc_ruins_morocc_oh_those_ants_greedy_as_e550c7: "Oh, and those ants are greedy as Porings and will try to steal your items, so keep that in mind."
  npc_override_moc_ruins_morocc_oh_whatever_s_just_time_3b49eb: "Oh, whatever.. It's just not the time for this."
  npc_override_moc_ruins_morocc_once_thiefs_promoted_0e016b: "Once Thiefs are promoted"
  npc_override_moc_ruins_morocc_once_upon_time_9d45f5: "Once upon a time,"
  npc_override_moc_ruins_morocc_one_blow_b206d3: "in one blow!"
