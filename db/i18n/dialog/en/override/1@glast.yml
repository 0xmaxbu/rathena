Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@glast_SarahAndFenrir_aahhhh_9812cf: "Aahhhh!!"
  npc_override_1@glast_SarahAndFenrir_after_endless_research_i_e366cd: "After endless research I have created various weapons, but I felt something was missing so I found the ancient texts."
  npc_override_1@glast_SarahAndFenrir_because_enchantment_high_74d0f8: "Because enchantment is a high risk process, there is risk of Sarah's earring being destroyed."
  npc_override_1@glast_SarahAndFenrir_because_i_cannot_leave_m_410e9a: "Because I cannot leave my post, "
  npc_override_1@glast_SarahAndFenrir_because_lot_energy_neede_c8d58f: "Because a lot of energy is needed to open a dimension device, come back and find me when the energy has accumulated."
  npc_override_1@glast_SarahAndFenrir_come_back_find_me_after_0bf723: "Come back and find me after one week has passed for the supply of Dimensional Device energy."
  npc_override_1@glast_SarahAndFenrir_come_find_me_again_9f55b9: "come and find me again."
  npc_override_1@glast_SarahAndFenrir_contort_space_time_da90e5: "will contort space time -"
  npc_override_1@glast_SarahAndFenrir_cri_critical_7b18d1: "CRI or Critical"
  npc_override_1@glast_SarahAndFenrir_dangerous_situation_da5fc4: "The dangerous situation"
  npc_override_1@glast_SarahAndFenrir_destroyed_d9f464: "destroyed..."
  npc_override_1@glast_SarahAndFenrir_did_you_successfully_bri_28fde3: "Did you successfully bring back the shards of Gigantes?"
  npc_override_1@glast_SarahAndFenrir_difficult_dangerous_work_84cbb0: "It was difficult and dangerous work"
  npc_override_1@glast_SarahAndFenrir_dimensional_device_close_69f452: "- The Dimensional Device has closed."
  npc_override_1@glast_SarahAndFenrir_enchant_earring_49f0b0: "Enchant earring."
  npc_override_1@glast_SarahAndFenrir_enchant_sarah_s_earrings_bc1add: "Enchant Sarah's earrings"
  npc_override_1@glast_SarahAndFenrir_enchantment_completed_c55048: "Enchantment completed!"
  npc_override_1@glast_SarahAndFenrir_enchantment_easy_task_8567fc: "enchantment is not an easy task.."
  npc_override_1@glast_SarahAndFenrir_enchantments_possible_on_f93b78: "2 enchantments are possible on one earring."
  npc_override_1@glast_SarahAndFenrir_enter_device_4977db: "Do not enter the device."
  npc_override_1@glast_SarahAndFenrir_fully_enchanted_earring_14f24e: "A fully enchanted earring of Sarah cannot be enchanted any further."
  npc_override_1@glast_SarahAndFenrir_good_i_start_enchantment_256384: "Good. I will start the enchantment!"
  npc_override_1@glast_SarahAndFenrir_had_me_worried_08d65f: "had me worried."
  npc_override_1@glast_SarahAndFenrir_harm_come_your_way_as_b855ec: "harm can come your way as well."
  npc_override_1@glast_SarahAndFenrir_how_everything_going_d9dee1: "How is everything going?"
  npc_override_1@glast_SarahAndFenrir_however_there_isn_t_stab_6efaf3: "However, there isn't a stable supply of energy needed to work the Dimensional Device."
  npc_override_1@glast_SarahAndFenrir_i_also_realized_relics_g_626153: "I also realized that relics from the glorious past were also needed to create more powerful and superior weapons."
  npc_override_1@glast_SarahAndFenrir_i_been_waiting_9a3db4: "I have been waiting."
  npc_override_1@glast_SarahAndFenrir_i_cannot_leave_my_post_dc63c8: "I cannot leave my post."
  npc_override_1@glast_SarahAndFenrir_i_continue_discussing_fu_983d53: "I will continue discussing this further with your party leader rather than with you."
  npc_override_1@glast_SarahAndFenrir_i_don_t_expect_receive_ab9bf9: "I don't expect to receive the shards for nothing when you have risked your life for them!"
  npc_override_1@glast_SarahAndFenrir_i_feel_we_meet_again_824dc6: "I feel we will meet again"
  npc_override_1@glast_SarahAndFenrir_i_found_out_about_dimens_0237fb: "I found out about the Dimensional Device during my research."
  npc_override_1@glast_SarahAndFenrir_i_give_you_useful_lookin_052374: "I will give you a useful looking earring from the relics I have happened to have obtained during my previous research."
  npc_override_1@glast_SarahAndFenrir_i_make_sure_compensate_y_cb721b: "I will make sure to compensate you sufficiently."
  npc_override_1@glast_SarahAndFenrir_i_need_warrior_who_bring_2ecf41: "I need a warrior who can bring me the shard of Gigantes instead.."
  npc_override_1@glast_SarahAndFenrir_i_need_warrior_who_bring_bed5c5: "I need a warrior who can bring me the shards instead.."
  npc_override_1@glast_SarahAndFenrir_i_need_warrior_who_bring_d83b0b: "I need a warrior who can bring me the shards instead."
  npc_override_1@glast_SarahAndFenrir_i_need_you_find_shards_3daf6e: "I need you to find shards of Gigantes again."
  npc_override_1@glast_SarahAndFenrir_i_say_i_am_professor_90ce49: "I would say I am Professor Bernhard, the best weapons researcher in Schwarzwald."
  npc_override_1@glast_SarahAndFenrir_i_set_dimensional_device_0b5f47: "I set the Dimensional Device to Glast Heim of the past, where Fenrir and Sarah once were."
  npc_override_1@glast_SarahAndFenrir_i_set_dimensional_device_729bdb: "I set the Dimensional Device to Glast Heim of the past, where Fenrir and Sarah once fought."
  npc_override_1@glast_SarahAndFenrir_i_specially_trade_shard_1b8a75: "I will specially trade it for 1 shard since you are the warrior who brought shards of Gigantes for the professor's work."
  npc_override_1@glast_SarahAndFenrir_i_think_been_worn_sarah_924d3b: "I think this has been worn by Sarah in the past and seems to have a great ability to draw out potential strength."
  npc_override_1@glast_SarahAndFenrir_i_think_you_assist_me_936b5c: "I think you can assist me once again.."
  npc_override_1@glast_SarahAndFenrir_i_ve_heard_about_you_504bd1: "I've heard about you from the professor."
  npc_override_1@glast_SarahAndFenrir_i_wish_you_luck_8a9720: "I wish you luck~!"
  npc_override_1@glast_SarahAndFenrir_if_you_hand_shards_gigan_90a5c6: "If you hand the shards of Gigantes to my chief assistant, I will make sure the earrings will be correspondingly great through an enchantment."
  npc_override_1@glast_SarahAndFenrir_if_you_want_enchantment_199b8f: "If you want an enchantment "
  npc_override_1@glast_SarahAndFenrir_if_you_want_enchantment_7e5e49: "If you want an enchantment on Sarah's earrings, come and find me again."
  npc_override_1@glast_SarahAndFenrir_if_you_want_initialize_e_cb9047: "If you want to initialize an enchantment on Sarah's earrings, come and find me again."
  npc_override_1@glast_SarahAndFenrir_if_you_wish_enchant_you_b12736: "If you wish to enchant, you must equip Sarah's {0} earring."
  npc_override_1@glast_SarahAndFenrir_impossible_restore_abili_bafcc4: "It is impossible to restore abilities that are gone after initialization."
  npc_override_1@glast_SarahAndFenrir_initialization_completed_badf26: "Initialization completed."
  npc_override_1@glast_SarahAndFenrir_initialize_enchantment_r_4def4b: "To initialize an enchantment, the relevant column must be equipped with Sarah's earring."
  npc_override_1@glast_SarahAndFenrir_initialize_enchantment_r_738694: "To initialize an enchantment, the relevant column must be equipped with gear."
  npc_override_1@glast_SarahAndFenrir_left_column_380539: "Left column"
  npc_override_1@glast_SarahAndFenrir_left_earring_sarah_8539a0: "- The left earring of Sarah -"
  npc_override_1@glast_SarahAndFenrir_left_earring_sarah_f072c5: "The left earring of Sarah"
  npc_override_1@glast_SarahAndFenrir_longing_accomplishing_po_e193c5: "A longing for accomplishing a powerful weapon as a genuine professor!"
  npc_override_1@glast_SarahAndFenrir_memorial_dungeon_exist_585d67: "Memorial Dungeon {0} does not exist."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_0080a3: "Fenrith Fenrir: The root of earthshaking power!! Fear the power of the earth!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_036027: "Fenrith Fenrir: Galions are the monsters that habit this vicinity.."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_04913e: "Fenrith Fenrir: You are still in Glast Heim? Why aren't you leaving this dangerous place?"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_0590c6: "Fenrith Fenrir: White Imprison!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_068fda: "Fenrith Fenrir: Then there is someone else here other than me?"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_080077: "Fenrith Fenrir: She is planning to collapse this place! I must perform a large scale teleportation!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_0a7ac7: "Fenrith Fenrir: Today I hope to end our ill fated relationship."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_0b4b59: "Fenrith Fenrir: Sword that can control life and death, and pierce space time!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_0fafb8: "Fenrith Fenrir: They are endless. I should finish this absolutely."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_117076: "Fenrith Fenrir: I speak to you who controls fire, I Fenrith, desire a fire that does not go out..."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_159963: "Fenrith Fenrir: Light Bolt!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_16304c: "Fenrith Fenrir: Perhaps you can help me..."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_1dc99b: "Fenrith Fenrir: Since you may not be able to finish her off alone, I will prepare one final spell!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_1fe1bd: "Fenrith Fenrir: I will be waiting! If you are late I will have to go by myself!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_215626: "Fenrith Fenrir: There is no time! Hurry!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_2a2ac6: "Fenrith Fenrir: The power of doubt, a powerful force, the power of deeply hidden secrets in the mind!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_2bc4b6: "Fenrith Fenrir: Come now!! Thunder Storm!!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_316412: "Fenrith Fenrir: There is an object I need to find. I need to hurry before it is too late."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_3338da: "Fenrith Fenrir: A storm that can freeze even the soul!! Storm gust~!!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_34657f: "Fenrith Fenrir: We don't have much time! We have to go search for it now! Let's go in!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_38254f: "Fenrith Fenrir: Wrath of the true sky."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_391225: "Fenrith Fenrir: Where you have passed will only be filled with nothingness."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_3a968c: "Fenrith Fenrir: Two Gigantes! This will not be an easy fight. Help me and defeat the Gigantes!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_3ccc4d: "Fenrith Fenrir: The mercilessly cold breath of the Northern winds,"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_41ad99: "Fenrith Fenrir: Hell fire that can swallow even space! Meteor storm~!!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_4675c6: "Fenrith Fenrir: But others looking for the object will arrive there soon!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_4c270b: "Fenrith Fenrir: Freeze the evil presence with frost wind!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_4d41ed: "Fenrith Fenrir: Go! Cloud Kill!!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_514aa5: "Fenrith Fenrir: Oh.. really? Do you think you can assist me then?"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_517a4b: "Fenrith Fenrir: Thunderbolt that may split the earth!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_550648: "Fenrith Fenrir: I need to go to Glast Heim Castle to retrieve the sword of Baldur."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_557f4b: "Fenrith Fenrir: Endlessly burning conflagration, a fire that can scorch even the soul!! Appear before me now!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_571e71: "Fenrith Fenrir: Now! I put Sarah in critical condition! You have to finish her off!! Attack her quickly! Sarah is strong!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_5ab31d: "Fenrith Fenrir: This is strange.. I don't recall Glast Heim castle being filled with such a dark presence.."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_5b3768: "Fenrith Fenrir: Sentinel Breeze! I have it in my hand!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_5c3966: "Fenrith Fenrir: Then I will go on ahead! Warp!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_5e9eab: "Fenrith Fenrir: Let us climb the castle to retrieve Sentinel Breeze! Sarah will be waiting!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_5f00b1: "Fenrith Fenrir: If we don't escape now we will suffer a gruesome fate by Sarah's monsters and magic!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_5fe1a9: "Fenrith Fenrir: I can feel the evil of monsters in this place.. as if they are being controlled by someone.."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_638f79: "Fenrith Fenrir: That will do.. Now all I have to do is use Sentinel Breeze to find Baldur's whereabouts.."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_64b9e1: "Fenrith Fenrir: We must follow quickly to retrieve the sword! I shall use a group space movement spell!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_658c2e: "Fenrith Fenrir: No need for useless words, hand over the Sentinel Breeze now!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_6622fd: "Fenrith Fenrir: Since there isn't enough time, we can't wait long."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_68b8b8: "Fenrith Fenrir: Appear!!! Frost Misty!!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_6917ea: "Fenrith Fenrir: The sword of Baldur, Sentinel Breeze... even after 1000 years.."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_693345: "Fenrith Fenrir: The object I am looking for is located somewhere in Glast Heim!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_6a3fd4: "Fenrith Fenrir: Get away from the Sentinel Breeze immediately!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_727538: "Fenrith Fenrir: Road of Vermilion!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_7827f9: "Fenrith Fenrir: This place seems quite dangerous now. It is not too late to turn back."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_7bfb88: "Fenrith Fenrir: Emerge!! Fire Insignia!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_7ef95c: "Fenrith Fenrir: Come out Baretis Spear!!!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_803aab: "Fenrith Fenrir: It may be difficult alone. If you are listening I will gratefully accept your help."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_8519dc: "Fenrith Fenrir: Now it has completely become a habitat for monsters.."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_85639d: "Fenrith Fenrir: Wait.. Come to think of it, something is strange.."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_882378: "Fenrith Fenrir: Go forth!! Heaven's Drive!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_89740b: "Fenrith Fenrir: I will wait in the central castle of Glast Heim for about 5 minutes."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_8a76ff: "Fenrith Fenrir: Alright! We have defeated a Gigantes!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_946edb: "Fenrith Fenrir: Limitlessly distant monarch with the beautiful scarlet breath!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_953531: "Fenrith Fenrir: Is that so..? I see.. I guess it does not matter."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_9552ae: "Fenrith Fenrir: Aaah!! Thunder Storm!!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_95ba40: "Fenrith Fenrir: I would like your party leader to come and help me!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_99b77b: "Fenrith Fenrir: This is urgent because there isn't enough time. We have to arrive there soon. 5 minutes at the latest!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_99ec78: "Fenrith Fenrir: True wrath of the sky, thunderbolt that may split the earth... Fall before me now!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_9c7c0b: "Fenrith Fenrir: Buy me some time while I cast magic! I will handle this!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_9eaec7: "Fenrith Fenrir: Sarah will hide and continuously summon monsters! I will take care of that monster, you face the Gigantes!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_a3761b: "Fenrith Fenrir: Anyway, who are you?"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_a5efd8: "Fenrith Fenrir: I can find Baldur with this!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_a71204: "Fenrith Fenrir: Mm... I look forward to it Sarah Irene.."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_a74df5: "Fenrith Fenrir: Heaven's sword piercing the sky"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_a82b28: "Fenrith Fenrir: Power to shake the earth's axis! Show your grace right here and now!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_a84e22: "Fenrith Fenrir: Could this be.. Valkyrie! Now it is not fun anymore"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_b29b59: "Fenrith Fenrir: Now! I put Sarah in critical condition! You have to finish her off! Attack her quickly! Sarah is strong!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_b2a2c8: "Fenrith Fenrir: Pure white shackles, eternal prison, make a deal with me now!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_b907b1: "Fenrith Fenrir: You came! I was waiting!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_ba83be: "Fenrith Fenrir: Since it is dangerous you do not have to feel obligated to help me. I will try by myself if I have to."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_bcfc85: "Fenrith Fenrir: you take care of the monsters she summons. I'm counting on you."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_bdb1e5: "Fenrith Fenrir: Lethal poison, Dark clouds, appear before me and show a most painful death!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_c0ef45: "Fenrith Fenrir: This is a strategy to attack at once and finish Sarah off while she is in critical condition. Remember, our opponent is strong."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_c271e9: "Fenrith Fenrir: I wish to borrow your strength for a moment!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_cd4853: "Fenrith Fenrir: I need to go to Glast Heim Castle to retrieve the sword of Baldur"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_cde3be: "Fenrith Fenrir: Currents vibrating in the atmosphere! Show me your strength!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_ce2fbb: "Fenrith Fenrir: No.. Then thank you! I hope we can meet again later!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_ce798c: "Fenrith Fenrir: Come like the silent dawn mist and freeze everything!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_d03a99: "Fenrith Fenrir: Simultaneous large scale warp!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_d1b4fa: "Fenrith Fenrir: I will weaken Sarah with white imprison and face her while she's shackled,"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_dc1ad6: "Fenrith Fenrir: Greetings can come later! Careful! It seems somebody has summoned a monster!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_dc86e8: "Fenrith Fenrir: Let fall here your extreme strength that can tear even the vacuum!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_dd5ebf: "Fenrith Fenrir: Sarah may be too difficult for you to face alone. I must face her!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_e4acea: "Fenrith Fenrir: Hehe.. You are certainly skilled but I think you have underestimated me, Valkyrie."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_e736cb: "Fenrith Fenrir: Glast Heim, once the cathedral for the Asgard gods.."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_e97b69: "Fenrith Fenrir: It could be difficult alone, I would gratefully accept your help."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_eac36e: "Fenrith Fenrir: Fall before me now!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_ed7a93: "Fenrith Fenrir: Let's meet at Glast Heim entrance where we first met! If we flee that far it should be safe!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_efa262: "Fenrith Fenrir: I was waiting. Thank you for not being late."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_efe5c5: "Fenrith Fenrir: Now!!! Psychic Wave!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_f2da46: "Fenrith Fenrir: Hm.. Adventurers.."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_f4cca7: "Fenrith Fenrir: Devour this evil presence with the fire pit of the universe!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_f68605: "Fenrith Fenrir: Farewell Valkyrie!! I shall take the Sentinel Breeze! So long!"
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_fc65dc: "Fenrith Fenrir: By the way, I know it was sudden but thank you for helping."
  npc_override_1@glast_SarahAndFenrir_menu_fenrith_fed7ba: "Fenrith Fenrir: Alright, I will go on ahead and you decide if you are going to assist me!"
  npc_override_1@glast_SarahAndFenrir_menu_options_1fbe1f: "{0} : The Ancient Gigantes that Professor Bernhard spoke of!!"
  npc_override_1@glast_SarahAndFenrir_menu_options_2b63b3: "{0} : Ah.. that is...."
  npc_override_1@glast_SarahAndFenrir_menu_options_30daf4: "{0} : .. I am a traveler who wanders around the world!"
  npc_override_1@glast_SarahAndFenrir_menu_options_55bf81: "{0} : Huh? Somebody there? Hello~ You must be a traveler."
  npc_override_1@glast_SarahAndFenrir_menu_options_5f9a23: "{0} : Will do. Powerful enemies make my blood boil."
  npc_override_1@glast_SarahAndFenrir_menu_options_74083a: "{0} : Could it be he was the real Fenrir?"
  npc_override_1@glast_SarahAndFenrir_menu_options_8ec74f: "{0} : What are these things?"
  npc_override_1@glast_SarahAndFenrir_menu_options_94ff6a: "{0} : You don't have to worry~! I am fairly strong myself!"
  npc_override_1@glast_SarahAndFenrir_menu_options_a8139f: "{0} : I know it's dangerous but I thought it would be fun so I couldn't help myself.."
  npc_override_1@glast_SarahAndFenrir_menu_options_daf01f: "{0} : Should I help that person.. Or should I look for Gigantes to take the shards as requested by Professor Bernhard..?"
  npc_override_1@glast_SarahAndFenrir_menu_options_e3613a: "{0} : Did that.. person.. really happen to be.. the.. Fenrir..? No way.. probably not.."
  npc_override_1@glast_SarahAndFenrir_menu_options_f790f9: "{0} : Hm.. what should I do..? I need shards of Gigantes as requested by Professor Bernhard.."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_0109bb: "Sarah Irene: Did you think you can escape that easily?"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_0851fd: "Sarah Irene: However, do not think this is the end"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_1125b7: "Sarah Irene: As expected, Fenrith Fenrir, you do not yield easily!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_157dc6: "Sarah Irene: If you want it back come to Glast Heim Castle! I shall be waiting!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_16b8c9: "Sarah Irene: Bwahahahahahaha!! Glast Heim is being filled with my wrath!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_1dd304: "Sarah Irene: Argh!!! I will kill you all!!!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_24476e: "Sarah Irene: I cannot let you escape!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_2aa13e: "Sarah Irene: Hurk.... he.."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_34b092: "Sarah Irene: Oh... not bad? But not good enough!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_3e3afa: "Sarah Irene: I am Sarah Irene! I will not fall so easily!!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_3f28a5: "Sarah Irene: However, I cannot let you leave with that."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_42079d: "Sarah Irene: Hehe.. I can't do that!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_488418: "Sarah Irene: Hurk...this.. cannot happen!!! I cannot lose!!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_4aca85: "Sarah Irene: Try if you can."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_565f5d: "Sarah Irene: I shall turn Glast Heim into hell!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_56fc85: "Sarah Irene: Ugh... that is no use Fenrir!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_5857ff: "Sarah Irene: Fenrith Fenrir.... Did you think I couldn't track you because you fled?"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_657988: "Sarah Irene: Argh!!!!!! Ahhh!!!!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_66b7d5: "Sarah Irene: Do you think that is enough to beat me?"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_6b2fc0: "Sarah Irene: Hurk.. such an annoying magic bombardment!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_740a2a: "Sarah Irene: Absurd little thing, you think you can escape that easily?"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_768f80: "Sarah Irene: That was sudden Fenrir. Is that all you've got?"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_78df9c: "Sarah Irene: You need to disappear from here along with that worn out blade!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_7c60c4: "Sarah Irene: You will surely see me again!!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_82d366: "Sarah Irene: It seemed like forever waiting for you~ Fenrith Fenrir."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_84816a: "Sarah Irene: Anyway, also to achieve Freyja's will.. hehe.."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_8778b0: "Sarah Irene: Not yet!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_951217: "Sarah Irene: Try to entertain me a little more!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_980a72: "Sarah Irene: Furthermore you borrow the assistance of such rookie adventurers..."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_b41a60: "Sarah Irene: Why don't you stop your childish magic, Fenrir?"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_b88bd2: "Sarah Irene: Ugh...you are.. stronger than I predicted Fenrir..."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_bc32a4: "Sarah Irene: You rather entertain me Fenrith..."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_c23719: "Sarah Irene: My minions will make sure to kill you!!!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_c4f19d: "Sarah Irene: Not bad but.. not even close!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_caeb6f: "Sarah Irene: Hurk...."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_d20afa: "Sarah Irene: Hehe... You evade well like a rat."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_d7f17d: "Sarah Irene: I will blow this entire castle away! Yaah!"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_e2a344: "Sarah Irene: Mm.. today I will make you stand down"
  npc_override_1@glast_SarahAndFenrir_menu_sarah_ee19ce: "Sarah Irene: Belated salutations, my name is Sarah Irene, one of the 12 Valkyries of Valhalla."
  npc_override_1@glast_SarahAndFenrir_menu_sarah_efbb30: "Sarah Irene: So your plan was to tie me up with this sort of trick?"
