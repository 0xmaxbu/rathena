Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job_hunte_hunter_about_make_df620b: "about to make the"
  npc_override_job_hunte_hunter_after_meeting_lost_perso_1f1a47: "After meeting this lost person, you decide to get back to hunting. Just then, you find that someone is attacking a boss!"
  npc_override_job_hunte_hunter_agh_e04f67: "Agh?!"
  npc_override_job_hunte_hunter_ah_cf07cb: "Ah!"
  npc_override_job_hunte_hunter_ah_wait_moment_36dda9: "Ah, wait a moment."
  npc_override_job_hunte_hunter_ah_wait_sec_c6bced: "Ah, wait a sec."
  npc_override_job_hunte_hunter_alas_you_fallen_prey_mos_00048d: "Alas, {0}, you have fallen prey to the most feared of traps. The dreaded stink bomb! Run run run awaaaaaay!"
  npc_override_job_hunte_hunter_all_your_preparations_cce1fe: "all of your preparations."
  npc_override_job_hunte_hunter_alright_then_come_back_m_94e380: "Alright then, come back to me when you have everything ready~"
  npc_override_job_hunte_hunter_also_here_little_reward_e358c3: "And also, here is a little reward for all the effort you put in. It's from me, of course~"
  npc_override_job_hunte_hunter_and_6a514c: "^660000{0} {1}^000000 and"
  npc_override_job_hunte_hunter_any_warnings_f22501: "Any warnings?"
  npc_override_job_hunte_hunter_anyway_i_believe_you_ve_1e497a: "Anyway, I believe you've prepared it yourself. Let's begin now."
  npc_override_job_hunte_hunter_as_explained_before_hunt_f67d44: "As explained before, hunt 4 or more of the monsters named ^3355FFJob change monster^000000. Upon doing so, a switch in the center of the map will then appear."
  npc_override_job_hunte_hunter_as_mentioned_before_only_7eab24: "As mentioned before, only hunt the monsters labeled 'Job change monster'."
  npc_override_job_hunte_hunter_ask_priest_open_free_war_6a5b59: "Ask a Priest to open a free warp portal."
  npc_override_job_hunte_hunter_attack_hode_top_hill_fe471c: "Attack a Hode from the top of a hill."
  npc_override_job_hunte_hunter_attack_see_what_happens_da7675: "Attack and see what happens."
  npc_override_job_hunte_hunter_attack_someone_else_s_ho_e35c8a: "Attack someone else's Hode."
  npc_override_job_hunte_hunter_become_noble_person_beco_a488e3: "Become a noble person and become a worthy representative of our Hunter Guild. Show your love of nature as a Hunter~"
  npc_override_job_hunte_hunter_been_moved_hugel_schwarz_c75e4b: "has been moved to ^ff0000Hugel^000000 in the Schwarzwald Republic."
  npc_override_job_hunte_hunter_beg_here_there_60a329: "Beg here and there."
  npc_override_job_hunte_hunter_begin_test_d43d8b: "Begin test."
  npc_override_job_hunte_hunter_best_way_99b884: "best way to"
  npc_override_job_hunte_hunter_boom_bam_boom_you_fallen_e136e7: "BOOM BAM BOOM! {0}, you have fallen into my trap! But I won't kill you...just...humiliate you..."
  npc_override_job_hunte_hunter_cancel_77dfd2: "Cancel"
  npc_override_job_hunte_hunter_canceling_fe8f18: "^3355FFCanceling"
  npc_override_job_hunte_hunter_cancellation_warp_activa_ac44bc: " !! Cancellation warp activating... !! "
  npc_override_job_hunte_hunter_careful_traps_when_hunti_42a905: "***** Be careful of the traps when hunting. *****"
  npc_override_job_hunte_hunter_come_back_1d4835: "Come back"
  npc_override_job_hunte_hunter_come_back_once_you_91f3c5: "Come back once you have"
  npc_override_job_hunte_hunter_come_back_when_2a5147: "Come back when"
  npc_override_job_hunte_hunter_congratulations_129643: "Congratulations~!!"
  npc_override_job_hunte_hunter_did_you_mess_up_517101: "Did you mess up?"
  npc_override_job_hunte_hunter_disconnected_server_you_396acc: "Disconnected from server. {0}, you have to start over."
  npc_override_job_hunte_hunter_eh_why_don_t_i_a8ea27: "Eh? Why don't I give you any Silver Arrows? Well, you shouldn't expect to get anything when you didn't even bring the materials."
  npc_override_job_hunte_hunter_eh_why_won_t_i_054ebc: "Eh? Why won't I give you Silver Arrows? Don't expect anything when you don't bring any materials."
  npc_override_job_hunte_hunter_eh_you_haven_t_had_526e28: "Eh? You haven't had enough training as an Archer yet. To become a Hunter, you must gain a certain level of experience as an Archer first."
  npc_override_job_hunte_hunter_eh_you_haven_t_trained_d44953: "Eh? You haven't trained enough as an Archer. To become a Hunter, you need to gain more experience as an Archer first."
  npc_override_job_hunte_hunter_escape_b4cfe1: "Escape"
  npc_override_job_hunte_hunter_escape_switch_09bf90: "on the escape switch.^000000"
  npc_override_job_hunte_hunter_escape_warp_portal_3739f3: "^3355FFThe Escape Warp Portal"
  npc_override_job_hunte_hunter_escape_warp_portal_activ_816ceb: " !! Escape Warp Portal activation complete. !! "
  npc_override_job_hunte_hunter_everything_must_complete_c54173: "Everything must be completed within 3 minutes."
  npc_override_job_hunte_hunter_fear_you_too_shall_learn_5b4a81: "Fear not {0}, for you too, shall learn the powers of the dark side. You will now be returned to the starting point."
  npc_override_job_hunte_hunter_feel_free_ask_3622ad: "feel free to ask."
  npc_override_job_hunte_hunter_first_327447: "First..."
  npc_override_job_hunte_hunter_follow_yellow_brick_road_eacdd6: "Follow the yellow brick road... No wait, {0}!! Not that way...Back to the starting point it is."
  npc_override_job_hunte_hunter_fourth_52ea8c: "Fourth..."
  npc_override_job_hunte_hunter_gathered_all_items_77722f: "gathered all the items."
  npc_override_job_hunte_hunter_gathers_flips_through_pa_ff4e3e: "^3355FF*Gathers and flips through papers*^000000"
  npc_override_job_hunte_hunter_give_some_my_items_zeny_3b3abf: "Give some of my items and Zeny."
  npc_override_job_hunte_hunter_go_back_town_f2ecf8: "Go back to town."
  npc_override_job_hunte_hunter_go_gather_items_test_com_66fc73: "Go gather the items for the test, and come back after you've visited the Hunter Guild."
  npc_override_job_hunte_hunter_go_out_train_yourself_bi_f2de87: "Go out and train yourself a bit more. You'll need to be at least Job Level 40 before you'll be ready to become a Hunter. Of course, you can train more than that if you want."
  npc_override_job_hunte_hunter_good_day_welcome_hunter_ec9e91: "Good day. Welcome to the Hunter testing site. The test begins when you enter the next room."
  npc_override_job_hunte_hunter_good_luck_703764: "Good luck."
  npc_override_job_hunte_hunter_greetings_they_call_me_d_7c98ef: "Greetings. They call me... ^660000The Demon Hunter^000000. I am the one in charge of processing applications. Your name is ... {0}, correct?"
  npc_override_job_hunte_hunter_guide_them_their_destina_5b8c62: "Guide them to their destination."
  npc_override_job_hunte_hunter_heal_me_4555f6: "Heal me."
  npc_override_job_hunte_hunter_heal_please_2ed5a3: "Heal, please."
  npc_override_job_hunte_hunter_hehe_ac76ba: "Hehe~"
  npc_override_job_hunte_hunter_hehehe_i_keep_telling_yo_8be5c0: "Hehehe. I keep telling you, it's not~~"
  npc_override_job_hunte_hunter_hello_your_local_kafra_w_764ee9: "Hello, this is your local Kafra worker... {0}, your mommy is waiting for you at the checkout line."
  npc_override_job_hunte_hunter_hey_stop_messing_around_281af7: "Hey, stop messing around."
  npc_override_job_hunte_hunter_hi_how_you_here_s_36d413: "Hi {0}, how are you? Here's a present~ a free warp! Back to the starting point."
  npc_override_job_hunte_hunter_hmm_9c4d28: "Hmm..."
  npc_override_job_hunte_hunter_hmm_e777ce: "Hmm?"
  npc_override_job_hunte_hunter_hmm_i_don_t_think_dac2fb: "Hmm... I don't think this'll work out. You can't become a Hunter without knowing basic etiquette."
  npc_override_job_hunte_hunter_hmm_i_help_you_if_0edde0: "Hmm? Can I help you? If you wish to change jobs, you should visit the person at the Archer Guild, not me."
  npc_override_job_hunte_hunter_hmm_i_think_you_re_86290a: "Hmm, I think you're supposed to visit someone else, not me. Like our Guildmaster who's out for business, you know?"
  npc_override_job_hunte_hunter_hmm_i_ve_been_informed_7111b6: "Hmm... I've been informed that you passed the test. But you don't have the necessary 'Necklace of Wisdom (Penetration)' that proves your accomplishment."
  npc_override_job_hunte_hunter_hmm_let_s_start_intervie_4b201b: "Hmm... Let's start with the interview. Wait and relax a moment. No need to worry, I'll prepare everything~"
  npc_override_job_hunte_hunter_hmm_use_arrow_tips_use_a59edd: "Hmm. ^660000{0} {1}^000000 to use for arrow tips. ^660000{2} {3}^000000 to use here and there. And ^660000{4} {5}^000000 please."
  npc_override_job_hunte_hunter_hmm_warnings_well_if_you_794b1e: "Hmm. Warnings... Well, if you fall into a trap, you have to start from the beginning. Also, only one person can take the test at a time."
  npc_override_job_hunte_hunter_hmm_you_didn_t_go_524130: "Hmm? You didn't go to the Guildmaster either in Payon Central Palace or at the Archer Guild? He should be at one of the two places, so go look for him."
  npc_override_job_hunte_hunter_hmm_you_re_archer_almost_7def81: "Hmm. You're the Archer that almost gave up on changing jobs. You do have everything ready, right? Then I'll send you to take the test right away."
  npc_override_job_hunte_hunter_hmpf_you_must_here_hunte_cba606: "Hmpf. You must be here for the Hunter job test. Let me tell you about the testing process. What would you like to know?"
  npc_override_job_hunte_hunter_how_s_your_business_comi_f3c148: "How's your business coming along?"
  npc_override_job_hunte_hunter_how_you_go_2fcca7: "How would you go"
  npc_override_job_hunte_hunter_how_you_go_desert_a5f1bf: "How do you go to the desert?"
  npc_override_job_hunte_hunter_hunt_nearby_field_9c85e1: "Hunt at a nearby field."
  npc_override_job_hunte_hunter_hunter_applicant_dcb2c3: "a Hunter applicant."
  npc_override_job_hunte_hunter_hunter_guild_cfcb54: "at the Hunter Guild."
  npc_override_job_hunte_hunter_i_believe_9bb3f3: "I believe"
  npc_override_job_hunte_hunter_i_don_t_really_any_bde69c: "I don't really have any official notices from the guild at the moment, so I hope you didn't come here just for that..."
  npc_override_job_hunte_hunter_i_don_t_want_change_14a288: "....I don't want to change yet."
  npc_override_job_hunte_hunter_i_falcon_breeder_moved_o_323008: "I, the Falcon breeder have moved out as well."
  npc_override_job_hunte_hunter_i_heard_he_s_payon_980954: "I heard he's at the Payon Central Palace... Or in the Archer Village, one of those two places. Try visiting those places and find him, okay?"
  npc_override_job_hunte_hunter_i_help_you_9dd552: "Can I help you"
  npc_override_job_hunte_hunter_i_help_you_bbae62: "...Can I help you?"
  npc_override_job_hunte_hunter_i_just_want_know_how_5c3ae7: "I just want to know how you think about life, and why you want to become a Hunter, so there's no need to be nervous."
  npc_override_job_hunte_hunter_i_ll_let_you_change_759113: "I'll let you change your job, but you must bring back a 'Necklace of Wisdom (Penetration),' no matter what it takes."
  npc_override_job_hunte_hunter_i_ll_recover_some_c279f5: "I'll recover some"
  npc_override_job_hunte_hunter_i_ll_send_you_right_3b44b0: "I'll send you right now."
  npc_override_job_hunte_hunter_i_ll_send_you_right_9f4fae: "I'll send you right now..."
  npc_override_job_hunte_hunter_i_ll_send_you_testing_1cf753: "I'll send you to the testing place. There is a waiting room, but if someone else is taking the test, you must wait in the chatroom."
  npc_override_job_hunte_hunter_i_m_glad_say_you_33bc88: "I'm glad to say you've passed the interview~ Now, go to that person in the corner and confirm which item is necessary for your job change test~"
  npc_override_job_hunte_hunter_i_m_here_official_busine_c915fb: "I'm here for official business and am busy at the moment. If you'll excuse me..."
  npc_override_job_hunte_hunter_i_mean_good_job_i_3d2dad: "I mean, good job. I'll give you the item which proves that you have passed the test."
  npc_override_job_hunte_hunter_i_mean_good_job_well_0e6ee2: "I mean, good job. Well then, I'll give you the item which serves as proof that you passed the test."
  npc_override_job_hunte_hunter_i_now_change_9f66bd: "I will now change"
  npc_override_job_hunte_hunter_i_put_spell_you_now_0441a6: "I put a spell on you {0} and now you're mine! Go start over now."
  npc_override_job_hunte_hunter_i_right_let_me_put_c7a9c7: "I was right! Let me put you on the candidate list. Let's see~*"
  npc_override_job_hunte_hunter_i_see_you_aren_t_9e8d1c: "I see you aren't in a hurry to become a Hunter? When I first became a Hunter, I ran around for a month wildly brandishing my bow because I was so happy. Hehe~"
  npc_override_job_hunte_hunter_i_see_you_re_hurry_6e7069: "I see you're not in a hurry to become a Hunter. I was running around with joy, wildly brandishing my bow the first month I became a Hunter. Hehe~"
  npc_override_job_hunte_hunter_i_send_you_testing_place_5f40a1: "I will send you to the testing place. There will be a waiting room, but if someone else is taking the test, you must wait in the chatroom."
  npc_override_job_hunte_hunter_i_want_see_you_become_56a215: "I want to see you become a Hunter...! Waaah~ I think you'd look great, so please hurry!"
  npc_override_job_hunte_hunter_i_wasn_t_notified_about_155229: "I wasn't notified about anything in particular from the Hunter Guild. You're not trying to skip the middle part of the Hunter test, are you?"
  npc_override_job_hunte_hunter_i_wasn_t_notified_hunter_900dc9: "I wasn't notified by the Hunter Guild about anything. You're not trying to skip the middle part of the Hunter test, are you?"
  npc_override_job_hunte_hunter_if_person_currently_taki_08c113: "If the person currently taking the test passes or fails, the next person waiting in the chatroom is sent to the testing area. If nobody is waiting, the test will begin as soon as you enter the chatroom."
  npc_override_job_hunte_hunter_if_person_front_succeeds_e9eaf2: "If the person in front succeeds, resigns or fails, the next person waiting in the chatroom is sent to the testing area. If nobody is waiting, the test will begin as soon as you enter the chatroom."
  npc_override_job_hunte_hunter_if_s_too_hard_wouldn_1c9cd9: "If it's too hard, it wouldn't hurt to try again next time. Would you like to resign for now?"
  npc_override_job_hunte_hunter_if_you_any_257c1b: "If you have any"
  npc_override_job_hunte_hunter_if_you_decide_become_hun_315e08: "If you decide to become a Hunter, promise to come visit me. I want to see you as a Hunter. You would look great!!"
  npc_override_job_hunte_hunter_if_you_decide_become_hun_635179: "If you decide to become a Hunter, come and visit me, okay? You're pretty, but... You'd be even prettier as a Hunter. Hehe~"
  npc_override_job_hunte_hunter_if_you_faint_middle_fall_8d8868: "If you faint in the middle, fall into a trap, or go over the time limit, you'll fail. Then you must then retake the test."
  npc_override_job_hunte_hunter_if_you_still_285b82: "If you still"
  npc_override_job_hunte_hunter_if_you_wish_change_jobs_ecceae: "If you wish to change jobs, I think you need to go visit the person at Payon Central Palace."
  npc_override_job_hunte_hunter_if_you_wish_change_your_87ccd2: "If you wish to change your job to a Hunter, you must register first."
  npc_override_job_hunte_hunter_ignore_5500e3: "Ignore."
  npc_override_job_hunte_hunter_ignore_walk_away_313f5b: "Ignore and walk away."
  npc_override_job_hunte_hunter_into_someone_lost_99b444: "into someone that is lost."
  npc_override_job_hunte_hunter_items_you_need_965b72: "The items you need are"
  npc_override_job_hunte_hunter_job_change_7079c5: "Job change"
  npc_override_job_hunte_hunter_job_test_b5dfbd: "the job test?!"
  npc_override_job_hunte_hunter_just_give_item_demon_hun_3f371c: "Just give the item to the Demon Hunter, the guy who's all the way to the left in this area~"
  npc_override_job_hunte_hunter_just_go_back_town_b1e5fc: "Just go back to town."
  npc_override_job_hunte_hunter_just_remember_always_kee_240c8e: "Just remember to always keep basic etiquette in mind. Try harder in the following tests and make me happy, okay?"
  npc_override_job_hunte_hunter_just_walk_830a42: "Just walk by."
  npc_override_job_hunte_hunter_keep_trying_52945a: "Keep trying."
  npc_override_job_hunte_hunter_least_job_level_762f2f: "at least Job Level 40."
  npc_override_job_hunte_hunter_leave_if_you_plan_trifle_db67f4: "Leave if you plan to trifle me your petty tricks. Do you not realize that you are toying with ^660000The Demon Hunter^000000?!'"
  npc_override_job_hunte_hunter_let_s_begin_869d3b: "Let's begin."
  npc_override_job_hunte_hunter_let_s_begin_bbae53: "let's begin."
  npc_override_job_hunte_hunter_let_s_say_you_having_5989eb: "Let's say you were having too much trouble hunting Hodes and returned to town. Now you are out of HP and a Priest happens to be around. How would you ask for a Heal?"
  npc_override_job_hunte_hunter_listen_carefully_scenari_6c8237: "Listen carefully to the scenarios I describe. When I ask a question, you choose an answer. Pretty simple, don't you think?"
  npc_override_job_hunte_hunter_long_time_no_see_what_c5ff45: "Long time no see~ What brings you here? Did your Falcon run away or something?"
  npc_override_job_hunte_hunter_look_see_if_anyone_alrea_54d063: "Look to see if anyone already wants it."
  npc_override_job_hunte_hunter_menu_here_2d259a: "Here they are: the interview questions~ First of all, my name is 'Sherin.' Nice to meet you!"
  npc_override_job_hunte_hunter_menu_tip_0a9b48: " Tip of the day: Do not step on the traps. You will be returned to the starting point."
  npc_override_job_hunte_hunter_meow_pounce_look_my_kitt_c9c4ad: "Meow *pounce* look my kitties we'll have some{0}stew. Back to the starting point if you don't want to become stew!"
  npc_override_job_hunte_hunter_minute_remaining_6338d0: " ****** 1 minute remaining. ****** "
  npc_override_job_hunte_hunter_minutes_remaining_50c767: " ****** 3 minutes remaining. ****** "
  npc_override_job_hunte_hunter_minutes_remaining_f19983: " ****** 2 minutes remaining. ****** "
  npc_override_job_hunte_hunter_mmm_56bb18: "Mmm...?"
  npc_override_job_hunte_hunter_mmm_aren_t_you_archer_4ba5c7: "Mmm? Aren't you the Archer who gave up last time? Now you're ready, right? Then I'll send you to the job change area right now."
  npc_override_job_hunte_hunter_mmm_d579c6: "Mmm?"
  npc_override_job_hunte_hunter_mmm_i_see_you_re_2ae0e2: "Mmm. I see you're here for the Hunter job test. Let me explain the testing process. What would you like to know?"
  npc_override_job_hunte_hunter_mmm_warnings_well_if_you_166523: "Mmm. Warnings... Well, if you fall into a trap, you have to start the test over from the beginning. And only one person can take the test at a time."
  npc_override_job_hunte_hunter_msg_3b93fd: "????"
  npc_override_job_hunte_hunter_msg_45069c: "^660000{0} {1}^000000,"
  npc_override_job_hunte_hunter_msg_82c212: "^660000{0} {1}^000000."
  npc_override_job_hunte_hunter_msg_b6589f: " 0 "
  npc_override_job_hunte_hunter_my_eyes_you_you_stepped_c49845: "MY EYES!! {0}, you... you.. stepped on them. Go try again...I'd cry for you if I could even shed tears..."
  npc_override_job_hunte_hunter_my_word_you_ve_precariou_277b72: " My word, {0}! You've precariously fallen into a trap! You will be returned back to the start. Cheerio~!"
  npc_override_job_hunte_hunter_no_i_ll_back_later_a8beeb: "No, I'll be back later."
  npc_override_job_hunte_hunter_no_you_fallen_into_trap_5f4d82: "No.... {0}, you have fallen into a trap. You will be returned to the starting point."
  npc_override_job_hunte_hunter_nope_heeheehee_d95a60: "Nope~~(heeheehee)"
  npc_override_job_hunte_hunter_notice_96e00b: "============ Notice ============"
  npc_override_job_hunte_hunter_novice_wow_you_ve_got_f337d5: "a Novice? Wow, you've got a long way ahead of you. I don't think there's much you can do here."
  npc_override_job_hunte_hunter_now_been_activated_3b6261: "has now been activated.^000000"
  npc_override_job_hunte_hunter_now_hurry_4a7b58: "Now hurry~"
  npc_override_job_hunte_hunter_now_hurry_back_hunter_gu_2009ce: "Now hurry back to the Hunter Guild, and join us~"
  npc_override_job_hunte_hunter_now_you_decide_go_maze_c1fca9: "By now, you decide to go to the Maze by yourself."
  npc_override_job_hunte_hunter_now_you_should_go_back_623a73: "Now, you should go back to the Hunter Guild~"
  npc_override_job_hunte_hunter_oh_60fc7b: "Oh~ {0}!!"
  npc_override_job_hunte_hunter_oh_6a4011: "Oh...?"
  npc_override_job_hunte_hunter_oh_78a2fc: "Oh..."
  npc_override_job_hunte_hunter_oh_how_you_been_s_8d150f: "Oh, how have you been? It's been a long time, hasn't it?"
  npc_override_job_hunte_hunter_oh_no_you_hurt_come_5b3efe: "Oh, no.. {0}, are you hurt? Come now, let's go back to the starting point."
  npc_override_job_hunte_hunter_oh_no_you_ve_stepped_4fd2ed: "Oh, no {0}, you've stepped on a hive of bees. You narrowly escaped, all the way back to the beginning."
  npc_override_job_hunte_hunter_oh_person_who_serves_god_284b35: "Oh, a person who serves God! Nice to meet you. There aren't many people like you that visit this place~ Hehe."
  npc_override_job_hunte_hunter_oh_right_our_guildmaster_8c4435: "Oh right. Our Guildmaster has gone on an official trip to the Payon Central Palace. You have to go visit him because the one that administers the test."
  npc_override_job_hunte_hunter_oh_you_better_try_again_5761c4: "Oh, {0}.. You can do better. Try again!"
  npc_override_job_hunte_hunter_oh_you_must_090402: "Oh, you must be"
  npc_override_job_hunte_hunter_oh_you_re_archer_seems_1902fe: "Oh, you're an Archer! It seems as if you've trained enough as an Archer... You came here to become a Hunter, right?"
