Body:
  npc_override_izlude_in_izlude_after_all_right_cecc6f: "after all, right?"
  npc_override_izlude_in_izlude_ah_971301: "Ah..."
  npc_override_izlude_in_izlude_ah_there_s_much_us_81393e: "Ah~~ There's not much for us to do these days. You see, Merchants buy items dropped by monsters. But you knew that, right? "
  npc_override_izlude_in_izlude_alright_magnum_break_bes_0a8f03: "Alright!! ^EE0000Magnum Break^000000 is the BEST!! Now you're talking~!! You know the stuff~ HaHaHa!"
  npc_override_izlude_in_izlude_alright_magnum_break_bes_1c42a9: " Alright!! ^EE0000Magnum Break^000000 is the BEST!! Now you're talking~!! You know your stuff, kid. HaHaHa~!"
  npc_override_izlude_in_izlude_angelings_immune_magic_a_a52c0f: "Angelings are immune to Magic attacks. If people who can only attack with Magic face an Angeling, then it's time for"
  npc_override_izlude_in_izlude_another_important_thing_066b74: "Another important thing is how accurate you can hit your opponents. DEX is the key here. If you train DEX, then the gap between the MIN and MAX damage will also decrease."
  npc_override_izlude_in_izlude_any_case_magnum_break_sk_a6fbdc: "In any case, Magnum Break is THE skill for a Swordman~!! Something simplistic like Bash is just one of those little steps towards Magnum Break."
  npc_override_izlude_in_izlude_arena_here_place_capable_210d09: "The Arena here is THE place for capable young people from all over the Rune-Midgarts Kingdom to challenge themselves and test their skills."
  npc_override_izlude_in_izlude_aside_dangers_mountain_i_8c654f: "Aside from the dangers of the mountain itself, insanely vicious insects live there too. I mean, they'll just attack you for no reason."
  npc_override_izlude_in_izlude_attention_attention_db34cc: "Attention, attention!"
  npc_override_izlude_in_izlude_careful_before_you_reali_e865f3: "But be careful, before you realize it, you may come face to face with Ghostring, a deadly Poring that floats around in the air like a ghost."
  npc_override_izlude_in_izlude_case_i_ll_explain_about_e24644: "In that case, I'll explain about the other attributes to you briefly. In order to attack and evade quickly, you've gotta pay attention to AGI. "
  npc_override_izlude_in_izlude_case_you_want_make_more_165367: "In case you want to make more critical hits, it's a good idea to invest in LUK. INT also increases Max SP, which is needed to use various skills... But it's really up to you."
  npc_override_izlude_in_izlude_come_ride_wind_2f7a54: "Come and ride the wind"
  npc_override_izlude_in_izlude_course_d_good_high_attac_fc1f23: "But of course, it'd be good to have high Attack, wouldn't it? You can either acquire a good weapon or bring up your STR to support you Attack."
  npc_override_izlude_in_izlude_don_t_leave_just_yet_831b17: "But don't leave just yet~! There is great news for people with those jobs. Making a weapon of some elemental property is the key."
  npc_override_izlude_in_izlude_don_t_you_think_binocula_6fe6b1: "Don't you think Binoculars"
  npc_override_izlude_in_izlude_don_t_you_think_strong_b73269: "Don't you think Strong VIT and training in a unique breathing method which enables quick HP recovery are the greatest advantages for a Swordman?"
  npc_override_izlude_in_izlude_fascinating_ship_f64adb: "on a fascinating Ship!"
  npc_override_izlude_in_izlude_ghostring_grayish_poring_49845e: "Ghostring is a grayish Poring that floats around in the air like a ghost. Just like other ghosts, physical attacks can't do any damage to it."
  npc_override_izlude_in_izlude_golem_desert_one_them_do_5ec61c: "Golem of the desert is one of them. Don't underestimate it due to its sluggishness..."
  npc_override_izlude_in_izlude_good_luck_ddf2f3: "Good Luck~"
  npc_override_izlude_in_izlude_greetings_36b940: "Greetings!"
  npc_override_izlude_in_izlude_haha_fact_actually_part_3e1126: "HaHa~ In fact, that was actually part of our job. But there were more and more hunters who came to us in order to get paid and it became too much to handle."
  npc_override_izlude_in_izlude_haha_fact_used_part_our_7b91f9: "HaHa, in fact, that used to be part of our job. But there were more and more hunters who come in order to get paid, so it became too much to handle."
  npc_override_izlude_in_izlude_hahahaha_500406: "Hahahaha!!"
  npc_override_izlude_in_izlude_hahahaha_i_knew_you_d_5400a6: "Hahahaha!!! I knew you'd see things my way!! You ARE a great guy!! Undoubtedly, only ^FF2400Bash^000000 suits a Swordman. Please tell that to this BONEHEAD over here~ Hahaha!"
  npc_override_izlude_in_izlude_hahahaha_i_knew_you_d_773b8e: "Hahahaha!!! I knew you'd see things my way!! You ARE a great guy!! Without a doubt, only ^FF2400Bash^000000 suits a Swordman. Please tell that to FUNBOY over here!! Hahaha."
  npc_override_izlude_in_izlude_hahahaha_see_someone_who_f0cfb3: "Hahahaha!! See!? Someone who pursues a different job agrees with me~! You really are a great guy! Hahaha!! Undoubtedly, only ^FF2400Bash^000000 suits a Swordman. Please tell that to this NIMROD over here~ Hahaha!"
  npc_override_izlude_in_izlude_head_back_382b63: "head back?"
  npc_override_izlude_in_izlude_heard_everything_3717d5: "heard everything."
  npc_override_izlude_in_izlude_hehehehe_hahahaha_b94837: "HeHeHeHe..HaHaHaHa "
  npc_override_izlude_in_izlude_here_izlude_6cbcf7: "here in Izlude."
  npc_override_izlude_in_izlude_here_izlude_we_responsib_ae64a3: "Here in Izlude, we are responsible for maintaining peace not only on land but also at sea. That's why this city has a huge telescope."
  npc_override_izlude_in_izlude_hey_everybody_1bfaa6: "Hey everybody!"
  npc_override_izlude_in_izlude_hey_i_know_you_54656a: "Hey, I know you"
  npc_override_izlude_in_izlude_hey_i_know_you_just_888064: "Hey, I know you just"
  npc_override_izlude_in_izlude_hm_5ea458: "Hm..."
  npc_override_izlude_in_izlude_hmm_9c4d28: "Hmm..."
  npc_override_izlude_in_izlude_hmm_let_me_give_you_68a4fd: "Hmm, let me give you a bit of advice. After you achieve level 5 Bash, the amount of SP consumed by the skill increases greatly, so watch out for your SP."
  npc_override_izlude_in_izlude_hmm_let_me_give_you_928d47: "Hmm, let me give you a bit of advice. After you achieve level 5 'Bash', the amount of SP consumed by the skill increases greatly, so watch out for your SP."
  npc_override_izlude_in_izlude_hmpf_as_i_recall_you_6d19ad: "Hmpf. As I recall, you were running away too, apparently too busy to use your precious Bash. In any case, Magnum Break is THE skill for a Swordman~!!"
  npc_override_izlude_in_izlude_huh_why_am_i_so_bc2fe3: "Huh? Why am I so happy?"
  npc_override_izlude_in_izlude_hurry_hurry_5ddfad: "Hurry, hurry!"
  npc_override_izlude_in_izlude_i_hear_cuisine_there_rea_17ba32: "I hear the cuisine there is really good! Although the idea of eating raw fish is new to me, I would love to go there, and try it just once!"
  npc_override_izlude_in_izlude_i_know_bridge_might_look_49de8a: "I know, this bridge might look weak and fragile, but it is actually state of the art, built with the most sophisticated technology."
  npc_override_izlude_in_izlude_i_m_right_aren_t_8be7c4: "I'm right, aren't I?! ^EE0000Magnum Break^000000 is THE BEST!!! You know what you're talking about, eh? I don't know why this LARDFACE is sooooo stubborn."
  npc_override_izlude_in_izlude_i_mean_we_still_busy_254f81: "I mean we are still busy, but that's nothing compared to how it was before. People who have felt suffering know how to appreciate even the slightest comfort."
  npc_override_izlude_in_izlude_i_thinking_even_though_p_c7dfef: "I was thinking, even though the people of Izlude live so close to the ocean..."
  npc_override_izlude_in_izlude_if_you_ever_want_visit_69fc9f: "If you ever want to visit somewhere past Mt. Mjolnir, then you prepare yourself for the challenge.  Or you could walk around it."
  npc_override_izlude_in_izlude_if_you_lucky_enough_you_b7b44e: "If you are lucky enough, you might even bump into Angeling, the Poring with Angel wings."
  npc_override_izlude_in_izlude_if_you_train_your_skills_dee72b: "If you train your skills very hard, you can even see your HP recovering. The amount"
  npc_override_izlude_in_izlude_if_you_try_cast_magic_5b914a: "If you try to cast magic near it, it will notice and saunter over to smash you. So you better watch out for Golem."
  npc_override_izlude_in_izlude_if_you_ve_got_extra_b5c935: "If you've got an extra knife or sword, you could give it a shot. But it will be very difficult alone, don't you think?"
  npc_override_izlude_in_izlude_izlude_beautiful_town_ri_586881: "But Izlude is a beautiful town right next to the ocean, as well as beautiful Byalan Island."
  npc_override_izlude_in_izlude_izlude_key_our_kingdom_b_95789f: "Izlude is key to our kingdom because of the Swordsman Association located here, as well as the fact that Izlude is in charge of protecting the Rune-Midgarts coastline."
  npc_override_izlude_in_izlude_izlude_satellite_city_pr_3d86e0: "Izlude is the satellite city of Prontera, capital of the Rune-Midgarts kingdom."
  npc_override_izlude_in_izlude_izlude_welcomes_you_812ad8: "Izlude welcomes you."
  npc_override_izlude_in_izlude_job_right_5d6e4c: "the job right~!!"
  npc_override_izlude_in_izlude_just_one_little_steps_to_cf75ff: "is just one of the little steps towards Magnum Break."
  npc_override_izlude_in_izlude_magnum_break_0cc51d: "^EE0000MAGNUM BREAK!^000000"
  npc_override_izlude_in_izlude_menu_bash_be3e68: "Bash:Magnum Break"
  npc_override_izlude_in_izlude_menu_byalan_bd2b3b: "Byalan Island -> 150 Zeny.:Alberta Marina  -> 500 Zeny.:Cancel."
  npc_override_izlude_in_izlude_menu_ghostring_8e5fbb: "Ghostring?:Angeling?:End Conversation."
  npc_override_izlude_in_izlude_menu_of_e60f78: "Of course:Eh? Really?"
  npc_override_izlude_in_izlude_menu_sure_7ce780: "Sure, why?:Not really, I don't care."
  npc_override_izlude_in_izlude_menu_tell_ceb1db: "Tell me more please.:End conversation."
  npc_override_izlude_in_izlude_menu_yeah_8ba3c7: "Yeah, I'm tired to death.:Nope, I love this place!"
  npc_override_izlude_in_izlude_most_importantly_look_ar_608485: "And most importantly, look around before you use it. Otherwise you'll be in BIG trouble~ "
  npc_override_izlude_in_izlude_mt_mjornir_located_north_776ebf: "Mt. Mjornir, located north of Prontera, is a tough"
  npc_override_izlude_in_izlude_no_matter_how_strong_sto_75288a: "No matter how strong storms may be, or how many people may stand on it, this bridge will NEEEEVER collapse."
  npc_override_izlude_in_izlude_office_gives_away_regist_3b35c9: "The Office gives away the registration to any merchant who fulfills those requirements. So nowadays, the hunters sell their goods to the registered merchants."
  npc_override_izlude_in_izlude_office_prize_compensatio_024b58: "The Office of Prize Compensation only pays those who have the Registration. Of course, you'd have to be a merchant and stay in the same place all day long."
  npc_override_izlude_in_izlude_oh_man_6f575c: "Oh man~"
  npc_override_izlude_in_izlude_oh_shut_up_those_poporin_bb452e: "Oh shut up. And those were Poporings. As I recall, you were running away too, apparently too busy to use your precious Bash."
  npc_override_izlude_in_izlude_okay_good_bye_db6fd1: "Okay Good Bye~~"
  npc_override_izlude_in_izlude_okay_then_7dd751: "Okay then,"
  npc_override_izlude_in_izlude_only_skill_s_needed_swor_8bd6c1: "The only skill that's needed for a Swordman is ^FF2400Bash^000000! Bash, Bash and ONLY ^FF2400Bash^000000! No need to waste time and effort for smaller skills! Everything else is for cowards and wusses!"
  npc_override_izlude_in_izlude_only_skill_s_needed_swor_b0844b: "The only skill that's needed for a Swordman is ^FF2400Bash^000000! Bash, Bash and ONLY ^FF2400Bash^000000! No need to waste time and effort on smaller skills~~ Everything else is for cowards and wusses!"
  npc_override_izlude_in_izlude_only_zeny_ride_913669: "Only 500 Zeny to ride!"
  npc_override_izlude_in_izlude_only_zeny_ride_c667b4: "Only 150 Zeny to ride!"
  npc_override_izlude_in_izlude_ounce_91b321: "An ounce of"
  npc_override_izlude_in_izlude_people_who_ve_actually_b_db6f4b: "People who've actually been there have said that if you go deep enough, the dungeon actually descends underwater."
  npc_override_izlude_in_izlude_people_who_ve_seen_under_23c6a6: "The people who've seen the underwater view say it is so fantastic that they've kept dreaming of it ever since."
  npc_override_izlude_in_izlude_perfect_4fcbaf: "is the perfect"
  npc_override_izlude_in_izlude_please_enjoy_fe4745: "Please enjoy"
  npc_override_izlude_in_izlude_pound_cure_72b78f: "a pound of cure"
  npc_override_izlude_in_izlude_prevention_worth_480575: "prevention is worth"
  npc_override_izlude_in_izlude_pubs_prontera_always_ful_7ef193: "The pubs in Prontera are always full of people from local areas and from out-of-town. It can get pretty busy."
  npc_override_izlude_in_izlude_really_cool_you_6d13a2: "are really COOL?! You can"
  npc_override_izlude_in_izlude_recovered_depends_e9fed4: "recovered depends"
  npc_override_izlude_in_izlude_right_magnum_break_best_77d41d: "Right?! ^EE0000Magnum Break^000000 is THE BEST!!! You know what you're talking about, eh? I don't know why this jerkface is being sooooo stubborn."
  npc_override_izlude_in_izlude_s_exactly_why_you_re_548984: "That's exactly why you're dumb, you idiot! And what's this about the 'the ideal Swordman?' I still remember the last time you used Magnum Break..."
  npc_override_izlude_in_izlude_s_exactly_why_you_re_b3fdde: "That's exactly why you're dumb, you idiot! And what was that about the 'ideal Swordman?' You remember the last time you used Magnum Break?!"
  npc_override_izlude_in_izlude_s_pretty_good_place_stop_d0448a: "It's a pretty good place to stop by for general information and to listen to rumors."
  npc_override_izlude_in_izlude_s_right_magnum_break_4ed233: "That's right, Magnum Break"
  npc_override_izlude_in_izlude_s_somewhere_near_bridge_dc5699: "It's somewhere near the bridge connecting the forest and the desert, on the way to the city of Payon which is Southeast from here."
  npc_override_izlude_in_izlude_see_all_sorts_places_41e19c: "see all sorts of places...!"
  npc_override_izlude_in_izlude_see_someone_who_pursues_907135: "See!? Someone who pursues a different job agrees with me~! You really are a great guy! Hahaha!!"
  npc_override_izlude_in_izlude_skill_4eb1f6: "is the skill that does"
  npc_override_izlude_in_izlude_so_if_you_invest_more_0143c7: "So if you invest more of your stats in VIT, you'll recover more HP overall when resting."
  npc_override_izlude_in_izlude_so_if_you_listen_careful_0041d5: "So if you listen carefully, you just might get lucky and learn some very useful information for yourself."
  npc_override_izlude_in_izlude_so_nowadays_hunters_sell_67244e: "So nowadays, the hunters sell their goods to the registered merchants.  Not too many people come to us for that anymore."
  npc_override_izlude_in_izlude_so_whaddya_say_99f776: "So, whaddya say?"
  npc_override_izlude_in_izlude_so_what_you_think_4c4cbe: "So what do you think?"
  npc_override_izlude_in_izlude_so_won_t_too_effective_3bea6e: "So it won't be too effective against monsters with the Water property, but this is THE skill to use against Undead and Earth property monsters!"
  npc_override_izlude_in_izlude_so_won_t_very_effective_c4423b: "So it won't be very effective against Water property monsters, but this is THE skill to use against Undead and Earth property monsters.!"
  npc_override_izlude_in_izlude_some_monsters_world_uniq_840c87: "Some monsters in the world have the unique ability to sense mystical energy, and can detect Magic spells before they are cast."
  npc_override_izlude_in_izlude_some_people_may_think_iz_5f6563: "Some people may think Izlude is just a satellite city of Prontera, and not really that important..."
  npc_override_izlude_in_izlude_something_simplistic_lik_84205d: "Something simplistic like Bash"
  npc_override_izlude_in_izlude_sometimes_explosion_acci_eeb391: "Sometimes the explosion accidentally hits some monsters that are just wandering around."
  npc_override_izlude_in_izlude_steep_climb_03bb9c: "and steep climb."
  npc_override_izlude_in_izlude_surprisingly_once_you_re_d31877: "Surprisingly, once you're underwater, you can breathe just like a fish. Maybe some kind of supernatural force is in effect."
  npc_override_izlude_in_izlude_swordman_skill_e3fda7: "Swordman skill."
  npc_override_izlude_in_izlude_telescope_constantly_wat_a9ebbb: "This telescope constantly watches over the sea, so that we can prevent any serious trouble from happening. You know..."
  npc_override_izlude_in_izlude_them_run_345158: "them to run."
  npc_override_izlude_in_izlude_then_they_all_end_up_21ea32: "Then they all end up coming after you, but that's a risk a true Swordman should be willing to take."
  npc_override_izlude_in_izlude_there_only_pink_porings_ce42e4: "There are not only pink Porings but also Drops, which can be found at the desert, and the green Poporing."
  npc_override_izlude_in_izlude_there_other_cultures_com_453d68: "There are other cultures that have completely developed by living off of the sea. Of course, I'm talking about Amatsu."
  npc_override_izlude_in_izlude_there_s_very_delightful_3d77eb: "There's a very delightful place where you can find every"
  npc_override_izlude_in_izlude_those_whose_main_attack_238130: "Those whose main attack methods are physical like Swordman and Archer might have to run for their lives when facing Ghostrings."
  npc_override_izlude_in_izlude_though_very_beautiful_by_d8138d: "Though it is very beautiful, Byalan Island has a mysterious dungeon that extends deep under the sea."
  npc_override_izlude_in_izlude_train_hard_26d74a: "train hard~~"
  npc_override_izlude_in_izlude_type_poring_88d46f: "type of Poring."
  npc_override_izlude_in_izlude_unfortunately_monsters_t_54456c: "But unfortunately, the monsters are too strong for ordinary people to merely go sightseeing there. Still, just once, I'd like to go down there..."
  npc_override_izlude_in_izlude_vitality_vit_ea9b42: "vitality, or VIT."
  npc_override_izlude_in_izlude_wanna_ed0cb6: "Wanna"
  npc_override_izlude_in_izlude_way_even_swordman_archer_79a3d9: "This way, even a Swordman or an Archer can inflict damage, the way Magic does, on Ghostrings."
  npc_override_izlude_in_izlude_we_had_work_overtime_eve_e3c669: "We had to work overtime every day. Ah, it was a nightmare...! Anyway, the government eventually made a wise decision in creating the Registration System."
  npc_override_izlude_in_izlude_well_7b1901: "Well..."
  npc_override_izlude_in_izlude_well_course_they_all_ver_a11cd9: "Well, of course, they are all very cute, but Ghostring is an EXCEPTION. It is very very dangerous."
  npc_override_izlude_in_izlude_well_sometimes_explosive_8a8e3d: "Well... Sometimes the explosive damage might accidentally hit some wandering monsters, and those guys end up coming after you, but that's a risk a Swordman should be willing to take!!"
  npc_override_izlude_in_izlude_what_what_you_mean_you_267d2b: "What?! What do you mean you didn't know?! Well, you know you can get items by killing monsters. If you bring and sell those to a merchant, you can make some money. "
  npc_override_izlude_in_izlude_what_you_talking_about_i_c6d5ae: "What are you talking about!? The ideal Swordman resolutely stands alone, surrounded by countless foes, smashing them all with one awesome attack..."
  npc_override_izlude_in_izlude_what_you_talking_about_i_e70476: "What are you talking about!? The ideal Swordman resolutely stands alone, surrounded by countless enemies and smashing them all with one awesome attack."
  npc_override_izlude_in_izlude_which_one_you_think_bett_b14892: "Which one do you think is better? The critical damage skill, ^FF2400Bash^000000, or the Splash damage skill, ^EE0000Magnum Break^000000?"
  npc_override_izlude_in_izlude_without_doubt_only_bash_a7b019: "Without a doubt, only ^FF2400Bash^000000 suits a Swordman. Please tell that to this MORON over here!! Hahaha~"
  npc_override_izlude_in_izlude_you_battle_monsters_diff_c935d1: "You can battle with monsters of differing levels. So, the number of stages you survive will be a testament to your battle prowess."
  npc_override_izlude_in_izlude_you_bored_all_talk_you_7a9b18: "Are you bored by all this talk? Or do you want me to go on?"
  npc_override_izlude_in_izlude_you_ended_up_running_awa_f5c66a: "You ended up running away from all those monsters you hit with that stupid skill! Weakling! All those Porings around you got hit and they all tried to kill you. "
  npc_override_izlude_in_izlude_you_had_run_away_all_98a47c: "You had to run away from all those Porings hit by that stupid skill! You weakling! All those Porings that you hit tried to kill you! "
  npc_override_izlude_in_izlude_you_know_you_ll_need_81dfa8: "You know you'll need some strength anyway to swing good weapons easily, anyway."
  npc_override_izlude_in_izlude_you_ll_board_ship_port_55d9f4: "You'll have to board on a ship at the port to get to Byalan Island. There are dangerous dungeons on that island, so don't go snooping around just anywhere."
  npc_override_izlude_in_izlude_you_wanna_know_8e7efb: "You wanna know?"
  npc_override_izlude_in_izlude_you_wanna_know_some_usef_41b1d6: "You wanna know some useful information? Okay, okay lemme tell ya! Magnum Break has Fire Property."
  npc_override_izlude_in_izlude_you_wanna_know_some_usef_ce1cca: "You wanna know some useful information? Okay, okay lemme tell ya! The explosion from 'Magnum Break' has the Fire Property."
  npc_override_izlude_in_izlude_your_visit_d6a86a: "your visit"
  npc_override_izlude_in_izlude_zeny_1938bb: "150 Zeny!"
  npc_override_izlude_in_izlude_zeny_64b049: "500 Zeny!"
  npc_override_izlude_in_swordman_basic_skill_level_5c7f86: "and ^4A4AFFBasic Skill Level 9^000000."
  npc_override_izlude_in_swordman_come_back_me_when_you_56a696: "Come back to me when you have finished learning the Basic Novice Skills."
  npc_override_izlude_in_swordman_congratulations_again_be_4414b5: "Congratulations again for being a Swordman and I hope that you participate in many activities for the revival of our guild."
  npc_override_izlude_in_swordman_congratulations_now_you_a0b45f: "Congratulations! From now on, you are going to live a Swordman's life!"
  npc_override_izlude_in_swordman_excellent_let_me_promote_858371: "Excellent! Let me promote you to a Swordman right away!"
