Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_job3_rune02_rune_knight_agreement_only_allows_us_401571: "The agreement only allows us to send candidates to the Midgard camp and nowhere else."
  npc_override_job3_rune02_rune_knight_ah_area_off_limits_you_9e42e2: "Ah... this area is off limits, you are prohibited to be here. Please do not do anything to hinder our efforts."
  npc_override_job3_rune02_rune_knight_ah_hey_friend_come_over_93526f: "Ah... hey, friend, come over here and let us talk for a minute..."
  npc_override_job3_rune02_rune_knight_ah_what_you_talking_abou_dbb4f5: "Ah? What are you talking about, Renoa? Don't talk in such a manner! You make us sound like criminals."
  npc_override_job3_rune02_rune_knight_algiz_rune_means_chance_6d1ee5: "Algiz - This rune means chance and the power of challenge. This is shaped into the form of an emerald oblique line in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_all_right_i_ll_send_4c8ac5: "All right. I'll send you right away. I'll check you later."
  npc_override_job3_rune02_rune_knight_all_rune_knights_you_ve_2016a7: "All Rune Knights that you've met so far are the disciples who were taught by me and Beljeve. Now you are on your way to joining them."
  npc_override_job3_rune02_rune_knight_although_you_seem_potent_4491b6: "Although... you seem to have the potential to become a companion to those who follow the path of the sword."
  npc_override_job3_rune02_rune_knight_among_ordinary_runes_bla_ec1de9: "Among the 11 ordinary runes, the blank rune is an exception."
  npc_override_job3_rune02_rune_knight_ansuz_rune_means_prepara_e6a231: "Ansuz - This rune means preparation or arrangement and the power that can overcome the uneasiness of the coming future. This is shaped into the form of an emerald round in a Rune Furnace. "
  npc_override_job3_rune02_rune_knight_anyway_drinks_here_reall_93abee: "Anyway the drinks here are really good. Would you like to have one?"
  npc_override_job3_rune02_rune_knight_aren_t_you_wrong_state_87b7db: "Aren't you in the wrong state right now?"
  npc_override_job3_rune02_rune_knight_arwez_rune_means_change_9d4ebe: "Arwez - This rune means change, convulsion and the power of movement. This is shaped into the form of a gray diamond in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_basically_power_magic_ca_e5bdc3: "Basically, the power of magic cannot be used without training to draw out the power of nature and the elements."
  npc_override_job3_rune02_rune_knight_because_there_test_waiti_6a71bc: "Because there is a test waiting for you that uses these rune stones."
  npc_override_job3_rune02_rune_knight_become_proud_rune_knight_21167c: "Become a proud Rune Knight."
  npc_override_job3_rune02_rune_knight_beljeve_agreement_other_f67964: "Beljeve has an agreement with the other alliance countries that the free behavior of our Rune Knights is guaranteed but..."
  npc_override_job3_rune02_rune_knight_beljeve_s_disciples_who_455f18: "Beljeve's disciples who started to learn the way to imbue their swords with rune stones became known as Rune Knights."
  npc_override_job3_rune02_rune_knight_besides_touching_stuff_p_15a284: "Besides touching stuff in this place without permission. Would you be able to understand the contents of the book?"
  npc_override_job3_rune02_rune_knight_cheers_our_new_future_e19ded: "Cheers to our new future..."
  npc_override_job3_rune02_rune_knight_congratulations_04ece6: "Congratulations."
  npc_override_job3_rune02_rune_knight_congratulations_36b252: "Congratulations!"
  npc_override_job3_rune02_rune_knight_congratulations_becoming_569d1f: "Congratulations for becoming one of us. Junior Rune Knight, {0}."
  npc_override_job3_rune02_rune_knight_congratulations_now_you_0a6f71: "Congratulations. Now you've passed all the tests and can walk the way of a Rune Knight."
  npc_override_job3_rune02_rune_knight_congratulations_you_long_81b4e4: "Congratulations! You are at the long-waited final test... I think you've mastered the basics now."
  npc_override_job3_rune02_rune_knight_course_i_only_accept_you_53b8a9: "Of course, I would only accept you if you are one hundred percent sure of your conviction to become a Rune Knight."
  npc_override_job3_rune02_rune_knight_course_your_life_might_r_f20570: "Of course your life might be at risk by the ghosts of Glast Heim... but overcoming the risk shouldn't be hard for a Rune Knight candidate."
  npc_override_job3_rune02_rune_knight_dagaz_rune_means_talent_b858d0: "Dagaz - This rune means the talent and the power of enduring adversity. This is shaped into an emerald spiral in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_did_you_fail_there_s_62e64b: "Did you fail? But, there's no limitation to the number of times you can try."
  npc_override_job3_rune02_rune_knight_discovery_transferring_m_327ed9: "The discovery of transferring this magical power into runes was refined by Beljeve and Serpeone and shared with the Rune Knights."
  npc_override_job3_rune02_rune_knight_don_t_worry_you_won_732370: "Don't worry, you won't be required to have the same knowledge as the magicians of Geffen or Juno. But you can't be an idiot either."
  npc_override_job3_rune02_rune_knight_don_t_you_love_smell_df6bf2: "Don't you love the smell of alcohol?"
  npc_override_job3_rune02_rune_knight_don_t_you_things_right_2c927a: "Don't you have things to do right now?"
  npc_override_job3_rune02_rune_knight_ehwaz_osilia_mannaz_ansu_b82e5a: "Ehwaz, Osilia, Mannaz, Ansuz, Hagalas, Kano, Rhydo, Turisus, Dagaz, Sowilo, Laguz, Isia, Pertz, Verkana, Gebo, Algiz, Arwez, Teiwaz, Wunjo, Jera, Nosiege, Ingz, Fehu, Urj."
  npc_override_job3_rune02_rune_knight_ehwaz_rune_means_enhance_9e2b1c: "Ehwaz - This rune means the enhancement of luck and positive power. It shapes the source in the form of a red spiral in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_enter_password_c0444b: "Enter the Password."
  npc_override_job3_rune02_rune_knight_even_me_no_any_one_3dcbda: "Even for me... no, any one of us who upsets her wouldn't be able to deal with that."
  npc_override_job3_rune02_rune_knight_fehu_rune_means_attainme_1c01b3: "Fehu - This rune means attainment and the power of materialization. This is shaped into the form of a silver round in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_final_test_relatively_si_33c431: "The final test is relatively simple. Everything ends when you get rid of all the magical monsters in this Glast Heim..."
  npc_override_job3_rune02_rune_knight_finally_my_turn_i_m_1585a4: "Finally! Is it my turn? I'm so happy."
  npc_override_job3_rune02_rune_knight_finally_you_honorable_ru_f765c5: "Finally you are an honorable Rune Knight. I'm happy to help you."
  npc_override_job3_rune02_rune_knight_find_our_rune_knight_gat_77fb08: "Find our Rune Knight gathering place hidden inside of Glast Heim."
  npc_override_job3_rune02_rune_knight_find_sage_serpeone_who_s_30cb53: "Find the sage, Serpeone who's been studying and helping the Rune Knights who are out in the Midgard's camp at Ash-Vacuum."
  npc_override_job3_rune02_rune_knight_fortunate_rune_knights_d_4845e9: "It is fortunate that the Rune Knights discovered their use for positive means. Runes have not been used for dark magic but it is certainly possible for their power to be misused if in the wrong hands."
  npc_override_job3_rune02_rune_knight_gebo_rune_means_cooperat_f6b452: "Gebo - This rune means cooperation and the power of harmony. This is shaped into the form of a yellow cone in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_give_me_second_get_royal_249a30: "Give me a second to get the royal gift and talk to me again."
  npc_override_job3_rune02_rune_knight_go_back_where_you_belong_6bcb08: "Go back to where you belong."
  npc_override_job3_rune02_rune_knight_go_fiery_lady_library_ro_d9c4ff: "Go to that fiery lady in the library room to get the next test done and come back."
  npc_override_job3_rune02_rune_knight_good_i_don_t_ask_22ae3a: "Good. I don't have to ask any more about your qualification to join our brethren....1.S... Now I'll give you your first assignment."
  npc_override_job3_rune02_rune_knight_good_luck_703764: "Good luck."
  npc_override_job3_rune02_rune_knight_good_then_i_ll_send_bb5484: "Good. Then I'll send you there now. But, there's one thing I need to tell you."
  npc_override_job3_rune02_rune_knight_ha_you_did_good_job_6220f3: "Ha! You did a good job considering how difficult my test is. If you were nervous, you can relax now."
  npc_override_job3_rune02_rune_knight_had_been_achieved_legend_9ce2d8: "It had been achieved by the legendary swordsman Beljeve who's been known as a Sword Master and a founder of dispensable expenditure."
  npc_override_job3_rune02_rune_knight_hagalas_rune_means_freed_aa1e37: "Hagalas - This rune means the freedom and the power that resists restraint. This is shaped into the form of a sky-blue colored star-shape in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_hahaha_you_heard_won_t_e685db: "Hahaha. you heard that? It won't be easy this time. I hope you get through it my friend."
  npc_override_job3_rune02_rune_knight_hanging_around_man_won_t_41575c: "Hanging around this man won't be good for you. Keep going the way you were heading."
  npc_override_job3_rune02_rune_knight_haven_t_you_failed_test_634382: "Haven't you failed at the test... If you fail once, you cannot enter again for 10 minutes."
  npc_override_job3_rune02_rune_knight_he_stares_me_absent_look_182ae1: "He stares at me with an absent look and after a while he begins to talk."
  npc_override_job3_rune02_rune_knight_help_preparation_we_ve_m_530197: "To help the preparation we've made a contract with the Kafra headquarters in Al De Baran by employing a Kafra Employee especially for this gathering place. So it would be good to visit her."
  npc_override_job3_rune02_rune_knight_her_expression_suddenly_fd15e3: "But her expression suddenly changed a bit as she looked at to speak."
  npc_override_job3_rune02_rune_knight_here_take_s_gift_i_de8a02: "Here, take this. It's a gift that I like to give to the younger generation like yourself."
  npc_override_job3_rune02_rune_knight_here_you_ve_passed_go_5ef610: "Here, you've passed. Go back to Captain Tigris and complete the next test."
  npc_override_job3_rune02_rune_knight_hey_i_think_i_told_57f19b: "Hey! I think I told you to make at least 20."
  npc_override_job3_rune02_rune_knight_hey_long_time_no_see_5f02fa: "Hey, long time no see, {0}. I don't think you've got any important matters to discuss but make yourself comfortable."
  npc_override_job3_rune02_rune_knight_hey_renoa_go_easy_knight_9039b0: "Hey Renoa, go easy on that Knight. You there too, you'd better stop touching stuff here without permission."
  npc_override_job3_rune02_rune_knight_hey_what_about_me_i_9d7689: "Hey... What about me? I'm not like that!"
  npc_override_job3_rune02_rune_knight_hey_you_rune_knight_cand_6564e2: "Hey, are you the Rune Knight candidate that Manuel recommended? I am Captain Tigris from the Rune Knights, and your name is?"
  npc_override_job3_rune02_rune_knight_hey_you_weren_t_you_03c4d2: "Hey you, weren't you testing? Lunarea, what happened? Is the test all done?"
  npc_override_job3_rune02_rune_knight_hm_perfect_you_ve_come_f44aa3: "Hm... This is perfect. You've come here with very rare good records."
  npc_override_job3_rune02_rune_knight_hmm_bad_s_great_record_2842a9: "Hmm, not bad. It's not a great record but you tried your best."
  npc_override_job3_rune02_rune_knight_hmm_great_you_ve_come_3044a7: "Hmm... This is great. You've come here with decent records."
  npc_override_job3_rune02_rune_knight_how_how_did_you_get_25da09: "How... how did you get in here?! Captain, we have a spy!"
  npc_override_job3_rune02_rune_knight_however_direct_research_101900: "However, for the direct research on the rune magical power which had broken the human's normal concept is now ongoing."
  npc_override_job3_rune02_rune_knight_i_am_going_give_you_f43ccf: "I am going to give you a test that allows you to deal with runes directly."
  npc_override_job3_rune02_rune_knight_i_am_man_walking_way_7ffc3b: "I am a man walking the way of the Sword. But I'm not exactly the same as the likes of you, Rune-Midgarts knight."
  npc_override_job3_rune02_rune_knight_i_am_only_knight_who_7fff74: "I am the only knight who's keeping the way of the Swordsman in this cursed place Glast Heim."
  npc_override_job3_rune02_rune_knight_i_am_renoa_i_am_dc271e: "I am Renoa. I am in charge of the teaching and testing of runes and magic for Rune Knight candidates."
  npc_override_job3_rune02_rune_knight_i_am_telling_you_beforeh_6eacf2: "I am telling you beforehand but I don't test or judge your qualification. A Rune Knight will be the judge of that."
  npc_override_job3_rune02_rune_knight_i_am_very_proud_as_facedf: "I am very proud as a Rune Knight to serve beside her."
  npc_override_job3_rune02_rune_knight_i_been_having_correspond_85995c: "I have been having correspondences with humans for a number of years now. It was for mutual interests. Anyway, that's how I learned your language."
  npc_override_job3_rune02_rune_knight_i_believe_wind_change_al_dcc175: "I believe that the wind of change is not always a good one."
  npc_override_job3_rune02_rune_knight_i_didn_t_think_candidate_475ed1: "I didn't think that a candidate would make it to me today..."
  npc_override_job3_rune02_rune_knight_i_don_t_know_how_751417: "I don't know how you were able to get here. But it looks like you've come to a place where you shouldn't be."
  npc_override_job3_rune02_rune_knight_i_forgot_check_if_you_55a1bb: "I forgot to check if you are qualified to get the celebration gift for changing your job..."
  npc_override_job3_rune02_rune_knight_i_heard_number_candidate_764ed3: "I heard that the number of candidates who've given up while taking Renoa's test has been high."
  npc_override_job3_rune02_rune_knight_i_heard_story_magical_sc_ea500f: "I heard a story from the magical scholars about the technology that can substantialize the essence of magic. I began a study to substantialize it to a rune by getting their help."
  npc_override_job3_rune02_rune_knight_i_ll_buy_round_c9f239: "I'll buy this round."
  npc_override_job3_rune02_rune_knight_i_ll_get_new_rune_f4dc53: "I'll get new rune stones so if your preparation is all done, please talk to me again."
  npc_override_job3_rune02_rune_knight_i_ll_hand_over_all_3611d2: "I'll hand over all the made rune stones to Captain Tigris."
  npc_override_job3_rune02_rune_knight_i_ll_need_re_use_b95256: "I'll need to re-use these unused rune stones. Talk to me again once I have taken all the test rune stones."
  npc_override_job3_rune02_rune_knight_i_lucky_image_rune_stone_3d3c79: "I was lucky. The image of the rune stone in my head and the modelled rune stone didn't match but it's made normally. This case is rare."
  npc_override_job3_rune02_rune_knight_i_m_happy_bottom_my_0f0d5f: "I'm happy from the bottom of my heart. I'm very proud of you."
  npc_override_job3_rune02_rune_knight_i_m_kidding_i_am_5b242b: "I'm not kidding, I am really looking forward to your new start as a Rune Knight."
  npc_override_job3_rune02_rune_knight_i_m_kidding_i_am_6a3f73: "I'm not kidding, I am really looking forward to your new start as a Rune Knight. So please do your best."
  npc_override_job3_rune02_rune_knight_i_m_sure_we_ll_d38dd0: "I'm sure we'll be crossing paths before long. I believe we will meet again."
  npc_override_job3_rune02_rune_knight_i_see_hole_under_huge_2f8639: "I can see a hole under the huge Rune Stone Statue behind Renoa. Clearly this is a mass-produced rune heating furnace that I read in the book."
  npc_override_job3_rune02_rune_knight_i_think_you_ve_already_89c6a9: "I think you've already heard a basic explanation and instructions from Renoa. Now it seems that it's my turn to help you out."
  npc_override_job3_rune02_rune_knight_i_ve_been_waiting_you_23a9d7: "I've been waiting for you Rune Knight candidate. I'm helping the candidates as a favor to Ms. Serpeone."
  npc_override_job3_rune02_rune_knight_i_wait_day_you_become_3c86d8: "I will wait for the day you become our comrade as a true Rune Knight."
  npc_override_job3_rune02_rune_knight_i_wait_day_you_become_ccee03: "I will wait for the day that you become our comrade as a true Rune Knight."
  npc_override_job3_rune02_rune_knight_if_all_your_preparations_befa27: "If all of your preparations are done, I'll send you to the final test field."
  npc_override_job3_rune02_rune_knight_if_there_s_any_equipment_f67a9b: "If there's any equipment that you are wearing now, or anything you're holding. Please empty it for your job change moment."
  npc_override_job3_rune02_rune_knight_if_you_also_follow_way_8ffe2d: "If you also follow the way of the Swordsman our paths will most certainly cross again when you have reached your full potential."
  npc_override_job3_rune02_rune_knight_if_you_any_business_here_2307bc: "If you have any business here, I'll send you to the Rune Knight gathering place. If you are ready, please tell me."
  npc_override_job3_rune02_rune_knight_if_you_any_problems_any_37143e: "If you have any problems or any questions, please talk to me."
  npc_override_job3_rune02_rune_knight_if_you_breathing_human_t_dfcbd7: "If you are a breathing human, then listen to me carefully. I wouldn't risk my life here by hesitating to talk to just anyone."
  npc_override_job3_rune02_rune_knight_if_you_continually_walk_a74f24: "If you continually walk the way of the sword, you will eventually feel the limits of your powers. Like myself before..."
  npc_override_job3_rune02_rune_knight_if_you_find_there_ll_66a879: "If you can find it, there'll be a person waiting to greet you, so let's start."
  npc_override_job3_rune02_rune_knight_if_you_interested_i_ll_8d4cb8: "If you are interested, I'll introduce you to the masters who will guide you to the way of the Rune Knight with my recommendation."
  npc_override_job3_rune02_rune_knight_if_you_ready_i_ll_2e0a61: "If you are ready I'll open the way to the sage, Serpeone who's in the Midgard post at Ash-Vacuum. Are you prepared?"
  npc_override_job3_rune02_rune_knight_if_you_ready_i_ll_9122a4: "If you are ready I'll guide you to the warp that moves you directly to Serpeone. Meet her and get instructions from her."
  npc_override_job3_rune02_rune_knight_if_you_ready_just_talk_f7a856: "If you are ready just talk to me again."
  npc_override_job3_rune02_rune_knight_if_you_ready_move_test_9c0013: "If you are ready to move to the test field talk to me."
  npc_override_job3_rune02_rune_knight_if_you_ready_talk_me_54e5b0: "If you are ready talk to me again. I'm free anytime."
  npc_override_job3_rune02_rune_knight_if_you_remember_books_yo_8a7f11: "If you remember the books you've read in the library just before, you'll be able to produce a rune stone here without my explanation."
  npc_override_job3_rune02_rune_knight_if_you_remember_what_you_0f6bef: "If you remember what you read in the library just before, you'll be able to produce a rune stone here without my explanation."
  npc_override_job3_rune02_rune_knight_if_you_store_up_energy_96e1c6: "If you store up the energy by getting rid of evil creatures in the human world, I'll convert it to the energy that you can use."
  npc_override_job3_rune02_rune_knight_if_you_succeed_making_ru_2ad34c: "If you succeed in making the rune stone automatically it becomes the rune stone you'll use for yourself when you succeed, and it's delivered to Captain Tigris...so try hard."
  npc_override_job3_rune02_rune_knight_if_you_succeed_making_ru_428903: "If you succeed in making the rune stone it will automatically become the rune stone you'll use for yourself when you become a Rune Knight, so try your best."
  npc_override_job3_rune02_rune_knight_if_you_taking_rune_knigh_4b31e1: "If you are taking the Rune Knight test I hope that you try your best. This won't be as easy to pass as Lunarea's test ok?"
  npc_override_job3_rune02_rune_knight_if_you_understood_then_m_a36794: "If you understood, then make your preparations and come back."
  npc_override_job3_rune02_rune_knight_if_you_want_move_freely_6ea231: "If you want to move freely through all of Ash-Vacuum, you'll have to go through the normal route which is acquiring qualification with the Midgard alliance. It has nothing to do with us."
  npc_override_job3_rune02_rune_knight_if_you_want_take_test_a5534b: "If you want to take the test again. I can send you to the test field."
  npc_override_job3_rune02_rune_knight_if_you_want_walk_your_1b3792: "If you want to walk on your new way and surpass your current limits, I'm willing to help you."
  npc_override_job3_rune02_rune_knight_if_you_want_you_ask_b21738: "If you want to, you can ask help from one of us. But don't think that we will always help."
  npc_override_job3_rune02_rune_knight_if_you_wish_join_rune_edc402: "If you wish to join the Rune Knights. Please get a recommendation from one of the guides and come to me again."
  npc_override_job3_rune02_rune_knight_ingz_rune_means_disrupti_b64ddf: "Ingz - This rune means disruption and the power of separation. This is shaped into the form of a violet diamond in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_isia_rune_means_power_st_547e90: "Isia - This rune means the power that stops everything. This is shaped into a violet spiral in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_jera_rune_means_comfort_130a8e: "Jera - This rune means comfort and the power of rest. This is shaped into the form of a yellow round in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_jewel_called_as_rune_med_c57365: "A jewel called as a Rune is a medium that contains the formless existence, the magical power and the essence of it can be used directly."
  npc_override_job3_rune02_rune_knight_just_like_taste_drink_i_aa1261: "Just like the taste of this drink. I wish the taste of this drink is kept here forever."
  npc_override_job3_rune02_rune_knight_just_wait_minutes_should_1b2030: "Just wait 5 minutes and it should be your turn."
  npc_override_job3_rune02_rune_knight_kano_rune_means_flame_pa_2939df: "Kano - This rune means flame and passion, and the power that ends everything. The source of it is shaped into the form of a red diamond in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_knight_going_walk_way_ru_d3f930: "This Knight is going to walk the way of the Rune Knights with us, so please give your blessing."
  npc_override_job3_rune02_rune_knight_laguz_rune_means_uncerta_f7bbbc: "Laguz -This rune means uncertainty and the power that protects the inside. This is shaped into a form of a yellow diamond in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_laphine_sage_serpeone_fo_570dae: "The Laphine Sage, Serpeone and the founder of Rune Knights Beljeve co-researched runes and the result of their research has only recently become to be known to the world."
  npc_override_job3_rune02_rune_knight_laphine_tribe_fairies_as_24b98b: "The Laphine tribe are the fairies from the Ash-Vacuum and are known to have a close relationship to the birth of the Rune Knights."
  npc_override_job3_rune02_rune_knight_lastly_there_several_thi_000006: "Lastly, there are several things to be aware of as a Knight who's experienced a job change to a Lord Knight in Valhalla."
  npc_override_job3_rune02_rune_knight_leader_rune_knights_belj_380931: "The leader of the Rune Knights, Beljeve, is known to have been in touch with the fairies even before the dimensional door of the Ash-Vacuum was made when Satan Morocc resurrected."
  npc_override_job3_rune02_rune_knight_let_me_check_report_inst_9c0943: "Let me check the report from the instructors who took care of your tests."
  npc_override_job3_rune02_rune_knight_let_me_see_manual_jungbe_1aa457: "Let me see... Manual and Jungberg must have finished the basic verification, then let's start the test right away."
  npc_override_job3_rune02_rune_knight_let_me_send_dispatch_my_f82475: "Let me send a dispatch to my comrades that you are willing to join our ranks."
  npc_override_job3_rune02_rune_knight_let_s_see_how_many_d6382e: "Let's see. How many candidates have come to this room? Hey, Lunarea, which candidate is this one here?"
  npc_override_job3_rune02_rune_knight_living_things_place_been_83fd7d: "The living things in this place have been preserving the magical energy in our bodies unlike the living things in the human world."
  npc_override_job3_rune02_rune_knight_looks_like_there_already_6366e1: "Looks like there is already an applicant in the test room."
  npc_override_job3_rune02_rune_knight_lunarea_proceed_first_te_e3d7e9: "Lunarea, proceed with the first test."
  npc_override_job3_rune02_rune_knight_magic_power_could_only_p_fdb574: "Magic power could only previously be used by those who can harness magic power within their bodies through a long time of research"
  npc_override_job3_rune02_rune_knight_magical_monsters_kinds_m_9ca444: "The magical monsters are the 3 kinds of magic monsters from Glast Heim that you might already know... It won't be an easy fight but if you just undergo this final suffering, you'll walk the path of a Rune Knight."
  npc_override_job3_rune02_rune_knight_magical_power_rune_knigh_890203: "The magical power that the Rune Knights use are not technically the same as the magical power made in the human world."
  npc_override_job3_rune02_rune_knight_magical_power_rune_pitch_43d043: "The magical power of the rune pitches and tosses while it is getting shaped."
  npc_override_job3_rune02_rune_knight_making_rune_stones_achie_fc1f11: "The making of Rune stones is achieved through a skill called rune mastery which is learned when one becomes a Rune Knight."
  npc_override_job3_rune02_rune_knight_man_wearing_glorious_arm_707bcf: "A man wearing glorious armor and passion in his eyes is standing in front of me."
  npc_override_job3_rune02_rune_knight_mannaz_rune_means_hope_n_6695e9: "Mannaz - This rune means hope and a new start and also the positive power that can reverse a desperate situation. This is shaped into the form of an emerald diamond in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_maybe_there_needs_machin_1836f0: "Maybe there needs to be a machine that can translate the Laphine language to make it easier for humans to understand us."
  npc_override_job3_rune02_rune_knight_menu_chapter_6ee28e: "Chapter One:Chapter Two:Chapter Three:Chapter Four:Stop Reading"
  npc_override_job3_rune02_rune_knight_menu_check_04ccff: "Check number of made runes?:I've made all the 20 rune stones."
  npc_override_job3_rune02_rune_knight_menu_enter_c5358e: "Enter the final test field.:I'm not ready yet."
  npc_override_job3_rune02_rune_knight_menu_every_408e31: "Every preparation is done.:I need more time to think."
  npc_override_job3_rune02_rune_knight_menu_globalvar_b74d03: "GlobalVar check:GlobalVar Oneshot Modification"
  npc_override_job3_rune02_rune_knight_menu_i_209153: "I want to go to the gathering place.:Quit the conversation."
  npc_override_job3_rune02_rune_knight_menu_i_297c48: "I want to go back.:I want to cancel."
  npc_override_job3_rune02_rune_knight_menu_i_2d0d81: "I want to go to the gathering place.:Nothing."
  npc_override_job3_rune02_rune_knight_menu_i_84ab37: "I'll go back now.:I'll stay."
  npc_override_job3_rune02_rune_knight_menu_i_a18dc5: "I came to be a Rune Knight.:Cancel."
  npc_override_job3_rune02_rune_knight_menu_i_d75734: "I am not ready yet.:I'm ready to be a Rune Knight."
  npc_override_job3_rune02_rune_knight_menu_i_e5573b: "I want to go back now.:I am not ready yet."
  npc_override_job3_rune02_rune_knight_menu_i_eafa0f: "I've gathered enough energy.:To the gathering place.:Stop the conversation."
  npc_override_job3_rune02_rune_knight_menu_move_a00071: "Move to the test field now.:Give me time to get ready."
  npc_override_job3_rune02_rune_knight_menu_move_ab74f7: "Move to Splendide field:Cancel."
  npc_override_job3_rune02_rune_knight_menu_move_be22e1: "Move to the test field now.:Please give me time to prepare."
  npc_override_job3_rune02_rune_knight_menu_sure_c2ae13: "Sure, let's have a drink.:I refuse."
  npc_override_job3_rune02_rune_knight_menu_the_7cc372: "The birth of Rune Knights:Runes and Magic Energy:Stop Reading"
  npc_override_job3_rune02_rune_knight_menu_the_d23a4d: "The names of the 25 rune stones are the following:"
  npc_override_job3_rune02_rune_knight_menu_the_d34742: "The Making of Rune Stones:Rune Stone Ability Details:Stop Reading"
  npc_override_job3_rune02_rune_knight_menu_the_ea02c6: "The principle use of Runes:The types of Runes:Stop Reading"
  npc_override_job3_rune02_rune_knight_menu_use_4d1076: "Use the Rune Heating Furnace:Stop."
  npc_override_job3_rune02_rune_knight_menu_who_585360: "Who are you?:What are you doing here?:Cancel."
  npc_override_job3_rune02_rune_knight_menu_yes_1e74e3: "Yes please.:Not yet."
  npc_override_job3_rune02_rune_knight_menu_yes_e3a4e4: "Yes, take me there.:I'm on other business.:Cancel."
  npc_override_job3_rune02_rune_knight_menu_yes_f020cd: "Yes, I am prepared.:Not yet."
  npc_override_job3_rune02_rune_knight_minutes_when_you_endure_7df361: "5 minutes... When you endure and get rid of all, you succeed."
  npc_override_job3_rune02_rune_knight_more_than_i_cannot_tell_e416f1: "More than that... I cannot tell you more. I cannot speak carelessly since I'm speaking for my people here and I am on a special pass to be allowed in your camp."
  npc_override_job3_rune02_rune_knight_msg_6eae3a: "..."
  npc_override_job3_rune02_rune_knight_msg_93fcbf: "......"
  npc_override_job3_rune02_rune_knight_must_surprising_i_laphin_a89424: "It must be surprising that I, a Laphine, am here in your people's base."
  npc_override_job3_rune02_rune_knight_must_too_much_you_extrac_e8b66a: "But, it must be too much for you to extract the magical energy from the living things in this land yet."
  npc_override_job3_rune02_rune_knight_my_name_manuel_i_am_e927a9: "My name is Manuel. I am called the Rune Knight of Brilliance. When you tell him that you are a Rune Knight candidate with my recommendation, he will handle the rest."
  npc_override_job3_rune02_rune_knight_my_opinion_you_seem_read_337f67: "In my opinion you seem to be ready to start a new way..."
  npc_override_job3_rune02_rune_knight_nd_0cc3c5: "... 172nd."
  npc_override_job3_rune02_rune_knight_no_well_then_never_mind_54a6e3: "No? Well then never mind."
  npc_override_job3_rune02_rune_knight_nosiege_rune_means_weakn_f01495: "Nosiege - This rune means weakness and the power of attenuating. This is shaped into the form of a yellow fan-shape in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_now_all_tests_you_need_5150b1: "Now all the tests you need to take are over. Go back to Captain Tigris and inform him of this test result, and then feel the deep emotion of being born again as a Rune Knight."
  npc_override_job3_rune02_rune_knight_now_i_ll_cast_magic_55b817: "Now I'll cast a magic spell on your body so you can gather magic energy from other living things."
  npc_override_job3_rune02_rune_knight_now_i_think_my_part_5583b8: "Now I think my part is all over. I hope you will become an honorable Rune Knight."
  npc_override_job3_rune02_rune_knight_now_real_test_as_rune_226305: "From now on, this will be the real test as a Rune Knight that you want to be. You'll need to prepare to take next test."
  npc_override_job3_rune02_rune_knight_now_real_test_as_rune_65eeff: "Now, this will be the real test as a Rune Knight. You've got to prepare to take the next test."
  npc_override_job3_rune02_rune_knight_now_s_possible_those_who_32ff0d: "Now it's possible for those who are normally unsuited to using magic power to carry a medium that can carry magic that normal mortals could not wield before."
  npc_override_job3_rune02_rune_knight_now_s_time_take_test_2c920e: "Now it's time to take the test concerning runes. I know that you have been through quite a complicated process."
  npc_override_job3_rune02_rune_knight_now_test_begins_first_yo_c72e97: "Now the test begins. First, you'll get the 1st test from that beautiful icy lady, so please try your best."
  npc_override_job3_rune02_rune_knight_now_testing_room_current_a7a1f9: "Now... the testing room is currently occupied..."
  npc_override_job3_rune02_rune_knight_now_there_many_instructo_7d50f4: "Now there are many instructors who are looking for talented Sword wielders in various places of Rune-Midgarts. They are looking for a people who will join the true way of the Sword."
  npc_override_job3_rune02_rune_knight_now_there_s_only_last_daefc2: "Now, there's only the last test left. When you pass this, you will be on your way to officially becoming a Rune Knight."
  npc_override_job3_rune02_rune_knight_now_you_yourself_around_21a36b: "Now you can be yourself around us and stand proud as one of us."
  npc_override_job3_rune02_rune_knight_number_rune_knight_test_974365: "The number of Rune Knight Test field right now is... {0}."
  npc_override_job3_rune02_rune_knight_number_rune_stones_made_abf4f6: "The number of rune stones made 'til now is {0}."
  npc_override_job3_rune02_rune_knight_number_total_rune_stones_eba97c: "The number of total rune stones you need to make is exactly 20. Remember that well."
  npc_override_job3_rune02_rune_knight_oh_i_heard_you_ve_6b3b93: "Oh, I heard that you've passed Renoa's test which only few people could pass."
  npc_override_job3_rune02_rune_knight_oh_i_see_please_wait_e29f32: "Oh, I see... Please wait a moment."
  npc_override_job3_rune02_rune_knight_oh_i_ve_heard_before_57770d: "Oh, I've heard it before but I've forgotten it. Right, were you {0}? I truly welcome you from the heart for coming here."
  npc_override_job3_rune02_rune_knight_oh_really_then_keep_your_0fda49: "Oh, really? Then, keep on your work. I'll continue with my mission."
  npc_override_job3_rune02_rune_knight_oh_you_must_b92ef8: "Oh, you must be {0}."
  npc_override_job3_rune02_rune_knight_okay_come_i_ll_guide_8b35f2: "Okay, come in. I'll guide you."
  npc_override_job3_rune02_rune_knight_okay_lunarea_hey_listen_2cbbab: "Okay Lunarea. Hey, listen to me carefully. Lunarea is a poor talker and quiet but you shouldn't ignore her."
  npc_override_job3_rune02_rune_knight_once_someone_enters_into_27a7c4: "Once someone enters into the test field you cannot enter directly. The test is taken one by one."
  npc_override_job3_rune02_rune_knight_one_more_thing_if_you_41b316: "One more thing. If you have any remaining skill-points, use it all and learn the skills. You won't be able to change jobs if you have any more skill points."
  npc_override_job3_rune02_rune_knight_only_condition_you_get_r_e7b21e: "The only condition is that you have to get rid of these monsters by using the rune stones you made at the former test."
  npc_override_job3_rune02_rune_knight_only_set_weapons_you_use_e17d2f: "The only set of weapons you can use should be within the weight limit of 400. Rune stones to be provided are 30 attack-only rune stones and 30 defense-only rune stones."
  npc_override_job3_rune02_rune_knight_ordinary_people_also_lea_3005b2: "Ordinary people can also learn this skill and it needs its own machine called a Rune Furnace."
  npc_override_job3_rune02_rune_knight_osilia_rune_equivalent_e_585b7f: "Osilia - This rune is an equivalent exchange which means that you lose one and you gain one, and it also means the power that needs a cost. This is shaped into the form of a violet oblique line in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_other_runes_consistent_p_c164f4: "The other 11 runes have consistent power, not influenced by any position so if you don't master all 11 ordinary runes and the 14 inverse runes, you cannot draw out all the complete power."
  npc_override_job3_rune02_rune_knight_our_agents_opening_way_s_6cf1e8: "Our agents are opening the way to Splendide only for the trainees who are taking the Rune Knight job change test."
  npc_override_job3_rune02_rune_knight_our_master_beljeve_great_9826ec: "Our Master, Beljeve... and the Great Sage, Serpeone..."
  npc_override_job3_rune02_rune_knight_our_rune_knight_s_born_c009d7: "Our Rune Knight's were born from the result of that study, which enables practicing both the power of the sword and magic by using runes."
  npc_override_job3_rune02_rune_knight_pale_skinned_absent_look_b6b631: "This pale-skinned absent-looking female Rune Knight doesn't seem to care. Of course she doesn't seem interested with my existence"
  npc_override_job3_rune02_rune_knight_pale_skinned_female_rune_3e5a77: "This pale-skinned female Rune Knight called Lunarea is nodding her head quietly and watching me."
  npc_override_job3_rune02_rune_knight_patient_wait_your_turn_5819f2: "Be patient and wait your turn."
  npc_override_job3_rune02_rune_knight_pertz_rune_means_revelat_3b0e09: "Pertz - This rune means revelation and the power of chance. This is shaped into the form of silver spiral in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_please_brace_yourself_ga_5df26c: "Please brace yourself and gather enough energy by dispatching those monsters."
  npc_override_job3_rune02_rune_knight_please_devoted_runes_hop_bc6705: "Please be devoted to the Runes and hopefully your life will be illuminated by it."
  npc_override_job3_rune02_rune_knight_please_get_rid_dullahan_f98ca7: "Please get rid of ^0000FF10 Dullahan^000000, ^0000FF10 Disguise^000000, ^0000FF10 Quve^000000, ^0000FF10 Heirozoist^000000 and gather their energy."
  npc_override_job3_rune02_rune_knight_please_understand_devote_7bfbf7: "Please understand this and be devoted to this test."
  npc_override_job3_rune02_rune_knight_please_unequip_your_moun_e6a78e: "Please unequip your mount and come back again."
  npc_override_job3_rune02_rune_knight_portion_test_over_go_tal_a1179a: "This portion of the test is over. Go talk to Captain Tigris."
  npc_override_job3_rune02_rune_knight_power_rune_stones_way_sh_76717e: "The power of the rune stones is the way of shaping the magical power in our bodies into runes which take place of our bodies as a medium."
  npc_override_job3_rune02_rune_knight_power_runes_perfect_more_693a0f: "The power of Runes are not perfect and more research still needs to be done to make it perfectly safe. It is up to me and other Rune Knights like you to make sure to continue that research."
  npc_override_job3_rune02_rune_knight_preparations_going_well_255df9: "Are the preparations going well?"
  npc_override_job3_rune02_rune_knight_read_book_thoroughly_com_171bba: "Read the book thoroughly and come back. If you are the type of person who doesn't like reading and studying then it won't be easy for you to live as a Rune Knight."
  npc_override_job3_rune02_rune_knight_really_been_such_long_ti_66369e: "It really has been such a long time but Lunarea's test and mine differ like the sky to the earth. I hope you won't be just a muscle-headed fool."
  npc_override_job3_rune02_rune_knight_refining_rune_stone_fail_17328e: "Refining the rune stone has failed... Please try again."
  npc_override_job3_rune02_rune_knight_remaining_stuff_you_hold_f5b701: "The remaining stuff you are holding should be kept by the Kafra employee in the middle."
  npc_override_job3_rune02_rune_knight_remember_day_day_forth_139cba: "Remember this day from this day forth!"
  npc_override_job3_rune02_rune_knight_remember_well_fedead: "Remember that well."
  npc_override_job3_rune02_rune_knight_renoa_i_know_you_ve_ed00cc: "Renoa, I know that you've been waiting for a long time but it's your turn."
  npc_override_job3_rune02_rune_knight_result_studying_these_te_47eeb5: "The result of studying these techniques are the rune stones tuned in harmony with the physical power of swords."
  npc_override_job3_rune02_rune_knight_rhydo_rune_means_combina_9abdfb: "Rhydo - This rune means the combination and recombination and the power of completion. This is shaped into the sky-blue oblique line in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_right_every_challenge_al_4e158d: "Right. Every challenge always needs preparation. Okay, I'll wait for you."
  npc_override_job3_rune02_rune_knight_right_i_ll_send_you_e0631c: "Right. I'll send you right now. I'll see you soon."
  npc_override_job3_rune02_rune_knight_right_place_our_sphere_w_174ad8: "Right this place... our sphere where you call as Ash-Vacuum...it's the magical power made with"
  npc_override_job3_rune02_rune_knight_rune_created_normally_95c77d: "1 {0} rune was created normally."
  npc_override_job3_rune02_rune_knight_rune_kind_symbol_s_been_5b2cd7: "A rune is a kind of symbol that's been used on the Midgard continent since ancient times. Up until now it has only been used by occult circles."
  npc_override_job3_rune02_rune_knight_rune_knight_job_change_g_77158e: "Rune Knight Job Change GlobalVar is modified to 0. The use of the test field is now available."
  npc_override_job3_rune02_rune_knight_rune_knight_job_change_g_d7fa78: "Rune Knight Job Change GlobalVar right now is {0}."
  npc_override_job3_rune02_rune_knight_rune_knight_job_change_m_797b36: "Rune Knight Job Change Managing Module Start"
  npc_override_job3_rune02_rune_knight_rune_knight_renoa_tell_y_c43515: "Rune Knight Renoa will tell you the way of using rune stones."
  npc_override_job3_rune02_rune_knight_rune_knight_waiting_you_fb35f6: "The Rune Knight is waiting for you at Glast Heim. He will guide you to the entrance of Glast Heim Tower."
  npc_override_job3_rune02_rune_knight_rune_knights_gathering_e_7be0b3: "Rune Knights are the gathering of evolved swordmen who have achieved the harmony of sword and magic."
  npc_override_job3_rune02_rune_knight_rune_knights_use_rune_st_3cb9cc: "Rune Knights use rune stones as a medium for magic power rather than using the magical energy made directly within the body."
  npc_override_job3_rune02_rune_knight_rune_mastery_like_code_s_0bafe2: "Rune Mastery is like a code that's been put into the body as a mark of a Rune Knight."
  npc_override_job3_rune02_rune_knight_runes_created_total_smal_34d4cf: "The runes are created from a a total of 25 small stones and they are very fragile to physical shock. So they require special care when being handled."
  npc_override_job3_rune02_rune_knight_runes_their_own_system_t_ebfb5d: "Runes have their own system and types and can draw out various powers according to how they are arranged. But their power level can't currently be measured by known means."
  npc_override_job3_rune02_rune_knight_runes_used_as_symbol_sys_0319bc: "Runes are used as a symbol system, however, by the story handed down orally, it's known to be used for fortune-telling or used to draw out the human sub consciousness."
  npc_override_job3_rune02_rune_knight_s_consideration_other_te_62e8fa: "It's a consideration for the other testers who are waiting for the test, just like you, so come back after the designated time."
  npc_override_job3_rune02_rune_knight_s_known_sword_master_bel_76e621: "It's known that the Sword Master Beljeve felt the limit of his power, so he studied the way to overcome the physical limitation of mortals."
  npc_override_job3_rune02_rune_knight_s_limitless_alternative_9a7353: "It's a limitless alternative energy source and research on them is still ongoing. "
  npc_override_job3_rune02_rune_knight_s_much_there_some_gifts_8e0340: "It's not much but there are some gifts for new Rune Knights who got good scores on the tests."
  npc_override_job3_rune02_rune_knight_s_natural_result_image_r_e50577: "It's a natural result. The image of the rune stone in my head and the modeled rune stone didn't match so the success rate just got lower."
  npc_override_job3_rune02_rune_knight_s_too_bad_there_haven_a7bebf: "It's too bad that there haven't been many candidates that have made it to my part of the test yet so I'm just taking a bit of a rest."
  npc_override_job3_rune02_rune_knight_sage_already_been_touch_d99d43: "The sage has already been in touch with us for a long time so you don't need to worry about understanding Serpeone's language."
  npc_override_job3_rune02_rune_knight_sage_serpeone_one_who_be_00ff3e: "The sage Serpeone is the one who has been with us since the beginning of the Rune Knights."
  npc_override_job3_rune02_rune_knight_seems_enough_166feb: "It seems not enough?"
  npc_override_job3_rune02_rune_knight_seems_you_still_taking_t_b3a86b: "It seems that you are still taking the test. Do your best and pass all the tests."
  npc_override_job3_rune02_rune_knight_she_finally_opens_her_mo_1822a6: "She finally opens her mouth and begins to talk."
  npc_override_job3_rune02_rune_knight_she_holds_up_her_chin_f75e80: "She holds up her chin quietly, nods lightly and notices me."
  npc_override_job3_rune02_rune_knight_she_just_shakes_her_head_eeb751: "She just shakes her head without saying any word, and stares at me. She has piercing eyes."
  npc_override_job3_rune02_rune_knight_she_nods_her_head_reache_b21a5f: "She nods her head and reaches out her hand lightly. Then she draws her sword and makes a signal."
  npc_override_job3_rune02_rune_knight_she_says_so_my_friend_c67524: "She says so my friend. Actually I don't want to see the next one. So please do well."
  npc_override_job3_rune02_rune_knight_she_shows_small_smile_wh_7c6a2d: "She shows a small smile which is barely visible and looks at me."
  npc_override_job3_rune02_rune_knight_shh_our_mission_somethin_74ff8e: "Shh... Our mission is not something to be revealed to the public. Please just move along."
  npc_override_job3_rune02_rune_knight_since_s_test_getting_hel_37bc68: "Since it's a test, getting help from us is completely your choice. It doesn't matter if you take the test with our help or all by yourself."
  npc_override_job3_rune02_rune_knight_since_you_don_t_walk_b9b1d6: "Since you don't walk the way of the Sword, you wouldn't understand our spirit. I can manage by myself. Follow your own path."
  npc_override_job3_rune02_rune_knight_so_please_your_best_26ccc8: "So please do your best."
  npc_override_job3_rune02_rune_knight_so_second_test_you_need_ad271e: "So for the second test, you need to visit the Laphine magical scholars who had given the direct help to the birth of Rune Knights at Ash-Vacuum."
  npc_override_job3_rune02_rune_knight_so_then_let_s_check_42c3a2: "Is it so? Then let's check this out."
  npc_override_job3_rune02_rune_knight_so_use_rune_stone_you_5a6cd6: "So to use the rune stone you need a direct understanding of the other sphere's living things."
  npc_override_job3_rune02_rune_knight_so_what_i_help_you_6d2cef: "So, What can I help you with?"
  npc_override_job3_rune02_rune_knight_some_us_been_contact_hum_d57c23: "Some of us have been in contact with humans in special situations since even before the dimensional rift opened up."
  npc_override_job3_rune02_rune_knight_soon_you_ll_see_way_398a1f: "Soon you'll see the way we need to go clearly."
  npc_override_job3_rune02_rune_knight_sowilo_rune_means_victor_03d719: "Sowilo - This rune means victory and success and the power of arrangement and cessation. This is shaped into the form of a sky-blue fan-shape in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_splendide_land_laphine_w_aaac86: "Splendide is the land of the Laphine. We are offering a convenience by an agreement between the Rune Knights and the expeditionary team."
  npc_override_job3_rune02_rune_knight_st_assignment_find_out_o_4c293e: "The 1st assignment is to find out our Rune Knight gathering place hidden inside of Glast Heim."
  npc_override_job3_rune02_rune_knight_stones_different_meaning_105432: "The 25 stones have different meanings and among these, 14 when counter-positioned can have entirely different power and meaning from the original so it's essential to study the exceptional aspects."
  npc_override_job3_rune02_rune_knight_strive_live_way_sword_ho_f3bf8f: "Strive to live the way of the sword with honor..."
  npc_override_job3_rune02_rune_knight_take_final_test_rune_kni_666813: "Take the final test from the Rune Knight Velpino who is at the arsenal's right side."
  npc_override_job3_rune02_rune_knight_talk_kafra_employee_use_aecb95: "Talk to the Kafra Employee to use the storage."
  npc_override_job3_rune02_rune_knight_teiwaz_rune_means_perfec_1fd2ee: "Teiwaz - This rune means perfect victory and the power of absolute solution. This is shaped into the form of a gold round in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_tell_him_you_candidate_r_9be3bd: "Tell him that you are a candidate to be a Rune Knight and he will handle the rest."
  npc_override_job3_rune02_rune_knight_temporarily_you_ll_able_92525d: "Temporarily you'll able to extract magic energy from evil creatures in the human world. Of course you won't be able to use the energy directly..."
  npc_override_job3_rune02_rune_knight_test_begins_now_first_yo_834f51: "The test begins now. First, you'll get the 1st test from that beautiful icy lady, so please try your best."
  npc_override_job3_rune02_rune_knight_test_captain_tigris_reno_c4646f: "In this test, Captain Tigris, Renoa, Velpino and I will visit together."
  npc_override_job3_rune02_rune_knight_test_only_one_hand_weapo_656bb0: "For this test, only a one-hand weapon, a shield or a two-handed weapon can be equipped. Keep your other equipments with the Kafra Employee in the center."
  npc_override_job3_rune02_rune_knight_test_only_one_hand_weapo_feb6f8: "For this test, only a one-hand weapon, a shield or a two-handed weapon can be equipped."
  npc_override_job3_rune02_rune_knight_test_you_making_rune_sto_4a3530: "In this test you will be making a rune stone yourself which will also be used for your last test."
  npc_override_job3_rune02_rune_knight_test_you_making_rune_sto_c360a2: "In this test you will be making a rune stone yourself which is going to be used for your last test."
  npc_override_job3_rune02_rune_knight_thank_you_all_your_troub_fd1118: "Thank you for all of your trouble taking the test so far. Okay, anyway."
  npc_override_job3_rune02_rune_knight_thanks_your_work_we_cont_ad0123: "Thanks for your work. We will continue our mission for the Rune Knight testers."
  npc_override_job3_rune02_rune_knight_then_after_moment_she_pu_46dd00: "Then after a moment she puts her face down and seems absorbed with other thoughts."
  npc_override_job3_rune02_rune_knight_then_i_ll_send_you_8a49af: "Then I'll send you to the Rune Knight gathering place where you should be."
  npc_override_job3_rune02_rune_knight_there_been_so_many_candi_ea5f15: "There have been so many candidates failing Lunarea's test that I've given up counting."
  npc_override_job3_rune02_rune_knight_there_difference_dependi_fbe060: "There will be a difference depending on the scores, but they are all helpful for anyone who is a Rune Knight."
  npc_override_job3_rune02_rune_knight_there_many_paths_one_tak_ef720c: "There are many paths one can take in the world. Most people can see their path but don't really follow it..."
  npc_override_job3_rune02_rune_knight_there_other_tests_you_ne_0a5c4c: "There are other tests you need to complete. I hope you do a good job."
  npc_override_job3_rune02_rune_knight_there_s_evaluations_luna_58670e: "There's the evaluations from Lunarea, Renoa and Velpino who took care of your tests."
  npc_override_job3_rune02_rune_knight_there_s_place_leads_rune_3bd1c3: "There's a place that leads to the Rune Knights' secret gathering place inside Glast Heim Chivalry. Find that place by yourself."
  npc_override_job3_rune02_rune_knight_there_s_place_leads_rune_58dd2b: "There's a place that leads to the Rune Knight's secret gathering room inside the Glast Heim Chivalry. Find that place by yourself."
  npc_override_job3_rune02_rune_knight_there_s_royal_gift_rune_4af6aa: "There's a royal gift from the Rune-Midgarts Kingdom for all new Rune Knights."
  npc_override_job3_rune02_rune_knight_therefore_jobs_such_as_w_754d70: "Therefore, jobs such as Wizard and Sage have come out and the magic became their own sacred field."
  npc_override_job3_rune02_rune_knight_toast_day_your_strength_1f86cf: "A toast to the day that your strength can withstand the powers of a Rune Knight!"
  npc_override_job3_rune02_rune_knight_toast_friendship_c4470b: "A toast to friendship~"
  npc_override_job3_rune02_rune_knight_total_number_rune_stones_97e6b8: "The total number of rune stones you need to make is 20."
  npc_override_job3_rune02_rune_knight_true_way_swordman_who_le_5c26ac: "The true way of a Swordman who learned harmony to break the limit of a sword is a Rune Knight."
  npc_override_job3_rune02_rune_knight_turisus_rune_means_borde_e6a4f2: "Turisus - This rune means the border and the power of limitation. This is shaped into a yellow round in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_um_you_rune_knight_candi_03d93e: "Um... Are you the Rune Knight candidate that Manuel talked about?"
  npc_override_job3_rune02_rune_knight_umm_great_enough_amount_b69597: "Umm, this is great. Enough amount of living body magical energy has accumulated in your body."
  npc_override_job3_rune02_rune_knight_umm_runes_rune_knights_p_7b2eeb: "Umm, ^0000FFRunes and Rune Knights^000000, ^0000FFThe Principles of Runes^000000, ^0000FFThe Making and use of Runes^000000. Start with these 3..."
  npc_override_job3_rune02_rune_knight_umm_seems_you_ve_passed_0a0877: "Umm, it seems that you've passed Lunarea's test? I guess I won't have to test more for the basics."
  npc_override_job3_rune02_rune_knight_umm_you_re_back_how_315c69: "Umm, you're back? How's it like in the Ash-Vacuum?"
  npc_override_job3_rune02_rune_knight_undeniably_our_rune_knig_fce82f: "Undeniably our Rune Knights have some differences but we should not forget our Swordsman roots."
  npc_override_job3_rune02_rune_knight_unlike_humans_living_thi_ca5ed5: "Unlike humans, the living things in the Ash-Vacuum preserve magical energy by holding it in their bodies."
  npc_override_job3_rune02_rune_knight_until_then_i_ll_here_3f0972: "Until then, I'll be here to discover more candidates just like you."
  npc_override_job3_rune02_rune_knight_until_you_become_honorab_af16b6: "Until you become an honorable Rune Knight I cannot help you control your powers in Midgard."
  npc_override_job3_rune02_rune_knight_urj_rune_means_destiny_p_2f593e: "Urj - This rune means destiny and the power of restriction. This is shaped into the form of a violet spiral line in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_use_these_runes_i_cast_bdd86c: "To use these runes, I will cast a special buff spell over you."
  npc_override_job3_rune02_rune_knight_verkana_rune_means_richn_c7d3bc: "Verkana - This rune means richness, birth and the power of defense and protection. This is shaped into the form of a gold-color star in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_very_cold_feeling_rune_k_6d853a: "A very cold feeling Rune Knight dressed in black from head to toe is scowling at me."
  npc_override_job3_rune02_rune_knight_vicious_souls_they_keep_642b8c: "The vicious souls that they keep even after being dead is the great source of magical powers."
  npc_override_job3_rune02_rune_knight_wait_i_ll_collect_all_0822a0: "Wait, I'll collect all the rune stones provided before. There's a certain limit on using the rune stones that's made for the test."
  npc_override_job3_rune02_rune_knight_wait_place_prohibited_i_c3c75c: "Wait! This place is prohibited. I don't mind you wandering about but, don't ever disturb me again."
  npc_override_job3_rune02_rune_knight_walking_way_sword_perpet_83aee6: "Walking the way of the sword is a perpetual battle. From now on you may have a rough journey ahead of you..."
  npc_override_job3_rune02_rune_knight_we_been_living_secret_he_54e1bb: "We have been living in secret here in the deep of Glast Heim for a half century but it's time to let the world know our purpose."
  npc_override_job3_rune02_rune_knight_we_guess_he_had_been_9786c6: "We guess he had been already in touch with the Laphine tribe long before the dimensional rift was discovered to get to the Ash-Vacuum."
  npc_override_job3_rune02_rune_knight_we_like_other_knights_wh_8a9b0e: "We are not like the other Knights who are absorbed with pomp and circumstance so you may not know of us yet."
  npc_override_job3_rune02_rune_knight_we_looking_forward_you_h_a4d515: "We are looking forward to you helping the Rune Knights spread honor throughout the world."
  npc_override_job3_rune02_rune_knight_we_rune_knights_group_le_71e99d: "We are the Rune Knights. A group that leads the true power as well as the physical strength to the righteous way of the Sword."
  npc_override_job3_rune02_rune_knight_welcome_724486: "Welcome."
  npc_override_job3_rune02_rune_knight_welcome_you_going_gather_9c2783: "Welcome, {0}. Are you going to the gathering place?"
  npc_override_job3_rune02_rune_knight_welcome_you_one_taking_j_57e788: "Welcome, you are the one taking the job training test of the Rune Knights. I am Serpeone."
  npc_override_job3_rune02_rune_knight_well_first_i_ll_give_49d9c7: "Well first, I'll give you an assignment. Let's start by studying. Go to the library and study these books."
  npc_override_job3_rune02_rune_knight_well_i_d_better_go_839e72: "Well I'd better go now for the remaining candidates."
  npc_override_job3_rune02_rune_knight_well_my_job_done_now_5fe77b: "Well, my job is done now. Would you like to start your new life as a Rune Knight?"
  npc_override_job3_rune02_rune_knight_well_person_your_strengt_880a63: "Well, a person of your strength must have been there already no?"
  npc_override_job3_rune02_rune_knight_well_please_follow_me_8c8de4: "Well, please follow me."
  npc_override_job3_rune02_rune_knight_well_then_i_ll_waiting_7618f1: "Well then, I'll be waiting here so take the test."
  npc_override_job3_rune02_rune_knight_well_there_unidentified_068564: "Well, there is an unidentified person here."
  npc_override_job3_rune02_rune_knight_weren_t_you_listening_cf702f: "Weren't you listening?"
  npc_override_job3_rune02_rune_knight_when_making_rune_stone_u_ccacb0: "When making a rune stone by using Rune Mastery, it can be made into the rune property that you want but it's classified as a Rune Knights' own ability."
  npc_override_job3_rune02_rune_knight_when_s_your_turn_enter_9a2a75: "When it's your turn to enter you will be sent there directly."
  npc_override_job3_rune02_rune_knight_when_test_done_talk_me_464353: "When the test is done, talk to me. Anyway you'll need to care about the tests progressing with other people."
  npc_override_job3_rune02_rune_knight_when_test_done_talk_me_580756: "When the test is done, talk to me... anyway you'll need to care about the tests progressing with other people."
  npc_override_job3_rune02_rune_knight_when_time_comes_there_wa_9fe876: "When the time comes there will be a way to help you surpass that limit. Until the day that your strength has grown comes, we can at least still have a drink together."
  npc_override_job3_rune02_rune_knight_when_you_become_rune_kni_8a002c: "But when you become a Rune Knight, you'll need to make sure that you join the expeditionary team in order to fully explore the Ash-Vacuum."
  npc_override_job3_rune02_rune_knight_when_you_get_into_gather_b3fbd0: "When you get into the gathering place, talk to Captain Tigris. He's always waiting for new members to show up."
  npc_override_job3_rune02_rune_knight_when_you_making_rune_sto_f4db1a: "When you making a Rune stone with a Rune Furnace, the type of rune is determined by the magical energy put into it, and it cannot be changed."
  npc_override_job3_rune02_rune_knight_when_you_operate_rune_fu_08ed2c: "When you operate the Rune Furnace, the magical energy of the body gets concentrated through it and it enables the change into a Rune Stone."
  npc_override_job3_rune02_rune_knight_when_you_ready_go_test_b05934: "When you are ready to go to the test field talk to me."
  npc_override_job3_rune02_rune_knight_whispers_sage_serpeone_d_9dba0c: "- Whispers of the sage Serpeone are delivered to my mind. -"
  npc_override_job3_rune02_rune_knight_whoa_don_t_look_me_4d0923: "Whoa don't look at me like that. Okay, you see that? Aspiring Rune Knight. Go back to Lunarea and take the test as she says. That'll be good for you."
  npc_override_job3_rune02_rune_knight_why_all_rune_knights_bla_066931: "Why are all of the Rune Knights blabberers or uncommunicative and combative...?"
  npc_override_job3_rune02_rune_knight_won_t_you_join_our_c61e68: "Won't you join our brethren? You look like you're fully qualified to become one of us."
  npc_override_job3_rune02_rune_knight_wow_great_image_rune_sto_ae0f9d: "Wow! This is great. The image of the rune stone in my head and the modeled rune stone match perfectly. It's well made."
  npc_override_job3_rune02_rune_knight_wow_what_s_you_ve_83cfc3: "Wow! What's this? You've made over 20. It's ok for now but remember to follow directions next time."
  npc_override_job3_rune02_rune_knight_wunjo_rune_means_intelli_b6d8ca: "Wunjo - This rune means intelligence and the power of wisdom. This is shaped into the form of an emerald star in a Rune Furnace."
  npc_override_job3_rune02_rune_knight_you_cursed_ghost_place_y_d30659: "Are you a cursed ghost of this place? Or are you an ignorant adventurer?"
  npc_override_job3_rune02_rune_knight_you_don_t_want_touch_0ff110: "You don't want to touch that thing. Believe me, I'm not kidding."
  npc_override_job3_rune02_rune_knight_you_found_place_correctl_f22b4f: "You found this place correctly. Jungberg sent me to send you to the gathering place."
  npc_override_job3_rune02_rune_knight_you_gathering_enough_mag_1ecd2d: "Are you gathering enough magical energy? Or do you have any questions?"
  npc_override_job3_rune02_rune_knight_you_haven_t_collected_en_49add6: "You haven't collected enough magical energy yet."
  npc_override_job3_rune02_rune_knight_you_know_place_called_gl_98d472: "You know the place called Glast Heim? There's a Rune Knight waiting for you there, he will guide you to the entrance of Glast Heim Tower."
  npc_override_job3_rune02_rune_knight_you_ll_wait_regulation_t_c0d5ec: "You'll have to wait... it is regulation that the test must take place one by one."
  npc_override_job3_rune02_rune_knight_you_look_like_you_don_0de8d9: "You look like you don't understand why I'm repeating the teaching of the story already written in the book."
  npc_override_job3_rune02_rune_knight_you_might_know_already_i_c50e97: "You might know already, if you are riding a Peco Peco, you should have left it behind. If you brought it, leave it and come again."
  npc_override_job3_rune02_rune_knight_you_might_walking_way_sw_46ea32: "You might be walking the way of the sword but you are not a Rune Knight yet. Don't wander around here too much if you know what I mean."
  npc_override_job3_rune02_rune_knight_you_now_honorable_rune_k_c9ddfa: "You are now an honorable Rune Knight."
  npc_override_job3_rune02_rune_knight_you_now_member_our_selec_23668c: "You are now a member of our select brethren. I can still remember when I first met you."
  npc_override_job3_rune02_rune_knight_you_one_who_wants_rune_6c0f1b: "Are you the one who wants to be a Rune Knight? There have been so many today."
  npc_override_job3_rune02_rune_knight_you_re_sure_now_f8f592: "You're sure now?"
  npc_override_job3_rune02_rune_knight_you_read_all_books_libra_06f385: "Have you read all the books from the library? It won't be easy to read but if you are determined to be a Rune Knight, you have to have this kind of basic knowledge."
  npc_override_job3_rune02_rune_knight_you_ready_go_back_rune_22082e: "Are you ready to go back to the Rune Knight gathering place?"
  npc_override_job3_rune02_rune_knight_you_sent_ash_vacuum_peop_ebb15f: "You will be sent to the Ash-Vacuum. The people dispatched to the Midgard post are certified adventurers and officials."
  npc_override_job3_rune02_rune_knight_you_still_smell_like_fle_148991: "You still smell like a fledging. Bring honor to the Rune Knights and raise your power..."
  npc_override_job3_rune02_rune_knight_you_sure_you_don_t_4db118: "Are you sure? You don't know the true elegance of these drinks..."
  npc_override_job3_rune02_rune_knight_you_understand_i_think_t_a4811b: "You have to understand. I think it was the test that shows exactly the test instructor's personality. Hmm..."
  npc_override_job3_rune02_rune_knight_you_ve_been_very_success_213423: "You've been very successful up to the last test."
  npc_override_job3_rune02_rune_knight_you_ve_brought_just_righ_aabcba: "You've brought just the right amount. I'll hand over all the finished rune stones to Captain Tigris."
  npc_override_job3_rune02_rune_knight_you_ve_got_too_many_319fe1: "You've got too many things. You cannot proceed anymore. Please try again after losing some weight."
  npc_override_job3_rune02_rune_knight_you_walk_way_sword_too_cc54f1: "You walk the way of sword too don't you? Then we can understand each other. Drinks taste better when it's with a fellow Swordman."
  npc_override_job3_rune02_rune_knight_you_want_go_back_expedit_b09ee8: "Do you want to go back to the expeditionary team's post?"
  npc_override_job3_rune02_rune_knight_you_want_go_back_gatheri_d98b7f: "You want to go back to the gathering place? If you want I'll send you back there immediately. But to continue the test you'll need to come and see me again."
  npc_override_job3_rune02_rune_knight_you_want_go_back_rune_9e483d: "Do you want to go back the Rune Knight gathering place?"
  npc_override_job3_rune02_rune_knight_you_want_go_out_splendid_36a5f2: "Do you want to go out to the Splendide field?"
  npc_override_job3_rune02_rune_knight_your_name_right_i_see_256c5e: "Your name is {0}, right? I can see clearly that you are qualified to become our comrade."
  npc_override_job3_rune02_rune_knight_your_test_successful_1c6b25: "Was your test successful?"
