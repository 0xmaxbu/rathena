Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_6@tower_EndlessTower_after_making_reservation_335b27: "After making a reservation, you have to talk to NPC behind and select the menu 'Enter the Dungeon' to enter the dungeon."
  npc_override_6@tower_EndlessTower_all_monsters_level_been_68b134: "All Monsters on the {0} Level have been defeated."
  npc_override_6@tower_EndlessTower_all_monsters_st_level_be_7bb9bb: "All Monsters on the 51st Level have been defeated."
  npc_override_6@tower_EndlessTower_all_monsters_st_level_be_a1c87a: "All Monsters on the 1st Level have been defeated."
  npc_override_6@tower_EndlessTower_all_monsters_th_level_be_2e7352: "All Monsters on the 76th Level have been defeated."
  npc_override_6@tower_EndlessTower_all_monsters_th_level_be_5bacf5: "All Monsters on the 26th Level have been defeated."
  npc_override_6@tower_EndlessTower_as_adventurer_there_s_my_cc519d: "As an adventurer, there's my obligation to those in need. I'm also very curious about that place..."
  npc_override_6@tower_EndlessTower_as_soon_as_voice_stopped_6f3b0c: "^0000ffAs soon as the voice stopped talking, an irresistible force lifted and moved you somewhere else."
  npc_override_6@tower_EndlessTower_as_you_may_know_after_869fb9: "As you may know after a few sea voyages, not many people have gone across the ocean beyond the continent. I too have failed to conquer the ocean."
  npc_override_6@tower_EndlessTower_confirmed_party_been_mad_1f5316: "Confirmed the party has been made. Would you like to reserve entrance to the Endless Tower?"
  npc_override_6@tower_EndlessTower_create_purification_ston_d9fe53: "Create the Purification Stone that stays for 30 minutes."
  npc_override_6@tower_EndlessTower_dangerous_here_let_me_mo_e9f0ec: "It is dangerous here. Let me move you to Alberta."
  npc_override_6@tower_EndlessTower_destroy_purification_sto_cf6a82: "Destroy the Purification Stone immediately"
  npc_override_6@tower_EndlessTower_due_tower_s_aftereffects_569701: "Due to the tower's aftereffects, you cannot enter the dungeon right now, {0}hours {1}minutes {2}seconds left to enter the next dungeon."
  npc_override_6@tower_EndlessTower_enter_password_exactly_6f3b0d: "Enter the password exactly."
  npc_override_6@tower_EndlessTower_excellent_now_we_re_good_9d65c1: "Excellent! Now we're good to go. Let's pull up the anchor again!"
  npc_override_6@tower_EndlessTower_excuse_me_you_adventurer_4ba82d: "Excuse me, are you an adventurer?"
  npc_override_6@tower_EndlessTower_farewell_young_adventure_e26bbb: "Farewell, young adventurer. I wish you good luck."
  npc_override_6@tower_EndlessTower_good_bye_now_dc00e5: "Good-bye for now."
  npc_override_6@tower_EndlessTower_good_then_i_ll_combine_8c866a: "Good, then I'll combine these to create a two-handed sword."
  npc_override_6@tower_EndlessTower_guests_huh_i_hope_you_872834: "Guests, huh? I hope you've come here knowing that you'll be buried in this place. If you didn't know, well... it's too late!"
  npc_override_6@tower_EndlessTower_hey_you_remnants_naght_s_1a32f3: "Hey, you have the remnants of Naght Sieger with you."
  npc_override_6@tower_EndlessTower_how_about_hiring_me_as_91e635: "How about hiring me as your first mate?"
  npc_override_6@tower_EndlessTower_how_you_like_play_one_0363eb: "How would you like to play one more round?"
  npc_override_6@tower_EndlessTower_huh_you_sure_you_don_547936: "Huh? Are you sure that you don't mind giving me that much money? Wow, thank you so much!"
  npc_override_6@tower_EndlessTower_i_d_like_talk_you_5e11bb: "I'd like to talk to you more, but I've... I've got to go now."
  npc_override_6@tower_EndlessTower_i_demand_encore_f2dfba: "I demand an encore!"
  npc_override_6@tower_EndlessTower_i_don_t_know_why_430596: "I don't know why you'd need so much money, but here. You can take it."
  npc_override_6@tower_EndlessTower_i_feel_so_lucky_meet_16d64a: "I feel so lucky to meet a warm-hearted adventurer like you. With the money you've given me, I can finally go sailing to the tower again."
  npc_override_6@tower_EndlessTower_i_going_leave_right_away_acaf6a: "I was going to leave right away, but since you've joined me, I should give you time to prepare. I'll be waiting here until you're ready to go."
  npc_override_6@tower_EndlessTower_i_ll_remember_you_as_830086: "I'll remember you as one of a few that have managed to entertain me."
  npc_override_6@tower_EndlessTower_i_m_sorry_ask_you_eb538e: "I'm sorry to ask you this, especially when this is the first time we've ever met, but can you do me a favor? I'll make it short."
  npc_override_6@tower_EndlessTower_i_m_sorry_i_don_bbb503: "...I'm sorry, but I don't think you have 10,000 Zeny. Thank you for your kindness, but I need more than that."
  npc_override_6@tower_EndlessTower_i_m_sorry_i_don_d3efda: "I'm sorry, but I don't have that much money. I'll come back when I save enough."
  npc_override_6@tower_EndlessTower_i_m_sorry_you_don_8bc193: "I'm sorry, but you don't have enough money. I need at least 10,000 Zeny to restock our supplies..."
  npc_override_6@tower_EndlessTower_i_m_sorry_you_ve_eb9b51: "I'm sorry, but you've got the wrong person to ask that."
  npc_override_6@tower_EndlessTower_i_may_applaud_you_your_dab4aa: "I may applaud you for your courage... Of course, I intend to play with you a little bit first."
  npc_override_6@tower_EndlessTower_i_move_you_alberta_c4496e: "I will move you to Alberta."
  npc_override_6@tower_EndlessTower_i_must_underestimated_yo_e9209f: "I must have underestimated you... I didn't expect to see you again."
  npc_override_6@tower_EndlessTower_i_now_allow_you_come_7d3bd0: "I now allow you to come receive an audience from me. Come to me, to Naght Sieger the Hegemon-King of the Darkness!"
  npc_override_6@tower_EndlessTower_i_see_i_guess_you_f1b430: "I see. I guess you aren't as greedy or ambitious as those other adventurers."
  npc_override_6@tower_EndlessTower_i_see_sorry_bother_you_319e4f: "I see... Sorry to bother you. I understand it was too rude to ask something like that to begin with."
  npc_override_6@tower_EndlessTower_i_shall_resurrect_him_yo_affb82: "I shall resurrect him for your next show. Defeat him again, and then I'll gladly accept your challenge."
  npc_override_6@tower_EndlessTower_i_smell_your_sweat_hear_b2e784: "I can smell your sweat, hear the gasps of your exhaustion in combat. Ah~ The human desire for victory always excites me."
  npc_override_6@tower_EndlessTower_i_something_i_must_befor_36c71f: "I have something I must do before I die. I must retrieve the remains of my crew that died in the tower, and give them a proper burial."
  npc_override_6@tower_EndlessTower_i_touched_when_you_accep_07731c: "I was touched when you accepted a request from me, a stranger, so easily. You must truly be one of those good, heroic adventurers. Are you interested in setting out on an ocean voyage?"
  npc_override_6@tower_EndlessTower_i_ve_sailed_few_times_870f3e: "I've sailed a few times... But now that I think about it, I've never gone across the continent."
  npc_override_6@tower_EndlessTower_if_already_upgraded_card_e67c48: "If it is already upgraded or has a card inside, those effects will be disappear. Is this ok with you?"
  npc_override_6@tower_EndlessTower_if_you_dungeon_generated_ac0bd6: "If you have the dungeon generated already, you can enter it. "
  npc_override_6@tower_EndlessTower_let_s_see_who_runs_8f6864: "Let's see who runs fastest. Are you ready?"
  npc_override_6@tower_EndlessTower_let_s_speed_up_little_4a78a9: "Let's speed up a little bit, shall we?"
  npc_override_6@tower_EndlessTower_level_now_being_opened_ec2d53: "*** Level {0} is now being opened. ***"
  npc_override_6@tower_EndlessTower_looking_incredibly_excit_165ded: "^0000ffLooking incredibly excited, the old man ran into the marine shop hurriedly ordering goods. You don't have anything better to do, so you decide to ask him why he is in such a rush.^000000"
  npc_override_6@tower_EndlessTower_make_join_party_more_tha_10c521: "Make or join a party with more than 1 member and try again."
  npc_override_6@tower_EndlessTower_memorial_dungeon_endless_6dbd39: "The memorial dungeon Endless Tower does not exist."
  npc_override_6@tower_EndlessTower_menu_at_0e3d00: "^0000ffAt least half of his story sounded grossly exaggerated, but something caught your ear: he insists that a humongous tower exists on the ocean, and that it's so tall, it scrapes across the sky.^000000"
  npc_override_6@tower_EndlessTower_menu_enter_de5f6f: "Enter the {0}:Return to Alberta:Cancel"
  npc_override_6@tower_EndlessTower_menu_generate_16e939: "Generate dungeon {0}:Enter the dungeon:Return to Alberta:Cancel"
  npc_override_6@tower_EndlessTower_menu_generate_475ec4: "Generate Purification Stone:Remove Purification Stone:Cancel"
  npc_override_6@tower_EndlessTower_menu_i_25fd32: "(i.g.: 1F->1, 25F->25)"
  npc_override_6@tower_EndlessTower_menu_i_ac51fe: "(i.g.: 26F->26, 50F->50)"
  npc_override_6@tower_EndlessTower_menu_i_c655b4: "(i.g.: 76F->76, 99F->99)"
  npc_override_6@tower_EndlessTower_menu_i_ce6ac8: "I'll come back later.:Let's go, now!"
  npc_override_6@tower_EndlessTower_menu_i_f176fc: "(i.g.: 51F->51, 75F->75)"
  npc_override_6@tower_EndlessTower_menu_it_11f899: "It's fine with me. Please make one.:No way!"
  npc_override_6@tower_EndlessTower_menu_make_e3b707: "Make a Two-Handed Sword.:No, thanks."
  npc_override_6@tower_EndlessTower_menu_mysterious_d9bc51: "Mysterious Voice: Who are you to dare intrude upon my sanctuary?!"
  npc_override_6@tower_EndlessTower_menu_no_5abbeb: "No!:Sure thing."
  npc_override_6@tower_EndlessTower_menu_notice_5d1734: "Notice : Taming a monster does not count towards defeating them."
  npc_override_6@tower_EndlessTower_menu_notice_fd6b70: "Notice : In any abnormal situation where you defeat a monster, you can't advance to the next level!"
  npc_override_6@tower_EndlessTower_menu_party_2e5e7f: "Party Name: {0}"
  npc_override_6@tower_EndlessTower_menu_party_8c7899: "Party Leader: {0}"
  npc_override_6@tower_EndlessTower_menu_th_edb1a6: "26th Level:51st Level:76th Level"
  npc_override_6@tower_EndlessTower_menu_yes_01765b: "Yes, let's go!:No, I'm not quite ready..."
  npc_override_6@tower_EndlessTower_menu_you_8d3d86: "^0000ffYou could imagine the heartwretching scene of the dying fleet on their last voyage, even if he didn't explain it any further. A look of somber regret swept over his face as he remained silent a while, and then he said:^000000"
  npc_override_6@tower_EndlessTower_message_engraved_brazier_8db6dd: "- A Message is Engraved on the Brazier -"
  npc_override_6@tower_EndlessTower_mr_janssen_talked_about_87ed98: "^0000ffMr. Janssen talked about his perilous ocean journeys for quite a while. You have enough time on your hands, so you sit down, quietly listening to his story.^000000"
  npc_override_6@tower_EndlessTower_msg_3a52ce: "."
  npc_override_6@tower_EndlessTower_my_crew_starving_few_the_84803f: "My crew was starving, and a few of them walked into the tower in order to find food... They never came back."
  npc_override_6@tower_EndlessTower_my_instincts_told_me_tow_f8e1de: "My instincts told me that tower was dangerous. I was curious, but I wasn't going to risk my life. We waited for them to come back for 7 days until the rainstorm was finally over, but no one returned."
  npc_override_6@tower_EndlessTower_mysterious_voice_echoes_d5d8a3: "^0000ffA mysterious voice echoes through the room as you touch the lucid crystal radiating a strong light.^000000"
  npc_override_6@tower_EndlessTower_naght_sieger_s_body_turn_48626f: "Naght Sieger's body has turned into dark ashes that scattered in the wind."
  npc_override_6@tower_EndlessTower_no_c03f1e: "No..."
  npc_override_6@tower_EndlessTower_no_s_good_enough_i_c7859e: "No, that's good enough. I may just have one small fishing vessel, but I used to be a captain that commanded a fleet."
  npc_override_6@tower_EndlessTower_nooo_my_soul_my_shell_37efe1: "Nooo! My soul... My shell...! Nooo~!"
  npc_override_6@tower_EndlessTower_npc_manages_crystal_th_l_3bc9f5: "This NPC manages the crystal on the 100th Level. Please enter the password."
  npc_override_6@tower_EndlessTower_npc_manages_tower_st_th_1e6a98: "This NPC manages the tower from the 1st to the 25th Level."
  npc_override_6@tower_EndlessTower_npc_manages_tower_st_th_392df1: "This NPC manages the tower from the 26st to the 50th Level."
  npc_override_6@tower_EndlessTower_npc_manages_tower_st_th_f13124: "This NPC manages the tower from the 51st to the 75th Level."
  npc_override_6@tower_EndlessTower_npc_manages_tower_th_th_b252e6: "This NPC manages the tower from the 76th to the 99th Level."
  npc_override_6@tower_EndlessTower_okay_then_3edbd8: "...Okay then..."
  npc_override_6@tower_EndlessTower_okay_time_come_make_my_716cdb: "Okay, the time has come to make my appearance!"
  npc_override_6@tower_EndlessTower_old_man_after_finishing_2b2193: "^0000ffThe old man, after finishing his orders, walks towards you.^000000"
  npc_override_6@tower_EndlessTower_once_again_i_had_such_74bc25: "Once again, I had such a great time, humans. I look forward to seeing you again."
  npc_override_6@tower_EndlessTower_one_who_scatters_ashes_d_bc6d4b: "The one who scatters the ashes of the darkness in this place shall become one step closer to Naght Sieger, the Hegemon King of the Darkness..."
  npc_override_6@tower_EndlessTower_our_desperation_survive_5d7fbd: "In our desperation to survive, we abandoned all our goods, and left the tower only with a little bit of the water and edible plants we'd found around the tower. When we finally reached land, I was the only one alive..."
  npc_override_6@tower_EndlessTower_party_leader_did_generat_5a6394: "The party leader did not generate the dungeon yet."
  npc_override_6@tower_EndlessTower_please_enter_correct_pas_a22c53: "Please enter the correct password."
  npc_override_6@tower_EndlessTower_please_enter_level_numbe_cf028a: "Please enter the Level number to open."
  npc_override_6@tower_EndlessTower_please_enter_password_046bca: "Please enter the password."
  npc_override_6@tower_EndlessTower_please_enter_password_99d476: "Please enter the password"
  npc_override_6@tower_EndlessTower_purification_stone_destr_33ef8e: "The Purification Stone will be destroyed in one minute."
  npc_override_6@tower_EndlessTower_radiating_crystal_piece_956163: "^0000ffThe radiating crystal piece seems to beckon you, just like last time.^000000"
  npc_override_6@tower_EndlessTower_records_after_effects_re_0e514b: "^0000ffThe records and after effects related to the Endless Tower have been removed. You can generate and enter the Endless Tower again.^000000"
  npc_override_6@tower_EndlessTower_records_aftereffects_rel_7b3cdc: "^0000ffThe records and aftereffects related to the Endless Tower have been removed. You can generate and enter the Endless Tower again.^000000"
  npc_override_6@tower_EndlessTower_remaining_monsters_level_48b90d: "Remaining Monsters on the {0} Level - {1}"
  npc_override_6@tower_EndlessTower_remaining_monsters_st_le_5d0bb7: "Remaining Monsters on the 1st Level - {0}"
  npc_override_6@tower_EndlessTower_remaining_monsters_st_le_68db04: "Remaining Monsters on the 51st Level - {0}"
  npc_override_6@tower_EndlessTower_remaining_monsters_th_le_4fe072: "Remaining Monsters on the 26th Level - {0}"
  npc_override_6@tower_EndlessTower_remaining_monsters_th_le_9a93c0: "Remaining Monsters on the 76th Level - {0}"
  npc_override_6@tower_EndlessTower_remaining_targets_ea_001664: "Remaining Targets {0}ea"
  npc_override_6@tower_EndlessTower_reservation_failed_b861ab: "^0000ff{0} ^000000- Reservation Failed!"
  npc_override_6@tower_EndlessTower_s_still_too_early_celebr_9726f4: "It's still too early to celebrate your victory against my right-hand man Knothen because he isn't completely destroyed!"
  npc_override_6@tower_EndlessTower_s_you_liberated_us_evil_d1c31c: "It's you that have liberated us from the evil Naght Sieger."
  npc_override_6@tower_EndlessTower_seems_engulfed_huge_vort_69196a: "[ {0} ], seems to be engulfed by a huge vortex"
  npc_override_6@tower_EndlessTower_shall_we_leave_now_d86c9c: "Shall we leave now?"
  npc_override_6@tower_EndlessTower_sigh_i_don_t_know_7d3523: "Sigh... I don't know if I can ever go back to sailing the sea..."
  npc_override_6@tower_EndlessTower_so_all_i_could_cast_bb5d2c: "So all I could do was cast anchor at that humongous tower after my fleet was wrecked. At first, we were only going to stay there until the rainstorm was over, but it didn't end as soon as we had hoped."
  npc_override_6@tower_EndlessTower_sure_no_problem_come_bac_6f97e7: "Sure, no problem. Come back when you're ready."
  npc_override_6@tower_EndlessTower_sure_no_problem_i_ll_5a507f: "Sure, no problem. I'll be waiting for your return."
  npc_override_6@tower_EndlessTower_t_happening_i_t_defeated_417fc4: "This... This can't be happening! I can't be defeated!"
  npc_override_6@tower_EndlessTower_th_level_s_crystal_been_12a148: "The 100th Level's crystal has been activated."
  npc_override_6@tower_EndlessTower_thank_you_extremely_dang_f60354: "Thank you, but it is an extremely dangerous place. I have my duty to fulfill, but you don't have any obligation to me or them. I don't wish to sacrifice someone as young as you to such a dangerous place."
  npc_override_6@tower_EndlessTower_thank_you_so_much_now_12d041: "Thank you so much! Now I can stock up on food and materials for my ship. You're kind, very kind!"
  npc_override_6@tower_EndlessTower_thank_you_so_much_now_7d434a: "Thank you so much. Now we can escape from this cold and dark place... to heaven."
  npc_override_6@tower_EndlessTower_then_pull_up_anchor_firs_2a73b4: "Then pull up the anchor, first mate!"
  npc_override_6@tower_EndlessTower_they_may_appear_one_hand_167db6: "They may appear to be one-handed swords, but I can put them together to make a two-handed one if you want. That's the only way I can repay you for freeing me."
  npc_override_6@tower_EndlessTower_try_reserve_da0d35: "^0000ff{0}^000000 - Try to reserve"
  npc_override_6@tower_EndlessTower_unfortunately_time_come_c656ed: "Unfortunately, the time has come to end the show."
  npc_override_6@tower_EndlessTower_unknown_error_occurred_58bda4: "An unknown error has occurred."
  npc_override_6@tower_EndlessTower_wait_here_7b7765: "^008800Wait here!!"
  npc_override_6@tower_EndlessTower_warning_40d6c8: "-Warning-"
  npc_override_6@tower_EndlessTower_warp_level_you_need_ashe_aee1b0: "To warp to the {0} Level, you need {1} Ashes of the Darkness."
  npc_override_6@tower_EndlessTower_welcome_aboard_first_mat_296974: "Welcome aboard, first mate."
  npc_override_6@tower_EndlessTower_welcome_my_place_intrude_90be79: "Welcome to my place, intruders. I've had fun watching you endure all the difficulties I've set before you."
  npc_override_6@tower_EndlessTower_well_i_guess_they_aren_fe7d93: "Well, I guess they aren't too challenging for you."
  npc_override_6@tower_EndlessTower_well_travel_ocean_again_7e0fe3: "Well, to travel the ocean again, we need to restock on goods. If you give me 10,000 Zeny, I'll take care of the rest."
  npc_override_6@tower_EndlessTower_why_didn_t_you_go_3630a6: "Why didn't you go in there with them?"
  npc_override_6@tower_EndlessTower_why_you_adventurers_alwa_fcc09c: "This is why you adventurers always end up dead."
  npc_override_6@tower_EndlessTower_yes_getting_exciting_1707c0: "Yes, this is getting exciting!"
  npc_override_6@tower_EndlessTower_you_canceled_1cfdd5: "You have canceled it."
  npc_override_6@tower_EndlessTower_you_donate_zeny_me_s_d3652a: "Can you donate ^0000ff10,000 Zeny^000000 to me? It's for a cause that's important to me..."
  npc_override_6@tower_EndlessTower_you_donated_zeny_captain_d0ad9a: "^0000ffYou have donated 10,000 Zeny to Captain Janssen^000000."
  npc_override_6@tower_EndlessTower_you_enter_dungeon_after_6d3af5: "You can enter the dungeon after making the party."
  npc_override_6@tower_EndlessTower_you_know_i_like_watching_b18f53: "You know, I like watching humans running around in fear."
  npc_override_6@tower_EndlessTower_you_ll_soon_know_mine_d66221: "You'll soon know. Mine is the face of death!"
  npc_override_6@tower_EndlessTower_you_only_enter_number_24d2af: "You can only enter a number from 26 to 50."
  npc_override_6@tower_EndlessTower_you_only_enter_number_39c701: "You can only enter a number from 76 to 99."
  npc_override_6@tower_EndlessTower_you_only_enter_number_a66717: "You can only enter a number from 1 to 25."
  npc_override_6@tower_EndlessTower_you_only_enter_number_eca221: "You can only enter a number from 51 to 75."
  npc_override_6@tower_EndlessTower_you_re_carrying_too_much_01d07a: "You're carrying too much stuff. Why don't you put some of it away, and then come back.^000000"
  npc_override_6@tower_EndlessTower_you_re_carrying_too_much_2d8a49: "You're carrying too much stuff. Why don't you put some of it away, and then come back?"
  npc_override_6@tower_EndlessTower_you_took_sip_spring_s_658417: "^0066ffYou took a sip of the spring's clear water, and you feel invigorated.^000000"
  npc_override_6@tower_EndlessTower_you_want_know_who_i_529f73: "Do you want to know who I am?"
