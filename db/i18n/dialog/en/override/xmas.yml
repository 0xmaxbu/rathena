  npc_override_xmas_lutie_hashokii_boring_clown_fi_d1fd46: "Hashokii, the boring clown? At first, he seems kind of dumb and not really that funny. But deep inside, he cares a lot about other people."
  npc_override_xmas_lutie_haw_haw_haw_5b1877: "Haw haw haw!"
  npc_override_xmas_lutie_he_always_foremost_resea_23269b: "He was always foremost in the research of alchemy and needed rare materials to conduct his studies. Because of that, he had to travel the world in search of materials containing magical energies..."
  npc_override_xmas_lutie_he_knows_me_too_well_738e99: "He knows me too well. I almost can't stop from giving that man some pickles. Yes, even I know my pickles are the best in town!"
  npc_override_xmas_lutie_he_makes_such_good_audie_81595e: "He makes such a good audience for my show. But to be honest, I'm not sure if he really likes it or not. Most people don't seem to care for my jokes."
