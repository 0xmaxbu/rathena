  npc_override_xmas_lutie_oh_well_if_you_didn_86019f: "Oh well, if you didn't visit Snowysnow yet, you should see him at least once. He's funny!"
  npc_override_xmas_lutie_oh_woooooow_9c7334: "Oh woooooow~!"
  npc_override_xmas_lutie_oh_y_y_you_ve_a970ee: "Oh? Y-y-you've got the stuff? Goooooooood. It's been so long since I've been able to have some of this... G-give it to me!"
  npc_override_xmas_lutie_oh_yeah_heard_about_me_255393: "Oh yeah? Heard about me from Poze, did you? Haw haw haw! Yeah, I know a little bit about Snowysnow. In fact, I may even be his weak point, since..."
  npc_override_xmas_lutie_oh_yes_i_m_sorry_ae7be9: "Oh yes, I'm sorry. I almost forgot what I promised you. You asked me about Snowysnow's magical gift bag, didn't you?"
  npc_override_xmas_lutie_oh_yes_yes_i_see_3b6bc9: "Oh. Yes, yes, I see..."
  npc_override_xmas_lutie_okay_now_i_think_i_cad75b: "Okay, now I think I better be ready to pickle some cabbages. If you didn't know already, I make the best pickles around! Why don't you visit me later and try some?"
  npc_override_xmas_lutie_one_day_his_travels_brou_e51803: "One day, his travels brought him to a northern village known for its freezing weather. But when he arrived, he was welcomed by a smouldering town that had recently been destroyed."
  npc_override_xmas_lutie_one_day_when_apprentice_0cc655: "One day when apprentice of the great alchemist visited Lutie, I came to listen in on a conversation between him and Uncle Hairy."
  npc_override_xmas_lutie_one_fateful_day_some_ugl_154e71: "One fateful day, some ugly old woman came to our town. People say her name was 'Merlophechum,' and that she was from some strange cave town where the weather was always hot."
  npc_override_xmas_lutie_only_way_get_lutie_here_fefe44: "The only way to get to Lutie is here in Al de Baran!"
  npc_override_xmas_lutie_ooh_af75df: "Ooh~!"
  npc_override_xmas_lutie_ooh_i_m_trying_think_d48faf: "Ooh, I'm trying to think of a good show to put on for Charu Charu and Marcell!"
  npc_override_xmas_lutie_oops_i_think_i_ve_8cce43: "Oops, I think I've talked a bit much. Merry Christmas~!"
  npc_override_xmas_lutie_philip_varsez_214e5e: "^3355FFPhilip Varsez^000000!"
  npc_override_xmas_lutie_pick_anything_3fd2d5: "Pick anything"
