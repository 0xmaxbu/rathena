  npc_override_xmas_lutie_please_try_again_cefdd7: "- Please try again -"
  npc_override_xmas_lutie_poze_gave_me_his_glamour_a661ed: "^3355FFPoze^000000 gave me his glamour photo with his address on it, and told me to visit him whenever I'm feeling blue. I was so happy to hear that..."
  npc_override_xmas_lutie_poze_love_duffle_she_s_2aae5d: "Poze is in love with Duffle. And she's kind to everybody, except for Poze."
  npc_override_xmas_lutie_really_excited_618b9e: "be really excited!"
  npc_override_xmas_lutie_roughest_af629c: "'^3355FFThe roughest"
  npc_override_xmas_lutie_roughest_salt_world_6eaa3b: "roughest salt in the world.^000000"
  npc_override_xmas_lutie_s_810442: "^3355FFIt's...^000000"
  npc_override_xmas_lutie_s_amazing_land_blessed_b_5ad9a8: "It's an amazing land blessed with the beauty of winter, and a year round atmosphere of festivity!"
  npc_override_xmas_lutie_s_believed_snowysnow_s_s_853f53: "It's believed that Snowysnow's snow used to cover a mysterious field that would be filled with the bloom of magical flowers."
  npc_override_xmas_lutie_s_freezing_out_here_char_69d6e1: "It's freezing out here...! And Charu Charu makes me colder with his unbearable jokes. And the wind's blowing so hard!"
  npc_override_xmas_lutie_s_original_santa_claus_a8a2cc: "^3355FFIt's the original Santa Claus!^000000"
  npc_override_xmas_lutie_s_pretty_much_all_i_1fd17a: "But that's pretty much all I know. For the actual details, you should ask ^3355FFUncle Hairy Cantata^000000."
  npc_override_xmas_lutie_s_snowysnow_5fedf1: "It's ^3355FFSnowysnow^000000,"
  npc_override_xmas_lutie_s_weird_people_lutie_cal_85a32d: "It's weird that the people of Lutie call me a mysterious, magical snowman. I mean, inside, aren't I just the same as regular people?"
