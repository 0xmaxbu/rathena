  npc_override_xmas_christmas_2013_ah_yes_i_think_i_afde40: "Ah.. yes.. I think I am..."
  npc_override_xmas_christmas_2013_ah_yes_thank_you_e0be87: "Ah... yes, thank you."
  npc_override_xmas_christmas_2013_anyway_december_day_comi_8c4434: "Anyway, this December, the day is coming...."
  npc_override_xmas_christmas_2013_arg_arrrrrrrrg_hurts_noo_a5784b: "ARG! ....Arrrrrrrrg!! It hurts! Noooo!!! They're waiting for me!!!"
  npc_override_xmas_christmas_2013_argh_who_c0f201: "Argh!!!!! Who is this?!"
  npc_override_xmas_christmas_2013_as_i_m_single_i_6a866a: "As I'm single! I'd never let couples enjoy this Christmas!!"
  npc_override_xmas_christmas_2013_beginning_celebration_bi_50aeaf: "In the beginning was a celebration of the birth of our Lord! Then, why...how...when did it became a day for couples??!"
  npc_override_xmas_christmas_2013_biologically_speaking_li_c5849a: "Biologically speaking, limbic system in the cerebrum enables us to be sociable, to communicate with people, to entertain etc."
  npc_override_xmas_christmas_2013_break_up_couples_make_ch_6d4d8a: "Break up couples and make Christmas party only for singles?"
  npc_override_xmas_christmas_2013_break_up_couples_should_232cf2: "Break up couples...this should be fun!!"
  npc_override_xmas_christmas_2013_break_up_least_couples_c_6f3cd3: "Break up at least 5 couples and come back to me!"
  npc_override_xmas_christmas_2013_breaking_up_couples_98dd99: "Breaking up couples..."
  npc_override_xmas_christmas_2013_bring_stolen_cookie_stol_0452c1: "Bring ^ff000010 Stolen Cookie, 10 Stolen Candy, and 10 Bag Of Selling Goods^000000 from those damn raccoons!"
  npc_override_xmas_christmas_2013_charrrrr_sharrrrrrrr_din_a4185f: "Charrrrr Sharrrrrrrr Ding!~"
  npc_override_xmas_christmas_2013_christmas_couples_5f96bc: "Christmas for couples?"
  npc_override_xmas_christmas_2013_christmas_songs_everywhe_f5247a: "Christmas songs everywhere, bright colored lights, pouring white snow, and couples seeing each other with smile on their faces...couples...COUPPPLEEES...!!!!"
  npc_override_xmas_christmas_2013_come_closer_me_my_side_533a37: "...Come closer to me. To my side."
  npc_override_xmas_christmas_2013_conquering_world_s_usele_8664b4: "Conquering the world... It's useless compared to what we've feeling right now."
  npc_override_xmas_christmas_2013_could_you_really_give_me_64f710: "Could you really give me anything that I want...?"
  npc_override_xmas_christmas_2013_couple_betrayer_you_betr_b48bbb: "- To be a couple is to be a betrayer! You betray us, you die!!!"
  npc_override_xmas_christmas_2013_couple_breaking_point_5139cc: "- Couple breaking point"
  npc_override_xmas_christmas_2013_course_i_m_prepared_keep_fa4daf: "Of course, I'm prepared and will keep going... I'll follow you forever even if I shall be in any kind of agony."
