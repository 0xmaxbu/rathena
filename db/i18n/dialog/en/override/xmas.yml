  npc_override_xmas_lutie_before_you_leave_you_rea_d899cf: "Before you leave, you really should meet and talk to Snowysnow, even if it's only once. He's really a nice guy and fun to talk to."
  npc_override_xmas_lutie_being_wise_alchemist_he_4d0f68: "Being the wise Alchemist that he is, Varsez deduced that Snowysnow sacrificed himself to protect those two babies from the great disaster that had destroyed the village."
