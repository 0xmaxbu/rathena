  npc_override_xmas_lutie_he_s_snowman_doesn_t_985683: "He's a snowman that doesn't have any legs. No wonder he hasn't come to visit me. What a shame, what a shame. I guess I better go visit him instead."
  npc_override_xmas_lutie_he_s_so_warm_hearted_1a799d: "But he's so warm hearted~! Sometimes, I talk to Snowysnow the snowman. For some weird reason, he can talk just like us!"
