  npc_override_xmas_christmas_2013_d_don_t_too_close_05f967: "D..don't be too close to me!"
  npc_override_xmas_christmas_2013_damn_you_taste_wrath_sin_b11fd0: "Damn you! Taste the wrath of the Singles Union Army!!!"
  npc_override_xmas_christmas_2013_dear_succubus_you_really_723e8b: "Dear Succubus, can you really overcome any kind of agony if you are with me?"
  npc_override_xmas_christmas_2013_did_you_kick_ass_raccoon_50e611: "Did you kick the ass of the Raccoon Hooray team? Oh! You've brought all the items we need. We will be able to feel some Christmas mood with it!"
  npc_override_xmas_christmas_2013_ding_ding_ding_dong_ding_d0e7b3: "Ding ding ding dong ding ding ding dong Ding ding ding dong ding ding ding dong"
  npc_override_xmas_christmas_2013_dingding_dong_ding_8e838a: "Dingding dong Ding!~"
  npc_override_xmas_christmas_2013_dingdingding_ding_74606a: "Dingdingding ding!~"
  npc_override_xmas_christmas_2013_doesn_t_matter_as_long_a89090: "It doesn't matter as long as I am with you, my master..."
  npc_override_xmas_christmas_2013_doesn_t_matter_if_you_449135: "It doesn't matter if you brought more, I will take them ALL!!"
