  npc_override_xmas_lutie_how_did_i_ever_get_683ecf: "How did I ever get to this town? And how in the world am I able to talk?! I-It's not natural, is it? Does... Does that make me a monster?"
  npc_override_xmas_lutie_how_he_created_how_he_6e4c27: "How he was created, and how he thinks and talks like a human is such a mystery..."
  npc_override_xmas_lutie_however_everyone_knows_s_0bab76: "However, everyone knows that Snowysnow is kind and loving towards others. So we're never worried about Snowysnow's powers."
  npc_override_xmas_lutie_huh_what_s_look_your_493bd6: "Huh? What's that look on your face for? Snowysnow has a big gift bag inside of his body, and gives gifts whenever he feels like it. What's so hard to believe about that?"
  npc_override_xmas_lutie_hurry_now_dear_983750: "Hurry now, dear,"
  npc_override_xmas_lutie_hurry_up_84d001: "and hurry up."
  npc_override_xmas_lutie_i_already_know_854c3b: "I already know that!"
  npc_override_xmas_lutie_i_also_heard_snowysnow_d_79ccee: "I also heard Snowysnow doesn't have a mommy or daddy too. And I also heard Snowysnow and us weren't born here, but somewhere else."
  npc_override_xmas_lutie_i_born_area_north_where_dcc7d4: "I was born in an area to the north where it snowed all the time, and was much colder than Lutie, if you can believe that."
  npc_override_xmas_lutie_i_d_rather_stay_snowysno_b37633: "I'd rather stay with ^3355FFSnowysnow^000000~"
  npc_override_xmas_lutie_i_didn_t_notice_how_60b0a7: "I didn't notice how much time passed after that, but when I woke up, I was here. Well, I can say that this place, Lutie, is pretty much like heaven."
  npc_override_xmas_lutie_i_don_t_even_know_a15b0f: "I don't even know what I am. But even so, the people of Lutie try to accept me no matter what."
  npc_override_xmas_lutie_i_feel_christmas_spirit_2495ee: "I can feel the Christmas spirit all around me! It's even in the eyes of the young travelers who've come out here all the way to Lutie. Hoho, I wish you a Merry Christmas!"
  npc_override_xmas_lutie_i_figured_something_out_438f7b: "I figured something out a few days ago. In the Christmas dungeon, you'll run into creatures that are similar to those outside of town."
  npc_override_xmas_lutie_i_guess_you_should_talk_6facc3: "I guess you should talk to the other people living in Lutie if you want to learn more about the mystery of Snowysnow..."
  npc_override_xmas_lutie_i_keep_place_personally_a56a28: "I keep this place and personally transport people who want to visit Lutie. Please ask Santa Claus over there if you want to leave town. He will let you know the way out of Lutie."
  npc_override_xmas_lutie_i_knew_i_needed_5a72b6: "I knew I needed"
  npc_override_xmas_lutie_i_know_903076: "I know"
  npc_override_xmas_lutie_i_know_s_because_she_93b4ff: "But I know that's because she likes him a whole whole lot! Hee hee hee!"
  npc_override_xmas_lutie_i_know_what_he_thinks_371cd4: "I know what he thinks... Ho ho ho~! He intends to make me feel happy so that I'll give him some free jars of pickles! Oh well~!"
  npc_override_xmas_lutie_i_like_her_cooking_becau_983aeb: "I like her cooking because it's soooo delicious! Sometimes, she gives me grape syrup on snow flakes. Anyway, please deliver that salt for me, buddy~!"
  npc_override_xmas_lutie_i_ll_see_you_again_0f916f: "I'll see you again, someday! You'll always be in my heart~"
  npc_override_xmas_lutie_i_m_baffee: "I'm..."
  npc_override_xmas_lutie_i_m_guessing_monsters_wa_c2f8b4: "I'm guessing that monsters wandered here from outside of town, and were changed by the cold weather here. So monsters adapted to live in this environment."
  npc_override_xmas_lutie_i_m_santa_claus_i_cc1715: "I'm Santa Claus, and I bring gifts to every good boy and girl on Christmas!"
  npc_override_xmas_lutie_i_m_santa_guide_people_2e7f13: "I'm a Santa that will guide people to Lutie, the Christmas Town. Ask me at any time, and I'll magically send you there~"
  npc_override_xmas_lutie_i_m_so_lonely_e6f50c: "I'm so lonely!"
  npc_override_xmas_lutie_i_m_sure_4c6cf6: "I'm sure of it!"
  npc_override_xmas_lutie_i_made_love_human_i_94c4e5: "I was made with love by a human, and I was really happy there. Life was simple, but it was full of quiet bliss."
  npc_override_xmas_lutie_i_suppose_if_you_re_bc7cef: "I suppose if you're really Snowysnow's friend, he will trust you enough to give it to you so you can deliver it to me. And in any case, I'll need more of it soon."
  npc_override_xmas_lutie_i_t_tell_you_how_a5d313: "I can't tell you how, but when Snowysnow was revived, there was a reaction between the Alchemist's materials and the energies of Snowysnow's snow."
  npc_override_xmas_lutie_i_thought_i_could_live_14ccd7: "I thought I could live the rest of my life in that kind of contentment. But... It was not to be."
  npc_override_xmas_lutie_i_thought_least_i_could_39b598: "I thought the least I could do for my son was get something cold to bring down his fever, but the snow of Lutie kept on melting after being placed on his forehead. He was burning up, and I was failing to relieve him."
  npc_override_xmas_lutie_i_ve_heard_s_well_a6a1a5: "I've heard that it's well decorated and looks just like a Toy Factory inside, where everything is so cute and pretty. They are Toy Soldiers and Gift Boxes as far as the eye can see!"
  npc_override_xmas_lutie_i_ve_heard_snowysnow_us_e85468: "I've heard that Snowysnow and us actually come from the same place, although I'm not sure yet. But I know that Snowysnow and me have the same kind of burns on our body."
  npc_override_xmas_lutie_i_wish_all_you_joy_f5a40e: "I wish all of you joy"
  npc_override_xmas_lutie_iceporing_local_people_u_a60c6a: "It was an ^3355FFIceporing^000000! The local people used to call it 'Icepantzering.' Anyway, I was able to save my boy's life with it. Thank goodness something like that was around in this town."
  npc_override_xmas_lutie_if_you_already_met_uncle_2dbd6a: "If you already met Uncle Cantata, you must know by now that Snowysnow has been made out of some mysterious snow that covered a thick field of magical flowers."
  npc_override_xmas_lutie_if_you_want_leave_lutie_b4ec31: "If you want to leave Lutie, go outside town and head south to the first field that you see. You'll be able to find a magical warp that will take you to Al de Baran."
  npc_override_xmas_lutie_isn_t_soooo_exciting_sig_18860a: "Isn't that soooo exciting?! *Sigh* Even if it is a dungeon, I would like to go inside just to look. If only I was a real boy, or even had legs..."
  npc_override_xmas_lutie_la_la_la_e3832e: "La La La~!"
  npc_override_xmas_lutie_lately_seems_more_more_p_ffd062: "Lately, it seems more and more people are coming to this town to see Snowysnow."
  npc_override_xmas_lutie_let_s_see_let_s_86134b: "Let's see, let's see..."
  npc_override_xmas_lutie_living_3dd499: "Living in this"
  npc_override_xmas_lutie_long_ago_great_alchemist_ee4604: "Long ago, a great alchemist came by Snowysnow's hometown and happened to meet Snowysnow dying, melting down into water. However, Snowysnow was miraculously revived by that Alchemist."
  npc_override_xmas_lutie_long_time_ago_331626: "A long time ago,"
  npc_override_xmas_lutie_looks_like_cold_brought_aceb86: "It looks like the cold has brought a rosiness to your cheeks."
  npc_override_xmas_lutie_lutie_fantastic_christma_60433f: "^3355FFLutie^000000, the fantastic Christmas Town! Always filled with the spirit of giving, Lutie is filled with appetizing cakes, tiny toy soldiers, and all sorts of wonderful things~!"
  npc_override_xmas_lutie_lutie_isn_t_merely_just_ebf58b: "Lutie isn't merely just a simple attraction. We have convenient facilities like the other towns, but in a festive environment."
  npc_override_xmas_lutie_magical_ae61ae: "the magical"
  npc_override_xmas_lutie_man_s_drink_hmmm_bring_38ea9f: "a man's drink. Hmmm, bring me..."
  npc_override_xmas_lutie_marcell_they_attend_my_s_dbcba6: "^3355FF' Marcell '^000000. They attend my show regularly. I'm guessing you've heard the story from Cantata?"
