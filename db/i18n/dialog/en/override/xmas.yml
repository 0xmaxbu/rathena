  npc_override_xmas_lutie_sigh_reminds_me_beb592: "*Sigh* That reminds me..."
  npc_override_xmas_lutie_sniff_s_sometimes_fe1e87: "*Sniff* S-sometimes,"
  npc_override_xmas_lutie_snowman_574ce6: "That snowman..."
  npc_override_xmas_lutie_snowysnow_59bf9a: "was ^3355FFSnowysnow^000000."
  npc_override_xmas_lutie_snowysnow_5c678f: "Snowysnow?"
  npc_override_xmas_lutie_snowysnow_been_holding_s_b13d31: "Snowysnow has been holding something for me as a favor, the ^3355FFroughest salt in the world^000000 which I use to pickle cabbages."
  npc_override_xmas_lutie_snowysnow_gave_you_rough_fbabb2: "^3355FFSnowysnow gave you the roughest salt in the world^000000."
  npc_override_xmas_lutie_snowysnow_he_e68846: "^3355FFSnowysnow^000000 and he"
  npc_override_xmas_lutie_snowysnow_immersed_his_d_7a5933: "^3355FFSnowysnow is immersed in his deep thoughts, and seems^000000"
  npc_override_xmas_lutie_snowysnow_only_speak_he_5958a3: "Snowysnow can not only speak, but he also seems to be able to create an endless supply of Christmas presents. Or at least, that's what I hear."
  npc_override_xmas_lutie_snowysnow_s_birth_39fbb1: "^3355FFSnowysnow's birth^000000!!"
  npc_override_xmas_lutie_snowysnow_s_magical_gift_2dcc50: "Snowysnow's magical gift bag^000000."
  npc_override_xmas_lutie_snowysnow_told_me_story_f825d4: "Snowysnow told me the story of how he let his body fly into the air to block the giant fire ball that was about to hit them when they were babies. For their sake, he was willing to sacrifice himself."
  npc_override_xmas_lutie_so_if_you_decide_stay_e50532: "So if you decide to stay here for a while, you should have all the comforts that you need. Merry Christmas~"
  npc_override_xmas_lutie_so_you_my_friend_if_bbd796: "So will you be my friend? If you do, I'll be your friend too~"
  npc_override_xmas_lutie_so_you_ve_met_charu_0e8d32: "So you've met Charu Charu? That boy is so full of optimism and always looking forward. When he grows up, he's going to be a big shot!"
  npc_override_xmas_lutie_so_you_ve_met_duffle_4e2829: "So you've met Duffle?"
  npc_override_xmas_lutie_some_magic_ice_2f396b: "some magic ice."
  npc_override_xmas_lutie_some_reason_snowysnow_s_38fd41: "For some reason, Snowysnow's gift bag can now create as many presents as Snowysnow wants, just like Santa Claus."
  npc_override_xmas_lutie_sometimes_all_christmas_920cda: "Sometimes all that Christmas joy somehow doesn't cure the dark loneliness that wells deep inside of me."
  npc_override_xmas_lutie_spirit_christmas_d3cbc4: "the spirit of Christmas!"
  npc_override_xmas_lutie_spoke_well_me_0a77d5: "spoke well of me,"
  npc_override_xmas_lutie_squid_ink_98a75c: "^3355FF1 Squid Ink^000000 and"
