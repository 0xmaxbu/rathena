  npc_override_xmas_lutie_amidst_woeful_cries_desp_7e8dda: "Amidst the woeful cries of despair, the wails of two infants reached the ears of Philip Varsez. He rushed to investigate and found two babies cushioned in the bosom of a melting snowman."
