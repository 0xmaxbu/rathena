  npc_override_xmas_lutie_still_fb124f: "But still..."
  npc_override_xmas_lutie_stops_says_hi_aa8171: "stops by and says 'hi...'"
  npc_override_xmas_lutie_sure_he_loud_voice_doesn_c65077: "Sure, he has a loud voice, doesn't take showers and smells like rotting food. But he's a funny guy with a warm heart. Everybody loves him!"
  npc_override_xmas_lutie_tah_dah_a41181: "Tah dah!"
  npc_override_xmas_lutie_talking_snowman_db7dd3: "talking snowman!"
  npc_override_xmas_lutie_thachentze_lovely_pickle_692f8a: "^3355FFThachentze^000000, that lovely pickle maker, knows more about it. So if you're curious, you should go talk to her. Alrighty then, Merry Christmas!"
  npc_override_xmas_lutie_thank_you_dear_thank_you_273017: "Thank you dear,Thank you."
  npc_override_xmas_lutie_thank_you_listening_me_ffae40: "Thank you for listening to me~"
  npc_override_xmas_lutie_thank_you_listening_me_s_c5a54a: "Thank you for listening to me so far. I really appreciate that you try to understand me, even though you're a stranger here."
  npc_override_xmas_lutie_then_002edd: "It was then that"
  npc_override_xmas_lutie_then_fate_played_its_cru_7a7241: "But then fate played its cruel joke on me once again, and I realized that I had no legs to visit him with."
  npc_override_xmas_lutie_there_great_e3d5ec: "there was a great"
  npc_override_xmas_lutie_they_getting_smarter_wit_6b0d75: "They are getting smarter and wittier everyday, and now it seems that they don't laugh at my best jokes anymore. How did they get to be so clever?"
  npc_override_xmas_lutie_they_re_all_nice_generou_9745b4: "They're all nice and generous, and we always appreciate what they've done to take care of us."
  npc_override_xmas_lutie_third_night_she_there_sh_af0951: "On the third night she was there, she set the town on fire with frightening magic. Everyone was running in panic amongst the fear and chaos. And somehow, I was knocked out."
  npc_override_xmas_lutie_too_many_items_you_fc968e: "- too many items with you. -"
  npc_override_xmas_lutie_totally_baffles_me_how_c_9d2427: "It totally baffles me! How could they not like the best jokes in the world?! Sheeeeesh~"
  npc_override_xmas_lutie_town_doesn_t_give_me_1f6092: "town doesn't give me"
  npc_override_xmas_lutie_town_which_blesses_3ec7b6: "the town which blesses"
  npc_override_xmas_lutie_uncle_cantata_auntie_tha_0e489e: "Uncle Cantata and Auntie Thachentze treated us like their own children, and Poze and Duffle have been like a brother and sister to us!"
  npc_override_xmas_lutie_uncle_hairy_cantata_f0431b: "^3355FFUncle Hairy Cantata^000000?"
  npc_override_xmas_lutie_varsez_touched_determine_8f9f25: "Varsez was touched, and was determined to save the life of this snowman with his alchemy. He would then transport him here to Lutie, the safest place in the world."
  npc_override_xmas_lutie_wahhahaha_what_hell_look_a608eb: "Wahhahaha! What the hell is that look for?! Never you mind my gourmet sense of taste! Now get to work~!"
  npc_override_xmas_lutie_wait_minute_17efa5: "- Wait a minute !! -"
  npc_override_xmas_lutie_we_dungeon_named_bca3ab: "We have a dungeon named"
  npc_override_xmas_lutie_welcome_lutie_7db6b5: "Welcome to Lutie!"
  npc_override_xmas_lutie_welcome_lutie_fd397c: "Welcome to Lutie,"
  npc_override_xmas_lutie_well_7b1901: "Well..."
  npc_override_xmas_lutie_well_charu_charu_i_orpha_416d46: "Well, Charu Charu and I are orphans, and don't remember our parents at all. We've been brought up by the people here in Lutie."
  npc_override_xmas_lutie_well_i_t_just_let_3ee79a: "Well, I can't just let anyone know something so important about Snowysnow. Hmmm..."
  npc_override_xmas_lutie_well_if_i_work_hard_487e97: "Well, if I work hard enough, they can't help but laugh at my hilarious jokes! So... I better start inventing better jokes. Like, pronto."
  npc_override_xmas_lutie_well_now_s_time_my_c5fcd0: "Well, now it's the time for my story. Keep in mind that this is the whole story from what I know. I'm not sure how much you've already heard though..."
  npc_override_xmas_lutie_well_s_pretty_much_all_b595ec: "Well, that's pretty much all I know. I hope you were able to learn what you wanted from my story! Haw haw haw!"
  npc_override_xmas_lutie_well_then_0f1bb7: "Well then..."
  npc_override_xmas_lutie_well_there_two_naughty_k_055fdd: "Well, there are two naughty kids,"
  npc_override_xmas_lutie_well_you_ready_16e401: "Well, are you ready?"
  npc_override_xmas_lutie_whatever_e81b69: "Whatever~"
  npc_override_xmas_lutie_when_i_talk_snowysnow_i_97370b: "When I talk to Snowysnow, I get to wondering how he came to be. I guess if you talk to him too, you'll feel the same way."
  npc_override_xmas_lutie_when_marcell_i_watch_his_06e338: "When Marcell and I watch his show, we feel like we're getting dumber and dumber~"
  npc_override_xmas_lutie_whenever_you_want_visit_cb74ec: "Whenever you want to visit Lutie, be my guest. Just let me know when you want to leave."
