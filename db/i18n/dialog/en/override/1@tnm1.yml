  npc_override_1@tnm1_DevilTower_stay_here_any_longer_efcb00: "Will stay here any longer?"
  npc_override_1@tnm1_DevilTower_still_i_m_lucky_alive_ecb9a1: "Still I'm lucky to be alive."
  npc_override_1@tnm1_DevilTower_still_unstable_so_your_t_a6f3b2: "It is still unstable so your time for exploring will be limited."
  npc_override_1@tnm1_DevilTower_system_restored_4bf8a3: "System is restored."
  npc_override_1@tnm1_DevilTower_take_rest_day_come_back_cf96de: "Take a rest day and come back tomorrow.!"
  npc_override_1@tnm1_DevilTower_thank_you_174534: "Thank you."
  npc_override_1@tnm1_DevilTower_thank_you_thank_you_18d7f4: "Thank you.. Thank you.."
  npc_override_1@tnm1_DevilTower_thank_you_very_much_1daec1: "Thank you very much!"
  npc_override_1@tnm1_DevilTower_then_come_back_tomorrow_340ad8: "then, come back tomorrow."
  npc_override_1@tnm1_DevilTower_there_nothing_i_i_guess_99db50: "There is nothing I can do I guess."
  npc_override_1@tnm1_DevilTower_there_nothing_we_ef98f1: "There is nothing we can do ."
  npc_override_1@tnm1_DevilTower_there_s_always_opportuni_179107: "There's always opportunities for other expeditions."
