Body:
  npc_override_1@tnm1_DevilTower_after_listening_all_expl_e65287: "After listening to all this explanation?"
  npc_override_1@tnm1_DevilTower_all_you_33de04: "This is all you have."
  npc_override_1@tnm1_DevilTower_annoying_d13e05: ".. annoying"
  npc_override_1@tnm1_DevilTower_anyway_ready_enter_753466: "Anyway, ready to enter?"
  npc_override_1@tnm1_DevilTower_back_up_soldiers_so_why_5eb91f: "Back up soldiers? So why are you just standing there?"
  npc_override_1@tnm1_DevilTower_because_she_s_mostly_mac_5496c1: "Because she's mostly machine..."
  npc_override_1@tnm1_DevilTower_behind_shelf_secret_pass_f03944: "Behind that shelf is a secret passage to the basement!"
  npc_override_1@tnm1_DevilTower_better_get_964e1e: "Better get to it."
  npc_override_1@tnm1_DevilTower_better_info_better_zeny_189658: "The better the info~ the better the zeny I'll pay you!"
  npc_override_1@tnm1_DevilTower_body_gift_gods_af2eff: "This body was a gift from the gods."
  npc_override_1@tnm1_DevilTower_bring_expedition_chief_82b6d9: "Bring the Expedition Chief."
  npc_override_1@tnm1_DevilTower_bring_manager_a5ec18: "Bring the manager."
  npc_override_1@tnm1_DevilTower_calamity_happened_hundre_995e7a: "The calamity that happened hundreds of years ago will not happen again right?"
  npc_override_1@tnm1_DevilTower_captain_says_we_need_get_ef9870: "The Captain says that we need to get rid of all of the demons..."
  npc_override_1@tnm1_DevilTower_careful_fa18ab: "Be careful."
  npc_override_1@tnm1_DevilTower_collision_those_two_powe_b5fde7: "The collision of those two powers is too much to handle."
  npc_override_1@tnm1_DevilTower_commander_please_help_me_3879af: "Commander please help me. I can't do it by myself~!"
  npc_override_1@tnm1_DevilTower_connect_space_again_i_2ff0e0: "Connect to the space again? I can not do that."
  npc_override_1@tnm1_DevilTower_could_influenced_south_r_0c0a9b: "It could have influenced the south of Rune-Midgarts."
  npc_override_1@tnm1_DevilTower_decide_quickly_because_y_ec5a8f: "Decide quickly because you only have a finite amount of time in there."
  npc_override_1@tnm1_DevilTower_demon_destroyed_before_r_8f82b4: "The demon was destroyed before the resurrection ceremony was completed."
  npc_override_1@tnm1_DevilTower_devil_s_tower_place_visi_7cc14d: "Devil's Tower is not a place to visit alone."
  npc_override_1@tnm1_DevilTower_did_surprise_you_20d423: "Did that surprise you?"
  npc_override_1@tnm1_DevilTower_difficult_enter_again_if_b17e7d: "It will be difficult to enter again if you leave."
  npc_override_1@tnm1_DevilTower_difficult_send_you_throu_bea865: "It is difficult to send to you through the device right now."
  npc_override_1@tnm1_DevilTower_dimensional_device_activ_9bb47d: "The Dimensional Device is activated."
  npc_override_1@tnm1_DevilTower_dimensional_device_needs_d0ddf9: "The Dimensional Device needs to be activated first before entering."
  npc_override_1@tnm1_DevilTower_doesn_t_seem_activated_y_3f0859: "It doesn't seem to be activated yet."
  npc_override_1@tnm1_DevilTower_don_t_take_any_unncessar_2417a2: "Don't take any unncessary risks, okay?"
  npc_override_1@tnm1_DevilTower_don_t_worry_though_i_12fc0b: "Don't worry though, I'm a genius scholar~"
  npc_override_1@tnm1_DevilTower_embarrassing_92e038: "...embarrassing."
  npc_override_1@tnm1_DevilTower_enter_device_3ddbfc: "Enter the device."
  npc_override_1@tnm1_DevilTower_exploring_devil_s_tower_588016: "Exploring Devil's Tower will be permitted only for expeditions in parties."
  npc_override_1@tnm1_DevilTower_exploring_time_limit_you_7a3016: "^4d4dffExploring time limit is for your safety^000000!"
  npc_override_1@tnm1_DevilTower_fama_give_you_first_aid_7dddc8: "Fama will give you first aid-kits, use it to help the injured people."
  npc_override_1@tnm1_DevilTower_finally_someone_share_my_10250b: "Finally, someone to share the mysteries of the tower for me."
  npc_override_1@tnm1_DevilTower_first_all_we_get_rid_9327d4: "First of all, we have to get rid of these demons!"
  npc_override_1@tnm1_DevilTower_first_all_you_need_reser_f5e3a8: "First of all, you need to reserve a queue at the gate."
  npc_override_1@tnm1_DevilTower_follow_ef5fd3: "Follow."
  npc_override_1@tnm1_DevilTower_forget_get_rid_any_demon_b47696: "Do not forget to get rid of any demons that you encounter on the way."
  npc_override_1@tnm1_DevilTower_get_out_here_c88f2c: "Get out of here."
  npc_override_1@tnm1_DevilTower_glad_you_all_here_help_bd6faf: "Glad that you all are here to help."
  npc_override_1@tnm1_DevilTower_gone_too_far_somewhere_s_7f6e01: "It has gone too far somewhere in the south"
  npc_override_1@tnm1_DevilTower_good_luck_703764: "Good luck."
  npc_override_1@tnm1_DevilTower_good_luck_8e30d6: "Good luck!"
  npc_override_1@tnm1_DevilTower_good_things_getting_wors_c2f593: "Good. things are getting worse here."
  npc_override_1@tnm1_DevilTower_groaning_just_let_me_die_35c793: "Groaning... Just let me die."
  npc_override_1@tnm1_DevilTower_happens_whenever_she_s_w_6e644d: "It happens whenever she's wounded."
  npc_override_1@tnm1_DevilTower_help_fama_take_care_inju_04cab3: "Help Fama take care of the injured soldiers."
  npc_override_1@tnm1_DevilTower_help_me_ea30ec: "HELP ME!"
  npc_override_1@tnm1_DevilTower_here_i_know_well_287bbc: "From here.. I do not know well..."
  npc_override_1@tnm1_DevilTower_hey_hey_d63bbd: "Hey, Hey"
  npc_override_1@tnm1_DevilTower_his_conscious_seems_blur_e31324: "His conscious seems to be blur still."
  npc_override_1@tnm1_DevilTower_hrm_difficult_connect_un_f471a5: "Hrm... It is difficult to connect to unless it is an appointed exploration time."
  npc_override_1@tnm1_DevilTower_huh_okay_we_take_break_3d974a: "Huh... Okay, we can take a break now."
  npc_override_1@tnm1_DevilTower_hurry_up_world_danger_f04b16: "Hurry up or this world will be in a danger."
  npc_override_1@tnm1_DevilTower_i_always_been_waiting_me_3e725c: "I have always been waiting for a member of the expedition!"
  npc_override_1@tnm1_DevilTower_i_am_concerned_about_her_9f00ab: "I am concerned about her."
  npc_override_1@tnm1_DevilTower_i_am_scheduled_explore_t_576e5b: "I am scheduled to explore today!"
  npc_override_1@tnm1_DevilTower_i_am_sorry_i_been_a89184: "I am sorry but I have been through tough time..."
  npc_override_1@tnm1_DevilTower_i_am_sorry_if_i_d33dac: "I am sorry if I'm giving you any attitude but I can't move."
  npc_override_1@tnm1_DevilTower_i_am_sure_what_my_5e33bd: "I am not sure of what my next move is to be.."
  npc_override_1@tnm1_DevilTower_i_am_talking_your_boss_4d323c: "I am talking to your boss."
  npc_override_1@tnm1_DevilTower_i_am_talking_your_party_62e9e3: "I am talking to your party leader now so please step back for a while."
  npc_override_1@tnm1_DevilTower_i_been_exploring_passage_2778bb: "I have been exploring the passages of this tower for a while now."
  npc_override_1@tnm1_DevilTower_i_believe_you_23a867: "I believe in you!"
  npc_override_1@tnm1_DevilTower_i_believe_you_manage_und_57d1ec: "I believe that you can manage under these restrictions."
  npc_override_1@tnm1_DevilTower_i_feel_much_better_i_b4c8cc: "I feel much better but I still can't move."
  npc_override_1@tnm1_DevilTower_i_fixed_occasionally_bec_e6190a: "I have to be fixed occasionally because I don't have a normal body"
  npc_override_1@tnm1_DevilTower_i_gained_unexpected_info_64af1a: "I have gained unexpected information during my exploration of the Tower."
  npc_override_1@tnm1_DevilTower_i_guess_power_demon_moro_aa45de: "I guess the power of Demon Morocc to break the shield of seal has collided with Thanatos."
  npc_override_1@tnm1_DevilTower_i_guess_what_you_able_4b28c8: "...I guess this is what you are able to?"
  npc_override_1@tnm1_DevilTower_i_guide_way_you_40db5f: "I will guide the way for you."
  npc_override_1@tnm1_DevilTower_i_guide_you_c793cc: "I will guide you."
  npc_override_1@tnm1_DevilTower_i_guide_you_upper_floor_047b1f: "I will guide you to the upper floor."
  npc_override_1@tnm1_DevilTower_i_hear_mechanical_sounds_038c4b: "I can hear mechanical sounds all of a sudden."
  npc_override_1@tnm1_DevilTower_i_help_9d30c9: "Can I help?"
  npc_override_1@tnm1_DevilTower_i_know_path_upstairs_71f06c: "I know the path upstairs..."
  npc_override_1@tnm1_DevilTower_i_ll_just_find_someone_0a8f30: "I'll just find someone else..."
  npc_override_1@tnm1_DevilTower_i_look_forward_hearing_g_f41a22: "I look forward to hearing good news."
  npc_override_1@tnm1_DevilTower_i_look_forward_more_disc_bf3dc9: "I look forward to more discoveries!"
  npc_override_1@tnm1_DevilTower_i_m_alive_7da4c2: "But I'm alive!"
  npc_override_1@tnm1_DevilTower_i_m_amazed_time_travel_9f0f7b: "I'm amazed that time travel is possible."
  npc_override_1@tnm1_DevilTower_i_making_sure_no_one_e65771: "I was making sure that no one goes upstairs, I was afraid something might happen again."
  npc_override_1@tnm1_DevilTower_i_may_need_help_here_ad168d: "I may need help here."
  npc_override_1@tnm1_DevilTower_i_need_first_aid_kit_63478d: "I need 1 first-aid-kit to treat the injured soldier."
  npc_override_1@tnm1_DevilTower_i_need_your_help_activat_0ce66f: "I need your help to activate my restoration system."
  npc_override_1@tnm1_DevilTower_i_remain_apart_my_consci_dcf0c2: "I will remain apart from my conscience for a bit longer"
  npc_override_1@tnm1_DevilTower_i_saw_some_guys_black_7b5fea: "I saw some guys in black entering. What is going on in the castle?"
  npc_override_1@tnm1_DevilTower_i_see_da0f97: "...I see."
  npc_override_1@tnm1_DevilTower_i_see_so_many_stairs_9d365d: "I see so many stairs..."
  npc_override_1@tnm1_DevilTower_i_send_you_back_where_9d87d0: "I can send you back where and when you belong."
  npc_override_1@tnm1_DevilTower_i_t_die_here_i_448183: "I can't die here. I have to propose to my beloved when I get home."
  npc_override_1@tnm1_DevilTower_i_t_use_any_your_97e6bc: "I can't use any of your info."
  npc_override_1@tnm1_DevilTower_i_talk_representative_08f51b: "I will talk to a representative."
  npc_override_1@tnm1_DevilTower_i_thought_i_going_die_2839a8: "I thought I was going to die."
  npc_override_1@tnm1_DevilTower_i_use_self_recovery_i_19454e: "I can use self-recovery but I don't have time for that."
  npc_override_1@tnm1_DevilTower_i_want_see_my_soldiers_58b7ac: "I do not want to see my soldiers die."
  npc_override_1@tnm1_DevilTower_i_wish_you_help_me_322023: "I wish you would help me."
  npc_override_1@tnm1_DevilTower_i_wonder_how_others_doin_f8a370: "I wonder how the others are doing..."
  npc_override_1@tnm1_DevilTower_if_you_cancel_now_you_b19329: "^4d4dffIf you cancel now. You will be able to challenge one day after.^000000"
  npc_override_1@tnm1_DevilTower_if_you_re_lucky_you_608aea: "If you're lucky, you can get through this quickly."
  npc_override_1@tnm1_DevilTower_if_you_run_out_time_821369: "But if you run out of time, the access to the tower will disappear."
  npc_override_1@tnm1_DevilTower_if_you_unexpectedly_boun_0e6592: "If you are unexpectedly bounced back to here again, you should return quickly."
  npc_override_1@tnm1_DevilTower_if_you_want_assist_them_4ba0fc: "If you want to assist them, you must hurry."
  npc_override_1@tnm1_DevilTower_if_you_you_may_may_0e9a77: "If you do you may or may not be able to re-enter depending on how fast you are."
  npc_override_1@tnm1_DevilTower_interesting_there_daught_660029: "Interesting.. there is a daughter.."
  npc_override_1@tnm1_DevilTower_laphine_scholar_artie_re_29f955: "The Laphine Scholar Artie will reserve your queue for you."
  npc_override_1@tnm1_DevilTower_laphine_scholar_over_the_8a6a77: "That Laphine scholar over there will open up the dimensional gap with this time device."
  npc_override_1@tnm1_DevilTower_leave_him_get_some_rest_218954: "Leave him to get some rest."
  npc_override_1@tnm1_DevilTower_let_me_see_you_mean_1f2feb: "Let me see... you mean this tower has a passage to connect to the demon world."
  npc_override_1@tnm1_DevilTower_let_s_fun_since_we_a2527d: "let's have fun since we just left bifrost."
  npc_override_1@tnm1_DevilTower_loki_guillotine_cross_as_33ce04: "^4d4dffLoki, Guillotine Cross of the Assassin Guild, has joined your party."
  npc_override_1@tnm1_DevilTower_look_i_am_sorry_allowed_c7a0f0: "Look, I am sorry but it is not allowed to enter except during the allowed time, Devil's Tower is dangerous."
