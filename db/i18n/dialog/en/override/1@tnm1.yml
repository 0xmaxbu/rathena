  npc_override_1@tnm1_DevilTower_lot_soldiers_still_survi_192204: "A lot of soldiers still survived the attacks."
  npc_override_1@tnm1_DevilTower_lots_guards_hurt_7d6483: "lots of guards are hurt."
  npc_override_1@tnm1_DevilTower_lucile_seems_machine_e2474f: "Lucile seems to be a machine."
  npc_override_1@tnm1_DevilTower_luckily_no_one_dead_yet_aa8f94: "Luckily, no one is dead yet."
  npc_override_1@tnm1_DevilTower_make_sure_you_ready_4bfd11: "Make sure you are ready."
  npc_override_1@tnm1_DevilTower_make_your_exploration_sh_c4ffae: "Make your exploration short and sweet."
  npc_override_1@tnm1_DevilTower_mention_dangerous_as_wel_96940f: "Not to mention dangerous as well."
  npc_override_1@tnm1_DevilTower_move_immediately_c179f0: "Move immediately."
  npc_override_1@tnm1_DevilTower_move_now_7a437a: "Move now"
  npc_override_1@tnm1_DevilTower_msg_e95f89: "....."
  npc_override_1@tnm1_DevilTower_no_9f92cd: "No?"
  npc_override_1@tnm1_DevilTower_no_hurts_too_much_651e98: "No it hurts too much."
  npc_override_1@tnm1_DevilTower_no_matter_you_obviously_546f5b: "But no matter, you obviously shouldn't be here, now."
  npc_override_1@tnm1_DevilTower_no_one_been_volunteering_65de3b: "No one has been volunteering up this point so I was getting worried."
  npc_override_1@tnm1_DevilTower_notice_b6a240: "!- Notice -!"
  npc_override_1@tnm1_DevilTower_oh_s_too_bad_80b7a8: "Oh that's too bad"
  npc_override_1@tnm1_DevilTower_oh_you_back_29eb24: "Oh, you are back."
  npc_override_1@tnm1_DevilTower_oh_you_back_so_soon_0fc691: "Oh, you are back so soon..."
  npc_override_1@tnm1_DevilTower_oh_you_just_arrived_time_6bff9e: "Oh. You just have arrived in time."
  npc_override_1@tnm1_DevilTower_ok_i_see_what_happened_a7f194: "Ok, I see what happened."
  npc_override_1@tnm1_DevilTower_ok_i_won_t_cancel_cea639: "Ok, I won't cancel."
  npc_override_1@tnm1_DevilTower_okay_a94f23: "Is that okay?"
  npc_override_1@tnm1_DevilTower_okay_gather_your_party_r_95bc19: "Okay, gather your party and remember to report to me what you find."
  npc_override_1@tnm1_DevilTower_ones_who_infernally_bles_b3a005: "^4d4dffThe ones who are infernally blessed by demons are invincible. We can sever the blessing with Mind Blaster.^000000"
  npc_override_1@tnm1_DevilTower_only_thanatos_lucile_eve_e4aa9e: "Only Thanatos and Lucile have ever entered to upper floor..."
  npc_override_1@tnm1_DevilTower_papa_papa_please_safe_so_8c9a15: "Papa.. Papa please be safe. *sob*"
  npc_override_1@tnm1_DevilTower_perhaps_our_missions_all_57ce94: "Perhaps, our missions will ally us again in the future.."
  npc_override_1@tnm1_DevilTower_please_come_back_tomorro_f0174b: "Please come back tomorrow!"
  npc_override_1@tnm1_DevilTower_please_come_me_make_sure_e3c710: "Please come with me to make sure my Papa is safe."
  npc_override_1@tnm1_DevilTower_please_come_me_through_p_7b67b7: "Please come with me through the passage behind that shelf!"
  npc_override_1@tnm1_DevilTower_please_cure_injured_firs_0d6012: "Please cure the injured with this first aid kit."
  npc_override_1@tnm1_DevilTower_please_get_permission_ac_c9e927: "Please get a permission to activate it by talking to the Magic Scholar Artie."
  npc_override_1@tnm1_DevilTower_please_hold_tight_4546fe: "Please hold tight."
  npc_override_1@tnm1_DevilTower_please_report_anything_y_09c0b8: "Please report anything you find in the tower to me."
  npc_override_1@tnm1_DevilTower_please_request_again_if_60006a: "Please request again if you run out."
  npc_override_1@tnm1_DevilTower_please_save_him_d163a1: "Please save him."
  npc_override_1@tnm1_DevilTower_please_your_best_even_if_1da0d9: "Please do your best even if the environment is the worst."
  npc_override_1@tnm1_DevilTower_prepared_anything_e7b23b: "Be prepared for anything."
  npc_override_1@tnm1_DevilTower_priority_treat_injured_s_d68679: "It is priority to treat the injured soldiers by assisting Fama."
  npc_override_1@tnm1_DevilTower_really_05b5d1: "Really."
  npc_override_1@tnm1_DevilTower_really_e7da47: "Really?"
  npc_override_1@tnm1_DevilTower_rewards_different_depend_a9549c: "Rewards will be different depending on your time."
  npc_override_1@tnm1_DevilTower_right_fbc63d: "Right."
  npc_override_1@tnm1_DevilTower_right_now_9f9d98: "Right now?"
  npc_override_1@tnm1_DevilTower_s_difficult_just_follow_886c19: "It's not difficult. Just follow the instructions."
  npc_override_1@tnm1_DevilTower_s_extremely_dangerous_so_8d17f0: "It's extremely dangerous so you need to be at least ^4d4dffLevel 130^000000."
  npc_override_1@tnm1_DevilTower_see_there_so_many_demons_8b48ce: "See there are so many demons. My father will be in a danger!"
  npc_override_1@tnm1_DevilTower_seems_like_quite_long_ti_a9e92c: "It seems like quite a long time has passed since you activated the device. Am I right?"
