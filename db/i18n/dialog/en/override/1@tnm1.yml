  npc_override_1@tnm1_DevilTower_should_i_use_first_aid_0c3131: "Should I use the first-aid kit?"
  npc_override_1@tnm1_DevilTower_so_time_space_seem_conve_4870e6: "So time and space seem to have converged there?"
  npc_override_1@tnm1_DevilTower_so_you_want_volunteer_780f24: "So do you want to volunteer?"
  npc_override_1@tnm1_DevilTower_soldier_lost_consciousne_c01247: "This soldier has lost consciousness and groaning."
  npc_override_1@tnm1_DevilTower_someday_i_ll_let_myself_fba5d1: "someday I'll let myself feel again, and today will occupy my thoughts.."
