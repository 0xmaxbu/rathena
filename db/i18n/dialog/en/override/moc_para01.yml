  npc_override_moc_para01_41-55_mission_bulletin_board_c92c10: "Mission bulletin board."
  npc_override_moc_para01_41-55_mission_bulletin_board_l_5f3536: "Mission bulletin board for Lv41~55 adventurers."
  npc_override_moc_para01_41-55_ok_let_s_check_missions_496e31: "^000077Ok. Let's check the missions next time.^000000."
  npc_override_moc_para01_41-55_there_nothing_special_8723af: "There is nothing special to do."
  npc_override_moc_para01_41-55_wait_sec_267d13: "^008800Wait a sec!!"
  npc_override_moc_para01_41-55_you_accepted_mission_mor_427e3b: "You have accepted the mission. For more details, please press 'alt + u' keys, you can get information from the Quest Window."
  npc_override_moc_para01_41-55_you_cannot_receive_any_m_5017ef: "You cannot receive any more items because you're carrying too many items. Please try again after you lighten up.^000000"
  npc_override_moc_para01_41-55_you_completed_mission_569bc6: "You have completed the mission."
  npc_override_moc_para01_41-55_you_eden_group_member_yo_8e8ed9: "You are not an Eden group member. You are not qualified to access the bulletin board."
  npc_override_moc_para01_41-55_you_may_now_view_bulleti_89bfa4: "You may now view the bulletin board."
  npc_override_moc_para01_56-70_alligators_gone_wild_the_361e5c: "Alligators have gone wild these days, they attack women and drunken people who hang out near the beach."
  npc_override_moc_para01_56-70_anyway_i_son_named_araga_eee730: "Anyway, I have a son named Aragam Junior, the cute one. Haha."
  npc_override_moc_para01_56-70_as_i_studied_harder_i_d8ed97: "But, as I studied harder, I found that the creature was not a mermaid... yes, It wasn't beautiful at all like other mermaids..."
  npc_override_moc_para01_56-70_as_weather_gets_warmer_i_6d0bf7: "As the weather gets warmer, insects multiply more and more. It is already out of control."
  npc_override_moc_para01_56-70_because_i_am_little_sens_d07513: "Because I am a little sensitive girl, how can I possibly get those things by myself."
