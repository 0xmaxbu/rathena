  npc_override_moc_para01_eden_100_111_request_clear_sting_unde_31ef65: "The request is to clear ^FF000030 Sting^000000 in underground waterway and underground cave for a safe pilgrimage."
  npc_override_moc_para01_eden_100_111_request_client_sad_becau_8bb3a2: "This request is from a client that is sad because the magma dungeon is full of monsters when she came back to return after breaking up with her lover. Apparently, she spent a lot of time with him there and wants some peace."
  npc_override_moc_para01_eden_100_111_request_hair_designer_al_f5dad0: "This is a request from a hair designer in Alberta. He wants to know if the snakes on the Medusa's head are really snakes or fancy hair..."
