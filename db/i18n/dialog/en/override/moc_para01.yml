  npc_override_moc_para01_eden_100_111_oops_i_ate_all_okay_f2ca8f: "Oops I ate all? Okay just one left. Please drop by later!"
  npc_override_moc_para01_eden_100_111_oops_its_actually_tendri_28ae20: "Oops! Its actually ^FF0000Tendrilion^000000!! Master!"
