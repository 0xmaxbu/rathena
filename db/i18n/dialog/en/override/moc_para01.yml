  npc_override_moc_para01_eden_100_111_make_request_list_you_so_d64173: " will make a request list for you so go talk to my Master now and show your respects."
  npc_override_moc_para01_eden_100_111_makes_me_feel_weird_bad_79af7c: "That makes me feel weird. That is not bad but I guess I'm bad and I don't care."
  npc_override_moc_para01_eden_100_111_master_accepted_request_398508: "Master accepted this request because he respects those monks. The request is to clear ^FF000030 Sting^000000 monsters in underground waterway for a safe pilgrimage."
  npc_override_moc_para01_eden_100_111_master_decided_adventure_4285f5: "Master decided that adventurer's safety is important because lots of new requests are dangerous."
  npc_override_moc_para01_eden_100_111_master_rohter_i_traveled_5186e6: "Master Rohter and I traveled deep into the ship and battled a monster known as ^FF0000Drake^000000. That day I was determined that I would be the best adventurer."
  npc_override_moc_para01_eden_100_111_master_s_guild_dismissed_9da707: "Master's guild was dismissed at the Ash Vacuum because their guild master went missing after a battle with some Cornus monsters."
  npc_override_moc_para01_eden_100_111_master_started_out_as_po_1dd19f: "Master started out as a popular support Monk at the Prontera monastery."
  npc_override_moc_para01_eden_100_111_memory_girl_important_pl_45e8ab: "The memory of a girl is important ! Please clear ^FF000030 Nightmare Terror^000000."
  npc_override_moc_para01_eden_100_111_memory_girl_important_pl_aac8f6: "The memory of a girl is important! Please clear ^FF000030 Nightmare Terror^000000."
