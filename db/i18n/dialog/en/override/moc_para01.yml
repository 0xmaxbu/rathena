  npc_override_moc_para01_eden_100_111_glastheim_seems_good_sac_63c5c8: "Glastheim seems to be a good sacred place not only to adventurers but also to monks. I have no idea what really attracts them there."
  npc_override_moc_para01_eden_100_111_good_experience_sure_7b6c7d: "It will be a good experience for sure."
