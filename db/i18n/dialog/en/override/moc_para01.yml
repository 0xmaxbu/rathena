Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_moc_para01_eden_100_111_able_receive_items_ddb135: "- Not able to receive items. -"
  npc_override_moc_para01_eden_100_111_actually_i_t_just_accept_1e513f: "Actually, I can't just accept just any schmo off the street. My Master hates indecisive people."
  npc_override_moc_para01_eden_100_111_adventure_important_taki_41e34b: "Adventure is important but taking a rest is important too."
  npc_override_moc_para01_eden_100_111_adventurers_aa349c: "Adventurers!"
  npc_override_moc_para01_eden_100_111_adventurers_sometimes_br_0f3bfd: "Adventurers sometimes bring special things or trophies from where they visited for a request. It is very good!"
  npc_override_moc_para01_eden_100_111_agood_experience_if_you_21eb5e: "It will be agood experience if you listen to the story of adventurer. There are so much adventure that we heard from a master."
  npc_override_moc_para01_eden_100_111_anonymous_client_sent_re_4e97f4: "An anonymous client sent a request to help clear monsters in Sphinx dungeon because adventurers hardly visit Morocc anymore. The monsters seem to be running rampant there."
  npc_override_moc_para01_eden_100_111_anyway_i_guess_you_seem_5596e5: "Anyway, I guess you seem like the loyal type... sort of..."
  npc_override_moc_para01_eden_100_111_anyway_i_m_doing_favor_a46e59: "Anyway, I'm doing this a favor to the Eden Group."
  npc_override_moc_para01_eden_100_111_anyways_request_clear_ou_283835: "Anyways, this request is to clear out Anolians in underground waterway to make way for a safe pilgrimage."
  npc_override_moc_para01_eden_100_111_as_you_see_master_made_79ace5: "As you see, master made it himself and put his picture on it. He used to travel aroung for looking for the paper material to make the card."
  npc_override_moc_para01_eden_100_111_attack_ruined_their_danc_7661cf: "The attack ruined their dance and eventually their relationship because the guy blamed the girl for being attacked."
  npc_override_moc_para01_eden_100_111_because_i_am_coward_2f5776: "It is not because I am coward."
  npc_override_moc_para01_eden_100_111_browsing_346388: "browsing"
  npc_override_moc_para01_eden_100_111_cheer_up_766155: "Cheer up! "
  npc_override_moc_para01_eden_100_111_client_showed_wonderful_9ded94: "A client showed a wonderful dance to a lover. One day, they were attacked from a Deleter while they are dancing in the magma dungeon."
  npc_override_moc_para01_eden_100_111_collect_brigan_simple_co_e0cef0: "Collect 50 ^ff0000Brigan.^000000 It is a simple and complicated test."
  npc_override_moc_para01_eden_100_111_consider_memory_others_t_9a7131: "Consider the memory of others. There is stil abeauty in the world. It would be a good experience for you."
  npc_override_moc_para01_eden_100_111_course_i_beat_beast_easi_6ea832: "Of course I beat that beast easily! It was easier than taking candy from a Poring."
  npc_override_moc_para01_eden_100_111_did_you_bring_all_brigan_1dbf07: "Did you bring all the Brigans I asked for?"
  npc_override_moc_para01_eden_100_111_did_you_bring_kindness_p_c1ad46: "Did you bring the kindness pass?"
  npc_override_moc_para01_eden_100_111_don_t_upset_because_mast_af16d8: "Don't be upset because Master is ultimately responsible if an Adventurer gets injured during a request."
  npc_override_moc_para01_eden_100_111_easy_find_monsters_turtl_fea9b8: "It is easy to find from monsters at Turtle Island or at Glastheim."
  npc_override_moc_para01_eden_100_111_eden_group_aware_great_r_c6b271: "Eden Group is aware that this is not a great reason but a request is a request. So please clear ^FF000030 Carat^000000 monsters inside of Glastheim castle."
  npc_override_moc_para01_eden_100_111_eden_group_headquarters_d1c5ce: "Eden Group Headquarters wants to investigate the Arclouse as a possible mascot."
  npc_override_moc_para01_eden_100_111_eden_group_planning_send_163319: "Eden Group is planning to send a notice that unmature adventurers are not sent to night time requests because it is too dangerous."
  npc_override_moc_para01_eden_100_111_eden_group_protects_love_43fe9f: "Eden Group protects love, justice and Midgard! hurrah!"
  npc_override_moc_para01_eden_100_111_endless_tower_somewhere_79ea8b: "^FF0000Endless tower^000000 is somewhere in the sea. You have to find a guy named Jansor or Jans-something in Alberta and he'll sail you there."
  npc_override_moc_para01_eden_100_111_ever_since_then_he_start_3d6398: "Ever since then he started being mean to weaker adventurers..."
  npc_override_moc_para01_eden_100_111_fact_i_am_strong_more_b9bf27: "The fact that I am strong is more important than the number. Just go there and take the beast out."
  npc_override_moc_para01_eden_100_111_fact_master_so_drunk_he_e78700: "In fact, master was so drunk he barely remembers the thing."
  npc_override_moc_para01_eden_100_111_fine_there_still_many_ad_b0df35: "It is fine there are still many adventurers that can do this."
  npc_override_moc_para01_eden_100_111_fun_guild_because_no_one_8b9900: "It was a fun guild because no one took things seriously but master got tired of their laziness so he left."
  npc_override_moc_para01_eden_100_111_fun_if_we_talk_samba_e4647f: "It would be fun if we can talk and samba with wolves! Please clear ^FF000030 Desert Wolf^000000 near Ice dungeon."
  npc_override_moc_para01_eden_100_111_gelkah_staring_rohtert_562985: "Gelkah is staring at Rohtert."
  npc_override_moc_para01_eden_100_111_give_story_about_adventu_dd4f5f: "Give the story about adventure or trophy by using 1,10,20 and 30 cards."
  npc_override_moc_para01_eden_100_111_glastheim_seems_good_sac_63c5c8: "Glastheim seems to be a good sacred place not only to adventurers but also to monks. I have no idea what really attracts them there."
  npc_override_moc_para01_eden_100_111_good_experience_sure_7b6c7d: "It will be a good experience for sure."
  npc_override_moc_para01_eden_100_111_good_experience_you_591c72: "It would be a good experience for you."
  npc_override_moc_para01_eden_100_111_good_if_you_clear_one_b495d7: "It will be good if you clear one at a time after receiving all the requests from Glastheim."
  npc_override_moc_para01_eden_100_111_good_luck_make_sure_you_ec73dc: "Good luck. Make sure you finish it off this time. Hah hah!"
  npc_override_moc_para01_eden_100_111_good_luck_remained_reque_71880e: "Good luck on the remained requests."
  npc_override_moc_para01_eden_100_111_good_luck_remained_reque_f5dbad: "Good luck on the remained request. ^FF0000Master says he has something to say to you.^000000"
  npc_override_moc_para01_eden_100_111_good_memory_a9dfa6: "It would be a good memory."
  npc_override_moc_para01_eden_100_111_good_you_becoming_good_a_39ae6e: "Good ! You are becoming a good adventurer! Do your best!"
  npc_override_moc_para01_eden_100_111_handling_documents_must_3e742e: "Handling documents must be difficult. It's so much easier to just be out in the field."
  npc_override_moc_para01_eden_100_111_haven_t_found_brigan_yet_807fc3: "Haven't found 50 Brigan yet? Master says that it's such a simple task..."
  npc_override_moc_para01_eden_100_111_he_almost_crying_when_i_13a237: "He was almost crying when I first met him. It was difficult to pretend to lose to him. Please keep it a secret."
  npc_override_moc_para01_eden_100_111_he_also_regarded_as_trou_f3599d: "But he was also regarded as a troublemaker because of his competitive nature so he left."
  npc_override_moc_para01_eden_100_111_he_very_kind_even_though_44730b: "He is very kind even though he doesn't look like it. Master used it to give something to adventurers for their devotion."
  npc_override_moc_para01_eden_100_111_here_list_other_requests_e8dc9e: "Here is a list of other requests from all over Midgard."
  npc_override_moc_para01_eden_100_111_here_requests_glastheim_3ee392: "Here are the requests from the Glastheim area."
  npc_override_moc_para01_eden_100_111_hmm_9c4d28: "Hmm..."
  npc_override_moc_para01_eden_100_111_how_comodo_beach_take_lo_26a004: "How is Comodo beach? Take a look around instead of paying too much attention to the request."
  npc_override_moc_para01_eden_100_111_how_you_know_without_doi_ad2426: "How do you know without doing it."
  npc_override_moc_para01_eden_100_111_how_you_want_use_pass_846c05: "How do you want to use this pass?"
  npc_override_moc_para01_eden_100_111_hunting_0972a0: " Hunting^000000."
  npc_override_moc_para01_eden_100_111_i_am_afraid_if_you_aea228: "I am afraid if you are becoming like Gelkah. She's like a lost puppy. Don't be like her. Okay?"
  npc_override_moc_para01_eden_100_111_i_am_busy_clearing_lot_694824: "I am busy but clearing a lot of requests "
  npc_override_moc_para01_eden_100_111_i_am_done_my_business_606530: "I am done with my business."
  npc_override_moc_para01_eden_100_111_i_am_looking_someone_who_a7f4a3: "I am looking for someone who regards friendship or loyalty like a Spoon Stub."
  npc_override_moc_para01_eden_100_111_i_am_responsible_clearin_741bf6: "I am responsible for clearing documents. I hate doing this stuff."
  npc_override_moc_para01_eden_100_111_i_am_sorry_i_am_29660a: "I am sorry but I am a little bit busy. Can we talk later?"
  npc_override_moc_para01_eden_100_111_i_am_sorry_must_popular_5c0c8c: "I am sorry... It must be popular only in our village. Throw, heat and let it fly it."
  npc_override_moc_para01_eden_100_111_i_am_sorry_say_i_12400c: "I am sorry to say this but I am the only pupil of master now and forever... He said ^FF0000I don't need an ugly female pupil^000000 but I still stick to him."
  npc_override_moc_para01_eden_100_111_i_appreciate_lets_see_i_80dab7: " I appreciate it. Lets see. I got some good food from an adventurer that he received during a request."
  npc_override_moc_para01_eden_100_111_i_don_t_think_he_f695a5: "I don't think he ever saw that guild master again after that day."
  npc_override_moc_para01_eden_100_111_i_guess_i_m_retired_fc430d: "I guess I'm retired now because my adventuring skills are just too good to compete with all you kids."
  npc_override_moc_para01_eden_100_111_i_guess_i_should_talk_3ebc4a: "I guess I should talk to him one more time... Come back tomorrow!"
  npc_override_moc_para01_eden_100_111_i_guess_you_re_scrub_79f28f: "I guess you're not a scrub like I thought you were."
  npc_override_moc_para01_eden_100_111_i_heard_still_wandering_c53f57: "I heard it is still wandering place to palce but I am kind of busy now."
  npc_override_moc_para01_eden_100_111_i_hope_you_didn_t_f9c5ba: "I hope you didn't peek. The Assessment for your capability of standard requests is almost done."
  npc_override_moc_para01_eden_100_111_i_just_left_alone_becaus_6cf4ac: "I just left it alone because it was a little bit cute that a master was fighting with one Tendrilion. Now its becoming a problem."
  npc_override_moc_para01_eden_100_111_i_knew_kill_killed_d60a90: "^8008F8I knew that it was kill or be killed.^000000"
  npc_override_moc_para01_eden_100_111_i_know_hunting_tens_dril_60bf19: "I know that hunting the Tens Drillion can't be too difficult for you."
  npc_override_moc_para01_eden_100_111_i_know_sounds_childish_r_97df67: "I know it sounds childish. Right? The shape is just like the card we used to play when we were kids."
  npc_override_moc_para01_eden_100_111_i_know_why_master_likes_686334: "I do not know why master likes this kind of request. He also used to say any request is a good request for an adventurer..."
  npc_override_moc_para01_eden_100_111_i_know_you_re_exactly_31a429: "I know you're not exactly a novice but my Master thinks you're no different from one. In my opinion, You are a great adventurer!"
  npc_override_moc_para01_eden_100_111_i_let_you_know_if_e04467: "I will let you know if there is something good."
  npc_override_moc_para01_eden_100_111_i_like_know_if_you_ff2d1e: "I would like to know if you are capable of doing a request. Let me see..."
  npc_override_moc_para01_eden_100_111_i_m_charity_so_get_424048: "I'm not a charity so get lost."
  npc_override_moc_para01_eden_100_111_i_m_giving_requests_base_5fc2e6: "I'm giving requests to base level ^FF0000100 - 110^000000 adventurers."
  npc_override_moc_para01_eden_100_111_i_m_only_dealing_base_8eba44: "I'm only dealing with base level ^FF0000100 - 110^000000 adventurers."
  npc_override_moc_para01_eden_100_111_i_m_sure_if_he_cec878: " I'm not sure if he thinks of you as his pupil. He is just out of control."
  npc_override_moc_para01_eden_100_111_i_m_sure_if_i_bf0366: "I'm not sure if I'm cut out for that job. Besides..."
  npc_override_moc_para01_eden_100_111_i_mark_you_down_as_e9924d: "I will mark you down as having completed this request."
  npc_override_moc_para01_eden_100_111_i_need_count_one_one_ad7671: "I do not need to count one by one. This request is for selecting the best adventurer."
  npc_override_moc_para01_eden_100_111_i_once_got_lost_maze_407451: "I once got lost in a maze north of Prontera. I thought I was going in circles forever until I finally made it out."
  npc_override_moc_para01_eden_100_111_i_shoud_investigate_abou_0a0fb6: "I shoud investigate about the client by myself but for now please clear ^FF000020 Anubis^000000 on the 4th floor of Sphinx dungeon."
  npc_override_moc_para01_eden_100_111_i_think_s_what_true_809448: "I think that's what a true master would sound like right?"
  npc_override_moc_para01_eden_100_111_i_think_you_should_rest_19077d: "I think you should rest a bit. Even adventurers need their rest right?"
  npc_override_moc_para01_eden_100_111_i_think_you_suitable_req_5080be: "I do not think you are suitable to the request I can give. Please find other adventures."
  npc_override_moc_para01_eden_100_111_i_thought_eden_group_bus_cff7ab: "I thought Eden Group was busy but I could not imagine it is this much. I should do more as an adventurer!"
  npc_override_moc_para01_eden_100_111_i_try_give_you_couple_fbeee3: " I will try to give you a couple things. I am not sure if there will be enough to give because of so many adventurers."
  npc_override_moc_para01_eden_100_111_i_understand_you_i_got_2c048a: "I understand you. I got into a fight when I first met master in Mora village."
  npc_override_moc_para01_eden_100_111_i_understand_you_might_w_ef6cbe: "I understand you might\twonder why a Sura wants an Archbishop as a teacher..."
  npc_override_moc_para01_eden_100_111_i_used_adventurer_eden_g_5efcff: "I used to an adventurer for the Eden Group just like you but of course I was the best."
  npc_override_moc_para01_eden_100_111_i_used_take_care_request_ad8718: "I used to take care of the request but I am worried. The request is to clear ^FF000030 Majoruros^000000 from the 2nd floor of the underground cave."
  npc_override_moc_para01_eden_100_111_i_ve_recently_received_s_76c598: "I've recently received several requests from clients that need the help of Adventurers just like yourself."
  npc_override_moc_para01_eden_100_111_i_want_you_take_care_085a4b: "I want you to take care of it. For me it was fine to be there alone. But for you.. I recommend you to bring more adventurers."
  npc_override_moc_para01_eden_100_111_i_wish_i_could_glass_bdf22b: "I wish I could have a glass of fresh fruit juice..."
  npc_override_moc_para01_eden_100_111_i_wonder_what_reason_beh_c47359: "I wonder what the reason is behind these monk pilgrimages and why they keep doing it... There must be a hidden reason."
  npc_override_moc_para01_eden_100_111_i_wonder_why_they_schemi_b30883: "I wonder why they are scheming this kind of ^FF0000nonsense^000000... makes me wonder if they even know anything about adventuring."
  npc_override_moc_para01_eden_100_111_ice_cave_directly_north_fced52: "The Ice cave is directly north of Rachel. The problem is that the Wolves frighten tourists when they are heading to see the Ice cave."
  npc_override_moc_para01_eden_100_111_if_there_something_good_989dde: "If there is something good "
  npc_override_moc_para01_eden_100_111_if_they_filed_properly_r_b2b629: "If they were not filed properly, the request of looking for a paper will be included to the request list."
  npc_override_moc_para01_eden_100_111_if_you_find_don_t_3244a1: "If you find it don't be scared. Master did not have to fight the Tendrilion 12 times."
  npc_override_moc_para01_eden_100_111_if_you_matured_enough_ne_b264b8: "If you are matured enough not to need a request Make sure that you are not allowed to use a pass."
  npc_override_moc_para01_eden_100_111_journey_lowest_floor_gla_307c55: "The journey to the lowest floor of Glastheim is a long trip but it can be fun if you go with a party."
  npc_override_moc_para01_eden_100_111_kind_useless_there_witho_a1b51a: "Kind of useless to be there without a partner but oh well."
  npc_override_moc_para01_eden_100_111_kindness_pass_insufficie_097a05: "^FF0000Kindness pass^000000 is insufficient."
  npc_override_moc_para01_eden_100_111_lets_real_request_after_a648e9: "Lets do the real request after clearing the simple one."
  npc_override_moc_para01_eden_100_111_majoururos_easy_hunt_so_e57bd2: "Majoururos is not easy to hunt so be careful. The request is to clear ^FF000030 Majoruros^000000 in the underground cave second floor."
  npc_override_moc_para01_eden_100_111_make_good_use_72a538: "Make good use of it."
  npc_override_moc_para01_eden_100_111_make_request_list_you_so_d64173: " will make a request list for you so go talk to my Master now and show your respects."
  npc_override_moc_para01_eden_100_111_makes_me_feel_weird_bad_79af7c: "That makes me feel weird. That is not bad but I guess I'm bad and I don't care."
  npc_override_moc_para01_eden_100_111_master_accepted_request_398508: "Master accepted this request because he respects those monks. The request is to clear ^FF000030 Sting^000000 monsters in underground waterway for a safe pilgrimage."
  npc_override_moc_para01_eden_100_111_master_decided_adventure_4285f5: "Master decided that adventurer's safety is important because lots of new requests are dangerous."
  npc_override_moc_para01_eden_100_111_master_rohter_i_traveled_5186e6: "Master Rohter and I traveled deep into the ship and battled a monster known as ^FF0000Drake^000000. That day I was determined that I would be the best adventurer."
  npc_override_moc_para01_eden_100_111_master_s_guild_dismissed_9da707: "Master's guild was dismissed at the Ash Vacuum because their guild master went missing after a battle with some Cornus monsters."
  npc_override_moc_para01_eden_100_111_master_started_out_as_po_1dd19f: "Master started out as a popular support Monk at the Prontera monastery."
  npc_override_moc_para01_eden_100_111_memory_girl_important_pl_45e8ab: "The memory of a girl is important ! Please clear ^FF000030 Nightmare Terror^000000."
  npc_override_moc_para01_eden_100_111_memory_girl_important_pl_aac8f6: "The memory of a girl is important! Please clear ^FF000030 Nightmare Terror^000000."
  npc_override_moc_para01_eden_100_111_monk_pilgrimage_seeks_pr_cc8d36: "A monk is on a pilgrimage and seeks protection against some alligator-like creatures."
  npc_override_moc_para01_eden_100_111_monk_s_pilgrimage_destin_b48518: "The monk's pilgrimage destination is on the 2nd floor of the Glastheim castle underground cave. It is not an easy journey but will be a good experience."
  npc_override_moc_para01_eden_100_111_msg_3a52ce: "^000000."
  npc_override_moc_para01_eden_100_111_msg_5bab61: "?"
  npc_override_moc_para01_eden_100_111_msg_93fcbf: "......"
  npc_override_moc_para01_eden_100_111_msg_c77c95: "......."
  npc_override_moc_para01_eden_100_111_msg_da39a3: " "
  npc_override_moc_para01_eden_100_111_must_very_tough_such_str_a82dcc: "It must be very tough to do such a strange request."
  npc_override_moc_para01_eden_100_111_my_master_accepted_reque_865304: "My master accepted this request simply because it was insane. Please clear ^FF000030 Medusa^000000 monster in the west cave of Comodo."
  npc_override_moc_para01_eden_100_111_my_surprise_beast_got_ba_38a56e: "But to my surprise, the beast got back up. I was forced to beat it down 12 more times before it stayed down. This was not a normal Tens Drillion."
  npc_override_moc_para01_eden_100_111_natural_more_accidents_n_deb37a: "It is natural to have more accidents with new monsters. It is a common request. Please clear ^FF000030 Pinguicula^000000."
  npc_override_moc_para01_eden_100_111_no_time_make_badge_advan_62e8c0: "No time to make ^ff0000The badge of advanced Eden Group.^000000"
  npc_override_moc_para01_eden_100_111_novel_novel_please_clear_6c5b15: "A novel is a novel. Please clear ^FF000030 Desert Wolf^000000 near the entrance to the Ice dungeon in Rachel."
  npc_override_moc_para01_eden_100_111_now_she_blames_deleters_80d6f1: "Now she blames the Deleters so she has made this request. Please clear ^FF000030 Flying Deleter^000000."
  npc_override_moc_para01_eden_100_111_obviously_they_re_snakes_fba329: "Obviously they're snakes but who are we to stamp on this crazy guy's dreams right?"
  npc_override_moc_para01_eden_100_111_oh_boy_look_his_face_2960b4: "Oh boy the look on his face was priceless!"
  npc_override_moc_para01_eden_100_111_oh_how_long_been_ec0c5b: "Oh, how long has it been?"
  npc_override_moc_para01_eden_100_111_oh_no_please_don_t_37e5b3: "Oh no... Please don't do that. I am sorry please keep it as a secret to a master. I was careless."
  npc_override_moc_para01_eden_100_111_oh_you_re_back_safely_aee69c: "Oh you're back safely!"
  npc_override_moc_para01_eden_100_111_ok_i_ve_got_story_3d1327: "Ok, I've got a story for you in exchange for the kindness pass."
  npc_override_moc_para01_eden_100_111_okay_you_doing_best_you_8570f4: "Okay ! You are doing the best that you can do."
  npc_override_moc_para01_eden_100_111_once_i_found_secret_rout_78c919: "Once I found a secret route to get to Jawaii... It's only for couples but some of us know how to get there still."
  npc_override_moc_para01_eden_100_111_one_fine_windy_day_i_69e94c: "One fine windy day, I was collecting flowers in west south of the Midgard Allied Forces Post to fulfill an Eden Group request."
  npc_override_moc_para01_eden_100_111_one_time_master_i_went_254c52: "One time, master and I went to the cave west of Comodo and when we saw the Medusa monster..."
