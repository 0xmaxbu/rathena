  npc_override_moc_para01_eden_121_130_just_think_job_hand_enou_b10217: "Just think of the job at hand. That will be enough."
  npc_override_moc_para01_eden_121_130_maybe_disappointed_falle_d643f4: "Maybe, disappointed and fallen down because a monster was not found on the ground of the lake."
  npc_override_moc_para01_eden_121_130_maybe_hanging_out_drinki_f9655f: "Maybe... hanging out and drinking with the dead. But please talk with me."
  npc_override_moc_para01_eden_121_130_melody_jack_swipes_dagge_681307: "Melody-Jack swipes a dagger in your direction."
  npc_override_moc_para01_eden_121_130_msg_93fcbf: "......"
  npc_override_moc_para01_eden_121_130_my_business_time_differe_8a0258: "It is not my business. But this time is different. A little boy might be in a danger so lets hurry to clear these monsters."
  npc_override_moc_para01_eden_121_130_my_feeling_you_might_lik_7185e3: "It is my feeling but you might like it. I am sure ^FF0000Agav^000000 and ^FF0000Echio^000000 will not like you."
  npc_override_moc_para01_eden_121_130_nameless_island_known_us_bf1581: "Nameless Island is not known to usual adventurers. Aigu is also interested in there."
  npc_override_moc_para01_eden_121_130_neither_green_nor_red_di_41f22d: "Neither green nor red are disturbing. But regardless, come back after clearing all."
  npc_override_moc_para01_eden_121_130_nice_come_back_midgard_v_62c25b: "It is nice to come back to Midgard! Very exciting as the first day."
  npc_override_moc_para01_eden_121_130_no_i_care_fine_if_2cd661: "No. I do not care It will be fine if you stepped into this room not because you are lost. I need anyone except that kind of fool."
  npc_override_moc_para01_eden_121_130_oh_i_made_mistake_you_42e31d: "Oh, I made a mistake. You are not the level of adventurer I am looking for. I'm looking for base level 121 to 130 adventurers."
  npc_override_moc_para01_eden_121_130_oh_why_aren_t_you_bda683: "Oh, why aren't you a part of Eden Group?"
  npc_override_moc_para01_eden_121_130_oh_you_ve_already_finish_1d574f: "Oh, you've already finished {0} Adventure. Thank you for helping me out with this task!."
  npc_override_moc_para01_eden_121_130_oh_you_ve_been_working_76bb5e: "Oh, you've been working on {0} Adventure task. Let me clear your record, so you can work on better tasks."
  npc_override_moc_para01_eden_121_130_our_deal_kept_as_secret_129f00: "Our deal will be kept as a secret to Aigu. If you do not have 9 lives. Lets start."
  npc_override_moc_para01_eden_121_130_panic_due_beautiful_appe_333f54: "Do not panic due to beautiful appearances regardless if it is an angel or a creature. You should do your job."
  npc_override_moc_para01_eden_121_130_please_clear_banshee_ins_1d36da: "Please clear ^FF0000Banshee^000000 inside of Nameless Island. Do not say no. You know it is for Aigu as well."
  npc_override_moc_para01_eden_121_130_please_clear_monsters_he_2e9e51: "Please clear monsters to help Aigu. Amateurs will make things messy."
  npc_override_moc_para01_eden_121_130_please_clear_zombie_slau_319b5f: "Please clear ^FF0000Zombie Slaughter^000000. Be careful to avoid their blades."
  npc_override_moc_para01_eden_121_130_please_listen_me_i_offer_aafae3: "Please listen to me, I will offer you an attractive suggestion."
  npc_override_moc_para01_eden_121_130_please_pretend_know_me_i_65e6d9: "Or please pretend not to know me! I will be in a danger if you blow my cover!"
  npc_override_moc_para01_eden_121_130_please_take_look_if_ther_450a56: "Please take a look if there are any traces of lost adventurers at the southeast part of the 2nd floor in the middle zone."
  npc_override_moc_para01_eden_121_130_rachel_sanctuary_approac_ff6e8d: "Rachel sanctuary will be approaching from everywhere. You should be careful of this one."
  npc_override_moc_para01_eden_121_130_ragged_zombie_hunting_5100c9: "Ragged Zombie Hunting"
  npc_override_moc_para01_eden_121_130_ragged_zombie_reduced_go_340214: "Ragged Zombie is reduced. It is a good time to proceed Aigu's request for a minute."
  npc_override_moc_para01_eden_121_130_really_i_introduce_mysel_aa672d: "Really? I will introduce myself! I am the head of the ^ff0000Dandelion band Aigu.^000000"
  npc_override_moc_para01_eden_121_130_remember_there_strange_m_2773b5: "Remember, there is strange music as sharp as knife to kill people in the world."
  npc_override_moc_para01_eden_121_130_request_like_me_i_just_4f78c2: "This request is like that for me. I just do not like creatures or the reason of giving this request."
  npc_override_moc_para01_eden_121_130_request_request_whatever_6837de: "A request for a request... Whatever."
  npc_override_moc_para01_eden_121_130_sanctuary_rachel_prohibi_d5176f: "Sanctuary in Rachel is prohibited to normal people from entering. You gotta know that."
  npc_override_moc_para01_eden_121_130_say_yes_3527d3: "Say yes."
  npc_override_moc_para01_eden_121_130_searching_nameless_islan_9ac416: "Searching Nameless Island will continue at another time. How about taking a rest for a while?"
  npc_override_moc_para01_eden_121_130_searching_rachel_enough_e60a68: "Searching Rachel was enough. I will ask you again after a while."
  npc_override_moc_para01_eden_121_130_see_someone_needs_reques_b13d8b: "See? Someone needs this request. Clear ^FF0000Banshees^000000 at Nameless Island."
  npc_override_moc_para01_eden_121_130_seems_i_lose_one_mission_fbb1af: "It seems that I have to lose one mission, deal and promise, I can not take it right now."
  npc_override_moc_para01_eden_121_130_seems_you_re_currently_d_afa6a8: "It seems that you're currently not doing the Thanatos Tower adventure request. I'm sorry but I'm doing this for Aigu and not you."
  npc_override_moc_para01_eden_121_130_show_me_requests_a24075: "Show me the requests!"
  npc_override_moc_para01_eden_121_130_someone_who_believes_the_c7df9f: "Someone who believes they are right are the most dangerous. This world is full of fools."
  npc_override_moc_para01_eden_121_130_subdue_gold_blue_acidus_590067: "Subdue the Gold and Blue Acidus monsters at the last level of Abyss Lake."
  npc_override_moc_para01_eden_121_130_subdue_them_as_best_as_a50d54: "Subdue them as best as you can. Do not mind their colors because they are all to be cleared."
  npc_override_moc_para01_eden_121_130_take_bath_you_won_t_bcf836: "Take a ^FF0000bath^000000 and you won't smell anymore."
  npc_override_moc_para01_eden_121_130_take_my_mission_solve_re_ff477f: "Take my mission and solve the request of Aigu. I will compensate you."
  npc_override_moc_para01_eden_121_130_take_request_877f13: "Take the request."
  npc_override_moc_para01_eden_121_130_take_rest_we_should_go_97d1f0: "Take a rest. We should go and subdue Acidus dragons again."
  npc_override_moc_para01_eden_121_130_technically_training_exe_3076fb: "This is technically a training exercise but just pretend you are helping someone. There will be a reward."
  npc_override_moc_para01_eden_121_130_thanatos_tower_most_anno_835147: "Thanatos tower is the most annoying place. Do not worry about your compensation. I keep my word."
  npc_override_moc_para01_eden_121_130_thanatos_tower_north_sch_89b482: "Thanatos tower is north of the Schwarzwald Republic! It is not far from Juno or Hugel."
  npc_override_moc_para01_eden_121_130_thanatos_tower_related_dccba6: "Thanatos Tower related "
  npc_override_moc_para01_eden_121_130_thanatos_tower_search_01c84a: "Thanatos Tower search"
  npc_override_moc_para01_eden_121_130_thank_you_there_wanderin_d8097c: "Thank you! There are wandering adventurers also helping! We should continue to search anyway. Please help me next time again."
  npc_override_moc_para01_eden_121_130_there_cave_where_dragons_bfad8b: "There is a cave where dragons are living inside of Abyss Lake. There are so many but flying things are annoying."
  npc_override_moc_para01_eden_121_130_there_must_lot_them_forg_10dc90: "There must be a lot of them. Do not forget to keep this a secret. "
  npc_override_moc_para01_eden_121_130_there_sanctuary_inside_r_cc661a: "There is a sanctuary inside of Rachel Shrine. It is possible to get stuck there once you're inside."
  npc_override_moc_para01_eden_121_130_there_traces_someone_bei_76bc80: "There are traces of someone being here."
  npc_override_moc_para01_eden_121_130_these_some_most_dangerou_374705: "These are some of the most dangerous creatures in the world. These creatures deserve no justice."
  npc_override_moc_para01_eden_121_130_they_dangerous_unlike_ra_0e6a2f: "They are dangerous unlike Ragged Zombie because they swing something sharp."
  npc_override_moc_para01_eden_121_130_they_need_faster_hands_t_29d1e7: "They need faster hands than a head. I do not worry but you should be careful."
  npc_override_moc_para01_eden_121_130_they_run_into_you_hesita_e87362: "They will run into you. Do not hesitate and keep focused on the job."
  npc_override_moc_para01_eden_121_130_they_think_they_find_clu_dbb917: "They think they can find a clue there but it is not a safe place. You should clear Vanberk and Isilla in advance."
  npc_override_moc_para01_eden_121_130_true_getting_more_danger_01c247: "It is true that it is getting more dangerous inside of Rachel sanctuary, but Aigu will not care for things we are not sure."
  npc_override_moc_para01_eden_121_130_unknown_mosters_dangerou_ccc1bd: "Unknown mosters are dangerous so clear them first. I will inform you if something happens."
  npc_override_moc_para01_eden_121_130_vanberk_isilla_6cfe74: "Vanberk and Isilla"
  npc_override_moc_para01_eden_121_130_we_just_keeping_our_end_ce3002: "We are just keeping our end of the deal. Clear those creatures now."
  npc_override_moc_para01_eden_121_130_well_go_away_i_no_25ccd5: "Well go away. I have no interest in you."
  npc_override_moc_para01_eden_121_130_what_bother_me_i_am_f7e672: "What? do not bother me. I am busy now."
  npc_override_moc_para01_eden_121_130_what_you_interested_me_36be86: "What? Are you interested in me?"
  npc_override_moc_para01_eden_121_130_what_your_request_aa4a91: "What is your request?"
  npc_override_moc_para01_eden_121_130_which_one_more_dangerous_b5c3eb: "Which one is more dangerous between Ferus and Bewler? I do not know. Clear both of them."
  npc_override_moc_para01_eden_121_130_who_hell_you_get_out_7b279d: "Who the hell are you? Get out of here!"
  npc_override_moc_para01_eden_121_130_who_re_all_these_kids_101a51: "Who're all of these kids?"
  npc_override_moc_para01_eden_121_130_wish_clear_ragged_zombie_be825e: "Wish to clear ^FF0000Ragged Zombie^000000. It is easy because they show up everywhere."
  npc_override_moc_para01_eden_121_130_yek_i_hate_33a490: "yek.. I hate."
  npc_override_moc_para01_eden_121_130_yes_5397e0: "Yes"
  npc_override_moc_para01_eden_121_130_yes_end_good_adventure_n_436aa3: "Yes! The end of a good adventure needs a dragon! I've heard there is a monster on the ground of a lake."
  npc_override_moc_para01_eden_121_130_yes_maybe_they_re_able_aecb6e: "Yes, Maybe they're not able to come because they've been captured by the dead! Nameless Island will be fine! Please search Nameless Island."
  npc_override_moc_para01_eden_121_130_you_came_back_safely_i_517ec5: "You came back safely but I guess there was no good result for your face. I will search more so do not disappoint! Thank you."
  npc_override_moc_para01_eden_121_130_you_ever_heard_melody_th_f0d5c7: "Have you ever heard the melody they are playing? You will have a chance if that little boy begins to play the performance again."
  npc_override_moc_para01_eden_121_130_you_finished_helping_aig_289be6: "You finished helping Aigu or did you quit? Anyways I have no more business for you. "
  npc_override_moc_para01_eden_121_130_you_got_request_little_g_f36807: "You got a request from that little girl? The small, talktive and half-naked one over there?"
  npc_override_moc_para01_eden_121_130_you_know_angel_turned_in_364f44: "Do you know an angel that turned into a monster? I do not know if it was an angel or not. But its appearance was an angel."
  npc_override_moc_para01_eden_121_130_you_know_someone_went_th_e6ca9f: "You know someone went there but you do not know who that is? Thank you. But let me ask you to search again tomorrow since we do not know who it is."
  npc_override_moc_para01_eden_121_130_you_look_fine_maybe_you_37dd2c: "You look fine. Maybe you are better than I thought? I did not check with my eyes though."
  npc_override_moc_para01_eden_121_130_you_may_felt_they_watchi_00f4f4: "You may have felt they are watching once you stepped into the upper area of Thanatos Tower."
  npc_override_moc_para01_eden_121_130_you_may_find_shelter_top_7a68d0: "You may find shelter on top of the tower. Even that shelter only has water and a bonfire."
  npc_override_moc_para01_eden_121_130_you_may_take_rest_day_e7ddfb: "You may take a rest for a day. You cleared enough but fanatic is increased."
  npc_override_moc_para01_eden_121_130_you_meet_them_if_aigu_7d1f27: "You will meet them if Aigu requests. The Dame of Sentinels."
  npc_override_moc_para01_eden_121_130_you_more_talented_advent_a6c903: "You are more of a talented adventurer than I thought. If you found a tactic, take care of it next time. This study is up to you."
  npc_override_moc_para01_eden_121_130_you_must_tired_you_went_a7d69e: "You must be tired. You went to that tough place beyond your capability. Do not be angry. I will reward you for that."
  npc_override_moc_para01_eden_121_130_you_quite_good_you_clear_8888e5: "You are quite good! You cleared them. It will take time to return."
  npc_override_moc_para01_eden_121_130_you_see_there_unwelcomin_82b0a2: "You will see there are unwelcoming things while adventuring sometimes regardless of monsters and companions."
  npc_override_moc_para01_eden_121_130_you_ve_got_many_things_4b49bf: "You've got many things to take care of so I will hold my words. Clear them."
  npc_override_moc_para01_eden_131_140_according_book_some_magi_0a933f: "According to that book, some magic by 25 years olds can be stronger than older wizards."
  npc_override_moc_para01_eden_131_140_aigu_only_my_mind_i_a8ac22: "Aigu is only on my mind. I can not think of anything else. I am fine even if it is just a one-sided love..."
  npc_override_moc_para01_eden_131_140_alas_i_think_aigu_likes_b3c3f8: "But alas, I think Aigu likes someone else. ^FF0000We've never met... But I hate him.^000000"
  npc_override_moc_para01_eden_131_140_angel_incarnation_51c45e: "Angel Incarnation"
  npc_override_moc_para01_eden_131_140_appearance_looks_fine_in_1f809e: "Appearance looks fine but inside.. I am sure they are flesh and blood!"
  npc_override_moc_para01_eden_131_140_aren_t_you_curious_why_6de89c: "Aren't you curious why it has that horn? I think it has an interesting story that people would like. Shall I ask you adventurer?"
  npc_override_moc_para01_eden_131_140_course_i_did_check_mysel_582304: "Of course, I did not check by myself. But I am just a story teller as you see."
  npc_override_moc_para01_eden_131_140_creature_without_clothin_fbaba8: "The creature without clothing has very weird shape. Haha do not take it seriously. I am just a story teller."
  npc_override_moc_para01_eden_131_140_daughter_merchant_armeye_1d5765: "A daughter of a merchant. Armeyer Dinze, she looks like a rich woman. But she looks insecure."
  npc_override_moc_para01_eden_131_140_did_you_hear_story_thank_0d66ad: "Did you hear the story of {0}? Thanks you. I promise to make a good song."
  npc_override_moc_para01_eden_131_140_egnigem_cenia_swordman_m_6f102c: "Egnigem Cenia (Swordman Monster)"
  npc_override_moc_para01_eden_131_140_errende_ebecee_one_who_s_5de375: "Errende Ebecee is the one who started a journey to look for someone."
  npc_override_moc_para01_eden_131_140_find_get_rid_dark_incarn_b9760f: "Find and get rid of 30 Dark Incarnation of Morocc."
  npc_override_moc_para01_eden_131_140_haha_i_am_sorry_request_f0af71: "Haha. I am sorry to request to adventurers even though I am a new."
  npc_override_moc_para01_eden_131_140_haha_please_mind_just_jo_ecac76: "Haha please do not mind. It is just joke of a story teller. Please give me another story next time."
  npc_override_moc_para01_eden_131_140_here_my_plan_i_am_a58c3f: "Here my plan is. I am making 4 passages for each Scaraba."
  npc_override_moc_para01_eden_131_140_hi_i_m_new_member_e7b781: "Hi. I'm the new member of the Dandelion band Ragi. I am making songs on behalf of Aigu. Are you interested in a story?"
  npc_override_moc_para01_eden_131_140_horn_thing_bothers_me_li_d6e351: "That horn thing bothers me a little bit. What is the difference between one and two horns? Just appearance?"
  npc_override_moc_para01_eden_131_140_how_far_could_she_contin_c83b4b: "How far could she have continued her journey? I guess she could not do it alone."
  npc_override_moc_para01_eden_131_140_how_your_adventure_fun_p_bc1a71: "How was your adventure? Was it fun? Please let me hear your adventure story someday."
  npc_override_moc_para01_eden_131_140_i_am_collecting_stories_f4d21e: "I am collecting stories to make a song on behalf of Aigu."
  npc_override_moc_para01_eden_131_140_i_am_curious_because_loo_426d74: "But I am curious because it looks like a ghost and attacks does not work."
  npc_override_moc_para01_eden_131_140_i_am_just_storyteller_an_aaee2e: "I am just a storyteller.. Any story can be made up. Most of the times it contains the truth."
  npc_override_moc_para01_eden_131_140_i_am_making_story_about_cde1b9: "I am making a story about Uni-Horn Scaraba. One means less than two!~ I started but it is difficult to finish. Can you help me?"
  npc_override_moc_para01_eden_131_140_i_am_making_story_two_a0da62: "I am making a story... Two means less than three~ I started to make a story but I can not finish. Will you help me?"
  npc_override_moc_para01_eden_131_140_i_ask_other_adventurers_9766d4: "I will ask to other adventurers about the story of {0}."
  npc_override_moc_para01_eden_131_140_i_continue_make_story_so_d86222: "I will continue to make a story or songs. But adventurers should step into a new adventure."
  npc_override_moc_para01_eden_131_140_i_did_make_song_as_13c09c: "I did not make a song as a member of band yet. Someday, I will make a great song for you!"
  npc_override_moc_para01_eden_131_140_i_feel_like_rake_horn_52ffba: "I feel like Rake Horn Scaraba has more story. Please help me if you have time."
  npc_override_moc_para01_eden_131_140_i_guess_his_journey_also_d37e95: "But I guess... His journey also might have stopped somewhere in Lighthalzen. Please listen to his story."
  npc_override_moc_para01_eden_131_140_i_hate_myself_more_becau_18af0a: "But I hate myself more because I want to stay around her even if she will never see me. Haha was I too serious?"
  npc_override_moc_para01_eden_131_140_i_heard_his_shadow_his_9cbe3a: "I heard his shadow and his arrow are wandering somewhere. Please go to Lighthalzen and tell me his story."
  npc_override_moc_para01_eden_131_140_i_hope_see_you_again_48eee5: "I hope to see you again as we farewell with smile."
  npc_override_moc_para01_eden_131_140_i_know_if_everything_cam_5dac33: "I do not know if everything came out from Satan Morocc himself but things like this look horrible."
  npc_override_moc_para01_eden_131_140_i_like_story_careful_if_68e710: "I like this story but be careful if you do not want to end up a story yourself."
  npc_override_moc_para01_eden_131_140_i_lose_her_story_i_8f7e52: "I can not lose her story. I really wish you to stop by."
  npc_override_moc_para01_eden_131_140_i_m_giving_requests_base_9d145d: "I'm giving requests to base level ^FF0000130-140^000000 adventurers only."
  npc_override_moc_para01_eden_131_140_i_m_starting_get_confuse_4fb512: "I'm starting to get confused. I am going to make a song of the Rake Horn Scarabas story."
  npc_override_moc_para01_eden_131_140_i_never_been_ash_vacuum_cca3e8: "I never been to Ash Vacuum but I heard there are many interesting creatures there in the Scaraba Hall."
  npc_override_moc_para01_eden_131_140_i_never_forget_first_day_e3ab18: "I will never forget the first day I met her. She stared at me out of all the people in Izlude port. Now I help her by doing small errands."
  npc_override_moc_para01_eden_131_140_i_no_know_why_i_37dca8: "I do no know why. I just heard from people. I need to make a song so please take a look at their world!"
  npc_override_moc_para01_eden_131_140_i_think_there_also_story_d82bb4: "But I think there also will be a story in it. That is why those creature are made. Please look for something black and tar-like."
  npc_override_moc_para01_eden_131_140_i_want_make_song_about_727839: "I want to make a song about the ^FF0000Uni-Horn Scaraba^000000!? Children will really like it."
  npc_override_moc_para01_eden_131_140_i_want_make_song_these_372ccc: "I want to make a song with these stories. Please help me."
  npc_override_moc_para01_eden_131_140_i_wonder_how_far_her_6f9086: "I wonder how far her heart has been reached? Please listen to her story. Please tell me."
  npc_override_moc_para01_eden_131_140_i_wonder_what_uni_horn_701089: "I wonder what Uni-Horn Scarabas think? I want to make a song. Thanks for your help!"
  npc_override_moc_para01_eden_131_140_just_take_look_list_you_0ac29a: "Just take a look at the list. Can you help me if it is okay with you?"
  npc_override_moc_para01_eden_131_140_kavach_icarus_name_whose_79515b: "Kavach Icarus is the name whose hands are faster than eyes and shoots arrows swiftly."
  npc_override_moc_para01_eden_131_140_laurell_weinder_who_deci_a746d0: "Laurell Weinder, who decided to have a difficult journey to repay gratitude for some wizards deed."
  npc_override_moc_para01_eden_131_140_lighthalzen_many_stories_316eaf: "Lighthalzen has many stories that I'm sure are sad and lost. Their stories should not be forgotten so please tell me what you can."
