  npc_override_moc_para01_eden_100_111_kind_useless_there_witho_a1b51a: "Kind of useless to be there without a partner but oh well."
  npc_override_moc_para01_eden_100_111_kindness_pass_4d06d6: "The ^FF0000kindness pass^000000?"
  npc_override_moc_para01_eden_100_111_kindness_pass_insufficie_097a05: "^FF0000Kindness pass^000000 is insufficient."
  npc_override_moc_para01_eden_100_111_lets_give_good_lesson_su_212098: "Lets give a good lesson for sure."
  npc_override_moc_para01_eden_100_111_lets_real_request_after_a648e9: "Lets do the real request after clearing the simple one."
  npc_override_moc_para01_eden_100_111_loli_ruri_hunting_niflhe_94d142: "Loli Ruri Hunting - Niflheim"
  npc_override_moc_para01_eden_100_111_majoururos_easy_hunt_so_e57bd2: "Majoururos is not easy to hunt so be careful. The request is to clear ^FF000030 Majoruros^000000 in the underground cave second floor."
