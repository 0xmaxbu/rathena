  npc_override_moc_para01_eden_100_111_client_showed_wonderful_9ded94: "A client showed a wonderful dance to a lover. One day, they were attacked from a Deleter while they are dancing in the magma dungeon."
  npc_override_moc_para01_eden_100_111_collect_brigan_simple_co_e0cef0: "Collect 50 ^ff0000Brigan.^000000 It is a simple and complicated test."
  npc_override_moc_para01_eden_100_111_consider_memory_others_t_9a7131: "Consider the memory of others. There is stil abeauty in the world. It would be a good experience for you."
  npc_override_moc_para01_eden_100_111_course_i_beat_beast_easi_6ea832: "Of course I beat that beast easily! It was easier than taking candy from a Poring."
