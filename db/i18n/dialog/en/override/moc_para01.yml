  npc_override_moc_para01_eden_100_111_please_clear_ice_titan_i_ce3e4b: "Please clear ^FF000030 Ice Titan^000000 at the Ice cave."
  npc_override_moc_para01_eden_100_111_please_clear_luciola_ves_939197: "Please clear ^FF000030 Luciola Vespa^000000."
  npc_override_moc_para01_eden_100_111_please_clear_medusa_west_b02e49: "Please clear ^FF000030 Medusa^000000 in the western cave of Comodo."
