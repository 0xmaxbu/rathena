  npc_override_moc_para01_eden_100_111_don_t_upset_because_mast_af16d8: "Don't be upset because Master is ultimately responsible if an Adventurer gets injured during a request."
  npc_override_moc_para01_eden_100_111_easy_find_monsters_turtl_fea9b8: "It is easy to find from monsters at Turtle Island or at Glastheim."
  npc_override_moc_para01_eden_100_111_eden_group_aware_great_r_c6b271: "Eden Group is aware that this is not a great reason but a request is a request. So please clear ^FF000030 Carat^000000 monsters inside of Glastheim castle."
