  npc_override_moc_para01_eden_100_111_i_understand_you_might_w_ef6cbe: "I understand you might\twonder why a Sura wants an Archbishop as a teacher..."
  npc_override_moc_para01_eden_100_111_i_used_adventurer_eden_g_5efcff: "I used to an adventurer for the Eden Group just like you but of course I was the best."
  npc_override_moc_para01_eden_100_111_i_used_take_care_request_ad8718: "I used to take care of the request but I am worried. The request is to clear ^FF000030 Majoruros^000000 from the 2nd floor of the underground cave."
  npc_override_moc_para01_eden_100_111_i_ve_recently_received_s_76c598: "I've recently received several requests from clients that need the help of Adventurers just like yourself."
  npc_override_moc_para01_eden_100_111_i_want_you_take_care_085a4b: "I want you to take care of it. For me it was fine to be there alone. But for you.. I recommend you to bring more adventurers."
  npc_override_moc_para01_eden_100_111_i_wish_i_could_glass_bdf22b: "I wish I could have a glass of fresh fruit juice..."
  npc_override_moc_para01_eden_100_111_i_wonder_what_reason_beh_c47359: "I wonder what the reason is behind these monk pilgrimages and why they keep doing it... There must be a hidden reason."
  npc_override_moc_para01_eden_100_111_i_wonder_why_they_schemi_b30883: "I wonder why they are scheming this kind of ^FF0000nonsense^000000... makes me wonder if they even know anything about adventuring."
  npc_override_moc_para01_eden_100_111_ice_cave_directly_north_fced52: "The Ice cave is directly north of Rachel. The problem is that the Wolves frighten tourists when they are heading to see the Ice cave."
  npc_override_moc_para01_eden_100_111_if_there_something_good_989dde: "If there is something good "
