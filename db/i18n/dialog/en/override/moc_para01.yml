  npc_override_moc_para01_2012_headgears_new_bunny_band_061613: "- New Bunny Band"
  npc_override_moc_para01_2012_headgears_new_joker_jester_58ab6f: "- New Joker Jester"
  npc_override_moc_para01_2012_headgears_new_kitsune_mask_373b5b: "- New Kitsune Mask"
  npc_override_moc_para01_2012_headgears_new_mage_hat_157063: "- New Mage Hat"
  npc_override_moc_para01_2012_headgears_new_magician_hat_611c06: "- New Magician Hat"
  npc_override_moc_para01_2012_headgears_new_munak_hat_2a0df6: "- New Munak Hat"
  npc_override_moc_para01_2012_headgears_new_phantom_opera_mask_2bb4ae: "- New Phantom Opera Mask"
  npc_override_moc_para01_2012_headgears_okay_next_time_then_9bc01c: "Okay. Next time, then."
  npc_override_moc_para01_2012_headgears_okay_please_contact_if_y_9c474a: "Okay, please contact if you need me in the future."
  npc_override_moc_para01_2012_headgears_our_research_shows_some_afed56: "Our research shows that some methods enable humans to accumulate the energy crystals inside of the body in the form of a buff."
  npc_override_moc_para01_2012_headgears_please_keep_up_96a95a: "Please keep up on it."
  npc_override_moc_para01_2012_headgears_please_select_equipment_64dc37: "Please select the equipment to exchange for {0}s."
  npc_override_moc_para01_2012_headgears_please_select_monster_yo_d715ad: "Please select the monster that you think you can easily hunt from the list."
  npc_override_moc_para01_2012_headgears_puck_4b1acc: "- Puck -"
  npc_override_moc_para01_2012_headgears_purified_energy_crystals_5f698f: "^FF00005 Purified Energy Crystals^000000 = ^FF00001 High Energy Crystal^000000"
  npc_override_moc_para01_2012_headgears_purified_energy_crystals_b21be1: "600 Purified Energy Crystals"
  npc_override_moc_para01_2012_headgears_reason_doing_33cbd4: "The reason for doing this?"
  npc_override_moc_para01_2012_headgears_request_collection_monst_a0b880: "The request for {0} collection monsters has been issued. Please check the details on the issued document."
  npc_override_moc_para01_2012_headgears_research_team_decided_co_bafdd3: "The Research Team decided to collect Energy Crystals by giving requests to adventurers, with appropriate rewards. That enables us to collect better and be more ^FF0000efficient^000000."
  npc_override_moc_para01_2012_headgears_research_team_sent_me_re_2141d3: "The Research Team has sent me the results they found."
  npc_override_moc_para01_2012_headgears_rough_energy_crystals_0c3530: "300 Rough Energy Crystals"
  npc_override_moc_para01_2012_headgears_rough_energy_crystals_pu_7a2beb: "^FF000010 Rough Energy Crystals^000000 = ^FF00001 Purified Energy Crystal^000000"
  npc_override_moc_para01_2012_headgears_so_we_receive_minimum_ro_5e0ec9: "So we receive a minimum of 300 Rough Energy Crystals, 600 Purified Energy Crystals, and 900 High Energy Crystals."
  npc_override_moc_para01_2012_headgears_takes_hours_your_body_ac_a70d5c: "It takes 3 hours for your body to accumulate 2 to 4 {0} Energy Crystals. Do you want to start?"
  npc_override_moc_para01_2012_headgears_thank_you_very_much_ener_9cee21: "Thank you very much. The Energy Crystals you donated will be greatly helpful for our research. This is your reward for your donation."
  npc_override_moc_para01_2012_headgears_thank_your_support_we_ne_38d0f3: "Thank for your support, but we need 300 Rough Energy Crystals."
  npc_override_moc_para01_2012_headgears_thank_your_support_we_ne_a17c68: "Thank for your support, but we need 900 High Energy Crystals."
  npc_override_moc_para01_2012_headgears_thank_your_support_we_ne_b14f68: "Thank for your support, but we need 600 Purified Energy Crystals."
  npc_override_moc_para01_2012_headgears_thanks_support_adventure_b6bffd: "Thanks to the support of adventurers we can use these Energy Crystals to further our research."
  npc_override_moc_para01_2012_headgears_then_let_s_begin_upgrade_d8a0fa: "Then let's begin to upgrade {0}."
  npc_override_moc_para01_2012_headgears_there_energy_crystals_le_2b2e24: "There are {0} Energy Crystals left, which can compress into {1} Energy Crystals. Do you want to continue?"
  npc_override_moc_para01_2012_headgears_upgrade_successful_your_15593b: "The upgrade was successful. Your Energy Crystals will help our research greatly."
  npc_override_moc_para01_2012_headgears_waiting_time_collection_a7887f: "The waiting time for a {0} collection quest has expired. You can now take another request."
  npc_override_moc_para01_2012_headgears_waiting_time_storing_ene_3ed9df: "The waiting time for storing {0} Energy Crystals has expired. You can now store them again."
  npc_override_moc_para01_2012_headgears_we_collecting_energy_cry_9b6ccd: "We are collecting Energy Crystals so that we can research more combinations of headgears for adventurers."
  npc_override_moc_para01_2012_headgears_when_using_energy_crysta_2b80e5: "^FF0000When using Energy Crystals to upgrade equipment, all previous refinements, enchantments, and cards will be lost.^000000"
  npc_override_moc_para01_2012_headgears_written_request_you_been_0f5f5e: "The written request for you has been withdrawn."
  npc_override_moc_para01_2012_headgears_you_curious_about_energy_237442: "Are you curious about Energy Crystal compression? I can compress lower level Energy Crystals into higher ones."
  npc_override_moc_para01_2012_headgears_you_currently_under_requ_ae0fe3: "You are currently under the request of the {0} collection. If you give up now, all your history will be lost. Do you really want to give up?"
  npc_override_moc_para01_2012_headgears_you_don_t_enough_s_6cbefc: "You don't have enough {0}s."
  npc_override_moc_para01_2012_headgears_you_familiar_precautions_a379d0: "Are you familiar with the ^FF0000precautions^000000?"
  npc_override_moc_para01_2012_headgears_you_may_feel_burden_sake_428ee5: "You may feel that this is a burden, but for the sake of our research, please continue."
  npc_override_moc_para01_2012_headgears_you_might_feel_slight_ti_ab221c: "You might feel a slight tingle."
  npc_override_moc_para01_2012_headgears_you_receive_s_as_collect_f4dbaf: "You receive {0} {1}s as the {2} collection reward."
  npc_override_moc_para01_2012_headgears_you_seem_under_other_req_e1cfe7: "You seem to be under the other request of {0} collection. If the quest seems to be too hard... how about you ^FF0000give up on the request^000000?"
  npc_override_moc_para01_2012_headgears_you_selected_hunt_monste_fc920d: "You selected to hunt a monster from the {0} collection. After hunting these monsters you will receive {1}^0000FF{2} Energy Crystals^000000 when you return to me."
  npc_override_moc_para01_2012_headgears_you_successful_while_sto_0bc4d1: "Were you successful? While storing other Energy Crystals will not have much effect on your body, storing the same one may cause you harm."
  npc_override_moc_para01_2012_headgears_you_under_any_request_e08566: "You are not under any request."
  npc_override_moc_para01_2012_headgears_you_want_accumulate_ener_f86a03: "Do you want to accumulate Energy Crystals inside of your body to receive a buff?"
  npc_override_moc_para01_2012_headgears_you_want_compress_75f386: "Do you want to compress?"
  npc_override_moc_para01_2012_headgears_you_want_compress_energy_ad799c: "Do you want to compress the Energy Crystals?"
  npc_override_moc_para01_2012_headgears_you_want_donate_energy_c_dc4d43: "Do you want to donate Energy Crystals to get a random new headgear?"
  npc_override_moc_para01_2012_headgears_you_want_exchange_energy_c060b1: "Do you want to exchange Energy Crystals for equipment? Please select the type of Energy Crystal that you wish to exchange."
  npc_override_moc_para01_41-55_here_your_reward_c3e50c: "Here is your reward."
