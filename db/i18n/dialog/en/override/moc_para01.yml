  npc_override_moc_para01_eden_100_111_request_merchant_morocc_87cd1c: "This request is from a merchant from Morocc who is somehow losing business from these monsters in Glastheim."
  npc_override_moc_para01_eden_100_111_request_reduce_number_th_59ef53: "The request is to reduce the number of them for the scholar's safety. Please clear ^FF000030 Ice Titan^000000 at the Ice cave."
  npc_override_moc_para01_eden_100_111_request_somewhere_else_o_a1c095: "The request is from ^FF0000somewhere else^000000 other than Midgard."
  npc_override_moc_para01_eden_100_111_request_sphinx_done_plea_98af18: "The request from Sphinx is done. Please take a rest."
  npc_override_moc_para01_eden_100_111_rough_breath_insecure_ey_7090b3: "Rough breath, insecure eyes, freezing cold.. It is not easy request so get yourself warm."
