  npc_override_moc_para01_56-70_i_hope_you_hunt_flora_82c98b: "I hope you can hunt Flora and get me 40 Maneater Blossoms. You are making the world green! Be proud!"
  npc_override_moc_para01_56-70_i_instantly_thought_merm_4d06e6: "I instantly thought it was a mermaid. I was so supprised, I have studied about mermaids in whole my life."
  npc_override_moc_para01_56-70_i_need_maneater_blossom_c8484d: "I need 40 Maneater Blossom from Flora, I know Maneater Blossom is an ugly flower, but still it is a plant."
  npc_override_moc_para01_56-70_i_plan_plant_strong_flow_0b4a1a: "I plan to plant strong flowers in the Morocc desert so the soil gets better."
  npc_override_moc_para01_56-70_i_successfully_accepted_7f9998: "I have successfully accepted the mission. I have to come back and confirm my work after I complete the mission."
  npc_override_moc_para01_56-70_i_want_teach_him_as_bbe35b: "I want to teach him, but as you know I am a blacksmith, a far cry from swimming! Hehe."
  npc_override_moc_para01_56-70_if_i_make_new_toy_f591a1: "But if I can make new toy concepts, like living toys, it will be ground breaking."
  npc_override_moc_para01_56-70_if_you_interested_please_b281a6: "If you are interested, please hunt 30 Mummies and bring 30 Rotten Bandages. You can find them in the Pyramid West of Morocc."
