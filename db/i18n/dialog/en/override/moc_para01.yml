  npc_override_moc_para01_eden_100_111_adventurers_sometimes_br_0f3bfd: "Adventurers sometimes bring special things or trophies from where they visited for a request. It is very good!"
  npc_override_moc_para01_eden_100_111_agood_experience_if_you_21eb5e: "It will be agood experience if you listen to the story of adventurer. There are so much adventure that we heard from a master."
  npc_override_moc_para01_eden_100_111_anonymous_client_sent_re_4e97f4: "An anonymous client sent a request to help clear monsters in Sphinx dungeon because adventurers hardly visit Morocc anymore. The monsters seem to be running rampant there."
