  npc_override_moc_para01_eden_100_111_please_inform_me_when_yo_3b1e94: "Please inform me when you've completed the request."
  npc_override_moc_para01_eden_100_111_please_inform_me_when_yo_5ad45a: "Please inform me when you've cleared this request."
  npc_override_moc_para01_eden_100_111_please_inform_me_when_yo_e06dbd: "Please inform me when you've cleared the request."
  npc_override_moc_para01_eden_100_111_please_try_again_4b5acd: "- Please try again. -^000000"
  npc_override_moc_para01_eden_100_111_reduce_weight_body_8bdd49: "- Reduce the weight of body -"
  npc_override_moc_para01_eden_100_111_remember_stay_brave_you_33081a: "Remember to stay brave you silly adventurer."
