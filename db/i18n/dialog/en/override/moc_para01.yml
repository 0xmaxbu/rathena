  npc_override_moc_para01_2012_headgears_good_welding_mask_e235d2: "- Good Welding Mask"
  npc_override_moc_para01_2012_headgears_here_what_i_make_f33aa8: "Here is what I can make."
  npc_override_moc_para01_2012_headgears_hi_i_am_reno_energy_502aa8: "Hi? I am Reno from the Energy Crystal Research Association, or ECRA."
  npc_override_moc_para01_2012_headgears_high_energy_crystals_bc2fe8: "900 High Energy Crystals"
  npc_override_moc_para01_2012_headgears_hunting_quests_ranked_mo_58784a: "The hunting quests are ranked by monster level and difficulty. The ranges are lower, intermediate, high quests and can only be taken once per day."
  npc_override_moc_para01_2012_headgears_i_am_sorry_request_colle_1cf8f9: "I am sorry but the request for the {0} collection is only available for those level {1} and higher. You do not seem to be capable of carrying out this request."
  npc_override_moc_para01_2012_headgears_i_am_sorry_request_most_edc8a4: "I am sorry but the request for the most advanced collection is only available for those level {0} and higher. You do not seem to be capable of carrying out this request."
  npc_override_moc_para01_2012_headgears_i_like_explain_we_trying_92681e: "I would like to explain that we are not trying to make an excuse to get away from facing problem before I explain the reason. Never! So please let me finish."
  npc_override_moc_para01_2012_headgears_i_recommend_you_try_ccum_b8e45d: "I recommend that you try to ccumulate Energy Crystal when you have time."
  npc_override_moc_para01_2012_headgears_if_works_well_seems_good_0c27e8: "If it works well, it seems to be good for both ECRA and adventurers."
  npc_override_moc_para01_2012_headgears_if_you_need_higher_grade_e23ca1: "If you need higher grade Energy Crystals, this is a good way to get them since the lower ones are easier to get."
  npc_override_moc_para01_2012_headgears_if_you_spend_about_hours_214790: "If you spend about 3 hours, you will be able to gain a small amount of Energy Crystals. So do you want to receive the buff?"
  npc_override_moc_para01_2012_headgears_intermediate_class_sirom_523aaf: "[Intermediate class] Siroma"
  npc_override_moc_para01_2012_headgears_lower_class_requiem_d7a008: "[Lower class] Requiem"
  npc_override_moc_para01_2012_headgears_materials_insufficient_p_3e7881: "The materials are insufficient. Please check your materials."
  npc_override_moc_para01_2012_headgears_materials_make_safety_ri_e090be: "The materials to make a Safety Ring[1] are insufficient. Please check your inventory."
