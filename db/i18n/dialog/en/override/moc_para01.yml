  npc_override_moc_para01_eden_100_111_anyway_i_m_doing_favor_a46e59: "Anyway, I'm doing this a favor to the Eden Group."
  npc_override_moc_para01_eden_100_111_anyways_request_clear_ou_283835: "Anyways, this request is to clear out Anolians in underground waterway to make way for a safe pilgrimage."
  npc_override_moc_para01_eden_100_111_as_you_see_master_made_79ace5: "As you see, master made it himself and put his picture on it. He used to travel aroung for looking for the paper material to make the card."
  npc_override_moc_para01_eden_100_111_attack_ruined_their_danc_7661cf: "The attack ruined their dance and eventually their relationship because the guy blamed the girl for being attacked."
