  npc_override_moc_para01_eden_100_111_eden_group_planning_send_163319: "Eden Group is planning to send a notice that unmature adventurers are not sent to night time requests because it is too dangerous."
  npc_override_moc_para01_eden_100_111_eden_group_protects_love_43fe9f: "Eden Group protects love, justice and Midgard! hurrah!"
  npc_override_moc_para01_eden_100_111_endless_tower_somewhere_79ea8b: "^FF0000Endless tower^000000 is somewhere in the sea. You have to find a guy named Jansor or Jans-something in Alberta and he'll sail you there."
  npc_override_moc_para01_eden_100_111_ever_since_then_he_start_3d6398: "Ever since then he started being mean to weaker adventurers..."
