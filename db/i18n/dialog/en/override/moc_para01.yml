  npc_override_moc_para01_eden_100_111_people_who_been_ice_dung_a3eb45: "People who have been to ice dungeon say there are noisy monsters disturbing their visits. Please clear them if you can put up with it."
  npc_override_moc_para01_eden_100_111_person_standing_next_me_00ce6d: "That person standing next to me is my master... He came back after long journey of practice."
  npc_override_moc_para01_eden_100_111_pilgrimage_monastery_und_c68747: "A Pilgrimage from the monastery to the underground waterway is a journey. The request is to clear ^FF000030 Anolian^000000 in the Glastheim sewer for a safe pilgrimage."
  npc_override_moc_para01_eden_100_111_pinguicula_one_first_mon_5fbcb3: "Pinguicula is one of the first monsters that adventurers encounter when they step into the Ash Vacuum. They expect us to reduce monsters around the Expedition Camp."
