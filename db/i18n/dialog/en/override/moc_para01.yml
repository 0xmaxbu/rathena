  npc_override_moc_para01_eden_100_111_ok_i_ll_help_9e9b0a: "Ok, I'll help."
  npc_override_moc_para01_eden_100_111_ok_i_ve_got_story_3d1327: "Ok, I've got a story for you in exchange for the kindness pass."
  npc_override_moc_para01_eden_100_111_okay_you_doing_best_you_8570f4: "Okay ! You are doing the best that you can do."
  npc_override_moc_para01_eden_100_111_once_i_found_secret_rout_78c919: "Once I found a secret route to get to Jawaii... It's only for couples but some of us know how to get there still."
  npc_override_moc_para01_eden_100_111_one_fine_windy_day_i_69e94c: "One fine windy day, I was collecting flowers in west south of the Midgard Allied Forces Post to fulfill an Eden Group request."
  npc_override_moc_para01_eden_100_111_one_time_master_i_went_254c52: "One time, master and I went to the cave west of Comodo and when we saw the Medusa monster..."
