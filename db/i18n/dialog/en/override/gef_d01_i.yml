  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_once_except_last_774224: "With Khahris... not once except for the last time Maya showed up."
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_vitata_so_other_ff0471: "Khahris... was with Vitata, so the other ants obviously wouldn't touch it."
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_waiting_me_i_go_5e50ee: "Khahris will be waiting for me... I have to go find it."
  npc_override_gef_d01_i_quests_illusion_dungeons_kidnapped_come_think_i_h_e31080: "Kidnapped... Come to think of it, I helped a man who was being chased by a terrific Teddy Bear on the way back."
  npc_override_gef_d01_i_quests_illusion_dungeons_kill_return_them_depths_55970b: "^ff0000Kill 10 {0}, {1}, {2}, {3}, and {4}^000000 and return them to the depths... to rest..."
  npc_override_gef_d01_i_quests_illusion_dungeons_king_smelled_blood_even_b2c114: "King has smelled blood. Even though that's how he found me when I was bleeding to death, it still scares me that he can do that."
  npc_override_gef_d01_i_quests_illusion_dungeons_king_what_7d18d1: "King? What is it?"
  npc_override_gef_d01_i_quests_illusion_dungeons_king_worried_about_growi_f7ccf9: "The king was worried about the growing number of thieves, when a young warrior came in and drove all the invaders away. The king was overjoyed and gave the warrior his daughter's hand in marriage."
  npc_override_gef_d01_i_quests_illusion_dungeons_king_you_don_t_so_40808c: "King, you don't have to be so mean."
  npc_override_gef_d01_i_quests_illusion_dungeons_known_there_hundreds_dif_93a953: "It is known that there are hundreds of different types of trenches in the world's oceans."
  npc_override_gef_d01_i_quests_illusion_dungeons_kuh_if_me_my_brothers_29c47c: "Kuh.. If me and my brothers hadn't emptied the village... the people wouldn't have been taken by the monsters..."
