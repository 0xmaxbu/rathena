  npc_override_gef_d01_i_quests_illusion_dungeons_ha_ha_look_9d33c4: "Ha ha... look!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ha_ha_uh_my_treasure_635142: "Ha... Ha ^BDBDBDuh^000000, my ^BDBDBDtreasure^000000... My treasure..."
  npc_override_gef_d01_i_quests_illusion_dungeons_ha_haha_hahahaha_hahahah_87e4d0: "Ha... Haha... Haha^BDBDBDha^000000ha...... Haha^BDBDBDha^000000hahaha......"
  npc_override_gef_d01_i_quests_illusion_dungeons_ha_s_just_my_delusion_1cc923: "Ha... It's just my delusion. I especially miss that child today."
  npc_override_gef_d01_i_quests_illusion_dungeons_hah_hah_now_there_s_00b777: "Hah hah, now there's only one thing left to try. That is..."
  npc_override_gef_d01_i_quests_illusion_dungeons_haha_don_t_worry_too_e907a5: "Haha, don't worry too much. The dream hasn't happened yet."
  npc_override_gef_d01_i_quests_illusion_dungeons_haha_why_did_only_get_0a3bfd: "Haha... why did this only get discovered now??"
  npc_override_gef_d01_i_quests_illusion_dungeons_haha_why_did_only_get_216bc0: "Haha...why did this only get discovered now??"
  npc_override_gef_d01_i_quests_illusion_dungeons_hahaha_asudem_no_honey_d_8ea74a: "Hahaha Asudem... No honey. Don't you trust my skills? I caught plenty this time as usual."
  npc_override_gef_d01_i_quests_illusion_dungeons_hahaha_nice_meet_you_i_d70c50: "Hahaha Nice to meet you. I don't know if you noticed, but my siblings are triplets."
  npc_override_gef_d01_i_quests_illusion_dungeons_hahaha_s_only_one_day_9e65ff: "Hahaha, it's only one day. What's the big deal? Huh?!"
  npc_override_gef_d01_i_quests_illusion_dungeons_happened_half_day_ago_7a4f71: "It happened ^FF0000half a day ago^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_happy_hunting_adventurer_67ddeb: "Happy hunting, Adventurer!"
  npc_override_gef_d01_i_quests_illusion_dungeons_hard_communicate_a4acd8: " - ^424242Hard to communicate with...^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_hay_3089d0: "Hay!"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_came_back_serious_inj_d442b6: "He came back with a serious injury the other day, and his colleague is still there."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_could_just_another_ch_d818cf: "He could just be another character in the nightmares."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_could_sent_your_frien_dcc4db: "He could be sent by your friends. Human, answer me!"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_couldn_t_sleep_well_5aab89: "He couldn't sleep well because his cough got so bad."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_go_hospital_today_won_016410: "He has to go to the hospital today and won't have enough money."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_hasn_t_come_back_437ff1: "He hasn't come back...cough...yet."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_helped_me_expected_no_2a4f24: "He helped me and expected nothing in return. Such a random act of kindness is a human trait, isn't it?"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_i_checking_place_when_080359: "He and I were checking this place when we found some fluorescent mushrooms. Brother Jojo's eyes gleamed and..."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_just_came_back_huntin_fdff09: "He just came back from hunting. You should let him rest, at least for the rest of the day."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_mean_me_first_he_0032b0: "He was mean to me first! And he said he's busy. That's why I said go. Go!"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_pretty_formidable_i_w_9036b8: "He is pretty formidable. I wouldn't recommend ^0000FFfight him alone.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_really_looked_pitiful_b18ed6: "But he really looked pitiful!"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_s_fully_recovered_he_b2021e: "He's fully recovered, but he still doesn't want to leave. I don't know why he's so infatuated with that turned human."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_s_worried_you_haven_b223fd: "He's worried that you haven't come out. He asked me to help you if you need it. Did something happen?"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_said_he_wanted_help_e69492: "He said he wanted to help you."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_said_he_wanted_unders_7a7f85: "He said he wanted to understand humans, so he could better understand her. And I think he's achieved his goal."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_seems_ok_ok_just_2aea1c: " - ^424242He seems ok. ..Ok? Just leave him be. Come back after dawn.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_he_shows_big_interest_he_a49832: "He shows big interest. ^0000CDHe said that it was made from the shell of a turtle living only on Turtle Island."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_touched_one_mushrooms_ec52a3: "He touched one of the mushrooms, and it exploded."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_training_become_stron_1ce8b4: "He... training to become stronger... even if he doesn't become stronger... he's still enough..."
  npc_override_gef_d01_i_quests_illusion_dungeons_he_very_fidgety_fishing_da6c36: "- He is very fidgety with a fishing pole in his hand. It doesn't look like he's out fishing. - "
  npc_override_gef_d01_i_quests_illusion_dungeons_he_wears_glasses_blue_sh_7b6ab9: "^0000CDHe wears glasses^000000 and has blue short hair. ^0000CDHis face is just like a scholar^000000 so you should be able to recognize him."
  npc_override_gef_d01_i_quests_illusion_dungeons_hee_hee_hee_ah_hello_cad3dd: "Hee... hee... hee... ah... hello."
  npc_override_gef_d01_i_quests_illusion_dungeons_heh_heh_hello_adventurer_4d5a20: "Heh...heh...Hello adventurer, heh...heh... I'm so tired I can't move..."
  npc_override_gef_d01_i_quests_illusion_dungeons_heh_heh_s_so_hard_b72049: "Heh heh... It's so hard to use all your strength..."
  npc_override_gef_d01_i_quests_illusion_dungeons_hehehe_i_hope_day_come_14b4a1: "Hehehe I hope that day will come soon.."
  npc_override_gef_d01_i_quests_illusion_dungeons_hehehe_other_times_i_d_d7d53f: "Hehehe Other times, I'd say it's crazy, but if we follow a strong leader..."
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_9b56d5: "Hello."
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_adventurer_b3fe79: "Hello, Adventurer."
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_adventurer_how_you_85e383: "Hello, Adventurer. How are you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_c8783d: "Hello!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_looks_like_you_ve_e19ed1: "Hello, it looks like you've been here a while..."
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_my_name_soup_frien_bbb8c8: "Hello, my name is Soup, a friend of Sirood who is missing."
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_research_going_wel_9dd4dc: "Hello, research is going well."
  npc_override_gef_d01_i_quests_illusion_dungeons_hello_you_like_go_upstai_913f02: "Hello, would you like to go upstairs again?"
  npc_override_gef_d01_i_quests_illusion_dungeons_help_c47ae1: "Help"
  npc_override_gef_d01_i_quests_illusion_dungeons_help_him_c46923: "Help him"
  npc_override_gef_d01_i_quests_illusion_dungeons_help_me_really_you_won_85b4e1: "...Help me? Really? You won't let me die?"
  npc_override_gef_d01_i_quests_illusion_dungeons_helping_who_me_monster_d_d5459c: "Helping who? To me, that monster didn't look like it needed help!"
  npc_override_gef_d01_i_quests_illusion_dungeons_her_safety_more_importan_2d9068: "Her safety is more important than anything else."
  npc_override_gef_d01_i_quests_illusion_dungeons_here_i_brought_things_yo_e4912d: "Here, I brought the things you asked."
  npc_override_gef_d01_i_quests_illusion_dungeons_here_i_give_you_t_e7984f: "Here, I give you this. Can't eat though.."
  npc_override_gef_d01_i_quests_illusion_dungeons_here_only_one_piece_i_f8b726: "Here is only one piece I have right now."
  npc_override_gef_d01_i_quests_illusion_dungeons_here_sign_promise_profes_605e98: "And here, a sign of promise. Professor and brother. I'm glad you came."
  npc_override_gef_d01_i_quests_illusion_dungeons_here_there_truths_we_can_513586: "Here, there are truths that we cannot find anywhere else."
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_5a8841: "Hey."
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_c812b3: "Hey!"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_could_you_take_look_da956d: "Hey, could you take a look at this?"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_don_t_just_stand_6dddce: "Hey... don't just stand there, help me..."
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_hey_hey_asudem_honey_3aeaf9: "Hey, hey, hey, Asudem.. honey.."
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_i_m_one_them_1d0636: "Hey, I'm one of them, and I'm not going to let you talk bad about my predecessors like that!"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_most_people_don_t_79196d: "Hey, most people don't understand when you explain it like that!"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_stranger_look_me_sec_9b27c2: "Hey stranger, look at me for a second."
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_there_don_t_cut_9fa042: "Hey there!!! Don't cut in line!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_what_if_i_tell_3fc711: "Hey, what if I tell you that! And it's not my research, it's yours!"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_why_you_carrying_so_9e8353: "Hey, why are you carrying so much? Go lighten your bag first."
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_you_monk_over_there_39063d: "Hey, you monk, over there. What do you think makes you human? What do you think makes a vampire a vampire? What if there's a vampire that's never hurt anyone in their life?"
  npc_override_gef_d01_i_quests_illusion_dungeons_hey_you_really_should_ge_ef795e: "Hey, you really should get some rest..."
  npc_override_gef_d01_i_quests_illusion_dungeons_hi_i_heard_every_story_edd3c5: "Hi {0}. I have heard every story from Leiphen."
  npc_override_gef_d01_i_quests_illusion_dungeons_his_god_loves_us_all_494180: "His will? God loves us all. Isn't that what you preach?"
  npc_override_gef_d01_i_quests_illusion_dungeons_his_name_font_color_d_9702ad: "His name is <FONT COLOR = 4D4DFF><FONT SIZE = 16><B>Jerrymon</FONT></FONT></B>, a marine scientist. I've met my father a few times. I know you are in the East Library of Prontera."
  npc_override_gef_d01_i_quests_illusion_dungeons_his_name_khahris_he_look_10564f: "His name is Khahris... he looks exactly like me"
  npc_override_gef_d01_i_quests_illusion_dungeons_his_real_name_what_his_72508e: "His real name was? what was his name?? Ktulla-something. Someone once told me the lizard has been hired by the archpriests of Rachel to keep watch over a boy who is sealed inside this cave."
  npc_override_gef_d01_i_quests_illusion_dungeons_hm_you_re_adventurer_22b9f9: "Hm? You're an adventurer."
  npc_override_gef_d01_i_quests_illusion_dungeons_hmm_9c4d28: "Hmm..."
  npc_override_gef_d01_i_quests_illusion_dungeons_hmm_seems_subtle_glow_se_c9bdbf: "Hmm... And it seems to have a subtle glow... It seems like the fishing rod is coated?"
  npc_override_gef_d01_i_quests_illusion_dungeons_hmpf_alright_if_you_ever_336e38: "Hmpf, alright, but if you ever feel pity for me, then come back and help me. Promise?"
  npc_override_gef_d01_i_quests_illusion_dungeons_hold_my_hand_when_i_b43c8a: "Hold my hand when I give you a signal!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_honest_though_did_you_re_ecd245: "Be honest, though. Did you really study hard? Did you attend every class, study all night, and practice hard? You'd better tell me the truth."
  npc_override_gef_d01_i_quests_illusion_dungeons_honey_let_s_go_i_185861: "Honey, let's go, I think today's date is over. Hey, let's go do some errands~ We'll get out of here..."
  npc_override_gef_d01_i_quests_illusion_dungeons_honey_who_s_there_f1cd3f: "Honey? Who's there?"
  npc_override_gef_d01_i_quests_illusion_dungeons_hooray_hooray_c1a933: "Hooray!!! Hooray!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_hope_you_two_safe_eed5e7: "Hope you two will be safe..."
  npc_override_gef_d01_i_quests_illusion_dungeons_hopeless_desperate_poiso_83b599: "Hopeless, desperate, and poisonous."
  npc_override_gef_d01_i_quests_illusion_dungeons_horrible_nightmare_d68019: "This horrible nightmare..."
  npc_override_gef_d01_i_quests_illusion_dungeons_how_about_i_go_e03745: "How about I go?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_about_two_us_stay_bfd2c9: "How about two of us stay and one goes?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_am_i_defaming_them_026989: "How am I defaming them when I'm only telling the truth?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_dead_reanimated_what_665425: "How are the dead reanimated? What kind of vital force keeps them moving?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_did_you_70cd05: "...How did you...?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_did_you_come_back_2734e7: "How did you come back alive, it's a shame... Fortunately, the ants there didn't seem to come over here."
  npc_override_gef_d01_i_quests_illusion_dungeons_how_did_you_sustain_your_155d36: "How did you sustain yourself so far?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_difficult_bring_you_676235: "How was it? Was it difficult to bring you out?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_fbe0d0: "...How?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_i_believe_you_6def7f: "How can I believe you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_i_help_you_13e773: "How can I help you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_i_know_5824c2: "How can I know that"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_i_let_you_out_ef7fa1: "- How can I let you out?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_i_sure_you_ask_d5321d: "How can I be sure, you ask?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_s_mojo_doing_heh_eafca3: "How's Mojo doing? Heh, she's so curious, I feel sorry for Brother Grimm for having to deal with her."
  npc_override_gef_d01_i_quests_illusion_dungeons_how_s_mushroom_61d4dc: "How's the mushroom?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_things_going_16f205: "How are things going with {0}, {1}, and {2}?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_we_going_use_their_5cf27f: "How are we going to use their cold energy, anyway?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_worth_living_here_ad7c39: "How is it? Is it worth living here?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_you_303189: "How are you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_you_know_e0049d: "How do you know that??"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_you_like_isn_t_396656: "How do you like it? Isn't this a pretty charming place too?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_you_make_artificial_c9d60a: "How do you make artificial blood?"
  npc_override_gef_d01_i_quests_illusion_dungeons_how_you_you_weird_2dec0c: "How are you? Are you weird?"
  npc_override_gef_d01_i_quests_illusion_dungeons_however_after_meeting_vi_490e08: "However, after meeting a violent storm, I arrived at a Turtle Island, but it didn't seem like the normal Turtle Island."
  npc_override_gef_d01_i_quests_illusion_dungeons_however_there_empty_door_14f9aa: "However, there, the empty door... might have something, you might know about."
  npc_override_gef_d01_i_quests_illusion_dungeons_hu_huh_s_just_gone_e928d5: "Hu? Huh? It's just gone. The {0}."
  npc_override_gef_d01_i_quests_illusion_dungeons_huge_whirlpool_created_f_d25dcb: "- A huge whirlpool was created in front of Jerrymon! -"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_brother_over_there_i_945131: "Huh? Brother, over there.. I've seen him before."
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_coughing_young_man_e_39acb2: "Huh? The coughing young man in Einbroch asked you to find me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_e3e4fb: "Huh...!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_i_talking_about_cave_a613e8: "Huh? I was talking about the cave in the back."
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_no_i_ve_never_154f4b: "Huh? No, I've never heard that."
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_s_i_d_love_23b865: "Huh? But that's... I'd love to take a look at it."
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_s_you_again_don_3222b3: "Huh?! It's you again? Don't you think we see each other quite often? The other day someone was talking..."
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_we_didn_t_say_26ef92: "Huh? We didn't say anything about ghost. Or did we?"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_what_should_i_as_f02ae5: "Huh.. What should I do.. As Luanda advised, we have to escape to this place..."
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_what_you_mean_i_463e39: "Huh? What do you mean? I will come back again."
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_what_you_talking_abo_8ab28e: "Huh? What are you talking about, I'm Khahris the adventurer. I told you before."
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_why_am_i_telling_c288f2: "Huh? Why am I telling you this?"
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_you_haven_t_seen_543640: "Huh? You haven't seen it? Did you get caught up in your travels? Tsk tsk, you're out of luck.."
  npc_override_gef_d01_i_quests_illusion_dungeons_huh_you_re_stranger_luan_b29a64: "Huh?! You're the stranger Luanda took an interest in on the way out hunting?"
  npc_override_gef_d01_i_quests_illusion_dungeons_hum_91cccd: "hum..."
  npc_override_gef_d01_i_quests_illusion_dungeons_human_curiosity_unavoida_13a9a9: "Human curiosity is unavoidable. Me too."
  npc_override_gef_d01_i_quests_illusion_dungeons_human_did_you_just_call_233470: "Human, did you just call me a bat? How dare you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_human_huuuman_there_no_s_db37bc: "^BDBDBDA^000000 human? A ^BDBDBDhuuu^000000man? There would ^BDBDBDbe no such thing^000000!!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_hungry_i_m_so_hungry_a50b37: "Hungry. I'm so hungry I can't move.."
  npc_override_gef_d01_i_quests_illusion_dungeons_hunt_garden_perception_756268: "Hunt {0} and {1} from the Garden of Perception"
  npc_override_gef_d01_i_quests_illusion_dungeons_hunt_garden_perception_d46c24: "Hunt {0} from the Garden of Perception"
  npc_override_gef_d01_i_quests_illusion_dungeons_hunt_monsters_garden_per_bb4873: "Hunt the monsters from the Garden of Perception"
  npc_override_gef_d01_i_quests_illusion_dungeons_hurts_enough_scream_56e594: "== It hurts enough to scream! =="
  npc_override_gef_d01_i_quests_illusion_dungeons_huu_without_aylvar_i_die_6881ae: "huu... without Aylvar and {0} I would have died."
  npc_override_gef_d01_i_quests_illusion_dungeons_hypothesis_44f047: "This is a hypothesis."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_agree_sister_gem_also_f33a1d: "I agree with Sister Gem. Also, it's not an everyday opportunity that we can see vampires from this close."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_agree_these_bats_disgr_aa0344: "I agree that these bats are disgraceful, shameless, and disgusting animals."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_alarmed_when_you_sudde_aff124: "I was alarmed when you suddenly disappeared."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_all_twigs_i_need_c3f9f6: "I have all the twigs I need. I should go back to Zeith and Vrid."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_almost_got_trouble_30f85f: "I almost got in trouble..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_already_know_fire_won_fd5f8e: "^ff0000I already know fire won't work, but I'm just going to go along with their request.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_am_alberta_guard_st_d33e0d: "I am from the Alberta Guard of the 1st Knights Division, Knight Aylvar."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_am_going_back_63ba67: "I am not going back."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_am_here_find_him_d1c4e9: "I am here to find him."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_am_khahris_d6afbe: "I am Khahris."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_am_sorry_you_already_2fea4c: "I am sorry, {0}. You already have too much stuff. I figure it's difficult to find my friend right now."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_am_worried_because_he_30aa0d: "I am worried because he went there again. He said he would come back after finds out the secret of that place."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_apologize_deep_down_i_aa7c44: "I apologize. Deep down, I felt that it was annoying for adventurers to talk to me. Now, I'll ask you first."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_asked_you_come_back_3745d8: "I asked you to come back... but you must leave today. It's dangerous to be here any longer."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ate_everything_sorry_s_a9b4fa: "I ate everything. Sorry. That's the only thing I can give you."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_barely_made_entrance_w_1a50c2: "I barely made it to the entrance, but when I try to leave, he shows up and has been hiding here for days."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_became_wizard_because_ac811f: "I became a wizard because I thought magic could compensate for my physical weakness."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_beg_you_don_t_6d5d31: "I beg of you, don't ask me to return doing that again."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_came_back_here_look_a9514b: "I came back here to look for him... but he was attacked by Maya and he was taken away."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_came_here_again_well_e9eaf9: "I came here again. Well, everyday."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_checked_mound_dirt_loo_8fb87c: "I checked the mound of dirt to look for twigs."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_come_back_7183c9: "I will come back."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_come_back_again_i_d6221f: " - ^424242I will come back again. I put my hands together on my chest.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_come_back_research_you_2c8fd2: "I will come back. For research and for you, Narin."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_completed_my_guild_s_ac9f77: "I completed my guild's official wizard training program. I'm strong enough to have a contest with you!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_cough_must_go_myself_94fc3a: "I ..cough..must go myself...cough..cough.."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_couldn_t_believe_he_899c22: "I couldn't believe he turned me into a monster. I trusted him!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_couldn_t_get_damn_1aa835: "I couldn't get ^BDBDBDit^000000... The damn ^BDBDBDmon^000000.. monsters..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_couldn_t_get_over_34906f: "I couldn't get over the fact that I became a monster, but now I know better. I may not be a human anymore, but I'm still me."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_couldn_t_sleep_eat_59d1f1: "^FF0000I couldn't sleep^000000 and eat for several days. I was wandering around."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_d9b4ac: "I..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_d_learned_about_them_e802af: "I'd learned about them through Bomi. What I'd learned didn't make sense, and I didn't really understand it."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_d_like_save_myself_75d045: "I'd like to save it myself, but as you can see I'm weak, heck."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_danger_someone_helped_a52624: "I was in danger, but someone helped me out."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_debating_if_i_should_ee166e: "I was debating if I should go after them."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_did_my_best_bf0eac: "I did my best."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_did_what_i_did_4cd39a: "I did what I did to save her, and I understand she resents me for it."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_even_time_c229a5: "I didn't even have time to look at that!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_know_i_df8d05: "I didn't know I was talented at this. If I had ^0000cdenough time to live^000000, I would've had many different experiences. I might have chosen a different path."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_know_there_742748: "I didn't know there was an aspiring thief among us. Huh."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_know_you_2699ee: "I didn't know you when you were a human, but I don't think you were different from who you are now. You're still trying to protect what's important to you."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_mean_about_a64fe2: " - ^424242I didn't mean that about the talking part, but let's go anyway."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_mean_nosy_5ca99c: "I didn't mean to be nosy. I had to know who it belonged to, so I could?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_realize_strong_dd86ee: "I didn't realize a strong mind comes from a strong body, though..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_tell_you_099e5e: "......I didn't tell you the long story to hear that..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_didn_t_understand_why_6f5b57: "I didn't understand why vampires would help humans, but now I know. Dracula learned from Bomi how to be more human."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_even_know_0fe2d4: "I don't even know how to thank you."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_acedd2: "I don't know."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_how_053889: "I don't know how it has been connected to reality,"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_how_c75337: "I don't know how they've become reality. I doubt anyone knows, really."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_i_ee3d4a: "I don't know. I don't know where you came from, how could I know?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_if_5bce2f: "I don't know if they have any purpose, but they sure look beautiful and mysterious. Maybe someone outside this place can recognize its value."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_if_7b9a1d: "I don't know if I can pull it out again... No, if it was like that in the first place, I wouldn't have asked you, adventurer."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_why_1f85a6: "I don't know why you thought he looked pitiful, but that's not important."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_know_why_ab7494: "I don't know why I can't breathe or why I don't feel hungry even if I don't eat."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_live_alone_11f795: "I don't live alone in the village, and if someone had seen it, it would have been rumored, but hearing it for the first time would make my guess clear."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_need_alone_29a9a6: "I don't need to be ... alone...?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_remember_b3ff47: "I don't remember."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_think_s_0eaf34: "I don't think that's my name."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_think_s_1b9eb8: "But... I don't think it's Khahris either."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_think_you_dc1d1a: "I don't think you said anything"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_think_you_f946f7: "== I don't think you're lying. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_understand_her_8647ff: "I don't understand her logic. How could she possibly want to die as a human than live as a vampire? How could she think the gift of eternal life is a betrayal?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_want_frozen_3592f7: "I don't want to be frozen again!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_want_get_57a7d9: "I don't want to get between you two."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_want_hope_51e192: "But I don't want to hope. If you hope... you can be betrayed."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_don_t_want_worry_2d9c1e: "I don't want to worry anymore!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_draw_what_i_see_8bb435: "I draw what I see in my dreams, but... will the things I see really happen?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_drink_fake_blood_i_e053fa: "I drink fake blood that I make with the ingredients I can find here. I may look ^0000cdhuman enough^000000, but I'm not. Not really."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_e38e9f: "I do."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_eat_anything_front_me_072ecc: "I can eat anything in front of me. From head to toe..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_eat_anything_really_an_80a1d9: "^FF0000I can eat anything. Really anything. I can eat.. chomp chomp.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_empty_bottle_oh_i_507138: "I have an empty bottle? oh, I forgot I lost my bag when I was attacked."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_everything_i_need_toda_9ecc26: "I have everything I need for today's survey, thank you!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_explain_5b5bb7: "I can explain."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_fainted_middle_learnin_c46e98: "I fainted in the middle of learning a new spell, again."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_as_if_i_7b5656: "I feel as if I traveled back in time, studying by this dim light."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_dazed_as_if_916545: "^ff0000I feel dazed, as if I'm dreaming.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_good_energy_t_3e0378: "I can feel the good energy that can't be touched. That's why I feel more bitter."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_like_i_written_fde2f2: "I feel like I have written the Asura Kingdom of Defeat."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_resentful_myself_b695cc: "I feel resentful of myself for not being able to help with the village defense."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_serious_anguish_p_c46621: "- I feel serious anguish from this person. Let's come back after I've become level 140. -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_strange_9fc0f4: " - ^424242I feel strange...^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_feel_weird_nothing_her_2a2eec: " - ^424242I feel weird, but nothing is here...^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_felt_way_614fb5: "I felt that way."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_flick_my_finger_you_5c5da7: "I can flick my finger at you if you want."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_found_again_while_wait_8d0068: "I found this again while waiting for adventurer. Please accept it!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_given_shorter_time_liv_c27996: "I was given a shorter time to live than most. Ever since I was born, I'd been told I'd never outlive my parents."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_go_back_56cc1c: "I have to go back..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_go_back_ruined_village_b80224: "I can go back to the ruined village."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_go_back_send_him_88528c: "I have to go back and send him to the hospital, but..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_go_there_later_8c535d: "I will go there later."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_got_betrayed_my_best_22ad85: "I got betrayed by my best friend."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_got_roughly_945808: "I got it roughly"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_grabbed_piece_handed_o_773020: " - ^424242I grabbed the piece handed over by the knight. A small leaf is carved on the turtle shell. It's a bulky piece, but somehow feels warm.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_gravely_injured_them_s_7279c8: "I was gravely injured by them, and somehow I ended up in this place full of death and mysterious energy."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_guess_i_leave_now_b5857b: "I guess I have to leave now."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_guess_i_ll_b14086: "but I guess I'll have to."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_guess_i_ll_stay_3136c1: "I guess I'll have to stay here and watch the situation."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_guess_i_ll_staying_0d6b77: "I guess I'll be staying here until I find them all."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_guess_so_eb667a: "I guess so?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_had_hunch_same_kind_4444c6: "I had a hunch that it was the same kind of whirlpool I was swept into."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hate_being_hot_fire_f8e7c3: "But I hate being hot, and fire could burn us to death."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_haven_t_had_meal_78db53: "I haven't had a meal today. I was starving all day yesterday. My child was starving too. My husband was also starving."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_haven_t_had_meal_80d3ae: "I haven't had a meal today, yesterday, and the day before yesterday."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_haven_t_seen_any_e8b09a: "I haven't seen any other humans around here, but if I do, I'll let him know you're looking for him."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hear_you_give_up_add699: "I can hear you. Give up your obsession with it. That would be best for you."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_briaschen_did_an_e7efc7: "I heard Briaschen did that. Ants didn't attack me when I was with Khahris."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_only_master_luan_31a3f1: "I heard that only Master Luanda and Master Mao were running around this time? You lay on top of a tree and just shouted..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_scream_when_man_6f28ed: "I heard a scream when the man in front of me just entered."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_something_36fcee: " - ^424242I heard something.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_stern_faced_seco_8ab0e4: "I heard that the stern-faced second warned you, but what a fearless outsider you are."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_there_many_dange_b75060: "I heard that there are many dangerous deep-sea creatures in the lower layer, but when I came here, they were more dangerous than I thought."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_they_named_after_ca5467: "I heard they were named after the guardians of the village. I'm rather proud of them."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_heard_you_look_just_26d47f: "I heard you look just like me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_here_until_i_find_7e9794: "I will be here until I find all of the secrets."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_brother_jubilee_b_c8458f: "I hope Brother Jubilee and Brother Jojo are safe."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_everything_okay_d0c9eb: "I hope everything will be okay."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_nothing_bad_happe_4dae97: "I hope nothing bad happens to those two."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_sirood_appear_fro_3036ed: "I hope Sirood will appear in front of us intact, just as the fishing rod appeared intact..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_soldier_find_her_331a18: "I hope the soldier will find her before she goes deep inside the ruined village."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_we_find_answer_fc1f70: "I hope we can find an answer to this phenomenon."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_we_ll_meet_3a1f9d: "I hope we'll meet again."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_you_ll_find_55139a: "I hope you'll find him soon. I'm not the only one here, you know. If you haven't found him, maybe he's?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hope_you_ll_find_6dacf7: "I hope you'll find your friend soon. Why don't you check the catacombs in the south? He might be there."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hospital_shop_now_95aa66: "Do I have a hospital or a shop now?!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_hugged_vrid_as_he_f74cac: "^ff0000I hugged Vrid as he asked.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_i_able_stay_alone_ccf553: "I, I was able to stay alone so far, because I could meet you two again someday?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_i_don_t_know_a96616: "...I, I don't know the specifics reason... Just that it might be that way."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_i_e75067: "...I... I...!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_i_m_glad_cd39db: "I... I'm... glad..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_joking_i_m_middle_f2b034: "I was joking. I'm in the middle of collecting the fake blood ingredients, but right now I want to examine this mushroom. I've never seen it before. I want to check it while it's still fresh."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_just_i_guess_what_6cbaa4: "I just... I guess what is inside is boring for me now."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_knew_coming_i_d_cbcfbd: "I knew coming in that I'd better stay close to Chunghae."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_knew_idiotic_idea_i_0f44f7: "I knew that was an idiotic idea! I shouldn't have listened to your stupid story! I shouldn't have followed you into this cave!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_know_s_because_me_986cd8: "I know. It's not because of me and my brothers.. but.. that day.. we.. .. .. it's just a pity"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_know_they_re_dreamt_32289a: "I know they're ^0000FFdreamt by the Moonlight Flowers.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_learned_about_catacomb_7bf03a: "I learned about the catacombs under the Geffen Tower while I was in the library, reading about the tower's history."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_leave_9ae0fa: "I have to leave."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_lit_dry_twigs_placed_3d6619: "^ff0000I lit the dry twigs and placed them around him. Some time has passed, but the ice doesn't look like it's melting.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_05a7aa: "I'll do that."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_appreciate_if_you_6b2a3e: "I'll appreciate if you can take care of them."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_call_junghee_we_71bfea: "I'll call Junghee, and we'll follow you soon."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_catch_up_soon_010300: "I'll catch up soon."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_come_next_time_69d7ea: "I'll come next time"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_doing_research_whil_52d765: "I'll be doing this research for a while."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_figure_out_636803: "I'll have to figure that out."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_get_back_you_6dfeab: "I'll get back to you if I need help. Thanks!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_get_point_e556d2: "I'll get to the point."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_get_rid_them_ba71c4: "I'll get rid of them."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_go_next_time_234dc7: "I'll go next time"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_leave_angry_soldier_aba970: "I'll leave the ^0000FFAngry Soldiers^000000 to you."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_let_justice_decide_f4a54c: "I'll let justice decide their fate."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_make_sure_no_86e675: "I'll make sure no villagers gets close to the collapsed walls of reality and dreams."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_need_some_form_ce2d8c: "But I'll need some form of protection. I'm going to take Junghee with me."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_next_time_81896b: "I'll do it next time"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_staying_here_while_936b7e: "I'll be staying here for a while, so let me know if you change your mind!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_take_as_compliment_efcda4: "I'll take that as a compliment."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_talk_elders_d20840: "I'll talk to the Elders."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_talk_you_again_13f0d5: "I'll talk to you again after a while."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_tell_jerrymon_about_fadc0d: "I'll tell Jerrymon about the contents in advance through my father!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ll_waiting_you_here_d7e9bd: "I'll be waiting for you here."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_look_like_human_ea6344: "Do I look like a ^0000cdhuman^000000?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_looking_piece_while_su_555476: " - ^424242I was looking at the piece for a while, but suddenly something seemed to appear in my head. Suddenly a gust blows and my vision gets darker.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_lost_her_i_lost_9f06e5: "I lost her. I lost her. My baby. My pretty baby. Where are you? My baby. What's her name? My daughter. Daughter? My baby."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_8e34f3: "I'm not?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_about_give_up_0b0b26: "But I'm not about to give up!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_always_correct_i_ae19dd: "I'm not always correct, but I can see into the future. Ah! I have more abilities than that."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_away_right_now_f9a6cd: "I'm away right now. Please come back after dawn."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_bad_mood_0a0769: " - ^424242I'm in a bad mood...^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_bit_busy_right_76785b: "I'm a bit busy right now..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_carrying_too_many_468846: "I'm carrying too many types of items. I should lighten my bag first."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_convinced_mage_respo_f8d134: "I'm convinced that the mage is responsible for these rampant nightmares."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_especially_tired_tod_f0257b: "I'm especially tired today. I'm going to bed early tonight."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_exhausted_don_t_8dc389: "I'm exhausted and don't have some tools to make proper reasoning. It's better to prepare and come back."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_fine_guesses_everyon_241e88: "I'm fine with guesses. Everyone's shape is different."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_fine_now_a806d9: "I'm fine now"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_glad_they_only_2b71c6: "I'm glad they only grow here."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_glad_we_ve_f0c6d8: "I'm glad we've met you,"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_glad_you_came_76af5e: "I'm glad you came back safely. Is everyone in there okay?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_glad_you_didn_470498: "I'm glad you didn't die."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_cross_ah_185951: "I'm going to cross~~ Ah!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_die_please_02443e: "I'm going to die. Please help me... Please."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_die_starve_babeb2: "I'm going to die. Starve to death."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_die_starving_68f6a6: "I'm going to die. Starving."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_die_we_d5f775: "I'm going to die. We are all going die."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_go_there_7a8766: "I'm not going to go in there anymore..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_let_you_2677e4: "I'm not going to let you do that!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_stay_ca72b8: "I'm going to stay."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_stay_here_392655: "I'm going to stay here for a while. It'll take for a while before Dracula fully regains his energy, and personally, there are many things that I want to know about these people."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_stay_ruined_afce18: "I'm going to stay in the ruined village and investigate this phenomenon."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_there_you_51e840: "I'm going there do you want to come with me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_going_watch_you_9a01f8: "I'm going to watch you."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_guessing_reason_why_b66acc: "I'm guessing this is the reason why the monsters are attacking the village, but I'll have to tell the chief and investigate."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_happy_arrangement_dr_9e8f01: "I'm not happy with this arrangement, Drac. I'm going back to our castle once you get better, got it?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hearing_anything_946821: "I'm not hearing anything!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_help_me_c68548: "I'm hungry. Help me. I'm so hungry."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_help_me_dd9a7f: "I'm hungry. Help me. Please. Hungry."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_hungry_i_2783eb: "I'm hungry... Hungry. I'm going to die."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_i_m_eb1a1d: "I'm hungry. I'm starving."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_i_ve_49aa15: "I'm hungry. I've been starving for a long time... I'm going to die. Please, please help me."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hungry_want_more_55badf: "I'm hungry. Want more. Yummy. Too tasty."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hurry_right_now_059163: "I'm in a hurry right now! Khahris might be in danger."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_hurt_641217: "I'm not hurt!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_kind_busy_a831e7: "I'm kind of busy."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_kind_busy_moment_b3884a: "I'm kind of busy at the moment."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_mentally_strong_enou_acb1fc: "I'm not mentally strong enough to handle such nightmares."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_mirko_s_yolanda_d82f54: "I'm Mirko, that's Yolanda"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_my_name_bomi_39efae: "I'm... My name is ^0000cdBomi^000000. I'm sorry I'm not the person you're looking for."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_numskull_i_wouldn_e097fb: "I'm not a numskull. I wouldn't have become a wizard if I was. And don't forget, I saved Dracula!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_ok_now_let_426e56: "I'm ok now! Let's go!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_one_them_i_bd90b0: "I'm one of them, and I happened to pick up a ^0000cdnotebook^000000 just before you found us."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_only_one_brought_72d26c: "...I'm not the only one brought here, am I?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_out_my_mind_0eccaa: "I'm out of my mind..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_rwella_a5bc91: "I'm Rwella"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_saying_once_so_d50e18: "I'm saying this once, so listen carefully."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sensing_really_bad_f8cc5d: "I'm sensing really bad vibes from these foxes and ghosts."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_seriously_hurt_69009a: "I'm seriously hurt..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_so_glad_11ea11: "I'm so glad..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_so_surprised_shocked_1003b9: "I'm so surprised and shocked right now that I don't know what to do."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_bother_you_56be16: "I'm sorry to bother you, but please. I'll be waiting for you here."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_could_you_36c0a1: "I'm sorry, but could you find some dry twigs from heaps of dry soil in this cave? We won't need more than 10."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_i_bored_f6ac56: "I'm sorry I bored you with my story."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_i_bothered_5c4b7a: "I'm sorry I bothered you."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_i_broke_5b5829: "I'm sorry I broke my promise. But even if I could go back in time, I would do it again."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_i_m_a5546e: "I'm sorry but I'm hungry... I can't move right now."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sorry_t_move_6e4f7d: "...I'm sorry, can't move."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_still_practicing_vai_2ea773: "I'm still practicing.. in vain?! You can't believe someone else's..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_still_talking_you_e54eba: "I'm still talking to you. You're not afraid of me because I'm in bat form, are you? You humans are so stupid, you can't get past what you see."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_still_too_stiff_1df9a3: "I'm still too stiff to move. Would you take care of him, too??"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_stuck_here_forever_e2f293: "I'm stuck here forever!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sure_either_da1b0b: "I'm not sure either?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sure_heh_heh_b728a2: "I'm not sure. Heh heh."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sure_how_works_42c738: "I'm not sure how that works."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_sure_what_principle_df6798: "I'm not sure what the principle is, but I stirred it diligently as Jerrymon-sama told me to!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_telling_you_because_d0195d: "I'm telling you because I feel good vibes from you. Leave this place right now."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_tired_33fdf2: "I'm tired."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_too_busy_41644d: "But I'm too busy."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_too_tired_e5fb77: "I'm too tired..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_very_busy_ee8ace: "I'm very busy."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_victim_here_you_158d16: "I'm the victim here, you know."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_waiting_her_right_fa395b: "I'm waiting for her right now."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_worried_about_those_4608df: "I'm worried about those two. They should be fine, right?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_worried_about_what_7f8847: "I'm worried about what's happening there."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_m_zeith_334054: "I'm Zeith, and this is?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_may_end_up_wasting_a197f5: "I may end up wasting our time, but I want to try to help them rest."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_mean_he_smells_like_117482: "I mean he smells like a friend, Little One."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_mean_send_them_heaven_d89b02: "I mean... send them to Heaven."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_met_bomi_before_i_d79708: "I met Bomi before I came here."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_might_able_touch_8c1028: "I might be able to touch it."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_might_remember_little_1144d9: "I might remember a little longer. But I forget eventually."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_my_treasure_now_s_8d686f: "I have my treasure ^BDBDBDnow^000000... It's shiny... Pretty."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_ca74d0: "I need 10 ^4d4dff{0}^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_explore_dungeon_f_8fe8ee: "== I need to explore the dungeon first. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_get_rid_monsters_892d14: " - ^0000CDI need to get rid of the ^42424210 {0} monsters.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_more_e5c2cb: "^FF0000I need more!!!!!!!!!!^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_more_i_d_965e90: "I need more ^4d4dff{0}^000000, and I'd like you to take care of the ^4d4dffDeep Sea Creatures^000000 that get in the way of my research."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_permission_enter_91cc50: "I need permission to enter the catacombs. I'm going to check them tomorrow."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_right_now_6bdb3f: "I need 10 right now."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_see_what_s_5d5be1: "...I need to see what's there, too."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_some_time_get_ab0a05: "I need some time to get ready"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_need_sticky_bloods_mat_045398: "I need ^0000cd10 Sticky Bloods from Matte Drainliars and 10 Mushroom Saps from Neon Mushrooms^000000. You can get them if you hunt at least ^0000cd5 Matte Drainliars and 5 Neon Mushrooms^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_needed_humans_survive_3fe616: "I needed humans to survive. I hid among them and hunted them whenever I needed."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_no_choice_ask_other_e7937b: "I have no choice but to ask other adventurers for work today."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_nodded_recalled_bulky_546104: " - ^424242I nodded and recalled the bulky piece I had now kept by my heart. The sea breeze from the harbor blows by my ears...^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_now_live_some_more_1449b4: "I can now live some more."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_only_faith_him_he_a229f9: "I only have faith in Him, and He's telling me not to trust you."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_only_trying_help_him_e335f5: "I was only trying to help him."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_other_things_94802a: "I have other things to do."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_picked_up_unknown_shel_46bae9: "I picked up an unknown shell the other day. It seems that all the monsters in the Garden of Perception, like ants, have them."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_placed_my_hand_book_967805: "I placed my hand on the book Father Grimm was holding. Suddenly I felt dizzy as the air around me shimmered. Carefully, I opened the notebook."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_placed_my_hand_noteboo_e2a8bd: "I placed my hand on the notebook, and Father Grimm opened it to the last page. Suddenly, my vision got blurry as I felt my body being transported to some place."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_promise_ecaa5c: "I promise."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_promise_i_m_going_9f1da9: "I promise I'm not going to do anything dangerous. I'll just take a look at the materials."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_question_you_king_15ef46: "I have a question for you, King."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ran_out_ingredients_i_96748e: "I ran out of the ingredients I had."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_realized_all_those_i_982b26: "I realized that all those I saved went back to where they came from."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_really_didn_t_hurt_a6a99e: "...But... But I really didn't hurt anyone."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_really_don_t_want_03c739: "I really don't want to deal with them myself,"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_really_hope_brother_jo_04d4e5: "I really hope Brother Jojo is safe."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_really_want_know_what_c1c5bd: "I really want to know what keeps them moving, what kind of experiments my predecessors did on them, and what kind of state they're in."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_recently_found_out_the_765961: "I recently found out that there is life in the Bahia Trench."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_relayed_bomi_dracula_s_5ea1ee: "I relayed Bomi and Dracula's story to Nun Gem and the others."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_relayed_what_happened_16c34e: "I relayed what happened in the notebook to Father Grimm and Mojo, and told them that the others decided to stay to keep an eye on the vampires."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_relayed_what_i_heard_f8a0c2: "- I relayed what I heard from Jerrymon. -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_released_them_ice_earl_7e7119: "^ff0000...? I released them from the ice earlier. Why are they frozen again?^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_remember_come_back_ple_f1b061: "I will remember... Come back. Please. Bro...!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_remember_please_come_b_2d0a86: "I will... remember... Please... come back."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_right_08641e: "I was right."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_s_because_i_m_efda95: "I...it's not because I'm scared!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_said_before_no_one_966ad0: "I said before.... but no one has returned. I am not expecting anyone to."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_said_s_what_i_17179f: "I said that's not what I want. Adventurer, are you busy?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_said_they_zombies_mush_30dc14: "I said they were zombies, not mushrooms!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_saw_after_last_ritual_b6d8f3: "I saw it after the last ritual that I did."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_saw_something_526c4f: "And, I saw something."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_saw_sophia_drinking_ma_307bb1: "I saw Sophia drinking a mana potion. Maybe potions are the answer to my never-ending search for physical support. "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_saw_too_2c4d02: "I saw it too"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_scanned_any_malicious_88451e: "I scanned it for any malicious intent, but I didn't sense any. I think its owner just ^0000cdneeds help with some unfinished business^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_c52c6e: "I see."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_hmm_you_t_96d57b: "I can see it. Hmm.. you can't see it though."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_how_she_dc1caf: "...I see. How is she?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_i_m_looking_957934: "I see. I'm looking for you..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_just_let_me_7d2e93: "I see. Just let me know when you want to leave."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_people_s_good_03b242: "I can see people's good and evil energy. In the case of adventurers..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_s_shame_you_d01510: "I see. It's a shame that you can't seize on such a great opportunity."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_see_we_found_him_377235: "I see. We found him injured and unconscious, so we took him here and treated him. He's well enough to leave now."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_should_closer_after_da_a0ea02: " - ^424242I should be closer. After dawn, maybe calmer."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_should_go_back_my_adf30a: "I should go back to my hometown..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_should_go_s_time_69df7e: "I should go. It's time I report back."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_should_leave_too_excus_a86881: "I should leave too. Excuse me."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_should_stopped_you_lea_d5742c: "I should have stopped you from leaving..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_show_these_pieces_my_47d0b6: "I show these pieces to my friend, ^0000CDLeiphen^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_sleep_last_aeb8ee: "I can sleep at last."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_smell_blood_human_bloo_14476e: "I smell ^0000cdblood^000000! Human blood!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_specialize_singing_s_m_71bd0e: "I specialize in singing. It's my purpose in life. I feel my greatest joy when I sing Odin's praises."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_stay_safe_7f9e27: "I will. Stay safe."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_stayed_because_i_wante_7deb31: "I stayed because I wanted to be there for her when she died as a human."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_still_carry_fox_bead_a6dae8: "I still carry the fox bead that I tried to purify. Let me know when you are ready."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_still_enough_light_lef_778d4f: "I still have enough light left in these shining spores. Please come back after dawn."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_studied_pharmaceutical_c7cbd1: "I studied ^0000cdpharmaceutical formulation^000000 to make up for my weak stamina with potions."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_surprised_b7915b: "I was surprised."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_swear_i_ll_give_21553a: "I swear I'll give it back to you. Just for one minute. How about thirty seconds? Ten seconds, then?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_symphatize_soldier_98a1a3: "I can symphatize with the soldier."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_believe_how_simple_7621b1: "I can't believe how simple-minded you are."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_believe_there_s_33464b: "I can't believe there's such a big and deep trench near Izlude..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_believe_worked_2a6fd2: "...I can't believe it worked."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_belive_muyeon_had_07b195: "I can't belive Muyeon had to deal with it on her own."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_cook_rotten_meat_728c2f: "I can't cook the rotten meat, but I can try to eat!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_d3b5dc: "I can't"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_even_move_finger_64472a: "I can't even move a finger because of the ice around me."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_even_scream_0ffa66: "I can't even scream."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_forgive_you_i_5cd0f6: "I can't forgive ^BDBDBDyou^000000!!! I will^BDBDBDfind^000000 and ^BDBDBDkill^000000 you all!! ^FF0000munch^000000... munch..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_give_you_much_f466ff: "I can't give you much, but I'll give you the rare ore I found earlier."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_guess_a13832: "I can't guess."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_hear_khahris_anymore_0e34b3: "== I can't hear Khahris anymore. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_help_47f88d: "I can't help it"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_help_af8229: "...I can't help it."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_help_you_now_96f221: "I can't help you now."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_leave_here_just_fba86d: "I can't leave here just yet. There are still many things in this place I want to know about."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_move_without_chewing_a7a20a: "I can't move without chewing and swallowing something..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_remember_what_khahri_c31b90: "I can't remember what Khahris looked like..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_say_how_glad_aee432: "I can't say how glad I am to have you here. Now that there are four of us, ^0000cdtwo of us can stay while the other two look^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_stay_here_father_e51fe9: "I can't stay here. Father Grimm, I have to go in there. Let me go, please!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_trust_her_notebook_1bccde: "I can't trust her with the notebook. If something happens to it, the people inside it might not be able to come back."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_t_wait_out_like_dbe67d: "I can't wait it out like I used to."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_take_3545be: "I will take it."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_tell_he_brought_everyt_189416: "I can tell he brought everything you asked. Come on, make a paste and apply it to the wall already."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_tell_s_enough_just_30451d: "I can tell that's not enough, just by looking at it."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_drinking_water_g_e1f398: "I think drinking water is good enough..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_enough_today_ple_e151d2: "I think this is enough for today, please come back tomorrow."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_forgot_somethi_a8824e: "I think I forgot something."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_know_people_8d5497: "I think I know. People tend to take things for granted. If I could live forever, I think I'd lose all my motivation. I mean, you have nothing but time."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_ll_able_68a52c: "I think I'll be able to breathe a little more if I catch 10 of them."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_lost_my_dcd0a5: "I think I lost my mind because the practice didn't go well."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_need_some_1e5067: "I think I need to do some work here."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_saw_something_176dd1: " - ^424242I think I saw something.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_tell_you_531318: "I think I can tell you why I painted the mural."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_i_ve_heard_5a0392: "I think I've heard that name somewhere..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_real_we_ve_d1305c: "I think it was real. We've never seen it."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_s_better_just_34fc49: "I think it's better to just go."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_s_possible_we_ed6356: "I think it's possible we're inside a Moonlight Flower's dream."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_we_ll_use_07e7e4: "I think we'll have to use fire."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_we_should_talk_55cd87: "- I think we should talk to Jerrymon about the work to send Sirood ashore. - "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_you_guys_need_1d0594: "I think you guys need to talk it out with each other. Have you tried to talk to her?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_you_ll_find_a71fba: "I think you'll find out when you meet Briashen."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_you_re_more_c320ca: "I think you're more human than anyone else I know. You also taught a vampire humanity."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_think_you_re_thinking_3cee36: "I think you're thinking the same thing as me."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_thinking_while_looking_3bcac4: "I was thinking while looking around."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_thought_a4893e: "I thought..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_thought_i_d_never_5c45db: "I thought I'd never come back..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_thought_i_going_die_94e399: "I thought I was going to die here, but then Lady Luck finally turned her gaze upon me."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_thought_priests_could_6abfe8: "I thought priests could heal themselves."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_threw_away_36d12e: "I threw it away."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_told_him_i_d_b6fcd6: "I told him I'd come back right away, but what the hell was the rumor about? There were a lot of people and monsters waiting in line."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_told_you_s_difficult_832b96: "I told you it's difficult for me to look at those soldiers without feeling pain."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_too_you_know_you_575773: "I can do that too, you know. You just have to give me a chance!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_touched_sent_me_back_968719: "I touched it, and it sent me back to the original ruined village."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_try_ignore_my_reality_7a3fcb: "I try to ignore my reality, but this ever-present hunger and thirst keep reminding me what kind of terrible monster I am."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_trying_swim_as_hard_1c4b6b: "I was trying to swim as hard as I could to get out, but I felt something pulling me in with great force."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_understand_even_me_i_cc39c4: "I understand. Even for me, I am bewildered, but please hear me out. I think my friend is in danger"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_understand_now_why_you_f69d2a: "I understand now why you did that."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_understand_why_those_f_a60797: "I understand why those ^0000FFfoxes are angry^000000, but this has to be done."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_uneasy_feeling_dreadfu_36b1ea: "I have an uneasy feeling that a dreadful is going to take place."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_vaguely_remember_i_did_b8a841: "I vaguely remember it. I did warn a stranger I met before I went hunting with my brothers."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_been_mines_most_706094: "I've been in the mines for most of these days, so my cough seems to be getting better."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_been_told_idiot_2e9233: "I've been told that idiot is excited."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_been_waiting_line_150772: "I've been waiting in line for days, but suddenly I'm not interested anymore..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_been_watching_deep_88ced1: "I've been watching the deep sea creatures here, and I've seen some of them glow with the essence of the abyss."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_decided_wait_her_e8689b: "I've decided to wait for her. I could use some rest, anyway."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_found_dry_twig_7b302f: "I've found 1 ^006400Dry Twig^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_found_strange_stone_543ba4: "I've found this strange stones while I was there. It's not much,"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_found_traces_experi_3a5620: "I've found traces of experiments everywhere. Some of my peers must have been here before I have."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_got_so_many_27ef9c: "I've got so many questions, but that mean priest wouldn't let me touch it."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_heard_adventurers_m_9fde28: "I've heard adventurers do many things for others. Is that true?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_heard_both_you_8e175f: "I've heard both of you, but neither of you told me what you were fighting for."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_heard_they_hire_17ee31: "I've heard that they hire adventurers because they don't have enough hands to defend the village. I guess that's you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_known_beginning_you_757f9d: "I've known that from the beginning. Your face is so transparent, you can't hide anything. I just didn't say anything because I found it funny that you nervously kept glancing at us."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_lived_village_long_14787d: "I've lived in the village for a long time, but it seems like a phenomenon I've never heard of. I'm guessing, but I think it's just started happening recently."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_never_hurt_anyone_030b26: "I've never hurt anyone, and I won't start now."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_picked_up_your_62dda6: "I've picked up your notebook."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_studied_lot_why_af4273: "I've studied a lot. Why do you think I have?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_talked_guards_cough_80ffa6: "I've talked to the guards, but...cough...cough...they didn't take it seriously..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_ve_talked_villagers_ca3892: "I've talked to the villagers,"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_waited_answer_while_th_75f510: "== I waited for an answer for a while, but there is no response from the self-proclaimed Khahris. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_i_waited_while_there_no_eac8bc: "== I waited for a while, but there is no response from the self-proclaimed Khahris. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_i_waiting_tomorrow_3a50bf: "I will be waiting for tomorrow."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_ask_them_somethin_0a0190: "I want to ask them something!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_end_infernal_nigh_539c4a: "I want to end this... infernal nightmare..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_get_rid_their_188386: "I want to get rid of their manes and see if it affects our dreams."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_go_back_izlude_3407d6: "I want to go back to Izlude"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_know_more_than_486336: "I want to know more than anything what tore the walls between reality and dreams."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_repay_you_healing_cf7436: "I want to repay you for healing me. Also, after listening to you both, I think it's better I go. Do you want me to go bring back your colleagues?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_without_having_le_133e36: "And I want to do that without having to leave my colleagues to fend for themselves. Do you know what I mean?"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_you_bring_me_051c49: "I want you to bring me out."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_you_go_over_32ec08: "I want you to go over there..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_want_you_liberate_them_ce3f56: "I want you to liberate them from the icicles growing on their bodies."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wanted_my_obsession_2d935d: "I wanted to do it.  My obsession is..."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wasn_t_asking_you_003b9c: "I wasn't asking you! Unless you're going to let me touch the notebook, stay out of my hair!"
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wasn_t_ready_let_b736c8: "I wasn't ready to let her go. Before I had time to think about what I was doing, I turned her. "
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wish_i_could_go_800947: "I wish I could go with you, but my group needs me here."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wish_you_stronger_then_7b332d: "I wish you were stronger. Then, I would've been able to tell you about it."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_witnessed_sad_event_i_d21af3: "I witnessed a sad event. I must tell Luanda about my experience."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_won_t_leave_you_90bd78: "I won't leave you alone."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_won_t_resent_you_84c9c9: "But I won't resent you for this. I promise."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wonder_if_there_specia_8dfb9c: "I wonder if there are special potions that could improve me physically. Then, I could become stronger at last."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wondering_if_there_any_67034b: "I was wondering if there was anything else found besides the fishing rod."
  npc_override_gef_d01_i_quests_illusion_dungeons_i_wouldn_t_adventurer_if_1ed5fc: "I wouldn't be an adventurer if I did."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_alone_there_could_bee_20ebc0: "If {0} was alone there, it could have been hallucinations too, right?"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_case_724a41: "If that was the case?"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_happens_i_ll_let_d95ecc: "If that happens, I'll let you take care of them by yourself."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_he_hasn_t_contacted_3a7298: "If he hasn't contacted me yet, something must have happened."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_could_i_ve_b6dd48: "If I could, I would've found my way back to you already."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_don_t_come_c21047: " - ^424242If I don't come back, she will forget. Just right before I walk into the light, Narin's voice echoed from behind me.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_don_t_go_95fdb7: "If I don't go and check it myself..."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_drink_toxic_blood_aab286: "If I drink this toxic blood about thirty times, I might turn? oh, never mind."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_forget_again_please_eb8265: "If I forget again... Please I will try to remember..."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_go_back_outside_098440: "If I go back to the outside world, I won't be able to stop myself from hurting people."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_go_there_i_f9c779: "If I can go there, I will save him myself."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_m_mistaken_s_d15a07: "If I'm not mistaken, that's..."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_i_mix_them_like_7e6276: "If I mix them like this and drink..."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_only_i_had_been_015c27: "If only I had been a little stronger..."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_s_youngest_s_memory_11fc1e: "If it's the youngest's memory, that's it. It's odd to be a stranger at this age."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_so_my_sister_law_10e26b: "If so... my sister-in-law also..."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_there_others_i_ask_83aa59: "If there are others, I can ask for their help."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_they_make_even_slight_2e38cd: "But if they make even the slightest mistake, we'll get rid of them!"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_we_play_rules_then_e22d19: "If we play by the rules, then we shouldn't allow them to live."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_we_re_really_inside_1abded: "If we're really inside Moonlight Flower's nightmare, like Chunghae thinks,"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_we_well_we_might_63c25f: "If we do well, we might be able to make the vortex linking here and Izlude last forever!"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_ask_me_sounds_ec2738: "If you ask me, that sounds the most plausible of all your stories I've heard."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_collect_them_i_84e8fe: "If you collect them, I'll create a whirlpool for you."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_decide_ll_make_814bee: "If you decide to do it, it'll make you one of us, very ecstatic. Probably because he is a fool."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_don_t_want_57c931: "If you don't want me to teach you, that's fine by me."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_ever_go_through_99465d: "If you ever go through something similar, please let me know. I'm begging you."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_find_either_one_124135: "If you find either one, I hope you bring them out."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_find_leiphen_plea_782ba7: "If you find Leiphen, please make sure he is eating."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_follow_whirlpool_4156c5: "If you follow this whirlpool, you may be able to find the owner of the fishing rod."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_go_downstairs_you_88ce51: "If you go downstairs, you will run into some pretty vicious fish. Would that be alright?"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_harm_yourself_a4f804: "If you can harm yourself..."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_leave_let_sister_aeb53b: "If you have to leave, let Sister Marina know. She'll send you back to where you came from."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_look_around_maybe_1d676a: "If you look around, maybe you'll find a clue...even if it's just a small thing?"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_okay_you_hunt_fee5b2: "If you are okay, can you hunt some monsters around?"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_overdo_you_ll_782c59: "If you overdo it, you'll only ruin your health."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_busy_could_b884a3: "If you're not busy, could you help me with something?"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_busy_right_0e0a9a: "If you're not busy right now, help me defeat {0}, {1}, and {2}."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_curious_stand_445cc1: "If you're that curious, stand behind me and wait for your turn!"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_familiar_comba_42c643: "If you're familiar with combat, puppeteers who aren't familiar with combat won't find it easy to get out of here."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_looking_teache_7ea0d4: "If you're looking for the teacher, she's in the other room."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_re_really_curious_aa1abe: "If you're really curious, I'll give you my position. Why don't you go in and check it out?"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_really_want_exper_edf1c0: "If you really want to experiment on those blasphemous creatures, then I suggest you talk with Brother Jojo and the others first."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_saw_alone_could_0d18b4: "If you saw {0} alone, it could have been an illusion, right?"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_shake_like_crazy_8c1775: "If you shake it like crazy!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_time_please_come_3d399c: "If you have time, please come back tomorrow. I'll be waiting for you."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_want_go_you_70fb16: "If you want to go, you'll have to go alone and see it for yourself."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_want_leave_ask_da7bb0: "If you want to leave, ask Sister Marina to let you out."
  npc_override_gef_d01_i_quests_illusion_dungeons_if_you_want_look_further_820159: "If you want to look further into this, you'll have to visit the ruined village."
  npc_override_gef_d01_i_quests_illusion_dungeons_ignore_98f55d: "Ignore"
  npc_override_gef_d01_i_quests_illusion_dungeons_imagine_how_uncomfortabl_af202f: "Imagine how uncomfortable and cold they must be!"
  npc_override_gef_d01_i_quests_illusion_dungeons_indeed_shows_how_its_own_ff518b: "Indeed. It shows how its owner studied those blasphemous creatures to ^0000cdcreate stamina and mana enhancers^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_influenced_sirood_we_als_3dcbc8: "Influenced by Sirood, we also fell in love with fishing, and the four of us often had a good time."
  npc_override_gef_d01_i_quests_illusion_dungeons_information_isn_t_someth_8efbe3: "Information isn't something you get for free."
  npc_override_gef_d01_i_quests_illusion_dungeons_interesting_7c5f3c: "Interesting."
  npc_override_gef_d01_i_quests_illusion_dungeons_invading_they_called_the_f24b76: "Invading... they called themselves Nazarians, right?"
  npc_override_gef_d01_i_quests_illusion_dungeons_investigation_going_smoo_5f3220: "The investigation is going smoothly~"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_72ec8e: "isn't it?"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_briashen_having_lo_48ac8f: "Isn't Briashen having a longer hallucination than the other adventurers, rather than the illusion adventuring with Briashen?"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_doll_we_made_b1f9fa: "Isn't that the doll we made?"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_enough_c8ffe0: "This isn't enough."
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_fishing_rod_bit_577dab: "Isn't this fishing rod a bit strange over there?"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_guy_just_really_98487b: "...Isn't this guy just really cold?"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_just_whirlpool_cre_7dafdc: "??? Isn't that just a whirlpool created by shaking it?"
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_town_plenty_food_45d7e9: "This isn't a town with plenty of food, and I don't think there's any particular reason for monsters to target it."
  npc_override_gef_d01_i_quests_illusion_dungeons_isn_t_what_you_told_78eec9: "That isn't what you told me the first time. I never believed that stupid story, anyway. I followed you in because I was curious. I totally regret it now."
  npc_override_gef_d01_i_quests_illusion_dungeons_jerrymon_began_examine_r_994654: "- Jerrymon began to examine the rod closely. -"
  npc_override_gef_d01_i_quests_illusion_dungeons_jerrymon_poured_both_wat_624c13: " - Jerrymon poured both waters into one bottle and began to shake them together. - "
  npc_override_gef_d01_i_quests_illusion_dungeons_jerrymon_put_glowing_sto_154da8: " - Jerrymon put a glowing stone into the bottle. The glowing stone was sucked into the whirlpool inside the bottle and disappeared without a trace! - "
  npc_override_gef_d01_i_quests_illusion_dungeons_jerrymon_should_still_na_23ffed: "^4d4dffJerrymon^000000 should still be at the <NAVI>[East Library]<INFO>prontera,192,264,</INFO></NAVI> in Prontera."
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_58fd5c: "Jojo."
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_f9743c: "Jojo?"
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_s_colleagues_lookin_2dd6be: "Jojo's colleagues are looking for him."
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_wanted_see_me_f2244e: "Jojo wanted to see me."
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_you_jojo_1ff144: "Jojo? Are you Jojo?"
  npc_override_gef_d01_i_quests_illusion_dungeons_jojo_you_re_jojo_right_1e69e1: "Jojo? You're Jojo, right? Your colleagues are worried about you. Let's go back. You're not hurt, are you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_junghee_i_explore_place_df6dc9: "Junghee and I will explore this place further."
  npc_override_gef_d01_i_quests_illusion_dungeons_junghee_i_mean_soldier_f_bd08f5: "Junghee? I mean, a soldier followed her in, but neither of them came out yet."
  npc_override_gef_d01_i_quests_illusion_dungeons_just_949961: "It was just that."
