  npc_override_gef_d01_i_quests_illusion_dungeons_these_soldiers_tried_pro_54ad56: "These soldiers tried to protect their villagers until the last moment,"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_also_named_them_kar_9a4464: "They also named them Karu, Luanda, and Mao after the caves around town."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_asked_my_name_again_e1f877: "^ff0000They asked my name again, as if they didn't remember me. Something weird is going on, but I told them my name again, anyway.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_became_bitter_after_94569c: "They became bitter after being ignored too many times. Now, they pretend to be friendly,"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_conducted_various_e_83fbab: "They conducted various experiments to understand the special energy that reanimated the dead."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_could_using_him_as_0ad1da: "But they could be using him as bait!"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_destroyed_good_reas_c5e088: "They were destroyed for good reason. So stop wondering about them."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_died_such_horrible_fefe38: "They died such a horrible death that they're unable to move on to the Netherworld."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_drink_zombie_blood_fc63e4: "But they drink zombie blood! Yuk! I'll never drink dead blood, no matter how hungry I am. That's disgraceful!"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_even_tried_kidnap_y_722a48: "They even tried to kidnap you!"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_just_look_big_becau_dda469: "They just look big because of the icicles growing on their bodies."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_like_twins_84e969: "They were like twins"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_may_real_if_they_493668: "They may not be real, but if they pose any threat to the living, then they must be taken care of."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_might_go_away_compl_7eb916: "They might not go away completely."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_must_near_cave_now_3aa10b: "They must be near the cave by now."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_quite_annoying_so_c_d31ea8: "They are quite annoying, so be careful."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_re_annoying_c40171: "They're annoying."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_re_having_same_conv_4cc6d2: "^ff0000They're having the same conversation they had before. Also, I don't think they remember me.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_reminded_me_time_wh_bea753: "They reminded me of the time when the village was buried under landslide."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_said_he_casts_power_5b0c77: "They said he casts powerful spells wherever he goes, and it was one of his spells that shook the ground and caused the fatal landslide. As a result, a lot of the villagers and foxes died."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_said_name_guardian_2b2bb4: "They said it was the name of the guardian spirits that guarded the old village."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_seem_threaten_us_so_a213d1: "And they seem to threaten us sometimes."
  npc_override_gef_d01_i_quests_illusion_dungeons_they_started_fade_away_a_68bff9: "^ff0000They started to fade away as they bid me goodbye. It seems this cave is stuck in an endless time loop.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_started_fade_away_a_b4becc: "^ff0000They started to fade away as they bid me goodbye. Soon there was nothing left of them, as if they never existed at all. Was this all just a dream or something?^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_took_my_treasured_m_aa2850: "They took ^BDBDBDmy^000000 treasure^BDBDBDD.... My!! treasure^000000...!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_they_ve_all_been_elimina_9c0616: "They've all been eliminated, thank you for your hard work."
  npc_override_gef_d01_i_quests_illusion_dungeons_this_this_41a46c: "This... this!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_those_arrogant_mages_cro_4792cf: "Those arrogant mages crossed the line! They tried to play God!"
  npc_override_gef_d01_i_quests_illusion_dungeons_those_foxes_must_angrier_e3c307: "Those foxes must be angrier than I thought."
  npc_override_gef_d01_i_quests_illusion_dungeons_those_two_ladies_may_agr_89f5b5: "Those two ladies may not agree, but I don't have to stay here. I'm only staying because of ^0000cdSweet Nightmares^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_though_shallow_trenches_f21f8d: "Though shallow trenches can be explored to some extent."
  npc_override_gef_d01_i_quests_illusion_dungeons_time_as_mirko_said_brias_93057e: "== This time, as Mirko said, Briaschen has a bad complexion. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_time_passed_6afb41: "The time has passed..."
  npc_override_gef_d01_i_quests_illusion_dungeons_time_sad_we_need_build_3899e9: "This is not the time to be sad. We need to build more defenses and take other measures."
  npc_override_gef_d01_i_quests_illusion_dungeons_time_she_s_completely_lo_149bc4: "And this time, she's completely lost her mind and entered the cave."
  npc_override_gef_d01_i_quests_illusion_dungeons_today_i_heard_some_stran_ecb54f: "Today, I heard some strange noise in the catacombs. The zombies and bats were strangely quiet."
  npc_override_gef_d01_i_quests_illusion_dungeons_today_i_no_choice_commis_a45660: "Today, I have no choice but to commission other adventurers."
  npc_override_gef_d01_i_quests_illusion_dungeons_told_him_about_karoo_asu_7526b9: "Told him about Karoo and Asudem."
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_mao_wh_2caa96: "Told Luanda about Mao, who was training alone."
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_someon_906a0a: "Told Luanda about someone who was taking something from the cave."
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_storie_34f2e2: "Told Luanda about stories of unknown people."
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_story_4cf5ba: "Told Luanda about the story of meeting the brothers who ran somewhere in a hurry."
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_story_ac1be1: "Told Luanda about the story of meeting the villagers and the village chief."
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_story_dac1b4: "Told Luanda about the story of seeing Karu and Asudem."
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_strang_826034: "Told Luanda about the strange shimmering you had witnessed."
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_three_9ce9d3: "Told Luanda about three young men you met and talked to."
  npc_override_gef_d01_i_quests_illusion_dungeons_told_luanda_about_who_pa_7b146f: "Told Luanda about who was painting murals in the cave."
  npc_override_gef_d01_i_quests_illusion_dungeons_tomorrow_day_after_tomor_7695a5: "Tomorrow, and the day after tomorrow... I'll be waiting... Brother and professor."
  npc_override_gef_d01_i_quests_illusion_dungeons_too_bad_there_nothing_bu_b68056: "Too bad. There was nothing to burn... So I can't make a fire."
  npc_override_gef_d01_i_quests_illusion_dungeons_too_dangerous_2864d5: "This is too dangerous."
  npc_override_gef_d01_i_quests_illusion_dungeons_too_long_ago_there_lot_715f8c: "Not too long ago, there was a lot of uproar when a creature from the lower layer came up to the upper layer."
  npc_override_gef_d01_i_quests_illusion_dungeons_too_many_them_545850: "Too many of them."
  npc_override_gef_d01_i_quests_illusion_dungeons_totem_glows_softly_blue_841e04: "This is a totem that glows softly in blue."
  npc_override_gef_d01_i_quests_illusion_dungeons_touch_4d2a8d: "Touch it"
  npc_override_gef_d01_i_quests_illusion_dungeons_town_isolated_world_moun_38b86d: "A town isolated from the world by the mountains, the people of Payon way of thinking is different from the outside."
  npc_override_gef_d01_i_quests_illusion_dungeons_triplets_said_been_named_9467e5: "The triplets are said to have been named Karu, Luanda, and Mao after the village caves."
  npc_override_gef_d01_i_quests_illusion_dungeons_try_again_1e2e57: "- try again. -"
  npc_override_gef_d01_i_quests_illusion_dungeons_try_place_them_too_close_4c8e64: "try not to place them too close to me."
  npc_override_gef_d01_i_quests_illusion_dungeons_try_talking_mirko_again_96e432: "Try talking to Mirko again."
  npc_override_gef_d01_i_quests_illusion_dungeons_tsk_tsk_i_don_t_f6c685: "Tsk, tsk. I don't know how you've become a wizard when you can't even spell correctly."
  npc_override_gef_d01_i_quests_illusion_dungeons_tsk_tsk_you_guys_so_c90780: "Tsk, tsk. You guys are so simpleminded, thinking fire would melt ice like this. It's not working, is it? We need to think outside of the box. Let's try to beat the ice with ice!"
  npc_override_gef_d01_i_quests_illusion_dungeons_turned_out_his_son_law_8e9775: "But it turned out his son-in-law was also a thief. He ended up running away with the kingdom's most valuable treasure."
  npc_override_gef_d01_i_quests_illusion_dungeons_turned_out_ordinary_inva_6fa655: "It turned out to be an ordinary, invaluable mushroom."
  npc_override_gef_d01_i_quests_illusion_dungeons_turning_around_small_smi_856031: " - ^424242Turning around with a small smile, Narin, holding her hands, was surprised and glanced over.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_typical_priest_wait_him_5c2a6a: "Typical priest... Wait, is that him?"
  npc_override_gef_d01_i_quests_illusion_dungeons_typical_wizard_could_joj_814055: "^0000cdTypical wizard^000000... Could that be ^0000cdJojo^000000?"
  npc_override_gef_d01_i_quests_illusion_dungeons_typical_wizard_wait_coul_1558cc: "Typical wizard... Wait, could that be Jojo??"
  npc_override_gef_d01_i_quests_illusion_dungeons_u_i_don_t_want_8007f7: "^0000CDU I don't want anyone get die here. I want to save all life.^000000......"
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_07d624: "Ugh!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_167de7: "Ugh..."
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_i_t_eat_sorry_18648f: "Ugh... I can't eat. Sorry... You tried for nothing..."
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_thanks_1f43bf: "Ugh... Thanks!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_things_got_messy_62ff24: "Ugh...things got messy..."
  npc_override_gef_d01_i_quests_illusion_dungeons_ugh_you_re_going_burn_badb54: "Ugh, you're going to burn us to death."
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_7b1d46: "Uh..."
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_f97db7: "Uh.....??"
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_hello_481350: "Uh, hello"
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_huh_you_saw_me_cc56ab: "Uh.. huh?! You saw me and young men who look like like my brothers."
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_i_didn_t_tell_f7db04: "Uh, I didn't tell you. I'm taking a sabbatical year."
  npc_override_gef_d01_i_quests_illusion_dungeons_uh_so_c58175: "Uh... is that so?"
  npc_override_gef_d01_i_quests_illusion_dungeons_uhhh_yes_i_made_mistake_8930ec: "Uhhh... yes I made a mistake, this is the fishing rod Sirood left behind. Please take good care of it."
  npc_override_gef_d01_i_quests_illusion_dungeons_uhm_s_bit_mess_great_1768c0: "Uhm... It's a bit of a mess... but this is a great mural for my skills."
  npc_override_gef_d01_i_quests_illusion_dungeons_um_adventurer_ba2b3c: "Um... Adventurer?"
  npc_override_gef_d01_i_quests_illusion_dungeons_um_b716d0: "Um..."
  npc_override_gef_d01_i_quests_illusion_dungeons_um_hahahahahahahahaha_f63d26: "Um hahahahahahahahaha!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_um_hey_6e85c2: "......um.. Hey?"
  npc_override_gef_d01_i_quests_illusion_dungeons_um_i_m_kind_busy_97013b: "Um, I'm kind of busy."
  npc_override_gef_d01_i_quests_illusion_dungeons_um_okay_then_please_brin_772eb1: "Um, okay, then please bring me ^0000cd20 Short Bat Hairs^000000 for starters."
  npc_override_gef_d01_i_quests_illusion_dungeons_um_uhm_0bd721: "Um... Uhm..."
  npc_override_gef_d01_i_quests_illusion_dungeons_um_you_adventurer_i_favo_8a2a6c: "Um.. Are you an adventurer?? I have a favor to ask you..."
  npc_override_gef_d01_i_quests_illusion_dungeons_um_you_haven_t_found_bbbd32: "Um, you haven't found it, I see."
  npc_override_gef_d01_i_quests_illusion_dungeons_ummm_i_know_someone_who_4f9a8f: "Ummm... but I know someone who might know a little about this rod."
  npc_override_gef_d01_i_quests_illusion_dungeons_under_command_knights_i_7b71f2: "Under the command of the Knights, I am on a mission to search for Alberta's 2nd Knights Division, who had disappeared in Turtle Island."
  npc_override_gef_d01_i_quests_illusion_dungeons_unless_you_realize_us_we_79429d: "But unless you realize us, we cannot realize you either. It's a good thing."
  npc_override_gef_d01_i_quests_illusion_dungeons_until_adventurer_strong_847985: "But until an adventurer strong enough to get there..."
  npc_override_gef_d01_i_quests_illusion_dungeons_until_day_they_our_feet_1746b1: "Until the day they are at our feet, us Nazarians!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_until_i_find_out_all_673a1e: "Until I find out all of the secrets here."
  npc_override_gef_d01_i_quests_illusion_dungeons_vague_image_i_saw_indist_168b92: "The vague image I saw is indistinguishable from hell."
  npc_override_gef_d01_i_quests_illusion_dungeons_vampire_f3aec1: "A vampire?!"
  npc_override_gef_d01_i_quests_illusion_dungeons_vampires_who_understand_1dc04a: "And vampires who understand humans? My goodness!"
  npc_override_gef_d01_i_quests_illusion_dungeons_village_having_lot_troub_a7f942: "The village is having a lot of trouble with the Megaliths. I will reward you if you bring me 3 {0} as proof of defeating the Megaliths."
  npc_override_gef_d01_i_quests_illusion_dungeons_vitata_khahris_35009b: "That Vitata is Khahris"
  npc_override_gef_d01_i_quests_illusion_dungeons_vitata_s_behavior_threat_a1c772: "Vitata's behavior is a threat to her status..."
  npc_override_gef_d01_i_quests_illusion_dungeons_vitata_turned_way_d9b8da: "== Vitata turned this way. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_vrid_grimaced_sighed_scr_39bfa9: "^ff0000Vrid grimaced, sighed, and scratched his head. He then said...^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_vrid_you_haven_t_said_69e26d: "Vrid, you haven't said anything. Come on, think of something!"
  npc_override_gef_d01_i_quests_illusion_dungeons_waaaaaaa_aebad6: "Waaaaaaa!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_waaaaaaaa_9f44c4: "Waaaaaaaa!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_adventurer_you_have_268477: "But wait, Adventurer. You haven't heard my side of the story."
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_moment_cba7f9: "- Wait a moment!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_sister_marina_calm_f23c34: "Wait, Sister Marina. Calm yourself."
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_sister_marina_i_sai_696ac7: "Wait, Sister Marina. I said, calm yourself."
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_we_re_warriors_we_94fb90: "Wait. We're warriors? we can't leave without making our enemy pay for what he did to us!"
  npc_override_gef_d01_i_quests_illusion_dungeons_wait_what_s_7562cf: "Wait what's that?"
  npc_override_gef_d01_i_quests_illusion_dungeons_waited_while_rwella_didn_6fff53: "== Waited for a while, but Rwella didn't respond. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_waiting_someone_discover_6b6b88: "Waiting for someone to discover..."
  npc_override_gef_d01_i_quests_illusion_dungeons_warriors_nazarians_f7cf20: "Warriors of Nazarians!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_watch_illusions_notebook_fad282: "Watch for illusions. The notebook's owner's memories manifest themselves sporadically around here."
  npc_override_gef_d01_i_quests_illusion_dungeons_water_pressure_also_much_17a239: "The water pressure is also much lower than that of normal seawater, so it is assumed that it has a favorable environment for life."
  npc_override_gef_d01_i_quests_illusion_dungeons_way_adventurer_weren_t_y_cf72f8: "By the way adventurer, weren't you looking for Muyeon?"
  npc_override_gef_d01_i_quests_illusion_dungeons_way_haven_t_i_seen_f2f771: "By the way, haven't I seen you somewhere? Your face looks strangely familiar."
  npc_override_gef_d01_i_quests_illusion_dungeons_way_i_told_you_about_f1ef39: "By the way, I told you about the dangers of this fake blood. Remember? It leaves toxins in my system."
  npc_override_gef_d01_i_quests_illusion_dungeons_way_khahris_briashen_loo_dbe08b: "== By the way, the Khahris that Briashen was looking for is not a gunslinger. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_way_please_make_sure_lei_8793e1: "On the way, please make sure Leiphen is doing good."
  npc_override_gef_d01_i_quests_illusion_dungeons_way_there_times_when_peo_3c365b: "By the way, there are times when people have circumstances."
  npc_override_gef_d01_i_quests_illusion_dungeons_way_they_re_also_victims_8febf8: "In a way, they're also victims."
  npc_override_gef_d01_i_quests_illusion_dungeons_way_what_brings_you_here_bc04c7: "By the way, what brings you here?"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_act_now_we_ve_42c480: "We have to act now. We've already incapacitated one out of the three."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_call_deep_seawater_df8bbd: "We call it ^4d4dffdeep seawater^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_came_here_find_out_428271: "We came here to find out how and why this place was created."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_didn_t_find_anything_d05a42: "We didn't find anything peculiar about this place. We want to leave, but a couple of us, ^0000cda priest and a wizard^000000 hasn't returned to join us."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_don_t_worship_monster_ded78f: "We don't worship monsters."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_fully_prepared_while_a7d0fe: "We are fully prepared while the adventurers are coming."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_guess_one_fact_all_fe1444: "We can guess one fact. All the lost memories are in the subconscious mind of Narin."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_hate_life_those_who_90cbca: "We hate life. Those who are not bound by the burden of resentment, those who breathe strangely. We want to hear your last breath."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_invited_go_out_togeth_edfb96: "We were invited to go out together, but they all declined."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_know_you_haven_t_522c02: "We know you haven't hurt anyone, and you want to keep it that way. And we appreciate you saved Brother Jojo."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ll_a300f8: "We'll do it!"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ll_try_your_suggestio_372cd0: "We'll try your suggestion. Adventurer, could you hunt 10 Hard Icicles and come back?"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ll_try_your_suggestio_7ce5c3: "We'll try your suggestion. Adventurer, could you hunt 10 Furious Gazetis and come back?"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ll_try_your_suggestio_7efef4: "We'll try your suggestion. Adventurer, could you hunt 10 Furious Snowiers and come back?"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ll_try_your_suggestio_ce85df: "We'll try your suggestion. Adventurer, could you hunt 10 Furious Ice Titans and come back?"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_mages_just_like_you_2a377f: "We mages are just like you adventurers in that sense. I knew you'd understand me."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_must_drive_out_all_e382cc: "We must drive out all the humans and take over the land."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_must_shut_place_down_d682a1: "We must shut that place down, so no one will be able to access it."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_need_dry_twigs_check_4099cb: "We need 10 Dry Twigs. Check the heaps of dry soil inside this cave."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_need_find_some_people_c508ad: "We need to find some people."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_need_look_around_more_6db8cc: "We need to look around for more clues."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_need_look_into_furthe_55a88a: "We need to look into this further. I'd better go to the ruined village."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_need_melt_ice_around_937957: "But we need it to melt the ice around us. We'll be okay... I think."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_only_identified_exist_95048f: "We only identified the existence of Abyssal Seawater deep in the Bahia Trench, and it was very difficult to obtain samples. This fishing rod has a lot of Abyssal Seawater on it..."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_planned_subdue_wutan_c779c3: "We have planned to subdue the Wutan tribe. Anyone who can catch 5 {0}, {1}, and {2}, please apply."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_plant_our_holy_core_d20208: "We will plant our holy core into the body that is only an empty shell!"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_re_enthralled_monster_308a8a: "We're not enthralled by monsters!"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_re_going_make_any_63efc4: "We're not going to make any decision. Instead, we'll ^0000cdstay here with you^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_re_no_position_take_40c4ec: "We're in no position to take care of anyone right now, so take care of yourself.."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_re_supposed_come_back_7a17ab: "We're... not supposed to come back..."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_really_inside_moonlig_31a7ed: "Are we really inside a Moonlight Flower's nightmare?"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_see_right_cbcb2f: "We will see. Right?"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_should_grasp_situatio_abf39c: "We should grasp the situation first."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_t_get_there_our_8bd8e1: "We can't get in there on our own. No one can do that now."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_t_let_keep_happening_62a66f: "We can't let it keep happening like this."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_t_like_d9bcf1: "We can't be like this..."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_take_basic_training_s_533820: "We take basic training to be servants of God, but what each one of us can do depends on our natural ability."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_think_about_how_break_728fd9: "We have to think about how to break out of this ice. *Groan*"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_thought_d_take_foreve_afa05c: "We thought it'd take forever to find them, so we decided to split up. We were discussing how we'd go about doing it when you showed up."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_understand_things_we_3c5e2b: "We understand the things that we want to study can be dangerous, so we try our best to be careful."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_understand_you_don_t_4c6d15: "We understand you don't want to hurt anyone."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_use_cold_energy_monst_5ff5d3: "We can use the cold energy from the monsters in this place to break the ice, I think."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ve_asked_soldier_find_87b5cd: "We've asked a soldier to find her."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ve_been_trying_both_f9ae9c: "We've been trying to do both, and it's hard to do that between just the three of us."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ve_done_nothing_wrong_81e95c: "We've done nothing wrong!"
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ve_planned_subdue_meg_b21714: "We've planned to subdue the megaliths. Anyone who can catch 5 {0}, {1}, and {2}, please apply."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_ve_searched_around_no_111b41: "We've searched around, but the notebook's owner's memory of this place is rather hazy and inconsistent. Illusions of different wizards keep appearing, frequently and in masses."
  npc_override_gef_d01_i_quests_illusion_dungeons_we_won_t_need_more_66038f: "We won't need more rituals once we deal with the nightmares."
  npc_override_gef_d01_i_quests_illusion_dungeons_welcome_2d1613: "== Welcome...? =="
  npc_override_gef_d01_i_quests_illusion_dungeons_welcome_e52e5e: "Welcome!"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_d3da28: "Well...??"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_first_all_they_mm_bcd0c1: "Well, first of all, they were... Mm... Uh..."
  npc_override_gef_d01_i_quests_illusion_dungeons_well_i_ll_let_chunghae_90c62b: "Well, I'll let Chunghae figure it out."
  npc_override_gef_d01_i_quests_illusion_dungeons_well_i_m_just_here_886c41: "Well? I'm just here because I'm curious..."
  npc_override_gef_d01_i_quests_illusion_dungeons_well_icicles_icicles_s_l_2b9b29: "Well, icicles are icicles. It's not like they have a life story, do they?"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_if_monster_hunting_32b8a9: "Well, if the monster hunting is too cumbersome... you can carry me out.."
  npc_override_gef_d01_i_quests_illusion_dungeons_well_let_me_take_pieces_c9df33: "...Well, let me take ^0000CDthe {0} ^00000010 pieces, ^0000CDlet me try first^000000 please."
  npc_override_gef_d01_i_quests_illusion_dungeons_well_might_just_idea_liv_0a170f: " - ^424242Well, it might be just the idea of a living person that the {0} is precious.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_well_technically_she_s_s_116d31: "Well, technically, she's still an apprentice, but that's not important."
  npc_override_gef_d01_i_quests_illusion_dungeons_well_then_go_get_them_f5a0fe: "Well, then go get them yourself. Don't dump things on this adventurer."
  npc_override_gef_d01_i_quests_illusion_dungeons_well_there_things_around_2f1c4e: "Well, there are things around here that I want to study, and..."
  npc_override_gef_d01_i_quests_illusion_dungeons_well_they_don_t_bother_5255ef: "Well, they don't bother me as long as I stay close to Dracula and King."
  npc_override_gef_d01_i_quests_illusion_dungeons_went_horribly_wrong_spec_472800: "That went horribly wrong. The special energy that surrounded the catacombs exploded, bringing back all the dead buried in them."
  npc_override_gef_d01_i_quests_illusion_dungeons_wh_who_you_c0a594: "Wh-who are you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_89511a: "What is it?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_8b0be3: "what?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_about_beings_i_just_6fc83a: "What about the beings I just talked to? I need to tell Luanda about my experience."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_about_person_left_b_b7f7a5: "What about the person left behind? They have no one to look out for them."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_am_i_supposed_now_c26b07: "What am I supposed to do now?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_be65b9: "What?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_briashen_said_50df0e: "Is that what Briashen said?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_brings_you_i_sugges_41fe9d: "What brings you? I suggest you stay away out of this place."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_cave_f74b80: "What is this cave?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_changed_24d22a: "What changed that?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_d2bf75: "What..."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_did_khahris_me_6700b9: "What did Khahris... do with me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_did_you_give_her_1ee949: "What did you give her?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_did_you_say_f7d677: "What did you say?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_drac_stop_acting_li_bca2f4: "What? Drac! Stop acting like a human! We're proud, dignified vampires!"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_happened_e9ef65: "What happened?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_happened_where_s_br_20aa05: "What happened? Where's Brother Jojo?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_happened_you_human_265878: "What happened? You were a human."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_hell_going_156ba7: "What the hell is going on..."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_hell_going_there_d6820b: "What the hell is going on in there?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_hey_wait_wait_come_7234d8: "What? Hey, wait! Wait! Come on, Zeith! I thought we were better friends than that!"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_i_as_adventurer_if_a66072: "What can I do? As an adventurer, if this place isn't a historical site and there are no traces of people... I'll have to look for it!"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_i_i_t_walk_43c5d3: "What do I do? I can't walk because of my leg. I can't teleport because I don't have enough energy left."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_idiot_9254fa: "What an idiot!"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_if_he_s_responsible_b80739: "What if he's responsible for this incident."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_if_there_s_human_ba6f62: "What if there's a human who did nothing but hurt others. What would you do about them?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_kind_monster_you_wa_dd4d39: "What kind of monster do you want?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_kinds_ingredients_y_d2510d: "What kinds of ingredients do you need? I'll get them for you."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_kinds_monsters_you_5da12d: "What kinds of monsters do you want me to take care of?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_looked_like_whirlpo_9aa581: "What, it looked like a whirlpool... I thought I was going to die... and when I woke up, I found this place."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_material_you_talkin_e75fbe: "What material are you talking about?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_mess_96fbed: "What a mess..."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_mirko_guy_good_orga_553e81: "What is it? But that Mirko guy is good at organizing things. He's a good client."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_missing_members_loo_606576: "What do the missing members look like?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_monster_1974d3: "What monster?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_no_d276fb: "What?? No!"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_no_you_ve_made_11460e: "What? No! You've made up with her. It's time to leave!"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_people_church_917842: "What people from the Church?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_revenge_how_did_you_5a4b95: "- What revenge? How did you get frozen, anyway?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_front_967cd0: "What's in front?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_going_c28e59: "What's going on?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_keepsake_you_don_4ef87c: "What??? It's a keepsake!! You don't even know if Sirood is alive or dead!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_so_tacky_2168b5: "What? That's so tacky."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_supposed_mean_you_f5512f: "What's that supposed to mean? Are you saying that I can't fight zombies because I'm not a servant of God?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_up_adventurer_6df088: "What's up, adventurer?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_up_i_m_8c88e1: "What's up? I'm a bit busy right now..."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_up_i_m_ed253a: "What's up? I'm busy right now, so I'll talk to you later."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_up_i_need_3a31c4: "What's up, I need to hire more people now."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_written_unsettlin_ffe27b: "What's written in it is unsettling, but what's more serious is? You'll have to read it yourself. Just don't open the ^0000cdlast page^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_wrong_859caf: "What's wrong..."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_wrong_briashen_al_72d15e: "What's wrong? Is Briashen all right?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_your_name_aedcdb: "What's your name? {0}?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_s_your_name_c88dda: "What's your name?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_she_want_ee4379: "What does was she want..."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_should_i_39c970: "What should I do?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_should_i_if_i_67d831: "What should I do? If I get hurt like that, let alone search..."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_smell_blood_smell_b_bccff8: "What? Smell of blood? Smell of blood from the village side? No way? It's not time to pay attention to strangers. Let's go quickly."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_sound_06d245: "What... is... that... sound..."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_stupid_story_a48714: "- What stupid story?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_surprise_93008f: "What a surprise!"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_treasure_ade691: "What treasure?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_we_done_you_c13b81: "What have we done to you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_we_get_rid_these_0bfd33: "What can we do to get rid of these nightmares?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_we_we_re_just_a2e94f: "But what can we do? We're just living here, and the monsters keep coming, so we have to live while blocking them."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_what_s_your_name_d02dee: "What? What's your name?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_whom_maybe_briashen_688109: "What? To whom? Maybe Briashen?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_business_me_if_3aa1d3: "What, do you have business with me? If not, shoo!"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_doing_here_don_8c8b3b: "What are you doing here? Don't you have things to do?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_doing_such_heav_9063eb: "What are you doing with such a heavy bag? Clear some space."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_doing_such_heav_a7a5b0: "What are you doing with such a heavy bag? Clear some out."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_doing_such_heav_cf4122: "What are you doing with such a heavy bag? Clear it out some."
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_like_7b5260: "What would you like to do?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_mean_8b5b11: "What do you mean by that?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_mean_8cf2de: "What do you mean...?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_re_going_ask_4b8a9a: "What, you're going to ask him? Do it yourself!"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_talking_about_fb4e69: "What are you talking about?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_talking_about_i_5db8e6: "What are you talking about?! I said go back after you listen to my whole story...!"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_think_adventure_aaf144: "What do you think, Adventurer? Would you trust someone so reckless with important tasks?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_think_cd736b: "What do you think?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_think_defines_h_89cdd5: "What do you think defines a human?"
  npc_override_gef_d01_i_quests_illusion_dungeons_what_you_want_know_most_4f8eed: "What do you want to know the most?"
  npc_override_gef_d01_i_quests_illusion_dungeons_whatever_reason_agitates_849470: "Whatever it is the reason that agitates the spirits of the nine-tailed foxes."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_comes_out_you_know_041962: "When it comes out, you know it's nonsense? But since Briashen came out and said that..."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_came_back_my_e7449d: "When I came back to my senses, he was gone and I couldn't move my leg."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_go_back_i_487271: "When I go back... I don't have anything, but I'll give you something in return."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_heard_his_story_34991e: "When I heard his story, I wanted to go there too... but I can't do as he explained. I am so sad."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_heard_sirood_s_e744de: "When I heard that Sirood's fishing pole was found, I jumped out."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_hunt_i_treated_8840d1: "When I hunt, I treated all humans equally because I'm a vampire. That's my rule."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_think_day_my_d80362: "When I think of that day, my heart hurts. All of a sudden, when my brothers were away..."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_i_turn_into_monster_6556e4: "When I turn into a monster, I want you to stop me from hurting them. Please, help me."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_she_brought_back_li_02b8cd: "When she was brought back to life, she was so shocked and angry that she wouldn't listen to me."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_situation_here_sort_5e4870: "When the situation here is sorted out, I will look for my older brother. He must be alone in pain and sorrow."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_there_people_worry_0a054c: "Not when there are people to worry about."
  npc_override_gef_d01_i_quests_illusion_dungeons_when_they_coming_back_cf4c53: "When are they coming back?"
  npc_override_gef_d01_i_quests_illusion_dungeons_when_we_together_large_m_3b3519: "When we were together, a large Maya suddenly appeared."
  npc_override_gef_d01_i_quests_illusion_dungeons_where_did_come_fd847e: "Where did it come from?!"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_heck_you_453627: "Where the heck are you..."
  npc_override_gef_d01_i_quests_illusion_dungeons_where_i_want_see_what_8ea598: "Where is it, I want to see it!! What's wrong??"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_oh_i_did_again_b709be: "Where? Oh, I did it again."
  npc_override_gef_d01_i_quests_illusion_dungeons_where_real_khahris_1889f7: "== Where is the real Khahris? =="
  npc_override_gef_d01_i_quests_illusion_dungeons_where_s_briashen_607f29: "Where's Briashen?"
  npc_override_gef_d01_i_quests_illusion_dungeons_where_these_guys_keep_po_950c19: "Where do these guys keep popping up?"
