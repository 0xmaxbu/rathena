  npc_override_gef_d01_i_quests_illusion_dungeons_ka_karu_hyungnim_hyungni_eddccb: "Ka.. Karu hyungnim.. hyungnim"
  npc_override_gef_d01_i_quests_illusion_dungeons_karu_disappeared_i_need_56da67: "Karu has disappeared. I need to tell Luanda about what happened."
