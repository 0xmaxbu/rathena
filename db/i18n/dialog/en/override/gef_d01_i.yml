  npc_override_gef_d01_i_quests_illusion_dungeons_whew_i_stayed_up_all_5188f7: "Whew, I stayed up all night examining the Dried Yggdrasil Leaves and the Suspicious Pentacles. I wouldn't have to, if Father Grimm left me alone."
