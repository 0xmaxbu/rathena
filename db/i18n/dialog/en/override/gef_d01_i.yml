Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_gef_d01_i_quests_illusion_dungeons_aaaaaaaaaa_182b18: "AAAAAAAAAA!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_aagh_s_attack_monsters_c_2a1d11: "Aagh!! It's an attack. Monsters are coming from all sides."
  npc_override_gef_d01_i_quests_illusion_dungeons_aargh_what_097934: "Aargh! What is this!"
  npc_override_gef_d01_i_quests_illusion_dungeons_able_meet_sirood_again_l_da6153: "To be able to meet Sirood again is like a dream."
  npc_override_gef_d01_i_quests_illusion_dungeons_about_angry_nine_tails_29b4c2: "About the angry Nine Tails."
  npc_override_gef_d01_i_quests_illusion_dungeons_about_angry_soldiers_352eb8: "About the angry Soldiers."
  npc_override_gef_d01_i_quests_illusion_dungeons_about_foxes_nightmares_c_b6a7d8: "About the foxes' nightmares coming true, I mean."
  npc_override_gef_d01_i_quests_illusion_dungeons_about_khahris_you_told_m_fe7e1d: "About Khahris you told me about, I won't forget."
  npc_override_gef_d01_i_quests_illusion_dungeons_about_man_b8bc72: "About the man."
  npc_override_gef_d01_i_quests_illusion_dungeons_about_months_ago_i_went_e17a05: "About 3 months ago... I went fishing on a rainy and windy day."
  npc_override_gef_d01_i_quests_illusion_dungeons_about_muyeon_1b9300: "Is it about Muyeon?"
  npc_override_gef_d01_i_quests_illusion_dungeons_about_teddy_bear_b52dc2: "About Teddy Bear"
  npc_override_gef_d01_i_quests_illusion_dungeons_about_those_walking_corp_942aac: "About those walking corpses, of course!"
  npc_override_gef_d01_i_quests_illusion_dungeons_accept_3e1999: "Accept."
  npc_override_gef_d01_i_quests_illusion_dungeons_accept_4fdb33: "Do not accept"
  npc_override_gef_d01_i_quests_illusion_dungeons_accept_bb54db: "Accept"
  npc_override_gef_d01_i_quests_illusion_dungeons_accept_request_70d649: "Accept request"
  npc_override_gef_d01_i_quests_illusion_dungeons_according_briashen_he_lo_20aafa: "According to Briashen, he looks like a twin to her."
  npc_override_gef_d01_i_quests_illusion_dungeons_according_bryashen_khahr_5da053: "== According to Bryashen, it was Khahris who was taken by Maya. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_according_mirko_mirko_ne_c346fd: "== But according to Mirko, Mirko has never met Khahris. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_according_my_investigati_0df843: "According to my investigation, Furious Ice Titans are as tiny as specks of dust in the air."
  npc_override_gef_d01_i_quests_illusion_dungeons_according_my_investigati_5a7900: "According to my investigation, Furious Snowiers were gentle creatures who loved to say hi to people."
  npc_override_gef_d01_i_quests_illusion_dungeons_according_my_investigati_795094: "According to my investigation, this cave used to be a subterranean kingdom, and it was entirely made of gold, like El Dorado!"
  npc_override_gef_d01_i_quests_illusion_dungeons_according_my_investigati_7e5491: "According to my investigation, Gazetis were ice giants. They were so curious about this cave that they stuck their heads into it and had their necks shattered. Now they're roaming about the cave, looking for their bodies."
  npc_override_gef_d01_i_quests_illusion_dungeons_according_my_investigati_82ac3f: "According to my investigation, these icicles have gone through a lot."
  npc_override_gef_d01_i_quests_illusion_dungeons_according_our_assessment_618737: "According to our assessment, what happens inside this place doesn't seem to ^0000cdaffect^000000 the outside world."
  npc_override_gef_d01_i_quests_illusion_dungeons_acid_a54755: "Is it Acid..."
  npc_override_gef_d01_i_quests_illusion_dungeons_acid_you_go_back_village_387bc7: "Acid! You can go back to the village for now."
  npc_override_gef_d01_i_quests_illusion_dungeons_actually_backwards_006b16: "== Was it actually backwards? =="
  npc_override_gef_d01_i_quests_illusion_dungeons_actually_i_m_busy_6f77de: "Actually, I'm busy."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_2439c4: "Adventurer?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_come_back_tom_025646: "Adventurer, come back tomorrow and hunt more Matte Drainliars for me, will you? It's so quiet without them."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_could_you_bri_c89203: "Adventurer, could you bring me some more tomorrow? I'm worried I might end up damaging all these you brought today. Even if I don't, I can always use more samples."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_could_you_get_434cb1: "Adventurer, could you get me some Clusters of Nightmares as well? I can mix them with the spores to make a paste and apply it on the wall."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_could_you_tak_ff4a60: "Adventurer, could you take me with you the next time you enter the notebook? I swear I'm not going to steal the notebook. I'm just really curious about it."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_did_you_forge_182894: "Adventurer, did you forget what I asked? I need ^0000cd10 Sticky Bloods from Matte Drainliars and 10 Mushroom Saps from Neon Mushrooms^000000. Thank you."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_did_you_good_89620c: "Adventurer. Did you have good dreams last night? I had nightmares, probably from looking at those manes all day."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_did_you_know_863498: "Adventurer, did you know these catacombs under Geffen once were quiet and filled with special energy instead of monsters?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_did_you_repor_37b3a1: "Adventurer, did you report already? Do you have something else to do here?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_did_you_take_23f091: "Adventurer, did you take care of what I asked?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_enough_time_p_432900: "Adventurer, not enough time has passed since you hunted last time. You need rest."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_friend_save_b_4f48ad: "Adventurer friend, save Briashen."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_here_ed6a86: "The adventurer is here!"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_how_did_you_f_1b0ec2: "Adventurer, how did you feel when you touched the notebook? How do you think it works?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_don_t_want_d87341: "Adventurer, I don't want to impose on your kindness, but may I ask you a favor?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_don_t_want_eacca5: "Adventurer, I don't want you to strain yourself. Why don't you go get some rest?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_haven_t_see_f1bbe2: "An adventurer I haven't seen in my dreams is helping us, so I'm sure we can change it."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_m_going_tak_011f0c: "Adventurer, I'm going to take Brother Jubilee to Sister Gem. Could you take a look around this place? I'll be back as soon as I can."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_read_notebo_16ad9c: "Adventurer, I read in the notebook that the owner used some materials to experiment on zombies. I think they're Yggdrasil leaves and some drawings."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_talk_you_se_98a048: "Adventurer, can I talk to you for a second? I want your opinion on something."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_i_ve_been_wai_dd2d22: "Adventurer, I've been waiting for you! Did you get what I asked?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_if_you_re_bus_e29367: "Adventurer, if you're not busy, would you hear us out?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_let_s_go_c6d708: "Adventurer, let's go!"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_now_radiating_e0759c: "This adventurer is now radiating a massive amount of cold energy!"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_please_bring_9ab2d2: "Adventurer, please bring me the bat hair. King, I mean, Mr. King, how much bat hair do I need?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_please_don_t_568583: "Adventurer, please? Don't I look pitiful?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_please_take_m_a9b68c: "Adventurer, please take me with you when you return ashore."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_s_flair_whoop_6e4cf7: "Adventurer's flair... Whoops!"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_see_luminous_ea805e: "Adventurer, see this luminous glow over here? It's from the shining spores you brought to me."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_showed_up_jus_da145f: "An adventurer showed up, just when I needed one!"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_bri_2e09f5: "Adventurer, thank you for bringing these to me."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_doi_76b88e: "Adventurer, thank you for doing this for us."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_fee_19e90f: "Adventurer, thank you. Feel free to come to me if you want to ^0000cdenter the notebook again^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_hel_57df47: "Adventurer, thank you for helping me study. These glowing spores don't last long. Could you come back tomorrow and get me more of them?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_try_a1900d: "Adventurer, thank you for trying to help me, but I don't want you to strain yourself. Why don't you rest for now?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_thank_you_ven_2ff374: "Adventurer, thank you for venturing into that mysterious place for us. It'll be greatly appreciated if you visit my colleagues there and bring news from them to me sometimes."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_wait_339cc1: "Adventurer, wait!"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_waiting_you_460096: "An adventurer is waiting for you."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_waiting_you_bda40b: "Adventurer is waiting for you"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_welcome_back_5896ed: "Adventurer, welcome back! I've been waiting for you for so long! Did you bring the things I asked? Come on, let me see them!"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_welcome_back_7bbeaf: "Adventurer, welcome back."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_welcome_back_cc7f70: "Adventurer, welcome back. Could you help me today as usual?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_welcome_back_ea95c6: "Adventurer, welcome back!"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_busy_bacf69: "Adventurer, are you busy?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_going_get_0fecef: "Adventurer, are you going to get the bat hair for him? Good, that means you'll take care of those Matte Drainliars. Their flapping their wings keep me awake at night."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_know_wher_4de3e9: "Adventurer, do you know where the deepest part of the sea is?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_leaving_n_33b384: "Adventurer, are you leaving now?"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_light_my_11fcbc: "Adventurer! You are the light of my life!"
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_re_back_a_e32d25: "Adventurer, you're back already."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_really_cu_259249: "Adventurer, you are really curious about everything."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_took_care_13e5d1: "Adventurer, you took care of them all. Thank you. They will also thank you from Heaven."
  npc_override_gef_d01_i_quests_illusion_dungeons_adventurer_you_want_ente_756294: "Adventurer, do you want to enter the notebook?"
  npc_override_gef_d01_i_quests_illusion_dungeons_after_being_hurt_like_he_c95af2: "But after being hurt like this... He said he needed to rest for a while, but he must have gone into that anthill on his own."
  npc_override_gef_d01_i_quests_illusion_dungeons_after_hellish_dream_i_sa_286eb2: "After the hellish dream, I saw myself recording the day's events on a mural in a cave."
  npc_override_gef_d01_i_quests_illusion_dungeons_after_i_caught_my_first_9356b5: "After I caught my first fish, I tripped and fell into the water while trying to get it out with a fishing pole."
  npc_override_gef_d01_i_quests_illusion_dungeons_after_i_could_stay_littl_064f44: "After that... I could stay a little longer."
  npc_override_gef_d01_i_quests_illusion_dungeons_after_i_going_stop_geolo_22ee16: "After that, I was going to stop the geological exploration of this side for a while and organize a new expedition."
  npc_override_gef_d01_i_quests_illusion_dungeons_after_i_handed_pieces_hi_d32eac: "After I handed the pieces to him...."
  npc_override_gef_d01_i_quests_illusion_dungeons_after_months_555b7a: "After 3 months!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_after_we_got_together_ra_85263a: "After that, we got together and ran everywhere to find Sirood, but there was no result, and we were about to give up."
  npc_override_gef_d01_i_quests_illusion_dungeons_after_we_waited_outside_1aeae2: "After that, we waited outside because the exploration results were good for going alone,"
  npc_override_gef_d01_i_quests_illusion_dungeons_again_i_forgot_again_c11848: "......Again ...I forgot again....."
  npc_override_gef_d01_i_quests_illusion_dungeons_again_stranger_74028c: "Again... Stranger."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_971301: "Ah..."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_adventurer_good_see_y_c51f59: "Ah, Adventurer. Good to see you again! Dracula is doing better, though he sleeps all day."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_ah_ah_bda2aa: "Ah! Ah! Ah!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_ah_nice_smell_meat_ae37e9: "Ah..ah.. The nice smell of meat."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_ah_right_should_take_ba993c: "Ah, ah... that, right? That should take precedence."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_ah_then_hey_adventure_f98f02: "Ah, ah... then... hey adventurer!! I'm sorry for the first meeting, but can I ask you a favor?? We can't get out of here in Izlude..."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_come_think_e66f27: "Ah... Come to think of it."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_come_think_you_rememb_fbf728: "Ah! Come to think of it, do you remember the first time we met? Didn't I say I was used to being an adventurer?"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_cough_cough_00bc18: "Ah! Cough Cough!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_did_you_notice_yes_e5a509: "Ah! Did you notice? Yes, my name is Luanda too. The village elders say..."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_f5ad63: "...Ah..."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_fox_lady_9799e3: "Ah... The fox lady..."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_going_back_3d8071: "Ah? Not going back?"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_i_m_going_anymore_bb7270: "Ah, I'm not going to do this anymore. Tell that to the old geezers!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_i_see_i_ve_848a95: "Ah... I see, I've never heard of a trench before."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_junghee_4cf421: "Ah, Junghee!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_karu_my_husband_sa_8ab9d1: "Ah.. Karu.. My husband.. Sa.."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_s_relief_i_d_5b0171: "Ah, that's a relief... I'd appreciate it if you could take me with you when you return ashore."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_sister_marina_help_yo_6bd49d: "Ah, Sister Marina! Help! You've got to help me if you don't want to feel guilt over my death later!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_there_you_how_place_e00f25: "Ah, there you are! How was that place?"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_today_must_my_lucky_35750b: "Ah, today must be my lucky day!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_watch_your_mind_locat_dc9339: "Ah! Watch your mind. The location is in the middle of the battlefield, so I installed it in the corner for safety reasons."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_welcome_adventurer_c60f5a: "Ah, welcome, adventurer!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_when_peaceful_rest_7a1a4c: "Ah... When will the peaceful rest..."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_yes_333f97: "Ah... yes. {0}."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_yes_65f3f8: "Ah... yes.{0}."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_you_look_pretty_stron_bb0331: "Ah~ You look pretty strong. Thank goodness."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_you_re_here_3667d3: "Ah you're here!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_you_re_here_f7cc32: "Ah, you're here!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_you_re_one_introduced_8cbccf: "Ah, you're the one introduced by Raket. I've been waiting for you."
  npc_override_gef_d01_i_quests_illusion_dungeons_ah_you_stranger_i_saw_9617d5: "Ah! You? The stranger I saw last time!! Are you still here? I'm sure I'll..."
  npc_override_gef_d01_i_quests_illusion_dungeons_ahah_i_m_full_i_2e8be7: "Ahah, I'm full. I'm not die now. I'm full."
  npc_override_gef_d01_i_quests_illusion_dungeons_ahhhhhhhhhhhhhhhhhhhhhhh_4e29f9: "Ahhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh..."
  npc_override_gef_d01_i_quests_illusion_dungeons_air_brimming_strange_ene_a664cf: "- The air is brimming with strange energy. -"
  npc_override_gef_d01_i_quests_illusion_dungeons_air_here_worse_than_mine_116ff1: "The air here is worse than the mine... Cough"
  npc_override_gef_d01_i_quests_illusion_dungeons_alive_1ec8bf: "Alive!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_all_b2ff06: "Not at all."
  npc_override_gef_d01_i_quests_illusion_dungeons_all_dead_must_return_ear_ab1839: "All the dead must return to the earth."
  npc_override_gef_d01_i_quests_illusion_dungeons_all_he_wanted_protect_ot_29b1e8: "All he wanted to do was protect others, and he died without fulfilling that wish."
  npc_override_gef_d01_i_quests_illusion_dungeons_all_people_here_immigran_fa0ee6: "All the people here are immigrants and settlers."
  npc_override_gef_d01_i_quests_illusion_dungeons_all_potions_i_found_didn_2ae760: "All the potions I found didn't help improve my weak constitution. All they do is boost strength that's already there."
  npc_override_gef_d01_i_quests_illusion_dungeons_all_quests_quest_board_b_4e7b8e: "All quests on the quest board have been received."
  npc_override_gef_d01_i_quests_illusion_dungeons_all_residents_here_spiri_21ad6e: "All the residents here are spirits bound by the burden of resentment. When you're dead, obsessed with something you desperately want, and you'll always do the same thing without realizing it.."
  npc_override_gef_d01_i_quests_illusion_dungeons_all_three_disappeared_mi_a80e2b: "All three disappeared in the middle of a conversation."
  npc_override_gef_d01_i_quests_illusion_dungeons_all_time_effort_807d60: "All the time and effort..."
  npc_override_gef_d01_i_quests_illusion_dungeons_all_vampires_same_we_re_6baa80: "Not all vampires are the same. We're different from her. By the way, why are you still here? Dracula doesn't need you anymore."
  npc_override_gef_d01_i_quests_illusion_dungeons_all_you_no_longer_1df83d: "All.. you no longer.."
  npc_override_gef_d01_i_quests_illusion_dungeons_alright_then_i_d_better_20ff21: "Alright, then I'd better go get some rest."
  npc_override_gef_d01_i_quests_illusion_dungeons_also_ants_super_powerful_1fd114: "And also, the ants were super powerful!"
  npc_override_gef_d01_i_quests_illusion_dungeons_also_could_you_hunt_zomb_f4b6a2: "Also, could you hunt 5 zombies of each kind for that scowling priest over there? Thanks!"
  npc_override_gef_d01_i_quests_illusion_dungeons_also_i_ve_sensed_evil_600d2a: "Also, I've sensed an evil presence. Please be careful."
  npc_override_gef_d01_i_quests_illusion_dungeons_also_please_hunt_zombies_838f30: "Also, please hunt 5 zombies of each kind for that nagging priest."
  npc_override_gef_d01_i_quests_illusion_dungeons_also_there_s_something_o_99e0ad: "Also, there's something off about people and foxes here, and I saw a strange-looking mage among them."
  npc_override_gef_d01_i_quests_illusion_dungeons_am_i_dead_am_i_f8c517: "Am I dead... or am I alive..."
  npc_override_gef_d01_i_quests_illusion_dungeons_am_i_dull_efd5c8: "Am I dull...?"
  npc_override_gef_d01_i_quests_illusion_dungeons_am_i_hurt_3f521e: "Am I hurt?"
  npc_override_gef_d01_i_quests_illusion_dungeons_am_i_khahris_1e0ff1: "Am I... Khahris?"
  npc_override_gef_d01_i_quests_illusion_dungeons_am_i_person_2c3947: "Am I... a person?"
  npc_override_gef_d01_i_quests_illusion_dungeons_amount_i_think_i_create_fe6f3e: "With this amount, I think I can create a vortex of fissures that normal people can enter. You can pass it to me."
  npc_override_gef_d01_i_quests_illusion_dungeons_amount_okay_057ece: "Is this amount okay?"
  npc_override_gef_d01_i_quests_illusion_dungeons_and_dbaaae: "10 {0}, {1}, and {2}!"
  npc_override_gef_d01_i_quests_illusion_dungeons_anymore_9ce0a8: "Not anymore?"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_even_though_s_str_42c728: "Anyway, even though it's strangely dark, it's like being here and not here... perception is peeling off from the body..."
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_i_need_sticky_blo_ae98fa: "Anyway, I need ^0000cd10 Sticky Bloods from Matte Drainliars and 10 Mushroom Saps from Neon Mushrooms^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_investigation_has_d3346d: "Anyway, the investigation hasn't been completed yet, so we're nervous..."
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_please_take_care_ac35a2: "Anyway, please take care of the ^0000FFWizard of the Truth^000000 in this place."
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_second_floor_road_563f62: "Anyway, this is the second floor, and the road to the first floor is over there, isn't it?"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_thank_you_doing_m_786326: "Anyway, thank you for doing this for me!"
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_these_mages_after_f55e52: "Anyway, these mages, after they built the Geffen Tower, took notice of the blasphemous creatures that sometimes appeared in the catacombs."
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_they_re_so_old_d00564: "Anyway they're so old and poorly preserved that they easily crumble to dust. I couldn't finish my research."
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_we_met_here_we_9c982f: "Anyway, we met here. We were amazed at how much alike we are."
  npc_override_gef_d01_i_quests_illusion_dungeons_anyway_you_heard_aylvar_702116: "Anyway, have you heard from Aylvar? I was hesitant when I heard."
  npc_override_gef_d01_i_quests_illusion_dungeons_archeologist_leiphen_cou_47e02d: " - ^424242Archeologist Leiphen couldn't eat... But according to Narin, she will be happy. I can only get the {0} in here.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_archeologist_leiphen_hel_615016: " - ^424242Archeologist Leiphen held his breath and nodded.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_aren_t_ants_colonies_659b28: "Aren't ants colonies?"
  npc_override_gef_d01_i_quests_illusion_dungeons_aren_t_they_creepy_every_d2d71f: "Aren't they creepy? Every time I look at them, they look like they're mouthing, "
  npc_override_gef_d01_i_quests_illusion_dungeons_aren_t_those_just_teddy_38ddf7: "Aren't those just Teddy Bears?"
  npc_override_gef_d01_i_quests_illusion_dungeons_argh_i_don_t_ever_f33ea9: "Argh! I don't ever want to see them again! Let's go!"
  npc_override_gef_d01_i_quests_illusion_dungeons_argh_i_t_believe_you_e221dd: "Argh, I can't believe you threw yourself in the middle of that! This is why I can't leave you alone!"
  npc_override_gef_d01_i_quests_illusion_dungeons_argh_you_re_going_burn_8bbc4f: "Argh, you're going to burn us to death!"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_briashen_asked_you_li_603345: "As Briashen asked, would you like to go downstairs to help him?"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_exchange_i_took_how_fd8195: " - ^424242As exchange, I took the {0}. How could he have become obsessed with such worthless garbage without seeing anything really valuable?^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_expected_cough_cough_ce9042: "As expected...cough cough...what happened?"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_expected_i_don_t_616da8: "As expected, I don't think it was a bad feeling. I really can't believe it. An adventurer who met me in the past..."
  npc_override_gef_d01_i_quests_illusion_dungeons_as_far_as_i_remember_b6504d: "As far as I remember, nothing like this has ever happened before. If we want to figure this out, we're on our own."
  npc_override_gef_d01_i_quests_illusion_dungeons_as_girl_who_there_told_98aaba: " - ^424242As the girl who was there told me, I squeezed the piece of the turtle shell, I felt the wind blowing my hair again.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_as_i_said_before_some_327b2a: "As I said before, some people may see falsehoods, but..."
  npc_override_gef_d01_i_quests_illusion_dungeons_as_i_told_you_i_e80fe2: "As I told you, I'm not going to leave until I found the secret of this place."
  npc_override_gef_d01_i_quests_illusion_dungeons_as_i_woke_up_i_851a98: "As I woke up, I felt the sea breeze from Alberta's harbor... In my hands, two pieces of this turtle shell."
  npc_override_gef_d01_i_quests_illusion_dungeons_as_if_wasn_t_enough_b12470: "And as if that wasn't enough, those mages used their magic and replicated the reanimating process."
  npc_override_gef_d01_i_quests_illusion_dungeons_as_long_as_maya_doesn_0bacb6: "As long as Maya doesn't come, I'm fine..."
  npc_override_gef_d01_i_quests_illusion_dungeons_as_long_as_maya_doesn_93f359: "As long as Maya doesn't come, I'm fine."
  npc_override_gef_d01_i_quests_illusion_dungeons_as_she_told_me_there_db4522: " - ^424242As she told me, there are others... but he doesn't look like Archeologist Leiphen.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_as_you_guess_many_people_1bfc7e: "As you can guess many people were buried with it, and their spirits are hunting the cave."
  npc_override_gef_d01_i_quests_illusion_dungeons_as_you_know_i_live_558de6: "As you know, I live on that fake blood that I make with the ingredients I find around here. I'm thinking I'll make some more for Dracula as well."
  npc_override_gef_d01_i_quests_illusion_dungeons_as_you_know_memory_perce_bc3e61: "As you know, memory and perception are distorted in there. You seem to be fine, but"
  npc_override_gef_d01_i_quests_illusion_dungeons_as_you_know_we_re_14733f: "As you know, we're here to keep an eye on them."
  npc_override_gef_d01_i_quests_illusion_dungeons_as_you_see_there_traces_fff4c6: "As you can see, there are traces of civilization in these depths, but everyone here was an outsider."
  npc_override_gef_d01_i_quests_illusion_dungeons_ask_young_scholar_there_64de9a: "Ask the young scholar there about Muyeon's whereabouts."
  npc_override_gef_d01_i_quests_illusion_dungeons_asudem_2dfc3f: "Asudem!!!!!!!!!!!!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_awesome_5fc348: "Awesome!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_aww_a08236: "................Aww.."
  npc_override_gef_d01_i_quests_illusion_dungeons_aww_asudem_why_why_my_97375b: "Aww! Asudem, why? Why? My... how did I find you..."
  npc_override_gef_d01_i_quests_illusion_dungeons_aww_my_wounds_fully_heal_c0d895: "Aww, my wounds are fully healed, but I'm still in pain."
  npc_override_gef_d01_i_quests_illusion_dungeons_aylvar_right_about_place_fad981: "...Aylvar was right about this place."
  npc_override_gef_d01_i_quests_illusion_dungeons_back_alberta_d5bf09: "Back to Alberta."
  npc_override_gef_d01_i_quests_illusion_dungeons_back_then_only_couple_mo_000209: "Back then, only a couple of monsters showed up once every decade or so."
  npc_override_gef_d01_i_quests_illusion_dungeons_back_when_their_village_6e47ae: "Back when their village was buried.."
  npc_override_gef_d01_i_quests_illusion_dungeons_bad_luck_follows_me_wher_2cbb7c: "Bad luck follows me wherever I go. Bomi even made me a lucky charm, but it didn't work."
  npc_override_gef_d01_i_quests_illusion_dungeons_bat_blood_she_drinks_som_9afbc4: "The bat blood she drinks sometimes causes her to go out of her mind. She calms down after a while, but if the people from the Church see her in that vulnerable state, they will try to kill her."
  npc_override_gef_d01_i_quests_illusion_dungeons_bats_catacombs_drink_blo_9a8cc1: "The bats in the catacombs drink blood from the zombies, probably because there's nothing else to eat."
  npc_override_gef_d01_i_quests_illusion_dungeons_beats_me_c2fb68: "Beats me."
  npc_override_gef_d01_i_quests_illusion_dungeons_because_bats_stealthy_th_0ae2a0: "Because bats are stealthy, and they can fly. Oh, speaking of which, did you know the short hair of Matte Drainliars is used for making cloaking capes?"
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_couldn_t_eithe_2c5427: "Because I couldn't do it, either."
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_didn_t_need_e512e1: "Because I didn't need to."
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_let_you_i_11ac96: "Because I let you. And I'm letting you breathe not because you're worth living, but because I'm too lazy to kill you."
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_m_monster_i_c7c184: "Because I'm a monster. I belong here."
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_m_vampire_b06aa4: "Because I'm a vampire."
  npc_override_gef_d01_i_quests_illusion_dungeons_because_i_ve_lost_intere_7fdf0b: "Because I've lost interest?!"
  npc_override_gef_d01_i_quests_illusion_dungeons_become_smarter_b10735: "To become smarter?"
  npc_override_gef_d01_i_quests_illusion_dungeons_before_my_eyes_completel_4c909d: " - ^424242Before my eyes were completely dark, my cheeks felt the cooler air from the cave....^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_before_you_get_danger_ge_44815d: "Before you get in danger, get the person you were looking for and leave."
  npc_override_gef_d01_i_quests_illusion_dungeons_beginning_tragedy_49ae4f: "That was the beginning of the tragedy."
  npc_override_gef_d01_i_quests_illusion_dungeons_berome_21a4fc: "Berome"
  npc_override_gef_d01_i_quests_illusion_dungeons_besides_last_person_you_3381ce: "Besides, the last person you met was... Vitata?"
  npc_override_gef_d01_i_quests_illusion_dungeons_betrayed_her_hah_where_s_31bade: "Betrayed her? Hah? Where is she? He should've just let her die!"
  npc_override_gef_d01_i_quests_illusion_dungeons_better_start_introducing_f62e06: "It would be better to start introducing myself. I am Narin. ^0000CDOld Ghost.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_beyond_door_appears_blac_1feffd: " - ^424242Beyond the door, it appears black, and nothing seems to exist. A reddish glow is floating in front of the black sky. A nervous looking girl appears.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_biting_nails_fingertips_429f10: " - ^424242Biting nails and the fingertips are messed up.....^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_bleeding_should_stopped_934548: "== The bleeding should have stopped, but excessive movement will open the wound. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_away_i_ll_just_a4aba5: "Bomi is away. I'll just leave these here."
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_away_she_left_note_e1f7ff: "Bomi is away. She has left a note."
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_gathering_her_thoug_4f4f7a: "Bomi is gathering her thoughts. I should talk to her later."
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_i_ll_see_you_ca896f: "Bomi, I'll see you when I get better."
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_saved_me_she_fed_ab4404: "Bomi saved me. She fed me her blood, so I could regain my strength. I'm not a living being, but that day, she gave me new life."
  npc_override_gef_d01_i_quests_illusion_dungeons_bomi_wait_you_re_bomi_3e77b5: "Bomi? Wait, you're that Bomi?"
  npc_override_gef_d01_i_quests_illusion_dungeons_book_sustained_its_owner_dafe56: "This book is sustained with its owner's spiritual energy, and it's pulling those who gaze upon it into ^0000cdthe world inside it^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_bounced_22c7b4: "It bounced"
  npc_override_gef_d01_i_quests_illusion_dungeons_brave_newly_born_soldier_7cbdbe: "Brave newly born soldiers!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_0efa2b: "Briashen..."
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_all_right_46b857: "Is Briashen all right?"
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_asked_me_find_s_07fc02: "Briashen asked me to find someone who looked just like her and was a ranger."
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_real_ebb6fd: "Is that Briashen real?"
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_s_dangerous_2153d7: "Briashen, that's dangerous!"
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_sat_down_d59ddc: "== Briashen sat down. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_strongest_among_9850f1: "Briashen, the strongest among us, went on a patrol, but it seems that the adventurers who will come around here are not at the level to form an expedition."
  npc_override_gef_d01_i_quests_illusion_dungeons_briashen_who_searching_m_fb33f3: "== Briashen, who was searching for memories, was confused. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_briefly_explained_what_b_9501ed: "== Briefly explained what Briashen said. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_bright_beautiful_figure_1544bd: "This bright and beautiful figure..."
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_antoine_i_go_we_5eda3d: "Brother Antoine and I will go. We're trained to fight. You are not."
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_antoine_you_stay_fd5ee7: "Brother Antoine, you stay here. Sister Marina and I will go. Do either of you have a problem with that?"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_i_don_t_think_23b6ae: "Brother, I don't think you're dangerous. This isn't the time. Brother, let's go first."
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_i_m_all_same_176a7f: "Brother.. I'm all the same.."
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_jojo_asked_me_ne_f41778: "Brother Jojo asked me to never let you touch the book. Do you not remember that?"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_jojo_you_re_safe_93ceda: "Brother Jojo! You're safe!"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_jubilee_79dd17: "Brother Jubilee?"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_jubilee_left_tre_dd8387: "Brother Jubilee has left to treat his wounds, but Brother Jojo hasn't returned. I really hope he's safe."
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_jubilee_you_thin_ff7e74: "Brother Jubilee, do you think you can move?"
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_karu_lives_separ_707872: "Brother Karu lives separately from his sister-in-law, and we still live together, but I don't think he cared too much about his sister."
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_s_big_deal_ma_b4b88d: "Brother! It's a big deal. Ma.. The smell of blood is coming from the village."
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_you_ready_you_le_658f21: "Brother? Are you ready? Are you leaving soon? Time is running out."
  npc_override_gef_d01_i_quests_illusion_dungeons_brother_you_still_here_s_7b7f73: "Brother... Are you still here? The spell will be gone after a day, please come back after dawn."
  npc_override_gef_d01_i_quests_illusion_dungeons_brothers_disappeared_qui_501722: "The brothers disappeared quickly. I have to tell Luanda what happened."
  npc_override_gef_d01_i_quests_illusion_dungeons_brothers_looks_like_hunt_370fe7: "Brothers, it looks like the hunt went well this time."
  npc_override_gef_d01_i_quests_illusion_dungeons_brothers_sisters_we_need_913f9b: "Brothers. Sisters. We need to talk."
  npc_override_gef_d01_i_quests_illusion_dungeons_brothers_there_someone_o_1a74f3: "Brothers, there is someone over there. A stranger?"
  npc_override_gef_d01_i_quests_illusion_dungeons_call_me_back_when_you_61d912: "Call me back when you're ready"
  npc_override_gef_d01_i_quests_illusion_dungeons_cancel_77dfd2: "Cancel"
  npc_override_gef_d01_i_quests_illusion_dungeons_cancel_c0b2bd: "Do not cancel"
  npc_override_gef_d01_i_quests_illusion_dungeons_careful_fa18ab: "Be careful."
  npc_override_gef_d01_i_quests_illusion_dungeons_careful_something_bad_ha_08a1c2: "Be careful, something bad is happening inside."
  npc_override_gef_d01_i_quests_illusion_dungeons_case_bahia_trench_scient_a83216: "But in the case of the Bahia Trench, scientists have calculated that scientifically, no life can exist because it is so incredibly deep."
  npc_override_gef_d01_i_quests_illusion_dungeons_case_karoo_hyung_he_abil_88e6b4: "In the case of Karoo-hyung, he has the ability to see accurately even from a distance.."
  npc_override_gef_d01_i_quests_illusion_dungeons_case_you_forgotten_you_k_68d4b6: "In case you have forgotten, do you know how you're still standing there, breathing?"
  npc_override_gef_d01_i_quests_illusion_dungeons_caught_i_got_caught_cbfd0c: "Caught, I got caught!"
  npc_override_gef_d01_i_quests_illusion_dungeons_certainly_i_don_t_know_069942: "Certainly!! I don't know, but would you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_chattering_his_teeth_c_c_ccf233: "*Chattering his teeth* C-c-c-c-cold. Get off me! You're too cold!"
  npc_override_gef_d01_i_quests_illusion_dungeons_cheap_where_twins_they_s_35e956: "Cheap... where are the twins? They should be there..."
  npc_override_gef_d01_i_quests_illusion_dungeons_chief_559232: "Chief"
  npc_override_gef_d01_i_quests_illusion_dungeons_chief_what_about_village_7e5859: "Chief, what about the villagers captured by the monsters? They already..."
  npc_override_gef_d01_i_quests_illusion_dungeons_chief_who_worried_about_937240: "The Chief who is worried about me has disappeared. I have to tell Mr. Luanda what I've been through."
  npc_override_gef_d01_i_quests_illusion_dungeons_chunghae_having_problem_07bdd8: "Chunghae is having a problem investigating this place because of the angry foxes."
  npc_override_gef_d01_i_quests_illusion_dungeons_chunghae_s_almost_done_i_ace59a: "Chunghae's almost done investigating this place. I'd better get ready to leave."
  npc_override_gef_d01_i_quests_illusion_dungeons_chunghae_said_we_re_insi_246b1c: "Chunghae said we're inside a Moonlight Flower's nightmare."
  npc_override_gef_d01_i_quests_illusion_dungeons_chunghae_what_you_doing_d6394e: "Chunghae, what are you doing out here?"
  npc_override_gef_d01_i_quests_illusion_dungeons_ci_974a20: "CI...."
  npc_override_gef_d01_i_quests_illusion_dungeons_cloaking_capes_thieves_t_a11bef: "Cloaking capes? Thieves and their ilk must love those."
  npc_override_gef_d01_i_quests_illusion_dungeons_closeness_so_strong_you_04c92c: "A closeness so strong that you can't come back because you're possessed..."
  npc_override_gef_d01_i_quests_illusion_dungeons_colleague_briashen_spoke_291fa6: "The colleague Briashen spoke of was Khahris,"
  npc_override_gef_d01_i_quests_illusion_dungeons_collect_900032: "and collect 20 ^0000FF{0}^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_come_0b3a3d: "Come on..."
  npc_override_gef_d01_i_quests_illusion_dungeons_come_back_10c51c: "and come back?"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_back_me_when_you_4561a2: "Come back to me when you've collected all the essences!"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_i_only_trying_help_c077f5: "Come on, I was only trying to help!"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_let_s_go_yay_5fa21b: "Come on! Let's go~~!! Yay!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_s_me_mojo_don_c2dfd0: "Come on, it's me, Mojo. Don't you trust me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_come_think_i_feel_like_fd71d5: "Come to think of it, I feel like I can breathe easier!"
  npc_override_gef_d01_i_quests_illusion_dungeons_coming_back_original_sto_d1bcda: "Coming back to the original story, the reason I'm painting the mural is because one day I dreamed of a village burning down."
  npc_override_gef_d01_i_quests_illusion_dungeons_composition_normal_sea_w_699051: "The composition of normal sea water and deep sea water is almost the same. But the only difference is the deep sea of Bahia Trench."
  npc_override_gef_d01_i_quests_illusion_dungeons_consciousness_became_far_4658ca: " - ^424242The consciousness became far away, and the salty, slightly fishy smell of Alberta Harbor tickled my nose.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_content_notebook_isn_t_w_85450d: "The content of this notebook isn't what causes me alarm. Didn't you detect some ^0000cdstrange energy^000000 when you touch it?"
  npc_override_gef_d01_i_quests_illusion_dungeons_corpse_fine_please_6c0ec5: "A corpse is fine, please."
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_745493: "...cough..."
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_949484: "Cough..."
