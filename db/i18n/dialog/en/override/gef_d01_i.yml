  npc_override_gef_d01_i_quests_illusion_dungeons_missing_priest_called_ju_033749: "The missing priest is called ^0000cdJubilee^000000 and the wizard is ^0000cdJojo^000000. They're the typical priest and wizard. You won't miss them."
