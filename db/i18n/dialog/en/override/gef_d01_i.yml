  npc_override_gef_d01_i_quests_illusion_dungeons_you_t_bring_anything_wor_e9d488: "You can't bring anything from the world inside the book. If you do, I'll get rid of them."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_t_go_back_until_6c82d9: "You can't go back until you find him"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_t_just_tell_him_59dc09: "You can't just tell him that. Adventurer, you know what kind of place this is, don't you? We're in a hurry, so let me explain the situation to you quickly."
