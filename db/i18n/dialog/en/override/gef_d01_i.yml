  npc_override_gef_d01_i_quests_illusion_dungeons_mm_i_feeling_something_s_be13b3: "Mm, I have a feeling something suspicious is about to happen."
  npc_override_gef_d01_i_quests_illusion_dungeons_mm_i_m_sure_yet_b41202: "Mm, I'm not sure yet. Do you mind if I ask you for more later? Okay, then please bring me ^0000cd10 Dried Yggdrasil Leaves and 10 Suspicious Pentacles^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_mm_isn_t_enough_please_5894c5: "Mm, this isn't enough. Please bring me ^0000cd10 Dried Yggdrasil Leaves and 10 Suspicious Pentacles^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_mm_you_re_adventurer_wha_24d6cd: "Mm, you're an adventurer. What brings you to me? I'm sorry, I'm kind of busy. Could you talk to the priest over there instead?"
