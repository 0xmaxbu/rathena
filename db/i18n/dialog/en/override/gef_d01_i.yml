  npc_override_gef_d01_i_quests_illusion_dungeons_menu_please_3f9e21: "Please exterminate ^0000cdRestless Dead^000000. There are ^0000cdthree different kinds: Small, Fast, and Big. Please exterminate 10 each.^000000."
