  npc_override_gef_d01_i_quests_illusion_dungeons_god_bless_you_0c7c05: "God bless you."
  npc_override_gef_d01_i_quests_illusion_dungeons_going_back_f0d7bf: "......Not going to back?"
  npc_override_gef_d01_i_quests_illusion_dungeons_going_up_now_182451: "Not going up now"
  npc_override_gef_d01_i_quests_illusion_dungeons_good_4d82cf: "This is not good."
  npc_override_gef_d01_i_quests_illusion_dungeons_good_bdc919: "Good."
  npc_override_gef_d01_i_quests_illusion_dungeons_good_i_don_t_know_0bff95: "Good. I don't know his name and where he is, but I can guess."
  npc_override_gef_d01_i_quests_illusion_dungeons_good_job_2dc47c: "Good Job."
  npc_override_gef_d01_i_quests_illusion_dungeons_good_job_6222cc: "Good job!"
  npc_override_gef_d01_i_quests_illusion_dungeons_good_luck_703764: "Good luck."
  npc_override_gef_d01_i_quests_illusion_dungeons_good_luck_investigating_e9a88c: "Good luck investigating the phenomenon with Chunghae!"
  npc_override_gef_d01_i_quests_illusion_dungeons_good_night_s_sleep_come_e3caf3: "Have a good night's sleep, and come back after dawn."
  npc_override_gef_d01_i_quests_illusion_dungeons_gosh_you_re_so_stubborn_995d19: "Gosh, you're so stubborn. Feed him. I'll keep them at bay."
  npc_override_gef_d01_i_quests_illusion_dungeons_got_a049d0: "...got it?"
  npc_override_gef_d01_i_quests_illusion_dungeons_got_buried_them_no_wonde_5f9950: "and got buried with them. No wonder they're so angry."
  npc_override_gef_d01_i_quests_illusion_dungeons_got_i_thinking_now_i_9c0a90: "Got it. I was thinking, now that I'm  here, I might as well help you while I can. I'm glad that I can. I'll be back."
  npc_override_gef_d01_i_quests_illusion_dungeons_grr_let_me_go_enough_af9ee4: "Grr, let me go! Enough is enough!"
  npc_override_gef_d01_i_quests_illusion_dungeons_grr_why_you_so_evil_7af70e: "Grr, why are you so evil?"
