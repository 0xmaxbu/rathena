  npc_override_gef_d01_i_quests_illusion_dungeons_let_s_wait_muyeon_now_a99048: "Let's wait for ^0000FFMuyeon^000000 now."
  npc_override_gef_d01_i_quests_illusion_dungeons_let_us_help_other_souls_e4d659: "Let us help other souls here like you, Narin, resolve themselves."
  npc_override_gef_d01_i_quests_illusion_dungeons_level_higher_quest_d8fa92: "== This is a level 160 or higher quest =="
  npc_override_gef_d01_i_quests_illusion_dungeons_level_over_quest_0ffebe: " - ^0000CDLevel 150 and over can do this quest.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_life_death_e6a8b2: "That is, life and death..."
