  npc_override_gef_d01_i_quests_illusion_dungeons_land_3f2545: "This land!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_last_entry_i_took_my_3cdfdd: "That was the last entry. I took my hand off the notebook. Father Grimm closed the notebook."
  npc_override_gef_d01_i_quests_illusion_dungeons_later_56e2f5: "Later"
  npc_override_gef_d01_i_quests_illusion_dungeons_leave_d1a78d: "Leave this!"
  npc_override_gef_d01_i_quests_illusion_dungeons_leave_e7c7e7: "Leave it"
  npc_override_gef_d01_i_quests_illusion_dungeons_leave_them_they_saved_jo_fd1214: "Leave them be. They saved Jojo."
  npc_override_gef_d01_i_quests_illusion_dungeons_legend_says_nine_tailed_865f07: "Legend says a nine-tailed fox gained enlightment and became a sacred creature, and that Moonlight Flowers have descended from her.  I think it's a story worth looking into."
  npc_override_gef_d01_i_quests_illusion_dungeons_let_go_62fdff: "Let go!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_check_other_point_4b80c7: " - ^424242Let me check the other point. Let's go...^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_go_2d6d8d: "Let me go!"
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_go_there_again_84bb59: "Let me go there again."
  npc_override_gef_d01_i_quests_illusion_dungeons_let_me_hear_841e0d: "Let me hear it."
