  npc_override_gef_d01_i_quests_illusion_dungeons_long_live_emperor_79781e: "Long live the Emperor!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_long_story_short_she_got_da12c9: "Long story short, she got caught in the crossfire. She was dying and I panicked."
  npc_override_gef_d01_i_quests_illusion_dungeons_look_i_m_going_experimen_328c10: "Look, I'm not going to experiment on the zombies. I just want to take a look at the materials she used."
  npc_override_gef_d01_i_quests_illusion_dungeons_look_place_952126: "Look at this place!"
  npc_override_gef_d01_i_quests_illusion_dungeons_look_those_dashing_soldi_716dd3: "Look at those dashing soldiers over there!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_look_what_we_ve_got_60723d: "Look what we've got here. Did you forget what I asked? I told you to ^0000cdhunt 10 Matte Drainliars and bring 20 Short Bat Hairs^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_looked_real_i_almost_foo_9d8789: "It looked real. I almost fooled myself."
  npc_override_gef_d01_i_quests_illusion_dungeons_looking_closely_fishing_27c633: "- But looking closely at the fishing rod, I feel something different. This wooden fishing rod has been submerged in water for 3 months, but it still looks the same, and I can see a bit of shiny gloss... -"
  npc_override_gef_d01_i_quests_illusion_dungeons_looking_doesn_t_make_sen_cc6bd5: "Looking at it, it doesn't make sense."
  npc_override_gef_d01_i_quests_illusion_dungeons_looking_into_bottle_jerr_d1bf9f: "- Looking into the bottle Jerrymon is holding, I can clearly see the shape of the vortex. - "
  npc_override_gef_d01_i_quests_illusion_dungeons_looking_second_expressio_d7bb8e: "Looking at the second expression, you can see that the stranger has something to say? Youngest, let's go first."
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_exactly_like_brias_bf23c4: "Looks exactly like Briashen"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_exactly_like_ruine_6cff0b: "It looks exactly like the ruined village we were in a moments ago, and yet... it's different!"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_he_s_been_e76631: "Looks like he's been infested with Mao. Maybe because of his abilities, he's often swayed by other people's emotions..."
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_i_interrupted_e55e7e: "It looks like I interrupted the couple's date. I need to tell Luanda what happened."
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_i_really_t_ba4af5: "Looks like I really can't remember now."
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_message_i_sen_b804f0: "It looks like the message I sent reached Izlude, I'm so glad..."
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_rat_lurked_in_d7a0f1: "It looks like a rat has lurked into the sacred assembly."
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_stranger_if_i_b92d8c: "Looks like a stranger? If I remember correctly, I haven't seen that face in the neighborhood."
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_we_got_caught_7812e1: "Looks like we got caught?!"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_we_only_need_e1ed54: "It looks like we only need about 10 ^4d4dff{0}^000000 to send Sirood back ashore."
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_like_you_ve_finish_e6f40c: "Looks like you've finished your business. Would you like to move to Izlude?"
  npc_override_gef_d01_i_quests_illusion_dungeons_looks_normal_outside_cou_32a657: "== It looks normal on the outside, but could it be the effect of cognitive impairment that I have heard about? =="
  npc_override_gef_d01_i_quests_illusion_dungeons_lot_monsters_come_town_s_ff94d6: "A lot of monsters will come to this town soon. Don't die in vain and leave this place."
  npc_override_gef_d01_i_quests_illusion_dungeons_luanda_cave_luanda_219863: "Luanda Cave? Luanda?"
  npc_override_gef_d01_i_quests_illusion_dungeons_luanda_caves_strategical_2c3bf6: "The Luanda Caves are strategically the only way out north of town."
  npc_override_gef_d01_i_quests_illusion_dungeons_lululala_8a2a5d: "Lululala~~~"
  npc_override_gef_d01_i_quests_illusion_dungeons_lump_what_jerrymon_said_c236f1: " - This lump is what Jerrymon said."
  npc_override_gef_d01_i_quests_illusion_dungeons_mage_you_stay_out_notebo_75594e: "Mage, you stay out of this! This notebook is taking people to some place we don't know. And the gateway is in the last page."
  npc_override_gef_d01_i_quests_illusion_dungeons_magic_dropped_stone_conn_826f18: "The magic on the dropped stone is connected to me, so by measuring the distance, I can get a little idea of how deep it is and what's going on near the stone."
  npc_override_gef_d01_i_quests_illusion_dungeons_magic_exhausting_both_my_d25cdb: "Magic was exhausting to both my mind and my body. I reached my limits more quickly than I thought. But I wasn't upset. I thought I could remedy that."
  npc_override_gef_d01_i_quests_illusion_dungeons_maknae_maru_excellent_me_08a1e3: "Maknae Maru has an excellent memory that never forgets what she has seen and the ability to read her opponent's mind.."
  npc_override_gef_d01_i_quests_illusion_dungeons_man_deathly_afraid_he_al_53147d: "The man was deathly afraid, but he was alive and left this place."
  npc_override_gef_d01_i_quests_illusion_dungeons_man_named_briashen_5d4640: "A man named Briashen..."
  npc_override_gef_d01_i_quests_illusion_dungeons_man_named_khahris_he_rea_f0921a: "A man named Khahris, is he real?"
  npc_override_gef_d01_i_quests_illusion_dungeons_man_named_khahris_real_451e8a: "A man named Khahris, is that real?"
  npc_override_gef_d01_i_quests_illusion_dungeons_man_s_scream_heard_front_ada901: "- A man's scream is heard from the front of the line. Let's check the situation at the front. -"
  npc_override_gef_d01_i_quests_illusion_dungeons_many_monsters_come_town_f3aa3a: "Many monsters have come to town and people are crying out in pain because of it..."
  npc_override_gef_d01_i_quests_illusion_dungeons_many_them_told_me_about_de5ed7: "and many of them told me about some strange mage."
  npc_override_gef_d01_i_quests_illusion_dungeons_mao_guy_you_ve_been_2c954d: "Mao guy... you've been thinking about a lot of things."
  npc_override_gef_d01_i_quests_illusion_dungeons_marina_i_don_t_care_ab6ce4: "Marina, I don't care who they are. They saved me and asked for nothing in return."
  npc_override_gef_d01_i_quests_illusion_dungeons_marina_i_think_we_ve_0483a0: "Marina, I think we've found him!"
  npc_override_gef_d01_i_quests_illusion_dungeons_marina_why_don_t_you_09587a: "Marina, why don't you stay? Sister Gem and I will go. I think that'd be best, considering our abilities."
  npc_override_gef_d01_i_quests_illusion_dungeons_matte_drainliars_91c932: "^0000cd10 Matte Drainliars^000000!"
  npc_override_gef_d01_i_quests_illusion_dungeons_matte_drainliars_feed_bl_591f62: "Matte Drainliars feed on the blood of the reanimated corpses in this place."
  npc_override_gef_d01_i_quests_illusion_dungeons_matter_out_our_hands_now_38ee43: "This matter is out of our hands now."
  npc_override_gef_d01_i_quests_illusion_dungeons_may_i_continue_exploring_05b57c: "May I continue exploring?"
  npc_override_gef_d01_i_quests_illusion_dungeons_maya_khahris_melted_into_4b3c9d: "== Maya and Khahris melted into darkness and disappeared. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_maya_moving_her_antennae_06e390: "== Maya is moving her antennae to hear a story. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_maya_ruler_dungeons_a41510: "But Maya is the ruler of dungeons."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_8f8629: "Maybe..."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_doesn_t_help_much_f73bb0: "Maybe it doesn't help much, but...cough"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_even_happening_oth_fa498f: "Maybe this is even happening in other places too?"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_i_should_explore_d_83b905: "Maybe I should explore deeper into the catacombs tomorrow, while the monsters hide from whatever that noise is."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_i_should_try_formu_337081: "Maybe I should try to formulate stamina and mana potions on my own."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_i_use_them_figure_7c458b: "Maybe I can use them to figure out the experiment she did and the force that reanimates the dead."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_ice_magical_e45a6f: "Maybe this ice is magical."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_just_bad_air_c5070e: "Maybe it was just the bad air!"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_maybe_c2463a: "Maybe... maybe"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_maybe_d387d8: "Maybe... maybe.."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_nightmares_stop_ma_3298f6: "Maybe the nightmares would stop materializing if we get rid of their cause."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_only_happens_me_i_858410: "But maybe that only happens to me. I'm a new vampire, and I'm weak. Dracula has lived for a long time, and he's anything but weak. "
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_ritual_reason_they_52903f: "Maybe the ritual is the reason they are angry, it's not working as we hoped it would."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_s_already_taking_p_656aaf: "Or maybe it's already taking place.."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_s_because_dream_no_fefe4a: "Maybe it's because this is a dream, but nothing about it has changed."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_s_because_walls_be_e76ae3: "Maybe it's because the walls between reality and dreams have collapsed."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_s_faith_you_overhe_e9e052: "Maybe it's faith that you overheard us."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_s_time_we_leave_96a05e: "Maybe it's time we leave things to the younger generations."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_you_find_use_those_ea7afd: "but maybe you can find an use for those?"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_you_keep_questioni_f93acb: "Maybe you keep questioning me because you can't trust me. How about I teach you to be the greatest mage among humans? Would you trust me, then?"
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_you_should_help_th_f723c6: "Maybe you should help them create their own story."
  npc_override_gef_d01_i_quests_illusion_dungeons_maybe_you_should_ve_chos_141d98: "Maybe you should've chosen a different career path."
  npc_override_gef_d01_i_quests_illusion_dungeons_me_4e26f0: "Me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_me_favor_3368a5: "Do me a favor."
  npc_override_gef_d01_i_quests_illusion_dungeons_me_nazarians_2a1d26: "Me... the Nazarians..."
  npc_override_gef_d01_i_quests_illusion_dungeons_mean_i_m_free_free_f95319: "Does this mean I'm free? Free at last!"
  npc_override_gef_d01_i_quests_illusion_dungeons_meantime_i_contacted_jun_ac887c: "In the meantime, I contacted Juno University and went to Turtle Island, but I haven't achieved any results... I was hoping I could find a clue so I figure out where Leiphen disappeared to."
  npc_override_gef_d01_i_quests_illusion_dungeons_meantime_i_ll_catch_some_aec092: "In the meantime I'll catch some Z's."
  npc_override_gef_d01_i_quests_illusion_dungeons_meantime_i_make_fire_5cc521: "In the meantime, I will make a fire."
  npc_override_gef_d01_i_quests_illusion_dungeons_meat_easily_digestible_m_180dc3: "Meat... Easily digestible meat. Hungry. Hungry. Too good. Meat..."
  npc_override_gef_d01_i_quests_illusion_dungeons_meat_pieces_please_655a92: "And ^0000CDthe meat^000000, ^0000CD10 pieces^000000 please."
  npc_override_gef_d01_i_quests_illusion_dungeons_megalith_extermination_c84c05: "^FF0000 Megalith extermination^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_as_da4e9b: "As usual, I'd like you to exterminate ^0000cdRestless Deads^000000. There are ^0000cdthree different kinds: Small, Fast, and Big. Please exterminate 10 each.^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_menu_but_c12edd: "but I'm certain of one thing:"
