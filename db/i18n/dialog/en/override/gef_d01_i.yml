  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_6ec7d9: "Khahris!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_929304: "Khahris...!?"
  npc_override_gef_d01_i_quests_illusion_dungeons_khahris_9a72f5: "Khahris..."
