  npc_override_gef_d01_i_quests_illusion_dungeons_you_met_mirko_0672e2: "Have you met Mirko?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_misspelled_efcc14: "You misspelled that."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_busy_336525: "You must be busy."
