  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_stranger_never_b_a3722b: "Go back, stranger. And never be back."
  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_you_belong_here_4e8dda: "Go back. You do not belong here."
  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_you_should_here_49e1dd: "Go back. ...you not should be here."
  npc_override_gef_d01_i_quests_illusion_dungeons_go_get_done_f3c69d: "Go get it done."
  npc_override_gef_d01_i_quests_illusion_dungeons_go_go_get_my_treasure_3ba53a: "Go, ^BDBDBDgo^000000 get it! My ^BDBDBDtreasure^000000! You can take it from them! My ^BDBDBDtreasure^000000!"
