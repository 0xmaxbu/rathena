  npc_override_gef_d01_i_quests_illusion_dungeons_you_d_better_take_break_253c89: "You'd better take a break"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_death_wish_haven_t_b3abc0: "Do you have a death wish? Haven't you noticed how hungry and ferocious these bats are? They latch onto anything that moves, these creeps! Take care of them for me, will you?"
