  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_kill_bc7636: "You must kill it!"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_level_above_per_84ff70: "^4D4DFFYou must be Level 100 or above to perform this quest.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_level_above_per_b16f74: "- You must be Level 110 or above to perform this quest."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_level_higher_en_6aad25: "^4d4dffYou must be level 120 or higher to enter this area.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_must_seen_day_my_ff5824: "You must have seen the day my brothers and I came back from hunting. There was a big disaster in the village and it was the next day."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ok_702cd6: "Are... are you ok?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_priests_least_curiou_6746c3: "You priests are the least curious kind I know. I asked for these because I wanted to compare them to the ones I have, and it takes a keen eye to catch minute differences."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_alive_i_m_06f60e: "You're alive? I'm glad... why didn't you bring me out?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_as_experienced_as_6d288f: "You're as experienced as I've heard."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_back_c78f7c: "You're back!"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_being_chased_ants_7f9dd0: "You're being chased by ants."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_bomi_right_i_84b222: "You're Bomi, right? I read your notebook. What happened? What did these vampires do to you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_brave_a58442: "You're brave"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_carrying_too_many_c1b063: "- You're carrying too many items to proceed with this quest. -"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_church_i_didn_359648: "You're from the Church. I didn't think you'd let those vampires live."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_dangerous_others_533a18: "But you're dangerous to others, whether you like it or not."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_dead_already_3095f8: "You're dead already!"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_good_enough_earn_8a14bc: "You're not good enough to earn your keep. I can't believe your guild actually invested in you."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_here_yet_you_f94d8d: "You're here, and yet you don't know who he is. He's Dracula. Didn't you come to challenge him to a battle?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_letting_her_feed_9ca176: "You're letting her feed him, that vampire? Sister Gem, have you forgotten your duty as our leader?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_pretty_good_b789df: "You're pretty good."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_pretty_sharp_adve_59d3c4: "You're pretty sharp, Adventurer. That's right. I checked with my guild and found out there was someone named Bomi. She just disappeared one day, though."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_right_i_m_2e4ba3: "You're right that I'm Briashen, but were you hurt? When?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_saying_strangers_82f4c5: "You're saying that to strangers?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_scaring_him_dbbfb5: "You're scaring him."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_re_thinking_about_wh_7e9286: "You're not thinking about what kind of danger it might pose when it arrives here. You just want it because you're curious about it."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ready_b68a42: "Are you ready?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_really_came_see_what_38c4fc: "You really came to see what happened a while ago. It wasn't as much damage as you saw in your dream, but it was a lot of damage."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_really_de1d5f: "Are you really in?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_receive_reward_quest_4179cb: "You can receive the reward for this quest from Defense Manager Luanda."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_remember_me_4356f7: "Do you remember me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_request_take_987a51: "Or do you have a request to take on?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_safe_both_you_72a43f: "You are safe. Both of you."
