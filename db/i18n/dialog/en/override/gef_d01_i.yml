  npc_override_gef_d01_i_quests_illusion_dungeons_you_like_go_ashore_now_6b7566: "Would you like to go ashore now?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_like_go_deep_sea_a6dcd6: "Would you like to go to the deep sea again? I will follow you!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_like_go_garden_perce_323c87: "Would you like to go to the Garden of Perception?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ll_get_some_short_7e1465: "And you'll get some ^0000cdShort Bat Hairs^000000 too, right? I need a lot more than what you brought last time."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ll_get_used_soon_0fb2df: "You'll get used to it soon."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ll_help_won_t_5060f4: "You'll help, won't you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ll_take_care_those_2aa4e5: "You'll take care of those Matte Drainliars like you did the last time, right? They're too loud."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_look_like_you_been_665f6c: "You look like you have been through a lot of things before. I can see you are able to talk normally."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_looking_khahris_too_f3e5dd: "Are you looking for Khahris too?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_looking_your_baby_d0bb44: "Are you looking for your baby?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_lot_questions_no_nee_b64c8d: "You have a lot of questions, but no need to know."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_may_professor_give_y_5714ce: "You may be a professor but that does not give you the right to walk around here."
