  npc_override_gef_d01_i_quests_illusion_dungeons_cough_cough_adventurer_c_7b388a: "Cough cough..Adventurer..Cough..Take me with you!"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_cough_cough_9a4b67: "Cough...cough...cough..."
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_cough_cough_bb98f0: "Cough cough... cough"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_cough_cough_cough_fa2869: "Cough...cough cough...cough"
  npc_override_gef_d01_i_quests_illusion_dungeons_cough_lucky_e23226: "Cough...lucky..."
  npc_override_gef_d01_i_quests_illusion_dungeons_could_ant_b4b9b9: "Could it be an ant?"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_dangerous_so_if_yo_72963c: "It could be dangerous, so if you find it, why don't you avoid it? There's no need to take a risk."
  npc_override_gef_d01_i_quests_illusion_dungeons_could_he_father_jubilee_eaa05e: "Could he be Father Jubilee?"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_just_reflect_dream_2c9074: "Or it could just reflect the dreams of the dead."
  npc_override_gef_d01_i_quests_illusion_dungeons_could_nugget_help_6d53fb: "Could this nugget help?"
