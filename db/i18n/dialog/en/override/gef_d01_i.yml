  npc_override_gef_d01_i_quests_illusion_dungeons_muyeon_you_mean_muyeon_s_12c471: "Muyeon? Do you mean Muyeon the Soul Linker?"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_body_become_healthy_b054e5: "My body has become healthy!"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_brother_might_think_s_6a6dc7: "My brother might think it's a secret place only he knows, but it's a place everyone in the village knows."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_brothers_abandoned_vi_03e340: "My brothers were abandoned in the village as babies. The villagers picked them up and raised them."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_dearest_friend_cough_33979c: "My dearest friend...cough..may be in danger, but I can't stay still!...cluck"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_friend_leiphen_who_lo_952dab: "My friend Leiphen who was looking at the pieces suddenly disappeared."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_friend_might_other_on_cbda2c: "My friend might have the other one. No, I mean he must still have."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_goal_right_now_explor_7bd2cc: "My goal right now is not exploration, I want you to rescue the Ranger and his friends."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_heart_hurts_like_too_a71afd: "My heart hurts like this too, but if you know the youngest who struggles because of his abilities... I'll have to prepare. Thank you, adventurer."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_low_stamina_insuffici_6de440: "My low stamina and insufficient mana are always the problem. I thought I could make up for my weak constitution with magic. Of course, even that required some minimal stamina, but I didn't have even that."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_my_precious_treasure_19a1d9: "My... my precious ^BDBDBDtreasure^000000... ^FF0000Murmur^000000..."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_my_precious_treasure_787c54: "My...my precious ^BDBDBDtreasure^000000... ^FF0000Murmur^000000..."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_my_treasure_all_my_db8899: "My... my treasure. ^BDBDBDAll^000000 of... my... ^FF0000munch, munch^000000..."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_my_treasure_all_my_f71bac: "My... my treasure. ^BDBDBDAll^000000 of...my... ^FF0000munch, munch^000000..."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_name_sunrin_4a8eb6: "My name is Sunrin."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_neighborhood_friends_33f397: "My neighborhood friends teased me a bit when I was young, but I don't have any complaints about the name."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_predecessors_may_been_c8f14f: "My predecessors may have been too enthusiastic to study what's underneath their tower, but it was that enthusiasm that made Geffen grow into the city of magic that it is."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_treasure_munch_munch_3b8aad: "And my treasure... ^FF0000Munch^000000, munch... You brought ^BDBDBDmy^000000 treasure?"
  npc_override_gef_d01_i_quests_illusion_dungeons_my_treasure_my_revenge_5085c4: "^FF0000My treasure... My revenge..."
  npc_override_gef_d01_i_quests_illusion_dungeons_my_wishes_now_doesn_t_e61bfb: "It has my wishes. Now... It doesn't need to exist."
  npc_override_gef_d01_i_quests_illusion_dungeons_name_briashen_looking_kh_981c98: "The name Briashen was looking for was Khahris..."
  npc_override_gef_d01_i_quests_illusion_dungeons_name_person_briashen_loo_1c93d5: "== The name of the person Briashen is looking for is... =="
  npc_override_gef_d01_i_quests_illusion_dungeons_narin_said_i_get_some_54e9cb: " - ^424242Narin said, I can get some ^0000CD{0}^424242 from here. It would be enough for him. ^0000CDLet me prepare^424242 5 pieces.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_nearest_place_let_s_go_74378a: "To the nearest place... ^FF0000Let's go to the hungry ^424242woman.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_never_mind_good_luck_fin_1fc408: "Never mind. Good luck finding him. Maybe you should check the catacombs in the south."
  npc_override_gef_d01_i_quests_illusion_dungeons_news_sirood_s_disappeara_8105f7: "The news of Sirood's disappearance immediately spread throughout Izlude and a large-scale search was conducted with a lot of time and manpower invested, but the search ended without finding any clues."
  npc_override_gef_d01_i_quests_illusion_dungeons_next_thing_i_knew_i_c2ce60: "And the next thing I knew, I was turned. Dracula broke his promise."
  npc_override_gef_d01_i_quests_illusion_dungeons_next_time_be86ab: "Next time."
  npc_override_gef_d01_i_quests_illusion_dungeons_nice_if_just_dream_149ef1: "It would be nice if it was just a dream..."
  npc_override_gef_d01_i_quests_illusion_dungeons_nice_if_we_could_go_85b8a1: "It would be nice if we could go too..."
  npc_override_gef_d01_i_quests_illusion_dungeons_nice_if_we_went_together_a35edc: "It would be nice if we went together, but..."
  npc_override_gef_d01_i_quests_illusion_dungeons_nine_tailed_foxes_spirit_29119f: "But the Nine-tailed foxes spirits are more enraged than we thought."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_1d59ae: "No!"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_816c52: "No"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_9a4c18: "...No."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_adventurer_you_agreed_0a73ad: "No. Adventurer, you agreed with me that she's not trustworthy."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_all_b2199e: "No. Not at all."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_b8b9f1: "No."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_because_i_bored_death_a013fa: "No. Because I was bored to death!"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_coincidence_they_like_591a62: "......No, it was a coincidence. They are, not like me."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_don_t_even_think_cc02aa: "No. Don't even think about it. Mojo, you're so close to crossing the line."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_don_t_hunt_them_f5915c: "No, don't hunt them! You have to help them!"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_don_t_i_d_4d5d7b: "No, don't! I'd rather die!"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_how_could_a530cc: "No, how could it be?"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_asked_find_khahris_29df54: "...No, I was asked to find Khahris."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_don_t_i_0eb59e: "No, I don't. I may trust Mojo, my sister in faith, but not Mojo, the mage."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_don_t_know_92f6e0: "No, I don't know"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_don_t_remember_6793e1: "No, I don't remember. When Sister Gem returns, I'm going to tell on you!"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_just_want_you_e76fd5: "No. I just want you to ^0000cdfind them^000000 and make sure they're okay. If they need help, please provide it to them. If they have a message for me, then please let me know."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_m_even_going_f895f2: "No! I'm not even going to let you touch it!"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_m_jojo_5d0843: "No, I'm not Jojo."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_i_ve_never_seen_df8eef: "No. I've never seen an ant here... except when I'm with Mirko."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_isn_t_weird_ef6088: "... no, isn't that weird?"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_matter_how_many_times_960b91: "No matter how many times I went to the hospital, there was no improvement..."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_more_stupid_ideas_ple_f534aa: "No more stupid ideas, please!"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_my_daughter_my_pretty_9441f3: "^FF0000No, my daughter. My ^000000pretty baby. No. Lost, ^FF0000lost her^000000. Lost. Boohoo... My ^FF0000pretty...baby.. Can't ^000000find, ^FF0000can't^000000 find, can't... ^FF0000find^000000......"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_my_name_jane_1d34db: "No, my name is Jane."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_never_keep_your_hands_f24201: "No. Never. Keep your hands to yourself."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_no_he_s_my_d4a60b: "No, no! He's not my friend! I've never seen him before in my life, I swear!"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_no_i_d_love_8515c8: "No, no! I'd love to! But, erm, you're not going to ask for my blood in return, are you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_no_s_me_s_dcbadd: "No, no. It's not me, it's Khahris"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_no_t_find_her_476439: "No. ^FF0000No.^000000 Can't find her."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_no_you_i_m_0f5352: "No, no. Not you. I'm talking about Matte Drainliars."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_now_i_understand_why_9a4cac: "No, and now I understand why you made that decision. You couldn't just let me die, could you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_one_comes_back_s_963e8f: "......No one comes back. It's better to not come here. It's full of danger."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_other_members_my_grou_0c5bf7: "No. The other members of my group and two mages are already there. They just haven't returned."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_place_overrun_unholy_b7994c: "No. This place is overrun with unholy creatures. It's better if two servants of God look for them."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_s_always_been_my_c0b1de: "No. But it's always been my dream to conquer all the dungeons on the continent and become the greatest mage."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_s_important_right_now_a10724: "No, that's not important right now..."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_s_somewhere_else_i_0a3291: "No. It's from somewhere else, and I'm smelling more than one human. ...A ^0000cdfight^000000! A fight broke out somewhere! Blood! Let's go!"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_stone_contains_my_mag_10915d: "No. This is the stone that contains my magical power. Let's look at it."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_t_my_daughter_baby_3f3181: "No ^FF0000it can't be. My daughter.^000000 Baby... Baby? No. Ha, ha^FF0000haha. No. Ha, ha.^000000 My ^FF0000pretty baby,^000000, baby. My ^FF0000 pretty baby. No.^000000 No."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_two_so_they_look_54b9e3: "No. It has to be two, so they can look out for each other."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_wait_just_ice_reflect_c53e3b: "^ff0000No, wait. That was just the ice reflecting ambient light.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_wait_you_leaving_righ_159860: "No, wait. Are you leaving right now?"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_way_all_5cac15: "No way... All of it?"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_why_you_here_ea726b: "No... why are you here?"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_you_didn_t_s_8930b6: "No, you didn't. That's why you had your butt handed to you by those mushrooms."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_you_re_staying_me_96c1e3: "No. You're staying with me. Don't you dare touch the book."
  npc_override_gef_d01_i_quests_illusion_dungeons_no_you_sure_6f2aac: "No... are you sure?"
  npc_override_gef_d01_i_quests_illusion_dungeons_no_you_t_a314b1: "No. ^FF0000You can't^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_nobody_here_except_two_u_fb106b: "Nobody is here except the two of us."
  npc_override_gef_d01_i_quests_illusion_dungeons_nod_go_alberta_7762fa: "Nod and go to Alberta."
  npc_override_gef_d01_i_quests_illusion_dungeons_nod_turn_e789b3: "Nod and turn."
  npc_override_gef_d01_i_quests_illusion_dungeons_none_my_guildsmen_such_n_328846: "But none of my guildsmen has such a name. I read the book, and she did sound like she was one of us. ^0000cdNot anymore^000000, though."
  npc_override_gef_d01_i_quests_illusion_dungeons_notebook_13fbca: "A notebook?"
  npc_override_gef_d01_i_quests_illusion_dungeons_notebook_both_diary_rese_730d87: "This is notebook is both ^0000cda diary and research journal^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_notebook_i_want_see_note_790fa3: "The notebook... I want to see the notebook... If you want to enter the notebook, then you should talk to Father Grimm. If you want, I can go with you."
  npc_override_gef_d01_i_quests_illusion_dungeons_nothing_happened_4501ec: "^ff0000Nothing happened.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_nothing_symphathy_i_feel_7fedde: "And that has nothing to do with the symphathy I feel for them."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_adventurer_let_me_kn_ac1750: "Now, Adventurer. Let me know when you're ready."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_adventurer_sirood_yo_dabf42: "Now, Adventurer and Sirood!! Can you help me?? Ehhh!!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_calm_down_you_sure_91077e: "Now, calm down... Are you sure it's Sirood's fishing rod?"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_come_hug_us_no_c71c7e: "Now, come hug us? no, hug me first. Then, light will flash as the ice around me cracks, you know, like in those fairy tales!"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_he_s_roaming_about_e7dab2: "Now, he's roaming about the cave, yearning for his owner's love. Isn't that so tragic? I was only trying to give him the love he wanted, and he punished me for it!"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_know_difference_al_16f4ec: "But now I know the difference, It also has nothing to do with my health."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_know_ruined_villag_16ae3d: "Now I know this is not the ruined village."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_know_those_nightma_0203f8: "Now that I know that those nightmares really originated from Moonlight Flowers, I feel better."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_ll_give_you_c5df96: "Now, I'll give you the fishing rod, a keepsake from Sirood. Thank you..."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_m_also_taking_975060: "For now, I'm also taking care of it, but I'm not good enough alone."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_stand_front_famili_679bfc: " - ^424242Now I stand in front of the familiar light. Lightly waved my hand to Narin, she closed her eyes and held both hands together.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_t_see_both_58b917: "Now I can't see both of you... But don't go. I'm speaking in a quiet voice."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_i_understand_why_dra_de714f: "Now I understand why Dracula was so distrustful of you humans. I thought he was being too picky."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_if_you_ll_excuse_dd5379: "Now if you'll excuse me, Chunghae and I'll go investigate other places."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_let_s_light_twigs_55d107: "For now, let's light the twigs and try to melt the ice. Why don't you try to melt the ice around my friend first?"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_let_s_see_how_ac5770: "Now, let's see how this affects the situation."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_look_as_i_said_4addab: "Now, look. As I said before, they don't mix at all, do they?"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_problem_d489a6: "But now the problem is,"
  npc_override_gef_d01_i_quests_illusion_dungeons_now_s_interfering_our_or_e6c051: "Now, that's interfering with our original mission, which is to keep this place clear of the unholy."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_we_know_you_exist_3042ee: "Now that we know you exist, we can't ignore you. I can, but these people here can't. Their church won't allow it."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_we_need_help_vrid_f2e4d4: "Now, we need to help Vrid. Please get him out of the ice."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_you_fish_sirood_agai_20fa29: "Now you can fish with Sirood again."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_you_know_what_i_da35c6: "Now you know what I've been through."
  npc_override_gef_d01_i_quests_illusion_dungeons_now_you_see_whirlpool_pa_6cc50a: "Now, do you see this whirlpool!! This is the passage that connects to the bottom of the Bahia Trench!"
  npc_override_gef_d01_i_quests_illusion_dungeons_observing_surroundings_h_1e936c: "And observing the surroundings here, I could see small vortices forming occasionally."
  npc_override_gef_d01_i_quests_illusion_dungeons_occasionally_if_you_defe_43cc66: "Occasionally if you defeat {0}"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_another_adventurer_ju_f4d7a6: "Oh, another adventurer just went over there. I heard that the dizziness has lessened."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_come_think_you_don_d9c412: "Oh... Come to think of it, you don't cough anymore, do you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_come_you_know_i_747a1c: "Oh, come on! You know I've been busy studying things!"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_come_you_re_priest_99adf2: "Oh, come on! You're a priest? You're supposed to have faith in everyone! Why are you treating me like a thief?"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_geez_how_you_move_25c55b: "Oh geez, how do you move so fast?"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_great_instead_fightin_722b70: "Oh, this is great! Instead of fighting, why don't we ask this adventurer who is right?"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_hello_9bf012: "Oh, hello..."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_hey_i_m_here_322e3c: "Oh hey, I'm here to find Sirood..."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_almost_forgot_let_77dcce: "Oh, I almost forgot. Let me cast my spell on you again. It's weak, so it will not last long."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_heard_fishing_rod_4acf50: "Oh, and I heard that the fishing rod was found today. Can I ask you to check if there is another floating substance in the nearby sea?"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_knew_2c212d: "Oh, I knew it...!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_m_going_catch_0e703f: "Oh, I'm going to catch someone, is it okay?"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_m_sorry_church_de0fc6: "Oh, I'm sorry. The Church of Rune-Midgarts periodically sends its priests out to these catacombs to maintain peace."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_m_sorry_i_091c98: "Oh, I'm sorry, but I can't talk right now. I'm too busy examining the things you brought to me."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_m_sorry_i_678ed4: "Oh, I'm sorry, I didn't mean to keep you standing there. Could you get me some spores from Neon Mushrooms? I need some light to see what I'm writing."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_see_75461a: "...Oh, I see."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_see_you_again_04d134: "Oh, I see you again"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_i_want_go_home_9ae528: "Oh, I want to go home..."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_just_case_i_actually_e00bf5: "Oh, just in case, I actually found it!"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_ll_great_if_you_2cbdea: "Oh, and it'll be great if you also can get rid of ^0000cd10 Sweet Nightmares^000000. I want to know how that'll affect dreams. Thank you!"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_my_god_human_human_74e940: "Oh my god... Human, a human? A real human?"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_my_gosh_place_where_836c9d: "Oh my gosh.. that place is where my brother and sister-in-law often went on dates."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_no_there_too_many_4b4205: "Oh, no! There is too many toxins in my body. It's getting dangerous!"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_no_you_hit_shrapnel_73e1a3: "Oh no, were you hit by the shrapnel?"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_really_62e6de: "Oh really..."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_really_good_you_8a947f: "Oh, really? Good for you!"
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_really_s_such_silly_ddbab5: "Oh... really, it's such a silly story. It's hard to keep talking."
  npc_override_gef_d01_i_quests_illusion_dungeons_oh_right_bd644d: "Oh right!!"
