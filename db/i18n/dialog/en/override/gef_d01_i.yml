  npc_override_gef_d01_i_quests_illusion_dungeons_you_sure_you_came_me_35dd73: "Are you sure you came to me with that fishing rod as a clue?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_sure_you_carry_all_023067: "Are you sure you can carry all that stuff? Why don't you lighten your bag?"
