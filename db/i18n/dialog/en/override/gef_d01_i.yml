  npc_override_gef_d01_i_quests_illusion_dungeons_you_just_asked_adventure_07b017: "You just asked this adventurer to capture a zombie alive."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_kill_40d86c: "Can you kill ^0000FF10 {0}^000000,"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_killed_398674: "Have you killed ^ff0000{0}^000000?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_know_archeologist_le_091abf: "Do you know Archeologist Leiphen?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_know_if_i_paint_e8533e: "Do you know? If I paint the mural in advance, will the future I saw in my dream change?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_know_me_1c34c2: "Do you know me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_know_mirko_687e83: "Do you know Mirko?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_know_name_khahris_842c55: "Do you know the name Khahris?"
