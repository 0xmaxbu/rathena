  npc_override_gef_d01_i_quests_illusion_dungeons_please_take_look_d026f6: "Please take a look."
  npc_override_gef_d01_i_quests_illusion_dungeons_please_take_meat_pieces_c07888: "Please take the meat. {0}. 10pieces."
  npc_override_gef_d01_i_quests_illusion_dungeons_please_take_out_each_87e034: "Please take out 10 each of ^4d4dff{0}^000000, ^4d4dff{1}^000000, and ^4d4dff{2}^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_please_take_out_each_974ff8: "Please take out 15 ^4d4dff{0}^000000 and ^4d4dff{1}^000000 each."
  npc_override_gef_d01_i_quests_illusion_dungeons_please_talk_clearly_bc5255: "Please talk clearly!"
  npc_override_gef_d01_i_quests_illusion_dungeons_please_talk_me_again_whe_43e291: "Please talk to me again when you are ready to cross."
  npc_override_gef_d01_i_quests_illusion_dungeons_please_teach_them_act_so_821e41: "Please teach them not to act so sneaky."
  npc_override_gef_d01_i_quests_illusion_dungeons_please_tell_brother_grim_6e9f62: "Please tell Brother Grimm that we've decided to stay"
  npc_override_gef_d01_i_quests_illusion_dungeons_please_tell_brother_grim_8e9da2: "Please tell Brother Grimm that we've decided to stay to keep an eye on them."
  npc_override_gef_d01_i_quests_illusion_dungeons_please_tell_me_where_am_9b8478: "Please tell me. Where am I? What just happened here?"
  npc_override_gef_d01_i_quests_illusion_dungeons_please_tell_me_your_frie_f33238: "Please tell me your friend looks like."
  npc_override_gef_d01_i_quests_illusion_dungeons_plop_57e9fb: "-plop-"
  npc_override_gef_d01_i_quests_illusion_dungeons_population_deep_sea_crea_a5d735: "The population of deep sea creatures is increasing. Adventurer, may I ask for your help?"
  npc_override_gef_d01_i_quests_illusion_dungeons_preparation_time_village_72c222: "And in preparation for that time, the village warriors evacuated the elderly and weak to this place, and they stored supplies here and there in the cave."
  npc_override_gef_d01_i_quests_illusion_dungeons_problem_amount_essence_f_7183ee: "The problem is... the amount of essence on a fishing rod can't make a whirlpool large enough for a person to fit in."
  npc_override_gef_d01_i_quests_illusion_dungeons_problem_just_let_me_know_eaac5a: "Not a problem. Just let me know when you are ready."
  npc_override_gef_d01_i_quests_illusion_dungeons_professor_got_my_stuff_s_82e381: "The professor got my stuff, so I could recognize it right away. Normally I wouldn't have known."
  npc_override_gef_d01_i_quests_illusion_dungeons_professor_just_come_back_cd56d8: "The professor will just come back. Let's find him.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_puhahaha_i_think_you_cam_6b1b1c: "Puhahaha I think you came to see the place where Hyung-nim and sister-in-law are dating."
  npc_override_gef_d01_i_quests_illusion_dungeons_punish_intruder_7f1747: "Punish the intruder!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_punish_them_6a92d7: "Punish them!"
  npc_override_gef_d01_i_quests_illusion_dungeons_put_your_mouth_shh_quiet_8fc0f2: "Put this in your mouth. Shh, quietly!"
  npc_override_gef_d01_i_quests_illusion_dungeons_quest_done_again_tomorro_64cfdc: "This quest can be done again tomorrow."
  npc_override_gef_d01_i_quests_illusion_dungeons_quest_itself_doesn_t_dif_93b0a4: "The quest itself doesn't have to be difficult, as you just have to go around the cave and deal with the monsters or bring the byproducts of the monsters."
  npc_override_gef_d01_i_quests_illusion_dungeons_quests_recruiting_town_t_17bd9b: "For quests that are recruiting in town, there is a separate request board."
  npc_override_gef_d01_i_quests_illusion_dungeons_quiet_now_cff801: "Be quiet for now!"
  npc_override_gef_d01_i_quests_illusion_dungeons_quit_1a2285: "Quit"
  npc_override_gef_d01_i_quests_illusion_dungeons_quit_investigating_9ad060: "Quit investigating."
  npc_override_gef_d01_i_quests_illusion_dungeons_raket_looked_intently_hi_453f65: "- Raket looked intently at his fishing pole, then answered Gein. -"
  npc_override_gef_d01_i_quests_illusion_dungeons_ranger_s_name_briashen_8881ef: "Ranger's name is Briashen..."
  npc_override_gef_d01_i_quests_illusion_dungeons_really_e7da47: "Really?"
  npc_override_gef_d01_i_quests_illusion_dungeons_really_really_you_going_37c058: "Really... Really? Are you going to come back here and find me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_really_s_sane_place_go_071f02: "Really, that's... not a sane place to go"
  npc_override_gef_d01_i_quests_illusion_dungeons_really_worked_hey_zeith_ea8438: "It really worked! Hey, Zeith! Are you alright?"
  npc_override_gef_d01_i_quests_illusion_dungeons_recently_i_haven_t_had_2732a8: "Recently, I haven't had much to laugh about because of various things, but thanks to you, I laughed out loud. I look forward to the next story."
  npc_override_gef_d01_i_quests_illusion_dungeons_red_light_invisible_nari_7297c8: " - ^424242This red light is invisible to Narin. It just seems to disappear.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_relax_focus_your_mind_op_38a1ff: "Relax... and focus your mind on it ... open your mind to its energy."
  npc_override_gef_d01_i_quests_illusion_dungeons_remember_what_muyeon_sai_27c9bb: "Remember what Muyeon said?"
  npc_override_gef_d01_i_quests_illusion_dungeons_reported_luanda_gained_e_863695: "Reported to Luanda and gained experience."
  npc_override_gef_d01_i_quests_illusion_dungeons_request_been_cancelled_75fbc9: "The request has been cancelled."
  npc_override_gef_d01_i_quests_illusion_dungeons_request_yet_37fa36: "...is the request yet..."
  npc_override_gef_d01_i_quests_illusion_dungeons_revenge_67df05: "Revenge?"
  npc_override_gef_d01_i_quests_illusion_dungeons_right_954daa: "Right"
  npc_override_gef_d01_i_quests_illusion_dungeons_right_now_5c2fb4: "Not right now."
  npc_override_gef_d01_i_quests_illusion_dungeons_right_now_there_so_many_f518bf: "Right now, there are so many toxins in my body that I can feel like I'm turning into a monster."
  npc_override_gef_d01_i_quests_illusion_dungeons_rune_midgarts_flanked_ar_1f82ce: "Rune-Midgarts is flanked by Arunafeltz and Schwarzwald, the two strongest nations of the continent, and its magic power is what keeps them at bay."
  npc_override_gef_d01_i_quests_illusion_dungeons_rwella_2d8389: "Rwella?"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_5a97cd: "That's..."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_about_dying_their_curs_20d4ef: "This.. it's not about dying.. their curse.. on you.."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_alive_s_alive_damn_af3566: "It's..^BDBDBDit^000000 was... alive. ^BDBDBDIt's^000000 alive... Damn! ^BDBDBDAlive,^000000 alive?! I am!!! I am^BDBDBDdead^000000, dead!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_all_mine_all_mine_25d072: "It's all... mine. ^BDBDBDIt all^000000 can ^BDBDBDbe^000000 mine..."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_all_mine_all_mine_cd50e9: "It's all ... mine. ^BDBDBDIt all^000000 can ^BDBDBDbe^000000 mine..."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_all_mine_could_all_b3b53c: "It's all mine. ^BDBDBDCould be^000000 all^ BDBDBDmine^000000..."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_all_mine_could_allmine_ec2bef: "It's all mine. ^BDBDBDCould be^000000 all^BDBDBDmine^000000..."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_because_form_more_effi_521da7: "That's because this form is more efficient. I don't have to drink a lot to get full, I'm inconspicuous, and people, like that numskull over there, let their guard down around me."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_been_exactly_months_si_6126a0: "It's been exactly 3 months since Sirood went missing."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_been_hard_you_being_706fc1: "It's been hard on you being alone."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_been_said_all_mammals_823af8: "It's been said all mammals have curiosity that rivals their appetite, but mages... are the worst. "
  npc_override_gef_d01_i_quests_illusion_dungeons_s_been_submerged_water_m_9152c5: "It's been submerged in water for 3 months... but it hasn't corroded at all. It's completely fine??"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_been_while_i_haven_ed062d: "It's been a while, I haven't lost my mind. I was not swept away by resentment and neither reason nor emotion was lost."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_big_dream_impossible_d_7122aa: "...That's a big dream, an impossible dream. Well, anyone can dream big."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_bizarre_shimmer_you_re_c76eba: "It's a bizarre shimmer that you're likely to be sucked into."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_bulletin_board_things_609f41: "It's a bulletin board with things requested by the village written on it, but it doesn't seem to be the case now."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_cd820a: "That's....!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_chunk_scooped_up_landi_0b93af: "It's a chunk scooped up with a landing net near where the fishing rod was found."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_crazy_kkkk_52c4be: "That's not crazy kkkk."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_dangerous_here_i_ll_5fd70a: "It's dangerous here. I'll find Khahris and go back soon."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_dangerous_rate_you_re_068455: "It's dangerous at this rate. You're sick, and you need to get out of here."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_deeper_here_than_anywh_d5d109: "It's deeper here than anywhere else, and it's amazing to be able to breathe freely."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_embarrassing_even_now_4ecf72: "It's embarrassing. Even now, all we can do is block it."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_even_ruin_so_how_3baf29: "It's not even a ruin, so how about going wild?"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_fine_today_i_ll_88e6f2: "It's fine today. I'll take care of it tomorrow."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_first_time_someone_her_1c12b8: "It's not the first time, someone is here. It's a rare event. When I first saw someone, I remembered what I wanted."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_giving_me_anxiety_feel_0f55b0: "It's giving me an anxiety feeling."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_good_question_zeith_an_e65886: "That's a good question. Zeith, answer him."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_good_someone_still_sta_fe14aa: "That's good, but someone still has to stay here to keep an eye on them. You understand us, right? Please let Brother Grimm know."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_great_here_we_recently_698864: "That's great. Here, we recently found a way to go deeper."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_haunted_cave_so_we_1f8272: "It's a haunted cave, so we've been preforming rituals and exorcism there regularly."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_high_risk_job_b128ef: "It's a high risk job."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_huge_7eb54d: "It's a huge ^ff0000{0}^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_image_another_world_di_fdfa65: "It's an image of another world, different from ours."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_impossible_ddf96b: "It's impossible, this is..."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_interesting_if_what_yo_5a9e50: "It's interesting. If what you're saying is true, doesn't that mean you've been talking to me in the past?"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_intruder_64bf57: "It's an intruder!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_just_guess_b994db: "It's just a guess."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_just_outlandish_3a9f89: "...That's just outlandish."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_kind_rude_answer_my_ee1479: "That's kind of rude, answer my question too. Have you seen Briashen?"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_like_you_re_writing_a47d40: "It's not like you're writing something important."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_melting_820e07: "It's not melting."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_much_i_ll_money_9f74b8: "It's not much. I'll do the money later."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_much_secret_each_my_0aabb1: "It's not much of a secret, but each of my brothers has a mysterious ability."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_normal_reaction_humans_49586b: "That's the normal reaction from humans! She's ungrateful!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_ok_i_die_starving_ac8a7d: "It's ok. Or I will die. Starving..."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_ok_i_forget_both_41b69b: "It's ok. I will forget both of you. All the souls here are made like that."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_ok_i_ll_leave_2e47c5: "It's ok. I'll leave you for a moment. {0}, let's go together."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_ok_i_need_i_cfb8a2: "It's ok. I need {0}, or I will just die. Starving and suffering."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_okay_because_i_m_d59ef9: "It's okay because I'm alive!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_one_who_made_mess_8f5a7f: "It's the one who made a mess because you sewed wrong?? Yes!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_only_reason_kept_churc_c403f5: "And that's the only reason that kept the Church from further pressing this matter,"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_over_dffcce: "It's over!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_posture_someone_who_s_81048a: "== But it's not the posture of someone who's been hurt somewhere. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_s_puzzling_response_migh_c65f3d: " - ^424242It's a puzzling response, but it might help. As the girl told me, I held onto the turtle shell.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_s_quite_popular_spot_amo_0c77a4: "It's quite a popular spot among village lovers. It's quiet and a good place for a date."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_real_blood_he_needs_83b045: "It's not real blood! He needs it! Can't you see he's dying?"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_really_weird_you_hunt_258817: "That's really weird. You hunt living monsters, but somehow it only gives rotten meat?"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_reason_we_been_perform_132147: "That's the reason we have been performing a ritual in regular basis."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_reason_why_you_shut_71feec: "That's the reason why you shut yourself up in the west cave."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_requested_name_b9d1c9: "That's not the requested name"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_ridiculous_b0dee0: "...That's ridiculous."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_right_adventurer_e6d58b: "That's right! Adventurer,"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_right_adventurer_man_629ad7: "That's right! Adventurer man,"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_right_d65817: "That's right"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_right_lot_people_said_61431d: "That's right. A lot of people said they saw it."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_s_hard_even_i_9de8ea: "It's... it's hard. Even I envy those trapped by this burden. But... I couldn't turn it off. The people who are in danger."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_said_i_lost_my_1fb3e9: "It's said that I lost my mind after having a painful dream, but somehow my anxiety..."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_shiny_shiny_s_pretty_878349: "It's shiny... shiny... It's pretty, so pretty."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_sign_promise_i_try_6a6726: "It's a sign of promise. I will try to remember the two of you. So come... come and find me."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_situation_where_even_o_494b6e: "It's a situation where even one request is regrettable, but {0}... really."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_so_amazing_we_breathe_c58fd0: "It's so amazing that we can breathe without gills, there's no sea pressure, and even marine life that I've never seen before...!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_something_we_need_thin_b08e14: "It's something we need to think about."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_strange_my_head_i_f6ab1d: "It's strange. In my head, I know I'm a human, but when I see an ant passing by there, I wonder if I'm an ant"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_stupid_182a7c: "It's not stupid!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_time_we_deal_quasi_c99673: "It's time we deal with this quasi-reality."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_true_cough_my_friend_859840: "That's true, but... Cough... My friend who went to the mine for work hasn't come back yet... Cough."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_true_his_wounds_almost_6c3445: "It's true. His wounds are almost fully healed."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_truth_6fca0c: "It's the truth!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_unbelievable_106488: "It's unbelievable."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_uncommon_see_strangers_1a7ac6: "It's not uncommon to see strangers in town, so my memory is hazy, but I remember it."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_urgent_so_i_ll_49d3a6: "It's urgent, so I'll ask you quickly!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_very_puzzling_us_too_669396: "It's very puzzling to us too. If we knew why, we'd have put everything away."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_way_09cec7: "But... that's not the way!"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_weird_as_you_see_319f9b: "That's weird. As you can see I'm fine. I'm looking for my friend who broke up here"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_weird_left_right_over_ae5bd7: "It's weird to the left and right, over there."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_what_muyeon_said_32e8b0: "That's what Muyeon said."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_why_i_want_see_921854: "And that's why I want to see the notebook so badly. I want to know how it contains a world inside it and why it was only discovered now."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_why_mirko_asked_me_7733fc: "That's why Mirko asked me to help too."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_why_we_re_defending_5d38a7: "That's why we're defending against monster attacks here."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_why_we_re_worried_e70bd5: "That's why we're worried about her."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_why_you_hired_101cbb: "That's why you were hired"
  npc_override_gef_d01_i_quests_illusion_dungeons_s_worst_thing_i_ve_4d68c4: "That's the worst thing I've ever seen."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_you_figure_out_i_513520: "That's for you to figure out. I'm not a cape maker, am I? But I know you would need more than that."
  npc_override_gef_d01_i_quests_illusion_dungeons_s_your_fault_9894cd: "It's not your fault."
  npc_override_gef_d01_i_quests_illusion_dungeons_same_question_we_asked_f_ae2edb: "That was the same question we asked at first. That didn't matter anymore once we read what was written in the book."
  npc_override_gef_d01_i_quests_illusion_dungeons_same_thing_9409e7: "Same thing"
  npc_override_gef_d01_i_quests_illusion_dungeons_save_friend_b7f913: "Save that friend."
  npc_override_gef_d01_i_quests_illusion_dungeons_sea_monsters_attack_time_207a59: "Sea monsters do attack from time to time, but that's about it..."
  npc_override_gef_d01_i_quests_illusion_dungeons_secret_ice_cave_0208c4: "Secret of the Ice Cave!"
  npc_override_gef_d01_i_quests_illusion_dungeons_see_i_told_you_e8f1e7: "See, I told you!"
  npc_override_gef_d01_i_quests_illusion_dungeons_see_if_you_break_ice_1b813f: "See if you can break the ice around him. If it works, then please break me out of the ice, too."
  npc_override_gef_d01_i_quests_illusion_dungeons_see_those_two_little_wat_8b4f06: "See those two little water bottles here?"
  npc_override_gef_d01_i_quests_illusion_dungeons_seeing_you_re_adventurer_e0990a: "Seeing that you're an adventurer, I assume you're familiar with the ^0000FFPayon Cave^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_seemed_like_he_going_fir_6dd564: "It seemed like he was going to ^ff0000the first floor of the mine in Einbech^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_seems_alleviated_just_re_6f9efc: "it seems to be alleviated just by the reduction of the monsters."
  npc_override_gef_d01_i_quests_illusion_dungeons_seems_getting_little_col_9ca85a: " - ^424242It seems to be getting a little cold.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_seems_like_happened_long_32be3d: "It seems like it happened a long time ago. Unlike Mao, I don't have a very good memory."
  npc_override_gef_d01_i_quests_illusion_dungeons_seems_like_phenomenon_t_ddf495: "It seems like a phenomenon that can't be ignored. I'll have to talk to Luanda, the head of defense."
  npc_override_gef_d01_i_quests_illusion_dungeons_seems_monster_appeared_l_f8fc6c: "It seems that a monster has appeared to lead them."
  npc_override_gef_d01_i_quests_illusion_dungeons_sense_could_you_handle_s_9fe27d: "In that sense, could you handle some of the deep sea creatures? Maybe we can get ^4d4dff{0}^000000 from them."
  npc_override_gef_d01_i_quests_illusion_dungeons_seriously_we_met_here_fe_3186d9: "Seriously. We met here a few times, together with ants..."
  npc_override_gef_d01_i_quests_illusion_dungeons_several_days_s_weird_18a692: " - ^424242Several days? It's weird.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_shared_memory_555ea2: "Shared Memory"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_holding_her_bare_han_8372d4: " - ^424242......she is holding it with her bare hands and eating..^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_left_without_telling_4fc903: "She left without telling us what happened."
  npc_override_gef_d01_i_quests_illusion_dungeons_she_looks_just_like_bria_1670dc: "She looks just like Briashen"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_ran_into_cave_as_76ce08: "She ran into the cave, as if she was possessed by something."
  npc_override_gef_d01_i_quests_illusion_dungeons_she_s_right_we_shouldn_d39e1f: "She's right. We shouldn't. But looking at them... I wasn't sure if they deserved to die."
  npc_override_gef_d01_i_quests_illusion_dungeons_she_said_dracula_betraye_c159d3: "She said Dracula betrayed her."
  npc_override_gef_d01_i_quests_illusion_dungeons_she_still_hasn_t_forgive_fb2202: "She still hasn't forgiven me. But I did what I had to do."
  npc_override_gef_d01_i_quests_illusion_dungeons_she_t_remember_even_if_504b93: " - ^424242She can't remember, but even if she doesn't remember, she's different from the other ghosts.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_told_me_other_place_f2438e: " - ^424242She told me the other place, ^0000CDthe other^000000 point. Is ^0000CDTurtle Palace^424242 nearby?^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_she_wants_me_leave_arche_f2a830: " - ^424242...She wants me to leave with Archeologist Leiphen. Then she will remember..."
  npc_override_gef_d01_i_quests_illusion_dungeons_should_i_ask_mr_luanda_12e569: "Should I ask Mr. Luanda about what happened?"
  npc_override_gef_d01_i_quests_illusion_dungeons_should_i_say_aloud_since_4fd5dc: "Should I say aloud since I met you? My name is Mao. I'm the younger brother of Luanda, whom you met the other day."
  npc_override_gef_d01_i_quests_illusion_dungeons_should_i_say_hello_nice_07f258: "Should I say hello? Nice to meet you. I'm Luanda, the defense manager of this cave."
  npc_override_gef_d01_i_quests_illusion_dungeons_should_i_say_s_like_6a1e13: "Should I say it's like water and oil? There's a section where they never mix."
  npc_override_gef_d01_i_quests_illusion_dungeons_should_sirood_come_back_ba60c5: "Should Sirood come back safely?"
  npc_override_gef_d01_i_quests_illusion_dungeons_shouldn_t_you_say_yourse_cc718f: "Shouldn't you say that yourself first?"
  npc_override_gef_d01_i_quests_illusion_dungeons_show_me_piece_let_me_0a81ad: "Show me the piece. Let me take a look."
  npc_override_gef_d01_i_quests_illusion_dungeons_showed_received_gein_jer_7971f7: "- Showed the ^4d4dff{0}^000000 received from Gein to Jerrymon. - "
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_a02d05: "Sigh..."
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_all_because_you_idi_b4b916: "Sigh, this is all because of you, idiot."
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_alright_i_ll_61408b: "...Sigh. Alright, I'll do it."
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_anyway_lizard_exist_f2c465: "Sigh, anyway, that lizard does exist inside this cave. If you want to see it, then press down on all 4 Orbs of Seal in the center of the cave within 30 seconds. That'll make it come out of hiding."
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_i_t_think_better_bca00c: "But... Sigh, I can't think of a better solution."
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_knucklehead_touched_a13cbf: "Sigh... This knucklehead touched something he shouldn't."
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_maybe_they_all_forg_eb2a94: "Sigh, maybe they all forgot about me, as if I never existed. That's what pains me the most."
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_vrid_cf962e: "Sigh. This is Vrid."
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_whatever_please_hel_f9adb2: "Sigh, whatever. Please help them."
  npc_override_gef_d01_i_quests_illusion_dungeons_sigh_you_re_lucky_i_3944df: "...Sigh. You're lucky I'm too kind to just leave you here."
  npc_override_gef_d01_i_quests_illusion_dungeons_simple_quests_we_prepare_3d4f9c: "For simple quests, we have prepared a request board, so you can find them and report them to me."
  npc_override_gef_d01_i_quests_illusion_dungeons_since_fake_blood_pure_dr_fcc541: "But since this fake blood is not pure, drinking it regularly causes your body to accumulate toxins, which drive you insane until they are completely purged from your system."
  npc_override_gef_d01_i_quests_illusion_dungeons_since_he_said_he_ranger_5ebd92: "Since he said he was a ranger who injured his left arm, it can't be that he's the only friend he's ever seen."
  npc_override_gef_d01_i_quests_illusion_dungeons_since_we_re_underground_bece8c: "Since we're underground, it's too dark for me to write and read. I have a lot of information that I want to catalog, but I keep misspelling words because I can't see them clearly."
  npc_override_gef_d01_i_quests_illusion_dungeons_since_you_ve_been_hired_ee4bc3: "Since you've been hired by the village, I'd like you to work hard and lighten the burden a bit. It's really hard these days. Please."
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_ah_i_think_i_0e2a8f: "Sirood... ah, I think I know who it is."
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_back_us_18c786: "Sirood is back with us."
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_e5a5ed: "Sirood...?"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_greeted_me_as_if_bfa6f5: " - Sirood greeted me as if he had been waiting. -"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_s_fishing_pole_ri_df2a33: "Sirood's fishing pole has risen above sea level. His item was nowhere to be found during the search!"
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_s_fishing_rod_fou_ee7908: "Sirood's fishing rod was found."
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_s_passion_fishing_9cda94: "Sirood's passion for fishing was to the point that he invited us to go fishing even in the rain and wind."
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_s_sake_fa0ab2: "But for Sirood's sake..."
  npc_override_gef_d01_i_quests_illusion_dungeons_sirood_went_fishing_alon_05b8ac: "Sirood went fishing alone and we haven't seen him since..."
  npc_override_gef_d01_i_quests_illusion_dungeons_sister_gem_just_waste_ti_948f03: "Sister Gem, this is just a waste of time. They're going to kill us the first chance they get. Let's get rid of of them before they do!"
  npc_override_gef_d01_i_quests_illusion_dungeons_sister_gem_please_listen_cddb09: "Sister Gem, please listen to me!"
  npc_override_gef_d01_i_quests_illusion_dungeons_sister_marina_you_seen_m_f90113: "Sister Marina, have you seen the mushrooms in this place? They're not like the mushrooms we know. They're miniature bombs that blow up when touched."
  npc_override_gef_d01_i_quests_illusion_dungeons_sisters_let_me_talk_your_a23a9e: "Sisters, let me talk. Your tendency to jump to conclusions is not helping this situation."
  npc_override_gef_d01_i_quests_illusion_dungeons_smell_salty_wind_lifted_a8be10: " - ^424242The smell of salty wind lifted the hem of my clothing. You can hear the waves of Alberta Harbor and the sound of seagulls....^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_smells_delicious_looks_s_bbd855: "It smells delicious. It looks so delicious. Please give it to me. Hungry. Hurry."
  npc_override_gef_d01_i_quests_illusion_dungeons_sniff_i_smell_humans_s_b37025: "Sniff.. I can smell the humans. It's not time to run into them yet. Let's go."
  npc_override_gef_d01_i_quests_illusion_dungeons_sniff_way_smell_coming_w_e9f8f4: "*Sniff* This way! The smell is coming from this way!"
  npc_override_gef_d01_i_quests_illusion_dungeons_snort_b64258: "*Snort*"
  npc_override_gef_d01_i_quests_illusion_dungeons_snort_if_i_drink_anythin_bf2b4c: "*Snort* If I drink anything because I'm hungry, I wouldn't be any better than those Matte Drainliars now, would I?"
  npc_override_gef_d01_i_quests_illusion_dungeons_snort_you_t_beat_mushroo_5e70c5: "*Snort* You can't beat mushrooms, but you can save vampires."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_c7572d: "So..."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_chunghae_investigate_75d99a: "so Chunghae can investigate it."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_either_we_went_alone_709e6e: "So either we went alone or he went alone... One day he saw someone there who looked just like him."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_he_promised_then_one_2c7936: "So he ^0000cdpromised^000000. Then one day, some people came here looking for him, and they fought."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_how_acid_b65b5b: "So how was Acid?"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_i_m_asking_adventurer_22f2a7: "So I'm asking this adventurer. You keep telling me don't do this, don't do that. Is there anything I can do without you saying no?"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_i_m_thinking_could_d64c66: "So I'm thinking... Could you bring me some more today? I need ^0000cd10 Dried Yggdrasil Leaves and 10 Suspicious Pentacles^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_i_pulled_my_hair_9a20cf: "So... I pulled my hair out and looked into it."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_i_want_save_all_be0e25: "So I want to save all life. Those who have flowed in and even those trapped by the burden forever."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_mm_our_new_friend_827b97: "So, mm... Our new friend..."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_they_ve_come_true_32229f: "So They've come true."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_we_re_resorting_brute_5f1a86: "So we're resorting to brute force. You want me to go first? Coward! Sigh... Please be gentle? no, hit me with your best shot!"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_we_ve_come_agreement_9c5b71: "So we've come to an agreement. We'll leave now."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_what_about_76f510: "So, what is this about?"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_what_did_look_like_bb8650: "So what did it look like?"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_what_s_really_dangero_c2c3a1: "So what's really dangerous right now..."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_what_you_want_ab6443: "So what do you want..."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_when_my_first_nightma_376e52: "So when my first nightmare occurred, I thought it was under the same boat as the others."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_arguing_about_whi_b352de: "So were you arguing about which one of you should go to that place?"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_come_agreement_751fa3: "So have you come to an agreement?"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_help_me_bit_917802: "So, can you help me a bit more?"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_keep_eye_us_8716fb: "So you can keep an eye on us. Drac, I can't take this anymore!"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_re_hating_your_3e1ddf: "So you're hating your own kind."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_re_hurry_leave_cfbec8: "So, you're in a hurry to leave. Did something happen?"
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_re_okay_adventure_bc05d9: "So you're okay with this adventurer reading it, but not me."
  npc_override_gef_d01_i_quests_illusion_dungeons_so_you_re_saying_they_c0590a: "So you're saying they really are innocent."
  npc_override_gef_d01_i_quests_illusion_dungeons_sob_164784: "Sob!"
  npc_override_gef_d01_i_quests_illusion_dungeons_some_mages_decided_erect_567025: "Some mages decided to erect an ivory tower of their own. They searched everywhere in the continent and settled on the ground above these catacombs."
  npc_override_gef_d01_i_quests_illusion_dungeons_some_quests_progress_d41bdd: "Some quests are in progress."
  npc_override_gef_d01_i_quests_illusion_dungeons_some_them_nine_tailed_fo_ab2970: "Some of them were the nine-tailed foxes. The foxes anger is beyond normal."
  npc_override_gef_d01_i_quests_illusion_dungeons_something_bit_sinister_i_d77102: "Something was a bit sinister, but I think it will be quite profitable this time, youngest."
  npc_override_gef_d01_i_quests_illusion_dungeons_something_different_atmo_e54261: "But something was different, the atmosphere."
  npc_override_gef_d01_i_quests_illusion_dungeons_something_ignited_their_e42dec: "And something has ignited their pent-up anger."
  npc_override_gef_d01_i_quests_illusion_dungeons_something_s_weird_here_d0c3de: "Something's weird here"
  npc_override_gef_d01_i_quests_illusion_dungeons_something_shiny_same_fee_5a04d7: "Something shiny and has the same feeling of Sirood's fishing rod, so I secured it for now."
  npc_override_gef_d01_i_quests_illusion_dungeons_sometimes_direct_approac_9418cd: "Sometimes the direct approach is best. Let's try to hit the ice until it breaks. Try Zeith's first, please."
  npc_override_gef_d01_i_quests_illusion_dungeons_sometimes_if_you_defeat_e040b4: "Sometimes if you defeat {0} or {1} who haunt the Garden of Perception"
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_bother_you_b7940c: "Sorry to bother you."
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_danger_5b27ab: "...Sorry for the danger."
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_i_don_t_want_1c4636: "Sorry, but I don't want to get between you two. You both have a point, and I can't side with either one of you."
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_i_m_bit_busy_ef9294: "Sorry. I'm a bit busy right now..."
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_i_m_busy_edcbb8: "Sorry but I'm busy."
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_sudden_request_5feb86: "Sorry for the sudden request."
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_wait_minute_443b36: "Sorry, wait a minute."
  npc_override_gef_d01_i_quests_illusion_dungeons_sorry_wait_minute_fdaf11: "sorry, wait a minute."
  npc_override_gef_d01_i_quests_illusion_dungeons_soul_linkers_communicate_c5d30d: "Soul Linkers communicates with the spirits for a living, Having nightmares is just occurs normally."
  npc_override_gef_d01_i_quests_illusion_dungeons_sounds_like_conversation_96e044: "It sounds like a conversation between a Wootan or Megalith monster targeting the village."
  npc_override_gef_d01_i_quests_illusion_dungeons_sounds_like_something_si_0fe458: "That sounds like something similar could happen in the future, right?"
  npc_override_gef_d01_i_quests_illusion_dungeons_source_power_419ae2: "Source of Power"
  npc_override_gef_d01_i_quests_illusion_dungeons_speak_sleep_ce763d: "Speak and sleep..."
  npc_override_gef_d01_i_quests_illusion_dungeons_spell_protect_you_moment_abcafe: "A spell that will protect you for a moment."
  npc_override_gef_d01_i_quests_illusion_dungeons_spirits_moonlight_flower_707970: "The spirits of the Moonlight Flowers are still living in the past."
  npc_override_gef_d01_i_quests_illusion_dungeons_stand_line_b90e03: "Stand in line!"
  npc_override_gef_d01_i_quests_illusion_dungeons_stay_away_me_i_won_0e4246: "Stay away from me, and I won't hurt you."
  npc_override_gef_d01_i_quests_illusion_dungeons_stay_here_5113d6: "Stay here."
  npc_override_gef_d01_i_quests_illusion_dungeons_steven_7ff5ad: "Steven!"
  npc_override_gef_d01_i_quests_illusion_dungeons_steven_brought_because_h_d9ea62: "Steven brought it because he said he was looking for something salty to eat at home."
  npc_override_gef_d01_i_quests_illusion_dungeons_steven_cough_e7766c: "Steven is...cough"
  npc_override_gef_d01_i_quests_illusion_dungeons_steven_kind_guy_cough_co_0ca875: "^ff0000Steven^000000 is not that kind of guy...Cough cough"
  npc_override_gef_d01_i_quests_illusion_dungeons_still_good_idea_get_clos_258fca: " - ^424242Still a good idea to not get close. Let's wait for a day. After dawn, come back again.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_still_mirko_too_weak_com_f4fb59: "Still, Mirko was too weak to come in here to search, so it was pointless to worry about."
  npc_override_gef_d01_i_quests_illusion_dungeons_still_satisfied_let_s_co_0e6992: " - ^424242Still... satisfied. Let's come back after dawn.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_still_village_chief_best_026ba1: "Still, the village chief, the best elder in the village, seems to have suffered less damage because he was calm. Thanks for the story."
  npc_override_gef_d01_i_quests_illusion_dungeons_stone_magical_power_8bc2c1: "A stone with magical power?"
  npc_override_gef_d01_i_quests_illusion_dungeons_stop_dumping_things_me_e95dcd: "...Stop dumping things on me!"
  npc_override_gef_d01_i_quests_illusion_dungeons_stop_i_didn_t_say_ce5ee5: "Stop? I didn't say anything wrong. You are going to leave and forget everything soon. You will never come back.... right?"
  npc_override_gef_d01_i_quests_illusion_dungeons_stop_invasion_f8ba8e: "Will not stop the invasion!"
  npc_override_gef_d01_i_quests_illusion_dungeons_stop_saying_1d4e31: "Stop saying that."
  npc_override_gef_d01_i_quests_illusion_dungeons_story_so_unrealistic_bor_b577af: "But that story was so unrealistic and boring that it's not worth remembering. A lizard is just a lizard, right?"
  npc_override_gef_d01_i_quests_illusion_dungeons_story_you_just_told_me_4e9c6b: "The story you just told me was really helpful. Thank you, adventurer."
