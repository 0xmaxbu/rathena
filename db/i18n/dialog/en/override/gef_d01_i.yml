  npc_override_gef_d01_i_quests_illusion_dungeons_while_you_re_hunt_matte_cd5384: "While you're at it, hunt the ^0000cdMatte Drainliars^000000 around us. There are at least ^0000cd10^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_while_you_re_please_hunt_4c7ffd: "And while you're at it, please hunt ^0000cd10 Sweet Nightmares^000000 as well. I want to know how that affects dreams."
