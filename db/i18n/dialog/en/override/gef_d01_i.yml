  npc_override_gef_d01_i_quests_illusion_dungeons_you_seen_briashen_yet_e2ee09: "Have you seen Briashen yet?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_seen_person_aee24b: "Have you seen this person?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_seen_someone_named_m_c2b1bf: "Have you seen someone named Muyeon?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_should_able_your_eye_090cc7: "You should be able to do that with your eyes closed. You're a wizard. Didn't you learn how to summon light? But of course, if you use magic in front of me, I'll burn you to ashes."
