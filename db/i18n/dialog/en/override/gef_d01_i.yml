  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_now_bde8f8: "Go back now."
  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_s_dangerous_e45f02: "Go back. It's dangerous..."
  npc_override_gef_d01_i_quests_illusion_dungeons_go_back_s_dangerous_here_8e8d05: "Go back. It's dangerous here."
