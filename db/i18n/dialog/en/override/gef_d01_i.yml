  npc_override_gef_d01_i_quests_illusion_dungeons_you_too_many_items_f33594: "- You have too many items. -"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_turning_around_after_e1672a: "Are you turning around after hearing about this heartbreaking story and mysterious clue..."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_two_get_along_as_a2654d: "You two get along as well as I remember."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_two_still_fighting_9e7ab8: "Are you two still fighting?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ve_collected_all_98d7a0: "You've collected all the {0}!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ve_finished_dealing_55fc2e: "You've finished dealing with all the deep sea creatures, thank you for your hard work."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ve_seen_those_nightm_e53048: "You've seen those Nightmares and Drainliars, right? Did you notice how they look different from the kinds outside this place? Why do you think that is?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_ve_shown_me_adventur_4c4e30: "You've shown me, adventurer, something I wouldn't have seen. I'm just here to tell you what I remember..."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_want_enter_notebook_5173ae: "Do you want to enter the notebook? Are you ready?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_want_get_frozen_agai_269400: "Do you want to get frozen again?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_want_leave_27af0b: "Do you want to leave?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_want_me_get_their_313c83: "Do you want me to ^0000cdget their manes for you^000000?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_want_my_help_385b0b: "Do you want my help?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_want_still_someone_g_c4199f: "You want that, but still someone is going to come back here."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_we_must_been_really_6cbc26: "You have? We must have been really loud. I suppose that wasn't very smart of us."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_well_you_re_more_9e8927: "You? Well, you're more reliable than this sister here, but are you sure?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_who_saved_aylvar_tha_0ab7e2: "It was you who saved Aylvar. Thank you for helping my friend!"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_won_t_caught_if_ad5378: "You won't be caught if you bite on that and hold your breath."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_worked_hard_a77aac: "You worked hard."
  npc_override_gef_d01_i_quests_illusion_dungeons_you_worried_about_me_as_1a061f: "You were worried about me, but this is as far you were willing to follow me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_you_going_2342e8: "You? Are ^BDBDBDyou^000000 going?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_you_re_no_better_4fa1bb: "You! You're no better than them!"
  npc_override_gef_d01_i_quests_illusion_dungeons_young_man_disappeared_ag_9910eb: "The young man has disappeared again. I need to tell Mr. Luanda."
  npc_override_gef_d01_i_quests_illusion_dungeons_young_man_disappeared_di_352b57: "The young man has disappeared. Didn't you say that this young man was Mr. Luanda? I should tell Luanda what I've been through."
  npc_override_gef_d01_i_quests_illusion_dungeons_young_man_finished_what_541d43: "The young man finished what he was saying and disappeared. He must have followed his brothers who went before him. What the hell is he doing?"
  npc_override_gef_d01_i_quests_illusion_dungeons_young_scholar_followed_s_cac945: "A young scholar followed the soldier, but she doesn't seem reliable at all."
  npc_override_gef_d01_i_quests_illusion_dungeons_your_friend_trouble_c90bd3: "Is your friend in trouble?"
  npc_override_gef_d01_i_quests_illusion_dungeons_your_heart_i_t_even_3bb5cc: "Your heart... I can't even imagine your sister-in-law's... whoo... your sorrow..."
  npc_override_gef_d01_i_quests_illusion_dungeons_your_name_ce3cd6: "Your name is {0}?"
  npc_override_gef_d01_i_quests_illusion_dungeons_your_request_been_receiv_d731b9: "Your request has been received. Please report to ^FF0000Defense Manager Luanda^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_your_request_progress_4728ab: "Your request is in progress."
  npc_override_gef_d01_i_quests_illusion_dungeons_your_strength_isn_t_enou_3ff2ab: "Your strength isn't enough to cross to the lower levels."
  npc_override_gef_d01_i_quests_illusion_dungeons_zeith_rolled_his_eyes_vr_8912e8: "^ff0000Zeith rolled his eyes, but Vrid ignored him and continued.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_zeith_stared_vrid_incred_918108: "^ff0000Zeith stared at Vrid with incredulity in his eyes.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_zombies_mushrooms_same_d_7d4ea5: "Zombies and mushrooms. Same difference to me."
