  npc_override_gef_d01_i_quests_illusion_dungeons_why_you_want_quit_magic_cece54: "Why, do you want to quit magic and turn to thievery?"
  npc_override_gef_d01_i_quests_illusion_dungeons_widest_deepest_known_tre_f74d34: "The widest and deepest known trench is the ^4d4dffBahia Trench^000000 near Izlude."
  npc_override_gef_d01_i_quests_illusion_dungeons_windy_day_i_had_been_be5605: "That windy day... I had been feeling very guilty for not stopping Sirood from going fishing."
