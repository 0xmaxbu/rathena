  npc_override_gef_d01_i_quests_illusion_dungeons_could_you_get_me_shining_790b15: "Could you get me shining spores again today?"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_you_go_check_up_c467a0: "Could you go check up ^0000FFMuyeon^000000 for us?"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_you_hunt_some_angr_b95646: "Could you hunt some ^4d4dffAngry Nine Tails^000000?"
  npc_override_gef_d01_i_quests_illusion_dungeons_could_you_leave_fishing_baadae: "Could you leave this fishing rod with me? I think I can figure something out if I extract this sea water and turn it into essence."
  npc_override_gef_d01_i_quests_illusion_dungeons_could_you_light_twigs_pl_e58e54: "Could you light the twigs and place them around me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_couldn_t_all_three_khahr_ec7a6d: "Couldn't all three be the Khahris instead of the one who looked like him?"
  npc_override_gef_d01_i_quests_illusion_dungeons_course_be6167: "Of course."
  npc_override_gef_d01_i_quests_illusion_dungeons_course_i_come_back_s_1b4f3f: "Of course I have to come back. It's a place where I can discover all new facts about the history of Turtle Island."
  npc_override_gef_d01_i_quests_illusion_dungeons_course_i_could_wrong_af5bf7: "Of course, I could be wrong."
  npc_override_gef_d01_i_quests_illusion_dungeons_course_i_didn_t_come_559207: "Of course, I didn't come here for the treasures. We happened to be in the area, and I just wanted to check the place out."
  npc_override_gef_d01_i_quests_illusion_dungeons_course_only_his_servants_c42018: "Of course not. Only His servants can hear him."
  npc_override_gef_d01_i_quests_illusion_dungeons_curiosity_what_fuels_our_9b35cc: "Curiosity is what fuels our life. It's the seed of development. Adventurer, would you hesitate to go to a new world because it's dangerous?"
  npc_override_gef_d01_i_quests_illusion_dungeons_cursed_lizard_roams_abou_07c439: "That cursed lizard roams about this cave, still wanting to go outside. Isn't that tragic? I was only trying to free him, and in return, he froze me in a block of ice!"
  npc_override_gef_d01_i_quests_illusion_dungeons_cute_horns_af9ffc: "...cute horns..."
  npc_override_gef_d01_i_quests_illusion_dungeons_d_great_if_you_join_c53c98: "It'd be great if you join us again. See you at the ruined village."
  npc_override_gef_d01_i_quests_illusion_dungeons_damn_damn_8bcf12: "Damn ^BDBDBDit^000000... ^BDBDBDDamn^000000 it..."
  npc_override_gef_d01_i_quests_illusion_dungeons_damn_uh_mon_monster_2aafcf: "The damn ^BDBDBDuh^000000.. mon..^BDBDBDmonster^000000..."
  npc_override_gef_d01_i_quests_illusion_dungeons_damn_you_don_t_look_16b937: "Damn ^BDBDBDyou^000000! Don't ^BDBDBDlook^000000 at me ^BDBDBDlike^000000 that... ^BDBDBDDon't^000000 look!"
  npc_override_gef_d01_i_quests_illusion_dungeons_damnuh_mon_dmonster_aee3af: "The damn^BDBDBDuh^000000 mon..^BDBDBDDmonster^000000..."
  npc_override_gef_d01_i_quests_illusion_dungeons_damnuh_mon_dmonster_b1d8d3: "The damn^BDBDBDuh^000000.. mon..^BDBDBDDmonster^000000..."
  npc_override_gef_d01_i_quests_illusion_dungeons_damnuh_mon_dmonster_b3e673: "The damn^BDBDBDuh..^000000 Mon..^BDBDBDDmonster^000000..."
  npc_override_gef_d01_i_quests_illusion_dungeons_damnuh_mon_monster_99334a: "The damn^BDBDBDuh^000000.. mon.. ^FF0000{0} monster^000000..."
  npc_override_gef_d01_i_quests_illusion_dungeons_dangerous_if_left_unatte_51310a: "It would be dangerous if left unattended..."
  npc_override_gef_d01_i_quests_illusion_dungeons_day_over_you_two_stay_615ff1: "The day is over and you two stay together. I'll give you a new spell."
  npc_override_gef_d01_i_quests_illusion_dungeons_day_sirood_went_missing_968305: "The day Sirood went missing was exactly the same rainy and windy day. I put on my raincoat and went to go fishing."
  npc_override_gef_d01_i_quests_illusion_dungeons_dead_belong_ground_we_he_e7bf58: "The dead belong in the ground. We are here to ^0000cdput the undead back to eternal sleep^000000."
  npc_override_gef_d01_i_quests_illusion_dungeons_dead_belong_ground_you_r_754a6c: "The dead belong in the ground, and you're one of them. What do you think you are?"
  npc_override_gef_d01_i_quests_illusion_dungeons_dead_don_t_talk_there_cc8706: "The dead don't talk. There's nothing I can find out from them."
  npc_override_gef_d01_i_quests_illusion_dungeons_dead_shall_return_earth_3d8762: "The dead shall return to the earth!"
  npc_override_gef_d01_i_quests_illusion_dungeons_decline_e87fe0: "Decline."
  npc_override_gef_d01_i_quests_illusion_dungeons_delicious_s_so_delicious_ec3eca: "Delicious. It's so delicious. Happy. It's really good."
  npc_override_gef_d01_i_quests_illusion_dungeons_depends_what_kind_cape_y_c479c4: "That depends on what kind of cape you want. Just know that it's tough to make stuff with hair."
  npc_override_gef_d01_i_quests_illusion_dungeons_did_he_go_hospital_b9649b: "Did he go to the hospital?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_i_ever_tell_you_d2ff28: "Did I ever tell you that the stone that contains my magic can measure the distance to me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_i_forget_something_p_463cbf: " - ^424242Did I forget something? ^0000CD{0} 5 pieces ^424242and ^0000CDkill 10 {1}.^000000 -"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_twins_find_out_leave_5648b6: "Did the twins find out and leave? Be patient.. They'll be back soon.."
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_come_help_us_f0dcc0: "Did you come to help us?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_find_him_2f57d9: "Did you find him?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_forget_what_i_cb61a2: "Or did you forget what I asked you to do?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_forget_why_broth_e820ca: "Did you forget why Brother Jojo wanted you to stay here and stay away from the notebook?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_get_payback_terr_a5c48e: "Did you get payback? To the ^BDBDBDterrible^000000 monsters?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_get_some_rest_000b3d: "Did you get some rest?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_get_their_blood_b59c3c: "Did you get it? But their blood is highly toxic. So I use these mushrooms to detoxify it."
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_guys_make_up_c64517: "Did you guys make up? Dracula, the worst is over. You just need to rest and regain your energy."
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_happen_hear_our_8f1c74: "Did you happen to hear our conversation?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_hear_82aaa9: "Did you hear that?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_just_call_me_fe60f5: "Did you just call me a disgusting animal?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_save_me_i_ec651e: "Did you... save me? I thought you wanted me to die."
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_see_65f051: "Did you see that?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_see_people_oh_0a6a8c: "Did you see people? Oh, you should have told me earlier. Where did you see them? Let's go and talk now!"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_see_real_thing_b987ea: "Did you see the real thing this time?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_see_too_c0164d: "Did you see that too?"
  npc_override_gef_d01_i_quests_illusion_dungeons_did_you_send_them_out_4daa1b: "Did you send them out?"
  npc_override_gef_d01_i_quests_illusion_dungeons_didn_t_you_say_you_0c3b6f: "Didn't you say you have to report back? Go to the exit. I smelled your friends there."
  npc_override_gef_d01_i_quests_illusion_dungeons_didn_t_you_see_injured_9ef6d8: "Didn't you see the injured ranger?"
  npc_override_gef_d01_i_quests_illusion_dungeons_didn_t_you_see_ranger_b7e7db: "Didn't you see a ranger named Briashen around here?"
  npc_override_gef_d01_i_quests_illusion_dungeons_didn_t_you_see_someone_0a0c80: "Didn't you see someone named Briashen around here?"
  npc_override_gef_d01_i_quests_illusion_dungeons_different_face_6d86d8: "Was it a different face?"
  npc_override_gef_d01_i_quests_illusion_dungeons_different_what_i_previou_ed4aa9: "But it was different from what I previously thought of humans. I was starting to understand them."
  npc_override_gef_d01_i_quests_illusion_dungeons_disappeared_9fd832: "Disappeared?"
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_change_fact_your_b7a12a: "But that doesn't change the fact that your existence in itself defies our god's will. We can't leave you alone."
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_guarantee_you_wo_396601: "That doesn't guarantee you won't in the future."
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_last_long_longer_367d8d: "It doesn't last long. The longer you stay here, the more you notice each other. Gradually."
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_matter_if_real_a2e5d3: "It doesn't matter if this is real or not. Watching my ancestors suffer is difficult."
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_matter_if_they_3db065: "It doesn't matter if they're real or not. They're just as threatening."
  npc_override_gef_d01_i_quests_illusion_dungeons_doesn_t_matter_if_they_aeb784: "It doesn't matter if they're real or not."
  npc_override_gef_d01_i_quests_illusion_dungeons_doll_we_made_alive_movin_bb6a6f: "The doll we made is alive and moving!"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_alarmed_you_may_bdae18: "^FF0000Don't be alarmed that you may breathe strangely.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_breathe_you_too_3c4e79: "Don't breathe. You too."
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_even_pat_me_b279b4: "Don't even pat me on the back..."
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_get_confused_0bcec1: "Don't get confused!"
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_look_my_treasure_08d4c2: "Don't look at my ^BDBDBDtreasure^000000! ^BDBDBDI^000000 won't let you!!!!! Munch, ^FF0000munch^000000, munch..."
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_surprised_his_sing_05db4f: "Don't be surprised. His singing voice really inspires courage and gives strength. He's here with us for a reason."
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_talk_me_294fc6: "Don't talk to me..."
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_talk_negatively_ev_cf4b40: "Don't talk negatively. Everyone's alive. Cancer is not alive..."
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_touch_bomi_she_83c5c5: "Don't touch Bomi... She... I... We don't want to hurt anyone... She's taught me that..."
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_worry_about_e7e356: "Don't worry about that."
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_worry_ffc806: "Don't worry."
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_worry_i_e0c5a2: "Don't worry. I will."
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_worry_myself_forge_9e5613: "Don't worry. {0} and myself will not forget about you Narin."
  npc_override_gef_d01_i_quests_illusion_dungeons_don_t_worry_s_nothing_5f77f8: "Don't worry, it's nothing serious, I think I'm looking at something stupid."
  npc_override_gef_d01_i_quests_illusion_dungeons_drac_let_s_go_i_60edd2: "Drac, let's go. I know you're not hurting anymore. We should really go back to our castle this time."
  npc_override_gef_d01_i_quests_illusion_dungeons_drac_they_won_t_leave_6b4847: "Drac, they won't leave us alone. Let's just get rid of them!"
  npc_override_gef_d01_i_quests_illusion_dungeons_dracula_dracula_let_me_h_82a25f: "Dracula! Dracula! Let me heal you!"
  npc_override_gef_d01_i_quests_illusion_dungeons_dracula_hang_drink_73f104: "Dracula, hang on. Drink this."
  npc_override_gef_d01_i_quests_illusion_dungeons_dracula_what_s_human_you_3f19c3: "Dracula, what's that human to you? Why do you insist on staying in a place like this"
  npc_override_gef_d01_i_quests_illusion_dungeons_dracula_why_c132a7: "...Dracula? Why?"
  npc_override_gef_d01_i_quests_illusion_dungeons_dracula_you_mean_dracula_2d3599: "Dracula? You mean the Dracula?"
  npc_override_gef_d01_i_quests_illusion_dungeons_dream_reality_2e10ee: "Is this a dream or reality..."
  npc_override_gef_d01_i_quests_illusion_dungeons_drivius_come_get_ca99e3: "Drivius! Come on get it!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_drove_me_sanity_sent_me_424e69: "It drove me from sanity and sent me going to the ruined village."
  npc_override_gef_d01_i_quests_illusion_dungeons_duration_vortex_very_sho_5d227f: "The duration of the vortex is very short. It took me 2 months just to put my fishing rod with my name on it into the vortex."
  npc_override_gef_d01_i_quests_illusion_dungeons_each_every_request_preci_2f072c: "Each and every request is precious. Thank you again and again."
  npc_override_gef_d01_i_quests_illusion_dungeons_eaylvar_s_voice_getting_cec974: " - ^424242EAylvar's voice is getting smaller and I felt dizzy. It's starting to smell like wet clay....^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_effective_nonetheless_yo_5f844e: "But effective nonetheless. You didn't know you could use them like that, did you?"
  npc_override_gef_d01_i_quests_illusion_dungeons_empty_hands_i_think_bulk_d6327e: " - ^424242With empty hands, I think of the bulky but warm piece left in my heart.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_enchant_large_boulder_ma_569084: "Enchant a large boulder and make it fall to the floor where the trench exists."
  npc_override_gef_d01_i_quests_illusion_dungeons_end_maya_ba8f4f: "But at the end Maya..."
  npc_override_gef_d01_i_quests_illusion_dungeons_enlightened_mage_looks_d_371f9f: "That ^0000CDenlightened mage^000000 looks dangerous."
  npc_override_gef_d01_i_quests_illusion_dungeons_enough_d5b216: "Not enough!!!^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_enter_garden_awareness_d9f9eb: "Enter the Garden of Awareness"
  npc_override_gef_d01_i_quests_illusion_dungeons_erm_how_i_get_hair_20f8be: "Erm, how can I get the hair? By hunting Matte Drainliars?"
  npc_override_gef_d01_i_quests_illusion_dungeons_erm_you_want_teach_me_6e4fec: "Erm, you want to teach me?"
  npc_override_gef_d01_i_quests_illusion_dungeons_err_then_i_ll_investigat_68c4a0: "Err, then I'll have to investigate something else."
  npc_override_gef_d01_i_quests_illusion_dungeons_essence_turtle_so_i_eat_3b5a9e: "The essence is a turtle, so I can eat but I couldn't hunt alone, so I starved all this time...."
  npc_override_gef_d01_i_quests_illusion_dungeons_estopped_handing_piece_o_c31cdb: " - ^424242EStopped handing the piece over.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_eternal_life_22bbd2: "Eternal life."
  npc_override_gef_d01_i_quests_illusion_dungeons_eternal_life_892ed1: "Eternal life...!"
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_i_forget_you_127f39: "Even if I forget you brother, don't go away...please."
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_s_my_dream_859922: "Even if it's not for my dream, a cloaking cape will come in handy in various situations."
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_they_try_attack_77b3a4: "Even if they try to attack us, there are more of us than them."
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_we_t_talk_f5ccd5: "Even if we can't talk, I can still figure something out by looking at people's lifestyle."
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_you_busy_please_8a7f34: "Even if you are busy, please spare me a moment of your time."
  npc_override_gef_d01_i_quests_illusion_dungeons_even_if_you_won_t_b15ccd: "Even if you won't, we're not going to let you go! Your existence in itself goes against His will!"
  npc_override_gef_d01_i_quests_illusion_dungeons_even_their_sap_cannot_co_4e6dc5: "But even their sap cannot completely remove the toxins in the blood. And when I ingest too much toxins..."
  npc_override_gef_d01_i_quests_illusion_dungeons_even_though_bomi_strong_d909bc: "Even though Bomi was a strong woman, her body was failing her. It pained me to see her waste away day by day. I offered her eternal life, and she rejected it."
  npc_override_gef_d01_i_quests_illusion_dungeons_even_though_doesn_t_chan_523c12: "even though it doesn't change the fact that you woke the dead."
  npc_override_gef_d01_i_quests_illusion_dungeons_events_take_place_inside_1ade7b: "^ff0000But the events that take place inside it aren't always the same. Is it possible that spacetime inside this cave is still warping? Will I also be affected by that?^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_every_day_i_spend_most_0aa495: "Every day, I spend most of my energy keeping the bloodthirsty bats at bay. I'd get killed if I didn't stay near the exit."
  npc_override_gef_d01_i_quests_illusion_dungeons_every_time_i_performed_r_111acd: "And, every time I performed the ritual, I had nightmares about the resentful spirits and wailing nine-tailed foxes."
  npc_override_gef_d01_i_quests_illusion_dungeons_every_time_someone_tries_53270c: "Every time someone tries to preform a ritual to the fox beads, they get nightmares."
  npc_override_gef_d01_i_quests_illusion_dungeons_everyone_calm_hell_down_ef6aa1: "Everyone, calm the hell down!"
  npc_override_gef_d01_i_quests_illusion_dungeons_everyone_hush_i_smell_so_f26567: "Everyone, hush. I smell something."
  npc_override_gef_d01_i_quests_illusion_dungeons_everyone_stands_line_day_3109ba: "Everyone stands in line for days waiting for their turn."
  npc_override_gef_d01_i_quests_illusion_dungeons_everything_place_interes_71205d: "Everything in this place is interesting. Especially those Sweet Nightmares. They're full of contradictions."
  npc_override_gef_d01_i_quests_illusion_dungeons_everything_s_just_same_a_8ce59c: "Everything's just the same as when you left it, but I want to clear this place,"
  npc_override_gef_d01_i_quests_illusion_dungeons_everything_you_say_sound_4cfde0: "Everything you say sounds far-fetched to me."
  npc_override_gef_d01_i_quests_illusion_dungeons_evidence_eradication_meg_2a6ffc: "^FF0000Evidence of eradication of Megaliths^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_evidence_eradication_meg_c1a80d: "^FF0000Evidence of eradication of megaliths^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_evidence_extermination_w_61c5e7: "^FF0000Evidence of extermination of Wootan^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_evil_hurts_1934cd: "Evil! It hurts!"
  npc_override_gef_d01_i_quests_illusion_dungeons_excuse_me_471adf: "Excuse me."
  npc_override_gef_d01_i_quests_illusion_dungeons_excuse_me_i_came_here_0f1c43: "Excuse me. I came here on behalf of Father Grimm."
  npc_override_gef_d01_i_quests_illusion_dungeons_explained_everything_mir_2dba48: "== Explained everything to Mirko and Yolanda. =="
  npc_override_gef_d01_i_quests_illusion_dungeons_father_grimm_must_gettin_193204: "Father Grimm must be getting anxious by now."
  npc_override_gef_d01_i_quests_illusion_dungeons_father_grimm_put_book_do_598e97: "This does it! Father Grimm, put that book down. Let's fight!"
  npc_override_gef_d01_i_quests_illusion_dungeons_feel_free_tell_me_if_66e285: "Feel free to tell me if you change your mind!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_feels_like_you_re_walkin_e0967f: "It feels like you're walking in a hazy... dream?"
  npc_override_gef_d01_i_quests_illusion_dungeons_feels_same_as_last_time_3c0cd2: "It feels the same as the last time I threw a pebble into the Bahia Trench.."
  npc_override_gef_d01_i_quests_illusion_dungeons_few_days_ago_as_soon_a45798: "A few days ago, as soon as work was over... he left... he said he would come back..."
  npc_override_gef_d01_i_quests_illusion_dungeons_few_days_ago_b6d516: "But a few days ago..."
  npc_override_gef_d01_i_quests_illusion_dungeons_fight_broken_out_somewhe_f9bcf4: "A fight has broken out somewhere over there. Don't you want to go check?"
  npc_override_gef_d01_i_quests_illusion_dungeons_fight_no_what_if_people_68ddfc: "A fight? ...No. What if the people from the Church found Bomi?"
  npc_override_gef_d01_i_quests_illusion_dungeons_fight_oh_no_we_d_44d11c: "A fight? Oh no, we'd better hurry!"
  npc_override_gef_d01_i_quests_illusion_dungeons_finally_day_come_when_we_9f3011: "Finally the day has come when we will rise again!"
  npc_override_gef_d01_i_quests_illusion_dungeons_finally_i_got_finally_i_7b190e: "Finally ^BDBDBDI^000000 got ^BDBDBDit^000000... Finally ^BDBDBDI^000000 got..."
  npc_override_gef_d01_i_quests_illusion_dungeons_finally_they_all_left_cl_9c38ee: "Finally, they all left. That was close."
  npc_override_gef_d01_i_quests_illusion_dungeons_finally_you_say_somethin_ec274a: "Finally, you say something that makes sense."
  npc_override_gef_d01_i_quests_illusion_dungeons_find_briashen_his_compan_7bc90c: "Find Briashen and his companions."
  npc_override_gef_d01_i_quests_illusion_dungeons_fine_arrogant_think_free_801ce2: "......Fine. Arrogant or not. Think freely. I don't care anyway."
  npc_override_gef_d01_i_quests_illusion_dungeons_fire_1a764e: "Fire?"
  npc_override_gef_d01_i_quests_illusion_dungeons_first_let_s_what_i_408bcc: "First, let's do what I can. Huh? You?"
  npc_override_gef_d01_i_quests_illusion_dungeons_first_time_my_long_exist_760b59: "For the first time in my long existence, I really thought about humans, and what made them who they were. They also have this impulse to help others, expecting nothing in return."
  npc_override_gef_d01_i_quests_illusion_dungeons_fishing_rod_belongs_my_f_2f6c67: "This fishing rod belongs to my friend <FONT COLOR = 4D4DFF><FONT SIZE = 16><B>Sirood</FONT></FONT></B> who went missing three months ago. I found something!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_fishing_rod_made_sirood_228ce9: "This fishing rod was made by Sirood himself, so it is the only one. You can see the initials on the handle here, S.R.D!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_fishing_rod_submerged_wa_ba2e89: "This fishing rod... It was submerged in the water for 3 months, but it was found in its original form, or worse, in a state of disrepair."
  npc_override_gef_d01_i_quests_illusion_dungeons_flaw_hehe_3a6072: "Flaw... Hehe... ."
  npc_override_gef_d01_i_quests_illusion_dungeons_follow_strong_leader_rec_2cf774: "Follow a strong leader? Recently, I felt that the movements of these guys are disturbingly orderly..."
  npc_override_gef_d01_i_quests_illusion_dungeons_follow_you_around_curios_e9a29b: "It will follow you around. Curiosity killed the cat. Don't look into something that is unclear. Don't look back, or talk behind someone's back."
  npc_override_gef_d01_i_quests_illusion_dungeons_font_color_e_f_f_542fbb: "<FONT COLOR = E68F8F><FONT SIZE = 16><B>Wow!!!!!!</FONT></FONT></B>"
  npc_override_gef_d01_i_quests_illusion_dungeons_font_color_e_f_f_95b5d5: "<FONT COLOR = E68F8F><FONT SIZE = 16><B>Ahhhhhhh!!!!!!</FONT></FONT></B>"
  npc_override_gef_d01_i_quests_illusion_dungeons_font_color_e_f_f_a6b74b: "<FONT COLOR = E68F8F><FONT SIZE = 16><B>Uwachachaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa!!!!!!</FONT></FONT></B>"
  npc_override_gef_d01_i_quests_illusion_dungeons_force_so_strong_even_we_cea540: "A force so strong that even we can feel it! Voila!"
  npc_override_gef_d01_i_quests_illusion_dungeons_forget_everything_49e15b: "And forget everything."
  npc_override_gef_d01_i_quests_illusion_dungeons_forget_no_matter_how_mis_8a088a: "Forget it. No matter how miserable I am, I don't need your help!"
  npc_override_gef_d01_i_quests_illusion_dungeons_forget_shameful_past_bei_ba7143: "Forget the shameful past of being trapped in the dark and damp ground."
  npc_override_gef_d01_i_quests_illusion_dungeons_four_us_sirood_raket_gei_70bfc9: "The four of us, Sirood, Raket, Gein, and I often enjoyed fishing."
  npc_override_gef_d01_i_quests_illusion_dungeons_foxes_spirits_getting_mo_7f729c: "The foxes spirits are getting more resentful by time, and no one knows the reason why."
  npc_override_gef_d01_i_quests_illusion_dungeons_furious_king_froze_cave_2ad5a9: "The furious king froze the cave and summoned formidable monsters in it, so no one would ever dare invade his kingdom again. Tragic, isn't it??"
  npc_override_gef_d01_i_quests_illusion_dungeons_gasp_am_i_going_die_0d0875: "*Gasp* Am I going to die? Am I? I can't believe I'm going to die in a place like this!"
  npc_override_gef_d01_i_quests_illusion_dungeons_gein_gasps_say_hello_his_5c5dc5: "- Gein gasps to say hello to his two friends. - "
  npc_override_gef_d01_i_quests_illusion_dungeons_gein_started_talking_aga_4fc8af: "- Gein started talking again after wiping away tears for a moment. -"
  npc_override_gef_d01_i_quests_illusion_dungeons_geology_survey_cec0da: "Geology Survey"
  npc_override_gef_d01_i_quests_illusion_dungeons_get_out_789c66: "and get out!"
  npc_override_gef_d01_i_quests_illusion_dungeons_get_rid_monsters_munch_m_d7347d: "Get rid of 10... monsters! Munch, ^FF0000munch munch^000000... Get ^BDBDBDrid^000000 of them!!!"
  npc_override_gef_d01_i_quests_illusion_dungeons_get_some_rest_20fbdd: "Get some rest"
  npc_override_gef_d01_i_quests_illusion_dungeons_girl_glanced_toward_back_bd1f30: " - ^424242The girl glanced toward the back of where she was standing. Looking closely, it seems that something reddish is floating in front of the black hole. Let's go and look.^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_girl_said_briefly_stoppe_5debef: " - ^424242The girl said briefly and stopped talking. She looks sad....^000000 - "
  npc_override_gef_d01_i_quests_illusion_dungeons_give_him_money_too_3969bd: "Give him this money too."
  npc_override_gef_d01_i_quests_illusion_dungeons_give_me_my_treasure_03e986: "^FF0000Give me^000000! My treasure!"
  npc_override_gef_d01_i_quests_illusion_dungeons_give_me_pieces_8a9b7a: "Give me. ^0000CDThe {0}. 10 pieces.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_give_me_sec_i_need_284a83: "...Give me a sec. I need time to think clearly. It's been a long time not talking...."
  npc_override_gef_d01_i_quests_illusion_dungeons_glad_see_you_again_i_cabae3: "Glad to see you again. I have reported the information to the Knights Division and now my job is to support Leiphen's research."
