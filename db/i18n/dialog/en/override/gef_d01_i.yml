  npc_override_gef_d01_i_quests_illusion_dungeons_just_get_out_before_s_109914: "Just get out before it's over."
  npc_override_gef_d01_i_quests_illusion_dungeons_just_get_out_here_quickl_4b638d: "Just get out of here, quickly. Go back to where we met."
