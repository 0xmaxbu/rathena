  npc_override_gef_d01_i_quests_illusion_dungeons_you_there_823406: "You there!"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_think_i_d_give_6af700: "Do you think I'd give such advanced information to a stranger I am seeing for the first time?"
