  npc_override_gef_d01_i_quests_illusion_dungeons_you_honestly_say_you_tri_c148d3: "Can you honestly say that you tried to push past your limits?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_human_84fc87: "...? Are you a human?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_human_8bc4e2: "Are you... a human?"
  npc_override_gef_d01_i_quests_illusion_dungeons_you_human_ffe6ed: "...Are you not a human?"
