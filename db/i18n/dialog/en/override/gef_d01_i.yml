  npc_override_gef_d01_i_quests_illusion_dungeons_light_magic_please_stop_369caa: "The light... The magic... Please stop that magic..."
  npc_override_gef_d01_i_quests_illusion_dungeons_lighten_your_weight_9e0f6c: "- Lighten your weight and -"
  npc_override_gef_d01_i_quests_illusion_dungeons_like_alchemist_example_3bd3b3: "Like alchemist, for example."
  npc_override_gef_d01_i_quests_illusion_dungeons_like_f7579a: "Like this!"
  npc_override_gef_d01_i_quests_illusion_dungeons_like_gona_over_there_35f60b: "Like Gona over there."
  npc_override_gef_d01_i_quests_illusion_dungeons_like_i_told_you_earlier_a8e96e: "Like I told you earlier, when this cave was a kingdom, the king had a pet lizard. One day, this lizard wandered outside of the kingdom to see the outside world, but ended up getting lost. The king was so angry at the lizard that he cursed him."
  npc_override_gef_d01_i_quests_illusion_dungeons_like_i_told_you_earlier_f36541: "Like I told you earlier, when this cave was a kingdom, the king had a pet lizard. When the king froze the cave in a fit of rage, this lizard was also turned into a terrifying ice monster."
  npc_override_gef_d01_i_quests_illusion_dungeons_like_what_9178c1: "- Like what?"
  npc_override_gef_d01_i_quests_illusion_dungeons_like_what_eating_sleepin_8f997e: "Like what? Eating, sleeping, and pooping?"
  npc_override_gef_d01_i_quests_illusion_dungeons_listen_aca285: "Listen."
  npc_override_gef_d01_i_quests_illusion_dungeons_listen_me_you_always_go_9d09f1: "Listen to me, or you can always go back to the Tower."
  npc_override_gef_d01_i_quests_illusion_dungeons_listen_people_a2f755: "Listen, people!"
  npc_override_gef_d01_i_quests_illusion_dungeons_listen_what_they_want_br_d04b2a: "^0000CDListen to what they want. Brother, even if you look very trivial, do something they'll be pleased by.^000000"
  npc_override_gef_d01_i_quests_illusion_dungeons_lizard_really_strong_i_s_0cb63a: "But that lizard is really strong. I suggest you fight it in a group."
  npc_override_gef_d01_i_quests_illusion_dungeons_ll_ensure_chunghae_s_saf_b07bf0: "That'll ensure Chunghae's safety during his investigation."
