  npc_override_payon_in01_quivers_you_carrying_any_arrows_c6b0ff: "Are you carrying any Arrows with you? I'll provide you with a quiver that can carry {0} of your {1}s for only ^FF3131{2} Zeny^000000."
  npc_override_payon_in01_quivers_you_changed_your_mind_9f910c: "You changed your mind?"
  npc_override_payon_in01_quivers_you_currently_carrying_e00f70: "you are currently carrying?"
  npc_override_payon_in01_quivers_you_don_t_even_6b1f31: "You don't even"
  npc_override_payon_in01_quivers_you_like_d698c6: "Would you like to"
  npc_override_payon_in01_quivers_you_like_try_using_one_49a295: "Would you like to try using one of my arrow quivers? I have no doubt that someone like you can appreciate my genius!"
  npc_override_payon_in01_quivers_you_see_invention_foreve_a9067f: "Do you not see that this invention can forever change the way Arrows are carried?! The future is now!"
  npc_override_payon_in01_quivers_zeny_0df6e1: "have {0} Zeny?"
