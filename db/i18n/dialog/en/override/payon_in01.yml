Body:
  npc_override_payon_in01_quests_payon_ah_no_i_t_1b406f: "Ah, No I can't..."
  npc_override_payon_in01_quests_payon_ah_wait_i_almost_forgot_0270aa: "Ah, Wait! I almost forgot. I was quite a popular actress back in my youth. My actor friends gave me a wedding present when I left the Troupe. I've kept it to remind me of those precious times."
  npc_override_payon_in01_quests_payon_all_started_when_my_pare_220a2c: "It all started when my parents passed away when I was a little kid. Early on I had to work for a living, and had a really hard time."
  npc_override_payon_in01_quests_payon_angel_wing_ae30a0: "1 Angel Wing."
  npc_override_payon_in01_quests_payon_arrrgggghh_4aff39: "ArrrGggghh!"
  npc_override_payon_in01_quests_payon_as_you_wish_d7c1e4: "Do as you wish..."
  npc_override_payon_in01_quests_payon_did_you_gather_items_the_5ae225: "Did you gather the items? Then hand them over."
  npc_override_payon_in01_quests_payon_ear_muffs_my_family_s_68b0ed: "Ear Muffs are my family's specialty, and we provide it to customers who have ^FF33551 Cursed Ruby^000000, ^3311AA1 Headset,^000000 ^3355FF 200 Feathers^000000 and ^DDDD005000 Zeny^000000."
  npc_override_payon_in01_quests_payon_fang_garm_28c5d2: "5 Fang of Garm."
  npc_override_payon_in01_quests_payon_fine_here_s_your_helm_6897c1: "Fine, here's your Helm of Angel. Take it."
  npc_override_payon_in01_quests_payon_gasp_i_mean_really_i_434166: "*Gasp* I mean, really, do I need ^3355FF Ora Ora^000000 to get rid of them? People say it is very rarely seen in distant countries."
  npc_override_payon_in01_quests_payon_goodbye_adventurer_7e2d9b: "Goodbye, adventurer~!"
  npc_override_payon_in01_quests_payon_helm_slot_dbff6b: "1 Helm (with slot)."
  npc_override_payon_in01_quests_payon_here_i_give_you_pre_f59dc2: "Here, I will give you this pre-made one."
  npc_override_payon_in01_quests_payon_hm_888f0f: "Hm."
  npc_override_payon_in01_quests_payon_hm_ac624d: ".....Hm."
  npc_override_payon_in01_quests_payon_hm_alright_223c72: "Hm. Alright."
  npc_override_payon_in01_quests_payon_hm_here_s_your_deviruchi_5d65be: ".....Hm. Here's your Deviruchi Hat. Please take it."
  npc_override_payon_in01_quests_payon_huh_so_you_already_know_a5d9bd: "Huh? So you already know what I specialize in, eh? I suppose there's no need for the usual secrecy. Tell me what you want."
  npc_override_payon_in01_quests_payon_huhuhuhuhu_e58811: "Huhuhuhuhu..."
  npc_override_payon_in01_quests_payon_huk_3c209c: "*Huk*"
  npc_override_payon_in01_quests_payon_huk_huk_a9804a: "Huk...Huk..."
  npc_override_payon_in01_quests_payon_i_believe_we_4f917c: "I believe we"
  npc_override_payon_in01_quests_payon_i_d_like_give_you_addbd5: "I'd like to give you this."
  npc_override_payon_in01_quests_payon_i_finally_16944a: "I finally have this!"
  npc_override_payon_in01_quests_payon_i_gather_mushrooms_mount_d8c1bd: "I gather Mushrooms on the Mountain of Payon everyday. Time passes and before I know it, it's already fesitval season. I wish I could make clothing for my family this time of the year."
  npc_override_payon_in01_quests_payon_i_ll_make_short_give_4a88a9: "I'll make it short! Give it to me, and I will give you my treasure! So how's my idea? Wanna deal?"
  npc_override_payon_in01_quests_payon_i_mean_any_cards_upgrade_87a74b: "I mean, any cards or upgrades in the items I will use to make something for you will be lost once I make the item. So be careful when you hand stuff over to me."
  npc_override_payon_in01_quests_payon_i_need_skirt_virgin_8690c5: "But for that, I need ^3355FF4 Skirt of Virgin^000000..."
  npc_override_payon_in01_quests_payon_i_t_take_any_more_624f23: "I can't take it any more!"
  npc_override_payon_in01_quests_payon_i_t_wait_3801fd: "I can't wait"
  npc_override_payon_in01_quests_payon_i_tried_everything_i_cou_88e625: "I tried to do everything I could do. I coaxed them, killed them, but it only brought peace for a moment! I even tried to burn this house down...!"
  npc_override_payon_in01_quests_payon_i_ve_worked_years_hopes_cfff7f: "I've worked for 10 years in hopes of buying my dream house where I could find some sense of peace and comfort again. Eventually I thought I had enough zeny to afford my very own sweet home."
  npc_override_payon_in01_quests_payon_i_wish_i_could_make_689c78: "I wish I could make some clothing for my grandchildren for the festival season..."
  npc_override_payon_in01_quests_payon_if_i_could_afford_them_007f9c: "If I could afford 5 of them, I won't have to be frustrated with these disgusting bugs any more..."
  npc_override_payon_in01_quests_payon_if_s_okay_b41b24: "If it's okay..."
  npc_override_payon_in01_quests_payon_if_you_plan_travel_colde_12de27: "If you plan to travel to colder regions, I suggest that you bring some ^3355FFEar Muffs^000000..."
  npc_override_payon_in01_quests_payon_is_is_this_67fbab: "Is, is this"
  npc_override_payon_in01_quests_payon_kakakakakaka_4d76eb: "Kakakakakaka!"
  npc_override_payon_in01_quests_payon_little_evil_horn_a4aefd: "600 Little Evil Horn."
  npc_override_payon_in01_quests_payon_meet_again_341d5e: "will meet again."
  npc_override_payon_in01_quests_payon_menu_alright_884b4f: "Alright.:No way!"
  npc_override_payon_in01_quests_payon_menu_can_6acfa3: "Can you make me a special item?:Hey."
  npc_override_payon_in01_quests_payon_menu_continue_131af2: "Continue:Cancel"
  npc_override_payon_in01_quests_payon_menu_give_a266d5: "Give him the items.:Don't give him the items."
  npc_override_payon_in01_quests_payon_menu_helm_6d72a1: "Helm of Angel.:Deviruchi Cap.:I will come next time."
  npc_override_payon_in01_quests_payon_menu_oh_2ed7c3: "Oh Yeah? That sounds good.:No thank you, Ma'am."
  npc_override_payon_in01_quests_payon_menu_show_7170b1: "Show Ora Ora:Give Ora Ora:Cancel"
  npc_override_payon_in01_quests_payon_menu_thank_bce409: "Thank you for buying our product. You won't regret purchasing our Ear Muffs: Satisfaction guaranteed~"
  npc_override_payon_in01_quests_payon_msg_6eae3a: "..."
  npc_override_payon_in01_quests_payon_muhahahahah_10ca3c: "Muhahahahah!!!"
  npc_override_payon_in01_quests_payon_my_family_produced_sold_869574: "My family has produced and sold the special Winter product ^3355FFEar Muffs^000000 for many years. We just moved here, but the weather is always warm so we can hardly make a living."
  npc_override_payon_in01_quests_payon_never_ending_fight_bugs_de6d95: "This never ending fight with the bugs has really exhausted me. I give up. Do as you wish you scumbags!"
  npc_override_payon_in01_quests_payon_now_even_my_eyes_gone_3d0b73: "Now even my eyes have gone mad!! Why do these bugs suddenly seem so cute?! Nooooooo~!!!"
  npc_override_payon_in01_quests_payon_number_items_isn_t_right_0aabb1: "...The number of items isn't right. You better double check."
  npc_override_payon_in01_quests_payon_number_items_right_you_b_6c3ee2: "...The number of items is not right. You better double check."
  npc_override_payon_in01_quests_payon_oh_dear_9aea7a: "Oh dear..."
  npc_override_payon_in01_quests_payon_oh_man_3a6ad5: "Oh man..."
  npc_override_payon_in01_quests_payon_oh_thank_you_so_much_9d71a7: "Oh! Thank you so much~ Now I can make some clothes for Kitty Cutty~"
  npc_override_payon_in01_quests_payon_oh_you_give_me_your_9f2afd: "Oh! Would you give me your ^3355FFSkirt of Virgin^000000? I'd need four of them. Please, I'm begging you."
  npc_override_payon_in01_quests_payon_one_0136d3: "the one?!"
  npc_override_payon_in01_quests_payon_one_these_days_d110ff: "...One of these days."
  npc_override_payon_in01_quests_payon_oooooohhhh_d0f5fd: "Oooooohhhh!!!"
  npc_override_payon_in01_quests_payon_ora_ora_0a6c2a: "Ora Ora!!"
  npc_override_payon_in01_quests_payon_ora_ora_91dffc: "Ora Ora!"
  npc_override_payon_in01_quests_payon_s_all_i_require_a6771e: "That's all I require."
  npc_override_payon_in01_quests_payon_s_fine_1eeb87: "That's fine."
  npc_override_payon_in01_quests_payon_sigh_how_i_get_skirt_b1cbf8: "*Sigh* How can I get ^3355FFSkirt of Virgin^000000 by myself? I'm just so weak and feeble, even rolling in my rocking chair exhausts me. *Sniff* All I want is to make my grandchildren happy..."
  npc_override_payon_in01_quests_payon_sorry_i_out_control_plea_057b8d: "Sorry, I was out of control with pleasure for a while. Now, I will give my treasure as promised."
  npc_override_payon_in01_quests_payon_stupid_disgusting_dc5577: "Stupid and Disgusting"
  npc_override_payon_in01_quests_payon_sweet_jesus_turns_out_s_b9ef91: "Sweet Jesus! Turns out, it's a Heaven for Thief Bugs!!!"
  npc_override_payon_in01_quests_payon_take_care_102bae: "Take care."
  npc_override_payon_in01_quests_payon_talon_griffon_0f8466: "40 Talon of Griffon."
  npc_override_payon_in01_quests_payon_thank_you_making_old_wom_15033f: "Thank you for making an old woman so happy..."
  npc_override_payon_in01_quests_payon_then_we_shall_meet_again_1b51ed: "Then we shall meet again."
  npc_override_payon_in01_quests_payon_thief_bugs_b3086f: "Thief Bugs!!"
  npc_override_payon_in01_quests_payon_this_is_1ae3d2: "This is..."
  npc_override_payon_in01_quests_payon_unfortunately_i_didn_t_e_fae168: "Unfortunately I didn't have enough money to buy the nice house that I had my eye on. But then, I found this house, which was bigger and cheaper than the first. I bought it without thinking..."
  npc_override_payon_in01_quests_payon_use_c694ba: "to use this"
  npc_override_payon_in01_quests_payon_wahhhhhh_i_i_909cb1: "Wahhhhhh! I, I..."
  npc_override_payon_in01_quests_payon_wait_just_so_you_know_520b40: "Wait! Just so you know, I don't care if the items in your inventory have been upgraded, or have cards attached."
  npc_override_payon_in01_quests_payon_wait_second_right_now_yo_9f6e3a: "^3355FFWait a second! Right now, you're carrying too many items with you. Please come back after putting some of your things into Kafra Storage.^000000"
  npc_override_payon_in01_quests_payon_what_dc8aff: "...What is it?"
  npc_override_payon_in01_quests_payon_what_if_i_t_get_88ff4e: "What if I can't get rid of all these Thief Bugs? I might even grow to love them... *Huk*"
  npc_override_payon_in01_quests_payon_when_you_wear_over_your_b28699: "When you wear this over your mouth and start to breathe, it filters junk out before getting to your lungs."
  npc_override_payon_in01_quests_payon_you_don_t_enough_money_3d123a: "You don't have enough money or items. Unfortunately, we can't give any discounts. Please understand that we have to make a living..."
  npc_override_payon_in01_quests_payon_you_little_stinky_filthy_6ab016: "You little stinky filthy bastards!"
  npc_override_payon_in01_quests_payon_you_pay_c62767: "You will pay!!!"
  npc_override_payon_in01_quests_payon_young_traveler_please_he_352339: "Young traveler, please help me. When you find some ^3355FFSkirt of Virgin^000000, please bring them to me. I'd really appreciate it..."
