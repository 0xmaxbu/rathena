  npc_override_payon_in01_quivers_i_m_so_sorry_i_e717a5: "I'm so sorry. I had no"
  npc_override_payon_in01_quivers_i_m_sorry_you_don_f2d94e: "I'm sorry, but you don't have enough Zeny. I can't just give these away after working years"
  npc_override_payon_in01_quivers_i_ve_studied_magic_quive_f88a4b: "I've studied magic and quivers for years, working night and day until I finally figured how to condense arrows with magic! With magic quivers, you'll be carrying more arrows, but with less weight!"
  npc_override_payon_in01_quivers_idea_you_so_a758e2: "idea that you were so..."
  npc_override_payon_in01_quivers_just_keep_track_bc0488: "Just keep track"
