  npc_override_payon_in01_quivers_truly_extraordinary_i_ca_802f0e: "truly extraordinary. I call them... ^663300Magic Quivers^000000 !! This will be remembered in history as an"
  npc_override_payon_in01_quivers_way_too_much_stuff_why_005288: "way too much stuff. Why don't you stash it away in Kafra Storage? We can talk after you do that, right?"
  npc_override_payon_in01_quivers_what_52f3d0: "What...?"
