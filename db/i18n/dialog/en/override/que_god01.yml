  npc_override_que_god01_sleipnir_seal_i_know_d_much_easier_9e908a: "I know it'd be much easier if this tale was already written, but you must understand that many stories regarding the gods are only orally transmitted."
  npc_override_que_god01_sleipnir_seal_i_know_story_might_seem_3b3feb: "I know that this story might seem too long. But if you ever want to sit down and hear it again, I'll be glad to go over it again. Thank you for listening, adventurer."
