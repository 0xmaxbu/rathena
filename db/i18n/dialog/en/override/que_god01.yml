  npc_override_que_god01_sleipnir_seal_alright_let_me_give_you_d6cb08: "Alright, let me give you the gist of what I'm researching."
  npc_override_que_god01_sleipnir_seal_although_myths_as_they_c_93ba09: "Although myths, as they change with time, may conflict with each other, the fundamental basis of these stories is what makes them timeless."
  npc_override_que_god01_sleipnir_seal_although_our_researchers_b0407e: "Although our researchers are kind of strange, they're all pretty nice and they mean well."
  npc_override_que_god01_sleipnir_seal_although_stranger_s_skil_fd23a1: "Although the stranger's skills were great, his horse greatly sped up the rampart reconstruction. This was the legendary magical horse, Svadilfari."
