  npc_override_que_god01_sleipnir_seal_anyway_i_thank_you_helpi_96716e: "Anyway, I thank you for helping me out earlier. That's basically all I needed, so please talk to the other researchers and see if they need any assistance."
  npc_override_que_god01_sleipnir_seal_anyway_just_ask_him_abou_e9fc8e: "Anyway, just ask him about any progress on his research. And if he happens to ask you for help, please lend him your assistance."
  npc_override_que_god01_sleipnir_seal_anyway_no_one_really_sur_73cacd: "Anyway, no one is really sure if it is or not. Recently, it's been the focus of many rumors. I have no idea if any of them are true though."
  npc_override_que_god01_sleipnir_seal_anyway_we_ve_already_fin_ce3eae: "Anyway, we've already finished our current research projects. Now, we're in the planning stages for the next projects we'll be conducting..."
  npc_override_que_god01_sleipnir_seal_anyways_we_continue_rese_76e2fa: "Anyways, we will continue to research and hope that we'll be able to accomplish our goal of recreating Sleipnir someday."
