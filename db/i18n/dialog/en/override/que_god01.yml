  npc_override_que_god01_sleipnir_seal_as_you_already_know_we_e96c9e: "As you already know, we're trying to find out whether or not we can reproduce 'Sleipnir,' one of the tools used by the gods."
  npc_override_que_god01_sleipnir_seal_as_you_press_word_dirdnl_0e74af: "^3355FFAs you press the word '^ff0000dirdnl^3355FF,' the slab emitted a strange beeping noise but nothing else happened. Perhaps you must press some of the other words.^000000"
  npc_override_que_god01_sleipnir_seal_asgard_realm_gods_there_a2fcb1: "In Asgard, the realm of the gods, there was a huge protective rampart that was almost completely destroyed in a recent war."
