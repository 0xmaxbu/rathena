  npc_override_ecl_fild01_quests_eclage_i_appreciate_what_you_di_7444e2: "I appreciate what you did last time. The earth seemed to be in a good mood, too. I could just feel it. Would you mind helping us again?"
  npc_override_ecl_fild01_quests_eclage_i_ask_you_2682f0: "I ask you!"
