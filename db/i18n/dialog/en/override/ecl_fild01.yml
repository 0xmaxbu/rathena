Body:
  npc_override_ecl_fild01_quests_eclage_aaa_14b6e2: "Aaa~"
  npc_override_ecl_fild01_quests_eclage_aaa_25fc49: "Aaa~~~~"
  npc_override_ecl_fild01_quests_eclage_aaa_49a08b: "Aaa~~~"
  npc_override_ecl_fild01_quests_eclage_aaa_85276b: "Aaa~~~~~"
  npc_override_ecl_fild01_quests_eclage_aaa_9e5097: "Aaa~~~~~~"
  npc_override_ecl_fild01_quests_eclage_aaa_e15f90: "Aaa~~"
  npc_override_ecl_fild01_quests_eclage_aaaaahhhhhhhhh_65f62a: "...A...A...Aaaaahhhhhhhhh!!!!!"
  npc_override_ecl_fild01_quests_eclage_about_8a8cef: "about it?"
  npc_override_ecl_fild01_quests_eclage_about_avant_b4e52c: "About Avant."
  npc_override_ecl_fild01_quests_eclage_about_many_things_0717be: "about many things."
  npc_override_ecl_fild01_quests_eclage_about_steal_6918af: "were about to steal the"
  npc_override_ecl_fild01_quests_eclage_about_truth_you_believe_8eac68: "about the truth that you believe."
  npc_override_ecl_fild01_quests_eclage_about_where_you_came_rea_d20704: "It was about where you came from and it was really interesting. But why?"
  npc_override_ecl_fild01_quests_eclage_about_wuhuru_well_i_don_db6dfc: "About Wuhuru... Well, I don't really know the messy details..."
  npc_override_ecl_fild01_quests_eclage_about_you_e64915: "about you,"
  npc_override_ecl_fild01_quests_eclage_according_estimation_tim_428a14: "According to the estimation, the time it takes for home tree's restoration is at least 200 years. During that period, 80% of life forms on this land will be destroyed."
  npc_override_ecl_fild01_quests_eclage_according_luen_s_stateme_53c22f: "According to Luen's statements, an unfamiliar person with short, red hair was hurriedly running somewhere."
  npc_override_ecl_fild01_quests_eclage_according_luen_she_thoug_a142bc: "According to Luen she thought she was the first one to arrive at home."
  npc_override_ecl_fild01_quests_eclage_according_my_brother_you_6499c6: "According to my brother, ^4d4dffyou will be able to find clues somewhere in Bifrost.^000000"
  npc_override_ecl_fild01_quests_eclage_according_rumors_there_l_45cda0: "According to rumors, there is a legend of a great bird in Midgard that lays an egg as big as a house."
  npc_override_ecl_fild01_quests_eclage_according_their_report_d_12f2fe: "According to their report, it was due to the excessive mining."
  npc_override_ecl_fild01_quests_eclage_according_your_brother_h_6b86cf: "According to your brother, he received the ingredients from a high-level Laphine."
  npc_override_ecl_fild01_quests_eclage_ack_48ced2: "Ack..."
  npc_override_ecl_fild01_quests_eclage_acorns_07bfeb: "Acorns?!"
  npc_override_ecl_fild01_quests_eclage_acorns_0b8d2f: "Acorns~~!!!"
  npc_override_ecl_fild01_quests_eclage_acorns_75dedc: "Acorns!"
  npc_override_ecl_fild01_quests_eclage_acorns_so_good_c836d3: "Acorns were so good..."
  npc_override_ecl_fild01_quests_eclage_acted_like_house_e09d0d: "and acted like the house"
  npc_override_ecl_fild01_quests_eclage_actually_672c01: "Actually..."
  npc_override_ecl_fild01_quests_eclage_actually_better_deliver_2d21e0: "Is it actually better to deliver it later..."
  npc_override_ecl_fild01_quests_eclage_actually_c54f1c: "Actually.."
  npc_override_ecl_fild01_quests_eclage_actually_i_don_t_any_a9457a: "Actually I don't have any time for myself since I have to be here all the time."
  npc_override_ecl_fild01_quests_eclage_actually_i_feel_like_my_ac4f08: "Actually...I feel like my friends would just get mad at me if I go back empty-handed."
  npc_override_ecl_fild01_quests_eclage_actually_i_m_first_king_b2e924: "Actually I'm not the first king with mixed blood."
  npc_override_ecl_fild01_quests_eclage_actually_i_m_hoping_he_98d15d: "Actually I'm hoping that he did it out of interest. "
  npc_override_ecl_fild01_quests_eclage_actually_i_m_sponsoring_121832: "Actually, I'm sponsoring a scholar of magics."
  npc_override_ecl_fild01_quests_eclage_actually_isn_t_my_first_3c2255: "Actually, this isn't my first time here, but I had the opportunity to go to other places during when deregulation was at its peak awhile back."
  npc_override_ecl_fild01_quests_eclage_actually_let_s_talk_abou_437a78: "Actually, let's talk about this later and search for my father now."
  npc_override_ecl_fild01_quests_eclage_actually_why_don_t_i_6fabb5: "Actually, why don't I start singing now?"
  npc_override_ecl_fild01_quests_eclage_actually_your_project_su_2c1ca4: "Actually, your project succeeded."
  npc_override_ecl_fild01_quests_eclage_additional_reaction_get_e223a8: "^000099The additional reaction does not get reduced.^000000"
  npc_override_ecl_fild01_quests_eclage_advanced_base_splendide_c21994: "in the advanced base of Splendide."
  npc_override_ecl_fild01_quests_eclage_adventurer_third_floor_s_554020: "The adventurer on the third floor is starving!"
  npc_override_ecl_fild01_quests_eclage_adventurers_doing_okay_d_de871b: "Are the adventurers doing okay? Don't forget to check all three of them~"
  npc_override_ecl_fild01_quests_eclage_after_becoming_mayor_cry_c6f2e9: "After becoming Mayor, that crybaby has grown so much."
  npc_override_ecl_fild01_quests_eclage_after_hundreds_years_i_f_360a9b: "After hundreds of years, I finally figured it all out! How could this be!"
  npc_override_ecl_fild01_quests_eclage_after_i_think_through_th_5ac11b: "after I think through things"
  npc_override_ecl_fild01_quests_eclage_after_losing_my_mind_due_a8b9b5: "After losing my mind due to the presentation's failure, I was imprisoned after spray painting all Yai's of Eclage with 'Eat dirt you Laphine Official Aacademy scumbags'. Well, I could have avoided being caught."
  npc_override_ecl_fild01_quests_eclage_after_making_statement_r_e41b62: "^000099After making that statement, Robert disappeared back into the reactor. In my hand were Robert's home tree leaf and Etran's necklace.^000000"
  npc_override_ecl_fild01_quests_eclage_after_massaging_his_head_f9ec55: "After massaging his head for a while, he looked much better and continued to go on."
  npc_override_ecl_fild01_quests_eclage_after_obtaining_body_i_r_6bdbe9: "After obtaining this body, I realize that I'd rather have my small body back."
  npc_override_ecl_fild01_quests_eclage_after_pounding_door_whil_8fb766: "After pounding on the door for a while, you sensed someone's presence near the door, and there opened a window that only one eye could peek through."
  npc_override_ecl_fild01_quests_eclage_after_realizing_i_ponder_19fd07: "After realizing it, I pondered about ways to untangle this twisted truth"
  npc_override_ecl_fild01_quests_eclage_after_robbing_our_stuff_26eb19: "after robbing our stuff {0}?"
  npc_override_ecl_fild01_quests_eclage_after_seeing_hisie_hidin_b68d99: "After seeing Hisie hiding himself, you knocked on the door of the Yai."
  npc_override_ecl_fild01_quests_eclage_after_when_big_accident_e3ed15: "And it was after that when the big accident occurred."
  npc_override_ecl_fild01_quests_eclage_after_wuhuru_just_spend_c0762e: "After that, Wuhuru would just spend his days in his Yai."
  npc_override_ecl_fild01_quests_eclage_after_you_re_done_df4951: "after you're done."
  npc_override_ecl_fild01_quests_eclage_after_your_visit_i_felt_48221f: "After your visit, I felt so much lighter. I was also excited to control the life force."
  npc_override_ecl_fild01_quests_eclage_again_first_person_see_y_045840: "that again, the first person to see you"
  npc_override_ecl_fild01_quests_eclage_again_first_person_see_y_2ba694: "that again, the first person to see you was probably my mom."
  npc_override_ecl_fild01_quests_eclage_again_later_ab0d37: "again later."
  npc_override_ecl_fild01_quests_eclage_again_must_cried_as_such_35ca02: "again must have cried as such."
  npc_override_ecl_fild01_quests_eclage_ah_298394: "Ah...."
  npc_override_ecl_fild01_quests_eclage_ah_971301: "Ah..."
  npc_override_ecl_fild01_quests_eclage_ah_before_i_had_stomach_d89aee: "Ah, before I had this stomach ache,"
  npc_override_ecl_fild01_quests_eclage_ah_cf07cb: "Ah!"
  npc_override_ecl_fild01_quests_eclage_ah_come_think_you_know_2c3204: "Ah, come to think of it, you know humans that came through Hazy Forest."
  npc_override_ecl_fild01_quests_eclage_ah_great_f1de77: "Ah, great!"
  npc_override_ecl_fild01_quests_eclage_ah_home_tree_s_leaf_b893e1: "Ah, home tree's leaf. Tha's right. If a home tree grows properly, it would bare leaves. It's not something you can see in other plants."
  npc_override_ecl_fild01_quests_eclage_ah_how_beautiful_135b99: "Ah...how beautiful."
  npc_override_ecl_fild01_quests_eclage_ah_how_long_been_since_17da2f: "Ah, how long has it been since the last time I saw food! Yummm! Thank goodness it's meat! I think it's a little tough...and not warm enough...but still, it's meat!!"
  npc_override_ecl_fild01_quests_eclage_ah_huh_1340db: "Ah... Huh...?"
  npc_override_ecl_fild01_quests_eclage_ah_i_felt_so_dizzy_30a3be: "Ah, I felt so dizzy that my head was spinning before, and now I can't see anything at all! Is it night or day? I'm so hungry..."
  npc_override_ecl_fild01_quests_eclage_ah_i_guess_fear_death_f7c99a: "Ah...I guess this is the fear of death...memories of the past are going through my mind like a flash...like happy moments we had at the south gate of Prontera..."
  npc_override_ecl_fild01_quests_eclage_ah_i_just_remembered_see_b2bcf6: "Ah! I just remembered seeing Wuhuru right before that happened!"
  npc_override_ecl_fild01_quests_eclage_ah_i_just_want_whine_053871: "Ah, I just want to whine. Where did my brother go...?"
  npc_override_ecl_fild01_quests_eclage_ah_i_m_just_feeling_ac545a: "...Ah.. I'm just feeling sorry for myself, so just continue on your way."
  npc_override_ecl_fild01_quests_eclage_ah_i_m_so_glad_8bb543: "Ah...I'm so glad that I met a good friend like you."
  npc_override_ecl_fild01_quests_eclage_ah_i_m_so_hungry_a76608: "Ah~ I'm so hungry. What should I eat today?"
  npc_override_ecl_fild01_quests_eclage_ah_i_m_sorry_i_a2f3d5: "Ah, I'm sorry. I understand."
  npc_override_ecl_fild01_quests_eclage_ah_i_m_starting_headache_170d17: "Ah...I'm starting to have a headache."
  npc_override_ecl_fild01_quests_eclage_ah_pickled_fruits_06a275: "Ah..pickled fruits."
  npc_override_ecl_fild01_quests_eclage_ah_right_4c7629: "Ah...is that right?"
  npc_override_ecl_fild01_quests_eclage_ah_s_too_bad_3e6b05: "Ah, that's too bad."
  npc_override_ecl_fild01_quests_eclage_ah_s_tood_bad_dd6e8e: "Ah, that's tood bad."
  npc_override_ecl_fild01_quests_eclage_ah_s_you_again_you_c29084: "Ah, it's you again! You're so insensitive. Anyway, you're here to tell me to start working, right? I see, I see. You can go now."
  npc_override_ecl_fild01_quests_eclage_ah_thank_you_so_much_223179: "Ah, thank you so much!"
  npc_override_ecl_fild01_quests_eclage_ah_there_anyone_more_exp_c67347: "Ah... Is there anyone with more experience with this..."
  npc_override_ecl_fild01_quests_eclage_ah_very_good_look_perfec_1d631c: "Ah~ very good. Look at this perfect pie. The fragrance is amazing, too. Should I taste it a bit?"
  npc_override_ecl_fild01_quests_eclage_ah_what_i_done_4899de: "Ah.. What have I done...?"
  npc_override_ecl_fild01_quests_eclage_ah_what_relief_i_m_e6a3d8: "Ah...What a relief...I'm so glad you're here. I was about to leave this tower alone! But I think I'm lost."
  npc_override_ecl_fild01_quests_eclage_ah_whatever_take_anyway_6edc83: "Ah, whatever! Take this anyway."
  npc_override_ecl_fild01_quests_eclage_ah_who_world_did_such_b53f04: "Ah, who in the world... did such a thing..."
  npc_override_ecl_fild01_quests_eclage_ah_you_722dab: "Ah, you are?"
  npc_override_ecl_fild01_quests_eclage_ah_you_don_t_want_a89544: "Ah...you don't want to?"
  npc_override_ecl_fild01_quests_eclage_ah_you_re_right_e70422: "Ah, you're right."
  npc_override_ecl_fild01_quests_eclage_ah_you_trying_show_etran_cabb1f: "Ah, you are trying to show Etran my home tree's leaf. You ask such an obvious question..."
  npc_override_ecl_fild01_quests_eclage_ah_you_ve_come_just_8b39af: "Ah, you've come at just the right time."
  npc_override_ecl_fild01_quests_eclage_aha_f73000: "Aha...!!!!!!"
  npc_override_ecl_fild01_quests_eclage_ahah_i_m_all_fired_1f78e3: "Ahah~I'm all fired up."
  npc_override_ecl_fild01_quests_eclage_ahah_way_b98d29: "Ahah~by the way,"
  npc_override_ecl_fild01_quests_eclage_ahaha_no_need_worry_abou_d67002: "Ahaha, no need to worry about me! I can do this by myself!"
  npc_override_ecl_fild01_quests_eclage_ahaha_really_you_might_r_7ef8ca: "Ahaha...really? You might be right...? Oh well, I'll make another one, don't worry..."
  npc_override_ecl_fild01_quests_eclage_ahahahah_ha_hahha_hahaa_88587c: "Ahahahah...ha...hahha..hahaa.."
  npc_override_ecl_fild01_quests_eclage_ahahahahahaha_79a921: "Ahahahahahaha-"
  npc_override_ecl_fild01_quests_eclage_ahahhaa_no_s_like_i_fb4cc1: "Ahahhaa, no, it's not like that. I just found out a few minor problems while operating the portable rift reactor."
  npc_override_ecl_fild01_quests_eclage_ahh_ded1c5: "Ahh..."
  npc_override_ecl_fild01_quests_eclage_ahh_how_terrible_923877: "Ahh, how terrible.."
  npc_override_ecl_fild01_quests_eclage_ahh_now_i_remember_befor_3171e0: "Ahh! Now that I remember, before we used to be able to order the exact necessary length, but because they are mass-producing them nowadays, they only provide preset lengths."
  npc_override_ecl_fild01_quests_eclage_ahh_why_isn_t_working_c2eb65: "Ahh~ Why isn't this working! You, you have to react when I place you like this!! Ahh nothing is working! Whoa, it slipped from my hand! (CLASH)"
  npc_override_ecl_fild01_quests_eclage_ahhh_how_irritating_1dbe38: "Ahhh! How irritating!!!"
  npc_override_ecl_fild01_quests_eclage_ahhhh_abd4ac: "AHHHH!!!"
  npc_override_ecl_fild01_quests_eclage_ahhhh_i_didn_t_say_92b635: "Ahhhh I didn't say anything. I didn't..."
  npc_override_ecl_fild01_quests_eclage_ahhhh_maybe_really_isn_t_811b2f: "Ahhhh maybe it really isn't a dream after all!!!"
  npc_override_ecl_fild01_quests_eclage_ahhhh_my_head_feels_like_0b57d4: "Ahhhh, my head feels like it's about to explode."
  npc_override_ecl_fild01_quests_eclage_ahhhhhhhh_a35609: "AHHHHHHHH!!!!!!!!!!"
  npc_override_ecl_fild01_quests_eclage_ahng_i_think_they_alread_921d3d: "Ahng!? I think they already started the work. The field is breathing again. There are many stories to this field, you know."
  npc_override_ecl_fild01_quests_eclage_ahng_s_simple_tell_laphi_741e4c: "Ahng? It's simple. Tell Laphines that are scattered all over the field to start today's work."
  npc_override_ecl_fild01_quests_eclage_ahng_well_too_bad_if_dcf7d4: "Ahng? Well, too bad. But if you have time later, please drop by. I could use a little help here."
  npc_override_ecl_fild01_quests_eclage_alarm_clock_tower_1d8e8f: "the alarm in the clock tower"
  npc_override_ecl_fild01_quests_eclage_alberta_place_people_run_384268: "Alberta is a place that people of Rune-Midgarts visit when they need to travel to other countries."
  npc_override_ecl_fild01_quests_eclage_alcohol_he_must_eabeb3: "and alcohol. He must have"
  npc_override_ecl_fild01_quests_eclage_alcohol_more_gambling_dd6a39: "the alcohol for more gambling"
  npc_override_ecl_fild01_quests_eclage_all_ae1148: "Not at all!"
  npc_override_ecl_fild01_quests_eclage_all_aside_i_m_sure_5d71f1: "All that aside, I'm sure Shenime is hiding something."
  npc_override_ecl_fild01_quests_eclage_all_because_you_a8de24: "This is all because of you"
  npc_override_ecl_fild01_quests_eclage_all_day_long_90cfd8: "all day long."
  npc_override_ecl_fild01_quests_eclage_all_expensive_s_just_34aeaf: "all that expensive. But it's just "
  npc_override_ecl_fild01_quests_eclage_all_first_time_visitors_595268: "All first-time visitors to Eclage must fill out the necessary forms here before entering."
  npc_override_ecl_fild01_quests_eclage_all_first_time_visitors_9e26db: "All first-time visitors to Eclage must fill out the necessary forms before entering."
  npc_override_ecl_fild01_quests_eclage_all_i_am_trying_just_e52893: "All I am trying to do is just deliver this to him!"
  npc_override_ecl_fild01_quests_eclage_all_i_did_just_place_824048: "All I did was just place my hand on it!"
  npc_override_ecl_fild01_quests_eclage_all_i_did_today_4ea1fc: "all I did today was"
  npc_override_ecl_fild01_quests_eclage_all_i_know_sure_shenime_0848d4: "All I know for sure is that Shenime is not his real name. So I conjured up an interesting story. Do you happen to know what it means to control the public?"
  npc_override_ecl_fild01_quests_eclage_all_i_saw_land_blooming_c124f2: "All I saw were the land of blooming flowers and monsters."
  npc_override_ecl_fild01_quests_eclage_all_i_sincerely_apprecia_c0c6ad: "With all that, I sincerely appreciate you for being so helpful."
  npc_override_ecl_fild01_quests_eclage_all_i_trust_you_thank_78f281: "All I can trust is you {0}. Thank you."
  npc_override_ecl_fild01_quests_eclage_all_i_wanted_you_gain_540cbd: "All I wanted was for you to gain recognition in Eclage, and I didn't intend anything bad by what I did."
  npc_override_ecl_fild01_quests_eclage_all_i_your_convenience_r_88fed0: "This is all I can do for your convenience right now."
  npc_override_ecl_fild01_quests_eclage_all_ingredients_research_206294: "All of the ^0000CDingredients^000000 in this research report are very difficult for me to gather myself. {0} I would like to ask for your help."
  npc_override_ecl_fild01_quests_eclage_all_myself_2c31d9: "All by myself..."
  npc_override_ecl_fild01_quests_eclage_all_others_ac37ef: "all the others."
  npc_override_ecl_fild01_quests_eclage_all_sudden_people_midgar_e10a4e: "All of a sudden, people from Midgard started to visit Eclage more and more."
  npc_override_ecl_fild01_quests_eclage_all_thanks_you_fact_mr_8e3b00: "This is all thanks to you! The fact that Mr. Clever is sleeping, it means that he won't be awake for a few days."
  npc_override_ecl_fild01_quests_eclage_all_things_why_my_e0746b: "Of all things, why was my"
  npc_override_ecl_fild01_quests_eclage_all_unique_ae72ce: "all that unique."
  npc_override_ecl_fild01_quests_eclage_all_while_you_took_42c732: "All the while, you took"
  npc_override_ecl_fild01_quests_eclage_all_you_need_zeny_69bd65: "All you need is 10,000zeny~"
  npc_override_ecl_fild01_quests_eclage_almost_got_bitten_again_bd68d0: "Almost got bitten again."
  npc_override_ecl_fild01_quests_eclage_along_clever_rattled_abo_ae8e83: "^000099Along with that, Clever rattled on about things that I had no idea about like 'Valkyries are best. Uncle loves so much'.^000000"
  npc_override_ecl_fild01_quests_eclage_already_been_many_decade_3e6367: "It has already been many decades."
  npc_override_ecl_fild01_quests_eclage_already_her_way_back_756016: "already on her way back at"
  npc_override_ecl_fild01_quests_eclage_already_there_d99cf9: "was already there."
  npc_override_ecl_fild01_quests_eclage_alright_awesome_awesome_b4f466: "Alright!! Awesome, awesome!"
  npc_override_ecl_fild01_quests_eclage_alright_c283ff: "alright...?"
  npc_override_ecl_fild01_quests_eclage_alright_i_act_as_though_9327ec: "Alright, I will act as though I have never made it here."
  npc_override_ecl_fild01_quests_eclage_alright_let_s_go_9491e4: "Alright, let's go for it."
  npc_override_ecl_fild01_quests_eclage_alright_let_s_go_couse_89350c: "Alright, let's go! But of couse! Only you will go!"
  npc_override_ecl_fild01_quests_eclage_alright_next_person_line_9ca652: "Alright, next person in line please!"
  npc_override_ecl_fild01_quests_eclage_alright_thanks_lot_de8e3e: "Alright, thanks a lot~"
  npc_override_ecl_fild01_quests_eclage_alright_then_shall_we_ge_977012: "Alright then, shall we get some acorns?"
  npc_override_ecl_fild01_quests_eclage_alright_we_just_need_eli_c3d23e: "Alright. We just need to eliminate the ones that Avant summoned."
  npc_override_ecl_fild01_quests_eclage_alright_what_you_want_wh_3ace57: "Alright. What is it that you want? Is it what you asked earlier, about dimensional rift fragment?"
  npc_override_ecl_fild01_quests_eclage_alright_you_may_now_deli_968a55: "Alright, you may now deliver this to Fon. Also, while I know that it is difficult in these busy times, would you also tell him that I said, 'please take more precious care of them?'"
  npc_override_ecl_fild01_quests_eclage_alrighty_nice_meeting_yo_275869: "Alrighty~ It was nice meeting you. I'm going to sing the rest of this tune."
  npc_override_ecl_fild01_quests_eclage_also_489166: "And also..."
  npc_override_ecl_fild01_quests_eclage_also_alberta_there_islan_35270d: "Also from Alberta, there is an island known for its high concentration of turtles."
  npc_override_ecl_fild01_quests_eclage_also_because_bifrost_71c693: "Is this also because of Bifrost?"
  npc_override_ecl_fild01_quests_eclage_also_i_another_favor_f658e2: "Also, I have another favor."
  npc_override_ecl_fild01_quests_eclage_also_if_i_find_means_2891d8: "And also, if I were to find the means to make myself bigger..."
