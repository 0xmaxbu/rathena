  npc_override_ecl_fild01_quests_eclage_see_you_understood_right_4704c8: "See, you understood it right."
  npc_override_ecl_fild01_quests_eclage_seed_named_goliath_after_25828f: "This seed is named [Goliath] after my name, and it's a plant used as a bridge for its strange ability to grow into two stems and one leaf."
