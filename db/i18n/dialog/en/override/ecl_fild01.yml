  npc_override_ecl_fild01_quests_eclage_i_am_always_living_anxie_8fed00: "I am always living in anxiety.. Who would've thought that the life of a Diary Frog would be so hard?"
  npc_override_ecl_fild01_quests_eclage_i_am_bit_doubtful_363e21: "I am a bit doubtful, but"
