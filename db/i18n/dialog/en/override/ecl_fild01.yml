  npc_override_ecl_fild01_quests_eclage_i_am_frog_made_wood_0f0eb2: "I am a frog made of wood that can be used for recording."
  npc_override_ecl_fild01_quests_eclage_i_am_high_level_laphine_68b367: "I am a high-level Laphine Life Restorer. How are you related to this look-alike of mine?"
