  npc_override_ecl_fild01_quests_eclage_i_been_toast_if_weren_9fba16: "I would have been toast if it weren't for that tree branch."
  npc_override_ecl_fild01_quests_eclage_i_begin_interviewing_a2b256: "I will begin interviewing"
  npc_override_ecl_fild01_quests_eclage_i_begin_my_interview_you_21afcd: "I will begin my interview with you."
  npc_override_ecl_fild01_quests_eclage_i_borrowed_book_3bff1c: "I borrowed a book."
  npc_override_ecl_fild01_quests_eclage_i_borrowed_some_books_as_46daab: "I borrowed some books as well to learn about people from Midgard since there are so many visitors coming from that area lately."
  npc_override_ecl_fild01_quests_eclage_i_bought_her_11e6e7: "I bought for her?"
