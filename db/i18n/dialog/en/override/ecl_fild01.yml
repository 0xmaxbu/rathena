  npc_override_ecl_fild01_quests_eclage_if_somebody_steals_magic_1d7869: "If somebody steals magical powers from the Orb with ulterior motives and starts using it..."
  npc_override_ecl_fild01_quests_eclage_if_something_ever_happen_00e81f: "If something ever happens and I die from it, "
  npc_override_ecl_fild01_quests_eclage_if_there_beautiful_yai_m_c7947f: "If there were a beautiful Yai of my own, it would truly be a paradise!"
  npc_override_ecl_fild01_quests_eclage_if_there_oppositions_amo_4cff5a: "If there were ^000099oppositions among Dona forces^000000 of nobility, or ^000099slaughtering among Dona forces^000000, those acts cannot be recorded as official history."
  npc_override_ecl_fild01_quests_eclage_if_there_really_as_much_008308: "If there was really as much antagonism as to be excluded from the history, Eclage and Bifrost could not be the way they are now."
