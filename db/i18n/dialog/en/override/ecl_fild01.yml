  npc_override_ecl_fild01_quests_eclage_menu_re_297d23: "^990000RE:^000000I heard this from my father, but to fight against Elder Assembly's decisions, ^000099Etran and Robert argued one another in front of the elders on purpose.^000000 Is that true?"
  npc_override_ecl_fild01_quests_eclage_menu_re_2aba7d: "^990000RE:^000000I'll be running with the high profile photo of Mayor Jun in undies. I'll give it to the first one to claim it!"
  npc_override_ecl_fild01_quests_eclage_menu_re_3ed59a: "^990000RE:^000000Who ruined this part here? This is the only copy left!! I love this story."
  npc_override_ecl_fild01_quests_eclage_menu_re_b994a6: "^990000RE:^000000If you are a Laphine with a wing span greater than 180cm, I'll consider dating you."
  npc_override_ecl_fild01_quests_eclage_menu_re_e9904b: "^990000RE-RE:^000000: I have another copy that I made. If you want it, let me know."
  npc_override_ecl_fild01_quests_eclage_menu_re_ea6571: "^990000RE:^000000There are more idiots that believe this stuff. Hey kids, Eclage Monthly is a third-rate gossip magazine. Don't confuse it with history."
  npc_override_ecl_fild01_quests_eclage_menu_re_f27a2a: "^990000RE:^000000Hey guys, do you know this? The Elder Assembly at first completely opposed the building of home tree. But it says in the history books that they're the ones that came up with the idea. Isn't that weird? Who's right?"
  npc_override_ecl_fild01_quests_eclage_menu_re_f50e0c: "^990000RE-RE:^000000: I'll take the photo. I'll put you on our editorial staff."
  npc_override_ecl_fild01_quests_eclage_menu_re_f87e1e: "^990000RE-RE:^000000: I heard that too. ^000099To make sure they seem authentic, they started arguing each other a bit by bit from a few days before the meeting^000000. That's the most controversial topic among historians."
  npc_override_ecl_fild01_quests_eclage_menu_re_fde769: "^990000RE-RE:^000000: Oh I see. Thank you so much for your wisdom. I guess if you leave comments like that on a third-rate magazine, you just look incredibly smart."
