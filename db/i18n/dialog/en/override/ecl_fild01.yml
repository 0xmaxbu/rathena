  npc_override_ecl_fild01_quests_eclage_i_also_heard_7d0986: "I also heard that"
  npc_override_ecl_fild01_quests_eclage_i_also_honestly_did_beli_50fb5a: "I also honestly did not believe that there would be such a big bird."
  npc_override_ecl_fild01_quests_eclage_i_also_made_enough_wicks_8dab03: "I also made enough wicks just in time!"
  npc_override_ecl_fild01_quests_eclage_i_also_met_someone_who_a077eb: "And I also met someone who witnessed another bigger Laphine chasing after that Laphine before you were imprisoned here."
  npc_override_ecl_fild01_quests_eclage_i_also_outcasted_here_pe_75f81c: "I was also outcasted here. People had no conception of hospitality and generosity toward outsiders."
