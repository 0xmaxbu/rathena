  npc_override_ecl_fild01_quests_eclage_i_am_so_glad_i_277cf6: "I am so glad I finally have my own Yai!"
  npc_override_ecl_fild01_quests_eclage_i_am_so_sorry_62d704: "I am so sorry."
  npc_override_ecl_fild01_quests_eclage_i_am_trapped_body_no_26ef4d: "I am trapped in this body no matter what..."
