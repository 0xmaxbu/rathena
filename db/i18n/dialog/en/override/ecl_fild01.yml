  npc_override_ecl_fild01_quests_eclage_i_almost_didn_t_recogniz_be3b92: "I almost didn't recognize him because he changed his hair color. But the way he looks and talks is pretty much the same. Disgusting!"
  npc_override_ecl_fild01_quests_eclage_i_almost_forgot_he_main_54ffff: "I almost forgot that he is the main culprit of this."
