  npc_override_ecl_fild01_quests_eclage_humans_too_establish_bor_206278: "Humans, too, establish border towns close to the boundary of their residential area, and the city of Aldebaran is one of them."
  npc_override_ecl_fild01_quests_eclage_humans_truly_scary_i_fee_527fed: "Humans are truly scary. But I feel like I've seen this maze somewhere..."
