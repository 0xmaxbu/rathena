  npc_override_ecl_fild01_quests_eclage_i_couldn_t_go_out_d84b90: "I couldn't go out to get you!"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_make_far_a96e3a: "^D96E26but I couldn't make it~that far~I was faint with hunger.^000000"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_possibly_carr_cc64bf: "I couldn't possibly carry something that bigeow..."
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_talk_him_634df4: "I couldn't talk to him,"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_tell_my_2bd0ef: "But, I couldn't tell my parents because if they were to find out the truth,"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_work_without_7b1b64: "I couldn't work without them."
  npc_override_ecl_fild01_quests_eclage_i_d_like_make_suggestion_1e49fd: "I'd like to make a ^0000cdsuggestion^000000."
  npc_override_ecl_fild01_quests_eclage_i_decided_eat_some_time_2230e5: "I decided not to eat it for some time."
  npc_override_ecl_fild01_quests_eclage_i_decorate_yai_materials_609a00: "I have to decorate Yai with the materials you brought me the other day, but I don't know when I could leave..."
  npc_override_ecl_fild01_quests_eclage_i_definitely_knew_even_u_3df6ab: "I definitely knew it even until a few hundred years back but I forgot it clearly now."
  npc_override_ecl_fild01_quests_eclage_i_definitely_saw_midgard_480eeb: "I definitely saw it at Midgard."
  npc_override_ecl_fild01_quests_eclage_i_did_steal_ceefab: "I did not steal"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_even_anything_2e0f45: "I didn't even do anything wrong!"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_even_share_fe055b: "I didn't even share it with my brother who I trust so much."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_expect_meet_957359: "I didn't expect to meet a person from Midgard!"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_get_know_ea8a81: "I didn't get to know you very long, but thank you, traveler from the future."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_know_he_6db9c9: "But I didn't know he would be irresponsible like this."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_know_there_b52fa0: "I didn't know there would be such a way."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_know_what_f1a4ab: "I didn't know what exactly it was, but while I was pondering on it, Avant just came across my mind."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_know_you_193cdf: "I didn't know you would say no like that..."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_know_you_60db37: "I didn't know you put such deep consideration for this..."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_really_anything_335e0e: "I didn't really have anything "
  npc_override_ecl_fild01_quests_eclage_i_didn_t_see_anybody_843952: "I didn't see anybody."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_sense_any_92f73e: "I didn't sense any use of magic or other things of the sort..."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_steal_any_a9f243: "I didn't steal any alcohol."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_think_much_ac5ff0: "I didn't think much into it and returned home. But some time later a scream, so loud that could shake the entire field, ripped through the air."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_understand_him_b40c4d: "I didn't understand him better."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_want_myself_0929a4: "I didn't want this for myself... My greed was excessive."
  npc_override_ecl_fild01_quests_eclage_i_didn_t_want_provide_005418: "I didn't want to provide him with food and a place to live for free,"
  npc_override_ecl_fild01_quests_eclage_i_didn_t_want_show_bbb12e: "I didn't want to show you this, but this scar is the proof."
  npc_override_ecl_fild01_quests_eclage_i_digressed_bit_there_st_78ddfd: "I digressed a bit there. The story of the birth of Eclage is actually an unofficial history record handed down as classified material. But there have been parts of it that were incorrect."
  npc_override_ecl_fild01_quests_eclage_i_disadvantage_675fdf: "I have the disadvantage!"
  npc_override_ecl_fild01_quests_eclage_i_doing_my_business_fiel_94e9f7: "I was doing my business in the field in the middle of a night, but there suddenly appeared two dark shadows!"
  npc_override_ecl_fild01_quests_eclage_i_don_t_7df0a4: "I don't."
  npc_override_ecl_fild01_quests_eclage_i_don_t_any_responsibili_932ed7: "I don't have any responsibility. But the earth will be sad if any of the adventurers gets hurt here."
  npc_override_ecl_fild01_quests_eclage_i_don_t_anything_else_24263d: "I don't have anything else to do at the clinic."
  npc_override_ecl_fild01_quests_eclage_i_don_t_believe_myths_0f2251: "I don't believe in myths."
  npc_override_ecl_fild01_quests_eclage_i_don_t_blame_you_7d1f40: "I don't blame you since it is ignorance."
  npc_override_ecl_fild01_quests_eclage_i_don_t_come_up_6a1a4a: "I don't have~ Come on up~"
  npc_override_ecl_fild01_quests_eclage_i_don_t_even_know_9d1f2b: "I don't even know how this gossip is going to useful for me. Is this all you talked about with Clever?"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_about_b9eb72: "I don't know about this..."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_acedd2: "I don't know."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_anything_64adb5: "I don't know anything besides that. But if it is a real home tree leaf, there's no way I wouldn't be able to tell. The life reaction from a home tree leaf is incredible."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_exactly_79c7e9: "I don't know it exactly..."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_him_8bf2a7: "I don't know him."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_how_7417e8: "I don't know how I managed to live without these sweets!"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_how_9cf59f: "I don't know how a guy who lived so peacefully all his life became like that."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_how_bda945: "I don't know how this sounds to you, but I think it's a good thing that you became Mayor."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_how_c3351e: "I don't know how long it will take. It would be difficult to meet Etran and Robert simultaneously for now."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_how_c5f16c: "I don't know how nice kids like them became like that..."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_if_7bb345: "I don't know if I should say I'm okay...or not..."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_if_cefce4: "I don't know if that was good or bad..."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_person_da05ab: "I don't know that person! Aren't you suspicious!"
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_what_4b1fbc: "I don't know what is on Mayor's mind, but he invites them and gives them works."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_what_5bd54d: "I don't know what it is, but I would like to see his work."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_when_e8eae3: "I don't know when's the last time I've had this much peace. I pray for the blessing of your home tree."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_where_62da3b: "I don't know where you heard about him but you should give up. You won't be able to find him."
  npc_override_ecl_fild01_quests_eclage_i_don_t_know_where_ebb77c: "but I don't know where he is..."
