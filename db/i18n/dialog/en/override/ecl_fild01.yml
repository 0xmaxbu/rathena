  npc_override_ecl_fild01_quests_eclage_if_they_really_carnivore_15e6b6: "if they were really carnivores, what food would they live on? Moreover, there is no record of them eating the adventurers who travel by after attacking them."
  npc_override_ecl_fild01_quests_eclage_if_they_scratched_fittin_a62979: "If they are scratched fittingly, they will look even wilder. "
  npc_override_ecl_fild01_quests_eclage_if_things_never_happened_fed4b8: "If things that have never happened before happened, then there's something new going on."
