  npc_override_ecl_fild01_quests_eclage_i_ask_you_eliminate_them_b73fe4: "I ask you to eliminate them when you patrol the area next time."
  npc_override_ecl_fild01_quests_eclage_i_ask_you_favor_e92bdd: "can I ask you a favor?"
  npc_override_ecl_fild01_quests_eclage_i_ask_you_use_hiel_cc80bf: "I ask that you would use Hiel's rift tool to meet with the past's Etran and Laphines."
  npc_override_ecl_fild01_quests_eclage_i_asked_you_horns_hillsl_1d4e3e: "I asked you for 5 Horns of Hillslion, 5 Mystic Horns, and 5 Horse's Hooves."
  npc_override_ecl_fild01_quests_eclage_i_ate_so_much_i_25565a: "I ate so much that I took to my bed with a bad toothache."
