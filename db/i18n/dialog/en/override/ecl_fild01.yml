  npc_override_ecl_fild01_quests_eclage_i_brought_guy_named_yube_ec88e1: "I brought the guy named Yube!"
  npc_override_ecl_fild01_quests_eclage_i_brought_some_meat_fili_b19a8a: "I brought some meat from Fili!"
  npc_override_ecl_fild01_quests_eclage_i_came_after_talking_mas_2e93ca: "I came after talking with Masione..."
  npc_override_ecl_fild01_quests_eclage_i_came_back_after_viewin_246be3: "I came back after viewing those references."
  npc_override_ecl_fild01_quests_eclage_i_collecting_some_star_s_c553c9: "I was collecting some ^FF0000Star Shape Mushrooms^000000!"
  npc_override_ecl_fild01_quests_eclage_i_come_help_out_later_c6f7c4: "I will come by to help out later even if it's by tying this guy up to a pole."
  npc_override_ecl_fild01_quests_eclage_i_coming_back_40430a: "I was coming back from"
  npc_override_ecl_fild01_quests_eclage_i_commanded_guards_stren_554bd2: "I commanded the guards to strengthen security patrols around the Orb."
  npc_override_ecl_fild01_quests_eclage_i_could_ve_showed_fili_386967: "I could've showed Fili my new moves!"
  npc_override_ecl_fild01_quests_eclage_i_couldn_t_ask_them_ba6766: "I couldn't ask them straightforward questions related to that since I was afraid that it might hurt their pride."
