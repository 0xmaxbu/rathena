  npc_override_morocc_in_tu_sword_another_task_you_perform_7295e1: "another task for you to perform. Please visit Dequ'ee in Geffen since it seems he has something"
  npc_override_morocc_in_tu_sword_any_case_there_s_no_8a7043: "In any case, there's no need to worry about it anymore. But if we ever need assistance, I'll remember to ask you for your help."
