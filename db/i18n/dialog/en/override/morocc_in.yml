  npc_override_morocc_in_tu_sword_all_i_teach_you_about_77f8e7: "That is all I have to teach you about Swordman skills. Hopefully, I've been able to clear up anything you haven't understood about your job and skills."
  npc_override_morocc_in_tu_sword_all_means_47f32c: "all of this means."
  npc_override_morocc_in_tu_sword_all_suspects_first_0ef504: "from all the suspects? First,"
  npc_override_morocc_in_tu_sword_allow_me_introduce_mysel_bf645f: "Allow me to introduce myself. I am Shurank Chainlier, a Knight in the service of the Prontera Chivalry."
  npc_override_morocc_in_tu_sword_alright_come_back_me_whe_e06b06: "Alright, come back to me when you become sufficiently skilled in the use of Provoke. In the meantime, keep training."
