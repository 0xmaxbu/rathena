  npc_override_morocc_in_tu_sword_alright_looks_like_bankl_f7f6e9: "Alright! It looks like Bankley is the murderer! Although we can't trust this 100%, this evidence is pretty conclusive."
  npc_override_morocc_in_tu_sword_alright_now_i_want_you_c15365: "Alright. Now I want you to train in the use of the Endure skill. You can become a great Swordman"
  npc_override_morocc_in_tu_sword_alright_now_please_dd654c: "Alright, now please"
  npc_override_morocc_in_tu_sword_alright_then_0bad1c: "Alright, then"
  npc_override_morocc_in_tu_sword_also_higher_level_provok_f7d504: "Also, the higher the level of Provoke that is used, the higher the attack increase and defense decrease of your target."
  npc_override_morocc_in_tu_sword_also_keep_mind_special_m_dce59b: "Also, keep in mind that this is a special mission for the Swordman Association. So keep everything you learn a secret. Understood?"
