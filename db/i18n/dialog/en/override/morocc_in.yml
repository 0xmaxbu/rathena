  npc_override_morocc_in_tu_sword_ah_you_ve_returned_i_97b636: "Ah, you've returned. I've just received a communique from"
  npc_override_morocc_in_tu_sword_ah_you_ve_returned_new_83bdf8: "Ah, you've returned. For a new Swordman, you are doing quite"
