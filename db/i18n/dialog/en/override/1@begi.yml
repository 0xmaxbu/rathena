Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_1@begi_PoringVillage_ah_i_found_some_items_50d5f9: "Ah, I found some items. Let me give you one of them. Just to celebrate your first visit!"
  npc_override_1@begi_PoringVillage_all_traces_poring_villag_1807f4: "^0000ffAll Traces of the Poring Village quest were removed. Now, talk to Emily again to enter^000000"
  npc_override_1@begi_PoringVillage_any_processing_monsters_dd7ac1: "^ff0000Any processing of monsters such as monster taming inside the dungeon will not be considered a normal progress. Please note that.^000000"
  npc_override_1@begi_PoringVillage_as_i_heard_you_get_e1bd02: "As I heard, you can get Poring Village Green Onion or Carrot if you go west a bit more from here."
  npc_override_1@begi_PoringVillage_beginner_mode_player_tra_db8432: "^ff0000In beginner mode, the player transforms into a monster. Please note that the existing transformation effect disappears when entering and proceeding.^000000"
  npc_override_1@begi_PoringVillage_cancel_77dfd2: "Cancel"
  npc_override_1@begi_PoringVillage_drives_me_crazy_ok_let_172a43: "This drives me crazy. OK, 50-50. Let's go with this."
  npc_override_1@begi_PoringVillage_enchant_poring_village_v_d3ec85: "Enchant to Poring Village Veggie"
  npc_override_1@begi_PoringVillage_enchant_requires_jellopy_f1af98: "This enchant requires 50 Jellopy and 20,000z..... But... you don't have them."
  npc_override_1@begi_PoringVillage_enchant_reset_failure_in_cbace8: "Enchant and reset have ^ff000030% of failure.^000000 Invest in your veggie and luck!"
  npc_override_1@begi_PoringVillage_enchant_reset_requires_z_73664e: "Enchant or Reset requires 20,000z and 50 Jellopy! It's not bad, is it?"
  npc_override_1@begi_PoringVillage_hmm_you_should_create_pa_44d860: "Hmm you should create a party first to start this grand adventure."
  npc_override_1@begi_PoringVillage_how_about_2385af: "How about 60-40!!"
  npc_override_1@begi_PoringVillage_how_much_i_need_enchant_ba4266: "How much do I need to enchant?"
  npc_override_1@begi_PoringVillage_how_square_s_much_better_f5b9bd: "How square! It's much better to be together!"
  npc_override_1@begi_PoringVillage_i_don_t_need_novice_6dcae6: "I don't need this novice box. You can take it. Now, let's go out side!"
  npc_override_1@begi_PoringVillage_i_enchant_fresh_vegetabl_9933f2: "I do enchant to the fresh vegetable."
  npc_override_1@begi_PoringVillage_i_m_going_start_slowly_3df46e: "I'm going to start slowly now..."
  npc_override_1@begi_PoringVillage_i_m_interested_4f8b4b: "I'm not interested."
  npc_override_1@begi_PoringVillage_i_should_find_another_ad_61b40b: "I should find another adventurer who is similar with my level. It's been nice knowing you."
  npc_override_1@begi_PoringVillage_item_complete_check_out_2dfb0a: "The item is complete! Check it out."
  npc_override_1@begi_PoringVillage_jellopies_zeny_all_you_n_d3f8ce: "50 Jellopies and 20,000 zeny are all you need to get special effect on your green onion or carrot!"
  npc_override_1@begi_PoringVillage_let_s_go_forward_82f5f6: "Let's go forward."
  npc_override_1@begi_PoringVillage_menu_emily_0fb6df: "Emily: OK. Let's go!"
  npc_override_1@begi_PoringVillage_menu_emily_133254: "Emily: I'm not good at battle.. Let me look for treasure first. See you soon~"
  npc_override_1@begi_PoringVillage_menu_emily_23d300: "Emily: It sounds someone is rushing here... "
  npc_override_1@begi_PoringVillage_menu_emily_482d1e: "Emily: But the Poring looks unique somehow. Be careful!"
  npc_override_1@begi_PoringVillage_menu_emily_5357ee: "Emily: It's for me to judge after looking around more...."
  npc_override_1@begi_PoringVillage_menu_emily_5cf479: "Emily: What is it saying?"
  npc_override_1@begi_PoringVillage_menu_emily_6c949c: "Emily: I'm quite sure Poring gathered a lot of treasure somewhere."
  npc_override_1@begi_PoringVillage_menu_emily_843104: "Emily: Ah, there is a unique force if you go near the column of blue light."
  npc_override_1@begi_PoringVillage_menu_emily_86c48f: "Emily: Well... OK. They don't seem very friendly. Quick, hide!"
  npc_override_1@begi_PoringVillage_menu_emily_88ed04: "Emily: Wow~ You are quite strong! You defeated all these Porings!"
  npc_override_1@begi_PoringVillage_menu_emily_8feb24: "Emily: Hmm.. here is another Boss... It looks strong..."
  npc_override_1@begi_PoringVillage_menu_emily_9974c3: "Emily: Hey, there! May I talk to you for a minute?"
  npc_override_1@begi_PoringVillage_menu_emily_be31a6: "Emily: Oooops. Can't you hide? Well..... Cheer up!"
  npc_override_1@begi_PoringVillage_menu_emily_c4591e: "Emily: Hmmm. It seems they made barriers not to let us go easily."
  npc_override_1@begi_PoringVillage_menu_emily_c52666: "Emily: What? Who are you?"
  npc_override_1@begi_PoringVillage_menu_emily_e0ca1e: "Emily: So.. is this Poring Village?"
  npc_override_1@begi_PoringVillage_menu_king_4e50ac: "King Poring: Excuse me... But... Would you please get back now?..."
  npc_override_1@begi_PoringVillage_menu_king_546eb2: "King Poring: Ugh.... I don't like fighting but there is no choice."
  npc_override_1@begi_PoringVillage_menu_king_5de8a8: "King Poring: Maybe there is some misunderstanding on our flyers. This village is so poor and has nothing valuable."
  npc_override_1@begi_PoringVillage_menu_king_a8de7a: "King Poring: I am the leader of this Poring Village. Sorry for the late introduction."
  npc_override_1@begi_PoringVillage_menu_options_3e5fa7: "???: Don't let them run! Take all valuable items from them!"
  npc_override_1@begi_PoringVillage_menu_options_5202b4: "???: I can hear a human's voice. Make them welcome, everybody."
  npc_override_1@begi_PoringVillage_menu_options_69b587: "{0} : Have you been bitten by a mad parrot?"
  npc_override_1@begi_PoringVillage_menu_options_93c79a: "{0} : Ohhhhh!!! Release the parrot inside!!!!"
  npc_override_1@begi_PoringVillage_menu_options_c16133: "{0} : I think it's ok to peck someone right now!!"
  npc_override_1@begi_PoringVillage_menu_veggie_12b1c5: "Veggie Enchanter: Make your green onion or carrot stronger!"
  npc_override_1@begi_PoringVillage_msg_8fd52e: "50-50 ..."
  npc_override_1@begi_PoringVillage_must_been_rotten_vegetab_c33bc6: "It must have been a rotten vegetable. It's a shame that I can't stand this level of power..."
  npc_override_1@begi_PoringVillage_my_name_emily_i_waiting_2c12b3: "My name is Emily. I was waiting for someone who will go on adventures with me!"
  npc_override_1@begi_PoringVillage_no_way_i_m_course_e434da: "No way. 70-30. And I'm 70 of course."
  npc_override_1@begi_PoringVillage_now_i_m_looking_entrance_fa634c: "Now I'm looking for the entrance, please talk to me again after it's totally open."
  npc_override_1@begi_PoringVillage_oh_now_you_stronger_than_df1b95: "Oh, now you are stronger than me. How did you grow so fast?"
  npc_override_1@begi_PoringVillage_party_member_party_enter_7d0aa4: "Party member {0} of the party {1} enters {2}."
  npc_override_1@begi_PoringVillage_please_put_equipment_you_d17e01: "Please put on the equipment you'd like to enchant first."
  npc_override_1@begi_PoringVillage_proper_reward_42c2e3: "Proper Reward?"
  npc_override_1@begi_PoringVillage_reset_poring_village_veg_863c5a: "Reset Poring Village Veggie"
  npc_override_1@begi_PoringVillage_s_gotta_s_no_good_fa8d5a: "It's gotta be 50-50 or it's no good"
  npc_override_1@begi_PoringVillage_seems_poring_village_def_464954: "It seems this Poring Village can be defeated by beginners just like us. It's just a wild guess though..."
  npc_override_1@begi_PoringVillage_so_you_ready_be603b: "So, are you ready?"
  npc_override_1@begi_PoringVillage_sounds_fair_me_14c413: "But 50-50 sounds fair to me."
  npc_override_1@begi_PoringVillage_tada_enchant_done_check_318f0b: "Tada! Enchant is done! Check your vegetable."
  npc_override_1@begi_PoringVillage_time_s_crack_created_yet_371c18: "^ff0000Time's crack is not created yet.^000000"
  npc_override_1@begi_PoringVillage_unknown_error_occurred_285cc7: "An unknown error occurred."
  npc_override_1@begi_PoringVillage_vegetable_b56504: "This is not a vegetable!?"
  npc_override_1@begi_PoringVillage_vegetable_cannot_enchant_541cf1: "This vegetable cannot be enchanted anymore."
  npc_override_1@begi_PoringVillage_vegetable_never_been_for_cfd54b: "This is a vegetable that has never been fortified..."
  npc_override_1@begi_PoringVillage_well_actually_i_cannot_g_effe87: "Well, actually I cannot give you the reward officially through adventurer association. But we can separate the income after hunting."
  npc_override_1@begi_PoringVillage_well_as_you_know_s_4060a5: "Well... As you know, it's a vegetable any way. So sometimes it can be broken."
  npc_override_1@begi_PoringVillage_well_come_one_don_t_884827: "Well, come one. Don't be stern. Listen, you can decide after listening to my story. Of course, I can give you a proper reward."
  npc_override_1@begi_PoringVillage_who_said_i_adventure_you_18a571: "Who said I will adventure with you?"
  npc_override_1@begi_PoringVillage_why_don_t_you_come_a5af5a: "Why don't you come back after a while? Take a break for now."
  npc_override_1@begi_PoringVillage_wow_you_look_like_novice_6375c7: "Wow~ You look like a novice. I do want to adventure with you someday when you grow up!"
  npc_override_1@begi_PoringVillage_yes_proper_reward_884b96: "Yes! Proper Reward."
  npc_override_1@begi_PoringVillage_you_all_items_you_find_50aa3d: "You can have all of the items you find in this dungeon. I already have some."
  npc_override_1@begi_PoringVillage_you_look_very_tired_91f8fd: "You look very tired."
