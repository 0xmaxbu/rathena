Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_pub_cat_quests_dungeons_200_abyssal_solitude_b354f3: "Abyssal Solitude"
  npc_override_pub_cat_quests_dungeons_200_according_recent_sources_985bb7: "According to recent sources... Deep in the darkness of Niflheim, the dead hold a banquet,"
  npc_override_pub_cat_quests_dungeons_200_actually_i_ve_been_dead_5859d7: "Actually, I've been dead for a while, but I've only recently come to Niflheim. So I decided to sleep here in this house..."
  npc_override_pub_cat_quests_dungeons_200_actually_s_more_like_mon_774207: "Actually, it's more like a monster than a homunculus..."
  npc_override_pub_cat_quests_dungeons_200_actually_screams_when_li_66475a: "It actually screams when a living person knocks on it."
  npc_override_pub_cat_quests_dungeons_200_adventurer_what_you_thin_ffc0d1: "Adventurer. What do you think?"
  npc_override_pub_cat_quests_dungeons_200_ah_after_all_living_hear_6d3f97: "Ah, after all, the living do not hear that sound. This is my agony only known to the dead..."
  npc_override_pub_cat_quests_dungeons_200_ah_did_you_come_see_34e766: "Ah, did you come to see Yulma from Bullet Meow?"
  npc_override_pub_cat_quests_dungeons_200_ah_excuse_me_3c1247: "Ah... Excuse me."
  npc_override_pub_cat_quests_dungeons_200_ah_i_m_sorry_i_63df0a: "Ah... I'm sorry. I misunderstood. All the people who have come this far were weird kids or people who sold drugs, so I kicked them out."
  npc_override_pub_cat_quests_dungeons_200_ah_take_look_my_head_99c78f: "Ah, take a look. My head is falling out just with all the staff."
  npc_override_pub_cat_quests_dungeons_200_ah_you_changed_your_word_ee03e2: "Ah, you changed your words!"
  npc_override_pub_cat_quests_dungeons_200_all_ones_dolls_so_noisy_bc2102: "All the ones with dolls are so noisy."
  npc_override_pub_cat_quests_dungeons_200_among_homunculus_intensi_5d7b16: "Among the homunculus in the intensive culture chamber, there are Mutant Chimera Lavaeter and Mutant Chimera Fulgor."
  npc_override_pub_cat_quests_dungeons_200_anyway_thank_you_today_b70914: "Anyway, thank you for today."
  npc_override_pub_cat_quests_dungeons_200_anyway_you_want_collect_aff8c2: "Anyway, you want to collect <FONT COLOR = 0000CD>Dolorian, Plagarion, and Deadre</FONT> data."
  npc_override_pub_cat_quests_dungeons_200_area_accessed_level_high_09eb6f: " - This area can be accessed from level 215 or higher -"
  npc_override_pub_cat_quests_dungeons_200_as_expected_hero_rare_fi_db955f: "As expected from a hero. It is rare to find someone outside of the Rebellions who works with such sincerity and cleanliness."
  npc_override_pub_cat_quests_dungeons_200_as_result_investigation_ce74c7: "As a result of the investigation, the chimeras that were being cultivated ran out of control due to an explosion accident and turned into monsters and were left unattended."
  npc_override_pub_cat_quests_dungeons_200_ask_if_i_just_hunt_91c56f: "Ask if I can just hunt"
  npc_override_pub_cat_quests_dungeons_200_back_hand_d711a2: "Back of hand"
  npc_override_pub_cat_quests_dungeons_200_back_neck_433b6c: "Back neck"
  npc_override_pub_cat_quests_dungeons_200_banquet_5d6f5a: "Banquet is..."
  npc_override_pub_cat_quests_dungeons_200_banquet_hall_dead_9b7cf9: "of the banquet hall of the dead."
  npc_override_pub_cat_quests_dungeons_200_because_also_job_navi_yu_636a49: "Because this is also a job, <NAVI>[Yulma]<INFO>pub_cat,94,43,0,101,0</INFO></NAVI> will give you a small allowance when you return."
  npc_override_pub_cat_quests_dungeons_200_because_also_job_since_i_d7ef80: "Because this is also a job... Since I safely replaced him, the superiors asked me to take care of the allowance."
  npc_override_pub_cat_quests_dungeons_200_because_i_t_just_leave_300546: "Because I can't just leave this to anyone."
  npc_override_pub_cat_quests_dungeons_200_become_gigantic_harbor_m_74b246: "to become gigantic, or to harbor more venom..."
  npc_override_pub_cat_quests_dungeons_200_beloved_living_thank_you_a102e9: "Beloved living, thank you for your mercy."
  npc_override_pub_cat_quests_dungeons_200_beyond_dangerous_so_acce_81ef18: "Beyond this it is dangerous, so access is restricted except for adventurers above a certain level."
  npc_override_pub_cat_quests_dungeons_200_blessed_mercy_living_aef5bb: "Blessed be the mercy of the living!"
  npc_override_pub_cat_quests_dungeons_200_both_creatures_imitate_h_7c3af1: "Both are creatures that imitate human form, but add a powerful transformation of the chimera properties to it."
  npc_override_pub_cat_quests_dungeons_200_came_under_investigation_55f16d: "It came under investigation because one of the administrators of that abandoned lab was Werner."
  npc_override_pub_cat_quests_dungeons_200_come_back_after_dawn_wor_0f6306: "Come back after dawn and work with us!"
  npc_override_pub_cat_quests_dungeons_200_come_s_course_someone_as_35b06b: "Come on, that's it. Of course someone as talented as you can go to Niflheim."
  npc_override_pub_cat_quests_dungeons_200_course_i_don_t_many_fb6bd9: "Of course I don't have many days left and it's not the right time for me to go and I can't come back in time."
  npc_override_pub_cat_quests_dungeons_200_course_they_come_again_t_8e4969: "Of course not. They will come again tomorrow."
  npc_override_pub_cat_quests_dungeons_200_crazy_villagers_over_the_4840c4: "The crazy villagers over there... they have a banquet every day."
  npc_override_pub_cat_quests_dungeons_200_data_backup_3cd559: "Data Backup"
  npc_override_pub_cat_quests_dungeons_200_data_collected_automatic_214ca5: "Data will be collected automatically, so you just need to focus on hunting."
  npc_override_pub_cat_quests_dungeons_200_despite_destruction_cult_8a151f: "Despite the destruction of the culture facility, the number of individuals continues to increase, so I would like to ask you to hunt about 15 specimens of each!"
  npc_override_pub_cat_quests_dungeons_200_did_you_find_any_traces_a5273b: "Did you find any traces?"
  npc_override_pub_cat_quests_dungeons_200_different_homunculus_rep_827b97: "It is different from a homunculus in that it reproduces itself and it decides without an owner."
  npc_override_pub_cat_quests_dungeons_200_documents_files_data_any_c1562a: "Documents, files, data! Anything is fine."
  npc_override_pub_cat_quests_dungeons_200_doesn_t_last_long_1b3784: "It doesn't last that long..."
  npc_override_pub_cat_quests_dungeons_200_don_t_help_2f5ade: "Don't help"
  npc_override_pub_cat_quests_dungeons_200_don_t_look_him_e71efb: "Don't look for him"
  npc_override_pub_cat_quests_dungeons_200_drop_sweat_shines_passio_ca88ee: "It is a drop of sweat that shines with passion and effort."
  npc_override_pub_cat_quests_dungeons_200_earlobe_a02faa: "Earlobe"
  npc_override_pub_cat_quests_dungeons_200_earth_fire_d221d6: "Earth and Fire"
  npc_override_pub_cat_quests_dungeons_200_eh_won_t_you_24522e: "Eh, won't you?"
  npc_override_pub_cat_quests_dungeons_200_even_if_i_look_you_9e9fc8: "Even if I look at you with my eyes I recognize your skills at a glance, please do something...!"
  npc_override_pub_cat_quests_dungeons_200_even_if_you_refuse_we_919d1c: "Even if you refuse, we can't help it..."
  npc_override_pub_cat_quests_dungeons_200_evil_if_you_pretend_know_b06607: "Evil! If you pretend to know, monsters will come!"
  npc_override_pub_cat_quests_dungeons_200_excuse_me_no_more_work_5c9a9b: "Excuse me! No more work!"
  npc_override_pub_cat_quests_dungeons_200_excuse_me_sir_no_more_8bb08f: "Excuse me, sir! No more work!"
  npc_override_pub_cat_quests_dungeons_200_font_color_cd_font_roami_596d3b: "<FONT COLOR = 0000CD>{0} and {1}</FONT> will be roaming the first floor of the closed lab Amicitia."
  npc_override_pub_cat_quests_dungeons_200_font_color_cd_font_stayi_0e3e86: "<FONT COLOR = 0000CD>{0} and {1}</FONT> are staying on the first floor of the closed lab Amicitia."
  npc_override_pub_cat_quests_dungeons_200_font_size_um_these_resea_714d83: "<FONT SIZE = 9>Um... these researchers look a little dangerous too? I think that's how all researchers are, to a person like me.</FONT>"
  npc_override_pub_cat_quests_dungeons_200_font_size_um_why_don_e29ad9: "<FONT SIZE = 9>Um...why don't we do it? There must be something complicated at the upper level. I don't know.</FONT>"
  npc_override_pub_cat_quests_dungeons_200_forehead_03cd04: "Forehead"
  npc_override_pub_cat_quests_dungeons_200_form_we_cannot_imagine_4c565f: "in a form we cannot imagine."
  npc_override_pub_cat_quests_dungeons_200_fourth_floor_i_m_control_4ae4cd: "Fourth floor? I'm in control right there..."
  npc_override_pub_cat_quests_dungeons_200_fun_d02eae: "Would it be fun?"
  npc_override_pub_cat_quests_dungeons_200_gerbena_heartbroken_df05df: "Gerbena is heartbroken!"
  npc_override_pub_cat_quests_dungeons_200_gerbena_what_you_talking_a18e53: "Gerbena, what are you talking about all of a sudden!"
  npc_override_pub_cat_quests_dungeons_200_ghost_talking_about_seen_3aba75: "The ghost that was talking about is not seen, and another ghost is sleeping."
  npc_override_pub_cat_quests_dungeons_200_go_2e0b45: "Go"
  npc_override_pub_cat_quests_dungeons_200_go_away_52cb87: "Go away!"
  npc_override_pub_cat_quests_dungeons_200_go_back_quietly_93fc92: "Go back quietly"
  npc_override_pub_cat_quests_dungeons_200_go_tell_him_i_sent_251167: "Go and tell him I sent you, and find out if it's worth it to come!"
  npc_override_pub_cat_quests_dungeons_200_good_field_work_13ff5e: "Good. Field work."
  npc_override_pub_cat_quests_dungeons_200_grant_idle_old_man_wish_8088fd: "Grant an idle old man a wish."
  npc_override_pub_cat_quests_dungeons_200_guys_messy_hair_160b34: "Guys with messy hair"
  npc_override_pub_cat_quests_dungeons_200_ha_am_2121b0: "Ha-am..."
  npc_override_pub_cat_quests_dungeons_200_ha_i_know_even_if_9876f6: "Ha... I know, even if it's every day, there's a set time."
  npc_override_pub_cat_quests_dungeons_200_hahaha_did_you_hear_s_447e4e: "Hahaha, did you hear that? It's like alcohol... No, it's like that if you drink magic and act like a hawk."
  npc_override_pub_cat_quests_dungeons_200_haunt_collapsed_opera_ho_ba3ff7: "that haunt the collapsed Opera House."
  npc_override_pub_cat_quests_dungeons_200_he_doesn_t_like_he_f39057: "He doesn't like it. He is more comfortable doing it alone, calm down, Gerbena."
  npc_override_pub_cat_quests_dungeons_200_he_first_floor_rudus_its_6bd17c: "He is on the first floor, and Rudus itself exists on the second and third floors."
  npc_override_pub_cat_quests_dungeons_200_he_looks_cute_ee04ae: "He looks cute"
  npc_override_pub_cat_quests_dungeons_200_he_probably_disguised_ob_17be9a: "He is probably disguised to observe monsters, but I'll give you the location, so go check it out!"
  npc_override_pub_cat_quests_dungeons_200_he_s_known_hiding_very_e97d77: "He's known for hiding very well, even though he doesn't have the skills to hide."
  npc_override_pub_cat_quests_dungeons_200_he_said_he_doesn_t_f57bea: "He said he doesn't like it. He is more comfortable doing it alone, calm down, Gerbena."
  npc_override_pub_cat_quests_dungeons_200_hehe_s_good_good_convers_e9b4f7: "Hehe, it's good to have a good conversation with {0}."
  npc_override_pub_cat_quests_dungeons_200_help_c47ae1: "Help"
  npc_override_pub_cat_quests_dungeons_200_help_hunting_6e4fce: "Help hunting"
  npc_override_pub_cat_quests_dungeons_200_here_glass_tropical_sogr_c836e2: "Here, a glass of Tropical Sograt, please!"
  npc_override_pub_cat_quests_dungeons_200_here_you_53c9e6: "Here you are!"
  npc_override_pub_cat_quests_dungeons_200_hero_there_homunculus_in_9d7c6d: "Hero, there was a homunculus intensive culture room on the second floor of the Amicitia lab."
  npc_override_pub_cat_quests_dungeons_200_hero_these_things_we_lik_08e70d: "Hero, these are the things we would like to ask of you from Amicitia."
  npc_override_pub_cat_quests_dungeons_200_hero_why_don_t_you_f39f91: "Hero, why don't you reconsider calmly?"
  npc_override_pub_cat_quests_dungeons_200_hero_you_hunt_font_color_2908e8: "Hero, can you hunt 15 <FONT COLOR = 0000CD>{0} and {1}</FONT> each?"
  npc_override_pub_cat_quests_dungeons_200_hero_you_like_join_missi_9662b6: "Hero, would you like to join the mission tomorrow as well?"
  npc_override_pub_cat_quests_dungeons_200_hick_15eed2: "...hick."
  npc_override_pub_cat_quests_dungeons_200_high_security_job_so_i_732619: "This is a high-security job, so I only want to ask the hero a favor."
  npc_override_pub_cat_quests_dungeons_200_hmm_hmm_i_see_1791a4: "Hmm hmm... I see!"
  npc_override_pub_cat_quests_dungeons_200_hmm_hmmm_entrance_down_s_6a9873: "Hmm, hmmm. The entrance down this slope is now restricted..."
  npc_override_pub_cat_quests_dungeons_200_hmm_no_b6c16d: "Hmm... no."
  npc_override_pub_cat_quests_dungeons_200_hmm_what_should_i_gerben_3b31e5: "Hmm, what should I do? Gerbena. Do you want to go?"
  npc_override_pub_cat_quests_dungeons_200_hmm_you_changed_your_min_1a4f73: "Hmm? Have you changed your mind?"
  npc_override_pub_cat_quests_dungeons_200_hmmmm_connect_my_machine_a26212: "Hmmmm... Connect with my machine... Empty data..."
  npc_override_pub_cat_quests_dungeons_200_honor_work_you_d5d26e: "It is an honor to work with you!"
  npc_override_pub_cat_quests_dungeons_200_how_did_you_know_chip_19dc44: "How did you know, {0}, the chip I put on you worked today."
  npc_override_pub_cat_quests_dungeons_200_how_did_you_recognize_me_f5bf0c: "How did you recognize me?"
  npc_override_pub_cat_quests_dungeons_200_how_much_more_lost_s_ecdb9b: "How much more has it lost it's original form, and whether it has changed itself after the experiment."
  npc_override_pub_cat_quests_dungeons_200_however_true_number_rebe_c27772: "However, it is true that the number of rebellions to be deployed is a bit short since the total number of members is small."
  npc_override_pub_cat_quests_dungeons_200_huh_7a6533: "...huh!"
  npc_override_pub_cat_quests_dungeons_200_huh_did_you_really_visit_8e7231: "Huh? Did you really visit the banquet hall deep in Niflheim?"
  npc_override_pub_cat_quests_dungeons_200_huh_huh_i_hear_bomb_008c18: "Huh, huh, I can hear the bomb head dusting all the way up to here."
  npc_override_pub_cat_quests_dungeons_200_huh_what_i_don_t_fc7830: "Huh? What? I don't deal with peddlers."
  npc_override_pub_cat_quests_dungeons_200_hunt_063772: "Hunt"
  npc_override_pub_cat_quests_dungeons_200_hunt_ea863f: "Do not hunt"
  npc_override_pub_cat_quests_dungeons_200_i_accept_dd2a95: "I accept"
  npc_override_pub_cat_quests_dungeons_200_i_am_always_indebted_you_9cc013: "I am always indebted to you. Good job!"
  npc_override_pub_cat_quests_dungeons_200_i_am_milla_i_am_3d0825: "I am Milla. I am now a resident of Niflheim."
  npc_override_pub_cat_quests_dungeons_200_i_am_prepared_like_so_d37566: "I am prepared like this, so I won't be afraid if I go later!"
  npc_override_pub_cat_quests_dungeons_200_i_appreciate_if_you_coul_7e28a3: "I would appreciate it if you could keep this request a secret."
  npc_override_pub_cat_quests_dungeons_200_i_back_up_format_data_98db09: "And I have to back up and format the data I have collected so that I can receive new data, but I don't have the talent to do that..."
  npc_override_pub_cat_quests_dungeons_200_i_couldn_t_hear_anything_d00023: "I couldn't hear anything, but the dead around me seem to be in an uproar."
  npc_override_pub_cat_quests_dungeons_200_i_couldn_t_tell_if_cf583b: "I couldn't tell if it was just neglected or intentionally."
  npc_override_pub_cat_quests_dungeons_200_i_didn_t_want_go_31eaca: "I didn't want to go through the mouths of as many people as possible, so the Rebellion units were excluded from this job."
  npc_override_pub_cat_quests_dungeons_200_i_eagerly_waiting_0508a9: "I was eagerly waiting for {0}!"
  npc_override_pub_cat_quests_dungeons_200_i_felt_like_i_could_896a0e: "I felt like I could do research even after dying, so I felt better."
  npc_override_pub_cat_quests_dungeons_200_i_go_0f1302: "I will go"
  npc_override_pub_cat_quests_dungeons_200_i_go_876648: "I will not go"
  npc_override_pub_cat_quests_dungeons_200_i_got_call_you_here_b1b84d: "I got a call. Are you here to renew the chip?"
  npc_override_pub_cat_quests_dungeons_200_i_grateful_if_you_could_3fb814: "I would be grateful if you could join the mission tomorrow as well."
  npc_override_pub_cat_quests_dungeons_200_i_heard_navi_researcher_3b18c4: "I heard that <NAVI>[Researcher]<INFO>sp_rudus4,192,204,0,101,0</INFO></NAVI> mostly burrows around the center of the 4th floor of Rudus."
  npc_override_pub_cat_quests_dungeons_200_i_hope_they_return_their_d4105f: "I hope they return to their senses after the banquet is over."
  npc_override_pub_cat_quests_dungeons_200_i_hope_you_help_me_a8bba0: "I hope you can help me tomorrow if you have time."
  npc_override_pub_cat_quests_dungeons_200_i_hope_you_show_hot_a30e1e: "I hope you show the hot taste to"
  npc_override_pub_cat_quests_dungeons_200_i_just_had_business_went_57372b: "I just had a business, and it went well."
  npc_override_pub_cat_quests_dungeons_200_i_like_ask_you_hunt_82cc35: "I would like to ask you to hunt <FONT COLOR = 0000CD>{0} and {1}</FONT> among the chimeras that were being cultured."
  npc_override_pub_cat_quests_dungeons_200_i_like_ask_you_hunt_d85edf: "I would like to ask you to hunt <FONT COLOR = 0000CD>{0} and {1}</FONT> among the chimeras in culture."
  npc_override_pub_cat_quests_dungeons_200_i_like_chocolate_milk_7bc91b: "I like chocolate milk."
  npc_override_pub_cat_quests_dungeons_200_i_like_more_research_if_f1c323: "I would like to do more research, but if my life is really in danger..."
  npc_override_pub_cat_quests_dungeons_200_i_ll_ask_kind_skill_4dcab9: "I'll ask for that kind of skill based on your kindness..."
  npc_override_pub_cat_quests_dungeons_200_i_ll_come_hunting_0c9fd7: "I'll come hunting"
  npc_override_pub_cat_quests_dungeons_200_i_ll_hunt_them_bf2662: "I'll hunt them"
  npc_override_pub_cat_quests_dungeons_200_i_ll_introduce_you_resea_455456: "I'll introduce you to a researcher who is currently in the field, would you like to go directly?"
  npc_override_pub_cat_quests_dungeons_200_i_ll_move_you_take_5bd1ba: "I'll move you. Take care!"
  npc_override_pub_cat_quests_dungeons_200_i_ll_move_you_th_3bccb2: "I'll move you to the 4th floor."
  npc_override_pub_cat_quests_dungeons_200_i_ll_wait_until_you_299026: "I'll wait until you reach level 240."
  npc_override_pub_cat_quests_dungeons_200_i_looking_someone_hunt_t_17ba9f: "I was looking for someone to hunt them, because I was not enough to catch and research monsters myself."
  npc_override_pub_cat_quests_dungeons_200_i_m_already_dead_bdb1ec: "I'm already dead"
  npc_override_pub_cat_quests_dungeons_200_i_m_already_dead_f7ed6b: "I'm already dead."
  npc_override_pub_cat_quests_dungeons_200_i_m_busy_today_f006f5: "I'm busy today"
  npc_override_pub_cat_quests_dungeons_200_i_m_comfortable_alone_2b8582: "I'm comfortable alone"
  npc_override_pub_cat_quests_dungeons_200_i_m_dead_so_i_7ac828: "I'm... dead, so I just want to sleep peacefully..."
  npc_override_pub_cat_quests_dungeons_200_i_m_going_die_because_5351a2: "I'm going to die because of the noise."
  npc_override_pub_cat_quests_dungeons_200_i_m_junkie_141985: "I'm not a junkie"
  npc_override_pub_cat_quests_dungeons_200_i_m_my_way_meet_838e3b: "I'm on my way to meet the Secret Wing researcher, so if you have any questions, you can ask him directly!"
  npc_override_pub_cat_quests_dungeons_200_i_m_my_way_see_f35af6: "I'm on my way to see him, so if you have any questions, you can ask him directly!"
  npc_override_pub_cat_quests_dungeons_200_i_m_ordinary_person_5afedf: "I'm not an ordinary person."
  npc_override_pub_cat_quests_dungeons_200_i_m_there_every_day_2991d4: "I'm in there every day, every day!!"
  npc_override_pub_cat_quests_dungeons_200_i_make_through_commotion_936665: "I have to make it through this commotion again tomorrow."
  npc_override_pub_cat_quests_dungeons_200_i_mean_there_kids_called_e3d9d4: "I mean, there are kids called ^0000FF{0}^000000. "
  npc_override_pub_cat_quests_dungeons_200_i_no_choice_hire_strong_e6c1a5: "I have no choice but to hire a strong and sincere adventurer. Hmm..."
  npc_override_pub_cat_quests_dungeons_200_i_only_slept_little_c4e0d4: "I only slept a little!"
  npc_override_pub_cat_quests_dungeons_200_i_participate_you_hero_65c426: "Can I participate with you hero?"
  npc_override_pub_cat_quests_dungeons_200_i_refuse_715cb0: "I refuse"
  npc_override_pub_cat_quests_dungeons_200_i_see_every_time_every_2c782d: "I see it every time, but every time it's amazing, how the chip works."
  npc_override_pub_cat_quests_dungeons_200_i_see_ha_am_6ca83c: "I see. Ha-am...."
