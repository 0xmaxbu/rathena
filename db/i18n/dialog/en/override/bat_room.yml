  npc_override_bat_room_bg_common_menu_the_d89943: "The following consumable items are available for exchange with the battlefield badges:"
  npc_override_bat_room_bg_common_menu_unfortunately_1bcc6d: "Unfortunately, there's something he and his followers are unaware of:"
  npc_override_bat_room_bg_common_menu_weapon_360266: "Weapon:Armor:Accessory:Consumable"
  npc_override_bat_room_bg_common_menu_what_756816: "What's the reason for the Battle?:Tell me about Prince Croix"
  npc_override_bat_room_bg_common_menu_what_9a4f17: "What's the reason for the Battle?:Tell me about General Guillaume"
  npc_override_bat_room_bg_common_menu_yes_141459: "Yes:No"
  npc_override_bat_room_bg_common_menu_yes_6a62b7: "Yes, I want to join you.:End Conversation"
  npc_override_bat_room_bg_common_menu_you_6286b9: "You can exchange the Medal of Honors with your Badges according to the job classes, as follows:"
  npc_override_bat_room_bg_common_now_go_upstairs_apply_ba_7a39f2: "Now, go upstairs and apply for battle from your comrades."
  npc_override_bat_room_bg_common_now_go_upstairs_apply_ba_ba8434: "Now, go upstairs and apply for battle with your comrades."
  npc_override_bat_room_bg_common_now_please_go_downstairs_ce04c2: "Now, please go downstairs and join your comrades in sharpening their skills to fight the enemy!"
  npc_override_bat_room_bg_common_oh_don_t_sad_36c9b5: "Oh, {0} Don't be sad."
  npc_override_bat_room_bg_common_our_great_king_marcel_ma_5fb622: "Our great king, Marcel Marollo VII, is very sick lately."
  npc_override_bat_room_bg_common_people_maroll_really_wan_b8708d: "Do the people of Maroll really want them to spend so much money on military power?"
  npc_override_bat_room_bg_common_please_note_items_braver_9a214d: "Please note that items for ^3131FFBravery Badges are indicated as (BB)^000000, and ^3131FFValor Badges as (VB)^000000."
  npc_override_bat_room_bg_common_please_try_again_cefdd7: "- Please try again -"
  npc_override_bat_room_bg_common_rd_prince_guillaume_grea_196d25: "The 3rd Prince Guillaume is the great general of Maroll."
  npc_override_bat_room_bg_common_remember_battleground_re_3b743a: "Remember, Battleground Reward Items are ^FF0000Character Bound^000000. Are you sure you want this item?"
  npc_override_bat_room_bg_common_reward_your_great_dedica_504653: "This is a reward for your great dedication by Guillaume Marollo!"
  npc_override_bat_room_bg_common_royal_gift_croix_please_8cba0c: "This is a Royal gift from Croix, and please don't forget this battle. We will win the next one."
  npc_override_bat_room_bg_common_s_waste_time_explain_you_747b6d: "It's a waste of time to explain to you how great a leader or warlord he is, since he commands the great military power of Maroll."
  npc_override_bat_room_bg_common_th_prince_croix_currentl_a9d717: "The 5th Prince Croix is currently titled as the Prime Minister of Maroll."
  npc_override_bat_room_bg_common_thank_you_exchanging_08526a: "Thank you for exchanging."
  npc_override_bat_room_bg_common_thank_you_so_much_i_ee979d: "Thank you so much. I feel like I can win with the help of adventurers like you."
  npc_override_bat_room_bg_common_too_many_items_you_fc968e: "- too many items with you. -"
  npc_override_bat_room_bg_common_two_kings_t_share_nation_99f356: "Two kings can't share a nation! Only the one victorious from His Majesty's appointed battle will be enthroned."
  npc_override_bat_room_bg_common_two_princes_kingdom_now_4988ea: "The two princes of the kingdom are now battling for the throne of Maroll, and are in need of experienced soldiers like you."
  npc_override_bat_room_bg_common_wait_minute_17efa5: "- Wait a minute !! -"
  npc_override_bat_room_bg_common_we_many_items_so_please_cf3fc0: "We have many items, so please take a look and purchase deliberately."
  npc_override_bat_room_bg_common_we_suffered_enough_wars_3e8bae: "We have suffered enough from wars."
  npc_override_bat_room_bg_common_welcome_my_army_comrade_94c0ed: "Welcome to my army, comrade."
  npc_override_bat_room_bg_common_which_badge_you_want_exc_273aa4: "Which Badge do you want to exchange?"
  npc_override_bat_room_bg_common_which_type_items_you_lik_9b9411: "Which type of items would you like to exchange?"
  npc_override_bat_room_bg_common_wise_adventurer_why_don_d687c8: "Wise adventurer, why don't you lend us your power for victory?"
  npc_override_bat_room_bg_common_you_battlefield_badges_cef6e8: "Do you have the battlefield badges?"
  npc_override_bat_room_bg_common_you_cancelled_exchange_5e53e3: "You cancelled the exchange."
  npc_override_bat_room_bg_common_you_chose_47e04c: "You chose ^3131FF{0}{1}^000000."
  npc_override_bat_room_bg_common_you_chose_968f15: "You chose ^3131FF{0}^000000."
  npc_override_bat_room_bg_common_you_chose_accessory_5f0014: "You chose ^3131FFAccessory^000000."
  npc_override_bat_room_bg_common_you_chose_armor_dfb901: "You chose ^3131FFArmor^000000."
  npc_override_bat_room_bg_common_you_chose_consumable_68f042: "You chose ^3131FFConsumable^000000."
  npc_override_bat_room_bg_common_you_chose_weapon_560ed9: "You chose ^3131FFWeapon^000000."
  npc_override_bat_room_bg_common_you_enough_s_ddea7c: "You do not have enough {0}s."
  npc_override_bat_room_bg_common_you_exchange_item_73b677: "You can exchange for this item with ^FF0000100 {0}^000000."
  npc_override_bat_room_bg_common_you_exchange_item_d6b2ff: "You can exchange for this item with ^FF0000{0} {1} or {2} {3}^000000."
  npc_override_bat_room_bg_common_you_like_exchange_41de54: "Would you like to exchange?"
  npc_override_bat_room_bg_common_you_like_spend_receive_b3c83d: "Would you like to spend ^FF0000100 {0}^000000 and receive a ^3131FF{1}{2}^000000?"
  npc_override_bat_room_bg_common_you_lost_you_re_dedicate_a06b07: "You lost, but you're dedicated to this battle."
  npc_override_bat_room_bg_common_you_need_badges_exchange_6f4787: "You need ^3131FF{0} Badges^000000 to exchange."
  npc_override_bat_room_bg_common_you_need_more_time_check_40ce1c: "Do you need more time to check the items?"
  npc_override_bat_room_bg_common_you_sent_back_b4d8b5: "You will be sent back to {0}."
  npc_override_bat_room_bg_common_you_wish_leave_battlefie_ddd8ef: "Do you wish to leave the battlefield? Use my services to return to town."
  npc_override_bat_room_bg_common_your_eyes_tell_me_you_2624f1: "Your eyes tell me that you're a soldier that I can trust."
  npc_override_bat_room_flavius_enter_after_you_lose_some_weig_0f3785: "- after you lose some weight. -"
  npc_override_bat_room_flavius_enter_crystals_both_armies_pro_f30fa3: "The crystals for both armies are protected by special barricades that cannot be destroyed by direct attacks."
  npc_override_bat_room_flavius_enter_crystals_immune_every_ty_1361d9: "The crystals are immune to every type of skill; your physical attacks are the only choice for destroying your enemy's crystal."
  npc_override_bat_room_flavius_enter_currently_you_re_carryin_73594b: "- Currently you're carrying -"
  npc_override_bat_room_flavius_enter_elite_corps_already_stan_fb8a8a: "An elite corps is already standing by to be dispatched to the battlefield."
  npc_override_bat_room_flavius_enter_go_show_croixs_what_fear_8f5352: "Go show the Croixs what fear truly means!"
  npc_override_bat_room_flavius_enter_go_show_guillaumes_what_bfc2c1: "Go show the Guillaumes what fear truly means!"
  npc_override_bat_room_flavius_enter_i_ve_received_report_inf_34065a: "I've received a report informing me that an elite corps has been dispatched to the battlefield fighting the Croixs already."
  npc_override_bat_room_flavius_enter_i_ve_received_report_inf_fbbd7a: "I've received a report informing me that an elite corps has been dispatched to the battlefield fighting the Guillaume already."
  npc_override_bat_room_flavius_enter_if_you_ready_start_click_732290: "If you are ready, start by clicking the ^0000FFbattle button from the interface^000000."
  npc_override_bat_room_flavius_enter_let_s_show_guillaumes_po_eaac80: "Let's show the Guillaumes the power of the Croix Army!"
  npc_override_bat_room_flavius_enter_let_s_show_power_croix_ed24d2: "Let's show the power of the Croix Army to those stinky Guillaumes!"
  npc_override_bat_room_flavius_enter_let_s_show_power_guillau_cbf6d8: "Let's show the power of the Guillaume Army to those stinky Croixs!"
  npc_override_bat_room_flavius_enter_menu_i_5365e7: "I want to join your army!:End Conversation"
  npc_override_bat_room_flavius_enter_menu_i_8f121e: "I'm very pleased that you want to join us and fight the Croix Army, but I'm sorry: I can't send a rookie like you to die on the cruel battlefield."
  npc_override_bat_room_flavius_enter_menu_i_f28e45: "I'm very pleased that you want to join us and fight the Guillaume Army, but I'm sorry: I can't send a rookie like you to die on the cruel battlefield."
  npc_override_bat_room_flavius_enter_menu_please_c78233: "Please remember: when you join a battle, you will be receiving a token which indicates the set duration for which you cannot participate in the same type of battle."
  npc_override_bat_room_flavius_enter_objective_flavius_battle_16626f: "The objective of the Flavius Battle is to score 2 points before your enemy by destroying their crystal."
  npc_override_bat_room_flavius_enter_please_bear_mind_once_yo_c69bc9: "Please bear in mind once you cancel, ^0000FFyou may not reapply for 1 minute^000000!"
  npc_override_bat_room_flavius_enter_please_try_again_cefdd7: "- Please try again -"
  npc_override_bat_room_flavius_enter_s_too_early_you_go_950e4e: "It's too early for you to go back. Go rest, and leave the enemies to us!"
  npc_override_bat_room_flavius_enter_they_removed_destroying_6f2d64: "But they can be removed by destroying the Guardians that protect the enemy army base."
  npc_override_bat_room_flavius_enter_today_our_cry_victory_sh_0df926: "Today, our cry of victory shall echo all over the battlefield!"
  npc_override_bat_room_flavius_enter_today_we_shall_victoriou_0ebcfd: "Today, we shall be victorious!"
  npc_override_bat_room_flavius_enter_too_many_items_you_fc968e: "- too many items with you. -"
  npc_override_bat_room_flavius_enter_wait_minute_17efa5: "- Wait a minute !! -"
  npc_override_bat_room_flavius_enter_why_don_t_you_go_d377b7: "Why don't you go wait for a while? I suggest you sharpen your weapons and prepare your supplies until then."
  npc_override_bat_room_flavius_enter_you_definitely_seem_read_724851: "You definitely seem to be ready for battle!"
  npc_override_bat_room_flavius_enter_you_may_check_duration_p_ea0274: "You may check the duration by pressing the Alt+U keys."
  npc_override_bat_room_flavius_enter_you_ready_battle_then_ap_c420cd: "Are you ready for battle? Then apply with the recruiter next to me!"
  npc_override_bat_room_flavius_enter_you_seem_just_returned_b_569649: "You seem to have just returned from the battlefield."
  npc_override_bat_room_kvm_enter_adventurer_you_aware_way_0fcef0: "Adventurer, are you aware that the way to the new world has been opened?"
  npc_override_bat_room_kvm_enter_applications_available_y_089fc5: "Applications are not available yet."
  npc_override_bat_room_kvm_enter_apply_clicking_battle_bu_daf4a2: "Apply by clicking on the ^0000FFbattle button from the interface^000000, as a group or individually."
  npc_override_bat_room_kvm_enter_apply_you_need_go_kvm_572a26: "To apply, you need to go to a KVM Mercenary Officer."
  npc_override_bat_room_kvm_enter_as_rewards_please_contac_54593b: "As for the rewards, please contact a KVM Logistic Officer."
  npc_override_bat_room_kvm_enter_basically_kvm_battle_1fdd41: "Basically, KVM is a 5 on 5 battle."
  npc_override_bat_room_kvm_enter_basically_kvm_battle_6ad660: "Basically, KVM is a 3 on 3 battle."
  npc_override_bat_room_kvm_enter_decided_employ_many_adve_5cc210: "have decided to employ many adventurers for the immediate advance to the new world."
  npc_override_bat_room_kvm_enter_first_you_apply_kvm_rece_a18489: "First, you apply with a KVM receptionist, in a group or individually."
  npc_override_bat_room_kvm_enter_group_applications_when_338015: "Group applications are for when you intend to enter the KVM with your party or guild members,"
  npc_override_bat_room_kvm_enter_group_applications_when_d00f4f: "Group applications are for when you intend to enter the KVM with your party members,"
  npc_override_bat_room_kvm_enter_hello_9b56d5: "Hello."
  npc_override_bat_room_kvm_enter_however_please_advised_u_9d6733: "However, please be advised that unless you are in the KVM office, he cannot contact you."
  npc_override_bat_room_kvm_enter_i_know_you_ve_already_cab8b2: "I know that you've already signed with the Croix. Go back and join their team. We will not accept traitors to fight for us."
  npc_override_bat_room_kvm_enter_i_know_you_ve_already_e9e7c0: "I know that you've already signed with the Guillaume. Go back and join their team. We will not accept traitors to fight for us."
  npc_override_bat_room_kvm_enter_if_you_ready_battle_clic_1239ab: "If you are ready for battle, click the ^0000FFbattle button from the interface^000000 to apply for KVM battle!"
  npc_override_bat_room_kvm_enter_kvm_abbreviation_kreiger_36a4f4: "KVM is the abbreviation of Kreiger Von Midgard."
  npc_override_bat_room_kvm_enter_kvm_one_them_c08e67: "And KVM is one of them."
  npc_override_bat_room_kvm_enter_let_them_know_real_might_b3f59e: "Let them know the real might of Guillaume!"
  npc_override_bat_room_kvm_enter_let_them_know_real_might_eb3878: "Let them know the real might of Croix!"
  npc_override_bat_room_kvm_enter_means_we_one_many_countr_8477ce: "It means that we, one of many countries in the Midgard continent,"
  npc_override_bat_room_kvm_enter_menu_apply_0bf1cc: "Apply for KVM.:What is KVM?:How do I participate in KVM?:I want to know my Kreiger Points."
  npc_override_bat_room_kvm_enter_menu_i_898a89: "I will fight with you.:End Conversation."
  npc_override_bat_room_kvm_enter_menu_your_fb6f87: "Your Kreiger Points are:"
  npc_override_bat_room_kvm_enter_msg_861fa1: "{0}."
  npc_override_bat_room_kvm_enter_personal_application_whe_7baedf: "and a personal application is for when you intend to enter the KVM individually."
