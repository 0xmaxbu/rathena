Body:
  npc_override_bat_room_bg_common_after_you_lose_some_weig_0f3785: "- after you lose some weight. -"
  npc_override_bat_room_bg_common_believes_peaceful_co_exi_173f49: "and believes in peaceful co-existence with other countries."
  npc_override_bat_room_bg_common_blessed_croix_e4a924: "Blessed Croix!"
  npc_override_bat_room_bg_common_blessed_guillaume_185487: "Blessed Guillaume!"
  npc_override_bat_room_bg_common_check_more_information_a_8cd67d: "To check more information about the reward items, please use our ^3131FFCatalog^000000."
  npc_override_bat_room_bg_common_command_been_cancelled_bb0d0b: "The command has been cancelled."
  npc_override_bat_room_bg_common_complete_1f5a1a: "Complete"
  npc_override_bat_room_bg_common_currently_you_re_carryin_73594b: "- Currently you're carrying -"
  npc_override_bat_room_bg_common_even_though_we_didn_t_1e84c1: "Even though we didn't win, we did our best."
  npc_override_bat_room_bg_common_following_armors_availab_cd8ff9: "The following armors are available for exchange with the battlefield badges."
  npc_override_bat_room_bg_common_following_items_availabl_3a2d2a: "The following items are available in the ^3131FFStaff / Mace / Two-Handed Axe / Huuma Shuriken^000000 category."
  npc_override_bat_room_bg_common_following_items_availabl_d1226a: "The following items are available in the ^3131FFDagger, One-Handed Sword, Two-Handed Sword, and Two-Handed Spear^000000 category."
  npc_override_bat_room_bg_common_following_weapons_availa_00bd1a: "The following weapons are available in the ^3131FFBook / Knuckle^000000 category."
  npc_override_bat_room_bg_common_following_weapons_availa_29e55f: "The following weapons are available in the ^3131FFBow / Katar / Musical Instrument / Whip^000000 category."
  npc_override_bat_room_bg_common_following_weapons_availa_64299e: "The following weapons are available for exchange with the battlefield badges."
  npc_override_bat_room_bg_common_following_weapons_availa_9a4ef6: "The following weapons are available in the ^3131FFRevolver / Rifle / Gatling Gun / Shotgun / Grenade Launcher^000000 category."
  npc_override_bat_room_bg_common_general_guillaume_may_ad_32736c: "General Guillaume may have an advantage in this battle as he is the great general of Maroll, but that doesn't automatically mean he'll win."
  npc_override_bat_room_bg_common_good_day_adventurer_756b47: "Good day, adventurer."
  npc_override_bat_room_bg_common_he_s_too_ignorant_admit_09ce20: "He's too ignorant to admit that so-called peace is built on countless lives that are sacrificed in wars while normal citizens and upper classes can live, oblivious to the horrors that allow them to live that way."
  npc_override_bat_room_bg_common_he_s_too_naive_understan_8c9dbe: "He's too naive to understand the reality...."
  npc_override_bat_room_bg_common_he_thinks_all_national_m_8a57d7: "He thinks all national matters of a nation can be discussed and determined on a desk,"
  npc_override_bat_room_bg_common_his_majesty_declared_he_5cff6a: "His Majesty has declared that he has chosen either me or Prince Croix as the next king amongst his 9 sons."
  npc_override_bat_room_bg_common_his_majesty_declared_he_86c73f: "His Majesty has declared that he will be leaving the future of Maroll to me or the 3rd prince, General Guillaume."
  npc_override_bat_room_bg_common_his_unrealistic_beliefs_19d3ca: "His unrealistic beliefs will drown this country in poverty and make the people weak. If he becomes the king, Maroll will never rest from the onslaughts of other countries."
  npc_override_bat_room_bg_common_hot_blooded_adventurer_w_978133: "Hot-blooded adventurer, we need your ability to win this battle."
  npc_override_bat_room_bg_common_how_you_like_lend_your_f852a5: "How would you like to lend your power to one of the princes in the Maroll Kingdom?"
  npc_override_bat_room_bg_common_however_just_battle_betw_97c102: "This is, however, not just a battle between us. This battle will determine the future of this country."
  npc_override_bat_room_bg_common_i_believe_weapons_aren_t_e93088: "I believe weapons aren't the best way to bring prosperity to a nation."
  npc_override_bat_room_bg_common_i_exchange_bravery_badge_b5010a: "I can exchange Bravery Badges and Valor Badges for reward items."
  npc_override_bat_room_bg_common_i_ll_always_stationed_he_7163c1: "I'll always be stationed here for more soldiers. Feel free to come back whenever you're interested."
  npc_override_bat_room_bg_common_i_ll_here_whenever_you_4367ea: "I'll be here whenever you're in need of my services."
  npc_override_bat_room_bg_common_i_ll_one_who_capture_456bf6: "I'll be the one who will capture the flag!"
  npc_override_bat_room_bg_common_i_m_knight_far_country_04702a: "I'm a knight from a far country called Maroll Kingdom."
  npc_override_bat_room_bg_common_i_m_sorry_you_don_9924a1: "I'm sorry, but you don't have enough badges to exchange."
  npc_override_bat_room_bg_common_i_m_sure_they_ll_8fc6e5: "I'm sure they'll welcome you whole-heartedly!"
  npc_override_bat_room_bg_common_i_pledge_my_honor_prove_5d672e: "I pledge on my honor to prove that I'm the one who can protect this Maroll from outside threats."
  npc_override_bat_room_bg_common_i_t_leave_maroll_someone_52e9af: "I can't leave Maroll to someone like him who lives in a dream!"
  npc_override_bat_room_bg_common_i_want_teach_him_what_0c0266: "I want to teach him what makes this small country so powerful and prosperous. It's military power!"
  npc_override_bat_room_bg_common_i_want_win_battle_so_18521f: "I want to win this battle so that I can bring prosperity to the people of Maroll. They've suffered enough from war..."
  npc_override_bat_room_bg_common_i_wish_shed_blood_i_080a3f: "I do not wish to shed blood, but I have no choice but to fight for the possibility of peace and for the sake of my people."
  npc_override_bat_room_bg_common_item_acolyte_class_only_e313b1: "This item is for Acolyte Class only."
  npc_override_bat_room_bg_common_item_archer_class_only_f63082: "This item is for Archer Class only."
  npc_override_bat_room_bg_common_item_gunslinger_only_70fc94: "This item is for Gunslinger only."
  npc_override_bat_room_bg_common_item_magician_class_only_98c163: "This item is for Magician Class only."
  npc_override_bat_room_bg_common_item_merchant_class_only_3b8b7d: "This item is for Merchant Class only."
  npc_override_bat_room_bg_common_item_swordman_taekwon_ma_f3bc5b: "This item is for Swordman and Taekwon Master Class only."
  npc_override_bat_room_bg_common_item_thief_class_only_646e04: "This item is for Thief Class only."
  npc_override_bat_room_bg_common_just_take_defeat_as_less_d631fe: "Just take this defeat as a lesson, and next time you will definitely win."
  npc_override_bat_room_bg_common_let_s_enjoy_our_glorious_6f60b2: "Let's enjoy our glorious victory!"
  npc_override_bat_room_bg_common_maroll_e80f2c: "For Maroll!"
  npc_override_bat_room_bg_common_maroll_s_great_king_marc_a53cba: "Maroll's great king, Marcel Marollo VII, is very sick lately."
  npc_override_bat_room_bg_common_may_i_help_you_5a540b: "May I help you?"
  npc_override_bat_room_bg_common_may_war_god_bless_you_1b5a7c: "May the war god bless you."
