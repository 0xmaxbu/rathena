Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_mora_enchan_mora_aaarrgghh_impossible_7adf6c: "Aaarrgghh, this is impossible!"
  npc_override_mora_enchan_mora_ability_enhance_remains_f3a226: "The ability to enhance remains."
  npc_override_mora_enchan_mora_adds_heal_bonus_bb7849: "Adds 20% Heal Bonus."
  npc_override_mora_enchan_mora_ah_one_more_thing_possib_361333: "Ah, one more thing! It is possible I can fail though and if that happens the relic is lost forever."
  npc_override_mora_enchan_mora_all_i_need_mora_coins_25addd: "All I need is 10 Mora Coins of yours to grant you a relic!"
  npc_override_mora_enchan_mora_another_thing_artifact_d_580cfe: "And another thing, the artifact will be destroyed if the reinforcement fails. Please keep that in mind."
  npc_override_mora_enchan_mora_another_thing_once_i_fai_77b775: "And another thing - once I fail to add art to it, it becomes unusable... you'll need to buy a new one in that case."
  npc_override_mora_enchan_mora_anything_else_4689b4: "Anything else?"
  npc_override_mora_enchan_mora_aqua_staff_795f6b: "- Aqua Staff -"
  npc_override_mora_enchan_mora_archbishop_only_ef1585: "Archbishop only"
  npc_override_mora_enchan_mora_artifact_been_strengthen_36e56e: "This artifact has been strengthened to the limit. Further enhancement is impossible at its current state."
  npc_override_mora_enchan_mora_as_you_wish_dafe43: "As you wish."
  npc_override_mora_enchan_mora_attempting_second_enhanc_2ef791: "Attempting second enhancement. The previous enforcement won't be affected."
  npc_override_mora_enchan_mora_attempting_strengthen_ab_495a78: "Attempting to strengthen the ability further. The previous enforcement won't be affected. Do you want to continue?"
  npc_override_mora_enchan_mora_based_what_class_you_spe_7105a0: "Based on what class you specify, there are various artifacts available."
  npc_override_mora_enchan_mora_best_part_my_service_any_8ddbf1: "The best part of my service is that any enhancements that you have in these artifacts will not be harmed."
  npc_override_mora_enchan_mora_bring_me_mora_coins_army_8409f2: "Bring me ^8888005 Mora Coins^000000 and an Army Padding, and we can add some art together!"
  npc_override_mora_enchan_mora_certainly_go_light_2c1786: "Certainly. Go with the Light."
  npc_override_mora_enchan_mora_choose_carefully_because_a7567a: "^ff0000Choose carefully because these artifacts aren't easy to come by^000000. So what class do you want it for?"
  npc_override_mora_enchan_mora_come_back_if_you_change_4b32ed: "Come back if you change your mind."
  npc_override_mora_enchan_mora_come_back_one_if_you_8b4140: "Come back for one if you change your mind."
  npc_override_mora_enchan_mora_come_back_when_you_re_c0f99a: "Come back when you're not in a hurry. I always have a lot of time on my hands."
  npc_override_mora_enchan_mora_course_i_ll_accept_your_fb4d16: "Of course I'll accept your help!  Find me..."
  npc_override_mora_enchan_mora_course_loki_s_scarf_qual_dbf640: "Of course, the Loki's Scarf is a quality item, so you won't lose the scarf itself in the process."
  npc_override_mora_enchan_mora_crimson_staff_e2a06a: "- Crimson Staff -"
  npc_override_mora_enchan_mora_did_you_change_something_4178bb: "Did you change something?"
  npc_override_mora_enchan_mora_didn_t_i_tell_you_76a1f6: "Didn't I tell you to bring the correct amount of Mora Coins?"
  npc_override_mora_enchan_mora_even_though_relic_alread_6733c4: "Even though this relic was already enchanted, we will re-enchant it without checking its status."
  npc_override_mora_enchan_mora_finding_perfect_artifact_f47be8: "Finding the perfect Artifact for me to experiment on is my life's work."
  npc_override_mora_enchan_mora_forest_staff_0b3ce3: "- Forest Staff -"
  npc_override_mora_enchan_mora_fortunately_s_still_its_f97c3d: "Fortunately, it's still in its original state before I started working on it. It's not torn or stretched. It's a quality item after all. Oh ho ho~"
  npc_override_mora_enchan_mora_go_ahead_ask_f152d5: "Go ahead and ask!"
  npc_override_mora_enchan_mora_go_light_4f797a: "Go with the light."
  npc_override_mora_enchan_mora_golden_rod_staff_39751c: "- Golden Rod Staff -"
  npc_override_mora_enchan_mora_greetings_adventurer_we_15d061: "Greetings Adventurer. We will be great friends in a moment after I tell you how to Empower your Artifacts!"
  npc_override_mora_enchan_mora_gulp_be125f: "Gulp... +9?!"
  npc_override_mora_enchan_mora_ha_5e4cb2: "Ha...!"
  npc_override_mora_enchan_mora_here_7f5577: "Here it is."
  npc_override_mora_enchan_mora_however_i_ll_embroider_v_8d9fa1: "However, I'll embroider it with velvet threads, and add three options to it."
  npc_override_mora_enchan_mora_humans_stock_2acd2c: "Humans... Stock?"
  npc_override_mora_enchan_mora_i_am_collector_trade_my_12db1a: "I am a collector, by trade, but my greatest achievement is empowering some artifacts with greater power!"
  npc_override_mora_enchan_mora_i_available_today_i_hope_a2905e: "I have ^aa00aa{0}^000000 available today. I hope {1} will come in handy..."
  npc_override_mora_enchan_mora_i_don_t_know_what_aee8ff: "I don't know what you are trying to do... I can't enhance what you don't have."
  npc_override_mora_enchan_mora_i_enhance_relics_holy_ar_1ae16e: "I enhance Relics that holy Arch-Bishops use, it will take 2 Mora Coins and the relic to allow me to attempt to enhance it."
  npc_override_mora_enchan_mora_i_give_rune_knights_guil_54ace0: "I give Rune Knights, Guillotine Crosses, and Rangers ancient artifacts to help them carry out their missions."
  npc_override_mora_enchan_mora_i_happen_few_army_paddin_a4011e: "I happen to have a few army paddings in stock. Would you like to buy one? The price is 1 Mora Coin. So cheap."
  npc_override_mora_enchan_mora_i_i_m_sorry_equipment_3eeadd: "I... I'm sorry but the equipment has been destroyed."
  npc_override_mora_enchan_mora_i_improve_its_high_quali_f66029: "I can improve its high quality with my own hands."
  npc_override_mora_enchan_mora_i_know_you_want_them_18214b: "But I know you want them to be even better!"
  npc_override_mora_enchan_mora_i_ll_randomly_give_you_0f7979: "I'll randomly give you one of 2 types of the equipment, depending upon the weather and my mood."
  npc_override_mora_enchan_mora_i_ll_work_item_whether_cca27f: "And, I'll work on the item whether it's been already reinforced or not."
  npc_override_mora_enchan_mora_i_m_bulberry_westhood_ke_bf0658: "I'm Bulberry Westhood, keeping the tradition of quality hoods alive."
  npc_override_mora_enchan_mora_i_m_giving_these_service_0b9aed: "I'm not giving these services out for free pal. 100,000 zeny and 1 Mora Coin. Is that too much to ask?"
  npc_override_mora_enchan_mora_i_m_going_continue_my_6df04e: "I'm going to continue my research for these artifacts. We researchers are taking Mora Coins as payment for our services..."
  npc_override_mora_enchan_mora_i_m_going_take_your_727fb3: "I'm going to take your ^FF0000{0}^000000 and exchange it, are you ready?"
  npc_override_mora_enchan_mora_i_m_going_work_unless_02b445: "I'm not going to do the work unless you pay the fee."
  npc_override_mora_enchan_mora_i_m_gonna_abused_again_aaa1e8: "I'm gonna be abused again..."
  npc_override_mora_enchan_mora_i_m_here_mora_studying_d75803: "I'm here in Mora studying ancient relics and artifacts. The new discoveries of Adventurers has made this village very exciting for me."
  npc_override_mora_enchan_mora_i_m_offering_my_services_1349c1: "I'm offering my services to give abilities to the artifacts for 100,000 zeny and 1 Mora Coin."
  npc_override_mora_enchan_mora_i_m_sure_if_c820c4: "I'm not sure if..."
  npc_override_mora_enchan_mora_i_m_telling_you_just_1e3efd: "I'm telling you just in case - I'll do whatever I need to do with your army padding, whether it's brand-new or has been mended before."
  npc_override_mora_enchan_mora_i_m_telling_you_just_84ee4b: "I'm telling you just in case - "
  npc_override_mora_enchan_mora_i_m_tingling_excitement_e69293: "I'm tingling with excitement!"
  npc_override_mora_enchan_mora_i_may_chance_fail_now_a6f0d3: "I may have a chance to fail now with this attempt. Do you wish to continue?"
  npc_override_mora_enchan_mora_i_must_insist_refine_lev_c44336: "I must insist that the refine level of the Artifact be at least +7!"
  npc_override_mora_enchan_mora_i_only_handle_quality_it_3229f9: "I only handle quality items - not random scarfs from a marketplace."
  npc_override_mora_enchan_mora_i_only_perfected_my_abil_135d78: "I have only perfected my ability on a few Artifact types so far."
  npc_override_mora_enchan_mora_i_really_want_study_equi_b323f8: "I really want to study this equipment..."
  npc_override_mora_enchan_mora_i_see_how_could_fun_6bbe6d: "I can see how that could be fun."
  npc_override_mora_enchan_mora_i_t_believe_i_messed_c505bd: "I can't believe I messed up."
  npc_override_mora_enchan_mora_i_think_even_trade_35849e: "I think that was an even trade."
  npc_override_mora_enchan_mora_i_think_there_enhancing_33ce9b: "I think there was an enhancing limit to the artifacts."
  npc_override_mora_enchan_mora_i_think_you_re_ready_0a154d: "I think that you're ready to receive the ancient artifacts."
  npc_override_mora_enchan_mora_i_ve_been_doing_over_b31ece: "I've been doing this for over 200 years, and honestly the readily available supply is gone, and Artificer and Artifact Crafter won't trade me anymore..."
  npc_override_mora_enchan_mora_i_ve_successfully_enhanc_c27c42: "I've successfully enhanced the artifact ^990000{0}^000000 at socket {1}."
  npc_override_mora_enchan_mora_i_want_alone_go_away_750598: "I want to be alone. Go away!"
  npc_override_mora_enchan_mora_if_either_specific_encha_607ccf: "If either the +7 or the specific enchantment is missing I can't do it."
  npc_override_mora_enchan_mora_if_i_work_guardian_s_bd3bc9: "If I work on a Guardian's Pendant that's been upgraded before, it loses its original power."
  npc_override_mora_enchan_mora_if_i_work_loki_s_b2e775: "If I work on a Loki's Scarf that's been upgraded before, it loses its original power."
  npc_override_mora_enchan_mora_if_worn_aqua_robe_shoes_14836c: "If worn with Aqua Robe, Shoes, and Orb Increase Water Magic damage by 60%."
  npc_override_mora_enchan_mora_if_worn_crimson_robe_sho_6b6398: "If worn with Crimson Robe, Shoes, and Orb Increase Fire Magic damage by 60%."
  npc_override_mora_enchan_mora_if_worn_forest_robe_shoe_a37823: "If worn with Forest Robe, Shoes, and Orb Increase Earth Magic damage by 60%."
  npc_override_mora_enchan_mora_if_worn_golden_robe_gold_f06428: "If worn with Golden Robe, Golden Shoes, and Golden Orb Increase Wind Magic damage by 60%."
  npc_override_mora_enchan_mora_if_worn_judgement_golves_231863: "If worn with Judgement Golves, Shoes and Shawl, increase Damage against Undead by 30%."
  npc_override_mora_enchan_mora_if_worn_robes_shoes_robe_23e9d6: "If worn with Robes, Shoes, and Robe of Mercy Increase Heal Bonus by an additional 45% and SP consumption of 'Heal' by 50."
  npc_override_mora_enchan_mora_if_you_anything_you_thin_b8362a: "If you have anything that you think is of high enough quality, come find me with ^ff00005 Mora Coins^000000."
  npc_override_mora_enchan_mora_if_you_change_your_mind_03764a: "If you change your mind, please stop by again."
  npc_override_mora_enchan_mora_if_you_change_your_mind_3f2210: "If you change your mind, please come back."
  npc_override_mora_enchan_mora_if_you_collect_more_mora_a4baa8: "If you collect 10 or more Mora coins, then I can trade them for the artifacts."
  npc_override_mora_enchan_mora_if_you_collect_more_than_0b1c91: "If you collect more than 10 coins then come to me to trade!"
  npc_override_mora_enchan_mora_if_you_come_across_any_14e6c8: "If you come across any of these artifacts, there are hidden powers that can be extracted from them."
  npc_override_mora_enchan_mora_if_you_re_interested_i_6be6a6: "If you're interested, I can work on your pendant for ^ff00005 Mora Coins^000000. Of course you need to have a Guardian's Pendant so I can work on with you."
  npc_override_mora_enchan_mora_if_you_ready_i_am_c48e97: "If you are ready I am about to show you what I can do with your +{0} Artifact!"
  npc_override_mora_enchan_mora_if_you_ritual_luck_you_dcf359: "If you have a ritual for luck, you should use it now!"
  npc_override_mora_enchan_mora_increase_cold_bolt_frost_bb5bea: "Increase Cold Bolt and Frost Diver damage by 30%."
  npc_override_mora_enchan_mora_increase_damage_adoramus_1873b7: "Increase damage of Adoramus by 200%, and increase SP cost of Adoramus by 30."
  npc_override_mora_enchan_mora_increase_earth_spike_hea_8abc2f: "Increase Earth Spike and Heaven's Drive damage by 30%."
  npc_override_mora_enchan_mora_increase_fire_bolt_fireb_c515c4: "Increase Fire Bolt and Fireball damage by 30%."
  npc_override_mora_enchan_mora_increase_jupitel_thunder_df3cd8: "Increase Jupitel Thunder damage by 30%."
  npc_override_mora_enchan_mora_int_matk_378b0c: "INT + 5, MATK + 270."
  npc_override_mora_enchan_mora_let_me_briefly_explain_m_813447: "Let me briefly explain, for 2 Mora Coins and the relic I can give you a single Enchantment on that relic."
  npc_override_mora_enchan_mora_let_me_explain_one_reinf_6c824c: "Let me explain. One reinforcement costs you two Coins."
  npc_override_mora_enchan_mora_let_me_take_look_what_d4167a: "Let me take a look at what you have brought me."
  npc_override_mora_enchan_mora_let_s_start_third_enhanc_f879c8: "Let's start the third enhancement. I can give the best stats at this stage but remember, ^990000there is now a chance for the artifact to be destroyed and previous enhancements will be erased^000000. Continue?"
  npc_override_mora_enchan_mora_light_you_look_like_you_10e551: "By the light! You look like you are ready to gain access to our relics."
  npc_override_mora_enchan_mora_like_i_said_i_only_f4e966: "Like I said, I only handle quality items - not random scarfs from a marketplace."
  npc_override_mora_enchan_mora_like_other_guardians_the_bd02d0: "Like the other Guardians, they may trade coins for their relics, so collect Mora Coins!"
  npc_override_mora_enchan_mora_loki_s_scarf_you_awesome_0cc7f3: "This Loki's Scarf you have is awesome. It's a limited edition product with Loki's crest on it!"
  npc_override_mora_enchan_mora_looks_like_i_did_3ddbf1: "Looks like I did it!"
  npc_override_mora_enchan_mora_looks_like_my_effort_suc_489f65: "Looks like my effort was successful."
  npc_override_mora_enchan_mora_looks_like_you_don_t_6bad29: "It looks like you don't have everything you need."
  npc_override_mora_enchan_mora_looks_like_you_don_t_eb6e5a: "It looks like you don't everything you need."
  npc_override_mora_enchan_mora_lower_earth_magic_damage_ccbe0e: "Lower Earth Magic damage by 60% and resistance to Earth by 50%."
  npc_override_mora_enchan_mora_lower_fire_magic_damage_79727f: "Lower Fire Magic damage by 60% and resistance to Fire by 50%."
  npc_override_mora_enchan_mora_lower_water_magic_damage_470d73: "Lower Water Magic damage by 60% and resistance to Water by 50%."
  npc_override_mora_enchan_mora_lower_wind_magic_damage_10f45c: "Lower Wind Magic damage by 60% and resistance to Wind by 50%."
  npc_override_mora_enchan_mora_mace_judgement_3af31f: "- Mace of Judgement -"
  npc_override_mora_enchan_mora_make_sure_you_re_wearing_281281: "Make sure you're wearing the equipment first."
  npc_override_mora_enchan_mora_matk_int_4eb96b: "MATK + 180, INT + 4."
  npc_override_mora_enchan_mora_matk_str_int_210cab: "MATK + 180, STR + 2, INT + 2."
  npc_override_mora_enchan_mora_maybe_humans_starting_vi_726dea: "But maybe the Humans that are starting to visit can bring in some new stock!"
  npc_override_mora_enchan_mora_menu_cancel_034f3e: "Cancel:Sapha Shoes (Shoes):Nab Shoes (Shoes):Sapha Hood (Garment):Nab Hood (Garment)"
  npc_override_mora_enchan_mora_menu_cancel_760934: "Cancel:White Wing Boots (Shoes):Black Wing Boots (Shoes):White Wing Manteau (Garment):Black Wing Manteau (Garment)"
  npc_override_mora_enchan_mora_menu_cancel_876e66: "Cancel:Ur's Greaves (Shoes):Peuz's Greaves (Shoes):Ur's Manteau (Garment):Peuz's Manteau (Garment)"
  npc_override_mora_enchan_mora_menu_cancel_e91265: "Cancel:Rune Knight:Guillotine Cross:Ranger"
  npc_override_mora_enchan_mora_menu_come_129afd: "Come on, what's the rush?:Okay! Let's do it!!"
  npc_override_mora_enchan_mora_menu_i_04b968: "I'm not ready:Exchange my {0}"
  npc_override_mora_enchan_mora_menu_i_05d582: "I'll come back later.:Please continue!"
  npc_override_mora_enchan_mora_menu_i_16fb11: "I don't get it.:Yes, please."
  npc_override_mora_enchan_mora_menu_i_2a0241: "I don't think I'm interested:Staff of Mercy:Mace of Judgement:Golden Rod Staff:Aqua Staff:Crimson Staff:Forest Staff"
  npc_override_mora_enchan_mora_menu_i_6e6382: "I don't think I'm ready.:I'm ready to exchange my Mora Coins.:Exchange my Ring."
  npc_override_mora_enchan_mora_menu_i_75eb24: "I'm not ready.:Ring:Shoes:Shawl:Robe:Shield:Weapon"
  npc_override_mora_enchan_mora_menu_i_c36a7c: "I'm not wearing the equipment:1. Weapon:2. Shoes:3. Garment:4. Armor:5. Accessory"
  npc_override_mora_enchan_mora_menu_it_755192: "It must also carry any of these enchantments: {0} to be craftable by me."
  npc_override_mora_enchan_mora_menu_let_59281e: "Let's do this!:Empower Artifacts?:Nope, not for me!"
  npc_override_mora_enchan_mora_menu_mace_32618b: "Mace / Attack : 170"
  npc_override_mora_enchan_mora_menu_maybe_0f54d8: "Maybe later, sir...:I'd like to own a quality item!"
  npc_override_mora_enchan_mora_menu_maybe_3ce375: "Maybe next time.:I'll buy one now."
  npc_override_mora_enchan_mora_menu_maybe_6e65b6: "Maybe later... I have things to do.:Yes, I do."
  npc_override_mora_enchan_mora_menu_maybe_7124a9: "Maybe next time.:Golden Rod Staff:Aqua Staff:Crimson Staff:Forest Staff:Golden Rod Shoes:Aqua Shoes:Crimson Shoes:Forest Shoes:Golden Rod Orb:Aqua Orb:Crimson Orb:Forest Orb:Golden Rod Robe:Aqua Robe:Crimson Robe:Forest Robe"
  npc_override_mora_enchan_mora_menu_more_80462a: "More details please.:Please Enhance my Relic."
  npc_override_mora_enchan_mora_menu_no_2f85c6: "No, I don't.:Yes, do it!"
  npc_override_mora_enchan_mora_menu_nooo_400557: "NOOO!:Yes, I'm ready!:What will it be after?"
  npc_override_mora_enchan_mora_menu_one_50fad3: "One handed Staff / Attack : 30"
  npc_override_mora_enchan_mora_menu_please_60ef08: "Please tell me more.:Yes, I have."
  npc_override_mora_enchan_mora_menu_quit_387bcf: "Quit:Shoes:Orbs:Robes:Staves"
  npc_override_mora_enchan_mora_menu_staff_2a4714: "Staff / Attack : 30"
  npc_override_mora_enchan_mora_menu_staff_c70fff: "Staff / Attack: 30"
  npc_override_mora_enchan_mora_menu_tell_8fd2c5: "Tell me more...:Give abilities to artifacts.:Reset Enhanced abilities."
  npc_override_mora_enchan_mora_menu_tell_b57467: "Tell me more.:I want to have my item reinforced."
  npc_override_mora_enchan_mora_menu_wait_a4263d: "Wait a minute!:Light of Cure:Seal of Cathedral:Ring of Archbishop:Shoes of Affection:Shoes of Judgement:Shawl of Affection:Shawl of Judgement:Robe of Affection:Robe of Judgement:Bible of Promise 1st Vol:Wand of Affection:Mace of Judgement"
  npc_override_mora_enchan_mora_menu_weapon_347f2c: "Weapon Level : 4 / ^ff0000Required Level: 130^000000"
  npc_override_mora_enchan_mora_menu_weapon_74e06a: "Weapon Level : 4 / ^ff0000Required Level : 130^000000"
  npc_override_mora_enchan_mora_menu_weight_184e79: "Weight : 90 / Any Sex"
  npc_override_mora_enchan_mora_menu_weight_36771e: "Weight : 120 / Any Sex"
  npc_override_mora_enchan_mora_menu_weight_87bc5b: "Weight : 50 / Any Sex"
  npc_override_mora_enchan_mora_menu_you_39c6f1: "You can choose from four types of items:"
  npc_override_mora_enchan_mora_mm_hmm_something_wrong_5feb8f: "Mm-hmm something is wrong."
  npc_override_mora_enchan_mora_mora_coins_c982ca: "5 Mora Coins."
  npc_override_mora_enchan_mora_mora_coins_i_strengthen_ee7859: "For 2 Mora Coins I can strengthen the relic you have in many ways!"
  npc_override_mora_enchan_mora_msg_fca926: "^990099{0}^000000??"
  npc_override_mora_enchan_mora_my_art_looks_great_718659: "My art looks great."
  npc_override_mora_enchan_mora_my_business_collecting_o_5ec9bc: "My business is collecting the old relics and refining them to their essence!"
  npc_override_mora_enchan_mora_my_job_guard_warlock_s_e081ea: "My job is to guard the Warlock's ancient artifacts."
  npc_override_mora_enchan_mora_my_job_imbue_artifacts_n_9c7a44: "My job is to imbue artifacts with new power. If you have enough Coins, you can have one of the following items reinforced."
  npc_override_mora_enchan_mora_my_job_polish_stone_guar_495104: "My job is to polish the stone in a Guardian's Pendant, and then carve a symbol with special power on it."
  npc_override_mora_enchan_mora_my_my_loki_s_scarf_e9fe82: "My! My Loki's Scarf!...."
  npc_override_mora_enchan_mora_my_specialty_bringing_ou_5b47da: "My specialty is bringing out the hidden power at the small cost of... "
  npc_override_mora_enchan_mora_my_touch_i_turn_typical_6b9937: "With my touch, I can turn a typical army padding into a piece of art. I'm Kay the Master Tailor, creating art with army paddings."
