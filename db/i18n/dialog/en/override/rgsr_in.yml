Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_rgsr_in_rgsr_in_ah_we_ve_come_far_a56def: "Ah, we've come this far, but our team's research is still lacking in experiments."
  npc_override_rgsr_in_rgsr_in_all_around_world_researc_135d16: "All around the world research is being conducted at the Regenschirm Institute to modify weapons, armor, accessories and other equipment items..."
  npc_override_rgsr_in_rgsr_in_already_going_047164: "Already going?"
  npc_override_rgsr_in_rgsr_in_armor_intermediate_mods_1737cc: "Armor Intermediate Mods? Okay."
  npc_override_rgsr_in_rgsr_in_armor_lower_mods_okay_7bee86: "Armor Lower Mods? Okay."
  npc_override_rgsr_in_rgsr_in_armor_upper_mods_okay_28f8a7: "Armor Upper Mods? Okay."
  npc_override_rgsr_in_rgsr_in_as_soon_as_data_collecte_9d565d: "It is... As soon as the data is collected, it will be somehow."
  npc_override_rgsr_in_rgsr_in_as_we_see_our_research_0e602a: "As we see in our research, the materials are very rare. There are adventurers hired by our team, but the material is not comparable to the amount we need."
  npc_override_rgsr_in_rgsr_in_buy_additional_ore_532d71: "Buy additional ore"
  npc_override_rgsr_in_rgsr_in_cancel_77dfd2: "Cancel"
  npc_override_rgsr_in_rgsr_in_come_1d1797: "Come on."
  npc_override_rgsr_in_rgsr_in_come_b49449: "...Come on."
  npc_override_rgsr_in_rgsr_in_come_back_whenever_you_n_e82239: "Come back whenever you need it."
  npc_override_rgsr_in_rgsr_in_convert_3f15ce: "Convert"
  npc_override_rgsr_in_rgsr_in_did_you_bring_stuff_065fef: "Did you bring the stuff?"
  npc_override_rgsr_in_rgsr_in_don_t_enough_ore_then_0774aa: "Don't have enough ore? Then there's something I'm specifically collecting..."
  npc_override_rgsr_in_rgsr_in_don_t_you_want_try_a50514: "Don't you want to try a new modification than just any other normal method?"
  npc_override_rgsr_in_rgsr_in_essential_cut_refine_equ_12a301: "It is essential to cut the refine of the equipment to be converted, but it is a labor for greater power."
  npc_override_rgsr_in_rgsr_in_everyone_likes_quiet_so_0b36d2: "Everyone likes it quiet, so don't talk too loud."
  npc_override_rgsr_in_rgsr_in_finally_i_talked_adventu_4b89a2: "Finally, I talked to an adventurer and asked him to confirm my research, was that you?"
  npc_override_rgsr_in_rgsr_in_gemstone_refining_0c1831: "Gemstone refining."
  npc_override_rgsr_in_rgsr_in_gemstone_refining_6f54df: "Gemstone refining"
  npc_override_rgsr_in_rgsr_in_good_other_facilities_in_3487bc: "Good! Other facilities in the institute are confidential and are not accessible, so we will guide you on a special path where you outsiders can enter!"
  npc_override_rgsr_in_rgsr_in_grimace_5d3864: "Grimace."
  npc_override_rgsr_in_rgsr_in_hello_adventurer_4280fa: "Hello, adventurer!"
  npc_override_rgsr_in_rgsr_in_huh_you_anyone_else_see_474d7c: "Huh? Do you have anyone else to see on our team other than the team leader?"
  npc_override_rgsr_in_rgsr_in_i_am_charge_enchants_318b8c: "I am in charge of Enchants."
  npc_override_rgsr_in_rgsr_in_i_like_people_who_sure_c29731: "I like people who are sure what they want."
  npc_override_rgsr_in_rgsr_in_i_ll_improve_bit_next_59bd85: "I'll improve it a bit next time and get the captain's permission, then let's proceed."
  npc_override_rgsr_in_rgsr_in_i_ll_see_you_next_e4eacb: "I'll see you next time I get permission from the captain."
  npc_override_rgsr_in_rgsr_in_i_try_answer_any_questio_c04fb2: "I will try to answer any questions you have."
  npc_override_rgsr_in_rgsr_in_if_you_need_anything_com_b017fc: "If you need anything, come again."
  npc_override_rgsr_in_rgsr_in_if_you_need_mods_come_887639: "If you need mods, come back."
  npc_override_rgsr_in_rgsr_in_if_you_re_interested_che_f51026: "If you're interested, check out what research was done."
  npc_override_rgsr_in_rgsr_in_if_you_re_interested_lat_46e8c8: "If you're interested later, come back!"
  npc_override_rgsr_in_rgsr_in_if_you_want_modify_somet_b4df76: "If you want to modify something you only need to bring the presented materials."
  npc_override_rgsr_in_rgsr_in_intermediate_mods_98401c: "Intermediate mods"
  npc_override_rgsr_in_rgsr_in_join_regenschirm_institu_c84819: "Join the Regenschirm Institute!"
  npc_override_rgsr_in_rgsr_in_let_me_guide_you_way_4e5883: "Let me guide you on the way back."
  npc_override_rgsr_in_rgsr_in_let_s_go_d7f55d: "Let's go."
  npc_override_rgsr_in_rgsr_in_let_s_see_4d37ed: "Let's see..."
  npc_override_rgsr_in_rgsr_in_let_s_see_what_you_43089f: "Let's see what you brought."
  npc_override_rgsr_in_rgsr_in_let_s_see_what_you_be4a54: "Let's see what you got?"
  npc_override_rgsr_in_rgsr_in_let_s_see_you_re_2e8927: "Let's see... You're a guest."
  npc_override_rgsr_in_rgsr_in_listen_explanation_b7f959: "Listen to the explanation."
  npc_override_rgsr_in_rgsr_in_lower_mods_656e18: "Lower mods"
  npc_override_rgsr_in_rgsr_in_luckily_we_research_adve_1c4614: "Luckily, we do the research and adventurers who come to us provide materials to use our technology."
  npc_override_rgsr_in_rgsr_in_menu_assistant_139c97: "Assistant: ....I'm."
  npc_override_rgsr_in_rgsr_in_menu_assistant_207777: "Assistant: ...Oh.............."
  npc_override_rgsr_in_rgsr_in_menu_assistant_23a057: "Assistant: No, not that.... That's it. That's it..."
  npc_override_rgsr_in_rgsr_in_menu_assistant_27943b: "Assistant: Our leader is a great guy. I'm still young..."
  npc_override_rgsr_in_rgsr_in_menu_assistant_30ddd4: "Assistant: Isn't it a little noisy outside?"
  npc_override_rgsr_in_rgsr_in_menu_assistant_44e2d5: "Assistant: ...Paycheck... Give it to me...? Then ask unnecessary questions..."
  npc_override_rgsr_in_rgsr_in_menu_assistant_4bb25b: "Assistant: ....Hang."
  npc_override_rgsr_in_rgsr_in_menu_assistant_4d8aa3: "Assistant: Can we move to a larger lab one day after we do more research?"
  npc_override_rgsr_in_rgsr_in_menu_assistant_6c5fcd: "Assistant: Don't worry, it's nothing..."
  npc_override_rgsr_in_rgsr_in_menu_assistant_71b6b5: "Assistant: Hey, this data was really cool. I was wise to follow you."
  npc_override_rgsr_in_rgsr_in_menu_assistant_73b3db: "Assistant: Quiet... I'm..."
  npc_override_rgsr_in_rgsr_in_menu_assistant_88be4c: "Assistant: I wish I could move to a good soundproofed place."
  npc_override_rgsr_in_rgsr_in_menu_assistant_94feca: "Assistant: Don't touch it... It's dangerous..."
  npc_override_rgsr_in_rgsr_in_menu_assistant_af72ba: "Assistant: Hick... It was almost a big day... You didn't see him, did you?"
  npc_override_rgsr_in_rgsr_in_menu_assistant_cb776a: "Assistant: Ask our lead about any questions you have."
  npc_override_rgsr_in_rgsr_in_menu_assistant_cca6ae: "Assistant: Of course..."
  npc_override_rgsr_in_rgsr_in_menu_assistant_f0c31d: "Assistant: Adventurer, please walk carefully. The building is old and the floor is a little creaky."
  npc_override_rgsr_in_rgsr_in_menu_grid_90251e: "Grid: ?"
  npc_override_rgsr_in_rgsr_in_modifiable_items_also_re_a4210c: "Modifiable items can also be read as <TIPBOX>[List]<INFO>9163</INFO></TIPBOX>."
  npc_override_rgsr_in_rgsr_in_modifiable_items_located_4b3e46: "Modifiable items are located in <TIPBOX>[List]<INFO>9166</INFO></TIPBOX>."
  npc_override_rgsr_in_rgsr_in_modification_equipment_m_0e0800: "And for modification, the equipment must have a refine level of +9 or higher."
  npc_override_rgsr_in_rgsr_in_modification_refine_leve_3c3f9b: "For modification, the refine level must be +7 or higher."
  npc_override_rgsr_in_rgsr_in_modified_os_weapon_encha_60fc17: "Modified OS Weapon Enchant"
  npc_override_rgsr_in_rgsr_in_mods_weapon_needs_refine_9026bb: "And for mods, the weapon needs to be refine level +9 or higher."
  npc_override_rgsr_in_rgsr_in_my_assistants_i_refine_g_b6aa92: "My assistants and I refine the gemstones used in this lab. For a fee."
  npc_override_rgsr_in_rgsr_in_non_refineable_armor_onl_9e719f: "Non-refineable armor is only capable of Upper modification."
  npc_override_rgsr_in_rgsr_in_non_refineable_equipment_2078a6: "^FF0000Non-refineable equipment^000000 can also be granted with advanced modifications, but the refine level does not increase."
  npc_override_rgsr_in_rgsr_in_non_standard_armor_efe35c: "Non-standard armor"
  npc_override_rgsr_in_rgsr_in_non_standard_armor_there_1b3f48: "^0000FFNon-standard armor^000000, there are Lower, Intermediate, and Upper levels of the modification method."
  npc_override_rgsr_in_rgsr_in_non_standard_weapon_9d312e: "Non-standard weapon"
  npc_override_rgsr_in_rgsr_in_non_standard_weapon_ther_a9da0c: "^0000FFNon-standard weapon^000000, there are Lower, Intermediate, and Upper levels of the modification method."
  npc_override_rgsr_in_rgsr_in_now_there_these_things_5c2f38: "Now there are these things."
  npc_override_rgsr_in_rgsr_in_okay_176ce9: "Okay?"
  npc_override_rgsr_in_rgsr_in_os_weapons_11fa60: "OS Weapons"
  npc_override_rgsr_in_rgsr_in_os_weapons_3c1f27: "^0000FFOS Weapons^000000..."
  npc_override_rgsr_in_rgsr_in_please_tell_us_any_time_814109: "Please tell us at any time when you are finished."
  npc_override_rgsr_in_rgsr_in_quit_1a2285: "Quit"
  npc_override_rgsr_in_rgsr_in_quit_fb25bb: "Quit."
  npc_override_rgsr_in_rgsr_in_refine_level_decrease_f1d91c: "Refine level does not decrease."
  npc_override_rgsr_in_rgsr_in_refine_level_increases_c_d2ce20: "^FF0000Refine level increases by 1^000000, but consumes more material."
  npc_override_rgsr_in_rgsr_in_refine_level_reduced_con_2beb8e: "^FF0000Refine level is reduced by 5^000000, but consumes less material."
  npc_override_rgsr_in_rgsr_in_refine_level_reduced_con_5064cd: "^FF0000Refine level is reduced by 5^000000, but consumes less materials."
  npc_override_rgsr_in_rgsr_in_refine_level_reduced_con_d2b04c: "^FF0000Refine level is reduced by 1^000000, but consumes more material."
  npc_override_rgsr_in_rgsr_in_research_ongoing_so_know_1c4625: "Research is ongoing, so it is not known when and where something will suddenly be completed and offered to adventurers."
  npc_override_rgsr_in_rgsr_in_research_ongoing_so_plea_aea503: "Research is ongoing, so please look forward to the addition of multiple new equipment as soon as it is completed!"
  npc_override_rgsr_in_rgsr_in_return_b7c4b3: "Return."
  npc_override_rgsr_in_rgsr_in_return_item_mall_57b52d: "^FF0000Return to Item Mall^000000?"
  npc_override_rgsr_in_rgsr_in_return_lighthalzen_5b8c21: "^FF0000Return to Lighthalzen^000000?"
  npc_override_rgsr_in_rgsr_in_s_low_budget_lab_so_8f6340: "It's a low-budget lab, so it's always like this."
  npc_override_rgsr_in_rgsr_in_s_still_incomplete_c1b1c0: "It's still incomplete."
  npc_override_rgsr_in_rgsr_in_see_team_licht_s_perform_6781bf: "See Team Licht's performance?"
  npc_override_rgsr_in_rgsr_in_so_when_adventurers_came_faa461: "So when the adventurers came with the materials, they decided to provide the corresponding research value."
  npc_override_rgsr_in_rgsr_in_thanos_weapon_intermedia_4306ae: "Thanos Weapon intermediate modification."
  npc_override_rgsr_in_rgsr_in_thanos_weapon_lower_modi_8e279a: "Thanos weapon lower modification."
  npc_override_rgsr_in_rgsr_in_thanos_weapon_mods_lower_07a471: "^0000FFThanos weapon^000000 mods have lower and intermediate levels in the modification method."
  npc_override_rgsr_in_rgsr_in_thanos_weapons_45b3fd: "Thanos Weapons"
  npc_override_rgsr_in_rgsr_in_then_s_me_4c0d3f: "Then that's me~"
  npc_override_rgsr_in_rgsr_in_time_team_licht_achieved_3523d5: "And this time, Team Licht achieved it."
  npc_override_rgsr_in_rgsr_in_top_ore_exchange_901988: "Top ore exchange."
  npc_override_rgsr_in_rgsr_in_top_ore_exchange_d4f5cb: "Top ore exchange"
  npc_override_rgsr_in_rgsr_in_unfortunately_our_team_h_eb6c4d: "Unfortunately, our team hasn't done enough to get out there yet."
  npc_override_rgsr_in_rgsr_in_upper_mods_a079e5: "Upper mods"
  npc_override_rgsr_in_rgsr_in_view_exchange_list_6d4e42: "View the exchange list"
  npc_override_rgsr_in_rgsr_in_we_need_research_a888d4: "And we need the research."
  npc_override_rgsr_in_rgsr_in_we_re_proud_lab_3f3ac2: "We're proud of this lab."
  npc_override_rgsr_in_rgsr_in_we_re_still_collecting_d_dfc42b: "We're still collecting data and researching modifications, so we need a lot of adventurer's equipment to increase our modification research."
  npc_override_rgsr_in_rgsr_in_weapon_advanced_mods_oka_aeb355: "Weapon Advanced Mods? Okay."
  npc_override_rgsr_in_rgsr_in_weapon_intermediate_mods_a9d170: "Weapon Intermediate Mods? Okay."
  npc_override_rgsr_in_rgsr_in_weapon_lower_mods_okay_e7f436: "Weapon Lower Mods? Okay."
  npc_override_rgsr_in_rgsr_in_what_you_exchanging_0d36f5: "What are you exchanging?"
  npc_override_rgsr_in_rgsr_in_where_3e2e0e: "Where..."
  npc_override_rgsr_in_rgsr_in_which_one_you_want_modif_6a0cc7: "Which one do you want to modify?"
  npc_override_rgsr_in_rgsr_in_work_remaining_325d19: "Work remaining."
  npc_override_rgsr_in_rgsr_in_you_done_199842: "Are you done?"
  npc_override_rgsr_in_rgsr_in_you_may_heard_explanatio_b4323b: "You may have heard the explanation when you came, but to briefly introduce you to this place, there is still a long way to go. We are working on converting many weapons, armor, accessories, etc. into something different."
  npc_override_rgsr_in_rgsr_in_you_need_see_more_our_8a9f6c: "You need to see more of our outstanding performance!"
  npc_override_rgsr_in_rgsr_in_you_re_adventurer_so_you_a521f4: "You're an adventurer, so you know what that means?"
  npc_override_rgsr_in_rgsr_in_you_shadow_decon_b58451: "Do you have a shadow decon?"
  npc_override_rgsr_in_rgsr_in_you_unhappy_your_equipme_840f13: "Are you unhappy with your equipment now?"
  npc_override_rgsr_in_rgsr_in_you_welcome_any_time_you_975921: "You are welcome any time you help us with our research."
