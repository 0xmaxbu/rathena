  npc_override_rebel_in_quests_16_2_we_installed_device_we_b_15f6fa: "And we installed the device we brought.."
  npc_override_rebel_in_quests_16_2_we_just_kill_0ff39e: "We just have to kill it!"
  npc_override_rebel_in_quests_16_2_we_keep_your_lady_while_2ad687: "We will keep your Lady for a while. You reflect on yourself in the training room for some time!"
  npc_override_rebel_in_quests_16_2_we_know_lot_about_facili_875d35: "We know a lot about this facility."
  npc_override_rebel_in_quests_16_2_we_like_hunt_pet_child_e0d5b0: "We would like to hunt the ^4d4dffpet child^000000 guy. Will you join us?"
  npc_override_rebel_in_quests_16_2_we_like_your_courage_so_317893: "But we like your courage. So we will listen to you first."
  npc_override_rebel_in_quests_16_2_we_liked_our_unit_comman_5a83c8: "But we liked our unit and commander Ericsson..."
