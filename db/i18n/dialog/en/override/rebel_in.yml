  npc_override_rebel_in_quests_16_2_thanks_your_support_we_k_aca032: "Thanks to your support, we kept the tradition of our royal family. And we avoided the dirty tricks of malicious people."
  npc_override_rebel_in_quests_16_2_thanks_your_support_we_m_d2b192: "Thanks to your support, we managed to get a good rest."
  npc_override_rebel_in_quests_16_2_thanks_your_support_we_p_9763bc: "Thanks to your support, we can pause for breath!"
  npc_override_rebel_in_quests_16_2_then_857efa: "Then?"
  npc_override_rebel_in_quests_16_2_then_could_you_please_fi_1ce34b: "Then could you please find the dregs hiding deep inside the laboratory and shaking like leaves?"
  npc_override_rebel_in_quests_16_2_then_get_some_rest_come_10aa69: "Then get some rest and come back please."
  npc_override_rebel_in_quests_16_2_then_happened_we_so_mise_1aeb6d: "Then it happened... and we... were so miserable."
  npc_override_rebel_in_quests_16_2_then_i_get_ready_receive_868539: "Then I will get ready to receive customers again!"
  npc_override_rebel_in_quests_16_2_then_i_go_prepare_repair_585bbe: "Then I will go and prepare for repairing! I will count on you again!"
  npc_override_rebel_in_quests_16_2_then_i_go_yuno_now_be2398: "Then I will go to Yuno now."
  npc_override_rebel_in_quests_16_2_then_i_got_out_shape_935505: "And then... I got out of shape..."
  npc_override_rebel_in_quests_16_2_then_i_let_you_young_c509e5: "Then I will let you young people enjoy the conversation."
  npc_override_rebel_in_quests_16_2_then_i_ll_fix_party_aedecd: "Then I'll fix the party accessories in advance."
  npc_override_rebel_in_quests_16_2_then_i_met_gonie_came_c4b548: "Then I met Gonie and came here. But I found that there's nothing I could do here as well."
  npc_override_rebel_in_quests_16_2_then_i_no_choice_eat_c6a2ae: "Then I have no choice but to eat them. Give them to me."
  npc_override_rebel_in_quests_16_2_then_i_no_choice_taste_859691: "Then, I have no choice but to taste it. Give it to me."
  npc_override_rebel_in_quests_16_2_then_i_t_tell_you_c9871a: "... Then I can't tell you."
  npc_override_rebel_in_quests_16_2_then_let_me_go_too_cc9ab2: "Then let me go too."
  npc_override_rebel_in_quests_16_2_then_let_us_go_lighthalz_7fd4be: "Then let us go to ^4d4dffLighthalzen^000000."
  npc_override_rebel_in_quests_16_2_then_person_behind_him_m_9aaf10: "Then the person behind him may be in a high position or have authority. Or he/she might be rich."
  npc_override_rebel_in_quests_16_2_then_please_kill_each_4eb238: "Then, please kill 10 of each"
  npc_override_rebel_in_quests_16_2_then_rest_here_all_surpl_c5f443: "Then the rest here are all surplus manpower?"
  npc_override_rebel_in_quests_16_2_then_s_mercenary_ring_ty_74dbf0: "Then it's Mercenary Ring type A and B. I take five tokens for upgrading a slot. The maximum slots for the upgrade are two. And I will take 10 tokens for initialization."
  npc_override_rebel_in_quests_16_2_then_store_outside_door_988b76: "Then the store outside the door was a ^0000cdtrickery^000000. The collapsed man is a member of ^0000cdRebellion^000000... That's why..."
  npc_override_rebel_in_quests_16_2_then_tell_them_come_out_d4e14d: "Then tell them to come out! Come out now! Come out! Come out!"
  npc_override_rebel_in_quests_16_2_then_there_one_thing_we_ea3323: "Then there is one thing we have to do."
  npc_override_rebel_in_quests_16_2_then_we_began_believe_we_75c710: "Then we began to believe that we were the worst and hopeless kids..."
  npc_override_rebel_in_quests_16_2_then_we_cannot_afford_ac209f: "Then we cannot afford it."
  npc_override_rebel_in_quests_16_2_then_we_get_going_cefff0: "Then we will get going."
  npc_override_rebel_in_quests_16_2_then_we_get_ready_invest_b195a2: "Then we will get ready for the investigation, right?"
  npc_override_rebel_in_quests_16_2_then_we_must_go_back_3124b7: "Then we must go back quickly."
  npc_override_rebel_in_quests_16_2_then_we_want_disable_ent_b4467c: "Then we want to disable the Enterprisebeyond repair."
  npc_override_rebel_in_quests_16_2_then_who_s_going_repair_9b000d: "Then who's going to repair it? There's nobody here."
  npc_override_rebel_in_quests_16_2_then_who_should_we_ask_ddcd99: "Then who should we ask to do it?"
  npc_override_rebel_in_quests_16_2_then_why_you_go_through_9f7a30: "Then why do you have to go through a place like this?"
  npc_override_rebel_in_quests_16_2_then_you_borrow_name_ner_38cb6e: "Then you will borrow the name of the Nerius family."
  npc_override_rebel_in_quests_16_2_then_you_please_look_tas_194485: "Then would you please have a look at the tasks given by Dien, Ridsh and Cotnes?"
  npc_override_rebel_in_quests_16_2_then_you_re_going_told_49ee67: "Then you're going to be told off."
  npc_override_rebel_in_quests_16_2_there_any_problem_97042f: "Is there any problem?"
  npc_override_rebel_in_quests_16_2_there_anything_else_6d395d: "Is there anything else?"
  npc_override_rebel_in_quests_16_2_there_anything_urgent_a8057f: "Is there anything urgent?"
  npc_override_rebel_in_quests_16_2_there_anything_wrong_you_b0c75c: "Is there anything wrong with it? You have this talented guy but you are not utilizing his ability. Are you? He's so talented!"
  npc_override_rebel_in_quests_16_2_there_conference_54835a: "There was a conference."
  npc_override_rebel_in_quests_16_2_there_he_leaves_again_wi_417574: "There he leaves again without saying goodbye to you. Sorry about him. Some of our kids are spoiled. But not every Rebellion is like that."
  npc_override_rebel_in_quests_16_2_there_incident_called_ma_ec185a: "There was an incident called 'Magic overuse'. Due to this incident, they passed the law to prohibit teleporting. In my opinion, 'Magic overuse' was manipulated by the government of Schwaltzvalt."
  npc_override_rebel_in_quests_16_2_there_must_reason_as_rid_72fb68: "There must be a reason, as Ridsh told us to bring it..."
  npc_override_rebel_in_quests_16_2_there_new_members_jana_l_8ee2a9: "And there are new members... ^0000CDJana Levedeva^000000 and ^0000CDIlya Lebedev^000000. They are twins and still young."
  npc_override_rebel_in_quests_16_2_there_no_reason_why_we_8e104c: "There is no reason why we have to sacrifice for you."
  npc_override_rebel_in_quests_16_2_there_no_way_reveal_hidd_08f8d0: "There is no way to reveal the hidden and protected device for us to destroy.."
  npc_override_rebel_in_quests_16_2_there_no_words_describe_af2826: "There are no words to describe... how great he is!"
  npc_override_rebel_in_quests_16_2_there_nothing_more_we_wa_8234db: "There is nothing more we want. Now let us finish the conversation."
  npc_override_rebel_in_quests_16_2_there_only_old_people_le_deb483: "There were only old people left in the village. So it must have been boring for Irene. But she didn't want to move to another village because she believed that her parents would come back one day."
  npc_override_rebel_in_quests_16_2_there_problem_position_a_d7343b: "There is a problem with the position as well..."
  npc_override_rebel_in_quests_16_2_there_reward_we_prepared_ac2584: "There is a reward that we prepared for you but we have not given it to you yet. So I sent this letter to invite you."
  npc_override_rebel_in_quests_16_2_there_s_no_need_sad_a8d55c: "There's no need to be sad."
  npc_override_rebel_in_quests_16_2_there_s_nothing_they_pro_84b575: "There's nothing they can do properly. Plus, they don't even listen to us."
  npc_override_rebel_in_quests_16_2_there_s_someone_you_shou_c51296: "...There's someone you should talk to lastly."
  npc_override_rebel_in_quests_16_2_there_s_something_air_4375ad: "There's something in the air."
  npc_override_rebel_in_quests_16_2_there_s_something_i_like_5ee741: "There's something I would like to tell you."
  npc_override_rebel_in_quests_16_2_there_s_something_i_like_ac901f: "There's something I would like to ask you."
  npc_override_rebel_in_quests_16_2_there_s_something_more_i_cdfd2a: "There's something more important now. Here's a letter from Dien."
  npc_override_rebel_in_quests_16_2_there_s_still_some_water_4fd7ff: "But there's still some water leakage in the pipe. Once I repair one of them, there's another water leakage in another pipe.. I wish we could replace them with brand new pipes."
  npc_override_rebel_in_quests_16_2_there_several_more_facil_ac80b4: "There are several more facilities that are presumed to have secret laboratories like this."
  npc_override_rebel_in_quests_16_2_there_slight_problem_mer_538862: "There is a slight problem. Mercenary Ring type A and B might be destroyed during the initialization. The probability is about 20 percent. Since they are small items, there are serious side effects when eliminating the upgraded effect."
  npc_override_rebel_in_quests_16_2_there_small_sign_below_t_1379e1: "There is a small sign below the tree, so you will find it easily."
  npc_override_rebel_in_quests_16_2_there_small_sign_front_t_767e63: "There is a small sign in front of the tree."
  npc_override_rebel_in_quests_16_2_there_so_many_people_vis_5a4124: "There will be so many people visiting us tomorrow. So I will ask Eri about how to receive many customers."
  npc_override_rebel_in_quests_16_2_there_some_people_who_li_ca3d43: "There are some people who do not like commander Volkova."
  npc_override_rebel_in_quests_16_2_there_something_importan_d50647: "There is something important."
  npc_override_rebel_in_quests_16_2_there_still_come_remnant_093acd: "There are still come remnants inside the research facilities."
  npc_override_rebel_in_quests_16_2_there_still_more_monster_8661a0: "But there are still more monsters inside."
  npc_override_rebel_in_quests_16_2_there_still_plenty_monst_60660e: "There are still plenty of monster experimental subjects inside, but"
  npc_override_rebel_in_quests_16_2_there_things_you_cannot_963a4f: "There are things you cannot buy."
  npc_override_rebel_in_quests_16_2_there_tree_south_side_ei_88f1bd: "There is a tree on the south side from the Einbroch observatory. You will find a ^0000CDflower girl^000000 nearby."
  npc_override_rebel_in_quests_16_2_there_unexpected_bonus_8edb94: "There was an unexpected bonus."
  npc_override_rebel_in_quests_16_2_there_visitor_rune_midga_f3d197: "There is a visitor from Rune Midgarts. I escorted the visitor to ^4d4dffthe Einbroch hotel^000000."
  npc_override_rebel_in_quests_16_2_there_you_find_6aa974: "And there ... you will find it."
  npc_override_rebel_in_quests_16_2_therefore_adventurer_i_l_d48e57: "Therefore.. Adventurer, I would like to ask you for a favor. Could you please bring me the materials that I require?"
  npc_override_rebel_in_quests_16_2_therefore_i_like_ask_you_3555b3: "Therefore, I would like to ask you for a favor... Actually for several. Because it has to be done outside."
  npc_override_rebel_in_quests_16_2_therefore_you_bring_your_76864f: "Therefore! You bring this yourself! And give the leaflets kindly to each person. Make sure you pass it on someone's hand with a kind smlie on your face."
  npc_override_rebel_in_quests_16_2_these_anchovy_cookies_ch_710d37: "These Anchovy cookies are Charity's favorite snack. Put the cookies on ^0000CDbenches in various places of the village^000000 and call Charity. If she comes out, please bring her to me."
  npc_override_rebel_in_quests_16_2_these_guys_quite_loud_f9790a: "These guys are quite loud."
  npc_override_rebel_in_quests_16_2_these_only_enough_today_703a0e: "These are only enough for today. Of course we must make a fire every single day!"
  npc_override_rebel_in_quests_16_2_these_people_must_return_91d277: "These people must return quickly in emergency, so they cannot go too far from here."
  npc_override_rebel_in_quests_16_2_these_people_really_rude_a57630: "These people are really rude."
  npc_override_rebel_in_quests_16_2_they_a459d2: "They?"
  npc_override_rebel_in_quests_16_2_they_accept_our_proposal_cdc05e: "They will accept our proposal."
  npc_override_rebel_in_quests_16_2_they_adults_babies_they_8b7ced: "They are adults, not babies. They can take care of themselves."
  npc_override_rebel_in_quests_16_2_they_all_know_we_better_842b25: "They all know that we have better abilities than adults."
  npc_override_rebel_in_quests_16_2_they_been_trainees_while_97b10c: "They have been trainees for a while and several month ago, they went on the real mission for the first time. That's when they stirred up trouble."
  npc_override_rebel_in_quests_16_2_they_bright_silver_hairs_b19cd7: "They have bright silver hairs and they're always together. You'll find them easily."
  npc_override_rebel_in_quests_16_2_they_cannot_use_e9e2fc: "They cannot use it."
  npc_override_rebel_in_quests_16_2_they_cats_give_them_char_1ce5b5: "They are for cats. Give them to Charity and bring back the rest of them. Make sure you don't eat them."
  npc_override_rebel_in_quests_16_2_they_claimed_you_had_mad_ffd71e: "They would have claimed that you had made things worse."
  npc_override_rebel_in_quests_16_2_they_come_help_us_like_5028ca: "They come to help us like this frequently."
  npc_override_rebel_in_quests_16_2_they_come_out_continuous_d374d9: "They come out continuously. I can't imagine how many experiments they conducted."
  npc_override_rebel_in_quests_16_2_they_doing_purpose_bced99: "Are they doing this on purpose?"
  npc_override_rebel_in_quests_16_2_they_enjoy_tea_time_ever_4ee2f0: "They enjoy tea time every day."
  npc_override_rebel_in_quests_16_2_they_fascinated_my_talen_f81723: "They were fascinated by my talented opening so they forgot to read the rest of the leaflet!"
  npc_override_rebel_in_quests_16_2_they_haven_t_found_out_ab5e23: "They haven't found out the exact mechanism yet."
  npc_override_rebel_in_quests_16_2_they_haven_t_read_my_c52dd6: "They haven't read my leaflets yet!"
  npc_override_rebel_in_quests_16_2_they_idiots_who_cannot_e_2483c8: "They are idiots who cannot even hit an automatic target. They were terrible as if they did not hit it on purpose."
  npc_override_rebel_in_quests_16_2_they_let_you_know_how_ff1379: "They will let you know how to get out of here."
  npc_override_rebel_in_quests_16_2_they_like_rats_trap_all_b665c6: "They are like rats in a trap. All we have to do is the cleanup~ I'm going in, too."
  npc_override_rebel_in_quests_16_2_they_looking_you_everywh_f0a286: "They are looking for you everywhere. You are so popular. Aren't you?"
  npc_override_rebel_in_quests_16_2_they_material_type_chime_ffcdf4: "They are ^4d4dffMaterial type Chimeras and Human type Chimeras.^000000"
  npc_override_rebel_in_quests_16_2_they_might_installed_gat_db35e0: "They might have installed a gate for teleport. We must disable it first."
  npc_override_rebel_in_quests_16_2_they_milo_mason_rachel_c_87b0b6: "They are Milo, Mason, Rachel, commander Ericsson and commander Elena."
  npc_override_rebel_in_quests_16_2_they_mortars_cannons_i_t_6ca9c8: "They are mortars, not cannons. I thought they would be sold today..."
  npc_override_rebel_in_quests_16_2_they_never_came_back_7b2292: "... And they never came back."
  npc_override_rebel_in_quests_16_2_they_room_nd_floor_you_20a751: "They are in the ^0000cdroom in the 2nd floor2^000000. You can go up and meet them."
  npc_override_rebel_in_quests_16_2_they_saved_gonie_s_life_895aac: "They saved Gonie's life. They came to this quiet Einbech. They found injured Gonie ^0000cdaccidentally^000000 and healed him. Then they brought him ^0000cdright^000000 here."
  npc_override_rebel_in_quests_16_2_they_say_we_d_better_3a6b22: "They say we'd better move to another place."
  npc_override_rebel_in_quests_16_2_they_say_we_had_outsider_c2996b: "They say we had an outsider after a long time. And the outsider persuaded us to cooperate with the government."
  npc_override_rebel_in_quests_16_2_they_say_you_no_one_eaae36: "They say it has to be you. No one else ..."
  npc_override_rebel_in_quests_16_2_they_seem_found_their_fo_5c2a8c: "They seem to have found their former character. That's good. You did a great job."
  npc_override_rebel_in_quests_16_2_they_skip_training_hurt_484ba9: "They skip the training and hurt a squadder by causing an accident during training... Recently, they tried to run away from the unit and got caught. So the duty manager and I had a hard time."
  npc_override_rebel_in_quests_16_2_they_so_dangerous_9d379c: "They are not so dangerous."
  npc_override_rebel_in_quests_16_2_they_so_stupid_8c0e29: "But they are not so stupid."
  npc_override_rebel_in_quests_16_2_they_still_under_age_acc_c9ff62: "... But they are still under age. According to the commander of their former unit, they don't have parents."
  npc_override_rebel_in_quests_16_2_they_take_chance_start_r_ef23eb: "They will take a chance to start it, right?"
  npc_override_rebel_in_quests_16_2_they_their_own_weapons_y_194b41: "They have their own weapons. And you lend them more?"
  npc_override_rebel_in_quests_16_2_they_told_me_come_here_57258d: "They told me to come here."
  npc_override_rebel_in_quests_16_2_they_told_me_meet_agent_f3d814: "They told me to meet the agent of the Secret Wings. Could it be that person? Well, by no means..."
  npc_override_rebel_in_quests_16_2_they_told_us_bring_them_a12bb7: "But... they told us to bring them. So we have to go and get them."
  npc_override_rebel_in_quests_16_2_they_took_training_witho_97a268: "They took the training without any problem and excelled in shooting. They quickly were able to play a role of a Rebellion."
  npc_override_rebel_in_quests_16_2_they_used_better_than_i_794be4: "They used to be better than this... I hope you can take cake of them."
  npc_override_rebel_in_quests_16_2_they_used_help_me_i_2da0d0: "They used to help me for this. But I cannot request them now."
  npc_override_rebel_in_quests_16_2_they_worst_kids_i_don_00293b: "They are the worst kids. I don't know why we have to keep them here."
  npc_override_rebel_in_quests_16_2_things_been_decided_some_4f2393: "Things have been decided to some degree."
  npc_override_rebel_in_quests_16_2_those_guys_what_they_wan_17c406: "For those guys to do what they want, they'll need your help again."
  npc_override_rebel_in_quests_16_2_those_guys_who_destroyed_c928a7: "Those guys who destroyed us!"
  npc_override_rebel_in_quests_16_2_those_who_did_return_wea_56c071: "Those who did not return weapons."
  npc_override_rebel_in_quests_16_2_three_sheets_leaflets_i_26385a: "Three sheets of leaflets. I will count on you."
  npc_override_rebel_in_quests_16_2_ticket_gate_over_there_w_edb2cc: "The ticket gate is over there! We have to pay for the train. Are you saying we will walk there?"
  npc_override_rebel_in_quests_16_2_time_day_everyone_taking_408765: "At this time of the day, everyone is taking a rest. Please go back and rest."
  npc_override_rebel_in_quests_16_2_time_let_me_talk_them_3d9dab: "It is time. Let me talk to them now."
  npc_override_rebel_in_quests_16_2_time_passing_rupert_9afb67: "The time is passing. Rupert."
  npc_override_rebel_in_quests_16_2_time_year_adler_children_731dbc: "At this time of year, Adler is the children who come to me always at this time of year, but this year I will not be able to candles."
  npc_override_rebel_in_quests_16_2_time_you_just_infant_dia_3efc08: "At that time, you were just an infant in diapers. How do you happen to know so much about them?"
  npc_override_rebel_in_quests_16_2_today_i_don_t_enough_7d8e2e: "Today I don't have enough Elunium. Could you please bring me two Elunium?"
  npc_override_rebel_in_quests_16_2_today_we_like_go_einbech_af959e: "Today, we would like to go to Einbech mine to research explosives. But I guess it would be dangerous if only two of us go there."
  npc_override_rebel_in_quests_16_2_token_honor_8c5b64: "Token of honor?"
  npc_override_rebel_in_quests_16_2_totally_my_fault_my_mist_3f37b6: "This is totally my fault and my mistake."
  npc_override_rebel_in_quests_16_2_train_carried_coal_mine_902e8a: "It was a train that carried coal from the mine. Since it was night, the train stopped. Well, they say the train is not operated a lot these days due to a great deal of monsters in the mine."
  npc_override_rebel_in_quests_16_2_trainees_7157fa: "Trainees!!!"
  npc_override_rebel_in_quests_16_2_traveler_you_came_again_a9ec99: "Traveler. You came again. Thank you."
  npc_override_rebel_in_quests_16_2_true_61ff56: "Is that... true?"
  npc_override_rebel_in_quests_16_2_true_f57d93: "It is not true."
  npc_override_rebel_in_quests_16_2_true_nihil_overstepped_h_98053c: "It is true that Nihil overstepped his place during the process. But we removed the dishonor on our family."
  npc_override_rebel_in_quests_16_2_trust_me_tell_adventurer_ecd587: "Trust me. And tell the adventurer if you have any problem."
  npc_override_rebel_in_quests_16_2_trying_respect_you_as_se_eff29a: "Trying to respect you as a senior, I have overlooked your behavior so far. However, this time, you crossed the line."
  npc_override_rebel_in_quests_16_2_turned_off_torch_fire_ye_5aa20f: "The Turned-off torch.. Fire!! Yes, it's the fire. Since Einbech is a mountainous area, there is occasionally a strong wind there, even in normal times. What was different from usual was that the torch was turned off."
  npc_override_rebel_in_quests_16_2_twinkle_twinkle_little_s_d77b80: "Twinkle twinkle little star~ My shooting star, you are still beautiful."
  npc_override_rebel_in_quests_16_2_twins_nearby_place_where_673c98: "The twins will be nearby the place where they've always been."
  npc_override_rebel_in_quests_16_2_type_air_critical_dry_sk_bf6b87: "This type of air is critical to the dry skin like yours!"
  npc_override_rebel_in_quests_16_2_umm_anyway_what_we_find_ce5c52: "Umm. Anyway, what we have to do is find that guy here in Lighthalzen."
  npc_override_rebel_in_quests_16_2_unexpected_result_115cdf: "It was an unexpected result."
  npc_override_rebel_in_quests_16_2_unfair_i_ve_been_victimi_ce54b3: "This is unfair. I've been victimized! Father! Mother!!"
