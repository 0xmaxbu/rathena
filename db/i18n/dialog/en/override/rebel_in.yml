  npc_override_rebel_in_quests_16_2_i_take_him_well_8b1289: "I will take him ... well."
  npc_override_rebel_in_quests_16_2_i_take_leaflets_if_you_8ee805: "I will take the leaflets if you give me... But I only need a little amount of gunpowder in the mine."
