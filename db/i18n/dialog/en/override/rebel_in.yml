  npc_override_rebel_in_quests_16_2_we_need_item_strong_wate_69bc52: "We need an item that has a strong Water attribute."
  npc_override_rebel_in_quests_16_2_we_need_more_help_6973dd: "We need more help."
  npc_override_rebel_in_quests_16_2_we_need_pieces_crystal_p_fad540: "We need ^0000cd10 pieces of crystal and 10 pieces of black crystal^000000. Please don't forget it this time!"
  npc_override_rebel_in_quests_16_2_we_need_special_vibratio_f1022c: "We need a special vibration generated when Obsidians and Minerals die. That vibration enables the crystal to get broken into smaller pieces..."
  npc_override_rebel_in_quests_16_2_we_never_know_what_you_ce0d5c: "We never know what you put on this food! There is nothing we would like to hear from you. So get out of here!"
  npc_override_rebel_in_quests_16_2_we_never_see_them_again_543a0e: "We will never see them again. So send them gently. Rookie."
  npc_override_rebel_in_quests_16_2_we_no_choice_come_back_b8597c: "...We have no choice. Come back later."
  npc_override_rebel_in_quests_16_2_we_no_choice_s_our_e86630: "But we have no choice. It's our fault. Please report to our commander."
  npc_override_rebel_in_quests_16_2_we_no_other_choice_c3be70: "We have no other choice."
  npc_override_rebel_in_quests_16_2_we_now_cooperating_aren_de4ee5: "We are now cooperating, aren't we?"
  npc_override_rebel_in_quests_16_2_we_only_single_chance_so_04b75b: "And we only have a single chance. So you are welcome to give us a good idea."
  npc_override_rebel_in_quests_16_2_we_problem_according_our_0e1213: "We have a problem. According to our schedule, we were planning to destroy the equipment in Yuno right after destroying the equipment in Lighthalzen.."
  npc_override_rebel_in_quests_16_2_we_punished_moved_usu_th_b858c0: "We were punished and moved to USU... Then we felt that everyone else regards us as horrible kids."
  npc_override_rebel_in_quests_16_2_we_re_rebellions_we_end_7e8815: "We're Rebellions. And we are at the end of guns."
  npc_override_rebel_in_quests_16_2_we_re_sorry_9884f2: "......We're sorry..."
  npc_override_rebel_in_quests_16_2_we_realize_we_enough_arm_fc349c: "We do realize that we do not have enough armed forces. So we have prepared some other strategies."
  npc_override_rebel_in_quests_16_2_we_really_repair_urgentl_92bfc9: "We really have to repair it urgently. But this guy cannot go to the mine due to a certain reason. Also, I cannot go to the mine for other job. We will certainly compensate for your support."
  npc_override_rebel_in_quests_16_2_we_rely_heroic_adventure_1d6920: "We have to rely on the heroic adventurer to borrow the military force of the Rebellion ..."
  npc_override_rebel_in_quests_16_2_we_sacrificed_too_much_f_69a6cf: "We sacrificed too much to forget it!"
  npc_override_rebel_in_quests_16_2_we_search_rest_them_79170e: "We will search for the rest of them."
  npc_override_rebel_in_quests_16_2_we_see_something_get_the_da6ec9: "We have to see something to get in there."
  npc_override_rebel_in_quests_16_2_we_send_official_letter_a4ff72: "We can send an official letter to the Enterpriserequesting their cooperation in the investigation. But as far as we are concerned, such an official request would only give them time to hide things."
