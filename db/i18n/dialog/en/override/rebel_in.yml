  npc_override_rebel_in_quests_16_2_we_meet_again_if_necessa_29cc43: "We will meet again, if necessary."
  npc_override_rebel_in_quests_16_2_we_met_today_first_time_dbd379: "We have met today for the first time, but I guess we will be friends from now on. So you can just call me Vero."
  npc_override_rebel_in_quests_16_2_we_middle_mission_s_alre_1d35c9: "But we are in the middle of a mission. It's already begun. It's kind of an emergency. So we have to be tense."
