  npc_override_rebel_in_quests_16_2_if_you_don_t_mind_e6a229: "If you don't mind, could you please come back tomorrow and help me receiving customers? Huhu..."
  npc_override_rebel_in_quests_16_2_if_you_don_t_want_9158bd: "If you don't want to fight, I guess you don't need any cooperation. Go back."
