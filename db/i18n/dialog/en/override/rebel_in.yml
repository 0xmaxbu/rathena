  npc_override_rebel_in_quests_16_2_as_i_didn_t_see_8c601a: "But as I didn't see it with my eyes,"
  npc_override_rebel_in_quests_16_2_as_i_expected_0d479d: "As I expected ............"
  npc_override_rebel_in_quests_16_2_as_i_explained_before_in_800f6d: "As I explained before, the initialization of rings is quite hard. ^ff0000The success rate is 80 percent.^000000 If it fails, the item is gone. Are you sure you want to do this?"
  npc_override_rebel_in_quests_16_2_as_i_mentioned_before_ou_835a2e: "As I mentioned before, our greatest challenge is to enter the Rebellion's secret base without any armed conflict. This costume is for that purpose."
  npc_override_rebel_in_quests_16_2_as_i_promised_i_listen_bf050a: "As I promised, I will listen to you. Go ahead."
  npc_override_rebel_in_quests_16_2_as_i_told_you_before_d1e11b: "As I told you before, you are the freest person among us."
  npc_override_rebel_in_quests_16_2_as_i_told_you_earlier_7e6d45: "As I told you earlier, please think about commander Adler."
  npc_override_rebel_in_quests_16_2_as_i_told_you_i_fcb50e: "As I told you, I used to be the hottest person in Clana Nemieri before you showed up!"
  npc_override_rebel_in_quests_16_2_as_i_told_you_s_f5c231: "As I told you, it's a unit outside our regulation. So I can't tell you about it in detail. But we do several things that Rebellions don't do."
  npc_override_rebel_in_quests_16_2_as_i_told_you_you_e29ab2: "As I told you, you don't have to do this... You're so persistent."
  npc_override_rebel_in_quests_16_2_as_i_wrote_letter_35ad07: "As I wrote in the letter."
  npc_override_rebel_in_quests_16_2_as_if_you_going_far_f372c2: "As if you were going far away?"
  npc_override_rebel_in_quests_16_2_as_long_as_there_just_52da4c: "As long as there is just one person who trusts you, you can grow to infinity."
  npc_override_rebel_in_quests_16_2_as_long_as_there_magic_bd5134: "As long as there are magic inside, the same thing will happen again."
  npc_override_rebel_in_quests_16_2_as_long_as_you_behave_ba9600: "As long as you behave yourself... nothing bad will happen. Maybe...?"
  npc_override_rebel_in_quests_16_2_as_long_as_you_walk_1c9f09: "As long as you ^0000cdwalk on the pipe^000000 instead of the stairs, it's your fault. The pipe is innocent. How can you do that to the pipe!"
  npc_override_rebel_in_quests_16_2_as_matter_fact_i_estimat_effc4c: "As a matter of fact, I estimated it a little."
  npc_override_rebel_in_quests_16_2_as_matter_fact_she_canno_73d018: "... As a matter of fact, she cannot sew well."
  npc_override_rebel_in_quests_16_2_as_my_family_ignored_me_cd1a8e: "As my family ignored me, I decided to leave the house to find something I am capable of."
  npc_override_rebel_in_quests_16_2_as_soon_as_you_drink_459047: "As soon as you drink the tea, leave at once~ We won't see you off!"
  npc_override_rebel_in_quests_16_2_as_they_got_old_they_9d04d2: "But as they got old, they retired from the front line. Now they drink tea and watch the junior Rebellions grow up."
  npc_override_rebel_in_quests_16_2_as_they_occupied_place_t_4c7edd: "As they occupied this place, they are remodeling some of the routes to make a training camp."
  npc_override_rebel_in_quests_16_2_as_usual_please_find_res_0bd6cb: "As usual, please find the researchers who are hiding and hand them over to a Rebellion squad member."
  npc_override_rebel_in_quests_16_2_as_vero_asked_me_i_f99d97: "As Vero asked me, I smashed the Teleport Prohibition equipment with the Flame Heart."
  npc_override_rebel_in_quests_16_2_as_we_acted_our_pleasure_6ef137: "As we acted at our pleasure, things got worse and worse... So we were sacred..."
  npc_override_rebel_in_quests_16_2_as_written_letter_1723de: "As written in the letter."
  npc_override_rebel_in_quests_16_2_as_you_always_shown_us_30130c: "As you always have shown us honest faith."
  npc_override_rebel_in_quests_16_2_as_you_helped_our_republ_81a5df: "As you helped our republic, his excellency is trying to get you some useful stuff for adventurers."
  npc_override_rebel_in_quests_16_2_as_you_know_government_v_228165: "As you know, the government does not have a very good relationship with the enterprise. And we need cooperation for the facility of the enterprise."
  npc_override_rebel_in_quests_16_2_as_you_know_there_many_60b06a: "As you know, there are many accidents in Einbech."
