  npc_override_rebel_in_quests_16_2_we_should_done_ba292f: "We should not have done it..."
  npc_override_rebel_in_quests_16_2_we_should_them_sense_apo_28a3a0: "We should them a sense of apology and a promise of hope in the future. At the same time, ^0000cdwe have to relax their mind and promise with them to cooperate in future affairs^000000..."
  npc_override_rebel_in_quests_16_2_we_show_you_our_gratitud_bb2ae8: "We have to show you our gratitude in return."
  npc_override_rebel_in_quests_16_2_we_sorry_about_d1ce04: "We are sorry about it."
  npc_override_rebel_in_quests_16_2_we_still_absolute_rule_w_54b1be: "But we still have a absolute rule. We don't mess up with other Rebellions."
  npc_override_rebel_in_quests_16_2_we_supposed_here_now_7a515a: "We are not supposed to be here now."
  npc_override_rebel_in_quests_16_2_we_talk_freely_00fd59: "Can we talk freely?"
  npc_override_rebel_in_quests_16_2_we_talking_about_party_w_8b06b5: "We were talking about the party we are planning soon."
  npc_override_rebel_in_quests_16_2_we_think_schwaltzvalt_go_fa5be7: "We think the Schwaltzvalt government installed the equipment to limit teleporting to protect the secret research of the Rekenber enterprise."
  npc_override_rebel_in_quests_16_2_we_thought_we_had_alread_fa02a4: "We thought that we had already ruined everything."
  npc_override_rebel_in_quests_16_2_we_tired_because_someone_a9b7e3: "We are tired because someone is irritating us."
  npc_override_rebel_in_quests_16_2_we_trouble_ef590c: "We are in trouble."
  npc_override_rebel_in_quests_16_2_we_try_find_those_guys_ae9c26: "We will try to find those guys for now."
  npc_override_rebel_in_quests_16_2_we_trying_our_best_get_8f6065: "We are trying our best to get rid of them. But honestly, it's tough."
  npc_override_rebel_in_quests_16_2_we_various_weapons_inclu_3266e9: "We have various weapons including firearms, gunpowder, cannon, mortar and Molotov cocktails. Please visit us often."
