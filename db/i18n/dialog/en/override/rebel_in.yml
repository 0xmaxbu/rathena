  npc_override_rebel_in_quests_16_2_we_cannot_help_walking_fdefd5: "We cannot help walking."
  npc_override_rebel_in_quests_16_2_we_cannot_leave_our_savi_ac786b: "We cannot leave our savior outside. Let the adventurer come in."
  npc_override_rebel_in_quests_16_2_we_cannot_officially_ann_9c950c: "We cannot officially announce this situation either."
