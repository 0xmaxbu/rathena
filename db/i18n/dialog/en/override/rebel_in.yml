  npc_override_rebel_in_quests_16_2_we_attacked_them_all_sud_2f381e: "We attacked them all of a sudden, and we expect more of them are still hiding."
  npc_override_rebel_in_quests_16_2_we_attacked_them_all_sud_33784c: "We attacked them all of a sudden, and we expect more of them are still hiding. But we will find them sooner or later."
