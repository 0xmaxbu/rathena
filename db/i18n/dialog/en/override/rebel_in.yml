  npc_override_rebel_in_quests_16_2_we_cooperating_now_so_ma_f167ba: "We are cooperating now, so may I tell you my opinion?"
  npc_override_rebel_in_quests_16_2_we_count_you_again_next_0b80ad: "We will count on you again next time."
