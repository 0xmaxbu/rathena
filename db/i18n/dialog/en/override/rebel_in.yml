  npc_override_rebel_in_quests_16_2_i_hope_they_don_t_dc9da8: "I hope they don't get hurt."
  npc_override_rebel_in_quests_16_2_i_hope_they_trying_poiso_456cf7: "I hope they are not trying to poison me..."
  npc_override_rebel_in_quests_16_2_i_hope_you_stop_later_2b582d: "I hope you can stop by later when you have time."
  npc_override_rebel_in_quests_16_2_i_investigate_southern_l_2a93db: "I will investigate southern Lighthalzen, and the lady will investigate nearby the department store and hotel."
  npc_override_rebel_in_quests_16_2_i_investigate_southern_l_aa02bb: "I will investigate southern Lighthalzen, including the airport."
  npc_override_rebel_in_quests_16_2_i_joined_rebellion_becau_d21bc5: "I joined the Rebellion, because their shooting looked so cool to me. But now I am so busy handling the documents that I have no time to get my hands on a gun."
  npc_override_rebel_in_quests_16_2_i_just_arrived_yuno_i_1be8d7: "I just arrived from Yuno. I went there and it was so~ wonderful."
  npc_override_rebel_in_quests_16_2_i_just_felt_devastated_l_623098: "I just felt devastated to lose my son, daughter-in-law and granddaughter. I was absent-minded and did not find any reason to live on..."
  npc_override_rebel_in_quests_16_2_i_know_cumbersome_we_cou_f66b4a: "I know this will be cumbersome. But we will count on you."
  npc_override_rebel_in_quests_16_2_i_know_dff1f8: "I know."
  npc_override_rebel_in_quests_16_2_i_know_how_make_them_1a15a8: "I know how to make them listen to me. But it will only make the situation worse."
  npc_override_rebel_in_quests_16_2_i_know_s_funny_i_8b89cf: "I know it's funny, but I am sorry that your trip was in vain."
  npc_override_rebel_in_quests_16_2_i_know_stuff_75d8d1: "I know this stuff."
  npc_override_rebel_in_quests_16_2_i_know_you_off_duty_fc3589: "I know you are off-duty today."
  npc_override_rebel_in_quests_16_2_i_know_you_ve_met_29c24e: "I know you've met Rupert. Have you met ^ff0000Erst^000000?"
  npc_override_rebel_in_quests_16_2_i_know_you_worked_hard_908298: "I know you worked hard for us to bring them. Sorry to ask you once again."
  npc_override_rebel_in_quests_16_2_i_leave_now_6c29a2: "Can I leave now?"
  npc_override_rebel_in_quests_16_2_i_let_him_come_even_889e6b: "I let him come in, even though I had a bad feeling about it."
  npc_override_rebel_in_quests_16_2_i_let_you_go_could_7fb934: "I will let you go. Could you just find that thing?"
  npc_override_rebel_in_quests_16_2_i_like_1bface: "I like it."
  npc_override_rebel_in_quests_16_2_i_like_ask_you_get_47b79b: "I would like to ask you to get some snacks."
  npc_override_rebel_in_quests_16_2_i_like_fight_you_please_4f61de: "I would like to fight you! Please allow me!"
  npc_override_rebel_in_quests_16_2_i_like_fight_you_when_7c411f: "I would like to fight you when you are in the top condition. Come back tomorrow."
  npc_override_rebel_in_quests_16_2_i_like_get_some_more_d78c55: "I would like to get some more!"
  npc_override_rebel_in_quests_16_2_i_like_guys_who_serious_93acdc: "I like guys who are serious about completing their missions. But in this case ... I wish he had just abandoned his mission and taken a vacation."
  npc_override_rebel_in_quests_16_2_i_like_something_dull_891690: "I like something dull."
  npc_override_rebel_in_quests_16_2_i_like_spunky_fellows_s_a71927: "I like spunky fellows. It's fun to fight with them."
  npc_override_rebel_in_quests_16_2_i_like_your_honesty_you_6b74bf: "I like your honesty. You don't actually need to know that."
  npc_override_rebel_in_quests_16_2_i_like_your_spirit_you_9598b3: "I like your spirit. You said you need a cooperation? Why not? I agree."
  npc_override_rebel_in_quests_16_2_i_listen_complaints_all_cf8a10: "I have to listen to complaints of all the people. That's a problem."
  npc_override_rebel_in_quests_16_2_i_ll_count_you_adventure_547c43: "I'll count on you, adventurer."
  npc_override_rebel_in_quests_16_2_i_look_forward_having_go_8cec65: "I look forward to having a good business relationship with you, fellow."
  npc_override_rebel_in_quests_16_2_i_look_forward_hearing_g_4536d6: "I look forward to hearing good news from you."
  npc_override_rebel_in_quests_16_2_i_lost_7466da: "I lost it."
  npc_override_rebel_in_quests_16_2_i_love_reading_books_dur_ecb5ba: "I love reading books during my night duty. Where is the episode 3?"
  npc_override_rebel_in_quests_16_2_i_lucky_find_him_early_b56a02: "I was lucky to find him early."
  npc_override_rebel_in_quests_16_2_i_m_afraid_mine_please_feded4: "I'm afraid of the mine. Please don't send me to the mine. Please... Brother, please..."
  npc_override_rebel_in_quests_16_2_i_m_afraid_you_collapse_f358d6: "I'm afraid you will collapse from overwork. The health is the most important. Please take some rest."
  npc_override_rebel_in_quests_16_2_i_m_back_here_s_a5b055: "I'm back. Here's the book."
  npc_override_rebel_in_quests_16_2_i_m_charge_repairing_her_389561: "I'm charge of repairing here. The supply is handled there."
  npc_override_rebel_in_quests_16_2_i_m_coming_you_i_577a07: "I'm coming with you. I will defend you."
  npc_override_rebel_in_quests_16_2_i_m_counting_you_miss_ade02c: "... I'm counting on you for Miss Spica."
  npc_override_rebel_in_quests_16_2_i_m_curious_about_too_b2f6e1: "I'm curious about it, too. I know you are exhausted after coming back from your mission. But please tell me about your mission in detail."
  npc_override_rebel_in_quests_16_2_i_m_expecting_so_much_67bc9d: "I'm expecting it so much!"
  npc_override_rebel_in_quests_16_2_i_m_feeling_ashamed_1b4ed5: "I'm feeling ashamed..."
  npc_override_rebel_in_quests_16_2_i_m_glad_you_becoming_ab290e: "I'm glad that you are becoming stronger."
  npc_override_rebel_in_quests_16_2_i_m_happy_thank_you_b2f05b: "I'm happy, thank you. One bouquet for today is enough."
  npc_override_rebel_in_quests_16_2_i_m_here_c66f6d: "I'm here."
  npc_override_rebel_in_quests_16_2_i_m_here_watch_nihil_2152c5: "I'm here to watch Nihil."
  npc_override_rebel_in_quests_16_2_i_m_hurry_0e9127: "I'm in a hurry..."
  npc_override_rebel_in_quests_16_2_i_m_hurry_c2b785: "But I'm in a hurry!"
  npc_override_rebel_in_quests_16_2_i_m_irene_s_grandmother_a6e684: "I'm Irene's grandmother who fell asleep here. My name is Lucy."
  npc_override_rebel_in_quests_16_2_i_m_just_saying_i_95115e: "I'm just saying that I feel like it is dangerous. I don't mean it will really be dangerous. Calm down."
  npc_override_rebel_in_quests_16_2_i_m_leaving_until_i_6a5670: "I'm not leaving until I close his big mouth! I'm not leaving!"
  npc_override_rebel_in_quests_16_2_i_m_level_they_require_6ac9e5: "But I'm not at the level they require here. Whenever I get a gun in my hand, my eyes are sore and my hands are shaking. I can't aim a target properly..."
  npc_override_rebel_in_quests_16_2_i_m_little_nervous_negot_40368f: "I'm a little nervous. A negotiation..."
  npc_override_rebel_in_quests_16_2_i_m_old_yet_5622dd: "I'm not that old yet."
  npc_override_rebel_in_quests_16_2_i_m_one_who_brought_90d71f: "I'm the one who brought her and he doesn't seem to care about me..."
  npc_override_rebel_in_quests_16_2_i_m_one_who_s_c32eb3: "I'm not the one who's short-tempered. I guess it's you."
  npc_override_rebel_in_quests_16_2_i_m_one_who_saved_1f38a8: "I'm the one who saved your life during the ravage of war."
  npc_override_rebel_in_quests_16_2_i_m_quite_busy_96486c: "I'm quite busy..."
  npc_override_rebel_in_quests_16_2_i_m_rachel_smith_i_15ca06: "I'm Rachel Smith. I'm a Blacksmith and I assist repairing weapons and maintenance."
  npc_override_rebel_in_quests_16_2_i_m_scared_what_she_5a4f09: "I'm scared what she's going to tell us... But we will still meet her."
  npc_override_rebel_in_quests_16_2_i_m_so_glad_i_b058c2: "I'm so glad!!! But I might be outside for a mission. In that case, don't panic and come back next time."
  npc_override_rebel_in_quests_16_2_i_m_so_hungry_eat_1bde40: "I'm so hungry and have to eat... I should take care of my kitty... And..."
  npc_override_rebel_in_quests_16_2_i_m_so_sad_88571f: "I'm so sad!!!!!!"
  npc_override_rebel_in_quests_16_2_i_m_so_sad_a4df62: "I'm so sad."
  npc_override_rebel_in_quests_16_2_i_m_so_tired_after_9410e0: "I'm so tired after a hard work. Don't annoy me and just leave."
  npc_override_rebel_in_quests_16_2_i_m_so_tired_i_968985: "I'm so tired. I will sleep after drinking a cup of tea."
  npc_override_rebel_in_quests_16_2_i_m_sorry_00dca6: "I'm sorry."
  npc_override_rebel_in_quests_16_2_i_m_sorry_51685f: "I'm sorry!!!!"
  npc_override_rebel_in_quests_16_2_i_m_sorry_a1b803: "... I'm sorry."
  npc_override_rebel_in_quests_16_2_i_m_sorry_i_t_8e66b7: "I'm sorry I can't tell more than that. It's confidential."
  npc_override_rebel_in_quests_16_2_i_m_sorry_s_fun_333dd3: "I'm sorry. It's not fun anyway."
  npc_override_rebel_in_quests_16_2_i_m_sorry_too_49a0d3: "I'm... sorry too..."
  npc_override_rebel_in_quests_16_2_i_m_sorry_troubled_you_902d30: "I'm sorry to have troubled you..."
  npc_override_rebel_in_quests_16_2_i_m_still_here_fellow_39be3c: "I'm still here. This fellow cannot leave immediately. Neither can I."
  npc_override_rebel_in_quests_16_2_i_m_sure_daughter_nerius_aedc0b: "I'm sure the daughter of the Nerius family knows more about it than I do."
  npc_override_rebel_in_quests_16_2_i_m_sure_he_take_b56f65: "I'm sure he will take care of getting himself there."
  npc_override_rebel_in_quests_16_2_i_m_sure_if_i_759bd8: "I'm not sure if I can say this to an outsider... But you are close to the Rebellion now."
  npc_override_rebel_in_quests_16_2_i_m_sure_people_stop_3e8694: "I'm sure people will stop her from rushing to the train of entering the mine. Right?"
  npc_override_rebel_in_quests_16_2_i_m_sure_whether_they_512976: "But I'm not sure whether they could feel more comfortable with this kind compensation or contract ..."
  npc_override_rebel_in_quests_16_2_i_m_sure_you_know_3d7b24: "I'm sure you know what happened during our first mission... not long ago."
  npc_override_rebel_in_quests_16_2_i_m_surprised_erst_accep_d55c35: "I'm surprised that Erst accepted it so easily."
  npc_override_rebel_in_quests_16_2_i_m_trouble_what_shall_fbc4c3: "(I'm in trouble. What shall I do?)"
  npc_override_rebel_in_quests_16_2_i_m_vacation_now_cbab3b: "I'm on vacation from now on!"
  npc_override_rebel_in_quests_16_2_i_made_cookies_together_aacf4b: "I made cookies together with Jana. Yesterday, we read a book together. Tomorrow we will explore the dead mine..."
  npc_override_rebel_in_quests_16_2_i_made_various_stuffs_no_136a89: "And I made various stuffs and now I ran out of crystals... Would you mind if I ask you to get them?"
  npc_override_rebel_in_quests_16_2_i_make_sure_you_get_1966d5: "I will make sure that you get enough compensation."
  npc_override_rebel_in_quests_16_2_i_managed_get_detailed_d_af7d55: "I managed to get detailed data about the man and got a confession without making much fuss."
  npc_override_rebel_in_quests_16_2_i_many_things_handle_whe_6fafa2: "I have many things to handle when I get back."
  npc_override_rebel_in_quests_16_2_i_mean_chimeras_008b9a: "I mean, Chimeras."
  npc_override_rebel_in_quests_16_2_i_mean_details_your_repo_7b1396: "I mean, from the details on your report."
  npc_override_rebel_in_quests_16_2_i_mean_how_much_she_8e6a1d: "I mean.... how much she likes her older brother..."
  npc_override_rebel_in_quests_16_2_i_mean_jana_you_44b7dd: "I mean... by Jana. Not by you."
  npc_override_rebel_in_quests_16_2_i_mean_researchers_7c1321: "I mean, the researchers."
  npc_override_rebel_in_quests_16_2_i_mean_spoiled_crow_pres_53329c: "I mean, the spoiled crow of the President-"
  npc_override_rebel_in_quests_16_2_i_mean_why_you_go_5e24c9: "I mean, why do you have to go through a place like this? Don't they pay you any activity cost? Maybe his excellency doesn't care for all your comfort."
  npc_override_rebel_in_quests_16_2_i_might_look_suspicious_04f168: "I might look suspicious, so I will hide myself."
  npc_override_rebel_in_quests_16_2_i_must_go_yuno_0c156d: "And I must go to Yuno."
  npc_override_rebel_in_quests_16_2_i_must_showing_my_gratit_68cfa0: "I must be showing my gratitude now. But I have to ask you for one more favor. Please talk to my elder sister once in a while. She is lonely quite often.."
  npc_override_rebel_in_quests_16_2_i_my_best_rookie_what_fabea0: "I will do my best. Rookie, what have you been doing recently? How was your talk with Lazy?"
  npc_override_rebel_in_quests_16_2_i_need_some_burnt_tree_0acba2: "I need some Burnt Tree. About 10 of them. Since they are well-dried, they will be burnt well. And there's better than coal to keep the fire long. Bring some coal please. Three of them."
  npc_override_rebel_in_quests_16_2_i_need_some_burnt_trees_bf655c: "I need some Burnt Trees, about 10 of them. Since they are well-dried, they will be burnt well. And there's better coal to keep the fire long. Bring some coal please, three of them."
  npc_override_rebel_in_quests_16_2_i_need_some_glittering_s_acf4ba: "I need some glittering stuffs to decorate my Shooting Star. Let me see... I need pieces of crystal and black crystal that twinkle transparently."
  npc_override_rebel_in_quests_16_2_i_never_accept_5051df: "I will never accept it!"
  npc_override_rebel_in_quests_16_2_i_never_bored_e5cf72: "I would never be bored."
  npc_override_rebel_in_quests_16_2_i_never_imagined_chimera_5bdf15: "I never imagined that Chimeras would be tougher than Heart Hunters ..."
  npc_override_rebel_in_quests_16_2_i_never_imagined_i_sent_7c3a6f: "I never imagined that I would be sent to this laboratory full of monsters!"
  npc_override_rebel_in_quests_16_2_i_never_imagined_i_trave_81e3bb: "I never imagined that I would be traveling overseas ... I hope everything goes well."
  npc_override_rebel_in_quests_16_2_i_never_imagined_there_p_fac2cb: "I never imagined there would be a place like this behind the store... What's this?"
  npc_override_rebel_in_quests_16_2_i_never_thought_you_d_d6f9fa: "I never thought that you'd actually eat them. Did you eat them?"
  npc_override_rebel_in_quests_16_2_i_never_trust_you_guys_ebcff5: "But I will never trust you guys! I will keep my eyes on you!!!"
  npc_override_rebel_in_quests_16_2_i_no_choice_let_s_4f9cbe: "(I have no choice. Let's prepare for the fight and talk to Elena Volkova again.)"
  npc_override_rebel_in_quests_16_2_i_no_idea_what_brought_4f0fd5: "I have no idea what brought you here. But I can't let you in."
  npc_override_rebel_in_quests_16_2_i_no_other_choice_4da710: "I have no other choice."
  npc_override_rebel_in_quests_16_2_i_no_other_choice_7218da: "... I have no other choice."
  npc_override_rebel_in_quests_16_2_i_nodded_615e66: "I nodded."
  npc_override_rebel_in_quests_16_2_i_nowhere_else_go_neithe_ad187f: "I have nowhere else to go. Neither does everyone else here. We cannot just help you trusting your promise."
  npc_override_rebel_in_quests_16_2_i_occasionally_shooting_d538c7: "I occasionally have a shooting pain near my heart. And my heart beats faster than usual. Sometimes I become hot even though I don't have a fever."
  npc_override_rebel_in_quests_16_2_i_passed_some_unimportan_ef1bef: "I passed some of the unimportant details of the man's confession to the Schwartz government. Also, I handed Bruno to Schwartz."
  npc_override_rebel_in_quests_16_2_i_prefer_being_active_du_a9797b: "I prefer being on active duty. By the way... How do I get them?"
  npc_override_rebel_in_quests_16_2_i_prepare_meal_gluttons_7cdb72: "I have to prepare the meal for gluttons... Could you go bring Charity?"
  npc_override_rebel_in_quests_16_2_i_prepare_tea_time_tomor_0dc822: "I have to prepare for the tea time tomorrow as well... If you don't mind, could you bring it again tomorrow?"
  npc_override_rebel_in_quests_16_2_i_promised_meet_vero_lig_23efd3: "I promised to meet Vero at Lighthalzen. Let's go to Lighthalzen."
  npc_override_rebel_in_quests_16_2_i_provide_special_upgrad_2b4161: "I provide a special upgrade for Agenda Robes, Consultation Robes and Mercenary Rings type A and B. In return, I take Schwartz Honor Tokens."
  npc_override_rebel_in_quests_16_2_i_put_bucket_there_recei_88334a: "I put the bucket there to receive the leaking water! Once the pipe is entirely broken, there will be a flood in this place! Don't you have the brain to think of it?"
  npc_override_rebel_in_quests_16_2_i_put_down_cherished_bou_3be7ce: "I put down the Cherished Bouquet and took a moment of silence."
  npc_override_rebel_in_quests_16_2_i_read_document_008c46: "I read the document."
  npc_override_rebel_in_quests_16_2_i_read_too_what_you_840a55: "I read it, too. What you have said just now was written there."
  npc_override_rebel_in_quests_16_2_i_really_don_t_understan_3d0973: "I really don't understand the relationship between being tense and free riding."
  npc_override_rebel_in_quests_16_2_i_really_hate_those_who_4fee52: "I really hate those who try to use other's lives as they please."
  npc_override_rebel_in_quests_16_2_i_really_hate_training_ee9ceb: "... I really hate training ..."
  npc_override_rebel_in_quests_16_2_i_really_need_them_so_afebaf: "But I really need them. So please bring them to me. Will you?"
  npc_override_rebel_in_quests_16_2_i_reclaimed_blessing_sta_3efaa3: "I reclaimed the Blessing Star."
  npc_override_rebel_in_quests_16_2_i_remember_as_mission_va_306670: "I will remember this as a mission with various questions remaining."
  npc_override_rebel_in_quests_16_2_i_remember_i_asked_him_3c42e5: "I remember I asked him for an errand. Will he be back here?"
  npc_override_rebel_in_quests_16_2_i_reported_elders_our_ro_053a0e: "I reported to the elders of our royal family about this affair. I was scolded and barely got permission to come here."
  npc_override_rebel_in_quests_16_2_i_said_no_35d429: "I said no!"
  npc_override_rebel_in_quests_16_2_i_saw_rupert_crying_afte_f3636c: "I saw Rupert crying after you said that."
  npc_override_rebel_in_quests_16_2_i_scroll_movement_made_n_bc6708: "I have a Scroll of Movement made by Nilem, the palace magician. Shall I use it?"
  npc_override_rebel_in_quests_16_2_i_see_1761bb: "...... I see."
  npc_override_rebel_in_quests_16_2_i_see_c52c6e: "I see."
  npc_override_rebel_in_quests_16_2_i_see_come_we_give_11ec2b: "I see. Come in. We can give you a cup of tea as you wish."
  npc_override_rebel_in_quests_16_2_i_see_eb99a4: "I see!"
  npc_override_rebel_in_quests_16_2_i_see_experienced_advent_9c475b: "I see. An experienced adventurer and a bodyguard ..."
  npc_override_rebel_in_quests_16_2_i_see_how_much_effort_346ccb: "I can see how much effort they gave to make them. It's delicious."
  npc_override_rebel_in_quests_16_2_i_see_i_got_so_1e11d1: "I see! I got it! So you won't commit a suicide if I bring the fuel?"
  npc_override_rebel_in_quests_16_2_i_see_if_you_busy_74e0ca: "I see... If you are busy, we shouldn't bother you."
  npc_override_rebel_in_quests_16_2_i_see_please_come_back_1b77eb: "I see... Please come back if you remember it later on. I will be waiting for you. Bye... then."
  npc_override_rebel_in_quests_16_2_i_see_please_stop_fighti_0de1a7: "I see. Please stop fighting. I will bring them. 10 Burnt Tree and three coal. Right?"
  npc_override_rebel_in_quests_16_2_i_see_result_steady_trai_b60975: "I can see the result of steady training."
  npc_override_rebel_in_quests_16_2_i_see_s_your_business_32973c: "I see. But it's your business and I don't get why we should help you. Do I?"
  npc_override_rebel_in_quests_16_2_i_see_what_did_she_3059a3: "I see. What did she say?"
  npc_override_rebel_in_quests_16_2_i_see_you_later_34e403: "I will see you later."
  npc_override_rebel_in_quests_16_2_i_see_you_tomorrow_977d03: "I will see you tomorrow."
  npc_override_rebel_in_quests_16_2_i_seen_you_talking_kid_bfb6cb: "I have seen you talking to that kid lately. Do you care about her?"
  npc_override_rebel_in_quests_16_2_i_sell_electric_heaters_83edfc: "I will sell electric heaters to the people of Moroc. And I will sell refrigerators in Manuc!"
  npc_override_rebel_in_quests_16_2_i_several_things_prepare_7141ea: "I have several things to prepare. I believe you also need some time to get ready before departing, don't you?"
