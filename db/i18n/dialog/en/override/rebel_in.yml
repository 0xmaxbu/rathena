  npc_override_rebel_in_quests_16_2_we_get_rid_them_b98fbb: "We get rid of them!"
  npc_override_rebel_in_quests_16_2_we_give_you_information_63e6d9: "We give you the information and discharge surveillance and legal restriction on the facility."
  npc_override_rebel_in_quests_16_2_we_give_you_some_more_0e6eda: "We will give you some more. Make sure you bring them to those five people please."
  npc_override_rebel_in_quests_16_2_we_go_somewhere_deep_ins_0b3270: "We have go somewhere deep inside the village. From here on, just trust me and follow me. Since the path is a little complicated, I will leave ^0000cdtraces^000000. Make sure you catch them up."
