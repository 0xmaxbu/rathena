  npc_override_rebel_in_quests_16_2_we_don_t_want_talk_1b52a7: "We don't want to talk to you any more."
  npc_override_rebel_in_quests_16_2_we_don_t_want_talk_2f5e23: "We don't want to talk to you. Just leave."
  npc_override_rebel_in_quests_16_2_we_don_t_want_talk_bea70b: "We don't want to talk."
  npc_override_rebel_in_quests_16_2_we_estimate_one_who_took_0fb74d: "We estimate that the one who took it is a trustee of the enterprise. And the facility we have to investigate is the ^4d4dffabandoned factory area near Einbroch^000000."
