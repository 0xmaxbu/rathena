Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_override_rebel_in_quests_16_2_about_monster_central_ro_24b804: "About the monster in the central room"
  npc_override_rebel_in_quests_16_2_about_result_i_inform_yo_a4c01c: "About the result, I will inform you later!"
  npc_override_rebel_in_quests_16_2_about_time_year_when_min_056965: "And... About this time that year, it was when the mine was not closed yet. I heard a rumor that there were bad guys called rebel forces deep inside the mine."
  npc_override_rebel_in_quests_16_2_about_twins_our_unit_you_7d0167: "About the twins in our unit? You are an adventurer. Why do you ask me such a thing?"
  npc_override_rebel_in_quests_16_2_accept_3e1999: "Accept."
  npc_override_rebel_in_quests_16_2_according_government_sch_4621f5: "According to the government of Schwaltzvalt, the use of teleport in the village is prohibited to prevent the overuse of magic. But it's just nonsense."
  npc_override_rebel_in_quests_16_2_according_nihil_person_b_05c4ff: "According to Nihil, the person behind the chamberlain is likely to be in Lighthalzen."
  npc_override_rebel_in_quests_16_2_according_our_agent_reke_1860a5: "According to our agent, Rekenber and the government are serious now."
  npc_override_rebel_in_quests_16_2_according_regulation_we_e2da5b: "According to the regulation, we have to discharge them."
  npc_override_rebel_in_quests_16_2_actually_i_military_grou_d56c09: "Actually, I have a military group in mind to work with us. I'm sure you know them."
  npc_override_rebel_in_quests_16_2_actually_s_something_we_415ff6: "Actually, it's something we had never thought of ..."
  npc_override_rebel_in_quests_16_2_actually_there_another_t_90a5b1: "Actually, there is another task that Spica gave Crux during the banquet."
  npc_override_rebel_in_quests_16_2_actually_there_much_said_5e2874: "Actually, there is much to be said by the esteemed daughter of Nerius."
  npc_override_rebel_in_quests_16_2_actually_they_more_like_2adeed: "Actually ... they are more like monsters."
  npc_override_rebel_in_quests_16_2_addition_real_master_mus_b9064a: "In addition to that, The real master must check it with eyes and ears as well."
  npc_override_rebel_in_quests_16_2_adventure_busy_you_shoul_515c35: "The adventure is busy! You shouldn't be asking such a thing!"
  npc_override_rebel_in_quests_16_2_adventurer_2439c4: "Adventurer?"
  npc_override_rebel_in_quests_16_2_adventurer_almighty_cab60b: "Adventurer is not almighty."
  npc_override_rebel_in_quests_16_2_adventurer_approved_roya_9ee6e6: "The adventurer approved by the royal family of Rune Midgarts is together with us in this mission."
  npc_override_rebel_in_quests_16_2_adventurer_aren_t_isn_t_7cc91b: "Adventurer~ Aren't isn't it cold now?"
  npc_override_rebel_in_quests_16_2_adventurer_busy_9604b0: "The adventurer is busy."
  npc_override_rebel_in_quests_16_2_adventurer_busy_now_what_accf69: "The adventurer is busy now. What are you talking about?"
  npc_override_rebel_in_quests_16_2_adventurer_could_you_ple_db0b26: "Adventurer, could you please ask Jana?"
  npc_override_rebel_in_quests_16_2_adventurer_did_you_rest_a2a9f7: "Adventurer, did you rest well? I rested well after completing the repair. I know you are not curious about it, but I'm telling you before you ask me."
  npc_override_rebel_in_quests_16_2_adventurer_don_t_worry_a_5fd2d8: "Adventurer, don't worry about Cyon. I will take care of this fellow."
  npc_override_rebel_in_quests_16_2_adventurer_good_luck_i_t_043193: "Adventurer, good luck! I will be talking to Rookie. Cheer up."
  npc_override_rebel_in_quests_16_2_adventurer_here_65727c: "The adventurer is here?"
  npc_override_rebel_in_quests_16_2_adventurer_how_you_met_a_ebb2e7: "Adventurer! How was it? You met all of them and persuaded them? Not yet? I guess not. If you go to the 2nd floor, you can meet all of them."
  npc_override_rebel_in_quests_16_2_adventurer_how_your_busi_93e3d0: "Adventurer, how was your business? Lazy told me that I could fully trust you."
  npc_override_rebel_in_quests_16_2_adventurer_i_don_t_know_dd7931: "Adventurer, I don't know whether it is true or not. But would you mind bringing them for us?"
  npc_override_rebel_in_quests_16_2_adventurer_i_need_long_t_3e83b0: "Adventurer, I need to have a long talk from now on. So I'm counting on you. When you go there, don't forget to use that place. I mean 'that place'."
  npc_override_rebel_in_quests_16_2_adventurer_i_told_you_ta_d1be32: "Adventurer? I told you to take a good rest. Didn't I?"
  npc_override_rebel_in_quests_16_2_adventurer_please_go_the_6821a2: "Adventurer, please go there first."
  npc_override_rebel_in_quests_16_2_adventurer_please_search_f053ae: "Adventurer, please search ^4d4dffthe north and northeast area^000000."
  npc_override_rebel_in_quests_16_2_adventurer_please_take_c_df8b96: "Adventurer, please take care of the north and northeast areas."
  npc_override_rebel_in_quests_16_2_adventurer_please_take_g_887002: "Adventurer, please take a good rest today. You must take of yourself."
  npc_override_rebel_in_quests_16_2_adventurer_s_time_you_ta_41c3c4: "Adventurer, it's time for you to take an action. Please persuade them."
  npc_override_rebel_in_quests_16_2_adventurer_seems_like_yo_8cb134: "Adventurer, seems like you gave so much effort!"
  npc_override_rebel_in_quests_16_2_adventurer_try_heal_man_d2a5e9: "Adventurer, try to heal this man. Although he has an injury, it's not so serious. Since he's collapsed due to an exhaustion, he'll probably recover himself by a simple treatment. Once he wakes up, I will take all the information from him."
  npc_override_rebel_in_quests_16_2_adventurer_you_brought_t_f5c56b: "Adventurer! Have you brought them all? Let me see."
  npc_override_rebel_in_quests_16_2_adventurer_you_know_how_25b08e: "Adventurer, you know how to take shortcuts. I like it."
  npc_override_rebel_in_quests_16_2_adventurer_you_must_tire_3ae0d4: "Adventurer, you must be tired today. Take a rest and come back after the ^0000cddawn^000000 tomorrow."
  npc_override_rebel_in_quests_16_2_adventurer_you_symbol_fa_7253e5: "Adventurer. You are a symbol of faith. Please go and show them your faith. That will take care of everything. Did you see what I did a moment ago? Do as I did."
  npc_override_rebel_in_quests_16_2_advice_repairing_weapons_53703a: "An advice for repairing weapons? Well, but you are not a Blacksmith, are you?"
  npc_override_rebel_in_quests_16_2_after_all_he_been_burden_06e1f9: "After all, he would have been a burden to us even if we kept him."
  npc_override_rebel_in_quests_16_2_after_all_i_hope_you_428dfe: "After all, I hope you will find what you are looking for as soon as possible."
  npc_override_rebel_in_quests_16_2_after_all_she_put_me_142a35: "After all, she put me in this position as her substitute and is doing what she has to do."
  npc_override_rebel_in_quests_16_2_after_all_what_we_need_6e8c1f: "After all, what we need is an investigation of the ^4d4dfffacility^000000."
  npc_override_rebel_in_quests_16_2_after_being_deployed_act_a2c08f: "After being deployed in the actual battle, they made trouble and run away. I don't know why they call them genius. Someone like me can be called genius."
  npc_override_rebel_in_quests_16_2_after_betraying_rival_sa_de7ade: "After betraying a rival in the same field, I got the secret method of upgrading. Since then, I have been working in the shadows like this ... Oh, forget it. This is not a pleasant story."
  npc_override_rebel_in_quests_16_2_after_finding_researcher_e25e22: "After finding researchers, please hand them over to a Rebellion squad member near you."
  npc_override_rebel_in_quests_16_2_after_incident_they_neve_dc3634: "After that incident, they never came. Just by hearing the stories about them, I don't feel like they are the same kids I used to know."
  npc_override_rebel_in_quests_16_2_after_jana_had_such_hard_3b8418: "After that. Jana had such a hard time."
  npc_override_rebel_in_quests_16_2_after_listening_what_you_9b0b06: "After listening to what you said, I don't fully trust you. But I feel like having to trust you."
  npc_override_rebel_in_quests_16_2_after_mercenary_rebellio_6152cb: "After the Mercenary Rebellion, those who opposed the Enterprise allied and established the Rebellion."
  npc_override_rebel_in_quests_16_2_after_they_moved_usu_bec_55bb61: "After that, they were moved to USU, became more educated, etc. There was a fuss."
  npc_override_rebel_in_quests_16_2_after_waiting_while_you_d669d1: "After waiting for a while, you reclaimed the Anchovy cookies."
  npc_override_rebel_in_quests_16_2_after_working_hard_all_d_f05d50: "After working hard all day long, I enjoy watching the railway and smoking a cigarette. That's the pleasure of my life."
  npc_override_rebel_in_quests_16_2_again_8c0021: "Not again!!!"
  npc_override_rebel_in_quests_16_2_again_if_you_broke_your_c7f33d: "Again? If you broke your weapon and are pretending that you lost it, don't even think about it."
  npc_override_rebel_in_quests_16_2_agenda_robe_fd38a1: "Agenda Robe"
  npc_override_rebel_in_quests_16_2_agent_named_lazy_waiting_59da24: "An agent named ^4d4dffLazy^000000 will be waiting for you at the ^4d4dffEinbroch train station^000000."
  npc_override_rebel_in_quests_16_2_agent_named_lazy_waiting_d4fd9c: "An agent named ^4d4dffLazy^000000 is waiting for us."
  npc_override_rebel_in_quests_16_2_agent_named_lazy_waiting_e8821e: "An agent named Lazy is waiting for you."
  npc_override_rebel_in_quests_16_2_agree_what_7dd4ba: "Agree with what?"
  npc_override_rebel_in_quests_16_2_ah_2d0cf1: "Ah~"
  npc_override_rebel_in_quests_16_2_ah_8b44c1: "Ah.. that is...."
  npc_override_rebel_in_quests_16_2_ah_cf07cb: "Ah!"
  npc_override_rebel_in_quests_16_2_ah_don_t_misunderstand_i_329d0a: "Ah, don't misunderstand it. I'm not saying I will fight you. I'm saying that I will be on your side."
  npc_override_rebel_in_quests_16_2_ah_enough_quantity_adven_a71e56: "Ah!!!! Not enough quantity!!! Adventurer, I thank you for helping us. But this is not enough!"
  npc_override_rebel_in_quests_16_2_ah_hero_8bc1cd: "Ah ... Hero."
  npc_override_rebel_in_quests_16_2_ah_i_hate_cleaning_why_1f4b09: "Ah, I hate cleaning. Why don't they develop a machine that does the cleaning automatically?"
  npc_override_rebel_in_quests_16_2_ah_i_m_so_hungry_41b215: "Ah, I'm so hungry. Nothing happened during my patrol today."
  npc_override_rebel_in_quests_16_2_ah_i_see_6994e3: "Ah! I see."
  npc_override_rebel_in_quests_16_2_ah_ilya_person_keeps_irr_f712a8: "Ah, Ilya. That person keeps irritating me."
  npc_override_rebel_in_quests_16_2_ah_my_heart_beating_fast_5854f4: "Ah! My heart is beating fast again!"
  npc_override_rebel_in_quests_16_2_ah_rupert_655dd8: "Ah!! Rupert!"
  npc_override_rebel_in_quests_16_2_ah_sir_s_what_i_7810e3: "Ah! Sir, that's not what I am talking about.. You briefly reported to the Rebellion leader regarding what you did with Vero."
  npc_override_rebel_in_quests_16_2_ah_yes_we_closed_today_734948: "Ah.. Yes. We are closed today. Please visit us later."
  npc_override_rebel_in_quests_16_2_ah_you_arrived_8a6757: "Ah, have you arrived?"
  npc_override_rebel_in_quests_16_2_aha_you_advanturer_950321: "Aha, you are an advanturer."
  npc_override_rebel_in_quests_16_2_ahaha_i_ve_got_disease_1fc043: "Ahaha. I've got a disease that I can't sit down. By the way... As a guest, I couldn't come here with empty hands. This is a specialty good of Yuno... Please have some."
  npc_override_rebel_in_quests_16_2_ahem_ahem_e279a7: "Ahem, ahem."
  npc_override_rebel_in_quests_16_2_aigu_hehe_aigu_everyone_e03122: "Aigu? Hehe. Aigu is everyone's idol."
  npc_override_rebel_in_quests_16_2_all_because_air_here_ed41e3: "This all is because of the air here!"
  npc_override_rebel_in_quests_16_2_all_i_get_around_place_6b7980: "All I can get around this place are butter with an unpleasant smell and withered herbs. I can't make anything nice with them."
  npc_override_rebel_in_quests_16_2_all_i_tell_you_e66202: "This is all I can tell you."
  npc_override_rebel_in_quests_16_2_all_sudden_maybe_now_219fd3: "All of a sudden? Maybe not now..."
  npc_override_rebel_in_quests_16_2_all_sudden_well_i_always_94005e: "All of a sudden? Well, I always like working."
  npc_override_rebel_in_quests_16_2_all_us_also_eager_prepar_35afc2: "All of us are also eager and preparing many things. We should not disappoint that person~"
  npc_override_rebel_in_quests_16_2_all_we_hope_now_peter_f006c3: "All we hope now is for Peter, who is in the hospital, to wake up."
  npc_override_rebel_in_quests_16_2_all_we_insert_star_crumb_bcaeb7: "All we have to do is to insert the Star Crumb. So once you bring it, we can leave right away."
  npc_override_rebel_in_quests_16_2_alright_17187c: "Alright."
  npc_override_rebel_in_quests_16_2_alt_older_brother_c19146: "Alt has an older brother."
  npc_override_rebel_in_quests_16_2_although_committed_enter_cd5612: "... Although it was committed by the enterprise, we cannot deny that it happened in our country. So we have to take some responsibility."
  npc_override_rebel_in_quests_16_2_although_fritz_i_involve_6968f2: "Although Fritz and I were involved, Nihil did quite a good job in terms of domestic affairs."
  npc_override_rebel_in_quests_16_2_although_he_any_talent_c_b95544: "Although he does not have any talent in commerce, he is misunderstanding something by chance. Now he is so excited and has too many irons in the fire."
  npc_override_rebel_in_quests_16_2_although_he_sent_you_her_0c4108: "Although he sent you here, you cannot enter."
  npc_override_rebel_in_quests_16_2_although_i_bring_these_v_25af77: "Although I bring these to the village bench or plaza, none of the villagers take the leaflet."
  npc_override_rebel_in_quests_16_2_although_i_cannot_give_y_4a8bdc: "Although I cannot give you money, let me give you this."
  npc_override_rebel_in_quests_16_2_although_i_cannot_help_y_e92886: "... Although I cannot help you physically,"
  npc_override_rebel_in_quests_16_2_although_i_leashed_them_4fd96e: "Although I leashed them, they keep thinking about running out ..."
  npc_override_rebel_in_quests_16_2_although_i_m_expert_yet_5c2e2a: "Although I'm not an expert yet, I would like to solve the problems without worrying the Master or squadders."
  npc_override_rebel_in_quests_16_2_although_mission_started_976723: "Although the mission started unusually, it is surely a remarkable achievement."
  npc_override_rebel_in_quests_16_2_although_my_private_requ_919163: "Although it is my private request, I wish you could do it for me."
  npc_override_rebel_in_quests_16_2_although_s_long_story_te_112c23: "Although it's a long story to tell a stranger, I will tell you. And you've been sent by Mr. Adler.."
  npc_override_rebel_in_quests_16_2_although_s_my_guess_i_99bfbe: "Although it's my guess, I'm quite sure of it."
  npc_override_rebel_in_quests_16_2_although_s_only_small_nu_77185a: "Although it's only a small number, there are agents who are working on information warfare."
  npc_override_rebel_in_quests_16_2_although_there_been_mino_daf08f: "Although there has been a minor incident, now we have two more prohibition equipment devices to destroy."
  npc_override_rebel_in_quests_16_2_although_there_dust_your_a76156: "Although there is dust on your shoes, your gun must always be shiny... That's what they call 'hard-boiled'!"
  npc_override_rebel_in_quests_16_2_although_they_all_novice_0b8e8b: "Although they are all novices, they can be an obstacle for us in defeating the Secret Wings."
  npc_override_rebel_in_quests_16_2_although_they_come_here_9bb69e: "Although they have come here with a fishy purpose, it's true that they carried injured Gonie all the way here. Behave yourself, old men."
  npc_override_rebel_in_quests_16_2_although_they_quite_frig_2121be: "Although they are quite frightening... they are all good people."
  npc_override_rebel_in_quests_16_2_although_they_said_accid_a07e5a: "Although they said it was an accident, there was a rumor."
  npc_override_rebel_in_quests_16_2_although_they_young_thei_b02383: "Although they are young, their ability is outstanding. The problem is that they are out of control."
  npc_override_rebel_in_quests_16_2_although_time_passes_doe_04a056: "Although the time passes, it doesn't mean that the past goes away!"
  npc_override_rebel_in_quests_16_2_although_we_destroyed_eq_582050: "Although we destroyed the equipment, there is some magic power remaining. Therefore, teleporting will not be possible in this area for a while."
  npc_override_rebel_in_quests_16_2_although_we_kill_them_mo_213d82: "Although we kill them, more of them come out from somewhere. I came out rest for a while."
  npc_override_rebel_in_quests_16_2_although_we_let_them_wha_5b7927: "Although we let them do whatever they want outside, we teach them who's holding their lead."
  npc_override_rebel_in_quests_16_2_although_you_didn_t_come_45bc1c: "Although you didn't have to come here, you took the trouble. I mean... Thanks."
  npc_override_rebel_in_quests_16_2_although_you_my_sister_i_f61f44: "Although you are my sister, I will never accept this!"
  npc_override_rebel_in_quests_16_2_although_you_talk_him_he_9a5465: "Although you talk to him, he would not listen at all."
  npc_override_rebel_in_quests_16_2_always_99cf84: "Not always ..."
  npc_override_rebel_in_quests_16_2_any_case_fireplace_bless_15ea6b: "In any case, that fireplace is a blessing that grants us so many things. But the fire is about to go out due to the lack of firewood."
  npc_override_rebel_in_quests_16_2_any_case_i_try_best_e8bfc8: "In any case, I will try to do the best in my position."
  npc_override_rebel_in_quests_16_2_any_case_we_destroy_all_6860f0: "In any case, we will destroy all the 'Teleport prohibition equipment' installed in Schwaltzvalt."
  npc_override_rebel_in_quests_16_2_any_who_reads_definitely_64850e: "Any who reads this will definitely come to this store and buy 81mm mortar."
  npc_override_rebel_in_quests_16_2_anyhow_he_must_1308d9: "... Anyhow ... He must have."
  npc_override_rebel_in_quests_16_2_anyhow_thank_you_your_su_6fbf4b: "Anyhow, thank you for your support."
  npc_override_rebel_in_quests_16_2_anyone_else_oh_next_one_effe07: "Anyone else...? Oh, the next one is the good-hearted ^0000cdold women, I mean ladies^000000. Then you meet the Special Force commander ^0000cdErst^000000..."
  npc_override_rebel_in_quests_16_2_anyway_government_overlo_dab7a4: "Anyway, the government was overlooking the remnants for various reasons. I'm sure the government is still uncomfortable about it."
  npc_override_rebel_in_quests_16_2_anyway_i_count_you_go_f7be78: "Anyway, I will count on you. ^0000cdGo down from Einbech and find Suspicious Heap of Earth^000000 and investigate it. Then ^0000cdbring about three broken guns^000000 please."
  npc_override_rebel_in_quests_16_2_anyway_i_like_adventurer_f14b22: "Anyway, I like the adventurer! I won't let the adventurer go! Never!"
  npc_override_rebel_in_quests_16_2_anyway_i_ll_give_you_02a0bb: "Anyway, I'll give you the Anchovy cookies again. Please keep them safe. This time, you return with Charity and Anchovy cookies!"
  npc_override_rebel_in_quests_16_2_anyway_if_you_bunch_toke_4b530b: "Anyway, if you have bunch of tokens and do not just throw them away, visit me. We can make a good trade."
  npc_override_rebel_in_quests_16_2_anyway_let_s_get_here_502a3b: "Anyway, let's get in here."
  npc_override_rebel_in_quests_16_2_anyway_let_s_see_if_e42b1c: "Anyway, let's see if that guy shows up again."
  npc_override_rebel_in_quests_16_2_anyway_our_agent_einbech_901d9b: "Anyway, our agent in Einbech reported that a suspicious device showed up at the end of a freight train and disappeared quickly. The problem is.."
  npc_override_rebel_in_quests_16_2_anyway_take_care_yoursel_7f5df6: "Anyway, take care of yourself."
  npc_override_rebel_in_quests_16_2_anyway_we_think_about_me_3ef0c5: "Anyway, we will think about the method on our way there. You Just trust me and follow me. Nothing is impossible as long as you trust me. You can trust me in any situation."
  npc_override_rebel_in_quests_16_2_anyway_you_did_great_job_344261: "... Anyway, you did a great job."
  npc_override_rebel_in_quests_16_2_anyways_we_observe_centr_725906: "Anyways, We have to observe the central room's core."
  npc_override_rebel_in_quests_16_2_apart_fighting_i_like_as_4a95aa: "Apart from fighting... I would like to ask you for a favor."
  npc_override_rebel_in_quests_16_2_apart_materials_60aded: "Apart from the materials..."
  npc_override_rebel_in_quests_16_2_apparently_you_did_defea_5ac626: "Apparently, you did not defeat ^0000cd10 Waste Stoves^000000. I cannot smell the iron."
  npc_override_rebel_in_quests_16_2_appointed_place_einbroch_b8e118: "The appointed place is ^4d4dffEinbroch train station^000000."
  npc_override_rebel_in_quests_16_2_aren_t_you_adventurer_b2bfd2: "Aren't you an adventurer?"
  npc_override_rebel_in_quests_16_2_aren_t_you_fd7cdc: "Aren't you?"
  npc_override_rebel_in_quests_16_2_aren_t_you_going_fight_7ac454: "Aren't you going to fight me?"
  npc_override_rebel_in_quests_16_2_arivero_yurhik_as_you_sa_02081b: "Arivero Yurhik.. As you said, that Gunslinger's surname seems to be same with that of Noa here."
  npc_override_rebel_in_quests_16_2_arrggh_e7f002: "Arrggh!!!"
  npc_override_rebel_in_quests_16_2_arrgh_00f2eb: "Arrgh!!!!"
  npc_override_rebel_in_quests_16_2_arrgh_8fd5ab: "Arrgh..."
  npc_override_rebel_in_quests_16_2_arrgh_charity_i_hope_the_a6c352: "Arrgh... Charity... I hope they write on my tombstone that I died while missing Charity so much..."
  npc_override_rebel_in_quests_16_2_arrgh_yeah_f694ad: "Arrgh, yeah!!"
  npc_override_rebel_in_quests_16_2_arrrgh_especially_ms_ele_e1f05c: "Arrrgh, especially Ms. Elena ... She makes us suffer ..."
  npc_override_rebel_in_quests_16_2_arrrgh_kid_67c6b8: "Arrrgh... That kid?"
  npc_override_rebel_in_quests_16_2_as_commander_volkova_sai_1ae9d4: "As commander Volkova said, I brought those kids."
  npc_override_rebel_in_quests_16_2_as_everyone_already_disa_d10620: "As everyone was already disappointed at us, we thought we could do whetever..."
