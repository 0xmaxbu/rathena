  npc_override_rebel_in_quests_16_2_as_you_wish_dafe43: "As you wish."
  npc_override_rebel_in_quests_16_2_ask_him_again_ed22df: "Ask him again."
  npc_override_rebel_in_quests_16_2_ask_them_about_incident_1ea957: "(Ask them about the incident that happened in the past...)"
  npc_override_rebel_in_quests_16_2_ask_them_directly_df4a1c: "Ask them directly."
  npc_override_rebel_in_quests_16_2_ask_them_if_they_know_1d6cf4: "Ask them if they know that happened on that day. I bet nobody does. Unless we talk about it, how can anyone ever find it out?"
