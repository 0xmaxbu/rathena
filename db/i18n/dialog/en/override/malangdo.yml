Body:
  npc_override_malangdo_malangdo_actually_let_me_tell_you_8ae859: "Actually, let me tell you rule 53. I am an indulgent cat."
  npc_override_malangdo_malangdo_actually_s_simple_you_ju_fd26e3: "Actually, it's simple. You just..."
  npc_override_malangdo_malangdo_admiral_tomas_said_kidna_d088b0: "^9E1837Admiral Tomas^000000 said to kidnap humans... No... Bring them politely?"
  npc_override_malangdo_malangdo_again_if_you_want_go_c7e5ee: "Again, if you want to go back to ^A2314BMalangdo^000000, do you know where to take a ship at Izlude or Alberta?"
  npc_override_malangdo_malangdo_ah_i_just_want_make_05a213: "Ah! I just want to make sure..."
  npc_override_malangdo_malangdo_ah_you_legendary_hero_ou_a9146c: "Ah... You are the legendary hero of our cat's fleet."
  npc_override_malangdo_malangdo_ain_t_no_charity_bc574f: "This ain't no charity."
  npc_override_malangdo_malangdo_all_malangdo_cats_mine_b13de6: "All the Malangdo cats are mine~!"
  npc_override_malangdo_malangdo_alright_let_s_go_heaven_deff38: "Alright. Let's go to the heaven of the cats, ^A2314BMalangdo^000000~"
  npc_override_malangdo_malangdo_anyway_i_got_you_just_2295cd: "Anyway, I got you. Just tell me whenever you want to go."
  npc_override_malangdo_malangdo_anyway_i_got_you_wheneve_7dd099: "Anyway, I got you. Whenever you want to go, just tell me."
  npc_override_malangdo_malangdo_as_you_hero_cat_fleet_3c088c: "As you are a hero of the cat fleet let me send you to ^A2314BMalangdo^000000 for free."
  npc_override_malangdo_malangdo_boy_lazy_cat_makes_me_d823f8: "Boy, that lazy cat makes me want to just nap all day long."
  npc_override_malangdo_malangdo_cats_living_here_so_ener_a4cede: "The cats living in here are so energetic."
  npc_override_malangdo_malangdo_comfortable_trip_604e9d: "Have a comfortable trip."
  npc_override_malangdo_malangdo_comfortable_trip_alright_98b988: "Have a comfortable trip... Alright let's go~"
  npc_override_malangdo_malangdo_did_you_fun_malangdo_c8911d: "Did you have fun in Malangdo?"
  npc_override_malangdo_malangdo_dolangmal_proceeds_gives_388ecd: "Dolangmal proceeds and gives hundreds of warnings."
  npc_override_malangdo_malangdo_don_t_forget_give_him_102a16: "Don't forget to give him notice of your arrival."
  npc_override_malangdo_malangdo_eh_17ae65: "Eh?"
  npc_override_malangdo_malangdo_enough_silvervine_fruit_07a7a6: "With enough ^FF0000Silvervine Fruit^000000 I can be a queen in Malangdo~ ohhhh!!!"
  npc_override_malangdo_malangdo_fee_ship_only_zeny_where_9876db: "The fee of ship is only 1000 zeny, where do you want to go?"
  npc_override_malangdo_malangdo_first_natural_when_you_a_28616a: "First!! It is natural that when you arrive on ^A2314BMalangdo^000000, you should notify ^9E1837Admiral Tomas^000000 that you are here."
  npc_override_malangdo_malangdo_fleet_service_izlude_alb_0dde63: "The fleet has a service to Izlude and Alberta."
  npc_override_malangdo_malangdo_fresh_air_payon_bad_why_8df929: "The fresh air of Payon is not bad, but why don't you go better place like the heaven of the cats, ^A2314BMalangdo^000000?"
  npc_override_malangdo_malangdo_he_makes_life_look_so_6929ac: "He makes life look so simple."
  npc_override_malangdo_malangdo_hey_hi_human_mr_dolangma_87b8d5: "Hey~! Hi human~ This is Mr. Dolangmal. kakaka~"
  npc_override_malangdo_malangdo_hey_you_almost_made_me_82d2ff: "Hey, you almost made me tell my secret."
  npc_override_malangdo_malangdo_hm_you_might_know_becaus_d17f59: "Hm~ You might know because you're a smart person. Well, see you again~"
  npc_override_malangdo_malangdo_hmm_i_guess_s_no_ff9658: "Hmm, I guess it's no wonder you don't know."
  npc_override_malangdo_malangdo_how_crowded_city_pronter_088281: "How is that? The crowded city of Prontera is good, but why don't you go our heaven of the cats, ^A2314BMalangdo^000000?"
  npc_override_malangdo_malangdo_how_you_liked_i_knew_0df78c: "How was it? You liked it? I knew it. Kakaka~"
  npc_override_malangdo_malangdo_i_barely_get_8ec6e8: "I can barely get it."
  npc_override_malangdo_malangdo_i_king_malangdo_ohhh_da3be2: "I can be a king in Malangdo~ ohhh~!"
  npc_override_malangdo_malangdo_i_really_want_send_you_196357: "I really want to send you there, but I can't because of the policy. It is difficult to send people who have visited ^A2314BMalangdo^000000 already."
  npc_override_malangdo_malangdo_i_t_stand_heaven_f1a3a3: "I can't stand it, this is heaven~~!!"
  npc_override_malangdo_malangdo_i_wouldn_t_even_tell_90358b: "I wouldn't even tell you for all the zeny in the world~!"
  npc_override_malangdo_malangdo_if_you_don_t_you_258d93: "If you don't do that, you might be attacked by scary and wild cats when you walk through dark streets."
  npc_override_malangdo_malangdo_if_you_enjoy_pleasant_se_61fd09: "If you enjoy that pleasant sea trip, you will arrive at the heaven of cats, ^A2314BMalangdo^000000."
  npc_override_malangdo_malangdo_if_you_want_go_back_d0096f: "If you want to go back to ^A2314BMalangdo^000000, take the ship at Izlude or Alberta."
  npc_override_malangdo_malangdo_la_di_dah_di_dah_ff38d0: "La di dah di dah~!"
  npc_override_malangdo_malangdo_let_me_know_if_you_b01307: "Let me know if you want to relax."
  npc_override_malangdo_malangdo_let_me_send_you_right_09914b: "Let me send you right away. Let's go~"
  npc_override_malangdo_malangdo_location_saved_we_should_cacee0: "Location saved. We should keep company, haha~"
  npc_override_malangdo_malangdo_make_malangdo_cats_my_a919c9: "it to make the Malangdo cats my"
  npc_override_malangdo_malangdo_menu_here_41c0a9: "Here you go.:Never mind."
  npc_override_malangdo_malangdo_menu_let_112c95: "Let him sleep:Talk to him"
  npc_override_malangdo_malangdo_menu_no_032d44: "No:^A2314BMalangdo^000000~ Go~ Go~"
  npc_override_malangdo_malangdo_menu_remember_ffe54b: "Remember his warnings:Can't remember"
  npc_override_malangdo_malangdo_menu_send_f9dc8d: "Send me to Malangdo!:Do not go."
  npc_override_malangdo_malangdo_menu_take_c44bf2: "Take me to ^A2314BMalangdo^000000 again:I have visited"
  npc_override_malangdo_malangdo_menu_umm_47b33a: "Umm... Can I rest here?:Psst... Can I save here?:Leave."
  npc_override_malangdo_malangdo_meow_huh_5363dd: "Meow? Huh?"
  npc_override_malangdo_malangdo_money_where_money_you_t_66c211: "Money? Where is the money? You can't go anywhere without the money. Shame on you."
  npc_override_malangdo_malangdo_muahahahaha_5af18f: "Muahahahaha~"
  npc_override_malangdo_malangdo_my_hidden_card_silvervin_75a206: "My hidden card, ^FF0000Silvervine Fruit^000000, can make all cats in Malangdo my slaves~ haha!"
  npc_override_malangdo_malangdo_my_little_secret_called_662549: "This is my little secret called"
  npc_override_malangdo_malangdo_next_one_cf4563: "And the next one is..."
  npc_override_malangdo_malangdo_now_before_you_go_malang_f6982d: "Now, before you go ^A2314BMalangdo^000000, let me give you some warnings."
  npc_override_malangdo_malangdo_now_relax_201e8a: "Now relax."
  npc_override_malangdo_malangdo_ok_bite_two_mice_one_a6dddd: "Ok! Do not bite two mice with one mouth. ^9E1837Admiral Tomas^000000 is located at the ^A2314Bcenter of the ship in Malangdo^000000."
  npc_override_malangdo_malangdo_ok_i_like_your_attitude_967007: "Ok! I like your attitude. Full of passion."
  npc_override_malangdo_malangdo_ok_those_all_warnings_th_51a659: "Ok! Those are all the warnings!! They're easy and simple... right? Can you remember them?"
  npc_override_malangdo_malangdo_one_day_these_cats_mine_580b64: "One day these cats will be mine."
  npc_override_malangdo_malangdo_ooo_their_soft_puffy_tai_8c28eb: "Ooo~ their soft puffy tails and soft fur~"
  npc_override_malangdo_malangdo_roughly_s_supposed_rule_87c5b5: "And that was roughly it... It's supposed to be rule 53..."
  npc_override_malangdo_malangdo_s_too_rare_item_get_bd74ce: "But it's too rare of an item to get so you shouldn't bother trying to find it."
  npc_override_malangdo_malangdo_secondly_malangdo_absolu_b03434: "Secondly!! This ^A2314BMalangdo^000000 is absolutely our island of cats, even though we open to humans."
  npc_override_malangdo_malangdo_silvervine_fruit_048a45: "^FF0000Silvervine Fruit^000000?"
  npc_override_malangdo_malangdo_silvervine_fruit_i_use_67aba7: "^FF0000Silvervine Fruit^000000. I can use"
  npc_override_malangdo_malangdo_slaves_muahahahaha_301bd2: "slaves~ muahahahaha~!"
  npc_override_malangdo_malangdo_so_easy_isn_t_well_a27db8: "So easy! Isn't it? Well, good bye~"
  npc_override_malangdo_malangdo_sometimes_you_just_relax_be44f7: "Sometimes you just have to relax."
  npc_override_malangdo_malangdo_such_rare_item_7e72a9: "It is such a rare item!"
  npc_override_malangdo_malangdo_these_cudly_cats_t_resis_acd3ed: "But these cudly cats can't resist it~"
  npc_override_malangdo_malangdo_these_malangdo_cats_t_re_968cd1: "These Malangdo cats can't resist it."
  npc_override_malangdo_malangdo_uh_sure_you_use_hammock_bd7d1d: "Uh, sure you can use this hammock if you give me ^FF00005 Malangdo Cans^000000."
  npc_override_malangdo_malangdo_uh_you_must_one_last_2be20b: "Uh? You must be the one from last time...? Alright. Did you visit ^A2314BMalangdo^000000?"
  npc_override_malangdo_malangdo_we_personality_no_no_res_86a049: "We have a personality... no... no... respect us like one catality because we are cats."
  npc_override_malangdo_malangdo_we_sent_here_take_you_5025ab: "We are sent to here to take you to the heaven of cats, ^A2314BMalangdo^000000."
  npc_override_malangdo_malangdo_we_t_charge_hero_our_5035bc: "We can't charge the hero of our fleet. What is your destination?"
  npc_override_malangdo_malangdo_weird_they_make_me_want_f46972: "Is it weird that they make me want to dance all day?"
  npc_override_malangdo_malangdo_what_t_you_keep_these_7e6d46: "What!? Can't you keep these easy rules? Chet!"
  npc_override_malangdo_malangdo_what_you_don_t_want_fcc606: "What!? You don't want to go ^A2314BMalangdo^000000? Chet!"
  npc_override_malangdo_malangdo_where_i_get_silvervine_f_20e1a5: "Where can I get ^FF0000Silvervine Fruit^000000?"
  npc_override_malangdo_malangdo_why_don_t_you_go_7670ef: "Why don't you go to ^A2314BMalangdo^000000? That place is better than Geffen, where there are only crowds of simple honest wizards."
  npc_override_malangdo_malangdo_why_i_tell_you_when_81aa67: "Why would I tell you when I can barely get it?"
  npc_override_malangdo_malangdo_wow_laziest_cat_ever_47bfac: "- Wow, this is the laziest cat ever. -"
  npc_override_malangdo_malangdo_wow_you_contributed_our_3f12cd: "Wow~ You contributed to our fleet a lot. Alright!! Special discount price 500 zeny. Where do you want to go?"
  npc_override_malangdo_malangdo_you_connection_our_fleet_09e202: "You have a connection with our fleet. Apply special price 999 zeny. Where do you want to go?"
  npc_override_malangdo_malangdo_you_guess_innkeeper_737aff: "You guess that this is the Innkeeper."
  npc_override_malangdo_malangdo_you_hero_cat_s_fleet_ecd75f: "You are a hero of cat's fleet. Your activity is the legend between us."
  npc_override_malangdo_malangdo_you_re_such_annoying_guy_51f9c2: "You're such an annoying guy. If you can't keep these, why didn't you tell me during our conversation? I told you everything... but.."
  npc_override_malangdo_malangdo_you_re_such_annoying_guy_88ca0b: "You're such an annoying guy. If you don't go, why did you talk to me... but..."
  npc_override_malangdo_malangdo_you_see_lazy_cat_standin_2d282d: "You see a lazy cat standing on a chair."
