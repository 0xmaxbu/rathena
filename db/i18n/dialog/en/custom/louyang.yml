Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_custom_louyang_xmas_rings_event_christmas_karachun_new_y_273586: "^000080The Christmas^000000, ^FF0000Karachun^000000 and ^008000New Year Eve^000000!"
  npc_custom_louyang_xmas_rings_event_darn_how_could_poor_chil_b49a46: "Darn... How could poor children be more important than the marine folks.. Am I wrong?"
  npc_custom_louyang_xmas_rings_event_didn_t_you_know_santa_976e6d: "Didn't you know that Santa's Hat reveals the real power of the rings?"
  npc_custom_louyang_xmas_rings_event_errr_helloou_there_my_si_ef16e6: "Errr. Helloou there. My sister Sneewy's sent me a birdie message. The letter was wet and I couldn't read anything but some ending letters of her address..."
  npc_custom_louyang_xmas_rings_event_gimme_gifts_poor_kids_wa_205ac0: "Gimme 4 gifts for poor kids... Wait, you haven't got 4 of them!"
  npc_custom_louyang_xmas_rings_event_helloooou_you_know_my_br_e0efef: "Helloooou! Do you know my bro and sis? How so? My brother Snower's well known in Prontera!! Just ask any child there."
  npc_custom_louyang_xmas_rings_event_hi_i_m_waithing_my_f98f13: "Hi! I'm waithing for my sister's birdy with mail..."
  npc_custom_louyang_xmas_rings_event_hi_two_my_sisters_i_c424e4: "Hi! Two my sisters and I are preparing gifts for the whole 3 holidays!"
  npc_custom_louyang_xmas_rings_event_i_d_exchange_gold_magic_278ca3: "I'd exchange a GOLD magic ring for 3 gift boxes..."
  npc_custom_louyang_xmas_rings_event_i_don_t_see_any_ae912b: "I don't see any gifts in fancy boxes on you..."
  npc_custom_louyang_xmas_rings_event_i_ll_tell_you_secret_f5d034: "I'll tell you a secret of the magic rings."
  npc_custom_louyang_xmas_rings_event_i_too_need_more_gifts_82ffc1: "But I too need 3 more gifts for my marine folk friends..."
  npc_custom_louyang_xmas_rings_event_i_wish_i_had_more_8b5969: "I wish I had 4 more gray Gift Boxes for native children..."
  npc_custom_louyang_xmas_rings_event_i_wish_you_find_my_e5d96f: "I wish you find my sisters ASAP... They need help."
  npc_custom_louyang_xmas_rings_event_if_you_put_both_rings_2f19f3: "If you put on both rings their power would be doubled."
  npc_custom_louyang_xmas_rings_event_karachun_heh_old_pagans_e8db1b: "^FF0000Karachun^000000? Heh... This is an old pagans festival. They used to celebrate it before the appearance of HNY and XMas, you know."
  npc_custom_louyang_xmas_rings_event_look_s_something_like_ya_a0abcd: "Look, it's something like 'yang' in the very end... Hmm... She must be misspelled 'Al Doo Boryang'..."
  npc_custom_louyang_xmas_rings_event_my_elder_sis_her_name_52dfe3: "My elder sis? Her name's Snoowy. She's sailed to some green island... She's talking about some gifts for dolphins or something..."
  npc_custom_louyang_xmas_rings_event_my_sisters_say_all_gifts_e83b94: "My sisters say that all the gifts should look the same way. Or else some children might fight for fancy ones!"
  npc_custom_louyang_xmas_rings_event_my_younger_sis_sneewy_s_e1dab7: "My younger sis Sneewy's left to some faraway land to prepare gifts for their poor children... I don't know where. You should ask my elder sis and her birdies."
  npc_custom_louyang_xmas_rings_event_nice_day_56cb5d: "Have a nice day!"
  npc_custom_louyang_xmas_rings_event_oh_hello_my_brother_snow_3c28d1: "Oh, hello. Has my brother Snower told you everything?"
  npc_custom_louyang_xmas_rings_event_oh_true_you_ve_helped_0fd0a0: "Oh... is it true? You've helped my sis Sneewy? Thank you."
  npc_custom_louyang_xmas_rings_event_oh_whole_marine_folk_sen_896da5: "Oh... the whole marine folk send you their thanks! They love presents so much!!!"
  npc_custom_louyang_xmas_rings_event_oops_you_haven_t_got_42c652: "Oops!! You haven't got 3 gray gift boxes on you."
  npc_custom_louyang_xmas_rings_event_pity_i_ve_got_magic_5ca04a: "Pity... I've got a magic Santa's ring... I'd exchange it for 4 Gift Boxes..."
  npc_custom_louyang_xmas_rings_event_shuffle_here_you_go_d05a63: "*shuffle* Here you go."
  npc_custom_louyang_xmas_rings_event_snoowy_s_sent_me_bird_7d8f0d: "Snoowy's sent me a bird with a message. She told me about your help..."
  npc_custom_louyang_xmas_rings_event_thaank_yoouu_magic_ring_e7f978: "Thaank yoouu! Have this magic ring!"
  npc_custom_louyang_xmas_rings_event_thank_you_here_s_my_a0b4fa: "Thank you! Here's my li'l something for you!"
  npc_custom_louyang_xmas_rings_event_thanks_again_no_children_a88e5a: "Thanks again! No children will meet the holidays without the gifts!"
  npc_custom_louyang_xmas_rings_event_they_magic_power_only_de_4023b2: "They have magic power only from 8 December till 8 January."
  npc_custom_louyang_xmas_rings_event_way_if_you_put_different_a2ca32: "By the way, if you put on 2 different rings then your holidays leveling would be easier!"
  npc_custom_louyang_xmas_rings_event_way_just_put_santa_s_5fdf29: "By the way, just put on Santa's Hat to discover their true power."
  npc_custom_louyang_xmas_rings_event_whole_three_holidays_wel_05e965: "The whole three holidays? Well they come one after another!"
  npc_custom_louyang_xmas_rings_event_you_like_me_wrap_your_7cf19b: "Would you like me to wrap your fancy gift boxes with a gray paper?"
  npc_custom_louyang_xmas_rings_event_you_ve_got_only_gray_24adc6: "You've got only gray boxes."
  npc_custom_louyang_xmas_rings_event_you_ve_helped_my_sis_db2cb6: "You've helped my sis? It's just great!"
