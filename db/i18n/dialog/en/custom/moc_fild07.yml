  npc_custom_moc_fild07_sunglasses_as_you_wish_dafe43: "As you wish."
  npc_custom_moc_fild07_sunglasses_carat_diamond_b44610: " - ^0000881 Carat Diamond^000000"
  npc_custom_moc_fild07_sunglasses_come_back_me_than_you_7ed5fb: "Come back to me than you are ready."
  npc_custom_moc_fild07_sunglasses_come_back_me_when_you_9b55d6: "Come back to me when you have given up. Hahaha..."
  npc_custom_moc_fild07_sunglasses_enjoy_your_slotted_sungl_4d8814: "Enjoy your ^000088Slotted Sunglasses^000000."
  npc_custom_moc_fild07_sunglasses_feathers_a0e563: " - ^00008850 Feathers^000000"
  npc_custom_moc_fild07_sunglasses_go_see_maseph_she_somewh_9a4bfe: "Go see Maseph. She is somewhere north of Morocc."
  npc_custom_moc_fild07_sunglasses_great_now_listen_careful_46d3f0: "Great. Now, listen carefully."
  npc_custom_moc_fild07_sunglasses_hello_there_95e3ac: "Hello there."
  npc_custom_moc_fild07_sunglasses_hello_what_i_you_9589ce: "Hello. What can I do for you?"
  npc_custom_moc_fild07_sunglasses_here_you_go_my_friend_b8177c: "Here you go, my friend."
  npc_custom_moc_fild07_sunglasses_i_make_them_i_tell_ff3e85: "I do not make them, but I can tell you where to find the person who does. For a small fee..."
  npc_custom_moc_fild07_sunglasses_i_need_one_pair_sunglass_287ab6: "I need one pair of ^000088Sunglasses^000000. Come back to me when you have one."
  npc_custom_moc_fild07_sunglasses_i_send_her_message_let_ee93b7: "I will send her a message to let her know that you are coming."
  npc_custom_moc_fild07_sunglasses_look_someone_named_masep_cdc213: "Look for someone named Maseph somewhere north of Morocc."
  npc_custom_moc_fild07_sunglasses_lovely_day_isn_t_96c59d: "Lovely day, isn't it ?"
  npc_custom_moc_fild07_sunglasses_make_one_i_need_one_a2a13b: "To make one, I will need one pair of ^000088Sunglasses^000000 and 400000z."
  npc_custom_moc_fild07_sunglasses_menu_alright_685b1e: "Alright, here.:That's too much!"
  npc_custom_moc_fild07_sunglasses_menu_here_ee49c0: "Here you go.:No, thanks."
  npc_custom_moc_fild07_sunglasses_menu_how_1b0cfc: "How much?:No way, I will find her myself!"
  npc_custom_moc_fild07_sunglasses_menu_i_e4389a: "I heard that you can make ^0000FFSlotted Sunglasses^000000.:Nothing, sorry to bother you."
  npc_custom_moc_fild07_sunglasses_menu_in_1afdb7: "In order for me to tell you information on ^0000FFSlotted Sunglasses^000000 you need to get me:"
  npc_custom_moc_fild07_sunglasses_menu_yes_910210: "Yes:No, sorry to bother you."
  npc_custom_moc_fild07_sunglasses_off_you_go_then_1ad524: "Off you go, then."
  npc_custom_moc_fild07_sunglasses_only_i_tell_her_you_74dc97: "Only I can tell her you are coming."
  npc_custom_moc_fild07_sunglasses_suit_yourself_cc0945: "Suit yourself."
  npc_custom_moc_fild07_sunglasses_suit_yourself_maker_make_b856c9: "Suit yourself, the Maker will not make you ^0000FFSlotted Sunglasses^000000 unless she knows that you are coming."
  npc_custom_moc_fild07_sunglasses_thank_you_i_get_right_8ab39d: "Thank you. I will get on it right away..."
  npc_custom_moc_fild07_sunglasses_there_nothing_more_i_tel_88b26b: "There is nothing more I can tell you."
  npc_custom_moc_fild07_sunglasses_you_came_slotted_sunglas_65e983: "You came for the ^000088Slotted Sunglasses^000000, right?"
  npc_custom_moc_fild07_sunglasses_you_enough_zeny_come_bac_fa3513: "You do not have enough Zeny. Come back to me when you do."
  npc_custom_moc_fild07_sunglasses_you_re_missing_something_18e06e: "You're missing something. Come back when you've gathered all the materials."
  npc_custom_moc_fild07_sunglasses_z_392018: " - ^000088100000z^000000"
