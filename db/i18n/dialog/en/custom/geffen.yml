Body:
  npc_custom_geffen_elvenear_ah_elven_ears_quest_35cf8c: "Ah, the ^61B031Elven Ears ^000000Quest!"
  npc_custom_geffen_elvenear_animal_skin_3af867: "and ^362ED620 Animal Skin^000000"
  npc_custom_geffen_elvenear_aw_what_shame_11b37b: "Aw, what a shame"
  npc_custom_geffen_elvenear_elder_pixie_mustaches_ab2173: "^362ED620 Elder Pixie Mustaches^000000"
  npc_custom_geffen_elvenear_give_me_second_0f27ca: "Give me a second....."
  npc_custom_geffen_elvenear_giving_up_already_dc47e1: "Giving up already?"
  npc_custom_geffen_elvenear_good_good_let_me_just_045001: "Good good, let me just check"
  npc_custom_geffen_elvenear_hi_today_s_quest_fb0bb3: "Hi, today's quest is...."
  npc_custom_geffen_elvenear_kitty_band_dba7eb: "^362ED61 Kitty Band^000000"
  npc_custom_geffen_elvenear_maybe_another_time_e2bdb8: "Maybe another time?"
  npc_custom_geffen_elvenear_menu_ok_fd6b75: "Ok all you have to do is collect:"
  npc_custom_geffen_elvenear_oh_well_maybe_you_partic_f80b1f: "Oh well maybe you will participate in tomorrow's quest."
  npc_custom_geffen_elvenear_ok_done_2a8877: "Ok done!"
  npc_custom_geffen_elvenear_please_come_back_another_6a1c6f: "Please come back another time..."
  npc_custom_geffen_elvenear_when_you_done_bring_item_808e93: "When you are done, bring the items to me.  Ok good luck finding those items."
  npc_custom_geffen_elvenear_you_don_t_requirements_175446: "You don't have the requirements."
  npc_custom_geffen_kahohorn_enjoy_being_god_midgard_ac2117: "Enjoy being God of Midgard!"
  npc_custom_geffen_kahohorn_finally_i_ve_worked_hard_1e32d5: "Finally, I've worked hard to make these horns for my master with all the items mentioned above..."
  npc_custom_geffen_kahohorn_i_also_forgot_mention_th_a8d3a4: "I also forgot to mention these..."
  npc_custom_geffen_kahohorn_i_m_big_fan_dolls_c169ed: "I'm a big fan of dolls, so you need to bring me these cuties!"
  npc_custom_geffen_kahohorn_i_t_afford_make_if_dd7645: "I can't afford to make this if you don't bring all materials needed. Please understand this is to benefit heroes such as yourself!"
  npc_custom_geffen_kahohorn_i_worked_myself_death_tr_f51391: "I worked myself to death trying to fulfill Lord Kaho's ridiculous expectations for a headgear!"
  npc_custom_geffen_kahohorn_if_you_succeed_getting_t_05a88f: "If you succeed in getting these items, you will have incredible strength!"
  npc_custom_geffen_kahohorn_menu_sure_91470a: "Sure am!:These requirements are unfathomable!"
  npc_custom_geffen_kahohorn_menu_you_0f3c32: "You need the following to get the Kaho horns:"
  npc_custom_geffen_kahohorn_now_i_ve_finally_found_641b5f: "Now that I've finally found the formula for the perfect headgear, I'm willing to share my time and talents."
  npc_custom_geffen_kahohorn_oh_yeah_9dde5f: "Oh yeah..."
  npc_custom_geffen_kahohorn_please_include_million_z_f5bd9d: "Please include ^0055FF5 million Zeny^000000 for my efforts."
  npc_custom_geffen_kahohorn_we_re_done_yet_sweetie_49ae0e: "We're not done yet, sweetie..."
  npc_custom_geffen_kahohorn_what_i_had_go_through_5a986b: "What I had to go through was more unfathomable..."
  npc_custom_geffen_kahohorn_wow_you_brave_indeed_b0a2bf: "Wow! You are brave indeed!"
  npc_custom_geffen_kahohorn_x_695c35: "1x ^0055FF{0}^000000"
  npc_custom_geffen_kahohorn_x_d05fb7: "1x ^0055FF{0}^000000 (from {1})"
  npc_custom_geffen_kahohorn_x_emperium_6d4a4d: "3x ^0055FFEmperium^000000"
  npc_custom_geffen_kahohorn_you_ready_me_make_specia_5481f9: "Are you ready for me to make this special item?"
