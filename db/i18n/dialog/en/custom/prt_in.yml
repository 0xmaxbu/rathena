Body:
  npc_custom_prt_in_card_remover_alright_come_back_anytim_7b181a: "Alright. Come back anytime you need my services."
  npc_custom_prt_in_card_remover_alright_which_piece_equi_4f0629: "Alright. Which piece of equipment should I examine?"
  npc_custom_prt_in_card_remover_although_card_successful_392db7: "Although the card was successfully removed from the equipment, it was destroyed in the process. The equipment, however, is safe."
  npc_custom_prt_in_card_remover_card_s_socketed_spell_re_c4b230: " card(s) socketed. The spell requires "
  npc_custom_prt_in_card_remover_equipment_c7a0e3: "This equipment has "
  npc_custom_prt_in_card_remover_how_regrettable_card_suc_5f1228: "How regrettable. The card was successfully removed, but the equipment itself was destroyed."
  npc_custom_prt_in_card_remover_i_cannot_serve_you_8020e3: "I cannot serve you."
  npc_custom_prt_in_card_remover_i_charge_fixed_fee_aecd47: "I charge a fixed fee of "
  npc_custom_prt_in_card_remover_i_unable_remove_card_for_ec3d74: "I was unable to remove the card. Fortunately, both the equipment and the card are intact."
  npc_custom_prt_in_card_remover_kafra_storage_come_back_79749f: "in the Kafra Storage and come back~"
  npc_custom_prt_in_card_remover_menu_alright_fc02d7: "Alright, begin.:Never mind."
  npc_custom_prt_in_card_remover_menu_before_838bd2: "Before I begin, I must warn you — I may fail. If I fail, both the card and the equipment may be destroyed, and I will not refund you. So, which is more important to you: the card or the equipment?"
  npc_custom_prt_in_card_remover_menu_i_f97ac2: "I changed my mind.:Keep the equipment.:Keep the cards."
  npc_custom_prt_in_card_remover_menu_yes_ba3ff9: "Yes, please help.:How much does it cost?:No, thanks."
  npc_custom_prt_in_card_remover_nice_meet_you_young_one_ee5468: "It is nice to meet you, young one. I can remove cards from your equipment for you. Do you need my help?"
  npc_custom_prt_in_card_remover_please_store_your_excess_8a9ebc: "Please store your excess items"
  npc_custom_prt_in_card_remover_please_wait_moment_deaaec: "^3355FFPlease wait a moment!"
  npc_custom_prt_in_card_remover_spell_failed_utterly_i_a_b3c9af: "The spell has failed utterly. I am sorry, both the equipment and the cards have been destroyed."
  npc_custom_prt_in_card_remover_spell_success_here_your_a2f39b: "The spell was a success. Here are your cards and equipment, please take care. Farewell."
  npc_custom_prt_in_card_remover_very_well_i_shall_begin_3288c4: "Very well, I shall begin the spell."
  npc_custom_prt_in_card_remover_you_carrying_too_many_th_ff0730: "You are carrying too many things,"
  npc_custom_prt_in_card_remover_you_lack_items_required_9db404: "You lack the items required for the spell, child. Come back when you have gathered them."
  npc_custom_prt_in_card_remover_young_one_there_no_cards_6c2f65: "Young one... there are no cards socketed into this equipment. I'm afraid I cannot help you."
  npc_custom_prt_in_card_remover_young_one_you_nothing_eq_2ac25f: "Young one... you have nothing equipped in that slot that I can remove cards from."
  npc_custom_prt_in_card_remover_zeny_one_star_crumb_one_e4f7e8: " Zeny, one ^0000FFStar Crumb^000000 and one ^0000FFYellow Gemstone^000000."
  npc_custom_prt_in_card_remover_zeny_per_card_addition_i_4a52c4: " Zeny per card. In addition, I require one Star Crumb and one Yellow Gemstone to cast the spell."
  npc_custom_prt_in_card_remover_zeny_plus_1b70ad: " Zeny, plus "
  npc_custom_prt_in_item_signer_although_i_work_free_34869d: "Although I can work for free, but..."
  npc_custom_prt_in_item_signer_as_i_said_i_sign_99bbf2: "As I said, I do not sign equipment with cards in them."
  npc_custom_prt_in_item_signer_card_here_c42f59: "A card? Here?!"
  npc_custom_prt_in_item_signer_done_55823e: "Done!"
  npc_custom_prt_in_item_signer_goodbye_7468c8: "Goodbye..."
  npc_custom_prt_in_item_signer_i_dare_alter_work_master_525666: "I dare not alter the work of a master."
  npc_custom_prt_in_item_signer_i_rather_hear_word_thank_850d7c: "I would rather not hear the word 'thank you'."
  npc_custom_prt_in_item_signer_i_sign_any_equipment_wea_302a86: "I can sign any equipment or weapon without a slot."
  npc_custom_prt_in_item_signer_i_sign_your_name_onto_529258: "I can ^0055FFsign your name^000000 onto almost any rare equipment."
  npc_custom_prt_in_item_signer_menu_i_ae754f: "I require:"
  npc_custom_prt_in_item_signer_menu_more_3f3256: "More info...:Please sign for me!"
  npc_custom_prt_in_item_signer_menu_my_974e30: "My fees are:"
  npc_custom_prt_in_item_signer_menu_yes_52ac8b: "Yes!:Never mind"
  npc_custom_prt_in_item_signer_msg_44c582: "...?"
  npc_custom_prt_in_item_signer_msg_5bab61: "^000000?"
  npc_custom_prt_in_item_signer_oh_my_equipment_already_518f56: "Oh my, this equipment is already signed."
  npc_custom_prt_in_item_signer_per_refine_2d037a: "per refine "
  npc_custom_prt_in_item_signer_rather_angry_children_4edf6a: "Or rather 12 angry children"
  npc_custom_prt_in_item_signer_should_i_sign_b6d79c: "Should I sign the ^0055FF"
  npc_custom_prt_in_item_signer_show_me_equipment_you_wa_6bb9bb: "Show me the equipment you want to sign..."
  npc_custom_prt_in_item_signer_sigh_i_starving_children_a26bae: "Sigh, I have 12 starving children"
  npc_custom_prt_in_item_signer_sorry_i_sign_rental_equi_5584c9: "Sorry, I do not sign rental equipment!"
  npc_custom_prt_in_item_signer_sorry_i_sign_slotted_equ_a3e62c: "Sorry, I do not sign slotted equipment."
  npc_custom_prt_in_item_signer_there_nothing_equipped_s_050c41: "There is nothing equipped in that slot!"
  npc_custom_prt_in_item_signer_very_angry_wife_1180d6: "and a very angry wife."
  npc_custom_prt_in_item_signer_very_starving_wife_4d09f0: "and a very starving wife..."
  npc_custom_prt_in_item_signer_where_your_9187cd: "Where is your "
  npc_custom_prt_in_item_signer_zeny_f460a9: " Zeny"
