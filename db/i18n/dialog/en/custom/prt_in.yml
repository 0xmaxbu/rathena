Body:
  npc_custom_prt_in_THQS_TTShop_ahh_welcome_official_tre_946ae3: "Ahh, {0}! Welcome to the Official Treasure Hunter's Guild Shop."
  npc_custom_prt_in_THQS_TTShop_everything_its_own_price_1cc275: "Everything has its own price value and the only way you can get the tokens is by completing quests assigned to you,the system normally works like this."
  npc_custom_prt_in_THQS_TTShop_harder_mission_more_toke_5a01c4: "The harder the mission the more Tokens you will earn. All red quests are worth 4-8 Tokens, and the rest are worth 1-5."
  npc_custom_prt_in_THQS_TTShop_hope_solves_your_problem_c90bda: "Hope that solves your problem and questions."
  npc_custom_prt_in_THQS_TTShop_note_t_stands_treasure_t_c2a47f: "(Note T stands for a Treasure Token.)"
  npc_custom_prt_in_THQS_TTShop_ok_here_our_big_list_81ab07: "Ok here is our Big list of goods."
  npc_custom_prt_in_THQS_TTShop_well_you_see_here_you_38ea87: "Well you see here you can exchange your treasure hunter tokens for zeny or rare weapons forged by our blacksmiths."
  npc_custom_prt_in_THQS_TTShop_what_we_offer_a2a346: "This is what we have to offer."
  npc_custom_prt_in_THQS_TTShop_what_we_offer_all_cards_ea4419: "This is what we have to offer. All Cards are 300T"
  npc_custom_prt_in_THQS_TTShop_you_currently_treasure_t_4436fe: "You currently have ^FF0000{0}^000000 treasure tokens!!!"
  npc_custom_prt_in_THQS_TTShop_you_don_t_enough_tokens_32ea17: "You don't have enough tokens!"
  npc_custom_prt_in_card_remover_alright_come_back_anytim_7b181a: "Alright. Come back anytime you need my services."
  npc_custom_prt_in_card_remover_alright_which_piece_equi_4f0629: "Alright. Which piece of equipment should I examine?"
  npc_custom_prt_in_card_remover_although_card_successful_392db7: "Although the card was successfully removed from the equipment, it was destroyed in the process. The equipment, however, is safe."
  npc_custom_prt_in_card_remover_card_s_socketed_spell_re_c4b230: " card(s) socketed. The spell requires "
  npc_custom_prt_in_card_remover_equipment_c7a0e3: "This equipment has "
  npc_custom_prt_in_card_remover_good_day_young_one_i_110f8d: "Good day, young one. I have the power to remove cards that you have compounded onto your equipment. Does this idea please you?"
  npc_custom_prt_in_card_remover_how_regrettable_card_suc_5f1228: "How regrettable. The card was successfully removed, but the equipment itself was destroyed."
  npc_custom_prt_in_card_remover_i_cannot_serve_you_8020e3: "I cannot serve you."
  npc_custom_prt_in_card_remover_i_charge_fixed_fee_aecd47: "I charge a fixed fee of "
  npc_custom_prt_in_card_remover_i_charge_flat_fee_zeny_c37e27: "I charge a flat fee of {0} zeny, plus {1} zeny for each card I remove from the item. In addition, I need a star crumb and a yellow gemstone to work my magic."
  npc_custom_prt_in_card_remover_i_failed_remove_cards_lu_ff0585: "I have failed to remove the cards. Luckily, however, both the item and the cards are still okay."
  npc_custom_prt_in_card_remover_i_t_offer_any_my_31130d: "I can't offer any of my"
  npc_custom_prt_in_card_remover_i_unable_remove_card_for_ec3d74: "I was unable to remove the card. Fortunately, both the equipment and the card are intact."
  npc_custom_prt_in_card_remover_item_cards_compounded_pe_2fa31a: "This item has {0} cards compounded on it. To perform my magic, I will need {1} zeny, a ^0000FFStar Crumb^000000, and a ^0000FFYellow Gemstone^000000."
  npc_custom_prt_in_card_remover_just_minute_7907cd: "^3355FFJust a minute!"
  npc_custom_prt_in_card_remover_kafra_storage_come_again_26ae41: "Kafra Storage and come again~"
  npc_custom_prt_in_card_remover_kafra_storage_come_back_79749f: "in the Kafra Storage and come back~"
  npc_custom_prt_in_card_remover_menu_alright_fc02d7: "Alright, begin.:Never mind."
  npc_custom_prt_in_card_remover_menu_before_1ce37a: "Before I begin, I must warn you--I may fail. If I do, I may destroy the cards, the item, or both. I do not give refunds. That being said, which is more important to you: The cards, or the item?"
  npc_custom_prt_in_card_remover_menu_before_838bd2: "Before I begin, I must warn you — I may fail. If I fail, both the card and the equipment may be destroyed, and I will not refund you. So, which is more important to you: the card or the equipment?"
  npc_custom_prt_in_card_remover_menu_i_0c0367: "I changed my mind about this.:The item.:The cards."
  npc_custom_prt_in_card_remover_menu_i_f97ac2: "I changed my mind.:Keep the equipment.:Keep the cards."
  npc_custom_prt_in_card_remover_menu_very_c1b0aa: "Very well. Do it.:Never mind."
  npc_custom_prt_in_card_remover_menu_yes_ba3ff9: "Yes, please help.:How much does it cost?:No, thanks."
  npc_custom_prt_in_card_remover_menu_yes_cbae6e: "Yes, it does.:What do you charge?:No thanks."
  npc_custom_prt_in_card_remover_most_unfortunate_i_succe_867bf4: "Most unfortunate. I succeeded at removing the cards, but the item itself was destroyed in the process."
  npc_custom_prt_in_card_remover_nice_meet_you_young_one_ee5468: "It is nice to meet you, young one. I can remove cards from your equipment for you. Do you need my help?"
