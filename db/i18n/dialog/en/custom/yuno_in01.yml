  npc_custom_yuno_in01_THQS_QuestNPC_dazzy_local_blond_around_3b2f1f: "Dazzy the local blond around Geffen has asked for you to deliver her these flowers. I don't know why someone would send flowers to herself..."
  npc_custom_yuno_in01_THQS_QuestNPC_deliver_box_thieves_guil_3a4756: "Deliver this Box to the Thieves guild."
  npc_custom_yuno_in01_THQS_QuestNPC_delivery_9631af: "^FF0000Delivery^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_easy_low_payed_quest_c32a49: "This is an easy and low payed quest."
  npc_custom_yuno_in01_THQS_QuestNPC_easy_some_very_hard_othe_2bfbbc: "Easy for some very hard for others."
  npc_custom_yuno_in01_THQS_QuestNPC_eddga_e278eb: "^FF0000Eddga^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_emperium_149cc5: "^FF0000Emperium^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_evil_druids_started_turn_876b12: "The Evil Druids started to turn all the workers into the undead. We do not know why, but we do not want to find out, contact a man named Rudolfo outside the Coal Mines."
  npc_custom_yuno_in01_THQS_QuestNPC_evil_pirates_982466: "^FF0000Evil Pirates^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_farther_we_go_into_cave_f64132: "The farther we go into the cave the stranger it gets."
  npc_custom_yuno_in01_THQS_QuestNPC_female_assassin_quest_yo_8efbd2: "A female assassin has a quest for you, she is waiting outside the Ghost Ship. There have been reports of evil undead pirates lurking around inside the ship."
  npc_custom_yuno_in01_THQS_QuestNPC_fun_err_trouble_never_st_7c3524: "The fun...err...trouble never stops in Rune-Midgarts."
  npc_custom_yuno_in01_THQS_QuestNPC_geffenia_f9b95a: "^FF0000Geffenia^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_ghost_ship_washed_up_sho_8a80ed: "A ghost ship has washed up on shore on an island outside of Izlude."
  npc_custom_yuno_in01_THQS_QuestNPC_giving_up_cost_you_z_d4d65e: "Giving up will cost you ^FF00002500z^000000."
