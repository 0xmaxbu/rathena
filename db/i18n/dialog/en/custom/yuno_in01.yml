  npc_custom_yuno_in01_THQS_ChattingNPC_ahh_welcome_fellow_treas_a6c8e8: "Ahh welcome fellow Treasure Hunter {0}."
  npc_custom_yuno_in01_THQS_ChattingNPC_apparently_his_name_baph_1145b0: "Apparently his name is Baphomet and he has been running around the Forest Maze out side of Prontera for quite some time now."
  npc_custom_yuno_in01_THQS_ChattingNPC_did_you_hear_about_brave_8427e6: "Did you hear about that brave man that went into Glast Heim alone?! He must be crazy."
  npc_custom_yuno_in01_THQS_ChattingNPC_did_you_hear_about_goat_5cd7d9: "Did you hear about that goat man running around in the trees?"
  npc_custom_yuno_in01_THQS_ChattingNPC_don_t_you_something_bett_6e80f6: "{0} don't you have something better you could be doing? Like a quest."
  npc_custom_yuno_in01_THQS_ChattingNPC_feel_free_become_member_ea7825: "and feel free to become a member if you wish."
