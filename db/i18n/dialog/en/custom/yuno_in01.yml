  npc_custom_yuno_in01_THQS_QuestNPC_i_know_much_about_quest_fe95a0: "I do not know much about this quest."
  npc_custom_yuno_in01_THQS_QuestNPC_i_know_seems_like_there_fd0ba3: "I know it seems like there is no stopping them but however many you kill does makes a difference. After you have signed up, inside the Culvert there will be a Knight that will give you a quest."
  npc_custom_yuno_in01_THQS_QuestNPC_i_m_afraid_there_aren_f8294e: "I'm afraid there aren't any Quests for you yet."
  npc_custom_yuno_in01_THQS_QuestNPC_i_m_afraid_you_must_da3ef5: "I'm afraid you must sign up for the guild before you can go on a quest!"
  npc_custom_yuno_in01_THQS_QuestNPC_i_remember_when_payon_ca_dd9a1f: "I remember when Payon Cave used to be a safe place to visit, but now undead Zombies have infested the cave! Please contact ^FF0000Flora outside on Payon Cave^000000 and aid her."
  npc_custom_yuno_in01_THQS_QuestNPC_its_funny_cause_no_one_197ada: "Its funny cause no one knows how these were really made."
  npc_custom_yuno_in01_THQS_QuestNPC_its_sad_see_someone_give_cdc515: "Its sad to see someone give a quest up..."
  npc_custom_yuno_in01_THQS_QuestNPC_jeramiah_ordered_special_88a2ed: "Jeramiah ordered a Special Jur from our weapon shop.Your Job is to deliver it to him in the Assasin Temple."
