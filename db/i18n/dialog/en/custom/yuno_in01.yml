  npc_custom_yuno_in01_THQS_QuestNPC_good_well_get_back_out_d339c3: "Good well get back out there."
  npc_custom_yuno_in01_THQS_QuestNPC_guy_just_poped_into_some_662896: "This guy just poped into some hole one day, He doesn't look that tough but you would be surprised. Talk to a man named Caral outside of Ant Hell."
  npc_custom_yuno_in01_THQS_QuestNPC_half_naked_freak_need_ar_aad4d6: "This half naked freak need an army to take down, now its your job, good luck. Meet a girl named Jeni outside of the back entrance to Ant Hell."
  npc_custom_yuno_in01_THQS_QuestNPC_he_always_seems_around_s_d0e530: "But he always seems to be around the same place so there isn't much looking involved,check the mountains 1 west and 1 north of Prontera."
  npc_custom_yuno_in01_THQS_QuestNPC_he_big_pink_you_run_9fb3d0: "He is big and Pink and you run and hide!"
  npc_custom_yuno_in01_THQS_QuestNPC_hidden_temple_he_watches_cdb665: "Hidden in the Temple he watches and guards."
  npc_custom_yuno_in01_THQS_QuestNPC_hit_list_8ee011: "^FF0000The Hit List^000000"
  npc_custom_yuno_in01_THQS_QuestNPC_hmmm_seems_man_named_jac_c93fbb: "Hmmm seems a man named Jack wants to speak to you in the Archer Guild House."
