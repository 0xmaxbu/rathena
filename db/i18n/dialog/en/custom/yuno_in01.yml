  npc_custom_yuno_in01_THQS_QuestNPC_apparently_pyramids_begi_15ce4a: "Apparently the Pyramids have are beginning to be infested with undead activity,outside the pyramids a man will be waiting for you. He did no give us his name but he asked for you to hurry."
