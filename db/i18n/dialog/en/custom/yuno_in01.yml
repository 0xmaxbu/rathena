  npc_custom_yuno_in01_THQS_ChattingNPC_treasure_hunter_guild_ho_80866f: "^FF0000[ Treasure Hunter Guild House ]^000000"
  npc_custom_yuno_in01_THQS_ChattingNPC_umm_sorry_i_m_gonna_b63646: "Umm sorry I'm not gonna waste my time talking to you if you aren't even a member!"
  npc_custom_yuno_in01_THQS_ChattingNPC_up_stairs_down_hall_1c0cc7: "up the stairs and down the hall."
  npc_custom_yuno_in01_THQS_ChattingNPC_welcome_treasure_hunter_8ce2ec: "Welcome to The Treasure Hunter Guild."
  npc_custom_yuno_in01_THQS_ChattingNPC_welcome_treasure_hunter_9832cd: "Welcome to the Treasure Hunter's Guild House."
  npc_custom_yuno_in01_THQS_ChattingNPC_well_if_you_think_you_6365a3: "Well if you think you are safe, good on you."
  npc_custom_yuno_in01_THQS_ChattingNPC_you_ask_me_one_you_6c203e: "You ask me for one and you'll find yourself 10 pounds lighter!"
  npc_custom_yuno_in01_THQS_GuildNPC_alright_come_back_when_y_a09735: "Alright come back when you have the free time to spare."
  npc_custom_yuno_in01_THQS_GuildNPC_also_now_you_member_feel_1408dc: "Also now that you are a member feel free to use our shops anytime you wish.They are all located on this floor."
  npc_custom_yuno_in01_THQS_GuildNPC_congratulations_36b252: "Congratulations!"
  npc_custom_yuno_in01_THQS_GuildNPC_ha_ha_ha_you_already_111c10: "Ha ha ha...you are already a member."
  npc_custom_yuno_in01_THQS_GuildNPC_hmmm_you_don_t_seem_8d6eda: "Hmmm you don't seem to have ^FF000025,000z^000000 {0}. Please come back when you do."
  npc_custom_yuno_in01_THQS_GuildNPC_i_m_sorry_only_members_7fb453: "I'm sorry only members may visit our private shop."
  npc_custom_yuno_in01_THQS_GuildNPC_sorry_you_must_member_tr_3bb4cd: "Sorry you must be a member of the Treasure Hunter Guild if you wish to take a quest."
  npc_custom_yuno_in01_THQS_GuildNPC_umm_well_all_you_need_29db2d: "Umm... Well that is all you need to do. Hahaha."
  npc_custom_yuno_in01_THQS_GuildNPC_we_also_another_shop_mem_7f80bf: "We also have another shop for members only,in which we use little metal diamonds called Treasure Hunter Tokens to exchange for rare goods."
  npc_custom_yuno_in01_THQS_GuildNPC_welcome_guild_treasure_h_ba9106: "Welcome to the Guild of Treasure Hunters."
  npc_custom_yuno_in01_THQS_GuildNPC_well_if_you_t_afford_bd7a9d: "Well if you can't afford a small ^FF000025,000z^000000 you shouldn't be a Treasure Hunter yet."
  npc_custom_yuno_in01_THQS_GuildNPC_well_if_you_want_treasur_f5bd49: "Well {0} if you want to be a Treasure Hunter first you must."
  npc_custom_yuno_in01_THQS_GuildNPC_well_if_you_wish_take_8b19a3: "Well {0} if you wish to take a quest go talk to the fellow Treasure Hunter in the other room there."
  npc_custom_yuno_in01_THQS_GuildNPC_what_brings_you_here_som_bb1b7d: "What brings you here? Have something to say?"
  npc_custom_yuno_in01_THQS_GuildNPC_yes_i_take_you_our_dea8b9: "Yes {0} I will take you to our shop right away!"
  npc_custom_yuno_in01_THQS_GuildNPC_you_even_access_our_excl_cbdafd: "You will even have access to our exclusive personal Dungeon."
  npc_custom_yuno_in01_THQS_GuildNPC_you_may_now_take_treasur_0e6532: "You may now take a Treasure Hunting Quest as you see fit."
  npc_custom_yuno_in01_THQS_GuildNPC_you_well_changed_z_basic_bbdad1: "^FF00001.^000000 You well be changed ^FF000025,000z^000000 for basic training and your proof of being a member."
  npc_custom_yuno_in01_THQS_QuestNPC_ahh_welcome_fellow_treas_bd0071: "Ahh welcome fellow Treasure Hunter."
  npc_custom_yuno_in01_THQS_QuestNPC_alright_maybe_next_time_dd71df: "Alright maybe next time {0}."
