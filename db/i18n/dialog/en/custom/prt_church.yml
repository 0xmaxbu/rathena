Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_custom_prt_church_marriage_after_both_registered_me_fde46d: "After both have registered with me, you have to go pledge your vows to the Priest and accept your registered partner. If for some reason you reject your registered partner, the wedding will be cancelled..."
  npc_custom_prt_church_marriage_after_you_file_divorce_y_be8def: "After you file in for divorce, your spouse has one minute to agree, and then you will both be divorced."
  npc_custom_prt_church_marriage_after_your_bride_approve_3e545f: "After your bride approves, you will be given your rings, the ceremony will begin and you will be officially married."
  npc_custom_prt_church_marriage_after_your_groom_approve_414f01: "After your groom approves, you will be given your rings, the ceremony will begin and you will be officially married."
  npc_custom_prt_church_marriage_ah_err_ehm_okay_you_c04cae: "Ah... err... ehm... okay. You two seem to have some differences to settle first."
  npc_custom_prt_church_marriage_although_normally_only_m_a1b77f: "Although normally only males can wed females (and vice versa), our local Priest is more open-minded than that and he permits all pairings regardless of gender."
  npc_custom_prt_church_marriage_before_registering_as_le_80b407: "Before registering as {0}, let me check if you meet all the requirements..."
  npc_custom_prt_church_marriage_before_you_get_married_0eb806: "before you can get married."
  npc_custom_prt_church_marriage_both_groom_bride_must_re_2134bf: "Both groom and bride must register within a minute of each other, or the wedding will be cancelled. So be sure you both are ready and meet the registration requirements beforehand."
  npc_custom_prt_church_marriage_both_must_own_each_936eed: "- Both must own a {0} each."
  npc_custom_prt_church_marriage_bride_registered_yet_ca4d49: "The bride has not registered yet."
  npc_custom_prt_church_marriage_bride_waiting_groom_retr_97e26f: "The bride, {0}, is waiting for the groom to retrieve the ring."
  npc_custom_prt_church_marriage_bride_waiting_groom_s_ac_bc0a1d: "The bride, {0}, is waiting for the groom's acceptance."
  npc_custom_prt_church_marriage_bride_yet_confirm_groom_f904f4: "The bride, {0}, has yet to confirm the groom."
  npc_custom_prt_church_marriage_bride_yet_retrieve_ring_196dce: "The bride, {0}, has yet to retrieve the ring."
  npc_custom_prt_church_marriage_case_enjoy_your_bachelor_a9e82a: "In that case, enjoy your bachelor's life."
  npc_custom_prt_church_marriage_child_what_did_you_your_7ade2e: "Child, what did you do with your {0}?"
  npc_custom_prt_church_marriage_child_you_supposed_wear_e83e51: "Child, you are supposed to wear a {0} at all times during the ceremony..."
  npc_custom_prt_church_marriage_child_you_t_take_off_e462c0: "Child, you can't take off your {0} yet...."
  npc_custom_prt_church_marriage_come_back_once_you_colle_0e9ad8: "Come back once you have collected {0}z."
  npc_custom_prt_church_marriage_come_back_when_you_ready_67d3d7: "Come back when you are ready."
  npc_custom_prt_church_marriage_divorcing_such_sad_event_3594df: "Divorcing can be such a sad event..."
  npc_custom_prt_church_marriage_enjoy_remaining_wedding_f92dcf: "Enjoy the remaining of the wedding."
  npc_custom_prt_church_marriage_enjoy_wedding_f495a0: "Enjoy the wedding."
  npc_custom_prt_church_marriage_err_cough_cough_very_wel_7f4a23: "err.. *cough* *cough* very well... come back after you've made up your mind."
  npc_custom_prt_church_marriage_even_though_said_once_we_bbbb35: "Even though it is said that once the wedlocks have been made they cannot be undone, sometimes it is necessary to undo our mistakes from the past.."
  npc_custom_prt_church_marriage_fee_z_paid_person_who_dd21bf: "The fee is of {0}z and is paid by the person who confirms the divorce, so plan ahead of time how you will divide the costs."
  npc_custom_prt_church_marriage_females_must_also_wear_d1d3b5: "- Females must also wear a {0}."
  npc_custom_prt_church_marriage_females_must_wearing_5f38aa: "- Females must be wearing a {0}."
  npc_custom_prt_church_marriage_first_all_both_groom_bri_04ecd1: "First of all, both groom and bride must register with me."
  npc_custom_prt_church_marriage_first_you_need_get_your_86c1a9: "But first, you need to get your rings ready."
  npc_custom_prt_church_marriage_good_hear_a465fd: "Good to hear."
  npc_custom_prt_church_marriage_groom_3b20e8: "Groom"
  npc_custom_prt_church_marriage_groom_registered_yet_c645b6: "The groom has not registered yet."
  npc_custom_prt_church_marriage_groom_waiting_bride_retr_69a172: "The groom, {0}, is waiting for the bride to retrieve the ring."
  npc_custom_prt_church_marriage_groom_waiting_bride_s_ac_e35d47: "The groom, {0}, is waiting for the bride's acceptance."
  npc_custom_prt_church_marriage_groom_yet_accept_bride_f26315: "The groom, {0}, has yet to accept the bride."
  npc_custom_prt_church_marriage_groom_yet_retrieve_ring_d4189c: "The groom, {0}, has yet to retrieve the ring."
  npc_custom_prt_church_marriage_happy_marry_let_you_know_79f92e: "Happy Marry will let you know"
  npc_custom_prt_church_marriage_here_s_wedding_ring_your_921160: "Here's the wedding ring for your bride."
  npc_custom_prt_church_marriage_here_s_wedding_ring_your_ed82f5: "Here's the wedding ring for your groom."
  npc_custom_prt_church_marriage_i_am_going_wed_you_99d882: "I am going to wed {0} and {1}, do you have an objection to it?"
  npc_custom_prt_church_marriage_i_am_happy_as_i_af4f0f: "I am happy as I am, thank you."
  npc_custom_prt_church_marriage_i_am_progress_divorcing_3f01a9: "I am in the progress of divorcing {0}."
  npc_custom_prt_church_marriage_i_am_sorry_you_don_4aaffc: "I am sorry, but you don't have enough to pay for the registration fee."
  npc_custom_prt_church_marriage_i_am_still_waiting_your_3fa0ac: "...I am still waiting for your partner to confirm the divorce procedure."
  npc_custom_prt_church_marriage_i_am_waiting_your_partne_7e02ae: "I am waiting for your partner to accept you to start the ceremony."
  npc_custom_prt_church_marriage_i_am_wedding_s_already_6a6e46: "I am wedding {0} and {1}, and it's already too late to object. Please let me continue."
  npc_custom_prt_church_marriage_i_don_t_want_divorce_88e2a1: "I don't want to divorce...."
  npc_custom_prt_church_marriage_i_hope_you_work_things_c2847c: "I hope you can work things out."
  npc_custom_prt_church_marriage_i_ll_single_forever_6977a9: "I'll be single forever!"
  npc_custom_prt_church_marriage_i_need_time_think_about_6688ce: "I need time to think about it."
  npc_custom_prt_church_marriage_i_now_start_wedding_cere_249c07: "I will now start the wedding ceremony, and you will be declared forth husband and wife."
  npc_custom_prt_church_marriage_i_see_fd141e: "I see..."
  npc_custom_prt_church_marriage_i_see_sorry_bothered_you_245d40: "I see. Sorry to have bothered you then."
  npc_custom_prt_church_marriage_i_shouldn_t_need_mention_302f74: "I shouldn't need to mention this, but adopted kids are too young to get married."
  npc_custom_prt_church_marriage_i_wish_many_blessings_up_b00d86: "I wish for many blessings upon couples who wish to live happily ever after..."
  npc_custom_prt_church_marriage_if_there_significant_oth_1f7120: "If there is a significant other with whom you want to spend the rest of your life with, then don't be shy to propose."
  npc_custom_prt_church_marriage_if_there_various_couples_e67677: "If there are various couples who desire to marry, you should keep in order, for the Priest can only handle one wedding at a time."
  npc_custom_prt_church_marriage_if_you_both_accept_each_a25568: "If you both accept each other, then the wedding has been decided and the ceremony will begin."
  npc_custom_prt_church_marriage_isn_t_marriage_beautiful_0b0e0f: "Isn't marriage beautiful?"
  npc_custom_prt_church_marriage_looks_like_your_bride_ye_34aa28: "Looks like your bride has yet to arrive and register."
  npc_custom_prt_church_marriage_looks_like_your_groom_ye_8b7f0c: "Looks like your groom has yet to arrive and register."
  npc_custom_prt_church_marriage_males_may_only_wed_femal_15d75f: "Males may only wed with females, and females only with males, the church will not consent any other kind of partnerships."
  npc_custom_prt_church_marriage_males_must_wearing_9f55ed: "- Males must be wearing a {0}."
  npc_custom_prt_church_marriage_marriage_happy_marry_6af311: "marriage with Happy Marry"
  npc_custom_prt_church_marriage_marriage_such_beautiful_2a25b9: "Marriage... is such a beautiful thing."
  npc_custom_prt_church_marriage_menu_the_303d11: "The registration requirements for the bride are:"
  npc_custom_prt_church_marriage_menu_the_a3021a: "The registration requirements for the groom are:"
  npc_custom_prt_church_marriage_menu_the_b66e82: "The registration requirements are:"
  npc_custom_prt_church_marriage_msg_b4613f: "!!"
  npc_custom_prt_church_marriage_now_you_both_accepted_we_b6b5c4: "Now that you both have accepted, the wedding will begin. Please come forth, you and your partner, to retrieve your rings."
  npc_custom_prt_church_marriage_oh_dear_you_too_young_091446: "Oh dear, you are too young to be thinking of marriage!"
  npc_custom_prt_church_marriage_once_your_bride_retrieve_8e6c66: "Once your bride retrieves the ring, the ceremony will begin."
  npc_custom_prt_church_marriage_once_your_groom_retrieve_b3cb8c: "Once your groom retrieves the ring, the ceremony will begin."
  npc_custom_prt_church_marriage_order_file_divorce_i_nee_71a999: "In order to file for divorce, I need you both to agree to it."
  npc_custom_prt_church_marriage_own_1e1c3a: "- To own a {0}."
  npc_custom_prt_church_marriage_pay_registration_fee_z_1a09dc: "- Pay a Registration fee of {0}z."
  npc_custom_prt_church_marriage_people_shouldn_t_make_sh_1ebe84: "People shouldn't make shallow vows to others, don't you think?"
  npc_custom_prt_church_marriage_please_don_t_interrupt_m_ef4d93: "Please don't interrupt me now."
  npc_custom_prt_church_marriage_prepare_marriage_42e70d: "to prepare for marriage"
  npc_custom_prt_church_marriage_priest_handle_rest_cerem_51fdee: "The Priest will handle the rest of the ceremony."
  npc_custom_prt_church_marriage_proposal_must_done_prude_34337a: "The proposal must be done with prudence and courtesy, once the wedlocks have been made, they cannot be undone."
  npc_custom_prt_church_marriage_registration_fee_bride_z_259418: "- The registration fee for the bride is {0}z."
  npc_custom_prt_church_marriage_registration_fee_groom_z_8a43e5: "- The registration fee for the groom is {0}z."
  npc_custom_prt_church_marriage_sad_true_if_you_happen_4b6229: "It is sad, but true. If you happen to have married the wrong person, it is possible to divorce, rather than spend the rest of your life with the wrong one."
  npc_custom_prt_church_marriage_so_should_i_proceed_divo_2ab7ef: "So, should I proceed with the divorce?"
  npc_custom_prt_church_marriage_sorry_please_go_9a2655: "Sorry, please go on."
  npc_custom_prt_church_marriage_talk_priest_once_more_he_1b670e: "Talk to the priest once more, and he will exchange your {0} for a wedding ring. After you both have claimed the rings for exchanging, the ceremony will begin."
  npc_custom_prt_church_marriage_tell_your_bride_register_234422: "Tell your bride to register, what is taking so long? Time is running out."
  npc_custom_prt_church_marriage_tell_your_bride_register_da4b56: "Tell your bride to register as soon as possible."
  npc_custom_prt_church_marriage_tell_your_groom_register_3de747: "Tell your groom to register as soon as possible."
  npc_custom_prt_church_marriage_tell_your_groom_register_5fb085: "Tell your groom to register, what is taking so long? Time is running out."
  npc_custom_prt_church_marriage_there_wedding_being_plan_2b5969: "There is a wedding being planned. I would appreciate it if you would not interrupt me."
  npc_custom_prt_church_marriage_there_wedding_progress_ec302b: "There is a wedding in progress."
  npc_custom_prt_church_marriage_two_who_been_joined_marr_f84d63: "The two who have been joined by marriage must remain together forever until the day death do them apart."
  npc_custom_prt_church_marriage_very_well_get_your_partn_a22402: "Very well, get your partner to confirm, and I will collect the fee for filing the divorce then."
  npc_custom_prt_church_marriage_very_well_go_sit_enjoy_8cc468: "Very well, go sit and enjoy the ceremony."
  npc_custom_prt_church_marriage_very_well_now_go_priest_e6ca39: "Very well, now go to the Priest to reaffirm your vows and the ceremony will begin."
  npc_custom_prt_church_marriage_very_well_whom_you_like_92b14d: "Very well, whom would you like to register as?"
  npc_custom_prt_church_marriage_very_well_you_register_a_98324b: "Very well, will you register as the Bride?"
  npc_custom_prt_church_marriage_very_well_you_register_a_ea7110: "Very well, will you register as the Groom?"
  npc_custom_prt_church_marriage_wait_i_need_think_about_285f98: "Wait... I need to think about it."
  npc_custom_prt_church_marriage_we_just_waiting_both_tog_acb5b1: "We are just waiting for both {0} and {1} to be together to marry them."
  npc_custom_prt_church_marriage_wearing_fb48e3: "- To be wearing a {0}."
  npc_custom_prt_church_marriage_weddings_performed_our_l_88d832: "Weddings are performed by our local Priest with the intent of promoting love and peace among the loving couples."
  npc_custom_prt_church_marriage_well_i_t_file_your_a89948: "Well, I can't file your divorce because you don't have enough for the fee. Get your partner to lend you some?"
  npc_custom_prt_church_marriage_what_else_you_ll_need_090ba2: "what else you'll need to do"
  npc_custom_prt_church_marriage_what_happened_your_you_d_32c67b: "What happened to your {0}? You didn't lose it... did you? We need it to continue with the ceremony!"
  npc_custom_prt_church_marriage_where_gone_i_t_divorce_95c322: "Where has {0} gone to? I can't divorce you unless you both are here..."
  npc_custom_prt_church_marriage_where_i_t_marry_you_5bb0ee: "Where is {0}?? I can't marry you both if one is missing..."
  npc_custom_prt_church_marriage_where_s_ring_you_need_d641f3: "Where's the ring? You need a {0} for the ring exchange, dear."
  npc_custom_prt_church_marriage_where_your_s_necessary_c_87cc73: "Where is your {0}? It's a necessary complement to your dress."
  npc_custom_prt_church_marriage_why_should_they_wed_ba2483: "Why should they not be wed?"
  npc_custom_prt_church_marriage_yes_5397e0: "Yes"
  npc_custom_prt_church_marriage_yes_i_am_76ab27: "Yes, I am."
  npc_custom_prt_church_marriage_you_don_t_seem_enough_591d96: "You don't seem to have enough space to carry the ring... go free up some space and come back to reclaim your partner's ring."
  npc_custom_prt_church_marriage_you_know_who_spouse_d733e5: "Do you know who the spouse is?"
  npc_custom_prt_church_marriage_you_like_get_married_som_0b6ca6: "Would you like to get married with someone?"
  npc_custom_prt_church_marriage_you_like_know_progress_s_486cbb: "Would you like to know the progress of said wedding?"
  npc_custom_prt_church_marriage_you_must_apply_94289c: "You must apply for"
  npc_custom_prt_church_marriage_you_my_blessings_wonderf_b32027: "You have my blessings, have a wonderful married life."
  npc_custom_prt_church_marriage_you_now_registered_as_br_e6be7b: "You are now registered as the bride."
  npc_custom_prt_church_marriage_you_now_registered_as_gr_4c2c4a: "You are now registered as the groom."
  npc_custom_prt_church_marriage_you_positively_sure_abou_815274: "Are you positively sure about getting divorced?"
  npc_custom_prt_church_marriage_you_should_regret_choice_1fb4a6: "You should not regret the choices you've made in life."
  npc_custom_prt_church_marriage_you_should_think_through_19db10: "You should think this through."
  npc_custom_prt_church_marriage_you_should_wearing_if_yo_1c2133: "You should be wearing a {0} if you want to get married."
  npc_custom_prt_church_marriage_you_what_769623: "You what!?"
  npc_custom_prt_church_marriage_you_wouldn_t_want_divorc_730085: "You wouldn't want to divorce, by any chance?"
  npc_custom_prt_church_marriage_your_divorce_been_filed_cd99c7: "Your divorce has been filed. You are no longer wed."
  npc_custom_prt_church_marriage_your_partner_s_wedding_r_7bcd42: "Your partner's wedding ring hasn't been retrieved yet. The ceremony will start as soon as you both have claimed your rings."
