  npc_custom_pay_arche_THQS_Quests_well_hello_there_c1a082: "Well hello there."
  npc_custom_pay_arche_THQS_Quests_well_hello_you_b0839c: "Well hello to you."
  npc_custom_pay_arche_THQS_Quests_well_here_take_these_tre_9331be: "Well here take these 2 Treasure Tokens."
  npc_custom_pay_arche_THQS_Quests_well_i_don_t_know_ccff4e: "Well I don't know much about this, it has to do with the deepest regions of Payon Cave. We don't know much because no one ever seems to make it back alive. We suspect a monster we call the Moonlight Flower"
  npc_custom_pay_arche_THQS_Quests_well_i_hope_cut_down_b885b8: "Well I hope that cut down a bit on the monsters and here have these 2 Tokens."
  npc_custom_pay_arche_THQS_Quests_well_its_good_see_you_10c200: "Well its good to see that you have come back alive."
  npc_custom_pay_arche_THQS_Quests_well_looked_like_no_trou_4eab14: "Well that looked like it was no trouble for you."
  npc_custom_pay_arche_THQS_Quests_well_recently_bunch_stup_68b4db: "Well recently a bunch of stupid bears stole the supers off all my bee's nests...Stupid bears."
  npc_custom_pay_arche_THQS_Quests_well_thank_you_deliverin_bbd082: "Well thank you for delivering this anyway have this Treasure Token."
  npc_custom_pay_arche_THQS_Quests_well_there_been_reports_718f65: "Well there have been reports of a Golden Thief Bug running around the bottom on the Culvert"
  npc_custom_pay_arche_THQS_Quests_well_those_bugs_bugger_o_c2961b: "Well those bugs can bugger off..."
  npc_custom_pay_arche_THQS_Quests_well_what_i_need_you_b68d94: "Well this is what I need you to do, bring me 50 Decayed Nails - a while back Payon Cave used to be a safe place to go...But now things have gone out of control and Zombies have invaded the first floor..."
  npc_custom_pay_arche_THQS_Quests_well_what_i_want_you_b72bdb: "Well what I want you to do is bring me 50 Lantern's as proof that you have cleaned some of them out, any loot you find down there you may keep other then what I have asked you to get for me."
