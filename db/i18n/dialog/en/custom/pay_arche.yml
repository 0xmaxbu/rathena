  npc_custom_pay_arche_THQS_Quests_treasure_token_dc39c1: "Have this Treasure Token"
  npc_custom_pay_arche_THQS_Quests_we_try_kill_him_past_732f24: "We have try to kill him in the past but it was not...ummm...It was a bad idea. What I want you to do is go there and bring me back his Skull as proof of you killing him."
  npc_custom_pay_arche_THQS_Quests_welcome_724486: "Welcome."
  npc_custom_pay_arche_THQS_Quests_welcome_back_good_job_yo_47106f: "Welcome back, good job you did it. (I wonder if that Flaming Bastard is still alive)"
  npc_custom_pay_arche_THQS_Quests_welcome_forest_maze_8ec3b7: "Welcome to the Forest Maze."
  npc_custom_pay_arche_THQS_Quests_welcome_forest_maze_i_ta_dbf4d2: "Welcome to the Forest Maze, I have a task for you."
