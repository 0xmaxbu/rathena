  npc_custom_pay_arche_THQS_Quests_thank_you_helping_me_i_aa3971: "Thank you for helping me, I presume the worse."
  npc_custom_pay_arche_THQS_Quests_thank_you_so_much_093766: "Thank you so much!"
  npc_custom_pay_arche_THQS_Quests_thank_you_so_much_here_d8456b: "thank you so much, here have these 3 Guild Tokens as a reward."
