  npc_custom_pay_arche_THQS_Quests_ok_i_don_t_want_276c8c: "Ok I don't want to talk about it but I need you to fine me 20 Shoot's"
  npc_custom_pay_arche_THQS_Quests_ok_well_my_problem_yah_8aa803: "Ok well this is my problem, yah see that hole in the ground? Yah that thing just popped out of nowhere a couple years ago, inside its full of these ugly ants and these monsters called Giearths."
  npc_custom_pay_arche_THQS_Quests_ok_well_start_68b86a: "Ok well this is a start."
  npc_custom_pay_arche_THQS_Quests_ok_well_what_i_wanted_df3006: "Ok well this is what I wanted you to do, this greave beside me is my husbands grave and I promised him that I would bury some Mementos with him, The problem is that I have no Mementos..."
