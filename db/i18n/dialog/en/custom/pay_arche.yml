  npc_custom_pay_arche_THQS_Quests_thanks_these_treasure_to_565d85: "Thanks have these 4 Treasure Tokens."
  npc_custom_pay_arche_THQS_Quests_there_also_these_new_mon_3077f2: "There is also these new monsters that have just popped out of no were, we call them Flaming Bastards...Be careful if you aren't powerful yet because they are very strong."
  npc_custom_pay_arche_THQS_Quests_there_seem_more_ghosts_d_f2d0cf: "There seem to be more ghosts day after day down there. What I need you to do is go down there and find these monsters we call Nightmares."
  npc_custom_pay_arche_THQS_Quests_these_treasure_tokens_c47f26: "Have these 1 Treasure Tokens."
  npc_custom_pay_arche_THQS_Quests_they_must_filled_you_wha_ad1187: "They must have filled you in on what is happening on the lower levels of this Coal Mine, I know its disturbing and we are still trying to figure out why and how 2 Evil Druids got down there."
  npc_custom_pay_arche_THQS_Quests_thinking_worse_case_here_bd26f3: "Thinking of the worse case here, I want vengeance!"
