Header:
  Type: I18N_DIALOG
  Version: 1

Body:
  npc_custom_lighthalzen_jewel_case_here_your_prize_s_yours_5b81e0: "Here is your prize. It's yours for good."
  npc_custom_lighthalzen_jewel_case_i_couldn_t_think_you_1c94bb: "I couldn't think you were able to meet my condition..."
  npc_custom_lighthalzen_jewel_case_i_ve_got_riddle_strong_e3c79b: "I've got a riddle for a strong man of 2nd Class and 99 Base Level."
  npc_custom_lighthalzen_jewel_case_if_you_get_younger_than_83d17e: "And if you get younger than now I'll give you my treasure."
  npc_custom_lighthalzen_jewel_case_if_you_solve_my_riddle_8d070c: "If you solve my riddle, then I'll give you a magical Jewel Case with a rare accessory."
  npc_custom_lighthalzen_jewel_case_kill_more_poporings_come_1cc85a: "Kill {0} more Poporings and come back."
  npc_custom_lighthalzen_jewel_case_kill_more_seals_return_07208c: "Kill {0} more Seals and return."
  npc_custom_lighthalzen_jewel_case_msg_6eae3a: "..."
  npc_custom_lighthalzen_jewel_case_now_go_forth_get_younger_8fba04: "Now go forth and get younger!"
  npc_custom_lighthalzen_jewel_case_now_you_re_really_strong_79ed75: "Now you're REALLY strong."
  npc_custom_lighthalzen_jewel_case_now_you_re_strong_18b3c4: "Now you're strong."
  npc_custom_lighthalzen_jewel_case_quite_strong_my_riddle_35373f: "But... not quite strong for my riddle."
  npc_custom_lighthalzen_jewel_case_yawn_if_you_meet_some_c5c95d: "*Yawn* If you meet some, please tell them about my riddle."
  npc_custom_lighthalzen_jewel_case_you_you_got_younger_you_0242c3: "You... You got younger!!! But you are definitely YOU!"
