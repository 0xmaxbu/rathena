  npc_custom_prontera_umbalian_language_actually_knowledge_umbal_34ba66: "Actually it is knowledge of the Umbalian people. They are connected to this world of Midgard in some special way, we just can't confirm it yet. There is a theory that they may be like the elves and protect the ancient tree of Yggdrasil."
  npc_custom_prontera_umbalian_language_ah_i_heard_her_class_4ae723: "Ah, I heard that her class was somewhere around there... thanks a lot! Here's a lil something for your help."
  npc_custom_prontera_umbalian_language_ah_i_see_if_she_55ab0f: "Ah I see, if she's studying then I don't want to bother her. Thanks anyways."
  npc_custom_prontera_umbalian_language_ah_you_ve_done_well_0e532b: "Ah, you've done well in retrieving my references. These artifacts holds information about ruins around the world, from the burning hell of the Magma Dungeon, to the strange eerie Hidden Forest of Yggdrasil."
  npc_custom_prontera_umbalian_language_argh_my_three_students_r_483963: "Argh! My three students ran off with my references! Hey you! Can you get them back for me? I'll gladly reward you."
  npc_custom_prontera_umbalian_language_castle_eh_i_don_t_04feed: "The castle eh, I don't want to step in there... just doesn't feel like my style. I don't like that noble feeling of importance type of thing."
  npc_custom_prontera_umbalian_language_enough_talk_you_re_just_8a77a4: "But enough talk, you're just eager to get your reward aren't you?  Well it may not sound much, but my reward for you is knowledge..."
  npc_custom_prontera_umbalian_language_hello_there_something_yo_94859b: "Hello, is there something you need?"
  npc_custom_prontera_umbalian_language_hey_there_i_came_here_99c3e5: "Hey there, I came here to Prontera in search of an old lady who can remove cards from slots. Do you know where I can find her?"
  npc_custom_prontera_umbalian_language_heyyy_there_you_poring_e_ff9f8f: "Heyyy there, you have a poring egg and the pet incubator to go with it! Are those for me?"
  npc_custom_prontera_umbalian_language_hi_i_came_here_prontera_e3fdc5: "Hi! I came here to Prontera in search of an old lady... But..."
  npc_custom_prontera_umbalian_language_hi_what_you_want_me_6c6d78: "Hi! What do you want from me?"
  npc_custom_prontera_umbalian_language_hmm_i_dunno_why_she_09f1b4: "Hmm... I dunno why she would be there... guess I'll take a look."
  npc_custom_prontera_umbalian_language_hmm_you_sure_about_4e00c6: "Hmm.... are you sure about that?"
  npc_custom_prontera_umbalian_language_hrrmm_okay_cya_then_7e1285: "Hrrmm okay? Cya then.."
  npc_custom_prontera_umbalian_language_i_don_t_think_she_0bc08f: "I don't think she needs to be there, she LIVES here in Prontera."
  npc_custom_prontera_umbalian_language_i_great_wise_man_juno_c42746: "And I, a great wise man of Juno, will teach you their language!"
  npc_custom_prontera_umbalian_language_i_lost_my_teacher_s_7d08cc: "I lost my teacher's book!  What am I going to do..."
  npc_custom_prontera_umbalian_language_i_wonder_where_our_sea_010465: "I wonder where is our sea girl Marie?"
  npc_custom_prontera_umbalian_language_job_agency_i_don_t_46d66f: "Job Agency?  I don't think so.  Don't lead me all around Prontera please! She's already a teacher here."
  npc_custom_prontera_umbalian_language_learned_language_umbalia_4065ea: "^0000FF Learned the language of Umbalians! ^000000"
  npc_custom_prontera_umbalian_language_mojo_should_somewhere_ne_129f47: "Mojo should be somewhere near water..."
  npc_custom_prontera_umbalian_language_o_wow_did_she_become_1126c0: "O wow, did she become an important part of Prontera? I'd think she's too busy for me to visit. I'll try again later."
  npc_custom_prontera_umbalian_language_oh_no_i_lost_my_d9673b: "Oh no!  I lost my teacher's ^FF0000old magic book^000000!"
  npc_custom_prontera_umbalian_language_oh_ok_thanks_anyways_03e74a: "Oh.. Ok.. Thanks anyways."
  npc_custom_prontera_umbalian_language_oh_pooo_sigh_b2c70a: "Oh.. pooo... sigh..."
  npc_custom_prontera_umbalian_language_oh_wait_i_see_he_5a5fbc: "Oh wait, I see... he wants his reference scroll back am I right? Well, I'm kinda still using it buuut... I'll give it back if you can gimme a poring egg and an incubator. Those things are so cute!"
  npc_custom_prontera_umbalian_language_oh_yeah_tell_them_i_1c2641: "Oh yeah, tell them I sent you"
  npc_custom_prontera_umbalian_language_oh_yeah_tell_them_i_3bb3f5: "Oh yeah, tell them I sent you, their names are Marie, Mason and Mojo."
  npc_custom_prontera_umbalian_language_oh_you_found_marie_amats_8323c2: "Oh... You found Marie in Amatsu."
  npc_custom_prontera_umbalian_language_only_thing_she_d_need_132f04: "The only thing she'd need at a Kit shop is medicine for her rheumatism. She's probably long gone from there by now."
  npc_custom_prontera_umbalian_language_oooo_could_you_please_te_96b50c: "Oooo, could you please tell me where she's at? I'd be really appreciative."
  npc_custom_prontera_umbalian_language_so_mason_s_prontera_now_5e21b3: "So... Mason's in Prontera now... Well..."
  npc_custom_prontera_umbalian_language_what_am_i_going_those_2d02cd: "What am I going to do... those dumb Bathory..."
  npc_custom_prontera_umbalian_language_what_he_want_me_c852d5: "What does he want from me?"
  npc_custom_prontera_umbalian_language_what_i_know_they_re_206471: "From what I know, they're in different separate towns making something out of themselves."
  npc_custom_prontera_umbalian_language_where_d_mason_go_then_1e4903: "Where'd Mason go then..."
  npc_custom_prontera_umbalian_language_why_she_need_go_there_46a99d: "Why would she need to go there? I think you might be mistaken."
  npc_custom_prontera_umbalian_language_wow_i_never_knew_she_803a7d: "Wow I never knew she was a religious person... I'll see to it thanks."
  npc_custom_prontera_umbalian_language_yatta_here_s_lil_somethi_023675: "Yatta!  Here's a lil something in return."
  npc_custom_prontera_umbalian_language_yay_i_found_her_thank_7344ff: "Yay, I found her! Thank you very much for you help!"
  npc_custom_prontera_umbalian_language_yay_i_love_porings_64e8d9: "Yay! I love Porings!"
  npc_custom_prontera_umbalian_language_you_saw_mojo_aldebaran_afcd03: "You saw Mojo in Aldebaran?"
  npc_custom_prontera_umbalian_language_you_speak_umbalian_fluen_c33159: "You speak Umbalian fluently! So you will never forget the language of Umbalians!"
  npc_custom_prontera_uneasy_cemetery_alas_we_still_need_more_6623af: "Alas! We still need {0} more bottles of Holy Water...  Why don't you go and ask other people for some extra Holy Water?"
  npc_custom_prontera_uneasy_cemetery_calm_down_restless_cemet_cb74ef: "To calm down the restless cemetery, we should pour all these graves with the Holy Water. But our sisters and brothers have run out of it."
  npc_custom_prontera_uneasy_cemetery_could_you_supply_us_holy_39aaab: "Could you supply us with Holy Water?"
  npc_custom_prontera_uneasy_cemetery_due_s_help_we_ll_7b6655: "But due to {0}'s help we'll manage to rest till the next midnight!"
  npc_custom_prontera_uneasy_cemetery_i_m_afraid_old_cemetery_047cf1: "I'm afraid the old cemetery is going out of control soon... Please, get us all the Holy Water you can get."
  npc_custom_prontera_uneasy_cemetery_i_m_afraid_there_s_4f978f: "I'm afraid there's something wrong with our old cemetery..."
  npc_custom_prontera_uneasy_cemetery_menu_mother_096f28: "[Mother Mathana]: In the name of Odin, please finish these roaming undead leftovers!"
  npc_custom_prontera_uneasy_cemetery_menu_mother_156da2: "[Mother Mathana]: The cemetery has become restless!  In the name of Odin, hurry to the Sanctuary! Save the city of Prontera!"
  npc_custom_prontera_uneasy_cemetery_menu_mother_9d5a07: "[Mother Mathana]: In the name of Odin we declare beautiful {0} as a Prontera savior!"
  npc_custom_prontera_uneasy_cemetery_menu_mother_9d87df: "[Mother Mathana]: Brave {0} has just killed the last undead in Prontera!"
  npc_custom_prontera_uneasy_cemetery_menu_mother_cd97d5: "[Mother Mathana]: Lady {0} has just killed the last undead in Prontera!"
  npc_custom_prontera_uneasy_cemetery_menu_mother_d5f295: "[Mother Mathana]: In the name of Odin we declare handsome {0} as a Prontera savior!"
  npc_custom_prontera_uneasy_cemetery_name_odin_we_bless_you_16de6e: "In the name of Odin we bless you and decently present a modest gift just from Mareusis' wine-cellar."
  npc_custom_prontera_uneasy_cemetery_old_cemetery_going_out_c_70d2cc: "The old cemetery is going out of control soon..."
  npc_custom_prontera_uneasy_cemetery_our_church_going_thank_y_25a4c6: "Our Church is going to thank you personally..."
  npc_custom_prontera_uneasy_cemetery_please_name_odin_help_pr_9b1e80: "Please, in the name of Odin, help Prontera city."
  npc_custom_prontera_uneasy_cemetery_see_they_all_gone_now_691a54: "See, {0}? They all are gone now!"
  npc_custom_prontera_uneasy_cemetery_thank_you_good_we_still_686803: "Thank you, good {0}, but we still need {1} more Holy Water bottles."
  npc_custom_prontera_uneasy_cemetery_thank_you_now_we_ll_0ee0a6: "Thank you, {0}! Now we'll manage to rest till the next midnight!"
  npc_custom_prontera_uneasy_cemetery_thank_you_now_we_ve_c1a88e: "Thank you, {0}! Now we've got enough Holy Water!"
  npc_custom_prontera_uneasy_cemetery_thanks_s_support_we_ve_42e0ac: "But thanks to {0}'s support, we've got {1} easy nights!"
  npc_custom_prontera_uneasy_cemetery_thanks_you_we_ll_able_021e90: "But thanks to you, {0}, we'll be able to sleep {1} nights!"
  npc_custom_prontera_uneasy_cemetery_they_could_return_tomorr_49a3c7: "THEY could return tomorrow's night again!"
  npc_custom_prontera_uneasy_cemetery_upon_pouring_cemetery_wa_f0b42b: "Upon pouring the cemetery with that water we'll get {0} safe nights!"
